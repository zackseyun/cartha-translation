  text: Τί δὲ εἴπωμεν ἐπὶ τῷ μεμαρτυρημένῳ Δαυίδ; πρὸς ὃν εἶπεν ὁ θεός· Εὗρον ἄνδρα κατὰ τὴν καρδίαν μου, Δαυὶδ τὸν τοῦ Ἰεσσαί, ἐν ἐλέει αἰωνίῳ ἔχρισα αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/001.yaml
  text: And what shall we say And what shall we say about David, who has received testimony? To him God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”
translation:
  language: hi
  text: और दाऊद के विषय में हम क्या कहें, जिसके विषय में गवाही दी गई है?[a] उसके विषय में परमेश्वर ने कहा, “मैंने अपने मन के अनुसार एक पुरुष पाया—यिशै के पुत्र दाऊद को; मैंने अनन्त करुणा से उसका अभिषेक किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसके पक्ष में साक्षी दी गई है?”
    reason: μεμαρτυρημένῳ दाऊद के बारे में दी गई अनुकूल साक्षी, उसकी प्रमाणित प्रतिष्ठा, या उसके विषय में शास्त्रीय गवाही का संकेत कर सकता है।
lexical_decisions:
- source_word: μεμαρτυρημένῳ
  choice: जिसकी गवाही दी गई है
  rationale: पूर्ण निष्क्रिय कृदन्त दाऊद के विषय में दी गई साक्षी या प्रमाणित प्रशंसा को व्यक्त करता है; हिन्दी में यह रूप मूल की हल्की अस्पष्टता को बनाए रखता है।
- source_word: κατὰ τὴν καρδίαν μου
  choice: अपने मन के अनुसार
  rationale: यह φυσिक हृदय नहीं, परमेश्वर की इच्छा और अभिप्राय के अनुरूप होने का मुहावरा है; ‘मन के अनुसार’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और अर्थ-संगत है।
- source_word: ἐν ἐλέει αἰωνίῳ
  choice: अनन्त करुणा से
  rationale: ἐν यहाँ साधन या परिवेश का भाव दे सकता है; ‘से’ संक्षिप्त रहते हुए अभिषेक को परमेश्वर की चिरस्थायी करुणा से जोड़ता है।
- source_word: ἔχρισα
  choice: अभिषेक किया
  rationale: राजकीय और धार्मिक अभिषेक के अर्थ तथा मसीही साहित्य में इसके धर्मवैचारिक संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: दाऊद के बारे में μαρτυρέω का आशय
  choice: जिसकी गवाही दी गई है
  alternative: जो प्रमाणित ठहरा है / जिसकी प्रशंसा की गई है
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि यहाँ केवल प्रशंसा, शास्त्रीय साक्ष्य या परमेश्वर की स्वीकृति में से किस पर बल है; चुना हुआ रूप इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
- issue: ἐν ἐλέει αἰωνίῳ का अभिषेक से संबंध
  choice: मैंने अनन्त करुणा से उसका अभिषेक किया
  alternative: मैंने अनन्त करुणा में उसका अभिषेक किया
  rationale: साधनात्मक अर्थ स्वाभाविक है, पर मूल में क्षेत्र/परिवेश का भाव भी संभव है; पदटिप्पणी में विकल्प सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। ‘दाऊद’, ‘यिशै’, ‘परमेश्वर’ और ‘अभिषेक’ जैसे प्रचलित बाइबलीय रूप अपनाए गए हैं; वाक्य को सहज बनाने के लिए उद्धरण में डैश रखा गया है।
