source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλὰ καὶ αὐτὸς λέγει πρὸς τὸν θεόν· Ἐλέησόν με, ὁ θεός, κατὰ τὸ μέγα ἔλεός σου, καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/002.yaml
  text: 'But he himself also says to God:


    Have mercy on me[a], O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawlessness.'
translation:
  language: hi
  text: 'परन्तु वह स्वयं भी परमेश्वर से कहता है:[a]


    हे परमेश्वर, अपनी महान दया के अनुसार मुझ पर दया कर,

    और अपनी करुणाओं की बहुतायत के अनुसार मेरे अधर्म को मिटा दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “परन्तु वह भी परमेश्वर से कहता है: हे परमेश्वर, मुझ पर दया कर…”'
    reason: यह कम बलाघाती वैकल्पिक पाठ καὶ αὐτός को ‘वह भी’ के रूप में प्रस्तुत करता है; मुख्य पाठ αὐτός के ‘स्वयं’ वाले बल को स्पष्ट करता है।
lexical_decisions:
- source_word: καὶ αὐτός
  choice: वह स्वयं भी
  rationale: καί (‘भी’) और बलाघाती αὐτός (‘स्वयं’) दोनों को व्यक्त करता है तथा पिछले प्रसंग में परमेश्वर के दाऊद से कहने और यहाँ दाऊद के परमेश्वर से कहने के पारस्परिक विरोध को बनाए रखता है।
- source_word: ἔλεος
  choice: दया
  rationale: परमेश्वर की कृपालु दया के लिए स्वाभाविक और व्यापक आधुनिक हिन्दी शब्द।
- source_word: οἰκτιρμοί
  choice: करुणाएँ
  rationale: बहुवचन को बनाए रखते हुए ἔλεος से शब्दगत भेद प्रकट करता है; यह गहरी सहानुभूतिपूर्ण करुणा का भाव देता है।
- source_word: ἐξάλειψον
  choice: मिटा दे
  rationale: लेख या अभिलेख को पोंछकर मिटाने की मूल छवि को सरल और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀνόμημα
  choice: अधर्म
  rationale: व्यवस्था-विरोधी दोष या उल्लंघन के अर्थ को व्यक्त करता है और यूनानी एकवचन भाव को बनाए रखता है; केवल किसी विशिष्ट ‘अपराध’ तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: καὶ αὐτός में बलाघात
  choice: वह स्वयं भी
  alternative: वह भी
  rationale: केवल ‘वह भी’ καί को तो व्यक्त करता, पर αὐτός के स्पष्ट बल को कम कर देता; चुना हुआ रूप कथन के पारस्परिक बल को सुरक्षित रखता है।
- issue: ἀνόμημα का स्वरूप
  choice: मेरे अधर्म को
  alternative: मेरे अपराध को
  rationale: ‘अधर्म’ स्रोत के lawlessness/कानून-विरोधी दोष के व्यापक अर्थ और एकवचन को अधिक निकटता से रखता है, जबकि ‘अपराध’ किसी एक कृत्य का अधिक निश्चित बोध करा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक उद्धरण को दो पंक्तियों में रखा गया है। ‘महान दया’ और ‘करुणाओं की बहुतायत’ स्रोत के दो अलग यूनानी पदों तथा दूसरे पद के बहुवचन को बनाए रखते हैं।
