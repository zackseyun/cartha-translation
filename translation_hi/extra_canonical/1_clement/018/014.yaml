  language: en
  yaml_path: translation/extra_canonical/1_clement/018/014.yaml
  text: Deliver me from bloodguilt, O God, the God of my salvation.
translation:
  language: hi
  text: हे परमेश्वर, मुझे रक्तपात के दोष से छुड़ा, हे मेरे उद्धार के परमेश्वर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαί με
  choice: मुझे ... छुड़ा
  rationale: यह प्रार्थनात्मक आज्ञार्थक पद संकट अथवा दोष से मुक्ति की विनती व्यक्त करता है।
- source_word: ἐξ αἱμάτων
  choice: रक्तपात के दोष से
  rationale: बहुवचन ‘रक्तों’ एक सामी प्रयोग है, जो यहाँ बहाए गए रक्त और उससे जुड़े अपराध-दोष की ओर संकेत करता है; शाब्दिक ‘रक्तों से’ आधुनिक हिन्दी में अस्पष्ट होगा।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: सम्बोधन के रूप में स्वाभाविक और गरिमापूर्ण हिन्दी।
- source_word: ὁ θεὸς τῆς σωτηρίας μου
  choice: तू ही मेरा उद्धारकर्ता है
  rationale: यूनानी संबंधवाचक वाक्यांश ‘मेरे उद्धार का परमेश्वर’ का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है, साथ ही उद्धार के स्रोत के रूप में परमेश्वर पर बल रखा गया है।
theological_decisions:
- issue: ἐξ αἱμάτων का आशय
  choice: रक्तपात के दोष से
  alternative: रक्तों से
  rationale: सन्दर्भगत सामी मुहावरा केवल भौतिक रक्त से बचाव नहीं, बल्कि रक्त बहाने से उत्पन्न दोष से छुटकारे की याचना करता है।
- issue: ὁ θεὸς τῆς σωτηρίας μου का रूप
  choice: तू ही मेरा उद्धारकर्ता है
  alternative: मेरे उद्धार के परमेश्वर
  rationale: चुना हुआ रूप आधुनिक हिन्दी में अधिक स्वाभाविक है और परमेश्वर को उद्धार के कर्ता/स्रोत के रूप में व्यक्त करता है; ‘ही’ मूल की पुनरुक्ति से आने वाले बल को संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण शैली; ‘छुड़ा’ मूल के तीव्र निवेदन को बनाए रखता है।
