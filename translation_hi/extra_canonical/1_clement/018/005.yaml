base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/005.yaml
  text: 'For behold[a], in lawless deeds I was conceived,

    and in sins my mother bore me.'
translation:
  language: hi
  text: 'क्योंकि देखो, अधर्मों में मेरा गर्भाधान हुआ,

    और पापों में मेरी माँ ने मुझे गर्भ में धारण किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομίαις
  choice: अधर्मों
  rationale: बहुवचन को बनाए रखते हुए यह व्यवस्था-विरोधी अथवा अनुचित कर्मों का भाव व्यक्त करता है।
- source_word: συνελήμφθην
  choice: मेरा गर्भाधान हुआ
  rationale: यह क्रिया गर्भधारण किए जाने को दर्शाती है; निष्क्रिय रूप को स्वाभाविक हिन्दी में संज्ञात्मक अभिव्यक्ति से रखा गया है।
- source_word: ἁμαρτίαις
  choice: पापों
  rationale: यूनानी बहुवचन और नैतिक-धार्मिक अर्थ दोनों सुरक्षित रहते हैं।
- source_word: ἐκίσσησέν με
  choice: मुझे गर्भ में धारण किया
  rationale: इस दुर्लभ क्रिया का प्रसंगगत अर्थ गर्भवती होने या गर्भ में धारण करने से जुड़ा है। यह चयन पहले चरण के ‘गर्भाधान’ से भेद रखते हुए प्रसव या स्तनपान का अर्थ अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: पाप और गर्भाधान के संबंध का आशय
  choice: ‘अधर्मों में’ और ‘पापों में’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे माता के व्यक्तिगत पाप, जन्मजात पाप-सिद्धांत, या केवल पापमय संसार के स्पष्ट कथन के रूप में खोलना
  rationale: मूल पद इनमें से किसी एक धर्मवैज्ञानिक व्याख्या को स्पष्ट रूप से निर्धारित नहीं करता; उसकी तनावपूर्ण और काव्यात्मक भाषा सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। काव्यात्मक समानांतरता तथा यूनानी पाठ के दोनों बहुवचन बनाए गए हैं।
