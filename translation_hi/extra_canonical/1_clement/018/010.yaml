translation:
  language: hi
  text: 'हे परमेश्वर, मेरे भीतर शुद्ध हृदय रच,


    और मेरे अंतर में स्थिर आत्मा को नया बना।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίαν καθαρὰν
  choice: शुद्ध हृदय
  rationale: मूल के नैतिक और आध्यात्मिक अर्थ को स्वाभाविक, प्रतिष्ठित हिन्दी में सीधे बनाए रखता है।
- source_word: κτίσον
  choice: सृष्टि कर
  rationale: यह सामान्य ‘बना’ की अपेक्षा यूनानी क्रिया के सृजनात्मक बल को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: πνεῦμα εὐθὲς
  choice: सीधी आत्मा
  rationale: εὐθύς का मूल अर्थ ‘सीधा/सही’ है; ‘सीधी आत्मा’ मूल रूपक और उसकी संभावित नैतिक स्थिरता को बिना अतिरिक्त व्याख्या के बनाए रखती है।
- source_word: ἐγκαίνισον
  choice: नया कर
  rationale: क्रिया का अर्थ नवीनीकरण करना है; आधुनिक हिन्दी में ‘नया कर’ संक्षिप्त और सहज है।
- source_word: ἐν τοῖς ἐγκάτοις μου
  choice: मेरे अंतरतम में
  rationale: शाब्दिक ‘मेरे भीतरी अंगों में’ के स्थान पर आंतरिक अस्तित्व की गहराई का मुहावरेदार और गरिमापूर्ण हिन्दी रूप है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: सम्बोधन को स्पष्ट करता है और आधुनिक बाइबलीय हिन्दी में स्वाभाविक गरिमा रखता है।
theological_decisions:
- issue: πνεῦμα का आशय
  choice: आत्मा
  alternative: मन / स्वभाव
  rationale: मूल में यह स्पष्ट नहीं है कि आशय मानवीय आत्मा, अंतःप्रवृत्ति या स्वभाव से है। ‘आत्मा’ इस धार्मिक और काव्यात्मक बहुअर्थता को सुरक्षित रखता है।
- issue: εὐθὲς का नैतिक अर्थ
  choice: सीधी
  alternative: स्थिर / सही
  rationale: ‘सीधी’ मूल रूपक के सबसे निकट है और अर्थ को केवल स्थिरता या शुद्ध नैतिक सहीपन तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, प्रार्थनात्मक और गरिमापूर्ण शैली। समानांतर पंक्ति-विन्यास बनाए रखा गया है; कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
