  yaml_path: translation/extra_canonical/1_clement/018/007.yaml
  text: 'You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.'
translation:
  language: hi
  text: 'तू मुझ पर जूफ़े से छिड़केगा, और मैं शुद्ध हो जाऊँगा;


    तू मुझे धोएगा, और मैं बर्फ़ से भी अधिक उजला हो जाऊँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαντιεῖς
  choice: छिड़काव करेगा
  rationale: भविष्यकालीन क्रिया का अर्थ स्पष्ट रखते हुए धार्मिक शुद्धिकरण के प्रसंग में स्वाभाविक हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: ὑσσώπῳ
  choice: जूफ़े से
  rationale: ὕσσωπος शुद्धिकरण में प्रयुक्त वनस्पति ‘hyssop’ है; हिन्दी बाइबलीय परंपरा में प्रचलित ‘जूफ़ा’ का करण कारक रूप रखा गया है।
- source_word: καθαρισθήσομαι
  choice: मैं शुद्ध हो जाऊँगा
  rationale: कर्मवाच्य भविष्यकाल और शुद्धिकरण के भाव दोनों को सुरक्षित रखता है।
- source_word: πλυνεῖς
  choice: धोएगा
  rationale: क्रिया के सीधे, भौतिक रूपक को बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: ὑπὲρ χιόνα λευκανθήσομαι
  choice: मैं बर्फ़ से भी अधिक उजला हो जाऊँगा
  rationale: ὑπέρ की तुलनात्मक शक्ति तथा λευκανθήσομαι के कर्मवाच्य/परिणामसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शुद्ध करने वाले कर्ता का संबोधन
  choice: दूसरे पुरुष एकवचन ‘तू’
  alternative: आदरार्थी ‘आप’
  rationale: यूनानी क्रियाएँ दूसरे पुरुष एकवचन में हैं और यह परमेश्वर से सीधे प्रार्थनात्मक संबोधन का उद्धरण है; गरिमापूर्ण पारंपरिक हिन्दी में ‘तू’ निकटता और मूल व्याकरण दोनों बनाए रखता है।
- issue: शुद्धिकरण को प्रक्रिया या घोषित स्थिति के रूप में समझना
  choice: ‘शुद्ध हो जाऊँगा’
  alternative: ‘पवित्र ठहरूँगा’
  rationale: καθαρισθήσομαι शुद्ध किए जाने/शुद्ध होने को व्यक्त करता है; ‘पवित्र ठहरूँगा’ अनावश्यक रूप से धार्मिक दर्जे की व्याख्या जोड़ सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट हिन्दी। मूल की दो समानांतर पंक्तियाँ, भविष्यकाल और कर्मवाच्य परिणाम सुरक्षित रखे गए हैं।
