  text: 'I will teach the lawless your ways,

    and the ungodly will turn to you.'
translation:
  language: hi
  text: 'मैं अधर्मियों को तेरे मार्गों की शिक्षा दूँगा,


    और भक्तिहीन लोग तेरी ओर फिरेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόμους
  choice: अधर्मियों
  rationale: यह शब्द उन लोगों को दर्शाता है जो परमेश्वर की व्यवस्था या धर्मसम्मत आचरण के विरुद्ध चलते हैं; ‘अधर्मी’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: τὰς ὁδούς σου
  choice: तेरे मार्ग
  rationale: ‘मार्ग’ मूल के रूपक को बनाए रखता है और परमेश्वर की जीवन-पद्धति तथा इच्छा—दोनों का संकेत दे सकता है।
- source_word: ἀσεβεῖς
  choice: भक्तिहीन लोग
  rationale: ἀσεβής का केंद्र ईश्वर के प्रति श्रद्धा या भक्ति का अभाव है; यह ἀνόμους से अर्थगत भेद भी बनाए रखता है।
- source_word: ἐπιστρέψουσιν ἐπὶ σέ
  choice: तेरी ओर फिरेंगे
  rationale: यह दिशा-परिवर्तन और परमेश्वर की ओर उन्मुख होने का भाव व्यक्त करता है, पर मूल में स्पष्ट न होने के कारण ‘फिर लौटेंगे’ नहीं कहता।
theological_decisions:
- issue: ἐπιστρέφω में वापसी का भाव स्पष्ट करना या न करना
  choice: तेरी ओर फिरेंगे
  alternative: तेरे पास लौट आएँगे
  rationale: यूनानी पद दिशा बदलकर परमेश्वर की ओर होने को व्यक्त करता है, लेकिन यहाँ ‘वापस’ या पूर्व संबंध की पुनर्स्थापना स्पष्ट नहीं है; इसलिए उस अर्थ को जोड़ा नहीं गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; परमेश्वर को संबोधन में काव्यात्मक और निकटवर्ती एकवचन ‘तेरे’ रखा गया है। समानांतर पंक्तियों और मूल के भविष्यकाल को सुरक्षित रखा गया है।
