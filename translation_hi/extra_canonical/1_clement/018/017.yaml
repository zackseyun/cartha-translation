translation:
  language: hi
  text: 'परमेश्वर के लिए बलिदान टूटी हुई आत्मा है;


    टूटे हुए और दीन किए हुए हृदय को परमेश्वर तुच्छ न जानेगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία
  choice: बलिदान
  rationale: यह धार्मिक अर्पण के सामान्य अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πνεῦμα συντετριμμένον
  choice: टूटी हुई आत्मा
  rationale: संतेत्रिम्मेनोन की कुचले या टूटे होने की रूपकात्मक शक्ति को बनाए रखते हुए प्रचलित बाइबलीय हिन्दी देता है।
- source_word: καρδίαν συντετριμμένην καὶ τεταπεινωμένην
  choice: टूटे और दीन किए हुए हृदय को
  rationale: दोनों कृदन्तों को अलग रखा गया है; τεταπεινωμένην का कर्मवाचक रूप भी सुरक्षित है।
- source_word: οὐκ ἐξουδενώσει
  choice: तुच्छ न जानेगा
  rationale: क्रिया का अर्थ किसी को नगण्य या तिरस्करणीय मानना है; हिन्दी में यह भाव सहज और गरिमापूर्ण है।
theological_decisions:
- issue: क्या θυσία को प्रायश्चित्त-संबंधी विशेष बलिदान माना जाए
  choice: सामान्य शब्द ‘बलिदान’
  alternative: ‘प्रायश्चित्त-बलिदान’ या ‘भेंट’
  rationale: यूनानी पाठ केवल θυσία कहता है; किसी विशिष्ट बलिदान-प्रकार को जोड़ना अनुचित होगा।
- issue: τεταπεινωμένην में अवस्था बनाम कर्तृवाचक विनम्रता
  choice: ‘दीन किए हुए’
  alternative: ‘विनम्र’ या ‘दीन’
  rationale: पूर्ण कर्मवाचक कृदन्त उस हृदय की दीन की गई अवस्था को व्यक्त करता है; अनुवाद इस व्याकरणिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक समानांतरता रखी गई है। ‘आत्मा’ और ‘हृदय’ सामान्य बाइबलीय शब्द हैं। अंतिम उद्धरण-चिह्न स्रोत के बड़े उद्धरण के समापन को दर्शाने के लिए रखा गया है।
