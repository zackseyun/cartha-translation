source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/012.yaml
  text: 'Restore to me the joy of your salvation[b][a],

    and uphold me with a willing spirit.'
translation:
  language: hi
  text: 'अपने उद्धार का आनन्द मुझे फिर से दे,

    और मार्गदर्शक आत्मा[a] से मुझे स्थिर रख।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वेच्छुक आत्मा’; शाब्दिक रूप से ‘नेतृत्व करनेवाली’ या ‘शासन करनेवाली आत्मा’।
    reason: ἡγεμονικῷ नेतृत्व, शासन अथवा प्रसंगानुसार तत्पर/स्वेच्छुक होने का भाव दे सकता है; यूनानी वाक्यांश इस अर्थ-सीमा को पूरी तरह निश्चित नहीं करता।
lexical_decisions:
- source_word: ἀγαλλίασιν
  choice: आनन्द
  rationale: यह शब्द प्रबल हर्ष या उल्लास को व्यक्त करता है। सामान्य आधुनिक हिन्दी में ‘आनन्द’ स्वाभाविक और गरिमापूर्ण है तथा उद्धार से जुड़े हर्ष को स्पष्ट रखता है।
- source_word: ἀπόδος
  choice: फिर से दे
  rationale: क्रिया का अर्थ किसी चीज़ को लौटा देना या पुनः प्रदान करना है; ‘फिर से दे’ हिन्दी में पुनर्स्थापन का भाव सहज रूप से व्यक्त करता है।
- source_word: σωτηρίου
  choice: उद्धार
  rationale: यहाँ संज्ञा परमेश्वर द्वारा दिए गए बचाव या मुक्ति को दर्शाती है; ‘उद्धार’ इसका प्रचलित और सटीक धार्मिक हिन्दी रूप है।
- source_word: στήριξόν
  choice: स्थिर रख
  rationale: क्रिया में दृढ़ करने, सहारा देने और टिकाए रखने का भाव है। ‘स्थिर रख’ निरंतर संभाले रखने का आशय व्यक्त करता है और प्रसंग में स्वाभाविक है।
- source_word: πνεύματι ἡγεμονικῷ
  choice: मार्गदर्शक आत्मा से
  rationale: ἡγεμονικός नेतृत्व या मार्गदर्शन करने की क्षमता का संकेत दे सकता है। ‘मार्गदर्शक’ यूनानी अभिव्यक्ति के इस प्रत्यक्ष भाव को रखता है, जबकि पादटिप्पणी में ‘स्वेच्छुक’ की प्रसंगगत सम्भावना सुरक्षित है।
theological_decisions:
- issue: πνεύματι ἡγεμονικῷ में आत्मा की पहचान और गुण
  choice: मार्गदर्शक आत्मा
  alternative: स्वेच्छुक आत्मा; शासन करनेवाली आत्मा
  rationale: यूनानी में यह स्पष्ट नहीं किया गया कि आत्मा मनुष्य की है या परमेश्वर की। अनुवाद में कोई अतिरिक्त संबंधवाचक सर्वनाम न जोड़कर यह अस्पष्टता बनाए रखी गई है। ἡγεμονικός का मूल भाव नेतृत्व/मार्गदर्शन से जुड़ा है, पर भजन की पृष्ठभूमि के कारण ‘स्वेच्छुक’ अर्थ भी सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘मुझे स्थिर रख’ भजन-सदृश समानांतरता को बनाए रखता है। आत्मा के स्वामी या स्रोत को स्पष्ट करने के लिए ‘मेरी’ अथवा ‘अपनी’ नहीं जोड़ा गया, क्योंकि यूनानी पाठ ऐसा निर्दिष्ट नहीं करता।
