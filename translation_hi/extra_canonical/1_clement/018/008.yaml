translation:
  language: hi
  text: 'तू मुझे उल्लास और आनंद सुनाएगा;

    जिन हड्डियों को दीन किया गया है, वे हर्षित होंगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκουτιεῖς με
  choice: तू मुझे ... सुनाएगा
  rationale: यह भविष्यकालीन क्रिया शाब्दिक रूप से किसी को सुनाने या सुनने योग्य बनाने का भाव देती है; हिन्दी में सरल और स्वाभाविक रूप रखा गया है।
- source_word: ἀγαλλίασιν καὶ εὐφροσύνην
  choice: उल्लास और आनन्द
  rationale: दोनों निकटार्थी संज्ञाओं की अलग पहचान बनाए रखते हुए उनके तीव्र हर्ष और प्रसन्नता के भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὀστᾶ τεταπεινωμένα
  choice: जो हड्डियाँ दीन की गई हैं
  rationale: τεταπεινωμένα के पूर्ण निष्क्रिय भाव को बनाए रखा गया है। 'कुचली हुई' जैसे भजन के अन्य पाठ-रूपों से शब्दावली आयात नहीं की गई।
- source_word: ἀγαλλιάσονται
  choice: हर्षित होंगी
  rationale: भविष्यकाल और प्रबल आनन्द के भाव को सहज हिन्दी में व्यक्त करता है तथा पहले पद के 'उल्लास' से अनावश्यक पुनरुक्ति से बचाता है।
theological_decisions:
- issue: τεταπεινωμένα का अर्थ
  choice: दीन की गई हैं
  alternative: कुचली गई हैं / नम्र की गई हैं
  rationale: प्राप्त यूनानी पाठ में ταπεινόω है, जिसका मूल अर्थ नीचा या दीन करना है। अनुवाद इसी पाठ की असुविधाजनक किन्तु वास्तविक छवि को सुरक्षित रखता है और किसी अधिक परिचित भजन-पाठ के अनुसार इसे चुपचाप नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किन्तु सामान्य पाठक के लिए सुबोध रूप। परमेश्वर को संबोधन मानते हुए एकवचन निकट संबोधन 'तू' रखा गया है।
