  yaml_path: translation/extra_canonical/1_clement/018/011.yaml
  text: 'Do not cast me away from your presence,

    and do not take your Holy Spirit from me.'
translation:
  language: hi
  text: 'मुझे अपनी उपस्थिति से दूर न कर,


    और अपने पवित्र आत्मा को मुझसे न ले।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπορίψῃς με
  choice: मुझे…दूर न फेंक
  rationale: ἀπορίπτω का अर्थ दूर फेंकना या ठुकराकर हटा देना है; यह प्रार्थना की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: अपने सामने से
  rationale: शाब्दिक अर्थ ‘अपने मुख की ओर से’ है, पर प्रसंग में इसका अर्थ परमेश्वर की उपस्थिति के सामने से है; ‘अपने सामने से’ मूल रूपक और सहज हिन्दी दोनों को सुरक्षित रखता है।
- source_word: τὸ πνεῦμα τὸ ἅγιόν σου
  choice: अपना पवित्र आत्मा
  rationale: यह परमेश्वर के पवित्र आत्मा का सीधा उल्लेख है; हिन्दी बाइबलीय प्रयोग के अनुरूप ‘पवित्र आत्मा’ रखा गया है।
- source_word: μὴ ἀντανέλῃς ἀπʼ ἐμοῦ
  choice: मुझसे न ले
  rationale: क्रिया का आशय किसी व्यक्ति से हटा लेने या ले लेने का है। ‘वापस’ नहीं जोड़ा गया, क्योंकि यूनानी पाठ पुनः ग्रहण करने की धारणा स्पष्ट नहीं करता।
theological_decisions:
- issue: पवित्र आत्मा को ‘लेने’ की प्रार्थना का धर्मवैज्ञानिक आशय
  choice: मूल कथन को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘अपना पवित्र आत्मा मुझसे दूर न कर’
  rationale: पाठ आत्मा की उपस्थिति खोने की आशंका व्यक्त करता है; अनुवाद ने यह तय नहीं किया कि इसका व्यवस्थित धर्मविज्ञान में स्थायी निवास, अभिषेक या राजकीय सेवा से क्या संबंध है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। एकवचन आत्मीय संबोधन के अनुरूप ‘अपने/अपना’ और निषेधात्मक आज्ञार्थ ‘न फेंक/न ले’ प्रयुक्त हैं।
