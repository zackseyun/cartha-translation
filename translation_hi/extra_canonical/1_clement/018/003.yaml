id: 1CLEM.18.3
reference: 1 Clement 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με· ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μου ἐστιν διαπαντός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/003.yaml
  text: 'Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.'
translation:
  language: hi
  text: 'मेरे अधर्म से मुझे और भी अधिक धो,

    और मेरे पाप से मुझे शुद्ध कर।

    क्योंकि मैं अपना अधर्म जानता हूँ,

    और मेरा पाप निरंतर मेरे सामने रहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον πλῦνόν με
  choice: मुझे और भी अधिक धो
  rationale: ἐπὶ πλεῖον की वृद्धि-सूचक शक्ति को स्वाभाविक हिन्दी में रखते हुए πλῦνον की धुलाई वाली ठोस छवि सुरक्षित रखी गई है।
- source_word: ἀνομίας
  choice: अधर्म
  rationale: ἀνομία यहाँ परमेश्वर की व्यवस्था और धार्मिक मानक के उल्लंघन को सूचित करता है; ‘अधर्म’ गरिमापूर्ण और प्रचलित बाइबिलीय हिन्दी है।
- source_word: καθάρισόν με
  choice: मुझे शुद्ध कर
  rationale: क्रिया का अर्थ पाप से निर्मल किए जाने का है; ‘शुद्ध कर’ धार्मिक आशय और सरलता दोनों बनाए रखता है।
- source_word: διαπαντός
  choice: निरंतर
  rationale: यह समय की सततता व्यक्त करता है; ‘निरंतर’ संक्षिप्त और आधुनिक मानक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ἀνομία और ἁμαρτία के बीच भेद
  choice: क्रमशः ‘अधर्म’ और ‘पाप’
  alternative: दोनों के लिए ‘पाप’
  rationale: मूल यूनानी दो अलग शब्द रखता है; हिन्दी में भी भेद बनाए रखने से समानांतरता और अर्थगत तनाव सुरक्षित रहता है।
- issue: धोने और शुद्ध करने की रूपकात्मक भाषा
  choice: दोनों अलग क्रियाएँ यथावत रखी गईं
  alternative: दोनों को सामान्यतः ‘क्षमा कर’ कहना
  rationale: मूल पाठ क्षमा का सारांश नहीं देता, बल्कि धुलाई और शुद्धि की ठोस छवियाँ प्रस्तुत करता है; उन्हें धर्मशास्त्रीय व्याख्या से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला पाठ। आज्ञार्थक एकवचन रूप मूल की सीधी प्रार्थना को बनाए रखते हैं।
