  text: 'मेरे पापों से अपना मुख फेर ले,


    और मेरे सारे अधर्मों को मिटा दे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστρεψον τὸ πρόσωπόν σου
  choice: अपना मुख फेर ले
  rationale: यूनानी वाक्यांश का सीधा और स्वाभाविक काव्यात्मक रूप; ‘मुख’ प्रार्थनात्मक गरिमा बनाए रखता है।
- source_word: ἁμαρτιῶν
  choice: पापों
  rationale: ‘पाप’ इस सामान्य धार्मिक शब्द का स्पष्ट और प्रचलित हिन्दी समतुल्य है।
- source_word: ἀνομίας
  choice: अधर्म
  rationale: यह ἀνομία के नियम-विरोध और नैतिक अन्याय, दोनों संकेतों को समेटता है तथा ‘पापों’ से शब्दगत भेद बनाए रखता है।
- source_word: ἐξάλειψον
  choice: मिटा दे
  rationale: क्रिया में अभिलेख को पोंछकर समाप्त करने का रूपक है; ‘मिटा दे’ हिन्दी में उसे सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ἁμαρτία और ἀνομία के बीच भेद
  choice: ‘पापों’ और ‘अधर्म’ के रूप में अलग शब्द रखे गए
  alternative: दोनों को ‘पाप’ कहना
  rationale: स्रोत में प्रयुक्त दो अलग नैतिक शब्दों को एक में मिलाए बिना समानांतरता और अर्थ-तनाव सुरक्षित रहता है।
