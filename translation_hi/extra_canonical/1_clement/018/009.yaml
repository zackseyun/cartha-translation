  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रार्थनात्मक-काव्य शैली। ईश्वर को संबोधन में निकट और पारंपरिक एकवचन आज्ञार्थक रूप ‘फेर ले/मिटा दे’ रखा गया है।
