  yaml_path: translation/extra_canonical/1_clement/018/016.yaml
  text: 'For if you had desired sacrifice, I would have given it;

    in whole burnt offerings you will not delight.'
translation:
  language: hi
  text: 'क्योंकि यदि तूने बलिदान चाहा होता, तो मैं उसे चढ़ा देता;

    होमबलियों से तू प्रसन्न न होगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν
  choice: बलिदान
  rationale: यह सामान्य धार्मिक अर्पण के अर्थ को स्वाभाविक और परंपरागत हिन्दी में व्यक्त करता है।
- source_word: ἔδωκα ἄν
  choice: मैं चढ़ाता
  rationale: बलिदान के संदर्भ में शाब्दिक ‘देता’ की अपेक्षा ‘चढ़ाता’ अधिक स्वाभाविक है और संभाव्य भाव को बनाए रखता है।
- source_word: ὁλοκαυτώματα
  choice: होमबलियाँ
  rationale: यह ऐसी बलियों के लिए प्रचलित हिन्दी धार्मिक पद है जो पूरी तरह जलाई जाती थीं।
- source_word: οὐκ εὐδοκήσεις
  choice: तू प्रसन्न न होगा
  rationale: भविष्यकाल को सुरक्षित रखते हुए εὐδοκέω के प्रसन्नता/स्वीकृति के भाव को स्पष्ट करता है।
theological_decisions:
- issue: बलिदान और होमबलि के प्रति ईश्वर की प्रतिक्रिया
  choice: पाठ के निषेध को बिना व्याख्यात्मक विस्तार के रखा गया है
  alternative: ‘तू उन्हें स्वीकार न करेगा’
  rationale: εὐδοκέω मुख्यतः प्रसन्न होने या अनुकूल मानने का भाव देता है; ‘प्रसन्न न होगा’ मूल की धार्मिक तनावपूर्ण अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; भजन-सदृश प्रत्यक्ष संबोधन के कारण एकवचन ‘तू’ रखा गया है। समानांतर पंक्तियों और विरामचिह्नों से काव्यात्मक संरचना सुरक्षित की गई है।
