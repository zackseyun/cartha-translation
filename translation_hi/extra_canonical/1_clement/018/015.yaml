base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/015.yaml
  text: 'My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.'
translation:
  language: hi
  text: 'मेरी जीभ तेरी धार्मिकता के कारण आनन्दित होगी।


    हे प्रभु, तू मेरा मुँह खोलेगा,


    और मेरे होंठ तेरी स्तुति की घोषणा करेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: आनन्दित होगी
  rationale: यह क्रिया उल्लासपूर्ण आनन्द व्यक्त करती है; भविष्यकाल को भी बनाए रखा गया है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ परमेश्वर की धार्मिकता/न्यायपूर्णता का व्यापक धार्मिक अर्थ है; इसलिए परिचित और अर्थ-संपन्न शब्द चुना गया।
- source_word: ἀναγγελεῖ
  choice: बखान करेंगे
  rationale: क्रिया का अर्थ घोषित करना या सुनाना है; होंठों द्वारा स्तुति प्रकट करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αἴνεσίν
  choice: स्तुति
  rationale: प्रशंसा और आराधनापूर्ण गुणगान के अर्थ को सीधे व्यक्त करता है।
