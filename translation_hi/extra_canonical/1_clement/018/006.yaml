  yaml_path: translation/extra_canonical/1_clement/018/006.yaml
  text: 'For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.'
translation:
  language: hi
  text: 'क्योंकि, देखो, तूने सत्य से प्रेम किया;

    तेरी बुद्धि की गूढ़ और गुप्त बातें तूने मुझे प्रकट कीं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: क्योंकि देख
  rationale: γὰρ के कारणसूचक संबंध और ἰδού के ध्यान आकर्षित करने वाले बल, दोनों को बनाए रखता है।
- source_word: ἀλήθειαν ἠγάπησας
  choice: तूने सत्य से प्रेम किया
  rationale: यूनानी क्रिया और कर्म का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: τὰ ἄδηλα
  choice: अनजानी बातें
  rationale: ἄδηλος का अर्थ ऐसी बातें हैं जो प्रकट या ज्ञात नहीं हैं; यहाँ सहज हिन्दी में ‘अनजानी’ उपयुक्त है।
- source_word: τὰ κρύφια
  choice: गुप्त बातें
  rationale: κρύφια के छिपे या गुप्त होने के भाव को स्पष्ट रखता है और ἄδηλα से आंशिक भेद बनाए रखता है।
- source_word: τῆς σοφίας σου
  choice: अपनी बुद्धि की
  rationale: सम्बन्धवाचक यूनानी पदबंध को सीधे रूप में प्रस्तुत करता है; ‘अपनी’ का संदर्भ सम्बोधित परमेश्वर से है।
- source_word: ἐδήλωσάς μοι
  choice: मुझ पर प्रकट कीं
  rationale: δηλόω के ‘प्रकट/ज्ञात करना’ अर्थ और μοι के प्राप्तकर्ता भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सम्बोधन में वचन और आदर-स्तर
  choice: ‘तू’
  alternative: ‘आप’
  rationale: मूल यूनानी में एकवचन सम्बोधन है और उद्धृत भजन की प्रत्यक्ष, निकट प्रार्थना-शैली को ‘तू’ सुरक्षित रखता है; इसका उद्देश्य अनादर नहीं है।
- issue: ‘तेरी बुद्धि’ से जुड़े रहस्यों का स्वरूप
  choice: ‘अपनी बुद्धि की अनजानी और गुप्त बातें’
  alternative: ‘अपनी बुद्धि के रहस्य’
  rationale: दो समानांतर यूनानी विशेषणों को एक सामान्य धार्मिक पद ‘रहस्य’ में समेटने के बजाय उनकी पुनरुक्ति और सूक्ष्म भिन्नता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। अर्धविराम मूल के दो समानांतर खंडों को जोड़ता है। कोई पादटिप्पणी आवश्यक नहीं।
