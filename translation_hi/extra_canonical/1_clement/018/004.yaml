id: 1CLEM.18.4
reference: 1 Clement 18:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/004.yaml
  text: 'Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged[a].'
translation:
  language: hi
  text: 'केवल तेरे ही विरुद्ध मैंने पाप किया,

    और जो तेरी दृष्टि में बुरा है, वही किया,

    ताकि तू अपनी बातों में सही ठहरे

    और जब तेरा न्याय किया जाए, तब तू विजयी हो[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और जब तू न्याय करे, तब तू विजयी हो।” यूनानी रूप का अर्थ “जब तू न्याय-विवाद में उतरे” भी हो सकता है।
    reason: κρίνεσθαι रूपतः मध्यवाच्य या कर्मवाच्य हो सकता है; साथ ही उद्धृत भजन के इब्रानी पाठ में सक्रिय अर्थ ‘जब तू न्याय करे’ है।
lexical_decisions:
- source_word: σοὶ μόνῳ
  choice: केवल तेरे ही विरुद्ध
  rationale: सम्प्रदान कारक यहाँ पाप के लक्ष्य को व्यक्त करता है; ‘ही’ μόνῳ के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ πονηρὸν ἐνώπιόν σου
  choice: जो तेरी दृष्टि में बुरा है
  rationale: ἐνώπιόν σου का शाब्दिक स्थान-बोध रखते हुए इसका नैतिक अर्थ सहज हिन्दी में व्यक्त किया गया है।
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  choice: तू अपनी बातों में सही ठहरे
  rationale: δικαιόω के न्यायिक अर्थ को ‘सही ठहरे’ व्यक्त करता है और ‘धर्मी’ शब्द से उत्पन्न हो सकने वाले केवल चरित्र-संबंधी अर्थ तक वाक्य को सीमित नहीं करता।
- source_word: νικήσῃς
  choice: तू विजयी हो
  rationale: क्रिया का अर्थ जीतना या प्रबल सिद्ध होना है; ‘विजयी हो’ न्यायिक प्रसंग और काव्यात्मक समानांतरता दोनों में स्वाभाविक है।
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: जब तेरा न्याय किया जाए
  rationale: मध्य/कर्मवाच्य रूप की सतही कर्मवाच्य सम्भावना को मुख्य पाठ में रखा गया है; इसकी मध्यवाच्य व्याख्या पादटिप्पणी में दी गई है।
theological_decisions:
- issue: κρίνεσθαι में परमेश्वर न्याय करने वाला है या न्याय के अधीन
  choice: मुख्य पाठ में ‘जब तेरा न्याय किया जाए’
  alternative: ‘जब तू न्याय करे’ अथवा ‘जब तू न्याय-विवाद में उतरे’
  rationale: यूनानी रूप मध्यवाच्य और कर्मवाच्य दोनों हो सकता है। यूनानी पाठ की प्रचलित ग्रहण-परम्परा कर्मवाच्य अर्थ का समर्थन करती है, जबकि भजन 51:4 का इब्रानी आधार सक्रिय अर्थ ‘जब तू न्याय करे’ की ओर संकेत करता है। अस्पष्टता को चुपचाप समाप्त करने के बजाय वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भजन-सदृश पंक्ति-विन्यास रखा गया है। भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है; एकवचन निकट संबोधन के कारण ‘तू/तेरे’ का प्रयोग मूल के अनुरूप है।
