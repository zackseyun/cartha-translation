  verdict: approve
  source_fidelity: The Hindi rendering closely follows the Greek. σοὶ μόνῳ is appropriately conveyed as “केवल तेरे ही विरुद्ध”; τὸ πονηρὸν ἐνώπιόν σου as what is evil in God’s sight; and δικαιωθῇς/νικήσῃς retain the juridical-poetic sequence of being shown right and prevailing. The main rendering “जब तेरा न्याय किया जाए” is a viable passive reading of ἐν τῷ κρίνεσθαί σε and agrees with the current English POB audit text. The footnote responsibly preserves the grammatically possible middle/active-oriented interpretation and notes the Hebrew background without forcing one resolution.
  naturalness: The phrasing is clear, dignified, and suitably psalm-like in modern standard Hindi. “तू/तेरे” coherently reflects direct singular address in elevated devotional diction. The parallel line structure is natural and readable.
  terminology: “पाप,” “तेरी दृष्टि में बुरा,” “सही ठहरे,” and “विजयी हो” are accurate and accessible. “सही ठहरे” adequately communicates the forensic sense of δικαιωθῇς without importing a narrower doctrinal formulation. The footnote’s terminology accurately identifies the middle/passive ambiguity.
