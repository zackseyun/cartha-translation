source:
  edition: Funk 1901 (normalized OCR)
  text: τί δοκεῖτε, ἀγαπητοί; οὐ προῄδει Μωϋσῆς τοῦτο μέλλειν ἔσεσθαι; μάλιστα ᾔδει· ἀλλ' ἵνα μὴ ἀκαταστασία γένηται ἐν τῷ Ἰσραήλ, οὕτως ἐποίησεν, εἰς τὸ δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/006.yaml
  text: What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever. Amen.
translation:
  language: hi
  text: प्रिय जनो, तुम क्या सोचते हो? क्या मूसा पहले से नहीं जानते थे कि ऐसा होने वाला है? निश्चय ही वे जानते थे। परन्तु उन्होंने ऐसा इसलिए किया कि इस्राएल में अव्यवस्था न हो, ताकि सच्चे तथा एकमात्र परमेश्वर के नाम की महिमा हो। उसी की महिमा युगानुयुग होती रहे। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: प्रिय जनो
  rationale: संबोधन की आत्मीयता और बहुवचन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀκαταστασία
  choice: अव्यवस्था
  rationale: यहाँ सामुदायिक अस्थिरता या उपद्रव के व्यापक अर्थ को बनाए रखता है, बिना उसे केवल विद्रोह तक सीमित किए।
- source_word: δοξασθῆναι
  choice: महिमा हो
  rationale: दिव्य नाम के गौरवान्वित होने का पारंपरिक, स्पष्ट और सहज हिन्दी रूप है।
- source_word: τοῦ ἀληθινοῦ καὶ μόνου θεοῦ
  choice: सच्चे तथा एकमात्र परमेश्वर
  rationale: दोनों विशेषणों—ἀληθινοῦ और μόνου—को अलग-अलग सुरक्षित रखता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: अनन्तकालीन स्तुति के यूनानी मुहावरे का संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी समतुल्य है।
theological_decisions:
- issue: मूसा के पूर्वज्ञान का स्वरूप
  choice: पहले से नहीं जानते थे
  alternative: भविष्यवाणी द्वारा नहीं जानते थे
  rationale: προῄδει केवल पहले से जानने को कहता है; ज्ञान के साधन को पाठ निर्दिष्ट नहीं करता।
- issue: अंतिम स्तुतिवाक्य का भाव
  choice: उसी की महिमा युगानुयुग होती रहे
  alternative: जिसकी महिमा युगानुयुग है
  rationale: यूनानी ᾧ ἡ δόξα में क्रिया लुप्त है; हिन्दी में आशीर्वचनात्मक भाव स्वाभाविक है, जबकि वैकल्पिक कथनात्मक अर्थ भी व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। मूल के प्रश्नोत्तर, उद्देश्य-संबंध और समापन स्तुति को स्पष्ट रखा गया है।
