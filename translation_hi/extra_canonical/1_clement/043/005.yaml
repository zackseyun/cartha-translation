source:
  edition: Funk 1901 (normalized OCR)
  text: πρωΐας δὲ γενομένης συνεκάλεσεν πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν, καὶ ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας, καὶ ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους· καὶ εὑρέθη ἡ ῥάβδος Ἀαρὼν οὐ μόνον βεβλαστηκυῖα, ἀλλὰ καὶ καρπὸν ἔχουσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/005.yaml
  text: Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit.
translation:
  language: hi
  text: फिर जब सुबह हुई, तो उसने समस्त इस्राएल—छह लाख पुरुषों—को इकट्ठा किया और गोत्रों के प्रधानों को मुहरें दिखाईं। तब उसने गवाही का तंबू खोला और छड़ियाँ बाहर निकालीं। और हारून की छड़ी न केवल अंकुरित पाई गई, बल्कि उस पर फल भी लगा हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωΐας δὲ γενομένης
  choice: फिर जब सुबह हुई
  rationale: यूनानी काल-सूचक वाक्यांश और δέ के कथात्मक संक्रमण को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν
  choice: समस्त इस्राएल—छः लाख पुरुषों—को
  rationale: मूल में दूसरा पद पहले पद की व्याख्या करता है; डैश इस समानाधिकरण को स्पष्ट करता है, बिना दोनों को अलग समूह बनाए।
- source_word: τοῖς φυλάρχοις
  choice: गोत्रों के प्रधानों को
  rationale: φυλάρχης का अर्थ गोत्र अथवा जनजातीय इकाई का अगुआ है; यह अभिव्यक्ति सामान्य हिन्दी पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: τὰς σφραγῖδας
  choice: मुहरें
  rationale: शाब्दिक अर्थ सुरक्षित रखा गया है; प्रसंग में ये उन बंद व्यवस्थाओं की प्रामाणिक मुहरें हैं जिनका उल्लेख पूर्ववर्ती वर्णन में है।
- source_word: τὴν σκηνὴν τοῦ μαρτυρίου
  choice: साक्षी का तंबू
  rationale: यह σκηνή और μαρτύριον दोनों को निकटता से दर्शाता है तथा 'मिलापवाला तंबू' जैसी पारंपरिक व्याख्यात्मक शब्दावली थोपने से बचता है।
- source_word: τὰς ῥάβδους
  choice: छड़ियाँ
  rationale: ῥάβδος यहाँ प्रत्येक गोत्र के प्रतिनिधि दंड/छड़ी को सूचित करता है; सरल 'छड़ी' प्रसंग में स्वाभाविक है।
- source_word: βεβλαστηκυῖα
  choice: अंकुरित
  rationale: पूर्ण कृदंत का परिणामकारी भाव रखा गया है—छड़ी अंकुर निकाल चुकी थी और उसी अवस्था में पाई गई।
- source_word: καρπὸν ἔχουσα
  choice: उस पर फल भी लगा हुआ था
  rationale: वर्तमान कृदंत के सतत दृश्य भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: σκηνὴ τοῦ μαρτυρίου की व्याख्या
  choice: साक्षी का तंबू
  alternative: मिलापवाला तंबू / गवाही का तंबू
  rationale: मूल यूनानी पद का सीधा संबंध 'साक्षी/गवाही' से है। 'मिलापवाला' एक परंपरागत किन्तु अधिक व्याख्यात्मक रूप है; 'साक्षी का तंबू' मूल की शब्द-संरचना और धार्मिक तनाव को सुरक्षित रखता है।
- issue: हारून की छड़ी पर फल की अवस्था
  choice: फल भी लगा हुआ था
  alternative: फल भी उत्पन्न हुआ था
  rationale: मूल ἔχουσα केवल फल धारण करने की अवस्था बताता है; फल बनने की प्रक्रिया या उसका प्रकार निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। वाक्य-रचना को सुबोध बनाने के लिए लंबे यूनानी वाक्य को तीन हिन्दी वाक्यों में बाँटा गया है, जबकि घटनाक्रम और बलाघात सुरक्षित हैं।
