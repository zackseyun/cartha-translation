source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκεῖνος γάρ, ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης καὶ στασιαζουσῶν τῶν φυλῶν, ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη, ἐκέλευσεν τοὺς δώδεκα φυλάρχους προσενεγκεῖν αὐτῷ ῥάβδους ἐπιγεγραμμένας ἑκάστης φυλῆς κατ' ὄνομα· καὶ λαβὼν αὐτὰς ἔδησεν καὶ ἐσφράγισεν τοῖς δακτυλίοις τῶν φυλάρχων, καὶ ἀπέθετο αὐτὰς εἰς τὴν σκηνὴν τοῦ μαρτυρίου ἐπὶ τὴν τράπεζαν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/003.yaml
  text: For when jealousy arose concerning the priesthood and the tribes were engaged in factional strife over which of them was adorned with the glorious name[a], he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God.
translation:
  language: hi
  text: क्योंकि जब याजकपद को लेकर ईर्ष्या उत्पन्न हुई और गोत्र इस बात पर गुटीय संघर्ष कर रहे थे कि उनमें से कौन-सा महिमामय नाम से सुशोभित हो,[a] तब उसने बारहों गोत्र-प्रधानों को आज्ञा दी कि वे उसके पास छड़ियाँ लाएँ, हर एक पर उसके गोत्र के नाम के अनुसार नाम अंकित हो। उन्हें लेकर उसने उन्हें बाँधा और गोत्र-प्रधानों की मुहर वाली अँगूठियों से उन पर मुहर लगाई, और उन्हें साक्ष्य के तंबू में परमेश्वर की मेज़ पर रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “...गोत्र आपस में गुटों में बँटकर संघर्ष कर रहे थे कि उनमें से कौन-सा महिमामय नाम से सुशोभित हो।”
    reason: στασιαζουσῶν के सक्रिय गुटीय/नागरिक संघर्ष के भाव को वैकल्पिक रूप में दिखाता है, बिना मूल से अधिक निश्चित ‘विद्रोह’ आरोपित किए।
lexical_decisions:
- source_word: ζήλου
  choice: ईर्ष्या
  rationale: यहाँ याजकपद को लेकर उत्पन्न प्रतिस्पर्धी जलन या डाह का भाव है; ‘ईर्ष्या’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἱερωσύνης
  choice: याजकपद
  rationale: संदर्भ किसी सामान्य धार्मिक सेवा का नहीं, याजकीय पद और अधिकार का है।
- source_word: στασιαζουσῶν
  choice: गुटबाज़ी करके झगड़ने लगे
  rationale: क्रिया सक्रिय दलगत संघर्ष का बोध कराती है; यह रूप केवल मतभेद नहीं, गुटों में बँटकर संघर्ष करने का नागरिक-राजनीतिक रंग भी बनाए रखता है।
- source_word: τῷ ἐνδόξῳ ὀνόματι
  choice: महिमामय नाम
  rationale: यूनानी अभिव्यक्ति को जानबूझकर स्पष्टतर पदवी में नहीं बदला गया, ताकि मूल का संदर्भगत तनाव और अस्पष्टता बनी रहे।
- source_word: φυλάρχους
  choice: गोत्र-प्रधानों
  rationale: यह बारह गोत्रों के अगुओं को दर्शाता है; ‘गोत्र-प्रधान’ संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
- source_word: ῥάβδους
  choice: छड़ियाँ
  rationale: गिनती 17 की कथा में अगुओं द्वारा दी गई दंडाकार लकड़ियों के लिए सहज हिन्दी; ‘लाठियाँ’ अनावश्यक रूप से हथियार का संकेत दे सकती है।
- source_word: τοῖς δακτυλίοις
  choice: मुहर-अँगूठियों
  rationale: ये साधारण अँगूठियाँ नहीं बल्कि मुहर लगाने वाली अंगूठियाँ थीं; संयुक्त पद कार्य को स्पष्ट करता है।
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: साक्ष्य का तंबू
  rationale: यह औपचारिक निकट अनुवाद है और ‘μαρτύριον’ को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: τὴν τράπεζαν τοῦ θεοῦ
  choice: परमेश्वर की मेज़
  rationale: मूल के प्रत्यक्ष शब्द-विन्यास को रखा गया है; इसे किसी विशिष्ट पवित्र वस्तु के नाम से बदलना पाठ से अधिक स्पष्टता जोड़ता।
theological_decisions:
- issue: कौन ‘महिमामय नाम’ से सुशोभित था
  choice: वाक्य की मूल अस्पष्टता बनाए रखी गई
  alternative: इसे स्पष्ट रूप से ‘याजकपद का गौरवशाली नाम/पद किस गोत्र को मिला था’ कहना
  rationale: मूल में ὄνομα रूपकात्मक और कुछ हद तक अस्पष्ट है; अनुवाद को किसी एक धर्मवैज्ञानिक व्याख्या पर निर्णायक नहीं होना चाहिए।
- issue: ἐκεῖνος का संदर्भ
  choice: ‘उसने’
  alternative: ‘मूसा ने’
  rationale: इस पद के यूनानी पाठ में नाम नहीं दोहराया गया; निकट संदर्भ पर निर्भर सर्वनाम को बनाए रखना स्रोत-संगत है।
- issue: तंबू और मेज़ की पहचान
  choice: ‘साक्ष्य का तंबू’ और ‘परमेश्वर की मेज़’
  alternative: ‘मिलापवाला तंबू’ और किसी विशिष्ट वेदी या पवित्र मेज़ का नाम
  rationale: मूल शब्दों को किसी स्थापित परंपरागत शब्दावली या वस्तु-विशेष से अनावश्यक रूप से नहीं बाँधा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु साधारण पाठक के लिए सुबोध रखी गई है। कथन का बाइबिलीय परिवेश बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
