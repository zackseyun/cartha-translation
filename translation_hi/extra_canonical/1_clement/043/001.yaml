source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ τί θαυμαστόν, εἰ οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ ἔργον τοιοῦτο κατέστησαν τοὺς προειρημένους;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/001.yaml
  text: And what is remarkable if those entrusted in Messiah by God with such a work appointed the aforementioned persons?
translation:
  language: hi
  text: और इसमें आश्चर्य ही क्या है कि जिन्हें परमेश्वर ने मसीह में ऐसा कार्य सौंपा था, उन्होंने पहले बताए गए लोगों को नियुक्त किया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें परमेश्वर ने मसीह में दायित्व सौंपा था, उन्होंने पहले बताए गए लोगों को ऐसे कार्य के लिए नियुक्त किया?”
    reason: वाक्य में ‘ऐसा कार्य’ को मुख्य क्रिया ‘नियुक्त किया’ से जोड़ने वाला वैकल्पिक पाठ-संबंध दर्ज करने के लिए; मुख्य अनुवाद में इसे ‘सौंपा था’ से जोड़ना व्याकरण की दृष्टि से अधिक स्वाभाविक है।
lexical_decisions:
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: ग्रीक के संबंधपरक/क्षेत्रसूचक वाक्यांश को यथासंभव खुला रखते हुए उसका सीधा और स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: πιστευθέντες παρὰ θεοῦ
  choice: जिन्हें परमेश्वर ने … सौंपा था
  rationale: πιστεύω के कर्मवाच्य प्रयोग का यहाँ अर्थ किसी दायित्व को भरोसे के साथ सौंपा जाना है; παρὰ θεοῦ कार्य करने वाले को दर्शाता है।
- source_word: ἔργον τοιοῦτο
  choice: ऐसा कार्य
  rationale: ἔργον का सामान्य और प्रसंगानुकूल अर्थ ‘कार्य’ है; τοιοῦτο पूर्ववर्ती वर्णन की ओर संकेत करता है।
- source_word: κατέστησαν
  choice: नियुक्त किया
  rationale: यहाँ क्रिया लोगों को उत्तरदायित्वपूर्ण पद पर ठहराने या नियुक्त करने को व्यक्त करती है।
- source_word: τοὺς προειρημένους
  choice: पहले बताए गए लोगों को
  rationale: शाब्दिक अर्थ ‘पूर्वोक्त लोगों’ का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: ἔργον τοιοῦτο का πιστευθέντες अथवा κατέστησαν से संबंध
  choice: इसे πιστευθέντες से जोड़कर ‘जिन्हें … ऐसा कार्य सौंपा था’ किया गया है।
  alternative: इसे κατέστησαν से जोड़कर ‘पहले बताए गए लोगों को ऐसे कार्य के लिए नियुक्त किया’ समझना।
  rationale: ἔργον τοιοῦτο का कर्मकारक रूप πιστευθέντες के साथ प्रयुक्त πιστεύω के ‘कोई दायित्व सौंपना’ वाले अर्थ का कर्म स्वाभाविक रूप से बनता है; इससे नियुक्त लोगों के बजाय नियुक्ति करने वालों को वह कार्य सौंपा गया माना जाता है। वैकल्पिक संबंध को पाठ-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अलंकारिक प्रश्न का स्वर ‘इसमें आश्चर्य ही क्या है’ से व्यक्त किया गया है; ‘मसीह में’ को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखा गया है।
