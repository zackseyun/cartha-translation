base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/002.yaml
  text: For there also the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him, and the rest of the prophets also followed him, bearing witness together to the ordinances enacted by him.
translation:
  language: hi
  text: वहाँ धन्य मूसा ने भी—जो सारे घराने में विश्वासयोग्य सेवक था—उसे जो कुछ आज्ञा दी गई थी, वह सब पवित्र पुस्तकों में दर्ज किया; और शेष भविष्यद्वक्ताओं ने भी उसका अनुसरण किया और उसके द्वारा ठहराए गए विधानों की मिलकर गवाही दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου καὶ
  choice: वहीं ... भी
  rationale: पूर्ववर्ती संदर्भ से स्थान/प्रसंग का संबंध बनाए रखते हुए καί का समावेश दर्शाता है।
- source_word: μακάριος
  choice: धन्य
  rationale: सम्मान और ईश्वरीय अनुग्रह-सूचक पारंपरिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πιστὸς θεράπων
  choice: विश्वासयोग्य सेवक
  rationale: θεράπων यहाँ सम्मानित सेवा करने वाले व्यक्ति को दर्शाता है; ‘सेवक’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐν ὅλῳ τῷ οἴκῳ
  choice: परमेश्वर के सारे घराने में
  rationale: गिनती 12:7/इब्रानियों 3:5 की प्रतिध्वनि में ‘घराना’ केवल भवन नहीं, परमेश्वर के अधीन समुदाय/व्यवस्था को व्यक्त करता है; ‘परमेश्वर के’ को निहित बाइबलीय संदर्भ स्पष्ट करने के लिए जोड़ा गया है।
- source_word: ἐσημειώσατο
  choice: लिख रखा
  rationale: मध्यम रूप और पूर्ण अभिलेखन के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἱεραῖς βίβλοις
  choice: पवित्र पुस्तकों
  rationale: बहुवचन βίβλοις को बनाए रखता है और बाद की तकनीकी संज्ञा थोपने से बचता है।
- source_word: ἐπηκολούθησαν
  choice: उसी के मार्ग पर चले
  rationale: ‘उसका अनुसरण किया’ के आशय को स्वाभाविक हिन्दी मुहावरे में प्रस्तुत करता है।
- source_word: συνεπιμαρτυροῦντες
  choice: मिलकर पुष्टि करते रहे
  rationale: συν- का सामूहिक बल बनाए रखते हुए दत्तिव कारक को उस विषय के रूप में लेता है जिसकी भविष्यद्वक्ता पुष्टि करते हैं।
- source_word: τοῖς ὑπ' αὐτοῦ νενομοθετημένοις
  choice: उसके द्वारा ठहराए गए विधानों की
  rationale: विधि-निर्धारण के भाव तथा मूसा की कर्तृभूमिका को बनाए रखता है; दत्तिव को συνεπιμαρτυροῦντες के विषय-वस्तु के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ‘उसके सारे घराने’ में घराने का स्वामी कौन है
  choice: परमेश्वर के सारे घराने में
  alternative: उसके सारे घराने में
  rationale: वाक्य गिनती 12:7 की स्पष्ट प्रतिध्वनि है, जहाँ घराना परमेश्वर का है; स्पष्ट हिन्दी अस्पष्ट सर्वनाम से बचती है।
- issue: भविष्यद्वक्ताओं की गवाही का संबंध
  choice: मूसा द्वारा ठहराए गए विधानों की पुष्टि
  alternative: उन विधानों के साथ मिलकर गवाही देना
  rationale: τοῖς ... νενομοθετημένοις को συνεπιμαρτυροῦντες का दत्तिव-विषय मानना यूनानी वाक्य-विन्यास और संशोधित स्रोत-समीक्षा के अनुकूल है।
- issue: मूसा के अनुसरण का स्वरूप
  choice: उसी के मार्ग पर चले
  alternative: उसके बाद आए
  rationale: ἐπακολουθέω वैचारिक/आदर्शगत अनुसरण व्यक्त कर सकता है; केवल कालक्रम तक अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। वाक्य को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है, पर मूल तर्क-संबंध सुरक्षित है।
