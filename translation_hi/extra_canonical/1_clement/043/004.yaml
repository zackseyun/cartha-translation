  yaml_path: translation/extra_canonical/1_clement/043/004.yaml
  text: And after shutting the tent[a], he sealed the staffs in the same way, and said to them, “Brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”
translation:
  language: hi
  text: और तंबू को बंद करके उसने चाबियों पर मुहर लगाई, और उसी प्रकार छड़ियों पर भी मुहर लगाई। फिर उसने उनसे कहा, “भाइयो, जिस गोत्र की छड़ी अंकुरित होगी, उसी को परमेश्वर ने याजकीय कार्य करने और उसकी सेवा करने के लिए चुना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκηνή
  choice: तंबू
  rationale: संदर्भ में यह मिलापवाले पवित्र तंबू को सूचित करता है; ‘तंबू’ सामान्य पाठक के लिए स्वाभाविक और स्रोत के निकट है।
- source_word: κλεῖδας
  choice: चाबियों
  rationale: यूनानी पाठ में स्पष्ट रूप से ‘चाबियाँ’ है। संदर्भगत कठिनाई के कारण इसे हटाना स्रोत-साक्ष्य के विरुद्ध होगा।
- source_word: ῥάβδους / ῥάβδος
  choice: छड़ियों / छड़ी
  rationale: यह गोत्रों का प्रतिनिधित्व करने वाली लकड़ी की छड़ियों के लिए सरल और सटीक हिंदी शब्द है।
- source_word: Ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: यह सम्मानपूर्ण सामूहिक संबोधन है; शाब्दिक ‘पुरुषो, भाइयो’ आधुनिक हिंदी में अस्वाभाविक होगा।
- source_word: ἱερατεύειν
  choice: याजक का कार्य करने
  rationale: क्रिया का अर्थ याजकीय पद अथवा कार्य निभाना है; इस रूप में क्रियात्मक बल बना रहता है।
- source_word: λειτουργεῖν
  choice: पवित्र सेवा करने
  rationale: यहाँ सामान्य सहायता नहीं, परमेश्वर के लिए उपासना-संबंधी सेवा अभिप्रेत है; ‘पवित्र’ संदर्भगत धार्मिक अर्थ स्पष्ट करता है।
theological_decisions:
- issue: चुनाव का व्याकरणिक लक्ष्य
  choice: ‘उसी को’ से गोत्र को लक्ष्य बनाया गया
  alternative: छड़ी को चुना गया
  rationale: स्त्रीलिंग ταύτην का निकटतम वैचारिक पूर्वपद φυλή (‘गोत्र’) है; छड़ी संकेत है, जबकि याजकीय सेवा के लिए गोत्र चुना जाता है।
- issue: ἱερατεύειν और λειτουργεῖν का संबंध
  choice: दोनों क्रियाओं को अलग लेकिन संबंधित कार्यों के रूप में रखा
  alternative: दोनों को मिलाकर केवल ‘याजकीय सेवा’ कहना
  rationale: मूल पाठ दो समन्वित क्रियाएँ रखता है; अनुवाद उस भेद और धार्मिक बल को बनाए रखता है।
- issue: κλεῖδας की संदर्भगत कठिनाई
  choice: मूल पाठ के अनुसार ‘चाबियों’ को बनाए रखा
  alternative: संदर्भ के आधार पर इसे हटाकर केवल छड़ियों का उल्लेख करना
  rationale: उपलब्ध यूनानी स्रोत में शब्द स्पष्ट है; कठिन पाठ को बिना पांडुलिपीय आधार के सुधारना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन के लिए स्वाभाविक ‘भाइयो’ चुना गया है। वाक्य-विन्यास मूल के क्रम को पर्याप्त रूप से सुरक्षित रखते हुए हिंदी में प्रवाहपूर्ण बनाया गया है।
