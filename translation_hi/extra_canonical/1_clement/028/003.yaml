base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/003.yaml
  text: “Where shall I go, and where shall I hide from your face? If I go up into heaven, you are there; if I depart to the farthest parts of the earth, there is your right hand; if I lie down in the depths, there is your Spirit.”
translation:
  language: hi
  text: “मैं कहाँ जाऊँ, और तेरे सामने से कहाँ छिपूँ? यदि मैं स्वर्ग पर चढ़ जाऊँ, तो तू वहाँ है; यदि मैं पृथ्वी के छोरों तक चला जाऊँ, तो वहाँ तेरा दाहिना हाथ है; यदि मैं अथाह गहराइयों में लेट जाऊँ, तो वहाँ तेरी आत्मा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφίξω
  choice: मैं कहाँ जाऊँ
  rationale: क्रिया के ‘पहुँचना/जाना’ भाव को प्रश्न के स्वाभाविक हिन्दी रूप में व्यक्त करता है।
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: तेरे सामने से
  rationale: शाब्दिक ‘तेरे मुख से’ की अपेक्षा हिन्दी में परमेश्वर की उपस्थिति से छिपने का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὰ ἔσχατα τῆς γῆς
  choice: पृथ्वी के छोरों तक
  rationale: ‘पृथ्वी के सबसे दूरस्थ भागों’ का काव्यात्मक और स्पष्ट समतुल्य।
- source_word: ἡ δεξιά σου
  choice: तेरा दाहिना हाथ
  rationale: मूल बिंब को बनाए रखा गया है; इसे केवल ‘तेरी शक्ति’ कहकर व्याख्यायित नहीं किया गया।
- source_word: καταστρωθῶ
  choice: लेट जाऊँ
  rationale: यहाँ नीचे लेटने/बिछ जाने का भाव है; मूल में न आए ‘बिस्तर बिछाना’ जैसे कर्म-वाचक विस्तार से बचा गया।
- source_word: τὰς ἀβύσσους
  choice: अथाह गहराइयों
  rationale: बहुवचन और अगाध गहराई के भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὸ πνεῦμά σου
  choice: तेरी आत्मा
  rationale: πνεῦμα का पारंपरिक और प्रसंगानुकूल समतुल्य; ‘श्वास’ या ‘वायु’ से अर्थ को सीमित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर की सर्वव्यापकता और उससे छिपने की असंभवता
  choice: स्थान-सूचक समानांतर वाक्यों और प्रत्यक्ष द्वितीय पुरुष को ज्यों का त्यों रखा गया।
  alternative: भावार्थ में केवल यह कहना कि ‘परमेश्वर हर जगह है।’
  rationale: मूल की काव्यात्मक तनावपूर्ण भाषा—स्वर्ग, पृथ्वी के छोर और गहराइयाँ—को बनाए रखना धार्मिक आशय को बिना सपाट किए व्यक्त करता है।
- issue: ‘दाहिना हाथ’ का अर्थ
  choice: मूल देहात्मक रूपक ‘तेरा दाहिना हाथ’ सुरक्षित रखा गया।
  alternative: ‘तेरी शक्ति’ या ‘तेरा अधिकार’।
  rationale: मूल पाठ शक्ति, उपस्थिति या संरक्षण में से किसी एक व्याख्या को स्पष्ट रूप से नहीं चुनता; इसलिए genuine ambiguity बनाए रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर को संबोधित करने में ‘तू/तेरा’ का प्रयोग निकटता और मूल के एकवचन प्रत्यक्ष संबोधन को दर्शाता है; भाषा अनौपचारिक या असम्मानजनक न लगे, इसलिए वाक्य-विन्यास गंभीर रखा गया है।
