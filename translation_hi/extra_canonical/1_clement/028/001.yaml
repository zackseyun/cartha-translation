source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
translation:
  language: hi
  text: इसलिए, जब सब कुछ देखा और सुना जाता है, तो हम उसका भय मानें और बुरे काम करने की अशुद्ध इच्छाओं को छोड़ दें,[a] ताकि उसकी दया से हम आने वाले न्यायों से सुरक्षित रखे जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुरे कामों से जुड़ी अशुद्ध इच्छाओं को।”
    reason: φαύλων ἔργων को मुख्य पाठ में objective genitive, अर्थात ‘बुरे काम करने की इच्छाएँ’, के रूप में लिया गया है। सम्बन्धात्मक अर्थ भी व्याकरणतः सम्भव है, इसलिए वैकल्पिक अनुवाद दिया गया है।
lexical_decisions:
- source_word: Πάντων οὖν βλεπομένων καὶ ἀκουομένων
  choice: इसलिए, जब सब कुछ देखा और सुना जाता है
  rationale: सम्बन्धकारक निरपेक्ष रचना को स्वाभाविक हिन्दी उपवाक्य में रखा गया है; यूनानी कर्मवाच्य में देखने-सुनने वाले का उल्लेख नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: φοβηθῶμεν αὐτὸν
  choice: हम उसका भय मानें
  rationale: hortatory aorist subjunctive का सामूहिक आह्वान सुरक्षित रहता है; धार्मिक सन्दर्भ में ‘भय मानना’ श्रद्धामिश्रित भय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπολίπωμεν
  choice: छोड़ दें
  rationale: किसी वस्तु से निर्णायक रूप से अलग होने का भाव संक्षेप और सहज हिन्दी में व्यक्त होता है।
- source_word: φαύλων ἔργων μιαρὰς ἐπιθυμίας
  choice: बुरे कामों की अशुद्ध अभिलाषाओं
  rationale: मुख्य पाठ में objective genitive को सहज हिन्दी सम्बन्धकारक से रखा गया है, जिसका आशय बुरे काम करने की अभिलाषाएँ है; वैकल्पिक सम्बन्धात्मक पाठ फुटनोट में सुरक्षित है।
- source_word: τῷ ἐλέει αὐτοῦ
  choice: उसकी दया से
  rationale: करण/साधनसूचक dative को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: σκεπασθῶμεν ἀπὸ
  choice: हम ... से बचाए जाएँ
  rationale: शाब्दिक ‘ढाँपे जाएँ’ हिन्दी में इस प्रसंग में अस्पष्ट है; यहाँ क्रिया दया द्वारा आने वाले दण्ड से संरक्षण पाने का भाव देती है।
- source_word: τῶν μελλόντων κριμάτων
  choice: आनेवाले न्याय-दण्डों
  rationale: κρίματα बहुवचन है और प्रसंग में भावी दैवी न्याय के दण्डात्मक परिणामों की ओर संकेत करता है; ‘न्याय-दण्ड’ निर्णय और दण्ड दोनों आयाम बनाए रखता है।
theological_decisions:
- issue: भावी κρίματα का स्वरूप
  choice: आनेवाले न्याय-दण्डों
  alternative: आनेवाले न्यायों / आनेवाले दण्डों
  rationale: सिर्फ ‘न्याय’ हिन्दी में सद्गुण या व्यवस्था समझा जा सकता है, जबकि सिर्फ ‘दण्ड’ निर्णय के अर्थ को खो देता है। संयुक्त पद मूल की न्यायिक और दण्डात्मक सम्भावना को बनाए रखता है।
- issue: दया द्वारा संरक्षण
  choice: उसकी दया से हम ... बचाए जाएँ
  alternative: उसकी दया हमें ... ढाँप ले
  rationale: मूल कर्मवाच्य और दया के साधन होने का भाव रखा गया है, बिना मुक्ति की किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामूहिक उपदेशात्मक स्वर के लिए ‘हम ... मानें/छोड़ दें’ रखा गया है। भाषा गरिमापूर्ण पर सामान्य पाठकों के लिए सहज है।
