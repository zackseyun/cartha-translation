base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/002.yaml
  text: 'For where can anyone of us flee from his mighty hand? Or what world will receive anyone who deserts from him? For the Scripture says somewhere:'
translation:
  language: hi
  text: 'क्योंकि हममें से कौन उसके शक्तिशाली हाथ से भाग सकता है? या कौन-सा संसार उसका साथ छोड़कर भागने वाले को स्वीकार करेगा? क्योंकि पवित्रशास्त्र में कहीं कहा गया है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κραταιᾶς χειρός
  choice: शक्तिशाली हाथ
  rationale: यह मूल रूपक और परमेश्वर की अप्रतिरोध्य सामर्थ्य—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κόσμος
  choice: संसार
  rationale: κόσμος का सीधा और प्रसंगानुकूल अर्थ; प्रश्न यह है कि परमेश्वर से भागने वाले को सृष्टि का कौन-सा क्षेत्र स्वीकार करेगा।
- source_word: δέξεται
  choice: शरण देगा
  rationale: सिर्फ ‘स्वीकार करेगा’ की अपेक्षा प्रसंग में भगोड़े को आश्रय देने का भाव अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτομολούντων ἀπ᾿ αὐτοῦ
  choice: जो उसे छोड़कर भागता है
  rationale: αὐτομολέω में पक्ष छोड़कर भागने या भगोड़ा होने का भाव है; यह हिन्दी अनुवाद उस तीखे भाव को बिना अस्वाभाविक सैन्य शब्दावली के व्यक्त करता है।
- source_word: τὸ γραφεῖον
  choice: पवित्रशास्त्र में ... लिखा है
  rationale: यहाँ शब्द किसी लिखित शास्त्रीय वचन की ओर संकेत करता है; मुहावरेदार हिन्दी में आगामी उद्धरण का परिचय देता है।
- source_word: που
  choice: कहीं
  rationale: लेखक ने उद्धरण का स्थान अनिर्दिष्ट रखा है; मूल की अस्पष्टता संरक्षित है।
theological_decisions:
- issue: परमेश्वर से दूर भागने की संभावना
  choice: अलंकारिक प्रश्नों को अक्षुण्ण रखा गया है
  alternative: 'स्पष्ट कथन: ‘कोई भी परमेश्वर से बच नहीं सकता’'
  rationale: मूल पाठ निष्कर्ष को व्याख्यात्मक कथन में बदलने के बजाय प्रश्नों के माध्यम से परमेश्वर की सर्वव्यापी सत्ता पर बल देता है।
- issue: αὐτομολέω का धार्मिक अर्थ
  choice: ‘उसे छोड़कर भागता है’
  alternative: ‘उसके विरुद्ध विद्रोह करता है’ या ‘धर्मत्याग करता है’
  rationale: मूल में पलायन/पक्षत्याग का बिंब है, पर कोई विशिष्ट सांप्रदायिक या व्यवस्थित धर्मशास्त्रीय श्रेणी निर्दिष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल के दो अलंकारिक प्रश्न और आगामी शास्त्रीय उद्धरण को सूचित करने वाला विराम-चिह्न बनाए रखा गया है।
