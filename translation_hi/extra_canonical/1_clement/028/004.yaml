base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/004.yaml
  text: Where, then, can one go, or where can one escape from the one who encompasses all things?
translation:
  language: hi
  text: तो फिर कोई कहाँ जाए, या उससे बचकर कहाँ भागे जो सब कुछ अपने में समेटे हुए है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποῖ ... ἀπέλθῃ
  choice: कहाँ जाए
  rationale: संभावना व्यक्त करने वाले यूनानी प्रश्न को स्वाभाविक और सीधी आधुनिक हिन्दी में रखा गया है।
- source_word: ποῦ ἀποδράσῃ
  choice: बचकर कहाँ भागे
  rationale: ἀποδράσῃ में छूट निकलने अथवा पलायन करने का भाव है; ‘बचकर ... भागे’ इस बल को स्पष्ट रखता है।
- source_word: τοῦ τὰ πάντα ἐμπεριέχοντος
  choice: उससे ... जो सब कुछ अपने में समेटे हुए है
  rationale: ἐμπεριέχω के घेरने, समाहित करने और अपने भीतर धारण करने के व्यापक अर्थ को ‘अपने में समेटे हुए’ स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के सर्वव्यापी और सर्वसमावेशी होने का वर्णन
  choice: जो सब कुछ अपने में समेटे हुए है
  alternative: जो सब वस्तुओं को घेरे हुए है
  rationale: स्रोत का कृदन्त व्यक्ति की पहचान संदर्भ से कराता है और क्रिया में समाहित/परिवेष्टित करने की अर्थ-व्याप्ति है। अनुवाद परमेश्वर का नाम जोड़कर निहित कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता और मूल कथन का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘तो फिर’ οὖν के निष्कर्षात्मक भाव को व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं है।
