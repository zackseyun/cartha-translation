base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/004.yaml
  text: So, preaching through regions and cities, they appointed their firstfruits, after testing them by the Spirit, to be overseers and deacons for those who were going to believe.
translation:
  language: hi
  text: इसलिए वे प्रदेशों और नगरों में प्रचार करते हुए, अपने प्रथम विश्वासियों को आत्मा द्वारा परखकर, उन लोगों के लिए जो विश्वास करने वाले थे, निरीक्षक और सेवक नियुक्त करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ χώρας ... καὶ πόλεις
  choice: प्रदेश-प्रदेश और नगर-नगर में
  rationale: यूनानी वाक्यांश प्रचार के विभिन्न क्षेत्रों और नगरों में होने का भाव देता है; पुनरुक्ति हिन्दी में व्यापक भ्रमण को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: κηρύσσοντες
  choice: प्रचार करते हुए
  rationale: यह सार्वजनिक रूप से संदेश की घोषणा करने के अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: τὰς ἀπαρχὰς αὐτῶν
  choice: अपने प्रथम विश्वासियों को
  rationale: शाब्दिक अर्थ ‘उनके प्रथम फल’ है; यहाँ प्रसंगतः प्रचार से सबसे पहले विश्वास करने वाले लोगों का संकेत है। रूपक को अस्पष्ट न रखने के लिए उसका संदर्भगत अर्थ मुख्य पाठ में दिया गया है।
- source_word: δοκιμάσαντες τῷ πνεύματι
  choice: आत्मा के द्वारा परखकर
  rationale: करणवाचक τῷ πνεύματι को बनाए रखता है और ‘आत्मा’ को मानवीय मनोभाव में सीमित नहीं करता।
- source_word: ἐπισκόπους
  choice: अध्यक्ष
  rationale: शब्द का मूल भाव देखरेख और निरीक्षण करने वाले व्यक्ति का है; ‘अध्यक्ष’ आधुनिक हिन्दी में पदनाम के रूप में समझने योग्य है और अनावश्यक रूप से बाद की कलीसियाई पदानुक्रम को आयात नहीं करता।
- source_word: διακόνους
  choice: सेवक
  rationale: मूल शब्द सेवा करने वाले व्यक्ति को दर्शाता है; ‘सेवक’ उसके व्यापक और आरंभिक अर्थ को सुरक्षित रखता है।
- source_word: τῶν μελλόντων πιστεύειν
  choice: उन लोगों के लिए ... जो विश्वास करने वाले थे
  rationale: भावी कृदंत और infinitive की भविष्याभिमुखता को स्पष्ट रखता है, बिना यह तय किए कि वे निश्चित रूप से विश्वास करेंगे या केवल संभावित भावी विश्वासी हैं।
theological_decisions:
- issue: τῷ πνεύματι में ‘आत्मा’ की पहचान
  choice: आत्मा के द्वारा
  alternative: अपने विवेक से / आत्मिक रीति से
  rationale: यूनानी में πνεῦμα की पहचान स्पष्ट विशेषण के बिना है; अनुवाद ने इसे ‘पवित्र आत्मा’ जोड़कर निर्णायक नहीं बनाया और न ही इसे केवल मानवीय विवेक मान लिया।
- issue: ἐπίσκοποι और διάκονοι के पदनाम
  choice: अध्यक्ष और सेवक
  alternative: बिशप और डीकन / प्राचीन और सहायक
  rationale: ऐसे शब्द चुने गए हैं जो कार्यगत अर्थ देते हैं और बाद की किसी विशिष्ट संप्रदायगत पद-व्यवस्था को पाठ पर आरोपित नहीं करते।
- issue: ‘जो विश्वास करने वाले थे’ का भाव
  choice: भविष्याभिमुख कथन को बनाए रखा
  alternative: भावी विश्वासियों के लिए / जो बाद में विश्वास करते
  rationale: μέλλω की संभावित या अपेक्षित भविष्यता को कठोर पूर्वनियति या केवल कालक्रम में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की यूनानी संरचना तथा नियुक्ति से पहले आत्मा के द्वारा परखे जाने का क्रम सुरक्षित है।
