id: 1CLEM.42.3
reference: 1 Clement 42:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/003.yaml
  text: Therefore[a], after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God was about to come.
translation:
  language: hi
  text: इसलिए निर्देश पाकर, और हमारे प्रभु यीशु मसीहा के पुनरुत्थान के द्वारा पूरा भरोसा प्राप्त करके, और परमेश्वर के वचन में दृढ़ किए जाकर, वे पवित्र आत्मा से मिले पूरे भरोसे के साथ यह शुभ समाचार सुनाते हुए निकल पड़े कि परमेश्वर का राज्य आने वाला था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आने वाला है।”
    reason: यूनानी अप्रत्यक्ष कथन में μέλλειν वर्तमान infinitive है; हिन्दी में भूतकालीन मुख्य क्रिया के साथ ‘था’ स्वाभाविक है, पर मूल उद्घोषणा का वर्तमान रूप भी दर्शाया जा सकता है।
lexical_decisions:
- source_word: παραγγελίας
  choice: निर्देश
  rationale: यहाँ बहुवचन-सदृश अर्थ वाले आदेशों या निर्देशों की प्राप्ति का भाव है; ‘निर्देश’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: πληροφορηθέντες / πληροφορίας
  choice: पूरा भरोसा प्राप्त करके / पूरे भरोसे के साथ
  rationale: दोनों संबद्ध शब्द पूर्ण निश्चय या दृढ़ आश्वासन व्यक्त करते हैं; हिन्दी में एक ही भाव-क्षेत्र रखते हुए वाक्य को स्वाभाविक बनाया गया है।
- source_word: Χριστοῦ
  choice: मसीहा
  rationale: यूनानी उपाधि Χριστός का अर्थ ‘अभिषिक्त जन’ है; ‘मसीहा’ इसे केवल नाम की तरह प्रस्तुत करने के बजाय उपाधि का अर्थ बनाए रखता है।
- source_word: πιστωθέντες
  choice: दृढ़ किए जाकर
  rationale: कर्मवाच्य रूप को बनाए रखते हुए विश्वास में प्रमाणित या सुदृढ़ किए जाने का भाव व्यक्त करता है।
- source_word: εὐαγγελιζόμενοι
  choice: शुभ समाचार सुनाते हुए
  rationale: क्रिया के प्रचारात्मक और शुभ-संदेश संबंधी अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह पारंपरिक और स्वाभाविक हिन्दी धार्मिक पदावली है, जो परमेश्वर के राजकीय शासन और राज्य—दोनों अर्थों के लिए खुली रहती है।
theological_decisions:
- issue: μέλλειν ἔρχεσθαι का काल और आसन्नता
  choice: आने वाला था
  alternative: आने वाला है
  rationale: यह पद भूतकालीन मुख्य क्रिया ‘निकल पड़े’ के अधीन अप्रत्यक्ष कथन है, इसलिए हिन्दी में ‘था’ स्वाभाविक काल-सामंजस्य देता है। फिर भी यूनानी वर्तमान infinitive मूल उद्घोषणा के ‘आने वाला है’ रूप को भी संभव बनाता है; इसे पादटिप्पणी में रखा गया है।
- issue: पुनरुत्थान द्वारा आश्वासन का संबंध
  choice: मसीहा के पुनरुत्थान के द्वारा पूरा भरोसा प्राप्त करके
  alternative: पुनरुत्थान के विषय में पूरा भरोसा पाकर
  rationale: διά τῆς ἀναστάσεως पुनरुत्थान को आश्वासन का माध्यम बताता है, केवल आश्वासन का विषय नहीं।
- issue: पवित्र आत्मा और ‘पूरा भरोसा’ का संबंध
  choice: पवित्र आत्मा से मिले पूरे भरोसे के साथ
  alternative: पवित्र आत्मा की पूर्णता के साथ
  rationale: πληροφορία का सामान्य अर्थ दृढ़/पूर्ण आश्वासन है। सम्बन्धवाचक πνεύματος ἁγίου को उस आश्वासन के स्रोत के रूप में स्पष्ट किया गया है, बिना आत्मा की प्रकृति पर अतिरिक्त doctrinal निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कृदंतों की शृंखला को यथासंभव सुरक्षित रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
