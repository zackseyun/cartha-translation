  yaml_path: translation/extra_canonical/1_clement/042/005.yaml
  text: And this was not something new[a], for indeed it had been written about overseers and deacons from many ages ago. For thus the Scripture says somewhere, “I will appoint their overseers in righteousness, and their deacons in faith.”
translation:
  language: hi
  text: और यह कोई नई बात नहीं थी, क्योंकि निरीक्षकों और सेवकों के विषय में बहुत पहले से लिखा हुआ था। क्योंकि पवित्रशास्त्र कहीं इस प्रकार कहता है, “मैं उनके निरीक्षकों को धार्मिकता में और उनके सेवकों को विश्वास में नियुक्त करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισκόπων / ἐπισκόπους
  choice: निरीक्षकों
  rationale: इस प्रसंग में शब्द का मूल अर्थ देखरेख करने वाले पदाधिकारियों से है; ‘निरीक्षक’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है और बाद की किसी विशिष्ट कलीसियाई पद-परंपरा को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: διακόνων / διακόνους
  choice: सेवकों
  rationale: ग्रीक शब्द सेवा करने वाले व्यक्तियों को सूचित करता है। ‘सेवक’ इसका स्वाभाविक हिन्दी रूप है और ‘डीकन’ जैसे अपारदर्शी लिप्यंतरण से बचता है।
- source_word: ἐκ γὰρ δὴ πολλῶν χρόνων
  choice: क्योंकि ... बहुत पहले से
  rationale: वाक्यांश के दीर्घकाल पूर्व लिखे जाने के भाव को सहज हिन्दी में व्यक्त करता है; δὴ के बल को कथन की निश्चितता में समाहित किया गया है।
- source_word: οὕτως γάρ που λέγει ἡ γραφή
  choice: क्योंकि पवित्रशास्त्र कहीं इस प्रकार कहता है
  rationale: οὕτως को ‘इस प्रकार’ और अनिश्चित उद्धरण-सूचक που को ‘कहीं’ द्वारा स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता में
  rationale: ग्रीक की ‘में’ वाली रचना और नैतिक-धार्मिक गुण, दोनों को यथासंभव निकटता से बनाए रखता है।
- source_word: ἐν πίστει
  choice: विश्वासयोग्यता में
  rationale: πίστις यहाँ नियुक्त सेवकों के गुण के रूप में आता है; ‘विश्वासयोग्यता’ उस गुणार्थ को स्पष्ट करता है, जबकि केवल ‘विश्वास’ हिन्दी में व्यक्तिगत आस्था समझा जा सकता है।
theological_decisions:
- issue: ἐπίσκοπος और διάκονος को बाद के संस्थागत पदनामों के रूप में प्रस्तुत करना
  choice: निरीक्षक और सेवक
  alternative: बिशप और डीकन
  rationale: मूल शब्दों के कार्यात्मक अर्थ को रखा गया है और बाद की संप्रदायगत पद-संरचनाओं को पाठ में पूर्वकल्पित नहीं किया गया।
- issue: πίστις का अर्थ
  choice: विश्वासयोग्यता
  alternative: विश्वास
  rationale: उद्धरण में δικαιοσύνη के समानांतर यह नियुक्त व्यक्तियों से जुड़ा गुण है; फिर भी ‘विश्वास’ संभावित शाब्दिक विकल्प है, पर मुख्य पाठ में गुणार्थ अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए बोधगम्य रखी गई है। उद्धरण-सूत्र में ‘इस प्रकार’ और ‘कहीं’ दोनों को सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
