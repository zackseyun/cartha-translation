base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/002.yaml
  text: So then Messiah is from God[a], and the apostles are from Messiah; therefore both came about in good order by the will of God.
translation:
  language: hi
  text: अतः मसीह परमेश्वर की ओर से हैं, और प्रेरित मसीह की ओर से हैं; इस प्रकार ये दोनों बातें परमेश्वर की इच्छा से उचित क्रम में हुईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: यूनानी उपाधि Χριστός का प्रचलित और अर्थ-संगत हिन्दी रूप; इसे केवल व्यक्तिवाचक नाम की तरह प्रस्तुत नहीं किया गया।
- source_word: ἀπό
  choice: की ओर से आए
  rationale: यहाँ स्रोत अथवा प्रेषण का संबंध व्यक्त होता है। यूनानी में क्रिया लुप्त है; हिन्दी में वाक्य को स्वाभाविक और स्पष्ट बनाने के लिए ‘आए’ जोड़ा गया, बिना ‘भेजे गए’ को स्पष्ट रूप से आरोपित किए।
- source_word: οἱ ἀπόστολοι
  choice: प्रेरित
  rationale: आरम्भिक मसीही साहित्य में ἀπόστολοι के लिए मानक और सहज हिन्दी पद।
- source_word: ἀμφότερα
  choice: दोनों बातें
  rationale: नपुंसकलिंग बहुवचन दोनों समांतर व्यवस्थाओं—मसीह का परमेश्वर की ओर से और प्रेरितों का मसीह की ओर से आना—की ओर संकेत करता है।
- source_word: εὐτάκτως
  choice: उचित क्रम में
  rationale: क्रियाविशेषण का भाव व्यवस्थित, क्रमबद्ध और यथोचित रीति से घटित होने का है।
- source_word: ἐκ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: ἐκ स्रोत का बोध कराता है, पर इच्छा के साथ हिन्दी में ‘इच्छा से’ सबसे स्वाभाविक रूप है और उसी कारणात्मक/स्रोतगत बल को बनाए रखता है।
theological_decisions:
- issue: मसीह और प्रेरितों के उद्गम अथवा प्रेषण का संबंध
  choice: ‘की ओर से आए’
  alternative: ‘ने भेजा’ अथवा केवल ‘से हैं’
  rationale: ‘ने भेजा’ संदर्भ में संभव है, पर यूनानी की लुप्त क्रिया को अधिक निश्चित कर देता है; ‘से हैं’ हिन्दी में अस्पष्ट और अस्वाभाविक है। चुना हुआ रूप स्रोत/प्रेषण दोनों की गुंजाइश रखता है।
- issue: θελήματος में इच्छा का संबंध
  choice: दोनों घटनाएँ परमेश्वर की इच्छा से हुईं
  alternative: इसे केवल पहले कथन से जोड़ना
  rationale: यूनानी वाक्यरचना में ἀμφότερα और ἐγένοντο के साथ ἐκ θελήματος θεοῦ दोनों समांतर घटनाओं का वर्णन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अतः’, ‘उचित क्रम में’ और ‘परमेश्वर की इच्छा से’ मूल की तर्कपूर्ण तथा औपचारिक लय बनाए रखते हैं।
