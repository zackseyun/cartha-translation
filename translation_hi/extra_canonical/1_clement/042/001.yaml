  text: Οἱ ἀπόστολοι ἡμῖν εὐηγγελίσθησαν ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ, Ἰησοῦς ὁ Χριστὸς ἀπὸ τοῦ θεοῦ ἐξεπέμφθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/001.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah, and Jesus the Messiah was sent out from God.
translation:
  language: hi
  text: प्रेरितों को हमारे लिए प्रभु यीशु मसीह की ओर से शुभ समाचार दिया गया, और यीशु मसीह को परमेश्वर की ओर से भेजा गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ ἀπόστολοι
  choice: प्रेरितों
  rationale: प्रारंभिक मसीही साहित्य में ‘ἀπόστολοι’ के लिए प्रचलित और अर्थ-सटीक हिन्दी पद।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: मूल में सम्प्रदान कारक है; यह शुभ समाचार के लाभार्थी या उसके आगे पहुँचाए जाने की दिशा को व्यक्त करता है।
- source_word: εὐηγγελίσθησαν
  choice: शुभ समाचार पाया
  rationale: निष्क्रिय क्रिया का भाव बनाए रखता है कि प्रेरितों को शुभ समाचार सुनाया गया; स्वाभाविक हिन्दी के लिए ‘पाया’ प्रयुक्त है।
- source_word: ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: प्रभु यीशु मसीह से
  rationale: ἀπό को स्रोत के रूप में व्यक्त करता है और Χριστός का पारंपरिक, व्यापक रूप से समझा जाने वाला अनुवाद ‘मसीह’ रखता है।
- source_word: ἐξεπέμφθη
  choice: भेजे गए
  rationale: दिव्य प्रेषण के निष्क्रिय रूप को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: यहाँ ἀπό भेजे जाने के स्रोत/प्रेषक को दर्शाता है; ‘की ओर से’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: प्रेषण की क्रमिक संरचना
  choice: प्रेरितों का संदेश मसीह से और मसीह का प्रेषण परमेश्वर की ओर से—दोनों खंड समानांतर रखे गए।
  alternative: दोनों खंडों को व्याख्यात्मक रूप से जोड़कर अधिकार-श्रृंखला स्पष्ट करना।
  rationale: मूल यूनानी की संक्षिप्त समानांतर रचना को बनाए रखकर निहित धर्मवैज्ञानिक संबंध को बिना अतिरिक्त व्याख्या के प्रस्तुत किया गया है।
- issue: Χριστός का निरूपण
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: ‘मसीह’ आधुनिक हिन्दी मसीही पाठकों में स्वाभाविक और पदवी के रूप में मान्य है; ‘अभिषिक्त जन’ अर्थ खोलता, पर पाठ की परिचित संज्ञा-संरचना बदल देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। यूनानी के दो समानांतर निष्क्रिय कथनों और स्रोत-सूचक ἀπό को यथासंभव संरक्षित किया गया है।
