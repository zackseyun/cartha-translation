source:
  edition: Funk 1901 (normalized OCR)
  text: εἰ οἱ οὐρανοὶ διηγοῦνται δόξαν θεοῦ, ποίησιν δὲ χειρῶν αὐτοῦ ἀναγγέλλει τὸ στερέωμα· ἡ ἡμέρα τῇ ἡμέρᾳ ἐρεύγεται ῥῆμα, καὶ νὺξ νυκτὶ ἀναγγέλλει γνῶσιν· καὶ οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί, ὧν οὐχὶ ἀκούονται αἱ φωναὶ αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/007.yaml
  text: The heavens declare the glory of God[a], and the firmament proclaims the work of his hands; day to day pours forth speech, and night to night announces knowledge. There are no words or utterances whose voices are not heard.
translation:
  language: hi
  text: आकाश परमेश्वर की महिमा का वर्णन करता है,[a] और आकाशमण्डल उसके हाथों की कारीगरी की घोषणा करता है; दिन दिन को वाणी उंडेलता है, और रात रात को ज्ञान प्रकट करती है। न ऐसे शब्द हैं, न ऐसी उक्तियाँ, जिनकी आवाज़ें सुनाई नहीं देतीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्राचीन मुद्रित पाठ के आरम्भिक अक्षर को यदि εἰ पढ़ा जाए, तो अर्थ हो सकता है: “चूँकि आकाश परमेश्वर की महिमा का वर्णन करता है, और आकाशमण्डल उसके हाथों की कारीगरी की घोषणा करता है, दिन दिन को वाणी उंडेलता है।” पर यहाँ सम्भवतः Οἱ (“आकाश”) को OCR में εἰ पढ़ लिया गया है।'
    reason: source_textual_ambiguity
lexical_decisions:
- source_word: οἱ οὐρανοὶ
  choice: आकाश
  rationale: बहुवचन यूनानी रूप को हिन्दी के स्वाभाविक सामूहिक शब्द ‘आकाश’ से व्यक्त किया गया है; क्रिया में स्रोत का बहुवचन भाव रखा गया है।
- source_word: τὸ στερέωμα
  choice: आकाशमण्डल
  rationale: यह दृश्यमान विस्तृत आकाश या firmament का पारंपरिक किंतु आज भी बोधगम्य हिन्दी पद है।
- source_word: ποίησιν ... χειρῶν αὐτοῦ
  choice: उसके हाथों की कारीगरी
  rationale: ποίησις को केवल अमूर्त ‘कार्य’ न कहकर रची हुई कृति/कारीगरी के अर्थ में प्रस्तुत किया गया है।
- source_word: ἐρεύγεται ῥῆμα
  choice: वाणी उमड़ती है
  rationale: ἐρεύγομαι के प्रबल ‘उंडेलना/उमड़ना’ भाव और ῥῆμα के कथन-वाणी अर्थ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἀναγγέλλει γνῶσιν
  choice: ज्ञान प्रकट होता है
  rationale: शाब्दिक कर्तृवाच्य ‘ज्ञान की घोषणा करती है’ हिन्दी में भारी लगता है; यह रूप रात से रात ज्ञान पहुँचने के अर्थ को बनाए रखता है।
- source_word: λόγοι οὐδὲ λαλιαί
  choice: न ऐसे शब्द हैं, न ऐसी बोलियाँ
  rationale: दो निकटवर्ती पदों का भेद ‘शब्द’ और ‘बोलियाँ’ से रखा गया है; λαλιαί में भाषण/भाषाओं दोनों की संभावित छाया बनी रहती है।
- source_word: αἱ φωναὶ αὐτῶν
  choice: उनकी आवाज़ें
  rationale: स्रोत के बहुवचन और श्रव्य अभिव्यक्ति को सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: आरम्भिक εἰ का पाठ
  choice: इसे OCR में Οἱ (‘वे/आकाश’) का गलत पाठ मानकर मुख्य अनिर्भर कथन के रूप में अनुवाद किया गया
  alternative: ‘यदि/चूँकि आकाश…’ से आश्रित उपवाक्य बनाना
  rationale: उद्धृत भजन 19:1–3 (LXX 18:2–4), वाक्यरचना और संपादकीय साक्ष्य Οἱ का समर्थन करते हैं; εἰ लेने पर वाक्य असंगत रूप से आश्रित हो जाता है।
- issue: सृष्टि की सार्वभौमिक गवाही की अंतिम पंक्ति
  choice: 'ग्रीक की सतही नकारात्मक संरचना को बनाए रखा गया: ऐसी वाणी नहीं जिसकी आवाज़ न सुनी जाए'
  alternative: भजन के प्रसंग के आधार पर ‘उनकी कोई आवाज़ सुनाई नहीं देती’ या ‘उनकी आवाज़ सारी पृथ्वी पर जाती है’
  rationale: प्रस्तुत यूनानी पाठ की अपनी शब्दावली और अस्पष्ट तनाव को किसी अन्य पाठ-परंपरा से बदलना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘आकाशमण्डल’ और ‘कारीगरी’ जैसे परिचित धार्मिक-साहित्यिक पदों के साथ वाक्यरचना सरल रखी गई है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
