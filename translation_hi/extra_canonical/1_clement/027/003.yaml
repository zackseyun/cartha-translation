  text: इसलिए उस पर हमारा विश्वास हमारे भीतर फिर से प्रज्वलित हो जाए, और हम समझें कि सब कुछ उसके निकट है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζωπυρησάτω
  choice: फिर से प्रज्वलित हो जाए
  rationale: यह आग को पुनः भड़काने की यूनानी क्रिया-छवि को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἡ πίστις αὐτοῦ
  choice: उसमें हमारा विश्वास
  rationale: संदर्भानुकूल रूप से αὐτοῦ को विश्वास के लक्ष्य के अर्थ में लिया गया है; हिन्दी में स्वाभाविकता और आशय की स्पष्टता के लिए ‘हमारा’ जोड़ा गया है, जबकि ‘हममें’ आगे आंतरिक पुनर्जीवन को व्यक्त करता है।
- source_word: ἐν ἡμῖν
  choice: हममें
  rationale: विश्वास के पुनः प्रज्वलित होने के क्षेत्र को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: νοήσωμεν
  choice: हम समझें
  rationale: विचारपूर्वक ग्रहण करने के अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντα ἐγγὺς αὐτῷ ἐστιν
  choice: सब कुछ उसके निकट है
  rationale: मूल कथन की व्यापकता और निकटता की स्थानिक/रूपक अस्पष्टता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: πίστις αὐτοῦ में संबंध का अर्थ
  choice: उसमें हमारा विश्वास
  alternative: उसका विश्वास / उसकी विश्वासयोग्यता
  rationale: यहाँ उपदेशात्मक आह्वान और अंग्रेज़ी परामर्श-पाठ लक्ष्यवाचक अर्थ का समर्थन करते हैं; फिर भी अनुवाद में कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी गई।
- issue: परमेश्वर के लिए सब वस्तुओं की निकटता
  choice: सब कुछ उसके निकट है
  alternative: वह सब कुछ शीघ्र पूरा कर सकता है
  rationale: मूल ἐγγύς की वास्तविक अस्पष्टता को बनाए रखा गया है और सामर्थ्य अथवा समय-संबंधी अर्थ को चुपचाप निश्चित नहीं किया गया।
