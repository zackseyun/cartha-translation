id: 1CLEM.27.5
reference: 1 Clement 27:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Τίς ἐρεῖ αὐτῷ· Τί ἐποίησας; ἢ τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ; ὅτε θέλει καὶ ὡς θέλει, ποιήσει πάντα καὶ οὐδὲν μὴ παρελθῇ τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/005.yaml
  text: Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away.
translation:
  language: hi
  text: कौन उससे कहेगा, “तूने क्या किया?” अथवा कौन उसकी शक्ति के बल का प्रतिरोध करेगा? जब वह चाहता है और जैसे चाहता है, वह सब कुछ करेगा; और उसके ठहराए हुए निर्णयों में से एक भी कभी नहीं टलेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: सामना करेगा
  rationale: यह क्रिया विरोध में खड़े होने या प्रतिरोध करने का भाव रखती है; आधुनिक हिन्दी में ‘सामना करेगा’ स्वाभाविक और पर्याप्त रूप से सशक्त है।
- source_word: τῷ κράτει τῆς ἰσχύος αὐτοῦ
  choice: उसकी सामर्थ्य के पराक्रम का
  rationale: κράτος और ἰσχύς के संयुक्त बल-वाचक भाव को बनाए रखने के लिए दो संबंधित हिन्दी शब्द रखे गए हैं, बिना इसे केवल एक सामान्य ‘शक्ति’ में समेटे।
- source_word: τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ
  choice: जिन बातों का उसने निश्चय किया है
  rationale: δεδογματισμένων यहाँ उसके द्वारा निर्धारित या निर्णीत बातों को दर्शाता है; ‘निश्चय किया है’ साधारण पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: παρελθῇ
  choice: निष्फल न होगी
  rationale: संदर्भ में अर्थ किसी ठहराई हुई बात के टल जाने, बीत जाने या पूरा न होने का है; ‘निष्फल न होगी’ हिन्दी में उसके प्रभावहीन या अपूर्ण न रहने का आशय स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वर की इच्छा और संप्रभु सामर्थ्य का कथन
  choice: ‘जब वह चाहता है और जैसे चाहता है’ को समानांतर रूप में बनाए रखा गया
  alternative: ‘वह अपनी इच्छा के अनुसार सब कुछ करता है’
  rationale: मूल यूनानी में समय/अवसर और रीति—ὅτε तथा ὡς—दोनों पर बल है; संक्षेप करने से यह द्विगुणित बल मिट जाता।
- issue: दैवी निर्णयों के कभी न टलने का कथन
  choice: ‘एक भी कभी निष्फल न होगी’
  alternative: ‘एक भी टलेगी नहीं’ या ‘एक भी मिटेगी नहीं’
  rationale: मूल में परिणाम की अटलता है, पर उसके दार्शनिक या संप्रदायगत विस्तार को निर्धारित नहीं किया गया; चुना हुआ वाक्य उसी सीमा में रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रजिस्टर। ईश्वर को संबोधित प्रत्यक्ष प्रश्न में ‘तूने’ मूल के एकवचन निकट संबोधन को दर्शाता है; वर्णनात्मक वाक्यों में ‘वह/उसकी’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
