id: 1CLEM.27.2
reference: 1 Clement 27:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ παραγγείλας μὴ ψεύδεσθαι, πολλῷ μᾶλλον αὐτὸς οὐ ψεύσεται· οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ, εἰ μὴ τὸ ψεύσασθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/002.yaml
  text: He who commanded not to lie will much more not lie himself; for nothing is impossible with God[a], except to lie.
translation:
  language: hi
  text: जिसने झूठ न बोलने की आज्ञा दी है, वह स्वयं तो और भी बढ़कर झूठ नहीं बोलेगा; क्योंकि परमेश्वर के लिए कुछ भी असम्भव नहीं है—सिवाय झूठ बोलने के।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραγγείλας
  choice: जिसने ... आज्ञा दी है
  rationale: कृदन्त को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है; यूनानी में आज्ञा पाने वाला कर्म स्पष्ट नहीं है, इसलिए ‘हमें’ नहीं जोड़ा गया।
- source_word: μὴ ψεύδεσθαι / ψεύσασθαι
  choice: झूठ न बोलने / झूठ बोलने
  rationale: दोनों स्थानों पर ψεύδομαι की समान शब्दावली रखकर मूल का आंतरिक संबंध सुरक्षित रखा गया है।
- source_word: πολλῷ μᾶλλον
  choice: तो और भी बढ़कर
  rationale: तार्किक बल ‘कितना अधिक’ को सहज, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: कर्ता पर यूनानी के बलाघात को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ἀδύνατον παρὰ τῷ θεῷ
  choice: परमेश्वर के लिए ... असम्भव
  rationale: παρά के सामर्थ्य-संबंधी अर्थ को स्वाभाविक हिन्दी मुहावरे में प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘परमेश्वर के लिए कुछ भी असम्भव नहीं’ और ‘सिवाय झूठ बोलने के’ के बीच कथित तनाव
  choice: अपवाद को मूल की तरह स्पष्ट रखा गया है
  alternative: इसे ‘परमेश्वर झूठ नहीं बोलता’ या ‘उसके स्वभाव के विरुद्ध है’ कहकर व्याख्यायित करना
  rationale: मूल εἰ μὴ τὸ ψεύσασθαι शाब्दिक और प्रभावशाली अपवाद प्रस्तुत करता है; अनुवाद को दार्शनिक व्याख्या जोड़कर इस तनाव को हल नहीं करना चाहिए।
- issue: आज्ञा का अप्रकट प्राप्तकर्ता
  choice: कोई कर्म (‘हमें’ आदि) नहीं जोड़ा गया
  alternative: ‘जिसने हमें झूठ न बोलने की आज्ञा दी’
  rationale: यूनानी μὴ ψεύδεσθαι में कर्ता/प्राप्तकर्ता संदर्भ से समझा जाता है पर वाक्य में व्यक्त नहीं है; हिन्दी में भी सामान्य आज्ञा के रूप में इसे खुला रखा जा सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘असम्भव’ और ‘परमेश्वर’ धार्मिक-नैतिक गद्य के अनुरूप हैं। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि अप्रकट कर्म को मुख्य पाठ में जोड़े बिना ही मूल की अस्पष्टता सुरक्षित है।
