  text: By the word of his majesty he established all things, and by a word he is able to overthrow them.
translation:
  language: hi
  text: उसने अपने प्रताप के वचन से सभी वस्तुओं को स्थापित किया, और वह एक वचन से उन्हें नष्ट कर सकता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λόγῳ
  choice: वचन से
  rationale: यह साधनसूचक प्रयोग है; ‘वचन से’ यूनानी का अर्थ स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है। पहले प्रयोग में निश्चितता सम्बन्धवाचक पदबंध ‘अपने प्रताप के’ से स्पष्ट होती है, जबकि दूसरे में ‘एक वचन से’ उसकी सहज सामर्थ्य पर बल देता है।
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: अपने प्रताप के
  rationale: μεγαλωσύνη यहाँ ईश्वरीय महिमा, महानता और राजसी वैभव का बोध कराता है; ‘प्रताप’ इस ऊँचे भाव को स्वाभाविक हिन्दी में समेटता है।
- source_word: συνεστήσατο
  choice: स्थापित किया
  rationale: मध्य रूप सहित क्रिया का अर्थ यहाँ अस्तित्व में लाना अथवा व्यवस्थित रूप से कायम करना है; ‘स्थापित किया’ मूल की औपचारिक व्यापकता बनाए रखता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का समष्टिगत अर्थ हिन्दी में स्वाभाविक रूप से ‘सब कुछ’ है।
- source_word: δύναται
  choice: कर सकता है
  rationale: वर्तमानकालीन सामर्थ्य को सीधे व्यक्त करता है।
- source_word: αὐτὰ καταστρέψαι
  choice: उसे नष्ट कर सकता है
  rationale: αὐτά का सम्बन्ध सामूहिक ‘सब कुछ’ से है, इसलिए हिन्दी में एकवचन ‘उसे’ स्वाभाविक है। καταστρέφω पलट देने से लेकर विनाश करने तक अर्थ दे सकता है; इस सृष्टि-विनाश विरोध में ‘नष्ट करना’ अभिप्रेत बल स्पष्ट करता है।
theological_decisions:
- issue: ‘वचन’ को व्यक्तिवाचक दैवी उपाधि मानना या सामान्य बोले गए आदेश के रूप में रखना
  choice: ‘वचन’ को सामान्य साधन/आदेश के अर्थ में रखा गया और उसका व्यक्तिकरण नहीं किया गया।
  alternative: ‘वचन’ को यूहन्नाई लोगोस के रूप में व्यक्तिवाचक समझकर विशेष धार्मिक संकेत देना।
  rationale: पाठ में λόγος के साथ ऐसा कोई स्पष्ट संकेत नहीं है जो उसे एक दैवी व्यक्ति की उपाधि ठहराए; वाक्य मुख्यतः परमेश्वर के आदेश की सृजनकारी और विनाशकारी सामर्थ्य बताता है।
- issue: καταστρέψαι की तीव्रता
  choice: ‘नष्ट कर सकता है’
  alternative: ‘उलट सकता है’ या ‘ढहा सकता है’
  rationale: सभी वस्तुओं को स्थापित करने के प्रतिलोम के रूप में यहाँ पूर्ण विनाश का अर्थ प्रबल है, यद्यपि मूल क्रिया में ‘उलट देना’ की चित्रात्मक छाया भी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य। ‘प्रताप’ ऊँचा किंतु सामान्य पाठक के लिए बोधगम्य धार्मिक-साहित्यिक शब्द है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
