source:
  edition: Funk 1901 (normalized OCR)
  text: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν αἱ ψυχαὶ ἡμῶν τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/001.yaml
  text: In this hope, then, let our souls be bound to the One who is faithful in his promises and righteous in his judgments.
translation:
  language: hi
  text: इसलिए, इसी आशा में[a] हमारी आत्माएँ उससे बँधी रहें, जो अपनी प्रतिज्ञाओं में विश्वासयोग्य और अपने न्याय-निर्णयों में धर्मी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी आशा के द्वारा।”
    reason: यूनानी दत्तिव पद ‘इसी आशा में’ बँधे रहने के क्षेत्र के साथ-साथ साधन या आधार का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: Ταύτῃ ... τῇ ἐλπίδι
  choice: इसी आशा में
  rationale: सम्बन्धकारक रूप यहाँ उस क्षेत्र या आधार को व्यक्त करता है जिसमें आत्माएँ बँधी रहती हैं; ‘इसी’ निकटवर्ती और विशिष्ट आशा पर बल देता है।
- source_word: προσδεδέσθωσαν
  choice: बँधी रहें
  rationale: पूर्ण निष्क्रिय आज्ञार्थक का भाव पहले से स्थापित और आगे भी बनी रहने वाली दशा है; इसलिए केवल ‘बँधें’ के बजाय ‘बँधी रहें’ चुना गया।
- source_word: τῷ πιστῷ
  choice: उससे ... जो ... विश्वासयोग्य
  rationale: सम्बन्धकारक रूप क्रिया के लक्ष्य को बताता है—आत्माएँ विश्वासयोग्य जन से बँधी रहें। विशेषण का संज्ञात्मक प्रयोग हिन्दी में स्वाभाविक सम्बन्धवाचक वाक्य से व्यक्त किया गया।
- source_word: ἐν ταῖς ἐπαγγελίαις
  choice: अपनी प्रतिज्ञाओं में
  rationale: बहुवचन और क्षेत्रगत अर्थ सुरक्षित हैं; आत्मवाचक ‘अपनी’ हिन्दी में उसी कर्ता से प्रतिज्ञाओं का सम्बन्ध स्पष्ट करता है।
- source_word: ἐν τοῖς κρίμασιν
  choice: अपने न्याय-निर्णयों में
  rationale: κρίματα के निर्णय और न्याय, दोनों पहलुओं को ‘न्याय-निर्णय’ व्यक्त करता है और बहुवचन सुरक्षित रखता है।
theological_decisions:
- issue: τῷ πιστῷ और τῷ δικαίῳ का निहित संदर्भ
  choice: ‘उससे, जो ... विश्वासयोग्य ... और ... धर्मी है’
  alternative: संज्ञा जोड़कर ‘परमेश्वर से’ कहना
  rationale: सन्दर्भ सम्भवतः परमेश्वर की ओर संकेत करता है, पर इस वाक्य में नाम स्पष्ट रूप से नहीं आया; सर्वनाम और सम्बन्धवाचक रचना मूल पाठ की निहितता बनाए रखती है।
- issue: ταύτῃ τῇ ἐλπίδι का वाक्यगत सम्बन्ध
  choice: इसे बँधे रहने के क्षेत्र/आधार के रूप में प्रस्तुत करना
  alternative: आशा को वह वस्तु मानना जिससे आत्माएँ बँधी हैं
  rationale: προσδέω के साथ τῷ πιστῷ बँधने के लक्ष्य के रूप में अधिक स्वाभाविक है; आरम्भिक सम्बन्धकारक पद को क्षेत्र या साधन मानना यूनानी वाक्य-विन्यास से बेहतर मेल खाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘आत्माएँ’, ‘प्रतिज्ञाएँ’, ‘विश्वासयोग्य’ और ‘धर्मी’ मूल धार्मिक अभिव्यक्ति को बनाए रखते हैं; ‘बँधी रहें’ यूनानी पूर्ण आज्ञार्थक की स्थायी दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
