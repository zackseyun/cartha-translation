  to: सब कुछ उसके सामने है, और उसके विचार से कुछ भी छिपा नहीं है।
  rationale: मुख्य पाठ में ‘योजना’ को ‘विचार’ से बदला गया है, ताकि λέληθεν का ‘ज्ञान/ध्यान से ओझल रहने’ का भाव स्वाभाविक हिन्दी में आए और βουλή के विचार-विमर्शात्मक अर्थ को यथासंभव बनाए रखा जाए। पादटिप्पणी वैकल्पिक ‘अभिप्राय’ तथा शब्द के व्यापक अर्थ-क्षेत्र को सुरक्षित रखती है।
