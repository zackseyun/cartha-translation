  yaml_path: translation/extra_canonical/1_clement/027/006.yaml
  text: All things are before him[a], and nothing has escaped his counsel.
translation:
  language: hi
  text: सब कुछ उसके सामने है, और उसके विचार से कुछ भी छिपा नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: यह सर्वसमावेशी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यूनानी स्थान-सूचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: λέληθεν
  choice: छिपा नहीं है
  rationale: λανθάνω के पूर्णकालीन रूप का आशय किसी की दृष्टि या जानकारी से ओझल रहना है; यह किसी योजना को विफल करने का अर्थ नहीं देता।
- source_word: βουλή
  choice: योजना
  rationale: यहाँ शब्द ईश्वर के विचारित परामर्श, अभिप्राय या उद्देश्य को सूचित करता है। ‘योजना’ साधारण पाठक के लिए सहज है, जबकि पादटिप्पणी मूल शब्द की व्यापकता सुरक्षित रखती है।
theological_decisions:
- issue: βουλή का अर्थ-क्षेत्र
  choice: योजना
  alternative: अभिप्राय; संकल्प; परामर्श
  rationale: मूल शब्द परामर्श से बने उद्देश्य या योजना को व्यक्त कर सकता है। मुख्य पाठ में सहज हिन्दी रखी गई है और किसी विशेष धर्मवैज्ञानिक अर्थ को निर्णायक नहीं बनाया गया।
- issue: λέληθεν का आशय
  choice: से कुछ भी छिपा नहीं है
  alternative: की दृष्टि से कुछ भी ओझल नहीं हुआ है
  rationale: इससे ईश्वर के ज्ञान से कुछ भी बच न निकलने का संज्ञानात्मक भाव बना रहता है; इसे उसकी योजना के विफल होने के अर्थ में नहीं लिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘सब कुछ उसके सामने है’ मूल की औपचारिक संरचना बनाए रखता है; ‘छिपा नहीं है’ स्वाभाविक हिन्दी में λέληθεν का संज्ञानात्मक भाव व्यक्त करता है।
