    reason: βουλή के अर्थ-क्षेत्र में परामर्श, अभिप्राय, योजना और उद्देश्य सम्मिलित हो सकते हैं; हिन्दी का कोई एक शब्द इन सभी छायाओं को पूरी तरह नहीं समेटता।
