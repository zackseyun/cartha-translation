  text: διὸ μὴ διψυχῶμεν, μηδὲ ἐνδυλλιεσθω ἡ ψυχὴ ἡμῶν ἐπὶ ταῖς ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/002.yaml
  text: Therefore let us not be double-minded[a], nor let our soul be doubtful concerning his surpassing and glorious gifts.
translation:
  language: hi
  text: इसलिए हम दो मन के न हों[a], और न ही हमारा मन उसके असाधारण और महिमामय वरदानों के विषय में संदेह करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् दुविधा में पड़े या भीतर से बँटे हुए न हों।
    reason: διψυχέω का शाब्दिक बिंब ‘दो मन का होना’ है और इसका आशय डाँवाडोल या आंतरिक रूप से विभाजित होना भी हो सकता है।
lexical_decisions:
- source_word: διψυχῶμεν
  choice: हम दो मन के न हों
  rationale: शाब्दिक बिंब ‘दो मन’ को बनाए रखते हुए यह मानसिक विभाजन और डाँवाडोल होने का भाव व्यक्त करता है।
- source_word: ἐνδυλλιεσθω
  choice: संदेह करे
  rationale: पाठ का यह रूप वर्तनीगत/OCR अस्थिरता लिए हुए है और प्रसंग में ἰνδάλλομαι के अर्थ ‘हिचकना, संशय करना’ की ओर संकेत करता है; इसलिए इसे पहले पद की केवल पुनरावृत्ति न बनाकर संदेह के रूप में अनूदित किया गया है।
- source_word: ὑπερβαλλούσαις
  choice: असाधारण
  rationale: यह परम श्रेष्ठता और सामान्य सीमा से बढ़कर होने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐνδόξοις δωρεαῖς
  choice: महिमामय वरदानों
  rationale: ‘महिमामय’ ἐνδόξοις के गौरवपूर्ण भाव को और ‘वरदान’ δωρεαῖς के अनुग्रहपूर्वक दिए गए उपहार को सुरक्षित रखता है।
- source_word: ἡ ψυχὴ ἡμῶν
  choice: हमारा मन
  rationale: यहाँ ψυχή संशय करने वाले आंतरिक व्यक्तित्व को सूचित करता है; हिन्दी में ‘हमारा मन संदेह करे’ स्वाभाविक है, जबकि ‘हमारी आत्मा संदेह करे’ अनावश्यक रूप से तकनीकी सुनाई देता।
theological_decisions:
- issue: परमेश्वर के वरदानों के प्रति चेतावनी का स्वर
  choice: ‘संदेह करे’ के द्वारा वरदानों की वास्तविकता या विश्वसनीयता पर संशय का खुला भाव रखा गया है।
  alternative: ‘हिचकिचाए’ या ‘भीतर से बँटा रहे’
  rationale: ἰνδάλλομαι के संदर्भगत अर्थ को ‘संदेह’ अधिक स्पष्टता से व्यक्त करता है और διψυχῶμεν के ‘दो मन’ वाले भाव से अनावश्यक समानता नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘दो मन के’ मूल यूनानी बिंब को बनाए रखता है; पादटिप्पणी उसका स्वाभाविक आशय स्पष्ट करती है।
