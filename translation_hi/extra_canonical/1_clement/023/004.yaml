  text: ὦ ἀνόητοι, συμβάλετε ἑαυτοὺς ξύλῳ· λάβετε ἄμπελον· πρῶτον μὲν φυλλορροεῖ, εἶτα βλαστὸς γίνεται, εἶτα φύλλον, εἶτα ἄνθος, καὶ μετὰ ταῦτα ὄμφαξ, εἶτα σταφυλὴ παρίστανται. ὁρᾶτε, ὅτι ἐν καιρῷ ὀλίγῳ εἰς πέπειρον καταντᾷ ὁ καρπὸς τοῦ ξύλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/004.yaml
  text: 'You foolish ones[a], compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these the unripe grape and then the full cluster appear. You see that in a short time the fruit of the tree comes to maturity.'
translation:
  language: hi
  text: हे नासमझ लोगो, अपनी तुलना एक वृक्ष से करो—अंगूर की बेल को लो। पहले उसके पत्ते झड़ते हैं, फिर अंकुर निकलता है, फिर पत्ता, फिर फूल; और इनके बाद कच्चे अंगूर और फिर अंगूर के गुच्छे दिखाई देते हैं। तुम देखते हो कि थोड़े ही समय में वृक्ष का फल परिपक्व हो जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόητοι
  choice: निर्बुद्धि लोगो
  rationale: यह संबोधन बौद्धिक या आत्मिक नासमझी को सीधे व्यक्त करता है, पर आधुनिक हिन्दी में स्वाभाविक भी रहता है।
- source_word: συμβάλετε ἑαυτοὺς ξύλῳ
  choice: अपने-आपको एक पेड़ से मिलाकर देखो
  rationale: συμβάλλω के यहाँ तुलना करने के अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἄμπελον
  choice: अंगूर की बेल
  rationale: यह यूनानी शब्द विशेष रूप से दाखलता या अंगूर की बेल के लिए है।
- source_word: ὄμφαξ
  choice: कच्चा अंगूर
  rationale: यह अपरिपक्व, अभी न पके अंगूर को दर्शाता है।
- source_word: σταφυλή
  choice: अंगूर का पूरा गुच्छा
  rationale: क्रम में विकसित अवस्था को दिखाते हुए शब्द के ‘अंगूर के गुच्छे’ वाले अर्थ को रखा गया है; ‘पूरा’ परिपक्व रूप से पहले की दृश्य पूर्णता को स्वाभाविक बनाता है।
- source_word: εἰς πέπειρον καταντᾷ
  choice: पक जाता है
  rationale: फल के परिपक्व अवस्था तक पहुँचने का स्वाभाविक हिन्दी रूप है।
