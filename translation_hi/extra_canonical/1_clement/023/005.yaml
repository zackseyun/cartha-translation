base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/005.yaml
  text: Truly, his will shall be accomplished quickly and suddenly, as the Scripture also bears witness, saying, “Quickly he will come and will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”
translation:
  language: hi
  text: 'सचमुच, उसकी इच्छा शीघ्र और अचानक पूरी होगी। पवित्रशास्त्र भी इसकी गवाही देता है: “वह शीघ्र आएगा और देर नहीं करेगा,” और “अचानक प्रभु अपने मंदिर में आएगा, और वह पवित्र जन, जिसकी तुम प्रतीक्षा करते हो।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और वह पवित्र जन” का यूनानी वाक्यांश प्रभु के लिए दूसरा संबोधन भी हो सकता है—अर्थात्, “प्रभु… वह पवित्र जन, जिसकी तुम प्रतीक्षा करते हो।”
    reason: मूल यूनानी में संयोजक καί के कारण “पवित्र जन” को अलग समन्वित पद या “प्रभु” के समानाधिकरण के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: सचमुच
  rationale: यह यूनानी पद कथन की सत्यता पर बल देता है; ‘सचमुच’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τελειωθήσεται τὸ θέλημα αὐτοῦ
  choice: उसकी इच्छा ... पूरी होगी
  rationale: निष्क्रिय क्रिया और ‘इच्छा’ के अर्थ को सीधे बनाए रखता है, बिना कर्ता या कार्यान्वयन की विधि जोड़े।
- source_word: ταχὺ καὶ ἐξαίφνης
  choice: शीघ्र और अचानक
  rationale: 'दोनों क्रियाविशेषणों का अलग बल सुरक्षित है: एक निकटता/त्वरितता और दूसरा अनपेक्षित आकस्मिकता व्यक्त करता है।'
- source_word: συνεπιμαρτυρούσης ... τῆς γραφῆς
  choice: पवित्रशास्त्र भी इसकी गवाही देता है
  rationale: ‘भी’ सहायक/संयुक्त साक्ष्य का भाव व्यक्त करता है; ‘पवित्रशास्त्र’ धार्मिक साहित्यिक संदर्भ में स्पष्ट और प्रचलित है।
- source_word: οὐ χρονιεῖ
  choice: देर नहीं करेगा
  rationale: भविष्यकालीन विलंब न करने के सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ ἅγιος
  choice: वह पवित्र जन
  rationale: विशेषण के संज्ञात्मक प्रयोग को व्यक्ति-सूचक रूप में व्यक्त करता है और उसे किसी अधिक विशिष्ट उपाधि से नहीं बदलता।
- source_word: προσδοκᾶτε
  choice: प्रतीक्षा करते हो
  rationale: अपेक्षापूर्ण प्रतीक्षा का सीधा, आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: ὁ κύριος और ὁ ἅγιος का पारस्परिक संबंध
  choice: मुख्य पाठ में ‘और वह पवित्र जन भी’ रखकर दोनों पदों को व्याकरणतः अलग दिखाया गया है।
  alternative: ‘अर्थात् वह पवित्र जन’ या ‘वही पवित्र जन’ द्वारा दोनों को स्पष्टतः एक ही व्यक्ति मानना।
  rationale: यूनानी καί अलग पद या व्याख्यात्मक समानाधिकरण—दोनों की संभावना दे सकता है। पाठ को किसी एक धर्मवैज्ञानिक पहचान में चुपचाप सीमित न करने के लिए संयोजक संरक्षित है और पादटिप्पणी में अस्पष्टता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। उद्धरणों की भविष्यकालीन दृढ़ता, ‘शीघ्र’ और ‘अचानक’ का भेद, तथा अंतिम पद की वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
