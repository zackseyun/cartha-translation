id: 1CLEM.23.3
reference: 1 Clement 23:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: πόρρω γενέσθω ἀφ’ ἡμῶν ἡ γραφὴ αὕτη, ὅπου λέγει· Ταλαίπωροί εἰσιν οἱ δίψυχοι, οἱ διατάζοντες τῇ ψυχῇ, οἱ λέγοντες· Ταῦτα ἠκούσαμεν καὶ ἐπὶ τῶν πατέρων ἡμῶν, καὶ ἰδοὺ, γηράσκομεν, καὶ οὐδὲν ἡμῖν τούτων συνέβηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/003.yaml
  text: Let this scripture be far from us[a], where it says, “Wretched are the double-minded, those who doubt in their soul, who say, ‘These things we heard even in the days of our fathers, and behold, we have grown old, and none of these things has happened to us.’”
translation:
  language: hi
  text: यह शास्त्रवचन हमसे बहुत दूर रहे[a], जिसमें कहा गया है, “अभागे हैं वे जो दुचित्ते हैं, जो अपने मन में संदेह करते हैं और कहते हैं, ‘ये बातें हमने अपने पूर्वजों के समय में भी सुनी थीं; और देखो, हम बूढ़े हो गए हैं, फिर भी इनमें से कुछ भी हमारे साथ नहीं हुआ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह शास्त्रवचन हमसे दूर हो।”
    reason: ग्रीक में तृतीय-पुरुष आज्ञार्थक γενέσθω है। मुख्य पाठ πόρρω के ‘बहुत दूर’ बल को स्पष्ट करता है; वैकल्पिक रूप अधिक संक्षिप्त हिन्दी वाक्य-विन्यास देता है।
lexical_decisions:
- source_word: ἡ γραφὴ αὕτη
  choice: यह धर्मशास्त्र-वचन
  rationale: यहाँ γραφή किसी उद्धृत पवित्र लिखित वचन को दर्शाता है। केवल ‘लेख’ अस्पष्ट होता, जबकि ‘धर्मशास्त्र-वचन’ आधुनिक हिन्दी पाठक को उद्धरण की धार्मिक और लिखित प्रकृति दोनों बताता है।
- source_word: δίψυχοι
  choice: दुचित्ते
  rationale: शाब्दिक अर्थ ‘दो मन वाले’ है। ‘दुचित्ते’ अनिर्णय और विभाजित निष्ठा की मूल छवि को संक्षेप में बनाए रखता है।
- source_word: διατάζοντες τῇ ψυχῇ
  choice: अपने मन में संदेह करते हैं
  rationale: इस कठिन पद का आशय भीतर संदेह करने या डगमगाने से है। स्वाभाविक हिन्दी में ‘मन में संदेह’ अर्थ को स्पष्ट रखता है, बिना विभाजित मन की पिछली छवि को अनावश्यक रूप से दोहराए।
- source_word: ἐπὶ τῶν πατέρων ἡμῶν
  choice: अपने पूर्वजों के समय में भी
  rationale: ἐπί के कालगत प्रयोग और πατέρων के वंशगत अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐδὲν ἡμῖν τούτων συνέβηκεν
  choice: इनमें से कुछ भी हमारे साथ नहीं हुआ
  rationale: συνέβηκεν की घटना घटित होने की भाषा को सीधे और स्वाभाविक रूप में प्रस्तुत करता है।
theological_decisions:
- issue: उद्धृत वचन को ‘धर्मशास्त्र’ मानने की भाषा
  choice: ‘धर्मशास्त्र-वचन’ रखा गया
  alternative: ‘यह लेख’ या ‘यह शास्त्र’
  rationale: लेखक स्वयं γραφή कहकर एक अधिकृत लिखित वचन उद्धृत करता है। अनिश्चित उद्धरण-स्रोत की पहचान तय किए बिना इस दावे को बनाए रखा गया है।
- issue: δίψυχοι में निहित नैतिक या बौद्धिक दोष
  choice: ‘दुचित्ते’ और फिर ‘मन में संदेह’
  alternative: ‘दो मन वाले’ या ‘डगमगाने वाले’
  rationale: मूल में विभाजित मन और संदेह दोनों का तनाव है। अनुवाद किसी एक व्यवस्थित धार्मिक अर्थ तक इसे सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘दुचित्ते’ कुछ साहित्यिक है, पर मूल की सजीव ‘दो मन’ वाली छवि को सुरक्षित रखता है; आसपास का सरल वाक्य उसका अर्थ स्पष्ट करता है।
