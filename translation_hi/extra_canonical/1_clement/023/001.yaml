id: 1CLEM.23.1
reference: 1 Clement 23:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατὴρ ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν, ἠπίως τε καὶ προσηνῶς τὰς χάριτας αὐτοῦ ἀποδίδοι τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/001.yaml
  text: The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.
translation:
  language: hi
  text: हर बात में दयालु और उपकारी पिता उन पर हार्दिक करुणा रखता है जो उसका भय मानते हैं, और जो निष्कपट मन से उसके पास आते हैं, उन्हें वह नम्रता और स्नेह से अपनी कृपाएँ प्रदान करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ οἰκτίρμων
  choice: दयालु
  rationale: यह शब्द करुणा और दया से भरे स्वभाव को व्यक्त करता है; आधुनिक हिन्दी में ‘दयालु’ सहज और गरिमापूर्ण है।
- source_word: κατὰ πάντα καὶ εὐεργετικὸς
  choice: हर प्रकार से ... भलाई करने वाला
  rationale: κατὰ πάντα को ‘हर प्रकार से’ और εὐεργετικός को सक्रिय रूप से भलाई करने वाले के अर्थ में रखा गया है।
- source_word: ἔχει σπλάγχνα ἐπὶ
  choice: के प्रति गहरी करुणा रखता है
  rationale: शाब्दिक रूप से ‘अंतरंग अंग/अंतड़ियाँ रखना’ गहरे स्नेह और करुणा का सामी मुहावरा है; हिन्दी में अर्थानुकूल स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: τοὺς φοβουμένους αὐτόν
  choice: अपने डरवैयों
  rationale: ‘डरवैये’ यहाँ श्रद्धापूर्ण भय रखने वालों को संक्षेप और स्पष्ट रूप से दर्शाता है।
- source_word: ἠπίως τε καὶ προσηνῶς
  choice: कोमलता और कृपापूर्वक
  rationale: दोनों क्रियाविशेषणों के सौम्य, नम्र और अनुकूल व्यवहार के संयुक्त भाव को बनाए रखा गया है।
- source_word: τὰς χάριτας αὐτοῦ
  choice: अपने अनुग्रह के वरदान
  rationale: χάριτας बहुवचन है और अनुग्रह से मिलने वाले उपकारों अथवा वरदानों को सूचित कर सकता है; इस वाक्य में दोनों पहलुओं को समेटने वाली अभिव्यक्ति चुनी गई है।
- source_word: ἁπλῇ διανοίᾳ
  choice: निष्कपट मन से
  rationale: ἁπλοῦς का भाव सरल, अखंड और कपटरहित अभिप्राय है; ‘निष्कपट मन’ आधुनिक हिन्दी में स्वाभाविक है और ‘एकाग्र’ जैसे संकुचित अर्थ से बचता है।
theological_decisions:
- issue: φοβεῖσθαι में भय और श्रद्धा का संबंध
  choice: अपने डरवैयों
  alternative: जो उसका भय मानते हैं / जो उसके प्रति श्रद्धा रखते हैं
  rationale: मूल के ‘भय’ संबंधी शब्द को हटाकर केवल श्रद्धा नहीं किया गया; ‘डरवैये’ धार्मिक सन्दर्भ में भय मानने वालों का सीधा अर्थ बनाए रखता है।
- issue: χάριτας का अर्थक्षेत्र
  choice: अनुग्रह के वरदान
  alternative: कृपाएँ / अनुग्रहपूर्ण उपकार
  rationale: बहुवचन और दैवी कृपा दोनों को व्यक्त किया गया है, बिना इसे केवल आध्यात्मिक वरदानों की तकनीकी श्रेणी तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य की मुख्य संरचना और ईश्वर के पितृत्व, करुणा तथा अनुग्रह के भाव सुरक्षित हैं।
