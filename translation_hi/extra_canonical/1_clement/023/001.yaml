revisions:
- from: हर प्रकार से दयालु और भलाई करने वाला पिता अपने डरवैयों के प्रति गहरी करुणा रखता है, और जो निष्कपट मन से उसके पास आते हैं, उन्हें वह कोमलता और कृपापूर्वक अपने अनुग्रह के वरदान देता है।
  to: हर बात में दयालु और उपकारी पिता उन पर हार्दिक करुणा रखता है जो उसका भय मानते हैं, और जो निष्कपट मन से उसके पास आते हैं, उन्हें वह नम्रता और स्नेह से अपनी कृपाएँ प्रदान करे।
  rationale: The revision replaces a colloquial and potentially pejorative expression with dignified standard Hindi, preserves the optative force of ἀποδίδοι, and renders χάριτας and the paired adverbs without unnecessary theological narrowing or repetition. No footnote is needed because the translation itself retains the relevant ambiguity.
  reviewer_model: gpt-5.6-terra
