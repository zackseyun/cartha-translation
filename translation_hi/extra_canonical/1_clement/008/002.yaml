id: 1CLEM.8.2
reference: 1 Clement 8:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/002.yaml
  text: 'And the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his repentance,” adding also a good judgment:'
translation:
  language: hi
  text: 'और सबके स्वामी ने स्वयं भी मन फिराव के विषय में शपथ खाकर कहा: “प्रभु कहता है, ‘मेरे जीवन की शपथ, मैं पापी की मृत्यु से अधिक उसके मन फिराव को चाहता हूँ,’” और एक उत्तम विचार भी जोड़ते हुए कहा:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और एक उत्तम निर्णय भी जोड़ते हुए कहा:”
    reason: γνώμη का अर्थ प्रसंगानुसार ‘विचार’, ‘मत’, ‘निर्णय’ या ‘घोषणा’ हो सकता है। यहाँ यह आगे आने वाले अतिरिक्त कथन को प्रस्तुत करता है; ‘निर्णय’ उसकी वैकल्पिक निर्णयात्मक छाया को दर्शाता है।
lexical_decisions:
- source_word: δεσπότης τῶν ἁπάντων
  choice: सबके स्वामी
  rationale: यह पदबंध सार्वभौम अधिकार रखने वाले स्वामी को दर्शाता है; ‘सबके स्वामी’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: μετάνοια
  choice: मन फिराव
  rationale: यह केवल पछतावे से अधिक, मन और दिशा के परिवर्तन को व्यक्त करता है; प्रसंग में संज्ञा के रूप में इसे लगातार रखा गया है।
- source_word: μετὰ ὅρκου
  choice: शपथ खाकर
  rationale: यूनानी पदबंध का स्वाभाविक हिन्दी रूप, जो कथन की शपथयुक्त गंभीरता बनाए रखता है।
- source_word: οὐ βούλομαι ... ὡς
  choice: मैं ... नहीं, बल्कि ... चाहता हूँ
  rationale: 'यहाँ तुलना/वरीयता का आशय है: पापी की मृत्यु के विपरीत उसका मन फिराव प्रभु की इच्छा है। हिन्दी में ‘नहीं, बल्कि’ इस विरोध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: γνώμην ἀγαθήν
  choice: उत्तम वचन
  rationale: अगले पद में आने वाली अतिरिक्त कथित घोषणा की भूमिका होने के कारण γνώμη को यहाँ केवल निजी ‘विचार’ या ‘इरादा’ नहीं, बल्कि व्यक्त किया गया वचन समझना प्रसंगानुकूल है।
theological_decisions:
- issue: पापी की मृत्यु और मन फिराव के बीच दैवी इच्छा का संबंध
  choice: “मैं पापी की मृत्यु नहीं, बल्कि उसका मन फिराव चाहता हूँ”
  alternative: “मैं पापी की मृत्यु की अपेक्षा उसका मन फिराव अधिक चाहता हूँ”
  rationale: यूनानी οὐ ... ὡς में तुलनात्मक भाव संभव है, पर यह यहेजकेल-संबंधी कथन का स्पष्ट विरोध भी व्यक्त करता है। चुना हुआ रूप प्राकृतिक हिन्दी में उस विरोध को रखता है, बिना कोई अतिरिक्त सिद्धान्त जोड़ने के।
- issue: γνώμη का अर्थ
  choice: उत्तम वचन
  alternative: उत्तम निर्णय / उत्तम अभिप्राय
  rationale: यह पद अगले उद्धरण की ओर ले जाता है, इसलिए बोले गए कथन का अर्थ प्रसंग में अधिक संगत है; ‘निर्णय’ न्यायिक अर्थ का अनावश्यक भार ला सकता है और ‘अभिप्राय’ कथित घोषणा को अस्पष्ट कर देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बाइबिलीय शपथ-सूत्र Ζῶ γὰρ ἐγώ को शाब्दिक रूप से अस्वाभाविक ‘क्योंकि मैं जीवित हूँ’ के बजाय प्रचलित हिन्दी ‘मेरे जीवन की शपथ’ किया गया है। उद्धरण-विन्यास से ‘प्रभु कहता है’ और प्रभु के कथन का संबंध स्पष्ट किया गया है।
