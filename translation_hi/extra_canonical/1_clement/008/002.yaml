  naturalness: The Hindi is generally clear and dignified. ‘पापी की मृत्यु से अधिक उसके मन फिराव को चाहता हूँ’ is both natural and closer to the Greek comparison. ‘एक उत्तम विचार भी जोड़ते हुए’ suitably introduces the following saying.
  terminology: ‘सबके स्वामी’ and ‘मन फिराव’ are consistent, comprehensible choices for δεσπότης τῶν ἁπάντων and μετάνοια. ‘मेरे जीवन की शपथ’ is an idiomatic Hindi oath formula for Ζῶ γὰρ ἐγώ. For γνώμην ἀγαθήν, ‘उत्तम विचार’ avoids imposing a narrowly judicial sense while retaining the sense of a favorable additional statement.
  issues:
