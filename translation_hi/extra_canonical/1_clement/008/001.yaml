  text: परमेश्वर के अनुग्रह के सेवकों ने पवित्र आत्मा के द्वारा मन फिराव के विषय में बोले,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργοὶ
  choice: सेवकों
  rationale: यहाँ शब्द परमेश्वर की ओर से सेवा करने वालों के लिए है; ‘सेवक’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से किसी विशिष्ट कलीसियाई पद का संकेत नहीं देता।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: ‘अनुग्रह’ χάρις का प्रचलित और धर्मवैचारिक रूप से पर्याप्त हिन्दी प्रतिशब्द है।
- source_word: διὰ πνεύματος ἁγίου
  choice: पवित्र आत्मा के द्वारा
  rationale: διά के माध्यम/साधन वाले अर्थ को स्पष्ट रखते हुए यूनानी वाक्य की संरचना संरक्षित की गई है।
- source_word: μετανοίας
  choice: मन-फिराव
  rationale: μετάνοια में सोच, मन और जीवन-दिशा के परिवर्तन का भाव है; ‘मन-फिराव’ इसे केवल खेद या पछतावे तक सीमित नहीं करता।
- source_word: ἐλάλησαν
  choice: कहा
  rationale: सामान्य भूतकालीन कथन के लिए सहज हिन्दी; बहुवचन कर्ता के साथ ‘कहा’ स्वाभाविक है।
theological_decisions:
- issue: ‘परमेश्वर के अनुग्रह के सेवक’ का संबंध
  choice: संबंधसूचक संरचना को यथावत रखा गया
  alternative: अनुग्रह की सेवा करने वाले / अनुग्रह प्रदान करने वाले सेवक
  rationale: मूल यूनानी का संबंध व्यापक और कुछ हद तक खुला है; अनुवाद यह निश्चित नहीं करता कि वे अनुग्रह की सेवा करते हैं या उसके माध्यम हैं।
- issue: पवित्र आत्मा की भूमिका
  choice: ‘के द्वारा’
  alternative: पवित्र आत्मा में / पवित्र आत्मा की प्रेरणा से
  rationale: διά + संबंधकारक सामान्यतः माध्यम को व्यक्त करता है; ‘प्रेरणा से’ संभावित अर्थ है, पर मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सापेक्ष शैली। पद के अंत का अल्पविराम रखा गया है क्योंकि यूनानी में कथन आगे जारी रहता है।
