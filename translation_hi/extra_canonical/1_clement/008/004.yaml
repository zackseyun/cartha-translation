  text: καὶ ἐν ἑτέρῳ τόπῳ λέγει οὕτως· Λούσασθε καὶ καθαροὶ γένεσθε, ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου· παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν, μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίσιν, ῥύσασθε ἀδικούμενον, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν· καὶ δεῦτε καὶ διελεγχθῶμεν, λέγει κύριος· καὶ ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡς χιόνα λευκανῶ· ἐὰν δὲ ὦσιν ὡς κόκκινον, ὡς ἔριον λευκανῶ· καὶ ἐὰν θέλητε καὶ εἰσακούσητέ μου, τὰ ἀγαθὰ τῆς γῆς φάγεσθε· ἐὰν δὲ μὴ θέλητε μηδὲ εἰσακούσητέ μου, μάχαιρα ὑμᾶς κατέδεται· τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/004.yaml
  text: 'And in another place he says thus: “Wash and become clean; remove your wicked deeds from before my eyes[a], from your souls; cease from your wickednesses, learn to do good, seek justice, rescue the one being wronged, judge for the orphan, and give justice to the widow. And come, and let us reason together,” says the Lord. “Even if your sins are like crimson, I will whiten them like snow; and if they are like scarlet, I will whiten them like wool. But if you are willing and listen to me, you shall eat the good things of the land; but if you are not willing and do not listen to me, a sword will devour you; for the mouth of the Lord has spoken these things.”'
translation:
  language: hi
  text: 'और एक और स्थान पर वह इस प्रकार कहता है: “अपने को धोओ और शुद्ध हो जाओ; अपनी बुराइयों को अपनी आत्माओं से, मेरी आँखों के सामने हटा दो। अपनी बुराइयाँ करना छोड़ दो; भलाई करना सीखो; न्याय की खोज करो; जिस पर अत्याचार हो रहा है उसे बचाओ; अनाथ के लिए न्याय करो और विधवा को न्याय दिलाओ। आओ, हम आपस में वाद-विवाद करें,” प्रभु कहता है। “यदि तुम्हारे पाप किरमिजी रंग के समान हों, तो मैं उन्हें बर्फ के समान सफेद कर दूँगा; और यदि वे सुर्ख लाल रंग के समान हों, तो मैं उन्हें ऊन के समान सफेद कर दूँगा। यदि तुम तैयार हो और मेरी बात सुनो, तो तुम भूमि की अच्छी वस्तुएँ खाओगे; पर यदि तुम तैयार न हो और मेरी बात न सुनो, तो तलवार तुम्हें खा जाएगी; क्योंकि प्रभु के मुँह ने ये बातें कही हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαροὶ γένεσθε
  choice: शुद्ध हो जाओ
  rationale: परिणामसूचक यूनानी अभिव्यक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: ἐκζητήσατε κρίσιν
  choice: न्याय की खोज करो
  rationale: क्रिया की सक्रिय और आग्रहपूर्ण शक्ति तथा κρίσις के न्याय-संबंधी अर्थ को बनाए रखता है।
- source_word: ῥύσασθε ἀδικούμενον
  choice: जिस पर अत्याचार हो रहा है उसे बचाओ
  rationale: वर्तमान कृदंत पीड़ित व्यक्ति पर जारी अन्याय को सूचित करता है; ‘बचाओ’ ῥύομαι के उद्धारात्मक बल को व्यक्त करता है।
- source_word: κρίνατε ὀρφανῷ
  choice: अनाथ को न्याय दिलाओ
  rationale: शाब्दिक ‘अनाथ के लिए न्याय करो’ का स्वाभाविक हिन्दी रूप, जिसमें उसके पक्ष में न्यायिक कार्रवाई का भाव सुरक्षित है।
- source_word: δικαιώσατε χήραν
  choice: विधवा के पक्ष में न्याय करो
  rationale: विधवा के न्यायोचित दावे को मान्यता देने का भाव रखता है, बिना इसे केवल निजी सहायता तक सीमित किए।
- source_word: διελεγχθῶμεν
  choice: हम आपस में अपना मामला सुलझाएँ
  rationale: पारस्परिक विचार, परीक्षण या विवाद-निपटारे की अर्थ-सीमा को सामान्य पाठक के लिए स्वाभाविक रूप से व्यक्त करता है।
- source_word: φοινικοῦν / κόκκινον
  choice: किरमिजी रंग / सुर्ख लाल रंग
  rationale: दो निकटवर्ती गहरे लाल रंगों के बीच स्रोत में उपस्थित भेद को यथासंभव बनाए रखता है।
- source_word: τὰ ἀγαθὰ τῆς γῆς
  choice: देश की उत्तम उपज
  rationale: भूमि के ‘अच्छे पदार्थों’ का संदर्भ कृषि-समृद्धि से है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: दुष्टताओं को हटाने वाले वाक्यांश में ἀπὸ τῶν ψυχῶν ὑμῶν और ἀπέναντι τῶν ὀφθαλμῶν μου का संबंध
  choice: अपनी दुष्टताओं को अपनी आत्माओं से, मेरी आँखों के सामने से दूर करो
  alternative: मेरी आँखों के सामने अपनी आत्माओं से दुष्टताओं को दूर करो
  rationale: मुख्य पाठ यूनानी पदक्रम और दोनों ‘से’ वाक्यांशों की तनावपूर्ण निकटता को सुरक्षित रखता है; पादटिप्पणी अधिक सहज वैकल्पिक संबंध बताती है।
- issue: διελεγχθῶμεν में परमेश्वर और लोगों के बीच संवाद या न्यायिक विवाद का स्वर
  choice: हम आपस में अपना मामला सुलझाएँ
  alternative: हम आपस में वाद-विवाद करें
  rationale: चुना गया रूप पारस्परिकता और मामले की जाँच/निपटारे दोनों को रखता है, पर परमेश्वर के निमंत्रण को केवल बौद्धिक तर्क-वितर्क नहीं बनाता।
- issue: शर्तों में मानवीय इच्छा और आज्ञापालन
  choice: यदि तुम तैयार हो और मेरी बात सुनो
  alternative: यदि तुम चाहो और मेरी आज्ञा मानो
  rationale: θέλητε की इच्छा/तत्परता और εἰσακούσητε के ध्यान देकर सुनने के अर्थ को अलग-अलग रखा गया है; किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध आदेशात्मक रूप अपनाया गया है। उद्धरण की भविष्यद्वक्ताई लय बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ न्यायिक शब्दावली से बचा गया है। ‘आत्माओं’ बहुवचन को स्रोत के ψυχῶν के अनुरूप रखा गया है।
