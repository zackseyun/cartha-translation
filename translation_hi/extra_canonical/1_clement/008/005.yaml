  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/005.yaml
  text: Therefore[a], desiring all his beloved ones to share in repentance, he established it by his almighty will.
translation:
  language: hi
  text: इसलिए परमेश्वर ने, यह चाहकर कि उसके सभी प्रिय जन पश्चाताप में सहभागी हों, अपनी सर्वशक्तिमान इच्छा से इसे दृढ़ ठहराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας ... τοὺς ἀγαπητοὺς αὐτοῦ
  choice: उसके सभी प्रिय जन
  rationale: यह पदबंध परमेश्वर के उन सब लोगों को दर्शाता है जो उसके प्रिय हैं; ‘प्रिय जन’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: μετανοίας μετασχεῖν
  choice: पश्चाताप में सहभागी हों
  rationale: μετασχεῖν का अर्थ हिस्सा लेना या सहभागी होना है; यह अनुवाद मूल की सहभागिता की भाषा को बनाए रखता है।
- source_word: ἐστήριξεν
  choice: दृढ़ ठहराया
  rationale: στηρίζω में दृढ़ करने, स्थिर करने या पुष्टि करने का भाव है। संदर्भ में ‘इसे’ पहले कही गई पश्चाताप-संबंधी प्रतिज्ञा या व्यवस्था की ओर संकेत कर सकता है; ‘दृढ़ ठहराया’ इस संदर्भ और क्रिया की व्यापकता दोनों को सुरक्षित रखता है।
- source_word: τῷ παντοκρατορικῷ βουλήματι αὐτοῦ
  choice: अपनी सर्वशक्तिमान इच्छा से
  rationale: παντοκρατορικός सर्वशक्तिमान प्रभुता को और βούλημα इच्छा, संकल्प या अभिप्राय को व्यक्त करता है। ‘सर्वशक्तिमान इच्छा’ संक्षिप्त, स्वाभाविक और मूल के निकट है।
theological_decisions:
- issue: ἐστήριξεν का अव्यक्त कर्म
  choice: ‘इसे’ रखकर संदर्भगत संकेत को खुला छोड़ा गया
  alternative: ‘पश्चाताप को दृढ़ ठहराया’ या ‘प्रतिज्ञा की पुष्टि की’
  rationale: यूनानी में कर्म स्पष्ट रूप से व्यक्त नहीं है। निकटवर्ती संदर्भ में यह पश्चाताप की व्यवस्था, घोषणा या प्रतिज्ञा की ओर लौट सकता है; किसी एक अर्थ को स्पष्ट करके जोड़ना मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: βουλήματι में इच्छा और संकल्प का संबंध
  choice: ‘इच्छा’
  alternative: ‘संकल्प’
  rationale: ‘इच्छा’ सामान्य पाठक के लिए अधिक सहज है और दैवी अभिप्राय का भाव देती है, जबकि ‘संकल्प’ अर्थ को कुछ अधिक निश्चित योजना की ओर सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल। वाक्य में यूनानी कृदन्त βουλόμενος को ‘यह चाहकर कि’ से व्यक्त किया गया है, जिससे कारण का अतिरिक्त अर्थ जोड़े बिना मूल संरचना का भाव बना रहता है।
