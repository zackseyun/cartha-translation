id: 1CLEM.8.3
reference: 1 Clement 8:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: hi
  text: “हे इस्राएल के घराने, अपने अधर्म से मन फिराओ। मैंने अपनी प्रजा के पुत्रों से कहा, ‘यदि तुम्हारे पाप पृथ्वी से आकाश तक हों, और यदि वे किरमिजी रंग से भी अधिक लाल और टाट से भी अधिक काले हों, और तुम अपने पूरे हृदय से मेरी ओर फिरो और कहो, “पिता,” तो मैं पवित्र प्रजा की तरह तुम्हारी सुनूँगा।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετανοήσατε
  choice: मन फिराओ
  rationale: यह पश्चात्ताप के साथ सोच और जीवन की दिशा बदलने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνομίας
  choice: अधर्म
  rationale: यह परमेश्वर की व्यवस्था के उल्लंघन और दुष्ट आचरण, दोनों का भाव रखता है; केवल ‘अपराध’ कहना अर्थ को संकरा कर देता।
- source_word: τοῖς υἱοῖς τοῦ λαοῦ μου
  choice: अपनी प्रजा के पुत्रों से
  rationale: मूल के ‘पुत्रों’ को बनाए रखा गया है, यद्यपि इसका सामूहिक आशय प्रजा के सदस्यों से है।
- source_word: πυρρότεραι κόκκου
  choice: किरमिजी रंग से भी अधिक लाल
  rationale: κόκκος यहाँ किरमिजी/स्कारलेट रंग की ओर संकेत करता है; तुलना और लालिमा दोनों स्पष्ट रखी गई हैं।
- source_word: σάκκου
  choice: टाट
  rationale: यह शोक-वस्त्र के रूप में प्रयुक्त मोटे, गहरे रंग के कपड़े का परिचित हिन्दी समतुल्य है।
- source_word: ἐπιστραφῆτε
  choice: मेरी ओर फिरो
  rationale: यह दिशा-परिवर्तन और परमेश्वर की ओर लौटने का भाव सीधे व्यक्त करता है।
- source_word: ἐπακούσομαι
  choice: तुम्हारी सुनूँगा
  rationale: क्रिया का आशय ध्यान देकर सुनने और अनुकूल उत्तर देने का है; हिन्दी वाक्यांश इस अर्थ-व्याप्ति को स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: पश्चात्ताप और परमेश्वर की ओर फिरने का संबंध
  choice: ‘मन फिराओ’ और बाद में ‘मेरी ओर फिरो’—दोनों अभिव्यक्तियाँ अलग-अलग रखी गईं
  alternative: दोनों को केवल ‘पश्चात्ताप करो’ कहना
  rationale: मूल में μετάνοια और ἐπιστρέφω अलग शब्द हैं; अनुवाद उनके परस्पर संबद्ध किंतु विशिष्ट भावों को सुरक्षित रखता है।
- issue: पापों की अतिशयोक्तिपूर्ण शर्त
  choice: ‘यदि तुम्हारे पाप पृथ्वी से आकाश तक हों’
  alternative: ‘भले ही तुम्हारे पाप पृथ्वी से आकाश तक पहुँचें’
  rationale: मूल की शर्तात्मक रचना और ‘हों’ के स्थिर चित्र को बिना अतिरिक्त रियायती अर्थ जोड़े बनाए रखा गया है।
- issue: ‘पवित्र प्रजा’ के रूप में सुनना
  choice: ‘पवित्र प्रजा के समान तुम्हारी सुनूँगा’
  alternative: ‘तुम्हें पवित्र प्रजा मानकर तुम्हारी सुनूँगा’
  rationale: ὡς की तुलनात्मक/भूमिकात्मक अस्पष्टता को सुरक्षित रखा गया है; ‘मानकर’ पहचान-निर्णय को अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय किंतु सहज शैली अपनाई गई है। संबोधन ‘हे इस्राएल के घराने’ और सामूहिक ‘तुम’ मूल की भविष्यद्वाणी-सदृश वाणी को बनाए रखते हैं। किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई है।
