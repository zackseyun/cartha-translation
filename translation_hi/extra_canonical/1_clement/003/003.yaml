base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/003.yaml
  text: So the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders.
translation:
  language: hi
  text: इस प्रकार, सम्मानहीन लोग सम्मानित लोगों के विरुद्ध उठ खड़े हुए, यशहीन लोग यशस्वी लोगों के विरुद्ध, मूर्ख लोग विवेकी लोगों के विरुद्ध, और युवा लोग बुज़ुर्गों के विरुद्ध।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄτιμοι / ἐντίμους
  choice: अपमानित लोग / सम्मानित लोग
  rationale: यह विरोधी शब्द-युग्म यूनानी में सामाजिक मान-सम्मान के अभाव और उसकी प्राप्ति को दर्शाता है; हिन्दी में समानांतरता बनाए रखी गई है।
- source_word: ἄδοξοι / ἐνδόξους
  choice: यशहीन लोग / यशस्वी लोग
  rationale: δόξα-सम्बन्धी विरोध को ‘यश’ के द्वारा व्यक्त किया गया है, ताकि इसे पिछले ‘सम्मान’ वाले युग्म से अलग रखा जा सके।
- source_word: ἄφρονες / φρονίμους
  choice: मूर्ख लोग / समझदार लोग
  rationale: यह युग्म विवेकहीनता और व्यावहारिक समझ के बीच विरोध व्यक्त करता है; ‘समझदार’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: νέοι / πρεσβυτέρους
  choice: युवा लोग / प्राचीनों
  rationale: πρεσβύτεροι आयु में बड़े लोगों अथवा समुदाय के अगुवों के लिए प्रयुक्त हो सकता है। ‘प्राचीनों’ इस सम्भावित पदगत अर्थ को बंद किए बिना आयु-विरोध को बनाए रखता है।
- source_word: ἐπηγέρθησαν ἐπί
  choice: के विरुद्ध उठ खड़े हुए
  rationale: क्रिया और ἐπί का संयोजन विरोधपूर्ण विद्रोह या आक्रमण का भाव देता है; यह हिन्दी पदबंध उस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: πρεσβυτέρους का अर्थ
  choice: प्राचीनों
  alternative: बुज़ुर्गों / अगुवों
  rationale: संदर्भ में आयु-वर्ग और कलीसियाई पद—दोनों की सम्भावना हो सकती है। ‘प्राचीनों’ उस तनाव को अपेक्षाकृत खुला रखता है और इसे केवल आधुनिक आयु-सूचक या केवल पदनाम नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; चार विरोधी युग्मों की अलंकारिक समानांतरता सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
