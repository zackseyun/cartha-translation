source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο πόρρω ἀπέστη ἡ δικαιοσύνη καὶ εἰρήνη, ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι, μηδὲ ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι μηδὲ πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ, ἀλλὰ ἕκαστον βαδίζειν κατὰ τὰς ἐπιθυμίας τῆς καρδίας αὐτοῦ τῆς πονηρᾶς, ζῆλον ἄδικον καὶ ἀσεβῆ ἀνειληφότας, δι' οὗ καὶ θάνατος εἰσῆλθεν εἰς τὸν κόσμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/004.yaml
  text: Because of this[a], righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Christ, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[c][b], through which death also entered into the world.
translation:
  language: hi
  text: इसी कारण धार्मिकता और शान्ति बहुत दूर चली गईं, क्योंकि हर एक ने परमेश्वर का भय छोड़ दिया और उस पर विश्वास में धुँधला हो गया। वह न तो उसकी आज्ञाओं के विधानों के अनुसार चलता था, न मसीह के अनुरूप उचित आचरण करता था; बल्कि हर एक अपने बुरे हृदय की अभिलाषाओं के अनुसार चलता था और अन्यायपूर्ण तथा अधर्मी ईर्ष्या को अपना चुका था। इसी ईर्ष्या के द्वारा मृत्यु भी संसार में आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यह नैतिक और धार्मिक ‘righteousness’ का स्वाभाविक, प्रतिष्ठित हिन्दी रूप है; ‘न्याय’ यहाँ अर्थ को केवल न्यायिक दिशा में सीमित कर सकता था।
- source_word: τὰ νόμιμα τῶν προσταγμάτων αὐτοῦ
  choice: उसकी आज्ञाओं के विधान
  rationale: νόμιμα स्थापित नियमों या विधानों को सूचित करता है, जबकि προσταγμάτων ‘आज्ञाओं’ को; हिन्दी में दोनों स्तर बनाए रखे गए हैं।
- source_word: πολιτεύεσθαι
  choice: आचरण करता था
  rationale: क्रिया का मूल नागरिक जीवन बिताने का भाव है, पर यहाँ व्यापक जीवन-व्यवहार अभिप्रेत है; ‘आचरण करना’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: κατὰ τὸ καθῆκον τῷ Χριστῷ
  choice: मसीह के योग्य
  rationale: यह मसीह के अनुरूप या उसके संबंध में उचित जीवन-व्यवहार का भाव व्यक्त करता है, बिना हिन्दी को अनावश्यक रूप से भारी बनाए।
- source_word: ζῆλον ἄδικον καὶ ἀσεβῆ
  choice: अन्यायपूर्ण तथा भक्तिहीन ईर्ष्या
  rationale: ζῆλος संदर्भ में नकारात्मक ‘ईर्ष्या’ है; ἄδικος और ἀσεβής के नैतिक तथा ईश्वर-विरोधी दोनों विशेषण सुरक्षित रखे गए हैं।
- source_word: δι' οὗ
  choice: इसी ईर्ष्या के द्वारा
  rationale: सापेक्ष सर्वनाम का निकटतम और अर्थपूर्ण पूर्वपद ζῆλος है; स्पष्ट हिन्दी के लिए संज्ञा दुहराई गई है।
theological_decisions:
- issue: ἐν τῇ πίστει αὐτοῦ में αὐτοῦ का संबंध
  choice: उस पर विश्वास
  alternative: उसका विश्वास / उसकी विश्वासयोग्यता
  rationale: ‘परमेश्वर का भय’ के समानांतर संदर्भ में परमेश्वर पर विश्वास सबसे संभावित अर्थ है, पर यूनानी संबंधकारक की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: τῷ Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: प्रथम क्लेमेंट के मसीही पत्रीय संदर्भ में Χριστός स्थापित उपाधि/नाम के रूप में प्रयुक्त है; आधुनिक मानक हिन्दी में ‘मसीह’ स्वाभाविक है।
- issue: मृत्यु के संसार में प्रवेश का साधन
  choice: ईर्ष्या के द्वारा
  alternative: जिसके द्वारा
  rationale: निकटवर्ती ζῆλος को स्पष्ट पूर्वपद मानना वाक्य और पारंपरिक संकेत दोनों के अनुकूल है; कोई अतिरिक्त पात्र या सिद्धान्त पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी के दीर्घ वाक्य को पठनीय हिन्दी वाक्यों में बाँटा गया है, पर कारण-परिणाम, समानांतर निषेध और अंतिम मृत्यु-संबंधी कथन सुरक्षित हैं। ‘शान्ति’ और ‘धार्मिकता’ को स्त्रीलिंग बहुवचन के रूप में व्यक्त किया गया है; एकवचन ‘हर एक’ की पुनरावृत्ति भी मूल के व्यक्तिगत उत्तरदायित्व पर बल को बनाए रखती है।
