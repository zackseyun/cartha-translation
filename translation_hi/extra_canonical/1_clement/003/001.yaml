  text: Πᾶσα δόξα καὶ πλατυσμὸς ἐδόθη ὑμῖν καὶ ἐτελέσθη τὸ γεγραμμένον· Ἔφαγεν καὶ ἔπιεν, καὶ ἐπλατύνθη καὶ ἐπαχύνθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/001.yaml
  text: 'All glory and abundance were given to you, and what is written was fulfilled: “He ate and drank, and grew broad and fat, and the beloved one kicked.”'
translation:
  language: hi
  text: 'तुम्हें सारी महिमा और समृद्धि दी गई, और यह लिखा हुआ वचन पूरा हुआ: “उसने खाया और पिया, वह चौड़ा और मोटा हो गया, और उस प्रिय ने लात मारी।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उसने उद्दंड होकर विरोध किया; अनुवाद ‘दुलत्ती मारी’ भी संभव है।
    reason: ग्रीक क्रिया अति-पोषित पशु के लात मारने का चित्र प्रस्तुत करती है और प्रसंग में विद्रोह का भाव रखती है।
lexical_decisions:
- source_word: δόξα
  choice: महिमा
  rationale: यह शब्द सम्मान, प्रतिष्ठा और वैभव का भाव रखता है; ‘महिमा’ उद्धरण-सदृश और आरंभिक मसीही साहित्य के गरिमापूर्ण संदर्भ के अनुकूल है।
- source_word: πλατυσμός
  choice: समृद्धि
  rationale: शाब्दिक अर्थ ‘फैलाव/विस्तार’ है, पर यहाँ समुदाय को मिली भरपूरी या संपन्न दशा अभिप्रेत है; ‘समृद्धि’ स्वाभाविक हिन्दी में उस भाव को व्यक्त करती है।
- source_word: ἐπλατύνθη
  choice: चौड़ा हो गया
  rationale: मूल के देहगत ‘फैलने/चौड़ा होने’ के चित्र को बनाए रखता है और अगले ‘मोटा हो गया’ के साथ समानांतर रहता है।
- source_word: ἐπαχύνθη
  choice: मोटा हो गया
  rationale: अधिक खाकर स्थूल होने के पशु-सदृश रूपक का सीधा और स्पष्ट अनुवाद है।
- source_word: ὁ ἠγαπημένος
  choice: उस प्रिय ने
  rationale: ग्रीक का संज्ञीकृत विशेषण ‘प्रिय/प्यारा जन’ है; ‘उस प्रिय ने’ इसकी विशिष्ट किंतु अनिर्दिष्ट पहचान को सुरक्षित रखता है।
- source_word: ἀπελάκτισεν
  choice: लात मारी
  rationale: अति-पोषित पशु के उद्दंड होकर लात मारने का ठोस रूपक बनाए रखता है; इसे केवल अमूर्त ‘विद्रोह किया’ बनाकर व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: व्यवस्थाविवरण 32:15 के उद्धरण में कर्ता की पहचान
  choice: ‘उस प्रिय ने’
  alternative: ‘प्रिय जन ने’ या पारंपरिक नाम ‘यशूरून ने’
  rationale: प्रस्तुत ग्रीक पाठ ὁ ἠγαπημένος कहता है और किसी नाम का प्रयोग नहीं करता; इसलिए कर्ता की पहचान को पाठ से अधिक विशिष्ट नहीं बनाया गया।
- issue: ἀπελάκτισεν के विद्रोहात्मक आशय को व्यक्त करना
  choice: मुख्य पाठ में ठोस रूपक ‘लात मारी’ और पादटिप्पणी में संभावित विद्रोहात्मक अर्थ
  alternative: मुख्य पाठ में ‘विद्रोह किया’
  rationale: मूल क्रिया का पशु-सदृश चित्र और उसका नैतिक आशय दोनों महत्वपूर्ण हैं; मुख्य पाठ चित्र को सुरक्षित रखता है, जबकि पादटिप्पणी आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। प्रत्यक्ष संबोधन के लिए ‘तुम्हें’ रखा गया है। उद्धरण में देहगत और पशु-सदृश रूपक को जानबूझकर स्पष्ट रखा गया है।
