base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/002.yaml
  text: From this came jealousy and envy, strife and faction, persecution and disorder, war and captivity. 3 Thus the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders. 4 Because of this, righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became shortsighted in faith in him, neither walking in the lawful ways of his commandments nor conducting himself in a manner fitting for the Messiah, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy, through which death also entered into the world.
translation:
  language: hi
  text: 2 इसी से जलन और ईर्ष्या, झगड़ा और फूट, सताव और अव्यवस्था, युद्ध और बंदी बनना उत्पन्न हुए। 3 इस प्रकार अपमानित लोग आदरणीय लोगों के विरुद्ध उठ खड़े हुए, यशहीन लोग यशस्वियों के विरुद्ध, मूर्ख लोग बुद्धिमानों के विरुद्ध, और जवान लोग बुज़ुर्गों के विरुद्ध। 4 इसी कारण धार्मिकता और शांति बहुत दूर चली गईं, क्योंकि हर एक ने परमेश्वर का भय छोड़ दिया, उस पर विश्वास में निकटदर्शी हो गया, और न तो उसकी आज्ञाओं के विधानों के अनुसार चला, न मसीह के योग्य जीवन बिताया; बल्कि हर एक अपने बुरे मन की लालसाओं के अनुसार चलता रहा और अन्यायी तथा अधार्मिक जलन को अपनाए हुए था, जिसके द्वारा मृत्यु भी संसार में प्रवेश कर गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος καὶ φθόνος
  choice: जलन और ईर्ष्या
  rationale: दो निकटार्थी यूनानी शब्दों का भेद बनाए रखते हुए आधुनिक और सहज हिन्दी प्रयोग किया गया है।
- source_word: στάσις
  choice: फूट
  rationale: यहाँ शब्द सामुदायिक गुटबंदी और विद्रोही विभाजन का भाव देता है; ‘फूट’ प्रसंग में स्वाभाविक है।
- source_word: ἀκαταστασία
  choice: अव्यवस्था
  rationale: सामाजिक अशांति और अस्त-व्यस्तता के व्यापक अर्थ को बनाए रखता है।
- source_word: αἰχμαλωσία
  choice: बंदी बनाए जाने की नौबत
  rationale: शाब्दिक ‘बंदीपन’ की अपेक्षा सहज हिन्दी में युद्ध के परिणामस्वरूप बंदी बनाए जाने का भाव व्यक्त करता है।
- source_word: οἱ πρεσβύτεροι
  choice: प्राचीन
  rationale: ‘जवानों’ के साथ विरोध में इसका अर्थ आयु और वरिष्ठता दोनों लिए हुए है; ‘प्राचीन’ आरंभिक मसीही साहित्य में इस द्विअर्थता को रहने देता है।
- source_word: ἀμβλυωπῆσαι
  choice: उस पर विश्वास करने में उसकी दृष्टि धुँधली हो गई
  rationale: दृष्टि-मंदता के रूपक को बनाए रखते हुए हिन्दी में उसके विश्वास-संबंधी आशय को स्पष्ट किया गया है।
- source_word: τὰ νόμιμα τῶν προσταγμάτων αὐτοῦ
  choice: परमेश्वर की आज्ञाओं के विधान
  rationale: νόμιμα के स्थापित नियमों/विधानों और προσταγμάτων की आज्ञाओं—दोनों तत्वों को सुरक्षित रखता है।
- source_word: πολιτεύεσθαι
  choice: आचरण करता था
  rationale: शब्द का मूल भाव नागरिक की तरह जीवन बिताना है, पर यहाँ समग्र जीवन-व्यवहार अभिप्रेत है; ‘आचरण’ स्वाभाविक हिन्दी है।
- source_word: Χριστός
  choice: मसीह
  rationale: यूनानी पदवी का मानक हिन्दी रूप, बिना इसे निजी नाम मात्र में बदलने के।
theological_decisions:
- issue: ‘जिसके द्वारा मृत्यु भी संसार में प्रवेश कर गई’ में संबंधसूचक सर्वनाम का पूर्वपद
  choice: इसे ‘अन्यायपूर्ण और भक्तिहीन जलन’ से जोड़ा गया
  alternative: इसे समूची पिछली दुष्टता या किसी अन्य निहित कारण से जोड़ना
  rationale: यूनानी δι’ οὗ का निकटतम और व्याकरणिक रूप से उपयुक्त पूर्वपद एकवचन ζῆλον है; इसलिए अस्पष्टता को अनावश्यक रूप से विस्तृत नहीं किया गया।
- issue: मसीह के योग्य जीवन का वाक्यांश
  choice: ‘मसीह के योग्य आचरण’
  alternative: ‘मसीह के अनुसार नागरिक जीवन’
  rationale: स्रोत का नैतिक और सामुदायिक आशय सुरक्षित है, जबकि ऐसा शब्दांकन नहीं अपनाया गया जो किसी विशिष्ट कलीसियाई शासन-सिद्धांत का संकेत दे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर विरोधी युग्मों की अलंकारिक संरचना सुरक्षित रखी गई है। पद 4 के लंबे यूनानी वाक्य को पठनीयता के लिए हिन्दी में कई वाक्यों में बाँटा गया, पर कारण-परिणाम और कर्ता-संबंध बनाए रखे गए हैं।
