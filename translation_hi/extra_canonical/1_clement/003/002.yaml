review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of vices and calamities in v. 2 and the paired social reversals in v. 3. In v. 4, however, ‘प्राचीनों’ normally means ancient persons/things in modern Hindi rather than ‘elders,’ and several phrases can more closely and clearly represent the Greek without added idiom. The revised wording retains the singular unjust and ungodly ζῆλος as the antecedent of ‘जिसके द्वारा.’
  naturalness: The draft is generally readable, but ‘बंदी बनाए जाने की नौबत आई,’ ‘विधानों पर चलता था,’ and ‘उस पर विश्वास करने में उसकी दृष्टि धुँधली हो गई’ are respectively expansive, awkward, and pronoun-ambiguous. The revision uses direct, modern-standard Hindi while retaining the formal register.
  terminology: ‘जलन और ईर्ष्या,’ ‘फूट,’ ‘अव्यवस्था,’ ‘धार्मिकता,’ and ‘मसीह’ are suitable. ‘बुज़ुर्गों’ is required for οἱ πρεσβύτεροι in this age-based contrast with νέοι; it does not impose an ecclesiastical-office meaning.
  issues:
  - severity: medium
    issue: ‘प्राचीनों’ for οἱ πρεσβύτεροι
    rationale: In contemporary Hindi, ‘प्राचीन’ ordinarily denotes what is ancient, not older people or elders. Since the Greek contrasts the young with older persons, ‘बुज़ुर्गों’ accurately and naturally conveys the sense.
  - severity: low
    issue: ‘बंदी बनाए जाने की नौबत आई’ expands αἰχμαλωσία
    rationale: The source gives the calamity ‘captivity,’ not the idiomatic added notion that matters reached the point of being taken captive. ‘बंदी बनना’ is direct and natural.
  - severity: medium
    issue: Faith/vision phrase is grammatically unclear in Hindi
    rationale: ‘उस पर विश्वास करने में उसकी दृष्टि’ leaves the referent of ‘उस’ and ‘उसकी’ unclear. ‘उस पर विश्वास में निकटदर्शी हो गया’ preserves the Greek metaphor of impaired sight and its connection with faith.
  - severity: low
    issue: ‘आज्ञाओं के विधानों पर चलता था’ is not idiomatic Hindi
    rationale: One walks ‘के अनुसार,’ rather than ‘पर,’ with rules or ordinances. The revision retains both the ordinance/rule and command elements.
