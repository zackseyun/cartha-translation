base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/003.yaml
  text: Let us behold him in our mind, and let us look with the eyes of the soul into his patient purpose. Let us understand how free from anger he is toward all his creation.
translation:
  language: hi
  text: आइए, हम उसे मन में निहारें और अपनी आत्मा की आँखों से उसके धैर्यपूर्ण अभिप्राय को देखें। आइए, हम समझें कि वह अपनी सारी सृष्टि के प्रति क्रोध से रहित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ διάνοιαν
  choice: मन में
  rationale: यह वाक्यांश मानसिक मनन या अंतर्दृष्टि से देखने का भाव देता है; ‘मन में’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: τοῖς ὄμμασιν τῆς ψυχῆς
  choice: अपनी आत्मा की आँखों से
  rationale: मूल के रूपक को बनाए रखते हुए आंतरिक या आत्मिक दृष्टि का अर्थ व्यक्त करता है।
- source_word: τὸ μακρόθυμον αὐτοῦ βούλημα
  choice: उसके धीरज भरे संकल्प
  rationale: μακρόθυμον दीर्घ धैर्य और सहनशीलता को तथा βούλημα इच्छा/अभिप्राय/संकल्प को सूचित करता है; यह चयन दोनों अर्थों को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ἀόργητος
  choice: क्रोध नहीं करता
  rationale: शब्द का अर्थ क्रोध से रहित या क्रोध न करने वाला है; क्रियात्मक हिन्दी यहाँ सामान्य पाठक के लिए अधिक स्वाभाविक है।
- source_word: πᾶσαν τὴν κτίσιν αὐτοῦ
  choice: अपनी सारी सृष्टि
  rationale: मूल की व्यापकता को बिना सीमित किए सीधे व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर का अपनी समस्त सृष्टि के प्रति ἀόργητος होना
  choice: वह अपनी सारी सृष्टि के प्रति क्रोध नहीं करता
  alternative: वह अपनी सारी सृष्टि के प्रति क्रोध से रहित है
  rationale: मूल कथन की व्यापकता और तनाव को सुरक्षित रखा गया है; इसमें कोई व्यवस्थित धर्मवैज्ञानिक योग्यता या अपवाद नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामूहिक आह्वान के लिए ‘आइए, हम’ का प्रयोग। शैली गरिमापूर्ण पर सहज है और आत्मा की आँखों वाले मूल रूपक को सुरक्षित रखती है।
