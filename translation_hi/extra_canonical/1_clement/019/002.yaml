base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/002.yaml
  text: Since, then, we have been deemed worthy of many great and glorious things, let us press on toward the goal of peace that has been handed down to us from the beginning, and let us fix our gaze on the Father and Creator of the whole world, and cling to his magnificent and surpassing gifts and benefits of peace.
translation:
  language: hi
  text: इसलिए, जब हम अनेक महान और गौरवशाली कार्यों में सहभागी हुए हैं, तो आइए हम शांति के उस लक्ष्य की ओर बढ़ें, जो आरंभ से हम तक पहुँचाया गया है। हम समस्त संसार के पिता और सृष्टिकर्ता पर अपनी दृष्टि लगाए रखें और शांति के उसके भव्य और अतुलनीय वरदानों और उपकारों से दृढ़ता से जुड़े रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετασχόντες
  choice: सहभागी हुए हैं
  rationale: यह कृदंत किसी वस्तु या कार्य में भाग लेने अथवा उसका हिस्सा पाने का भाव रखता है। उपलब्ध यूनानी पाठ में ἠξιώθημεν नहीं है, इसलिए ‘योग्य ठहराए गए’ के बजाय स्रोत-पाठ के सहभागिता-भाव को रखा गया है।
- source_word: πράξεων
  choice: कार्यों
  rationale: πρᾶξις का सामान्य अर्थ कार्य, कृत्य या घटना है। यहाँ ‘कार्यों’ स्वाभाविक है और यह खुला छोड़ता है कि लेखक पूर्ववर्णित उदाहरणों अथवा उनसे जुड़ी महान बातों की ओर संकेत कर रहा है।
- source_word: σκοπόν
  choice: लक्ष्य
  rationale: शब्द उस निशाने या उद्देश्य को दर्शाता है जिसकी ओर व्यक्ति बढ़ता है; ‘लक्ष्य’ इस रूपक को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: παραδεδομένον
  choice: सौंपा गया
  rationale: यह परंपरा में प्राप्त या हस्तांतरित किए जाने का भाव देता है; ‘सौंपा गया’ आधुनिक हिन्दी में उस विरासत और उत्तरदायित्व दोनों को व्यक्त करता है।
- source_word: ἀτενίσωμεν
  choice: अपनी दृष्टि लगाए रखें
  rationale: क्रिया ध्यानपूर्वक और एकटक देखने का भाव रखती है; यह आगे के चिंतनपरक संदर्भ के अनुकूल है।
- source_word: κολληθῶμεν
  choice: दृढ़ता से जुड़े रहें
  rationale: शाब्दिक अर्थ चिपकने या घनिष्ठ रूप से जुड़ने का है। हिन्दी में यह रूपक का बल बनाए रखते हुए अस्वाभाविक भौतिक बिंब से बचता है।
- source_word: μεγαλοπρεπέσι καὶ ὑπερβαλλούσαις
  choice: भव्य और अतुलनीय
  rationale: दोनों विशेषण क्रमशः महान वैभव और सीमा से बढ़कर होने का भाव देते हैं।
- source_word: εὐεργεσίαις
  choice: उपकारों
  rationale: शब्द हितकारी कामों या लाभकारी कृपाओं को सूचित करता है; ‘उपकार’ धार्मिक और सामान्य दोनों पाठकों के लिए स्पष्ट है।
theological_decisions:
- issue: पिता और सृष्टिकर्ता की पहचान
  choice: समस्त संसार के पिता और सृष्टिकर्ता
  alternative: ब्रह्मांड के पिता और रचयिता
  rationale: मूल τοῦ σύμπαντος κόσμου का व्यापक सृष्टिगत दावा ज्यों का त्यों रखा गया है, बिना यह स्पष्ट किए कि ‘पिता’ का संबंध केवल मनुष्यों से है या पूरी सृष्टि से।
- issue: शांति के वरदानों का संबंध
  choice: शांति के उसके भव्य और अतुलनीय वरदानों और उपकारों
  alternative: उसके भव्य और अतुलनीय वरदानों तथा शांति के उपकारों
  rationale: यूनानी पदबंध में संबंध कुछ संकुचित है; चुना गया रूप शांति को वरदानों और उपकारों की समग्र धारणा से जोड़ता है, पर कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक आग्रह के लिए ‘आइए हम’ और गरिमापूर्ण किंतु सहज शब्दावली अपनाई गई है। वाक्य की आवृत्तिमूलक यूनानी संरचना को दो हिन्दी वाक्यों में बाँटा गया है, जबकि तर्कक्रम और सभी मुख्य बिंब सुरक्षित रखे गए हैं।
