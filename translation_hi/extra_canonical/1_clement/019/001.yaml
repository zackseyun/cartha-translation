  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: hi
  text: इसलिए, इतने सारे और ऐसे नम्र लोगों की—जिनकी इस प्रकार गवाही दी जा चुकी है—नम्रता और आज्ञाकारिता के द्वारा प्रकट उनकी अधीनता ने न केवल हमें, बल्कि हमसे पहले की उन पीढ़ियों को भी बेहतर बनाया जिन्होंने पवित्रता और सत्य में उसके वचनों को ग्रहण किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρόνων
  choice: दीनता
  rationale: यह शब्द नम्र और स्वयं को छोटा मानने वाली मनोवृत्ति को व्यक्त करता है; प्रसंग में भाववाचक अनुवाद स्वाभाविक है।
- source_word: τὸ ὑποδεὲς
  choice: अधीनता
  rationale: यह विनीत रूप से अपने को अधीन रखने या समर्पित होने के भाव को दर्शाता है; ‘अधीनता’ आज्ञाकारिता से इसका संबंध बनाए रखती है।
- source_word: διὰ τῆς ὑπακοῆς
  choice: आज्ञाकारिता के द्वारा
  rationale: यूनानी में साधन या माध्यम का भाव है, जिसे स्पष्ट रूप से बनाए रखा गया है।
- source_word: τὰ λόγια αὐτοῦ
  choice: उसके वचनों
  rationale: λόγια का अर्थ दैवी वचन या ईशवाणी हो सकता है; ‘वचनों’ से धार्मिक आशय बना रहता है और अनावश्यक व्याख्या नहीं जुड़ती।
- source_word: ἐν ὁσίῳ καὶ ἀληθείᾳ
  choice: पवित्रता और सच्चाई में
  rationale: दोनों अमूर्त गुणों को निकट औपचारिक समानता के साथ रखा गया है।
theological_decisions:
- issue: αὐτοῦ (‘उसके’) का संदर्भ
  choice: उसके
  alternative: परमेश्वर के
  rationale: मूल पाठ सर्वनाम का संदर्भ स्पष्ट करके नाम नहीं देता; वास्तविक संदर्भगत अस्पष्टता को बनाए रखा गया है।
- issue: λόγια का दैवी स्वरूप
  choice: वचन
  alternative: ईशवाणियाँ
  rationale: ‘वचन’ सामान्य पाठक के लिए स्वाभाविक है और दैवी कथनों का अर्थ समेटता है, जबकि ‘ईशवाणियाँ’ अपेक्षाकृत तकनीकी और संकीर्ण लग सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। लंबे यूनानी वाक्य की संरचना को डैश और ‘अर्थात्’ से स्पष्ट किया गया है, पर उसके तर्क और संबंध सुरक्षित रखे गए हैं।
