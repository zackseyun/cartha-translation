  text: Ἐπίστασθε γὰρ καὶ καλῶς ἐπίστασθε τὰς ἱερὰς γραφάς, ἀγαπητοί, καὶ ἐγκεκύφατε εἰς τὰ λόγια τοῦ θεοῦ. πρὸς ἀνάμνησιν οὖν ταῦτα γράφομεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/001.yaml
  text: For you know the holy Scriptures—and know them well, beloved—and you have pored over the oracles of God. Therefore we write these things for your remembrance.
translation:
  language: hi
  text: क्योंकि, प्रियजनो, तुम पवित्र शास्त्रों को जानते हो—और उन्हें भली-भाँति जानते हो—और परमेश्वर के वचनों का गहराई से अध्ययन किया है।a इसलिए हम ये बातें तुम्हें स्मरण दिलाने के लिए लिख रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπίστασθε ... καλῶς ἐπίστασθε
  choice: जानते हो—और भली-भाँति जानते हो
  rationale: यूनानी में क्रिया की बलपूर्ण पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὰς ἱερὰς γραφάς
  choice: पवित्र शास्त्रों
  rationale: यह स्थापित और स्पष्ट हिन्दी पदबंध है; बहुवचन का भाव भी सुरक्षित रहता है।
- source_word: ἐγκεκύφατε εἰς
  choice: का गहरा अध्ययन कर चुके हो
  rationale: क्रिया का शाब्दिक अर्थ झुककर ध्यान से देखने का है और पाठ के संदर्भ में मन लगाकर गहन अध्ययन करना अभिप्रेत है; पूर्णकालिक रूप पूर्व में किए गए अध्ययन की वर्तमान प्रासंगिकता दर्शाता है।
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: परमेश्वर के वचनों
  rationale: λόγια यहाँ अधिकारपूर्ण ईश्वरीय कथनों को सूचित करता है। 'वचन' हिन्दी के धार्मिक साहित्य में स्वाभाविक है और 'भविष्यवाणियाँ' जैसी अनावश्यक संकीर्णता से बचता है।
- source_word: πρὸς ἀνάμνησιν
  choice: तुम्हें स्मरण दिलाने के लिए
  rationale: संज्ञात्मक यूनानी अभिव्यक्ति को सहज आधुनिक हिन्दी में प्रयोजनवाचक रूप से व्यक्त करता है।
theological_decisions:
- issue: λόγια की अधिकारपूर्ण धार्मिक छाया
  choice: परमेश्वर के वचनों
  alternative: परमेश्वर की उक्तियों / ईशवाणियों
  rationale: '''वचन'' दैवी अधिकार का भाव बनाए रखता है, पर इसे केवल भविष्यसूचक वाणी या किसी विशिष्ट तकनीकी श्रेणी तक सीमित नहीं करता।'
- issue: γραφή और λόγια के पारस्परिक संबंध
  choice: दोनों के लिए क्रमशः 'पवित्र शास्त्र' और 'परमेश्वर के वचन'
  alternative: दोनों को एक ही शब्द 'शास्त्र' से प्रस्तुत करना
  rationale: मूल के अलग पदों को अलग रखते हुए उनके निकट संबंध को सुरक्षित रखा गया है; लेखक के आशय को उससे अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। संबोधन 'हे प्रियो' मूल ἀγαπητοί की आत्मीयता और पत्रात्मक शैली को बनाए रखता है। वाक्य की बलपूर्ण पुनरावृत्ति और निष्कर्षसूचक 'इसलिए' संरक्षित हैं।
