base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/003.yaml
  text: And the Lord said to him, “I have spoken to you once and twice, saying, ‘I have seen this people, and behold, it is stiff-necked. Leave me alone to destroy them, and I will blot out their name from under heaven; and I will make you into a nation great and marvelous and greater than this one.’”
translation:
  language: hi
  text: और प्रभु ने उससे कहा, “मैं तुमसे एक-दो बार कह चुका हूँ, ‘मैंने इस प्रजा को देखा है; देखो, यह हठीली प्रजा है। मुझे इन्हें नष्ट कर देने दो। मैं इनका नाम आकाश के नीचे से मिटा दूँगा और तुमसे एक ऐसा राष्ट्र बनाऊँगा जो महान, अद्भुत और इससे कहीं बड़ा होगा।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅπαξ καὶ δὶς
  choice: एक-दो बार
  rationale: यूनानी मुहावरे की पुनरावृत्ति और चेतावनी के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ठीक तीन बार कहने का अनावश्यक गणितीय अर्थ नहीं थोपता।
- source_word: σκληροτράχηλος
  choice: हठीली
  rationale: शाब्दिक अर्थ ‘कठोर गर्दनवाली’ है, पर सन्दर्भ में यह अड़ियल और आज्ञा न माननेवाली प्रजा का मुहावरा है; ‘हठीली’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: ἔασόν με ἐξολεθρεῦσαι αὐτούς
  choice: मुझे इन्हें नष्ट कर देने दो
  rationale: आज्ञार्थक अभिव्यक्ति और विनाश के स्पष्ट भाव को बिना अतिरिक्त तीव्रतासूचक शब्द जोड़े सुरक्षित रखता है।
- source_word: ἐξαλείψω τὸ ὄνομα αὐτῶν ὑποκάτωθεν τοῦ οὐρανοῦ
  choice: मैं इनका नाम आकाश के नीचे से मिटा दूँगा
  rationale: मूल रूपक और उसके व्यापक, न्यायसूचक आशय को निकटता से बनाए रखता है।
- source_word: ἔθνος μέγα καὶ θαυμαστὸν καὶ πολὺ μᾶλλον ἢ τοῦτο
  choice: एक ऐसी जाति ... जो महान, अद्भुत और इससे भी बड़ी होगी
  rationale: ἔθνος के लिए इस बाइबलीय सन्दर्भ में ‘जाति’ उपयुक्त है; तुलना को स्पष्ट रखते हुए πολὺ μᾶλλον की तीव्रता ‘इससे भी बड़ी’ में स्वाभाविक रूप से आती है।
theological_decisions:
- issue: ईश्वर का मूसा से ‘मुझे ... करने दो’ कहना
  choice: मुझे इन्हें नष्ट कर देने दो
  alternative: मुझे छोड़ दो कि मैं इन्हें नष्ट करूँ
  rationale: मूल कथन के मानवीय-संवादी रूप और मध्यस्थता की सम्भावना को ज्यों का त्यों रखा गया है; इसे ईश्वर की प्रकृति पर किसी व्यवस्थित धर्मवैज्ञानिक व्याख्या से नहीं बदला गया।
- issue: मूसा से नई जाति बनाने की प्रतिज्ञा
  choice: तुमसे एक ऐसी जाति बनाऊँगा
  alternative: तुम्हें एक महान जाति बनाऊँगा
  rationale: ποιήσω σε εἰς ἔθνος का आशय मूसा से उत्पन्न नई जाति बनाना है; चुनी हुई अभिव्यक्ति यह सम्बन्ध स्पष्ट करती है और मूसा को स्वयं ‘जाति’ कहने की अस्वाभाविकता से बचती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठकों के लिए सहज किन्तु गरिमापूर्ण। उद्धरण के भीतर उद्धरण सुरक्षित रखा गया है। ‘प्रजा’ और ‘जाति’ का भेद क्रमशः λαός और ἔθνος के अनुरूप रखा गया है।
