  yaml_path: translation/extra_canonical/1_clement/053/004.yaml
  text: And Moses said, "If you will forgive their sin, forgive; but if not, blot me also out of the book of the living."
translation:
  language: hi
  text: और मूसा ने कहा, “कदापि नहीं, प्रभु! इस प्रजा का पाप क्षमा कर; नहीं तो[a] मुझे भी जीवितों की पुस्तक से मिटा दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “और यदि नहीं, तो।”'
    reason: ἢ κἂν एक संक्षिप्त और कुछ हद तक असामान्य संयोजन है, जिसमें निहित शर्त को इस प्रकार भी खोला जा सकता है।
lexical_decisions:
- source_word: Μηδαμῶς
  choice: कदापि नहीं
  rationale: यह प्रबल निषेध है और परमेश्वर द्वारा प्रजा के विनाश के प्रस्ताव पर मूसा की तीखी असहमति को व्यक्त करता है। इसे छोड़ना उपलब्ध यूनानी पाठ की एक स्पष्ट अभिव्यक्ति को हटा देता।
- source_word: ἄφες
  choice: क्षमा कर
  rationale: यहाँ क्रिया पाप को छोड़ देने अथवा क्षमा करने के अर्थ में प्रयुक्त है; आधुनिक हिन्दी में “क्षमा कर” स्वाभाविक और संदर्भानुकूल है।
- source_word: τῷ λαῷ τούτῳ
  choice: इस प्रजा का
  rationale: यूनानी में क्षमा की क्रिया के साथ व्यक्ति कर्म संप्रदान कारक में और पाप कर्मकारक में है; हिन्दी में इसका स्वाभाविक रूप “इस प्रजा का पाप क्षमा कर” है।
- source_word: κἂν
  choice: नहीं तो … भी
  rationale: यह संक्षिप्त संयोजन वैकल्पिक अथवा निहित शर्त का संकेत देता है; “नहीं तो” हिन्दी में संबंध स्पष्ट करता है और “भी” καί की समावेशी शक्ति रखता है।
- source_word: βίβλου ζώντων
  choice: जीवितों की पुस्तक
  rationale: यह पदबंध शब्दशः ‘जीवितों की पुस्तक’ है और जीवन-पुस्तक की पारंपरिक धार्मिक छवि को अनावश्यक रूप से व्याख्यायित नहीं करता।
theological_decisions:
- issue: मूसा की विनती का स्वरूप
  choice: “कदापि नहीं, प्रभु!” को मुख्य पाठ में रखा गया
  alternative: इसे हटाकर वाक्य को “यदि तू उनका पाप क्षमा करे…” जैसी शर्त के रूप में प्रस्तुत करना
  rationale: दिए गए 1 क्लेमेंट के यूनानी पाठ में Μηδαμῶς, κύριε स्पष्ट रूप से उपस्थित है। निर्गमन की किसी भिन्न पाठ-परंपरा या अंग्रेज़ी परामर्श-पाठ के अनुसार इसे हटाना इस स्रोत को बदल देता।
- issue: ἢ κἂν की संक्षिप्तता
  choice: “नहीं तो … भी”
  alternative: “या फिर मुझे भी…” अथवा “और यदि नहीं, तो मुझे भी…”
  rationale: यूनानी अभिव्यक्ति अत्यंत संक्षिप्त है और उसका संबंध निहित शर्त के रूप में समझा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी वैकल्पिक निकटतर रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी अपनाई गई है। संबोधन में एकवचन “कर/दे” रखा गया है, क्योंकि प्राचीन धार्मिक संवाद में यह निकट और प्रत्यक्ष संबोधन है, अनादर नहीं। विराम-चिह्न मूसा की प्रबल असहमति और उसके बाद की मध्यस्थतापूर्ण विनती को स्पष्ट करते हैं।
