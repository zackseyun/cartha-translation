base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/005.yaml
  text: O great love! O unsurpassable perfection! A servant speaks boldly to his Lord, asks forgiveness for the multitude, or even asks to be blotted out with them.
translation:
  language: hi
  text: अहा, कितना महान प्रेम! अहा, कितनी अनुपम पूर्णता! एक सेवक अपने प्रभु के सामने साहस से बोलता है, जनसमुदाय के लिए क्षमा माँगता है, यहाँ तक कि उनके साथ स्वयं मिटा दिए जाने की विनती करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ μεγάλης ἀγάπης
  choice: अहा, कैसा महान प्रेम!
  rationale: विस्मय और प्रशंसा व्यक्त करने वाले ὦ तथा संबंधकारक विस्मय-वाक्य को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: τελειότητος ἀνυπερβλήτου
  choice: बेजोड़ सिद्धता
  rationale: τελειότης यहाँ नैतिक पूर्णता या चरित्र की परिपक्व सिद्धता को दर्शाता है; ἀνυπέρβλητος का अर्थ है जिसे कोई पार न कर सके।
- source_word: παρρησιάζεται
  choice: साहस से बोलता है
  rationale: शब्द प्रभु के सामने निर्भीक और खुलकर निवेदन करने का भाव देता है; केवल 'बोलता है' इसकी शक्ति को घटा देता।
- source_word: θεράπων
  choice: सेवक
  rationale: मूसा के लिए प्रयुक्त यह सम्मानपूर्ण सेवा-संबंधी पद है; 'दास' सम्भव है, पर यहाँ 'सेवक' अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: τῷ πλήθει
  choice: जनसमुदाय के लिए
  rationale: संदर्भ में यह इस्राएली लोगों की सामूहिकता को सूचित करता है; 'भीड़' अनावश्यक रूप से आकस्मिक अर्थ दे सकती है।
- source_word: ἐξαλειφθῆναι
  choice: अपना नाम भी मिटा दिए जाने
  rationale: पूर्ववर्ती पद में 'जीवितों की पुस्तक' से मिटाने की बात होने के कारण हिन्दी में 'नाम' को स्पष्ट किया गया है, जबकि मिटाए जाने का रूपक कायम है।
- source_word: ἀξιοῖ
  choice: विनती करता है
  rationale: यहाँ शब्द किसी बात को उचित ठहराकर माँगने या आग्रह करने का भाव देता है; 'विनती' प्रसंग की मध्यस्थतापूर्ण प्रार्थना के अनुकूल है।
theological_decisions:
- issue: मूसा की मध्यस्थता का स्वरूप
  choice: वह लोगों की क्षमा माँगता है और उनके साथ अपना नाम मिटाए जाने की विनती करता है।
  alternative: वह उनके स्थान पर स्वयं मिटाया जाना चाहता है।
  rationale: μετ’ αὐτῶν का सीधा अर्थ 'उनके साथ' है, 'उनके स्थान पर' नहीं; इसलिए प्रतिस्थापन का विचार पाठ में नहीं जोड़ा गया।
- issue: παρρησία का प्रभु के प्रति भाव
  choice: अपने प्रभु के सामने साहस से बोलता है
  alternative: अपने प्रभु से धृष्टता से बोलता है
  rationale: पाठ मूसा की महान प्रेमपूर्ण मध्यस्थता की प्रशंसा करता है; अतः यहाँ साहस सकारात्मक है, उद्दंडता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में विस्मयपूर्ण, गरिमामय और सामान्य पाठक के लिए सहज शैली रखी गई है। यूनानी की समानांतर विस्मयात्मक संरचना को दोहराया गया है और मध्यस्थता की तीव्रता को बिना अतिरिक्त doctrinal व्याख्या के सुरक्षित रखा गया है।
