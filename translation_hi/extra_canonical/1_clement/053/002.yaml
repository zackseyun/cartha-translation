base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/002.yaml
  text: For when Moses had gone up the mountain and had spent forty days and forty nights in fasting and self-abasement, God said to him, “Moses, Moses, come down quickly from here, because your people, whom you brought out of the land of Egypt, have acted lawlessly. They have quickly turned aside from the way that I commanded them; they have made molten images for themselves.”
translation:
  language: hi
  text: क्योंकि जब मूसा पहाड़ पर चढ़ गए और उपवास तथा दीनता में चालीस दिन और चालीस रात बिताए, तब परमेश्वर ने उनसे कहा, “मूसा, मूसा, यहाँ से शीघ्र नीचे उतर जाओ, क्योंकि तुम्हारे लोग, जिन्हें तुम मिस्र देश से निकाल लाए, व्यवस्था-विरुद्ध आचरण किया है। जिस मार्ग पर चलने की आज्ञा मैंने उन्हें दी थी, उससे वे शीघ्र ही भटक गए हैं; उन्होंने अपने लिए ढली हुई मूर्तियाँ बना ली हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νηστείᾳ καὶ ταπεινώσει
  choice: उपवास तथा दीनता में
  rationale: ‘उपवास’ νηστεία का सीधा और प्रचलित रूप है। ταπείνωσις आत्म-दमन, नम्रता या दीन अवस्था का संकेत दे सकता है; ‘दीनता’ मूल की तपस्वी और विनीत भावभूमि को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ἠνόμησεν
  choice: व्यवस्था-विरुद्ध आचरण करने लगे हैं
  rationale: क्रिया का अर्थ विधि या व्यवस्था का उल्लंघन करके अधर्म करना है। यह चयन केवल सामान्य ‘पाप’ कहने की अपेक्षा νόμος से जुड़े भाव को सुरक्षित रखता है।
- source_word: παρεβήσαν ... ἐκ τῆς ὁδοῦ
  choice: मार्ग से ... भटक गए हैं
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप, जिसमें आज्ञा दिए हुए मार्ग को छोड़ने का अर्थ बना रहता है।
- source_word: χωνευτά
  choice: ढली हुई मूर्तियाँ
  rationale: यह शब्द धातु गलाकर साँचे में ढाली गई वस्तुओं या प्रतिमाओं को सूचित करता है। संदर्भ में ‘मूर्तियाँ’ अर्थ स्पष्ट करता है, जबकि ‘ढली हुई’ निर्माण-विधि को सुरक्षित रखता है।
- source_word: τὸ τάχος
  choice: शीघ्र
  rationale: तत्कालता को संक्षिप्त, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἠνόμησεν में व्यवस्था और अधर्म का संबंध
  choice: व्यवस्था-विरुद्ध आचरण करने लगे हैं
  alternative: अधर्म किया है
  rationale: चयन मूल शब्द में निहित व्यवस्था-उल्लंघन को स्पष्ट रखता है और अपराध को किसी विशेष सांप्रदायिक परिभाषा में सीमित नहीं करता।
- issue: ταπείνωσις का तपस्वी अर्थ
  choice: दीनता
  alternative: आत्म-दमन
  rationale: ‘दीनता’ नम्र किए जाने या स्वयं को नम्र रखने की अस्पष्टता बचाती है; ‘आत्म-दमन’ मूल से अधिक कठोर और व्याख्यात्मक हो सकता है।
- issue: χωνευτά की वस्तुओं की पहचान
  choice: ढली हुई मूर्तियाँ
  alternative: ढली हुई प्रतिमाएँ
  rationale: निर्गमन के प्रसंग में उपासना के लिए बनाई गई धातु-आकृतियाँ अभिप्रेत हैं। ‘मूर्तियाँ’ सामान्य पाठक के लिए स्पष्ट है, पर किसी एक आकृति का नाम जोड़कर मूल से आगे नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली अपनाई गई है। वाक्य-संरचना मूल के क्रम के निकट है, पर हिन्दी में सहज प्रवाह के लिए कृदंत और प्रत्यक्ष कथन का स्वाभाविक प्रयोग किया गया है। आदरसूचक बहुवचन द्वारा मूसा का उल्लेख किया गया है।
