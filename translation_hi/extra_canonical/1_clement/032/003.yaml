base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/003.yaml
  text: Therefore all were glorified and magnified, not through themselves or through their works or through the righteous deeds that they did, but through his will.
translation:
  language: hi
  text: इसलिए वे सभी महिमान्वित हुए और महान बनाए गए—न अपने द्वारा, न अपने कामों के द्वारा, न उन धर्मी कामों के द्वारा जो उन्होंने किए, बल्कि उसकी इच्छा से।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: महिमा पाए
  rationale: यूनानी कर्मवाच्य का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सम्मान/महिमा प्राप्त होने का भाव बनाए रखता है।
- source_word: ἐμεγαλύνθησαν
  choice: महानता पाए
  rationale: ἐδοξάσθησαν के समानांतर कर्मवाच्य भाव को सुरक्षित रखते हुए ‘महान किए गए’ की अपेक्षा अधिक स्वाभाविक हिन्दी देता है।
- source_word: δικαιοπραγίας
  choice: धर्ममय कार्यों
  rationale: सही और धर्मसंगत आचरण का भाव व्यक्त करता है; इसे केवल सामान्य ‘अच्छे कामों’ तक सीमित नहीं करता।
- source_word: διὰ τοῦ θελήματος αὐτοῦ
  choice: उसकी इच्छा के कारण
  rationale: διά के कारण/आधार संबंधी अर्थ को स्पष्ट रखता है और αὐτοῦ के पुरुषवाचक सर्वनाम को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: महिमा और महानता पाने का आधार
  choice: व्यक्ति, उसके काम और उसके धर्ममय कार्य नहीं, बल्कि ‘उसकी इच्छा’
  alternative: ‘उसकी इच्छा के द्वारा’
  rationale: पाठ का तीखा विरोध बनाए रखा गया है। ‘के कारण’ यहाँ διά + संबंधकारक के आधार/कारण के भाव को सहज हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट धर्मसैद्धांतिक प्रणाली को आरोपित किए।
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसकी’ के रूप में अस्पष्टता सुरक्षित रखी
  alternative: ‘परमेश्वर की’
  rationale: इस पद में संज्ञा स्पष्ट रूप से दोहराई नहीं गई है; इसलिए स्रोत की सर्वनामगत संरचना और संदर्भ-निर्भरता को बनाए रखना उचित है।
translation_notes:
  register: आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट हिन्दी। मूल के समानांतर निषेधों को ‘न... न... न... बल्कि’ संरचना में रखा गया है। कोई पादटिप्पणी आवश्यक नहीं।
