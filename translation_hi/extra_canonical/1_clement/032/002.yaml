reference: 1 Clement 32:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/002.yaml
  text: For from him are priests and Levites[a], all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining scepters are in no small glory, just as God promised, saying, “Your seed will be as the stars of heaven.”
translation:
  language: hi
  text: क्योंकि उसी से याजक और लेवीय हैं—वे सभी जो परमेश्वर की वेदी पर सेवा करते हैं; उसी से शरीर के अनुसार प्रभु यीशु हैं; उसी से यहूदा के वंश के अनुसार राजा, शासक और अगुवे हैं; और उसके शेष राजदंड भी कम महिमावान नहीं हैं[a], जैसा परमेश्वर ने प्रतिज्ञा की थी, जब उसने कहा, “तेरा वंश आकाश के तारों के समान होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “छोटी महिमा में नहीं हैं।”
    reason: यूनानी निषेधात्मक अलंकार और वाक्यांश की असामान्यता को दिखाने के लिए।
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: उसी से
  rationale: बार-बार आने वाली इस अभिव्यक्ति को बनाए रखते हुए पूर्वज से वंशगत उद्भव का अर्थ व्यक्त करता है।
- source_word: λειτουργοῦντες
  choice: सेवा करते हैं
  rationale: वेदी-संबंधी धार्मिक सेवा का भाव प्रसंग से स्पष्ट है; यह आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: τὸ κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: मसीह के मानवीय वंश की ओर संकेत करने वाली मूल अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के निकटता से सुरक्षित रखता है।
- source_word: κατὰ τὸν Ἰούδαν
  choice: यहूदा के वंश के अनुसार
  rationale: शाब्दिक 'यहूदा के अनुसार' हिन्दी में अस्पष्ट होता; 'वंश' जोड़ने से संदर्भित वंश-संबंध स्पष्ट होता है, बिना किसी संप्रदायगत अर्थ के।
- source_word: σκῆπτρα
  choice: राजदंड
  rationale: पाठ में आए बहुवचन 'scepters' का औपचारिक अर्थ बनाए रखा गया है; इसे अनुमानपूर्वक 'गोत्र' नहीं बनाया गया।
- source_word: σπέρμα
  choice: वंश
  rationale: प्रतिज्ञा के वंशज-संबंधी अर्थ के लिए स्वाभाविक और प्रतिष्ठित हिन्दी शब्द।
theological_decisions:
- issue: यीशु का मानवीय वंश
  choice: शरीर के अनुसार प्रभु यीशु
  alternative: मानवीय वंश से प्रभु यीशु
  rationale: मूल κατὰ σάρκα की पारंपरिक और धर्मवैचारिक रूप से खुली अभिव्यक्ति को सुरक्षित रखा गया है; व्याख्यात्मक विकल्प को मुख्य पाठ में नहीं रखा।
- issue: σκῆπτρα का असामान्य बहुवचन
  choice: उसके शेष राजदंड
  alternative: उसके शेष गोत्र
  rationale: प्राप्त यूनानी पाठ को प्राथमिकता दी गई है। 'गोत्र' अर्थ-सुधार जैसा होता और वास्तविक पाठगत कठिनाई को छिपा देता।
- issue: निषेधात्मक अलंकार οὐκ ἐν μικρᾷ δόξῃ
  choice: कम महिमा में नहीं हैं
  alternative: बहुत महिमाशाली हैं
  rationale: मूल की litotes और उसके संयमित बल को बनाए रखा गया है, उसे सीधे अतिशयोक्तिपूर्ण कथन में नहीं बदला।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। समानांतर वाक्य-रचना को अर्धविरामों से सुरक्षित रखा गया है। 'राजदंड' जानबूझकर रखा गया है ताकि कठिन यूनानी σκῆπτρα को व्याख्यात्मक रूप से 'गोत्र' में न बदला जाए।
