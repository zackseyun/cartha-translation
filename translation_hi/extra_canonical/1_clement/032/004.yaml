id: 1CLEM.32.4
reference: 1 Clement 32:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/004.yaml
  text: And so we also[a], having been called through his will in Christ Jesus, are not justified by ourselves, nor by our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, by which the Almighty God has justified all who have been from the beginning. To him be the glory forever and ever[b]. Amen.
translation:
  language: hi
  text: इसलिए हम भी, जो उसकी इच्छा के द्वारा मसीह यीशु में बुलाए गए हैं, न तो अपने आप से धर्मी ठहराए जाते हैं, न अपनी बुद्धि, समझ या भक्ति के द्वारा, और न उन कामों के द्वारा जो हमने शुद्ध हृदय से किए हैं; बल्कि उस विश्वास के द्वारा, जिसके माध्यम से सर्वशक्तिमान परमेश्वर ने आरम्भ से जितने लोग हुए हैं, उन सबको धर्मी ठहराया है। उसी की महिमा युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: यह आरम्भिक मसीही पत्रों का प्रचलित सूत्र है; ‘मसीह’ Χριστός के उपाधि-संबंधी अर्थ को रखते हुए हिन्दी में स्वाभाविक है।
- source_word: δικαιούμεθα / ἐδικαίωσεν
  choice: धर्मी ठहराए जाते हैं / धर्मी ठहराया है
  rationale: δικαιόω के न्यायिक और संबंधपरक बल को बनाए रखने वाला परिचित, स्पष्ट हिन्दी प्रयोग है; दोनों रूपों में लेखक की शब्दगत पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: εὐσεβείας
  choice: भक्ति
  rationale: यहाँ शब्द धार्मिक श्रद्धा और ईश्वरनिष्ठ आचरण को सूचित करता है; ‘भक्ति’ सामान्य हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: ἔργων ὧν κατειργασάμεθα
  choice: उन कामों ... जो हमने ... किए हैं
  rationale: κατεργάζομαι का भाव वास्तव में किए या संपन्न किए गए कामों का है; सरल आधुनिक हिन्दी में ‘किए हैं’ स्वाभाविक है।
- source_word: ἐν ὁσιότητι καρδίας
  choice: हृदय की पवित्रता में
  rationale: मूल की संज्ञात्मक रचना और भीतरी धार्मिक शुद्धता का भाव दोनों सुरक्षित हैं।
- source_word: τοὺς ἀπ’ αἰῶνος
  choice: युग के आरम्भ से सभी लोगों को
  rationale: ἀπ’ αἰῶνος अति प्राचीन काल से होने का संकेत देता है; यह अनुवाद कालगत व्यापकता को स्पष्ट करता है, बिना ‘सृष्टि’ जैसे अधिक विशिष्ट विचार को जोड़ने के।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: हिन्दी धार्मिक गद्य में स्वाभाविक और प्रतिष्ठित अभिव्यक्ति, जो यूनानी की अनन्तकालिक स्तुति का बल रखती है।
theological_decisions:
- issue: धर्मी ठहराए जाने का आधार और माध्यम
  choice: मनुष्य स्वयं, ज्ञान, भक्ति या कामों से नहीं, बल्कि विश्वास के द्वारा धर्मी ठहराया जाता है
  alternative: विश्वास को स्वयं कोई मानवीय पुण्य-कर्म मानकर प्रस्तुत करना
  rationale: मूल पाठ διὰ की समानांतर शृंखला में मानवीय आधारों का निषेध करके πίστεως को विपरीत माध्यम के रूप में रखता है; अनुवाद इसी तनाव को बिना अतिरिक्त व्यवस्थित धर्मशास्त्र जोड़े सुरक्षित रखता है।
- issue: πάντας τοὺς ἀπ’ αἰῶνος का विस्तार
  choice: युग के आरम्भ से सभी लोगों को
  alternative: आरम्भ से अस्तित्व में आए प्रत्येक मनुष्य को बिना किसी निहित योग्यता के सार्वभौमिक रूप से धर्मी ठहराया गया
  rationale: संदर्भ विश्वास के द्वारा धर्मी ठहराए गए पूर्वकालीन लोगों की बात करता है। हिन्दी वाक्य मूल की संक्षिप्तता रखता है और ‘सभी’ की सीमा पर मूल से अधिक सिद्धान्तगत स्पष्टीकरण नहीं जोड़ता।
- issue: ‘मसीह यीशु में’ का संबंध
  choice: बुलाहट को ‘मसीह यीशु में’ स्थित रखना
  alternative: वाक्यांश को केवल परमेश्वर की इच्छा या धर्मी ठहराए जाने से जोड़ना
  rationale: यूनानी में ἐν Χριστῷ Ἰησοῦ κληθέντες स्वाभाविक रूप से बुलाए जाने की मसीह-संबंधी स्थिति बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘धर्मी ठहराना’, ‘सर्वशक्तिमान परमेश्वर’ और ‘युगानुयुग’ जैसे परिचित धार्मिक पद रखे गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए सहज बनाया गया है।
