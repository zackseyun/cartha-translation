review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the central contrast: the calling is according to God''s will in Christ Jesus, justification is not grounded in oneself, wisdom, understanding, godliness, or deeds, but in faith. The repeated δικαιόω is appropriately rendered consistently as “धर्मी ठहराना.” However, τοὺς ἀπ’ αἰῶνος is more precisely represented as those who have been from the beginning, rather than “युग के आरम्भ से सभी लोगों,” which is somewhat awkward and can over-specify the referent.'
  naturalness: The register is suitable and generally clear. “हृदय की पवित्रता में किए हैं” is overly literal and less idiomatic in Hindi; “शुद्ध हृदय से किए हैं” communicates the source sense naturally. “युगानुयुग होती रहे” is understandable, but the Greek benediction is more directly and idiomatically rendered, “युगानुयुग महिमा हो।”
  terminology: “मसीह यीशु,” “धर्मी ठहराना,” “भक्ति,” and “सर्वशक्तिमान परमेश्वर” are appropriate, recognizable terms in dignified modern Hindi. “विश्वास” correctly renders πίστεως without importing a more specific theological interpretation.
  issues:
  - severity: medium
    issue: The phrase “युग के आरम्भ से सभी लोगों को” is an awkward and slightly imprecise rendering of πάντας τοὺς ἀπ’ αἰῶνος.
    rationale: The Greek means “all those who have been from the beginning.” “आरम्भ से जितने लोग हुए हैं, उन सबको” preserves the temporal qualification on the people and avoids the unusual singular expression “युग के आरम्भ.”
  - severity: low
    issue: “हृदय की पवित्रता में किए हैं” is unnatural Hindi.
    rationale: ἐν ὁσιότητι καρδίας describes the holy/pure quality of the heart in which the deeds were done. “शुद्ध हृदय से किए हैं” is natural while retaining that sense.
  - severity: low
    issue: The closing doxology is better expressed as a direct optative-style wish.
    rationale: ἔστω ἡ δόξα is closely rendered by “महिमा हो,” rather than the more durative “महिमा होती रहे.”
  revised_text: इसलिए हम भी, जो उसकी इच्छा के द्वारा मसीह यीशु में बुलाए गए हैं, न तो अपने आप से धर्मी ठहराए जाते हैं, न अपनी बुद्धि, समझ या भक्ति के द्वारा, और न उन कामों के द्वारा जो हमने शुद्ध हृदय से किए हैं; बल्कि उस विश्वास के द्वारा, जिसके माध्यम से सर्वशक्तिमान परमेश्वर ने आरम्भ से जितने लोग हुए हैं, उन सबको धर्मी ठहराया है। उसी की महिमा युगानुयुग हो। आमीन।
