translation:
  language: hi
  text: यदि कोई इस पर एक-एक करके निष्कपट मन से विचार करे, तो वह उसके द्वारा दिए गए वरदानों की महानता को पहचान लेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰλικρινῶς
  choice: निष्कपटता से
  rationale: यह शब्द विचार की सच्चाई, शुद्धता और बिना कपट के मनन करने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: καθ’ ἓν ἕκαστον
  choice: एक-एक पहलू करके
  rationale: यह पद क्रियाविशेषण रूप में क्रमशः और अलग-अलग बिंदुओं पर विचार करने को दर्शाता है, न कि सीधे कर्म के रूप में ‘हर वस्तु’ को।
- source_word: κατανοήσῃ
  choice: विचार करे
  rationale: संदर्भ में इसका अर्थ ध्यानपूर्वक मनन या विचार करना है।
- source_word: ἐπιγνώσεται
  choice: पहचान लेगा
  rationale: यह साधारण देखने से अधिक, विचार के फलस्वरूप पूर्णतर बोध या पहचान को व्यक्त करता है।
- source_word: μεγαλεῖα
  choice: महानता
  rationale: बहुवचन रूप महिमामय परिमाण या महान विशेषताओं को सूचित कर सकता है; ‘वरदानों की महानता’ हिन्दी में अर्थ को स्वाभाविक रूप से समेटता है।
- source_word: δωρεῶν
  choice: वरदानों
  rationale: दिए गए अनुग्रहपूर्ण उपहारों के लिए ‘वरदान’ उपयुक्त, स्पष्ट और धार्मिक रूप से गैर-सांप्रदायिक शब्द है।
theological_decisions:
- issue: ὑπ’ αὐτοῦ में सर्वनाम का संदर्भ
  choice: ‘उसके द्वारा’ रखकर संदर्भ को अस्पष्ट रहने दिया गया
  alternative: ‘परमेश्वर के द्वारा’
  rationale: इस पृथक वाक्य में αὐτοῦ का संदर्भ व्याकरणतः पूर्ववर्ती प्रसंग पर निर्भर है; नाम जोड़ने से मूल की निहितता को अनावश्यक रूप से स्पष्ट कर दिया जाता।
