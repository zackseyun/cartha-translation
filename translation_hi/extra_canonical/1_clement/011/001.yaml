  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: hi
  text: अतिथि-सत्कार और धर्मपरायणता के कारण लूत सदोम से बचाया गया, जब उसके आस-पास के पूरे प्रदेश का आग और गंधक से न्याय किया गया। इस प्रकार स्वामी ने स्पष्ट कर दिया कि वह उन लोगों को नहीं छोड़ता जो उस पर आशा रखते हैं, परन्तु जो दूसरी ओर मुड़ जाते हैं, उन्हें दण्ड और यातना के लिए ठहराता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίαν
  choice: अतिथि-सत्कार
  rationale: यह यूनानी शब्द अपरिचितों और अतिथियों का स्वागत करने के गुण को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: यहाँ ईश्वर के प्रति श्रद्धापूर्ण और धर्मनिष्ठ आचरण अभिप्रेत है; ‘भक्ति’ संक्षेप में इस भाव को व्यक्त करती है।
- source_word: τῆς περιχώρου πάσης
  choice: उसके आस-पास का सारा प्रदेश
  rationale: यह सदोम के चारों ओर के पूरे भूभाग को सूचित करता है, न कि केवल नगर को।
- source_word: κριθείσης
  choice: दण्डित किया गया
  rationale: शाब्दिक अर्थ ‘न्याय किया गया’ है, पर आग और गन्धक के प्रसंग में न्याय का दण्डात्मक परिणाम सामने है; इसलिए हिन्दी में यह अधिक स्वाभाविक है।
- source_word: ὁ δεσπότης
  choice: स्वामी
  rationale: मूल का प्रभुता और अधिकार दर्शाने वाला सामान्य पद सुरक्षित रखा गया है।
- source_word: τοὺς ἐλπίζοντας ἐπʼ αὐτόν
  choice: जो उस पर आशा रखते हैं
  rationale: मूल के निरन्तर भरोसे और आशा के भाव को सीधे बनाए रखता है।
- source_word: ἑτεροκλινεῖς
  choice: जो दूसरे मार्ग की ओर मुड़ जाते हैं
  rationale: दुर्लभ शब्द का मूल भाव सही मार्ग से दूसरी दिशा में झुकने या भटकने का है; अनावश्यक रूप से किसी विशिष्ट doctrinal पहचान को नहीं जोड़ा गया।
- source_word: κόλασιν καὶ αἰκισμόν
  choice: दण्ड और यातना
  rationale: दोनों संज्ञाओं का भेद रखते हुए दण्ड तथा कठोर पीड़ा/दुर्व्यवहार का भाव व्यक्त किया गया है।
theological_decisions:
- issue: लूत के बचाए जाने में अतिथि-सत्कार और भक्ति की भूमिका
  choice: ‘के कारण’ द्वारा मूल के कारणवाचक सम्बन्ध को स्पष्ट रखा गया
  alternative: ‘के द्वारा’ या ‘के चलते’
  rationale: διὰ के साथ कर्मकारक यहाँ कारण को दर्शाता है; पाठ के धर्मवैचारिक तनाव को कम करके इसे केवल प्रमाण या अवसर नहीं बनाया गया।
- issue: ἑτεροκλινεῖς का नैतिक या धर्मवैचारिक आशय
  choice: ‘जो दूसरे मार्ग की ओर मुड़ जाते हैं’
  alternative: ‘जो विश्वास से भटकते हैं’ या ‘विश्वासघाती’
  rationale: मूल दुर्लभ और कुछ हद तक अस्पष्ट है; अनुवाद दिशा-परिवर्तन का चित्र बनाए रखता है और यह तय नहीं करता कि आशय विशेष रूप से अविश्वास, विधर्म या सामान्य दुष्टता है।
- issue: τίθησιν में दैवी नियुक्ति
  choice: ‘दण्ड और यातना के लिए ठहराता है’
  alternative: ‘दण्ड और यातना में डाल देता है’
  rationale: ‘ठहराता है’ नियुक्त करने/रखने के मूल भाव को सुरक्षित रखता है और अनावश्यक कालगत विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-संरचना मूल के तर्कक्रम—लूत का उद्धार, प्रदेश का न्याय, और उससे निकला सिद्धान्त—को बनाए रखती है।
