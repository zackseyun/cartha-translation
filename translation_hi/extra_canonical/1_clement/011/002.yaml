id: 1CLEM.11.2
reference: 1 Clement 11:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: συνεξελθούσης γὰρ αὐτῷ τῆς γυναικὸς ἑτερογνώμονος ὑπάρχουσης καὶ οὐκ ἐν ὁμονοίᾳ, εἰς τοῦτο σημεῖον ἐτέθη, ὥστε γενέσθαι αὐτὴν στήλην ἁλὸς ἕως τῆς ἡμέρας ταύτης, εἰς τὸ γνωστὸν εἶναι πᾶσιν, ὅτι οἱ δίψυχοι καὶ οἱ διστάζοντες περὶ τῆς τοῦ θεοῦ δυνάμεως εἰς κρίμα καὶ εἰς σημείωσιν πάσαις ταῖς γενεαῖς γίγονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/002.yaml
  text: For when his wife went out with him[a], being of a different mind and not in agreement, she was made a sign for this reason, so that she became a pillar of salt to this very day[c][b], in order that it might be known to all that the double-minded and those who doubt the power of God become a judgment and a warning to all generations.
translation:
  language: hi
  text: 'क्योंकि जब उसकी पत्नी भी उसके साथ बाहर निकली, तो वह उससे अलग सोच रखती थी और उसके साथ एकमत नहीं थी। इसी कारण उसे एक चिन्ह ठहराया गया, यहाँ तक कि वह नमक का खंभा बन गई, जो आज के दिन तक बना हुआ है। इसका उद्देश्य यह था कि सभी जान लें: जो दुचित्ते हैं[a] और परमेश्वर की सामर्थ्य के विषय में संदेह करते हैं, वे सभी पीढ़ियों के लिए न्याय[b] और चेतावनी का चिन्ह[c] बन जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘दो मन वाले’।'
    reason: δίψυχοι की सजीव यूनानी उपमा और विभाजित मन/निष्ठा का भाव दिखाने के लिए।
  - marker: b
    text: या ‘दोषनिर्णय’ अथवा ‘दंड’।
    reason: κρίμα की न्यायिक अर्थ-सीमा को सुरक्षित रखने के लिए।
  - marker: c
    text: या ‘चेतावनी’ अथवा ‘चिह्नित उदाहरण’।
    reason: σημείωσις चेतावनी के साथ-साथ दूसरों के लिए निशानी बने उदाहरण का भाव भी रखता है।
lexical_decisions:
- source_word: ἑτερογνώμονος
  choice: उससे अलग सोच रखती थी
  rationale: यह शब्द किसी दूसरे या भिन्न मत/मन के होने को व्यक्त करता है। सहज हिन्दी में संबंधसूचक भाव स्पष्ट किया गया है, पर यह नहीं बताया गया कि असहमति का ठीक विषय क्या था।
- source_word: ὁμονοίᾳ
  choice: एकमत
  rationale: क्लेमेंट में यह मेल, सहमति और साझा मन का महत्त्वपूर्ण भाव रखता है। ‘एकमत’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ ἑτερογνώμων के साथ बने विरोध को बनाए रखता है।
- source_word: δίψυχοι
  choice: दुचित्ते
  rationale: शाब्दिक भाव ‘दो मन/प्राण वाले’ है; ‘दुचित्ते’ अनिर्णय और विभाजित निष्ठा दोनों को संक्षेप में बनाए रखता है।
- source_word: κρίμα
  choice: न्याय
  rationale: शब्द का अर्थ न्यायिक निर्णय, दोषनिर्णय अथवा दंड हो सकता है। मुख्य पाठ में व्यापक ‘न्याय’ रखा गया है और अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: σημείωσιν
  choice: चेतावनी का चिन्ह
  rationale: यह केवल मौखिक चेतावनी नहीं, बल्कि चिह्नित उदाहरण या चेतावनीसूचक निशानी का भाव देता है। ‘चेतावनी का चिन्ह’ इस मूर्त उदाहरण को स्पष्ट करता है।
theological_decisions:
- issue: लूत की पत्नी के उदाहरण का प्रयोजन
  choice: उसका परिणाम सभी पीढ़ियों के लिए न्याय और चेतावनी का चिन्ह बताया गया है
  alternative: यह कहना कि परमेश्वर प्रत्यक्ष रूप से प्रत्येक संदेह करने वाले को उसी प्रकार दंड देगा
  rationale: यूनानी पाठ उदाहरण के सार्वकालिक चेतावनीकारी कार्य पर बल देता है; वह प्रत्येक मामले के परिणाम की विशिष्ट रीति निर्धारित नहीं करता।
- issue: κρίμα का न्यायिक अर्थ
  choice: ‘न्याय’ रखकर निर्णय और दंड दोनों की संभाव्यता खुली रखी गई है
  alternative: केवल ‘दंड’
  rationale: κρίμα में न्यायिक फैसला और उसके दंडात्मक परिणाम दोनों संभव हैं; किसी एक को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य रखा गया है। ‘एकमत’, ‘दुचित्ते’ और ‘चेतावनी का चिन्ह’ जैसे पद मूल के वैचारिक विरोध और रूपक को बनाए रखते हैं। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि कारण, परिणाम और उद्देश्य का क्रम सुरक्षित है।
