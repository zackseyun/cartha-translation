id: 1CLEM.16.10
reference: 1 Clement 16:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
translation:
  language: hi
  text: 'और मैं उसकी कब्र के बदले दुष्टों को,

    और उसकी मृत्यु के बदले धनवानों को दूँगा;

    क्योंकि उसने कोई अधर्म नहीं किया,

    और न उसके मुँह में छल पाया गया।

    और प्रभु उसे उस पीड़ा से शुद्ध करना चाहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρούς
  choice: दुष्टों
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है; ‘दुष्टों’ उसके नैतिक अर्थ और व्याकरणिक संख्या दोनों को बनाए रखता है।
- source_word: ἀντὶ
  choice: के बदले
  rationale: दोनों समानांतर पदों में प्रतिस्थापन अथवा विनिमय का मूल अर्थ सीधे व्यक्त करता है।
- source_word: ἀνομίαν
  choice: अधर्म
  rationale: यह व्यवस्था-विरोधी और नैतिक दुष्टता के व्यापक अर्थ को संक्षेप में व्यक्त करता है; इसे किसी खास अपराध तक सीमित नहीं करता।
- source_word: δόλος
  choice: छल
  rationale: कपटपूर्ण वाणी या धोखे का स्वाभाविक और सटीक हिन्दी प्रतिशब्द।
- source_word: πληγῆς
  choice: पीड़ा
  rationale: यह शब्द प्रहार, घाव या उससे उपजे कष्ट का अर्थ दे सकता है। प्रसंग में ‘पीड़ा’ स्वाभाविक रहते हुए इसकी व्यापकता को पर्याप्त रूप से बचाता है।
- source_word: καθαρίσαι
  choice: शुद्ध करना
  rationale: क्रिया के प्रत्यक्ष अर्थ को सुरक्षित रखता है और उसे ‘चंगा करना’ जैसे व्याख्यात्मक विकल्प में नहीं बदलता।
- source_word: βούλεται
  choice: चाहता है
  rationale: प्रभु की इच्छा या अभिप्राय को सरल, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रभु द्वारा पीड़ित सेवक को ‘शुद्ध’ करने का कथन
  choice: ‘उसे उस पीड़ा से शुद्ध करना चाहता है’
  alternative: ‘उसे उस पीड़ा से चंगा करना चाहता है’
  rationale: καθαρίσαι का मूल अर्थ ‘शुद्ध करना’ है। कठिन धर्मवैचारिक तनाव को किसी उपचार-संबंधी व्याख्या से सहज नहीं बनाया गया।
- issue: दफ़न और मृत्यु के बदले दिए जाने वाले समूह
  choice: ग्रीक पाठ के क्रम और संबंध को ज्यों का त्यों रखा गया
  alternative: यशायाह के अन्य पाठरूपों के अनुसार ‘उसकी कब्र दुष्टों के साथ…’
  rationale: यहाँ 1 क्लेमेंट में उद्धृत उपलब्ध ग्रीक पाठ का अनुवाद किया गया है; अधिक परिचित बाइबलीय पाठ के अनुरूप इसे सुधारा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और स्रोत-सन्निकट शैली अपनाई गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पंक्ति-विन्यास रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में भी कोई पादटिप्पणी-चिह्न नहीं है।
