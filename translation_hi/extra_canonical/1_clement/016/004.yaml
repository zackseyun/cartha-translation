  yaml_path: translation/extra_canonical/1_clement/016/004.yaml
  text: This one bears our sins and suffers on our behalf[a], and we considered him to be in pain and under a blow and in affliction.
translation:
  language: hi
  text: वह हमारे पापों को वहन करता है और हमारे लिए दुःख सहता है; और हमने उसे पीड़ा में, प्रहार से आहत और क्लेश में माना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: यह वही है
  rationale: संकेतवाचक पद को बल सहित स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς ἁμαρτίας ἡμῶν φέρει
  choice: हमारे पापों को उठा लेता है
  rationale: φέρει के वहन करने के भाव को बनाए रखता है और यशायाह 53 की उद्धरणात्मक पृष्ठभूमि में स्वाभाविक है।
- source_word: περὶ ἡμῶν ὀδυνᾶται
  choice: हमारे लिए दुःख सहता है
  rationale: περὶ ἡμῶν का प्रतिनिधिक/हितार्थ भाव और ὀδυνᾶται की पीड़ा दोनों स्पष्ट करता है।
- source_word: ἐλογισάμεθα
  choice: हमने समझा
  rationale: मानना, विचार करना या आकलन करना—इन अर्थों को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ἐν πόνῳ
  choice: पीड़ा में
  rationale: यहाँ πόνος का अर्थ परिश्रम से अधिक दर्द या पीड़ा है।
- source_word: ἐν πληγῇ
  choice: मार के अधीन
  rationale: πληγή की चोट या प्रहार की संज्ञात्मक छवि को महामारी जैसे आधुनिक अर्थ से बचाते हुए व्यक्त करता है।
- source_word: ἐν κακώσει
  choice: क्लेश में
  rationale: दुर्दशा, उत्पीड़न और कष्ट के व्यापक भाव को गरिमापूर्ण हिन्दी में संजोता है।
theological_decisions:
- issue: पापों को वहन करने की भाषा
  choice: हमारे पापों को उठा लेता है
  alternative: हमारे पापों को ढोता है
  rationale: प्रायश्चित्त के आशय को न तो विस्तृत व्याख्या से सीमित किया गया है, न हटाया गया है; मूल की वहन-संबंधी छवि सुरक्षित है।
- issue: περὶ ἡμῶν का संबंध
  choice: हमारे लिए दुःख सहता है
  alternative: हमारी ओर से दुःख सहता है
  rationale: मूल में हितार्थ और प्रतिनिधिक दोनों रंग संभव हैं; मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, बिना किसी विशिष्ट प्रायश्चित्त-सिद्धान्त को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी की समानांतर संरचना तथा पीड़ा की क्रमिक छवियों को यथासंभव सुरक्षित रखा गया है।
