source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἄνδρες ἀγαπητοί, τίς ὁ ὑπογραμμὸς· δεδομένoς ἡμῖν· εἰ γὰρ ὁ κύριος οὕτως ἐταπεινοφρόνησεν, τί ποιήσωμεν ἡμεῖς οἱ ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ δι’ αὐτοῦ ἐλθόντες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/017.yaml
  text: See[a], beloved men, what is the pattern given to us. For if the Lord so humbled himself, what should we do, we who through him have come under the yoke of his grace?
translation:
  language: hi
  text: देखो[a], प्रियजनो, हमें कौन-सा आदर्श दिया गया है। क्योंकि यदि प्रभु ने इस प्रकार दीनता दिखाई, तो हम क्या करें—हम, जो उसी के द्वारा उसके अनुग्रह के जुए के अधीन आए हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रियजनो, तुम देखते हो कि हमें कौन-सा आदर्श दिया गया है।”
    reason: यूनानी ὁρᾶτε का रूप आज्ञार्थक ‘देखो’ और निर्देशार्थक ‘तुम देखते हो’—दोनों रूपों में समझा जा सकता है; प्रसंग आज्ञार्थक अर्थ का समर्थन करता है।
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: देखो
  rationale: रूप व्याकरणतः आज्ञार्थक या निर्देशार्थक दोनों हो सकता है; यहाँ पूर्ववर्ती उदाहरण की ओर ध्यान दिलाने वाली उपदेशात्मक शैली के कारण आज्ञार्थक अर्थ मुख्य पाठ में रखा गया है।
- source_word: ἄνδρες ἀγαπητοί
  choice: प्रियजनो
  rationale: शाब्दिक ‘प्रिय पुरुषो’ आधुनिक हिन्दी में अस्वाभाविक है। ‘प्रियजनो’ संबोधन की आत्मीयता और गरिमा बनाए रखता है, बिना अनावश्यक सांप्रदायिक भाषा जोड़े।
- source_word: ὑπογραμμός
  choice: आदर्श
  rationale: यह अनुकरण के लिए प्रस्तुत नमूने या प्रतिरूप को दर्शाता है; ‘आदर्श’ इस संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: ἐταπεινοφρόνησεν
  choice: दीनता दिखाई
  rationale: क्रिया का भाव नम्र या दीन मनोवृत्ति रखने और उसे आचरण में प्रकट करने का है। यह ‘अपने आपको दीन किया’ की अपेक्षा मूल क्रिया के मनोभाव-संबंधी पक्ष को बेहतर सुरक्षित रखता है।
- source_word: ζυγὸν τῆς χάριτος αὐτοῦ
  choice: उसके अनुग्रह का जुआ
  rationale: मूल रूपक को बनाए रखा गया है; ‘जुआ’ अधीनता और बंधी हुई सेवा दोनों का भाव व्यक्त करता है।
theological_decisions:
- issue: प्रभु की दीनता का स्वरूप
  choice: ‘दीनता दिखाई’
  alternative: ‘अपने आपको दीन किया’
  rationale: मूल क्रिया ταπεινοφρονέω मुख्यतः दीन मन रखने या दीनतापूर्वक व्यवहार करने को व्यक्त करती है; मुख्य पाठ किसी विशेष मसीही आत्म-रिक्तीकरण सिद्धांत को इस क्रिया में आवश्यकता से अधिक नहीं भरता।
- issue: अनुग्रह के जुए के नीचे आने का माध्यम
  choice: ‘उसी के द्वारा’
  alternative: ‘उसके कारण’
  rationale: δι’ αὐτοῦ को माध्यमसूचक रखा गया है और सर्वनाम का संदर्भ निकटतम ‘प्रभु’ से जोड़ा गया है, जैसा यूनानी वाक्य स्वाभाविक रूप से संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। आलंकारिक प्रश्न तथा ‘अनुग्रह का जुआ’ रूपक मूल के अनुसार सुरक्षित हैं। संबोधन को स्वाभाविक बनाने के लिए ‘प्रियजनो’ चुना गया है।
