base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/008.yaml
  text: 'Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.'
translation:
  language: hi
  text: '“उसकी पीढ़ी[a] का वर्णन कौन करेगा?


    क्योंकि उसका जीवन पृथ्वी से ले लिया जाता है।


    मेरी प्रजा के अधर्मों के कारण वह मृत्यु को पहुँचा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पीढ़ी” का अर्थ यहाँ उसका वंश, उसके समय के लोग, या उसके जीवन-वृत्त से संबंधित बात भी हो सकता है।
    reason: यूनानी γενεά की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: γενεὰν
  choice: पीढ़ी
  rationale: यूनानी शब्द का सामान्य और सीधा समतुल्य; इससे वंश, समकालीन पीढ़ी या जीवन-काल से जुड़ी मूल अस्पष्टता पूरी तरह समाप्त नहीं होती।
- source_word: διηγήσεται
  choice: वर्णन करेगा
  rationale: क्रिया का अर्थ विस्तार से बताना या वर्णन करना है; यह प्रश्न की काव्यात्मक गंभीरता बनाए रखता है।
- source_word: αἴρεται
  choice: उठा लिया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य रूप को सुरक्षित रखता है और पृथ्वी से जीवन हटाए जाने की छवि को स्पष्ट करता है।
- source_word: ἀνομιῶν
  choice: अधर्म के कामों
  rationale: यह केवल सामान्य पाप नहीं, बल्कि व्यवस्था-विरोधी या अधर्मपूर्ण कृत्यों को व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक बहुवचन अर्थ देता है।
- source_word: ἤκει εἰς θάνατον
  choice: मृत्यु तक आ पहुँचा
  rationale: ‘मृत्यु में आया’ जैसे अस्वाभाविक शब्दशः रूप से बचते हुए गति और परिणति—दोनों को बनाए रखता है।
theological_decisions:
- issue: γενεά का आशय
  choice: मुख्य पाठ में ‘पीढ़ी’ रखकर अर्थ खुला रखा गया
  alternative: ‘वंश’, ‘समकालीन लोग’ या ‘जीवन-वृत्त’
  rationale: संदर्भ में शब्द बहुअर्थी है; किसी एक व्याख्यात्मक अर्थ को मुख्य पाठ में थोपना उचित नहीं।
- issue: मृत्यु का कारण-संबंध
  choice: ‘मेरी प्रजा के अधर्म के कामों के कारण’
  alternative: ‘मेरी प्रजा के अधर्म के कामों से’
  rationale: διά के स्थान पर यहाँ ἀπό है, फिर भी वाक्य में स्रोत अथवा कारण का संबंध है; ‘के कारण’ हिन्दी में स्पष्ट है, जबकि किस प्रकार का प्रतिनिधिक या दंडात्मक संबंध है, इसे पाठ से अधिक निर्धारित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पंक्ति-विन्यास मूल उद्धरण की लय और समानांतरता को दर्शाता है।
