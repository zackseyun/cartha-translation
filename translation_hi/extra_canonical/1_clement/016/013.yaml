base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/013.yaml
  text: 'Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless;'
translation:
  language: hi
  text: 'इसी कारण वह बहुतों को विरासत में पाएगा,


    और बलवानों से ली हुई लूट बाँटेगा,


    क्योंकि उसका प्राण मृत्यु के हवाले कर दिया गया,


    और वह अधर्मियों में गिना गया;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομήσει πολλοὺς
  choice: बहुतों को विरासत में पाएगा
  rationale: क्रिया κληρονομέω के उत्तराधिकार/विरासत संबंधी बिंब को बनाए रखते हुए πολλούς को व्यक्तियों के रूप में स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: τῶν ἰσχυρῶν
  choice: बलवानों की
  rationale: ἰσχυρός का सीधा अर्थ शक्तिशाली या बलवान है; काव्यात्मक और गरिमापूर्ण शैली में ‘बलवानों’ उपयुक्त है।
- source_word: μεριεῖ σκῦλα
  choice: लूट का माल बाँटेगा
  rationale: σκῦλα युद्ध में प्राप्त लूट को दर्शाता है और μεριεῖ उसके बाँटे जाने को; ‘लूट का माल’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: उसका प्राण
  rationale: ψυχή यहाँ मृत्यु को सौंपे गए जीवन/प्राण का संकेत देती है; ‘प्राण’ मूल बिंब और गम्भीरता को बनाए रखता है।
- source_word: τοῖς ἀνόμοις
  choice: अधर्मियों में
  rationale: ἄνομος का अर्थ व्यवस्था/नियम का उल्लंघन करने वाला है; ‘अधर्मी’ धार्मिक-साहित्यिक प्रसंग में स्वाभाविक है और केवल सामान्य अपराधियों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: παρεδόθη की वाच्यता और कर्ता
  choice: मृत्यु के हवाले कर दिया गया
  alternative: उसने अपना प्राण मृत्यु के हवाले कर दिया
  rationale: स्रोत पाठ में παρεδόθη निष्क्रिय रूप है और कर्ता व्यक्त नहीं किया गया। निष्क्रिय अनुवाद इस अस्पष्टता को बनाए रखता है तथा स्वेच्छिक आत्मसमर्पण या किसी बाहरी कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- issue: κληρονομήσει πολλούς का अर्थ
  choice: बहुतों को विरासत में पाएगा
  alternative: बहुतों में भाग पाएगा
  rationale: मूल यूनानी में ‘बहुतों’ सीधा कर्म है। कुछ समानांतर पाठ-परंपराओं के प्रभाव से इसे ‘बहुतों में भाग’ बनाना यहाँ उपलब्ध स्रोत को बदल देता; इसलिए असामान्य किंतु वास्तविक वाक्यरचना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और स्रोत-सन्निकट शैली अपनाई गई है। चार समानांतर पंक्तियाँ तथा अंतिम अर्धविराम मूल के औपचारिक प्रवाह को बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
