source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἁμαρτίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἀνομίας ἡμῶν. παιδεία εἰρήνης ἡμῶν ἐπ’ αὐτόν· τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/005.yaml
  text: 'But he was wounded because of our sins

    and was afflicted because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.'
translation:
  language: hi
  text: 'परन्तु वह हमारे पापों के कारण घायल किया गया,

    और हमारे अधर्मों के कारण पीड़ित किया गया।

    हमारी शान्ति के लिए ताड़ना उस पर थी;

    उसकी चोट से हम चंगे हुए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: घायल किया गया
  rationale: यूनानी निष्क्रिय क्रिया का सीधा अर्थ सुरक्षित रखता है और पीड़ा पहुँचाए जाने को स्पष्ट करता है।
- source_word: μεμαλάκισται
  choice: पीड़ित हुआ
  rationale: शाब्दिक अर्थ ‘निर्बल किया गया है’ हो सकता है, पर इस दुःख-वर्णन में ‘पीड़ित हुआ’ स्वाभाविक हिन्दी में संदर्भगत भाव व्यक्त करता है; क्रिया का परिणामकारी पक्ष भी बना रहता है।
- source_word: ἀνομίας
  choice: अधर्म के कामों
  rationale: ἀνομία के नियम-विरोधी और नैतिक अपराध के भाव को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: παιδεία
  choice: दण्ड
  rationale: यहाँ सुधारात्मक अनुशासन की अपेक्षा किसी दूसरे पर पड़ी दण्डात्मक पीड़ा प्रमुख है।
- source_word: εἰρήνης
  choice: शान्ति
  rationale: मूल संज्ञा को खुला रखा गया है; इसमें कुशल-क्षेम अथवा मेल का व्यापक भाव हो सकता है।
- source_word: μώλωπι
  choice: घाव
  rationale: मार से बने निशान या चोट के अर्थ को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἰάθημεν
  choice: चंगे हुए
  rationale: निष्क्रिय क्रिया के आरोग्य-प्राप्ति वाले रूपक को परिचित बाइबलीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘हमारी शान्ति का दण्ड’ पदबंध का सम्बन्ध
  choice: हमारी शान्ति के लिए दण्ड उस पर पड़ा
  alternative: हमारी शान्ति का दण्ड उस पर था
  rationale: यूनानी का संक्षिप्त पदबंध अर्थगत तनाव रखता है। हिन्दी में ‘के लिए’ से प्रयोजन का सम्भावित सम्बन्ध पठनीय बनता है, बिना प्रायश्चित्त की कोई विशिष्ट सिद्धान्तगत व्याख्या जोड़े।
- issue: प्रतिनिधिक दुःख और आरोग्य
  choice: मूल के ‘हमारे…उस पर…हम’ सम्बन्ध को यथावत रखा
  alternative: इसे केवल नैतिक उदाहरण या किसी विशिष्ट प्रायश्चित्त-सिद्धान्त के रूप में स्पष्ट करना
  rationale: पाठ दुःख, दण्ड, शान्ति और चंगाई को जोड़ता है, पर उनके तात्त्विक तंत्र को विस्तार से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानान्तर पंक्तियाँ और गरिमापूर्ण बाइबलीय लहजा सुरक्षित रखा गया है। ‘परन्तु’, ‘शान्ति’ और ‘चंगे’ सामान्य धार्मिक पाठकों के लिए परिचित हैं, फिर भी वाक्यरचना सरल रखी गई है।
