translation:
  language: hi
  text: 'और उसने स्वयं बहुतों के पापों को वहन किया,


    और वह उनके पापों के कारण सौंप दिया गया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτός
  choice: और उसने स्वयं
  rationale: αὐτός के बलाघात को ‘स्वयं’ से व्यक्त किया गया है; ‘और’ पूर्ववर्ती उद्धरण से संबंध बनाए रखता है।
- source_word: ἁμαρτίας πολλῶν
  choice: बहुतों के पापों को
  rationale: यूनानी संबंधवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप; ‘बहुतों’ अनिश्चित बहुवचन को बनाए रखता है।
- source_word: ἀνήνεγκε
  choice: उठा लिया
  rationale: क्रिया में उठाने/वहन करने का भाव है; प्रसंग में पापों को अपने ऊपर लेने का अर्थ व्यक्त होता है, पर हिन्दी में अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: διὰ τὰς ἁμαρτίας αὐτῶν
  choice: उनके पापों के कारण
  rationale: यहाँ διά + कर्मकारक का कारणसूचक अर्थ स्वाभाविक है और स्रोत की संक्षिप्तता सुरक्षित रहती है।
- source_word: παρεδόθη
  choice: उसे सौंप दिया गया
  rationale: निष्क्रिय क्रिया का सीधा रूप; किसने और किसके हाथ सौंपा, यह स्रोत में अनिर्दिष्ट है, इसलिए हिन्दी में भी अनिर्दिष्ट रखा गया।
theological_decisions:
- issue: ἀνήνεγκε में पाप-वहन और बलिदानी संकेत
  choice: ‘पापों को उठा लिया’
  alternative: ‘पापों को अपने ऊपर ले लिया’ / ‘पापों का भार उठाया’
  rationale: चुना गया रूप मूल के वहन-संबंधी अर्थ को रखता है, पर बलिदान-विधि या प्रायश्चित्त की किसी विशिष्ट व्याख्या को स्पष्ट रूप से आरोपित नहीं करता।
- issue: παρεδόθη के कर्ता और गंतव्य की अनिर्दिष्टता
  choice: ‘उसे सौंप दिया गया’
  alternative: ‘परमेश्वर ने उसे सौंप दिया’ / ‘उसे मृत्यु के हाथ सौंपा गया’
  rationale: यूनानी पाठ न सौंपने वाले का नाम बताता है, न यह कि किसके हाथ सौंपा गया; अतः इस धर्मवैचारिक तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक पंक्ति-विन्यास रखा गया है। भाषा सामान्य पाठकों के लिए सहज है और मूल की समानांतर संरचना को बनाए रखती है।
