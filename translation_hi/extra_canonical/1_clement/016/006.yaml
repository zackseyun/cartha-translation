  yaml_path: translation/extra_canonical/1_clement/016/006.yaml
  text: 'We all went astray like sheep;

    each man went astray in his own way[a].'
translation:
  language: hi
  text: 'हम सब भेड़ों के समान भटक गए;

    हर व्यक्ति अपनी राह पर भटक गया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य अपनी राह पर भटक गया।”
    reason: यूनानी पाठ में ἄνθρωπος एकवचन में है; मुख्य पाठ उसका सामान्य या वितरणात्मक अर्थ देता है।
lexical_decisions:
- source_word: πάντες
  choice: हम सब
  rationale: क्रिया ἐπλανήθημεν प्रथम पुरुष बहुवचन है; इसलिए πάντες को स्वाभाविक हिन्दी में “हम सब” कहा गया है।
- source_word: ὡς πρόβατα
  choice: भेड़ों के समान
  rationale: तुलनात्मक ὡς और बहुवचन πρόβατα का सीधा तथा गरिमापूर्ण रूप।
- source_word: ἐπλανήθημεν / ἐπλανήθη
  choice: भटक गए / भटक गया
  rationale: दोनों रूपों में एक ही यूनानी क्रिया की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: ἄνθρωπος
  choice: हर व्यक्ति
  rationale: यूनानी में एकवचन संज्ञा यहाँ सामान्य अथवा वितरणात्मक अर्थ देती है; “हर व्यक्ति” पहले खंड के “हम सब” से संबंध स्पष्ट करता है।
- source_word: τῇ ὁδῷ αὐτοῦ
  choice: अपनी ही राह पर
  rationale: स्वत्ववाचक αὐτοῦ को “अपनी” और प्रत्येक की अलग दिशा पर बल को “ही” से स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ἄνθρωπος के सामान्य एकवचन का अर्थ
  choice: हर व्यक्ति
  alternative: मनुष्य
  rationale: “हर व्यक्ति” पाठ में निहित व्यक्तिगत या वितरणात्मक भाव को स्पष्ट करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता को बनाए रखने वाला रूप। “भेड़ों के समान” बोलचाल के “भेड़ों की तरह” की अपेक्षा संदर्भ के लिए अधिक औपचारिक है।
