translation:
  language: hi
  text: यदि तुम पाप के लिए अर्पण चढ़ाओ[a], तो तुम्हारा प्राण दीर्घायु संतान को देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का अधिक शाब्दिक अनुवाद है, ‘यदि तुम पाप के विषय में दो’; बलिदान-संबंधी प्रयोग में यह ‘पाप के लिए अर्पण चढ़ाने’ का अर्थ दे सकता है।
    reason: περὶ ἁμαρτίας में शाब्दिक और प्रचलित बलिदानी अर्थ के बीच की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: δῶτε περὶ ἁμαρτίας
  choice: पाप के लिए अर्पण चढ़ाओ
  rationale: περὶ ἁμαρτίας यूनानी पुराने नियम की बलिदान-संबंधी भाषा में पाप के लिए अर्पण या पापबलि का संकेत दे सकता है। ‘अर्पण चढ़ाओ’ हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी यूनानी की अधिक शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: ἡ ψυχὴ ὑμῶν
  choice: तुम्हारा प्राण
  rationale: वचन में बहुवचन ‘तुम्हारा’ के साथ एकवचन ‘प्राण’ है। सामूहिक और काव्यात्मक रूप को सामान्यीकृत करके केवल ‘तुम’ नहीं किया गया।
- source_word: σπέρμα μακρόβιον
  choice: दीर्घायु संतान
  rationale: σπέρμα यहाँ सामूहिक अर्थ में संतान या वंश को दर्शाता है; ‘संतान’ मूल के एकवचन सामूहिक रूप और भावी पीढ़ी, दोनों को व्यक्त करता है। μακρόβιον का सीधा अर्थ ‘दीर्घायु’ है।
theological_decisions:
- issue: περὶ ἁμαρτίας का बलिदान-संबंधी अर्थ
  choice: मुख्य पाठ में ‘पाप के लिए अर्पण’
  alternative: ‘पाप के विषय में दो’ अथवा ‘पापबलि चढ़ाओ’
  rationale: केवल शाब्दिक अनुवाद आधुनिक हिन्दी में पाप को बढ़ावा देने के लिए कुछ देने जैसा भ्रम पैदा कर सकता है। दूसरी ओर, ‘पापबलि’ अर्थ को पूरी तरह निश्चित कर देता है। मुख्य पाठ और पादटिप्पणी मिलकर प्रचलित बलिदानी अर्थ तथा व्याकरणगत अस्पष्टता दोनों रखते हैं।
- issue: ψυχή को व्यक्ति के रूप में सरल करना
  choice: ‘प्राण’ को स्पष्ट रूप से बनाए रखा
  alternative: ‘तुम दीर्घायु संतान को देखोगे’
  rationale: मूल का ‘तुम्हारा प्राण देखेगा’ काव्यात्मक और धर्मवैचारिक तनाव रखता है; उसे मौन रूप से सामान्य वाक्य में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘तुम्हारा प्राण … देखेगा’ सामान्य गद्य से कुछ अधिक शाब्दिक है, पर मूल यूनानी की सामूहिक और काव्यात्मक संरचना को जानबूझकर बनाए रखता है।
