id: 1CLEM.16.12
reference: 1 Clement 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος βούλεται ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς· καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/012.yaml
  text: 'And the Lord wills to remove the anguish of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins[a].'
translation:
  language: hi
  text: 'और प्रभु उसके प्राण का संताप दूर करना,[a]

    उसे ज्योति दिखाना और समझ के द्वारा उसे गढ़ना चाहता है;

    वह बहुतों की भली-भाँति सेवा करनेवाले धर्मी जन को धर्मी ठहराना चाहता है;

    और वह स्वयं उनके पापों को उठाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उसके प्राण के संताप से निकालना।”
    reason: यूनानी में ἀφελεῖν का कर्म व्यक्त नहीं है; वाक्य का अर्थ संताप को दूर करना या उसे संताप से निकालना—दोनों हो सकता है।
lexical_decisions:
- source_word: πόνος
  choice: संताप
  rationale: यहाँ शब्द शारीरिक परिश्रम से अधिक प्राण की पीड़ा या क्लेश को व्यक्त करता है; ‘संताप’ काव्यात्मक संदर्भ में स्वाभाविक और व्यापक है।
- source_word: ψυχή
  choice: प्राण
  rationale: ‘प्राण’ व्यक्ति के अंतर्मन और जीवन—दोनों की छाया बनाए रखता है और इस काव्यात्मक कथन में ‘आत्मा’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: φῶς
  choice: ज्योति
  rationale: काव्यात्मक और गरिमापूर्ण शैली में ‘प्रकाश’ के समानार्थी रूप में चुना गया।
- source_word: πλάσαι
  choice: गढ़ना
  rationale: मूल क्रिया का अर्थ आकार देना या निर्मित करना है; असामान्य अभिव्यक्ति को सरल व्याख्या में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: δικαιῶσαι δίκαιον
  choice: धर्मी जन को धर्मी ठहराना
  rationale: मूल के धातु-संबंधी दोहराव और न्यायिक/घोषणात्मक अर्थ को बनाए रखता है; ‘निर्दोष ठहराना’ मूल के δίκαιος संबंध को धुंधला कर देता।
- source_word: δουλεύοντα πολλοῖς
  choice: बहुतों की … सेवा करनेवाले
  rationale: δουλεύω के सेवकत्व-संबंधी अर्थ को स्वाभाविक हिन्दी में ‘सेवा करना’ से व्यक्त किया गया है।
- source_word: ἀνοίσει
  choice: उठाएगा
  rationale: पापों का भार स्वयं वहन करने की ठोस रूपक-छवि को बनाए रखता है।
theological_decisions:
- issue: δικαιῶσαι δίκαιον में धर्मी व्यक्ति को ‘धर्मी ठहराने’ का तनाव
  choice: धर्मी जन को धर्मी ठहराना
  alternative: धर्मी जन को निर्दोष ठहराना
  rationale: मूल पाठ जानबूझकर या परंपरागत रूप से ‘धर्मी’ और ‘धर्मी ठहराना’ को साथ रखता है; अनुवाद ने इस धर्मवैचारिक तनाव को हल नहीं किया।
- issue: ἀφελεῖν ἀπὸ τοῦ πόνου में लुप्त कर्म
  choice: उसके प्राण का संताप दूर करना
  alternative: उसे उसके प्राण के संताप से निकालना
  rationale: मुख्य पाठ उस अर्थ का अनुसरण करता है जिसमें संताप हटाया जाता है, पर यूनानी वाक्यरचना व्यक्ति को संताप से निकालने की संभावना भी देती है; इसे पादटिप्पणी में रखा गया है।
- issue: αὐτὸς की बलाघाती भूमिका
  choice: वह स्वयं
  alternative: वह
  rationale: इससे यह बल सुरक्षित रहता है कि वही उनके पाप उठाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। समानांतर पंक्तियों और मूल की असामान्य ‘समझ के द्वारा उसे गढ़ना’ अभिव्यक्ति को जानबूझकर सुरक्षित रखा गया है।
