source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα. ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείραντος ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/007.yaml
  text: 'And the Lord gave him over for our sins,

    and he[a], because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and as a lamb before its shearer is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.'
translation:
  language: hi
  text: 'और प्रभु ने उसे हमारे पापों के कारण सौंप दिया,


    और वह, कष्ट दिए जाने के कारण,


    अपना मुँह नहीं खोलता।


    वह भेड़ के समान वध के लिए ले जाया गया,


    और जैसे मेमना अपने ऊन कतरनेवाले के सामने चुप रहता है,


    वैसे ही वह अपना मुँह नहीं खोलता।


    उसके अपमान में उसका न्याय[a] उठा लिया गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके अपमान में उसे न्याय से वंचित किया गया।”
    reason: ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη का शाब्दिक रूप अस्पष्ट है; κρίσις का अर्थ न्याय, न्यायिक निर्णय, या न्यायिक कार्यवाही हो सकता है, और ἤρθη का अर्थ “हटा/उठा लिया गया” है।
lexical_decisions:
- source_word: παρέδωκεν
  choice: सौंप दिया
  rationale: क्रिया का मूल अर्थ किसी को दूसरे के अधिकार में दे देना है; यह जानबूझकर किए गए समर्पण और दुःख के लिए सौंपे जाने—दोनों भावों को बनाए रखता है।
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: हमारे पापों के कारण
  rationale: ὑπέρ यहाँ पापों के संबंध में उसके सौंपे जाने को व्यक्त करता है। ‘के कारण’ सहज हिन्दी है, जबकि प्रायश्चित की किसी विशिष्ट व्याख्या को पाठ में अतिरिक्त रूप से नहीं जोड़ता।
- source_word: διὰ τὸ κεκακῶσθαι
  choice: दुःख सहने पर भी
  rationale: पूर्ण कर्मवाच्य infinitive उसके दुःख या दुर्व्यवहार सह चुके होने को बताता है। प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘पर भी’ रखा गया है।
- source_word: ἄφωνος
  choice: चुप रहता है
  rationale: शाब्दिक अर्थ ‘स्वरहीन’ है; यहाँ न बोलने का भाव है, इसलिए सामान्य और गरिमापूर्ण हिन्दी चुनी गई है।
- source_word: ταπεινώσει
  choice: दीन किए जाने
  rationale: यहाँ अपमानित अथवा नीचा किए जाने की अवस्था अभिप्रेत है। कर्मवाच्य रूप मसीह पर किए गए व्यवहार को स्पष्ट करता है।
- source_word: κρίσις
  choice: न्याय
  rationale: शब्द निर्णय, न्यायिक कार्यवाही या न्याय का अर्थ दे सकता है। ‘न्याय’ मूल की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
theological_decisions:
- issue: ὑπέρ में प्रतिनिधिक या प्रायश्चित-संबंधी अर्थ
  choice: हमारे पापों के कारण
  alternative: हमारे पापों के लिए
  rationale: चुना हुआ रूप पापों और सौंपे जाने का कारणगत संबंध व्यक्त करता है, पर प्रायश्चित के ढंग को पाठ से अधिक निश्चित नहीं करता।
- issue: ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη का अर्थ
  choice: उसके दीन किए जाने में उसका न्याय उठा लिया गया
  alternative: उसकी दीनता में उसे न्याय से वंचित किया गया
  rationale: मूल वाक्य की संक्षिप्तता और यह तनाव सुरक्षित रखा गया है कि κρίσις न्याय, निर्णय या न्यायिक प्रक्रिया हो सकती है और ἤρθη का अर्थ ‘हटा/उठा लिया गया’ है। पादटिप्पणी स्वाभाविक वैकल्पिक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय काव्यात्मक गद्य। ‘मुँह नहीं खोलता’ जैसी बाइबिलीय अभिव्यक्ति को उसकी सहज पहचान और मूल से निकटता के कारण रखा गया है। पद्यात्मक समानांतरता और वर्तमान/भूतकाल के यूनानी मिश्रण को यथासंभव सुरक्षित रखा गया है।
