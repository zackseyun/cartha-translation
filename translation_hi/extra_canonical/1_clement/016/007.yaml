  source_fidelity: Draft is broadly faithful to the Greek and preserves the deliberate compactness of the final clause. However, “दुःख सहने पर भी” adds a concessive contrast (“even though”) not expressed by διὰ τὸ, which is causal (“because/on account of”).
  naturalness: The register is clear and dignified. “उसके दीन किए जाने में” is understandable but less idiomatic than “उसके अपमान में,” which also directly reflects ταπείνωσις in this citational context.
  terminology: “सौंप दिया,” “वध,” “मेमना,” and “न्याय” are appropriate. “हमारे पापों के कारण” remains a suitably non-sectarian rendering of ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν. The ambiguity of κρίσις and ἤρθη is retained with a properly anchored note.
  issues:
  - severity: medium
    issue: “पर भी” in “दुःख सहने पर भी”
    rationale: The Greek διὰ τὸ κεκακῶσθαι marks the stated ground or occasion, not a concessive relation. The added contrast subtly changes the logic of the sentence.
  - severity: low
    issue: “दीन किए जाने में”
    rationale: While defensible, this is somewhat stiff in modern Hindi. “उसके अपमान में” is more natural and preserves the lexical range of ταπείνωσις without making the passive causation more explicit than the Greek.
