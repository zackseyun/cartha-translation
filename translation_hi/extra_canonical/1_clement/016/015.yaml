  text: καὶ πάλιν αὐτὸς φησίν· Ἐγὼ δὲ εἰμι σκώληξ καὶ οὐκ ἄνθρωπος, ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/015.yaml
  text: 'And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people[a].'
translation:
  language: hi
  text: 'और फिर वह स्वयं कहता है,


    “पर मैं कीड़ा हूँ, मनुष्य नहीं,


    मनुष्यों की निन्दा का पात्र


    और लोगों के तिरस्कार का पात्र।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκώληξ
  choice: कीड़ा
  rationale: यह यूनानी संज्ञा सामान्यतः ‘कीड़ा’ या ‘कृमि’ को दर्शाती है; ‘कीड़ा’ आधुनिक पाठकों के लिए स्वाभाविक और स्पष्ट है तथा आत्म-दीनता की तीव्र छवि बनाए रखता है।
- source_word: ὄνειδος ἀνθρώπων
  choice: मनुष्यों के लिए निन्दा का पात्र
  rationale: ὄνειδος को केवल ‘निन्दा’ कहने के बजाय ‘निन्दा का पात्र’ कहना वक्ता को निन्दा का लक्ष्य बताता है और समानांतर संज्ञात्मक संरचना को सुरक्षित रखता है।
- source_word: ἐξουθένημα λαοῦ
  choice: लोगों के लिए तिरस्कार का पात्र
  rationale: ἐξουθένημα किसी तुच्छ समझे या तिरस्कृत व्यक्ति/वस्तु को दर्शाता है। यह चयन पिछले पदांश के साथ काव्यात्मक समानांतरता बनाए रखता है और इसे क्रियात्मक ‘लोगों ने तुच्छ जाना’ में नहीं बदलता।
- source_word: λαοῦ
  choice: लोगों
  rationale: यहाँ ‘लोग’ व्यापक और स्वाभाविक अर्थ देता है; बिना पर्याप्त संदर्भ के इसे विशेष रूप से ‘इस्राएल’ या किसी निश्चित समुदाय के रूप में नहीं बाँधा गया।
theological_decisions:
- issue: उद्धृत वक्ता की पहचान
  choice: पुल्लिंग एकवचन ‘वह स्वयं’ बनाए रखा गया
  alternative: नाम या मसीही उपाधि जोड़ना
  rationale: यूनानी αὐτός केवल ‘वह स्वयं’ कहता है। इस वाक्य में वक्ता का नाम स्पष्ट नहीं किया गया, इसलिए अनुवाद में अतिरिक्त पहचान नहीं जोड़ी गई।
- issue: अपमानसूचक समानांतर पदों का स्वरूप
  choice: दोनों को ‘...का पात्र’ वाली समानांतर संज्ञात्मक अभिव्यक्तियों में रखा गया
  alternative: दूसरे पद को ‘लोगों द्वारा तुच्छ समझा गया’ कहना
  rationale: ὄνειδος और ἐξουθένημα दोनों समानांतर संज्ञाएँ हैं। संज्ञात्मक रूप उस काव्यात्मक और धर्मवैचारिक तनाव को बनाए रखता है जिसमें वक्ता स्वयं को अपमान और तिरस्कार का लक्ष्य बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक शैली अपनाई गई है। पंक्ति-विन्यास ने मूल के समानांतर पदों को उभारा है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि यूनानी अर्थ को मुख्य पाठ में स्वाभाविक रूप से व्यक्त किया जा सकता है।
