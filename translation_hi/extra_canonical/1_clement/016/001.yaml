  text: For the Messiah belongs to the humble-minded, not to those who exalt themselves over his flock.
translation:
  language: hi
  text: क्योंकि मसीह उनका है जो मन से विनम्र हैं, न कि उनका जो उसके झुंड पर अपने को ऊँचा उठाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्रस्तुत यूनानी पाठ में यहाँ OCR-दोष के कारण ऐसा शब्द-समूह है जिसका शाब्दिक अर्थ लगभग ‘जो उसके भय पर अपने को फेंकते हैं’ होगा। प्रमाणित पाठ है: ‘जो उसके झुंड पर अपने को ऊँचा उठाते हैं।’'
    reason: दिए गए स्रोत-पाठ में गंभीर OCR-विकृति है; अनुवाद प्रमाणित यूनानी पाठ ‘οὐκ ἐπαιρομένων ἐπὶ τὸ ποίμνιον αὐτοῦ’ पर आधारित है।
lexical_decisions:
- source_word: Ταπεινοφρονούντων
  choice: नम्र मनवालों
  rationale: यह शब्द मन की नम्रता रखनेवालों को सूचित करता है; यह सहज आधुनिक हिन्दी में मूल के गुण और संबंधकारक भाव—‘का है’—दोनों को बनाए रखता है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: Χριστός का प्रचलित और अर्थपूर्ण हिन्दी रूप ‘मसीह’ है।
- source_word: ἐπαιρομένων
  choice: अपने आपको ऊँचा उठाते हैं
  rationale: यह आत्मोन्नति और घमंड का सक्रिय भाव व्यक्त करता है, बिना आशय को किसी खास पद या संप्रदायगत भूमिका तक सीमित किए।
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: उसके झुंड
  rationale: ποίμνιον का प्रत्यक्ष रूपक ‘झुंड’ रखा गया है; ‘उसके’ का संदर्भ मसीह से है।
theological_decisions:
- issue: मसीह का नम्र लोगों से संबंध
  choice: ‘मसीह नम्र मनवालों का है’
  alternative: ‘मसीह नम्र स्वभाव का है’
  rationale: सुधारे हुए यूनानी पाठ में संबंधकारक बहुवचन Ταπεινοφρονούντων है, इसलिए वाक्य मसीह के स्वभाव मात्र की नहीं, बल्कि उन लोगों से उसके संबंध की बात करता है।
- issue: झुंड के ऊपर आत्मोन्नति
  choice: ‘उसके झुंड पर अपने आपको ऊँचा उठाते हैं’
  alternative: ‘उसके झुंड पर अधिकार जताते हैं’
  rationale: ‘अधिकार जताना’ संभावित व्यावहारिक आशय है, पर मूल ἐπαιρομένων के ऊँचा उठने/घमंड करने के रूपक को सीधे रखना बेहतर है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘झुंड’ द्वारा मूल का चरवाही रूपक सुरक्षित है।
