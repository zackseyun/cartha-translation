source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ, ὁ κύριος Ἰησοῦς Χριστός, οὐχ ἦλθεν ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας, καίπερ δυνάμενος, ἀλλὰ ταπεινοφρονῶν, καθὼς τὸ πνεῦμα τὸ ἅγιον περὶ αὐτοῦ ἐλάλησεν· φησὶν γάρ· . Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη; ἀνηγγείλαμεν ἐναντίον αὐτοῦ, ὡς παιδίον, ὡς ῥίζα ἐν γῇ διψώσῃ· οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα, καὶ εἴδομεν αὐτόν, καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος, ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων· ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ, ἠτιμάσθη καὶ οὐκ ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/002.yaml
  text: 'The scepter of the majesty of God[a], the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though being able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    lacking beyond the appearance of men;

    a man being in affliction and toil

    and knowing how to bear weakness,

    because his face is turned away[c][b];

    he was dishonored and not esteemed.”'
translation:
  language: hi
  text: 'परमेश्वर के प्रताप का राजदंड, प्रभु यीशु मसीह, अहंकार के आडंबर या घमंड के साथ नहीं आया—यद्यपि वह समर्थ था—बल्कि दीनता के साथ आया, ठीक वैसे ही जैसे पवित्र आत्मा ने उसके विषय में कहा था। क्योंकि वह कहता है:


    “हे प्रभु, हमारे संदेश पर किसने विश्वास किया?


    और प्रभु की भुजा किस पर प्रकट की गई?


    हमने उसके सामने घोषणा की,


    मानो एक बालक,


    मानो प्यासी भूमि में एक जड़।


    उसका न तो कोई रूप है, न महिमा;


    हमने उसे देखा,


    और उसमें न रूप था, न सुंदरता।


    बल्कि उसका स्वरूप अनादृत था,


    मनुष्यों के रूप की अपेक्षा भी हीन[a];


    वह मनुष्य पीड़ा और कष्ट में था,


    और दुर्बलता सहना जानता था[b],


    क्योंकि उसका मुख फेर दिया गया था[c];


    वह अनादृत हुआ और उसका कोई मान न हुआ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पद का अर्थ यह भी हो सकता है: “मनुष्यों के रूप से रहित” या “मनुष्यों के रूप की अपेक्षा और भी कमतर।”'
    reason: ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων असामान्य और अर्थ की दृष्टि से कठिन वाक्यांश है; मुख्य पाठ एक संभावित तुलनात्मक अर्थ देता है।
  - marker: b
    text: “दुर्बलता” का अनुवाद “रोग” भी किया जा सकता है।
    reason: μαλακία शारीरिक कमजोरी या बीमारी दोनों का बोध करा सकता है।
  - marker: c
    text: इसका अनुवाद “क्योंकि उसका चेहरा फेर दिया गया था” अथवा “क्योंकि लोग उससे मुँह फेर लेते थे” भी संभव है।
    reason: ἀπέστραπται τὸ πρόσωπον αὐτοῦ का कर्ता/भाव और संबंध संदिग्ध है; यूनानी शब्दशः उसके मुख के फिर जाने या फेर दिए जाने की ओर संकेत करता है, जबकि यशायाह की परंपरा लोगों के उससे मुँह फेरने की समझ को जन्म देती है।
lexical_decisions:
- source_word: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ
  choice: परमेश्वर के प्रताप का राजदंड
  rationale: स्कῆπτρον के राजकीय प्रतीक और μεγαλωσύνη के महिमामय प्रताप—दोनों को बनाए रखता है।
- source_word: κόμπῳ ἀλαζονείας
  choice: अहंकार के आडंबर
  rationale: κόμπος के दिखावे/धूमधाम और ἀλαζονεία के दंभी अहंकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ταπεινοφρονῶν
  choice: दीनता के साथ
  rationale: यहाँ मनोभाव और व्यवहार दोनों में नम्रता का अर्थ है; आधुनिक हिन्दी में सहज अभिव्यक्ति चुनी गई है।
- source_word: ἀνηγγείλαμεν ἐναντίον αὐτοῦ
  choice: हमने उसके सामने घोषणा की
  rationale: क्रिया के साथ कोई स्पष्ट कर्म नहीं जोड़ता और ἐναντίον αὐτοῦ को ‘उसके सामने’ के रूप में सुरक्षित रखता है।
- source_word: ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων
  choice: मनुष्यों के स्वरूप से भी अधिक क्षीण
  rationale: ἐκλεῖπον के कमी, क्षीणता या पीछे रह जाने के भाव और παρὰ की तुलनात्मक कठिनता को यथासंभव बनाए रखता है।
- source_word: ἐν πληγῇ ὢν καὶ πόνῳ
  choice: दुःख और परिश्रम में था
  rationale: इस यशायाह-संदर्भ में πληγή को आधुनिक हिन्दी में संक्रामक ‘महामारी’ न बनाकर चोट/कष्ट के व्यापक अर्थ में प्रस्तुत करता है।
- source_word: μαλακίαν
  choice: दुर्बलता
  rationale: शारीरिक निर्बलता, रोग या कमजोरी की अर्थ-सीमा को बिना अनावश्यक रूप से संकुचित किए रखता है।
theological_decisions:
- issue: यीशु के लिए Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त
  rationale: आधुनिक हिन्दी पाठकों के लिए प्रचलित और बोधगम्य पद है तथा अभिषिक्त उद्धारकर्ता की उपाधि के रूप में काम करता है।
- issue: पवित्र आत्मा के उद्धरण का परिचय
  choice: पवित्र आत्मा ने ... कहा था; क्योंकि वह कहता है
  alternative: पवित्रशास्त्र कहता है
  rationale: मूल पाठ स्वयं वचन को पवित्र आत्मा का कथन बताता है; उस दावे को बिना विस्तार या संप्रदायगत व्याख्या के सुरक्षित रखा गया है।
- issue: καίπερ δυνάμενος का निहित आशय
  choice: यद्यपि वह ऐसा कर सकता था
  alternative: यद्यपि वह सामर्थी था
  rationale: मूल में कर्म स्पष्ट नहीं है। ‘ऐसा’ निकटवर्ती आडंबरपूर्ण आगमन की ओर संकेत करता है, पर उसकी सामर्थ्य की प्रकृति पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। गद्य-परिचय में स्वाभाविक वाक्य-विन्यास है, जबकि यशायाह-उद्धरण को पंक्तिबद्ध काव्यात्मक रूप दिया गया है। कठिन सेप्टुआजिन्ती वाक्यांशों को समतल करने के बजाय मुख्य पाठ और पादटिप्पणियों में उनकी वास्तविक अस्पष्टता बनाए रखी गई है।
