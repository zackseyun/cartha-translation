source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οἱ θεωροῦντές με ἐξεμυκτήρισάν με, ἐλάλησαν ἐν χείλεσιν, ἐκίνησαν κεφαλήν· Ἤλπισεν ἐπὶ κύριον, ῥυσάσθω αὐτόν, σωσάτω αὐτόν, ὅτι θέλει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/016.yaml
  text: 'All who saw me mocked me;

    they spoke with their lips,

    they shook their heads:

    ‘He hoped in the Lord; let him rescue him;

    let him save him[a], because he delights in him.’'
translation:
  language: hi
  text: 'जिन सब ने मुझे देखा, उन्होंने मेरा उपहास किया;

    उन्होंने होंठों से बोले

    और सिर हिलाया:


    “उसने प्रभु पर भरोसा किया; प्रभु उसे छुड़ा ले,

    उसे बचा ले, क्योंकि वह उसे चाहता है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह उससे प्रसन्न है।”
    reason: यूनानी θέλει का सीधा अर्थ ‘चाहता है’ है; भजन-संदर्भ और अंग्रेज़ी POB के ‘delights in him’ के अनुरूप ‘उससे प्रसन्न है’ एक प्रसंगगत वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: θεωροῦντές
  choice: जितनों ने मुझे देखा
  rationale: वर्तमान कृदंत का मुख्य क्रिया के भूतकाल के साथ स्वाभाविक हिन्दी समन्वय किया गया है; अर्थ है वे सभी जिन्होंने वक्ता को देखा।
- source_word: ἐξεμυκτήρισάν
  choice: मेरा उपहास किया
  rationale: क्रिया तीखे उपहास या ठट्ठे का बोध कराती है; ‘उपहास किया’ आधुनिक, dignified और स्पष्ट है।
- source_word: ἐλάλησαν ἐν χείλεσιν
  choice: होंठों से बातें बनाईं
  rationale: शाब्दिक ‘होंठों से बोले’ हिन्दी में आशय स्पष्ट नहीं करता। प्रसंग में तिरस्कारपूर्वक मुँह चलाने या व्यंग्य करने का भाव है, जिसे यह मुहावरेदार अभिव्यक्ति व्यक्त करती है।
- source_word: ἐκίνησαν κεφαλήν
  choice: सिर हिलाया
  rationale: यूनानी में बहुवचन कर्ता के साथ वितरणात्मक एकवचन है; हिन्दी में भी ‘सिर हिलाया’ स्वाभाविक रूप से प्रत्येक व्यक्ति की क्रिया बताता है।
- source_word: Ἤλπισεν
  choice: भरोसा रखा है
  rationale: यूनानी aorist को उद्धृत व्यंग्य में ऐसी हिन्दी पूर्ण क्रिया से दिया गया है जो पूर्व भरोसे और वर्तमान दावे दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ῥυσάσθω
  choice: छुड़ा ले
  rationale: संकट या शत्रु के हाथ से मुक्त करने का अर्थ सुरक्षित रहता है।
- source_word: σωσάτω
  choice: बचा ले
  rationale: ῥυσάσθω के समानांतर रहते हुए उद्धार/रक्षा का सामान्य और स्पष्ट अर्थ देता है।
- source_word: θέλει
  choice: प्रसन्न है
  rationale: यहाँ क्रिया ‘चाहना/इच्छा करना’ से आगे अनुग्रह या प्रसन्नता का भाव रख सकती है; भजन-संदर्भ में यह स्वाभाविक हिन्दी है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ὅτι θέλει αὐτόν में कर्ता और अर्थ
  choice: क्योंकि वह उससे प्रसन्न है
  alternative: क्योंकि वह उसे चाहता है
  rationale: निकट प्रसंग में पहला ‘वह’ प्रभु और दूसरा पीड़ित व्यक्ति है। θέλει इच्छा, चाह या प्रसन्नता व्यक्त कर सकता है; मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है और अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- issue: भरोसे के कथन का काल
  choice: उसने प्रभु पर भरोसा रखा है
  alternative: उसने प्रभु पर भरोसा रखा था
  rationale: यूनानी aorist भूतकालीन क्रिया बताता है, पर उपहास करनेवालों की चुनौती में उसका वर्तमान प्रभाव बना हुआ है। हिन्दी पूर्ण रूप इस तनाव को सहजता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। व्यंग्यात्मक उद्धरण को स्पष्ट करने के लिए ‘प्रभु’ को दूसरे वाक्य में दोहराया गया है, जिससे हिन्दी में सर्वनाम-संदेह कम हो और स्रोत का आशय न बदले।
