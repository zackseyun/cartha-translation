source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/003.yaml
  text: And we have urged these things all the more[a], since we clearly knew that we were writing to faithful and highly esteemed men who have been deeply instructed in the sayings of God's instruction.
translation:
  language: hi
  text: और हमने इन बातों की आपको और भी अधिक याद दिलाई,[a] क्योंकि हम भली-भाँति जानते थे कि हम ऐसे विश्वासयोग्य और अत्यंत सम्मानित पुरुषों को लिख रहे थे, जिन्होंने परमेश्वर की शिक्षा के वचनों का गहरा अध्ययन किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हमने इन बातों का और भी अधिक आग्रह किया।’ यहाँ संदर्भानुकूल सुधारित यूनानी पाठ ‘याद दिलाया’ अर्थ देता है; ‘विश्वासयोग्य’ का अनुवाद ‘विश्वासी’ भी हो सकता है, और ‘शिक्षा’ में अनुशासन तथा प्रशिक्षण का भाव भी शामिल हो सकता है।
    reason: चिह्नित क्रिया के वैकल्पिक अनुवाद को दर्ज करता है और πιστοῖς तथा παιδεία के अर्थ-विस्तार को भी सुरक्षित रखता है।
lexical_decisions:
- source_word: ὑπεμνήσαμεν (OCR में ὑπενήγκαμεν)
  choice: हमने … याद … दिलाई है
  rationale: संदर्भ और Funk के पाठ के ज्ञात OCR-सुधार के अनुसार क्रिया ὑπομιμνῄσκω से है, जिसका अर्थ ‘याद दिलाना’ है; यह पिछले वाक्य में स्मरण कराने की भाषा से भी जुड़ती है।
- source_word: τοσούτῳ μᾶλλον
  choice: और भी अधिक
  rationale: तुलनात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: πιστοῖς
  choice: विश्वासयोग्य
  rationale: यहाँ संबोधित पुरुषों की विश्वसनीयता/निष्ठा का गुण है; ‘विश्वासी’ भी संभव है, पर वह अर्थ को केवल धार्मिक पहचान की ओर सीमित कर सकता है।
- source_word: ἐλλογιμωτάτοις
  choice: अत्यंत सम्मानित
  rationale: अतिशयोक्तिपरक रूप के ऊँचे आदरभाव को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐγκεκυφόσιν εἰς (OCR में ἐγκεχυφόσιν)
  choice: का गहरा अध्ययन किया है
  rationale: शाब्दिक रूप से ‘झुककर ध्यान से देखना’ के भाव को सामान्य पाठक के लिए स्वाभाविक रूप में व्यक्त करता है।
- source_word: τὰ λόγια τῆς παιδείας τοῦ θεοῦ
  choice: परमेश्वर की शिक्षा के वचनों
  rationale: λόγια के ‘वचन/दैवी कथन’ और παιδεία के ‘शिक्षा, अनुशासन, प्रशिक्षण’ संबंधी अर्थक्षेत्र को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: παιδεία का अर्थक्षेत्र
  choice: शिक्षा
  alternative: अनुशासन / प्रशिक्षण
  rationale: ‘शिक्षा’ व्यापक और संदर्भानुकूल है तथा केवल दंडात्मक अनुशासन का भाव नहीं थोपती; अन्य अर्थ footnote में संकेतित हैं।
- issue: πιστοῖς की व्याख्या
  choice: विश्वासयोग्य
  alternative: विश्वासी
  rationale: यूनानी विशेषण दोनों अर्थ दे सकता है। इस प्रशंसात्मक सूची में ‘विश्वासयोग्य’ सहज है, पर वैकल्पिक धार्मिक अर्थ को footnote में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सहज है। वाक्य की प्रशंसात्मक औपचारिकता रखी गई है, जबकि कठिन यूनानी रूपक को ‘गहरा अध्ययन’ के रूप में स्वाभाविक बनाया गया है।
