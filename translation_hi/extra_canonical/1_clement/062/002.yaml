  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/002.yaml
  text: For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance[a], we have touched on every point, reminding you that you ought to please Almighty God devoutly in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were spoken of before, were well-pleasing to him, humbling themselves before the Father and God and Creator and all people.
translation:
  language: hi
  text: क्योंकि विश्वास, पश्चाताप, सच्चे प्रेम, आत्म-संयम, विवेकशीलता और धीरज के विषय में हमने हर पहलू पर चर्चा की है। हमने तुम्हें स्मरण दिलाया है कि तुम्हें धार्मिकता, सत्य और सहनशीलता में सर्वशक्तिमान परमेश्वर को भक्तिभाव से प्रसन्न करना चाहिए; एक मन होकर, मन में बैर रखे बिना, प्रेम और शांति में, गहरी सौम्यता के साथ रहना चाहिए। इसी प्रकार हमारे वे पूर्वज भी, जिनका पहले उल्लेख किया गया है, पिता, परमेश्वर और सृष्टिकर्ता तथा सब मनुष्यों के सामने दीन बने रहकर उसे प्रसन्न करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοίας
  choice: मन-फिराव
  rationale: यह पश्चात्ताप के भाव के साथ मन और दिशा के परिवर्तन को व्यक्त करता है।
- source_word: γνησίας ἀγάπης
  choice: सच्चे प्रेम
  rationale: γνήσιος प्रेम की असलियत और निष्कपटता पर बल देता है।
- source_word: σωφροσύνης
  choice: विवेकशीलता
  rationale: यह संयत, समझदार और स्वस्थ नैतिक सोच को सूचित करता है; इसे ἐγκράτεια से अलग रखा गया है।
- source_word: ὑπομονῆς
  choice: धीरज
  rationale: कठिनाई में टिके रहने और सहन करने का भाव।
- source_word: ἐψηλαφήσαμεν
  choice: हर बिंदु पर विचार किया है
  rationale: शाब्दिक रूप से ‘टटोलना’ यहाँ विषयों को विस्तार से छूने या जाँचने का रूपक है।
- source_word: μακροθυμίᾳ
  choice: सहनशीलता
  rationale: दूसरों के प्रति दीर्घ धैर्य और क्रोध में विलंब का भाव।
- source_word: ἀμνησικάκως
  choice: मन में बैर रखे बिना
  rationale: हानि या बुराई को याद रखकर वैर पालने से मुक्त होने का स्पष्ट प्राकृतिक हिन्दी रूप।
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: गहरी नम्रता
  rationale: ἐκτενής की तीव्रता और ἐπιείκεια की कोमल, अनाग्रही नम्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: ταπεινοφρονοῦντες
  choice: दीन बने रहकर
  rationale: मन की विनम्रता या दीनता को क्रियात्मक रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ὁσίως का संबंध
  choice: ‘भक्ति के साथ’ को ‘परमेश्वर को प्रसन्न करना’ से जोड़ा गया
  alternative: इसे ‘पवित्रता में’ कहकर धार्मिकता, सत्य और सहनशीलता की सूची में रखना
  rationale: ग्रीक में ὁσίως क्रियाविशेषण है और εὐαρεστεῖν को विशेषित करता है।
- issue: τὰ πρὸς ... की व्याख्या
  choice: ‘पिता... तथा सब मनुष्यों के सामने दीन बने रहकर’
  alternative: ‘पिता... तथा सब मनुष्यों से संबंधित बातों में नम्र रहते हुए’
  rationale: ग्रीक वाक्यांश कुछ संक्षिप्त और असामान्य है; चुना गया रूप संदर्भगत संबंध को स्वाभाविक हिन्दी में रखता है, बिना पिता, परमेश्वर और सृष्टिकर्ता को अलग-अलग सत्ता मानने के लिए बाध्य किए।
- issue: τὸν πατέρα καὶ θεὸν καὶ κτίστην
  choice: ‘पिता, परमेश्वर और सृष्टिकर्ता’
  alternative: ‘हमारे पिता और परमेश्वर और सृष्टिकर्ता’
  rationale: ग्रीक के उपाधि-क्रम और संयोजकों को बनाए रखा गया है; कोई अतिरिक्त सर्वनाम नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय पर सामान्य पाठक के लिए बोधगम्य। लंबे ग्रीक वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है, जबकि तर्कगत संबंध और सद्गुणों की क्रमावली सुरक्षित रखी गई है।
