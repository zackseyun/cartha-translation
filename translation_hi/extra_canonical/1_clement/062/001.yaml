base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/001.yaml
  text: Concerning the matters that pertain to our religion, and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers.
translation:
  language: hi
  text: भाइयो, हमारे धर्म से संबंधित बातों और उन बातों के विषय में जो उन लोगों के सद्गुणमय जीवन के लिए सबसे अधिक लाभकारी हैं, जो भक्ति और न्याय के साथ अपना जीवन-मार्ग चलाना चाहते हैं, हमने तुम्हें पर्याप्त रूप से लिखा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρησκείᾳ
  choice: धर्म
  rationale: यहाँ शब्द सामुदायिक धार्मिक विश्वास और आचरण से संबंधित विषयों को सूचित करता है; ‘धर्म’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: ἐνάρετον βίον
  choice: सद्गुणमय जीवन
  rationale: विशेषण ἐνάρετος के नैतिक गुण-संपन्न जीवन के भाव को सीधे बनाए रखता है।
- source_word: εὐσεβῶς καὶ δικαίως
  choice: भक्ति और धार्मिकता से
  rationale: 'दोनों क्रियाविशेषणों का भेद सुरक्षित रखा गया है: εὐσεβῶς ईश्वर के प्रति श्रद्धापूर्ण भक्ति और δικαίως नैतिक धार्मिकता/न्यायोचित आचरण को व्यक्त करता है।'
- source_word: διευθύνειν
  choice: अपना जीवन सँवारना
  rationale: मूल में अपने जीवन-मार्ग को सही दिशा में व्यवस्थित करने का भाव है; यह हिन्दी प्रयोग उस सक्रिय नैतिक निर्देशन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἱκανῶς ἐπεστείλαμεν
  choice: हमने ... पर्याप्त रूप से लिख दिया है
  rationale: पत्र में पर्याप्त निर्देश दे चुकने के पूर्ण भाव को सुरक्षित रखता है।
- source_word: ἄνδρες ἀδελφοί
  choice: हे भाइयो
  rationale: यह प्रत्यक्ष संबोधन है; हिन्दी में ‘हे भाइयो’ गरिमापूर्ण और सहज है, जबकि ἄνδρες संबोधन को बल देता है और अलग अनुवाद आवश्यक नहीं।
