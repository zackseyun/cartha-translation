id: 1CLEM.51.5
reference: 1 Clement 51:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/005.yaml
  text: 'Pharaoh and his army and all the leaders of Egypt, both the chariots and those who rode in them, were sunk into the Red Sea and perished for no other cause than this: their foolish hearts were hardened after the signs and wonders had taken place in the land of Egypt through Moses, the servant of God.'
translation:
  language: hi
  text: फ़िरौन, उसकी सेना और मिस्र के सभी अगुए—रथ और उन पर सवार लोग भी—किसी और कारण से नहीं, बल्कि इसलिए कि परमेश्वर के सेवक मूसा के द्वारा मिस्र देश में चिन्ह और चमत्कार हो चुकने के बाद उनके विवेकहीन हृदय कठोर हो गए थे, लाल समुद्र में डुबा दिए गए और नष्ट हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: अगुए
  rationale: यहाँ मिस्र के नेतृत्वकारी अधिकारियों का संकेत है; ‘अगुए’ सामान्य पाठक के लिए सहज है और पद या शासन-व्यवस्था को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: οἱ ἀναβάται
  choice: उन पर सवार लोग
  rationale: यह रथों पर चढ़े या सवार व्यक्तियों को सीधे व्यक्त करता है और केवल आधुनिक अर्थ वाले ‘घुड़सवार’ का भ्रम नहीं उत्पन्न करता।
- source_word: ἐβυθίσθησαν
  choice: डुबा दिए गए
  rationale: यूनानी का कर्मवाच्य रूप सुरक्षित रहता है; कर्ता को वहाँ स्पष्ट नहीं किया गया है, इसलिए अनुवाद भी उसे अनकहा रखता है।
- source_word: ἀσυνέτους καρδίας
  choice: विवेकहीन हृदय
  rationale: ἀσύνετος में समझ-बूझ के अभाव का भाव है; ‘विवेकहीन’ गरिमापूर्ण आधुनिक हिन्दी में इस अर्थ को व्यक्त करता है।
- source_word: σημεῖα καὶ τέρατα
  choice: चिन्ह और अद्भुत काम
  rationale: स्थापित बाइबलीय युग्म को स्वाभाविक हिन्दी में रखा गया है; ‘अद्भुत काम’ τέρατα की आश्चर्यजनक घटनाओं का बोध कराता है।
- source_word: θεράποντος τοῦ θεοῦ
  choice: परमेश्वर के सेवक
  rationale: θεράπων यहाँ परमेश्वर की सेवा में नियुक्त व्यक्ति के लिए है; ‘सेवक’ स्वाभाविक और संदर्भानुकूल है।
theological_decisions:
- issue: हृदयों के कठोर होने में कर्तृत्व
  choice: ‘उनके ... हृदय कठोर हो गए थे’
  alternative: ‘परमेश्वर ने उनके हृदय कठोर कर दिए थे’
  rationale: स्रोत में σκληρυνθῆναι कर्मवाच्य है, पर कर्ता स्पष्ट नहीं है। अनुवाद परमेश्वर को स्पष्ट कर्ता बनाकर मूल की अस्पष्टता और तनाव को नहीं मिटाता।
- issue: διὰ τοῦ θεράποντος का माध्यम
  choice: ‘परमेश्वर के सेवक मूसा के द्वारा’
  alternative: ‘मूसा, परमेश्वर के सेवक, के हाथों’
  rationale: ‘के द्वारा’ माध्यम के अर्थ को साफ़ और स्वाभाविक रूप से व्यक्त करता है, बिना मूसा को चिन्हों का स्वतंत्र अंतिम स्रोत ठहराए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। लंबी यूनानी वाक्यरचना को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि कारण-संबंध और कथन का बल सुरक्षित रखा गया है।
