base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/002.yaml
  text: For those who conduct themselves with fear and love desire rather to fall into mistreatment themselves than their neighbors[a]; indeed[b], they bear condemnation of themselves rather than of the harmony that has been handed down to us well and justly.
translation:
  language: hi
  text: क्योंकि जो भय और प्रेम के साथ अपना आचरण करते हैं, वे चाहते हैं कि उनके पड़ोसियों के बजाय वे स्वयं दुर्व्यवहार का शिकार हों[a]; बल्कि वे उस एकमतता के विरुद्ध दोषारोपण के बजाय अपने ही विरुद्ध दोषारोपण सहते हैं[b], जो हमें भली और न्यायोचित रीति से सौंपी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् वे यह नहीं चाहते कि उनके पड़ोसी दुर्व्यवहार का शिकार हों; यूनानी पाठ यह नहीं कहता कि वे स्वयं अपने पड़ोसियों पर दुर्व्यवहार लाते हैं।
    reason: लुप्त क्रिया περιπίπτειν के साथ ἑαυτούς और τοὺς πλησίον के समानांतर कर्तृवत् कर्मकारक प्रयोग को स्पष्ट करना।
  - marker: b
    text: या, “वे उस एकमतता पर दोष लगाने के बजाय स्वयं पर दोष लगाते हैं।”
    reason: κατάγνωσιν φέρειν के सक्रिय अर्थ की संभावित व्याख्या को सुरक्षित रखना, जबकि मुख्य पाठ में दोषारोपण सहने का अर्थ रखा गया है।
