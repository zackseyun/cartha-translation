theological_decisions:
- issue: ἢ τοὺς πλησίον में लुप्त क्रिया का अर्थ
  choice: उनके पड़ोसियों के बजाय वे स्वयं दुर्व्यवहार का शिकार हों
  alternative: अपने पड़ोसियों पर दुर्व्यवहार लाने के बजाय स्वयं उसे सहें
  rationale: τοὺς πλησίον, ἑαυτούς के समान, निहित περιπίπτειν का कर्मकारक कर्ता है; यूनानी पाठ पड़ोसियों पर दुर्व्यवहार कराने का सक्रिय भाव नहीं देता।
- issue: κατάγνωσιν φέρουσιν का अर्थ
  choice: स्वयं दोषी ठहराया जाना स्वीकार करते हैं
  alternative: अपने ऊपर दोषारोपण लाते हैं / स्वयं को दोषी ठहराते हैं
  rationale: वाक्यांश में स्वयं पर निर्णय या दोषारोपण सहने अथवा अपने विरुद्ध लाने, दोनों की छाया संभव है। मुख्य पाठ संदर्भगत आत्म-त्याग व्यक्त करता है और पादटिप्पणी वैकल्पिक सक्रिय अर्थ सुरक्षित रखती है।
