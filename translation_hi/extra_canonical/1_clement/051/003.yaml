id: 1CLEM.51.3
reference: 1 Clement 51:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/003.yaml
  text: For it is good for a man to confess his transgressions rather than to harden his heart[a], just as the heart of those who rebelled against Moses, the servant of God, was hardened, whose judgment became evident.
translation:
  language: hi
  text: क्योंकि मनुष्य के लिए अपने अपराधों को स्वीकार करना अच्छा है, न कि अपने हृदय को कठोर करना[a], जैसे उन लोगों का हृदय कठोर हो गया था जिन्होंने परमेश्वर के सेवक मूसा के विरुद्ध विद्रोह किया था; उनका न्याय प्रकट हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने अपराधों के विषय में अंगीकार करना।”
    reason: περὶ τῶν παραπτωμάτων के अधिक शाब्दिक रूप को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων
  choice: अपने अपराधों को मान लेना
  rationale: यह यूनानी अभिव्यक्ति अपने अपराधों को खुले तौर पर स्वीकार करने का भाव देती है। हिन्दी में ‘अपराधों को मान लेना’ स्वाभाविक है और περὶ के शाब्दिक ‘के विषय में’ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: σκληρῦναι τὴν καρδίαν
  choice: अपने हृदय को कठोर करना
  rationale: मूल रूपक को सुरक्षित रखते हुए यह हिन्दी बाइबलीय शैली में स्पष्ट और स्वाभाविक है।
- source_word: στασιασάντων πρὸς
  choice: के विरुद्ध विद्रोह किया
  rationale: στασιάζω यहाँ विरोधी गुटबंदी या बगावत का प्रबल भाव रखता है; ‘विद्रोह’ उस भाव को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: θεράποντα τοῦ θεοῦ
  choice: परमेश्वर के सेवक
  rationale: θεράπων सम्मानित सेवा करने वाले व्यक्ति को दर्शाता है; ‘सेवक’ आधुनिक हिन्दी में स्वाभाविक और स्थापित समतुल्य है।
- source_word: τὸ κρίμα πρόδηλον ἐγενήθη
  choice: उनका दण्ड सब पर प्रकट हो गया
  rationale: κρίμα संदर्भ में केवल निर्णय नहीं, दोष के परिणामस्वरूप आया दण्ड सूचित करता है; πρόδηλον के प्रबल सार्वजनिक भाव को ‘सब पर प्रकट’ व्यक्त करता है।
theological_decisions:
- issue: हृदय के कठोर होने में मानवीय कर्तृत्व और निष्क्रिय अवस्था
  choice: पहले ‘अपने हृदय को कठोर करना’ और बाद में ‘हृदय कठोर हो गया था’
  alternative: दोनों स्थानों पर कर्तृवाच्य या दोनों पर कर्मवाच्य प्रयोग
  rationale: यूनानी पाठ पहले सक्रिय σκληρῦναι और फिर निष्क्रिय ἐσκληρύνθη रखता है। अनुवाद इस तनाव को बनाए रखता है और कठोर करने वाले की पहचान अपने से तय नहीं करता।
- issue: κρίμα का अर्थ
  choice: दण्ड
  alternative: न्याय / न्यायादेश
  rationale: विद्रोहियों के संदर्भ में यह उनके विरुद्ध प्रकट हुए न्यायिक परिणाम को सूचित करता है। ‘दण्ड’ अर्थ को स्पष्ट करता है, पर पाठ यह नहीं बताता कि उसका सटीक रूप क्या था।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘हृदय’, ‘परमेश्वर’, ‘सेवक’ और ‘विद्रोह’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य की यूनानी तर्क-रचना और सक्रिय/निष्क्रिय भेद सुरक्षित रखा गया है।
