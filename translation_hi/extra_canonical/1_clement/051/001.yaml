source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
translation:
  language: hi
  text: इसलिए, विरोधी की किसी भी चाल के वश में आकर हमसे जो भी चूकें हुईं और जो भी गलत काम हमने किए, उनके लिए हम क्षमा की विनती करें। और जो लोग विद्रोह और फूट के अगुए बने, उन्हें भी साझी आशा पर ध्यान देना चाहिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπέσαμεν
  choice: हमसे ... चूक हुई
  rationale: यह क्रिया ठोकर खाने, चूकने या गलत राह पर पड़ने का भाव रखती है; आधुनिक हिन्दी में ‘हमसे चूक हुई’ सहज है और नैतिक दोष को बनाए रखता है।
- source_word: διά τινος τῶν τοῦ ἀντικειμένου
  choice: विरोधी के किसी भी हथकंडे के कारण
  rationale: ἀντικείμενος यहाँ विरोध करने वाली शत्रु सत्ता के लिए प्रयुक्त है; ‘विरोधी’ इसकी संभावित व्यक्तिगत/आध्यात्मिक पहचान को अनावश्यक रूप से निश्चित नहीं करता। अस्पष्ट τῶν को ‘हथकंडे’ से स्वाभाविक हिन्दी दी गई है।
- source_word: ἀξιώσωμεν ἀφεθῆναι ἡμῖν
  choice: हम क्षमा माँगें
  rationale: शाब्दिक अर्थ ‘हम अपने लिए क्षमा किए जाने की विनती करें’ है; ‘क्षमा माँगें’ उसी आग्रह को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἀρχηγοὶ στάσεως καὶ διχοστασίας
  choice: विद्रोह और फूट के अगुए
  rationale: ἀρχηγοί आरंभकर्ता/नेता हैं; ‘अगुए’ गरिमापूर्ण और सहज है। στάσις सामुदायिक विद्रोह या कलह और διχοστασία विभाजन/फूट को दर्शाता है।
- source_word: τὸ κοινὸν τῆς ἐλπίδος
  choice: हमारी साझी आशा
  rationale: यह यूनानी मुहावरा समुदाय की साझा आशा को सूचित करता है। ‘साझी आशा’ हिन्दी में स्पष्ट है; ‘हमारी’ प्रसंगगत सामुदायिक संबंध को व्यक्त करता है।
theological_decisions:
- issue: ὁ ἀντικείμενος की पहचान
  choice: विरोधी
  alternative: शैतान
  rationale: मूल पाठ पदवी ‘विरोधी’ देता है और यहाँ नाम स्पष्ट नहीं करता; अनुवाद उस खुलापन को सुरक्षित रखता है।
- issue: τὸ κοινὸν τῆς ἐλπίδος का अर्थ
  choice: हमारी साझी आशा
  alternative: हमारी आशा के सामूहिक हित
  rationale: प्रमाणित मुहावरे के अनुसार मुख्य अर्थ ‘common hope’ है; ‘सामूहिक हित’ अर्थ को बढ़ाकर व्याख्यात्मक बना देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामुदायिक पश्चात्ताप और गंभीर उपदेश के अनुरूप सहज, गरिमापूर्ण शैली। ‘हमसे ... चूक हुई’ और ‘हमने किया’ के बीच मूल की दोहरी अभिव्यक्ति बनाए रखी गई है।
