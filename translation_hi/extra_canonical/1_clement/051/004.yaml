  text: κατέβησαν γὰρ εἰς ᾅδου ζῶντες, καὶ θάνατος ποιμανεῖ αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/004.yaml
  text: For they went down alive into Hades, and death will shepherd them.
translation:
  language: hi
  text: क्योंकि वे जीवित ही अधोलोक में उतर गए, और मृत्यु उनकी चरवाही करेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: अधोलोक
  rationale: यह यूनानी ‘हेडेस’ अर्थात मृतकों के लोक को दर्शाता है; ‘नरक’ कहने से दंड-स्थान का अधिक विशिष्ट अर्थ अनावश्यक रूप से जुड़ सकता है।
- source_word: ζῶντες
  choice: जीवित ही
  rationale: ‘ही’ इस असाधारण बात पर स्वाभाविक हिंदी में बल देता है कि वे जीवित अवस्था में उतरे।
- source_word: ποιμανεῖ
  choice: चरवाही करेगी
  rationale: क्रिया का मूल चरवाहे की तरह रखवाली या संचालन करना है। इस रूपक को ‘शासन करेगी’ जैसे सपाट अर्थ में बदलने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: ᾅδης का स्वरूप
  choice: अधोलोक
  alternative: नरक
  rationale: पाठ मृतकों के लोक का उल्लेख करता है और स्वयं अंतिम दंड के विशिष्ट स्थान को स्पष्ट नहीं करता; इसलिए व्यापक अर्थ बनाए रखा गया है।
- issue: मृत्यु द्वारा चरवाही का रूपक
  choice: मृत्यु उनकी चरवाही करेगी
  alternative: मृत्यु उन पर शासन करेगी
  rationale: मूल यूनानी के जानबूझकर रखे गए चरवाहा-रूपक और उसकी कठोर विडंबना को संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट शैली। ‘अधोलोक’ सामान्य बोलचाल से कुछ अधिक साहित्यिक है, पर धार्मिक-प्राचीन संदर्भ में सटीक और समझने योग्य है।
