source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/001.yaml
  text: Therefore, do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise?
translation:
  language: hi
  text: तो क्या हम इसे बड़ी और अद्भुत बात समझें कि सब वस्तुओं का सृष्टिकर्ता उन लोगों को पुनरुत्थान प्रदान करेगा जिन्होंने अच्छे विश्वास के दृढ़ भरोसे में भक्ति से उसकी सेवा की है, जबकि वह एक पक्षी के द्वारा भी हमें अपनी प्रतिज्ञा की महानता दिखाता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς τῶν ἁπάντων
  choice: सब वस्तुओं का सृष्टिकर्ता
  rationale: यह पद समस्त सृष्टि के बनाने वाले को दर्शाता है; ‘सृष्टिकर्ता’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀνάστασιν ποιήσεται
  choice: पुनर्जीवित करेगा
  rationale: शाब्दिक अर्थ ‘पुनरुत्थान करेगा/घटित करेगा’ है। हिन्दी में व्यक्तियों को कर्म बनाकर ‘पुनर्जीवित करेगा’ वाक्य को सहज रखता और देहधारी पुनरुत्थान का आशय बनाए रखता है।
- source_word: ὁσίως αὐτῷ δουλευσάντων
  choice: पवित्रता से उसकी सेवा की है
  rationale: ὁσίως धार्मिक निष्ठा और पवित्र आचरण का भाव देता है; δουλεύω यहाँ परमेश्वर की सेवा करने के अर्थ में है।
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  choice: उत्तम विश्वास के भरोसे
  rationale: πεποίθησις का विश्वासपूर्ण भरोसा और πίστις ἀγαθή का सकारात्मक नैतिक-धार्मिक गुण, दोनों संक्षेप में सुरक्षित हैं।
- source_word: δι᾿ ὀρνέου
  choice: एक पक्षी के द्वारा
  rationale: ग्रीक पाठ पक्षी की जाति यहाँ नहीं बताता; अगले संदर्भ की पहचान को इस पद में पहले से नहीं जोड़ा गया।
- source_word: τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ
  choice: अपनी प्रतिज्ञा की महानता
  rationale: मूल पद की गरिमा और प्रतिज्ञा के असाधारण स्वरूप को सीधे बनाए रखता है।
theological_decisions:
- issue: पुनरुत्थान का कर्ता और आश्वासन
  choice: सृष्टिकर्ता स्वयं सेवा करने वालों को पुनर्जीवित करेगा
  alternative: उनका पुनरुत्थान होगा
  rationale: मूल में δημιουργός कर्ता है और ἀνάστασιν ποιήσεται सक्रिय दैवी कार्य को व्यक्त करता है।
- issue: πίστεως ἀγαθῆς का अर्थ
  choice: उत्तम विश्वास
  alternative: सद्भावना / अच्छे विवेक का विश्वास
  rationale: ‘विश्वास’ मूल धार्मिक अर्थ को बनाए रखता है, पर अनावश्यक रूप से इसे किसी विशिष्ट सिद्धान्तगत परिभाषा में सीमित नहीं करता।
- issue: आरंभिक प्रश्न का अलंकारिक बल
  choice: ‘तो क्या हम इसे कोई बड़ी और अद्भुत बात समझते हैं...?’
  alternative: ‘अतः हम इसे बड़ी और अद्भुत बात समझते हैं...’
  rationale: εἰ और अंतिम प्रश्नचिह्न के अनुसार यह अलंकारिक प्रश्न है, जिसका निहित उत्तर ‘नहीं’ है; ‘कोई’ हिन्दी में उस बल को स्वाभाविक बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। मूल के लंबे अलंकारिक प्रश्न को बनाए रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं; इसलिए मुख्य पाठ में भी कोई संकेतक नहीं है।
