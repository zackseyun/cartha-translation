  choice: ‘मेरी इसी देह को उठा खड़ा करेगा’
  alternative: ‘मेरी देह को पुनर्जीवित करेगा’
  rationale: चुना गया रूप पुनरुत्थान का आशय स्पष्ट रखते हुए यूनानी ἀναστήσεις की ‘उठाने/खड़ा करने’ वाली मूल छवि और ‘इसी’ (ταύτην) के बल को सुरक्षित रखता है।
