  text: For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.”
translation:
  language: hi
  text: क्योंकि वह कहीं कहता है, “तू मुझे उठाएगा, और मैं तेरा धन्यवाद करूँगा”; और, “मैं सो गया और सोया; मैं जाग उठा, क्योंकि तू मेरे साथ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαναστήσεις
  choice: फिर उठाएगा
  rationale: क्रिया में उठाने और पुनः उठाने का भाव है; प्रसंग में पुनरुत्थान की ओर संकेत बनाए रखने के लिए यह सहज और निकट अनुवाद है।
- source_word: ἐξομολογήσομαί
  choice: धन्यवाद करूँगा
  rationale: यहाँ परमेश्वर को संबोधित स्तुतिपूर्ण कृतज्ञता का भाव है; केवल ‘अंगीकार करूँगा’ आधुनिक हिन्दी में अपेक्षित अर्थ स्पष्ट नहीं करता।
- source_word: Ἐκοιμήθην καὶ ὕπνωσα
  choice: मैं लेट गया और सो गया
  rationale: दोनों यूनानी क्रियाओं का क्रम और काव्यात्मक समानांतरता स्वाभाविक हिन्दी में सुरक्षित रखी गई है।
- source_word: ἐξηγέρθην
  choice: मैं जाग उठा
  rationale: नींद से उठने का प्रत्यक्ष अर्थ देता है और व्यापक पुनरुत्थान-संकेत को भी अनावश्यक रूप से सीमित नहीं करता।
- source_word: μετ᾿ ἐμοῦ
  choice: मेरे साथ
  rationale: साथ और उपस्थिति का सीधा अर्थ सुरक्षित है।
theological_decisions:
- issue: उद्धरणों का पुनरुत्थान के प्रमाण के रूप में प्रयोग
  choice: ‘फिर उठाएगा’ और ‘जाग उठा’ के रूप में मूल रूपकों को बनाए रखा
  alternative: दोनों स्थानों पर स्पष्ट रूप से ‘मरे हुओं में से जिलाएगा/जी उठा’ कहना
  rationale: लेखक का संदर्भ पुनरुत्थान है, पर उद्धृत पंक्तियों में उठने और नींद से जागने की भाषा है; अनुवाद ने संकेत को स्पष्ट व्याख्या में नहीं बदला।
- issue: λέγει का कर्ता
  choice: ‘वह कहता है’
  alternative: ‘पवित्रशास्त्र कहता है’ या ‘परमेश्वर कहता है’
  rationale: यूनानी पाठ कर्ता की स्पष्ट पहचान नहीं करता; इसलिए उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुकूल शैली। परमेश्वर को संबोधन में ‘तू/तेरा’ रखा गया है, जो उद्धरण की एकवचन निकट संबोधन-रचना को स्वाभाविक रूप से व्यक्त करता है।
