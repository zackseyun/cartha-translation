id: 1CLEM.60.3
reference: 1 Clement 60:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/003.yaml
  text: Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your exalted arm, and rescue us from those who hate us unjustly.
translation:
  language: hi
  text: हाँ, हे स्वामी, भलाई के लिए शान्ति में अपना मुख हम पर चमका, ताकि हम तेरे सामर्थी हाथ से ढाँपे जाएँ और तेरी ऊँची भुजा के द्वारा हर पाप से छुड़ाए जाएँ, और हमें उन लोगों से बचा जो हमसे अन्यायपूर्वक घृणा करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: यह सम्बोधन परम अधिकार रखने वाले स्वामी को दर्शाता है; ‘हे स्वामी’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς
  choice: अपने मुख का प्रकाश हम पर चमका
  rationale: मूल के सामी-बाइबलीय मुहावरे और प्रकाशमान मुख की छवि को बनाए रखते हुए हिन्दी में अर्थ स्पष्ट किया गया है।
- source_word: σκεπασθῆναι
  choice: ओट में रहें
  rationale: शाब्दिक अर्थ ‘ढके जाएँ’ है, पर सामर्थी हाथ के साथ ‘ओट में रहना’ संरक्षण की छवि को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῷ βραχίονί σου τῷ ὑψηλῷ
  choice: तेरी ऊँची भुजा के द्वारा
  rationale: ‘ऊँची भुजा’ मूल रूपक को सुरक्षित रखती है और उसे केवल ‘शक्तिशाली’ कहकर स्रोत की विशिष्ट छवि मिटाती नहीं।
- source_word: ἀδίκως
  choice: अन्यायपूर्वक
  rationale: यह क्रियाविशेषण स्पष्ट करता है कि उनकी घृणा अनुचित अथवा अन्यायपूर्ण है।
theological_decisions:
- issue: πάσης ἁμαρτίας का आशय
  choice: हर पाप से
  alternative: हर बुराई से
  rationale: ἁμαρτία का सामान्य और प्रत्यक्ष अर्थ ‘पाप’ है। व्यापक ‘बुराई’ सम्भव व्याख्यात्मक अर्थ हो सकता है, पर यहाँ उसे पाठ में आरोपित नहीं किया गया।
- issue: दैवी संरक्षण की रूपकात्मक भाषा
  choice: सामर्थी हाथ की ओट और ऊँची भुजा—दोनों रूपक बनाए रखे
  alternative: केवल ‘अपनी शक्ति से हमारी रक्षा कर’
  rationale: मूल में हाथ और भुजा की दो समानान्तर किन्तु अलग छवियाँ हैं; संक्षिप्त व्याख्यात्मक अनुवाद उनकी काव्यात्मक और धर्मशास्त्रीय गूँज मिटा देता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनामय और गरिमापूर्ण रखी गई है। ईश्वर के लिए निकटतापूर्ण एकवचन ‘तेरे/तेरी’ का प्रयोग किया गया है, जबकि आज्ञार्थक रूप कठोर न लगे इसलिए वाक्य को बाइबलीय प्रार्थना की शैली में रखा गया है। ‘शान्ति में हमारी भलाई के लिए’ मूल के εἰς ἀγαθὰ ἐν εἰρήνῃ की संक्षिप्तता और हल्की वाक्यगत अनिश्चितता को यथासम्भव बनाए रखता है।
