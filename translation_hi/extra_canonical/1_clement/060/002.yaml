reference: 1 Clement 60:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ λογίσῃ πᾶσαν ἁμαρτίαν δούλων σου καὶ παιδισκῶν, ἀλλὰ καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας, καὶ κατεύθυνον τὰ διαβήματα ἡμῶν ἐν ὁσιότητι καρδίας πορεύεσθαι καὶ ποιεῖν τὰ καλὰ καὶ εὐάρεστα ἐνώπιόν σου καὶ ἐνώπιον τῶν ἀρχόντων ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/002.yaml
  text: Do not count every sin of your servants and maidservants[a], but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers.
translation:
  language: hi
  text: तेरे दासों और दासियों के किसी भी पाप का लेखा न रख,[a] बल्कि तेरे सत्य की शुद्धि से हमें शुद्ध कर; और हमारे कदमों को सीधा कर, कि हम हृदय की पवित्रता में चलें और वे काम करें जो तेरे सामने और हमारे शासकों के सामने भले और मनभावने हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तेरे दासों और दासियों के हर पाप का लेखा न रख।” यहाँ “न ... हर” का आशय संभवतः “किसी भी ... का नहीं” है।'
    reason: μὴ के साथ πᾶσαν की निषेध-सीमा और शाब्दिक संरचना संबंधी वास्तविक भाषिक अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  choice: किसी भी पाप का लेखा न रख
  rationale: निषेध μὴ के साथ πᾶσαν को यहाँ सेमिटिक/LXX-प्रभावित प्रयोग मानते हुए ‘किसी भी पाप’ किया गया है; ‘हर पाप का लेखा न रख’ आधुनिक हिन्दी में अनचाहा अर्थ दे सकता है कि कुछ पापों का लेखा रखा जाए। λογίζομαι का लेखा लगाने/गिनने का भाव सुरक्षित है।
- source_word: δούλων σου καὶ παιδισκῶν
  choice: अपने दासों और दासियों
  rationale: दोनों लिंगों को स्पष्ट रखते हुए प्रार्थनात्मक-बाइबिलीय पदावली अपनाई गई है; यूनानी शब्द ऐतिहासिक रूप से दासत्व का अर्थ भी रख सकते हैं।
- source_word: καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας
  choice: अपने सत्य की शुद्धि से हमें शुद्ध कर
  rationale: सजातीय καθάρισον/καθαρισμόν की पुनरुक्ति को जानबूझकर बनाए रखा गया है और संबंधवाचक τῆς σῆς ἀληθείας की अस्पष्टता को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: κατεύθυνον τὰ διαβήματα ἡμῶν
  choice: हमारे कदमों को सीधा कर
  rationale: दिशा देने और सही मार्ग पर चलाने की रूपकात्मक छवि सीधे संरक्षित है।
- source_word: ἐν ὁσιότητι καρδίας
  choice: हृदय की पवित्रता में
  rationale: ὁσιότης के धार्मिक-नैतिक पवित्रता/भक्ति-निष्ठा के भाव के लिए सामान्य और गरिमापूर्ण हिन्दी चुनी गई है।
- source_word: τὰ καλὰ καὶ εὐάρεστα
  choice: वे काम ... जो ... भले और मनभावने हैं
  rationale: καλά को नैतिक भलाई और εὐάρεστα को स्वीकार्य/प्रसन्न करने वाले अर्थ में प्रस्तुत किया गया है।
- source_word: τῶν ἀρχόντων ἡμῶν
  choice: हमारे शासकों
  rationale: सार्वजनिक अधिकार रखने वालों के लिए तटस्थ शब्द, बिना किसी विशिष्ट शासन-व्यवस्था को आरोपित किए।
theological_decisions:
- issue: μὴ ... πᾶσαν के निषेध का विस्तार
  choice: किसी भी पाप का लेखा न रख
  alternative: हर पाप का लेखा न रख
  rationale: LXX-प्रभावित/सेमिटिक वाक्य-विन्यास में ‘न ... सब/हर’ प्रायः ‘कोई भी नहीं’ व्यक्त करता है। चुना हुआ पाठ प्रार्थना की स्वाभाविक याचना को व्यक्त करता है; शाब्दिक विकल्प की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- issue: परमेश्वर और शासकों के सामने मनभावना आचरण
  choice: दोनों संबंधों को समानांतर रूप में बनाए रखा
  alternative: केवल परमेश्वर को प्रसन्न करने पर बल देकर शासकों को गौण करना
  rationale: मूल में ἐνώπιόν की पुनरावृत्ति दोनों के सामने सार्वजनिक रूप से भले और स्वीकार्य आचरण को स्पष्ट करती है; इसे किसी राजनीतिक धर्मशास्त्र में विस्तारित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली; परमेश्वर के लिए निकटता और मूल के एकवचन को बनाए रखने हेतु ‘तेरे/कर/रख’ रूप। वाक्य की समानांतरता और शुद्धि-संबंधी पुनरुक्ति सुरक्षित रखी गई है।
