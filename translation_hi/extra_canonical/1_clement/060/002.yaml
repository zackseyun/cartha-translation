    issue: Possessive address is inconsistent within the prayer.
    rationale: The draft uses “अपने दासों,” “अपने सत्य,” but later addresses God as “तेरे सामने.” In modern Hindi direct prayer, “तेरे दासों” and “तेरे सत्य” are clearer and stylistically consistent.
