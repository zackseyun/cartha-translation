source:
  edition: Funk 1901 (normalized OCR)
  text: δὸς ὁμόνοιαν καὶ εἰρήνην ἡμῖν τε καὶ πᾶσιν τοῖς κατοικοῦσιν τὴν γῆν, καθὼς ἔδωκας τοῖς πατράσιν ἡμῶν, ἐπικαλουμένων σε αὐτῶν ὁσίως ἐν πίστει καὶ ἀληθείᾳ, ὑπηκόους γινομένους τῷ παντοκράτορι καὶ παναρέτῳ ὀνόματί σου, τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/004.yaml
  text: Give harmony and peace to us and to all who dwell on the earth[a], just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.
translation:
  language: hi
  text: हमें और पृथ्वी पर रहनेवाले सभी लोगों को एकता और शांति दे—जैसे तूने हमारे पूर्वजों को दी थी, जब उन्होंने पवित्रता से, विश्वास और सत्य में तुझे पुकारा था—और ऐसा कर कि हम तेरे सर्वशक्तिमान और सर्वगुणसंपन्न नाम के, और पृथ्वी पर हमारे शासकों और अगुओं के आज्ञाकारी रहें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘आज्ञाकारी’ का रूप ‘हम’ की ओर संकेत करता है, न कि ‘हमारे पूर्वजों’ की ओर। वाक्य का भाव यह भी हो सकता है: ‘जब हम ... आज्ञाकारी बनते हैं।’'
    reason: जटिल यूनानी वाक्य-विन्यास और कृदंत के संबंध को स्पष्ट करना तथा उसकी पक्षगत सूक्ष्मता सुरक्षित रखना।
lexical_decisions:
- source_word: ὁμόνοιαν
  choice: एकता
  rationale: यह शब्द आपसी सहमति और सामाजिक मेल को व्यक्त करता है; आधुनिक हिन्दी में ‘एकता’ स्वाभाविक और स्पष्ट है तथा गुटबाज़ी के विपरीत भाव को बनाए रखता है।
- source_word: ὁσίως
  choice: पवित्रता से
  rationale: क्रियाविशेषण के धार्मिक-नैतिक भाव को सरल, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: παντοκράτορι καὶ παναρέτῳ ὀνόματί σου
  choice: तेरे सर्वशक्तिमान और सर्वगुणसंपन्न नाम
  rationale: दोनों विशेषणों को अलग रखते हुए παντοκράτωρ की सामर्थ्य और παναρέτος की समस्त सद्गुणों से युक्त होने की धारणा सुरक्षित रखी गई है।
- source_word: ἄρχουσιν καὶ ἡγουμένοις
  choice: शासकों और अगुओं
  rationale: 'दो समांतर पदों का भेद बनाए रखता है: पहला शासकीय अधिकार और दूसरा नेतृत्व पर बल देता है।'
theological_decisions:
- issue: ὑπηκόους γινομένους का कर्ता/संबंध
  choice: 'इसे प्रार्थना करनेवाले ‘हम’ से जोड़ा गया: ‘ऐसा कर कि हम ... आज्ञाकारी रहें’'
  alternative: 'इसे ‘हमारे पूर्वजों’ से जोड़ना: ‘वे ... आज्ञाकारी होते हुए’'
  rationale: ὑπηκόους γινομένους कर्मकारक बहुवचन है और समीपस्थ αὐτῶν (‘उन्होंने/उनके’) संबंधकारक रूप से मेल नहीं खाता। साथ ही ‘हमारे शासकों’ के प्रति वर्तमान समुदाय की आज्ञाकारिता संदर्भतः स्वाभाविक है।
- issue: परमेश्वर के नाम और सांसारिक शासकों के प्रति आज्ञाकारिता का समान वाक्य-विन्यास
  choice: दोनों कर्मों को मूल पाठ के अनुसार एक ही आज्ञाकारिता-वाक्य में रखा गया
  alternative: दोनों प्रकार की आज्ञाकारिता को अलग वाक्यों या अलग स्तरों में समझाना
  rationale: यूनानी τε ... καί दोनों को व्याकरणिक रूप से जोड़ता है; अनुवाद ने किसी धर्मवैचारिक श्रेणीक्रम या सीमा को पाठ में नहीं जोड़ा।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापरक और गरिमापूर्ण रखी गई है। ‘तू/तेरे’ का प्रयोग परमेश्वर को सीधे संबोधित करनेवाले मूल एकवचन रूप के अनुरूप है। लंबे यूनानी वाक्य में पूर्वजों वाला अंश डैशों के बीच रखा गया है, ताकि ‘आज्ञाकारी’ का संबंध वर्तमान प्रार्थना-समुदाय से स्पष्ट रहे।
