id: 1CLEM.60.1
reference: 1 Clement 60:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Σὺ γὰρ τὴν ἀέναον τοῦ κόσμου σύστασιν διὰ τῶν ἐνεργουμένων ἐφανεροποίησας· σύ, κύριε, τὴν οἰκουμένην ἔκτισας, ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς, δίκαιος ἐν τοῖς κρίμασιν, θαυμαστὸς ἐν ἰσχύϊ καὶ μεγαλοπρεπείᾳ, ὁ σοφὸς ἐν τῷ κτίζειν καὶ συνετὸς ἐν τῷ τὰ γενόμενα ἑδράσαι, ὁ ἀγαθὸς ἐν τοῖς ὁρωμένοις καὶ πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ, ἐλεῆμον καὶ οἰκτίρμον, ἄφες ἡμῖν τὰς ἀνομίας ἡμῶν καὶ τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/001.yaml
  text: For you have made manifest the everlasting order of the world through your workings. You, Lord, created the inhabited earth, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you. O merciful and compassionate one, forgive us our lawless deeds and our unrighteous acts and our trespasses and failings.
translation:
  language: hi
  text: क्योंकि आपने अपने कार्यों के द्वारा संसार की सनातन व्यवस्था प्रकट की है। हे प्रभु, आपने सारी आबाद धरती की सृष्टि की। आप पीढ़ी-दर-पीढ़ी विश्वासयोग्य, अपने न्याय में धर्मी, सामर्थ्य और प्रताप में अद्भुत, सृष्टि करने में बुद्धिमान और अस्तित्व में आई वस्तुओं को स्थिर करने में समझदार, दृश्य वस्तुओं के प्रति भले और आप पर भरोसा रखनेवालों के प्रति विश्वासयोग्य हैं। हे दयालु और करुणामय,[a] हमारे अधर्म, अन्याय, अपराध और चूक क्षमा कर दीजिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप पर भरोसा रखनेवालों के प्रति विश्वासयोग्य, दयालु और करुणामय हैं। हमारे अधर्म, अन्याय, अपराध और चूक क्षमा कर दीजिए।”
    reason: यूनानी पांडुलिपियों में आधुनिक विराम-चिह्न नहीं हैं। ‘दयालु और करुणामय’ को क्षमा की विनती का संबोधन मानना आगामी आज्ञार्थक ‘क्षमा कर’ के साथ अधिक स्वाभाविक है, पर उन्हें पिछले वर्णन के साथ पढ़ना भी संभव है।
lexical_decisions:
- source_word: ἀέναον ... σύστασιν
  choice: सनातन व्यवस्था
  rationale: σύστασις यहाँ संसार की स्थायी संरचना या सुव्यवस्थित स्थिति को दर्शाता है; ‘व्यवस्था’ आधुनिक हिन्दी में अर्थ को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: διὰ τῶν ἐνεργουμένων
  choice: अपने कार्यों के द्वारा
  rationale: यह परमेश्वर के क्रियाशील कार्यों के माध्यम से प्रकट होने का भाव देता है; अत्यधिक शाब्दिक ‘कार्यरत बातों’ से बचा गया है।
- source_word: οἰκουμένην
  choice: सारी आबाद पृथ्वी
  rationale: शब्द का मूल अर्थ बसी हुई या आबाद दुनिया है, इसलिए इसे केवल ‘संसार’ कहकर κόσμος के साथ मिला नहीं दिया गया।
- source_word: ἑδράσαι
  choice: स्थिर करने
  rationale: क्रिया का अर्थ स्थापित, दृढ़ या स्थिर करना है; ‘स्थिर करने’ से सृष्ट वस्तुओं को कायम करने का भाव बना रहता है।
- source_word: ἀνομίας ... ἀδικίας ... παραπτώματα ... πλημμελείας
  choice: अधर्म के काम, अन्याय, अपराध और चूक
  rationale: 'चार अलग नैतिक पदों का भेद यथासंभव रखा गया है: व्यवस्था-विरोध, अन्याय, सीमा-लांघना और विफलता/चूक।'
theological_decisions:
- issue: ἐλεῆμον καὶ οἰκτίρμον का वाक्यगत संबंध
  choice: 'इन्हें क्षमा की प्रार्थना आरम्भ करनेवाला संबोधन माना गया: ‘हे दयालु और करुणामय परमेश्वर’'
  alternative: 'इन्हें पिछले वर्णन से जोड़ना: ‘आप पर भरोसा रखनेवालों के प्रति विश्वासयोग्य, दयालु और करुणामय हैं। हमारे…’'
  rationale: इन रूपों को संबोधन के रूप में समझना आगामी आज्ञार्थक ἄφες (‘क्षमा कर’) से उनका स्वाभाविक संबंध बनाता है और नवीनतम व्याकरणिक समीक्षा से मेल खाता है; फिर भी विराम-चिह्न मूल पांडुलिपि का निश्चित अंग नहीं है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: πιστὸς का अनुवाद
  choice: विश्वासयोग्य
  alternative: सच्चा
  rationale: दोनों प्रयोगों में परमेश्वर की भरोसेमंदी और निष्ठा प्रमुख है; ‘विश्वासयोग्य’ इस दोहराव को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। आदरसूचक ‘आप’ और विनम्र आज्ञार्थक ‘क्षमा कर दीजिए’ सामान्य हिन्दी पाठक के लिए सहज हैं। समानांतर विशेषणों और चार प्रकार के दोषों की सूची को स्रोत के अलंकारिक प्रवाह के अनुरूप बनाए रखा गया है।
