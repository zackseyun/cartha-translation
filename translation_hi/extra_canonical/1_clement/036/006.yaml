  language: en
  yaml_path: translation/extra_canonical/1_clement/036/006.yaml
  text: Who then are the enemies? The wicked and those who set themselves against his will[a].
translation:
  language: hi
  text: तो फिर शत्रु कौन हैं? वे जो दुष्ट हैं और उसकी इच्छा का विरोध करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φαῦλοι
  choice: दुष्ट
  rationale: यहाँ शब्द नैतिक रूप से बुरे लोगों को दर्शाता है; ‘दुष्ट’ आधुनिक हिन्दी में स्वाभाविक है और ‘नीच’ की सामाजिक अथवा अत्यधिक भावात्मक छाया से बचता है।
- source_word: ἀντιτασσόμενοι
  choice: विरोध करते हैं
  rationale: मध्यमवाच्य कृदन्त का अर्थ स्वयं को किसी के विरुद्ध खड़ा करना या उसका प्रतिरोध करना है; सहज हिन्दी में ‘विरोध करते हैं’ यही भाव स्पष्ट करता है।
- source_word: τῷ θελήματι αὐτοῦ
  choice: उसकी इच्छा का
  rationale: सम्प्रदान कारक यहाँ विरोध के लक्ष्य को व्यक्त करता है। सर्वनाम के संदर्भ को मूल की तरह अनिर्दिष्ट रखते हुए ‘उसकी’ चुना गया है।
theological_decisions:
- issue: क्या दोनों वर्णन अलग-अलग समूहों को दर्शाते हैं?
  choice: ‘वे जो दुष्ट हैं और उसकी इच्छा का विरोध करते हैं’—एक ही शत्रु-समूह के संयुक्त वर्णन के रूप में
  alternative: ‘दुष्ट लोग और वे लोग जो उसकी इच्छा का विरोध करते हैं’—दो समूहों के रूप में
  rationale: एक ही यूनानी लेख οἱ दोनों पदों पर शासन करता है, इसलिए इन्हें एक ही समूह के परस्पर जुड़े वर्णन के रूप में प्रस्तुत करना अधिक उपयुक्त है।
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसकी’
  alternative: संदर्भित व्यक्ति या परमेश्वर का नाम स्पष्ट रूप से जोड़ना
  rationale: इस पद में सर्वनाम का पूर्वपद स्वयं नहीं दिया गया; अनुवाद मूल की संदर्भ-निर्भरता को बनाए रखता है और व्याख्यात्मक स्पष्टता नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। प्रश्नोत्तर की वाक्य-रचना तथा मूल का नैतिक बल सुरक्षित रखा गया है।
