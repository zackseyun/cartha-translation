base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/004.yaml
  text: 'But concerning his Son[a], the Master spoke thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance,

    and the ends of the earth as your possession.”'
translation:
  language: hi
  text: 'परन्तु उसके पुत्र के विषय में स्वामी ने इस प्रकार कहा:


    “तू मेरा पुत्र है;

    आज मैंने तुझे जन्म दिया है।

    मुझसे माँग, और मैं राष्ट्रों को तेरी विरासत,

    और पृथ्वी के छोरों को तेरी सम्पत्ति कर दूँगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  choice: स्वामी
  rationale: यह परमेश्वर के अधिकार और प्रभुता को व्यक्त करने वाला संबोधन है; निकटवर्ती प्रसंग के अनुरूप इसे स्पष्ट रूप से रखा गया है।
- source_word: γεγέννηκά
  choice: जन्म दिया है
  rationale: यूनानी पूर्णकाल की स्वाभाविक हिन्दी अभिव्यक्ति है और मूल के पुत्रत्व-संबंधी कथन को बिना अतिरिक्त व्याख्या के सुरक्षित रखती है।
- source_word: ἔθνη
  choice: जाति-जाति के लोग
  rationale: यहाँ आशय केवल भौगोलिक राष्ट्रों से नहीं, विभिन्न जनसमुदायों से है; यह पद सामान्य पाठक के लिए स्वाभाविक है।
- source_word: κληρονομίαν
  choice: विरासत
  rationale: उत्तराधिकार में प्राप्त अंश की मूल धारणा को बनाए रखता है।
- source_word: κατάσχεσιν
  choice: सम्पत्ति
  rationale: अधिकार में रखी हुई वस्तु या भूभाग का अर्थ सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भजन के उद्धरण में पुत्र का जन्म
  choice: “आज मैंने तुझे जन्म दिया है” का सीधा अनुवाद
  alternative: इसे नियुक्ति, राज्याभिषेक या अनन्त उत्पत्ति के रूप में व्याख्यायित करना
  rationale: मूल पाठ स्वयं इन धर्मवैज्ञानिक व्याख्याओं में से किसी एक को स्पष्ट नहीं करता; इसलिए उसकी वास्तविक व्याख्यात्मक गुंजाइश सुरक्षित रखी गई है।
- issue: उद्धरण का वक्ता
  choice: “स्वामी ने ... कहा”
  alternative: निर्वैयक्तिक रूप में “ऐसा लिखा है” या “यह कहा गया है”
  rationale: εἶπεν ὁ δεσπότης में वक्ता के रूप में ‘स्वामी’ स्पष्ट है; इसे छोड़ना मूल कथन का महत्त्वपूर्ण अंश खो देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और वाचनयोग्य शैली रखी गई है। उद्धरण में ‘तू/तुझे/तेरी’ का प्रयोग एकवचन निकट संबोधन और पारंपरिक शास्त्रीय गरिमा दोनों को व्यक्त करता है।
