source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τούτου ἀτενίζομεν εἰς τὰ ὕψη τῶν οὐρανῶν, διὰ τούτου ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ, διὰ τούτου ἠνεῴχθησαν ἡμῶν οἱ ὀφθαλμοὶ τῆς καρδίας, διὰ τούτου ἡ ἀσύνετος καὶ ἐσκοτωμένη διάνοια ἡμῶν ἀναθάλλει εἰς τὸ φῶς, διὰ τούτου ἠθέλησεν ὁ δεσπότης τῆς ἀϑανάτου γνώσεως ἡμᾶς γεύσασϑαι, ὃς ὢν ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ, τοσούτῳ μείζων ἐστὶν ἀγγέλων, ὅσῳ διαφορώτερον ὄνομα κεκληρονόμηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/002.yaml
  text: Through him we fix our gaze on the heights of the heavens; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.
translation:
  language: hi
  text: उसी के द्वारा हम स्वर्ग की ऊँचाइयों की ओर टकटकी लगाए देखते हैं; उसी के द्वारा हम दर्पण में मानो उसके निष्कलंक और सर्वोच्च स्वरूप का दर्शन करते हैं; उसी के द्वारा हमारे हृदय की आँखें खोली गईं; उसी के द्वारा हमारी नासमझ और अंधकारमय समझ प्रकाश में खिल उठती है; उसी के द्वारा अमर ज्ञान के स्वामी ने चाहा कि हम उसका स्वाद चखें—वही, जो उसकी महिमा की प्रभा है, स्वर्गदूतों से उतना ही महान है, जितना कि उसे अधिक उत्कृष्ट नाम विरासत में मिला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίζομεν
  choice: टकटकी लगाए देखते हैं
  rationale: क्रिया के एकाग्र और स्थिर दृष्टि से देखने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνοπτριζόμεθα
  choice: दर्पण में मानो ... दर्शन करते हैं
  rationale: दर्पण में देखने या प्रतिबिंब निहारने का यूनानी बिंब बनाए रखता है; ‘मानो’ उस अप्रत्यक्ष दर्शन को स्पष्ट करता है।
- source_word: ὄψιν
  choice: मुख
  rationale: यहाँ परमेश्वर के दिखाई देने वाले रूप या मुखमंडल का अर्थ है; ‘मुख’ पद की गरिमा और संक्षिप्तता बनाए रखता है।
- source_word: ἀναθάλλει
  choice: फिर से खिल उठती है
  rationale: मूल के पुनः अंकुरित होने या खिलने के सजीव रूपक को सुरक्षित रखता है।
- source_word: δεσπότης
  choice: स्वामी
  rationale: अधिकार-संपन्न प्रभु या मालिक का भाव देता है और आधुनिक हिन्दी में गरिमापूर्ण है।
- source_word: ἀπαύγασμα
  choice: ज्योति
  rationale: किसी महिमा से निकलने वाली दीप्ति या तेज का भाव सहज हिन्दी में देता है; ‘प्रतिबिंब’ की अपेक्षा प्रकाश-संबंधी अर्थ को प्राथमिकता दी गई है।
- source_word: κεκληρονόμηκεν
  choice: विरासत में मिला है
  rationale: संपूर्णकालिक क्रिया और उत्तराधिकार में प्राप्त नाम—दोनों भावों को सीधे बनाए रखता है।
theological_decisions:
- issue: αὐτοῦ के संदर्भ और मसीह तथा स्वामी के बीच संबंध
  choice: ‘उसके/उसकी’ सर्वनाम बनाए रखे गए और बाद के ὃς को ‘वही’ से मसीह की ओर जोड़ा गया
  alternative: हर सर्वनाम के स्थान पर ‘परमेश्वर’ या ‘मसीह’ स्पष्ट करना
  rationale: मूल में सर्वनामात्मक संदर्भ है; नाम जोड़ने से निहित संबंध की व्याख्या अधिक निश्चित हो जाती। ‘वही’ व्याकरणिक प्रवाह स्पष्ट करता है पर अतिरिक्त सिद्धांत नहीं जोड़ता।
- issue: ἀθανάτου γνώσεως का अर्थ
  choice: अमर ज्ञान
  alternative: अमरता का ज्ञान / अविनाशी ज्ञान
  rationale: 'सम्बन्धकारक विशेषण की वास्तविक अस्पष्टता बनाए रखी गई है: ज्ञान स्वयं अमर हो सकता है अथवा अमरता से संबंधित हो सकता है।'
- issue: इब्रानियों 1:3–4 से निकट उद्धरणात्मक भाषा
  choice: ‘महिमा की ज्योति’, ‘स्वर्गदूतों से ... महान’, और ‘श्रेष्ठ नाम ... विरासत में मिला’ के रूप में मूल वाक्य-संबंध सुरक्षित रखा
  alternative: प्रचलित किसी एक हिन्दी बाइबल अनुवाद की निश्चित शब्दावली अपनाना
  rationale: मूल यूनानी साक्ष्य को प्राथमिक रखा गया और किसी परंपरा-विशेष के सूत्रीकरण को नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। बार-बार आने वाले διὰ τούτου को ‘उसी के द्वारा’ के रूप में दोहराकर मूल की आलंकारिक लय रखी गई है। लंबे यूनानी वाक्य को अंतिम मुख्य कथन से पहले पूर्णविराम देकर हिन्दी में स्पष्ट किया गया है, जबकि अर्थ-संबंध सुरक्षित है।
