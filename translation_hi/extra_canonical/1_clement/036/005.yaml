  text: καὶ πάλιν λέγει πρὸς αὐτόν· Κάϑου ἐκ δεξιῶν μου, ἕως ἂν ϑῶ τοὺς ἐχϑρούς σου ὑποπόδιον τῶν ποδῶν σου.
