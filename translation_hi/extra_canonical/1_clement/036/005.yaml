base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/005.yaml
  text: 'And again he says to him:

    “Sit at my right hand,

    until I make your enemies a footstool for your feet.”'
translation:
  language: hi
  text: 'और फिर वह उससे कहता है:


    “मेरे दाहिने बैठ,

    जब तक कि मैं तेरे शत्रुओं को

    तेरे पाँवों की चौकी न बना दूँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κάϑου ἐκ δεξιῶν μου
  choice: मेरे दाहिने बैठ
  rationale: ग्रीक मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; अधिकार और सम्मान के स्थान का संकेत बना रहता है।
- source_word: ἕως ἂν ϑῶ
  choice: जब तक कि मैं … न बना दूँ
  rationale: अनिश्चित भविष्य तक की अवधि और क्रिया के परिणामी भाव, दोनों को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: तेरे पाँवों की चौकी
  rationale: मूल रूपक को सीधे सुरक्षित रखता है और हिन्दी बाइबलीय शैली में सहज है।
theological_decisions:
- issue: वक्ता और संबोधित व्यक्ति की पहचान
  choice: 'सर्वनामों को मूल के समान अनिर्दिष्ट रखा गया: “वह उससे कहता है”'
  alternative: नाम जोड़कर वक्ता को परमेश्वर और संबोधित को मसीह बताना
  rationale: इस पद के ग्रीक पाठ में नाम स्पष्ट नहीं हैं; व्याख्यात्मक पहचान को मुख्य पाठ में जोड़ना उचित नहीं।
- issue: दाहिनी ओर बैठने का रूपक
  choice: “मेरे दाहिने बैठ” के रूप में ज्यों का त्यों रखा
  alternative: “मेरे सम्मान के स्थान पर बैठ” जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: मूल की राजकीय और धर्मशास्त्रीय प्रतिमा को बिना संकुचित किए सुरक्षित रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुरूप काव्य-पंक्ति विन्यास। संबोधन में “तेरे” रखा गया है, क्योंकि यह प्राचीन प्रत्यक्ष वचन की गंभीर शैली में स्वाभाविक है और ग्रीक एकवचन को स्पष्ट करता है।
