  text: γέγραπται γὰρ οὕτως· ‘Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/003.yaml
  text: 'For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”'
translation:
  language: hi
  text: 'क्योंकि इस प्रकार लिखा है:


    “वह अपने स्वर्गदूतों को हवाएँ बनाता है,


    और अपने सेवकों को आग की ज्वाला।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: यहाँ शब्द का सामान्य अर्थ परमेश्वर के स्वर्गीय दूत हैं; ‘स्वर्गदूत’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: πνεύματα
  choice: पवन
  rationale: πνεῦμα का अर्थ ‘आत्माएँ’ या ‘पवन’ हो सकता है। उद्धृत भजन के काव्यात्मक समानांतर में ‘आग की ज्वाला’ के साथ प्राकृतिक शक्ति ‘पवन’ उपयुक्त है, जबकि मूल की अर्थ-संभावना को टिप्पणी में स्वीकार किया गया है।
- source_word: λειτουργοὺς
  choice: सेवकों
  rationale: यह शब्द आधिकारिक या उपासना-संबंधी सेवा करने वालों को सूचित कर सकता है; ‘सेवकों’ से आशय सहज और गरिमापूर्ण ढंग से व्यक्त होता है।
- source_word: πυρὸς φλόγα
  choice: आग की ज्वाला
  rationale: यूनानी पद का सीधा, स्वाभाविक और काव्यात्मक हिन्दी रूप।
theological_decisions:
- issue: πνεύματα की अर्थगत अस्पष्टता
  choice: पवन
  alternative: आत्माएँ
  rationale: भजन 104:4 के उद्धरण में ‘पवन’ और ‘आग की ज्वाला’ का समानांतर अधिक स्वाभाविक है। फिर भी यूनानी शब्द में ‘आत्माएँ’ का अर्थ संभव है, इसलिए इस वैकल्पिक समझ को अस्वीकार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और उद्धरण की काव्यात्मक पंक्ति-विन्यास को बनाए रखने वाला अनुवाद। ‘इस प्रकार लिखा है’ ने γέγραπται γὰρ οὕτως की औपचारिक उद्धरण-भूमिका सुरक्षित रखी है।
