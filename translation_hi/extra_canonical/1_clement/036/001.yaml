source:
  edition: Funk 1901 (normalized OCR)
  text: Αὕτη ἡ ὁδός, ἀγαπητοί, ἐν ᾗ εὕρομεν τὸ σωτήριον ἡμῶν, Ἰησοῦν Χριστόν, τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν, τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/001.yaml
  text: 'This is the way, beloved, in which we found our salvation: Jesus Christ, the high priest of our offerings, the protector and helper of our weakness.'
translation:
  language: hi
  text: 'यही वह मार्ग है, प्रिय जनो, जिसमें हमने अपना उद्धार पाया है: यीशु मसीह को, जो हमारी भेंटों के महायाजक और हमारी दुर्बलता के रक्षक और सहायक हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδός
  choice: मार्ग
  rationale: यह शब्द मूल के रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τὸ σωτήριον ἡμῶν
  choice: अपने उद्धार
  rationale: σωτήριον यहाँ व्यक्तिवाचक रूप से यीशु मसीह के साथ समानाधिकरण में है; ‘उद्धार’ इस अर्थ और आगे आने वाली पहचान—‘यीशु मसीह को’—दोनों को सुरक्षित रखता है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: यह यहूदी उपासना और याजकीय पृष्ठभूमि से जुड़ा स्थापित तथा सटीक हिन्दी पद है।
- source_word: προσφορῶν
  choice: भेंटों
  rationale: ‘भेंट’ προσφορά के धार्मिक अर्पण-संबंधी अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है, बिना हर प्रसंग में रक्तबलि का अर्थ आरोपित किए।
- source_word: προστάτην
  choice: रक्षक
  rationale: इस प्रसंग में संरक्षण और पक्ष-समर्थन का भाव है; ‘रक्षक’ सामान्य पाठक के लिए स्पष्ट है और अगले शब्द ‘सहायक’ से अलग अर्थ बनाए रखता है।
- source_word: ἀσθενείας
  choice: दुर्बलता
  rationale: यह शारीरिक रोग तक सीमित न रहकर मानवीय कमजोरी की व्यापकता को बनाए रखता है।
theological_decisions:
- issue: τὸ σωτήριον ἡμῶν और Ἰησοῦν Χριστόν का संबंध
  choice: ‘अपने उद्धार को पाया है—यीशु मसीह को’
  alternative: ‘अपने उद्धारकर्ता यीशु मसीह को पाया है’
  rationale: मूल पाठ यीशु मसीह को सीधे ‘हमारा उद्धार’ कहता है; ‘उद्धारकर्ता’ अर्थ को समझाता तो है, पर मूल के समानाधिकरण और उसके धार्मिक तनाव को बदल देता है।
- issue: Χριστόν का हिन्दी रूप
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘यीशु मसीह’ आधुनिक मानक हिन्दी में स्वाभाविक और व्यापक रूप से पहचाना जाने वाला रूप है। यहाँ यूनानी पद को विशेष रूप से ‘अभिषिक्त जन’ समझाकर प्रस्तुत करने वाला कोई संदर्भ-संकेत नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन के लिए ‘प्रिय जनो’ अपनाया गया है। डैश मूल के समानाधिकरण को स्पष्ट करता है, जबकि वाक्य को अनावश्यक व्याख्या से बचाता है।
