source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ εἶπεν· Ἐλεεῖτε, ἵνα ἐλεηθῆτε· ἀφίετε, ἵνα ἀφεθῇ ὑμῖν· ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν· ὡς δίδοτε, οὕτως δοθήσεται ὑμῖν· ὡς κρίνετε, οὕτως κριθήσεσθε· ὡς χρηστεύεσθε, οὕτως χρηστευθήσεται ὑμῖν· ᾧ μέτρῳ μετρεῖτε, ἐν αὐτῷ μετρηθήσεται ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/002.yaml
  text: 'For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that you may be forgiven. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.”'
translation:
  language: hi
  text: 'क्योंकि उसने इस प्रकार कहा: “दया करो, ताकि तुम पर दया की जाए। क्षमा करो, ताकि तुम्हें क्षमा किया जाए। जैसा तुम करते हो, वैसा ही तुम्हारे साथ किया जाएगा। जैसा तुम देते हो, वैसा ही तुम्हें दिया जाएगा। जैसा तुम न्याय करते हो, वैसा ही तुम्हारा न्याय किया जाएगा। जैसी भलाई तुम करते हो, वैसी ही तुम्हारे साथ भलाई की जाएगी। जिस माप से तुम मापते हो, उसी माप से तुम्हें मापा जाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεεῖτε / ἐλεηθῆτε
  choice: दया करो / तुम पर दया की जाए
  rationale: क्रिया के सक्रिय और कर्मवाच्य रूपों को स्पष्ट रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ἀφίετε / ἀφεθῇ ὑμῖν
  choice: क्षमा करो / तुम्हें क्षमा किया जाए
  rationale: इस प्रसंग में ἀφίημι का अर्थ अपराध क्षमा करना है; कर्मवाच्य संरचना भी सुरक्षित रखी गई है।
- source_word: κρίνετε / κριθήσεσθε
  choice: न्याय करते हो / तुम्हारा न्याय किया जाएगा
  rationale: κρίνω की न्याय या निर्णय करने की अर्थ-सीमा को अनावश्यक रूप से ‘दोष लगाना’ तक सीमित नहीं किया गया।
- source_word: χρηστεύεσθε / χρηστευθήσεται
  choice: भलाई करते हो / तुम्हारे साथ भलाई की जाएगी
  rationale: दुर्लभ यूनानी क्रिया का भाव दयालु और भला व्यवहार करना है; आधुनिक हिन्दी में ‘भलाई करना’ सहज और व्यापक है।
- source_word: ᾧ μέτρῳ μετρεῖτε
  choice: जिस माप से तुम मापते हो
  rationale: माप के रूपक और यूनानी पुनरुक्ति को यथासंभव बनाए रखा गया है।
theological_decisions:
- issue: कथन में कर्म और प्रत्युत्तर का संबंध
  choice: ‘जैसा… वैसा…’ और उद्देश्यसूचक ‘ताकि’ को मूल के अनुसार रखा गया
  alternative: इसे केवल सामान्य नैतिक संभावना या सीधे उद्धार-सिद्धांत की व्याख्या के रूप में प्रस्तुत करना
  rationale: पाठ प्रतिफल का प्रबल संबंध व्यक्त करता है, पर उसके सैद्धांतिक तंत्र की व्याख्या नहीं करता; इसलिए तनाव को बिना विस्तार दिए सुरक्षित रखा गया है।
- issue: अप्रत्यक्ष कर्मकर्ता वाले कर्मवाच्य
  choice: ‘दया की जाए’, ‘क्षमा किया जाए’, ‘दिया जाएगा’ जैसी कर्मवाच्य अभिव्यक्तियाँ
  alternative: हर स्थान पर ‘परमेश्वर’ को स्पष्ट कर्ता बनाना
  rationale: यूनानी पाठ कर्मकर्ता का नाम नहीं बताता। सम्भावित ईश्वरीय कर्मवाच्य को स्पष्ट ‘परमेश्वर’ जोड़कर निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण बहुवचन ‘तुम’ और सरल किंतु गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। उद्धरण की समानांतर लय तथा कर्मवाच्य संरचनाएँ मूल के निकट रखी गई हैं।
