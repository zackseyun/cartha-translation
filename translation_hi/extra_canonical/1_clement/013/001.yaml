source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονήσωμεν οὖν, ἀδελφοί, ἀποθέμενοι πᾶσαν ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς, καὶ ποιήσωμεν τὸ γεγραμμένον (λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον· Μὴ καυχάσθω ὁ σοφὸς ἐν τῇ σοφίᾳ αὐτοῦ μηδὲ ὁ ἰσχυρὸς ἐν τῇ ἰσχύϊ αὐτοῦ μηδὲ ὁ πλούσιος ἐν τῷ πλούτῳ αὐτοῦ, ἀλλ’ ἢ ὁ καυχώμενος ἐν κυρίῳ καυχάσθω, τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην), μάλιστα μεμνημένοι τῶν λόγων τοῦ κυρίου Ἰησοῦ, οὓς ἐλάλησεν διδάσκων ἐπιείκειαν καὶ μακροθυμίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
translation:
  language: hi
  text: इसलिए, हे भाइयो, हम मन से नम्र बनें, और हर प्रकार की डींगमारने की प्रवृत्ति, घमंड, मूर्खता और क्रोध के आवेश को दूर कर दें। और जो लिखा है, उसे करें; क्योंकि पवित्र आत्मा कहता है, “बुद्धिमान अपनी बुद्धि पर घमंड न करे, न बलवान अपने बल पर, और न धनी अपने धन पर; बल्कि जो घमंड करे, वह प्रभु में घमंड करे, उसकी खोज करने और न्याय तथा धार्मिकता करने के लिए।” विशेषकर हम प्रभु यीशु के उन वचनों को याद रखें, जो उन्होंने कोमलता और धीरज की शिक्षा देते हुए कहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  choice: हम दीन बनें
  rationale: यह क्रिया केवल बाहरी विनम्र व्यवहार नहीं, बल्कि अपने विषय में नम्र सोच और दीनता अपनाने का आह्वान करती है।
- source_word: τύφος
  choice: अहंकार
  rationale: यह आत्म-महत्त्व और फूले हुए अभिमान को सूचित करता है; निकटवर्ती ἀλαζονείαν से भेद बनाए रखने के लिए इसे ‘अहंकार’ कहा गया है।
- source_word: ὀργάς
  choice: क्रोध का प्रकोप
  rationale: बहुवचन रूप क्रोध की घटनाओं या उग्र अभिव्यक्तियों की ओर संकेत करता है, इसलिए केवल ‘क्रोध’ से अधिक विशिष्ट अनुवाद चुना गया।
- source_word: ποιήσωμεν τὸ γεγραμμένον
  choice: जो लिखा है, हम उसका पालन करें
  rationale: शाब्दिक ‘लिखी हुई बात को करें’ के आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κρίμα καὶ δικαιοσύνην
  choice: न्याय तथा धार्मिकता के काम
  rationale: κρίμα का मूल न्याय/न्यायपूर्ण निर्णय और δικαιοσύνη का धार्मिकता/सही आचरण का अर्थ सुरक्षित है; ‘काम’ हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: ἐπιείκειαν
  choice: नम्रता
  rationale: संदर्भ में यह कठोरता के विपरीत कोमल, उदार और संयत व्यवहार है; सामान्य पाठक के लिए ‘नम्रता’ सहज है, यद्यपि इसका अर्थ केवल विनय तक सीमित नहीं।
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: यह उकसावे और कठिनाई के बीच दीर्घकाल तक सहने की वृत्ति है; ‘धीरज’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην की उद्धरण-सीमा
  choice: वाक्यांश को पवित्र आत्मा द्वारा कहे गए शास्त्रीय उद्धरण के भीतर रखा गया है।
  alternative: उद्धरण को ‘प्रभु पर घमंड करे’ के बाद समाप्त करके इस वाक्यांश को क्लेमेंट की बाहरी टिप्पणी मानना।
  rationale: यूनानी वाक्य-संरचना इसे λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον द्वारा आरम्भ कथन की सामग्री में रखती है; उपलब्ध संशोधन-साक्ष्य भी इसी सीमा की पुष्टि करता है।
- issue: τὸ πνεῦμα τὸ ἅγιον का लिंग
  choice: ‘पवित्र आत्मा कहता है’
  alternative: ‘पवित्र आत्मा कहती है’ या लिंग-निरपेक्ष पुनर्रचना।
  rationale: मानक हिन्दी मसीही प्रयोग में ‘आत्मा’ के लिए पुल्लिंग क्रिया प्रचलित है; इससे मूल पाठ के आशय में कोई अतिरिक्त व्यक्तित्व-सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण और सामुदायिक उपदेश की गरिमा वाला स्वर। ‘हे भाइयो’ से प्रत्यक्ष सम्बोधन सुरक्षित रखा गया है। वाक्य को पठनीय बनाने के लिए विभाजित किया गया है, पर कारणसूचक और उद्धरणात्मक संबंध बनाए रखे गए हैं।
