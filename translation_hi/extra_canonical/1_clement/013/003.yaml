source:
  edition: Funk 1901 (normalized OCR)
  text: ταύτῃ τῇ ἐντολῇ καὶ τοῖς παραγγέλμασι τούτοις στηρίξωμεν ἑαυτοὺς εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας τοῖς ἁγιοπρεπέσι λόγοις αὐτοῦ, ταπεινοφρονοῦντες· φησὶν γὰρ ὁ ἅγιος λόγος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/003.yaml
  text: 'By this command and these injunctions let us strengthen ourselves to walk as those who are obedient to his holy words[a], being humble-minded. For the holy word says:'
translation:
  language: hi
  text: 'इस आज्ञा और इन निर्देशों के द्वारा हम अपने आपको दृढ़ करें, ताकि हम नम्र-चित्त होकर उसके पवित्रता के अनुरूप वचनों के आज्ञाकारी बनकर चलें[a]। क्योंकि पवित्र वचन कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पवित्र वचनों के आज्ञाकारी।”
    reason: ἁγιοπρεπέσι का सामान्य और अधिक सहज अनुवाद ‘पवित्र’ हो सकता है; मुख्य पाठ में ‘पवित्रता के अनुरूप’ संयुक्त विशेषण की विशिष्ट अर्थछाया को बनाए रखता है।
lexical_decisions:
- source_word: ταύτῃ τῇ ἐντολῇ καὶ τοῖς παραγγέλμασι τούτοις
  choice: इस आज्ञा और इन निर्देशों के द्वारा
  rationale: ἐντολή को ‘आज्ञा’ और παραγγέλματα को ‘निर्देश’ कहने से दोनों निकटवर्ती, पर अलग, शब्दों का भेद बना रहता है; करणवाचक रूप ταύτῃ ... καὶ τοῖς ... को ‘के द्वारा’ व्यक्त करता है।
- source_word: στηρίξωμεν ἑαυτούς
  choice: हम अपने आपको दृढ़ करें
  rationale: ग्रीक के आग्रहसूचक प्रथम पुरुष बहुवचन और आत्मवाचक सर्वनाम, दोनों को सीधे सुरक्षित रखता है।
- source_word: εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας
  choice: ताकि हम ... आज्ञाकारी बनकर चलें
  rationale: πορεύεσθαι का गतिशील रूप ‘चलें’ और ὑπηκόους ὄντας की अवस्था ‘आज्ञाकारी बनकर’ के रूप में व्यक्त होती है।
- source_word: τοῖς ἁγιοπρεπέσι λόγοις αὐτοῦ
  choice: उसके उन वचनों के ... जो पवित्रता के अनुरूप हैं
  rationale: ἁγιοπρεπής संयुक्त विशेषण का विशिष्ट भाव ‘पवित्रता के अनुरूप/शोभनीय’ है; केवल ‘पवित्र’ कहने की अपेक्षा यह स्रोत की सूक्ष्मता को अधिक स्पष्ट रखता है।
- source_word: ταπεινοφρονοῦντες
  choice: दीन मन रखते हुए
  rationale: यह विनम्र मानसिक वृत्ति को दर्शाता है; ‘दीन मन’ आधुनिक धार्मिक हिन्दी में बोधगम्य और गरिमापूर्ण है।
- source_word: φησὶν γὰρ ὁ ἅγιος λόγος
  choice: क्योंकि पवित्र वचन कहता है
  rationale: ὁ ἅγιος λόγος को व्यक्तिवाचक विस्तार दिए बिना यथासंभव औपचारिक रूप में रखा गया है।
theological_decisions:
- issue: ἁγιοπρεπέσι का अर्थ
  choice: जो पवित्रता के अनुरूप हैं
  alternative: पवित्र वचन
  rationale: विशेषण को सामान्य ‘पवित्र’ में समेटने के बजाय उसकी ‘पवित्रता के योग्य/अनुरूप’ वाली अर्थछाया सुरक्षित रखी गई है; फुटनोट अधिक सहज वैकल्पिक अनुवाद बताता है।
- issue: ὁ ἅγιος λόγος का संकेत
  choice: पवित्र वचन
  alternative: पवित्र शास्त्र
  rationale: ग्रीक में λόγος है, γραφή नहीं; इसलिए इसे सीधे ‘शास्त्र’ बनाकर संदर्भ की पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामूहिक उपदेशात्मक शैली रखी गई है। ‘हम ... करें’ से ग्रीक hortatory subjunctive और ‘दीन मन रखते हुए’ से सहभागी क्रिया का संबंध सुरक्षित है।
