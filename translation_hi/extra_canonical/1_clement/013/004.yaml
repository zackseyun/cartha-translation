  text: Ἐπὶ τίνα ἐπιβλέψω, ἀλλ’ ἢ ἐπὶ τὸν πρᾶον καὶ ἡσύχιον καὶ τρέμοντά μου τὰ λόγια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/004.yaml
  text: “Upon whom shall I look[a], except upon the one who is gentle and quiet and trembles at my words?”
translation:
  language: hi
  text: “मैं किस पर दृष्टि करूँ[a], सिवाय उस व्यक्ति के जो नम्र और शांत है और मेरे वचनों से काँपता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं किसकी ओर ध्यान दूँ।”
    reason: ἐπιβλέψω केवल देखने के बजाय किसी पर ध्यान देने या अनुकूल दृष्टि रखने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἐπιβλέψω
  choice: दृष्टि करूँगा
  rationale: यह क्रिया किसी पर ध्यानपूर्वक या कृपापूर्वक दृष्टि करने का भाव रखती है; ‘दृष्टि करना’ मूल रूपक को बनाए रखते हुए गरिमापूर्ण और स्वाभाविक है।
- source_word: πρᾶον
  choice: नम्र
  rationale: यहाँ शब्द कोमलता और अहंकाररहित स्वभाव बताता है; ‘नम्र’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ἡσύχιον
  choice: शांत
  rationale: यह शांत, स्थिर अथवा अशांत न होने वाले स्वभाव को व्यक्त करता है; ‘शांत’ सबसे सहज समतुल्य है।
- source_word: τρέμοντά μου τὰ λόγια
  choice: मेरे वचनों से काँपता है
  rationale: यूनानी में भय और श्रद्धापूर्ण गंभीरता की सशक्त शारीरिक उपमा है; ‘काँपता है’ उस तनाव को बिना नरम किए सुरक्षित रखता है।
theological_decisions:
- issue: तीनों गुणों का एक ही व्यक्ति से संबंध
  choice: ‘जो नम्र और शांत है और मेरे वचनों से काँपता है’
  alternative: ‘नम्र और शांत जन पर, और उस पर जो मेरे वचनों से काँपता है’
  rationale: एकवचन पुल्लिंग कर्मकारक लेख τὸν तीनों समन्वित वर्णनों—πρᾶον, ἡσύχιον और τρέμοντα—को नियंत्रित करता है, इसलिए ये एक ही व्यक्ति के गुण हैं।
- issue: ἐπιβλέπω में निहित दृष्टि का स्वरूप
  choice: दृष्टि करना
  alternative: कृपादृष्टि करना / ध्यान देना
  rationale: मूल क्रिया का अर्थ संदर्भ में अनुकूल ध्यान हो सकता है, पर केवल ‘कृपादृष्टि’ कहने से व्याख्या अधिक निश्चित हो जाती; इसलिए मूल की व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और शास्त्रीय भाव वाली भाषा अपनाई गई है। ‘वचनों’ मूल के बहुवचन τὰ λόγια को सुरक्षित रखता है। एक ही व्यक्ति से जुड़े तीनों गुणों की यूनानी व्याकरणिक एकता स्पष्ट रखी गई है।
