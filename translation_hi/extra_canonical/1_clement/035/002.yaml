base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/002.yaml
  text: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness; and all these things fall under our understanding.
translation:
  language: hi
  text: अमरता में जीवन, धार्मिकता में तेज, निर्भीकता में सत्य, दृढ़ भरोसे में विश्वास और पवित्रता में आत्म-संयम; और ये सभी बातें हमारी समझ के दायरे में थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴ ἐν ἀθανασίᾳ
  choice: अमरता में जीवन
  rationale: यूनानी संज्ञात्मक पदबंध और ἐν की संरचना को संक्षिप्त तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λαμπρότης ἐν δικαιοσύνῃ
  choice: धार्मिकता में तेज
  rationale: λαμπρότης की चमक, महिमा और वैभव की अर्थ-छाया के लिए ‘तेज’ गरिमापूर्ण और संक्षिप्त है; δικαιοσύνη के लिए प्रचलित बाइबिलीय ‘धार्मिकता’ रखा गया है।
- source_word: ἀλήθεια ἐν παρρησίᾳ
  choice: निर्भीकता में सत्य
  rationale: παρρησία में खुलेपन, साहस और बेझिझक बोलने की भाव-छाया है; ‘निर्भीकता’ इस सूची में अनावश्यक व्याख्या जोड़े बिना मुख्य अर्थ व्यक्त करती है।
- source_word: πίστις ἐν πεποιθήσει
  choice: दृढ़ भरोसे में विश्वास
  rationale: 'πίστις और πεποίθησις के निकट संबंध के साथ उनका भेद भी रखता है: पहला ‘विश्वास’, दूसरा आश्वस्त और दृढ़ भरोसा।'
- source_word: ἐγκράτεια ἐν ἁγιασμῷ
  choice: पवित्रता में आत्म-संयम
  rationale: ἐγκράτεια का अर्थ अपने ऊपर नियंत्रण है, जबकि ἁγιασμός यहाँ पवित्रता/पवित्रीकरण दोनों की छाया रख सकता है; सूची के संज्ञात्मक रूप में ‘पवित्रता’ अधिक स्वाभाविक है।
- source_word: ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν
  choice: ये सभी बातें हमारी समझ के दायरे में थीं
  rationale: शाब्दिक ‘हमारी समझ के नीचे आती थीं’ हिन्दी में अस्वाभाविक है। ‘समझ के दायरे में’ ὑποπίπτω के ‘अधीन/पहुंच के भीतर आना’ और διάνοια के ‘मन/समझ’ को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ἁγιασμός को अवस्था या प्रक्रिया के रूप में प्रस्तुत करना
  choice: पवित्रता
  alternative: पवित्रीकरण
  rationale: समानांतर अमूर्त संज्ञाओं की सूची में ‘पवित्रता’ स्वाभाविक है, जबकि ‘पवित्रीकरण’ किसी विशिष्ट प्रक्रियात्मक धर्मशास्त्रीय अर्थ को आवश्यकता से अधिक प्रमुख कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त और संज्ञात्मक समानांतरता वाला रूप अपनाया गया है। पाँचों पदों में ‘में’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि यूनानी अलंकारिक संरचना सुनाई दे।
