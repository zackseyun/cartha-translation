source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ δὲ ἐμίσησας παιδείαν καὶ ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω. εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ, καὶ μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις. τὸ στόμα σου ἐπλεόνασεν κακίαν, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα. καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις, καὶ κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/008.yaml
  text: Yet you hated discipline[a], and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with adulterers. Your mouth overflowed with evil, and your tongue was weaving deceit. Sitting, you were slandering your brother[b], and against your mother's son you were laying a stumbling block.
translation:
  language: hi
  text: पर तूने शिक्षा[a] से बैर रखा और मेरे वचनों को अपनी पीठ पीछे फेंक दिया। जब तू किसी चोर को देखता, तो उसके साथ जा मिलता था, और किसी व्यभिचारी के साथ अपना हिस्सा बाँटता था। तेरे मुँह से बुराई उमड़ती रही, और तेरी जीभ छल बुनती रही। तू बैठकर अपने भाई की निन्दा करता था, और अपनी माँ के बेटे के विरुद्ध ठोकर की बाधा डालता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुशासन।”
    reason: παιδεία शिक्षा, सुधार और अनुशासन—इन परस्पर जुड़े अर्थों को व्यक्त कर सकता है।
  - marker: b
    text: या, “फंदा।”
    reason: σκάνδαλον ठोकर खिलाने वाली बाधा का अर्थ रखता है और कुछ संदर्भों में फँसाने वाले फंदे का बिंब भी दे सकता है।
lexical_decisions:
- source_word: παιδείαν
  choice: शिक्षा
  rationale: यह शब्द शिक्षा, सुधार और अनुशासन के व्यापक अर्थ रखता है; मुख्य पाठ में सहज ‘शिक्षा’ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
- source_word: συνέτρεχες αὐτῷ
  choice: उसके साथ जा मिलता था
  rationale: शाब्दिक अर्थ ‘उसके साथ दौड़ता था’ है, पर प्रसंग में आशय चोर का साथ देने या उससे जा मिलने का है।
- source_word: μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
  choice: किसी व्यभिचारी के साथ अपना हिस्सा बाँटता था
  rationale: μοιχοῦ व्याकरणतः एकवचन है और सामान्य वर्ग के एक व्यक्ति को सूचित करता है; ‘किसी व्यभिचारी’ इसे हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- source_word: περιέπλεκεν δολιότητα
  choice: छल बुनती रही
  rationale: περιπλέκω में लपेटने या गूँथने का चित्र है; ‘छल बुनना’ उस रूपक और अपूर्ण भूतकाल की जारी क्रिया दोनों को बचाता है।
- source_word: σκάνδαλον
  choice: ठोकर का कारण
  rationale: यह बाधा, फंदे या गिराने वाली वस्तु को सूचित कर सकता है; ‘ठोकर का कारण’ परिचित और प्रसंगानुकूल है, जबकि दूसरा सम्भव चित्र पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पापी के साथ सहभागिता की अभिव्यक्ति
  choice: अपना हिस्सा बाँटता था
  alternative: उसकी संगति करता था
  rationale: मूल में μερίδα (‘हिस्सा’) का ठोस शब्दचित्र है; केवल ‘संगति’ कहने से वह चित्र लुप्त हो जाता।
- issue: भाई और माँ के बेटे का सम्बन्ध
  choice: अपने भाई ... अपनी माँ के बेटे
  alternative: दोनों को एक ही व्यक्ति मानकर एक संयुक्त पदबंध
  rationale: मूल पाठ समानान्तर रूप में दोनों पदबंधों को अलग रखता है; अनुवाद ने इस तनाव को बिना व्याख्यात्मक समानीकरण के बनाए रखा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध शैली रखी गई है। एकवचन सम्बोधन ‘तू’ मूल यूनानी के तीखे, व्यक्तिगत अभियोग को व्यक्त करता है। अपूर्ण भूतकाल की जारी या अभ्यस्त क्रियाओं को ‘था/रहा’ के रूपों से दर्शाया गया है।
