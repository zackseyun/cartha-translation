  text: ταῦτα γὰρ οἱ πράσσοντες στυγητοὶ τῷ θεῷ ὑπάρχουσιν· οὐ μόνον δὲ οἱ πράσσοντες αὐτά, ἀλλὰ καὶ οἱ συνευδοκοῦντες αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/006.yaml
  text: For those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them.
translation:
  language: hi
  text: क्योंकि जो लोग ये काम करते हैं, वे परमेश्वर को घृणित हैं; और न केवल वे जो इन्हें करते हैं, बल्कि वे भी जो उनका अनुमोदन करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράσσοντες
  choice: करते हैं
  rationale: वर्तमान कृदंत ऐसे कामों को व्यवहार में करने या लगातार करते रहनेवालों को सूचित करता है; सहज हिन्दी में ‘करते हैं’ इसे स्पष्ट रखता है।
- source_word: στυγητοὶ τῷ θεῷ
  choice: परमेश्वर के लिए घृणित
  rationale: ग्रीक विशेषण का अर्थ ‘घृणित/अत्यंत अप्रिय’ है और τῷ θεῷ संबंध-द्योतक है; यह शब्दावली मूल कथन की तीव्रता बनाए रखती है।
- source_word: συνευδοκοῦντες αὐτοῖς
  choice: ऐसा करनेवालों से सहमत होते हैं
  rationale: क्रिया दूसरों के कामों को सहमति या अनुमोदन देने का भाव रखती है। ‘से सहमत’ αὐτοῖς के व्यक्तिवाचक संकेत को बनाए रखता है और केवल कर्मों की अमूर्त स्वीकृति तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर की दृष्टि में कर्ताओं और सहमति देनेवालों की स्थिति
  choice: दोनों को स्पष्ट समानांतर खंडों में रखा गया है
  alternative: दूसरे खंड को केवल कर्मों का निष्क्रिय अनुमोदन बताना
  rationale: मूल यूनानी न केवल काम करनेवालों, बल्कि उनके साथ सहमति रखनेवालों को भी सम्मिलित करता है; अनुवाद इस नैतिक तनाव को बिना विस्तार या नरमी के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘घृणित’ मूल यूनानी की कठोरता को सुरक्षित रखता है, जबकि ‘ऐसे काम’ पूर्ववर्ती संदर्भ की ओर स्वाभाविक संकेत करता है।
