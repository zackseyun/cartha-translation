id: 1CLEM.35.5
reference: 1 Clement 35:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: πῶς δὲ ἔσται τοῦτο, ἀγαπητοί; ἐὰν ἐστηργιμένῃ ἢ ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν, ἐὰν ἐκζητήσωμεν τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ, ἐὰν ἐπιτελέσωμεν τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ καὶ ἀκολουθήσωμεν τῇ ὁδῷ τῆς ἀληθείας, ἀπορρίψαντες ἀφ’ ἑαυτῶν πᾶσαν ἀδικίαν καὶ πονηρίαν, πλεονεξίαν, ἔρεις, κακοηθείας τε καὶ δόλους, ψιθυρισμούς τε καὶ καταλαλιάς, θεοστυγίαν, ὑπερηφανίαν τε καὶ ἀλαζονείαν, κενοδοξίαν τε καὶ ἀφιλοξενίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/005.yaml
  text: But how will this be[a], beloved? If our mind is firmly fixed on God in faithfulness, if we seek the things pleasing and acceptable to him, if we do the things that are fitting for his blameless will and follow the way of truth, having cast away from ourselves all unrighteousness and wickedness, greed, strife, malice and deceit, whisperings and slanders, hatred of God, pride and arrogance[c][b], vainglory and inhospitality.
translation:
  language: hi
  text: पर हे प्रिय जनो, यह कैसे होगा? यदि हमारा मन विश्वास के साथ परमेश्वर पर दृढ़ता से टिका रहे[a]; यदि हम उन बातों की खोज करें जो उसे प्रिय और स्वीकार्य हैं; यदि हम वे काम करें जो उसकी निष्कलंक इच्छा के अनुकूल हैं और सत्य के मार्ग पर चलें; और अपने में से हर प्रकार का अधर्म और दुष्टता, लोभ, झगड़े, दुर्भावना और छल, कानाफूसी और बदनामी, परमेश्वर से बैर[b], घमंड और अहंकार, खोखली प्रतिष्ठा की चाह और अतिथि-सत्कार का अभाव दूर कर चुके हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि हमारा मन विश्वास के साथ परमेश्वर पर दृढ़ किया हुआ हो।”
    reason: यूनानी पूर्णकालिक निष्क्रिय रचना मन की वर्तमान दृढ़ स्थिति और पहले दृढ़ किए जाने—दोनों पहलुओं को व्यक्त कर सकती है।
  - marker: b
    text: यूनानी पद का अर्थ “परमेश्वर की दृष्टि में घृणित होना” भी हो सकता है।
    reason: θεοστυγίαν में ‘परमेश्वर से बैर’ और ‘परमेश्वर द्वारा घृणित’—दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: ἐστηργιμένῃ ἢ (अर्थतः ἐστηριγμένη ᾖ)
  choice: दृढ़ता से टिका रहे
  rationale: स्रोत के सामान्यतः स्वीकृत अर्थ में पूर्णकालिक निष्क्रिय भाव है—मन का परमेश्वर पर दृढ़ किया हुआ होना। हिंदी में यह वाक्यांश स्वाभाविक है और बनी रहने वाली दृढ़ स्थिति को व्यक्त करता है।
- source_word: πιστῶς πρὸς τὸν θεόν
  choice: विश्वास के साथ परमेश्वर पर
  rationale: πιστῶς की विश्वास/विश्वासयोग्यता संबंधी अर्थ-छाया को बनाए रखते हुए πρὸς की दिशा को ‘पर’ से व्यक्त किया गया है।
- source_word: τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ
  choice: वे बातें जो उसे भाती और स्वीकार्य हैं
  rationale: 'दोनों विशेषणों का भेद रखा गया है: εὐάρεστα ‘भाने वाली’ और εὐπρόσδεκτα ‘स्वीकार्य’।'
- source_word: τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ
  choice: वे काम जो उसकी निष्कलंक इच्छा के अनुरूप हैं
  rationale: ἀνήκοντα का अर्थ ‘उचित/अनुरूप’ है, केवल ‘संबंधित’ नहीं; βούλησις को इस नैतिक संदर्भ में ‘इच्छा’ कहा गया है।
- source_word: κακοηθείας τε καὶ δόλους
  choice: दुर्भाव और छल
  rationale: κακοήθεια बुरे चरित्र अथवा दुर्भाव को सूचित करता है; ‘दुर्भाव’ अनावश्यक रूप से आदत का अर्थ जोड़े बिना भाव पकड़ता है। δόλους का सामूहिक अर्थ हिंदी में ‘छल’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: ψιθυρισμούς τε καὶ καταλαλιάς
  choice: कानाफूसी और बदनामी
  rationale: पहला शब्द गुप्त निंदात्मक फुसफुसाहट और दूसरा किसी के विरुद्ध अपवादपूर्ण बोलने को दर्शाता है।
- source_word: κενοδοξίαν
  choice: खोखली प्रतिष्ठा की चाह
  rationale: शाब्दिक ‘व्यर्थ महिमा’ आधुनिक हिंदी में अस्पष्ट है; यह पद निरर्थक आत्म-प्रतिष्ठा या दिखावटी गौरव की लालसा बताता है।
- source_word: ἀφιλοξενίαν
  choice: अतिथि-सत्कार का अभाव
  rationale: यह φιλοξενία के निषेध को सीधे व्यक्त करता है और सामान्य पाठक के लिए ‘अतिथि-विमुखता’ से अधिक स्पष्ट है।
theological_decisions:
- issue: θεοστυγίαν का कर्तृवाचक या कर्मवाचक अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर से बैर’
  alternative: ‘परमेश्वर की दृष्टि में घृणित होना’ अथवा ‘परमेश्वर को अप्रिय आचरण’
  rationale: शब्द का सामान्य नैतिक अर्थ परमेश्वर से घृणा/बैर हो सकता है, किंतु इसकी बनावट कर्मवाचक अर्थ की भी अनुमति देती है। मुख्य पाठ ने प्रचलित अर्थ चुना है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी है।
- issue: ἀμώμῳ βουλήσει में परमेश्वर की इच्छा का वर्णन
  choice: ‘निष्कलंक इच्छा’
  alternative: ‘निर्दोष अभिप्राय’
  rationale: βουλήσει यहाँ नैतिक आज्ञापालन के संदर्भ में ‘इच्छा’ है; ἀμώμῳ के स्पष्ट सकारात्मक मूल्यांकन को हटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। लंबी दोष-सूची को स्पष्ट हिंदी समानांतर पदों में रखा गया है; तकनीकी या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘अधर्म’, ‘निष्कलंक’ और ‘अतिथि-सत्कार’ जैसे परिचित धार्मिक-नैतिक शब्द बनाए गए हैं।
