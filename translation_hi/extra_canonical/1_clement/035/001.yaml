  text: 'How blessed and marvelous are the gifts of God, beloved:'
translation:
  language: hi
  text: हे प्रिय जनो, परमेश्वर के वरदान कितने धन्य और अद्भुत हैं!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάρια
  choice: धन्य
  rationale: यह शब्द उन वरदानों की परमेश्वर-प्रदत्त शुभ और अनुग्रहपूर्ण अवस्था व्यक्त करता है; ‘धन्य’ धार्मिक गरिमा और मूल अर्थ दोनों बनाए रखता है।
- source_word: θαυμαστά
  choice: अद्भुत
  rationale: मूल में आश्चर्य और विस्मय उत्पन्न करने का भाव है, जिसे आधुनिक हिन्दी में ‘अद्भुत’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: δῶρα
  choice: वरदान
  rationale: सामान्य ‘उपहार’ की अपेक्षा ‘वरदान’ परमेश्वर द्वारा अनुग्रहपूर्वक दी गई वस्तुओं या आशीषों के संदर्भ में अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀγαπητοί
  choice: हे प्रिय जनो
  rationale: यह बहुवचन संबोधन है। ‘प्रिय जनो’ स्नेहपूर्ण भाव बनाए रखते हुए मिश्रित समुदाय के लिए समावेशी और स्वाभाविक हिन्दी है।
