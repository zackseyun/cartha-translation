source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς οὖν ἀγωνιζώμεθα εὑρεθῆναι ἐν τῷ ἀριθμῷ τῶν ὑπομενόντων αὐτόν, ὅπως μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/004.yaml
  text: Therefore let us strive to be found among the number of those who wait for him[a], so that we may share in the promised gifts.
translation:
  language: hi
  text: इसलिए हम पूरा प्रयत्न करें कि उन लोगों में गिने जाएँ जो उसकी प्रतीक्षा करते हैं[a], ताकि हम प्रतिज्ञा किए गए वरदानों में भागी हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धैर्यपूर्वक उसकी प्रतीक्षा करते हैं।”
    reason: ὑπομένω में धीरज से टिके रहने का भाव भी निहित हो सकता है, पर αὐτόν के साथ संदर्भानुकूल अर्थ उसकी प्रतीक्षा करना है।
lexical_decisions:
- source_word: ἀγωνιζώμεθα
  choice: हम पूरा प्रयत्न करें
  rationale: यह क्रिया लगन से संघर्ष या प्रयास करने का भाव व्यक्त करती है; ‘पूरा प्रयत्न करें’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी तीव्रता बनाए रखता है।
- source_word: εὑρεθῆναι ἐν τῷ ἀριθμῷ
  choice: उन लोगों में गिने जाएँ
  rationale: शाब्दिक अर्थ ‘संख्या में पाए जाएँ’ है, पर हिन्दी में ‘में गिने जाएँ’ उसी गणना और सम्मिलित पाए जाने के भाव को सहज रूप से व्यक्त करता है।
- source_word: τῶν ὑπομενόντων αὐτόν
  choice: जो उसकी प्रतीक्षा करते हैं
  rationale: व्यक्तिवाचक कर्म αὐτόν के साथ यहाँ ὑπομένω का आशय धीरज और आशा के साथ उसकी प्रतीक्षा करना है; इससे परमेश्वर को सहने योग्य कष्ट बताने का अनुचित आभास नहीं होता।
- source_word: μεταλάβωμεν
  choice: हम ... सहभागी हों
  rationale: यह क्रिया किसी वस्तु में भाग पाने या हिस्सा लेने को दर्शाती है; ‘सहभागी हों’ गरिमापूर्ण और स्पष्ट है।
- source_word: τῶν ἐπηγγελμένων δωρεῶν
  choice: प्रतिज्ञा किए गए वरदानों
  rationale: ἐπηγγελμένων का पूर्ण निष्क्रिय भाव बनाए रखा गया है और δωρεῶν के लिए ‘वरदानों’ से अनुग्रहपूर्वक दी गई भेंटों का अर्थ व्यक्त होता है।
theological_decisions:
- issue: ὑπομένω के धैर्य, टिके रहने और प्रतीक्षा करने के अर्थक्षेत्र को कैसे व्यक्त किया जाए
  choice: मुख्य पाठ में ‘उसकी प्रतीक्षा करते हैं’
  alternative: ‘उसके लिए धीरज धरते हैं’
  rationale: संदर्भ में व्यक्ति के लिए आशापूर्ण प्रतीक्षा प्रमुख है, लेकिन क्रिया में निहित धैर्य का पहलू वैकल्पिक पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामूहिक exhortation का स्वर रखा गया है। ‘प्रतिज्ञा किए गए’ स्रोत के निष्क्रिय कृदंत को स्पष्ट रखता है, जबकि ‘वरदान’ धार्मिक संदर्भ में सामान्य पाठक के लिए सुबोध है।
