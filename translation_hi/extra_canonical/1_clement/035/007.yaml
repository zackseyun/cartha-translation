  text: λέγει γὰρ ἡ γραφή· Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός· Ἱνατί σὺ διηγεῖ τὰ δικαιώματά μου, καὶ ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/007.yaml
  text: For the Scripture says, “But to the wicked God says, Why do you recount my statutes, and take up my covenant on your lips?
translation:
  language: hi
  text: क्योंकि पवित्रशास्त्र कहता है, “परन्तु पापी से परमेश्वर कहता है, ‘तू मेरी विधियों का वर्णन क्यों करता है और मेरी वाचा को अपने होंठों पर क्यों रखता है?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध यूनानी पाठ में उद्धरण की आरम्भिक पंक्ति विकृत जान पड़ती है। यह भजन 49:16 (सेप्टुआजिन्ट क्रम; प्रायः भजन 50:16) का उद्धरण है, जहाँ पाठ है: “परन्तु पापी से परमेश्वर कहता है …”'
    reason: प्रदत्त यूनानी स्रोत में ‘Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός’ व्याकरणतः असंगत है; पहचाने जा सकने वाले बाइबलीय उद्धरण के आधार पर पाठ बहाल करने की सूचना पाठक को देना आवश्यक है।
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: क्योंकि पवित्रशास्त्र कहता है
  rationale: यूनानी वर्तमानकालीन उद्धरण-सूत्र को स्वाभाविक और प्रतिष्ठित हिन्दी में रखा गया है।
- source_word: τῷ δὲ ἁμαρτωλῷ (भजन 49:16 LXX में उद्धरण का पाठ; दिए गए पाठ में विकृत)
  choice: परन्तु पापी से
  rationale: क्लेमेंट के यूनानी बाइबलीय उद्धरण का निकटतम अर्थ सुरक्षित रखा गया है; ‘पापी’ ἁμαρτωλός का सीधा समतुल्य है।
- source_word: τὰ δικαιώματά μου
  choice: मेरी विधियों
  rationale: यहाँ δικαιώματα परमेश्वर द्वारा निर्धारित नियमों अथवा विधानों को दर्शाता है; ‘विधियाँ’ अर्थ को संक्षिप्त और स्पष्ट रखता है।
- source_word: ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου
  choice: मेरी वाचा को अपने होंठों पर रखता है
  rationale: मूल के ‘वाचा’, ‘ग्रहण करना/उठाना’ और ‘मुँह पर’ वाले बिंब को सहज हिन्दी में यथासंभव बनाए रखा गया है।
theological_decisions:
- issue: ἁμαρτωλός का नैतिक संबोधन
  choice: पापी
  alternative: दुष्ट
  rationale: उद्धृत सेप्टुआजिन्ट पाठ में सामान्यतः ἁμαρτωλῷ मिलता है, जिसका सीधा अर्थ ‘पापी’ है। ‘दुष्ट’ भजन के इब्रानी पाठ के निकट हो सकता है, पर क्लेमेंट के यूनानी उद्धरण से कम सीधा है।
- issue: δικαιώματα का अर्थ
  choice: विधियाँ
  alternative: धार्मिक अपेक्षाएँ / धर्ममय नियम
  rationale: संदर्भ में यह परमेश्वर के घोषित विधानों को सूचित करता है; अनुवाद में किसी विशेष धर्मवैज्ञानिक व्यवस्था को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप। ‘तू’ उद्धरण में परमेश्वर द्वारा एकवचन प्रत्यक्ष संबोधन को स्पष्ट करता है; वाक्य-विन्यास औपचारिक है, पर अनावश्यक रूप से संस्कृतनिष्ठ नहीं।
