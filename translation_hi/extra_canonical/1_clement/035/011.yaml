base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/011.yaml
  text: Understand these things[a], then, you who forget God, lest he seize you like a lion, and there be no one to rescue.
translation:
  language: hi
  text: तो, हे परमेश्वर को भूलनेवालो, इन बातों को समझो। कहीं ऐसा न हो कि वह सिंह के समान तुम्हें दबोच ले[a] और छुड़ानेवाला कोई न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सिंह के समान दबोच ले”; यूनानी में “तुम्हें” निहित है।
    reason: मूल यूनानी में ἁρπάσῃ का कर्म व्यक्त नहीं किया गया है, यद्यपि सम्बोधित लोगों से वह सहज रूप से समझा जाता है।
lexical_decisions:
- source_word: σύνετε
  choice: समझो
  rationale: यह συνίημι का आज्ञार्थक रूप है; ‘समझो’ इसके बोध और चेतावनी—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐπιλανθανόμενοι τοῦ θεοῦ
  choice: हे परमेश्वर को भूलनेवालो
  rationale: सम्बोधन और वर्तमान कृदन्त के निरंतर आचरण-सूचक भाव को बनाए रखता है।
- source_word: ἁρπάσῃ ὡς λέων
  choice: सिंह के समान तुम्हें दबोच ले
  rationale: ἁρπάζω के हिंसक ढंग से पकड़ लेने के भाव के लिए ‘दबोच ले’ स्वाभाविक है। यूनानी में कर्म व्यक्त नहीं है, पर सम्बोधित लोगों से ‘तुम्हें’ निहित समझा जाता है।
- source_word: ὁ ῥυόμενος
  choice: छुड़ानेवाला
  rationale: यह कृदन्त संकट या आक्रमण से बचाने अथवा छुड़ाने वाले व्यक्ति को दर्शाता है।
theological_decisions:
- issue: ἁρπάσῃ का अव्यक्त कर्ता और कर्म
  choice: कर्ता के लिए ‘वह’ और निहित कर्म के लिए ‘तुम्हें’
  alternative: ‘कहीं वह सिंह के समान दबोच न ले’
  rationale: निकटवर्ती ‘परमेश्वर’ से कर्ता स्पष्ट है, जबकि सम्बोधन से कर्म ‘तुम्हें’ समझा जाता है। मुख्य पाठ में इसे स्पष्ट करने से हिन्दी स्वाभाविक बनती है; पादटिप्पणी यूनानी की संक्षिप्तता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी चेतावनी का स्वर रखा गया है। ‘हे’ सम्बोधन को स्पष्ट करता है; ‘दबोच ले’ सिंह की उपमा और क्रिया की तीव्रता को सहज हिन्दी में बनाए रखता है।
