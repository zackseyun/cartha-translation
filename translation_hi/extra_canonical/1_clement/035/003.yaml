source:
  edition: Funk 1901 (normalized OCR)
  text: τίνα οὖν ἄρα ἐστὶν τὰ ἑτοιμασμένα τοῖς ὑπομένουσιν; ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων ὁ πανάγιος αὐτὸς γινώσκει τὴν ποσότητα καὶ τὴν καλλονὴν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/003.yaml
  text: What then are the things prepared for those who patiently endure? The Creator and Father of the ages[a], the all-holy one himself[b], knows their measure and their beauty.
translation:
  language: hi
  text: तो फिर, धीरज से बने रहने वालों के लिए तैयार की गई वस्तुएँ क्या हैं? युगों का सृष्टिकर्ता और पिता, जो परम पवित्र है, स्वयं उनका परिमाण और सुंदरता जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένουσιν
  choice: धीरज धरने वालों
  rationale: यह वर्तमान कृदंत कठिनाई में धैर्यपूर्वक टिके रहने या सहते रहने वालों को दर्शाता है; यूनानी पाठ में ‘उसके लिए’ नहीं है।
- source_word: δημιουργὸς
  choice: सृष्टिकर्ता
  rationale: यहाँ शब्द संसार की रचना करने वाले परमेश्वर के लिए प्रयुक्त पद है; ‘सृष्टिकर्ता’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τῶν αἰώνων
  choice: युगों का
  rationale: बहुवचन αἰώνων को उसके व्यापक कालगत अर्थ और मूल रूप की बहुवचनता सहित रखा गया है।
- source_word: πανάγιος
  choice: परम पवित्र
  rationale: पद का अर्थ ‘सर्वथा/पूर्णतः पवित्र’ है; ‘परम पवित्र’ सहज और प्रतिष्ठित हिन्दी अभिव्यक्ति है।
- source_word: ποσότητα
  choice: विशालता
  rationale: यहाँ तैयार वस्तुओं की मात्रात्मक महानता, विस्तार या परिमाण अभिप्रेत है; ‘विशालता’ हिन्दी में ‘मात्रा’ की अपेक्षा इस प्रशंसात्मक संदर्भ को अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: καλλονὴν
  choice: सुंदरता
  rationale: शब्द उत्कृष्ट सौंदर्य या शोभा को सूचित करता है; ‘सुंदरता’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
theological_decisions:
- issue: ὑπομένουσιν का कर्म-संबंध
  choice: ‘धीरज धरने वालों’ को निरपेक्ष रूप में रखा गया
  alternative: ‘उसके लिए धीरज धरने वालों’
  rationale: इस पद में ‘उसके लिए’ का कोई यूनानी सर्वनाम या पूरक नहीं है; उसे जोड़ना अगले पद की भाषा को यहाँ आयात करना होगा।
- issue: ‘युगों का पिता’ की असामान्य उपाधि
  choice: ‘युगों का सृष्टिकर्ता और पिता’
  alternative: ‘सृष्टि का रचयिता और अनन्त पिता’
  rationale: मूल पाठ के संयुक्त पद और αἰώνων के बहुवचन को बनाए रखा गया है, ताकि उसकी विशिष्ट धर्मवैचारिक अभिव्यक्ति को सामान्यीकृत न किया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल रखी गई है। οὖν ἄρα को अनावश्यक दोहराव से बचाते हुए ‘तो फिर’ कहा गया है। वाक्य की अलंकारिक प्रश्न-रचना और αὐτὸς का बल ‘स्वयं ही’ द्वारा सुरक्षित रखा गया है।
