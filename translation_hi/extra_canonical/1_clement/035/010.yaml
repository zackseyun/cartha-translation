translation:
  language: hi
  text: “मैं तुझे फटकारूँगा और तुझे तेरे ही सामने खड़ा कर दूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से “तुझे … तुझे तेरे सामने” है। अभिव्यक्ति असामान्य है; प्रसंग के आधार पर इसे “तेरे कामों को तेरे सामने रख दूँगा” भी समझा गया है।
    reason: दूसरे σε के कारण उत्पन्न वास्तविक पाठगत और अर्थगत कठिनाई को बताए बिना मुख्य पाठ को कृत्रिम रूप से स्पष्ट करने से बचना।
lexical_decisions:
- source_word: ἐλέγξω
  choice: फटकारूँगा
  rationale: यह ἐλέγχω के सुधारात्मक दोष-दर्शन और भर्त्सना के भाव को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: παραστήσω
  choice: सामने खड़ा कर दूँगा
  rationale: παρίστημι के ‘सामने उपस्थित करना/खड़ा करना’ अर्थ को बनाए रखता है और κατὰ πρόσωπόν के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: σε … σε
  choice: तुझे … तुझे
  rationale: उपलब्ध यूनानी पाठ में सर्वनाम σε दो बार स्पष्ट रूप से आया है; इसलिए दूसरे पद को निहित निर्जीव कर्म ‘इसे’ में बदलने के बजाय पाठ की असामान्य आत्म-सामना कराने वाली अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: κατὰ πρόσωπόν σου
  choice: तेरे ही सामने
  rationale: शाब्दिक भाव ‘तेरे मुख के सामने’ है; ‘तेरे ही सामने’ आधुनिक हिन्दी में स्वाभाविक रहते हुए बल और प्रत्यक्ष सामना दोनों व्यक्त करता है।
theological_decisions:
- issue: दूसरे σε का संदर्भ
  choice: इसे व्यक्ति-वाचक ‘तुझे’ के रूप में रखा गया है।
  alternative: संदर्भ से कोई निहित कर्म मानकर ‘उसे/इसे तेरे सामने रख दूँगा’ अनुवाद करना।
  rationale: दिए गए यूनानी स्रोत में दूसरा σε मौजूद है, यद्यपि वाक्य असामान्य है। उसे बदलना पाठगत कठिनाई को चुपचाप सुलझा देता; मुख्य पाठ और पादटिप्पणी मिलकर वास्तविक अस्पष्टता सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गंभीर और उद्धरण-सुलभ शैली। ‘तुझे/तेरे’ मूल के एकवचन द्वितीय पुरुष और फटकार के सीधे संबोधन को स्वाभाविक ढंग से व्यक्त करते हैं।
