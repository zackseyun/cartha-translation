  text: These things you did, and I kept silent; you supposed, lawless one, that I would be like you.
translation:
  language: hi
  text: तूने ये काम किए, और मैं चुप रहा; हे अधर्मी, तूने समझ लिया कि मैं भी तेरे जैसा हो जाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ἐποίησας
  choice: तूने ये काम किए
  rationale: प्रत्यक्ष संबोधन और पूर्ण हो चुकी क्रियाओं को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐσίγησα
  choice: मैं चुप रहा
  rationale: यूनानी क्रिया के मौन रहने के सीधे अर्थ को बनाए रखता है।
- source_word: ὑπέλαβες
  choice: तूने समझ लिया
  rationale: यहाँ इसका अर्थ किसी बात को मान लेना या अनुमान कर लेना है; ‘समझ लिया’ प्रसंग में सहज और स्पष्ट है।
- source_word: ἄνομε
  choice: हे अधर्मी
  rationale: κλητική रूप वाले ἄνομε का अर्थ व्यवस्था/धर्म के विरुद्ध चलने वाला है; ‘हे अधर्मी’ संबोधन को स्पष्ट रखता है।
- source_word: ἔσομαι ὅμοιος σοι
  choice: मैं भी तेरे जैसा हो जाऊँगा
  rationale: भविष्यकाल ἔσομαι और समानता ὅμοιος σοι को संरक्षित करता है; ‘भी’ निहित तुलना को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: ईश्वर के मौन का अर्थ
  choice: ‘मैं चुप रहा’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘मैंने कुछ नहीं कहा’ या दंड में विलंब की व्याख्या जोड़ना
  rationale: मूल पाठ केवल मौन रहने की बात कहता है; उसका कारण या तात्पर्य स्पष्ट करके धार्मिक तनाव को समयपूर्व हल नहीं किया गया।
- issue: ἄνομε का संबोधन
  choice: ‘हे अधर्मी’
  alternative: ‘हे व्यवस्था-विहीन’ या ‘हे दुष्ट’
  rationale: ‘अधर्मी’ नैतिक और दैवी व्यवस्था के उल्लंघन का व्यापक अर्थ रखता है, जबकि अधिक संकीर्ण या मात्र सामान्य नैतिक शब्द मूल की धार को घटा सकते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रत्यक्ष हिन्दी। एकवचन ‘तू/तेरे’ मूल यूनानी के निकट संबोधन और उसकी फटकार की तीव्रता को बनाए रखता है।
