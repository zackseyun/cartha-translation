source:
  edition: Funk 1901 (normalized OCR)
  text: θυσία αἰνέσεως δοξάσει με, καὶ ἐκεῖ ὁδός, ἣν δείξω αὐτῷ τὸ σωτήριον τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/012.yaml
  text: A sacrifice of praise will glorify me, and there is the way by which I will show him the salvation of God.”
translation:
  language: hi
  text: “स्तुति का बलिदान मेरी महिमा करेगा, और वहीं वह मार्ग है जिसके द्वारा मैं उसे परमेश्वर का उद्धार दिखाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία αἰνέσεως
  choice: स्तुति का बलिदान
  rationale: यूनानी संबंधवाचक पदबंध को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δοξάσει με
  choice: मेरी महिमा करेगा
  rationale: भविष्यकाल और प्रत्यक्ष कर्म ‘मुझे’ के अर्थ को बनाए रखता है।
- source_word: ἐκεῖ ὁδός
  choice: वहीं वह मार्ग है
  rationale: पाठ की संक्षिप्त और कुछ असामान्य अभिव्यक्ति को बिना अतिरिक्त अर्थ जोड़े सुरक्षित रखता है।
- source_word: δείξω αὐτῷ
  choice: मैं उसे ... दिखाऊँगा
  rationale: क्रिया के भविष्यकाल तथा अप्रत्यक्ष कर्म को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: τὸ σωτήριον τοῦ θεοῦ
  choice: परमेश्वर का उद्धार
  rationale: σωτήριον को यहाँ उद्धार के रूप में समझते हुए संबंधवाचक ‘परमेश्वर का’ को यथावत रखता है।
theological_decisions:
- issue: ‘परमेश्वर का उद्धार’ का संबंध
  choice: परमेश्वर का उद्धार
  alternative: परमेश्वर की उद्धारकारी सामर्थ्य
  rationale: मूल पदबंध की संभावित व्यापकता को बनाए रखा गया है और किसी विशेष धर्मवैज्ञानिक व्याख्या को नहीं जोड़ा गया।
- issue: ἐκεῖ ὁδός की व्याख्या
  choice: वहीं वह मार्ग है
  alternative: और जो अपना मार्ग ठीक करता है
  rationale: प्रदत्त यूनानी पाठ का सीधे अनुसरण किया गया है; भजन के अन्य पाठरूपों से इसे चुपचाप संशोधित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण, पठनीय और मूल यूनानी की संक्षिप्त संरचना के निकट। उद्धरण-चिह्न रखा गया है क्योंकि यह पूर्ववर्ती शास्त्रीय उद्धरण का समापन प्रतीत होता है।
