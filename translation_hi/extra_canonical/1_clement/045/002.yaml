lexical_decisions:
- source_word: ἐνεκύψατε
  choice: तुमने ... ध्यानपूर्वक अध्ययन किया है
  rationale: ἐγκύπτω का मूल चित्र झुककर भीतर देखने का है, पर ग्रंथों के संदर्भ में इसका स्वाभाविक अर्थ ध्यान से जाँचना या अध्ययन करना है।
- source_word: ἱερὰς γραφάς
  choice: पवित्र शास्त्रों
  rationale: यह धार्मिक लेखों के लिए प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी पद है।
- source_word: τὰς ἀληθεῖς
  choice: उन सच्चे शास्त्रों का
  rationale: विशेषण के substantival बल को स्पष्ट करता है और इन्हीं पवित्र शास्त्रों को 'सच्चे' बताने वाली समानाधिकरणीय रचना बनाए रखता है।
- source_word: διὰ τοῦ πνεύματος τοῦ ἁγίου
  choice: पवित्र आत्मा के द्वारा दिए गए
  rationale: διά के माध्यमवाचक अर्थ को 'के द्वारा' से सुरक्षित रखा गया है। 'दिए गए' यूनानी में निहित नहीं, पर लुप्त संबंध को सहज हिन्दी में व्यक्त करता है और परंपरा की इस समझ को दर्शाता है कि ये शास्त्र आत्मा के माध्यम से प्राप्त हुए।
theological_decisions:
- issue: पवित्र आत्मा और शास्त्रों के बीच संबंध
  choice: जो पवित्र आत्मा के द्वारा दिए गए हैं
  alternative: जो पवित्र आत्मा के द्वारा हैं
  rationale: यूनानी वाक्यांश अत्यंत संक्षिप्त है और कोई स्पष्ट कृदंत नहीं देता। हिन्दी में संबंध को बोधगम्य बनाने के लिए 'दिए गए' जोड़ा गया, जबकि 'के द्वारा' ने माध्यमवाचकता को बनाए रखा; प्रेरणा की किसी अधिक विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है, इसलिए 'तुमने' रखा गया है। भाषा सहज और गरिमापूर्ण है। डैश समानाधिकरणीय व्याख्या को स्पष्ट करता है।
