  text: You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men.
translation:
  language: hi
  text: तुम जानते हो कि उनमें न तो कोई अन्यायपूर्ण बात लिखी गई है, न कोई मिथ्या रूप से गढ़ी हुई बात; तुम यह नहीं पाओगे कि पवित्र पुरुषों ने धर्मी लोगों को ठुकरा दिया हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  choice: तुम जानते हो
  rationale: यह क्रिया दृढ़ जानकारी या भली-भाँति जानने को व्यक्त करती है; सहज आधुनिक हिन्दी में ‘तुम जानते हो’ उपयुक्त है।
- source_word: ἐν αὐταῖς
  choice: उनमें
  rationale: स्त्रीलिंग बहुवचन सर्वनाम का पूर्वसंदर्भ सम्भवतः पवित्र शास्त्रों से है; मूल पद की तरह यहाँ भी संदर्भ को स्पष्ट किए बिना सर्वनाम रखा गया है।
- source_word: ἄδικον
  choice: अन्यायपूर्ण बात
  rationale: नपुंसकलिंग विशेषण का संज्ञात्मक प्रयोग है; हिन्दी में ‘बात’ जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: παρεπεποιημένον
  choice: जाली बात
  rationale: यह पूर्ण कृदन्त ऐसी सामग्री का संकेत करता है जिसे मिथ्या रूप से गढ़ा, बिगाड़ा या कूटरचित किया गया हो; ‘जाली’ पाठ-संबंधी मिथ्याकरण का संक्षिप्त और बोधगम्य रूप है।
- source_word: δικαίους
  choice: धर्मी लोगों
  rationale: शब्द नैतिक रूप से न्यायी या धर्मी व्यक्तियों को दर्शाता है; धार्मिक साहित्य के वर्तमान हिन्दी प्रयोग में ‘धर्मी’ स्वाभाविक है।
- source_word: ἀποβεβλημένους
  choice: ठुकरा दिया
  rationale: मूल में दूर फेंकने, निकाल देने या अस्वीकार करने का भाव है; व्यक्तियों के संबंध में ‘ठुकरा दिया’ सहज है और आवश्यक अस्पष्टता बनाए रखता है।
- source_word: ὁσίων ἀνδρῶν
  choice: पवित्र जनों
  rationale: ὅσιος धार्मिक निष्ठा और पवित्रता का बोध देता है; ἀνδρῶν को यहाँ सामान्य मानवीय अर्थ में समावेशी ‘जनों’ से व्यक्त किया गया है।
theological_decisions:
- issue: ἐν αὐταῖς का निहित संदर्भ
  choice: ‘उनमें’ रखकर संदर्भ को अनिर्दिष्ट रखा गया
  alternative: ‘पवित्र शास्त्रों में’
  rationale: इस पद के यूनानी पाठ में संज्ञा दोहराई नहीं गई है; उसे स्पष्ट कर देना संदर्भ से सम्भव होते हुए भी मूल की व्याकरणिक निर्भरता को मिटा देता।
- issue: ὅσιοι और δίκαιοι के बीच भेद
  choice: क्रमशः ‘पवित्र जन’ और ‘धर्मी लोग’
  alternative: दोनों के लिए ‘धर्मी’ या ‘पवित्र’
  rationale: दो अलग यूनानी पदों के नैतिक-धार्मिक भेद को हिन्दी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठक के लिए बोधगम्य शैली। दोहरे निषेध को हिन्दी के स्वाभाविक ‘न तो…न’ विन्यास में रखा गया है; दूसरे खंड को सक्रिय वाक्य बनाकर यूनानी संबंध को स्पष्ट किया गया है।
