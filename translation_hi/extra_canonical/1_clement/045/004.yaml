base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/004.yaml
  text: The righteous were persecuted[a], but by the lawless; they were imprisoned, but by the unholy; they were stoned by transgressors; they were killed by the vile and unjust through unbearable jealousy.
translation:
  language: hi
  text: धर्मियों को सताया गया—पर व्यवस्था-विहीन लोगों के द्वारा; उन्हें कैद किया गया—पर अपवित्र लोगों के द्वारा; व्यवस्था तोड़ने वालों ने उन पर पत्थराव किया; और घृणित तथा अन्यायी लोगों ने असहनीय ईर्ष्या के कारण उन्हें मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: धर्मी
  rationale: यह नैतिक रूप से न्यायी और सही आचरण करने वाले लोगों के लिए प्रचलित, गरिमापूर्ण हिन्दी पद है।
- source_word: ἀνόμων
  choice: अधर्मी
  rationale: ἄνομος का मूल भाव व्यवस्था या नियम के विरुद्ध होना है; यहाँ संज्ञात्मक बहुवचन को सहज हिन्दी में व्यक्त किया गया है और इसे राज्य द्वारा बहिष्कृत होने के अर्थ में नहीं लिया गया।
- source_word: ἀνοσίων
  choice: अपवित्र लोग
  rationale: ἀνόσιος धार्मिक-नैतिक अपवित्रता या अधर्मिता बताता है; 'अपवित्र' आधुनिक पाठक के लिए स्पष्ट है और ἄνομος से भेद भी बनाए रखता है।
- source_word: παρανόμων
  choice: व्यवस्था का उल्लंघन करने वाले
  rationale: παράνομος सक्रिय रूप से व्यवस्था तोड़ने या उसका उल्लंघन करने वाले व्यक्ति को सूचित करता है; यह 'कानून से बहिष्कृत' जैसे भ्रामक अर्थ से बचता है।
- source_word: μιαρῶν καὶ ἀδίκων
  choice: घिनौने तथा अन्यायी लोग
  rationale: μιαρός की नैतिक मलिनता और जघन्यता को 'घिनौना', तथा ἄδικος के अन्याय को 'अन्यायी' द्वारा अलग-अलग सुरक्षित रखा गया है।
- source_word: ζήλῳ ἀνεκτρίστῳ
  choice: असहनीय ईर्ष्या के कारण
  rationale: ζῆλος संदर्भ में ईर्ष्यापूर्ण द्वेष है और दत्तिव कारक कारण या प्रेरक भाव व्यक्त कर सकता है; 'असहनीय' ἀνεκτρίστῳ की तीव्रता बनाए रखता है।
theological_decisions:
- issue: धर्मी पीड़ितों और उनके सताने वालों के बीच नैतिक विरोध
  choice: धर्मी, अधर्मी, अपवित्र, उल्लंघन करने वाले, घिनौने और अन्यायी जैसे पृथक पद बनाए रखे गए
  alternative: सभी विरोधी पदों को सामान्य रूप से 'दुष्ट लोग' कहना
  rationale: मूल यूनानी क्रमशः अलग नैतिक विशेषणों का प्रयोग करता है; उन्हें एक शब्द में समेटना लेखक की संचयी निंदा और अलंकारिक समानांतरता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य-पाठक-सुलभ शैली रखी गई है। आरंभिक खंडों में डैश और अर्धविराम द्वारा यूनानी की पुनरुक्त समानांतर संरचना उभारी गई है। अंतिम दो खंड प्राकृतिक हिन्दी के लिए कर्तृवाच्य में रखे गए हैं, जबकि पीड़ितों पर हुए अत्याचार का क्रम स्पष्ट बना रहता है।
