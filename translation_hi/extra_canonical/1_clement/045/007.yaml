source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ ὑπὸ τῶν θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν τοῦ ὑψίστου κατείρχθησαν εἰς κάμινον πυρός, μηδὲ ταῦτα τοῦτο γένοιτο. τίνες οὖν οἱ ταῦτα δράσαντες; οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις εἰς τοσοῦτο ἐξήρισαν θυμοῦ, ὥστε τοὺς ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει δουλεύοντας τῷ θεῷ εἰς αἰκίαν περιβαλεῖν, μὴ εἰδότες, ὅτι ὁ ὕψιστος ὑπέρμαχος καὶ ὑπερασπιστής ἐστιν τῶν ἐν καθαρᾷ συνειδήσει λατρευόντων τῷ παναρέτῳ ὀνόματι αὐτοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/007.yaml
  text: Or were Hananiah and Azariah and Mishael cast down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? The hateful[a], and those full of every evil, were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is the champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.
translation:
  language: hi
  text: या क्या हनन्याह, अजर्याह और मीशाएल को उन लोगों ने आग की भट्ठी में बंद किया था, जो परमप्रधान के भव्य और महिमामय धर्म का पालन करते थे? ऐसा कभी न हो! तो फिर ये काम करनेवाले कौन थे? वे घृणित और हर प्रकार की बुराई से भरे हुए लोग थे। वे क्रोध में इस हद तक भड़क उठे कि उन्होंने उन लोगों को दुर्व्यवहार का शिकार बनाया, जो पवित्र और निर्दोष संकल्प से परमेश्वर की सेवा करते थे। वे नहीं जानते थे कि परमप्रधान उन लोगों का पक्ष लेनेवाला और रक्षक है, जो शुद्ध विवेक से उसके सर्वगुणसंपन्न नाम की आराधना करते हैं। उसी की महिमा युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατείρχθησαν
  choice: बंद किया था
  rationale: क्रिया κατείργω का अर्थ भीतर बंद करना, सीमित करना या कैद करना है; इसलिए ‘नीचे फेंका’ की अपेक्षा यह स्रोत के अधिक निकट है।
- source_word: θρησκευόντων ... θρησκείαν
  choice: धर्म का पालन करते थे
  rationale: यहाँ क्रिया और संज्ञा धार्मिक आचरण/उपासना-पद्धति के पालन को व्यक्त करती हैं; सरल आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: ἐξήρισαν θυμοῦ
  choice: क्रोध में ... भड़क उठे
  rationale: वाक्यांश अत्यधिक रोष तक उकसाए या उत्तेजित होने का भाव देता है।
- source_word: εἰς αἰκίαν περιβαλεῖν
  choice: दुर्व्यवहार का शिकार बनाया
  rationale: αἰκία अपमानजनक या हिंसक दुर्व्यवहार को सूचित करता है; हिन्दी अभिव्यक्ति जानबूझकर इसकी व्यापकता बनाए रखती है।
- source_word: ὑπέρμαχος καὶ ὑπερασπιστής
  choice: पक्ष लेनेवाला और रक्षक
  rationale: दोनों पद सक्रिय समर्थन और रक्षा के निकटवर्ती किंतु अलग पहलुओं को बनाए रखते हैं।
- source_word: παναρέτῳ ὀνόματι
  choice: सर्वगुणसंपन्न नाम
  rationale: παναρέτος का शाब्दिक भाव ‘समस्त सद्गुणों से युक्त’ है; इसे केवल ‘पवित्र’ कहने से विशिष्ट अर्थ घट जाता।
theological_decisions:
- issue: भट्ठी में डालनेवालों की धार्मिक पहचान
  choice: प्रश्न को स्रोत के विरोधाभासी रूप में यथावत रखा गया और तुरंत ‘ऐसा कभी न हो’ से नकारा गया।
  alternative: वाक्य को व्याख्यात्मक ढंग से बदलकर कहना कि सच्चे उपासकों ने ऐसा नहीं किया।
  rationale: मूल यूनानी अलंकारिक प्रश्न और तीव्र निषेध के द्वारा नैतिक विरोध स्थापित करता है; इसे खुलकर समझा देना उसकी शैली और तनाव को मिटा देता।
- issue: दिव्य उपाधि ὁ ὕψιστος
  choice: परमप्रधान
  alternative: सर्वोच्च परमेश्वर
  rationale: ‘परमप्रधान’ बाइबलीय हिन्दी में स्पष्ट, प्रतिष्ठित और संक्षिप्त उपाधि है।
- issue: नाम की आराधना
  choice: उसके ... नाम की आराधना करते हैं
  alternative: उसकी आराधना करते हैं
  rationale: स्रोत में ‘नाम’ स्पष्ट रूप से उपस्थित है; धर्मवैचारिक असहजता के कारण इसे हटाया नहीं गया।
- issue: अंतिम संबंधवाचक ᾧ
  choice: उसी की महिमा
  alternative: जिसकी महिमा
  rationale: निकटतम अभिप्राय परमप्रधान परमेश्वर है; स्वतंत्र हिन्दी वाक्य समापन को स्वाभाविक बनाता है, बिना संदर्भ बदले।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। नामों के रूप यूनानी Ἀνανίας, Ἀζαρίας और Μισαήλ के निकट रखे गए हैं। अलंकारिक प्रश्न, नैतिक विरोध और उपासना-संबंधी शब्दावली सुरक्षित रखी गई है।
