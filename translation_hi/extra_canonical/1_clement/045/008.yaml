base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/008.yaml
  text: But those who endured in confidence inherited glory and honor[a], and were exalted, and were enrolled by God in their memorial forever and ever[b]. Amen.
translation:
  language: hi
  text: परन्तु जिन्होंने भरोसे के साथ धीरज धरा, उन्होंने महिमा और आदर विरासत में पाए, वे ऊँचे उठाए गए, और परमेश्वर ने उन्हें उनके स्मरण के अभिलेख में सदा-सर्वदा के लिए दर्ज किया। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένοντες
  choice: जिन्होंने ... धीरज धरा
  rationale: वर्तमान कृदन्त का समय यहाँ मुख्य अओरिस्ट क्रियाओं और पिछले ऐतिहासिक प्रसंग से निर्धारित होता है; इसलिए हिन्दी में भूतकाल रखा गया है।
- source_word: ἐν πεποιθήσει
  choice: भरोसे के साथ
  rationale: πεποίθησις दृढ़ विश्वास या भरोसे का भाव देता है; यह सरल और स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἐκληρονόμησαν
  choice: पाया
  rationale: शाब्दिक अर्थ ‘विरासत में पाया’ है, पर महिमा और आदर के साथ हिन्दी में ‘पाया’ अधिक स्वाभाविक है और प्राप्ति का मूल भाव बनाए रखता है।
- source_word: ἐπήρθησαν
  choice: ऊँचे उठाए गए
  rationale: कर्मवाच्य और उन्नत किए जाने—दोनों भावों को बनाए रखता है।
- source_word: ἔγγραφοι ἐγένοντο
  choice: नाम ... लिख दिया
  rationale: यूनानी का भाव किसी अभिलेख में दर्ज या नामांकित किए जाने का है; हिन्दी में यह स्वाभाविक कर्मवाच्य-समान अभिव्यक्ति है।
- source_word: μνημοσύνῳ
  choice: स्मरण-पत्र
  rationale: यह स्मरण के अभिलेख या स्मारक-लेख का संकेत दे सकता है; ‘स्मरण-पत्र’ अभिलेखीय भाव को संक्षेप में व्यक्त करता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: सदा-सर्वदा के लिए
  rationale: इस रूढ़ यूनानी कालवाचक वाक्यांश का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: ἐν τῷ μνημοσύνῳ αὐτῶν में αὐτῶν का संबंध
  choice: परमेश्वर के स्मरण-पत्र में उनका नाम
  alternative: उनके स्मारक में परमेश्वर द्वारा दर्ज किए गए
  rationale: αὐτῶν को उनके विषय में स्मरण के वस्तुगत संबंध के रूप में समझना प्रसंग में अधिक संगत है; साथ ही ‘स्मरण-पत्र’ मूल पद की अभिलेख/स्मरण संबंधी अस्पष्टता को कुछ हद तक बनाए रखता है।
- issue: दिव्य कर्मवाच्य का कर्ता
  choice: परमेश्वर ने ... लिख दिया
  alternative: परमेश्वर द्वारा ... लिखे गए
  rationale: ἀπὸ τοῦ θεοῦ परमेश्वर को कर्ता बताता है; सक्रिय हिन्दी वाक्य अधिक सहज है और आशय नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘परन्तु’, ‘महिमा’, ‘आदर’, ‘सदा-सर्वदा’ और ‘आमीन’ जैसे परिचित धार्मिक शब्द रखे गए हैं, पर वाक्य-विन्यास को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
