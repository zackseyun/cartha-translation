  text: You are contentious, brothers, and zealous about the things that pertain to salvation.
translation:
  language: hi
  text: भाइयो, तुम विवादप्रिय हो और उद्धार से संबंधित बातों के विषय में उत्साही हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φιλόνεικοί
  choice: वाद-विवाद करनेवाले
  rationale: यह शब्द झगड़ालू या विवादप्रिय होने का नकारात्मक भाव रखता है; संदर्भ में स्वाभाविक हिंदी रखते हुए इस भाव को सुरक्षित रखा गया है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: समुदाय को संबोधित करनेवाले यूनानी बहुवचन का सीधा और परंपरागत हिंदी रूप।
- source_word: ζηλωταὶ
  choice: उत्साही
  rationale: यहाँ किसी विषय के प्रति प्रबल लगाव या जोश का सामान्य अर्थ उपयुक्त है; 'ईर्ष्यालु' संदर्भानुकूल नहीं है।
- source_word: τῶν ἀνηκόντων εἰς σωτηρίαν
  choice: उद्धार से संबंधित बातों
  rationale: वाक्यांश का व्यापक अर्थ रखा गया है और यह तय नहीं किया गया कि संकेत विशेष शिक्षाओं, आचरणों या विषयों की ओर है।
theological_decisions:
- issue: उद्धार से संबंधित बातों का दायरा
  choice: व्यापक और अनिर्दिष्ट रखा गया
  alternative: उद्धार के साधनों या उद्धारकारी शिक्षाओं के रूप में विशिष्ट करना
  rationale: मूल यूनानी केवल उन बातों की ओर संकेत करता है जो उद्धार से संबंध रखती हैं; वह उनके स्वरूप को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट हिंदी; पहले खंड की आलोचनात्मक ध्वनि तथा दूसरे खंड के उत्साह के बीच मूल तनाव बनाए रखा गया है।
