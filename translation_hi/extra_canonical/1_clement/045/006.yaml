  text: For what shall we say, brothers? Was Daniel thrown into a den of lions by those who feared God?
translation:
  language: hi
  text: क्योंकि, भाइयो, हम क्या कहें? क्या दानिय्येल को परमेश्वर का भय मानने वालों ने सिंहों की माँद में फेंका था?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ εἴπωμεν
  choice: क्योंकि हम क्या कहें
  rationale: γὰρ के कारणसूचक संबंध और विचारोत्तेजक प्रश्न, दोनों को निकटता से बनाए रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: समुदाय को किए गए प्रत्यक्ष संबोधन का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: τῶν φοβουμένων τὸν θεόν
  choice: परमेश्वर का भय मानने वालों
  rationale: बाइबलीय मुहावरे में श्रद्धापूर्ण भय का अर्थ सुरक्षित रखता है; इसे केवल ‘भक्तों’ के रूप में व्याख्यायित नहीं करता।
- source_word: λάκκον λεόντων
  choice: सिंहों की माँद
  rationale: दानिय्येल की कथा से परिचित स्वाभाविक हिन्दी अभिव्यक्ति, जबकि मूल के ‘सिंहों के गड्ढे’ का आशय स्पष्ट रहता है।
- source_word: ἐβλήθη
  choice: फेंका था
  rationale: यूनानी के कर्मवाच्य और अतीतकालीन घटना को प्रश्न के भीतर सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर का भय मानने वालों’ से जुड़े प्रश्न का व्यंग्यार्थ
  choice: प्रश्न को प्रश्न ही रखा गया है
  alternative: स्पष्ट निषेध के रूप में ‘निश्चय ही नहीं’ जोड़ना
  rationale: मूल में निहित अपेक्षित नकारात्मक उत्तर स्पष्ट है, पर लेखक ने उसे आलंकारिक प्रश्न के रूप में रखा है; अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और बाइबलीय संदर्भ के अनुकूल। ‘भाइयो’ सामुदायिक संबोधन है और ‘परमेश्वर का भय मानना’ पारंपरिक धार्मिक मुहावरे को बिना अतिरिक्त सांप्रदायिक व्याख्या के बनाए रखता है।
