id: 1CLEM.10.2
reference: 1 Clement 10:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος δὲ ὑπακοῇ ἐξῆλθεν ἐκ τῆς γῆς αὐτοῦ καὶ ἐκ τῆς συγγενείας αὐτοῦ καὶ ἐκ τοῦ οἴκου τοῦ πατρὸς αὐτοῦ, ὅπως γῆν ὀλίγην καὶ συγγένειαν ἀσθενῆ καὶ οἶκον μικρὸν καταλιπὼν κληρονομήσῃ τὰς ἐπαγγελίας τοῦ θεοῦ. λέγει γὰρ αὐτῷ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/002.yaml
  text: And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a little land and a weak kindred and a small house, he might inherit the promises of God. For he says to him,
translation:
  language: hi
  text: और उसने आज्ञा मानकर अपने देश, अपने कुटुम्ब और अपने पिता के घर से प्रस्थान किया, ताकि थोड़ी-सी भूमि, निर्बल कुटुम्ब और छोटा-सा घर पीछे छोड़कर वह परमेश्वर की प्रतिज्ञाओं का वारिस बने। क्योंकि परमेश्वर उससे कहता है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακοῇ
  choice: आज्ञा मानकर
  rationale: यहाँ दत्तिव आज्ञाकारिता के भाव अथवा आधार को व्यक्त करता है; आधुनिक हिन्दी में क्रियात्मक रूप स्वाभाविक और स्पष्ट है।
- source_word: συγγενείας
  choice: कुटुम्ब
  rationale: शब्द का अर्थ रक्त-संबंधियों या वंश-समुदाय से है; ‘कुटुम्ब’ दोनों प्रसंगों में इस सामूहिक अर्थ को संक्षेप में बनाए रखता है।
- source_word: οἴκου
  choice: घर
  rationale: यह परिवार/गृहस्थाने के साथ सामाजिक इकाई का अर्थ भी रख सकता है; ‘घर’ हिन्दी में इस अर्थ-विस्तार को सुरक्षित रखता है।
- source_word: κληρονομήσῃ
  choice: वारिस बने
  rationale: क्रिया उत्तराधिकार में प्राप्त करने का भाव रखती है; ‘प्रतिज्ञाओं का वारिस बने’ धार्मिक और उत्तराधिकार-संबंधी दोनों अर्थ बनाए रखता है।
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञाओं
  rationale: बहुवचन को यथावत रखा गया है और परमेश्वर द्वारा दिए गए आश्वासनों के लिए प्रचलित, गरिमापूर्ण शब्द चुना गया है।
theological_decisions:
- issue: आज्ञाकारिता और प्रतिज्ञाओं की विरासत के बीच संबंध
  choice: ‘ताकि ... वारिस बने’ द्वारा उद्देश्य/परिणाम का संबंध बनाए रखा
  alternative: ‘और इस प्रकार उसने ... प्राप्त कीं’
  rationale: ग्रीक ὅπως के उद्देश्य अथवा अपेक्षित परिणाम को निर्णायक रूप से केवल कारण-परिणाम में नहीं बदला गया।
- issue: λέγει γὰρ αὐτῷ में अव्यक्त कर्ता
  choice: ‘परमेश्वर उससे कहता है’
  alternative: ‘क्योंकि वह उससे कहता है’
  rationale: पूर्ववर्ती ‘परमेश्वर की प्रतिज्ञाओं’ और आगे आने वाले दैवी उद्धरण से कर्ता परमेश्वर स्पष्ट है; हिन्दी में केवल ‘वह’ संदिग्ध होता। वर्तमान काल भी ग्रीक λέγει के अनुरूप रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। मूल की त्रिस्तरीय समानांतर रचना—देश, कुटुम्ब, पिता का घर / थोड़ी भूमि, निर्बल कुटुम्ब, छोटा घर—सुरक्षित रखी गई है। अंतिम अल्पविराम आगामी उद्धरण से वाक्य के जुड़ाव को दर्शाता है।
