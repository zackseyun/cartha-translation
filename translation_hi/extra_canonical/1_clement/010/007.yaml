base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/007.yaml
  text: Because of faith and hospitality a son was given to him in old age[a], and through obedience he offered him as a sacrifice to God on one of the mountains that he had shown him.
translation:
  language: hi
  text: विश्वास और अतिथि-सत्कार के कारण उसे बुढ़ापे में एक पुत्र दिया गया; और आज्ञापालन के द्वारा उसने उसे परमेश्वर को बलिदान के रूप में उन पहाड़ों में से एक पर चढ़ाया, जिन्हें परमेश्वर ने उसे दिखाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστιν
  choice: विश्वास
  rationale: यह πίστις का स्वाभाविक और प्रचलित हिन्दी समतुल्य है।
- source_word: φιλοξενίαν
  choice: अतिथि-सत्कार
  rationale: यह अपरिचितों और अतिथियों का स्वागत करने के भाव को स्पष्ट तथा संक्षिप्त रूप में व्यक्त करता है।
- source_word: ἐν γήρᾳ
  choice: बुढ़ापे में
  rationale: यूनानी पद का सीधा, स्वाभाविक और सर्वसुलभ हिन्दी रूप।
- source_word: διʼ ὑπακοῆς
  choice: आज्ञापालन के कारण
  rationale: यहाँ διά के साथ संबंध/प्रेरक आधार को व्यक्त करता है और ὑπακοή का नैतिक अर्थ सुरक्षित रखता है।
- source_word: προσήνεγκεν ... θυσίαν
  choice: बलिदान के रूप में ... चढ़ाया
  rationale: बलिदान चढ़ाने के धार्मिक प्रसंग में προσφέρω का स्वाभाविक हिन्दी प्रयोग।
- source_word: πρὸς ἓν τῶν ὀρέων
  choice: उन पहाड़ों में से एक पर
  rationale: गंतव्यसूचक πρός को प्रसंगानुसार स्थान के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: सापेक्ष उपवाक्य ὧν ἔδειξεν αὐτῷ में कर्ता की पहचान
  choice: जिसे परमेश्वर ने उसे दिखाया था
  alternative: जो उसे दिखाया गया था / जिसे उसने उसे दिखाया था
  rationale: यूनानी में कर्ता अंतर्निहित है, पर निकटवर्ती τῷ θεῷ और उत्पत्ति 22 के संदर्भ से परमेश्वर स्पष्ट अभिप्रेत है। हिन्दी में दोहरे ‘उसने/उसे’ से उत्पन्न कृत्रिम अस्पष्टता से बचने हेतु नाम स्पष्ट किया गया है। ‘दिखाया था’ पूर्वकालिक क्रम को भी दर्शाता है।
- issue: अब्राहम द्वारा पुत्र को बलिदान चढ़ाने का वर्णन
  choice: उसे ... बलिदान के रूप में ... चढ़ाया
  alternative: उसे बलिदान करने के लिए चढ़ाया
  rationale: मूल पाठ घटना को पूर्ण क्रिया के रूप में वर्णित करता है; अनुवाद उसी कथन को बनाए रखता है और कथा के परिणाम को इस पद में जोड़कर तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध धार्मिक गद्य। समानांतर ‘विश्वास और अतिथि-सत्कार के कारण’ तथा ‘आज्ञापालन के कारण’ संरचना मूल के आलंकारिक संतुलन को बनाए रखती है।
