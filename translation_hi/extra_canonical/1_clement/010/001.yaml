source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀβραὰμ, ὁ φίλος προσαγορευθείς, πιστὸς εὑρέθη ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι τοῖς ῥήμασιν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/001.yaml
  text: Abraham, who was called the friend, was found faithful by becoming obedient to the words of God.
translation:
  language: hi
  text: अब्राहम, जो “मित्र” कहलाए, परमेश्वर के वचनों के आज्ञाकारी बनकर विश्वासयोग्य पाए गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बात में विश्वासयोग्य पाए गए कि वे परमेश्वर के वचनों के आज्ञाकारी बने।”
    reason: ἐν के साथ सप्रत्यय क्रियारूप विश्वासयोग्यता के साधन के साथ-साथ उस परिस्थिति अथवा क्षेत्र को भी व्यक्त कर सकता है जिसमें वह प्रकट हुई।
lexical_decisions:
- source_word: ὁ φίλος
  choice: “मित्र”
  rationale: निश्चित पद सहित यह उपाधि के रूप में प्रयुक्त है; उद्धरण-चिह्न हिंदी में उसके उपाधिसूचक भाव को स्वाभाविक ढंग से दिखाते हैं।
- source_word: πιστὸς εὑρέθη
  choice: विश्वासयोग्य पाए गए
  rationale: यह यूनानी निष्क्रिय अभिव्यक्ति के अर्थ और मूल्यांकनात्मक भाव—विश्वसनीय अथवा निष्ठावान सिद्ध होना—दोनों को बनाए रखता है।
- source_word: ὑπήκοον γενέσθαι
  choice: आज्ञाकारी बनकर
  rationale: γενέσθαι के ‘बनना’ और ὑπήκοον के आज्ञापालन-संबंधी अर्थ को संक्षिप्त, स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: τοῖς ῥήμασιν τοῦ θεοῦ
  choice: परमेश्वर के वचनों के
  rationale: बहुवचन ῥήμασιν को ‘वचनों’ से दर्शाया गया है; ‘के आज्ञाकारी’ आधुनिक मानक हिंदी में स्वाभाविक संबंधसूचक प्रयोग है।
theological_decisions:
- issue: ἐν τῷ के कारण आज्ञाकारिता और विश्वासयोग्यता का संबंध
  choice: आज्ञाकारी बनकर
  alternative: इस बात में कि वे आज्ञाकारी बने
  rationale: यह रचना साधन अथवा साथ घटित परिस्थिति दोनों का संकेत दे सकती है। मुख्य पाठ में स्वाभाविक साधनगत अर्थ रखा गया है, जबकि पादटिप्पणी वास्तविक वैकल्पिक संरचना को सुरक्षित रखती है।
- issue: ‘मित्र’ किसका मित्र है
  choice: केवल “मित्र”
  alternative: परमेश्वर का मित्र
  rationale: यूनानी पाठ में φίλος के साथ स्पष्ट संबंधसूचक पद नहीं है। बाइबिलीय संकेत परमेश्वर की ओर हो सकता है, पर उसे मुख्य पाठ में जोड़ना मूल की अंतर्निहितता को अनावश्यक रूप से स्पष्ट कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। सम्मानसूचक बहुवचन क्रियारूप ‘कहलाए/पाए गए’ हिंदी की प्रचलित धार्मिक-ऐतिहासिक शैली के अनुरूप हैं।
