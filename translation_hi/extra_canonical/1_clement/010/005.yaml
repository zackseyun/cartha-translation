  text: καὶ ποιήσω τὸ σπέρμα σου ὡς τὴν ἄμμον τῆς γῆς· εἰ δύναταί τις ἐξαριθμῆσαι τὴν ἄμμον τῆς γῆς, καὶ τὸ σπέρμα σου ἐξαριθμηθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/005.yaml
  text: And I will make your seed like the sand of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.”
translation:
  language: hi
  text: “और मैं तुम्हारे वंश को पृथ्वी की रेत के समान कर दूँगा। यदि कोई पृथ्वी की रेत को गिन सके, तो तुम्हारा वंश भी गिना जा सकेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα
  choice: वंश
  rationale: यहाँ एकवचन सामूहिक अर्थ में अब्राहम की भावी संतान या वंश को दर्शाता है; आधुनिक हिन्दी में ‘वंश’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἄμμον τῆς γῆς
  choice: पृथ्वी की धूल के कण
  rationale: यद्यपि ἄμμος सामान्यतः ‘रेत’ है, यह उद्धरण उत्पत्ति 13:16 के उस बिंब को प्रस्तुत करता है जिसमें भूमि की धूल के असंख्य कण अभिप्रेत हैं; ‘धूल के कण’ तुलना की गणनीयता और स्रोत-संदर्भ दोनों को स्पष्ट रखता है।
- source_word: ἐξαριθμῆσαι / ἐξαριθμηθήσεται
  choice: गिन सके / गिना जा सकेगा
  rationale: मूल की सक्रिय और कर्मवाच्य समानांतर रचना को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: σπέρμα का सामूहिक अथवा व्यक्तिगत अर्थ
  choice: सामूहिक ‘वंश’
  alternative: ‘संतान’ या व्यक्तिगत ‘वंशज’
  rationale: इस पद में असंख्य होने की तुलना सामूहिक उत्तराधिकारियों की ओर संकेत करती है; किसी एक विशिष्ट वंशज का अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यकाल और शर्तवाचक संरचना मूल यूनानी के निकट हैं। उद्धरण को दर्शाने के लिए आरंभ और अंत में उद्धरण-चिह्न दिए गए हैं।
