id: 1CLEM.10.4
reference: 1 Clement 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν ἐν τῷ διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ εἶπεν αὐτῷ ὁ θεός· Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε ἀπὸ τοῦ τόπου, οὗ νῦν σὺ εἶ, πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν, ὅτι πᾶσαν τὴν γῆν, ἣν σὺ ὁρᾷς, σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/004.yaml
  text: And again[a], when he was separated from Lot, God said to him, “Lift up your eyes and look from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see I will give to you and to your seed forever.”
translation:
  language: hi
  text: और फिर, जब वह लूत से अलग हुआ, तब परमेश्वर ने उससे कहा, “अपनी आँखें उठाकर उस स्थान से, जहाँ तू अब है, उत्तर, दक्षिण, पूर्व और समुद्र की ओर देख; क्योंकि जितनी भूमि तू देख रहा है, वह सब मैं तुझे और तेरे वंश को सदा के लिए दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ
  choice: जब वह लूत से अलग हुआ
  rationale: रूप व्याकरणतः कर्मवाच्य है, पर यहाँ अर्थ अकर्मक/मध्यवाच्य है—लूत से अलग होना। यह हिन्दी में किसी बाहरी कर्ता द्वारा अलग किए जाने का अनावश्यक संकेत नहीं देता।
- source_word: Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε
  choice: अपनी आँखें उठाकर … देख
  rationale: मुहावरे की दृश्यात्मकता और दो क्रियाओं का क्रम बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: λίβα
  choice: दक्षिण
  rationale: दिशासूचक प्रयोग में λίψ/λίβα दक्षिण-पश्चिम से संबद्ध हो सकता है, किंतु उत्पत्ति के उद्धृत संदर्भ और चार प्रमुख दिशाओं के क्रम में यहाँ दक्षिण अभिप्रेत है।
- source_word: θάλασσαν
  choice: समुद्र
  rationale: यूनानी शब्द का प्रत्यक्ष अर्थ ‘समुद्र’ है; पश्चिम दिशा का संकेत निहित होने पर भी उसे स्पष्ट ‘पश्चिम’ बनाकर मूल बिंब नहीं हटाया गया।
- source_word: σπέρματί σου
  choice: तेरे वंश
  rationale: शाब्दिक ‘बीज’ की अपेक्षा वंशजों के सामूहिक अर्थ को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕως αἰῶνος
  choice: सदा के लिए
  rationale: इस वाक्य में दीर्घकालिक/स्थायी प्रतिज्ञा का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अब्राहम का लूत से अलग होना
  choice: वह लूत से अलग हुआ
  alternative: वह लूत से अलग किया गया
  rationale: कर्मवाच्य रूप को यांत्रिक रूप से हिन्दी कर्मवाच्य बनाने पर बाहरी कर्ता का भाव आ सकता है; संदर्भ में क्रिया का अकर्मक/मध्यवाच्य अर्थ अधिक उपयुक्त है।
- issue: σπέρμα का सामूहिक अर्थ
  choice: वंश
  alternative: बीज
  rationale: यहाँ भूमि की प्रतिज्ञा अब्राहम के वंशजों से संबंधित है; ‘वंश’ अर्थ स्पष्ट करता है, बिना आगे की धर्मवैचारिक व्याख्या जोड़े।
- issue: समुद्र और पश्चिम दिशा का संबंध
  choice: समुद्र
  alternative: पश्चिम
  rationale: मूल पाठ की भौगोलिक अभिव्यक्ति सुरक्षित रखी गई है; पश्चिम का आशय पाठक संदर्भ से समझ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। प्रत्यक्ष ईश्वरीय वचन में ‘तू/तेरे’ रखा गया है, जो बाइबलीय हिन्दी में एकवचन संबोधन को स्पष्ट और स्वाभाविक बनाता है। मूल के ‘और फिर’ तथा दिशाओं के क्रम को सुरक्षित रखा गया है।
