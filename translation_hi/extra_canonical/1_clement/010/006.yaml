  text: καὶ πάλιν λέγει· Ἐξήγαγεν ὁ θεὸς τὸν Ἀβραὰμ καὶ εἶπεν αὐτῷ· Ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἀρίθμησον τοὺς ἀστέρας, εἰ δυνήσῃ ἐξαριθμῆσαι αὐτούς· οὕτως ἔσται τὸ σπέρμα σου. ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/006.yaml
  text: And again he says[a], “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your offspring be.’ And Abraham believed God, and it was counted to him as righteousness.”
translation:
  language: hi
  text: और फिर वह कहता है, “परमेश्वर अब्राहम को बाहर ले गया और उससे कहा, ‘आकाश की ओर देख और तारों को गिन, यदि तू उन्हें गिन सके; तेरा वंश भी ऐसा ही होगा।’ और अब्राहम ने परमेश्वर पर विश्वास किया, और उसका विश्वास उसके लिए धार्मिकता ठहरा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνάβλεψον
  choice: दृष्टि उठा
  rationale: ऊपर, आकाश की ओर देखने की आज्ञा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: σπέρμα
  choice: वंश
  rationale: यहाँ एकवचन सामूहिक अर्थ में अब्राहम की भावी संतान या वंश को दर्शाता है; ‘बीज’ की अपेक्षा ‘वंश’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: ἐπίστευσεν ... τῷ θεῷ
  choice: परमेश्वर पर विश्वास किया
  rationale: यूनानी दत्तिव के विश्वास/भरोसे के संबंध को हिन्दी की स्वाभाविक अभिव्यक्ति में प्रस्तुत करता है।
- source_word: ἐλογίσθη ... εἰς δικαιοσύνην
  choice: यह उसके लिए धार्मिकता गिना गया
  rationale: लेखा मानने की रूपकात्मक भाषा और धार्मिकता के रूप में माने जाने का अर्थ, दोनों बनाए रखता है।
theological_decisions:
- issue: उद्धरण की सीमा
  choice: ‘और अब्राहम ने...’ को उसी शास्त्रीय उद्धरण के भीतर रखा गया है
  alternative: इसे क्लेमेंट की अपनी कथात्मक टिप्पणी के रूप में उद्धरण के बाहर रखना
  rationale: यूनानी पाठ में καὶ πάλιν λέγει के बाद उत्पत्ति 15:5–6 का सतत उद्धरण है।
- issue: σπέρμα का सामूहिक एकवचन
  choice: वंश
  alternative: संतान या बीज
  rationale: ‘वंश’ सामूहिक अर्थ और प्रतिज्ञा की वंशगत दिशा को बनाए रखता है, बिना किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को आरोपित किए।
- issue: εἰς δικαιοσύνην का संबंध
  choice: धार्मिकता गिना गया
  alternative: धार्मिकता के लिए गिना गया
  rationale: हिन्दी में यह अधिक स्वाभाविक है और पाठ के लेखांकन रूपक को सुरक्षित रखते हुए परिणाम को अनावश्यक रूप से नहीं समझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। परमेश्वर के संबोधन में एकवचन ‘तू’ रखा गया है, क्योंकि मूल यूनानी में एकवचन आज्ञाएँ हैं और बाइबिलीय प्रत्यक्ष वचन में यह स्वाभाविक है।
