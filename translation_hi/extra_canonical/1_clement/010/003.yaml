id: 1CLEM.10.3
reference: 1 Clement 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄπελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ ποιήσω σε εἰς ἔθνος μέγα καὶ εὐλογήσω σε καὶ μεγαλυνῶ τὸ ὄνομά σου, καὶ ἔσῃ εὐλογημένος· καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε καὶ καταράσομαι τοὺς καταρωμένους σε, καὶ εὐλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/003.yaml
  text: “Depart from your land and from your kindred and from your father’s house to the land that I will show you; and I will make you into a great nation[a], and I will bless you and magnify your name, and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.”
translation:
  language: hi
  text: “अपने देश, अपने कुटुम्ब और अपने पिता के घर से निकलकर[a] उस देश में चला जा, जिसे मैं तुझे दिखाऊँगा। मैं तुझसे एक महान राष्ट्र बनाऊँगा, तुझे आशीष दूँगा और तेरे नाम को महान करूँगा; और तू आशीषित होगा। जो तुझे आशीष देते हैं, उन्हें मैं आशीष दूँगा, और जो तुझे शाप देते हैं, उन्हें मैं शाप दूँगा; और पृथ्वी के सभी कुल तुझमें आशीष पाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निकल जा।”
    reason: Ἄπελθε का मुख्य अर्थ ‘चला जा/प्रस्थान कर’ है; ‘निकल जा’ एक सम्भव वैकल्पिक, अधिक संक्षिप्त अभिव्यक्ति है।
lexical_decisions:
- source_word: Ἄπελθε
  choice: निकलकर ... चला जा
  rationale: ἀπέρχομαι का आदेश यहाँ किसी स्थान को छोड़कर जाने का भाव देता है। यह स्वाभाविक हिन्दी में स्रोत के ‘depart/go away’ अर्थ को व्यक्त करता है, जबकि केवल ‘बाहर निकल’ कहने से ἐξέρχομαι वाला विशिष्ट भाव आ सकता था।
- source_word: συγγενείας
  choice: कुटुम्ब
  rationale: यहाँ शब्द व्यापक रिश्तेदारी अथवा कुल-परिवार को सूचित करता है; ‘कुटुम्ब’ आधुनिक गरिमामय हिन्दी में उस दायरे को संक्षेप में रखता है।
- source_word: φυλαὶ
  choice: कुल
  rationale: φυλή का अर्थ यहाँ पृथ्वी के जनसमूहों/वंशगत कुलों से है; ‘कुल’ स्रोत की सामुदायिक और वंशगत छाया बनाए रखता है।
- source_word: εὐλογηθήσονται
  choice: आशीष पाएँगे
  rationale: ग्रीक कर्मवाच्य को स्वाभाविक हिन्दी में कर्मवाच्य अर्थ के साथ रखा गया है; इससे आशीष देने वाले कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ἔσῃ εὐλογημένος का अर्थ
  choice: तू आशीषित होगा
  alternative: तू आशीष का कारण होगा / तू आशीष होगा
  rationale: पाठ में εὐλογημένος स्पष्ट रूप से ‘आशीषित’ है; इसे संज्ञात्मक ‘आशीष होगा’ बनाना स्रोत की अभिव्यक्ति को बदल देता।
- issue: ἐν σοὶ में आशीष का संबंध
  choice: तुझमें आशीष पाएँगे
  alternative: तेरे द्वारा आशीष पाएँगे
  rationale: ἐν की वास्तविक अस्पष्टता को बनाए रखने के लिए ‘तुझमें’ रखा गया है; ‘तेरे द्वारा’ साधनात्मक अर्थ को निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठकों के लिए सुबोध रखी गई है। प्रत्यक्ष ईश्वरीय संबोधन में पारंपरिक एकवचन ‘तू/तुझे/तेरे’ का प्रयोग किया गया है।
