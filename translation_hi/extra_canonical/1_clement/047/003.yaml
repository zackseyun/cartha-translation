base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/003.yaml
  text: In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had made partialities.
translation:
  language: hi
  text: वास्तव में, उसने तुम्हें आत्मिक रीति से अपने विषय में, केफ़ा के विषय में और अपुल्लोस के विषय में लिखा था, क्योंकि उस समय भी तुमने पक्षधरियाँ बना रखी थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: वास्तव में
  rationale: यह यूनानी पद कथन की सत्यता पर बल देता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: πνευματικῶς
  choice: आत्मिक रीति से
  rationale: क्रियाविशेषण को उसी रूप में रखा गया है; इसे सीधे ‘आत्मा में’ बनाकर अनावश्यक रूप से पवित्र आत्मा का स्पष्ट संदर्भ नहीं जोड़ा गया।
- source_word: ἐπέστειλεν
  choice: लिखा था
  rationale: यह पत्र लिखने/भेजने की क्रिया है; हिन्दी में प्रसंगानुकूल ‘लिखा था’ सहज है।
- source_word: Κηφᾶ
  choice: कैफा
  rationale: व्यक्तिनाम के यूनानी रूप का प्रचलित हिन्दी लिप्यंतरण।
- source_word: Ἀπολλώ
  choice: अपुल्लोस
  rationale: व्यक्तिनाम के यूनानी रूप का प्रचलित हिन्दी लिप्यंतरण।
- source_word: προσκλίσεις
  choice: पक्षपातपूर्ण गुट
  rationale: शब्द झुकाव, पक्षधरता या दलगत अनुराग का संकेत देता है; ‘पक्षपातपूर्ण गुट’ कुरिन्थ की दलगत स्थिति को स्पष्ट करते हुए इस अर्थक्षेत्र को बनाए रखता है।
- source_word: πεποιῆσθαι
  choice: बना लिए थे
  rationale: मध्यवाच्य पूर्णकाल का परिणामकारी भाव दर्शाता है कि उन्होंने अपने बीच ऐसी दलगत पक्षधरता स्थापित कर ली थी।
theological_decisions:
- issue: πνευματικῶς का आशय
  choice: आत्मिक रीति से
  alternative: पवित्र आत्मा की प्रेरणा से
  rationale: मूल पाठ क्रियाविशेषण का प्रयोग करता है और पवित्र आत्मा को स्पष्ट रूप से नामित नहीं करता; इसलिए संभावित धार्मिक अर्थ को खुला रखा गया है।
- issue: προσκλίσεις में पक्षधरता और गुटबंदी का संबंध
  choice: पक्षपातपूर्ण गुट बना लिए थे
  alternative: पक्षपात किया था
  rationale: सिर्फ व्यक्तिगत पक्षपात की अपेक्षा प्रसंग में पौलुस, कैफा और अपुल्लोस से जुड़ी दलगत पक्षधरता प्रमुख है; फिर भी ‘पक्षपातपूर्ण’ मूल शब्द के झुकाव वाले भाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली। बहुवचन संबोधन ‘तुम्हें/तुमने’ समुदाय को संबोधित करता है। वाक्य-विन्यास मूल यूनानी के विचार-क्रम के निकट रखा गया है।
