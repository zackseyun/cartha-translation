source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλ’ ἡ πρόσκλισις ἐκείνη ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν· προσεκλίθητε γὰρ ἀποστόλοις μεμαρτυρημένοις καὶ ἀνδρὶ δεδοκιμασμένῳ παρ’ αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/004.yaml
  text: But that partiality brought less sin upon you; for you inclined yourselves toward apostles who had been approved[a], and toward a man approved by them.
translation:
  language: hi
  text: परन्तु उस पक्षधरता के कारण तुम पर कम पाप आया; क्योंकि तुम ऐसे प्रेरितों की ओर झुके थे जो भली-भाँति प्रमाणित थे,[a] और एक ऐसे पुरुष की ओर जिसे उन्होंने परखकर योग्य पाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुप्रतिष्ठित प्रेरितों की ओर।”
    reason: 'μεμαρτυρημένοις के वैकल्पिक संदर्भगत अर्थ को दर्शाता है: ऐसे लोग जिनके विषय में अच्छी गवाही दी गई हो, अर्थात जो भली-भाँति प्रमाणित या सुप्रतिष्ठित हों।'
lexical_decisions:
- source_word: πρόσκλισις
  choice: पक्षधरता
  rationale: यह शब्द किसी व्यक्ति या पक्ष की ओर झुकाव अथवा पक्षपात का भाव रखता है। ‘पक्षधरता’ प्रसंग की गुटीय दिशा को व्यक्त करती है, पर इसे अत्यधिक तकनीकी नहीं बनाती।
- source_word: ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν
  choice: तुम पर कम पाप आया
  rationale: यूनानी तुलनात्मक अभिव्यक्ति ‘कम पाप’ और उस पाप के उन पर आने की छवि को बनाए रखती है; इसका अर्थ ‘कोई पाप नहीं’ नहीं किया गया।
- source_word: προσεκλίθητε
  choice: की ओर झुके थे
  rationale: यह पूर्ण भूतकालीन झुकाव को स्वाभाविक हिन्दी में व्यक्त करता है और πρόσκλισις के साथ शब्दार्थ-संबंध भी बनाए रखता है।
- source_word: μεμαρτυρημένοις
  choice: जिनके विषय में उत्तम गवाही दी गई थी
  rationale: पूर्ण कृदन्त में निहित प्रतिष्ठित या सुप्रमाणित होने का भाव रखा गया है, बिना इसे δεδοκιμασμένῳ के समान शब्द से समतल किए।
- source_word: δεδοκιμασμένῳ παρ’ αὐτοῖς
  choice: जिसे उन्होंने परखकर योग्य पाया था
  rationale: δοκιμάζω में परीक्षा और उसके सकारात्मक परिणाम, दोनों निहित हैं; यह अनुवाद दोनों को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: पहली पक्षधरता की तुलनात्मक दोषिता
  choice: कम पाप
  alternative: हल्का अपराध
  rationale: मूल पाठ स्पष्ट रूप से ἧσσον ἁμαρτίαν कहता है। ‘कम पाप’ यह तनाव बनाए रखता है कि प्रेरितों का पक्ष लेना भी वर्तमान स्थिति की तुलना में कम दोषपूर्ण था, पूरी तरह निर्दोष नहीं।
- issue: प्रेरितों और उस पुरुष की स्वीकृति का आधार
  choice: प्रेरितों के विषय में उत्तम गवाही; पुरुष को उनके द्वारा परखकर योग्य पाया जाना
  alternative: दोनों को केवल ‘स्वीकृत’ कहना
  rationale: दो अलग यूनानी कृदन्तों और पुरुष के लिए παρ’ αὐτοῖς की स्पष्ट भूमिका को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘पक्षधरता’ और ‘की ओर झुके’ के द्वारा मूल की शब्दगत पुनरावृत्ति यथासंभव बचाई गई है।
