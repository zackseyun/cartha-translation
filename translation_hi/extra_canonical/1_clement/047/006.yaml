id: 1CLEM.47.6
reference: 1 Clement 47:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/006.yaml
  text: It is shameful[a], beloved—very shameful and unworthy of conduct in Christ—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons.
translation:
  language: hi
  text: प्रिय जनो, यह लज्जा की बात है—अत्यन्त लज्जाजनक और मसीह में जीवन-आचरण के अयोग्य—कि यह सुनने में आए कि कुरिन्थियों की अत्यन्त दृढ़ और प्राचीन कलीसिया एक या दो व्यक्तियों के कारण प्राचीनों के विरुद्ध विद्रोह कर रही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρά ... λίαν αἰσχρά
  choice: लज्जा की बात ... अत्यन्त लज्जाजनक
  rationale: दोहराव और तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀγαπητοί
  choice: प्रिय जनो
  rationale: समुदाय को किए गए स्नेहपूर्ण बहुवचन संबोधन का सहज और गरिमापूर्ण रूप।
- source_word: τῆς ἐν Χριστῷ ἀγωγῆς
  choice: मसीह में जीवन-आचरण
  rationale: ἀγωγή में जीवन-पद्धति और आचरण दोनों का भाव है; ἐν Χριστῷ के स्थापित आरम्भिक मसीही प्रयोग को बनाए रखा गया है।
- source_word: βεβαιοτάτην
  choice: अत्यन्त दृढ़
  rationale: उत्तमावस्था के बल को व्यक्त करता है और कलीसिया की स्थापित स्थिरता को दर्शाता है।
- source_word: ἀρχαίαν
  choice: प्राचीन
  rationale: कलीसिया की पुरानी और दीर्घकाल से स्थापित स्थिति का सीधा अनुवाद।
- source_word: στασιάζειν πρὸς
  choice: के विरुद्ध विद्रोह कर रही है
  rationale: στασιάζειν साधारण मतभेद से अधिक गुटबंदी और बगावत का प्रबल अर्थ रखता है।
- source_word: πρεσβυτέρους
  choice: प्राचीनों
  rationale: आरम्भिक कलीसियाई पद के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और संदर्भानुकूल शब्द।
theological_decisions:
- issue: ἐν Χριστῷ का अनुवाद
  choice: मसीह में
  alternative: ख्रीष्ट में / अभिषिक्त जन में
  rationale: यह पौलुसी शैली से परिचित स्थापित आरम्भिक मसीही पदबंध है; यहाँ उपाधि की व्याख्या करने के बजाय मान्य नाम/उपाधि ‘मसीह’ अधिक स्वाभाविक है।
- issue: πρεσβυτέρους की पद-संबंधी व्याख्या
  choice: प्राचीनों
  alternative: बुज़ुर्गों / अगुओं
  rationale: मूल शब्द के कलीसियाई पद-संकेत को सुरक्षित रखा गया है, बिना बाद की किसी विशिष्ट संप्रदायगत शासन-व्यवस्था को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। मूल यूनानी की तीखी निंदा, पुनरुक्ति और वाक्यगत तनाव बनाए गए हैं; अनावश्यक संप्रदायगत शब्दावली से बचा गया है।
