translation:
  language: hi
  text: अब विचार करो कि किन लोगों ने तुम्हें भटकाया और तुम्हारे सुप्रसिद्ध भाईचारे की गरिमा घटा दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσατε
  choice: ध्यान दो
  rationale: आज्ञार्थक क्रिया का अर्थ ध्यानपूर्वक विचार करने या पहचानने की ओर है; आधुनिक हिन्दी में ‘ध्यान दो’ स्वाभाविक और सीधा है।
- source_word: τίνες
  choice: वे कौन लोग हैं
  rationale: यूनानी प्रश्नवाचक सर्वनाम बहुवचन है, इसलिए हिन्दी में कर्ताओं की बहुलता स्पष्ट रखी गई है।
- source_word: διέστρεψαν
  choice: भटका दिया
  rationale: यहाँ क्रिया नैतिक या सामुदायिक मार्ग से विचलित करने का भाव देती है; ‘भटका दिया’ स्वाभाविक है और अनावश्यक रूप से कठोर ‘विकृत कर दिया’ से बचता है।
- source_word: τὸ σεμνὸν
  choice: गरिमा
  rationale: संज्ञीकृत विशेषण आदरणीयता, प्रतिष्ठा या गंभीर गरिमा को व्यक्त करता है; ‘गरिमा’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: περιβοήτου
  choice: सुप्रसिद्ध
  rationale: शब्द का आशय व्यापक रूप से चर्चित और ख्यात होने से है; इस प्रशंसात्मक प्रसंग में ‘सुप्रसिद्ध’ स्वाभाविक है।
- source_word: φιλαδελφίας
  choice: भाईचारे
  rationale: यह विश्वासियों के परस्पर भाई-बहन जैसे प्रेम को सूचित करता है; ‘भाईचारा’ आधुनिक हिन्दी में सामुदायिक स्नेह का सहज रूप है।
