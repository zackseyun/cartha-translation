  text: What did he write to you first at the beginning of the gospel?
translation:
  language: hi
  text: सुसमाचार के आरम्भ में उसने सबसे पहले तुम्हें क्या लिखा था?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: क्या
  rationale: प्रत्यक्ष प्रश्नवाचक सर्वनाम का स्वाभाविक हिन्दी समतुल्य।
- source_word: πρῶτον
  choice: सबसे पहले
  rationale: लेखन की प्राथमिकता या क्रम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: बहुवचन संबोधन को आधुनिक मानक हिन्दी में सहज रूप से प्रस्तुत करता है।
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: सुसमाचार के आरम्भ में
  rationale: यूनानी संबंधवाचक संरचना को निकटता से रखता है और इस सम्भावित ऐतिहासिक काल-संदर्भ को अनावश्यक रूप से नहीं खोलता कि आशय सुसमाचार-प्रचार के आरम्भ से है या उससे जुड़े आरम्भिक समय से।
- source_word: ἔγραψεν
  choice: लिखा था
  rationale: पूर्ववर्ती पत्र-लेखन की ओर संकेत को हिन्दी के पूर्ण भूतकाल में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘सुसमाचार के आरम्भ’ का आशय
  choice: सुसमाचार के आरम्भ में
  alternative: जब सुसमाचार का प्रचार आरम्भ हुआ था
  rationale: मूल यूनानी वाक्यांश की संक्षिप्तता और सम्भावित अस्पष्टता सुरक्षित रखी गई है; व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उसने’ का संदर्भ पूर्ववर्ती प्रसंग पर निर्भर रहने दिया गया है, जैसा यूनानी पाठ में है।
