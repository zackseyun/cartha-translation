source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/007.yaml
  text: And the report has reached not only us[a], but also those who are estranged from us, so that even blasphemies are brought upon the name of the Lord because of your foolishness[b], while you bring danger upon yourselves.
translation:
  language: hi
  text: और यह खबर केवल हम तक ही नहीं, बल्कि उन लोगों तक भी पहुँची है जो हमसे विमुख हैं,[a] इसलिए तुम्हारी मूर्खता के कारण प्रभु के नाम की निन्दा तक हो रही है, और तुम अपने ही लिए संकट उत्पन्न कर रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो हमसे अलग रुख रखते हैं।”
    reason: यूनानी पद का शाब्दिक भाव दूसरी ओर झुके हुए या विरोधी रुख वाले लोगों का है; प्रसंग में यह समुदाय से अलग या उसके प्रति विमुख लोगों को सूचित करता है।
lexical_decisions:
- source_word: ἀκοή
  choice: खबर
  rationale: यहाँ शब्द का अर्थ सुनने की क्रिया नहीं, बल्कि पहुँची हुई सूचना या समाचार है।
- source_word: ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν
  choice: जो हमसे पराए हैं
  rationale: ἑτεροκλινής में दूसरी ओर झुकने या विरोधी पक्ष में होने का भाव है; प्रसंग में यह केवल आंतरिक मतभेद रखने वालों के बजाय समुदाय से बाहर या उससे विमुख लोगों की ओर संकेत करता है।
- source_word: ἀφροσύνην
  choice: मूर्खता
  rationale: यह चुनाव मूल शब्द के अविवेक और समझहीन आचरण के नैतिक भाव को सीधे बनाए रखता है।
- source_word: κίνδυνον ἐξεργάζεσθαι
  choice: खतरा पैदा कर रहे हो
  rationale: शाब्दिक रूप से ‘खतरा उत्पन्न करना’ है; वर्तमान हिन्दी में यह स्वाभाविक रूप से आत्म-कारित संकट व्यक्त करता है।
theological_decisions:
- issue: प्रभु के नाम पर निन्दा आने का अर्थ
  choice: प्रभु के नाम की निन्दा तक हो रही है
  alternative: प्रभु के नाम पर निन्दाएँ लाई जा रही हैं
  rationale: मूल का कर्मवाच्य और परिणामसूचक बल सुरक्षित रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई है। इससे यह स्पष्ट रहता है कि समुदाय की मूर्खता के कारण बाहरी लोग प्रभु के नाम की निन्दा कर रहे हैं, पर मूल में अनकहे कर्ता को पाठ में जोड़ा नहीं गया।
- issue: καὶ का आरोही बल
  choice: निन्दा तक
  alternative: निन्दा भी
  rationale: ὥστε καὶ में καὶ परिणाम की गंभीरता बढ़ाता है; ‘तक’ हिन्दी में ‘यहाँ तक कि’ का संक्षिप्त और स्वाभाविक बल देता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘पराए’ बाहरीपन और दूरी दोनों को संक्षेप में व्यक्त करता है; ‘निन्दा तक’ मूल के आरोही καὶ का बल सुरक्षित रखता है।
