translation:
  language: hi
  text: उसने उन पर फूँक मारी, और वे मर गए, क्योंकि उनमें बुद्धि नहीं थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεφύσησεν αὐτοῖς
  choice: उसने उन पर फूँक मारी
  rationale: ἐμφυσάω का सीधा अर्थ फूँक मारना या श्वास छोड़ना है; αὐτοῖς के लिए ‘उन पर’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: ἐτελεύτησαν
  choice: वे मर गए
  rationale: यहाँ क्रिया का अर्थ जीवन का अंत होना है; आधुनिक हिन्दी में ‘मर गए’ स्पष्ट और सहज है।
- source_word: παρὰ τὸ μὴ ἔχειν αὐτοὺς σοφίαν
  choice: क्योंकि उनमें बुद्धि नहीं थी
  rationale: παρὰ τό यहाँ कारण बताता है। शाब्दिक ‘उनके पास बुद्धि न होने के कारण’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है और σοφία के अभाव का भाव सुरक्षित रखता है।
theological_decisions:
- issue: फूँक मारने वाले कर्ता की पहचान
  choice: स्रोत की तरह केवल ‘उसने’ रखा गया
  alternative: ‘परमेश्वर ने’
  rationale: इस अंश में कर्ता सर्वनाम से व्यक्त है; नाम जोड़ना स्रोत में निहित संदर्भ को अनावश्यक रूप से स्पष्ट कर देता।
- issue: मृत्यु और बुद्धि के अभाव का संबंध
  choice: ‘क्योंकि’ द्वारा कारणात्मक संबंध
  alternative: ‘बुद्धि न होने के कारण’
  rationale: παρὰ τό के कारणात्मक अर्थ को स्पष्ट रखा गया, पर यह नहीं जोड़ा गया कि बुद्धि का अभाव नैतिक दोष था या किसी विशेष दंड-सिद्धांत का आधार।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के संक्षिप्त वाक्य-विन्यास के निकट। कोई पाद-टिप्पणी आवश्यक नहीं।
