source:
  edition: Funk 1901 (normalized OCR)
  text: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας· κολαβρισθείησαν ἐπὶ θύραις ἡσόνων, καὶ οὐκ ἔσται ὁ ἐξαιρούμενος· ἃ γὰρ ἐκείνοις ἡτοίμασας, δίκαιοι ἕδονται, αὐτοὶ δὲ ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/009.yaml
  text: May their sons be far from safety; may they be crushed at the gates by the lowly[a], and there will be no one to rescue them. For what you prepared for them, the righteous will eat, but they themselves will not be delivered from evils.
translation:
  language: hi
  text: उनके पुत्र सुरक्षा से दूर हों; अपने से छोटे लोगों के द्वारों पर उनका अपमान हो, और उन्हें छुड़ानेवाला कोई न हो। क्योंकि जो कुछ तूने उनके लिए तैयार किया है,[a] उसे धर्मी खाएँगे; पर वे स्वयं विपत्तियों से नहीं बचाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अय्यूब 5:5 के प्रचलित यूनानी पाठ के अनुसार: “जो कुछ उन्होंने तैयार किया है।” उपलब्ध 1 क्लेमेंट-पाठ में है: “जो कुछ तूने उनके लिए तैयार किया है।”'
    reason: दिए गए यूनानी पाठ और उद्धृत शास्त्रीय पाठ के बीच महत्त्वपूर्ण पाठांतर/संभावित OCR-दोष को स्पष्ट करना।
lexical_decisions:
- source_word: ἀπὸ σωτηρίας
  choice: सुरक्षा से दूर
  rationale: यहाँ σωτηρία का संदर्भ तत्काल बचाव या सुरक्षित दशा से है; ‘उद्धार’ अनावश्यक रूप से केवल धार्मिक अर्थ जगा सकता है।
- source_word: κολαβρισθείησαν
  choice: कुचले जाएँ
  rationale: पाठ का रूप असामान्य या दूषित है, पर प्रसंग और उद्धृत अय्यूब-पाठ के आधार पर हिंसक दबाए या कुचले जाने का भाव सबसे उपयुक्त है।
- source_word: ἐπὶ θύραις ἡσόνων
  choice: फाटकों पर दीन लोगों के हाथों
  rationale: θύραις को नगर या न्याय-स्थल के ‘फाटकों’ के रूप में और ἡσόνων को निम्न/दीन लोगों के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἐξαιρούμενος / ἐξαίρετοι
  choice: छुड़ानेवाला / बचाए जाएँगे
  rationale: एक ही मूल से आए रूपों में संकट से निकालने या बचाने का भाव रखा गया है, पर हिन्दी की स्वाभाविकता के लिए अलग वाक्य-विन्यास अपनाया गया है।
- source_word: κακῶν
  choice: विपत्तियों
  rationale: बहुवचन κακά यहाँ नैतिक ‘बुराइयों’ की अपेक्षा आनेवाली मुसीबतों या विपत्तियों को सूचित करता है।
theological_decisions:
- issue: ἃ γὰρ ἐκείνοις ἡτοίμασας में कर्ता और पाठगत कठिनाई
  choice: मुख्य पाठ में उपलब्ध यूनानी का सीधा अर्थ ‘जो कुछ तूने उनके लिए तैयार किया है’ रखा गया
  alternative: अय्यूब 5:5 के प्रचलित यूनानी पाठ के अनुसार ‘जो कुछ उन्होंने तैयार किया है’
  rationale: दिए गए मूल-पाठ में स्पष्ट रूप से द्वितीय पुरुष एकवचन ἡτοίμασας और ἐκείνοις है। फिर भी यह संभवतः प्रतिलिपि/OCR-दोष है और उद्धृत अय्यूब-पाठ से भिन्न है; इसलिए मुख्य पाठ स्रोत का अनुसरण करता है और विकल्प को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। इच्छासूचक यूनानी क्रियाओं को ‘हों/कुचले जाएँ’ से व्यक्त किया गया है। ‘फाटक’ प्राचीन नगर और न्याय-स्थल दोनों के संदर्भ में स्वाभाविक है; पाठगत अनिश्चितता को चुपचाप सुधारने के बजाय पादटिप्पणी में बताया गया है।
