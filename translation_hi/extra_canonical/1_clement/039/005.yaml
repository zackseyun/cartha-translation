source:
  edition: Funk 1901 (normalized OCR)
  text: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ· ἐὰ δὲ, οἱ κατοικοῦντες οἰκίας πηλίνας, ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν. ἔπαισεν αὐτοὺς σητὸς τρόπον, καὶ ἀπὸ πρωΐθεν ἕως ἑσπέρας οὐκ ἔτι εἰσίν· παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/005.yaml
  text: Even the heavens are not clean before him; how much less those who dwell in houses of clay[a], from the same clay of which we ourselves also are made. He struck them like a moth, and from morning until evening they are no more; because they are unable to help themselves, they perished.
translation:
  language: hi
  text: यहाँ तक कि आकाश भी उसके सामने शुद्ध नहीं है; फिर उन लोगों की तो बात ही क्या, जो मिट्टी के घरों में रहते हैं—वे भी उसी मिट्टी के बने हैं जिससे हम स्वयं बने हैं।[a] उसने उन्हें पतंगे की तरह मारा, और सुबह से शाम तक वे नहीं रहे; अपनी सहायता न कर पाने के कारण वे नाश हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में सापेक्ष वाक्यांश का विन्यास संक्षिप्त और कुछ असामान्य है; अधिक शाब्दिक रूप: “जिनमें से हम स्वयं भी उसी मिट्टी के हैं।”'
    reason: ἐξ ὧν ... ἐκ τοῦ αὐτοῦ πηλοῦ की असामान्य संरचना और पुनरुक्ति को दर्ज करने के लिए, बिना मुख्य पाठ को अप्राकृतिक बनाए।
lexical_decisions:
- source_word: οὐρανοὺς
  choice: आकाश
  rationale: बहुवचन यूनानी रूप के अनुरूप हिन्दी में सामूहिक किंतु बहुवचन क्रिया के साथ ‘आकाश’ रखा गया है।
- source_word: οἰκίας πηλίνας
  choice: मिट्टी के घर
  rationale: यह मनुष्य के नश्वर शरीर के लिए प्रयुक्त ठोस रूपक है; इसे व्याख्यात्मक रूप से ‘शरीर’ नहीं किया गया।
- source_word: σητὸς τρόπον
  choice: पतंगे की तरह
  rationale: यूनानी का अर्थ ‘पतंगे के ढंग से’ है; रूपक को ज्यों का त्यों रखा गया है।
- source_word: οὐκ ἔτι εἰσίν
  choice: वे नहीं रहे
  rationale: ‘अब अस्तित्व में नहीं हैं’ की अपेक्षा यह अधिक स्वाभाविक हिन्दी है और विनाश का आशय बनाए रखती है।
- source_word: ἑαυτοῖς βοηθῆσαι
  choice: अपनी सहायता ... कर पाने
  rationale: आत्म-सहायता की असमर्थता को सरल, वर्तमान मानक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मिट्टी के घरों का रूपक
  choice: रूपक को ‘मिट्टी के घर’ के रूप में बनाए रखा
  alternative: इसे सीधे ‘नश्वर शरीर’ कहना
  rationale: मूल पाठ मनुष्य की देह की नश्वरता का संकेत देता है, पर उसे स्पष्ट व्याख्या में बदलना मूल की काव्यात्मक और धर्मवैचारिक तनावशीलता को घटा देता।
- issue: ἔπαισεν का कर्ता
  choice: ‘उसने’ रखा, जिसका निकटतम धर्मवैचारिक संदर्भ परमेश्वर है
  alternative: ‘पतंगे ने उन्हें मारा’
  rationale: क्रिया एकवचन है और σητὸς τρόπον क्रियाविशेषणीय ढंग से ‘पतंगे की तरह’ समझा जा सकता है; फिर भी यूनानी विन्यास कुछ असामान्य है, इसलिए अनावश्यक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘क्या बिसात’ तुलना की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है; मूल के रूपकों और कठोर नश्वरता-बोध को नरम नहीं किया गया।
