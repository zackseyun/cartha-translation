  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/003.yaml
  text: 'It is written: “There was no form before my eyes[a], but I heard only a breath and a voice.”'
translation:
  language: hi
  text: लिखा है, “मेरी आँखों के सामने कोई आकृति नहीं थी; मैंने केवल एक मंद हवा और एक आवाज़ सुनी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य का स्वाभाविक और प्रतिष्ठित हिन्दी रूप; मूल में कोई कारणसूचक संयोजक नहीं है।
- source_word: μορφὴ
  choice: आकृति
  rationale: दिखाई देने वाले रूप या आकार का सामान्य, प्रसंगानुकूल अर्थ रखता है।
- source_word: πρὸ ὀφθαλμῶν μου
  choice: मेरी आँखों के सामने
  rationale: यूनानी स्थानवाचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀλλʼ ἢ
  choice: केवल
  rationale: नकार के बाद यह पदबंध ‘सिवाय/केवल’ का सीमितार्थ देता है; हिन्दी में ‘केवल’ के साथ विरोध को अर्धविराम से स्पष्ट किया गया है।
- source_word: αὔραν
  choice: एक मंद हवा
  rationale: αὔρα हल्की या मंद हवा के लिए प्रयुक्त होता है; ‘साँस’ सम्भव अर्थ है, पर इस संदर्भ में कम संभावित।
- source_word: φωνὴν
  choice: एक आवाज़
  rationale: φωνή के व्यापक श्रव्य अर्थ को बनाए रखता है; इसे अनावश्यक रूप से ‘वाणी’ बनाकर बोलने वाले की पहचान या संदेश का संकेत नहीं जोड़ा गया।
- source_word: ἤκουον
  choice: मैंने … सुनी
  rationale: यूनानी अपूर्णकाल को हिन्दी में स्वाभाविक कथात्मक रूप से प्रस्तुत किया गया; संदर्भ में निरंतरता पर विशेष बल आवश्यक नहीं।
theological_decisions: []
