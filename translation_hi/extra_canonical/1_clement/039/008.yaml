translation:
  language: hi
  text: पर मैंने मूर्खों को जड़ें जमाते देखा है, लेकिन तुरंत उनका निवास भस्म हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονας
  choice: मूर्खों
  rationale: यह शब्द विवेकहीन या मूर्ख लोगों को दर्शाता है; यहाँ सरल और स्वाभाविक हिन्दी में ‘मूर्खों’ उपयुक्त है।
- source_word: ῥίζας βάλλοντας
  choice: जड़ पकड़ते
  rationale: शाब्दिक अर्थ ‘जड़ें डालते’ है; ‘जड़ पकड़ते’ स्थापित और फलते-फूलते जाने का रूपक स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡ δίαιτα
  choice: बसेरा
  rationale: यहाँ δίαιτα निवास-स्थान या रहने की जगह के अर्थ में है। ‘बसेरा’ उस भाव को संक्षिप्त और सहज ढंग से व्यक्त करता है।
- source_word: ἐβρώθη
  choice: नष्ट हो गया
  rationale: क्रिया का मूल बिंब ‘खा लिया गया/भस्म हो गया’ है, किंतु इस संदर्भ में निवास के अचानक विनाश को ‘नष्ट हो गया’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
