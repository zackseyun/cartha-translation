id: 1CLEM.39.4
reference: 1 Clement 39:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί γάρ; μὴ καθαρὸς ἔσται βροτὸς ἐναντί κυρίου; ἢ ἀπὸ τῶν ἔργων αὐτοῦ ἄμεμπτος ἀνήρ, εἰ κατὰ παίδων αὐτοῦ οὐ πιστεύει, κατὰ δὲ ἀγγέλων αὐτοῦ σκολιὸν τι ἐπενόησεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/004.yaml
  text: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless because of his works[a], if he does not trust his children, and has conceived something crooked against his angels?
translation:
  language: hi
  text: तो फिर क्या? क्या नश्वर मनुष्य प्रभु के सामने शुद्ध ठहरेगा? या कोई मनुष्य अपने कामों के आधार पर निर्दोष ठहरेगा,[a] यदि प्रभु अपने सेवकों पर भरोसा नहीं करता और अपने स्वर्गदूतों के विरुद्ध कोई टेढ़ी बात सोचता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘सेवकों’ के स्थान पर ‘सन्तानों’ भी अनुवादित किया जा सकता है। यूनानी का अंतिम खंड अधिक शाब्दिक रूप से: ‘यदि प्रभु अपने सेवकों पर भरोसा नहीं करता और अपने स्वर्गदूतों के विरुद्ध कुछ टेढ़ी बात सोचता है।’ इस कठिन अभिव्यक्ति में शर्तवाले दोनों खंडों का कर्ता प्रभु है।'
    reason: παῖς के ‘सेवक’ और ‘बालक/सन्तान’ दोनों अर्थ सम्भव हैं। σκολιόν τι ἐπενόησεν κατὰ का विन्यास कठिन है; पादटिप्पणी मूल के ‘सोचता है’ और ‘के विरुद्ध’ को सुरक्षित रखती है तथा कर्ता स्पष्ट करती है।
lexical_decisions:
- source_word: βροτός
  choice: नश्वर मनुष्य
  rationale: यह शब्द मनुष्य की मरणशीलता पर बल देता है; केवल ‘मनुष्य’ कहने से यह अर्थछाया खो जाती।
- source_word: ἐναντί κυρίου
  choice: प्रभु के सामने
  rationale: ἐναντί का स्वाभाविक हिन्दी रूप, जो तुलना और न्यायिक उपस्थिति दोनों की अर्थछाया बनाए रखता है।
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: अपने कामों के कारण
  rationale: ἀπό यहाँ आधार अथवा कारण व्यक्त करता है; ‘कामों के कारण’ प्रश्न के अभिप्राय को सहज हिन्दी में रखता है।
- source_word: παίδων αὐτοῦ
  choice: अपने सेवकों
  rationale: παῖς का अर्थ ‘बालक/सन्तान’ या ‘सेवक’ हो सकता है। अय्यूब 4:18 की उद्धरण-परम्परा और उसके स्वर्गदूतों के समानांतर प्रयोग के कारण मुख्य पाठ में ‘सेवकों’ को चुना गया है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: οὐ πιστεύει
  choice: भरोसा नहीं करता
  rationale: πιστεύω का यहाँ दत्तिव के साथ अर्थ किसी पर विश्वास या भरोसा रखना है।
- source_word: σκολιόν τι ἐπενόησεν
  choice: कुछ टेढ़ापन पाता है
  rationale: वाक्य का आशय स्वर्गदूतों में दोष या विकृति पाए जाने का है। ‘सोचा/कल्पना की’ का अत्यधिक शाब्दिक रूप हिन्दी में प्रभु द्वारा दोष गढ़े जाने का भ्रामक अर्थ दे सकता है।
- source_word: κατὰ δὲ ἀγγέλων αὐτοῦ
  choice: अपने स्वर्गदूतों में भी
  rationale: κατά का मूल रूप ‘के विरुद्ध/विषय में’ हो सकता है, पर उद्धृत अय्यूबी आशय में हिन्दी ‘में ... पाता है’ स्वाभाविक और अर्थ-संगत है; δέ की प्रगतिशील अर्थछाया ‘भी’ से व्यक्त हुई है।
theological_decisions:
- issue: οὐ πιστεύει और ἐπενόησεν का कर्ता
  choice: दोनों उत्तरवर्ती क्रियाओं का निहित कर्ता प्रभु माना गया है।
  alternative: निकटवर्ती ‘मनुष्य’ को कर्ता मानना।
  rationale: 'यह अय्यूब 4:18 के तर्क को प्रतिध्वनित करता है: यदि प्रभु अपने स्वर्गीय सेवकों/दूतों में भी दोष पाता है, तो नश्वर मनुष्य कैसे निर्दोष हो सकता है? ‘अपने’ और ‘स्वर्गदूतों’ से यह कर्ता हिन्दी में पर्याप्त रूप से स्पष्ट होता है।'
- issue: मनुष्य के निर्दोष ठहरने का आधार
  choice: 'प्रश्नात्मक और नकारात्मक तनाव को यथावत रखा गया है: ‘अपने कामों के कारण निर्दोष ठहरेगा?’'
  alternative: इसे स्पष्ट सिद्धान्तात्मक कथन बना देना कि कोई मनुष्य कर्मों से धर्मी नहीं ठहर सकता।
  rationale: मूल पाठ आलंकारिक प्रश्न करता है; अनुवाद में उससे आगे जाकर व्यवस्थित धर्मशास्त्रीय निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘ठहरेगा’ न्यायिक/मूल्यांकनात्मक अर्थछाया देता है। मुख्य पाठ में अय्यूब 4:18-सदृश आशय को स्वाभाविक हिन्दी में रखा गया है, जबकि वास्तविक शब्दार्थगत विकल्प पादटिप्पणी में सुरक्षित हैं।
