  text: ἐπικάλεσαι δέ, εἴ τις σοι ὑπακούσεται, ἢ εἴ τινα ἁγίων ἀγγέλων ὄψῃ· καὶ γὰρ ἄφρονα ἀναιρεῖ ὀργή, πεπλανημένον δὲ θανατοῖ ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/007.yaml
  text: But call out[a], if anyone will answer you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the one gone astray to death.
translation:
  language: hi
  text: 'पर पुकारो और देखो: क्या कोई तुम्हें उत्तर देगा, या पवित्र स्वर्गदूतों में से कोई तुम्हें दिखाई देगा? क्योंकि क्रोध मूर्ख को मार डालता है, और ईर्ष्या भटके हुए को मार डालती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικάλεσαι
  choice: पुकारकर देखो
  rationale: आज्ञार्थक क्रिया का मूल अर्थ ‘पुकारना’ है; ‘कर देखो’ अगले प्रश्नसूचक शर्त-वाक्यों के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ὑπακούσεται
  choice: उत्तर देगा
  rationale: मूलतः ‘सुनेगा/आज्ञा मानेगा’, पर यहाँ पुकार के प्रत्युत्तर के संदर्भ में ‘उत्तर देगा’ सर्वाधिक उपयुक्त है।
- source_word: ἁγίων ἀγγέλων
  choice: पवित्र स्वर्गदूतों
  rationale: यहाँ ἄγγελοι अलौकिक दूतों को सूचित करता है; हिन्दी में ‘स्वर्गदूत’ स्पष्ट और प्रचलित है।
- source_word: ὀργή
  choice: क्रोध
  rationale: तीव्र रोष के लिए सीधा और गरिमापूर्ण समतुल्य।
- source_word: ζῆλος
  choice: जलन
  rationale: इस नकारात्मक, विनाशकारी संदर्भ में शब्द का अर्थ ईर्ष्यापूर्ण जलन है, न कि सकारात्मक उत्साह।
- source_word: πεπλανημένον
  choice: भटके हुए
  rationale: पूर्ण कृदन्त उस व्यक्ति की वर्तमान दशा व्यक्त करता है जो मार्ग से भटक चुका है।
- source_word: θανατοῖ
  choice: मौत के घाट उतार देती है
  rationale: कारक क्रिया का अर्थ ‘मृत्यु दिलाना/मार डालना’ है; यह हिन्दी में सजीव रहते हुए पहले खंड की पुनरुक्ति से बचता है।
theological_decisions:
- issue: ‘पवित्र स्वर्गदूतों में से कोई’ का आशय
  choice: वाक्य को प्रश्नात्मक चुनौती के रूप में यथावत रखा गया
  alternative: इसे संतों या स्वर्गदूतों से प्रार्थना के समर्थन अथवा निषेध के रूप में स्पष्ट करना
  rationale: मूल पाठ ऐसी सांप्रदायिक व्याख्या को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए उसकी अलंकारिक और धार्मिक तनावपूर्ण प्रकृति सुरक्षित रखी गई है।
- issue: ζῆλος का नैतिक भाव
  choice: जलन
  alternative: उत्साह
  rationale: क्रोध, मूर्खता, भटकाव और मृत्यु के समानांतर विनाशकारी संदर्भ नकारात्मक अर्थ की माँग करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी के दो εἴ-वाक्यों को एक स्वाभाविक प्रश्नसूचक चुनौती में रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
