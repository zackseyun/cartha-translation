  language: en
  yaml_path: translation/extra_canonical/1_clement/039/002.yaml
  text: For what can a mortal do? Or what strength has one born of earth?
translation:
  language: hi
  text: क्योंकि नश्वर मनुष्य क्या कर सकता है? या धरती से जन्मे मनुष्य के पास क्या बल है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θνητός
  choice: नश्वर मनुष्य
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है और मनुष्य की मरणशीलता पर बल देता है; केवल ‘नश्वर’ की अपेक्षा ‘नश्वर मनुष्य’ सामान्य हिन्दी में अधिक स्पष्ट है।
- source_word: ἰσχύς
  choice: बल
  rationale: यहाँ शारीरिक या सामर्थ्यगत शक्ति का सामान्य अर्थ है; ‘बल’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: γηγενοῦς
  choice: धरती से जन्मे मनुष्य
  rationale: यूनानी शब्द का शाब्दिक बिंब ‘धरती से उत्पन्न/जन्मा’ है। इसे बनाए रखते हुए संज्ञार्थ स्पष्ट करने के लिए ‘मनुष्य’ जोड़ा गया है।
theological_decisions:
- issue: मानवीय सामर्थ्य के विषय में दूसरे प्रश्न की अभिव्यक्ति
  choice: ‘कितना बल है?’
  alternative: ‘क्या बल है?’
  rationale: यूनानी τίς ἰσχύς का आशय यहाँ मनुष्य के बल की सीमितता पर प्रश्न उठाना है। ‘कितना बल’ हिन्दी में स्वाभाविक रूप से वही आलंकारिक प्रश्न व्यक्त करता है, बिना पूर्ण शक्तिहीनता को पाठ में अनिवार्य रूप से जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, आलंकारिक और गरिमापूर्ण शैली। दोनों प्रश्नों की समानांतर संरचना तथा ‘धरती से जन्मे’ का मूल बिंब सुरक्षित रखा गया है।
