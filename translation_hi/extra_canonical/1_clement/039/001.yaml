base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/001.yaml
  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: hi
  text: मूर्ख, नासमझ, बुद्धिहीन और अशिक्षित लोग हमारा उपहास करते और हम पर नाक-भौं सिकोड़ते हैं, क्योंकि वे अपने ही विचारों में स्वयं को ऊँचा उठाना चाहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονες
  choice: मूर्ख
  rationale: यह शब्द विवेक या समझ के अभाव को व्यक्त करता है; सामान्य आधुनिक हिन्दी में ‘मूर्ख’ इसका सीधा और स्वाभाविक रूप है।
- source_word: ἀσύνετοι
  choice: नासमझ
  rationale: यह समझ-बूझ के अभाव पर बल देता है और ἄφρονες से जुड़े हुए, पर कुछ अलग, अर्थ-सूक्ष्मता को बनाए रखता है।
- source_word: μωροί
  choice: बुद्धिहीन
  rationale: समानार्थी विशेषणों की मूल शृंखला को बनाए रखते हुए यह मूढ़ता का भाव व्यक्त करता है।
- source_word: ἀπαίδευτοι
  choice: अशिक्षित
  rationale: शब्द शिक्षा, प्रशिक्षण या संस्कार के अभाव को दर्शाता है; ‘अशिक्षित’ संक्षिप्त और सुबोध है।
- source_word: χλευάζουσιν
  choice: उपहास करते
  rationale: यह खुले तौर पर मज़ाक उड़ाने या तिरस्कारपूर्ण उपहास का अर्थ देता है।
- source_word: μυκτηρίζουσιν
  choice: नाक-भौं सिकोड़ते
  rationale: क्रिया का मूल चित्र नाक चढ़ाकर तिरस्कार दिखाने का है; यह हिन्दी मुहावरा उस शारीरिक और तिरस्कारपूर्ण भाव को बचाता है।
- source_word: ταῖς διανοίαις αὐτῶν
  choice: अपने ही विचारों में
  rationale: बहुवचन διάνοιαι मानसिक धारणाओं या विचारों को सूचित करता है; ‘में’ उस क्षेत्र या दृष्टि को खुला रखता है जिसमें वे स्वयं को ऊँचा मानते हैं।
theological_decisions:
- issue: आत्म-उत्थान का स्थान या साधन
  choice: अपने ही विचारों में स्वयं को ऊँचा उठाना
  alternative: अपने विचारों के द्वारा स्वयं को ऊँचा उठाना
  rationale: ग्रीक कारक रूप को केवल साधन के अर्थ में सीमित न करके मानसिक क्षेत्र या आत्म-धारणा की वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल यूनानी में चार निकटार्थी नकारात्मक विशेषणों का संचय है, इसलिए हिन्दी में भी चार पदों की अलंकारिक शृंखला सुरक्षित रखी गई है।
