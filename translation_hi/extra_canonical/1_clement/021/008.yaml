id: 1CLEM.21.8
reference: 1 Clement 21:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/008.yaml
  text: Let our children partake of the discipline that is in Messiah. Let them learn what humility accomplishes before God[a], what pure love is able to do before God, how his fear is good and great and saves all who live in holiness in him, with a pure mind.
translation:
  language: hi
  text: हमारे बच्चे मसीह में मिलने वाली शिक्षा और अनुशासन में सहभागी हों। वे सीखें कि परमेश्वर के सामने दीनता क्या कर सकती है, शुद्ध प्रेम परमेश्वर के सामने क्या कर सकता है, और उसका भय कैसे उत्तम और महान है तथा उन सभी का उद्धार करता है जो शुद्ध मन से उसमें[a] पवित्रता से जीवन बिताते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसमें” का संकेत परमेश्वर की ओर या उसके भय की ओर हो सकता है।
    reason: यूनानी ἐν αὐτῷ का व्याकरणिक संदर्भ अस्पष्ट है और दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: παιδείας
  choice: शिक्षा और अनुशासन
  rationale: यह शब्द केवल जानकारी देने वाली शिक्षा नहीं, बल्कि चरित्र गढ़ने वाले प्रशिक्षण और अनुशासन को भी व्यक्त करता है; संयुक्त पद आधुनिक हिन्दी में इसका व्यापक अर्थ स्पष्ट करता है।
- source_word: ταπεινοφροσύνη
  choice: दीनता
  rationale: यहाँ मन की नम्र और स्वयं को नीचा मानने वाली वृत्ति अभिप्रेत है; ‘दीनता’ संक्षिप्त, स्वाभाविक और धार्मिक संदर्भ में परिचित है।
- source_word: ἰσχύει
  choice: क्या कर सकती है
  rationale: क्रिया का भाव ‘सामर्थ्य रखना/प्रभावी होना’ है। प्रश्नवाचक τί के साथ यह दीनता के प्रभाव या उपलब्धि को व्यक्त करता है, न कि दीनता की पहचान पूछता है।
- source_word: ἀγάπη ἁγνή
  choice: शुद्ध प्रेम
  rationale: ἁγνή नैतिक और आंतरिक शुद्धता बताता है; ‘शुद्ध प्रेम’ सीधा और स्वाभाविक समतुल्य है।
- source_word: ὁσίως ἀναστρεφομένους
  choice: भक्तिपूर्वक जीवन बिताते हैं
  rationale: ἀναστρέφομαι जीवन-व्यवहार को और ὁσίως परमेश्वर के प्रति श्रद्धापूर्ण, पवित्र आचरण को दर्शाता है।
- source_word: ἐν καθαρᾷ διανοίᾳ
  choice: शुद्ध मन से
  rationale: διάνοια यहाँ आंतरिक विचार-वृत्ति या मन को दर्शाता है; यह अनुवाद सरल रहते हुए नैतिक आंतरिक शुद्धता बनाए रखता है।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστός का रूप
  choice: मसीह में
  alternative: ख्रीष्ट में
  rationale: Χριστός का अर्थ अभिषिक्त जन है; ‘मसीह’ आधुनिक हिन्दी में व्यापक रूप से समझा जाने वाला और स्रोतार्थ से जुड़ा रूप है।
- issue: ἐν αὐτῷ का संदर्भ
  choice: उसमें, अस्पष्टता बनाए रखते हुए
  alternative: परमेश्वर में / उसके भय में
  rationale: निकटवर्ती ‘उसका भय’ और पहले उल्लिखित परमेश्वर, दोनों व्याकरणतः संभावित संदर्भ हैं। मूल की वास्तविक अस्पष्टता को मुख्य पाठ में बनाए रखकर पादटिप्पणी में बताया गया है।
- issue: भय को उद्धारकारी बताने की भाषा
  choice: उसका भय ... उन सभी का उद्धार करता है
  alternative: उसका भय ... उन सभी को सुरक्षित रखता है
  rationale: σῴζων उद्धार या बचाव का प्रबल अर्थ रखता है। लेखक के कथन की धार्मिक तीव्रता को नरम किए बिना ‘उद्धार करता है’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर वाक्य-विन्यास को यथासंभव सुरक्षित रखा गया है; ‘शिक्षा और अनुशासन’ παιδεία की शिक्षात्मक तथा चरित्र-निर्माणकारी दोनों छवियों को व्यक्त करता है।
