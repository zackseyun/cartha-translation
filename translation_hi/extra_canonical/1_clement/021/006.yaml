  text: τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/006.yaml
  text: Let us have reverence for the Lord Jesus Christ[a], whose blood was given for us; let us respect those who go before us; let us honor the elders; let us train the young in the discipline of the fear of God[c][b]; let us direct our wives toward what is good.
translation:
  language: hi
  text: आइए, हम प्रभु यीशु मसीह के प्रति श्रद्धा रखें, जिनका लहू हमारे लिए दिया गया; जो हमारे आगे चलते हैं[a], उनका आदर करें; बुज़ुर्गों[b] का सम्मान करें; युवाओं को परमेश्वर के भय के अनुशासन में प्रशिक्षित करें; और अपनी पत्नियों[c] को भलाई की ओर मार्गदर्शन दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “जो हमारा नेतृत्व करते हैं।”
    reason: προηγουμένους का शाब्दिक भाव ‘आगे चलने वाले’ है, पर संदर्भ में यह अगुवों या नेतृत्व करने वालों को भी सूचित कर सकता है।
  - marker: b
    text: अथवा, “प्राचीनों।”
    reason: πρεσβυτέρους आयु में बड़े लोगों या समुदाय के प्राचीनों/अगुवों—दोनों के लिए प्रयुक्त हो सकता है।
  - marker: c
    text: अथवा, “अपनी स्त्रियों।”
    reason: γυναῖκας का मूल अर्थ ‘स्त्रियाँ’ भी हो सकता है, यद्यपि यहाँ ‘पत्नियाँ’ अधिक संभावित है।
lexical_decisions:
- source_word: ἐντραπῶμεν
  choice: श्रद्धा रखें
  rationale: यह क्रिया यहाँ प्रभु के प्रति संकोचयुक्त आदर और श्रद्धा व्यक्त करती है; ‘श्रद्धा रखें’ आधुनिक हिन्दी में स्वाभाविक है और केवल ‘लज्जित हों’ कहने से उत्पन्न होने वाले भ्रामक अर्थ से बचती है।
- source_word: τοὺς προηγουμένους ἡμῶν
  choice: जो हमारे आगे चलते हैं
  rationale: यह मूल क्रिया के ‘आगे चलने’ के भाव को बनाए रखता है और इसे अनिवार्य रूप से किसी औपचारिक पद या नेतृत्व तक सीमित नहीं करता।
- source_word: τοὺς πρεσβυτέρους
  choice: प्राचीनों
  rationale: यह कलीसियाई ‘एल्डर’ और आयु में बड़े लोगों—दोनों संभावित संकेतों को हिन्दी की परिचित बाइबलीय शब्दावली में खुला रखता है।
- source_word: τοὺς νέους
  choice: युवाओं
  rationale: νέους सकारात्मक रूप में ‘युवा लोगों’ को सूचित करता है, न कि तुलनात्मक अर्थ में ‘कम उम्र वालों’ को।
- source_word: παιδεύσωμεν τὴν παιδείαν
  choice: अनुशासन में प्रशिक्षित करें
  rationale: मूल के शिक्षा, प्रशिक्षण और अनुशासन के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς γυναῖκας ἡμῶν
  choice: अपनी पत्नियों
  rationale: γυναῖκας अपने आप में ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है, पर ἡμῶν और घरेलू-सामुदायिक संदर्भ वैवाहिक अर्थ को अधिक संभावित बनाते हैं।
- source_word: ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα
  choice: भलाई की ओर मार्गदर्शन दें
  rationale: διορθόω के सुधारने या सही दिशा देने के भाव को कठोर या अपमानजनक हिन्दी के बिना व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर के भय का अनुशासन’ में संबंध
  choice: परमेश्वर के भय के अनुशासन में
  alternative: उस अनुशासन में जो परमेश्वर के भय से आता है
  rationale: τοῦ φόβου τοῦ θεοῦ का संबंध स्रोत, विषय या व्याख्यात्मक समानता का हो सकता है। चुना हुआ रूप मूल के संक्षिप्त संबंध को बनाए रखता है और यह निश्चित नहीं करता कि अनुशासन केवल भय से उत्पन्न होता है।
- issue: ‘हमारे लिए’ दिए गए लहू का अर्थ
  choice: हमारे लिए दिया गया
  alternative: हमारी ओर से दिया गया
  rationale: ὑπὲρ ἡμῶν प्रतिनिधित्व, हित या बलिदानी पक्ष का संकेत दे सकता है। ‘हमारे लिए’ इस धर्मवैचारिक विस्तार को बिना अनावश्यक रूप से सीमित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक उपदेशात्मक शैली रखी गई है। वाक्य की क्रमिक ‘करें’ संरचना यूनानी के बार-बार आने वाले प्रथम-पुरुष बहुवचन आग्रह को दर्शाती है। ‘लहू’, ‘प्राचीन’ और ‘परमेश्वर का भय’ जैसी परिचित बाइबलीय अभिव्यक्तियों को सामान्य पाठक के लिए सुबोध वाक्य-विन्यास में रखा गया है।
