revisions:
- from: हे प्रियो, ध्यान रखो कि उसके अनेक उपकार हम सबके लिए दण्ड का कारण न बन जाएँ—यदि हम उसके योग्य आचरण न करें और आपसी एकता के साथ वही न करें जो उसकी दृष्टि में भला और मनभावना है।
  to: प्रिय लोगो, सावधान रहो कि उसके अनेक उपकारᵃ हम सबके विरुद्ध दोष ठहराने का आधार न बन जाएँ, यदि हम उसके योग्य जीवन न जिएँ और आपसी मेल-मिलाप में उसकी दृष्टि में भले और उसे प्रसन्न करने वाले काम न करें।
  rationale: The revision retains the source’s conditional warning and its rhetorical register while avoiding an unnecessary narrowing of κρίμα to punitive punishment. It renders ὁμονοία as communal concord (“आपसी मेल-मिलाप”), preserves the unexpressed referent of “उसके,” and restores the available audit-trail alternative with an explicit footnote anchor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T16:33:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the warning, the many benefactions, worthy conduct, and communal unity. However, “दण्ड” narrows κρίμα (“judgment/verdict”) to punishment. In this warning context an adverse judicial sense is present, but “दोष ठहराने का आधार” preserves the judicial force without requiring that the word itself mean only punishment. The revised wording also makes the two coordinated requirements—worthy conduct and doing what is good and pleasing in concord—more explicit.
  naturalness: “हे प्रियो” is intelligible but somewhat archaic and less idiomatic in modern standard Hindi. “प्रिय लोगो, सावधान रहो” is direct, natural, and retains the affectionate exhortational register. “आपसी एकता के साथ” is clear, but “आपसी मेल-मिलाप में” more naturally expresses ὁμονοία as concord rather than mere organizational unity.
  terminology: “उपकार” is a sound rendering of εὐεργεσίαι, retaining the sense of benefits or benefactions rather than generic gifts. “उसके योग्य जीवन जिएँ” adequately renders πολιτευόμενοι in idiomatic Hindi, though it cannot fully reproduce the Greek civic resonance. The revised phrase “उसकी दृष्टि में भले और उसे प्रसन्न करने वाले काम” clearly renders τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ.
  issues:
  - severity: medium
    issue: “दण्ड का कारण” restricts κρίμα to punishment.
    rationale: κρίμα can denote judgment, decision, or condemnation. The context supports an adverse outcome, but the source does not specify punishment as such. “हम सबके विरुद्ध दोष ठहराने का आधार” retains the adverse judicial warning more precisely.
  - severity: low
    issue: The Hindi does not carry forward the English audit-trail alternative footnote.
    rationale: The English POB supplies a documented alternative for “benefits/good gifts” and “in concord/with one accord.” Adding a corresponding Hindi footnote preserves that audit trail and provides an anchored alternative without treating it as the preferred rendering.
