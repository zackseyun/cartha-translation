id: 1CLEM.21.1
reference: 1 Clement 21:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
translation:
  language: hi
  text: प्रिय लोगो, सावधान रहो कि उसके अनेक उपकारᵃ हम सबके विरुद्ध दोष ठहराने का आधार न बन जाएँ, यदि हम उसके योग्य जीवन न जिएँ और आपसी मेल-मिलाप में उसकी दृष्टि में भले और उसे प्रसन्न करने वाले काम न करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: ध्यान रखो
  rationale: यहाँ क्रिया का भाव केवल ‘देखने’ का नहीं, बल्कि सावधान रहने और सुनिश्चित करने का है।
- source_word: εὐεργεσίαι
  choice: उपकार
  rationale: यह शब्द किसी हितकारी व्यक्ति द्वारा किए गए लाभकारी कार्यों या प्रदान किए गए लाभों को दर्शाता है; ‘उपकार’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κρίμα
  choice: दण्ड का कारण
  rationale: κρίμα में न्यायिक निर्णय और दोषदण्ड दोनों की छाया है। सन्दर्भ में मिले उपकार उत्तरदायित्व बढ़ाकर दण्ड का कारण बन सकते हैं; अनगढ़ ‘न्याय’ की अपेक्षा यह हिन्दी में आशय स्पष्ट करता है।
- source_word: πολιτευόμενοι
  choice: आचरण करें
  rationale: मूल क्रिया नागरिक जीवन या समुदाय के सदस्य के रूप में व्यवहार करने का रंग रखती है। हिन्दी में ‘आचरण करें’ स्वाभाविक है, यद्यपि उसकी नागरिक-राजनीतिक प्रतिध्वनि पूर्णतः नहीं आती।
- source_word: ὁμόνοια
  choice: आपसी एकता
  rationale: पत्र का प्रमुख विषय सामुदायिक मेल और गुटबाज़ी के विपरीत एकचित्तता है। ‘आपसी एकता’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसकी दृष्टि में
  rationale: शाब्दिक ‘उसके सामने’ के बजाय यह नैतिक अनुमोदन के प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के उपकारों और न्याय के बीच सम्बन्ध
  choice: ‘उसके अनेक उपकार ... दण्ड का कारण न बन जाएँ’ के रूप में मूल की चेतावनी सुरक्षित रखी गई है।
  alternative: ‘उपकार न्याय में न बदल जाएँ’ या केवल ‘हमारा न्याय न हो’
  rationale: मूल वाक्य उपकारों को ही εἰς κρίμα होने की सम्भावना से जोड़ता है; अनुवाद इस कठिन धार्मिक तनाव को मिटाता नहीं, बल्कि बताता है कि अनुचित जीवन के कारण वे दण्ड का कारण बन सकते हैं।
- issue: ‘उसके योग्य’ का संदर्भ
  choice: सर्वनाम ‘उसके’ को मूल की तरह अनिर्दिष्ट रखा गया है।
  alternative: स्पष्ट रूप से ‘परमेश्वर के योग्य’
  rationale: इस पद में αὐτοῦ का निकटवर्ती संदर्भ दिया नहीं गया; व्यापक प्रसंग अर्थ बता सकता है, पर यहाँ नाम जोड़ना मूल की अपेक्षा अधिक स्पष्टता आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष उपदेशात्मक शैली रखी गई है। ‘हे प्रियो’ आरम्भिक संबोधन की आत्मीयता और प्राचीन पत्रात्मक गरिमा दोनों बचाता है। वाक्य को पठनीय बनाने के लिए दीर्घ विराम लगाया गया है, पर मूल की शर्त और चेतावनी का तार्किक क्रम सुरक्षित है।
