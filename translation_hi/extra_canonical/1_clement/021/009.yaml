base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/009.yaml
  text: For he is a searcher of thoughts and intentions; his breath is in us, and whenever he wills, he will take it away.
translation:
  language: hi
  text: क्योंकि वह विचारों और इरादों को परखनेवाला है; उसकी साँस हमारे भीतर है, और जब भी वह चाहे, वह उसे ले लेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνητής
  choice: जाँचनेवाला
  rationale: यह शब्द गहराई से खोजने या परखनेवाले को दर्शाता है; सहज आधुनिक हिन्दी में ‘जाँचनेवाला’ अर्थ को स्पष्ट रखता है।
- source_word: ἐννοιῶν καὶ ἐνθυμήσεων
  choice: विचारों और मन के इरादों
  rationale: 'दोनों निकटार्थी शब्दों का भेद बनाए रखा गया है: ἔννοια मानसिक विचार को और ἐνθύμησις भीतर उठनेवाले विचार, मंशा या इरादे को सूचित कर सकता है।'
- source_word: ἡ πνοὴ αὐτοῦ
  choice: उसकी दी हुई साँस
  rationale: शाब्दिक संरचना ‘उसकी साँस’ है। हिन्दी में ‘उसकी दी हुई’ यह स्पष्ट करती है कि हमारे भीतर का जीवन-श्वास उसी से प्राप्त है, जबकि πνοή के ‘साँस/जीवन-श्वास’ अर्थ को बनाए रखती है।
- source_word: ἀνελεῖ αὐτήν
  choice: उसे वापस ले लेगा
  rationale: ἀναιρέω यहाँ साँस अथवा जीवन को हटा लेने के अर्थ में है। ‘वापस ले लेगा’ प्रसंगानुकूल और स्वाभाविक हिन्दी है तथा मृत्यु के संकेत को अनावश्यक रूप से विस्तार नहीं देता।
theological_decisions:
- issue: πνοή का अर्थ साँस, जीवन-श्वास या आत्मा
  choice: साँस
  alternative: जीवन-श्वास
  rationale: मूल शब्द प्रत्यक्षतः साँस/श्वास को दर्शाता है। ‘साँस’ सरल और व्यापक रूप से बोधगम्य है तथा इसे तकनीकी रूप से ‘आत्मा’ बनाकर अर्थ सीमित नहीं करता।
- issue: αὐτοῦ में स्वामित्व अथवा स्रोत का भाव
  choice: उसकी दी हुई साँस
  alternative: उसकी साँस
  rationale: ग्रीक में केवल ‘उसकी साँस’ है, पर हिन्दी में यह वाक्यांश अस्पष्ट या अस्वाभाविक लग सकता है। ‘दी हुई’ स्रोत-संबंध को स्वाभाविक बनाता है; फिर भी इसे परमेश्वर के आत्मा के विषय में कोई विशिष्ट सांप्रदायिक दावा नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। यूनानी वाक्य के दो परस्पर जुड़े खंडों को अर्धविराम से जोड़ा गया है।
