  text: ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/003.yaml
  text: Let us see how near he is[a], and that nothing of our thoughts nor of the reasonings we make has escaped his notice.
translation:
  language: hi
  text: आओ, हम देखें कि वह कितना निकट है, और कि हमारे विचारों में से या जिन विचार-विमर्शों को हम करते हैं उनमें से कुछ भी उसकी दृष्टि से बचा नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: आओ, हम देखें
  rationale: पहले पुरुष बहुवचन के आग्रहात्मक रूप को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐγγύς
  choice: निकट
  rationale: स्थानिक अथवा संबंधपरक निकटता की मूल अस्पष्टता को बनाए रखता है।
- source_word: ἐννοιῶν
  choice: हमारे मन के विचारों
  rationale: ἐννοίαι के आंतरिक धारणाओं, आशयों या विचारों के अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: διαλογισμῶν ὧν ποιούμεθα
  choice: हमारे भीतर चलने वाले तर्क-वितर्कों
  rationale: διαλογισμός के विचार, मनन और आंतरिक तर्क-वितर्क के अर्थ-क्षेत्र तथा ποιούμεθα की सक्रिय प्रक्रिया—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: οὐδὲν λέληθεν αὐτόν
  choice: कुछ भी उससे छिपा नहीं है
  rationale: पूर्ण निषेध और परमेश्वर की दृष्टि से किसी बात के न बचने का आशय स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: ἐγγύς में निकटता का प्रकार
  choice: ‘निकट’ को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: ‘हमारे पास उपस्थित’ या ‘शीघ्र आने वाला’
  rationale: यूनानी पाठ निकटता को स्पष्टतः स्थानिक, संबंधपरक या कालगत नहीं ठहराता; किसी एक अर्थ को थोपना उचित नहीं।
- issue: αὐτόν का संकेत
  choice: सर्वनाम ‘वह/उससे’ बनाए रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर’ जोड़ना
  rationale: इस पद में नाम प्रत्यक्ष रूप से नहीं है; संदर्भगत संकेत को सुरक्षित रखते हुए पाठ में अनावश्यक स्पष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक उपदेशात्मक और गरिमापूर्ण शैली रखी गई है। ‘तर्क-वितर्क’ के साथ ‘हमारे भीतर चलने वाले’ जोड़कर इसे बाहरी बहस के बजाय आंतरिक विचार-प्रक्रिया के रूप में स्पष्ट किया गया है।
