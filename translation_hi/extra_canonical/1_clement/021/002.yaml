lexical_decisions:
- source_word: λέγει γάρ που
  choice: क्योंकि कहीं लिखा है
  rationale: मुहावरे का आशय किसी शास्त्रीय कथन का अनिश्चित स्थान से उद्धरण देना है; शाब्दिक ‘कहीं कहता है’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Πνεῦμα κυρίου
  choice: प्रभु की आत्मा
  rationale: ग्रीक पद की सीधी और धार्मिक रूप से अनिर्णायक अभिव्यक्ति।
- source_word: λύχνος
  choice: दीपक
  rationale: तेल से जलने वाले प्रकाश-साधन के लिए सहज आधुनिक हिन्दी शब्द।
- source_word: ἐρευνῶν
  choice: खोजता है
  rationale: यह गहराई से जाँचने या टटोलने का भाव रखता है; ‘खोजता है’ मूल रूपक को सरलता से बनाए रखता है।
- source_word: τὰ ταμιεῖα τῆς γαστρός
  choice: पेट के भीतरी कक्षों
  rationale: ταμιεῖα यहाँ गुप्त/भीतरी कक्षों को सूचित करता है, जबकि γαστήρ का देहगत रूपक ‘पेट’ द्वारा सुरक्षित रहता है; इसे केवल ‘मन’ या ‘हृदय’ कहना मूल रूपक की व्याख्यात्मक जगहापन्नी होती।
theological_decisions:
- issue: ‘प्रभु की आत्मा’ और ‘दीपक’ के बीच संबंध
  choice: ‘प्रभु की आत्मा एक दीपक है’
  alternative: ‘मनुष्य की आत्मा प्रभु का दीपक है’
  rationale: दिए गए यूनानी पाठ में Πνεῦμα κυρίου कर्ता-संबंधी पद है और वही ‘प्रभु की आत्मा’ पढ़ता है। नीतिवचन 20:27 की अन्य पाठ-परंपराओं के आधार पर इसे ‘मनुष्य की आत्मा प्रभु का दीपक’ बनाना इस स्रोत-पाठ को बदल देता।
- issue: अंतरतम का रूपक
  choice: पेट के भीतरी कक्ष
  alternative: मन की गहराइयाँ
  rationale: मूल की शारीरिक और स्थानिक भाषा को बनाए रखा गया है, ताकि मनोवैज्ञानिक अर्थ को अनिवार्य व्याख्या के रूप में न थोपा जाए।
