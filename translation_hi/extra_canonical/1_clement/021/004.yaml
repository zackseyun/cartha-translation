review_pass:
  verdict: revise
  source_fidelity: δίκαιον οὖν is well rendered by “इसलिए यह उचित है.” However, λειποτακτεῖν is specifically to desert one’s post / be a deserter, with ἀπό marking separation “from his will.” The draft’s “मुँह मोड़कर अपना स्थान न छोड़ें” unnecessarily adds both a manner (“turning one’s face away”) and an explicit “our place,” neither of which is stated in Greek; it also makes the relation to “his will” less direct.
  naturalness: “उसकी इच्छा से भगोड़े न बनें” is idiomatic enough in a grave literary register and retains the military metaphor without the draft’s expanded paraphrase.
  terminology: “इच्छा” accurately renders θέλημα. “भगोड़े” preserves the military force of λειποτακτεῖν while “से” reflects ἀπό. No theological interpretation is added.
  issues:
  - severity: medium
    issue: The military metaphor is expanded and partly redirected.
    rationale: “मुँह मोड़कर अपना स्थान न छोड़ें” introduces imagery not present in the Greek and can suggest abandoning one’s own assigned station rather than becoming deserters from God’s will.
  revised_text: इसलिए यह उचित है कि हम उसकी इच्छा से भगोड़े न बनें।
