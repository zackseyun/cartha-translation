lexical_decisions:
- source_word: δίκαιον
  choice: उचित
  rationale: यहाँ शब्द नैतिक रूप से सही और कर्तव्यसंगत होने का भाव व्यक्त करता है; ‘उचित’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकाले गए निष्कर्ष को स्पष्ट करता है।
- source_word: λειποτακτεῖν
  choice: मुँह मोड़कर अपना स्थान छोड़ें
  rationale: यह सैन्य पृष्ठभूमि वाला शब्द है, जिसका अर्थ पंक्ति या नियुक्त स्थान छोड़कर भगोड़ा होना है। यह रूपक को बनाए रखते हुए हिन्दी में उसके आशय को बोधगम्य बनाता है।
- source_word: ἀπὸ τοῦ θελήματος αὐτοῦ
  choice: उसकी इच्छा से
  rationale: ἀπό के अलगाव-सूचक अर्थ को ‘से’ द्वारा और θέλημα को स्वाभाविक रूप से ‘इच्छा’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर की इच्छा से अलग होने के लिए सैन्य रूपक
  choice: मुँह मोड़कर अपना स्थान न छोड़ें
  alternative: उसकी इच्छा को न त्यागें
  rationale: सरल विकल्प मूल के सैन्य रूपक को मिटा देता। चुना गया पाठ आज्ञापालन और नियुक्त स्थान से पलायन—दोनों भावों को बिना किसी सांप्रदायिक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। सैन्य रूपक को केवल ‘त्यागना’ कहकर सपाट करने के बजाय स्वाभाविक हिन्दी में उभारा गया है।
