source:
  edition: Funk 1901 (normalized OCR)
  text: μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/005.yaml
  text: Rather, let us offend foolish and senseless men, who are puffed up and boast in the arrogance of their speech, rather than God.
translation:
  language: hi
  text: बल्कि हम परमेश्वर को ठेस पहुँचाने के बजाय उन मूर्ख और नासमझ मनुष्यों को ठेस पहुँचाएँ,[a] जो घमंड से फूले हुए हैं और अपनी बातों के दंभ में डींग मारते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें अप्रसन्न करें।” यूनानी क्रिया का मूल अर्थ ठोकर खाना या ठोकर लगना है; प्रसंग के अनुसार इसमें किसी को अपराध या अप्रसन्नता पहुँचाने का भाव हो सकता है।
    reason: προσκόπτω के रूपकगत अर्थ-क्षेत्र और इस प्रसंग में उसके सम्भव अर्थ को संक्षेप में स्पष्ट करने के लिए।
lexical_decisions:
- source_word: προσκόψωμεν
  choice: हम ... ठेस पहुँचाएँ
  rationale: क्रिया का मूल भाव ‘ठोकर लगना/लगाना’ है और यहाँ व्यक्ति के प्रति अपराध या अप्रसन्नता उत्पन्न करने का अर्थ है। ‘ठेस पहुँचाना’ इस रूपक और प्रसंगगत अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄφροσι καὶ ἀνοήτοις
  choice: मूर्ख और नासमझ
  rationale: दोनों निकटार्थक विशेषणों को अलग रखकर यूनानी की जोरदार पुनरुक्ति सुरक्षित की गई है।
- source_word: ἐπαιρομένοις
  choice: घमंड से फूल उठते हैं
  rationale: शाब्दिक रूप से ‘ऊँचे उठाए जाते/अपने को ऊँचा उठाते’ का भाव है; यह हिन्दी मुहावरा आत्म-अभिमान का चित्रात्मक भाव व्यक्त करता है।
- source_word: ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν
  choice: अपनी बातों के दंभ पर डींग मारते हैं
  rationale: ἐγκαυχάομαι के शेखी/गर्व करने और ἀλαζονεία के दंभपूर्ण अहंकार को अलग-अलग व्यक्त किया गया है; λόγος को प्रसंगानुसार ‘बातों’ कहा गया है।
theological_decisions:
- issue: मनुष्यों और परमेश्वर के बीच μᾶλλον ... ἢ की तुलना
  choice: परमेश्वर को ठेस पहुँचाने के बजाय ... मनुष्यों को ठेस पहुँचाएँ
  alternative: मनुष्यों को अप्रसन्न करें, परमेश्वर को नहीं
  rationale: यूनानी में एक ही क्रिया दोनों सम्प्रदान कारकों पर लागू होती है। हिन्दी में भी वही क्रिया दोनों के साथ रखी गई है, ताकि तुलना की समरूपता और परमेश्वर के प्रति अपराध का गंभीर भाव बना रहे।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘ठेस पहुँचाना’, ‘घमंड से फूल उठना’ और ‘डींग मारना’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि मूल के चित्रात्मक और नैतिक बल को बनाए रखते हैं।
