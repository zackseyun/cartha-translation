  verdict: revise
  source_fidelity: 'The comparison μᾶλλον … ἢ τῷ θεῷ is correctly represented: the exhortation is to risk giving offense to arrogant people rather than to God. The paired descriptions ἄφροσι καὶ ἀνοήτοις and the two further participial descriptions are retained. προσκόψωμεν plausibly bears the contextual sense of giving offense.'
  naturalness: 'The draft is generally clear and appropriately dignified. However, “अपनी बातों के दंभ पर डींग मारते हैं” is not idiomatic Hindi: one boasts “दंभ में/के साथ,” not “दंभ पर.” “घमंड से फूल उठते हैं” is understandable, but “घमंड से फूले हुए हैं” is more natural as an ongoing characterization parallel to the Greek participles.'
  terminology: “परमेश्वर,” “मूर्ख और नासमझ,” and “ठेस पहुँचाना” suit the register and preserve the moral force without importing doctrinal interpretation. The footnote may retain the real semantic range of προσκόπτω, but should not overstate the likelihood of a literal collision in this context.
  issues:
  - severity: low
    issue: Awkward collocation in the final participial clause
    rationale: “दंभ पर डींग मारते” is unnatural. The Greek ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν is more idiomatically conveyed as boasting “अपनी बातों के दंभ में.”
  - severity: low
    issue: Participial characterization can be phrased more naturally
    rationale: “घमंड से फूले हुए हैं” gives a smoother continuing description for ἐπαιρομένοις than “घमंड से फूल उठते हैं,” while retaining the image of inflated pride.
