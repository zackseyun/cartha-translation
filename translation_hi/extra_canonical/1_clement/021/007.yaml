source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος ἐνδειξάσθωσαν, τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα ἀποδειξάτωσαν, τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν, τὴν ἀγάπην αὐτῶν μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν τοῖς φοβουμένοις τὸν θεὸν ὁσίως ἴσην παρεχέτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/007.yaml
  text: Let them show the lovely character of purity; let them demonstrate the sincere disposition of their gentleness; let them make the moderation of their tongue evident through silence; let them extend their love not according to partiality, but equally to all who fear God in holiness.
translation:
  language: hi
  text: वे पवित्रता का प्रेमयोग्य स्वभाव दिखाएँ; अपनी नम्रता की निष्कपट मनोवृत्ति प्रकट करें; मौन के द्वारा अपनी वाणी का संयम स्पष्ट करें; और अपना प्रेम पक्षपात के अनुसार नहीं, बल्कि परमेश्वर का भय माननेवाले सभी लोगों को धर्मनिष्ठा से समान रूप में दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιαγάπητον
  choice: प्रिय
  rationale: यह शब्द ऐसी वस्तु का बोध कराता है जो प्रेम के योग्य या मनोहर हो; ‘प्रिय’ सहज हिन्दी में इस प्रशंसनीय गुण को व्यक्त करता है।
- source_word: ἁγνείας
  choice: पवित्रता
  rationale: संदर्भ में नैतिक शुद्धता और पावन आचरण का व्यापक भाव है; ‘पवित्रता’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἀκέραιον
  choice: निष्कपट
  rationale: मूल अर्थ मिलावट-रहित, अखंड या निर्दोष है; भाव/मनःस्थिति के साथ ‘निष्कपट’ स्वाभाविक रूप से उसकी शुद्धता व्यक्त करता है।
- source_word: πραΰτητος
  choice: नम्रता
  rationale: यह कोमलता, विनय और अहिंसक सौम्यता का भाव रखता है; ‘नम्रता’ प्रचलित और गरिमापूर्ण चयन है।
- source_word: ἐπιεικὲς
  choice: संयम
  rationale: वाणी के संदर्भ में यह सौम्यता, मर्यादा और आत्मसंयम को इंगित करता है; मौन के साथ ‘संयम’ सर्वाधिक स्वाभाविक है।
- source_word: προσκλίσεις
  choice: पक्षपात
  rationale: शाब्दिक रूप से किसी ओर झुकाव; यहाँ लोगों के प्रति भेदभावपूर्ण पक्षधरता अभिप्रेत है।
- source_word: ὁσίως
  choice: पवित्र भाव से
  rationale: क्रियाविशेषण श्रद्धापूर्ण, धर्मनिष्ठ या पवित्र रीति से प्रेम देने को विशेषित करता है; इसे ‘परमेश्वर का भय मानने’ से नहीं, प्रेम देने की रीति से जोड़ा गया है।
theological_decisions:
- issue: ὁσίως का वाक्यगत संबंध
  choice: ‘पवित्र भाव से’ को प्रेम समान रूप में देने की क्रिया से जोड़ा गया
  alternative: इसे ‘जो पवित्रता से परमेश्वर का भय मानते हैं’ के रूप में φοβουμένοις के साथ जोड़ना
  rationale: यूनानी शब्दक्रम दोनों संबंधों की कुछ संभावना रखता है, पर वाक्य के अंत में क्रियाविशेषण का मुख्य क्रिया παρεχέτωσαν को विशेषित करना स्वाभाविक है; अंग्रेज़ी परामर्श-पाठ भी यही समझ दर्शाता है।
- issue: ἁγνεία का दायरा
  choice: व्यापक नैतिक ‘पवित्रता’
  alternative: विशेष रूप से ‘ब्रह्मचर्य’ या ‘यौन शुद्धता’
  rationale: इस पद में संदर्भ किसी संकीर्ण वैवाहिक या तपस्वी सिद्धांत को बाध्य नहीं करता; व्यापक अर्थ को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। समानांतर आज्ञार्थक संरचना बनाए रखी गई है। ‘मौन के द्वारा’ मूल की अभिव्यक्ति को निकटता से सुरक्षित रखता है, और अंतिम खंड में समान प्रेम तथा पक्षपात-विरोध का तनाव स्पष्ट रखा गया है।
