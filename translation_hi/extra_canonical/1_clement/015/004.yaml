source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν καὶ τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν, ἡ δὲ καρδία αὐτῶν οὐκ εὐθεῖα μετ᾽ αὐτοῦ, οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/004.yaml
  text: And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.”
translation:
  language: hi
  text: और फिर वह कहता है, “उन्होंने अपने मुँह से उससे प्रेम किया और अपनी जीभ से उससे झूठ बोला; पर उनका हृदय उसके प्रति खरा नहीं था, और न वे उसकी वाचा में विश्वासयोग्य रहे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν
  choice: उन्होंने अपने मुँह से उससे प्रेम किया
  rationale: यूनानी अभिव्यक्ति का रूपक और केवल मुख से किए गए प्रेम-दावे का निहित तनाव बनाए रखा गया है।
- source_word: ἐψεύσαντο αὐτόν
  choice: उससे झूठ बोला
  rationale: मध्यवाची क्रिया और कर्मवाचक सर्वनाम का स्वाभाविक हिन्दी रूप; अर्थ है कि उन्होंने उसके सामने या उससे असत्य कहा।
- source_word: οὐκ εὐθεῖα μετ᾽ αὐτοῦ
  choice: उसके प्रति सीधा नहीं था
  rationale: εὐθεῖα का मूल बिंब ‘सीधा/खरा’ सुरक्षित रखा गया है; μετ᾽ αὐτοῦ को प्रसंगानुकूल ‘उसके प्रति’ कहा गया है।
- source_word: οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ
  choice: और न वे उसकी वाचा में विश्वासयोग्य रहे
  rationale: ἐπιστώθησαν को अनावश्यक ‘पाए गए’ जोड़े बिना विश्वासयोग्यता के रूप में व्यक्त किया गया; διαθήκη के लिए बाइबिलीय किन्तु प्रचलित ‘वाचा’ चुना गया है।
theological_decisions:
- issue: ἐπιστώθησαν की व्याख्या
  choice: विश्वासयोग्य रहे
  alternative: विश्वासयोग्य ठहरे / दृढ़ किए गए
  rationale: रूप को निष्क्रिय अथवा अकर्मक दोनों तरह समझने की व्याकरणिक संभावना है, पर भजन-संदर्भ और समानांतर नैतिक कथन में ‘विश्वासयोग्य रहे’ सबसे स्वाभाविक है; यह ‘पाए गए’ जैसी अतिरिक्त न्यायिक छाया नहीं जोड़ता।
- issue: διαθήκη का अर्थ
  choice: वाचा
  alternative: विधान / करार
  rationale: यहाँ परमेश्वर के साथ बाइबिलीय संबंध का संकेत है; ‘वाचा’ उस धार्मिक-साहित्यिक अर्थ को ठीक प्रकार व्यक्त करती है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और शास्त्रीय उद्धरण के अनुरूप शैली। ‘मुँह’, ‘जीभ’, ‘सीधा हृदय’ और ‘वाचा’ जैसे मूल बिंब सुरक्षित रखे गए हैं।
