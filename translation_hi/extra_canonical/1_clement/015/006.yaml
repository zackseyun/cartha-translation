  text: ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν καὶ τοῦ στεναγμοῦ τῶν πενήτων νῦν ἀναστήσομαι, λέγει κύριος· θήσομαι ἐν σωτηρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/006.yaml
  text: ‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety.’
translation:
  language: hi
  text: “गरीबों की दुर्दशा और ज़रूरतमंदों की कराह के कारण अब मैं उठ खड़ा होऊँगा,” प्रभु कहता है। “मैं उसे सुरक्षा में रखूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταλαιπωρίας
  choice: दुर्दशा
  rationale: यह शब्द गरीबों की पीड़ा, क्लेश और दयनीय दशा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: πτωχῶν
  choice: गरीबों
  rationale: सामान्य आधुनिक हिन्दी में आर्थिक और सामाजिक अभाव से ग्रस्त लोगों के लिए स्पष्ट शब्द।
- source_word: στεναγμοῦ
  choice: कराह
  rationale: पीड़ा से निकलने वाली गहरी आह या करुण ध्वनि का सजीव और सहज अनुवाद।
- source_word: πενήτων
  choice: ज़रूरतमंदों
  rationale: πτωχῶν के साथ उपस्थित निकटार्थक भेद को रखते हुए अभावग्रस्त लोगों का स्वाभाविक वर्णन करता है।
- source_word: ἀναστήσομαι
  choice: उठ खड़ा होऊँगा
  rationale: दखल देने या कार्रवाई करने के लिए उठने की भाव-छाया को केवल ‘उठूँगा’ से अधिक स्पष्ट करता है।
- source_word: θήσομαι ἐν σωτηρίῳ
  choice: सुरक्षित स्थान में रखूँगा
  rationale: θήσομαι की स्थापना/रखने की क्रिया और σωτήριον के सुरक्षा-संबंधी अर्थ को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
theological_decisions:
- issue: θήσομαι का अव्यक्त कर्म
  choice: उसे
  alternative: मैं सुरक्षा प्रदान करूँगा
  rationale: यूनानी पाठ में कर्म प्रत्यक्ष रूप से व्यक्त नहीं है, जबकि उद्धृत भजन-परंपरा और अंग्रेज़ी परामर्श पाठ इसे एकवचन पुरुषवाचक कर्म के रूप में समझते हैं। ‘उसे’ इस पारंपरिक अर्थ को संक्षेप में रखता है, पर किसी विशिष्ट व्यक्ति की पहचान नहीं जोड़ता।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है; ‘प्रभु’ उसी रूप को सीधे दर्शाता है और पीछे निहित हिब्रू ईश-नाम को अनावश्यक रूप से पुनर्निर्मित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, सहज और मौखिक उद्धरण के अनुकूल है। समानांतर वाक्यांशों और भविष्यकालीन दिव्य घोषणा की संरचना सुरक्षित रखी गई है।
