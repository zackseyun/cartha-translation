  choice: ‘मुँह से … पर हृदय से …’
  alternative: ‘होठों से … किंतु मन में …’
  rationale: ‘मुँह’ और ‘हृदय’ मूल यूनानी की शारीरिक-रूपक भाषा को बनाए रखते हैं और किसी विशेष व्याख्या को आरोपित नहीं करते।
