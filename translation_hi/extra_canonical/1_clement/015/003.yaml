- source_word: εὐλογοῦσαν
  choice: आशीष देते थे
  rationale: यह क्रिया अपूर्ण भूतकाल में है और निरंतर या बार-बार किए जाने वाले आशीष देने के कार्य को व्यक्त करती है।
- source_word: κατηρῶντο
  choice: शाप देते थे
