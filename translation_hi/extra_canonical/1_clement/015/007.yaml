lexical_decisions:
- source_word: παρρησιάσομαι
  choice: मैं निडर होकर बोलूँगा
  rationale: यह मध्यम-रूप भविष्यकालीन क्रिया खुलकर, साहस या निर्भीकता से बोलने का भाव देती है। ‘निडर होकर बोलूँगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस बल को सुरक्षित रखता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यूनानी पूर्वसर्ग ἐν का मूल और जानबूझकर अस्पष्ट संबंध बनाए रखने के लिए शाब्दिक ‘उसमें’ रखा गया है; संदर्भानुसार इसका अर्थ ‘उसके विषय में’ भी समझा जा सकता है।
theological_decisions:
- issue: ἐν αὐτῷ में सर्वनाम का संबंध और अर्थ
  choice: उसमें
  alternative: उसके विषय में / उसके लिए
  rationale: संक्षिप्त यूनानी वाक्यांश यह स्पष्ट नहीं करता कि ἐν साधन, क्षेत्र, विषय या हित का संबंध व्यक्त करता है। ‘उसके लिए’ चुनने से व्याख्या अनावश्यक रूप से निश्चित हो जाती; मुख्य पाठ में ‘उसमें’ स्रोत की वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। उद्धरण-खंड की प्रथम पुरुष भविष्यकालीन शैली सुरक्षित रखी गई है; मुख्य पाठ स्रोत के असामान्य और अस्पष्ट ‘उसमें’ को सहजतर व्याख्या से प्रतिस्थापित नहीं करता।
