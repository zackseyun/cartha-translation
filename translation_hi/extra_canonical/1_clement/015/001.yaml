translation:
  language: hi
  text: इसलिए हम उन लोगों से जुड़ें जो भक्ति के साथ शान्तिपूर्वक रहते हैं, न कि उनसे जो कपट के साथ शान्ति चाहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: हम ... से जुड़े रहें
  rationale: यह क्रिया घनिष्ठ रूप से जुड़ने या संगति रखने का भाव व्यक्त करती है; हिन्दी में यह सहज और मूल के hortatory subjunctive को बनाए रखती है।
- source_word: εἰρηνεύουσιν
  choice: शान्ति से रहते हैं
  rationale: यहाँ क्रिया शांतिपूर्वक रहने अथवा मेल बनाए रखने का भाव दे सकती है। ‘शान्ति से रहते हैं’ स्वाभाविक हिन्दी है और εὐσεβείας को शान्ति का कर्म बनने से रोकती है।
- source_word: εὐσεβείας
  choice: भक्ति
  rationale: आरम्भिक मसीही सन्दर्भ में यह परमेश्वर के प्रति श्रद्धापूर्ण, धर्मनिष्ठ आचरण का सूचक है; ‘भक्ति’ संक्षिप्त और सामान्य-पाठक के लिए स्पष्ट है।
- source_word: βουλομένοις εἰρήνην
  choice: शान्ति चाहते हैं
  rationale: शाब्दिक संरचना ‘शान्ति की इच्छा रखनेवालों’ की है; सहज हिन्दी में ‘शान्ति चाहते हैं’ उसी अर्थ को रखता है।
- source_word: ὑποκρίσεως
  choice: कपट
  rationale: यह दिखावे, ढोंग या निष्कपटता के अभाव को दर्शाता है। ‘कपट’ गरिमापूर्ण और व्यापक हिन्दी समतुल्य है।
theological_decisions:
- issue: εἰρηνεύουσιν का अर्थ
  choice: शान्ति से रहते हैं
  alternative: मेल कराते हैं / शान्ति स्थापित करते हैं
  rationale: क्रिया के अकर्मक ‘शान्तिपूर्वक रहना’ और सक्रिय ‘मेल रखना/कराना’ दोनों भाव सम्भव हैं। सन्दर्भ और समानांतर ‘शान्ति चाहते हैं’ को देखते हुए अकर्मक अनुवाद मुख्य पाठ में अधिक स्वाभाविक है, बिना किसी विशेष सिद्धान्तगत अर्थ को आरोपित किए।
- issue: μετ᾽ εὐσεβείας और μεθ᾽ ὑποκρίσεως का सम्बन्ध
  choice: 'रीति अथवा साथ रहनेवाली गुणवत्ता: ‘भक्ति के साथ’ और ‘कपट के साथ’'
  alternative: ‘भक्ति से मेल करना’ और ‘कपट से मेल करना’
  rationale: पूर्वसर्गीय पद शान्तिपूर्ण जीवन और शान्ति की इच्छा की रीति/गुणवत्ता बताते हैं; भक्ति और कपट को मेल के लक्ष्य समझना यूनानी वाक्य का भ्रामक अर्थ होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘हम ... जुड़े रहें’ सामूहिक प्रोत्साहन को व्यक्त करता है। ‘शान्ति’ वर्तनी पूरे पाठ में औपचारिक साहित्यिक रजिस्टर बनाए रखती है।
