translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उद्धरण की समानांतर रचना—होंठों का बाहरी आदर और हृदय की भीतरी दूरी—संरक्षित है। किसी विशिष्ट धर्मग्रंथ का नाम स्रोत में नहीं दिया गया, इसलिए अनिर्दिष्ट ‘कहीं’ बनाए रखा गया है।
