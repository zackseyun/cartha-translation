  text: For somewhere it says, “This people honors me with their lips, but their heart is far from me.”
translation:
  language: hi
  text: क्योंकि कहीं कहा गया है, “ये लोग होंठों से मेरा आदर करते हैं, पर उनका हृदय मुझसे दूर है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  choice: क्योंकि कहीं लिखा है
  rationale: शाब्दिक अर्थ ‘क्योंकि कहीं वह कहता है’ है, पर यह सूत्र किसी धर्मग्रंथ के अनिर्दिष्ट उद्धरण का परिचय देता है; आधुनिक हिन्दी में ‘कहीं लिखा है’ स्वाभाविक और आशय-संगत है।
- source_word: ὁ λαὸς
  choice: ये लोग
  rationale: समूहवाचक एकवचन का अर्थ यहाँ लोगों का समुदाय है; ‘ये लोग’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के बहुवचन रूप से मेल खाता है।
- source_word: τοῖς χείλεσιν με τιμᾷ
  choice: होंठों से मेरा आदर करते हैं
  rationale: ‘होंठों से’ स्रोत की देह-संबंधी छवि बनाए रखता है और ‘मेरा आदर करते हैं’ τιμᾷ का स्पष्ट, सामान्य हिन्दी रूप है।
- source_word: ἡ δὲ καρδία αὐτῶν πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  choice: पर उनका हृदय मुझसे दूर है
  rationale: ‘हृदय’ आंतरिक निष्ठा की मूल छवि को सुरक्षित रखता है; ‘मुझसे दूर है’ πόρρω ἀπέστιν का संक्षिप्त और स्वाभाविक अनुवाद है।
