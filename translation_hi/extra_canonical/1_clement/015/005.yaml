source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν. καὶ πάλιν· Ἐξολεθρευθῆσαν κύριος πάντα τὰ χείλη τὰ δόλια, γλῶσσαν μεγαλοῤῥήμονα, τοὺς εἰπόντας· Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν, τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν· τίς ἡμῶν κύριός ἐστιν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/005.yaml
  text: Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will magnify our tongue; our lips are our own; who is lord over us?’”
translation:
  language: hi
  text: इसी कारण वे कपटी होंठ मौन हो जाएँ, जो धर्मी के विरुद्ध अधर्म की बातें बोलते हैं। और फिर, “प्रभु सब कपटी होंठों, डींगें हाँकने वाली जीभ, और उन लोगों का नाश कर दे जो कहते हैं, ‘हम अपनी जीभ की बड़ाई करेंगे; हमारे होंठ हमारे अपने हैं; हमारा स्वामी कौन है?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλαλα γενηθήτω
  choice: मौन हो जाएँ
  rationale: यूनानी में वाणीहीन हो जाने की आज्ञार्थक/कामनार्थक अभिव्यक्ति है; ‘मौन हो जाएँ’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: τὰ χείλη τὰ δόλια
  choice: कपटी होंठ
  rationale: δόλια छल और कपट का बोध कराता है; काव्यात्मक शारीरिक रूपक को बनाए रखा गया है।
- source_word: ἀνομίαν
  choice: अधर्म की बातें
  rationale: शाब्दिक अर्थ ‘अधर्म/व्यवस्थाहीनता’ है; λαλοῦντα के साथ हिन्दी में वाक्य को स्वाभाविक बनाने के लिए ‘की बातें’ जोड़ा गया है।
- source_word: τοῦ δικαίου
  choice: धर्मी
  rationale: एकवचन विशेषण का संज्ञात्मक प्रयोग है; इसे किसी विशिष्ट व्यक्ति या सामूहिक वर्ग के रूप में अनावश्यक रूप से निर्धारित नहीं किया गया।
- source_word: γλῶσσαν μεγαλοῤῥήμονα
  choice: डींगें हाँकने वाली जीभ
  rationale: शब्द का आशय बड़ी-बड़ी या अहंकारी बातें बोलने वाली जीभ है; यह हिन्दी में जीवंत रहते हुए मूल रूपक को सुरक्षित रखता है।
- source_word: Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν
  choice: हम अपनी जीभ को महान बनाएँगे
  rationale: μεγαλυνοῦμεν के ‘महान/बड़ा करना’ भाव को जानबूझकर बनाए रखा गया है, यद्यपि कथन का आशय अपनी वाणी की शक्ति का अभिमान करना है।
- source_word: τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν
  choice: हमारे होंठ हमारे अपने हैं
  rationale: παρ᾽ ἡμῖν स्वामित्व या अपने नियंत्रण में होने का भाव दे सकता है; यह अनुवाद उसी दावे को सहज हिन्दी में व्यक्त करता है।
- source_word: τίς ἡμῶν κύριός ἐστιν
  choice: हमारा स्वामी कौन है?
  rationale: ‘हम पर कौन प्रभु है?’ की चुनौती को प्राकृतिक हिन्दी में रखा गया है, बिना ‘प्रभु’ को अनिवार्यतः ईश्वरीय उपाधि मानकर तनाव मिटाए।
theological_decisions:
- issue: τοῦ δικαίου का संदर्भ
  choice: धर्मी
  alternative: उस धर्मी जन / धर्मियों
  rationale: यूनानी पाठ एकवचन है और यह स्पष्ट नहीं करता कि कोई विशिष्ट धर्मी व्यक्ति अभिप्रेत है या आदर्श धर्मी; संक्षिप्त एकवचन इस अस्पष्टता को सुरक्षित रखता है।
- issue: κύριος का प्रयोग
  choice: पहले प्रसंग में ‘प्रभु’, अंतिम प्रश्न में ‘स्वामी’
  alternative: दोनों स्थानों पर ‘प्रभु’
  rationale: पहला κύριος विनाश करने वाले परमेश्वर को सूचित करता है, जबकि अंतिम वाक्य विद्रोही वक्ताओं का सामान्य प्रभुत्व-अस्वीकार है; ‘स्वामी’ हिन्दी में उस चुनौती को अधिक स्पष्ट और स्वाभाविक रूप से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य काव्यात्मक गद्य। मूल के होंठ और जीभ संबंधी रूपकों तथा कामनार्थक आदेशों को बनाए रखा गया है। उद्धरण की शुरुआत स्पष्ट करने के लिए ‘लिखा है’ जोड़ा गया है; यह καὶ πάλιν के उद्धरण-संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
