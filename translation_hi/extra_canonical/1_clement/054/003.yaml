    issue: Primary rendering of ὁ ποιήσας uses a future verb.
    rationale: “जो ऐसा करेगा” translates the action as future, whereas ποιήσας is an aorist participle and presents it as performed/completed. The accompanying footnote identifies the closer sense, so it should be the main text.
