id: 1CLEM.54.3
reference: 1 Clement 54:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο ὁ ποιήσας ἑαυτῷ μέγα κλέος ἐν Χριστῷ περιποιήσεται, καὶ πᾶς τόπος δέξεται αὐτόν. τοῦ γὰρ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/003.yaml
  text: The one who does this will obtain for himself great renown in Messiah[a], and every place will receive him. For the earth is the Lord’s, and its fullness.
translation:
  language: hi
  text: जिसने ऐसा किया है[a], वह मसीह में अपने लिए बड़ा यश अर्जित करेगा, और हर जगह उसका स्वागत होगा। क्योंकि पृथ्वी और जो कुछ उसमें है, वह प्रभु का है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो ऐसा करे।”
    reason: ὁ ποιήσας संज्ञा के रूप में प्रयुक्त एओरिस्ट कृदंत है। मुख्य अनुवाद उसके पूर्णतासूचक भाव को रखता है; वैकल्पिक रूप सामान्य अथवा प्रसंगगत भाव को व्यक्त करता है।
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: जो ऐसा करेगा
  rationale: यूनानी में यह संज्ञा के रूप में प्रयुक्त अओरिस्ट कृदंत है। प्रसंग और आगे के भविष्यकाल को देखते हुए हिन्दी में भविष्यसूचक रूप स्वाभाविक है; पादटिप्पणी पूर्ण हो चुके कार्य की सम्भावना सुरक्षित रखती है।
- source_word: μέγα κλέος
  choice: बड़ा यश
  rationale: κλέος सार्वजनिक प्रतिष्ठा, ख्याति या यश को सूचित करता है; ‘बड़ा यश’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός के पदवीगत अर्थ को सीधे और स्वाभाविक हिन्दी रूप ‘मसीह’ से व्यक्त किया गया है।
- source_word: περιποιήσεται
  choice: अपने लिए … अर्जित करेगा
  rationale: मध्यवाच्य क्रिया में अपने लिए प्राप्त या अर्जित करने का भाव है, जिसे हिन्दी में स्पष्ट रखा गया है।
- source_word: πᾶς τόπος δέξεται αὐτόν
  choice: हर जगह उसका स्वागत होगा
  rationale: शाब्दिक ‘हर स्थान उसे ग्रहण करेगा’ हिन्दी में अस्वाभाविक है; यह रूप स्थान-स्थान पर स्वीकार और आतिथ्य मिलने का आशय स्वाभाविक ढंग से देता है।
- source_word: τὸ πλήρωμα αὐτῆς
  choice: जो कुछ उसमें है
  rationale: ‘उसकी भरपूरी’ के स्थान पर यह प्रचलित हिन्दी मुहावरा पृथ्वी में समाई समस्त वस्तुओं और प्राणियों के सामूहिक अर्थ को संप्रेषित करता है।
theological_decisions:
- issue: ἐν Χριστῷ का अनुवाद
  choice: मसीह में
  alternative: ख्रीष्ट में / मसीह के कारण
  rationale: ‘मसीह में’ यूनानी संबंधसूचक वाक्यांश की व्यापकता और संभावित धर्मवैचारिक गहराई को बिना किसी एक व्याख्या तक सीमित किए बनाए रखता है।
- issue: भजन-सदृश कथन में स्वामित्व का विस्तार
  choice: पृथ्वी और जो कुछ उसमें है, वह प्रभु का है
  alternative: पृथ्वी और उसकी भरपूरी प्रभु की है
  rationale: यह πλήρωμα को पृथ्वी में समाई समस्त सृष्टि के रूप में व्यक्त करता है और कथन के सार्वभौमिक स्वामित्व को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बड़ा यश’ सार्वजनिक सम्मान का भाव देता है, जबकि ‘हर जगह उसका स्वागत होगा’ यूनानी मानवीकरण को स्वाभाविक हिन्दी में व्यक्त करता है।
