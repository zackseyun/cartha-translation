  text: εἰπάτω· Εἰ δι’ ἐμὲ στάσις καὶ ἔρις καὶ σχίσματα, ἐκχωρῶ, ἄπειμι, οὗ ἐὰν βούλησθε, καὶ ποιῶ τὰ προστασσόμενα ὑπὸ τοῦ πλήθους· μόνον τὸ ποίμνιον τοῦ Χριστοῦ εἰρηνευέτω μετὰ τῶν καθεσταμένων πρεσβυτέρων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/002.yaml
  text: Let him say[a], ‘If because of me there is faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah live in peace with the appointed elders.’
translation:
  language: hi
  text: वह कहे, “यदि मेरे कारण गुटबंदी, कलह और फूट हो रही है, तो मैं हट जाता हूँ; जहाँ तुम चाहो, वहाँ चला जाता हूँ, और समुदाय जो आदेश दे, वही करूँगा। बस, मसीह का झुंड नियुक्त प्राचीनों[a] के साथ शांति से रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नियुक्त किए गए प्राचीनों के साथ।”
    reason: καθεσταμένων πρεσβυτέρων का अधिक स्पष्ट, पर अर्थतः समतुल्य वैकल्पिक अनुवाद; नियुक्ति की रीति या पदगत संरचना निर्दिष्ट नहीं करता।
lexical_decisions:
- source_word: στάσις
  choice: गुटबंदी
  rationale: यहाँ शब्द समुदाय के भीतर दल या विरोधी गुट बनने का भाव देता है; ‘गुटबंदी’ आधुनिक हिन्दी में इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: ἔρις
  choice: कलह
  rationale: ‘कलह’ व्यक्तिगत या सामुदायिक संघर्ष और झगड़े के अर्थ को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: σχίσματα
  choice: फूट
  rationale: बहुवचन का सामूहिक भाव हिन्दी के प्रचलित द्रव्यवाचक प्रयोग ‘फूट’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: τὸ πλῆθος
  choice: समुदाय
  rationale: शाब्दिक अर्थ ‘बहुसंख्यक जन’ या ‘भीड़’ है, पर इस कलीसियाई प्रसंग में उपस्थित व्यापक समुदाय अभिप्रेत है; ‘समुदाय’ अनावश्यक नकारात्मक अर्थ से बचता है।
- source_word: τὸ ποίμνιον τοῦ Χριστοῦ
  choice: मसीह का झुंड
  rationale: चरवाही के मूल रूपक को बनाए रखते हुए Χριστός को परियोजना की नीति के अनुसार ‘मसीह’ कहा गया है।
- source_word: πρεσβυτέρων
  choice: प्राचीनों
  rationale: आरंभिक मसीही समुदाय के मान्य अगुवाई-पद के लिए प्रचलित बाइबलीय हिन्दी शब्द है और केवल आयु का संकेत देने से अधिक उपयुक्त है।
theological_decisions:
- issue: καθεσταμένων πρεσβυτέρων का पदगत अर्थ
  choice: नियुक्त प्राचीनों
  alternative: पद पर ठहराए गए प्राचीनों
  rationale: कृदंत प्राचीनों के स्थापित या नियुक्त किए जाने को दर्शाता है। मुख्य पाठ में संक्षिप्त और स्वाभाविक ‘नियुक्त’ रखा गया है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है; नियुक्ति की किसी विशिष्ट रीति को नहीं जोड़ा गया।
- issue: τοῦ πλήθους की सामुदायिक पहचान
  choice: समुदाय
  alternative: बहुसंख्यक जन
  rationale: स्रोत यह नहीं बताता कि यह कोई औपचारिक मतदान करने वाला निकाय था। इसलिए ‘समुदाय’ रखा गया है और किसी विशिष्ट कलीसियाई शासन-व्यवस्था को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हट जाता हूँ’ और ‘चला जाता हूँ’ स्रोत के दो क्रमिक क्रियापदों को अलग रखते हैं। प्रत्यक्ष कथन में बहुवचन ‘तुम’ समुदाय को संबोधित करता है।
