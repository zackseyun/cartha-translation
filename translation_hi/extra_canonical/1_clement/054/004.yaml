  text: ταῦτα οἱ πολιτευόμενοι τὴν ἀμεταμέλητον πολιτείαν τοῦ θεοῦ ἐποίησαν καὶ ποιήσουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/004.yaml
  text: These things those who live in God's unrepented way of life have done and will do[a].
translation:
  language: hi
  text: परमेश्वर के उस जीवन-मार्ग पर चलनेवाले, जिस पर कभी पछताना नहीं पड़ता, ये काम कर चुके हैं और आगे भी करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इस अभिव्यक्ति में ‘नागरिक की तरह जीवन बिताने’ और ‘नागरिक जीवन’ से जुड़े शब्द आए हैं।
    reason: यूनानी πολιτεύομαι/πολιτεία में आचरण या जीवन-पद्धति के साथ नागरिक जीवन की ध्वनि भी हो सकती है; मुख्य पाठ में स्वाभाविक अर्थ दिया गया है और पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
lexical_decisions:
- source_word: πολιτευόμενοι … πολιτείαν
  choice: जीवन-मार्ग पर चलनेवाले
  rationale: यह सजातीय क्रिया-संज्ञा प्रयोग यहाँ किसी व्यक्ति के आचरण या जीवन-पद्धति को व्यक्त करता है। हिंदी में ‘जीवन-मार्ग पर चलना’ अर्थ और अलंकारिक बल दोनों को स्वाभाविक रूप से पहुँचाता है।
- source_word: ἀμεταμέλητον
  choice: जिस पर कभी पछताना नहीं पड़ता
  rationale: इसका अर्थ ‘जिसके लिए खेद या पछतावा न हो’ है, न कि ऐसा पाप जिसका पश्चाताप न किया गया हो। यह वाक्यांश आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: ἐποίησαν καὶ ποιήσουσιν
  choice: कर चुके हैं और आगे भी करेंगे
  rationale: भूतकाल और भविष्यकाल के स्पष्ट विरोध को बनाए रखा गया है; ‘आगे भी’ हिंदी में भावी निरंतरता को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: τοῦ θεοῦ का संबंध
  choice: ‘परमेश्वर के … जीवन-मार्ग’ के रूप में परमेश्वर से संबंधित जीवन-पद्धति
  alternative: ‘परमेश्वर की नागरिकता’ या ‘परमेश्वर के राज्य का नागरिक जीवन’
  rationale: पाठ में राज्य या राज्यसत्ता का स्पष्ट उल्लेख नहीं है। इसलिए राजनीतिक-धार्मिक अर्थ को अनावश्यक रूप से निश्चित किए बिना व्यापक ‘जीवन-मार्ग’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जिस पर कभी पछताना नहीं पड़ता’ अंग्रेज़ी के भ्रामक ‘unrepented’ से बचते हुए यूनानी विशेषण का सकारात्मक आशय स्पष्ट करता है।
