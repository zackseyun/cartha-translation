  text: so that they may report to us all the sooner the peace and concord we have prayed for and desired[a], in order that we too may more quickly rejoice concerning your good order.
translation:
  language: hi
  text: ताकि वे जितनी जल्दी हो सके हमें उस शांति और एकता का समाचार दें, जिसके लिए हमने प्रार्थना की है और जिसकी आकांक्षा की है, और इस प्रकार हम भी तुम्हारी सुव्यवस्था के विषय में शीघ्र आनन्दित हो सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνην καὶ ὁμόνοιαν
  choice: शांति और एकता
  rationale: 'दोनों निकटवर्ती किंतु अलग भावों को बनाए रखा गया है: εἰρήνη शांति और ὁμόνοια आपसी सहमति/एकता है।'
- source_word: εὐκταίαν καὶ ἐπιποθήτην
  choice: जिसके लिए हमने प्रार्थना की है और जिसकी अभिलाषा की है
  rationale: इन विशेषणों का स्वाभाविक हिन्दी में संबंधवाचक उपवाक्य द्वारा अनुवाद किया गया है, ताकि प्रार्थना और तीव्र इच्छा—दोनों भाव स्पष्ट रहें।
- source_word: εὐσταθείας
  choice: सुव्यवस्था
  rationale: यहाँ शब्द समुदाय की स्थिर, सुचारु और अच्छी दशा को सूचित करता है; ‘सुव्यवस्था’ प्रसंगानुकूल और संक्षिप्त है।
- source_word: χαρῆναι
  choice: आनन्दित हो सकें
  rationale: ग्रीक क्रिया के उल्लास के भाव और उद्देश्यसूचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: εὐκταίαν καὶ ἐπιποθήτην का संबंध और बल
  choice: दोनों पदों को अलग-अलग बनाए रखते हुए ‘प्रार्थना की है’ और ‘अभिलाषा की है’ कहा गया है।
  alternative: ‘जिसके लिए हमने मन लगाकर प्रार्थना की है’
  rationale: वैकल्पिक पाठ हिन्दी में सहज है, पर वह ἐπιποθήτην में निहित अभिलाषा के अलग भाव को प्रार्थना की तीव्रता में मिला देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘तुम्हारी’ मूल बहुवचन संबोधन के सामुदायिक स्वर को बनाए रखता है। उपलब्ध स्रोत-पंक्ति अपूर्ण और OCR-दोषयुक्त है; पूर्ण वाक्य का पाठ प्रदत्त स्रोत-समीक्षा और संशोधन-साक्ष्य के आधार पर रखा गया है।
