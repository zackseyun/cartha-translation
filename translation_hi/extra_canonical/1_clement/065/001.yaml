  yaml_path: translation/extra_canonical/1_clement/065/001.yaml
  text: Send back to us quickly, in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—
translation:
  language: hi
  text: हमारी ओर से भेजे गए लोगों—क्लौदियुस एफ़ेबुस, वालेरियुस बितोन और फ़ोरतुनातुस—को शान्ति और आनन्द के साथ शीघ्र हमारे पास वापस भेज दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοὺς δὲ ἀπεσταλμένους ἀφʼ ἡμῶν
  choice: हमारी ओर से भेजे गए ... को
  rationale: यूनानी कृदन्तीय पदबंध को स्वाभाविक हिन्दी में कर्म के रूप में रखा गया है; δέ को अलग से ‘अब’ नहीं बनाया गया, क्योंकि यहाँ वह हल्का संयोजक/विषय-परिवर्तन सूचक है।
- source_word: σὺν καὶ Φορτουνάτῳ
  choice: और उनके साथ फ़ोरतुनातुस को भी
  rationale: σύν तथा καί दोनों की समावेशी शक्ति को ‘साथ’ और ‘भी’ से व्यक्त किया गया है।
- source_word: ἐν εἰρήνῃ μετὰ χαρᾶς
  choice: शान्ति और आनन्द के साथ
  rationale: दोनों भावों को स्पष्ट और स्वाभाविक हिन्दी समन्वय में रखा गया है, बिना उनके सम्बन्ध को अनावश्यक रूप से विशिष्ट किए।
- source_word: ἐν τάχει ἀναπέμψατε πρὸς ἡμᾶς
  choice: शीघ्र हमारे पास वापस भेज देना
  rationale: ἀναπέμψατε का यहाँ प्रसंगानुकूल अर्थ ‘वापस भेजना’ है; ἐν τάχει को ‘शीघ्र’ और πρὸς ἡμᾶς को ‘हमारे पास’ से व्यक्त किया गया है।
