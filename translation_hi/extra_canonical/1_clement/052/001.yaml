  yaml_path: translation/extra_canonical/1_clement/052/001.yaml
  text: The Master of all is without need, brothers; he needs nothing from anyone except that confession be made to him.
translation:
  language: hi
  text: हे भाइयो, सबका स्वामी किसी चीज़ का मोहताज नहीं है; वह किसी से कुछ नहीं चाहता, सिवाय इसके कि उसके सामने अंगीकार किया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπροσδεής
  choice: किसी चीज़ का मोहताज नहीं
  rationale: यह शब्द पूर्ण अभाव-रहितता या किसी आवश्यकता के न होने को व्यक्त करता है; आधुनिक हिन्दी में यह वाक्यांश स्वाभाविक और स्पष्ट है।
- source_word: ὁ δεσπότης τῶν ἁπάντων
  choice: सबका स्वामी
  rationale: δεσπότης के अधिकार और प्रभुत्व के भाव को ‘स्वामी’ सुरक्षित रखता है, और τῶν ἁπάντων का सहज संक्षिप्त रूप ‘सबका’ है।
- source_word: οὐδενὸς οὐδὲν χρῄζει
  choice: वह किसी से कुछ नहीं चाहता
  rationale: ‘किसी से कुछ नहीं’ यूनानी के व्यक्ति-संबंधी संबंधकारक और वस्तु-संबंधी कर्मकारक, दोनों की बलाघाती रचना को बनाए रखता है। प्रसंग में ‘चाहता’ उस बात की ओर सहजता से ले जाता है जिसकी अपेक्षा मनुष्यों से की जाती है।
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: उसके सामने अपने पाप मान लें
  rationale: यहाँ मध्यवाच्य क्रिया परमेश्वर के समक्ष स्वीकारोक्ति करने का अर्थ देती है। आगामी स्तोत्र-संदर्भ और पाप-स्वीकार की भाषा के कारण ‘अपने पाप मान लें’ मात्र स्तुति या सामान्य अंगीकार की अपेक्षा अधिक उपयुक्त है। αὐτῷ का संबंधपरक भाव ‘उसके सामने’ से स्वाभाविक रूप में आता है।
theological_decisions:
- issue: ἐξομολογεῖσθαι का अर्थ सामान्य अंगीकार/धन्यवाद है या पाप-स्वीकार
  choice: अपने पाप मान लें
  alternative: उसके प्रति अंगीकार करें / उसका धन्यवाद करें
  rationale: क्रिया में अंगीकार, पाप-स्वीकार और धन्यवाद/स्तुति की अर्थ-सीमा है। 1 क्लेमेंट 52 का निकटवर्ती संदर्भ पाप मानने और बलिदान की तुलना करता है, इसलिए यहाँ पाप-स्वीकार प्रमुख अर्थ है; फिर भी अनुवाद किसी संस्कारगत या सम्प्रदाय-विशेष अर्थ को नहीं जोड़ता।
- issue: εἰ μὴ को वास्तविक दैवी आवश्यकता समझना
  choice: सिवाय इसके कि लोग उसके सामने अपने पाप मान लें
  alternative: उसकी एकमात्र आवश्यकता यह है कि लोग पाप मानें
  rationale: पहले कथन में परमेश्वर को आवश्यकता-रहित कहा गया है; अतः अपवाद को उसकी निर्भरता के दावे के रूप में नहीं, बल्कि मनुष्यों से अपेक्षित प्रत्युत्तर के रूप में व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में गरिमापूर्ण ‘हे भाइयो’। वाक्य संक्षिप्त रखा गया है और यूनानी की ‘किसी से कुछ नहीं’ वाली दोहरी बलाघाती संरचना सुरक्षित है। ‘मोहताज’ आम पाठक के लिए सहज है, जबकि स्वर सम्मानपूर्ण बना रहता है।
