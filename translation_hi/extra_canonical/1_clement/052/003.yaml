id: 1CLEM.52.3
reference: 1 Clement 52:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Θῦσον τῷ θεῷ θυσίαν αἰνέσεως καὶ ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/003.yaml
  text: And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you, and you will glorify me.”
translation:
  language: hi
  text: और फिर वह कहता है, “परमेश्वर को स्तुति का बलिदान चढ़ा, और परमप्रधान को अपनी मन्नतें पूरी कर। अपने संकट के दिन मुझे पुकार; मैं तुझे छुड़ाऊँगा, और तू मेरी महिमा करेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θῦσον ... θυσίαν αἰνέσεως
  choice: स्तुति का बलिदान चढ़ा
  rationale: यूनानी बलिदान-संबंधी पदावली और उसकी काव्यात्मक पुनरुक्ति का स्वाभाविक हिन्दी रूप।
- source_word: ἀπόδος ... τὰς εὐχάς σου
  choice: अपनी मन्नतें पूरी कर
  rationale: यहाँ εὐχαί का अर्थ सामान्य प्रार्थनाएँ नहीं, परमेश्वर से की गई मन्नतें हैं; ἀπόδος उन्हें निभाने या पूरा करने को व्यक्त करता है।
- source_word: τῷ ὑψίστῳ
  choice: परमप्रधान के लिए
  rationale: ईश्वर के लिए प्रयुक्त उपाधि ‘Most High’ का प्रतिष्ठित और स्पष्ट हिन्दी रूप।
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: अपने संकट के दिन
  rationale: θλῖψις के कष्ट, दबाव और विपत्ति के भाव को संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξελοῦμαί σε
  choice: मैं तुझे छुड़ाऊँगा
  rationale: क्रिया संकट से बचाने या निकालने का आश्वासन देती है; ‘छुड़ाऊँगा’ इस अर्थ को सीधे रखता है।
- source_word: δοξάσεις με
  choice: तू मेरी महिमा करेगा
  rationale: δοξάζω के धार्मिक अर्थ को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: उद्धरण में परमेश्वर की प्रथम-पुरुष वाणी
  choice: ‘मुझे पुकार; मैं तुझे छुड़ाऊँगा’ को प्रत्यक्ष प्रथम पुरुष में रखा
  alternative: ‘परमेश्वर को पुकार; वह तुझे छुड़ाएगा’
  rationale: 'यूनानी पाठ में व्यक्ति-परिवर्तन जानबूझकर है: आरंभिक आज्ञाएँ परमेश्वर के विषय में हैं, फिर स्वयं परमेश्वर प्रथम पुरुष में बोलता है। इसे समतल नहीं किया गया।'
- issue: मन्नतों का धार्मिक स्वरूप
  choice: ‘मन्नतें पूरी कर’
  alternative: ‘प्रार्थनाएँ अर्पित कर’ या ‘मनौतियाँ चुका’
  rationale: भजन-संदर्भ में εὐχάς प्रतिज्ञाबद्ध मन्नतों को सूचित करता है। चुना हुआ रूप संप्रदाय-विशेष की भाषा से बचते हुए दायित्व का भाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मूल के एकवचन संबोधन को ‘तू/तेरी’ रूप में रखा गया है, क्योंकि यह प्रत्यक्ष शास्त्रीय उद्धरण की निकटता और बल को सुरक्षित रखता है।
