translation:
  language: hi
  text: क्योंकि परमेश्वर के लिए बलिदान एक टूटा हुआ मन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία
  choice: बलिदान
  rationale: यह यूनानी संज्ञा धार्मिक अर्पण या बलिदान को व्यक्त करती है; यहाँ सामान्य और स्वाभाविक हिन्दी पद उपयुक्त है।
- source_word: πνεῦμα
  choice: मन
  rationale: इस भजन-सदृश संदर्भ में πνεῦμα मनुष्य की भीतरी वृत्ति या आत्मिक दशा को दर्शाता है। केवल ‘आत्मा’ कहने से हिन्दी में अलग सत्ता का संकेत अधिक प्रबल हो सकता है; ‘मन’ टूटे और दीन अंतःकरण का स्वाभाविक बोध देता है।
- source_word: συντετριμμένον
  choice: टूटा हुआ
  rationale: शब्द का शाब्दिक अर्थ कुचला या टूटा हुआ है और यहाँ पश्चात्ताप तथा दीनता की भीतरी दशा का रूपक है; ‘टूटा हुआ’ मूल रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: πνεῦμα का मानवीय अंतःकरण के अर्थ में अनुवाद
  choice: मन
  alternative: आत्मा
  rationale: वाक्य मानवीय दीन और पश्चात्तापी आंतरिक दशा की बात करता है। ‘मन’ वर्तमान हिन्दी में इसे स्पष्ट करता है, जबकि मूल में निहित आत्मिक अर्थ को संदर्भ बनाए रखता है।
translation_notes:
