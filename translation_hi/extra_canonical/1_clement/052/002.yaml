source:
  edition: Funk 1901 (normalized OCR)
  text: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ· Ἐξομολογήσομαι τῷ κυρίῳ, καὶ ἀρέσει αὐτῷ ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς· ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/002.yaml
  text: For the chosen David says[a], “I will give thanks to the Lord, and it will please him more than a young bull with horns and hooves. Let the poor see and be glad.”
translation:
  language: hi
  text: क्योंकि चुना हुआ दाऊद कहता है, “मैं प्रभु का धन्यवाद करूँगा, और यह उसे सींग और खुर वाले एक जवान बछड़े से भी अधिक भाएगा।[a] निर्धन लोग देखें और आनन्दित हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सींग और खुर निकालता हुआ” या “उगाता हुआ।” यूनानी वाक्यांश जवान पशु के विकसित होते सींगों और खुरों का चित्र प्रस्तुत करता है।
    reason: ἐκφέροντα के असामान्य सक्रिय चित्र को सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है।
lexical_decisions:
- source_word: ὁ ἐκλεκτὸς Δαυίδ
  choice: चुना हुआ दाऊद
  rationale: ἐκλεκτός का सीधा अर्थ ‘चुना हुआ’ है; इससे लेखक द्वारा दाऊद को दिया गया सम्मानसूचक वर्णन सुरक्षित रहता है।
- source_word: Ἐξομολογήσομαι
  choice: मैं ... धन्यवाद दूँगा
  rationale: इस भजन-संदर्भ में क्रिया का अर्थ पाप स्वीकार करना नहीं, बल्कि प्रभु का धन्यवाद या उसकी स्तुति करना है। ‘धन्यवाद दूँगा’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀρέσει αὐτῷ ὑπὲρ
  choice: यह उसे ... से भी अधिक भाएगा
  rationale: ὑπέρ यहाँ तुलना में ‘से अधिक’ व्यक्त करता है और ἀρέσει प्रसन्न करने या भाने का भाव रखता है।
- source_word: μόσχον νέον
  choice: जवान बछड़ा
  rationale: μόσχος बलि योग्य बछड़े/युवा बैल को और νέος उसकी कम आयु को दर्शाता है; ‘जवान बछड़ा’ अर्थ को सहज रूप में रखता है।
- source_word: κέρατα ἐκφέροντα καὶ ὁπλάς
  choice: जिसके सींग और खुर निकल रहे हों
  rationale: ἐκφέροντα का शाब्दिक भाव ‘बाहर निकालना/उगाना’ है। यहाँ विकसित होते युवा पशु के सींग और खुर अभिप्रेत हैं; इस अनुवाद से कृदन्त का गतिशील भाव बना रहता है।
- source_word: πτωχοὶ
  choice: निर्धन लोग
  rationale: πτωχοί आर्थिक रूप से गरीब या अभावग्रस्त लोगों को सूचित करता है; ‘निर्धन लोग’ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: εὐφρανθήτωσαν
  choice: आनन्दित हों
  rationale: आज्ञार्थक रूप और हर्षित होने का अर्थ दोनों सुरक्षित हैं।
theological_decisions:
- issue: बलिदान की तुलना में धन्यवाद की श्रेष्ठता
  choice: ‘यह उसे ... से भी अधिक भाएगा’ के रूप में प्रत्यक्ष तुलना बनाए रखी गई
  alternative: इसे परमेश्वर द्वारा पशुबलि को पूर्णतः अस्वीकार करने का कथन बनाना
  rationale: यूनानी पाठ केवल तुलनात्मक प्राथमिकता व्यक्त करता है; वह यहाँ बलिदान-व्यवस्था के विषय में व्यापक धर्मवैज्ञानिक निष्कर्ष स्पष्ट रूप से नहीं देता।
- issue: ‘निर्धन’ किसे सूचित करता है
  choice: सामान्य अर्थ ‘निर्धन लोग’ रखा गया
  alternative: इसे विशेष रूप से ‘आत्मा में दीन’ या किसी निश्चित धार्मिक समुदाय के रूप में समझाना
  rationale: πτωχοί की संभावित व्यापकता को बिना अतिरिक्त व्याख्या के सुरक्षित रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। उद्धरण में भजनात्मक लय बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
