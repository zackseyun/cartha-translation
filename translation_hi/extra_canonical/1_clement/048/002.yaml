  text: πύλη γὰρ δικαίσύνης ἀνεῳγυῖα εἰς ζωὴν αὐτὴ, καθὼς γέγραπται· Ἀνοίξατέ μοι πύλας δικαιοσύνης· εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/002.yaml
  text: 'For this is the gate of righteousness[a], opened unto life itself, just as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.”'
translation:
  language: hi
  text: 'क्योंकि यही धार्मिकता का वह द्वार है जो जीवन की ओर खुला है[a], ठीक जैसा लिखा है: “मेरे लिए धार्मिकता के द्वार खोल दो; मैं उनमें प्रवेश करके प्रभु का धन्यवाद करूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि धार्मिकता का एक द्वार खोला गया है—यही जीवन की ओर जाने वाला द्वार है।”
    reason: यूनानी पाठ के सर्वनाम और वाक्य-विन्यास को अलग तरह से समझने पर यह अनुवाद संभव है।
lexical_decisions:
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यहाँ भजन-संहिता के उद्धरण में परमेश्वर के सम्मुख सही ठहरने और उसके अनुरूप आचरण का भाव है; ‘धार्मिकता’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: ἀνεῳγυῖα εἰς ζωήν
  choice: जीवन की ओर खुला
  rationale: पूर्ण कृदन्त के ‘खोला गया और अब खुला है’ भाव तथा εἰς ζωήν की दिशात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξομολογήσομαι
  choice: धन्यवाद करूँगा
  rationale: इस भजन-संदर्भ में क्रिया का अर्थ सार्वजनिक रूप से प्रभु को धन्यवाद देना या उसका गुणगान करना है; ‘धन्यवाद करूँगा’ सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: द्वार की पहचान और वाक्य-संरचना
  choice: ‘धार्मिकता का द्वार यही है’
  alternative: ‘धार्मिकता का एक द्वार खोला गया है—यही जीवन की ओर जाने वाला द्वार है’
  rationale: पाठ को αὕτη के रूप में समझने पर यह समतामूलक कथन बनता है और किसी निश्चित द्वार की पहचान करता है। उपलब्ध पाठ में αὐτή होने से बलसूचक या वैकल्पिक संरचना की संभावना बचती है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; भजन के उद्धरण में बहुवचन ‘द्वार’ तथा ‘उनमें प्रवेश करके’ को मूल यूनानी के अनुसार बनाए रखा गया है।
