source:
  edition: Funk 1901 (normalized OCR)
  text: . τοσούτῳ γὰρ μᾶλλον ταπεινοφρονεῖν ὀφείλει, ὅσῳ δοκεῖ μᾶλλον μείζων εἶναι, καὶ ζητεῖν τὸ κοινωφελὲς πᾶσιν, καὶ μὴ τὸ ἑαυτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/006.yaml
  text: For he ought to be all the more humble[a], the greater he seems to be, and to seek what is beneficial to all, and not what is his own.
translation:
  language: hi
  text: क्योंकि वह जितना अधिक बड़ा प्रतीत होता है, उतना ही अधिक उसे विनम्र होना चाहिए; और उसे सबके हित की खोज करनी चाहिए, अपने हित की नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “वह जितना अधिक बड़ा दिखाई देता है, उतना ही अधिक उसे विनम्र होना चाहिए।”
    reason: यूनानी आनुपातिक अभिव्यक्ति τοσούτῳ μᾶλλον... ὅσῳ μᾶλλον के अधिक प्रत्यक्ष, किंतु अर्थतः समतुल्य रूप को दर्ज करने के लिए।
lexical_decisions:
- source_word: ταπεινοφρονεῖν
  choice: दीनता से रहना
  rationale: यह क्रिया केवल मन की भावना नहीं, बल्कि विनम्र आचरण और आत्म-दृष्टि को भी व्यक्त करती है; ‘दीनता से रहना’ आधुनिक और स्वाभाविक हिन्दी में इस व्यापक अर्थ को रखता है।
- source_word: δοκεῖ ... μείζων εἶναι
  choice: बड़ा जान पड़ता है
  rationale: δοκεῖ की ‘प्रतीत होना’ वाली अनिश्चितता को बनाए रखता है और वास्तविक महानता का दावा नहीं करता।
- source_word: τὸ κοινωφελὲς πᾶσιν
  choice: जो सबके हित में हो
  rationale: सामूहिक लाभ या भलाई के अर्थ को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὸ ἑαυτοῦ
  choice: अपने हित
  rationale: संदर्भ में इसका आशय अपनी निजी भलाई या लाभ से है; समानांतर विरोध को स्पष्ट और संक्षिप्त रखता है।
theological_decisions:
- issue: महानता और दीनता के बीच आनुपातिक संबंध
  choice: वह जितना बड़ा जान पड़ता है, उतना ही अधिक उसे दीनता से रहना चाहिए
  alternative: वह जितना अधिक बड़ा दिखाई देता है, उतना ही अधिक उसे नम्र होना चाहिए
  rationale: मूल के τοσούτῳ μᾶλλον... ὅσῳ... आनुपातिक ढाँचे तथा δοκεῖ की प्रतीतिमूलक बारीकी—दोनों को सुरक्षित रखा गया है।
- issue: निजी हित बनाम सबका हित
  choice: अपने हित की नहीं ... जो सबके हित में हो
  alternative: अपनी वस्तु की नहीं ... जो सबके लिए लाभदायक हो
  rationale: शाब्दिक अस्पष्टता को संदर्भगत अर्थ में स्वाभाविक हिन्दी देकर सामुदायिक नैतिक आग्रह स्पष्ट किया गया है, बिना किसी संप्रदायगत अर्थ को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। γὰρ को कारणसूचक ‘क्योंकि’ से व्यक्त किया गया है। वाक्य की आनुपातिक संरचना और ‘जान पड़ता है’ द्वारा निहित वास्तविकता/प्रतीति का तनाव सुरक्षित रखा गया है।
