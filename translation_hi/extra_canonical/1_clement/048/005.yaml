  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यूनानी में चार बार आए ἤτω की समानांतर उपदेशात्मक संरचना को ‘कोई … हो’ की पुनरावृत्ति से सुरक्षित रखा गया है; लिंग-अनिश्चित τις को लिंग-निरपेक्ष ‘कोई’ से व्यक्त किया गया है।
