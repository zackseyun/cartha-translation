  yaml_path: translation/extra_canonical/1_clement/048/005.yaml
  text: Let one be faithful; let one be able to expound knowledge; let one be wise in discerning words; let one be pure in works.
translation:
  language: hi
  text: कोई विश्वासयोग्य हो; कोई ज्ञान की व्याख्या करने में समर्थ हो; कोई बातों को परखने में बुद्धिमान हो; कोई अपने कामों में शुद्ध हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: यहाँ विशेषण व्यक्ति के गुण को व्यक्त करता है। ‘विश्वासयोग्य’ विश्वास रखने और निष्ठावान होने की अर्थ-सीमा को खुला रखता है।
- source_word: γνῶσιν ἐξεπεῖν
  choice: ज्ञान की व्याख्या करने
  rationale: ἐξεπεῖν का आशय किसी विषय को विस्तार से स्पष्ट या प्रतिपादित करना है; ‘व्याख्या करने’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἐν διακρίσει λόγων
  choice: बातों को परखने में
  rationale: διάκρισις विवेकपूर्वक भेद करने या जाँचने को दर्शाता है, और λόγοι यहाँ शब्दों, कथनों या विचारों के अर्थ में हो सकता है। ‘बातों’ से यह व्यापकता बनी रहती है।
- source_word: ἁγνὸς ἐν ἔργοις
  choice: अपने कामों में शुद्ध
  rationale: ἁγνός नैतिक शुद्धता को और ἔργα आचरण में प्रकट कामों को दर्शाता है। ‘अपने’ हिन्दी में सम्बन्ध को स्वाभाविक बनाता है, बिना अर्थ जोड़े।
