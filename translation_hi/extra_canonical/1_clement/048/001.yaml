id: 1CLEM.48.1
reference: 1 Clement 48:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐξάρωμεν οὖν τοῦτο ἐν τάχει καὶ προσπέσωμεν τῷ δεσπότῃ καὶ κλαύσωμεν ἱκετεύοντες αὐτόν, ὅπως ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν καὶ ἐπὶ τὴν σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν ἀποκαταστήσῃ ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/001.yaml
  text: Let us therefore put this away quickly, and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the solemn and pure conduct of our brotherly love.
translation:
  language: hi
  text: इसलिए हम इसे शीघ्र ही दूर कर दें, और स्वामी के सामने गिरकर रोएँ और उनसे विनती करें कि वे हम पर कृपालु होकर हमसे मेल कर लें और हमें फिर से हमारे भाईचारे के प्रेम के गरिमामय और शुद्ध आचरण में लौटा दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρωμεν
  choice: हम ... दूर कर दें
  rationale: यहाँ क्रिया का अर्थ किसी दोष या बाधा को अपने बीच से हटा देना है; प्रसंगगत संकेत को हिन्दी में स्वाभाविक रखा गया है।
- source_word: δεσπότῃ
  choice: स्वामी
  rationale: शब्द प्रभुता और अधिकार रखने वाले व्यक्ति को दर्शाता है; ‘स्वामी’ उसका गरिमापूर्ण और सामान्य हिन्दी समतुल्य है।
- source_word: ἵλεως γενόμενος
  choice: हम पर कृपालु होकर
  rationale: ἵλεως अनुग्रहपूर्ण या दयालु रुख को व्यक्त करता है; हिन्दी में संबंधसूचक ‘हम पर’ भाव को स्वाभाविक बनाता है।
- source_word: ἐπικαταλλαγῇ ἡμῖν
  choice: हमसे मेल कर लें
  rationale: मूल में मेल-मिलाप की क्रिया ईश्वर के विषय में कही गई है; कर्ता और धार्मिक तनाव को बदले बिना रखा गया है।
- source_word: φιλαδελφίας
  choice: भाईचारे के प्रेम
  rationale: यह सहविश्वासियों के बीच पारिवारिक प्रेम को सूचित करता है; ‘भाईचारे का प्रेम’ आधुनिक हिन्दी में व्यापक और स्पष्ट है।
- source_word: ἀγωγὴν
  choice: आचरण
  rationale: यह जीवन-व्यवहार या चाल-चलन को दर्शाता है; ‘आचरण’ गरिमापूर्ण और सहज विकल्प है।
theological_decisions:
- issue: ईश्वर का मनुष्य से मेल करना
  choice: वे ... हमसे मेल कर लें
  alternative: वे हमारा अपने साथ मेल करा दें
  rationale: ἐπικαταλλαγῇ का व्याकरणिक कर्ता स्वामी हैं और ἡμῖν उनके हमारे साथ मेल करने को व्यक्त करता है। वैकल्पिक अनुवाद दिशा बदलकर मनुष्य को मेल कराए जाने पर बल देता, इसलिए मूल का असामान्य धार्मिक तनाव सुरक्षित रखा गया है।
- issue: कृपा और मेल-मिलाप का संबंध
  choice: हम पर कृपालु होकर हमसे मेल कर लें
  alternative: हम पर दया करके हमें क्षमा कर दें
  rationale: मूल में क्षमा का स्पष्ट शब्द नहीं है; उसे जोड़ना अर्थ को संकीर्ण कर देता। कृपालुता और मेल-मिलाप दोनों अलग-अलग सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक आग्रह का गरिमापूर्ण स्वर रखा गया है। σεμνὴν और ἁγνὴν दोनों को ἀγωγὴν के विशेषण मानकर ‘गरिमामय और शुद्ध आचरण’ अनूदित किया गया है; इन्हें ‘भाईचारे के प्रेम’ के विशेषण नहीं बनाया गया।
