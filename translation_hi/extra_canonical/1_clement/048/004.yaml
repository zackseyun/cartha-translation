base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/004.yaml
  text: Therefore[a], though many gates stand open, this gate in righteousness is the one in Christ, in which all who have entered and are directing their course in holiness and righteousness, accomplishing all things without disturbance[b], are blessed.
translation:
  language: hi
  text: इसलिए, यद्यपि बहुत-से द्वार खुले हुए हैं, धार्मिकता में स्थित यह द्वार वही है जो मसीह में है। इसमें प्रवेश कर चुके और पवित्रता तथा धार्मिकता में अपनी जीवन-यात्रा को सही दिशा में चलाते हुए, सब कुछ बिना व्याकुलता के करनेवाले सभी लोग धन्य हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य को इस प्रकार भी जोड़ा जा सकता है: “इसमें प्रवेश कर चुके और पवित्रता तथा धार्मिकता में अपनी जीवन-यात्रा को सही दिशा में चलानेवाले—जो सब कुछ बिना व्याकुलता के करते हैं—वे सभी धन्य हैं।”'
    reason: कृदंत पदबंधों के परस्पर संबंध और अंतिम क्रियाविशेषणीय वाक्यांश की हिन्दी संरचना में संभावित भिन्नता को दर्शाने के लिए।
lexical_decisions:
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यह शब्द नैतिक सत्यनिष्ठा और परमेश्वर के सम्मुख उचित आचरण—दोनों का भाव रख सकता है; ‘धार्मिकता’ इस व्यापकता को बनाए रखता है।
- source_word: ὁσιότης
  choice: पवित्रता
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण और भक्तिपूर्ण आचरण को सूचित करता है; आधुनिक हिन्दी में ‘पवित्रता’ सबसे स्वाभाविक और व्यापक समतुल्य है।
- source_word: κατευθύνω τὴν πορείαν
  choice: अपनी राह सीधी रखना
  rationale: यूनानी मुहावरा जीवन-मार्ग को ठीक दिशा में चलाने का चित्र देता है; यह अनुवाद उस रूपक को बनाए रखता है।
- source_word: ἀταράχως
  choice: बिना अशांति के
  rationale: क्रियाविशेषण का अर्थ अव्यवस्था, हलचल या विघ्न के बिना कार्य करना है; प्रसंग की सामुदायिक शांति को अनावश्यक रूप से अधिक स्पष्ट किए बिना यह अर्थ सुरक्षित रहता है।
- source_word: μακάριοι
  choice: धन्य
  rationale: यह केवल भावनात्मक प्रसन्नता नहीं, बल्कि अनुग्रहपूर्ण और प्रशंसनीय अवस्था को दर्शाता है।
theological_decisions:
- issue: ἐν Χριστῷ का अर्थ
  choice: मसीह में
  alternative: मसीह से संबंधित / मसीह वाला
  rationale: ‘मसीह में’ आरंभिक मसीही लेखन का स्थापित धर्मवैचारिक वाक्यांश है और मूल पूर्वसर्गीय संरचना को बनाए रखता है।
- issue: ἡ ἐν δικαιοσύνῃ ... ἡ ἐν Χριστῷ की संरचना
  choice: धार्मिकता का यह द्वार वही है जो मसीह में है
  alternative: यह धार्मिकता का द्वार है—अर्थात मसीह में स्थित द्वार
  rationale: दोनों स्त्रीलिंग पदबंधों में ‘द्वार’ अध्याहृत है। चुना गया रूप दोनों वर्णनों की पहचान को सुरक्षित रखता है, बिना उन्हें कारणात्मक या साधनात्मक संबंध में बदलने के।
- issue: εἰσελθόντες और κατευθύνοντες का कालगत संबंध
  choice: प्रवेश कर चुके और ... सीधी रखते हुए
  alternative: प्रवेश करनेवाले और ... सीधी रखनेवाले
  rationale: पहला कृदंत भूतकालिक/पूर्ववर्ती प्रवेश और दूसरा जारी आचरण व्यक्त करता है; हिन्दी में यह भेद स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘धार्मिकता’, ‘पवित्रता’ और ‘धन्य’ जैसे प्रतिष्ठित धार्मिक शब्द मूल की गरिमा और अर्थ-व्याप्ति के कारण रखे गए हैं। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि उसके तार्किक और कालगत संबंध सुरक्षित रखे गए हैं।
