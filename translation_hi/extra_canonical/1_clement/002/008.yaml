base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/008.yaml
  text: adorned with a venerable way of life[a], you conducted yourselves entirely in his fear; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
translation:
  language: hi
  text: गरिमामय जीवन-व्यवहार से सुशोभित होकर, तुम उसके भय में हर काम पूरा करते थे; प्रभु की आज्ञाएँ और धर्मसंगत विधियाँ तुम्हारे हृदयों की पटियाओं पर लिखी हुई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβασμίῳ πολιτείᾳ
  choice: आदरणीय चालचलन
  rationale: πολιτεία यहाँ नागरिक व्यवस्था से अधिक जीवन-व्यवहार या आचरण को दर्शाता है; σεβάσμιος उसके सम्माननीय और गरिमामय स्वरूप को व्यक्त करता है।
- source_word: κεκοσμημένοι
  choice: सुशोभित होकर
  rationale: 'कृदन्त का रूपकात्मक अर्थ बनाए रखता है: उनका आदरणीय आचरण मानो उनका आभूषण था।'
- source_word: πάντα ἐτελεῖτε
  choice: तुम पूरी तरह ... जीवन बिताते थे
  rationale: संदर्भ में यह उनके समूचे आचरण को परमेश्वर के भय से संचालित बताता है। पाठ का अधिक क्रियामुखी अर्थ ‘तुम सब कुछ पूरा करते थे’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἐν φόβῳ αὐτοῦ
  choice: उसके भय में
  rationale: बाइबिलीय ‘भय’ में श्रद्धा और उत्तरदायित्व दोनों निहित हैं; केवल ‘श्रद्धा’ कहने से मूल का तनाव घट जाता।
- source_word: τὰ προστάγματα καὶ τὰ δικαιώματα
  choice: आज्ञाएँ और धर्ममय विधियाँ
  rationale: 'दोनों निकटवर्ती कानूनी शब्दों का भेद रखा गया है: προστάγματα आदेश हैं, जबकि δικαιώματα न्यायपूर्ण/धर्मसम्मत विधान या अपेक्षाएँ हैं।'
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας
  choice: हृदय की पटियाओं पर
  rationale: शाब्दिक ‘हृदय के चौड़े भागों पर’ की अपेक्षा यह बाइबिलीय लेखन-रूपक को स्वाभाविक हिन्दी में स्पष्ट करता है और हृदय पर लिखी व्यवस्था की प्रतिध्वनि बनाए रखता है।
theological_decisions:
- issue: ‘भय’ का अर्थ
  choice: उसके भय में
  alternative: उसके प्रति श्रद्धा रखते हुए
  rationale: मूल φόβος को केवल सम्मान या श्रद्धा में सीमित नहीं किया गया; इस प्रकार उसकी नैतिक और धार्मिक गंभीरता सुरक्षित रहती है।
- issue: हृदय पर लिखी प्रभु की विधि
  choice: वर्णन को भूतकालीन दशा के रूप में रखा गया
  alternative: इसे किसी विशिष्ट वाचा-सिद्धान्त की स्पष्ट घोषणा बनाना
  rationale: ἐγέγραπτο ‘लिखी हुई थीं’ कहता है; पाठ से आगे बढ़कर किसी संप्रदायगत वाचा-व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमामय किंतु सहज रखी गई है। ‘चालचलन’, ‘उसके भय में’ और ‘हृदय की पटियाएँ’ आरम्भिक मसीही उपदेशात्मक शैली तथा बाइबिलीय प्रतिध्वनि को बनाए रखते हैं। उपलब्ध OCR में πάντες/ἐτελελεῖτε जैसी विकृतियाँ हैं; अनुवाद समीक्षित मानक पाठ πάντα ἐτελεῖτε के आशय पर आधारित है।
