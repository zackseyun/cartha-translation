id: 1CLEM.2.2
reference: 1 Clement 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως εἰρήνη βαϑεῖα καὶ λιπαρὰ ἐδέδοτο πᾶσιν καὶ ἀκόρεστος πόϑος εἰς ἀγαϑοποιΐαν, καὶ πλήρης πνεύματος ἁγίου ἐπέχυσις ἐπὶ πάντας ἐγίνετο·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/002.yaml
  text: Thus deep and rich peace had been given to all[a], and an insatiable desire for doing good, and a full outpouring of the Holy Spirit came upon all;
translation:
  language: hi
  text: इस प्रकार सबको गहरी और भरपूर शांति दी गई थी, भलाई करने की अतृप्त लालसा थी, और पवित्र आत्मा का भरपूर उंडेला जाना सब पर होता रहता था;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λιπαρά
  choice: भरपूर
  rationale: यहाँ शब्द शांति की समृद्धि, प्रचुरता और कल्याणकारी गुणवत्ता व्यक्त करता है; शाब्दिक ‘चिकनी’ आधुनिक हिन्दी में भ्रामक होगा।
- source_word: ἀκόρεστος πόθος
  choice: अतृप्त लालसा
  rationale: ἀκόρεστος ऐसी इच्छा है जो तृप्त न हो, और πόθος प्रबल अभिलाषा या लालसा है।
- source_word: ἀγαθοποιΐαν
  choice: भलाई करने
  rationale: यह संज्ञा सक्रिय रूप से अच्छा या भला करने को दर्शाती है, केवल सामान्य सद्गुण को नहीं।
- source_word: πλήρης ... ἐπέχυσις
  choice: पूरा उंडेला जाना
  rationale: मूल पाठ में ‘उंडेले जाने’ की संज्ञात्मक छवि और उसकी पूर्णता दोनों को सुरक्षित रखा गया है।
- source_word: ἐγίνετο
  choice: हो रहा था
  rationale: अपूर्ण भूतकालीन रूप बीते समय में जारी या बार-बार घट रही अवस्था को दिखाता है।
theological_decisions:
- issue: πνεύματος ἁγίου में विशेषण के लेखरहित प्रयोग का अनुवाद
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा के प्रभाव/वरदान
  rationale: मूल पाठ सीधे ‘पवित्र आत्मा’ कहता है; ‘प्रभाव’ या ‘वरदान’ जोड़ना व्याख्यात्मक होगा और उंडेले जाने की मूल धार्मिक छवि को सीमित कर देगा।
- issue: ἐπέχυσις को क्रियात्मक या संज्ञात्मक रूप में प्रस्तुत करना
  choice: पवित्र आत्मा का पूरा उंडेला जाना
  alternative: पवित्र आत्मा भरपूरी से उंडेला जा रहा था
  rationale: संज्ञात्मक रूप मूल यूनानी वाक्यरचना और ‘पूर्ण उंडेले जाने’ पर दिए गए बल को अधिक निकटता से बनाए रखता है, यद्यपि विकल्प अधिक बोलचाल की हिन्दी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ἐδέδοτο के पूर्णभूत अर्थ को ‘दी गई थी’ और ἐγίνετο के अपूर्ण भूतकाल को ‘हो रहा था’ से अलग-अलग व्यक्त किया गया है। वाक्य के समानांतर खंडों में दूसरे खंड के निहित क्रियात्मक संबंध को स्वाभाविक हिन्दी के लिए ‘थी’ से स्पष्ट किया गया है।
