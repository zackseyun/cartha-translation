id: 1CLEM.2.3
reference: 1 Clement 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: μεστοί τε ὁσίας βουλῆς, ἐν ἀγαϑῇ προϑυμίᾳ μετ’ εὐσεβοῦς πεποιϑήσεως ἐξετείνατε τὰς χεῖρας ὑμῶν πρὸς τὸν παντοκράτορα ϑεόν, ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι, εἴ τι ἀκόντες ἡμάρτετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/003.yaml
  text: And being full of holy purpose[a], with good zeal and devout confidence you stretched out your hands to God Almighty, imploring him to be merciful, if in anything you had sinned unintentionally.
translation:
  language: hi
  text: और पवित्र संकल्प से परिपूर्ण होकर, उत्तम उत्साह और श्रद्धापूर्ण भरोसे के साथ तुमने सर्वशक्तिमान परमेश्वर की ओर अपने हाथ फैलाए और उससे विनती की कि यदि तुमसे किसी बात में अनजाने में पाप हो गया हो, तो वह तुम पर दया करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁσίας βουλῆς
  choice: पवित्र संकल्प
  rationale: βουλή यहाँ विचार, अभिप्राय या संकल्प को व्यक्त करता है; ὁσία इसे पवित्र और धर्मसम्मत बताता है। ‘पवित्र संकल्प’ इस भाव को सहज हिन्दी में रखता है।
- source_word: ἐν ἀγαθῇ προθυμίᾳ
  choice: उत्तम उत्साह के साथ
  rationale: προθυμία तत्परता, उत्सुकता और उत्साह का भाव रखता है; प्रसंग में ‘उत्तम उत्साह’ स्वाभाविक और गरिमापूर्ण है।
- source_word: μετ’ εὐσεβοῦς πεποιθήσεως
  choice: श्रद्धापूर्ण भरोसे के साथ
  rationale: εὐσεβής भक्ति या श्रद्धा से युक्त होने और πεποίθησις दृढ़ भरोसे को दर्शाता है; यह अनुवाद दोनों पक्षों को बनाए रखता है।
- source_word: πρὸς τὸν παντοκράτορα θεόν
  choice: सर्वशक्तिमान परमेश्वर की ओर
  rationale: παντοκράτωρ का अर्थ सब पर प्रभुत्व रखने वाला/सर्वशक्तिमान है; हाथ फैलाने की दिशा के लिए ‘की ओर’ उपयुक्त है।
- source_word: ἱκετεύοντες αὐτὸν ἵλεων γενέσθαι
  choice: उससे विनती की कि ... वह तुम पर दया करे
  rationale: ἱκετεύω गहरी याचना को और ἵλεως कृपालु या अनुकूल होने को व्यक्त करता है। हिन्दी में ‘विनती’ और ‘दया करे’ मिलकर भाव को स्वाभाविक रूप देते हैं।
- source_word: εἴ τι ἀκόντες ἡμάρτετε
  choice: यदि तुमसे किसी बात में अनजाने में पाप हो गया हो
  rationale: ἄκοντες यहाँ जानबूझकर न किए गए, अनिच्छित या अनजाने पाप को दर्शाता है। ‘तुमसे ... हो गया हो’ उसकी अनैच्छिकता को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἄκοντες द्वारा पाप की प्रकृति
  choice: अनजाने में पाप
  alternative: अनिच्छा से पाप
  rationale: प्रसंग में शब्द का आशय दबाव में इच्छा के विरुद्ध पाप करने की अपेक्षा अज्ञान या असावधानी से हुए पाप से अधिक निकट है। यह किसी व्यापक पाप-सिद्धांत का निर्णय नहीं करता।
- issue: ἵλεων γενέσθαι का दया-संबंधी भाव
  choice: तुम पर दया करे
  alternative: तुम्हारे प्रति अनुकूल हो
  rationale: ‘दया करे’ याचना के धार्मिक भाव को स्पष्ट और स्वाभाविक हिन्दी में देता है, जबकि मूल के कृपालु/अनुकूल होने के अर्थ को संकीर्ण प्रायश्चित-पारिभाषिकता में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ग्रीक के सहभागी वाक्य-विन्यास को प्रवाहपूर्ण हिन्दी में समन्वित किया गया है; संबोधन के बहुवचन भाव के लिए ‘तुम’ रखा गया है।
