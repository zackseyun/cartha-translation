- source_word: ἀμνησίκακοι
  choice: द्वेष न रखनेवाले
  rationale: यह पिछले बुरे व्यवहार को याद रखकर वैर या रोष पालने से मुक्त होने का अर्थ देता है; ‘द्वेष न रखनेवाले’ सहज हिन्दी में इसका मुख्य भाव व्यक्त करता है।
- source_word: εἰς ἀλλήλους
  choice: एक-दूसरे के प्रति
  rationale: पारस्परिक संबंध की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
