  choice: निष्कपट
  rationale: यह शब्द सच्चे और शुद्ध मनोभाव को व्यक्त करता है; आधुनिक हिन्दी में ‘निष्कपट’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀκέραιοι
