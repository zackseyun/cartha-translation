  text: ἐπὶ τοῖς παραπτώμασιν τῶν πλησίον ἐπενϑεῖτε· τὰ ὑστερήματα αὐτῶν ἴδια ἐκρίνετε. ἀγαθοποιοί, ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/007.yaml
  text: You mourned over the trespasses of your neighbors; you considered their shortcomings to be your own. Doing good[a], ready for every good work.
translation:
  language: hi
  text: आप अपने पड़ोसियों के अपराधों पर शोक करते थे; उनकी कमियों को अपनी ही कमियाँ मानते थे। आप भलाई करनेवाले और हर भले काम के लिए तैयार थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: अपराधों
  rationale: यह शब्द चूक, उल्लंघन या अपराध का भाव रखता है; यहाँ नैतिक संदर्भ में ‘अपराधों’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: τῶν πλησίον
  choice: अपने पड़ोसियों के
  rationale: πλησίον यहाँ निकटवर्ती लोगों या पड़ोसियों को सूचित करता है; ‘अपने पड़ोसियों’ से संबंध का भाव स्पष्ट होता है।
- source_word: ἐπενθεῖτε
  choice: शोक करते थे
  rationale: क्रिया दूसरों के अपराधों पर गहरा दुःख या मातम करने का अर्थ देती है; अपूर्ण भूतकाल की पुनरावृत्त/निरंतर क्रिया को ‘करते थे’ दर्शाता है।
- source_word: ὑστερήματα
  choice: कमियों
  rationale: यह अभाव, न्यूनता या कमी को दर्शाता है; ‘कमियाँ’ व्यक्तिगत दोषों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἴδια ἐκρίνετε
  choice: अपनी ही कमियाँ मानते थे
  rationale: ἐκρίνετε का भाव यहाँ निर्णय सुनाने से अधिक किसी बात को ऐसा समझने या मानने का है; ‘ही’ आत्मीय ग्रहण पर बल देता है।
- source_word: ἀγαθοποιοί
  choice: भलाई करनेवाले
  rationale: नominative plural विशेषण/संज्ञात्मक पद का अर्थ भलाई करनेवाले लोग है। हिन्दी में पूर्ण और स्वाभाविक वाक्य हेतु निहित सहायक क्रिया अगले पद के साथ दी गई है।
- source_word: ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν
  choice: हर भले काम के लिए तैयार
  rationale: यूनानी वाक्यांश का सीधा, मुहावरेदार और व्यापक हिन्दी रूप।
theological_decisions:
- issue: दूसरों की कमियों को अपना मानना
  choice: उनकी कमियों को अपनी ही कमियाँ मानते थे
  alternative: उनकी कमियों के लिए स्वयं को उत्तरदायी ठहराते थे
  rationale: मूल पाठ सहभागिता या आत्मीय पहचान व्यक्त करता है, पर कानूनी अथवा प्रत्यक्ष दोषारोपण स्पष्ट नहीं करता; इसलिए उत्तरदायित्व का अतिरिक्त अर्थ नहीं जोड़ा गया।
- issue: ἀγαθοποιοί का वाक्यगत रूप
  choice: आप भलाई करनेवाले और हर भले काम के लिए तैयार थे
  alternative: भलाई करते हुए, हर भले काम के लिए तैयार
  rationale: यूनानी में यह स्वतंत्र क्रियारहित बहुवचन पद है। हिन्दी में निहित ‘थे’ जोड़ने से अर्थ बदले बिना पूरा और स्वाभाविक वाक्य बनता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण बहुवचन ‘आप’ और सरल, गरिमापूर्ण शब्दावली अपनाई गई है। यूनानी अपूर्ण भूतकाल को ‘करते थे/मानते थे’ से व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
