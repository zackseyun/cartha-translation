base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/004.yaml
  text: Day and night you were concerned for the whole brotherhood[a], so that the number of his elect might be saved with mercy and conscientiousness.
translation:
  language: hi
  text: तुम दिन-रात विश्वासियों के पूरे समुदाय के लिए संघर्ष करते थे,[a] ताकि उसके चुने हुए लोगों की संख्या दया और विवेक के साथ उद्धार पाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए normalized OCR में आरंभ का ‘संघर्ष’ (ἀγών) छूट गया है; Funk के पूर्ण पाठ में वाक्य ἀγὼν ἦν ὑμῖν (‘तुम्हारा संघर्ष था’) से आरंभ होता है।
    reason: पाठ-साक्ष्य में OCR से हुए शब्द-लोप की सूचना देना और अनुवाद में पुनर्स्थापित शब्द का आधार स्पष्ट करना।
  - marker: b
    text: ‘दया और विवेक के साथ’ का संबंध किससे है, यूनानी में स्पष्ट नहीं है।
    reason: मूल पाठ की व्याकरणिक और अर्थगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: ἀγών (पूर्ण यूनानी पाठ में; दिए गए normalized OCR में लुप्त)
  choice: संघर्ष
  rationale: शब्द तीव्र प्रयत्न, संघर्ष या होड़ का भाव रखता है; केवल ‘चिंता’ कहना इसकी शक्ति घटा देता है।
- source_word: ἀδελφότης
  choice: विश्वासियों का पूरा समुदाय
  rationale: शाब्दिक ‘भाईचारा’ हिन्दी में प्रायः आपसी संबंध का बोध कराता है, जबकि यहाँ विश्वासियों के समूचे समूह का संकेत है।
- source_word: τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ
  choice: उसके चुने हुए लोगों की पूरी संख्या
  rationale: ‘संख्या’ के सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ‘उसके चुने हुए’ की धार्मिक संज्ञा को स्पष्ट रखता है।
- source_word: σώζεσθαι
  choice: उद्धार पाए
  rationale: धार्मिक संदर्भ में क्रिया के उद्धार-संबंधी अर्थ को बनाए रखता है।
- source_word: μετ’ ἐλέους καὶ συνειδήσεως
  choice: दया और अंतःकरण के साथ
  rationale: दोनों संज्ञाओं को बिना ‘अच्छा’ या ‘शुद्ध’ जैसा अनुल्लिखित विशेषण जोड़े निकटता से प्रस्तुत करता है।
theological_decisions:
- issue: ‘चुने हुए लोगों की संख्या’ और उनके उद्धार का संबंध
  choice: ताकि उसके चुने हुए लोगों की पूरी संख्या ... उद्धार पाए
  alternative: ताकि उसके चुने हुए लोगों की संख्या पूरी हो और वे उद्धार पाएँ
  rationale: वैकल्पिक रूप ‘संख्या पूरी होने’ का विचार जोड़ता है, जो यूनानी वाक्य में स्पष्ट नहीं है; चुने हुओं की सामूहिक संख्या ही σώζεσθαι का व्याकरणिक कर्ता है।
- issue: ‘दया और अंतःकरण’ किसके हैं
  choice: संबंध को खुला रखा गया
  alternative: परमेश्वर की दया और तुम्हारे अच्छे अंतःकरण के द्वारा
  rationale: यूनानी पाठ इन संज्ञाओं के धारक या साधन को स्पष्ट नहीं करता; व्याख्यात्मक निर्धारण से बचना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘विश्वासियों का समुदाय’ समूहवाचक ἀδελφότης को स्वाभाविक ढंग से व्यक्त करता है। ‘अंतःकरण’ धार्मिक-नैतिक अर्थ बनाए रखता है, जबकि पाठ में न होने के कारण ‘अच्छा’ या ‘शुद्ध’ नहीं जोड़ा गया।
