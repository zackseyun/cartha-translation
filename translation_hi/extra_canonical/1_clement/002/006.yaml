    issue: Verb agreement and idiom
    rationale: ‘आपसी कलह और ... फूट तुम्हें घृणित लगती थी’ has awkward agreement for a coordinated noun phrase. Recasting as ‘... से तुम्हें घृणा थी’ is idiomatic and maintains the meaning ‘were detestable to you.’
  - severity: low
    issue: Nuance of στάσις
    rationale: In this communal context, στάσις includes factionalism/party strife. ‘गुटबाज़ी’ represents this nuance more directly than the broader ‘आपसी कलह.’
