translation:
  language: hi
  text: हर प्रकार की गुटबाज़ी और हर प्रकार की फूट से तुम्हें घृणा थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα στάσις
  choice: हर प्रकार का आपसी कलह
  rationale: στάσις यहाँ समुदाय के भीतर गुटबाज़ी, संघर्ष या विद्रोही कलह का भाव दे सकता है। ‘आपसी कलह’ प्रसंगानुकूल व्यापक अर्थ रखता है और इसे केवल राजनीतिक ‘विद्रोह’ तक सीमित नहीं करता। πᾶσα को स्वाभाविक हिन्दी में ‘हर प्रकार का’ व्यक्त किया गया है।
- source_word: πᾶν σχίσμα
  choice: हर प्रकार की फूट
  rationale: σχίσμα का मूल भाव विभाजन या दरार है। ‘फूट’ आधुनिक सामान्य हिन्दी में सामुदायिक विभाजन को स्पष्ट रूप से व्यक्त करती है; ‘मतभेद’ इसकी तीव्रता घटा देता।
- source_word: βδέλυκτον ἦν ὑμῖν
  choice: तुम्हें घृणित लगती थी
  rationale: यह अभिव्यक्ति उस समुदाय के मूल्यांकन और रवैये को बताती है। ‘घृणित लगती थी’ स्वाभाविक हिन्दी में βδέλυκτον की प्रबल नकारात्मकता और भूतकाल दोनों सुरक्षित रखता है।
theological_decisions:
- issue: στάσις और σχίσμα के बीच अर्थगत भेद
  choice: ‘आपसी कलह’ और ‘फूट’ के रूप में अलग-अलग प्रस्तुत किया
  alternative: दोनों को समानार्थी रूप में ‘गुटबाज़ी और विभाजन’ कहना
  rationale: 'यूनानी पाठ दो निकट, पर अलग अवधारणाएँ रखता है: στάσις संघर्ष/गुटीय कलह की ओर और σχίσμα उत्पन्न विभाजन की ओर संकेत करता है। अनुवाद इस तनाव को बिना किसी सांप्रदायिक अर्थ को आरोपित किए बनाए रखता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हें’ मूल बहुवचन ὑμῖν को समुदाय-संबोधन के रूप में व्यक्त करता है; वाक्य में कोई पादटिप्पणी आवश्यक नहीं है।
