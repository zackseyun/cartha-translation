id: 1CLEM.2.1
reference: 1 Clement 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντες τε ἐταπεινοφρονεῖτε μηδὲν ἀλαζονευόμενοι, ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες, ἧδον διδόντες ἢ λαμβάνοντες· τοῖς ἐφοδίοις τοῦ Χριστοῦ ἀρκούμενοι καὶ προσέχοντες, τοὺς λόγους αὐτοῦ ἐπιμελῶς ἐνεστερνισμένοι ἦτε τοῖς σπλάγχνοις, καὶ τὰ παθήματα αὐτοῦ ἦν πρὸ ὀφϑαλμῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/001.yaml
  text: And all of you were humble-minded, boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of the Messiah, and paying close attention to his words, you had embraced them carefully in your hearts, and his sufferings were before your eyes.
translation:
  language: hi
  text: और तुम सब विनम्र थे और किसी बात पर घमंड नहीं करते थे। दूसरों को अपने अधीन करने के बजाय तुम स्वयं उनके अधीन रहते थे, और लेने की अपेक्षा देने में अधिक आनंद मानते थे। मसीह की दी हुई आवश्यक सामग्री से संतुष्ट रहकर और उनके वचनों पर पूरा ध्यान देकर, तुमने उन्हें बड़े जतन से अपने हृदयों में संजो रखा था[a]; और उनके कष्ट तुम्हारी आँखों के सामने रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने भीतरी अंगों में”; यह अंतरतम और गहरी भावनाओं के केंद्र के लिए प्रयुक्त मुहावरा है।
    reason: σπλάγχνα के शाब्दिक शारीरिक अर्थ और उसके रूपकात्मक अर्थ—हृदय या अंतरतम—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  choice: दीन मन के थे
  rationale: यह क्रिया विनम्र या नम्र मनोवृत्ति को व्यक्त करती है; ‘दीन मन’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल के मनोभाव को बनाए रखता है।
- source_word: ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες
  choice: दूसरों को अपने अधीन करने के बजाय तुम स्वयं उनके अधीन रहते थे
  rationale: मूल में एक ही धातु के आत्मवाचक और कर्तृवाचक रूपों का विरोध है। हिन्दी में ‘अधीन’ की पुनरावृत्ति उस अलंकारिक विरोध को स्पष्ट रखती है।
- source_word: τοῖς ἐφοδίοις τοῦ Χριστοῦ
  choice: मसीह के दिए हुए प्रबंध से
  rationale: ἐφόδια मूलतः यात्रा के लिए आवश्यक सामग्री या साधन हैं और विस्तृत अर्थ में जीवन-निर्वाह का प्रबंध। ‘प्रबंध’ अर्थ को सहज हिन्दी में व्यक्त करता है; ‘दिए हुए’ संबंधवाची τοῦ Χριστοῦ को स्रोत के अर्थ में प्रस्तुत करता है।
- source_word: ἐνεστερνισμένοι
  choice: संजो रखा था
  rationale: क्रिया किसी बात को भीतर गहराई से ग्रहण और सुरक्षित रखने का भाव देती है। ‘संजो रखना’ केवल बौद्धिक स्मरण से अधिक आत्मीय ग्रहण को व्यक्त करता है।
- source_word: τοῖς σπλάγχνοις
  choice: अपने हृदयों में
  rationale: शाब्दिक अर्थ अंतड़ियाँ या भीतरी अंग है, पर प्राचीन यूनानी मुहावरे में यह गहरी भावना और अंतरतम का केंद्र है। आधुनिक हिन्दी में ‘हृदय’ यही रूपक स्वाभाविक ढंग से देता है।
- source_word: τὰ παθήματα αὐτοῦ
  choice: उनके दुःख-भोग
  rationale: παθήματα बहुवचन में मसीह द्वारा सहे गए कष्टों को दर्शाता है। ‘दुःख-भोग’ धार्मिक संदर्भ में स्पष्ट और गरिमापूर्ण है तथा बहुवचनात्मक व्यापकता बनाए रखता है।
theological_decisions:
- issue: τοῦ Χριστοῦ में संबंध का प्रकार
  choice: मसीह के दिए हुए प्रबंध
  alternative: मसीह के विषय में मिले यात्रा-साधन / मसीह के प्रबंध
  rationale: संबंधवाची पद स्रोत, स्वामित्व या संबद्धता बता सकता है। प्रसंग में मसीह से प्राप्त प्रबंध का अर्थ सबसे स्वाभाविक है, पर किसी विशिष्ट सांप्रदायिक धारणा को इसमें नहीं जोड़ा गया।
- issue: παθήματα का मसीह के कष्टों से संबंध
  choice: उनके दुःख-भोग
  alternative: उनकी यातनाएँ / उनके दुःख
  rationale: ‘दुःख-भोग’ कष्ट सहने के अर्थ को बनाए रखता है, पर पाठ से आगे बढ़कर प्रायश्चित की कोई विशेष व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। अपूर्ण भूतकाल की निरंतरता को ‘थे’, ‘करते थे’, ‘रहते थे’ से व्यक्त किया गया है। वाक्य को पठनीयता के लिए तीन प्रवाहमान खंडों में विभाजित किया गया है; मूल के विरोधात्मक समानांतर—अधीन होना/अधीन करना और देना/लेना—को बनाए रखा गया है।
