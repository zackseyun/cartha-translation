id: 1CLEM.14.4
reference: 1 Clement 14:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/004.yaml
  text: 'For it is written: “The upright will inhabit the land[a], and the innocent will be left upon it; but those who act lawlessly will be destroyed from it.”'
translation:
  language: hi
  text: क्योंकि लिखा है, “भले लोग देश में बसेंगे, और निष्कपट लोग उसमें बने रहेंगे; परन्तु व्यवस्था के विरुद्ध चलनेवाले उसमें से मिटा दिए जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χρηστοὶ
  choice: भले लोग
  rationale: χρηστός का मूल अर्थ भला, अच्छा या सदाचारी है। यहाँ नीतिवचन-सदृश संदर्भ में ‘भले लोग’ स्वाभाविक है और ‘धर्मी’ जैसी अधिक विशिष्ट धार्मिक शब्दावली आरोपित नहीं करता।
- source_word: οἰκήτορες γῆς
  choice: देश में बसेंगे
  rationale: οἰκήτορες निवासियों/बसनेवालों को और γῆς यहाँ भूमि या देश को दर्शाता है। भविष्यवाचक कथन को सहज हिन्दी में क्रियात्मक रूप दिया गया है।
- source_word: ἄκακοι
  choice: निष्कपट लोग
  rationale: ἄκακος का अर्थ अहानिकर, निर्दोष या छल-कपट से रहित हो सकता है। ‘निष्कपट’ इस नैतिक संदर्भ में अर्थ को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ὑπολειφθήσονται
  choice: बने रहेंगे
  rationale: शाब्दिक अर्थ ‘पीछे छोड़ दिए जाएँगे’ है, पर इस संदर्भ में आशय भूमि पर शेष रहने का है; ‘बने रहेंगे’ स्वाभाविक हिन्दी में वही भाव रखता है।
- source_word: οἱ παρανομοῦντες
  choice: व्यवस्था के विरुद्ध चलनेवाले
  rationale: παρανομέω का अर्थ कानून/व्यवस्था के विरुद्ध आचरण करना है। यह रूप केवल एक बार के ‘उल्लंघन’ के बजाय सक्रिय आचरण को बनाए रखता है।
- source_word: ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς
  choice: उसमें से मिटा दिए जाएँगे
  rationale: ἐξολεθρεύω पूर्ण विनाश या उन्मूलन दर्शाता है, और ἀπό स्थान से हटाए जाने का भाव जोड़ता है। ‘उसमें से मिटा दिए जाएँगे’ दोनों पक्षों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: γῆ का अर्थ और प्रतिज्ञा का दायरा
  choice: देश
  alternative: भूमि / पृथ्वी
  rationale: उद्धरण के ज्ञान-साहित्यिक संदर्भ में γῆ किसी निवास-प्रदेश या देश को सूचित कर सकती है। ‘देश’ इस अर्थ को रखता है, जबकि ‘पृथ्वी’ कथन को अनावश्यक रूप से वैश्विक बना सकती है।
- issue: χρηστοί की नैतिक पहचान
  choice: भले लोग
  alternative: सीधे लोग / धर्मी लोग
  rationale: पाठ नैतिक गुण बताता है, पर तकनीकी धार्मिक श्रेणी स्पष्ट नहीं करता। इसलिए ‘भले लोग’ मूल की व्यापकता और तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण शैली। उद्धरण की समानांतर संरचना तथा निष्क्रिय क्रियाओं का भाव सुरक्षित रखा गया है।
