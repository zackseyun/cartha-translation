id: 1CLEM.14.2
reference: 1 Clement 14:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/002.yaml
  text: For we will incur no ordinary harm[a], but rather great danger, if we recklessly hand ourselves over to the desires of men who fall into strife and factions, so as to estrange us from what is good.
translation:
  language: hi
  text: क्योंकि यदि हम बिना सोचे-समझे अपने आपको उन लोगों की इच्छाओं के हवाले कर दें, जो कलह और गुटबंदी में पड़ते हैं और हमें उस भली वस्तु से दूर करने पर तुले हैं, तो हमें कोई मामूली हानि नहीं, बल्कि बड़ा खतरा उठाना पड़ेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλάβην ... οὐ τὴν τυχοῦσαν
  choice: कोई मामूली हानि नहीं
  rationale: मुहावरेदार यूनानी पद का अर्थ साधारण या मामूली हानि नहीं, बल्कि गंभीर हानि है; हिन्दी में इसका स्वाभाविक रूप रखा गया।
- source_word: κίνδυνον ὑποίσομεν μέγαν
  choice: बड़ा खतरा उठाना पड़ेगा
  rationale: ὑποίσομεν का भाव किसी परिणाम या जोखिम को सहने/उठाने का है; वाक्य की शर्तात्मक संरचना के अनुरूप भविष्यगत परिणाम व्यक्त किया गया।
- source_word: ῥιψοκινδύνως
  choice: लापरवाही से
  rationale: यह क्रियाविशेषण जोखिम की परवाह किए बिना उतावले या दुस्साहसी ढंग से काम करने को दर्शाता है; सामान्य पाठक के लिए 'लापरवाही से' स्पष्ट और स्वाभाविक है।
- source_word: ἐπιδῶμεν ἑαυτοὺς
  choice: अपने आपको ... के हवाले कर दें
  rationale: मध्यवाच्य भाव स्वेच्छा से स्वयं को किसी के नियंत्रण या प्रभाव में सौंपने का संकेत देता है।
- source_word: τοῖς θελήμασιν τῶν ἀνθρώπων
  choice: उन लोगों की इच्छाओं
  rationale: θελήματα का सीधा अर्थ इच्छाएँ/चाहतें है; 'उद्देश्यों' की अपेक्षा यह स्रोत के अधिक निकट है।
- source_word: πίπτουσιν εἰς ἔριν καὶ στάσεις
  choice: कलह और गुटबंदी में पड़ते हैं
  rationale: दिए गए पाठ के πίπτουσιν को अकर्मक 'पड़ते हैं' के रूप में रखा गया; ἔρις झगड़े/कलह और στάσεις दलगत फूट या गुटबंदी को व्यक्त करता है।
- source_word: τοῦ καλοῦ ἔχοντος
  choice: भलाई
  rationale: असामान्य पाठ के बावजूद वाक्यांश का आशय 'जो अच्छा/भला है' माना गया है; हिन्दी में संक्षिप्त और स्वाभाविक संज्ञा 'भलाई' चुनी गई।
theological_decisions:
- issue: εἰς τὸ ἀπαλλοτριῶσαι में उद्देश्य अथवा परिणाम
  choice: ताकि हमें भलाई से दूर कर दें
  alternative: जिसके फलस्वरूप हम भलाई से दूर हो जाएँ
  rationale: εἰς τὸ + infinitive उद्देश्य या परिणाम दोनों का रंग रख सकता है। मुख्य पाठ में निकटतम उद्देश्यात्मक रचना रखी गई, पर इससे कोई विशिष्ट सांप्रदायिक अर्थ नहीं जोड़ा गया।
- issue: πίπτουσιν का कर्ता और ἡμᾶς का संबंध
  choice: लोग स्वयं कलह और गुटबंदी में पड़ते हैं; वे हमें भलाई से दूर करते हैं
  alternative: वे हमें कलह और गुटबंदी में डालते हैं
  rationale: दिए गए यूनानी पाठ में πίπτουσιν अकर्मक है और ἡμᾶς बाद के ἀπαλλοτριῶσαι का कर्म है; इसलिए 'हमें कलह में डालते हैं' कहना वाक्य-विन्यास को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। 'मनुष्यों' के स्थान पर संदर्भानुकूल 'लोगों', 'विभाजन' के स्थान पर सामाजिक-दलगत अर्थ वाला 'गुटबंदी', और 'जो भला है' के लिए प्रवाहपूर्ण 'भलाई' रखा गया। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
