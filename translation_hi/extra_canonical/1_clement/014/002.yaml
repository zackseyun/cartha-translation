  naturalness: The Hindi is clear and modern. Moving the purpose clause closer to its antecedent improves parsing, and 'उठाएँगे' is more direct than the impersonal 'उठाना पड़ेगा' for the Greek first-person future.
  terminology: '''कलह और गुटबंदी'' suitably conveys ἔριν καὶ στάσεις. ''इच्छाओं के हवाले कर दें'' appropriately renders τοῖς θελήμασιν ... ἐπιδῶμεν ἑαυτούς. ''दुस्साहस से'' would be too positive in some Hindi contexts; ''बिना सोचे-समझे'' naturally conveys the reckless force without importing doctrinal interpretation.'
