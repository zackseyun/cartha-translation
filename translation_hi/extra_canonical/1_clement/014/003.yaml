  yaml_path: translation/extra_canonical/1_clement/014/003.yaml
  text: Let us be kind to one another according to the compassion and gentleness of the One who made us[a].
translation:
  language: hi
  text: जिसने हमें बनाया है, उसकी करुणा और कोमलता के अनुसार हम एक-दूसरे के प्रति दयालु हों[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम अपने ही प्रति दयालु हों।”
    reason: ἑαυτοῖς व्याकरणतः आत्मवाचक भी समझा जा सकता है, यद्यपि यहाँ पारस्परिक अर्थ संदर्भानुकूल है।
lexical_decisions:
- source_word: χρηστευσώμεθα
  choice: हम ... कृपालु बनें
  rationale: यह मध्य-वाच्य प्रथम पुरुष बहुवचन का आग्रहसूचक रूप है; ‘कृपालु बनें’ दयालु व्यवहार के आह्वान को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἑαυτοῖς
  choice: एक-दूसरे के प्रति
  rationale: बहुवचन आत्मवाचक सर्वनाम यहाँ पारस्परिक अर्थ में स्वाभाविक है; समुदाय में परस्पर व्यवहार का संदर्भ भी इसी अर्थ का समर्थन करता है।
- source_word: εὐσπλαγχνίαν
  choice: करुणा
  rationale: यह गहरी, अंतःकरण से उपजी दया को दर्शाता है; ‘करुणा’ आधुनिक मानक हिन्दी में सटीक और सहज है।
- source_word: γλυκύτητα
  choice: कोमलता
  rationale: शाब्दिक ‘मधुरता’ संभव है, पर व्यक्तित्व और व्यवहार के संदर्भ में ‘कोमलता’ Greek भाव को अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: τοῦ ποιήσαντος ἡμᾶς
  choice: जिसने हमें बनाया है
  rationale: कर्तृवाचक कृदंत का सीधा, सहज अनुवाद; परमेश्वर का नाम मूल में स्पष्ट रूप से नहीं है, इसलिए उसे जोड़ा नहीं गया।
theological_decisions:
- issue: ἑαυτοῖς का आत्मवाचक अथवा पारस्परिक अर्थ
  choice: एक-दूसरे के प्रति
  alternative: अपने ही प्रति
  rationale: हेलनिस्टिक यूनानी में बहुवचन आत्मवाचक सर्वनाम पारस्परिक अर्थ रख सकता है। सामुदायिक मेल और परस्पर सद्व्यवहार के संदर्भ में यही प्रमुख अर्थ है, जबकि वास्तविक भाषिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: सृष्टिकर्ता की पहचान
  choice: जिसने हमें बनाया है
  alternative: परमेश्वर, जिसने हमें बनाया है
  rationale: मूल पाठ में केवल substantival participle है; स्पष्ट नाम जोड़ने के बजाय उसकी संकेतात्मक अभिव्यक्ति बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक उपदेश के अनुकूल शैली रखी गई है। ‘कृपालु’ और ‘कोमलता’ धार्मिक गरिमा बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
