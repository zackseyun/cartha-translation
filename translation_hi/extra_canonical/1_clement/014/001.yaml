  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/001.yaml
  text: It is right, then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are the instigators of hateful jealousy.
translation:
  language: hi
  text: इसलिए, भाइयो, यह उचित और पवित्र है कि हम परमेश्वर के आज्ञाकारी बनें, न कि उन लोगों के पीछे चलें जो घमंड और अव्यवस्था में घृणित ईर्ष्या को उकसाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घृणित ईर्ष्या के अगुवे।”
    reason: ἀρχηγοῖς का अर्थ ‘आरम्भ करानेवाले/उकसानेवाले’ के साथ-साथ ‘अगुवे’ भी हो सकता है; मुख्य पाठ सम्बन्धकारक रचना के कारण उत्प्रेरक अर्थ को प्राथमिकता देता है।
lexical_decisions:
- source_word: Δίκαιον ... καὶ ὅσιον
  choice: उचित और पवित्र
  rationale: दोनों विशेषणों का नैतिक और धार्मिक बल बनाए रखते हुए स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: ὑπηκόους ... γενέσθαι τῷ θεῷ
  choice: परमेश्वर के आज्ञाकारी बनें
  rationale: γενέσθαι के ‘बनने’ और ὑπήκοος के आज्ञापालन संबंधी अर्थ, दोनों को स्पष्ट रखता है।
- source_word: ἀλαζονείᾳ καὶ ἀκαταστασίᾳ
  choice: घमंड और अव्यवस्था
  rationale: ἀλαζονεία के दंभी अहंकार और ἀκαταστασία की अशांति/अव्यवस्था को संक्षिप्त, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μυσεροῦ ζήλους
  choice: घृणित ईर्ष्या
  rationale: ζῆλος यहाँ संदर्भानुसार नकारात्मक ‘ईर्ष्या’ है; μυσερός उसकी निंदनीय और घृणास्पद प्रकृति बताता है।
- source_word: ἀρχηγοῖς
  choice: भड़कानेवाले
  rationale: सम्बन्धकारक μυσεροῦ ζήλους के साथ यह केवल नेतृत्व नहीं, बल्कि ईर्ष्या को आरम्भ कराने या उकसाने का भाव देता है।
