  text: καὶ πάλιν λέγει· Εἶδον ἀσεβῆ ὑπερυψούμενον καὶ ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου· καὶ παρῆλθον καὶ ἰδοὺ, οὐκ ἦν, καὶ ἐξεζήτησα τὸν τόπον αὐτοῦ, καὶ οὐχ εὗρον. φύλασσε ἀκακίαν καὶ ἴδε εὐθύτητα, ὅτι ἐστὶν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/005.yaml
  text: 'And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness, because there is a remnant for a peaceable man.”'
translation:
  language: hi
  text: और फिर वह कहता है, “मैंने एक अधर्मी मनुष्य को बहुत ऊँचा उठते और लबानोन के देवदारों की तरह ऊपर उठते देखा। मैं वहाँ से गुज़रा, और देखो, वह नहीं था; मैंने उसके स्थान को ढूँढ़ा, पर वह नहीं मिला। निष्कपटता को बनाए रखो और खरेपन पर ध्यान दो, क्योंकि शांतिप्रिय मनुष्य के लिए कुछ शेष रहता है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कुछ शेष रहता है” यूनानी शब्द ἐγκατάλειμμα का अनुवाद है, जिसका मूल अर्थ “अवशेष” या “बचा हुआ अंश” है। इस भजन के इब्रानी समानांतर के आधार पर कुछ अनुवाद यहाँ “भविष्य” या “अंत” अर्थ लेते हैं।
    reason: यूनानी शब्द के प्रत्यक्ष अर्थ को मुख्य पाठ में बनाए रखते हुए, भजन-समानांतर से उत्पन्न अर्थ-अस्पष्टता को बिना किसी एक व्याख्या को निश्चित किए स्पष्ट करना।
lexical_decisions:
- source_word: ἀσεβῆ
  choice: भक्तिहीन मनुष्य
  rationale: यह शब्द ऐसे व्यक्ति को सूचित करता है जिसमें परमेश्वर के प्रति श्रद्धा या भक्ति नहीं; संदर्भ में विशेषण संज्ञा के रूप में प्रयुक्त है।
- source_word: ὑπερυψούμενον καὶ ἐπαιρόμενον
  choice: बहुत ऊँचा होते और ... सिर उठाते
  rationale: दोनों सहभागी क्रियाओं की समानांतरता रखी गई है; दूसरी अभिव्यक्ति को स्वाभाविक हिन्दी में अहंकारी उत्कर्ष का भाव देते हुए अनूदित किया गया है।
- source_word: ἀκακίαν
  choice: निष्कपटता
  rationale: शब्द का भाव बुराई, छल या दुर्भावना से रहित चरित्र है; ‘निर्दोषता’ की तुलना में ‘निष्कपटता’ नैतिक आग्रह को अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: εὐθύτητα
  choice: सीधापन
  rationale: नैतिक सच्चाई और खरे आचरण का सामान्य, सुबोध हिन्दी रूप।
- source_word: ἐγκατάλειμμα
  choice: भविष्य
  rationale: इस भजन-पंक्ति के संदर्भ में आशय अंततः बने रहने वाले परिणाम या भावी कल्याण से है; शब्द का शाब्दिक अर्थ ‘जो पीछे/शेष छोड़ा गया हो’ है, इसलिए पाठांतर-सदृश अर्थ-संभावना फुटनोट में सुरक्षित रखी गई है।
- source_word: εἰρηνικῷ
  choice: शांतिप्रिय
  rationale: यह केवल शांत अवस्था नहीं, बल्कि शांति से चिह्नित व्यक्ति को बताता है।
theological_decisions:
- issue: ἐγκατάλειμμα का अर्थ
  choice: भविष्य
  alternative: शेषफल / उत्तरवर्ती वंश
  rationale: उद्धृत भजन के व्यापक समानांतर में धर्मी या शांतिप्रिय व्यक्ति के स्थायी भविष्य का भाव सम्भवतः अभिप्रेत है, पर यूनानी संज्ञा की शाब्दिक अस्पष्टता को फुटनोट में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। उद्धरण की काव्यात्मक समानांतरता रखी गई है और अनावश्यक सांप्रदायिक शब्दावली से बचा गया है।
