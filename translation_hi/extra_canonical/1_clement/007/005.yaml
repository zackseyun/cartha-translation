  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/005.yaml
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn to him.
translation:
  language: hi
  text: आइए, हम सभी पीढ़ियों पर दृष्टि डालें और भली-भाँति समझ लें कि पीढ़ी-दर-पीढ़ी स्वामी ने उन लोगों को पश्चाताप करने का अवसर दिया, जो उसकी ओर मुड़ना चाहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν εἰς τὰς γενεὰς πάσας
  choice: हम सभी पीढ़ियों पर दृष्टि डालें
  rationale: शाब्दिक ‘सभी पीढ़ियों में से होकर चलें’ के बजाय यह स्वाभाविक हिन्दी में इतिहास की समस्त पीढ़ियों का अवलोकन करने का भाव व्यक्त करता है।
- source_word: καταμάθωμεν
  choice: भली-भाँति जान लें
  rationale: क्रिया में ध्यानपूर्वक जाँचकर अच्छी तरह समझ लेने की तीव्रता है; ‘जान लें’ के साथ ‘भली-भाँति’ उसे बनाए रखता है।
- source_word: ἐν γενεᾷ καὶ γενεᾷ
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यूनानी की पुनरुक्ति प्रत्येक क्रमिक पीढ़ी का बोध कराती है; यह हिन्दी मुहावरा उसी व्यापक और आवर्ती अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: μετανοίας τόπον
  choice: मन फिराने का अवसर
  rationale: τόπον का शाब्दिक अर्थ ‘स्थान’ है, पर यहाँ अर्थ अवसर या गुंजाइश देने का है। ‘मन फिराना’ μετάνοια के नैतिक और आध्यात्मिक परिवर्तन को सामान्य धार्मिक हिन्दी में व्यक्त करता है।
- source_word: τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν
  choice: उन लोगों को … जो उसकी ओर मुड़ना चाहते थे
  rationale: βουλομένοις की इच्छा को स्पष्ट रखा गया है और ἐπιστρέψαι ἐπ᾽ αὐτόν का अनुवाद ‘उसकी ओर मुड़ना’ किया गया है; स्रोत में स्पष्ट न होने के कारण ‘वापस’ नहीं जोड़ा गया।
theological_decisions:
- issue: ὁ δεσπότης की उपाधि
  choice: प्रभु
  alternative: स्वामी
  rationale: δεσπότης अधिकार-संपन्न स्वामी को दर्शाता है। ‘प्रभु’ आधुनिक हिन्दी के धार्मिक गद्य में गरिमापूर्ण और स्वाभाविक है, जबकि ‘स्वामी’ यहाँ किसी मानवीय गुरु या मालिक का आभास दे सकता है।
- issue: ἐπιστρέψαι में वापसी का भाव
  choice: उसकी ओर मुड़ना
  alternative: उसकी ओर लौटना
  rationale: इस प्रयोग में दिशा स्पष्ट है, पर ‘वापस’ या पूर्व संबंध की धारणा अलग से व्यक्त नहीं हुई है; इसलिए अनुवाद उस संभावित अर्थ को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक आग्रह के लिए ‘आइए’ और गरिमापूर्ण, सहज धार्मिक शब्दावली अपनाई गई है। वाक्य की ऐतिहासिक व्यापकता तथा पश्चाताप और परमेश्वर की ओर मुड़ने के बीच का संबंध सुरक्षित रखा गया है।
