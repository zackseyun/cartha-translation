lexical_decisions:
- source_word: ἴδωμεν
  choice: हम देखें
  rationale: विचार और पहचान के लिए प्रयुक्त प्रथम पुरुष बहुवचन आग्रह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καλὸν
  choice: भला
  rationale: नैतिक और गुणात्मक अच्छाई के व्यापक अर्थ को संक्षेप और गरिमापूर्वक व्यक्त करता है।
- source_word: τερπνὸν
  choice: मनभावना
  rationale: आनंददायक या हर्षकर होने का अर्थ देता है और अगले विशेषण προσδεκτόν से भेद बनाए रखता है।
- source_word: προσδεκτὸν
  choice: स्वीकार्य
  rationale: जिसे कोई ग्रहण या अनुमोदित करे, उस अर्थ को सीधे व्यक्त करता है।
- source_word: τῷ ποιήσαντι ἡμᾶς
  choice: हमें बनानेवाले को
  rationale: संज्ञीकृत कृदंत और उसके संबंधसूचक कर्म को सरल, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: τῷ ποιήσαντι ἡμᾶς का संदर्भ
  choice: हमें बनानेवाले
  alternative: हमारे सृष्टिकर्ता
  rationale: मूल में प्रयुक्त वर्णनात्मक कृदंत का अनुवाद किया गया है; स्पष्ट संज्ञा ‘सृष्टिकर्ता’ जोड़कर अभिव्यक्ति को आवश्यकता से अधिक पारिभाषिक नहीं बनाया गया।
