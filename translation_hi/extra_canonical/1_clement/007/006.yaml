translation:
  language: hi
  text: नूह ने मन फिराने का संदेश सुनाया, और जिन्होंने उसकी बात मानी, वे बचाए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυξεν
  choice: प्रचार किया
  rationale: यह क्रिया सार्वजनिक रूप से घोषणा या संदेश सुनाने का भाव रखती है; ‘प्रचार किया’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: μετάνοιαν
  choice: मन फिराव
  rationale: यह पश्चात्ताप मात्र की भावना से आगे सोच और जीवन की दिशा बदलने का भाव व्यक्त करता है।
- source_word: ὑπακούσαντες
  choice: जिन्होंने उसकी बात मानी
  rationale: यूनानी शब्द सुनकर आज्ञापालन करने का भाव रखता है। हिन्दी में यह अभिव्यक्ति उस संयुक्त अर्थ को सहज रूप से व्यक्त करती है; ‘उसकी’ का संदर्भ नूह द्वारा सुनाए गए संदेश से है।
- source_word: ἐσώθησαν
  choice: बचाए गए
  rationale: कर्मवाच्य रूप को बनाए रखता है और संकट से उद्धार का अर्थ व्यक्त करता है, बिना उस अनकहे कर्ता को स्पष्ट किए जिसने उन्हें बचाया।
theological_decisions:
- issue: बचाने वाले कर्ता की पहचान
  choice: कर्मवाच्य ‘बचाए गए’ रखा गया
  alternative: ‘परमेश्वर ने उन्हें बचाया’
  rationale: मूल यूनानी में कर्ता स्पष्ट नहीं है। सम्भावित ईश्वरीय कर्ता को पाठ में जोड़ने के बजाय मूल की संक्षिप्तता और निहितार्थ सुरक्षित रखा गया।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी; वाक्य की संक्षिप्त समानांतर संरचना तथा मूल का कारण-परिणाम संबंध सुरक्षित रखा गया है।
