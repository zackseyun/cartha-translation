source:
  edition: Funk 1901 (normalized OCR)
  text: ἀτενίσωμεν εἰς τὸ αἷμα τοῦ Χριστοῦ καὶ γνῶμεν, ὡς ἔστιν τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ, ὅτι διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθὲν παντὶ τῷ κόσμῳ μετανοίας χάριν διήνεγκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/004.yaml
  text: Let us fix our gaze on the blood of Messiah and understand how precious it is to his God and Father[a], because, having been poured out for our salvation, it brought the grace of repentance to the whole world.
translation:
  language: hi
  text: आइए, हम मसीह के लहू पर अपनी दृष्टि टिकाएँ और समझें कि वह उसके परमेश्वर और पिता के लिए कितना बहुमूल्य है[a]; क्योंकि हमारे उद्धार के लिए बहाए जाने के द्वारा उसने सारे संसार को मन-फिराने का अनुग्रह प्रदान किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के लिए, जो उसका पिता है।”
    reason: यूनानी संयुक्त पद τῷ θεῷ καὶ πατρὶ αὐτοῦ की वैकल्पिक हिन्दी संरचना दिखाने के लिए, जबकि मुख्य पाठ उसके अधिक प्रत्यक्ष संबंधपरक अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: आइए, हम ... अपनी दृष्टि टिकाएँ
  rationale: यह क्रिया ध्यानपूर्वक और लगातार देखने का भाव रखती है; यह हिन्दी अभिव्यक्ति उसके आग्रह और गहन ध्यान दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: मसीह का लहू
  rationale: Χριστός का अनुवाद ‘मसीह’ किया गया है; धार्मिक-साहित्यिक संदर्भ में ‘लहू’ परिचित, गरिमापूर्ण और बलिदान-संबंधी आशय के अनुकूल है।
- source_word: τίμιον
  choice: बहुमूल्य
  rationale: यहाँ शब्द मूल्यवान, आदरणीय और परमेश्वर की दृष्टि में महत्त्वपूर्ण होने का भाव देता है; ‘बहुमूल्य’ सहज हिन्दी में इस अर्थ को समेटता है।
- source_word: μετανοίας
  choice: मन-फिराव
  rationale: μετάνοια केवल पछतावा नहीं, बल्कि मन और दिशा के परिवर्तन का संकेत देता है; ‘मन-फिराव’ इस व्यापक भाव को सुरक्षित रखता है।
- source_word: χάριν διήνεγκεν
  choice: अनुग्रह प्रदान किया
  rationale: वाक्यांश संसार तक अनुग्रह पहुँचाने या उपलब्ध कराने का भाव देता है; ‘प्रदान किया’ हिन्दी में स्वाभाविक है और कृपा के दान का आशय बनाए रखता है।
theological_decisions:
- issue: τῷ θεῷ καὶ πατρὶ αὐτοῦ का संबंध
  choice: उसके परमेश्वर और पिता के लिए
  alternative: परमेश्वर, जो उसका पिता है, उसके लिए
  rationale: एक ही लेख τῷ दोनों संज्ञाओं को जोड़ता है और αὐτοῦ पूरे संयुक्त पद से स्वाभाविक रूप से संबंधित है। चुना हुआ पाठ इस वास्तविक संबंधपरक कथन को स्पष्ट रखता है कि परमेश्वर मसीह का परमेश्वर और पिता है; पादटिप्पणी सम्भव वैकल्पिक हिन्दी संरचना बताती है।
- issue: διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθέν का संबंध
  choice: हमारे उद्धार के लिए बहाया जाकर
  alternative: क्योंकि वह हमारे उद्धार के लिए बहाया गया था
  rationale: यूनानी कृदंत रक्त के बहाए जाने को आगे के परिणाम से जोड़ता है। हिन्दी का कृदंतीय रूप इस संबंध को बनाए रखता है, बिना कारण और परिणाम को मूल से अधिक कठोरता से निर्धारित किए।
- issue: παντὶ τῷ κόσμῳ का विस्तार
  choice: सारे संसार को
  alternative: समूचे जगत के लिए
  rationale: सम्प्रदान कारक यहाँ प्राप्तकर्ता या पहुँच के क्षेत्र को दर्शाता है। ‘सारे संसार को’ सार्वभौमिक विस्तार को सीधे व्यक्त करता है और मूल के तनाव को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘आइए, हम’ सामूहिक प्रोत्साहन को, ‘दृष्टि टिकाएँ’ गहन ध्यान को, और ‘मन-फिराव’ μετάνοια के नैतिक-आध्यात्मिक परिवर्तन को व्यक्त करता है।
