  yaml_path: translation/extra_canonical/1_clement/007/001.yaml
  text: These things, beloved, we have written not only to admonish you, but also to remind ourselves; for we are in the same arena, and the same struggle lies before us.
translation:
  language: hi
  text: हे प्रिय लोगो, ये बातें हमने केवल तुम्हें चेतावनी देने के लिए ही नहीं, बल्कि स्वयं को भी स्मरण दिलाने के लिए लिखी हैं; क्योंकि हम उसी अखाड़े में हैं, और वही संघर्ष हमारे सामने है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: स्नेहपूर्ण प्रत्यक्ष संबोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: νουθετοῦντες
  choice: समझाने के लिए
  rationale: यह क्रिया चेतावनी, सुधार और सद्बुद्धि देने का भाव रखती है; ‘समझाने’ से सामान्य पाठक के लिए यह व्यापक भाव सहज रहता है।
- source_word: ὑπομιμνήσκοντες
  choice: स्मरण दिलाने के लिए
  rationale: पहले से ज्ञात बात को फिर याद कराने का अर्थ ठीक रूप से व्यक्त होता है।
- source_word: σκάμματι
  choice: अखाड़े में
  rationale: शाब्दिक रूप से खोदी या तैयार की गई प्रतियोगिता-भूमि; प्रसंग में यूनानी व्यायाम अथवा कुश्ती के अखाड़े का रूपक है।
- source_word: ἀγὼν
  choice: संघर्ष
  rationale: प्रतियोगिता, प्रयास और कठिन संघर्ष की अर्थ-सीमा को हिन्दी में बनाए रखता है।
- source_word: ἐπίκειται
  choice: हमारे सामने है
  rationale: सामने उपस्थित या अनिवार्य रूप से आ पड़े संघर्ष का स्वाभाविक हिन्दी निरूपण है।
theological_decisions:
- issue: लेखक और पाठकों की समान नैतिक स्थिति
  choice: हम उसी अखाड़े में हैं, और वही संघर्ष हमारे सामने है
  alternative: हम भी उसी संकट में हैं और हमें भी वही लड़ाई लड़नी है
  rationale: मूल के प्रतियोगितात्मक रूपक को सुरक्षित रखते हुए लेखक द्वारा स्वयं को पाठकों के साथ रखने की विनम्रता और साझा उत्तरदायित्व को बनाए रखा गया है।
