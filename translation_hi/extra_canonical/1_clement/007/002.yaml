  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/002.yaml
  text: Therefore let us leave behind empty and futile concerns[a], and let us come to the glorious and venerable rule of our tradition.
translation:
  language: hi
  text: इसलिए हम खोखली और व्यर्थ चिंताओं को छोड़ दें और हमारी परंपरा के उस गौरवशाली और श्रद्धेय[a] नियम की ओर आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आदर के योग्य’।
    reason: σεμνός में गंभीर गरिमा के साथ आदर या श्रद्धा के योग्य होने का भाव है।
lexical_decisions:
- source_word: κενὰς καὶ ματαίας φροντίδας
  choice: खोखली और व्यर्थ चिंताएँ
  rationale: κενός और μάταιος के अलग-अलग, किंतु निकट अर्थों को बनाए रखते हुए φροντίδες को प्रसंगानुकूल ‘चिंताएँ’ कहा गया है।
- source_word: εὐκλεῆ
  choice: गौरवशाली
  rationale: यह शब्द अच्छी कीर्ति, महिमा और गौरव का भाव देता है; ‘गौरवशाली’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: σεμνὸν
  choice: श्रद्धेय
  rationale: σεμνός यहाँ ऐसी गरिमा को दर्शाता है जो आदर और श्रद्धा के योग्य है; ‘श्रद्धेय’ केवल गंभीरता के बजाय आदरणीय गरिमा को व्यक्त करता है।
- source_word: κανόνα
  choice: मानदंड
  rationale: κανών यहाँ मार्गदर्शक नियम या कसौटी के अर्थ में है; ‘मानदंड’ इस रूपक को आधुनिक और स्पष्ट हिन्दी में रखता है।
- source_word: παραδόσεως ἡμῶν
  choice: अपनी परंपरा
  rationale: ‘हमारी परंपरा’ का स्वाभाविक हिन्दी रूप, जो समुदाय को मिली और सौंपी गई परंपरा का भाव बनाए रखता है।
theological_decisions:
- issue: ‘परंपरा के मानदंड’ का स्वरूप
  choice: अपनी परंपरा के ... मानदंड
  alternative: हमें सौंपी गई शिक्षा का ... नियम
  rationale: παράδοσις का अर्थ परंपरा अथवा सौंपी गई शिक्षा दोनों हो सकता है। मुख्य पाठ में अधिक औपचारिक ‘परंपरा’ रखा गया है और किसी विशिष्ट कलीसियाई सिद्धांत को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आह्वान के अनुरूप है। दोनों प्रथम-पुरुष बहुवचन क्रियाओं को ‘हम ... छोड़ दें’ और ‘आएँ’ से बनाए रखा गया है; ‘की ओर आएँ’ यूनानी गति-बोध को जानबूझकर सुरक्षित रखता है।
