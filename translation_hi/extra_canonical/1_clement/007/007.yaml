source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
translation:
  language: hi
  text: योना ने नीनवे के लोगों के विनाश की घोषणा की; पर उन्होंने अपने पापों पर पश्चात्ताप करके, विनती करके परमेश्वर को शांत किया[a] और उद्धार पाया, यद्यपि वे परमेश्वर से पराए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को प्रसन्न किया।”
    reason: ἐξιλάσαντο τὸν θεὸν में परमेश्वर सीधा कर्म है; यह विकल्प ‘शांत किया’ के साथ निकटार्थी, किंतु कुछ कम तीव्र अभिव्यक्ति देता है।
lexical_decisions:
- source_word: καταστροφὴν
  choice: विनाश
  rationale: यहाँ यह शब्द नीनवे पर आने वाले ध्वंस या सर्वनाश की भविष्यवाणी को व्यक्त करता है; ‘विनाश’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν
  choice: अपने पापों पर पश्चात्ताप करके
  rationale: यह अनुवाद पापों के संबंध में मन-परिवर्तन और खेद, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξιλάσαντο τὸν θεὸν
  choice: परमेश्वर को मना लिया
  rationale: यूनानी में ‘परमेश्वर’ क्रिया का सीधा कर्म है। यह चयन विनती के द्वारा परमेश्वर को अनुकूल या शांत करने का भाव सहज आधुनिक हिन्दी में रखता है, बिना वाक्य-विन्यास को ‘परमेश्वर के सामने प्रायश्चित किया’ में बदलने के।
- source_word: ἱκετεύσαντες
  choice: अपनी विनती से
  rationale: कृदन्त का साधनात्मक भाव है—उन्होंने विनती करके ऐसा किया। ‘अपनी विनती से’ इस संबंध को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: यह शब्द यहाँ आने वाले विनाश से बचाए जाने को बताता है; ‘उद्धार’ स्रोत के व्यापक धार्मिक और रक्षात्मक अर्थ को बनाए रखता है।
- source_word: ἀλλότριοι τοῦ θεοῦ
  choice: परमेश्वर से पराए
  rationale: यह अभिव्यक्ति परमेश्वर से संबंध या अपनत्व के अभाव को दर्शाती है और यूनानी की तीक्ष्णता को बनाए रखती है।
theological_decisions:
- issue: ἐξιλάσαντο में प्रायश्चित/शांत करने का भाव
  choice: परमेश्वर को मना लिया
  alternative: परमेश्वर को शांत किया; परमेश्वर के सामने प्रायश्चित किया
  rationale: सीधे कर्म τὸν θεὸν के कारण वाक्य का भाव यह है कि उनकी विनती का प्रभाव परमेश्वर को अनुकूल करना था। ‘परमेश्वर के सामने प्रायश्चित किया’ यूनानी वाक्य-विन्यास को बदल देता है, जबकि ‘मना लिया’ सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल संबंध को बचाता है। वैकल्पिक अधिक औपचारिक अर्थ पाद-टिप्पणी में दिया गया है।
- issue: σωτηρία का प्रसंगगत विस्तार
  choice: उद्धार पाया
  alternative: बचा लिए गए
  rationale: प्रसंग में नीनवे का ऐतिहासिक विनाश से बचना प्रमुख है, पर स्रोत ने व्यापक धार्मिक शब्द σωτηρία चुना है। ‘उद्धार’ उसी अर्थ-विस्तार को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नीनवे के लोग’ हिन्दी में केवल ‘नीनवेवासियों’ की अपेक्षा अधिक सहज है। कृदन्तों को स्वाभाविक हिन्दी क्रम में रखा गया है, जबकि मूल का कारण-साधन संबंध सुरक्षित है।
