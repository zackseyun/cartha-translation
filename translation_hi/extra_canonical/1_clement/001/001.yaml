id: 1CLEM.1.1
reference: 1 Clement 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ τὰς αἰφνιδίους καὶ ἐπαλλήλους γενομένας ἡμῖν συμφορὰς καὶ περιστάσεις, ἀδελφοί, βράδιον νομίζομεν ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων, ἀγαπητοί, τῆς τε ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ, μιαρᾶς καὶ ἀνοσίου στάσεως, ἣν ὀλίγα πρόσωπα προπετῆ καὶ αὐθάδη ὑπέρχοντα εἰς τοσοῦτον ἀπονοίας ἐξέκαυσαν, ὥστε τὸ σεμνὸν καὶ περιβόητον καὶ πᾶσιν ἀνθρώποις ἀξιαγάπητον ὄνομα ὑμῶν μεγάλως βλασφημηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/001.yaml
  text: Because of the sudden and repeated misfortunes and crises that have happened to us, brothers, we consider that we have been somewhat slow in turning our attention to the matters disputed among you, beloved—namely, the alien and strange uprising, defiled and unholy, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of madness that your dignified and widely spoken-of name, worthy of love among all people, has been greatly blasphemed.
translation:
  language: hi
  text: भाइयो, हम पर अचानक एक के बाद एक आई विपत्तियों और संकटों के कारण, हे प्रियो, हमें लगता है कि तुम्हारे बीच विवादित विषयों पर ध्यान देने में हम देर से लगे हैं—अर्थात् उस कलुषित और अपवित्र विद्रोह पर, जो परमेश्वर के चुने हुओं के लिए पराया और अनजाना है। कुछ ढीठ और मनमाने लोगों ने उसे ऐसी उन्मत्तता की हद तक भड़का दिया है कि तुम्हारे प्रतिष्ठित, सुविख्यात और सब लोगों के लिए प्रिय नाम की बड़ी निन्दा हुई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् तुम्हारे समुदाय की प्रतिष्ठा की बड़ी बदनामी हुई है।
    reason: ‘नाम की निन्दा’ के रूपकात्मक, सामुदायिक आशय को स्पष्ट करता है; मुख्य पाठ में मूल का ‘नाम’ सुरक्षित रखा गया है।
lexical_decisions:
- source_word: συμφορὰς καὶ περιστάσεις
  choice: विपत्तियों और संकटों
  rationale: दोनों निकटार्थी यूनानी शब्दों का भेद रखते हुए स्वाभाविक आधुनिक हिन्दी दी गई है।
- source_word: ἐπιστροφὴν πεποιῆσθαι
  choice: ध्यान देने में
  rationale: यहाँ भाव किसी मामले की ओर मुड़कर उसे संबोधित करने का है; शाब्दिक ‘मुड़ना’ की अपेक्षा ‘ध्यान देना’ हिन्दी में स्पष्ट और सहज है।
- source_word: τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων
  choice: तुम्हारे बीच विवादित विषयों
  rationale: संदर्भ में ἐπιζητουμένων विचाराधीन या विवादित मामलों को सूचित करता है; παρʼ ὑμῖν को ‘तुम्हारे बीच’ रखा गया और ‘हमसे’ नहीं जोड़ा गया।
- source_word: στάσεως
  choice: विद्रोह
  rationale: στάσις यहाँ समुदाय के भीतर फूट, बगावत या विद्रोही कलह को दर्शाता है; ‘विद्रोह’ इसकी तीव्रता बनाए रखता है।
- source_word: βλασφημηθῆναι
  choice: निन्दा हुई है
  rationale: नाम या प्रतिष्ठा के अपमानित होने का भाव है; ‘निन्दा’ धार्मिक और सामान्य दोनों संदर्भों में उपयुक्त है।
theological_decisions:
- issue: τοῖς ἐκλεκτοῖς τοῦ θεοῦ का अर्थ
  choice: परमेश्वर के चुने हुओं
  alternative: परमेश्वर के निर्वाचित जनों
  rationale: ‘चुने हुए’ मूल अर्थ को बिना किसी विशिष्ट पूर्वनियति-सिद्धान्त का विस्तार किए सामान्य और बोधगम्य हिन्दी में रखता है।
- issue: ὄνομα का सामुदायिक अर्थ
  choice: तुम्हारे ... नाम
  alternative: तुम्हारी ... प्रतिष्ठा
  rationale: मूल का ‘नाम’ रूपकात्मक रूप से प्रतिष्ठा दर्शाता है; ‘नाम’ बनाए रखने से पाठ की भाषा और संभावित अर्थ-व्याप्ति दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय पर सामान्य पाठक के लिए सहज। लंबे यूनानी वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है; संबोधन और मूल की तीखी नैतिक भाषा बनाए रखी गई है।
