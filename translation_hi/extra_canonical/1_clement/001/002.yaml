id: 1CLEM.1.2
reference: 1 Clement 1:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς γὰρ παρεπιδημήσας πρὸς ὑμᾶς τὴν πανάρετον καὶ βεβαίαν ὑμῶν πίστιν οὐκ ἐδοκίμασεν; τήν τε σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν οὐκ ἐθαύμασεν; καὶ τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος οὐκ ἐκήρυξεν; καὶ τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν οὐκ ἐμακάρισεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/002.yaml
  text: For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?
translation:
  language: hi
  text: क्योंकि कौन तुम्हारे बीच कुछ समय ठहरकर तुम्हारे सर्वगुणसम्पन्न और दृढ़ विश्वास को खरा नहीं पाया? किसने मसीह में तुम्हारी संयमी और सौम्य धर्मनिष्ठा पर आश्चर्य नहीं किया? किसने तुम्हारे आतिथ्य के उदात्त स्वभाव का बखान नहीं किया? और किसने तुम्हारे पूर्ण और सुनिश्चित ज्ञान को धन्य नहीं माना?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπιδημήσας
  choice: तुम्हारे बीच कुछ समय रहा
  rationale: यह क्रिया किसी स्थान पर अस्थायी रूप से ठहरने या प्रवास करने को दर्शाती है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रूप से वही भाव देती है।
- source_word: πανάρετον
  choice: सर्वगुणसम्पन्न
  rationale: दुर्लभ विशेषण का अर्थ ऐसा है जिसमें हर प्रकार की सद्गुणता हो; ‘सर्वगुणसम्पन्न’ संक्षिप्त और गरिमापूर्ण है।
- source_word: βεβαίαν
  choice: दृढ़
  rationale: यह स्थिर, पक्का और भरोसेमंद होने का भाव व्यक्त करता है।
- source_word: ἐδοκίμασεν
  choice: खरा पाया
  rationale: मूल शब्द जाँचकर अनुमोदित या प्रमाणित मानने का भाव रखता है; ‘खरा पाया’ उस परीक्षण और स्वीकृति दोनों को बनाए रखता है।
- source_word: σώφρονα
  choice: संयमपूर्ण
  rationale: यह विवेकपूर्ण आत्मसंयम और संतुलित आचरण का संकेत देता है।
- source_word: ἐπιεικῆ
  choice: सौम्य
  rationale: यह नम्र, उदार और कठोरता से रहित स्वभाव को व्यक्त करता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός का अर्थ अभिषिक्त जन, अर्थात मसीह, है; हिन्दी के आरम्भिक मसीही धार्मिक संदर्भ में ‘मसीह’ स्वाभाविक और अर्थपूर्ण है।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: यह श्रद्धापूर्ण धार्मिक जीवन या ईश्वरभक्ति को दर्शाता है; ‘भक्ति’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: μεγαλοπρεπὲς ... ἦθος
  choice: उदात्त स्वभाव
  rationale: शाब्दिक भाव भव्य या महान चरित्र का है; ‘उदात्त स्वभाव’ आतिथ्य की नैतिक उत्कृष्टता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκήρυξεν
  choice: बखान किया
  rationale: मूल क्रिया सार्वजनिक रूप से घोषणा करने का भाव रखती है; इस प्रशंसात्मक संदर्भ में ‘बखान किया’ अधिक स्वाभाविक है और सार्वजनिक प्रशंसा का अर्थ बनाए रखता है।
- source_word: τελείαν καὶ ἀσφαλῆ γνῶσιν
  choice: पूर्ण और सुनिश्चित ज्ञान
  rationale: τελείαν पूर्णता तथा ἀσφαλῆ स्थिरता, सुरक्षा या निश्चय का भाव देता है; यह अनुवाद दोनों विशेषताओं को अलग-अलग बनाए रखता है।
- source_word: ἐμακάρισεν
  choice: धन्य कहा
  rationale: यह किसी को या किसी वस्तु को धन्य मानने अथवा घोषित करने का शब्द है; असामान्य कर्म ‘ज्ञान’ को बदलकर कोई सरल धार्मिक निष्कर्ष नहीं जोड़ा गया।
theological_decisions:
- issue: ἐν Χριστῷ का अनुवाद
  choice: मसीह में
  alternative: ख्रीस्त में / क्राइस्ट में
  rationale: मूल उपाधि के ‘अभिषिक्त’ अर्थ और हिन्दी की परिचित मसीही शब्दावली को बनाए रखा गया; इसे केवल व्यक्तिनाम की तरह प्रस्तुत नहीं किया गया।
- issue: ज्ञान को ‘धन्य’ कहने की असामान्य अभिव्यक्ति
  choice: मूल व्याकरणिक तनाव को बनाए रखते हुए ‘ज्ञान को धन्य कहा’
  alternative: ज्ञान के कारण तुम्हें धन्य कहा
  rationale: वैकल्पिक रूप अधिक सहज है, पर वह मूल में ज्ञान को सीधे कर्म बनाने वाली संरचना को बदल देता और कारण-संबंध जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक और प्रशंसात्मक शैली रखी गई है। चारों आलंकारिक प्रश्नों का क्रम सुरक्षित है। ‘तुम्हारे’ का प्रयोग बहुवचन समुदाय को संबोधित करने के कारण स्वाभाविक है; भाषा न अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की।
