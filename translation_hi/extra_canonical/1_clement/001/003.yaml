source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπροσωπολήμπτως γὰρ πάντα ἐποιεῖτε καὶ ἐν τοῖς νομίμοις τοῦ θεοῦ ἐπορεύεσθε, ὑποτασσόμενοι τοῖς ἡγουμένοις ὑμῶν καὶ τιμὴν τὴν καϑήκουσαν ἀπονέμοντες τοῖς παρ’ ὑμῖν πρεσβυτέροις· νέοις τε μέτρα καὶ σεμνὰ νοεῖν ἐπετρέπετε· γυναξὶν τε ἐν ἀμώμῳ καὶ σεμνῇ καὶ ἁγνῇ συνειδήσει πάντα ἐπιτελεῖν παρηγγέλλετε, στεργούσας καϑηκόντως τοὺς ἄνδρας ἑαυτῶν· ἐν τε τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν ἐδιδάσκετε, πάνυ σωφρονούσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/003.yaml
  text: For you did everything without partiality[a], and you walked in the ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were directing the younger men to think moderate and dignified thoughts. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and you taught them, being under the rule of submission, to manage the affairs of the household with dignity[b], showing complete self-control.
translation:
  language: hi
  text: क्योंकि तुम सब कुछ बिना किसी पक्षपात के करते थे और परमेश्वर की विधियों के अनुसार चलते थे। तुम अपने अगुओं के अधीन रहते और अपने बीच के प्राचीनों को उचित आदर देते थे। तुम युवकों को संतुलित[a] और गरिमापूर्ण विचार रखने की शिक्षा देते थे। तुम स्त्रियों को निर्देश देते थे कि वे निर्दोष, गरिमापूर्ण और शुद्ध विवेक के साथ सब कुछ करें और उचित रीति से अपने-अपने पतियों से प्रेम करें। तुम उन्हें यह भी सिखाते थे कि वे अधीनता की व्यवस्था के अंतर्गत रहते हुए गरिमा के साथ घर-गृहस्थी संभालें और पूर्ण आत्म-संयम प्रदर्शित करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त यूनानी पाठ में यहाँ शाब्दिक रूप से “माप” है; प्रचलित पाठ में “संतुलित” या “संयत” अर्थ वाला निकट रूप पढ़ा जाता है।
    reason: स्रोत में संभावित OCR अथवा पाठगत रूप μέτρα है, जबकि संदर्भ और प्रचलित पाठ μέτρια का समर्थन करते हैं।
lexical_decisions:
- source_word: ἀπροσωπολήμπτως
  choice: बिना किसी पक्षपात के
  rationale: शब्द का अर्थ व्यक्ति का मुँह देखकर भेदभाव न करना है; आधुनिक हिन्दी में यह सहज और स्पष्ट अभिव्यक्ति है।
- source_word: τοῖς ἡγουμένοις
  choice: अपने अगुओं
  rationale: यह समुदाय में नेतृत्व करने वालों के लिए सामान्य पद है; ऐसा अनुवाद किसी विशिष्ट कलीसियाई पद को आरोपित नहीं करता।
- source_word: τοῖς παρ’ ὑμῖν πρεσβυτέροις
  choice: अपने बीच के प्राचीनों
  rationale: πρεσβύτεροι आयु में बड़े लोगों अथवा समुदाय के प्राचीन पदधारियों, दोनों की ओर संकेत कर सकता है; 'प्राचीन' इस संभावित द्विअर्थता को पर्याप्त रूप से बनाए रखता है।
- source_word: μέτρα
  choice: संतुलित
  rationale: प्राप्त पाठ में μέτρα है, पर संदर्भ और प्रचलित पाठ μέτρια ('संयत/संतुलित') का समर्थन करते हैं; मुख्य पाठ में अपेक्षित भाव दिया गया है और पाठांतर को पादटिप्पणी में बताया गया है।
- source_word: σεμνά / σεμνῇ / σεμνῶς
  choice: गरिमापूर्ण / गरिमा से
  rationale: इन शब्दों में गंभीरता, सम्मानयोग्यता और शालीनता का संयुक्त भाव है; 'गरिमा' पूरे अनुच्छेद में इस आवर्ती विचार को बनाए रखती है।
- source_word: ἐν τῷ κανόνι τῆς ὑποταγῆς
  choice: अधीनता के नियम में
  rationale: κανών को 'नियम' और ὑποταγή को 'अधीनता' देकर वाक्य की कठोर संरचना तथा उसकी ऐतिहासिक दूरी को नरम किए बिना रखा गया है।
- source_word: οἰκουρεῖν
  choice: घर-गृहस्थी संभालें
  rationale: यह घर की देखभाल और घरेलू मामलों के प्रबंध, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάνυ σωφρονούσας
  choice: हर बात में पूरा संयम रखें
  rationale: πάνυ की तीव्रता और σωφροσύνη के आत्म-संयम/समझदारी के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πρεσβύτεροι का आशय
  choice: प्राचीनों
  alternative: बुज़ुर्गों या एल्डरों
  rationale: मूल शब्द आयु और सामुदायिक पद, दोनों अर्थ ग्रहण कर सकता है; 'प्राचीन' अनावश्यक रूप से किसी एक संस्थागत अर्थ को निश्चित नहीं करता।
- issue: अधीनता की भाषा
  choice: अधीनता के नियम में रहते हुए
  alternative: अधीनता की मर्यादा के भीतर रहते हुए
  rationale: मुख्य पाठ में κανών और ὑποταγή की स्पष्टता बनाए रखी गई है; अधिक कोमल व्याख्यात्मक भाषा मूल के सामाजिक-धार्मिक तनाव को घटा सकती थी।
- issue: नए पुरुष या सामान्य युवा
  choice: युवाओं
  alternative: युवक पुरुषों
  rationale: νέοις व्याकरणतः पुरुषवाचक अथवा मिश्रित युवा समूह को सूचित कर सकता है, पर यहाँ पुरुषों तक अर्थ सीमित करना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। आवर्ती यूनानी क्रियाओं को भूतकालीन आदतन क्रिया ('करते थे', 'देते थे', 'सिखाते थे') से व्यक्त किया गया है। घरेलू और अधीनता संबंधी भाषा को न तो आधुनिक व्याख्या से नरम किया गया है, न किसी संप्रदायगत व्यवस्था में बदला गया है।
