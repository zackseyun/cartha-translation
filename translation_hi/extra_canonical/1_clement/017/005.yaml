source:
  edition: Funk 1901 (normalized OCR)
  text: Μωσῆς πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ἐκλήθη, καὶ διὰ τῆς ὑπηρεσίας αὐτοῦ ἐκρίνεν ὁ θεὸς Αἴγυπτον διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν· ἀλλὰ κἀκεῖνος δοξασθεὶς μεγάλως οὐκ ἐμεγαλοφρόνησεν, ἀλλ’ εἶπεν ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου· Τίς εἰμι ἐγώ, ὅτι με πέμπεις; Ἐγὼ δέ εἰμι ἰσχνόφωνος καὶ βραδύγλωσσος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/005.yaml
  text: Moses was called faithful in all his house[a], and through his service God judged Egypt through their plagues and torments; yet even he, though greatly glorified, did not become arrogant, but said, when a divine message was given to him at the bush, “Who am I, that you send me? For I am weak-voiced and slow of tongue.”
translation:
  language: hi
  text: मूसा “उसके सारे घराने में विश्वासयोग्य” कहलाया[a]। उसकी सेवा के द्वारा परमेश्वर ने मिस्र पर आए कोड़ों और यातनाओं के माध्यम से उसका न्याय किया। फिर भी, इतना अधिक गौरव पाने पर भी वह घमंडी नहीं हुआ, बल्कि जब झाड़ी के निकट उसे परमेश्वर का संदेश मिला, तो उसने कहा, “मैं कौन हूँ कि तू मुझे भेजता है? क्योंकि मेरी आवाज़ कमजोर है और मैं बोलने में धीमा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके’ का संदर्भ व्याकरणतः मूसा या परमेश्वर हो सकता है। यह वाक्यांश गिनती 12:7 की भाषा की प्रतिध्वनि है, जहाँ परमेश्वर ‘मेरे सारे घराने’ कहता है।
    reason: αὐτοῦ के संक्षिप्त सर्वनाम को मुख्य पाठ में अनिर्णीत रखा गया है; टिप्पणी उद्धरण-संदर्भ और संभावित पूर्वपद दोनों बताती है।
lexical_decisions:
- source_word: πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: “उसके सारे घराने में विश्वासयोग्य”
  rationale: ‘घराना’ οἶκος के पारिवारिक और घरेलू समुदाय-संबंधी अर्थ को बनाए रखता है; ‘उसके’ αὐτοῦ की सर्वनामिक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: διὰ τῆς ὑπηρεσίας αὐτοῦ
  choice: उसकी सेवा के द्वारा
  rationale: ὑπηρεσία का सीधा अर्थ सेवा या सेवकाई है; साधारण आधुनिक हिन्दी में ‘सेवा’ अधिक स्वाभाविक है।
- source_word: μαστίγων καὶ αἰκισμάτων
  choice: मारों और यातनाओं
  rationale: μαστίγες दंडात्मक प्रहारों/विपत्तियों और αἰκίσματα कठोर दुर्व्यवहार या यातनाओं को दर्शाता है; दोनों पदों का अंतर यथासंभव रखा गया है।
- source_word: οὐκ ἐμεγαλοφρόνησεν
  choice: घमंडी नहीं हुआ
  rationale: क्रिया नकारात्मक अर्थ में अभिमानी या अहंकारी होने को व्यक्त करती है; आधुनिक हिन्दी में ‘घमंडी’ स्पष्ट और स्वाभाविक है।
- source_word: χρηματισμοῦ
  choice: परमेश्वर का संदेश
  rationale: यहाँ शब्द दिव्य सूचना या वाणी को सूचित करता है; ‘परमेश्वर का संदेश’ हिन्दी में स्वाभाविक रहते हुए उसके दिव्य स्रोत को स्पष्ट करता है।
- source_word: ἰσχνόφωνος καὶ βραδύγλωσσος
  choice: मेरी आवाज़ तो दुर्बल है और मेरी जीभ धीमी है
  rationale: दोनों यूनानी विशेषणों की ठोस अभिव्यक्ति को बनाए रखा गया है; इसे केवल ‘अच्छा वक्ता नहीं’ कहने से मूल के विशिष्ट बिंब मिट जाते।
theological_decisions:
- issue: οἴκῳ αὐτοῦ में ‘उसके’ का संदर्भ
  choice: मुख्य पाठ में ‘उसके’ रखा और टिप्पणी में संभावित संदर्भ बताया
  alternative: ‘परमेश्वर के सारे घराने में’ या ‘अपने सारे घराने में’
  rationale: यूनानी सर्वनाम स्वयं संक्षिप्त है और वाक्यांश शास्त्रीय उद्धरण की प्रतिध्वनि करता है; मुख्य पाठ में किसी एक संदर्भ को पूर्णतः थोपना उचित नहीं।
- issue: मिस्र पर न्याय करने वाला कर्ता और मूसा की भूमिका
  choice: परमेश्वर को न्याय करने वाला और मूसा की सेवा को माध्यम रखा
  alternative: मूसा ने मिस्र को दंड दिया
  rationale: मूल पाठ में ὁ θεός स्पष्ट कर्ता है और मूसा की ὑπηρεσία माध्यम है; यह भेद धर्मवैचारिक रूप से भी महत्त्वपूर्ण है।
- issue: मूसा को मिले गौरव और उसकी विनम्रता का तनाव
  choice: ‘इतना अधिक गौरव पाने पर भी वह घमंडी नहीं हुआ’
  alternative: ‘महिमामंडित होकर भी उसने अपने को महान नहीं समझा’
  rationale: δοξασθείς को प्राप्त गौरव के रूप में और μεγαλοφρονεῖν को नकारात्मक घमंड के रूप में प्रस्तुत करने से मूल विरोध स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। शास्त्रीय उद्धरण-सदृश वाक्यांश को उद्धरण-चिह्नों में रखा गया है। ‘तू’ प्रत्यक्ष दिव्य संबोधन में मूल के एकवचन निकट संबोधन को दर्शाता है और पारंपरिक बाइबिलीय हिन्दी में स्वाभाविक है।
