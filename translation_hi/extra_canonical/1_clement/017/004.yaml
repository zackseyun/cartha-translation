  text: But he himself accuses himself[a], saying, “No one is clean from defilement, not even if his life is one day.”
translation:
  language: hi
  text: परन्तु वह स्वयं अपने ही विरुद्ध दोषारोपण करता हुआ कहता है, “कोई भी मैल से रहित नहीं है, भले ही उसका जीवन एक ही दिन का हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑαυτοῦ κατηγορεῖ
  choice: स्वयं अपने ऊपर दोष लगाता है
  rationale: κατηγορεῖ का अर्थ ‘आरोप लगाना/दोष लगाना’ है और ἑαυτοῦ इसे आत्मवाचक बनाता है। यह हिन्दी में स्वाभाविक रहते हुए मूल का न्यायिक भाव बनाए रखता है।
- source_word: καθαρὸς ἀπὸ ῥύπου
  choice: अशुद्धता से शुद्ध
  rationale: καθαρός और ῥύπος के शुद्धता-अशुद्धता संबंधी विरोध को स्पष्ट रूप से बनाए रखता है; ἀπό यहाँ अशुद्धता से मुक्त होने का भाव देता है।
- source_word: οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ
  choice: चाहे उसका जीवन केवल एक दिन का ही क्यों न हो
  rationale: οὐδ’ ἄν की रियायती/काल्पनिक शक्ति को स्वाभाविक हिन्दी संरचना में व्यक्त करता है और जीवन की अत्यल्प अवधि पर बल बनाए रखता है।
theological_decisions:
- issue: मानवीय अशुद्धता के कथन की व्यापकता
  choice: “कोई भी अशुद्धता से शुद्ध नहीं है” के सार्वभौमिक रूप को बनाए रखा गया।
  alternative: इसे विशेष रूप से पापरहितता या अनुष्ठानिक अशुद्धता के रूप में स्पष्ट करना।
  rationale: मूल ῥύπος केवल ‘अशुद्धता/मैल’ कहता है और उसका प्रकार निर्धारित नहीं करता; इसलिए धार्मिक या नैतिक अर्थ को संकीर्ण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘परन्तु’ मूल ἀλλά के विरोधसूचक बल को रखता है। ‘अपने ऊपर दोष लगाते हुए’ को उद्धरण से सहज रूप से जोड़ा गया है।
