review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the adversative opening, the reflexive sense of ἑαυτοῦ κατηγορεῖ, the universal negation, and the concessive force of οὐδ’ ἂν. However, “अशुद्धता से शुद्ध” is a formally understandable but semantically awkward collocation in Hindi, and it obscures the idiomatic force of καθαρὸς ἀπὸ ῥύπου (“clean/free from filth or defilement”).
  naturalness: “अपने ऊपर दोष लगाते हुए कहता है” is understandable, but “अपने ही विरुद्ध दोषारोपण करता है” is more direct and idiomatic for self-accusation. “मैल से रहित” is natural modern Hindi and retains the source’s deliberately non-specific image of impurity/filth.
  terminology: “मैल” appropriately renders ῥύπος without prematurely restricting it to moral sin or ritual impurity. “दोषारोपण” retains the accusatory/judicial color of κατηγορεῖ. No theological qualification should be added.
  issues:
  - severity: medium
    issue: “अशुद्धता से शुद्ध” is unnatural and potentially confusing Hindi.
    rationale: Although it follows the Greek lexical contrast, Hindi normally expresses this idea as “मैल से रहित” or “अशुद्धता से मुक्त.” The revision keeps the source ambiguity while reading naturally.
  - severity: low
    issue: The self-accusation clause is needlessly periphrastic.
    rationale: “अपने ही विरुद्ध दोषारोपण करता है” more directly represents ἑαυτοῦ κατηγορεῖ than “अपने ऊपर दोष लगाते हुए कहता है,” while maintaining the formal register.
  revised_text: परन्तु वह स्वयं अपने ही विरुद्ध दोषारोपण करता हुआ कहता है, “कोई भी मैल से रहित नहीं है, भले ही उसका जीवन एक ही दिन का हो।”
  revised_footnotes: []
