revisions:
- from: परन्तु वह स्वयं अपने ऊपर दोष लगाते हुए कहता है, “कोई भी अशुद्धता से शुद्ध नहीं है, चाहे उसका जीवन केवल एक दिन का ही क्यों न हो।”
  to: परन्तु वह स्वयं अपने ही विरुद्ध दोषारोपण करता हुआ कहता है, “कोई भी मैल से रहित नहीं है, भले ही उसका जीवन एक ही दिन का हो।”
  rationale: The revision replaces an awkward purity/impurity collocation with idiomatic Hindi while preserving the non-specific sense of ῥύπος. It also renders the reflexive accusation more directly. “भले ही” conveys the concessive/hypothetical force of οὐδ’ ἄν without adding interpretive content.
