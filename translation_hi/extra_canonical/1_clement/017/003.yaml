  text: ἐπὶ δὲ καὶ περὶ Ἰὼβ οὕτως γέγραπται· Ἰὼβ δὲ ἦν δίκαιος καὶ ἄμεμπτος, ἀληθινός, θεοσεβής, ἀπεχόμενος ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/003.yaml
  text: 'And concerning Job it is thus written: “Now Job was righteous and blameless[a], true, God-fearing, abstaining from every evil.”'
translation:
  language: hi
  text: 'और अय्यूब के विषय में भी इस प्रकार लिखा है: “अय्यूब धर्मी और निर्दोष, सच्चा, परमेश्वर का भय मानने वाला और हर बुराई से दूर रहने वाला था।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह शब्द नैतिक और धार्मिक रूप से सही ठहरने या सही आचरण करने का भाव रखता है; ‘धर्मी’ इसका स्वाभाविक और प्रचलित हिन्दी समतुल्य है।
- source_word: ἄμεμπτος
  choice: निर्दोष
  rationale: इसका अर्थ ऐसा व्यक्ति है जिस पर दोष न लगाया जा सके; ‘निर्दोष’ संक्षिप्त और सहज हिन्दी है।
- source_word: ἀληθινός
  choice: सच्चा
  rationale: यहाँ व्यक्ति के चरित्र की सत्यता और खराई का वर्णन है; ‘सच्चा’ इस गुण को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: θεοσεβής
  choice: परमेश्वर का भय मानने वाला
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण भय और भक्ति को व्यक्त करता है; यह वाक्यांश आधुनिक हिन्दी पाठकों के लिए स्पष्ट है।
- source_word: ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  choice: हर बुराई से दूर रहने वाला
  rationale: ἀπέχομαι का मूल भाव स्वयं को किसी वस्तु से दूर रखना या उससे परहेज़ करना है। यह अनुवाद ‘मुड़ने’ का भिन्न क्रियार्थ जोड़े बिना उस भाव को स्वाभाविक हिन्दी में रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक ἐπὶ δὲ καὶ περὶ को हिन्दी मुहावरे के अनुसार ‘और ... के विषय में भी’ किया गया है। गुणों की सूची में यूनानी क्रम सुरक्षित रखा गया है।
