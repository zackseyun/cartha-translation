base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/001.yaml
  text: Let us become imitators also of those who went about in goatskins and sheepskins, proclaiming the coming of the Christ. We mean Elijah and Elisha, and also Ezekiel, the prophets; and besides these, those who have been commended.
translation:
  language: hi
  text: आइए, हम उन लोगों का भी अनुकरण करें जो बकरियों और भेड़ों की खाल पहने घूमते थे और मसीह के आगमन की घोषणा करते थे। हमारा आशय एलिय्याह, एलीशा और यहेजकेल—इन भविष्यवक्ताओं—से है; और इनके अतिरिक्त उन लोगों से भी, जिनकी सराहना की गई है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनके पक्ष में गवाही दी गई है।”
    reason: यूनानी μεμαρτυρημένους संदर्भ में सकारात्मक सराहना या अनुमोदन का भाव रखता है, जबकि मूल क्रिया की ‘गवाही दी गई’ अर्थ-छटा भी बनी रहती है।
lexical_decisions:
- source_word: Μιμηταὶ γενώμεθα
  choice: आइए, हम … का अनुकरण करें
  rationale: ग्रीक के प्रथम पुरुष बहुवचन प्रोत्साहन को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς
  choice: बकरियों और भेड़ों की खाल पहने
  rationale: दोनों प्रकार की पशु-खालों को स्पष्ट रखता है; हिन्दी में केवल ‘खालों में’ कहने की अपेक्षा ‘पहने’ अधिक स्वाभाविक है।
- source_word: περιεπάτησαν
  choice: घूमते थे
  rationale: यहाँ क्रिया का अर्थ जीवन-चाल से अधिक स्थान-स्थान जाना है, विशेषतः अगले कृदंत ‘घोषणा करते हुए’ के साथ।
- source_word: τὴν ἔλευσιν τοῦ Χριστοῦ
  choice: मसीह के आगमन
  rationale: Χριστός के लिए प्रचलित हिन्दी पद ‘मसीह’ रखा गया है और ἔλευσις को ‘आगमन’ से व्यक्त किया गया है।
- source_word: τοὺς μεμαρτυρημένους
  choice: जिनकी सराहना की गई है
  rationale: पूर्ण निष्क्रिय कृदंत का यहाँ सकारात्मक अर्थ ‘जिनके विषय में अच्छा साक्ष्य दिया गया/जिन्हें प्रशंसित ठहराया गया’ है; यह अनुवाद उस भाव को सहज हिन्दी में देता है।
theological_decisions:
- issue: Χριστός को ‘मसीह’ या व्याख्यात्मक ‘अभिषिक्त जन’ कहना
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: पाठ में स्थापित उपाधि Χριστός है; ‘मसीह’ आधुनिक हिन्दी मसीही साहित्य में इसका स्वाभाविक और व्यापक रूप है तथा अनावश्यक व्याख्या नहीं जोड़ता।
- issue: μεμαρτυρημένους में प्रशंसा और साक्ष्य की अर्थ-छटा
  choice: मुख्य पाठ में ‘जिनकी सराहना की गई है’ और पाद-टिप्पणी में साक्ष्य वाला विकल्प
  alternative: जिनके पक्ष में गवाही दी गई है
  rationale: संदर्भ में सकारात्मक अनुमोदन प्रमुख है, पर यूनानी क्रिया की ‘गवाही देना’ अर्थ-छटा को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। ‘भविष्यवक्ताओं’ को तीनों नामों के साथ स्वाभाविक समासाधिकरण में रखा गया है।
