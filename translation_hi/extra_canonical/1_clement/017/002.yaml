review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the passive, unspecified agent of ἐμαρτυρήθη, Abraham’s designation as God’s friend, the sustained-looking sense of ἀτενίζων, and the humility and dust-and-ashes imagery of the quotation. However, “बड़ी उत्तम गवाही” overstates the wording through the added evaluative “उत्तम” and is not idiomatic Hindi.
  naturalness: “बड़ी उत्तम गवाही” is redundant and unnatural in modern standard Hindi. “बड़ी प्रशंसा की गई” is a natural rendering of the idiomatic force of “was greatly testified of/received great testimony.” “परमेश्वर की महिमा को एकटक देखते हुए” is also more natural than “महिमा पर ... दृष्टि लगाए हुए.”
  terminology: “परमेश्वर का मित्र,” “विनम्रता,” and “मिट्टी और राख” are clear, appropriately dignified, and theologically non-sectarian. “विनम्रता से” conveys the humble-minded disposition of ταπεινοφρονῶν without unnecessary expansion.
  issues:
  - severity: medium
    issue: “बड़ी उत्तम गवाही” is redundant and introduces an unnecessary nuance.
    rationale: μεγάλως intensifies the testimony/commendation; it does not separately mean “excellent.” The phrase is also awkward in contemporary Hindi.
  revised_text: अब्राहम की बड़ी प्रशंसा की गई और उन्हें परमेश्वर का मित्र कहा गया। परमेश्वर की महिमा को एकटक देखते हुए उन्होंने विनम्रता से कहा, “पर मैं तो मिट्टी और राख हूँ।”
  revised_footnotes: []
  revision_rationale: The revision replaces the unnatural and slightly over-interpreted “बड़ी उत्तम गवाही दी गई” with idiomatic “बड़ी प्रशंसा की गई,” retaining the sense of strong commendation while avoiding an added lexical component. It also improves the participial clause and renders ταπεινοφρονῶν as “विनम्रता से.” The passive remains unassigned, preserving the Greek ambiguity.
