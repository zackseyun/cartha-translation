  text: ἐμαρτυρήθη μεγάλως Ἀβραὰμ καὶ φίλος προσηγορεύθη τοῦ θεοῦ, καὶ λέγει ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ ταπεινοφρονῶν· Ἐγὼ δέ εἰμι γῆ καὶ σποδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/002.yaml
  text: Abraham received great testimony and was called the friend of God, and gazing intently on the glory of God, he said with humility, “But I am dust and ashes.”
translation:
  language: hi
  text: अब्राहम की बड़ी प्रशंसा की गई और उन्हें परमेश्वर का मित्र कहा गया। परमेश्वर की महिमा को एकटक देखते हुए उन्होंने विनम्रता से कहा, “पर मैं तो मिट्टी और राख हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτυρήθη μεγάλως
  choice: बड़ी उत्तम गवाही दी गई
  rationale: निष्क्रिय क्रिया और μεγάλως की प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘बहुत प्रशंसा हुई’ कहने की अपेक्षा गवाही की मूल छवि बनाए रखता है।
- source_word: φίλος ... τοῦ θεοῦ
  choice: परमेश्वर का मित्र
  rationale: यूनानी संबंधवाचक पद का सीधा और स्वाभाविक अनुवाद।
- source_word: ἀτενίζων εἰς
  choice: पर ... एकटक दृष्टि लगाए हुए
  rationale: ἀτενίζω में निहित ध्यानपूर्वक और स्थिर दृष्टि का भाव सुरक्षित रखता है।
- source_word: ταπεινοφρονῶν
  choice: दीनता से
  rationale: मन की नम्र अवस्था को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अर्थ को किसी विशेष आध्यात्मिक सिद्धान्त तक सीमित किए।
- source_word: γῆ καὶ σποδός
  choice: मिट्टी और राख
  rationale: γῆ का शाब्दिक अर्थ ‘धरती/मिट्टी’ है; उत्पत्ति 18:27 की परिचित छवि और मनुष्य की क्षुद्रता दोनों को बनाए रखता है।
theological_decisions:
- issue: ἐμαρτυρήθη μεγάλως में गवाही का कर्ता अनिर्दिष्ट है
  choice: निष्क्रिय वाक्य ‘गवाही दी गई’ रखा गया
  alternative: ‘परमेश्वर ने अब्राहम की बड़ी प्रशंसा की’
  rationale: मूल यूनानी कर्ता स्पष्ट नहीं करता; परमेश्वर को कर्ता बनाना पाठ में अतिरिक्त व्याख्या जोड़ता।
- issue: ταπεινοφρονῶν का स्वरूप
  choice: ‘दीनता से’
  alternative: ‘अपने मन को दीन रखते हुए’
  rationale: संक्षिप्त और स्वाभाविक हिन्दी में विनम्र मनोवृत्ति सुरक्षित है; वैकल्पिक रूप अनावश्यक रूप से व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘उन्हें/उन्होंने’ आदरसूचक एकवचन के रूप में प्रयुक्त है। उद्धरण में ‘पर’ ने δέ के हल्के विरोधात्मक भाव को सुरक्षित रखा है।
