revisions:
- from: अब्राहम के विषय में बड़ी उत्तम गवाही दी गई और उन्हें परमेश्वर का मित्र कहा गया। परमेश्वर की महिमा पर एकटक दृष्टि लगाए हुए उन्होंने दीनता से कहा, “पर मैं तो मिट्टी और राख हूँ।”
  to: अब्राहम की बड़ी प्रशंसा की गई और उन्हें परमेश्वर का मित्र कहा गया। परमेश्वर की महिमा को एकटक देखते हुए उन्होंने विनम्रता से कहा, “पर मैं तो मिट्टी और राख हूँ।”
  rationale: The revision replaces the unnatural and slightly over-interpreted “बड़ी उत्तम गवाही दी गई” with idiomatic “बड़ी प्रशंसा की गई,” retaining the sense of strong commendation while avoiding an added lexical component. It also improves the participial clause and renders ταπεινοφρονῶν as “विनम्रता से.” The passive remains unassigned, preserving the Greek ambiguity.
  reviewer_model: gpt-5.6-terra
