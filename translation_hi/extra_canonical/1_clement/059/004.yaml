source:
  edition: Funk 1901 (normalized OCR)
  text: ἀξιόμεν σε, δέσποτα, βοηθὸν γενέσθαι καὶ ἀντιλήμπτορα ἡμῶν. τοὺς ἐν θλίψει ἡμῶν ῥῦσαι, τοὺς ταπεινοὺς ἐλέησον, τοὺς πεπτωκότας ἔγειρον, τοῖς δεομένοις ἐπιφάνηθι, τοὺς ἀσθενεῖς ἴασαι, τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον· χόρτασον τοὺς πεινῶντας, λύτρωσαι τοὺς δεσμίους ἡμῶν, ἐξανάστησον τοὺς ἀσθενοῦντας, παράκαλεσον τοὺς ὀλιγοψυχούντας· γνωτώσαν σε ἅπαντα τὰ ἔθνη, ὅτι σὺ εἶ ὁ θεὸς μόνος καὶ Ἰησοῦς Χριστὸς ὁ παῖς σου καὶ ἡμεῖς λαός σου καὶ πρόβατα τῆς νομῆς σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/004.yaml
  text: We ask you[a], Master, to be our helper and protector. Rescue those of us in affliction, have mercy on the lowly, raise up the fallen, appear to those in need, heal the weak, turn back those of your people who wander. Feed the hungry, redeem our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and Jesus Messiah is your servant, and we are your people and the sheep of your pasture.
translation:
  language: hi
  text: हे स्वामी, हम आपसे विनती करते हैं कि आप हमारे सहायक और रक्षक बनें। हममें से जो क्लेश में हैं, उन्हें बचाइए; दीनों पर दया कीजिए; गिरे हुओं को उठाइए; जरूरतमंदों के सामने प्रकट होइए; निर्बलों को चंगा कीजिए; आपकी प्रजा में से जो भटक रहे हैं, उन्हें लौटा लाइए। भूखों को तृप्त कीजिए; हमारे बंदियों को मुक्त कराइए; रोगियों को उठाइए; हताश लोगों को ढाढ़स बँधाइए। सभी राष्ट्र जान लें कि केवल आप ही परमेश्वर हैं, और यीशु मसीह आपका सेवक[a] है, और हम आपकी प्रजा और आपकी चरागाह की भेड़ें हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “सेवक” भी हो सकता है और “पुत्र” या “बालक” भी।
    reason: παῖς की वास्तविक शाब्दिक और प्रसंगगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: संबोधन और प्रभुत्व—दोनों भावों को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: βοηθὸν ... καὶ ἀντιλήμπτορα
  choice: सहायक और रक्षक
  rationale: पहला शब्द सहायता देने वाले और दूसरा सहारा देने अथवा रक्षा करने वाले को सूचित करता है; हिन्दी युग्म मूल समानांतरता बनाए रखता है।
- source_word: τοὺς ἐν θλίψει ἡμῶν
  choice: हममें से जो क्लेश में हैं
  rationale: ἡμῶν को पीड़ित लोगों से संबद्ध मानते हुए असामान्य यूनानी रचना का स्वाभाविक हिन्दी रूप; सामुदायिक 'हम' सुरक्षित रहता है।
- source_word: τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον
  choice: आपकी प्रजा में से जो भटक रहे हैं, उन्हें लौटा लाइए
  rationale: πλανωμένους व्यक्ति-सूचक बहुवचन कृदंत है, अमूर्त 'भटकाव' नहीं; ἐπίστρεψον वापसी कराने का भाव देता है।
- source_word: λύτρωσαι
  choice: छुड़ाइए
  rationale: बंधनों से मुक्त करने अथवा मूल्य देकर छुड़ाने की अर्थ-सीमा रखता है; प्रसंग में सहज हिन्दी।
- source_word: παράκαλεσον τοὺς ὀλιγοψυχούντας
  choice: हताश लोगों को ढाढ़स बँधाइए
  rationale: ὀλιγοψυχέω का आशय साहस या मनोबल खोना है और παρακαλέω यहाँ सांत्वना/प्रोत्साहन देना है।
- source_word: νομῆς
  choice: चरागाह
  rationale: भेड़ों के चरने के स्थान का सीधा अर्थ और परिचित चरवाही रूपक दोनों बनाए रखता है।
theological_decisions:
- issue: παῖς का अर्थ और यीशु से उसका संबंध
  choice: सेवक
  alternative: पुत्र / बालक
  rationale: παῖς में 'बालक/पुत्र' और 'सेवक' दोनों अर्थ संभव हैं। इस प्रार्थना की बाइबिलीय सेवक-भाषा और आरंभिक मसीही प्रयोग में 'सेवक' अधिक संभावित है, पर शब्द की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: Ἰησοῦς Χριστός का रूप
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त / यीशु अभिषिक्त
  rationale: Χριστός उपाधि है; आधुनिक हिन्दी के व्यापक और स्वाभाविक धार्मिक प्रयोग में 'मसीह' उसके अर्थ और परिचित पहचान दोनों को व्यक्त करता है।
- issue: μόνος के बल का स्थान
  choice: केवल आप ही परमेश्वर हैं
  alternative: आप अकेले परमेश्वर हैं
  rationale: यह रूप यूनानी के विशिष्टता-सूचक बल को स्पष्ट रखता है, बिना आगे के मसीह-वाक्य के संबंध को अतिरिक्त रूप से समझाए या व्यवस्थित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। आदरसूचक बहुवचन क्रियाएँ और 'आप' सामान्य पाठक के लिए सहज हैं। लगातार आज्ञार्थक विनतियों की लय और मूल की समानांतर संरचना यथासंभव रखी गई है।
