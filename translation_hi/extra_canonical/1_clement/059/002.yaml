source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς δὲ ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας καὶ αἰτησόμεθα ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι, ὅπως τὸν ἀριθμὸν τὸν κατηριθμημένον τῶν ἐκλεκτῶν αὐτοῦ ἐν ὅλῳ τῷ κόσμῳ διαφυλάξῃ ἄθραυστον ὁ δημιουργὸς τῶν ἁπάντων διὰ τοῦ ἠγαπημένου παιδὸς αὐτοῦ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐκάλεσεν ἡμᾶς ἀπὸ σκότους εἰς φῶς, ἀπὸ ἀγνωσίας εἰς ἐπίγνωσιν δόξης ὀνόματος αὐτοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/002.yaml
  text: But we will be innocent of this sin[a], and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact the number of his elect that has been counted throughout the whole world, through his beloved servant Jesus Christ, through whom he called us from darkness into light, from ignorance into the knowledge of the glory of his name,
translation:
  language: hi
  text: पर हम इस पाप से निर्दोष होंगे और पूरी लगन से प्रार्थना और विनती करते हुए यह माँगेंगे कि सबका सृष्टिकर्ता अपने चुने हुओं की उस गिनी हुई संख्या को, जो सारे संसार में है, अपने प्रिय सेवक यीशु मसीह[a] के द्वारा अक्षुण्ण बनाए रखे। उसी यीशु मसीह के द्वारा उसने हमें अंधकार से प्रकाश में और अज्ञान से अपने नाम की महिमा के ज्ञान में बुलाया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने प्रिय बालक यीशु मसीह’।
    reason: यूनानी παῖς का अर्थ संदर्भ के अनुसार ‘सेवक’ या ‘बालक’ हो सकता है। मुख्य पाठ में यशायाह-संबंधी और आरंभिक मसीही प्रार्थनात्मक प्रतिध्वनि के कारण ‘सेवक’ चुना गया है।
lexical_decisions:
- source_word: ἀθῷοι
  choice: निर्दोष
  rationale: यह शब्द किसी पाप या दोष के उत्तरदायित्व से मुक्त होने का अर्थ देता है; ‘निर्दोष’ आधुनिक हिन्दी में इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκτενῆ
  choice: पूरी लगन से
  rationale: यहाँ शब्द प्रार्थना की तीव्रता और earnestness बताता है; क्रियाविशेषणात्मक हिन्दी वाक्यांश मूल भाव को सहज रूप देता है।
- source_word: τὸν ἀριθμὸν τὸν κατηριθμημένον
  choice: उस गिनी हुई संख्या
  rationale: दोनों संबद्ध शब्दों—‘संख्या’ और ‘गिनी हुई’—को बनाए रखकर मूल की जानबूझकर की गई पुनरुक्ति और निश्चितता को सुरक्षित रखा गया है।
- source_word: διαφυλάξῃ ἄθραυστον
  choice: अक्षुण्ण बनाए रखे
  rationale: διαφυλάσσω संरक्षण और ἄθραυστος बिना टूटे या घटे बने रहने को व्यक्त करते हैं; यह संयोजन दोनों अर्थों को समेटता है।
- source_word: ἐπίγνωσιν
  choice: ज्ञान
  rationale: ‘पूर्ण ज्ञान’ जैसे अर्थ-विस्तार से बचते हुए सामान्य रूप से ‘ज्ञान’ चुना गया है।
theological_decisions:
- issue: παιδὸς का अर्थ
  choice: सेवक
  alternative: पुत्र/बालक
  rationale: इस प्रार्थनात्मक, Septuagint-प्रभावित प्रसंग में παῖς यशायाह के ‘प्रभु के सेवक’ की प्रतिध्वनि कर सकता है और आरंभिक मसीही प्रार्थना में यीशु के लिए प्रचलित संबोधन है; फिर भी शब्द का ‘पुत्र/बालक’ अर्थ वास्तविक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: Χριστοῦ का हिन्दी रूप
  choice: मसीह
  alternative: ख्रीस्त/अभिषिक्त जन
  rationale: नाम-सदृश प्रयोग को आधुनिक हिन्दी के व्यापक और प्रतिष्ठित बाइबलीय रूप ‘मसीह’ से व्यक्त किया गया है, बिना पदवी के अर्थ को वाक्य में अतिरिक्त रूप से खोलने के।
- issue: ἐκλεκτῶν का संदर्भ
  choice: चुने हुओं
  alternative: निर्वाचित जनों
  rationale: मूल के धार्मिक अर्थ को बनाए रखते हुए किसी विशिष्ट पूर्वनियति-सिद्धांत को आरोपित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। यूनानी वाक्य की लंबी गति को पठनीय बनाने के लिए दो हिन्दी वाक्यों में बाँटा गया है, पर अंतिम अल्पविराम रखा गया है क्योंकि उद्धृत पद आगे जारी रहता है। ‘अपने नाम की महिमा के ज्ञान’ में मूल संबंधवाचक संरचना और उसकी संभावित अर्थ-गहनता को बिना अनावश्यक व्याख्या के बनाए रखा गया है।
