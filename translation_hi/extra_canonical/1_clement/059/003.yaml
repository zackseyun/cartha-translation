source:
  edition: Funk 1901 (normalized OCR)
  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
translation:
  language: hi
  text: कि हम आपके नाम[a] पर आशा रखें, जो सारी सृष्टि का आदि-स्रोत है। आपने हमारे हृदय की आँखें खोल दीं, ताकि हम आपको जानें—आपको, जो सर्वोच्चों के बीच एकमात्र परमप्रधान हैं, पवित्र जनों के बीच विश्राम करनेवाले पवित्र हैं; जो घमंडियों की ढिठाई को नीचा करते, राष्ट्रों की योजनाओं को विफल करते, दीनों को ऊँचा उठाते और ऊँचे लोगों को नीचा करते हैं; जो धनी बनाते और निर्धन करते, मारते और जीवन देते तथा जीवित करते हैं; जो आत्माओं के एकमात्र उपकारी और समस्त देह के परमेश्वर हैं; जो अथाह गहराइयों में भी दृष्टि रखते, मनुष्यों के कामों की निगरानी करते, संकट में पड़े लोगों के सहायक, निराश लोगों के उद्धारकर्ता, और हर आत्मा के सृष्टिकर्ता और निरीक्षक हैं; जो पृथ्वी पर राष्ट्रों को बढ़ाते और उन सब में से अपने प्रेम करनेवालों को चुनते हैं—अपने प्रिय सेवक[b] यीशु मसीह के द्वारा, जिनके द्वारा आपने हमें शिक्षा दी, पवित्र किया और आदर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके उस नाम पर, जिससे सारी सृष्टि का आरंभ हुआ।” यूनानी वाक्यांश नाम को “सारी सृष्टि का आदिकर्ता/आदि-स्रोत” कह सकता है।
    reason: ἀρχέγονον और ὄνομά σου के संबंध तथा शब्द के ‘प्रथम उत्पत्ति’ वाले अर्थ में वास्तविक अनुवादगत अस्पष्टता है।
  - marker: b
    text: यूनानी शब्द का अर्थ “बालक” या “पुत्र” भी हो सकता है।
    reason: παῖς/παιδός की अर्थ-सीमा में सेवक और बालक/पुत्र दोनों आते हैं।
lexical_decisions:
- source_word: ἀρχέγονον πάσης κτίσεως ὄνομά σου
  choice: आपके नाम पर … जो सारी सृष्टि का आदि-स्रोत है
  rationale: ἀρχέγονον में आदि, प्रथम उत्पत्ति और स्रोत का भाव है। सहज हिन्दी के लिए इसे संबंधवाचक उपवाक्य में रखा गया है, जबकि नाम और सृष्टि के बीच यूनानी की संभावित निकट संबद्धता पादटिप्पणी में सुरक्षित है।
- source_word: ὕψιστον ἐν ὑψίστοις
  choice: सर्वोच्चों के बीच एकमात्र परमप्रधान
  rationale: एकवचन परमप्रधान और बहुवचन सर्वोच्चों के बीच मूल का व्याकरणिक विरोध बनाए रखता है, बिना यह तय किए कि बहुवचन किन प्राणियों को सूचित करता है।
- source_word: ἅγιον ἐν ἁγίοις ἀναπαυόμενον
  choice: पवित्र जनों के बीच विश्राम करनेवाले पवित्र प्रभु
  rationale: ἅγιον को संज्ञात्मक उपाधि और ἁγίοις को बहुवचन मानकर अनूदित किया गया है। 'प्रभु' हिन्दी में उपाधि को स्वाभाविक बनाता है, यद्यपि यूनानी में यहाँ पृथक κύριος नहीं है।
- source_word: ζῳοποιοῦντα καὶ ζῆν ποιοῦντα
  choice: जीवन देते और जीवित रखते
  rationale: मूल में आए दोनों निकटार्थक पदों को हटाने के बजाय जीवन प्रदान करने और जीवित बनाए रखने के रूप में अलग-अलग व्यक्त किया गया है।
- source_word: θεὸν πάσης σαρκός
  choice: समस्त प्राणियों के परमेश्वर
  rationale: शाब्दिक 'समस्त देह' हिन्दी में अस्पष्ट होता; बाइबलीय मुहावरे का आशय सभी देहधारी जीवों/मनुष्यों से है। 'प्राणियों' इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: παιδός
  choice: सेवक
  rationale: इस प्रार्थनात्मक और आरंभिक मसीही संदर्भ में 'सेवक' उपयुक्त है, पर शब्द 'बालक/पुत्र' भी अर्थ दे सकता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐπίσκοπον
  choice: निरीक्षक
  rationale: यहाँ कार्यवाचक सामान्य अर्थ रखा गया है, न कि बाद का संस्थागत पदनाम 'बिशप'।
theological_decisions:
- issue: ἐν ὑψίστοις और ἐν ἁγίοις से अभिप्रेत समूहों की पहचान
  choice: सर्वोच्चों / पवित्र जनों
  alternative: ऊँचे स्थानों / पवित्र स्थानों में
  rationale: व्याकरण बहुवचन व्यक्तियों की ओर स्वाभाविक रूप से संकेत करता है, पर उनकी पहचान स्वर्गदूतों, संतों या किसी अन्य स्वर्गीय समुदाय के रूप में निश्चित नहीं की गई।
- issue: यीशु के लिए παῖς का संबंधसूचक अर्थ
  choice: प्रिय सेवक
  alternative: प्रिय पुत्र या प्रिय बालक
  rationale: शब्द की संभावित द्विअर्थता स्वीकारते हुए मुख्य पाठ में आरंभिक मसीही प्रार्थनाओं और यशायाह की सेवक-परंपरा से मेल खाने वाला अर्थ चुना गया है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: मूल की उपाधि को आधुनिक हिन्दी के व्यापक बाइबलीय प्रयोग में 'मसीह' से व्यक्त किया गया, इसे केवल निजी नाम बनाकर उसकी अभिषिक्त-संबंधी पृष्ठभूमि नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली रखी गई है। यूनानी का लंबा संबोधन-क्रम अर्धविरामों और संबंधवाचक खंडों से सँभाला गया है। आरंभ का “कि” यह संकेत सुरक्षित रखता है कि पद पूर्ववर्ती वाक्य की निरंतरता है। ईश्वर के लिए आदरसूचक बहुवचन क्रियाएँ और सर्वनाम प्रयुक्त हैं।
