source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐὰν δέ τινες ἀπειθήσωσιν τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις, γινωσκέτωσαν, ὅτι παραπτώσει καὶ κινδύνῳ οὐ μικρῷ ἑαυτοὺς ἐνδήσουσιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/001.yaml
  text: But if some disobey the things spoken by him through us, let them know that they will entangle themselves in transgression and in no small danger.
translation:
  language: hi
  text: पर यदि कुछ लोग उन बातों की अवज्ञा करें जो उसने हमारे द्वारा कही हैं, तो वे जान लें कि वे अपने आपको अपराध और बड़े खतरे में फँसा लेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  choice: अवज्ञा करें
  rationale: यह क्रिया केवल विश्वास न करने के बजाय कही गई बात न मानने या उसका पालन न करने का भाव रखती है; ‘अवज्ञा’ प्रसंग में स्वाभाविक और सटीक है।
- source_word: τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις
  choice: उन बातों की ... जो उसने हमारे द्वारा कही हैं
  rationale: कर्ता ‘उसने’ और माध्यम ‘हमारे द्वारा’—दोनों को स्पष्ट रखते हुए यूनानी वाक्य की संरचना और दावे को सुरक्षित रखा गया है।
- source_word: παραπτώσει
  choice: अपराध
  rationale: यहाँ शब्द नैतिक उल्लंघन या चूक का संकेत देता है; ‘अपराध’ वर्तमान हिन्दी में गंभीरता को बनाए रखता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या के।
- source_word: ἐνδήσουσιν
  choice: फँसा लेंगे
  rationale: मूल में अपने आपको बाँधने या उलझा लेने का रूपक है। ‘अपने आपको ... फँसा लेंगे’ हिन्दी में स्वाभाविक रहते हुए आत्म-आरोपित परिणाम का भाव बनाए रखता है।
- source_word: κινδύνῳ οὐ μικρῷ
  choice: बड़े खतरे
  rationale: यूनानी अल्पोक्ति ‘छोटा नहीं’ का स्वाभाविक हिन्दी समतुल्य ‘बड़ा’ है और चेतावनी की तीव्रता सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसने’ (αὐτοῦ) का संदर्भ
  choice: सर्वनाम ‘उसने’ को यथावत रखा गया
  alternative: ‘परमेश्वर ने’ या ‘मसीह ने’ लिखकर संदर्भ स्पष्ट करना
  rationale: इस पद में αὐτοῦ का संदर्भ स्वतंत्र रूप से स्पष्ट नहीं किया गया है। किसी निश्चित अभिज्ञान को जोड़ने के बजाय मूल की वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
- issue: ‘हमारे द्वारा’ कही गई बातों का अधिकार
  choice: ‘उसने हमारे द्वारा कही हैं’
  alternative: ‘हमने उसकी ओर से कही हैं’
  rationale: चुना गया रूप ὑπ᾽ αὐτοῦ और δι᾽ ἡμῶν के भेद—उसके द्वारा कही गईं, हमारे माध्यम से—को अधिक सीधे सुरक्षित रखता है और लेखक के दावे को न कम करता है, न बढ़ाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। वाक्य में चेतावनी की औपचारिक गंभीरता और मूल की संदर्भगत अस्पष्टता दोनों बनाए रखी गई हैं।
