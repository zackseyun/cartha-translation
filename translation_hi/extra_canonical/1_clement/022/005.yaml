- source_word: ζήτησον
  choice: खोज करो
  rationale: आज्ञार्थक क्रिया का अर्थ सक्रिय रूप से ढूँढ़ना या चाहना है; ‘खोज करो’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰρήνην
  choice: शान्ति
  rationale: यह यूनानी संज्ञा व्यक्तिगत तथा सामुदायिक मेल और शान्ति दोनों को समेट सकती है; सामान्य हिन्दी ‘शान्ति’ इस व्यापकता को बनाए रखती है।
- source_word: δίωξον αὐτήν
  choice: उसके पीछे लगे रहो
  rationale: δίωκω यहाँ किसी लक्ष्य का दृढ़तापूर्वक पीछा करने का भाव रखता है। ‘पीछा करो’ हिन्दी में प्रतिकूल या हिंसक अर्थ दे सकता है, इसलिए यह वाक्यांश सकारात्मक, निरन्तर प्रयत्न को स्वाभाविक ढंग से व्यक्त करता है।
