  text: The righteous man cried out, and the Lord heard him and delivered him from all his afflictions.
translation:
  language: hi
  text: धर्मी ने पुकारा, और प्रभु ने उसकी सुनी और उसके सब क्लेशों से उसे छुड़ाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: धर्मी
  rationale: यह पद व्यक्ति को न्यायी अथवा परमेश्वर के प्रति सही आचरण रखनेवाले के रूप में बताता है; ‘धर्मी’ इसका संक्षिप्त और प्रचलित बाइबिलीय रूप है।
- source_word: ἐκέκραξεν
  choice: पुकारा
  rationale: क्रिया संकट में ऊँचे स्वर से सहायता माँगने का भाव रखती है; ‘पुकारा’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰσήκουσεν αὐτοῦ
  choice: उसकी सुनी
  rationale: यूनानी प्रयोग का अर्थ उसकी पुकार या विनती को ध्यान देकर सुनना है; हिन्दी का ‘उसकी सुनी’ इसी अर्थ को संक्षेप में रखता है।
- source_word: θλίψεων
  choice: क्लेशों
  rationale: यह शब्द दबाव, संकट और दुःख की स्थितियों को समेटता है; ‘क्लेश’ इस व्यापकता को बनाए रखता है।
- source_word: ἐῤῥύσατο
  choice: छुड़ाया
  rationale: क्रिया संकट से बचाने या निकालने को दर्शाती है; ‘छुड़ाया’ सामान्य और स्रोत-संगत है।
