source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα δὲ πάντα βεβαιοῖ ἡ ἐν Χριστῷ πίστις· καὶ γὰρ αὐτὸς διὰ τοῦ πνεύματος τοῦ ἁγίου οὕτως προσκαλεῖται ἡμᾶς· Δεῦτε, τέκνα, ἀκούσατέ μου, φόβον κυρίου διδάξω ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/001.yaml
  text: 'And And faith in Christ confirms all these things. confirms all these things. For he himself, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord.'
translation:
  language: hi
  text: 'और मसीह में विश्वास[a] इन सब बातों की पुष्टि करता है। क्योंकि वह स्वयं पवित्र आत्मा के द्वारा हमें इस प्रकार अपने पास बुलाता है: “आओ, बच्चो, मेरी सुनो; मैं तुम्हें प्रभु का भय मानना सिखाऊँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह विश्वास जो मसीह में है।”
    reason: ἐν Χριστῷ πίστις की अधिक संरचनात्मक व्याख्या की सम्भावना को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: βεβαιοῖ
  choice: पक्का करता है
  rationale: क्रिया का अर्थ पुष्टि करना, दृढ़ ठहराना या सत्य प्रमाणित करना है; ‘पक्का करता है’ आधुनिक और सहज हिन्दी में इस बल को व्यक्त करता है।
- source_word: ἡ ἐν Χριστῷ πίστις
  choice: मसीह में विश्वास
  rationale: यह यूनानी पदबंध स्वाभाविक रूप से मसीह पर/में रखे विश्वास को व्यक्त करता है; हिन्दी में ‘मसीह में विश्वास’ प्रचलित और स्पष्ट है, जबकि संरचनात्मक विकल्प फुटनोट में सुरक्षित है।
- source_word: προσκαλεῖται
  choice: अपने पास बुलाता है
  rationale: मध्यवाच्य रूप केवल संबोधित करने के बजाय अपनी ओर बुलाने या आमंत्रित करने का भाव रखता है।
- source_word: φόβον κυρίου
  choice: प्रभु का भय मानना
  rationale: ‘प्रभु का भय’ मूल पद को बनाए रखता है और ‘भय मानना’ हिन्दी में श्रद्धामय भय के व्यवहारिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἐν Χριστῷ πίστις का संबंध
  choice: मसीह में विश्वास
  alternative: वह विश्वास जो मसीह में है
  rationale: मुख्य पाठ में सामान्य वस्तुगत अर्थ अधिक स्वाभाविक है, पर यूनानी रचना की संभावित गुणात्मक/स्थितिगत अस्पष्टता को फुटनोट में रखा गया है।
- issue: मसीह द्वारा पवित्र आत्मा के माध्यम से वचन कहना
  choice: वह स्वयं पवित्र आत्मा के द्वारा हमें...बुलाता है
  alternative: पवित्र आत्मा के द्वारा यह वचन स्वयं मसीह की वर्तमान पुकार है
  rationale: अनुवाद लेखक की त्रित्व-संबंधी कथन-रचना को यथावत रखता है और उसके तंत्र को अतिरिक्त व्याख्या से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य अपनाया गया है। भजन-सदृश उद्धरण में ‘आओ, बच्चो, मेरी सुनो’ मौखिक आमंत्रण की सहजता बनाए रखता है; ‘प्रभु का भय मानना’ पारंपरिक अवधारणा को सामान्य पाठक के लिए स्वाभाविक बनाता है।
