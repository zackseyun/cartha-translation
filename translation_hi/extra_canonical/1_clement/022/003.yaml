  rationale: सामान्य और व्यापक नैतिक अर्थ को बनाए रखा गया है; इसे किसी खास प्रकार के बुरे भाषण तक सीमित नहीं किया गया।
- source_word: δόλον
  choice: छल की बात
  rationale: δόλος में छल, कपट और धोखा देने का भाव है। ‘छल की बात’ बोलने के संदर्भ में सहज है और मूल संज्ञा के भाव को सुरक्षित रखती है।
