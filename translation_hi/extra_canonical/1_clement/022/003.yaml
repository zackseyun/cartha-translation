lexical_decisions:
- source_word: παῦσον
  choice: रोक रखो
  rationale: यह आज्ञार्थक क्रिया किसी काम को रोकने या उससे दूर रखने का भाव देती है। हिंदी में ‘जीभ को बुराई से रोक रखो’ स्रोत की बनावट और स्वाभाविक अभिव्यक्ति, दोनों को बनाए रखता है।
- source_word: κακοῦ
