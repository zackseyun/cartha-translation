source:
  edition: Funk 1901 (normalized OCR)
  text: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους, καὶ ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά, τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/006.yaml
  text: The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth.
translation:
  language: hi
  text: प्रभु की आँखें धर्मियों पर हैं, और उसके कान उनकी विनती की ओर हैं; परन्तु प्रभु का मुख बुराई करने वालों के विरुद्ध है, ताकि वह पृथ्वी से उनकी स्मृति मिटा दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: धर्मी
  rationale: यह यूनानी शब्द उन लोगों को सूचित करता है जो परमेश्वर की दृष्टि में सही और न्यायपूर्ण आचरण करते हैं; ‘धर्मी’ संक्षिप्त, परिचित और प्रसंगानुकूल है।
- source_word: δέησις
  choice: विनती
  rationale: यह आवश्यकता से उपजी गंभीर प्रार्थना या याचना को व्यक्त करता है; ‘विनती’ सामान्य आधुनिक हिन्दी में इसी भाव को स्वाभाविक रूप से पहुँचाती है।
- source_word: πρόσωπον ... ἐπὶ
  choice: मुख ... के विरुद्ध
  rationale: यहाँ ‘मुख’ प्रभु की विरोधी उपस्थिति या दृष्टि का रूपक है; नकारात्मक प्रसंग के कारण ‘के विरुद्ध’ आशय को स्पष्ट रखते हुए मूल रूपक भी बचाता है।
- source_word: μνημόσυνον
  choice: स्मरण
  rationale: शब्द किसी व्यक्ति की बची हुई याद या स्मृति को दर्शाता है; ‘स्मरण’ मूल की औपचारिक गरिमा बनाए रखता है।
- source_word: ἐξολεθρεῦσαι
  choice: मिटा दे
  rationale: इसका अर्थ पूर्णतः नष्ट या उन्मूलित करना है; स्मरण के साथ ‘मिटा देना’ हिन्दी में स्वाभाविक है और विनाश की तीव्रता प्रकट करता है।
theological_decisions:
- issue: प्रभु के शारीरिक अंगों का मानव-सदृश वर्णन
  choice: ‘आँखें’, ‘कान’ और ‘मुख’ के मूल रूपकों को बनाए रखा गया
  alternative: इनका अर्थ खोलकर ‘प्रभु देखता और सुनता है’ कहना
  rationale: मूल पाठ की काव्यात्मक भाषा परमेश्वर की सजग कृपा और न्यायपूर्ण विरोध दोनों को मूर्त रूप देती है; इसे व्याख्यात्मक गद्य में बदलना उचित नहीं।
- issue: τοῦ ἐξολεθρεῦσαι का उद्देश्य/परिणाम संबंध
  choice: ‘ताकि ... मिटा दे’
  alternative: ‘और इस प्रकार ... मिट जाता है’
  rationale: यूनानी आर्टिक्युलर इनफिनिटिव यहाँ उद्देश्य को स्वाभाविक रूप से व्यक्त करता है; फिर भी वाक्य की न्याय-संबंधी कठोरता को कम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में dignified, शास्त्रीय-काव्यात्मक लय रखी गई है। समानांतर संरचना सुरक्षित है और ‘मुख ... के विरुद्ध’ जैसे मूल रूपक को अनावश्यक व्याख्या से नहीं बदला गया।
