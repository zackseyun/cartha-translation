source:
  edition: Funk 1901 (normalized OCR)
  text: πολλαὶ αἱ θλίψεις τοῦ δικαίου, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτὸν ὁ κύριος. 9. εἶτα· Πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ, τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον ἔλεος κυκλώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/008.yaml
  text: 'Many are the afflictions of the righteous[a], and from all of them the Lord will deliver him. Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”'
translation:
  language: hi
  text: 'धर्मी पर बहुत-से क्लेश आते हैं, और प्रभु उन सब से उसे छुड़ाएगा। फिर कहा गया है: “पापी पर बहुत-से कोड़े पड़ते हैं, पर जो प्रभु पर आशा रखते हैं, उन्हें करुणा घेरेगी।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψεις
  choice: क्लेश
  rationale: यह शब्द दुःख, संकट और विपत्ति के व्यापक अर्थ को बनाए रखता है और भजन-सदृश गरिमा के अनुरूप है।
- source_word: τοῦ δικαίου
  choice: धर्मी पर
  rationale: यूनानी संबंधकारक पद को स्वाभाविक हिन्दी मुहावरे में उस धर्मी व्यक्ति पर आने वाले क्लेशों के रूप में व्यक्त किया गया है।
- source_word: ῥύσεται
  choice: छुड़ाएगा
  rationale: भविष्यकाल और संकट से बचाने अथवा निकालने का अर्थ स्पष्ट रूप से सुरक्षित है।
- source_word: μάστιγες
  choice: कोड़े
  rationale: मूल शब्द का ठोस अर्थ ‘कोड़े/प्रहार’ है; इसे सामान्य ‘दुःख’ बनाकर रूपक की तीव्रता कम नहीं की गई।
- source_word: ἐλπίζοντας ἐπὶ κύριον
  choice: जो प्रभु पर आशा रखते हैं
  rationale: ἐπί के आश्रय और भरोसे के भाव को हिन्दी में प्रचलित बाइबलीय अभिव्यक्ति द्वारा रखा गया है।
- source_word: ἔλεος
  choice: करुणा
  rationale: यह दया और कृपालु व्यवहार दोनों का भाव व्यक्त करता है तथा आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: κυκλώσει
  choice: घेरे रहेगी
  rationale: चारों ओर से घेरने वाली सतत सुरक्षा के चित्र को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘धर्मी’ का एकवचन और उसके लिए प्रयुक्त सर्वनाम
  choice: ‘धर्मी’ और ‘उसे’ के रूप में एकवचन बनाए रखा
  alternative: सामान्य बहुवचन ‘धर्मियों’ और ‘उन्हें’
  rationale: मूल यूनानी τοῦ δικαίου और αὐτόν एकवचन हैं; हिन्दी में इसे सामूहिक या बहुवचन बनाना अनावश्यक व्याख्या होती।
- issue: ἔλεος का स्वरूप
  choice: ‘करुणा’
  alternative: ‘वाचा की अटल कृपा’ या केवल ‘दया’
  rationale: मूल में किसी विशिष्ट धर्मवैज्ञानिक परिभाषा को स्पष्ट नहीं किया गया; इसलिए व्यापक अर्थ रखा गया और संप्रदायगत विस्तार से बचा गया।
- issue: εἶτα द्वारा दूसरे उद्धरण का परिचय
  choice: ‘फिर कहा गया है:’
  alternative: शाब्दिक ‘फिर:’
  rationale: यह अगले शास्त्रीय कथन की ओर संकेत करता है; हिन्दी में न्यूनतम पूर्ति से संबंध स्पष्ट होता है, बिना वक्ता या ग्रंथ का नाम जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सरल, गरिमापूर्ण और पाठ के काव्यात्मक-सूक्तिपरक स्वर के अनुरूप रखी गई है। प्रत्यक्ष उद्धरण केवल εἶτα के बाद आने वाले कथन पर लगाए गए हैं, उपलब्ध पाठ की विराम-रचना के अनुसार।
