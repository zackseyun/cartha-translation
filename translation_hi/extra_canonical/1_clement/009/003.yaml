source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν Ἐνώχ, ὃς ἐν ὑπακοῇ δικαίως εὑρεθεὶς μετετέθη, καὶ οὐχ εὑρέθη αὐτοῦ θάνατος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/003.yaml
  text: Let us take Enoch[a], who, having been found righteous in obedience, was taken up, and his death was not found.
translation:
  language: hi
  text: हम हनोक का उदाहरण लें, जो आज्ञाकारिता में धर्मी पाया गया और उठा लिया गया[a]; और उसकी मृत्यु का पता नहीं चला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूसरे स्थान पर पहुँचा दिया गया।’
    reason: μετετέθη का मूल अर्थ स्थान बदलना या स्थानांतरित किया जाना भी हो सकता है; मुख्य पाठ संदर्भानुकूल अर्थ देता है।
lexical_decisions:
- source_word: λάβωμεν Ἐνώχ
  choice: हम हनोक का उदाहरण लें
  rationale: शाब्दिक ‘हम हनोक को लें’ की अपेक्षा यह हिन्दी में स्वाभाविक ढंग से बताता है कि हनोक को विचार के लिए उदाहरण बनाया जा रहा है।
- source_word: ἐν ὑπακοῇ δικαίως εὑρεθείς
  choice: आज्ञाकारिता में धर्मी पाया गया
  rationale: यह आज्ञाकारिता और धार्मिकता के बीच यूनानी पाठ के संबंध को बनाए रखता है और कर्मवाच्य ‘पाया गया’ को भी सुरक्षित रखता है।
- source_word: μετετέθη
  choice: उठा लिया गया
  rationale: हनोक की बाइबलीय परंपरा के संदर्भ में यह अलौकिक रूप से हटा लिए जाने का स्वाभाविक और गरिमापूर्ण अनुवाद है; क्रिया के अधिक सामान्य अर्थ को पादटिप्पणी में रखा गया है।
- source_word: οὐχ εὑρέθη αὐτοῦ θάνατος
  choice: उसकी मृत्यु का पता नहीं चला
  rationale: यह स्रोत की असामान्य अभिव्यक्ति ‘उसकी मृत्यु नहीं पाई गई’ का अर्थ स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: हनोक के μετετέθη का आशय
  choice: उठा लिया गया
  alternative: दूसरे स्थान पर पहुँचा दिया गया / स्थानांतरित किया गया
  rationale: संदर्भ हनोक के साधारण स्थानांतरण का नहीं, उसकी मृत्यु मिले बिना परमेश्वर द्वारा हटा लिए जाने का है; फिर भी यूनानी क्रिया की व्यापक अर्थ-संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। स्रोत की कर्मवाच्य रचना तथा ‘मृत्यु का पता नहीं चला’ वाली रहस्यमयता को बनाए रखा गया है।
