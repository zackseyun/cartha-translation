base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/004.yaml
  text: Noah[a], having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master preserved the animals that entered the ark in pairs.
translation:
  language: hi
  text: नूह विश्वासयोग्य पाया गया; उसने अपनी सेवा के द्वारा संसार को पुनर्नवीकरण का संदेश सुनाया, और प्रभु ने उसके द्वारा उन जीव-जंतुओं को सुरक्षित रखा, जो आपसी मेल से[a] जहाज़ में प्रवेश किए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त OCR पाठ में यहाँ ἐν ὁμοίᾳ है; यह सम्भवतः ἐν ὁμονοίᾳ (‘आपसी मेल से’) का OCR या प्रतिलिपि-पाठ है। यूनानी में ‘जोड़े-जोड़े’ नहीं लिखा है।
    reason: पाठगत कठिनाई को स्पष्ट करना और उत्पत्ति-वृत्तांत से आयातित ‘जोड़े-जोड़े’ अर्थ से बचना।
lexical_decisions:
- source_word: πιστὸς εὑρεθεὶς
  choice: विश्वासयोग्य पाया गया
  rationale: यूनानी निष्क्रिय कृदंत की न्यायिक/मूल्यांकनात्मक छाया को बनाए रखते हुए स्वाभाविक हिन्दी।
- source_word: λειτουργίας
  choice: सेवा
  rationale: यहाँ सार्वजनिक या पवित्र सेवाकार्य का व्यापक भाव है; ‘सेवकाई’ की अपेक्षा ‘सेवा’ अधिक सामान्य और आधुनिक हिन्दी है।
- source_word: παλιγγενεσίαν
  choice: पुनर्नवीकरण
  rationale: बाढ़ के प्रसंग में संसार के नए आरम्भ या पुनर्स्थापन का भाव देता है, बिना इसे केवल व्यक्तिगत ‘पुनर्जन्म’ तक सीमित किए।
- source_word: ὁ δεσπότης
  choice: प्रभु
  rationale: सार्वभौम स्वामी का भाव व्यक्त करता है और हिन्दी धार्मिक गद्य में स्वाभाविक है।
- source_word: διέσωσεν
  choice: बचाए रखा
  rationale: संकट के पार सुरक्षित रखने का संयुक्त भाव व्यक्त करता है; केवल क्षणिक बचाव नहीं।
- source_word: ζῷα
  choice: जीव-जंतु
  rationale: सन्दर्भ में जहाज़ में प्रवेश करनेवाले प्राणियों के लिए स्पष्ट और सहज हिन्दी।
- source_word: ἐν ὁμονοίᾳ
  choice: आपसी मेल से
  rationale: प्रमाणित पाठ की सम्भावित मूल पदावली ‘सहमति/मेल में’ को व्यक्त करता है; ‘जोड़े-जोड़े’ का विचार यूनानी में नहीं है।
theological_decisions:
- issue: παλιγγενεσίαν का आशय
  choice: संसार के पुनर्नवीकरण
  alternative: संसार के पुनर्जन्म
  rationale: यहाँ नूह और बाढ़ के बाद विश्व के नए आरम्भ की बात है। ‘पुनर्नवीकरण’ उस विश्वव्यापी अर्थ को बनाए रखता है और बाद की किसी विशिष्ट व्यक्तिगत पुनर्जन्म-संबंधी धर्मशास्त्रीय धारणा को आरोपित नहीं करता।
- issue: δι’ αὐτοῦ में माध्यम
  choice: उसके द्वारा
  alternative: जहाज़ के द्वारा
  rationale: निकटतम स्वाभाविक पूर्वपद नूह है और वाक्य नूह की विश्वासयोग्य सेवा को परमेश्वर के संरक्षण का माध्यम बताता है; फिर भी यूनानी सर्वनाम अपने आप में संक्षिप्त है।
- issue: जहाज़ में प्राणियों के प्रवेश का ढंग
  choice: आपसी मेल से
  alternative: जोड़े-जोड़े
  rationale: सुधारे गए यूनानी पाठ ἐν ὁμονοίᾳ का अर्थ मेल या सामंजस्य है। ‘जोड़े-जोड़े’ उत्पत्ति-वृत्तांत से आयातित विवरण होगा, इस पद से नहीं।
