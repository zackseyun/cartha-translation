  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। ‘जहाज़’ को पारंपरिक ‘सन्दूक’ की अपेक्षा कथा-सन्दर्भ में अधिक सहज समझ के लिए चुना गया है; वाक्य-विन्यास मूल यूनानी के दो मुख्य खंडों और कारण-माध्यम संबंध को बनाए रखता है।
