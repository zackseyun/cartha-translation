  text: Διὸ ὑπακούσωμεν τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει αὐτοῦ, καὶ ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ προσπέσωμεν καὶ ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ, ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
translation:
  language: hi
  text: इसलिए हम उसके महान और गौरवशाली संकल्प का पालन करें। और उसकी दया और भलाई की विनती करनेवाले[a] बनकर उसके सामने गिर पड़ें और उसकी करुणाओं की ओर लौटें। हम व्यर्थ परिश्रम, कलह और उस ईर्ष्या को छोड़ दें जो मृत्यु की ओर ले जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी दया और भलाई के याचक बनकर।”
    reason: यूनानी संबंधकारक को अधिक शाब्दिक रूप से व्यक्त करने की वैकल्पिक संभावना।
lexical_decisions:
- source_word: βουλήσει
  choice: इच्छा
  rationale: यहाँ शब्द परमेश्वर की महिमामय अभिलाषा या संकल्प को सूचित कर सकता है; ‘इच्छा’ स्वाभाविक हिन्दी है और मूल की व्यापकता बनाए रखती है।
- source_word: ἱκέται
  choice: विनती करनेवाले
  rationale: यह असहाय होकर कृपा माँगनेवालों का बोध देता है; सामान्य पाठक के लिए यह ‘याचक’ से अधिक सहज है।
- source_word: χρηστότητος
  choice: भलाई
  rationale: संदर्भ में परमेश्वर की कृपालु भलमनसाहत और उदारता का भाव है; ‘भलाई’ स्पष्ट और व्यापक है।
- source_word: οἰκτιρμοὺς
  choice: करुणाओं
  rationale: मूल में बहुवचन है, इसलिए असामान्य किंतु अर्थपूर्ण बहुवचन सुरक्षित रखा गया है।
- source_word: ματαιοπονίαν
  choice: व्यर्थ परिश्रम
  rationale: संयुक्त शब्द निष्फल या निरर्थक श्रम को व्यक्त करता है; यह सीधा और स्वाभाविक समतुल्य है।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: कलह और मृत्यु की ओर ले जाने के नकारात्मक संदर्भ में इसका अर्थ ईर्ष्यापूर्ण होड़ या जलन है; ‘ईर्ष्या’ संक्षिप्त और उपयुक्त है।
theological_decisions:
- issue: βουλήσει का अर्थ
  choice: इच्छा
  alternative: संकल्प / उद्देश्य
  rationale: ‘संकल्प’ दिव्य योजना की धारणा को अधिक निश्चित कर सकता है, जबकि यूनानी शब्द यहाँ इच्छा, अभिप्राय या संकल्प की कुछ व्यापकता रखता है।
- issue: τοῦ ἐλέους καὶ τῆς χρηστότητος में संबंधकारक का प्रकार
  choice: दया और भलाई की विनती करनेवाले
  alternative: दया और भलाई के याचक
  rationale: संबंधकारक को वस्तुपरक मानकर दया और भलाई को माँगी जानेवाली वस्तुएँ समझा गया है; पादटिप्पणी अधिक शाब्दिक वैकल्पिक संबंध को दर्ज करती है।
- issue: ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ
  choice: उसकी करुणाओं की ओर फिरें
  alternative: उसकी करुणा का आश्रय लें
  rationale: ‘की ओर फिरें’ मूल की दिशा और मन-परिवर्तन संबंधी तनाव को बनाए रखता है तथा व्याख्यात्मक ‘आश्रय लें’ से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामूहिक उपदेशात्मक शैली रखी गई है। ‘उसकी करुणाओं’ का बहुवचन जानबूझकर मूल यूनानी के अनुरूप सुरक्षित है; शेष वाक्य-विन्यास पठनीयता के लिए छोटे वाक्यों में बाँटा गया है।
