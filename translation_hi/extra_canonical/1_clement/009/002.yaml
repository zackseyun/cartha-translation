translation:
  language: hi
  text: आइए, हम अपनी दृष्टि उन लोगों पर टिकाएँ जिन्होंने उसकी प्रतापमयी महिमा में पूर्ण रीति से सेवा की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: आइए, हम ... अपनी दृष्टि टिकाएँ
  rationale: यह क्रिया ध्यानपूर्वक और लगातार देखने का आह्वान करती है; यह हिंदी अभिव्यक्ति उसके बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: τοὺς τελείως λειτουργήσαντας
  choice: उन लोगों ... जिन्होंने ... सेवा सिद्धता से की
  rationale: λειτουργέω यहाँ सार्वजनिक अथवा पवित्र सेवा करने का भाव रखता है। τελείως को केवल नैतिक ‘पूर्णता’ घोषित करने के बजाय सेवा के ढंग—पूरी सिद्धता से—के रूप में रखा गया है।
- source_word: τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ
  choice: उसकी प्रतापमय महिमा की
  rationale: यूनानी संप्रदान कारक के संभावित सेवा-संबंध को हिंदी में स्वाभाविक ‘की सेवा’ से व्यक्त किया गया है। μεγαλοπρεπής के लिए ‘प्रतापमय’ गरिमापूर्ण किंतु सुबोध विकल्प है।
theological_decisions:
- issue: क्या सेवा ‘उसकी महिमा की’ की गई या ‘उसकी महिमा में’ की गई?
  choice: उसकी प्रतापमय महिमा की सेवा
  alternative: उसकी प्रतापमय महिमा में सेवा
  rationale: λειτουργέω के साथ संप्रदान कारक सेवा के प्राप्तकर्ता या विषय को सूचित कर सकता है। ‘महिमा की सेवा’ यूनानी संबंध को निकटता से रखता है, यद्यपि ‘महिमा में’ भी व्याकरणतः संभव समझा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सामूहिक उपदेशात्मक आह्वान के लिए ‘आइए, हम’ और गरिमापूर्ण धार्मिक संदर्भ के लिए ‘प्रतापमय महिमा’ रखा गया है।
