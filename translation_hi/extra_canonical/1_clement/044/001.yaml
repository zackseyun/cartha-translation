source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ οἱ ἀπόστολοι ἡμῶν ἔγνωσαν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι ἔρις ἔσται ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/001.yaml
  text: And our apostles knew through our Lord Jesus Messiah that there would be strife over the name of the overseer’s office.
translation:
  language: hi
  text: और हमारे प्रेरितों ने हमारे प्रभु यीशु मसीह के द्वारा जान लिया था कि निरीक्षक-पद के नाम को लेकर झगड़ा होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘निरीक्षण के नाम को लेकर’ है। यहाँ ‘निरीक्षण’ से निरीक्षक का दायित्व या पद अभिप्रेत हो सकता है।
    reason: ἐπισκοπή और ‘नाम’ के बीच मूल यूनानी के असामान्य तथा कुछ हद तक अस्पष्ट संबंध को सुरक्षित और स्पष्ट करना।
lexical_decisions:
- source_word: ἀπόστολοι
  choice: प्रेरित
  rationale: यह आरंभिक मसीही दूतों के लिए प्रचलित, स्वाभाविक और अर्थ-संगत हिन्दी शब्द है।
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीह के द्वारा
  rationale: διά के माध्यम अथवा साधन के भाव को बनाए रखता है और Χριστός का अनुवाद ‘मसीह’ करता है।
- source_word: ἔρις
  choice: झगड़ा
  rationale: विवाद, कलह या संघर्ष के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: τὸ ὄνομα τῆς ἐπισκοπῆς
  choice: निरीक्षक-पद का नाम
  rationale: मूल यूनानी के असामान्य ‘निरीक्षण/अध्यक्षता के नाम’ को मिटाए बिना ἐπισκοπή के पदगत संदर्भ को समझने योग्य बनाता है।
theological_decisions:
- issue: ἐπισκοπή को बाद की कलीसियाई पदवी के रूप में प्रस्तुत करना
  choice: निरीक्षक-पद
  alternative: बिशप का पद / अध्यक्षता
  rationale: ‘निरीक्षक-पद’ मूल शब्द के निरीक्षण और दायित्व के भाव को बनाए रखता है तथा बाद की किसी विशिष्ट सांप्रदायिक पद-व्यवस्था को पाठ पर आरोपित नहीं करता।
- issue: ἐπὶ τοῦ ὀνόματος की व्याख्या
  choice: नाम को लेकर
  alternative: पद को लेकर
  rationale: मूल में ‘नाम’ स्पष्ट रूप से उपस्थित है; केवल ‘पद को लेकर’ कहने से उसकी वास्तविक भाषिक विशिष्टता और संभावित तनाव मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य की मूल संरचना और माध्यम-सूचक ‘के द्वारा’ को सुरक्षित रखते हुए तकनीकी कलीसियाई शब्दावली को अनावश्यक रूप से नहीं अपनाया गया।
