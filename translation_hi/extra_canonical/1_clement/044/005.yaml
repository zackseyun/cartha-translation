  text: μακάριοι οἱ προοδοιπορήσαντες πρεσβύτεροι, οἵτινες ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν· οὐ γὰρ εὐλαβοῦνται, μή τις αὐτοὺς μεταστήσῃ ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/005.yaml
  text: Blessed are the elders who went on before[a], who had a timely and complete departure; for they do not fear lest someone remove them from the place given to them.
translation:
  language: hi
  text: धन्य हैं वे प्राचीन जो पहले आगे चले गए[a], जिनका प्रस्थान उचित समय पर और पूर्ण रीति से हुआ; क्योंकि वे इस बात से नहीं डरते कि कोई उन्हें उस स्थान से हटा दे जो उन्हें दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आगे चले गए” से यहाँ उन प्राचीनों का संकेत है जिनकी मृत्यु हो चुकी थी।
    reason: रूपकात्मक यूनानी अभिव्यक्ति का आशय स्पष्ट करते हुए मुख्य पाठ में उसका रूप बनाए रखना।
lexical_decisions:
- source_word: προοδοιπορήσαντες
  choice: पहले ही आगे चले गए
  rationale: यह शब्द शाब्दिक रूप से पहले आगे निकल जाने को व्यक्त करता है और प्रसंग में मृत्यु की ओर संकेत करता है। इस अभिव्यक्ति से मूल का रूपक बना रहता है।
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: प्रसंग में यह कलीसिया के मान्य पदधारियों के लिए प्रयुक्त पद है; ‘प्राचीन’ हिन्दी बाइबलीय प्रयोग में इस पद को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔγκαιρον καὶ τελείαν ... ἀνάλυσιν
  choice: प्रस्थान समय पर और पूर्ण हुआ
  rationale: ἀνάλυσις का मूल भाव प्रस्थान या विदा होना है और यहाँ मृत्यु अभिप्रेत है। ‘प्रस्थान’ मृत्यु-संबंधी रूपक और कुछ अर्थगत खुलापन बनाए रखता है; ἔγκαιρον और τελείαν को क्रमशः ‘समय पर’ और ‘पूर्ण’ रखा गया है।
- source_word: τοῦ δεδομένου αὐτοῖς τόπου
  choice: उस स्थान ... जो उन्हें दिया गया है
  rationale: δεδομένου, δίδωμι का कृदंत है और स्पष्टतः ‘दिया गया’ कहता है। इसे ‘नियुक्त किया गया’ कहना पिछले पदों के καθίστημι-सम्बन्धी शब्दों से यहाँ आए जानबूझकर lexical बदलाव को मिटा देता।
theological_decisions:
- issue: मृत्यु और पद से हटाए जाने के बीच विरोध
  choice: मृत प्राचीनों के ‘प्रस्थान’ और जीवित पदधारियों को उनके दिए गए स्थान से हटाए जाने—दोनों को अलग रखते हुए प्रस्तुत किया गया है।
  alternative: ἀνάλυσις को सीधे ‘मृत्यु’ या ‘निधन’ अनुवादित करना।
  rationale: सीधा ‘मृत्यु’ अर्थ स्पष्ट कर देता, पर यूनानी की प्रस्थान-सम्बन्धी सौम्य और रूपकात्मक भाषा को समाप्त कर देता।
- issue: दिया हुआ स्थान
  choice: स्थान को ‘दिया गया’ कहा गया है।
  alternative: ‘उनके लिए नियुक्त स्थान’ कहना।
  rationale: मूल में औपचारिक नियुक्ति वाला क्रियापद नहीं, बल्कि ‘देना’ है; इसलिए किसी विशेष पद-नियुक्ति सिद्धान्त को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी रखी गई है। वाक्य की औपचारिक गंभीरता मूल के अनुरूप है; मृत्यु के लिए प्रयुक्त दोनों प्रस्थान-रूपकों को यथासंभव सुरक्षित रखा गया है।
