source:
  edition: Funk 1901 (normalized OCR)
  text: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται, ἐὰν τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς ἀποβάλωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/004.yaml
  text: For it will be no small sin for us if we cast out those who have offered the gifts of oversight blamelessly and devoutly[a].
translation:
  language: hi
  text: क्योंकि यदि हम उन लोगों को हटा दें जिन्होंने देखरेख की सेवा के चढ़ावे निर्दोष और भक्तिपूर्वक अर्पित किए हैं, तो यह हमारे लिए कोई छोटा पाप नहीं होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि हम उन लोगों को देखरेख की सेवा से हटा दें जिन्होंने चढ़ावे निर्दोष और भक्तिपूर्वक अर्पित किए हैं।”
    reason: यूनानी τὰ δῶρα τῆς ἐπισκοπῆς का सीधा संबंध ‘देखरेख की सेवा के चढ़ावे’ हो सकता है; किंतु निकटवर्ती संदर्भ इसे उन लोगों को उनकी देखरेख-सेवा से हटाने के अर्थ में भी समझने देता है।
lexical_decisions:
- source_word: ἁμαρτία ... οὐ μικρά
  choice: कोई छोटा पाप नहीं
  rationale: यूनानी के नकारात्मक बल और नैतिक गंभीरता को सीधे बनाए रखता है।
- source_word: ἀμέμπτως καὶ ὁσίως
  choice: निर्दोष रीति से और भक्तिभाव के साथ
  rationale: दोनों क्रियाविशेषणों को अलग रखते हुए ἀμέμπτως की निष्कलंकता और ὁσίως की ईश्वरपरायण भक्ति व्यक्त करता है।
- source_word: τὰ δῶρα
  choice: चढ़ावे
  rationale: προσενέγκοντας के साथ यह केवल सामान्य ‘उपहार’ नहीं, बल्कि परमेश्वर के सामने अर्पित वस्तुओं की ओर संकेत कर सकता है; ‘चढ़ावे अर्पित किए’ हिंदी में स्वाभाविक और ऐतिहासिक-सांस्कृतिक अर्थ के अनुकूल है।
- source_word: τῆς ἐπισκοπῆς
  choice: निरीक्षण-सेवा के
  rationale: ἐπισκοπή में देखरेख तथा उससे जुड़ी सेवकीय जिम्मेदारी दोनों निहित हैं; यह चयन किसी बाद की विशिष्ट पदवी या कलीसियाई संरचना को आरोपित नहीं करता।
- source_word: ἀποβάλωμεν
  choice: हटा दें
  rationale: संदर्भ में व्यक्तियों को उनकी मान्य सेवकीय भूमिका से निकालने का भाव है; ‘हटा दें’ क्रिया की कठोरता को रखते हुए हिंदी में स्वाभाविक है।
theological_decisions:
- issue: क्या τῆς ἐπισκοπῆς चढ़ावों का वर्णन करता है या पद से हटाए जाने का आशय स्पष्ट करता है?
  choice: मुख्य पाठ में इसे ‘निरीक्षण-सेवा के चढ़ावे’ के रूप में τὰ δῶρα से जोड़ा गया है।
  alternative: ‘उन लोगों को निरीक्षण-सेवा के पद से हटा दें जिन्होंने निर्दोष रीति से और भक्तिभाव के साथ चढ़ावे अर्पित किए हैं।’
  rationale: यूनानी शब्दक्रम और व्याकरण में संबंध सीधे τὰ δῶρα τῆς ἐπισκοπῆς है, पर संदर्भ पद से हटाने का अर्थ सुझाता है। मुख्य पाठ औपचारिक संबंध बचाता है और पादटिप्पणी संदर्भगत वैकल्पिक समझ दर्ज करती है।
- issue: ἐπισκοπή को बाद की संस्थागत पदवी के रूप में प्रस्तुत करना
  choice: ‘निरीक्षण-सेवा’
  alternative: ‘अध्यक्ष का पद’ या ‘बिशप का पद’
  rationale: मूल शब्द का अर्थ देखरेख/निरीक्षण और उससे जुड़ी सेवा है; अधिक संस्थागत शब्दावली पाठ में बाद की कलीसियाई व्यवस्था आरोपित कर सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘निरीक्षण-सेवा’ तकनीकी धार्मिक पदनाम से बचते हुए मूल के सेवकीय अर्थ को रखता है; ‘चढ़ावे अर्पित किए’ आराधनात्मक संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
