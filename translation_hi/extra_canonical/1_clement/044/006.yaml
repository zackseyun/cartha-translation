source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρῶμεν γάρ, ὅτι ἐνίους ὑμεῖς μετηγάγετε καλῶς πολιτευομένους ἐκ τῆς ἀμέμπτως αὐτοῖς τετιμημένης λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/006.yaml
  text: For we see that you have removed some who were conducting themselves well from the ministry that had been blamelessly honored by them[a].
translation:
  language: hi
  text: क्योंकि हम देखते हैं कि आपने कुछ ऐसे लोगों को, जो भला आचरण करते थे, उस सेवा से हटा दिया है जिसका उन्होंने निष्कलंक रूप से सम्मान किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετηγάγετε
  choice: हटा दिया है
  rationale: क्रिया का मूल भाव एक स्थान या पद से दूसरी ओर ले जाना है; इस प्रसंग में व्यक्तियों को उनकी सेवा से हटाना अभिप्रेत है।
- source_word: καλῶς πολιτευομένους
  choice: जो अच्छा आचरण कर रहे थे
  rationale: πολιτεύομαι यहाँ सार्वजनिक या सामुदायिक जीवन में आचरण करने के अर्थ में है; सरल आधुनिक हिन्दी में नैतिक आचरण का भाव रखा गया है।
- source_word: λειτουργίας
  choice: सेवा
  rationale: आरम्भिक कलीसियाई प्रसंग में यह सौंपे गए सेवाकार्य या सेवकाई को दर्शाता है; ‘सेवा’ सहज है और अनावश्यक रूप से किसी विशिष्ट बाद की पद-व्यवस्था को आरोपित नहीं करता।
- source_word: ἀμέμπτως ... τετιμημένης
  choice: जिसका वे निर्दोष रीति से आदर करते आए थे
  rationale: τετιμημένης पूर्ण निष्क्रिय कृदन्त है और αὐτοῖς को कर्तृवाचक सम्प्रदान मानते हुए ‘उनके द्वारा आदर की गई’ अर्थ देता है; हिन्दी में पूर्णता और जारी परिणाम का भाव ‘करते आए थे’ से स्वाभाविक रूप में व्यक्त किया गया है।
theological_decisions:
- issue: λειτουργία को संस्थागत पद मानना या व्यापक सेवा
  choice: व्यापक ‘सेवा’
  alternative: ‘सेवा-पद’ या ‘सेवकाई’
  rationale: यूनानी शब्द यहाँ आधिकारिक सामुदायिक सेवा की ओर संकेत कर सकता है, पर इस एक पद में उसके बाद के किसी निश्चित कलीसियाई पदनाम को आरोपित करना उचित नहीं है।
- issue: αὐτοῖς τετιμημένης में αὐτοῖς का संबंध
  choice: कर्तृवाचक सम्प्रदान—सेवा का आदर उन्हीं व्यक्तियों ने किया था
  alternative: सेवा उन्हें सम्मानपूर्वक सौंपी गई थी
  rationale: पूर्ण निष्क्रिय τετιμημένης के साथ αὐτοῖς का स्वाभाविक विश्लेषण कर्तृवाचक सम्प्रदान है; ‘सौंपी गई’ τιμάω के अर्थ को बदल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन ‘आप लोगों’ और गरिमापूर्ण किंतु सहज वाक्य-विन्यास। ‘निर्दोष रीति से आदर’ जानबूझकर स्रोत की असामान्य पर महत्त्वपूर्ण अभिव्यक्ति को बनाए रखता है।
