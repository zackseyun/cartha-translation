review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the principal sense: the addressees removed certain people from a λειτουργία, those people having conducted themselves well and having honored that ministry blamelessly. However, ‘आदर करते आए थे’ introduces a continuing, habitual sense that is not expressed by the Greek perfect passive participle τετιμημένης.'
  naturalness: The sentence is generally clear and suitably formal. ‘भला आचरण करते थे’ is more idiomatic than ‘अच्छा आचरण कर रहे थे’ for the characterizing participle, and ‘निष्कलंक रूप से सम्मान किया था’ is natural modern Hindi while retaining the source’s unusual qualification of the honoring.
  terminology: ‘सेवा’ is an appropriately broad rendering of λειτουργία and does not impose a later ecclesiastical office. ‘सम्मान/आदर’ correctly represents τιμάω; no footnote is required in Hindi because the rejected ‘assigned’ alternative is not a viable rendering of the Greek here.
  issues:
  - severity: low
    issue: ‘करते आए थे’ overstates the verbal aspect of τετιμημένης.
    rationale: 'The Greek is a perfect passive participle, with αὐτοῖς plausibly expressing the agents: the ministry had been honored by them. The Hindi continuous ‘करते आए थे’ adds an ongoing/habitual nuance; ‘सम्मान किया था’ more directly conveys the completed prior honoring.'
  - severity: low
    issue: ‘जो अच्छा आचरण कर रहे थे’ is less idiomatic for καλῶς πολιτευομένους.
    rationale: The participle characterizes these persons’ conduct. ‘जो भला आचरण करते थे’ is smoother modern Hindi and preserves the general, evaluative sense without narrowing it.
  revised_text: क्योंकि हम देखते हैं कि आपने कुछ ऐसे लोगों को, जो भला आचरण करते थे, उस सेवा से हटा दिया है जिसका उन्होंने निष्कलंक रूप से सम्मान किया था।
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s sound interpretation of αὐτοῖς τετιμημένης as ‘honored by them,’ while avoiding an added continuing aspect and improving idiomatic Hindi. It preserves the ambiguity-free but broad sense of λειτουργία as ‘सेवा.’
