revisions:
- from: क्योंकि हम देखते हैं कि आप लोगों ने कुछ ऐसे व्यक्तियों को, जो अच्छा आचरण कर रहे थे, उस सेवा से हटा दिया है जिसका वे निर्दोष रीति से आदर करते आए थे।
  to: क्योंकि हम देखते हैं कि आपने कुछ ऐसे लोगों को, जो भला आचरण करते थे, उस सेवा से हटा दिया है जिसका उन्होंने निष्कलंक रूप से सम्मान किया था।
  rationale: The revision retains the draft’s sound interpretation of αὐτοῖς τετιμημένης as ‘honored by them,’ while avoiding an added continuing aspect and improving idiomatic Hindi. It preserves the ambiguity-free but broad sense of λειτουργία as ‘सेवा.’
  reviewer_model: gpt-5.6-terra
