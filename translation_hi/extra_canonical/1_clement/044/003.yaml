id: 1CLEM.44.3
reference: 1 Clement 44:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: τοὺς οὖν κατασταθέντας ὑπ᾽ ἐκείνων ἢ μεταξὺ ὑφ᾽ ἑτέρων ἐλλογίμων ἀνδρῶν συνευδοκησάσης τῆς ἐκκλησίας πάσης, καὶ λειτουργήσαντας ἀμέμπτως τῷ ποιμνίῳ τοῦ Χριστοῦ μετὰ ταπεινοφροσύνης, ἡσύχως καὶ ἀβαναύσως, μεμαρτυρημένους τε πολλοῖς χρόνοις ὑπὸ πάντων, τούτους οὐ δικαίως νομίζομεν ἀποβάλλεσθαι τῆς λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/003.yaml
  text: Therefore[a], those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and unpretentiously, and who for a long time have been well attested by all—these we consider not to be justly removed from the ministry.
translation:
  language: hi
  text: इसलिए[a] जो लोग उनके द्वारा नियुक्त किए गए थे, या बाद में दूसरे प्रतिष्ठित पुरुषों द्वारा—पूरी कलीसिया की सहमति से—नियुक्त किए गए थे, और जिन्होंने नम्रता के साथ, शांत भाव से और बिना दिखावे के मसीह के झुंड की निर्दोष सेवा की, तथा जिनकी लंबे समय से सबके द्वारा अच्छी गवाही रही है—ऐसे लोगों को सेवाकार्य से हटाना हम न्यायोचित नहीं मानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक वाक्य-संरचना: “इसलिए हम यह न्यायोचित नहीं मानते कि जो लोग उनके द्वारा नियुक्त किए गए थे, या बाद में दूसरे प्रतिष्ठित पुरुषों द्वारा पूरी कलीसिया की सहमति से नियुक्त किए गए थे, और जिन्होंने नम्रता के साथ, शांत भाव से और बिना दिखावे के मसीह के झुंड की निर्दोष सेवा की तथा जिनकी लंबे समय से सबके द्वारा अच्छी गवाही रही है—ऐसे लोगों को सेवाकार्य से हटा दिया जाए।”'
    reason: यूनानी वाक्य में लंबे आरंभिक कर्म-पद के बाद संकेतवाचक पद द्वारा उसे फिर उठाया गया है; हिन्दी में मुख्य निष्कर्ष को आरंभ में रखने वाली वैकल्पिक संरचना भी संभव है।
lexical_decisions:
- source_word: κατασταθέντας
  choice: नियुक्त किए गए
  rationale: यह पद पर स्थापित या नियुक्त किए जाने का सामान्य और स्वाभाविक हिन्दी रूप है।
- source_word: ἐλλογίμων ἀνδρῶν
  choice: प्रतिष्ठित पुरुषों
  rationale: ἐλλόγιμος यहाँ सम्मानित और अच्छी प्रतिष्ठा रखने वाले व्यक्तियों को सूचित करता है।
- source_word: συνευδοκησάσης τῆς ἐκκλησίας πάσης
  choice: पूरी कलीसिया की सहमति से
  rationale: समूची कलीसिया के साथ मिलकर अनुमोदन करने के भाव को संक्षिप्त और स्पष्ट रूप में व्यक्त करता है।
- source_word: λειτουργήσαντας
  choice: सेवा की
  rationale: संदर्भ में यह कलीसियाई सेवाकार्य करने को दर्शाता है; हिन्दी में क्रियात्मक रूप वाक्य को स्वाभाविक रखता है।
- source_word: τῷ ποιμνίῳ τοῦ Χριστοῦ
  choice: मसीह के झुंड की
  rationale: चरवाही के मूल रूपक को बनाए रखता है और सामान्य धार्मिक हिन्दी में बोधगम्य है।
- source_word: ἀμέμπτως
  choice: निर्दोष
  rationale: इसका आशय ऐसा सेवाचरण है जिस पर उचित दोष न लगाया जा सके।
- source_word: ταπεινοφροσύνης
  choice: दीनता
  rationale: नम्र और आत्म-विनीत मनोभाव के लिए dignified, प्रचलित हिन्दी शब्द।
- source_word: ἡσύχως
  choice: शांत भाव से
  rationale: शांत, अविवादी ढंग से सेवा करने का भाव व्यक्त करता है।
- source_word: ἀβαναύσως
  choice: बिना दिखावे के
  rationale: दुर्लभ शब्द के प्रसंगगत भाव—अशिष्ट आत्म-प्रदर्शन या आडंबर से रहित—को सहज हिन्दी में व्यक्त करता है।
- source_word: μεμαρτυρημένους
  choice: जिनके पक्ष में अच्छी गवाही दी गई
  rationale: दीर्घकाल तक सबके अनुमोदन और उत्तम प्रमाण का निष्क्रिय भाव सुरक्षित रखता है।
- source_word: ἀποβάλλεσθαι τῆς λειτουργίας
  choice: सेवाकार्य से हटाना
  rationale: पदगत/सामुदायिक सेवा से निष्कासन का अर्थ देता है, बिना किसी विशिष्ट आधुनिक पदनाम को आरोपित किए।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/अभिषिक्त जन
  rationale: आधुनिक मानक हिन्दी में परिचित उपाधि है और मूल की मसीही उपाधि को बनाए रखती है।
- issue: ἐκκλησία का अनुवाद
  choice: कलीसिया
  alternative: सभा/चर्च
  rationale: यहाँ संगठित विश्वास-समुदाय अभिप्रेत है; कलीसिया उस अर्थ को स्पष्ट रखती है और आधुनिक संस्थागत अर्थों को अनावश्यक रूप से सीमित नहीं करती।
- issue: λειτουργία का अनुवाद
  choice: सेवाकार्य
  alternative: पद/उपासना-सेवा
  rationale: मूल शब्द की सेवा-संबंधी व्यापकता बनाए रखी गई है; इसे किसी एक निश्चित कलीसियाई पद या केवल उपासना-विधि तक सीमित नहीं किया गया।
- issue: οὐ δικαίως νομίζομεν ἀποβάλλεσθαι की संरचना
  choice: हम मानते हैं कि ऐसे लोगों को सेवाकार्य से हटाना न्यायोचित नहीं है
  alternative: हम मानते हैं कि ऐसे लोगों को अन्यायपूर्वक सेवाकार्य से हटाया जाता है
  rationale: निषेध को δικαίως के साथ रखता है और लेखक के नैतिक निर्णय को स्पष्ट करता है, जबकि वास्तविक निष्कासन की कालगत अवस्था को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। मूल यूनानी की आरंभिक विस्तृत पद-रचना और फिर ‘ऐसे लोगों’ द्वारा पुनरुक्ति को यथासंभव सुरक्षित रखा गया है; विराम-चिह्न लंबे वाक्य को सुबोध बनाते हैं।
