id: 1CLEM.44.2
reference: 1 Clement 44:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ταύτην οὖν τὴν αἰτίαν πρόγνωσιν εἰληφότες τελείαν κατέστησαν τοὺς προειρημένους καὶ μεταξὺ ἐπινομὴν δεδώκασιν, ὅπως, ἐὰν κοιμηθῶσιν, διαδέξωνται ἕτεροι δεδοκιμασμένοι ἄνδρες τὴν λειτουργίαν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/002.yaml
  text: For this reason[a], then, having received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry.
translation:
  language: hi
  text: इसी कारण[a], पूर्ण पूर्वज्ञान प्राप्त करके, उन्होंने उन लोगों को नियुक्त किया जिनका पहले उल्लेख किया जा चुका है; और इसके बाद उन्होंने यह अतिरिक्त व्यवस्था की कि यदि वे सो जाएँ[b], तो दूसरे परखे हुए और खरे पाए गए पुरुष उनकी सेवा में उनका स्थान लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अतः इसी कारण’।
    reason: διὰ ταύτην ... τὴν αἰτίαν और οὖν के संयुक्त संबंधसूचक बल को हिन्दी में एक से अधिक स्वाभाविक ढंग से रखा जा सकता है।
  - marker: b
    text: अर्थात उनकी मृत्यु हो जाए।
    reason: ‘सो जाना’ यहाँ मृत्यु के लिए प्रयुक्त रूपक है।
lexical_decisions:
- source_word: πρόγνωσιν ... τελείαν
  choice: पूर्ण पूर्वज्ञान
  rationale: ‘पूर्वज्ञान’ भविष्य की बात को पहले से जानने का अर्थ रखता है, और ‘पूर्ण’ τελείαν की व्यापकता को बनाए रखता है।
- source_word: κατέστησαν
  choice: नियुक्त किया
  rationale: यहाँ क्रिया किसी को निर्धारित पद या दायित्व में स्थापित करने को दर्शाती है; ‘नियुक्त किया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: μεταξὺ ἐπινομὴν δεδώκασιν
  choice: इसके बाद ... यह अतिरिक्त व्यवस्था भी की
  rationale: μεταξὺ के कालगत अर्थ और दुर्लभ ἐπινομή के आगे के प्रबंध/प्रावधान के भाव को सहज हिन्दी में व्यक्त करता है, बिना उसके स्वरूप को अनावश्यक रूप से निश्चित किए।
- source_word: δεδοκιμασμένοι ἄνδρες
  choice: परखे और खरे पाए गए पुरुष
  rationale: δεδοκιμασμένοι में जाँच लिए जाने और स्वीकृत/खरा सिद्ध होने, दोनों का भाव है; संयुक्त अभिव्यक्ति इस अर्थ को स्पष्ट रखती है।
- source_word: λειτουργίαν
  choice: सेवा
  rationale: संदर्भ में यह सौंपे गए सामुदायिक या धार्मिक दायित्व की सेवा है; ‘सेवा’ व्यापक है और बाद की किसी विशिष्ट पद-संरचना को पाठ में आरोपित नहीं करती।
- source_word: διαδέξωνται
  choice: उनका स्थान लें
  rationale: क्रिया उत्तराधिकारी होकर किसी का कार्य सँभालने को व्यक्त करती है; ‘सेवा में उनका स्थान लें’ उत्तराधिकार और कार्य-दायित्व दोनों को स्वाभाविक रूप से बताता है।
theological_decisions:
- issue: सेवा में उत्तराधिकार की प्रकृति
  choice: ‘उनकी सेवा में उनका स्थान लें’
  alternative: ‘उनके पद के उत्तराधिकारी हों’
  rationale: मूल पाठ λειτουργία को सेवा/कार्य के रूप में रखता है और किसी बाद की निश्चित कलीसियाई पद-व्यवस्था का तकनीकी नाम नहीं देता; इसलिए अनावश्यक संप्रदायगत अर्थ से बचा गया है।
- issue: κοιμηθῶσιν का मृत्यु-सूचक रूपक
  choice: मुख्य पाठ में ‘सो जाएँ’, पादटिप्पणी में मृत्यु का संकेत
  alternative: मुख्य पाठ में सीधे ‘मर जाएँ’
  rationale: मूल यूनानी का रूपक सुरक्षित रहता है, जबकि पादटिप्पणी आधुनिक पाठक के लिए आशय स्पष्ट करती है।
- issue: πρόγνωσις का कर्ताओं से संबंध
  choice: ‘पूर्ण पूर्वज्ञान प्राप्त कर लेने पर’
  alternative: ‘क्योंकि उन्हें पूर्ण पूर्वज्ञान प्राप्त था’
  rationale: यह कृदन्तीय रचना को निकटता से दर्शाता है और कारण तथा कालगत पृष्ठभूमि के बीच मूल की हल्की खुली गुंजाइश बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘परखे और खरे पाए गए’ स्वीकृति से पहले जाँच के भाव को सामने लाता है; ‘सेवा’ को तकनीकी पदनाम न बनाकर मूल की व्यापकता सुरक्षित रखी गई है।
