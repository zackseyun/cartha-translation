  text: Therefore do not disregard them, for they are the ones honored by you, together with the prophets and teachers.
translation:
  language: hi
  text: इसलिए उनकी उपेक्षा मत करो, क्योंकि वे ही भविष्यद्वक्ताओं और शिक्षकों के साथ तुम्हारे सम्मानित जन हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερίδητε
  choice: उपेक्षा न करो
  rationale: यह क्रिया किसी को अनदेखा करने, तुच्छ समझने या ध्यान न देने का भाव रखती है; संदर्भ में ‘उपेक्षा’ स्वाभाविक और अर्थपूर्ण है।
- source_word: τετιμημένοι
  choice: जिन्हें तुम सम्मान देते हो
  rationale: यूनानी पूर्ण निष्क्रिय कृदंत के सम्मानित होने के भाव को सहज हिन्दी में व्यक्त करता है और ὑμῶν के संबंध को स्पष्ट रखता है।
- source_word: μετὰ τῶν προφητῶν καὶ διδασκάλων
  choice: भविष्यद्वक्ताओं और शिक्षकों के साथ
  rationale: μετά के सहयोगी/समूहगत अर्थ को सीधे बनाए रखता है, बिना पदानुक्रम या समानता की सीमा को अतिरिक्त रूप से तय किए।
theological_decisions:
- issue: स्थानीय अगुओं का भविष्यद्वक्ताओं और शिक्षकों से संबंध
  choice: ‘भविष्यद्वक्ताओं और शिक्षकों के साथ’
  alternative: ‘भविष्यद्वक्ताओं और शिक्षकों के समान’
  rationale: मूल पाठ में μετά ‘के साथ’ कहता है; यह आवश्यक रूप से पद, अधिकार या सम्मान की पूर्ण समानता घोषित नहीं करता। इसलिए वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘वे ही हैं’ से αὐτοὶ ... οἱ की बलात्मक संरचना सुरक्षित रखी गई है।
