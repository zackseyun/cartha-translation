source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/001.yaml
  text: Appoint, then, for yourselves overseers and deacons worthy of the Lord—men who are gentle, not lovers of money, truthful, and proven; for they too perform for you the ministry of the prophets and teachers.
translation:
  language: hi
  text: इसलिए अपने लिए ऐसे निरीक्षकों और सेवकों को नियुक्त करो जो प्रभु के योग्य हों—ऐसे पुरुष जो नम्र हों, धन के लोभी न हों, सत्यनिष्ठ और परखे हुए हों; क्योंकि वे भी तुम्हारे लिए भविष्यद्वक्ताओं और शिक्षकों का सेवा-कार्य करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χειροτονήσατε
  choice: नियुक्त करो
  rationale: यहाँ क्रिया समुदाय द्वारा पदाधिकारियों के चयन या नियुक्ति को व्यक्त करती है; ‘नियुक्त करो’ आधुनिक हिन्दी में स्वाभाविक है और चयन की किसी विशिष्ट प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ἐπισκόπους
  choice: अध्यक्षों
  rationale: मूल शब्द निगरानी और देखरेख करने वालों को सूचित करता है। ‘अध्यक्ष’ आरम्भिक सामुदायिक पद को व्यक्त करता है, बिना बाद के विकसित पदनाम ‘बिशप’ को सीधे आरोपित किए।
- source_word: διακόνους
  choice: सेवकों
  rationale: διάκονος का मूल भाव सेवा करने वाला है। ‘सेवक’ सामान्य पाठक के लिए स्पष्ट है और किसी बाद की संस्थागत संरचना को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ἀξίους τοῦ Κυρίου
  choice: जो प्रभु के योग्य हों
  rationale: सम्बन्धवाचक संरचना हिन्दी में स्वाभाविक रहते हुए योग्यता के मानक को प्रभु से सम्बद्ध रखती है।
- source_word: πραεῖς
  choice: नम्र
  rationale: यह शब्द कोमलता, मृदुता और आत्मसंयम का भाव रखता है; ‘नम्र’ संक्षिप्त और प्रतिष्ठित हिन्दी विकल्प है।
- source_word: ἀφιλαργύρους
  choice: धन के लोभी न हों
  rationale: शाब्दिक भाव ‘चाँदी/धन से प्रेम न करने वाले’ है; हिन्दी में ‘धन के लोभी न हों’ उसका स्वाभाविक नैतिक अर्थ देता है।
- source_word: ἀληθεῖς
  choice: सच्चे
  rationale: यह सत्यनिष्ठ और विश्वसनीय होने का गुण व्यक्त करता है; ‘सच्चे’ दोनों भावों को सहज रूप से वहन करता है।
- source_word: δεδοκιμασμένους
  choice: परखे हुए
  rationale: पूर्ण कृदन्त परीक्षा के बाद प्रमाणित पाए जाने का भाव देता है; ‘परखे हुए’ उस प्रक्रिया और परिणामी विश्वसनीयता दोनों को बनाए रखता है।
- source_word: λειτουργοῦσι ... τὴν λειτουργίαν
  choice: सेवा का कार्य करते हैं
  rationale: यूनानी में सजातीय क्रिया-संज्ञा का प्रयोग है। हिन्दी में उसकी यांत्रिक पुनरावृत्ति से बचते हुए ‘सेवा का कार्य करते हैं’ धार्मिक/सामुदायिक कर्तव्य निभाने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: ἐπίσκοποι और διάκονοι के पदनाम
  choice: अध्यक्षों और सेवकों
  alternative: बिशपों और डीकनों / निरीक्षकों और सेवकों
  rationale: पाठ आरम्भिक सामुदायिक सेवाओं की बात करता है। चुना हुआ अनुवाद उनके कार्यात्मक अर्थ को रखता है और बाद की किसी विशिष्ट कलीसियाई पद-व्यवस्था को मूल पाठ में नहीं डालता।
- issue: भविष्यद्वक्ताओं और शिक्षकों की λειτουργία
  choice: भविष्यद्वक्ताओं और शिक्षकों की सेवा का कार्य
  alternative: भविष्यद्वक्ताओं और शिक्षकों वाली सेवा
  rationale: सम्बन्धवाचक ‘की’ को बनाए रखा गया है, ताकि यह अस्पष्टता बनी रहे कि बात उनके द्वारा की जाने वाली सेवा की है या उस सेवकाई की जो उनसे सम्बद्ध है; अनुवाद दोनों को कठोरता से अलग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आज्ञार्थक बहुवचन ‘करो’ के साथ, क्योंकि यूनानी क्रिया और सर्वनाम बहुवचन समुदाय को सम्बोधित करते हैं। शैली सरल, गरिमापूर्ण और सामुदायिक निर्देश के अनुकूल रखी गई है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
