id: DID.15.3
reference: Didache 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
translation:
  language: hi
  text: और एक-दूसरे को सुधारो—क्रोध में नहीं, बल्कि शान्ति से—जैसा तुम्हें सुसमाचार में मिला है। और जो कोई किसी दूसरे के विरुद्ध अपराध करे[a], उससे कोई बात न करे, और जब तक वह मन न फिराए, तब तक वह तुम्हारी ओर से कोई बात न सुने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कोई किसी दूसरे के विरुद्ध गलत करे।” यूनानी क्रिया का मूल भाव लक्ष्य से चूकना, भटकना या गलत करना है।
    reason: ἀστοχέω की शब्दार्थगत व्यापकता और इस प्रसंग में किसी दूसरे के विरुद्ध किए गए नैतिक अपराध का भाव सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Ἐλέγχετε
  choice: सुधारो
  rationale: यहाँ क्रिया का अर्थ गलती उजागर करके डाँटना या सुधारना है। ‘सुधारो’ आधुनिक हिन्दी में स्वाभाविक है और क्रोध के विपरीत शान्तिपूर्ण अनुशासन के प्रसंग में उपयुक्त बैठता है।
- source_word: ἐν ὀργῇ … ἐν εἰρήνῃ
  choice: क्रोध में नहीं, बल्कि शान्ति से
  rationale: यूनानी के विरोध को स्पष्ट रखते हुए हिन्दी में स्वाभाविक रीति-सूचक अभिव्यक्ति अपनाई गई है।
- source_word: ὡς ἔχετε ἐν τῷ εὐαγγελίῳ
  choice: जैसा तुम्हें सुसमाचार में मिला है
  rationale: ἔχετε का शाब्दिक ‘तुम्हारे पास है’ हिन्दी में असहज होता; यह वाक्य समुदाय को सुसमाचार में प्राप्त शिक्षा की ओर संकेत करता है।
- source_word: ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  choice: जो कोई किसी दूसरे के विरुद्ध गलत काम करे
  rationale: ἀστοχέω मूलतः लक्ष्य से चूकने या गलत राह जाने का भाव रखता है; κατὰ τοῦ ἑτέρου इसे पारस्परिक अपराध के प्रसंग में रखता है। यह अनुवाद अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे अनिवार्यतः किसी अधिक विशिष्ट धार्मिक शब्द तक सीमित किए।
- source_word: μηδεὶς λαλειτώ
  choice: उससे कोई बात न करे
  rationale: 'παντὶ ἀστοχοῦντι के सम्प्रदान कारक को λαλειτώ के साथ लिया गया है: अपराध करने वाले व्यक्ति से कोई बातचीत न करे।'
- source_word: μηδὲ παρ’ ὑμῶν ἀκουέτω
  choice: वह तुमसे कुछ न सुने
  rationale: ἀκουέτω सक्रिय आज्ञार्थक है और παρ’ ὑμῶν का अर्थ ‘तुमसे’ है। लुप्त कर्म को हिन्दी में स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: μετανοήσῃ
  choice: मन न फिराए
  rationale: यह पश्चात्ताप के साथ दिशा और आचरण बदलने का भाव व्यक्त करता है; ‘मन फिराना’ प्रतिष्ठित और बोधगम्य धार्मिक हिन्दी है।
theological_decisions:
- issue: ἀστοχέω को ‘पाप करना’ या व्यापक ‘गलत काम करना’ कहना
  choice: गलत काम करे
  alternative: पाप करे / दूसरे का अपराध करे
  rationale: मूल क्रिया ‘चूकना, भटकना, गलत होना’ का व्यापक अर्थ रखती है। पारस्परिक प्रसंग नैतिक अपराध स्पष्ट करता है, पर ‘गलत काम’ मूल की शब्दार्थगत व्यापकता को अधिक सुरक्षित रखता है।
- issue: μηδὲ παρ’ ὑμῶν ἀκουέτω में कर्ता और निहित कर्म
  choice: अपराधी तुमसे कुछ न सुने
  alternative: तुममें से कोई उसकी बात न सुने
  rationale: सक्रिय ἀκουέτω और ‘तुमसे’ अर्थ वाले παρ’ ὑμῶν के कारण पहला अर्थ व्याकरण की सीधी दिशा है। वैकल्पिक अर्थ अनुशासन का समान भाव दे सकता है, पर यूनानी वाक्य-विन्यास से कम सीधा है।
- issue: समुदायगत अनुशासन की सीमा
  choice: केवल वाक्य में कही गई बातचीत रोकने की आज्ञा व्यक्त की गई
  alternative: पूर्ण सामाजिक बहिष्कार का स्पष्ट विधान
  rationale: मूल पाठ बोलने और सुनने की भाषा इस्तेमाल करता है; इससे आगे किसी संस्थागत या सम्प्रदायगत व्यवस्था को अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्बोधन में बहुवचन ‘तुम’, और गरिमापूर्ण पर सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘शान्ति’ तथा ‘सुसमाचार’ जैसे परिचित धर्मग्रन्थीय शब्द रखे गए हैं; वाक्य को अनावश्यक रूप से संस्थागत या सम्प्रदाय-विशिष्ट नहीं बनाया गया।
