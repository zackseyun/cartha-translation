review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the reciprocal reproof, its non-angry and peaceable manner, the appeal to the gospel, and the temporal limit "until he repents." Its rendering of ἀκουέτω as the offender hearing "from you" is grammatically preferable to reversing the hearing relationship. A small revision makes the interpersonal force of κατὰ τοῦ ἑτέρου clearer and avoids an imprecise footnote alternative.
  naturalness: The Hindi is generally clear and appropriately dignified. "तुम्हारी ओर से कोई बात न सुने" is more idiomatic and explicit than "तुमसे कुछ न सुने," while retaining the Greek active construction and its unstated object.
  terminology: '"सुधारो," "शान्ति," "सुसमाचार," and "मन फिराए" are suitable modern Hindi biblical-register choices. "किसी दूसरे के विरुद्ध अपराध करे" accurately expresses an offense against another without forcing the more specifically theological term "पाप करे."'
  issues:
  - severity: low
    issue: The footnote's alternative "किसी दूसरे का अपराध करे" is syntactically and semantically ambiguous in Hindi.
    rationale: It may suggest committing another person's crime rather than committing an offense against another person. The Greek κατὰ τοῦ ἑτέρου marks the person against whom the offense is committed.
  - severity: low
    issue: '"वह तुमसे कुछ न सुने" leaves the implicit object overly indefinite.'
    rationale: Although it follows the active Greek ἀκουέτω, "तुम्हारी ओर से कोई बात न सुने" more naturally conveys that no communication is to reach the offender from the community.
