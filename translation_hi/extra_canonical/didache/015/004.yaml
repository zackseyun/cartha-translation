id: DID.15.4
reference: Didache 15:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/004.yaml
  text: But as for your prayers and your alms and all your deeds[a], do them in this way, as you have it in the gospel of our Lord.
translation:
  language: hi
  text: पर तुम्हारी प्रार्थनाएँ, तुम्हारा दान और तुम्हारे सब काम—इन्हें उसी प्रकार करो, जैसा हमारे प्रभु के सुसमाचार में तुम्हें मिला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχὰς
  choice: प्रार्थनाएँ
  rationale: बहुवचन और धार्मिक अभ्यास, दोनों को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλεημοσύνας
  choice: दान
  rationale: यहाँ शब्द विशेष रूप से जरूरतमंदों को दिए जाने वाले दान की ओर संकेत करता है; आधुनिक हिन्दी में ‘दान’ संक्षिप्त और सहज है।
- source_word: πάσας τὰς πράξεις
  choice: तुम्हारे सब काम
  rationale: πράξεις के व्यापक अर्थ को साधारण, वर्तमान हिन्दी में बनाए रखता है।
- source_word: οὕτω ποιήσατε
  choice: इन्हें उसी प्रकार करो
  rationale: आज्ञार्थक भाव को रखता है और पहले रखे गए कर्मों को ‘इन्हें’ द्वारा स्वाभाविक हिन्दी में फिर से ग्रहण करता है।
- source_word: ὡς ἔχετε
  choice: जैसा ... तुम्हें मिला है
  rationale: शाब्दिक ‘जैसा तुम रखते हो’ हिन्दी में अस्वाभाविक है; यह अनुवाद प्राप्त और मान्य निर्देश के भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν
  choice: हमारे प्रभु के सुसमाचार में
  rationale: सम्बन्धवाचक संरचना और ‘हमारे प्रभु’ को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: ‘सुसमाचार’ का आशय लिखित ग्रंथ है या प्रभु की शिक्षा की परंपरा
  choice: सुसमाचार
  alternative: हमारे प्रभु की सुसमाचार-शिक्षा
  rationale: मूल εὐαγγέλιον की सम्भावित व्यापकता को बनाए रखा गया है; किसी निश्चित लिखित ग्रंथ या केवल मौखिक शिक्षा के रूप में अर्थ को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सरल। यूनानी में कर्मों के आरम्भिक प्रमुखीकरण को ‘पर तुम्हारी...—इन्हें’ संरचना से सुरक्षित रखा गया है।
