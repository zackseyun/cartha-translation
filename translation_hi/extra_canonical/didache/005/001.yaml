id: DID.5.1
reference: Didache 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/001.yaml
  text: 'But the way of death is this: first of all, it is evil and full of a curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness;'
translation:
  language: hi
  text: 'परन्तु मृत्यु का मार्ग यह है: सबसे पहले, वह बुरा और शाप से भरा है:[a] हत्याएँ, व्यभिचार, वासनाएँ, यौन अनैतिकताएँ, चोरियाँ, मूर्तिपूजाएँ, जादू-टोने, जादुई क्रियाएँ, लूटपाट, झूठी गवाहियाँ, कपट, दोहरा मन, छल, घमण्ड, दुर्भावना, मनमानी, लोभ, अश्लील बातें, ईर्ष्या, ढिठाई, दर्प और डींग मारना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक शाप से भरा है।”
    reason: ग्रीक κατάρας एकवचन है; मुख्य पाठ की स्वाभाविक हिन्दी के साथ एकवचन-प्रधान वैकल्पिक अनुवाद दर्ज किया गया है।
lexical_decisions:
- source_word: φαρμακεῖαι
  choice: तंत्र-मंत्र
  rationale: इस संदर्भ में यह औषधियों के सामान्य प्रयोग के बजाय जादुई क्रियाओं अथवा मंत्र-औषधि से जुड़ी साधना को सूचित करता है; पास के μαγεῖαι से भेद रखने के लिए अलग किंतु संबंधित पद चुना गया।
- source_word: διπλοκαρδία
  choice: दोहरा मन
  rationale: शाब्दिक रूप से ‘दोहरा-हृदय’; आधुनिक हिन्दी में विभाजित निष्ठा या कपटी अंतर्मन का स्वाभाविक और संक्षिप्त रूप।
- source_word: αὐθάδεια
  choice: मनमानी
  rationale: आत्मतुष्ट, स्वेच्छाचारी और दूसरों की परवाह न करने वाले व्यवहार का बोध कराता है।
- source_word: θρασύτης
  choice: ढिठाई
  rationale: निर्लज्ज दुस्साहस का नकारात्मक भाव सुरक्षित रखता है।
- source_word: ἀλαζονεία
  choice: डींग मारना
  rationale: घमण्डी आत्म-प्रदर्शन या शेखी का व्यवहारिक अर्थ व्यक्त करता है और निकटवर्ती ὕψος से भेद रखता है।
theological_decisions:
- issue: κατάρας μεστή में κατάρας का अर्थ और अनिश्चितता
  choice: शाप से भरा
  alternative: एक शाप से भरा
  rationale: ग्रीक में संज्ञा एकवचन है, पर हिन्दी में बिना अनिश्चयवाचक संख्या के गुण या अवस्था के रूप में ‘शाप से भरा’ अधिक स्वाभाविक है। एकवचन को अधिक स्पष्ट करने वाला विकल्प पादटिप्पणी में सुरक्षित रखा गया।
- issue: ἐπιθυμίαι और πορνεῖαι का संबंध
  choice: वासनाएँ, यौन अनैतिकताएँ
  alternative: लालसाएँ, व्यभिचारपूर्ण कर्म
  rationale: 'दोनों बहुवचन पदों को अलग रखा गया है: पहला भीतर की कामनाओं और दूसरा यौन दुराचारों की व्यापक श्रेणी को व्यक्त करता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की दुर्गुण-सूची और बहुवचन रूप यथासंभव बनाए गए हैं; निकटार्थी यूनानी पदों के बीच हिन्दी में उपलब्ध अर्थ-भेद भी सुरक्षित रखा गया है।
