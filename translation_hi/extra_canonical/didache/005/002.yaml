source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: διῶκται ἀγαθῶν, μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος, οὐ γινώσκοντες μισθὸν δικαιοσύνης, οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ, ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν· ὧν μακρὰν πραΰτης καὶ ὑπομονή, μάταια ἀγαπῶντες, διώκοντες ἀνταπόδομα, οὐκ ἐλεοῦντες πτωχόν, οὐ πονοῦντες ἐπὶ καταπονουμένῳ, οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς, φονεῖς τέκνων, φθορεῖς πλάσματος Θεοῦ, ἀποστρεφόμενοι τὸν δεόμενον, καταπονοῦντες τὸν θλιβόμενον, πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί, πανθαμάρτητοι· ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/002.yaml
  text: persecutors of the good[a], hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far, loving vain things, pursuing repayment, not showing mercy to the poor, not feeling distress for one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God's handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
translation:
  language: hi
  text: भलाई के सतानेवाले, सत्य से घृणा करनेवाले, झूठ से प्रेम करनेवाले, धार्मिकता का प्रतिफल न जाननेवाले, न भलाई से जुड़े रहनेवाले और न धार्मिक न्याय से, भलाई के लिए नहीं बल्कि बुराई के लिए चौकस रहनेवाले; ऐसे लोग, जिनसे नम्रता और धीरज बहुत दूर हैं, व्यर्थ बातों से प्रेम करते और प्रतिदान के पीछे पड़े रहते हैं। वे गरीब पर दया नहीं करते, पीड़ित व्यक्ति के लिए दुःखी नहीं होते[a], अपने रचनेवाले को नहीं जानते, बच्चों के हत्यारे और परमेश्वर की रचना को नष्ट करनेवाले हैं। वे ज़रूरतमंद से मुँह मोड़ते, दुःख उठानेवाले को दबाते, धनवानों के पक्षधर और निर्धनों के अधर्मी न्यायी हैं; वे पूरी तरह पापी हैं। हे बच्चों, तुम इन सब से बचाए जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दूसरा सम्भव अनुवाद: ‘पीड़ित व्यक्ति के लिए परिश्रम नहीं करते।’'
    reason: οὐ πονοῦντες ἐπὶ καταπονουμένῳ में πονέω का मूल अर्थ ‘परिश्रम करना’ भी हो सकता है; लेकिन ἐπί के साथ यहाँ पीड़ित के लिए दुःख या सहानुभूतिपूर्ण व्यथा का अर्थ अधिक उपयुक्त है।
lexical_decisions:
- source_word: διῶκται ἀγαθῶν
  choice: भले लोगों को सतानेवाले
  rationale: ἀγαθῶν यहाँ बहुवचन विशेषण का संज्ञात्मक प्रयोग है; संदर्भ में भले लोगों को सताने का अर्थ सर्वाधिक स्वाभाविक है।
- source_word: μισθὸν δικαιοσύνης
  choice: धार्मिकता का प्रतिफल
  rationale: μισθός पुरस्कार, मजदूरी या प्रतिफल हो सकता है; धार्मिक संदर्भ में ‘प्रतिफल’ अर्थ को व्यापक रखता है।
- source_word: ἀγρυπνοῦντες
  choice: जागते रहनेवाले
  rationale: शाब्दिक जागरूकता/चौकसी के रूपक को बनाए रखा गया है, भले ही हिन्दी में वाक्यांश कुछ असामान्य लगे।
- source_word: ἀνταπόδομα
  choice: प्रतिदान
  rationale: शब्द प्रत्युत्तर में मिलनेवाले भुगतान, प्रतिफल या बदले को सूचित कर सकता है; ‘प्रतिदान’ इस विस्तार को अपेक्षाकृत खुला रखता है।
- source_word: οὐ πονοῦντες ἐπὶ καταπονουμένῳ
  choice: सताए हुए व्यक्ति की दशा पर दुःखी नहीं होते
  rationale: इस रचना में πονέω भावनात्मक दुःख या सहानुभूतिपूर्ण व्यथा व्यक्त करता है और पिछले दया-विषयक वाक्यांश के समानांतर है।
- source_word: πλουσίων παράκλητοι
  choice: धनवानों का पक्ष लेते
  rationale: παράκλητοι यहाँ धनवानों के समर्थक या पक्षधर होने का भाव देता है; हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक है।
- source_word: πανθαμάρτητοι
  choice: हर प्रकार के पाप से भरे
  rationale: दुर्लभ संयुक्त शब्द की व्यापकता—पूरी तरह अथवा हर बात में पापी—को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ῥυσθείητε का विधि/कामना भाव
  choice: तुम इन सब बातों से बचाए जाओ
  alternative: इन सब बातों से बचे रहो
  rationale: यूनानी में यह निष्क्रिय optative है, इसलिए केवल सीधी आज्ञा बनाने के बजाय छुटकारे की कामना और निष्क्रिय भाव को रखा गया है।
- issue: φθορεῖς πλάσματος Θεοῦ
  choice: परमेश्वर की रचना को नष्ट करनेवाले
  alternative: परमेश्वर की गढ़ी हुई कृति को बिगाड़नेवाले
  rationale: πλάσμα रची/गढ़ी हुई वस्तु है और φθορεύς नाश या भ्रष्ट करनेवाला हो सकता है; संदर्भ में तीव्र नैतिक आरोप को रखते हुए किसी विशिष्ट बाद की धर्मसैद्धांतिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। यूनानी की लम्बी दोष-सूची को पठनीयता के लिए कई वाक्यों में बाँटा गया, पर उसके क्रम और संचयी प्रभाव को बनाए रखा गया है। ‘बच्चो’ प्रत्यक्ष संबोधन τέκνα को सहज रूप में व्यक्त करता है।
