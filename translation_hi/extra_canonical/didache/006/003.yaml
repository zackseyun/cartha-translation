id: DID.6.3
reference: Didache 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τῆς βρώσεως, ὃ δύνασαι βάστασον· ἀπὸ δὲ τοῦ εἰδωλοθύτου λίαν πρόσεχε· λατρεία γάρ ἐστι θεῶν νεκρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/003.yaml
  text: And concerning food, bear what you are able; but be very careful about food sacrificed to idols, for it is the worship of dead gods.
translation:
  language: hi
  text: और भोजन के विषय में, जितना तुम सह सको, उतना सहो; लेकिन मूर्तियों को चढ़ाए गए भोजन से बहुत सावधान रहो, क्योंकि यह मरे हुए देवताओं की उपासना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώσεως
  choice: भोजन
  rationale: यह सामान्य रूप से खाने या भोजन के विषय को दर्शाता है; प्रसंग में सहज आधुनिक हिन्दी के लिए ‘भोजन’ उपयुक्त है।
- source_word: ὃ δύνασαι βάστασον
  choice: जितना तुम उठा सको, उठाओ
  rationale: βάστασον का मूल बिंब ‘उठाना/भार सहना’ है। अनुवाद इस रूपक और निर्देश की संक्षिप्तता को बनाए रखता है, बिना यह तय किए कि आशय कठोर आहार-विधि का पालन है या उससे जुड़ा कोई अन्य भार।
- source_word: εἰδωλοθύτου
  choice: मूर्तियों को चढ़ाए गए भोजन
  rationale: यह मूर्तियों को बलि या भेंट किए गए खाद्य पदार्थ को सूचित करता है। ‘भोजन’ को स्पष्ट करने से हिन्दी स्वाभाविक रहती है और पिछले वाक्यांश से संबंध बना रहता है।
- source_word: λίαν πρόσεχε
  choice: बहुत सावधान रहो
  rationale: λίαν तीव्रता दर्शाता है और πρόσεχε सचेत ध्यान या सावधानी का आदेश देता है; यह संयोजन स्वाभाविक हिन्दी में दोनों भाव रखता है।
- source_word: λατρεία
  choice: उपासना
  rationale: शब्द धार्मिक सेवा/पूजा का बोध देता है; यहाँ ‘उपासना’ गरिमापूर्ण और स्पष्ट है।
- source_word: θεῶν νεκρῶν
  choice: मरे हुए देवताओं
  rationale: यूनानी विशेषण νεκρῶν को सीधे बनाए रखा गया है; इसे ‘निर्जीव मूर्तियाँ’ जैसे व्याख्यात्मक रूप में बदलकर कथन का तनाव नहीं मिटाया गया।
theological_decisions:
- issue: ‘मरे हुए देवताओं’ की अभिव्यक्ति
  choice: मरे हुए देवताओं
  alternative: निर्जीव देवताओं / झूठे देवताओं
  rationale: मूल पाठ νεκρῶν (‘मरे हुए’) कहता है। ‘झूठे’ या ‘निर्जीव’ कहना उसकी संभावित धार्मिक व्यंजना की व्याख्या कर देता; प्रत्यक्ष अनुवाद मूल की असामान्य और तनावपूर्ण भाषा को सुरक्षित रखता है।
- issue: आहार-संबंधी भार की सीमा
  choice: जितना तुम उठा सको, उठाओ
  alternative: जितने नियमों का पालन कर सको, करो
  rationale: मूल में नियमों का स्पष्ट उल्लेख नहीं है। रूपक को बनाए रखने से पाठ की वास्तविक अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निर्देशात्मक शैली। ‘तुम’ एकवचन के अनुरूप क्रियाएँ रखी गई हैं। मूल के भार उठाने वाले रूपक और ‘मरे हुए देवताओं’ की तीखी अभिव्यक्ति को जानबूझकर सुरक्षित रखा गया है।
