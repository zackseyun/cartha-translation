review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents βρώσεως, εἰδωλόθυτον, λίαν πρόσεχε, and λατρεία θεῶν νεκρῶν. The imperative βάστασον is retained, but the Hindi phrasing can represent its ‘bear/endure’ sense more naturally without resolving the underlying ambiguity about what dietary burden is intended.
  naturalness: ‘जितना तुम उठा सको, उठाओ’ is understandable but slightly elliptical and physical-sounding in modern Hindi, especially with no stated object. ‘जितना तुम सह सको, उतना सहो’ is idiomatic while preserving the source’s open-ended command to bear what one is able.
  terminology: ‘मूर्तियों को चढ़ाए गए भोजन,’ ‘उपासना,’ and ‘मरे हुए देवताओं’ are suitable. The last phrase deliberately preserves the Greek’s striking wording rather than paraphrasing it as ‘false’ or ‘lifeless’ gods.
  issues:
  - severity: low
    issue: The rendering of ὃ δύνασαι βάστασον is somewhat awkward in Hindi.
    rationale: The repeated ‘उठा’ leaves the object unexpressed and can sound overly literal. A shift to ‘सह सको/सहो’ conveys ‘bear’ naturally without specifying that the burden consists of rules or restrictions.
