source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὅρα μή τις σε πλανήσῃ ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς, ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/001.yaml
  text: See that no one leads you astray from this way of the teaching, since he teaches you apart from God.
translation:
  language: hi
  text: सावधान रहो कि कोई तुम्हें शिक्षा के इस मार्ग से भटका न दे, क्योंकि वह तुम्हें परमेश्वर से अलग होकर शिक्षा देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅρα μή τις σε πλανήσῃ
  choice: सावधान रहो कि कोई तुम्हें ... भटका न दे
  rationale: ὅρα μή चेतावनी व्यक्त करता है, और πλανάω का अर्थ मार्ग से भटकाना या बहकाना है; यह रूप हिन्दी में स्वाभाविक रहते हुए मूल रूपक बनाए रखता है।
- source_word: ταύτης τῆς ὁδοῦ τῆς διδαχῆς
  choice: शिक्षा के इस मार्ग से
  rationale: यह अनुवाद ὁδός के ‘मार्ग’ रूपक और διδαχή के ‘शिक्षा’ अर्थ—दोनों को बनाए रखता है।
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह पहले दिए गए निषेध का कारण प्रस्तुत करता है।
- source_word: παρεκτὸς Θεοῦ
  choice: परमेश्वर से अलग होकर
  rationale: παρεκτός का मूल भाव ‘से बाहर/अलग’ है। यह चुनाव जानबूझकर उस अस्पष्टता को बनाए रखता है कि शिक्षा परमेश्वर से स्वतंत्र है, उनकी ओर से नहीं है, या उनके मार्ग से बाहर है।
- source_word: σε διδάσκει
  choice: वह तुम्हें ... शिक्षा देता है
  rationale: एकवचन क्रिया का कर्ता प्रसंगगत ‘कोई’ है; इसलिए हिन्दी में ‘वह’ स्पष्ट किया गया है।
theological_decisions:
- issue: παρεκτὸς Θεοῦ का धार्मिक आशय
  choice: परमेश्वर से अलग होकर
  alternative: परमेश्वर के विरुद्ध / परमेश्वर के बिना / परमेश्वर की ओर से नहीं
  rationale: यूनानी वाक्यांश संबंध-विच्छेद या परमेश्वर के दायरे से बाहर होने को दर्शाता है, पर यह ठीक-ठीक नहीं बताता कि आशय विरोध, स्रोत की अनुपस्थिति या स्वतंत्रता में से कौन-सा है। इसलिए किसी एक धार्मिक व्याख्या को निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, चेतावनीपूर्ण और गरिमापूर्ण शैली। ‘मार्ग’ का मूल रूपक तथा ‘शिक्षा’ की पुनरावृत्ति अर्थगत स्पष्टता के लिए सुरक्षित रखी गई है।
