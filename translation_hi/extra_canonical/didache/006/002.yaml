id: DID.6.2
reference: Didache 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/002.yaml
  text: For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can.
translation:
  language: hi
  text: क्योंकि यदि तुम प्रभु का पूरा जूआ उठा सकते हो, तो तुम सिद्ध होगे; पर यदि नहीं उठा सकते, तो जितना तुमसे हो सके, उतना करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάσαι
  choice: उठा सकते हो
  rationale: यह क्रिया बोझ उठाने या ढोने का भाव देती है; ‘जूआ उठाना’ हिन्दी में रूपक को स्वाभाविक रखते हुए मूल अर्थ सुरक्षित रखता है।
- source_word: ὅλον τὸν ζυγὸν τοῦ Κυρίου
  choice: प्रभु का पूरा जूआ
  rationale: ‘जूआ’ मूल कृषि-रूपक और उसके अधीनता तथा दायित्व के भाव को बनाए रखता है; ὅλον का स्पष्ट अनुवाद ‘पूरा’ है।
- source_word: τέλειος
  choice: सिद्ध
  rationale: यहाँ शब्द पूर्णता अथवा परिपक्वता का भाव रखता है। ‘सिद्ध’ संक्षिप्त, प्रतिष्ठित और धार्मिक सन्दर्भ में स्वाभाविक है, जबकि पद स्वयं दोनों छायाओं में भेद नहीं करता।
- source_word: ὃ δύνῃ τοῦτο ποίει
  choice: जितना तुमसे हो सके, उतना करो
  rationale: शाब्दिक संरचना ‘जो तुम कर सकते हो, वही करो’ है; चुनी हुई हिन्दी सामर्थ्य की सीमा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: ‘प्रभु का पूरा जूआ’ किस विशेष आचरण या व्यवस्था को सूचित करता है
  choice: रूपक को बिना व्याख्यात्मक विस्तार के यथावत रखा गया
  alternative: इसे किसी विशिष्ट धार्मिक व्यवस्था, तपस्या या आज्ञाओं के समूह के रूप में स्पष्ट करना
  rationale: यूनानी पद स्वयं जूए की सटीक परिधि निर्धारित नहीं करता; किसी विशेष परम्परागत अर्थ को पाठ में जोड़ना मूल की वास्तविक खुली प्रकृति को समाप्त कर देता।
- issue: τέλειος में पूर्णता और परिपक्वता का तनाव
  choice: ‘सिद्ध’
  alternative: ‘परिपूर्ण’ या ‘परिपक्व’
  rationale: ‘सिद्ध’ नैतिक-आध्यात्मिक पूर्णता का भाव बनाए रखता है और केवल मनोवैज्ञानिक परिपक्वता तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। एकवचन द्वितीय पुरुष के लिए ‘तुम’ मूल के निकट और सामान्य पाठक के लिए स्वाभाविक है। मूल में कोई पाठगत टिप्पणी आवश्यक न होने के कारण पादटिप्पणी नहीं जोड़ी गई।
