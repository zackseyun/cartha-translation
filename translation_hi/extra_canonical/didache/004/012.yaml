  text: You shall hate all hypocrisy and everything that is not pleasing to the Lord.
translation:
  language: hi
  text: तुम हर प्रकार के कपट से और हर उस बात से घृणा करना जो प्रभु को प्रसन्न नहीं करती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μισήσεις
  choice: घृणा करना
  rationale: ग्रीक भविष्यत् रूप यहाँ आज्ञार्थक बल रखता है; हिंदी में स्वाभाविक निर्देशात्मक शैली के लिए क्रियामूल के साथ ‘करना’ रखा गया है।
- source_word: πᾶσαν ὑπόκρισιν
  choice: हर प्रकार के कपट से
  rationale: ὑπόκρισις दिखावे, ढोंग या कपट को सूचित करता है; ‘हर प्रकार के कपट’ πᾶσαν की व्यापकता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πᾶν ὃ μὴ ἀρεστὸν τῷ Κυρίῳ
  choice: हर उस बात से … जो प्रभु को प्रसन्न नहीं करती
  rationale: ग्रीक नपुंसकलिंग πᾶν ὃ व्यापक अर्थ में ‘हर वह वस्तु/बात जो’ है; ‘हर उस बात’ आधुनिक हिंदी में इसकी समावेशी व्यापकता बनाए रखता है।
- source_word: τῷ Κυρίῳ
  choice: प्रभु को
  rationale: अर्थगत कर्ता/संबंध को हिंदी में ‘को’ के द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ‘जो प्रभु को प्रसन्न नहीं करता’ का दायरा
  choice: हर उस बात से घृणा करना जो प्रभु को प्रसन्न नहीं करती
  alternative: हर उस चीज़ से घृणा करना जो प्रभु को स्वीकार्य नहीं है
  rationale: मूल पाठ जानबूझकर व्यापक है; अनुवाद किसी विशिष्ट पाप-सूची या सांप्रदायिक नैतिक व्याख्या तक इसका दायरा सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और निर्देशात्मक शैली। ‘कपट’ सामान्य पाठक के लिए बोधगम्य है और मूल के नैतिक आशय को बनाए रखता है।
