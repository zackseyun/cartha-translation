revisions:
- from: सभा में अपने अपराधों को स्वीकार करना, और बुरे विवेक के साथ प्रार्थना करने न आना। यही जीवन का मार्ग है।
  to: सभा में अपने अपराधों को स्वीकार करो, और बुरे विवेक के साथ प्रार्थना करने मत आओ। यही जीवन का मार्ग है।
  rationale: The revision changes only the Hindi directive forms to natural, parallel imperatives. It preserves the source’s ambiguity concerning the manner and recipient of confession, retains the non-possessive sense of ‘to prayer,’ and makes no doctrinal addition.
