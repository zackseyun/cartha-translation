id: DID.4.14
reference: Didache 4:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν ἐκκλησίᾳ ἐξομολογήσῃ τὰ παραπτώματά σου, καὶ οὐ προσελεύσῃ ἐπὶ προσευχήν σου ἐν συνειδήσει πονηρᾷ. Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/014.yaml
  text: In the assembly you shall confess your transgressions, and you shall not come to prayer with an evil conscience. This is the way of life.
translation:
  language: hi
  text: सभा में अपने अपराधों को स्वीकार करो, और बुरे विवेक के साथ प्रार्थना करने मत आओ। यही जीवन का मार्ग है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: सभा में
  rationale: यहाँ ἐκκλησία एकत्र समुदाय या सभा को दर्शाता है; ‘सभा’ आरंभिक सामुदायिक संदर्भ को सहज और संप्रदाय-निरपेक्ष ढंग से व्यक्त करता है।
- source_word: ἐξομολογήσῃ
  choice: स्वीकार करना
  rationale: क्रिया का अर्थ खुले रूप से मान लेना या अंगीकार करना है; अपराधों के संदर्भ में ‘स्वीकार करना’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: παραπτώματά
  choice: अपराधों
  rationale: παράπτωμα नैतिक चूक, उल्लंघन या अपराध को सूचित करता है; ‘अपराध’ इसकी गंभीरता बनाए रखता है, जबकि इसे केवल अनजानी ‘गलतियों’ तक सीमित नहीं करता।
- source_word: ἐπὶ προσευχήν
  choice: प्रार्थना करने
  rationale: वाक्यांश का आशय प्रार्थना के लिए आने से है। हिन्दी में ‘प्रार्थना करने आना’ अधिक स्वाभाविक है और पाठ में अनुपस्थित स्वत्वसूचक ‘अपनी’ नहीं जोड़ता।
- source_word: ἐν συνειδήσει πονηρᾷ
  choice: बुरे विवेक के साथ
  rationale: यह συνείδησις के नैतिक अंतःबोध और πονηρός के नकारात्मक मूल्यांकन को सीधे बनाए रखता है।
- source_word: ἡ ὁδὸς τῆς ζωῆς
  choice: जीवन का मार्ग
  rationale: दिदाखे की ‘दो मार्ग’ संरचना से जुड़ी स्थिर और पारदर्शी अभिव्यक्ति।
theological_decisions:
- issue: स्वीकारोक्ति का स्वरूप
  choice: किसके सामने या किस विधि से स्वीकार करना है, इसे अनिर्धारित रखा गया है।
  alternative: इसे किसी विशिष्ट संस्कार, पदाधिकारी या केवल निजी स्वीकारोक्ति के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ केवल सभा के भीतर अपराध स्वीकार करने की बात कहता है; वह कोई विशिष्ट विधि या अधिकारी निर्धारित नहीं करता।
- issue: ‘बुरा विवेक’ का अर्थ
  choice: मूल नैतिक तनाव को ‘बुरे विवेक’ के रूप में बनाए रखा गया है।
  alternative: ‘दोषी मन’, ‘अशुद्ध अंतःकरण’ या ‘मन में अपराध-बोध’ कहना।
  rationale: ये विकल्प अर्थ को दोषबोध या अनुष्ठानिक अशुद्धता की ओर संकुचित कर सकते हैं, जबकि मूल अभिव्यक्ति अधिक व्यापक है।
- issue: आज्ञार्थक बल
  choice: समांतर निषेधात्मक निर्देशों के रूप में ‘करना’ और ‘न आना’ रखा गया है।
  alternative: ‘तुम ... स्वीकार करोगे’ और ‘तुम ... नहीं आओगे’ जैसा शब्दशः भविष्यकालीन रूप।
  rationale: इस अनुच्छेद में यूनानी भविष्यकाल निर्देश/आज्ञा का बल रखता है; हिन्दी कृदंतात्मक निर्देश उस बल को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक शिक्षोपदेश के अनुरूप रखी गई है। ‘कलीसिया’ के बजाय ‘सभा’ चुना गया है ताकि ἐκκλησία का एकत्र समुदाय वाला अर्थ स्पष्ट और व्यापक रहे। कोई पाद-टिप्पणी आवश्यक नहीं है।
