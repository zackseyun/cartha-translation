review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents all major Greek elements: the communal setting (ἐν ἐκκλησίᾳ), confession of transgressions, the prohibition on coming to prayer with an evil conscience, and the concluding ‘way of life.’ It appropriately avoids specifying a confessor, rite, or ecclesiastical office. ‘सभा’ is a defensible, non-denominational rendering of ἐκκλησία in this early communal context.'
  naturalness: The infinitival instruction style (‘स्वीकार करना … न आना’) is comprehensible, but direct imperatives are more natural and forceful in modern Hindi for the Greek future imperatives. ‘प्रार्थना करने मत आओ’ clearly retains ‘come to prayer’ without adding a possessive.
  terminology: ‘अपराध’ suitably conveys παραπτώματα without reducing it to accidental mistakes. ‘बुरे विवेक’ preserves the broad moral force of συνειδήσει πονηρᾷ and avoids narrowing it to subjective guilt or ritual impurity. ‘जीवन का मार्ग’ is clear and consistent with the Didache’s two-ways framework.
  issues:
  - severity: low
    issue: Instructional verb forms are somewhat bookish/less direct.
    rationale: The Greek uses future forms with imperative force. In modern Hindi, ‘स्वीकार करो’ and ‘मत आओ’ convey this parallel exhortatory force more naturally than bare infinitives.
  revised_text: सभा में अपने अपराधों को स्वीकार करो, और बुरे विवेक के साथ प्रार्थना करने मत आओ। यही जीवन का मार्ग है।
  revised_footnotes: []
  revision_rationale: The revision changes only the Hindi directive forms to natural, parallel imperatives. It preserves the source’s ambiguity concerning the manner and recipient of confession, retains the non-possessive sense of ‘to prayer,’ and makes no doctrinal addition.
