  yaml_path: translation/extra_canonical/didache/004/002.yaml
  text: And you shall seek out day by day the presence of the saints, so that you may find rest in their words.
translation:
  language: hi
  text: और पवित्र जनों को प्रतिदिन ढूँढ़ा कर, ताकि तू उनकी बातों में विश्राम पाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκζητήσεις
  choice: खोजा कर
  rationale: यह रूप सतत और प्रयत्नपूर्वक खोजने का निर्देश देता है; ‘खोजा कर’ प्रतिदिन दोहराए जाने वाले आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ πρόσωπα
  choice: संगति
  rationale: शाब्दिक अर्थ ‘चेहरे’ है, पर यहाँ आशय पवित्र जनों की व्यक्तिगत उपस्थिति और साहचर्य को खोजने से है; ‘संगति’ हिन्दी में वही व्यावहारिक अर्थ सहज रूप से देता है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों
  rationale: ‘पवित्र जन’ मूल विशेषण के संज्ञात्मक प्रयोग को स्पष्ट रखता है और बाद के तकनीकी या सांप्रदायिक अर्थों को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ἐπαναπαῇ
  choice: विश्राम पाए
  rationale: मूल क्रिया किसी वस्तु पर टिककर विश्राम या ताज़गी पाने का भाव रखती है; यह चयन उस रूपक को बनाए रखता है।
- source_word: τοῖς λόγοις αὐτῶν
  choice: उनकी बातों में
  rationale: λόγοις यहाँ पवित्र जनों के बोले हुए वचनों या शिक्षाप्रद बातों को दर्शाता है; ‘बातों’ सामान्य आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘में’ उन बातों के भीतर विश्राम पाने के रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: पवित्र जनों
  alternative: संतों
  rationale: पाठ यह निश्चित नहीं करता कि यह कोई औपचारिक उपाधि या बाद में मान्य घोषित विशेष वर्ग है। ‘पवित्र जनों’ मूल की व्यापकता बनाए रखता है।
- issue: उनके शब्दों से संबंध
  choice: उनकी बातों में विश्राम पाए
  alternative: उनकी बातों पर भरोसा करे
  rationale: मूल में ‘विश्राम पाने’ की भाषा है, केवल विश्वास या आज्ञापालन की नहीं; इसलिए रूपक और उसकी संभावित आध्यात्मिक गहराई को बिना व्याख्यात्मक विस्तार के रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन अनौपचारिक निर्देशात्मक शैली के लिए ‘तू’ रखा गया है, जो दिदाखे के गुरु-से-शिष्य संबोधन के अनुरूप है।
