id: DID.4.8
reference: Didache 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀποστραφήσῃ τὸν ἐνδεόμενον, συγκοινωνήσεις δὲ πάντα τῷ ἀδελφῷ σου καὶ οὐκ ἐρεῖς ἴδια εἶναι· εἰ γὰρ ἐν τῷ ἀθανάτῳ κοινωνοί ἐστε, πόσῳ μᾶλλον ἐν τοῖς θνητοῖς;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
translation:
  language: hi
  text: तुम ज़रूरतमंद व्यक्ति को न ठुकराना, बल्कि अपने भाई के साथ सब कुछ साझा करना और यह न कहना कि वे तुम्हारी अपनी चीज़ें हैं; क्योंकि यदि तुम उसमें सहभागी हो जो अमर है, तो नश्वर वस्तुओं में और कितना बढ़कर सहभागी होना चाहिए?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήσῃ
  choice: मुँह न मोड़ना
  rationale: यह प्रत्यक्ष कर्म के साथ आए यूनानी क्रियापद का स्वाभाविक हिन्दी रूप है और ज़रूरतमंद को अस्वीकार करने का भाव व्यक्त करता है।
- source_word: συγκοινωνήσεις
  choice: साझा करना
  rationale: यह साथ मिलकर भाग लेने अथवा अपनी वस्तुएँ बाँटने के भाव को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ ἀδελφῷ σου
  choice: अपने भाई के साथ
  rationale: मूल पाठ के पारिवारिक-सामुदायिक संबोधन को बिना विस्तार किए बनाए रखता है।
- source_word: ἴδια
  choice: तुम्हारी अपनी
  rationale: निजी स्वामित्व के दावे का भाव स्पष्ट करता है; संदर्भ के कारण ‘चीज़ें’ वाक्य में व्यक्त की गई हैं।
- source_word: τῷ ἀθανάτῳ
  choice: उसमें जो अमर है
  rationale: एकवचन अमूर्त यूनानी अभिव्यक्ति की अस्पष्टता बनाए रखता है और उसे किसी विशिष्ट धार्मिक वस्तु या वरदान तक सीमित नहीं करता।
- source_word: τοῖς θνητοῖς
  choice: नश्वर वस्तुओं में
  rationale: बहुवचन और अमर-नश्वर विरोध को बनाए रखता है; यहाँ सांसारिक अथवा नाशवान वस्तुओं का व्यापक अर्थ खुला रहता है।
theological_decisions:
- issue: ‘जो अमर है’ की पहचान
  choice: उसमें जो अमर है
  alternative: अमर जीवन / आत्मिक वरदानों में
  rationale: मूल यूनानी किसी विशिष्ट पहचान को स्पष्ट नहीं करता; इसलिए अनुवाद संभावित धार्मिक अर्थों में से किसी एक को निर्णायक नहीं बनाता।
- issue: संपत्ति साझा करने की सीमा
  choice: सब कुछ साझा करना
  alternative: अपनी सारी संपत्ति दे देना
  rationale: πάντα व्यापक है, पर पाठ अनिवार्य रूप से स्वामित्व के पूर्ण त्याग की तकनीकी व्यवस्था नहीं बताता; ‘साझा करना’ मूल के सहभागिता-भाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली रखी गई है। ‘तुम’ मूल के एकवचन दूसरे पुरुष संबोधन के अनुरूप है। अंतिम अलंकारिक प्रश्न को स्वाभाविक हिन्दी बनाने के लिए ‘सहभागी होना चाहिए’ स्पष्ट किया गया है, जो यूनानी में निहित तुलना को व्यक्त करता है।
