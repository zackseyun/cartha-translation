  text: You shall not be double-minded whether it will be or not[a].
translation:
  language: hi
  text: तुम इस दुविधा में मत पड़ना कि वह होगा या नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχήσεις
  choice: दुविधा में पड़ना
  rationale: διψυχέω का शाब्दिक बिंब ‘दो मन वाला होना’ है, पर यहाँ πότερον…ἢ οὔ के साथ इसका स्वाभाविक अर्थ अनिश्चित होकर डाँवाडोल होना है। ‘दुविधा में पड़ना’ इस भाव को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: πότερον ἔσται ἢ οὔ
  choice: कि वह होगा या नहीं
  rationale: यूनानी अप्रत्यक्ष द्विविकल्पी प्रश्न को निकटता से रखता है। ἔσται का कर्ता प्रसंग में अनिर्दिष्ट है, इसलिए हिन्दी में ‘वह’ रखकर मूल की अस्पष्टता बनाए रखी गई है।
theological_decisions:
- issue: ἔσται के अनिर्दिष्ट कर्ता या आशय की पहचान
  choice: ‘वह होगा या नहीं’—आशय को अनिर्दिष्ट रखा गया
  alternative: इसे परमेश्वर के न्याय, प्रतिफल, या किसी प्रतिज्ञा के पूरा होने के रूप में स्पष्ट करना
  rationale: इस छोटे वाक्य में ἔσται का कर्ता नहीं दिया गया है। किसी विशेष धर्मवैचारिक संदर्भ को जोड़ना मूल पाठ की वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; निषेधात्मक उपदेश के लिए सहज किंतु गरिमापूर्ण ‘मत पड़ना’ का प्रयोग। ‘दो मन का मत होना’ अधिक शाब्दिक होता, पर वर्तमान हिन्दी में इस वाक्य-संरचना के साथ अस्वाभाविक और कम स्पष्ट लगता।
