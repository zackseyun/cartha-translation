source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας, πρὸς δὲ τὸ δοῦναι συσπῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/005.yaml
  text: Do not be one who stretches out his hands to receive[a], but draws them in to avoid giving.
translation:
  language: hi
  text: लेने के लिए अपने हाथ फैलानेवाले, पर देने के लिए उन्हें समेट लेनेवाले मत बनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνου
  choice: मत बनो
  rationale: निषेधात्मक आज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας
  choice: लेने के लिए अपने हाथ फैलानेवाले
  rationale: हाथ फैलाने की मूल देहात्मक छवि और ग्रहण करने का उद्देश्य दोनों सुरक्षित रखे गए हैं।
- source_word: πρὸς δὲ τὸ δοῦναι συσπῶν
  choice: पर देने के लिए उन्हें समेट लेनेवाले
  rationale: συσπῶν का मूल अर्थ हाथों को भीतर खींचना/समेटना है; हिन्दी में यह देने से पीछे हटने का निहित भाव स्वाभाविक रूप से व्यक्त करता है, बिना मूल में अनुपस्थित 'बचने' को स्पष्ट रूप से जोड़ने के।
theological_decisions:
- issue: उदारता और लोभ के बीच नैतिक विरोध
  choice: लेते समय हाथ फैलाने और देते समय उन्हें समेट लेने की समानांतर छवि बनाए रखी
  alternative: ‘लेने को तत्पर, पर देने से बचनेवाले मत बनो’
  rationale: वैकल्पिक रूप अर्थ स्पष्ट करता है, पर मूल यूनानी की ठोस और स्मरणीय शारीरिक छवि को कम कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, उपदेशात्मक और मौखिक शिक्षण के अनुकूल। ‘फैलानेवाले/समेट लेनेवाले’ का समानांतर विन्यास यूनानी वाक्य की तीखी विरोधात्मक लय बनाए रखता है।
