source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιτάξεις δούλῳ σου ἢ παιδίσκῃ, τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν, ἐν πικρίᾳ σου, μήποτε οὐ μὴ φοβηθήσονται τὸν ἐπ᾽ ἀμφοτέροις Θεόν· οὐ γὰρ ἔρχεται κατὰ πρόσωπον καλέσαι, ἀλλ᾽ ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/010.yaml
  text: You shall not[a], in your bitterness, command your servant or female servant who hope in the same God, lest they should fail to fear the God who is over both; for he does not come to call according to outward standing, but upon those whom the Spirit has prepared.
translation:
  language: hi
  text: तुम अपने दास या दासी को, जो उसी परमेश्वर पर आशा रखते हों, अपनी कटुता में आदेश न देना,[a] कहीं ऐसा न हो कि वे उस परमेश्वर का भय न मानें जो तुम दोनों का परमेश्वर है; क्योंकि वह किसी की बाहरी हैसियत देखकर बुलाने नहीं आता, बल्कि उन्हें बुलाता है जिन्हें आत्मा ने तैयार किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तुम अपने दास या दासी को—जो उसी परमेश्वर पर आशा रखते हों—अपनी कटुता में आदेश न देना।”'
    reason: यूनानी पदक्रम में ‘अपनी कटुता में’ संबंधवाचक पदबंध के बाद आता है; यह वैकल्पिक हिन्दी क्रम उस स्थिति को अधिक निकटता से दर्शाता है।
lexical_decisions:
- source_word: δοῦλος / παιδίσκη
  choice: दास / दासी
  rationale: ये शब्द प्राचीन दासत्व और अधीन घरेलू स्थिति को व्यक्त करते हैं; आधुनिक अर्थ को नरम करके केवल ‘सेवक’ कहना ऐतिहासिक सामाजिक संबंध को अस्पष्ट कर सकता है।
- source_word: ἐν πικρίᾳ σου
  choice: कड़वाहट से
  rationale: यह आदेश देने के ढंग या मनोभाव को बताता है; सहज हिन्दी में क्रिया के साथ रखा गया है।
- source_word: ἐλπίζουσιν
  choice: आशा रखते हैं
  rationale: परमेश्वर पर भरोसे और आशाभरी निर्भरता—दोनों का संकेत बनाए रखता है।
- source_word: κατὰ πρόσωπον
  choice: बाहरी पद देखकर
  rationale: शाब्दिक ‘मुख के अनुसार’ यहाँ व्यक्ति की दिखाई देने वाली सामाजिक हैसियत या प्रतिष्ठा के आधार पर व्यवहार करने का मुहावरा है।
- source_word: ἐφ᾽ οὓς
  choice: उन्हें
  rationale: ग्रीक में ‘जिन पर’ है, पर καλέσαι के साथ हिन्दी में ‘उन्हें बुलाता है’ स्वाभाविक है; आत्मा की तैयारी का आशय सुरक्षित रहता है।
theological_decisions:
- issue: μήποτε οὐ μὴ φοβηθήσονται में प्रबल निषेध
  choice: कहीं ऐसा न हो कि वे ... भय मानना छोड़ दें
  alternative: कहीं वे ... का भय न मानें
  rationale: οὐ μή का असामान्य संयोजन परिणामस्वरूप परमेश्वर का भय समाप्त होने या विफल होने की प्रबल आशंका व्यक्त करता है; चयनित हिन्दी इसे सहज रूप में दर्शाती है।
- issue: κατὰ πρόσωπον का अर्थ
  choice: बाहरी पद देखकर
  alternative: पक्षपात के अनुसार / मुख देखकर
  rationale: संदर्भ स्वामी और दास की साझा ईश्वरीय स्थिति का है। ‘बाहरी पद’ सामाजिक हैसियत की विषमता को व्यक्त करता है, जबकि परमेश्वर द्वारा बुलाए जाने में उसका निर्णायक न होना भी बनाए रखता है।
- issue: τὸ πνεῦμα की पहचान
  choice: आत्मा
  alternative: आत्मा/मनुष्य की आत्मा
  rationale: लेख के साथ आया ‘आत्मा’ सम्भवतः पवित्र आत्मा को सूचित करता है, पर स्रोत इसे स्पष्ट रूप से ‘पवित्र’ नहीं कहता; इसलिए मूल की संक्षिप्तता और संभावित अस्पष्टता रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। एकवचन संबोधन के लिए ‘तुम’ रखा गया है। ऐतिहासिक सामाजिक यथार्थ बनाए रखने हेतु ‘दास/दासी’ प्रयुक्त हैं; भाषा उस व्यवस्था का समर्थन नहीं करती।
