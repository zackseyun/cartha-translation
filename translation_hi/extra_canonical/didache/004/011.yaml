id: DID.4.11
reference: Didache 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὑμεῖς δὲ οἱ δοῦλοι ὑποτάγησεθε τοῖς κυρίοις ὑμῶν ὡς τύπῳ Θεοῦ ἐν αἰσχύνῃ καὶ φόβῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/011.yaml
  text: But you servants shall be subject to your masters as to a representative of God[a], in reverence and fear.
translation:
  language: hi
  text: पर तुम जो दास हो, अपने स्वामियों के अधीन रहो, मानो वे परमेश्वर के प्रतिनिधि[a] हों, लज्जा और भय के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के प्रतिरूप।”
    reason: τύπος का अर्थ प्रतिनिधि, आकृति, नमूना या प्रतिरूप हो सकता है; वैकल्पिक अनुवाद वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: δοῦλοι
  choice: दास
  rationale: यह यूनानी शब्द उस समय की दासता और स्वामित्व की सामाजिक स्थिति को सीधे व्यक्त करता है; ‘सेवक’ कहने से उसका कठोर ऐतिहासिक अर्थ हल्का पड़ सकता है।
- source_word: ὑποτάγησεθε
  choice: अधीन ऐसे रहो
  rationale: यह पाठ का भविष्यत्-रूप है, पर उपदेशात्मक प्रसंग में आज्ञासूचक बल रखता है; हिन्दी में यह स्वाभाविक निर्देशात्मक अभिव्यक्ति है।
- source_word: κυρίοις
  choice: स्वामियों
  rationale: दासों के संदर्भ में यह उनके मानवीय मालिकों या स्वामियों को सूचित करता है।
- source_word: τύπῳ Θεοῦ
  choice: परमेश्वर के प्रतिनिधि
  rationale: व्यक्ति के विषय में τύπος यहाँ ऐसी प्रतिरूपात्मक आकृति को सूचित कर सकता है जो किसी दूसरे के स्थान या अधिकार का दृश्य प्रतिनिधित्व करे; फिर भी ‘प्रतिरूप’ का अर्थ संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν αἰσχύνῃ καὶ φόβῳ
  choice: संकोच और भय के साथ
  rationale: αἰσχύνη का मूल भाव लज्जा, संकोच या लज्जाशील आदर है; ‘संकोच’ यहाँ केवल सामान्य ‘श्रद्धा’ की अपेक्षा स्रोत की असहज भाव-छाया को अधिक सुरक्षित रखता है। φόβος को सीधे ‘भय’ रखा गया है।
theological_decisions:
- issue: स्वामी को ‘परमेश्वर का τύπος’ कहने का आशय
  choice: प्रतिनिधि
  alternative: प्रतिरूप
  rationale: ‘प्रतिनिधि’ प्रसंग में अधिकार की दृश्य आकृति का आशय सहज बनाता है, जबकि पादटिप्पणी संभावित ‘प्रतिरूप’ अर्थ को बनाए रखती है। यह अनुवाद स्वामी को परमेश्वर के समान नहीं ठहराता।
- issue: दासता संबंधी कथन का स्वरूप
  choice: ऐतिहासिक पाठ के निर्देश को बिना अनुमोदनात्मक विस्तार के सीधे प्रस्तुत किया गया
  alternative: दासता की निंदा या समर्थन को मुख्य पाठ में स्पष्ट करना
  rationale: मूल वचन अधीनता का निर्देश देता है, पर यहाँ संस्था की नैतिक वैधता पर अलग से कथन नहीं करता; अनुवाद को वह निष्कर्ष जोड़ना नहीं चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘दास’ ऐतिहासिक स्थिति को छिपाता नहीं; ‘संकोच और भय’ यूनानी के दोनों भावात्मक पदों को अलग रखता है।
