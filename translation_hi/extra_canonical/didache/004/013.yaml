  text: Οὐ μὴ ἐγκαταλίπῃς ἐντολὰς Κυρίου, φυλάξεις δὲ ἃ παρέλαβες, μήτε προστιθεὶς μήτε ἀφαιρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/013.yaml
  text: You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away.
translation:
  language: hi
  text: तुम प्रभु की आज्ञाओं को कभी न छोड़ना, बल्कि जो तुमने प्राप्त किया है, उसे सुरक्षित रखना—न उसमें कुछ जोड़ना, न उसमें से कुछ घटाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ ἐγκαταλίπῃς
  choice: कभी न छोड़ना
  rationale: οὐ μή के प्रबल निषेध और ἐγκαταλείπω के ‘त्याग देना/छोड़ देना’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐντολὰς Κυρίου
  choice: प्रभु की आज्ञाओं
  rationale: ‘आज्ञाएँ’ ἐντολάς का सीधा और धार्मिक संदर्भ में प्रचलित हिन्दी समतुल्य है; Κυρίου को बिना अनावश्यक व्याख्या के ‘प्रभु’ रखा गया है।
- source_word: φυλάξεις
  choice: पालन करना
  rationale: φυλάσσω यहाँ केवल सुरक्षित रखने के बजाय प्राप्त शिक्षा को मानने और निभाने का भाव रखता है।
- source_word: ἃ παρέλαβες
  choice: जो कुछ तुमने ग्रहण किया है
  rationale: παραλαμβάνω की प्राप्त परंपरा या शिक्षा को स्वीकार करने की व्यापकता बनाए रखता है, बिना उसका आशय किसी विशेष वस्तु तक सीमित किए।
- source_word: μήτε προστιθεὶς μήτε ἀφαιρῶν
  choice: न उसमें कुछ जोड़ना, न उसमें से कुछ घटाना
  rationale: दोनों वर्तमान कृदंतों की समानांतर निषेधात्मक रचना और जोड़ने-घटाने का स्पष्ट विरोध सुरक्षित रहता है।
theological_decisions:
- issue: ‘जो कुछ तुमने ग्रहण किया है’ का आशय
  choice: आशय को सामान्य रखा गया है
  alternative: इसे स्पष्ट रूप से ‘शिक्षा’, ‘परंपरा’ या ‘आज्ञाएँ’ कहना
  rationale: यूनानी ἃ का पूर्वपद स्पष्ट नहीं करता; इसलिए मूल की संभावित व्यापकता और अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा उपदेशात्मक रूप। एकवचन ‘तुम’ मूल यूनानी के द्वितीय पुरुष एकवचन को दर्शाता है। ‘कभी न’ प्रबल निषेध को और ‘बल्कि’ δέ के विरोधात्मक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
