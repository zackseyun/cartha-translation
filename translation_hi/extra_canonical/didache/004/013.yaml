revisions:
- from: तुम प्रभु की आज्ञाओं को कभी न छोड़ना, बल्कि जो कुछ तुमने ग्रहण किया है उसका पालन करना—न उसमें कुछ जोड़ना, न उसमें से कुछ घटाना।
  to: तुम प्रभु की आज्ञाओं को कभी न छोड़ना, बल्कि जो तुमने प्राप्त किया है, उसे सुरक्षित रखना—न उसमें कुछ जोड़ना, न उसमें से कुछ घटाना।
  rationale: The revision preserves the Greek's emphatic prohibition, contrastive δέ, and deliberately unspecified relative object ἃ. ‘उसे सुरक्षित रखना’ reflects φυλάσσω in the context of not adding to or taking away from what was received, while avoiding an interpretive decision that the object must be a particular body of teaching or the commandments alone.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T16:31:27Z'
review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the emphatic prohibition (Οὐ μὴ), the Lord's commandments, and the prohibition against addition or removal. However, ‘जो कुछ तुमने ग्रहण किया है उसका पालन करना’ is less idiomatic and slightly narrows φυλάξεις toward obeying; in context, where adding to or taking away from the received matter is immediately prohibited, ‘उसे सुरक्षित रखना’ better preserves the sense of keeping intact.
  naturalness: The draft is generally clear, but the construction ‘जो कुछ ... उसका पालन करना’ is awkward in modern standard Hindi. A direct imperative with an object pronoun is more natural and maintains the concise exhortational register.
  terminology: ‘प्रभु की आज्ञाएँ’ is appropriate for ἐντολὰς Κυρίου. ‘प्राप्त किया है’ is more natural than ‘ग्रहण किया है’ here and does not specify whether the received matter is teaching, tradition, or commandments.
  issues:
  - severity: medium
    issue: φυλάξεις is rendered as ‘उसका पालन करना’.
    rationale: Although ‘पालन’ can fit religious commands, the immediately following prohibition against adding or removing indicates preserving the received content intact. ‘उसे सुरक्षित रखना’ retains this broader contextual sense without identifying the unspecified object.
  - severity: low
    issue: ‘जो कुछ तुमने ग्रहण किया है उसका पालन करना’ is syntactically awkward.
    rationale: Hindi more naturally uses an object pronoun with ‘सुरक्षित रखना’; this also makes the subsequent ‘उसमें’ unambiguous.
  revised_text: तुम प्रभु की आज्ञाओं को कभी न छोड़ना, बल्कि जो तुमने प्राप्त किया है, उसे सुरक्षित रखना—न उसमें कुछ जोड़ना, न उसमें से कुछ घटाना।
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek's emphatic prohibition, contrastive δέ, and deliberately unspecified relative object ἃ. ‘उसे सुरक्षित रखना’ reflects φυλάσσω in the context of not adding to or taking away from what was received, while avoiding an interpretive decision that the object must be a particular body of teaching or the commandments alone.
