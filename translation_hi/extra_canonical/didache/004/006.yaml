  text: If you have anything, you shall give through your hands a ransom for your sins.
translation:
  language: hi
  text: यदि तुम्हारे पास कुछ हो, तो तुम अपने हाथों से अपने पापों के लिए फिरौती दोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν ἔχῃς
  choice: यदि तुम्हारे पास कुछ हो
  rationale: यूनानी की शर्तवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है; निहित वस्तु को ‘कुछ’ से व्यक्त किया गया है।
- source_word: διὰ τῶν χειρῶν σου
  choice: अपने हाथों से
  rationale: यह मूल के माध्यम-सूचक वाक्यांश को सीधे बनाए रखता है और व्यक्तिगत रूप से देने के भाव को अनावश्यक व्याख्या के बिना व्यक्त करता है।
- source_word: δώσεις
  choice: तुम ... दोगे
  rationale: भविष्यकालीन क्रिया के स्पष्ट निर्देशात्मक बल को सुरक्षित रखा गया है।
- source_word: λύτρωσιν
  choice: छुटकारे
  rationale: ‘छुटकारा’ मूल्य देकर मुक्ति या विमोचन के अर्थ-क्षेत्र को हिन्दी में सहज ढंग से व्यक्त करता है; ‘फिरौती’ यहाँ अधिक संकीर्ण और अस्वाभाविक लग सकती है।
- source_word: ἁμαρτιῶν σου
  choice: अपने पापों के
  rationale: बहुवचन और द्वितीय पुरुष संबंध—‘तुम्हारे पापों’—दोनों सुरक्षित हैं; हिन्दी के वाक्य-विन्यास में ‘अपने’ अधिक स्वाभाविक है।
theological_decisions:
- issue: दान और पापों से छुटकारे के बीच संबंध
  choice: ‘अपने पापों के छुटकारे के लिए’
  alternative: ‘अपने पापों के प्रायश्चित के रूप में’ अथवा संबंध को केवल प्रतीकात्मक बताना
  rationale: मूल पाठ λύτρωσιν ἁμαρτιῶν σου कहकर संबंध को दृढ़ता से रखता है, पर उसकी धर्मवैज्ञानिक कार्यविधि नहीं समझाता। अनुवाद उस तनाव को बनाए रखता है और दान की भूमिका को किसी विशेष मत के अनुसार परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन अनौपचारिक ‘तुम’ निकटवर्ती नैतिक उपदेश की सीधी संबोधन-शैली को व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
