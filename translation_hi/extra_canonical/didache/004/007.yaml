source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ διστάσεις δοῦναι οὐδὲ διδοὺς γογγύσεις· γνώσῃ γὰρ τίς ἐστιν ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/007.yaml
  text: You shall not hesitate to give, nor grumble while giving; for you will know who is the good giver of the reward.
translation:
  language: hi
  text: देने में संकोच न करना, और देते समय बड़बड़ाना भी नहीं; क्योंकि तुम जानोगे कि प्रतिफल का भला प्रतिदाता कौन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διστάσεις
  choice: संकोच न करना
  rationale: यह क्रिया हिचकने या दुविधा करने का भाव रखती है; आधुनिक हिन्दी में ‘संकोच करना’ स्वाभाविक और स्पष्ट है।
- source_word: γογγύσεις
  choice: कुड़कुड़ाना
  rationale: यह बड़बड़ाकर असंतोष प्रकट करने को दर्शाता है; ‘कुड़कुड़ाना’ सामान्य पाठक के लिए सहज है और देते समय की अनिच्छा को व्यक्त करता है।
- source_word: μισθοῦ
  choice: प्रतिफल
  rationale: यहाँ अर्थ मजदूरी तक सीमित न होकर किए गए कार्य के बदले मिलने वाले फल या पुरस्कार का है; ‘प्रतिफल’ इस व्यापकता को बनाए रखता है।
- source_word: ἀνταποδότης
  choice: देनेवाला
  rationale: शब्द का मूल भाव बदले में चुकाने या प्रतिदान करने वाले का है। ‘प्रतिफल देनेवाला’ हिन्दी में स्वाभाविक है और अंग्रेज़ी परामर्श-पाठ के आशय से मेल खाता है।
- source_word: καλὸς
  choice: उत्तम
  rationale: यहाँ प्रतिफल देने वाले की भलाई और विश्वसनीयता का गुण है; ‘उत्तम’ गरिमापूर्ण और सहज है।
theological_decisions:
- issue: ‘प्रतिफल देनेवाला’ की पहचान
  choice: नाम स्पष्ट किए बिना प्रश्नवाचक संरचना ‘कौन है’ बनाए रखी गई
  alternative: ‘परमेश्वर ही उत्तम प्रतिफल देनेवाला है’
  rationale: यूनानी पाठ व्यक्ति का नाम नहीं बताता, बल्कि पाठक के भावी ज्ञान की बात करता है; परमेश्वर का नाम जोड़ना निहित अर्थ को अनावश्यक रूप से स्पष्ट कर देता।
- issue: γνώσῃ का काल और भाव
  choice: ‘तुम जानोगे’
  alternative: ‘तुम जानते हो’ या ‘तुम जान लो’
  rationale: मूल में भविष्यकाल है; इसलिए प्रतिफल देने वाले की पहचान या अनुभव भविष्य में होने का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, उपदेशात्मक और गरिमापूर्ण शैली रखी गई है। ‘न करना’ की आज्ञार्थक रचना दिदाखे की शिक्षात्मक ध्वनि को सहज हिन्दी में व्यक्त करती है।
