id: DID.4.3
reference: Didache 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ ποιήσεις σχίσμα, εἰρηνεύσεις δὲ μαχομένους· κρινεῖς δικαίως, οὐ λήψῃ πρόσωπον ἐλέγξαι ἐπὶ παραπτώμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/003.yaml
  text: You shall not cause division[a], but you shall reconcile those who are fighting. You shall judge justly; you shall not show partiality in reproving transgressions.
translation:
  language: hi
  text: तुम फूट नहीं डालोगे[a], बल्कि झगड़ने वालों में मेल कराओगे। तुम न्यायपूर्वक निर्णय करोगे; अपराधों के लिए डाँटते समय किसी का पक्ष नहीं लोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विभाजन पैदा नहीं करोगे।”
    reason: σχίσμα के ‘फूट’ और अधिक स्पष्ट ‘विभाजन’—दोनों संभव अर्थ-रूपों को दर्ज करने के लिए।
lexical_decisions:
- source_word: σχίσμα
  choice: फूट
  rationale: यहाँ शब्द समुदाय के भीतर फूट या विभाजन को दर्शाता है, न कि बाद के समय का कोई औपचारिक कलीसियाई मतभेद। आधुनिक हिन्दी में ‘फूट डालना’ स्वाभाविक और अर्थ-सटीक है।
- source_word: εἰρηνεύσεις ... μαχομένους
  choice: झगड़ने वालों में मेल कराओगे
  rationale: क्रिया का भाव केवल स्वयं शांत रहने का नहीं, बल्कि परस्पर लड़ रहे लोगों के बीच शांति स्थापित कराने का है।
- source_word: κρινεῖς δικαίως
  choice: न्यायपूर्वक निर्णय करोगे
  rationale: यह न्याय करते या विवाद का निर्णय देते समय निष्पक्ष और सही निर्णय करने की आज्ञा व्यक्त करता है।
- source_word: οὐ λήψῃ πρόσωπον
  choice: किसी का पक्ष नहीं लोगे
  rationale: शाब्दिक मुहावरा ‘चेहरा ग्रहण करना’ पक्षपात या व्यक्ति देखकर व्यवहार करने का अर्थ रखता है; हिन्दी मुहावरे में इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐπὶ παραπτώμασιν
  choice: अपराधों के लिए
  rationale: παράπτωμα यहाँ चूक, दोष या उल्लंघन को सूचित करता है। ‘अपराध’ नैतिक उल्लंघन का संक्षिप्त और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: σχίσμα का कलीसियाई अर्थ
  choice: फूट
  alternative: मत-विच्छेद
  rationale: मूल के आरंभिक सामुदायिक संदर्भ को बनाए रखते हुए बाद की संस्थागत या संप्रदायगत धारणा आरोपित नहीं की गई।
- issue: ἐλέγξαι में सुधारात्मक डाँट का भाव
  choice: डाँटते समय
  alternative: दोष सिद्ध करते समय
  rationale: क्रिया में गलत काम को उजागर करके सुधारने या फटकारने का भाव है। ‘डाँटना’ सामान्य पाठक के लिए स्पष्ट है और वाक्य में न्यायिक निर्णय तथा व्यक्तिगत सुधार के बीच अनावश्यक रूप से कठोर कानूनी अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सहज आदेशात्मक भविष्यकाल रखा गया है। ‘तुम’ संबोधन निकटता और स्पष्टता देता है; समानांतर आज्ञाओं की लय बनाए रखी गई है।
