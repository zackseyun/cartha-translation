  yaml_path: translation/extra_canonical/didache/004/009.yaml
  text: You shall not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God.
translation:
  language: hi
  text: तुम अपने बेटे या अपनी बेटी से अपना हाथ न हटाना, बल्कि बचपन से ही उन्हें परमेश्वर का भय मानना सिखाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπό
  choice: पर से अपना हाथ न हटाना
  rationale: यूनानी मुहावरे की ठोस छवि को बनाए रखता है और अभिभावकीय देखभाल तथा अनुशासन से पीछे न हटने का व्यापक अर्थ खुला छोड़ता है।
- source_word: ἀπὸ νεότητος
  choice: बचपन से ही
  rationale: संतान के आरंभिक जीवन से शिक्षा देने का स्वाभाविक आधुनिक हिन्दी रूप; यहाँ νεότης का आशय माता-पिता की अपनी युवावस्था नहीं, बच्चों की छोटी आयु है।
- source_word: διδάξεις
  choice: सिखाना
  rationale: आज्ञार्थक भविष्यकाल का हिन्दी में स्वाभाविक निषेधात्मक-अनुदेशात्मक रूप।
- source_word: τὸν φόβον τοῦ Θεοῦ
  choice: परमेश्वर का भय मानना
  rationale: बाइबलीय पारिभाषिक अर्थ को सुरक्षित रखते हुए हिन्दी में केवल आतंक के बजाय श्रद्धापूर्ण भय और आज्ञाकारिता का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘हाथ न हटाना’ का आशय
  choice: मूल रूपक को यथावत रखा गया
  alternative: अनुशासन देना या देखभाल करना
  rationale: मूल यूनानी कथन यह स्पष्ट नहीं करता कि हाथ संरक्षण, निर्देशन या अनुशासन में से किसे विशेष रूप से दर्शाता है; किसी एक अर्थ को चुनने से वास्तविक व्यापकता घटती।
- issue: ‘परमेश्वर का भय’
  choice: परमेश्वर का भय मानना
  alternative: परमेश्वर का आदर करना
  rationale: ‘आदर’ अर्थ का एक पहलू है, पर φόβος की गंभीरता और धार्मिक पारिभाषिक तनाव को पूरी तरह व्यक्त नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘बेटे या बेटी’ मूल की समानांतर संरचना को रखता है; ‘उन्हें’ दोनों संतानों को स्वाभाविक रूप से संदर्भित करता है।
