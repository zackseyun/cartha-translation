reference: Didache 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
translation:
  language: hi
  text: हे मेरे बच्चे, जो तुम्हें परमेश्वर का वचन सुनाता है, उसे तुम रात-दिन स्मरण रखना और प्रभु के समान उसका आदर करना; क्योंकि जहाँ प्रभुता की बात कही जाती है, वहाँ प्रभु हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: हे मेरे बच्चे
  rationale: स्नेहपूर्ण शिक्षकीय संबोधन को सहज और गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: τοῦ λαλούντός σοι
  choice: जो तुम्हें … सुनाता है
  rationale: वर्तमान कृदंत का आशय उस व्यक्ति से है जो श्रोता को लगातार या प्रसंगतः संदेश सुनाता है; ‘सुनाता है’ हिन्दी में स्वाभाविक है।
- source_word: τὸν λόγον τοῦ Θεοῦ
  choice: परमेश्वर का वचन
  rationale: λόγος के धार्मिक और संदेशपरक अर्थ को प्रचलित, संक्षिप्त हिन्दी पदावली में व्यक्त करता है।
- source_word: μνησθήσῃ … τιμήσεις
  choice: स्मरण रखना और … आदर करना
  rationale: दोनों भविष्यकालीन रूप यहाँ सेमिटिक/सप्तति-शैली की आज्ञा व्यक्त करते हैं; हिन्दी में समानांतर आज्ञार्थक रचना स्वाभाविक है।
- source_word: ὡς Κύριον
  choice: प्रभु के समान
  rationale: ὡς की तुलना को बनाए रखता है और शिक्षक तथा प्रभु की पहचान को अनावश्यक रूप से एक नहीं करता।
- source_word: ἡ κυριότης
  choice: प्रभुता
  rationale: अमूर्त संज्ञा के जानबूझकर असामान्य और अर्थगर्भित स्वरूप को सुरक्षित रखता है; इसे केवल ‘प्रभु का वचन’ कहकर स्पष्ट नहीं किया गया।
- source_word: Κύριός ἐστιν
  choice: प्रभु उपस्थित हैं
  rationale: शाब्दिक ‘प्रभु हैं’ हिन्दी में अधूरा और अस्पष्ट लगता; स्थानवाचक ἐκεῖ के साथ अस्तित्व/उपस्थिति का स्वाभाविक अर्थ व्यक्त किया गया है।
theological_decisions:
- issue: वचन सुनाने वाले का ‘प्रभु के समान’ आदर
  choice: तुलनात्मक भाषा को स्पष्ट रूप से बनाए रखा गया
  alternative: ‘उसे प्रभु मानकर आदर करना’
  rationale: मूल ὡς Κύριον सम्मान की तुलना व्यक्त कर सकता है; शिक्षक को स्वयं प्रभु घोषित करना पाठ की अपेक्षा अधिक निर्णायक होता।
- issue: ‘जहाँ प्रभुता की बात कही जाती है’ का अर्थ
  choice: अमूर्त और कुछ हद तक रहस्यमय कथन को सुरक्षित रखा गया
  alternative: ‘जहाँ प्रभु का वचन सुनाया जाता है’
  rationale: मूल में κυριότης है, λόγος नहीं; व्याख्यात्मक विकल्प अधिक सहज है, पर स्रोत की वास्तविक शब्दावली और तनाव को बदल देता है।
- issue: अंतिम वाक्य में प्रभु की उपस्थिति
  choice: ‘वहाँ प्रभु उपस्थित हैं’
  alternative: ‘वहाँ प्रभु हैं’
  rationale: यह स्थान-संबंधी कथन का स्वाभाविक हिन्दी रूप है और यह निर्धारित नहीं करता कि उपस्थिति किस सिद्धान्तगत ढंग से समझी जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण उपदेशात्मक और गरिमापूर्ण शैली रखी गई है। भविष्यकालीन यूनानी आज्ञाओं को हिन्दी के समानांतर आज्ञार्थक रूपों में दिया गया है। ‘प्रभुता’ की असामान्य अमूर्तता जानबूझकर सुरक्षित रखी गई है।
