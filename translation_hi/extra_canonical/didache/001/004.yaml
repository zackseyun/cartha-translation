id: DID.1.4
reference: Didache 1:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
translation:
  language: hi
  text: देह की और संसार की अभिलाषाओं से दूर रहो। यदि कोई तुम्हारे दाहिने गाल पर थप्पड़ मारे, तो उसकी ओर दूसरा गाल भी फेर दो, और तुम पूर्ण हो जाओगे। यदि कोई तुम्हें एक मील चलने के लिए मजबूर करे, तो उसके साथ दो मील जाओ। यदि कोई तुम्हारा बाहरी वस्त्र ले ले, तो उसे अपना कुरता भी दे दो। यदि कोई तुमसे जो तुम्हारा है वह ले ले, तो उसे वापस मत माँगो, क्योंकि तुम समर्थ भी नहीं हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में अंतिम वाक्य का शाब्दिक रूप है, “क्योंकि तुम समर्थ भी नहीं हो”; किस कार्य के लिए समर्थ नहीं हो, यह स्पष्ट रूप से नहीं कहा गया है।
    reason: मूल पाठ की व्याकरणिक संक्षिप्तता और अर्थगत अस्पष्टता को पाठक के लिए दर्ज करना।
lexical_decisions:
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  choice: देह की और संसार की अभिलाषाएँ
  rationale: ‘देह’ और ‘संसार’ यूनानी विशेषणों का भेद बनाए रखते हैं; ‘अभिलाषाएँ’ नैतिक संदर्भ में ἐπιθυμίαι का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ῥάπισμα
  choice: थप्पड़
  rationale: यह गाल पर हाथ से किए गए प्रहार का स्पष्ट और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: τέλειος
  choice: पूर्ण
  rationale: यह τέλειος के पूर्णता/परिपक्वता संबंधी अर्थ को बनाए रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- source_word: ἀγγαρεύσῃ
  choice: चलने के लिए मजबूर करे
  rationale: क्रिया जबरन सेवा में लगाने या मार्ग चलवाने का भाव देती है; प्रसंग में निहित गति को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: ἱμάτιον … χιτών
  choice: बाहरी वस्त्र … कुरता
  rationale: 'दो अलग वस्त्रों का क्रम बनाए रखा गया है: ἱμάτιον ऊपर पहना जाने वाला वस्त्र है और χιτών शरीर के निकट पहना जाने वाला वस्त्र।'
theological_decisions:
- issue: τέλειος में नैतिक पूर्णता या परिपक्वता
  choice: पूर्ण
  alternative: सिद्ध / परिपक्व
  rationale: ‘पूर्ण’ स्रोत की व्यापक अर्थ-सीमा और कथन के तनाव को बनाए रखता है; ‘परिपक्व’ अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- issue: οὐδὲ γὰρ δύνασαι का अस्पष्ट निहित पूरक
  choice: क्योंकि तुम ऐसा कर भी नहीं सकते
  alternative: क्योंकि तुम उसे वापस पा नहीं सकते
  rationale: यूनानी में ‘कर सकना’ के बाद अपेक्षित क्रिया व्यक्त नहीं है। अनुवाद उसी संक्षिप्तता को यथासंभव रखता है और ‘वापस पाना’ जैसी निश्चित व्याख्या मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली रखी गई है। वस्त्रों और जबरन चलवाने जैसे प्राचीन संदर्भों को अत्यधिक तकनीकी शब्दावली के बिना स्पष्ट किया गया है।
