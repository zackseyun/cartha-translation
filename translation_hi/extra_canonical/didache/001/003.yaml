id: DID.1.3
reference: Didache 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τούτων δὲ τῶν λόγων ἡ διδαχὴ ἐστὶν αὕτη· Εὐλογεῖτε τοὺς καταρωμένους ὑμῖν καὶ προσεύχεσθε ὑπὲρ τῶν ἐχθρῶν ὑμῶν, νηστεύετε δὲ ὑπὲρ τῶν διωκόντων ὑμᾶς· ποία γὰρ χάρις, ἐὰν ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς· οὐχὶ καὶ τὰ ἔθνη τὸ αὐτὸ ποιοῦσιν ; ὑμεῖς δὲ ἀγαπᾶτε τοὺς μισοῦντας ὑμᾶς καὶ οὐχ ἕξετε ἐχθρόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/003.yaml
  text: 'And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.'
translation:
  language: hi
  text: 'और इन वचनों की शिक्षा यह है: जो तुम्हें शाप देते हैं, उन्हें आशीष दो; अपने शत्रुओं के लिए प्रार्थना करो; और जो तुम्हें सताते हैं, उनके लिए उपवास करो। क्योंकि यदि तुम उन्हीं से प्रेम करते हो जो तुमसे प्रेम करते हैं, तो इसमें क्या श्रेय है? क्या गैर-यहूदी भी ऐसा ही नहीं करते? पर तुम उनसे प्रेम करो जो तुमसे घृणा करते हैं, और तुम्हारा कोई शत्रु नहीं होगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ διδαχή
  choice: शिक्षा
  rationale: यहाँ शब्द किसी सामान्य सूचना के बजाय इन वचनों के व्यावहारिक उपदेश को दर्शाता है; ‘शिक्षा’ आधुनिक और सहज है।
- source_word: Εὐλογεῖτε
  choice: आशीष दो
  rationale: आज्ञार्थक क्रिया का धार्मिक और नैतिक अर्थ बनाए रखता है तथा καταρωμένους के ‘शाप देते हैं’ से स्पष्ट विरोध रचता है।
- source_word: ὑπέρ
  choice: के लिए
  rationale: प्रार्थना और उपवास, दोनों के संदर्भ में संबंधित व्यक्तियों के हित में किए जाने का स्वाभाविक हिन्दी रूप है।
- source_word: χάρις
  choice: प्रशंसा
  rationale: इस प्रश्न में χάρις का अर्थ कृपा-सिद्धांत को निर्दिष्ट करना नहीं, बल्कि प्रशंसनीयता या विशेष श्रेय है; ‘तुम्हारी क्या प्रशंसा?’ मूल की खुली नैतिक चुनौती को बनाए रखता है।
- source_word: τὰ ἔθνη
  choice: गैर-यहूदी
  rationale: यहूदी संदर्भ में ‘अन्यजाति’ का अर्थ स्पष्ट करते हुए आधुनिक पाठक के लिए सहज और ऐतिहासिक रूप से सटीक अभिव्यक्ति है।
- source_word: ἐχθρόν
  choice: शत्रु
  rationale: मूल शब्द का सीधा समतुल्य; अंतिम वाक्य में संबंधगत और नैतिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: καὶ οὐχ ἕξετε ἐχθρόν का आशय
  choice: और तब तुम्हारा कोई शत्रु नहीं होगा
  alternative: और तुम किसी को शत्रु नहीं मानोगे
  rationale: यूनानी पाठ शाब्दिक रूप से ‘तुम्हारा कोई शत्रु नहीं होगा’ कहता है। वैकल्पिक अर्थ नैतिक दृष्टिकोण समझा सकता है, पर मूल की संभावित प्रतिज्ञा, परिणाम या संबंधगत दावे को चुपचाप सीमित कर देता; इसलिए अस्पष्टता सुरक्षित रखी गई है।
- issue: χάρις का धार्मिक अर्थ
  choice: प्रशंसा
  alternative: अनुग्रह / प्रतिफल / श्रेय
  rationale: संदर्भ प्रेम की असाधारण नैतिक गुणवत्ता पर प्रश्न करता है। ‘अनुग्रह’ हिन्दी में ईश्वरीय कृपा का विशिष्ट धर्मवैज्ञानिक अर्थ ला सकता है, जबकि ‘प्रतिफल’ मूल में प्रत्यक्ष नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और प्रत्यक्ष आज्ञार्थक शैली रखी गई है। बहुवचन ‘तुम’ मूल के दूसरे पुरुष बहुवचन को स्वाभाविक रूप में व्यक्त करता है। अर्धविरामों से समानांतर आज्ञाओं की लय स्पष्ट की गई है।
