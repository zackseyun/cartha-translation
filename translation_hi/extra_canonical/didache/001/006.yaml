language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀλλὰ καὶ περὶ τούτου δὴ εἴρηται· Ἱδρωσάτω ἡ ἐλεημοσύνη σου εἰς τὰς χεῖράς σου, μέχρις ἂν γνῷς τίνι δῷς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/006.yaml
  text: 'But about this also it has been said: Let your alms sweat in your hands until you know to whom you should give.'
translation:
  language: hi
  text: 'पर इसके विषय में भी कहा गया है: तुम्हारा दान तुम्हारे हाथों में पसीना बहाए, जब तक कि तुम यह न जान लो कि तुम्हें किसे देना चाहिए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: दान
  rationale: यहाँ इसका अर्थ ज़रूरतमंद को दिया जाने वाला दान है। आधुनिक हिन्दी में ‘दान’ स्वाभाविक और व्यापक रूप से समझ में आता है; ‘भिक्षादान’ अनावश्यक रूप से संकीर्ण होता।
- source_word: Ἱδρωσάτω
  choice: पसीना बहाए
  rationale: यूनानी की सजीव और असामान्य उपमा को बनाए रखा गया है; इसे केवल ‘रुका रहे’ कहने से मूल का प्रभाव खो जाता।
- source_word: εἰς τὰς χεῖράς σου
  choice: तुम्हारे हाथों में
  rationale: मूल पाठ के स्थान-संबंधी चित्र को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: μέχρις ἂν γνῷς
  choice: जब तक कि तुम यह न जान लो
  rationale: अनिश्चित भविष्य की सीमा और उचित प्राप्तकर्ता पहचानने की प्रक्रिया दोनों को व्यक्त करता है।
- source_word: τίνι δῷς
  choice: तुम्हें किसे देना चाहिए
  rationale: यूनानी संभाव्य क्रिया-रूप को प्रसंगानुसार हिन्दी के ‘चाहिए’ से व्यक्त किया गया है, जो विवेकपूर्वक पात्र चुनने का भाव रखता है।
theological_decisions:
- issue: दान को हाथों में ‘पसीना बहाने’ देने का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया
  alternative: ‘दान देने में तब तक रुको’ या ‘दान को अपने हाथ में रोके रखो’
  rationale: मूल कथन प्राप्तकर्ता की पहचान में सावधानी का संकेत देता है, पर यह स्पष्ट नहीं करता कि कितना विलंब या कैसी जाँच अपेक्षित है। अनुवाद में उस तनाव और रूपक को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘पर’ से पूर्ववर्ती कथन के साथ विरोधात्मक संबंध बना रहता है। असामान्य किंतु अर्थपूर्ण ‘दान…पसीना बहाए’ रूपक जानबूझकर सुरक्षित रखा गया है।
