  yaml_path: translation/extra_canonical/didache/001/001.yaml
  text: There are two ways, one of life and one of death, and there is a great difference between the two ways.
translation:
  language: hi
  text: दो मार्ग हैं—एक जीवन का और एक मृत्यु का—और दोनों मार्गों के बीच बहुत बड़ा अंतर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ δύο
  choice: दो मार्ग
  rationale: ‘मार्ग’ मूल रूपक को बनाए रखता है और आधुनिक हिन्दी में जीवन-पद्धति या आचरण की दिशा के अर्थ में स्वाभाविक है।
- source_word: μία τῆς ζωῆς καὶ μία τοῦ θανάτου
  choice: एक जीवन का और एक मृत्यु का
  rationale: यूनानी की समानांतर और संक्षिप्त संरचना को सुरक्षित रखते हुए ζωή और θάνατος का सीधा अनुवाद किया गया है।
- source_word: διαφορὰ δὲ πολλὴ
  choice: बहुत बड़ा अंतर
  rationale: πολλή की तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है; δέ यहाँ विरोध की अपेक्षा अगले कथन को जोड़ता है।
- source_word: μεταξὺ τῶν δύο ὁδῶν
  choice: दोनों मार्गों में
  rationale: यह हिन्दी का स्वाभाविक प्रयोग है और दोनों मार्गों के बीच विद्यमान भेद को स्पष्ट करता है।
theological_decisions:
- issue: ‘जीवन’ और ‘मृत्यु’ का आशय
  choice: मूल के संक्षिप्त, व्यापक शब्दों को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘अनन्त जीवन’ और ‘अनन्त मृत्यु’ या ‘विनाश’ कहना।
  rationale: यूनानी पाठ इन विशेषणों या व्याख्याओं को स्पष्ट रूप से नहीं जोड़ता; अतः उसकी अर्थगत व्यापकता और संभावित तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध है। दीर्घ वाक्य को स्पष्ट करने तथा दोनों समानांतर मार्गों पर बल देने के लिए डैश प्रयुक्त हुए हैं।
