  to: 'जीवन का मार्ग यह है: पहले, तुम उस परमेश्वर से प्रेम करो जिसने तुम्हें बनाया; दूसरे, अपने पड़ोसी से अपने समान प्रेम करो। और जो कुछ तुम नहीं चाहते कि तुम्हारे साथ हो, वह तुम भी किसी और के साथ न करो।'
