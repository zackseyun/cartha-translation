review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two love commands and preserves the broad sense of γίνεσθαι (‘happen/be done’) in the final maxim. It also appropriately represents the emphasis of καὶ σύ with ‘तुम भी.’ A minor revision is needed because the infinitival command forms ‘प्रेम करना’ are less idiomatic and less direct than finite imperative forms in this context.
  naturalness: ‘पहली बात, तुम ... प्रेम करना’ is awkward in modern standard Hindi. Finite forms such as ‘प्रेम करो’ provide a clear, natural instructional register while retaining the Greek’s imperative force. ‘किसी और के साथ’ is more idiomatic than ‘किसी दूसरे के साथ’ here.
  terminology: ‘जीवन का मार्ग,’ ‘परमेश्वर,’ ‘प्रेम,’ and ‘पड़ोसी’ are suitable, clear, and consistent with a dignified modern Hindi biblical register. No doctrinally loaded expansion is introduced.
  issues:
  - severity: medium
    issue: Infinitival wording weakens natural imperative expression.
    rationale: The Greek future forms ἀγαπήσεις function commandingly in this instructional context. Hindi ‘तुम ... प्रेम करना’ is grammatically possible only in constrained note-like usage and sounds unnatural in running prose; ‘प्रेम करो’ is the normal direct rendering.
  - severity: low
    issue: Final indirect-object expression is slightly stiff.
    rationale: ‘किसी और के साथ’ naturally expresses doing something to/with another person in Hindi and avoids the somewhat formal ‘किसी दूसरे के साथ,’ without narrowing the source sense.
  revised_text: 'जीवन का मार्ग यह है: पहले, तुम उस परमेश्वर से प्रेम करो जिसने तुम्हें बनाया; दूसरे, अपने पड़ोसी से अपने समान प्रेम करो। और जो कुछ तुम नहीं चाहते कि तुम्हारे साथ हो, वह तुम भी किसी और के साथ न करो।'
  revised_footnotes: []
