id: DID.1.2
reference: Didache 1:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς ἐστιν αὕτη· πρῶτον, ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε· δεύτερον, τὸν πλησίον σου ὡς σεαυτόν· πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι, καὶ σὺ ἄλλῳ μὴ ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/002.yaml
  text: 'This is the way of life: first[a], you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another either.'
translation:
  language: hi
  text: 'जीवन का मार्ग यह है: पहले, तुम उस परमेश्वर से प्रेम करो जिसने तुम्हें बनाया; दूसरे, अपने पड़ोसी से अपने समान प्रेम करो। और जो कुछ तुम नहीं चाहते कि तुम्हारे साथ हो, वह तुम भी किसी और के साथ न करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδὸς τῆς ζωῆς
  choice: जीवन का मार्ग
  rationale: यह यूनानी रूपक का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἀγαπήσεις
  choice: प्रेम करना
  rationale: भविष्यत् रूप यहाँ आज्ञार्थक बल रखता है; हिन्दी का निर्देशात्मक अनंत रूप इस संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: τὸν Θεὸν τὸν ποιήσαντά σε
  choice: परमेश्वर से प्रेम करना, जिसने तुम्हें बनाया
  rationale: सृष्टिकर्ता के रूप में परमेश्वर का संबंधवाचक वर्णन स्पष्ट रखा गया है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी से
  rationale: ‘पड़ोसी’ निकटवर्ती मनुष्य के लिए प्रचलित बाइबलीय और आधुनिक हिन्दी शब्द है।
- source_word: ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι
  choice: जो कुछ तुम नहीं चाहते कि तुम्हारे साथ हो
  rationale: γίνεσθαι का अर्थ ‘होना/घटित होना’ है; इसे केवल दूसरों द्वारा किए गए कर्म तक सीमित नहीं किया गया।
- source_word: καὶ σὺ ἄλλῳ μὴ ποίει
  choice: वह तुम भी किसी दूसरे के साथ न करना
  rationale: ‘तुम भी’ से καὶ σύ का व्यक्तिगत और सहवर्ती बल सुरक्षित रहता है।
theological_decisions:
- issue: दूसरे आदेश में क्रिया का लोप
  choice: ‘प्रेम करना’ को हिन्दी में स्पष्ट रूप से दोहराया गया
  alternative: ‘दूसरी, अपने पड़ोसी से अपने समान’ जैसा खंडित शाब्दिक रूप
  rationale: यूनानी में क्रिया पहले आदेश से समझी जाती है; हिन्दी में उसे दोहराने से अर्थ स्पष्ट होता है और कोई नया धर्मवैचारिक आशय नहीं जुड़ता।
- issue: नकारात्मक स्वर्णिम नियम का दायरा
  choice: ‘तुम्हारे साथ हो’
  alternative: ‘कोई तुम्हारे साथ करे’
  rationale: मूल γίνεσθαι व्यापक ‘होना/घटित होना’ व्यक्त करता है; संकीर्ण वैकल्पिक रूप मूल की व्यापकता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। ‘पहली बात… दूसरी…’ मूल के क्रम को स्पष्ट करता है। किसी असमर्थित पाद-टिप्पणी को नहीं अपनाया गया, क्योंकि उपलब्ध यूनानी पाठ में यहाँ पाठांतर या ऐसी वास्तविक अस्पष्टता नहीं है।
