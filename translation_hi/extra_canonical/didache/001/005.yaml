id: DID.1.5
reference: Didache 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
translation:
  language: hi
  text: जो कोई तुमसे माँगे, उसे दो और उससे वापस मत माँगो; क्योंकि पिता चाहता है कि उसके अपने अनुग्रह-दानों से सबको दिया जाए।[a] धन्य है वह, जो आज्ञा के अनुसार देता है, क्योंकि वह निर्दोष है। परन्तु धिक्कार है उस पर, जो लेता है; क्योंकि यदि कोई आवश्यकता में होने के कारण लेता है, तो वह निर्दोष होगा। लेकिन जिसे आवश्यकता नहीं है, वह इस बात के लिए दंड भोगेगा कि उसने क्यों और किस प्रयोजन से लिया। बन्दी अवस्था में आने पर उससे उसके किए हुए कामों के विषय में पूछताछ की जाएगी,[b] और जब तक वह आखिरी क्वाड्रान्स[c] न चुका दे, तब तक वहाँ से बाहर नहीं निकलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “क्योंकि पिता चाहता है कि उसके अपने अनुग्रह-दान सबको दिए जाएँ।”'
    reason: δίδοσθαι के अव्यक्त कर्ता और ἐκ τῶν ἰδίων χαρισμάτων के संबंध को इस प्रकार भी समझा जा सकता है कि पिता के अपने दान ही सबको दिए जाएँ।
  - marker: b
    text: “बन्दी अवस्था में आने पर” का अर्थ “संकट में पड़ने पर” या “कठोर दबाव में आने पर” भी हो सकता है।
    reason: ἐν συνοχῇ का अर्थ संदर्भानुसार बंदी अवस्था, संकट या दबाव हो सकता है।
  - marker: c
    text: क्वाड्रान्स रोमी ताँबे का बहुत कम मूल्य वाला सिक्का था।
    reason: ऐतिहासिक मुद्रा के अपरिचित नाम को स्पष्ट करना।
lexical_decisions:
- source_word: χαρισμάτων
  choice: अनुग्रह-दानों
  rationale: यह शब्द कृपा से दिए गए उपहारों या दानों का बोध कराता है। “अनुग्रह-दान” उस कृपापूर्ण भाव को बनाए रखता है, जबकि प्रसंग में भौतिक रूप से बाँटे जाने वाले दान भी सम्मिलित रह सकते हैं।
- source_word: ἀθῷος
  choice: निर्दोष
  rationale: यहाँ अर्थ दंड या दोष से मुक्त होने का है; “निर्दोष” दाता और वास्तविक आवश्यकता में लेने वाले, दोनों के लिए स्वाभाविक और सुसंगत है।
- source_word: δίκην δώσει
  choice: दंड भोगेगा
  rationale: यूनानी मुहावरे का आशय दंड या उत्तरदायित्व चुकाने से है। हिंदी में “दंड भोगेगा” स्पष्ट और स्वाभाविक है।
- source_word: ἐν συνοχῇ γενόμενος
  choice: बन्दी होने पर
  rationale: वाक्य का आगे का भाग बाहर न निकलने और अंतिम सिक्का चुकाने की न्यायिक-बंदी की छवि देता है। फिर भी यूनानी पद में संकट या कठोर दबाव का व्यापक अर्थ संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: κοδράντην
  choice: क्वाड्रान्स
  rationale: यह रोमी ताँबे के अत्यल्प मूल्य वाले सिक्के का विशिष्ट नाम है। लिप्यंतरण ऐतिहासिक मुद्रा को सुरक्षित रखता है और पादटिप्पणी उसका अर्थ स्पष्ट करती है।
theological_decisions:
- issue: पिता के दानों और मानवीय देने के बीच संबंध
  choice: “पिता चाहता है कि उसके अपने अनुग्रह-दानों में से सबको दिया जाए”
  alternative: “पिता चाहता है कि उसके अपने अनुग्रह-दान सबको दिए जाएँ”
  rationale: यूनानी ἐκ τῶν ἰδίων χαρισμάτων में “में से/से” का भाव है। मुख्य पाठ इसे बनाए रखता है और यह तय नहीं करता कि मनुष्य का दान सीधे पिता के दानों के समान है या उन्हीं से प्राप्त साधनों का वितरण।
- issue: अंतिम न्याय या सांसारिक कारावास
  choice: न्यायिक जाँच और बन्दी होने की चित्रात्मक भाषा को यथावत रखना
  alternative: इसे स्पष्ट रूप से अंतिम न्याय या सांसारिक ऋण-कारावास घोषित करना
  rationale: पाठ दंड, पूछताछ, बन्दी अवस्था और अंतिम सिक्के के भुगतान की भाषा प्रयोग करता है, लेकिन इसका धर्मवैचारिक संदर्भ स्पष्ट नहीं करता। अनुवाद उस तनाव को नहीं सुलझाता।
- issue: आवश्यकता में लेने वाले की निर्दोषता
  choice: “आवश्यकता में होने के कारण लेता है”
  alternative: “लेते समय आवश्यकता में है”
  rationale: कृदन्त χρείαν ἔχων वास्तविक आवश्यकता की स्थिति बताता है। हिंदी में कारणसूचक रूप अधिक स्वाभाविक है, पर यह आवश्यकता की नैतिक कसौटी को अतिरिक्त रूप से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। “धिक्कार”, “आज्ञा” और “निर्दोष” जैसे शब्द प्राचीन नैतिक उपदेश के गंभीर स्वर को बनाए रखते हैं; कठिन यूनानी पदों और ऐतिहासिक मुद्रा को पादटिप्पणियों में स्पष्ट किया गया है।
