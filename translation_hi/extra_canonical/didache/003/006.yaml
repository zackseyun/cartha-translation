id: DID.3.6
reference: Didache 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου γόγγυσος· ἐπειδὴ ὁδηγεῖ εἰς τὴν βλασφημίαν· μηδὲ αὐθάδης μηδὲ πονηρόφρων· ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/006.yaml
  text: My child, do not become a grumbler, since it leads to blasphemy; nor self-willed, nor evil-minded, for from all these blasphemies are born.
translation:
  language: hi
  text: मेरे बच्चे, बड़बड़ानेवाला मत बन, क्योंकि यह निन्दा की ओर ले जाता है; न मनमानी करनेवाला बन, न बुरी सोच रखनेवाला, क्योंकि इन सब से निन्दाएँ जन्म लेती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: मेरे बच्चे
  rationale: स्नेहपूर्ण गुरु-शिष्य सम्बोधन को सरल और स्वाभाविक हिन्दी में रखा गया है; यूनानी में व्याकरणिक लिंग यहाँ निर्णायक नहीं है।
- source_word: γόγγυσος
  choice: कुड़कुड़ानेवाले
  rationale: यह शब्द लगातार असन्तोष जताने या शिकायत करते रहनेवाले व्यक्ति को दर्शाता है; ‘कुड़कुड़ाना’ सामान्य हिन्दी में इस भाव को सजीव रूप से व्यक्त करता है।
- source_word: βλασφημίαν / βλασφημίαι
  choice: परमेश्वर की निन्दा / परमेश्वर की निन्दाएँ
  rationale: βλασφημία का अर्थ निन्दात्मक या अपमानजनक वचन हो सकता है; इस नैतिक-धार्मिक सन्दर्भ में ‘परमेश्वर की निन्दा’ अपेक्षित आशय स्पष्ट करता है, जबकि एकवचन और बहुवचन का भेद सुरक्षित रखा गया है।
- source_word: αὐθάδης
  choice: मनमानी करनेवाले
  rationale: शब्द आत्मतुष्ट, हठी और दूसरों की परवाह न करनेवाले स्वभाव को व्यक्त करता है; ‘मनमानी करनेवाला’ आधुनिक पाठक के लिए सहज है।
- source_word: πονηρόφρων
  choice: बुरी सोच रखनेवाले
  rationale: संयुक्त शब्द का भाव दुष्ट या बुरे विचारों वाला होना है; अनावश्यक रूप से दुर्लभ शब्दावली से बचते हुए अर्थ स्पष्ट रखा गया है।
- source_word: γεννῶνται
  choice: जन्म लेती हैं
  rationale: यूनानी जन्म-रूपक को बनाए रखा गया है और βλασφημίαι के बहुवचन के अनुरूप क्रिया रखी गई है।
theological_decisions:
- issue: βλασφημία के लक्ष्य की स्पष्टता
  choice: परमेश्वर की निन्दा
  alternative: निन्दा / ईशनिन्दा
  rationale: मूल में लक्ष्य स्पष्ट रूप से नहीं कहा गया, पर धार्मिक नैतिक सन्दर्भ में शब्द सामान्यतः ईश-निन्दा का बोध देता है। ‘परमेश्वर की निन्दा’ साधारण पाठक के लिए ‘ईशनिन्दा’ से अधिक पारदर्शी है।
- issue: कारणात्मक सम्बन्ध की तीव्रता
  choice: ‘की ओर ले जाता है’ और ‘जन्म लेती हैं’
  alternative: ‘का कारण बनता है’
  rationale: पहले खण्ड में ὁδηγεῖ के मार्ग-दर्शक रूपक और दूसरे में γεννῶνται के जन्म-रूपक को अलग-अलग सुरक्षित रखा गया है; इस प्रकार कथन को एक समान यांत्रिक कारणता में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, उपदेशात्मक और गरिमापूर्ण शैली। लिंग-समावेशी सम्बोधन के लिए ‘बच्चे’ रखा गया है। समानान्तर निषेधों और मूल के दो अलग रूपकों को बनाए रखते हुए वाक्य को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
