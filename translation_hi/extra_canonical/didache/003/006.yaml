  to: मेरे बच्चे, बड़बड़ानेवाला मत बन, क्योंकि यह निन्दा की ओर ले जाता है; न मनमानी करनेवाला बन, न बुरी सोच रखनेवाला, क्योंकि इन सब से निन्दाएँ जन्म लेती हैं।
