review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of prohibitions and the distinct images of leading toward (ὁδηγεῖ εἰς) and being born (γεννῶνται). However, adding “परमेश्वर की” makes βλασφημία more specific than the Greek, which leaves the object of blasphemy unstated. The singular second-person imperatives are also better represented by singular Hindi forms.
  naturalness: The draft is generally clear, but it mixes the singular address “मेरे बच्चे” with plural/honorific-style forms (“मत बनो,” “करनेवाले”). Singular direct address is more idiomatic and closer to the Greek.
  terminology: “निन्दा” retains the source’s semantic openness; “परमेश्वर की निन्दा” is an interpretive narrowing. “बड़बड़ानेवाला” is a natural modern equivalent for γόγγυσος in this admonitory context. “मनमानी करनेवाला” and “बुरी सोच रखनेवाला” communicate the relevant qualities clearly.
  issues:
  - severity: medium
    issue: The translation specifies “परमेश्वर की निन्दा” where the Greek says only βλασφημία / βλασφημίαι.
    rationale: Although blasphemy can concern God in context, the source does not explicitly identify its object. The Hindi should preserve that ambiguity.
  - severity: low
    issue: Number/register is inconsistent between “मेरे बच्चे” and the plural forms “मत बनो” and “...वाले.”
    rationale: The Greek uses singular address and imperative (Τέκνον μου, μὴ γίνου). Singular Hindi gives a more faithful and smoother direct exhortation.
  revised_text: मेरे बच्चे, बड़बड़ानेवाला मत बन, क्योंकि यह निन्दा की ओर ले जाता है; न मनमानी करनेवाला बन, न बुरी सोच रखनेवाला, क्योंकि इन सब से निन्दाएँ जन्म लेती हैं।
  revised_footnotes: []
  revision_rationale: The revision removes an unsupported specification of the target of “blasphemy,” retains the Greek’s singular address, and preserves both the directional and birth metaphors. No footnotes are needed.
