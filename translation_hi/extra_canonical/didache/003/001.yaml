  text: Τέκνον μου, φεῦγε ἀπὸ παντὸς πονηροῦ καὶ ἀπὸ παντὸς ὁμοίου αὐτοῦ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/001.yaml
  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: hi
  text: मेरे बच्चे, हर बुरी चीज़ से और उससे मिलती-जुलती हर चीज़ से दूर भागो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: मेरे बच्चे
  rationale: स्नेहपूर्ण संबोधन को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; यूनानी में लिंग स्पष्ट नहीं किया गया है।
- source_word: φεῦγε ἀπό
  choice: से दूर भागो
  rationale: मूल क्रिया के प्रबल निषेधात्मक भाव—केवल बचने नहीं, सक्रिय रूप से दूर हटने—को सुरक्षित रखता है।
- source_word: παντὸς πονηροῦ
  choice: हर बुराई
  rationale: नपुंसकलिंगी विशेषण का व्यापक अर्थ किसी भी बुरी वस्तु, काम या बात को समेट सकता है; हिन्दी में ‘हर बुराई’ संक्षिप्त और स्वाभाविक है।
- source_word: παντὸς ὁμοίου αὐτοῦ
  choice: उससे मिलती-जुलती हर बात
  rationale: ‘उसके समान हर चीज़’ का आशय सहज हिन्दी में देता है और बुराई से साम्य की व्यापकता बनाए रखता है।
theological_decisions:
- issue: बुराई से मिलती-जुलती चीज़ों की नैतिक सीमा
  choice: उससे मिलती-जुलती हर बात
  alternative: हर प्रकार की बुराई
  rationale: मूल पाठ दूसरी अलग श्रेणी—बुराई के समान चीज़ों—का उल्लेख करता है। इसे ‘हर प्रकार की बुराई’ में मिला देने से मूल की संभावित व्यापक नैतिक चेतावनी समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय शिक्षक-संतान संबोधन और संक्षिप्त आज्ञार्थक शैली को बनाए रखा गया है।
