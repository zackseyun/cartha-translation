  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου ὀργίλος· ὁδηγεῖ γὰρ ἡ ὀργὴ πρὸς τὸν φόνον· μηδὲ ζηλωτὴς μηδὲ ἐριστικὸς μηδὲ θυμικός· ἐκ γὰρ τούτων ἀπάντων φόνοι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/002.yaml
  text: Do not become quick-tempered, for anger leads to murder; nor be jealous, nor quarrelsome, nor hot-headed, for from all these murders are born.
translation:
  language: hi
  text: क्रोधी मत बनो, क्योंकि क्रोध हत्या की ओर ले जाता है। न ईर्ष्यालु बनो, न झगड़ालू, और न तुनकमिज़ाज, क्योंकि इन सब से हत्याएँ जन्म लेती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργίλος
  choice: क्रोधी
  rationale: यह स्वभावतः शीघ्र या बार-बार क्रोधित होने वाले व्यक्ति को दर्शाता है; आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: ζηλωτής
  choice: ईर्ष्यालु
  rationale: इस निषेधात्मक संदर्भ में शब्द का नकारात्मक अर्थ ईर्ष्या या जलन रखने वाला है।
- source_word: ἐριστικός
  choice: झगड़ालू
  rationale: विवाद और कलह की प्रवृत्ति को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: θυμικός
  choice: तुनकमिज़ाज
  rationale: आवेगपूर्ण, उग्र और जल्दी भड़कने वाले स्वभाव को व्यक्त करता है तथा ὀργίλος से कुछ भिन्नता बनाए रखता है।
- source_word: φόνοι γεννῶνται
  choice: हत्याएँ जन्म लेती हैं
  rationale: मूल के बहुवचन और जन्म लेने की सजीव उपमा दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्रोध और हत्या के बीच संबंध
  choice: क्रोध हत्या की ओर ले जाता है
  alternative: क्रोध हत्या का कारण बनता है
  rationale: πρὸς का दिशात्मक भाव सुरक्षित रहता है; कथन को हर घटना में अनिवार्य प्रत्यक्ष कारण के रूप में अधिक कठोर नहीं बनाया गया।
- issue: अंतिम φόνοι का बहुवचन
  choice: हत्याएँ
  alternative: हत्या
  rationale: यूनानी पाठ का वास्तविक बहुवचन बनाए रखा गया है, यद्यपि हिन्दी में एकवचन अधिक मुहावरेदार हो सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानार्थी क्रोध-संबंधी पदों के बीच अंतर बनाए रखने के लिए ‘क्रोधी’ और ‘तुनकमिज़ाज’ चुने गए हैं।
