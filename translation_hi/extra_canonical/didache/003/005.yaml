id: DID.3.5
reference: Didache 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ψεύστης· ἐπειδὴ ὁδηγεῖ τὸ ψεῦσμα εἰς τὴν κλοπήν· μηδὲ φιλάργυρος μηδὲ κενόδοξος· ἐκ γὰρ τούτων ἁπάντων κλοπαὶ γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/005.yaml
  text: My child, do not become a liar, since lying leads to theft; nor be money-loving, nor vainglorious, for from all these thefts are born.
translation:
  language: hi
  text: मेरे बच्चे, झूठा मत बनो, क्योंकि झूठ चोरी की ओर ले जाता है। न धन के लोभी बनो, न व्यर्थ की प्रतिष्ठा की चाह रखो, क्योंकि इन सब से चोरियाँ जन्म लेती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: मेरे बच्चे
  rationale: स्नेहपूर्ण गुरु-शिष्य संबोधन को सहज और लिंग-समावेशी आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ψεύστης / τὸ ψεῦσμα
  choice: झूठा / झूठ
  rationale: पहला शब्द व्यक्ति के चरित्र और दूसरा झूठी बात या असत्य को दर्शाता है; हिन्दी में यह भेद स्वाभाविक रूप से रखा गया है।
- source_word: φιλάργυρος
  choice: धन के लोभी
  rationale: शाब्दिक अर्थ ‘चाँदी/धन से प्रेम करने वाला’ है; ‘धन के लोभी’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: κενόδοξος
  choice: खोखली प्रतिष्ठा के अभिलाषी
  rationale: κενός और δόξα के संयुक्त भाव—व्यर्थ, खोखली या निराधार महिमा/प्रतिष्ठा की चाह—को केवल ‘घमंडी’ कहकर संकुचित नहीं किया गया।
- source_word: κλοπαὶ γεννῶνται
  choice: चोरियाँ जन्म लेती हैं
  rationale: बहुवचन और जन्म लेने की मूल रूपकात्मक भाषा को सुरक्षित रखा गया है।
theological_decisions:
- issue: दुर्गुणों और चोरी के बीच कारणात्मक संबंध
  choice: ‘इन सब से चोरियाँ जन्म लेती हैं’
  alternative: ‘ये सब चोरी करवाते हैं’
  rationale: मूल यूनानी की रूपकात्मक और सामान्यीकृत अभिव्यक्ति को बनाए रखा गया है; इसे पूर्ण नियतिवादी दावा या प्रत्यक्ष प्रेरणार्थक कथन नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन स्नेहपूर्ण और उपदेशात्मक है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखा गया है। समानांतर निषेधों और अंतिम कारणवाचक खंड की संरचना सुरक्षित है।
