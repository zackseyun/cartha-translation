id: DID.3.10
reference: Didache 3:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰ συμβαίνοντά σοι ἐνεργήματα ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ Θεοῦ οὐδὲν γίνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/010.yaml
  text: You shall accept the things that happen to you as good, knowing that apart from God nothing happens.
translation:
  language: hi
  text: तुम्हारे साथ जो कुछ घटे, उसे अच्छा मानकर स्वीकार करना, यह जानते हुए कि परमेश्वर के बिना कुछ भी नहीं होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ συμβαίνοντά σοι ἐνεργήματα
  choice: तुम्हारे साथ जो कुछ घटे
  rationale: यह स्वाभाविक आधुनिक हिन्दी में व्यक्ति के साथ घटने वाली बातों या घटनाओं की व्यापकता व्यक्त करता है; ἐνεργήματα को अलग से कृत्रिम रूप में दोहराने के बजाय पूरे यूनानी पदबंध का समेकित अर्थ दिया गया है।
- source_word: ὡς ἀγαθὰ προσδέξῃ
  choice: उसे भला मानकर स्वीकार करना
  rationale: ὡς की ‘के रूप में/मानकर’ वाली शक्ति और προσδέχομαι के स्वागतपूर्वक स्वीकार करने के भाव को बनाए रखता है, बिना यह स्पष्ट किए कि घटनाएँ अपने आप में भली हैं या विश्वास की दृष्टि से भली मानी जानी हैं।
- source_word: εἰδὼς
  choice: क्योंकि तुम जानते हो
  rationale: कारणसूचक कृदंत को सहज हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: ἄτερ Θεοῦ
  choice: परमेश्वर के बिना
  rationale: यूनानी पदबंध का सीधा और जानबूझकर व्यापक अनुवाद; इसे ‘परमेश्वर की अनुमति के बिना’ या ‘इच्छा के बिना’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: οὐδὲν γίνεται
  choice: कुछ भी नहीं होता
  rationale: γίνεται के व्यापक ‘होना/घटना’ अर्थ और οὐδέν के पूर्ण निषेध को सरल हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर और घटने वाली हर बात के संबंध का कथन
  choice: परमेश्वर के बिना कुछ भी नहीं होता
  alternative: परमेश्वर की अनुमति के बिना कुछ भी नहीं होता
  rationale: मूल पाठ केवल ἄτερ Θεοῦ कहता है। ‘अनुमति’ जोड़ना एक विशिष्ट व्याख्या होगी और कथन में निहित धर्मवैचारिक तनाव को समय से पहले हल कर देगा।
- issue: घटनाओं को भला स्वीकार करने का अर्थ
  choice: भला मानकर स्वीकार करना
  alternative: भली घटनाओं के रूप में स्वीकार करना
  rationale: 'यह ὡς ἀγαθὰ की वास्तविक अस्पष्टता बचाता है: कथन घटनाओं की अंतर्निहित भलाई अथवा उन्हें भली दृष्टि से ग्रहण करने—दोनों की ओर संकेत कर सकता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन अनौपचारिक ‘तुम’ का प्रयोग आसपास के उपदेशात्मक संबोधन के अनुरूप है। भाषा सरल, गरिमापूर्ण और आज्ञार्थक है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
