source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου οἰωνοσκόπος· ἐπειδὴ ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν· μηδὲ ἐπαοιδὸς μηδὲ μαθηματικὸς μηδὲ περικαθαίρων, μηδὲ θέλε αὐτὰ βλέπειν· ἐκ γὰρ τούτων ἁπάντων εἰδωλολατρεία γεννᾶται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/004.yaml
  text: My child[a], do not become an observer of omens, because it leads to idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look at these things; for from all these idolatry is born.
translation:
  language: hi
  text: मेरे बच्चे, शकुन-विचार करनेवाले मत बनो, क्योंकि यह मूर्तिपूजा की ओर ले जाता है; न जादुई मंत्र बोलनेवाले, न ज्योतिषी, न शुद्धिकरण के अनुष्ठान करनेवाले बनो, और न इन बातों को देखने की इच्छा रखो; क्योंकि इन सबसे मूर्तिपूजा उत्पन्न होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰωνοσκόπος
  choice: शकुन-विचार करनेवाला
  rationale: यह शब्द शकुन देखकर उनका अर्थ निकालनेवाले व्यक्ति को सूचित करता है; आधुनिक हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: ἐπαοιδός
  choice: मंत्र-तंत्र करनेवाला
  rationale: शब्द जादुई मंत्र या अभिचार करनेवाले के लिए है; केवल ‘मंत्र पढ़नेवाला’ सकारात्मक धार्मिक पाठ का भ्रम दे सकता था।
- source_word: μαθηματικός
  choice: ज्योतिषी
  rationale: उत्तरकालीन यूनानी प्रयोग में यहाँ गणितज्ञ नहीं, ज्योतिष-विद्या का अभ्यासी अभिप्रेत है।
- source_word: περικαθαίρων
  choice: शुद्धिकरण के अनुष्ठान करनेवाला
  rationale: यह कर्मकांडीय अथवा जादुई शुद्धिकरण करनेवाले को दर्शाता है; ‘शुद्ध करनेवाला’ संदर्भ से अधिक व्यापक होता।
- source_word: βλέπειν
  choice: देखने
  rationale: मूल क्रिया का सीधा अर्थ बनाए रखा गया है; संदर्भ में इन गुप्त प्रथाओं, संकेतों या उनसे जुड़ी वस्तुओं की ओर देखने का आशय है।
- source_word: εἰδωλολατρεία
  choice: मूर्तिपूजा
  rationale: यह प्रचलित और सामान्यतः समझा जानेवाला हिन्दी धार्मिक पद है।
theological_decisions:
- issue: गुप्त या शकुन-संबंधी प्रथाओं और मूर्तिपूजा का संबंध
  choice: ‘मूर्तिपूजा की ओर ले जाता है’ और ‘मूर्तिपूजा जन्म लेती है’
  alternative: इन प्रथाओं को स्वयं ही मूर्तिपूजा कहना
  rationale: मूल पाठ कारण और परिणाम का संबंध व्यक्त करता है; वह दोनों को बिना भेद के एक ही वस्तु घोषित नहीं करता।
- issue: αὐτὰ का संकेत
  choice: ‘इन बातों’
  alternative: ‘इन लोगों’
  rationale: αὐτὰ नपुंसकलिंग बहुवचन है और पहले उल्लिखित पुरुष अभ्यासियों की अपेक्षा उन प्रथाओं, शकुनों या संबद्ध वस्तुओं की ओर संकेत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, उपदेशात्मक किंतु सहज और गरिमापूर्ण रखी गई है। ‘मेरे बच्चे’ संबोधन का आत्मीय शिक्षक-शिष्य भाव बनाए रखता है। सूची की यूनानी संरचना को हिन्दी में स्पष्ट निषेधात्मक क्रम के साथ प्रस्तुत किया गया है।
