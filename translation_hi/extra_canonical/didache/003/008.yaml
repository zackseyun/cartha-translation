language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γίνου μακρόθυμος καὶ ἐλεήμων καὶ ἄκακος καὶ ἡσύχιος καὶ ἀγαθὸς καὶ τρέμων τοὺς λόγους διὰ παντός, οὓς ἤκουσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/008.yaml
  text: Be patient and merciful and guileless and quiet and good[a], and always trembling at the words that you heard.
translation:
  language: hi
  text: धैर्यवान, दयालु, निष्कपट, शांत और भले बनो, और जो वचन तुमने सुने हैं, उन वचनों से सदा काँपते रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γίνου
  choice: बनो
  rationale: वर्तमान मध्यवाच्य आज्ञार्थक यहाँ निरंतर आचरण या स्वभाव अपनाने की आज्ञा देता है; ‘बनो’ हिन्दी में स्वाभाविक है और ‘हो जाओ’ से कम आकस्मिक परिवर्तन सूचित करता है।
- source_word: μακρόθυμος
  choice: धीरजवन्त
  rationale: यह दीर्घ सहनशीलता और क्रोध में धीमे होने का भाव रखता है; ‘धीरजवन्त’ इसे संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: दया दिखाने वाले स्वभाव का सीधा और सामान्य हिन्दी रूप।
- source_word: ἄκακος
  choice: निष्कपट
  rationale: शाब्दिकतः ‘बुराई से रहित/अहानिकर’; इस नैतिक सूची में ‘निष्कपट’ छल और दुर्भाव से रहित स्वभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡσύχιος
  choice: शांत
  rationale: शांत, स्थिर और कलह से दूर स्वभाव का सहज आधुनिक हिन्दी रूप।
- source_word: ἀγαθὸς
  choice: भले
  rationale: व्यक्ति के नैतिक रूप से अच्छे स्वभाव के लिए ‘भला’ अधिक स्वाभाविक है।
- source_word: τρέμων
  choice: काँपते रहो
  rationale: वर्तमान कृदन्त γίνου के साथ निरंतर श्रद्धापूर्ण भय की अवस्था बताता है; ‘रहो’ इसकी सततता व्यक्त करता है।
- source_word: τοὺς λόγους
  choice: वचन
  rationale: यह पहले सुनी हुई शिक्षाओं या कथनों को सूचित करता है; ‘वचन’ धार्मिक-नैतिक संदर्भ में गरिमापूर्ण और समझने योग्य है।
- source_word: διὰ παντός
  choice: सदा
  rationale: निरंतरता का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: οὓς ἤκουσας
  choice: जो वचन तुमने सुने हैं
  rationale: यूनानी अओरिस्ट पूर्व में सुनने की घटना बताता है; हिन्दी पूर्ण भूत ‘सुने हैं’ उस शिक्षा की वर्तमान प्रासंगिकता को स्वाभाविक ढंग से रखता है, बिना अर्थ को सिद्धान्तगत रूप से बढ़ाए।
theological_decisions:
- issue: वचनों के सामने ‘काँपना’
  choice: रूपक को अक्षुण्ण रखते हुए ‘उनके सामने सदा काँपते रहो’
  alternative: ‘उनका सदा श्रद्धापूर्वक भय मानो’
  rationale: ‘काँपना’ मूल के तीव्र देहात्मक रूपक और भय-श्रद्धा के तनाव को सुरक्षित रखता है; व्याख्यात्मक नरमी से इसे केवल सम्मान में नहीं बदला गया।
- issue: ἄκακος का नैतिक आशय
  choice: निष्कपट
  alternative: अहानिकर / निर्दोष
  rationale: शब्द में बुराई और हानि से रहित होने की व्यापकता है। संदर्भ में ‘निष्कपट’ सहज है, यद्यपि यह पूरी अर्थ-सीमा को समाप्त नहीं करता; किसी विशिष्ट सिद्धान्तगत अर्थ को नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन आत्मीय/सामान्य संबोधन ‘तुम’ के साथ। शैली संक्षिप्त, उपदेशात्मक और गरिमापूर्ण रखी गई है। विशेषणों की क्रमावली तथा अंतिम कृदन्तीय आज्ञा का प्रवाह मूल के निकट रखा गया है।
