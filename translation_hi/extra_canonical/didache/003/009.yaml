source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐχ ὑψώσεις σεαυτὸν οὐδὲ δώσεις τῇ ψυχῇ σου θράσος. Οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν, ἀλλὰ μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
translation:
  language: hi
  text: अपने आप को ऊँचा न उठाना, और अपने मन में धृष्टता न आने देना। तुम्हारा मन ऊँचे लोगों से न जुड़े, बल्कि धर्मी और नम्र लोगों के साथ संगति रखना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψώσεις σεαυτόν
  choice: अपने आपको ऊँचा न उठाना
  rationale: यह यूनानी रूपक को बनाए रखते हुए आत्म-महिमा या स्वयं को बड़ा मानने का स्वाभाविक हिन्दी निषेध है।
- source_word: ψυχή
  choice: मन
  rationale: इस प्रसंग में ψυχή व्यक्ति के भीतर की प्रवृत्ति या अभिलाषा को दर्शाता है; ‘मन’ सामान्य हिन्दी में दोनों वाक्यों में स्वाभाविक और सुबोध है।
- source_word: θράσος
  choice: ढिठाई
  rationale: θράσος यहाँ सकारात्मक साहस से अधिक धृष्ट आत्मविश्वास का भाव रखता है; ‘ढिठाई’ उस नकारात्मक अर्थ को संक्षेप में व्यक्त करती है।
- source_word: ὑψηλῶν
  choice: ऊँचे लोगों
  rationale: मूल का रूपक और उसकी संभावित सामाजिक अथवा आत्म-अभिमानी अर्थच्छाया सुरक्षित रखी गई है; इसे केवल ‘घमंडी’ कहकर संकुचित नहीं किया गया।
- source_word: ἀναστραφήσῃ
  choice: मेल-जोल रखना
  rationale: क्रिया का आशय लोगों के बीच उठने-बैठने और संगति करने से है; यह आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: ‘ऊँचे लोगों’ की पहचान
  choice: ऊँचे लोगों
  alternative: घमंडी लोगों / उच्च पदवालों
  rationale: ὑψηλοί में अभिमान, प्रतिष्ठा या सामाजिक ऊँचाई की अर्थच्छायाएँ हो सकती हैं। अनुवाद ने इस वास्तविक अस्पष्टता को किसी एक व्याख्या में नहीं बाँधा।
- issue: δικαίων καὶ ταπεινῶν का संबंध
  choice: धर्मी और दीन लोगों
  alternative: धर्मी लोगों और दीन लोगों
  rationale: दोनों विशेषण एक ही समूह या निकटवर्ती गुणों वाले लोगों को सूचित कर सकते हैं। सहज समन्वय मूल की संरचना को पर्याप्त रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आज्ञात्मक निषेध की एकरूप शैली रखी गई है। भाषा dignified किन्तु सामान्य पाठक के लिए सुबोध है; ‘दीन’ नैतिक नम्रता और नीची अवस्था दोनों की अर्थच्छाया रख सकता है।
