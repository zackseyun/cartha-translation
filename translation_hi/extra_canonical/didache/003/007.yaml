base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/007.yaml
  text: But be meek, because the meek will inherit the earth.
translation:
  language: hi
  text: परन्तु नम्र बनो, क्योंकि नम्र लोग पृथ्वी के वारिस होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραΰς / πραεῖς
  choice: नम्र / नम्र लोग
  rationale: यह शब्द दीनता या दुर्बलता नहीं, बल्कि सौम्यता, विनम्रता और संयमित स्वभाव व्यक्त करता है; ‘नम्र’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: κληρονομήσουσι
  choice: अधिकारी होंगे
  rationale: यूनानी क्रिया का मूल अर्थ विरासत में पाना है। ‘पृथ्वी के अधिकारी होंगे’ हिन्दी बाइबलीय प्रयोग में इस विरासत और भावी अधिकार—दोनों को सहज रूप से व्यक्त करता है।
- source_word: τὴν γῆν
  choice: पृथ्वी
  rationale: γῆ का अर्थ ‘भूमि’ या ‘पृथ्वी’ दोनों हो सकता है। यहाँ भजन 37:11 की प्रतिध्वनि और कथन की व्यापकता को बनाए रखने के लिए ‘पृथ्वी’ चुना गया है।
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यहाँ कारणसूचक संबंध स्पष्ट है; ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक रूप से आदेश का आधार बताता है।
theological_decisions:
- issue: ‘पृथ्वी’ बनाम ‘देश/भूमि’
  choice: पृथ्वी
  alternative: भूमि के वारिस होंगे
  rationale: पाठ में γῆ की अर्थगत व्यापकता को संकीर्ण किए बिना भजन-संबंधी प्रतिध्वनि बनाए रखी गई है। किसी विशिष्ट भूभाग या केवल परलोक-संबंधी अर्थ को आरोपित नहीं किया गया।
- issue: κληρονομέω में विरासत और अधिकार का संबंध
  choice: अधिकारी होंगे
  alternative: विरासत में पृथ्वी पाएँगे
  rationale: चुना हुआ वाक्यांश हिन्दी में स्वाभाविक और पारंपरिक है, जबकि भावी प्राप्ति को व्यक्त करता है; इसे राजनीतिक प्रभुत्व या निजी संपत्ति तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, उपदेशात्मक और गरिमापूर्ण रूप। ‘परन्तु’ δέ के हल्के विरोध/संक्रमण को दर्शाता है। कोई पादटिप्पणी आवश्यक नहीं है।
