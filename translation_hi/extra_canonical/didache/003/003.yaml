  text: Τέκνον μου, μὴ γίνου ἐπιθυμητής· ὁδηγεῖ γὰρ ἡ ἐπιθυμία πρὸς τὴν πορείαν· μηδὲ αἰσχρολόγος μηδὲ ὑψηλοόφθαλμος· ἐκ γὰρ τούτων ἀπάντων μοιχεῖαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/003.yaml
  text: My child[a], do not become lustful, for lust leads to sexual immorality; nor foul-mouthed, nor haughty, for from all these adulteries are born.
translation:
  language: hi
  text: मेरे बच्चे, कामुक मत बनो, क्योंकि कामना यौन अनैतिकता की ओर ले जाती है; न अश्लील बातें मत करो, न अभिमानी दृष्टि रखो[a], क्योंकि इन सब से व्यभिचार उत्पन्न होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ “ऊँची आँखों वाला” है और इसका अर्थ “घमंडी” हो सकता है। इस प्रसंग में इसे कामुक या भटकती दृष्टि के अर्थ में भी समझा गया है।
    reason: ὑψηλοόφθαλμος के शाब्दिक, सामान्य और संदर्भगत संभावित अर्थों को बिना किसी एक व्याख्या को निश्चित किए सुरक्षित रखना।
lexical_decisions:
- source_word: ἐπιθυμητής / ἐπιθυμία
  choice: वासना के वश में रहनेवाला / वासना
  rationale: इस प्रसंग में इच्छा स्पष्टतः यौन लालसा है; यह रूप आधुनिक हिन्दी में अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: πορείαν (प्रस्तुत OCR; मानक पाठ में πορνείαν)
  choice: यौन अनैतिकता
  rationale: वाक्य का प्रसंग और दिदाखे का प्रमाणित यूनानी पाठ πορνείαν का समर्थन करते हैं; प्रस्तुत πορείαν संभवतः OCR में ν छूटने से बना है। ‘यौन अनैतिकता’ πορνεία के व्यापक अर्थ को रखता है।
- source_word: αἰσχρολόγος
  choice: अश्लील बातें करनेवाला
  rationale: यह अशोभनीय या अश्लील वाणी बोलनेवाले व्यक्ति को सूचित करता है; सामान्य पाठक के लिए यह सहज है।
- source_word: ὑψηλοόφθαλμος
  choice: बुरी नज़र रखनेवाला
  rationale: शाब्दिक अर्थ ‘ऊँची आँखों वाला’ है, पर इस यौन संदर्भ में इसे कामुक दृष्टि रखने के अर्थ में समझा जा सकता है। मुख्य पाठ संदर्भगत अर्थ देता है और पाद-टिप्पणी वैकल्पिक ‘घमंडी’ अर्थ सुरक्षित रखती है।
- source_word: μοιχεῖαι
  choice: व्यभिचार
  rationale: बहुवचन यूनानी रूप को ‘व्यभिचार जन्म लेते हैं’ द्वारा असामान्य किंतु अर्थपूर्ण रूप में बनाए रखा गया है।
theological_decisions:
- issue: ὑψηλοόφθαλμος का नैतिक आशय
  choice: 'मुख्य पाठ में कामुक दृष्टि: ‘बुरी नज़र रखनेवाला’'
  alternative: ‘घमंडी’ अथवा शाब्दिक ‘ऊँची आँखों वाला’
  rationale: वासना, अश्लील वाणी और उनसे उत्पन्न व्यभिचार की श्रृंखला कामुक दृष्टि के अर्थ का समर्थन करती है, पर शब्द का अहंकार-संबंधी अर्थ संभव है; इसलिए उसे पाद-टिप्पणी में रखा गया है।
- issue: πορείαν बनाम πορνείαν
  choice: πορνείαν के अनुसार ‘यौन अनैतिकता’
  alternative: प्रस्तुत OCR πορείαν के अनुसार ‘यात्रा/मार्ग’
  rationale: ‘वासना यात्रा की ओर ले जाती है’ प्रसंग और ज्ञात दिदाखे पाठ में असंगत है; यह लगभग निश्चित OCR त्रुटि है।
