  text: Then the world will see the Lord coming upon the clouds of heaven.j
translation:
  language: hi
  text: तब संसार प्रभु को आकाश के बादलों पर आते हुए देखेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह समय-सूचक क्रियाविशेषण पूर्ववर्ती घटनाओं के बाद घटने वाली घटना को दर्शाता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यहाँ κόσμος सामूहिक रूप से मानव-जगत को सूचित करता है; ‘संसार’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: τὸν Κύριον
  choice: प्रभु को
  rationale: Κύριος के लिए प्रतिष्ठित, गरिमापूर्ण और धार्मिक रूप से तटस्थ हिन्दी पद।
- source_word: ἐρχόμενον
  choice: आते हुए
  rationale: वर्तमान कृदन्त को प्रत्यक्ष दर्शन के साथ चल रही क्रिया के रूप में रखा गया है।
- source_word: ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: आकाश के बादलों पर
  rationale: ग्रीक संबंध को निकटता से सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है; ἐπάνω के स्थानिक अर्थ को ‘पर’ व्यक्त करता है।
theological_decisions:
- issue: प्रभु के आगमन का दृश्य स्वरूप
  choice: ‘देखेगा’ और ‘आते हुए’ को स्पष्ट रखा गया
  alternative: इसे रूपकात्मक या केवल प्रकट होने के अर्थ में ढालना
  rationale: मूल पाठ प्रत्यक्ष रूप से संसार द्वारा प्रभु को आते हुए देखने की बात करता है; अनुवाद इसकी व्याख्या नहीं करता।
- issue: बादलों के साथ स्थानिक संबंध
  choice: ‘बादलों पर’
  alternative: ‘बादलों के साथ’ या ‘बादलों में’
  rationale: ἐπάνω का सीधा अर्थ ‘ऊपर/पर’ है; इसलिए मूल की चित्रात्मकता और संभावित शास्त्रीय प्रतिध्वनि सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। किसी पादटिप्पणी की आवश्यकता नहीं है।
