source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ πάντων δέ, ἀλλ᾽ ὡς ἐρρέθη· Ἥξει ὁ Κύριος καὶ πάντες οἱ ἅγιοι μετ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/007.yaml
  text: 'but not of all, but as it was said: The Lord will come, and all the holy ones with him.'
translation:
  language: hi
  text: 'पर सबका नहीं, बल्कि जैसा कहा गया है: “प्रभु आएगा, और उसके साथ सभी पवित्र जन[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पवित्र जन” से परमेश्वर के पवित्र लोग या स्वर्गीय प्राणी अभिप्रेत हो सकते हैं।
    reason: यूनानी οἱ ἅγιοι की वास्तविक संदर्भगत अस्पष्टता को पाठक के सामने बनाए रखना।
lexical_decisions:
- source_word: οὐ πάντων
  choice: सबका नहीं
  rationale: यह संक्षिप्त अभिव्यक्ति यूनानी पाठ के खंडात्मक रूप को बनाए रखती है और पूर्ववर्ती प्रसंग से जुड़े अर्थ को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: ὡς ἐρρέθη
  choice: जैसा कहा गया है
  rationale: अव्यक्त कर्ता वाले यूनानी वाक्यांश का सहज और निकट हिन्दी रूप।
- source_word: οἱ ἅγιοι
  choice: पवित्र जन
  rationale: यह बहुवचन संज्ञात्मक विशेषण का स्वाभाविक हिन्दी रूप है और मनुष्यों अथवा स्वर्गीय प्राणियों के बीच संभावित संदर्भगत अस्पष्टता को खुला रखता है।
theological_decisions:
- issue: οὐ πάντων में निहित संदर्भ
  choice: सबका नहीं
  alternative: सभी मरे हुओं का पुनरुत्थान नहीं होगा
  rationale: मूल पद स्वयं केवल संक्षिप्त रूप में ‘सबका नहीं’ कहता है; स्पष्ट संज्ञा जोड़ने से पाठ की वास्तविक संक्षिप्तता और संभावित व्याख्यात्मक तनाव समाप्त हो जाता।
- issue: ‘पवित्र जन’ की पहचान
  choice: किसी एक समूह की पहचान निश्चित नहीं की गई
  alternative: पवित्र स्वर्गदूत / परमेश्वर के पवित्र लोग
  rationale: οἱ ἅγιοι दोनों प्रकार के संदर्भ ग्रहण कर सकता है; अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; उद्धरण की लय बनाए रखते हुए मूल यूनानी की संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई है।
