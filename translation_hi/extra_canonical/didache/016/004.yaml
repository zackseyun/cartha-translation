source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
translation:
  language: hi
  text: क्योंकि अधर्म बढ़ने पर वे एक-दूसरे से घृणा करेंगे, एक-दूसरे को सताएँगे और एक-दूसरे को सौंप देंगे। तब संसार को धोखा देनेवाला परमेश्वर के पुत्र के रूप में प्रकट होगा और चिन्ह और चमत्कार करेगा। पृथ्वी उसके हाथों में सौंप दी जाएगी, और वह ऐसे निषिद्ध काम करेगा, जो युग के आरम्भ से कभी नहीं हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομίας
  choice: अधर्म
  rationale: यह शब्द व्यवस्था-विरोध, नैतिक दुष्टता और ईश्वरीय मर्यादा के उल्लंघन को समेटता है; आधुनिक हिन्दी में ‘अधर्म’ संक्षिप्त और स्वाभाविक है।
- source_word: παραδώσουσι
  choice: पकड़वाएँगे
  rationale: इस प्रसंग में मनुष्यों द्वारा एक-दूसरे को शत्रुओं या अधिकारियों के हाथ सौंप देने का भाव है; ‘पकड़वाएँगे’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: κοσμοπλάνος
  choice: संसार को भरमानेवाला
  rationale: संयुक्त शब्द κόσμος + πλάνος का अर्थ संसार को धोखे में डालनेवाला है; वर्णनात्मक अनुवाद अर्थ को स्पष्ट रखता है।
- source_word: ὡς υἱὸς Θεοῦ
  choice: परमेश्वर के पुत्र के रूप में
  rationale: ὡς के ‘के रूप में/मानो’ भाव को बनाए रखता है और यह तय नहीं करता कि दावा वास्तविक है या छलपूर्ण।
- source_word: σημεῖα καὶ τέρατα
  choice: चिन्ह और चमत्कार
  rationale: दोनों अलग यूनानी पदों को पारंपरिक किंतु आज भी समझ में आनेवाले युग्म से व्यक्त किया गया है।
- source_word: ἀθέμιτα
  choice: घोर अनुचित काम
  rationale: शब्द निषिद्ध, मर्यादा-विरुद्ध और विधि-विरुद्ध कृत्यों का बोध देता है; ‘घोर’ इसकी प्रबल नकारात्मकता को व्यक्त करता है।
- source_word: ἐξ αἰῶνος
  choice: युग के आरम्भ से
  rationale: स्रोत की काल-संबंधी अभिव्यक्ति को निकटता से रखता है और उसे अनावश्यक रूप से ‘सृष्टि के आरम्भ’ नहीं बनाता।
theological_decisions:
- issue: ὡς υἱὸς Θεοῦ में छलपूर्ण समानता या प्रत्यक्ष दावा
  choice: ‘परमेश्वर के पुत्र के रूप में’
  alternative: ‘मानो वह परमेश्वर का पुत्र हो’
  rationale: 'चुना हुआ रूप मूल की अस्पष्टता बचाता है: वह ऐसा दिखाई देगा या ऐसा दावा करेगा, पर अनुवाद उसकी वास्तविक पहचान घोषित नहीं करता।'
- issue: γῆ का अर्थ भूमि या समूची पृथ्वी
  choice: ‘पृथ्वी’
  alternative: ‘देश/भूमि’
  rationale: संसार को भरमानेवाले के व्यापक संदर्भ और सामान्य प्रलयकालीन भाषा के अनुरूप ‘पृथ्वी’ उचित है, यद्यपि यूनानी शब्द अपने आप में ‘भूमि’ भी हो सकता है।
- issue: परस्परता की सीमा
  choice: तीनों क्रियाओं के साथ ‘एक-दूसरे’ का भाव
  alternative: केवल घृणा के साथ स्पष्ट परस्परता
  rationale: ἀλλήλους व्याकरणतः पहले क्रिया के साथ आता है, पर समन्वित क्रियाओं में उसका भाव आगे भी स्वाभाविक रूप से चलता है; हिन्दी में इसे स्पष्ट करना अर्थ को सुबोध बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। छोटे वाक्यों में विभाजन पठनीयता बढ़ाता है, जबकि γάρ का कारणसूचक संबंध ‘क्योंकि’ से सुरक्षित है। किसी सम्प्रदाय-विशेष की पारिभाषिक व्याख्या नहीं जोड़ी गई।
