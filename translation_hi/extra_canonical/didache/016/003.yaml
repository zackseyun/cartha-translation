source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν γὰρ ταῖς ἐσχάταις ἡμέραις πληθυνθήσονται οἱ ψευδοπροφῆται καὶ οἱ φθορεῖς καὶ στραφήσονται τὰ πρόβατα εἰς λύκους καὶ ἡ ἀγάπη στραφήσεται εἰς μῖσος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/003.yaml
  text: For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred.
translation:
  language: hi
  text: क्योंकि अंतिम दिनों में झूठे भविष्यवक्ता और भ्रष्ट करनेवाले बढ़ जाएँगे; भेड़ें भेड़िये बन जाएँगी, और प्रेम घृणा में बदल जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: अंतिम दिनों में
  rationale: यूनानी काल-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πληθυνθήσονται
  choice: बहुत हो जाएँगे
  rationale: मात्र संख्या बढ़ने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ ψευδοπροφῆται
  choice: झूठे भविष्यवक्ता
  rationale: ψευδο- और προφῆται दोनों घटकों को स्पष्ट रखते हुए प्रचलित धार्मिक शब्दावली अपनाई गई है।
- source_word: οἱ φθορεῖς
  choice: भ्रष्ट करनेवाले
  rationale: कर्ता-संज्ञा के सक्रिय अर्थ—दूसरों को बिगाड़ने या भ्रष्ट करनेवाले—को बनाए रखता है।
- source_word: στραφήσονται τὰ πρόβατα εἰς λύκους
  choice: भेड़ें भेड़िये बन जाएँगी
  rationale: εἰς के परिणामसूचक रूपांतरण को स्वाभाविक हिन्दी में व्यक्त करता है; इसे केवल किसी बाहरी शक्ति द्वारा मोड़े जाने के अर्थ तक सीमित नहीं करता।
- source_word: ἡ ἀγάπη στραφήσεται εἰς μῖσος
  choice: प्रेम घृणा में बदल जाएगा
  rationale: ἀγάπη और μῖσος के तीखे विरोध तथा रूपांतरण की छवि को संक्षिप्त रूप में सुरक्षित रखता है।
theological_decisions:
- issue: भेड़ों के भेड़िये बनने में वाच्य और कर्तृत्व
  choice: भेड़ें भेड़िये बन जाएँगी
  alternative: भेड़ों को भेड़ियों में बदल दिया जाएगा
  rationale: यूनानी στραφήσονται रूपात्मक रूप से कर्मवाच्य हो सकता है, पर इस प्रयोग में अकर्मक रूपांतरण का अर्थ भी स्वाभाविक है। चुना हुआ रूप परिवर्तन को स्पष्ट रखता है और किसी अनुल्लिखित कर्ता को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गंभीर और सार्वजनिक पाठ के योग्य रूप; समानांतर वाक्य-संरचना तथा मूल के प्रलयकालीन तनाव को बनाए रखा गया है।
