source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/006.yaml
  text: 'And then the signs of the truth will appear: first[a], a sign of an opening in heaven; then a sign of the sound of a trumpet; and the third[b], the resurrection of the dead—'
translation:
  language: hi
  text: 'और तब सत्य के चिह्न प्रकट होंगे: पहला, आकाश में फैलाव[a] का चिह्न; फिर तुरही की ध्वनि का चिह्न; और तीसरा, मरे हुओं का जी उठना—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फैलाए जाने’ अथवा ‘तान दिए जाने’ का। यूनानी शब्द का आशय किसी वस्तु के फैलने या पसारे जाने से है; यहाँ उसका ठीक स्वरूप स्पष्ट नहीं है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐκπετάσεως
  choice: फैलाव
  rationale: यह शब्द ἐκπετάννυμι से बना है और फैलाने, पसारने या तानने का भाव रखता है। ‘फैलाव’ मूल अर्थ को बनाए रखते हुए हिन्दी में संक्षिप्त और स्वाभाविक है; इसे बिना पर्याप्त आधार केवल आकाश के ‘खुलने’ के रूप में निश्चित नहीं किया गया।
- source_word: φωνῆς σάλπιγγος
  choice: तुरही की ध्वनि
  rationale: वाद्य के संदर्भ में φωνή उसकी आवाज़ या ध्वनि को दर्शाता है। ‘तुरही की ध्वनि’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: ἀνάστασις νεκρῶν
  choice: मरे हुओं का जी उठना
  rationale: यह अभिव्यक्ति मृतकों के पुनः उठने को बताती है। ‘जी उठना’ सामान्य पाठकों के लिए सहज है और ‘पुनरुत्थान’ की अपेक्षा कम पारिभाषिक होते हुए भी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ἐκπέτασις के संकेत की पहचान
  choice: इसे ‘फैलाव’ के रूप में अनिर्दिष्ट रखा गया
  alternative: ‘आकाश का खुलना’ या ‘फैलाई हुई क्रूस-आकृति’
  rationale: यूनानी पाठ संकेत की वस्तु या स्वरूप स्पष्ट नहीं करता। अनुवाद किसी विशिष्ट अंत-कालीन या क्रूस-संबंधी व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- issue: मृतकों के जी उठने की सीमा
  choice: ‘मरे हुओं का जी उठना’
  alternative: ‘सभी मृतकों का जी उठना’ या केवल धर्मियों का जी उठना
  rationale: पाठ में πάντων जैसे सर्वसमावेशी विशेषण या किसी सीमित समूह का उल्लेख नहीं है, इसलिए दायरा खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल यूनानी की क्रमिक संरचना—‘पहला… फिर… तीसरा’—और अंत का अधूरा प्रवाह दर्शाने वाला दीर्घ डैश सुरक्षित रखा गया है।
