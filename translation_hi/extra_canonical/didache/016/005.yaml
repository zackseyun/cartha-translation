id: DID.16.5
reference: Didache 16:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/005.yaml
  text: Then the human creation will come into the fire of testing[a], and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.
translation:
  language: hi
  text: तब मानव-सृष्टि परीक्षा की अग्नि में आएगी, और बहुत-से लोग ठोकर खाएँगे और नष्ट हो जाएँगे; पर जो अपने विश्वास में धीरज से बने रहेंगे, वे उसी शाप के द्वारा बचाए जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम वाक्यांश कठिन है। यूनानी का सीधा रूप ‘उसी शाप के द्वारा’ है। इसकी असामान्य अभिव्यक्ति के कारण इसे व्याख्यात्मक रूप से ‘उसी शाप के नीचे से बचाए जाएँगे’ भी समझा गया है। कुछ व्याख्याएँ इसे किसी शापित व्यक्ति की ओर संकेत मानती हैं, पर यहाँ यूनानी संज्ञा नपुंसकलिंग है और उसका मूल अर्थ ‘शाप’ है।
    reason: ὑπ᾽ αὐτοῦ τοῦ καταθέματος में ὑπό + संबंधकारक का प्रत्यक्ष अर्थ साधन/कर्ता का है, जबकि वाक्यांश की असामान्यता ने पृथक्करणवाचक व्याख्या को जन्म दिया है। पादटिप्पणी दोनों को दर्ज करती है, पर ‘शापित व्यक्ति’ को व्याकरण-सिद्ध अर्थ नहीं ठहराती।
lexical_decisions:
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  choice: मानव-सृष्टि
  rationale: यूनानी पद का औपचारिक अर्थ ‘मनुष्यों की सृष्टि’ है; ‘मानव-सृष्टि’ उसे संक्षिप्त और स्वाभाविक रूप में रखता है तथा केवल ‘मानवजाति’ कहकर सृष्टि-संबंधी शब्द को मिटाता नहीं।
- source_word: τὴν πύρωσιν τῆς δοκιμασίας
  choice: परीक्षा की दहकती आग
  rationale: πύρωσις दहकने, अग्नि या अग्निमय कठिन परीक्षा का बोध देता है और δοκιμασία जाँच/परख का; यह रूपक और अर्थ दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: σκανδαλισθήσονται
  choice: ठोकर खाकर गिरेंगे
  rationale: क्रिया का मूल चित्र ठोकर खाने का है, जबकि प्रसंग विश्वास से गिरने की ओर संकेत करता है; संयुक्त अभिव्यक्ति दोनों पहलुओं को रखती है।
- source_word: ὑπομείναντες
  choice: अंत तक धीरज धरेंगे
  rationale: ὑπομένω संकट के नीचे टिके रहने और धीरज से सहने का अर्थ देता है; ‘अंत तक’ प्रसंगगत दृढ़ता स्पष्ट करता है, यद्यपि यूनानी में पृथक रूप से नहीं है।
- source_word: ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  choice: उसी शाप के द्वारा
  rationale: κατάθεμα नपुंसकलिंग संज्ञा ‘शाप’ है और αὐτοῦ τοῦ बलाघात देता है। ὑπό + संबंधकारक का सर्वाधिक सीधा रूप यहाँ साधन/कर्ता ‘के द्वारा’ है; असामान्य वाक्यांश की वास्तविक कठिनाई पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या अंतिम उद्धार का साधन ‘शाप’ है या अर्थ ‘शाप के नीचे से’ है?
  choice: मुख्य पाठ में ‘उसी शाप के द्वारा’
  alternative: ‘उसी शाप के नीचे से’ अथवा व्याख्यात्मक रूप से ‘उसी शापित जन के द्वारा’
  rationale: मुद्रित यूनानी में ὑπό के साथ संबंधकारक सामान्यतः ‘के द्वारा’ है और κατάθεμα का रूप ‘शाप’ है, ‘शापित व्यक्ति’ नहीं। फिर भी अर्थ असामान्य है और पृथक्करण का पाठ संभव माना गया है, इसलिए विकल्प को पादटिप्पणी में दिया गया है, किसी विशिष्ट मसीही पहचान को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मानव-सृष्टि’ और ‘परीक्षा की दहकती आग’ मूल के सृष्टि तथा अग्नि-रूपकों को बचाते हैं। अर्धविराम विरोधी खंड को स्पष्ट करता है।
