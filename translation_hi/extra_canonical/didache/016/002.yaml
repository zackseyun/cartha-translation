review_pass:
  verdict: revise
  source_fidelity: Draft closely follows the Greek. However, «प्राणों के लिए उचित» is less natural in contemporary Hindi and can suggest physical life-breath rather than the προσωπिक/आध्यात्मिक sense of ψυχαῖς. «तुम्हारी आत्माओं के लिए उपयुक्त» better conveys the source without adding interpretation. The passive force of τελειωθῆτε is retained by «सिद्ध किए न जाओ».
  naturalness: 'The revised wording uses more idiomatic modern Hindi: «बार-बार एकत्र हुआ करो» and «तुम्हारी आत्माओं के लिए उपयुक्त बातों को खोजते रहो». It retains the exhortative, communal register.'
  terminology: «आत्माओं» is the established and comprehensible Hindi rendering for ψυχαῖς in this context. «सिद्ध किए न जाओ» preserves the passive and the sense of being brought to completion/perfection, without specifying an agent or doctrinal mechanism.
  issues:
  - severity: low
    issue: «प्राणों के लिए उचित» is semantically and stylistically less suitable for ψυχαῖς.
    rationale: In modern standard Hindi, «प्राण» commonly evokes life-breath or life itself. «आत्मा» more naturally carries the personal/spiritual sense required here while maintaining the Greek plural.
  - severity: low
    issue: «इकट्ठे हुआ करो» is somewhat colloquial and less polished for the passage's elevated exhortative style.
    rationale: «एकत्र हुआ करो» is modern standard Hindi, preserves the recurring imperative sense, and suits the register.
  revised_text: और बार-बार एकत्र हुआ करो, और तुम्हारी आत्माओं के लिए उपयुक्त बातों को खोजते रहो; क्योंकि तुम्हारे विश्वास का पूरा समय तुम्हें लाभ नहीं देगा, यदि तुम अन्तिम समय में सिद्ध किए न जाओ।
  revised_footnotes: []
  revision_rationale: 'A limited stylistic and lexical revision improves contemporary Hindi idiom and clarifies the sense of ψυχαῖς, while preserving the Greek syntax and warning: frequent gathering, ongoing seeking, the insufficiency of the entire prior period of faith, the conditional clause, the passive verb, and the deliberately nonspecific «अन्तिम समय».'
