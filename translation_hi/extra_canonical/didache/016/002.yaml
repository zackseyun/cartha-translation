revisions:
- from: और बार-बार इकट्ठे हुआ करो और उन बातों की खोज में लगे रहो जो तुम्हारे प्राणों के लिए उचित हैं; क्योंकि तुम्हारे विश्वास का पूरा समय भी तुम्हें लाभ न देगा, यदि तुम अन्तिम समय में सिद्ध न किए जाओ।
  to: और बार-बार एकत्र हुआ करो, और तुम्हारी आत्माओं के लिए उपयुक्त बातों को खोजते रहो; क्योंकि तुम्हारे विश्वास का पूरा समय तुम्हें लाभ नहीं देगा, यदि तुम अन्तिम समय में सिद्ध किए न जाओ।
