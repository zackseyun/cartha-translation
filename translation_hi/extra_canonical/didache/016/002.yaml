id: DID.16.2
reference: Didache 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πυκνῶς δὲ συναχθήσεσθε ζητοῦντες τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν· οὐ γὰρ ὠφελήσει ὑμᾶς ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν, ἐὰν μὴ ἐν τῷ ἐσχάτῳ καιρῷ τελειωθῆτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/002.yaml
  text: And gather together often, seeking the things that are fitting for your souls; for the whole time of your faith will not profit you unless you are perfected in the last time.
translation:
  language: hi
  text: और बार-बार एकत्र हुआ करो, और तुम्हारी आत्माओं के लिए उपयुक्त बातों को खोजते रहो; क्योंकि तुम्हारे विश्वास का पूरा समय तुम्हें लाभ नहीं देगा, यदि तुम अन्तिम समय में सिद्ध किए न जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πυκνῶς
  choice: बार-बार
  rationale: यह क्रियाविशेषण सभाओं की अधिक आवृत्ति पर बल देता है; ‘बार-बार’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: συναχθήσεσθε
  choice: इकट्ठे हुआ करो
  rationale: यूनानी भविष्यत् रूप यहाँ आदेशात्मक बल रखता है। हिन्दी का यह प्रयोग निरन्तर सामुदायिक अभ्यास को सहज ढंग से व्यक्त करता है।
- source_word: ζητοῦντες
  choice: खोज में लगे रहो
  rationale: वर्तमान कृदन्त सतत प्रयत्न का भाव देता है; यह अनुवाद उस जारी खोज को बनाए रखता है।
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  choice: वे बातें जो तुम्हारे प्राणों के लिए उचित हैं
  rationale: ἀνήκοντα का अर्थ ‘उचित/अनुकूल/सम्बन्धित’ हो सकता है। ‘उचित’ मूल की नैतिक और आध्यात्मिक उपयुक्तता को बिना अधिक व्याख्या के व्यक्त करता है; ψυχαῖς के लिए ‘प्राणों’ मूल बहुवचन और आध्यात्मिक संदर्भ को बनाए रखता है।
- source_word: ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν
  choice: तुम्हारे विश्वास का पूरा समय
  rationale: मूल पदबंध को निकटता से रखते हुए विश्वास में बिताई समूची अवधि का भाव व्यक्त किया गया है।
- source_word: τελειωθῆτε
  choice: सिद्ध न किए जाओ
  rationale: निष्क्रिय रूप को सुरक्षित रखा गया है और क्रिया के पूर्णता तक पहुँचाए जाने के भाव को ‘सिद्ध किए जाओ’ से व्यक्त किया गया है।
- source_word: ἐν τῷ ἐσχάτῳ καιρῷ
  choice: अन्तिम समय में
  rationale: यह सीधा और स्वाभाविक अनुवाद है, जो ‘अन्तिम अवसर’, ‘अन्तकाल’ या किसी अधिक विशिष्ट व्याख्या को अनावश्यक रूप से नहीं थोपता।
theological_decisions:
- issue: अन्तिम समय में सिद्ध किए जाने और पूर्व विश्वास-काल के लाभ का सम्बन्ध
  choice: 'कारणात्मक चेतावनी को उसके कठोर मूल रूप में रखा गया: पूरा विश्वास-काल लाभ नहीं देगा यदि अन्तिम समय में सिद्ध न किए जाएँ।'
  alternative: इसे केवल ‘अन्त तक विश्वासयोग्य बने रहने’ या किसी विशिष्ट उद्धार-सिद्धान्त की भाषा में स्पष्ट करना।
  rationale: मूल पाठ परिणाम, साधन या ‘सिद्ध’ होने की ठीक प्रकृति नहीं बताता। इसलिए उसकी धार्मिक गंभीरता और अस्पष्टता दोनों सुरक्षित रखी गई हैं।
- issue: τελειωθῆτε में कर्तृत्व
  choice: निष्क्रिय ‘सिद्ध न किए जाओ’ रखा गया।
  alternative: ‘तुम सिद्ध न हो जाओ’ या ‘अपने आपको सिद्ध न करो’।
  rationale: यूनानी निष्क्रिय रूप सम्भावित दैवी कर्तृत्व का संकेत दे सकता है, पर उसे स्पष्ट रूप से नामित नहीं करता; हिन्दी में निष्क्रिय रचना यही खुलापन बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक उपदेशात्मक शैली रखी गई है। ‘प्राणों’ और ‘सिद्ध’ जैसे शब्द धार्मिक संदर्भ के अनुकूल हैं, फिर भी वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
