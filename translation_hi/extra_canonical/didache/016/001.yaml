id: DID.16.1
reference: Didache 16:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: hi
  text: अपने जीवन पर निगाह रखो।[a] अपने दीपक बुझने न दो और अपनी कमर ढीली न पड़ने दो,[b] बल्कि तैयार रहो; क्योंकि तुम नहीं जानते कि हमारा प्रभु किस घड़ी आ रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने जीवन के लिए सतर्क रहो।”
    reason: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν का अर्थ अपने जीवन के संबंध में जागरूक और चौकस रहना है; यूनानी में प्रयुक्त ‘जागते रहने’ का रूपक हिन्दी में अधिक स्वाभाविक निगरानी-संबंधी अभिव्यक्ति से दिया गया है।
  - marker: b
    text: अर्थात, यात्रा या काम के लिए कमर बाँधकर तैयार रहने के विपरीत, ढीले और असावधान न हो जाओ।
    reason: αἱ ὀσφύες ... μὴ ἐκλυέσθωσαν प्राचीन पहनावे और तत्परता का रूपक है। संक्षिप्त टिप्पणी रूपक की ऐतिहासिक पृष्ठभूमि स्पष्ट करती है, बिना उसका धार्मिक अर्थ निर्धारित किए।
lexical_decisions:
- source_word: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν
  choice: अपने जीवन के विषय में जागते रहो
  rationale: यह वाक्य सतर्क निगरानी का आदेश देता है। ‘अपने जीवन पर नज़र रखो’ भी संभव है, पर चुना गया रूप यूनानी रूपक और गंभीर आग्रह दोनों को बनाए रखता है।
- source_word: οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν
  choice: तुम्हारे दीपक बुझने न पाएँ
  rationale: निषेधात्मक आज्ञा और दीपक के रूपक को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν
  choice: तुम्हारी कमरें ढीली न हों
  rationale: ὀσφύες का शाब्दिक अर्थ ‘कमरें’ और ἐκλυέσθωσαν का भाव ढीला छोड़े जाने का है। प्राचीन तैयारी-संबंधी रूपक को मिटाकर केवल ‘लापरवाह न हो’ नहीं किया गया।
- source_word: γίνεσθε ἕτοιμοι
  choice: तैयार रहो
  rationale: चलती रहने वाली तत्परता के आदेश को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται
  choice: हमारा प्रभु किस घड़ी आ रहा है
  rationale: वर्तमानकालीन ἔρχεται को ‘आ रहा है’ से रखा गया है, जिससे प्रत्याशित आगमन की तात्कालिकता बनी रहती है।
theological_decisions:
- issue: प्रभु के आगमन का काल और स्वरूप
  choice: ‘आ रहा है’
  alternative: ‘आएगा’
  rationale: यूनानी पाठ वर्तमान काल ἔρχεται प्रयोग करता है। भविष्यकाल अधिक सहज हो सकता है, पर वह मूल की जीवंत और निकट प्रत्याशा को कुछ हद तक स्पष्ट करके सीमित कर देता।
- issue: जागते रहने के रूपकों की व्याख्या
  choice: दीपक और कमर के दोनों रूपक मुख्य पाठ में सुरक्षित रखे गए
  alternative: ‘सतर्क और तैयार रहो’ के रूप में अर्थ खोल देना
  rationale: मूल पाठ इन रूपकों की धर्मवैचारिक व्याख्या स्वयं नहीं देता; इसलिए किसी विशिष्ट अंत-कालीन या नैतिक अर्थ को थोपे बिना उनकी खुली अर्थ-सम्भावना बनाए रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामूहिक संबोधन अपनाया गया है। वाक्य की चेतावनीपूर्ण लय, दीपक और कमर के प्राचीन रूपक, तथा प्रभु के आगमन के वर्तमानकालीन तनाव को सुरक्षित रखा गया है।
