id: DID.7.3
reference: Didache 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ ἀμφότερα μὴ ἔχῃς, ἔκχεον εἰς τὴν κεφαλὴν τρὶς ὕδωρ εἰς ὄνομα Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/003.yaml
  text: But if you do not have either[a], pour water on the head three times in the name of the Father and of the Son and of the Holy Spirit.
translation:
  language: hi
  text: पर यदि इन दोनों में से कुछ भी तुम्हारे पास न हो[a], तो पिता और पुत्र और पवित्र आत्मा के नाम में सिर पर तीन बार जल उँडेलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि तुम्हारे पास दोनों न हों”; “दोनों” पिछले प्रसंग के दो विकल्पों की ओर संकेत करता है।
    reason: ἀμφότερα के संदर्भसूचक और कुछ हद तक संक्षिप्त स्वरूप को स्पष्ट करना, बिना मुख्य पाठ में उसका आशय जरूरत से अधिक निश्चित किए।
lexical_decisions:
- source_word: ἀμφότερα
  choice: इन दोनों में से कुछ भी
  rationale: यह नपुंसकलिंग बहुवचन पिछले प्रसंग में बताए गए दो विकल्पों की ओर संकेत करता है। हिंदी में यह प्रयोग ‘दोनों न हों’ की अपेक्षा अधिक स्वाभाविक है, जबकि संदर्भगत संकेत को खुला रखता है।
- source_word: ἔκχεον
  choice: उँडेलो
  rationale: आज्ञार्थक क्रिया का अर्थ जल को किसी सतह पर बहाकर डालना है; ‘उँडेलो’ सिर पर जल डालने की क्रिया को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: τρὶς
  choice: तीन बार
  rationale: यूनानी क्रियाविशेषण की सीधी और सहज अभिव्यक्ति।
- source_word: εἰς ὄνομα
  choice: के नाम में
  rationale: यह दीक्षा-सूत्र का स्वाभाविक हिंदी रूप है। यद्यपि εἰς का मूल दिशात्मक भाव हो सकता है, यहाँ कृत्रिम ‘नाम में प्रवेश कराते हुए’ जैसा रूप मूल की रूढ़ प्रयोगगत प्रकृति से अधिक अर्थ आरोपित करेगा।
- source_word: Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος
  choice: पिता और पुत्र और पवित्र आत्मा
  rationale: तीनों पदों और बार-बार आए καί को बनाए रखा गया है। यूनानी में लेख का न होना इन पदों को अनिश्चित नहीं बनाता; हिंदी में भी निश्चितता के लिए अलग लेख आवश्यक नहीं है।
theological_decisions:
- issue: εἰς ὄνομα का संस्कारगत अर्थ
  choice: के नाम में
  alternative: के नाम में प्रवेश कराते हुए / के नाम पर
  rationale: ‘के नाम में’ परिचित, अर्थ-संगत और पर्याप्त रूप से खुला है; यह वाक्यांश की धर्मवैज्ञानिक दिशा को किसी एक व्याख्या तक सीमित नहीं करता।
- issue: त्रित्वसूत्र में संबंधबोधक चिह्न की पुनरावृत्ति
  choice: पिता और पुत्र और पवित्र आत्मा के नाम में
  alternative: पिता के, पुत्र के और पवित्र आत्मा के नाम में
  rationale: ‘नाम’ एकवचन है और यूनानी में तीनों पद उसी एक ὄνομα पर आश्रित हैं। हिंदी का चुना हुआ रूप इस एकता को स्वाभाविक ढंग से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘तुम्हारे पास’ तथा ‘उँडेलो’ साधारण पाठक के लिए स्पष्ट हैं। मुख्य पाठ में [a] चिह्न सम्मिलित है और कोई अनावश्यक सांप्रदायिक शब्दावली नहीं जोड़ी गई।
