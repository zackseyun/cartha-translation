source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε· ταῦτα πάντα προειπόντες, βαπτίσατε εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος ἐν ὕδατι ζῶντι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
translation:
  language: hi
  text: 'बपतिस्मे के विषय में, इस प्रकार बपतिस्मा दो: पहले ये सब बातें कहने के बाद,[a] पिता और पुत्र और पवित्र आत्मा के नाम में बहते हुए जल में बपतिस्मा दो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले ये सब बातें बता देने के बाद।”
    reason: προειπόντες का मूल अर्थ पहले कहना या बताना है। यह विकल्प शिक्षात्मक संदर्भ व्यक्त करता है, पर ‘प्रचार करना’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ता।
lexical_decisions:
- source_word: βαπτίσματος / βαπτίσατε
  choice: बपतिस्मा / बपतिस्मा देना
  rationale: आरंभिक मसीही संस्कार के लिए आधुनिक हिन्दी में प्रचलित और पहचानने योग्य शब्दावली; आज्ञार्थक बहुवचन को स्वाभाविक निर्देशात्मक शैली में रखा गया है।
- source_word: προειπόντες
  choice: पहले कह लेने के बाद
  rationale: मूल क्रिया का अर्थ ‘पहले कहना’ है; यह ‘प्रचार करना’ जैसे अधिक विशिष्ट अर्थ को नहीं थोपता।
- source_word: εἰς τὸ ὄνομα
  choice: नाम में
  rationale: ग्रीक εἰς की दिशा-सूचक संरचना को यथासंभव बनाए रखता है और उसे केवल ‘नाम से’ या ‘के अधिकार पर’ बनाकर व्याख्यायित नहीं करता।
- source_word: ὕδατι ζῶντι
  choice: बहते हुए जल
  rationale: ‘जीवित जल’ प्राचीन प्रयोग में सामान्यतः बहते या प्रवाहित जल को दर्शाता है; हिन्दी में आशय स्पष्ट और स्वाभाविक करने के लिए यह रूप चुना गया।
theological_decisions:
- issue: त्रिएक बपतिस्मा-सूत्र
  choice: पिता और पुत्र और पवित्र आत्मा के नाम में
  alternative: पिता, पुत्र और पवित्र आत्मा के नाम में
  rationale: हर पद से पहले आए ग्रीक καὶ को बनाए रखने से सूत्र की लय और तीनों का पृथक उल्लेख सुरक्षित रहता है।
- issue: εἰς का अर्थ
  choice: नाम में
  alternative: नाम से / नाम पर
  rationale: मूल की वास्तविक संरचना और उसकी संभावित धार्मिक गहराई को बिना किसी एक व्याख्या में सीमित किए सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘करो’ की अपेक्षा ‘देना’ वाला रूप सामुदायिक नियमावली के स्वर में अधिक स्वाभाविक है। ‘बहते हुए जल’ सामान्य पाठक के लिए प्राचीन मुहावरे ‘जीवित जल’ का आशय स्पष्ट करता है।
