id: DID.7.4
reference: Didache 7:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ δὲ τοῦ βαπτίσματος προνηστευσάτω ὁ βαπτίζων καὶ ὁ βαπτιζόμενος καὶ εἴ τινες ἄλλοι δύνανται· κελεύσεις δὲ νηστεῦσαι τὸν βαπτιζόμενον πρὸ μιᾶς ἢ δύο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/004.yaml
  text: But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able; and you shall command the one being baptized to fast one or two days beforehand.
translation:
  language: hi
  text: पर बपतिस्मा से पहले, बपतिस्मा देनेवाला और बपतिस्मा लेनेवाला पहले से उपवास करें, और यदि कुछ अन्य लोग भी कर सकें, तो वे भी करें। तुम बपतिस्मा लेनेवाले को आज्ञा देना कि वह एक या दो दिन पहले से उपवास करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτίσματος / βαπτίζων / βαπτιζόμενος
  choice: बपतिस्मा / बपतिस्मा देनेवाला / बपतिस्मा लेनेवाला
  rationale: इन परस्पर संबंधित यूनानी रूपों को हिन्दी में एक ही परिचित शब्द-परिवार द्वारा व्यक्त किया गया है, जिससे क्रिया करनेवाले और ग्रहण करनेवाले का भेद स्पष्ट रहता है।
- source_word: προνηστευσάτω
  choice: पहले से उपवास करें
  rationale: उपसर्ग προ- में निहित पूर्वकालिकता को स्पष्ट करता है और हिन्दी में स्वाभाविक निर्देश देता है।
- source_word: εἴ τινες ἄλλοι δύνανται
  choice: यदि कुछ अन्य लोग भी कर सकें, तो वे भी करें
  rationale: सामर्थ्य पर आधारित वैकल्पिक सहभागिता को सुरक्षित रखता है; संदर्भ से ‘उपवास करना’ स्पष्ट है।
- source_word: κελεύσεις
  choice: तुम ... आज्ञा देना
  rationale: यूनानी भविष्यकाल यहाँ निर्देशात्मक बल रखता है; हिन्दी का यह प्रयोग आदेश की दृढ़ता और संबोधित एकवचन दोनों को व्यक्त करता है।
- source_word: πρὸ μιᾶς ἢ δύο
  choice: एक या दो दिन पहले से
  rationale: ‘दिन’ यूनानी में निहित है और काल-संबंधी वाक्यांश का स्वाभाविक अर्थ यही है; ‘पहले से’ उपवास के आरंभ को बपतिस्मा से एक या दो दिन पूर्व रखता है।
theological_decisions:
- issue: बपतिस्मा से पहले उपवास करनेवालों का दायरा
  choice: बपतिस्मा देनेवाला और लेनेवाला उपवास करें; समर्थ अन्य लोग भी करें
  alternative: सभी उपस्थित लोगों के लिए अनिवार्य उपवास
  rationale: मूल पाठ पहले दो व्यक्तियों के लिए निर्देश देता है, जबकि अन्य लोगों के विषय में δύνανται (‘कर सकें’) द्वारा सामर्थ्य की शर्त रखता है।
- issue: एक या दो दिन के उपवास का निर्देश
  choice: बपतिस्मा लेनेवाले को एक या दो दिन पहले से उपवास करने की आज्ञा
  alternative: पूरे एक या दो दिनों की निश्चित अवधि का उपवास
  rationale: πρὸ μιᾶς ἢ δύο संक्षिप्त और कुछ हद तक अनिर्दिष्ट है; अनुवाद समय को बपतिस्मा से पूर्व रखता है, पर उपवास की पूर्ण अवधि के बारे में मूल से अधिक कठोर विशिष्टता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बपतिस्मा’ हिन्दी मसीही प्रयोग में व्यापक रूप से परिचित है। एकवचन संबोधन के लिए ‘तुम’ और निर्देशात्मक ‘आज्ञा देना’ मूल के सीधे, सामुदायिक विधान-सदृश स्वर को बनाए रखते हैं।
