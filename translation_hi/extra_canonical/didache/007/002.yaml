  text: Ἐὰν δὲ μὴ ἔχῃς ὕδωρ ζῶν, εἰς ἄλλο ὕδωρ βάπτισον· εἰ δʼ οὐ δύνασαι ἐν ψυχρῷ, ἐν θερμῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/002.yaml
  text: But if you do not have living water, baptize in other water; and if you cannot in cold, then in warm.
translation:
  language: hi
  text: पर यदि तुम्हारे पास बहता हुआ पानी न हो, तो दूसरे पानी में बपतिस्मा दो; और यदि ठंडे पानी में न दे सको, तो गरम पानी में दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδωρ ζῶν
  choice: बहता हुआ पानी
  rationale: शाब्दिक अर्थ ‘जीवित पानी’ है, पर प्राचीन संदर्भ में यह सामान्यतः बहते पानी को दर्शाता है। आधुनिक हिन्दी में ‘बहता हुआ पानी’ इसका आशय स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: βάπτισον
  choice: बपतिस्मा दो
  rationale: यह द्वितीय पुरुष एकवचन आज्ञार्थक क्रिया है। ‘बपतिस्मा दो’ आधुनिक हिन्दी मसीही शब्दावली में स्वाभाविक है और क्रिया के आदेशात्मक बल को बनाए रखता है।
- source_word: εἰς ἄλλο ὕδωρ
  choice: किसी और पानी में
  rationale: इस संदर्भ में εἰς को हिन्दी में स्थानसूचक ‘में’ से व्यक्त करना अधिक स्वाभाविक है; ἄλλο का अर्थ उपलब्ध किसी अन्य प्रकार या स्रोत के पानी से है।
- source_word: ἐν ψυχρῷ ... ἐν θερμῷ
  choice: ठंडे पानी में ... गरम पानी में
  rationale: यूनानी में संज्ञा ‘पानी’ लुप्त है और विशेषणों से समझी जाती है। हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘पानी’ जोड़ा गया है।
theological_decisions:
- issue: ὕδωρ ζῶν का अर्थ
  choice: बहता हुआ पानी
  alternative: जीवित पानी
  rationale: यहाँ अभिव्यक्ति अनुष्ठान के लिए पानी के प्रकारों की प्राथमिकता बताती है और प्राचीन प्रयोग में प्रायः प्राकृतिक बहते पानी का संकेत करती है। ‘जीवित पानी’ हिन्दी पाठक को अनुचित आध्यात्मिक अर्थ दे सकता है।
- issue: βάπτισον की रीति संबंधी संभावित व्याख्या
  choice: बपतिस्मा दो
  alternative: डुबोकर बपतिस्मा दो
  rationale: क्रिया बपतिस्मा देने का निर्देश देती है, पर इस वाक्य में रीति को स्पष्ट रूप से निर्धारित नहीं करती। इसलिए किसी विशेष रीति को अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पर’, ‘किसी और पानी’, और ‘संभव न हो’ सामान्य पाठक के लिए सहज हैं; साथ ही निर्देशात्मक स्वर और मूल के क्रमिक विकल्प सुरक्षित हैं।
