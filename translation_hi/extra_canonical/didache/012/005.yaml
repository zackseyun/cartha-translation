  yaml_path: translation/extra_canonical/didache/012/005.yaml
  text: But if he is not willing to do so, he is a Messiah-trader; beware of such people.
translation:
  language: hi
  text: लेकिन यदि वह ऐसा करने को तैयार नहीं है, तो वह मसीह का सौदागर है; ऐसे लोगों से सावधान रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χριστέμπορος
  choice: मसीह का सौदागर
  rationale: यह दुर्लभ संयुक्त शब्द χριστός (‘मसीह’) और ἔμπορος (‘व्यापारी/सौदागर’) से बना है और उस व्यक्ति की निंदा करता है जो मसीह के नाम या पहचान से अपना लाभ कमाता है। ‘मसीह का सौदागर’ मूल रूपक और तीखे निंदात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προσέχετε ἀπό
  choice: से सावधान रहो
  rationale: इस प्रयोग में क्रिया और ἀπό का अर्थ ऐसे लोगों से चौकन्ने रहने और दूरी रखने की चेतावनी है; ‘से सावधान रहो’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: οὕτω ποιεῖν
  choice: ऐसा करने
  rationale: ‘ऐसा’ पिछले प्रसंग में बताए गए कार्य की ओर संकेत करता है; पद की संदर्भ-निर्भरता को बिना अनावश्यक व्याख्या जोड़े सुरक्षित रखा गया है।
theological_decisions:
- issue: χριστέμπορος के रूपक का अनुवाद
  choice: मसीह का सौदागर
  alternative: मसीह के नाम का व्यापार करने वाला
  rationale: चुना गया रूप मूल यूनानी के संक्षिप्त और कठोर रूपक को बनाए रखता है। विकल्प अर्थ को अधिक स्पष्ट करता, पर मूल में निहित व्यंजनार्थ को व्याख्या द्वारा सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सीधी और चेतावनीपूर्ण शैली। ‘मसीह’ χριστός की पदवी को दर्शाता है; ‘सौदागर’ मूल संयुक्त शब्द के व्यापारिक तथा निंदात्मक बिंब को सुरक्षित रखता है।
