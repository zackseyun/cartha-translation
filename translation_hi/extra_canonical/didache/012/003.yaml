  text: But if he wants to settle among you and is a craftsman, let him work and eat.
translation:
  language: hi
  text: लेकिन यदि वह कारीगर है और तुम्हारे बीच बसना चाहता है, तो वह काम करे और खाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσαι
  choice: बसना
  rationale: यहाँ शब्द का आशय कुछ समय बैठने से नहीं, समुदाय के बीच टिककर रहने या बस जाने से है।
- source_word: τεχνίτης
  choice: कारीगर
  rationale: यह किसी हुनर या दस्तकारी से जीविका कमाने वाले व्यक्ति के लिए स्वाभाविक और अर्थ-सटीक हिन्दी शब्द है।
- source_word: ἐργαζέσθω καὶ φαγέτω
  choice: वह काम करे और खाए
  rationale: 'दोनों आज्ञार्थक क्रियाओं की संक्षिप्तता और परस्पर संबंध को बनाए रखता है: उसे श्रम करके अपना भोजन पाना चाहिए।'
theological_decisions:
- issue: समुदाय में बसने वाले यात्री की जीविका
  choice: वह काम करे और खाए
  alternative: वह काम करके अपनी जीविका चलाए
  rationale: मूल यूनानी में 'काम करे और खाए' का सीधा, ठोस विधान है; इसे सामान्यीकृत करके 'जीविका चलाए' कहना अर्थ स्पष्ट करता, पर मूल की अभिव्यक्ति को अनावश्यक रूप से बदल देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य में मूल यूनानी की शर्त तथा संक्षिप्त निर्देश सुरक्षित रखे गए हैं।
