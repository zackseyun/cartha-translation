id: DID.12.4
reference: Didache 12:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: εἰ δὲ οὐκ ἔχει τέχνην, κατὰ τὴν σύνεσιν ὑμῶν προνοήσατε, πῶς μὴ ἀργὸς μεθ᾽ ὑμῶν ζήσεται χριστιανός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/004.yaml
  text: But if he has no trade[a], according to your understanding make provision for how a Christian may live among you without being idle.
translation:
  language: hi
  text: पर यदि उसके पास कोई काम-धंधा नहीं है, तो अपनी समझ के अनुसार ऐसा प्रबंध करो कि कोई मसीही[a] तुम्हारे बीच बेकार बैठकर जीवन न बिताए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि वह तुम्हारे बीच मसीही के रूप में बेकार बैठकर जीवन न बिताए।”
    reason: यूनानी χριστιανός को सामान्य कर्ता (‘कोई मसीही’) अथवा पहले उल्लिखित व्यक्ति का विधेय (‘मसीही के रूप में’) समझा जा सकता है।
lexical_decisions:
- source_word: τέχνην
  choice: काम-धंधा
  rationale: यहाँ τέχνη का अर्थ जीविका कमाने वाला हुनर, शिल्प या पेशा है। संदर्भ में यात्री के अपने श्रम से जीवन-यापन की बात है; ‘काम-धंधा’ सामान्य आधुनिक हिन्दी में इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατὰ τὴν σύνεσιν ὑμῶν
  choice: अपनी समझ के अनुसार
  rationale: σύνεσις व्यावहारिक समझ या विवेक को दर्शाता है। यह अनुवाद समुदाय को परिस्थितियों के अनुसार बुद्धिमानी से व्यवस्था करने का निर्देश बनाए रखता है।
- source_word: προνοήσατε
  choice: ऐसा प्रबंध करो
  rationale: क्रिया का भाव पहले से सोचकर आवश्यक व्यवस्था करने का है। ‘प्रबंध करो’ अगले πῶς-वाक्य के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ἀργὸς
  choice: बेकार बैठकर
  rationale: ἀργός यहाँ काम न करने या निष्क्रिय रहने का बोध देता है। ‘बेकार बैठकर’ केवल बेरोज़गारी नहीं, बल्कि समुदाय पर निष्क्रिय निर्भरता के संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: χριστιανός का वाक्यगत कार्य
  choice: ‘कोई मसीही’ को ζήσεται का सामान्य कर्ता माना गया है
  alternative: 'इसे पहले उल्लिखित व्यक्ति का विधेय मानकर अनुवाद किया जा सकता है: ‘कि वह तुम्हारे बीच मसीही के रूप में बेकार बैठकर जीवन न बिताए।’'
  rationale: यूनानी में χριστιανός कर्ता या विधेय—दोनों रूपों में समझा जा सकता है। मुख्य पाठ सीधी व्याकरणिक रचना और व्यापक सामुदायिक सिद्धांत को रखता है, जबकि पादटिप्पणी संदर्भानुकूल वैकल्पिक समझ सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘काम-धंधा’ और ‘बेकार बैठकर’ बोलचाल में बोधगम्य हैं, पर निर्देश की गंभीरता भी बनाए रखते हैं।
