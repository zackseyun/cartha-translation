id: DID.12.1
reference: Didache 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/001.yaml
  text: But let everyone who comes in the name of the Lord be received; then, after testing him, you will know, for you will have understanding of right and left.
translation:
  language: hi
  text: पर जो कोई प्रभु के नाम से आता है, उसे स्वीकार करो। फिर उसे परखने के बाद तुम जान जाओगे[a], क्योंकि तुम्हें दाएँ और बाएँ की समझ होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उसे पहचान लोगे।”
    reason: यूनानी क्रिया का कोई व्यक्त कर्म नहीं है, पर संदर्भ के आधार पर ‘उसे’ की पूर्ति संभव है।
lexical_decisions:
- source_word: ἐν ὀνόματι Κυρίου
  choice: प्रभु के नाम में
  rationale: यूनानी पदबंध को निकटता से रखते हुए आगमन के घोषित धार्मिक आधार और प्रभु से संबंध—दोनों को खुला रखता है।
- source_word: δεχξήσθω (पाठ में; आशय δεχθήσθω)
  choice: उसे स्वीकार किया जाए
  rationale: संदर्भ में आगंतुक का स्वागत और समुदाय में ग्रहण किया जाना अभिप्रेत है; यह हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: δοκιμάσαντες
  choice: परखने के बाद
  rationale: यह केवल सामान्य परिचय नहीं, बल्कि आगंतुक की सत्यता या चरित्र की जाँच का भाव व्यक्त करता है।
- source_word: γνώσεσθε
  choice: तुम जान जाओगे
  rationale: क्रिया यूनानी में बिना व्यक्त कर्म के है; इसलिए मुख्य पाठ में ‘उसे’ जोड़कर व्यक्तिगत परिचय का भ्रामक भाव नहीं दिया गया।
- source_word: σύνεσιν ... δεξιὰν καὶ ἀριστεράν
  choice: दाएँ और बाएँ की समझ
  rationale: मूल रूपक को सुरक्षित रखता है, जबकि संदर्भ में विवेकपूर्वक भेद करने का भाव स्पष्ट रहता है।
theological_decisions:
- issue: प्रभु के नाम में आने वाले प्रत्येक व्यक्ति को स्वीकार करने और बाद में परखने के बीच तनाव
  choice: 'दोनों आदेशों को उनके मूल क्रम में रखा गया: पहले स्वीकार करना, फिर परखना।'
  alternative: परखने के बाद ही स्वीकार करना।
  rationale: मूल यूनानी पहले ग्रहण करने और उसके बाद जाँचने की बात करता है; क्रम बदलना समुदाय के आतिथ्य और विवेक के बीच निहित तनाव को मिटा देता।
- issue: γνώσεσθε का कर्म
  choice: 'मुख्य पाठ में इसे निरपेक्ष रखा गया: ‘तुम जान जाओगे’।'
  alternative: ‘तुम उसे पहचान लोगे’।
  rationale: αὐτόν निकटवर्ती कृदंत δοκιμάσαντες का कर्म है, जबकि γνώσεσθε का कोई व्यक्त कर्म नहीं है; फिर भी संदर्भगत वैकल्पिक पूर्ति पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; सामुदायिक निर्देश के अनुरूप गरिमापूर्ण और सहज शैली। ‘दाएँ और बाएँ’ के मूल रूपक को व्याख्यात्मक रूप से ‘सही और गलत’ में बदलने के बजाय सुरक्षित रखा गया है।
