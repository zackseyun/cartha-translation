  text: Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/002.yaml
  text: If the one who comes is a traveler[a], help him as much as you can; but he shall not remain with you except for two or three days, if there is a need.
translation:
  language: hi
  text: यदि आनेवाला व्यक्ति यात्री हो, तो जहाँ तक तुमसे हो सके, उसकी सहायता करो; पर यदि आवश्यकता हो, तो वह तुम्हारे यहाँ दो या तीन दिन से अधिक न ठहरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρόδιος
  choice: यात्री
  rationale: यह शब्द मार्ग से होकर जानेवाले, अस्थायी रूप से आए मुसाफ़िर को दर्शाता है; ‘यात्री’ आधुनिक और सहज हिन्दी में यही अर्थ देता है।
- source_word: βοηθεῖτε
  choice: उसकी सहायता करो
  rationale: बहुवचन आज्ञार्थक क्रिया को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे यहाँ
  rationale: संदर्भ में इसका अर्थ समुदाय के बीच या उनके आतिथ्य में ठहरना है; शाब्दिक ‘तुम्हारे पास’ की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: εἰ μὴ δύο ἢ τρεῖς ἡμέρας
  choice: केवल दो या तीन दिन ही
  rationale: εἰ μὴ द्वारा लगाई गई सीमा को स्पष्ट करता है और यह भ्रम नहीं होने देता कि आवश्यकता होने पर तीन दिन से अधिक ठहरना संभव है।
- source_word: ἐὰν ᾖ ἀνάγκη
  choice: यदि आवश्यकता हो
  rationale: मूल के शर्तसूचक भाव को बनाए रखता है; आवश्यकता की स्थिति में अनुमत ठहराव दो या तीन दिनों तक सीमित है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। यूनानी μὲν…δὲ की संरचना को ‘यदि…तो…; परन्तु…’ से व्यक्त किया गया है। भविष्यकालीन οὐ μενεῖ का निर्देशात्मक बल हिन्दी में ‘ही ठहरे’ द्वारा दिया गया है।
