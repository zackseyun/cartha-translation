source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ κλάσματος· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ζωῆς καὶ γνώσεως, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/003.yaml
  text: 'And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: hi
  text: 'और टूटी हुई रोटी के विषय में:


    हे हमारे पिता,


    हम उस जीवन और ज्ञान के लिए तेरा धन्यवाद करते हैं,


    जिसे तूने अपने सेवक यीशु के द्वारा हमें ज्ञात कराया।


    महिमा युगानुयुग तेरी ही हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσματος
  choice: तोड़ी हुई रोटी
  rationale: शाब्दिक अर्थ ‘तोड़ा हुआ टुकड़ा’ है, पर प्रभुभोज के संदर्भ में यह तोड़ी गई रोटी को दर्शाता है; यह चयन क्रिया और वस्तु दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Εὐχαριστοῦμέν
  choice: धन्यवाद करते हैं
  rationale: यहाँ क्रिया परमेश्वर के प्रति कृतज्ञता व्यक्त करती है; आधुनिक हिन्दी में ‘धन्यवाद करते हैं’ स्पष्ट और सहज है।
- source_word: ζωῆς καὶ γνώσεως
  choice: जीवन और ज्ञान
  rationale: दोनों संज्ञाओं का सीधा अनुवाद उनकी व्यापक और संभवतः धर्मवैज्ञानिक अर्थ-छटा को बिना सीमित किए बनाए रखता है।
- source_word: ἐγνώρισας
  choice: प्रकट किया
  rationale: क्रिया का आशय ‘ज्ञात कराया’ है; ‘हम पर प्रकट किया’ प्राकृतिक हिन्दी में प्रकाशन द्वारा जानकारी देने का भाव व्यक्त करता है।
- source_word: παιδός
  choice: सेवक
  rationale: παῖς का अर्थ ‘बालक/पुत्र’ या ‘सेवक’ हो सकता है। इस प्रार्थना और आरंभिक मसीही प्रयोग में ‘सेवक’ उपयुक्त है, किंतु शब्द की वास्तविक अस्पष्टता को धर्मवैज्ञानिक निर्णय में दर्ज किया गया है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह पारंपरिक किंतु सुबोध हिन्दी अभिव्यक्ति अनंत काल तक बने रहने वाले स्तुतिगान का भाव देती है।
theological_decisions:
- issue: यीशु के लिए παῖς का अर्थ
  choice: सेवक
  alternative: पुत्र / बालक
  rationale: यूनानी παῖς में ‘सेवक’ और ‘बालक/पुत्र’ दोनों अर्थ संभव हैं। यहाँ परमेश्वर को पिता संबोधित करने के बावजूद वाक्यांश आरंभिक मसीही प्रार्थना और यशायाह के सेवक-संबंधी प्रयोग से मेल खाता है; इसलिए ‘सेवक’ चुना गया, बिना इसे यीशु की पुत्रता के निषेध के रूप में समझे।
- issue: ζωή और γνῶσις की सीमा
  choice: जीवन और ज्ञान को बिना व्याख्यात्मक विशेषण के रखा
  alternative: अनन्त जीवन और उद्धार का ज्ञान
  rationale: मूल पाठ में ‘अनन्त’ या ‘उद्धार’ जैसे विशेषण नहीं हैं। संभावित धर्मवैज्ञानिक आशय को अनुवाद में जोड़ना मूल की व्यापकता को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामूहिक प्रार्थना के अनुकूल रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरा’ अपनाया गया है, जो ‘हे हमारे पिता’ के साथ स्वाभाविक प्रार्थनात्मक लय देता है। पंक्ति-विन्यास मूल की स्तुतिपरक संरचना को स्पष्ट करता है।
