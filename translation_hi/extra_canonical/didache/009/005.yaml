id: DID.9.5
reference: Didache 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδεὶς δὲ φαγέτω μηδὲ πιέτω ἀπὸ τῆς εὐχαριστίας ὑμῶν, ἀλλ' οἱ βαπτισθέντες εἰς ὄνομα Κυρίου· καὶ γὰρ περὶ τούτου εἴρηκεν ὁ Κύριος· Μὴ δῶτε τὸ ἅγιον τοῖς κυσί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/005.yaml
  text: 'But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: hi
  text: पर तुम्हारे धन्यवाद-भोज में से कोई भी न खाए या न पीए, सिवाय उनके जिन्होंने प्रभु के नाम में बपतिस्मा पाया है। क्योंकि इस विषय में भी प्रभु ने कहा है, “पवित्र वस्तु कुत्तों को मत दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστίας
  choice: धन्यवाद-भोज
  rationale: यहाँ शब्द सामुदायिक खाने-पीने की धार्मिक क्रिया को दर्शाता है; केवल ‘धन्यवाद’ कहने से भोजन का संदर्भ अस्पष्ट रहता, जबकि ‘धन्यवाद-भोज’ मूल अर्थ और प्रसंग दोनों को सहज रूप से व्यक्त करता है।
- source_word: βαπτισθέντες εἰς ὄνομα Κυρίου
  choice: जिन्होंने प्रभु के नाम में बपतिस्मा पाया है
  rationale: εἰς की दिशात्मक/संबंधात्मक भाषा को ‘नाम में’ से बनाए रखा गया है; इसे किसी विशिष्ट धर्मवैधानिक व्याख्या में नहीं बदला गया।
- source_word: τὸ ἅγιον
  choice: पवित्र वस्तु
  rationale: यूनानी पद नपुंसकलिंग और सामान्य है—‘जो पवित्र है’। ‘पवित्र वस्तु’ उस खुलापन को बनाए रखता है और इसे अनावश्यक रूप से ‘पवित्र भोजन’ तक सीमित नहीं करता।
- source_word: τοῖς κυσί
  choice: कुत्तों को
  rationale: मूल रूपक का सीधा और परिचित हिन्दी रूप रखा गया है।
theological_decisions:
- issue: εὐχαριστία का संस्कारगत अर्थ
  choice: धन्यवाद-भोज
  alternative: प्रभु-भोज / यूखरिस्त
  rationale: ‘प्रभु-भोज’ और ‘यूखरिस्त’ बाद की या संप्रदाय-विशिष्ट शब्दावली का आभास दे सकते हैं। चुना हुआ रूप मूल के ‘धन्यवाद’ अर्थ तथा तत्काल खाने-पीने के संदर्भ को साथ रखता है।
- issue: बपतिस्मा और भोज में सहभागिता का संबंध
  choice: प्रतिबंध को मूल के अनुसार स्पष्ट रूप से रखा गया
  alternative: प्रतिबंध को सामान्य विश्वासियों या मंडली के सदस्यों तक विस्तृत करना
  rationale: पाठ स्वयं केवल ‘प्रभु के नाम में बपतिस्मा पाए’ लोगों की बात करता है; अतिरिक्त सदस्यता या सिद्धान्तगत शर्त नहीं जोड़ी गई।
- issue: प्रभु के कथन का वर्तमान विषय पर अनुप्रयोग
  choice: ‘इस विषय में भी’
  alternative: ‘इसी कारण’
  rationale: περὶ τούτου तथा καὶ γάρ अनुप्रयोग/समर्थन बताते हैं, पर कठोर कारणात्मक पहचान आवश्यक नहीं करते; इसलिए मूल की हल्की व्याख्यात्मक गुंजाइश बचाई गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक निर्देश के अनुरूप है। ‘कोई न खाए, न पिए’ निषेध की औपचारिक दृढ़ता रखता है, जबकि ‘केवल वे ही’ अपवाद को स्वाभाविक हिन्दी में स्पष्ट करता है।
