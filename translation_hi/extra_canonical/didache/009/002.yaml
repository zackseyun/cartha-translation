id: DID.9.2
reference: Didache 9:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πρῶτον περὶ τοῦ ποτηρίου· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ἁγίας ἀμπέλου Δαβὶδ τοῦ παιδός σου, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/002.yaml
  text: 'First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: hi
  text: 'पहले, प्याले के विषय में:


    हे हमारे पिता,


    हम तेरा धन्यवाद करते हैं


    तेरे सेवक दाऊद की पवित्र बेल के लिए,


    जिसे तूने अपने सेवक यीशु के द्वारा हमें ज्ञात कराया।


    महिमा युगानुयुग तेरी हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποτήριον
  choice: प्याला
  rationale: भोज और धन्यवाद-प्रार्थना के संदर्भ में यह स्वाभाविक तथा स्रोत के निकट शब्द है।
- source_word: Εὐχαριστοῦμέν
  choice: हम तेरा धन्यवाद करते हैं
  rationale: क्रिया का सामान्य अर्थ स्पष्ट रखता है; बाद की तकनीकी धार्मिक शब्दावली को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ἁγίας ἀμπέλου
  choice: पवित्र दाखलता
  rationale: ἄμπελος के 'दाखलता' अर्थ को बनाए रखता है और दाऊद से जुड़ी रूपकात्मक अस्पष्टता को हल नहीं करता।
- source_word: παιδός
  choice: सेवक
  rationale: παῖς का अर्थ 'बालक/पुत्र' भी हो सकता है, पर दाऊद और यीशु दोनों के लिए समान शब्द होने तथा बाइबलीय सेवक-भाषा के कारण 'सेवक' उपयुक्त है।
- source_word: ἐγνώρισας
  choice: प्रकट किया
  rationale: यह केवल सूचना देने से अधिक, किसी बात को ज्ञात कराने का भाव व्यक्त करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: अनंतकालीन स्तुतिवाक्य का स्वाभाविक, गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: दाऊद की 'पवित्र दाखलता' का आशय
  choice: रूपक को बिना व्याख्या के यथावत रखा गया
  alternative: इसे दाऊद के वंश, मसीही राज्य, या दाखरस के रूप में स्पष्ट करना
  rationale: यूनानी पाठ स्वयं आशय को स्पष्ट नहीं करता; किसी एक धार्मिक व्याख्या को अनुवाद में आरोपित करना उचित नहीं।
- issue: यीशु के लिए παῖς का अनुवाद
  choice: सेवक
  alternative: पुत्र या बालक
  rationale: उसी वाक्य में दाऊद के लिए भी यही यूनानी शब्द है; 'सेवक' समानता और संभावित यशायाही सेवक-प्रतिध्वनि दोनों को सुरक्षित रखता है, बिना पुत्रत्व के व्यापक धर्मशास्त्र को नकारे।
- issue: समापन महिमावचन
  choice: महिमा युगानुयुग तेरी ही हो
  alternative: तेरी महिमा सदा होती रहे
  rationale: मूल के संक्षिप्त स्तुतिपरक स्वर और परमेश्वर की ओर प्रत्यक्ष संबोधन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, सामूहिक प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए निकट और प्रत्यक्ष एकवचन संबोधन 'तू/तेरा' रखा गया है, जो 'हे हमारे पिता' के प्रार्थनात्मक संबंध और यूनानी एकवचन को व्यक्त करता है। पंक्ति-विन्यास मूल के प्रार्थना-छंद और सार्वजनिक पाठ की सुगमता को उभारता है।
