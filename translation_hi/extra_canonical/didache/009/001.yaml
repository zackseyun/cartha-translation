  yaml_path: translation/extra_canonical/didache/009/001.yaml
  text: 'Concerning the thanksgiving, give thanks in this way:'
translation:
  language: hi
  text: 'धन्यवाद के विषय में, इस प्रकार धन्यवाद करो:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστίας / εὐχαριστήσατε
  choice: धन्यवाद / धन्यवाद करो
  rationale: संज्ञा और संबंधित क्रिया की यूनानी शब्द-क्रीड़ा तथा पुनरावृत्ति को हिन्दी में बनाए रखता है। यहाँ संदर्भ सामुदायिक धन्यवाद-प्रार्थना का है; केवल बाद की तकनीकी उपाधि ‘यूखरिस्त’ रखना मूल के सामान्य अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- source_word: Περὶ δὲ
  choice: के विषय में
  rationale: δὲ यहाँ विषय-परिवर्तन का हल्का संकेत देता है। हिन्दी में ‘के विषय में’ नया विषय स्वाभाविक रूप से आरम्भ करता है; अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: आगे आने वाली प्रार्थना-विधि की ओर संकेत करने वाला स्वाभाविक और गरिमापूर्ण रूप।
- source_word: εὐχαριστήσατε
  choice: धन्यवाद करो
  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थक है; हिन्दी में समुदाय को संबोधित सामान्य बहुवचन/आदरार्थक आज्ञा ‘करो’ से व्यक्त होती है।
theological_decisions:
- issue: εὐχαριστία को सामान्य ‘धन्यवाद’ या तकनीकी संस्कार-नाम के रूप में प्रस्तुत करना
  choice: धन्यवाद
  alternative: यूखरिस्त / प्रभु-भोज
  rationale: यूनानी शब्द यहाँ धन्यवाद देने के अपने मूल अर्थ को स्पष्ट रूप से सक्रिय रखता है, क्योंकि उसी धातु की क्रिया तुरंत दोहराई गई है। ‘प्रभु-भोज’ मूल में नहीं है, और ‘यूखरिस्त’ साधारण पाठक के लिए अर्थ को अस्पष्ट तथा अधिक तकनीकी बना देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, निर्देशात्मक और गरिमापूर्ण शैली। मूल के आरम्भिक विषय-सूचक वाक्यांश, शब्द-पुनरावृत्ति और आगे की प्रार्थनाओं को प्रस्तुत करने वाले विराम-चिह्न को सुरक्षित रखा गया है।
