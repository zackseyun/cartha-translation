id: DID.9.4
reference: Didache 9:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὥσπερ ἦν τοῦτο κλάσμα διεσκορπισμένον ἐπάνω τῶν ὀρέων καὶ συναχθὲν ἐγένετο ἕν, οὕτω συναχθήτω σου ἡ ἐκκλησία ἀπὸ τῶν περάτων τῆς γῆς εἰς τὴν σὴν βασιλείαν· ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις διὰ Ἰησοῦ Χριστοῦ εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/004.yaml
  text: Just as this fragment was scattered upon the mountains and[a], when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus Messiah forever.
translation:
  language: hi
  text: जिस प्रकार यह रोटी का टुकड़ा पहाड़ों पर बिखरा हुआ था और इकट्ठा होकर एक हो गया, उसी प्रकार आपकी कलीसिया पृथ्वी के छोरों से आपके राज्य में इकट्ठी की जाए; क्योंकि यीशु मसीह के द्वारा महिमा और सामर्थ्य युगानुयुग आपके ही हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσμα
  choice: रोटी का टुकड़ा
  rationale: संदर्भ प्रभु-भोज की रोटी पर धन्यवाद का है; केवल ‘टुकड़ा’ अस्पष्ट होता, जबकि ‘रोटी का टुकड़ा’ यूनानी संज्ञा का प्रसंगगत आशय स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐκκλησία
  choice: कलीसिया
  rationale: यहाँ परमेश्वर के विश्वव्यापी एकत्रित समुदाय का संकेत है; हिन्दी मसीही प्रयोग में ‘कलीसिया’ इस अर्थ को ‘सभा’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: περάτων τῆς γῆς
  choice: पृथ्वी के छोरों से
  rationale: यूनानी रूपक को बनाए रखते हुए इसका अर्थ दूर-दूर के समस्त स्थानों से है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός आरम्भिक मसीही उपाधि/नाम है; मानक हिन्दी में ‘मसीह’ इसका स्वाभाविक और व्यापक रूप है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह स्थायी स्तुतिवाक्य का संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: कलीसिया का राज्य में एकत्र होना
  choice: आपके राज्य में इकट्ठी की जाए
  alternative: आपके राज्य के लिए इकट्ठी की जाए
  rationale: εἰς के मूल दिशात्मक भाव ‘में/के भीतर’ को सुरक्षित रखा गया है और पाठ की भावी, प्रार्थनात्मक अपेक्षा को किसी विशिष्ट अंत-समय व्यवस्था में नहीं बाँधा गया।
- issue: बिखरी हुई रोटी का बिंब
  choice: पहाड़ों पर बिखरा हुआ था
  alternative: पहाड़ों पर बिखेरा गया था
  rationale: διεσκορπισμένον व्याकरणतः कर्मवाच्य रूप है, पर हिन्दी में ‘बिखरा हुआ’ परिणामगत अवस्था को स्वाभाविक ढंग से व्यक्त करता है और यह अनावश्यक दावा नहीं करता कि किसी कर्ता ने तैयार रोटी के टुकड़े बिखेरे थे।
- issue: महिमा और सामर्थ्य का संबंध
  choice: महिमा और सामर्थ्य युगानुयुग आपके ही हैं, यीशु मसीह के द्वारा
  alternative: यीशु मसीह के द्वारा महिमा और सामर्थ्य युगानुयुग आपके ही हैं
  rationale: यूनानी क्रम और स्तुतिवाक्य को यथासंभव बनाए रखा गया है; ‘के द्वारा’ को महिमा और सामर्थ्य दोनों से संबंधित रहने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, सामुदायिक और गरिमापूर्ण शैली। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। वाक्य की समानांतर संरचना—रोटी के एक होने और कलीसिया के एकत्र होने—को स्पष्ट रखा गया है।
