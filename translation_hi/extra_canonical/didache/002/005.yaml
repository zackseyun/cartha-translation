translation:
  language: hi
  text: तुम्हारी बात न तो झूठी हो, न खोखली, बल्कि कर्म से भरपूर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λόγος σου
  choice: तुम्हारी बात
  rationale: यहाँ λόγος का आशय व्यक्ति के कथन या वचन से है; आधुनिक हिन्दी में “तुम्हारी बात” सहज और स्पष्ट है।
- source_word: ψευδής
  choice: झूठी
  rationale: यह विशेषण कथन के असत्य होने को सीधे व्यक्त करता है।
- source_word: κενός
  choice: खोखली
  rationale: शाब्दिक अर्थ “खाली” है, पर कथन के लिए “खोखली” स्वाभाविक हिन्दी है और निष्फल या सारहीन वाणी का भाव बनाए रखती है।
- source_word: μεμεστωμένος πράξει
  choice: कर्म से भरपूर
  rationale: μεμεστωμένος का पूर्णता/भरे होने का भाव और πράξει का व्यवहार में किए गए कर्म का अर्थ संक्षेप में सुरक्षित रहता है।
theological_decisions:
- issue: वाणी और कर्म का संबंध
  choice: “कर्म से भरपूर” द्वारा कथन को वास्तविक आचरण से समर्थित दिखाया गया है।
  alternative: “कर्म में पूरा किया हुआ”
  rationale: यूनानी पाठ रूपकतः वचन के कर्म से भरे होने की बात करता है; अनुवाद उस तनाव को बनाए रखता है और इसे केवल वादा पूरा करने तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल यूनानी की समांतर निषेधात्मक संरचना “न तो… न…” तथा अंतिम विरोध “बल्कि…” सुरक्षित रखा गया है।
