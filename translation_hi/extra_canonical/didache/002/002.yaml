id: DID.2.2
reference: Didache 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ φονεύσεις, οὐ μοιχεύσεις, οὐ παιδοφθορήσεις, οὐ πορνεύσεις, οὐ κλέψεις, οὐ μαγεύσεις, οὐ φαρμακεύσεις, οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/002.yaml
  text: You shall not murder; you shall not commit adultery; you shall not sexually abuse boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not kill a child by abortion, nor kill one that has been born.b
translation:
  language: hi
  text: हत्या न करना; व्यभिचार न करना; लड़कों का यौन शोषण न करना;[a] यौन अनैतिकता न करना; चोरी न करना; जादू न करना; टोना न करना; गर्भपात करके बच्चे की हत्या न करना, और जन्मे हुए बच्चे की हत्या न करना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द दुर्लभ है और शाब्दिक रूप से ‘लड़कों/बालकों को भ्रष्ट या नष्ट करना’ कहता है; इस संदर्भ में इसे सामान्यतः लड़कों के यौन शोषण के रूप में समझा जाता है।
    reason: दुर्लभ शब्द की व्यापक शाब्दिक अर्थ-सीमा और संदर्भानुकूल अर्थ, दोनों को सुरक्षित रखने के लिए।
  - marker: b
    text: ‘गर्भपात करके’ के पीछे का यूनानी वाक्यांश शाब्दिक रूप से ‘विनाश में/विनाश के द्वारा’ है। इस संदर्भ में इसे गर्भस्थ बच्चे के विनाश, अर्थात गर्भपात, के रूप में समझा जाता है; अगला वाक्यांश जन्मे हुए बच्चे की हत्या का निषेध करता है।
    reason: ἐν φθορᾷ के संक्षिप्त और व्याख्यात्मक रूप से विवादित मुहावरे को दर्ज करने के लिए।
lexical_decisions:
- source_word: φονεύσεις
  choice: हत्या न करना
  rationale: यह निषेध जानबूझकर मनुष्य की हत्या करने के अर्थ में है; ‘मारना’ की अपेक्षा ‘हत्या’ अधिक सटीक है।
- source_word: μοιχεύσεις
  choice: व्यभिचार न करना
  rationale: विवाह-संबंध का उल्लंघन करने वाले यौन संबंध के लिए प्रचलित और विशिष्ट शब्द।
- source_word: παιδοφθορήσεις
  choice: लड़कों का यौन शोषण न करना
  rationale: दुर्लभ क्रिया का शाब्दिक अर्थ बालक/लड़के को भ्रष्ट या नष्ट करना है; इस प्राचीन निषेध-सूची के संदर्भ में यह विशेषतः लड़कों के यौन शोषण की ओर संकेत करती है।
- source_word: πορνεύσεις
  choice: यौन अनैतिकता न करना
  rationale: व्यभिचार से व्यापक अवैध/अनैतिक यौन आचरण को व्यक्त करता है और दोनों निषेधों का अंतर बनाए रखता है।
- source_word: μαγεύσεις
  choice: जादू-टोना न करना
  rationale: जादुई क्रियाओं के अभ्यास को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φαρμακεύσεις
  choice: तंत्र-मंत्र का प्रयोग न करना
  rationale: यहाँ निकटवर्ती μαγεύσεις से संबंधित हानिकारक टोने या औषधि/विष-संबद्ध जादुई प्रयोग का संकेत है; ‘तंत्र-मंत्र’ सामान्य पाठक के लिए इस भेद को यथासंभव बनाए रखता है।
- source_word: φονεύσεις τέκνον ἐν φθορᾷ
  choice: गर्भपात के द्वारा किसी बच्चे को न मारना
  rationale: ἐν φθορᾷ गर्भस्थ जीवन के विनाश का प्राचीन मुहावरा है; स्पष्ट हिन्दी में गर्भपात द्वारा बच्चे को मारने का निषेध व्यक्त किया गया है।
- source_word: γεννηθὲν ἀποκτενεῖς
  choice: जन्म लेने के बाद भी उसे न मारना
  rationale: जन्मे हुए बच्चे को मारने का निषेध है; ‘उसे’ पहले उल्लिखित बच्चे से संबंध स्पष्ट करता है।
theological_decisions:
- issue: παιδοφθορήσεις का आशय
  choice: लड़कों का यौन शोषण
  alternative: बालकों को भ्रष्ट करना
  rationale: यौन निषेधों के बीच इसका स्थान और प्राचीन प्रयोग यौन शोषण की ओर संकेत करते हैं, पर शब्द की दुर्लभता और व्यापक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐν φθορᾷ की व्याख्या
  choice: गर्भपात के द्वारा
  alternative: गर्भ में/विनाश में
  rationale: दीदाखे और समान प्राचीन परंपरा में यह गर्भस्थ बच्चे के विनाश को सूचित करता है; अनुवाद अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
- issue: μαγεύσεις और φαρμακεύσεις का भेद
  choice: जादू-टोना / तंत्र-मंत्र का प्रयोग
  alternative: जादू करना / औषधि या विष देना
  rationale: दो अलग यूनानी क्रियाओं को अलग हिन्दी अभिव्यक्तियों से रखा गया है, पर φαρμακεύσεις की विष, औषधि और टोने से जुड़ी अर्थ-सीमा को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक एकवचन ‘तुम’ के साथ सीधी निषेध-सूची। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर ‘न करना’ संरचना यूनानी वाक्य की लय और विधिक-नैतिक स्वर को बनाए रखती है।
