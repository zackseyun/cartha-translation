  to: तुम लोभी न बनना, हड़पनेवाले न बनना, पाखंडी न बनना, दुर्भाव न रखना, और घमंडी न बनना। अपने पड़ोसी के विरुद्ध बुरी सलाह न लेना।[a]
  rationale: The revision repairs the Hindi syntax of the vice list, renders κακοήθης naturally as ‘दुर्भाव न रखना,’ and replaces the awkward ‘सलाह को स्वीकार’ with idiomatic ‘सलाह न लेना.’ The note preserves the source ambiguity between evil counsel and an evil plan, in line with the English audit trail, without asserting an unnecessarily broad lexical sense for λήψῃ.
