source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/006.yaml
  text: You shall not be greedy[a], nor grasping, nor a hypocrite, nor malicious, nor arrogant. You shall not take evil counsel against your neighbor.
translation:
  language: hi
  text: तुम लोभी न बनना, हड़पनेवाले न बनना, पाखंडी न बनना, दुर्भाव न रखना, और घमंडी न बनना। अपने पड़ोसी के विरुद्ध बुरी सलाह न लेना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पड़ोसी के विरुद्ध बुरी योजना न बनाना।”
    reason: βουλή का अर्थ ‘सलाह’ के साथ-साथ संदर्भानुसार ‘योजना’ भी हो सकता है; इस वाक्यांश में दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: πλεονέκτης
  choice: लोभी
  rationale: यह शब्द अधिक पाने की लालसा और लालच रखनेवाले व्यक्ति को दर्शाता है; ‘लोभी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἅρπαξ
  choice: हड़पनेवाले
  rationale: यह πλεονέκτης से अलग, बलपूर्वक या अनुचित ढंग से दूसरों की वस्तु छीनने अथवा हड़पने की प्रवृत्ति बताता है।
- source_word: ὑποκριτής
  choice: पाखंडी
  rationale: धार्मिक या नैतिक दिखावा करनेवाले व्यक्ति के लिए प्रचलित और अर्थ-संगत हिन्दी शब्द।
- source_word: κακοήθης
  choice: द्वेषी
  rationale: यह बुरे चरित्र, दुर्भाव और सक्रिय विद्वेष का बोध कराता है; ‘द्वेषी’ केवल हल्की अप्रसन्नता की अपेक्षा इसकी तीव्रता को बेहतर रखता है।
- source_word: ὑπερήφανος
  choice: घमंडी
  rationale: अभिमानी और अपने को ऊँचा समझनेवाले व्यक्ति का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: λήψῃ βουλὴν πονηράν
  choice: किसी बुरी सलाह को स्वीकार न करना
  rationale: λήψῃ का मूल भाव ‘लेना/स्वीकार करना’ और βουλή का भाव ‘सलाह/योजना’ है; यह अनुवाद मूल अभिव्यक्ति के निकट रहते हुए हिन्दी में बोधगम्य है।
theological_decisions:
- issue: βουλήν का अर्थ ‘सलाह’ या ‘योजना’
  choice: सलाह
  alternative: योजना
  rationale: ग्रीक में दोनों अर्थ संभव हैं। मुख्य पाठ में ‘सलाह’ λήψῃ (‘स्वीकार करना’) के साथ स्वाभाविक बैठता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, उपदेशात्मक और गरिमापूर्ण रूप रखा गया है। बार-बार आए ग्रीक निषेध को हिन्दी की समानांतर ‘न … होना’ संरचना से व्यक्त किया गया है।
