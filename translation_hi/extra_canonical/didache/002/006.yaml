    issue: The first sentence is grammatically uneven and unnatural Hindi.
    rationale: ‘तुम न लोभी होना’ does not provide a smooth shared construction for ‘हड़पनेवाले,’ ‘पाखंडी,’ and the remaining predicate nouns/adjectives. Parallel prohibitions make the exhortation idiomatic and clear.
  - severity: low
    issue: ‘किसी बुरी सलाह को स्वीकार न करना’ is stilted and less direct than needed.
    rationale: For λήψῃ βουλὴν πονηράν, ‘बुरी सलाह न लेना’ is natural Hindi and preserves the source’s ‘take counsel’ wording; the plan sense can remain in the note.
  - severity: low
    issue: The footnote’s explanation overstates ‘बनाना’ as a lexical sense of λήψῃ.
    rationale: ‘बनाना’ arises from the contextual idiom and the possible sense of βουλή as plan, rather than being the direct standalone sense of λήψῃ. The note can state the alternative without that overclaim.
