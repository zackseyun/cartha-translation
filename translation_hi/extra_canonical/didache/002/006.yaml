review_pass:
  verdict: revise
  source_fidelity: 'The vice list is substantially faithful: लोभी, हड़पनेवाले, पाखंडी, द्वेषी, and घमंडी represent πλεονέκτης, ἅρπαξ, ὑποκριτής, κακοήθης, and ὑπερήφανος well. The final clause correctly retains the ambiguity of βουλή as counsel or plan. However, ‘किसी बुरी सलाह को स्वीकार न करना’ is less idiomatic in Hindi and somewhat weakens the direct force of λήψῃ βουλήν.'
  naturalness: 'The first sentence has a grammatical and parallelism problem: ‘तुम न लोभी होना, न हड़पनेवाले...’ combines an infinitive-like prohibition with plural/honorific agent nouns and leaves the subsequent items unevenly governed. Recasting the list as parallel prohibitions produces natural modern standard Hindi without altering its force. ‘बुरी सलाह न लेना’ is the ordinary Hindi equivalent for taking counsel.'
  terminology: ‘द्वेषी’ adequately conveys the active ill will of κακοήθης in this vice list. ‘पड़ोसी’ appropriately renders πλησίον in this ethical context. The footnote should retain ‘योजना’ as a genuine contextual alternative for βουλή, while avoiding the over-specific claim that λήψῃ itself means ‘बनाना.’
  issues:
