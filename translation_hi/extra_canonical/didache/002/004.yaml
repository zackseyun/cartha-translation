review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the paired prohibitions and the compact genitive image “a snare of death.” However, “दुविधा में रहनेवाले” tends to denote uncertainty or indecision, whereas διγνώμων more specifically denotes being divided in mind or inwardly inconsistent. In the final clause, “दोहरी बात” can suggest one particular utterance more readily than the source noun διγλωσσία, the practice or quality of double-tongued speech.
  naturalness: The draft is generally understandable, but “तुम न तो … रहनेवाले बनो, न … करनेवाले” is somewhat cumbersome. A direct negative imperative is more idiomatic in modern standard Hindi.
  terminology: “दोहरे मन का” naturally conveys διγνώμων without importing a doctrinal interpretation. “दोहरी बातें करना” conveys δίγλωσσος/διγλωσσία as inconsistent or duplicitous speech without over-specifying the precise form of the wrongdoing. “मृत्यु का फंदा” appropriately retains the source’s ambiguity and metaphor.
  issues:
  - severity: medium
    issue: The rendering of διγνώμων is too narrowly framed as indecision.
    rationale: “दुविधा में रहनेवाले” primarily describes a person who remains uncertain; the Greek adjective more broadly conveys a divided or two-minded disposition.
  - severity: low
    issue: The final rendering treats διγλωσσία as a singular ‘double statement.’
    rationale: The Greek abstract noun refers to double-tonguedness or the practice of speaking dupliciously. Rendering it as “दोहरी बातें करना” better represents this continuing quality.
  - severity: low
    issue: The prohibitive wording is stylistically awkward.
    rationale: Using “न बनो” with the participial phrases is less direct than a modern Hindi negative imperative.
  revised_text: तुम दोहरे मन के न बनो और न दोहरी बातें करो; क्योंकि दोहरी बातें करना मृत्यु का फंदा है।
  revised_footnotes: []
