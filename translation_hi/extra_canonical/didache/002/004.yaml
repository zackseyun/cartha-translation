  rationale: The revision more closely represents the divided-minded sense of διγνώμων, uses a natural direct prohibition, and renders διγλωσσία as the practice of double-tongued speech. It retains the concise, ambiguous metaphor “मृत्यु का फंदा” without interpretive expansion.
