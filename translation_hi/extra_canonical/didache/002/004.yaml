source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ διγνώμων οὐδὲ δίγλωσσος· παγὶς γὰρ θανάτου ἡ διγλωσσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/004.yaml
  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: hi
  text: तुम दोहरे मन के न बनो और न दोहरी बातें करो; क्योंकि दोहरी बातें करना मृत्यु का फंदा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διγνώμων
  choice: दुविधा में रहनेवाले
  rationale: यह शब्द मन या विचार में दोराय होने का भाव रखता है। सहज आधुनिक हिन्दी में यह उस आंतरिक अनिश्चय को व्यक्त करता है, बिना इसे केवल क्षणिक संदेह तक सीमित किए।
- source_word: δίγλωσσος
  choice: दोहरी बात करनेवाले
  rationale: शाब्दिक रूप से ‘दो-जिह्वा’ का संकेत है, पर आशय अलग-अलग लोगों से विरोधी या कपटपूर्ण बातें कहना है। यह हिन्दी प्रयोग उस व्यवहार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: διγλωσσία
  choice: दोहरी बात
  rationale: यह δίγλωσσος से जुड़ी संज्ञा है और कथन में दोहराव को बनाए रखती है। ‘दोहरी बात’ स्वाभाविक हिन्दी में कपटपूर्ण अथवा परस्पर-विरोधी वाणी की अपेक्षित व्यापकता सुरक्षित रखती है।
- source_word: παγὶς θανάτου
  choice: मृत्यु का फंदा
  rationale: 'मूल रूपक को सीधे और स्पष्ट रूप से बनाए रखा गया है: ऐसा फंदा जो मृत्यु में ले जाता है या मृत्यु से संबद्ध है।'
theological_decisions:
- issue: मृत्यु के फंदे का अर्थ
  choice: ‘मृत्यु का फंदा’ रूपक को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘मृत्यु की ओर ले जानेवाला फंदा’
  rationale: यूनानी संबंधवाचक पदबंध यह स्पष्ट नहीं करता कि मृत्यु परिणाम, स्वामी या विशेषता के रूप में अभिप्रेत है; इसलिए मूल की संक्षिप्तता और तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर निषेध ‘न तो…न…’ से व्यक्त किए गए हैं और मूल की कारणसूचक संरचना ‘क्योंकि’ द्वारा बनाए रखी गई है।
