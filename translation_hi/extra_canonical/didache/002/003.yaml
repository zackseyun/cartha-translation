id: DID.2.3
reference: Didache 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, οὐκ ἐπιορκήσεις, οὐ ψευδομαρτυρήσεις, οὐ κακολογήσεις, οὐ μνησικακήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/003.yaml
  text: You shall not covet the things of your neighbor[a]; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge.
translation:
  language: hi
  text: तुम अपने पड़ोसी की वस्तुओं का लालच नहीं करोगे[a]; तुम झूठी शपथ नहीं खाओगे; तुम झूठी गवाही नहीं दोगे; तुम किसी की बुराई नहीं करोगे; और तुम मन में बैर नहीं रखोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम अपने पड़ोसी की वस्तुओं की लालसा नहीं करोगे।’
    reason: यूनानी ἐπιθυμέω का सामान्य अर्थ इच्छा या लालसा करना भी हो सकता है, यद्यपि इस संदर्भ में निषिद्ध लोभ प्रमुख है।
lexical_decisions:
- source_word: ἐπιθυμήσεις
  choice: लालच नहीं करोगे
  rationale: यहाँ क्रिया पड़ोसी की वस्तुओं के संदर्भ में दशाज्ञा की प्रतिध्वनि है और अनुचित, अधिकार जमाने वाली इच्छा व्यक्त करती है; इसलिए तटस्थ ‘इच्छा’ की अपेक्षा ‘लालच’ उपयुक्त है।
- source_word: τὰ τοῦ πλησίον
  choice: अपने पड़ोसी की वस्तुओं
  rationale: यूनानी पद का अर्थ पड़ोसी से संबंधित या उसके अधिकार की चीज़ें है; यह हिंदी में स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐπιορκήσεις
  choice: झूठी शपथ नहीं खाओगे
  rationale: यह क्रिया झूठी शपथ खाने अथवा शपथ भंग करने का बोध करा सकती है; मुख्य पाठ में निकटतम और सहज अर्थ रखा गया है।
- source_word: ψευδομαρτυρήσεις
  choice: झूठी गवाही नहीं दोगे
  rationale: यह न्यायिक और सामान्य दोनों संदर्भों में झूठी साक्षी देने का मानक अर्थ है।
- source_word: κακολογήσεις
  choice: किसी की बुराई नहीं करोगे
  rationale: यह किसी के विरुद्ध बुरा बोलने, निंदा करने या अपशब्द कहने का व्यापक भाव सुरक्षित रखता है।
- source_word: μνησικακήσεις
  choice: मन में बैर नहीं रखोगे
  rationale: शब्द का शाब्दिक भाव किए गए बुरे व्यवहार को याद रखकर द्वेष पालना है; ‘मन में बैर रखना’ आधुनिक हिंदी में इसी स्थायी दुर्भाव को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἐπιθυμέω में इच्छा और लोभ के बीच अर्थ-भेद
  choice: मुख्य पाठ में ‘लालच’
  alternative: ‘इच्छा’ या ‘लालसा’
  rationale: पड़ोसी की वस्तुओं का उल्लेख इसे दशाज्ञा-सदृश निषिद्ध अभिलाषा बनाता है, फिर भी व्यापक शब्दार्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: μνησικακέω की आंतरिक वृत्ति
  choice: ‘मन में बैर रखना’
  alternative: ‘बुराई को याद रखना’
  rationale: शाब्दिक विकल्प हिंदी में अस्वाभाविक और अस्पष्ट होता; चुना गया रूप बदला पालने या द्वेष बनाए रखने की नैतिक धारणा को बिना संप्रदायगत विस्तार के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष निषेधात्मक शैली अपनाई गई है। समानांतर आज्ञाओं की लय बनाए रखने के लिए ‘नहीं करोगे/खाओगे/दोगे’ की संरचना रखी गई है; अंतिम खंड से पहले ‘और’ हिंदी प्रवाह को स्वाभाविक बनाता है।
