  source_fidelity: The Hindi accurately represents all five Greek prohibitions. ‘अपने पड़ोसी की वस्तुओं का लालच’ appropriately conveys the Decalogue-like illicit desire of οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, while its footnote preserves the broader possible sense ‘desire/long for.’ ‘झूठी शपथ नहीं खाओगे’ is a sound rendering of ἐπιορκήσεις in this prohibitive context; the remaining clauses faithfully convey false testimony, evil speech, and retaining resentment.
