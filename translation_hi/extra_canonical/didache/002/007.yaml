source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/007.yaml
  text: You shall not hate any person, but some you shall reprove, for some you shall pray, and some you shall love more than your own life.
translation:
  language: hi
  text: तुम किसी भी व्यक्ति से घृणा न करना; परन्तु कुछ को दोष बताकर समझाना, कुछ के लिए प्रार्थना करना, और कुछ से अपने प्राण से भी बढ़कर प्रेम करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ἄνθρωπον
  choice: किसी भी मनुष्य
  rationale: यह पदबंध सामान्य रूप से प्रत्येक व्यक्ति को दर्शाता है, न कि केवल पुरुष को; आधुनिक हिन्दी में ‘किसी भी मनुष्य’ निषेध के व्यापक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλέγξεις
  choice: समझाना
  rationale: यह क्रिया दोष प्रकट करने, टोकने या सुधार के लिए समझाने का भाव रखती है। ‘समझाना’ साधारण पाठकों के लिए स्वाभाविक है और केवल कठोर डाँट का अर्थ आरोपित नहीं करता।
- source_word: προσεύξῃ
  choice: प्रार्थना करना
  rationale: मध्यवाच्य रूप का आशय यहाँ कुछ लोगों के लिए प्रार्थना करने से है; हिन्दी में परसर्ग के साथ यह संबंध स्पष्ट किया गया है।
- source_word: ὑπὲρ τὴν ψυχήν σου
  choice: अपने प्राण से भी बढ़कर
  rationale: ψυχή यहाँ जीवन अथवा प्राण के अर्थ में है, और ὑπέρ तुलना में ‘से बढ़कर’ का भाव देता है। यह अभिव्यक्ति मूल की तीव्रता बनाए रखती है।
theological_decisions:
- issue: लोगों की तीन श्रेणियों के बीच संबंध
  choice: ‘कुछ को… कुछ के लिए… और कुछ से…’ की समानांतर रचना बनाए रखी
  alternative: दूसरे और तीसरे समूह को पहले समूह के उपसमूह या एक ही लोगों पर लागू कार्य मानना
  rationale: मूल में οὓς μὲν… περὶ δὲ ὧν… οὓς δὲ तीन विपरीत/समांतर संबंध प्रस्तुत करता है। अनुवाद इन्हें अलग समूहों की तरह सुनने देता है, पर उनकी सीमाओं के बारे में अतिरिक्त धर्मशास्त्रीय निष्कर्ष नहीं जोड़ता।
- issue: ‘अपने प्राण से भी बढ़कर प्रेम’ का आशय
  choice: मूल की प्रबल तुलनात्मक भाषा को यथावत रखा
  alternative: इसे ‘अपने समान’ या ‘बहुत प्रेम’ करके नरम करना
  rationale: ὑπὲρ τὴν ψυχήν σου स्पष्ट रूप से अपने जीवन/प्राण से बढ़कर प्रेम की बात कहता है; इसे नरम करने का पाठगत आधार नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सीधी और आज्ञार्थक शैली अपनाई गई है। ‘न करना’ की रचना निषेध को सहज बनाती है, जबकि तीन समानांतर क्रियाएँ यूनानी वाक्य की लय और नैतिक तनाव को बनाए रखती हैं।
