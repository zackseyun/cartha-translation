- from: तुम किसी भी मनुष्य से घृणा न करना; बल्कि कुछ को समझाना, कुछ के लिए प्रार्थना करना, और कुछ से अपने प्राण से भी बढ़कर प्रेम करना।
  to: तुम किसी भी व्यक्ति से घृणा न करना; परन्तु कुछ को दोष बताकर समझाना, कुछ के लिए प्रार्थना करना, और कुछ से अपने प्राण से भी बढ़कर प्रेम करना।
  rationale: Replaced “कुछ को समझाना” with “कुछ को दोष बताकर समझाना” to represent the reproving force of ἐλέγξεις. Replaced generic “मनुष्य” with the equally inclusive and more idiomatic “व्यक्ति.” No footnotes are required, and the source’s threefold parallelism and its ambiguity about the relationship among the groups remain intact.
