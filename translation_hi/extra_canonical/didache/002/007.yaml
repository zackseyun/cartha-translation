review_pass:
  verdict: revise
  source_fidelity: The overall imperative structure and the three parallel groups are retained. However, “समझाना” ordinarily means “explain [something]” in Hindi and does not adequately convey ἐλέγξεις, which denotes reproving or calling attention to fault. The revision makes this corrective/reproving sense explicit without overstating its severity.
  naturalness: The revised wording is modern, clear Hindi and preserves the compact, parallel cadence of the Greek. “किसी भी व्यक्ति” is a natural inclusive rendering of ἄνθρωπον.
  terminology: “प्रार्थना करना” accurately renders προσεύξῃ, and “अपने प्राण से भी बढ़कर प्रेम करना” preserves the force of ὑπὲρ τὴν ψυχήν σου. “दोष बताकर समझाना” gives ἐλέγξεις its needed moral-corrective sense more accurately than bare “समझाना.”
  issues:
  - severity: medium
    issue: “समझाना” is too semantically broad for ἐλέγξεις.
    rationale: In ordinary modern Hindi it can simply mean explaining or persuading, whereas the Greek verb here carries the sense of reproof/correction by identifying fault. The translation should retain that element.
  revised_text: तुम किसी भी व्यक्ति से घृणा न करना; परन्तु कुछ को दोष बताकर समझाना, कुछ के लिए प्रार्थना करना, और कुछ से अपने प्राण से भी बढ़कर प्रेम करना।
  revised_footnotes: []
  revision_rationale: Replaced “कुछ को समझाना” with “कुछ को दोष बताकर समझाना” to represent the reproving force of ἐλέγξεις. Replaced generic “मनुष्य” with the equally inclusive and more idiomatic “व्यक्ति.” No footnotes are required, and the source’s threefold parallelism and its ambiguity about the relationship among the groups remain intact.
