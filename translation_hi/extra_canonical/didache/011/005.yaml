source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ μενεῖ δὲ ἡμέραν μίαν· ἐὰν δὲ ᾖ χρεία, καὶ τὴν ἄλλην· τρεῖς δὲ ἐὰν μείνῃ, ψευδοπροφήτης ἐστίν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/005.yaml
  text: But he shall not remain one day; but if there is need, also the next. But if he remains three days, he is a false prophet.
translation:
  language: hi
  text: पर वह एक दिन नहीं ठहरेगा; लेकिन यदि आवश्यकता हो, तो अगले दिन भी ठहर सकता है। पर यदि वह तीन दिन ठहरे, तो वह झूठा भविष्यद्वक्ता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μενεῖ δὲ ἡμέραν μίαν
  choice: पर वह एक दिन नहीं ठहरेगा
  rationale: स्रोत-पाठ में उपस्थित निषेध οὐ को स्पष्ट रूप से बनाए रखा गया है, यद्यपि आगे की बात के साथ इसका तनाव बना रहता है।
- source_word: ἐὰν δὲ ᾖ χρεία, καὶ τὴν ἄλλην
  choice: लेकिन यदि आवश्यकता हो, तो अगले दिन भी ठहर सकता है
  rationale: यूनानी में क्रिया लुप्त है; हिन्दी में अर्थ स्वाभाविक बनाने के लिए ‘ठहर सकता है’ जोड़ा गया है। τὴν ἄλλην का संदर्भानुसार अर्थ ‘अगले दिन’ है।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यद्वक्ता
  rationale: यह व्यक्ति को ऐसे भविष्यद्वक्ता के रूप में चिह्नित करता है जिसका दावा झूठा है; प्रचलित और अर्थ-सटीक हिन्दी पद चुना गया है।
theological_decisions:
- issue: पहले वाक्य के निषेध और अगले दिन ठहरने की अनुमति के बीच तनाव
  choice: स्रोत-पाठ के निषेध को ज्यों का त्यों बनाए रखा गया
  alternative: ‘वह केवल एक दिन ठहरे’ पढ़कर कथन को तार्किक रूप से समतल करना
  rationale: प्रदत्त यूनानी पाठ में οὐ (‘नहीं’) स्पष्ट है। संदर्भगत कठिनाई के कारण उसे हटाना या विपरीत अर्थ देना स्रोत-पाठ का मौन संशोधन होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह’ का संदर्भ पिछले पद में आए प्रेरित/भविष्यद्वक्ता से है। पहले दो वाक्यों का स्रोतगत तनाव जानबूझकर हल नहीं किया गया।
