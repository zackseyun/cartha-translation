id: DID.11.11
reference: Didache 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης δεδοκιμασμένος, ἀληθινός, ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας, μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ, οὐ κριθήσεται ἐφ᾽ ὑμῶν· μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν· ὡσαύτως γὰρ ἐποίησαν καὶ οἱ ἀρχαῖοι προφῆται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/011.yaml
  text: But every prophet who has been tested, genuine, doing for an earthly mystery of the church, yet not teaching others to do what he himself does, will not be judged by you; for he has his judgment with God. For in the same way the ancient prophets also did.
translation:
  language: hi
  text: पर हर वह भविष्यद्वक्ता जो परखा हुआ और सच्चा है, और कलीसिया के सांसारिक रहस्य के लिए कुछ करता है,[a] लेकिन जो कुछ वह स्वयं करता है उसे करने की शिक्षा नहीं देता, उसका न्याय तुम नहीं करोगे; क्योंकि उसका न्याय परमेश्वर के पास है। प्राचीन भविष्यद्वक्ताओं ने भी इसी प्रकार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध का शाब्दिक अर्थ लगभग ‘कलीसिया के सांसारिक रहस्य के लिए करता हुआ’ है। इसका सटीक आशय अनिश्चित है; संभवतः यह किसी प्रतीकात्मक भविष्यसूचक आचरण की ओर संकेत करता है।
    reason: मूल पदबंध अत्यंत असामान्य और व्याख्यात्मक रूप से विवादित है; टिप्पणी पाठक को अस्पष्टता बताती है, पर मुख्य पाठ में किसी एक अनुमान को स्थापित नहीं करती।
lexical_decisions:
- source_word: προφήτης
  choice: भविष्यद्वक्ता
  rationale: यह प्रचलित और गरिमापूर्ण हिन्दी बाइबलीय पद है तथा यहाँ समुदाय में बोलने वाले नबी के अर्थ को बनाए रखता है।
- source_word: δεδοκιμασμένος, ἀληθινός
  choice: परखा हुआ और सच्चा
  rationale: 'दोनों विशेषणों को अलग रखा गया है: पहला जाँच में खरा उतरने और दूसरा वास्तविक अथवा विश्वसनीय होने का भाव देता है।'
- source_word: ποιῶν
  choice: कुछ करता है
  rationale: क्रिया के व्यापक अर्थ को बनाए रखा गया है; कर्म को स्पष्ट रूप से जोड़ने के बजाय ‘कुछ’ रखा गया है क्योंकि यूनानी वाक्यांश स्वयं कठिन और संदिग्ध है।
- source_word: μυστήριον κοσμικὸν ἐκκλησίας
  choice: कलीसिया का सांसारिक रहस्य
  rationale: असामान्य यूनानी पदबंध की वास्तविक अस्पष्टता को सुरक्षित रखा गया है। ‘सांसारिक’ κοσμικόν के इस संसार/भौतिक क्षेत्र से जुड़े भाव को व्यक्त करता है, जबकि ‘रहस्य’ μυστήριον की धार्मिक और प्रतीकात्मक अनुगूँज बनाए रखता है।
- source_word: κρίσιν
  choice: न्याय का मामला
  rationale: ‘उसका न्याय परमेश्वर के साथ है’ के अत्यधिक कृत्रिम हिन्दी रूप से बचते हुए न्यायाधिकार परमेश्वर के पास होने का भाव दिया गया है।
- source_word: ἀρχαῖοι προφῆται
  choice: प्राचीन भविष्यद्वक्ता
  rationale: यह पद पुराने समय के नबियों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वक्ता के असामान्य प्रतीकात्मक आचरण का आशय
  choice: वाक्यांश को ‘कलीसिया के सांसारिक रहस्य के लिए कुछ करता है’ के रूप में खुला रखा गया है।
  alternative: इसे विवाह, भोजन, या कलीसिया और संसार से संबंधित किसी विशेष भविष्यसूचक अभिनय के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ किसी एक विशिष्ट आचरण को निश्चित नहीं करता; किसी विशेष व्याख्या को मुख्य पाठ में रखना सांप्रदायिक या अनुमानाधारित अर्थ आरोपित करता।
- issue: मानवीय समुदाय और परमेश्वर के न्याय का संबंध
  choice: ‘उसका न्याय तुम नहीं करोगे; क्योंकि उसके न्याय का मामला परमेश्वर के साथ है।’
  alternative: इसे भविष्यद्वक्ता को हर प्रकार की सामुदायिक जाँच से पूर्ण छूट देने के रूप में प्रस्तुत करना।
  rationale: निकटवर्ती संदर्भ में भविष्यद्वक्ता का पहले ‘परखा हुआ’ होना आवश्यक है। इसलिए यहाँ विशेष वर्णित आचरण पर निर्णय न देने की बात है, न कि विवेक या जाँच के सार्वभौमिक निषेध की।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। कठिन यूनानी पदबंध को अत्यधिक सरल या सिद्धांतगत रूप से निश्चित करने के बजाय मुख्य पाठ में उसकी असामान्यता और पादटिप्पणी में उसकी अनिश्चितता सुरक्षित रखी गई है।
