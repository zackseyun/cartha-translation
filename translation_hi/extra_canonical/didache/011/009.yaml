source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πᾶς προφήτης ὁρίζων τράπεζαν ἐν πνεύματι, οὐ φάγεται ἀπ᾽ αὐτῆς, εἰδὲ μήγε ψευδοπροφήτης ἐστί·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/009.yaml
  text: And every prophet who sets a table in the Spirit shall not eat from it[a]; otherwise he is a false prophet.
translation:
  language: hi
  text: और हर वह भविष्यवक्ता जो आत्मा में भोजन की मेज़ लगाने का आदेश दे, उसमें से न खाए; नहीं तो वह झूठा भविष्यवक्ता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρίζων
  choice: लगवाने का आदेश दे
  rationale: यह कृदन्त यहाँ किसी मेज़ अथवा भोजन की व्यवस्था करने का निर्देश देने का भाव रखता है। केवल ‘लगाए’ कहने से ऐसा लग सकता है कि भविष्यवक्ता स्वयं मेज़ लगा रहा है।
- source_word: τράπεζαν
  choice: भोजन की मेज़
  rationale: τράπεζα का मूल अर्थ ‘मेज़’ है, पर प्रसंग में उस पर रखा भोजन भी अभिप्रेत हो सकता है। ‘भोजन की मेज़’ दोनों पक्षों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में होकर
  rationale: मूल के ‘आत्मा में’ पदबंध को बनाए रखा गया है; ‘आत्मा की प्रेरणा से’ अधिक सहज होता, पर वह सम्बन्ध को कुछ अधिक स्पष्ट करके मूल की सम्भावित अस्पष्टता घटा देता।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यवक्ता
  rationale: यह प्रचलित और अर्थ-सटीक हिन्दी पद है।
theological_decisions:
- issue: क्या ἐν πνεύματι को सीधे ‘आत्मा की प्रेरणा से’ कहा जाए
  choice: आत्मा में होकर
  alternative: आत्मा की प्रेरणा से
  rationale: मूल यूनानी उस प्रेरणा की प्रकृति को विस्तार से नहीं बताता। अधिक औपचारिक पदबंध भविष्यवाणी से जुड़े दावे को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- issue: निषेध को सामान्य नियम या भविष्यकाल के रूप में प्रस्तुत करना
  choice: वह उस भोजन में से न खाए
  alternative: वह उस भोजन में से नहीं खाएगा
  rationale: οὐ φάγεται रूपतः भविष्यकाल है, किन्तु इस उपदेशात्मक प्रसंग में नियम अथवा निषेध व्यक्त करता है। हिन्दी में ‘न खाए’ इस निर्देशात्मक बल को स्वाभाविक रूप से प्रकट करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘भोजन की मेज़ लगवाने का आदेश दे’ मूल के आदेशात्मक भाव तथा मेज़/भोजन की अर्थ-छाया दोनों को व्यक्त करता है; फुटनोट अधिक शाब्दिक रूप बताता है।
