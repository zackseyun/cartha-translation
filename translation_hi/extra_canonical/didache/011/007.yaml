id: DID.11.7
reference: Didache 11:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πάντα προφήτην λαλοῦντα ἐν πνεύματι οὐ πειράσετε οὐδὲ διακρινεῖτε· πᾶσα γὰρ ἁμαρτία ἀφεθήσεται, αὕτη δὲ ἡ ἁμαρτία οὐκ ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/007.yaml
  text: And you shall not test or judge any prophet speaking in the Spirit; for every sin will be forgiven[a], but this sin will not be forgiven.
translation:
  language: hi
  text: और आत्मा में बोलने वाले किसी भी भविष्यद्वक्ता को न परखो और न उसका न्याय करो; क्योंकि हर पाप क्षमा किया जाएगा, पर यह पाप क्षमा नहीं किया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα προφήτην
  choice: किसी भी भविष्यद्वक्ता को
  rationale: नकारात्मक क्रियाओं के साथ πᾶς का आशय पूर्ण निषेध है—ऐसे किसी भी भविष्यद्वक्ता को नहीं—न कि ‘हर भविष्यद्वक्ता को नहीं’, जिससे आंशिक निषेध का भ्रम हो सकता है।
- source_word: λαλοῦντα ἐν πνεύματι
  choice: आत्मा में बोलने वाले
  rationale: यह यूनानी पदबंध की संक्षिप्तता और उसकी कुछ हद तक खुली हुई अभिव्यक्ति को बनाए रखता है; ‘आत्मा की प्रेरणा से’ अर्थ स्पष्ट करता, पर स्रोत से अधिक व्याख्यात्मक होता।
- source_word: πειράσετε
  choice: परखना
  rationale: संदर्भ में इसका अर्थ किसी दावे या व्यक्ति को कसौटी पर रखकर जाँचना है; ‘परखना’ स्वाभाविक और संक्षिप्त है।
- source_word: διακρινεῖτε
  choice: न्याय करना
  rationale: यह पहले क्रियापद से अलग निर्णय देने या दोष ठहराने का भाव बनाए रखता है; केवल ‘जाँच करना’ कहने पर दोनों क्रियाएँ लगभग एक हो जातीं।
- source_word: ἀφεθήσεται
  choice: क्षमा किया जाएगा
  rationale: पाप के संदर्भ में ἀφίημι का प्रचलित और सटीक धार्मिक अर्थ ‘क्षमा करना’ है।
theological_decisions:
- issue: ἐν πνεύματι में ‘आत्मा’ की पहचान
  choice: आत्मा में
  alternative: पवित्र आत्मा की प्रेरणा से
  rationale: यूनानी पाठ में πνεύματι के साथ ‘पवित्र’ नहीं है। संदर्भ दिव्य आत्मा की ओर संकेत करता है, फिर भी अनुवाद ने स्रोत की अभिव्यक्ति को विस्तार देकर अधिक निश्चित नहीं बनाया।
- issue: भविष्यद्वक्ता को न परखने की आज्ञा का विस्तार
  choice: वाक्य को उसके बिना शर्त रूप में रखा गया
  alternative: केवल सच्चे भविष्यद्वक्ता या केवल उसकी आत्मिक वाणी को न परखना
  rationale: इस पद में कोई अतिरिक्त सीमा स्पष्ट नहीं की गई है। निकटवर्ती संदर्भ इस कथन को संतुलित कर सकता है, पर उसे इस एक पद में जोड़ना स्रोत से परे होगा।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और निर्देशात्मक है। ‘न परखना, न उसका न्याय करना’ यूनानी के दो निषेधों को अलग रखते हुए हिंदी में स्वाभाविक समानांतर रचना देता है। ‘किसी भी’ नकार के वास्तविक व्यापक आशय को स्पष्ट करता है।
