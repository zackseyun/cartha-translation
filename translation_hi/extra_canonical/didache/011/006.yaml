source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐξερχόμενος δὲ ὁ ἀπόστολος μηδὲ λαμβανέτω εἰμὴ ἄρτον ἕως οὗ αὐλισθῇ· ἐὰν δὲ ἀργύριον αἰτῇ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/006.yaml
  text: And when the apostle departs, let him take nothing except bread until he finds lodging; but if he asks for money, he is a false prophet.
translation:
  language: hi
  text: और जब प्रेरित विदा हो, तो वह उस जगह तक जहाँ वह रात बिताए, रोटी के सिवा कुछ न ले। लेकिन यदि वह पैसे माँगे, तो वह झूठा भविष्यद्वक्ता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यहाँ शब्द भ्रमण करने वाले भेजे हुए सेवक की मान्य उपाधि के रूप में आया है; हिन्दी में स्थापित और स्वाभाविक समतुल्य ‘प्रेरित’ है।
- source_word: αὐλισθῇ
  choice: रात बिताए
  rationale: क्रिया का मूल अर्थ रात के लिए ठहरना या डेरा करना है; ‘रात बिताए’ इसे सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἀργύριον
  choice: पैसे
  rationale: शाब्दिक अर्थ ‘चाँदी’ हो सकता है, पर इस प्रसंग में इसका आशय धन या मुद्रा है; ‘पैसे’ साधारण पाठक के लिए स्वाभाविक है।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यद्वक्ता
  rationale: यौगिक शब्द का सीधा और धार्मिक साहित्य में प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: प्रेरित द्वारा यात्रा के लिए रोटी लेने की सीमा
  choice: ‘उस जगह तक जहाँ वह रात बिताए’ को उद्देश्य/समय-सीमा की तरह रखा गया
  alternative: ‘जब तक उसे ठहरने की जगह न मिले’
  rationale: ἕως οὗ αὐλισθῇ का संबंध रात के लिए ठहरने से है। अनुवाद यह नहीं जोड़ता कि ठिकाना पहले से अज्ञात था, और न यह तय करता है कि रोटी कितनी अवधि के लिए पर्याप्त हो।
- issue: पैसे माँगने पर पहचान
  choice: निष्कर्ष को सीधे ‘वह झूठा भविष्यद्वक्ता है’ रखा गया
  alternative: ‘उसे झूठा भविष्यद्वक्ता समझो’
  rationale: यूनानी पाठ अस्तित्ववाचक सीधा कथन करता है; इसे केवल समुदाय के निर्णय या संदेह के रूप में नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। निषेधात्मक विधान की संक्षिप्तता और दूसरे खंड के कठोर निर्णय को बनाए रखा गया है।
