id: DID.11.12
reference: Didache 11:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς δ᾽ ἂν εἴπῃ ἐν πνεύματι· Δός μοι ἀργύρια ἢ ἕτερά τινα, οὐκ ἀκούσεσθε αὐτοῦ· ἐὰν δὲ περὶ ἄλλων ὑστερούντων εἴπῃ δοῦναι, μηδεὶς αὐτὸν κρινέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/012.yaml
  text: But whoever says in the Spirit[a], “Give me money or something else,” you shall not listen to him. But if he tells you to give for others who are in need, let no one judge him.
translation:
  language: hi
  text: पर जो कोई आत्मा में बोलकर कहे, “मुझे पैसे या कोई दूसरी चीज़ दो,” उसकी बात न मानना। पर यदि वह अभाव में पड़े दूसरों के लिए देने को कहे, तो कोई उसका न्याय न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: यूनानी वाक्यांश का औपचारिक और जानबूझकर कुछ अस्पष्ट अनुवाद; संदर्भ में भविष्यद्वाणी की प्रेरित वाणी का संकेत है, पर मूल में ‘पवित्र’ शब्द नहीं है।
- source_word: ἀργύρια
  choice: पैसे
  rationale: बहुवचन रूप मूलतः चाँदी के सिक्कों/धन को सूचित करता है; आधुनिक पाठक के लिए ‘पैसे’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ἕτερά τινα
  choice: कोई और वस्तु
  rationale: यह δός के साथ माँगी गई दूसरी चीज़ को सूचित करता है; इसे उद्धरण के भीतर रखा गया है ताकि वह ‘कुछ और कहे’ न समझा जाए।
- source_word: οὐκ ἀκούσεσθε αὐτοῦ
  choice: उसकी बात न मानना
  rationale: यहाँ ‘सुनना’ आज्ञापालन/ध्यान देने के अर्थ में है; केवल श्रवण न करने के बजाय व्यवहारगत आशय व्यक्त किया गया है।
- source_word: ὑστερούντων
  choice: अभाव में पड़े
  rationale: कमी या आवश्यकता झेल रहे लोगों का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κρινέτω
  choice: न्याय न करे
  rationale: मूल के ‘निर्णय/न्याय करना’ को खुला रखता है; इसे केवल ‘निंदा’ तक सीमित नहीं करता।
theological_decisions:
- issue: ἐν πνεύματι में ‘आत्मा’ की पहचान
  choice: आत्मा में
  alternative: पवित्र आत्मा की प्रेरणा से
  rationale: मूल पाठ केवल πνεύματι कहता है। स्पष्ट व्याख्यात्मक विस्तार जोड़ने के बजाय संभावित धार्मिक अर्थ और मूल की संक्षिप्तता सुरक्षित रखी गई है।
- issue: माँग अपने लिए है या सामान्य माँग है
  choice: “मुझे पैसे या कोई और वस्तु दो”
  alternative: “पैसे दो,” या कोई और बात कहे
  rationale: μοι दोनों माँगी गई वस्तुओं से जुड़ा है और ἢ ἕτερά τινα उद्धृत माँग का भाग है; अगला वाक्य दूसरों के लिए माँगने का स्पष्ट अपवाद देता है।
- issue: दूसरों के लिए देने को कहने वाले का मूल्यांकन
  choice: कोई उसका न्याय न करे
  alternative: कोई उसकी निंदा न करे
  rationale: κρίνω का व्यापक अर्थ बनाए रखा गया है, जिससे पाठक पर लगाए गए निषेध की धार्मिक और नैतिक तीव्रता को संकीर्ण नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य dignified किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘आत्मा में’ और ‘न्याय न करे’ जैसे प्रमुख धार्मिक पद मूल की अभिव्यक्ति और अस्पष्टता के निकट रखे गए हैं।
