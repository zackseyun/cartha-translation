  text: Περὶ δὲ τῶν ἀποστόλων καὶ προφητῶν κατὰ τὸ δόγμα τοῦ εὐαγγελίου, οὕτω ποιήσατε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/003.yaml
  text: Concerning the apostles and prophets, according to the rule of the gospel, do thus.
translation:
  language: hi
  text: प्रेरितों और भविष्यद्वक्ताओं के विषय में, सुसमाचार के नियम के अनुसार, इस प्रकार करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστόλων
  choice: प्रेरितों
  rationale: यह आरंभिक मसीही संदर्भ में भ्रमणशील अथवा भेजे गए सेवकों के लिए प्रचलित और स्रोत-संगत पद है।
- source_word: προφητῶν
  choice: भविष्यद्वक्ताओं
  rationale: यह προφήτης का मानक हिन्दी धार्मिक प्रतिशब्द है और यहाँ व्यक्तियों के वर्ग को दर्शाता है।
- source_word: δόγμα
  choice: नियम
  rationale: इस संदर्भ में इसका अर्थ शिक्षा से निकला मार्गदर्शक नियम या मानदंड है; ‘मत’ यहाँ अत्यधिक सिद्धान्त-केंद्रित और ‘आज्ञा’ अपेक्षाकृत संकीर्ण होती।
- source_word: εὐαγγελίου
  choice: सुसमाचार
  rationale: यह εὐαγγέλιον का स्थापित, स्वाभाविक और अर्थ-सटीक हिन्दी प्रतिशब्द है।
- source_word: οὕτω ποιήσατε
  choice: इस प्रकार करो
  rationale: संक्षिप्त बहुवचन आज्ञार्थक अभिव्यक्ति को वर्तमान हिन्दी में सीधे और स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: κατὰ τὸ δόγμα τοῦ εὐαγγελίου में संबंध
  choice: सुसमाचार के नियम के अनुसार
  alternative: सुसमाचार की शिक्षा के अनुसार
  rationale: ‘नियम’ δόγμα के मानदंडात्मक भाव को बनाए रखता है, पर उसे किसी विशिष्ट कलीसियाई विधान या संप्रदायगत सिद्धान्त के रूप में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। यूनानी वाक्य की विषय-प्रस्तावना और सीधी आज्ञा सुरक्षित हैं; अनावश्यक आरंभिक ‘अब’ नहीं जोड़ा गया।
