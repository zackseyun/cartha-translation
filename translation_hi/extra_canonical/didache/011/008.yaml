id: DID.11.8
reference: Didache 11:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
translation:
  language: hi
  text: फिर भी, हर कोई जो आत्मा में बोलता है, भविष्यद्वक्ता नहीं है; बल्कि केवल वही है जिसका आचरण प्रभु के अनुरूप हो। इसलिए झूठे भविष्यद्वक्ता और भविष्यद्वक्ता की पहचान उनके आचरण से होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλῶν ἐν πνεύματι
  choice: आत्मा में बोलता है
  rationale: यूनानी पदबंध की आत्मिक/करिश्माई भाषा को बिना अतिरिक्त व्याख्या के सीधा और स्वाभाविक रूप देता है।
- source_word: προφήτης
  choice: भविष्यद्वक्ता
  rationale: यह प्रचलित बाइबलीय हिन्दी शब्द है; प्रसंग में इसका अर्थ केवल भविष्य बताने वाले तक सीमित नहीं किया गया।
- source_word: τοὺς τρόπους Κυρίου
  choice: उसका आचरण प्रभु के आचरण के अनुरूप हो
  rationale: τρόποι यहाँ व्यवहार, चरित्र या जीवन-ढंग का संकेत देता है। 'अनुरूप' मूल में निहित कसौटी को स्वाभाविक हिन्दी में स्पष्ट करता है और दीदाखे के तकनीकी ὁδός ('मार्ग') से इसे अलग रखता है।
- source_word: Ἀπὸ ... τῶν τρόπων γνωσθήσεται
  choice: अपने-अपने आचरण से पहचाने जाएँगे
  rationale: स्रोत के पहचान की कसौटी वाले भाव और कर्मवाच्य को बनाए रखते हुए हिन्दी में दोनों प्रकार के व्यक्तियों के आचरण की ओर स्पष्ट संकेत करता है।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यद्वक्ता
  rationale: यूनानी संयुक्त शब्द का स्पष्ट और पारंपरिक हिन्दी समतुल्य।
theological_decisions:
- issue: आत्मा में बोलना और वास्तविक भविष्यद्वक्ता होना
  choice: आत्मा में बोलने का दावा या अनुभव अपने आप किसी को भविष्यद्वक्ता सिद्ध नहीं करता; आचरण कसौटी है।
  alternative: ‘आत्मा से प्रेरित होकर बोलता है’ कहकर प्रेरणा को अधिक स्पष्ट करना।
  rationale: ‘आत्मा में’ मूल ἐν πνεύματι की अभिव्यक्ति और उसकी संभावित अस्पष्टता को सुरक्षित रखता है; पाठ स्वयं प्रभु-सदृश आचरण को निर्णायक कसौटी बनाता है।
- issue: τοὺς τρόπους Κυρίου का अर्थ
  choice: प्रभु के आचरण के अनुरूप आचरण
  alternative: ‘प्रभु के मार्ग’
  rationale: τρόπος नैतिक व्यवहार/जीवन-ढंग पर बल देता है और इसे दीदाखे में प्रयुक्त ὁδός (‘मार्ग’) के साथ अनावश्यक रूप से नहीं मिलाना चाहिए।
- issue: दूसरे वाक्य में एकवचन सामूहिक कर्ता
  choice: ‘झूठा भविष्यद्वक्ता और सच्चा भविष्यद्वक्ता ... पहचाने जाएँगे’
  alternative: 'शाब्दिक एकवचन: ‘झूठा भविष्यद्वक्ता और भविष्यद्वक्ता पहचाना जाएगा’'
  rationale: हिन्दी व्याकरण के अनुसार संयुक्त कर्ता के साथ बहुवचन स्वाभाविक है; ‘सच्चा’ जोड़ने से दोनों श्रेणियों का विरोध स्पष्ट होता है, बिना कोई नई धार्मिक धारणा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘आचरण’ को दोनों वाक्यों में दोहराकर यूनानी τρόπους/τρόπων की शब्दगत संगति रखी गई है। लिंग-निरपेक्षता के लिए अनावश्यक सर्वनाम से बचा गया है।
