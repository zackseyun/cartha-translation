revisions:
- from: फिर भी, जो कोई आत्मा में बोलता है, वह भविष्यद्वक्ता नहीं होता; बल्कि वह तभी भविष्यद्वक्ता है, जब उसका आचरण प्रभु के आचरण के अनुरूप हो। इसलिए झूठा भविष्यद्वक्ता और सच्चा भविष्यद्वक्ता अपने-अपने आचरण से पहचाने जाएँगे।
  to: फिर भी, हर कोई जो आत्मा में बोलता है, भविष्यद्वक्ता नहीं है; बल्कि केवल वही है जिसका आचरण प्रभु के अनुरूप हो। इसलिए झूठे भविष्यद्वक्ता और भविष्यद्वक्ता की पहचान उनके आचरण से होगी।
