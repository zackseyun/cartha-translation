review_pass:
  verdict: revise
  source_fidelity: 'Draft correctly renders ἐν πνεύματι, προφήτης, ψευδοπροφήτης, and the conduct-based test denoted by τρόποι. However, it adds two clarifications not stated in Greek: “प्रभु के आचरण” (rather than simply the Lord’s conduct/ways as the standard) and “सच्चा” before the second προφήτης. The revision retains the ethical sense of τρόποι without importing either addition.'
  naturalness: The revised Hindi is modern, clear, and suitably dignified. “आचरण प्रभु के अनुरूप हो” naturally conveys the idiomatic Greek expression “has the conduct of the Lord,” while “की पहचान उनके आचरण से होगी” is an idiomatic Hindi rendering of the passive future.
  terminology: “आत्मा में,” “भविष्यद्वक्ता,” “झूठा भविष्यद्वक्ता,” and “आचरण” are appropriate. “आचरण” distinguishes τρόπος (conduct/way of life) from the Didache’s technical ὁδός terminology without relying on “मार्ग.”
  issues:
  - severity: medium
    issue: The phrase “प्रभु के आचरण के अनुरूप” overstates and awkwardly recasts τοὺς τρόπους Κυρίου.
    rationale: The Greek says that the person has the Lord’s τρόποι, i.e. conduct characteristic of or conforming to the Lord. It does not explicitly speak of a separate “conduct of the Lord” to which the person’s conduct is compared. “उसका आचरण प्रभु के अनुरूप हो” preserves the intended ethical standard more economically.
  - severity: medium
    issue: “सच्चा” is added before the second “भविष्यद्वक्ता.”
    rationale: The contrast with ψευδοπροφήτης makes the sense understandable, but the Greek second term is simply ὁ προφήτης. Adding “सच्चा” is an unnecessary interpretive expansion.
  revised_text: फिर भी, हर कोई जो आत्मा में बोलता है, भविष्यद्वक्ता नहीं है; बल्कि केवल वही है जिसका आचरण प्रभु के अनुरूप हो। इसलिए झूठे भविष्यद्वक्ता और भविष्यद्वक्ता की पहचान उनके आचरण से होगी।
  revised_footnotes: []
  revision_rationale: 'The revision removes unsupported explicitation while preserving the verse’s contrast: speech “in the Spirit” does not by itself establish prophetic status; conduct conforming to the Lord is the criterion by which a false prophet and a prophet are recognized. No Hindi footnote is needed, since the supplied English audit note records an alternate English phrasing rather than a substantive source-text variant requiring representation in Hindi.'
