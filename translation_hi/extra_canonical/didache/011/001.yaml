  text: Ὃς ἂν οὖν ἐλθὼν διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα, δέξασθε αὐτόν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/001.yaml
  text: Therefore, whoever comes and teaches you all these things that have been said before, receive him.
translation:
  language: hi
  text: इसलिए, जो कोई आकर तुम्हें ये सब बातें सिखाए, जो पहले कही गई हैं, उसे स्वीकार करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάξῃ
  choice: सिखाए
  rationale: यह क्रिया शिक्षा देने के सामान्य अर्थ को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करती है।
- source_word: τὰ προειρημένα
  choice: जो पहले कही गई हैं
  rationale: यूनानी कृदंत का संदर्भ पहले कही जा चुकी बातों से है; यह रूप मूल का पुनरुल्लेख बनाए रखता है।
- source_word: δέξασθε
  choice: स्वीकार करो
  rationale: आज्ञार्थक क्रिया का अर्थ उस आने वाले शिक्षक का स्वागत और ग्रहण करना है; ‘स्वीकार करो’ इस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: आने वाले शिक्षक को स्वीकार करने की शर्त
  choice: स्वीकृति को पहले कही गई सभी बातों की शिक्षा से संबद्ध रखा गया है।
  alternative: हर आने वाले शिक्षक का बिना शर्त स्वागत करना।
  rationale: मूल वाक्य में ‘ये सब बातें...जो पहले कही गई हैं’ शिक्षक को स्वीकार करने की स्पष्ट कसौटी है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है, इसलिए ‘तुम्हें’ और सामूहिक आज्ञा ‘स्वीकार करो’ प्रयुक्त हुई है। भाषा सरल, गरिमापूर्ण और मूल यूनानी की संरचना के निकट रखी गई है।
