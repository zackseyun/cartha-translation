id: DID.11.2
reference: Didache 11:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἐὰν δὲ αὐτὸς ὁ διδάσκων στραφεὶς διδάσκῃ ἄλλην διδαχὴν εἰς τὸ καταλῦσαι, μὴ αὐτοῦ ἀκούσητε· εἰς δὲ τὸ προσθεῖναι δικαιοσύνην καὶ γνῶσιν Κυρίου, δέξασθε αὐτὸν ὡς Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/002.yaml
  text: But if the teacher himself turns and teaches another teaching so as to overthrow[a], do not listen to him; but if it is to add righteousness and knowledge of the Lord, receive him as the Lord.
translation:
  language: hi
  text: पर यदि वह शिक्षक स्वयं मुड़कर कोई दूसरी शिक्षा विनाश करने के लिए दे, तो उसकी बात न सुनो; लेकिन यदि वह धार्मिकता और प्रभु के ज्ञान को बढ़ाने के लिए हो, तो उसे प्रभु के समान स्वीकार करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: मूल क्रिया का सीधा अर्थ ‘मुड़ना’ है; ‘भटककर’ कहने से नैतिक मूल्यांकन अनावश्यक रूप से जुड़ जाता।
- source_word: ἄλλην διδαχὴν
  choice: कोई दूसरी शिक्षा
  rationale: ἄλλην और διδαχή दोनों को स्पष्ट रखते हुए स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: καταλῦσαι
  choice: नष्ट कर दे
  rationale: क्रिया का अर्थ गिराना, विघटित करना या निष्प्रभावी करना हो सकता है। मूल में कर्म व्यक्त नहीं है, इसलिए हिन्दी में भी उसे नहीं जोड़ा गया।
- source_word: προσθεῖναι
  choice: बढ़ाना
  rationale: δικαιοσύνην और γνῶσιν इसके प्रत्यक्ष कर्म हैं; इस संदर्भ में ‘बढ़ाना’ स्वाभाविक हिन्दी है और ‘में जोड़ना’ वाली गलत व्याकरणिक छाप से बचाता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: नैतिक-संबंधपरक ‘righteousness’ के लिए प्रचलित और गरिमापूर्ण हिन्दी पद।
- source_word: γνῶσιν Κυρίου
  choice: प्रभु का ज्ञान
  rationale: सम्बन्धकारक Κυρίου की वास्तविक अस्पष्टता—प्रभु के विषय में ज्ञान अथवा प्रभु से प्राप्त ज्ञान—को संकुचित नहीं करता।
- source_word: δέξασθε αὐτὸν ὡς Κύριον
  choice: उसे प्रभु के समान ग्रहण करो
  rationale: ὡς Κύριον की प्रबल तुलना को बनाए रखता है; इसे केवल ‘प्रभु की ओर से’ कहकर अर्थ को हल्का नहीं किया गया।
theological_decisions:
- issue: καταλῦσαι का अव्यक्त कर्म
  choice: ‘नष्ट कर दे’ के बाद कोई कर्म नहीं जोड़ा
  alternative: ‘इस शिक्षा को नष्ट कर दे’ या ‘इन बातों को उलट दे’
  rationale: यूनानी पाठ में कर्म व्यक्त नहीं है। सम्भावित संदर्भ को मुख्य पाठ में निश्चित कर देना मूल की अस्पष्टता मिटा देता।
- issue: γνῶσιν Κυρίου में सम्बन्धकारक का अर्थ
  choice: ‘प्रभु का ज्ञान’
  alternative: ‘प्रभु के विषय में ज्ञान’ या ‘प्रभु से मिलने वाला ज्ञान’
  rationale: हिन्दी सम्बन्धकारक मूल की वस्तुगत और स्रोतगत दोनों सम्भावनाएँ खुली रखता है।
- issue: ὡς Κύριον की तुलना
  choice: ‘प्रभु के समान’
  alternative: ‘मानो वह प्रभु हो’ या ‘प्रभु की ओर से आए व्यक्ति की तरह’
  rationale: सीधी तुलना सुरक्षित रखी गई है, बिना शिक्षक को तत्त्वतः प्रभु घोषित किए या उसे केवल प्रतिनिधि तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठकों के लिए स्पष्ट। ‘धार्मिकता,’ ‘प्रभु’ और ‘ग्रहण करो’ जैसे परिचित धार्मिक पद रखे गए हैं। वाक्य-संरचना मूल के विरोधी खंडों को सुरक्षित रखती है और अनावश्यक व्याख्यात्मक कर्म नहीं जोड़ती।
