review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents στραφεὶς, ἄλλην διδαχήν, the purpose clauses, προσθεῖναι with its two direct objects, and the emphatic comparative force of ὡς Κύριον. However, “कि वह नष्ट कर दे” is syntactically incomplete and awkward in Hindi because “नष्ट कर देना” normally calls for a stated object. A non-object-bound purpose expression preserves the Greek’s unexpressed object more naturally.
  naturalness: The register is generally modern and suitably dignified. “उसकी न सुनो” is understandable but less idiomatic here than “उसकी बात न सुनो,” and “प्रभु के समान ग्रहण करो” is somewhat stiff. “प्रभु के समान स्वीकार करो” is more natural while retaining the comparison.
  terminology: “धार्मिकता,” “प्रभु का ज्ञान,” and “स्वीकार करो” are appropriate. “धार्मिकता और प्रभु के ज्ञान को बढ़ाने” correctly treats both Greek accusatives as objects of προσθεῖναι, rather than implying an unsupported ‘add to righteousness.’
  issues:
  - severity: medium
    issue: The phrase “कि वह नष्ट कर दे” leaves the Hindi verb with an unnatural unexpressed object.
    rationale: The Greek καταλῦσαι has no explicit object, which should not be supplied; nevertheless, Hindi “नष्ट कर देना” ordinarily requires one. “विनाश करने के लिए” keeps the object unspecified without producing a dangling transitive construction.
  - severity: low
    issue: “उसकी न सुनो” is less idiomatic than “उसकी बात न सुनो.”
    rationale: The revision retains the sense of μὴ αὐτοῦ ἀκούσητε while making the Hindi imperative more natural.
  - severity: low
    issue: “प्रभु के समान ग्रहण करो” is stiff in contemporary Hindi.
    rationale: “प्रभु के समान स्वीकार करो” preserves ὡς Κύριον as a comparison without asserting that the teacher is ontologically the Lord.
  revised_text: पर यदि वह शिक्षक स्वयं मुड़कर कोई दूसरी शिक्षा विनाश करने के लिए दे, तो उसकी बात न सुनो; लेकिन यदि वह धार्मिकता और प्रभु के ज्ञान को बढ़ाने के लिए हो, तो उसे प्रभु के समान स्वीकार करो।
