- from: पर यदि वह शिक्षक स्वयं मुड़कर कोई दूसरी शिक्षा इस उद्देश्य से दे कि वह नष्ट कर दे[a], तो उसकी न सुनो; लेकिन यदि उसका उद्देश्य धार्मिकता और प्रभु के ज्ञान को बढ़ाना हो, तो उसे प्रभु के समान ग्रहण करो।
  to: पर यदि वह शिक्षक स्वयं मुड़कर कोई दूसरी शिक्षा विनाश करने के लिए दे, तो उसकी बात न सुनो; लेकिन यदि वह धार्मिकता और प्रभु के ज्ञान को बढ़ाने के लिए हो, तो उसे प्रभु के समान स्वीकार करो।
