  yaml_path: translation/extra_canonical/didache/011/004.yaml
  text: Let every apostle who comes to you be received as the Lord.
translation:
  language: hi
  text: जो हर प्रेरित तुम्हारे पास आए, उसका स्वागत प्रभु के समान किया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ... ἀπόστολος
  choice: हर प्रेरित
  rationale: ‘Πᾶς’ प्रत्येक व्यक्ति को समाविष्ट करता है, और ‘प्रेरित’ आरम्भिक मसीही दूत/सेवक के पदनाम को संक्षेप में बनाए रखता है।
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: तुम्हारे पास आनेवाले
  rationale: वर्तमान कृदन्त और ‘πρὸς ὑμᾶς’ के आगमन-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δεχθήτω
  choice: ग्रहण किया जाए
  rationale: आज्ञार्थक तृतीय पुरुष निष्क्रिय रूप का औपचारिक किंतु सुबोध हिन्दी समतुल्य है; इसमें स्वागत और स्वीकार—दोनों का भाव संभव रहता है।
- source_word: ὡς Κύριος
  choice: प्रभु के समान
  rationale: ‘ὡς’ की तुलनात्मक भूमिका को सुरक्षित रखता है और प्रेरित को स्वयं प्रभु कहने के बजाय उसके स्वागत का मानक बताता है।
theological_decisions:
- issue: प्रेरित को ‘प्रभु के समान’ ग्रहण करने का अर्थ
  choice: तुलनात्मक वाक्यांश को बिना विस्तार के रखा गया
  alternative: ‘मानो वह प्रभु हो’ या ‘प्रभु के प्रतिनिधि के रूप में’
  rationale: यूनानी पाठ केवल ‘ὡς Κύριος’ कहता है। ‘प्रतिनिधि’ जोड़ना व्याख्यात्मक होगा, जबकि ‘मानो वह प्रभु हो’ अनावश्यक रूप से पहचान-संबंधी अर्थ जगा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामुदायिक-निर्देशात्मक रूप। ‘परन्तु’ यूनानी δὲ के हल्के संक्रमण/विरोध को दर्शाता है; ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है।
