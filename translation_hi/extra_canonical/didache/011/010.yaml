source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πᾶς δὲ προφήτης διδάσκων τὴν ἀλήθειαν, εἰ ἃ διδάσκει οὐ ποιεῖ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/010.yaml
  text: And every prophet teaching the truth, if he does not do what he teaches, is a false prophet.
translation:
  language: hi
  text: और हर भविष्यवक्ता जो सत्य की शिक्षा देता है, यदि वह वही नहीं करता जो वह सिखाता है, तो वह झूठा भविष्यवक्ता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς δὲ προφήτης
  choice: और हर वह भविष्यवक्ता
  rationale: πᾶς का व्यापक अर्थ ‘हर’ से और δὲ का प्रसंग-संयोजक भाव ‘और’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: διδάσκων τὴν ἀλήθειαν
  choice: जो सत्य की शिक्षा देता है
  rationale: वर्तमान कृदंत διδάσκων को संबंधवाचक उपवाक्य से व्यक्त किया गया है; τὴν ἀλήθειαν के निश्चित और नैतिक आशय को ‘सत्य’ बनाए रखता है।
- source_word: ἃ διδάσκει οὐ ποιεῖ
  choice: वह स्वयं उस पर नहीं चलता जिसकी वह शिक्षा देता है
  rationale: शाब्दिक ‘जिन बातों की शिक्षा देता है, उन्हें नहीं करता’ सम्भव है, पर हिन्दी में शिक्षा के अनुरूप जीवन न जीने का भाव ‘उस पर नहीं चलता’ अधिक स्वाभाविक और स्पष्ट है; ‘स्वयं’ कथन के विरोधाभास को उभारता है, कोई नया सिद्धान्त नहीं जोड़ता।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यवक्ता
  rationale: यह स्थापित और पारदर्शी हिन्दी समतुल्य है, जो ऐसे व्यक्ति को सूचित करता है जिसका भविष्यवक्ता होने का दावा उसके आचरण से असत्य सिद्ध होता है।
theological_decisions:
- issue: सत्य सिखाने वाले व्यक्ति को ‘झूठा भविष्यवक्ता’ कहना
  choice: 'मूल पाठ का तनाव यथावत रखा गया: शिक्षा सत्य हो सकती है, फिर भी उसे न करने वाला झूठा भविष्यवक्ता कहलाता है।'
  alternative: ‘कपटी भविष्यवक्ता’ या ‘अविश्वसनीय भविष्यवक्ता’
  rationale: ψευδοπροφήτης स्पष्ट रूप से ‘झूठा भविष्यवक्ता’ है। नरम विकल्प मूल के निर्णायक मूल्यांकन को घटा देते और सत्य शिक्षा तथा असंगत आचरण के तनाव को हल कर देते।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल। कोई पादटिप्पणी आवश्यक नहीं।
