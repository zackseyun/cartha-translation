  text: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/002.yaml
  text: 'Do not pray like the hypocrites[a], but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages.'
translation:
  language: hi
  text: 'कपटियों के समान प्रार्थना न करो, बल्कि जैसे प्रभु ने अपने सुसमाचार में आज्ञा दी, वैसे प्रार्थना करो:


    हे हमारे पिता, जो स्वर्ग में हैं,


    आपका नाम पवित्र माना जाए,


    आपका राज्य आए,


    आपकी इच्छा पूरी हो,


    जैसे स्वर्ग में, वैसे पृथ्वी पर भी।


    हमारी प्रतिदिन की रोटी आज हमें दीजिए[a],


    और हमारा ऋण क्षमा कीजिए,


    जैसे हम भी अपने ऋणियों को क्षमा करते हैं;


    और हमें परीक्षा में न लाइए[b],


    बल्कि उस दुष्ट से हमें बचाइए[c];


    क्योंकि सामर्थ्य और महिमा युगों-युगों तक आपकी ही हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रतिदिन की रोटी’ के लिए प्रयुक्त यूनानी शब्द दुर्लभ है; इसका अर्थ ‘आज के लिए आवश्यक रोटी’ या ‘आने वाले दिन की रोटी’ भी हो सकता है।
    reason: ἐπιούσιον की वास्तविक शाब्दिक और कालगत अस्पष्टता सुरक्षित रखने के लिए।
  - marker: b
    text: या ‘प्रलोभन में’।
    reason: πειρασμός परीक्षा/परख और प्रलोभन—दोनों अर्थों में प्रयुक्त हो सकता है।
  - marker: c
    text: या ‘बुराई से’।
    reason: τοῦ πονηροῦ का अर्थ ‘उस दुष्ट’ अथवा ‘बुराई’ हो सकता है।
lexical_decisions:
- source_word: ὑποκριταί
  choice: कपटी
  rationale: यह यूनानी शब्द धार्मिक दिखावे और दोहरे आचरण वाले लोगों को सूचित करता है; ‘कपटी’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
- source_word: ἐπιούσιον
  choice: प्रतिदिन की
  rationale: इस दुर्लभ शब्द का सटीक अर्थ विवादित है; ‘प्रतिदिन की’ प्रार्थना के प्रसंग में सुबोध है, जबकि पादटिप्पणी ‘आज के लिए आवश्यक’ और ‘आने वाले दिन की’ अर्थ-संभावनाएँ सुरक्षित रखती है।
- source_word: ὀφειλήν / ὀφειλέταις
  choice: ऋण / ऋणियों
  rationale: मूल पाठ की ऋण-संबंधी रूपक-भाषा को ‘पाप’ जैसे व्याख्यात्मक शब्द से बदलने के बजाय सीधे सुरक्षित रखा गया है।
- source_word: πειρασμόν
  choice: परीक्षा
  rationale: यह शब्द परीक्षा, परख या प्रलोभन की स्थिति बता सकता है; ‘परीक्षा’ व्यापक हिन्दी विकल्प है और अन्य संभावना पादटिप्पणी में दी गई है।
- source_word: τοῦ πονηροῦ
  choice: उस दुष्ट
  rationale: लेख सहित विशेषण का पुरुषवाचक अर्थ ‘उस दुष्ट’ सम्भव और प्रसंगानुकूल है; नपुंसक अर्थ ‘बुराई’ को पादटिप्पणी में रखा गया है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह यूनानी कालवाचक मुहावरे का स्वाभाविक, गरिमापूर्ण और परिचित हिन्दी रूप है।
theological_decisions:
- issue: ‘आपका नाम पवित्र माना जाए’ में निष्क्रिय क्रिया
  choice: पवित्र माना जाए
  alternative: पवित्र किया जाए
  rationale: यूनानी ἁγιασθήτω निष्क्रिय आज्ञार्थक है। चुना हुआ रूप नाम की पवित्रता की मान्यता और प्रतिष्ठा व्यक्त करता है, बिना यह संकेत दिए कि नाम पहले अपवित्र था।
- issue: ऋण की भाषा
  choice: मूल रूपक ‘ऋण’ बनाए रखा
  alternative: ‘अपराध’ या ‘पाप’
  rationale: पाठ स्वयं ὀφειλή और ὀφειλέταις कहता है। इसे धर्मशास्त्रीय व्याख्या से बदलने के बजाय मूल रूपक और क्षमा की पारस्परिक गंभीरता सुरक्षित रखी गई है।
- issue: πειρασμός का अर्थ
  choice: परीक्षा
  alternative: प्रलोभन
  rationale: यूनानी शब्द दोनों अर्थ-क्षेत्रों को छू सकता है। मुख्य पाठ में व्यापक विकल्प और पादटिप्पणी में वैकल्पिक अर्थ देकर तनाव को अनिर्णीत रखा गया है।
- issue: πονηροῦ का संदर्भ
  choice: उस दुष्ट
  alternative: बुराई
  rationale: यूनानी रूप व्याकरणतः किसी दुष्ट व्यक्ति, विशेषतः दुष्ट सत्ता, अथवा बुराई—दोनों की ओर संकेत कर सकता है। मुख्य पाठ ने व्यक्तिवाचक संभावना चुनी है, पर वैकल्पिक अर्थ स्पष्ट रूप से दिया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। प्रार्थना में सम्मानसूचक ‘आप’ का प्रयोग किया गया है। पंक्ति-विन्यास मूल प्रार्थना की लय और सामूहिक पाठ की सुविधा को बनाए रखता है।
