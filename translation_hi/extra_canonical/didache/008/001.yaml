source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: hi
  text: पर तुम्हारे उपवास कपटियों के साथ न हों, क्योंकि वे सप्ताह के दूसरे दिन और पाँचवें दिन उपवास रखते हैं; पर तुम चौथे दिन और तैयारी के दिन[a] उपवास रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तैयारी का दिन’ सब्त से पहले का दिन, अर्थात शुक्रवार, था। सप्ताह का चौथा दिन बुधवार था।
    reason: प्राचीन यहूदी दिन-गणना और παρασκευή का सांस्कृतिक अर्थ आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ὑποκριτῶν
  choice: कपटियों
  rationale: यह यूनानी शब्द ऐसे लोगों को सूचित करता है जिनका बाहरी धार्मिक आचरण उनके वास्तविक चरित्र से मेल नहीं खाता; ‘कपटी’ इसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: δευτέρα σαββάτων
  choice: सप्ताह के दूसरे दिन
  rationale: शाब्दिक यहूदी सप्ताह-गणना को बनाए रखता है; आधुनिक पाठक के लिए दिन का आशय सोमवार है, पर मूल पाठ दिन को संख्या से बताता है।
- source_word: πέμπτῃ
  choice: पाँचवें दिन
  rationale: पूर्ववर्ती सप्ताह-गणना के अनुरूप इसका अर्थ सप्ताह का पाँचवाँ दिन है; हिन्दी में संख्या-संरचना बनाए रखी गई है।
- source_word: τετράδα
  choice: चौथे दिन
  rationale: यह सप्ताह के चौथे दिन, अर्थात बुधवार, के लिए प्रयुक्त संज्ञात्मक रूप है; मूल की दिन-गणना सुरक्षित रखी गई है।
- source_word: παρασκευήν
  choice: तैयारी के दिन
  rationale: παρασκευή यहूदी प्रयोग में सब्त की तैयारी के दिन, अर्थात शुक्रवार, का नाम है। ‘तैयारी के दिन’ मूल पद की सांस्कृतिक छवि बनाए रखता है।
- source_word: νηστεύσατε
  choice: उपवास रखो
  rationale: आज्ञार्थक बहुवचन को सामान्य, आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘कपटियों’ की पहचान
  choice: पाठ में समूह की कोई अतिरिक्त पहचान नहीं जोड़ी गई
  alternative: इसे किसी विशिष्ट यहूदी दल या समस्त यहूदी समुदाय के रूप में स्पष्ट करना
  rationale: मूल केवल ‘कपटियों’ कहता है। किसी ऐतिहासिक या सांप्रदायिक पहचान को जोड़ना स्रोत से आगे जाना और अनावश्यक रूप से दोषारोपण करना होगा।
- issue: निर्दिष्ट उपवास-दिनों की बाध्यता
  choice: मूल के प्रत्यक्ष आज्ञार्थक स्वर को बनाए रखा गया
  alternative: इसे केवल ऐतिहासिक प्रथा या वैकल्पिक सलाह के रूप में ढीला करना
  rationale: νηστεύσατε स्पष्ट आज्ञार्थक रूप है; अनुवाद को इसकी शक्ति घटानी नहीं चाहिए, न ही बाद की कलीसियाई व्यवस्था आयात करनी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ‘उपवास रखना’ सामान्य हिन्दी मुहावरा है। मूल की सप्ताह-दिनों वाली संख्या-पद्धति को पाठ में सुरक्षित रखा गया है और आवश्यक आधुनिक समतुल्य फुटनोट में दिए गए हैं।
