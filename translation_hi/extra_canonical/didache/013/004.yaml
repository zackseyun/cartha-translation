  text: But if you do not have a prophet, give to the poor.
translation:
  language: hi
  text: पर यदि तुम्हारे पास कोई भविष्यद्वक्ता न हो, तो गरीबों को दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ μὴ ἔχητε
  choice: पर यदि तुम्हारे बीच ... न हो
  rationale: शर्त और विरोधसूचक संबंध को स्वाभाविक हिन्दी में रखा गया है। यूनानी में शाब्दिक अर्थ ‘यदि तुम न रखते हो’ है; यहाँ व्यक्ति की उपलब्धता के भाव को ‘तुम्हारे बीच ... न हो’ स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: προφήτην
  choice: भविष्यद्वक्ता
  rationale: आरंभिक मसीही समुदाय में इस सेवकाई के प्रचलित और धर्मशास्त्रीय रूप से तटस्थ हिन्दी पद को रखा गया है।
- source_word: δότε
  choice: दो
  rationale: यूनानी आदेशवाचक बहुवचन का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: τοῖς πτωχοῖς
  choice: गरीबों को
  rationale: बहुवचन विशेषण के संज्ञात्मक प्रयोग का सरल आधुनिक हिन्दी अनुवाद। यूनानी पाठ किसी विशेष वस्तु को प्रत्यक्ष कर्म के रूप में नहीं बताता।
theological_decisions:
- issue: दान की वस्तु का अनुल्लेख
  choice: ‘दो’ के साथ किसी वस्तु को नहीं जोड़ा गया
  alternative: ‘वह गरीबों को दे दो’
  rationale: यूनानी में δότε का प्रत्यक्ष कर्म इस पद में व्यक्त नहीं है। पूर्ववर्ती संदर्भ से वस्तु समझी जा सकती है, पर उसे यहाँ जोड़ने से मूल की अंतर्निहित संदर्भ-निर्भरता समाप्त हो जाती।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। ‘तुम्हारे बीच’ व्यक्ति की सामुदायिक उपलब्धता का स्वाभाविक संकेत देता है; ‘गरीब’ सामान्य पाठक के लिए सहज है।
