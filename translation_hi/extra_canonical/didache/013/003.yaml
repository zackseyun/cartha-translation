source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/003.yaml
  text: Therefore, taking every firstfruit of the produce of the winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests.
translation:
  language: hi
  text: इसलिए दाखरस के कोल्हू और खलिहान की उपज, तथा गोवंश और भेड़ों में से हर प्रथम अंश लेकर नबियों को देना, क्योंकि वे तुम्हारे महायाजक हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴν
  choice: पहला अंश
  rationale: यह शब्द उपज या पशुधन में से आरम्भिक भाग को धार्मिक भेंट के रूप में देने का भाव रखता है। ‘पहली उपज’ केवल कृषि-उपज पर स्वाभाविक लगता, इसलिए पशुओं को भी समेटने हेतु ‘पहला अंश’ चुना गया।
- source_word: γεννημάτων
  choice: उपज
  rationale: यहाँ लता और खलिहान से प्राप्त पैदावार के लिए सहज और व्यापक हिन्दी शब्द है।
- source_word: ληνοῦ
  choice: दाखरस का कोल्हू
  rationale: स्रोत में अंगूर दबाने के स्थान/यंत्र का संकेत है; ‘दाखरस का कोल्हू’ आधुनिक पाठक के लिए अर्थ स्पष्ट रखता है।
- source_word: ἅλωνος
  choice: खलिहान
  rationale: अनाज की मड़ाई के स्थान के लिए प्रचलित और सटीक हिन्दी शब्द।
- source_word: βοῶν τε καὶ προβάτων
  choice: गाय-बैलों तथा भेड़-बकरियों
  rationale: βοῦς गोवंश और πρόβατον छोटे पालतू पशु, विशेषतः भेड़, को सूचित करते हैं। हिन्दी में स्वाभाविक सामूहिक अभिव्यक्ति द्वारा दोनों श्रेणियाँ स्पष्ट की गई हैं।
- source_word: προφήταις
  choice: नबियों
  rationale: धार्मिक हिन्दी में प्रचलित, साधारण पाठकों के लिए स्पष्ट समतुल्य।
- source_word: ἀρχιερεῖς
  choice: महायाजक
  rationale: ग्रीक बहुवचन की संख्या और धार्मिक पदवी दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: नबियों को ‘महायाजक’ कहना
  choice: वे तुम्हारे महायाजक हैं
  alternative: वे तुम्हारे प्रधान याजकों के समान हैं
  rationale: स्रोत में प्रत्यक्ष पहचानसूचक कथन है, उपमा नहीं। अनुवाद ने इस तनावपूर्ण धार्मिक भाषा को बिना नरम किए सुरक्षित रखा है।
- issue: पशुओं के संदर्भ में प्रथम अंश
  choice: पशु-श्रेणियों के साथ ‘पहला अंश’ को दोहराकर स्पष्ट किया
  alternative: केवल आरम्भ में ‘हर पहली उपज’ कहना
  rationale: स्रोत का ἀπαρχή कृषि-उपज और पशुधन दोनों पर लागू है। हिन्दी में पुनरुक्ति अर्थ को स्वाभाविक और स्पष्ट बनाती है, बिना यह तय किए कि आशय पहला जन्मा पशु है या पशुधन का कोई आरम्भिक भाग।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली। आदेश के लिए ‘देना’ का प्रयोग पूर्ववर्ती निर्देशों की सामान्य उपदेशात्मक शैली के अनुरूप है। स्रोत की सूचीबद्ध संरचना और कारणसूचक ‘क्योंकि’ सुरक्षित रखे गए हैं।
