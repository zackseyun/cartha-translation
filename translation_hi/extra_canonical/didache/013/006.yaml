translation:
  language: hi
  text: इसी प्रकार, जब तुम दाखरस या तेल का घड़ा खोलो, तो उसमें से पहला भाग लेकर भविष्यवक्ताओं को दे दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: इसी प्रकार
  rationale: पूर्ववर्ती निर्देश से स्पष्ट संबंध रखते हुए यूनानी क्रियाविशेषण का स्वाभाविक हिन्दी रूप।
- source_word: κεράμιον
  choice: घड़ा
  rationale: मदिरा या तेल रखने के मिट्टी के पात्र के लिए सामान्य और संदर्भानुकूल शब्द।
- source_word: οἴνου
  choice: दाखमधु
  rationale: अंगूर से बनी मदिरा को स्पष्ट करता है और धार्मिक साहित्य के गरिमापूर्ण आधुनिक हिन्दी रजिस्टर में सुबोध है।
- source_word: ἀπαρχὴν
  choice: पहला अंश
  rationale: फसल की भेंट तक सीमित किए बिना किसी पात्र की सामग्री में से आरम्भिक समर्पित भाग का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: προφήταις
  choice: भविष्यवक्ताओं
  rationale: प्रारम्भिक मसीही समुदाय के संदर्भ में προφήτης का स्थापित और अर्थ-संगत हिन्दी रूप।
theological_decisions:
- issue: ἀπαρχή का भेंट-संबंधी आशय
  choice: पहला अंश
  alternative: पहली उपज / प्रथम फल
  rationale: यहाँ दाखमधु या तेल का पात्र खोला जा रहा है, इसलिए शाब्दिक कृषि-उपज की अपेक्षा उसमें से अलग किया गया पहला भाग अभिप्रेत है; यह रूप समर्पण के भाव को बनाए रखता है, पर मात्रा निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन τὴν ἀπαρχὴν को हिन्दी में ‘पहला अंश’ कहा गया है और δὸς के प्राप्तकर्ताओं को बहुवचन ‘भविष्यवक्ताओं’ के रूप में यथावत रखा गया है।
