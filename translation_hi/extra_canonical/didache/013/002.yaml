source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως διδάσκαλος ἀληθινός ἐστιν ἄξιος καὶ αὐτός, ὥσπερ ὁ ἐργάτης, τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/002.yaml
  text: Likewise a true teacher is also himself worthy, like the worker, of his food.
translation:
  language: hi
  text: इसी प्रकार सच्चा शिक्षक भी, मज़दूर के समान, अपने भोजन का अधिकारी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: इसी प्रकार
  rationale: यह पिछले निर्देश से समानता और निरंतरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διδάσκαλος ἀληθινός
  choice: सच्चा शिक्षक
  rationale: ἀληθινός यहाँ ऐसे शिक्षक को दर्शाता है जो वास्तविक या प्रामाणिक है; ‘सच्चा शिक्षक’ अर्थ को संक्षिप्त और सहज रूप में रखता है।
- source_word: ἄξιος
  choice: अधिकारी
  rationale: ‘अधिकारी है’ किसी वस्तु को पाने की योग्यता अथवा उचित हक दोनों को व्यक्त करता है और भोजन के संबंध में हिन्दी में स्वाभाविक है।
- source_word: ὁ ἐργάτης
  choice: मज़दूर
  rationale: ἐργάτης का मूल अर्थ काम करने वाला या श्रमिक है; ‘मज़दूर’ तुलना को स्पष्ट और सामान्य पाठक के लिए सहज रखता है।
- source_word: τῆς τροφῆς αὐτοῦ
  choice: अपने भोजन का
  rationale: τροφή का सीधा अर्थ भोजन या पोषण है; αὐτοῦ को आत्मवाचक संदर्भ के अनुसार ‘अपने’ से व्यक्त किया गया है।
theological_decisions:
- issue: शिक्षक के भोजन पर ἄξιος का आशय
  choice: अपने भोजन का अधिकारी है
  alternative: अपने भोजन के योग्य है
  rationale: ग्रीक ἄξιος योग्यता और उचित प्राप्ति—दोनों का भाव रख सकता है। संदर्भ में सेवक के भरण-पोषण का व्यावहारिक अधिकार प्रमुख है, फिर भी ‘अधिकारी’ इसे किसी विशिष्ट संस्थागत या संप्रदायगत व्यवस्था में नहीं बदलता।
- issue: καὶ αὐτός में बल
  choice: सच्चा शिक्षक भी
  alternative: सच्चा शिक्षक स्वयं भी
  rationale: καὶ αὐτός शिक्षक को पहले उल्लिखित व्यक्ति की तरह उसी प्रावधान में शामिल करने पर बल देता है। हिन्दी में ‘भी’ यह अर्थ स्वाभाविक रूप से देता है; ‘स्वयं भी’ अनावश्यक रूप से व्यक्ति-विरोधी बल पैदा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। वाक्य-संरचना को हिन्दी के स्वाभाविक क्रम में रखा गया है, जबकि शिक्षक, मज़दूर और भोजन के बीच मूल तुलना सुरक्षित है।
