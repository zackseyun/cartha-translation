source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/001.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food.
translation:
  language: hi
  text: पर हर सच्चा भविष्यद्वक्ता, जो तुम्हारे बीच बसना चाहता है, अपने भोजन का अधिकारी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ προφήτης ἀληθινός
  choice: पर हर सच्चा भविष्यद्वक्ता
  rationale: ‘δὲ’ के हल्के विरोध/संक्रमण को ‘पर’ से, ‘Πᾶς’ को ‘हर’ से और ‘ἀληθινός’ को स्वाभाविक आधुनिक हिन्दी ‘सच्चा’ से व्यक्त किया गया है।
- source_word: θέλων καθῆσαι πρὸς ὑμᾶς
  choice: जो तुम्हारे बीच बसना चाहता है
  rationale: यहाँ καθῆσαι का आशय केवल बैठना नहीं, समुदाय के पास ठहरकर निवास करना है; इसलिए ‘बसना’ प्रसंगानुकूल है। πρὸς ὑμᾶς को स्वाभाविक हिन्दी में ‘तुम्हारे बीच’ कहा गया है।
- source_word: ἄξιός ἐστι τῆς τροφῆς αὐτοῦ
  choice: अपने भोजन का अधिकारी है
  rationale: ἄξιος का अर्थ किसी वस्तु को पाने योग्य या उसका हकदार होना है; ‘अधिकारी’ गरिमापूर्ण और सहज है। τροφή को सामान्य अर्थ में ‘भोजन’ रखा गया है और αὐτοῦ के संबंध को ‘अपने’ से सुरक्षित किया गया है।
theological_decisions:
- issue: भविष्यद्वक्ता के भोजन पर अधिकार
  choice: अपने भोजन का अधिकारी है
  alternative: भरण-पोषण पाने का अधिकारी है
  rationale: मूल पाठ स्पष्ट रूप से τροφή (‘भोजन/आहार’) कहता है। व्यापक आर्थिक सहायता का अर्थ इसमें निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट करके मूल से अधिक कहना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामुदायिक संबोधन वाला अनुवाद। ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है; कोई पादटिप्पणी आवश्यक नहीं।
