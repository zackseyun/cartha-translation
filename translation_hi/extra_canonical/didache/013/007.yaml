source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἀργυρίου δὲ καὶ ἱματισμοῦ καὶ παντὸς κτήματος λαβὼν τὴν ἀπαρχὴν ὡς ἂν σοὶ δοξῇ, δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/007.yaml
  text: And of money and clothing and every possession[a], having taken the firstfruit, as it seems good to you, give according to the commandment.
translation:
  language: hi
  text: और पैसा[a], वस्त्र और हर प्रकार की संपत्ति में से पहला अंश निकालकर, जैसा तुम्हें उचित लगे, आज्ञा के अनुसार दे दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘चाँदी’ भी हो सकता है।
    reason: ἀργύριον के शाब्दिक ‘चाँदी’ अर्थ की संभावना सुरक्षित रखता है, जबकि मुख्य पाठ में प्रसंगानुकूल ‘पैसा’ रखा गया है।
lexical_decisions:
- source_word: ἀργυρίου
  choice: धन
  rationale: यह शब्द मूलतः ‘चाँदी’ कह सकता है, पर कोइने यूनानी में लेन-देन के साधन के अर्थ में ‘धन/पैसा’ भी सामान्य है; यहाँ वस्त्र और अन्य संपत्ति के साथ दान की चर्चा में ‘धन’ स्वाभाविक है।
- source_word: παντὸς κτήματος
  choice: हर प्रकार की संपत्ति
  rationale: κτῆμα अर्जित या स्वामित्व में रखी वस्तु/संपत्ति को दर्शाता है; παντός के साथ यह समस्त प्रकार की संपत्ति का व्यापक बोध देता है।
- source_word: τὴν ἀπαρχὴν
  choice: पहला अंश
  rationale: ἀπαρχή का शाब्दिक भाव ‘पहली उपज/पहला फल’ है, किंतु धन, वस्त्र और हर संपत्ति के संदर्भ में ‘पहला अंश’ अधिक स्वाभाविक और व्यापक है।
- source_word: ὡς ἂν σοὶ δοξῇ
  choice: जैसा तुम्हें उचित लगे
  rationale: यह वाक्यांश देने वाले के विवेक से निश्चित किए जाने वाले अंश को व्यक्त करता है, बिना मात्रा निर्धारित किए।
- source_word: δὸς κατὰ τὴν ἐντολήν
  choice: आज्ञा के अनुसार दे दो
  rationale: आदेशात्मक बल और किसी परिचित आज्ञा के अनुरूप देने—दोनों को सीधे बनाए रखता है।
theological_decisions:
- issue: ‘पहले अंश’ की मात्रा
  choice: 'मात्रा को अनिर्धारित रखा गया: ‘जैसा तुम्हें उचित लगे’'
  alternative: इसे दशमांश या किसी निश्चित प्रतिशत के रूप में प्रस्तुत करना
  rationale: यूनानी पाठ कोई निश्चित अनुपात नहीं बताता और स्पष्टतः देने वाले के विवेक की भाषा रखता है।
- issue: ‘आज्ञा’ का संदर्भ
  choice: केवल ‘आज्ञा’ रखा गया
  alternative: किसी विशिष्ट बाइबिलीय नियम या कलीसियाई आदेश की पहचान जोड़ना
  rationale: पाठ आज्ञा को निश्चित लेख के साथ कहता है, पर इस पद में उसकी स्पष्ट पहचान नहीं करता; अतः व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। ‘पहला अंश निकालकर’ धन, वस्त्र और संपत्ति—तीनों के साथ सहज बैठता है तथा यूनानी कृदंत की पूर्वकालिकता को भी व्यक्त करता है।
