  text: If you prepare food[a], take the firstfruits and give according to the commandment.
translation:
  language: hi
  text: यदि तुम भोजन तैयार करो[a], तो उसका पहला अंश लेकर आज्ञा के अनुसार दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम रोटी बनाओ, तो उसका पहला अंश लेकर…”
    reason: प्रदत्त स्रोत-पाठ का रूप संदिग्ध है; पाठ-परंपरा में ‘रोटी बनाना’ वाला अधिक संकीर्ण पाठ/अर्थ भी मिलता है।
lexical_decisions:
- source_word: σιτιαυτοῖς
  choice: भोजन तैयार करो
  rationale: प्रदत्त पाठ में यह रूप संभवतः पाठ-संयोजन या OCR की समस्या से ग्रस्त है। प्रसंग और उपलब्ध स्रोत-साक्ष्य के आधार पर इसका आशय भोजन तैयार करने से है; इसे केवल ‘रोटी बनाना’ कहना अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- source_word: ἀπαρχήν
  choice: पहला अंश
  rationale: यह शब्द आरंभिक उपज या तैयार वस्तु में से परमेश्वर के लिए अलग किए गए पहले भाग को दर्शाता है। यहाँ ‘पहला अंश’ भोजन के व्यापक संदर्भ में स्वाभाविक है और अर्पण का भाव बनाए रखता है।
- source_word: ἐντολήν
  choice: आज्ञा
  rationale: यूनानी शब्द का सीधा और प्रसंगानुकूल अर्थ ‘आज्ञा’ है; निश्चित उपपद के कारण ‘आज्ञा के अनुसार’ रखा गया है।
theological_decisions:
- issue: पहले अंश को देने की धार्मिक प्रकृति
  choice: पहला अंश लेकर ... दे दो
  alternative: पहली उपज अर्पित करो
  rationale: मूल क्रिया केवल ‘देना’ कहती है और पाने वाले का उल्लेख इस पद में नहीं करती। इसलिए ‘अर्पित करो’ या कोई प्राप्तकर्ता जोड़कर अस्पष्टता को नहीं सुलझाया गया।
- issue: भोजन या रोटी का अर्थ
  choice: मुख्य पाठ में ‘भोजन तैयार करो’
  alternative: ‘रोटी बनाओ’
  rationale: स्रोत-पाठ का रूप संदिग्ध है और परंपरागत पाठ/अनुवाद में अधिक संकीर्ण अर्थ संभव है। व्यापक अर्थ मुख्य पाठ में और संकीर्ण विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक शैली अपनाई गई है। ‘उसका’ से पहले अंश का संबंध तैयार किए गए भोजन से स्पष्ट होता है, जबकि पद में न बताए गए प्राप्तकर्ता को नहीं जोड़ा गया।
