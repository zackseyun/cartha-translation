source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Κατὰ κυριακὴν δὲ Κυρίου συναχθέντες κλάσατε ἄρτον καὶ εὐχαριστήσατε προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν, ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/001.yaml
  text: But on the Lord’s own day, when you have gathered together, break bread and give thanks, having first confessed your transgressions, so that your sacrifice may be pure.
translation:
  language: hi
  text: परन्तु प्रभु के दिन, इकट्ठे होने पर, पहले अपने अपराध स्वीकार करके रोटी तोड़ो और धन्यवाद दो, ताकि तुम्हारा बलिदान शुद्ध हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ κυριακὴν δὲ Κυρίου
  choice: परन्तु प्रभु के अपने दिन
  rationale: κυριακή और Κυρίου की असामान्य संयुक्त अभिव्यक्ति में प्रभु से विशेष संबंध और बल बना रहता है; ‘अपने’ इसी जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κλάσατε ἄρτον
  choice: रोटी तोड़ो
  rationale: आरम्भिक मसीही सामुदायिक भोजन की स्थापित अभिव्यक्ति को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: εὐχαριστήσατε
  choice: धन्यवाद दो
  rationale: क्रिया का मूल अर्थ धन्यवाद देना है; यहाँ इसे केवल बाद में विकसित पारिभाषिक अर्थ तक सीमित नहीं किया गया।
- source_word: παραπτώματα
  choice: अपराधों
  rationale: यह नैतिक चूकों या उल्लंघनों को दर्शाता है; ‘अपराध’ आधुनिक हिन्दी में गंभीरता बनाए रखता है।
- source_word: θυσία
  choice: बलिदान
  rationale: यूनानी शब्द का यज्ञ/अर्पण-संबंधी धार्मिक अर्थ सुरक्षित रखा गया है, बिना यह निर्धारित किए कि इसका ठीक संदर्भ रोटी, धन्यवाद या पूरी आराधना में से क्या है।
theological_decisions:
- issue: ‘तुम्हारा बलिदान’ का संदर्भ
  choice: तुम्हारा बलिदान
  alternative: तुम्हारी भेंट
  rationale: मूल पाठ की बलिदानी भाषा और यह अस्पष्टता सुरक्षित रखी गई है कि ‘बलिदान’ विशेषतः किस सामुदायिक कार्य को कहता है।
- issue: अपराध-स्वीकार और रोटी तोड़ने का क्रम
  choice: पहले अपने अपराधों को मान लो
  alternative: अपने अपराध मान लेने के बाद
  rationale: προ- क्रियाओं का क्रम स्पष्ट करता है, जबकि स्वीकारोक्ति की विधि या पात्र के बारे में पाठ से अधिक कुछ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक बहुवचन संबोधन वाली है। दो वाक्यों में विभाजन हिन्दी में क्रम को स्पष्ट और पठनीय बनाता है, पर मूल विचार-संबंध बना रहता है।
