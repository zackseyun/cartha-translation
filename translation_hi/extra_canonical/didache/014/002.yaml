id: DID.14.2
reference: Didache 14:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ μὴ συνελθέτω ὑμῖν, ἕως οὗ διαλλαγῶσιν, ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/002.yaml
  text: But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled.
translation:
  language: hi
  text: पर जिस किसी का अपने साथी के साथ कोई विवाद हो, वह तब तक तुम्हारे साथ इकट्ठा न हो, जब तक उनका मेल-मिलाप न हो जाए, ताकि तुम्हारा बलिदान अपवित्र न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφιβολίαν
  choice: विवाद
  rationale: यहाँ शब्द साथियों के बीच मतभेद या झगड़े को दर्शाता है; आधुनिक हिन्दी में ‘विवाद’ स्वाभाविक है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἑταίρου
  choice: साथी
  rationale: ‘साथी’ निकट सहयोगी या समुदाय के सह-सदस्य का व्यापक अर्थ बनाए रखता है।
- source_word: συνελθέτω ὑμῖν
  choice: तुम्हारे साथ इकट्ठा न हो
  rationale: यह सामुदायिक सभा में सम्मिलित होने के ठोस अर्थ को सुरक्षित रखता है।
- source_word: διαλλαγῶσιν
  choice: वे आपस में मेल न कर लें
  rationale: क्रिया पारस्परिक मेल-मिलाप का संकेत देती है; बहुवचन रूप दोनों विवादरत पक्षों को सम्मिलित करता है।
- source_word: κοινωθῇ
  choice: अशुद्ध न हो
  rationale: संदर्भ में इसका अर्थ पवित्र बलिदान का अपवित्र या दूषित हो जाना है; ‘अशुद्ध’ स्पष्ट और धार्मिक संदर्भ के अनुकूल है।
- source_word: θυσία
  choice: बलिदान
  rationale: यूनानी शब्द का सीधा धार्मिक अर्थ ‘बलिदान’ है; पाठ इसे रूपक या किसी विशिष्ट अनुष्ठान तक स्पष्टतः सीमित नहीं करता।
theological_decisions:
- issue: ‘बलिदान’ का विशिष्ट आशय
  choice: बलिदान
  alternative: भेंट / प्रभु-भोज
  rationale: मूल θυσία को उसके सामान्य धार्मिक अर्थ में रखा गया है। पाठ की सीमा में इसे केवल प्रभु-भोज या किसी अन्य विशिष्ट अनुष्ठान के रूप में व्याख्यायित करना उचित नहीं होगा।
- issue: मेल-मिलाप की पारस्परिकता
  choice: वे आपस में मेल न कर लें
  alternative: वह मेल न कर ले
  rationale: διαλλαγῶσιν बहुवचन है और विवाद के दोनों पक्षों के बीच मेल होने का संकेत देता है; हिन्दी में बहुवचन रखकर यह तनाव सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पर’ δέ के विरोधात्मक संक्रमण को सहज हिन्दी में व्यक्त करता है। वाक्य का निषेधात्मक आदेश और उद्देश्यवाचक उपवाक्य मूल संरचना के निकट रखे गए हैं।
