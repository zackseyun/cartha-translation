id: DID.14.3
reference: Didache 14:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὕτη γάρ ἐστιν ἡ ῥηθεῖσα ὑπὸ Κυρίου· Ἐν παντὶ τόπῳ καὶ χρόνῳ προσφέρειν μοι θυσίαν καθαράν· ὅτι βασιλεὺς μέγας εἰμί, λέγει Κύριος, καὶ τὸ ὄνομά μου θαυμαστὸν ἐν τοῖς ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/003.yaml
  text: 'For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice[a], because I am a great King,” says the Lord, “and my name is marvelous among the nations.”'
translation:
  language: hi
  text: क्योंकि यह वही बलि है जिसके विषय में प्रभु ने कहा था:[a] “हर स्थान और हर समय मेरे लिए शुद्ध बलि चढ़ाओ; क्योंकि मैं महान राजा हूँ,” प्रभु कहते हैं, “और राष्ट्रों के बीच मेरा नाम अद्भुत है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यही वह बात है जो प्रभु ने कही थी।”
    reason: यूनानी स्त्रीलिंग रूपों का निकटतम पूर्वपद ‘बलि’ है; फिर भी हिन्दी में वाक्य को प्रभु के कहे हुए कथन के सामान्य संदर्भ के रूप में भी अनुवादित किया जा सकता है।
lexical_decisions:
- source_word: αὕτη ... ἡ ῥηθεῖσα
  choice: यह वही बलि है जिसके विषय में ... कहा था
  rationale: दोनों रूप स्त्रीलिंग हैं और पिछले संदर्भ की स्त्रीलिंग संज्ञा θυσία (‘बलि’) की ओर संकेत करते हैं; हिन्दी में निहित संज्ञा को स्पष्ट करना स्वाभाविक है। फिर भी वैकल्पिक वाक्यगत समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: προσφέρειν
  choice: चढ़ाओ
  rationale: बलि अर्पित करने के संदर्भ में यह सहज और अर्थ-सटीक हिन्दी क्रिया है।
- source_word: θυσίαν καθαράν
  choice: शुद्ध बलि
  rationale: यह θυσία और καθαράν का सीधा, धार्मिक संदर्भ के अनुकूल अनुवाद है।
- source_word: θαυμαστόν
  choice: विस्मयकारी
  rationale: यह शब्द नाम की अद्भुत और विस्मय उत्पन्न करने वाली प्रकृति व्यक्त करता है; केवल ‘महान’ कहने की अपेक्षा यूनानी अर्थ को अधिक निकटता से रखता है।
- source_word: ἐν τοῖς ἔθνεσι
  choice: राष्ट्रों के बीच
  rationale: ἔθνη का व्यापक सामूहिक अर्थ सुरक्षित रहता है और किसी विशेष धार्मिक अर्थ को अनावश्यक रूप से नहीं जोड़ा जाता।
theological_decisions:
- issue: αὕτη ἡ ῥηθεῖσα का पूर्वपद
  choice: इसे पिछले संदर्भ की ‘बलि’ से संबद्ध किया गया है।
  alternative: “क्योंकि यही वह बात है जो प्रभु ने कही थी।”
  rationale: यूनानी में संकेतवाचक सर्वनाम और कृदंत दोनों स्त्रीलिंग हैं, जो निकटवर्ती θυσία (‘बलि’) के साथ व्याकरणिक मेल रखते हैं। तथापि संज्ञा प्रत्यक्ष रूप से दोहराई नहीं गई है, इसलिए अधिक सामान्य वाक्यगत अर्थ पादटिप्पणी में दिया गया है।
- issue: मलाकी-सदृश उद्धरण का रूप
  choice: प्राप्त दीदाखे यूनानी पाठ के शब्दक्रम और आशय का अनुवाद किया गया है।
  alternative: पुराने नियम के किसी प्रचलित हिन्दी अनुवाद से उद्धरण को ज्यों का त्यों लेना।
  rationale: यहाँ दीदाखे का पाठ मानक स्रोत है और उसका रूप मलाकी के उपलब्ध पाठ-रूपों से कुछ भिन्न है; उसे किसी अन्य पाठ के अनुरूप चुपचाप बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘बलि चढ़ाओ’, ‘महान राजा’ और ‘राष्ट्रों के बीच’ सामान्य पाठक के लिए स्पष्ट हैं; उद्धरण की भविष्यवाणी-सदृश गंभीरता भी सुरक्षित है।
