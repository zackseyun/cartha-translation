source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Σὺ, δέσποτα παντοκράτορ, ἔκτισας τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου, τροφήν τε καὶ ποτὸν ἔδωκας τοῖς ἀνθρώποις εἰς ἀπόλαυσιν ἵνα σοι εὐχαριστήσωσιν, ἡμῖν δὲ ἐχαρίσω πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον διὰ τοῦ παιδός σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/003.yaml
  text: 'You, almighty Master,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.'
translation:
  language: hi
  text: 'हे सर्वशक्तिमान स्वामी,

    आपने अपने नाम के निमित्त सब कुछ रचा,

    और मनुष्यों को आनन्द लेने के लिए भोजन और पेय दिया,

    ताकि वे आपका धन्यवाद करें;

    पर हमें आपने अपने सेवक[क] के द्वारा आत्मिक भोजन और पेय तथा अनन्त जीवन अनुग्रहपूर्वक दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: यूनानी शब्द παῖς का अर्थ ‘सेवक’ है; संदर्भ के अनुसार ‘बालक’ या ‘पुत्र’ भी संभव है।
    reason: παῖς की स्रोत-भाषाई अर्थगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  choice: हे सर्वशक्तिमान स्वामी
  rationale: संबोधन और दोनों उपाधियों को स्वाभाविक, गरिमापूर्ण हिन्दी में सुरक्षित रखा गया है।
- source_word: ἕνεκεν τοῦ ὀνόματός σου
  choice: अपने नाम के निमित्त
  rationale: उद्देश्य/कारण की मूल अभिव्यक्ति को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: τοῖς ἀνθρώποις
  choice: मनुष्यों को
  rationale: यहाँ बहुवचन सभी मानवों के लिए सामान्य अर्थ में है; ‘मनुष्यों’ सटीक और समावेशी है।
- source_word: εἰς ἀπόλαυσιν
  choice: आनन्द लेने के लिए
  rationale: ἀπόλαυσις के उपभोग और आनन्द, दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐχαρίσω
  choice: अनुग्रह करके ... दिया
  rationale: क्रिया में निहित कृपापूर्वक प्रदान करने का भाव सुरक्षित रखा गया है।
- source_word: πνευματικὴν τροφὴν καὶ ποτὸν
  choice: आत्मिक भोजन और पेय
  rationale: πνευματικός का धार्मिक-साहित्यिक, किंतु सामान्यतः बोधगम्य हिन्दी समतुल्य ‘आत्मिक’ है।
- source_word: διὰ τοῦ παιδός σου
  choice: अपने सेवक के द्वारा
  rationale: παῖς यहाँ ‘सेवक’ अथवा ‘बालक/पुत्र’ हो सकता है; इस प्रार्थनात्मक संदर्भ और दिदाखे के निकट प्रयोग में ‘सेवक’ उपयुक्त है, जबकि अस्पष्टता को निर्णय-सूची में दर्ज किया गया है।
theological_decisions:
- issue: παῖς का अर्थ
  choice: सेवक
  alternative: पुत्र / बालक
  rationale: यूनानी παῖς में ‘बालक/पुत्र’ और ‘सेवक’ दोनों अर्थ संभव हैं। दिदाखे की धन्यवाद-प्रार्थनाओं और बाइबिलीय ‘परमेश्वर के सेवक’ की पृष्ठभूमि में ‘सेवक’ अधिक संभाव्य है; ‘पुत्र’ चुनने से मूल की शब्दार्थगत अस्पष्टता एक विशिष्ट मसीही उपाधि में सीमित हो सकती थी।
- issue: भौतिक भोजन-पेय और आत्मिक वरदान के बीच δέ का विरोध
  choice: ‘पर’ द्वारा स्पष्ट विरोध बनाए रखा
  alternative: ‘और’ अथवा बिना संयोजक के
  rationale: δέ यहाँ सामान्य मानवता को दिए भौतिक उपहारों और ‘हमें’ दिए आत्मिक उपहारों के बीच तुलना/विरोध स्थापित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। आदरसूचक ‘आप’ का प्रयोग किया गया है। पंक्ति-विन्यास मूल वाक्य की समानांतर संरचना और धन्यवाद-प्रार्थना की लय को उभारता है।
