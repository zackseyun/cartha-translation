id: DID.10.6
reference: Didache 10:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλθέτω χάρις καὶ παρελθέτω ὁ κόσμος οὗτος. Ὡσαννὰ τῷ υἱῷ Δαβίδ. Εἴ τις ἅγιός ἐστιν, ἐρχέσθω· εἴ τις οὐκ ἔστι, μετανοείτω· μαρανᾰθά. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/006.yaml
  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
translation:
  language: hi
  text: 'अनुग्रह आए,


    और यह संसार बीत जाए।


    दाऊद के पुत्र को होशाना!


    यदि कोई पवित्र है, तो वह आए;


    यदि कोई पवित्र नहीं है, तो वह मन फिराए।


    मारानाथा। आमीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह यूनानी शब्द कृपा या अनुग्रह को दर्शाता है; प्रार्थनात्मक और आराधनात्मक संदर्भ में ‘अनुग्रह’ स्वाभाविक तथा अर्थ-सटीक है।
- source_word: παρελθέτω
  choice: बीत जाए
  rationale: संसार के वर्तमान रूप के समाप्त हो जाने या चले जाने का भाव रखता है; ‘बीत जाए’ सरल और गरिमापूर्ण है।
- source_word: Ὡσαννά
  choice: होशाना
  rationale: मूल आराधनात्मक उद्गार को लिप्यंतरित रखा गया है, क्योंकि यह स्तुति और उद्धार की पुकार—दोनों की पृष्ठभूमि सँजोता है।
- source_word: ἅγιος
  choice: पवित्र
  rationale: व्यक्ति की पवित्र या परमेश्वर के लिए अलग की हुई दशा का सीधा अनुवाद।
- source_word: μετανοείτω
  choice: मन फिराए
  rationale: केवल पछतावे के बजाय सोच और दिशा के परिवर्तन को व्यक्त करता है।
- source_word: μαρανᾰθά
  choice: मारानाथा
  rationale: अरामी आराधनात्मक अभिव्यक्ति को मूल की तरह बिना अर्थ को एक दिशा में निर्णायक रूप से बाँधे लिप्यंतरित रखा गया है।
theological_decisions:
- issue: ‘अनुग्रह’ के आने का आशय
  choice: ‘अनुग्रह आए’ को बिना किसी अतिरिक्त कर्ता या व्याख्या के रखा गया।
  alternative: ‘प्रभु का अनुग्रह आए’ अथवा इसे मसीह के आगमन के स्पष्ट संदर्भ में करना।
  rationale: मूल पाठ में χάρις स्वयं कर्ता है; अंत-कालीन संकेत संभव है, पर उसे स्पष्ट करके मूल की संक्षिप्तता और संभावित बहुअर्थकता समाप्त नहीं की गई।
- issue: मारानाथा का विभाजन और अर्थ
  choice: ‘मारानाथा’ का लिप्यंतरण।
  alternative: ‘हे हमारे प्रभु, आ!’ या ‘हमारा प्रभु आ गया है।’
  rationale: अरामी व्यंजन-समूह को अलग-अलग विभाजित करने से अलग अर्थ संभव हैं; लिप्यंतरण वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: पवित्र व्यक्ति को आने का निमंत्रण
  choice: ‘यदि कोई पवित्र है, तो वह आए।’
  alternative: ‘यदि कोई शुद्ध है, तो भोज में आए।’
  rationale: मूल में न तो ‘शुद्ध’ विशेष रूप से है, न ही ‘भोज में’ स्पष्ट रूप से कहा गया है; निकटवर्ती यूखरिस्तीय संदर्भ के बावजूद उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। मूल की समानांतर पंक्तियाँ, आज्ञार्थक भाव और आराधनात्मक लय सुरक्षित रखी गई है। ‘दाऊद के पुत्र’ में पारंपरिक बाइबलीय पदबंध और ‘मारानाथा’ में मूल की अर्थगत तनावपूर्ण अस्पष्टता बनाए रखी गई है।
