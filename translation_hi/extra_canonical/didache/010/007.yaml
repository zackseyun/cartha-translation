  text: But permit the prophets to give thanks as they desire.
translation:
  language: hi
  text: पर भविष्यद्वक्ताओं को जितना वे चाहें उतना धन्यवाद देने की अनुमति दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῖς δὲ προφήταις
  choice: पर भविष्यवक्ताओं को
  rationale: δέ यहाँ पिछले निर्देश के साथ हल्का विरोध/अपवाद दिखाता है; προφήταις का स्वाभाविक और प्रचलित हिन्दी रूप ‘भविष्यवक्ताओं’ है।
- source_word: ἐπιτρέπετε
  choice: देने दो
  rationale: वर्तमान बहुवचन आज्ञार्थक क्रिया अनुमति देने का निर्देश देती है; हिन्दी में ‘... देने दो’ सहज और सीधा है।
- source_word: εὐχαριστεῖν
  choice: धन्यवाद देने
  rationale: इस प्रसंग में क्रिया भोजन/सभा की धन्यवाद-प्रार्थना करने को सूचित करती है; ‘धन्यवाद देने’ मूल शब्दार्थ को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ὅσα θέλουσιν
  choice: उनकी इच्छा के अनुसार
  rationale: यह अभिव्यक्ति भविष्यवक्ताओं को धन्यवाद-प्रार्थना की मात्रा या रूप में स्वतंत्रता देती है; हिन्दी वाक्यांश मूल की संभावित व्यापकता को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: भविष्यवक्ताओं को दी गई उपासना-संबंधी स्वतंत्रता का दायरा
  choice: ‘उनकी इच्छा के अनुसार’ कहकर दायरे को खुला रखा गया है।
  alternative: ‘जितना चाहें’ या ‘जिस प्रकार चाहें’
  rationale: ὅσα मात्रा, विषय-वस्तु अथवा विस्तार की ओर संकेत कर सकता है। किसी एक अर्थ को निश्चित करने के बजाय अनुवाद मूल की व्यापकता और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘पर’ अपवादात्मक संबंध को स्पष्ट करता है, और वाक्य किसी विशेष कलीसियाई परंपरा की शब्दावली नहीं थोपता।
