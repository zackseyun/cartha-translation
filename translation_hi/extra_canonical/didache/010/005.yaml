id: DID.10.5
reference: Didache 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μνήσθητι, Κύριε, τῆς ἐκκλησίας σου τοῦ ῥύσασθαι αὐτὴν ἀπὸ παντὸς πονηροῦ καὶ τελειῶσαι αὐτὴν ἐν τῇ ἀγάπῃ σου, καὶ σύναξον αὐτὴν ἀπὸ τῶν τεσσάρων ἀνέμων, τὴν ἁγιασθεῖσαν εἰς τὴν σὴν Βασιλείαν, ἣν ἡτοίμασας αὐτῇ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
translation:
  language: hi
  text: हे प्रभु, अपनी कलीसिया को स्मरण कर, ताकि तू उसे हर बुराई से छुड़ाए और अपने प्रेम में सिद्ध करे; और उस पवित्र की गई कलीसिया को चारों पवनों से अपने राज्य में[a] इकट्ठा कर, जिसे तूने उसके लिए तैयार किया है। क्योंकि सामर्थ्य और महिमा युगानुयुग तेरी ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने राज्य के लिए पवित्र की गई कलीसिया को चारों पवनों से इकट्ठा कर।”
    reason: यूनानी में “अपने राज्य में/के लिए” पदबंध को “इकट्ठा कर” या “पवित्र की गई” से जोड़ना संभव है।
lexical_decisions:
- source_word: Μνήσθητι
  choice: स्मरण कर
  rationale: आज्ञार्थक क्रिया का प्रार्थनापूर्ण और गरिमापूर्ण रूप; इसका आशय केवल मानसिक रूप से याद करना नहीं, बल्कि कृपापूर्वक ध्यान देना भी है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: आरंभिक मसीही समुदाय के लिए आधुनिक हिन्दी में प्रचलित और संदर्भानुकूल शब्द।
- source_word: ῥύσασθαι
  choice: छुड़ाए
  rationale: संकट या बुराई के अधिकार से बचाने/मुक्त करने का भाव व्यक्त करता है।
- source_word: τελειῶσαι
  choice: सिद्ध करे
  rationale: पूर्णता तक पहुँचाने के अर्थ को बनाए रखता है; केवल नैतिक निर्दोषता का संकीर्ण अर्थ नहीं देता।
- source_word: ἀπὸ τῶν τεσσάρων ἀνέμων
  choice: चारों पवनों से
  rationale: मूल की काव्यात्मक ब्रह्मांडीय छवि सुरक्षित रखी गई है; आशय चारों दिशाओं से है।
- source_word: τὴν ἁγιασθεῖσαν
  choice: उस पवित्र की गई कलीसिया को
  rationale: स्त्रीलिंग कृदंत का संबंध ἐκκλησία से स्पष्ट किया गया है, ताकि हिन्दी में इसे किसी अकेले व्यक्ति के रूप में न समझा जाए।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: अनवरत काल की स्तुतिपरक अभिव्यक्ति को स्वाभाविक, गरिमापूर्ण हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: εἰς τὴν σὴν Βασιλείαν का वाक्यगत संबंध
  choice: इसे σύναξον के साथ जोड़कर ‘अपने राज्य में इकट्ठा कर’ रखा गया है।
  alternative: इसे ἁγιασθεῖσαν के साथ जोड़कर ‘अपने राज्य के लिए पवित्र की गई’ अनुवाद किया जा सकता है।
  rationale: शब्दक्रम और प्रार्थना की गति राज्य में एकत्र करने वाले पाठ का समर्थन करती है, पर यूनानी में दूसरा संबंध भी व्याकरणतः संभव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: τελειῶσαι का धर्मवैचारिक विस्तार
  choice: ‘सिद्ध करे’
  alternative: ‘पूर्ण बनाए’
  rationale: मूल के पूर्णता तक पहुँचाने वाले भाव को रखा गया है, बिना यह निर्धारित किए कि यहाँ संस्थागत एकता, नैतिक परिपक्वता या अंतिम उद्धार में से कौन-सा पहलू प्रधान है।
- issue: ἣν का पूर्वपद
  choice: '‘जिसे’ का संबंध ‘राज्य’ से रखा गया: राज्य कलीसिया के लिए तैयार किया गया।'
  alternative: निकटवर्ती संरचना को भिन्न ढंग से विराम देकर संबंध अस्पष्ट छोड़ा जा सकता है।
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम का निकटतम और स्वाभाविक पूर्वपद βασιλείαν है; αὐτῇ कलीसिया को सूचित करता है।
translation_notes:
  register: प्रार्थनापूर्ण, सामुदायिक और गरिमापूर्ण आधुनिक हिन्दी। परमेश्वर को संबोधन में एकवचन निकटता-सूचक रूप ‘तू/तेरी’ के अनुरूप आज्ञार्थक ‘कर’ रखा गया है। ‘चारों पवनों’ से मूल बिंब बचाया गया है; डैश द्वारा appositional कृदंत को स्पष्ट किया गया है।
