source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εὐχαριστοῦμέν σοι, Πάτερ ἅγιε, ὑπὲρ τοῦ ἁγίου ὀνόματός σου, οὗ κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν, καὶ ὑπὲρ τῆς γνώσεως καὶ πίστεως καὶ ἀθανασίας, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/002.yaml
  text: 'We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.'
translation:
  language: hi
  text: 'हे पवित्र पिता, हम आपको धन्यवाद देते हैं—


    आपके पवित्र नाम के लिए,


    जिसे आपने हमारे हृदयों में वास कराया,


    और उस ज्ञान, विश्वास और अमरता के लिए,


    जिसे आपने अपने सेवक यीशु के द्वारा हमें ज्ञात कराया।


    युगानुयुग महिमा आपकी हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμέν σοι
  choice: हम आपको धन्यवाद देते हैं
  rationale: यूनानी वर्तमानकालीन कृतज्ञता-वचन का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: Πάτερ ἅγιε
  choice: हे पवित्र पिता
  rationale: सम्बोधन और विशेषण के बल को बनाए रखते हुए गरिमापूर्ण आधुनिक हिन्दी।
- source_word: κατεσκήνωσας
  choice: वास कराया
  rationale: शाब्दिक अर्थ ‘डेरा डालना/निवास करना’ है; causative प्रयोग को रखते हुए ‘नाम’ के हृदयों में स्थायी निवास का बिंब सुरक्षित किया गया।
- source_word: γνώσεως
  choice: ज्ञान
  rationale: मूल के व्यापक धार्मिक-अनुभवात्मक अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का मानक और संदर्भानुकूल हिन्दी प्रतिरूप।
- source_word: ἀθανασίας
  choice: अमरता
  rationale: मूल में ‘अनन्त जीवन’ नहीं बल्कि अमरता का संज्ञात्मक विचार है, इसलिए उसे सीधे रखा गया।
- source_word: ἐγνώρισας ἡμῖν
  choice: हम पर प्रकट किया
  rationale: ‘हमें ज्ञात कराया’ के अर्थ को प्रार्थनात्मक हिन्दी में स्वाभाविक रूप देता है और ईश्वरीय प्रकाशन का भाव बनाए रखता है।
- source_word: παιδός σου
  choice: अपने सेवक
  rationale: παῖς का अर्थ ‘बालक/पुत्र’ भी हो सकता है, पर इस आरम्भिक यहूदी-ईसाई प्रार्थना-शैली में ‘सेवक’ अधिक संभावित है; पुत्रत्व की धारणा को पाठ में आयात नहीं किया गया।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: कालों तक चलने वाली स्तुति का पारंपरिक, सुबोध और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: परमेश्वर के नाम का हृदयों में निवास
  choice: जिसे आपने हमारे हृदयों में वास कराया
  alternative: जिसे आपने हमारे हृदयों में बसाया
  rationale: मूल के निवास/तम्बू डालने वाले बिंब को अपेक्षाकृत स्पष्ट रखा गया, बिना यह तय किए कि ‘नाम’ यहाँ उपस्थिति, अधिकार या प्रकाशन में से किसका तकनीकी संकेत है।
- issue: यीशु के लिए παῖς
  choice: अपने सेवक यीशु
  alternative: अपने पुत्र यीशु / अपने बालक यीशु
  rationale: संदर्भ और प्रारम्भिक प्रार्थना-परंपरा ‘सेवक’ का समर्थन करती है। मूल की शब्दार्थगत व्यापकता को निर्णय-सूची में स्वीकार किया गया है, जबकि मुख्य पाठ में सबसे संभावित अर्थ चुना गया।
- issue: महिमा-वचन
  choice: महिमा युगानुयुग आपकी ही हो
  alternative: आपकी महिमा सदा होती रहे
  rationale: मूल के संक्षिप्त doxological सूत्र और परमेश्वर पर बल देने वाले σοὶ को ‘आपकी ही’ से सुरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, सामुदायिक और गरिमापूर्ण शैली। पंक्ति-विन्यास मूल की समानांतर कृतज्ञता-संरचना को सुनने और सामूहिक पाठ में समझने योग्य बनाता है। ‘आप’ का प्रयोग श्रद्धापूर्ण आधुनिक हिन्दी के अनुरूप है।
