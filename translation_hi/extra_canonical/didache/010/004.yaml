  yaml_path: translation/extra_canonical/didache/010/004.yaml
  text: Before all things we give thanks to you because you are mighty; to you be the glory forever.
translation:
  language: hi
  text: सब बातों से पहले हम आपका धन्यवाद करते हैं, क्योंकि आप सामर्थी हैं। महिमा सदा आपकी ही हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: सब बातों से पहले
  rationale: यूनानी पदबंध के कालिक अर्थ को निकटता से रखता है और हिन्दी में स्वाभाविक है; संदर्भ में यह धन्यवाद की प्राथमिकता व्यक्त करता है।
- source_word: εὐχαριστοῦμέν σοι
  choice: हम आपका धन्यवाद करते हैं
  rationale: क्रिया के वर्तमान काल और बहुवचन कर्ता को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δυνατός
  choice: सामर्थी
  rationale: ईश्वर की सामर्थ्य का गरिमापूर्ण और प्रचलित धार्मिक हिन्दी रूप; केवल शारीरिक बल का अर्थ देने वाले विकल्प से अधिक व्यापक है।
- source_word: σοὶ ἡ δόξα
  choice: महिमा सदा आपकी ही हो
  rationale: मूल के बलाघातयुक्त σοὶ को ‘आपकी ही’ से व्यक्त किया गया है; हिन्दी में यह स्वाभाविक स्तुतिपरक वाक्य बनता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: अनंत काल तक चलने वाले अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Πρὸ πάντων का अर्थ
  choice: सब बातों से पहले
  alternative: सबसे बढ़कर
  rationale: मूल पदबंध में कालिक (‘पहले’) और प्राथमिकतामूलक (‘सबसे बढ़कर’) दोनों छायाएँ संभव हैं। निकटतम शाब्दिक अर्थ को मुख्य पाठ में रखा गया है, बिना इसे केवल महत्व की श्रेणी में सीमित किए।
- issue: स्तुतिवाक्य σοὶ ἡ δόξα की अभिव्यक्ति
  choice: महिमा सदा आपकी ही हो
  alternative: महिमा सदा आपकी है
  rationale: यूनानी में स्पष्ट क्रिया नहीं है। हिन्दी का इच्छार्थक ‘हो’ पारंपरिक स्तुतिवाक्य की स्वाभाविकता बनाए रखता है, जबकि इसे किसी विशिष्ट सांप्रदायिक व्याख्या से नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक ‘आप’ के साथ; भाषा सरल, गरिमापूर्ण और सामूहिक प्रार्थना/धन्यवाद के अनुकूल रखी गई है।
