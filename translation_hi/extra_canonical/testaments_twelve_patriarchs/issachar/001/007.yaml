  text: So there were two fruits. And Leah said to Rachel, “Let it be enough for you that you have taken my husband; will you also take these from me?”
translation:
  language: hi
  text: इस प्रकार दो फल थे। तब लिआ ने राहेल से कहा, “तुम्हारे लिए इतना ही काफ़ी हो कि तुमने मेरे पति को ले लिया है; क्या तुम इन्हें भी मुझसे ले लोगी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῆλα
  choice: फल
  rationale: इस शब्द का अर्थ ‘सेब’ भी हो सकता है, पर यहाँ वस्तु की विशिष्ट पहचान निश्चित नहीं है; इसलिए व्यापक और स्वाभाविक ‘फल’ मूल की वास्तविक अस्पष्टता बनाए रखता है।
- source_word: Ἱκανούσθω σοι
  choice: तुम्हारे लिए इतना ही काफ़ी हो
  rationale: यह रूप प्रश्न नहीं, बल्कि आज्ञार्थक/कामनार्थक कथन है; हिंदी में इस संरचना से उसका बल सुरक्षित रहता है।
- source_word: ἔλαβες
  choice: ले लिया है
  rationale: संदर्भ में राहेल द्वारा लिआ के पति को अपने अधिकार में कर लेने की शिकायत व्यक्त होती है; यह अनुवाद बिना अतिरिक्त व्याख्या जोड़े उस भाव को रखता है।
- source_word: μὴ καὶ ταῦτα λήψῃ ἀπ᾿ ἐμοῦ
  choice: क्या अब तुम इन्हें भी मुझसे ले लोगी?
  rationale: निषेधात्मक प्रश्न का आरोपपूर्ण आशय स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है; ‘भी’ καί और ‘मुझसे’ ἀπ᾿ ἐμοῦ को स्पष्ट रूप से दर्शाते हैं।
