  text: और राहेल ने उससे कहा, “आज रात याकूब तुम्हारे साथ रहे, तुम्हारे बेटे के दूदाफलों के बदले में।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔστω σοι ὁ Ἰακὼβ
  choice: याकूब तुम्हारे साथ रहे
  rationale: ग्रीक में शाब्दिक रूप से ‘याकूब तुम्हारे लिए/तुम्हारा हो’ है; प्रसंग में इसका स्वाभाविक आशय उस रात याकूब का उसके साथ रहना है।
- source_word: ἀντὶ
  choice: इसके बदले
  rationale: विनिमय या प्रतिदान के संबंध को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: μανδραγόρων
  choice: दूदाफल
  rationale: मैनड्रेक नामक पौधे के फल के लिए प्रचलित बाइबलीय हिन्दी पद है और उत्पत्ति 30 के प्रसंग से संबंध बनाए रखता है।
- source_word: τοῦ υἱοῦ σου
  choice: अपने बेटे के
  rationale: ग्रीक संबंधवाचक पदबंध को सीधे रखता है; बेटा लिआ का है।
