source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 10. *Καὶ εἶπε Ῥαχήλ⁴⁷. *Μὴ καυχῶ μηδὲ δόξαζε σεαυτήν⁴⁸, *ὅτι ἐμὲ πρότερόν σου ἡρμόσατο⁴⁹, καὶ *δι᾽ ἐμὲ⁵⁰ ἐδούλευσε *τῷ πατρὶ ἡμῶν⁵¹ *ἔτη δεκατέσσαρα⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/010.yaml
  text: And Rachel said, “Do not boast, nor glorify yourself, for he was joined to me before you, and because of me he served our father fourteen years.”
translation:
  language: hi
  text: और राहेल ने कहा, “न डींग मार, न अपनी बड़ाई कर; क्योंकि उसका विवाह तुझसे पहले मुझसे हुआ था, और मेरे कारण उसने हमारे पिता की चौदह वर्ष तक सेवा की।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καυχῶ
  choice: डींग मार
  rationale: निषेध के संदर्भ में आत्मश्लाघा या घमंड से बोलने का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: δόξαζε σεαυτήν
  choice: अपनी बड़ाई कर
  rationale: शाब्दिक भाव ‘अपने आपको महिमा देना’ है; हिन्दी में ‘अपनी बड़ाई करना’ वही आत्म-महिमामंडन सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἡρμόσατο
  choice: विवाह के बंधन में बँधा था
  rationale: क्रिया का विवाह-संबंध स्थापित करने वाला अर्थ स्पष्ट करता है और केवल सामान्य संगति का भ्रम नहीं होने देता; मध्यवाच्य तथा भूतपूर्वता को ‘बँधा था’ से रखा गया है।
- source_word: δι᾽ ἐμὲ
  choice: मेरे लिए
  rationale: 'यहाँ कारण/उद्देश्य का भाव है: याकूब ने राहेल को पाने के लिए सेवा की। ‘मेरे कारण’ भी संभव है, पर ‘मेरे लिए’ प्रसंग में अधिक स्वाभाविक है।'
- source_word: ἐδούλευσε
  choice: सेवा की
  rationale: पिता के अधीन वर्षों तक काम करने का भाव रखता है; ‘दासता की’ हिन्दी में अनावश्यक रूप से कठोर और कम स्वाभाविक होता।
theological_decisions:
- issue: ἡρμόσατο में विवाह-संबंध और घटनाक्रम
  choice: ‘विवाह के बंधन में बँधा था’ द्वारा कथन को वक्ता के दावे के रूप में यथावत रखा गया
  alternative: ‘उसकी मंगनी मुझसे हुई थी’ या ‘वह मुझसे ब्याहा गया था’
  rationale: ग्रीक विवाह हेतु जोड़े जाने का संकेत देता है, पर मंगनी और विवाह में स्पष्ट भेद नहीं करता। मुख्य पाठ व्यापक विवाह-संबंध रखता है और कथानक के संभावित तनाव को समझाकर समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्त्री से एकवचन निकट संबोधन के अनुरूप ‘मार/कर’; गरिमापूर्ण किंतु सहज शैली। दोनों निषेधों की समानांतर संरचना सुरक्षित रखी गई है।
