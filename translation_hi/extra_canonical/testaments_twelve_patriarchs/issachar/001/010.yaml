review_pass:
  verdict: revise
  source_fidelity: The two prohibitions, the priority of Rachel's marital union, and the fourteen-year service are retained. However, δι᾽ ἐμέ is causal ('because of me'), whereas 'मेरे लिए' can more naturally imply purpose/benefit ('for me').
  naturalness: The direct singular address and parallel prohibitions are natural. Adding 'तक' makes the duration idiomatic, and 'उसका विवाह मुझसे हुआ था' is smoother Hindi than the somewhat cumbersome passive 'मेरे साथ विवाह के बंधन में बँधा था.'
  terminology: '''डींग मारना'' and ''अपनी बड़ाई करना'' suitably convey καυχῶ and δόξαζε σεαυτήν. ''सेवा की'' appropriately renders ἐδούλευσε without importing unnecessarily harsh connotations.'
  issues:
  - severity: medium
    issue: '''δι᾽ ἐμέ'' is translated as ''मेरे लिए.'''
    rationale: 'In this construction διὰ with the accusative is causal: Jacob served Rachel and Leah''s father ''because of me.'' ''मेरे लिए'' can shift the statement toward intended benefit or purpose. ''मेरे कारण'' preserves the Greek relation and the English audit trail.'
  - severity: low
    issue: The duration lacks 'तक.'
    rationale: '''चौदह वर्ष तक सेवा की'' clearly expresses the Greek accusative of duration and is more natural modern Hindi.'
