source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 11. *Καὶ εἰ μὴ ὁ δόλος ἐπλήθυνεν ἐπὶ τῆς γῆς καὶ ἡ πονηρία τῶν ἀνθρώπων ἐχώρησεν, οὐκ ἂν εἶ σὺ ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ⁵³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/011.yaml
  text: And had guile not multiplied upon the earth and the wickedness of men advanced, you would not be looking on the face of Jacob.
translation:
  language: hi
  text: और यदि पृथ्वी पर छल न बढ़ा होता और मनुष्यों की दुष्टता आगे न बढ़ी होती, तो तुम याकूब का चेहरा न देख रही होतीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόλος
  choice: छल
  rationale: यह शब्द धोखे और कपट का भाव व्यक्त करता है; ‘छल’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐπλήθυνεν
  choice: बढ़ा होता
  rationale: पृथ्वी पर छल के बहुतायत में बढ़ने को सहज हिन्दी में व्यक्त करता है और प्रतितथ्यात्मक शर्त का काल भी बनाए रखता है।
- source_word: ἡ πονηρία τῶν ἀνθρώπων
  choice: मनुष्यों की दुष्टता
  rationale: सम्बन्धकारक संरचना और नैतिक बुराई का अर्थ सीधे सुरक्षित रहता है।
- source_word: ἐχώρησεν
  choice: आगे न बढ़ी होती
  rationale: क्रिया में आगे बढ़ने या फैलने का भाव है; ‘आगे बढ़ी’ अंग्रेज़ी परामर्श-पाठ के ‘advanced’ से भी मेल खाती है, बिना अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ
  choice: याकूब का मुख न देख रही होती
  rationale: वर्तमान स्त्रीलिंग कृदन्त ὁρῶσα को निरंतर अवस्था के रूप में और πρόσωπον को गरिमापूर्ण ‘मुख’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: प्रतितथ्यात्मक शर्त और परिणाम
  choice: ‘यदि ... न बढ़ा होता ... तो ... न देख रही होती’
  alternative: ‘यदि ... न बढ़ता ... तो ... न देखती’
  rationale: 'ग्रीक εἰ μή ... οὐκ ἂν के अतीत-आधारित प्रतितथ्यात्मक संबंध को स्पष्ट रखता है: वर्तमान स्थिति का कारण पूर्ववर्ती छल और दुष्टता को बताया गया है।'
- issue: कथन में निहित कारणात्मक नैतिक तनाव
  choice: छल और मानवीय दुष्टता को समानांतर कारणों के रूप में रहने दिया गया
  alternative: किसी विशेष पात्र के दोष या दैवी योजना के रूप में इसकी व्याख्या करना
  rationale: स्रोत स्वयं दोष का अधिक विशिष्ट धर्मशास्त्रीय निर्धारण नहीं करता; इसलिए उसकी अस्पष्टता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा कथन। स्त्री संबोधन के कारण ‘तू ... देख रही होती’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई; यूनानी पाठ में 53 संपादकीय टिप्पणी-संख्या है, अनुवादगत पादटिप्पणी नहीं।
