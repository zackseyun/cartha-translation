base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/012.yaml
  text: But Laban deceived me with guile, and removed me that night, and did not allow Jacob to see me; for if I had been there, this would not have happened to him.
translation:
  language: hi
  text: पर लाबान ने छल से मुझे धोखा दिया और उस रात मुझे हटा दिया। उसने याकूब को मुझे देखने नहीं दिया; क्योंकि यदि मैं वहाँ होती, तो उसके साथ यह न हुआ होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δόλῳ
  choice: छल से
  rationale: यह यूनानी पद धोखे की रीति या साधन बताता है; आधुनिक हिन्दी में ‘छल से’ स्वाभाविक और सटीक है।
- source_word: ἠπάτησέ με
  choice: मुझे धोखा दिया
  rationale: क्रिया का सीधा अर्थ धोखा देना या बहकाना है; यहाँ लाबान के छलपूर्ण व्यवहार के लिए ‘धोखा दिया’ उपयुक्त है।
- source_word: μετέστησέ με
  choice: मुझे वहाँ से हटा दिया
  rationale: क्रिया स्थान बदलने या दूर करने का भाव देती है। प्रसंग में अनिर्दिष्ट स्थान को अधिक निश्चित किए बिना ‘वहाँ से हटा दिया’ अर्थ को स्पष्ट रखता है।
- source_word: οὐκ εἴασε τῷ Ἰακὼβ ἰδεῖν με
  choice: उसने याकूब को मुझे देखने नहीं दिया
  rationale: यूनानी वाक्य की निषेधात्मक कारणवाचक संरचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τοῦτο αὐτῷ οὐκ ἐγένετο
  choice: उसके साथ यह न हुआ होता
  rationale: ‘यह’ और ‘उसके साथ’ मूल के संकेतात्मक तथा सर्वनामिक अस्पष्टपन को बनाए रखते हैं; घटना को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वक्ता स्त्री होने के कारण प्रसंगानुसार ‘यदि मैं वहाँ होती’ प्रयुक्त है। अंतिम ‘यह’ को जानबूझकर अनिर्दिष्ट रखा गया है, जैसा यूनानी पाठ में है।
