  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/002.yaml
  text: I was born as the fifth son to Jacob, as the wages for the mandrakes.
translation:
  language: hi
  text: मैं याकूब के पाँचवें पुत्र के रूप में दूदाफलों की मज़दूरी के रूप में जन्मा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέχθην
  choice: उत्पन्न हुआ
  rationale: यूनानी निष्क्रिय क्रिया का अर्थ ‘मैं जन्मा/उत्पन्न हुआ’ है; ‘उत्पन्न हुआ’ इस वंश-वर्णन में स्वाभाविक और गरिमापूर्ण है।
- source_word: πέμπτος υἱὸς τῷ Ἰακώβ
  choice: याकूब के पाँचवें पुत्र के रूप में
  rationale: क्रम और याकूब से पुत्र-संबंध दोनों को स्पष्ट रखते हुए यूनानी दत्तिव प्रयोग का सहज हिन्दी रूप दिया गया है।
- source_word: ἐν μισθῷ
  choice: मज़दूरी के बदले
  rationale: μισθός का मूल भाव मेहनताना/प्रतिफल है; उत्पत्ति 30:14–18 की लेन-देन संबंधी पृष्ठभूमि को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: τῶν μανδραγόρων
  choice: दूदाफलों
  rationale: μανδραγόρας के लिए प्रचलित बाइबलीय हिन्दी पौध-नाम ‘दूदाफल’ चुना गया है; फल-संदर्भ के कारण बहुवचन रूप रखा गया है।
theological_decisions:
- issue: दूदाफलों और इस्साकार के जन्म के बीच प्रतिफल-संबंध
  choice: दूदाफलों की मज़दूरी के बदले
  alternative: दूदाफलों के प्रतिफल के रूप में
  rationale: पाठ के ἐν μισθῷ को प्रत्यक्ष रखा गया है और उत्पत्ति-कथा के कारण-संबंध को उससे अधिक स्पष्ट या धर्मवैज्ञानिक नहीं बनाया गया जितना यूनानी कहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त आत्मकथात्मक शैली। संशोधन-इतिहास में दिया गया नवीन अंग्रेज़ी वाक्य इस पद के यूनानी स्रोत से असंबद्ध है, इसलिए अनदेखा किया गया।
