  text: 14. ⌈Καὶ προσέθηκε Ῥαχὴλ λαλεῖν καὶ εἶπεν. Ἕνα τῶν μανδραγόρων λήψομαι, καὶ ἀντὶ τοῦ ἑνὸς ἐκμισθώσω σοι ἐν τῇ νυκτί⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/014.yaml
  text: And Rachel went on speaking and said, "I will take one of the mandrakes, and in exchange for the one I will hire him out to you for the night."
translation:
  language: hi
  text: और राहेल ने बात आगे बढ़ाते हुए कहा, “मैं दूदाफलों में से एक ले लूँगी, और उस एक के बदले मैं उसे आज रात के लिए तुम्हें किराए पर दे दूँगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθηκε ... λαλεῖν
  choice: आगे कहा
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप; इससे राहेल के बोलते रहने या बात आगे बढ़ाने का भाव बना रहता है।
- source_word: μανδραγόρων
  choice: दूदाफलों
  rationale: मैनड्रेक नामक पौधे के फलों के लिए प्रचलित बाइबलीय हिन्दी शब्द, जो प्रसंग की सांस्कृतिक विशिष्टता बनाए रखता है।
- source_word: ἐκμισθώσω
  choice: किराए पर दे दूँगी
  rationale: क्रिया के सकर्मक और लेन-देन संबंधी अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν τῇ νυκτί
  choice: आज रात
  rationale: प्रसंगगत रूप से तय आगामी रात का स्वाभाविक हिन्दी निरूपण।
theological_decisions:
- issue: ἐκμισθώσω का कर्म अस्पष्ट है और पुरुषवाचक सर्वनाम से व्यक्त है
  choice: उसे ... तुम्हारे लिए किराए पर दे दूँगी
  alternative: मैं तुम्हारे लिए रात का सौदा कर लूँगी
  rationale: मूल में निहित पुरुषवाचक कर्म को बनाए रखा गया है; उसे स्पष्टतः ‘याकूब’ कहकर मूल की अंतर्निहितता को अनावश्यक रूप से नहीं खोला गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। संवाद की सौदेबाजी वाली सीधी भाषा तथा मूल का अंतर्निहित पुरुषवाचक सर्वनाम सुरक्षित रखा गया है।
