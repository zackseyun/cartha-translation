  text: These were fragrant fruits, which grow in the land of Haran below a watercourse.
translation:
  language: hi
  text: ये सुगंधित फल थे, जो हारान देश में जलधारा के नीचे उगते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῆλα
  choice: फल
  rationale: ग्रीक μῆλα संदर्भ के अनुसार सेब या सामान्य वृक्ष-फल का अर्थ दे सकता है। उपलब्ध पाठ में फल की निश्चित जाति स्पष्ट नहीं है, इसलिए व्यापक और स्वाभाविक ‘फल’ चुना गया है।
- source_word: εὔοσμα
  choice: सुगंधित
  rationale: यह शब्द मनभावन गंध वाले होने को व्यक्त करता है; ‘सुगंधित’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν τῇ γῇ Χαράν
  choice: हारान देश में
  rationale: स्थानवाचक वाक्यांश को सीधे रखा गया है और Χαράν का प्रचलित हिन्दी लिप्यंतरण ‘हारान’ अपनाया गया है।
- source_word: ὑποκάτω φάραγγος ὑδάτων
  choice: जलधारा के नीचे
  rationale: ὑποκάτω का स्थानगत अर्थ ‘नीचे’ है और φάραγγος ὑδάτων किसी जल-नाले, जलमार्ग या जलधारा की ओर संकेत करता है। मुख्य पाठ में सहज ‘जलधारा’ रखा गया है।
