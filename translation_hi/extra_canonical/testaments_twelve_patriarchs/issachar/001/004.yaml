lexical_decisions:
- source_word: Ἔκλαιε
  choice: रो रहा था
  rationale: अपूर्ण भूतकाल निरंतर चल रही क्रिया को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक रूप है।
- source_word: ἐπὶ τῇ φωνῇ αὐτοῦ
  choice: उसकी पुकार सुनकर
  rationale: शाब्दिक अर्थ ‘उसकी आवाज़ पर’ है; प्रसंग में रोने की आवाज़ के प्रत्युत्तर को स्वाभाविक हिन्दी में ‘पुकार सुनकर’ व्यक्त किया गया है।
- source_word: ἐξῆλθεν
  choice: बाहर आई
  rationale: यूनानी क्रिया का सीधा अर्थ ‘बाहर निकली/आई’ है; स्त्रीलिंग कर्ता लिआ के अनुसार रूप रखा गया है।
- source_word: Λεία ἡ μήτηρ μου
  choice: मेरी माँ लिआ
  rationale: यूनानी समानाधिकरण को सहज हिन्दी शब्दक्रम में रखा गया है और कथावाचक का प्रथम-पुरुष संबंध सुरक्षित है।
