base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/006.yaml
  text: And Rachel said, "I will not give these to you, but I will keep them in exchange for children; for the Lord has overlooked me, and I have borne no children to Jacob."
translation:
  language: hi
  text: 6. राहेल ने कहा, “मैं ये तुम्हें नहीं दूँगी, बल्कि इन्हें संतान के बदले अपने पास रखूँगी; क्योंकि प्रभु ने मेरी ओर ध्यान नहीं दिया, और मैंने याकूब के लिए कोई संतान नहीं जनी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ये / इन्हें
  rationale: निकटवर्ती वस्तुओं की ओर संकेत करने वाले बहुवचन सर्वनाम को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; संदर्भ से बाहर वस्तुओं का नाम जोड़ना उचित नहीं था।
- source_word: ἵνα σχῶ ταῦτα ἀντὶ τέκνων
  choice: इन्हें संतान के बदले अपने पास रखूँगी
  rationale: σχῶ का अर्थ ‘पाऊँ/अपने पास रखूँ’ और ἀντὶ τέκνων का अर्थ ‘संतान के बदले’ है। हिन्दी वाक्य विनिमय तथा अभाव—दोनों भावों को सहज रूप से व्यक्त करता है।
- source_word: τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ
  choice: मैंने याकूब के लिए कोई संतान नहीं जनी
  rationale: यूनानी दत्तिव τῷ Ἰακώβ को ‘याकूब के लिए’ के रूप में सुरक्षित रखा गया है और बहुवचन τέκνα को हिन्दी के सामूहिक शब्द ‘संतान’ से व्यक्त किया गया है।
theological_decisions:
- issue: παρεῖδε γάρ με ὁ Κύριος में परमेश्वर के व्यवहार का वर्णन
  choice: प्रभु ने मेरी ओर ध्यान नहीं दिया
  alternative: प्रभु ने मेरी ओर दृष्टि की
  rationale: παροράω सामान्यतः ‘अनदेखा करना, उपेक्षा करना, ध्यान न देना’ का भाव देता है, और अगला कथन—संतान न जनना—इस नकारात्मक अर्थ का समर्थन करता है। फिर भी रूप की संभावित सकारात्मक व्याख्या को पादटिप्पणी में बताया गया है, ताकि पाठ की अस्पष्टता दबे नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन में ‘ये/इन्हें’ मूल यूनानी के संकेतवाचक बल को बनाए रखते हैं; किसी अनिर्दिष्ट वस्तु का नाम संदर्भ से जोड़कर नहीं दिया गया।
