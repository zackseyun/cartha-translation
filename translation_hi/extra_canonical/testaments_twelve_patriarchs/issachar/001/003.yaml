  text: For Reuben my brother brought mandrakes from the field, and Rachel met him and took them from him.
translation:
  language: hi
  text: क्योंकि मेरा भाई रूबेन खेत से दूदा-फल लाया था, और राहेल उससे मिली और उसने वे फल ले लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανδραγόρους
  choice: दूदाफल
  rationale: यह मैनड्रेक पौधे के फल का पारंपरिक और प्रसंगानुकूल हिन्दी नाम है; उत्पत्ति 30 के अंतर्पाठीय संबंध को भी बनाए रखता है।
- source_word: προσαπαντήσασα
  choice: उससे मिलकर
  rationale: क्रिया में सामने जाकर मिलने का भाव है; सहज हिन्दी में इसे संक्षेप में व्यक्त किया गया है।
- source_word: ἔλαβεν αὐτούς
  choice: वे उससे ले लिए
  rationale: बहुवचन सर्वनाम का संकेत दूदाफलों की ओर सुरक्षित रखा गया और जिस व्यक्ति से लिए गए, वह भी स्पष्ट किया गया।
