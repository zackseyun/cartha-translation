translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। आरंभिक γὰρ को ‘क्योंकि’ से रखा गया है, जिससे पूर्ववर्ती कथन के साथ इसका व्याख्यात्मक संबंध सुरक्षित रहता है। नवीनतम संशोधन असंबद्ध पद का पाठ देता है, इसलिए उसे नहीं अपनाया गया।
