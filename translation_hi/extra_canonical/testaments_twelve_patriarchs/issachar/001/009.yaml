translation:
  language: hi
  text: परन्तु लिआ ने उससे कहा, “याकूब मेरा है, क्योंकि मैं उसकी युवावस्था की पत्नी हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπε δὲ πρὸς αὐτὴν
  choice: परन्तु लिआ ने उससे कहा
  rationale: δὲ यहाँ पिछले कथन के साथ विरोध अथवा प्रत्युत्तर का संबंध दिखाता है; ‘परन्तु’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। πρὸς αὐτήν का सरल रूप ‘उससे’ है।
- source_word: ἐμός ἐστιν ὁ Ἰακώβ
  choice: याकूब मेरा है
  rationale: मूल यूनानी के स्वत्व पर दिए गए स्पष्ट बल को सीधे और संक्षिप्त रूप में बनाए रखा गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह लिआ के दावे का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट कारणसूचक संयोजक है।
- source_word: γυνὴ νεότητος αὐτοῦ
  choice: उसकी युवावस्था की पत्नी
  rationale: यह मूल सामी पृष्ठभूमि वाली यूनानी पदावली का निकट और सुबोध रूप है; इसे ‘पहली पत्नी’ बनाकर संभावित आशय को अनावश्यक रूप से निश्चित नहीं किया गया।
