base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/015.yaml
  text: And Jacob knew Leah, and she conceived and bore me; and because of this — the wages — I was called Issachar.
translation:
  language: hi
  text: तब याकूब ने लिआः के साथ संबंध किया, और उसने गर्भ धारण किया और मुझे जन्म दिया। इसी मजदूरी के कारण मेरा नाम इस्साकार रखा गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पाठ इस्साकार नाम को “मजदूरी” या “प्रतिफल” से संबद्ध करता है।
    reason: यूनानी τὸν μισθὸν (“मजदूरी/प्रतिफल”) और नामकरण के बीच स्पष्ट संबंध को संक्षेप में दर्शाना।
lexical_decisions:
- source_word: Ἔγνω
  choice: दाम्पत्य संबंध बनाया
  rationale: शाब्दिक अर्थ ‘जाना’ है, पर यहाँ यह यौन-संबंध के लिए प्रयुक्त बाइबलीय शिष्टोक्ति है। आधुनिक हिन्दी में अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त किया गया है।
- source_word: τὸν μισθὸν
  choice: इस मजदूरी के कारण
  rationale: μισθός का अर्थ मजदूरी, पारिश्रमिक या प्रतिफल है। ‘मजदूरी’ निकटवर्ती प्रसंग और इस्साकार के नाम से जुड़े शब्द-संबंध को स्पष्ट रखती है।
- source_word: ἐκλήθην Ἰσαχάρ
  choice: मेरा नाम इस्साकार रखा गया
  rationale: यूनानी निष्क्रिय प्रयोग का स्वाभाविक हिन्दी रूप, जिसमें नामकरण का आशय सुरक्षित है।
theological_decisions:
- issue: याकूब द्वारा लिआ को ‘जानने’ की शिष्टोक्ति
  choice: दाम्पत्य संबंध बनाया
  alternative: लिआ को जाना
  rationale: शाब्दिक विकल्प आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होगा; चुना गया रूप वैवाहिक संदर्भ और मूल की शालीनता दोनों बनाए रखता है।
- issue: इस्साकार नाम और मजदूरी का संबंध
  choice: मुख्य पाठ में ‘मजदूरी’ रखा और पादटिप्पणी में शब्द-संबंध बताया
  alternative: नाम का अर्थ सीधे ‘मजदूरी’ घोषित करना
  rationale: नाम की सटीक व्युत्पत्ति पर मूल कथन से अधिक दावा किए बिना उसके अभिप्रेत शब्द-संबंध को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘दाम्पत्य संबंध’ मूल की शिष्टोक्ति को स्पष्ट करता है; ‘मजदूरी’ नामकरण से जुड़े प्रमुख शब्द को बनाए रखती है।
