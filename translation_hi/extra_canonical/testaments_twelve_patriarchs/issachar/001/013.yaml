  text: But still, in exchange for the mandrakes I hire out to you one night with Jacob.
translation:
  language: hi
  text: फिर भी, दूदाफलों के बदले मैं याकूब के साथ एक रात के लिए तुम्हें किराए पर दे दूँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽ οὖν
  choice: फिर भी
  rationale: यह संयोजन पिछले संवाद के प्रतिरोध के बाद रियायत या निष्कर्ष का भाव देता है; ‘फिर भी’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: दूदाफलों के बदले
  rationale: ἀντί विनिमय का भाव व्यक्त करता है। μανδραγόρα के लिए हिन्दी बाइबलीय प्रयोग ‘दूदाफल’ चुना गया है।
- source_word: ἐκμισθῶ σοι
  choice: मैं ... तुम्हें दे देती हूँ
  rationale: क्रिया का शाब्दिक अर्थ किराए/प्रतिफल पर देना है, पर यहाँ वक्ता विनिमय में याकूब के साथ अपनी एक रात दूसरी स्त्री को सौंप रही है; ‘दे देती हूँ’ हिन्दी में स्वाभाविक है और ‘के बदले’ लेन-देन का भाव सुरक्षित रखता है।
- source_word: μίαν νύκτα τῷ Ἰακώβ
  choice: याकूब के साथ एक रात
  rationale: ग्रीक दत्तिव τῷ Ἰακώβ को संगति के अर्थ में समझते हुए वाक्यांश को सहज हिन्दी क्रम में रखा गया है।
theological_decisions:
- issue: याकूब के साथ रात के अधिकार का विनिमय
  choice: मैं याकूब के साथ एक रात तुम्हें दे देती हूँ
  alternative: मैं याकूब को एक रात के लिए तुम्हारे हाथ किराए पर देती हूँ
  rationale: वैकल्पिक अति-शाब्दिक रूप हिन्दी में मनुष्य को किराए पर देने का अनपेक्षित और कठोर अर्थ पैदा करता है। चुना हुआ रूप वैवाहिक सहवास की बारी का लेन-देन व्यक्त करता है, बिना अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। स्रोत में प्रत्यक्ष वचन का स्पष्ट संकेत नहीं है, इसलिए उद्धरण-चिह्न नहीं जोड़े गए। पाठ को दिए गए यूनानी स्रोत के अनुसार अनूदित किया गया है; नवीनतम अंग्रेज़ी संशोधन में उद्धृत भिन्न वाक्यांश इस स्रोत-पंक्ति से मेल नहीं खाता।
