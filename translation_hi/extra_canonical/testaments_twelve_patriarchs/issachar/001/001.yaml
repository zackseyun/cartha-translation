base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/001.yaml
  text: A copy of the words of Issachar. For he called his sons and said to them, "Listen, children, to Issachar your father; give ear to the words of one beloved by the Lord.
translation:
  language: hi
  text: इस्साकार के वचनों की प्रतिलिपि। उसने अपने पुत्रों को बुलाकर उनसे कहा, “हे बच्चो, अपने पिता इस्साकार की सुनो; प्रभु के प्रिय जन की बातों पर कान लगाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह शब्द किसी लेख या कथन की नकल/प्रति को सूचित करता है; ‘प्रतिलिपि’ शीर्षकीय शैली में सटीक और स्वाभाविक है।
- source_word: λόγων / ῥήματα
  choice: वचनों / बातों
  rationale: आरंभिक शीर्षक में गरिमापूर्ण ‘वचन’, और प्रत्यक्ष संबोधन में स्वाभाविक ‘बातें’ रखा गया है; दोनों यूनानी शब्द कथनों को सूचित करते हैं।
- source_word: ἀκούσατε
  choice: की सुनो
  rationale: यहाँ क्रिया केवल ध्वनि सुनने नहीं, पिता की बात ध्यान से ग्रहण करने का आह्वान करती है।
- source_word: ἐνωτίσασθε
  choice: कान लगाओ
  rationale: मूल का शाब्दिक बिंब बनाए रखते हुए ध्यानपूर्वक सुनने का स्वाभाविक आधुनिक हिन्दी प्रयोग है।
- source_word: ἠγαπημένου
  choice: प्रिय जन
  rationale: कृदंत का आशय ऐसे व्यक्ति से है जो प्रभु द्वारा प्रेम किया गया है; ‘प्रिय जन’ इसे संज्ञात्मक और सहज रूप में व्यक्त करता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यूनानी κύριος का पारंपरिक, गरिमापूर्ण और संदर्भानुकूल हिन्दी रूप।
theological_decisions:
- issue: ἠγαπημένου ὑπὸ Κυρίου में प्रेम का कर्ता
  choice: प्रभु के प्रिय जन
  alternative: प्रभु से प्रेम करने वाले जन
  rationale: ὑπό के साथ यह निष्क्रिय अर्थ है—वह व्यक्ति जिसे प्रभु प्रेम करते हैं। अनुवाद ने इस दिशा को सुरक्षित रखा है और इसे मनुष्य के प्रभु-प्रेम में नहीं बदला।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किंतु सरल शैली अपनाई गई है। संबोधन को हिन्दी में स्वाभाविक बनाने के लिए ‘हे बच्चो’ तथा संबंध को स्पष्ट करने के लिए ‘अपने पिता इस्साकार’ रखा गया है।
