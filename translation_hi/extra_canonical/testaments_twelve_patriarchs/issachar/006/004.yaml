translation:
  language: hi
  text: क्योंकि वह दयालु है और उन्हें छुड़ाएगा, ताकि उन्हें उनकी भूमि में लौटा दे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अर्थ यह भी हो सकता है: “और उन्हें उनकी भूमि में फिर से लौटा देगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεήμων
  choice: दयालु
  rationale: यह प्रचलित और गरिमापूर्ण शब्द दया करनेवाले स्वभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξελεῖται
  choice: छुड़ाएगा
  rationale: भविष्यकालीन क्रिया का अर्थ संकट या बंधन से मुक्त कराने का है; ‘छुड़ाएगा’ इसे सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: ἐπιστρέψαι
  choice: लौटा दे
  rationale: मूल क्रिया के ‘वापस मोड़ने/लौटाने’ के अर्थ को लक्ष्य-भूमि के संदर्भ में सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν γῆν αὐτῶν
  choice: उनकी भूमि में
  rationale: εἰς की गंतव्य-दिशा और ‘उनकी अपनी भूमि’ के संबंध—दोनों को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: अंतिम infinitive clause का संबंध
  choice: 'उद्देश्य के रूप में: ‘ताकि उन्हें उनकी भूमि में लौटा दे’'
  alternative: 'परिणाम या समन्वित कार्य के रूप में: ‘और उन्हें उनकी भूमि में फिर लौटा देगा’'
  rationale: τοῦ + infinitive यहाँ छुटकारे के उद्देश्य को व्यक्त कर सकता है, पर पुनर्स्थापन के परिणाम का भाव भी संभव है; मुख्य पाठ में उद्देश्य रखा गया और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वह’ से मूल यूनानी का कर्ता-संदर्भ बिना अतिरिक्त व्याख्या के सुरक्षित है।
