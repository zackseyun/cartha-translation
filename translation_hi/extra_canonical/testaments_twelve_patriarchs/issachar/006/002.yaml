translation:
  language: hi
  text: और खेती करना छोड़कर वे अपनी बुरी योजनाओं के पीछे चलेंगे; वे राष्ट्रों में तितर-बितर हो जाएँगे और अपने शत्रुओं के दास बनकर काम करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες τὸ γεωργεῖν
  choice: खेती करना छोड़कर
  rationale: यह पदबंध खेती के काम को त्याग देने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐξακολουθήσουσι τοῖς πονηροῖς διαβουλίοις αὐτῶν
  choice: वे अपनी बुरी योजनाओं के पीछे चलेंगे
  rationale: ἐξακολουθέω किसी का अनुसरण करने या उसके पीछे चलने को व्यक्त करता है; διαβούλια यहाँ सोची-समझी योजनाओं/मंसूबों के अर्थ में है।
- source_word: διασπαρήσονται ἐν τοῖς ἔθνεσιν
  choice: वे राष्ट्रों में तितर-बितर हो जाएँगे
  rationale: निष्क्रिय भविष्यकाल और विभिन्न जातीय-राजनीतिक समूहों के बीच बिखराव, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: δουλεύσουσιν τοῖς ἐχθροῖς αὐτῶν
  choice: अपने शत्रुओं के दास बनकर काम करेंगे
  rationale: δουλεύω में सामान्य सेवा से अधिक दासत्व का भाव है। यह रूप हिन्दी में उस कठोर आशय को स्वाभाविक ढंग से व्यक्त करता है।
