id: T12P.ISS.6.1
reference: Testament of Issachar 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VI. *Γινώσκετε οὖν¹, τέκνα² μου, ὅτι ἐν ἐσχάτοις καιροῖς καταλείψουσιν³ οἱ υἱοὶ ὑμῶν τὴν ἁπλότητα Γκαὶ κολληθήσονται τῇ ἀπληστίᾳ˥, Γκαὶ⁷ ἀφέντες⁴ Γτὴν ἀκακίαν⁵ προσπελάσουσι⁶ τῇ πανουργίᾳ⁷, *καὶ καταλιμπάνοντες⁸ τὰς ἐντολὰς Κυρίου *κολληθήσονται τῷ Βελίαρ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/001.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b].
translation:
  language: hi
  text: इसलिए, मेरे बच्चों, जान लो कि अंतिम समयों में तुम्हारे पुत्र सरलता को छोड़ देंगे और लोभ से जुड़ जाएंगे; निष्कपटता[a] को त्यागकर वे धूर्तता के निकट आएँगे; और प्रभु की आज्ञाओं को छोड़कर वे बेलियार[b] से जुड़ जाएंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्दोषता”; यूनानी शब्द (ἀκακία) केवल दोषरहित होने के बजाय बुराई और छल-कपट से रहित होने का भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ में नाम का रूप “बेलियार” है; बहुत-से पाठक इसे “बेलियाल” नाम से जानते होंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότητα
  choice: सरलता
  rationale: यह शब्द एकनिष्ठ, निष्कपट सरलता का भाव रखता है; ‘सरलता’ मूल की नैतिक व्यापकता और स्वाभाविक हिंदी दोनों को बनाए रखता है।
- source_word: ἀπληστίᾳ
  choice: लोभ
  rationale: यह अतृप्त लालसा या लालच को दर्शाता है; ‘लोभ’ संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἀκακίαν
  choice: निष्कपटता
  rationale: ἀκακία में बुराई और छल से रहित होने का भाव है; ‘निष्कपटता’ यहाँ केवल निर्दोष ठहरने के बजाय छलरहित चरित्र पर बल देता है।
- source_word: πανουργίᾳ
  choice: धूर्तता
  rationale: यह चालाकी, छल-कपट और नैतिक कुटिलता को व्यक्त करता है; ‘धूर्तता’ प्रसंग में लोभ और निष्कपटता के त्याग के साथ उपयुक्त विरोध बनाता है।
- source_word: κολληθήσονται
  choice: से जा लगेंगे / से जा मिलेंगे
  rationale: क्रिया का मूल भाव दृढ़ता से जुड़ जाने या चिपक जाने का है। अलग-अलग हिंदी प्रयोग वाक्य को स्वाभाविक रखते हुए उसी गहरे संबंध को व्यक्त करते हैं।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यहाँ उपलब्ध यूनानी पाठ का रूप Βελίαρ है, इसलिए उसका सीधा देवनागरी लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ‘अन्त के समयों’ का कालगत अर्थ
  choice: अन्त के समयों में
  alternative: अन्तिम दिनों में
  rationale: ἐν ἐσχάτοις καιροῖς का बहुवचन और कालखंड-संबंधी रूप सुरक्षित रखा गया है; किसी विशिष्ट अन्तकालीन व्यवस्था की व्याख्या आरोपित नहीं की गई।
- issue: बेलियार की पहचान
  choice: नाम को ‘बेलियार’ के रूप में यथावत रखना
  alternative: शैतान या दुष्ट का अर्थानुवाद
  rationale: मूल पाठ एक विशिष्ट नाम प्रयुक्त करता है। उसे किसी धर्मवैज्ञानिक पहचान में चुपचाप बदलना मूल की अभिव्यक्ति और संभावित अर्थ-तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल वाक्य-विन्यास अपनाया गया है। ‘मेरे बच्चो’ संबोधन को स्वाभाविक हिंदी रूप में रखा गया है। मूल के तीन समानांतर नैतिक त्याग-जुड़ाव खंडों को अर्धविरामों से स्पष्ट किया गया है, और किसी सांप्रदायिक व्याख्या को पाठ में नहीं जोड़ा गया।
