base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/003.yaml
  text: Therefore you also tell these things to your children, so that, if they sin, they may turn back more quickly to the Lord[c],
translation:
  language: hi
  text: इसलिए तुम भी ये बातें अपने बच्चों को बताओ, ताकि यदि वे पाप करें, तो वे और भी जल्दी प्रभु की ओर फिरें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रभु की ओर फिरें” में पाप से मन फिराने और प्रभु के साथ पुनःस्थापन—दोनों का भाव निहित है।
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: इसलिए तुम भी
  rationale: οὖν का निष्कर्षसूचक अर्थ ‘इसलिए’ और καὶ ὑμεῖς का समावेशी बल ‘तुम भी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: εἴπατε ταῦτα τοῖς τέκνοις ὑμῶν
  choice: ये बातें अपने बच्चों को बताओ
  rationale: εἴπατε बहुवचन आज्ञार्थक है; ‘बताओ’ आधुनिक हिन्दी में कथन और शिक्षा—दोनों के लिए सहज है।
- source_word: ἐὰν ἁμάρτωσι
  choice: यदि वे पाप करें
  rationale: संभाव्य शर्त को बिना यह मान लिए रखा गया है कि वे अवश्य पाप करेंगे।
- source_word: τάχιον
  choice: शीघ्र ही
  rationale: तुलनात्मक क्रियाविशेषण का प्रसंगगत अर्थ जल्दी लौटने पर बल देता है; हिन्दी में ‘शीघ्र ही’ गरिमापूर्ण और सहज है।
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: वे प्रभु की ओर फिरें
  rationale: ἐπιστρέφω का मूल दिशा-परिवर्तन और पश्चातापसूचक लौटना दोनों सुरक्षित रहते हैं; πρὸς को ‘की ओर’ स्पष्ट करता है।
theological_decisions:
- issue: ἐπιστρέφω में पश्चाताप और पुनःस्थापन का संबंध
  choice: प्रभु की ओर फिरें
  alternative: प्रभु के पास लौट आएँ
  rationale: चुना गया रूप पाप से मुड़कर प्रभु की ओर होने की दिशा को उभारता है, पर पुनःस्थापन को पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- issue: सशर्त पाप
  choice: यदि वे पाप करें
  alternative: जब वे पाप करें
  rationale: ἐάν के वास्तविक सशर्त भाव को बनाए रखा गया है; ‘जब’ पाप को निश्चित घटना बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली। बहुवचन संबोधन को सहज हिन्दी ‘तुम’ से व्यक्त किया गया है।
