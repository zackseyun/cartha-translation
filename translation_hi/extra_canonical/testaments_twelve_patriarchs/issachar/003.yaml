  text: III. *Ὅτε οὖν¹ ἡδρύνθην² ἐγὼ³, *τέκνα μου⁴, ἐπορεύθην⁵ ἐν *εὐθύτητι καρδίας⁶, *καὶ ἐγενόμην⁷ γεωργὸς *τῷ πατρί μου καὶ τοῖς ἀδελφοῖς μου⁸, *καὶ ἔφερον καρποὺς⁹ ἐξ ἀγρῶν¹⁰ ⌜κατὰ καιρὸν αὐτῶν⌝¹¹. 2. Γ*Καὶ ηὐλόγει με ὁ πατήρ μου βλέπων με¹² *ὅτι ἐν ἁπλότητι πορεύομαι¹³ *ἔμπροσθεν αὐτοῦ¹⁴⁷. 3. *Καὶ οὐκ εἰμὶ¹⁵ περίεργος *ἐν ταῖς πράξεσίν μου¹⁶, Γοὐδὲ φθονερὸς¹⁷ καὶ¹⁸ βάσκανος *τῷ πλησίον μου¹⁹. 4. *Οὐ κατελάλησά τινος πώποτε²⁰, οὐδὲ²¹ ἔψεξα²² βίον ἀνθρώπου²³. 5. Τριάκοντα Γκαὶ πέντε¹²⁴ ἐτῶν ἔλαβον²⁵ ἐμαυτῷ²⁶ γυναῖκα²⁷, ὅτι ὁ κάματος κατήσθιε τὴν ἰσχύν²⁸ μου²⁹, καὶ οὐκ ἐνενόουν³⁰ ἡδονὴν³¹ γυναικός, Γἀλλὰ διὰ τοῦ κόπου³² ὁ ὕπνος μοι³³ περιεγένετο³⁴⁷. 6. Καὶ ἔχαιρε Γπάντοτε³⁵ ἐπὶ τῇ ἁπλότητί μου *ὁ πατήρ μου³⁶ Γδιότι³⁷ καὶ *πᾶν πρῶτον γέννημα³⁸ *διὰ τοῦ ἱερέως³⁹ τῷ⁴⁰ Κυρίῳ⁴¹ προσέφερον⁴², ἔπειτα καὶ⁴³ τῷ πατρί μου⁴⁴. 7. Καὶ ὁ⁴⁵ Κύριος ἐμυριοπλασίασε⁴⁶ τὰ ἀγαθὰ ⌜ἐν ταῖς χερσί⁴⁷ μου· ᾔδει δὲ καὶ Ἰακὼβ *ὁ πατήρ μου⁴⁸, ὅτι ὁ Θεὸς συνεργεῖ⁴⁸ τῇ ἁπλότητί μου⌝.
