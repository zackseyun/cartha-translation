  revised_text: '### इस्साकार का वसीयतनामा 3


    **1** इसलिए, जब मैं बड़ा हुआ, मेरे बच्चो, तो मैं हृदय की खराई से चला। मैं अपने पिता और भाइयों के लिए खेती करने लगा और खेतों से उनकी ऋतु के अनुसार उपज लाता था। **2** मेरे पिता मुझे आशीष देते थे, क्योंकि वे देखते थे कि मैं उनके सामने सरलता से चलता हूँ। **3** मैं अपने कामों में दखलंदाज़ नहीं था और न अपने पड़ोसी से ईर्ष्या या द्वेष रखता था।[a] **4** मैंने कभी किसी की निंदा नहीं की और न किसी के जीवन-ढंग की आलोचना की।


    **5** पैंतीस वर्ष की आयु में मैंने अपने लिए पत्नी ग्रहण की, क्योंकि परिश्रम मेरी शक्ति खा जाता था। मैं स्त्री-सुख के बारे में नहीं सोचता था; बल्कि अपने परिश्रम के कारण नींद मुझ पर हावी हो जाती थी। **6** मेरे पिता मेरी सरलता से सदा प्रसन्न रहते थे, क्योंकि मैं हर प्रथम उत्पन्न वस्तु[b] याजक के द्वारा प्रभु को चढ़ाता था और उसके बाद अपने पिता को भी देता था। **7** प्रभु ने मेरी भली वस्तुओं को मेरे हाथों में दस हज़ार गुना बढ़ा दिया। ⟦मेरे पिता याकूब भी जानते थे कि परमेश्वर मेरी सरलता के साथ मिलकर कार्य करता है।⟧[c]'
