  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003.yaml
  text: 'For if Leah my mother had not given up marital union in exchange for the two apples[a], she would still have been destined to bear eight sons. Therefore she bore six, and Rachel bore the two, because through the mandrakes the Lord visited her. For he saw that Leah desired to be with Jacob for the sake of children, and not for the sake of pleasure. For on the next day also she again gave Jacob over. Therefore through the mandrakes the Lord listened to Rachel. For although she longed for these, she did not eat them, but dedicated them in the house of the Lord, after bringing them to the priest.


    When therefore I grew to manhood, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers. And my father blessed me, seeing that I walked before him in simplicity. And I was not meddlesome in my actions, nor envious and malicious toward my neighbor. I never slandered anyone, nor did I criticize a man''s way of life. At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman''s pleasure; rather, because of my toil, sleep came over me. And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father. And the Lord multiplied my good things ten thousandfold[d][c][b], and my father likewise increased the good things for me twofold.'
translation:
  language: hi
  text: '### इस्साकार का वसीयतनामा 3


    **1** इसलिए, जब मैं बड़ा हुआ, मेरे बच्चो, तो मैं हृदय की खराई से चला। मैं अपने पिता और भाइयों के लिए खेती करने लगा और खेतों से उनकी ऋतु के अनुसार उपज लाता था। **2** मेरे पिता मुझे आशीष देते थे, क्योंकि वे देखते थे कि मैं उनके सामने सरलता से चलता हूँ। **3** मैं अपने कामों में दखलंदाज़ नहीं था और न अपने पड़ोसी से ईर्ष्या या द्वेष रखता था।[a] **4** मैंने कभी किसी की निंदा नहीं की और न किसी के जीवन-ढंग की आलोचना की।


    **5** पैंतीस वर्ष की आयु में मैंने अपने लिए पत्नी ग्रहण की, क्योंकि परिश्रम मेरी शक्ति खा जाता था। मैं स्त्री-सुख के बारे में नहीं सोचता था; बल्कि अपने परिश्रम के कारण नींद मुझ पर हावी हो जाती थी। **6** मेरे पिता मेरी सरलता से सदा प्रसन्न रहते थे, क्योंकि मैं हर प्रथम उत्पन्न वस्तु[b] याजक के द्वारा प्रभु को चढ़ाता था और उसके बाद अपने पिता को भी देता था। **7** प्रभु ने मेरी भली वस्तुओं को मेरे हाथों में दस हज़ार गुना बढ़ा दिया। ⟦मेरे पिता याकूब भी जानते थे कि परमेश्वर मेरी सरलता के साथ मिलकर कार्य करता है।⟧[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘द्वेष’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘बुरी नज़र रखनेवाला’ या ‘दूसरे की भलाई से कुढ़नेवाला’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हर प्रथम उत्पन्न वस्तु’ में पहली पैदावार के साथ पशुओं की पहली संतान भी सम्मिलित हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: चार्ल्स के यूनानी संस्करण में यह अंतिम वाक्यांश विशेष कोष्ठकों में है; इससे इस अंश की पाठ-स्थिति अनिश्चित या भिन्न होने का संकेत मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: εὐθύτητι καρδίας
  choice: हृदय की खराई
  rationale: यह हृदय की नैतिक सीधाई और सत्यनिष्ठा व्यक्त करता है; शाब्दिक ‘हृदय की सीधाई’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: ἁπλότης / ἁπλότητι
  choice: सरलता
  rationale: यह इस रचना का प्रमुख सद्गुण है—निष्कपट, बिना छल-कपट और एकनिष्ठ आचरण। पूरे अध्याय में एक ही शब्द रखकर विषयगत निरंतरता बचाई गई है।
- source_word: περίεργος
  choice: दखलंदाज़ी नहीं करता था
  rationale: यह निर्दोष जिज्ञासा नहीं, बल्कि दूसरों के मामलों या अनुचित कामों में हस्तक्षेप करने का भाव रखता है।
- source_word: φθονερὸς καὶ βάσκανος
  choice: ईर्ष्या या द्वेष रखता था
  rationale: पहला शब्द ईर्ष्या और दूसरा वैरपूर्ण, कृपण अथवा ‘बुरी नज़र’ वाले भाव को व्यक्त करता है। मुख्य पाठ में सहज नैतिक अर्थ रखा गया और विकल्प टिप्पणी में दिया गया है।
- source_word: κατελάλησα
  choice: निंदा की
  rationale: क्रिया किसी के विरुद्ध अपमानजनक या बदनाम करनेवाली बात कहने को सूचित करती है।
- source_word: καρποὺς ἐξ ἀγρῶν
  choice: खेतों से ... उपज
  rationale: कृषि-संदर्भ में ‘फल’ की अपेक्षा ‘उपज’ व्यापक और स्वाभाविक है।
- source_word: πᾶν πρῶτον γέννημα
  choice: हर पहली उपज
  rationale: γέννημα उत्पन्न वस्तु, पहली पैदावार या पहली संतान को सूचित कर सकता है। इस कृषक-संदर्भ में ‘पहली उपज’ स्वाभाविक है, जबकि व्यापक अर्थ टिप्पणी में सुरक्षित है।
- source_word: ἐμυριοπλασίασε
  choice: दस हज़ार गुनी बढ़ा दीं
  rationale: क्रिया की स्पष्ट संख्यात्मक तीव्रता को सामान्य ‘बहुत बढ़ाया’ में कमजोर नहीं किया गया।
- source_word: συνεργεῖ τῇ ἁπλότητί μου
  choice: मेरी सरलता के साथ मिलकर कार्य करता है
  rationale: यह असामान्य किन्तु वास्तविक ‘साथ कार्य करने’ वाली अभिव्यक्ति को बनाए रखता है; इसे केवल ‘सरलता को आशीष देता है’ कहकर धर्मवैचारिक तनाव समाप्त नहीं किया गया।
theological_decisions:
- issue: याजक के द्वारा प्रभु को पहली उपज चढ़ाने का कुलपितृकालीन उल्लेख
  choice: याजक और प्रभु का स्पष्ट उल्लेख ज्यों का त्यों रखा गया
  alternative: उत्पत्ति की कथा से सामंजस्य बैठाने के लिए इसे सामान्य भेंट के रूप में नरम करना
  rationale: यूनानी साक्ष्य स्पष्ट रूप से याजक के द्वारा प्रभु को चढ़ाने की बात कहता है; संभावित काल-विसंगति को अनुवाद में चुपचाप दूर करना उचित नहीं।
- issue: परमेश्वर का इस्साकार की सरलता के ‘साथ कार्य करना’
  choice: सहकार्य की भाषा को प्रत्यक्ष रूप से सुरक्षित रखा गया
  alternative: ‘परमेश्वर ने मेरी सरलता को आशीष दी’ या ‘मेरी सहायता की’
  rationale: συνεργεῖ का पारस्परिक/सहकार्यात्मक रूप धर्मवैचारिक तनाव रखता है। अधिक परिचित धार्मिक भाषा में बदलने से मूल का विशिष्ट कथन मिट जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सरलता’ को पूरे अध्याय में प्रमुख नैतिक पद के रूप में एकसमान रखा गया है। कृषि, श्रम और पारिवारिक सेवा की ठोस भाषा को अमूर्त धार्मिक शब्दावली में नहीं बदला गया।
