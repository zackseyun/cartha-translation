translation:
  language: hi
  text: और उसने अपने पैर फैलाए और अच्छी वृद्धावस्था में मर गया। उसके सभी अंग स्वस्थ थे, और बलवान रहते हुए वह अनन्त नींद सो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινε τοὺς πόδας αὐτοῦ
  choice: उसने अपने पैर सीधे किए
  rationale: मृत्यु से पहले पैर फैलाने या सीधा करने की क्रिया का स्वाभाविक हिन्दी रूप; यूनानी अभिव्यक्ति को अनावश्यक व्याख्या के बिना रखता है।
- source_word: ἐν γήρει καλῷ
  choice: भली वृद्धावस्था में
  rationale: καλῷ के सकारात्मक मूल्यांकन और γήρει के वृद्धावस्था-संबंधी अर्थ दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: πᾶν μέλος ἔχων ὑγιές
  choice: उसका हर अंग स्वस्थ था
  rationale: शरीर के सभी अंगों की स्वस्थ दशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἰσχύων
  choice: सामर्थी रहते हुए
  rationale: मृत्यु के समय भी शक्ति होने के आशय को बनाए रखता है; इसे केवल रोगमुक्त होने तक सीमित नहीं करता।
- source_word: ὕπνωσεν ὕπνον αἰώνιον
  choice: अनन्त निद्रा में सो गया
  rationale: संजातीय यूनानी प्रयोग और मृत्यु के लिए प्रयुक्त निद्रा-रूपक को बनाए रखता है, बिना उसके धर्मवैचारिक अर्थ को स्पष्ट करके सीमित किए।
theological_decisions:
- issue: ὕπνον αἰώνιον में मृत्यु का निद्रा-रूपक
  choice: अनन्त निद्रा में सो गया
  alternative: सदा के लिए मृत्यु की नींद सो गया
  rationale: मूल की रूपकात्मक और संभावित धर्मवैचारिक तनावयुक्त भाषा को बनाए रखा गया है; पाठ स्वयं पुनरुत्थान अथवा अंतिम अवस्था की व्याख्या नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है, जबकि मूल की क्रमिक मृत्यु-वर्णना और निद्रा-रूपक सुरक्षित हैं।
