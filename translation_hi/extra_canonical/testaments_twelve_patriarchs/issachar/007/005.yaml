review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys participation in another's suffering, sharing bread with a poor person, pious conduct, and keeping truth. However, “दुःखी” can denote sadness rather than the bodily or general pain of ὀδυνομένῳ, and “सत्य की रक्षा की” more readily suggests defending truth from attack than φυλάσσω in this ethical context.
  naturalness: “गरीब को अपनी रोटी में से दिया” lacks an explicit object in idiomatic Hindi. The revised wording supplies “हिस्सा.” “पीड़ित” is a more direct and natural equivalent for a person suffering pain.
  terminology: “धर्मपरायणता” suitably renders εὐσέβεια as reverent, godly conduct without importing a particular devotional tradition. “सत्य का पालन किया” is idiomatic Hindi for the ethical sense of keeping truth.
  issues:
  - severity: medium
    issue: Ambiguous rendering of ὀδυνομένῳ
    rationale: “दुःखी” may primarily mean emotionally sad, whereas the Greek denotes one who is in pain or suffering. “पीड़ित” retains the broader suffering/pain sense.
  - severity: medium
    issue: Elliptical object in the bread clause
    rationale: “अपनी रोटी में से दिया” is incomplete in natural Hindi because what was given is not stated. “अपनी रोटी का हिस्सा दिया” expresses μεταδίδωμι’s sharing sense clearly.
  - severity: low
    issue: ‘सत्य की रक्षा की’ over-specifies the action
    rationale: Although φυλάσσω can mean guard, in this moral catalogue “kept truth” is more naturally expressed as living by or observing truth. “सत्य का पालन किया” avoids the implication of polemical defense.
  revised_text: मैं हर पीड़ित मनुष्य के साथ कराहा, और गरीब को अपनी रोटी का हिस्सा दिया। मैंने अपने सभी दिनों में धर्मपरायणता का आचरण किया; मैंने सत्य का पालन किया।
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek sequence and first-person testimony while improving idiomatic Hindi. It makes the shared portion of bread explicit, narrows neither suffering nor εὐσέβεια to a sectarian sense, and renders the ethical force of keeping truth naturally.
