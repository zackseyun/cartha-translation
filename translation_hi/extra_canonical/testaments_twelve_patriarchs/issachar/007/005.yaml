source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. ⌈Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα καὶ πτωχῷ μετέδωκα ἄρτον¹² μου⁷. Εὐσέβειαν ἐποίησα¹⁴ ἐν πάσαις ταῖς¹⁵ ἡμέραις μου, *᾿Αλήθειαν ἐφύλαξα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/005.yaml
  text: I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth.
translation:
  language: hi
  text: मैं हर पीड़ित मनुष्य के साथ कराहा, और गरीब को अपनी रोटी का हिस्सा दिया। मैंने अपने सभी दिनों में धर्मपरायणता का आचरण किया; मैंने सत्य का पालन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδυνομένῳ συνεστέναξα
  choice: दुःखी मनुष्य के साथ कराहा
  rationale: συνεστέναξα में किसी की पीड़ा में सहभागी होकर साथ कराहने का भाव है; यह केवल सहानुभूति जताने से अधिक सशक्त है।
- source_word: πτωχῷ μετέδωκα ἄρτον μου
  choice: गरीब को अपनी रोटी में से दिया
  rationale: μεταδίδωμι का अर्थ अपने पास की वस्तु में दूसरे को भाग देना है; यह अनुवाद निजी भोजन साझा करने का भाव बनाए रखता है।
- source_word: Εὐσέβειαν ἐποίησα
  choice: भक्ति का आचरण किया
  rationale: εὐσέβεια श्रद्धापूर्ण, परमेश्वर-सम्मानकारी जीवन-व्यवहार को दर्शाता है; ‘भक्ति का आचरण’ धार्मिक भावना और व्यवहार दोनों को व्यक्त करता है।
- source_word: Ἀλήθειαν ἐφύλαξα
  choice: सत्य की रक्षा की
  rationale: φυλάσσω का मूल भाव संभालकर रखना, पालन करना या रक्षा करना है; ‘रक्षा की’ यूनानी अभिव्यक्ति की ठोसता को सुरक्षित रखता है।
theological_decisions:
- issue: εὐσέβεια का धार्मिक आशय
  choice: भक्ति
  alternative: धर्मपरायणता
  rationale: ‘भक्ति’ सामान्य आधुनिक पाठक के लिए सहज है और यहाँ किसी विशेष संप्रदायगत साधना को निर्दिष्ट किए बिना परमेश्वर के प्रति श्रद्धापूर्ण आचरण बताती है।
- issue: सत्य को ‘रखने’ का आशय
  choice: सत्य की रक्षा की
  alternative: सत्य का पालन किया
  rationale: मूल क्रिया व्यापक है। ‘रक्षा की’ उसके संरक्षण के भाव को बनाए रखती है और उसे केवल नैतिक नियम-पालन तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मूल यूनानी के निकट अभिव्यक्ति। ‘साथ कराहा’ पीड़ा में वास्तविक सहभागिता को और ‘अपनी रोटी में से दिया’ उदार साझेदारी को स्वाभाविक ढंग से व्यक्त करता है।
