revisions:
- from: मैं हर दुःखी मनुष्य के साथ कराहा और गरीब को अपनी रोटी में से दिया। मैंने अपने जीवन के सभी दिनों में भक्ति का आचरण किया; मैंने सत्य की रक्षा की।
  to: मैं हर पीड़ित मनुष्य के साथ कराहा, और गरीब को अपनी रोटी का हिस्सा दिया। मैंने अपने सभी दिनों में धर्मपरायणता का आचरण किया; मैंने सत्य का पालन किया।
  rationale: The revision preserves the Greek sequence and first-person testimony while improving idiomatic Hindi. It makes the shared portion of bread explicit, narrows neither suffering nor εὐσέβεια to a sectarian sense, and renders the ethical force of keeping truth naturally.
  reviewer_model: gpt-5.6-terra
