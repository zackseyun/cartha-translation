  text: And after saying these things, he commanded his sons to carry him up to Hebron, and there to bury him with his fathers.
translation:
  language: hi
  text: ये बातें कहने के बाद उसने अपने पुत्रों को आदेश दिया कि वे उसे हेब्रोन ले जाएँ और वहीं उसे उसके पूर्वजों के साथ दफ़नाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγάγωσιν
  choice: ले जाएँ
  rationale: क्रिया का मूल भाव ‘ऊपर ले जाना’ है, पर गंतव्य हेब्रोन के संदर्भ में स्वाभाविक आधुनिक हिन्दी में ‘ले जाएँ’ अधिक सहज है; दिशा का भाव संदर्भ में निहित रहता है।
- source_word: Χεβρών
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: θάψωσιν
  choice: दफ़नाएँ
  rationale: ‘गाड़ें’ की तुलना में यह अंत्येष्टि के संदर्भ में अधिक स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: τῶν πατέρων αὐτοῦ
  choice: उसके पुरखाओं
  rationale: यहाँ πατέρες से आशय पूर्वजों से है; ‘पुरखा’ सामान्य पाठक के लिए स्वाभाविक और अर्थ-सटीक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। यूनानी पाठ के क्रम और आशय को बनाए रखते हुए अनावश्यक रूप से ‘गुफा’ नहीं जोड़ा गया, क्योंकि दिए गए मूल-पाठ में उसका स्पष्ट उल्लेख नहीं है।
