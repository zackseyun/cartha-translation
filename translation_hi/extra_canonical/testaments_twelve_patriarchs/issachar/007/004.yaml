base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/004.yaml
  text: No deceit came to be in my heart, and no lie went up through my lips.
translation:
  language: hi
  text: मेरे हृदय में कोई छल उत्पन्न नहीं हुआ, और मेरे होंठों से कोई झूठ नहीं निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δόλος
  choice: छल
  rationale: यह यूनानी शब्द कपट, धोखे या छल का भाव व्यक्त करता है; यहाँ ‘छल’ सहज और अर्थ-सटीक है।
- source_word: οὐκ ἐγένετο
  choice: उत्पन्न नहीं हुआ
  rationale: क्रिया के ‘अस्तित्व में आने/होने’ के भाव को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ἐν τῇ καρδίᾳ μου
  choice: मेरे हृदय में
  rationale: ‘हृदय’ आंतरिक विचार और अभिप्राय के केंद्र का स्रोत-रूपक सुरक्षित रखता है।
- source_word: ψεῦδος
  choice: झूठ
  rationale: सामान्य, स्पष्ट हिन्दी में असत्य कथन का सीधा अर्थ देता है।
- source_word: οὐκ ἀνῆλθε διὰ τῶν χειλέων μου
  choice: मेरे होंठों से ... नहीं निकला
  rationale: यूनानी में शाब्दिक रूप से ‘मेरे होंठों के द्वारा ऊपर नहीं आया’ है; हिन्दी में ‘होंठों से नहीं निकला’ उसी वाणी-संबंधी रूपक को स्वाभाविक ढंग से व्यक्त करता है।
