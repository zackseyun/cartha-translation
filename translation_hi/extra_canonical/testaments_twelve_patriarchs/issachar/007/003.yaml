base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/003.yaml
  text: I did not drink wine for deception, and I did not desire anything that belonged to my neighbor.
translation:
  language: hi
  text: मैंने बहकाने के लिए दाखरस नहीं पिया; और मैंने अपने पड़ोसी की किसी भी वस्तु का लालच नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶνον
  choice: दाखमधु
  rationale: यह οἶνος का स्पष्ट और गरिमापूर्ण हिन्दी समतुल्य है; इससे मादक अंगूरी पेय का आशय बना रहता है।
- source_word: εἰς ἀποπλάνησιν
  choice: बहकावे के लिए
  rationale: ἀποπλάνησις में भटकाने, बहकाने या पथभ्रष्ट करने का भाव है। संक्षिप्त वाक्यांश मूल की प्रयोजनसूचक अस्पष्टता को बनाए रखता है—यह स्वयं बहकने अथवा दूसरों को बहकाने, दोनों संदर्भों में समझा जा सकता है।
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: अपने पड़ोसी की किसी भी वस्तु
  rationale: शाब्दिक बनावट कठिन है—‘पड़ोसी की हर अभिलषित वस्तु’। प्रसंग और अगले क्रियापद के साथ यह पड़ोसी से संबंधित किसी भी वस्तु को लालच की दृष्टि से चाहने का निषेध व्यक्त करता है।
- source_word: οὐκ ἐπεθύμησα
  choice: लालच नहीं किया
  rationale: ἐπιθυμέω यहाँ पड़ोसी की वस्तु के प्रति अनुचित इच्छा या लोभ दर्शाता है; ‘लालच करना’ आधुनिक हिन्दी में इस नैतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: εἰς ἀποπλάνησιν में बहकने या बहकाने की दिशा
  choice: बहकावे के लिए
  alternative: भटक जाने के लिए / किसी को बहकाने के लिए
  rationale: यूनानी वाक्यांश दिशा के कर्ता या भोक्ता को स्पष्ट नहीं करता। चुना हुआ रूप किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- issue: पड़ोसी से संबंधित इच्छा का नैतिक स्वरूप
  choice: लालच नहीं किया
  alternative: इच्छा नहीं की
  rationale: ‘इच्छा’ बहुत व्यापक और नैतिक रूप से तटस्थ हो सकती है, जबकि इस वाक्य में पड़ोसी की वस्तु के प्रति निषिद्ध लोभ का भाव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथनात्मक शैली रखी गई है। अर्धविराम मूल की दो समानांतर नकारात्मक प्रतिज्ञाओं को अलग करते हुए उनका निकट संबंध बनाए रखता है।
