revisions:
- from: मेरे बच्चो, तुम भी यही काम करो। तब बेलियार की हर आत्मा तुम्हारे पास से भाग जाएगी, और दुष्ट लोगों का कोई भी काम तुम पर अधिकार नहीं करेगा। तुम हर जंगली पशु को अपने वश में कर लोगे, क्योंकि स्वर्ग और पृथ्वी का परमेश्वर तुम्हारे साथ होगा—वही परमेश्वर, जो सरल हृदय वाले लोगों के साथ चलता है।
  to: मेरे बच्चों, तुम भी ये काम करो; तब बेलियार की हर आत्मा तुमसे दूर भाग जाएगी, और दुष्ट लोगों का हर काम तुम पर अधिकार नहीं करेगा। तुम स्वर्ग और पृथ्वी के परमेश्वर को अपने साथ पाकर हर जंगली पशु को अपने वश में कर लोगे—वह परमेश्वर जो मनुष्यों के साथ हृदय की सरलता में चलता है।
  rationale: The revision removes the explicit causal “क्योंकि” and represents ἔχοντες more closely with “परमेश्वर को अपने साथ पाकर.” It preserves the proper name Beliar, the universal force of πᾶν/πᾶσα, and the strong subjugation sense of καταδουλώσετε. “तब” is retained as a natural forward consequence of the exhortation, without making the final participial phrase causal. No footnote is necessary because the revised wording preserves the ambiguity of ἐν ἁπλότητι καρδίας rather than resolving it.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:24Z'
review_pass:
  verdict: revise
  source_fidelity: Draft introduces a causal/inferential “तब” and “क्योंकि” not present in the Greek. More importantly, it recasts the participial “having with you” as a causal assertion that God will be with them. The revision retains the participial relationship. It also avoids deciding whether “in simplicity of heart” exclusively qualifies the people.
  naturalness: The revised Hindi is modern and readable while retaining the source’s elevated exhortative register. “बच्चों” corrects the standard plural spelling, and “तुमसे दूर भाग जाएगी” is more idiomatic than “तुम्हारे पास से भाग जाएगी.”
  terminology: “बेलियार” correctly preserves the proper name. “परमेश्वर,” “स्वर्ग और पृथ्वी,” “अधिकार,” and “अपने वश में कर लेना” are appropriate, source-sensitive choices. “मनुष्यों के साथ हृदय की सरलता में चलता है” deliberately preserves the Greek phrase’s attachment ambiguity.
  issues:
  - severity: medium
    issue: Added causal/inferential connections
    rationale: “तब” and especially “क्योंकि” supply relationships not expressed by the Greek σειρά of coordinated clauses and participle.
  - severity: medium
    issue: Participial phrase altered into a causal assertion
    rationale: ἔχοντες μεθ᾽ ὑμῶν means “having [with] you,” whereas “क्योंकि ... तुम्हारे साथ होगा” both changes the construction and introduces causality.
  - severity: low
    issue: Interpretive narrowing of ‘in simplicity of heart’
    rationale: “सरल हृदय वाले लोगों” makes the phrase solely a description of the people. The Greek wording can be read more broadly as modifying the accompanying/walking relationship; the revision preserves this without doctrinal expansion.
  revised_text: मेरे बच्चों, तुम भी ये काम करो; तब बेलियार की हर आत्मा तुमसे दूर भाग जाएगी, और दुष्ट लोगों का हर काम तुम पर अधिकार नहीं करेगा। तुम स्वर्ग और पृथ्वी के परमेश्वर को अपने साथ पाकर हर जंगली पशु को अपने वश में कर लोगे—वह परमेश्वर जो मनुष्यों के साथ हृदय की सरलता में चलता है।
  revised_footnotes: []
  revision_rationale: The revision removes the explicit causal “क्योंकि” and represents ἔχοντες more closely with “परमेश्वर को अपने साथ पाकर.” It preserves the proper name Beliar, the universal force of πᾶν/πᾶσα, and the strong subjugation sense of καταδουλώσετε. “तब” is retained as a natural forward consequence of the exhortation, without making the final participial phrase causal. No footnote is necessary because the revised wording preserves the ambiguity of ἐν ἁπλότητι καρδίας rather than resolving it.
