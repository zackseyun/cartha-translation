id: T12P.ISS.7.7
reference: Testament of Issachar 7:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. *Ταῦτα καὶ ὑμεῖς, τέκνα μου, ποιεῖτε²², καὶ²³ πᾶν πνεῦμα τοῦ Βελίαρ φεύξεται ἀφ᾽ ὑμῶν καὶ πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν²⁴ καὶ¹¹ πᾶν ἄγριον θηρίον²⁵ καταδουλώσετε²⁶ ἔχοντες μεθ᾽ ὑμῶν²⁷ τὸν θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς²⁸ *συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας²⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/007.yaml
  text: You also, my children, do these things, and every spirit of Beliar will flee from you, and every deed of wicked people will not rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who goes with people in simplicity of heart.
translation:
  language: hi
  text: मेरे बच्चों, तुम भी ये काम करो; तब बेलियार की हर आत्मा तुमसे दूर भाग जाएगी, और दुष्ट लोगों का हर काम तुम पर अधिकार नहीं करेगा। तुम स्वर्ग और पृथ्वी के परमेश्वर को अपने साथ पाकर हर जंगली पशु को अपने वश में कर लोगे—वह परमेश्वर जो मनुष्यों के साथ हृदय की सरलता में चलता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ... ποιεῖτε
  choice: यही काम करो
  rationale: पूर्ववर्ती आचरण की ओर संकेत करने वाले बहुवचन Ταῦτα को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶν πνεῦμα τοῦ Βελίαρ
  choice: बेलियार की हर आत्मा
  rationale: πᾶν और πνεῦμα की व्यापकता बनाए रखते हुए Βελίαρ का नाम लिप्यंतरित किया गया है।
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων
  choice: दुष्ट लोगों का कोई भी काम
  rationale: नकारात्मक वाक्य में πᾶσα का स्वाभाविक हिन्दी समतुल्य ‘कोई भी’ है; इससे अर्थ ‘उनका कोई काम तुम पर अधिकार नहीं करेगा’ स्पष्ट रहता है।
- source_word: οὐ κυριεύσει ὑμῶν
  choice: तुम पर अधिकार नहीं करेगा
  rationale: κυριεύω के प्रभुत्व अथवा नियंत्रण के भाव को सीधे व्यक्त करता है।
- source_word: καταδουλώσετε
  choice: अपने वश में कर लोगे
  rationale: क्रिया के अधीन करने के प्रबल भाव को सहज हिन्दी में रखता है; केवल ‘वश में करना’ मूल अर्थ के अनुकूल है।
- source_word: συμπορευόμενον
  choice: साथ चलता है
  rationale: इस सहभागी कृदंत का अर्थ साथ यात्रा करना या साथ चलना है; हिन्दी में ‘साथ चलता है’ स्वाभाविक और निकट समतुल्य है।
- source_word: ἐν ἁπλότητι καρδίας
  choice: सरल हृदय वाले
  rationale: शाब्दिक ‘हृदय की सरलता में’ को सम्बन्धवाचक संरचना में सहज बनाया गया है, जबकि निष्कपटता/सरलता का मूल भाव सुरक्षित है।
theological_decisions:
- issue: परमेश्वर की संगति और ‘हृदय की सरलता’ के बीच सम्बन्ध
  choice: ‘जो सरल हृदय वाले लोगों के साथ चलता है’
  alternative: ‘जो लोगों के साथ हृदय की सरलता में चलता है’
  rationale: यूनानी पदबंध व्याकरणतः साथ चलने वाले लोगों की दशा अथवा ढंग को सूचित कर सकता है। चयनित हिन्दी स्वाभाविक है, पर इसे किसी विशेष सिद्धान्त या योग्यता की विस्तृत शर्त में नहीं बदलती।
- issue: बेलियार का निरूपण
  choice: व्यक्तिनाम ‘बेलियार’ को ज्यों का त्यों रखना
  alternative: ‘दुष्ट’ या ‘शैतान’ से अर्थ खोलना
  rationale: मूल में Βελίαρ विशिष्ट नाम है; उसका अनुवाद किसी अधिक परिचित धार्मिक पद से करने पर मूल की पहचान और सम्भावित अर्थ-तनाव मिट सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण किन्तु सामान्य पाठकों के लिए सरल। सम्बोधन में आत्मीय ‘मेरे बच्चो’ और बहुवचन ‘तुम’ रखा गया है। वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है; मूल की कारणसूचक/सहभागी रचना को ‘क्योंकि ... तुम्हारे साथ होगा’ और सम्बन्धवाचक उपवाक्य से व्यक्त किया गया है।
