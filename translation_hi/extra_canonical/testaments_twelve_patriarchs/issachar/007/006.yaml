  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/006.yaml
  text: I loved the Lord and every person with all my heart, more than my children.
translation:
  language: hi
  text: मैंने प्रभु और हर मनुष्य से अपने पूरे हृदय से, अपने बच्चों से भी बढ़कर प्रेम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν Κύριον
  choice: प्रभु
  rationale: यूनानी पद में निश्चित पदबंध है; ‘प्रभु’ उसका स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: πάντα ἄνθρωπον
  choice: हर मनुष्य
  rationale: एकवचन के साथ प्रयुक्त सार्वभौमिक अभिव्यक्ति को बनाए रखता है और किसी सीमित समूह का संकेत नहीं देता।
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: अपने पूरे हृदय से
  rationale: संपूर्ण आंतरिक निष्ठा और प्रेम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ τὰ τέκνα μου
  choice: अपने बच्चों से भी बढ़कर
  rationale: ὑπέρ के तुलनात्मक अर्थ और τέκνα के समावेशी बहुवचन को स्पष्ट तथा सहज रूप में रखता है।
theological_decisions:
- issue: प्रभु तथा प्रत्येक मनुष्य के प्रति प्रेम की तुलना अपनी संतानों से
  choice: दोनों कर्मों को एक ही क्रिया ‘प्रेम किया’ के अंतर्गत रखते हुए ‘अपने बच्चों से भी बढ़कर’ को वाक्य के अंत में रखा गया है।
  alternative: तुलना को केवल निकटतम पद ‘हर मनुष्य’ से जोड़ना।
  rationale: यूनानी वाक्य-विन्यास में अंतिम तुलनात्मक पद का दायरा कुछ हद तक खुला है; हिन्दी में उसे अंत में रखकर मूल की व्यापक संभावित संबद्धता को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। ‘मनुष्य’ सार्वभौमिकता तथा प्राचीन वसीयतनामा-सदृश शैली को बनाए रखता है।
