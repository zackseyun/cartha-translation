translation:
  language: hi
  text: और अपने पैर फैलाकर वह सुखद वृद्धावस्था में अनन्त निद्रा में सो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: अपने पैर फैलाकर
  rationale: यूनानी कृदन्तीय वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप; मृत्यु के समय शरीर की मुद्रा को बनाए रखता है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: मृत्यु के लिए प्रयुक्त निद्रा-रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἐν γήρει καλῷ
  choice: अच्छी वृद्धावस्था में
  rationale: γήρας और καλός के सामान्य अर्थों को निकटता से व्यक्त करता है तथा मूल में निहित सम्मानपूर्ण वृद्धावस्था का भाव बनाए रखता है।
- source_word: ὕπνον αἰώνιον
  choice: अनन्त निद्रा
  rationale: मूल के स्पष्ट मृत्यु-रूपक का संक्षिप्त और गरिमापूर्ण समतुल्य है।
theological_decisions:
- issue: ‘अनन्त निद्रा’ को मृत्यु या परलोक की किसी विशिष्ट धारणा के रूप में स्पष्ट करना
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: ‘सदा के लिए मर गया’ या पुनरुत्थान/अचेतन अवस्था की व्याख्या जोड़ना
  rationale: यूनानी पाठ केवल ‘अनन्त निद्रा’ कहता है; किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को आरोपित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट शैली। उपलब्ध यूनानी पाठ में ‘हर अंग स्वस्थ’ या ‘शक्ति में’ जैसा अतिरिक्त वाक्यांश नहीं है, इसलिए अंग्रेज़ी संशोधन-इतिहास में दिखने वाली वह सामग्री शामिल नहीं की गई।
