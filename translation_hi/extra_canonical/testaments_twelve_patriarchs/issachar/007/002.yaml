  text: Except for my wife, I have not known another. I did not commit sexual immorality with wandering eyes.
translation:
  language: hi
  text: अपनी पत्नी के सिवा मैंने किसी और को नहीं जाना। मैंने अपनी आँखों की चंचलता में व्यभिचार नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῆς συμβίου μου
  choice: अपनी पत्नी
  rationale: σύμβιος का शाब्दिक अर्थ ‘साथ जीवन बिताने वाली’ है; इस वैवाहिक संदर्भ में आधुनिक हिन्दी का स्वाभाविक और सटीक पद ‘पत्नी’ है।
- source_word: οὐκ ἔγνων ἄλλην
  choice: मैंने किसी और को नहीं जाना
  rationale: ‘जाना’ γινώσκω की जानबूझकर अप्रत्यक्ष, यौनार्थक अभिव्यक्ति को बनाए रखता है; ἄλλην में निहित स्त्रीलिंग को हिन्दी में ‘किसी और’ स्वाभाविक रूप से व्यक्त करता है, बिना अनावश्यक रूप से ‘स्त्री’ जोड़ने के।
- source_word: οὐκ ἐπόρνευσα
  choice: मैंने व्यभिचार नहीं किया
  rationale: πορνεύω यहाँ अवैध यौन आचरण को सूचित करता है। ‘व्यभिचार’ इस प्रसंग में गरिमापूर्ण और सामान्यतः समझा जाने वाला पद है, यद्यपि इसका हिन्दी अर्थ कभी-कभी विशेष रूप से परस्त्रीगमन तक सीमित समझा जा सकता है।
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: भटकती आँखों से
  rationale: यह वाक्यांश आँखों की चंचल या इधर-उधर उठती कामुक दृष्टि का चित्र देता है। ‘भटकती आँखों से’ रूपक को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘जानना’ का यौनार्थक संकेत
  choice: अप्रत्यक्ष अभिव्यक्ति ‘किसी और को नहीं जाना’ बनाए रखी गई
  alternative: ‘किसी दूसरी स्त्री से यौन-संबंध नहीं रखा’
  rationale: मूल यूनानी स्पष्ट शारीरिक विवरण देने के बजाय पारंपरिक अप्रत्यक्ष भाषा का प्रयोग करता है; अनुवाद उसी गरिमा और संकेतात्मकता को बचाता है।
- issue: πορνεύω की व्यापकता
  choice: ‘व्यभिचार’
  alternative: ‘यौन अनैतिकता’
  rationale: ‘व्यभिचार’ अधिक स्वाभाविक और गरिमापूर्ण है, पर इसे किसी विशेष व्यवस्थित धार्मिक परिभाषा तक सीमित नहीं किया गया है; संदर्भ इसे पत्नी के प्रति यौन निष्ठा से जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मूल की समानांतर आत्म-साक्ष्यात्मक संरचना के निकट। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
