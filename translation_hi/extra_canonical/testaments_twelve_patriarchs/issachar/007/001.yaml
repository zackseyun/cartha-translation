id: T12P.ISS.7.1
reference: Testament of Issachar 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VII. *Ἰδοὺ οὖν ὡς ὁρᾶτε, ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω¹, καὶ οὐκ *ἔγνων †ἐν ἐμοὶ ἁμαρτίαν Γεἰς θάνατον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/001.yaml
  text: 'See then, as you see: I am one hundred and twenty-six years old, and I have not known any sin in me leading to death.'
translation:
  language: hi
  text: 'इसलिए देखो, जैसा कि तुम देख रहे हो: मैं एक सौ छब्बीस वर्ष का हूँ, और मैंने अपने भीतर ऐसा कोई पाप नहीं जाना है जो मृत्यु की ओर ले जाता हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ οὖν
  choice: इसलिए देखो
  rationale: ἰδού की ध्यान आकर्षित करने वाली शक्ति और οὖν के निष्कर्षसूचक भाव, दोनों को सरल आधुनिक हिन्दी में रखा गया है।
- source_word: ὡς ὁρᾶτε
  choice: जैसा कि तुम देख रहे हो
  rationale: ὁράω के प्रत्यक्ष ‘देखने’ के अर्थ को बनाए रखा गया है; संबोधन बहुवचन है, जिसे हिन्दी में स्वाभाविक सामूहिक ‘तुम’ से व्यक्त किया गया है।
- source_word: ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω
  choice: मैं एक सौ छब्बीस वर्ष का हूँ
  rationale: ग्रीक आयु-विधान का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: οὐκ ἔγνων ... ἐν ἐμοὶ ἁμαρτίαν
  choice: मैंने अपने भीतर ऐसी कोई पाप की बात नहीं जानी
  rationale: ἔγνων के ‘जाना/पहचाना’ भाव और ἐν ἐμοί के ‘अपने भीतर’ अर्थ को सुरक्षित रखा गया है। हिन्दी में ‘पाप की बात’ प्रयोग करने से अमूर्त पाप का उल्लेख स्वाभाविक बनता है और इसे अनावश्यक रूप से ‘पाप करना’ नहीं बनाया जाता।
- source_word: εἰς θάνατον
  choice: जो मृत्यु की ओर ले जाती हो
  rationale: दिशा अथवा परिणाम की ओर संकेत करने वाले εἰς को ‘की ओर ले जाती’ से व्यक्त किया गया है, बिना यह तय किए कि मृत्यु शारीरिक है, आत्मिक है, या न्यायसंबंधी।
theological_decisions:
- issue: ‘मृत्यु की ओर’ ले जाने वाले पाप का स्वरूप
  choice: जो मृत्यु की ओर ले जाती हो
  alternative: मृत्यु-दायक / मृत्यु योग्य
  rationale: ग्रीक εἰς θάνατον दिशा या परिणति बताता है। चुना हुआ रूप मूल की अस्पष्टता बनाए रखता है और किसी विशिष्ट धर्मसैद्धांतिक श्रेणी को आरोपित नहीं करता।
- issue: वक्ता का पाप के विषय में दावा
  choice: अपने भीतर ... नहीं जानी
  alternative: मैंने कोई पाप नहीं किया / मुझे किसी पाप का बोध नहीं
  rationale: मूल में γινώσκω ‘जानना’ और ἐν ἐμοί ‘मुझमें/मेरे भीतर’ है। इसे न तो पूर्ण निष्पापता के स्पष्ट दावे में बदला गया है, न केवल अंतःकरण की व्यक्तिपरक अनुभूति तक सीमित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दोहराव ‘देखो, जैसा कि तुम देख रहे हो’ मूल यूनानी की अभिव्यक्ति को जानबूझकर सुरक्षित रखता है। संबोधन के लिए सामूहिक और आत्मीय ‘तुम’ चुना गया है।
