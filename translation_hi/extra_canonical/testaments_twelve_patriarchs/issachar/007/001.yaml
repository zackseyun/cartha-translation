  to: 'इसलिए देखो, जैसा कि तुम देख रहे हो: मैं एक सौ छब्बीस वर्ष का हूँ, और मैंने अपने भीतर ऐसा कोई पाप नहीं जाना है जो मृत्यु की ओर ले जाता हो।'
  rationale: The revision replaces the unnatural and less exact “ऐसी कोई पाप की बात” with direct “ऐसा कोई पाप,” while retaining γινώσκω as “जाना,” ἐν ἐμοί as “अपने भीतर,” and the source’s unresolved sense of sin in relation to death. The repeated visual language and plural “तुम” are retained.
