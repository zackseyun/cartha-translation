  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पद-संख्या सुरक्षित हैं। मुख्य पाठ के सभी टिप्पणी-चिह्न [a], [b] उपस्थित हैं। वर्ग कोष्ठक [a] वाले यूनानी पाठ-विस्तार की सीमा दिखाते हैं; अर्धविराम नैतिक कथनों की समानांतर संरचना स्पष्ट करते हैं।
