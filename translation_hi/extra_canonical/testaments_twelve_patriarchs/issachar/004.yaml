base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004.yaml
  text: He does not envy in his deliberations[a], nor does malicious envy consume his soul, nor is there distraction in greed in his mind. But he walks in simplicity of soul; he sees everything with uprightness of heart, not accepting evil eyes from the world’s error[b], so that he may not see the commandments of the Lord as distorted.
translation:
  language: hi
  text: 5 वह अपने विचार-विमर्श में ईर्ष्या नहीं करता; [द्वेषपूर्ण ईर्ष्या उसके प्राण को क्षीण नहीं करती][a]; और उसके मन में लोभ के कारण कोई विचलन नहीं होता। 6 बल्कि वह मन की सरलता से चलता है और सीधे हृदय से सब कुछ देखता है। वह संसार के भ्रम से उपजी बुरी दृष्टियों[b] को अपने भीतर स्थान नहीं देता, ताकि वह प्रभु की आज्ञाओं को विकृत रूप में न देखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिया वाक्यांश—“द्वेषपूर्ण ईर्ष्या उसके प्राण को क्षीण नहीं करती”—मुद्रित यूनानी पाठ में एक पाठ-विस्तार को दर्शाता है; यहाँ इसका अनुवाद उपलब्ध साक्षी-पाठ के अंग के रूप में किया गया है।
    reason: textual_variant
  - marker: b
    text: “बुरी दृष्टियों” का शाब्दिक अर्थ “बुरी आँखें” भी हो सकता है। यह अभिव्यक्ति शत्रुतापूर्ण या ईर्ष्यापूर्ण ढंग से देखने के मुहावरे की ओर भी संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῖ ἐν διαβουλίοις
  choice: अपने विचार-विमर्श में ईर्ष्या नहीं करता
  rationale: ζηλοῖ को इस दुर्गुण-सूची में सकारात्मक उत्साह के बजाय ईर्ष्या के अर्थ में लिया गया है; διαβουλίοις के चिंतन-परामर्श संबंधी भाव को ‘विचार-विमर्श’ व्यक्त करता है।
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  choice: द्वेषपूर्ण ईर्ष्या उसके प्राण को क्षीण नहीं करती
  rationale: βάσκανος में ईर्ष्यालु और दुर्भावनापूर्ण भाव है, जबकि ἐκτήκει क्रमशः गलाने या क्षीण करने का बिंब रखता है। ‘प्राण’ ψυχή की आंतरिक जीवन-सत्ता को बनाए रखता है।
- source_word: περισπασμὸς ἐν ἀπληστείᾳ ἐν νοΐ
  choice: लोभ उसके मन को भटकाता नहीं
  rationale: शाब्दिक संरचना ‘लोभ में मन में भटकाव’ हिन्दी में असहज है। क्रियात्मक रूप περισπασμός के खिंचाव/विक्षेप और ἀπληστία के अतृप्त लोभ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἁπλότητι ψυχῆς
  choice: मन की सरलता से
  rationale: ἁπλότης यहाँ नैतिक निष्कपटता और अखंड सरलता दर्शाता है। लगातार ‘प्राण’ दोहराने के बजाय इस मुहावरे में ‘मन’ आधुनिक हिन्दी में स्वाभाविक है, बिना अर्थ को केवल ईमानदारी तक सीमित किए।
- source_word: εὐθύτητι καρδίας
  choice: हृदय की सीधाई से
  rationale: εὐθύτης के सीधेपन के रूपक को बनाए रखते हुए यह आंतरिक नैतिक निष्कपटता व्यक्त करता है; ‘खरेपन’ की अपेक्षा स्रोत-बिंब के अधिक निकट है।
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηροὺς
  choice: बुरी दृष्टि को अपने भीतर स्थान नहीं देता
  rationale: ἐπιδέχομαι किसी प्रभाव को ग्रहण या स्वीकार करने का भाव रखता है। हिन्दी में ‘बुरी आँखें स्वीकार नहीं करता’ कृत्रिम होता; ‘बुरी दृष्टि’ मूल नेत्र-बिंब और ईर्ष्यापूर्ण दृष्टिकोण, दोनों की संभावना बनाए रखती है।
- source_word: ἀπὸ τῆς πλάνης τοῦ κόσμου
  choice: संसार के भ्रम से उपजी
  rationale: ἀπό स्रोत या उद्गम बताता है और πλάνη भ्रम, भटकाव या धोखे का अर्थ दे सकता है। ‘भ्रम’ जानबूझकर किए गए छल का अनावश्यक दावा नहीं करता।
- source_word: ἵνα μὴ ἴδῃ διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  choice: ताकि वह प्रभु की आज्ञाओं को विकृत रूप में न देखे
  rationale: व्याकरण आज्ञाओं को विकृत बनाना नहीं, उन्हें विकृत रूप में देखना बताता है। अनुवाद इसी बोधगत विकृति को स्पष्ट करता है।
theological_decisions:
- issue: नीतिवचन-सदृश कथनों का अप्रकट कर्ता
  choice: एक आदर्श धार्मिक व्यक्ति के लिए एकवचन ‘वह’
  alternative: निरपेक्ष ‘मनुष्य’ या प्रत्यक्ष उपदेश ‘तुम’
  rationale: यूनानी पाठ तीसरे पुरुष के सामान्य-वर्णन में है। ‘वह’ उस शैली और सद्गुणी व्यक्ति के चित्रण को सुरक्षित रखता है।
- issue: ‘बुरी दृष्टि’ का अर्थ
  choice: दुष्ट या ईर्ष्यापूर्ण देखने के ढंग को खुला रखा गया
  alternative: इसे केवल लोकविश्वास वाले ‘बुरी नज़र’ अथवा केवल ईर्ष्या के रूप में निश्चित करना
  rationale: ὀφθαλμοὺς πονηρούς शाब्दिक नेत्र-बिंब के साथ ईर्ष्यालु/दुर्भावनापूर्ण दृष्टि का मुहावरा भी जगा सकता है। मुख्य पाठ और टिप्पणी इस वास्तविक अस्पष्टता को बनाए रखते हैं।
- issue: प्रभु की आज्ञाओं का विकृत दिखाई देना
  choice: संसार के भ्रम से प्रभावित व्यक्ति की धारणा विकृत होती है
  alternative: प्रभु की आज्ञाएँ स्वयं विकृत हो जाती हैं
  rationale: ἴδῃ के साथ विधेयात्मक διεστραμμένας देखने वाले की विकृत समझ पर बल देता है; इससे आज्ञाओं की प्रकृति के विषय में अनावश्यक धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
