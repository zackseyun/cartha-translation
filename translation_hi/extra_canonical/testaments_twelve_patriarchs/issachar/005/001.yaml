base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/001.yaml
  text: Therefore, my children, keep the law of God, and acquire simplicity, and walk in innocence, not concerning yourselves with the deeds of your neighbor.
translation:
  language: hi
  text: इसलिए, मेरे बच्चों, परमेश्वर की व्यवस्था का पालन करो, सरलता को अपनाओ और निष्कपटता से चलो; अपने पड़ोसी के कामों में न उलझो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: पालन करो
  rationale: यह आज्ञार्थक क्रिया व्यवस्था को सुरक्षित रखने के साथ उसका आचरण करने का भाव रखती है; हिन्दी में ‘व्यवस्था का पालन करो’ स्वाभाविक और अर्थसंगत है।
- source_word: νόμον Θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος यहाँ ईश्वर-प्रदत्त नियम अथवा व्यवस्था को दर्शाता है; ‘व्यवस्था’ बाइबलीय संदर्भ में स्थापित और गरिमापूर्ण शब्द है।
- source_word: τὴν ἁπλότητα κτήσασθε
  choice: सरलता को अपनाओ
  rationale: ἁπλότης निष्कपट, एकनिष्ठ सरलता का बोध करा सकता है और κτάομαι उसे प्राप्त या अपना बनाने का; सहज आधुनिक हिन्दी में ‘अपनाओ’ इस आग्रह को व्यक्त करता है।
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  choice: निष्कपटता से चलो
  rationale: ἀκακία बुराई या छल से रहित निर्दोष भाव है, जबकि περιπατέω जीवन-आचरण का रूपक है; ‘निष्कपटता से चलो’ रूपक और नैतिक अर्थ दोनों बचाता है।
- source_word: μὴ περιαργαζόμενοι
  choice: अनावश्यक दखल न दो
  rationale: क्रिया दूसरों के विषयों में जरूरत से अधिक पड़ने, ताक-झाँक करने या हस्तक्षेप करने का भाव देती है; ‘अनावश्यक दखल न दो’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: τοῦ πλησίον τὰς πράξεις
  choice: अपने पड़ोसी के कामों में
  rationale: πλησίον निकटवर्ती व्यक्ति अथवा पड़ोसी और πράξεις उसके कार्यों/व्यवहार को दर्शाता है; सम्बन्धवाचक यूनानी रचना हिन्दी में ‘के कामों में’ से स्वाभाविक बनती है।
theological_decisions:
- issue: ‘परमेश्वर की व्यवस्था’ का दायरा
  choice: पद के सामान्य, अनिर्दिष्ट रूप को बनाए रखा गया है।
  alternative: इसे विशेष रूप से मूसा की व्यवस्था या किसी निर्धारित आज्ञा-संहिता के रूप में स्पष्ट करना।
  rationale: यूनानी νόμον Θεοῦ स्वयं इसका दायरा सीमित नहीं करता; किसी विशिष्ट धार्मिक व्याख्या को पाठ में जोड़ना उचित नहीं।
- issue: ἁπλότης और ἀκακία के निकटवर्ती नैतिक भाव
  choice: इन्हें क्रमशः ‘सरलता’ और ‘निष्कपटता’ कहा गया है।
  alternative: दोनों को ‘निर्दोषता’ या ‘खराई’ जैसे एक ही भाव में मिला देना।
  rationale: मूल में दो अलग संज्ञाएँ हैं; अनावश्यक पुनरुक्ति से बचते हुए उनका भेद बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक लहजा रखा गया है। ‘मेरे बच्चो’ प्रत्यक्ष सम्बोधन है; वर्तमान मानक वर्तनी में सम्बोधन रूप ‘बच्चो’ प्रयुक्त हुआ है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
