  text: For my father Jacob also blessed me with blessings of the earth and firstfruits of fruits.
translation:
  language: hi
  text: क्योंकि मेरे पिता याकूब ने भी मुझे भूमि की आशीषें और फलों की पहली उपज की आशीषें दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογίαις
  choice: आशीषें
  rationale: बहुवचन रूप और आशीष देने के भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τῆς γῆς
  choice: धरती की उपज
  rationale: शाब्दिक अर्थ ‘धरती की’ है; प्रसंग में कृषि-सम्बन्धी आशीष स्पष्ट करने के लिए ‘उपज’ जोड़ा गया है, जबकि अगले पदांश से इसका सम्बन्ध बना रहता है।
- source_word: ἀπαρχῶν καρπῶν
  choice: फलों के पहले फल
  rationale: ἀπαρχῶν के ‘पहली उपज/प्रथम फल’ और καρπῶν के ‘फलों’ दोनों को व्यक्त करता है तथा मूल की कुछ असामान्य पुनरुक्ति सुरक्षित रखता है।
- source_word: εὐλόγησέ με
  choice: मुझे ... की आशीषें दीं
  rationale: हिन्दी में स्वाभाविक रीति से यूनानी क्रिया और साधनवाचक बहुवचन εὐλογίαις दोनों का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘पहले फल’ का धार्मिक अथवा कृषि-संबंधी अर्थ
  choice: फलों के पहले फल
  alternative: फलों की प्रथम उपज
  rationale: मूल ἀπαρχή धार्मिक भेंट और मौसम की पहली उपज—दोनों का संकेत दे सकता है; चुना हुआ अनुवाद इस सम्भावित द्विअर्थता को पूरी तरह अनुष्ठानिक अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य की पुनरुक्ति को कुछ हद तक सुरक्षित रखते हुए हिन्दी वाक्य को स्वाभाविक बनाया गया है।
