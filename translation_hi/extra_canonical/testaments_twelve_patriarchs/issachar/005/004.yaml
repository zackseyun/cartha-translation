  text: For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now.
translation:
  language: hi
  text: क्योंकि भूमि की उपज के पहले फलों में प्रभु तुम्हें आशीष देगा, जैसे उसने हाबिल से लेकर अब तक सभी पवित्र जनों को आशीष दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: भूमि की उपज के पहले फलों में
  rationale: ‘प्रथम उपज’ की धार्मिक धारणा को बनाए रखते हुए यूनानी वाक्यांश का स्वाभाविक और सामान्य पाठकों के लिए स्पष्ट हिन्दी रूप दिया गया है। ‘में’ मूल ἐν की संभावित साधनात्मक/क्षेत्रसूचक अस्पष्टता को सुरक्षित रखता है।
- source_word: εὐλογήσει ὑμᾶς Κύριος
  choice: प्रभु तुम्हें आशीष देगा
  rationale: भविष्यकाल और कर्ता-क्रिया संबंध को सीधे सुरक्षित रखा गया है; Κύριος के लिए प्रतिष्ठित और सहज ‘प्रभु’ चुना गया है।
- source_word: πάντας τοὺς ἁγίους
  choice: सभी पवित्र जनों
  rationale: ἅγιοι को किसी विशिष्ट संस्थागत पदवी के बजाय व्यक्तियों के रूप में व्यक्त करने हेतु ‘पवित्र जन’ चुना गया है।
- source_word: ἀπὸ Ἀβὲλ ἕως τοῦ νῦν
  choice: हाबिल से लेकर अब तक
  rationale: कालगत विस्तार को स्वाभाविक आधुनिक हिन्दी में ठीक उसी सीमा के साथ व्यक्त करता है।
theological_decisions:
- issue: पहले फलों और आशीष के बीच संबंध
  choice: ‘पहले फलों में’
  alternative: ‘पहले फलों के द्वारा’ अथवा ‘पहले फल चढ़ाने पर’
  rationale: मूल ἐν संबंध को साधन, अवसर या क्षेत्र के रूप में समझने की गुंजाइश देता है। अनुवाद ने किसी विशेष चढ़ावे-विधि या कारणात्मक धर्मशास्त्र को आरोपित नहीं किया।
- issue: ‘पवित्र जनों’ की पहचान
  choice: सभी पवित्र जनों
  alternative: सभी संतों
  rationale: ‘पवित्र जन’ मूल अर्थ को बनाए रखता है और बाद की किसी विशिष्ट कलीसियाई उपाधि का अनावश्यक संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। पद की तुलना और भविष्यकाल को स्पष्ट रखा गया है; किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
