source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. Καὶ ὁ³⁵ Λευί³⁶ καὶ ὁ³⁷ Ἰούδας ἐδοξάσθησαν³⁸ παρὰ Κυρίου καὶ³⁹ ἐν υἱοῖς Ἰακώβ. Καὶ ὁ⁴⁰ Κύριος *ἐκληροδότησεν αὐτούς⁴¹¹, καὶ τῷ μὲν Λευὶ⁴² ἔδωκε *τὴν ἱερατείαν⁴³, τῷ δὲ Ἰούδᾳ⁴³ τὴν βασιλείαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/007.yaml
  text: 'And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord allotted to them their inheritance: to Levi, the priesthood; and to Judah, the kingdom.'
translation:
  language: hi
  text: 'और लेवी और यहूदा याकूब के पुत्रों में प्रभु द्वारा महिमान्वित किए गए। और प्रभु ने उनके लिए उनका भाग ठहराया: लेवी के लिए याजकपद और यहूदा के लिए राज्य।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν παρὰ Κυρίου
  choice: प्रभु से महिमा पाई
  rationale: कर्मवाच्य भाव और प्रभु को महिमा के स्रोत के रूप में बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ἐν υἱοῖς Ἰακώβ
  choice: याकूब के पुत्रों के बीच
  rationale: ἐν का यहाँ समूह के भीतर प्रतिष्ठा का अर्थ है; ‘के बीच’ इसे स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἐκληροδότησεν αὐτούς
  choice: उन्हें उनका उत्तराधिकार बाँट दिया
  rationale: क्रिया में उत्तराधिकार प्रदान अथवा नियत करने का भाव है; अगले दो समानांतर दानों के संदर्भ में ‘बाँट दिया’ वितरण का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν ἱερατείαν
  choice: याजकपद
  rationale: यह याजकीय पद अथवा संस्था को सूचित करता है; ‘याजकपद’ संक्षिप्त, प्रतिष्ठित और आधुनिक धार्मिक हिन्दी में बोधगम्य है।
- source_word: τὴν βασιλείαν
  choice: राजपद
  rationale: यहाँ यहूदा को सौंपे गए राजकीय अधिकार या शासन का समानांतर दान अभिप्रेत है; ‘राजपद’ ‘याजकपद’ के साथ संरचनात्मक समानता भी रखता है।
theological_decisions:
- issue: लेवी और यहूदा को दिए गए उत्तराधिकार का स्वरूप
  choice: लेवी को याजकपद और यहूदा को राजपद
  alternative: लेवी को याजकाई और यहूदा को राज्य
  rationale: मूल पाठ दोनों को प्रदत्त संस्थागत पदों के रूप में समानांतर रखता है। ‘याजकपद/राजपद’ इस समानता को सुरक्षित रखता है और किसी अतिरिक्त साम्प्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। मूल यूनानी की दो समन्वित वाक्य-रचनाएँ और लेवी–यहूदा का समानांतर विन्यास सुरक्षित रखा गया है।
