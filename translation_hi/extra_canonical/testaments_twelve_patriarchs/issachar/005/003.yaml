  text: Bend your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving.
translation:
  language: hi
  text: खेती के लिए अपनी पीठ झुकाओ और हर प्रकार की खेती के काम में परिश्रम करो; धन्यवाद के साथ प्रभु को भेंटें चढ़ाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: अपनी पीठ झुकाओ
  rationale: कृषि-श्रम के लिए स्वयं को लगाने की ठोस यूनानी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς τὸ γεωργεῖν
  choice: खेती के लिए
  rationale: क्रिया γεωργεῖν का सीधा और सामान्य हिन्दी अर्थ।
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  choice: हर प्रकार की खेती के काम में परिश्रम करो
  rationale: पाठ में कृषि-कार्य की व्यापकता और श्रम, दोनों को व्यक्त करता है; यूनानी की पुनरुक्ति को बोझिल बनाए बिना उसके बल को सुरक्षित रखता है।
- source_word: δῶρα
  choice: भेंटें
  rationale: प्रभु को अर्पित किए जाने वाले उपहारों के लिए उपयुक्त धार्मिक किंतु सर्वसामान्य शब्द।
- source_word: μετ᾽ εὐχαριστείας
  choice: धन्यवाद के साथ
  rationale: εὐχαριστία के कृतज्ञता/धन्यवाद भाव को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Κυρίῳ προσφέροντες
  choice: प्रभु को ... चढ़ाओ
  rationale: अर्पण-संदर्भ में προσφέρω के लिए स्वाभाविक हिन्दी; 'प्रभु' Κύριος का परंपरागत और संप्रदाय-निरपेक्ष रूप है।
theological_decisions:
- issue: भेंटों का स्वरूप
  choice: सामान्य बहुवचन ‘भेंटें’ रखा गया
  alternative: उपज की भेंटें / बलिदान
  rationale: यूनानी δῶρα भेंटों की प्रकृति निश्चित नहीं करता; विशिष्ट कृषि-उपज या बलिदान मानना पाठ से अधिक अर्थ जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदेशात्मक, श्रमप्रधान और गरिमापूर्ण शैली। कृषि की मूल छवि तथा धन्यवादपूर्वक प्रभु को अर्पण करने का संबंध सुरक्षित रखा गया है।
