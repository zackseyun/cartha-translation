  text: 2. Ἀλλὰ ἀγαπήσατε⁵ τὸν⁶ Κύριον καὶ τὸν πλησίον⁷· πένητα καὶ ἀσθενῆ⁸ ἐλεήσατε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/002.yaml
  text: But love the Lord and your neighbor. Show mercy to the poor and the weak.
translation:
  language: hi
  text: परन्तु प्रभु और अपने पड़ोसी से प्रेम करो। निर्धन और दुर्बल पर दया करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: प्रेम करो
  rationale: आज्ञार्थक बहुवचन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν πλησίον
  choice: अपने पड़ोसी
  rationale: यहाँ πλησίον का अर्थ निकटवर्ती मनुष्य या पड़ोसी है; ‘अपने’ हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: πένητα
  choice: निर्धन
  rationale: πένης उस व्यक्ति को सूचित करता है जिसके पास साधन कम हैं और जिसे जीविका के लिए श्रम करना पड़ता है; ‘निर्धन’ संक्षिप्त और गरिमापूर्ण समतुल्य है।
- source_word: ἀσθενῆ
  choice: दुर्बल
  rationale: ἀσθενής शारीरिक अथवा सामान्य निर्बलता का अर्थ रख सकता है; ‘दुर्बल’ इस व्यापकता को बनाए रखता है।
- source_word: ἐλεήσατε
  choice: दया करो
  rationale: आज्ञार्थक बहुवचन तथा करुणामय व्यवहार की माँग को सीधे व्यक्त करता है।
theological_decisions:
- issue: Κύριον में निश्चित पदबंध
  choice: प्रभु
  alternative: प्रभु से
  rationale: हिन्दी में संयुक्त क्रिया ‘प्रभु और अपने पड़ोसी से प्रेम करो’ दोनों कर्मों पर ‘से’ लागू करती है; इससे प्रभु की उपाधि सुरक्षित रहती है और अनावश्यक व्याख्या नहीं जुड़ती।
- issue: ἀσθενῆ का दायरा
  choice: दुर्बल
  alternative: बीमार
  rationale: मूल शब्द केवल रोग तक सीमित नहीं है; ‘दुर्बल’ उसकी वास्तविक अर्थगत व्यापकता और संभावित अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक शैली। यूनानी पाठ के वाक्य-विभाजन को दो वाक्यों में रखा गया है।
