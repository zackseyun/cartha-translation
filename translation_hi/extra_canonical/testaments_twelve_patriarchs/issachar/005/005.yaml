revisions:
- from: क्योंकि तुम्हें फसल की उपज के लिए किए गए परिश्रम से मिलने वाली धरती की समृद्धि के सिवा कोई और भाग नहीं दिया गया है।
  to: क्योंकि तुम्हें धरती की समृद्धि के सिवा, फलों के परिश्रमों में, कोई और भाग नहीं दिया गया है।
  rationale: The revision preserves the passive perfect (“नहीं दिया गया है”), the contrastive “कोई और भाग,” and the earth’s richness, while rendering ἐν πόνοις καρπῶν without turning it into an explicit statement that agricultural labor generates or awards that richness. The slightly compressed “फलों के परिश्रमों में” reflects the source’s own compressed and potentially ambiguous expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders οὐ γὰρ δέδοται ὑμῖν, ἄλλη μερίς, and τῆς πιότητος τῆς γῆς. However, “फसल की उपज के लिए किए गए परिश्रम से मिलने वाली” makes the earth’s richness explicitly a result received from labor, whereas ἐν πόνοις καρπῶν is a compact and syntactically somewhat difficult phrase meaning more nearly “in/with the labors of fruits.” The causal/resultative expansion is not warranted.
  naturalness: The current Hindi is fluent, but its long relative construction overexplains the final Greek phrase. A placement that retains the phrase as a qualifying circumstance is more concise and natural while avoiding a claim that the richness is produced by labor.
  terminology: “भाग” for μερίς and “धरती की समृद्धि” for πιότης τῆς γῆς are appropriate in modern standard Hindi. “फलों के परिश्रमों में” is deliberately close to the Greek’s compressed wording; in this agricultural context it can naturally denote labor connected with fruit/produce without adding a specific causal relation.
  issues:
  - severity: medium
    issue: The phrase “परिश्रम से मिलने वाली” adds a resultative/causal relationship.
    rationale: The preposition ἐν does not itself say that the richness is received as the product or reward of labor. Retaining “में” better preserves the source wording and its syntactic openness.
  - severity: low
    issue: “फसल की उपज के लिए” is more specific and repetitive than καρπῶν.
    rationale: καρποί can mean fruits or produce; “फलों” retains that breadth and does not recast the phrase as labor undertaken for a stated purpose.
  revised_text: क्योंकि तुम्हें धरती की समृद्धि के सिवा, फलों के परिश्रमों में, कोई और भाग नहीं दिया गया है।
  revised_footnotes: []
  revision_rationale: The revision preserves the passive perfect (“नहीं दिया गया है”), the contrastive “कोई और भाग,” and the earth’s richness, while rendering ἐν πόνοις καρπῶν without turning it into an explicit statement that agricultural labor generates or awards that richness. The slightly compressed “फलों के परिश्रमों में” reflects the source’s own compressed and potentially ambiguous expression.
