  text: For no other portion has been given to you except the richness of the earth by the labor of fruits.
translation:
  language: hi
  text: क्योंकि तुम्हें धरती की समृद्धि के सिवा, फलों के परिश्रमों में, कोई और भाग नहीं दिया गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς
  choice: भाग
  rationale: यह विरासत में मिले हिस्से या नियत अंश के सामान्य अर्थ को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: πιότητος τῆς γῆς
  choice: धरती की समृद्धि
  rationale: πιότης का शाब्दिक भाव ‘मोटाई/भरपूरी’ है और भूमि के संदर्भ में उसकी उर्वर समृद्धि को दर्शाता है; ‘समृद्धि’ मूल की व्यापकता बनाए रखता है।
- source_word: ἐν πόνοις καρπῶν
  choice: फसल की उपज के लिए किए गए परिश्रम से मिलने वाली
  rationale: यूनानी पदबंध अत्यंत संक्षिप्त है। यह चयन श्रम, फल/उपज और धरती की समृद्धि के संबंध को सहज हिन्दी में व्यक्त करता है, बिना अंग्रेज़ी के अस्वाभाविक ‘फलों का परिश्रम’ को यांत्रिक रूप से दोहराए।
