base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/008.yaml
  text: Therefore obey them, and walk in the simplicity of your father. [But to Gad it was given to destroy the marauding bands coming upon Israel.]
translation:
  language: hi
  text: इसलिए तुम भी उनकी आज्ञा मानो और अपने पिता की सरलता के अनुसार चलो। [पर गाद को यह दिया गया कि वह इस्राएल पर चढ़ आनेवाले लुटेरों के दलों का नाश करे।]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακούετε
  choice: आज्ञा मानो
  rationale: यह क्रिया सुनकर अधीन होने या आज्ञापालन करने का भाव रखती है; आधुनिक हिन्दी में ‘आज्ञा मानो’ स्पष्ट और स्वाभाविक है।
- source_word: τῇ ἁπλότητι
  choice: सरलता
  rationale: ἁπλότης यहाँ निष्कपट, सीधी और अखंड वृत्ति का संकेत दे सकता है। ‘सरलता’ मूल की व्यापकता बनाए रखती है और इसे केवल नैतिक निष्कपटता तक सीमित नहीं करती।
- source_word: περιπατεῖτε
  choice: मार्ग पर चलो
  rationale: शाब्दिक ‘चलो’ जीवन-आचरण का रूपक है; ‘मार्ग पर चलो’ हिन्दी में उस रूपक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐδόθη
  choice: यह सामर्थ्य दी गई
  rationale: निष्क्रिय रूप ‘दिया गया’ सुरक्षित रखा गया है और देनेवाले को अनावश्यक रूप से निर्दिष्ट नहीं किया गया; प्रसंग में नाश करने की क्षमता या अधिकार अभिप्रेत है।
- source_word: τὰ ἐπερχόμενα πειρατήρια
  choice: चढ़ आनेवाले लुटेरों के दलों
  rationale: πειρατήρια आक्रमणकारी या लूटमार करनेवाले दलों को सूचित करता है; ‘लुटेरों के दल’ को ‘चढ़ आनेवाले’ के साथ रखकर समूह और आक्रमण—दोनों भाव व्यक्त होते हैं।
- source_word: ἀπολέσαι
  choice: नाश करे
  rationale: यह infinitive नष्ट करने या मिटा देने का तीव्र अर्थ रखता है; ‘नाश करे’ उस बल को बनाए रखता है।
theological_decisions:
- issue: ‘अपने पिता’ का संकेत
  choice: अपने पिता
  alternative: हमारे पिता/इस्साकार
  rationale: यूनानी τοῦ πατρὸς ὑμῶν का सीधा अर्थ ‘तुम्हारे पिता’ है। पाठ में पिता की पहचान स्पष्ट करके अस्पष्टता दूर नहीं की गई।
- issue: गाद को किसने सामर्थ्य दी
  choice: निष्क्रिय वाक्य रखा गया
  alternative: परमेश्वर ने गाद को सामर्थ्य दी
  rationale: यूनानी ἐδόθη देनेवाले का नाम नहीं बताता। संभावित दैवी निष्क्रियता को स्वीकार करते हुए भी अनकहा कर्ता पाठ में नहीं जोड़ा गया।
- issue: कोष्ठकबद्ध खंड की पाठीय स्थिति
  choice: वर्ग कोष्ठक बनाए रखे
  alternative: खंड को सामान्य मुख्य पाठ में मिला देना
  rationale: प्रदत्त यूनानी संस्करण और परामर्श-पाठ में यह अंश कोष्ठकबद्ध है; उसका दृश्य भेद सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सरलता’ मूल की नैतिक और स्वभावगत व्यापकता को बचाती है। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
