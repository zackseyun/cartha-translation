source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. Οὐ²³ ζηλοῖ ἐν διαβουλίοις [οὐ βάσκανος²⁶ ἐκτήκει τὴν ψυχὴν αὐτοῦ]²⁷ *οὐδὲ ⌜περισπασμὸς⌝ ἐν ἀπληστείᾳ ἐν νοΐ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/005.yaml
  text: He does not envy in deliberations, nor does malicious envy consume his soul, nor is there distraction in greed in his mind.
translation:
  language: hi
  text: वह विचार-विमर्शों में ईर्ष्या नहीं करता; न ही दुर्भावनापूर्ण ईर्ष्या उसकी आत्मा को क्षीण करती है, और न उसके मन में लोभ में कोई विचलन होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλοῖ
  choice: ईर्ष्या करता
  rationale: यहाँ क्रिया का नकारात्मक अर्थ संदर्भ और अगले वाक्यांश βάσκανος से स्पष्ट है; इसलिए सामान्य आधुनिक हिन्दी में ‘ईर्ष्या करता’ उपयुक्त है।
- source_word: ἐν διαβουλίοις
  choice: विचार-विमर्श में
  rationale: बहुवचन संज्ञा deliberations/counsels को बिना अनावश्यक स्वामित्व जोड़े व्यक्त करता है।
- source_word: βάσκανος
  choice: दुर्भावनापूर्ण ईर्ष्या
  rationale: यह शब्द केवल ईर्ष्या नहीं, बल्कि दूसरे का बुरा चाहने वाली द्वेषपूर्ण दृष्टि/ईर्ष्या का भाव रखता है।
- source_word: ἐκτήκει
  choice: भीतर ही भीतर गलाती है
  rationale: मूल क्रिया ‘गला देना/क्षीण करते जाना’ का सजीव और स्वाभाविक हिन्दी रूप है।
- source_word: περισπασμὸς
  choice: भटकाव
  rationale: मन के खिंचने, बँटने या विचलित होने का व्यापक अर्थ बनाए रखता है।
- source_word: ἐν ἀπληστείᾳ
  choice: लोभ से उत्पन्न
  rationale: ἀπληστία की अतृप्त लालसा/लोभ की धारणा को स्वाभाविक हिन्दी संबंध में व्यक्त करता है।
- source_word: ἐν νοΐ
  choice: उसके मन में
  rationale: νοῦς के मानसिक क्षेत्र को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: क्या βάσκανος को अलौकिक ‘बुरी नज़र’ के अर्थ में लिया जाए
  choice: दुर्भावनापूर्ण ईर्ष्या
  alternative: बुरी नज़र / ईर्ष्यालु व्यक्ति
  rationale: इस नैतिक गुण-सूची और ψυχή को गलाने वाली क्रिया के संदर्भ में अमूर्त, द्वेषपूर्ण ईर्ष्या सबसे संगत है; पाठ में अनिवार्य रूप से कोई अलौकिक अर्थ नहीं थोपा गया।
- issue: περισπασμός और ἀπληστία का संबंध
  choice: लोभ से उत्पन्न भटकाव
  alternative: लोभ में भटकाव
  rationale: ग्रीक के दोहरे ἐν का हिन्दी में यांत्रिक पुनरुत्पादन अस्वाभाविक होता; कारणात्मक रूप अर्थ-संबंध को सहज बनाता है, जबकि मानसिक विचलन का मूल भाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी पाठ के तीन समानांतर नकारात्मक खंड बनाए गए हैं। कोष्ठकित पाठ-खंड को उपलब्ध संस्करण के मुख्य अर्थ के रूप में रखा गया है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
