base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/006.yaml
  text: But he walks in simplicity of soul; he sees all things with uprightness of heart, not accepting evil eyes from the world’s error, so that he may not see the commandments of the Lord as distorted.
translation:
  language: hi
  text: 6 पर वह सरल मन से चलता है; वह हृदय की खराई से सब कुछ देखता है। वह संसार के भ्रम से आने वाली बुरी दृष्टि को नहीं अपनाता, ताकि वह प्रभु की आज्ञाओं को विकृत रूप में न देखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητι ψυχῆς
  choice: आत्मा की सरलता में
  rationale: यह मूल पदबंध की भीतरी निष्कपटता और सरलता को बनाए रखता है तथा अगले ‘हृदय की निष्कपटता’ से अनावश्यक रूप से एकरूप नहीं करता।
- source_word: εὐθύτητι καρδίας
  choice: हृदय की निष्कपटता से
  rationale: εὐθύτης का मूल भाव सीधापन/खरापन है; आधुनिक हिन्दी में ‘निष्कपटता’ स्वाभाविक ढंग से नैतिक खरेपन को व्यक्त करती है।
- source_word: ὀφθαλμοὺς πονηρούς
  choice: बुरी दृष्टि
  rationale: शाब्दिक ‘बुरी आँखें’ की अपेक्षा यह हिन्दी में दृष्टिकोण या देखने के दूषित ढंग का अर्थ स्पष्ट रखता है, जबकि मूल रूपक भी बचा रहता है।
- source_word: ἀπὸ τῆς πλάνης τοῦ κόσμου
  choice: संसार के भ्रम से उत्पन्न
  rationale: ἀπό को यहाँ उस बुरी दृष्टि के स्रोत के रूप में समझा गया है; ‘भ्रम’ πλάνη के भटकाव और धोखे, दोनों भावों को खुला रखता है।
- source_word: διεστραμμένας
  choice: विकृत रूप में
  rationale: यह स्पष्ट करता है कि विकृति उसके देखने में है, प्रभु की आज्ञाओं में स्वभावतः नहीं।
theological_decisions:
- issue: प्रभु की आज्ञाओं और ‘विकृत’ विशेषण का संबंध
  choice: ‘आज्ञाओं को विकृत रूप में न देखे’
  alternative: ‘विकृत आज्ञाओं को न देखे’
  rationale: यूनानी वाक्य में आशय यह है कि संसार से मिली बुरी दृष्टि आज्ञाओं को टेढ़े या विकृत रूप में दिखा सकती है; अनुवाद आज्ञाओं को स्वयं विकृत बताने से बचते हुए इसी बोधगत तनाव को रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘आत्मा’, ‘हृदय’, ‘प्रभु’ और ‘आज्ञाएँ’ जैसे पारंपरिक धार्मिक शब्द मूल की छवियों और स्वर को बनाए रखने के लिए रखे गए हैं।
