  to: 6 पर वह सरल मन से चलता है; वह हृदय की खराई से सब कुछ देखता है। वह संसार के भ्रम से आने वाली बुरी दृष्टि को नहीं अपनाता, ताकि वह प्रभु की आज्ञाओं को विकृत रूप में न देखे।
