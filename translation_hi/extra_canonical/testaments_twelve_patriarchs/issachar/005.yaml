  text: V. Φυλάξατε οὖν *τέκνα μου νόμον Θεοῦ¹, καὶ *τὴν ἁπλότητα κτήσασθε², ⌜καὶ ἐν ἀκακίᾳ πορεύεσθε, μὴ περιαργαζόμενοι τοῦ³ πλησίον⁴ τὰς πράξεις. 2. Ἀλλὰ ἀγαπήσατε⁵ τὸν⁶ Κύριον καὶ τὸν πλησίον⁷· πένητα καὶ ἀσθενῆ⁸ ἐλεήσατε⁹. 3. ᶜὙποτίθετε¹⁰ τὸν νῶτον¹¹ ὑμῶν εἰς τὸ γεωργεῖν καὶ ἐργάζεσθε ἐν ἔργοις¹² ⌜καθ᾽ ἑκάστην γεωργίαν, δῶρα μετ᾽ εὐχαριστείας¹³ Κυρίῳ προσφέροντες¹⁴. 4. Ὅτι¹⁵ ἐν πρωτογεννήμασιν¹⁶ καρπῶν¹⁷ Γτῆς γῆς¹⁸¹ *εὐλογήσει ὑμᾶς¹⁹ Κύριος²⁰ Γκαθὼς εὐλόγησε²¹ πάντας τοὺς²² ἁγίους²³ ἀπὸ ᾿Αβὲλ ἕως τοῦ νῦν¹. 5. Οὐ γὰρ δέδοται ὑμῖν²⁴ ἄλλη μερὶς Γ*εἰ μὴ²⁵ *τῆς πιότητος²⁶ τῆς γῆς *ἐν πόνοις καρπῶν²⁷¹. 6. *Ὅτι καὶ²⁸ ὁ πατήρ μου²⁹ Ἰακώβ³⁰ ἐν³¹ εὐλογίαις Γτῆς³² γῆς καὶ ἀπαρχῶν³³ καρπῶν³⁴ εὐλόγησέ με. 7. Καὶ ὁ³⁵ Λευί³⁶ καὶ ὁ³⁷ Ἰούδας ἐδοξάσθησαν³⁸ παρὰ Κυρίου καὶ³⁹ ἐν υἱοῖς Ἰακώβ. Καὶ ὁ⁴⁰ Κύριος *ἐκληροδότησεν αὐτούς⁴¹¹, καὶ τῷ μὲν Λευὶ⁴² ἔδωκε *τὴν ἱερατείαν⁴³, τῷ δὲ Ἰούδᾳ⁴³ τὴν βασιλείαν. 8. *Καὶ ὑμεῖς Γοὖν¹ αὐτοῖς ὑπακούετε⁴⁴ καὶ⁴⁵ τῇ ἁπλότητι⁴⁶ τοῦ πατρὸς ὑμῶν περιπατεῖτε⁴⁷· [*τῷ δὲ⁴⁸ Γὰδ
