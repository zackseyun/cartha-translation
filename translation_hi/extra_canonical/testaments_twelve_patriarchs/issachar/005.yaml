base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005.yaml
  text: '1 Therefore[a], my children, keep the law of God, and acquire simplicity, and walk in innocence, not meddling in the deeds of your neighbor. 2 But love the Lord and your neighbor; show mercy to the poor and the weak. 3 Set your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving. 4 For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now[b]. 5 For no other portion has been given to you except the richness of the earth in the toils of its fruits. 6 For my father Jacob also blessed me with blessings of the earth and of firstfruits of produce. 7 And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord gave them their inheritance: to Levi, the priesthood; and to Judah, the kingdom. 8 Therefore obey them, and walk in the simplicity of your father[c]. [But to Gad it was given to destroy the marauding raids coming upon Israel.]'
translation:
  language: hi
  text: 1 इसलिए, मेरे बच्चो, परमेश्वर की व्यवस्था का पालन करो, सरलता को अपनाओ और निष्कपटता से चलो; अपने पड़ोसी के कामों में दखल न दो। 2 बल्कि प्रभु और अपने पड़ोसी से प्रेम करो; निर्धन और निर्बल पर दया करो। 3 खेती करने के लिए अपनी कमर कसो और हर प्रकार की खेती के काम में परिश्रम करो, धन्यवाद के साथ प्रभु को भेंट चढ़ाते हुए। 4 क्योंकि धरती की उपज की पहली उपज में प्रभु तुम्हें आशीष देगा, जैसे उसने हाबिल से लेकर अब तक सभी पवित्र जनों को आशीष दी है।[a] 5 क्योंकि धरती की उर्वरता, उसकी उपज के परिश्रम सहित, के सिवा तुम्हें कोई और भाग नहीं दिया गया है।[b] 6 मेरे पिता याकूब ने भी मुझे धरती की आशीषों और उपज की पहली उपज की आशीष दी थी। 7 लेवी और यहूदा को याकूब के पुत्रों के बीच प्रभु ने महिमा दी। प्रभु ने उन्हें उनकी विरासत दी—लेवी को याजकपद और यहूदा को राजपद। 8 इसलिए तुम उनकी आज्ञा मानो और अपने पिता की सरलता के अनुसार चलो। [पर गाद को यह दिया गया कि वह इस्राएल पर आने वाले लुटेरे दलों को नष्ट करे।][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हाबिल से लेकर अब तक सभी पवित्र जन” से संभवतः हाबिल से आरम्भ होने वाले उन उपासकों की परंपरा अभिप्रेत है जिनकी भेंट स्वीकार की गई; इसकी तुलना उत्पत्ति में पहली उपज और स्वीकार की गई भेंट के विषय से की जा सकती है।
    reason: cross_reference
  - marker: b
    text: अधिक शाब्दिक रूप से, “धरती की चिकनाई”; यह धरती की उर्वरता और भरपूर उपज का कृषि-मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: गाद के विषय में अंतिम वाक्य इस प्रसंग में असहज जान पड़ता है और संभवतः बाद में जोड़ी गई टिप्पणी या अपने मूल स्थान से हट गई पंक्ति है। फिर भी यूनानी साक्ष्य में उपस्थित होने के कारण इसका अनुवाद यहाँ दिया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: νόμον Θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: यह वाचा-संबंधी और उपदेशात्मक अर्थ को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἁπλότητα
  choice: सरलता
  rationale: ग्रंथ में प्रशंसित सीधे, अविभाजित और छलरहित जीवन के विषय को सुरक्षित रखता है; अधिक व्याख्यात्मक ‘एकनिष्ठता’ को पाठ में नहीं थोपा गया।
- source_word: ἀκακίᾳ
  choice: निष्कपटता
  rationale: दुर्भाव और छल से रहित आचरण को व्यक्त करता है तथा ‘सरलता’ के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: μὴ περιαργαζόμενοι ... τὰς πράξεις
  choice: कामों में दखल न दो
  rationale: दूसरों के आचरण या मामलों में अनावश्यक हस्तक्षेप का भाव साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐλεήσατε
  choice: दया करो
  rationale: आदेश की सक्रिय नैतिक शक्ति को संक्षिप्त और परिचित हिन्दी में रखता है।
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: अपनी कमर कसो
  rationale: शारीरिक श्रम के लिए स्वयं को लगाने की यूनानी छवि का स्वाभाविक हिन्दी मुहावरे में समतुल्य अर्थ देता है।
- source_word: γεωργεῖν / γεωργίαν
  choice: खेती करना / खेती का काम
  rationale: इस्साकार के कृषि-संबंधी प्रसंग को स्पष्ट और सामान्य पाठकों के लिए सहज रखता है।
- source_word: δῶρα ... Κυρίῳ προσφέροντες
  choice: प्रभु को भेंट चढ़ाते रहो
  rationale: δῶρα की भेंट और προσφέροντες की धार्मिक प्रस्तुति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετ᾽ εὐχαριστείας
  choice: धन्यवाद के साथ
  rationale: वाक्य के उपासना-संबंधी और कृतज्ञतापूर्ण स्वर को बनाए रखता है।
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: धरती की उपज के पहले फलों में
  rationale: पहली उपज/पहले फलों की मूल कृषि और भेंट-संबंधी भाषा को स्पष्ट रखता है।
- source_word: ἁγίους
  choice: पवित्र जनों
  rationale: यूनानी शब्द का पवित्रता-संबंधी अर्थ रखता है और ‘धर्मी’ कहकर अर्थ को संकुचित नहीं करता।
- source_word: πιότητος τῆς γῆς
  choice: धरती की उर्वरता
  rationale: शाब्दिक ‘धरती की चिकनाई’ के कृषि-मुहावरे को आधुनिक हिन्दी में अर्थपूर्ण बनाता है, जबकि पादटिप्पणी में अधिक शाब्दिक विकल्प दिया गया है।
- source_word: τὴν ἱερατείαν / τὴν βασιλείαν
  choice: याजकपद / राजपद
  rationale: दोनों संस्थागत भूमिकाओं की समानांतर रचना को संक्षिप्त और स्पष्ट रूप से बनाए रखता है।
- source_word: ἐπερχόμενα πειρατήρια
  choice: आने वाले लुटेरे दल
  rationale: स्थलीय इस्राएली प्रसंग में आक्रमणकारी लुटेरों का अर्थ देता है; समुद्री ‘डाकू’ का अनावश्यक संकेत टालता है।
theological_decisions:
- issue: ‘हाबिल से लेकर अब तक सभी पवित्र जन’ का आशय
  choice: ग्रीक ἁγίους के अनुसार ‘पवित्र जनों’ रखा गया।
  alternative: ‘सभी धर्मी जनों’ या ‘सभी संतों’
  rationale: संभवतः स्वीकार किए गए उपासकों की परंपरा अभिप्रेत है, पर अनुवाद उस व्याख्या को मूल पद के स्थान पर स्थापित नहीं करता।
- issue: पद 8 में गाद-विषयक कोष्ठकबद्ध वाक्य का पाठीय दर्जा
  choice: ग्रीक साक्ष्य में होने के कारण अनुवाद किया गया, पर वर्ग कोष्ठकों और पादटिप्पणी से उसकी प्रसंगगत असंगति दिखाई गई।
  alternative: इसे उत्तरकालीन टिप्पणी मानकर छोड़ देना, या बिना कोष्ठकों के मूल प्रवाह का पूर्ण अंग मानना
  rationale: यह लेवी और यहूदा की आज्ञा मानने के उपदेश के बाद अचानक आता है और विस्थापित पंक्ति या बाद की टिप्पणी हो सकता है; पाठीय जटिलता को छिपाने के बजाय सुरक्षित रखा गया है।
- issue: लेवी और यहूदा की भूमिकाएँ
  choice: ἱερατεία और βασιλεία को क्रमशः ‘याजकपद’ और ‘राजपद’ कहा गया।
  alternative: ‘पुरोहिताई’ और ‘राज्य’
  rationale: मूल समानांतरता को रखते हुए किसी बाद की सांप्रदायिक व्यवस्था या विशिष्ट धर्मवैज्ञानिक सिद्धांत को आयात नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। कृषि और भेंट-संबंधी शब्दावली को ठोस रखा गया है। ‘सरलता’ और ‘निष्कपटता’ की निकटता जानबूझकर सुरक्षित है, क्योंकि मूल पाठ दोनों नैतिक गुणों को साथ रखता है। पद 5 की असामान्य यूनानी रचना को पूरी तरह समतल किए बिना हिन्दी में बोधगम्य बनाया गया है।
