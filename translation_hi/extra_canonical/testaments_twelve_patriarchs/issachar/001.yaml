  language: hi
  text: '**याकूब और लिआ के पाँचवें पुत्र इस्साकार का वसीयतनामा**


    **1.** इस्साकार के वचनों की प्रति। उसने अपने पुत्रों को बुलाकर उनसे कहा, “हे मेरे बच्चो, अपने पिता इस्साकार की सुनो; उस जन के वचनों पर कान लगाओ जिसे प्रभु प्रेम करता है।


    **2.** मैं दूदाफलों की मज़दूरी के रूप में याकूब का पाँचवाँ पुत्र जन्मा।


    **3.** मेरा भाई रूबेन खेत से दूदाफल लाया था। राहेल उससे मिली और उसने वे फल ले लिए।


    **4.** तब रूबेन रोने लगा; उसकी आवाज़ सुनकर मेरी माँ लिआ बाहर आई।


    **5.** ये सुगंधित फल थे,[a] जो हारान देश में जलधारा की एक घाटी के नीचे उगते हैं।


    **6.** राहेल ने कहा, “मैं ये तुम्हें नहीं दूँगी, बल्कि सन्तानों के बदले इन्हें अपने पास रखूँगी; क्योंकि प्रभु ने मेरी ओर ध्यान नहीं दिया और मैंने याकूब के लिए कोई सन्तान नहीं जनी।”


    **7.** वे फल दो थे। लिआ ने राहेल से कहा, “क्या इतना काफ़ी नहीं कि तुमने मेरे पति को ले लिया? क्या अब ये भी मुझसे ले लोगी?”


    **8.** राहेल ने उससे कहा, “तुम्हारे पुत्र के दूदाफलों के बदले याकूब आज रात तुम्हारे साथ रहे।”


    **9.** पर लिआ ने उससे कहा, “याकूब मेरा है, क्योंकि मैं उसकी युवावस्था की पत्नी हूँ।”


    **10.** राहेल ने कहा, “घमण्ड मत करो और अपनी बड़ाई मत करो; क्योंकि वह तुमसे पहले मेरे साथ विवाह के लिए ठहराया गया था, और मेरे कारण उसने हमारे पिता की चौदह वर्ष सेवा की।


    **11.** यदि पृथ्वी पर छल इतना न बढ़ गया होता और मनुष्यों की दुष्टता इतनी न फैल गई होती, तो तुम याकूब का मुख न देख रही होती।


    **12.** लाबान ने छल से मुझे धोखा दिया और उस रात मुझे बदल दिया। उसने याकूब को मुझे देखने नहीं दिया; क्योंकि यदि मैं वहाँ होती, तो उसके साथ यह न हुआ होता।


    **13.** फिर भी, दूदाफलों के बदले मैं अपने आपको याकूब के साथ एक रात के लिए तुम्हें भाड़े पर देती हूँ।”


    **14.** राहेल ने आगे कहा, “मैं दूदाफलों में से एक ले लूँगी और उस एक के बदले आज रात अपने आपको तुम्हें भाड़े पर दूँगी।”[b]


    **15.** याकूब ने लिआ के साथ सहवास किया; वह गर्भवती हुई और उसने मुझे जन्म दिया। इस मज़दूरी के कारण मेरा नाम इस्साकार पड़ा।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “सुगंधित फल” या “सुगंधित सेब” है; यहाँ व्यापक अर्थ “फल” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: पद 14 आपूर्ति किए गए यूनानी पाठ में कोष्ठकित है, जो इसकी पाठगत स्थिति पर अनिश्चितता दर्शाता है।
    reason: textual_variant
  - marker: c
    text: यहाँ “मज़दूरी” और “इस्साकार” नाम के बीच शब्द-खेल है, जो दूदाफलों की उत्पत्ति की कथा को प्रतिध्वनित करता है।
    reason: cross_reference
lexical_decisions:
- source_word: διαθήκη
  choice: वसीयतनामा
  rationale: पितृपुरुष के अंतिम उपदेशों वाले साहित्यिक रूप को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἠγαπημένου
  choice: प्रिय जन
  rationale: निष्क्रिय अर्थ ‘प्रभु द्वारा प्रिय’ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μισθός / ἐν μισθῷ
  choice: मज़दूरी
  rationale: लेन-देन का अर्थ और इस्साकार नाम से जुड़ा शब्द-खेल दोनों यथासंभव सुरक्षित रहते हैं।
- source_word: μανδραγόροι
  choice: दूदाफल
  rationale: उत्पत्ति की कथा में प्रचलित हिन्दी बाइबलीय पौधा-नाम है; सामान्य पाठक के लिए केवल लिप्यंतरण की अपेक्षा अधिक पहचाने जाने योग्य है।
- source_word: μῆλα εὔοσμα
  choice: सुगंधित फल
  rationale: μῆλα को अनिवार्यतः ‘सेब’ मानने से बचते हुए व्यापक अर्थ और सुगंध का बोध सुरक्षित रखता है।
- source_word: ἐνωτίσασθε
  choice: कान लगाओ
  rationale: शाब्दिक श्रवण-बिम्ब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: παρεῖδε
  choice: ध्यान नहीं दिया
  rationale: राहेल की अनुभूति को सीधे व्यक्त करता है, पर इसे परमेश्वर द्वारा पूर्ण परित्याग के कठोर दावे में नहीं बदलता।
- source_word: ἡρμόσατο
  choice: विवाह के लिए ठहराया गया था
  rationale: विवाह-संबंध के लिए पहले नियोजित या वाग्दत्त होने का भाव देता है, बिना यह कहे कि विवाह पहले ही सम्पन्न हो चुका था।
- source_word: ἐκμισθῶ / ἐκμισθώσω
  choice: भाड़े पर देती हूँ / दूँगी
  rationale: राहेल और लिआ की बातचीत में उपस्थित कठोर लेन-देन की भाषा को नरम किए बिना रखता है।
- source_word: ἔγνω ... τῇ Λείᾳ
  choice: लिआ के साथ सहवास किया
  rationale: यौन संबंध के अर्थ को आधुनिक पाठक के लिए स्पष्ट करता है; हिन्दी में ‘जाना’ का शाब्दिक अनुकरण अस्पष्ट होता।
theological_decisions:
- issue: राहेल का कथन कि प्रभु ने उसकी ओर ध्यान नहीं दिया
  choice: कथन को राहेल की अपनी वाणी और दृष्टिकोण के रूप में यथावत रखा गया है।
  alternative: इसे नरम करके ‘प्रभु ने अभी तक मुझे सन्तान नहीं दी’ कहना।
  rationale: मूल पाठ में मौजूद शिकायत और धार्मिक तनाव को अनुवाद द्वारा हल नहीं किया जाना चाहिए।
- issue: इस्साकार के नाम और मज़दूरी का संबंध
  choice: मज़दूरी की संज्ञा को कथा में बार-बार रखा और पद 15 में नामकरण से स्पष्ट रूप से जोड़ा गया है।
  alternative: ‘प्रतिफल’ या ‘इनाम’ कहना।
  rationale: मूल कथा का आर्थिक और नाम-संबंधी शब्द-खेल ‘मज़दूरी’ से अधिक निकटता से व्यक्त होता है।
- issue: पाठ में पत्नियों द्वारा याकूब की रात का लेन-देन
  choice: लेन-देन की असहज भाषा को बिना नैतिक समर्थन या निन्दा जोड़े सीधे अनूदित किया गया है।
  alternative: संवाद को शिष्ट या व्याख्यात्मक बनाकर नरम करना।
  rationale: अनुवाद का काम कथानक और उसके तनाव को सुरक्षित रखना है, पात्रों के व्यवहार का धार्मिक निर्णय देना नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली और सामान्य पाठक की समझ के अनुरूप रखी गई है। संवादों की प्राचीन सामाजिक असहजता को कृत्रिम रूप से नरम नहीं किया गया। आपूर्ति किए गए यूनानी स्रोत में केवल आरम्भिक दूदाफल-वृत्तान्त उपलब्ध है; इसलिए अंग्रेज़ी परामर्श-पाठ में इसके आगे आने वाली, किन्तु यहाँ मूल-साक्ष्य से असमर्थित सामग्री को मसौदे में शामिल नहीं किया गया।
