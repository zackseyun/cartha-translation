  text: '1[a]. See then, as you see: I am one hundred and twenty-six years old, and I am not conscious of committing any sin unto death. 2. Except for my wife, I have not known another woman. I did not commit sexual immorality with wandering eyes. 3. I did not drink wine for deception[b], and I did not desire anything of my neighbor. 4. No deceit came to be in my heart, and no lie went up through my lips. 5. I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth. 6. I loved the Lord with all my strength, and likewise I loved every person with all my heart, more than my children. 7. You also, my children, do these things, and every spirit of Beliar will flee from you, and no deed of wicked people will rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who walks with people in simplicity of heart. 8. And after saying these things he commanded his sons to carry him up
    to Hebron and bury him there with his fathers in the cave. 9. And stretching out his feet, he fell asleep in a good old age, sound in every limb and strong[d][c], and slept the eternal sleep.'
translation:
  language: hi
  text: 'इस्साकार का वसीयतनामा 7


    1. अतः, जैसा तुम देख रहे हो, मैं एक सौ छब्बीस वर्ष का हूँ, और मुझे ऐसे किसी पाप का बोध नहीं है जो मृत्यु की ओर ले जाता हो।[a] 2. अपनी पत्नी के सिवा मैंने किसी दूसरी स्त्री से संबंध नहीं रखा। मैंने भटकती आँखों से व्यभिचार नहीं किया। 3. मैंने ऐसा दाखमधु नहीं पिया जो भटका दे,[b] और अपने पड़ोसी की किसी वस्तु का लालच नहीं किया। 4. मेरे हृदय में छल उत्पन्न नहीं हुआ, और मेरे होंठों से कोई झूठ नहीं निकला। 5. जो कोई पीड़ा में था, उसके साथ मैंने कराह भरी, और निर्धन के साथ अपनी रोटी बाँटी। अपने जीवन के सभी दिनों में मैंने भक्ति का आचरण किया और सत्य को थामे रखा। 6. मैंने प्रभु से प्रेम किया, और हर मनुष्य से अपने पूरे हृदय से—अपने बच्चों से भी बढ़कर—प्रेम किया। 7. मेरे बच्चो, तुम भी यही करो। तब बेलियार की हर आत्मा तुमसे भाग जाएगी, दुष्ट लोगों का कोई काम तुम पर अधिकार नहीं करेगा, और तुम हर जंगली पशु को वश में कर लोगे; तुम्हारे साथ स्वर्ग और पृथ्वी का परमेश्वर होगा, जो निष्कपट हृदय से मनुष्यों के साथ चलता है।[c]


    8. ये बातें कहने के बाद उसने अपने पुत्रों को आज्ञा दी कि वे उसे हेब्रोन ले जाएँ और वहाँ उसके पूर्वजों के साथ उसे गाड़ें। 9. फिर उसने अपने पैर सीधे किए और अच्छी वृद्धावस्था में सो गया—अनन्त नींद सो गया।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद यह भी हो सकता है, “मैंने अपने भीतर मृत्यु की ओर ले जानेवाला कोई पाप नहीं जाना।” यूनानी में “जानना” यहाँ अपने नैतिक जीवन के प्रति सजग होने के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्यांश का अर्थ “भटका देने के लिए दाखमधु” या “ऐसा दाखमधु जो विवेक भ्रष्ट कर दे” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में यह वाक्यांश परमेश्वर को मनुष्यों के साथ चलते हुए बताता है। “निष्कपट हृदय” का संबंध परमेश्वर की संगति से है या उन मनुष्यों से जिनके साथ वह चलता है, यह वाक्यांश कुछ खुला छोड़ता है।
    reason: alternative_reading
  - marker: d
    text: इस पद के कुछ पाठ-रूपों में “वह अच्छी वृद्धावस्था में मर गया” मिलता है; कुछ में उसके सभी अंगों के स्वस्थ और उसके बलवान होने का विस्तार भी जोड़ा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον
  choice: मुझे अपने भीतर ऐसे किसी पाप का बोध नहीं है जो मृत्यु की ओर ले जाता हो
  rationale: ἔγνων को आत्म-सजग नैतिक बोध के रूप में रखा गया है और εἰς θάνατον की दिशात्मक अस्पष्टता बचाई गई है; इससे पूर्ण निष्पापता का दावा आरोपित नहीं होता।
- source_word: Πλὴν τῆς συμβίου μου οὐκ ἔγνων ἄλλην
  choice: अपनी पत्नी के सिवा मैंने किसी दूसरी स्त्री से संबंध नहीं रखा
  rationale: “जानना” का यौन मुहावरा हिन्दी में शाब्दिक रखने पर अस्पष्ट होता; “संबंध रखना” आशय को स्वाभाविक और मर्यादित ढंग से व्यक्त करता है।
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: भटकती आँखों से
  rationale: यह चंचल, वासनापूर्ण दृष्टि का संक्षिप्त और सहज हिन्दी रूप है।
- source_word: οἶνον εἰς ἀποπλάνησιν
  choice: ऐसा दाखमधु ... जो भटका दे
  rationale: ἀποπλάνησις के बहकाने, भटकाने या विवेक भ्रष्ट करने के भाव को मुख्य पाठ में सरल रखा और पादटिप्पणी में विकल्प दिया गया है।
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: अपने पड़ोसी की किसी वस्तु का लालच
  rationale: वाक्यांश आज्ञा-सदृश लोभ या लालसा को दर्शाता है; यह हिन्दी में ठोस और सुबोध है।
- source_word: συνεστέναξα
  choice: उसके साथ मैंने कराह भरी
  rationale: संयुक्त क्रिया सहानुभूति से अधिक, दूसरे की पीड़ा में सहभागी होने का शारीरिक भाव व्यक्त करती है।
- source_word: Εὐσέβειαν ἐποίησα
  choice: भक्ति का आचरण किया
  rationale: εὐσέβεια की श्रद्धापूर्ण जीवन-चर्या को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Ἀλήθειαν ἐφύλαξα
  choice: सत्य को थामे रखा
  rationale: ἐφύλαξα के संभालने और निष्ठापूर्वक बनाए रखने के भाव को केवल तथ्यात्मक सत्यवादिता तक सीमित नहीं करता।
- source_word: πνεῦμα τοῦ Βελίαρ
  choice: बेलियार की ... आत्मा
  rationale: यूनानी नामरूप Βελίαρ को “बेलियार” के रूप में रखा गया है, उसे किसी बाद की परंपरा के अनुसार सामान्यीकृत नहीं किया गया।
- source_word: ὕπνον αἰώνιον
  choice: अनन्त नींद
  rationale: मृत्यु के लिए प्रयुक्त मूल रूपक को सीधे और गरिमापूर्ण ढंग से सुरक्षित रखा गया है।
theological_decisions:
- issue: इस्साकार के पाप-संबंधी दावे की सीमा
  choice: मृत्यु की ओर ले जानेवाले पाप के प्रति आत्म-बोध का दावा
  alternative: पूर्ण निष्पापता का दावा, या बाद की धर्मशास्त्रीय श्रेणी “महापाप”
  rationale: मूल पाठ दावे को εἰς θάνατον से सीमित करता है और ἔγνων आत्म-परीक्षण का स्वर रखता है; अनुवाद इस तनाव को बनाए रखता है।
- issue: सरल/निष्कपट हृदय वाले मनुष्यों के साथ चलनेवाले का कर्ता
  choice: कर्ता ‘स्वर्ग और पृथ्वी का परमेश्वर’ है
  alternative: पुत्र परमेश्वर के साथ निष्कपटता में चलते हैं
  rationale: निकटतम व्याकरणिक पूर्वपद परमेश्वर है और participle συμπορευόμενον उसी का वर्णन करता है; पादटिप्पणी अर्थगत विस्तार की गुंजाइश बताती है।
- issue: पद 6 में प्रेम का विन्यास
  choice: प्रभु और हर मनुष्य दोनों से पूरे हृदय से, बच्चों से भी बढ़कर प्रेम
  alternative: प्रभु से ‘पूरी शक्ति’ से और मनुष्य से ‘पूरे हृदय’ से प्रेम
  rationale: दिए गए यूनानी पाठ में “पूरी शक्ति” के लिए शब्द नहीं है; ἐξ ὅλης τῆς καρδίας दोनों कर्मों के साथ स्वाभाविक रूप से पढ़ा गया है।
- issue: अंतिम पद के विस्तृत पाठ
  choice: दिए गए यूनानी मुख्य पाठ का संक्षिप्त रूप मुख्य पाठ में
  alternative: सभी अंगों से स्वस्थ और बलवान होने का विस्तार
  rationale: प्रस्तुत मूल पाठ केवल अच्छी वृद्धावस्था और अनन्त नींद कहता है; विस्तृत पाठों को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, सामान्य पाठकों के लिए सहज पर गरिमापूर्ण वसीयतनामा-शैली। “दाखमधु,” “भक्ति,” “निष्कपट हृदय,” और “अनन्त नींद” जैसे पद मूल की प्राचीन धार्मिक गरिमा रखते हैं, जबकि वाक्य-विन्यास आधुनिक और स्पष्ट है। पद 8 में प्रस्तुत यूनानी मुख्य पाठ के अनुसार “गुफा” नहीं जोड़ा गया है।
