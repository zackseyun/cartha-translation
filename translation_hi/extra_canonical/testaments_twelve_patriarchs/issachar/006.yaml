  revised_text: '6 इसलिए, मेरे बच्चो, जान लो कि अंतिम समयों में तुम्हारे पुत्र सरलता को छोड़ देंगे और लोभ से जुड़ जाएंगे। वे निष्कपटता[a] को छोड़कर धूर्तता की ओर मुड़ेंगे; और प्रभु की आज्ञाओं को छोड़कर बेलियार[b] से जा मिलेंगे।


