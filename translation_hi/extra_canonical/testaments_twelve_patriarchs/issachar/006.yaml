  terminology: “सरलता,” “लोभ,” “निष्कपटता,” “धूर्तता,” “प्रभु,” “बेलियार,” “खेती करना,” और “दुष्ट योजनाएं” उपयुक्त हैं। “बेलियार” मूल यूनानी Βελίαρ के अनुरूप है। पादटिप्पणियां सही स्थानों पर हैं और उनके विकल्प मूल तथा अंग्रेज़ी audit trail के अनुरूप हैं।
