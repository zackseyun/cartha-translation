  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b]. And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will serve their enemies. Therefore you also tell these things to your children, so that, if they sin, they may return more quickly to the Lord[c], because he is merciful and will deliver them, to bring them back into their land[d].
translation:
  language: hi
  text: '6 इसलिए, मेरे बच्चो, जान लो कि अंतिम समयों में तुम्हारे पुत्र सरलता को छोड़ देंगे और लोभ से जुड़ जाएंगे। वे निष्कपटता[a] को छोड़कर धूर्तता की ओर मुड़ेंगे; और प्रभु की आज्ञाओं को छोड़कर बेलियार[b] से जा मिलेंगे।


    2 वे खेती करना छोड़कर अपनी दुष्ट योजनाओं के पीछे चलेंगे, जातियों में तितर-बितर हो जाएंगे और अपने शत्रुओं की सेवा करेंगे।


    3 इसलिए तुम भी ये बातें अपने बच्चों को बताना, ताकि यदि वे पाप करें, तो शीघ्र ही प्रभु की ओर लौट आएं[c],


    4 क्योंकि वह दयालु है और उन्हें छुड़ाएगा, ताकि उन्हें उनके देश में वापस ले आए[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कपटहीनता”; यूनानी ἀκακία केवल निर्दोष होने के बजाय छल-कपट से रहित होने पर भी बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यहां यूनानी पाठ में नाम का रूप “बेलियार” है; बहुत-से पाठक इसे “बेलियाल” नाम से जानते होंगे।
    reason: lexical_alternative
  - marker: c
    text: “प्रभु की ओर लौटना” पश्चात्ताप करने के साथ-साथ फिर से बहाल होने का भाव भी रखता है।
    reason: cross_reference
  - marker: d
    text: अंतिम वाक्यांश का अर्थ “और उन्हें उनके देश में फिर से बसाएगा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἁπλότης
  choice: सरलता
  rationale: यह इस्साकार के नियमपत्र का प्रमुख सद्गुण है और भोलेपन से अधिक निष्कपट, अविभाजित नैतिक मनोभाव को दर्शाता है; “सरलता” विषयगत शब्दावली और सामान्य बोधगम्यता दोनों बनाए रखती है।
- source_word: ἀπληστία
  choice: लोभ
  rationale: यह अतृप्त, हड़पने वाली लालसा का बोध कराता है। “लोभ” सरलता के विपरीत नैतिक दुर्गुण को स्वाभाविक और गंभीर ढंग से व्यक्त करता है।
- source_word: ἀκακία
  choice: निष्कपटता
  rationale: शब्द में दुर्भावना और छल से रहित होने का भाव है। “निष्कपटता” यूनानी की विशिष्ट बारीकी को “निर्दोषता” की अपेक्षा सीधे व्यक्त करती है; पादटिप्पणी में “कपटहीनता” दिया गया है।
- source_word: πανουργία
  choice: धूर्तता
  rationale: यह अनैतिक चतुराई और छलपूर्ण व्यवहार को सूचित करता है। “धूर्तता” निष्कपटता के साथ तीखा और स्वाभाविक विरोध बनाती है।
- source_word: κολλάω / κολληθήσονται
  choice: से जा लगेंगे / से जा मिलेंगे
  rationale: दोनों स्थानों में एक ही क्रिया का समान गत्यात्मक और निष्ठासूचक भाव रखा गया है, जबकि हिन्दी में व्यक्ति के लिए “जा मिलना” अधिक स्वाभाविक है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी साक्ष्य में उपस्थित रूप को सामान्यतः परिचित “बेलियाल” में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: γεωργεῖν
  choice: खेती करना
  rationale: यह कृषि-श्रम का ठोस उल्लेख है, जो इस्साकार के आदर्श जीवन का महत्वपूर्ण अंग है; हिन्दी में यह सीधा और सामान्य प्रयोग है।
- source_word: πονηροῖς διαβουλίοις
  choice: दुष्ट योजनाओं
  rationale: यह नैतिक रूप से भ्रष्ट विचार-विमर्श या षड्यंत्रकारी योजनाओं को दर्शाता है। “दुष्ट योजनाएं” सक्रिय योजना और नैतिक दोष दोनों व्यक्त करती हैं।
- source_word: διασπαρήσονται
  choice: तितर-बितर हो जाएंगे
  rationale: निष्क्रिय भविष्यकाल जातियों के बीच बिखराव और निर्वासन का भाव देता है; यह हिन्दी में स्पष्ट और मुहावरेदार है।
- source_word: δουλεύσουσιν
  choice: सेवा करेंगे
  rationale: क्रिया शत्रुओं की अधीनता या दासता का अर्थ रख सकती है। “अपने शत्रुओं की सेवा करेंगे” मूल की शब्दगत सीमा को बनाए रखता है, बिना अनिवार्य रूप से पूर्ण दासत्व घोषित किए।
- source_word: τάχιον
  choice: शीघ्र ही
  rationale: यूनानी तुलनात्मक क्रियाविशेषण पाप के बाद तत्पर वापसी पर बल देता है। हिन्दी में “शीघ्र ही” इस आग्रह को “अधिक शीघ्र” से अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: प्रभु की ओर लौट आएं
  rationale: यह नैतिक पश्चात्ताप और संबंध की पुनर्बहाली दोनों को व्यक्त करता है; “की ओर लौटना” दिशा और आध्यात्मिक वापसी का द्वयर्थ बनाए रखता है।
theological_decisions:
- issue: ἐν ἐσχάτοις καιροῖς का कालगत बल
  choice: अंतिम समयों में
  alternative: बाद के समयों में / अंत के समय में
  rationale: वाक्यांश भविष्य के अंतिम या उत्तरकाल को सूचित कर सकता है, पर किसी निश्चित प्रलयकालीन समय-सारणी को अनिवार्य नहीं बनाता। बहुवचन “समयों” मूल रूप को भी दर्शाता है।
- issue: τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν का संबंध
  choice: ताकि उन्हें उनके देश में वापस ले आए
  alternative: और उन्हें उनके देश में फिर से बसाएगा / जब वह उन्हें उनके देश में वापस लाएगा
  rationale: यूनानी का संक्षिप्त infinitival वाक्यांश छुटकारे का उद्देश्य या परिणाम हो सकता है। मुख्य पाठ में उद्देश्य का अर्थ रखा गया है और वैकल्पिक पुनर्बहाली-पाठ पादटिप्पणी में सुरक्षित है।
- issue: प्रभु की ओर लौटने का अर्थ
  choice: ऐसी वापसी जिसमें पश्चात्ताप और पुनर्बहाली दोनों की संभावना है
  alternative: केवल पश्चात्ताप करना / केवल भौगोलिक वापसी
  rationale: ἐπιστρέφω का धार्मिक संदर्भ नैतिक दिशा-परिवर्तन को दर्शाता है, जबकि अगले पद की देश-वापसी पुनर्बहाली का आयाम जोड़ती है; किसी एक आयाम तक अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। भविष्यवाणी-सदृश वसीयतनामा-स्वर बनाए रखने के लिए “जान लो,” “अंतिम समयों,” और क्रमिक “छोड़कर” संरचनाओं का उपयोग हुआ है। मूल की पुनरावृत्ति और नैतिक विरोधों को यथासंभव सुरक्षित रखते हुए अत्यधिक शाब्दिक या पुरातन भाषा से बचा गया है।
