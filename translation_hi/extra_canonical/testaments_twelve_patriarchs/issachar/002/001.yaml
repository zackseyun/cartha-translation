  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/001.yaml
  text: Then an angel of the Lord appeared to Jacob, saying, “Rachel will bear children, because she despised intercourse with a husband and chose self-control.”
translation:
  language: hi
  text: तब प्रभु का एक स्वर्गदूत याकूब को दिखाई दिया और उसने कहा, “राहेल बच्चे जनेगी, क्योंकि उसने किसी पुरुष के साथ यौन-संबंध को तुच्छ जाना और आत्म-संयम को चुना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: यूनानी कर्मवाच्य रूप का स्वाभाविक हिन्दी समतुल्य; प्रकट होने की दृश्य घटना को स्पष्ट रखता है।
- source_word: τέκνα τέξει
  choice: बच्चे होंगे
  rationale: वाक्य का आशय स्वाभाविक हिन्दी में व्यक्त करता है और मूल में अनिश्चित बहुवचन τέκνα के कारण बच्चों की संख्या नहीं जोड़ता।
- source_word: κατέπτυσεν
  choice: तुच्छ जाना
  rationale: शाब्दिक अर्थ ‘थूकना’ से विकसित ‘तिरस्कार करना/तुच्छ समझना’ है; प्रसंग में dignified और स्पष्ट हिन्दी।
- source_word: συνουσίαν ἀνδρός
  choice: पति के साथ यौन-संबंध
  rationale: συνουσία यहाँ दाम्पत्य संभोग को सूचित करता है; ‘संगति’ बहुत अस्पष्ट होती, जबकि यह चयन अर्थ को अनावश्यक रूप से अशिष्ट बनाए बिना स्पष्ट करता है।
- source_word: ἐγκράτειαν
  choice: आत्म-संयम
  rationale: यौन-विरति के प्रसंग में भी शब्द के व्यापक गुणार्थ को बनाए रखता है और इसे केवल किसी विशिष्ट तपस्वी सिद्धांत तक सीमित नहीं करता।
theological_decisions:
- issue: राहेल के बच्चे होने का कारण उसके दाम्पत्य-संबंध के तिरस्कार और संयम को बताया गया है
  choice: मूल का कारणसूचक कथन बिना नरम किए रखा गया
  alternative: इसे केवल अस्थायी विरति या सामान्य पवित्रता के पुरस्कार के रूप में समझाकर लिखना
  rationale: ὅτι/ἐπειδή के कारणात्मक संबंध और पाठ में उपस्थित असहज धार्मिक तनाव को अनुवादक की व्याख्या से हल नहीं किया जाना चाहिए।
- issue: संतानों की संख्या
  choice: कोई निश्चित संख्या नहीं जोड़ी गई
  alternative: ‘दो बच्चे’
  rationale: प्रस्तुत मुख्य यूनानी पाठ में τέκνα बहुवचन है, पर कोई संख्या नहीं है; संदिग्ध पाठ-परंपरा के आधार पर संख्या जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘यौन-संबंध’ सामान्य पाठक के लिए स्पष्ट है; ‘आत्म-संयम’ मूल के नैतिक गुणार्थ को सुरक्षित रखता है। λέγων को हिन्दी की स्वाभाविक कथन-रचना ‘और उसने कहा’ से व्यक्त किया गया है।
