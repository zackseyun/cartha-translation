source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. Καὶ⁹ εἰ μὴ Λεία¹⁰ ἡ μήτηρ μου ἀντὶ συνουσίας ἀπέδοτο¹¹ τὰ δύο μῆλα, [ἔτι]¹² ὀκτὼ υἱοὺς ἔμελλε¹³ τεκεῖν· διὰ τοῦτο ἓξ ἔτεκε, *καὶ Ῥαχιὴλ τέτοκε τοὺς δύο¹⁴ ὅτι ἐν *τοῖς μανδραγόροις¹⁵ ἐπεσκέψατο αὐτὴν¹⁶ ὁ¹⁷ Κύριος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/002.yaml
  text: And had Leah my mother not given over the two fruits in exchange for intercourse, she would have been about to bear eight sons; for this reason she bore six, and Rachel bore the two — because in the mandrakes the Lord visited her.
translation:
  language: hi
  text: और यदि मेरी माता लिआ ने सहवास के बदले वे दो फल न दे दिए होते, तो वह आठ पुत्रों को जन्म देनेवाली होती। इसी कारण उसने छह पुत्रों को जन्म दिया, और राहेल ने उन दो को जन्म दिया—क्योंकि दूदाफलों में[a] प्रभु ने उसकी सुधि ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दूदाफलों में’ यूनानी का शाब्दिक और असामान्य वाक्यांश है; इसका आशय दूदाफलों के कारण, उनके प्रसंग में, या उनके अवसर पर हो सकता है।
    reason: मूल पाठ की स्थानवाचक/साधनवाचक अस्पष्टता और दूदाफलों से जुड़े धार्मिक तनाव को स्पष्ट किए बिना सुरक्षित रखना।
lexical_decisions:
- source_word: συνουσίας
  choice: सहवास
  rationale: यह यौन-संबंध के अर्थ को स्पष्ट, मर्यादित और आधुनिक मानक हिन्दी में व्यक्त करता है।
- source_word: τὰ δύο μῆλα
  choice: वे दो फल
  rationale: μῆλα का सामान्य अर्थ फल या सेब हो सकता है; प्रसंग इसे दूदाफलों से जोड़ता है, पर पहले उल्लेख में स्रोत की अपेक्षाकृत सामान्य शब्दावली बनाए रखी गई है।
- source_word: ἐπεσκέψατο
  choice: सुधि ली
  rationale: यह बाइबलीय भाव में ईश्वर के कृपापूर्वक ध्यान देने और हस्तक्षेप करने का अर्थ देता है, बिना केवल ‘भेंट की’ जैसे भ्रामक शाब्दिक अर्थ तक सीमित हुए।
- source_word: ἐν τοῖς μανδραγόροις
  choice: दूदाफलों में
  rationale: ἐν की असामान्य संरचना और कथन की वास्तविक अस्पष्टता को किसी स्पष्ट कारण-संबंध में बदले बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: राहेल के गर्भधारण में दूदाफलों और प्रभु की भूमिका का संबंध
  choice: ‘क्योंकि दूदाफलों में प्रभु ने उसकी सुधि ली’ के रूप में स्रोत की तनावपूर्ण और असामान्य अभिव्यक्ति सुरक्षित रखी गई है।
  alternative: ‘दूदाफलों के कारण प्रभु ने उसे गर्भवती किया’ या ‘दूदाफलों के अवसर पर प्रभु ने उसकी सुधि ली।’
  rationale: यूनानी पाठ न तो दूदाफलों को साफ तौर पर प्रभावकारी कारण बताता है, न केवल समय अथवा अवसर; इसलिए अनुवाद इस संबंध को निर्णायक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जननेवाली थी’ प्रतिकल्पित आशय को व्यक्त करता है; ‘सुधि ली’ बाइबलीय होते हुए भी परिचित हिन्दी प्रयोग है।
