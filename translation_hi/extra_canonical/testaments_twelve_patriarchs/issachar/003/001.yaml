  text: When therefore I grew up, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers, and I brought in fruits from the fields in their season.
translation:
  language: hi
  text: इसलिए जब मैं बड़ा हुआ, मेरे बच्चो, तब मैंने निष्कपट हृदय से जीवन बिताया। मैं अपने पिता और भाइयों के लिए किसान बन गया, और खेतों से उपज उनके उचित समय पर लाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: मैं बड़ा हुआ
  rationale: संदर्भ में यह परिपक्व होने या वयस्क होने का भाव देता है; सहज आधुनिक हिन्दी में ‘बड़ा हुआ’ उपयुक्त है।
- source_word: ἐν εὐθύτητι καρδίας
  choice: सीधे मन से
  rationale: εὐθύτης नैतिक निष्कपटता और सीधाई को व्यक्त करता है; ‘सीधे मन से’ मूल के हृदय-संबंधी मुहावरे को स्वाभाविक हिन्दी में रखता है।
- source_word: γεωργὸς
  choice: खेती करने लगा
  rationale: संज्ञा ‘किसान’ संभव है, पर क्रियात्मक रूप पिता और भाइयों के लिए कृषि-कार्य करने के आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καρποὺς ἐξ ἀγρῶν
  choice: खेतों से … उपज
  rationale: यहाँ καρποί का अर्थ सामान्य फल तक सीमित नहीं, बल्कि खेतों की पैदावार है; इसलिए ‘उपज’ चुना गया।
- source_word: κατὰ καιρὸν αὐτῶν
  choice: उनकी ऋतु के अनुसार
  rationale: मूल का अर्थ प्रत्येक उपज के उचित या निर्धारित मौसम में लाना है; इस वाक्यांश से वह वितरणात्मक भाव सुरक्षित रहता है।
