  text: 6. Καὶ ἔχαιρε Γπάντοτε³⁵ ἐπὶ τῇ ἁπλότητί μου *ὁ πατήρ μου³⁶ Γδιότι³⁷ καὶ *πᾶν πρῶτον γέννημα³⁸ *διὰ τοῦ ἱερέως³⁹ τῷ⁴⁰ Κυρίῳ⁴¹ προσέφερον⁴², ἔπειτα καὶ⁴³ τῷ πατρί μου⁴⁴.
