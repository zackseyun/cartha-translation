base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/006.yaml
  text: And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father.
translation:
  language: hi
  text: और मेरे पिता मेरी सरलता पर सदा प्रसन्न होते थे, क्योंकि मैं हर प्रथमज को याजक के द्वारा प्रभु को, और फिर अपने पिता को भी, अर्पित करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητί
  choice: निष्कपटता
  rationale: यहाँ शब्द सरल, खरे और छलरहित आचरण को सूचित करता है; ‘निष्कपटता’ आधुनिक हिन्दी में इस नैतिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πᾶν πρῶτον γέννημα
  choice: हर पहिलौठे को
  rationale: यह अभिव्यक्ति प्रत्येक प्रथम जन्मे पशु या संतान के लिए प्रयुक्त व्यापक पद है; ‘हर पहिलौठा’ उसकी संक्षिप्तता और व्यापकता बनाए रखता है।
- source_word: διὰ τοῦ ἱερέως
  choice: याजक के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ माध्यम या अभिकरण दर्शाता है; औपचारिक धार्मिक संदर्भ में ‘याजक के द्वारा’ सटीक है।
- source_word: προσέφερον
  choice: अर्पित करता था
  rationale: अपूर्ण भूतकाल बार-बार किए जाने वाले आचरण को दर्शाता है, जिसे हिन्दी का ‘करता था’ सुरक्षित रखता है।
theological_decisions:
- issue: पहिलौठे को प्रभु और फिर पिता को अर्पित करने का संबंध
  choice: वाक्य का क्रम और अंतर्निहित अस्पष्टता ज्यों की त्यों रखी गई है
  alternative: इसे दशमांश, बलिदान या बचे हुए हिस्से के वितरण के रूप में स्पष्ट करना
  rationale: यूनानी पाठ केवल पहले प्रभु को याजक के द्वारा और फिर पिता को अर्पित करने की बात कहता है; वह वस्तु, अनुपात या रीति स्पष्ट नहीं करता। अनुवाद में कोई अतिरिक्त धार्मिक व्यवस्था आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘आनन्दित होते थे’ और ‘अर्पित करता था’ यूनानी अपूर्ण भूतकाल की अभ्यस्त या निरंतर क्रिया को व्यक्त करते हैं।
