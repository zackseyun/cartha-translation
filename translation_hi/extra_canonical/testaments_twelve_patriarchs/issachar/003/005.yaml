base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/005.yaml
  text: At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman's pleasure; rather, because of my toil, sleep came over me.
translation:
  language: hi
  text: पैंतीस वर्ष की आयु में मैंने अपने लिए एक पत्नी ली, क्योंकि परिश्रम मेरी शक्ति को खा रहा था और मैं स्त्री के सुख का विचार नहीं करता था; बल्कि, अपने श्रम के कारण नींद मुझ पर हावी हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κάματος
  choice: परिश्रम
  rationale: यह शब्द थकाने वाले श्रम को सूचित करता है; आधुनिक हिन्दी में ‘परिश्रम’ स्वाभाविक और गरिमापूर्ण है।
- source_word: κατήσθιε τὴν ἰσχύν μου
  choice: मेरी शक्ति को खाए जा रहा था
  rationale: यूनानी के सजीव रूपक ‘खा रहा था/क्षीण कर रहा था’ को हिन्दी में बनाए रखता है।
- source_word: ἡδονὴν γυναικός
  choice: स्त्री-सुख
  rationale: मूल में निहित स्त्री से संबंधित आनंद, सम्भवतः यौन-सुख, को संक्षिप्त रूप में रखता है और अर्थ को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: διὰ τοῦ κόπου
  choice: कठिन परिश्रम के कारण
  rationale: κόπος श्रम के साथ उससे उत्पन्न थकावट का भाव भी रखता है; ‘कठिन परिश्रम’ दोनों पहलुओं को सहजता से व्यक्त करता है।
- source_word: ὁ ὕπνος μοι περιεγένετο
  choice: मुझ पर नींद हावी हो जाती थी
  rationale: περιεγένετο के प्रबल होने या वश में कर लेने के भाव को प्राकृतिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἡδονὴν γυναικός का आशय
  choice: स्त्री-सुख
  alternative: स्त्री के साथ भोग-विलास / स्त्री से मिलने वाला यौन-सुख
  rationale: मूल पदबंध में यौन आशय सम्भावित है, पर अभिव्यक्ति कुछ हद तक परोक्ष है; इसलिए अनुवाद उसी संयमित अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मकथात्मक, संयत और गरिमापूर्ण शैली। मूल के श्रम द्वारा शक्ति को ‘खा जाने’ वाले रूपक तथा नींद के प्रबल हो जाने के भाव को स्वाभाविक हिन्दी में संरक्षित किया गया है।
