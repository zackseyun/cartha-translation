id: T12P.ISS.3.7
reference: Testament of Issachar 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. Καὶ ὁ⁴⁵ Κύριος ἐμυριοπλασίασε⁴⁶ τὰ ἀγαθὰ ⌜ἐν ταῖς χερσί⁴⁷ μου· ᾔδει δὲ καὶ Ἰακὼβ *ὁ πατήρ μου⁴⁸, ὅτι ὁ Θεὸς συνεργεῖ⁴⁸ τῇ ἁπλότητί μου⌝. *Πάντα γὰρ πένησι καὶ θλιβομένοις⁴⁹ παρεῖχον *ἐκ τῶν ἀγαθῶν τῆς γῆς⁵⁰ ἐν ἁπλότητι καρδίας μου⁵¹˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/007.yaml
  text: And the Lord multiplied the good things ten thousandfold in my hands; and Jacob my father also knew that God was working together with my simplicity. For I provided to all the poor and afflicted from the good things of the earth, in the simplicity of my heart.
translation:
  language: hi
  text: और प्रभु ने मेरे हाथों में अच्छी चीज़ें दस हज़ार गुना बढ़ा दीं। मेरे पिता याकूब भी जानते थे कि परमेश्वर मेरी निष्कपटता के साथ मिलकर काम करता है। क्योंकि मैं अपने हृदय की निष्कपटता से भूमि की अच्छी चीज़ों में से सब निर्धनों और दुःख उठाने वालों को देता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυριοπλασίασε
  choice: दस हज़ार गुना बढ़ा दिया
  rationale: क्रिया में निहित स्पष्ट संख्यात्मक अतिशयोक्ति को बनाए रखता है; इसे केवल ‘बहुत बढ़ाया’ कहने से स्रोत की प्रबलता घट जाती।
- source_word: τὰ ἀγαθὰ
  choice: भली वस्तुओं
  rationale: बहुवचन संज्ञीकृत विशेषण का व्यापक अर्थ बनाए रखता है; आगे भूमि की उपज के संदर्भ से इसका भौतिक आशय स्पष्ट होता है।
- source_word: συνεργεῖ
  choice: साथ मिलकर काम करता है
  rationale: ग्रीक क्रिया के सहयोग या साथ कार्य करने के सीधे अर्थ को सुरक्षित रखता है और कारण-संबंध को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἁπλότης
  choice: निष्कपटता
  rationale: यहाँ सरल, अविभाजित और उदार हृदय का भाव है; ‘सादगी’ आधुनिक हिन्दी में जीवन-शैली का अर्थ अधिक दे सकती है।
- source_word: πένησι καὶ θλιβομένοις
  choice: निर्धनों और दुःख उठाने वालों
  rationale: 'दोनों अलग समूहों या स्थितियों को बनाए रखता है: अभावग्रस्त और क्लेश सहने वाले।'
- source_word: ἐκ τῶν ἀγαθῶν τῆς γῆς
  choice: भूमि की अच्छी उपज में से
  rationale: कृषि-संदर्भ में स्वाभाविक हिन्दी देते हुए ‘भूमि की अच्छी वस्तुओं’ का आशय व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर और मानवीय निष्कपटता का संबंध
  choice: परमेश्वर मेरी निष्कपटता के साथ मिलकर काम करता है
  alternative: परमेश्वर मेरी निष्कपटता के कारण मेरी सहायता करता है
  rationale: συνεργεῖ τῇ ἁπλότητί μου सहयोग का संबंध व्यक्त करता है; ‘कारण’ जोड़ना पाठ में निहित संभावित धार्मिक तनाव को एकतरफ़ा हल कर देता।
- issue: प्रभु और परमेश्वर के पदनाम
  choice: दोनों को क्रमशः ‘प्रभु’ और ‘परमेश्वर’ रखा
  alternative: दोनों स्थानों पर एक ही पदनाम
  rationale: ग्रीक के Κύριος और Θεός के शब्दगत भेद को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। वाक्य-क्रम मूल यूनानी के निकट रखा गया है, पर अंतिम वाक्य को स्वाभाविक हिन्दी प्रवाह दिया गया है। उपलब्ध यूनानी पाठ में किसी पाठांतर का पूरा विवरण नहीं दिया गया, इसलिए कोई फुटनोट नहीं जोड़ा गया।
