source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. *Καὶ οὐκ εἰμὶ¹⁵ περίεργος *ἐν ταῖς πράξεσίν μου¹⁶, Γοὐδὲ φθονερὸς¹⁷ καὶ¹⁸ βάσκανος *τῷ πλησίον μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/003.yaml
  text: And I am not meddlesome in my actions, nor envious and malicious toward my neighbor.
translation:
  language: hi
  text: और मैं अपने काम-काज में दूसरों के मामलों में दखल नहीं देता, न अपने पड़ोसी से ईर्ष्या करता हूँ और न उसके प्रति दुर्भावना रखता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος ἐν ταῖς πράξεσίν μου
  choice: अपने काम-काज में दूसरों के मामलों में दखल नहीं देता
  rationale: περίεργος यहाँ अनुचित रूप से दूसरों के मामलों में पड़ने या दखल देने का भाव रखता है। स्वाभाविक हिन्दी के लिए विशेषणात्मक यूनानी रचना को क्रियात्मक रूप में व्यक्त किया गया है।
- source_word: φθονερὸς
  choice: ईर्ष्या करता
  rationale: यह शब्द किसी दूसरे की भलाई या सफलता से ईर्ष्या करने का सीधा भाव व्यक्त करता है।
- source_word: βάσκανος
  choice: दुर्भावना रखता
  rationale: βάσκανος में ईर्ष्यापूर्ण, अहित चाहने वाली या बुरी दृष्टि का भाव हो सकता है। φθονερός से इसका अंतर बनाए रखने के लिए ‘दुर्भावना’ चुना गया है।
- source_word: τῷ πλησίον μου
  choice: अपने पड़ोसी से … उसके प्रति
  rationale: πλησίον को सामान्य नैतिक अर्थ में ‘पड़ोसी’ रखा गया है; हिन्दी में दोनों जुड़े हुए भावों के संबंध को स्पष्ट और स्वाभाविक बनाने के लिए कारक-रूप अलग किए गए हैं।
theological_decisions:
- issue: φθονερὸς और βάσκανος के अर्थगत संबंध
  choice: ईर्ष्या और दुर्भावना को दो अलग किंतु संबंधित दोषों के रूप में रखा गया
  alternative: दोनों को मिलाकर केवल ‘ईर्ष्यालु और द्वेषी’ कहना
  rationale: यूनानी में दो पृथक विशेषण हैं; अनुवाद उनकी पुनरुक्ति को मिटाए बिना उनके अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी वर्तमानकाल οὐκ εἰμί के अनुरूप हिन्दी में वर्तमानकाल प्रयुक्त हुआ है।
