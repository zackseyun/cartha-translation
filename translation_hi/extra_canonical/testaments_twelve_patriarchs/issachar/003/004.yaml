review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the twofold negation and the general reference to any person. However, ‘बुराई नहीं की’ can denote doing wrong rather than speaking negatively; κατελάλησα specifically concerns adverse speech about someone.
  naturalness: The wording is generally clear, but ‘किसी व्यक्ति के जीवन की आलोचना’ is more idiomatic modern Hindi than ‘किसी मनुष्य के जीवन की निंदा’ and better matches the measured sense of ἔψεξα.
  terminology: ‘बुरा कहा’ explicitly conveys the verbal force of καταλαλέω without narrowing it to false slander. ‘आलोचना की’ renders ψέγω as criticism rather than the potentially more condemnatory ‘निंदा की’.
  issues:
  - severity: medium
    issue: The first clause does not explicitly express speech.
    rationale: ‘किसी की बुराई नहीं की’ may be understood as not harming or wronging someone. The Greek verb κατελάλησα means to speak against or speak ill of someone.
  - severity: low
    issue: ‘निंदा की’ is somewhat stronger and more condemnatory than needed for ἔψεξα.
    rationale: In this parallel construction, ‘आलोचना की’ naturally represents criticism/censure while retaining the distinction from the first clause.
  revised_text: मैंने कभी किसी के बारे में बुरा नहीं कहा, और न ही किसी व्यक्ति के जीवन की आलोचना की।
