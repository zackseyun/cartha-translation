  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी के दो समानांतर निषेधों को ‘कभी...नहीं’ तथा ‘न ही’ से स्पष्ट किया गया है; कोई पादटिप्पणी आवश्यक नहीं है।
