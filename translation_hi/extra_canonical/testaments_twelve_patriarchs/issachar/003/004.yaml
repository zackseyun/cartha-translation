  text: I never spoke ill of anyone, nor did I criticize a person's life.
translation:
  language: hi
  text: मैंने कभी किसी के बारे में बुरा नहीं कहा, और न ही किसी व्यक्ति के जीवन की आलोचना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάλησά
  choice: बुराई नहीं की
  rationale: καταλαλέω का अर्थ किसी के विरुद्ध या उसके विषय में बुरा बोलना है। ‘बुराई करना’ यहाँ स्वाभाविक आधुनिक हिन्दी में इसी वाचिक भाव को व्यक्त करता है और ‘झूठी बदनामी’ जैसा अधिक संकीर्ण अर्थ नहीं जोड़ता।
- source_word: ἔψεξα
  choice: निंदा की
  rationale: ψέγω दोष लगाने, आलोचना करने या निंदा करने को व्यक्त करता है। ‘निंदा की’ पहले खंड से अलग रहते हुए इसके स्पष्ट नकारात्मक मूल्यांकन के भाव को बनाए रखता है।
- source_word: βίον ἀνθρώπου
  choice: किसी मनुष्य के जीवन
  rationale: βίος को ‘जीवन’ और ἄνθρωπος को सामान्य मानव-संज्ञा ‘मनुष्य’ के रूप में रखा गया है; ‘जीवन-शैली’ कहना सम्भव है, पर वह मूल की अपेक्षा अधिक व्याख्यात्मक होगा।
