  text: 2. Γ*Καὶ ηὐλόγει με ὁ πατήρ μου βλέπων με¹² *ὅτι ἐν ἁπλότητι πορεύομαι¹³ *ἔμπροσθεν αὐτοῦ¹⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/002.yaml
  text: And my father blessed me, seeing that I walked in simplicity before him.
translation:
  language: hi
  text: और मेरे पिता ने मुझे आशीर्वाद दिया, क्योंकि उन्होंने देखा कि मैं उनके सामने निष्कपटता से चलता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ηὐλόγει
  choice: आशीर्वाद दिया
  rationale: यूनानी क्रिया यहाँ पिता द्वारा इस्साकार को आशीर्वाद देने की घटना व्यक्त करती है; स्वाभाविक हिन्दी में पूर्ण क्रिया उपयुक्त है।
- source_word: βλέπων
  choice: क्योंकि उन्होंने देखा कि
  rationale: सहकालिक कृदंत आशीर्वाद देने का आधार बताता है; हिन्दी में कारणसूचक उपवाक्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἁπλότητι
  choice: निष्कपटता से
  rationale: ἁπλότης यहाँ सरल, निष्कपट और अविभाजित मनोभाव का संकेत देता है; ‘निष्कपटता’ नैतिक आशय को स्पष्ट रखते हुए अनावश्यक भोलेपन का भाव नहीं जोड़ता।
- source_word: πορεύομαι
  choice: चलता हूँ
  rationale: वर्तमान रूप जीवन-आचरण के अर्थ में है; ‘चलता हूँ’ मूल रूपक को बनाए रखता है और हिन्दी धार्मिक-साहित्यिक प्रयोग में सहज है।
- source_word: ἔμπροσθεν αὐτοῦ
  choice: उनके सामने
  rationale: वाक्य में निकटतम और स्वाभाविक संदर्भ पिता है; अभिव्यक्ति मूल स्थानिक/नैतिक रूपक को सुरक्षित रखती है।
theological_decisions:
- issue: ‘उनके सामने’ में सर्वनाम का संदर्भ
  choice: पिता के संदर्भ में आदरसूचक ‘उनके’
  alternative: परमेश्वर के संदर्भ में ‘उसके’ या ‘उनके’
  rationale: व्याकरण और तत्काल संदर्भ में αὐτοῦ का सबसे सीधा पूर्वपद ‘मेरे पिता’ है। किसी निहित ईश्वरीय संदर्भ को जोड़ना मूल से आगे जाना होगा।
- issue: ἁπλότης का नैतिक स्वर
  choice: निष्कपटता
  alternative: सरलता / सादगी
  rationale: ‘निष्कपटता’ कपटहीन आचरण का भाव रखती है, जबकि ‘सरलता’ बौद्धिक सरलता और ‘सादगी’ जीवनशैली का अतिरिक्त संकेत दे सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। यूनानी पाठ की एक सतत रचना—पिता ने उसे अपने सामने निष्कपटता से चलते देखकर आशीर्वाद दिया—को बनाए रखा गया है। उपलब्ध मूल पाठ में ἐν ... ἥμην जैसी अलग क्रिया नहीं है; इसलिए नवीनतम अंग्रेज़ी संशोधन में सुझाए गए दो स्वतंत्र वाक्यों का अनुसरण नहीं किया गया।
