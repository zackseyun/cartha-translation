  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/002.yaml
  text: Then seven spirits were given against man, and these are the heads of the works of youthfulness[b].
translation:
  language: hi
  text: तब सात आत्माएँ मनुष्य के विरुद्ध दी गईं, और ये यौवन के कार्यों के प्रधान हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘यौवन के कार्यों के प्रधान’ मूल की संरचना और रूपक के निकट है। इसका अर्थ सम्भवतः यौवन से जुड़े कार्यों के प्रमुख स्रोत, आरंभिक तत्त्व, या उन्हें संचालित करने वाले तत्त्व हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष या क्रमिक संबंध दिखाता है; ‘इसलिए’ उस संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πνεύματα
  choice: आत्माएँ
  rationale: बहुवचन πνεύματα का सीधा और प्रसंगानुकूल अनुवाद; यहाँ इन्हें व्यक्तिगत या सक्रिय शक्तियों के रूप में प्रस्तुत किया गया है।
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: मनुष्य के विरुद्ध
  rationale: κατά के विरोधात्मक अर्थ को बिना नरम किए सुरक्षित रखता है और ἄνθρωπος को सामान्य मानव-संज्ञा के रूप में व्यक्त करता है।
- source_word: αἱ κεφαλαὶ
  choice: सिर
  rationale: मूल रूपक को सुरक्षित रखा गया है; इसे केवल ‘मुख्य कारण’ या ‘स्रोत’ कर देना सम्भावित अर्थ को निश्चित कर देता। असामान्य प्रयोग को पादटिप्पणी स्पष्ट करती है।
- source_word: τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: यौवन के कामों
  rationale: νεωτερισμός यहाँ युवावस्था से जुड़े आचरण या प्रवृत्तियों की ओर संकेत करता जान पड़ता है। ‘यौवन’ आधुनिक, गरिमापूर्ण और ‘नवयौवन’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: सात आत्माओं का स्वरूप
  choice: ‘आत्माएँ’ को बिना अतिरिक्त विशेषण के रखा गया
  alternative: ‘दुष्ट आत्माएँ’ या ‘भटकाने वाली आत्माएँ’
  rationale: इस वाक्य में मूल यूनानी केवल ‘सात आत्माएँ’ कहता है। उनके नैतिक स्वरूप को यहाँ स्पष्ट कर देना पाठ से अधिक व्याख्या जोड़ता।
- issue: ‘सिर’ रूपक का अर्थ
  choice: रूपक को मुख्य पाठ में बनाए रखा
  alternative: ‘प्रधान स्रोत’, ‘मूल कारण’ या ‘अगुआ’
  rationale: केφαλαί का आशय प्रमुख स्रोत, आरंभ या नियंत्रक तत्व हो सकता है, पर पाठ स्वयं इनमें से किसी एक अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-अनुकूल शैली अपनाई गई है। ‘मनुष्य के विरुद्ध’ और ‘सिर’ जैसे जानबूझकर असामान्य स्रोत-रूपों को अर्थगत तनाव तथा रूपक बनाए रखने के लिए रखा गया है; ‘सिर’ की सम्भावित व्याख्या पादटिप्पणी में दी गई है।
