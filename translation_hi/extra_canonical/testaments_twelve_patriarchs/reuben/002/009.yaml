id: T12P.REU.2.9
reference: Testament of Reuben 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο *ἔσχατόν ἐστι τῆς κτίσεως³¹ καὶ πρῶτον τῆς νεότητος, ὅτι *ἀγνοίας πεπλήρωται³², καὶ αὕτη τὸν νεώτερον³³ ὁδηγεῖ ὥσπερ³⁴ τυφλὸν ἐπὶ βόθρον καὶ ὡς κτῆνος ἐπὶ κρημνόν³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/009.yaml
  text: Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the younger man like a blind man into a pit and like an animal over a cliff.
translation:
  language: hi
  text: इसलिए यह आत्मा सृष्टि में सबसे अन्त में आती है और युवावस्था में सबसे पहले, क्योंकि यह अज्ञान से भरी हुई है। यह कम उम्र के व्यक्ति को ऐसे ले जाती है जैसे किसी अन्धे को गड्ढे में, और जैसे किसी पशु को खड़ी चट्टान की ओर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατόν ἐστι τῆς κτίσεως
  choice: सृष्टि में सबसे अन्त में आती है
  rationale: ग्रीक की क्रम-सूचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है; English POB में निहित ‘यह आत्मा’ पिछले प्रसंग से समझी जाती है।
- source_word: πρῶτον τῆς νεότητος
  choice: युवावस्था में सबसे पहले
  rationale: मूल के विरोधी समानान्तर—‘सबसे अन्त’ और ‘सबसे पहले’—को बनाए रखता है।
- source_word: ἀγνοίας πεπλήρωται
  choice: अज्ञान से भरी हुई है
  rationale: पूर्णता/भराव व्यक्त करने वाले perfect passive का सीधा और सहज अनुवाद।
- source_word: τὸν νεώτερον
  choice: कम उम्र के व्यक्ति को
  rationale: comparative νεώτερον के ‘अधिक युवा/कम उम्र’ भाव को सुरक्षित रखता है, बिना केवल पुरुष तक सीमित करने वाले अनावश्यक हिन्दी रूप के।
- source_word: ὥσπερ τυφλὸν ἐπὶ βόθρον
  choice: जैसे किसी अन्धे को गड्ढे में
  rationale: मूल उपमा और संकट की दिशा को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς κτῆνος ἐπὶ κρημνόν
  choice: जैसे किसी पशु को खड़ी चट्टान के किनारे से नीचे
  rationale: κτῆνος को सामान्य ‘पशु’ और κρημνός को गिरने योग्य खड़ी चट्टान के रूप में प्रस्तुत करता है; गति का आशय क्रिया ‘ले जाती है’ से आता है।
theological_decisions:
- issue: ‘यह आत्मा’ का कर्ता
  choice: यह आत्मा
  alternative: यह/यह प्रवृत्ति
  rationale: इस पद में αὕτη स्त्रीलिंग सर्वनाम है और निकटवर्ती प्रसंग में आत्मा का संकेत मानना English POB तथा संरचना के अनुरूप है; इसे किसी विशिष्ट दुष्टात्मा या मनोवैज्ञानिक प्रवृत्ति के रूप में अधिक स्पष्ट नहीं किया गया।
- issue: सृष्टि में अन्त और युवावस्था में प्रथम का तनाव
  choice: विरोधी समानान्तर को यथावत रखा
  alternative: व्याख्यात्मक रूप से किसी सृष्टि-क्रम या विकास-क्रम में बदलना
  rationale: मूल कथन की सम्भावित रहस्यमयता और धर्मवैचारिक तनाव को बिना सुलझाए सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘अन्त’ और ‘अन्धे’ की वर्तनी औपचारिक हिन्दी शैली के अनुरूप है। उपमाओं की तीव्रता और मूल का समानान्तर विन्यास बनाए रखा गया है।
