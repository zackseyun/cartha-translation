id: T12P.REU.2.4
reference: Testament of Reuben 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πρῶτον πνεῦμα ζωῆς, μεθ’ ἧς ἡ σύστασις¹⁶ κτίζεται. Δεύτερον πνεῦμα ὁράσεως, μεθ’ ἧς γίνεται ἐπιθυμία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/004.yaml
  text: The first is the spirit of life, with which the constitution is formed. The second is the spirit of sight, with which desire arises.
translation:
  language: hi
  text: पहली आत्मा जीवन की है, जिसके साथ गठन होता है। दूसरी आत्मा दृष्टि की है, जिसके साथ इच्छा उत्पन्न होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ζωῆς
  choice: जीवन का आत्मा
  rationale: यूनानी पद के निकट रहते हुए इस प्रसंग में गिनाए जा रहे ‘आत्माओं’ की समानांतर भाषा को बनाए रखता है।
- source_word: σύστασις
  choice: शरीर की संरचना
  rationale: σύστασις का अर्थ गठन या संरचना है; संदर्भ में स्पष्टता के लिए ‘शरीर की’ जोड़ा गया है, क्योंकि जीवन के साथ जीवित देह के गठन की बात है।
- source_word: πνεῦμα ὁράσεως
  choice: दृष्टि का आत्मा
  rationale: ὅρασις को ‘दृष्टि’ कहना देखने की क्षमता और संज्ञात्मक समानांतरता दोनों सुरक्षित रखता है।
- source_word: ἐπιθυμία
  choice: अभिलाषा
  rationale: यह शब्द इच्छा या लालसा दोनों का बोध करा सकता है; ‘अभिलाषा’ नैतिक अर्थ को अनावश्यक रूप से पहले से नकारात्मक बनाए बिना उस व्यापकता को रखता है।
- source_word: μεθ’ ἧς
  choice: जिसके साथ
  rationale: यूनानी सहचारी अभिव्यक्ति को कारणसूचक ‘जिससे’ में बदलने के बजाय उसकी वास्तविक अस्पष्टता बनाए रखी गई है।
theological_decisions:
- issue: ‘आत्मा’ का अर्थ
  choice: आत्मा
  alternative: शक्ति / प्रवृत्ति
  rationale: मूल πνεῦμα को व्याख्यात्मक रूप से किसी मनोवैज्ञानिक शक्ति या प्रवृत्ति तक सीमित नहीं किया गया; प्रसंग की प्राचीन मानव-रचना संबंधी भाषा सुरक्षित रखी गई है।
- issue: ἐπιθυμία का नैतिक स्वर
  choice: अभिलाषा
  alternative: वासना
  rationale: मूल शब्द संदर्भानुसार तटस्थ इच्छा से लेकर दोषपूर्ण लालसा तक हो सकता है; ‘वासना’ चुनने से यहाँ निहित न होने वाला नकारात्मक धार्मिक निर्णय जुड़ जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों वाक्यों की समानांतर बनावट सुरक्षित है। ‘शरीर की संरचना’ में ‘शरीर’ अर्थ-स्पष्टता के लिए जोड़ा गया है, यद्यपि यूनानी में केवल ‘संरचना/गठन’ है।
