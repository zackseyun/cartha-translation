id: T12P.REU.2.8
reference: Testament of Reuben 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ἕβδομον πνεῦμα σπορᾶς καὶ συνουσίας²⁷, μεθ’ ἧς συνέρχονται²⁸ διὰ τῆς φιληδονίας²⁹ ἁμαρτίαι³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/008.yaml
  text: The seventh is the spirit of procreation and union, through which sins come together through love of pleasure.
translation:
  language: hi
  text: सातवीं प्रजनन और सहवास की आत्मा है,[a] जिसके साथ सुख-लोलुपता के कारण पाप आ मिलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सहवास’ के लिए प्रयुक्त यूनानी शब्द का अर्थ सामान्य रूप से ‘साथ होना’ या ‘मेल’ भी हो सकता है; यहाँ ‘प्रजनन’ के साथ आने के कारण यौन-संयोग का भाव प्रमुख है।
    reason: συνουσία की वास्तविक अर्थ-व्याप्ति और संदर्भगत यौन अर्थ—दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: σπορᾶς
  choice: प्रजनन
  rationale: इस शब्द का मूल अर्थ बीज बोना है, पर यहाँ मनुष्य की प्रवृत्तियों के संदर्भ में इसका आशय संतानोत्पत्ति या प्रजनन है।
- source_word: συνουσίας
  choice: सहवास
  rationale: यह शब्द साथ होने या मेल से लेकर यौन-संबंध तक अर्थ दे सकता है। प्रजनन के साथ इसका प्रयोग होने के कारण ‘सहवास’ संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि उसकी व्यापकता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: συνέρχονται
  choice: आ मिलते हैं
  rationale: यह चयन ‘साथ आते हैं/जुड़ते हैं’ के भाव को व्यक्त करता है और पापों के इस आत्मा के साथ संबद्ध होने की यूनानी संरचना को बनाए रखता है।
- source_word: φιληδονίας
  choice: सुख-लोलुपता
  rationale: यह केवल सुख नहीं, बल्कि सुख के प्रति प्रबल आसक्ति या लालसा को सूचित करता है; ‘सुख-लोलुपता’ आधुनिक, स्पष्ट और नैतिक अर्थवत्ता वाला रूप है।
theological_decisions:
- issue: पापों और सातवीं आत्मा के संबंध का स्वरूप
  choice: ‘जिसके साथ ... पाप आ मिलते हैं’
  alternative: ‘जिसके द्वारा पाप एकत्र होते हैं’
  rationale: μεθ’ ἧς का अधिक सीधा अर्थ ‘जिसके साथ’ है। इससे पाठ की यह सूक्ष्मता बनी रहती है कि आत्मा को अनिवार्यतः पापों का सक्रिय कारण नहीं बताया गया, बल्कि सुख-लोलुपता के कारण पाप उसके साथ जुड़ते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘आत्मा’ के व्याकरणिक लिंग के अनुसार ‘सातवीं’ प्रयुक्त हुआ है।
