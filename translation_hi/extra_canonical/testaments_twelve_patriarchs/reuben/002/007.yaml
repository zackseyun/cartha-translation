base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/007.yaml
  text: The sixth is the spirit of taste, by which eating of foods and drinks comes to be, and strength is built up in it, because in foods is the basis of strength.
translation:
  language: hi
  text: छठी स्वाद की आत्मा है, जिसके द्वारा भोजन और पेय का सेवन होता है, और उसमें बल का निर्माण होता है, क्योंकि भोजन में बल का आधार है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα γεύσεως
  choice: स्वाद की आत्मा
  rationale: πνεῦμα को इस प्रसंग में ‘आत्मा’ और γεύσεως को संबंधसूचक ‘स्वाद की’ के रूप में रखा गया है, ताकि मूल की अवधारणा बनी रहे।
- source_word: βρῶσις βρωμάτων τε καὶ πομάτων
  choice: भोजन और पेय का सेवन
  rationale: शाब्दिक पुनरुक्ति से बचते हुए खाने और पीने, दोनों को समेटने वाला स्वाभाविक हिन्दी पदबंध चुना गया है।
- source_word: κτίζεται
  choice: निर्माण होता है
  rationale: क्रिया के ‘बनने/निर्मित होने’ के भाव को बनाए रखता है और शरीर में बल के विकसित होने के संदर्भ में सहज है।
- source_word: ὑπόστασις
  choice: आधार
  rationale: यहाँ शब्द बल के टिकने या उत्पन्न होने के आधार को सूचित करता है; ‘सारतत्त्व’ की अपेक्षा ‘आधार’ प्रसंग में अधिक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ἐν αὐτῷ का संदर्भ
  choice: उसमें
  alternative: उससे
  rationale: मूल में दत्तिवाचक पद का अर्थ ‘उसमें’ है और उसका व्याकरणिक संदर्भ स्वाद की आत्मा हो सकता है। ‘उससे’ कहने पर साधन का अर्थ निश्चित हो जाता, इसलिए मूल की संरचना और संभावित अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली रखी गई है। ‘छठी है’ से गणना का क्रम स्वाभाविक बनता है; वाक्य को पठनीयता के लिए दो वाक्यों में विभाजित किया गया है।
