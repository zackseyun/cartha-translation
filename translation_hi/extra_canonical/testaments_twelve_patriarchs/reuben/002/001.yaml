  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/001.yaml
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance.
translation:
  language: hi
  text: और अब, मेरे बच्चो, मेरी बात सुनो कि मैंने अपने पश्चात्ताप में छल की सात आत्माओं[a] के विषय में क्या देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भटकाव की आत्माएँ’ अथवा ‘भ्रम की आत्माएँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: मेरी सुनो
  rationale: आज्ञार्थक क्रिया और उसके संबंधसूचक सर्वनाम का स्वाभाविक तथा सीधा हिन्दी रूप।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: पितृसुलभ प्रत्यक्ष संबोधन को आधुनिक, सहज हिन्दी में सुरक्षित रखता है।
- source_word: πνευμάτων τῆς πλάνης
  choice: छल की आत्माओं
  rationale: πλάνη भटकाव, भ्रम अथवा छल का बोध करा सकता है; मुख्य पाठ में 'छल' अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है, जबकि विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: अपने पश्चात्ताप के समय
  rationale: यह वाक्यांश पश्चात्ताप की अवस्था या अवधि में हुए दर्शन को सूचित कर सकता है; 'के समय' हिन्दी में इस संबंध को स्पष्ट किए बिना स्वाभाविक बनाता है।
theological_decisions:
- issue: τὰ πνεύματα को व्यक्तिगत आत्मिक सत्ताएँ या प्रभाव मानना
  choice: आत्माओं
  alternative: प्रवृत्तियों/प्रभावों
  rationale: मूल में πνεύματα का सीधा अर्थ 'आत्माएँ' है; पाठ की आत्मिक-सत्तात्मक भाषा को रूपक में बदलकर उसकी व्याख्या नहीं की गई।
- issue: μετάνοια का अर्थ
  choice: पश्चात्ताप
  alternative: मन-परिवर्तन
  rationale: यहाँ रूबेन के नैतिक और आत्मिक पश्चात्ताप का प्रसंग है; 'पश्चात्ताप' प्रचलित, गरिमापूर्ण और स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी में पितृसुलभ, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। मूल की वाक्य-रचना को यथासंभव सुरक्षित रखते हुए हिन्दी में स्वाभाविक क्रम अपनाया गया है।
