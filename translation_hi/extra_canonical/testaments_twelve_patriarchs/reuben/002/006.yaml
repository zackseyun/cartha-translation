translation:
  language: hi
  text: पाँचवीं आत्मा वाणी की आत्मा है, जिसके द्वारा ज्ञान उत्पन्न होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέμπτον πνεῦμα
  choice: पाँचवीं ... आत्मा
  rationale: ग्रीक क्रमसूचक और πνεῦμα के मूल रूप को बनाए रखा गया है; हिन्दी में स्वाभाविक वाक्य-रचना के लिए ‘आत्मा’ को संबंधसूचक पद के बाद रखा गया है।
- source_word: λαλιᾶς
  choice: वाणी की
  rationale: λαλιά यहाँ बोलने या वाक्-क्षमता का बोध कराता है; ‘वाणी’ संक्षिप्त, dignified और संदर्भानुकूल है।
- source_word: μεθ’ ἧς
  choice: जिसके द्वारा
  rationale: साधन या माध्यम के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और स्त्रीलिंग संबंधवाचक को ‘वाणी’ से जोड़ता है।
- source_word: γίνεται γνῶσις
  choice: ज्ञान उत्पन्न होता है
  rationale: γίνεται के ‘होने में आना/उत्पन्न होना’ अर्थ को सुरक्षित रखता है; केवल ‘मिलता है’ कहने से मूल की प्रक्रिया-सूचक बारीकी घट जाती।
theological_decisions:
- issue: πνεῦμα का अर्थ
  choice: आत्मा
  alternative: शक्ति / क्षमता
  rationale: मूल पाठ में πνεῦμα है और निकट संदर्भ उपलब्ध न होने पर इसकी सत्तात्मक या कार्यात्मक अस्पष्टता को ‘आत्मा’ से सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त और गरिमापूर्ण अनुवाद। ‘वाणी की आत्मा’ मूल यूनानी संबंधसूचक संरचना को बनाए रखता है, जबकि पूरा वाक्य सामान्य पाठक के लिए सहज है।
