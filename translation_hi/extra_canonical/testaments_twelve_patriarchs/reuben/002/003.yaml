  text: And seven other spirits were given to him at creation, so that every work of man might be in them.
translation:
  language: hi
  text: और सृष्टि के समय उसे सात अन्य आत्माएँ दी गईं, ताकि मनुष्य का हर कार्य उनमें हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερα ἑπτὰ πνεύματα
  choice: सात अन्य आत्माएँ
  rationale: ἕτερα का भेदसूचक अर्थ ‘अन्य’ और πνεύματα का बहुवचन ‘आत्माएँ’ सीधे तथा स्वाभाविक रूप में रखा गया है।
- source_word: ἐδόθη αὐτῷ
  choice: उसे … दी गईं
  rationale: यूनानी कर्मवाच्य और एकवचन परोक्ष कर्म को सुरक्षित रखा गया है; निकट संदर्भ के बिना αὐτῷ के पुरुष-संदर्भ को अधिक स्पष्ट नहीं किया गया।
- source_word: ἐπὶ τῆς κτίσεως
  choice: सृष्टि के समय
  rationale: यहाँ ἐπί और संबंधकारक को कालगत अर्थ में लिया गया है, जैसा अंग्रेज़ी परामर्श-पाठ भी संकेत करता है; ‘सृष्टि पर’ आधुनिक हिन्दी में अस्वाभाविक होता।
- source_word: πᾶν ἔργον ἀνθρώπου
  choice: मनुष्य का हर कार्य
  rationale: सामूहिक एकवचन ἀνθρώπου को ‘मनुष्य’ रखा गया है और πᾶν ἔργον को स्वाभाविक हिन्दी में ‘हर कार्य’ अनूदित किया गया है।
- source_word: ἐν αὐτοῖς
  choice: उन्हीं में
  rationale: बहुवचन सर्वनाम का संबंध सात आत्माओं से स्पष्ट रखने के लिए ‘उन्हीं’ चुना गया; स्थानिक/क्षेत्रगत रूपक को व्याख्यायित किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘सात आत्माओं’ का स्वरूप
  choice: ‘आत्माएँ’ शब्द को बिना अतिरिक्त व्याख्या के रखा गया।
  alternative: ‘प्रवृत्तियाँ’, ‘शक्तियाँ’ या ‘जीवन-तत्त्व’
  rationale: πνεύματα का मूल धार्मिक-मानवशास्त्रीय तनाव बनाए रखा गया है; संदर्भ के बाहर उनका स्वरूप निश्चित करना संप्रदायगत या व्याख्यात्मक आयात होता।
- issue: मनुष्य के कार्यों का आत्माओं ‘में’ होना
  choice: ‘उन्हीं में हो’
  alternative: ‘उन्हीं के द्वारा किया जाए’ या ‘उन्हीं से उत्पन्न हो’
  rationale: ἐν की वास्तविक अस्पष्टता को कारण, साधन या उत्पत्ति के अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल यूनानी की संरचना के निकट अनुवाद। ‘आत्माएँ’ तथा ‘उन्हीं में हो’ जानबूझकर व्याख्यात्मक विस्तार के बिना रखे गए हैं।
