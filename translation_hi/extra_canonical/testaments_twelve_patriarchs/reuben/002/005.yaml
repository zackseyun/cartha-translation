  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/005.yaml
  text: The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are given for the drawing in of air and breath[c].
translation:
  language: hi
  text: तीसरी आत्मा सुनने की है, जिसके द्वारा शिक्षा होती है। चौथी आत्मा सूँघने की है, जिसके द्वारा हवा और साँस को भीतर खींचने के लिए स्वाद दिए गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सूँघने, स्वाद और हवा भीतर खींचने से संबंधित यह कथन यूनानी में कठिन है और संभव है कि इसका पाठ संक्षिप्त या अस्थिर रूप में सुरक्षित हुआ हो।
    reason: textual_variant
lexical_decisions:
- source_word: πνεῦμα ἀκοῆς
  choice: सुनने का आत्मा
  rationale: ‘आत्मा’ को बनाए रखते हुए ἀκοή को साधारण आधुनिक हिन्दी में ‘सुनना’ कहा गया है; इससे संदर्भ में गिनाए जा रहे मानवीय आत्माओं/क्षमताओं की शब्दावली बनी रहती है।
- source_word: μεθ’ ἧς γίνεται διδασκαλία
  choice: जिसके द्वारा शिक्षा मिलती है
  rationale: ग्रीक वाक्य का शाब्दिक भाव ‘जिसके साथ/द्वारा शिक्षा घटित होती है’ है। ‘शिक्षा मिलती है’ स्वाभाविक हिन्दी है और निष्क्रिय/अकर्मक अस्पष्टता को अनावश्यक रूप से नहीं खोलता।
- source_word: πνεῦμα ὀσφρήσεως
  choice: सूँघने का आत्मा
  rationale: ὄσφρησις घ्राण अथवा सूँघने की क्षमता है। ‘सूँघने’ को ‘घ्राण’ की अपेक्षा सामान्य पाठकों के लिए अधिक सहज चुना गया है।
- source_word: γεύσεις δεδομέναι
  choice: स्वाद दिए गए हैं
  rationale: δεδομέναι का प्रत्यक्ष अर्थ ‘दिए गए’ है; संशोधित अंग्रेज़ी परामर्श-पाठ की तरह इसे ‘उत्पन्न’ नहीं किया गया।
- source_word: εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: हवा और साँस भीतर खींचने के लिए
  rationale: ὁλκή में खींचने/अंदर लेने का भाव है। ἀήρ और ἀναπνοή को क्रमशः ‘हवा’ और ‘साँस’ रखा गया है, यद्यपि उनका संयोजन कठिन है।
theological_decisions:
- issue: πνεῦμα का अर्थ
  choice: आत्मा
  alternative: क्षमता / इंद्रिय
  rationale: मूल पाठ बार-बार πνεῦμα कहता है। इसे केवल शारीरिक ‘इंद्रिय’ या ‘क्षमता’ बनाना लेखक की मानव-रचना संबंधी भाषा और संभावित धार्मिक तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सूँघने’ और ‘सुनने’ जैसे बोलचाल में स्पष्ट शब्द चुने गए हैं, जबकि πνεῦμα की पुनरावृत्ति को ‘आत्मा’ के रूप में औपचारिक रूप से सुरक्षित रखा गया है। कठिन दूसरे वाक्य को अधिक अर्थपूर्ण बनाने के लिए मूल की अस्पष्टता नहीं मिटाई गई; उसे पादटिप्पणी में बताया गया है।
