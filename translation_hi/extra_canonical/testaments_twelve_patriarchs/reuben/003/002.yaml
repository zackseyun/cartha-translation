  text: With these spirits are mixed the spirits of error.
translation:
  language: hi
  text: इन आत्माओं के साथ भ्रम की आत्माएँ मिली हुई हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεύμασι / πνεύματα
  choice: आत्माओं / आत्माएँ
  rationale: दोनों स्थानों पर एक ही यूनानी शब्द πνεῦμα के रूप हैं; संदर्भ में अदृश्य प्रभावकारी आत्माओं का संकेत है, इसलिए शब्दगत संगति बनाए रखी गई है।
- source_word: συμμίγνυται
  choice: मिली हुई हैं
  rationale: क्रिया का अर्थ साथ मिलना या मिश्रित होना है। ‘मिली हुई हैं’ आधुनिक हिन्दी में स्वाभाविक है और मूल के वर्तमान अवस्था-बोध को व्यक्त करता है।
- source_word: τῆς πλάνης
  choice: भटकाव की
  rationale: πλάνη में भूल, भ्रम और पथ से भटकाने/भटकने की अर्थ-छाया है। ‘भटकाव’ इस व्यापकता को बनाए रखता है और इसे केवल बौद्धिक ‘त्रुटि’ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘भटकाव की आत्माएँ’ का स्वरूप
  choice: वाक्य को बिना अतिरिक्त व्याख्या के रखा गया है।
  alternative: ‘भ्रम में डालनेवाली आत्माएँ’ या ‘दुष्ट आत्माएँ’
  rationale: सम्बन्धकारक τῆς πλάνης को कर्तृवाचक या गुणसूचक मानकर स्पष्ट कर देना मूल की अस्पष्टता को घटाता; ‘दुष्ट’ जोड़ना मूल में उपस्थित नहीं है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘इन आत्माओं’ से पूर्ववर्ती संदर्भ का संकेत यथावत रहता है।
