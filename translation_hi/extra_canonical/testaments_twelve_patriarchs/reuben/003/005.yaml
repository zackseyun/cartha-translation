base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/005.yaml
  text: Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood, in destruction and jealousy, to forge words and hide words from his own family and household.
translation:
  language: hi
  text: 5 पाँचवीं आत्मा घमंड की है, जिससे मनुष्य डींग मारे और अपने को बड़ा समझे। छठी आत्मा झूठ की है—विनाश और ईर्ष्या में[a]—जिससे वह बातें गढ़े और अपनी बातें अपने कुटुंब और घरवालों से छिपाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ संदिग्ध है; “विनाश और ईर्ष्या में” का आस-पास के शब्दों से ठीक संबंध निश्चित नहीं है।
    reason: मुद्रित स्रोत ने इस वाक्यांश को पाठालोचनात्मक चिह्नों के बीच रखा है, इसलिए अनिश्चितता पाठक को बताना आवश्यक है।
lexical_decisions:
- source_word: ὑπερηφανείας
  choice: घमंड
  rationale: यह प्रचलित और स्वाभाविक हिन्दी शब्द अहंकारी गर्व का भाव स्पष्ट करता है।
- source_word: καυχᾶται
  choice: डींग मारे
  rationale: मध्यवाच्य क्रिया के आत्मप्रशंसात्मक भाव को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μεγαλοφρονῇ
  choice: अपने को बड़ा समझे
  rationale: शाब्दिक रूप से ‘बड़ी बातें सोचना’ अस्पष्ट होता; यह चयन स्वयं को ऊँचा मानने का आशय स्वाभाविक ढंग से रखता है।
- source_word: ψεύδους
  choice: झूठ
  rationale: ‘falsehood’ के लिए सीधा, सामान्य और संदर्भानुकूल शब्द।
- source_word: πλάττειν λόγους
  choice: बातें गढ़े
  rationale: πλάττειν के ‘बनाने/गढ़ने’ और λόγους के कथनों या बातों वाले अर्थ को संक्षिप्त एवं सहज रूप देता है।
- source_word: κρύπτειν λόγους αὐτοῦ
  choice: अपनी बातें … छिपाए
  rationale: प्रतिबिंबित हिन्दी रचना से व्यक्ति द्वारा अपनी ही कही या सोची बातें छिपाने का अर्थ व्यक्त होता है।
- source_word: γένους καὶ οἰκείων
  choice: अपने कुटुंब और घरवालों
  rationale: दोनों निकटवर्ती समूहों को अलग रखते हुए γένος को व्यापक नातेदारी और οἰκεῖοι को घर से जुड़े लोगों के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: आत्माओं और मानवीय क्रियाओं के बीच संबंध
  choice: ‘जिससे मनुष्य…’ / ‘जिससे वह…’
  alternative: ‘ताकि वह…’
  rationale: ग्रीक ἵνα उद्देश्य या परिणाम दोनों की छाया रख सकता है। हिन्दी में यह रचना आत्मा के प्रभाव को बताती है, पर यह तय नहीं करती कि वह प्रभाव नियत उद्देश्य है या परिणाम।
- issue: ἐν ἀπωλείᾳ καὶ ζήλῳ का संबंध
  choice: ‘विनाश और ईर्ष्या में’ को डैश के बीच रखना
  alternative: इसे सीधे ‘झूठ की आत्मा’ अथवा ‘बातें गढ़ने’ से जोड़ना
  rationale: स्रोत पाठ इस स्थान पर पाठालोचनात्मक रूप से संदिग्ध है; विराम-चिह्न वाक्यांश को सुरक्षित रखते हैं और उसका संबंध निर्णायक रूप से तय नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। ‘आत्मा’ की क्रमसूचक सूची और मूल वाक्य की समानांतर संरचना सुरक्षित है।
