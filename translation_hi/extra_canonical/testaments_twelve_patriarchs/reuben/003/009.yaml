  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण पितृ-संबोधन और गरिमापूर्ण उपदेशात्मक शैली। ‘बच्चो’ को संबोधन-रूप में बिना चंद्रबिंदु के लिखा गया है।
