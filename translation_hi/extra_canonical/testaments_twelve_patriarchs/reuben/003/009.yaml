  text: And now, my children, love the truth, and it will guard you. Hear the words of Reuben, your father, as I teach you.
translation:
  language: hi
  text: और अब, मेरे बच्चो, सत्य से प्रेम करो, और वह तुम्हारी रक्षा करेगा। मैं, तुम्हारा पिता रूबेन, तुम्हें शिक्षा देता हूँ; मेरी बातें सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἀλήθειαν ἀγαπᾶτε
  choice: सत्य से प्रेम करो
  rationale: यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप; ‘सत्य’ को कर्म के रूप में स्पष्ट रखता है।
- source_word: φυλάξει ὑμᾶς
  choice: वह तुम्हारी रक्षा करेगा
  rationale: φυλάσσω के ‘रक्षा/पहरा देना’ अर्थ को व्यक्त करता है और सत्य के लिए प्रयुक्त स्त्रीलिंग सर्वनाम αὕτη का हिन्दी में स्वाभाविक संदर्भ बनाए रखता है।
- source_word: Ἀκούσατε λόγους Ῥουβὴμ
  choice: रूबेन की बातें सुनो
  rationale: λόγους का प्रसंगानुकूल सामान्य हिन्दी रूप ‘बातें’ है; वक्ता के नाम को उसके वचनों से जोड़ता है।
- source_word: διδάσκω ὑμᾶς
  choice: जब मैं तुम्हें शिक्षा देता हूँ
  rationale: खंडित पांडुलिपीय शब्दक्रम के बीच अंग्रेज़ी परामर्श-पाठ के अनुरूप प्रथम पुरुष शिक्षण-क्रिया को स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: ‘सत्य’ का व्यक्तिकरण
  choice: ‘वह तुम्हारी रक्षा करेगा’ द्वारा व्यक्तिकरण को बनाए रखा
  alternative: ‘सत्य तुम्हें सुरक्षित रखेगा’
  rationale: मूल αὕτη (‘यह/वह’) सत्य की ओर लौटता है; अनुवाद इस आलंकारिक तनाव को बिना किसी अतिरिक्त धर्मवैज्ञानिक पहचान के सुरक्षित रखता है।
