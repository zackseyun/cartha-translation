revisions:
- from: 'और इस प्रकार हर युवक नष्ट हो जाता है: वह अपने मन को सत्य से अंधकारमय कर लेता है, परमेश्वर की व्यवस्था को नहीं समझता और अपने पुरखों की शिक्षा भी नहीं सुनता—ठीक वैसे ही जैसे मैंने भी अपनी युवावस्था में दुःख उठाया।'
  to: 'और इस प्रकार हर युवक नष्ट हो जाता है: वह सत्य से दूर होकर अपने मन को अंधकारमय कर लेता है, परमेश्वर की व्यवस्था को नहीं समझता और अपने पिताओं की शिक्षा भी नहीं सुनता—ठीक वैसे ही जैसे मैंने भी अपनी युवावस्था में दुःख उठाया।'
