id: T12P.REU.3.8
reference: Testament of Reuben 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 8. Καὶ οὕτως ἀπόλλυται πᾶς νεώτερος⁵⁴, πνεῦμα. σκοτίζων⁵⁵ τὸν νοῦν ⌜αὐτοῦ⌝⁵⁶ ἀπὸ τῆς ἀληθείας, καὶ μὴ α, αe, *συνιὼν ἐν⁵⁷ τῷ νόμῳ τοῦ θεοῦ⁵⁸, μήτε⁵⁹ ἀκούων⁶⁰ νουθεσίας⁶¹ πλάνη καὶ φαν- πατέρων αὐτοῦ⁶² ὡς⁶³ κἀγὼ ἔπαθον⁶⁴ ἐν τῷ νεωτερισμῷ τασία. μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/008.yaml
  text: And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.
translation:
  language: hi
  text: 'और इस प्रकार हर युवक नष्ट हो जाता है: वह सत्य से दूर होकर अपने मन को अंधकारमय कर लेता है, परमेश्वर की व्यवस्था को नहीं समझता और अपने पिताओं की शिक्षा भी नहीं सुनता—ठीक वैसे ही जैसे मैंने भी अपनी युवावस्था में दुःख उठाया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς νεώτερος
  choice: हर युवक
  rationale: νεώτερος यहाँ युवावस्था के व्यक्ति को सूचित करता है; ‘हर युवक’ मूल के सामान्य कथन को सहज आधुनिक हिन्दी में रखता है।
- source_word: σκοτίζων τὸν νοῦν αὐτοῦ ἀπὸ τῆς ἀληθείας
  choice: अपने मन को सत्य से अंधकारमय कर लेता है
  rationale: मूल के प्रकाश-अंधकार रूपक और सत्य से विमुख होने के भाव, दोनों को बनाए रखा गया है। आत्मवाचक ‘कर लेता है’ यूनानी कृदंत की कर्तृगत क्रिया को स्वाभाविक हिन्दी देता है।
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος के धार्मिक और आचरण-संबंधी अर्थ के लिए ‘व्यवस्था’ स्थापित तथा उपयुक्त हिन्दी पद है।
- source_word: νουθεσίας πατέρων αὐτοῦ
  choice: अपने पुरखों की शिक्षा
  rationale: νουθεσία में चेतावनी, समझाइश और अनुशासनात्मक शिक्षा का भाव है; ‘शिक्षा’ पठनीयता रखते हुए व्यापक अर्थ देता है। πατέρων को प्रसंगानुसार अनेक पीढ़ियों के पूर्वजों के अर्थ में ‘पुरखों’ किया गया है।
- source_word: ἔπαθον
  choice: दुःख उठाया
  rationale: πάσχω का मूल अर्थ कष्ट या बुरा परिणाम सहना है; यह अनिर्दिष्ट पीड़ा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἐν τῷ νεωτερισμῷ μου
  choice: अपनी युवावस्था में
  rationale: यहाँ पद का आशय रऊबेन की जवानी का समय है; ‘युवावस्था में’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: युवक के ‘नष्ट होने’ का स्वरूप
  choice: नष्ट हो जाता है
  alternative: विनाश को प्राप्त होता है / बिगड़ जाता है
  rationale: ἀπόλλυται की तीव्रता बनाए रखी गई है, पर इसे स्पष्टतः अनन्त दण्ड या केवल नैतिक पतन के रूप में सीमित नहीं किया गया।
- issue: ‘परमेश्वर की व्यवस्था’ का आशय
  choice: अर्थ को व्यापक रखा गया
  alternative: इसे मूसा की व्यवस्था या किसी विशिष्ट विधान के रूप में स्पष्ट करना
  rationale: मूल केवल νόμος τοῦ θεοῦ कहता है; अनुवाद किसी संप्रदायगत या ऐतिहासिक विशिष्टीकरण को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की कारणात्मक शृंखला को स्पष्ट करने के लिए द्विबिंदु और दीर्घ विराम का प्रयोग किया गया है; मूल की नैतिक तीव्रता और आत्मस्वीकृति सुरक्षित हैं।
