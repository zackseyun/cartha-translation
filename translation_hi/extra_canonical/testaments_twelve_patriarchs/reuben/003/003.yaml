source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 3. Πρῶτον¹² *τὸ τῆς πορνείας πνεῦμα¹³ ἐν τῇ φύσει¹⁴ καὶ¹⁵ *ταῖς αἰσθήσεσιν¹⁶ ἔγκειται¹⁷. *Δεύτερον πνεῦμα¹⁸ ἀπλη- στείας¹⁹ γαστρός²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/003.yaml
  text: First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of greediness of the belly.
translation:
  language: hi
  text: पहली, यौन अनैतिकता की आत्मा स्वभाव और इंद्रियों में बसी रहती है। दूसरी, पेट के लालच की आत्मा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείας
  choice: यौन अनैतिकता
  rationale: यह व्यापक और स्वाभाविक हिन्दी पद यूनानी शब्द के अवैध यौन आचरण संबंधी अर्थ को व्यक्त करता है, बिना उसे किसी एक विशिष्ट कृत्य तक सीमित किए।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ क्रमशः बताए जा रहे प्रभावकारी 'spirit' के लिए औपचारिक संगति रखी गई है; इसे केवल मनोवृत्ति कहने से मूल पाठ का व्यक्तिकृत या आत्मिक आयाम मिट सकता था।
- source_word: φύσει
  choice: मनुष्य के स्वभाव
  rationale: संदर्भ में φύσις को अधिक स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है; 'मनुष्य के' अर्थ-स्पष्टीकरण के लिए जोड़ा गया है।
- source_word: αἰσθήσεσιν
  choice: इंद्रियों
  rationale: बहुवचन यूनानी पद शरीरगत अनुभूति और संवेदन की क्षमताओं को सूचित करता है; 'इंद्रियाँ' इसका प्रचलित हिन्दी समतुल्य है।
- source_word: ἔγκειται
  choice: बसी रहती है
  rationale: यह 'अंदर स्थित/विद्यमान होना' का भाव स्वाभाविक हिन्दी में देता है और मूल के स्थायी अंतर्निवास-सदृश अर्थ को बनाए रखता है।
- source_word: ἀπληστείας γαστρός
  choice: पेट के लालच
  rationale: शाब्दिक संबंध 'पेट की अतृप्ति/लालच' का है। 'पेट का लालच' भोजन के प्रति असंयमित लोभ को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: πνεῦμα को आत्मिक सत्ता या मनोवृत्ति के रूप में समझना
  choice: आत्मा
  alternative: प्रवृत्ति / मनोवृत्ति
  rationale: मूल πνεῦμα की वास्तविक अस्पष्टता सुरक्षित रखी गई है। 'प्रवृत्ति' चुनने से पाठ का आत्मिक अर्थ पहले ही तय हो जाता।
- issue: φύσις का आशय
  choice: मनुष्य का स्वभाव
  alternative: प्रकृति / देहगत प्रकृति
  rationale: संदर्भ इसे व्यक्ति के स्वभाव से जोड़ता है, पर 'पापी स्वभाव' जैसे धर्मशास्त्रीय विस्तार को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। दूसरे वाक्य की खंड-वाक्यात्मक संरचना मूल यूनानी की संक्षिप्त सूची-शैली के अनुरूप जानबूझकर बनाए रखी गई है।
