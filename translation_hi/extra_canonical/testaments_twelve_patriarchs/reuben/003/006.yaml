source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 6. Ἔβδομον πνεῦμα *ἀδικίας, μεθ’ ἧς⁴⁰ β-g, Α, κλοπαὶ⁴¹ καὶ γρηπίσματα⁴², ἵνα ἐμπλήσει⁴³ φιληδονίαν καρδίας S ποιήσῃ. αὐτοῦ. Ἡ γὰρ ἀδικία συνεργεῖ⁴⁴ *τοῖς λοιποῖς⁴⁵ πνεύμασιν β, S¹ ὑπ- διὰ τῆς δοσοληψίας⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/006.yaml
  text: Seventh, a spirit of injustice, with thefts and acts of greed, so that it may fill the pleasures of the heart. For injustice works together with the other spirits through buying and selling.
translation:
  language: hi
  text: सातवीं, अन्याय की एक आत्मा है; उसके साथ चोरी और लालच के कृत्य होते हैं, ताकि वह हृदय की भोग-लालसा को पूरा करे। क्योंकि अन्याय लेन-देन[a] के द्वारा अन्य आत्माओं के साथ मिलकर काम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक भाव ‘देने और लेने’ का है; यहाँ इसका अर्थ व्यापारिक या अन्य प्रकार का लेन-देन भी हो सकता है।
    reason: δοσοληψία के व्यापक अर्थ और ‘खरीदने-बेचने’ तथा सामान्य ‘देने-लेने’ के बीच की वास्तविक अर्थगत गुंजाइश को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀδικίας
  choice: अन्याय
  rationale: यह शब्द नैतिक दुष्टता और अनुचित आचरण दोनों को व्यक्त करता है; प्रसंग में ‘अन्याय’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: κλοπαὶ καὶ γρηπίσματα
  choice: चोरी और लालच के काम
  rationale: κλοπαί स्पष्ट रूप से चोरियों को और दुर्लभ γρηπίσματα लोभपूर्वक हथियाने या लालची कृत्यों को सूचित करता है।
- source_word: φιληδονίαν καρδίας
  choice: हृदय की भोग-लालसा
  rationale: φιληδονία केवल सामान्य ‘आनंद’ नहीं, बल्कि सुख-भोग की चाह को दर्शाता है; ‘भोग-लालसा’ उसके नकारात्मक नैतिक अर्थ को बनाए रखता है।
- source_word: δοσοληψίας
  choice: लेन-देन
  rationale: शाब्दिक भाव ‘देना और लेना’ है और यह व्यापारिक व्यवहार तक विस्तृत हो सकता है; ‘लेन-देन’ हिन्दी में दोनों अर्थों को स्वाभाविक रूप से समेटता है।
theological_decisions:
- issue: ‘आत्मा’ को व्यक्तिगत सत्ता या प्रवृत्ति मानना
  choice: मूल पाठ की तरह ‘आत्मा’ कहा गया और उसके कर्ता-सदृश वर्णन को बनाए रखा गया।
  alternative: इसे केवल ‘अन्याय की प्रवृत्ति’ के रूप में स्पष्ट करना।
  rationale: मूल πνεῦμα की सत्तात्मक और प्रवृत्तिगत अस्पष्टता को किसी एक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भोग-लालसा’ नैतिक तीक्ष्णता को बनाए रखता है, जबकि ‘लेन-देन’ सामान्य पाठक के लिए स्पष्ट है और मूल की अर्थगत व्यापकता भी बचाता है।
