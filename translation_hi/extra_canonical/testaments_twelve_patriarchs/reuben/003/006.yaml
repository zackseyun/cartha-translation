  naturalness: The language is modern and clear. “सातवीं, अन्याय की एक आत्मा है” is more idiomatic and semantically precise in this enumerated context. “लालच के कृत्य” is slightly more concise and formal than “लालच के काम.”
  terminology: “अन्याय,” “आत्मा,” “चोरी,” “भोग-लालसा,” and “लेन-देन” are suitable. The footnote appropriately preserves the semantic range of δοσοληψία without forcing the narrower rendering “खरीदना-बेचना.”
