source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Ἐπὶ πᾶσιν δὲ¹ τούτοις ὄγδοον² πνεῦμα³ τοῦ ὕπνου ἐστί⁴, μεθ’ οὗ⁵ ἐκτίσθη⁶ ἔκστασις⁷ φύσεως καὶ εἰκὼν τοῦ θανάτου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/001.yaml
  text: And besides all these, there is an eighth spirit, the spirit of sleep, with which trance and the image of death were created.
translation:
  language: hi
  text: और इन सबके अतिरिक्त, आठवीं आत्मा नींद की आत्मा है; उसके साथ प्रकृति की तंद्रा और मृत्यु की प्रतिछवि की रचना हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ क्रम से गिनाई जा रही अमूर्त सत्ता के लिए ‘आत्मा’ मूल शब्द का सीधा और प्रसंगानुकूल रूप है।
- source_word: ὕπνου
  choice: नींद
  rationale: सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक; यहाँ निद्रा की अवस्था अभिप्रेत है।
- source_word: ἔκστασις φύσεως
  choice: स्वभाव की चेतनाशून्यता
  rationale: ἔκστασις में सामान्य अवस्था या चेतना से बाहर हो जाने का भाव है; φύσεως को बनाए रखते हुए यह वाक्यांश मूल की कठिनता और अर्थ-तनाव को यथासंभव सुरक्षित रखता है।
- source_word: εἰκὼν τοῦ θανάτου
  choice: मृत्यु की प्रतिछवि
  rationale: ‘प्रतिछवि’ εἰκών के समानता/प्रतिरूप के भाव को व्यक्त करती है और नींद को मृत्यु के सदृश दिखाने वाली भाषा बनाए रखती है।
- source_word: ἐκτίσθη
  choice: रची गईं
  rationale: सृष्टि या रचना के भाव को व्यक्त करता है; संयुक्त कर्ता के कारण हिन्दी में बहुवचन स्त्रीलिंग रूप रखा गया है।
theological_decisions:
- issue: ὄγδοον πνεῦμα की सत्ता-स्थिति
  choice: ‘आठवीं आत्मा’ के रूप में अनूदित किया गया
  alternative: ‘आठवीं प्रवृत्ति’ या ‘आठवाँ तत्व’
  rationale: मूल πνεῦμα को मनोवैज्ञानिक प्रवृत्ति बनाकर उसकी संभावित व्यक्त या आध्यात्मिक सत्ता को पहले से निर्धारित नहीं किया गया।
- issue: μεθ’ οὗ का संबंध
  choice: ‘जिसके साथ’
  alternative: ‘जिसके द्वारा’
  rationale: μετά के साहचर्य-भाव को सुरक्षित रखा गया है; इसे साधनवाचक बनाकर नींद की आत्मा को स्पष्टतः सृजनकर्ता या माध्यम नहीं ठहराया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल के असामान्य पदबंध ‘ἔκστασις φύσεως’ को अत्यधिक सरल करके केवल ‘बेहोशी’ नहीं बनाया गया, ताकि उसकी वास्तविक अस्पष्टता बनी रहे।
