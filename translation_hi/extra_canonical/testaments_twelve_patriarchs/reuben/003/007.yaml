source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '[7. Ἐπὶ⁴⁷ πᾶσι δὲ⁴⁸ τούτοις *τὸ νου, τὸ πνεῦμα⁴⁹ τοῦ ὕπνου⁵⁰ συνάπτεται⁵¹ *ὃ ἐστι⁵² *πλάνης καὶ ὄγδοον φαντασίας⁵³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/007.yaml
  text: And over all these, the spirit of sleep is joined, which is error and the eighth of fantasy.
translation:
  language: hi
  text: और इन सबके ऊपर नींद की आत्मा जुड़ी हुई है[a], जो भटकाव है और कल्पना की आठवीं [आत्मा] है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘नींद की आत्मा’ से पहले τὸ νου (शाब्दिक रूप से कुछ ऐसा जैसे ‘मन का’) पढ़ा जाता है, जो व्याकरण की दृष्टि से कठिन है। इसलिए उसे मुख्य पाठ में निश्चित अर्थ देकर अनूदित नहीं किया गया है।
    reason: τὸ νου की पाठगत/व्याकरणिक कठिनाई को स्पष्ट करना, बिना उसे निश्चित समानाधिकरण या अलग ‘आत्मा’ के रूप में प्रस्तुत किए।
  - marker: b
    text: 'यूनानी संरचना असामान्य है: शाब्दिक रूप से, “जो भटकाव है और कल्पना की आठवीं।” कोष्ठक में ‘आत्मा’ पहले आए ‘नींद की आत्मा’ से निहित है; ‘आठवीं’ किस गणना को सूचित करती है, यह इस पद में स्पष्ट नहीं है।'
    reason: ὃ ἐστι πλάνης καὶ ὄγδοον φαντασίας की अटपटी संरचना और ‘आठवीं’ की अनिर्दिष्ट गणना को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἐπὶ πᾶσι δὲ τούτοις
  choice: इन सबके साथ … भी
  rationale: यह पदबंध पहले बताए गए तत्वों के अतिरिक्त या उनके ऊपर एक और तत्व के जुड़ने का भाव देता है; सहज हिन्दी में ‘इन सबके साथ … भी’ उस संबंध को खुला रखता है।
- source_word: τὸ νου, τὸ πνεῦμα τοῦ ὕπνου
  choice: मन का आत्मा—नींद का आत्मा
  rationale: प्राप्त यूनानी पाठ का τὸ νου व्याकरण की दृष्टि से कठिन है, पर सम्भवतः ‘मन का’ संकेत करता है। अगले पदबंध को बिना विलय किए समानाधिकरण के रूप में रखा गया है।
- source_word: συνάπτεται
  choice: जुड़ जाता है
  rationale: मध्य/कर्मवाच्य रूप का मूल अर्थ ‘जुड़ना, संलग्न होना’ है।
- source_word: πλάνης
  choice: भटकाव का
  rationale: πλάνη में भ्रम, भटकाव या त्रुटि का अर्थ हो सकता है; ‘भटकाव’ नैतिक और बौद्धिक दोनों आयामों को अनिर्णीत रखता है।
- source_word: ὄγδοον φαντασίας
  choice: कल्पना का आठवाँ [आत्मा]
  rationale: ὄγδοον नपुंसकलिंग है और निहित πνεῦμα से मेल खा सकता है। असामान्य संबंधकारक φαντασίας को सुधारकर कोई अधिक स्पष्ट अर्थ थोपने के बजाय यथासम्भव संरक्षित किया गया है।
theological_decisions:
- issue: ‘आठवाँ’ किसकी गणना में है और πλάνης तथा φαντασίας का उससे क्या संबंध है
  choice: वह भटकाव का है और कल्पना का आठवाँ [आत्मा] है
  alternative: वह भटकाव और कल्पना का आठवाँ आत्मा है
  rationale: यूनानी में ὃ ἐστι के बाद πλάνης और फिर καὶ ὄγδοον φαντασίας आता है। चुना गया पाठ इस अटपटी संरचना और उसके तनाव को बनाए रखता है, जबकि विकल्प दोनों संबंधकारकों को सहज बनाकर एक ही संयुक्त विशेषण बना देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘आत्मा’ को πνεῦμα के लिए लगातार रखा गया है; कोष्ठक निहित संज्ञा को चिह्नित करता है और पादटिप्पणियाँ पाठगत कठिनाई को स्पष्ट करती हैं।
