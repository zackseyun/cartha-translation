translation:
  language: hi
  text: किसी स्त्री के रूप पर ध्यान मत दो; न किसी विवाहित स्त्री के साथ मेल-जोल रखो, और न स्त्रियों के कामों में ताक-झाँक करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε ὄψει γυναικείᾳ
  choice: किसी स्त्री के रूप पर ध्यान मत लगाओ
  rationale: προσέχω के ‘ध्यान देना/मन लगाना’ और ὄψις के ‘रूप/दिखावट’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है; यह केवल अनायास देखने के बजाय ध्यान टिकाने की चेतावनी देता है।
- source_word: συνδιάζετε μετὰ θηλείας ὑπάνδρου
  choice: किसी विवाहित स्त्री के साथ मेल-जोल रखो
  rationale: συνδιάζω साथ रहने या निकट संगति रखने का भाव देता है, जबकि ὕπανδρος स्पष्टतः पति वाली अर्थात विवाहित स्त्री को सूचित करता है। ‘मेल-जोल रखना’ मूल की निकट संगति को व्यक्त करता है, पर उससे अधिक विशिष्ट अनैतिक संबंध का अर्थ आरोपित नहीं करता।
- source_word: περιεργάζεσθε πρᾶξιν γυναικῶν
  choice: स्त्रियों के कामों में ताक-झाँक करो
  rationale: περιεργάζομαι अनावश्यक जिज्ञासा से छानबीन या दखल देने का भाव रखता है और πρᾶξις काम, व्यवहार या गतिविधि को दर्शाता है। ‘ताक-झाँक’ इस नकारात्मक जिज्ञासा को सहज आधुनिक हिन्दी में पकड़ता है।
