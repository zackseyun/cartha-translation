revisions:
- from: तीसरा, जिगर और पित्त में लड़ाई का आत्मा। चौथा, दिखावे और जादू-टोने का आत्मा, ताकि व्यर्थ की चेष्टाओं से कोई सुंदर दिखाई दे।
  to: तीसरा, जिगर और पित्त में लड़ने की आत्मा। चौथा, आत्म-प्रदर्शन और जादू-टोने की आत्मा, ताकि अत्यधिक दखलंदाज़ी से कोई आकर्षक दिखाई दे।
  rationale: The revision corrects the unnatural genitive construction, sharpens the renderings of ἀρεσκεία and περιεργεία in line with the supplied English audit trail, and renders ὡραῖος as “आकर्षक,” while preserving the terse enumerative form and the source’s ambiguity about “spirit.”
  reviewer_model: gpt-5.6-terra
