  text: Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive.
translation:
  language: hi
  text: तीसरा, जिगर और पित्त में लड़ने की आत्मा। चौथा, आत्म-प्रदर्शन और जादू-टोने की आत्मा, ताकि अत्यधिक दखलंदाज़ी से कोई आकर्षक दिखाई दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα μάχης
  choice: लड़ाई का आत्मा
  rationale: μάχη संघर्ष या लड़ाई को सूचित करता है; गिनाई जा रही ‘आत्माओं’ की संरचना बनाए रखने के लिए अपेक्षाकृत औपचारिक अनुवाद रखा गया है।
- source_word: ἥπατι ... χόλῃ
  choice: जिगर और पित्त में
  rationale: दोनों शारीरिक स्थलों को मूल के अनुसार स्पष्ट और सामान्य आधुनिक हिन्दी शब्दों में रखा गया है।
- source_word: ἀρεσκείας
  choice: दिखावे
  rationale: इस प्रसंग में शब्द दूसरों को प्रसन्न करने, प्रभाव जमाने या स्वयं को आकर्षक रूप में प्रस्तुत करने की प्रवृत्ति बताता है; ‘दिखावा’ सहज हिन्दी में इस भाव को संक्षेप में व्यक्त करता है।
- source_word: μαγγανείας
  choice: जादू-टोने
  rationale: शब्द जादुई युक्तियों या टोने के अर्थ में है; सामान्य पाठक के लिए ‘जादू-टोना’ स्वाभाविक और स्पष्ट है।
- source_word: διὰ περιεργείας
  choice: व्यर्थ की चेष्टाओं से
  rationale: περιεργία अनावश्यक, अनुचित या अतिशय गतिविधि/युक्ति का अस्पष्ट भाव रखता है। ‘व्यर्थ की चेष्टाएँ’ उस नकारात्मक अर्थ को रखती हैं, बिना इसे केवल ‘दखलंदाजी’ तक सीमित किए।
- source_word: ὡραῖος ὀφθῇ
  choice: सुंदर दिखाई दे
  rationale: दिखने या प्रतीत होने का निष्क्रिय भाव और बाहरी आकर्षण दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: ‘आत्मा’ का तात्पर्य
  choice: ‘आत्मा’ शब्द को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘प्रवृत्ति’ या ‘दुष्ट आत्मा’
  rationale: πνεῦμα वास्तविक आत्मिक सत्ता या व्यक्ति के भीतर कार्यरत प्रवृत्ति—दोनों अर्थों की संभावना छोड़ता है; पाठ स्वयं यहाँ इसे स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी। मूल की क्रमिक सूची तथा शारीरिक-नैतिक बिंब सुरक्षित रखे गए हैं।
