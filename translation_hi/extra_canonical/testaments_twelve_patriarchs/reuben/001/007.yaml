id: T12P.REU.1.7
reference: Testament of Reuben 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 7. *Λέγω δὲ ὑμῖν⁴⁷ ὅτι *ἔπληξέ με⁴⁸ *πληγῇ μεγάλῃ⁴⁹ *ἐπὶ τῆς λαγόνος⁵⁰ μου ἕως⁵¹ μῆνας⁵² ἑπτά· καὶ εἰ μὴ *ὁ πατήρ μου Ἰακὼβ⁵³ προσηύξατο⁵⁴ *περὶ ἐμοῦ πρὸς Κύριον⁵⁵ ἤθελε⁵⁶ Κύριος⁵⁷ ἀνελεῖν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/007.yaml
  text: And I tell you that he struck me with a severe blow on my loins for seven months; and if my father Jacob had not prayed to the Lord for me, the Lord would have destroyed me.
translation:
  language: hi
  text: और मैं तुमसे कहता हूँ कि उसने मेरी कमर पर मुझे एक बड़ी चोट पहुँचाई, जो सात महीने तक रही; और यदि मेरे पिता याकूब ने मेरे लिए प्रभु से प्रार्थना न की होती, तो प्रभु मुझे मार डालता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπληξέ με πληγῇ μεγάλῃ
  choice: उसने ... ऐसा भारी प्रहार किया
  rationale: सजातीय क्रिया-संज्ञा के बल को स्वाभाविक हिन्दी में ‘भारी प्रहार’ द्वारा व्यक्त किया गया है।
- source_word: ἐπὶ τῆς λαγόνος μου
  choice: मेरी कमर पर
  rationale: λαγών शरीर के पार्श्व, कमर अथवा कटि-प्रदेश को सूचित कर सकता है; ‘कमर’ सामान्य आधुनिक हिन्दी में सहज है और अनावश्यक शारीरिक विशिष्टता नहीं जोड़ता।
- source_word: ἕως μῆνας ἑπτά
  choice: सात महीने तक ... पीड़ित रहा
  rationale: ग्रीक का शाब्दिक विन्यास ‘सात महीनों तक’ प्रहार की दशा या प्रभाव की अवधि बताता है; हिन्दी में अवधि को स्पष्ट और स्वाभाविक बनाने के लिए निहित निरंतर पीड़ा व्यक्त की गई है।
- source_word: προσηύξατο περὶ ἐμοῦ πρὸς Κύριον
  choice: मेरे लिए प्रभु से प्रार्थना की
  rationale: περὶ ἐμοῦ को ‘मेरे लिए’ और πρὸς Κύριον को प्रार्थना के लक्ष्य ‘प्रभु से’ के रूप में स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ἤθελε Κύριος ἀνελεῖν με
  choice: प्रभु मुझे नष्ट कर देता
  rationale: ἤθελε + infinitive यहाँ संभावित परिणाम का मुहावरेदार विन्यास है; ‘नष्ट कर देता’ प्रतिकल्पित शर्त के साथ सहज हिन्दी देता है।
theological_decisions:
- issue: प्रहार करने वाले का कर्ता
  choice: ‘उसने’ को बनाए रखा गया
  alternative: स्पष्ट रूप से ‘प्रभु ने’ कहना
  rationale: इस पद में कर्ता केवल पूर्वसंदर्भित τρίतीय पुरुष है; यद्यपि आगे ‘प्रभु’ आता है, पद स्वयं पहले सर्वनाम को स्पष्ट संज्ञा से नहीं बदलता।
- issue: ἤθελε में इच्छा और संभावित परिणाम का संबंध
  choice: ‘प्रभु मुझे नष्ट कर देता’
  alternative: ‘प्रभु मुझे नष्ट करना चाहता था’
  rationale: शर्त-वाक्य में यह परिणाम को मुहावरेदार ढंग से व्यक्त करता है। ‘चाहता था’ इच्छा पर ऐसा जोर डाल सकता है जो प्रसंग में अपेक्षित नहीं, जबकि ग्रीक की अंतर्निहित इच्छात्मक छाया को पूर्णतः सिद्धान्तगत कथन में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कटि’ की अपेक्षा ‘कमर’ चुना गया। ‘ऐसा ... कि’ रचना सात महीने की अवधि को स्वाभाविक रूप से प्रहार के प्रभाव से जोड़ती है।
