  text: और वह उठकर उन्हें चूमा और उनसे कहा, “मेरे भाइयों और मेरे पुत्रों, सुनो! अपने पिता रूबेन की बात ध्यान देकर सुनो, जो मैं तुम्हें आज्ञा देता हूँ।”
