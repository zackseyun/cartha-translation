lexical_decisions:
- source_word: ἀναστάς
  choice: उठकर
  rationale: यह यूनानी कृदन्त की क्रिया और उसके बाद की मुख्य क्रिया के स्वाभाविक हिन्दी संबंध को व्यक्त करता है।
- source_word: κατεφίλησεν
  choice: चूमा
  rationale: यह स्नेहपूर्ण चुम्बन को सहज आधुनिक हिन्दी में व्यक्त करता है; संदर्भ में अनावश्यक भावात्मक विस्तार नहीं जोड़ा गया।
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: प्रत्यक्ष बहुवचन आज्ञार्थक को संक्षिप्त और स्वाभाविक रूप में रखा गया है।
- source_word: ἐνωτίσασθε
  choice: ध्यान से सुनो
  rationale: यह दूसरे श्रवण-संबंधी आज्ञार्थक का बल बनाए रखता है और पहले ‘सुनो’ की निरर्थक पुनरावृत्ति जैसा सुनाई नहीं देता।
- source_word: ἐντέλλομαι
  choice: आज्ञा देता है
  rationale: यह केवल सलाह नहीं, बल्कि अधिकारपूर्वक दिए गए निर्देश का भाव व्यक्त करता है।
