review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders γάρ, the age statement, τὸ πονηρόν as a non-specific ‘बुराई,’ and ἐνώπιον Κυρίου. Its final clause conveys life-threatening weakness without asserting death. A small revision better reflects the passive event in ἐμαλακίσθην and the force of ἕως θανάτου.
  naturalness: ‘मरने पर था’ is understandable, but is somewhat less idiomatic and less formally suited to this register. ‘मृत्यु के निकट तक निर्बल रहा’ is clear modern standard Hindi and preserves the sense of extreme weakness.
  terminology: ‘प्रभु,’ ‘बुराई,’ and ‘निर्बल’ are appropriate, neutral, and consistent with a dignified modern Hindi scripture register. No doctrinal specification is introduced.
  issues:
  - severity: low
    issue: The phrase ‘इतना दुर्बल रहा कि मरने पर था’ is slightly colloquial/awkward in this register.
    rationale: The Greek states that he was weakened ‘unto death,’ rather than using a direct expression for being on the verge of dying. Recasting it with ‘मृत्यु के निकट तक’ is more idiomatic while retaining the nonfatal, life-threatening sense.
  revised_text: क्योंकि मैं तीस वर्ष का था जब मैंने प्रभु के सामने बुराई की, और मैं सात महीनों तक मृत्यु के निकट तक निर्बल रहा।
