  text: 8. Ἤμην γὰρ⁵⁸ ἐτῶν τριάκοντα ὅτε ἔπραξα τὸ πονηρὸν ἐνώπιον Κυρίου⁵⁹. καὶ ἐμαλακίσθην *μῆνας ἑπτὰ⁶⁰ ἕως θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/008.yaml
  text: For I was thirty years old when I did evil before the Lord, and for seven months I was weakened to the point of death.
translation:
  language: hi
  text: क्योंकि मैं तीस वर्ष का था जब मैंने प्रभु के सामने बुराई की, और मैं सात महीनों तक मृत्यु के निकट तक निर्बल रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πονηρόν
  choice: बुराई
  rationale: संज्ञात्मक यूनानी पद का स्वाभाविक और सटीक हिन्दी रूप; किसी अधिक विशिष्ट पाप को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐνώπιον Κυρίου
  choice: प्रभु के सामने
  rationale: स्थानात्मक रूपक और नैतिक उत्तरदायित्व—दोनों को बनाए रखता है।
- source_word: ἐμαλακίσθην
  choice: मैं ... दुर्बल रहा
  rationale: यहाँ क्रिया शारीरिक निर्बलता या रोगग्रस्त दशा बताती है; प्रसंग के अनुसार सहज हिन्दी।
- source_word: ἕως θανάτου
  choice: इतना ... कि मरने पर था
  rationale: मृत्यु तक पहुँचाने वाली अत्यधिक दुर्बलता का स्वाभाविक हिन्दी निरूपण, बिना यह कहे कि वास्तव में मृत्यु हुई।
theological_decisions:
- issue: τὸ πονηρόν में उल्लिखित अपराध की विशिष्टता
  choice: सामान्य रूप से ‘बुराई’
  alternative: ‘वह बुरा काम’
  rationale: यूनानी पद इस वाक्य में अपराध को नाम नहीं देता; अनुवाद में उसकी प्रकृति को अधिक विशिष्ट बनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। कारणसूचक γάρ के लिए ‘क्योंकि’ रखा गया है और दोनों उपवाक्यों का निकट संबंध बनाए रखा गया है।
