translation:
  language: hi
  text: और इसके बाद मैंने अपने मन में दृढ़ निश्चय करके सात वर्ष तक प्रभु के सामने पश्चाताप किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: इसके बाद
  rationale: यूनानी कालसूचक वाक्यांश का सहज और सीधा हिन्दी रूप।
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: अपनी आत्मा के दृढ़ संकल्प के साथ
  rationale: προαίρεσις यहाँ सोचा-समझा निश्चय या संकल्प व्यक्त करता है; यह रूप आंतरिक इच्छाशक्ति और प्रतिबद्धता दोनों को बनाए रखता है।
- source_word: ἑπτὰ ἔτη
  choice: सात वर्ष तक
  rationale: अवधि को स्वाभाविक हिन्दी में स्पष्ट करता है; पश्चाताप की क्रिया सात वर्षों तक चली।
- source_word: μετενόησα
  choice: मैंने ... पश्चाताप किया
  rationale: μετανοέω का मानक धार्मिक तथा नैतिक अर्थ बनाए रखता है, जिसमें मन और आचरण के परिवर्तन का भाव है।
- source_word: ἐνώπιον Κυρίου
  choice: प्रभु के सामने
  rationale: ईश्वर की उपस्थिति और उत्तरदायित्व के भाव को सीधे रूप में सुरक्षित रखता है।
theological_decisions:
- issue: पश्चाताप की अवधि और प्रकृति
  choice: सात वर्ष तक ... पश्चाताप किया
  alternative: सात वर्ष बाद पश्चाताप किया
  rationale: यूनानी में कालावधि का द्वितीया रूप ἑπτὰ ἔτη क्रिया की निरंतर अवधि बताता है, न कि सात वर्षों के बाद घटित एक क्षणिक कार्य।
- issue: प्रभु के साथ संबंधसूचक अभिव्यक्ति
  choice: प्रभु के सामने
  alternative: प्रभु के प्रति
  rationale: ἐνώπιον का स्थानिक-धार्मिक रूपक ईश्वरीय उपस्थिति में किए गए पश्चाताप को दर्शाता है; इसे ‘के प्रति’ करने से मूल बिंब कम हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। ‘आत्मा के दृढ़ संकल्प’ से मूल की कुछ औपचारिकता बचती है, जबकि वाक्य सामान्य पाठक के लिए स्पष्ट रहता है।
