lexical_decisions:
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह शब्द किसी लिखित दस्तावेज़ की नकल या प्रति को दर्शाता है; ‘प्रतिलिपि’ आधुनिक और सटीक हिन्दी है।
- source_word: διαθήκης
  choice: वसीयत
  rationale: इस साहित्यिक संदर्भ में यह मृत्यु से पहले दी गई अंतिम शिक्षाओं और आदेशों के दस्तावेज़ का शीर्षक है; ‘वसीयत’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἐνετείλατο
  choice: आदेश ... दिए
  rationale: क्रिया का मूल अर्थ किसी को निर्देश या आज्ञा देना है; बहुवचन ‘आदेश’ ὅσα की व्यापकता को सहज हिन्दी में व्यक्त करता है।
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: मरने से पहले
  rationale: यूनानी काल-संबंधी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: अपने जीवन के एक सौ पच्चीसवें वर्ष में
  rationale: क्रमवाचक अभिव्यक्ति को औपचारिक अर्थ बनाए रखते हुए स्पष्ट आधुनिक हिन्दी में प्रस्तुत किया गया है।
