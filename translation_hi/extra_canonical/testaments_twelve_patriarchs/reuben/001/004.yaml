  text: Then, seeing Judah and Gad and Asher there, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am passing away.”
translation:
  language: hi
  text: तब वहाँ अपने भाइयों यहूदा, गाद और आशेर को देखकर उसने उनसे कहा, “मुझे उठाओ, ताकि मैं अपने भाइयों और अपने बच्चों को वे बातें बता दूँ जो मेरे हृदय में छिपी हैं; क्योंकि देखो, अब मैं विदा हो रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδών
  choice: देखकर
  rationale: मूल यूनानी का परिस्थितिसूचक कृदन्त है; हिन्दी में ‘देखकर’ स्वाभाविक रूप से मुख्य कथन की पृष्ठभूमि बताता है।
- source_word: Ἀναστήσατέ με
  choice: मुझे उठाकर बैठाओ
  rationale: मृत्युशय्या के प्रसंग में केवल ‘उठाओ’ अस्पष्ट हो सकता है; वाक्य का आशय उसे बोलने के लिए सहारा देकर बैठाने का है।
- source_word: τέκνοις
  choice: बच्चों
  rationale: वंशजों या संतानों की अपेक्षा यहाँ निकट पारिवारिक संबोधन के लिए सहज आधुनिक हिन्दी।
- source_word: ἐν τῇ καρδίᾳ μου κρυπτά
  choice: जो मेरे हृदय में छिपी हैं
  rationale: ‘हृदय’ मूल रूपक को बनाए रखता है और अनकही भीतरी बातों का स्वाभाविक हिन्दी संकेत देता है।
- source_word: ἐκλείπω
  choice: विदा हो रहा हूँ
  rationale: क्रिया का मूल भाव समाप्त होने या चूक जाने का है; मृत्युशय्या के संदर्भ में यह मृत्यु की ओर बढ़ने को गरिमापूर्ण और स्पष्ट ढंग से व्यक्त करता है, बिना अधिक चिकित्सकीय अर्थ जोड़े।
theological_decisions:
- issue: ἐκλείπω में मृत्यु का संकेत
  choice: अब मैं विदा हो रहा हूँ
  alternative: अब मेरा अंत हो रहा है / अब मैं प्राण छोड़ रहा हूँ
  rationale: संदर्भ मृत्यु का है, पर यूनानी क्रिया सीधे ‘मरना’ नहीं कहती। चुना हुआ रूप मृत्यु का संकेत स्पष्ट रखता है और मूल की अप्रत्यक्षता भी कुछ हद तक बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और मौखिक रूप से सुबोध रखी गई है। नामों के प्रचलित बाइबलीय हिन्दी रूप ‘यहूदा, गाद और आशेर’ अपनाए गए हैं।
