  text: And he said to them, “My children, behold, I am dying and going the way of my fathers.”
translation:
  language: hi
  text: और उसने उनसे कहा, “मेरे बच्चों, देखो, मैं मर रहा हूँ और अपने पूर्वजों की राह पर जा रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन में ‘संतानो’ की अपेक्षा यह आधुनिक, स्वाभाविक और आत्मीय हिन्दी है; बहुवचन संबोधन के कारण ‘बच्चो’ रूप रखा गया है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले यूनानी उद्गार का सीधा और सहज हिन्दी समतुल्य।
- source_word: ἀποθνήσκω
  choice: मैं मरने वाला हूँ
  rationale: वर्तमान रूप यहाँ निकट आती मृत्यु को व्यक्त करता है; यह हिन्दी में ‘मैं मर रहा हूँ’ की संभावित भ्रामक तात्कालिकता से बचते हुए आशय सुरक्षित रखता है।
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: अपने पूर्वजों की राह पर जा रहा हूँ
  rationale: मृत्यु के लिए प्रयुक्त रूपक को बनाए रखा गया है। ‘πατέρων’ को इस प्रसंग में व्यापक वंशगत अर्थ के कारण ‘पूर्वजों’ अनूदित किया गया है।
theological_decisions:
- issue: ‘अपने पूर्वजों की राह’ रूपक का अर्थ
  choice: रूपक को ज्यों का त्यों बनाए रखा
  alternative: ‘अपने पूर्वजों के पास जा रहा हूँ’ या केवल ‘मरने वाला हूँ’
  rationale: मूल यूनानी मृत्यु के गंतव्य की स्पष्ट व्याख्या नहीं करता, बल्कि पूर्वजों की राह पर जाने की छवि देता है; इसलिए संभावित परलोक-संबंधी अर्थ को न तो बढ़ाया गया, न मिटाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक संबोधन के अनुकूल रखी गई है। ‘देखो’ और ‘राह’ मूल की जीवंतता बनाए रखते हैं।
