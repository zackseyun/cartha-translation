base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/006.yaml
  text: And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was swept away and defiled the bed of my father Jacob.
translation:
  language: hi
  text: और देखो, आज मैं स्वर्ग के परमेश्वर को तुम्हारे विरुद्ध साक्षी ठहराता हूँ कि तुम जवानी की अज्ञानता और यौन अनैतिकता में न चलो; उसी में मैं बह गया था और मैंने अपने पिता याकूब की शय्या को अशुद्ध किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν τοῦ οὐρανοῦ
  choice: मैं स्वर्ग के परमेश्वर को तुम्हारे विरुद्ध साक्षी ठहराता हूँ
  rationale: ἐπιμαρτύρομαι के गंभीर न्यायिक-साक्ष्य भाव और ὑμῖν के संदर्भगत चेतावनी-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πορευθῆτε
  choice: चलो
  rationale: ‘चलना’ नैतिक जीवन-पद्धति के रूपक को सुरक्षित रखता है।
- source_word: ἀγνοίᾳ νεότητος
  choice: जवानी की अज्ञानता
  rationale: ग्रीक संबंध की अस्पष्टता को बिना ‘जवानी से उपजी’ जैसे कारणात्मक विस्तार के बनाए रखता है।
- source_word: πορνείᾳ
  choice: व्यभिचार
  rationale: यहाँ यौन अनैतिकता के गंभीर और प्रसंगानुकूल अर्थ के लिए सामान्य, गरिमापूर्ण हिन्दी शब्द।
- source_word: ἐξεχύθην
  choice: मैं बह गया था
  rationale: शाब्दिक ‘उंडेला गया’ अस्वाभाविक होगा; ‘बह गया’ मूल के बहाव/नियंत्रण खोने के चित्र को बनाए रखता है और अंग्रेज़ी परामर्श-पाठ के ‘swept away’ से मेल खाता है।
- source_word: ἐμίανα κοίτην
  choice: मैंने ... शय्या को अशुद्ध किया था
  rationale: μιαίνω के अपवित्र/दूषित करने के अर्थ और κοίτη के शय्या-संबंधी रूपक को स्पष्ट तथा गरिमापूर्ण ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर को साक्षी ठहराने का स्वर
  choice: ‘तुम्हारे विरुद्ध साक्षी’
  alternative: ‘तुम्हारे सामने साक्षी’
  rationale: संदर्भ चेतावनी और जवाबदेही का है; अंग्रेज़ी audited layer भी ‘against you’ पढ़ती है, यद्यपि ग्रीक सर्वनाम अपने आप में कुछ संक्षिप्त है।
- issue: ἐξεχύθην में स्वेच्छा बनाम बहा ले जाए जाने का तनाव
  choice: ‘मैं बह गया था’
  alternative: ‘मैंने अपने आपको उंडेल दिया था’
  rationale: मध्य/निष्क्रिय रूप और प्रसंगगत पतन दोनों को रखते हुए यह अनिवार्य रूप से पूर्ण असहायता या पूर्ण स्वेच्छा तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, पितृसुलभ चेतावनी का स्वर। ‘शय्या’ जानबूझकर गरिमापूर्ण और बाइबलीय है, जबकि वाक्यरचना सामान्य पाठक के लिए सरल रखी गई है।
