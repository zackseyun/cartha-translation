translation:
  language: hi
  text: अपने भाई यूसुफ की मृत्यु के दो वर्ष बाद, जब रूबेन बीमार पड़ गया, तब उसके पुत्र और उसके पोते उससे मिलने के लिए इकट्ठे हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς
  choice: मृत्यु के दो वर्ष बाद
  rationale: काल-संबंध को आधुनिक और स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀρρωστήσαντος Ῥουβήμ
  choice: जब रूबेन बीमार पड़ गया
  rationale: ग्रीक संबंधवाचक कृदंत की समयसूचक भूमिका को सहज हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: उसके पुत्र और उसके पोते
  rationale: शाब्दिक 'उसके पुत्रों के पुत्र' के अर्थ को संक्षिप्त, स्वाभाविक और समानार्थी हिन्दी 'उसके पोते' से व्यक्त किया गया है; संदर्भ में सर्वनाम रूबेन की ओर संकेत करता है।
- source_word: ἐπισκέψασθαι αὐτόν
  choice: उससे मिलने के लिए
  rationale: बीमारी के प्रसंग में क्रिया का आशय किसी का हाल जानने के लिए भेंट करना है; 'मिलने' साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: मध्य/निष्क्रिय रूप को यहाँ अकर्मक अर्थ में स्वाभाविक रूप से प्रस्तुत किया गया है।
