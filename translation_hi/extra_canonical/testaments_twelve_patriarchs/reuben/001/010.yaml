- from: और मैंने न दाखमधु पिया, न कोई मादक पेय; न मांस मेरे मुँह में गया, और न मैंने मनचाही रोटी खाई। बल्कि मैं अपने पाप के कारण शोक करता रहा, क्योंकि वह बहुत बड़ा था—वैसा पाप इस्राएल में कभी नहीं हुआ था।
  to: और मैंने न तो दाखरस पिया, न मादक पेय; न मांस मेरे मुँह में गया, न मैंने मनचाही रोटी खाई; बल्कि मैं अपने पाप पर शोक करता रहा, क्योंकि वह बहुत बड़ा था—इस्राएल में ऐसा कभी नहीं हुआ था।
