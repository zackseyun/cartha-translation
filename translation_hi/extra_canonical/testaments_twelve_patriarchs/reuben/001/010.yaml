id: T12P.REU.1.10
reference: Testament of Reuben 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 10. Καὶ⁶⁴ οἶνον καὶ σίκερα οὐκ ἔπιον, καὶ κρέας⁶⁵ οὐκ εἰσῆλθεν *ἐν τῷ στόματί⁶⁶ μου· καὶ πᾶν⁶⁷ ἄρτον ἐπι- θυμίας⁶⁸ οὐκ ἔφαγον⁶⁹ *ἀλλ᾽ ἤμην⁷⁰ πενθῶν ἐπὶ τῇ ἁμαρτίᾳ μου⁷¹, μεγάλη γὰρ ἦν, *οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/010.yaml
  text: And I drank no wine or strong drink, and no meat entered my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great, such as had not happened in Israel.
translation:
  language: hi
  text: और मैंने न तो दाखरस पिया, न मादक पेय; न मांस मेरे मुँह में गया, न मैंने मनचाही रोटी खाई; बल्कि मैं अपने पाप पर शोक करता रहा, क्योंकि वह बहुत बड़ा था—इस्राएल में ऐसा कभी नहीं हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον
  choice: दाखमधु
  rationale: यह οἶνος का स्पष्ट और गरिमापूर्ण हिन्दी रूप है तथा अगले व्यापक पद ‘मादक पेय’ से इसका भेद बनाए रखता है।
- source_word: σίκερα
  choice: मादक पेय
  rationale: σίκερα अंगूरी दाखमधु से अलग नशीले पेय को सूचित करता है; ‘मादक पेय’ आधुनिक पाठक के लिए स्वाभाविक व्यापक पद है।
- source_word: κρέας
  choice: मांस
  rationale: स्रोत के सामान्य अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἄρτον ἐπιθυμίας
  choice: मनचाही रोटी
  rationale: शाब्दिक ‘अभिलाषा की रोटी’ हिन्दी में अस्वाभाविक है; यह चयन वांछनीय या रुचिकर भोजन का भाव रखते हुए ‘रोटी’ को भी सुरक्षित रखता है।
- source_word: πενθῶν
  choice: शोक करता रहा
  rationale: वर्तमान कृदन्त की चलती हुई शोकावस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως
  choice: वैसा पाप इस्राएल में कभी नहीं हुआ था
  rationale: तुलनात्मक भाव को स्पष्ट हिन्दी में प्रस्तुत करता है; संदर्भ में पूर्वपद ‘पाप’ ही निहित तुलना का विषय है।
theological_decisions:
- issue: अंतिम उपवाक्य में निहित संदर्भ
  choice: ‘वैसा पाप’ कहकर ἁμαρτίᾳ को स्पष्ट किया गया
  alternative: ‘वैसा इस्राएल में कभी नहीं हुआ था’
  rationale: यूनानी में तुलना का विषय संदर्भ से मिलता है। हिन्दी में केवल ‘वैसा’ अस्पष्ट और अस्वाभाविक होता; ‘पाप’ की पुनरुक्ति अर्थ को नहीं बदलती और कथन की तीव्रता बनाए रखती है।
- issue: ἐπιθυμίας का नैतिक अर्थ
  choice: इसे भोजन की चाह या रुचि के अर्थ में ‘मनचाही’ रखा गया
  alternative: ‘वासना की रोटी’ अथवा ‘स्वादिष्ट रोटी’
  rationale: यहाँ तपस्या और उपवास का प्रसंग है; शब्द को यौन या अनिवार्यतः पापपूर्ण ‘वासना’ मानना अनुचित होगा, जबकि ‘स्वादिष्ट’ स्रोत की अपेक्षा अर्थ को अधिक सीमित कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण आत्मस्वीकृतिपरक शैली। समानांतर निषेधों को ‘न…न…’ द्वारा बनाए रखा गया है और अंतिम कथन की गंभीरता के लिए दीर्घ विराम प्रयुक्त है।
