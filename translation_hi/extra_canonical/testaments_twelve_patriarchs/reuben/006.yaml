  text: '1. Guard yourselves, therefore, from sexual immorality, and be keeping your mind pure. Guard also your senses from every woman. 2. And command the women likewise not to associate closely with men, so that they too may keep their minds pure. 3. For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a ruinous disgrace of Beliar and an everlasting reproach. 4. For sexual immorality has within itself neither understanding nor reverence for God, and every jealousy dwells in its desire. 5. Therefore I say to you: you will be jealous of the sons of Levi, and you will seek to exalt yourselves above them, but you will not prevail because of this. 6. For God will execute their vengeance, but you will die an evil death. 7. For to Levi God gave the priesthood, and to Judah with him the kingdom. 8. And do not be lifted up against these two, from whom the Lord will bring to completion what is to be spoken. 9. I adjure you
    by the God of heaven, that each of you practice truth toward his neighbor and that each have love toward his brother. 10. And draw near to Levi in humility of heart, so that you may receive a blessing from his mouth. 11. For he will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. And bow down to his seed, because for your sake it will die in visible and invisible wars, and among you there will be an everlasting king.'
translation:
  language: hi
  text: '1. इसलिए यौन अनैतिकता से अपनी रक्षा करो और अपने मन को शुद्ध रखो। अपनी इंद्रियों को भी हर स्त्री से बचाए रखो। 2. और स्त्रियों को भी यह आज्ञा दो कि वे पुरुषों के साथ घनिष्ठ मेल-जोल न रखें, ताकि वे भी अपने मन को शुद्ध रखें। 3. क्योंकि बार-बार मिलना-जुलना—भले ही अधर्म का काम न किया जाए—फिर भी उनके लिए एक असाध्य रोग है, और हमारे लिए बेलियार[b] की ओर से विनाशकारी लज्जा और सदा का कलंक। 4. क्योंकि यौन अनैतिकता में न समझ होती है, न परमेश्वर के प्रति भक्ति; और उसकी लालसा में हर प्रकार की ईर्ष्या वास करती है। 5. इसलिए मैं तुमसे कहता हूँ: तुम लेवी के पुत्रों से ईर्ष्या करोगे और अपने आपको उनसे ऊँचा उठाना चाहोगे, पर इसी कारण तुम सफल नहीं होगे। 6. क्योंकि परमेश्वर उनकी ओर से बदला लेगा, पर तुम बुरी मृत्यु मरोगे। 7. क्योंकि परमेश्वर ने लेवी को याजकपद और उसके साथ यहूदा को राजपद दिया। 8. इन दोनों के विरुद्ध घमंड से मत उठो; इन्हीं के द्वारा प्रभु वह बात पूरी करेगा जो कही जानी है।[a] 9. मैं तुम्हें स्वर्ग के परमेश्वर की शपथ दिलाता हूँ कि तुममें से हर एक अपने पड़ोसी के साथ सच्चाई से व्यवहार करे[c] और
    हर एक अपने भाई से प्रेम रखे। 10. और हृदय की नम्रता के साथ लेवी के निकट आओ, ताकि उसके मुख से आशीष पाओ। 11. क्योंकि वह इस्राएल और यहूदा को आशीष देगा; इसलिए कि प्रभु ने उसी में सब लोगों के सामने राज्य करने को चुना। 12. और उसके वंशज के आगे झुको[d], क्योंकि वह तुम्हारे लिए दिखाई देनेवाले और न दिखाई देनेवाले युद्धों में मरेगा; और तुम्हारे बीच एक अनन्त राजा होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 7–8 उपलब्ध यूनानी साक्ष्य में पाठगत रूप से कठिन हैं। अनुवाद संभावित अर्थ प्रस्तुत करता है कि लेवी को याजकपद और यहूदा को राजपद दिया गया, और दोनों वंशों का विरोध न करने की चेतावनी दी गई है।
    reason: textual_variant
  - marker: b
    text: ‘बेलियार’ यहाँ यूनानी नाम-रूप के अनुसार है; कुछ पाठक इसे ‘बेलियाल’ नाम से जानते होंगे।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘अपने पड़ोसी के प्रति सत्य करना’—अर्थात केवल सच बोलना नहीं, बल्कि सत्यनिष्ठा और विश्वासयोग्यता से व्यवहार करना।
    reason: lexical_alternative
  - marker: d
    text: ‘उसके वंशज के आगे झुको’ का अर्थ किसी वंशज या वंश-परंपरा के प्रति अधीनता अथवा सम्मान प्रकट करना भी हो सकता है; यह अभिव्यक्ति अपने आप में दिव्य आराधना को आवश्यक नहीं ठहराती।
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξατε
  choice: अपनी रक्षा करो / बचाए रखो
  rationale: आज्ञार्थक क्रिया सतर्कता और व्यक्तिगत उत्तरदायित्व दोनों व्यक्त करती है; हिन्दी में प्रसंगानुसार दोनों स्वाभाविक रूप प्रयुक्त किए गए हैं।
- source_word: πορνεία
  choice: व्यभिचार
  rationale: यहाँ व्यापक अवैध यौन आचरण का बोध है; आधुनिक हिन्दी में ‘व्यभिचार’ गरिमापूर्ण और परिचित धार्मिक-नैतिक शब्द है, यद्यपि इसका अर्थ केवल वैवाहिक बेवफाई तक सीमित नहीं समझा जाना चाहिए।
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: अपने मन को शुद्ध रखो
  rationale: διάνοια विचार और आंतरिक मनोवृत्ति का संकेत देता है; यह पदबंध हिन्दी में नैतिक आंतरिक शुद्धता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αἰσθήσεις
  choice: इंद्रियों
  rationale: यह देहगत अनुभूति और इच्छा के प्रवेश-द्वारों को दर्शाता है; ‘इंद्रियाँ’ इसका सामान्य और सटीक हिन्दी समतुल्य है।
- source_word: συνδιάζειν
  choice: घनिष्ठ मेल-जोल रखना
  rationale: शब्द निकट और निरंतर संगति को सूचित करता है, स्वयं यौन कृत्य को नहीं; इसलिए अनावश्यक रूप से अर्थ तीखा नहीं किया गया।
- source_word: συνεχεῖς συντυχίαι
  choice: बार-बार मिलना-जुलना
  rationale: यह लगातार या बारंबार संपर्क के संचयी प्रभाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀσέβημα
  choice: अधर्म का काम
  rationale: मूल में कृत्य की ईश्वर-विरोधी नैतिक प्रकृति है; ‘अधर्म का काम’ साधारण पाठक के लिए स्पष्ट है।
- source_word: νόσος ἀνίατος
  choice: असाध्य रोग
  rationale: मूल के रोग-रूपक को संक्षिप्त और सजीव रूप में सुरक्षित रखता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी रूप Βελίαρ का लिप्यंतरण किया गया है; अधिक परिचित ‘बेलियाल’ से सामंजस्य नहीं बैठाया गया।
- source_word: σύνεσιν
  choice: समझ
  rationale: नैतिक और बौद्धिक विवेक दोनों का सरल हिन्दी बोध देता है।
- source_word: εὐσέβειαν
  choice: परमेश्वर के प्रति भक्ति
  rationale: शब्द की ईश्वराभिमुख श्रद्धा और धार्मिक निष्ठा स्पष्ट होती है, बिना किसी संप्रदायगत अर्थ के।
- source_word: ζῆλος / ζηλώσετε
  choice: ईर्ष्या / ईर्ष्या करोगे
  rationale: लेवी के पुत्रों के प्रति प्रतिद्वंद्विता नकारात्मक है; यहाँ ‘जोश’ या ‘उत्साह’ उपयुक्त नहीं होगा।
- source_word: ποιεῖν ἀλήθειαν
  choice: सच्चाई से व्यवहार करना
  rationale: शाब्दिक ‘सत्य करना’ हिन्दी में अस्वाभाविक है; मुहावरे का अर्थ सत्यनिष्ठ और विश्वासयोग्य आचरण करना है।
- source_word: προσκυνήσατε
  choice: आगे झुको
  rationale: यह सम्मान या अधीनता की मुद्रा हो सकती है; ‘आराधना करो’ कहने से संदर्भ में अनावश्यक रूप से दिव्य उपासना निश्चित हो जाती।
- source_word: σπέρμα
  choice: वंशज
  rationale: एक सामूहिक वंश-रेखा या किसी प्रतिनिधि वंशज—दोनों की संभावना खुली रहती है; अगली एकवचन क्रिया के कारण हिन्दी में एकवचन रखा गया।
theological_decisions:
- issue: पद 7–8 का पाठगत रूप से कठिन और खंडित अंश
  choice: लेवी को याजकपद और यहूदा को राजपद मिलने तथा दोनों के विरुद्ध न उठने की चेतावनी के रूप में अनुवाद
  alternative: वाक्य-विन्यास को खंडित ही छोड़ना, अथवा याजकपद और राजपद को स्पष्ट न करना
  rationale: उपलब्ध यूनानी पाठ इस स्थान पर क्षतिग्रस्त है, पर लेवी, यहूदा और आसपास की चेतावनी पारंपरिक द्वैध अधिकार—याजकीय और राजकीय—का संभावित अर्थ समर्थित करते हैं। अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- issue: पद 11 में ἐν αὐτῷ और राज्य करने वाले का संबंध
  choice: ‘प्रभु ने उसी में ... राज्य करने को चुना’ के रूप में अस्पष्टता बनाए रखी
  alternative: इसे स्पष्ट रूप से लेवी, लेवी के वंश, या यहूदा के भावी मसीही राजा से जोड़ना
  rationale: पाठ लेवी और यहूदा की परंपराओं को साथ रखता है और सर्वनाम का सटीक वंशगत संकेत विवाद्य है; अनुवाद ने कोई बाद की धर्मसैद्धांतिक पहचान नहीं थोपी।
- issue: पद 12 में वंशज के आगे झुकना
  choice: ‘उसके वंशज के आगे झुको’
  alternative: ‘उसके वंश की आराधना करो’ अथवा ‘उसकी संतान को सम्मान दो’
  rationale: προσκυνέω सम्मानपूर्वक झुकने से लेकर आराधना तक अर्थ दे सकता है। मानवीय वंश के संदर्भ में ‘आगे झुको’ वास्तविक अस्पष्टता को बचाता है और दिव्यता पूर्वनिर्धारित नहीं करता।
- issue: पद 12 में मरने वाले वंशज और अनन्त राजा की पहचान
  choice: एकवचन ‘वह ... मरेगा’ और अलग कथन ‘एक अनन्त राजा होगा’
  alternative: दोनों कथनों को स्पष्ट रूप से एक ही मसीही व्यक्ति से जोड़ना या पूरे लेवीय वंश पर लागू करना
  rationale: यूनानी में वंश/बीज, मृत्यु और अनन्त राजा का संबंध धर्मवैचारिक रूप से तनावपूर्ण है। हिन्दी पाठ इस संबंध को बिना समाधान थोपे सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण उपदेशात्मक शैली रखी गई है। ‘याजकपद’, ‘राजपद’, ‘अधर्म’ और ‘अनन्त’ जैसे परिचित धार्मिक शब्दों के साथ वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया। स्रोत की लैंगिक भाषा, कठोर नैतिक रूपक और लेवी–यहूदा संबंधी धर्मवैचारिक अस्पष्टता को नरम या संप्रदायगत ढंग से स्पष्ट नहीं किया गया।
