    Γὑμῶν⌉⁶⁷, ἵνα * δέξησθε εὐλογίαν⁶⁸ ἐκ τοῦ⁶⁹ στόματος αὐτοῦ. 11. Αὐτὸς γὰρ⁷⁰ εὐλογήσει τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν· * ὅτι ἐν αὐτῷ⁷¹ ἐξελέξατο Κύριος⁷² βασιλεύειν⁷³ ἐνώπιον⁷⁴ * παντὸς τοῦ λαοῦ⁷⁵. 12. Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
