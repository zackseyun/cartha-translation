  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001.yaml
  text: 'A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.


    2 Two years after the death of Joseph his brother, when Reuben had fallen sick, the sons of Joseph and the sons of his sons were gathered to visit him. 3 And he said to them, “My children, behold, I am dying, and I am going the way of my fathers.” 4 Then, seeing there Judah and Gad and Asher, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am failing.” 5 And rising up, he kissed them and said to them, “Hear, my brothers and my sons; pay attention to Reuben your father in the things that I command you.


    6 “And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was poured out and defiled the bed of my father Jacob. 7 And I tell you that he struck me with a severe blow in my loins for seven months; and if my father Jacob had not prayed for me to the Lord, the Lord would have been willing to destroy me. 8 For I was thirty years old when I did the evil thing before the Lord, and for seven months I was weakened to the point of death. 9 And after this, with the resolve of my soul, I repented before the Lord for seven years. 10 And I drank no wine or strong drink, and meat did not enter my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great—such a thing had not happened in Israel.”'
translation:
  language: hi
  text: 'रूबेन की वसीयत की प्रतिलिपि—वे बातें जिनकी आज्ञा उसने मरने से पहले, अपने जीवन के एक सौ पच्चीसवें वर्ष में, अपने पुत्रों को दी।


    2 उसके भाई यूसुफ की मृत्यु के दो वर्ष बाद, जब रूबेन बीमार पड़ा, तब यूसुफ के पुत्र और उनके पुत्र उससे मिलने के लिए इकट्ठे हुए। 3 उसने उनसे कहा, “मेरे बच्चो, देखो, मैं मर रहा हूँ और अपने पूर्वजों के मार्ग पर जा रहा हूँ।” 4 वहाँ अपने भाइयों यहूदा, गाद और आशेर को देखकर उसने उनसे कहा, “मुझे उठाकर बैठाओ, ताकि मैं अपने भाइयों और अपने बच्चों को वे बातें बता सकूँ जो मेरे हृदय में छिपी हैं; क्योंकि देखो, अब मेरा अंत निकट है।” 5 तब वह उठ बैठा, उसने उन्हें चूमा और रोते हुए उनसे कहा, “मेरे भाइयो और मेरे पुत्रो, सुनो; तुम्हारा पिता रूबेन जो आज्ञाएँ तुम्हें देता है, उन पर ध्यान दो।


    6 “और देखो, आज मैं स्वर्ग के परमेश्वर को तुम्हारे विरुद्ध साक्षी ठहराता हूँ कि तुम जवानी की अज्ञानता और यौन अनैतिकता में न चलो। उसी में मैं बह गया[a] और मैंने अपने पिता याकूब की शय्या को अशुद्ध किया। 7 मैं तुमसे कहता हूँ कि उसने मेरी कमर पर घोर प्रहार किया, और मैं सात महीने तक पीड़ित रहा। यदि मेरे पिता याकूब ने मेरे लिए प्रभु से प्रार्थना न की होती, तो प्रभु मुझे नष्ट कर देना चाहते थे। 8 क्योंकि जब मैंने प्रभु के सामने वह बुरा काम किया, तब मैं तीस वर्ष का था; और सात महीने तक मैं इतना दुर्बल रहा कि मरने पर था। 9 इसके बाद मैंने अपने मन के दृढ़ संकल्प से सात वर्ष तक प्रभु के सामने पश्चाताप किया। 10 मैंने न दाखमधु पिया, न कोई तेज मदिरा; मांस मेरे मुँह में नहीं गया और मैंने कोई मनभावनी रोटी नहीं खाई। इसके बजाय मैं अपने पाप के कारण शोक करता रहा, क्योंकि वह बहुत बड़ा था—इस्राएल में ऐसा कभी नहीं हुआ था।”


    [a] यूनानी अभिव्यक्ति का शाब्दिक अर्थ है, “मैं उंडेल दिया गया।” यह असामान्य रूपक यहाँ यौन अनैतिकता में बह जाने को व्यक्त करता है; मूल पाठ कर्ता को स्पष्ट नहीं करता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति का शाब्दिक अर्थ है, “मैं उंडेल दिया गया।” यह असामान्य रूपक यहाँ यौन अनैतिकता में बह जाने को व्यक्त करता है; मूल पाठ कर्ता को स्पष्ट नहीं करता।
    reason: ἐξεχύθην निष्क्रिय और रूपकात्मक है। फुटनोट शाब्दिक रूप तथा मूल की कर्ता-संबंधी अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: διαθήκης
  choice: वसीयत
  rationale: मृत्यु से पहले संतान को दिए गए अंतिम उपदेशों के इस साहित्यिक संदर्भ में ‘वसीयत’ स्वाभाविक है और ‘वाचा’ से होने वाली अनावश्यक धार्मिक विशिष्टता से बचती है।
- source_word: ὁδὸν τῶν πατέρων μου
  choice: अपने पूर्वजों के मार्ग
  rationale: मृत्यु के लिए प्रयुक्त मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: ἐξεχύθην
  choice: मैं अपने आपको बहा बैठा
  rationale: मूल के ‘उंडेल दिए जाने/बह जाने’ के असामान्य रूपक को पूर्णतः सामान्यीकृत नहीं किया गया; हिन्दी में आत्मविनाशकारी समर्पण का भाव भी सुनाई देता है।
- source_word: κοίτην
  choice: शय्या
  rationale: पिता के वैवाहिक/यौन अधिकार के उल्लंघन को मूल की परोक्ष और गरिमापूर्ण भाषा में रखता है।
- source_word: σίκερα
  choice: तेज मदिरा
  rationale: यह दाखमधु से अलग नशीले पेय को दर्शाता है; ‘तेज मदिरा’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἄρτον ἐπιθυμίας
  choice: मनभावना रोटी
  rationale: शाब्दिक ‘इच्छा की रोटी’ की अपेक्षा स्वाभाविक हिन्दी में वांछित या स्वादिष्ट भोजन का आशय देता है, पर इसे सामान्य भोजन मात्र नहीं बनाता।
theological_decisions:
- issue: प्रहार करने वाले की पहचान (ἔπληξέ με)
  choice: उसने मेरी कमर पर... प्रहार किया
  alternative: परमेश्वर ने मेरी कमर पर... प्रहार किया
  rationale: यूनानी में कर्ता केवल निहित है। निकट संदर्भ परमेश्वर की ओर संकेत करता है, फिर भी पाठ उसे स्पष्ट नाम से नहीं बताता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई।
- issue: ἤθελε Κύριος ἀνελεῖν με में प्रभु की इच्छा/मंशा
  choice: प्रभु मुझे नष्ट कर देना चाहते थे
  alternative: प्रभु मुझे नष्ट कर देते
  rationale: ἤθελε में इच्छा या मंशा का तत्व है; केवल परिणामसूचक अनुवाद उस तनाव को मिटा देता।
- issue: पश्चाताप के साथ उपवास-सदृश आचरण
  choice: इसे रूबेन के व्यक्तिगत पश्चाताप का वर्णन रखा गया
  alternative: इसे सार्वभौमिक धार्मिक प्रायश्चित्त-विधि के रूप में व्यक्त करना
  rationale: पाठ वर्णनात्मक है; इसमें सभी के लिए कोई संस्थागत तपस्या-विधान स्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पारिवारिक संबोधनों में ‘बच्चो/भाइयो/पुत्रो’ का स्वाभाविक सम्बोधन-रूप रखा गया है। कथन में प्राचीन वसीयती शैली बनाए रखने के लिए ‘देखो’ और ‘साक्षी ठहराता हूँ’ जैसे पद सुरक्षित हैं।
