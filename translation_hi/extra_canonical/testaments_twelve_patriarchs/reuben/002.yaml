  text: 'And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance. There were given, then, seven spirits set against man, and these are the heads of the works of youthfulness[b].


    And seven other spirits were given to him at creation, so that every work of man might be in them. The first is the spirit of life, by which a person’s constitution is formed. The second is the spirit of sight, by which desire comes to be. The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are produced for the drawing in of air and breath[c]. The fifth is the spirit of speech, by which knowledge comes to be. The sixth is the spirit of taste, by which the eating of foods and drinks comes to be, and strength is formed by it, because in foods is the basis of strength. The seventh is the spirit of procreation and intercourse, by which sins come together through the love of pleasure. Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the young man like a blind man into a pit, and like an animal over a cliff.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चो, मेरी बात सुनो कि अपने पश्चाताप में मैंने भटकाने वाली सात आत्माओं[a] के विषय में क्या देखा। तब मनुष्य के विरुद्ध सात आत्माएँ दी गईं, और ये युवावस्था के कामों के मुख[b] हैं।


    और सृष्टि के समय मनुष्य को सात और आत्माएँ दी गईं, ताकि मनुष्य का हर काम उनमें हो। पहली जीवन की आत्मा है, जिससे मनुष्य की संरचना बनती है। दूसरी दृष्टि की आत्मा है, जिससे इच्छा उत्पन्न होती है। तीसरी सुनने की आत्मा है, जिससे शिक्षा मिलती है। चौथी सूँघने की आत्मा है, जिससे हवा और श्वास को भीतर खींचने के लिए स्वाद उत्पन्न होते हैं[c]। पाँचवीं बोलने की आत्मा है, जिससे ज्ञान उत्पन्न होता है। छठी स्वाद की आत्मा है, जिससे भोजन और पेय का सेवन होता है, और उसमें बल उत्पन्न होता है, क्योंकि भोजन में बल का आधार है। सातवीं संतानोत्पत्ति और संभोग की आत्मा है, जिससे भोगप्रियता के द्वारा पाप एक साथ आते हैं। इसलिए यह सृष्टि में अंतिम और युवावस्था में प्रथम है, क्योंकि यह अज्ञान से भरी है; और यह युवक को ऐसे ले जाती है जैसे किसी अंधे को गड्ढे में, और जैसे किसी पशु को खड़ी चट्टान के कगार पर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भूल की आत्माएँ’ अथवा ‘मोह में डालने वाली आत्माएँ’।
    reason: lexical_alternative
  - marker: b
    text: ‘युवावस्था के कामों के मुख’ मूल के रूपक को सुरक्षित रखता है; संभवतः इसका अर्थ युवावस्था के पापपूर्ण कामों के प्रधान स्रोत या प्रेरक हैं।
    reason: lexical_alternative
  - marker: c
    text: सूँघने, स्वाद तथा हवा और श्वास को भीतर खींचने के संबंध में यूनानी पाठ कठिन है और संभवतः अत्यंत संक्षिप्त या पाठगत रूप से अस्थिर है।
    reason: textual_variant
lexical_decisions:
- source_word: πνευμάτων τῆς πλάνης
  choice: भटकाने वाली आत्माओं
  rationale: πλάνη में भटकाव, भूल और छल—तीनों अर्थ-छायाएँ संभव हैं। यहाँ आत्माएँ युवक को विनाश की ओर ले जाती हैं, इसलिए ‘भटकाने वाली’ सक्रिय प्रभाव को व्यक्त करता है और अस्पष्टता को अत्यधिक संकीर्ण नहीं करता।
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: अपने पश्चाताप के समय
  rationale: रूबेन के पापस्वीकार के प्रसंग में μετανοία केवल विचार-परिवर्तन नहीं, नैतिक पश्चाताप है। ‘के समय’ हिन्दी में स्वाभाविक रहते हुए यूनानी के प्रसंगगत अर्थ को व्यक्त करता है।
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: मनुष्य के विरुद्ध
  rationale: κατά के संबंधकारक प्रयोग में विरोध का भाव है। ‘मनुष्य’ एकवचन को जातिवाचक रूप में सुरक्षित रखता है।
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: युवावस्था के कामों के सिर
  rationale: κεφαλαί के रूपक को जानबूझकर सुरक्षित रखा गया है; यह प्रधान स्रोतों या आरंभिक प्रेरकों का संकेत दे सकता है। νεωτερισμός यहाँ युवावस्था की आवेगशीलता की ओर संकेत करता है।
- source_word: σύστασις
  choice: संरचना
  rationale: यह शरीर या व्यक्ति की गठित बनावट का संकेत देता है। ‘संरचना’ आधुनिक, सुबोध और अनावश्यक दार्शनिक तकनीकीपन से मुक्त है।
- source_word: ἐπιθυμία
  choice: इच्छा
  rationale: शब्द इच्छा, लालसा या कामना बता सकता है। ‘इच्छा’ मूल की व्यापकता बनाए रखता है और इसे समय से पहले केवल यौन वासना तक सीमित नहीं करता।
- source_word: διδασκαλία
  choice: शिक्षा
  rationale: यहाँ सुनने के द्वारा प्राप्त होने वाली शिक्षा अभिप्रेत है। हिन्दी वाक्य में ‘शिक्षा मिलती है’ ग्रहणशील अर्थ को स्वाभाविक बनाता है।
- source_word: γίνονται γεύσεις δεδομέναι εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: हवा और साँस भीतर खींचने के लिए स्वाद उत्पन्न होते हैं
  rationale: यूनानी वाक्य पाठगत और अर्थगत रूप से कठिन है। अनुवाद उसके असामान्य संबंध को सुधारे बिना यथासंभव निकट और पठनीय रखता है; कठिनाई पादटिप्पणी में बताई गई है।
- source_word: λαλιᾶς
  choice: बोलने की
  rationale: मानवीय क्षमताओं की सूची में ‘बोलना’ सहज और स्पष्ट है तथा वाणी की क्षमता को व्यक्त करता है।
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: बल का आधार
  rationale: इस नैतिक-शिक्षापरक प्रसंग में ὑπόστασις का अर्थ आधार या वह तत्व है जिस पर बल टिका है। ‘सारतत्त्व’ जैसे बाद के धर्मवैज्ञानिक तकनीकी अर्थ से बचा गया है।
- source_word: σπορᾶς καὶ συνουσίας
  choice: संतानोत्पत्ति और संभोग
  rationale: σπορά जनन/बीज बोने और συνουσία यहाँ यौन-संबंध का द्योतक है। चुने हुए शब्द स्पष्ट, मर्यादित और आधुनिक हिन्दी में समझने योग्य हैं।
- source_word: διὰ τῆς φιληδονίας
  choice: सुख-विलास के प्रेम के द्वारा
  rationale: φιληδονία सुख के प्रेम, विशेषतः भोगप्रियता, को व्यक्त करता है। ‘सुख-विलास का प्रेम’ नैतिक नकारात्मकता को बनाए रखता है, पर इसे केवल एक प्रकार के सुख तक सीमित नहीं करता।
theological_decisions:
- issue: पश्चाताप के प्रसंग में μετανοία का अनुवाद
  choice: अपने पश्चाताप के समय
  alternative: जब मेरा मन बदला / जब मैंने पश्चाताप किया
  rationale: प्रसंग रूबेन के यौन पाप के बाद उसके अंगीकार और नैतिक परिवर्तन का है। इसलिए ‘पश्चाताप’ मात्र संज्ञानात्मक मन-परिवर्तन की अपेक्षा अधिक उपयुक्त है।
- issue: कोष्ठकित सात सृजित आत्माओं वाले अंश को सम्मिलित करना
  choice: मुख्य पाठ में पूरा सम्मिलित
  alternative: बाद का विस्तार मानकर पादटिप्पणी में रखना या छोड़ देना
  rationale: प्रदत्त यूनानी साक्ष्य में यह अध्याय का अंग है। उसकी कठिन भाषा को हटाने के बजाय अनुवाद और पादटिप्पणी द्वारा ईमानदारी से प्रस्तुत किया गया है।
- issue: ὑπόστασις को बाद की धर्मवैज्ञानिक पारिभाषिकता से पढ़ना
  choice: आधार
  alternative: सारतत्त्व / सत्ता
  rationale: यहाँ विषय भोजन में निहित शारीरिक बल का आधार है, न कि ईश्वर-संबंधी पारिभाषिक सत्ता। ‘आधार’ प्रसंगगत अर्थ देता है और बाद की धर्मवैज्ञानिक अवधारणा आरोपित नहीं करता।
- issue: सातवीं आत्मा और पापों के संबंध को कारणात्मक रूप से कितना स्पष्ट करना
  choice: जिससे ... पाप एक साथ जुड़ते हैं
  alternative: जिससे पाप भीतर प्रवेश करते हैं / जो पाप उत्पन्न करती है
  rationale: συνέρχονται का शाब्दिक भाव ‘एक साथ आते/जुड़ते हैं’ है। मूल की कुछ कठिन और तनावपूर्ण भाषा को किसी निश्चित कारणात्मक व्याख्या से नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘आत्मा’, ‘पश्चाताप’, ‘सृष्टि’ जैसे स्थापित धार्मिक शब्द रखे गए हैं; कठिन यूनानी रूपकों और सूची की पुनरावृत्त संरचना को अनावश्यक रूप से समतल नहीं किया गया। यौन विषय के लिए स्पष्ट पर मर्यादित शब्दावली अपनाई गई है।
