  to: क्योंकि स्त्रियाँ दुष्ट हैं, मेरे बच्चो; और पुरुष पर उनका कोई अधिकार या सामर्थ्य न होने के कारण, वे विभिन्न रूप धरकर छल करती हैं, ताकि उसे अपनी ओर खींच लें।
  rationale: A limited revision corrects the rendering of the phrase δολιεύονται ἐν σχήμασιν. The revised text retains the source’s harsh generalization and its causal and purposive structure, while representing the Greek plural ‘forms/appearances’ and deceitful action more directly.
