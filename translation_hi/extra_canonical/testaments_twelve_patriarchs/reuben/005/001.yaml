id: T12P.REU.5.1
reference: Testament of Reuben 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πονηραὶ ¹γάρ¹¹ εἰσιν αἱ γυναῖκες, τέκνα² μου, *καὶ ἐν τῷ μὴ ἔχειν αὐτὰς³ ἐξουσίαν *ἢ δύναμιν⁴ ἐπὶ *τὸν ἄνδρα⁵, δολιεύονται⁶ ἐν σχήμασιν⁷ ὅπως⁸ αὐτὸν⁹ *πρὸς ἑαυτὰς¹⁰ ἐπισπάσωνται¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/001.yaml
  text: For women are evil, my children; and because they have no authority or power over the man, they scheme by their appearance how they may draw him to themselves.
translation:
  language: hi
  text: क्योंकि स्त्रियाँ दुष्ट हैं, मेरे बच्चो; और पुरुष पर उनका कोई अधिकार या सामर्थ्य न होने के कारण, वे विभिन्न रूप धरकर छल करती हैं, ताकि उसे अपनी ओर खींच लें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πονηραὶ
  choice: दुष्ट
  rationale: यह नैतिक रूप से नकारात्मक विशेषण है; ‘दुष्ट’ मूल कथन की कठोरता को बिना नरम किए व्यक्त करता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: प्रत्यक्ष संबोधन का स्वाभाविक आधुनिक हिन्दी रूप; संबोधन में ‘बच्चो’ मानक वर्तनी है।
- source_word: ἐξουσίαν ἢ δύναμιν
  choice: अधिकार या सामर्थ्य
  rationale: 'दोनों संज्ञाओं का भेद बनाए रखा गया है: ἐξουσία वैध अधिकार/प्राधिकार और δύναμις क्षमता या शक्ति का संकेत देती है।'
- source_word: ἐπὶ τὸν ἄνδρα
  choice: पुरुष पर
  rationale: यूनानी निश्चित पदबंध को सामान्य वर्ग-संदर्भ में स्वाभाविक हिन्दी से व्यक्त किया गया है; ‘उस पुरुष’ कहना संदर्भ से अधिक विशिष्ट होता।
- source_word: δολιεύονται
  choice: छल की युक्तियाँ रचती हैं
  rationale: क्रिया के कपटपूर्वक योजना बनाने के भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν σχήμασιν
  choice: अपने रूप के द्वारा
  rationale: σχήμα यहाँ बाहरी रूप/दिखावट की ओर संकेत करता है; साधनवाचक ἐν को ‘के द्वारा’ से व्यक्त किया गया है।
- source_word: πρὸς ἑαυτὰς ἐπισπάσωνται
  choice: उसे अपनी ओर खींच लें
  rationale: आत्मवाचक बहुवचन और आकर्षित कर लेने की क्रिया दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: स्त्रियों के बारे में सार्वभौमिक और कठोर नैतिक कथन
  choice: ‘स्त्रियाँ दुष्ट हैं’ के रूप में कथन की कठोरता बनाए रखी
  alternative: ‘स्त्रियाँ बुराई की ओर प्रवृत्त होती हैं’ या प्रसंग को सीमित करने वाला रूप
  rationale: मूल यूनानी में स्पष्ट विधेय विशेषण और सामान्य कथन है। अनुवादक को असुविधाजनक दावे को नरम या व्याख्यायित नहीं करना चाहिए।
- issue: ἐξουσία और δύναμις का संबंध
  choice: ‘अधिकार या सामर्थ्य’ द्वारा दोनों विकल्प अलग रखे
  alternative: दोनों को मिलाकर केवल ‘शक्ति’
  rationale: ἢ (‘या’) और दोनों निकटार्थी किंतु भिन्न शब्दों को बनाए रखने से मूल की वैचारिक बनावट सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल के स्त्री-विरोधी सामान्यीकरण को अनुमोदित या नरम किए बिना ऐतिहासिक पाठ के कथन के रूप में यथावत प्रस्तुत किया गया है।
