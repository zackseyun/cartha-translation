source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Κἀκεῖναι γὰρ⁷⁰ ἐπιθυμοῦσαι * τῇ διανοίᾳ τῆς φαντασίας⁷¹ αὐτῶν ἔτεκον⁷² γίγαντας. Ἐφαίνοντο γὰρ αὐταῖς⁷³ * οἱ Ἐγρήγοροι⁷⁴ * ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες⁷⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/007.yaml
  text: And those women also, desiring in their minds their appearance, gave birth to giants. For the Watchers appeared to them as reaching to heaven.
translation:
  language: hi
  text: और उन स्त्रियों ने भी अपने मन में उनके रूप की कल्पना कर उसकी लालसा करते हुए दैत्यों को जन्म दिया। क्योंकि वे पहरेदार[a] उन्हें आकाश तक पहुँचते हुए दिखाई देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहरेदार’ यूनानी पद Ἐγρήγοροι का अनुवाद है, जिसका अर्थ ‘जागते’ या ‘सतर्क रहनेवाले’ है और जो एक विशिष्ट अलौकिक समूह का पदनाम है।
    reason: विशिष्ट पदनाम के अर्थ-संबंध को स्पष्ट करता है, बिना उसके स्वरूप या भूमिका के बारे में अतिरिक्त व्याख्या जोड़े।
lexical_decisions:
- source_word: ἐπιθυμοῦσαι
  choice: लालसा करते हुए
  rationale: यह कृदन्त तीव्र इच्छा या कामना व्यक्त करता है; प्रसंग में स्त्रियों की मानसिक आकांक्षा को स्वाभाविक हिन्दी में रखा गया है।
- source_word: τῇ διανοίᾳ τῆς φαντασίας αὐτῶν
  choice: अपनी कल्पना में उनके रूप की
  rationale: यूनानी अभिव्यक्ति कुछ असहज और अर्थगत रूप से सघन है। यहाँ διάνοια और φαντασία के मानसिक-कल्पनात्मक पक्ष को ‘अपनी कल्पना में’ तथा αὐτῶν को निकटवर्ती अभिप्रेत पहरेदारों के ‘उनके रूप’ के रूप में प्रस्तुत किया गया है, जैसा प्रसंग और परामर्श-पाठ संकेत करते हैं।
- source_word: γίγαντας
  choice: दैत्यों
  rationale: γίγας का सीधा अर्थ असाधारण विशालकाय प्राणी है; ‘दैत्य’ आधुनिक हिन्दी में इस पौराणिक-संदर्भित अर्थ को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: οἱ Ἐγρήγοροι
  choice: वे पहरेदार
  rationale: Ἐγρήγοροι का शाब्दिक संबंध जागते रहने से है और यह एक विशिष्ट अलौकिक समूह का पदनाम है। ‘पहरेदार’ अर्थ-सुलभ हिन्दी है; संकेतवाचक ‘वे’ पूर्वपरिचित समूह को दर्शाता है।
- source_word: τοῦ οὐρανοῦ φθάνοντες
  choice: आकाश तक पहुँच रहे हों
  rationale: ऊँचाई के दृश्य प्रभाव को स्वाभाविक हिन्दी में रखा गया है; ‘मानो’ दिखाई देने और वास्तविक कद के बीच मूल पाठ की अनुभूति को बनाए रखता है।
theological_decisions:
- issue: दैत्यों के जन्म और पहरेदारों के प्रकट होने के बीच संबंध
  choice: पाठ के दावे को बिना अतिरिक्त व्याख्या के सीधे रखा गया
  alternative: इसे प्रत्यक्ष शारीरिक संबंध, स्वप्न, या केवल मानसिक गर्भाधान के रूप में स्पष्ट करना
  rationale: मूल कथन मानसिक लालसा/कल्पना और जन्म का संबंध बताता है, पर उसकी प्रक्रिया नहीं समझाता; इसलिए धार्मिक या जैविक व्याख्या नहीं जोड़ी गई।
- issue: पहरेदारों की आकाश तक पहुँचती हुई आकृति
  choice: ‘ऐसे दिखाई देते थे, मानो’
  alternative: यह कहना कि वे वस्तुतः आकाश तक पहुँचते थे
  rationale: ἐφαίνοντο दृश्य प्रतीति को व्यक्त करता है; अनुवाद ने इसे वस्तुगत तथ्य के रूप में कठोर नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘स्त्रियों’, ‘रूप’, ‘लालसा’, ‘दैत्य’ और ‘पहरेदार’ सामान्य पाठक के लिए बोधगम्य हैं। मूल के असामान्य मानसिक-कल्पनात्मक कथन को सरल बनाते हुए उसकी धार्मिक अस्पष्टता नहीं मिटाई गई।
