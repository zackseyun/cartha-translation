source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Οὕτως γὰρ⁵⁵ ἔθελξαν τοὺς Ἐγρηγόρους⁵⁶ Γτοὺς˥⁵⁷ πρὸ τοῦ κατακλυσμοῦ· *ἐκεῖνοι γὰρ⁵⁸ β, Α, S¹ συνεχῶς⁵⁹ ὁρῶντες Γαὐτὰς˥⁶⁰ ἐγένοντο⁶¹ Γκαὶ˥⁶² ἐν⁶³ ἐπιθυμίᾳ κἀκεῖνοι. α, β-g, S¹ αὐτῶν⁶⁴, καὶ συνέλαβον⁶⁵ τῇ διανοίᾳ * τὴν πρᾶξιν⁶⁶. * μετεσχηματίζοντο γὰρ⁶⁷ εἰς ἄνδρα⁶⁸ καὶ ἐν τῇ συνουσίᾳ τῶν ἀνδρῶν * αὐτῶν συνεφαίνοντο αὐταῖς⁶⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/006.yaml
  text: For in this way they also enticed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were transforming themselves into the form of men and appearing to them while their husbands were with them.
translation:
  language: hi
  text: क्योंकि इसी प्रकार उन्होंने जलप्रलय से पहले के पहरेदारों[a] को भी लुभाया था। वे उन्हें लगातार देखते रहे और उनके लिए कामना से भर गए; उन्होंने अपने मन में उस कृत्य की योजना बना ली। क्योंकि वे पुरुष का रूप धारण कर लेते थे और उन स्त्रियों को तब दिखाई देते थे, जब उनके पति सहवास कर रहे होते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहरेदार’ प्राचीन यहूदी साहित्य में अलौकिक प्राणियों के एक समूह की पारिभाषिक उपाधि है; इसका शाब्दिक भाव ‘जागते रहनेवाले’ है।
    reason: आधुनिक पाठक के लिए इस विशिष्ट उपाधि की पहचान स्पष्ट करना।
  - marker: b
    text: 'इस अंतिम यूनानी वाक्य का विन्यास कठिन है। उसका निकट शाब्दिक क्रम है: ‘वे पुरुष का रूप धारण करते थे और उनके पुरुषों/पतियों के सहवास में उन्हें दिखाई देते थे।’ ‘उन्हें’ स्त्रियों के लिए है, पर ‘सहवास में’ का सटीक संबंध व्याकरण की दृष्टि से पूरी तरह निश्चित नहीं है।'
    reason: मूल की वाक्यगत अस्पष्टता और ‘सहवास’ से ‘दिखाई देने’ के संबंध को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔθελξαν
  choice: लुभाया
  rationale: यह क्रिया आकर्षण या मोह के द्वारा किसी को वश में करने का भाव रखती है; संदर्भ में ‘लुभाया’ सहज है और जादुई प्रभाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Ἐγρηγόρους
  choice: पहरेदारों
  rationale: यह ‘जागते रहनेवालों/पहरेदारों’ के लिए प्रयुक्त पारिभाषिक उपाधि है। मूल पाठ में ‘स्वर्गदूत’ शब्द नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐν ἐπιθυμίᾳ
  choice: कामना से भर गए
  rationale: संदर्भ में ἐπιθυμία यौन अभिलाषा सूचित करती है; यह चयन उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνέλαβον τῇ διανοίᾳ τὴν πρᾶξιν
  choice: अपने मन में उस कर्म की कल्पना कर ली
  rationale: मुहावरे का अर्थ मन में कर्म की धारणा या योजना ग्रहण करना है; ‘कल्पना कर ली’ कार्य को कर चुकने के बजाय मानसिक रूप से गढ़ने का भाव बचाता है।
- source_word: μετεσχηματίζοντο εἰς ἄνδρα
  choice: पुरुषों का रूप धारण कर लेते
  rationale: क्रिया रूप-परिवर्तन या भेष धारण करने को व्यक्त करती है। एकवचन ἄνδρα यहाँ प्रकारगत अर्थ में ‘पुरुष’ है, जिसे हिन्दी में स्वाभाविक बहुवचन से दिया गया है।
- source_word: συνουσίᾳ
  choice: सहवास
  rationale: इस प्रसंग में शब्द सामान्य संगति नहीं, यौन संबंध का संकेत करता है; ‘सहवास’ dignified और स्पष्ट है।
theological_decisions:
- issue: ‘पहरेदारों’ की पहचान
  choice: मुख्य पाठ में केवल ‘पहरेदारों’ की उपाधि रखी गई
  alternative: ‘पहरेदार स्वर्गदूतों’ या ‘स्वर्गदूतों’
  rationale: Ἐγρηγόρους एक विशिष्ट उपाधि है, पर इस वाक्य में उनकी सत्ता-श्रेणी स्पष्ट रूप से नहीं कही गई; ‘स्वर्गदूत’ जोड़ना व्याख्यात्मक विस्तार होता।
- issue: अंतिम उपवाक्य में दिखाई देनेवालों और सहवास का संबंध
  choice: पहरेदार पुरुष-रूप में स्त्रियों को उनके पतियों के साथ सहवास के समय दिखाई देते थे
  alternative: पहरेदार स्वयं स्त्रियों के साथ पुरुषों की तरह सहवास करते थे
  rationale: ग्रीक वाक्य-विन्यास कठिन है, पर συνεφαίνοντο αὐταῖς का सीधा अर्थ ‘उन्हें दिखाई देते थे’ है और τῶν ἀνδρῶν αὐτῶν स्वाभाविक रूप से ‘उनके पुरुषों/पतियों’ को दर्शाता है। वैकल्पिक समझ को फुटनोट में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लुभाया’, ‘कामना’, ‘रूप धारण’ और ‘सहवास’ स्रोत के यौन और अलौकिक संदर्भ को स्पष्ट रखते हैं, पर अनावश्यक रूप से सनसनीखेज नहीं बनाते। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है।
