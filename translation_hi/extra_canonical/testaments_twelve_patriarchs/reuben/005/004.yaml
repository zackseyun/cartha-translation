  text: For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him.
translation:
  language: hi
  text: क्योंकि कोई स्त्री किसी पुरुष को सामने से बलपूर्वक विवश नहीं कर सकती, बल्कि वेश्या-जैसे हाव-भाव से उसके विरुद्ध चाल चलती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πρόσωπον
  choice: आमने-सामने
  rationale: यह यूनानी पद प्रत्यक्ष अथवा सामने से किए गए व्यवहार को व्यक्त करता है; आधुनिक हिन्दी में ‘आमने-सामने’ स्वाभाविक और स्पष्ट है।
- source_word: ἐν σχήματι πορνικοῖς
  choice: वेश्याओं जैसी अदाओं से
  rationale: पाठ का आशय वेश्यावृत्ति-सदृश ढंग, हाव-भाव या प्रस्तुति से है। ‘अदाओं’ में बाहरी ढंग और लुभाने वाले हाव-भाव दोनों समाहित हैं, बिना किसी विशिष्ट युक्ति को अनावश्यक रूप से निश्चित किए।
- source_word: πανουργεύεται
  choice: छल करती है
  rationale: क्रिया धूर्ततापूर्वक युक्ति चलाने या छल करने का बोध कराती है; ‘छल करती है’ साधारण आधुनिक हिन्दी में इसका संक्षिप्त और dignified रूप है।
- source_word: βιάσαι
  choice: विवश कर सकती
  rationale: यहाँ क्रिया बल प्रयोग करके बाध्य करने के अर्थ में है; ‘विवश करना’ उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
