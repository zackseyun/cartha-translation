translation:
  language: hi
  text: और जिस व्यक्ति को वे रूप-रंग से मोहित नहीं कर पातीं, उसे वे छल से परास्त करती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦ σχήματος
  choice: रूप-रंग से
  rationale: σχῆμα यहाँ बाहरी रूप या दिखावट के साधन को सूचित करता है; ‘रूप-रंग’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भगत आकर्षण को स्पष्ट करता है।
- source_word: οὐκ ἰσχύουσιν
  choice: नहीं कर पातीं
  rationale: यह सामर्थ्य या क्षमता के अभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: καταγοητεῦσασθαι
  choice: मोहित
  rationale: क्रिया जादुई वशीकरण अथवा सम्मोहन से लेकर लुभाकर प्रभावित करने तक अर्थ दे सकती है; ‘मोहित’ इस अर्थ-व्याप्ति को अनावश्यक रूप से शाब्दिक जादू तक सीमित नहीं करता।
- source_word: δι᾿ ἀπάτης καταγωνίζονται
  choice: छल से वश में कर लेती हैं
  rationale: ἀπάτη का अर्थ ‘छल’ है और καταγωνίζομαι यहाँ किसी पर विजय पाकर उसे अधीन करने का भाव रखता है; संयुक्त अनुवाद स्वाभाविक हिन्दी में दोनों तत्व बनाए रखता है।
