  register: आधुनिक मानक हिन्दी; वाक्य को गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। स्त्रीलिंग बहुवचन ‘कर पातीं/लेती हैं’ पिछले संदर्भ में निहित स्त्री-विषय को मानता है, जैसा अंग्रेज़ी परामर्श-पाठ के ‘they’ में अस्पष्ट है पर यूनानी क्रियारूप से अपने आप निर्धारित नहीं होता।
