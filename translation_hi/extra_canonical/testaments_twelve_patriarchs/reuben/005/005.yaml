id: T12P.REU.5.5
reference: Testament of Reuben 5:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην διανοίας⁵⁰, ὅτι πᾶσα γυνὴ⁵¹ δολιευομένη ἐν τούτοις εἰς κόλασιν⁵² αἰώνιον⁵³ τετήρηται⁵⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/005.yaml
  text: Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and faces for the deception of the mind; for every woman who deceives by these things is reserved for eternal punishment.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, यौन अनैतिकता से दूर भागो और अपनी पत्नियों और बेटियों को आज्ञा दो कि वे मन को बहकाने के लिए अपने सिर और चेहरे न सजाएँ; क्योंकि हर स्त्री जो इन बातों के द्वारा छल करती है, अनन्त दण्ड के लिए रखी गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείαν
  choice: व्यभिचार
  rationale: यह शब्द यहाँ व्यापक यौन अनैतिकता को सूचित करता है; आधुनिक हिन्दी में ‘व्यभिचार’ संक्षिप्त और गरिमापूर्ण है, यद्यपि कभी-कभी इसका अर्थ विशेषतः विवाहेतर संबंध भी समझा जाता है।
- source_word: κοσμῶσι
  choice: सजाएँ
  rationale: सिर और चेहरे को अलंकृत या सँवारने के सामान्य भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς ἀπάτην διανοίας
  choice: लोगों के मन को बहकाने के लिए
  rationale: शाब्दिक ‘मन के छल के लिए’ हिन्दी में अस्वाभाविक है; यह रूप उद्देश्य और मानसिक भ्रम/प्रलोभन का भाव बनाए रखता है।
- source_word: δολιευομένη ἐν τούτοις
  choice: इन चीज़ों के द्वारा छल करती है
  rationale: मध्यवाच्य कृदन्त की कुछ अस्पष्टता के बावजूद संदर्भ में सजावट को छल के साधन के रूप में प्रयोग करने का भाव सबसे प्रत्यक्ष है।
- source_word: εἰς κόλασιν αἰώνιον τετήρηται
  choice: अनन्त दण्ड के लिए रखी गई है
  rationale: पूर्णकालीन निष्क्रिय रूप और भावी दण्ड के लिए सुरक्षित रखे जाने की कठोर न्यायिक भाषा को संरक्षित करता है।
theological_decisions:
- issue: αἰώνιον का कालगत बल
  choice: अनन्त
  alternative: युगानुयुग का / युग-संबंधी
  rationale: इस न्याय-वाक्य में αἰώνιον का सामान्य और स्वाभाविक हिन्दी समतुल्य ‘अनन्त’ है; पाठ की दण्ड-संबंधी धार को नरम नहीं किया गया।
- issue: स्त्री-सज्जा और छल का संबंध
  choice: पाठ के निषेध को सीधे अनूदित किया गया
  alternative: इसे केवल अत्यधिक या कामोत्तेजक सजावट तक सीमित करना
  rationale: यूनानी पाठ स्वयं ऐसी सीमा स्पष्ट नहीं करता; इसलिए किसी बाद की नैतिक या सांप्रदायिक व्याख्या को अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध शैली। ‘मेरे बच्चो’ संबोधन को स्वाभाविक हिन्दी रूप में रखा गया है। स्रोत-पाठ की कठोर पितृसत्तात्मक आज्ञा और दण्ड-विधान को बिना शमन या अनुमोदनात्मक विस्तार के प्रस्तुत किया गया है।
