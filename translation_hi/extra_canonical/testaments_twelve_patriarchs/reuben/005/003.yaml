base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/003.yaml
  text: For an angel of God also told me and taught me concerning them that women are overcome by the spirit of sexual immorality more than men, and in their hearts they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive.
translation:
  language: hi
  text: क्योंकि परमेश्वर के एक स्वर्गदूत ने भी मुझे उनके विषय में बताया और सिखाया कि स्त्रियाँ पुरुषों की अपेक्षा यौन-अनैतिकता की आत्मा से अधिक पराजित होती हैं। वे अपने हृदयों में पुरुषों के विरुद्ध योजनाएँ बनाती हैं; साज-सिंगार के द्वारा उनके मनों को भटकाती हैं, और दृष्टि के द्वारा विष बोती हैं। वे पहले मन में और फिर कर्म से उन्हें बंदी बना लेती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ πνεύματι τῆς πορνείας
  choice: व्यभिचार की आत्मा
  rationale: यहाँ πνεῦμα को ‘आत्मा’ और πορνεία को व्यापक यौन अनैतिकता के अर्थ में ‘व्यभिचार’ रखा गया है; अभिव्यक्ति की धार्मिक-नैतिक धार को बनाए रखते हुए इसे केवल मानवीय प्रवृत्ति बनाकर नहीं समझाया गया।
- source_word: ἡττῶνται
  choice: पराजित होती हैं
  rationale: क्रिया का मूल भाव किसी शक्ति के आगे हारने या वश में होने का है; ‘पराजित’ उस रूपक को सुरक्षित रखता है।
- source_word: κοσμήσεως
  choice: साज-सिंगार
  rationale: संदर्भ में बाहरी अलंकरण या सजावट अभिप्रेत है; आधुनिक हिन्दी में ‘साज-सिंगार’ स्वाभाविक और स्पष्ट है।
- source_word: τὰς διανοίας
  choice: उनके मनों
  rationale: διάνοια यहाँ मन, सोच या मानसिक समझ को सूचित करता है। प्रसंग के अनुसार सम्बन्धित पुरुषों के मन अभिप्रेत हैं।
- source_word: τὸν ἰὸν
  choice: विष
  rationale: ἰός का सीधा अर्थ विष है; पाठ में प्रयुक्त तीखे रूपक को यथावत रखा गया है।
- source_word: αἰχμαλωτίζουσιν
  choice: बंदी बना लेती हैं
  rationale: यह शब्द युद्धबंदी बनाने का रूपक लिए हुए है; ‘बंदी बना लेना’ उसकी शक्ति को बनाए रखता है।
theological_decisions:
- issue: ‘व्यभिचार की आत्मा’ का स्वरूप
  choice: ‘आत्मा’ को पाठ में जस का तस रखा गया
  alternative: ‘व्यभिचार की प्रवृत्ति’ अथवा ‘कामुकता की भावना’
  rationale: यूनानी πνεῦμα वास्तविक आत्मिक सत्ता और प्रभाव/प्रवृत्ति—दोनों अर्थों की गुंजाइश रखता है। अनुवाद ने इसे मनोवैज्ञानिक प्रवृत्ति तक सीमित करके वास्तविक अस्पष्टता को नहीं मिटाया।
- issue: पुरुषों की अपेक्षा स्त्रियों के अधिक पराजित होने का कथन
  choice: तुलनात्मक और सामान्यीकृत कथन को स्पष्ट रूप से बनाए रखा
  alternative: कथन को नरम करना या इसे केवल लेखक के निजी अनुभव के रूप में प्रस्तुत करना
  rationale: यह इस प्राचीन वसीयतनामे के वक्ता का विवादास्पद कथन है। अनुवाद का काम उसे समर्थन देना नहीं, बल्कि बिना शमन के विश्वसनीय रूप में प्रस्तुत करना है।
- issue: ‘पहले’ का सम्बन्ध
  choice: ‘पहले विचार में और फिर कर्म के द्वारा’
  alternative: ‘पहले विष बोती हैं, और तब कर्म के द्वारा बंदी बनाती हैं’
  rationale: यूनानी क्रम में πρῶτον (‘पहले’) का पाठगत/वाक्यगत सम्बन्ध कुछ कठिन है। अंग्रेज़ी परामर्श-पाठ की तरह इसे विचार और कर्म के क्रम से जोड़ा गया है, जो प्रसंग में सर्वाधिक संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गंभीर और गरिमापूर्ण शैली। मूल के कठोर तथा लिंग-संबंधी सामान्यीकरण को न तो अनुमोदित किया गया है, न नरम; उसे ऐतिहासिक वक्ता के कथन के रूप में अनूदित किया गया है। वाक्य-विन्यास को हिन्दी में सहज बनाने के लिए लंबे यूनानी वाक्य को तीन वाक्यों में बाँटा गया है।
