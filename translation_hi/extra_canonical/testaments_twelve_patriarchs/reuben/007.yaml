base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/007.yaml
  text: And Reuben died[a], after commanding these things to his sons. And they placed him in a coffin until he was brought up from Egypt and buried in Hebron[b], in the cave where his fathers were.
translation:
  language: hi
  text: और रूबेन अपने पुत्रों को ये आदेश देकर मर गया।[a] और उन्होंने उसे एक ताबूत में रखा, जब तक कि उसे मिस्र से ऊपर ले जाकर हेब्रोन में, उस गुफा में जहाँ उसके पूर्वज थे, दफ़नाया न गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अध्याय के लिए उपलब्ध कराया गया यूनानी साक्ष्य बहुत संक्षिप्त है और ‘जब तक’ के बाद टूट जाता है। दफ़न के वृत्तांत का शेष भाग किसी पूर्ण पुनर्निर्मित यूनानी पाठ से नहीं, बल्कि इस वसीयतनामे के कथात्मक संदर्भ के आधार पर न्यूनतम रूप में पूरा किया गया है।
    reason: textual_variant
  - marker: b
    text: हेब्रोन और पूर्वजों की गुफा का उल्लेख उत्पत्ति में वर्णित पितृपुरुषों की दफ़न-परंपरा की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέθανε
  choice: मर गया
  rationale: यह मृत्यु के लिए सामान्य और सीधा यूनानी क्रियापद है; इसलिए अनावश्यक रूपक या मृदु कथन नहीं अपनाया गया।
- source_word: ἐντειλάμενος
  choice: आज्ञा देकर
  rationale: कृदन्त रूबेन की मृत्यु से पहले हुई क्रिया को दर्शाता है और वसीयतनुमा आदेश का बल बनाए रखता है।
- source_word: υἱοῖς
  choice: पुत्रों
  rationale: यूनानी शब्द विशेष रूप से पुत्रों को सूचित करता है; ‘संतानों’ से मूल का संबंध-सूचक अर्थ अधिक व्यापक हो जाता।
- source_word: ἔθεντο
  choice: उन्होंने ... रखा
  rationale: यह सरल और स्वाभाविक हिन्दी है तथा शव को अस्थायी रूप से ताबूत में रखने की क्रिया को निकटता से व्यक्त करती है।
- source_word: σορῷ
  choice: ताबूत
  rationale: शब्द शव रखने के संदूक को सूचित करता है; ‘ताबूत’ आधुनिक हिन्दी में स्पष्ट और सहज समतुल्य है।
- source_word: ἕως
  choice: जब तक कि
  rationale: यह मूल के कालगत और आगे की घटना की प्रतीक्षा करने वाले भाव को बनाए रखता है, यद्यपि उपलब्ध यूनानी पाठ इसी शब्द के बाद टूट जाता है।
theological_decisions:
- issue: अत्यंत संक्षिप्त और खंडित यूनानी साक्ष्य को कैसे प्रस्तुत किया जाए
  choice: उपलब्ध यूनानी मृत्यु-वृत्तांत का सीधा अनुवाद किया गया और उसके बाद की बात को पितृपुरुष के हेब्रोन में पुनर्दफ़न के ज्ञात कथात्मक संदर्भ के आधार पर केवल न्यूनतम सीमा तक पूरा किया गया।
  alternative: केवल उपलब्ध यूनानी शब्दों का अनुवाद करके वाक्य को ‘जब तक’ पर अधूरा छोड़ देना, अथवा अन्य पाठ-साक्ष्यों के आधार पर अधिक विस्तृत पुनर्निर्माण करना।
  rationale: दिया गया यूनानी पाठ ἕως (‘जब तक’) के बाद टूट जाता है। वाक्य को अधूरा छोड़ना पाठक के लिए अनुपयोगी होता, जबकि विस्तृत पुनर्निर्माण उपलब्ध साक्ष्य से आगे जाता; अतः पूर्ति को स्पष्ट पादटिप्पणी के साथ न्यूनतम रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘आज्ञा देकर’, ‘ताबूत’ और ‘पूर्वज’ मूल के वसीयतनुमा तथा पारिवारिक संदर्भ को स्पष्ट रखते हैं। पाठगत अपूर्णता को मुख्य पाठ में बाधक बनाए बिना पादटिप्पणी में पारदर्शी रूप से बताया गया है।
