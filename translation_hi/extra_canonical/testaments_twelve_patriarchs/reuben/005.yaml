  text: 1[a]. For women are evil, my children; and because they do not have authority or power over a man, they scheme by their appearance how they may draw him to themselves. 2. And the one whom they are not able to enchant by appearance, him they overcome through deceit. 3[b]. For an angel of God also told me concerning them and taught me that women are overcome by the spirit of sexual immorality more than a man, and in their heart they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive. 4. For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him. 5. Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and their faces for the deception of the mind; for every woman who uses deceit in these things is reserved for eternal punishment. 6. For in this way they also
    charmed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were changing themselves into the form of men and appearing to them while they were with their husbands. 7. And they also, desiring in their minds their appearance, gave birth to giants[d][c]. For the Watchers appeared to them as reaching up to heaven.
translation:
  language: hi
  text: '**रूबेन का वसीयतनामा 5**


    1. क्योंकि स्त्रियाँ दुष्ट हैं, मेरे बच्चो; और पुरुष पर उनका अधिकार या सामर्थ्य न होने के कारण वे अपने रूप-रंग[a] से छल करती हैं, ताकि उसे अपनी ओर खींच लें। 2. और जिसे वे रूप-रंग से मोहित नहीं कर पातीं, उसे छल के द्वारा वश में कर लेती हैं।


    3. क्योंकि परमेश्वर के एक स्वर्गदूत ने भी मुझे उनके विषय में बताया और मुझे सिखाया कि स्त्रियाँ पुरुष की अपेक्षा व्यभिचार की आत्मा से अधिक पराजित होती हैं। वे अपने हृदय में पुरुषों के विरुद्ध बातें गढ़ती हैं; सजने-सँवरने के द्वारा उनके मनों को भटका देती हैं, और अपनी दृष्टि से विष बोती हैं। पहले विचार में और फिर कर्म के द्वारा वे उन्हें बंदी बना लेती हैं। 4. क्योंकि कोई स्त्री पुरुष को सामने से बलपूर्वक वश में नहीं कर सकती, पर वेश्या जैसे हाव-भाव से उसके विरुद्ध चालाकी करती है।


    5. इसलिए, मेरे बच्चो, व्यभिचार से भागो। अपनी पत्नियों और बेटियों को आज्ञा दो कि वे मन को छलने के लिए अपने सिर और चेहरे न सजाएँ; क्योंकि जो भी स्त्री इन बातों के द्वारा छल करती है, वह अनन्त दण्ड के लिए रखी गई है।


    6. इसी प्रकार उन्होंने जलप्रलय से पहले प्रहरियों[b] को भी मोहित किया था। क्योंकि वे उन्हें निरन्तर देखते रहे और उनकी लालसा में पड़ गए, और उन्होंने अपने मन में उस कर्म की कल्पना की। वे अपना रूप पुरुषों जैसा बना लेते थे और जब वे स्त्रियाँ अपने पतियों के साथ सहवास में थीं, तब उन्हें दिखाई देते थे। 7. और वे स्त्रियाँ भी मन में उनकी छवि की लालसा करके दैत्यों को जन्म दिया।[c] क्योंकि प्रहरी उन्हें ऐसे दिखाई देते थे, मानो वे आकाश तक पहुँचते हों।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 1–2 में अनूदित यूनानी शब्द का अर्थ “बाहरी रूप,” “आकृति” या “प्रस्तुति का ढंग” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “प्रहरी” उन स्वर्गीय प्राणियों के लिए प्रयुक्त नाम है जो जलप्रलय से पहले के समय से जुड़ी यहूदी परम्पराओं में मिलते हैं; बाद की व्याख्यात्मक परम्परा में उत्पत्ति 6 और विशेष रूप से 1 हनोक से तुलना करें।
    reason: cross_reference
  - marker: c
    text: पद 6–7 की भाषा प्रहरियों की लालसा और दैत्यों के जन्म के विषय में विकसित व्याख्यात्मक परम्परा को प्रतिबिम्बित करती है।
    reason: cultural_note
  - marker: d
    text: 'अन्तिम कथन को अतिशयोक्ति के रूप में भी समझा जा सकता है: प्रहरी स्त्रियों को इतने ऊँचे दिखाई देते थे मानो आकाश तक पहुँच रहे हों।'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηραί
  choice: दुष्ट
  rationale: मूल के कठोर नैतिक कथन को बिना नरम किए स्वाभाविक हिन्दी में रखता है।
- source_word: σχήμασιν / τοῦ σχήματος
  choice: रूप-रंग
  rationale: सन्दर्भ में बाहरी रूप, प्रस्तुति और आकर्षक ढंग का बोध देता है; व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: δολιεύονται
  choice: छल करती हैं
  rationale: निरन्तर कपटपूर्ण व्यवहार का अर्थ देता है और μηχανῶνται से अनावश्यक रूप से नहीं मिलाता।
- source_word: καταγοητεῦσασθαι
  choice: मोहित करना
  rationale: जादू-जैसे बहकावे की प्रबलता बचाते हुए आधुनिक पाठक के लिए सहज है।
- source_word: ἡττῶνται τῷ πνεύματι τῆς πορνείας
  choice: व्यभिचार की आत्मा से ... पराजित होती हैं
  rationale: निष्क्रिय क्रिया और आत्मिक/व्यक्तीकृत शक्ति—दोनों को बनाए रखता है।
- source_word: ἐν καρδίᾳ μηχανῶνται
  choice: अपने हृदय में ... बातें गढ़ती हैं
  rationale: भीतरी विचार-विन्यास को व्यक्त करता है और δολιεύονται के छल-कपट से शब्दार्थिक भेद रखता है।
- source_word: διὰ τῆς κοσμήσεως
  choice: सजने-सँवरने के द्वारा
  rationale: कोस्मेसिस के बाहरी अलंकरण को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  choice: अपनी दृष्टि से विष बोती हैं
  rationale: मूल की विष बोने वाली सजीव उपमा सुरक्षित रखता है।
- source_word: οἱ Ἐγρήγοροι
  choice: प्रहरी
  rationale: यहूदी प्रलय-पूर्व परम्परा के विशिष्ट स्वर्गीय प्राणियों के लिए संक्षिप्त तकनीकी पद है।
- source_word: γίγαντας
  choice: दैत्य
  rationale: प्राचीन परम्परा के असाधारण विशाल प्राणियों का सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: स्त्रियों के विषय में कठोर सामान्यीकरण
  choice: इसे रूबेन के चेतावनी-वचन के रूप में सीधे अनूदित किया गया है।
  alternative: कथन को केवल अनैतिक स्त्रियों तक सीमित करके नरम करना।
  rationale: मूल यूनानी की असुविधाजनक और लिंग-विशिष्ट वक्तृता को सम्पादकीय सुधार के बिना पारदर्शी रखना आवश्यक है।
- issue: πνεῦμα τῆς πορνείας का स्वरूप
  choice: “व्यभिचार की आत्मा”
  alternative: “कामुक प्रवृत्ति”
  rationale: ‘आत्मा’ पाठ की आत्मिक अथवा व्यक्तीकृत शक्ति की सम्भावना को खुला रखती है; इसे केवल मनोवैज्ञानिक आवेग नहीं बनाया गया।
- issue: प्रहरियों और दैत्यों की परम्परा
  choice: दोनों विशिष्ट पद मुख्य पाठ में रखे गए हैं।
  alternative: उन्हें केवल शक्तिशाली मनुष्यों के रूप में समझाकर अनूदित करना।
  rationale: पाठ द्वितीय-मन्दिरकालीन यहूदी व्याख्यात्मक परम्परा को स्पष्ट रूप से प्रतिबिम्बित करता है; उसकी पौराणिक-धार्मिक बनावट को बनाए रखना चाहिए।
- issue: पद 6 में प्रहरियों का स्त्रियों को दिखाई देना
  choice: “जब वे स्त्रियाँ अपने पतियों के साथ होती थीं, तब उन्हें दिखाई देते थे”
  alternative: “वे उनके पतियों के सहवास में उनके साथ प्रकट होते थे”
  rationale: यूनानी वाक्य कठिन है; चुना गया रूप सम्बन्धों को पूर्णतः सिद्धान्तबद्ध किए बिना अंग्रेज़ी परामर्श-पाठ की सम्भावित समझ को स्वाभाविक हिन्दी में रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण चेतावनी-शैली और सामान्य पाठक के लिए सुबोध रखी गई है। “मेरे बच्चो,” “हृदय,” “व्यभिचार की आत्मा,” “अनन्त दण्ड” और “जलप्रलय” जैसे पद पाठ की धार्मिक बनावट बनाए रखते हैं। कठिन और कठोर कथनों को न तो नरम किया गया है, न किसी सम्प्रदायगत व्याख्या से समझाया गया है।
