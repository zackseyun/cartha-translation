  text: For God will execute vengeance on them, but you will die an evil death.
translation:
  language: hi
  text: क्योंकि परमेश्वर उनसे बदला लेगा, पर तुम बुरी मौत मरोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: उनसे बदला लेगा
  rationale: यह पदबंध स्वाभाविक हिन्दी में परमेश्वर द्वारा उन पर प्रतिशोध किए जाने का भाव व्यक्त करता है। पांडुलिपि-पाठ में कुछ अस्थिरता है, पर प्रसंग और परामर्श-पाठ कर्म के लक्ष्य के रूप में ‘उनसे’ का समर्थन करते हैं।
- source_word: ἀποθανεῖτε θανάτῳ πονηρῷ
  choice: बुरी मौत मरोगे
  rationale: यूनानी संज्ञा-सजातीय रचना का संक्षिप्त और स्वाभाविक हिन्दी रूप; πονηρός के नैतिक तथा दुखद दोनों संभावित भावों को ‘बुरी’ खुला रखता है।
theological_decisions:
- issue: प्रतिशोध का कर्ता और लक्ष्य
  choice: परमेश्वर कर्ता है और ‘वे’ प्रतिशोध के लक्ष्य हैं
  alternative: परमेश्वर ‘उनका बदला’ लेगा
  rationale: दिए गए यूनानी पाठ की पाठगत कठिनाई के बावजूद समीक्षित अर्थ ‘उन पर/उनसे बदला’ है; इससे यह अनुचित निष्कर्ष नहीं निकलता कि परमेश्वर उनकी ओर से किसी तीसरे पक्ष से बदला लेता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और सामान्य पाठकों के लिए सहज शैली। ‘बदला लेना’ औपचारिक ‘प्रतिशोध करना’ की अपेक्षा अधिक स्वाभाविक है, जबकि वाक्य की धार्मिक गंभीरता बनी रहती है।
