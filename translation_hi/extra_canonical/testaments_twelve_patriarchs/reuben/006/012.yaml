id: T12P.REU.6.12
reference: Testament of Reuben 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/012.yaml
  text: And bow down to his offspring, because for your sake it will die in visible and invisible wars, and among you there will be an eternal king.
translation:
  language: hi
  text: और उसकी संतान को दण्डवत् प्रणाम करो, क्योंकि वह तुम्हारे लिए दृश्य और अदृश्य युद्धों में मर जाएगी; और तुम्हारे बीच एक अनन्त राजा होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκυνήσατε
  choice: दण्डवत करो
  rationale: यह क्रिया झुककर सम्मान या आराधना प्रकट करने का भाव रखती है; ‘दण्डवत करो’ मूल की शारीरिक और श्रद्धापूर्ण क्रिया को संक्षेप में बनाए रखता है।
- source_word: τὸ σπέρμα αὐτοῦ
  choice: उसकी संतान
  rationale: σπέρμα का शाब्दिक अर्थ ‘बीज’ है, पर वंशज या संतान के अर्थ में आधुनिक हिन्दी में ‘संतान’ अधिक स्वाभाविक है और इसका सामूहिक अर्थ भी संभव रहता है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए
  rationale: यहाँ ὑπέρ किसी के हित में या उसकी ओर से मृत्यु का भाव देता है; ‘तुम्हारे लिए’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν πολέμοις ὁρατοῖς καὶ ἀοράτοις
  choice: दृश्य और अदृश्य युद्धों में
  rationale: मूल में उपस्थित प्रत्यक्ष और अप्रत्यक्ष/अदृश्य संघर्षों के विरोध को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: βασιλεὺς αἰώνιος
  choice: एक अनन्त राजा
  rationale: αἰώνιος के दीर्घकालिक या अनन्त भाव को ‘अनन्त’ सीधे व्यक्त करता है; अनिश्चित विधेय संज्ञा के लिए ‘एक’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: σπέρμα का एकवचन रूप और सामूहिक अर्थ
  choice: ‘संतान’ रखा गया और अगले खंड में स्त्रीलिंग एकवचन ‘वह…मर जाएगी’ प्रयुक्त हुआ।
  alternative: ‘वंश’ या किसी एक पुरुष वंशज को सूचित करने वाला ‘वंशज’
  rationale: यूनानी नपुंसकलिंग एकवचन σπέρμα एक व्यक्ति या सामूहिक वंश—दोनों की ओर संकेत कर सकता है। ‘संतान’ इस तनाव को अपेक्षाकृत खुला रखता है और हिन्दी व्याकरण के अनुसार स्त्रीलिंग क्रिया लेता है।
- issue: अन्तिम खंड में राजा की पहचान
  choice: ‘तुम्हारे बीच एक अनन्त राजा होगा’ को स्वतंत्र अस्तित्ववाची कथन के रूप में रखा गया।
  alternative: ‘वही तुम्हारे बीच अनन्त राजा होगा’
  rationale: यूनानी पाठ अन्तिम खंड में स्पष्ट संकेतवाचक सर्वनाम नहीं देता। ‘वही’ जोड़ने से संतान और राजा की पहचान को मूल की अपेक्षा अधिक निश्चित कर दिया जाता।
- issue: προσκυνέω में सम्मान और आराधना का विस्तार
  choice: ‘दण्डवत करो’
  alternative: ‘आराधना करो’ या ‘झुको’
  rationale: मूल क्रिया संदर्भ के अनुसार श्रद्धापूर्ण प्रणाम से आराधना तक जा सकती है। ‘दण्डवत करो’ क्रिया को व्यक्त करता है, पर उसका धार्मिक स्तर अनावश्यक रूप से तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की असामान्य युद्ध-छवि तथा संतान और अनन्त राजा के बीच मूल में मौजूद अस्पष्ट संबंध को व्याख्या द्वारा समतल नहीं किया गया।
