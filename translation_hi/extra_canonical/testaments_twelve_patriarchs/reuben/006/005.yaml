review_pass:
  verdict: revise
  source_fidelity: Draft accurately renders the address, envy, Levi's sons, and the repeated causal phrase. However, ‘इच्छा रखोगे’ understates ζητήσετε (‘will seek/try’), whereas the Greek expresses an active pursuit of being exalted. The passive infinitive ὑψωθῆναι should remain passive and its agent unstated.
  naturalness: The draft is generally clear and modern. ‘उनसे ऊँचे किए जाने की इच्छा रखोगे’ is understandable but somewhat cumbersome. ‘उनसे ऊँचा किए जाने का प्रयास करोगे’ is more idiomatic while retaining the passive construction.
  terminology: ‘ईर्ष्या करोगे’ is appropriate for ζηλώσετε in this context. ‘लेवी के पुत्र’ correctly preserves the potentially literal or corporate sense. ‘ऊँचा किया जाना’ suitably represents exaltation without specifying who exalts them. ‘सफल नहीं हो सकोगे’ is an acceptable contextual rendering of οὐ ἰσχύσετε.
  issues:
  - severity: medium
    issue: ‘इच्छा रखोगे’ does not fully convey ζητήσετε.
    rationale: ζητήσετε denotes seeking or attempting, not merely desiring. Replacing it with ‘प्रयास करोगे’ preserves the force of purposeful pursuit.
  revised_text: 'इसलिए मैं तुमसे कहता हूँ: तुम लेवी के पुत्रों से ईर्ष्या करोगे और उनसे ऊँचा किए जाने का प्रयास करोगे; पर इसी कारण तुम सफल नहीं हो सकोगे।'
