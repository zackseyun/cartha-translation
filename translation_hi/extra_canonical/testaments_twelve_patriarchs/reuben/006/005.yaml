base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/005.yaml
  text: 'Therefore I say to you: you will envy the sons of Levi and seek to be exalted above them, but because of this you will not prevail.'
translation:
  language: hi
  text: 'इसलिए मैं तुमसे कहता हूँ: तुम लेवी के पुत्रों से ईर्ष्या करोगे और उनसे ऊँचा किए जाने का प्रयास करोगे; पर इसी कारण तुम सफल नहीं हो सकोगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλώσετε
  choice: ईर्ष्या करोगे
  rationale: यहाँ क्रिया का संदर्भ लेवी के पुत्रों की प्रतिष्ठा चाहने से है; इसलिए ‘ईर्ष्या करना’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: τοὺς υἱοὺς τοῦ Λευὶ
  choice: लेवी के पुत्रों
  rationale: वंश अथवा वास्तविक पुत्रों—दोनों की सम्भावना को मूल अभिव्यक्ति की तरह खुला रखता है।
- source_word: ζητήσετε ὑψωθῆναι ὑπὲρ αὐτούς
  choice: उनसे ऊँचे किए जाने की इच्छा रखोगे
  rationale: ὑψωθῆναι के निष्क्रिय रूप को बनाए रखते हुए ὑπὲρ αὐτούς का तुलनात्मक भाव स्पष्ट किया गया है।
- source_word: οὐ ἰσχύσετε
  choice: सफल नहीं हो सकोगे
  rationale: संदर्भ में यह उनकी ऊँचा होने की चेष्टा के विफल रहने को व्यक्त करता है; साथ ही क्षमता/सामर्थ्य का भाव ‘सकोगे’ में बना रहता है।
theological_decisions:
- issue: लेवी के पुत्रों से ऊँचा किया जाना
  choice: निष्क्रिय ‘ऊँचे किए जाने’ को बनाए रखा
  alternative: अपने आपको उनसे ऊँचा उठाना
  rationale: मूल यूनानी में निष्क्रिय infinitive है; कर्ता को स्पष्ट न करके सम्भावित दैवी अथवा सामाजिक उन्नयन की अस्पष्टता सुरक्षित रखी गई है।
- issue: विफलता का कारण
  choice: ‘इसी कारण’ को अंतिम निषेध से जोड़ा
  alternative: सामान्य परिणामसूचक ‘इसलिए’
  rationale: διὰ τοῦτο की पुनरावृत्ति ईर्ष्या और ऊँचा किए जाने की चाह को उनकी असफलता का कारण बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष वाक्य-विन्यास अपनाया गया है। ‘तुम’ बहुवचन संबोधन के रूप में प्रयुक्त है। मूल के निष्क्रिय भाव और कारणात्मक तनाव को सुरक्षित रखा गया है।
