translation:
  language: hi
  text: समयों की पूर्णता तक [महायाजक मसीह के, जिसके विषय में प्रभु ने कहा था]।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως τελειώσεως χρόνων
  choice: समयों की पूर्णता तक
  rationale: यह पदबंध τελείωσις के ‘पूर्णता/समापन’ और χρόνοι के बहुवचन ‘समयों’ को बनाए रखता है।
- source_word: ἀρχιερέως χριστοῦ
  choice: महायाजक मसीह
  rationale: ἀρχιερεύς का स्वाभाविक हिन्दी रूप ‘महायाजक’ है और χριστός को यहाँ उपाधि के रूप में ‘मसीह’ रखा गया है; हिन्दी में संबंध स्पष्ट करने के लिए कोष्ठक के भीतर ‘के समयों की’ दोहराया गया है।
- source_word: ὃν εἶπε Κύριος
  choice: जिसके विषय में प्रभु ने कहा था
  rationale: संबंधवाचक सर्वनाम का पूर्वपद मसीह है; ‘के विषय में’ εἶπε के आशय को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘था’ पूर्व कथन का संकेत देता है।
theological_decisions:
- issue: χριστοῦ को सामान्य ‘अभिषिक्त’ या उपाधि ‘मसीह’ के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: इस संदर्भ में महायाजक के साथ χριστός उपाधि-सदृश है। ‘मसीह’ स्रोत की मसीही अपेक्षा को सुरक्षित रखता है, बिना किसी अतिरिक्त साम्प्रदायिक पहचान को पाठ में जोड़ने के।
- issue: कोष्ठकित शब्दों की पाठीय स्थिति
  choice: वर्ग कोष्ठक बनाए रखे गए
  alternative: शब्दों को बिना कोष्ठक मुख्य पाठ में शामिल करना
  rationale: स्रोत संस्करण में पूरा खंड वर्ग कोष्ठकों में है; उसे बनाए रखने से संपादकीय/पाठालोचनात्मक अनिश्चितता छिपती नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल के वर्ग कोष्ठक ज्यों के त्यों सुरक्षित हैं। ‘के समयों की’ की पुनरावृत्ति हिन्दी में संबंध स्पष्ट करती है, यद्यपि यूनानी में संज्ञा दोहराई नहीं गई है।
