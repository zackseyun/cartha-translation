  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/009.yaml
  text: I adjure you by the God of heaven, that each of you do truth toward his neighbor and that each have love toward his brother.
translation:
  language: hi
  text: मैं तुम्हें स्वर्ग के परमेश्वर की शपथ दिलाता हूँ कि तुममें से हर एक अपने पड़ोसी के साथ सच्चाई से व्यवहार करे और अपने भाई से प्रेम रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρκῶ ὑμᾶς τὸν Θεὸν τοῦ οὐρανοῦ
  choice: मैं तुम्हें स्वर्ग के परमेश्वर की शपथ दिलाता हूँ
  rationale: Ὁρκῶ की गंभीर शपथपूर्वक आज्ञा को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; परमेश्वर इस शपथ के साक्षी/आधार हैं।
- source_word: ποιεῖν ἀλήθειαν
  choice: सच्चाई से व्यवहार करे
  rationale: शाब्दिक ‘सत्य करना’ हिन्दी में अस्वाभाविक है। यह वाक्यांश पड़ोसी के प्रति ईमानदार और सत्यनिष्ठ आचरण को सूचित करता है, इसलिए अर्थ और क्रियात्मक बल दोनों सुरक्षित रखे गए हैं।
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: अपने पड़ोसी के साथ
  rationale: πλησίον के संबंधपरक अर्थ के लिए प्रचलित बाइबलीय शब्द ‘पड़ोसी’ रखा गया है; πρὸς को हिन्दी में स्वाभाविक संबंधसूचक ‘के साथ’ से व्यक्त किया गया है।
- source_word: ἀγάπην ἔχειν ... πρὸς τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई से प्रेम रखे
  rationale: ἀγάπην ἔχειν का स्थायी भाव ‘प्रेम रखना’ से आता है; ἀδελφός के व्यापक या वास्तविक भ्रातृ-अर्थ को बिना सीमित किए ‘भाई’ रखा गया है।
theological_decisions:
- issue: ‘भाई’ का दायरा
  choice: भाई
  alternative: संगी विश्वासी / बंधु
  rationale: मूल ἀδελφός वास्तविक भाई या समुदाय के सदस्य—दोनों अर्थ दे सकता है। ‘भाई’ इस संभावित व्यापकता को बनाए रखता है और कोई विशिष्ट सामुदायिक व्याख्या आरोपित नहीं करता।
- issue: ‘सच्चाई करना’ की सेमिटिक अभिव्यक्ति
  choice: सच्चाई से व्यवहार करे
  alternative: सत्य करे / सच्चाई पर चले
  rationale: ‘सच्चाई से व्यवहार’ सत्यनिष्ठ आचरण का नैतिक बल स्पष्ट करता है, जबकि ‘सत्य करे’ आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर वसीयतनुमा उपदेश का स्वर रखा गया है। ‘तुम्हें’ सामूहिक संबोधन है और ‘तुममें से हर एक’ यूनानी ἕκαστος की व्यक्तिगत जिम्मेदारी को स्पष्ट करता है।
