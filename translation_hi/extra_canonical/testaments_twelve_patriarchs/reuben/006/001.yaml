  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/001.yaml
  text: Guard yourselves, therefore, from sexual immorality, and keep your mind pure. Guard also your senses from every woman.
translation:
  language: hi
  text: इसलिए यौन दुराचार से अपनी रक्षा करो और अपने मन को शुद्ध रखो। अपनी इंद्रियों को भी हर स्त्री से[a] बचाए रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी शब्द-विन्यास असामान्य है; संभव अर्थ: “स्त्रियों से जुड़ी हर बात से।”'
    reason: ἀπὸ πάσης γυναικῶν में एकवचन और बहुवचन का व्याकरणिक मेल नहीं है। मुख्य पाठ निकटतम पारंपरिक अर्थ देता है, जबकि यह टिप्पणी वास्तविक पाठगत अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: πορνείας
  choice: यौन दुराचार
  rationale: यह πορνεία के व्यापक अर्थ—अनैतिक यौन आचरण—को व्यक्त करता है; केवल ‘व्यभिचार’ कहने से अर्थ विवाहित व्यक्ति के विवाहेतर संबंध तक सीमित हो सकता था।
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: मन से शुद्ध रहो
  rationale: यूनानी निरंतर शुद्ध बने रहने का आग्रह करता है। ‘मन से’ διανοίᾳ का स्वाभाविक हिन्दी रूप है और विचारों की आंतरिक शुद्धता पर बल बनाए रखता है।
- source_word: τὰς αἰσθήσεις ὑμῶν
  choice: अपनी इंद्रियों को
  rationale: αἰσθήσεις का मूल अर्थ अनुभूति या संवेदना की शक्तियाँ है; ‘इंद्रियाँ’ संक्षिप्त, स्वाभाविक और संदर्भानुकूल है।
- source_word: ἀπὸ πάσης γυναικῶν
  choice: हर स्त्री से
  rationale: प्राप्त यूनानी वाक्यांश व्याकरण की दृष्टि से असंगत है, पर परंपरागत रूप से इसका आशय ‘हर स्त्री से’ समझा गया है। इसी मुख्य अर्थ को पाठ में रखा गया और असंगति को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: स्त्रियों के संबंध में निषेध का विस्तार
  choice: हर स्त्री से
  alternative: स्त्रियों से जुड़ी हर बात से
  rationale: यूनानी पाठ की असामान्य बनावट के कारण अधिक व्यापक वैकल्पिक अर्थ संभव है, लेकिन निकटतम और परंपरागत पाठार्थ ‘हर स्त्री से’ है। अनिश्चितता को बिना छिपाए पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और उपदेशात्मक शैली रखी गई है। ‘बचाए रखो’ निरंतर सावधानी का भाव देता है, जबकि ‘यौन दुराचार’ πορνεία को ‘व्यभिचार’ से अधिक व्यापक रूप में व्यक्त करता है।
