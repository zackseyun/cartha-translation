id: T12P.REU.6.3
reference: Testament of Reuben 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/003.yaml
  text: For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a destructive disgrace of Beliar and an everlasting reproach.
translation:
  language: hi
  text: क्योंकि लगातार मिलना-जुलना, चाहे अधर्मी काम किया न भी जाए, फिर भी उनके लिए एक लाइलाज रोग है, और हमारे लिए बलियार का विनाशकारी कलंक और अनन्त कलंक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεχεῖς συντυχίαι
  choice: लगातार मेल-जोल
  rationale: संदर्भ में बार-बार होने वाले संपर्क या भेंट को सहज आधुनिक हिन्दी में व्यक्त करता है; केवल आकस्मिक मुलाकात का अर्थ थोपने से बचता है।
- source_word: τὸ ἀσέβημα
  choice: अधर्म का काम
  rationale: ἀσέβημα किसी अधार्मिक या दुष्कर्म को सूचित करता है; यह चयन नैतिक गंभीरता बनाए रखते हुए किसी विशिष्ट कृत्य को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: νόσος ἀνίατος
  choice: लाइलाज रोग
  rationale: यूनानी मुहावरे का सीधा और सामान्य आधुनिक हिन्दी रूप।
- source_word: εἰς ὄλεθρον ὄνειδος
  choice: विनाशकारी कलंक
  rationale: εἰς ὄλεθρον के विनाश की ओर ले जाने वाले बल को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Βελίαρ
  choice: बलियार
  rationale: नाम का यूनानी रूप ध्वन्यात्मक ढंग से रखा गया है; इसे किसी अतिरिक्त धर्मवैज्ञानिक पद से नहीं बदला गया।
- source_word: ὄνειδος αἰώνιον
  choice: सदा का अपमान
  rationale: स्थायी या चिरकालिक निंदा का अर्थ स्पष्ट, स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: बलियार और विनाशकारी कलंक के बीच संबंध
  choice: बलियार की ओर से विनाशकारी कलंक
  alternative: बलियार का विनाशकारी कलंक
  rationale: यूनानी संबंध कुछ संक्षिप्त और तनावपूर्ण है। ‘की ओर से’ बलियार को इस कलंक के स्रोत या कारक के रूप में समझने की संभावना रखता है और हिन्दी में इसे स्वयं बलियार पर लगे कलंक के रूप में पढ़े जाने से बचाता है।
- issue: ἀσέβημα की विशिष्टता
  choice: अधर्म का काम
  alternative: वह अधर्म का काम
  rationale: यूनानी निश्चित पदबंध होने पर भी इस पद में कृत्य स्पष्ट रूप से नामित नहीं है; हिन्दी अनुवाद उसी अनिर्दिष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। वाक्य की नैतिक चेतावनी और कारणसूचक आरंभ बनाए रखा गया है। ‘उनके’ में यूनानी स्त्रीलिंग αὐταῖς का संदर्भ निहित है, जबकि हिन्दी में अनावश्यक संज्ञा जोड़कर संदर्भ को अधिक स्पष्ट नहीं किया गया।
