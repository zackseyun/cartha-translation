lexical_decisions:
- source_word: πορνεία
  choice: व्यभिचार
  rationale: यहाँ शब्द अनैतिक यौन आचरण को व्यक्त करता है; ‘व्यभिचार’ प्रसंग के अनुरूप संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: σύνεσιν
  choice: समझ
  rationale: यह बोध और विवेक की क्षमता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: ग्रीक शब्द धार्मिक श्रद्धा और ईश्वरपरायणता का भाव रखता है; ‘भक्ति’ सामान्य पाठक के लिए स्वाभाविक है और अर्थ को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: इस नकारात्मक प्रसंग में ζῆλος का अर्थ ईर्ष्या या जलन है; ‘ईर्ष्या’ मूल की तीव्र प्रतिद्वंद्वी भावना को बनाए रखती है।
- source_word: ἐπιθυμίᾳ
  choice: लालसा
  rationale: यह प्रबल, विशेषतः यौन, इच्छा का संकेत देता है; ‘लालसा’ उस नकारात्मक तीव्रता को स्वाभाविक हिन्दी में रखती है।
- source_word: κατοικεῖ
  choice: वास करती है
  rationale: मूल के ‘निवास करना’ रूपक को औपचारिक किन्तु सुबोध हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: εὐσέβεια का धार्मिक आशय
  choice: भक्ति
  alternative: ईश्वरपरायणता / परमेश्वर के प्रति श्रद्धा
  rationale: मूल में धार्मिक सदाचार का अर्थ है, पर ‘भक्ति’ उसी आशय को संक्षेप में रखती है और व्याख्यात्मक विस्तार से बचती है।
- issue: πορνεία का दायरा
  choice: व्यभिचार
  alternative: यौन अनैतिकता
  rationale: ‘व्यभिचार’ पाठ की गरिमा और संक्षिप्तता बनाए रखता है, यद्यपि मूल शब्द का दायरा कुछ प्रसंगों में व्यापक यौन अनैतिकता तक हो सकता है।
