  text: Καὶ πρὸς τὸν⁶⁵ Λευὶ ἐγγίσατε⁶⁶ ἐν ταπεινώσει καρδίας Γὑμῶν⌉⁶⁷, ἵνα * δέξησθε εὐλογίαν⁶⁸ ἐκ τοῦ⁶⁹ στόματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/010.yaml
  text: And draw near to Levi in humility of your heart, so that you may receive a blessing from his mouth.
translation:
  language: hi
  text: और अपने हृदय की दीनता में लेवी के निकट आओ, ताकि तुम उसके मुख से आशीष पाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσατε
  choice: निकट आओ
  rationale: आज्ञार्थक बहुवचन का सीधा और स्वाभाविक हिन्दी रूप; यह लेवी के पास आदरपूर्वक आने का भाव बनाए रखता है।
- source_word: ἐν ταπεινώσει καρδίας ὑμῶν
  choice: अपने हृदय की दीनता में
  rationale: यूनानी में ‘तुम्हारे हृदय’ स्पष्ट है; ‘दीनता’ ταπείνωσις के विनम्र और नम्र मनोभाव को गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: δέξησθε εὐλογίαν
  choice: आशीष पाओ
  rationale: δέχομαι के ग्रहण करने के भाव को सहज हिन्दी में व्यक्त करता है और εὐλογία का पारंपरिक, व्यापक रूप ‘आशीष’ रखता है।
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: उसके मुख से
  rationale: स्रोत की शाब्दिक छवि सुरक्षित रखी गई है, जिसमें लेवी द्वारा उच्चारित आशीष अभिप्रेत है।
theological_decisions:
- issue: लेवी के मुख से मिलने वाली आशीष का स्वरूप
  choice: ‘उसके मुख से आशीष’ की स्रोतगत अभिव्यक्ति को यथावत रखा
  alternative: ‘उससे आशीष’ या ‘उसके द्वारा परमेश्वर की आशीष’
  rationale: मूल पाठ आशीष के अंतिम स्रोत या पुरोहितीय माध्यम की व्याख्या नहीं करता; अतिरिक्त धर्मवैज्ञानिक स्पष्टीकरण जोड़े बिना उसकी खुली हुई अभिव्यक्ति बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। बहुवचन संबोधन को ‘आओ’ और ‘तुम’ से स्पष्ट किया गया है।
