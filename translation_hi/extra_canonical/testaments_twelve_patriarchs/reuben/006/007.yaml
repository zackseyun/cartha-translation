  text: For to Levi God gave the priesthood, and to Judah with him the kingdom.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने लेवी को याजकपद और उसके साथ यहूदा को राजसत्ता दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λευί
  choice: लेवी
  rationale: खंडित यूनानी पाठ में स्पष्ट रूप से पहचाने जा सकने वाले नाम का मानक हिन्दी रूप।
- source_word: ἱερωσύνη (अंग्रेज़ी परामर्श-पाठ द्वारा प्रमाणित पुनर्निर्माण)
  choice: याजकपद
  rationale: यह किसी एक याजक के कार्य के बजाय लेवी को दिए गए संस्थागत पद और अधिकार को व्यक्त करता है।
- source_word: βασιλεία (अंग्रेज़ी परामर्श-पाठ द्वारा प्रमाणित पुनर्निर्माण)
  choice: राजसत्ता
  rationale: यहाँ आशय भौगोलिक राज्य से अधिक यहूदा को दिए गए शासनाधिकार का है; इसलिए ‘राजसत्ता’ अधिक सटीक है।
theological_decisions:
- issue: लेवी के याजकपद और यहूदा की राजसत्ता का संबंध
  choice: दोनों को अलग-अलग दिए गए, पर परस्पर संबद्ध पदों के रूप में रखा गया है।
  alternative: लेवी को याजकपद और यहूदा को उसके अधीन राजसत्ता मिली।
  rationale: ‘उसके साथ’ संबंध को व्यक्त करता है, अधीनता को नहीं; पाठ में निहित न होने वाली पदानुक्रमात्मक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। उपलब्ध यूनानी पंक्ति अत्यंत खंडित/विकृत है, इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य मानते हुए केवल उसके द्वारा समर्थित अर्थ रखा गया है; कोई अतिरिक्त धर्मवैज्ञानिक विवरण नहीं जोड़ा गया।
