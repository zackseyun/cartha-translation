  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/002.yaml
  text: And command those women likewise not to associate with men, so that they too may be pure in mind.
translation:
  language: hi
  text: और उन स्त्रियों को भी आज्ञा दो कि वे पुरुषों के साथ मेल-जोल न रखें, ताकि वे भी मन से शुद्ध रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκείνας
  choice: उन स्त्रियों को भी
  rationale: καί और ἐκείνας दोनों का भाव रखते हुए पहले से उल्लिखित स्त्रियों की ओर संकेत स्पष्ट किया गया है।
- source_word: ἐντέλλεσθε
  choice: आज्ञा दो
  rationale: यह आज्ञा देने के अर्थ वाला वर्तमान आदेश है; हिन्दी में स्वाभाविक बहुवचन/आदरार्थक आदेश के रूप में प्रस्तुत किया गया है।
- source_word: μὴ συνδιάζειν τοῖς ἀνδράσιν
  choice: कि वे पुरुषों के साथ मेल-जोल न रखें
  rationale: συνδιάζειν का आशय साथ उठने-बैठने या संगति रखने से है; मूल में निहित न होने वाली यौन या अत्यधिक निकटता को जोड़े बिना सामान्य सामाजिक संबंध का भाव रखा गया है।
- source_word: καθαρεύωσι τῇ διανοίᾳ
  choice: मन से शुद्ध रहें
  rationale: καθαρεύωσι की शुद्ध अवस्था और διάνοια के मानसिक/आंतरिक क्षेत्र को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: शुद्धता का क्षेत्र
  choice: मन से शुद्ध रहें
  alternative: अपने मन को शुद्ध रखें
  rationale: मूल का καθαρεύωσι अकर्मक है—‘शुद्ध हों/रहें’; इसलिए इसे स्वयं मन को सक्रिय रूप से शुद्ध रखने की क्रिया में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मेल-जोल’ συνδιάζειν की व्यापकता बनाए रखता है और मूल से अधिक विशिष्ट नैतिक या यौन अर्थ आरोपित नहीं करता।
