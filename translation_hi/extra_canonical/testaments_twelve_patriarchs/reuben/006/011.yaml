  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘इस्राएल’, ‘यहूदा’, ‘प्रभु’ और ‘आशीष’ बाइबलीय प्रयोग के अनुरूप हैं।
