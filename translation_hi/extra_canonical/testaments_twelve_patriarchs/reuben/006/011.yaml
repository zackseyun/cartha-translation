  text: For he will bless Israel and Judah, because in him the Lord chose to reign before all the people.
translation:
  language: hi
  text: क्योंकि वह इस्राएल और यहूदा को आशीष देगा, क्योंकि प्रभु ने उसी में सब लोगों के सामने राज्य करना चुना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς
  choice: वह
  rationale: बलवाचक सर्वनाम है; प्रसंग में निर्दिष्ट पुरुष पर जोर रखता है।
- source_word: εὐλογήσει
  choice: आशीष देगा
  rationale: भविष्यकाल और धार्मिक अर्थ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: ग्रीक की स्थानिक/प्रतिनिधिक अभिव्यक्ति को जानबूझकर खुला रखा गया है; इसे ‘उसे’ बनाकर अर्थ निश्चित नहीं किया गया।
- source_word: ἐξελέξατο
  choice: चुनाव किया
  rationale: मध्यवाच्य क्रिया में प्रभु के स्वयं किए हुए चयन का भाव व्यक्त होता है।
- source_word: βασιλεύειν
  choice: राज्य करने
  rationale: अनंत क्रिया के शासकीय अर्थ को सीधे बनाए रखता है।
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: सब लोगों के सामने
  rationale: सार्वजनिक उपस्थिति/दृष्टि का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसी में’ का संबंध और राज्य करने वाला कर्ता
  choice: ‘प्रभु ने उसी में ... राज्य करने का चुनाव किया’
  alternative: ‘प्रभु ने उसे ... राज्य करने के लिए चुना’
  rationale: ग्रीक ἐν αὐτῷ और βασιλεύειν में यह तनाव बना रहता है कि प्रभु उसके माध्यम/व्यक्ति में राज्य करना चुनते हैं या उस व्यक्ति को राज्य के लिए चुनते हैं। अनुवाद ने मूल की संरचना और वास्तविक अस्पष्टता सुरक्षित रखी है।
