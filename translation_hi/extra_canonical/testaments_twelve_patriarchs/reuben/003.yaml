  text: 'And besides all these, there is an eighth spirit, the spirit of sleep, with which are created the trance of nature and the image of death.


    With these spirits are mixed the spirits of error. First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of insatiableness of the belly. Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive. Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood in destruction and jealousy, for shaping words and hiding one’s words from one’s own kin and household. Seventh, a spirit of injustice, with which come thefts and acts of greed, so that it may satisfy the pleasures of his heart. For injustice works together with the other spirits through taking and giving.


    And over all these the spirit of sleep is joined, which is the eighth spirit of error and fantasy. And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.


    And now, my children, love the truth, and it will keep you safe. Hear the words of Reuben your father, as I teach you. Do not pay attention to a woman’s appearance, nor keep company with a married woman, nor pry into the affairs of women.'
translation:
  language: hi
  text: 'इन सबके अतिरिक्त आठवीं आत्मा भी है—नींद की आत्मा। उसके साथ प्रकृति की मूर्छा और मृत्यु की छवि उत्पन्न होती हैं।


    इन आत्माओं के साथ भटकाव की आत्माएँ घुल-मिल जाती हैं। पहली, यौन अनैतिकता की आत्मा, मनुष्य के स्वभाव और उसकी इंद्रियों में बसी रहती है। दूसरी, पेट की अतृप्त लालसा की आत्मा है। तीसरी, लड़ाई-झगड़े की आत्मा है, जो जिगर और पित्त में रहती है। चौथी, रिझाने की चाह और जादू-टोने की आत्मा है, ताकि मनुष्य तरह-तरह के उपाय करके सुंदर दिखाई दे। पाँचवीं, घमंड की आत्मा है, ताकि वह डींग मारे और अपने को बड़ा समझे। छठी, झूठ की आत्मा है—विनाश और ईर्ष्या से जुड़ी—जिससे मनुष्य बातें गढ़ता और अपने ही कुल और घराने से अपनी बातें छिपाता है।[a] सातवीं, अन्याय की आत्मा है; उसके साथ चोरियाँ और लोभ के काम आते हैं, ताकि वह अपने हृदय की भोग-वासनाओं को तृप्त कर सके।[b] क्योंकि अन्याय लेन-देन के द्वारा बाकी आत्माओं के साथ मिलकर काम करता है।


    इन सबके ऊपर नींद की आत्मा आ जुड़ती है, जो भटकाव और कल्पना की आठवीं आत्मा है। इस प्रकार हर युवक नाश होता है: वह सत्य से दूर होकर अपने मन को अंधकारमय कर लेता है, परमेश्वर की व्यवस्था को नहीं समझता और अपने पुरखों की सीख नहीं सुनता—ठीक जैसे मैंने भी अपनी जवानी में दुःख उठाया।


    और अब, मेरे बच्चो, सत्य से प्रेम करो; वही तुम्हारी रक्षा करेगा। अपने पिता रूबेन की बातें सुनो; मैं तुम्हें शिक्षा देता हूँ। किसी स्त्री के रूप को मत निहारो, किसी विवाहित स्त्री की संगति मत करो और स्त्रियों के काम-काज में ताक-झाँक मत करो।


    [a] इस वाक्य का यूनानी पाठ कई स्थानों पर कठिन और संभवतः भ्रष्ट है; अनुवाद उपलब्ध शब्दों के सबसे संभावित संबंध को दर्शाता है।


    [b] “लोभ के काम” के पीछे का यूनानी शब्द दुर्लभ और पाठ की दृष्टि से अनिश्चित है; इसका आशय लालच से की गई हरकतें भी हो सकता है।'
  philosophy: optimal-equivalence
