    reason: γρηπίσματα दुर्लभ/अनिश्चित पाठ है और इसे बिना सूचना अत्यधिक निश्चित अर्थ देना उचित नहीं।
lexical_decisions:
- source_word: πνεῦμα
  choice: आत्मा
  rationale: अंश में व्यक्तिगत और नैतिक शक्तियों की गणना की गई है; ‘आत्मा’ मूल रूपक को बनाए रखती है, जबकि केवल ‘प्रवृत्ति’ कहना उसे व्याख्यात्मक रूप से सीमित कर देता।
- source_word: ἔκστασις φύσεως
  choice: प्रकृति की मूर्छा
  rationale: नींद से जुड़ी स्वाभाविक चेतनाहीन अवस्था का बोध कराता है और मृत्यु की छवि के साथ मूल समानांतरता बनाए रखता है।
- source_word: πλάνη
  choice: भटकाव
  rationale: यह केवल बौद्धिक ‘भ्रम’ नहीं, सत्य और उचित मार्ग से भटकने का नैतिक अर्थ भी व्यक्त करता है।
- source_word: πορνεία
  choice: यौन अनैतिकता
  rationale: व्यापक यूनानी नैतिक पद को किसी एक विशिष्ट यौन अपराध तक सीमित नहीं करता।
- source_word: ἀπληστεία γαστρός
  choice: पेट की अतृप्त लालसा
  rationale: शाब्दिक देहगत रूपक और असंयम—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀρέσκεια
  choice: दिखावा
  rationale: संदर्भ में दूसरों को आकर्षक दिखाई देने की चेष्टा है; ‘प्रसन्न करना’ यहाँ अपेक्षाकृत अस्पष्ट होता।
- source_word: μαγγανεία
  choice: जादू-टोना
  rationale: शब्द के टोने, छलपूर्ण जादुई उपाय या तंत्र-कर्म संबंधी अर्थ को सामान्य हिन्दी में व्यक्त करता है।
- source_word: μεγαλοφρονέω
  choice: अपने को बड़ा समझना
  rationale: ‘ऊँचे विचार रखना’ आधुनिक हिन्दी में सकारात्मक लग सकता है; चयन अहंकारी आत्म-महत्ता को स्पष्ट करता है।
- source_word: θηλεία ὕπανδρος
  choice: विवाहित स्त्री
  rationale: यूनानी का सीधा अर्थ ‘पति के अधीन/पति वाली स्त्री’ है; आधुनिक dignified हिन्दी में ‘विवाहित स्त्री’ स्वाभाविक है।
theological_decisions:
- issue: ‘आत्माओं’ को वास्तविक सत्ताएँ या मानवीय प्रवृत्तियाँ समझना
  choice: मूल के ‘आत्मा’ रूपक को ज्यों का त्यों रखा गया
  alternative: हर स्थान पर ‘प्रवृत्ति’ या ‘दोष’ कहना
  rationale: पाठ इस प्रश्न को स्पष्ट रूप से हल नहीं करता; व्याख्यात्मक प्रतिस्थापन उसकी वास्तविक अस्पष्टता और प्राचीन मानव-विज्ञान को मिटा देता।
- issue: ‘परमेश्वर की व्यवस्था’ का स्वरूप
  choice: सामान्य पद ‘परमेश्वर की व्यवस्था’
  alternative: इसे विशेष रूप से मूसा की व्यवस्था या किसी संप्रदायगत व्यवस्था के रूप में पहचानना
  rationale: νόμος τοῦ θεοῦ को उसके उपलब्ध अर्थ से अधिक विशिष्ट नहीं बनाया गया।
- issue: सत्य द्वारा रक्षा
  choice: ‘वही तुम्हारी रक्षा करेगा’
  alternative: रक्षा का कर्ता स्पष्ट रूप से परमेश्वर बताना
  rationale: यूनानी में स्त्रीलिंग सर्वनाम का निकटतम पूर्वपद ‘सत्य’ है; धर्मशास्त्रीय सहजता के लिए कर्ता बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। प्राचीन देह-विज्ञान (‘जिगर और पित्त’), क्रमबद्ध आत्माओं की भाषा और नैतिक तनाव को बनाए रखा गया है। अत्यधिक संस्कृतनिष्ठ शब्दावली तथा संप्रदायगत व्याख्या से बचते हुए कठिन पाठों को पादटिप्पणी में चिह्नित किया गया है।
