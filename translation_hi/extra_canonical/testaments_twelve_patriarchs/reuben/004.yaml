lexical_decisions:
- source_word: προσέχετε
  choice: ध्यान मत दो
  rationale: निषेधात्मक आज्ञा की शक्ति और लुभावनी सुंदरता की ओर ध्यान लगाने की चेतावनी—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐννοεῖσθε
  choice: मन मत लगाओ
  rationale: यह केवल सोचने नहीं, बल्कि भीतर ही भीतर ध्यान टिकाए रखने या उसी में उलझे रहने की चेतावनी देता है।
- source_word: ἁπλότης καρδίας
  choice: हृदय की निष्कपटता
  rationale: ‘सरलता’ की अपेक्षा ‘निष्कपटता’ यहाँ अविभाजित और छलरहित नैतिक भाव को अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: φόβῳ κυρίου
  choice: प्रभु के भय में
  rationale: मानक बाइबलीय नैतिक भाषा को नरम करके केवल ‘श्रद्धा’ नहीं बनाया गया है।
- source_word: μοχθοῦντες
  choice: परिश्रम करते रहो
  rationale: कठिन और अनुशासित श्रम का भाव बनाए रखता है तथा हिन्दी में स्वाभाविक है।
- source_word: γράμμασι
  choice: अध्ययन
  rationale: शाब्दिक ‘अक्षरों/लेखों’ के बजाय प्रसंग में शिक्षा या विद्या-अभ्यास का अर्थ अधिक स्पष्ट है।
- source_word: σύζυγον
  choice: पत्नी
  rationale: पिता द्वारा पुत्रों को दिए जा रहे उपदेश के प्रसंग में यह सीधा और उपयुक्त अर्थ है।
- source_word: παρρησίαν
  choice: सामना करने का साहस
  rationale: यहाँ खुले आत्मविश्वास या निर्भीक पहुँच का प्रसंगानुकूल हिन्दी रूप है।
- source_word: πορνεία
  choice: यौन-अनैतिकता
  rationale: व्यापक नैतिक दुर्गुण को किसी एक संकीर्ण यौन अपराध तक सीमित किए बिना आधुनिक पाठक के लिए स्पष्ट रखता है।
- source_word: βόθρος
  choice: गड्ढा
  rationale: आत्मा के लिए खतरे के मूर्त और प्रबल रूपक को सुरक्षित रखता है।
- source_word: ᾅδης
  choice: हेडीस
  rationale: मूल यूनानी के मृतक-अधोलोक संबंधी चित्र को ‘नरक’ जैसे अधिक धर्मशास्त्रीय रूप से भारित शब्द में नहीं बदलता।
- source_word: φάρμακα
  choice: जादुई औषधियाँ
  rationale: शब्द औषधि, मिश्रण या जादुई द्रव्य सूचित कर सकता है; निकटवर्ती जादूगरों का उल्लेख जादुई तैयारी के अर्थ का समर्थन करता है।
theological_decisions:
- issue: ᾅδης का अनुवाद
  choice: हेडीस
  alternative: अधोलोक; नरक; कब्र
  rationale: यूनानी शब्द को पहचानने योग्य रूप में रखा गया है और पादटिप्पणी में ‘मृतकों का अधोलोक’ समझाया गया है; इससे इसे बाद की विशिष्ट नरक-धारणा के समान नहीं ठहराया जाता।
- issue: यौन-अनैतिकता और मूर्तियों के बीच संबंध
  choice: मूर्तियों के निकट ले जाता है
  alternative: मूर्तिपूजा में लगा देता है
  rationale: यूनानी पाठ निकटता व्यक्त करता है, पूर्ण धर्मशास्त्रीय समानता नहीं; इसलिए संबंध को न तो मिटाया गया है, न बढ़ाया गया है।
- issue: πρόσκομμα τῷ Βελίαρ का कठिन पदबंध
  choice: बेलियार के लिए ठोकर का कारण
  alternative: बेलियार के द्वारा ठोकर; बेलियार के सामने अपराध
  rationale: पाठ अर्थ की दृष्टि से कठिन है। निकट रूप को पादटिप्पणी सहित रखने से अस्पष्टता ईमानदारी से सुरक्षित रहती है।
- issue: आज्ञापालन और पाप न करने का निरपेक्ष कथन
  choice: तुम निश्चय ही पाप नहीं करोगे
  alternative: तुम पाप से बचे रहोगे
  rationale: οὐ μὴ ἁμάρτητε की प्रबल निषेधात्मक/परिणामसूचक भाषा को धर्मशास्त्रीय रूप से नरम या पुनर्व्याख्यायित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण उपदेशात्मक शैली अपनाई गई है। वाक्य साधारण पाठकों के लिए स्पष्ट रखे गए हैं, पर ‘प्रभु का भय’, ‘हृदय की निष्कपटता’, ‘हेडीस’ और ‘बेलियार’ जैसे स्रोत-संवेदी पदों को अत्यधिक सरल नहीं किया गया। क्षतिग्रस्त स्रोत-खंडों और कठिन पदबंधों को पादटिप्पणियों में पारदर्शी बनाया गया है।
