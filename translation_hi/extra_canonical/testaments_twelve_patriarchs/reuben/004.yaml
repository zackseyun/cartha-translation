  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004.yaml
  text: '1[a]. Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.


    2[b]. For until my father''s death I did not have the boldness to look my father in the face.


    3. And because of the reproach of my sin, my mind was continually consumed within me.


    4. For seven months I was sick unto death, and after I had repented with purpose of soul before the Lord, the spirit of jealousy departed from me. Until now I have kept myself on guard, and I have not sinned.


    5. Therefore, my children, I tell you: keep everything that I command you, and you will certainly not sin.


    6. For the sin of sexual immorality is a pit for the soul, separating it from God and bringing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.


    7. For sexual immorality has destroyed many. Whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.


    8. For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from every kind of sexual immorality, and found favor before God and men.


    9. For the Egyptian woman did many things against him, and called in magicians and brought him potions; but Joseph guarded himself from every evil desire and did not accept the counsel of his soul toward wicked lust.


    10[c][d]. Therefore the God of your fathers delivered him from every hidden evil and from death.'
translation:
  language: hi
  text: '**रूबेन का वसीयतनामा 4**


    **1.** इसलिए, मेरे बच्चो, स्त्रियों की सुंदरता पर ध्यान मत दो और न उनके कामों पर मन लगाओ। बल्कि हृदय की निष्कपटता और प्रभु के भय में चलते रहो। भले कामों, अध्ययन और अपने पशु-झुंडों की देखभाल में परिश्रम करते रहो, जब तक प्रभु तुम्हें वह पत्नी न दे जिसे वह स्वयं चुनता है, ताकि तुम्हें मेरी तरह दुःख न उठाना पड़े।


    **2.** क्योंकि अपने पिता की मृत्यु तक मुझमें उनकी आँखों में देखने का साहस नहीं था।[a]


    **3.** मेरे पाप के कारण हुई निंदा से मेरा मन भीतर ही भीतर निरंतर घुलता रहा।


    **4.** मैं सात महीने तक मृत्यु के निकट बीमार रहा। जब मैंने मन के दृढ़ संकल्प के साथ प्रभु के सामने पश्चाताप किया, तब ईर्ष्या की आत्मा मुझसे दूर हो गई।[b] तब से अब तक मैं सावधान रहा हूँ और मैंने पाप नहीं किया।


    **5.** इसलिए, मेरे बच्चो, मैं तुमसे कहता हूँ: जो कुछ मैं तुम्हें आज्ञा देता हूँ, उस सबका पालन करो, और तुम निश्चय ही पाप नहीं करोगे।


    **6.** क्योंकि यौन-अनैतिकता का पाप आत्मा के लिए एक गड्ढा है। वह उसे परमेश्वर से अलग करके मूर्तियों के निकट ले जाता है; वही मन और समझ को भटका देता है और जवानों को उनके समय से पहले हेडीस में उतार देता है।[c]


    **7.** यौन-अनैतिकता ने बहुतों का नाश किया है। मनुष्य चाहे बूढ़ा हो या कुलीन, धनी हो या निर्धन, वह मनुष्यों के बीच अपने ऊपर निंदा लाता है और बेलियार के लिए ठोकर का कारण बनता है।[d]


    **8.** तुमने यूसुफ के विषय में सुना है कि उसने कैसे अपने आपको एक स्त्री से बचाए रखा, अपने विचारों को हर प्रकार की यौन-अनैतिकता से शुद्ध रखा, और परमेश्वर तथा मनुष्यों की कृपा पाई।


    **9.** उस मिस्री स्त्री ने उसके साथ बहुत कुछ किया; उसने जादूगरों को बुलाया और उसके लिए जादुई औषधियाँ लाई।[e] पर यूसुफ ने अपने आपको हर बुरी अभिलाषा से बचाए रखा और अपने मन की उस सलाह को स्वीकार नहीं किया जो दुष्ट वासना की ओर ले जाती थी।


    **10.** इसलिए तुम्हारे पूर्वजों के परमेश्वर ने उसे हर छिपी हुई बुराई और मृत्यु से छुड़ाया।


    **पादटिप्पणियाँ**


    [a] इस स्थान पर उपलब्ध यूनानी पाठ क्षतिग्रस्त या संक्षिप्त है। आशय यह है कि अपने पाप के कारण रूबेन में अपने पिता की मृत्यु तक उनकी आँखों में देखने का साहस नहीं था।


    [b] सात महीने की बीमारी और ईर्ष्या की आत्मा के चले जाने वाला वाक्य इस खंड की प्रचलित पाठ-परंपरा से मिलता है। उपलब्ध स्रोत-पाठ यहाँ संक्षिप्त है, इसलिए अनुवाद ने विद्यमान यूनानी आशय का सावधानी से अनुसरण किया है।


    [c] यूनानी में यहाँ **ᾅδης (हेडीस)** है—मृतकों का अधोलोक। इसे धर्मशास्त्रीय रूप से अधिक विशिष्ट “नरक” नहीं बनाया गया है।


    [d] “बेलियार के लिए ठोकर का कारण” यूनानी में एक कठिन और अर्थ की दृष्टि से असामान्य पदबंध है; इसलिए इसे व्याख्यात्मक रूप से सरल बनाने के बजाय निकटता से सुरक्षित रखा गया है।


    [e] यूनानी **φάρμακα** का अर्थ औषधियाँ, नशीले मिश्रण या जादुई द्रव्य हो सकता है। जादूगरों और प्रलोभन के प्रसंग के कारण यहाँ “जादुई औषधियाँ” किया गया है।'
  philosophy: optimal-equivalence
