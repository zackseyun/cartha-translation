id: T12P.REU.4.8
reference: Testament of Reuben 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Ἠκούσατε γὰρ περὶ Ἰωσὴφ πῶς ἐφύλαξεν ἑαυ- τὸν ἀπὸ⁶² γυναικός, καὶ τὰς ἐννοίας ἐκαθάρισεν⁶³ ἀπὸ πάσης⁶⁴ πορνείας, Γκαὶ⁶⁵ εὗρεν χάριν ἐνώπιον θεοῦ⁶⁶ καὶ ἀνθρώ- πων.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/008.yaml
  text: For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from all sexual immorality, and found favor before God and men.
translation:
  language: hi
  text: क्योंकि तुमने यूसुफ के विषय में सुना है कि उसने किस प्रकार अपने आपको एक स्त्री से बचाए रखा, अपने विचारों को सारी यौन-अनैतिकता से शुद्ध किया, और परमेश्वर तथा मनुष्यों की दृष्टि में अनुग्रह पाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαξεν ἑαυτόν
  choice: अपने आपको ... बचाए रखा
  rationale: क्रिया में स्वयं की सतर्क रक्षा का भाव है; यह हिन्दी में स्वाभाविक रहते हुए मूल का आत्म-संयम व्यक्त करता है।
- source_word: ἀπὸ γυναικός
  choice: एक स्त्री से
  rationale: मूल में अनिश्चित रूप से ‘स्त्री’ है; प्रसंगगत पहचान को अनावश्यक रूप से पाठ में नहीं जोड़ा गया।
- source_word: τὰς ἐννοίας
  choice: अपने विचारों को
  rationale: ἐννοίας आंतरिक विचारों या मन के इरादों को दर्शा सकता है; ‘विचारों’ से अर्थ व्यापक और सहज बना रहता है।
- source_word: πάσης πορνείας
  choice: सारी यौन-अनैतिकता से
  rationale: यह πάσης का समष्टिगत बल और πορνείας का व्यापक यौन-अनैतिकता संबंधी अर्थ सुरक्षित रखता है, बिना इसे केवल एक विशिष्ट कृत्य तक सीमित किए।
- source_word: εὗρεν χάριν ἐνώπιον
  choice: की दृष्टि में अनुग्रह पाया
  rationale: यह सामी-प्रभावित यूनानी मुहावरे का प्रतिष्ठित और स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: यूसुफ की नैतिक शुद्धता और अनुग्रह के बीच संबंध
  choice: दोनों कथनों को ‘और’ से उसी क्रम में रखा गया
  alternative: अनुग्रह को उसके आचरण का स्पष्ट कारणात्मक प्रतिफल बताना
  rationale: मूल καί द्वारा क्रम/संयोजन देता है, पर स्पष्ट कारणसूचक संबंध स्थापित नहीं करता; इसलिए धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
- issue: θεοῦ का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है तथा किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण बाइबलीय शैली अपनाई गई है। मूल की वाक्यगत एकता, नैतिक बल और ‘परमेश्वर तथा मनुष्यों’ की समानांतर संरचना सुरक्षित रखी गई है।
