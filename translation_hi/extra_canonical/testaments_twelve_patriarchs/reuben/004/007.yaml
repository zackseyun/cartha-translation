source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ γὰρ πολλοὺς ἀπώλεσεν ἡ πορνεία· ὅτι κἂν *γέρων ᾖ τις⁵⁸, κἂν⁵⁹ εὐγενής, Γκἂν πλούσιος, κἂν πένης⁶⁰, *ὀνειδισμὸν ἑαυτῷ φέρει παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων καὶ †πρόσκομμα τῷ Βελίαρ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/007.yaml
  text: For sexual immorality has destroyed many; for whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.
translation:
  language: hi
  text: क्योंकि यौन अनैतिकता ने बहुतों को नष्ट किया है; चाहे कोई बूढ़ा हो, कुलीन हो, धनी हो या निर्धन, वह मनुष्यों के सामने अपने ऊपर निन्दा लाता है और बेलियार के लिए ठोकर का कारण बनता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  choice: व्यभिचार
  rationale: यहाँ शब्द अनैतिक यौन आचरण को व्यापक रूप से सूचित करता है; प्रसंग और गरिमापूर्ण हिन्दी शैली में ‘व्यभिचार’ स्वाभाविक है।
- source_word: ἀπώλεσεν
  choice: नष्ट किया है
  rationale: यूनानी क्रिया के विनाशकारी अर्थ और पूर्ण घटित परिणाम को बनाए रखता है।
- source_word: εὐγενής
  choice: कुलीन
  rationale: उच्च जन्म या सामाजिक प्रतिष्ठा का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य।
- source_word: ὀνειδισμόν
  choice: निन्दा
  rationale: सार्वजनिक अपमान और भर्त्सना, दोनों का भाव व्यक्त करता है।
- source_word: υἱοὺς τῶν ἀνθρώπων
  choice: मनुष्यों के पुत्रों
  rationale: मूल की सामी-प्रभावित अभिव्यक्ति को अनावश्यक रूप से सामान्यीकृत किए बिना औपचारिक निकटता से रखा गया है।
- source_word: πρόσκομμα
  choice: ठोकर का कारण
  rationale: रूपक को सुरक्षित रखते हुए आधुनिक हिन्दी में बोधगम्य अभिव्यक्ति।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक लिप्यंतरण; इसे व्याख्यात्मक रूप से ‘शैतान’ नहीं बनाया गया।
theological_decisions:
- issue: ‘बेलियार के लिए ठोकर’ का अस्पष्ट संबंध
  choice: बेलियार के लिए ठोकर का कारण
  alternative: बेलियार द्वारा बिछाई गई ठोकर / बेलियार के सामने ठोकर
  rationale: पाठ में τῷ Βελίαρ दत्तिव है और उसका सटीक संबंध असामान्य तथा विवादास्पद है। अनुवाद मूल के सबसे सीधे व्याकरणिक रूप को रखता है और यह तय नहीं करता कि बेलियार ठोकर खाता है या ठोकर उत्पन्न करता है।
- issue: πορνεία का दायरा
  choice: व्यभिचार
  alternative: यौन अनैतिकता
  rationale: ‘व्यभिचार’ गरिमापूर्ण और पारंपरिक है, पर यहाँ इसे केवल विवाहित व्यक्ति के विवाहेतर संबंध तक संकीर्ण नहीं समझना चाहिए; मूल शब्द का दायरा व्यापक हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। γὰρ की कारणसूचक कड़ी को ‘क्योंकि’ और अर्धविराम से बनाए रखा गया है; बार-बार आने वाले κἂν की लय को ‘चाहे’ से व्यक्त किया गया है।
