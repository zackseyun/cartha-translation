translation:
  language: hi
  text: क्योंकि अपने पिता की मृत्यु तक मुझमें उनके चेहरे की ओर आँख उठाकर देखने का साहस नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι τελευτῆς τοῦ πατρός μου
  choice: अपने पिता की मृत्यु तक
  rationale: यह यूनानी समय-सीमा को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ εἶχον παρρησίαν
  choice: मुझमें…साहस नहीं था
  rationale: παρρησία यहाँ निर्भीकता या सामना करने के आत्मविश्वास को दर्शाता है; प्रसंग में ‘साहस’ सहज और अर्थानुकूल है।
- source_word: ἀτενίσαι εἰς …
  choice: उनके चेहरे की ओर आँख उठाकर देखने
  rationale: ἀτενίζω का भाव ध्यान से या सीधे देखने का है। उपलब्ध पाठ में इसके बाद का अंश विकृत है, पर परामर्श-पाठ और प्रसंग चेहरे की ओर देखने का संकेत देते हैं; ‘आँख उठाकर’ लज्जा और सीधे सामना न कर पाने का भाव स्वाभाविक हिन्दी में बनाए रखता है।
