  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/005.yaml
  text: Therefore, my children, I tell you, keep all that I command you, and you will certainly not sin.
translation:
  language: hi
  text: 'इसलिए, मेरे बच्चों, मैं तुमसे कहता हूँ: जो कुछ मैं तुम्हें आज्ञा देता हूँ, उस सबका पालन करो, और तुम निश्चय ही पाप नहीं करोगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: यह पूर्ववर्ती कथन से निष्कर्ष या परिणाम का स्वाभाविक संबंध व्यक्त करता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन का आत्मीय, पारिवारिक स्वर बनाए रखता है; हिंदी में संबोधन रूप 'बच्चो' स्वाभाविक है।
- source_word: φυλάξατε
  choice: पालन करो
  rationale: आज्ञाओं के संदर्भ में 'पालन करना' आधुनिक हिंदी में स्वाभाविक है और यूनानी क्रिया के सावधानी से मानने/रखने के भाव को व्यक्त करता है।
- source_word: πάντα ὅσα ἐντέλλομαι ὑμῖν
  choice: जो कुछ मैं तुम्हें आज्ञा देता हूँ, उस सबका
  rationale: πάντα ὅσα की समग्रता को स्पष्ट रखता है और वाक्य को सहज हिंदी क्रम देता है।
- source_word: οὐ μὴ ἁμάρτητε
  choice: तुम निश्चय ही पाप नहीं करोगे
  rationale: οὐ μή के प्रबल निषेध को 'निश्चय ही ... नहीं' से व्यक्त किया गया है; क्रिया का पाप करने का सीधा अर्थ सुरक्षित है।
theological_decisions:
- issue: οὐ μὴ ἁμάρτητε के प्रबल निषेध और संभावित परिणामात्मक अर्थ का निरूपण
  choice: और तुम निश्चय ही पाप नहीं करोगे
  alternative: ताकि तुम पाप न करो
  rationale: मूल में καὶ के साथ οὐ μή प्रबल निषेध है, न कि स्पष्ट उद्देश्यसूचक ἵνα; इसलिए आज्ञा के परिणाम के रूप में दृढ़ कथन को बनाए रखा गया है, बिना उसे उद्देश्य-वाक्य में बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन में आत्मीयता तथा अंतिम उपवाक्य में यूनानी के प्रबल निषेध को सुरक्षित रखा गया है।
