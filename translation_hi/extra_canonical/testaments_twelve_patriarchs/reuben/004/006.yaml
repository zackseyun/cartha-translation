source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Βόθρος γάρ ἐστι ψυχῆς ἡ ἁμαρτία τῆς πορνείας⁵², χωρίζουσα ἀπὸ⁵³ θεοῦ καὶ προσεγγίζουσα *τοῖς εἰδώλοις⁵⁴, ὅτι αὕτη *ἐστὶν ἡ⁵⁵ πλανῶσα τὸν νοῦν *καὶ τὴν διάνοιαν⁵⁶, καὶ κατάγει⁵⁷ νεανί- σκους εἰς ᾅδην, οὐκ ἐν καιρῷ αὐτῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/006.yaml
  text: For the sin of sexual immorality is a pit for the soul, separating it from God and drawing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.
translation:
  language: hi
  text: क्योंकि यौन अनैतिकता का पाप आत्मा के लिए एक गड्ढा है; वह आत्मा को परमेश्वर से अलग करता है और उसे मूर्तियों के निकट खींच ले जाता है। यही पाप मन और समझ को भटका देता है और युवकों को उनके समय से पहले अधोलोक में उतार देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἁμαρτία τῆς πορνείας
  choice: व्यभिचार का पाप
  rationale: πορνεία यहाँ व्यापक यौन अनैतिकता को सूचित करता है; प्रसंगानुकूल और सहज हिन्दी में ‘व्यभिचार’ उस अनैतिक यौन आचरण को संक्षेप में व्यक्त करता है।
- source_word: βόθρος ... ψυχῆς
  choice: आत्मा के लिए एक गड्ढा
  rationale: βόθρος की ठोस रूपकात्मक छवि को बनाए रखा गया है; ‘के लिए’ हिन्दी में इसके घातक परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσεγγίζουσα τοῖς εἰδώλοις
  choice: मूर्तियों के निकट खींचता है
  rationale: निकट पहुँचाने/लाने के अर्थ और पाप की सक्रिय, आकर्षित करने वाली शक्ति—दोनों को व्यक्त करता है।
- source_word: τὸν νοῦν καὶ τὴν διάνοιαν
  choice: मन और समझ
  rationale: दोनों यूनानी संज्ञाओं का भेद यथासंभव बनाए रखते हुए आधुनिक, सुबोध हिन्दी चुनी गई है।
- source_word: ᾅδην
  choice: अधोलोक
  rationale: यहाँ यूनानी Hades, अर्थात मृतकों के लोक, का संकेत है; ‘नरक’ कहने से अंतिम दंड का अधिक विशिष्ट अर्थ अनावश्यक रूप से जुड़ सकता था।
- source_word: οὐκ ἐν καιρῷ αὐτῶν
  choice: उनके समय से पहले
  rationale: शाब्दिक ‘उनके समय में नहीं’ का स्वाभाविक हिन्दी अर्थ, अकाल मृत्यु का संकेत सुरक्षित रखते हुए।
theological_decisions:
- issue: ᾅδης का स्वरूप
  choice: अधोलोक
  alternative: नरक
  rationale: मूल शब्द अपने आप में अंतिम दंडस्थल को निश्चित नहीं करता; इसलिए व्यापक और ऐतिहासिक अर्थ वाला ‘अधोलोक’ रखा गया है।
- issue: पाप का मूर्तियों से संबंध
  choice: मूर्तियों के निकट खींचता है
  alternative: मूर्तिपूजा करवाता है
  rationale: मूल पाठ निकट खींचने की बात करता है, सीधे तौर पर मूर्तिपूजा करने का स्पष्ट कथन नहीं; इस तनाव को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सूक्तिपरक और सहज शैली। मूल के रूपक, समानांतर क्रियाओं और कारणसूचक प्रवाह को सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई।
