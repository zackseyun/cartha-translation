  text: And even now my conscience strikes me concerning my sin.
translation:
  language: hi
  text: और अब भी मेरा विवेक मेरे पाप के विषय में मुझे कचोटता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνείδησίς
  choice: विवेक
  rationale: यहाँ शब्द व्यक्ति की नैतिक आत्मचेतना को दर्शाता है; आधुनिक मानक हिन्दी में ‘विवेक’ इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: τύπτει
  choice: कचोटता है
  rationale: मूल अर्थ ‘मारता/प्रहार करता है’ है, पर विवेक के साथ यह रूपक निरंतर आंतरिक ग्लानि और चुभन व्यक्त करता है तथा यूनानी क्रिया की तीव्रता को केवल ‘दोषी ठहराता है’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: περὶ τῆς ἁμαρτίας μου
  choice: मेरे पाप के कारण
  rationale: इस प्रसंग में περί उस पाप के संबंध में उत्पन्न विवेक-दंश का कारण बताता है; यह हिन्दी में ‘मेरे पाप के विषय में’ से अधिक स्वाभाविक है, बिना पाप की गंभीरता घटाए।
theological_decisions:
- issue: विवेक की क्रिया का रूपक
  choice: मुझे कचोटता है
  alternative: मुझे मारता है / मुझ पर प्रहार करता है
  rationale: शाब्दिक प्रहार-रूपक को हिन्दी में यांत्रिक बनाने के बजाय उसके नैतिक और भावात्मक बल को स्वाभाविक मुहावरे में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, आत्मस्वीकृतिपरक और गरिमापूर्ण शैली। ‘अब तक’ निरंतरता को और ‘कचोटता है’ वर्तमानकालीन विवेक-दंश को स्पष्ट रखता है।
