review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the broad, non-polemical force of αὐτῷ ('to him') and does not over-specify φάρμακα as poison. It also preserves the repeated causal connection and the distinction between Joseph's self-guarding and his refusal of inward counsel. However, 'उसके साथ बहुत कुछ किया' can suggest that the woman and Joseph acted together, whereas the Greek more naturally means that she did many things directed toward him.
  naturalness: The closing phrase is intelligible but somewhat stiff. 'उसके प्रति बहुत-सी बातें कीं' is clearer Hindi for actions directed at him, while keeping the Greek's unspecified 'many things.' The remaining syntax is appropriately formal and readable.
  terminology: '''मिस्री स्त्री,'' ''जादूगर,'' ''औषधियाँ,'' and ''अभिलाषा'' are suitable. ''औषधियाँ'' preserves the lexical ambiguity of φάρμακα in this context and should not be replaced by ''विष'' or a more interpretive term.'
  issues:
  - severity: medium
    issue: '''उसके साथ बहुत कुछ किया'' is directionally ambiguous.'
    rationale: In Hindi it may imply joint activity ('did much together with him'), while πολλὰ ἐποίησεν αὐτῷ describes actions done to/toward Joseph without specifying their nature.
  revised_text: क्योंकि उस मिस्री स्त्री ने उसके प्रति बहुत-सी बातें कीं, जादूगरों को बुलाया और उसके लिए औषधियाँ लायीं; क्योंकि यूसुफ ने अपने आपको हर बुरी अभिलाषा से बचाए रखा और दुष्ट अभिलाषा के लिए अपने मन की सलाह नहीं मानी।
