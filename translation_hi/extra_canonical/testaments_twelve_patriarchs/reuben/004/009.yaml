revisions:
- from: क्योंकि उस मिस्री स्त्री ने उसके साथ बहुत कुछ किया, जादूगरों को बुलाया और उसके लिए औषधियाँ लायी; क्योंकि यूसुफ ने अपने आपको हर बुरी अभिलाषा से बचाए रखा और दुष्ट अभिलाषा के लिए अपने मन की सलाह नहीं मानी।
  to: क्योंकि उस मिस्री स्त्री ने उसके प्रति बहुत-सी बातें कीं, जादूगरों को बुलाया और उसके लिए औषधियाँ लायीं; क्योंकि यूसुफ ने अपने आपको हर बुरी अभिलाषा से बचाए रखा और दुष्ट अभिलाषा के लिए अपने मन की सलाह नहीं मानी।
  rationale: The revision clarifies that the Egyptian woman's many unspecified actions were directed toward Joseph rather than jointly undertaken with him. It otherwise preserves the draft's careful handling of the Greek ambiguities, including φάρμακα and the syntactically tense final expression concerning the counsel of Joseph's inner self and wicked desire.
