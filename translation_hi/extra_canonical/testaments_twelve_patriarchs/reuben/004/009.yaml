id: T12P.REU.4.9
reference: Testament of Reuben 4:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Καὶ γὰρ⁶⁷ πολλὰ ἐποίησεν αὐτῷ ἡ Αἰγυπτία, καὶ μάγους προσεκάλεσεν⁶⁸ καὶ *φάρμακα αὐτῷ προσήνεγκε⁶⁹, ἐπειδὴ γὰρ ἐφύλαξεν ἑαυτὸν Ἰωσὴφ ἀπὸ πάσης. β, Α, S¹ κυρίου. καὶ⁷⁰ οὐκ ἐδέξατο⁷¹ τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ⁷² ἐπιθυμίαν πονηράν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/009.yaml
  text: For the Egyptian woman did many things to him, and called in magicians and brought him potions; for Joseph guarded himself from every evil desire and did not accept the counsel of his soul for wicked desire.
translation:
  language: hi
  text: क्योंकि उस मिस्री स्त्री ने उसके प्रति बहुत-सी बातें कीं, जादूगरों को बुलाया और उसके लिए औषधियाँ लायीं; क्योंकि यूसुफ ने अपने आपको हर बुरी अभिलाषा से बचाए रखा और दुष्ट अभिलाषा के लिए अपने मन की सलाह नहीं मानी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: उस मिस्री स्त्री
  rationale: स्त्रीलिंग संज्ञीकृत विशेषण को संदर्भानुसार स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया।
- source_word: πολλὰ ἐποίησεν αὐτῷ
  choice: उसके साथ बहुत कुछ किया
  rationale: αὐτῷ के व्यापक अर्थ को बनाए रखा गया; ‘उसके विरुद्ध’ जोड़कर आशय को अनावश्यक रूप से निश्चित नहीं किया।
- source_word: μάγους
  choice: जादूगरों
  rationale: प्राचीन संदर्भ में जादुई क्रियाएँ करने वालों के लिए सहज और सीधा समतुल्य।
- source_word: φάρμακα
  choice: औषधियाँ
  rationale: यह शब्द औषधि, दवा, विष या जादुई मिश्रण के अर्थ दे सकता है; संदर्भ की अस्पष्टता को किसी एक नकारात्मक अर्थ में सीमित नहीं किया गया।
- source_word: ἐφύλαξεν ἑαυτόν
  choice: अपने आपको ... से बचाए रखा
  rationale: आत्म-संयम और चौकसी के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιθυμίαν πονηράν
  choice: बुरी अभिलाषा / दुष्ट अभिलाषा
  rationale: ἐπιθυμία को केवल यौन ‘वासना’ तक सीमित न करके उसके व्यापक ‘अभिलाषा’ अर्थ को सुरक्षित रखा गया।
- source_word: τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ
  choice: अपने मन की सलाह
  rationale: ψυχή के यहाँ आंतरिक व्यक्तित्व या मन के आशय को पठनीय हिन्दी में रखा गया, जबकि ‘सलाह’ द्वारा διαβούλιον की विचार-प्रेरणा बनी रहती है।
theological_decisions:
- issue: यूसुफ के आंतरिक मन की सलाह और दुष्ट अभिलाषा का संबंध
  choice: दुष्ट अभिलाषा के लिए अपने मन की सलाह नहीं मानी
  alternative: अपने मन की दुष्ट अभिलाषा नहीं मानी
  rationale: ग्रीक वाक्यरचना में ‘मन की सलाह’ और ‘दुष्ट अभिलाषा’ दोनों अलग अभिव्यक्तियाँ हैं; उन्हें मिला देने के बजाय मूल का तनाव और कुछ असहजता सुरक्षित रखी गई।
- issue: φάρμακα का नैतिक या जादुई आशय
  choice: औषधियाँ
  alternative: जादुई औषधियाँ / विष
  rationale: मूल शब्द बहुअर्थी है। आसपास जादूगरों का उल्लेख जादुई आशय सुझाता है, पर उसे स्पष्ट रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल के दोहरे ‘क्योंकि’ को उसके तर्क-संबंध और पाठगत तनाव सहित रखा गया है।
