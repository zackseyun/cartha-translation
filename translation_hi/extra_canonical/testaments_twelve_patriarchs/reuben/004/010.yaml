  text: Therefore the God of your fathers delivered him from every hidden evil death.
translation:
  language: hi
  text: इसी कारण तुम्हारे पूर्वजों के परमेश्वर ने उसे हर बुरी, छिपी हुई मृत्यु से बचाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी पद अत्यंत संक्षिप्त है और इसका अधिक शाब्दिक रूप ‘हर बुरी छिपी हुई मृत्यु से’ है। ‘बुरी’ और ‘छिपी हुई’ दोनों ‘मृत्यु’ का वर्णन करते हैं; मूल पाठ ‘बुराई’ और ‘मृत्यु’ को दो अलग वस्तुओं के रूप में नहीं रखता।
    reason: असामान्य यूनानी पदबंध की वास्तविक व्याकरणिक संरचना और उसकी हल्की अर्थगत कठिनाई को सुरक्षित रखना।
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पिछले कथन से स्पष्ट कारणात्मक संबंध व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ θεὸς τῶν πατέρων ὑμῶν
  choice: तुम्हारे पूर्वजों के परमेश्वर
  rationale: πατέρων का आशय वंश के पहले के पितरों से है; ‘पूर्वजों’ सामान्य आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐρρύσατο
  choice: बचाया
  rationale: क्रिया संकट अथवा मृत्यु से छुड़ाने या बचाने का भाव रखती है; यहाँ ‘बचाया’ सहज है।
- source_word: ἀπὸ παντὸς πονηροῦ κεκρυμμένου θανάτου
  choice: हर बुरी, छिपी हुई मृत्यु से
  rationale: विभक्ति-सामंजस्य के अनुसार πονηροῦ और κεκρυμμένου दोनों θανάτου को विशेषित करते हैं। अनुवाद एक ही संयुक्त पद रखता है और इसे ‘हर छिपी हुई बुराई और मृत्यु’ जैसे दो अलग संकटों में नहीं बाँटता।
theological_decisions:
- issue: ‘बुराई’ और ‘मृत्यु’ को अलग-अलग उद्धार-विषय मानना या एक संयुक्त संज्ञा-पद
  choice: 'एक संयुक्त पद: ‘हर बुरी, छिपी हुई मृत्यु से’'
  alternative: ‘हर छिपी हुई बुराई और मृत्यु से’
  rationale: यूनानी में ‘से’ का संबंध एक ही पद-समूह से है, और πονηροῦ तथा κεκρυμμένου दोनों संबंधकारक एकवचन में θανάτου के साथ मेल खाते हैं। इसलिए वैकल्पिक पाठ यूनानी संरचना को अनावश्यक रूप से विभाजित करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। ‘पितरों’ की अपेक्षा ‘पूर्वजों’ सामान्य पाठक के लिए अधिक सहज है। अल्पविराम दोनों विशेषणों को स्पष्ट करता है, पर उन्हें अलग उद्धार-विषय नहीं बनाता।
