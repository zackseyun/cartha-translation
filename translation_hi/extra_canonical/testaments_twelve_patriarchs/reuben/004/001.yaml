id: T12P.REU.4.1
reference: Testament of Reuben 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Μὴ οὖν προσέχετε, Γτέκνα μου1, κάλλος2 γυναικῶν3, μηδὲ ἐννοεῖσθε4 τὰς πράξεις αὐτῶν· ἀλλὰ πορεύεσθε ἐν5 ἁπλότητι καρδίας, ἐν φόβῳ κυρίου6, καὶ μοχθοῦντες7 ἐν ἔργοις *καλοῖς, καὶ8 *ἐν γράμμασι, καὶ ἐν τοῖς ποιμνίοις9 ὑμῶν, ἕως οὗ10 *ὁ κύριος δώῃ ὑμῖν11 *σύζυγον, ἣν αὐτὸς θέλει12, ἵνα μὴ πάθητε13, ὡς κἀγώ14.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/001.yaml
  text: Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, स्त्रियों की सुंदरता पर ध्यान न दो और न उनके कार्यों पर विचार करो; बल्कि हृदय की निष्कपटता में, प्रभु के भय में चलो, और अच्छे कामों में, अध्ययन में और अपने झुंडों में परिश्रम करो, जब तक कि प्रभु तुम्हें ऐसी पत्नी दे जिसे वह स्वयं चाहता है, ताकि तुम्हें मेरी तरह दुःख न सहना पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: ध्यान न देना
  rationale: प्रसंग में निषेध के साथ यह किसी आकर्षण की ओर मन लगाने या ध्यान देने से रोकता है।
- source_word: τὰς πράξεις αὐτῶν
  choice: उनके कामों
  rationale: πράξεις का सामान्य और स्वाभाविक अर्थ ‘काम/कृत्य’ है; इससे मूल की व्यापकता बनी रहती है।
- source_word: ἁπλότητι καρδίας
  choice: हृदय की निष्कपटता
  rationale: ἁπλότης यहाँ सरल, अविभाजित और छलरहित मनोभाव बताता है; ‘निष्कपटता’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: ἐν φόβῳ κυρίου
  choice: प्रभु का भय मानते हुए
  rationale: शाब्दिक ‘प्रभु के भय में’ की अपेक्षा यह हिन्दी में स्वाभाविक है और श्रद्धामय भय का भाव सुरक्षित रखता है।
- source_word: ἐν γράμμασι
  choice: विद्या-अध्ययन में
  rationale: γράμματα अक्षरों, लेखन या शिक्षा-अध्ययन का बोध करा सकता है; संदर्भ में ‘विद्या-अध्ययन’ मूल की शैक्षिक दिशा को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς ποιμνίοις ὑμῶν
  choice: अपने पशु-झुंडों की देखभाल में
  rationale: ποιμνίοις का अर्थ झुंड है; ‘देखभाल’ श्रम करने की क्रिया से निहित कार्य को स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: σύζυγον
  choice: पत्नी
  rationale: सामान्यतः जीवन-साथी का अर्थ है, पर पुरुष पुत्रों को दिए जा रहे निर्देश और स्त्रियों के संदर्भ में ‘पत्नी’ उपयुक्त है।
- source_word: ἣν αὐτὸς θέλει
  choice: जिसे वह स्वयं चाहता है
  rationale: θέλει को ‘चुनता है’ कहना अर्थ की सम्भावित व्याख्या है; ‘चाहता है’ मूल क्रिया के अधिक निकट रहकर यह तनाव सुरक्षित रखता है।
- source_word: πάθητε
  choice: दुःख न सहना पड़े
  rationale: πάσχω का अर्थ अनुभव करना या दुःख उठाना है; रूबेन के आत्म-संदर्भ में ‘दुःख सहना’ स्वाभाविक है।
theological_decisions:
- issue: पत्नी प्रदान करने में प्रभु की भूमिका
  choice: जब तक प्रभु तुम्हें ऐसी पत्नी न दे जिसे वह स्वयं चाहता है
  alternative: जब तक प्रभु तुम्हें वह पत्नी न दे जिसे वह स्वयं चुनता है
  rationale: मूल δώῃ स्पष्ट रूप से देने की बात करता है, जबकि θέλει ‘चाहना/इच्छा करना’ है; अनुवाद ने इसे ‘चुनना’ बनाकर ईश्वरीय चयन की अधिक विशिष्ट धारणा आरोपित नहीं की।
- issue: प्रभु का भय
  choice: प्रभु का भय मानते हुए
  alternative: प्रभु के भय में
  rationale: यह श्रद्धा और उत्तरदायित्व सहित भय की मूल धार्मिक अभिव्यक्ति को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पितृसुलभ उपदेशात्मक शैली रखी गई है। बहुवचन संबोधन के अनुरूप ‘बच्चो’, ‘देना’, ‘चलना’ और ‘करते रहना’ प्रयुक्त हैं। यूनानी वाक्य की क्रमिक संरचना को यथासंभव रखा गया, पर हिन्दी की सहजता के लिए श्रम के तीन क्षेत्रों को स्पष्ट समानांतर रूप दिया गया है।
