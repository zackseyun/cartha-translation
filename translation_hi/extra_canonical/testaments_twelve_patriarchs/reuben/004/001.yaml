review_pass:
  verdict: revise
  source_fidelity: The draft substantially follows the Greek and the English audit trail. However, “जब तक ... न दे” can be read in Hindi as a negative condition, whereas ἕως οὗ ... δώῃ is a positive ‘until ... gives.’ The rendering of the final labor sphere adds ‘देखभाल,’ which is not explicitly present in ἐν τοῖς ποιμνίοις ὑμῶν.
  naturalness: The register is generally clear and suitably exhortative. Recasting the prohibitions and the ‘until’ clause produces more idiomatic modern standard Hindi and avoids ambiguity.
  terminology: “हृदय की निष्कपटता,” “प्रभु का भय,” “अध्ययन,” and “पत्नी” are appropriate. “अपने झुंडों में परिश्रम करना” keeps the concise source wording without specifying an additional activity.
  issues:
  - severity: medium
    issue: Negative ambiguity in the temporal clause
    rationale: '“जब तक प्रभु ... न दे” can imply ‘unless/until he does not give’ in Hindi. The Greek has a positive subjunctive: ‘until the Lord gives.’'
  - severity: low
    issue: Added ‘देखभाल’ in the phrase concerning flocks
    rationale: ποίμνια means flocks; the Greek says to labor ‘in/among your flocks,’ without expressly stating ‘care.’ The addition is plausible but unnecessarily narrows or expands the wording.
  - severity: low
    issue: ‘मन लगाना’ is less direct for ἐννοεῖσθε
    rationale: The verb calls for considering, thinking about, or dwelling on their deeds. ‘विचार न करना’ is more direct and natural in this formal exhortation.
