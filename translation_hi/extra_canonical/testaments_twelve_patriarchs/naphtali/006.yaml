  text: 'And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him. And behold, a ship came sailing by us, with sailors and pilots. And written on the ship was this: “The Ship of Jacob.”


    And our father said to us, “Come, let us go up into our ship.” And when we had entered, a violent storm arose, and a whirlwind of wind; and our father was separated from us, holding the rudders[b]. And we, being storm-tossed upon the sea, were driven along over the waters, while the ship was filled and battered by the waves, so that it was about to be broken up.


    But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together. And we were scattered, all of us, to the ends of the earth[c]. But Levi, clothed in sackcloth, prayed to the Lord. And when the storm ceased, the ship reached the land as though in peace. And behold, our father came, and we all rejoiced with one accord.'
translation:
  language: hi
  text: '**नप्ताली का वसीयतनामा 6**


    **1** फिर सात दिन बाद मैंने देखा कि मेरे पिता याकूब अम्निया के समुद्र[a] में खड़े थे और हम उनके साथ थे। **2** तभी एक जहाज़ पाल बाँधे चला आ रहा था, पर उसमें न नाविक थे, न कर्णधार। जहाज़ पर लिखा था, “याकूब का जहाज़।”


    **3** हमारे पिता ने हमसे कहा, “आओ, हम अपने जहाज़ पर चढ़ें।” **4** जब हम उसमें चढ़ गए, तब एक भयंकर तूफ़ान उठा और प्रचंड आँधी चली। हमारे पिता हमसे अलग हो गए; वे पतवारों को थामे हुए थे।[b] **5** तूफ़ान से घिरे हुए हम खुले समुद्र में बहते चले गए। जहाज़ पानी से भर गया और लहरों के थपेड़ों से पिटता हुआ टूटने को था।


    **6** पर यूसुफ एक छोटी नाव में चला गया। हम नौ तख़्तों पर बँट गए, जबकि लेवी और यहूदा साथ थे। **7** हम सब पृथ्वी के छोरों तक तितर-बितर हो गए।[c] **8** पर लेवी टाट ओढ़कर प्रभु से प्रार्थना करने लगा। **9** जब तूफ़ान थम गया, तो जहाज़ मानो शांति से धरती पर आ लगा। **10** तभी हमारे पिता आ गए, और हम सबने एक मन होकर आनंद मनाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अम्निया’ नाम के स्थान की पहचान अनिश्चित है। किसी स्थान का अनुमान लगाने के बजाय यहाँ यूनानी नाम का रूप सुरक्षित रखा गया है।
    reason: cultural_note
  - marker: b
    text: ‘पतवारों’ के रूप में अनूदित यूनानी पद पाठ की दृष्टि से कठिन है; सामान्य प्रयोग में इसका शाब्दिक अर्थ ‘गर्दनें’ होता है, पर यहाँ समुद्री प्रसंग किसी संचालन-साधन की ओर संकेत करता जान पड़ता है।
    reason: textual_variant
  - marker: c
    text: ‘पृथ्वी के छोरों तक’ बिखरना संभवतः व्यापक तितर-बितर होने का प्रतीक है, यद्यपि इस अध्याय में इसे नप्ताली के स्वप्न के एक दृश्य के रूप में ही प्रस्तुत किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: θάλασσα Ἀμνείας
  choice: अम्निया का समुद्र
  rationale: यूनानी पाठ में यह अनिश्चित पहचान वाला स्थान-नाम है; अनुमान से किसी ज्ञात स्थान के साथ जोड़ने के बजाय यूनानी रूप का लिप्यंतरण रखा गया है।
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: न नाविक थे, न कर्णधार
  rationale: ἐκτός यहाँ अभाव, अर्थात ‘बिना’, व्यक्त करता है। यह अंग्रेज़ी परामर्श-पाठ के ‘with’ से भिन्न है, पर उपलब्ध यूनानी स्रोत का सीधा अर्थ सुरक्षित रखता है। κυβερνήτης के लिए समुद्री संचालन का बोध देने वाला ‘कर्णधार’ चुना गया है।
- source_word: ἁρμενίζον
  choice: पाल बाँधे चला आ रहा था
  rationale: यह नौकायन करते हुए आने की सजीव समुद्री छवि को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: χειμὼν σφοδρός
  choice: भयंकर तूफ़ान
  rationale: समुद्री प्रसंग में χειμών शीत ऋतु नहीं, तूफ़ान है; σφοδρός उसकी तीव्रता बताता है।
- source_word: λαῖλαψ ἀνέμου
  choice: प्रचंड बवंडर
  rationale: यूनानी की तीव्र, घूमती हुई पवन की छवि को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: τοὺς αὐχένας
  choice: पतवारों
  rationale: शब्द का सामान्य शाब्दिक अर्थ ‘गर्दनें’ है, किंतु समुद्री प्रसंग में यह पाठ कठिन है और संभवतः संचालन-साधन की ओर संकेत करता है। मुख्य पाठ में संदर्भानुकूल अर्थ रखा गया है और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: χειμαζόμενοι ἐπὶ τὸ πέλαγος ἐφερόμεθα
  choice: तूफ़ान से घिरे हुए हम खुले समुद्र में बहते चले गए
  rationale: निष्क्रिय रूप भाइयों की विवशता और πέλαγος खुले अथवा गहरे समुद्र का बोध देता है।
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: ऊँची लहरों के थपेड़ों से ... टूटने लगा
  rationale: उग्र लहरों से जहाज़ के लगातार पीटे और फटते जाने की संयुक्त छवि को स्पष्ट हिन्दी में व्यक्त किया गया है।
- source_word: ἀκάτιον
  choice: छोटी नाव
  rationale: यह छोटे जलयान के लिए सटीक, सामान्य और आसानी से समझ आने वाला हिन्दी पद है।
- source_word: σανίδων ἐννέα
  choice: नौ तख़्तों
  rationale: सानίς जहाज़ के टूटे हुए तख़्तों की दृश्यात्मकता देता है; ‘तख़्त’ आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह सबके एकमत और एक साथ आनंदित होने का भाव सुरक्षित रखता है तथा गरिमापूर्ण बाइबलीय हिन्दी है।
theological_decisions:
- issue: स्वप्न में समुद्री दुर्घटना और पृथ्वी के छोरों तक बिखराव का प्रतीकात्मक अर्थ
  choice: घटना को स्वप्न-कथा के रूप में सीधे अनूदित किया गया है, और केवल पादटिप्पणी में संभावित प्रतीकात्मक बल बताया गया है।
  alternative: मुख्य पाठ में इसे इस्राएली गोत्रों के निर्वासन या भावी बिखराव के रूप में स्पष्ट कर देना।
  rationale: यूनानी पाठ दृश्य का अर्थ स्वयं नहीं खोलता। अनुवाद को संभावित संकेत बनाए रखना चाहिए, किसी एक उत्तरवर्ती व्याख्या को पाठ में नहीं जोड़ना चाहिए।
- issue: यहूदी वसीयतनामा-साहित्य में Κυρίου
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: उपलब्ध यूनानी साक्ष्य में Κυρίου है, स्वयं चतुरक्षरीय ईश-नाम नहीं। ‘प्रभु’ श्रद्धापूर्ण और स्रोत के अनुरूप है, बिना किसी संप्रदायगत विशिष्टता को जोड़ने के।
- issue: τοὺς αὐχένας का कठिन पाठ
  choice: संदर्भानुसार ‘पतवारों’ और साथ में पाठ-संबंधी पादटिप्पणी
  alternative: मुख्य पाठ में शाब्दिक ‘गर्दनों’ या व्याख्यात्मक ‘पतवार के हत्थों’
  rationale: ‘गर्दनों’ से दृश्य अस्पष्ट और संभवतः विकृत हो जाता है, जबकि अधिक विशिष्ट ‘हत्थों’ के लिए पाठ में पर्याप्त आधार नहीं। चुना हुआ रूप समुद्री संदर्भ का संभावित आशय देता है और पादटिप्पणी वास्तविक अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथा-शैली रखी गई है। समुद्री शब्दावली को सामान्य पाठक के लिए स्पष्ट बनाया गया है, पर स्रोत की स्वप्नवत सजीवता और कठिन पाठों की अनिश्चितता नहीं मिटाई गई। यूनानी स्रोत के ἐκτός के कारण जहाज़ को नाविकों और कर्णधारों से रहित बताया गया है; यह परामर्शार्थ दिए अंग्रेज़ी पाठ से जानबूझकर भिन्न है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
