  text: VI. *Καὶ πάλιν¹ μετὰ ἡμέρας² ἑπτὰ εἶδον *ὅτι ὁ πατὴρ μου Ἰακὼβ ἴστατο³ ἐν τῇ θαλάσσῃ Ἀμνείας⁴, καὶ ἡμεῖς⁵ σὺν αὐτῷ⁶. 2. Καὶ ἰδοὺ πλοῖον ἤρχετο⁷ ἁρμενίζον⁸ *ἐκτὸς ναυτῶν⁹ καὶ κυβερνητῶν¹⁰· ἐπεγέγραπτο *δὲ τῷ πλοίῳ¹¹ *ὅτι πλοῖον¹² Ἰακώβ. 3. *Καὶ λέγει¹³ ἡμῖν ὁ πατὴρ ἡμῶν¹⁴· *Δεῦτε ἀνέλθωμεν¹⁵ εἰς τὸ πλοῖον ἡμῶν. 4. *Ὡς δὲ ἡμεῖς εἰσήλθομεν¹⁶ γίνεται¹⁷ χειμὼν σφοδρός¹⁸, καὶ λαῖλαψ ἀνέμου¹⁹ μέγας²⁰, καὶ ἀφίσταται²¹ ὁ πατὴρ ἡμῶν²² ἀφʼ ἡμῶν, ὁ²³ κρατῶν *τοὺς αὐχένας²⁴. 5. Καὶ²⁵ ἡμεῖς²⁶ χειμαζόμενοι ἐπὶ τὸ πέλαγος *ἐφερόμεθα, καὶ²⁷ ἐπληρώθη τὸ πλοῖον ὑδάτων²⁸, *ἐν τρικυμίαις²⁹ περιρησσόμενον³⁰, ὥστε³¹ *καὶ συντρίβεσθαι³² αὐτό³³. 6. *Ὁ δὲ Ἰωσὴφ ἐπὶ ἀκατίῳ ἐπορεύθη³⁴· ἡμεῖς δὲ διεχωρίσθημεν ἐπὶ σανίδων ἐννέα³⁵. Λευὶ δὲ καὶ Ἰούδας ἦσαν *ἐπὶ τὸ αὐτό³⁶. 7. Καὶ³⁷ διεσπάρημεν³⁸ πάντες εἰς³⁹ τὰ πέρατα *τῆς γῆς⁴⁰. 8. Ὁ δὲ Λευὶ⁴¹ περιβαλλόμενος⁴² σάκκον⁴³ ἐδέετο⁴⁴ *τοῦ Κυρίου⁴⁵. 9. Ὡς δὲ ἐπαύσατο ὁ χειμών, *ἔφθασε τὸ σκάφος ἐπὶ τῆς γῆς⁴⁶, Γὥσπερ⁴⁷ ἐν εἰρήνῃ. 10. Καὶ ἰδοὺ ἦλθεν⁴⁸ ὁ πατὴρ ἡμῶν⁴⁹ καὶ
    πάντες⁵⁰ ὁμοθυμαδὸν ἠγαλλιασάμεθα⁵¹.
