source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καὶ εἶδον *ὅτι ἤμην παρεκεῖ⁴¹, καὶ ἰδοὺ γραφὴ *ἁγία ὤφθη ἡμῖν⁴², λέγουσα⁴³· Ἀσσύριοι⁴⁴, Μῆδοι⁴⁵, Πέρσαι⁴⁶, Χαλδαῖοι⁴⁷, Σύροι⁴⁸, κληρονομήσουσιν αἰχμαλωσίαν⁴⁹ τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/008.yaml
  text: And I saw that I was there, and behold, a holy writing appeared to us, saying, “Assyrians, Medes, Persians, Chaldeans, Syrians shall inherit in captivity the twelve sceptres of Israel.”
translation:
  language: hi
  text: 'और मैंने देखा कि मैं वहीं था। और देखो, एक पवित्र लेख हमें दिखाई दिया, जिसमें यह लिखा था: “अश्शूरी, मादी, फ़ारसी, कसदी और सीरियाई लोग बंदीपन में[a] इस्राएल के बारह राजदंडों के उत्तराधिकारी होंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘बंदीपन’ और ‘इस्राएल के बारह राजदंडों’ का संबंध वाक्य-रचना की दृष्टि से कठिन है। अनुवाद में अंग्रेज़ी POB की तरह ‘बंदीपन में ... उत्तराधिकारी होंगे’ समझा गया है; ‘राजदंड’ इस्राएल के बारह शासकीय/गोत्रीय प्रतीकों की छवि है, पर मुख्य पाठ में इसका अर्थ ‘गोत्र’ नहीं किया गया है।
    reason: कठिन और संभावित रूप से अस्पष्ट यूनानी संरचना को दर्ज करना, बिना मुख्य पाठ में व्याख्यात्मक विकल्प थोपे।
lexical_decisions:
- source_word: παρεκεῖ
  choice: वहीं
  rationale: शब्द का अर्थ ‘उस स्थान पर/वहीं’ है; इससे दर्शन के भीतर वक्ता की उपस्थिति स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: γραφὴ ἁγία
  choice: एक पवित्र लेख
  rationale: यहाँ γραφή किसी लिखित संदेश या लेख को दर्शाता है; ‘पवित्रशास्त्र’ कहने से बाद की निर्धारित धर्मग्रंथ-संहिता का अर्थ अनावश्यक रूप से आ सकता है।
- source_word: ὤφθη ἡμῖν
  choice: हमें दिखाई दिया
  rationale: यूनानी कर्मवाच्य अभिव्यक्ति और बहुवचन ‘हमें’ दोनों सुरक्षित रखे गए हैं।
- source_word: σκῆπτρα
  choice: राजदंडों
  rationale: शाब्दिक अर्थ ‘राजदंड’ है और यहाँ यह इस्राएल के बारह गोत्रों अथवा उनके शासकीय अधिकार का प्रतीक बना रहता है।
- source_word: Σύροι
  choice: अरामी लोग
  rationale: इस ऐतिहासिक जाति-सूची में Σύροι का आशय सीरिया-अराम क्षेत्र के लोगों से है; ‘अरामी’ आधुनिक हिन्दी में प्राचीन संदर्भ को आज के सीरियाई नागरिकों से अलग रखता है।
- source_word: κληρονομήσουσιν
  choice: अपने अधिकार में कर लेंगे
  rationale: मूल क्रिया का आधारभूत अर्थ ‘विरासत में पाना/अधिकार पाना’ है; विजय और बँधुआई के संदर्भ में लक्ष्य-पाठ में इसका स्वाभाविक अर्थ व्यक्त किया गया है, बिना उसे केवल ‘नष्ट करेंगे’ में बदलने के।
- source_word: αἰχμαλωσίαν
  choice: बँधुआई में
  rationale: निर्वासन और बंदी दशा दोनों का भाव रखने वाली प्रचलित बाइबलीय हिन्दी अभिव्यक्ति।
theological_decisions:
- issue: ‘इस्राएल के बारह राजदंड’ का संकेतार्थ
  choice: प्रतीकात्मक पदबंध को ज्यों का त्यों रखा गया
  alternative: ‘इस्राएल के बारह गोत्र’
  rationale: σκῆπτρα स्पष्ट रूप से ‘राजदंड’ कहता है। इसे ‘गोत्र’ कर देना प्रतीक की व्याख्या को मुख्य पाठ में बैठा देता और मूल की काव्यात्मक-राजकीय छवि मिटा देता।
- issue: ‘inherit in captivity’ की कठिन संरचना
  choice: ‘बँधुआई में अपने अधिकार में कर लेंगे’
  alternative: ‘बँधुआई को विरासत में पाएँगे’ या ‘बँधुआ बनाकर ले जाएँगे’
  rationale: पहला विकल्प हिन्दी में अस्पष्ट और भ्रामक है, जबकि दूसरा κληρονομήσουσιν के अधिकार/उत्तराधिकार संबंधी भाव को मिटा देता है। चुनी हुई अभिव्यक्ति दोनों घटकों को यथासंभव बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। जाति-नामों के प्रचलित ऐतिहासिक रूप—अश्शूरी, मादी, फ़ारसी, कसदी और अरामी—रखे गए हैं। ‘और देखो’ दर्शन-वर्णन की मूल शैली को सुरक्षित रखता है।
