  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/001.yaml
  text: And being brought low, you will turn back and acknowledge the Lord your God, and he will bring you back into your land according to his great mercy. 4 And it shall come to pass, when they go out into the land of their fathers, again they will forget the Lord and act impiously. 5 And the Lord will scatter them upon the face of all the earth, until the compassion of the Lord shall come, a man working righteousness and showing mercy to all who are far off and to those who are near.
translation:
  language: hi
  text: 3 और जब तुम दीन किए जाओगे, तब लौटोगे और अपने परमेश्वर, प्रभु को पहचानोगे; और वह अपनी बड़ी दया के अनुसार तुम्हें तुम्हारी भूमि में लौटा लाएगा। 4 और ऐसा होगा कि जब वे निकलकर अपने पूर्वजों की भूमि में जाएँगे, तब वे फिर प्रभु को भूल जाएँगे और अधर्म करेंगे। 5 तब प्रभु उन्हें सारी पृथ्वी पर तितर-बितर कर देगा, जब तक प्रभु की करुणा न आ जाए—एक मनुष्य, जो धार्मिकता करता है और दूर तथा निकट के सब लोगों के प्रति दया करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रभु की करुणा … एक मनुष्य” का यूनानी वाक्य असामान्य है; इसे इस अर्थ में भी समझा जा सकता है कि वह मनुष्य प्रभु की करुणा का प्रकटीकरण है।
    reason: मूल की व्याकरणिक और धर्मवैज्ञानिक अस्पष्टता पाठक के लिए सुरक्षित रखना।
lexical_decisions:
- source_word: σμικρυνθέντες
  choice: दीन किए जाओगे
  rationale: शाब्दिक अर्थ ‘छोटा किए गए’ है; प्रसंग में अपमानित या नीचा किए जाने का भाव है। ‘दीन किए जाओगे’ इस निष्क्रिय रूप और भाव दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπιστρέψετε / ἐπιστρέψει
  choice: लौटोगे / लौटा लाएगा
  rationale: 'एक ही यूनानी धातु की पुनरावृत्ति को यथासंभव बनाए रखा गया है: पहले लोगों का प्रभु की ओर लौटना, फिर प्रभु का उन्हें भूमि में वापस लाना।'
- source_word: ἐπιγνώσεσθε
  choice: पहचानोगे
  rationale: यह केवल सूचना प्राप्त करने से अधिक, प्रभु को पहचानने या स्वीकार करने का बोध देता है।
- source_word: ἀσεβήσουσιν
  choice: अधर्म करेंगे
  rationale: शब्द का अर्थ ईश्वर-विरोधी या अपवित्र आचरण करना है; ‘अधर्म करेंगे’ आधुनिक हिन्दी में सहज और धार्मिक संदर्भ के अनुकूल है।
- source_word: διασπερεῖ
  choice: तितर-बितर कर देगा
  rationale: लोगों को व्यापक रूप से विभिन्न स्थानों में बिखेरने का अर्थ स्पष्ट करता है।
- source_word: τὸ σπλάγχνον Κυρίου
  choice: प्रभु की करुणा
  rationale: σπλάγχνον का मूल बिंब अंतड़ियों/अंतरतम से जुड़ा है और रूपकतः गहरी करुणा बताता है। यहाँ एकवचन और उसके बाद के ‘एक मनुष्य’ वाले समानाधिकरण की असामान्यता को वाक्य में बनाए रखा गया है।
- source_word: ποιῶν δικαιοσύνην
  choice: धार्मिकता करता
  rationale: यूनानी की क्रियात्मक अभिव्यक्ति को रखा गया है; इसे केवल ‘धर्मी’ बनाकर संक्षिप्त नहीं किया गया।
- source_word: τοὺς μακρὰν καὶ τοὺς ἐγγύς
  choice: दूर तथा निकट के सभी लोगों
  rationale: स्थानिक/रूपक दोनों संभावनाएँ खुली रखता है और किसी विशिष्ट सामुदायिक पहचान को नहीं जोड़ता।
theological_decisions:
- issue: ‘प्रभु की करुणा’ और ‘एक मनुष्य’ का संबंध
  choice: डैश द्वारा दोनों को समीप रखकर ‘एक मनुष्य’ को करुणा की व्याख्या या समानाधिकरण के रूप में पढ़ने की संभावना बनाए रखी गई है।
  alternative: ‘प्रभु की करुणा एक मनुष्य के रूप में आएगी’ अथवा दोनों को स्वतंत्र कर्ताओं की तरह प्रस्तुत करना।
  rationale: यूनानी वाक्य स्वयं असामान्य और धर्मवैज्ञानिक रूप से तनावपूर्ण है। स्पष्ट अवतारगत अर्थ जोड़ना या संबंध तोड़ना मूल की अस्पष्टता को अनुचित रूप से सुलझा देता।
- issue: ἄχρις οὗ ἔλθῃ में आगमन का कर्ता
  choice: ‘प्रभु की करुणा’ को व्याकरणिक कर्ता रखते हुए ‘न आ जाए’ अनुवाद किया गया।
  alternative: ‘जब तक प्रभु दया न करे’ या ‘जब तक एक मनुष्य न आए’।
  rationale: मूल पाठ में स्पष्ट संज्ञा-पद ‘प्रभु की करुणा’ है; क्रियात्मक व्याख्या या अगले पद को प्रत्यक्ष कर्ता बनाना अधिक व्याख्यात्मक होता।
- issue: दूर और निकट की पहचान
  choice: सामान्य ‘लोगों’ के रूप में रखा गया।
  alternative: अन्यजाति और यहूदी, या निर्वासित और देशवासी।
  rationale: मूल पाठ इन समूहों को नाम नहीं देता; किसी विशिष्ट धर्मवैज्ञानिक पहचान को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘प्रभु’, ‘परमेश्वर’, ‘धार्मिकता’ और ‘अधर्म’ जैसे प्रचलित धार्मिक शब्द रखे गए हैं। पद 5 की असामान्य संरचना को अत्यधिक सरल नहीं किया गया, ताकि मूल पाठ का तनाव बना रहे।
