source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ ὄντος²⁰ τοῦ Λευὶ *ὡς ὁ ἥλιος²¹, Γἰδοὺ²² νέος²³ *τις ἐπιδίδωσιν²⁴ αὐτῷ βαΐα φοινίκων δώδεκα, καὶ Ἰούδας *ἐγένετο λαμπρὸς²⁵ ὡς *ἡ σελήνη²⁶, καὶ *ἦσαν ὑπὸ τοὺς πόδας αὐτῶν²⁷ δώδεκα ἀκτῖνες²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/004.yaml
  text: And while Levi was like the sun, behold, a certain young man gives him twelve palm branches; and Judah became bright like the moon, and beneath their feet were twelve rays.
translation:
  language: hi
  text: और जब लेवी सूर्य के समान था, तो देखो, एक युवक उसे ताड़ की बारह शाखाएँ देता है; और यहूदा चन्द्रमा के समान उज्ज्वल हो गया, और उनके पैरों के नीचे बारह किरणें थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαΐα φοινίκων
  choice: खजूर की डालियाँ
  rationale: यह पद खजूर के वृक्ष की शाखाओं या डालियों को दर्शाता है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: νέος τις
  choice: एक युवक
  rationale: τις की अनिश्चितता को ‘एक’ से रखा गया है, बिना उस युवक की पहचान निर्धारित किए।
- source_word: ἀκτῖνες
  choice: किरणें
  rationale: सूर्य और चन्द्रमा की प्रकाशमय उपमा के संदर्भ में ‘किरणें’ सबसे स्वाभाविक अर्थ है।
theological_decisions:
- issue: ‘उनके पैरों’ में बहुवचन सर्वनाम का संकेत
  choice: उनके पैरों के नीचे
  alternative: लेवी और यहूदा के पैरों के नीचे
  rationale: यूनानी पाठ की सर्वनामगत संक्षिप्तता और संभावित संदर्भगत अस्पष्टता को स्पष्ट नाम जोड़कर सीमित नहीं किया गया।
- issue: कथन में वर्तमान और भूतकाल का मिश्रण
  choice: ‘देता है’ के साथ ‘हो गया’ और ‘थीं’
  alternative: सभी क्रियाएँ भूतकाल में
  rationale: ἐπιδίδωσιν के जीवंत वर्तमानकाल को सुरक्षित रखा गया, जबकि ἐγένετο और ἦσαν के भूतकाल को भी यथावत रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तो देखो’ ने ἰδού की कथात्मक आकस्मिकता और ध्यानाकर्षण को बनाए रखा है।
