  text: And behold, a bull was on the earth, having two great horns and the wings of an eagle on its back; and though we wanted to seize it, we were not able.
translation:
  language: hi
  text: और देखो, धरती पर एक बैल था, जिसके दो बड़े सींग और उसकी पीठ पर उकाब के पंख थे। हम उसे पकड़ना चाहते थे, पर पकड़ न सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: दर्शन-वर्णन में ध्यान आकर्षित करने वाले यूनानी उद्गार का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ταῦρος
  choice: बैल
  rationale: वयस्क नर गोवंश के लिए सामान्य आधुनिक हिन्दी शब्द।
- source_word: πτέρυγας ἀετοῦ
  choice: उकाब के पंख
  rationale: संबंधवाचक यूनानी पदबंध को स्वाभाविक हिन्दी में रखा गया; ‘उकाब’ ἀετός के बड़े शिकारी पक्षी वाले अर्थ को व्यक्त करता है।
- source_word: πιάσαι
  choice: पकड़ना
  rationale: यहाँ जीव को अपने वश में लेने अथवा धर लेने के प्रयास का सहज हिन्दी रूप।
- source_word: οὐκ ἠδυνήθημεν
  choice: पकड़ न सके
  rationale: असमर्थता को स्वाभाविक हिन्दी में व्यक्त करते हुए पूर्ववर्ती क्रिया को स्पष्ट रूप से दोहराया गया।
