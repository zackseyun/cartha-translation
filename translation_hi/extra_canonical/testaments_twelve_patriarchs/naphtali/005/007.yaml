  text: But Joseph came and seized him, and went up with him to the height.
translation:
  language: hi
  text: लेकिन यूसुफ़ ने आकर उसे पकड़ लिया और उसके साथ ऊँचाई पर चढ़ गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ
  choice: लेकिन … ने आकर
  rationale: δὲ को प्रसंगगत विरोध/मोड़ के रूप में ‘लेकिन’ और पूर्वकालिक कृदंत ἐλθών को स्वाभाविक हिन्दी ‘आकर’ से व्यक्त किया गया।
- source_word: κατέλαβεν
  choice: पकड़ लिया
  rationale: क्रिया यहाँ किसी व्यक्ति को दृढ़ता से पकड़ लेने का भाव देती है; ‘पकड़ लिया’ आधुनिक हिन्दी में सटीक और स्वाभाविक है, जबकि ‘क़ब्ज़े में कर लिया’ अनावश्यक रूप से कठोर होता।
- source_word: αὐτόν / αὐτῷ
  choice: उसे / उसके साथ
  rationale: दोनों पुल्लिंग एकवचन सर्वनाम हैं; इसलिए व्यक्ति-संदर्भ को बनाए रखा गया है, निर्जीव ‘इसे/इसके’ नहीं किया गया।
- source_word: συνανῆλθεν
  choice: उसके साथ … चढ़ गया
  rationale: συν- सहगमन और ἀνῆλθεν ऊपर जाने/चढ़ने को व्यक्त करता है; संयुक्त अर्थ को सहज हिन्दी में रखा गया।
- source_word: εἰς τὸ ὕψος
  choice: ऊँचाई पर
  rationale: शाब्दिक अर्थ ‘ऊँचाई की ओर/में’ है; गंतव्य के अर्थ को प्राकृतिक हिन्दी ‘ऊँचाई पर’ से व्यक्त किया गया, बिना अस्पष्ट स्थान को किसी विशेष पर्वत या स्थान में बदलने के।
theological_decisions: []
