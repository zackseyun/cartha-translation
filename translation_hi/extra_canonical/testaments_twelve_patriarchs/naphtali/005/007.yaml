  source_fidelity: 'The Hindi accurately represents the sequence and relations in the Greek: Joseph comes (ἐλθών), seizes the masculine-singular referent (κατέλαβεν αὐτόν), and goes up together with him (συνανῆλθεν αὐτῷ) to the height (εἰς τὸ ὕψος). It appropriately retains the unresolved antecedent of the pronouns.'
