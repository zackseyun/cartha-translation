translation:
  language: hi
  text: और वे दोनों—लेवी और यहूदा—दौड़कर उनके पास पहुँचे और उन्हें पकड़ लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδραμόντες
  choice: दौड़कर उनके पास पहुँचे
  rationale: यह कृदन्त किसी की ओर दौड़कर पास आने का भाव देता है; हिन्दी में यह पदबंध उस गति और निकट पहुँचने, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ δύο ... Λευὶ καὶ Ἰούδας
  choice: वे दोनों—लेवी और यहूदा—
  rationale: मूल में पहले ‘दोनों’ और फिर उनकी पहचान लेवी तथा यहूदा के रूप में दी गई है; डैश इस समानाधिकरण को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἐκράτησαν αὐτούς
  choice: उन्हें पकड़ लिया
  rationale: ἐκράτησαν यहाँ बलपूर्वक पकड़ने या काबू में करने का सामान्य अर्थ देता है। ‘पकड़ लिया’ प्रसंग को अनावश्यक रूप से अधिक कठोर बनाए बिना इसे सीधे व्यक्त करता है।
