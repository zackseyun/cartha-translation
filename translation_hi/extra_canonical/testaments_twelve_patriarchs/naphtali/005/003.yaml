  text: And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.
translation:
  language: hi
  text: और हम सब एक साथ दौड़े, और लेवी ने सूर्य को पकड़ लिया, और यहूदा ने पहले पहुँचकर चंद्रमा को थाम लिया; और वे दोनों उनके साथ ऊपर उठा लिए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδράμομεν πάντες ὁμοῦ
  choice: हम सब एक साथ दौड़े
  rationale: सभी के मिलकर दौड़ने के भाव को स्वाभाविक और निकट रूप में व्यक्त करता है।
- source_word: ἐκράτησε τὸν ἥλιον
  choice: सूर्य को पकड़ लिया
  rationale: ἐκράτησε के पकड़ने या अपने वश में लेने के ठोस भाव को बनाए रखता है।
- source_word: φθάσας
  choice: पहले पहुँचकर
  rationale: संदर्भ में यह दूसरे से पहले पहुँचने का भाव देता है; हिन्दी में इसे संक्षिप्त और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἔπιασε τὴν σελήνην
  choice: चंद्रमा को थाम लिया
  rationale: ἔπιασε के पकड़ लेने के अर्थ को व्यक्त करते हुए पास के ἐκράτησε से हल्का शैलीगत भेद बनाए रखता है।
- source_word: ὑψώθησαν
  choice: ऊपर उठा लिए गए
  rationale: यूनानी के कर्मवाच्य रूप को बनाए रखता है और उठाने वाले की पहचान नहीं जोड़ता।
theological_decisions:
- issue: ἀμφότεροι और αὐτοῖς के संकेतार्थ
  choice: वे दोनों उनके साथ
  alternative: लेवी और यहूदा सूर्य और चंद्रमा के साथ
  rationale: मूल पाठ सर्वनामों का प्रयोग करता है। हिन्दी में भी सर्वनाम रखकर मूल की संदर्भगत अस्पष्टता और स्वप्न-दृश्य की शैली सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूर्य और चंद्रमा के लिए प्रचलित मानक हिन्दी शब्द चुने गए हैं; मूल के कर्मवाच्य और सर्वनामगत अस्पष्टता को जानबूझकर सुरक्षित रखा गया है।
