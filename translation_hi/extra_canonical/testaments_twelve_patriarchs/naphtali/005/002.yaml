  rationale: दर्शन-वर्णन में ध्यान आकर्षित करने वाले यूनानी उद्गार का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ὁ πατὴρ τοῦ πατρός μου
  choice: मेरे पिता के पिता
  rationale: ‘मेरे दादा’ कहने के बजाय मूल की संबंधसूचक अभिव्यक्ति को बनाए रखा गया है।
- source_word: Προσδραμόντες
  choice: दौड़कर आगे बढ़ो
  rationale: क्रिया में किसी लक्ष्य की ओर दौड़ने का भाव है; यह रूप हिन्दी में स्वाभाविक रहते हुए उस दिशात्मक भाव को व्यक्त करता है।
- source_word: κρατήσατε / τοῦ πιάσαντος
  choice: पकड़ ले / जो पकड़ लेगा
  rationale: दो निकटार्थक यूनानी क्रियाओं के यहाँ साझा आशय ‘पकड़ना/अधिकार में लेना’ है; हिन्दी में पुनरावृत्ति कथन की चुनौती और परिणाम के संबंध को स्पष्ट रखती है।
- source_word: κατὰ δύναμιν
  choice: अपनी सामर्थ्य के अनुसार
  rationale: हर व्यक्ति की शक्ति की सीमा के अनुरूप प्रयत्न करने का मूल भाव सुरक्षित है।
- source_word: ἔσται ὁ ἥλιος καὶ ἡ σελήνη
  choice: सूर्य और चन्द्रमा उसके होंगे
  rationale: यूनानी स्वामित्व-सूचक रचना का स्पष्ट, स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
