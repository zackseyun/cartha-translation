base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/002.yaml
  text: V. For in the fortieth year of my life, I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still. 2 And behold, Isaac, the father of my father, said to us, “Run up, and let each of you seize according to his strength; and the one who takes hold shall have the sun and the moon.”
translation:
  language: hi
  text: 2 और देखो, इसहाक, जो मेरे पिता के पिता थे, ने हमसे कहा, “दौड़कर आगे आओ, और तुममें से हर एक अपनी सामर्थ्य के अनुसार पकड़ ले[a]; और जो पकड़ लेगा, सूर्य और चन्द्रमा उसके होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘पकड़ ले’ का कर्म स्पष्ट रूप से नहीं दिया गया है।
    reason: मूल पाठ की वास्तविक अनिर्दिष्टता को दिखाना और ‘उन्हें’ जैसे अनुमानित कर्म को मुख्य पाठ में जोड़ने से बचना।
lexical_decisions:
