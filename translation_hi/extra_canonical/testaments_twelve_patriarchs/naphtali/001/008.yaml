source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Ὅθεν καὶ ὅμοιός μου⁴⁶ ἦν Γκατὰ πάντα¹⁴⁷ Ἰωσὴφ⁴⁸ κατὰ τὰς †εὐλογίας⁴⁹ Ῥαχιήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/008.yaml
  text: Therefore Joseph also was like me in every way, according to the prayers of Rachel.
translation:
  language: hi
  text: इसी कारण यूसुफ भी हर बात में मेरे समान था—राहेल की प्रार्थनाओं के अनुसार।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठों में “प्रार्थनाओं” के स्थान पर “आशीषों” है।
    reason: यूनानी परंपरा में εὐχάς (“प्रार्थनाओं”) और εὐλογίας (“आशीषों”) का पाठभेद है; इसे छिपाने के बजाय पाठक के सामने रखा गया है।
lexical_decisions:
- source_word: Ὅθεν
  choice: इसी कारण
  rationale: यह पूर्व कथन से परिणाम या निष्कर्ष का संबंध व्यक्त करता है।
- source_word: ὅμοιός μου ἦν ... κατὰ πάντα
  choice: हर बात में मेरे समान था
  rationale: यूनानी वाक्यांश का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप; समानता के व्यापक दायरे को बनाए रखता है।
- source_word: Γκατὰ / κατὰ
  choice: के अनुसार
  rationale: यहाँ संबंध या अनुरूपता व्यक्त करने वाला सामान्य अर्थ उपयुक्त है।
- source_word: 'εὐλογίας (variant: εὐχάς)'
  choice: प्रार्थनाओं
  rationale: प्रस्तुत पाठ में शब्द संदिग्ध/पाठभेदयुक्त है; आलोचनात्मक संकेत और उपलब्ध पांडुलिपि-पाठ εὐχάς के आधार पर 'प्रार्थनाओं' को मुख्य पाठ में रखा गया है, जो राहेल के साथ भी स्वाभाविक बैठता है।
theological_decisions:
- issue: राहेल से संबंधित संज्ञा का पाठभेद
  choice: प्रार्थनाओं
  alternative: आशीषों
  rationale: मुद्रित यूनानी में †εὐλογίας पाठ संदिग्ध चिह्नित है, जबकि उपकरण में εὐχάς का समर्थन बताया गया है। इसलिए मुख्य पाठ में 'प्रार्थनाओं' को चुना और वास्तविक अनिश्चितता को पादटिप्पणी में सुरक्षित रखा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और निकट-औपचारिक शैली। डैश अंतिम पदबंध को स्पष्ट करता है, जबकि पाठभेद को [a] में दर्ज किया गया है।
