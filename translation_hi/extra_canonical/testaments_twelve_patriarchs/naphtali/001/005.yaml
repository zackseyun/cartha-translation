translation:
  language: hi
  text: तब वह कहने लगा, “हे मेरे बच्चों, नप्ताली के पुत्रों, सुनो; अपने पिता की बातें सुनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥρξατο δὲ λέγειν
  choice: तब वह कहने लगा
  rationale: आरंभसूचक क्रिया और δὲ के कथात्मक संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक संबोधन को सीधे और स्वाभाविक रूप में रखता है; इसकी पुनरावृत्ति भी मूल के अनुसार सुरक्षित है।
- source_word: τέκνα μου
  choice: हे मेरे बच्चो
  rationale: स्नेहपूर्ण प्रत्यक्ष संबोधन को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: υἱοὶ Νεφθαλείμ
  choice: नप्ताली के पुत्रो
  rationale: वंशगत पहचान बताने वाले संबोधन को औपचारिक रूप में सुरक्षित रखता है।
- source_word: λόγους πατρὸς ὑμῶν
  choice: अपने पिता की बातें
  rationale: λόγους का प्रसंगानुकूल अर्थ ‘बातें/वचन’ है; ‘अपने पिता’ हिन्दी में संबंध को सहजता से स्पष्ट करता है।
