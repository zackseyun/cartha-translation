translation:
  language: hi
  text: जब उसके पुत्र सातवें महीने के पहले दिन इकट्ठे हुए, तब उसने उनके लिए भोज तैयार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνελθόντων
  choice: इकट्ठे हुए
  rationale: यह संबंधवाचक संबंधसूचक जननात्मक निरपेक्ष रचना है; हिन्दी में ‘जब ... इकट्ठे हुए’ स्वाभाविक रूप से समय-संबंध व्यक्त करता है।
- source_word: ἐν τῷ ἑβδόμῳ μηνί, μιᾷ τοῦ μηνός
  choice: सातवें महीने के पहले दिन
  rationale: यूनानी वाक्यांश का अर्थ सातवें महीने की पहली तारीख है; संक्षिप्त हिन्दी रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἐποίησε δεῖπνον
  choice: भोज तैयार किया
  rationale: शाब्दिक ‘भोज बनाया’ की अपेक्षा यह आधुनिक हिन्दी में आतिथ्य के लिए भोजन की व्यवस्था करने का स्वाभाविक संकेत देता है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: सम्प्रदान कारक बताता है कि भोज पुत्रों के लिए तैयार किया गया था।
