  text: And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him.
translation:
  language: hi
  text: और सुबह, उसके जागने के बाद, उसने उनसे कहा, “मैं मर रहा हूँ”; पर उन्होंने उसकी बात पर विश्वास नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρωί
  choice: सुबह
  rationale: समय-सूचक यूनानी पद का सहज और सटीक आधुनिक हिन्दी रूप।
- source_word: μετὰ τὸ ἐξυπνισθῆναι αὐτόν
  choice: जागने के बाद
  rationale: कालगत संबंध को स्पष्ट रखते हुए यूनानी क्रिया के अकर्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἀποθνήσκω
  choice: मैं मर रहा हूँ
  rationale: वर्तमान काल की आसन्न या जारी मृत्यु की घोषणा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: उन्होंने उसका विश्वास नहीं किया
  rationale: πιστεύω के साथ सम्प्रदान कारक का अर्थ यहाँ व्यक्ति की कही बात पर विश्वास न करना है; यह हिन्दी प्रयोग उस संबंध को संक्षेप में बनाए रखता है।
