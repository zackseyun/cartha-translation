id: T12P.NAP.1.4
reference: Testament of Naphtali 1:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ²⁰ *δοξάζων τὸν²¹ Κύριον²² *ἐκραταιώθη καὶ εἶπεν²³, ὅτι Μετὰ τὸ δεῖπνον τὸ χθὲς *ἀπέθανεν ἡ σάρξ μου²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/004.yaml
  text: And while blessing and glorifying the Lord, he grew strong and said, “After yesterday’s meal, my flesh died.”
translation:
  language: hi
  text: और प्रभु की महिमा करते हुए उसमें बल आ गया, और उसने कहा, “कल के भोजन के बाद मेरी देह मर गई।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: महिमा करते हुए
  rationale: यह वर्तमान कृदंत प्रभु की महिमा करने की क्रिया को मुख्य क्रिया के साथ चलती हुई दिखाता है। मूल यूनानी में अलग से ‘आशीष देते हुए’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἐκραταιώθη
  choice: बलवान हुआ
  rationale: निष्क्रिय रूप का अर्थ ‘बल पाया/दृढ़ हुआ’ है; ‘बलवान हुआ’ संक्षिप्त रहते हुए मूल अर्थ को सुरक्षित रखता है।
- source_word: δεῖπνον
  choice: भोजन
  rationale: यहाँ शब्द सामान्यतः दिन के मुख्य या संध्याकालीन भोजन का संकेत देता है; प्रसंग में ‘भोज’ जैसा उत्सवी अर्थ आवश्यक नहीं है।
- source_word: σάρξ
  choice: देह
  rationale: ‘देह’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ व्यक्ति के शारीरिक अस्तित्व को व्यक्त करता है; इसे व्याख्यात्मक रूप से ‘शक्ति’ या ‘शरीर की दशा’ नहीं बनाया गया।
- source_word: ἀπέθανεν
  choice: मर गई थी
  rationale: क्रिया सीधे मृत्यु को व्यक्त करती है। हिन्दी का पूर्ण भूतकाल उस घटना को बाद में कही गई बात के रूप में स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: ‘मेरी देह मर गई’ कथन का आशय
  choice: रूपक या शारीरिक दुर्बलता की व्याख्या जोड़े बिना कथन को यथावत रखा गया
  alternative: ‘मेरे शरीर ने काम करना छोड़ दिया’ या ‘मैं मरणासन्न हो गया’
  rationale: मूल वाक्य जानबूझकर तीखा और संभवतः रूपकात्मक है। अनुवाद में उसकी अस्पष्टता और तनाव को सुरक्षित रखना उचित है।
- issue: ὅτι का कार्य
  choice: इसे प्रत्यक्ष कथन का परिचायक मानकर हिन्दी में अलग शब्द नहीं जोड़ा गया
  alternative: ‘क्योंकि’
  rationale: εἶπεν के बाद ὅτι प्रायः कही गई बात का परिचय देता है। ‘क्योंकि’ लगाने से ऐसा कारण-संबंध बन सकता है जो यहाँ आवश्यक नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। वाक्य की असामान्य छवि—‘मेरी देह मर गई थी’—को स्पष्ट करने के नाम पर नरम या विस्तृत नहीं किया गया।
