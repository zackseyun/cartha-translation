  text: A copy of the testament of Naphtali, the eighth son of Jacob, which he ordained at the time of his departure, in the hundred and thirtieth year of his life.
translation:
  language: hi
  text: नप्ताली की वसीयत की एक प्रतिलिपि—नप्ताली याकूब और बिल्हा का आठवाँ पुत्र था—जिसे उसने अपने प्रस्थान के समय, अपने जीवन के एक सौ तीसवें वर्ष में बनाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह किसी लिखित दस्तावेज़ की नकल या प्रति को सूचित करता है; आधुनिक हिन्दी में ‘प्रतिलिपि’ स्पष्ट और गरिमापूर्ण है।
- source_word: διαθήκης
  choice: वसीयत
  rationale: इस साहित्यिक संदर्भ में यह मृत्यु से पहले दी गई अंतिम वसीयती शिक्षा को दर्शाता है; ‘वाचा’ यहाँ अपेक्षाकृत भ्रामक होती।
- source_word: διέθετο
  choice: ठहराया
  rationale: मध्यवाच्य क्रिया यहाँ वसीयत निर्धारित या स्थापित करने का भाव रखती है। ‘ठहराया’ उस औपचारिक भाव को रखता है, बिना आधुनिक कानूनी भाषा को अत्यधिक आरोपित किए।
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: अपने प्रस्थान के समय
  rationale: ‘प्रस्थान’ मूल के शिष्ट और संभवतः मृत्यु-सूचक अप्रत्यक्ष भाव को बनाए रखता है।
- source_word: ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ τῆς ζωῆς αὐτοῦ
  choice: अपने जीवन के एक सौ तीसवें वर्ष में
  rationale: ग्रीक की क्रमवाचक अभिव्यक्ति का स्वाभाविक और सटीक हिन्दी रूप।
theological_decisions:
- issue: διαθήκη का अर्थ
  choice: वसीयत
  alternative: वाचा
  rationale: रचना का प्रकार और मृत्यु-पूर्व निर्देशों का प्रसंग ‘वसीयत’ का समर्थन करता है; यहाँ परमेश्वर और मनुष्य के बीच वाचा अभिप्रेत नहीं है।
- issue: ἔξοδος का संकेत
  choice: प्रस्थान
  alternative: मृत्यु
  rationale: मूल पाठ सीधे ‘मृत्यु’ नहीं कहता। ‘प्रस्थान’ उसकी विनम्र अभिव्यक्ति और संभावित अर्थ-व्याप्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, औपचारिक किंतु सहज रखी गई है। संबंधसूचक मध्यांश को डैशों के बीच रखकर यूनानी वाक्य की संरचना स्पष्ट की गई है। उपलब्ध अंश के प्रारंभिक शीर्षक ‘याकूब और बिल्हा का आठवाँ पुत्र’ को पद के भीतर लिया गया है, क्योंकि अंग्रेज़ी परामर्श-पाठ भी उसे इसी वाक्य का अंग मानता है।
