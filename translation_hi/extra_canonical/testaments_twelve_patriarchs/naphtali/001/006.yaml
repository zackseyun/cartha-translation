base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/006.yaml
  text: I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me on Rachel’s knees, and for this reason she called my name Naphtali.
translation:
  language: hi
  text: मैं बिल्हा से जन्मा, क्योंकि राहेल ने चतुराई से काम लिया और अपने स्थान पर बिल्हा को याकूब को दे दिया। बिल्हा ने गर्भधारण किया और राहेल के घुटनों पर मुझे जन्म दिया; इसी कारण उसने मेरा नाम नप्ताली रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: चतुराई से काम लिया
  rationale: यह यूनानी पदबंध राहेल के कौशल या चालाकी से किए गए कार्य को व्यक्त करता है। ‘चतुराई’ मूल की नैतिक अस्पष्टता को बनाए रखती है और ‘छल’ जैसा अधिक कठोर निष्कर्ष नहीं थोपती।
- source_word: ἀντʼ αὐτῆς
  choice: अपने स्थान पर
  rationale: बिल्हा को राहेल की प्रतिनिधि के रूप में याकूब को दिए जाने का भाव सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  choice: राहेल के घुटनों पर
  rationale: मूल रूपक और प्राचीन प्रतिनिधिक मातृत्व की रीति को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: ἐκάλεσε τὸ ὄνομά μου Νεφθαλείμ
  choice: उसने मेरा नाम नप्ताली रखा
  rationale: नाम रखने के यूनानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: राहेल के कार्य का नैतिक मूल्यांकन
  choice: चतुराई से काम लिया
  alternative: छल से काम लिया
  rationale: πανουργία नकारात्मक चालाकी का संकेत दे सकता है, पर संदर्भ इसे स्पष्ट रूप से छल घोषित नहीं करता; इसलिए अनुवाद मूल की तनावपूर्ण अस्पष्टता बनाए रखता है।
- issue: ‘उसने’ का कर्ता
  choice: राहेल
  alternative: बिल्हा
  rationale: निकटवर्ती स्त्रीलिंग कर्ताओं के कारण यूनानी में संदर्भगत अस्पष्टता संभव है, पर उत्पत्ति 30:8 और अंग्रेज़ी परामर्श-पाठ के अनुरूप नाम रखने वाली राहेल समझी गई है। हिन्दी मुख्य पाठ में सर्वनाम रखा गया है ताकि मूल की अभिव्यक्ति से अनावश्यक विस्तार न हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास को हिन्दी के स्वाभाविक प्रवाह के अनुसार दो वाक्यों में बाँटा गया है, जबकि कारण और परिणाम का संबंध सुरक्षित है।
