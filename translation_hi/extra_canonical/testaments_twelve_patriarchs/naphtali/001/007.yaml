id: T12P.NAP.1.7
reference: Testament of Naphtali 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. *Ἠγάπησε γάρ³⁹ με Ῥαχιὴλ⁴⁰ πάνυ⁴¹, ὅτι ἐπὶ *τῶν γονάτων⁴² αὐτῆς ἐγεννήθην, καὶ ἔτι⁴³ ἁπαλὸν ὄντα *με κατεφίλει⁴⁴ λέγουσα· *Δοίη μοι ἀδελφόν⁴⁵ σου ἐκ τῆς κοιλίας μου κατά σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/007.yaml
  text: For Rachel loved me greatly, because I was born upon her knees; and while I was still tender she kept kissing me, saying, ‘May I be given from my own womb a brother like you.’
translation:
  language: hi
  text: क्योंकि राहेल मुझसे बहुत प्रेम करती थी, क्योंकि मेरा जन्म उसके घुटनों पर हुआ था।[a] जब मैं अभी कोमल शिशु ही था, तब वह मुझे बार-बार चूमती और कहती थी, “काश, मेरे गर्भ से मुझे तुम्हारे जैसा तुम्हारा एक भाई मिले।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके घुटनों पर” मूल यूनानी का शाब्दिक रूप है। यह अभिव्यक्ति बच्चे को अपना मानकर ग्रहण करने या जन्म के समय उसे गोद में लेने की प्राचीन रीति की ओर संकेत कर सकती है।
    reason: सांस्कृतिक मुहावरे को मुख्य पाठ में सुरक्षित रखते हुए संभावित आशय बताना।
  - marker: b
    text: “मिले” के यूनानी रूप में देने वाला स्पष्ट नहीं है; इसका आशय “परमेश्वर मुझे दे” भी हो सकता है।
    reason: अव्यक्त कर्ता की वास्तविक भाषिक और धार्मिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: πάνυ
  choice: बहुत
  rationale: यह क्रियाविशेषण राहेल के प्रेम की प्रबलता व्यक्त करता है; सरल आधुनिक हिन्दी में ‘बहुत’ स्वाभाविक है।
- source_word: ἐπὶ τῶν γονάτων αὐτῆς
  choice: उसके घुटनों पर
  rationale: मूल यूनानी की ठोस और सांस्कृतिक रूप से अर्थपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: ἁπαλὸν ὄντα με
  choice: जब मैं अभी कोमल शिशु ही था
  rationale: ἁπαλός का मूल अर्थ ‘कोमल’ है; ‘शिशु’ प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि ‘अभी’ और ‘ही’ कम आयु पर बल बनाए रखते हैं।
- source_word: κατεφίλει
  choice: बार-बार चूमती ... थी
  rationale: अपूर्ण भूतकाल का रूप निरंतर या बारंबार स्नेहपूर्ण चूमने का भाव दे सकता है; हिन्दी में ‘बार-बार’ इसे सहज रूप से व्यक्त करता है।
- source_word: ἀδελφόν σου ... κατά σε
  choice: तुम्हारे जैसा तुम्हारा एक भाई
  rationale: ‘तुम्हारा भाई’ और ‘तुम्हारे जैसा’—दोनों अलग तत्वों को रखा गया है; इससे मूल की कुछ असहज पर अर्थपूर्ण पुनरुक्ति नष्ट नहीं होती।
theological_decisions:
- issue: δοίη में देने वाले का अव्यक्त कर्ता
  choice: “काश ... मुझे ... मिले”
  alternative: “परमेश्वर मुझे ... दे”
  rationale: यूनानी क्रिया में कर्ता स्पष्ट नहीं है। परमेश्वर को कर्ता बनाना संभव है, पर मूल में अव्यक्त बात को स्पष्ट धार्मिक कथन में बदल देता; इसलिए इच्छा/प्रार्थना का भाव रखते हुए कर्ता को अव्यक्त रखा गया है।
- issue: ‘उसके घुटनों पर जन्म’ का सांस्कृतिक अर्थ
  choice: मुख्य पाठ में शाब्दिक रूप बनाए रखा
  alternative: इसे दत्तक ग्रहण, स्वीकृति या प्रसव-सहायता के रूप में सीधे समझाकर अनुवाद करना
  rationale: वाक्यांश का सटीक सांस्कृतिक आशय विवादित या बहुस्तरीय हो सकता है। अनुवाद किसी एक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘राहेल’, ‘गर्भ’ और ‘कोमल शिशु’ जैसे रूप सामान्य हिन्दी पाठक के लिए स्पष्ट हैं। वाक्य-विन्यास को स्वाभाविक बनाने के लिए यूनानी के लंबे वाक्य को दो वाक्यों में बाँटा गया है, पर कारण-संबंध, कालगत भाव और प्रत्यक्ष कथन पूर्णतः सुरक्षित हैं।
