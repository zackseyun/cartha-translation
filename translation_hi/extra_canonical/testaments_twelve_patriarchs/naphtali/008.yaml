  text: VIII. Καὶ¹ ἰδού², τέκνα μου³, ὑπέδειξα ὑμῖν καιροὺς ἐσχάτους †ὅτι⁴ πάντα γενήσεται ἐν Ἰσραήλ. 2. Καὶ ὑμεῖς Γοὖν⁵, ἐντείλασθε τοῖς τέκνοις ὑμῶν⁶ ἵνα ἑνοῦνται τῷ Λευὶ καὶ τῷ⁷ Ἰούδα. Διὰ γὰρ †τοῦ Ἰούδα†⁸ ἀνατελεῖ⁹ ἡ¹⁰ σωτηρία¹¹ τῷ Ἰσραὴλ¹², καὶ ἐν †αὐτῷ¹³ εὐλογηθήσεται¹⁴ Ἰακώβ. 3. Διὰ¹⁵ †τοῦ σκήπτρου αὐτοῦ¹⁶ ὀφθήσεται ὁ¹⁷ Θεὸς [κατοικῶν ἐν ἀνθρώποις¹⁸] ἐπὶ τῆς γῆς, τοῦ¹⁹ σῶσαι *τὸ γένος τοῦ²⁰ Ἰσραήλ, *καὶ ἐπισυνάξει²¹ δικαίους ἐκ τῶν²² ἐθνῶν. 4. *Ἐὰν Γοὖν καὶ ὑμεῖς˥²³ ἐργάσησθε τὸ καλόν²⁴, εὐλογήσουσιν ὑμᾶς *οἱ ἄνθρωποι καὶ οἱ ἄγγελοι²⁵, καὶ ὁ²⁶ Θεὸς δοξασθήσεται ἐν τοῖς ἔθνεσιν *διʼ ὑμῶν²⁷, καὶ ὁ διάβολος φεύξεται ἀφʼ ὑμῶν, Γκαὶ τὰ θηρία φοβηθήσονται ὑμᾶς˥²⁸, *καὶ ὁ Κύριος ἀγαπήσει ὑμᾶς²⁹, [καὶ οἱ ἄγγελοι ἀνθέξονται ὑμῶν]³⁰. 5. *Ὡς ἄν τις³¹ τέκνου³² †ἐκθρέψῃ³³ καλῶς³⁴ μνείαν ἔχει καλήν³⁵, οὕτως³⁶ καὶ *ἐπὶ τοῦ καλοῦ ἔργου μνήμη παρὰ Θεοῦ ἀγαθή³⁷. 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴²,
    *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν. 7. Καὶ γὰρ⁴⁷ αἱ ἐντολαὶ τοῦ νόμου⁴⁸ διπλαῖ εἰσιν Γκαὶ¹⁴⁹ μετὰ τέχνης πληροῦνται⁵⁰. 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴. 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰. 10. Γίνεσθε οὖν *σοφοὶ ἐν θεῷ, τέκνα μου⁶¹, καὶ φρόνιμοι, ἰδόντες⁶² τάξιν ἐντολῶν⁶³ αὐτοῦ⁶⁴ καὶ θεσμοὺς παντὸς πράγματος⁶⁵, ὅπως *ἀγαπήσει ὑμᾶς ὁ Κύριος⁶⁶.
