    3. उसके राजदण्ड के द्वारा परमेश्वर पृथ्वी पर प्रकट होगा और मनुष्यों के बीच निवास करेगा[a], ताकि इस्राएल के वंश को बचाए; और वह अन्यजातियों में से धर्मियों को इकट्ठा करेगा[b]।


