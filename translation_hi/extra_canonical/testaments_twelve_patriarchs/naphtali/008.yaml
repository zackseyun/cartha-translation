  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008.yaml
  text: '1[a]. And behold, my children, I have shown you the times, that all these things will happen in Israel.

    2. And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.

    3. Through his scepter God will appear on the earth, dwelling among men[b], to save the race of Israel, and he will gather the righteous from among the nations.

    4. Therefore, if you also do what is good, men and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.

    5. As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.

    6. But the one who does not do what is good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.

    7. For the commandments of the law are twofold, and they are fulfilled with skill.

    8. For there is a time for a man''s coming together with a woman, and a time for restraint for his prayer.

    9. And both are from God, and if they do not take place in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.

    10. Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter[d][c], so that the Lord may love you.'
translation:
  language: hi
  text: '1. और देखो, मेरे बच्चों, मैंने तुम्हें अन्तिम समयों के विषय में दिखाया है कि ये सब बातें इस्राएल में घटित होंगी।


    2. इसलिए तुम भी अपने बच्चों को आज्ञा देना कि वे लेवी और यहूदा के साथ एकता में रहें। क्योंकि यहूदा के द्वारा इस्राएल के लिए उद्धार उदय होगा, और उसी में याकूब आशीष पाएगा।


    3. उसके राजदण्ड[a] के द्वारा परमेश्वर पृथ्वी पर प्रकट होगा और मनुष्यों के बीच निवास करेगा[b], ताकि इस्राएल के वंश को बचाए; और वह अन्यजातियों में से धर्मियों को इकट्ठा करेगा।


    4. इसलिए यदि तुम भी भलाई करोगे, तो मनुष्य और स्वर्गदूत तुम्हें आशीष देंगे; तुम्हारे द्वारा अन्यजातियों के बीच परमेश्वर की महिमा होगी; शैतान तुम्हारे पास से भाग जाएगा; जंगली पशु तुमसे डरेंगे; प्रभु तुमसे प्रेम करेगा; और स्वर्गदूत तुम्हारा साथ देंगे।


    5. जैसे जो कोई किसी बच्चे का अच्छी तरह पालन-पोषण करता है, उसकी अच्छी स्मृति रहती है, वैसे ही अच्छे काम की भी परमेश्वर के यहाँ अच्छी स्मृति होती है।


    6. परन्तु जो भलाई नहीं करता, उसे स्वर्गदूत और मनुष्य शाप देंगे; उसके कारण अन्यजातियों के बीच परमेश्वर का अपमान होगा; शैतान उसे अपना पात्र समझकर अपना लेगा; हर जंगली पशु उस पर अधिकार करेगा; और प्रभु उससे घृणा करेगा।


    7. क्योंकि व्यवस्था की आज्ञाएँ दो प्रकार की हैं और उन्हें समझ-बूझ के साथ पूरा किया जाता है।


    8. स्त्री के साथ दाम्पत्य-सम्बन्ध का एक समय है[c], और प्रार्थना के लिए संयम रखने का एक समय है[d]।


    9. दोनों परमेश्वर की ओर से हैं; पर यदि वे अपने उचित क्रम में न हों, तो मनुष्यों को बहुत बड़े पाप में डालते हैं। बाकी आज्ञाओं के विषय में भी यही बात लागू होती है।


    10. इसलिए, मेरे बच्चों, परमेश्वर में बुद्धिमान और विवेकी बनो। उसकी आज्ञाओं का क्रम और हर बात के ठहराए हुए नियम पहचानो, ताकि प्रभु तुमसे प्रेम करे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 2–3 में ‘यहूदा के द्वारा’ और ‘उसके राजदण्ड के द्वारा’ राजकीय तथा उद्धार-सम्बन्धी बिम्ब हैं। इस अंश को मसीही अर्थ में पढ़ा जा सकता है, पर अनुवाद यूनानी पाठ से अधिक संकीर्ण व्याख्या निर्धारित नहीं करता।
    reason: cross_reference
  - marker: b
    text: ‘मनुष्यों के बीच निवास करेगा’ शब्द कुछ यूनानी साक्ष्यों में पाठीय विस्तार या भिन्न रूप के रूप में मिलते हैं। यहाँ दिए गए विस्तृत यूनानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
  - marker: c
    text: ‘दाम्पत्य-सम्बन्ध’ स्त्री-पुरुष के यौन-मिलन का मर्यादित अनुवाद है।
    reason: cultural_note
  - marker: d
    text: ‘संयम’ का अर्थ यहाँ प्रार्थना के लिए उचित समय पर दाम्पत्य-सम्बन्ध से विरत रहना है; ‘परहेज़’ भी सम्भव अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καιροὺς ἐσχάτους
  choice: अन्तिम समयों
  rationale: ग्रीक पाठ में केवल सामान्य ‘समय’ नहीं, बल्कि अन्तिम अथवा निर्णायक समयों का संकेत है; बहुवचन और युगान्तकारी स्वर दोनों सुरक्षित रखे गए हैं।
- source_word: ἑνοῦνται
  choice: एकता में रहें
  rationale: यह लेवी और यहूदा के साथ स्थायी सामुदायिक एकजुटता का आग्रह व्यक्त करता है; ‘जुड़ जाएँ’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है।
- source_word: σωτηρία
  choice: उद्धार
  rationale: यह शब्द बचाव और धार्मिक उद्धार दोनों अर्थों के लिए खुला रहता है और मूल की धर्मवैचारिक गम्भीरता बनाए रखता है।
- source_word: σκήπτρου
  choice: राजदण्ड
  rationale: मूल के ठोस राजकीय और वंशगत बिम्ब को अमूर्त ‘शासन’ में बदले बिना सुरक्षित रखता है।
- source_word: ὀφθήσεται
  choice: प्रकट होगा
  rationale: यह दिखाई देने अथवा प्रकट उपस्थिति का अर्थ सहज हिन्दी में देता है, बिना किसी बाद की धर्मसैद्धान्तिक शब्दावली को आरोपित किए।
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: मनुष्यों के बीच निवास करेगा
  rationale: सन्दर्भ में यह मानवजाति के बीच ईश्वरीय उपस्थिति का स्वाभाविक अर्थ देता है; ‘मनुष्यों में’ सम्भव होने पर भी यहाँ कम सम्भाव्य है।
- source_word: τὸ καλόν
  choice: भलाई
  rationale: लेख सहित विशेषण यहाँ नैतिक रूप से अच्छा काम करने का भाव रखता है; ‘भलाई’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: διάβολος
  choice: शैतान
  rationale: इस उपदेशात्मक सन्दर्भ में यह व्यक्तिगत विरोधी को सूचित करता है; आधुनिक हिन्दी पाठक के लिए ‘शैतान’ स्पष्ट और प्रचलित है।
- source_word: ἀνθέξονται ὑμῶν
  choice: तुम्हारा साथ देंगे
  rationale: क्रिया थामे रहने, सहारा देने अथवा साथ खड़े होने का भाव रखती है; यह अनुवाद सुरक्षात्मक समानान्तरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγκρατείας
  choice: संयम रखने
  rationale: यह उचित समय पर दाम्पत्य-सम्बन्ध से विरत रहने को सूचित करता है; ‘संयम’ मूल के आत्म-नियन्त्रण के भाव को बनाए रखता है।
- source_word: μετὰ τέχνης
  choice: समझ-बूझ के साथ
  rationale: शाब्दिक ‘कौशल के साथ’ हिन्दी में यांत्रिक लग सकता है; सन्दर्भ आज्ञाओं को उचित क्रम और विवेक से लागू करने का है।
theological_decisions:
- issue: पद 2-3 में यहूदा और राजदण्ड से जुड़ी राजकीय तथा उद्धार की भाषा
  choice: यहूदा, राजदण्ड, परमेश्वर के पृथ्वी पर प्रकट होने और अन्यजातियों से धर्मियों को इकट्ठा करने की भाषा को सीधे अनूदित किया गया है।
  alternative: इसे केवल राजनीतिक-वंशगत आशा मानना, अथवा बाद का विस्तार समझकर अनुवाद में इसकी शक्ति कम करना।
  rationale: उपलब्ध यूनानी साक्ष्य स्पष्ट रूप से यह भाषा प्रस्तुत करता है। इसका मसीही अर्थ सम्भव है, पर अनुवाद स्वयं उस सम्भावना को किसी संकीर्ण व्याख्या में नहीं बाँधता।
- issue: पद 3 में κατοικῶν ἐν ἀνθρώποις
  choice: ‘मनुष्यों के बीच निवास करेगा’ को मुख्य पाठ में रखा गया है।
  alternative: ‘मनुष्यों में निवास करेगा’ पढ़ना, अथवा पाठीय विस्तार मानकर वाक्यांश छोड़ देना।
  rationale: सन्दर्भ में ‘बीच’ अधिक स्वाभाविक है। चूँकि वाक्यांश की पाठीय स्थिति जटिल है, उसे हटाने के बजाय टिप्पणी द्वारा पारदर्शिता रखी गई है।
- issue: पद 7-9 में दाम्पत्य-सम्बन्ध और प्रार्थना के लिए संयम
  choice: दोनों को परमेश्वर की ओर से मानते हुए उनके उचित समय और क्रम पर बल दिया गया है।
  alternative: इसे केवल सामान्य संयम की शिक्षा बना देना, या यूनानी में अनुपस्थित विशिष्ट शुद्धता-विधान आरोपित करना।
  rationale: मूल पाठ एक ठोस उदाहरण देता है और पाप को इन बातों के अनुचित क्रम से जोड़ता है; अनुवाद इसी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, उपदेशात्मक शैली रखी गई है। वाक्य सामान्य पाठकों के लिए सहज हैं, जबकि ‘उद्धार’, ‘राजदण्ड’, ‘धर्मी’ और ‘अन्यजाति’ जैसे प्रमुख धार्मिक तथा राजकीय पद मूल की अर्थ-गहनता के कारण सुरक्षित रखे गए हैं। ‘बच्चो’ को स्वाभाविक सम्बोधन के रूप में प्रयोग किया गया है।
