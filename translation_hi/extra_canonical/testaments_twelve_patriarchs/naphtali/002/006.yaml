id: T12P.NAP.2.6
reference: Testament of Naphtali 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. *Ὡς γὰρ ἡ ἰσχὺς αὐτοῦ, οὕτως⁴⁸ καὶ ὁ λόγος αὐτοῦ⁵⁰, ἢ ἐν νόμῳ Κυρίου, ἢ ἐν νόμῳ⁵¹ τοῦ⁵² Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/006.yaml
  text: As a person's strength is, so also is his word, whether in the law of the Lord or in the works of Beliar.
translation:
  language: hi
  text: क्योंकि जैसी किसी व्यक्ति की सामर्थ्य होती है, वैसा ही उसका वचन भी होता है—चाहे वह प्रभु की व्यवस्था में हो या बेलियार की व्यवस्था में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰσχὺς
  choice: सामर्थ्य
  rationale: यह शब्द व्यक्ति की शक्ति या क्षमता को व्यक्त करता है; ‘सामर्थ्य’ आधुनिक, स्वाभाविक और गरिमापूर्ण है।
- source_word: λόγος
  choice: वचन
  rationale: मूल यूनानी पाठ में λόγος है, इसलिए ‘काम’ के बजाय कथन/वचन का अर्थ रखा गया है। ‘वचन’ यहाँ व्यक्ति के बोल और उसकी अभिव्यक्ति दोनों को समेटता है।
- source_word: νόμῳ Κυρίου
  choice: प्रभु की व्यवस्था में
  rationale: νόμος का सीधा और प्रसंगानुकूल अर्थ ‘व्यवस्था’ है; ‘प्रभु’ Κυρίου का पारंपरिक तथा स्पष्ट रूप है।
- source_word: νόμῳ τοῦ Βελίαρ
  choice: बेलियार की व्यवस्था में
  rationale: प्रस्तुत यूनानी स्रोत में दूसरी बार भी νόμῳ है, इसलिए अंग्रेज़ी परामर्श-पाठ के ‘works’ का अनुसरण न करके ‘व्यवस्था’ की समानांतरता सुरक्षित रखी गई है। नाम का लिप्यंतरण ‘बेलियार’ किया गया है।
theological_decisions:
- issue: प्रभु और बेलियार से जुड़ी दो विरोधी व्यवस्थाओं का समानांतर उल्लेख
  choice: दोनों पदबंधों में ‘व्यवस्था’ रखा गया
  alternative: दूसरे पदबंध में ‘बेलियार के कामों में’
  rationale: दिए गए मूल यूनानी पाठ में ἐν νόμῳ ... ἐν νόμῳ की स्पष्ट समानांतर रचना है। पाठ की नैतिक-द्वैतात्मक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
- issue: λόγος का अर्थ
  choice: वचन
  alternative: बात / कार्य
  rationale: ‘वचन’ मूल शब्द के भाषिक अर्थ को बनाए रखता है और इसे कर्म में बदलकर संभावित वैचारिक तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘जैसी... वैसा ही’ से यूनानी तुलनात्मक संरचना सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
