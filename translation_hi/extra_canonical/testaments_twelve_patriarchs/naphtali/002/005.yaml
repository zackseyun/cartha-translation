id: T12P.NAP.2.5
reference: Testament of Naphtali 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. Ὅτι οὐκ ἔστι πλάσμα³³ καὶ πᾶσα ἔννοια ἣν Γοὐκ¹ ἔγνω Κύριος· *πάντα γὰρ³⁴ *ὁ ἄνθρωπον³⁵ ἔκτισεν κατʼ εἰκόνα ἑαυτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/005.yaml
  text: For there is no creation and no thought that the Lord does not know; for he created all things, and he created man in his own image.
translation:
  language: hi
  text: क्योंकि ऐसी कोई रची हुई वस्तु या विचार नहीं है, जिसे प्रभु न जानता हो; क्योंकि उसने सब कुछ रचा है और मनुष्य को अपने स्वरूप में बनाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के दूसरे भाग का उपलब्ध यूनानी पाठ व्याकरण की दृष्टि से अनियमित है। यहाँ उसका सबसे संभावित अर्थ दिया गया है: प्रभु ने सब कुछ रचा और मनुष्य को अपने स्वरूप में बनाया।'
    reason: प्राप्त यूनानी में πάντα के बाद की रचना और ὁ ἄνθρωπον का रूप असंगत है; पाठगत अनिश्चितता को छिपाने के बजाय पाठक को सूचित करना आवश्यक है।
lexical_decisions:
- source_word: πλάσμα
  choice: रची हुई वस्तु
  rationale: यह शब्द किसी गढ़ी या रची गई वस्तु को दर्शाता है; यह अनुवाद इसे केवल अमूर्त ‘सृष्टि’ तक सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πᾶσα ἔννοια
  choice: कोई विचार
  rationale: नकारात्मक वाक्य में πᾶσα का स्वाभाविक हिन्दी रूप ‘कोई’ है; ἔννοια को यहाँ मन में उठने वाले ‘विचार’ के अर्थ में लिया गया है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ सुरक्षित रखता है और इसे केवल मनुष्यों तक सीमित नहीं करता।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यूनानी में यह एकवचन और सामान्य मानव-संज्ञा है; ‘मनुष्य’ लिंग-समावेशी सामूहिक अर्थ भी रखता है और मूल के एकवचन को बनाए रखता है।
- source_word: κατʼ εἰκόνα ἑαυτοῦ
  choice: अपने ही स्वरूप में
  rationale: ईश्वर और मनुष्य के बीच प्रतिरूप-संबंध को परिचित, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘ही’ आत्मवाचक ἑαυτοῦ के बल को दर्शाता है।
theological_decisions:
- issue: प्रभु के ज्ञान की व्यापकता
  choice: ‘ऐसी कोई रची हुई वस्तु और कोई विचार नहीं है जिसे प्रभु न जानता हो’
  alternative: ‘उसकी सृष्टि का ऐसा कोई उद्देश्य नहीं जिसे प्रभु न जानता हो’
  rationale: मूल पाठ πλάσμα और ἔννοια को अलग-अलग रखता है; इन्हें एक संयुक्त ‘उद्देश्य’ में बदलना मूल की व्यापकता और तनाव को मिटा देता।
- issue: πάντα का विस्तार
  choice: ‘उसने सब कुछ रचा’
  alternative: ‘उसने प्रत्येक मनुष्य को रचा’
  rationale: πάντα का सामान्य अर्थ ‘सब कुछ/सभी वस्तुएँ’ है; इसे केवल हर मनुष्य पर लागू करना पाठ की सीमा को अनावश्यक रूप से संकुचित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘रची हुई वस्तु’, ‘विचार’, ‘सब कुछ’ और ‘मनुष्य’ सामान्य पाठक के लिए सहज हैं, जबकि मूल यूनानी के अर्थ-भेद और व्यापकता को बनाए रखते हैं।
