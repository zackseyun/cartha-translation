    rationale: ‘ऐसी कोई रची हुई वस्तु और कोई विचार नहीं है जिसे…’ can be understood, but ‘ऐसी कोई रची हुई वस्तु या विचार नहीं है, जिसे…’ is more idiomatic Hindi and preserves the source’s negative scope.
  - severity: low
    issue: ‘अपने ही स्वरूप’ adds a slight emphatic nuance.
    rationale: ἑαυτοῦ is reflexive (‘his own’), but ‘अपने स्वरूप में’ expresses this naturally in Hindi without the additional focus suggested by ‘ही।’
