id: T12P.NAP.2.10
reference: Testament of Naphtali 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. *Ὅτι ἐὰν εἴπῃς τῷ ὀφθαλμῷ, Ἄκουε, οὐ δυνήσεται⁸²· οὕτως οὐδὲ *ἐν σκότει⁸³ *ὄντες δύνασθε ποιεῖν⁸⁴ ἔργα⁸⁵ φωτός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/010.yaml
  text: For if you say to the eye, “Hear,” it cannot; so neither, being in darkness, can you do the works of light.
translation:
  language: hi
  text: क्योंकि यदि तुम आँख से कहो, “सुन,” तो वह नहीं सुन सकती; उसी प्रकार, अन्धकार में रहते हुए तुम भी ज्योति के काम नहीं कर सकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμῷ
  choice: आँख
  rationale: सामान्य आधुनिक हिन्दी में शरीर के अंग के लिए सहज और सटीक शब्द।
- source_word: ἐν σκότει ὄντες
  choice: अन्धकार में रहते हुए
  rationale: ग्रीक में अवस्था को व्यक्त करने वाले कृदन्त का अर्थ बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: ἔργα φωτός
  choice: ज्योति के काम
  rationale: प्रकाश-अन्धकार के नैतिक रूपक को बनाए रखते हुए मूल की संज्ञात्मक संरचना के निकट रहता है।
theological_decisions:
- issue: अन्धकार और ज्योति का रूपक
  choice: रूपक को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया
  alternative: अन्धकार को ‘बुराई’ और ज्योति को ‘भलाई’ कहकर स्पष्ट करना
  rationale: मूल पाठ रूपक की अर्थ-व्याप्ति खुली रखता है; उसे स्पष्टार्थक नैतिक शब्दों से बदलना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट हिन्दी। प्रत्यक्ष कथन में संक्षिप्त आज्ञा ‘सुन’ रखी गई है; ‘उसी प्रकार’ मूल की तुलना को सहजता से व्यक्त करता है।
