id: T12P.NAP.2.4
reference: Testament of Naphtali 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ καθὼς²⁵ οἶδεν²⁶ ὁ κεραμεὺς ἑνὸς ἑκάστου τὴν χρῆσιν †ὡς²⁷ ἱκανή²⁸, οὕτω²⁹ καὶ ὁ Κύριος οἶδε τὸ σῶμα, ἕως τίνος διαρκέσει ἐν *τῷ ἀγαθῷ³⁰, καὶ πότε ἔρχεται³¹ *ἐν κακῷ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/004.yaml
  text: And just as the potter knows the use of each one, as it is fit, so also the Lord knows the body, how long it will endure in good, and when it comes into evil.
translation:
  language: hi
  text: 'और जैसे कुम्हार हर एक का उपयोग जानता है—कि वह किस काम के योग्य है[a]—वैसे ही प्रभु भी शरीर को जानता है: वह कब तक भलाई में टिका रहेगा और कब बुराई में आ जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्यांश का यूनानी पाठ कठिन और कुछ अनिश्चित है; इसका भाव ‘जितना वह उपयुक्त है’ भी हो सकता है।
    reason: स्रोत संस्करण में ὡς ἱκανή के आसपास पाठगत कठिनाई चिह्नित है, और उसका व्याकरणिक संबंध स्पष्ट नहीं है।
lexical_decisions:
- source_word: κεραμεύς
  choice: कुम्हार
  rationale: यह यूनानी शब्द का सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: ἑνὸς ἑκάστου τὴν χρῆσιν
  choice: हर एक का उपयोग
  rationale: मूल पाठ में ‘पात्र’ जैसा कोई संज्ञा-पद स्पष्ट रूप से नहीं है; इसलिए संदर्भ को अनावश्यक रूप से भरने के बजाय मूल की संक्षिप्तता रखी गई है।
- source_word: τὸ σῶμα
  choice: शरीर
  rationale: सामान्य और प्रत्यक्ष अर्थ रखा गया है; इसे ‘मनुष्य’ या ‘देहधारी जीवन’ बनाकर व्याख्यायित नहीं किया गया।
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: भलाई में टिका रहेगा
  rationale: διαρκέω की स्थायित्व/बने रहने की धारणा और ἐν τῷ ἀγαθῷ की व्यापक नैतिक या अच्छी दशा संबंधी अस्पष्टता दोनों सुरक्षित रहती हैं।
- source_word: ἔρχεται ἐν κακῷ
  choice: बुराई में आ जाएगा
  rationale: यूनानी की गति-सूचक अभिव्यक्ति को बनाए रखा गया है और ‘पाप करेगा’ जैसी अधिक विशिष्ट धार्मिक व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: ‘भलाई’ और ‘बुराई’ का आशय
  choice: व्यापक शब्द ‘भलाई’ और ‘बुराई’ रखे गए
  alternative: इन्हें क्रमशः ‘सदाचार’ और ‘पाप’ अथवा ‘अच्छी दशा’ और ‘विपत्ति’ कहना
  rationale: यूनानी ἀγαθόν और κακόν यहाँ नैतिक गुण, आचरण या दशा—एक से अधिक अर्थ दे सकते हैं; अनुवाद इस तनाव को संकीर्ण नहीं करता।
- issue: प्रभु के शरीर को जानने का स्वरूप
  choice: ‘प्रभु भी शरीर को जानता है’
  alternative: ‘प्रभु शरीर की सामर्थ्य/नियति जानता है’
  rationale: मूल कथन को बिना किसी विशिष्ट पूर्वनियति-संबंधी सिद्धांत या अतिरिक्त व्याख्या के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। कुम्हार के रूपक की संक्षिप्तता बनाए रखी गई है; स्पष्टता के लिए डैश और कोलन का प्रयोग किया गया है।
