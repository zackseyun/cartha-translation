  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/001.yaml
  text: My mother Bilhah was the daughter of Rotheus, the brother of Deborah, the nurse of Rebecca; she was born on the same day as Rachel. 10 And Rotheus was of the lineage of Abraham, a Chaldean, God-fearing, freeborn and noble. 11 And having been taken captive, he was bought by Laban; and Laban gave him his maidservant Eunan as a wife, and she bore a daughter, and he called her name Zelpha, after the name of the city in which he had been taken captive. 12 And after this she bore Bilhah, saying, ‘My daughter is one who renews.’ II. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he indeed blessed me as a deer.
translation:
  language: hi
  text: 2:1 मैं हिरन की तरह पैरों से फुर्तीला था। मेरे पिता याकूब ने मुझे हर प्रकार का संदेश पहुँचाने के लिए नियुक्त किया था; और उन्होंने मुझे हिरन के समान ही आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν
  choice: पैरों से फुर्तीला
  rationale: मुहावरे का अर्थ पैरों की हलकी, तेज चाल है; यह आधुनिक हिन्दी में स्वाभाविक रूप से गति और चुस्ती दोनों व्यक्त करता है।
- source_word: ἔλαφος
  choice: हिरन
  rationale: स्रोत में सामान्यतः हिरन/मृग अर्थ वाला शब्द है; साधारण पाठक के लिए ‘हिरन’ अधिक सहज है और उपमा को स्पष्ट रखता है।
- source_word: εἰς πᾶσαν ἀγγελίαν
  choice: हर प्रकार का संदेश पहुँचाने के लिए
  rationale: ἀγγελία यहाँ संदेश अथवा संदेश ले जाने के काम को सूचित करता है; केवल ‘हर काम’ कहने से संदेशवाहक की भूमिका अस्पष्ट हो जाती।
- source_word: καίγε ὡσεὶ
  choice: और … समान ही
  rationale: καίγε के बलाघात को ‘ही’ से व्यक्त किया गया है, जबकि ὡσεὶ की उपमात्मकता ‘समान’ में सुरक्षित है।
