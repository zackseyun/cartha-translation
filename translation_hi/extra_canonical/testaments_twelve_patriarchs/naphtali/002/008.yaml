source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. *Πάντα ⌜γὰρ⌝⁶⁰ ἐν τάξει ἐποίησεν ὁ Θεὸς καλά· τὰς πέντε αἰσθήσεις ἐν τῇ κεφαλῇ *καὶ τὸν τράχηλον συνάψας τῇ κεφαλῇ⁶¹, *προσθεὶς αὐτῇ καὶ τρίχας εἰς εὐπρέπειαν καὶ δόξαν⁶², εἶτα⁶³ καρδίαν *εἰς φρόνησιν⁶⁴, κοιλίαν εἰς †διάκρισιν⁶⁵, *στόμαχον εἰς †ἀλεσμόν⁶⁶, †κάλαμον⁶⁷ πρὸς †ὑγείαν⁶⁸, ἧπαρ⁶⁹ πρὸς θυμόν, χολὴν πρὸς πικρίαν, ⌜καὶ⌝⁷⁰ *σπλῆνα πρὸς γέλωτα⁷¹, νεφροὺς ⌜εἰς πανουργίαν⁷², ψύας⁷³⌝ εἰς δύναμιν, *†πλευρὰν εἰς τὸ καθεύδειν†⁷⁴, ὀσφὺν⁷⁵ εἰς ἰσχύν, καὶ τὰ ἑξῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/008.yaml
  text: 'For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.'
translation:
  language: hi
  text: 'क्योंकि परमेश्वर ने सब कुछ अच्छे ढंग से क्रम में बनाया: सिर में पाँच इंद्रियाँ रखीं और गरदन को सिर से जोड़ा; उसने शोभा और गरिमा के लिए सिर पर बाल भी दिए; फिर समझ-बूझ के लिए हृदय, भेद करने के लिए पेट,[a] पीसने के लिए आमाशय, स्वास्थ्य के लिए नली,[b] क्रोध के लिए जिगर, कड़वाहट के लिए पित्त, हँसी के लिए तिल्ली, चतुराई के लिए गुर्दे, शक्ति के लिए कटि,[c] सोने के लिए पसली,[d] सामर्थ्य के लिए कमर, और बाकी भी इसी प्रकार बनाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भेद करने के लिए’ वाला यूनानी शब्द διάκρισιν संदिग्ध है और उसका शाब्दिक अर्थ भेद, विभाजन, या अलग करना है। प्रसंग में कुछ अनुवाद इसे निष्कासन अथवा मल से जोड़ते हैं, पर यह निश्चित नहीं है।
    reason: †διάκρισιν के पाठगत/अर्थगत संदेह को बनाए रखते हुए मुख्य पाठ के अपेक्षाकृत शाब्दिक अनुवाद की व्याख्या करता है।
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘स्वास्थ्य के लिए नली’ है; ‘नली’ और ‘स्वास्थ्य’ दोनों पद संदिग्ध हैं। श्वासनली या श्वास लेने की क्रिया संभावित अर्थ हैं, पर निश्चित नहीं।
    reason: †κάλαμον और †ὑγείαν की अनिश्चितता सुरक्षित रखता है और ‘श्वासनली’ को मुख्य पाठ पर थोपने से बचाता है।
  - marker: c
    text: यूनानी ψύας कटि या कमर के क्षेत्र को सूचित करता है और यह पद भी पाठ में अनिश्चित है। इसे अधिक विशिष्ट रूप से ‘कटि की मांसपेशियाँ’ समझना संभव है, पर निश्चित नहीं।
    reason: कोष्ठकित ψύας के लिए अति-विशिष्ट शारीरिक पहचान से बचते हुए स्रोत का संभावित अर्थ बताता है।
  - marker: d
    text: ‘पसली … सोने के लिए’ वाला पूरा वाक्यांश यूनानी पाठ में संदिग्ध है।
    reason: स्रोत संस्करण के *†πλευρὰν εἰς τὸ καθεύδειν† चिह्न को स्पष्ट रूप से दर्शाता है।
lexical_decisions:
- source_word: ἐν τάξει
  choice: उचित क्रम में
  rationale: यूनानी पद व्यवस्था और सुव्यवस्थित क्रम दोनों का बोध देता है; ‘उचित क्रम में’ स्वाभाविक हिंदी में इसे सुरक्षित रखता है।
- source_word: τὰς πέντε αἰσθήσεις
  choice: पाँच इंद्रियाँ
  rationale: यह पाँच ज्ञानेन्द्रियों के लिए आधुनिक हिंदी का सामान्य और स्पष्ट पद है।
- source_word: εὐπρέπειαν καὶ δόξαν
  choice: शोभा और गरिमा
  rationale: दोनों संज्ञाओं का भेद रखते हुए बाहरी सुंदरता और सम्मानजनक वैभव का भाव व्यक्त किया गया है।
- source_word: φρόνησιν
  choice: समझ-बूझ
  rationale: यह व्यावहारिक समझ और विवेक का संकेत करता है; बोलचाल में बोधगम्य रहते हुए मूल अर्थ के निकट है।
- source_word: κοιλίαν εἰς διάκρισιν
  choice: मल अलग करने के लिए पेट
  rationale: διάκρισιν पाठ संदिग्ध है; प्रसंग में शरीर की निष्कासन-क्रिया अभिप्रेत प्रतीत होती है। मुख्य पाठ में अर्थपूर्ण रूप दिया गया और अनिश्चितता पादटिप्पणी में रखी गई।
- source_word: στόμαχον εἰς ἀλεσμόν
  choice: पीसने के लिए आमाशय
  rationale: ἀλεσμός का शाब्दिक भाव पीसना है और στόμαχος यहाँ पाचन-अंग को सूचित करता है।
- source_word: κάλαμον πρὸς ὑγείαν
  choice: स्वास्थ्य के लिए श्वासनली
  rationale: κάλαμος शाब्दिक रूप से नली/सरकंडा है; शारीरिक सूची में श्वासनली संभावित अर्थ है, जबकि उद्देश्य-पद का पाठ अनिश्चित है।
- source_word: νεφροὺς εἰς πανουργίαν
  choice: चतुराई के लिए गुर्दे
  rationale: πανουργία में कुशलता से लेकर धूर्तता तक अर्थ-व्याप्ति है; ‘चतुराई’ मूल की नैतिक अस्पष्टता को अपेक्षाकृत खुला रखता है।
- source_word: ψύας εἰς δύναμιν
  choice: शक्ति के लिए कटि की मांसपेशियाँ
  rationale: ψύαι कमर/कटि की भीतरी मांसपेशियों को दर्शाता है; केवल ‘फेफड़े’ कहना मूल शब्द से मेल नहीं खाता।
- source_word: ὀσφὺν εἰς ἰσχύν
  choice: सामर्थ्य के लिए कमर
  rationale: ὀσφύς का सामान्य अर्थ कमर/कटि और ἰσχύς का अर्थ शारीरिक सामर्थ्य है।
- source_word: καὶ τὰ ἑξῆς
  choice: और इसी प्रकार बाकी अंग
  rationale: सूची के आगे भी इसी क्रम के लागू होने का स्वाभाविक हिंदी संकेत देता है।
theological_decisions:
- issue: सृष्टि की अच्छाई और व्यवस्था
  choice: ‘परमेश्वर ने सब कुछ उचित क्रम में अच्छा बनाया’
  alternative: ‘परमेश्वर ने सभी अच्छी वस्तुएँ क्रम से बनाईं’
  rationale: यूनानी वाक्य में ‘अच्छा’ को समस्त सृष्टि की गुणात्मक विशेषता की तरह पढ़ना अधिक स्वाभाविक है, पर क्रम पर भी समान बल रखा गया है।
- issue: शरीर के अंगों और मनोभावों का संबंध
  choice: मूल सूची के प्रत्यक्ष संबंधों—जैसे जिगर/क्रोध और तिल्ली/हँसी—को यथावत रखा
  alternative: उन्हें आधुनिक शरीर-विज्ञान के अनुसार समझाकर बदलना
  rationale: ये प्राचीन मानव-विज्ञान संबंधी धारणाएँ पाठ का अभिन्न भाग हैं; अनुवाद में उनका आधुनिकीकरण करना अनुचित होता।
