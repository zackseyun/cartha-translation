id: T12P.NAP.2.9
reference: Testament of Naphtali 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Οὕτως⁷⁶ ⌜οὖν⌝ *ἔστωσαν, τέκνα μου, πάντα τὰ ἔργα ὑμῶν ἐν τάξει εἰς ἀγαθόν⁷⁷ ἐν φόβῳ Θεοῦ, καὶ μηδὲν ἄτακτον ποιήσητε⁷⁸ ἐν καταφρονήσει, μηδὲ⁷⁹ ἔξω⁸⁰ *καιροῦ αὐτοῦ⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/009.yaml
  text: So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, परमेश्वर के भय में तुम्हारे सभी काम भलाई के लिए सुव्यवस्थित हों। तिरस्कार की भावना से कोई भी अव्यवस्थित काम न करो, और न किसी काम को उसके उचित समय के बाहर करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τάξει
  choice: सुव्यवस्थित हों
  rationale: यह यूनानी पद क्रम, व्यवस्था और उचित रीति से किए जाने का भाव रखता है; सहज हिन्दी में ‘सुव्यवस्थित’ इस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: εἰς ἀγαθόν
  choice: भलाई के लिए
  rationale: उद्देश्य या परिणाम की दिशा बताने वाले εἰς को बनाए रखते हुए नैतिक ‘अच्छाई/भलाई’ का अर्थ व्यक्त किया गया है।
- source_word: ἐν φόβῳ Θεοῦ
  choice: परमेश्वर के भय में
  rationale: मूल के धार्मिक और नैतिक भाव को बिना उसे केवल ‘श्रद्धा’ तक सीमित किए औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: ἐν καταφρονήσει
  choice: तिरस्कार की भावना से
  rationale: καταφρόνησις में उपेक्षा, अवमानना या तिरस्कार का भाव है; ‘की भावना से’ हिन्दी में क्रिया की प्रेरक मनोवृत्ति स्पष्ट करता है।
- source_word: ἔξω καιροῦ αὐτοῦ
  choice: किसी काम को उसके उचित समय के बाहर
  rationale: καιρός घड़ीगत समय से अधिक उपयुक्त या नियत अवसर दर्शाता है। αὐτοῦ का संदर्भ कुछ अस्पष्ट है; ‘किसी काम’ जोड़कर हिन्दी वाक्य स्पष्ट किया गया, जबकि ‘उसके’ से मूल संबंध रखा गया है।
theological_decisions:
- issue: φόβος Θεοῦ का अर्थ
  choice: परमेश्वर का भय
  alternative: परमेश्वर के प्रति श्रद्धा
  rationale: मूल पद भय और श्रद्धापूर्ण आदर दोनों की अर्थ-सीमा रख सकता है। पाठ की नैतिक गंभीरता और पारंपरिक बाइबिलीय अभिव्यक्ति को बनाए रखने के लिए अधिक प्रत्यक्ष अनुवाद चुना गया है।
- issue: अव्यवस्था और समय का नैतिक संबंध
  choice: दो पृथक निषेधों के रूप में प्रस्तुत
  alternative: अनुचित समय पर काम करने को ही अव्यवस्था का स्पष्टीकरण मानना
  rationale: मूल में μηδέν और μηδέ समन्वित निषेध देते हैं; इसलिए दोनों को अलग पर संबंधित आदेशों के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में आत्मीय किंतु गरिमापूर्ण ‘मेरे बच्चो’; वाक्य को पठनीय बनाने के लिए दो वाक्यों में विभाजित किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
