id: T12P.NAP.2.7
reference: Testament of Naphtali 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
translation:
  language: hi
  text: और जैसे प्रकाश और अंधकार के बीच, तथा दृष्टि और श्रवण के बीच भेद है, वैसे ही एक पुरुष और दूसरे पुरुष के बीच, और एक स्त्री और दूसरी स्त्री के बीच भी भेद है; और यह नहीं कहा जा सकता कि रूप-रंग के मामले में कोई किसी दूसरे से कमतर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य का अंतिम यूनानी अंश पाठ की दृष्टि से कठिन और संभवतः विकृत है; इसका शाब्दिक आशय लगभग यह है कि “रूपों/चेहरों में एक को घटकर नहीं कहा जा सकता।”
    reason: मूल पाठ की वास्तविक अनिश्चितता को बताए बिना किसी एक पुनर्निर्माण को निश्चित अर्थ के रूप में प्रस्तुत करने से बचना।
lexical_decisions:
- source_word: κεχώρισται
  choice: भेद है
  rationale: यूनानी पूर्ण निष्क्रिय रूप यहाँ स्थापित भिन्नता या विभाजन को व्यक्त करता है; सहज हिन्दी में “भेद है” उसी स्थायी अवस्था को स्पष्ट करता है।
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: दृष्टि और श्रवण
  rationale: पाठ में दृष्टि/देखने और सुनने की इंद्रियगत क्षमताओं का युग्म है; संज्ञात्मक “दृष्टि और श्रवण” समानांतरता बनाए रखता है।
- source_word: ἀνάμεσον ἀνδρὸς καὶ ἀνδρός
  choice: एक पुरुष और दूसरे पुरुष के बीच
  rationale: दो व्यक्तियों के बीच भिन्नता को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है, बिना किसी अतिरिक्त सामाजिक या धार्मिक अर्थ के।
- source_word: ἀνάμεσον γυναικὸς καὶ γυναικός
  choice: एक स्त्री और दूसरी स्त्री के बीच
  rationale: यूनानी पुनरुक्त संरचना और पुरुषों वाले पिछले वाक्यांश की समानांतरता सुरक्षित रहती है।
- source_word: τοῖς προσώποις
  choice: रूप-रंग में
  rationale: πρόσωπον का मूल अर्थ चेहरा या बाहरी रूप है; इस संदर्भ में “रूप-रंग” व्यक्तियों की दिखाई देने वाली आकृति को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡττόμενον
  choice: घटकर
  rationale: यह तुलनात्मक हीनता या कमतर होने का भाव देता है; “घटकर” संक्षिप्त है और नैतिक मूल्यांकन जोड़ने से बचता है।
theological_decisions:
- issue: मानवीय भिन्नता और हीनता के बीच संबंध
  choice: भिन्नता को स्वीकार करते हुए बाहरी रूप के आधार पर किसी को दूसरे से घटकर कहने का निषेध रखा गया है।
  alternative: अंतिम वाक्यांश को यह कहना कि सभी चेहरे हर बात में समान हैं।
  rationale: वैकल्पिक अर्थ उपलब्ध यूनानी शब्दों से पुष्ट नहीं होता। वर्तमान पाठ भिन्नता और समान मानवीय प्रतिष्ठा के बीच मौजूद तनाव को मिटाए बिना रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। “दृष्टि और श्रवण” औपचारिक समानांतरता बनाए रखते हैं, जबकि “एक पुरुष और दूसरे पुरुष” तथा “एक स्त्री और दूसरी स्त्री” मूल की तुलना को स्पष्ट करते हैं।
