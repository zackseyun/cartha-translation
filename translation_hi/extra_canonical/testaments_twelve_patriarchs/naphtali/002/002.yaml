id: T12P.NAP.2.2
reference: Testament of Naphtali 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καθὼς⁹ γὰρ *οἶδεν ὁ κεραμεὺς¹⁰ τὸ σκεῦος πόσον χωρεῖ, καὶ πρὸς αὐτὸ¹¹ φέρει τὸν¹² πηλόν, οὕτω¹³ καὶ ὁ Κύριος πρὸς ὁμοίωσιν τοῦ πνεύματος¹⁴ ποιεῖ¹⁵ τὸ σῶμα, καὶ πρὸς τὴν δύναμιν τοῦ σώματος¹⁶ *τὸ πνεῦμα ἐπιτίθησιν¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/002.yaml
  text: For just as the potter knows how much the vessel can hold, and according to that brings the clay for it, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body's capacity places the spirit in it.
translation:
  language: hi
  text: क्योंकि जैसे कुम्हार जानता है कि पात्र में कितना समा सकता है, और उसी के अनुसार उसके लिए मिट्टी लाता है, वैसे ही प्रभु आत्मा की समानता के अनुसार शरीर बनाता है, और शरीर की क्षमता के अनुसार उसमें आत्मा रखता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεραμεύς
  choice: कुम्हार
  rationale: यह यूनानी शब्द का सीधा और सामान्य आधुनिक हिन्दी समतुल्य है।
- source_word: σκεῦος
  choice: पात्र
  rationale: संदर्भ में कुम्हार द्वारा बनाया जाने वाला ऐसा बर्तन अभिप्रेत है जिसमें कुछ समा सकता है; ‘पात्र’ अर्थ की व्यापकता बनाए रखता है।
- source_word: χωρεῖ
  choice: में कितना समा सकता है
  rationale: यह पात्र की धारण-क्षमता को सहज हिन्दी में व्यक्त करता है।
- source_word: πρὸς αὐτὸ
  choice: उसी के अनुसार उसके लिए
  rationale: यह पात्र की क्षमता के अनुरूप मिट्टी लाने का संबंध व्यक्त करता है और यूनानी सर्वनाम के संदर्भ को बनाए रखता है।
- source_word: ὁμοίωσιν τοῦ πνεύματος
  choice: आत्मा के स्वरूप के अनुरूप
  rationale: ‘ὁμοίωσις’ की समानता अथवा रूप-सादृश्य की धारणा को व्यक्त करता है, बिना यह निश्चित किए कि आत्मा शरीर का खाका है या कोई अन्य दार्शनिक संबंध अभिप्रेत है।
- source_word: δύναμιν τοῦ σώματος
  choice: शरीर की क्षमता
  rationale: यहाँ ‘δύναμις’ शरीर की सामर्थ्य या धारण-क्षमता दर्शाता है; ‘क्षमता’ निकटवर्ती पात्र-उपमा से भी स्वाभाविक रूप से जुड़ती है।
- source_word: τὸ πνεῦμα ἐπιτίθησιν
  choice: उसमें आत्मा रखता है
  rationale: ‘ἐπιτίθησιν’ के रखने या आरोपित करने के मूल भाव को सरल हिन्दी में व्यक्त करता है; ‘उसमें’ संदर्भ से शरीर को सूचित करता है।
theological_decisions:
- issue: शरीर और आत्मा के बीच क्रम तथा अनुरूपता
  choice: मूल कथन के अनुसार प्रभु आत्मा के स्वरूप के अनुरूप शरीर बनाता है और शरीर की क्षमता के अनुसार उसमें आत्मा रखता है।
  alternative: इसे आत्मा की पूर्व-अस्तित्व संबंधी शिक्षा, शरीर की श्रेष्ठता, या आत्मा की श्रेष्ठता के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ शरीर और आत्मा के बीच परस्पर अनुरूपता का तनावपूर्ण कथन करता है, पर उसका दार्शनिक या कालक्रमिक तात्पर्य स्पष्ट नहीं करता; अनुवाद उस अस्पष्टता को सुरक्षित रखता है।
- issue: πνεῦμα का अर्थ
  choice: आत्मा
  alternative: प्राण, मन, या पवित्र आत्मा
  rationale: इस मानवीय शरीर-संबंधी प्रसंग में ‘आत्मा’ सबसे स्वाभाविक और पर्याप्त रूप से व्यापक हिन्दी विकल्प है; पाठ इसे पवित्र आत्मा के रूप में चिह्नित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। कुम्हार और पात्र की उपमा को निकटता से सुरक्षित रखते हुए अत्यधिक दार्शनिक शब्दावली से बचा गया है।
