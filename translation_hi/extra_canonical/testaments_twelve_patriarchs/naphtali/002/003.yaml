id: T12P.NAP.2.3
reference: Testament of Naphtali 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Καὶ¹⁸ οὐκ *ἔστιν ἐνλεῖπον¹⁹ *ἐκ τοῦ ἑνὸς²⁰ *τρίτου τριχός²¹· *σταθμῷ γὰρ καὶ μέτρῳ²² καὶ κανόνι πᾶσα Γἡ¹²³ *κτίσις ἐγένετο²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/003.yaml
  text: And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.
translation:
  language: hi
  text: और उसमें एक बाल के तिहाई भाग जितनी भी कोई कमी नहीं है; क्योंकि समस्त सृष्टि तौल, माप और मानदंड से बनाई गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνλεῖπον
  choice: कमी
  rationale: यह अभाव या न्यूनता का सामान्य अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τοῦ ἑνὸς τρίτου τριχός
  choice: एक बाल के तिहाई भर की भी
  rationale: यूनानी पाठ में अत्यंत सूक्ष्म मात्रा का ठोस बिंब है; उसे अतिशयोक्ति सहित यथासंभव अक्षुण्ण रखा गया है।
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: तौल, माप और नियम के अनुसार
  rationale: तीनों समानांतर संज्ञाओं को अलग रखा गया है; κανών यहाँ मानक या नियामक नियम का भाव देता है।
- source_word: πᾶσα ἡ κτίσις
  choice: सारी सृष्टि
  rationale: सामूहिक अर्थ में सम्पूर्ण रची हुई व्यवस्था को दर्शाने वाला सहज हिन्दी पद है।
- source_word: ἐγένετο
  choice: रची गई
  rationale: सृष्टि के प्रसंग में शाब्दिक ‘हुई’ की अपेक्षा यह अभिप्रेत सृजनात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: सृष्टि की पूर्णता और सुव्यवस्था
  choice: कमी के निषेध तथा तौल, माप और नियम—तीनों को स्पष्ट बनाए रखा गया।
  alternative: इसे सामान्यीकृत करके केवल ‘सब कुछ पूर्णता से बनाया गया’ कहना।
  rationale: मूल पाठ के भौतिक बिंब और त्रिस्तरीय व्यवस्था को बनाए रखने से कथन की theological tension और विशिष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली। सूक्ष्मता दर्शाने वाला ‘एक बाल के तिहाई भर’ मूल यूनानी बिंब को जानबूझकर बनाए रखता है।
