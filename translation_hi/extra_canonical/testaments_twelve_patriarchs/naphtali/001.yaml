base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001.yaml
  text: 'A copy of the testament of Naphtali, the eighth son of Jacob, which he set in order at the time of his departure, in the hundred and thirtieth year of his life.


    2 When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them. 3 And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him. 4 And while blessing and glorifying the Lord, he grew strong and said, “After the feast yesterday, my flesh failed and died.”


    5 Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father. 6 I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me upon Rachel’s knees, and for this reason she called my name Naphtali. 7 For Rachel loved me greatly, because I was born upon her knees; and when I was still a tender child she kissed me, saying, ‘May I be given a brother from my own womb, like you.’ 8 Therefore Joseph also was like me in every way, according to the prayers of Rachel.”'
translation:
  language: hi
  text: '**याकूब और बिल्हा के आठवें पुत्र नप्ताली की वसीयत**


    **1** यह नप्ताली की उस वसीयत की प्रति है, जिसे उसने अपने जीवन के एक सौ तीसवें वर्ष में, अपने प्रस्थान[a] के समय व्यवस्थित किया था।


    **2** सातवें महीने के पहले दिन, जब उसके पुत्र इकट्ठे हुए, तब उसने उनके लिए भोज तैयार किया। **3** अगली सुबह जागने के बाद उसने उनसे कहा, “मैं मर रहा हूँ”; पर उन्होंने उसका विश्वास नहीं किया। **4** तब प्रभु की महिमा करते हुए वह बलवन्त हुआ और बोला, “कल के भोज के बाद मेरी देह मर गई।”[b]


    **5** फिर वह कहने लगा, “हे मेरे बच्चो, नप्ताली के पुत्रो, सुनो; अपने पिता की बातें सुनो। **6** मेरा जन्म बिल्हा से हुआ, क्योंकि राहेल ने चतुराई से काम लिया और अपने स्थान पर बिल्हा को याकूब को दे दिया। बिल्हा गर्भवती हुई और उसने मुझे राहेल के घुटनों पर जन्म दिया; इसी कारण राहेल ने मेरा नाम नप्ताली रखा। **7** राहेल मुझसे बहुत प्रेम करती थी, क्योंकि मेरा जन्म उसके घुटनों पर हुआ था। जब मैं अभी छोटा और कोमल बालक ही था, तब वह मुझे चूमती और कहती, ‘तुम्हारे समान, मेरे अपने गर्भ से मुझे तुम्हारा एक भाई मिले।’ **8** इसलिए राहेल की आशीषों के अनुसार यूसुफ भी हर बात में मेरे समान था।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रस्थान” यहाँ मृत्यु के लिए प्रयुक्त शिष्टोक्ति है।
    reason: आधुनिक पाठक के लिए संदर्भ स्पष्ट करते हुए मूल रूपक को मुख्य पाठ में बनाए रखना।
  - marker: b
    text: अर्थात यूनानी पाठ में शाब्दिक रूप से “मेरी देह मर गई” है, यद्यपि नप्ताली इसके बाद बोलता रहता है।
    reason: मूल के जानबूझकर या परंपरागत रूप से तनावपूर्ण कथन को बिना सहज व्याख्या थोपे चिह्नित करना।
  - marker: c
    text: “आशीषों” का यूनानी शब्द कुछ संदर्भों में स्तुति या आशीर्वचन से जुड़ा हो सकता है; यहाँ वाक्य का सटीक आशय अनिश्चित है। कुछ अनुवाद इसे “प्रार्थनाओं” के रूप में लेते हैं।
    reason: पाठगत/अर्थगत कठिनाई और अंग्रेज़ी परामर्श-पाठ के वैकल्पिक अर्थ को पारदर्शी बनाना।
lexical_decisions:
- source_word: διαθήκη
  choice: वसीयत
  rationale: इस साहित्यिक संदर्भ में यह मृत्यु से पहले संतान को दिए गए अंतिम निर्देश और कथन को दर्शाता है; आधुनिक हिन्दी में ‘वसीयत’ सबसे सहज शीर्षकीय शब्द है।
- source_word: ἔξοδος
  choice: प्रस्थान
  rationale: शाब्दिक रूप से ‘बाहर जाना/प्रस्थान’; यहाँ मृत्यु के लिए प्रयुक्त शिष्टोक्ति को बिना सीधे ‘मृत्यु’ में बदल दिए सुरक्षित रखा गया है।
- source_word: δεῖπνον
  choice: भोज
  rationale: सामूहिक विशेष भोजन के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δοξάζων
  choice: महिमा करते हुए
  rationale: यूनानी पाठ में केवल प्रभु की महिमा करने का भाव है; अंग्रेज़ी परामर्श-पाठ का अतिरिक्त ‘blessing’ मूल में स्पष्ट नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: ἐκραταιώθη
  choice: बलवन्त हुआ
  rationale: निष्क्रिय/अकर्मक भाव ‘शक्तिशाली किया गया/बल पाया’ को संक्षेप और गरिमापूर्ण ढंग से रखता है, बिना शक्ति के स्रोत को स्पष्ट करके अस्पष्टता मिटाए।
- source_word: πανουργίᾳ
  choice: चतुराई से
  rationale: शब्द में कौशल से लेकर धूर्तता तक का नकारात्मक रंग हो सकता है; ‘चतुराई’ आरोप को बनाए रखता है पर अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: ἁπαλόν
  choice: छोटा और कोमल
  rationale: शैशव और कोमलता दोनों को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐλογίας
  choice: आशीषों
  rationale: प्रस्तुत यूनानी पाठ का प्रत्यक्ष अर्थ ‘आशीषों’ है; अंग्रेज़ी POB के ‘prayers’ को मूल-पाठ से अधिक निर्णायक मानकर नहीं अपनाया गया।
theological_decisions:
- issue: नप्ताली के बोलते समय उसकी देह के ‘मर जाने’ का कथन
  choice: “मेरी देह मर गई”
  alternative: “मेरी देह शिथिल होकर मानो मर गई” / “मेरी देह ने साथ छोड़ दिया और मर गई”
  rationale: यूनानी पाठ का सीधा और तनावपूर्ण कथन सुरक्षित रखा गया है। ‘मानो’ या ‘ने साथ छोड़ दिया’ जोड़ना कथित विरोधाभास को व्याख्या द्वारा हल कर देता।
- issue: राहेल की इच्छा में दाता का कर्ता
  choice: “मुझे ... एक पुत्र मिले”
  alternative: “परमेश्वर मुझे ... एक पुत्र दे”
  rationale: δοίη में कर्ता व्यक्त नहीं है। ईश्वर को निहित कर्ता मानना संभव है, पर उसे मुख्य पाठ में जोड़ना मूल की व्याकरणिक अस्पष्टता को समाप्त कर देता।
- issue: यूसुफ की समानता और राहेल की εὐλογίας
  choice: “राहेल की आशीषों के अनुसार”
  alternative: “राहेल की प्रार्थनाओं के अनुसार”
  rationale: उपलब्ध यूनानी εὐλογίας का सामान्य अर्थ ‘आशीषों’ है। वाक्य का संबंध कुछ कठिन है, इसलिए उसे व्याख्यात्मक विस्तार से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज वाक्य-विन्यास अपनाया गया है। नामों के रूप ‘नप्ताली, याकूब, बिल्हा, राहेल, यूसुफ’ प्रचलित हिन्दी बाइबलीय परंपरा के अनुसार हैं। संबोधन में ‘बच्चो’ और ‘पुत्रो’ का मानक संबोधन-रूप रखा गया है। स्रोत के शीर्षक को शामिल किया गया है; अध्याय और पद-संख्या स्पष्ट रूप से दी गई है।
