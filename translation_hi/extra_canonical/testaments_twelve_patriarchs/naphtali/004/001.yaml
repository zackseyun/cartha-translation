id: T12P.NAP.4.1
reference: Testament of Naphtali 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: IV. Ταῦτα¹ λέγω ὑμῖν², τέκνα μου, ὅτι ἔγνων³ ἐν τῇ⁴ γραφῇ⁵ Ἐνώχ, ὅτι καίγε⁶ ὑμεῖς ἀποστήσεσθε ἀπὸ Κυρίου⁷, πορευόμενοι κατὰ πᾶσαν ἀνομίαν⁸ ἐθνῶν⁹, καὶ ποιήσετε¹⁰ πᾶσαν πονηρίαν¹¹ Σοδόμων¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/001.yaml
  text: These things I say to you, my children, because I have learned in the writing of Enoch that you too will depart from the Lord, walking in all the lawlessness of the nations and doing all the wickedness of Sodom.
translation:
  language: hi
  text: ये बातें मैं तुमसे कहता हूँ, मेरे बच्चो, क्योंकि मैंने हनोक के लेख में यह जाना है कि तुम भी प्रभु से दूर हो जाओगे, जातियों के हर प्रकार के अधर्म के अनुसार चलोगे और सदोम की सारी दुष्टता करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ γραφῇ Ἐνώχ
  choice: हनोक के लेख में
  rationale: ग्रीक ἐν के स्थानीय अर्थ और γραφή के एकवचन को सीधे बनाए रखता है; इसे केवल ‘हनोक से’ या ‘हनोक की पुस्तक से’ कहकर अधिक विशिष्ट नहीं बनाया गया।
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: प्रभु से दूर हो जाओगे
  rationale: ἀφίστημι के अलग हो जाने या विमुख होने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना ‘निश्चय’ जैसा अतिरिक्त बल जोड़े।
- source_word: πορευόμενοι
  choice: चलोगे
  rationale: नैतिक जीवन-व्यवहार के लिए प्रयुक्त ग्रीक रूपक को हिन्दी के परिचित ‘चलना’ रूपक में सुरक्षित रखता है।
- source_word: κατὰ πᾶσαν ἀνομίαν ἐθνῶν
  choice: सब प्रकार की जातियों की अधर्मता के अनुसार
  rationale: κατά को ‘के अनुसार’ और ἀνομία को धार्मिक-नैतिक ‘अधर्मता’ के रूप में प्रस्तुत करता है; πᾶσαν को सामूहिक विस्तार ‘सब प्रकार की’ से स्वाभाविक बनाया गया है।
- source_word: πᾶσαν πονηρίαν Σοδόμων
  choice: सदोम की हर प्रकार की दुष्टता
  rationale: πονηρία के व्यापक नैतिक अर्थ को ‘दुष्टता’ से व्यक्त करता है और πᾶσαν की व्यापकता को बनाए रखता है।
theological_decisions:
- issue: भविष्यवाणी की निश्चितता
  choice: दूर हो जाओगे
  alternative: निश्चय ही दूर हो जाओगे
  rationale: ग्रीक भविष्यकाल भविष्य की बात कहता है, पर पाठ में अलग से ‘निश्चय ही’ जैसा तीव्रकारी शब्द नहीं है।
- issue: जातियों का संदर्भ
  choice: जातियों
  alternative: गैर-यहूदियों
  rationale: ἐθνῶν का सामान्य और खुला अर्थ ‘जातियाँ’ रखा गया है; संदर्भ से संभव धार्मिक पहचान को व्याख्यात्मक शब्दावली द्वारा सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘मेरे बच्चो’ संबोधन को आत्मीय रखा गया है; वाक्य की भविष्यसूचक और नैतिक गंभीरता सुरक्षित है।
