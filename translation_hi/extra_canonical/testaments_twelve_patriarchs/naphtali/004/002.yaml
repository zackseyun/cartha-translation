id: T12P.NAP.4.2
reference: Testament of Naphtali 4:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἐπάξει Κύριος ὑμῖν αἰχμαλωσίαν, καὶ δουλεύσετε ⌈ἐκεῖ⌉¹³ *τοῖς ἐχθροῖς¹⁴ ὑμῶν, καὶ πάσῃ κακώσει¹⁵ καὶ θλίψει †συναναστραφήσεσθε¹⁶, ἕως ἀναλώσει¹⁷ Κύριος πάντας ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/002.yaml
  text: And the Lord will bring captivity upon you, and there you will serve your enemies, and you will be afflicted with every kind of evil and tribulation, until the Lord has consumed you all.
translation:
  language: hi
  text: और प्रभु तुम्हें बंदी बना देगा, और वहाँ तुम अपने शत्रुओं की सेवा करोगे; और हर प्रकार की दुर्दशा और क्लेश में जीवन बिताओगे, जब तक प्रभु तुम सबका अंत न कर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάξει ... αἰχμαλωσίαν
  choice: बंदी बना देगा
  rationale: यूनानी पदबंध का अर्थ उन पर बंदी अवस्था लाना है; सहज हिन्दी में यह निर्वासन या स्थानांतरण से अधिक स्पष्ट रूप से पराधीन बंदी दशा व्यक्त करता है।
- source_word: δουλεύσετε
  choice: सेवा करोगे
  rationale: क्रिया दासवत अधीन होकर सेवा करने का भाव रखती है। ‘सेवा करोगे’ स्वाभाविक है और ‘अपने शत्रुओं’ के संदर्भ में विवश अधीनता स्पष्ट रहती है।
- source_word: πάσῃ κακώσει καὶ θλίψει
  choice: हर प्रकार की दुर्दशा और क्लेश
  rationale: κακώσει में बुरा व्यवहार, कष्ट या दुर्दशा का व्यापक भाव है, जबकि θλίψει दबाव और क्लेश को व्यक्त करता है; दोनों को अलग रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: συναναστραφήσεσθε
  choice: में जीवन बिताओगे
  rationale: पाठ-चिह्नित क्रिया का मूल भाव किसी अवस्था या संगति में रहना और व्यवहार करना है। यहाँ ‘जीवन बिताओगे’ दुःखद परिस्थितियों के बीच निरंतर रहने का अर्थ देता है।
- source_word: ἀναλώσει
  choice: अंत न कर दे
  rationale: क्रिया का अर्थ पूरी तरह नष्ट या समाप्त कर देना है। ‘अंत कर दे’ कठोर परिणाम को बनाए रखता है, पर हिन्दी में अधिक स्वाभाविक है।
theological_decisions:
- issue: प्रभु द्वारा अंतिम दंड की तीव्रता
  choice: जब तक प्रभु तुम सबका अंत न कर दे
  alternative: जब तक प्रभु तुम सबको नष्ट न कर दे
  rationale: मूल ἀναλώσει की पूर्ण विनाश/समाप्ति की तीव्रता को नरम नहीं किया गया; ‘अंत कर दे’ इस संदर्भ में स्वाभाविक रहते हुए वही गंभीरता रखता है।
- issue: भविष्यवाणी में शत्रुओं की अधीनता
  choice: अपने शत्रुओं की सेवा करोगे
  alternative: अपने शत्रुओं के दास बनोगे
  rationale: δουλεύσετε दासवत सेवा सूचित कर सकता है, किंतु संज्ञात्मक पहचान ‘दास बनोगे’ मूल से अधिक स्पष्ट कर देती। क्रियात्मक रूप मूल की संरचना और संभावित अर्थ-व्याप्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यवाणीय और गरिमापूर्ण शैली रखी गई है। वाक्य-संरचना मूल के क्रम का पर्याप्त अनुसरण करती है, किंतु सहज पठनीयता के लिए अर्धविराम का प्रयोग किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
