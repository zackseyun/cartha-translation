  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003.yaml
  text: '1. So then, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls. For if, in purity of heart, you keep silence, you will understand how to hold fast the will of God and to cast away the will of Beliar.


    2. The sun and the moon and the stars do not alter their appointed order; so you also must not alter the law of God through the disorder of your deeds.


    3. The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.


    4. But you, my children, must not be so. Rather, know in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.


    5. In the same way also the Watchers changed the order of their nature, and the Lord cursed them at the time of the flood; because of them he made the earth desolate and without fruit.'
translation:
  language: hi
  text: '1. इसलिए लोभ में पड़कर अपने कामों को बिगाड़ने की चेष्टा मत करो, और न खोखली बातों से अपने प्राणों को धोखा दो। क्योंकि यदि तुम हृदय की शुद्धता में मौन रहोगे, तो समझोगे कि परमेश्वर की इच्छा को कैसे थामे रहना और बेलियार की इच्छा को कैसे त्याग देना है।


    2. सूर्य, चंद्रमा और तारे अपने निर्धारित क्रम को नहीं बदलते; इसी प्रकार तुम भी अपने कामों की अव्यवस्था से परमेश्वर की व्यवस्था को मत बदलो।


    3. जो जातियाँ भटक गईं और जिन्होंने प्रभु को छोड़ दिया, उन्होंने अपना क्रम बदल डाला और काठ-पत्थर तथा भटकाने वाली आत्माओं की बात मानी।


    4. परन्तु हे मेरे बच्चों, तुम ऐसे न होना। आकाशमंडल में, पृथ्वी पर, समुद्र में और समस्त सृष्ट वस्तुओं में उस प्रभु को पहचानो जिसने सब कुछ बनाया, ताकि तुम सदोम के समान न हो जाओ, जिसने अपनी प्रकृति का क्रम बदल दिया।


    5. इसी प्रकार पहरेदारों[a] ने भी अपनी प्रकृति का क्रम बदल दिया। प्रभु ने जलप्रलय के समय उन्हें शाप दिया; उन्हीं के कारण उसने पृथ्वी को उजाड़ और निष्फल कर दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पहरेदार” प्राचीन यहूदी साहित्य में अलौकिक प्राणियों के एक समूह का पारंपरिक नाम है।
    reason: Ἐγρήγοροι के तकनीकी पारंपरिक अर्थ को स्पष्ट करता है, बिना इस पद से परे उनके कार्य या स्वरूप के बारे में कोई निश्चित व्याख्या जोड़े।
lexical_decisions:
- source_word: σπουδάζετε ἐν πλεονεξίᾳ
  choice: लोभ में पड़कर ... चेष्टा मत करो
  rationale: σπουδάζω की तत्परता/उत्सुक प्रयत्न और πλεονεξία के लोभ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λόγοις κενοῖς
  choice: खोखली बातों से
  rationale: शाब्दिक ‘रिक्त वचनों’ की अपेक्षा अर्थ-सुगम है और निरर्थक अथवा सारहीन कथनों का भाव बनाए रखता है।
- source_word: ψυχὰς
  choice: प्राणों
  rationale: ψυχή की व्यापक प्राचीन अर्थ-सीमा को केवल आधुनिक मनोवैज्ञानिक ‘आत्मा’ तक सीमित नहीं करता।
- source_word: κρατεῖν
  choice: थामे रहना
  rationale: दृढ़ता से पकड़े रहने के मूल भाव को सुरक्षित रखता है।
- source_word: τάξιν
  choice: क्रम
  rationale: इस अध्याय में सृष्टि के नियत क्रम, आचरण की व्यवस्था और प्रकृति के क्रम के बीच दोहराए गए केंद्रीय शब्द को एकरूप रखता है।
- source_word: νόμον Θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος यहाँ ईश्वरीय नियम/विधान है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और पास के ἀταξία से अर्थगत संबंध भी रखती है।
- source_word: στερεώματι
  choice: आकाशमंडल
  rationale: प्राचीन ब्रह्मांड-वर्णन का सम्मान करते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य पारंपरिक पद।
- source_word: Ἐγρήγοροι
  choice: पहरेदारों
  rationale: इस अपोकैलिप्टिक परंपरा के जागते/निगरानी करने वाले अलौकिक प्राणियों का पदनाम; अर्थ को सामान्य मानव चौकीदारों तक सीमित होने से बचाने के लिए पादटिप्पणी दी गई है।
- source_word: ἄκαρπον
  choice: निष्फल
  rationale: शाब्दिक रूप से फलरहित/अनुत्पादक का भाव रखता है और ‘बंजर’ से कुछ व्यापक है।
theological_decisions:
- issue: बेलियार की पहचान
  choice: बेलियार
  alternative: शैतान / दुष्ट
  rationale: मूल पाठ के विशिष्ट नाम Βελίαρ को सामान्यीकृत कर किसी एक बाद की धर्मवैज्ञानिक पहचान में नहीं बदला गया।
- issue: मौन और समझ के बीच संबंध
  choice: यदि तुम ... मौन रहोगे, तो समझोगे
  alternative: मौन रहते हुए तुम समझोगे
  rationale: ग्रीक participle σιωπῶντες को संदर्भानुसार शर्तात्मक रूप दिया गया है, जैसा परामर्श-पाठ में है; इसे मुक्ति या प्रकाशन का निरपेक्ष सिद्धांत नहीं बनाया गया।
- issue: काठ-पत्थर और भटकाने वाली आत्माओं का संबंध
  choice: काठ-पत्थर की, अर्थात् भटकाने वाली आत्माओं की, बात मानी
  alternative: काठ-पत्थर और भटकाने वाली आत्माओं की बात मानी
  rationale: ग्रीक में ξύλοις καὶ λίθοις के बाद πνεύμασι πλάνης समान कारक में है और अपोसिशन अथवा अतिरिक्त वस्तु दोनों संभव हैं। ‘अर्थात्’ संभावित व्याख्यात्मक संबंध दर्शाता है, पर इसे अलग पादटिप्पणी के बिना सहज बनाया गया है।
- issue: सदोम द्वारा प्रकृति का क्रम बदलना
  choice: अपनी प्रकृति का क्रम बदल दिया
  alternative: प्राकृतिक यौन-व्यवस्था को बदल दिया
  rationale: मूल की संक्षिप्त और संभावित रूप से बहुअर्थी अभिव्यक्ति को विस्तार देकर किसी विशिष्ट सांप्रदायिक व्याख्या में सीमित नहीं किया गया।
- issue: पहरेदारों का स्वरूप
  choice: पहरेदारों
  alternative: स्वर्गदूतों
  rationale: Ἐγρήγοροι को उसके विशिष्ट पारंपरिक नाम से अनूदित किया गया; पाठ स्वयं यहाँ उन्हें सीधे ‘स्वर्गदूत’ नहीं कहता।
- issue: पद 5 का पाठगत रूप
  choice: पृथ्वी को उजाड़ और निष्फल कर दिया
  alternative: पृथ्वी को निर्जन और निष्फल ठहराया
  rationale: अंतिम यूनानी वाक्य पाठगत/वाक्यगत रूप से कठिन है और [ἀοίκητον] कोष्ठकित है। उपलब्ध मुख्य अर्थ और अंग्रेज़ी परामर्श-पाठ के अनुरूप सहज हिन्दी चुनी गई, बिना ‘निर्जन’ को निश्चित मूल-पाठ मानने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘क्रम’ को पूरे अनुच्छेद में जानबूझकर दोहराया गया है ताकि τάξις/ἀταξία और प्रकृति-सृष्टि-आचरण की विषयगत कड़ी बनी रहे। संबोधन में स्वाभाविक ‘हे मेरे बच्चो’ और निषेध में स्पष्ट आधुनिक रूप प्रयुक्त हैं।
