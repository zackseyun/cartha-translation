translation:
  language: hi
  text: और मन की प्रसन्नता के साथ खा-पीकर उसने अपना चेहरा ढक लिया और मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: मन की प्रसन्नता के साथ
  rationale: यह यूनानी पदबंध की भीतरी प्रसन्नता को सहज आधुनिक हिन्दी में व्यक्त करता है; यहाँ ψυχή के लिए शाब्दिक ‘आत्मा’ की अपेक्षा ‘मन’ अधिक स्वाभाविक है।
- source_word: φαγὼν καὶ πιὼν
  choice: खा-पीकर
  rationale: दोनों भूतकालिक कृदन्तों की पूर्वकालिक क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: उसने अपना मुँह ढक लिया
  rationale: मध्यवाचक अर्थ वाली हिन्दी रचना स्वाभाविक ढंग से बताती है कि उसने स्वयं अपना चेहरा ढका; ‘मुँह’ साधारण आधुनिक हिन्दी में πρόσωπον का सहज पर्याय है।
- source_word: ἀπέθανε
  choice: मर गया
  rationale: क्रिया का सीधा और स्पष्ट अर्थ बिना किसी व्याख्यात्मक विस्तार के देता है।
