  text: And after instructing them in many such things, he urged them to carry his bones to Hebron and bury him with his fathers.
translation:
  language: hi
  text: और उन्हें ऐसी बहुत-सी बातें निर्देश देने के बाद, उसने उनसे आग्रह किया कि वे उसकी हड्डियाँ हेब्रोन ले जाएँ और उसे उसके पूर्वजों के साथ दफ़ना दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: समझाने के बाद
  rationale: यहाँ कृदंत पूर्वकालिक है और अनेक अंतिम निर्देश देने का भाव व्यक्त करता है; सहज आधुनिक हिन्दी में ‘समझाने’ से प्रसंगानुकूल निर्देशात्मक अर्थ मिलता है।
- source_word: παρεκάλεσεν
  choice: आग्रह किया
  rationale: क्रिया का अनुरोध या प्रबल प्रोत्साहन वाला अर्थ ‘आग्रह किया’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: μετακομίσωσι
  choice: ले जाएँ
  rationale: अवशेषों को एक स्थान से दूसरे स्थान पहुँचाने का अर्थ संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: उसकी हड्डियाँ
  rationale: शाब्दिक अर्थ बनाए रखा गया है; मृत्यु के बाद के अवशेषों के लिए हिन्दी में यह स्पष्ट और समझने योग्य है।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पूर्वजों के साथ
  rationale: πατέρων का यहाँ आशय वंश के पहले मर चुके पितरों से है; आधुनिक हिन्दी में ‘पूर्वजों’ अधिक स्पष्ट है।
