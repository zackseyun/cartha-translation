  text: 'And after commanding them many such things[[Here begins ...]], he urged them to carry his bones to Hebron and bury him with his fathers.


    2. And after eating and drinking with gladness of soul, he covered his face and died.


    3. And his sons did in every respect all that Naphtali their father had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.]'
translation:
  language: hi
  text: '1 ऐसी और भी बहुत-सी आज्ञाएँ देने के बाद, उसने उनसे आग्रह किया कि वे उसकी हड्डियाँ हेब्रोन ले जाएँ और उसे उसके पूर्वजों के साथ दफ़नाएँ।


    2 मन की प्रसन्नता के साथ खाने-पीने के बाद, उसने अपना चेहरा ढक लिया और मर गया।


    3 उसके पुत्रों ने हर बात में ठीक वैसा ही किया, जैसा उनके पिता नप्ताली ने उन्हें आज्ञा दी थी।


    [a] यहाँ से अगला ग्रंथ आरंभ होता है: “याकूब और जिल्पा के नौवें पुत्र गाद का वसीयतनामा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ से अगला ग्रंथ आरंभ होता है: “याकूब और जिल्पा के नौवें पुत्र गाद का वसीयतनामा।”'
    reason: दिए गए यूनानी साक्ष्य के अंत में अगली रचना का आरंभ-सूत्र मिलता है; यह नप्ताली के कथन का भाग नहीं, बल्कि ग्रंथांतर-संकेत है।
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: आज्ञाएँ देने के बाद
  rationale: यह क्रिया बाध्यकारी अंतिम निर्देशों को व्यक्त करती है; ‘आज्ञाएँ’ वसीयतनामे के प्रसंग में इसकी शक्ति बनाए रखता है।
- source_word: παρεκάλεσεν
  choice: आग्रह किया
  rationale: यह मरते हुए पिता की गंभीर और आत्मीय विनती की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: उसकी हड्डियाँ ... ले जाएँ
  rationale: मूल में ‘हड्डियाँ’ स्पष्ट है और क्रिया अवशेषों को एक स्थान से दूसरे स्थान ले जाने को दर्शाती है।
- source_word: ἐν Χεβρών
  choice: हेब्रोन ले जाएँ
  rationale: यद्यपि ἐν सामान्यतः ‘में’ है, गति-सूचक क्रिया के साथ यहाँ गंतव्य का अर्थ अपेक्षित है।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पूर्वजों के साथ
  rationale: πατέρων का शाब्दिक अर्थ ‘पिताओं’ है, पर दफ़नाने के पारिवारिक मुहावरे में आधुनिक हिन्दी का ‘पूर्वजों’ आशय को अधिक स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: मन के आनंद के साथ
  rationale: यह भीतरी प्रसन्नता और शांत मृत्यु-दृश्य दोनों को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: अपना चेहरा ढक लिया
  rationale: सरल और निकट अनुवाद मूल क्रिया तथा मृत्यु-वृत्तांत की गरिमा बनाए रखता है।
- source_word: κατὰ πάντα
  choice: हर बात में ठीक वैसा ही
  rationale: यह पुत्रों द्वारा निर्देशों के पूर्ण पालन पर दिए गए बल को स्पष्ट करता है।
theological_decisions:
- issue: अगले वसीयतनामे के आरंभिक शीर्षक को शामिल करना
  choice: मुख्य कथा से अलग [a] पाठ-टिप्पणी के रूप में सुरक्षित रखा गया
  alternative: इसे छोड़ देना, या नप्ताली 9 के सतत मूलपाठ की तरह छापना
  rationale: दिए गए यूनानी साक्ष्य में अगली रचना का आरंभ-सूत्र है, पर वह नप्ताली के अंतिम कथन या अध्याय की कथा का भाग नहीं है। अतः पारदर्शिता के लिए उसे स्पष्ट पाठ-टिप्पणी के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वसीयतनामा-शैली रखी गई है। ‘हड्डियाँ’ जैसे ठोस मूल शब्द को सुरक्षित रखा गया है; ‘पूर्वजों’ और ‘मन के आनंद’ से अर्थ सामान्य पाठकों के लिए स्वाभाविक बनाया गया है।
