base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/002.yaml
  text: Then my father said to me, “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”
translation:
  language: hi
  text: तब मेरे पिता ने मुझसे कहा, “मैं परमेश्वर की बात मानता हूँ कि यूसुफ जीवित है; क्योंकि मैं सदा देखता हूँ कि प्रभु उसे हमारे बीच गिनता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιστεύω τῷ θεῷ
  choice: मुझे परमेश्वर पर विश्वास है
  rationale: यूनानी में πιστεύω के साथ सम्प्रदान कारक परमेश्वर पर भरोसा या उनकी बात को विश्वसनीय मानने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और अर्थ-संगत अभिव्यक्ति है।
- source_word: ζῇ Ἰωσήφ
  choice: यूसुफ जीवित है
  rationale: वर्तमानकालीन ζῇ का सीधा और स्पष्ट अनुवाद।
- source_word: ὁρῶ ... ὅτι
  choice: मैं ... देखता हूँ कि
  rationale: दृष्टि या अनुभूति से जुड़े मूल क्रिया-रूप को व्याख्यात्मक रूप से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: Κύριος ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: प्रभु उसे हमारे साथ गिनता है
  rationale: ἀριθμεῖ के ‘गिनना/सम्मिलित मानना’ भाव और मूल वाक्य की असामान्य किन्तु अर्थपूर्ण छवि को बनाए रखता है।
- source_word: πάντοτε
  choice: सदा
  rationale: समय की निरंतरता व्यक्त करने वाला संक्षिप्त, गरिमापूर्ण हिन्दी विकल्प।
theological_decisions:
- issue: याकूब के विश्वास और दर्शन/अनुभूति का संबंध
  choice: ‘विश्वास है’ और ‘देखता हूँ’ दोनों कथनों को बिना समरस किए रखा गया
  alternative: ‘मुझे निश्चय है ... क्योंकि मैं अनुभव करता हूँ’
  rationale: मूल पाठ विश्वास और देखने की भाषा के बीच संभावित तनाव रखता है; उसे मनोवैज्ञानिक व्याख्या द्वारा हल नहीं किया गया।
- issue: प्रभु द्वारा यूसुफ को परिवार के साथ गिनना
  choice: रूपक को शाब्दिक निकटता से सुरक्षित रखा गया
  alternative: ‘प्रभु उसे अब भी हमारे परिवार का अंग मानता है’
  rationale: वैकल्पिक रूप अर्थ स्पष्ट करता, पर ἀριθμεῖ की गणना-संबंधी छवि को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण कथात्मक शैली। ‘यूसुफ’ और ‘प्रभु’ जैसे प्रचलित बाइबलीय रूप रखे गए हैं। मूल यूनानी की संक्षिप्तता तथा ‘हमारे साथ गिनता है’ की जानबूझकर असामान्य छवि सुरक्षित है।
