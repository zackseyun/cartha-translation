revisions:
- from: तब मेरे पिता ने मुझसे कहा, “मुझे परमेश्वर पर विश्वास है कि यूसुफ जीवित है; क्योंकि मैं सदा देखता हूँ कि प्रभु उसे हमारे साथ गिनता है।”
  to: तब मेरे पिता ने मुझसे कहा, “मैं परमेश्वर की बात मानता हूँ कि यूसुफ जीवित है; क्योंकि मैं सदा देखता हूँ कि प्रभु उसे हमारे बीच गिनता है।”
