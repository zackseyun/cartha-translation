  text: And weeping, he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, who fathered you.”
translation:
  language: hi
  text: और रोते हुए उसने कहा, “हाय, मेरे बेटे यूसुफ, तू जीवित है, और मैं तुझे नहीं देखता; और तू अपने जन्मदाता याकूब को नहीं देखता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίων
  choice: रोते हुए
  rationale: वर्तमान कृदंत की समकालिक क्रिया और भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Οἴμοι
  choice: हाय
  rationale: शोक और व्यथा के उद्गार के लिए संक्षिप्त तथा स्वाभाविक हिन्दी समतुल्य।
- source_word: τέκνον μου
  choice: मेरे बेटे
  rationale: पिता द्वारा यूसुफ को किए गए आत्मीय संबोधन को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ζῇς
  choice: तू जीवित है
  rationale: प्रत्यक्ष संबोधन और वर्तमान अवस्था को निकट, पारिवारिक एकवचन में सुरक्षित रखता है।
- source_word: τὸν γεννήσαντά σε
  choice: अपने जन्मदाता
  rationale: शाब्दिक अर्थ ‘जिसने तुझे जन्म दिया/उत्पन्न किया’ को संक्षिप्त और गरिमापूर्ण ढंग से रखता है; प्रसंग में जैविक पिता का बोध स्पष्ट है।
