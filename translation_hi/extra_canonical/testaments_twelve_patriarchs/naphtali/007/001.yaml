base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/001.yaml
  text: I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”
translation:
  language: hi
  text: मैंने ये दोनों स्वप्न अपने पिता को बताए, और उन्होंने मुझसे कहा, “इन बातों का अपने-अपने नियत समय पर पूरा होना अवश्य है, इस्राएल के बहुत कुछ सह लेने के बाद।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνύπνια
  choice: स्वप्न
  rationale: ‘स्वप्न’ आधुनिक हिन्दी में सहज होने के साथ गरिमापूर्ण है और यहाँ वर्णित दिव्य अर्थ वाले सपनों के लिए उपयुक्त है।
- source_word: Δεῖ ... πληρωθῆναι
  choice: पूरा होना अवश्य है
  rationale: यह यूनानी पदबंध की आवश्यकता या अनिवार्यता को बनाए रखता है, बिना उसके कारण को अतिरिक्त रूप से परिभाषित किए।
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  choice: अपने-अपने नियत समय पर
  rationale: बहुवचन ‘καιρούς’ और प्रत्येक बात से संबद्ध उपयुक्त समय का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: πολλὰ ... ὑπομείναντος
  choice: बहुत कुछ सह चुका होगा
  rationale: ‘ὑπομένω’ के सहते रहने या धीरज से झेलने के भाव को संक्षिप्त और स्वाभाविक हिन्दी में रखता है; पूर्वकालिक संबंध भी स्पष्ट करता है।
theological_decisions:
- issue: इस्राएल के बहुत कुछ सहने और बातों के पूरा होने का काल-संबंध
  choice: “जब इस्राएल बहुत कुछ सह चुका होगा”
  alternative: “इस्राएल के बहुत कुछ सह लेने के बाद”
  rationale: यूनानी aorist participle मुख्य घटना से पूर्व पूर्ण हुए दुःख-सहन का संकेत दे सकता है, किंतु वाक्य की भविष्यवाणी-संबंधी खुली कालगत बनावट को ‘जब ... चुका होगा’ अधिक स्वाभाविक रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। पिता के उत्तर में भविष्यवाणी-सदृश गंभीरता रखी गई है, पर कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी गई।
