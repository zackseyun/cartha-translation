  text: So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold, yet I was afraid of my brothers.
translation:
  language: hi
  text: तब उसकी इन बातों ने मुझे भी रुला दिया। लेकिन मेरा मन भीतर ही भीतर उसे यह बताने के लिए तड़प रहा था कि यूसुफ को बेच दिया गया है; फिर भी मैं अपने भाइयों से डरता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς λόγοις τούτοις
  choice: उन बातों से
  rationale: यहाँ ἐν साधन या कारण का भाव देता है; स्वाभाविक हिन्दी में ‘उन बातों से’ इसी अर्थ को स्पष्ट रखता है।
- source_word: ἐκαιόμην τοῖς σπλάγχνοις μου
  choice: मैं भीतर ही भीतर व्याकुल हो रहा था
  rationale: शाब्दिक अर्थ ‘मेरी अंतड़ियों/अंतरंग में जल रहा था’ है। यह तीव्र आंतरिक बेचैनी और बताने की उत्कंठा का मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में उसी भाव को गरिमापूर्वक व्यक्त करता है।
- source_word: ἀναγγεῖλαι
  choice: बता दूँ
  rationale: क्रिया का अर्थ समाचार देना या सूचित करना है; प्रसंग में नप्ताली अपने पिता को यूसुफ के बेचे जाने की बात बताना चाहता है।
- source_word: πέπραται
  choice: बेच दिया गया है
  rationale: Perfect passive यूसुफ के बेचे जा चुकने और उस स्थिति के वर्तमान प्रभाव को व्यक्त करता है; हिन्दी का पूर्ण कर्मवाच्य इसे बनाए रखता है।
- source_word: ἐφοβούμην
  choice: मैं ... डरता था
  rationale: Imperfect भूतकाल में जारी भय को दर्शाता है; हिन्दी का ‘डरता था’ इसे स्वाभाविक रूप से व्यक्त करता है।
