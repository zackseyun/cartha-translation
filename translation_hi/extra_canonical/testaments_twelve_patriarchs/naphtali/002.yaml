  text: '1[a]. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he blessed me as though I were a deer.


    2. For just as the potter knows how much the vessel can hold, and according to that brings the clay for the work, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body''s capacity places the spirit within it.


    3. And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.


    4. And just as the potter knows the use of each vessel, how much it is fit for, so also the Lord knows the body: how long it will endure in good, and when it comes into evil.


    5. For there is no purpose of his creation that the Lord does not know; for he created every human being in his own image.


    6[b]. As a person''s strength is, so also is his work, whether in the law of the Lord or in the law of Beliar.


    7. And just as there is a division between light and darkness, between seeing and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in all things one face is the same as another.


    8. For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.


    9. So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.


    10. For if you say to the eye, “Hear,” it cannot; or to the ear, “See,” it cannot.


    11. In the same way, neither can you do the works of heaven on earth, nor the works of earth in heaven.


    12. For God made all things beautiful in their time. He gave the sun to rule the day, and the moon and stars to rule the night.


    13. Therefore, my children, recognize in your heart that as the sun is not the moon, so also the righteous are not the sinners, nor the sinners the righteous.


    14. But there is a difference in conduct and in understanding and in purpose.


    15. For the righteous man has understanding in all things, but the sinner walks in darkness and does not know what he does.


    16. Therefore be wise in God, my children, and understand the order of all things, each in its season, so that you may not transgress the law of the Lord or the law of Beliar by confusion.


    17. But rather choose the law of the Lord, and walk in simplicity and in the fear of God, doing what is good before him.


    18. If you do these things, my children, you will prosper in every work and in every counsel[d][c], and the Lord will bless you forever.'
translation:
  language: hi
  text: '## नप्ताली का वसीयतनामा 2


    **1.** मैं हिरनी के समान फुर्तीला था, और मेरे पिता याकूब ने मुझे हर प्रकार का संदेश पहुँचाने के काम में लगाया; उन्होंने मुझे हिरनी के समान आशीष दी।[a]


    **2.** क्योंकि जैसे कुम्हार जानता है कि पात्र में कितना समा सकता है और उसी के अनुसार उसके लिए मिट्टी लेता है, वैसे ही प्रभु आत्मा के स्वरूप के अनुरूप शरीर बनाता है और शरीर की क्षमता के अनुसार उसमें आत्मा रखता है।


    **3.** उसमें बाल के एक तिहाई के बराबर भी कोई कमी नहीं है; क्योंकि सारी सृष्टि भार, माप और नियम के अनुसार बनाई गई है।


    **4.** और जैसे कुम्हार जानता है कि हर एक पात्र किस काम के लिए और कितनी सीमा तक उपयुक्त है, वैसे ही प्रभु शरीर को जानता है—वह कब तक भलाई में बना रहेगा और कब बुराई में पड़ेगा।


    **5.** क्योंकि न कोई रची हुई वस्तु और न कोई विचार ऐसा है जिसे प्रभु न जानता हो; क्योंकि उसने हर मनुष्य को अपने स्वरूप में बनाया है।


    **6.** मनुष्य की जैसी सामर्थ्य होती है, वैसा ही उसका वचन भी होता है—चाहे वह प्रभु की व्यवस्था के अधीन हो या बेलियार की व्यवस्था के अधीन।[b]


    **7.** और जैसे प्रकाश और अंधकार के बीच, तथा देखने और सुनने के बीच भेद है, वैसे ही एक पुरुष और दूसरे पुरुष के बीच तथा एक स्त्री और दूसरी स्त्री के बीच भी भेद है; यह नहीं कहा जा सकता कि हर बात में एक व्यक्ति का रूप दूसरे के समान है।[c]


    **8.** क्योंकि परमेश्वर ने सब कुछ क्रम में अच्छा बनाया: उसने पाँचों इंद्रियाँ सिर में रखीं और गर्दन को सिर से जोड़ा; शोभा और गौरव के लिए बाल दिए; समझ के लिए हृदय, भेद करने के लिए पेट, पीसने के लिए आमाशय, स्वास्थ्य के लिए श्वासनली, क्रोध के लिए यकृत, कड़वाहट के लिए पित्त, हँसी के लिए तिल्ली, चतुराई के लिए गुर्दे, सामर्थ्य के लिए कटि, सोने के लिए पार्श्व, बल के लिए कमर—और इसी प्रकार शेष अंग भी बनाए।[d]


    **9.** इसलिए, मेरे बच्चो, परमेश्वर के भय में तुम्हारे सभी काम सुव्यवस्थित और भलाई के लिए हों। तिरस्कार की भावना से कोई अव्यवस्थित काम न करना, और न कोई काम उसके उचित समय से बाहर करना।


    **10.** क्योंकि यदि तुम आँख से कहो, “सुन,” तो वह नहीं सुन सकती। इसी प्रकार, अंधकार में रहते हुए तुम प्रकाश के काम नहीं कर सकते।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अध्याय के आरंभ का यूनानी पाठ कुछ स्थानों पर उलझा हुआ है। मुख्य आशय यह है कि नप्ताली हिरन या हिरनी के समान फुर्तीला था और इसलिए संदेश पहुँचाने के काम में लगाया गया।
    reason: textual_variant
  - marker: b
    text: बेलियार यहूदी वसीयतनामा-साहित्य में परमेश्वर और उसकी व्यवस्था के विरोधी शक्ति के लिए प्रयुक्त पारंपरिक नाम है।
    reason: cultural_note
  - marker: c
    text: “देखने और सुनने” तथा पद के अंतिम वाक्य का यूनानी पाठ अस्थिर है। अनुवाद ने शरीर की अलग-अलग इंद्रियों और व्यक्तियों के बीच भेद वाले निकटवर्ती तर्क को बनाए रखा है।
    reason: textual_variant
  - marker: d
    text: इस पद में शरीर के अंगों और उनके कार्यों की सूची पाठगत रूप से विकृत है और इसमें प्राचीन शरीर-विज्ञान की धारणाएँ झलकती हैं। “भेद करने,” “स्वास्थ्य,” और “सोने के लिए पार्श्व” जैसे पद उपलब्ध यूनानी के असामान्य शब्दों को यथासंभव प्रत्यक्ष रखते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν ὡς ἡ ἔλαφος
  choice: हिरनी के समान तेज़ पाँवोंवाला
  rationale: κοῦφος यहाँ हल्केपन से अधिक फुर्ती और तीव्रता व्यक्त करता है; ἔλαφος का स्त्रीलिंग रूप हिरनी की उपमा देता है।
- source_word: ἀγγελία
  choice: संदेश पहुँचाने का काम
  rationale: संदर्भ में याकूब नप्ताली को संदेशवाहक के व्यावहारिक कार्य में लगाता है; यह केवल अमूर्त ‘संदेश’ से अधिक स्पष्ट है।
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: आत्मा के स्वरूप के अनुरूप
  rationale: यह शरीर और आत्मा के बीच अनुरूपता बताता है, बिना किसी बाद की व्यवस्थित देह-आत्मा धारणा को आरोपित किए।
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος τὸ πνεῦμα ἐπιτίθησιν
  choice: शरीर की क्षमता के अनुसार उसमें आत्मा रखता है
  rationale: δύναμις को यहाँ धारण-क्षमता और ἐπιτίθησιν को स्वाभाविक हिन्दी में ‘रखता है’ कहा गया है।
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: भार, माप और नियम के अनुसार
  rationale: त्रिक सृष्टि की सुनिश्चित व्यवस्था और अनुपात पर बल देता है।
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: भलाई में बना रहेगा
  rationale: ἀγαθόν का नैतिक और व्यापक अर्थ खुला रखा गया है; इसे केवल समृद्धि या स्वास्थ्य तक सीमित नहीं किया गया।
- source_word: κατ’ εἰκόνα ἑαυτοῦ
  choice: अपने स्वरूप में
  rationale: यह उत्पत्ति की परिचित सृष्टि-भाषा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὁ λόγος αὐτοῦ
  choice: उसका वचन
  rationale: λόγος का सीधा अर्थ ‘वचन/कथन’ है। पाठ की कठिनता के कारण इसे ‘काम’ बनाकर निर्णायक रूप से नहीं समझाया गया।
- source_word: νόμῳ Κυρίου ... νόμῳ τοῦ Βελίαρ
  choice: प्रभु की व्यवस्था ... बेलियार की व्यवस्था
  rationale: νόμος के नैतिक-अधिकारात्मक अर्थ को ‘व्यवस्था’ से और Βελίαρ को व्यक्तिवाचक नाम के रूप में सुरक्षित रखा गया है।
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: देखने और सुनने के बीच
  rationale: प्रेषित पाठ अस्थिर है, पर शरीर की इंद्रियों और अंगों के निकटवर्ती तर्क में ‘देखना और सुनना’ सबसे संगत पाठ है।
- source_word: ἐν φόβῳ Θεοῦ
  choice: परमेश्वर के भय में
  rationale: यह आज्ञाकारी श्रद्धा की पारंपरिक धार्मिक अभिव्यक्ति है; इसे केवल ‘सम्मान’ कहकर हल्का नहीं किया गया।
theological_decisions:
- issue: पद 2–4 में शरीर और आत्मा का संबंध
  choice: शरीर और आत्मा के बीच परमेश्वर द्वारा निर्धारित अनुरूपता और क्षमता को व्यक्त किया गया है।
  alternative: इसे कठोर देह-आत्मा द्वैतवाद या केवल शरीर-विज्ञान के कथन के रूप में पढ़ना।
  rationale: कुम्हार का रूपक अनुपात, क्षमता और ईश्वरीय रचना पर केंद्रित है; अनुवाद बाद की दार्शनिक श्रेणियाँ नहीं जोड़ता।
- issue: प्रभु की व्यवस्था और बेलियार की व्यवस्था
  choice: दो विरोधी नैतिक अधीनताओं को स्पष्ट रूप से बनाए रखा गया है और बेलियार को नाम के रूप में रखा गया है।
  alternative: बेलियार को केवल अमूर्त ‘बुराई’ या ‘निकम्मापन’ कहना।
  rationale: इस वसीयतनामा-साहित्य में बेलियार परमेश्वर-विरोधी शक्ति का पारंपरिक नाम है; नाम हटाने से पाठ का व्यक्तिकृत नैतिक तनाव मिट जाता।
- issue: पद 5 में ईश्वरीय पूर्वज्ञान और मानवीय स्वरूप
  choice: प्रभु अपनी रचना के हर उद्देश्य को जानता है और मनुष्य को अपने स्वरूप में बनाता है।
