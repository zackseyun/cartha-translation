    **8.** क्योंकि परमेश्वर ने सब कुछ क्रम में अच्छा बनाया: उसने पाँचों इंद्रियाँ सिर में रखीं और गर्दन को सिर से जोड़ा; शोभा और गौरव के लिए बाल दिए; समझ के लिए हृदय, भेद करने के लिए पेट, पीसने के लिए आमाशय, स्वास्थ्य के लिए श्वासनली, क्रोध के लिए यकृत, कड़वाहट के लिए पित्त, हँसी के लिए तिल्ली, चतुराई के लिए गुर्दे, सामर्थ्य के लिए कटि, सोने के लिए पार्श्व, बल के लिए कमर—और इसी प्रकार शेष अंग भी बनाए।[d]


    **9.** इसलिए, मेरे बच्चो, परमेश्वर के भय में तुम्हारे सभी काम सुव्यवस्थित और भलाई के लिए हों। तिरस्कार की भावना से कोई अव्यवस्थित काम न करना, और न कोई काम उसके उचित समय से बाहर करना।


    **10.** क्योंकि यदि तुम आँख से कहो, “सुन,” तो वह नहीं सुन सकती। इसी प्रकार, अंधकार में रहते हुए तुम प्रकाश के काम नहीं कर सकते।'
