  text: '1[a]. I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”


    2. Then my father said to me[b], “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”


    3. And weeping he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, the one who fathered you.”


    4. So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold[c], yet I was afraid of my brothers.'
translation:
  language: hi
  text: '**नप्ताली का वसीयतनामा 7**


    **1.** ये दोनों स्वप्न मैंने अपने पिता को बताए। उन्होंने मुझसे कहा, “इन बातों का अपने नियत समयों[a] पर पूरा होना आवश्यक है, इस्राएल के बहुत कुछ सहने के बाद।”


    **2.** तब मेरे पिता ने मुझसे कहा, “मुझे परमेश्वर पर विश्वास है कि यूसुफ जीवित है; क्योंकि मैं सदा देखता हूँ कि प्रभु उसे हमारे साथ गिनता है[b]।”


    **3.** और उन्होंने रोते हुए कहा, “हाय, मेरे पुत्र यूसुफ! तू जीवित है, पर मैं तुझे नहीं देखता; और तू अपने पिता याकूब को नहीं देखता, जिसने तुझे जन्म दिया।”


    **4.** इन बातों से उन्होंने मुझे भी रुला दिया। पर मेरे भीतर आग-सी जल रही थी[c] कि उन्हें बता दूँ कि यूसुफ को बेच दिया गया था; फिर भी मैं अपने भाइयों से डरता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने उपयुक्त अवसरों पर।” यूनानी शब्द καιροί उचित अथवा नियत समयों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसे हमारे साथ गिनता है” का अनुवाद “उसे हममें गिनता है” या “उसे हमारे साथ मानता है” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “मेरे भीतर आग-सी जल रही थी” यूनानी का एक शारीरिक बिंब है, जो तीव्र भीतरी व्यथा और कुछ कह देने की प्रबल उत्कंठा व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐνύπνια
  choice: स्वप्न
  rationale: यह इसका सामान्य अर्थ है और प्रसंग में ऊँचे या तकनीकी अर्थ वाले ‘दर्शन’ की आवश्यकता नहीं है।
- source_word: δεῖ ... πληρωθῆναι
  choice: पूरा होना आवश्यक है
  rationale: यह δεῖ की अनिवार्यता और πληρωθῆναι के पूर्ण होने—दोनों भावों को सुरक्षित रखता है।
- source_word: καιροὺς
  choice: नियत समयों
  rationale: यह केवल कालक्रम नहीं, बल्कि उपयुक्त अथवा निर्धारित अवसरों का भाव भी व्यक्त करता है; बहुवचन को भी बनाए रखता है।
- source_word: ὑπομείναντος
  choice: सह चुका होगा
  rationale: यह कठिन परिस्थितियों को सहने के भाव और मुख्य घटना से पहले उनके पूर्ण हो चुकने की कालगत संरचना को व्यक्त करता है।
- source_word: πιστεύω τῷ θεῷ
  choice: मुझे परमेश्वर पर विश्वास है
  rationale: शाब्दिक दत्तिव संबंध को स्वाभाविक हिन्दी में परमेश्वर पर भरोसे या विश्वास के रूप में व्यक्त किया गया है; इसे केवल परमेश्वर के अस्तित्व की स्वीकृति नहीं बनाया गया।
- source_word: ἀριθμεῖ
  choice: गिनता है
  rationale: मूल की गणना करने वाली उपमा को व्याख्यात्मक रूप से ‘मानता है’ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: Οἴμοι
  choice: हाय
  rationale: यह विलाप को आधुनिक, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: γεννήσαντά
  choice: जिसने तुझे जन्म दिया
  rationale: यह याकूब के पितृत्व को स्पष्ट रखता है और अप्रचलित ‘उत्पन्न किया’ जैसे रूप से बचता है।
- source_word: ἐκαιόμην τοῖς σπλάγχνοις
  choice: मैं अपने अंतरतम में जल रहा था
  rationale: यह तीव्र आंतरिक व्यथा की शारीरिक उपमा को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: πέπραται
  choice: बेच दिया गया था
  rationale: यह यूसुफ की बिक्री को स्पष्ट करता है और पूर्वघटित घटना के लिए उपयुक्त हिन्दी काल का प्रयोग करता है।
theological_decisions:
- issue: याकूब के उत्तर में भविष्यसूचक अनिवार्यता
  choice: इन बातों का अपने नियत समयों पर पूरा होना आवश्यक है
  alternative: इन बातों को अपने-अपने अवसर पर घटित होना है
  rationale: यह भविष्यसूचक और ईश्वरीय विधान के संकेत को बनाए रखता है, पर किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को पाठ में नहीं जोड़ता।
- issue: ἀριθμεῖ αὐτὸν μεθ’ ἡμῶν का अर्थ
  choice: प्रभु उसे हमारे साथ गिनता है
  alternative: प्रभु उसे हममें गिनता है; प्रभु उसे हमारे साथ मानता है
  rationale: मूल यूनानी की कुछ असामान्य और अर्थगर्भित गणना-उपमा सुरक्षित रखी गई है। इससे यूसुफ के परिवार अथवा जीवितों में सम्मिलित माने जाने की संभावनाओं में से किसी एक को अनावश्यक रूप से अंतिम नहीं बनाया गया।
- issue: πιστεύω τῷ θεῷ में विश्वास का स्वरूप
  choice: मुझे परमेश्वर पर विश्वास है कि यूसुफ जीवित है
  alternative: मैं परमेश्वर की बात मानता हूँ कि यूसुफ जीवित है
  rationale: मूल में किसी स्पष्ट ईश्वरीय कथन का उल्लेख नहीं है। इसलिए हिन्दी में परमेश्वर पर भरोसा व्यक्त किया गया है, कोई अनुल्लिखित प्रकाशना नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। पारिवारिक संवाद में ‘तू’ मूल की एकवचन निकटता और शोकपूर्ण पितृ-संबोधन को व्यक्त करता है। भविष्यसूचक शैली को अत्यधिक संस्कृतनिष्ठ बनाए बिना ‘पूरा होना आवश्यक है’ से रखा गया है। मूल की जीवंत शारीरिक उपमा ‘अंतरतम में जल रहा था’ को पादटिप्पणी सहित सुरक्षित रखा गया है।
