id: T12P.NAP.8.9
reference: Testament of Naphtali 8:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/009.yaml
  text: And both are from God, and if they do not occur in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.
translation:
  language: hi
  text: 9 और दोनों परमेश्वर की ओर से हैं। यदि वे अपने उचित क्रम में न हों, तो वे मनुष्यों के लिए बहुत बड़े पाप का कारण बनती हैं। यही बात बाकी आज्ञाओं पर भी लागू होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο
  choice: दोनों
  rationale: यूनानी में स्त्रीलिंग बहुवचन के साथ ‘दोनों’ कहा गया है; पूर्ववर्ती संदर्भ की दो बातों को बिना अनावश्यक रूप से नाम दिए इसी तरह रखा गया है।
- source_word: τοῦ Θεοῦ εἰσι
  choice: परमेश्वर की ओर से हैं
  rationale: संबंधवाचक τοῦ Θεοῦ स्रोत या संबंध व्यक्त कर सकता है; संदर्भ और परामर्श-पाठ के अनुरूप ‘परमेश्वर की ओर से’ स्वाभाविक है, जबकि इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक अर्थ में सीमित नहीं किया गया।
- source_word: ἐν τῇ τάξει αὐτῶν
  choice: अपने उचित क्रम में
  rationale: τάξις का अर्थ निर्धारित या उचित व्यवस्था/क्रम है; ‘उचित क्रम’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἁμαρτίαν μεγίστην παρεῖχον τοῖς ἀνθρώποις
  choice: मनुष्यों के लिए बहुत बड़े पाप का कारण बनती हैं
  rationale: शाब्दिक ‘बहुत बड़ा पाप उपलब्ध करातीं’ हिन्दी में अस्वाभाविक होगा; कारणात्मक भाव को स्पष्ट रखते हुए पाप की तीव्रता सुरक्षित रखी गई है।
- source_word: ἐπὶ τῶν λοιπῶν ἐντολῶν
  choice: बाकी आज्ञाओं पर भी लागू होती है
  rationale: ἐπί का यहाँ संबंध/प्रयोग का भाव है; ‘लागू होती है’ हिन्दी में उक्त सिद्धांत के अन्य आज्ञाओं से संबंध को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘दोनों’ का परमेश्वर से संबंध
  choice: परमेश्वर की ओर से हैं
  alternative: परमेश्वर की हैं
  rationale: यूनानी संबंधवाचक दोनों अर्थों की अनुमति देता है। ‘की ओर से’ स्रोत का भाव प्रकट करता है और उपलब्ध अंग्रेज़ी परामर्श-पाठ से मेल खाता है, बिना स्वामित्व या दैवी उत्पत्ति के विषय में अतिरिक्त सिद्धांत जोड़े।
- issue: अनुचित क्रम और पाप के बीच संबंध
  choice: बहुत बड़े पाप का कारण बनती हैं
  alternative: मनुष्यों पर बहुत बड़ा पाप लाती हैं
  rationale: παρέχω के कारणात्मक भाव को सामान्य हिन्दी में स्पष्ट किया गया है; यह नहीं कहा गया कि स्वयं वे दोनों पाप हैं, बल्कि अनुचित क्रम में उनका होना पाप का कारण बनता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘दोनों’ की वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखी गई है; अनुवाद में उनके नाम या स्वरूप का अनुमान नहीं जोड़ा गया।
