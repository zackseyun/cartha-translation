base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/003.yaml
  text: Through his scepter God will appear on the earth, dwelling among men, to save the people of Israel, and he will gather the righteous from among the nations.
translation:
  language: hi
  text: 3 उसके राजदंड के द्वारा परमेश्वर पृथ्वी पर प्रकट होगा और मनुष्यों के बीच निवास करेगा,[a] इस्राएल के लोगों को बचाने के लिए; और वह जातियों में से धर्मियों को इकट्ठा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और मनुष्यों के बीच निवास करेगा” के लिए यूनानी पाठ-परंपरा में पाठांतर है; ये शब्द कुछ साक्ष्यों में नहीं मिलते।
    reason: स्रोत-संपादन में κατοικῶν ἐν ἀνθρώποις को कोष्ठकों में रखा गया है, जो इसकी पाठगत अनिश्चितता दर्शाता है।
lexical_decisions:
- source_word: Διὰ τοῦ σκήπτρου αὐτοῦ
  choice: उसके राजदंड के द्वारा
  rationale: διά के साधनवाचक अर्थ और σκήπτρον के राजकीय भाव को बनाए रखा गया है। αὐτοῦ का संदर्भ मूल में स्पष्ट नहीं है, इसलिए हिन्दी में भी ‘उसके’ रखकर अस्पष्टता सुरक्षित रखी गई है।
- source_word: ὀφθήσεται
  choice: प्रकट होगा
  rationale: शाब्दिक अर्थ ‘दिखाई देगा’ हो सकता है, पर ईश्वरीय प्राकट्य के इस प्रसंग में ‘प्रकट होगा’ स्वाभाविक और अर्थसंगत है।
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: मनुष्यों के बीच निवास करेगा
  rationale: वर्तमान कृदंत का अर्थ मुख्य क्रिया के साथ सहज हिन्दी में समन्वित क्रिया के रूप में व्यक्त किया गया है।
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: इस्राएल के वंश
  rationale: γένος के वंश/कुल संबंधी अर्थ को सुरक्षित रखा गया है; यह आधुनिक हिन्दी में ‘जाति’ से उत्पन्न होने वाली संभावित नस्लीय अस्पष्टता से भी बचता है।
- source_word: ἐπισυνάξει δικαίους ἐκ τῶν ἐθνῶν
  choice: जातियों में से धर्मियों को इकट्ठा करेगा
  rationale: ἐπισυνάγω का एकत्र करने का अर्थ और ἐκ का ‘में से’ भाव रखा गया है। ἔθνη को स्वतः ‘गैर-यहूदी’ बनाकर व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: राजदंड के स्वामी की पहचान
  choice: ‘उसके’ का अस्पष्ट सर्वनाम बनाए रखा
  alternative: ‘परमेश्वर के राजदंड’ या किसी मसीही व्यक्ति की स्पष्ट पहचान
  rationale: इस पद में αὐτοῦ का पूर्वपद स्वयं स्पष्ट नहीं है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को जोड़ना मूल की वास्तविक अस्पष्टता को मिटा देता।
- issue: जातियों में पाए जाने वाले धर्मियों का वर्णन
  choice: ‘जातियों में से धर्मियों’
  alternative: ‘धर्मी गैर-यहूदियों’
  rationale: मूल δικαίους ἐκ τῶν ἐθνῶν कहता है। अनुवाद ने उनकी धार्मिक या वाचा-संबंधी स्थिति के बारे में अतिरिक्त निष्कर्ष नहीं जोड़ा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘राजदंड’, ‘निवास’, ‘वंश’ और ‘धर्मी’ जैसे परिचित धार्मिक-साहित्यिक शब्द मूल की औपचारिकता बनाए रखते हैं।
