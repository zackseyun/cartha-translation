  source_fidelity: 'The Hindi accurately represents the Greek: ἰδού is retained as an attention-call, τέκνα μου as an intimate plural address, ὑπέδειξα as disclosure/instruction, καιροὺς ἐσχάτους as plural “end times,” πάντα without an added demonstrative, and ἐν Ἰσραήλ without narrowing Israel’s referent. The Hindi properly follows the Greek source’s explicit “last/end” qualifier, which is absent from the English audit wording.'
