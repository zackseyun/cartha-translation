  terminology: “अन्त के समयों” suitably preserves the eschatological and plural wording without importing a specific doctrinal system. “इस्राएल” is correctly left unexpanded. The footnote appropriately preserves the edition’s marked uncertainty and the possible causal sense of ὅτι.
