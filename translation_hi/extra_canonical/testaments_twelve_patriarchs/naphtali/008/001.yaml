id: T12P.NAP.8.1
reference: Testament of Naphtali 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VIII. Καὶ¹ ἰδού², τέκνα μου³, ὑπέδειξα ὑμῖν καιροὺς ἐσχάτους †ὅτι⁴ πάντα γενήσεται ἐν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/001.yaml
  text: And behold, my children, I have shown you the times, that all will happen in Israel.
translation:
  language: hi
  text: 8:1 और देखो, मेरे बच्चो, मैंने तुम्हें अन्त के समयों के बारे में बता दिया है[a]—कि इस्राएल में सब कुछ घटित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का यूनानी पाठ अनिश्चित चिह्नित है। ‘कि’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘क्योंकि’ भी हो सकता है।
    reason: संस्करण में ὅτι से पहले पाठ-संदेह का चिह्न है और संयोजक के दो संभव अर्थ हैं।
lexical_decisions:
- source_word: ἰδού
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले यूनानी उद्गार का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन का आत्मीय भाव बनाए रखता है; आधुनिक मानक हिन्दी में संबोधन-रूप ‘बच्चो’ स्वाभाविक है।
- source_word: ὑπέδειξα ὑμῖν
  choice: मैंने तुम्हें … के बारे में बता दिया है
  rationale: शाब्दिक ‘दिखाया’ यहाँ हिन्दी में अस्वाभाविक होता; क्रिया का आशय किसी बात को प्रकट या स्पष्ट कर देना है।
- source_word: καιροὺς ἐσχάτους
  choice: अन्त के समयों
  rationale: ἐσχάτους को बनाए रखते हुए बहुवचन καιρούς का भी प्रतिनिधित्व किया गया है, यद्यपि परामर्शार्थ अंग्रेज़ी पाठ में ‘last’ छूट गया है।
- source_word: πάντα
  choice: सब कुछ
  rationale: यूनानी में केवल ‘सब’/‘सब कुछ’ है; ‘ये सब बातें’ जैसा संकेतवाचक शब्द नहीं जोड़ा गया।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: स्थानवाचक ἐν का सीधा अनुवाद, बिना यह तय किए कि ‘इस्राएल’ भूमि, राष्ट्र या समुदाय में से विशेष रूप से किसे सूचित करता है।
theological_decisions:
- issue: ὅτι का संबंध और अर्थ
  choice: कि
  alternative: क्योंकि
  rationale: ὅτι को पूर्ववर्ती ‘बता दिया’ की विषय-वस्तु आरम्भ करने वाला माना गया है। ‘क्योंकि’ व्याकरणतः संभव है, पर इस संदर्भ में कथन का प्रवाह ‘कि’ के साथ अधिक स्वाभाविक है; पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ‘इस्राएल’ का आशय
  choice: इस्राएल
  alternative: इस्राएल देश / इस्राएली लोग
  rationale: मूल की वास्तविक व्यापकता बनाए रखने और किसी भौगोलिक या सामुदायिक व्याख्या को आरोपित न करने के लिए नाम को अनिर्दिष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अन्त के समयों’ में मूल का बहुवचन और अन्तकालीन संकेत दोनों सुरक्षित हैं; वाक्य की असामान्य संरचना को डैश द्वारा पठनीय बनाया गया है।
