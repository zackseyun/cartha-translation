  text: 7. Καὶ γὰρ⁴⁷ αἱ ἐντολαὶ τοῦ νόμου⁴⁸ διπλαῖ εἰσιν Γκαὶ¹⁴⁹ μετὰ τέχνης πληροῦνται⁵⁰.
