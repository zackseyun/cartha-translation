  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/007.yaml
  text: For the commandments of the law are twofold, and they are fulfilled with skill.
translation:
  language: hi
  text: क्योंकि व्यवस्था की आज्ञाएँ दोहरी हैं, और उनका पालन कुशलता से किया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαὶ τοῦ νόμου
  choice: व्यवस्था की आज्ञाएँ
  rationale: यह पदबंध ‘व्यवस्था से संबंधित आज्ञाओं’ को स्वाभाविक और पारंपरिक बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: διπλαῖ
  choice: दो प्रकार की
  rationale: शाब्दिक अर्थ ‘दोहरी’ है; संदर्भ में आज्ञाओं के दो पक्षों या वर्गों का संकेत है, इसलिए अस्पष्टता को अधिक खोले बिना ‘दो प्रकार की’ सहज हिन्दी है।
- source_word: μετὰ τέχνης
  choice: कुशलता से
  rationale: τέχνη यहाँ कला, कौशल या निपुण ढंग का बोध देता है; ‘कुशलता से’ मूल की संक्षिप्तता और व्यापकता बनाए रखता है।
- source_word: πληροῦνται
  choice: पूरा किया जाता है
  rationale: मध्यम/कर्मवाच्य रूप को कर्मवाच्य हिन्दी में रखा गया है; इससे आज्ञाओं को पूरा करने/पालन में परिणति तक पहुँचाने का भाव बना रहता है।
theological_decisions:
- issue: आज्ञाओं के ‘दो प्रकार’ होने का आशय
  choice: अर्थ को अव्याख्यायित रखा गया
  alternative: इसे स्पष्ट रूप से परमेश्वर और पड़ोसी के प्रति कर्तव्य, अथवा वचन और कर्म के दो पक्ष बताना
  rationale: यूनानी पद स्वयं इन दो प्रकारों की पहचान नहीं करता; किसी विशिष्ट धार्मिक व्याख्या को पाठ में जोड़ना उचित नहीं।
- issue: πληροῦνται का अर्थ
  choice: ‘पूरा किया जाता है’
  alternative: ‘पालन किया जाता है’
  rationale: ‘पालन’ आज्ञाओं के संदर्भ में स्वाभाविक है, पर ‘पूरा’ πληρόω के पूर्ति/पूर्णता वाले अर्थ को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। यूनानी γάρ और καί के बल को ‘क्योंकि’ तथा ‘भी’ से व्यक्त किया गया है; किसी पांडुलिपीय टिप्पणी की आवश्यकता नहीं समझी गई।
