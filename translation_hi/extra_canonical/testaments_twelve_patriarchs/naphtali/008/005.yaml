translation:
  language: hi
  text: जिस प्रकार कोई व्यक्ति किसी बच्चे को अच्छी तरह पालता-पोसता है, उसकी अच्छी स्मृति रहती है, उसी प्रकार अच्छे काम की भी परमेश्वर के यहाँ अच्छी स्मृति रहती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκθρέψῃ καλῶς
  choice: अच्छी तरह पालन-पोषण किया हो
  rationale: क्रिया में बच्चे को पालकर बड़ा करने का भाव है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थपूर्ण अभिव्यक्ति है।
- source_word: μνείαν ἔχει καλήν
  choice: उसकी अच्छी याद बनी रहती है
  rationale: यूनानी पद स्मरण या अच्छी स्मृति बने रहने का संकेत देता है। सर्वनाम की संभावित संदर्भ-अस्पष्टता को हिन्दी में यथासंभव बनाए रखा गया है।
- source_word: ἐπὶ τοῦ καλοῦ ἔργου
  choice: अच्छे काम की
  rationale: यहाँ ἔργον किसी अच्छे कर्म या कार्य को दर्शाता है; साधारण पाठक के लिए 'अच्छा काम' सहज है।
- source_word: μνήμη παρὰ Θεοῦ ἀγαθή
  choice: परमेश्वर के सामने अच्छी याद बनी रहती है
  rationale: παρὰ Θεοῦ को परमेश्वर की उपस्थिति या दृष्टि में स्मरण रहने के रूप में व्यक्त किया गया है, बिना यह तय किए कि इसका अर्थ केवल परमेश्वर द्वारा स्मरण किया जाना है।
theological_decisions:
- issue: परमेश्वर के साथ अच्छे काम के स्मरण का संबंध
  choice: परमेश्वर के सामने अच्छी याद
  alternative: परमेश्वर उसे भलाई से स्मरण करता है
  rationale: मूल का παρὰ Θεοῦ संबंध को कुछ खुला रखता है। चुना हुआ पाठ अच्छे कर्म के परमेश्वर के समक्ष स्मरण बने रहने का अर्थ देता है, पर किसी विशिष्ट प्रतिफल-सिद्धांत को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। मूल वाक्य की उपमा और दोनों खंडों की समानांतर संरचना सुरक्षित रखी गई है।
