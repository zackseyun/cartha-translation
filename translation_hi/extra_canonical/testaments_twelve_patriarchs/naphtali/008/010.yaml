source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. Γίνεσθε οὖν *σοφοὶ ἐν θεῷ, τέκνα μου⁶¹, καὶ φρόνιμοι, ἰδόντες⁶² τάξιν ἐντολῶν⁶³ αὐτοῦ⁶⁴ καὶ θεσμοὺς παντὸς πράγματος⁶⁵, ὅπως *ἀγαπήσει ὑμᾶς ὁ Κύριος⁶⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/010.yaml
  text: Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter, so that the Lord may love you.
translation:
  language: hi
  text: 10 इसलिए, मेरे बच्चो, परमेश्वर में बुद्धिमान और विवेकी बनो, उसकी आज्ञाओं के क्रम और हर बात के विधानों को देखते हुए, ताकि प्रभु तुमसे प्रेम करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφοὶ ἐν θεῷ
  choice: परमेश्वर में बुद्धिमान
  rationale: ἐν θεῷ के संबंधपरक और संभवतः आध्यात्मिक अर्थ को बिना विस्तार या व्याख्यात्मक जोड़ के सुरक्षित रखता है।
- source_word: φρόνιμοι
  choice: समझदार
  rationale: व्यावहारिक विवेक और सूझ-बूझ का स्वाभाविक आधुनिक हिन्दी रूप है तथा σοφοί से भेद बनाए रखता है।
- source_word: τάξιν ἐντολῶν αὐτοῦ
  choice: उसकी आज्ञाओं की व्यवस्था
  rationale: τάξις के क्रम, सुव्यवस्था या नियोजन के अर्थ को 'व्यवस्था' में समेटता है और स्रोत की संबंधवाचक रचना बनाए रखता है।
- source_word: θεσμοὺς παντὸς πράγματος
  choice: हर विषय के नियमों
  rationale: θεσμοί के स्थापित नियम/विधान के अर्थ तथा παντὸς πράγματος की व्यापकता को स्रोत-समीप और बोधगम्य ढंग से व्यक्त करता है।
- source_word: ἰδόντες
  choice: पहचानो
  rationale: शाब्दिक 'देखते हुए' के बजाय प्रसंगगत बोध—ध्यान देकर समझना या पहचानना—को सहज हिन्दी में व्यक्त करता है।
- source_word: ὅπως ἀγαπήσει ὑμᾶς ὁ Κύριος
  choice: ताकि प्रभु तुमसे प्रेम करे
  rationale: उद्देश्य/परिणाम सूचक ὅπως और aorist subjunctive की अनिर्धारित भाववाचकता को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर में बुद्धिमान होने का अर्थ
  choice: '''परमेश्वर में'' को यथावत संबंधपरक अभिव्यक्ति के रूप में रखा'
  alternative: '''परमेश्वर की बातों में'' या ''परमेश्वर के अनुसार'' बुद्धिमान'
  rationale: मूल ἐν θεῷ में निहित अस्पष्टता को किसी एक व्याख्या तक सीमित नहीं किया गया।
- issue: आज्ञापालन और प्रभु के प्रेम का संबंध
  choice: कारण/उद्देश्य सूचक वाक्य 'ताकि प्रभु तुमसे प्रेम करे' रखा
  alternative: '''और तब प्रभु तुमसे प्रेम करेगा'' या अनुग्रह-केंद्रित व्याख्यात्मक पुनर्लेखन'
  rationale: मूल पाठ की धार्मिक तनावपूर्ण अभिव्यक्ति को नरम या व्यवस्थित किए बिना ज्यों का त्यों सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट। संबोधन 'मेरे बच्चो' में मानक सम्बोधन रूप अपनाया गया है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया, जबकि तर्कसंबंध 'इसलिए' और 'ताकि' से स्पष्ट रखा गया है।
