source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/008.yaml
  text: For there is a time for a man to come together with a woman, and a time for self-control for his prayer.
translation:
  language: hi
  text: क्योंकि स्त्री के साथ सहवास करने का एक समय है, और अपनी प्रार्थना के लिए संयम रखने का भी एक समय है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνουσίας γυναικός
  choice: स्त्री के साथ सहवास करने
  rationale: συνουσία यहाँ स्त्री के साथ यौन/दाम्पत्य मिलन को सूचित करता है। ‘सहवास’ मूल अर्थ को स्पष्ट, संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐγκρατείας
  choice: संयम रखने
  rationale: ἐγκράτεια का अर्थ आत्म-संयम या अपनी इच्छाओं पर नियंत्रण है; इस प्रसंग में यह प्रार्थना हेतु दाम्पत्य संबंध से विरत रहने की ओर संकेत करता है, पर अनुवाद उस संकेत को व्याख्यात्मक रूप से अधिक स्पष्ट नहीं करता।
- source_word: εἰς προσευχὴν αὐτοῦ
  choice: अपनी प्रार्थना के लिए
  rationale: εἰς उद्देश्य को और αὐτοῦ कर्ता की अपनी प्रार्थना को दर्शाता है। हिन्दी में ‘अपनी’ अस्पष्ट यूनानी पुंलिंग सर्वनाम को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: प्रार्थना और दाम्पत्य सहवास के बीच संबंध
  choice: प्रार्थना के लिए संयम
  alternative: प्रार्थना के समय पूर्ण ब्रह्मचर्य
  rationale: मूल पाठ अवसरानुकूल संयम की बात करता है, स्थायी ब्रह्मचर्य की नहीं; इसलिए किसी कठोर तपस्वी सिद्धान्त को आरोपित नहीं किया गया।
- issue: αὐτοῦ का संदर्भ
  choice: अपनी प्रार्थना
  alternative: उसकी प्रार्थना
  rationale: यूनानी में सर्वनाम पुंलिंग एकवचन है और निकटवर्ती निहित पुरुष की ओर लौटता है। हिन्दी का आत्मवाचक ‘अपनी’ यही संबंध स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर ‘एक समय है ... एक समय है’ संरचना मूल के काल-विरोध को सुरक्षित रखती है।
