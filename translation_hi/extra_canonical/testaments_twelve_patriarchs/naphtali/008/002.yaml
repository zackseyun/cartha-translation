source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ὑμεῖς Γοὖν⁵, ἐντείλασθε τοῖς τέκνοις ὑμῶν⁶ ἵνα ἑνοῦνται τῷ Λευὶ καὶ τῷ⁷ Ἰούδα. Διὰ γὰρ †τοῦ Ἰούδα†⁸ ἀνατελεῖ⁹ ἡ¹⁰ σωτηρία¹¹ τῷ Ἰσραὴλ¹², καὶ ἐν †αὐτῷ¹³ εὐλογηθήσεται¹⁴ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/002.yaml
  text: And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.
translation:
  language: hi
  text: और तुम भी निश्चय ही अपने बच्चों को आज्ञा दो कि वे लेवी और यहूदा के साथ एकजुट रहें। क्योंकि यहूदा के द्वारा इस्राएल के लिए उद्धार उदित होगा, और उसी में याकूब को आशीष मिलेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: इसलिए तुम भी
  rationale: समाहारात्मक οὖν और बलसूचक ὑμεῖς का स्वाभाविक हिन्दी रूप; पांडुलिपि-पाठ Γοὖν में निहित सम्भावित ‘देखो’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐντείλασθε
  choice: आज्ञा देना
  rationale: आदेश देने के स्पष्ट अर्थ को बनाए रखते हुए वसीयतनुमा उपदेश के प्रसंग में स्वाभाविक हिन्दी।
- source_word: ἵνα ἑνοῦνται
  choice: कि वे ... एकजुट रहें
  rationale: ἑνόω के एकता/संयुक्तता के भाव को निरंतर निष्ठा के रूप में सहज ढंग से व्यक्त करता है।
- source_word: ἀνατελεῖ
  choice: उदित होगा
  rationale: क्रिया के शाब्दिक ‘उगने/उदय होने’ वाले बिंब को सुरक्षित रखता है, उसे केवल ‘आएगा’ नहीं बनाता।
- source_word: ἡ σωτηρία
  choice: उद्धार
  rationale: धार्मिक और सामुदायिक मुक्ति—दोनों की सम्भावना रखने वाला प्रचलित, गरिमापूर्ण शब्द।
- source_word: ἐν αὐτῷ εὐλογηθήσεται
  choice: उसी में ... आशीष पाएगा
  rationale: ἐν की वास्तविक अस्पष्टता और कर्मवाच्य अर्थ को बनाए रखता है; इसे ‘उसके द्वारा’ में नहीं बदलता।
theological_decisions:
- issue: यहूदा और उद्धार का सम्बन्ध
  choice: यहूदा के द्वारा इस्राएल के लिए उद्धार उदित होगा
  alternative: यहूदा से इस्राएल का उद्धारकर्ता उदित होगा
  rationale: यूनानी पाठ में कर्ता ‘उद्धार’ है, ‘उद्धारकर्ता’ नहीं; इसलिए सम्भावित मसीही संकेत को विस्तार देकर निश्चित नहीं किया गया।
- issue: αὐτῷ का पूर्वपद
  choice: उसी में
  alternative: उसमें/उसके द्वारा
  rationale: सर्वनाम सम्भवतः यहूदा की ओर संकेत करता है, पर ‘में’ का रूप माध्यम, प्रतिनिधित्व या संबंध के बीच की तनावपूर्ण अस्पष्टता बनाए रखता है।
- issue: याकूब का अर्थ
  choice: याकूब
  alternative: याकूब के वंशज
  rationale: मूल पाठ के व्यक्तिनाम को जस का तस रखा गया है; उसे व्याख्यात्मक रूप से राष्ट्र या वंश में विस्तृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, वसीयतनुमा उपदेशात्मक शैली। ‘एकजुट रहें’, ‘उदित होगा’ और ‘आशीष पाएगा’ साधारण पाठक के लिए बोधगम्य हैं तथा यूनानी पाठ के बिंब और धार्मिक तनाव को सुरक्षित रखते हैं।
