id: T12P.NAP.8.6
reference: Testament of Naphtali 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴², *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/006.yaml
  text: But the one who does not do good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.
translation:
  language: hi
  text: परन्तु जो भलाई नहीं करता, उसे स्वर्गदूत और मनुष्य शाप देंगे; उसके कारण अन्यजातियों के बीच परमेश्वर का अनादर होगा; शैतान उसे अपना ही पात्र मानता है; हर जंगली पशु उस पर अधिकार जमाएगा; और प्रभु उससे घृणा करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καλόν
  choice: भलाई
  rationale: यह यूनानी पद नैतिक रूप से अच्छे कार्य को सूचित करता है; ‘भलाई करना’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: καταράσονται
  choice: शाप देंगे
  rationale: भविष्यकाल और अभिशाप देने के स्पष्ट अर्थ, दोनों को बनाए रखता है।
- source_word: ἀδοξήσει
  choice: अनादर होगा
  rationale: यहाँ परमेश्वर की महिमा घटने अथवा अपमानित होने का भाव है; कर्मवाच्य हिन्दी उस आशय को सहज रूप से व्यक्त करती है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: अन्यजातियों के बीच
  rationale: ἔθνη के धार्मिक-साहित्यिक संदर्भ को सुरक्षित रखता है और केवल आधुनिक राष्ट्रों का अर्थ लेने से बचाता है।
- source_word: οἰκειοῦται
  choice: अपना ... मान लेगा
  rationale: क्रिया किसी को अपना बनाना या अपने अधिकार का मानना व्यक्त करती है; ‘दावा करेगा’ की अपेक्षा यह हिन्दी में अधिक सहज है।
- source_word: σκεῦος
  choice: पात्र
  rationale: व्यक्ति को किसी शक्ति के साधन अथवा उपकरण के रूप में दिखाने वाला पारंपरिक रूपक सुरक्षित रहता है।
- source_word: κατακυριεύσει αὐτῷ
  choice: उस पर अधिकार जमाएगा
  rationale: बलपूर्वक प्रभुत्व रखने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μισήσει
  choice: घृणा करेगा
  rationale: यूनानी क्रिया के प्रबल और स्पष्ट अर्थ को नरम किए बिना प्रस्तुत करता है।
theological_decisions:
- issue: ὁ Θεὸς ἀδοξήσει की वाच्यता और आशय
  choice: परमेश्वर का अनादर होगा
  alternative: परमेश्वर अपनी महिमा खोएगा
  rationale: पाठ का आशय यह है कि उस व्यक्ति के कारण राष्ट्रों के बीच परमेश्वर अपमानित होता है; चुना हुआ रूप परमेश्वर की अंतर्निहित महिमा के सचमुच नष्ट होने का अनावश्यक निष्कर्ष नहीं जोड़ता।
- issue: शैतान द्वारा व्यक्ति को अपना पात्र बनाने का रूपक
  choice: शैतान उसे अपना पात्र मान लेगा
  alternative: शैतान उस पर अपने पात्र के रूप में दावा करेगा
  rationale: स्वामित्व और साधन बनने—दोनों भावों को रखता है, पर किसी विशिष्ट सांप्रदायिक दुष्टात्मा-विज्ञान को नहीं जोड़ता।
- issue: प्रभु की घृणा का कठोर कथन
  choice: प्रभु उससे घृणा करेगा
  alternative: प्रभु उसे अस्वीकार करेगा
  rationale: μισήσει का स्पष्ट अर्थ ‘घृणा करेगा’ है; कठिन धर्मवैज्ञानिक तनाव को नरम करके ‘अस्वीकार’ नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का dignified, सुबोध धार्मिक गद्य; क्रमिक यूनानी वाक्य-संरचना को अर्धविरामों से स्पष्ट किया गया है। ‘परन्तु’, ‘अन्यजातियों’, ‘पात्र’ और ‘प्रभु’ जैसे शब्द पाठ की प्राचीन धार्मिक गरिमा रखते हैं, जबकि शेष वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
