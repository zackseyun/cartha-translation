source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. *Ἐὰν Γοὖν καὶ ὑμεῖς˥²³ ἐργάσησθε τὸ καλόν²⁴, εὐλογήσουσιν ὑμᾶς *οἱ ἄνθρωποι καὶ οἱ ἄγγελοι²⁵, καὶ ὁ²⁶ Θεὸς δοξασθήσεται ἐν τοῖς ἔθνεσιν *διʼ ὑμῶν²⁷, καὶ ὁ διάβολος φεύξεται ἀφʼ ὑμῶν, Γκαὶ τὰ θηρία φοβηθήσονται ὑμᾶς˥²⁸, *καὶ ὁ Κύριος ἀγαπήσει ὑμᾶς²⁹, [καὶ οἱ ἄγγελοι ἀνθέξονται ὑμῶν]³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/004.yaml
  text: Therefore, if you also do what is good, people and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.
translation:
  language: hi
  text: इसलिए, यदि तुम भी जो भला है वह करोगे, तो लोग और स्वर्गदूत तुम्हें आशीष देंगे; तुम्हारे द्वारा राष्ट्रों में परमेश्वर की महिमा होगी; शैतान तुमसे दूर भाग जाएगा; जंगली पशु तुमसे डरेंगे; प्रभु तुमसे प्रेम करेगा; और स्वर्गदूत तुम्हारा साथ देंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम वाक्यांश, “और स्वर्गदूत तुम्हारा साथ देंगे,” इस यूनानी संस्करण में कोष्ठकों में दिया गया है; इसकी पाठगत स्थिति अनिश्चित है।
    reason: स्रोत-संस्करण अंतिम यूनानी उपवाक्य को वर्ग कोष्ठकों में रखता है; इसलिए उसकी पाठगत अनिश्चितता बताना आवश्यक है।
lexical_decisions:
- source_word: ἐργάσησθε τὸ καλόν
  choice: भलाई करोगे
  rationale: यह यूनानी पदबंध के ‘जो अच्छा है उसे करना’ वाले नैतिक अर्थ को सहज और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἄνθρωποι
  choice: लोग
  rationale: यह ἄνθρωποι का स्वाभाविक, समावेशी अर्थ देता है; ‘पुरुष’ कहना अनावश्यक रूप से अर्थ को सीमित करता।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: जाति-जाति के लोगों के बीच
  rationale: ἔθνη यहाँ अनेक गैर-इस्राएली राष्ट्रों अथवा जनसमुदायों को सूचित कर सकता है; यह चयन ‘जातियों में’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है और बहुवचन की व्यापकता बनाए रखता है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: आधुनिक हिन्दी बाइबलीय भाषा में यह विरोधी दुष्ट सत्ता के लिए सर्वाधिक परिचित और स्वाभाविक पद है।
- source_word: τὰ θηρία
  choice: जंगली पशु
  rationale: यह θηρία के वन्य और संभावित रूप से हिंसक पशुओं वाले अर्थ को स्पष्ट करता है।
- source_word: ἀνθέξονται ὑμῶν
  choice: तुम्हारा साथ देंगे
  rationale: ἀντέχομαι के ‘थामे रहना, सहारा देना, साथ निभाना’ अर्थ को मुहावरेदार हिन्दी में व्यक्त करता है; केवल शारीरिक रूप से ‘खड़े रहने’ का अर्थ नहीं थोपा गया।
theological_decisions:
- issue: परमेश्वर की महिमा का कर्मवाच्य कथन
  choice: परमेश्वर की महिमा होगी
  alternative: लोग परमेश्वर की महिमा करेंगे
  rationale: मूल δοξασθήσεται कर्मवाच्य है और महिमा करने वाले कर्ता को स्पष्ट नहीं करता; हिन्दी में भी उस खुलापन को बनाए रखा गया है।
- issue: θεός और κύριος के संबोधन
  choice: परमेश्वर और प्रभु
  alternative: दोनों स्थानों पर परमेश्वर
  rationale: मूल पाठ के अलग-अलग पद Θεός और Κύριος सुरक्षित रखे गए हैं; ‘प्रभु’ का विशिष्ट संदर्भ कौन है, इसे अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बहुवचन ‘तुम’ का प्रयोग वंशजों/समुदाय को संबोधित करने वाले प्रसंग के अनुकूल है। समानांतर भविष्यकालीन उपवाक्यों को अर्धविरामों से जोड़ा गया है ताकि मूल की क्रमिक लय बनी रहे।
