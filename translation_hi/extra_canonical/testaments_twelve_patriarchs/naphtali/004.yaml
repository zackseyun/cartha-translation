base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004.yaml
  text: These things I say to you[a], my children, because I learned from the writing of Enoch that you also will surely depart from the Lord, walking in every lawlessness of the nations and doing all the wickedness of Sodom. And the Lord will bring captivity upon you, and there you will serve your enemies and the land will be laid waste and your holy places will be desolate. And you will be scattered to the four corners of the earth, and you will be as something despised among the nations, a curse and a dispersion, until the Most High visits the earth. He himself will come, saving Israel and all the nations, God speaking in the person of man. And after he has entered, unrighteousness will again increase upon the earth, and all the nations will be gathered against him. But whoever believes in him shall not be condemned in his name. And you, my children, shall rise up from your tribes with Levi and Judah; and there shall be war among you. And the Lord will be seen among men, and he will save
    Israel and all the nations. Therefore do not be divided into two heads, because every division among brothers is evil in the sight of the Lord. For the Lord loves singleness of purpose. And if you also walk in singleness of purpose according to his law[b], my children, no evil spirit will have power over you. For he knows that the God of heaven is one, and he will not accept a divided mind. Love the Lord through all your life[c], and one another with a true heart.
translation:
  language: hi
  text: '**नप्ताली का वसीयतनामा 4**


    **1** मेरे बच्चो, मैं तुमसे ये बातें इसलिए कहता हूँ कि मैंने हनोक के लेख[a] से यह जाना है कि तुम भी निश्चय ही प्रभु से दूर हो जाओगे। तुम जातियों के हर प्रकार के अधर्म के अनुसार चलोगे और सदोम की सारी दुष्टता करोगे।


    **2** और प्रभु तुम्हें बंदी बनाकर ले जाएगा। वहाँ तुम अपने शत्रुओं की सेवा करोगे और हर प्रकार के दुर्व्यवहार और क्लेश सहते रहोगे[b], जब तक प्रभु तुम सबको नष्ट न कर दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हनोक के लेख’ से हनोक से संबद्ध किसी पुस्तक या लिखित परंपरा का संकेत हो सकता है। केवल इस पदावली से उस लेख की धर्मग्रंथ-सूची संबंधी स्थिति तय नहीं होती।
    reason: cultural_note
  - marker: b
    text: इस वाक्य के ग्रीक पाठ में कुछ शब्द पाठालोचन की दृष्टि से अनिश्चित हैं, विशेषकर ‘वहाँ’ और ‘सहते रहोगे’। समग्र अर्थ शत्रुओं के अधीन दुर्व्यवहार और क्लेश सहने का है।
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: मैंने ... जाना है
  rationale: क्रिया उस ज्ञान को व्यक्त करती है जो हनोक से संबद्ध लेख के माध्यम से प्राप्त हुआ; यह हिन्दी में स्वाभाविक रहते हुए ‘जान लिया’ या केवल ‘जानता था’ से अधिक उपयुक्त है।
- source_word: γραφῇ Ἐνώχ
  choice: हनोक के लेख
  rationale: ‘लेख’ किसी लिखित रचना या परंपरा का संकेत देता है, पर ‘पवित्रशास्त्र’ कहकर उसकी धर्मग्रंथ-सूची संबंधी स्थिति पहले से तय नहीं करता।
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: प्रभु से दूर हो जाओगे
  rationale: यह प्रभु से विमुख होने का भाव रखता है और बाद की तकनीकी धार्मिक शब्दावली आरोपित किए बिना संबंध-विच्छेद की गंभीरता व्यक्त करता है।
- source_word: ἀνομίαν
  choice: अधर्म
  rationale: यह दैवी व्यवस्था के उल्लंघन और नैतिक विद्रोह, दोनों का परिचित और गंभीर हिन्दी रूप है।
- source_word: πονηρίαν
  choice: दुष्टता
  rationale: सदोम से जुड़ी नैतिक बुराई को स्पष्ट करता है, पर उसके स्वरूप को पाठ से अधिक विशिष्ट नहीं बनाता।
- source_word: αἰχμαλωσίαν
  choice: बंदी बनाए जाने की दशा
  rationale: यह राष्ट्रीय पराजय, बंदीकरण और निर्वासन के अर्थ-क्षेत्र को रखता है; केवल ‘निर्वासन’ कहने की अपेक्षा मूल शब्द के बंदीपन को अधिक स्पष्ट करता है।
- source_word: κακώσει
  choice: दुर्व्यवहार
  rationale: शब्द कष्ट पहुँचाने, उत्पीड़न या दयनीय दशा का अर्थ दे सकता है; संदर्भ में ‘दुर्व्यवहार’ शत्रुओं के अधीन भोगी जाने वाली पीड़ा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θλίψει
  choice: क्लेश
  rationale: यह दबाव, संकट और पीड़ा की गंभीरता को संक्षिप्त तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: συναναστραφήσεσθε
  choice: के बीच जीवन बिताओगे
  rationale: कठिन पाठ में क्रिया का मूल भाव किसी दशा या संगति के बीच रहने-चलने का है; यह अनिश्चित वाक्य-संबंध को अनावश्यक रूप से विशिष्ट नहीं करता।
- source_word: ἀναλώσει
  choice: सर्वनाश न कर दे
  rationale: क्रिया ‘भस्म कर देना’, ‘समाप्त कर देना’ या ‘नष्ट कर देना’ व्यक्त कर सकती है। ‘सर्वनाश’ πάντας के साथ चेतावनी की कठोरता बनाए रखता है।
theological_decisions:
- issue: हनोक से संबद्ध लेख का प्रामाणिक स्थान
  choice: ‘हनोक के लेख’ कहा गया है।
  alternative: ‘हनोक की पवित्रशास्त्र-पुस्तक’ या ‘हनोक की पुस्तक’
  rationale: γραφή लिखित रचना अथवा धर्मग्रंथ दोनों का संकेत दे सकता है। अनुवाद साहित्यिक संदर्भ को रखता है, पर धर्मग्रंथ-सूची संबंधी निष्कर्ष नहीं थोपता।
- issue: प्रभु से भावी विमुखता की निश्चितता
  choice: ‘तुम भी निश्चय ही प्रभु से दूर हो जाओगे’
  alternative: ‘तुम प्रभु को छोड़ सकते हो’
  rationale: ग्रीक का भविष्यकाल और καίγε का बल इसे संभावना नहीं, दृढ़ भविष्यवाणी के रूप में प्रस्तुत करते हैं।
- issue: दैवी न्याय की अंतिम कठोरता
  choice: ‘जब तक प्रभु तुम सबका सर्वनाश न कर दे’
  alternative: ‘जब तक प्रभु तुम्हारे कष्ट समाप्त न कर दे’
  rationale: ἀναλίσκω का कर्ता प्रभु और कर्म ‘तुम सब’ हैं। कठोर कथन को उद्धारमूलक अर्थ देकर नरम करना मूल पाठ की दिशा उलट देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। संबोधन ‘मेरे बच्चो’ पारिवारिक वसीयतनामा-स्वर बनाए रखता है। उपलब्ध मूल-भाषा स्रोत केवल अध्याय 4:1-2 के इस अंश तक है; इसलिए परामर्शार्थ दिए गए अंग्रेज़ी पाठ की बाद की, ग्रीक स्रोत में अनुपस्थित सामग्री को मसौदे में शामिल नहीं किया गया।
