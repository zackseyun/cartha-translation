  text: '1[a]. For in the fortieth year of my life I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still.


    2. And behold, Isaac, the father of my father, said to us, “Run up and let each of you seize them according to his strength; and the one who takes hold of them, his shall be the sun and the moon.”


    3. And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.


    4. And while Levi was like the sun, behold, a certain young man was giving him twelve palm branches[b]; and Judah became bright like the moon, and beneath their feet were twelve rays.


    5. And the two, Levi and Judah, ran up and held them fast.


    6. And behold, there was a bull on the earth, having two great horns and eagle’s wings on its back; and though we wanted to seize it, we were not able.


    7. But Joseph came and took hold of it, and went up with it to the height.


    8. And I saw that I was there, and behold, a holy writing appeared to us, saying: “Assyrians, Medes, Persians,”'
translation:
  language: hi
  text: '**नप्ताली का वसीयतनामा 5**


    **1.** क्योंकि अपने जीवन के चालीसवें वर्ष में मैंने यरूशलेम के पूर्व में जैतून पर्वत पर एक दर्शन देखा कि सूर्य और चन्द्रमा स्थिर खड़े थे।


    **2.** और देखो, मेरे पिता के पिता इसहाक ने हमसे कहा, “दौड़कर पास जाओ और तुममें से हर एक अपनी सामर्थ्य के अनुसार उन्हें पकड़ ले; और जो उन्हें पकड़ लेगा, सूर्य और चन्द्रमा उसके होंगे।”


    **3.** तब हम सब एक साथ दौड़े। लेवी ने सूर्य को पकड़ लिया, और यहूदा ने पहले पहुँचकर चन्द्रमा को थाम लिया; और वे दोनों उनके साथ ऊपर उठा लिए गए।


    **4.** जब लेवी सूर्य के समान था, तब देखो, एक युवक उसे खजूर की बारह डालियाँ दे रहा था। और यहूदा चन्द्रमा के समान उज्ज्वल हो गया, और उनके पैरों के नीचे बारह किरणें थीं।


    **5.** और उन दोनों ने—लेवी और यहूदा ने—दौड़कर पास जाकर उन्हें कसकर पकड़ लिया।[a]


    **6.** और देखो, पृथ्वी पर एक बैल था। उसके दो बड़े सींग थे और उसकी पीठ पर उकाब के पंख थे। हम उसे पकड़ना चाहते थे, पर पकड़ न सके।


    **7.** परन्तु यूसुफ ने आकर उसे पकड़ लिया और उसके साथ ऊँचाई पर चढ़ गया।


    **8.** फिर मैंने देखा कि मैं पास ही था। और देखो, एक पवित्र लेख हमें दिखाई दिया, जिसमें लिखा था, “अश्शूरी, मादी, फ़ारसी, कसदी और अरामी इस्राएल के बारह राजदंडों को बंदी अवस्था में अपने अधिकार में लेंगे।”[b]


    [a] यह वाक्य उपलब्ध यूनानी पाठ में व्याकरण की दृष्टि से असहज है और सम्भवतः लेवी तथा यहूदा की प्रमुखता दोहराने वाली पुनरुक्त या बाद में जोड़ी गई पंक्ति है।


    [b] यूनानी में “बंदी अवस्था,” “अपने अधिकार में लेंगे” और “बारह राजदंडों” का सम्बन्ध कुछ असामान्य है। “बारह राजदंड” सम्भवतः इस्राएल के बारह गोत्रों के लिए प्रतीकात्मक अभिव्यक्ति है। कुछ परामर्श-पाठ “अश्शूरी, मादी, फ़ारसी” के बाद रुक जाते हैं, पर यहाँ दिए गए यूनानी पाठ में वाक्य आगे चलता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य उपलब्ध यूनानी पाठ में व्याकरण की दृष्टि से असहज है और सम्भवतः लेवी तथा यहूदा की प्रमुखता दोहराने वाली पुनरुक्त या बाद में जोड़ी गई पंक्ति है।
    reason: textual_variant
  - marker: b
    text: यूनानी में “बंदी अवस्था,” “अपने अधिकार में लेंगे” और “बारह राजदंडों” का सम्बन्ध कुछ असामान्य है। “बारह राजदंड” सम्भवतः इस्राएल के बारह गोत्रों के लिए प्रतीकात्मक अभिव्यक्ति है। कुछ परामर्श-पाठ “अश्शूरी, मादी, फ़ारसी” के बाद रुक जाते हैं, पर यहाँ दिए गए यूनानी पाठ में वाक्य आगे चलता है।
    reason: textual_and_translation_difficulty
lexical_decisions:
- source_word: ὄραμα
  choice: दर्शन
  rationale: प्रकाशनात्मक दृश्य के लिए आधुनिक हिन्दी का स्वाभाविक और स्थापित शब्द; सामान्य ‘दृश्य’ की अपेक्षा प्रसंग के अनुरूप।
- source_word: ἕστηκαν
  choice: स्थिर खड़े थे
  rationale: पूर्णकालिक रूप दृश्य में सूर्य और चन्द्रमा की स्थिर अवस्था पर बल देता है।
- source_word: Προσδραμόντες
  choice: दौड़कर पास जाओ
  rationale: आदेश की गतिशीलता और निकट पहुँचने, दोनों भावों को सुरक्षित रखता है।
- source_word: κρατήσατε
  choice: पकड़ ले
  rationale: बलपूर्वक थामने की प्रतिस्पर्धात्मक छवि रखता है, पर हिन्दी में अनावश्यक हिंसक अर्थ नहीं जोड़ता।
- source_word: κατὰ δύναμιν
  choice: अपनी सामर्थ्य के अनुसार
  rationale: हर भाई की अलग क्षमता पर दिए गए वितरणात्मक बल को बनाए रखता है।
- source_word: φθάσας
  choice: पहले पहुँचकर
  rationale: चन्द्रमा को थामने में यहूदा की अग्रता को सीधे व्यक्त करता है।
- source_word: ὑψώθησαν
  choice: ऊपर उठा लिए गए
  rationale: पहले स्थानिक अर्थ को रखता है और प्रतीकात्मक उत्कर्ष की सम्भावना को खुला छोड़ता है।
- source_word: βαΐα φοινίκων
  choice: खजूर की बारह डालियाँ
  rationale: ठोस वनस्पतिक छवि को साधारण हिन्दी में स्पष्ट करता है।
- source_word: ἀκτῖνες
  choice: किरणें
  rationale: सूर्य-चन्द्रमा के आलोक-संबंधी प्रतीक के लिए सबसे स्वाभाविक हिन्दी शब्द।
- source_word: κατέλαβεν
  choice: पकड़ लिया
  rationale: यूसुफ द्वारा बैल पर सफल अधिकार को दर्शाता है, बिना ‘झपट लिया’ जैसे अधिक हिंसक भाव के।
- source_word: γραφὴ ἁγία
  choice: एक पवित्र लेख
  rationale: यूनानी पद अनिश्चित और दर्शनात्मक है; ‘पवित्रशास्त्र’ कहने से बाद की निश्चित कैननिक धारणा अनावश्यक रूप से जुड़ सकती है।
- source_word: σκῆπτρα
  choice: राजदंडों
  rationale: मूल प्रतीक को अनूदित रखा गया है; इसे मुख्य पाठ में सीधे ‘गोत्र’ बनाकर व्याख्यायित नहीं किया गया।
- source_word: κληρονομήσουσιν αἰχμαλωσίαν
  choice: बंदी अवस्था में अपने अधिकार में लेंगे
  rationale: असामान्य दोहरे कर्मवाचक विन्यास का सम्भावित अधिकार/अधिग्रहण अर्थ देता है और उसकी कठिनता को पादटिप्पणी में स्वीकार करता है।
theological_decisions:
- issue: दर्शन में लेवी और यहूदा का प्रतीकात्मक पद
  choice: सूर्य, चन्द्रमा, डालियों और किरणों की छवियों को बिना व्याख्यात्मक पहचान जोड़े सीधे अनूदित किया गया।
  alternative: लेवी को याजकीय और यहूदा को राजकीय सर्वोच्चता का स्पष्ट प्रतीक बताना।
  rationale: यह अंश प्रतीक दिखाता है, पर स्वयं उसका निश्चित धार्मिक अर्थ नहीं बताता; अनुवाद को उस मौन का सम्मान करना चाहिए।
- issue: γραφὴ ἁγία की धार्मिक स्थिति
  choice: एक पवित्र लेख
  alternative: पवित्रशास्त्र
  rationale: अनिश्चित यूनानी संज्ञा किसी दर्शन में प्रकट लेख को सूचित करती है; इसे निश्चित कैननिक ग्रन्थ कहना मूल से अधिक विशिष्ट होगा।
- issue: इस्राएल के बारह राजदंड
  choice: मुख्य पाठ में प्रतीकात्मक ‘राजदंड’ बनाए रखे और सम्भावित ‘बारह गोत्र’ अर्थ को पादटिप्पणी में रखा।
  alternative: मुख्य पाठ में ‘इस्राएल के बारह गोत्र’ लिखना।
  rationale: मूल रूपक को बचाते हुए पाठक को सम्भावित आशय बताया गया है, पर व्याख्या को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल कथात्मक शैली रखी गई है। ‘देखो’ से यूनानी ἰδού की दृश्यात्मकता, तथा ‘पकड़ना/थामना’ से बार-बार आने वाली ग्रहण-क्रिया सुरक्षित रखी गई है। व्यक्तिनामों और जातिनामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
