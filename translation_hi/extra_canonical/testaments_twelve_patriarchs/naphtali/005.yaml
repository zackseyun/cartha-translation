  verdict: revise
  source_fidelity: संशोधन आवश्यक है। 5:8 में दिए गए यूनानी साक्ष्य में राष्ट्रों की पूरी सूची तथा ‘इस्राएल के बारह राजदंड’ तक का वाक्य मौजूद है; इसलिए हिन्दी मुख्य पाठ का इसे शामिल करना सही है, पर अंग्रेज़ी audit trail का इसके विपरीत कट जाने का दावा इस साक्ष्य से मेल नहीं खाता। Σύροι का अर्थ ‘सीरियाई’ है, ‘अरामी’ नहीं।
  naturalness: भाषा सामान्यतः स्पष्ट और आधुनिक है। ‘मैं पास ही था’ की अपेक्षा παρεκεῖ के लिए ‘मैं वहाँ था’ अधिक सीधा है। 5:8 का यूनानी वाक्य-विन्यास असामान्य है; मुख्य पाठ में उसकी विचित्रता को यथासंभव सुरक्षित रखते हुए पादटिप्पणी में स्पष्ट करना उचित है।
  terminology: ‘दर्शन’, ‘पवित्र लेख’, ‘राजदंड’, ‘लेवी’, ‘यहूदा’, और ‘यूसुफ’ उपयुक्त हैं। βαΐα φοινίκων के लिए ‘खजूर की डालियाँ’ स्वीकार्य है। Σύροι को ‘सीरियाई’ किया गया है।
  issues:
  - severity: high
    issue: 5:8 में Σύροι का अनुवाद ‘अरामी’ किया गया है।
    rationale: यूनानी Σύροι सामान्यतः Syrians/सीरियाई है; अरामी के लिए अलग जातिनाम अपेक्षित होता।
