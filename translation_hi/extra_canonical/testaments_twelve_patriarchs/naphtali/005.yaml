  revised_text: '**नप्ताली का वसीयतनामा 5**


    **1.** क्योंकि अपने जीवन के चालीसवें वर्ष में मैंने यरूशलेम के पूर्व में जैतून पर्वत पर एक दर्शन देखा कि सूर्य और चन्द्रमा स्थिर खड़े थे।


    **2.** और देखो, मेरे पिता के पिता इसहाक ने हमसे कहा, “दौड़कर पास जाओ और तुममें से हर एक अपनी सामर्थ्य के अनुसार उन्हें पकड़ ले; और जो उन्हें पकड़ लेगा, सूर्य और चन्द्रमा उसके होंगे।”


    **3.** तब हम सब एक साथ दौड़े। लेवी ने सूर्य को पकड़ लिया, और यहूदा ने पहले पहुँचकर चन्द्रमा को थाम लिया; और वे दोनों उनके साथ ऊपर उठा लिए गए।


    **4.** जब लेवी सूर्य के समान था, तब देखो, एक युवक उसे खजूर की बारह डालियाँ दे रहा था। और यहूदा चन्द्रमा के समान उज्ज्वल हो गया, और उनके पैरों के नीचे बारह किरणें थीं।


    **5.** और उन दोनों ने—लेवी और यहूदा ने—दौड़कर पास जाकर उन्हें कसकर पकड़ लिया।[a]


    **6.** और देखो, पृथ्वी पर एक बैल था। उसके दो बड़े सींग थे और उसकी पीठ पर उकाब के पंख थे। हम उसे पकड़ना चाहते थे, पर पकड़ न सके।


    **7.** परन्तु यूसुफ ने आकर उसे पकड़ लिया और उसके साथ ऊँचाई पर चढ़ गया।


    **8.** फिर मैंने देखा कि मैं वहाँ था। और देखो, एक पवित्र लेख हमें दिखाई दिया, जो कह रहा था, “अश्शूरी, मादी, फ़ारसी, कल्दी और सीरियाई इस्राएल के बारह राजदंडों को बंदीपन के रूप में विरासत में पाएँगे।”[b]'
