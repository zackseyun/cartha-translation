translation:
  language: hi
  text: परन्तु लेवी टाट ओढ़े हुए प्रभु से प्रार्थना कर रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβαλλόμενος σάκκον
  choice: टाट ओढ़े हुए
  rationale: यह यूनानी पद शोक, दीनता या पश्चात्ताप के चिह्न के रूप में खुरदरा टाट शरीर पर धारण करने को व्यक्त करता है; ‘ओढ़े हुए’ हिन्दी में स्वाभाविक रहते हुए उस दृश्य को बनाए रखता है।
- source_word: ἐδέετο
  choice: प्रार्थना कर रहा था
  rationale: क्रिया का अपूर्णकाल जारी विनती या प्रार्थना का भाव देता है; हिन्दी का अपूर्ण प्रगतिशील रूप इसे व्यक्त करता है।
- source_word: τοῦ Κυρίου
  choice: प्रभु से
  rationale: δέομαι के साथ संबंधकारक उस व्यक्ति को सूचित करता है जिससे विनती की जाती है; इसलिए हिन्दी में ‘प्रभु से’ स्वाभाविक और अर्थसंगत है।
theological_decisions:
- issue: प्रार्थना का संबोधन
  choice: प्रभु से
  alternative: प्रभु की प्रार्थना
  rationale: यूनानी वाक्य स्पष्ट रूप से प्रभु को विनती के प्राप्तकर्ता के रूप में रखता है; यह अनुवाद बिना अतिरिक्त धार्मिक व्याख्या जोड़े वही संबंध प्रकट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘टाट’ बाइबलीय शोक-वस्त्र के सांस्कृतिक अर्थ को बनाए रखता है।
