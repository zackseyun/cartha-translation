  text: VI. *Καὶ πάλιν¹ μετὰ ἡμέρας² ἑπτὰ εἶδον *ὅτι ὁ πατὴρ μου Ἰακὼβ ἴστατο³ ἐν τῇ θαλάσσῃ Ἀμνείας⁴, καὶ ἡμεῖς⁵ σὺν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/001.yaml
  text: And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him.
translation:
  language: hi
  text: और फिर, सात दिन बाद, मैंने देखा कि मेरे पिता याकूब अम्निया[a] के समुद्र में खड़े थे, और हम उनके साथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अम्निया’ नामक स्थान की पहचान अनिश्चित है; किसी स्थान का अनुमान लगाने के बजाय यहाँ यूनानी नाम का लिप्यंतरण रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: पुनरावृत्ति का सामान्य और स्वाभाविक हिन्दी संकेत।
- source_word: μετὰ ἡμέρας ἑπτὰ
  choice: सात दिन बाद
  rationale: यूनानी काल-सूचक वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἐν τῇ θαλάσσῃ Ἀμνείας
  choice: अम्निया के समुद्र में
  rationale: ἐν के स्थान-संबंधी अर्थ और अनिश्चित स्थान-नाम Ἀμνείας, दोनों को बिना अनुमान लगाए सुरक्षित रखता है।
- source_word: ἴστατο
  choice: खड़े थे
  rationale: क्रिया के अपूर्णकालीन, दृश्य में जारी अवस्था-सूचक भाव को व्यक्त करता है।
- source_word: ἡμεῖς σὺν αὐτῷ
  choice: हम उनके साथ थे
  rationale: स्पष्ट सर्वनाम ‘हम’ तथा साथ होने के संबंध को सहज हिन्दी में बनाए रखता है।
