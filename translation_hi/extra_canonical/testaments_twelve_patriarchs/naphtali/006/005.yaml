  text: And we, being storm-tossed on the sea, were being driven over the waters, and the ship was filled and battered in the storms, so that it was in danger of breaking apart.
translation:
  language: hi
  text: और हम समुद्र में तूफ़ान से झकझोरे जाते हुए बहाए जा रहे थे, और जहाज़ पानी से भर गया था तथा तूफ़ानी लहरों में चारों ओर से पटक रहा था, इतना कि वह टूटने के खतरे में था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμαζόμενοι
  choice: तूफ़ान से घिरकर
  rationale: यह कृदन्त तूफ़ान से बुरी तरह प्रभावित होने या झकझोरे जाने का भाव देता है; सहज हिन्दी में परिस्थिति को स्पष्ट करता है।
- source_word: ἐπὶ τὸ πέλαγος
  choice: समुद्र में
  rationale: πέλαγος खुले या गहरे समुद्र को सूचित करता है; यहाँ सामान्य पाठक के लिए स्वाभाविक 'समुद्र में' उपयुक्त है।
- source_word: ἐφερόμεθα
  choice: बहते चले जा रहे थे
  rationale: 'अपूर्णकाल का निरन्तर और निष्क्रिय भाव सुरक्षित है: वे स्वयं दिशा नहीं दे रहे थे, बल्कि बहाए जा रहे थे।'
- source_word: ἐπληρώθη τὸ πλοῖον ὑδάτων
  choice: जहाज़ पानी से भर गया था
  rationale: यूनानी संबंधकारक ὑδάτων को स्वाभाविक हिन्दी में 'पानी से' व्यक्त किया गया है।
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: प्रचण्ड लहरों में चारों ओर से टकरा रहा था
  rationale: τρικυμία उग्र समुद्री हलचल/ऊँची लहरों और περιρήσσω चारों ओर से पटकने या टकराने का चित्र प्रस्तुत करते हैं।
- source_word: ὥστε καὶ συντρίβεσθαι αὐτό
  choice: यहाँ तक कि वह टूटने लगा
  rationale: परिणामसूचक ὥστε और वर्तमान निष्क्रिय infinitive जहाज़ के टूटने की आरम्भिक/चलती प्रक्रिया व्यक्त करते हैं; केवल सम्भावित खतरे की अपेक्षा यह मूल पाठ के अधिक निकट है।
