translation:
  language: hi
  text: और हम सब पृथ्वी के छोरों तक तितर-बितर हो गए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ‘पृथ्वी के छोरों तक’ तितर-बितर होना व्यापक बिखराव का प्रतीक भी हो सकता है, यद्यपि पाठ इसे नप्ताली के स्वप्न के एक भाग के रूप में प्रस्तुत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: διεσπάρημεν
  choice: तितर-बितर हो गए
  rationale: यह यूनानी निष्क्रिय क्रिया के बिखराव/वितरण के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: πάντες
  choice: हम सब
  rationale: क्रिया में निहित प्रथम पुरुष बहुवचन और πάντες के समावेशी बल को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: पृथ्वी के छोरों तक
  rationale: मूल स्थानिक रूपक और उसकी संभावित प्रतीकात्मक व्यापकता—दोनों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: बिखराव का कारक और उसका प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में कारक को अनिर्दिष्ट रखा गया और ‘पृथ्वी के छोरों तक’ का रूपक ज्यों का त्यों रखा गया।
  alternative: ‘हमें पृथ्वी भर में निर्वासित कर दिया गया’ या मुख्य पाठ में इसे केवल प्रतीकात्मक प्रवास बताना।
  rationale: यूनानी निष्क्रिय रूप कारक नहीं बताता, और वाक्य स्वप्न के भीतर घटना प्रस्तुत करता है; इसलिए निर्वासन या प्रतीकवाद को मुख्य पाठ में निश्चित करना मूल की अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के संक्षिप्त कथन के अनुरूप। ‘धरती’ की अपेक्षा ‘पृथ्वी’ चुना गया ताकि वसीयतनुमा साहित्यिक प्रसंग का गरिमापूर्ण स्वर बना रहे।
