lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथात्मक विस्मय और ध्यानाकर्षण को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ πατὴρ ἡμῶν
  choice: हमारे पिता
  rationale: यूनानी संबंधसूचक पदबंध का सीधा और स्पष्ट अनुवाद।
- source_word: πάντες
  choice: हम सबने
  rationale: समूह के प्रत्येक सदस्य की सहभागिता को स्पष्ट रखता है।
- source_word: ὁμοθυμαδὸν
  choice: एक मन होकर
  rationale: साझी भावना और एकमतता का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἠγαλλιασάμεθα
  choice: आनन्द मनाया
  rationale: क्रिया के तीव्र, सामूहिक हर्ष के अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नवीनतम अंग्रेज़ी संशोधन में जोड़ा गया वाक्य “He pleaded with us”
  choice: इसे शामिल नहीं किया गया
  alternative: “उन्होंने हमसे विनती की।” जोड़ना
  rationale: प्रस्तुत यूनानी मूलपाठ इस पद में केवल पिता के आने और सबके एक मन होकर आनन्दित होने की बात कहता है; जोड़ा गया अंतिम वाक्य उपलब्ध स्रोत-साक्ष्य में नहीं है।
