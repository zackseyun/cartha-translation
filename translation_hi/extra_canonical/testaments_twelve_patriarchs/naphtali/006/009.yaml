  text: And when the winter ceased, the ship came to the land, as it were in peace.
translation:
  language: hi
  text: और जब शीतकाल समाप्त हुआ[a], तब जहाज़ मानो शांति से भूमि पर आ पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘शीतकाल’ है, पर समुद्री संदर्भ में यह ‘तूफ़ानी मौसम’ भी सूचित कर सकता है।
    reason: मूल शब्द की वास्तविक अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: χειμών
  choice: शीतकाल
  rationale: इस शब्द का मूल अर्थ ‘शीतकाल’ है, यद्यपि समुद्री संदर्भ में यह तूफ़ानी मौसम का भी संकेत दे सकता है। यहाँ स्रोत और परामर्श-पाठ के निकट रहते हुए ‘शीतकाल’ रखा गया है।
- source_word: σκάφος
  choice: जहाज़
  rationale: नाव या पोत के लिए सामान्य और आधुनिक हिन्दी शब्द, जो इस समुद्री प्रसंग में स्वाभाविक है।
- source_word: ἔφθασε ... ἐπὶ τῆς γῆς
  choice: भूमि पर आ पहुँचा
  rationale: गंतव्य तक पहुँचने का भाव स्पष्ट करते हुए यूनानी अभिव्यक्ति की गति और परिणाम दोनों बनाए रखता है।
- source_word: ὥσπερ ἐν εἰρήνῃ
  choice: मानो शांतिपूर्वक
  rationale: ‘मानो’ तुलना अथवा आभास की अनिश्चितता को बनाए रखता है, और ‘शांतिपूर्वक’ हिन्दी में ‘शांति में’ की अपेक्षा अधिक स्वाभाविक है।
