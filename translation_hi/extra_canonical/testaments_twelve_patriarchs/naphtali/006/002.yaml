review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly follows the supplied Greek rather than the divergent English audit text: ἐκτὸς ναυτῶν καὶ κυβερνητῶν means that the vessel was without sailors and pilots. It also preserves the imperfect ἤρχετο (''was coming'') and the pre-existing inscription conveyed by ἐπεγέγραπτο. However, ''पाल के सहारे'' adds a specific means not explicitly stated by ἁρμενίζον, which more safely means ''sailing'' or ''making way by sea.'''
  naturalness: The Hindi is generally clear and appropriately dignified. Removing the added reference to sails makes the participial description both more faithful and more idiomatic in this context. 'कर्णधारों' is a suitable literary-modern term for pilots/helmsmen in this visionary maritime description.
  terminology: '''जहाज़'' accurately renders πλοῖον, and ''याकूब का जहाज़'' naturally renders πλοῖον Ἰακώβ without supplying a definite article. ''नाविकों और कर्णधारों के बिना'' appropriately retains the source''s distinction between sailors and κυβερνῆται.'
  issues:
  - severity: medium
    issue: The phrase 'पाल के सहारे' is more specific than the Greek participle ἁρμενίζον.
    rationale: The source indicates that the ship was sailing, but does not explicitly state that it proceeded by means of sails. The added detail should be removed to avoid narrowing the image.
  revised_text: और देखो, एक जहाज़ आ रहा था, जो नाविकों और कर्णधारों के बिना चल रहा था। जहाज़ पर लिखा था, “याकूब का जहाज़।”
