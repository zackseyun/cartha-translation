  text: 2. Καὶ ἰδοὺ πλοῖον ἤρχετο⁷ ἁρμενίζον⁸ *ἐκτὸς ναυτῶν⁹ καὶ κυβερνητῶν¹⁰· ἐπεγέγραπτο *δὲ τῷ πλοίῳ¹¹ *ὅτι πλοῖον¹² Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/002.yaml
  text: 'And behold, a ship was coming, sailing beside us, with sailors and pilots. And on the ship was written this: “Jacob’s ship.”'
translation:
  language: hi
  text: और देखो, एक जहाज़ आ रहा था, जो नाविकों और कर्णधारों के बिना चल रहा था। जहाज़ पर लिखा था, “याकूब का जहाज़।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῖον
  choice: जहाज़
  rationale: यह सामान्य और स्वाभाविक आधुनिक हिन्दी शब्द है, जो प्रसंग में जलयान का अर्थ स्पष्ट रूप से व्यक्त करता है।
- source_word: ἤρχετο
  choice: आ रहा था
  rationale: अपूर्ण भूतकाल की जारी क्रिया को व्यक्त करता है और यूनानी पाठ के पक्षगत अर्थ को बनाए रखता है।
- source_word: ἁρμενίζον
  choice: पाल के सहारे आगे बढ़ रहा था
  rationale: यह क्रिया पाल लगाकर चलने या समुद्र में आगे बढ़ने का बोध देती है; हिन्दी में केवल ‘चल रहा था’ की अपेक्षा समुद्री दृश्य अधिक स्पष्ट रहता है।
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: नाविकों और कर्णधारों के बिना
  rationale: ἐκτός का सामान्य अर्थ ‘बिना/से रहित’ है। यह उपलब्ध यूनानी पाठ का सीधा अर्थ है, भले ही परामर्श हेतु दिए गए अंग्रेज़ी पाठ में ‘with’ है। κυβερνήτης के लिए ‘कर्णधार’ जहाज़ का संचालन करने वाले व्यक्ति का गरिमापूर्ण और सटीक हिन्दी पद है।
- source_word: ἐπεγέγραπτο
  choice: लिखा था
  rationale: पूर्ण भूतकालीन निष्क्रिय रूप जहाज़ पर पहले से अंकित लेख को दर्शाता है; स्वाभाविक हिन्दी में ‘लिखा था’ पर्याप्त है।
- source_word: πλοῖον Ἰακώβ
  choice: याकूब का जहाज़
  rationale: यूनानी नामसूचक वाक्यांश को स्वाभाविक हिन्दी संबंधकारक रूप में प्रस्तुत किया गया है; अनावश्यक निश्चित उपपद नहीं जोड़ा गया।
