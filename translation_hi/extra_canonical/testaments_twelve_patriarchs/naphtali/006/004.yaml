  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। तूफ़ान और बवंडर की मूल पुनरुक्त छवि को बचाया गया है तथा कठिन नौसैनिक पद को मुख्य पाठ में प्रसंगानुकूल रूप देकर उसकी वास्तविक पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
