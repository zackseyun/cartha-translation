source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. *Ὡς δὲ ἡμεῖς εἰσήλθομεν¹⁶ γίνεται¹⁷ χειμὼν σφοδρός¹⁸, καὶ λαῖλαψ ἀνέμου¹⁹ μέγας²⁰, καὶ ἀφίσταται²¹ ὁ πατὴρ ἡμῶν²² ἀφʼ ἡμῶν, ὁ²³ κρατῶν *τοὺς αὐχένας²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/004.yaml
  text: And when we had entered, a violent storm arose, and a whirlwind of wind; and our father withdrew from us, holding the rudders[b].
translation:
  language: hi
  text: और जब हम प्रवेश कर चुके थे, तब एक प्रचंड तूफ़ान उठा, और हवा का एक बड़ा बवंडर आया; और हमारे पिता, पतवारें[a] पकड़े हुए, हमसे अलग हट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ कठिन है। जिस शब्द का अनुवाद “पतवारें” किया गया है, उसका सामान्य शाब्दिक अर्थ “गरदनें” है; पर समुद्री प्रसंग के कारण इसका आशय नौका की पतवारें हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: χειμὼν σφοδρός
  choice: एक प्रचंड तूफ़ान
  rationale: χειμών यहाँ समुद्री प्रसंग में तेज़ आँधी-तूफ़ान को सूचित करता है; ‘प्रचंड’ σφοδρός की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: हवा का बड़ा बवंडर
  rationale: यह अनुवाद मूल के अलग, प्रबल पवन-चित्र और μέγας को बनाए रखता है, यद्यपि पिछले खंड से अर्थगत पुनरुक्ति है।
- source_word: ἀφίσταται ... ἀφʼ ἡμῶν
  choice: हमसे दूर हो गए
  rationale: मध्य/अकर्मक क्रिया का अर्थ अलग होना या दूर हटना है; यह हिन्दी न तो जानबूझकर त्यागने का भाव जोड़ती है, न केवल निष्क्रिय रूप से अलग किए जाने का।
- source_word: κρατῶν τοὺς αὐχένας
  choice: पतवारें थामे हुए थे
  rationale: अक्षरशः αὐχένες का सामान्य अर्थ ‘गरदनें’ है, पर समुद्री स्वप्न-प्रसंग में पाठ कठिन है और अभिप्रेत वस्तु संभवतः नौका चलाने या दिशा देने वाली पतवारें हैं; अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
