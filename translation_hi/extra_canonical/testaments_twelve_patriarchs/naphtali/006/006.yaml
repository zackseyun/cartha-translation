translation:
  language: hi
  text: परन्तु यूसुफ एक छोटी नाव में चला गया, और हम नौ तख्तों पर बँट गए। लेवी और यहूदा साथ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκάτιον
  choice: छोटी नाव
  rationale: यह शब्द छोटी नाव या डोंगी-सदृश जलयान को दर्शाता है; सामान्य हिन्दी में ‘छोटी नाव’ स्पष्ट और स्वाभाविक है।
- source_word: διεχωρίσθημεν
  choice: अलग-अलग हो गए
  rationale: निष्क्रिय क्रिया समूह के बिखरकर अलग हो जाने को व्यक्त करती है; प्रसंग में यही सहज हिन्दी है।
- source_word: σανίδων ἐννέα
  choice: नौ तख्तों पर
  rationale: ग्रीक में संख्या ‘नौ’ तख्तों की कुल संख्या बताती है; अनुवाद इसकी ठोस समुद्री छवि बनाए रखता है।
- source_word: ἐπὶ τὸ αὐτό
  choice: साथ थे
  rationale: मुहावरे का अर्थ एक ही स्थान पर साथ होना है; शाब्दिक ‘एक ही पर’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है।
