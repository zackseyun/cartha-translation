  text: The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.
translation:
  language: hi
  text: जातियाँ भटक गईं और प्रभु को छोड़ गईं; उन्होंने अपनी व्यवस्था बदल दी और लकड़ी, पत्थर और छल की आत्माओं की बात मानी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔθνη
  choice: राष्ट्र
  rationale: यहाँ गैर-इस्राएली सामूहिक जातियों/राष्ट्रों का सामान्य उल्लेख है; आधुनिक हिन्दी में ‘राष्ट्र’ सहज और गरिमापूर्ण है।
- source_word: πλανηθέντα
  choice: भटक गए
  rationale: मूल निष्क्रिय कृदन्त का भाव नैतिक और धार्मिक मार्ग से भटकने का है; ‘भटक गए’ कारण को अनावश्यक रूप से निश्चित किए बिना इसे व्यक्त करता है।
- source_word: ἀφέντα Κύριον
  choice: प्रभु को छोड़ दिया
  rationale: ἀφίημι के त्यागने/छोड़ने के अर्थ और Κύριος के पारंपरिक, स्वाभाविक हिन्दी रूप को सुरक्षित रखता है।
- source_word: τὴν τάξιν αὐτῶν
  choice: अपनी निर्धारित व्यवस्था
  rationale: τάξις में क्रम, व्यवस्था या नियत स्थान/रीति का भाव हो सकता है; ‘निर्धारित व्यवस्था’ इस व्यापक अर्थ को बनाए रखता है और केवल सामाजिक या सृष्टिगत क्रम तक सीमित नहीं करता।
- source_word: ὑπήκουσαν
  choice: बात मानी
  rationale: शाब्दिक अर्थ ‘आज्ञा मानी/सुनी’ है; निर्जीव मूर्तिपदार्थों और आत्माओं के संदर्भ में ‘बात मानी’ स्वाभाविक हिन्दी देते हुए अधीनता का भाव रखता है।
- source_word: ξύλοις καὶ λίθοις
  choice: लकड़ी-पत्थर
  rationale: लकड़ी और पत्थर से बनी मूर्तियों की ओर संकेत है, पर मूल में ‘मूर्तियाँ’ स्पष्टतः नहीं है; ठोस शब्दों को बनाए रखा गया है।
- source_word: πνεύμασι πλάνης
  choice: भरमाने वाली आत्माओं
  rationale: सम्बन्धवाचक पदबंध का अर्थ ‘भ्रम/भटकाव की आत्माएँ’ है; यह रूप उनके छल और भटकाने वाले प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ξύλοις καὶ λίθοις को सीधे ‘मूर्तियाँ’ कहना
  choice: ‘लकड़ी-पत्थर’ रखा गया
  alternative: ‘लकड़ी और पत्थर की मूर्तियाँ’
  rationale: मूल पाठ अलंकारिक रूप से सामग्री का नाम लेता है; निहितार्थ स्पष्ट होने पर भी अनुवाद में अतिरिक्त संज्ञा जोड़कर अर्थ को संकीर्ण नहीं किया गया।
- issue: τάξις का धर्मवैचारिक दायरा
  choice: ‘निर्धारित व्यवस्था’
  alternative: ‘सृष्टि-क्रम’ या ‘स्वाभाविक क्रम’
  rationale: संदर्भ एक ईश्वर-नियत व्यवस्था की ओर संकेत कर सकता है, लेकिन यूनानी पद स्वयं इसे केवल सृष्टि या प्रकृति तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। यूनानी वाक्य के कृदन्तीय आरम्भ को स्वाभाविक हिन्दी में स्वतंत्र क्रियाओं के रूप में दिया गया है; समानांतर दोषों और परिणामों का क्रम सुरक्षित रखा गया है।
