source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Ὑμεῖς δὲ *μὴ οὕτως²⁵, τέκνα μου, γινώσκοντες²⁶ ἐν τῷ²⁷ στερεώματι, ἐν γῇ καὶ²⁸ ἐν²⁹ θαλάττῃ, καὶ²⁸ ἐν³⁰ πᾶσι τοῖς δημιουργήμασι *Κύριον τὸν³¹ ποιήσαντα πάντα³², ἵνα μὴ γένησθε³³ ὡς Σόδομα, ἥτις³⁴ ἐνήλλαξε³⁵ τάξιν φύσεως αὐτῆς³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/004.yaml
  text: But you, my children, must not be so, knowing in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.
translation:
  language: hi
  text: परन्तु मेरे बच्चो, आकाशमंडल में, पृथ्वी पर, समुद्र में और सभी सृजित वस्तुओं में उस प्रभु को पहचानते हुए, जिसने सब कुछ बनाया है, तुम ऐसे न होना, ताकि तुम सदोम के समान न बन जाओ, जिसने अपनी प्रकृति की व्यवस्था बदल दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερέωμα
  choice: आकाशमण्डल
  rationale: यह यूनानी शब्द के आकाशीय विस्तार या मंडल के अर्थ को पारंपरिक गंभीरता और आधुनिक बोधगम्यता के साथ व्यक्त करता है।
- source_word: δημιουργήμασι
  choice: सृजी हुई सभी वस्तुओं
  rationale: यह केवल सामान्य ‘सृष्टि’ कहने के बजाय बनाई गई अलग-अलग वस्तुओं के लिए प्रयुक्त बहुवचन को बनाए रखता है।
- source_word: γινώσκοντες
  choice: पहचानते हुए
  rationale: कृदन्त रूप को आज्ञार्थक वाक्य में बदलने के बजाय उसकी अपूर्ण क्रियात्मक संरचना को सुरक्षित रखा गया है; ‘पहचानना’ सृष्ट वस्तुओं में सृष्टिकर्ता का बोध होने का भाव स्वाभाविक रूप से देता है।
- source_word: τάξιν φύσεως αὐτῆς
  choice: अपनी प्रकृति की व्यवस्था
  rationale: ‘τάξις’ के क्रम/व्यवस्था और ‘φύσις’ के प्रकृति अर्थ, दोनों को बनाए रखा गया है, बिना यह व्याख्या जोड़े कि परिवर्तन विशेष रूप से किस बात का था।
theological_decisions:
- issue: सदोम द्वारा ‘अपनी प्रकृति की व्यवस्था’ बदलने का आशय
  choice: वाक्यांश को सामान्य और स्रोत के निकट रखा गया है।
  alternative: इसे किसी विशिष्ट यौन आचरण या सृष्टि-विधान के स्पष्ट उल्लेख के रूप में विस्तार देना।
  rationale: यूनानी पाठ स्वयं परिवर्तन का विषय विस्तार से नहीं बताता; इसलिए धार्मिक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
- issue: γινώσκοντες कृदन्त का मुख्य निषेध से संबंध
  choice: ‘पहचानते हुए’ द्वारा संबंध को खुला रखा गया है।
  alternative: ‘क्योंकि तुम पहचानते हो’ या ‘तुम पहचानो’ कहना।
  rationale: कारणसूचक या स्वतंत्र आज्ञार्थक अर्थ चुन लेने से यूनानी कृदन्त की वास्तविक व्याकरणिक लचक अनावश्यक रूप से समाप्त हो जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेरे बच्चो’ संबोधन आत्मीय है; ‘आकाशमण्डल’ और ‘सृजी हुई’ पाठ के प्राचीन धार्मिक परिवेश को बिना अत्यधिक संस्कृतनिष्ठ बने बनाए रखते हैं।
