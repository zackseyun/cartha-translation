id: T12P.NAP.3.1
reference: Testament of Naphtali 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: III. Μὴ οὖν σπουδάζετε¹ *ἐν πλεονεξίᾳ² *διαφθεῖραι τὰς πράξεις ὑμῶν³, ἢ ἐν *λόγοις κενοῖς ἀπατᾶν⁴ τὰς ψυχὰς ὑμῶν, ὅτι⁵ σιωπῶντες⁶ ἐν *καθαρότητι καρδίας⁷ συνήσετε⁸ τὸ θέλημα τοῦ Θεοῦ⁹ κρατεῖν¹⁰, καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/001.yaml
  text: Therefore, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls, because by keeping silent in purity of heart you will understand to hold fast the will of God and to cast away the will of Beliar.
translation:
  language: hi
  text: इसलिए लोभ में अपने कामों को बिगाड़ने के लिए उत्सुक मत हो, और न खोखली बातों से अपनी आत्माओं को धोखा दो; क्योंकि हृदय की शुद्धता में मौन रहकर तुम परमेश्वर की इच्छा को दृढ़ता से थामे रखने और बेलियार[a] की इच्छा को ठुकरा देने की समझ पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'बेलियार: यूनानी पाठ में प्रयुक्त एक नाम। प्राचीन यहूदी साहित्य में यह प्रायः दुष्ट या विरोधी शक्ति से संबद्ध है।'
    reason: अपरिचित नाम की संक्षिप्त पहचान देता है, पर मुख्य पाठ के नाम को बनाए रखता है और उसे किसी एक निश्चित धार्मिक पहचान से नहीं बाँधता।
lexical_decisions:
- source_word: σπουδάζετε
  choice: उतावले न हो
  rationale: क्रिया में किसी काम के लिए उत्सुकता या तत्परता का भाव है; निषेधात्मक संदर्भ में ‘उतावले न हो’ स्वाभाविक हिन्दी में वही चेतावनी व्यक्त करता है।
- source_word: πλεονεξίᾳ
  choice: लोभ में पड़कर
  rationale: यह शब्द लालच, अधिक पाने की लालसा और स्वार्थी लोभ को सूचित करता है; क्रियाविशेषणात्मक यूनानी वाक्यांश को सहज हिन्दी में प्रस्तुत किया गया है।
- source_word: διαφθεῖραι τὰς πράξεις ὑμῶν
  choice: अपने कामों को बिगाड़ने
  rationale: διαφθείρω का अर्थ भ्रष्ट, नष्ट या बिगाड़ देना हो सकता है। यहाँ नैतिक संदर्भ में ‘बिगाड़ने’ से अर्थ खुला रहता है और अनावश्यक रूप से केवल संस्थागत ‘भ्रष्टाचार’ का भाव नहीं आता।
- source_word: λόγοις κενοῖς
  choice: खोखली बातों से
  rationale: शाब्दिक अर्थ ‘रिक्त शब्दों’ का है; ‘खोखली बातें’ आधुनिक हिन्दी में अर्थहीन या निष्फल वाणी का स्वाभाविक समतुल्य है।
- source_word: ψυχὰς ὑμῶν
  choice: अपनी आत्माओं को
  rationale: ψυχή के धार्मिक और मानवशास्त्रीय आयाम को बनाए रखने के लिए ‘आत्माओं’ चुना गया है, न कि इसे केवल ‘मन’ या ‘अपने आप’ तक सीमित किया गया।
- source_word: σιωπῶντες ἐν καθαρότητι καρδίας
  choice: हृदय की शुद्धता में मौन रहकर
  rationale: मूल के कृदन्तीय ढाँचे और साधन/परिस्थिति के भाव को बिना शर्तसूचक ‘यदि’ जोड़े सुरक्षित रखा गया है।
- source_word: κρατεῖν
  choice: दृढ़ता से थामे रखना
  rationale: क्रिया का अर्थ पकड़ना, अधिकार रखना या दृढ़ता से थामे रहना है; यहाँ परमेश्वर की इच्छा के प्रति स्थिर निष्ठा का भाव उपयुक्त है।
- source_word: ἀπορρίπτειν
  choice: ठुकरा देना
  rationale: मूल क्रिया दूर फेंक देने या अस्वीकार करने का प्रबल भाव रखती है; ‘ठुकरा देना’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी रूप Βελίαρ का निकट देवनागरी लिप्यंतरण रखा गया है; इसे किसी व्याख्यात्मक पदवी से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर और बेलियार की इच्छाओं का विरोध
  choice: दोनों के लिए समान शब्द ‘इच्छा’ रखा गया
  alternative: बेलियार के लिए ‘मंशा’ या ‘योजना’ कहना
  rationale: मूल पाठ दोनों स्थानों पर θέλημα का प्रयोग करता है; समानता बनाए रखने से जानबूझकर रचा गया नैतिक-धार्मिक विरोध सुरक्षित रहता है।
- issue: मौन और समझ के बीच संबंध
  choice: ‘मौन रहकर तुम समझोगे’
  alternative: ‘यदि तुम मौन रहोगे, तो समझोगे’
  rationale: मूल में कृदन्त है, स्पष्ट शर्तवाचक उपवाक्य नहीं। हिन्दी में साधन या परिस्थिति का संबंध रखा गया है, बिना अतिरिक्त शर्त आरोपित किए।
- issue: κρατεῖν और ἀπορρίπτειν वाले अनन्त क्रियारूपों का आशय
  choice: ‘समझोगे कि ... थामे रखना और ... ठुकरा देना है’
  alternative: ‘समझोगे कि तुम्हें ... थामे रखना और ... ठुकरा देना चाहिए’
  rationale: ‘चाहिए’ जोड़ने से नैतिक आदेश अधिक स्पष्ट हो जाता, पर वह मूल में प्रत्यक्ष रूप से उपस्थित नहीं है। चुना गया रूप हिन्दी में बोधगम्य रहते हुए यूनानी वाक्य की संक्षिप्तता और कुछ हद तक उसकी अर्थगत खुलावट बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और उपदेशात्मक रखी गई है। ‘खोखली बातें’, ‘उतावले न हो’ और ‘ठुकरा देना’ सामान्य पाठक के लिए सहज हैं, जबकि ‘हृदय की शुद्धता’, ‘आत्माओं’ और ‘परमेश्वर की इच्छा’ धार्मिक गंभीरता बनाए रखते हैं।
