  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/002.yaml
  text: The sun and the moon and the stars do not alter their order; so you also must not alter the law of God through the disorder of your deeds.
translation:
  language: hi
  text: सूर्य, चन्द्रमा और तारे अपनी व्यवस्था नहीं बदलते; उसी प्रकार तुम भी अपने कामों की अव्यवस्था से परमेश्वर के नियम को मत बदलो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάξιν
  choice: व्यवस्था
  rationale: यहाँ शब्द आकाशीय पिंडों के नियमित क्रम या सुव्यवस्थित विधान को दर्शाता है; ‘व्यवस्था’ अगले खंड की ‘अव्यवस्था’ के साथ मूल का शब्दगत विरोध भी बनाए रखती है।
- source_word: νόμον Θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος का अर्थ यहाँ परमेश्वर का नियम या विधान है। ‘व्यवस्था’ आधुनिक हिन्दी में स्वाभाविक है और τάξις/ἀταξία से जुड़े क्रम-अक्रम के अर्थ-संबंध को भी सुनाई देता रहने देती है।
- source_word: ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν
  choice: अपने कामों की अव्यवस्था के द्वारा
  rationale: ἐν को साधनात्मक अर्थ में लिया गया है, जैसा प्रसंग और अंग्रेज़ी परामर्श-पाठ सुझाते हैं; πράξεις के लिए सामान्य और स्पष्ट ‘काम’ चुना गया है।
- source_word: μὴ ἀλλοιώσητε
  choice: मत बदलो
  rationale: निषेधात्मक आज्ञा को सीधे और स्वाभाविक हिन्दी रूप में रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर की व्यवस्था को बदलने’ का आशय
  choice: मूल रूपक और उसकी तनावपूर्ण भाषा को यथावत रखना
  alternative: ‘परमेश्वर की व्यवस्था से मत भटको’ या ‘उसका उल्लंघन मत करो’
  rationale: मूल यूनानी में ἀλλοιόω, ‘बदलना’, स्पष्ट रूप से प्रयुक्त है। इसे ‘उल्लंघन’ या ‘भटकना’ बनाना अर्थ की व्याख्या करके मूल की असामान्य अभिव्यक्ति को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली। ‘सूर्य, चन्द्रमा और तारे’ तथा ‘उसी प्रकार’ मूल की तुलना को स्पष्ट रखते हैं। कोई पादटिप्पणी आवश्यक नहीं।
