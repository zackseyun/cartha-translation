id: T12P.NAP.3.5
reference: Testament of Naphtali 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. Ὁμοίως³⁷ δὲ³⁸ καὶ³⁹ οἱ Ἐγρήγοροι⁴⁰ ἐνήλλαξαν τάξιν φύσεως αὐτῶν, οὓς⁴¹ κατηράσατο⁴² Κύριος ἐπὶ τοῦ κατακλυσμοῦ⁴³, διʼ οὓς⁴⁴ *ἀπὸ κατοικησίας καὶ ἄκαρπον τάξας τὴν γῆν [ἀοίκητον]⁴⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/005.yaml
  text: In the same way also the Watchers changed the order of their nature, whom the Lord cursed at the time of the flood, because of whom he made the earth uninhabited and fruitless.
translation:
  language: hi
  text: इसी प्रकार पहरेदारों ने भी अपने स्वभाव की व्यवस्था बदल डाली। प्रभु ने जलप्रलय के समय उन्हें शाप दिया; उन्हीं के कारण उसने पृथ्वी को निर्जन और निष्फल कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ Ἐγρήγοροι
  choice: पहरेदारों
  rationale: यह शब्द जागते रहने या पहरा देने वालों के लिए प्रयुक्त विशिष्ट समूह-संज्ञा है; ‘पहरेदार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐνήλλαξαν τάξιν φύσεως αὐτῶν
  choice: अपने स्वभाव की व्यवस्था बदल डाली
  rationale: τάξις के क्रम/व्यवस्था और φύσις के स्वभाव/प्रकृति-संबंधी अर्थ को बनाए रखते हुए वाक्य को सहज हिन्दी में रखा गया है; पाठ यह स्पष्ट नहीं करता कि परिवर्तन ठीक किस प्रकार का था।
- source_word: ἐπὶ τοῦ κατακλυσμοῦ
  choice: जलप्रलय के समय
  rationale: κατακλυσμός यहाँ महाप्रलय-संबंधी बाढ़ को सूचित करता है; ‘जलप्रलय’ धार्मिक-साहित्यिक संदर्भ में परिचित और सटीक है।
- source_word: ἀπὸ κατοικησίας ... [ἀοίκητον]
  choice: निर्जन
  rationale: दूषित/अस्थिर यूनानी पाठ का आशय निवासरहित या रहने योग्य न रहने से जुड़ा है; ‘निर्जन’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἄκαρπον
  choice: निष्फल
  rationale: शाब्दिक अर्थ ‘फलहीन’ है; भूमि के संदर्भ में ‘निष्फल’ उसकी उपजहीनता को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पहरेदारों’ की पहचान
  choice: विशिष्ट समूह-संज्ञा के रूप में ‘पहरेदार’ रखा गया
  alternative: स्वर्गदूत / गिरे हुए स्वर्गदूत
  rationale: मूल पाठ केवल Ἐγρήγοροι कहता है; किसी स्पष्ट व्याख्यात्मक पहचान को जोड़ना पाठ से आगे जाना होता।
- issue: स्वभाव की व्यवस्था बदलने का स्वरूप
  choice: अस्पष्टता बनाए रखी गई
  alternative: अपने स्वर्गीय स्वभाव को बदल दिया / प्राकृतिक मर्यादा तोड़ी
  rationale: मूल वाक्य परिवर्तन की प्रकृति नहीं बताता; किसी विशेष नैतिक या तात्त्विक अर्थ को आरोपित नहीं किया गया।
- issue: पृथ्वी को निर्जन और निष्फल करने वाला कर्ता
  choice: निकटतम स्पष्ट कर्ता ‘प्रभु’ को ‘उसने’ से जारी रखा
  alternative: जलप्रलय ने पृथ्वी को निर्जन किया
  rationale: यूनानी में अंतिम क्रिया का कर्ता निहित है और वाक्य-संरचना प्रभु की ओर संकेत करती है; अंग्रेज़ी परामर्श-पाठ भी यही समझ रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु प्राचीन यहूदी धार्मिक साहित्य के अनुरूप गरिमापूर्ण रखी गई है। लंबे यूनानी संबंधवाचक वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया, जबकि कारण-संबंध और अर्थगत तनाव सुरक्षित रखा गया है।
