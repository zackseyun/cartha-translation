  text: 'In the fifth year of his life[a], Dan called together his family and said:


    2. “Hear my words, sons of Dan, and pay attention to the words of your father.

    3. I have tested in my heart, and in all my life, that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.

    4. So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.

    5. And I rejoiced over his being sold, because his father loved him more than us.

    6. For the spirit of jealousy and of arrogance kept saying to me, ‘You yourself also are his son.’

    7. And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you when he is dead.’

    8. Now this was the spirit of anger persuading me, that just as a leopard devours a young goat, so I too should destroy Joseph.

    9. But the God of my fathers did not give him into my hands[b], so that I might find him alone and kill him and commit this lawless deed[c], lest two tribes be destroyed from Israel.”'
translation:
  language: hi
  text: '**याकूब और बिल्हा के सातवें पुत्र दान की वसीयत**


    **1.** ये दान के उन वचनों की प्रति हैं, जो उसने अपने जीवन के अंतिम दिनों में, अपनी आयु के एक सौ पच्चीसवें वर्ष में[a], अपने पुत्रों से कहे।


    **2.** उसने अपने कुल के लोगों को बुलाकर कहा, “दान के पुत्रों, मेरी बातें सुनो और अपने पिता के वचनों पर ध्यान दो।


    **3.** मैंने अपने हृदय में और अपने पूरे जीवन में यह परखकर जाना है कि सत्य और धर्ममय आचरण अच्छे और परमेश्वर को भानेवाले हैं; और यह कि झूठ और क्रोध बुरे हैं और मनुष्य को हर प्रकार की दुष्टता सिखाते हैं।


    **4.** इसलिए, मेरे बच्चों, आज मैं तुम्हारे सामने स्वीकार करता हूँ कि मैंने अपने हृदय में अपने भाई यूसुफ—उस भले और सच्चे मनुष्य—को मार डालने की ठान ली थी।


    **5.** जब वह बेचा गया, तब मैं खुश हुआ, क्योंकि हमारा पिता उसे हमसे अधिक प्रेम करता था।


    **6.** ईर्ष्या और घमंड की आत्मा मुझसे कहती रहती थी, ‘तू भी तो उसका पुत्र है।’


    **7.** और बेलिआर की आत्माओं में से एक मेरा साथ दे रही थी। वह कहती थी, ‘तलवार ले और उससे यूसुफ को मार डाल। उसके मर जाने पर तेरा पिता तुझसे प्रेम करेगा।’


    **8.** क्रोध की आत्मा ही मुझे इसके लिए उकसा रही थी: जैसे तेंदुआ बकरी के बच्चे को निगल जाता है, वैसे ही मैं भी यूसुफ को नष्ट कर दूँ।[b]


    **9.** परंतु मेरे पूर्वजों के परमेश्वर[c] ने उसे मेरे हाथों में पड़ने नहीं दिया, ताकि मैं उसे अकेला पाकर मार डालूँ और उसके कारण इस्राएल का दूसरा राजदंड टूट जाए।”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में स्पष्ट रूप से ‘एक सौ पच्चीसवें वर्ष’ है। कुछ परवर्ती प्रस्तुतीकरण इसे संक्षिप्त या भिन्न काल-सूचना के रूप में देते हैं।
    reason: textual_variant
  - marker: b
    text: इस पद का यूनानी पाठ दूषित और व्याकरण की दृष्टि से कठिन है। उसमें तेंदुए और बकरी के बच्चे की हिंसक उपमा है; अनुवाद संभावित आशय देता है, पर अस्पष्ट विवरण को निश्चित नहीं बनाता।
    reason: textual_difficulty
  - marker: c
    text: कुछ पाठ-रूपों में ‘मेरे पूर्वजों के परमेश्वर’ के स्थान पर ‘मेरे पिता याकूब के परमेश्वर’ मिलता है।
    reason: alternative_reading
  - marker: d
    text: ‘इस्राएल का दूसरा राजदंड’ कठिन अभिव्यक्ति है। ‘राजदंड’ संभवतः गोत्र या वंश का प्रतीक हो सकता है, किंतु इस वाक्यांश का सटीक अभिप्राय अनिश्चित है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀντίγραφον
  choice: प्रति
  rationale: यह शब्द लिखित प्रति या अभिलेख का संकेत देता है; ‘प्रति’ संक्षिप्त और स्वाभाविक है।
- source_word: προσέχετε
  choice: ध्यान दो
  rationale: पिता की गंभीर आज्ञा का बल बनाए रखते हुए यह आधुनिक हिन्दी में सहज है।
- source_word: ἀλήθεια μετὰ δικαιοπραγίας
  choice: सत्य और धर्ममय आचरण
  rationale: μετά यहाँ दोनों संबद्ध नैतिक गुणों को जोड़ता है; δικαιοπραγία अमूर्त धार्मिकता से अधिक सही काम करने के व्यवहार को दर्शाता है।
- source_word: ψεῦδος
  choice: झूठ
  rationale: ‘असत्य’ की अपेक्षा ‘झूठ’ सामान्य पाठकों के लिए अधिक सीधा है और नैतिक विरोध को स्पष्ट रखता है।
- source_word: θυμός
  choice: क्रोध
  rationale: पूरे अध्याय में यह प्रमुख दुर्गुण है; ‘क्रोध’ स्वाभाविक और पर्याप्त रूप से तीव्र है।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: पिता द्वारा यूसुफ को अधिक प्रेम किए जाने के संदर्भ में संबंधपरक ईर्ष्या अभिप्रेत है।
- source_word: ἀλαζονεία
  choice: घमंड
  rationale: आत्म-अभिमान और अहंकारी दावे का अर्थ सामान्य हिन्दी में स्पष्ट करता है।
- source_word: πνευμάτων τοῦ Βελίαρ
  choice: बेलिआर की आत्माओं
  rationale: यूनानी पाठ में आए व्यक्तिवाचक नाम और उसकी दुष्ट आत्माओं संबंधी रूपरेखा को सामान्यीकृत किए बिना सुरक्षित रखा गया है।
- source_word: ἄνελε
  choice: मार डाल
  rationale: हत्या की सीधी आज्ञा को बिना पुरातन भाषा के स्पष्ट रूप से व्यक्त करता है।
- source_word: πάρδαλις
  choice: तेंदुआ
  rationale: पशु का मानक आधुनिक हिन्दी नाम है और हिंसक उपमा को बनाए रखता है।
- source_word: σκῆπτρον δεύτερον
  choice: दूसरा राजदंड
  rationale: शाब्दिक राजकीय/गोत्रीय प्रतीक को सुरक्षित रखता है; इसे मुख्य पाठ में सीधे ‘दूसरा गोत्र’ बनाकर अर्थ सीमित नहीं किया गया।
theological_decisions:
- issue: बेलिआर का दुष्ट शक्ति के रूप में उल्लेख
  choice: ‘बेलिआर की आत्माओं में से एक’ कहकर नाम और बहुवचन संरचना सुरक्षित रखी गई।
  alternative: ‘एक दुष्ट आत्मा’ या ‘बेलियाल की एक आत्मा’
  rationale: यूनानी पाठ बेलिआर का स्पष्ट नाम लेता है; अनुवाद उसकी दानवीय रूपरेखा को मनोवैज्ञानिक आवेग मात्र नहीं बनाता।
- issue: दान की मंशा पर परमेश्वर का नियंत्रण
  choice: ‘उसे मेरे हाथों में पड़ने नहीं दिया’
  alternative: ‘उसे मेरे हाथों में नहीं सौंपा’
  rationale: यह परमेश्वर के रोकने वाले कार्य और दान की अपनी दोषपूर्ण मंशा—दोनों को साथ रखता है।
- issue: यूसुफ की हत्या और इस्राएल के दूसरे राजदंड का विनाश
  choice: रूपक को ‘दूसरा राजदंड’ के रूप में बनाए रखा गया।
  alternative: ‘इस्राएल के दो गोत्र नष्ट न हो जाते’
  rationale: यूनानी का वाक्य कठिन है और σκῆπτρον गोत्रीय सत्ता या वंश का प्रतीक हो सकता है; अधिक स्पष्ट वैकल्पिक अर्थ को मुख्य पाठ में थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सुबोध। पारिवारिक संबोधन में ‘पुत्रो’ और ‘बच्चो’ रखा गया है। स्रोत की प्रस्तावना, 125 वर्ष की काल-सूचना, बेलिआर का नाम, और अंतिम ‘राजदंड’ रूपक अंग्रेज़ी परामर्श-पाठ से भिन्न होने पर भी यूनानी साक्ष्य के आधार पर सुरक्षित रखे गए हैं।
