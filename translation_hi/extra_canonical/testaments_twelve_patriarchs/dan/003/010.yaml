source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ ἀσθενὴς ᾖ ὁ²⁴ θυμούμενος²⁵, *διπλοῦν τὸ τῆς ὀργῆς πάθος ἐν αὐτῷ ἀναφύει²⁶· βοηθεῖ *γὰρ αὐτῷ ὁ θυμὸς²⁷ πάντοτε ἐν παρανομίᾳ²⁸. 6. Τοῦτο τὸ πνεῦμα ἀεὶ μετὰ τοῦ ψεύδους *ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται, ἵνα ἐν ὠμότητι καὶ ψεύδει³⁰ γίνωνται³¹ αἱ πράξεις αὐτοῦ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/010.yaml
  text: But if the one who is angry is weak, the passion of wrath grows in him twofold, for anger always helps him in wrongdoing. This spirit always proceeds with falsehood at the right hand of Satan, so that his deeds may be done in cruelty and falsehood.
translation:
  language: hi
  text: पर यदि क्रोध करनेवाला दुर्बल हो, तो उसमें क्रोध का आवेग दुगुना होकर बढ़ता है; क्योंकि क्रोध अधर्म में सदा उसकी सहायता करता है। यह आत्मा झूठ के साथ सदा शैतान के दाहिने ओर चलती रहती है, ताकि उसके काम क्रूरता और झूठ में किए जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενὴς
  choice: दुर्बल
  rationale: यह शारीरिक, मानसिक या नैतिक कमजोरी को अनिर्धारित छोड़ता है, जैसा यूनानी पाठ करता है।
- source_word: θυμούμενος
  choice: क्रोध करनेवाला
  rationale: वर्तमान कृदंत का सीधा और स्वाभाविक हिन्दी रूप, जो क्रोधित अवस्था वाले व्यक्ति को सूचित करता है।
- source_word: διπλοῦν ... ἀναφύει
  choice: दुगुनी होकर बढ़ती है
  rationale: διπλοῦν की द्विगुणता और ἀναφύει के उगने या बढ़ने—दोनों भावों को व्यक्त करता है।
- source_word: τὸ τῆς ὀργῆς πάθος
  choice: क्रोध की प्रबल भावना
  rationale: πάθος यहाँ व्यक्ति पर प्रभाव डालने वाली तीव्र भावावस्था है; केवल 'भावना' से अधिक बल व्यक्त करने के लिए 'प्रबल' जोड़ा गया है।
- source_word: ἐν παρανομίᾳ
  choice: अधर्म करने में
  rationale: παρανομία व्यवस्था-विरोधी या अनुचित आचरण को दर्शाता है; यह रूप हिन्दी में स्वाभाविक है और क्रोध की सहायक भूमिका स्पष्ट रखता है।
- source_word: τὸ πνεῦμα
  choice: यह आत्मा
  rationale: निकटवर्ती दुष्प्रभावकारी शक्ति के लिए पाठ का संकेतवाचक और आध्यात्मिक भाषा सुरक्षित रखी गई है।
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: शैतान की दाहिनी ओर
  rationale: स्थान-संबंधी यूनानी अभिव्यक्ति का औपचारिक रूप रखा गया है; इसे सम्मान या अधिकार के अर्थ में स्पष्ट करके पाठ की अस्पष्टता नहीं मिटाई गई।
- source_word: ἐν ὠμότητι καὶ ψεύδει
  choice: क्रूरता और झूठ से
  rationale: ἐν के साधन अथवा परिवेश-सदृश भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘यह आत्मा’ का संदर्भ
  choice: संदर्भ को केवल ‘यह आत्मा’ कहकर खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘क्रोध की आत्मा’ कहना।
  rationale: यूनानी τοῦτο τὸ πνεῦμα निकट संदर्भ की ओर संकेत करता है, पर इसी वाक्य में उसका नाम स्पष्ट रूप से नहीं देता; अतः व्याख्यात्मक नाम नहीं जोड़ा गया।
- issue: ‘उसके काम’ में सर्वनाम का संदर्भ
  choice: पुल्लिंग एकवचन ‘उसके’ रखा गया है।
  alternative: इसे ‘शैतान के काम’ या ‘उस आत्मा के काम’ कहकर स्पष्ट करना।
  rationale: ग्रीक αὐτοῦ का संदर्भ व्याकरणतः शैतान अथवा उल्लिखित व्यक्ति/सत्ता से जोड़ा जा सकता है; हिन्दी में उसी वास्तविक संदिग्धता को बनाए रखा गया है।
- issue: शैतान की दाहिनी ओर का अर्थ
  choice: स्थानात्मक चित्र को ज्यों का त्यों रखा गया है।
  alternative: ‘शैतान के सहायक के रूप में’ या ‘शैतान के अधिकार में’ कहना।
  rationale: मूल पाठ की छवि को किसी एक धर्मवैचारिक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-अनुकूल रूप अपनाया गया है। वाक्य-संरचना मूल यूनानी तर्कक्रम के निकट है, जबकि ‘दुगुनी होकर बढ़ती है’ और ‘अधर्म करने में’ जैसे पद स्वाभाविक हिन्दी प्रवाह देते हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
