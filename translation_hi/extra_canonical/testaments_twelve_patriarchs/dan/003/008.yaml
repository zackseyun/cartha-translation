source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Καὶ ὅταν ταῦτα πάντα πράξῃ τὸ σῶμα, δικαιοῖ τὰ πραχθέντα καὶ ἡ ψυχή¹⁰, ἐπειδὴ οὐ βλέπει ὀρθῶς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/008.yaml
  text: And when the body has done all these things, the soul justifies what has been done, because it does not see rightly.
translation:
  language: hi
  text: और जब शरीर ये सब काम कर लेता है, तब आत्मा भी किए गए कामों को सही ठहराती है,[a] क्योंकि वह ठीक से नहीं देखती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपीय साक्ष्यों में यहाँ ‘आत्मा भी’ के स्थान पर केवल ‘आत्मा’ पढ़ा जाता है।
    reason: मूल संस्करण में ψυχή के साथ चिह्नित पाठांतर है; मुख्य पाठ καὶ ἡ ψυχή के ‘भी’ को दर्शाता है।
lexical_decisions:
- source_word: σῶμα
  choice: शरीर
  rationale: मूल यूनानी का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: δικαιοῖ
  choice: सही ठहराती है
  rationale: यहाँ क्रिया का अर्थ किए गए कामों को उचित या न्यायसंगत मानना है; ‘धर्मी ठहराना’ इस संदर्भ में अनावश्यक धार्मिक अर्थ ला सकता है।
- source_word: ψυχή
  choice: आत्मा
  rationale: मनुष्य के आंतरिक, निर्णय करने वाले पक्ष के लिए परंपरागत और गरिमापूर्ण समतुल्य; मूल में ‘मन’ और ‘जीवन’ से जुड़ी अर्थ-व्याप्ति बनी रहती है।
- source_word: οὐ βλέπει ὀρθῶς
  choice: ठीक तरह से नहीं देखती
  rationale: देखने की मूल रूपकात्मक भाषा को बनाए रखता है और दोषपूर्ण नैतिक विवेक का संकेत देता है।
theological_decisions:
- issue: शरीर और आत्मा के बीच संबंध
  choice: शरीर के कर्म के बाद आत्मा द्वारा उन्हें सही ठहराने का क्रम यथावत रखा गया है।
  alternative: आत्मा शरीर के पाप में सहभागी होती है।
  rationale: वैकल्पिक कथन व्याख्यात्मक निष्कर्ष जोड़ देता; मूल पाठ केवल यह कहता है कि आत्मा किए गए कामों को उचित मानती है क्योंकि उसकी दृष्टि ठीक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण लेकिन सहज रखा गया है। ‘सही ठहराती है’ सामान्य पाठक के लिए स्पष्ट है और δικαιοῖ की नैतिक अर्थच्छाया को सुरक्षित रखता है।
