base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/003.yaml
  text: Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him.
translation:
  language: hi
  text: चाहे वह पिता हो या माता, यह उनके साथ शत्रुओं जैसा व्यवहार करता है। चाहे वह भाई हो, यह उसे नहीं जानता। चाहे वह प्रभु का कोई भविष्यद्वक्ता हो, यह उसकी बात नहीं मानता; चाहे कोई धर्मी हो, यह उसे नहीं देखता; चाहे कोई मित्र हो, यह उसे नहीं पहचानता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς πολεμίοις προσέχει αὐτοῖς
  choice: उन्हें शत्रु समझकर उनके साथ वैसा ही व्यवहार करता है
  rationale: यह वाक्यांश शाब्दिक रूप से ‘शत्रुओं के समान उनकी ओर ध्यान देता/उनसे व्यवहार करता है’ का भाव रखता है। चुना हुआ रूप क्रोध के व्यक्ति के प्रति शत्रुवत् रुख को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρακούει
  choice: उसकी बात नहीं मानता
  rationale: यहाँ शब्द का अर्थ सुनने से चूकना मात्र नहीं, बल्कि अवज्ञा करना है; यह रूप सामान्य पाठक के लिए स्पष्ट और सहज है।
- source_word: οὐ βλέπει
  choice: उसे नहीं देखता
  rationale: βλέπει का सीधा दृश्यात्मक अर्थ सुरक्षित रखा गया है और इसे ‘ध्यान नहीं देता’ जैसे व्याख्यात्मक विकल्प में नहीं बदला गया।
- source_word: οὐ γνωρίζει
  choice: उसे नहीं पहचानता
  rationale: γνωρίζει को संबंध या पहचान से इनकार करने के अर्थ में स्वाभाविक हिन्दी ‘पहचानता’ से व्यक्त किया गया है।
theological_decisions:
- issue: बार-बार आए कर्ता का संकेत
  choice: ‘यह’ का प्रयोग, जो पूर्व प्रसंग में वर्णित प्रवृत्ति या मनोभाव की ओर संकेत करता है
  alternative: हर उपवाक्य में कर्ता को छोड़ देना या किसी विशिष्ट दोष का नाम जोड़ना
  rationale: इस पद में यूनानी क्रियाओं का कर्ता प्रसंगाधीन है। ‘यह’ उस संदर्भगत कर्ता को बनाए रखता है, पर इस पद से बाहर की कोई संकीर्ण व्याख्या नहीं थोपता।
- issue: धर्मी को ‘न देखना’
  choice: रूपक की संभावित अस्पष्टता सहित शाब्दिक ‘उसे नहीं देखता’
  alternative: ‘उस पर ध्यान नहीं देता’ या ‘उसकी उपेक्षा करता है’
  rationale: मूल पाठ βλέπει का उपयोग करता है। संभावित रूपक को स्पष्ट करके मूल की तनावपूर्ण भाषा को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। समानांतर ‘चाहे…’ संरचना मूल की क्रमिक लय को सुरक्षित रखती है। सर्वनामों में पुरुष-प्रधान रूप मूल के पिता, भाई, भविष्यद्वक्ता, धर्मी और मित्र जैसे उदाहरणों के अनुरूप है; माता के साथ बहुवचन ‘उन्हें’ स्वाभाविक रूप से दोनों विकल्पों को समेटता है।
