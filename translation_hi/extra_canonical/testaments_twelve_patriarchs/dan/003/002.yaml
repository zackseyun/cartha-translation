id: T12P.DAN.3.2
reference: Testament of Dan 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Τύφλωσις *γάρ ἐστιν ὁ θυμὸς καὶ οὐκ ἐᾷ ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/002.yaml
  text: For anger is blindness, and it does not allow one to see anyone’s face in truth.
translation:
  language: hi
  text: क्योंकि क्रोध अंधापन है, और वह मनुष्य को किसी का चेहरा सच्चाई से देखने नहीं देता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: क्रोध
  rationale: यहाँ शब्द तीव्र रोष या क्रोध को दर्शाता है; आधुनिक मानक हिन्दी में ‘क्रोध’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τύφλωσις
  choice: अंधापन
  rationale: यूनानी भाववाचक संज्ञा का सीधा रूप रखते हुए क्रोध को दृष्टि हर लेने वाली अवस्था के रूप में प्रस्तुत किया गया है।
- source_word: πρόσωπόν τινος
  choice: किसी का चेहरा
  rationale: ‘चेहरा’ πρόσωπον का ठोस अर्थ बनाए रखता है और व्यक्ति को सही रूप में देख पाने की बात व्यक्त करता है।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई में
  rationale: यूनानी पदबंध की जानबूझकर असामान्य तथा संभावित रूप से व्यापक अभिव्यक्ति को बनाए रखा गया है; इसे केवल ‘सही ढंग से’ कहकर सीमित नहीं किया गया।
theological_decisions:
- issue: क्रोध और अंधेपन के संबंध का स्वरूप
  choice: ‘क्रोध अंधापन है’—पहचानसूचक रूपक को सीधे रखा गया
  alternative: ‘क्रोध मनुष्य को अंधा कर देता है’
  rationale: मूल पाठ में क्रोध को स्वयं अंधापन कहा गया है; कारणात्मक पुनर्लेखन रूपक की तीक्ष्णता घटा देता।
- issue: ἐν ἀληθείᾳ का अर्थ
  choice: ‘सच्चाई में’
  alternative: ‘सही रूप में’ अथवा ‘निष्पक्ष होकर’
  rationale: मूल अभिव्यक्ति में नैतिक, संबंधपरक या ज्ञानात्मक अर्थ की गुंजाइश है; अनुवाद ने इस तनाव को किसी एक व्याख्या में सीमित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। γάρ को ‘क्योंकि’ और καί को ‘और’ से स्पष्ट रखा गया है। ‘वह’ का संदर्भ निकटतम पुल्लिंग संज्ञा ‘क्रोध’ है; ‘मनुष्य को’ जोड़कर οὐκ ἐᾷ के अनिर्दिष्ट कर्ता/अनुभवकर्ता को हिन्दी में स्वाभाविक बनाया गया है।
