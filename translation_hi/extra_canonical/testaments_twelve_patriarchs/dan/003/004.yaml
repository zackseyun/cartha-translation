source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Περιβάλλεται γὰρ ⌈αὐτὸν⌉⁷ τὸ πνεῦμα τοῦ θυμοῦ τὸ δίκτυον τῆς πλάνης²¹ καὶ τυφλοῖ τοὺς²² ὀφθαλμοὺς αὐτοῦ, καὶ¹ διὰ τοῦ ψεύδους σκοτοῖ²³ τὴν διάνοιαν ⌈αὐτοῦ⌉⁷²⁴, καὶ τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/004.yaml
  text: For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision.
translation:
  language: hi
  text: क्योंकि क्रोध की आत्मा उसे छल के जाल में लपेट लेती है और उसकी आँखों को अंधा कर देती है। वह झूठ के द्वारा उसकी समझ को अंधकार में डाल देती है और उसे अपनी ही दृष्टि देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: क्रोध की आत्मा
  rationale: स्रोत की व्यक्तिवाचक अभिव्यक्ति को बनाए रखता है; इसे केवल ‘क्रोध’ या मनोवैज्ञानिक आवेग बनाकर उसका स्वरूप सीमित नहीं करता।
- source_word: τὸ δίκτυον τῆς πλάνης
  choice: छल का जाल
  rationale: δίκτυον के ठोस बिंब ‘जाल’ को सुरक्षित रखते हुए πλάνη के भटकाने और धोखा देने वाले भाव को सहज हिन्दी ‘छल’ से व्यक्त करता है।
- source_word: τὴν διάνοιαν
  choice: बुद्धि
  rationale: यहाँ विचार और समझ की आंतरिक क्षमता अभिप्रेत है; ‘बुद्धि’ आधुनिक हिन्दी में इस अर्थ को संक्षेप और गरिमा से व्यक्त करती है।
- source_word: τὴν ἰδίαν ὅρασιν
  choice: अपनी ही दृष्टि
  rationale: 'शाब्दिक बिंब तथा सर्वनामगत तनाव को सुरक्षित रखता है: व्याकरणतः यह क्रोध की आत्मा द्वारा दी गई उसकी अपनी दृष्टि की ओर संकेत करता है, पर अनावश्यक व्याख्या नहीं जोड़ता।'
theological_decisions:
- issue: ‘क्रोध की आत्मा’ को वास्तविक आत्मिक सत्ता या मानवीय प्रवृत्ति मानना
  choice: स्रोत की व्यक्तिवाचक भाषा ‘क्रोध की आत्मा’ को यथावत रखा गया
  alternative: ‘क्रोध की प्रवृत्ति’ या केवल ‘क्रोध’
  rationale: अनुवाद स्रोत की आत्मिक भाषा को न तो मनोवैज्ञानिक रूप में घटाता है, न किसी विशिष्ट दानव-विज्ञान को स्पष्ट रूप से आरोपित करता है।
- issue: अंतिम ‘अपनी’ का संदर्भ
  choice: ‘अपनी ही दृष्टि’ की स्वाभाविक संदर्भगत अस्पष्टता बनाए रखी गई
  alternative: ‘क्रोध की आत्मा की अपनी दृष्टि’
  rationale: ग्रीक ἰδίαν का संभावित संदर्भ कर्ता से है, किंतु हिन्दी में उसे पूरी तरह स्पष्ट कर देना मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले लंबे ग्रीक वाक्य को हिन्दी पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि क्रियाओं का क्रम और कारणात्मक संबंध सुरक्षित है।
