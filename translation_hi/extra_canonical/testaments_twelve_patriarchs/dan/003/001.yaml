  text: “…सत्य और धीरज को—तुम नाश हो जाओगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθειαν
  choice: सत्य
  rationale: यह ἀλήθεια का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: यहाँ शब्द का अर्थ उकसावे या कठिनाई के बीच लंबे समय तक संयम और सहनशीलता बनाए रखना है; साधारण पाठक के लिए ‘धीरज’ सहज है।
- source_word: ἀπολεῖσθε
  choice: तुम नाश हो जाओगे
  rationale: मध्यम-वाच्य भविष्यकाल के इस रूप में विनाश या नष्ट हो जाने की चेतावनी है; हिन्दी में इसे स्वाभाविक भविष्यकाल से व्यक्त किया गया है।
theological_decisions:
- issue: अंश में कर्मकारक पदों के साथ अपेक्षित क्रिया का न होना
  choice: दीर्घ विराम-चिह्न द्वारा वाक्य की अपूर्णता बनाए रखी गई
  alternative: ‘सत्य और धीरज को त्याग दोगे, तो तुम नाश हो जाओगे’ जैसे शब्द जोड़ना
  rationale: उपलब्ध यूनानी अंश में ‘त्यागना’, ‘प्रेम करना’ अथवा निषेध की कोई स्पष्ट क्रिया नहीं है; अतः ऐसी क्रिया जोड़कर अर्थगत और धर्मवैचारिक संबंध निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। आरंभिक त्रिबिंदु उपलब्ध पाठ के खंडित संदर्भ को और दीर्घ विराम यूनानी में उपस्थित व्याकरणिक असंगति को संकेत करता है।
