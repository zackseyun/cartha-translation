    issue: Vocative spelling
    rationale: ‘मेरे बच्चो’ should be spelled ‘मेरे बच्चों’ in standard Hindi orthography.
  - severity: medium
    issue: The verb is too weak
    rationale: ‘अशांत कर देता है’ understates ἐκταράσσει, which denotes severe disturbance or turmoil; ‘उथल-पुथल में डाल देता है’ more closely reflects the source and English audit trail.
  revised_text: क्योंकि, मेरे बच्चों, क्रोध बुरा है; वह आत्मा तक को उथल-पुथल में डाल देता है।
