  text: III. *Καὶ γὰρ πονηρὸς ὁ θυμός¹, τέκνα μου, *ὡς καὶ αὐτὴν τὴν ψυχὴν ἐκταράσσει².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/006.yaml
  text: For anger is evil, my children, because it throws even the soul itself into turmoil.
translation:
  language: hi
  text: क्योंकि, मेरे बच्चों, क्रोध बुरा है; वह आत्मा तक को उथल-पुथल में डाल देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρός
  choice: बुरा
  rationale: यहाँ नैतिक रूप से हानिकारक और दुष्ट प्रभाव वाले क्रोध का सामान्य, सहज वर्णन है; ‘बुरा’ मूल की व्यापकता बनाए रखता है।
- source_word: θυμός
  choice: क्रोध
  rationale: संदर्भ में यह तीव्र रोष या गुस्से को दर्शाता है; dignified आधुनिक हिन्दी में ‘क्रोध’ उपयुक्त है।
- source_word: ψυχή
  choice: आत्मा
  rationale: ‘आत्मा’ ψυχή के यहाँ प्रयुक्त भीतरी जीवन/स्व के अर्थ को स्वाभाविक रूप से व्यक्त करता है और मूल की धार्मिक-मानवीय गहराई बनाए रखता है।
- source_word: ἐκταράσσει
  choice: अशांत कर देता है
  rationale: क्रिया गहराई से विचलित या उथल-पुथल में डालने का भाव देती है; यह चयन प्रभाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ψυχή का अर्थ-क्षेत्र
  choice: आत्मा
  alternative: प्राण / मन
  rationale: मूल शब्द व्यक्ति के भीतरी जीवन या स्वयं व्यक्ति को सूचित कर सकता है। ‘आत्मा’ धार्मिक साहित्य के इस प्रसंग में स्वाभाविक है, पर इसे किसी विशिष्ट दार्शनिक आत्मा-शरीर सिद्धांत तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक लहजा रखा गया है। ‘मेरे बच्चो’ प्रत्यक्ष संबोधन को स्वाभाविक ढंग से बनाए रखता है; ‘स्वयं आत्मा तक’ καὶ αὐτὴν τὴν ψυχήν के बलाघात को व्यक्त करता है।
