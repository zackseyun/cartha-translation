base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
translation:
  language: hi
  text: 'इसलिए क्रोधित व्यक्ति, यदि वह शरीर से बलवान है, तो अपने क्रोध में तीन गुनी शक्ति रखता है: पहली, सहायकों की मदद से; दूसरी, धन के द्वारा, अन्यायपूर्वक मनाकर और जीतकर; और तीसरी, स्वाभाविक शक्ति रखकर—उसी के द्वारा वह बुराई करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θυμούμενος
  choice: जो व्यक्ति क्रोध करता है
  rationale: वर्तमान कृदन्त क्रोध की अवस्था या क्रिया में पड़े व्यक्ति को दर्शाता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: δυνατὸς τῷ σώματι
  choice: शरीर से बलवान
  rationale: शारीरिक सामर्थ्य का सीधा और स्रोत-संगत अनुवाद।
- source_word: τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται
  choice: अपने क्रोध में तीन गुनी शक्ति पा लेता है
  rationale: κέκτηται प्राप्त और वर्तमान अधिकार, दोनों का भाव देता है; हिन्दी में ‘पा लेता है’ इस प्रसंग के कारणात्मक प्रवाह को सहज रखता है।
- source_word: τῶν ὑπουργούντων
  choice: उसकी सहायता करनेवालों
  rationale: शब्द उन लोगों को सूचित करता है जो सेवा या सहायता देते हैं; ‘सहायता करनेवाले’ आधुनिक पाठक के लिए व्यापक और स्वाभाविक है।
- source_word: διὰ τοῦ πλούτου
  choice: धन के बल पर
  rationale: यहाँ धन को प्रभाव डालने के साधन के रूप में दिखाया गया है।
- source_word: πείθων καὶ νικῶν ἀδίκως
  choice: लोगों को मनाकर और अन्यायपूर्वक उन पर हावी होकर
  rationale: दोनों वर्तमान कृदन्त साधन/प्रक्रिया बताते हैं; νικῶν का भाव जीतने या प्रबल होने का है, जिसे प्रसंग में ‘हावी होकर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: φυσικὴν ... δύναμιν
  choice: अपने स्वाभाविक बल
  rationale: जन्मजात या प्राकृतिक शारीरिक सामर्थ्य का भाव बनाए रखता है।
- source_word: δι’ αὐτῆς δρᾷ τὸ κακόν
  choice: उसी के द्वारा वह बुराई करता है
  rationale: स्त्रीलिंग सर्वनाम δύναμιν की ओर लौटता है; अनुवाद साधन और नैतिक कथन दोनों को स्पष्ट रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की त्रिस्तरीय संरचना को ‘पहली… दूसरी… तीसरी’ द्वारा सुरक्षित रखा गया है। कोष्ठकित αὐτόν को मुख्य पाठ में अलग से नहीं दर्शाया गया, क्योंकि उसका पाठ-साक्ष्य अनिश्चित है और हिन्दी में ‘लोगों… उन पर’ क्रिया के अपेक्षित कर्म को स्वाभाविक रूप से स्पष्ट करता है।
