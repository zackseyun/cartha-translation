  to: और वह अपनी आँखों को किससे ढकता है? अपने भाई के विरुद्ध हृदय की घृणा से—ईर्ष्या की ओर।[a]
  rationale: Only the final εἰς-phrase has been adjusted. ‘ईर्ष्या की ओर’ is more idiomatic Hindi than ‘ईर्ष्या तक’ and conveys direction without asserting a definite causal sequence such as ‘जिससे ईर्ष्या उत्पन्न होती है.’
