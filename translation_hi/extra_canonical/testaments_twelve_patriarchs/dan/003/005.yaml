source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐν τίνι δὲ²⁵ περιβάλλει τοὺς ὀφθαλμοὺς αὐτοῦ²⁶; *ἐν μίσει καρδίας²⁷ κατὰ τοῦ ἀδελφοῦ αὐτοῦ²⁸ *εἰς φθόνον²⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/005.yaml
  text: And with what does it cover his eyes? With hatred of heart against his brother, unto envy.
translation:
  language: hi
  text: और वह अपनी आँखों को किससे ढकता है? अपने भाई के विरुद्ध हृदय की घृणा से—ईर्ष्या की ओर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ईर्ष्या की ओर”; यूनानी पद दिशा या परिणति—दोनों का संकेत दे सकता है।
    reason: εἰς φθόνον की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखने और संक्षिप्त हिंदी पदबंध को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: περιβάλλει
  choice: ढकता है
  rationale: क्रिया का मूल भाव किसी वस्तु को चारों ओर से ढकना है; यहाँ आँखों के संदर्भ में ‘ढकता है’ सीधा, स्वाभाविक और मूल के निकट है।
- source_word: μίσει καρδίας
  choice: हृदय की घृणा
  rationale: यह मूल पदबंध की संबंधात्मक बनावट और आंतरिक भाव—दोनों को बनाए रखता है।
- source_word: κατὰ τοῦ ἀδελφοῦ αὐτοῦ
  choice: अपने भाई के विरुद्ध
  rationale: κατά के विरोधात्मक अर्थ और आत्मवाचक संबंध, दोनों का स्पष्ट अनुवाद है।
- source_word: εἰς φθόνον
  choice: ईर्ष्या तक
  rationale: εἰς की दिशा अथवा परिणति को बिना किसी स्पष्ट कारण-परिणाम संबंध को जोड़कर संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: घृणा और ईर्ष्या के बीच संबंध
  choice: ‘ईर्ष्या तक’ के द्वारा संबंध को खुला रखा गया है
  alternative: ‘जिससे ईर्ष्या उत्पन्न होती है’ या ‘जो ईर्ष्या की ओर ले जाती है’
  rationale: मूल यूनानी εἰς दिशा, लक्ष्य या परिणति का संकेत दे सकता है, पर संबंध की प्रक्रिया स्पष्ट नहीं करता; इसलिए किसी निश्चित मनोवैज्ञानिक या नैतिक क्रम को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी। प्रश्न की संक्षिप्त संरचना और उत्तर का तीखा, अलंकारिक प्रभाव बनाए रखा गया है।
