review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders περιβάλλει ('ढकता है'), the opposition in κατὰ τοῦ ἀδελφοῦ αὐτοῦ, and the compressed rhetorical question-and-answer form. However, 'ईर्ष्या तक' normally suggests a limit or extent in Hindi and does not naturally represent εἰς, whose directional/resultative force is better retained by 'ईर्ष्या की ओर.'
  naturalness: The wording is otherwise clear and suitably elevated. Replacing 'ईर्ष्या तक' with 'ईर्ष्या की ओर' removes an unnatural phrase while retaining the Greek's deliberately compressed ending.
  terminology: '''हृदय की घृणा'' is an acceptable formal and dignified rendering of μίσει καρδίας. ''ईर्ष्या'' appropriately renders φθόνος without importing a more specific theological or psychological interpretation.'
  issues:
  - severity: medium
    issue: ‘ईर्ष्या तक’ is semantically and idiomatically unsuitable here.
    rationale: In modern Hindi, ‘तक’ chiefly marks an endpoint (‘up to/as far as’). It does not naturally convey the directional or possibly resultative εἰς. ‘ईर्ष्या की ओर’ preserves the source ambiguity more faithfully.
  revised_text: और वह अपनी आँखों को किससे ढकता है? अपने भाई के विरुद्ध हृदय की घृणा से—ईर्ष्या की ओर।[a]
