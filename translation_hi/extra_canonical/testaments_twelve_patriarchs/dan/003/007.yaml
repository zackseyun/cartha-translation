source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὸ μὲν σῶμα *ἴδιον ποιεῖται³ τοῦ θυμουμένου⁴, *τῆς δὲ ψυχῆς⁵ κατακυριεύει, καὶ παρέχει σώματι⁶· ⌈δύναμιν⌉⁷, ἵνα ποιήσῃ⁸ πᾶσαν⁹ ἀνομίαν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/007.yaml
  text: And it makes the body of the angry man its own, and gains mastery over the soul, and gives the body strength so that it may commit every lawless deed.
translation:
  language: hi
  text: और क्रोध क्रोधी मनुष्य के शरीर को अपना बना लेता है, उसकी आत्मा पर प्रभुत्व करता है, और शरीर को सामर्थ्य देता है, ताकि शरीर हर प्रकार का अधर्म करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμουμένου
  choice: जो क्रोध करता है
  rationale: यह वर्तमान कृदंत का स्वाभाविक हिन्दी रूप है और क्रोध की अवस्था में पड़े व्यक्ति को दर्शाता है।
- source_word: κατακυριεύει
  choice: अधिकार कर लेता है
  rationale: मूल में प्रबल प्रभुत्व या वश में करने का भाव है; यह प्रयोग उसे स्पष्ट और सहज रखता है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: यहाँ आशय शरीर को अधर्म करने की शक्ति देने से है; ‘सामर्थ्य’ dignified और सामान्य बोधगम्य है।
- source_word: πᾶσαν ἀνομίαν
  choice: हर प्रकार का अधर्म
  rationale: शाब्दिक ‘हर अधर्म’ की अपेक्षा यह हिन्दी में स्वाभाविक है और व्यापकता बनाए रखता है।
theological_decisions:
- issue: क्रोध का कर्ता के रूप में व्यक्तिकरण
  choice: क्रोध को पूरे वाक्य का कर्ता बनाए रखा गया
  alternative: इसे केवल मनोवैज्ञानिक अवस्था के रूप में स्पष्ट करना
  rationale: संदर्भ और यूनानी वाक्यरचना क्रोध को ऐसी शक्ति के रूप में चित्रित करती है जो शरीर और आत्मा पर अधिकार करती है; इस तनाव को व्याख्यात्मक ढंग से कम नहीं किया गया।
- issue: ψυχή का अनुवाद
  choice: आत्मा
  alternative: प्राण या मन
  rationale: ‘आत्मा’ मूल की व्यापक मानवीय आंतरिक सत्ता को बनाए रखता है और पाठ में शरीर के साथ उसके विरोध को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। यूनानी के व्यक्तिकरण और शरीर–आत्मा संबंध को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
