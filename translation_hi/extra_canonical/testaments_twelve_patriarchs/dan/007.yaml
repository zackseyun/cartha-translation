base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007.yaml
  text: 'And when he had said these things, he kissed them affectionately and fell asleep in a good sleep.

    2 And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.

    3 Nevertheless, Dan prophesied to them that they would forget their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring.'
translation:
  language: hi
  text: '7 ये बातें कहने के बाद उसने उन्हें स्नेह से चूमा और एक सुखद नींद में सो गया।


    2 उसके पुत्रों ने उसे दफ़नाया। इसके बाद वे उसकी हड्डियाँ ऊपर उस स्थान पर ले गए जहाँ अब्राहम, इसहाक और याकूब थे।


    3 फिर भी दान ने उनसे भविष्यवाणी करते हुए कहा कि वे अपने परमेश्वर को भूल जाएँगे और अपनी विरासत की भूमि, इस्राएल के वंश और अपनी संतति के कुल से पराए हो जाएँगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी अंश इस भविष्यवाणी के आरम्भ में खंडित हो जाता है; पद का शेष भाग प्राचीन पाठ की संपादकीय पुनर्स्थापना और उपलब्ध परामर्श-पाठ के अनुसार दिया गया है।
    reason: प्रदत्त मूल-भाषा साक्ष्य में पद 3 के बीच पाठ टूट जाने की सूचना पाठक को देना आवश्यक है।
lexical_decisions:
- source_word: καταφιλήσας
  choice: स्नेह से चूमा
  rationale: क्रिया साधारण चुंबन से बढ़कर आत्मीय और स्नेहपूर्ण चुंबन का भाव व्यक्त करती है।
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: सुखद नींद सो गया
  rationale: मृत्यु के लिए प्रयुक्त मूल रूपक को बनाए रखते हुए καλῷ के सकारात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπήνεγκαν
  choice: ऊपर ... ले गए
  rationale: अंग्रेज़ी परामर्श-पाठ में संरक्षित दिशात्मक भाव को बनाए रखता है, यद्यपि यूनानी क्रिया अपने आप में मुख्यतः वहाँ से ले जाने का अर्थ भी दे सकती है।
- source_word: ἐπιλά...
  choice: अपने परमेश्वर को भूल जाएँगे
  rationale: खंडित यूनानी पाठ और परामर्श-पाठ के आधार पर संभावित ἐπιλήσονται/संबंधित रूप का अर्थ व्यक्त किया गया है।
- source_word: ἀπαλλοτριωθήσεσθε (reconstructed continuation)
  choice: पराए हो जाएँगे
  rationale: भूमि, इस्राएल के लोगों और वंशगत कुल से अलगाव तथा बेगानेपन—दोनों भावों को संक्षेप में रखता है।
theological_decisions:
- issue: ‘नींद’ को मृत्यु के रूपक के रूप में रखना
  choice: सुखद नींद सो गया
  alternative: उसकी शांतिपूर्वक मृत्यु हो गई
  rationale: मूल पाठ मृत्यु को प्रत्यक्ष रूप से नहीं कहता, बल्कि नींद का रूपक रखता है; अनुवाद उसी साहित्यिक और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: इस्राएल से अलगाव की अभिव्यक्ति
  choice: इस्राएल के लोगों ... से पराए हो जाएँगे
  alternative: इस्राएल की जाति से निकाल दिए जाएँगे
  rationale: मूल कथन अलगाव या परायापन बताता है, औपचारिक निष्कासन आवश्यक रूप से नहीं; इसलिए अधिक कठोर संस्थागत अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और कथात्मक है। ‘सो गया’ का मृत्यु-संबंधी रूपक, ‘ऊपर ले गए’ का दिशात्मक भाव और पद 3 का त्रिस्तरीय अलगाव जानबूझकर सुरक्षित रखा गया है।
