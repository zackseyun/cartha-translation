  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005.yaml
  text: '1 Therefore[v6], my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.


    2 Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace[v8], and war will certainly not prevail against you.


    3 Love the Lord throughout all your life, and one another with a true heart.


    4 I know that in the last days you will depart from the Lord, and you will provoke Levi, and you will set yourselves in battle array against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.


    5 And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and the spirits of wickedness working among you in every evil.


    6 For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and of pride will attend on the sons of Levi, to make them sin before the Lord.


    7 And my sons will draw near to Levi and will sin together with them in all things. But the sons of Judah will be greedy, snatching what belongs to others like lions.


    8 Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.


    9 And so, when you return to the Lord, you will receive mercy, and he will bring you into his sanctuary, and he will give you peace.


    10 And for you the salvation of the Lord will arise from the tribe of Judah and of Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.


    11 And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.


    12 And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.


    13 And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst[v13][v12][v11][v10], and the Holy One of Israel will reign over her.'
translation:
  language: hi
  text: '**दान का वसीयतनामा 5**


    1 इसलिए, मेरे बच्चो, प्रभु की आज्ञा का पालन करो और उसकी व्यवस्था को मानो। क्रोध से दूर रहो और झूठ से घृणा करो, ताकि प्रभु तुममें निवास करे और बेलियार तुमसे दूर भागे।


    2 हर एक अपने पड़ोसी से सच बोले। तब तुम प्रचंड क्रोध और उपद्रवों में कदापि नहीं पड़ोगे, बल्कि शांति के परमेश्वर को अपने साथ रखकर शांति में रहोगे, और युद्ध तुम पर कदापि प्रबल नहीं होगा।


    3 अपने पूरे जीवन में प्रभु से प्रेम करो, और सच्चे मन से एक-दूसरे से प्रेम करो।


    4 मैं जानता हूँ कि अंतिम दिनों में तुम प्रभु से दूर हो जाओगे, लेवी को भड़काओगे और यहूदा के विरुद्ध युद्ध के लिए पाँत बाँधकर खड़े होगे; पर तुम उन पर प्रबल न हो सकोगे। क्योंकि प्रभु का एक स्वर्गदूत उन दोनों का मार्गदर्शन करता है, और उन्हीं के द्वारा इस्राएल स्थिर रहेगा।


    5 जब भी तुम प्रभु से दूर हो जाओगे, तब हर प्रकार की दुष्टता की राह पर चलकर अन्यजातियों के घृणित काम करोगे। तुम अधर्मी स्त्रियों के साथ व्यभिचार करोगे और उन दुष्ट आत्माओं की हर प्रकार की बुराई में लगे रहोगे, जो तुम्हारे बीच काम करती हैं।


    6 क्योंकि मैंने धर्मी हनोक की पुस्तक में पढ़ा है[a] और जाना है कि तुम्हारा शासक शैतान है और दुष्टता तथा घमंड की आत्माएँ लेवी के पुत्रों के पास उपस्थित रहेंगी और उन्हें प्रभु के सामने पाप करने को उकसाएँगी।


    7 मेरे पुत्र भी लेवी के निकट जाएँगे और हर बात में उनके साथ पाप करेंगे। पर यहूदा के पुत्र लोभ में पड़कर सिंहों के समान दूसरों की वस्तुएँ छीनेंगे।


    8 इसी कारण तुम उनके साथ[b] बंदी बनाकर ले जाए जाओगे। वहाँ तुम मिस्र की सभी विपत्तियाँ और अन्यजातियों की सभी बुराइयाँ झेलोगे।


    9 फिर जब तुम प्रभु की ओर लौटोगे, तो तुम पर दया की जाएगी। वह तुम्हें अपने पवित्रस्थान में ले जाएगा और तुम्हें शांति देगा।


    10 तब तुम्हारे लिए यहूदा और लेवी के गोत्र से प्रभु का उद्धार उदित होगा।[c] क्योंकि वह स्वयं बेलियार से युद्ध करेगा और तुम्हारे पूर्वजों को विजय का प्रतिशोध प्रदान करेगा।


    11 वह बेलियार से बंदियों को—अर्थात पवित्र जनों के प्राणों को—छुड़ा लेगा,[d] अवज्ञाकारी हृदयों को प्रभु की ओर फेर देगा, और जो उसे पुकारते हैं उन्हें अनन्त शांति देगा।


    12 पवित्र जन अदन में विश्राम करेंगे और धर्मी लोग नई यरूशलेम के कारण आनन्द मनाएँगे,[e] जो परमेश्वर की अनन्त महिमा है।


    13 फिर यरूशलेम को उजाड़ नहीं सहना पड़ेगा और इस्राएल को बंदी बनाकर नहीं ले जाया जाएगा, क्योंकि प्रभु उसके बीच में रहेगा और इस्राएल का पवित्र जन उस पर राज्य करेगा।[f]


    **पादटिप्पणियाँ**


    [a] यूनानी पाठ में “धर्मी हनोक की पुस्तक” का स्पष्ट उल्लेख है। यह संभवतः दूसरे मन्दिर-कालीन यहूदी समाज में प्रचलित हनोक-परम्पराओं की ओर संकेत करता है।


    [b] कुछ पाठ-साक्षियों में “उनके साथ” शब्द नहीं हैं। जहाँ ये शब्द हैं, वहाँ लेवी और यहूदा के साथ दान के वंशजों का संबंध और अधिक स्पष्ट हो जाता है।


    [c] “यहूदा और लेवी के गोत्र से” में “यहूदा और” पाठ की दृष्टि से अनिश्चित है; फिर भी दोनों गोत्रों का संयुक्त उल्लेख पांडुलिपि-परम्परा में अच्छी तरह प्रमाणित है। “प्रभु का उद्धार” यूनानी में खुली अभिव्यक्ति है; उसका संकेत उद्धार की घटना की ओर भी हो सकता है और उसे लाने वाले व्यक्ति की ओर भी।


    [d] “अर्थात पवित्र जनों के प्राणों को” कुछ पाठ-साक्षियों में अनिश्चित है। यह वाक्यांश स्पष्ट करता है कि बेलियार की बंधुआई से व्यक्तियों को छुड़ाया जाता है।


    [e] “नई यरूशलेम” पुनर्स्थापित और महिमामय सिय्योन की भावी छवि है, केवल वर्तमान ऐतिहासिक नगर का वर्णन नहीं।


    [f] कुछ पाठ-साक्षी आगे यह भी कहते हैं कि प्रभु मनुष्यों के साथ रहेगा और दीनता तथा निर्धनता में राज्य करेगा; साथ ही, उस पर विश्वास करने वाला मनुष्यों के बीच सत्य से राज्य करेगा। इन वाक्यांशों को प्रायः बाद का विस्तार माना जाता है, इसलिए इन्हें मुख्य पाठ में नहीं रखा गया है।'
  philosophy: optimal-equivalence
