lexical_decisions:
- source_word: φυλάξατε / τηρήσατε
  choice: आज्ञा का पालन करो / व्यवस्था को मानो
  rationale: दो निकटार्थक क्रियाओं का भेद स्वाभाविक हिन्दी में रखा गया है, ताकि यूनानी समानांतरता बनी रहे पर अनावश्यक यांत्रिक पुनरावृत्ति न हो।
- source_word: θυμός
  choice: क्रोध
  rationale: नैतिक उपदेश के प्रसंग में यह सामान्य, स्पष्ट और पर्याप्त रूप से प्रभावशाली आधुनिक हिन्दी शब्द है।
- source_word: ψεῦδος
  choice: झूठ
  rationale: यह किसी एक झूठे कथन से बढ़कर असत्य की प्रवृत्ति को सूचित करता है; आधुनिक हिन्दी में ‘झूठ’ इस व्यापक नैतिक अर्थ को स्वाभाविक रूप से वहन करता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी साक्ष्य में प्राप्त नामरूप को रखा गया है; इसे अधिक परिचित इब्रानी-आधारित ‘बेलियाल’ में सामान्यीकृत नहीं किया गया।
- source_word: μῆνις / ταραχαί
  choice: प्रचंड क्रोध / उपद्रव
