  to: '**दान का वसीयतनामा 4**


    **1.** इसलिए क्रोध की शक्ति को समझो: वह व्यर्थ है।[a]


    **2.** क्योंकि वह पहले किसी बात से भड़कता है; फिर कामों के द्वारा क्रोधित हो रहे व्यक्ति को बल देता है; और कटु हानियों के द्वारा उसके सोच-विचार को अस्त-व्यस्त कर देता है। इस प्रकार वह उसकी आत्मा को बड़े क्रोध में भड़का देता है।


    **3.** इसलिए जब कोई तुम्हारे विरुद्ध बोले, तो क्रोध में मत आओ; और यदि कोई तुम्हें पवित्र कहकर तुम्हारी प्रशंसा करे, तो घमंड से मत फूलो। न आनंद की ओर बदलो, न अरुचि की ओर।


    **4.** क्योंकि पहले वह कानों को सुखद लगता है, और फिर मन को उस उकसावे को समझने के लिए तीखा कर देता है;[b] और क्रोधित हो जाने पर मनुष्य सोचता है कि उसका क्रोध करना उचित है।


    **5.** लेकिन, हे बच्चो, यदि तुम्हें कोई हानि हो या तुम किसी विनाश में पड़ो, तो घबराओ मत। क्योंकि यही आत्मा नष्ट हो रही वस्तु के लिए लालसा उत्पन्न करती है, ताकि व्यक्ति उस पीड़ा के कारण क्रोध में पड़ जाए।


    **6.** और यदि तुम्हें जानबूझकर या अनजाने में हानि उठानी पड़े, तो दुखी मत हो; क्योंकि दुःख से क्रोध भी झूठ के साथ उठता है।[c]


    **7.** झूठ के साथ क्रोध दो-मुँही बुराई है; और वे दोनों एक-दूसरे से मिलते हैं, ताकि हृदय को व्याकुल करें। और जब आत्मा लगातार व्याकुल रहती है, तो प्रभु उससे दूर हो जाता है और बेलियार[d] उस पर अधिकार कर लेता है।'
