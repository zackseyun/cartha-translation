  text: '1[a]. For anger is blindness. It does not allow one to see the face of any man with truth.


    2. For first it is stirred up by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it provokes him. It throws his purpose into confusion, and so it rouses his soul in great fury.


    3[b]. Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.


    4. For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.


    5. But if you fall into any loss or ruin, children, do not be distressed. For this very spirit makes one desire to be angry over what is perishing, so that he may fall into anger through affliction.


    6. And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.


    7. And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it[c][d], and Beliar rules over it.'
translation:
  language: hi
  text: '**दान का वसीयतनामा 4**


    **1.** इसलिए क्रोध की शक्ति को समझो: वह व्यर्थ है।[a]


    **2.** क्योंकि वह पहले किसी बात से भड़कता है; फिर कामों के द्वारा क्रोधित हो रहे व्यक्ति को बल देता है; और कटु हानियों के द्वारा उसके सोच-विचार को अस्त-व्यस्त कर देता है। इस प्रकार वह उसकी आत्मा को बड़े क्रोध में भड़का देता है।


    **3.** इसलिए जब कोई तुम्हारे विरुद्ध बोले, तो क्रोध में मत आओ; और यदि कोई तुम्हें पवित्र कहकर तुम्हारी प्रशंसा करे, तो घमंड से मत फूलो। न आनंद की ओर बदलो, न अरुचि की ओर।


    **4.** क्योंकि पहले वह कानों को सुखद लगता है, और फिर मन को उस उकसावे को समझने के लिए तीखा कर देता है;[b] और क्रोधित हो जाने पर मनुष्य सोचता है कि उसका क्रोध करना उचित है।


    **5.** लेकिन, हे बच्चो, यदि तुम्हें कोई हानि हो या तुम किसी विनाश में पड़ो, तो घबराओ मत। क्योंकि यही आत्मा नष्ट हो रही वस्तु के लिए लालसा उत्पन्न करती है, ताकि व्यक्ति उस पीड़ा के कारण क्रोध में पड़ जाए।


    **6.** और यदि तुम्हें जानबूझकर या अनजाने में हानि उठानी पड़े, तो दुखी मत हो; क्योंकि दुःख से क्रोध भी झूठ के साथ उठता है।[c]


    **7.** झूठ के साथ क्रोध दो-मुँही बुराई है; और वे दोनों एक-दूसरे से मिलते हैं, ताकि हृदय को व्याकुल करें। और जब आत्मा लगातार व्याकुल रहती है, तो प्रभु उससे दूर हो जाता है और बेलियार[d] उस पर अधिकार कर लेता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध यूनानी पाठ का अर्थ है, “क्रोध की शक्ति को समझो: वह व्यर्थ है।” कुछ परंपराओं में इस स्थान पर क्रोध को “अंधापन” बताने वाला भिन्न या विस्तृत पाठ मिलता है।'
    reason: textual_variant
  - marker: b
    text: यहाँ यूनानी पाठ कठिन है। “उस उकसावे को समझने” के स्थान पर “जो भड़क उठा है उसे समझने” या “चिढ़ को पहचानने” का अर्थ भी संभव है।
    reason: alternative_reading
  - marker: c
    text: “झूठ के साथ” का अर्थ यह हो सकता है कि क्रोध छल के साथ उठता है, या यह कि दुःख से उठा क्रोध बाद में झूठ द्वारा और प्रबल होता है।
    reason: alternative_reading
  - marker: d
    text: “बेलियार” यहूदी साहित्य में दुष्ट शक्ति या विरोधी का पारंपरिक नाम है; कुछ परंपराओं में इसका रूप “बेलियाल” मिलता है।
    reason: cultural_note
lexical_decisions:
- source_word: θυμός
  choice: क्रोध
  rationale: यह सामान्य आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में तीव्र रोष तथा उसके नैतिक प्रभाव, दोनों को व्यक्त करता है।
- source_word: ματαία
  choice: व्यर्थ
  rationale: यूनानी विशेषण की निष्फलता या खोखलेपन की धारणा को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: παροξύνεται
  choice: भड़कता है
  rationale: वाणी द्वारा क्रोध के आरम्भिक रूप से उकसाए जाने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: δυναμοῖ
  choice: बल देता है
  rationale: पाठ में कर्मों द्वारा क्रोधित व्यक्ति को और समर्थ या प्रबल किए जाने की छवि को बनाए रखता है।
- source_word: ζημίαις πικραῖς
  choice: कटु हानियों के द्वारा
  rationale: भौतिक या अनुभवजन्य क्षति को खुला रखते हुए उसके कष्टदायक प्रभाव को व्यक्त करता है।
- source_word: διαβούλιον
  choice: सोच-विचार
  rationale: विवेकपूर्ण विचार, परामर्श या निश्चय की प्रक्रिया को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κινεῖσθε εἰς ὀργήν
  choice: क्रोध में मत आओ
  rationale: यूनानी के गति-संबंधी भाव का स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἐπαίρεσθε
  choice: घमंड से मत फूलो
  rationale: प्रशंसा के कारण स्वयं को ऊँचा समझने की चेतावनी को स्पष्ट और मुहावरेदार बनाता है।
- source_word: τέρψιν / ἀηδίαν
  choice: आनंद / अरुचि
  rationale: विपरीत भावनात्मक दिशाओं को गरिमापूर्ण और समझने योग्य हिन्दी में रखता है; ἀηδία को अत्यधिक तीव्र 'घृणा' तक सीमित नहीं करता।
- source_word: ὀξύνει τὸν νοῦν
  choice: मन को ... तीखा कर देती है
  rationale: मानसिक तीक्ष्णता की मूल रूपक-छवि को सुरक्षित रखता है।
- source_word: ἐκθροεῖσθε
  choice: घबराओ मत
  rationale: हानि के कारण व्याकुल या विचलित हो जाने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यह पारंपरिक नाम है; इसे सामान्य नैतिक संज्ञा में बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: क्रोध की शक्ति के विषय में आरम्भिक वाक्य
  choice: 'उपलब्ध यूनानी पाठ के अनुसार ''क्रोध की शक्ति को समझो: वह व्यर्थ है'''
  alternative: '''क्रोध अंधापन है; वह किसी मनुष्य का मुख सच्चाई से देखने नहीं देता'''
  rationale: प्रस्तुत यूनानी साक्ष्य में δύναμιν τοῦ θυμοῦ और ματαία ἐστίν स्पष्ट हैं। अंग्रेज़ी परामर्श-पाठ संभवतः दूसरी पाठ-परंपरा या पुनर्निर्माण को दर्शाता है; उसे यूनानी के स्थान पर मुख्य पाठ नहीं बनाया गया।
- issue: '''आत्मा'' की नैतिक-आध्यात्मिक भूमिका'
  choice: पद 5 में πνεῦμα को 'आत्मा' रखा गया
  alternative: इसे केवल 'प्रवृत्ति' या 'आवेग' कहना
  rationale: ग्रंथ मनोवैज्ञानिक और आत्मिक, दोनों प्रकार की भाषा को साथ रखता है; 'आत्मा' स्रोत की व्यक्तिकृत आध्यात्मिक धारणा को सुरक्षित रखता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा या स्वामी
  rationale: स्रोत केवल Κύριος देता है; 'प्रभु' धार्मिक गरिमा बनाए रखता है और किसी अधिक विशिष्ट पहचान को पाठ पर आरोपित नहीं करता।
- issue: बेलियार की सत्ता
  choice: व्यक्तिवाचक नाम बनाए रखते हुए 'उस पर अधिकार कर लेता है'
  alternative: इसे रूपकात्मक 'बुराई उस पर छा जाती है' बनाना
  rationale: यूनानी में ὁ Βελίαρ कर्ता के रूप में है; नाम को बनाए रखना ग्रंथ की आत्मिक संघर्ष की भाषा को कम नहीं करता।
- issue: प्रभु का व्याकुल आत्मा से दूर होना
  choice: स्रोत की तनावपूर्ण भाषा को सीधे बनाए रखा
  alternative: इसे केवल अनुभवजन्य दूरी, जैसे 'मनुष्य प्रभु की उपस्थिति अनुभव नहीं करता', के रूप में समझाना
  rationale: ἀφίσταται ὁ Κύριος का कथन स्पष्ट है। अनुवाद किसी बाद की व्यवस्थित धर्मशास्त्रीय व्याख्या द्वारा इसे नरम या पुनर्परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण उपदेशात्मक शैली। वाक्य साधारण पाठकों के लिए स्पष्ट रखे गए हैं, पर आत्मा, प्रभु और बेलियार जैसी स्रोत की धार्मिक भाषा को मनोवैज्ञानिक रूपकों में नहीं घटाया गया। बहुवचन संबोधन के लिए 'तुम' रूप अपनाया गया है; पद 5 का τέκνα बिना अस्रोत 'मेरे' जोड़े 'हे बच्चो' किया गया है।
