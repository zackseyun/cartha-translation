source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/001.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother.'
translation:
  language: hi
  text: और अब, मेरे बच्चो, देखो[a], मैं मर रहा हूँ; और मैं तुमसे सच कहता हूँ कि यदि तुम अपने आपको असत्य और क्रोध की आत्मा से न बचाए रखो, और सत्य तथा दीर्घ-सहनशीलता से प्रेम न करो, तो तुम नष्ट हो जाओगे। क्योंकि क्रोध अंधापन है, और वह किसी मनुष्य को किसी का चेहरा सच्चाई से देखने नहीं देता। चाहे वह पिता हो या माता, वह उनके साथ शत्रुओं जैसा व्यवहार करता है; चाहे वह भाई हो, वह उसे नहीं पहचानता; चाहे वह प्रभु का भविष्यद्वक्ता हो, वह उसकी आज्ञा नहीं मानता; चाहे वह धर्मी मनुष्य हो, वह उसका आदर नहीं करता; और चाहे वह मित्र हो, वह उसे स्वीकार नहीं करता। क्योंकि क्रोध की आत्मा उसे छल के जालों से घेर लेती है, उसकी आँखों को अंधा कर देती है, असत्य के द्वारा उसकी बुद्धि को अंधकारमय कर देती है, और उसे अपनी विशेष दृष्टि देती है। वह उसकी आँखों को किससे घेरती है? हृदय की घृणा से, ताकि वह अपने भाई से ईर्ष्या करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘देखो’ (ἰδού) पर चिह्न है।
    reason: चिह्न को उसके मूल यूनानी शब्द के समतुल्य हिन्दी शब्द के साथ रखा गया है।
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन में पारिवारिक स्नेह और स्वाभाविक आधुनिक हिन्दी दोनों बनाए रखता है।
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: झूठ और क्रोध की आत्मा
  rationale: दोनों संबंधवाचक पदों को एक संयुक्त आत्मिक शक्ति के रूप में व्यक्त करते हुए यूनानी संरचना का तनाव बनाए रखा गया है।
- source_word: τὴν μακροθυμίαν
  choice: धीरज
  rationale: यहाँ क्रोध के विपरीत दीर्घ-सहनशीलता अभिप्रेत है; ‘धीरज’ सामान्य पाठक के लिए स्वाभाविक और अर्थपूर्ण है।
- source_word: ἀπολεῖσθε
  choice: तुम नष्ट हो जाओगे
  rationale: क्रिया के प्रबल परिणामार्थ को बिना यह तय किए सुरक्षित रखता है कि विनाश शारीरिक है, नैतिक है या अंतिम।
- source_word: peculiar vision
  choice: अपनी ही विकृत दृष्टि
  rationale: 'अंग्रेज़ी परामर्श-पाठ के भाव को स्वाभाविक हिन्दी में व्यक्त करता है: क्रोध व्यक्ति पर अपनी विशिष्ट, वास्तविकता-विकृत करने वाली दृष्टि आरोपित करता है।'
theological_decisions:
- issue: ‘झूठ और क्रोध की आत्मा’ का स्वरूप
  choice: आत्मा
  alternative: प्रवृत्ति / भाव
  rationale: यूनानी πνεῦμα का औपचारिक और संभावित व्यक्तिक अर्थ सुरक्षित रखा गया है; इसे केवल मनोवैज्ञानिक प्रवृत्ति मानकर सीमित नहीं किया गया।
- issue: ‘नष्ट हो जाओगे’ का आशय
  choice: अर्थ को खुला रखा गया
  alternative: मर जाओगे / अनन्त विनाश पाओगे
  rationale: मूल क्रिया विनाश बताती है, पर इस वाक्य में उसके प्रकार या अवधि को स्पष्ट नहीं करती।
- issue: क्रोध की आत्मा के लिए सर्वनाम
  choice: स्त्रीलिंग ‘वह’
  alternative: पुल्लिंग या नपुंसक पुनरुक्ति
  rationale: हिन्दी में ‘आत्मा’ व्याकरणतः स्त्रीलिंग है; इससे उस सत्ता की प्रकृति पर कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उपलब्ध यूनानी अंश सीधे पहले वाक्य का समर्थन करता है; शेष अंश का हिन्दी रूप अंग्रेज़ी POB परामर्श-पाठ के आधार पर तैयार किया गया है, क्योंकि दिए गए verse-level यूनानी स्रोत में वह भाग संरेखित नहीं है।
