source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/004.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry.
translation:
  language: hi
  text: और अब, मेरे बच्चो, देखो, मैं मर रहा हूँ; और मैं तुमसे सच-सच कहता हूँ कि यदि तुम अपने आपको झूठ और क्रोध की आत्मा से नहीं बचाओगे और सत्य तथा धैर्य से प्रेम नहीं करोगे, तो तुम नष्ट हो जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: प्रत्यक्ष पारिवारिक संबोधन को आधुनिक, सहज और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: ἰδοὺ ἐγὼ ἀποθνῄσκω
  choice: देखो, मैं मरने वाला हूँ
  rationale: ἰδού की ध्यान आकर्षित करने वाली शक्ति और वर्तमान काल में निकट आती मृत्यु—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἀληθείᾳ λέγω ὑμῖν
  choice: मैं तुमसे सच-सच कहता हूँ
  rationale: सत्यता पर दिए गए बल को हिन्दी की प्रचलित बलाघाती अभिव्यक्ति से स्पष्ट किया गया है।
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: अपने आपको ... से नहीं बचाओगे
  rationale: आत्म-सावधानी और किसी हानिकारक प्रभाव से दूर रहने, दोनों भावों को संप्रेषित करता है।
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: झूठ और क्रोध की आत्मा
  rationale: एकवचन πνεύματος को बनाए रखते हुए ψεύδους और θυμοῦ दोनों को उससे संबद्ध रखा गया है।
- source_word: μακροθυμίαν
  choice: सहनशीलता
  rationale: यहाँ दीर्घ धैर्य, उकसावे को सहने और क्रोध रोकने के नैतिक भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπολεῖσθε
  choice: तुम नष्ट हो जाओगे
  rationale: भविष्यकालीन कठोर चेतावनी को बिना नरम किए व्यक्त किया गया है।
theological_decisions:
- issue: ‘आत्मा’ का स्वरूप
  choice: ‘झूठ और क्रोध की आत्मा’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे केवल ‘झूठ और क्रोध की प्रवृत्ति’ कहना।
  rationale: πνεῦμα वास्तविक आत्मिक सत्ता या प्रभाव, अथवा मनोवृत्ति—दोनों की ओर संकेत कर सकता है; ‘प्रवृत्ति’ चुनने से मूल की वास्तविक अस्पष्टता समय से पहले समाप्त हो जाती।
- issue: अंतिम विनाश की प्रकृति
  choice: ‘नष्ट हो जाओगे’
  alternative: ‘बरबाद हो जाओगे’ या इसे अनन्त दण्ड के रूप में स्पष्ट करना।
  rationale: ἀπόλλυμι के प्रबल अर्थ को रखा गया है, पर पाठ जितना कहता है उससे आगे बढ़कर विनाश की अवधि या अंतिम स्वरूप निर्धारित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, प्रत्यक्ष और चेतावनीपूर्ण है। ‘मेरे बच्चो’ में पितृवत आत्मीयता, ‘सच-सच’ में गंभीर आश्वासन, और शर्तीय वाक्य में मूल यूनानी की नैतिक तात्कालिकता बनाए रखी गई है। उपलब्ध यूनानी स्रोत को प्राथमिक मानते हुए असंबद्ध पुराने अंग्रेज़ी पाठ का अनुसरण नहीं किया गया।
