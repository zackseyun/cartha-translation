base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/005.yaml
  text: If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.
translation:
  language: hi
  text: और अब, मेरे बच्चो, देखो, मैं मर रहा हूँ; और मैं तुमसे सच कहता हूँ कि यदि तुम अपने आप को झूठ और क्रोध की आत्मा से सुरक्षित न रखो, और सत्य तथा धीरज से प्रेम न करो, तो नष्ट हो जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: स्नेहपूर्ण प्रत्यक्ष संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἰδοὺ ἐγὼ ἀποθνῄσκω
  choice: देखो, मैं मरने पर हूँ
  rationale: ἰδού का ध्यानाकर्षक बल और वर्तमान में निकट आती मृत्यु—दोनों सुरक्षित रहते हैं।
- source_word: φυλάξητε ἑαυτούς
  choice: अपने आपको ... बचाए रखोगे
  rationale: आत्म-संरक्षण और निरंतर सावधानी के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: झूठ और क्रोध की आत्मा
  rationale: यूनानी संबंध-रचना को बनाए रखता है और दोनों दुर्गुणों को एक ही ‘आत्मा’ से संबद्ध बताने की संभावित अस्पष्टता को नहीं मिटाता।
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: यहाँ क्रोध के विपरीत दीर्घ-सहनशीलता और संयम का व्यापक, सामान्य-बोधगम्य शब्द है।
- source_word: ἀπολεῖσθε
  choice: नष्ट हो जाओगे
  rationale: क्रिया के प्रबल विनाशकारी परिणाम को बिना अनावश्यक धार्मिक व्याख्या जोड़े व्यक्त करता है।
theological_decisions:
- issue: ‘झूठ और क्रोध की आत्मा’ का व्यक्तिक अथवा नैतिक अर्थ
  choice: मूल की एकवचन ‘आत्मा’ वाली संरचना बनाए रखी गई
  alternative: ‘झूठ और क्रोध की प्रवृत्ति’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि यह कोई व्यक्तिगत दुष्ट सत्ता है या नैतिक प्रभाव; ‘आत्मा’ दोनों संभावनाएँ खुली रखता है।
- issue: शर्त-वाक्य का संबंध
  choice: ‘नहीं बचाए रखोगे’ और ‘प्रेम नहीं करोगे’—दोनों को विनाश की संयुक्त शर्त के रूप में प्रस्तुत किया
  alternative: केवल आत्मा से न बचने को विनाश की शर्त मानना
  rationale: यूनानी ἐὰν μή के प्रभाव में दोनों समन्वित क्रियाएँ आती हैं; हिन्दी में दूसरा निषेध जोड़ने से अभिप्रेत अर्थ स्पष्ट होता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की चेतावनीपूर्ण गंभीरता और मूल की धार्मिक अस्पष्टता सुरक्षित हैं।
