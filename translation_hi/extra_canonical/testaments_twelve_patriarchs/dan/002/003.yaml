source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/003.yaml
  text: This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath.
translation:
  language: hi
  text: और अब, मेरे बच्चो, देखो, मैं मर रहा हूँ; और मैं तुमसे सच कहता हूँ कि जब तक तुम अपने आपको झूठ और क्रोध की आत्मा से नहीं बचाओगे और सत्य तथा धीरज से प्रेम नहीं करोगे, तब तक तुम नाश हो जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह संबोधन में ध्यान खींचने वाले यूनानी उद्गार का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: φυλάξητε ἑαυτοὺς
  choice: अपने आप को ... बचाए रखोगे
  rationale: मध्यवाच्य अर्थ को बनाए रखते हुए स्वयं को किसी हानिकारक प्रभाव से सुरक्षित रखने का भाव व्यक्त करता है।
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: झूठ और क्रोध की आत्मा
  rationale: मूल में ‘आत्मा’ एकवचन है और ‘झूठ’ तथा ‘क्रोध’ दोनों उससे जुड़े हैं; अनुवाद इसी संरचना को बिना अलग-अलग आत्माएँ मान लिए सुरक्षित रखता है।
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: यहाँ शब्द क्रोध के विपरीत दीर्घ-सहनशीलता और संयम का बोध देता है; ‘धीरज’ आधुनिक सामान्य हिन्दी में सहज है।
- source_word: ἀπολεῖσθε
  choice: नाश हो जाओगे
  rationale: मूल की कठोर परिणति को नरम किए बिना व्यक्त करता है और यह तय नहीं करता कि नाश का सटीक स्वरूप क्या है।
theological_decisions:
- issue: ‘आत्मा’ का स्वरूप
  choice: ‘झूठ और क्रोध की आत्मा’ को मूल की तरह अनिर्दिष्ट रखा गया
  alternative: इसे स्पष्ट रूप से कोई दुष्ट आत्मिक सत्ता, मनोवृत्ति, या शैतान से संबंधित शक्ति कहना
  rationale: यूनानी पाठ स्वयं यहाँ इस आत्मा की सत्ता या प्रकृति को अधिक स्पष्ट नहीं करता; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- issue: ‘नाश’ का अर्थ
  choice: ‘नाश हो जाओगे’
  alternative: इसे शारीरिक मृत्यु, अनन्त दण्ड, या नैतिक पतन के रूप में स्पष्ट करना
  rationale: ἀπολεῖσθε परिणाम को प्रबल रूप में कहता है, पर उपलब्ध अंश उसके प्रकार को निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और पितृसुलभ चेतावनी का स्वर रखा गया है। उपलब्ध यूनानी अंश का पूरा वाक्य अनूदित किया गया है; असंगत अंग्रेज़ी परामर्श-पाठ के बजाय मूल-भाषा साक्ष्य को प्राथमिकता दी गई है।
