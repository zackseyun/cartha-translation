source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/002.yaml
  text: 'Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing.'
translation:
  language: hi
  text: और अब, मेरे बच्चो, देखो, मैं मर रहा हूँ। मैं तुमसे सच कहता हूँ कि यदि तुम अपने आपको झूठ की आत्मा और क्रोध से नहीं बचाए रखोगे, और सत्य तथा सहनशीलता से प्रेम नहीं करोगे, तो तुम नाश हो जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: पितृसुलभ संबोधन को आधुनिक, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἰδοὺ ἐγὼ ἀποθνῄσκω
  choice: देखो, मैं मरने पर हूँ
  rationale: ἰδού की ध्यान आकर्षित करने वाली शक्ति और वर्तमान काल में निकट आती मृत्यु—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: अपने आप को ... से बचाए रखोगे
  rationale: आत्म-सावधानी और निरंतर रक्षा के भाव को स्पष्ट करता है।
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: झूठ और क्रोध की आत्मा
  rationale: ग्रीक संबंध-रचना को यथासंभव बनाए रखता है और 'आत्मा' को केवल मनोवृत्ति कहकर सीमित नहीं करता।
- source_word: μακροθυμίαν
  choice: सहनशीलता
  rationale: क्रोध के विपरीत लंबे समय तक धैर्यपूर्वक सहने के गुण को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπολεῖσθε
  choice: तुम नाश हो जाओगे
  rationale: क्रिया की गंभीर परिणति को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: ‘झूठ और क्रोध की आत्मा’ का स्वरूप
  choice: ‘आत्मा’ शब्द को स्पष्ट व्याख्या के बिना बनाए रखा गया
  alternative: ‘झूठ और क्रोध की प्रवृत्ति’
  rationale: πνεῦμα किसी आत्मिक सत्ता या प्रभाव अथवा मनोवृत्ति की ओर संकेत कर सकता है; अनुवाद इस वास्तविक अस्पष्टता को किसी एक अर्थ में सीमित नहीं करता।
- issue: शर्त में नकार का विस्तार
  choice: ‘नहीं बचाए रखोगे’ और ‘प्रेम नहीं करोगे’ दोनों को विनाश की संयुक्त शर्त के रूप में व्यक्त किया
  alternative: नकार को केवल पहले खंड तक सीमित रखना
  rationale: ग्रीक ἐὰν μή के अंतर्गत दोनों समन्वित क्रियाएँ आती हैं; हिन्दी में दूसरा ‘नहीं’ जोड़ने से आशय स्पष्ट और स्वाभाविक होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; पितृसुलभ संबोधन, गंभीर चेतावनी और वसीयतनुमा स्वर को सरल किंतु गरिमापूर्ण भाषा में रखा गया है।
