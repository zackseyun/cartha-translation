    **6** पर इस्राएल की अधर्ममयता के समय प्रभु उनसे दूर नहीं होगा, बल्कि उस जाति के पास चला जाएगा जो उसकी इच्छा की खोज करती है; क्योंकि कोई भी स्वर्गदूत उसके समान न होगा।[b] **7** और उसका नाम इस्राएल में हर स्थान पर और अन्य जातियों के बीच होगा।


    **8** इसलिए, मेरे बच्चो, अपने आपको हर बुरे काम से बचाए रखो। क्रोध और झूठ को अपने बीच से दूर कर दो, और सत्य तथा धीरज से प्रेम करो। **9** तुमने अपने पिता से जो बातें सुनी हैं, उन्हें अपने बच्चों को भी सौंप देना, ताकि जातियों का उद्धारकर्ता तुम्हें स्वीकार करे; क्योंकि वह सच्चा और धीरजवन्त, नम्र और दीन है, और अपने कामों के द्वारा प्रभु की व्यवस्था सिखाता है।[c] **10** इसलिए हर प्रकार के अन्याय से दूर हो जाओ और परमेश्वर की धार्मिकता से जुड़े रहो; तब तुम्हारा वंश सदा के लिए उद्धार का कारण होगा। **11** और मुझे मेरे पूर्वजों के पास दफना देना।'
