  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy. Because of this the enemy is eager to trip up all who call on the Lord. For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end. For the very angel of peace will strengthen Israel, so that he may not fall into the uttermost evil. But in the time of the lawlessness of Israel, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[b]. And his name will be in every place in Israel and among the nations. Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience. And what you have heard from your father, pass on also to your
    children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord.[c] Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever.
translation:
  language: hi
  text: '**दान का वसीयतनामा 6**


    **1** अब, मेरे बच्चो, प्रभु का भय मानो और शैतान तथा उसकी आत्माओं से सावधान रहो। **2** परमेश्वर के निकट आओ और उस स्वर्गदूत के निकट भी, जो तुम्हारे लिए विनती करता है; क्योंकि वह परमेश्वर और मनुष्यों के बीच मध्यस्थ है।[a] वह इस्राएल की शांति के लिए शत्रु के राज्य के विरुद्ध खड़ा होगा। **3** इसी कारण शत्रु उन सभी को गिराने के लिए तत्पर रहता है जो प्रभु को पुकारते हैं। **4** क्योंकि वह जानता है कि जिस दिन इस्राएल लौट आएगा, उस दिन शत्रु के राज्य का अंत हो जाएगा। **5** शांति का वही स्वर्गदूत इस्राएल को सामर्थ्य देगा, ताकि वह बुराइयों की चरम सीमा में न जा गिरे।


    **6** पर इस्राएल के अधर्म के समय प्रभु उनसे दूर नहीं होगा, बल्कि उस जाति के पास चला जाएगा जो उसकी इच्छा की खोज करती है; क्योंकि कोई भी स्वर्गदूत उसके समान न होगा।[b] **7** और उसका नाम इस्राएल में हर स्थान पर और अन्य जातियों के बीच होगा।


    **8** इसलिए, मेरे बच्चो, अपने आपको हर बुरे काम से बचाए रखो। क्रोध और झूठ को अपने से दूर कर दो, और सत्य तथा धीरज से प्रेम करो। **9** तुमने अपने पिता से जो बातें सुनी हैं, उन्हें अपने बच्चों को भी सौंप देना। [ताकि जातियों का उद्धारकर्ता तुम्हें स्वीकार करे; क्योंकि वह सच्चा और धीरजवन्त, नम्र और दीन है, और अपने कामों के द्वारा प्रभु की व्यवस्था सिखाता है।][c] **10** इसलिए हर प्रकार के अन्याय से दूर हो जाओ और परमेश्वर की धार्मिकता से जुड़े रहो; तब तुम्हारा वंश सदा के लिए उद्धार के लिए होगा। **11** और मुझे मेरे पूर्वजों के पास दफना देना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर और मनुष्यों के बीच मध्यस्थ’ यूनानी से सीधा अनुवाद है। इसी अंश में उसे ‘स्वर्गदूत’ भी कहा गया है; इसलिए उसकी पहचान को किसी बाद की धर्मवैज्ञानिक हस्ती के साथ निश्चित नहीं किया गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यह यूनानी पंक्ति कठिन है: दिए गए पाठ के अनुसार प्रभु ‘उनसे दूर नहीं होगा’, फिर भी वह ‘उस जाति के पास चला जाएगा जो उसकी इच्छा की खोज करती है।’ इस तनाव को दूर करने के लिए पाठ को नहीं बदला गया है।'
    reason: alternative_reading
  - marker: c
    text: वर्ग-कोष्ठकों में दिया गया वाक्य प्रायः बाद की वृद्धि या प्रक्षेप माना जाता है। यहाँ इसका अनुवाद इसलिए किया गया है क्योंकि यह उपलब्ध कराए गए यूनानी साक्ष्य में मौजूद है।
    reason: textual_variant
lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  choice: प्रभु का भय मानो
  rationale: आज्ञार्थक वाक्य की गंभीर नैतिक और वाचा-संबंधी शक्ति बनाए रखता है; केवल ‘आदर करो’ कहना यूनानी की चेतावनी को हल्का कर देता।
- source_word: προσέχετε ἑαυτοῖς ἀπὸ τοῦ Σατανᾶ
  choice: शैतान से सावधान रहो
  rationale: आत्म-सतर्कता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: उस स्वर्गदूत के निकट भी, जो तुम्हारे लिए विनती करता है
  rationale: अगले पदबंध ‘मध्यस्थ’ के आलोक में participle को पक्ष में विनती करने के अर्थ में लिया गया है, बिना स्वर्गदूत की पहचान तय किए।
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: परमेश्वर और मनुष्यों के बीच मध्यस्थ
  rationale: μεσίτης का सीधा और प्रचलित धार्मिक अर्थ रखता है; ἀνθρώπων को सामान्य मानवजाति के अर्थ में ‘मनुष्यों’ कहा गया है।
- source_word: ὑποσκελίζειν
  choice: गिराने
  rationale: पैर अटकाकर गिराने की यूनानी उपमा का मूल परिणाम स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἐπιστρέψει Ἰσραήλ
  choice: इस्राएल लौट आएगा
  rationale: नैतिक-धार्मिक वापसी का संकेत देता है, पर तकनीकी अर्थ में ‘मन फिराना’ आरोपित नहीं करता।
- source_word: εἰς τέλος κακῶν
  choice: बुराइयों की चरम सीमा में
  rationale: εἰς τέλος की चरमता या पूर्ण सीमा का कठिन भाव बनाए रखता है।
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: जो उसकी इच्छा की खोज करती है
  rationale: ζητέω के ‘खोजने’ वाले स्पष्ट अर्थ को सुरक्षित रखता है; इसे ‘उसकी इच्छा पूरी करती है’ बनाकर अर्थ नहीं बदला गया।
- source_word: κολλήθητε τῇ δικαιοσύνῃ τοῦ Θεοῦ
  choice: परमेश्वर की धार्मिकता से जुड़े रहो
  rationale: κολλάω के दृढ़ता से चिपके या जुड़े रहने के रूपक को पठनीय हिन्दी में व्यक्त करता है।
- source_word: τὸ γένος ὑμῶν ... εἰς σωτηρίαν
  choice: तुम्हारा वंश ... उद्धार का कारण होगा
  rationale: εἰς σωτηρίαν की लक्ष्य अथवा परिणाम-सूचक अस्पष्टता को एक स्वाभाविक हिन्दी वाक्य में व्यक्त करता है; इसे ‘उद्धार पाएगा’ कहकर केवल वंश के निजी उद्धार तक सीमित नहीं किया गया।
theological_decisions:
- issue: विनती करने वाले स्वर्गदूत और ‘परमेश्वर तथा मनुष्यों के बीच मध्यस्थ’ की पहचान
  choice: पाठ के दोनों कथनों को ज्यों का त्यों साथ रखा गया है और पात्र को केवल स्वर्गदूत कहा गया है।
  alternative: उसे इस्राएल का संरक्षक स्वर्गदूत, मसीही पात्र, या बाद की किसी निश्चित धर्मवैज्ञानिक हस्ती के रूप में पहचाना जा सकता है।
  rationale: यूनानी पाठ स्वयं ‘स्वर्गदूत’ और ‘मध्यस्थ’ दोनों कहता है; किसी बाद की सैद्धांतिक पहचान को आरोपित करना उचित नहीं।
- issue: पद 2 में दूषित पाठ τῆς βασιλείας τοῦ †θεοῦ
  choice: प्रसंगानुसार ‘शत्रु के राज्य के विरुद्ध’
  alternative: ‘परमेश्वर के राज्य के विरुद्ध’
  rationale: दिए गए यूनानी संस्करण में θεοῦ पर क्रक्स (†) पाठ के दूषित होने का संकेत देता है। अगले वाक्य में वही विरोधी ‘शत्रु’ है और पद 4 स्पष्ट रूप से ‘शत्रु के राज्य’ के अंत की बात करता है; इसलिए स्वीकृत प्रासंगिक सुधार अपनाया गया।
- issue: पद 6 में प्रभु का इस्राएल से दूर न होना और दूसरी जाति के पास जाना
  choice: दोनों कथन बिना सामंजस्य बैठाए साथ रखे गए हैं।
  alternative: नकार हटाकर ‘प्रभु उनसे दूर हो जाएगा’ कहना, अथवा दूसरे क्रिया-पद का कर्ता किसी अन्य पात्र को मानना।
  rationale: दिया हुआ यूनानी पाठ पाठगत रूप से कठिन है। अनुवाद उसकी वास्तविक धर्मवैज्ञानिक और वाक्यगत खींचतान को टिप्पणी सहित बनाए रखता है।
- issue: पद 9 में जातियों के उद्धारकर्ता वाला विस्तृत वाक्य
  choice: दिए गए यूनानी साक्ष्य के अनुसार मुख्य पाठ में शामिल किया गया है और टिप्पणी में इसकी संभावित उत्तरकालीन वृद्धि की जानकारी दी गई है।
  alternative: संभावित प्रक्षेप मानकर इसे हटा देना या बिना सूचना के अभिन्न मूल पाठ की तरह छापना।
  rationale: स्रोत में अंश चिह्नित है; उसे अनूदित करना और उसकी पाठगत स्थिति स्पष्ट करना सबसे पारदर्शी विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु साधारण पाठकों के लिए सुबोध शैली रखी गई है। ‘प्रभु’, ‘व्यवस्था’, ‘धार्मिकता’, ‘उद्धारकर्ता’ और ‘स्वर्गदूत’ जैसे स्थापित बाइबलीय शब्द वहीं रखे गए हैं जहाँ वे मूल की धार्मिक शब्दावली को सटीक रूप से वहन करते हैं। संबोधन ‘मेरे बच्चो’ उपदेशात्मक-पितृसुलभ स्वर बनाए रखता है। पद-संख्याएँ पाठ के सार्वजनिक उपयोग और संदर्भ-सुविधा के लिए जोड़ी गई हैं।
