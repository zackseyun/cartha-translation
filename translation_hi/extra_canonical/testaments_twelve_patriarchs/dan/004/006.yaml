id: T12P.DAN.4.6
reference: Testament of Dan 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ⁴¹ ἐὰν ζημιωθῆτε ἑκουσίως *ἢ ἀκουσίως⁴² *μὴ λυπεῖσθε⁴³· ἀπὸ γὰρ λύπης⁴⁴ ἐγείρεται⁴⁵ καὶ⁴⁶ θυμός⁴⁷ ⌈μετὰ ψεύδους⁷⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/006.yaml
  text: And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.
translation:
  language: hi
  text: और यदि तुम्हें जानबूझकर या अनजाने में हानि उठानी पड़े, तो दुःखी मत हो; क्योंकि दुःख से क्रोध भी उठता है—झूठ के साथ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “झूठ के साथ” कुछ यूनानी पाठ-साक्ष्यों में नहीं मिलता।
    reason: स्रोत संस्करण में यह वाक्यांश कोष्ठकीय संकेत में है, जो पाठगत अनिश्चितता दर्शाता है; इसे मुख्य पाठ में रखते हुए पाठक को भिन्न पाठ-साक्ष्य की सूचना देना आवश्यक है।
lexical_decisions:
- source_word: ζημιωθῆτε
  choice: तुम्हें ... हानि उठानी पड़े
  rationale: यूनानी निष्क्रिय क्रिया आर्थिक नुकसान तक सीमित नहीं है; यह सामान्य रूप से हानि या क्षति सहने को व्यक्त करती है।
- source_word: ἑκουσίως ἢ ἀκουσίως
  choice: जानबूझकर या अनजाने में
  rationale: दोनों क्रियाविशेषण स्वेच्छा/इरादे से और बिना इरादे के बीच का विरोध बनाए रखते हैं; आधुनिक हिन्दी में यह सबसे सहज अभिव्यक्ति है।
- source_word: μὴ λυπεῖσθε
  choice: दुःखी मत हो
  rationale: निषेधात्मक आज्ञा में शोक या मनोव्यथा के सामान्य अर्थ को सरल और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: ἐγείρεται
  choice: उठता है
  rationale: क्रोध के उत्पन्न होने के लिए मूल के रूपक को बनाए रखता है।
- source_word: θυμός
  choice: क्रोध
  rationale: यहाँ तीव्र रोष/क्रोध अभिप्रेत है; ‘क्रोध’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: μετὰ ψεύδους
  choice: झूठ के साथ
  rationale: वाक्यांश का सीधा संबंध सुरक्षित रखा गया है और यह स्पष्ट नहीं किया गया कि झूठ क्रोध का साथी, साधन या परिणाम है।
theological_decisions:
- issue: क्रोध और झूठ के बीच संबंध
  choice: ‘क्रोध भी उठता है—झूठ के साथ’ के रूप में संबंध को खुला रखा गया
  alternative: ‘दुःख से झूठ से मिला हुआ क्रोध उत्पन्न होता है’ या ‘दुःख से क्रोध और झूठ उत्पन्न होते हैं’
  rationale: यूनानी μετὰ ψεύδους का संबंध अर्थगत रूप से संक्षिप्त और कुछ हद तक अस्पष्ट है। अनुवाद ने झूठ को अलग समानांतर परिणाम बनाने या किसी विशेष कारणात्मक संबंध में बाँधने से परहेज़ किया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में है। भाषा सरल, गरिमापूर्ण और स्रोत के संक्षिप्त उपदेशात्मक स्वर के अनुरूप रखी गई है।
