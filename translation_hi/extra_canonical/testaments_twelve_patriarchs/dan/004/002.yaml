source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐν γὰρ λόγῳ παροξύνεται⁵ πρῶτον εἶτα⁶ *ἐν ἔργοις⁷ †δυναμοῖ⁸ τὸν ὀργιζόμενον⁹, καὶ¹⁰ ἐν *ζημίαις πικραῖς διαταράσσει τὸ διαβούλιον αὐτοῦ¹¹, καὶ οὕτως διεγείρει ἐν θυμῷ μεγάλῳ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/002.yaml
  text: For first he is provoked by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it throws his purpose into confusion, and so it stirs up his soul in great wrath.
translation:
  language: hi
  text: क्योंकि पहले एक बात से मनुष्य भड़क उठता है; फिर वह[a] कृत्यों के द्वारा क्रोधित हो रहे व्यक्ति को बल देता है, और कड़वी हानियों के द्वारा उसके इरादे को उलझा देता है; और इस प्रकार उसकी आत्मा को प्रबल रोष से भड़का देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह’ उस निहित कर्ता की ओर संकेत करता है जो यूनानी पाठ में स्पष्ट रूप से नहीं बताया गया है। संदर्भ में इसे क्रोध या क्रोध को उकसाने वाली शक्ति समझा जा सकता है।
    reason: दूसरी, तीसरी और चौथी क्रिया का कर्ता यूनानी वाक्यांश में स्पष्ट संज्ञा के रूप में उपस्थित नहीं है; पादटिप्पणी इस अस्पष्टता को बनाए रखती है।
lexical_decisions:
- source_word: λόγῳ
  choice: किसी बात से
  rationale: यहाँ λόγος बोले गए वचन या कथन को सूचित करता है; आधुनिक हिन्दी में ‘किसी बात से’ स्वाभाविक है और कारणसूचक अर्थ बनाए रखता है।
- source_word: παροξύνεται
  choice: मनुष्य भड़क उठता है
  rationale: मध्य/कर्मवाच्य रूप का भाव ‘उकसाया जाना/भड़क उठना’ है। प्रसंग के मानवीय कर्ता को स्पष्ट किया गया है, पर कारण को अनिर्दिष्ट रखा गया है।
- source_word: δυναμοῖ τὸν ὀργιζόμενον
  choice: क्रोध में आते हुए मनुष्य को और बल देता है
  rationale: 'पाठ के कठिन किंतु प्रत्यक्ष अर्थ को सुरक्षित रखा गया है: कोई निहित कर्ता क्रोधित होते व्यक्ति को प्रबल करता है। ‘और’ क्रमिक वृद्धि को सहज बनाता है।'
- source_word: ζημίαις πικραῖς
  choice: कड़वी हानियों के द्वारा
  rationale: ζημία का मूल अर्थ हानि/क्षति है; ‘कड़वी’ πικραῖς की भावात्मक तीव्रता रखता है।
- source_word: διαβούλιον
  choice: विचार
  rationale: यह शब्द योजना, मंशा या विचार-विमर्श से बने निश्चय को सूचित कर सकता है। ‘विचार’ मूल की व्यापकता बनाए रखता है और संदर्भ में स्वाभाविक है।
- source_word: θυμῷ μεγάλῳ
  choice: बड़े रोष से
  rationale: θυμός तीव्र क्रोध या रोष है। ‘बड़े रोष’ मूल की औपचारिक तीव्रता को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ψυχὴν
  choice: आत्मा
  rationale: ψυχή को यहाँ मनुष्य के आंतरिक जीवन के रूप में ‘आत्मा’ कहा गया है; इसे केवल ‘मन’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: दूसरे और बाद के खंडों में निहित कर्ता की पहचान
  choice: ‘वह’ रखकर पहचान को अनिर्दिष्ट रखा गया
  alternative: कर्ता को ‘क्रोध’ या किसी अन्य विशिष्ट शक्ति के रूप में स्पष्ट करना
  rationale: यूनानी वाक्य में क्रियाओं का कर्ता इस उद्धृत अंश में स्पष्ट संज्ञा के रूप में नहीं दिया गया। संदर्भ से किसी एक पहचान को थोपना वास्तविक व्याकरणिक और विषयगत अस्पष्टता को मिटा देता।
- issue: ψυχή का मानवशास्त्रीय अर्थ
  choice: ‘आत्मा’
  alternative: ‘मन’ या ‘प्राण’
  rationale: ‘आत्मा’ आंतरिक व्यक्ति के व्यापक अर्थ को बनाए रखता है; यहाँ किसी विशिष्ट दार्शनिक या संप्रदायगत आत्मा-सिद्धांत को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी की क्रमिक रचना—पहले, फिर, और इस प्रकार—सुरक्षित है। कठिन कर्ता-संबंध को मुख्य पाठ और संक्षिप्त पादटिप्पणी द्वारा ईमानदारी से बनाए रखा गया है।
