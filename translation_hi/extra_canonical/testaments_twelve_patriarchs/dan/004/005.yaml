source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ³³ *ζημίᾳ ἢ ἀπωλείᾳ τινὶ περιπέσητε³⁴, τέκνα³⁵, ⌈μὴ ἐκθροεῖσθε³⁶⌉. ὅτι ⌈αὐτὸ⌉¹ τὸ πνεῦμα³⁷ *ποιεῖ ἐπιθυμῆσαι³⁸ τοῦ ἀπολλυμένου³⁹ ἵνα *θυμῷ πέσῃ διὰ τοῦ πάθους⁴⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/005.yaml
  text: But if you fall into any loss or destruction, children, do not be thrown into confusion. For that very spirit causes one to desire to be angry over what is perishing, so that he may fall into anger through passion.
translation:
  language: hi
  text: हे बच्चो, यदि तुम किसी हानि या विनाश में पड़ जाओ, तो व्याकुल मत होना। क्योंकि वही आत्मा मनुष्य में जो नष्ट हो रहा है उसके कारण क्रोधित होने की इच्छा जगाती है, ताकि वह भावावेग के द्वारा क्रोध में पड़ जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζημίᾳ ἢ ἀπωλείᾳ
  choice: हानि या विनाश
  rationale: 'दोनों यूनानी संज्ञाओं का भेद बनाए रखा गया है: ζημία आर्थिक या सामान्य हानि को, और ἀπώλεια विनाश अथवा नाश को सूचित कर सकता है।'
- source_word: περιπέσητε
  choice: में पड़ जाओ
  rationale: यह आकस्मिक रूप से किसी विपत्ति में पड़ने का स्वाभाविक हिन्दी रूप है।
- source_word: μὴ ἐκθροεῖσθε
  choice: घबरा मत जाना
  rationale: क्रिया भय, व्याकुलता या उथल-पुथल में पड़ने का भाव देती है; आधुनिक हिन्दी में 'घबरा मत जाना' सहज और सटीक है।
- source_word: αὐτὸ τὸ πνεῦμα
  choice: वही आत्मा
  rationale: αὐτό के बलाघात को 'वही' से रखा गया है और πνεῦμα को प्रसंग की नैतिक-आध्यात्मिक शक्ति के रूप में 'आत्मा' अनूदित किया गया है।
- source_word: ποιεῖ ἐπιθυμῆσαι
  choice: इच्छा जगाती है
  rationale: कारणवाचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और तीव्र चाह का भाव बनाए रखता है।
- source_word: τοῦ ἀπολλυμένου
  choice: नष्ट होती हुई वस्तु के कारण
  rationale: यूनानी कृदन्त नपुंसकलिंग/सामान्य अर्थ में 'जो नष्ट हो रहा है' कह सकता है; हिन्दी में संदर्भ स्पष्ट करने के लिए 'वस्तु' जोड़ा गया है, बिना किसी खास संपत्ति का अर्थ आरोपित किए।
- source_word: θυμῷ πέσῃ
  choice: क्रोध में पड़ जाए
  rationale: θυμός का इस प्रसंग में क्रोध/रोष अर्थ है और πέσῃ की पुनरावृत्ति को बनाए रखा गया है।
- source_word: διὰ τοῦ πάθους
  choice: इस मनोविकार के द्वारा
  rationale: πάθος यहाँ केवल दुःख नहीं, बल्कि मन पर हावी होने वाली तीव्र भावावस्था या आवेग है; 'मनोविकार' इस नकारात्मक नैतिक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: πνεῦμα का स्वरूप
  choice: वही आत्मा
  alternative: वही प्रवृत्ति / वह आत्मिक शक्ति
  rationale: पाठ यह स्पष्ट नहीं करता कि यह कोई व्यक्तिगत दुष्ट आत्मा है या मनुष्य को प्रभावित करने वाली आत्मिक शक्ति। इसलिए 'आत्मा' रखकर इस अस्पष्टता को सुरक्षित रखा गया है।
- issue: πάθος और क्रोध का संबंध
  choice: मनोविकार के द्वारा क्रोध में पड़ना
  alternative: दुःख के कारण क्रोध में पड़ना
  rationale: πάθος को मात्र बाहरी कष्ट मानने के बजाय तीव्र और अनियंत्रित भावावेग के रूप में रखा गया है, क्योंकि वाक्य में वही क्रोध की ओर ले जाने वाला माध्यम है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक रूप अपनाया गया है। 'हे बच्चो' संबोधन को स्पष्ट रखता है; अनावश्यक रूप से 'मेरे' नहीं जोड़ा गया।
