base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/003.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.
translation:
  language: hi
  text: इसलिए, जब कोई तुम्हारे विरुद्ध बोले, तो क्रोध में न भड़क उठो; और यदि कोई तुम्हें पवित्र मानकर तुम्हारी प्रशंसा करे, तो फूल न जाओ। न प्रसन्नता की ओर मुड़ो, न घृणा की ओर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κινεῖσθε εἰς ὀργήν
  choice: क्रोध में न भड़क उठो
  rationale: शाब्दिक अर्थ ‘क्रोध की ओर प्रेरित/उत्तेजित होना’ है; यह हिंदी प्रयोग उस आंतरिक उकसाव और प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἁγίους
  choice: पवित्र जनों
  rationale: विशेषण का बहुवचन और प्रशंसित व्यक्तियों के रूप में उसका अर्थ बनाए रखा गया है।
- source_word: ἐπαίρεσθε
  choice: फूल न जाओ
  rationale: यहाँ अपने को ऊँचा समझने या घमंड से भरने का भाव है; आधुनिक हिंदी में यह सहज और सटीक है।
- source_word: τέρψιν
  choice: प्रसन्नता
  rationale: आनंद, सुख या हर्ष की सकारात्मक भाव-दिशा को सामान्य हिंदी में व्यक्त करता है।
- source_word: ἀηδίαν
  choice: विरक्ति
  rationale: यह शब्द अरुचि, घृणा या अप्रसन्नता का भाव दे सकता है; ‘विरक्ति’ सकारात्मक ‘प्रसन्नता’ के विपरीत भाव-दिशा को गरिमापूर्ण ढंग से रखता है।
theological_decisions:
- issue: प्रशंसा और निंदा के प्रति समान स्थिरता
  choice: अंतिम वाक्य में सकारात्मक और नकारात्मक दोनों भाव-दिशाओं को समानांतर रखा गया
  alternative: इसे केवल ‘अपना रवैया मत बदलो’ कहकर समेटना
  rationale: यूनानी पाठ की द्विपक्षीय नैतिक चेतावनी—प्रसन्नता और विरक्ति दोनों से प्रभावित न होना—को बिना अतिरिक्त धार्मिक व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन बहुवचन ‘तुम’ में है। शैली उपदेशात्मक, सहज और गरिमापूर्ण है। मूल स्रोत में ‘मेरे बच्चों’ नहीं है, इसलिए उसे जोड़ा नहीं गया। अंतिम वाक्य की कुछ असामान्य संरचना मूल यूनानी की भाव-दिशाओं के बीच तनाव को बनाए रखने के लिए आंशिक रूप से सुरक्षित रखी गई है।
