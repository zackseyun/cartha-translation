review_pass:
  verdict: revise
  source_fidelity: The first two clauses accurately preserve the conditional exhortations and the contrast between hostile speech and praise. However, ἀηδία denotes dislike, distaste, or disgust, not the more ascetic or detached sense commonly conveyed by ‘विरक्ति’. The final clause’s change/turning imagery should be retained in intelligible Hindi.
  naturalness: ‘तुम्हारी प्रशंसा पवित्र जनों के रूप में करे’ is syntactically awkward and can momentarily suggest that the praise itself is being made in the form of holy people. ‘तुम्हें पवित्र मानकर तुम्हारी प्रशंसा करे’ is clear, natural, and retains the sense. ‘न तो ... की ओर बदलो’ is also unnatural Hindi; ‘... की ओर मुड़ो’ is idiomatic while conveying the source’s admonition not to shift one’s state.
  terminology: ‘क्रोध में न भड़क उठो’ suitably renders being stirred into anger, and ‘फूल न जाओ’ naturally conveys becoming puffed up. ‘पवित्र’ is appropriate for ἁγίους. ‘घृणा’ better reflects ἀηδία than ‘विरक्ति’.
  issues:
  - severity: medium
    issue: ‘विरक्ति’ for ἀηδία
    rationale: '‘विरक्ति’ ordinarily suggests detachment, dispassion, or renunciation, whereas ἀηδία here is an affective negative response: distaste/disgust. This changes the ethical contrast in the final clause.'
  - severity: low
    issue: Awkward phrasing for praise ‘as holy’
    rationale: The draft’s ‘तुम्हारी प्रशंसा पवित्र जनों के रूप में करे’ is not natural Hindi. Recasting it with ‘तुम्हें पवित्र मानकर’ preserves the predicative force of ὡς ἁγίους.
  - severity: low
    issue: Unidiomatic rendering of μεταβάλλεσθε
    rationale: ‘प्रसन्नता की ओर बदलो’ is structurally awkward in modern Hindi. ‘प्रसन्नता की ओर मुड़ो’ communicates the intended shift without adding interpretation.
  revised_text: इसलिए, जब कोई तुम्हारे विरुद्ध बोले, तो क्रोध में न भड़क उठो; और यदि कोई तुम्हें पवित्र मानकर तुम्हारी प्रशंसा करे, तो फूल न जाओ। न प्रसन्नता की ओर मुड़ो, न घृणा की ओर।
