revisions:
- from: इसलिए, जब कोई तुम्हारे विरुद्ध बोले, तो क्रोध में न भड़क उठो; और यदि कोई तुम्हारी प्रशंसा पवित्र जनों के रूप में करे, तो फूल न जाओ। न तो प्रसन्नता की ओर बदलो, न विरक्ति की ओर।
  to: इसलिए, जब कोई तुम्हारे विरुद्ध बोले, तो क्रोध में न भड़क उठो; और यदि कोई तुम्हें पवित्र मानकर तुम्हारी प्रशंसा करे, तो फूल न जाओ। न प्रसन्नता की ओर मुड़ो, न घृणा की ओर।
  rationale: The revision corrects the final negative affect from detached ‘विरक्ति’ to ‘घृणा’, makes the ‘as holy’ praise clause idiomatic and unambiguous, and replaces an unnatural literal construction in the final sentence with natural Hindi that retains the source’s contrast between emotional directions. No footnotes are required by the source text or supplied draft.
