  text: Therefore understand the power of anger, that it is futile.
translation:
  language: hi
  text: इसलिए क्रोध की शक्ति को समझो—कि वह व्यर्थ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκοῦν
  choice: इसलिए
  rationale: यह पिछले विचार से निष्कर्ष की ओर ले जाने वाला संयोजक है; आधुनिक हिन्दी में ‘इसलिए’ स्वाभाविक है।
- source_word: σύνετε
  choice: समझो
  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थक का सीधा और सहज रूप; संबोधन की सामूहिकता सन्दर्भ से स्पष्ट रहती है।
- source_word: τὴν δύναμιν τοῦ θυμοῦ
  choice: क्रोध की शक्ति
  rationale: मूल संज्ञात्मक संरचना और क्रोध के प्रभाव अथवा सामर्थ्य का भाव सुरक्षित रखा गया है।
- source_word: ματαία
  choice: व्यर्थ
  rationale: शब्द निष्फलता, खोखलेपन या निरर्थकता का भाव दे सकता है; ‘व्यर्थ’ इस व्यापकता को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: क्रोध की शक्ति को ‘व्यर्थ’ कहने का आशय
  choice: मूल कथन की संक्षिप्तता और तनाव को यथावत रखा गया
  alternative: ‘उसका कोई लाभ नहीं’ या ‘वह निष्फल है’
  rationale: व्याख्यात्मक विस्तार किए बिना यूनानी कथन की अस्पष्टता सुरक्षित रखी गई है कि ‘व्यर्थ’ शक्ति, क्रोध, अथवा उसके परिणाम को किस प्रकार विशेषित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। मूल के निष्कर्षसूचक आरम्भ तथा संक्षिप्त आज्ञार्थक शैली को रखा गया है; डैश से ὅτι-वाक्य का स्पष्टीकरण स्वाभाविक ढंग से जोड़ा गया है।
