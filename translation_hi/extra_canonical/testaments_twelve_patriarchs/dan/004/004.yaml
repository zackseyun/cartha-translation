  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/004.yaml
  text: For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.
translation:
  language: hi
  text: क्योंकि पहले तो उसे सुनना अच्छा लगता है, और इस तरह वह बुद्धि को उकसावे को पहचानने के लिए तीक्ष्ण करती है; और क्रोधित होकर वह सोचता है कि उसका क्रोध न्यायोचित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέρπει τὴν ἀκοήν
  choice: सुनने में मनभावना लगती है
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप; आशय है कि बात पहले कानों को भाती है।
- source_word: ὀξύνει τὸν νοῦν
  choice: मन को ... पैना करती है
  rationale: ‘मन/बुद्धि को तीक्ष्ण करना’ की छवि बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: τὸ ἐρεθισθέν
  choice: उकसावे
  rationale: पाठ चिह्नित रूप से संदिग्ध है, पर संदर्भ में क्रोध भड़काने वाली बात या कारण का बोध होता है; ‘उकसावा’ इस अस्पष्टता को पर्याप्त रूप से बचाता है।
- source_word: θυμωθείς
  choice: क्रोध से भरकर
  rationale: कृदंत की अवस्था और मुख्य क्रिया से उसका संबंध स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: δικαίως ὀργίζεσθαι
  choice: उसका क्रोधित होना उचित है
  rationale: नैतिक औचित्य के दावे को दर्शाता है, बिना यह मान लिए कि उसका क्रोध वास्तव में न्यायपूर्ण है।
theological_decisions:
- issue: क्रोध के औचित्य का दावा
  choice: 'वक्ता की आत्म-धारणा के रूप में प्रस्तुत किया: ‘सोचता है कि ... उचित है’'
  alternative: ‘वह उचित रूप से क्रोधित होता है’
  rationale: यूनानी νομίζει बताता है कि यह क्रोधित व्यक्ति का विचार है; कथन स्वयं उसके क्रोध को उचित प्रमाणित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। आरंभिक ‘वह’ का संदर्भ पूर्ववर्ती पद से आता है, जैसा यूनानी में भी निहित है।
