revisions:
- from: क्योंकि पहले वह सुनने में मनभावना लगती है, और इस तरह मन को उकसावे को पहचानने के लिए पैना करती है; फिर मनुष्य क्रोध से भरकर सोचता है कि उसका क्रोधित होना उचित है।
  to: क्योंकि पहले तो उसे सुनना अच्छा लगता है, और इस तरह वह बुद्धि को उकसावे को पहचानने के लिए तीक्ष्ण करती है; और क्रोधित होकर वह सोचता है कि उसका क्रोध न्यायोचित है।
