review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence and central claims, including the cooperation of anger and falsehood, the troubled heart/soul, the Lord's departure, and Beliar's dominion. However, διπρόσωπον κακόν denotes a “two-faced/two-sided evil,” not a masculine personal “wicked person”; and “कर लेता है” adds an ingressive nuance not explicit in κυριεύει.
  naturalness: “दो मुँह वाला दुष्ट” is unnatural in this abstract context, and “प्राण निरन्तर व्याकुल रहता है” is less idiomatic for the inner self in modern standard Hindi. “दो-मुँही बुराई” and “आत्मा लगातार व्याकुल रहती है” are clear, natural, and retain the distinction from “हृदय.”
  terminology: क्रोध, झूठ, हृदय, प्रभु, and बलियार are suitable. “आत्मा” is the more established Hindi equivalent here for ψυχή and does not collapse it into καρδία. “बलियार उस पर शासन करता है” represents κυριεύει without implying a newly completed seizure of control.
  issues:
  - severity: medium
    issue: “दो मुँह वाला दुष्ट” for διπρόσωπον κακόν
    rationale: κακόν is an abstract neuter noun, “evil/bad thing,” in this construction. Rendering it as “दुष्ट” turns it into a masculine personal agent and obscures the phrase’s meaning.
  - severity: low
    issue: “प्राण” for ψυχή in “प्राण निरन्तर व्याकुल रहता है”
    rationale: Though lexically possible in some contexts, this wording is not idiomatic modern Hindi for a continually troubled inner self. “आत्मा” more naturally conveys ψυχή while preserving its distinction from “हृदय.”
  - severity: low
    issue: “अधिकार कर लेता है” for κυριεύει
    rationale: The phrase can suggest that Beliar newly takes possession. The Greek states dominion/rule without specifying inception or completion.
  revised_text: और क्रोध, झूठ के साथ, दो-मुँही बुराई है; वे दोनों एक-दूसरे के साथ मिलते हैं ताकि हृदय को व्याकुल करें। और जब आत्मा लगातार व्याकुल रहती है, तो प्रभु उससे दूर हो जाता है और बलियार उस पर शासन करता है।
  revised_footnotes: []
  revision_rationale: The revision corrects the abstract sense of διπρόσωπον κακόν, uses idiomatic modern Hindi for the disturbed ψυχή, and renders Beliar’s κυριεύει as ongoing dominion rather than an explicitly completed taking of control. It retains the source’s theological force and leaves unspecified the nature of the Lord’s departure.
