id: T12P.DAN.4.7
reference: Testament of Dan 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἔστι δὲ διπρόσωπον κακὸν ὁ θυμὸς μετὰ ψεύδους⁴⁸, καὶ συναίρονται⁴⁹ ἀλλήλοις ἵνα ταράξωσι⁵⁰ *τὴν καρδίαν⁵¹· ταρασσομένης δὲ τῆς ψυχῆς συνεχῶς, ἀφίσταται ὁ⁵² Κύριος ἀπ᾽ αὐτῆς καὶ κυριεύει αὐτῆς ὁ Βελίαρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/007.yaml
  text: And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it, and Beliar rules over it.
translation:
  language: hi
  text: और क्रोध, झूठ के साथ, दो-मुँही बुराई है; वे दोनों एक-दूसरे के साथ मिलते हैं ताकि हृदय को व्याकुल करें। और जब आत्मा लगातार व्याकुल रहती है, तो प्रभु उससे दूर हो जाता है और बलियार उस पर शासन करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμὸς
  choice: क्रोध
  rationale: यहाँ शब्द तीव्र रोष या क्रोध को दर्शाता है; सामान्य आधुनिक हिन्दी में ‘क्रोध’ सटीक और गरिमापूर्ण है।
- source_word: μετὰ ψεύδους
  choice: जब झूठ के साथ होता है
  rationale: सहचर्य का अर्थ स्पष्ट करते हुए मूल के ‘झूठ के साथ’ को बनाए रखा गया है और हिन्दी वाक्य को स्वाभाविक बनाया गया है।
- source_word: διπρόσωπον κακὸν
  choice: दो मुँह वाला दुष्ट
  rationale: मूल के रूपक ‘दो-मुँहा’ को सुरक्षित रखा गया है; यहाँ neuter κακόν किसी अमूर्त ‘बुराई’ या सक्रिय ‘दुष्ट’ दोनों की छाया रख सकता है, और संदर्भ में व्यक्तिवाची क्रियाओं के कारण ‘दुष्ट’ चुना गया है।
- source_word: συναίρονται ἀλλήλοις
  choice: वे दोनों एक-दूसरे से मिल जाते हैं
  rationale: क्रोध और झूठ के परस्पर गठजोड़ को सरल तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ταράξωσι τὴν καρδίαν
  choice: हृदय को व्याकुल करें
  rationale: ταράσσω के मानसिक-आध्यात्मिक विचलन को ‘व्याकुल करना’ उचित रूप से व्यक्त करता है।
- source_word: ψυχῆς
  choice: प्राण
  rationale: ψυχή यहाँ व्यक्ति के भीतरी जीवन को सूचित करता है; ‘प्राण’ आत्मा/जीवन की मूल अस्पष्टता को ‘मन’ की तुलना में बेहतर बनाए रखता है।
- source_word: ἀφίσταται
  choice: दूर हो जाता है
  rationale: अलग हो जाने या हट जाने का अर्थ सहज हिन्दी में व्यक्त किया गया है, बिना कारण या स्थायित्व के बारे में अतिरिक्त निष्कर्ष जोड़े।
- source_word: κυριεύει αὐτῆς
  choice: उस पर अधिकार कर लेता है
  rationale: प्रभुत्व या शासन स्थापित करने का अर्थ स्पष्ट है और मूल की सक्रिय शक्ति को बनाए रखता है।
- source_word: Βελίαρ
  choice: बलियार
  rationale: यूनानी Βελίαρ का निकट देवनागरी लिप्यंतरण, इसे सामान्य संज्ञा बनाकर अर्थानुवाद करने के बजाय नाम के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु का व्याकुल प्राण से अलग होना
  choice: ‘प्रभु उससे दूर हो जाता है’ के रूप में सीधा अनुवाद
  alternative: इसे केवल प्रभु की उपस्थिति का अनुभव खोना या प्रभु की सहायता हटना कहना
  rationale: मूल ἀφίσταται को उसकी वास्तविक धार्मिक तीक्ष्णता सहित रखा गया है; पाठ स्वयं यह नहीं बताता कि यह अनुभवात्मक, संबंधपरक या तत्त्वमीमांसात्मक दूरी है।
- issue: बलियार के शासन का स्वरूप
  choice: ‘उस पर अधिकार कर लेता है’
  alternative: ‘उसे प्रभावित करता है’ या ‘उसमें बस जाता है’
  rationale: κυριεύει स्पष्ट रूप से प्रभुत्व दर्शाता है; प्रभाव या निवास कहना मूल से कम या अधिक विशिष्ट होता।
- issue: हृदय और प्राण का संबंध
  choice: दोनों अलग शब्दों—‘हृदय’ और ‘प्राण’—से प्रस्तुत
  alternative: दोनों के लिए ‘मन’ या ‘अन्तःकरण’
  rationale: मूल καρδία और ψυχή में जानबूझकर भेद करता है; हिन्दी में भी यह भेद बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल के समन्वयी ‘और’ तथा क्रोध-झूठ के व्यक्तिकरण को यथासंभव सुरक्षित रखते हुए हिन्दी प्रवाह के लिए वाक्य-विराम दिया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
