revisions:
- from: और क्रोध, जब झूठ के साथ होता है, तो दो मुँह वाला दुष्ट है; वे दोनों एक-दूसरे से मिल जाते हैं ताकि हृदय को व्याकुल करें। और जब प्राण निरन्तर व्याकुल रहता है, तो प्रभु उससे दूर हो जाता है और बलियार उस पर अधिकार कर लेता है।
  to: और क्रोध, झूठ के साथ, दो-मुँही बुराई है; वे दोनों एक-दूसरे के साथ मिलते हैं ताकि हृदय को व्याकुल करें। और जब आत्मा लगातार व्याकुल रहती है, तो प्रभु उससे दूर हो जाता है और बलियार उस पर शासन करता है।
  rationale: The revision corrects the abstract sense of διπρόσωπον κακόν, uses idiomatic modern Hindi for the disturbed ψυχή, and renders Beliar’s κυριεύει as ongoing dominion rather than an explicitly completed taking of control. It retains the source’s theological force and leaves unspecified the nature of the Lord’s departure.
  reviewer_model: gpt-5.6-terra
