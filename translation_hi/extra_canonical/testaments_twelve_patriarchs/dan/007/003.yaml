  text: Nevertheless Dan prophesied to them that they would forget [their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring].
translation:
  language: hi
  text: फिर भी दान ने उन्हें यह भविष्यवाणी सुनाई कि इसके बाद वे उसकी अस्थियाँ ऊपर ले गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ यूनानी पाठों में आगे यह भी है: ‘और उन्हें पास ही रख दिया।’'
    reason: καὶ κατέθηκαν σύνεγγυς एक पाठांतर है; इसे मुख्य पाठ के बजाय फुटनोट में प्रस्तुत किया गया है।
lexical_decisions:
- source_word: Πλὴν οὖν
  choice: फिर भी
  rationale: यह संयोजक पिछले कथन से विरोध या मोड़ प्रकट करता है; ‘फिर भी’ आधुनिक और गरिमापूर्ण हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: προεφήτευσεν αὐτοῖς
  choice: ने उनसे भविष्यवाणी की
  rationale: क्रिया के भविष्यसूचक अर्थ और αὐτοῖς के संबोधनात्मक संबंध—‘उनसे/उनके लिए’—दोनों को बनाए रखता है।
- source_word: ἀνήνεγκαν τὰ ὀστᾶ αὐτοῦ
  choice: वे उसकी अस्थियाँ ऊपर ले गए
  rationale: ἀναφέρω में निहित ‘ऊपर ले जाने’ की दिशा को सुरक्षित रखा गया है और ὀστᾶ के लिए गरिमापूर्ण ‘अस्थियाँ’ चुना गया है।
- source_word: κατέθηκαν σύνεγγυς
  choice: उन्हें पास ही रख दिया
  rationale: κατατίθημι के रखने और σύνεγγυς के निकट स्थान के अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसकी’ सर्वनाम का संदर्भ
  choice: स्रोत की तरह केवल ‘उसकी’ रखा गया
  alternative: ‘दान की अस्थियाँ’ कहकर संदर्भ स्पष्ट करना
  rationale: ग्रीक αὐτοῦ सर्वनाम का प्रयोग करता है; उसका आशय संभवतः दान है, पर अनुवाद में नाम जोड़ना स्रोत की संभावित अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: भविष्यवाणी के बाद भूतकालीन क्रियाएँ
  choice: ‘ले गए’ और ‘रख दिया’ के भूतकालीन रूप बनाए रखे गए
  alternative: ‘ले जाएँगे’ और ‘रख देंगे’ द्वारा भविष्यकाल करना
  rationale: उपलब्ध यूनानी पाठ में क्रियाएँ भूतकालीन रूप में हैं। भविष्यवाणी के प्रसंग के कारण उन्हें भविष्यकाल में बदलना पाठ के कालगत तनाव को चुपचाप सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘अस्थियाँ’ गरिमापूर्ण और सामान्यतः बोधगम्य है। वाक्य की असामान्य कालगत संरचना मूल यूनानी के अनुसार जानबूझकर सुरक्षित रखी गई है।
