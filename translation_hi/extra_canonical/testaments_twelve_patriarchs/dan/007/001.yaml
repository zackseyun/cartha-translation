  text: And having said these things, he kissed them affectionately and fell asleep a good sleep.
translation:
  language: hi
  text: और ये बातें कहकर उसने उन्हें स्नेह से चूमा और अच्छी नींद में सो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταφιλήσας
  choice: स्नेह से चूमा
  rationale: यह क्रिया साधारण चुंबन से अधिक आत्मीय या स्नेहपूर्ण चुंबन का भाव देती है; आधुनिक हिन्दी में यह अभिव्यक्ति स्वाभाविक और गरिमापूर्ण है।
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: अच्छी नींद में सो गया
  rationale: मूल में सजातीय क्रिया-संज्ञा प्रयोग है, जिसका शाब्दिक रूप हिन्दी में अस्वाभाविक होता। यह अनुवाद ‘अच्छी नींद’ का विशेषणात्मक बल बनाए रखते हुए सहज हिन्दी देता है।
theological_decisions:
- issue: ‘सो गया’ का मृत्यु-सूचक या सामान्य निद्रा-सूचक अर्थ
  choice: सो गया
  alternative: उसकी शांतिपूर्वक मृत्यु हो गई
  rationale: यूनानी पाठ निद्रा की भाषा ही रखता है और मृत्यु को स्पष्ट नहीं करता। अतः संभावित मृत्यु-संकेत को व्याख्यात्मक रूप से स्पष्ट किए बिना मूल की साहित्यिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, आत्मीय और गरिमापूर्ण कथात्मक शैली। ‘और ये बातें कहकर’ यूनानी कृदंत-रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
