id: T12P.DAN.7.2
reference: Testament of Dan 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ³ ἔθαψαν αὐτὸν *οἱ υἱοὶ αὐτοῦ. Καὶ⁴ μετὰ *τοῦτο ἀπήνεγκαν⁵ ⌈τὰ ὀστᾶ αὐτοῦ⌉⁶... *ἔνθα ἦν⁷ ᾿Αβραὰμ⁸ καὶ Ἰσαὰκ καὶ Ἰακώβ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/002.yaml
  text: And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.
translation:
  language: hi
  text: और उसके पुत्रों ने उसे दफ़नाया। इसके बाद वे उसकी हड्डियाँ उस स्थान पर ले गए जहाँ अब्राहम, इसहाक और याकूब थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθαψαν
  choice: दफ़नाया
  rationale: यूनानी क्रिया का सीधा और स्वाभाविक हिन्दी अर्थ; अंत्येष्टि के सामान्य भाव को बनाए रखता है।
- source_word: ἀπήνεγκαν
  choice: ले गए
  rationale: क्रिया के स्थानांतरण के मूल भाव को सहज हिन्दी में व्यक्त करता है; संदर्भ में अस्थियों को दूसरे स्थान पर पहुँचाना अभिप्रेत है।
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: उसकी हड्डियाँ
  rationale: मूल पाठ का ठोस और स्पष्ट रूप बनाए रखा गया है; अधिक धार्मिक शब्दावली जैसे ‘अस्थि-अवशेष’ अनावश्यक रूप से नहीं जोड़ी गई।
- source_word: ἔνθα ἦν
  choice: जहाँ ... थे
  rationale: स्थानसूचक संबंध और बहुवचन नामों के साथ स्वाभाविक हिन्दी संरचना प्रस्तुत करता है।
theological_decisions:
- issue: अब्राहम, इसहाक और याकूब के उस स्थान पर ‘होने’ का अर्थ
  choice: जहाँ अब्राहम, इसहाक और याकूब थे
  alternative: जहाँ अब्राहम, इसहाक और याकूब दफ़नाए गए थे
  rationale: मूल यूनानी केवल ‘जहाँ ... थे’ कहता है। ‘दफ़नाए गए थे’ संदर्भानुकूल व्याख्या हो सकती है, पर उसे मुख्य पाठ में जोड़ने से मूल की संक्षिप्तता और संभावित अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य-विन्यास मूल के दो क्रमिक कथनों को सुरक्षित रखता है और किसी अतिरिक्त स्थान अथवा दफ़न-संबंधी विवरण को नहीं जोड़ता।
