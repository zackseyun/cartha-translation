  source_fidelity: 'The Hindi accurately represents the two coordinated Greek statements: his sons buried him, and afterward they transported his bones. It preserves the deliberately terse and potentially context-dependent wording of ἔνθα ἦν (“where ... were”) without adding that the patriarchs were buried there. “ले गए” adequately conveys ἀπήνεγκαν in idiomatic Hindi; the English audit trail’s “carried up” does not require a directional addition unsupported by the supplied Greek wording.'
