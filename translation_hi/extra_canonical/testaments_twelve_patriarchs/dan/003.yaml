  text: 'If you lose truth and patience[a], you will perish.


    2 Anger is blindness, for it does not allow one to see anyone’s face truly. 3 Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him. 4 For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision. 5 And with what does it veil his eyes? With hatred of heart against his brother, leading to envy.


    6 For anger is evil, my children, because it throws even the soul itself into turmoil. 7 And it gives strength to the body, so that it may commit every lawless deed. 8 And when the body has done all these things, the soul justifies what has been done, because it does not see rightly. 9 Therefore the one who is angry, if he is physically strong, has his soul’s power for anger threefold: one from the help of attendants, by which he justifies the deed; a second through wealth, persuading and overpowering unjustly[b]; and a third, because he has natural strength, by it he does evil. 10 But if the one who is angry is weak, he has the passion of wrath in him twofold[d][c], for anger always helps him toward wrongdoing.'
translation:
  language: hi
  text: 'यदि तुम सत्य और धीरज[a] को खो दोगे, तो नष्ट हो जाओगे।


    2 क्योंकि क्रोध अंधापन है; वह किसी व्यक्ति का चेहरा सही रूप में देखने नहीं देता[b]। 3 चाहे वह पिता हो या माता, क्रोध उन्हें शत्रु समझता है। यदि वह भाई हो, तो उसे पहचानता नहीं; यदि प्रभु का नबी हो, तो उसकी बात नहीं मानता; यदि धर्मी हो, तो उसे देखता नहीं; यदि मित्र हो, तो उसे पहचानता नहीं। 4 क्योंकि क्रोध की आत्मा उसे छल के जाल में लपेट लेती है और उसकी आँखें अंधी कर देती है। वह झूठ के द्वारा उसकी बुद्धि को अंधकारमय कर देती है और उसे अपनी ही दृष्टि देती है[c]। 5 वह उसकी आँखों पर किस चीज़ का परदा डालती है? उसके भाई के विरुद्ध हृदय के बैर का, जो ईर्ष्या तक ले जाता है।


    3:1 क्योंकि क्रोध बुरा है, मेरे बच्चो; वह स्वयं प्राण को भी बुरी तरह अशांत कर देता है। 2 वह क्रोधित व्यक्ति के शरीर को अपना बना लेता है, उसके प्राण पर अधिकार कर लेता है, और शरीर को शक्ति देता है, ताकि वह हर प्रकार का अधर्म करे। 3 और जब शरीर ये सब काम कर चुकता है, तब प्राण भी किए हुए कामों को सही ठहराता है, क्योंकि वह ठीक तरह से देख नहीं पाता।


    4 इसलिए क्रोधित व्यक्ति यदि शरीर से बलवान हो, तो क्रोध में उसकी शक्ति तीन गुनी होती है: एक उसकी सेवा करनेवालों की सहायता से; दूसरी धन के द्वारा, जिससे वह लोगों को मनाता और अन्याय से उन पर हावी होता है; और तीसरी उसकी स्वाभाविक शक्ति से, जिसके द्वारा वह बुराई करता है। 5 पर यदि क्रोधित व्यक्ति निर्बल हो, तो रोष[d] की प्रवृत्ति उसमें दुगुनी होकर उभरती है; क्योंकि क्रोध अधर्म करने में सदा उसकी सहायता करता है। 6 यह आत्मा सदा झूठ के साथ शैतान की दाहिनी ओर चलती है, ताकि उसके काम क्रूरता और झूठ में हों[e]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धीरज’ के लिए ‘दीर्घ सहनशीलता’ भी संभव है (μακροθυμία)।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “किसी का चेहरा सत्य में देखना”; यह किसी व्यक्ति को सही रूप में पहचानने या समझने का बिंब है।
    reason: lexical_alternative
  - marker: c
    text: “अपनी ही दृष्टि” से आशय यह हो सकता है कि क्रोध वास्तविकता के स्थान पर अपनी विकृत दृष्टि दे देता है।
    reason: ambiguity
  - marker: d
    text: यहाँ यूनानी पाठ पहले प्रयुक्त θυμός (‘क्रोध’) के स्थान पर ὀργή (‘रोष’) शब्द का प्रयोग करता है।
    reason: lexical_alternative
  - marker: e
    text: “उसके काम” का संकेत शैतान के कामों की ओर भी हो सकता है और क्रोध के वश में व्यक्ति के कामों की ओर भी।
    reason: referential_ambiguity
lexical_decisions:
- source_word: μακροθυμία
  choice: धीरज
  rationale: यह शब्द सहनशीलता और देर तक संयम बनाए रखने, दोनों का भाव देता है; ‘धीरज’ आधुनिक और सहज है।
- source_word: τύφλωσις
  choice: अंधापन
  rationale: क्रोध को नैतिक और बोधगत अंधेपन के रूप में प्रस्तुत करनेवाले सूत्रात्मक कथन को बनाए रखता है।
- source_word: θυμός
  choice: क्रोध
  rationale: पूरे अंश के मुख्य दुर्गुण के लिए स्वाभाविक और व्यापक हिन्दी शब्द।
- source_word: ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ
  choice: किसी व्यक्ति का चेहरा सही रूप में देखना
  rationale: यूनानी के ठोस ‘चेहरा देखने’ के बिंब को रखते हुए सही पहचान या आकलन का आशय संप्रेषित करता है।
- source_word: δίκτυον τῆς πλάνης
  choice: छल का जाल
  rationale: फँसाने के बिंब और संदर्भ में उपस्थित झूठ, दोनों को बनाए रखता है।
- source_word: τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ
  choice: उसे अपनी ही दृष्टि देती है
  rationale: क्रोध द्वारा वास्तविकता के स्थान पर अपनी विकृत दृष्टि देने की असामान्य अभिव्यक्ति को बिना पूरी तरह स्पष्ट किए सुरक्षित रखता है।
- source_word: ἐκταράσσει
  choice: बुरी तरह अशांत कर देता है
  rationale: क्रिया की तीव्रता तथा प्राण के भीतर उत्पन्न उथल-पुथल को व्यक्त करता है।
- source_word: ὀργή
  choice: रोष
  rationale: मुख्य शब्द θυμός के लिए प्रयुक्त ‘क्रोध’ से यूनानी की शब्दगत भिन्नता को कुछ सीमा तक बनाए रखता है।
- source_word: παρανομία
  choice: अधर्म
  rationale: नैतिक रूप से व्यवस्था-विरुद्ध आचरण का भाव देता है और धार्मिक उपदेशात्मक शैली में स्वाभाविक है।
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: शैतान की दाहिनी ओर
  rationale: असामान्य स्थान-संबंधी यूनानी बिंब को व्याख्यात्मक रूप से बदलने के बजाय सीधे सुरक्षित रखता है।
theological_decisions:
- issue: προφήτης Κυρίου में κύριος
  choice: प्रभु का नबी
  alternative: परमेश्वर का नबी
  rationale: मूल में स्पष्ट रूप से Κυρίου है; इसलिए उपाधि ‘प्रभु’ को सामान्यीकृत नहीं किया गया।
- issue: क्रोध की आत्मा का व्यक्तिकरण
  choice: ‘क्रोध की आत्मा’ और उसकी सक्रिय क्रियाओं को बनाए रखा गया
  alternative: इसे केवल मनोवैज्ञानिक भावना अथवा स्पष्ट स्वतंत्र दुष्टात्मा के रूप में समझाना
  rationale: मूल पाठ इसे सक्रिय शक्ति के रूप में व्यक्त करता है, पर उसका सत्तात्मक स्वरूप निश्चित नहीं करता; अनुवाद उसी तनाव को बनाए रखता है।
- issue: σῶμα और ψυχή की नैतिक मनोविज्ञान
  choice: σῶμα को ‘शरीर’ और ψυχή को ‘प्राण’ कहा गया
  alternative: ψυχή को ‘मन’ या ‘आत्मा’ कहना
  rationale: पाठ शरीर और आंतरिक जीवित व्यक्ति के बीच भेद करता है; ‘प्राण’ इस भेद को रखता है और ‘क्रोध की आत्मा’ से शब्दगत भ्रम भी घटाता है।
- issue: अंतिम वाक्य में αὐτοῦ का संदर्भ
  choice: अस्पष्ट सर्वनाम ‘उसके काम’ रखा गया
  alternative: इसे स्पष्ट रूप से ‘शैतान के काम’ या ‘क्रोधित व्यक्ति के काम’ कहना
  rationale: निकटतम व्याकरणिक संदर्भ शैतान हो सकता है, पर पूरे अनुच्छेद का विषय क्रोधग्रस्त व्यक्ति भी हो सकता है; मूल की अस्पष्टता को सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, उपदेशात्मक किंतु सहज रखी गई है। ‘मेरे बच्चो’ पारिवारिक संबोधन की आत्मीयता रखता है। अध्याय-सीमा को स्पष्ट करने के लिए 3:1 अंकित किया गया है, क्योंकि उपलब्ध स्रोत की शुरुआत पिछले अध्याय के अंतिम वाक्य और पदों से होती है।
