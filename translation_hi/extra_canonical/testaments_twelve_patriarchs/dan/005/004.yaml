source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ οἶδα²⁷ ὅτι ἐν ταῖς²⁸ ἐσχάταις ἡμέραις ἀποστήσεσθε²⁹ τοῦ Κυρίου, καὶ προσοχθιεῖτε³⁰ τῷ³¹ Λευί, καὶ πρὸς τῷ³² Ἰουδὰ³³ παρατάξεσθε³⁴, ἀλλ᾽ οὐ δυνήσεσθε³⁵ πρὸς αὐτούς³⁶. *ἄγγελος γὰρ Κυρίου ὁδηγεῖ ἑκατέρους³⁷, ὅτι ἐν αὐτοῖς³⁸ στήσεται ὁ³⁹ Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/004.yaml
  text: I know that in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will array yourselves against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.
translation:
  language: hi
  text: मैं जानता हूँ कि अंतिम दिनों में तुम प्रभु से दूर हो जाओगे, लेवी को क्रोधित करोगे और यहूदा के विरुद्ध युद्ध के लिए खड़े हो जाओगे; पर तुम उन पर प्रबल न हो सकोगे। क्योंकि प्रभु का एक स्वर्गदूत उन दोनों का मार्गदर्शन करता है, और उन्हीं के द्वारा इस्राएल स्थिर रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε τοῦ Κυρίου
  choice: प्रभु से फिर जाओगे
  rationale: क्रिया में प्रभु से दूर हटने या विद्रोह करने का भाव है; यह अभिव्यक्ति उसे सहज और पर्याप्त रूप से खुला रखती है।
- source_word: προσοχθιεῖτε τῷ Λευί
  choice: लेवी को क्रोधित करोगे
  rationale: दत्तिव के साथ क्रिया का अर्थ यहाँ लेवी को चिढ़ाना या क्रोध दिलाना है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: πρὸς τῷ Ἰουδὰ παρατάξεσθε
  choice: यहूदा के विरुद्ध युद्ध के लिए खड़े हो जाओगे
  rationale: παρατάσσω युद्ध-विन्यास में सामने खड़े होने का भाव देता है; हिन्दी में सैन्य आशय बनाए रखते हुए अतिशाब्दिक भाषा से बचा गया है।
- source_word: οὐ δυνήσεσθε πρὸς αὐτούς
  choice: उन पर प्रबल न हो सकोगे
  rationale: मुहावरे का संदर्भगत अर्थ उनका सामना करके उन पर विजय या बढ़त न पा सकना है।
- source_word: ὁδηγεῖ ἑκατέρους
  choice: उन दोनों का मार्गदर्शन करता है
  rationale: ἑκατέρους लेवी और यहूदा दोनों को समष्टिगत रूप से निर्दिष्ट करता है।
- source_word: ἐν αὐτοῖς στήσεται ὁ Ἰσραήλ
  choice: उन्हीं के द्वारा इस्राएल स्थिर खड़ा रहेगा
  rationale: ἐν αὐτοῖς साधन, आधार या परिधि का भाव दे सकता है; 'उन्हीं के द्वारा' अंग्रेज़ी परामर्श-पाठ से मेल खाता है, जबकि 'स्थिर खड़ा रहेगा' στήσεται के रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु के स्वर्गदूत की पहचान
  choice: प्रभु का एक स्वर्गदूत
  alternative: प्रभु का स्वर्गदूत
  rationale: यूनानी में ἄγγελος अनिश्चित रूप में है; किसी विशिष्ट पारंपरिक पहचान को आरोपित न करते हुए 'एक' रखा गया है।
- issue: इस्राएल के स्थिर होने में लेवी और यहूदा की भूमिका
  choice: उन्हीं के द्वारा
  alternative: उन्हीं में
  rationale: वाक्यांश को साधनात्मक रूप में प्रस्तुत किया गया है, पर उसे किसी विशिष्ट संस्थागत या मसीही सिद्धान्त के रूप में नहीं खोला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। सैन्य संदर्भ को स्पष्ट रखा गया है और मूल की भविष्यसूचक शैली तथा धार्मिक तनाव को बिना सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
