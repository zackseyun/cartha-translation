id: T12P.DAN.5.10
reference: Testament of Dan 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἀνατελεῖ ὑμῖν *ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευὶ τὸ σωτήριον Κυρίου⁸³, *αὐτὸς γὰρ⁸⁴ ποιήσει πρὸς τὸν Βελίαρ πόλεμον⁸⁵, καὶ τὴν ἐκδίκησιν τοῦ νίκους δώσει τοῖς⁸⁶ †πατράσιν⁸⁷ ὑμῶν⁸⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/010.yaml
  text: And for you the salvation of the Lord will arise from the tribe of Judah and Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.
translation:
  language: hi
  text: और तुम्हारे लिए [यहूदा और][a] लेवी के गोत्र से प्रभु का उद्धार उदित होगा। क्योंकि वह स्वयं बेलियार से युद्ध करेगा और विजय का प्रतिशोध तुम्हारे पूर्वजों[b] को प्रदान करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहूदा और” शब्द यूनानी संस्करण में संपादकीय कोष्ठकों में हैं, जो इनके पाठगत रूप से अनिश्चित होने का संकेत देते हैं।
    reason: मूल संस्करण की स्पष्ट पाठगत अनिश्चितता को पाठक के सामने रखना।
  - marker: b
    text: “पूर्वजों” के लिए यूनानी पाठ संदिग्ध चिह्नित है; उपलब्ध मुद्रित पाठ का सीधा अर्थ यही है।
    reason: संदिग्ध स्रोत-पाठ को बिना अनुमान से सुधार किए ईमानदारी से दर्शाना।
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: उदित होगा
  rationale: क्रिया के ‘उगने/प्रकट होने’ वाले रूपक को बनाए रखता है और उद्धार के आगमन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ σωτήριον Κυρίου
  choice: प्रभु का उद्धार
  rationale: यूनानी संज्ञात्मक पदबंध को जानबूझकर व्यक्ति या किसी विशिष्ट मसीही उपाधि में नहीं बदला गया।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: नाम का देवनागरी लिप्यंतरण किया गया है; इसे ‘शैतान’ जैसे व्याख्यात्मक पर्याय से नहीं बदला गया।
- source_word: τὴν ἐκδίκησιν τοῦ νίκους
  choice: विजय का प्रतिशोध
  rationale: असामान्य यूनानी संबंध-वाक्यांश की अस्पष्टता और तनाव को सहजतर लेकिन अधिक व्याख्यात्मक अर्थ से बदले बिना सुरक्षित रखता है।
- source_word: πατράσιν ὑμῶν
  choice: तुम्हारे पूर्वजों
  rationale: πατέρες का प्रसंगानुकूल सामूहिक अर्थ ‘पूर्वज’ है; फिर भी स्रोत में यह पाठ संदिग्ध चिह्नित है, इसलिए पादटिप्पणी दी गई है।
theological_decisions:
- issue: ‘प्रभु का उद्धार’ का व्यक्तिकरण
  choice: प्रभु का उद्धार
  alternative: प्रभु का उद्धारकर्ता
  rationale: मूल में σωτήριον है, स्पष्ट रूप से σωτήρ (‘उद्धारकर्ता’) नहीं; अगले पुल्लिंग सर्वनाम के बावजूद मूल की व्याकरणिक और धर्मवैचारिक दुविधा को नहीं सुलझाया गया।
- issue: यहूदा और लेवी से उत्पत्ति
  choice: '[यहूदा और] लेवी के गोत्र से'
  alternative: यहूदा और लेवी के गोत्रों से
  rationale: मूल में ‘गोत्र’ एकवचन है और ‘यहूदा और’ संपादकीय कोष्ठकों में है; हिन्दी में इस असामान्य समन्वय को बनाए रखा गया और पाठगत अनिश्चितता बताई गई।
- issue: प्रतिशोध के प्राप्तकर्ता
  choice: तुम्हारे पूर्वजों को
  alternative: तुम्हारे शत्रुओं पर
  rationale: मुद्रित यूनानी पाठ πατράσιν ὑμῶν का यही सीधा अर्थ है। पाठ संदिग्ध होने पर भी अनुमानित संशोधन को मुख्य पाठ में नहीं रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय किंतु सुबोध शैली रखी गई है। ‘उदित होगा’, ‘प्रतिशोध’ और ‘प्रदान करेगा’ मूल के औपचारिक तथा अपोकैलिप्टिक स्वर को बनाए रखते हैं; पाठगत कठिनाइयों को पादटिप्पणियों में स्पष्ट किया गया है।
