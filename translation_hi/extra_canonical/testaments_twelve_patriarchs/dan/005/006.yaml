reference: Testament of Dan 5:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[᾿Ανέγνων γὰρ⁵⁰ ἐν βίβλῳ Ἐνὼχ⁵¹ τοῦ δικαίου ⌈καὶ ἔγνων⌉¹⁵² ὅτι ὁ⁵³ ἄρχων ὑμῶν⁵⁴ ὁ Σατανᾶς ἐστιν⁵⁵ *καὶ ὅτι⁵⁶ τὰ πνεύματα τῆς πονηρίας⁵⁷ καὶ τῆς ὑπερηφανίας †ὑπακούσονται⁵⁸ *τοῦ παρεδρεύειν⁵⁹ τοῖς υἱοῖς Λευί, τοῦ ποιεῖν⁶⁰ αὐτοὺς ἐξαμαρτάνειν ἐνώπιον Κυρίου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/006.yaml
  text: For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and pride will obey in attending the sons of Levi, to make them sin before the Lord.
translation:
  language: hi
  text: क्योंकि मैंने धर्मी हनोक की पुस्तक में पढ़ा और जाना कि तुम्हारा शासक शैतान है, और दुष्टता और घमंड की आत्माएँ लेवी के पुत्रों के पास रहने के लिए आज्ञा मानेंगी,[a] ताकि वे उनसे प्रभु के सामने पाप करवाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी वाक्य-विन्यास कठिन है। यह स्पष्ट नहीं है कि आत्माएँ किसकी आज्ञा मानेंगी; ‘लेवी के पुत्रों के पास रहने’ का अर्थ उनके निकट उपस्थित रहने या उनकी सेवा में रहने का भी हो सकता है।
    reason: ὑπακούσονται का लक्ष्य व्यक्त नहीं किया गया है, और τοῦ παρεδρεύειν का संबंध तथा बल अनिश्चित है; पादटिप्पणी बिना किसी व्याख्यात्मक निर्णय को थोपे इस अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: धर्मी हनोक
  rationale: संबंधकारक पदबंध हनोक का वर्णन करता है; यह स्वाभाविक हिन्दी में उसकी उपाधि के रूप में रखा गया है।
- source_word: ὁ ἄρχων ὑμῶν
  choice: तुम्हारा शासक
  rationale: ἄρχων के अधिकार और शासन के भाव को बनाए रखता है; ὑμῶν बहुवचन है, जिसे प्रसंगानुसार सामूहिक ‘तुम्हारा’ से व्यक्त किया गया है।
- source_word: τὰ πνεύματα τῆς πονηρίας καὶ τῆς ὑπερηφανίας
  choice: दुष्टता और घमंड की आत्माएँ
  rationale: दोनों संबंधकारक अमूर्त गुणों को दर्शाते हैं; समानांतर संरचना हिन्दी में भी सुरक्षित रखी गई है।
- source_word: ἐξαμαρτάνειν ἐνώπιον Κυρίου
  choice: प्रभु के सामने पाप करवाएँ
  rationale: ποιεῖν ... ἐξαμαρτάνειν की कारणवाचक संरचना और ἐνώπιον का प्रत्यक्ष अर्थ दोनों बनाए गए हैं।
theological_decisions:
- issue: शैतान को संबोधित लोगों का ‘शासक’ कहना
  choice: ‘तुम्हारा शासक शैतान है’ को सीधे बनाए रखा गया
  alternative: इसे नरम करके ‘तुम पर शैतान का प्रभाव है’ कहना
  rationale: मूल पाठ स्पष्ट रूप से ἄρχων, अर्थात् शासक, कहता है; इसकी तीक्ष्ण धार्मिक भाषा को व्याख्यात्मक रूप से हल्का नहीं किया गया।
- issue: आत्माओं के आज्ञापालन का लक्ष्य अस्पष्ट है
  choice: ‘लेवी के पुत्रों के पास रहकर आज्ञा मानेंगी’
  alternative: ‘लेवी के पुत्रों की आज्ञा मानेंगी’ या ‘शैतान की आज्ञा मानेंगी’
  rationale: यूनानी वाक्य यह स्पष्ट नहीं करता कि आत्माएँ किसकी आज्ञा मानती हैं; अनुवाद किसी अनिर्दिष्ट कर्ता को नहीं जोड़ता और अस्पष्टता को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रत्यक्ष रूप अपनाया गया है। ‘धर्मी हनोक’, ‘शासक’, ‘आत्माएँ’ और ‘प्रभु के सामने’ जैसे पद मूल की धार्मिक और साहित्यिक गंभीरता बनाए रखते हैं; कठिन यूनानी वाक्यविन्यास को अत्यधिक व्याख्यात्मक बनाए बिना पठनीय किया गया है।
