source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὕτως⁷⁷ ἐπιστρέψαντες⁷⁸ πρὸς Κύριον ἐλεηθήσεσθε⁷⁹ καὶ ἄξει ὑμᾶς⁸⁰ εἰς τὸ ἁγίασμα αὐτοῦ *καὶ δώσει⁸¹ ὑμῖν εἰρήνην⁸².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/009.yaml
  text: And so, having returned to the Lord, you will receive mercy, and he will bring you into his sanctuary and give you peace.
translation:
  language: hi
  text: और इस प्रकार प्रभु की ओर लौट आने पर तुम पर दया की जाएगी, और वह तुम्हें अपने पवित्रस्थान में ले जाएगा और तुम्हें शांति देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψαντες πρὸς Κύριον
  choice: प्रभु की ओर लौट आने पर
  rationale: पूर्वकालिक कृदंत का भाव सुरक्षित रखते हुए यह स्पष्ट किया गया है कि प्रभु की ओर लौटना दया प्राप्त होने से पहले है।
- source_word: ἐλεηθήσεσθε
  choice: तुम पर दया की जाएगी
  rationale: यूनानी भविष्यत् कर्मवाच्य को कर्मवाच्य रूप में रखा गया है; कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: τὸ ἁγίασμα αὐτοῦ
  choice: अपने पवित्रस्थान में
  rationale: ἁγίασμα के पवित्र स्थान अथवा धर्मस्थान संबंधी अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: δώσει ὑμῖν εἰρήνην
  choice: तुम्हें शांति देगा
  rationale: भविष्यत् क्रिया और εἰρήνη के सामान्य अर्थ को सीधे और स्वाभाविक ढंग से रखा गया है।
theological_decisions:
- issue: दया करने वाले की पहचान
  choice: कर्मवाच्य ‘तुम पर दया की जाएगी’
  alternative: ‘प्रभु तुम पर दया करेगा’
  rationale: पाठ में ἐλεηθήσεσθε कर्मवाच्य है और उसमें कर्ता स्पष्ट नहीं है; सम्भावित दैवी कर्ता को अनुवाद में खुलकर जोड़ना मूल की सूक्ष्म अस्पष्टता मिटा देता।
- issue: ἁγίασμα का आशय
  choice: पवित्रस्थान
  alternative: मंदिर / पवित्रता
  rationale: संदर्भ में प्रवेश कराने की क्रिया किसी पवित्र स्थान की ओर संकेत करती है; ‘पवित्रस्थान’ किसी विशेष ऐतिहासिक भवन की अनावश्यक पहचान किए बिना यह अर्थ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’; शैली सरल, गरिमापूर्ण और स्रोत की वाक्यगत क्रमबद्धता के निकट रखी गई है।
