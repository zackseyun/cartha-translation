base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/001.yaml
  text: Therefore, my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, प्रभु की आज्ञा मानो और उसकी व्यवस्था का पालन करो। क्रोध से दूर हो जाओ और झूठ से घृणा करो, ताकि प्रभु तुममें वास करे और बेलियार तुमसे दूर भाग जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: मानो
  rationale: आज्ञा के साथ प्रयुक्त क्रिया का स्वाभाविक आधुनिक हिन्दी रूप; इसमें आज्ञा को सुरक्षित रखने के साथ उसका पालन करने का भाव है।
- source_word: τὸν νόμον αὐτοῦ τηρήσατε
  choice: उसकी व्यवस्था का पालन करो
  rationale: νόμος के लिए धार्मिक-साहित्यिक हिन्दी में प्रचलित ‘व्यवस्था’ और τηρέω के लिए स्वाभाविक ‘पालन करो’ चुना गया।
- source_word: ἀπόστητε ἀπὸ τοῦ θυμοῦ
  choice: क्रोध से दूर हो जाओ
  rationale: ἀφίστημι के अलग हो जाने/हट जाने के बल को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ ψεῦδος
  choice: झूठ
  rationale: अमूर्त falsehood के लिए साधारण पाठकों को सहज समझ आने वाला व्यापक हिन्दी शब्द।
- source_word: κατοικήσει ἐν ὑμῖν
  choice: तुममें वास करे
  rationale: ἐν ὑμῖν के ‘तुममें’ अर्थ को बनाए रखते हुए κατοικέω को गरिमापूर्ण धार्मिक हिन्दी में व्यक्त किया गया।
- source_word: ὁ Βελίαρ
  choice: बलियार
  rationale: व्यक्तिवाचक नाम को हिन्दी लिपि में ध्वन्यात्मक रूप से प्रस्तुत किया गया, उसका अर्थ लगाकर अनुवाद नहीं किया गया।
theological_decisions:
- issue: ἵνα के बाद भविष्यकालीन κατοικήσει और φεύξεται का आशय
  choice: ‘ताकि ... वास करे और ... दूर भाग जाए’
  alternative: ‘जिससे ... वास करेगा और ... दूर भागेगा’
  rationale: ἵνα यहाँ उद्देश्य अथवा अपेक्षित परिणाम व्यक्त कर सकता है। हिन्दी में ‘ताकि’ और संभावनार्थक क्रियाएँ इस तनाव को बिना कठोर प्रतिज्ञा या मात्र परिणाम में सीमित किए सुरक्षित रखती हैं।
- issue: ἐν ὑμῖν का सामूहिक अथवा व्यक्तिगत अर्थ
  choice: ‘तुममें’
  alternative: ‘तुम्हारे बीच’
  rationale: यूनानी पदबंध दोनों प्रकार का संकेत दे सकता है। शाब्दिक निकटता रखते हुए ‘तुममें’ चुना गया है; हिन्दी बहुवचन संदर्भ में यह सामूहिक और व्यक्तिगत दोनों संभावनाएँ खुली रख सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण संबोधन और आज्ञार्थक शैली। ‘बच्चो’ का संबोधन स्वाभाविक हिन्दी वर्तनी के अनुसार बिना अनुस्वार/विसर्ग के रखा गया है। किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
