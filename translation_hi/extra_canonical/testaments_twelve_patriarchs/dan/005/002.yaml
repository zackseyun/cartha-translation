id: T12P.DAN.5.2
reference: Testament of Dan 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἀλήθειαν φθέγγεσθε¹⁴ ἕκαστος πρὸς τὸν πλησίον αὐτοῦ καὶ οὐ μὴ ἐμπέσητε εἰς μῆνιν¹⁵ *καὶ ταραχάς¹⁶, ἀλλ᾽ ἔσεσθε¹⁷ ἐν εἰρήνῃ ἔχοντες τὸν θεὸν *τῆς εἰρήνης¹⁸ καὶ *οὐ μὴ κατισχύσει¹⁹ ὑμῶν²⁰ πόλεμος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/002.yaml
  text: Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace, and no war will prevail against you.
translation:
  language: hi
  text: तुममें से हर एक अपने पड़ोसी से सच बोले। तब तुम निश्चय ही क्रोध और उपद्रवों में नहीं पड़ोगे, बल्कि शांति के परमेश्वर को अपने साथ पाकर शांति में रहोगे, और कोई युद्ध तुम पर प्रबल नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν φθέγγεσθε
  choice: सच बोले
  rationale: आदेशात्मक भाव और ‘सत्य बोलने’ के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: तुममें से हर एक अपने पड़ोसी से
  rationale: ἕκαστος के व्यक्तिगत बल को बनाए रखता है और πλησίον के लिए परिचित बाइबिलीय शब्द ‘पड़ोसी’ का प्रयोग करता है।
- source_word: μῆνιν καὶ ταραχάς
  choice: क्रोध और उपद्रवों
  rationale: μῆνις के प्रबल क्रोध तथा ταραχαί के अशांति/हंगामे के बहुवचन भाव को सुरक्षित रखता है।
- source_word: ἔσεσθε ἐν εἰρήνῃ
  choice: शांति में रहोगे
  rationale: ग्रीक की अवस्थासूचक अभिव्यक्ति का सहज हिन्दी रूप है।
- source_word: ἔχοντες τὸν θεὸν τῆς εἰρήνης
  choice: शांति के परमेश्वर को अपने साथ पाकर
  rationale: ‘परमेश्वर को रखते हुए’ जैसी अस्वाभाविक और भ्रामक हिन्दी से बचते हुए साथ/उपस्थिति का भाव व्यक्त करता है।
- source_word: οὐ μὴ κατισχύσει ὑμῶν πόλεμος
  choice: कोई युद्ध तुम पर प्रबल नहीं होगा
  rationale: οὐ μή की प्रबल निषेधात्मकता और κατισχύω के ‘प्रबल होना/वश में करना’ भाव को बनाए रखता है।
theological_decisions:
- issue: ‘शांति के परमेश्वर को धारण/अपने साथ रखने’ का संबंध
  choice: शांति के परमेश्वर को अपने साथ पाकर
  alternative: शांति के परमेश्वर को रखते हुए
  rationale: यह परमेश्वर पर मानवीय स्वामित्व का संकेत दिए बिना ἔχοντες की संगति या साथ होने की व्यापकता को बनाए रखता है।
- issue: युद्ध से सुरक्षा का कथन
  choice: कोई युद्ध तुम पर प्रबल नहीं होगा
  alternative: तुम्हारे विरुद्ध युद्ध सफल नहीं होगा
  rationale: मूल पाठ युद्ध के अस्तित्व का निषेध नहीं करता, बल्कि उसके प्रबल होने का निषेध करता है; इसलिए तनाव को यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली। ‘तुम’ बहुवचन समुदाय को संबोधित करता है, जबकि ‘हर एक’ व्यक्तिगत उत्तरदायित्व स्पष्ट करता है।
