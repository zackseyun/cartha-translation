source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ὡς ἂν ἀποστήσεσθε⁴⁰ ἀπὸ⁴¹ Κυρίου⁴², *ἐν πάσῃ κακίᾳ⁴³ *πορευόμενοι ποιήσετε τὰ βδελύγματα τῶν ἐθνῶν ἐκπορνεύοντες ἐν⁴⁴ γυναιξὶν ἀνόμων⁴⁵ καὶ ἐν πάσῃ πονηρίᾳ⁴⁶ ἐνεργούντων⁴⁷ ⌈ἐν ὑμῖν⌉¹ *τῶν πνευμάτων⁴⁸ τῆς πονηρίας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/005.yaml
  text: And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and every evil will be at work among you through the spirits of wickedness.
translation:
  language: hi
  text: और जब कभी तुम प्रभु से दूर हो जाओगे, तब हर प्रकार की बुराई में चलते हुए तुम अन्यजातियों के घृणित कर्म करोगे, अधर्मी स्त्रियों के साथ यौन अनैतिकता में लिप्त होते हुए; और दुष्टता की आत्माएँ तुम्हारे बीच हर प्रकार की बुराई में काम करती होंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: प्रभु से दूर हो जाओगे
  rationale: क्रिया में अलग हो जाने या विमुख होने का भाव है; यह सहज हिन्दी में उस संबंध-विच्छेद को व्यक्त करता है।
- source_word: τὰ βδελύγματα τῶν ἐθνῶν
  choice: अन्यजातियों के घिनौने काम
  rationale: βδελύγματα नैतिक अथवा धार्मिक रूप से घृणित आचरण बताता है; 'घिनौने काम' आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: ἐκπορνεύοντες ἐν γυναιξὶν ἀνόμων
  choice: अधर्मी स्त्रियों के साथ व्यभिचार करोगे
  rationale: ἐκπορνεύω यौन अनैतिकता में पड़ने का प्रबल अर्थ रखता है और ἄνομος व्यवस्था-विरुद्ध अथवा अधर्मी होने को दर्शाता है।
- source_word: ἐνεργούντων ἐν ὑμῖν τῶν πνευμάτων τῆς πονηρίας
  choice: दुष्टता की आत्माओं के द्वारा ... तुम्हारे बीच सक्रिय होगी
  rationale: वाक्यांश आत्माओं को बुराई की सक्रियता का माध्यम या कर्ता प्रस्तुत करता है; हिन्दी में 'के द्वारा' इस संबंध को स्पष्ट किंतु अनावश्यक रूप से व्याख्यायित किए बिना व्यक्त करता है।
theological_decisions:
- issue: दुष्टता की आत्माओं की भूमिका
  choice: उन्हें बुराई की सक्रियता के माध्यम के रूप में रखा गया
  alternative: हर बुराई और दुष्टता की आत्माएँ तुम्हारे बीच काम करेंगी
  rationale: यूनानी वाक्यरचना कठिन है, पर प्राप्त पाठ और परामर्श-पाठ πνευμάτων को बुराई के सक्रिय होने से साधनात्मक रूप में जोड़ते हैं; अनुवाद इसी संबंध को सुरक्षित रखता है।
- issue: ἐν ὑμῖν का अर्थ
  choice: तुम्हारे बीच
  alternative: तुम्हारे भीतर
  rationale: बहुवचन संबोधन में वाक्यांश सामुदायिक दायरे या व्यक्तियों के भीतर—दोनों संकेत दे सकता है; 'तुम्हारे बीच' अधिक स्वाभाविक है और सामूहिक संदर्भ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। भविष्यकालीन क्रम को 'जब... तब...' और अंतिम 'होगी' से स्पष्ट किया गया है; मूल की नैतिक तीव्रता को नरम नहीं किया गया।
