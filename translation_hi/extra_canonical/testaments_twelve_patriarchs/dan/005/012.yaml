  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἀναπαύσονται ἐν Ἐδὲμ ἅγιοι⁹⁵, καὶ ἐπὶ *τῆς νέας⁹⁶ Ἱερουσαλὴμ εὐφρανθήσονται δίκαιοι, *ἥτις ἐστι δόξα θεοῦ αἰώνιος⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/012.yaml
  text: And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.
translation:
  language: hi
  text: और पवित्र जन अदन में विश्राम पाएँगे, और धर्मी नई यरूशलेम पर आनन्द मनाएँगे, जो परमेश्वर की अनन्त महिमा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπαύσονται
  choice: विश्राम पाएँगे
  rationale: भविष्यकालीन अर्थ और विश्राम प्राप्त करने की स्वाभाविक हिन्दी अभिव्यक्ति को बनाए रखता है।
- source_word: ἅγιοι
  choice: पवित्र जन
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण का स्पष्ट और गरिमापूर्ण हिन्दी रूप।
- source_word: ἐπὶ τῆς νέας Ἱερουσαλήμ
  choice: नई यरूशलेम पर
  rationale: ἐπί के मूल संबंध को निकटता से सुरक्षित रखता है; इसे चुपचाप ‘में’ नहीं बदला गया।
- source_word: εὐφρανθήσονται
  choice: आनन्द मनाएँगे
  rationale: उल्लास और प्रसन्नता के सक्रिय भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δόξα θεοῦ αἰώνιος
  choice: परमेश्वर की अनन्त महिमा
  rationale: संबंधकारक θεοῦ और विशेषण αἰώνιος की संरचना को सीधे और स्पष्ट रूप में रखता है।
theological_decisions:
- issue: ἥτις का संबंधवाचक अर्थ और उसका पूर्वपद
  choice: ‘जो’ द्वारा नई यरूशलेम को परमेश्वर की अनन्त महिमा बताया गया है
  alternative: ‘क्योंकि वह’ अथवा कथन को कारणसूचक बनाना
  rationale: ἥτις को संबंधवाचक रूप में रखना यूनानी संरचना के अधिक निकट है और पाठ में निहित पहचान के कथन को सुरक्षित रखता है।
- issue: ἐπί के स्थानिक/संबंधात्मक अर्थ की अस्पष्टता
  choice: ‘नई यरूशलेम पर आनन्द मनाएँगे’
  alternative: ‘नई यरूशलेम में आनन्द मनाएँगे’ या ‘नई यरूशलेम के कारण आनन्द मनाएँगे’
  rationale: मूल पाठ का ἐπί विविध अर्थ दे सकता है; ‘पर’ सबसे निकट औपचारिक समतुल्य है और किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-सन्निकट शैली। ‘अदन’, ‘यरूशलेम’, ‘धर्मी’ और ‘परमेश्वर’ जैसे प्रचलित बाइबलीय पद बनाए गए हैं।
