  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/003.yaml
  text: Love the Lord all your life, and one another with a true heart.
translation:
  language: hi
  text: अपने पूरे जीवन में प्रभु से प्रेम करो, और सच्चे हृदय से एक-दूसरे से प्रेम करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: प्रेम करो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यही क्रिया प्रभु और एक-दूसरे—दोनों के प्रति प्रेम पर लागू होती है।
- source_word: τὸν Κύριον
  choice: प्रभु से
  rationale: हिन्दी में ‘प्रेम करना’ के साथ व्यक्ति के लिए ‘से’ स्वाभाविक कारक है; ‘प्रभु’ Κύριον का प्रतिष्ठित और गरिमापूर्ण समतुल्य है।
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  choice: अपने पूरे जीवन में
  rationale: यह पदबंध जीवन की संपूर्ण अवधि को व्यक्त करता है; ‘अपने’ बहुवचन संबोधन के प्रत्येक श्रोता से स्वाभाविक रूप से जुड़ता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे से
  rationale: पारस्परिक सर्वनाम का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: ἐν ἀληθινῇ καρδίᾳ
  choice: सच्चे हृदय से
  rationale: ἀληθινῇ के सत्यनिष्ठ/निष्कपट भाव को बनाए रखते हुए मूल के ‘हृदय’ रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु की पहचान
  choice: मूल की तरह केवल ‘प्रभु’ रखा गया
  alternative: ‘परमेश्वर’ या किसी विशिष्ट व्यक्ति का नाम देना
  rationale: Κύριον यहाँ स्वयं पहचान स्पष्ट नहीं करता; अनुवाद में अतिरिक्त धार्मिक विशिष्टता जोड़ना उचित नहीं।
- issue: ἀληθινῇ καρδίᾳ का भाव
  choice: ‘सच्चे हृदय से’
  alternative: ‘निष्कपट मन से’
  rationale: चुना गया रूप मूल के καρδίᾳ (‘हृदय’) को बनाए रखता है और सत्यता, ईमानदारी तथा निष्कपटता के बीच की अर्थ-व्याप्ति को अनावश्यक रूप से संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बहुवचन आज्ञार्थक शैली। दूसरे खंड में ‘प्रेम करो’ दोहराने से हिन्दी वाक्य पूर्णतः स्पष्ट और स्वाभाविक बनता है, जबकि यूनानी में क्रिया की अर्थगत पुनरावृत्ति निहित है।
