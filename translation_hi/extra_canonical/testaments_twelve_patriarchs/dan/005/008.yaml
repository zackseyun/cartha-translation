translation:
  language: hi
  text: इसलिए तुम उनके साथᵃ बंदी बनाकर ले जाए जाओगे, और वहाँ तुम मिस्र की सारी विपत्तियाँ और राष्ट्रों की सारी बुराइयाँ भोगोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαχθήσεσθε
  choice: बंदी बनाकर ले जाए जाओगे
  rationale: कर्मवाच्य भाव और बलपूर्वक निर्वासन—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς αἰχμαλωσίαν
  choice: बंदी बनाकर
  rationale: ‘बंदीगृह’ की अपेक्षा सामूहिक निर्वासन और दासत्व की अवस्था का संकेत देता है; मुख्य क्रिया के साथ मिलाकर सहज हिन्दी बनाई गई है।
- source_word: ἀπολήψεσθε
  choice: भोगोगे
  rationale: यहाँ विपत्तियों और बुराइयों को ‘प्राप्त करना’ हिन्दी में अस्वाभाविक है; ‘भोगना’ परिणाम का सामना करने का भाव सुरक्षित रखता है।
- source_word: πληγὰς Αἰγύπτου
  choice: मिस्र की सारी विपत्तियाँ
  rationale: ‘plagues of Egypt’ के पारंपरिक और संदर्भानुकूल अर्थ को स्पष्ट रखता है।
- source_word: πονηρίας τῶν ἐθνῶν
  choice: अन्यजातियों की सारी बुराइयाँ
  rationale: πονηρίας की व्यापक नैतिक और दुःखदायी अर्थ-सीमा को ‘बुराइयाँ’ सुरक्षित रखता है; τῶν ἐθνῶν के लिए धर्मग्रंथीय किन्तु बोधगम्य ‘अन्यजातियाँ’ चुना गया है।
theological_decisions:
- issue: '[σὺν αὐτοῖς] पाठांतर की संदिग्ध स्थिति'
  choice: ‘उनके साथ’ को मुख्य पाठ में रखा गया
  alternative: वाक्यांश को हटाना या पादटिप्पणी में रखना
  rationale: प्रदत्त अंग्रेज़ी परामर्श-पाठ इसे स्वीकार करता है और यूनानी साक्ष्य में यह उपस्थित है, यद्यपि कोष्ठक इसकी पाठालोचनात्मक अनिश्चितता दर्शाते हैं। अर्थगत तनाव को बढ़ाए बिना इसे अनूदित किया गया है।
