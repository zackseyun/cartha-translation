id: T12P.DAN.5.13
reference: Testament of Dan 5:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὐκέτι ὑπομενεῖ⁹⁸ Ἱερουσαλὴμ ἐρήμωσιν *οὐδὲ αἰχμαλωτισθήσεται Ἰσραήλ⁹⁹, ὅτι¹⁰⁰ Κύριος ἔσται¹⁰¹ *ἐν μέσῳ¹⁰² αὐτῆς¹⁰³ [τοῖς ἀνθρώποις συναναστρεφόμενος]¹⁰⁴ καὶ §¹⁰⁵ Ἅγιος Ἰσραὴλ βασιλεύων¹⁰⁶ ἐπ᾽ αὐτῆς¹⁰⁷ [ἐν *ταπεινώσει καὶ πτωχείᾳ¹⁰⁸, καὶ ὁ πιστεύων *ἐπ᾽ αὐτῷ¹⁰⁹ *βασιλεύσει ἐν τοῖς ἀνθρώποις ἐν ἀληθείᾳ¹¹⁰].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/013.yaml
  text: And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst [dwelling among men], and the Holy One of Israel reigning over her [in humility and poverty; and the one who believes in him will reign among men in truth].
translation:
  language: hi
  text: और यरूशलेम को अब और उजाड़ नहीं सहना पड़ेगा, न इस्राएल को बंदी बनाया जाएगा, क्योंकि प्रभु उसके बीच होगा [मनुष्यों के साथ रहते हुए][a], और इस्राएल का पवित्र जन यरूशलेम पर राज्य करता हुआ होगा [दीनता और निर्धनता में; और जो इस्राएल के पवित्र जन पर विश्वास करता है, वह मनुष्यों के बीच सच्चाई से राज्य करेगा][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्यों के साथ रहते हुए” शब्द यूनानी स्रोत में कोष्ठकों में दिए गए हैं, जो इस अंश की पाठगत अनिश्चितता दर्शाते हैं।
    reason: स्रोत-संपादन में चिह्नित पाठगत अनिश्चितता को पाठक के सामने बनाए रखना।
  - marker: b
    text: “दीनता और निर्धनता में” से लेकर पद के अंत तक का अंश यूनानी स्रोत में कोष्ठकों में दिया गया है, जो इसकी पाठगत अनिश्चितता दर्शाता है।
    reason: लंबे कोष्ठकबद्ध अंश की अनिश्चित पाठ-स्थिति को बिना हटाए स्पष्ट करना।
lexical_decisions:
- source_word: ὑπομενεῖ ... ἐρήμωσιν
  choice: उजाड़ नहीं सहना पड़ेगा
  rationale: ‘उजाड़ को सहना/झेलना’ के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और यरूशलेम के उजाड़ बने रहने या उजाड़ का अनुभव करने की व्यापकता बनाए रखता है।
- source_word: αἰχμαλωτισθήσεται
  choice: बंदी बनाया जाएगा
  rationale: यूनानी निष्क्रिय क्रिया के भाव और सामूहिक इस्राएल के बंधुआई में ले जाए जाने के अर्थ को सुरक्षित रखता है।
- source_word: ἐν μέσῳ αὐτῆς
  choice: उसके बीच
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ यरूशलेम है; ‘उसके बीच’ मूल की स्थानवाचक अभिव्यक्ति को संक्षेप में बनाए रखता है।
- source_word: τοῖς ἀνθρώποις συναναστρεφόμενος
  choice: मनुष्यों के साथ रहते हुए
  rationale: सहवास, मेल-जोल और लोगों के बीच जीवन बिताने के भाव को सहज हिन्दी में देता है; केवल ‘बातचीत’ तक अर्थ को सीमित नहीं करता।
- source_word: Ἅγιος Ἰσραήλ
  choice: इस्राएल का पवित्र जन
  rationale: उपाधि को व्यक्तिवाचक रूप में रखता है और इसे अमूर्त ‘पवित्रता’ नहीं बनाता।
- source_word: ἐν ταπεινώσει καὶ πτωχείᾳ
  choice: दीनता और निर्धनता में
  rationale: ταπείνωσις की नम्रता/नीची अवस्था की अर्थ-सीमा को ‘दीनता’ में खुला रखता है और πτωχεία को स्पष्ट रूप से आर्थिक-सामाजिक ‘निर्धनता’ के रूप में प्रस्तुत करता है।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई से
  rationale: शाब्दिक ‘सत्य में’ की अपेक्षा स्वाभाविक हिन्दी है, जबकि सत्यनिष्ठ और वास्तविक रीति से राज्य करने का भाव बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु’ और ‘इस्राएल का पवित्र जन’ का पारस्परिक संबंध
  choice: दोनों पदों को मूल की तरह साथ रखा गया है, बिना यह घोषित किए कि वे एक ही व्यक्ति हैं या अलग।
  alternative: दोनों को स्पष्ट रूप से एक ही कर्ता मानकर संयुक्त वाक्य बनाना, अथवा उन्हें दो अलग व्यक्तियों के रूप में प्रस्तुत करना।
  rationale: यूनानी वाक्य दोनों अभिव्यक्तियों को निकटता से जोड़ता है, पर उनके संबंध को पूरी तरह स्पष्ट नहीं करता; अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
- issue: βασιλεύων का कृदन्तीय रूप
  choice: ‘राज्य करता हुआ’
  alternative: ‘राज्य करेगा’
  rationale: मूल के वर्तमान कृदन्त को सुरक्षित रखता है और बिना आवश्यकता स्वतंत्र भविष्यकालीन क्रिया नहीं जोड़ता; हिन्दी में यह पहले के ‘होगा’ से अर्थगत रूप से जुड़ता है।
- issue: विश्वास करने वाले का राज्य करना
  choice: ‘वह मनुष्यों के बीच सच्चाई से राज्य करेगा’
  alternative: इसे आध्यात्मिक प्रभाव, नैतिक नेतृत्व या किसी विशिष्ट अंतकालीन शासन के रूप में स्पष्ट करना।
  rationale: मूल केवल राज्य करने की बात कहता है; उसके स्वरूप को किसी संप्रदायगत या निजी व्याख्या से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए बोधगम्य। वाक्य की कुछ कृदन्तीय असामान्यता जानबूझकर रखी गई है ताकि यूनानी संरचना और ‘प्रभु’/‘इस्राएल का पवित्र जन’ के बीच वास्तविक अस्पष्टता बनी रहे।
