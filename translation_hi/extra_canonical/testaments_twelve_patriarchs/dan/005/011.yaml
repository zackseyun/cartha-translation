source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὴν αἰχμαλωσίαν λήψεται⁸⁹ ἀπὸ τοῦ Βελίαρ, [τὰς ψυχὰς τῶν ἁγίων]⁹⁰, *καὶ ἐπιστρέψει⁹¹ καρδίας⁹² ἀπειθεῖς⁹³ πρὸς Κύριον. καὶ δώσει *τοῖς ἐπικαλουμένοις αὐτὸν⁹⁴ εἰρήνην αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/011.yaml
  text: And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.
translation:
  language: hi
  text: और वह बेलियार के कब्जे से बंदियों को—पवित्र जनों के प्राणों को[a]—छुड़ा लेगा। वह आज्ञा न मानने वाले हृदयों को प्रभु की ओर फेरेगा और उसे पुकारने वालों को सदा की शांति देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ यूनानी पाठ-साक्ष्यों में “पवित्र जनों के प्राणों को” शब्द नहीं हैं।
    reason: स्रोत-संस्करण में यह पदांश कोष्ठकों में है, जो इसकी पाठगत अनिश्चितता दर्शाता है।
lexical_decisions:
- source_word: τὴν αἰχμαλωσίαν λήψεται ἀπὸ τοῦ Βελίαρ
  choice: बेलियार से बंदी बनाए गए लोगों को…छुड़ा लेगा
  rationale: शाब्दिक रूप ‘बेलियार से बंदीगिरी ले लेगा’ हिन्दी में अस्पष्ट और अस्वाभाविक होता। प्रसंग में बेलियार के अधिकार से बंदियों को निकालने का भाव है; ‘छुड़ा लेगा’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰς ψυχὰς τῶν ἁγίων
  choice: पवित्र जनों के प्राणों को
  rationale: ψυχαί के लिए ‘प्राण’ चुना गया है, ताकि इसे स्वतः किसी विशिष्ट दार्शनिक अर्थ वाले ‘आत्माओं’ तक सीमित न किया जाए; ‘पवित्र जन’ οἱ ἅγιοι का सहज और गरिमापूर्ण रूप है।
- source_word: καρδίας ἀπειθεῖς
  choice: आज्ञा न मानने वाले हृदयों को
  rationale: ἀπειθής में अविश्वास और अवज्ञा दोनों की छाया हो सकती है। ‘आज्ञा न मानने वाले’ यहाँ उसके अवज्ञात्मक पहलू को स्पष्ट रखते हुए ‘हृदयों’ की मूल रूपक-भाषा बचाता है।
- source_word: ἐπικαλουμένοις αὐτόν
  choice: उसे पुकारने वालों को
  rationale: ἐπικαλέομαι का धार्मिक संदर्भ में अर्थ सहायता या उपासना के लिए पुकारना है। सर्वनाम ‘उसे’ रखने से यूनानी पाठ में αὐτόν के संभावित पूर्वपद की अस्पष्टता अनावश्यक रूप से हल नहीं की गई।
- source_word: εἰρήνην αἰώνιον
  choice: सदा की शांति
  rationale: यह सरल आधुनिक हिन्दी में शाश्वत और निरंतर शांति का भाव व्यक्त करता है।
theological_decisions:
- issue: αὐτόν (‘उसे’) का संदर्भ
  choice: सर्वनाम ‘उसे’ बनाए रखा गया
  alternative: ‘प्रभु को पुकारने वालों’ या ‘उस उद्धारकर्ता को पुकारने वालों’
  rationale: निकटतम संज्ञा ‘प्रभु’ है, पर वाक्य का कर्ता भी संभावित संदर्भ है। मूल पाठ की इस संदर्भगत अस्पष्टता को अनुवाद में सुरक्षित रखा गया।
- issue: बेलियार की बंदीगिरी से मुक्ति
  choice: लोगों को बेलियार से छुड़ाने के रूप में व्यक्त किया
  alternative: ‘बेलियार से बंदीगिरी ले लेगा’
  rationale: यहाँ किसी विशेष प्रायश्चित्त-सिद्धांत या दुष्टात्मा-विज्ञान को नहीं जोड़ा गया; केवल यूनानी वाक्यांश में निहित मुक्ति का स्वाभाविक हिन्दी अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप अपनाया गया है। ‘बेलियार’ को प्राचीन व्यक्तिनाम के रूप में लिप्यंतरित किया गया है। मूल के समन्वयी वाक्य-विन्यास को पठनीयता के लिए दो वाक्यों में बाँटा गया है।
