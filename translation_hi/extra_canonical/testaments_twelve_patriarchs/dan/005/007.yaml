source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *οἱ ἐμοὶ υἱοὶ⁶¹ συνεγγίζοντές⁶² εἰσι τοῦ⁶³ Λευὶ καὶ συναμαρτάνοντες⁶⁴ αὐτοῖς⁶⁵ ἐν πᾶσιν. *οἱ δὲ υἱοὶ τοῦ⁶⁶ Ἰούδα ἔσονται ἐν πλεονεξίᾳ ἁρπάζοντες⁶⁷ ἀλλότρια ὡς⁶⁸ λέοντες.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/007.yaml
  text: And my sons are drawing near to Levi and sinning together with them in all things. But the sons of Judah will be in greed, snatching what belongs to others like lions.
translation:
  language: hi
  text: और मेरे पुत्र लेवी के निकट जा रहे हैं और सब बातों में उनके साथ पाप कर रहे हैं। परन्तु यहूदा के पुत्र लोभ में पड़कर सिंहों के समान दूसरों की वस्तुएँ छीनेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεγγίζοντες
  choice: निकट जा रहे हैं
  rationale: वर्तमान कृदन्त की प्रगतिशील क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; संदर्भ में लेवी से निकटता या उसके पक्ष में आने का भाव खुला रहता है।
- source_word: συναμαρτάνοντες αὐτοῖς
  choice: उनके साथ पाप कर रहे हैं
  rationale: συν- के सहभागितापूर्ण अर्थ और वर्तमान कृदन्त—दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐν πλεονεξίᾳ
  choice: लोभ में पड़कर
  rationale: शाब्दिक ‘लोभ में’ के भाव को स्वाभाविक हिन्दी क्रियाविशेषणीय संरचना में व्यक्त करता है, बिना इसे केवल स्वभावसूचक ‘लोभी’ बनाने के।
- source_word: ἁρπάζοντες ἀλλότρια
  choice: दूसरों की वस्तुएँ छीनेंगे
  rationale: ἀλλότρια का अर्थ ‘जो दूसरों का है’ और ἁρπάζω का बलपूर्वक हथियाने/छीनने का भाव सुरक्षित रखता है।
- source_word: ὡς λέοντες
  choice: सिंहों के समान
  rationale: मूल उपमा को औपचारिक किन्तु सुबोध हिन्दी में यथावत रखता है।
theological_decisions:
- issue: लेवी के निकट जाने और उसके साथ पाप करने का संबंध
  choice: ‘लेवी के निकट जा रहे हैं’ और ‘उनके साथ पाप कर रहे हैं’ को अलग किंतु समांतर क्रियाओं के रूप में रखा गया
  alternative: ‘लेवी का साथ देकर उनके साथ पाप कर रहे हैं’
  rationale: मूल में दो वर्तमान कृदन्त हैं; अनुवाद उनके बीच कारणात्मक या व्याख्यात्मक संबंध आरोपित नहीं करता।
- issue: पहली और दूसरी वाक्य-इकाइयों का काल
  choice: पहली में वर्तमान प्रगतिशील और दूसरी में भविष्यकाल
  alternative: दोनों को भविष्यकाल में रखना
  rationale: εἰσι के साथ वर्तमान कृदन्त वर्तमान गतिविधि बताते हैं, जबकि ἔσονται दूसरी इकाई को भविष्य में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘परन्तु’ तथा ‘सिंहों के समान’ पाठ की वसीयतनुमा, साहित्यिक शैली बनाए रखते हैं।
