revisions:
- from: '**दान का वसीयतनामा 2**


    और अब, मेरे बच्चो, देखो, मैं मरने पर हूँ, और मैं तुमसे सच कहता हूँ: यदि तुम अपने को झूठ और क्रोध की आत्मा[a] से न बचाओ, और सत्य तथा सहनशील धीरज[b] से प्रेम न करो, तो तुम नष्ट हो जाओगे।


    क्योंकि क्रोध अंधापन है; वह मनुष्य को किसी का चेहरा सच्चाई से देखने नहीं देता। चाहे वह पिता हो या माता, क्रोधी मनुष्य उनके साथ शत्रुओं जैसा व्यवहार करता है; चाहे वह भाई हो, वह उसे नहीं पहचानता; चाहे वह प्रभु का नबी हो, वह उसकी आज्ञा नहीं मानता; चाहे वह धर्मी हो, वह उसका आदर नहीं करता; और चाहे वह मित्र हो, वह उसे स्वीकार नहीं करता। क्योंकि क्रोध की आत्मा उसे छल के जालों से घेर लेती है, उसकी आँखें अंधी कर देती है, झूठ के द्वारा उसके मन को अंधकारमय कर देती है और उसे अपनी ही विकृत दृष्टि देती है। और वह उसकी आँखों को किससे घेरती है? हृदय की घृणा से, ताकि वह अपने भाई से ईर्ष्या करे।


    मेरे बच्चो, क्रोध बुरी वस्तु है, क्योंकि वह स्वयं प्राण को भी व्याकुल कर देता है। वह क्रोधी मनुष्य के शरीर को अपना बना लेता है, उसके प्राण पर अधिकार कर लेता है और शरीर को शक्ति देता है, ताकि वह हर प्रकार का अधर्म करे। और जब शरीर ये सब काम करता है, तो प्राण किए हुए काम को उचित ठहराता है, क्योंकि वह ठीक से देख नहीं पाता।


    इसलिए यदि क्रोधी मनुष्य सामर्थी हो, तो उसके क्रोध की शक्ति तिगुनी होती है: पहली, उसके सेवकों से मिलनेवाली सहायता; दूसरी, उसका धन, जिसके द्वारा वह लोगों को मनाकर अन्याय से उन पर प्रबल होता है; और तीसरी, उसकी अपनी स्वाभाविक शक्ति, जिसके द्वारा वह बुराई करता है। और यदि क्रोधी मनुष्य निर्धन हो, तब भी उसके क्रोध की शक्ति दुगुनी होती है, क्योंकि यह आत्मा उसे सदा बुराई करने में सहायता देती है। यह आत्मा शैतान के दाहिने हाथ झूठ के साथ सदा चलती है, ताकि उसके काम क्रूरता और झूठ के द्वारा पूरे हों।


    इसलिए क्रोध की शक्ति को समझो—वह खोखली है। पहले वह किसी बात से उकसाती है; फिर कामों के द्वारा क्रोधी मनुष्य को बल देती है; और भारी हानियों से उसके मन को व्याकुल करके उसके प्राण में प्रचंड क्रोध भड़का देती है। इसलिए जब कोई तुम्हारे विरुद्ध कुछ कहे, तो क्रोध में मत आना। और यदि कोई पवित्र जन कहकर तुम्हारी प्रशंसा करे, तो अपने को ऊँचा मत समझना—न प्रसन्नता में, न वितृष्णा में। क्योंकि पहले वह बात सुनने में अच्छी लगती है; फिर मन उकसावे के कारण खोजने लगता है; और अंत में मनुष्य क्रोधित होकर सोचता है कि उसका क्रोध उचित है।


    मेरे बच्चो, यदि तुम्हें किसी प्रकार की हानि या बरबादी उठानी पड़े, तो व्याकुल मत होना; क्योंकि यही आत्मा मनुष्य में नाशवान वस्तुओं की लालसा जगाती है, ताकि उनकी हानि से दुखी होकर वह क्रोधित हो जाए। और हानि तुम्हारी इच्छा से हुई हो या अनिच्छा से, झुँझलाओ मत, क्योंकि झुँझलाहट से झूठा क्रोध जन्म लेता है। इसके अतिरिक्त, झूठ के साथ मिला क्रोध दुगुनी बुराई है; दोनों हृदय को नष्ट करने में एक-दूसरे की सहायता करते हैं। और जब प्राण लगातार व्याकुल रहता है, तो प्रभु उससे दूर चला जाता है और बेलियार[c] उस पर शासन करता है।'
