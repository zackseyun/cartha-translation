  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother. Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains
    mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing. This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath. Therefore, when anyone speaks against you, do
    not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry. If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.'
translation:
  language: hi
  text: '**दान का वसीयतनामा 2**


    और अब, मेरे बच्चो, देखो, मैं मर रहा हूँ; और मैं तुमसे सच कहता हूँ: यदि तुम अपने आपको झूठ और क्रोध की आत्मा[a] से न बचाओ और सत्य तथा धैर्य[b] से प्रेम न करो, तो तुम नष्ट हो जाओगे।


    क्योंकि क्रोध अंधापन है; वह किसी मनुष्य का चेहरा सच्चाई से देखने नहीं देता। चाहे वह पिता हो या माता, क्रोधी मनुष्य उनके साथ शत्रुओं जैसा व्यवहार करता है; चाहे वह भाई हो, वह उसे नहीं पहचानता; चाहे वह प्रभु का नबी हो, वह उसकी आज्ञा नहीं मानता; चाहे वह धर्मी हो, वह उसका आदर नहीं करता; और चाहे वह मित्र हो, वह उसे स्वीकार नहीं करता। क्योंकि क्रोध की आत्मा उसे छल के जालों से घेर लेती है, उसकी आँखों को अंधा कर देती है, झूठ के द्वारा उसके मन को अंधकारमय कर देती है और उसे अपनी ही विशेष दृष्टि देती है। और वह उसकी आँखों को किससे घेरती है? हृदय की घृणा से, ताकि वह अपने भाई से ईर्ष्या करे।


    मेरे बच्चो, क्रोध बुरी बात है, क्योंकि वह स्वयं प्राण को भी व्याकुल कर देता है। वह क्रोधी मनुष्य के शरीर को अपने वश में कर लेता है, उसके प्राण पर अधिकार कर लेता है और शरीर को शक्ति देता है, ताकि वह हर प्रकार का अधर्म करे। और जब शरीर ये सब काम करता है, तो प्राण किए हुए काम को उचित ठहराता है, क्योंकि वह ठीक से देख नहीं पाता।


    इसलिए, यदि क्रोधी मनुष्य सामर्थी हो, तो उसके क्रोध की शक्ति तिगुनी होती है: पहली, उसके सेवकों से मिलनेवाली सहायता; दूसरी, उसका धन, जिसके द्वारा वह लोगों को मनाकर और अन्याय से उन पर प्रबल होता है; और तीसरी, उसकी अपनी स्वाभाविक शक्ति, जिसके द्वारा वह बुराई करता है। और यदि क्रोधी मनुष्य निर्धन हो, तो उसके क्रोध की शक्ति दुगुनी होती है, क्योंकि यह आत्मा उसे सदा बुराई करने में सहायता देती है। यह आत्मा शैतान के दाहिने हाथ पर झूठ के साथ सदा रहती है, ताकि उसके काम क्रूरता और झूठ के द्वारा पूरे हों।


    इसलिए क्रोध की शक्ति को समझो—वह व्यर्थ है। पहले वह वचन से उकसावा देती है; फिर कर्मों के द्वारा क्रोधी मनुष्य को बल देती है; और भारी हानियों से उसके मन को व्याकुल करती है, और इस प्रकार उसके प्राण में प्रचंड क्रोध भड़का देती है। इसलिए, जब कोई तुम्हारे विरुद्ध कुछ कहे, तो क्रोध में मत आना। और यदि कोई तुम्हें पवित्र जन कहकर तुम्हारी प्रशंसा करे, तो अपने को ऊँचा मत समझना—न प्रसन्न होकर, न अप्रसन्न होकर। क्योंकि पहले वह बात सुनने में अच्छी लगती है; फिर मन उकसावे के कारणों को समझने के लिए उत्तेजित होता है; और तब मनुष्य क्रोधित होकर सोचता है कि उसका क्रोध उचित है।


    मेरे बच्चो, यदि तुम्हें किसी प्रकार की हानि या बरबादी उठानी पड़े, तो व्याकुल मत होना; क्योंकि यही आत्मा मनुष्य में नाशवान वस्तुओं की लालसा जगाती है, ताकि उनकी हानि के दुःख से वह क्रोधित हो जाए। और हानि तुम्हारी इच्छा से हुई हो या अनिच्छा से, झुँझलाओ मत, क्योंकि झुँझलाहट से झूठा क्रोध जन्म लेता है। इसके अतिरिक्त, झूठ के साथ मिला क्रोध दुगुनी बुराई है; दोनों हृदय को नष्ट करने में एक-दूसरे की सहायता करते हैं। और जब प्राण लगातार व्याकुल रहता है, तो प्रभु उससे दूर चला जाता है और बेलियार[c] उस पर शासन करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘झूठ की आत्मा’ का अर्थ ‘छल की आत्मा’ भी हो सकता है। यूनानी शब्द बोली गई असत्य बात और अधिक व्यापक छलपूर्ण गुण—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘धैर्य’ का अनुवाद ‘सहनशीलता’ या ‘दीर्घसहिष्णुता’ भी हो सकता है; यूनानी पद उकसावे और कष्ट के बीच स्थिर बने रहने का नैतिक भाव रखता है।
    reason: lexical_alternative
  - marker: c
    text: बेलियार, यहूदी और आरंभिक मसीही साहित्य में मिलनेवाला ‘बेलियाल’ नाम का एक पारंपरिक रूप है।
    reason: cultural_note
lexical_decisions:
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ शब्द केवल मनोदशा नहीं, बल्कि सक्रिय नैतिक-आध्यात्मिक शक्ति के रूप में व्यक्त किया गया है; आगे शैतान और बेलियार से उसका संबंध भी इसी अर्थ को पुष्ट करता है।
- source_word: ψεῦδος
  choice: झूठ
  rationale: आधुनिक हिन्दी में यह सरल और व्यापक शब्द है, जो असत्य कथन और छलपूर्ण नैतिक गुण दोनों को व्यक्त कर सकता है; व्यापक वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: θυμός
  choice: क्रोध
  rationale: यह सामान्य, स्पष्ट और गरिमापूर्ण हिन्दी शब्द है, जो अध्याय के केंद्रीय दुर्गुण को लगातार व्यक्त करता है।
- source_word: ἀλήθεια
  choice: सत्य / सच्चाई
  rationale: आरंभिक नैतिक विरोध में ‘सत्य’ रखा गया है; देखने के संबंधपरक वाक्य में स्वाभाविक हिन्दी के लिए ‘सच्चाई’ प्रयुक्त है, बिना मूल अर्थ बदले।
- source_word: μακροθυμία
  choice: सहनशील धीरज
  rationale: केवल ‘धैर्य’ की अपेक्षा यह उकसावे और कष्ट के बीच दीर्घकालीन सहनशीलता का नैतिक भार अधिक स्पष्ट करता है।
- source_word: δίκτυα
  choice: जाल
  rationale: छल द्वारा घेरने और फँसाने की ठोस उपमा को सुरक्षित रखता है।
- source_word: ἴδιον ὅρασιν
  choice: अपनी ही विकृत दृष्टि
  rationale: दृष्टि की मूल उपमा बचाते हुए यह स्पष्ट करता है कि क्रोध मनुष्य पर अपना भ्रामक ढंग से देखना थोपता है।
- source_word: φθονεῖν
  choice: ईर्ष्या करना
  rationale: भाई के प्रति उत्पन्न होनेवाले दुर्गुण का सहज और सीधा हिन्दी रूप।
- source_word: ἀνομία
  choice: अधर्म
  rationale: यह दैवी नैतिक व्यवस्था के विरुद्ध कर्म का अर्थ देता है और ‘बुराई’ से अधिक नैतिक-विधिक भार बनाए रखता है।
- source_word: κρατεῖ
  choice: अधिकार कर लेना
  rationale: प्राण पर हावी होकर उसे नियंत्रित करने की बढ़ती हुई शक्ति को व्यक्त करता है।
- source_word: κενόν
  choice: खोखली
  rationale: क्रोध की दिखावटी शक्ति की निष्फलता और भ्रामकता दोनों को सहज हिन्दी में प्रकट करता है।
- source_word: παροξυσμός / παροξύνειν
  choice: उकसावा / उकसाना
  rationale: वाणी से आरंभ होकर क्रोध भड़कने तक की प्रक्रिया के लिए स्वाभाविक आधुनिक हिन्दी।
theological_decisions:
- issue: झूठ और क्रोध की नैतिक-आध्यात्मिक सक्रियता
  choice: ‘आत्मा’ की भाषा को बनाए रखा गया है।
  alternative: इसे केवल ‘प्रवृत्ति’, ‘मनोभाव’ या ‘स्वभाव’ कहना।
  rationale: पाठ इन दुर्गुणों को सक्रिय और शासन करनेवाली शक्तियों की तरह चित्रित करता तथा उन्हें शैतान और बेलियार से जोड़ता है; केवल मनोवैज्ञानिक भाषा इस तनाव को समतल कर देती।
- issue: प्रभु का प्राण से दूर चले जाना
  choice: 'कथन को सीधे रूप में रखा गया है: ‘प्रभु उससे दूर चला जाता है।’'
  alternative: इसे शांति, विवेक या नैतिक स्पष्टता खोने का रूपक बनाकर कहना।
  rationale: पाठ की कठोर धर्मवैज्ञानिक चेतावनी को मनोवैज्ञानिक भावार्थ में नरम नहीं किया गया।
- issue: शैतान और बेलियार का उल्लेख
  choice: दोनों नाम अलग-अलग बनाए रखे गए हैं।
  alternative: बेलियार को शैतान का पर्याय या उपाधि बनाकर दोनों को मिला देना।
  rationale: प्राप्त पाठ दोनों का भिन्न रूप से उल्लेख करता है; अनुवाद उस भिन्नता को बिना व्यवस्थित किए सुरक्षित रखता है।
- issue: प्राण और शरीर का संबंध
  choice: ψυχή के लिए ‘प्राण’ और σῶμα के लिए ‘शरीर’ रखकर पाठ की द्वंद्वात्मक नैतिक भाषा सुरक्षित रखी गई है।
  alternative: ψυχή को हर स्थान पर ‘मन’ कहना।
  rationale: ‘मन’ कहने से पाठ में प्राण पर अधिकार और प्रभु के उससे दूर होने की व्यापक आध्यात्मिक धारणा संकुचित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण उपदेशात्मक शैली रखी गई है। संबोधन ‘मेरे बच्चो’ सामान्य पाठक के लिए स्वाभाविक है। लंबे यूनानी/परामर्शात्मक वाक्यों को अर्थ-संबंध सुरक्षित रखते हुए छोटे हिन्दी वाक्यों में बाँटा गया है। उपलब्ध यूनानी अंश को प्राथमिक आधार बनाया गया; शेष अध्याय के लिए दिए गए परीक्षित अंग्रेज़ी परामर्श-पाठ की संरचना और शब्दावली का सावधानी से अनुसरण किया गया, और जहाँ वाक्य अर्थगत तनाव रखते हैं वहाँ उन्हें अत्यधिक स्पष्ट करके समतल नहीं किया गया।
