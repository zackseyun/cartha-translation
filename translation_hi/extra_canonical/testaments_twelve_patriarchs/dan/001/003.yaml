id: T12P.DAN.1.3
reference: Testament of Dan 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ¹⁸ ἐπείρασα ἐν καρδίᾳ μου¹⁹ καὶ²⁰ ἐν πάσῃ²¹ ζωῇ μου²², ὅτι καλὸν²³ *καὶ θεῷ εὐάρεστον ἡ ἀλήθεια²⁴ μετὰ δικαιοπραγίας²⁵ *καὶ ⸀ὅτι⸁ πονηρὸν τὸ ψεῦδος²⁶ καὶ ὁ θυμὸς²⁷ πᾶσαν κακίαν *ἐκδιδάσκοντα τὸν ἄνθρωπον²⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/003.yaml
  text: I have tested in my heart and in all my life that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.
translation:
  language: hi
  text: मैंने अपने हृदय में और अपने सारे जीवन में यह परख लिया है कि सत्य, न्यायपूर्ण आचरण के साथ, अच्छा और परमेश्वर को प्रिय है, और यह कि झूठ और क्रोध बुरे हैं और मनुष्य को हर प्रकार की बुराई सिखाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείρασα
  choice: परखकर जाना है
  rationale: क्रिया का अर्थ अनुभव द्वारा जाँचना या सिद्ध पाना है; यह अनुवाद प्रयोग और उससे प्राप्त निष्कर्ष दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν καρδίᾳ μου
  choice: अपने हृदय में
  rationale: ‘हृदय’ यहाँ भीतरी नैतिक-विचारशील जीवन को दर्शाता है; स्रोत की उपमा को बनाए रखा गया है।
- source_word: ἐν πάσῃ ζωῇ μου
  choice: अपने पूरे जीवन में
  rationale: यूनानी वाक्यांश के जीवन-भर के अनुभव संबंधी व्यापक बल को सीधे व्यक्त करता है।
- source_word: ἡ ἀλήθεια
  choice: सच्चाई
  rationale: संदर्भ में सत्य बोलने और सत्यनिष्ठा के नैतिक गुण का सहज आधुनिक हिन्दी रूप।
- source_word: μετὰ δικαιοπραγίας
  choice: धर्ममय आचरण के साथ
  rationale: δικαιοπραγία का आशय सही या न्यायपूर्ण कर्म करना है; ‘धर्ममय आचरण’ नैतिक अर्थ को संप्रदायगत विशिष्टता के बिना व्यक्त करता है।
- source_word: θεῷ εὐάρεστον
  choice: परमेश्वर को भानेवाली
  rationale: ईश्वर की प्रसन्नता या स्वीकृति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: τὸ ψεῦδος
  choice: झूठ
  rationale: असत्य या मिथ्याभाषण के नैतिक दोष के लिए सामान्य और स्पष्ट शब्द।
- source_word: ὁ θυμός
  choice: क्रोध
  rationale: यहाँ θυμός तीव्र रोष को सूचित करता है; ‘क्रोध’ उपयुक्त मानक हिन्दी है।
- source_word: πᾶσαν κακίαν
  choice: हर प्रकार की बुराई
  rationale: शाब्दिक ‘हर बुराई’ की तुलना में यह हिन्दी में स्वाभाविक रहते हुए πᾶσαν की व्यापकता बनाए रखता है।
- source_word: ἐκδιδάσκοντα τὸν ἄνθρωπον
  choice: मनुष्य को ... सिखाते हैं
  rationale: बहुवचन कर्ताओं ‘झूठ और क्रोध’ से आशयगत सामंजस्य रखते हुए कारणकारी नैतिक प्रभाव को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: सच्चाई और धर्ममय आचरण का संबंध
  choice: ‘सच्चाई, धर्ममय आचरण के साथ’
  alternative: ‘धर्ममय आचरण सहित सत्य’
  rationale: μετά के साहचर्य को बनाए रखा गया है; वाक्य यह नहीं कहता कि दोनों एक ही वस्तु हैं या धर्ममय आचरण से उद्धार मिलता है।
- issue: झूठ और क्रोध द्वारा बुराई सिखाने का कर्तृत्व
  choice: दोनों को संयुक्त बहुवचन कर्ता मानकर ‘सिखाते हैं’
  alternative: केवल निकटतम संज्ञा ‘क्रोध’ को कर्ता मानकर ‘सिखाता है’
  rationale: यूनानी participle का रूप पाठ-संचरण या व्याकरणिक असंगति दिखा सकता है, पर वाक्य का सबसे स्वाभाविक आशय झूठ और क्रोध दोनों को बुराई की शिक्षा देनेवाला बताता है; किसी अतिरिक्त सिद्धान्त को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। स्रोत की नैतिक शब्दावली और समानांतर वाक्यरचना को रखते हुए अत्यधिक शाब्दिक, अस्वाभाविक हिन्दी से बचा गया है।
