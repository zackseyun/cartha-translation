revisions:
- from: मैंने अपने हृदय में और अपने पूरे जीवन में यह परखकर जाना है कि सच्चाई, धर्ममय आचरण के साथ, अच्छी और परमेश्वर को भानेवाली है, और यह कि झूठ और क्रोध बुरे हैं और मनुष्य को हर प्रकार की बुराई सिखाते हैं।
  to: मैंने अपने हृदय में और अपने सारे जीवन में यह परख लिया है कि सत्य, न्यायपूर्ण आचरण के साथ, अच्छा और परमेश्वर को प्रिय है, और यह कि झूठ और क्रोध बुरे हैं और मनुष्य को हर प्रकार की बुराई सिखाते हैं।
  rationale: 'The revision makes one semantic clarification and minor idiomatic refinements. It renders δικαιοπραγία as ‘न्यायपूर्ण आचरण,’ avoiding the potentially narrower religious coloring of ‘धर्ममय,’ and keeps the source’s ethical parallelism and the English audit trail’s plural reading of ‘falsehood and anger.’ No footnotes are needed: the source’s superscript apparatus markers do not supply a translation note that must be reproduced here.'
