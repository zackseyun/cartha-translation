source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ᾿Αλλ᾿ ὁ Θεὸς *τῶν πατέρων⁵³ μου οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου, ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ, καὶ ποιήσω⁶¹ λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/009.yaml
  text: But the God of my fathers did not allow him to fall into my hands, so that I might find him alone and kill him, and bring about the loosing of a second tribe from Israel.”
translation:
  language: hi
  text: परन्तु मेरे पूर्वजों के परमेश्वर ने उसे मेरे हाथों में पड़ने नहीं दिया, ताकि मैं उसे अकेला पाकर मार डालूँ और इस्राएल के लिए एक दूसरा राजदंड विघटित करवा दूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और इस्राएल के लिए एक दूसरा राजदंड विघटित करवा दूँ।” “राजदंड” यहाँ किसी शासन, वंश या गोत्र का रूपक हो सकता है। यूनानी क्रिया का अर्थ ढीला करना, खोलना या विघटित करना है; अतः इसका सटीक आशय अनिश्चित है।
    reason: σκῆπτρον के रूपकात्मक आशय और λυθῆναι के अर्थ-क्षेत्र को बिना किसी विशेष गोत्र की पहचान या विनाश के निश्चित अर्थ को थोपे सुरक्षित रखता है।
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: मेरे पूर्वजों के परमेश्वर
  rationale: यह वाक्यांश वंशगत विश्वास और पितरों के परमेश्वर की धारणा व्यक्त करता है; आधुनिक हिन्दी में ‘पूर्वजों’ सहज और स्पष्ट है।
- source_word: ἐμπεσεῖν εἰς τὰς χεῖράς μου
  choice: मेरे हाथों में पड़ने
  rationale: यूनानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप, जिसमें किसी के वश में आ जाने का भाव बना रहता है।
- source_word: ἀνελῶ
  choice: मार डालूँ
  rationale: यहाँ क्रिया का प्रसंगानुकूल अर्थ हत्या कर देना है।
- source_word: σκῆπτρον δεύτερον
  choice: एक दूसरा गोत्र
  rationale: σκῆπτρον का मूल अर्थ ‘राजदंड’ है, पर वंश या गोत्र के प्रतीक के रूप में यह यहाँ ‘गोत्र’ को सूचित करता है; प्रसंग इस्राएल के वंशों से संबंधित है।
- source_word: λυθῆναι
  choice: मिटा दूँ
  rationale: क्रिया का मूल भाव खोलने, विघटित करने या नष्ट होने का है; गोत्र के संदर्भ में ‘मिटा दूँ’ स्वाभाविक है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: इस्राएल के ‘दूसरे गोत्र’ के नष्ट होने का संकेत
  choice: गोत्र की पहचान स्पष्ट किए बिना पाठ की अनिश्चितता बनाए रखी गई
  alternative: इसे स्पष्ट रूप से बिन्यामीन या किसी अन्य गोत्र के रूप में पहचानना
  rationale: यूनानी पाठ गोत्र का नाम नहीं बताता; किसी विशिष्ट पहचान को जोड़ना व्याख्यात्मक अतिक्रमण होगा।
- issue: परमेश्वर द्वारा हत्या रोके जाने का उद्देश्यसूचक वाक्य
  choice: ‘पड़ने नहीं दिया, कि मैं...’
  alternative: इसे परिणाम या केवल संभाव्यता के रूप में ढीला करना
  rationale: ἵνα नकारात्मक मुख्य क्रिया के बाद रोके गए उद्देश्य/परिणाम को व्यक्त करता है; हिन्दी में यह संरचना उस तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘पूर्वजों,’ ‘मार डालूँ’ और ‘गोत्र’ सामान्य पाठक के लिए स्पष्ट हैं; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
