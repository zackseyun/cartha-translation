base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/008.yaml
  text: This was the spirit of anger persuading me, that just as a leopard sucks out a young goat, so it put into me to suck out Joseph.
translation:
  language: hi
  text: 'यह क्रोध की आत्मा थी जो मुझे उकसा रही थी: जैसे तेंदुआ बकरी के बच्चे को चूसती है, वैसे ही उसने मेरे भीतर यूसुफ को चूस लेने का विचार डाला।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τοῦ θυμοῦ
  choice: क्रोध की आत्मा
  rationale: मूल के आत्मिक व्यक्तित्व और क्रोध से उसके संबंध को सीधे बनाए रखता है।
- source_word: τὸ πεῖθόν με
  choice: जो मुझे उकसा रही थी
  rationale: πείθω का मूल अर्थ मनाना/प्रेरित करना है; इस हिंसक संदर्भ में स्वाभाविक हिन्दी के लिए ‘उकसा रही थी’ उपयुक्त है।
- source_word: πάρδαλις
  choice: तेंदुआ
  rationale: ग्रीक पशु-संज्ञा का सामान्य और सटीक आधुनिक हिन्दी पर्याय।
- source_word: ἔριφον
  choice: बकरी का बच्चा
  rationale: ‘छौना’ की अपेक्षा अधिक सर्वबोध्य और स्रोत के अनुसार विशिष्ट।
- source_word: ἐκμύζουσα / ἐκμυζῆσαι
  choice: रस चूस लेता है / रस चूस लेने
  rationale: दोनों स्थानों पर चूसने की विचित्र किंतु जानबूझकर प्रयुक्त समानांतर छवि सुरक्षित रखी गई है; इसे ‘नष्ट करना’ कहकर नरम या व्याख्यायित नहीं किया गया।
- source_word: ἐμοὶ ἐνέβαλεν
  choice: उसने मेरे मन में … बात डाल दी
  rationale: शाब्दिक ‘मुझमें डाल दिया’ को स्वाभाविक हिन्दी में व्यक्त करते हुए बाहरी प्रेरक शक्ति का भाव बनाए रखता है।
- source_word: τὸν Ἰωσήφ
  choice: यूसुफ
  rationale: व्यक्ति के लिए प्रचलित हिन्दी बाइबलीय नाम-रूप।
theological_decisions:
- issue: ‘क्रोध की आत्मा’ को मनोभाव या आत्मिक सत्ता के रूप में समझना
  choice: क्रोध की आत्मा
  alternative: क्रोध का भाव
  rationale: मूल πνεῦμα की संभावित व्यक्तिकृत अथवा आत्मिक शक्ति को खुला रखा गया है; उसे केवल मनोवैज्ञानिक भावना तक सीमित नहीं किया गया।
- issue: क्रिया का कर्ता
  choice: उसने मेरे मन में … बात डाल दी
  alternative: मेरे मन में … बात आ गई
  rationale: मूल के एकवचन कर्ता को बनाए रखा गया है, जिसका निकटतम संदर्भ ‘क्रोध की आत्मा’ है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की कठोर तथा असामान्य ‘रस चूसने’ वाली छवि और दोनों उपवाक्यों का समानांतर जानबूझकर सुरक्षित रखा गया है।
