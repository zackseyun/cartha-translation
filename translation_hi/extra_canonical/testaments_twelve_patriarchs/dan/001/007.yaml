id: T12P.DAN.1.7
reference: Testament of Dan 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἐκ τῶν πνευμάτων⁴³ τοῦ Βελίαρ †συνήργει⁴⁴ μοι, ὅτι⁴⁵· *Λαβὲ τὸ ξίφος καὶ ⌜ἐν τούτῳ⌝⁴⁶ ἄνελε τὸν Ἰωσήφ⁴⁷, καὶ ἀγαπήσει σε ὁ πατήρ⁴⁸, ἀποθανόντος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/007.yaml
  text: And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you after he dies.’
translation:
  language: hi
  text: और बेलियार की आत्माओं में से एक मेरे साथ मिलकर काम कर रही थी और कह रही थी, “यह तलवार ले और इसी से यूसुफ को मार डाल; और उसके मर जाने पर तेरा पिता तुझसे प्रेम करेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν πνευμάτων τοῦ Βελίαρ
  choice: बेलियार की आत्माओं में से एक
  rationale: ἐκ के अंशवाचक अर्थ और बहुवचन πνευμάτων को स्पष्ट रूप से बनाए रखा गया है।
- source_word: συνήργει μοι
  choice: मेरे साथ काम कर रही थी
  rationale: अपूर्णकालीन क्रिया निरंतर चल रही दुष्प्रेरक सक्रियता दर्शाती है; μοι के साथ सहकार्य का भाव स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: तलवार को साधन बताने वाले संकेतवाचक पद को संक्षिप्त और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἄνελε
  choice: मार डाल
  rationale: आज्ञार्थक ἀναιρέω का यहाँ स्पष्ट अर्थ हत्या करना है।
- source_word: ἀποθανόντος αὐτοῦ
  choice: उसके मर जाने पर
  rationale: सम्बन्धकारक निरपेक्ष रचना का कालगत भाव सुरक्षित है और αὐτοῦ का स्वाभाविक निकटतम संदर्भ यूसुफ है।
theological_decisions:
- issue: बेलियार और उसकी आत्माओं का चित्रण
  choice: ‘बेलियार की आत्माओं में से एक’ को वास्तविक कथन के रूप में ज्यों का त्यों रखा
  alternative: इसे केवल ‘बुरा विचार’ या ‘दुष्ट प्रभाव’ कहना
  rationale: मूल पाठ व्यक्तिगत/अलौकिक अभिकर्ता की भाषा प्रयोग करता है; उसे मनोवैज्ञानिक रूपक में बदलना पाठ की धर्मवैचारिक भाषा को चुपचाप हल कर देता।
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसके’ से यूसुफ का संकेत
  alternative: पिता की मृत्यु के बाद पिता के प्रेम का असंगत अर्थ
  rationale: 'वाक्य की निकटता और अर्थ-संगति के अनुसार मृत्यु यूसुफ की है: उसे मारने के बाद पिता दान से प्रेम करेगा। सर्वनाम का रूप रखा गया है ताकि मूल की सीमित औपचारिक अस्पष्टता भी बनी रहे।'
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। प्रत्यक्ष भाषण में निकट और तीखी आज्ञा के लिए ‘ले’, ‘मार डाल’ और ‘तेरा’ का प्रयोग किया गया है।
