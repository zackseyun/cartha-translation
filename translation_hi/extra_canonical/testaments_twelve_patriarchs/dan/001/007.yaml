  terminology: ‘बेलियार,’ ‘आत्माओं,’ and ‘यूसुफ’ are appropriate. The direct-speech forms ‘ले,’ ‘मार डाल,’ and ‘तेरा/तुझसे’ suit the hostile, intimate command.
