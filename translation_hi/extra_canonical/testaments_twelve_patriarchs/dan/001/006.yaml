  source_fidelity: Greek τὸ πνεῦμα τοῦ ζήλου καὶ τῆς ἀλαζονείας is accurately rendered as “ईर्ष्या और घमंड की आत्मा.” The imperfect ἔλεγέ is well represented by “बार-बार कहती थी,” and the emphatic Καίγε σὺ αὐτός is preserved in “तू स्वयं भी.” “उसका पुत्र है” faithfully renders υἱὸς αὐτοῦ εἶ.
