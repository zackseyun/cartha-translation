  text: For the spirit of jealousy and arrogance kept saying to me, ‘You yourself also are his son.’
translation:
  language: hi
  text: क्योंकि ईर्ष्या और घमंड की आत्मा मुझसे बार-बार कहती थी, “तू स्वयं भी उसका पुत्र है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ ζήλου καὶ τῆς ἀλαζονείας
  choice: ईर्ष्या और घमंड की आत्मा
  rationale: ζῆλος यहाँ प्रसंगानुसार नकारात्मक ‘ईर्ष्या’ है, और ἀλαζονεία आत्म-महत्त्व जताने वाले ‘घमंड’ को व्यक्त करता है। संबंधवाचक यूनानी रचना को स्वाभाविक हिन्दी में संयुक्त रूप दिया गया है।
- source_word: ἔλεγέ μοι
  choice: मुझसे बार-बार कहती थी
  rationale: अपूर्णकाल चलती या दोहराई जाती क्रिया का संकेत देता है; ‘बार-बार’ इसे सहज हिन्दी में स्पष्ट करता है।
- source_word: Καίγε σὺ αὐτὸς
  choice: तू स्वयं भी
  rationale: καίγε और αὐτός के संयुक्त बलाघात को ‘भी’ तथा ‘स्वयं’ से बनाए रखा गया है।
- source_word: υἱὸς αὐτοῦ εἶ
  choice: उसका पुत्र है
  rationale: मूल का सीधा संबंध और वर्तमानकाल सुरक्षित रखा गया है; ‘पुत्र’ गरिमापूर्ण तथा स्रोत-संगत है।
theological_decisions:
- issue: ‘आत्मा’ का स्वरूप
  choice: ‘ईर्ष्या और घमंड की आत्मा’ को व्यक्तिवाचक ढंग से बोलते हुए रखा गया है।
  alternative: इसे केवल मनोभाव या प्रवृत्ति के रूप में अनूदित करना।
  rationale: πνεῦμα कर्ता है और बोलता है; पाठ यह तय नहीं करता कि यह स्वतंत्र आत्मिक सत्ता है या व्यक्ति के भीतर सक्रिय प्रभाव, इसलिए अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। उद्धरण में ‘तू’ मूल यूनानी एकवचन संबोधन की निकटता और तीखेपन को बनाए रखता है।
