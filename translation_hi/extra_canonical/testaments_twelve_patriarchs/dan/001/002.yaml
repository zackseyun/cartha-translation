  text: क्योंकि उसने अपने कुल-परिवार को बुलाकर कहा, “हे दान के पुत्रों, मेरी बातें सुनो और अपने पिता की बातों पर ध्यान दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν πατρίαν αὐτοῦ
  choice: अपने परिवार को
  rationale: πατριά यहाँ विस्तृत कुल या परिवार को सूचित करता है; आधुनिक हिन्दी में “परिवार” सहज है और प्रसंग में दान के पुत्रों को बुलाने से मेल खाता है।
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: बहुवचन आज्ञार्थ का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: λόγων μου
  choice: मेरी बातें
  rationale: λόγος के बहुवचन को सामान्य संबोधन में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: προσέχετε
  choice: ध्यान दो
  rationale: सुनने और सावधानी से ग्रहण करने के आग्रह को स्पष्ट करता है।
- source_word: ῥήμασι τοῦ πατρὸς ὑμῶν
  choice: अपने पिता के वचनों पर
  rationale: ῥήμασι के लिए “वचनों” से λόγων के साथ हल्का शैलीगत अंतर बना रहता है और पितृसुलभ गंभीरता भी व्यक्त होती है।
