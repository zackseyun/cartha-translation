source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ὁμολογῶ οὖν ὑμῖν σήμερον²⁹, τέκνα μου³⁰, ὅτι ἐν καρδίᾳ μου ἐθέμην³¹ περὶ τοῦ θανάτου³² Ἰωσήφ, ⸀τοῦ ἀδελφοῦ μου⸁³³, *τοῦ ἀγαθοῦ ἀνδρὸς καὶ ἀληθινοῦ³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/004.yaml
  text: So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, मैं आज तुमसे स्वीकार करता हूँ कि मैंने अपने मन में अपने भाई यूसुफ—उस भले और सच्चे मनुष्य—की मृत्यु के विषय में निश्चय कर लिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति संक्षिप्त है; इसका अर्थ ‘उसकी मृत्यु के विषय में निश्चय किया’ अथवा अधिक स्पष्ट रूप में ‘उसकी मृत्यु ठान ली’ हो सकता है।
    reason: मूल भाषा में मौजूद वास्तविक अर्थगत अस्पष्टता को पाठक के सामने रखना।
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: स्वीकार करता हूँ
  rationale: यहाँ वक्ता अपने पूर्व संकल्प को खुलकर मान रहा है; ‘स्वीकार करता हूँ’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐν καρδίᾳ μου ἐθέμην
  choice: मैंने अपने मन में ... निश्चय कर लिया था
  rationale: καρδία आंतरिक मनोभाव और संकल्प को दर्शाता है, जबकि τίθημι का मध्यरूप यहाँ मन में ठानने या निश्चय करने का भाव देता है।
- source_word: περὶ τοῦ θανάτου
  choice: मृत्यु के विषय में
  rationale: περί की संरचना को जानबूझकर खुला रखा गया है, ताकि पाठ सीधे यह न जोड़े कि दान ने यूसुफ को मारने का स्पष्ट निर्णय किया था, यद्यपि प्रसंग में वह अर्थ संभव है।
- source_word: ἀγαθοῦ ... καὶ ἀληθινοῦ
  choice: भले और सच्चे
  rationale: दोनों नैतिक विशेषणों को सरल, गरिमापूर्ण और सामान्य आधुनिक हिन्दी में अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: यूसुफ की मृत्यु के संबंध में दान के संकल्प की प्रकृति
  choice: ‘मृत्यु के विषय में निश्चय कर लिया था’—स्रोत की संक्षिप्त और कुछ हद तक अस्पष्ट अभिव्यक्ति को बनाए रखा गया है।
  alternative: ‘उसे मार डालने का निश्चय कर लिया था’
  rationale: वैकल्पिक पाठ प्रसंगगत आशय को स्पष्ट करता है, पर यूनानी में ‘मार डालना’ क्रिया प्रत्यक्ष रूप से नहीं है; इसलिए मुख्य पाठ में उसे जोड़ना उचित नहीं समझा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आत्मस्वीकृति के गंभीर और गरिमापूर्ण स्वर के साथ रखी गई है। ‘मेरे बच्चो’ संबोधन को सहज बनाया गया है और यूसुफ के वर्णन को डैश के भीतर रखकर यूनानी समानाधिकरण स्पष्ट किया गया है।
