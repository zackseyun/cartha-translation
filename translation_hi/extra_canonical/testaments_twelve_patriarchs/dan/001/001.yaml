  text: Testament of Dan, the seventh son of Jacob and Bilhah. A copy of the words of Dan, which he spoke to his sons in the last days of his life, in the 125th year of his life.
translation:
  language: hi
  text: 'याकूब का, बिल्हा से उत्पन्न, सातवाँ पुत्र दान का वसीयतनामा


    1 दान के उन वचनों की प्रति, जो उसने अपने जीवन के अंतिम दिनों में, अपने जीवन के एक सौ पच्चीसवें वर्ष में, अपने पुत्रों से कहे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयतनामा
  rationale: इस साहित्यिक शीर्षक में किसी पूर्वज के अंतिम उपदेशों और विरासतस्वरूप कथनों का बोध होता है; ‘वसीयतनामा’ आधुनिक हिन्दी में इस विधा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Βάλλας
  choice: बिल्हा
  rationale: यह याकूब की पत्नी/दासी बिल्हा के नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: Ἀντίγραφον λόγων
  choice: वचनों की प्रति
  rationale: Ἀντίγραφον का अर्थ लिखित प्रति या नकल है और λόγων यहाँ दान के कथनों को सूचित करता है।
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: अपने जीवन के अंतिम दिनों में
  rationale: शाब्दिक ‘उसके दिनों के अंत में’ का स्वाभाविक हिन्दी रूप, जो मृत्यु के निकट जीवनकाल को व्यक्त करता है।
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: अपनी आयु के एक सौ पच्चीसवें वर्ष में
  rationale: यूनानी क्रमवाचक अभिव्यक्ति को अर्थतः ठीक और आधुनिक हिन्दी में सहज रखा गया है।
