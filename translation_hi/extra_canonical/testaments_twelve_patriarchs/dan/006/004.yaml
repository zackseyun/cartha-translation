source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Οἶδε γὰρ ὅτι *ἐν ᾗ ἡμέρᾳ¹³ ἐπιστρέψει¹⁴ Ἰσραήλ, συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/004.yaml
  text: For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end.
translation:
  language: hi
  text: क्योंकि वह जानता है कि जिस दिन इस्राएल लौट आएगा, उस दिन शत्रु के राज्य का अन्त हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: लौट आएगा
  rationale: यह क्रिया मुड़ने या वापस लौटने का भाव रखती है। संदर्भ में इसका आध्यात्मिक अर्थ संभव है, पर मूल की व्यापकता बनाए रखने के लिए ‘लौट आएगा’ चुना गया है, न कि अधिक व्याख्यात्मक ‘पश्चाताप करेगा’.
- source_word: συντελεσθήσεται
  choice: अन्त हो जाएगा
  rationale: कर्मवाच्य भविष्यकालीन रूप किसी बात के पूर्ण होने या समाप्त कर दिए जाने को व्यक्त करता है। सहज हिन्दी में ‘अन्त हो जाएगा’ परिणाम को स्पष्ट रखते हुए कर्ता को अनिर्दिष्ट रहने देता है।
- source_word: ἡ βασιλεία τοῦ ἐχθροῦ
  choice: शत्रु का राज्य
  rationale: यह मूल पदबंध का सीधा और स्वाभाविक अनुवाद है; ‘शत्रु’ की पहचान को मूल की तरह अनिर्दिष्ट रखा गया है।
theological_decisions:
- issue: इस्राएल के लौटने का आशय
  choice: लौट आएगा
  alternative: मन फिराएगा / पश्चाताप करेगा
  rationale: ἐπιστρέφω धार्मिक संदर्भ में मन-फिराव का संकेत दे सकता है, लेकिन यहाँ स्पष्ट गंतव्य या व्याख्यात्मक पूरक नहीं है। इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: शत्रु के राज्य का अन्त किसके द्वारा होगा
  choice: अन्त हो जाएगा
  alternative: समाप्त कर दिया जाएगा
  rationale: ग्रीक कर्मवाच्य है और कर्ता व्यक्त नहीं किया गया। हिन्दी में कर्ता जोड़ने के बजाय अनिर्दिष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। कारणसूचक ‘क्योंकि’, कालगत संरचना ‘जिस दिन…उस दिन’, और ‘इस्राएल’ का प्रचलित बाइबिलीय रूप रखा गया है।
