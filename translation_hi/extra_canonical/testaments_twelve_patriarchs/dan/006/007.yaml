base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/007.yaml
  text: And his name will be in every place in Israel and among the nations.
translation:
  language: hi
  text: और उसका नाम इस्राएल में हर जगह और अन्यजातियों के बीच होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ δὲ ὄνομα αὐτοῦ
  choice: और उसका नाम
  rationale: δέ यहाँ कथन को पिछले संदर्भ से जोड़ता है; सरल ‘और’ स्वाभाविक है। ‘उसका नाम’ मूल की अभिव्यक्ति को बनाए रखता है और नाम से जुड़ी प्रतिष्ठा या प्रसिद्धि की संभावित व्यापकता को अनिर्धारित छोड़ता है।
- source_word: ἐν παντὶ τόπῳ Ἰσραήλ
  choice: इस्राएल में हर जगह
  rationale: शाब्दिक अर्थ ‘इस्राएल के हर स्थान में’ है; आधुनिक हिन्दी में ‘इस्राएल में हर जगह’ अधिक स्वाभाविक और समानार्थी है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: अन्यजातियों के बीच
  rationale: ἔθνη इस्राएल से बाहर के राष्ट्रों/लोगों को सूचित करता है। ‘अन्यजातियों’ से इस्राएल और दूसरे जनसमूहों का मूल विरोध सुरक्षित रहता है, जबकि ‘के बीच’ यूनानी ἐν का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘नाम’ का आशय
  choice: ‘उसका नाम’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘उसकी ख्याति’ या ‘उसकी प्रसिद्धि’
  rationale: ὄνομα प्रतिष्ठा या प्रसिद्धि की ओर संकेत कर सकता है, पर मूल पाठ स्पष्ट रूप से केवल ‘नाम’ कहता है। व्याख्यात्मक अर्थ को मुख्य पाठ में थोपना उचित नहीं।
- issue: ἔθνη का अनुवाद
  choice: ‘अन्यजातियाँ’
  alternative: ‘राष्ट्र’ या ‘गैर-इस्राएली लोग’
  rationale: संदर्भ में इस्राएल और ἔθνη के बीच अंतर है। ‘अन्यजातियाँ’ इस पारंपरिक अर्थगत भेद को संक्षेप और स्पष्टता से व्यक्त करता है, बिना किसी विशिष्ट धार्मिक सिद्धांत को जोड़े।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य की संक्षिप्तता तथा मूल यूनानी का स्थान-सूचक समानांतर विन्यास यथासंभव सुरक्षित है।
