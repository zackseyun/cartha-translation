source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἔσται δὲ ἐν καιρῷ τῆς²¹ ἀνομίας²² *τοῦ Ἰσραὴλ²³ (οὐκ ἔσται)²⁴ ἀφιστάμενος²⁵ *ἀπ᾽ αὐτῶν²⁶ *ὁ Κύριος²⁷, καὶ²⁸ *μετελεύσεται ἐπ᾽ ἔθνει ζητοῦντι τὸ θέλημα αὐτοῦ²⁹, ὅτι *οὐδεὶς τῶν ἀγγέλων ἔσται ἴσος αὐτῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/006.yaml
  text: But in the time of Israel’s lawlessness, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[a].
translation:
  language: hi
  text: पर इस्राएल के अधर्म के समय प्रभु उनसे अलग नहीं होगा, बल्कि वह उस जाति की ओर चला जाएगा जो उसकी इच्छा की खोज करती है, क्योंकि स्वर्गदूतों में से कोई भी उसके समान न होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पंक्ति कठिन है: उपलब्ध पाठ कहता है कि प्रभु ‘उनसे अलग नहीं होगा,’ फिर भी वह ‘उस जाति की ओर चला जाएगा जो उसकी इच्छा की खोज करती है।’ अनुवाद इस तनाव को सरल करके मिटाने के बजाय उसे ज्यों का त्यों रखता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνομίας
  choice: अधर्मता
  rationale: यह शब्द व्यवस्था-विरोधी आचरण और नैतिक दुष्टता दोनों को व्यक्त करता है; ‘अधर्मता’ प्रसंग में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ἀφιστάμενος ἀπ᾽ αὐτῶν
  choice: उनसे दूर नहीं होगा
  rationale: पाठ में οὐκ ἔσται के साथ इसका भाव उनसे अलग होने या हट जाने का निषेध है।
- source_word: μετελεύσεται ἐπ᾽ ἔθνει
  choice: उस जाति के पास चला जाएगा
  rationale: μετελεύσεται स्थानांतरण या दूसरी ओर जाने का संकेत देता है; ἔθνος के लिए एकवचन ‘जाति’ रखा गया है।
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: जो उसकी इच्छा खोजती है
  rationale: ζητέω के खोजने/ढूँढ़ने के सक्रिय भाव को बनाए रखा गया है, न कि केवल ‘मानने’ के रूप में समझाया गया।
- source_word: τῶν ἀγγέλων
  choice: स्वर्गदूतों में से
  rationale: संबंधवाचक बहुवचन के विभाजक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रभु का इस्राएल से दूर न होना और दूसरी जाति के पास जाना
  choice: दोनों कथनों को साथ रखकर मूल तनाव बनाए रखा गया।
  alternative: इसे इस प्रकार सहज करना कि प्रभु इस्राएल को छोड़कर दूसरी जाति के पास चला जाएगा।
  rationale: प्रस्तुत यूनानी पाठ में ‘दूर नहीं होगा’ और ‘चला जाएगा’ दोनों हैं; अनुवाद पाठगत कठिनाई को किसी एक धर्मवैज्ञानिक निष्कर्ष से नहीं मिटाता।
- issue: αὐτῷ का संदर्भ
  choice: ‘उसके समान’ रखा गया, जिसका निकटतम संदर्भ प्रभु है।
  alternative: सर्वनाम को स्पष्ट करके ‘प्रभु के समान’ कहना।
  rationale: मूल के सर्वनामात्मक रूप को बनाए रखते हुए हिन्दी में संदर्भ समझने योग्य है और अनावश्यक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘अधर्मता’, ‘जाति’ और ‘स्वर्गदूत’ जैसे परिचित धार्मिक शब्द रखे गए हैं; वाक्य की मूल पाठगत असंगति को पादटिप्पणी सहित सुरक्षित रखा गया है।
