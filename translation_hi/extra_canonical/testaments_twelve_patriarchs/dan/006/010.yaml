source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἀπόστητε οὖν ἀπὸ πάσης ἀδικίας καὶ κολλήθητε⁴⁹ τῇ δικαιοσύνῃ τοῦ⁵⁰ Θεοῦ⁵¹, καὶ ἔσται τὸ γένος ὑμῶν⁵² εἰς σωτηρίαν *ἕως τοῦ αἰῶνος⁵³. 11. *Καὶ θάψατέ με⁵⁴ ἐγγὺς τῶν πατέρων μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/010.yaml
  text: Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever. And bury me near my fathers.
translation:
  language: hi
  text: इसलिए हर प्रकार के अधर्म से दूर हो जाओ और परमेश्वर की धार्मिकता से जुड़े रहो; तब तुम्हारा वंश सदा के लिए उद्धार के लिए होगा। और मुझे मेरे पूर्वजों के पास दफ़ना देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόστητε
  choice: दूर हो जाओ
  rationale: आज्ञार्थक क्रिया का अर्थ अलग हो जाने या हट जाने का है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: πάσης ἀδικίας
  choice: हर प्रकार के अधर्म
  rationale: ἀδικία नैतिक अन्याय और अधर्म दोनों को व्यक्त करता है; यहाँ धार्मिक-नैतिक विरोध के कारण ‘अधर्म’ उपयुक्त है, और πάσης की व्यापकता ‘हर प्रकार के’ से प्रकट होती है।
- source_word: κολλήθητε
  choice: जुड़े रहो
  rationale: क्रिया का मूल भाव दृढ़ता से चिपकने या संलग्न होने का है; ‘जुड़े रहो’ आज्ञा की निरंतर निष्ठा को सहज हिन्दी में व्यक्त करता है।
- source_word: τῇ δικαιοσύνῃ τοῦ Θεοῦ
  choice: परमेश्वर की धार्मिकता
  rationale: संबंधकारक की वास्तविक अस्पष्टता—परमेश्वर की अपनी धार्मिकता अथवा उससे संबद्ध/प्रदत्त धार्मिकता—को बिना सीमित किए संरक्षित करता है।
- source_word: τὸ γένος ὑμῶν
  choice: तुम्हारा वंश
  rationale: γένος यहाँ संतति या वंश के अर्थ में है; ‘वंश’ सामूहिक और पीढ़ीगत भाव को बनाए रखता है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार का कारण
  rationale: εἰς उद्देश्य या परिणाम सूचित कर सकता है। केवल ‘उद्धार के लिए’ हिन्दी में अस्वाभाविक और अस्पष्ट होता; ‘उद्धार का कारण’ वंश की उद्धारकारी भूमिका का संभावित अर्थ व्यक्त करता है, बिना यह कहे कि वंश स्वयं उद्धारकर्ता है।
- source_word: ἕως τοῦ αἰῶνος
  choice: सदा के लिए
  rationale: मुहावरे का कालगत अर्थ स्थायी या चिरकालिक है; आधुनिक हिन्दी में ‘सदा के लिए’ स्वाभाविक है।
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: मेरे पूर्वजों के पास
  rationale: πατέρες यहाँ पितरों/पूर्वजों की कब्रों की ओर संकेत करता है; ‘पूर्वज’ सामान्य पाठक के लिए स्पष्ट है और ‘पास’ स्थानगत अर्थ बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर की धार्मिकता’ का संबंध
  choice: परमेश्वर की धार्मिकता
  alternative: परमेश्वर से मिलने वाली धार्मिकता
  rationale: यूनानी संबंधकारक यह निश्चित नहीं करता कि धार्मिकता परमेश्वर का गुण है या उससे प्राप्त वरदान; मुख्य पाठ में अस्पष्टता सुरक्षित रखी गई है।
- issue: वंश और उद्धार का संबंध
  choice: तुम्हारा वंश सदा के लिए उद्धार का कारण बनेगा
  alternative: तुम्हारा वंश सदा के लिए उद्धार पाएगा
  rationale: εἰς σωτηρίαν को केवल वंश के अपने उद्धार के रूप में सीमित करना आवश्यक नहीं है। चुना हुआ पाठ उद्देश्य/परिणाम और दूसरों के लिए कल्याणकारी भूमिका की संभावना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों आज्ञाओं में सीधा बहुवचन संबोधन है। पद संख्या को पाठ में नहीं जोड़ा गया, और कोई पादटिप्पणी आवश्यक नहीं समझी गई।
