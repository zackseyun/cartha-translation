  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आदेशात्मक बहुवचन और पिता-सदृश स्नेहपूर्ण संबोधन सुरक्षित हैं। अंतिम वाक्यांश की पाठगत चिह्नित स्थिति के बावजूद उपलब्ध यूनानी पाठ और परामर्श-पाठ के अनुसार इसे मुख्य पाठ में रखा गया है; कोई पाठांतर-विशिष्ट फुटनोट उपलब्ध साक्ष्य के बिना नहीं जोड़ा गया।
