base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/008.yaml
  text: Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, अपने आप को हर बुरे काम से बचाए रखो। क्रोध और झूठ को अपने से दूर फेंक दो, और सत्य तथा धीरज से प्रेम करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατηρήσατε ... ἑαυτούς
  choice: अपने आप को ... बचाए रखो
  rationale: क्रिया में स्वयं की सतत रक्षा या निगरानी करने का भाव है; यह हिंदी में स्वाभाविक रहते हुए आत्मवाचक बल को सुरक्षित रखता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: स्नेहपूर्ण प्रत्यक्ष संबोधन को आधुनिक मानक हिंदी में सहज रूप से व्यक्त करता है।
- source_word: παντὸς ἔργου πονηροῦ
  choice: हर बुरे काम
  rationale: ἔργον को ठोस नैतिक आचरण के अर्थ में ‘काम’ और πονηρός को ‘बुरा’ से व्यक्त किया गया है।
- source_word: ἀπορρίψατε ἀφ᾽ ὑμῶν
  choice: अपने से दूर फेंक दो
  rationale: मूल के प्रबल त्याग-संबंधी रूपक को बनाए रखता है, केवल सामान्य ‘छोड़ दो’ तक नरम नहीं करता।
- source_word: τὸν θυμὸν
  choice: क्रोध
  rationale: यहाँ θυμός का प्रसंगानुकूल अर्थ तीव्र रोष या क्रोध है।
- source_word: τὸ ψεῦδος
  choice: झूठ
  rationale: असत्यता या मिथ्याभाषण के सामान्य नैतिक अर्थ को साधारण, स्पष्ट हिंदी में रखता है।
- source_word: τὴν ἀλήθειαν
  choice: सत्य
  rationale: अमूर्त नैतिक गुण के रूप में ἀλήθεια का सीधा और प्रतिष्ठित समतुल्य है।
- source_word: τὴν μακροθυμίαν
  choice: धीरज
  rationale: μακροθυμία क्रोध को रोककर लंबे समय तक सहने की वृत्ति दर्शाता है; ‘धीरज’ सामान्य पाठक के लिए स्वाभाविक है और इस संदर्भ में दीर्घ-सहनशीलता का भाव देता है।
