  text: Καὶ ἃ ἠκούσατε³⁸ παρὰ τοῦ πατρὸς ὑμῶν, μεταδοτε³⁹ ⌈καὶ⁴⁰ ὑμεῖς⁴¹⌉ τοῖς τέκνοις ὑμῶν⁴², [ἵνα δέξηται⁴³ ὑμᾶς ὁ Σωτὴρ⁴⁴ τῶν ἐθνῶν· *ἐστὶ γὰρ ἀληθὴς καὶ μακρόθυμος, πρᾷος καὶ ταπεινός⁴⁵, καὶ⁴⁶ ἐκδιδάσκων⁴⁷ διὰ τῶν ἔργων *τὸν νόμον Κυρίου⁴⁸].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/009.yaml
  text: And what you have heard from your father, pass on also to your children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord[a].
translation:
  language: hi
  text: और जो कुछ तुमने अपने पिता से सुना है, उसे अपने बच्चों तक भी पहुँचाओ, [ताकि जातियों का उद्धारकर्ता तुम्हें स्वीकार करे; क्योंकि वह सच्चा और सहनशील, कोमल और विनम्र है, और अपने कार्यों के द्वारा प्रभु की व्यवस्था सिखाता है।][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में चिह्नित यह वाक्य प्रायः बाद का विस्तार या प्रक्षेप माना जाता है; यहाँ इसका अनुवाद इसलिए किया गया है क्योंकि यह उपलब्ध कराए गए यूनानी साक्ष्य में मौजूद है।
    reason: textual_variant
lexical_decisions:
- source_word: μετάδοτε
  choice: सौंप दो
  rationale: यह आज्ञार्थक क्रिया प्राप्त शिक्षा को अगली पीढ़ी तक पहुँचाने का भाव रखती है; ‘सौंप दो’ उस उत्तरदायित्व और हस्तांतरण दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ Σωτὴρ τῶν ἐθνῶν
  choice: जातियों का उद्धारकर्ता
  rationale: यह पदबंध σωτήρ के उद्धार-संबंधी अर्थ और ἐθνῶν की व्यापक, गैर-इस्राएली अथवा समस्त जातियों से जुड़ी सम्भावित व्याप्ति को बनाए रखता है।
- source_word: μακρόθυμος
  choice: धीरजवन्त
  rationale: यह शब्द दीर्घ सहनशीलता और क्रोध करने में विलम्ब का भाव रखता है; ‘धीरजवन्त’ संक्षिप्त और गरिमापूर्ण समतुल्य है।
- source_word: πρᾷος καὶ ταπεινός
  choice: नम्र और दीन
  rationale: 'दोनों यूनानी विशेषणों का भेद बनाए रखा गया है: πρᾷος में कोमल नम्रता और ταπεινός में दीनता/विनय का भाव है।'
- source_word: ἐκδιδάσκων διὰ τῶν ἔργων τὸν νόμον Κυρίου
  choice: अपने कामों के द्वारा प्रभु की व्यवस्था सिखाता है
  rationale: διὰ τῶν ἔργων को साधनवाचक रूप में और νόμον Κυρίου को पारंपरिक किंतु स्पष्ट ‘प्रभु की व्यवस्था’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘जातियों का उद्धारकर्ता’ की पहचान
  choice: उपाधि को बिना अतिरिक्त पहचान या व्याख्या के ज्यों का त्यों रखा गया है।
  alternative: इसे स्पष्ट रूप से मसीह अथवा परमेश्वर से जोड़ना।
  rationale: यूनानी पाठ यहाँ केवल उपाधि देता है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को जोड़ना मूल की अपेक्षा अधिक निर्णायक होता।
- issue: संदिग्ध विस्तारित वाक्य का प्रस्तुतीकरण
  choice: वाक्य का अनुवाद मुख्य पाठ में किया गया है और [a] द्वारा उसकी पाठालोचनात्मक स्थिति बताई गई है।
  alternative: इसे मुख्य पाठ से हटाना या कोष्ठकों में रखना।
  rationale: दिया गया यूनानी साक्ष्य इस अंश को रखता है, जबकि संपादकीय कोष्ठक इसके बाद के विस्तार होने की सम्भावना दर्शाते हैं; पादटिप्पणी दोनों तथ्यों को सुरक्षित रखती है।
- issue: कार्य और शिक्षा का संबंध
  choice: ‘अपने कामों के द्वारा ... सिखाता है’ रखा गया है।
  alternative: ‘अपने कार्यों से व्यवस्था प्रमाणित करता है’ जैसे व्याख्यात्मक रूप।
  rationale: मूल में शिक्षा देने की क्रिया है; अनुवाद उससे आगे बढ़कर कर्म-सिद्धान्त संबंधी निष्कर्ष नहीं निकालता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘तुम’ बहुवचन संबोधन के रूप में प्रयुक्त है; ‘व्यवस्था’ धार्मिक-साहित्यिक संदर्भ में νόμος का परिचित अनुवाद है। पादटिप्पणी-चिह्न [a] पूरे संदिग्ध वाक्य के अंत में रखा गया है।
