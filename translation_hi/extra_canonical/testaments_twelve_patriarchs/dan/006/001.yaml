  text: VI. Καὶ νῦν *φοβήθητε τὸν Κύριον¹, τέκνα μου, καὶ προσέχετε ἑαυτοῖς² ἀπὸ τοῦ Σατανᾶ καὶ *τῶν πνευμάτων³ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/001.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits.
translation:
  language: hi
  text: और अब, मेरे बच्चों, प्रभु का भय मानो, और अपने आप को शैतान तथा उसकी आत्माओं से बचाए रखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε
  choice: भय मानो
  rationale: यह प्रभु के प्रति श्रद्धापूर्ण भय और गंभीर आदर का बाइबलीय भाव बनाए रखता है; केवल ‘डरो’ कहना अनावश्यक रूप से आतंक का भाव दे सकता है।
- source_word: προσέχετε ἑαυτοῖς ἀπό
  choice: अपने आप को ... से सावधान रखो
  rationale: यूनानी वाक्यांश आत्म-सतर्कता और किसी खतरे से बचाव, दोनों को व्यक्त करता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: τοῦ Σατανᾶ
  choice: शैतान
  rationale: व्यक्तिवाचक विरोधी के लिए हिंदी बाइबलीय परंपरा में स्थापित और सामान्यतः समझा जाने वाला रूप।
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: उसकी आत्माओं
  rationale: बहुवचन ‘πνευμάτων’ और संबंधसूचक ‘αὐτοῦ’ को सीधे बनाए रखता है, बिना उनकी प्रकृति की अतिरिक्त व्याख्या किए।
theological_decisions:
- issue: ‘प्रभु का भय मानने’ का आशय
  choice: प्रभु का भय मानो
  alternative: प्रभु से डरो
  rationale: मूल के φοβήθητε को सुरक्षित रखते हुए हिंदी में श्रद्धापूर्ण धार्मिक भय का प्रचलित भाव व्यक्त किया गया है; अर्थ को केवल आतंक या केवल सम्मान तक सीमित नहीं किया गया।
- issue: ‘उसकी आत्माओं’ की पहचान
  choice: उसकी आत्माओं
  alternative: उसकी दुष्ट आत्माओं
  rationale: मूल पाठ आत्माओं को विशेषण से ‘दुष्ट’ नहीं कहता; संदर्भ नकारात्मक होने पर भी अनुवाद में अतिरिक्त विशेषण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन। ‘मेरे बच्चो’ स्वाभाविक संबोधन-रूप है; वाक्य की दो समानांतर आज्ञाएँ मूल की संरचना के निकट रखी गई हैं।
