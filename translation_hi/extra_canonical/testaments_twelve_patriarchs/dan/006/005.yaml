id: T12P.DAN.6.5
reference: Testament of Dan 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Αὐτὸς γὰρ¹⁵ ὁ ἄγγελος *τῆς εἰρήνης¹⁶ *ἐνισχύσει τὸν Ἰσραὴλ¹⁷ μὴ ἐμπεσεῖν¹⁸ αὐτὸν εἰς τέλος¹⁹ κακῶν²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/005.yaml
  text: For he himself, the angel of peace, will strengthen Israel so that it will not fall into uttermost evils.
translation:
  language: hi
  text: क्योंकि शांति का वह दूत स्वयं इस्राएल को सामर्थ्य देगा, ताकि वह बुराइयों की अंतिम सीमा तक न गिर पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς ... ὁ ἄγγελος τῆς εἰρήνης
  choice: शान्ति का वह दूत स्वयं
  rationale: Αὐτός की बलाघाती भूमिका को ‘स्वयं’ से और निश्चित पदबंध को स्वाभाविक हिन्दी में ‘वह दूत’ से व्यक्त किया गया है।
- source_word: ἐνισχύσει
  choice: सामर्थ्य देगा
  rationale: यह भविष्यकालीन क्रिया किसी को दृढ़ या समर्थ करने का अर्थ देती है; ‘सामर्थ्य देगा’ सामान्य और गरिमापूर्ण हिन्दी है।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल को
  rationale: यहाँ इस्राएल सामूहिक प्रजा का नाम है और क्रिया का कर्म है।
- source_word: μὴ ἐμπεσεῖν αὐτὸν
  choice: ताकि वह ... न जा गिरे
  rationale: फल/उद्देश्य सूचक infinitive को हिन्दी के ‘ताकि’ उपवाक्य से व्यक्त किया गया है; αὐτόν का निकटतम और व्याकरणिक पूर्वपद ‘इस्राएल’ है।
- source_word: εἰς τέλος κακῶν
  choice: बुराइयों की पराकाष्ठा में
  rationale: τέλος का यहाँ चरम सीमा/पराकाष्ठा का भाव और κακῶν का बहुवचन सुरक्षित रखा गया है; पदबंध की कुछ अर्थगत कठोरता भी बनी रहती है।
theological_decisions:
- issue: ‘शान्ति का दूत’ की पहचान
  choice: उसे केवल ‘शान्ति का दूत’ कहा गया है
  alternative: किसी विशिष्ट प्रधान दूत, मसीही व्यक्तित्व या अन्य नामित सत्ता से उसकी पहचान करना
  rationale: यूनानी पाठ कोई नाम या स्पष्ट पहचान नहीं देता; अनुवाद को इस अस्पष्टता को बनाए रखना चाहिए।
- issue: इस्राएल का वचन-सामंजस्य
  choice: ‘वह’ द्वारा सामूहिक एकवचन इस्राएल का संदर्भ
  alternative: ‘वे’ या किसी व्यक्तिगत पुरुष के रूप में संदर्भ
  rationale: यूनानी αὐτόν पुल्लिंग एकवचन है और τὸν Ἰσραήλ की ओर संकेत करता है; हिन्दी में राष्ट्र/समुदाय के लिए एकवचन संदर्भ स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘शान्ति’ और ‘इस्राएल’ जैसे स्थापित बाइबिलीय रूप रखे गए हैं। किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
