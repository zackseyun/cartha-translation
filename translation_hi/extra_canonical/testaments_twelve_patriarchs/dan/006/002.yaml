source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐγγίσατε⁴ τῷ θεῷ καὶ τῷ ἀγγέλῳ *τῷ παραιτουμένῳ ὑμᾶς⁵· ὅτι οὗτός ἐστι μεσίτης θεοῦ καὶ ἀνθρώπων καὶ⁶ ἐπὶ τῆς εἰρήνης τοῦ⁷ Ἰσραὴλ κατέναντι⁸ *τῆς βασιλείας τοῦ †θεοῦ στήσεται⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/002.yaml
  text: Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy.
translation:
  language: hi
  text: परमेश्वर और उस स्वर्गदूत के निकट आओ, जो तुम्हारे लिए विनती करता है; क्योंकि वह परमेश्वर और मनुष्यों के बीच मध्यस्थ है[a]। इस्राएल की शांति के लिए वह परमेश्वर के राज्य के सम्मुख खड़ा होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर और मनुष्यों के बीच मध्यस्थ’ यूनानी का सीधा अनुवाद है। इसी अनुच्छेद में उसे ‘स्वर्गदूत’ कहा गया है; पाठ उसकी पहचान किसी बाद की धार्मिक हस्ती से स्पष्ट रूप से नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: प्रदत्त यूनानी पाठ में शाब्दिक रूप से ‘परमेश्वर के राज्य के सम्मुख’ है। यह संदर्भ में कठिन पाठ है, और संस्करण में ‘परमेश्वर’ के साथ † चिह्न लगा है। कुछ अनुवाद संदर्भ के आधार पर ‘शत्रु के राज्य के विरुद्ध’ पढ़ते हैं, पर वह शब्द प्रदत्त यूनानी पाठ में नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἐγγίσατε
  choice: निकट आओ
  rationale: यह क्रिया परमेश्वर की ओर बढ़ने या उसके समीप आने का आह्वान करती है; आधुनिक हिन्दी में यह स्वाभाविक और अर्थनिष्ठ है।
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: उस स्वर्गदूत के भी, जो तुम्हारे लिए विनती करता है
  rationale: ἄγγελος को संदर्भानुसार ‘स्वर्गदूत’ और παραιτουμένῳ को विनती/मध्यस्थता करने के अर्थ में प्रस्तुत किया गया है। यूनानी वाक्यांश में ‘तुम्हारे साथ बना रहने’ का कोई स्पष्ट पद नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: परमेश्वर और मनुष्यों के बीच मध्यस्थ
  rationale: μεσίτης का सीधा अर्थ ‘मध्यस्थ’ है। ‘के बीच’ हिन्दी में संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατέναντι … στήσεται
  choice: … के सामने खड़ा होगा
  rationale: κατέναντι स्थानगत रूप से ‘सामने/सम्मुख’ का अर्थ देता है। ‘विरोध में’ कहना संभव है, पर वह स्रोत की अस्पष्टता को आवश्यकता से अधिक निर्णीत कर देता।
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: प्रदत्त यूनानी पाठ का प्रत्यक्ष पाठ यही है, यद्यपि यह संदर्भ में कठिन और संभवतः दूषित पाठ है।
theological_decisions:
- issue: स्वर्गदूत का ‘परमेश्वर और मनुष्यों के बीच मध्यस्थ’ होना
  choice: पद की भाषा को बिना किसी बाद की धार्मिक पहचान से जोड़े यथावत रखा गया।
  alternative: स्वर्गदूत को किसी विशिष्ट बाद की मसीही धार्मिक हस्ती के रूप में पहचानना।
  rationale: स्रोत स्वयं ‘स्वर्गदूत’ और ‘मध्यस्थ’ दोनों कहता है, पर उसकी पहचान स्पष्ट नहीं करता; इसलिए तनाव को खुला रखना उचित है।
- issue: अंतिम वाक्यांश ‘परमेश्वर के राज्य के सामने’
  choice: प्रदत्त यूनानी पाठ का सीधा अनुवाद मुख्य पाठ में रखा गया।
  alternative: अंग्रेज़ी POB के अनुसार ‘शत्रु के राज्य के विरुद्ध’ करना।
  rationale: प्रदत्त यूनानी में θεοῦ (‘परमेश्वर का’) है, ἐχθροῦ (‘शत्रु का’) नहीं। संदर्भगत कठिनाई को पाद-टिप्पणी में बताया गया है, न कि चुपचाप सुधारा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परमेश्वर’, ‘स्वर्गदूत’ और ‘मध्यस्थ’ जैसे प्रचलित बाइबलीय शब्द अपनाए गए हैं। कठिन यूनानी पाठ को मुख्य अनुवाद में नहीं सुधारा गया, बल्कि पाद-टिप्पणी में उसकी समस्या स्पष्ट की गई है।
