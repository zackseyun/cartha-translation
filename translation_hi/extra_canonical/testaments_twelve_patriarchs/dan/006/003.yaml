  text: Because of this the enemy is eager to trip up all who call on the Lord.
translation:
  language: hi
  text: इसी कारण शत्रु उन सभी को ठोकर खिलाने के लिए तत्पर रहता है जो प्रभु को पुकारते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: यूनानी पद का कारणसूचक बल स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: σπουδάζει
  choice: तत्पर रहता है
  rationale: वर्तमान काल में निरंतर उत्सुकता और प्रयत्न, दोनों का भाव व्यक्त करता है।
- source_word: ὁ ἐχθρός
  choice: शत्रु
  rationale: मूल के निश्चित और व्यक्तिवाचक-सदृश उल्लेख को बिना अतिरिक्त पहचान जोड़े सुरक्षित रखता है।
- source_word: ὑποσκελίζειν
  choice: ठोकर खिलाने के लिए
  rationale: क्रिया का मूल चित्र किसी को पाँव अड़ाकर गिराने या ठोकर खिलाने का है; यह हिन्दी में बोधगम्य रूपक है।
- source_word: τοὺς ἐπικαλουμένους τὸν Κύριον
  choice: जो प्रभु को पुकारते हैं
  rationale: ἐπικαλέομαι के प्रार्थना/सहायता हेतु पुकारने के अर्थ और Κύριος के सामान्य धार्मिक संबोधन को सीधे व्यक्त करता है।
theological_decisions:
- issue: ‘शत्रु’ की पहचान
  choice: शत्रु
  alternative: शैतान
  rationale: मूल पाठ केवल ὁ ἐχθρός कहता है; उसे स्पष्ट रूप से ‘शैतान’ कहना पाठ से आगे जाकर अस्पष्टता समाप्त कर देता।
- issue: ‘प्रभु को पुकारना’ का अर्थ
  choice: प्रभु को पुकारते हैं
  alternative: प्रभु के नाम का आह्वान करते हैं
  rationale: सीधा रूप सामान्य पाठक के लिए सहज है और प्रार्थना, सहायता की पुकार तथा उपासना से जुड़ी मूल अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
