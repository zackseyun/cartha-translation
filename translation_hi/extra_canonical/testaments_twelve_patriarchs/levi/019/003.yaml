source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπεν *αὐτοῖς ὁ πατὴρ αὐτῶν¹¹. Μάρτυς ἐστι¹² κύριος, καὶ μάρτυρες οἱ¹³ ἄγγελοι αὐτοῦ, *καὶ μάρτυρες ὑμεῖς καὶ μάρτυς ἐγὼ¹⁴ *περὶ τοῦ λόγου τοῦ στόματος ὑμῶν¹⁵. Καὶ *εἶπον αὐτῷ οἱ υἱοὶ αὐτοῦ¹⁶. Μάρτυρες¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/003.yaml
  text: And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him, “We are witnesses.”
translation:
  language: hi
  text: और उनके पिता ने उनसे कहा, “प्रभु गवाह है, और उसके स्वर्गदूत गवाह हैं; तुम भी गवाह हो, और मैं भी तुम्हारे मुँह से निकली बात के विषय में गवाह हूँ।” तब उनके पुत्रों ने अपने पिता से कहा, “हम गवाह हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς / μάρτυρες
  choice: गवाह / गवाह हैं
  rationale: यहाँ शब्द किसी कथन या प्रतिज्ञा की पुष्टि करने वाले साक्षी को दर्शाता है। आधुनिक हिन्दी में “गवाह” सहज और सटीक है।
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: तुम्हारे मुँह से निकली बात के विषय में
  rationale: यूनानी अभिव्यक्ति का मौखिक कथन से संबंध बनाए रखते हुए इसे स्वाभाविक हिन्दी में व्यक्त किया गया है; “बात” λόγος के प्रसंगगत अर्थ को दर्शाता है।
- source_word: κύριος
  choice: प्रभु
  rationale: ईश्वर के लिए प्रयुक्त यूनानी उपाधि का प्रचलित, गरिमापूर्ण हिन्दी समतुल्य।
- source_word: ἄγγελοι
  choice: स्वर्गदूत
  rationale: धार्मिक प्रसंग में ἄγγελοι के लिए आधुनिक हिन्दी का स्पष्ट और परिचित शब्द।
theological_decisions:
- issue: अंतिम उत्तर Μάρτυρες में कर्ता और क्रिया का लोप
  choice: “हम गवाह हैं।”
  alternative: “गवाह।”
  rationale: यूनानी में एक शब्द का संक्षिप्त उत्तर है, जिसका आशय प्रसंग से “हम गवाह हैं” बनता है। पूर्ण हिन्दी वाक्य अर्थ को स्पष्ट और स्वाभाविक रखता है, बिना अतिरिक्त धार्मिक व्याख्या जोड़े।
- issue: प्रभु, स्वर्गदूतों, पुत्रों और पिता की साक्षी
  choice: सभी को समान रूप से ‘गवाह’ कहा गया
  alternative: किसी एक साक्षी को न्यायिक या आध्यात्मिक रूप से विशेष दर्जा देना
  rationale: मूल पाठ की समानांतर संरचना सुरक्षित रखी गई है और साक्षियों के पदानुक्रम के बारे में कोई अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। बार-बार आने वाले ‘गवाह’ को मूल की अलंकारिक पुनरावृत्ति बनाए रखने के लिए सुरक्षित रखा गया है।
