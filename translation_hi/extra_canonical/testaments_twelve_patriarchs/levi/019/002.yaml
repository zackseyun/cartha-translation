  text: And his sons answered him, saying, “Before the Lord we will walk according to his law.”
translation:
  language: hi
  text: और उसके पुत्रों ने उसे उत्तर दिया, “हम प्रभु के सामने उसकी व्यवस्था के अनुसार चलेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐνώπιον κυρίου
  choice: प्रभु के सामने
  rationale: स्थानसूचक रूपक और परमेश्वर की उपस्थिति में जीवन बिताने का भाव सीधे और स्वाभाविक ढंग से सुरक्षित रहता है।
- source_word: πορευσόμεθα
  choice: हम ... चलेंगे
  rationale: यूनानी भविष्यकाल तथा आचरण के रूपक—दोनों को बनाए रखता है।
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: उसके विधान के अनुसार
  rationale: νόμος के नियम और मार्गदर्शक व्यवस्था के अर्थ को वर्तमान हिन्दी में गरिमापूर्ण और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: Ἐνώπιον κυρίου का भाव
  choice: प्रभु के सामने
  alternative: प्रभु की उपस्थिति में
  rationale: मूल के ठोस रूपक को बनाए रखा गया है और इसे केवल धार्मिक आज्ञाकारिता के अर्थ में सीमित नहीं किया गया।
- issue: संदिग्ध/पाठ-संपादकीय καὶ का अनुवाद
  choice: अलग संयोजक के रूप में व्यक्त नहीं किया
  alternative: और उसके विधान के अनुसार
  rationale: ⌜καὶ⌝ पाठ-संपादकीय अनिश्चितता दर्शाता है; हिन्दी में इसे जोड़ने से वाक्य अस्वाभाविक और संबंध अस्पष्ट होता। भाव स्वाभाविक वाक्य-रचना में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। प्रत्यक्ष कथन में ‘कहते हुए’ का यांत्रिक पुनरुत्पादन नहीं किया गया, क्योंकि ‘उत्तर दिया’ के बाद उद्धरण वही कार्य स्वाभाविक रूप से करता है।
