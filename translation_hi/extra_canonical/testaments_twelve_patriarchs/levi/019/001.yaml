source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν, τέκνα μου¹, πάντα ἠκούσατε². Ἐκλέξασθε³ ἑαυτοῖς *ἢ τὸ φῶς ἢ τὸ σκότος⁴, ἢ τὸν⁵ νόμον⁶ κυρίου, ἢ *τὰ ἔργα τοῦ Βελίαρ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/001.yaml
  text: And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar.
translation:
  language: hi
  text: और अब, मेरे बच्चो, तुम सब कुछ सुन चुके हो। अपने लिए चुन लो—या तो ज्योति या अंधकार, या तो प्रभु की व्यवस्था या बेलियार के काम।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: स्नेहपूर्ण प्रत्यक्ष संबोधन को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: πάντα ἠκούσατε
  choice: तुम सब कुछ सुन चुके हो
  rationale: ग्रीक पूर्णकाल के परिणामसूचक भाव को वर्तमान पूर्ण रूप से व्यक्त किया गया है।
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: अपने लिए चुन लो
  rationale: मध्यमवाच्य और आत्महितसूचक ἑαυτοῖς दोनों को स्पष्ट रखते हुए सीधा आह्वान दिया गया है।
- source_word: τὸ φῶς / τὸ σκότος
  choice: ज्योति / अंधकार
  rationale: नैतिक और आध्यात्मिक विरोध को गरिमापूर्ण, प्रचलित बाइबलीय हिन्दी में सुरक्षित रखा गया है।
- source_word: νόμον κυρίου
  choice: प्रभु की व्यवस्था
  rationale: νόμος के लिए ‘व्यवस्था’ यहाँ दैवी विधान के अर्थ को ‘कानून’ से अधिक उपयुक्त ढंग से व्यक्त करता है।
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: बेलियार के काम
  rationale: व्यक्तिनाम को लिप्यंतरित किया गया और ἔργα का सामान्य तथा व्यापक अर्थ ‘काम’ रखा गया है।
theological_decisions:
- issue: दो समांतर नैतिक विकल्पों का संबंध
  choice: ‘या तो...या...’ की दोनों जोड़ियों को ज्यों का त्यों रखा गया
  alternative: दूसरी जोड़ी को पहली की व्याख्या मानकर ‘अर्थात्’ जोड़ना
  rationale: ग्रीक पाठ समांतर विकल्प प्रस्तुत करता है, पर उनके संबंध को स्पष्ट रूप से व्याख्यायित नहीं करता; इसलिए तनाव और संरचना सुरक्षित रखी गई है।
- issue: Βελίαρ की पहचान
  choice: बेलियार नाम को बिना व्याख्यात्मक पहचान के रखा गया
  alternative: शैतान या दुष्ट के रूप में अनुवाद करना
  rationale: मूल में व्यक्तिनाम है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को मुख्य पाठ में जोड़ना मूल की अपेक्षा अधिक निश्चितता लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली। ‘ज्योति’, ‘अंधकार’ और ‘व्यवस्था’ जैसे परिचित धार्मिक शब्द मूल की गंभीरता बनाए रखते हैं; कोई पादटिप्पणी आवश्यक नहीं समझी गई।
