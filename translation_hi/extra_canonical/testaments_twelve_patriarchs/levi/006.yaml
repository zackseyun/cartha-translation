  text: 1 And as I was going to my father[a], I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, on the right of Abim. 2 And I kept these words in my heart. 3 After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous on account of the abomination which they had committed against my sister. 4 And I killed Shechem first, and Simeon killed Emmor. 5 And after this my brothers came and struck that city with the edge of the sword. 6 And my father heard these things, and being angry he was grieved because they had accepted circumcision and died, and in his blessings he passed over us. 7 For we sinned, because we had done this contrary to his judgment, though he became weak on that day. 8 But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them. 9 And
    they pursued Abraham our father when he was a stranger, and they oppressed his flocks when they were swollen with increase, and they cruelly mistreated Eblan his home-born servant. 10 And indeed in this way they used to act toward all strangers, seizing foreign women by force and driving them away[b][c][d][e]. 11 But the wrath of God came upon them completely.
translation:
  language: hi
  text: 'लेवी का वसीयतनामा 6


    1 जब मैं अपने पिता के पास जा रहा था, तब मुझे काँसे की एक ढाल मिली। इसी कारण उस पर्वत का नाम अस्पिस है; वह गबाल के पास, अबीमा की दाहिनी ओर है। 2 मैंने इन बातों को अपने हृदय में सँजोए रखा।


    3 इसके बाद मैंने अपने पिता और रूबेन के साथ विचार-विमर्श किया कि मेरे पिता हम्मोर के पुत्रों से कहें कि वे अपना खतना न कराएँ, क्योंकि उन्होंने मेरी बहन के साथ जो घृणित काम किया था, उसके कारण मैं जोश से भर उठा था। 4 मैंने सबसे पहले शकेम को मार डाला और शिमोन ने हम्मोर को। 5 इसके बाद मेरे भाइयों ने आकर उस नगर पर तलवार की धार से प्रहार किया।


    6 जब मेरे पिता ने ये बातें सुनीं, तो वे क्रोधित हुए और इस कारण दुःखी हुए कि उन लोगों ने खतना स्वीकार किया और मर गए। अपनी आशीषों में उन्होंने हमें छोड़ दिया।[a] 7 क्योंकि हमने पाप किया था—हमने यह काम उनके निर्णय के विरुद्ध किया था—यद्यपि उस दिन वे निर्बल पड़ गए थे।[e]


    8 पर मैंने देखा कि उन पर विपत्ति लाने के लिए यह परमेश्वर का निर्णय था, क्योंकि वे सारा और रिबका के साथ भी वही करना चाहते थे जो उन्होंने हमारी बहन दीना के साथ किया था; पर प्रभु ने उन्हें रोक दिया।[d] 9 जब हमारे पूर्वज अब्राहम परदेशी थे, तब उन्होंने उनका पीछा किया; जब उनके पशुओं के झुंड बढ़ रहे थे, तब उन्होंने उनके झुंडों को सताया; और उनके घर में जन्मे सेवक एब्लान के साथ अत्यन्त क्रूर व्यवहार किया।[c] 10 वे सभी परदेशियों के साथ इसी प्रकार व्यवहार करते थे: वे बलपूर्वक परदेशी स्त्रियों को पकड़ लेते और उन्हें निकाल देते थे। 11 पर परमेश्वर का क्रोध उन पर पूरी तरह आ पड़ा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आशीषों में उन्होंने हमारी उपेक्षा की”; अर्थात याकूब ने आशीष देते समय लेवी और शिमोन पर अनुग्रह नहीं किया।
    reason: lexical_alternative
  - marker: b
    text: “क्रोध ... पूरी तरह” का यूनानी मुहावरा पूर्ण अथवा अंतिम न्याय की ओर संकेत कर सकता है।
    reason: cross_reference
  - marker: c
    text: “एब्लान” नाम का पाठ-परम्परा में रूप अनिश्चित है। मूल आशय यह है कि अब्राहम के घर में जन्मे एक सेवक के साथ कठोर दुर्व्यवहार हुआ।
    reason: textual_variant
  - marker: d
    text: इस पद का यूनानी पाठ कठिन है। उपलब्ध पाठ यह कहता हुआ प्रतीत होता है कि शकेम के पुरुष सारा और रिबका के साथ भी वही करना चाहते थे जो उन्होंने दीना के साथ किया था।
    reason: textual_variant
  - marker: e
    text: “निर्बल पड़ गए” के लिए प्रयुक्त यूनानी क्रिया कठिन है; इसका अर्थ यह भी हो सकता है कि उस दिन याकूब नरम पड़ गए, दुर्बल हो गए या उन पर बात का गहरा प्रभाव पड़ा।
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: काँसे की एक ढाल
  rationale: ἀσπίς का सामान्य अर्थ ‘ढाल’ है और χαλκῆν उसकी धातु बताता है। इससे पर्वत-नाम अस्पिस से जुड़ा शब्द-संबंध भी बना रहता है।
- source_word: συνετήρουν ... ἐν τῇ καρδίᾳ μου
  choice: मैंने ... अपने हृदय में सँजोए रखा
  rationale: यह भीतर स्मरण रखने का मुहावरा है; ‘सँजोए रखा’ आधुनिक और गरिमापूर्ण है तथा साधारण स्मरण से अधिक गहराई व्यक्त करता है।
- source_word: συνεβούλευσα
  choice: विचार-विमर्श किया
  rationale: क्रिया परामर्श और सोच-विचार दोनों का भाव रखती है; यह हिंदी में स्वाभाविक औपचारिक अभिव्यक्ति है।
- source_word: μὴ περιτμηθῆναι αὐτούς
  choice: वे अपना खतना न कराएँ
  rationale: मध्य/कर्मवाच्य भाव को सहज हिंदी में व्यक्त करता है और प्रसंग के अनुसार स्वेच्छा से खतना कराने का अर्थ देता है।
- source_word: ἐζήλωσα
  choice: मैं जोश से भर उठा था
  rationale: यहाँ ईर्ष्या नहीं, बहन के विरुद्ध अपराध पर तीव्र नैतिक आवेश अभिप्रेत है।
- source_word: βδέλυγμα
  choice: घृणित काम
  rationale: मूल शब्द की प्रबल नैतिक घृणा को साधारण आधुनिक हिंदी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν στόματι μαχαίρας
  choice: तलवार की धार से
  rationale: शाब्दिक ‘तलवार के मुँह से’ के स्थान पर उसी सामी मुहावरे का स्वाभाविक हिंदी समतुल्य है।
- source_word: παρεῖδεν ἡμῖν
  choice: उन्होंने हमें छोड़ दिया
  rationale: आशीषों के प्रसंग में इसका अर्थ अनदेखा करना या अनुग्रह से वंचित छोड़ देना है; पाठ की कठिनता पादटिप्पणी में स्पष्ट की गई है।
- source_word: παρὰ γνώμην αὐτοῦ
  choice: उनके निर्णय के विरुद्ध
  rationale: γνώμη यहाँ केवल राय नहीं, याकूब का सोचा-समझा निर्णय दर्शाता है।
- source_word: ἐμαλακίσθη
  choice: वे निर्बल पड़ गए थे
  rationale: दुर्बल या शिथिल होने की कठिन क्रिया का संयत अनुवाद है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἀπόφασις θεοῦ
  choice: परमेश्वर का निर्णय
  rationale: यह निर्धारित दैवी निर्णय या न्यायिक घोषणा का भाव देता है, बिना अनावश्यक धर्मसैद्धांतिक विस्तार के।
- source_word: εἰς κακά
  choice: उन पर विपत्ति लाने के लिए
  rationale: κακά के प्रतिकूल न्याय और हानि के भाव को लक्ष्य-सम्बन्ध सहित स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τὰς ξένας
  choice: परदेशी स्त्रियों
  rationale: स्त्रीलिंग विशेषण का स्वतंत्र संज्ञात्मक प्रयोग है; ‘परदेशी स्त्रियाँ’ मूल की स्पष्ट लिंग-सूचना और परदेशीपन दोनों रखता है।
- source_word: Ἔφθασε ... εἰς τέλος
  choice: पूरी तरह आ पड़ा
  rationale: मुहावरा क्रोध के पूर्ण अथवा अंतिम रूप से पहुँचने का भाव रखता है; इसे पादटिप्पणी में भी संकेतित किया गया है।
theological_decisions:
- issue: शकेम के विनाश में पाप और दैवी निर्णय का तनाव
  choice: लेवी भाइयों के काम को पिता के निर्णय के विरुद्ध किया गया पाप मानता है, फिर भी शकेमियों पर आई विपत्ति को परमेश्वर का निर्णय भी कहता है।
  alternative: वध को या तो पूरी तरह निर्दोष दैवी कार्य अथवा केवल मानवीय पाप मानकर दूसरे कथन को कमज़ोर करना।
  rationale: पद 7 और 8 दोनों दावों को साथ रखते हैं। अनुवाद इस तनाव को सुलझाने के बजाय सुरक्षित रखता है।
- issue: पद 8 में सारा और रिबका का उल्लेख
  choice: कठिन यूनानी पाठ के अनुसार शकेमी सारा और रिबका के साथ भी दीना जैसा व्यवहार करना चाहते थे।
  alternative: पंक्ति को भ्रष्ट मानकर छोड़ देना या नामों को सामान्य पूर्वज स्त्रियों में बदल देना।
  rationale: प्राप्त यूनानी साक्ष्य दोनों नाम स्पष्ट रूप से देता है; पाठगत कठिनता पादटिप्पणी में बताई गई है।
- issue: याकूब का आशीषों में लेवी और शिमोन को छोड़ना
  choice: वाक्य को प्रतिकूल अर्थ में लिया गया है—याकूब ने अपनी आशीषों में उन्हें अनुग्रह नहीं दिया।
  alternative: इसे उनके अपराध को अनदेखा या क्षमा करने के अर्थ में लेना।
  rationale: प्रसंग याकूब के क्रोध और दुःख का है, इसलिए ‘हमें छोड़ दिया’ अधिक संगत है, यद्यपि क्रिया कठिन है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण वसीयतनामात्मक कथन रखा गया है। नामों को प्रचलित बाइबिलीय हिंदी रूपों के निकट रखा गया है। हिंसा और यौन अत्याचार से जुड़े शब्द स्पष्ट हैं, पर अनावश्यक रूप से चित्रात्मक नहीं। कठिन और संदिग्ध यूनानी स्थलों को मुख्य पाठ में सहज रूप दिया गया है, जबकि वास्तविक विकल्प और अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
