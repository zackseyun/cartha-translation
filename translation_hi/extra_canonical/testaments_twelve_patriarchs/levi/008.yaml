  text: '1 वहाँ फिर मैंने पहले दर्शन के समान एक दर्शन देखा, जब हमें वहाँ रहते हुए सत्तर दिन हो चुके थे। 2 मैंने सफेद वस्त्र पहने सात पुरुषों को देखा। उन्होंने मुझसे कहा, “उठो और याजकपद का चोगा, धार्मिकता का मुकुट, समझ का दैववचन[a], सत्य का पाँवों तक लंबा वस्त्र, विश्वास की पट्टी, सिर की पगड़ी और भविष्यवाणी का एपोद पहन लो।” 3 उनमें से हर एक इन वस्तुओं को लिए हुए था। उन्होंने वे वस्तुएँ मुझे पहनाईं और मुझसे कहा, “अब से तुम याजक बनो—तुम और तुम्हारा सारा वंश।”


    4 पहले ने पवित्र तेल से मेरा अभिषेक किया और मुझे एक छड़ी दी। 5 दूसरे ने प्रभु के शुद्ध जल से मुझे धोया, मुझे पवित्र रोटी और दाखमधु खिलाया-पिलाया, और मुझे पवित्र तथा महिमामय चोगा पहनाया। 6 तीसरे ने मुझे सन का एक वस्त्र पहनाया, जो एपोद के समान था। 7 चौथे ने मेरी कमर पर बैंजनी रंग की कमरबंद बाँधी। 8 पाँचवें ने मुझे समृद्ध जैतून की एक डाल दी। 9 छठे ने मेरे सिर पर मुकुट रखा। 10 सातवें ने मुझे याजकपद का राजमुकुट पहनाया और मेरे हाथ धूप से भर दिए, ताकि मैं प्रभु परमेश्वर के लिए याजक की सेवा करूँ।


    11 उन्होंने मुझसे कहा, “लेवी, तुम्हारा वंश तीन पदों में बाँटा जाएगा; यह आनेवाले प्रभु की महिमा का चिह्न होगा। 12 पहला भाग महान होगा; उससे महान कोई दूसरा उत्पन्न न होगा। 13 दूसरा याजकपद में होगा। 14 तीसरे को एक नया नाम दिया जाएगा, क्योंकि यहूदा से एक राजा उठेगा और राष्ट्रों के प्रतिरूप के अनुसार, सभी राष्ट्रों के लिए, एक नया याजकपद स्थापित करेगा।[b] 15 उसकी उपस्थिति प्रिय है—वह हमारे पिता अब्राहम के वंश से परमप्रधान के भविष्यद्वक्ता के समान है।[c] 16 इसलिए इस्राएल की हर मनभावनी वस्तु तुम्हारी और तुम्हारे वंश की होगी। तुम्हारा वंश हर सुंदर वस्तु खाएगा और प्रभु की मेज़ का भाग बाँटेगा। 17 उन्हीं में से याजक, न्यायी और शास्त्री होंगे; और उनके मुख के अनुसार पवित्र वस्तु ग्रहण की जाएगी।”[d]


    18 तब जागने पर मैं समझ गया कि यह पहले स्वप्न के समान था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“समझ का दैववचन”: यूनानी λόγιον का अर्थ दैवी वचन या घोषणा हो सकता है; याजकीय परिधान के इस संदर्भ में यह वक्षपट अथवा उससे जुड़ी वाणी का संकेत भी दे सकता है।'
    reason: तकनीकी शब्द की अर्थगत व्यापकता सुरक्षित रखना।
  - marker: b
    text: “राष्ट्रों के प्रतिरूप के अनुसार” का यूनानी वाक्यांश कठिन है। इसका संबंध ‘नया याजकपद’ से भी जोड़ा जा सकता है, और इसका अर्थ “राष्ट्रों के लिए प्रतिरूप के रूप में” भी समझा जा सकता है।
    reason: वाक्यांश के संबंध और अर्थ की पाठगत अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: “उपस्थिति” के लिए प्रयुक्त यूनानी शब्द का अर्थ “आगमन” भी हो सकता है।
    reason: παρουσία की अर्थगत द्विविधा बताना।
  - marker: d
    text: “पवित्र वस्तु” किसे सूचित करती है, यह स्पष्ट नहीं है; वाक्य का अर्थ यह भी हो सकता है कि उनके कथन या गवाही के आधार पर उसे ग्रहण किया जाएगा।
    reason: पद 17 के कठिन और संभवतः विकृत पाठ को किसी एक धार्मिक व्याख्या में सीमित न करना।
lexical_decisions:
- source_word: λόγιον τῆς συνέσεως
  choice: समझ की वाणी बतानेवाला वक्षपट
  rationale: λόγιον याजकीय वक्षपट के साथ-साथ उससे मिलनेवाली दैवी वाणी का संकेत देता है; मुख्य पाठ में दोनों पहलुओं को संक्षेप में बनाए रखा गया है।
- source_word: ποδήρη
  choice: पाँवों तक लंबा वस्त्र
  rationale: शब्द का मूल अर्थ लंबा, पैरों तक पहुँचने वाला वस्त्र है; तकनीकी अस्पष्टता को सहज हिन्दी में व्यक्त किया गया।
- source_word: πέταλον
  choice: पट्टी
  rationale: यह महायाजक के मस्तक पर लगी धातु की पट्टी को सूचित कर सकता है; केवल 'फलक' से अधिक स्वाभाविक और परिधान-संदर्भ के अनुकूल।
- source_word: ἐφοὺδ
  choice: एपोद
  rationale: विशिष्ट याजकीय परिधान का स्वीकृत लिप्यंतरण; किसी आधुनिक सामान्य वस्त्र से इसकी पहचान नहीं की गई।
- source_word: ῥάβδον
  choice: छड़ी
  rationale: यूनानी में केवल दंड/छड़ी है; स्रोत में अनुपस्थित 'याजकीय' विशेषण नहीं जोड़ा गया।
- source_word: κλάδον ... ἐλαίας ... πιότητος
  choice: उत्तम जैतून की एक डाल
  rationale: πιότης समृद्धि, चिकनाई या भरपूरी का भाव देता है; 'उत्तम' सहज हिन्दी में गुणसूचक अर्थ रखता है, बिना अर्थ को तेलयुक्त डाल तक सीमित किए।
- source_word: ἀρχὰς
  choice: पदों
  rationale: यहाँ आरंभ, प्रधानता या शासन-पद का अर्थ संभव है; वंश के तीन प्रतिष्ठित कार्यक्षेत्रों के संदर्भ में 'पद' उपयुक्त है, पर गिनती की संरचना की कठिनाई बनी रहती है।
- source_word: κλῆρος
  choice: भाग
  rationale: शब्द का अर्थ चिट्ठी से मिला हिस्सा, भाग या वर्ग हो सकता है; 'भाग' हिन्दी में इस बहुअर्थकता को सबसे स्वाभाविक रूप से रखता है।
- source_word: παρουσία
  choice: आगमन
  rationale: शब्द उपस्थिति या आगमन दोनों अर्थ दे सकता है; निकटवर्ती 'आनेवाले प्रभु' और भविष्यसूचक संदर्भ में 'आगमन' चुना गया, जबकि टिप्पणी में अर्थगत तनाव दर्ज है।
- source_word: διανεμεῖται τὴν τράπεζαν Κυρίου
  choice: प्रभु की मेज़ की वस्तुएँ बाँटेगा
  rationale: मेज़ स्वयं बाँटने की शाब्दिक अभिव्यक्ति हिन्दी में अस्वाभाविक है; याजकीय वितरण का आशय स्पष्ट करते हुए मेज़ की धार्मिक छवि रखी गई।
theological_decisions:
- issue: यहूदा से उठनेवाले राजा और नए याजकपद की पहचान
  choice: पाठ की भविष्यसूचक भाषा को बिना किसी नामित मसीही या ऐतिहासिक पहचान के रखा गया
  alternative: राजा को स्पष्ट रूप से मसीह कहना
  rationale: यूनानी पाठ 'राजा' और 'नया याजकपद' कहता है, पर व्यक्ति का नाम नहीं देता; अनुवाद को उससे आगे नहीं जाना चाहिए।
- issue: नए याजकपद का 'राष्ट्रों के नमूने के अनुसार' होना
  choice: कठिन वाक्यांश को औपचारिक रूप से सुरक्षित रखा गया और फुटनोट में वैकल्पिक संबंध बताया गया
  alternative: इसे 'अन्यजातियों के ढंग का याजकपद' या 'राष्ट्रों के बीच याजकपद' के रूप में निर्णायक बनाना
  rationale: κατὰ τὸν τύπον τῶν ἐθνῶν का संबंध और आशय संदिग्ध है; धार्मिक निष्कर्ष थोपना उचित नहीं।
- issue: पद 15 में राजा/तीसरे पद और भविष्यद्वक्ता का संबंध
  choice: सर्वनामगत निरंतरता बनाए रखी गई, पर 'के समान' को सुरक्षित रखा गया
  alternative: राजा को सीधे 'परमप्रधान का भविष्यद्वक्ता' घोषित करना
  rationale: ὡς तुलना सूचित करता है; पहचान और तुलना के बीच का तनाव मिटाया नहीं गया।
- issue: पद 17 में 'पवित्र वस्तु'
  choice: अनिश्चित एकवचन को 'पवित्र वस्तु' ही रखा गया
  alternative: व्यवस्था, आशीष, पवित्र वचन या परमपवित्र व्यक्ति के रूप में व्याख्या करना
  rationale: पाठ वस्तु या आशय स्पष्ट नहीं करता; किसी संस्कारगत या मसीही अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। 'याजकपद', 'एपोद', 'अभिषेक' और 'दाखमधु' जैसे स्थापित धार्मिक शब्द बनाए गए हैं। मूल की परिधान-सूची और भविष्यसूचक तनाव को यथासंभव औपचारिक रखा गया, जबकि अस्वाभाविक यूनानी वाक्य-विन्यास को स्पष्ट हिन्दी वाक्यों में बदला गया।
