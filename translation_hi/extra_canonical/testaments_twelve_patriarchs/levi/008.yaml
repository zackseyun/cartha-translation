    4 पहले ने पवित्र तेल से मेरा अभिषेक किया और मुझे एक छड़ी दी। 5 दूसरे ने प्रभु के शुद्ध जल से मुझे धोया, मुझे पवित्र रोटी और दाखमधु खिलाया-पिलाया, और मुझे पवित्र तथा महिमामय चोगा पहनाया। 6 तीसरे ने मुझे सन का एक वस्त्र पहनाया, जो एपोद के समान था। 7 चौथे ने मेरी कमर पर बैंजनी रंग की पेटी जैसी पेटी बाँधी। 8 पाँचवें ने मुझे उत्तम जैतून की एक डाल दी। 9 छठे ने मेरे सिर पर मुकुट रखा। 10 सातवें ने मुझे याजकपद का राजमुकुट पहनाया और मेरे हाथ धूप से भर दिए, ताकि मैं प्रभु परमेश्वर के लिए याजक का काम करूँ।


