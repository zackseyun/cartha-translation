source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Τοτὲ ἀγαλλιάσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ, κἀγὼ χαρήσομαι⁷⁴, καὶ πάντες οἱ ἅγιοι ἐνδύσονται⁷⁵ δικαιοσύνην⁷⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/014.yaml
  text: Then Abraham and Isaac and Jacob will exult, and I will rejoice, and all the holy ones will put on righteousness.
translation:
  language: hi
  text: तब अब्राहम, इसहाक और याकूब उल्लसित होंगे, और मैं आनन्दित होऊँगा, और सभी पवित्र जन धार्मिकता का वस्त्र पहनेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: उल्लसित होंगे
  rationale: यह क्रिया प्रबल और उत्सवपूर्ण आनन्द व्यक्त करती है; संयुक्त कर्ताओं के कारण हिन्दी में बहुवचन रखा गया है।
- source_word: κἀγὼ χαρήσομαι
  choice: मैं भी आनन्दित होऊँगा
  rationale: κἀγώ में καί का अर्थ ‘भी’ स्पष्ट किया गया है, और χαρήσομαι के भविष्यकाल तथा आनन्द के भाव को सुरक्षित रखा गया है।
- source_word: οἱ ἅγιοι
  choice: पवित्र जन
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का स्वाभाविक हिन्दी रूप है; यह किसी विशिष्ट संस्थागत धार्मिक पदवी को आरोपित नहीं करता।
- source_word: ἐνδύσονται δικαιοσύνην
  choice: धार्मिकता को वस्त्र के समान धारण करेंगे
  rationale: ἐνδύω के वस्त्र पहनने वाले रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखा गया है; δικαιοσύνη को ‘धार्मिकता’ अनूदित किया गया है।
theological_decisions:
- issue: δικαιοσύνην का अर्थ और रूपक
  choice: धार्मिकता को वस्त्र के समान धारण करेंगे
  alternative: धार्मिकता धारण करेंगे / न्यायशीलता को पहनेंगे
  rationale: यूनानी में धार्मिकता या न्यायपरायणता को पहनने का रूपक है। चुना हुआ पाठ रूपक को बनाए रखते हुए हिन्दी पाठक के लिए उसका वस्त्र-संबंध स्पष्ट करता है और किसी विशिष्ट सैद्धान्तिक अर्थ तक इसे सीमित नहीं करता।
- issue: οἱ ἅγιοι की पहचान
  choice: सभी पवित्र जन
  alternative: सभी संत
  rationale: मूल पाठ इन लोगों की पहचान को और संकीर्ण नहीं करता। ‘पवित्र जन’ उसी व्यापकता को बचाता है और बाद की संस्थागत ‘संत’ पदवी का संकेत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘उल्लसित’ और ‘आनन्दित’ मूल की दो निकट, पर अलग आनन्द-सूचक क्रियाओं का अंतर बनाए रखते हैं। अर्धविराम वाक्य के तीन भविष्यकालीन खंडों को स्पष्ट करता है।
