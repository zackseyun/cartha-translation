reference: Testament of Levi 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνατελεῖ¹³ ἄστρον αὐτοῦ¹⁴ ἐν οὐρανῷ ὡς βασιλέως¹⁵ φωτίζων¹⁶ φῶς γνώσεως †ἐν ἡλίῳ ἡμέρα†¹⁷, καὶ μεγαλυνθήσεται ἐν τῇ οἰκουμένῃ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/003.yaml
  text: And his star will rise in heaven like a king, giving the light of knowledge like the sun by day, and he will be magnified in the inhabited world.
translation:
  language: hi
  text: और उसका तारा स्वर्ग में एक राजा के समान उदय होगा और दिन में सूर्य के समान ज्ञान का प्रकाश देगा; और वह सारे बसे हुए संसार में महान ठहराया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: उदय होगा
  rationale: भविष्यकालीन क्रिया का स्वाभाविक और सटीक हिन्दी रूप; तारे के प्रकट होने के संदर्भ में उपयुक्त।
- source_word: ἄστρον αὐτοῦ
  choice: उसका तारा
  rationale: सम्बन्धवाचक सर्वनाम की अस्पष्टता को मूल के अनुसार बनाए रखता है।
- source_word: ὡς βασιλέως
  choice: एक राजा के समान
  rationale: पाठ में तुलना का सम्बन्ध व्याकरणतः कुछ असामान्य है; हिन्दी में उसे बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखा गया है।
- source_word: φῶς γνώσεως
  choice: ज्ञान का प्रकाश
  rationale: मूल के संबंधकारक पदबंध का सीधा, स्वाभाविक और धार्मिक रूप से तटस्थ अनुवाद।
- source_word: μεγαλυνθήσεται
  choice: महान ठहराया जाएगा
  rationale: कर्मवाच्य भाव और प्रतिष्ठा/महिमा बढ़ाए जाने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: οἰκουμένῃ
  choice: सारे बसे हुए संसार
  rationale: शब्द का आशय आबाद अथवा मानव-निवास वाले विश्व से है; केवल 'संसार' की तुलना में यह अधिक स्रोत-संगत है।
theological_decisions:
- issue: तारे और महिमान्वित व्यक्ति का संदर्भ
  choice: दोनों स्थानों पर पुल्लिंग एकवचन सम्बन्ध को बिना पहचान निर्धारित किए रखा गया
  alternative: उसे स्पष्ट रूप से मसीहा या याजक कहना
  rationale: यूनानी पद स्वयं इस वाक्य में उस व्यक्ति की पहचान नहीं बताता; कोई संप्रदायगत पहचान जोड़ना अनुचित होगा।
- issue: ὡς βασιλέως का सम्बन्ध
  choice: “एक राजा के समान” को तारे के उदय से जुड़ी खुली तुलना के रूप में रखा
  alternative: “राजा का तारा” या “राजा के रूप में”
  rationale: मूल का संबंधकारक रूप कठिन है और एक से अधिक व्याख्याएँ सम्भव हैं; अनुवाद को अस्पष्टता पूरी तरह मिटानी नहीं चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। भ्रष्ट/संदिग्ध चिह्नित यूनानी खंड †ἐν ἡλίῳ ἡμέρα† को परामर्श-पाठ के अनुरूप “दिन में सूर्य के समान” रूप में स्वाभाविक किया गया है; अनावश्यक सिद्धान्तगत विस्तार नहीं जोड़ा गया।
