id: T12P.LEV.18.7
reference: Testament of Levi 18:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *δόξα ὑψίστου ἐπ’ αὐτὸν ῥηθήσεται⁴², καὶ πνεῦμα συνέσεως καὶ ἁγιασμοῦ⁴³ καταπαύσει *ἐπ’ αὐτόν⁴⁴ [ἐν τῷ ὕδατι].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/007.yaml
  text: And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him [in the water].
translation:
  language: hi
  text: और परमप्रधान की महिमा उसके ऊपर कही जाएगी, और समझ तथा पवित्रीकरण की आत्मा उस पर ठहरेगी [जल में]।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόξα ὑψίστου
  choice: परमप्रधान की महिमा
  rationale: यह पदबंध यूनानी मूल के संबंधसूचक अर्थ और ‘Most High’ की प्रतिष्ठित, सहज हिन्दी अभिव्यक्ति को बनाए रखता है।
- source_word: ἐπ’ αὐτὸν ῥηθήσεται
  choice: उसके विषय में घोषित की जाएगी
  rationale: शाब्दिक ‘उस पर कही जाएगी’ हिन्दी में अस्पष्ट और अस्वाभाविक है; ‘उसके विषय में घोषित’ कथन के सार्वजनिक/विधिवत उच्चारण का भाव देते हुए मूल की कर्मवाच्य रचना बनाए रखता है।
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  choice: समझ तथा पवित्रीकरण की आत्मा
  rationale: ‘समझ’ συνέσεως का सामान्य और सुबोध अर्थ है; ‘पवित्रीकरण’ ἁγιασμοῦ की प्रक्रिया/अवस्था संबंधी अस्पष्टता को ‘पवित्रता’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: καταπαύσει ἐπ’ αὐτόν
  choice: उस पर ठहरेगी
  rationale: यह भविष्यकाल तथा किसी पर आत्मा के टिकने/विश्राम करने की बाइबलीय छवि दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῷ ὕδατι
  choice: जल में
  rationale: कोष्ठक में प्राप्त पाठ को उसी संपादकीय अनिश्चितता के साथ संक्षेप और औपचारिक ढंग से प्रस्तुत किया गया है।
theological_decisions:
- issue: πνεῦμα का व्यक्तिवाचक या सामान्य अर्थ
  choice: आत्मा
  alternative: एक आत्मा / भाव
  rationale: यूनानी में निश्चित उपपद नहीं है, इसलिए पाठ स्वयं पूर्णतः स्पष्ट नहीं करता कि यह पवित्र आत्मा का विशिष्ट उल्लेख है या गुणदायी आत्मा का; हिन्दी में ‘आत्मा’ बिना अतिरिक्त व्याख्या के यह तनाव बनाए रखती है।
- issue: ἁγιασμός का अर्थ
  choice: पवित्रीकरण
  alternative: पवित्रता
  rationale: ‘पवित्रीकरण’ मूल संज्ञा की सक्रिय प्रक्रिया और पवित्र अवस्था, दोनों की संभाव्यता को अपेक्षाकृत अधिक सुरक्षित रखता है।
- issue: '[ἐν τῷ ὕδατι] की पाठगत स्थिति'
  choice: '[जल में]'
  alternative: जल में
  rationale: मूल संस्करण के वर्ग कोष्ठक पाठ की संदिग्ध या गौण पाठ-साक्ष्य स्थिति दर्शाते हैं; उन्हें हटाने से प्रमाणगत अनिश्चितता मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। मूल के कर्मवाच्य, भविष्यकाल और वर्ग-कोष्ठकीय पाठगत अनिश्चितता को सुरक्षित रखा गया है।
