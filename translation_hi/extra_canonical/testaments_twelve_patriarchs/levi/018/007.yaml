  verdict: revise
  source_fidelity: The draft correctly preserves the future passive sense, the two genitival qualities associated with πνεῦμα, and the bracketed status of ἐν τῷ ὕδατι. However, ἐπ’ αὐτόν with ῥηθήσεται is rendered in the English audit trail as “over him”; translating it as “उसके विषय में” shifts the spatial/ceremonial wording to a more explicitly referential sense.
  naturalness: The Hindi is otherwise clear, dignified, and idiomatic. “उसके ऊपर कही जाएगी” is somewhat formally literal but is the safest way to retain the source wording without supplying an interpretation.
  terminology: “परमप्रधान,” “महिमा,” “समझ,” “पवित्रीकरण,” and “आत्मा” are suitable modern-standard Hindi choices. “ठहरेगी” naturally conveys καταπαύσει in this context.
  issues:
  - severity: medium
    issue: ἐπ’ αὐτὸν ῥηθήσεται is translated as “उसके विषय में घोषित की जाएगी.”
    rationale: “उसके विषय में” means “concerning him” and “घोषित” adds a formal-public nuance not explicit in ῥηθήσεται. The Greek wording and the English audit trail retain “over/upon him.” A more source-near Hindi rendering should preserve that wording without resolving its precise idiomatic force.
  revised_text: और परमप्रधान की महिमा उसके ऊपर कही जाएगी, और समझ तथा पवित्रीकरण की आत्मा उस पर ठहरेगी [जल में]।
