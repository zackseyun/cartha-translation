id: T12P.LEV.18.2
reference: Testament of Levi 18:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ³ τότε ἐγερεῖ⁴ κύριος ἱερέα καινόν⁵, ᾧ⁶ πάντες οἱ λόγοι κυρίου⁷ ἀποκαλυφθήσονται⁸, καὶ αὐτὸς ποιήσει κρίσιν⁹ ἀληθείας¹⁰ ἐπὶ τῆς γῆς¹¹ *ἐν πλήθει¹² ἡμερῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/002.yaml
  text: Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute true judgment upon the earth for many days.
translation:
  language: hi
  text: तब प्रभु एक नए याजक को खड़ा करेगा, जिसे प्रभु के सभी वचन प्रकट किए जाएँगे; और वह बहुत दिनों तक पृथ्वी पर सच्चा न्याय करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερεῖ
  choice: खड़ा करेगा
  rationale: यह भविष्यकालीन क्रिया किसी व्यक्ति को नियुक्त या प्रकट करने के अर्थ में ‘उठाने/खड़ा करने’ को व्यक्त करती है; ‘खड़ा करेगा’ हिंदी में इस बाइबिलीय भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἱερέα καινόν
  choice: एक नए याजक
  rationale: ἱερεύς के लिए ‘याजक’ और καινός के लिए ‘नया’ सीधा तथा प्रचलित धार्मिक शब्द-चयन है।
- source_word: ἀποκαλυφθήσονται
  choice: प्रकट किए जाएँगे
  rationale: ग्रीक का भविष्यकालीन कर्मवाच्य सुरक्षित रखा गया है; वचन स्वयं स्पष्ट रूप से प्रकट किए जाने का भाव रखते हैं।
- source_word: κρίσιν ἀληθείας
  choice: सच्चा न्याय
  rationale: शाब्दिक ‘सत्य का न्याय’ की अपेक्षा यह संबंधवाचक पदबंध का स्वाभाविक हिंदी रूप है और न्याय की सत्यता/विश्वसनीयता व्यक्त करता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: पदबंध का सीधा स्थानवाचक अर्थ सुरक्षित है।
- source_word: ἐν πλήθει ἡμερῶν
  choice: बहुत दिनों तक
  rationale: शाब्दिक ‘दिनों की बहुतायत में’ का स्वाभाविक कालवाचक हिंदी रूप, दीर्घ अवधि को व्यक्त करता है।
theological_decisions:
- issue: ‘नए याजक’ की पहचान
  choice: पाठ के अनुसार पहचान को अनिर्दिष्ट रखा गया है
  alternative: किसी विशिष्ट मसीही, ऐतिहासिक या संस्थागत पदाधिकारी के रूप में स्पष्ट करना
  rationale: इस पद में याजक की पहचान नाम से नहीं दी गई; अनुवाद व्याख्यात्मक पहचान आरोपित नहीं करता।
- issue: ‘प्रभु के सभी वचन’ किस पर प्रकट होंगे
  choice: संबंधवाचक ᾧ को ‘जिस पर’ से व्यक्त किया गया
  alternative: ‘जिसे ... बताए जाएँगे’
  rationale: यह मूल के प्रकाशन-संबंधी कर्मवाच्य को बनाए रखता है और केवल सूचना देने तक अर्थ को सीमित नहीं करता।
- issue: κρίσιν ἀληθείας का स्वरूप
  choice: ‘सच्चा न्याय’
  alternative: ‘सत्य का न्याय’ या ‘धर्ममय न्याय’
  rationale: ‘सच्चा न्याय’ मूल के गुणसूचक संबंध को स्वाभाविक ढंग से व्यक्त करता है; ‘धर्ममय’ अतिरिक्त नैतिक-धार्मिक व्याख्या जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘याजक’, ‘प्रकट’ और ‘न्याय’ जैसे स्थापित बाइबिलीय शब्द रखे गए हैं; वाक्य-रचना मूल ग्रीक के दो समन्वित खंडों को सुरक्षित रखती है।
