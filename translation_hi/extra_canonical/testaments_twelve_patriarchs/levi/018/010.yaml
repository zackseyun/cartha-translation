  text: And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam.
translation:
  language: hi
  text: और निश्चय ही वह परादीस के द्वार खोलेगा और आदम के विरुद्ध धमकाती तलवार को हटा देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: और निश्चय ही
  rationale: γε के बलाघात को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παραδείσου
  choice: स्वर्गलोक
  rationale: यहाँ आदम और तलवार के संकेत के कारण आशय अदन की वाटिका-सदृश दिव्य स्थान से है; ‘स्वर्गलोक’ सामान्य पाठक के लिए स्पष्ट रहते हुए धार्मिक गरिमा बनाए रखता है।
- source_word: ἀποστήσει
  choice: हटा देगा
  rationale: क्रिया का मूल भाव किसी वस्तु को उसके स्थान या मार्ग से दूर कर देना है।
- source_word: τὴν ἀπειλοῦσαν ῥομφαίαν
  choice: धमकाती तलवार
  rationale: वर्तमान कृदंत का सक्रिय, भयकारी भाव बनाए रखता है; ῥομφαία के लिए सहज हिन्दी ‘तलवार’ उपयुक्त है।
- source_word: κατὰ τοῦ Ἀδάμ
  choice: आदम की ओर तनी हुई
  rationale: κατά का विरोधात्मक/दिशात्मक संबंध स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह तय किए कि तलवार आदम पर वार कर रही है या उसका मार्ग रोक रही है।
theological_decisions:
- issue: आदम के संबंध में तलवार की भूमिका
  choice: आदम की ओर तनी हुई धमकाती तलवार
  alternative: आदम के विरुद्ध धमकाने वाली तलवार
  rationale: यूनानी κατά विरोध या दिशा दोनों का संकेत दे सकता है। चुना हुआ रूप उस तनाव को बनाए रखता है और अनावश्यक रूप से किसी विशिष्ट व्याख्या को निश्चित नहीं करता।
- issue: παράδεισος का स्थानगत अर्थ
  choice: स्वर्गलोक
  alternative: परादीस / अदन की वाटिका
  rationale: पाठ केवल ‘परादीस’ कहता है; ‘अदन की वाटिका’ कहना निहित संकेत को स्पष्ट नाम देकर मूल से अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई।
