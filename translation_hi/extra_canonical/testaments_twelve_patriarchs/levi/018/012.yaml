  text: Καὶ ὁ Βελίαρ δεθήσεται ὑπ᾿ αὐτοῦ, καὶ δώσει ἐξουσίαν τοῖς τέκνοις αὐτοῦ⁶⁹ πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/012.yaml
  text: And Beliar will be bound by him, and he will give authority to his children to trample on the evil spirits.
translation:
  language: hi
  text: और बेलियार उसके द्वारा बाँधा जाएगा, और वह अपनी संतानों को दुष्ट आत्माओं को पैरों तले रौंदने का अधिकार देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βελίαρ
  choice: बलियार
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण; इसे किसी व्याख्यात्मक उपाधि से नहीं बदला गया।
- source_word: δεθήσεται ὑπ᾿ αὐτοῦ
  choice: उसके द्वारा बाँधा जाएगा
  rationale: भविष्यकालीन कर्मवाच्य और अस्पष्ट पुरुषवाचक संदर्भ को मूल के अनुसार सुरक्षित रखा गया।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: प्रदान की गई सामर्थ्य और वैध अधिकार—दोनों के भाव को व्यक्त करने वाला स्वाभाविक हिन्दी शब्द।
- source_word: τοῖς τέκνοις αὐτοῦ
  choice: अपनी संतानों को
  rationale: τέκνοις के वंशज/संतान संबंधी व्यापक अर्थ को रखा गया; हिन्दी में कर्ता-संबंध स्पष्ट करने के लिए ‘अपनी’ स्वाभाविक है।
- source_word: πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα
  choice: दुष्ट आत्माओं को पैरों तले रौंदने
  rationale: मुहावरे की विजय और अधीनता की सशक्त छवि को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप दिया गया।
theological_decisions:
- issue: दोनों पुरुषवाचक सर्वनामों का संदर्भ
  choice: ‘उसके द्वारा’ और ‘वह’ के रूप में संदर्भ खुला रखा गया
  alternative: संदर्भित मसीही/याजकीय व्यक्ति का नाम स्पष्ट रूप से जोड़ना
  rationale: यूनानी पाठ αὐτοῦ के संदर्भ को इस पद में नाम से स्पष्ट नहीं करता; अनुवाद में पहचान जोड़ना मूल की वास्तविक संदर्भगत अस्पष्टता को समाप्त कर देता।
- issue: ‘उसकी संतानें’ का स्वरूप
  choice: ‘संतानों’
  alternative: ‘बच्चों’, ‘अनुयायियों’ या ‘विश्वासियों’
  rationale: τέκνα का रूपक अथवा जैविक आशय संदर्भ से निर्धारित हो सकता है; ‘संतानें’ दोनों संभावनाओं को अपेक्षाकृत खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। वाक्य की समांतर संरचना तथा भविष्यकालीन भविष्यवाणी का स्वर सुरक्षित रखा गया है।
