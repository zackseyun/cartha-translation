  text: Καὶ¹ μετὰ τὸ γενέσθαι τὴν ἐκδίκησιν αὐτῶν παρὰ κυρίου, *ἐκλείψει ἡ ἱερωσύνη².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/001.yaml
  text: And after their vengeance has come from the Lord, the priesthood will fail.
translation:
  language: hi
  text: और उनके दण्ड का प्रभु की ओर से होने के बाद, याजकाई लुप्त हो जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: दण्ड
  rationale: यहाँ शब्द का आशय प्रभु की ओर से किए गए प्रतिकार अथवा न्याय-दण्ड से है; आधुनिक हिन्दी में “उनका दण्ड” प्रसंग को स्वाभाविक और स्पष्ट रखता है।
- source_word: παρὰ κυρίου
  choice: प्रभु की ओर से
  rationale: यूनानी पद दण्ड के स्रोत को प्रभु बताता है; यह अनुवाद उस संबंध को सीधे सुरक्षित रखता है।
- source_word: ἐκλείψει
  choice: समाप्त हो जाएगी
  rationale: क्रिया का अर्थ चूक जाना, लुप्त होना या समाप्त होना हो सकता है; याजकाई के संदर्भ में “समाप्त हो जाएगी” सहज है और निश्चित भविष्यकाल को बनाए रखता है।
- source_word: ἡ ἱερωσύνη
  choice: याजकाई
  rationale: यह पद याजक के पद, व्यवस्था या संस्था का बोध कराता है; “याजकाई” संक्षिप्त और प्रचलित बाइबलीय हिन्दी है।
theological_decisions:
- issue: दण्ड किस पर है और उसका स्वरूप क्या है
  choice: उनका दण्ड
  alternative: उनका प्रतिशोध
  rationale: αὐτῶν संबंध की कुछ गुंजाइश रखता है, पर वाक्य में प्रभु से आने वाली ἐκδίκησις को हिन्दी में “दण्ड” कहना ईश्वरीय न्याय का अर्थ देता है और ऐसा नहीं दर्शाता कि प्रभु उनके निजी बदले को पूरा कर रहे हैं।
- issue: याजकाई के लुप्त होने की तीव्रता
  choice: समाप्त हो जाएगी
  alternative: विफल हो जाएगी / लुप्त हो जाएगी
  rationale: ἐκλείψει का भविष्यकाल निर्णायक क्षय या अंत व्यक्त कर सकता है। “समाप्त” किसी विशेष उत्तराधिकारी व्यवस्था या संप्रदायगत निष्कर्ष को जोड़े बिना मूल कथन की गंभीरता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की क्रमबद्धता—पहले प्रभु से दण्ड का पूरा होना, फिर याजकाई का अंत—मूल यूनानी के अनुरूप रखी गई है।
