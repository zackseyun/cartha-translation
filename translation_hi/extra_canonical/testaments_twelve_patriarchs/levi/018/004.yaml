  text: He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth.
translation:
  language: hi
  text: वह पृथ्वी पर सूर्य के समान चमक उठेगा, और आकाश के नीचे से सारा अंधकार दूर कर देगा, और सारी पृथ्वी पर शांति होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: चमक उठेगा
  rationale: भविष्यकालीन क्रिया के प्रकट होकर तेज से चमकने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξαρεῖ
  choice: दूर कर देगा
  rationale: अंधकार को पूरी तरह हटा देने के अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह सामान्य और गरिमापूर्ण हिन्दी शब्द व्यक्तिगत तथा व्यापक शांति—दोनों की अर्थ-सम्भावना बनाए रखता है।
theological_decisions:
- issue: कर्ता की पहचान
  choice: वह
  alternative: यह व्यक्ति
  rationale: ग्रीक Οὗτος का संदर्भसूचक पुरुषवाचक अर्थ रखा गया है, पर इस पद में उसकी पहचान को अतिरिक्त उपाधि देकर निश्चित नहीं किया गया।
- issue: सूर्य से तुलना
  choice: सूर्य के समान
  alternative: सूर्य की तरह
  rationale: ὡς की स्पष्ट उपमा को बनाए रखते हुए गरिमापूर्ण, सहज अभिव्यक्ति चुनी गई है; व्यक्ति को स्वयं सूर्य नहीं कहा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, प्रवाहपूर्ण और गरिमापूर्ण शैली। ग्रीक की तीन समन्वित भविष्यकालीन उक्तियों और सार्वभौमिक विस्तार को बनाए रखा गया है।
