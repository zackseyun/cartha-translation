reference: Testament of Levi 18:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εὐφρανθήσεται κύριος ἐπὶ τοῖς τέκνοις αὐτοῦ⁷⁰, καὶ εὐδοκήσει⁷¹ ἐπὶ *τοῖς ἀγαπητοῖς⁷² αὐτοῦ *ἕως αἰῶνος⁷³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/013.yaml
  text: And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever.
translation:
  language: hi
  text: और प्रभु अपनी सन्तान पर आनन्दित होगा, और अपने प्रिय जनों से सदा प्रसन्न रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφρανθήσεται
  choice: आनन्दित होगा
  rationale: भविष्यकालीन अकर्मक भाव ‘आनन्दित होगा’ यूनानी क्रिया के अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τέκνοις
  choice: सन्तान
  rationale: यह बहुवचन-सामूहिक अर्थ को समेटता है और प्रभु से उनके सम्बन्ध को स्पष्ट रखता है।
- source_word: εὐδοκήσει
  choice: प्रसन्न रहेगा
  rationale: ἐπί के साथ प्रयुक्त क्रिया यहाँ किसी से प्रसन्न होने अथवा उसमें आनन्द लेने का भाव देती है; ‘प्रसन्न रहेगा’ सतत सकारात्मक अनुग्रह को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἀγαπητοῖς
  choice: प्रिय जनों
  rationale: विशेषण का संज्ञात्मक प्रयोग है; ‘प्रिय जनों’ लिंग-समावेशी है और ‘beloved ones’ का स्वाभाविक हिन्दी रूप है।
- source_word: ἕως αἰῶνος
  choice: सदा
  rationale: मुहावरे का कालगत अर्थ ‘सदैव/युगानुयुग’ है; इस वाक्य में ‘सदा’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ‘सन्तान’ और ‘प्रिय जनों’ का परस्पर सम्बन्ध
  choice: दोनों पदों को समानान्तर किन्तु अलग अभिव्यक्तियों के रूप में रखा गया है।
  alternative: ‘अपनी प्रिय सन्तान’ कहकर दोनों को एक ही समूह का संयुक्त वर्णन बनाना।
  rationale: यूनानी पाठ दो अलग समानान्तर पदबंध देता है; उन्हें मिला देना पाठ की काव्यात्मक पुनरुक्ति और सम्भावित अर्थ-भेद को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और धर्मग्रन्थीय लय। ‘सन्तान’ तथा ‘प्रिय जनों’ से मूल का समानान्तर विन्यास सुरक्षित रखा गया है।
