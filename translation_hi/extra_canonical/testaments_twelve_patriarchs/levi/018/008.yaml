reference: Testament of Levi 18:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Αὐτὸς γὰρ⁴⁵ δώσει τὴν μεγαλωσύνην⁴⁶ κυρίου⁴⁷ τοῖς υἱοῖς αὐτοῦ⁴⁸ ἐν ἀληθείᾳ εἰς τὸν αἰῶνα, καὶ οὐκ ἔσται διαδοχὴ⁴⁹ αὐτοῦ⁵⁰ εἰς γενεὰς *καὶ γενεὰς⁵¹ ἕως τοῦ αἰῶνος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/008.yaml
  text: For he will give the majesty of the Lord to his sons in truth forever, and there will be no succession to him for generations and generations, until eternity.
translation:
  language: hi
  text: क्योंकि वह अपने पुत्रों को सच्चाई के साथ प्रभु की महिमा सदा के लिए देगा, और पीढ़ियों और पीढ़ियों तक, अनंतकाल तक, उसके लिए कोई उत्तराधिकार नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγαλωσύνην κυρίου
  choice: प्रभु का प्रताप
  rationale: ‘μεγαλωσύνη’ महानता, महिमा या राजसी वैभव का बोध करा सकता है; ‘प्रताप’ यहाँ गरिमामय और स्वाभाविक हिन्दी में इस अर्थ-क्षेत्र को व्यक्त करता है।
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: अपने पुत्रों को
  rationale: सर्वनाम का कर्ता से संबंध स्वाभाविक हिन्दी में ‘अपने’ द्वारा स्पष्ट होता है; ‘पुत्रों’ मूल के लिंग-विशिष्ट शब्द को बनाए रखता है।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई में
  rationale: मूल की संरचना और संभावित अर्थगत व्यापकता को बनाए रखता है; इसे केवल ‘सचमुच’ या ‘विश्वासयोग्यता से’ बनाकर अर्थ सीमित नहीं किया गया।
- source_word: διαδοχὴ αὐτοῦ
  choice: उसका ... उत्तराधिकार
  rationale: διαδοχή यहाँ किसी व्यक्ति मात्र ‘उत्तराधिकारी’ से अधिक उत्तराधिकार या पद-क्रम की धारणा व्यक्त करता है; इसलिए अमूर्त संज्ञा रखी गई।
- source_word: εἰς γενεὰς καὶ γενεὰς ἕως τοῦ αἰῶνος
  choice: पीढ़ी-दर-पीढ़ी, अनंतकाल तक
  rationale: दोहराव का भाव स्वाभाविक हिन्दी मुहावरे में रखा गया और ἕως का ‘तक’ अलग से व्यक्त किया गया।
theological_decisions:
- issue: ‘उसका’ का संदर्भ
  choice: सर्वनाम को ‘उसका’ ही रखा गया
  alternative: इसे स्पष्ट करके ‘उस याजक/मसीहा का’ कहना
  rationale: निकटवर्ती संदर्भ के बिना αὐτοῦ का संकेत पूरी तरह निर्विवाद नहीं है; अनुवाद में किसी विशिष्ट धर्मवैज्ञानिक पहचान को आरोपित नहीं किया गया।
- issue: ‘उत्तराधिकार नहीं होगा’ का आशय
  choice: मूल की अमूर्त और कुछ असामान्य अभिव्यक्ति सुरक्षित रखी गई
  alternative: ‘उसका कोई उत्तराधिकारी नहीं होगा’
  rationale: मूल διαδοχή ‘उत्तराधिकारी’ नहीं बल्कि उत्तराधिकार/अनुक्रम है; इसे व्यक्तिगत उत्तराधिकारी में बदलने से अर्थ अधिक निश्चित हो जाता।
- issue: कालगत दो अभिव्यक्तियाँ
  choice: ‘सदा के लिए’ और ‘अनंतकाल तक’ दोनों रखीं
  alternative: दोनों को मिलाकर केवल ‘सदा’ कहना
  rationale: मूल में εἰς τὸν αἰῶνα और ἕως τοῦ αἰῶνος दोनों उपस्थित हैं; उनकी तनावपूर्ण पुनरावृत्ति को हटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। वाक्य-संरचना को हिन्दी के अनुरूप बनाया गया, जबकि मूल की पुनरावृत्ति, अमूर्त ‘उत्तराधिकार’ और सर्वनामगत अस्पष्टता सुरक्षित रखी गई है।
