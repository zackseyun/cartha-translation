source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δώσει τοῖς ἁγίοις φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, καὶ *πνεῦμα ἁγιωσύνης ἔσται⁶⁷ ἐπ᾿ αὐτοῖς⁶⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/011.yaml
  text: And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them.
translation:
  language: hi
  text: और वह पवित्र जनों को जीवन के वृक्ष में से खाने को देगा, और पवित्रता की आत्मा उन पर होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों को
  rationale: विशेषण के संज्ञात्मक बहुवचन प्रयोग को सहज हिन्दी में व्यक्त करता है और उनकी पहचान को किसी विशिष्ट पद या वर्ग तक सीमित नहीं करता।
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: जीवन के वृक्ष में से
  rationale: ἐκ के स्रोत-बोध और बाइबलीय प्रतीक ‘जीवन का वृक्ष’ को निकटता से सुरक्षित रखता है।
- source_word: πνεῦμα ἁγιωσύνης
  choice: पवित्रता की आत्मा
  rationale: ἁγιωσύνης को गुणसूचक भाववाचक संज्ञा के रूप में रखा गया है; इसे सीधे ‘पवित्र आत्मा’ करने से मूल की विशिष्ट अभिव्यक्ति और संभावित अर्थ-तनाव मिट जाता।
- source_word: ἐπ᾿ αὐτοῖς
  choice: उन पर
  rationale: स्थानिक/संबंधपरक रूपक को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: πνεῦμα ἁγιωσύνης की पहचान
  choice: पवित्रता की आत्मा
  alternative: पवित्र आत्मा
  rationale: यूनानी पाठ में सामान्य पद πνεῦμα ἅγιον नहीं, बल्कि संबंधकारक ἁγιωσύνης है। इसलिए अनुवाद जानबूझकर यह तय नहीं करता कि यहाँ स्पष्ट रूप से परमेश्वर के पवित्र आत्मा का व्यक्तिवाचक उल्लेख है या पवित्रता प्रदान करने वाली आत्मा/आत्मिक दशा का।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मूल की समानांतर वाक्य-रचना के निकट है। ‘खाने को देगा’ को रखा गया है ताकि δίδωμι + infinitive की अनुमति/प्रदान करने वाली संरचना स्पष्ट रहे।
