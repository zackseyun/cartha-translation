source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οἱ οὐρανοὶ ἀγαλλιάσονται²⁴ ἐν ταῖς ἡμέραις αὐτοῦ²⁵, καὶ ἡ γῆ χαρήσεται²⁶, καὶ αἱ²⁷ †νεφέλαι²⁸ εὐφρανθήσονται²⁹. [καὶ ἡ γνῶσις κυρίου³⁰ ἐκχυθήσεται³¹ ἐπὶ τῆς γῆς ὡς³² ὕδωρ θαλασσῶν³³] *καὶ οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου εὐφρανθήσονται ἐν αὐτῷ³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/005.yaml
  text: The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; [and the knowledge of the Lord will be poured out upon the earth like the water of the seas;] and the angels of the glory of the Lord's presence will be glad in him.
translation:
  language: hi
  text: उसके दिनों में आकाश आनन्दित होगा, और पृथ्वी प्रसन्न होगी, और बादल हर्षित होंगे।[a] [और प्रभु का ज्ञान पृथ्वी पर ऐसा उण्डेला जाएगा, जैसे समुद्रों का जल;][b] और प्रभु की उपस्थिति की महिमा के स्वर्गदूत उसमें आनन्दित होंगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बादल’ के लिए यूनानी शब्द स्रोत संस्करण में † चिह्न के साथ दिया गया है, जो इस शब्द के पाठ या पाठस्थिति में संपादकीय कठिनाई का संकेत है।
    reason: स्रोत-पाठ के † चिह्न को पारदर्शी ढंग से दर्शाना आवश्यक है; मुख्य पाठ में अर्थानुवाद अपरिवर्तित रखा गया है।
  - marker: b
    text: कोष्ठकों में दिया गया वाक्यांश यूनानी पाठ-परंपरा में पाठ-संदिग्ध अथवा गौण रूप से संप्रेषित अंश के रूप में चिह्नित है।
    reason: स्रोत संस्करण के वर्ग कोष्ठक पाठगत अनिश्चितता दर्शाते हैं।
  - marker: c
    text: ‘प्रभु की उपस्थिति की महिमा के स्वर्गदूत’ का यूनानी वाक्यांश अत्यंत संक्षिप्त है; इसका अर्थ ‘प्रभु की महिमामय उपस्थिति के स्वर्गदूत’ भी समझा जा सकता है।
    reason: संबंधकारकों की शृंखला में वास्तविक व्याकरणिक/अर्थगत अस्पष्टता है, जिसे मुख्य पाठ में एक ही अर्थ से पूरी तरह सुलझाना उचित नहीं।
lexical_decisions:
- source_word: οἱ οὐρανοί
  choice: आकाश
  rationale: यूनानी बहुवचन का आशय ऊर्ध्वलोकों से हो सकता है; हिन्दी में सामूहिक अर्थ वाला ‘आकाश’ सहज और गरिमापूर्ण है। बहुवचन क्रिया ‘मनाएँगे’ मूल के बहुवचन संकेत को कुछ हद तक बनाए रखती है।
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: उसके दिनों में
  rationale: मूल की अनिश्चित पुरुषवाचक संदर्भता को बिना स्पष्ट किए ज्यों का त्यों रखा गया है।
- source_word: νεφέλαι
  choice: बादल
  rationale: पाठ-संदिग्ध चिह्नित यूनानी संज्ञा का सीधा और स्वाभाविक अर्थ।
- source_word: ἡ γνῶσις κυρίου
  choice: प्रभु का ज्ञान
  rationale: यह वाक्यांश प्रभु के विषय में ज्ञान अथवा प्रभु से प्राप्त ज्ञान—दोनों अर्थ दे सकता है; हिन्दी संबंधकारक वही वास्तविक अस्पष्टता बनाए रखता है।
- source_word: ἐκχυθήσεται
  choice: उण्डेला जाएगा
  rationale: द्रव के समान व्यापक रूप से फैलाए जाने की मूल रूपकात्मक छवि सुरक्षित रखी गई है।
- source_word: ὡς ὕδωρ θαλασσῶν
  choice: जैसे समुद्रों का जल
  rationale: यूनानी बहुवचन ‘समुद्रों’ को बनाए रखते हुए तुलना का औपचारिक रूप सुरक्षित है।
- source_word: οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου
  choice: प्रभु की उपस्थिति की महिमा के स्वर्गदूत
  rationale: πρόσωπον का शाब्दिक अर्थ ‘मुख’ है, पर दिव्य संदर्भ में ‘उपस्थिति’ स्वाभाविक है। संबंधकारकों की कठिन शृंखला को जानबूझकर अधिक व्याख्यायित नहीं किया गया।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: मूल का संदर्भ अस्पष्ट है—यह उस व्यक्ति में, उसके कारण, या उसके संबंध में आनन्दित होने का भाव दे सकता है; ‘उसमें’ उस तनाव को बनाए रखता है।
theological_decisions:
- issue: ‘उसके’ और ‘उसमें’ का व्यक्ति-संदर्भ
  choice: अस्पष्ट सर्वनाम बनाए रखे गए
  alternative: उसे ‘याजक’, ‘मसीह’ अथवा किसी अन्य पदनाम से स्पष्ट करना
  rationale: इस पद में स्वयं नामित पूर्वपद नहीं है; किसी निश्चित पहचान को जोड़ना पाठ से आगे जाकर व्याख्या थोपता।
- issue: प्रभु के ज्ञान का स्वरूप
  choice: ‘प्रभु का ज्ञान’
  alternative: ‘प्रभु के विषय का ज्ञान’ या ‘प्रभु द्वारा दिया गया ज्ञान’
  rationale: यूनानी संबंधकारक दोनों संभावनाएँ खुली रखता है, इसलिए हिन्दी में भी अस्पष्टता सुरक्षित है।
- issue: स्वर्गदूतों और महिमा/उपस्थिति का संबंध
  choice: संबंधकारक शृंखला को निकट रूप में रखा
  alternative: ‘वे महिमामय स्वर्गदूत जो प्रभु की उपस्थिति में रहते हैं’
  rationale: विस्तारित विकल्प एक संभावित व्याख्या को निश्चित कर देता; मूल वाक्यांश की संक्षिप्त और घनी संरचना अधिक उपयुक्त है।
