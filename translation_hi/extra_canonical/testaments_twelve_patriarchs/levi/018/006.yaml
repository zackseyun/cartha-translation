base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/006.yaml
  text: The heavens will be opened, and from the temple of glory holiness will come upon him with a fatherly voice, as from Abraham to Isaac.
translation:
  language: hi
  text: स्वर्ग खुल जाएंगे, और महिमा के मंदिर से पवित्रता पिता की-सी वाणी के साथ उस पर आएगी, जैसे अब्राहम से इसहाक के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοὶ
  choice: आकाश
  rationale: बहुवचन यूनानी पद स्वर्गीय आकाशों की ओर संकेत कर सकता है; आधुनिक हिन्दी में सामूहिक अर्थ वाला ‘आकाश’ अधिक स्वाभाविक है।
- source_word: ἀνοιγήσονται
  choice: खोल दिए जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य को स्पष्ट रखते हुए ईश्वरीय कर्ता को अनकहा छोड़ा गया है।
- source_word: ναοῦ τῆς δόξης
  choice: महिमा के मंदिर
  rationale: संबंधवाचक यूनानी संरचना का निकट और गरिमापूर्ण रूप।
- source_word: ἁγίασμα
  choice: पवित्रता
  rationale: यहाँ वस्तु या प्रक्रिया को अनावश्यक रूप से निश्चित किए बिना पवित्रता/पवित्र प्रभाव का भाव सुरक्षित रहता है।
- source_word: φωνῆς πατρικῆς
  choice: पिता की-सी वाणी
  rationale: πατρικός के विशेषणात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; इसे सीधे परमेश्वर की वाणी मानकर तनाव को हल नहीं करता।
- source_word: ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ
  choice: जैसे अब्राहम की ओर से इसहाक के लिए
  rationale: ἀπό और πρός के दिशात्मक संबंध को बनाए रखा गया है, यद्यपि मूल में संकेत संक्षिप्त और कुछ अस्पष्ट है।
theological_decisions:
- issue: ἁγίασμα का स्वरूप
  choice: पवित्रता
  alternative: पवित्रीकरण
  rationale: मूल संज्ञा पवित्र वस्तु, पवित्रता या पवित्रीकरण-संबंधी अर्थ दे सकती है। ‘पवित्रता’ स्रोत की व्यापकता और अंग्रेज़ी परामर्श-पाठ की संशोधित समझ दोनों को सुरक्षित रखती है।
- issue: पिता-संबंधी वाणी की पहचान
  choice: पिता की-सी वाणी
  alternative: पिता की वाणी
  rationale: विशेषण πατρικῆς को सीधे किसी विशिष्ट दिव्य वक्ता की पहचान में बदलने से बचते हुए पितृसुलभ गुण व्यक्त किया गया है।
- issue: अब्राहम और इसहाक की उपमा
  choice: जैसे अब्राहम की ओर से इसहाक के लिए
  alternative: जैसे अब्राहम ने इसहाक से कहा था
  rationale: मूल में कोई स्पष्ट क्रिया या उद्धृत कथन नहीं है; इसलिए किसी खास उत्पत्ति-वृत्तांत या कथन को आयात नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। अर्धविराम वाणी और पवित्रता के संयुक्त आगमन को पठनीय बनाता है, जबकि मूल की संक्षिप्त उपमा और उसकी अस्पष्टता बनी रहती है।
