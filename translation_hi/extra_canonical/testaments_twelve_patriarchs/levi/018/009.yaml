id: T12P.LEV.18.9
reference: Testament of Levi 18:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐπὶ *τῆς ἱερωσύνης⁵² αὐτοῦ⁵³ *τὰ ἔθνη⁵⁴ πληθυνθήσονται⁵⁵ ἐν γνώσει ἐπὶ τῆς γῆς, καὶ φωτισθήσονται διὰ χάριτος κυρίου. [ὁ δὲ Ἰσραὴλ ἐλαττωθήσεται ἐν ἀγνωσίᾳ καὶ σκοτισθήσεται ἐν πένθει]⁵⁶. ἐπὶ τῆς ἱερωσύνης αὐτοῦ ἐκλείψει⁵⁷ ἡ⁵⁸ ἁμαρτία καὶ οἱ ἄνομοι *καταπαύσουσιν εἰς κακά⁵⁹, [οἱ δὲ δίκαιοι καταπαύσουσιν ἐν αὐτῷ]⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/009.yaml
  text: And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. [But Israel will be diminished in ignorance and darkened in mourning.] During his priesthood sin will cease, and the lawless will cease from evil; [and the righteous will rest in him].
translation:
  language: hi
  text: और उसकी याजकाई के समय पृथ्वी पर जातियाँ ज्ञान में बढ़ेंगी और प्रभु के अनुग्रह से प्रकाश पाएँगी। [पर इस्राएल अज्ञान में घटता जाएगा और शोक में अंधकारमय हो जाएगा।][a] उसकी याजकाई के समय पाप समाप्त हो जाएगा और अधर्मी बुराई करना छोड़ देंगे; [और धर्मी उसमें विश्राम पाएँगे।][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त यूनानी संस्करण इस वाक्य को कोष्ठकों में रखता है, जो इसकी पाठगत स्थिति के विषय में अनिश्चितता दर्शाता है।
    reason: स्रोत संस्करण में [ὁ δὲ Ἰσραὴλ … ἐν πένθει] कोष्ठकबद्ध है।
  - marker: b
    text: प्रदत्त यूनानी संस्करण इस अंतिम वाक्यांश को भी कोष्ठकों में रखता है, जो इसकी पाठगत स्थिति के विषय में अनिश्चितता दर्शाता है।
    reason: स्रोत संस्करण में [οἱ δὲ δίκαιοι … ἐν αὐτῷ] कोष्ठकबद्ध है।
lexical_decisions:
- source_word: ἱερωσύνης
  choice: याजकाई
  rationale: यह शब्द याजक के पद, सेवा और कार्यकाल को समेटता है; संदर्भ में “उसकी याजकाई के समय” स्वाभाविक और अर्थ-सटीक है।
- source_word: τὰ ἔθνη πληθυνθήσονται ἐν γνώσει
  choice: जातियाँ ज्ञान में बढ़ेंगी
  rationale: πληθυνθήσονται का मूल भाव बढ़ने या बहुगुणित होने का है। “ज्ञान में बढ़ेंगी” असामान्य किंतु सार्थक यूनानी अभिव्यक्ति को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: φωτισθήσονται διὰ χάριτος κυρίου
  choice: प्रभु के अनुग्रह से प्रकाश पाएँगी
  rationale: कर्मवाच्य φωτισθήσονται और माध्यमसूचक διὰ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκλείψει ἡ ἁμαρτία
  choice: पाप समाप्त हो जाएगा
  rationale: ἐκλείψει यहाँ चुक जाने, लुप्त होने या समाप्त होने का भाव देता है; “समाप्त हो जाएगा” आधुनिक हिन्दी में स्पष्ट है।
- source_word: οἱ ἄνομοι καταπαύσουσιν εἰς κακά
  choice: अधर्मी बुराई करना छोड़ देंगे
  rationale: यूनानी वाक्यांश कुछ असामान्य है, पर संदर्भ में बुराई से रुकने का आशय सबसे स्वाभाविक है। यह अनुवाद उसे संप्रदायगत विस्तार के बिना व्यक्त करता है।
- source_word: καταπαύσουσιν ἐν αὐτῷ
  choice: उसमें विश्राम पाएँगे
  rationale: καταπαύω के विश्राम करने और ἐν αὐτῷ के “उसमें” भाव को बनाए रखता है।
theological_decisions:
- issue: जातियों का “ज्ञान में बढ़ना”
  choice: रूपक को यथावत रखते हुए “जातियाँ ज्ञान में बढ़ेंगी”
  alternative: “जातियों में ज्ञान बहुत बढ़ जाएगा”
  rationale: वैकल्पिक पाठ अधिक सहज है, पर वह बढ़ने का व्याकरणिक कर्ता जातियों से बदलकर ज्ञान को बना देता है।
- issue: धर्मियों का “उसमें” विश्राम
  choice: पुरुषवाचक सर्वनाम को “उसमें” के रूप में बनाए रखा
  alternative: “उस याजक में विश्राम पाएँगे”
  rationale: मूल पाठ केवल αὐτῷ कहता है। स्पष्ट संज्ञा जोड़ने से संभावित संकेत का अनावश्यक निर्धारण हो जाता।
- issue: इस्राएल के घटने और अंधकारमय होने वाला खंड
  choice: खंड को कोष्ठकों और पाठालोचनात्मक टिप्पणी सहित रखा
  alternative: खंड को मुख्य पाठ से निकाल देना
  rationale: प्रदत्त यूनानी संस्करण इसे कोष्ठकबद्ध करता है; इसे हटाने के बजाय उसकी पाठगत स्थिति दिखाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध धार्मिक गद्य अपनाया गया है। “याजकाई,” “अनुग्रह,” “अधर्मी” और “धर्मी” जैसे प्रचलित बाइबिलीय शब्द रखे गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए सहज बनाया गया है।
