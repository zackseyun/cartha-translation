  text: 1. And Gersam took a wife, and by her he fathered Lomne and Semee. 2. And the sons of Kaath were Ambram, Isachar, Chebron, and Ozeel. 3. And the sons of Merari were Mooli and Mouses. 4. And in the sixty-fourth year of my life, Ambram took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt. 6. And behold, my children, you are the third generation. 7. Joseph died in the one hundred eighteenth year of my life.
translation:
  language: hi
  text: 'लेवी का वसीयतनामा 12


    1. गेरसाम ने विवाह किया, और उससे लोम्ने और सेमेई को जन्म दिया। 2. काआथ के पुत्र अब्राआम, इसाखार, खेब्रोन और ओज़ीएल थे।[a] 3. मेरारेई के पुत्र मोओली और मोउसेस थे।[b] 4. मेरे जीवन के चौरानवेवें वर्ष में अब्राआम ने मेरी बेटी योखाबेद को अपनी पत्नी के रूप में लिया, क्योंकि वह और मेरी बेटी एक ही दिन पैदा हुए थे।[c] 5. जब मैं कनान देश में आया, तब मैं आठ वर्ष का था; जब मैंने सुखेम को मार डाला, तब मैं अठारह वर्ष का था; जब मैंने पुरोहित के रूप में सेवा की, तब मैं उन्नीस वर्ष का था; जब मैंने विवाह किया, तब मैं अट्ठाईस वर्ष का था; और जब मैं मिस्र आया, तब मैं अड़तालीस वर्ष का था।[d] 6. और देखो, मेरे बच्चो, तुम तीसरी पीढ़ी हो। 7. मेरे जीवन के एक सौ अठारहवें वर्ष में योसेफ की मृत्यु हुई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी साक्षी में ये नाम अधिक परिचित बाइबिलीय वर्तनी से भिन्न रूपों में मिलते हैं; यहाँ उन्हें किसी दूसरी वंशावली से मिलाने के बजाय यूनानी रूपों के निकट रखा गया है।
    reason: textual_variant
  - marker: b
    text: ये नाम संभवतः परिचित बाइबिलीय मेरारी-वंश से संबंधित हैं, पर अनुवाद में यूनानी पाठ के प्राप्त रूप ही रखे गए हैं।
    reason: textual_variant
  - marker: c
    text: यूनानी पाठ यहाँ ‘मेरी बेटी’ और ‘मेरे जीवन के चौरानवेवें वर्ष’ कहता है। ‘मेरी बेटी’ परिचित बाइबिलीय वंश-परंपराओं के साथ तनाव उत्पन्न करता है; फिर भी पाठ का कथन ज्यों का त्यों रखा गया है।
    reason: alternative_reading
  - marker: d
    text: ‘पुरोहित के रूप में सेवा की’ उस यूनानी क्रिया का अनुवाद है जिसका अर्थ पुरोहिताई का कार्य करना है। ‘अड़तालीस’ में ‘आठ’ प्रस्तुत संपादित यूनानी पाठ में कोष्ठकों के भीतर है।
    reason: lexical_and_textual_note
lexical_decisions:
- source_word: ἔλαβεν ... γυναῖκα / εἰς γυναῖκα
  choice: विवाह किया / अपनी पत्नी बनाया
  rationale: यह विवाह के लिए प्रयुक्त यूनानी मुहावरा है। प्रसंग के अनुसार स्वाभाविक आधुनिक हिन्दी रखी गई है, बिना इसे केवल स्त्री को अधिकार में लेने की भाषा बनाने के।
- source_word: ἔτεκεν ... ἐξ αὐτῆς
  choice: उसकी पत्नी ने उसके लिए ... को जन्म दिया
  rationale: ἔτεκεν का सीधा प्रसव-संबंधी अर्थ सुरक्षित रहता है और वंशावली में पिता से संबंध भी स्पष्ट होता है।
- source_word: υἱοί
  choice: पुत्र
  rationale: वंशावली के इस संदर्भ में शब्द पुरुष संतानों को निर्दिष्ट करता है।
- source_word: ἱεράτευσα
  choice: पुरोहित के रूप में सेवा की
  rationale: क्रिया सक्रिय रूप से पुरोहिताई की सेवा करने को व्यक्त करती है; यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἰδού
  choice: देखो
  rationale: यह गंभीर ध्यानाकर्षण को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: यूनानी τέκνα, υἱοί से व्यापक है; इसलिए इसे केवल 'पुत्रो' नहीं किया गया।
- source_word: τρίτη γενεά
  choice: तीसरी पीढ़ी
  rationale: यह लेवी के सामने उपस्थित वंशजों का उसके सापेक्ष पीढ़ीगत स्थान बताता है।
theological_decisions:
- issue: यूनानी साक्षी में वंशावली के नाम परिचित बाइबलीय रूपों से भिन्न हैं
  choice: गेरसाम, काआथ, अब्राआम, इसाखार, खेब्रोन, ओज़ीएल, मोओली और मोउसेस जैसे यूनानी-पाठ-सन्निकट रूप रखे गए
  alternative: गेरशोन, कहात, अम्राम, यिसहार, हेब्रोन, उज्जीएल, महली और मूशी जैसे परिचित रूपों से सामंजस्य करना
  rationale: मूल यूनानी पाठ को पारदर्शी रखना और वंशावली को किसी अन्य परंपरा के अनुसार चुपचाप संशोधित न करना आवश्यक है।
- issue: योखाबेद को 'मेरी बेटी' कहना
  choice: दावे का सीधा अनुवाद किया गया
  alternative: '''बेटी'' को ''वंशज'' कहना या निर्गमन की परिचित वंशावली से मिलाने के लिए पाठ बदलना'
  rationale: यूनानी θυγατέρα μου स्पष्टतः 'मेरी बेटी' कहता है; वंशावलीगत तनाव को अनुवाद में मिटाया नहीं गया।
- issue: पद 4 में लेवी की आयु
  choice: चौरानवेवाँ वर्ष
  alternative: अंग्रेज़ी परामर्श-पाठ का चौंसठवाँ वर्ष
  rationale: प्रस्तुत यूनानी ἐνενηκοστῷ τετάρτῳ का अर्थ 'चौरानवेवाँ' है। मूल-भाषा साक्ष्य को प्राथमिकता दी गई है।
- issue: पद 5 में मिस्र आने की आयु
  choice: अड़तालीस वर्ष
  alternative: केवल चालीस वर्ष
  rationale: यूनानी पाठ में τεσσαράκοντα के बाद καὶ ὀκτώ को संपादकीय कोष्ठक में दिया गया है; समग्र संख्या अड़तालीस बनती है, पर पाठगत स्थिति टिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण वसीयतनामाई और वंशावलीगत शैली रखी गई है। नामों को यूनानी साक्षी के निकट देवनागरी में लिप्यंतरित किया गया है, जबकि कनान, मिस्र और योसेफ जैसे अत्यंत स्थापित भौगोलिक या व्यक्तिगत रूप स्वाभाविक हिन्दी परंपरा के अनुसार रखे गए हैं। स्रोत-पाठ को प्राथमिकता देते हुए पद 4 में अंग्रेज़ी POB के 'चौंसठ' के स्थान पर यूनानी का 'चौरानवे' अनूदित किया गया है।
