base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001.yaml
  text: 'A copy of the words of Levi, which he ordained for his sons concerning all that they would do, and what would happen to them[a] until the day of judgment.


    For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: hi
  text: 'याकूब और लिआ के तीसरे पुत्र लेवी की वसीयत


    1 लेवी के उन वचनों की प्रतिलिपि, जिन्हें उसने अपने पुत्रों के लिए ठहराया था—उन सब कामों के विषय में जो वे करेंगे और उन सब बातों के विषय में जो न्याय के दिन तक उनके साथ घटेंगी[a]।


    2 क्योंकि जब उसने उन्हें अपने पास बुलाया, तब वह स्वस्थ था; पर उसे यह प्रकट किया गया था कि वह मरने वाला है। जब वे इकट्ठे हो गए, तब उसने उनसे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर आ पड़ेंगी।” यूनानी मुहावरे का शाब्दिक भाव है कि भविष्य की बातें उनसे “आ मिलेंगी।”
    reason: συναντήσει αὐτοῖς के मुहावरेदार अर्थ के साथ उसके अधिक शाब्दिक चित्र को भी सुरक्षित रखना।
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयत
  rationale: यह रचना के वसीयतनुमा साहित्यिक रूप और कुलपिता के अंतिम कथनों, दोनों को स्वाभाविक तथा गंभीर हिन्दी में व्यक्त करता है।
- source_word: Ἀντίγραφον λόγων
  choice: वचनों की प्रतिलिपि
  rationale: Ἀντίγραφον के लिखित प्रति/अभिलेख के भाव को ‘प्रतिलिपि’ और λόγων के व्यापक, औपचारिक अर्थ को ‘वचन’ से सुरक्षित रखा गया है।
- source_word: διέθετο
  choice: निर्धारित किया था
  rationale: क्रिया में व्यवस्थित करने, ठहराने या निर्देश के रूप में देने का वसीयतनुमा भाव है। ‘निर्धारित’ उसकी गंभीरता रखता है, पर किसी विशिष्ट धार्मिक पद का अनावश्यक संकेत नहीं देता।
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: उन सब कामों के विषय में जो वे करेंगे
  rationale: भविष्यकाल और वचनों के विषय-विस्तार को स्पष्ट, वर्तमान मानक हिन्दी में निकटता से व्यक्त करता है।
- source_word: συναντήσει αὐτοῖς
  choice: उनके साथ घटेंगी
  rationale: यूनानी मुहावरे का आशय भविष्य में उनसे आ मिलने अथवा उन पर घटने वाली घटनाएँ हैं। मुख्य पाठ में सहज हिन्दी रखी गई और शाब्दिक रंग को पादटिप्पणी में दिया गया है।
- source_word: ἕως ἡμέρας κρίσεως
  choice: न्याय के दिन तक
  rationale: औपचारिक युगांत-संबंधी अभिव्यक्ति को बनाए रखता है और पाठ से आगे किसी विशिष्ट धर्मसैद्धांतिक विवरण को नहीं जोड़ता।
- source_word: Ὑγιαίνων
  choice: स्वस्थ था
  rationale: यह स्पष्ट करता है कि पुत्रों को बुलाते समय लेवी प्रत्यक्ष रूप से रोगग्रस्त नहीं था; हिन्दी में सरल और स्वाभाविक है।
- source_word: ἀπεκαλύφθη
  choice: उस पर यह प्रकट किया गया था
  rationale: निष्क्रिय प्रयोग और प्रकाशन के भाव को सुरक्षित रखता है तथा प्रकट करने वाले की पहचान वहाँ नहीं जोड़ता जहाँ यूनानी पाठ उसे स्पष्ट नहीं करता।
- source_word: μέλλει ἀποθνήσκειν
  choice: वह मरने वाला है
  rationale: आसन्न मृत्यु के सीधे अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνήχθησαν
  choice: वे इकट्ठे हो गए
  rationale: बुलावे के उत्तर में पुत्रों के एकत्र होने की कथा-क्रमिक क्रिया को सरल आधुनिक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ἕως ἡμέρας κρίσεως में न्याय के दिन का युगांत-संबंधी संकेत
  choice: न्याय के दिन तक
  alternative: न्याय-दिवस तक
  rationale: चुना हुआ रूप औपचारिक यूनानी पदबंध के निकट, सामान्य पाठक के लिए स्पष्ट और धर्मसैद्धांतिक अति-व्याख्या से मुक्त है।
- issue: ἀπεκαλύφθη में प्रकाशन के कर्ता की अनिर्दिष्टता
  choice: उस पर यह प्रकट किया गया था
  alternative: परमेश्वर ने उस पर प्रकट किया था
  rationale: यूनानी निष्क्रिय वाक्य कर्ता का नाम नहीं लेता। अनिर्दिष्ट निष्क्रिय रूप उस संभावित दैवी संकेत को रहने देता है, पर उसे स्पष्टतः जोड़कर अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सहज वसीयतनुमा शैली अपनाई गई है। शीर्षक को मूल यूनानी स्रोत के अनुसार शामिल किया गया है। पद-संख्या स्पष्टता के लिए रखी गई है; अनावश्यक पुरातन या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
