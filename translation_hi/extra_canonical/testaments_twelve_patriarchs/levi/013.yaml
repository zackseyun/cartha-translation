lexical_decisions:
- source_word: ἁπλότης
  choice: निष्कपटता
  rationale: यह शब्द यहाँ अविभाजित, सीधा और छलरहित आचरण बताता है। ‘निष्कपटता’ आधुनिक हिन्दी में नैतिक भाव को ‘सरलता’ की अपेक्षा अधिक स्पष्ट रखती है, बिना इसे केवल ईमानदारी तक सीमित किए।
- source_word: γράμματα
  choice: अक्षर-ज्ञान
  rationale: संदर्भ बच्चों को पढ़ना सिखाने और व्यवस्था का निरंतर पाठ करने का है। ‘अक्षर-ज्ञान’ मूल के ठोस शैक्षिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σύνεσις
  choice: समझ-बूझ
  rationale: यह बौद्धिक और नैतिक समझ दोनों को समेटता है तथा शिक्षा के प्रसंग में साधारण पाठक के लिए सहज है।
- source_word: ξένος
  choice: परदेशी
  rationale: यह केवल विदेशी नागरिक नहीं, बल्कि किसी स्थान पर बाहरी या अपरिचित व्यक्ति होने का सामाजिक भाव भी रखता है।
- source_word: δουλεῦσαι
  choice: सेवा करना
  rationale: क्रिया दासत्व भी सूचित कर सकती है, पर यहाँ ज्ञानी व्यक्ति के प्रति स्वेच्छापूर्ण सेवा या सहायता का भाव प्रसंगानुकूल है।
- source_word: δικαιοσύνη
  choice: धार्मिकता का आचरण
  rationale: यह परमेश्वर के सामने उचित और सीधा व्यवहार बताता है। क्रियात्मक यूनानी वाक्यांश ποιήσατε δικαιοσύνην को हिन्दी में स्वाभाविक बनाने के लिए ‘आचरण करो’ रखा गया है।
- source_word: ψυχαῖς
  choice: प्राणों
  rationale: यह भीतर के व्यक्ति को सूचित करता है और बोने के रूपक को बनाए रखता है; ‘आत्माओं’ की अपेक्षा ‘प्राणों’ इस उपदेशात्मक शैली में अधिक स्वाभाविक है।
- source_word: ταραχή
  choice: उथल-पुथल
  rationale: यह भीतरी अशांति और बाहरी अव्यवस्था दोनों की व्यापकता को व्यक्त करता है और θλίψις अर्थात ‘क्लेश’ से अलग बना रहता है।
- source_word: κτήσασθε
  choice: प्राप्त करो
  rationale: आज्ञार्थक क्रिया बुद्धि को मूल्यवान वस्तु की तरह हासिल करने का आग्रह करती है; ‘प्राप्त करो’ वर्तमान हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: φόβῳ Θεοῦ
  choice: परमेश्वर के भय में
  rationale: पारंपरिक बाइबलीय मुहावरे और उसके नैतिक-धार्मिक भार को बनाए रखा गया है; इसे केवल ‘श्रद्धा’ कहकर भय के वास्तविक तत्व को हटाया नहीं गया।
- source_word: πώρωσις
  choice: कठोरता
  rationale: यह नैतिक-संवेदनहीनता या हठीले कठोर हो जाने का भाव रखता है और ‘अंधेपन’ के साथ समानांतर रूप में स्वाभाविक बैठता है।
- source_word: παρὰ τοῖς πολεμίοις λαμπρά
  choice: शत्रुओं के बीच भी तेजस्वी
  rationale: संक्षिप्त यूनानी अभिव्यक्ति बताती है कि विरोधी वातावरण में भी बुद्धि की दीप्ति और प्रतिष्ठा बनी रहती है।
- source_word: σύνθρονος
  choice: राजाओं के साथ सिंहासन पर बैठेगा
  rationale: शब्द का अर्थ सह-सिंहासनासीन होना है। यह रूप मूल बिंब को बचाते हुए जटिल संस्कृतनिष्ठ पदावली से बचता है।
theological_decisions:
- issue: ‘पृथ्वी पर धार्मिकता करो … स्वर्गों में पाओ’ में प्रतिफल का स्वरूप
  choice: अनुवाद में धार्मिकता की ओर संकेत करते हुए ‘उसे’ रखा गया और पादटिप्पणी में मूल का अनिर्दिष्ट कर्म बताया गया।
  alternative: ‘स्वर्ग में धन पाओ’ या ‘स्वर्गों में पाए जाओ।’
  rationale: εὕρητε के बाद कर्म निहित है। निकटतम व्याकरणिक संदर्भ δικαιοσύνη है, पर पाठ उसके स्वर्गीय प्रतिफल या मान्यता को स्पष्ट रूप से परिभाषित नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
- issue: पद 7 में बुद्धि छिनने के अपवाद का आशय
  choice: बाहरी हानि बुद्धि नहीं छीन सकती; ‘अधर्म का अंधापन और पाप की कठोरता’ ही अपवाद हैं।
  alternative: इन दोषों को व्यक्तिरूप बाहरी शक्तियाँ मानना, या अपवाद-वाक्य को बाद की व्याख्यात्मक वृद्धि समझना।
  rationale: यूनानी वाक्य-विन्यास इन नैतिक-आत्मिक दशाओं को एकमात्र अपवाद के रूप में प्रस्तुत करता है। अनुवाद उन्हें स्पष्ट करता है, पर यह नहीं बताता कि वे किस व्यवस्थित धार्मिक प्रक्रिया से बुद्धि छीनती हैं।
- issue: पद 9 में राजाओं के साथ सिंहासन पर बैठना
  choice: राजकीय सम्मान के बिंब को प्रत्यक्ष रूप से बनाए रखा गया।
  alternative: इसे केवल ‘राजाओं के समान सम्मान पाएगा’ कहकर रूपकात्मक बनाना।
  rationale: σύνθρονος का सिंहासन-संबंधी बिंब स्पष्ट है। पाठ स्वयं यह तय नहीं करता कि कथन शाब्दिक पद, दरबारी प्रतिष्ठा या ज्ञान से मिलने वाले सम्मान का रूपक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध उपदेशात्मक शैली अपनाई गई है। ‘व्यवस्था’, ‘धार्मिकता’, ‘परमेश्वर का भय’ और ‘बंधुआई’ जैसे स्थापित बाइबलीय पद रखे गए हैं। अत्यधिक संस्कृतनिष्ठ रचनाओं से बचते हुए यूनानी के समानांतर वाक्यों, कृषि-रूपक और ज्ञान-संबंधी तनाव को सुरक्षित रखा गया है। संबोधन ‘मेरे बच्चो’ आधुनिक मानक वर्तनी के अनुसार लिखा गया है।
