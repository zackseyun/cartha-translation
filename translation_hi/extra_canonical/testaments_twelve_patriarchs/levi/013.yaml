  language: hi
  text: '**लेवी का वसीयतनामा 13**


    **1.** अब, मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ: प्रभु अपने परमेश्वर का अपने सारे हृदय से भय रखो और उसकी पूरी व्यवस्था के अनुसार निष्कपटता से चलो। **2.** तुम अपने बच्चों को अक्षर-ज्ञान भी सिखाओ, ताकि वे परमेश्वर की व्यवस्था निरंतर पढ़ते हुए जीवन भर समझ-बूझ रखें। **3.** क्योंकि जो कोई प्रभु की व्यवस्था को जान लेगा, उसका सम्मान होगा; और वह जहाँ कहीं जाएगा, वहाँ परदेशी न होगा। **4.** इतना ही नहीं, वह माता-पिता से भी बढ़कर बहुत-से मित्र पाएगा[a], और बहुत-से लोग उसकी सेवा करना और उसके मुँह से व्यवस्था सुनना चाहेंगे। **5.** इसलिए, मेरे बच्चो, पृथ्वी पर धार्मिकता का आचरण करो, ताकि तुम उसे स्वर्गों में पाओ[b]। **6.** अपने भीतर भलाई बोओ, और उसे अपने जीवन में पाओगे। लेकिन यदि तुम बुराई बोओगे, तो हर प्रकार की उथल-पुथल और क्लेश काटोगे। **7.** परमेश्वर के भय में बुद्धि प्राप्त करो; क्योंकि यदि बंधुआई आ पड़े, नगर और देश नष्ट हो जाएँ, और सोना, चाँदी तथा सारी संपत्ति मिट जाए, तब भी बुद्धिमान की बुद्धि को कोई नहीं छीन सकता—सिवाय अधर्म के अंधेपन और पाप की कठोरता के। **8.** क्योंकि यदि कोई अपने को इन
    बुरे कामों से बचाए रखे, तो बुद्धि उसके लिए शत्रुओं के बीच भी तेजस्वी होगी; परायी भूमि में उसे स्वदेश मिलेगा, और शत्रुओं के बीच वह मित्र पाया जाएगा[c]। **9.** जो कोई अच्छी बातें सिखाता और उन पर चलता है, वह राजाओं के साथ सिंहासन पर बैठेगा, जैसे मेरा भाई यूसुफ भी बैठा।


    **पादटिप्पणियाँ**


    [a] यूनानी वाक्यांश का शाब्दिक अर्थ है, “माता-पिता से बढ़कर बहुत-से मित्र।” इसका आशय संभवतः यह है कि व्यवस्था का ज्ञानी व्यक्ति अपने परिवार के दायरे से बाहर भी बहुत-से मित्र पाएगा; फिर भी मूल वाक्यांश संक्षिप्त और कठिन है।


    [b] यूनानी में शाब्दिक रूप से है, “धार्मिकता करो … ताकि तुम स्वर्गों में पाओ।” “पाओ” का कर्म मूल पाठ में स्पष्ट रूप से नहीं दिया गया; यहाँ “उसे” से धार्मिकता अथवा उसके प्रतिफल की ओर संकेत समझा गया है।


    [c] पद 8 का यूनानी वाक्य अत्यंत संक्षिप्त है: बुद्धि “शत्रुओं के बीच तेजस्वी” होती है, और परायी भूमि में “स्वदेश” मिलता है।'
