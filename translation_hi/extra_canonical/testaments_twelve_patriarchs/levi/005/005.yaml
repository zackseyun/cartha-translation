  text: And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in the day of affliction.”
translation:
  language: hi
  text: और मैंने उससे कहा, “हे प्रभु, मैं तुझसे विनती करता हूँ, मुझे अपना नाम बता, ताकि संकट के दिन मैं तुझे पुकार सकूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέομαί σου
  choice: मैं तुझसे विनती करता हूँ
  rationale: याचना की तीव्रता और प्रत्यक्ष संबोधन को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: δίδαξόν με τὸ ὄνομά σου
  choice: मुझे अपना नाम बता
  rationale: शाब्दिक रूप से ‘मुझे अपना नाम सिखा’ हिन्दी में अस्वाभाविक है; यहाँ आशय नाम बताने या प्रकट करने का है।
- source_word: ἐπικαλέσομαί σε
  choice: मैं तुझे पुकार सकूँ
  rationale: संकट में सहायता के लिए प्रभु को पुकारने का अर्थ सुरक्षित रखता है।
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: संकट के दिन
  rationale: यूनानी के एकवचन और निश्चित अभिव्यक्ति को संक्षिप्त तथा स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: Κύριε के संबोधन और सर्वनाम का स्तर
  choice: हे प्रभु ... तुझसे ... तुझे
  alternative: हे प्रभु ... आपसे ... आपको
  rationale: धार्मिक प्रार्थना की पारंपरिक गरिमा और मूल के एकवचन प्रत्यक्ष संबोधन को बनाए रखने के लिए ‘तू’ के आदरसूचक धार्मिक प्रयोग को चुना गया है; इससे वक्ता और संबोधित सत्ता की पहचान के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनापूर्ण, सीधा और गरिमापूर्ण कथन। मूल के अनुरोध, नाम जानने और संकट के दिन पुकारने के उद्देश्य-संबंध को स्पष्ट रखा गया है।
