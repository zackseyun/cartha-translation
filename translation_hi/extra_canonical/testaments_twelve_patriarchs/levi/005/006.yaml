source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπεν³⁸· Ἐγώ εἰμι ὁ ἄγγελος ὁ *παραιτούμενος τὸ γένος³⁹ Ἰσραήλ, τοῦ μὴ πατάξαι⁴⁰ αὐτούς⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/006.yaml
  text: And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down.”
translation:
  language: hi
  text: और उसने कहा, “मैं वह स्वर्गदूत हूँ जो इस्राएल के लोगों के लिए विनती करता हूँ, ताकि उन पर प्रहार न किया जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: वह स्वर्गदूत
  rationale: यहाँ ἄγγελος एक अलौकिक दूत के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘स्वर्गदूत’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: παραιτούμενος
  choice: विनती करता है
  rationale: मध्यवाच्य कृदन्त यहाँ किसी के पक्ष में निवेदन या मध्यस्थता करने का भाव देता है। ‘के लिए विनती करता है’ इस आशय को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: τὸ γένος Ἰσραήλ
  choice: इस्राएल के वंश
  rationale: γένος का अर्थ यहाँ जातीय/वंशगत समुदाय है। ‘वंश’ मूल रूपक को बचाता है और कृत्रिम जातिगत अर्थ से बचता है।
- source_word: τοῦ μὴ πατάξαι αὐτούς
  choice: ताकि वे मारे न जाएँ
  rationale: निषेधात्मक उद्देश्य-वाक्य को स्वाभाविक हिन्दी में व्यक्त किया गया है। πατάσσω के प्रहार करने अथवा मार डालने के भाव को प्रसंग में ‘मारे जाएँ’ समेटता है, बिना ‘पूरी तरह’ जैसा अप्रमाणित विस्तार जोड़े।
theological_decisions:
- issue: स्वर्गदूत की मध्यस्थ भूमिका
  choice: ‘इस्राएल के वंश के लिए विनती करता है’
  alternative: ‘इस्राएल के वंश की ओर से मध्यस्थता करता है’
  rationale: मूल में स्वर्गदूत की निवेदनकारी भूमिका है, पर उसके तंत्र या धर्मशास्त्रीय स्वरूप को नहीं समझाया गया। ‘विनती’ भूमिका को बनाए रखते हुए किसी विशिष्ट सम्प्रदायगत मध्यस्थता-सिद्धान्त को आरोपित नहीं करती।
- issue: πατάξαι की तीव्रता
  choice: ‘मारे न जाएँ’
  alternative: ‘उन पर प्रहार न किया जाए’
  rationale: क्रिया ‘प्रहार करना’ से लेकर घातक रूप से मारना तक अर्थ दे सकती है। यहाँ परिणाम-केंद्रित ‘मारे न जाएँ’ अंग्रेज़ी परामर्श-पाठ से भी संगत है, पर ‘सर्वथा नष्ट’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, dignified और सहज रखी गई है। एकवचन सामूहिक ‘इस्राएल के वंश’ के बाद यूनानी बहुवचन αὐτούς के अनुरूप हिन्दी में ‘वे’ प्रयुक्त है। मूल पद में उपलब्ध न होने के कारण बाद की विस्तारित अंग्रेज़ी पुनरीक्षण-पंक्ति का ‘हर दुष्ट आत्मा’ वाला अंश सम्मिलित नहीं किया गया।
