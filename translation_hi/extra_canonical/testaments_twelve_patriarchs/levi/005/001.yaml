  text: Καὶ †ἐν τούτῳ¹ ἤνοιξέ μοι² *ὁ ἄγγελος³ τὰς πύλας τοῦ οὐρανοῦ· καὶ εἶδον τὸν *ἅγιον ὕψιστον ἐπὶ θρόνου καθήμενον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/001.yaml
  text: And in this, the angel opened to me the gates of heaven, and I saw the Holy Most High seated on a throne.
translation:
  language: hi
  text: और इसी में स्वर्गदूत ने मेरे लिए स्वर्ग के द्वार खोल दिए, और मैंने पवित्र परमप्रधान को सिंहासन पर बैठे देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी दौरान
  rationale: यह पदबंध प्रसंग या समय की ओर संकेत कर सकता है। ‘इसी दौरान’ स्वाभाविक हिन्दी में उसकी अस्पष्टता को काफी हद तक बनाए रखता है, बिना इसे किसी निश्चित घटना से जोड़ने के।
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: यह ἄγγελος का प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: τὰς πύλας τοῦ οὐρανοῦ
  choice: स्वर्ग के द्वार
  rationale: बहुवचन πύλας और संबंधवाचक τοῦ οὐρανοῦ का सीधा तथा स्वाभाविक अनुवाद।
- source_word: τὸν ἅγιον ὕψιστον
  choice: परम पवित्र, परमप्रधान
  rationale: दोनों विशेषणों की विशिष्ट उपाधिमूलक शक्ति सुरक्षित रखी गई है; अल्पविराम हिन्दी में दोनों संबोधनों को एक ही सत्ता से जोड़ता है।
- source_word: ἐπὶ θρόνου καθήμενον
  choice: सिंहासन पर बैठे
  rationale: यूनानी कृदंत का सहज हिन्दी रूप, जो दर्शन में देखी गई अवस्था को व्यक्त करता है।
theological_decisions:
- issue: ἅγιον ὕψιστον में दिव्य उपाधियों का संबंध
  choice: ‘परम पवित्र, परमप्रधान’—दोनों को एक ही देखी गई दिव्य सत्ता की उपाधियों के रूप में रखा गया।
  alternative: ‘पवित्र परमप्रधान’ अथवा ‘पवित्रतम परमप्रधान’
  rationale: यूनानी में दोनों पद एक ही कर्मकारक सत्ता का वर्णन करते हैं। चुना हुआ रूप दोनों उपाधियों को स्पष्ट रखता है और किसी अतिरिक्त सांप्रदायिक पहचान को नहीं जोड़ता।
- issue: ἐν τούτῳ का संदर्भ
  choice: इसी दौरान
  alternative: ‘इसमें’, ‘इस अवसर पर’ या ‘तब’
  rationale: मूल पदबंध संदर्भगत रूप से अस्पष्ट है। ‘इसी दौरान’ उसे समय-संदर्भ में स्वाभाविक बनाता है, पर किसी अनुल्लिखित घटना को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और दर्शन-वर्णन के अनुकूल शैली। ‘मेरे लिए’ से μοι का हितार्थ भाव व्यक्त किया गया है। किसी पांडुलिपीय टिप्पणी के लिए पर्याप्त स्पष्ट वैकल्पिक पाठ उपलब्ध न होने के कारण फुटनोट नहीं जोड़ा गया।
