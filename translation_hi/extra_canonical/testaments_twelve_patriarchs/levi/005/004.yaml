base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/004.yaml
  text: And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.
translation:
  language: hi
  text: और उस समय मैंने हमोर के पुत्रों का नाश कर दिया, जैसा कि पूर्वजों की पट्टिकाओं पर लिखा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσα
  choice: नाश कर दिया
  rationale: संदर्भ में क्रिया का अर्थ किसी समूह को पूरी तरह समाप्त या नष्ट करना है; यह स्वाभाविक हिन्दी में यूनानी पूर्ण क्रिया के बल को व्यक्त करता है।
- source_word: τοὺς υἱοὺς Ἐμμώρ
  choice: हमोर के पुत्रों
  rationale: υἱούς का सीधा अर्थ ‘पुत्रों’ है। Ἐμμώρ नाम को प्रचलित बाइबलीय हिन्दी रूप ‘हमोर’ में रखा गया है।
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: पूर्वजों की पट्टिकाओं पर
  rationale: πλαξί को ठोस लिखित पट्टिकाओं के रूप में और πατέρων को वंशगत संदर्भ में स्वाभाविक आधुनिक हिन्दी ‘पूर्वजों’ के रूप में प्रस्तुत किया गया है; मूल में अनुपस्थित ‘स्वर्गीय’ नहीं जोड़ा गया।
theological_decisions:
- issue: पट्टिकाओं का स्वरूप
  choice: पूर्वजों की पट्टिकाएँ
  alternative: पूर्वजों की स्वर्गीय पट्टिकाएँ
  rationale: यूनानी पाठ में ‘स्वर्गीय’ के लिए कोई शब्द नहीं है, इसलिए उसे जोड़ना अनुचित होगा और ग्रंथ के अभिप्राय को आवश्यकता से अधिक निश्चित करेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। वाक्य-संरचना मूल के निकट है, पर हिन्दी में स्वाभाविक प्रवाह बनाए रखा गया है।
