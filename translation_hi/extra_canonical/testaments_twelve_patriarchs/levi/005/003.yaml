revisions:
- from: तब वह स्वर्गदूत मुझे नीचे पृथ्वी पर ले आया और उसने मुझे एक हथियार और एक तलवार दी। उसने मुझसे कहा, “अपनी बहन दीना के लिए शकेम में बदला ले, और मैं तेरे साथ रहूँगा, क्योंकि प्रभु ने मुझे भेजा है।”
  to: तब वह स्वर्गदूत मुझे पृथ्वी पर उतार लाया और उसने मुझे एक हथियार और एक तलवार दी। उसने मुझसे कहा, “अपनी बहन दीना के लिए शकेम में प्रतिशोध करो, और मैं तुम्हारे साथ रहूँगा, क्योंकि प्रभु ने मुझे भेजा है।”
  rationale: The revision retains every source element and the direct presentation of the command, while making the descent and second-person address idiomatic in modern standard Hindi. It uses “प्रतिशोध” for ἐκδίκησις without imposing a theological or ethical reinterpretation.
