  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/003.yaml
  text: Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Execute vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”
translation:
  language: hi
  text: तब वह स्वर्गदूत मुझे पृथ्वी पर उतार लाया और उसने मुझे एक हथियार और एक तलवार दी। उसने मुझसे कहा, “अपनी बहन दीना के लिए शकेम में प्रतिशोध करो, और मैं तुम्हारे साथ रहूँगा, क्योंकि प्रभु ने मुझे भेजा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: संदर्भ में यह परमेश्वर द्वारा भेजे गए स्वर्गीय दूत को सूचित करता है; आधुनिक हिन्दी में ‘स्वर्गदूत’ स्पष्ट और स्वाभाविक है।
- source_word: ὅπλον καὶ ῥομφαίαν
  choice: एक हथियार और एक तलवार
  rationale: ὅπλον व्यापक अर्थ में युद्ध का हथियार है, जबकि ῥομφαία विशिष्ट रूप से तलवार है; दोनों संज्ञाओं का भेद बनाए रखा गया है।
- source_word: Ποίησον ἐκδίκησιν
  choice: बदला ले
  rationale: यह हिन्दी में स्वाभाविक आज्ञार्थक अभिव्यक्ति है और न्यायात्मक प्रतिशोध की मूल धारणा को बिना अतिरिक्त व्याख्या के व्यक्त करती है।
- source_word: Συχὲμ
  choice: शकेम
  rationale: बाइबलीय स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: μετά σου
  choice: तेरे साथ
  rationale: एकवचन निकट संबोधन का भाव बनाए रखने के लिए ‘तेरे’ चुना गया है।
theological_decisions:
- issue: स्वर्गदूत द्वारा हिंसात्मक प्रतिशोध की आज्ञा
  choice: आज्ञा को सीधे रूप में ‘शकेम में बदला ले’ रखा गया है।
  alternative: इसे नरम करके ‘न्याय कर’ या नैतिक व्याख्या सहित प्रस्तुत करना।
  rationale: यूनानी पाठ स्पष्टतः ἐκδίκησις की भाषा इस्तेमाल करता है; पाठ में उपस्थित नैतिक और धर्मवैज्ञानिक तनाव को अनुवाद में मिटाना उचित नहीं।
- issue: प्रभु द्वारा स्वर्गदूत को भेजा जाना
  choice: ‘क्योंकि प्रभु ने मुझे भेजा है’
  alternative: ‘क्योंकि मुझे प्रभु ने भेजा है’
  rationale: दोनों सम्भव हैं; चुना गया क्रम सरल, स्वाभाविक है और कर्ता ‘प्रभु’ को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। कथन में ‘उसने’ जोड़कर हिन्दी में वक्ता स्पष्ट किया गया है। प्रत्यक्ष वचन में एकवचन ‘तेरे’ मूल के निकट संबोधन को दर्शाता है।
