lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह यूनानी पदबंध घटनाक्रम में अगली घटना को सूचित करता है; आधुनिक हिन्दी में इसका सीधा और स्वाभाविक रूप ‘इसके बाद’ है।
- source_word: ἔξυπνος γενόμενος
  choice: जब मैं जागा
  rationale: शाब्दिक अर्थ ‘जागृत होकर’ है; प्रसंगगत काल-संबंध को सहज हिन्दी में स्पष्ट करने के लिए ‘जब मैं जागा’ चुना गया।
- source_word: εὐλόγησα
  choice: मैंने ... को धन्य कहा
  rationale: εὐλογέω का मूल भाव किसी की स्तुति करते हुए उसे धन्य कहना है। ‘आशीष दी’ आधुनिक हिन्दी में मनुष्य द्वारा परमेश्वर को आशीष देने का भ्रामक अर्थ दे सकती है।
- source_word: τὸν ὕψιστον
  choice: परमप्रधान
  rationale: यह ὕψιστος की पारंपरिक, संक्षिप्त और गरिमापूर्ण हिन्दी अभिव्यक्ति है तथा परमेश्वर की सर्वोच्चता व्यक्त करती है।
theological_decisions:
- issue: मनुष्य द्वारा परमप्रधान को εὐλογέω करने का अर्थ
  choice: परमप्रधान को धन्य कहा
  alternative: परमप्रधान की स्तुति की
  rationale: ‘धन्य कहा’ स्रोत की आशीर्वचनात्मक भाषा को बनाए रखता है, जबकि ‘स्तुति की’ अर्थ को सही दिशा में ले जाने पर भी मूल क्रिया की विशिष्टता को कुछ सामान्य बना देता है।
