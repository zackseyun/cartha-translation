  text: And he said to me, “Levi, to you I have given the blessings of the priesthood until I come and dwell in the midst of Israel.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “लेवी, मैंने तुझे याजकपद की आशीषें तब तक के लिए दी हैं, जब तक मैं आकर इस्राएल के बीच निवास करूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: याजकपद की आशीषें
  rationale: बहुवचन εὐλογίας को ‘आशीषें’ और ἱερατείας को पद/सेवा-संस्था के अर्थ में ‘याजकपद’ रखा गया है; इससे मूल संबंध स्पष्ट और स्वाभाविक रहता है।
- source_word: ἕως ἐλθὼν κατοικήσω
  choice: तब तक के लिए… जब तक कि मैं आकर… निवास न करूँ
  rationale: ἕως के कालगत अर्थ और aorist participle ἐλθών के बाद मुख्य क्रिया κατοικήσω का क्रम सुरक्षित रखा गया है। ‘के लिए’ हिंदी में दिए जाने की अवधि का संबंध स्पष्ट करता है।
- source_word: ἐν μέσῳ τοῦ Ἰσραήλ
  choice: इस्राएल के बीच
  rationale: ἐν μέσῳ का सीधा और स्वाभाविक हिंदी रूप; ‘इस्राएल’ की सामूहिक प्रजा और उसके मध्य होने का अर्थ खुला रहता है।
theological_decisions:
- issue: याजकपद की आशीषों की अवधि और वक्ता के आगमन का संबंध
  choice: ‘तब तक के लिए… जब तक कि मैं आकर… निवास न करूँ’
  alternative: ‘जब तक मैं आकर इस्राएल के बीच निवास करूँ’
  rationale: मूल ἕως संभावित अवधि-सीमा व्यक्त करता है। अनुवाद इस तनाव को बनाए रखता है और यह तय नहीं करता कि आगमन के बाद आशीषें समाप्त हो जाती हैं या अपने लक्ष्य तक पहुँचती हैं।
- issue: वक्ता की पहचान
  choice: सर्वनाम ‘मैं’ को बिना व्याख्या रखा गया
  alternative: वक्ता को परमेश्वर, दूत या मसीह के रूप में स्पष्ट करना
  rationale: इस पद में वक्ता की पहचान नाम से नहीं दी गई; इसलिए कोई सांप्रदायिक या व्याख्यात्मक पहचान नहीं जोड़ी गई।
