  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण धार्मिक गद्य। ‘तुझे’ एकवचन संबोधन σοὶ के अनुरूप है और ‘याजकपद’ सामान्य पाठक के लिए संक्षिप्त तथा सटीक है।
