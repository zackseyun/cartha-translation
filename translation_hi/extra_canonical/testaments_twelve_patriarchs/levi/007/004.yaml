- source_word: Ἀπάραντες
  choice: वहाँ से चलकर
  rationale: यह कृदन्त प्रस्थान करने या किसी स्थान से चल पड़ने का अर्थ देता है; प्रसंगानुकूल स्वाभाविक हिन्दी में इसे ‘वहाँ से चलकर’ कहा गया है। किसी अनिर्दिष्ट वस्तु को ‘उठाने’ का अर्थ नहीं अपनाया गया।
- source_word: δὲ
  choice: तब
  rationale: यहाँ यह कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘तब’ हिन्दी में घटनाक्रम को सहज रूप से जोड़ता है।
- source_word: ἤλθομεν εἰς
  choice: पहुँचे
  rationale: शाब्दिक ‘की ओर आए’ की अपेक्षा गंतव्य के साथ ‘पहुँचे’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
- source_word: Δίναν Βεθήλ
  choice: दीनान बेतेल
  rationale: दोनों यूनानी नामों को बिना किसी एक को हटाए या उनका संबंध अनुमान से बदले लिप्यंतरित किया गया है।
