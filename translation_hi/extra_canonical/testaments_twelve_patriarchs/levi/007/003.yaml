translation:
  language: hi
  text: क्योंकि उन्होंने मेरी बहन को अपवित्र करके इस्राएल में सचमुच मूर्खता की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίγε
  choice: सचमुच
  rationale: यह निश्चय और बल को व्यक्त करता है; प्रसंग में ‘वास्तव में/निश्चय ही’ के अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀφροσύνην ἔπραξαν
  choice: मूर्खता का काम किया
  rationale: यूनानी संज्ञा और क्रिया के संयोजन को बनाए रखते हुए उस गंभीर, निंदनीय आचरण का भाव व्यक्त करता है जिसे बाइबलीय भाषा में ‘मूर्खता’ कहा जाता है।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: स्थान अथवा समुदाय-संबंधी मूल अस्पष्टता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: μιάναντες
  choice: अशुद्ध किया
  rationale: इस कृदंत का अर्थ दूषित अथवा अपवित्र करना है; ‘अशुद्ध किया’ नैतिक और विधिक दोनों छायाओं को खुला रखता है।
- source_word: τὴν ἀδελφήν μου
  choice: मेरी बहन को
  rationale: लेवी के प्रथम-पुरुष संबंध को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
theological_decisions:
- issue: μιάναντες में अशुद्धता का स्वरूप
  choice: अशुद्ध किया
  alternative: अपवित्र किया
  rationale: ‘अशुद्ध’ मूल शब्द की दूषण-संबंधी व्यापकता को बनाए रखता है और अनावश्यक रूप से केवल पवित्रस्थान-संबंधी अर्थ नहीं थोपता।
- issue: कृदंत μιάναντες का मुख्य कथन से संबंध
  choice: और मेरी बहन को अशुद्ध किया
  alternative: मेरी बहन को अशुद्ध करके
  rationale: यूनानी कृदंत कारण, साधन या साथ घटित परिस्थिति की सूक्ष्मता रख सकता है। समन्वित हिन्दी वाक्य स्वाभाविक है और इसे केवल कारण या साधन के रूप में निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘मूर्खता का काम’ मूल की बाइबलीय नैतिक गंभीरता को बनाए रखता है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
