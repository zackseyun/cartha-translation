source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπον¹ Γἐγὼ²⁾ τῷ πατρί μου³, Ἰακώβ⁴, ὅτι ἐν σοὶ ἐξουδενώσει⁵ Κύριος⁶ τοὺς Χαναναίους⁷ καὶ δώσει⁸ τὴν γῆν αὐτῶν σοι καὶ τῷ σπέρματί σου μετὰ σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/001.yaml
  text: And I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you.”
translation:
  language: hi
  text: और मैंने अपने पिता याकूब से कहा, “तुझमें[a] प्रभु कनानियों को नगण्य कर देगा और उनकी भूमि तुझे और तेरे बाद तेरे वंश को देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुझ में”; इसका अर्थ “तेरे द्वारा” या “तेरे कारण” भी हो सकता है।
    reason: ἐν σοὶ की अर्थगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐν σοὶ
  choice: तेरे द्वारा
  rationale: यह यूनानी पदबंध यहाँ याकूब को वह माध्यम अथवा संबद्ध व्यक्ति बताता है जिसके संदर्भ में प्रभु कार्य करेगा। सहज हिन्दी के लिए ‘तेरे द्वारा’ चुना गया है, जबकि शाब्दिक रूप फुटनोट में रखा गया है।
- source_word: ἐξουδενώσει
  choice: मिटा देगा
  rationale: क्रिया का अर्थ किसी को तुच्छ, निष्फल या नगण्य कर देना है। इस संदर्भ में ‘मिटा देगा’ अंग्रेज़ी consultation layer के ‘bring ... to nothing’ का स्वाभाविक और प्रभावी हिन्दी रूप है।
- source_word: σπέρματί
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर संतान अथवा भावी वंशजों के सामूहिक अर्थ में आधुनिक हिन्दी में ‘वंश’ अधिक स्वाभाविक है।
theological_decisions:
- issue: ἐν σοὶ में याकूब की भूमिका
  choice: तेरे द्वारा
  alternative: तुझमें / तेरे कारण
  rationale: मूल वाक्यांश की व्याख्या माध्यम, संबंध या कारण के रूप में हो सकती है। मुख्य पाठ में सबसे स्वाभाविक माध्यमवाची रूप रखा गया है और शाब्दिक अस्पष्टता फुटनोट में सुरक्षित की गई है।
- issue: कनानियों के विषय में ἐξουδενώσει की तीव्रता
  choice: मिटा देगा
  alternative: तुच्छ ठहराएगा / निष्फल कर देगा
  rationale: संदर्भ में यह प्रभु द्वारा कनानियों को नगण्य या समाप्त कर देने की प्रबल घोषणा है। ‘मिटा देगा’ उस बल को बनाए रखता है, बिना इससे आगे कोई विशेष धार्मिक व्याख्या जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण हिन्दी में है। पारिवारिक प्रत्यक्ष संबोधन के कारण ‘तू/तेरे/तुझे’ रूप रखे गए हैं; ‘प्रभु’, ‘कनानी’ और ‘वंश’ सामान्य बाइबलीय शब्दावली के अनुरूप हैं।
