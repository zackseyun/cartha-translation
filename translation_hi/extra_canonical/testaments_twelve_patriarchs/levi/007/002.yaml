base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/002.yaml
  text: For from this day the city called Sychem shall be a city of senseless people. For just as someone mocks a fool, so we mocked them,
translation:
  language: hi
  text: क्योंकि आज से वह नगर, जो शकेम कहलाता है, निर्बुद्धि लोगों का नगर होगा; क्योंकि जैसे कोई किसी मूर्ख का उपहास करता है, वैसे ही हमने उनका उपहास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Σύκημα λεγομένη πόλις
  choice: वह नगर, जो शकेम कहलाता है
  rationale: यूनानी नाम Σύκημα को प्रचलित हिन्दी बाइबलीय रूप ‘शकेम’ में रखा और कृदन्तीय वाक्यांश को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया।
- source_word: ἀσυνέτων
  choice: निर्बुद्धि लोगों
  rationale: यह बहुवचन विशेषण समझ-बूझ या विवेक के अभाव को दर्शाता है; ‘निर्बुद्धि लोगों’ से अर्थ सुरक्षित रहता है और अगले μωρόν से शब्दगत भेद भी बना रहता है।
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: उपहास करता है / उपहास किया
  rationale: दोनों रूपों में एक ही यूनानी क्रिया की पुनरावृत्ति को हिन्दी में भी समान शब्दावली से बनाए रखा।
- source_word: μωρόν
  choice: मूर्ख
  rationale: एकवचन कर्मकारक का सीधा और स्वाभाविक हिन्दी समतुल्य, जो ἀσυνέτων से संबंधित किंतु अलग शब्द है।
theological_decisions:
- issue: शकेम के बारे में कथन का भविष्यकाल और कारण-संबंध
  choice: ‘आज से ... होगा; क्योंकि ...’
  alternative: इसे वर्तमान पहचान या पूर्णतः परिणामसूचक कथन बनाना
  rationale: Ἔσται का भविष्यकाल और दोनों γάρ का कारणसूचक बल यथासंभव प्रत्यक्ष रखा गया; कथन की नैतिक अथवा न्यायिक व्याख्या अतिरिक्त रूप से नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। मूल यूनानी की तुलना-रचना ‘जैसे... वैसे ही...’ और ‘उपहास’ की पुनरावृत्ति सुरक्षित रखी गई है।
