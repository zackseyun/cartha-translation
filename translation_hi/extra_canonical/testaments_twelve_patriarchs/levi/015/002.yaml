source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *ἔσεσθε βδέλυγμα⁹ αὐτοῖς¹⁰, καὶ λήψεσθε¹¹ ὄνειδος¹² καὶ αἰσχύνην αἰώνιον παρὰ *τῆς δικαιοκρισίας¹³ τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/002.yaml
  text: And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God.
translation:
  language: hi
  text: और तुम उनके लिए घृणित ठहरोगे, और परमेश्वर के धर्ममय न्याय से निन्दा और सदा की लज्जा पाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βδέλυγμα
  choice: घृणित
  rationale: यह यूनानी शब्द तीव्र घृणा या जुगुप्सा का भाव व्यक्त करता है; व्यक्ति के लिए स्वाभाविक हिन्दी में ‘घृणित ठहरोगे’ उपयुक्त है।
- source_word: ὄνειδος
  choice: निन्दा
  rationale: यह अपमानजनक भर्त्सना या बदनामी को दर्शाता है; ‘निन्दा’ संक्षिप्त और गरिमापूर्ण समतुल्य है।
- source_word: αἰσχύνην αἰώνιον
  choice: सदा की लज्जा
  rationale: विशेषण αἰώνιον की दीर्घकालिकता को सरल आधुनिक हिन्दी में बनाए रखता है, बिना उससे अधिक दार्शनिक अर्थ जोड़ने के।
- source_word: δικαιοκρισίας
  choice: धर्ममय न्याय
  rationale: यह न्याय के धर्मी/उचित चरित्र को व्यक्त करता है; ‘धर्ममय न्याय’ धार्मिक साहित्य के अनुरूप होते हुए भी सामान्य पाठक के लिए बोधगम्य है।
theological_decisions:
- issue: παρὰ τῆς δικαιοκρισίας τοῦ Θεοῦ में न्याय को परिणाम के स्रोत के रूप में व्यक्त करना
  choice: परमेश्वर के धर्ममय न्याय से
  alternative: परमेश्वर के धर्ममय न्याय के द्वारा
  rationale: ‘से’ मूल के स्रोत/कारण संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है और न्याय की प्रक्रिया के विषय में अनावश्यक विस्तार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण और सीधा रखा गया है। ‘उनके लिए’ αὐτοῖς के संबंधसूचक अर्थ को स्पष्ट करता है, और भविष्यकाल के दोनों क्रियापदों को समानांतर रूप में प्रस्तुत किया गया है।
