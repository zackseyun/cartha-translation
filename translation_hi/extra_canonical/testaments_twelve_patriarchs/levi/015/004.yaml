reference: Testament of Levi 15:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹⁷ εἰ μὴ¹⁸ δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ *τῶν πατέρων ἡμῶν ἔλεος λήψεσθε¹⁹, εἷς²⁰ ἐκ τοῦ σπέρματος²¹ ὑμῶν²² *οὐ μὴ²³ καταλειφθῇ²⁴ ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/004.yaml
  text: And if it were not for Abraham and Isaac and Jacob, our fathers, you would receive no mercy; not one of your seed would be left on the earth.
translation:
  language: hi
  text: और यदि हमारे पूर्वज अब्राहम, इसहाक और याकूब के कारण तुम्हें दया न मिलती, तो तुम्हारे वंश में से एक भी पृथ्वी पर शेष न रहता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वज
  rationale: ‘पितरों’ की अपेक्षा आधुनिक सामान्य हिन्दी में अधिक सहज है और यहाँ अब्राहम, इसहाक और याकूब के लिए सामूहिक आदरसूचक वंशगत अर्थ देता है।
- source_word: ἔλεος λήψεσθε
  choice: तुम्हें दया न मिलती
  rationale: शाब्दिक अर्थ ‘तुम दया प्राप्त करते’ है; शर्तात्मक वाक्य और εἰ μή के निषेध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἐκ τοῦ σπέρματος ὑμῶν
  choice: तुम्हारे वंश में से
  rationale: σπέρμα का यहाँ जैविक ‘बीज’ नहीं, वंशजों का सामूहिक अर्थ है; ‘में से’ मूल ἐκ को सुरक्षित रखता है।
- source_word: οὐ μὴ καταλειφθῇ
  choice: एक भी ... शेष न रहता
  rationale: οὐ μή के प्रबल निषेध और निष्क्रिय καταλειφθῇ को हिन्दी के जोरदार, स्वाभाविक निषेध में रखा गया है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: मूल के व्यापक स्थल-सूचक अर्थ का सीधा और गरिमापूर्ण अनुवाद।
theological_decisions:
- issue: पूर्वजों के कारण दया मिलने का कथन
  choice: ‘हमारे पूर्वज ... के कारण तुम्हें दया न मिलती’
  alternative: ‘हमारे पूर्वजों की खातिर तुम पर दया न की जाती’
  rationale: δι᾽ का कारण अथवा मध्यस्थ आधार वाला अर्थ खुला रखा गया है; पाठ में उनके गुण, प्रार्थना या वाचा में से किसी एक को स्पष्ट कारण बनाकर नहीं जोड़ा गया।
- issue: भविष्यवाणी और शर्तात्मक प्रतिकल्पना का संबंध
  choice: ‘न मिलती ... शेष न रहता’
  alternative: ‘न मिलेगी ... शेष नहीं छोड़ा जाएगा’
  rationale: εἰ μή के प्रतिकल्पनात्मक आशय को हिन्दी में सुसंगत शर्तात्मक रूप दिया गया है, जबकि मूल के परिणाम की कठोरता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। नामों के बीच अल्पविराम और ‘हमारे पूर्वज’ को पहले रखकर यूनानी संबंध को स्पष्ट तथा हिन्दी वाक्य-विन्यास को स्वाभाविक बनाया गया है।
