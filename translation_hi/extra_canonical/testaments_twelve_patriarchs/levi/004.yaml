  language: hi
  text: '**लेवी का वसीयतनामा 4**


    **1.** इसलिए अब जान ले कि प्रभु मनुष्यों के पुत्रों का न्याय करेगा। क्योंकि जब चट्टानें फट रही होंगी, सूर्य बुझ रहा होगा, जल सूख रहे होंगे, आग सहम रही होगी, सारी सृष्टि हिलाई जा रही होगी, अदृश्य आत्माएँ पिघल रही होंगी और परमप्रधान के दुःख भोगने पर अधोलोक लूटा जा रहा होगा[a], तब भी मनुष्य अनाज्ञाकारिता में अड़े रहेंगे और अपने अन्याय के कामों में लगे रहेंगे। इसलिए उनका न्याय और भी बड़े दंड के द्वारा किया जाएगा।


    **2.** परमप्रधान ने तेरी प्रार्थना सुन ली है कि वह तुझे अधर्म से अलग करे और तू उसके लिए पुत्र, सेवक और उसकी उपस्थिति में सेवा करनेवाला बने।


    **3.** तू याकूब के बीच ज्ञान का प्रकाश चमकाएगा और इस्राएल के सारे वंश के लिए सूर्य के समान होगा।


    **4.** तुझे और तेरे सारे वंश को आशीष दी जाएगी, जब तक प्रभु अपने पुत्र[b] की करुणा में सब जातियों की सुधि लेगा—सदा के लिए।[c]


    **5.** इसी कारण तुझे बुद्धि और समझ दी गई है, ताकि तू इस विषय में अपने पुत्रों को समझाए।


    **6.** क्योंकि जो उसे[d] आशीष देंगे, वे आशीष पाएँगे, और जो उसे शाप देंगे, वे नष्ट हो जाएँगे।'
