    text: “परमप्रधान के दुःख भोगने पर” वाक्यांश प्रदत्त यूनानी संस्करण में कोष्ठकों में है, जो इसके पाठगत रूप पर संदेह दर्शाता है।
    reason: महत्त्वपूर्ण पाठगत अनिश्चितता और धर्मवैज्ञानिक तनाव को प्रकट करना।
  - marker: b
    text: “पुत्र” शब्द यूनानी पाठ में कोष्ठकित है; कुछ पाठ-रूपों में यह शब्द न रहा हो सकता है। “सदा के लिए” का पिछले वाक्यांशों से ठीक संबंध भी पूरी तरह स्पष्ट नहीं है।
    reason: कोष्ठकित शब्द और वाक्यरचनात्मक अस्पष्टता को सुरक्षित रखना।
  - marker: c
    text: 'कुछ पाठ-साक्ष्यों में यहाँ यह वाक्य मिलता है: “फिर भी तेरे पुत्र उसे खंभे पर चढ़ाने के लिए उस पर हाथ डालेंगे।” प्रदत्त संस्करण इसे संदेहास्पद अंश के रूप में कोष्ठकों में रखता है।'
    reason: मुख्य पाठ से बाहर रखे गए दीर्घ और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण पाठांतर को दर्ज करना, बिना ἀνασκολοπίζω को किसी अधिक विशिष्ट दंड-विधि के रूप में निश्चित किए।
  - marker: d
    text: यहाँ “उसे” किसके लिए है, यूनानी पाठ स्पष्ट नहीं करता। निकट संदर्भ में यह पुत्र या प्रभु की ओर संकेत कर सकता है।
    reason: सर्वनाम के धर्मवैज्ञानिक रूप से महत्त्वपूर्ण अस्पष्ट पूर्वपद को अनसुलझा रखना।
