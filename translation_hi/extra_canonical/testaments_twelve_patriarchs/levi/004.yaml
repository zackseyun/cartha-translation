  rationale: शाब्दिक ‘अंतरंग अंगों में’ के स्थान पर करुणा और गहरे स्नेह का स्रोतार्थ देता है।
- source_word: σπέρματι
  choice: वंश
  rationale: सामूहिक संतति के अर्थ में आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: συνετίσαι
  choice: समझाए
  rationale: समझ-बूझ प्रदान करने या विवेकी बनाने का भाव सरल और वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमप्रधान के दुःख भोगने का कथन
  choice: मुख्य पाठ में रखा और पाठगत संदेह की टिप्पणी दी
  alternative: वाक्यांश हटाना अथवा इसे किसी पूर्वनिर्धारित मसीही अर्थ में स्पष्ट करना
  rationale: वाक्यांश प्रदत्त यूनानी में है, यद्यपि कोष्ठक इसकी पाठगत अनिश्चितता दिखाते हैं; अनुवाद इसे न हटाता है, न इसका विषय बदलता है।
- issue: ‘उसके पुत्र’ का पाठ
  choice: पुत्र को मुख्य पाठ में रखा
  alternative: ‘उसकी करुणा’ पढ़ना, जिसमें पुत्र का उल्लेख न हो
  rationale: υἱοῦ प्रदत्त पाठ में कोष्ठकित है, अतः उसे अनुवादित करते हुए पाठगत अस्थिरता स्पष्ट की गई है।
- issue: पद 4 का दीर्घ कोष्ठकित वाक्य
  choice: मुख्य पाठ में न रखकर पादटिप्पणी में पाठांतर के रूप में दिया
  alternative: ‘फिर भी तेरे पुत्र उसे क्रूस पर चढ़ाने के लिए उस पर हाथ डालेंगे’ मुख्य पाठ में रखना
  rationale: पूरा वाक्य प्रदत्त संस्करण में कोष्ठकित है और परामर्श-पाठ भी इसे मुख्य पाठ से बाहर रखता है; टिप्पणी साक्ष्य को छिपने नहीं देती।
- issue: पद 6 में αὐτόν का पूर्वपद
  choice: अस्पष्ट सर्वनाम ‘उसे’ बनाए रखा
  alternative: स्पष्ट रूप से ‘प्रभु’, ‘पुत्र’ या ‘लेवी’ कहना
  rationale: यूनानी पुल्लिंग सर्वनाम का संदर्भ संदर्भानुसार विवादास्पद हो सकता है; अनुवाद किसी एक धर्मवैज्ञानिक पहचान को आरोपित नहीं करता।
- issue: ἕως αἰῶνος का संबंध
  choice: डैश के साथ ‘सदा के लिए’ रखा
  alternative: इसे केवल आशीष, केवल सुधि लेने, अथवा ‘पुत्र’ से निश्चित रूप से जोड़ना
  rationale: यूनानी पदक्रम संबंध में कुछ अस्पष्टता छोड़ता है; विराम-चिह्न इसे पूरी तरह हल नहीं करता।
