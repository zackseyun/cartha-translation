  register: आधुनिक मानक हिन्दी, देवनागरी और सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘तू/तेरी’ एकवचन संबोधन मूल की निकटता और वसीयतनामाई भाषण को बनाए रखता है। भविष्यकालीन दृश्य में सतत क्रियाओं का प्रयोग यूनानी वर्तमान कृदंतों की नाटकीयता देता है। ‘यहोवा’ जैसे किसी विशिष्ट परंपरागत नाम के बजाय Κύριος के लिए ‘प्रभु’ रखा गया है।
