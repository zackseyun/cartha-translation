  choice: उसकी उपस्थिति में सेवा करनेवाला
  rationale: λειτουργός के सेवकीय/उपासकीय भाव और πρόσωπον के ‘सम्मुख/उपस्थिति’ अर्थ दोनों को सुरक्षित रखता है।
- source_word: ἐπισκέψεται
  choice: सुधि लेने न आए
  rationale: क्रिया में देखने, ध्यान देने और हस्तक्षेप करने का भाव है; हिन्दी बाइबलीय प्रयोग ‘सुधि लेना’ इसे संक्षेप में व्यक्त करता है।
- source_word: ἐν σπλάγχνοις
