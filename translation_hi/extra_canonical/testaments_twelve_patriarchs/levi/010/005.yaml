base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/005.yaml
  text: For the house that the Lord will choose shall be called Jerusalem, as the book of Enoch the righteous contains.
translation:
  language: hi
  text: क्योंकि जिस भवन को प्रभु चुनेगा, वह यरूशलेम कहलाएगा, जैसा धर्मी हनोक की पुस्तक में लिखा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  choice: भवन
  rationale: संदर्भ में चुने गए पवित्र स्थान या मंदिर-सदृश भवन का संकेत है; ‘भवन’ मूल के स्थानगत अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκλέξεται
  choice: चुनेगा
  rationale: ग्रीक भविष्यकालीन मध्यम रूप का सीधा और स्वाभाविक अर्थ।
- source_word: Ἱερουσαλήμ κληθήσεται
  choice: यरूशलेम कहलाएगा
  rationale: निष्क्रिय भविष्यकाल और नामकरण की भाषा को निकटता से सुरक्षित रखता है।
- source_word: περιέχει
  choice: में लिखा है
  rationale: शाब्दिक ‘समाहित है/रखती है’ की अपेक्षा पुस्तक में किसी कथन के पाए जाने का स्वाभाविक आधुनिक हिन्दी प्रयोग।
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: धर्मी हनोक
  rationale: सम्बन्धकारक पद को उस हनोक की पहचान बताने वाले विशेषण के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘भवन’ और ‘यरूशलेम’ का संबंध
  choice: मूल के अनुसार भवन को ही ‘यरूशलेम’ कहलाने दिया गया
  alternative: ‘वह स्थान यरूशलेम कहलाएगा’ या इसे मंदिर के रूप में स्पष्ट करना
  rationale: ग्रीक पाठ οἶκος कहता है और असामान्य धार्मिक-स्थानगत तनाव को स्वयं स्पष्ट नहीं करता; इसलिए व्याख्यात्मक समाधान नहीं जोड़ा गया।
- issue: नवीनतम अंग्रेज़ी संशोधन में जोड़ा गया ‘and for a curse’
  choice: अनुवाद में शामिल नहीं किया गया
  alternative: ‘और शाप के लिए’ जोड़ना
  rationale: प्रदत्त Greek source-fix v2 पाठ में καὶ εἰς κατάραν उपस्थित नहीं है। मूल-भाषा साक्ष्य को अंग्रेज़ी परामर्श-पाठ पर प्राथमिकता दी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। वाक्य की भविष्यवाणीय शैली तथा मूल की असामान्य नामकरण-रचना सुरक्षित रखी गई है।
