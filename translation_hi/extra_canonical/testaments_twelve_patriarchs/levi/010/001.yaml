  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/001.yaml
  text: And now, children, keep what I command you, since I have declared to you all that I heard from my fathers.
translation:
  language: hi
  text: और अब, बच्चो, जो कुछ मैं तुम्हें आज्ञा देता हूँ, उसका पालन करो, क्योंकि जो कुछ मैंने अपने पूर्वजों से सुना, वह सब मैंने तुम्हें बता दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: पालन करो
  rationale: यह क्रिया किसी आदेश को सँभालकर रखने के साथ उसका आचरण करने का भाव देती है; आधुनिक हिन्दी में ‘पालन करो’ सबसे स्वाभाविक है।
- source_word: τέκνα
  choice: हे मेरे बच्चो
  rationale: प्रत्यक्ष आत्मीय संबोधन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρὰ τῶν πατέρων μου
  choice: अपने पूर्वजों से
  rationale: यहाँ πατέρες वंश के पहले के पिताओं/पुरखों को सूचित करता है; ‘पूर्वज’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: ἀνήγγειλα
  choice: बता दिया है
  rationale: सुनाई हुई बातों को उन तक पहुँचा देने की पूर्णता व्यक्त करता है; ‘घोषणा की’ की तुलना में पारिवारिक उपदेश के प्रसंग में अधिक स्वाभाविक है।
