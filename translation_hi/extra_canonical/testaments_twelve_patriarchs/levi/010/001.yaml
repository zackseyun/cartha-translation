review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the imperative φυλάξατε, the content introduced by ὅσα, and the causal relation marked by ἐπειδή. However, it adds “मेरे” (“my”) to τέκνα, although the Greek only says “children.” The paired completed actions are better represented with consistent perfective Hindi: “मैंने … सुना” / “बता दिया है.”'
  naturalness: The Hindi is clear and suitably dignified. Removing the unnecessary possessive also makes the direct address more restrained and closer to the source. “पूर्वजों” is natural modern Hindi for the ancestral sense of πατέρων in this context.
  terminology: “आज्ञा देता हूँ” and “उसका पालन करो” naturally render ἐντέλλομαι and φυλάξατε. “पूर्वजों” appropriately communicates the likely ancestral/forefathers sense without imposing a more specific interpretation.
  issues:
  - severity: medium
    issue: The translation adds “मेरे” in “हे मेरे बच्चो.”
    rationale: τέκνα is an address, “children,” and μου does not modify it; μου occurs only with “fathers.” The added possessive should be removed.
  - severity: low
    issue: The Hindi past forms are not fully parallel.
    rationale: “मैंने … सुना था” followed by “बता दिया है” is understandable, but “मैंने … सुना, वह सब मैंने … बता दिया है” more cleanly reflects the source’s two completed actions.
  revised_text: और अब, बच्चो, जो कुछ मैं तुम्हें आज्ञा देता हूँ, उसका पालन करो, क्योंकि जो कुछ मैंने अपने पूर्वजों से सुना, वह सब मैंने तुम्हें बता दिया है।
