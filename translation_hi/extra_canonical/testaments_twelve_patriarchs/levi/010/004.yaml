revisions:
- from: और तुम बंदी होकर जाति-जाति के लोगों में तितर-बितर कर दिए जाओगे, और वहाँ तुम निंदा और शाप का कारण बनोगे।
  to: और तुम बंदी बनाकर राष्ट्रों के बीच तितर-बितर कर दिए जाओगे, और वहाँ तुम निंदा और शाप ठहरोगे।
  rationale: The revision replaces an unnatural and overly specific rendering of “among the nations” with “राष्ट्रों के बीच,” and replaces the causal paraphrase “का कारण बनोगे” with “ठहरोगे,” which more directly preserves the Greek predicate construction and its ambiguity. No footnotes are required.
