review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the future passive scattering, captivity, location among the nations, and the ensuing disgrace and curse. However, “जाति-जाति के लोगों में” is not an accurate or natural equivalent of ἐν τοῖς ἔθνεσιν, which denotes the nations/peoples collectively. “निंदा और शाप का कारण” shifts the predicate εἰς ὄνειδος καὶ εἰς κατάραν toward causing reproach and curse, rather than becoming a reproach and a curse.
  naturalness: The sentence is generally fluent, but “जाति-जाति के लोगों में” is cumbersome and unnatural in modern standard Hindi. “राष्ट्रों के बीच” is concise, natural, and faithful. “निंदा और शाप ठहरोगे” is a suitably formal, intelligible prophetic expression.
  terminology: “बंदी बनाकर” conveys αἰχμάλωτοι clearly in context. “राष्ट्रों” appropriately renders ἔθνεσιν without importing a narrower ethnic sense. “निंदा” and “शाप” preserve the parallel terms ὄνειδος and κατάρα; the revised predicate avoids interpreting them as effects caused by the people.
  issues:
  - severity: medium
    issue: The rendering “जाति-जाति के लोगों में” for ἐν τοῖς ἔθνεσιν is awkward and semantically imprecise.
    rationale: The Greek refers to the nations, not specifically to ‘people of various castes/ethnic groups.’ “राष्ट्रों के बीच” is the standard modern Hindi equivalent.
  - severity: medium
    issue: “निंदा और शाप का कारण बनोगे” adds a causal sense to εἰς ὄνειδος καὶ εἰς κατάραν.
    rationale: The Greek presents the people themselves as becoming a reproach and a curse. The revision retains this predicate sense without deciding further whether the curse is spoken by others or reflects a broader cursed condition.
  revised_text: और तुम बंदी बनाकर राष्ट्रों के बीच तितर-बितर कर दिए जाओगे, और वहाँ तुम निंदा और शाप ठहरोगे।
  revised_footnotes: []
  revision_rationale: The revision replaces an unnatural and overly specific rendering of “among the nations” with “राष्ट्रों के बीच,” and replaces the causal paraphrase “का कारण बनोगे” with “ठहरोगे,” which more directly preserves the Greek predicate construction and its ambiguity. No footnotes are required.
