  text: And you will be scattered as captives among the nations, and there you will be for a reproach and a curse.
translation:
  language: hi
  text: और तुम बंदी बनाकर राष्ट्रों के बीच तितर-बितर कर दिए जाओगे, और वहाँ तुम निंदा और शाप ठहरोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασπαρήσεσθε
  choice: तितर-बितर कर दिए जाओगे
  rationale: यूनानी भविष्यकालीन कर्मवाच्य का स्पष्ट और स्वाभाविक हिन्दी रूप; इसमें बिखेर दिए जाने का भाव सुरक्षित है।
- source_word: αἰχμάλωτοι
  choice: बंदी होकर
  rationale: यह बहुवचन विशेषण उनकी बंदी अवस्था को बताता है; हिन्दी में क्रियाविशेषणीय रूप अधिक स्वाभाविक है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: जाति-जाति के लोगों में
  rationale: ἔθνη का अर्थ यहाँ इस्राएल से बाहर की विभिन्न जनजातियाँ या राष्ट्र हैं; यह रूप बहुलता और लोगों के बीच बिखराव दोनों को सहज ढंग से व्यक्त करता है।
- source_word: εἰς ὄνειδος
  choice: निंदा का कारण
  rationale: शाब्दिक ‘निंदा के लिए’ की अपेक्षा यह आधुनिक हिन्दी में उस अपमानजनक स्थिति को अधिक स्पष्टता से व्यक्त करता है।
- source_word: εἰς κατάραν
  choice: शाप का कारण
  rationale: समानान्तर εἰς-वाक्यांश को सुरक्षित रखते हुए उस दशा को व्यक्त करता है जिसमें वे शाप का उदाहरण या विषय बनेंगे।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: पूर्वोक्त जातियों के बीच की स्थिति की ओर स्पष्ट संकेत करता है।
theological_decisions:
- issue: ‘निंदा और शाप’ का आशय
  choice: निंदा और शाप का कारण बनोगे
  alternative: निंदा और शाप ठहरोगे
  rationale: εἰς ὄνειδος καὶ εἰς κατάραν परिणाम या दशा को व्यक्त करता है। चुना हुआ रूप अर्थ को स्वाभाविक हिन्दी में देता है, पर यह तय नहीं करता कि शाप केवल बोला गया अपशब्द है, दैवी दंड है, या दूसरों द्वारा प्रयुक्त शाप का उदाहरण।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गंभीर और भविष्यवाणी-सदृश रखा गया है। वाक्य-संरचना मूल यूनानी के दो समन्वित खंडों को बनाए रखती है, जबकि अप्राकृतिक शाब्दिकता से बचती है।
