source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ΓΚαὶ ἰδοὺ⁴⁾ ἀθῷός εἰμι⁵ τῆς⁶ ἀσεβείας⁷ ὑμῶν⁸ *καὶ παραβάσεως⁹ ἣν ποιήσετε ἐπὶ *τῇ συντελείᾳ¹⁰ *τῶν αἰώνων¹¹ [εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν]¹² *πλανῶντες τὸν Ἰσραήλ¹³, καὶ ἐπεγείροντες¹⁴ *ἐπ᾿ αὐτὸν¹⁵ κακὰ μεγάλα¹⁶ *παρὰ Κυρίου¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/002.yaml
  text: And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils against him from the Lord.
translation:
  language: hi
  text: और देखो, मैं तुम्हारी उस अधर्मता और अपराध से निर्दोष हूँ, जिसे तुम युगों की पूर्णता के समय [संसार के उद्धारकर्ता, मसीह के विरुद्ध][a] करोगे; तुम इस्राएल को भटकाओगे और प्रभु की ओर से उसके विरुद्ध बड़ी विपत्तियाँ भड़काओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकबद्ध शब्द दिए गए यूनानी पाठ में पाठगत रूप से अनिश्चित चिह्नित हैं।
    reason: स्रोत-संस्करण के वर्ग कोष्ठकों का महत्व पाठक को बताना आवश्यक है।
lexical_decisions:
- source_word: ἀθῷός εἰμι
  choice: मैं ... से निर्दोष हूँ
  rationale: यह न्यायिक और नैतिक निर्दोषता का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: ἀσεβείας ... καὶ παραβάσεως
  choice: अधर्मता और अपराध
  rationale: ἀσέβεια ईश्वर-विरोधी अधर्मता को और παράβασις सीमा या आज्ञा के उल्लंघन को व्यक्त करता है; दोनों पद अलग रखे गए हैं।
- source_word: ἐπὶ τῇ συντελείᾳ τῶν αἰώνων
  choice: युगों की पूर्णता के समय
  rationale: बहुवचन αἰώνων और συντέλεια की समाप्ति/परिपूर्ण परिणति—दोनों को सुरक्षित रखता है।
- source_word: πλανῶντες τὸν Ἰσραήλ
  choice: इस्राएल को भटकाओगे
  rationale: वर्तमान कृदन्त मुख्य भविष्यकालीन क्रिया से जुड़ा है; हिन्दी में समान भविष्यकालीन क्रिया अधिक स्वाभाविक है।
- source_word: κακὰ μεγάλα
  choice: बड़ी विपत्तियाँ
  rationale: संदर्भ में κακά नैतिक बुरे कर्मों के बजाय आने वाली हानियों या आपदाओं को सूचित कर सकता है; ‘विपत्तियाँ’ हिन्दी में इस आशय को स्पष्ट और स्वाभाविक रखता है।
- source_word: παρὰ Κυρίου
  choice: प्रभु की ओर से
  rationale: παρά के स्रोत-सूचक अर्थ को बनाए रखता है और विपत्तियों को प्रभु से आने वाला बताता है।
theological_decisions:
- issue: कोष्ठकबद्ध मसीही वाक्यांश की पाठगत स्थिति
  choice: '[संसार के उद्धारकर्ता, मसीह के विरुद्ध] को वर्ग कोष्ठकों में रखा'
  alternative: इसे बिना कोष्ठक मुख्य पाठ में मिला देना या हटा देना
  rationale: दिए गए यूनानी स्रोत में यह वाक्यांश वर्ग कोष्ठकों में है; इसलिए उसकी पाठगत अनिश्चितता को मिटाए बिना अर्थ प्रस्तुत किया गया है।
- issue: ‘उसके विरुद्ध’ का संबंध
  choice: इसे ‘बड़ी विपत्तियाँ खड़ी करोगे’ से जोड़ा
  alternative: इसे केवल पूर्ववर्ती अपराध या इस्राएल को भटकाने से जोड़ना
  rationale: यूनानी क्रम ἐπεγείροντες ἐπ᾿ αὐτὸν κακὰ μεγάλα इस संबंध का समर्थन करता है, यद्यपि वाक्य की पाठगत जटिलता बनी रहती है।
- issue: प्रभु और मसीह के बीच दंडात्मक संबंध
  choice: ‘प्रभु की ओर से उसके विरुद्ध’ को यथावत रखा
  alternative: तनाव घटाने के लिए ‘उसके कारण’ या ‘तुम्हारे विरुद्ध’ करना
  rationale: स्रोत का व्याकरण प्रभु को विपत्तियों का स्रोत और ‘उसे’ उनका लक्ष्य बनाता है; कठिन धार्मिक तनाव को चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘और देखो’ ने मूल के उद्घोषात्मक Καὶ ἰδού को बनाए रखा है; अर्धविराम से कृदन्तीय उपवाक्यों को स्वाभाविक हिन्दी भविष्यकाल में जोड़ा गया है।
