id: T12P.LEV.10.3
reference: Testament of Levi 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνομήσετε¹⁸ *ἐν τῷ¹⁹ Ἰσραήλ²⁰, ὥστε μὴ βαστάζειν²¹ τὴν²² Ἱερουσαλήμ²³ ἀπὸ προσώπου τῆς²⁴ πονηρίας ὑμῶν, ἀλλὰ σχισθήσεται²⁵ τὸ καταπέτασμα²⁶ τοῦ ναοῦ, ὥστε μὴ καλύψαι²⁷ τὴν²⁸ ἀσχημοσύνην ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/003.yaml
  text: And you will act lawlessly in Israel, so that Jerusalem will not be able to bear your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame.
translation:
  language: hi
  text: और तुम इस्राएल में अधर्म करोगे, यहाँ तक कि यरूशलेम तुम्हारी दुष्टता को सह न सकेगा; बल्कि मन्दिर का परदा फट जाएगा, ताकि वह तुम्हारी लज्जा को ढक न सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομήσετε
  choice: अधर्म करोगे
  rationale: क्रिया का अर्थ व्यवस्था-विरोधी या अधर्मपूर्ण आचरण करना है; यह चयन उसके नैतिक और धार्मिक दोनों आयामों को बनाए रखता है।
- source_word: βαστάζειν
  choice: सह सकेगा
  rationale: यहाँ यरूशलेम द्वारा उनकी दुष्टता का भार सह न पाने का भाव है; प्राकृतिक हिन्दी में ‘सहना’ इस रूपक को स्पष्ट रखता है।
- source_word: πονηρίας
  choice: दुष्टता
  rationale: यह शब्द नैतिक बुराई और दुष्ट आचरण को सूचित करता है।
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: मन्दिर का परदा
  rationale: καταπέτασμα पवित्र स्थान के परदे को दर्शाता है; पाठ स्वयं उसकी अधिक विशिष्ट स्थिति नहीं बताता।
- source_word: ἀσχημοσύνην
  choice: लज्जा
  rationale: सन्दर्भ में इसका आशय शर्मनाकता या अपमानजनक दशा से है; ‘लज्जा’ सहज और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: मन्दिर के परदे के फटने का आशय
  choice: वाक्य को बिना व्याख्यात्मक विस्तार के प्रत्यक्ष भविष्यवाणी के रूप में रखा गया है।
  alternative: इसे किसी विशिष्ट ऐतिहासिक घटना या प्रायश्चित्त-सिद्धान्त से स्पष्ट रूप से जोड़ना।
  rationale: मूल पद ऐसा संबंध स्वयं स्पष्ट नहीं करता; अनुवाद में धार्मिक व्याख्या आरोपित नहीं की गई।
- issue: यरूशलेम का दुष्टता को न सह पाना
  choice: नगर का मानवीकरण सुरक्षित रखा गया है।
  alternative: ‘तुम्हारी दुष्टता के कारण यरूशलेम नष्ट हो जाएगा।’
  rationale: मूल βαστάζειν का ‘उठाना/सहना’ भाव है और वह विनाश को स्पष्ट रूप से नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘मन्दिर’ और ‘परदा’ सामान्य पाठक के लिए स्पष्ट हैं; मूल का कारण-परिणाम और मानवीकरण सुरक्षित रखा गया है।
