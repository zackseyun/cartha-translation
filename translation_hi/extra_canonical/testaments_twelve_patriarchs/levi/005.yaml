  text: 'And in this[a], the angel opened to me the gates of heaven, and I saw the holy Most High seated on a throne.


    2 And he said to me, “Levi, to you I have given the blessings of the priesthood until, having come, I dwell in the midst of Israel.”


    3 Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Carry out vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”


    4 And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers[b].


    5 And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in a day of affliction.”


    6 And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down utterly; for every evil spirit attacks it.”


    7 And after this, when I awoke, I blessed the Most High.'
translation:
  language: hi
  text: '**लेवी का वसीयतनामा 5**


    **1** इसी दर्शन के दौरान[a] स्वर्गदूत ने मेरे लिए स्वर्ग के द्वार खोल दिए, और मैंने पवित्र परमप्रधान को सिंहासन पर बैठे देखा।


    **2** उसने मुझसे कहा, “लेवी, मैंने तुझे पुरोहिताई की आशीषें दी हैं, जब तक मैं आकर इस्राएल के बीच निवास करूँ।”


    **3** तब स्वर्गदूत मुझे नीचे पृथ्वी पर ले आया और उसने मुझे एक हथियार और एक तलवार दी। उसने मुझसे कहा, “अपनी बहन दीना के लिए शकेम में बदला ले। मैं तेरे साथ रहूँगा, क्योंकि प्रभु ने मुझे भेजा है।”


    **4** उस समय मैंने हमोर के पुत्रों का अंत कर दिया, जैसा कि पूर्वजों की पटियाओं[b] पर लिखा है।


    **5** मैंने उससे कहा, “हे प्रभु, मैं तुझसे विनती करता हूँ, मुझे अपना नाम बता, ताकि संकट के दिन मैं तुझे पुकार सकूँ।”


    **6** उसने कहा, “मैं वह स्वर्गदूत हूँ जो इस्राएल के वंश की ओर से विनती करता है, ताकि वे मारे न जाएँ।”[c]


    **7** इसके बाद जब मैं जागा, तो मैंने परमप्रधान को धन्य कहा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध का शाब्दिक अर्थ “और इसमें” है। इसका सटीक सन्दर्भ अस्पष्ट है; प्रसंग में यह चल रहे दर्शन की ओर संकेत करता जान पड़ता है।
    reason: textual_difficulty
  - marker: b
    text: यूनानी में शाब्दिक रूप से “पूर्वजों की पटियाओं पर” है। दर्शनात्मक प्रसंग में इससे स्वर्गीय पटियाएँ अभिप्रेत हो सकती हैं, पर “स्वर्गीय” शब्द उपलब्ध पाठ में स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: c
    text: इस पद का यूनानी पाठ अर्थगत रूप से कठिन है। यहाँ इसे इस्राएल की ओर से रक्षात्मक विनती के रूप में समझा गया है। कुछ पाठ-परम्पराएँ वाक्य को बढ़ाकर इस भाव को अधिक स्पष्ट करती हैं कि इस्राएली पूरी तरह नष्ट न किए जाएँ; वह विस्तार मुख्य पाठ में शामिल नहीं किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιον ὕψιστον
  choice: पवित्र परमप्रधान
  rationale: दोनों पदों की श्रद्धापूर्ण उपाधिगत शक्ति को बनाए रखता है और हिन्दी में स्वाभाविक दिव्य उपाधि देता है।
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: पुरोहिताई की आशीषें
  rationale: 'सम्बन्धकारक रचना को स्पष्ट रखता है: ये पुरोहित पद से जुड़ी आशीषें हैं।'
- source_word: ἕως ἐλθὼν κατοικήσω ἐν μέσῳ τοῦ Ἰσραήλ
  choice: जब तक कि मैं आकर इस्राएल के बीच निवास न करूँ
  rationale: प्रथम पुरुष और कालगत ἕως को बनाए रखते हुए कृदन्तीय रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅπλον καὶ ῥομφαίαν
  choice: एक हथियार और एक तलवार
  rationale: ὅπλον का व्यापक अर्थ ‘हथियार’ सुरक्षित रखता है; इसे अनुमान के आधार पर ‘ढाल’ तक सीमित नहीं करता।
- source_word: Ποίησον ἐκδίκησιν
  choice: बदला ले
  rationale: आज्ञार्थक और प्रतिशोधात्मक अर्थ को साधारण आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: συνετέλεσα
  choice: अंत कर दिया
  rationale: हिंसक प्रसंग में किसी को पूर्णतः समाप्त कर देने का परिणामी भाव सुरक्षित रहता है।
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: पूर्वजों की पटियाओं पर
  rationale: यूनानी पाठ में स्पष्ट ‘स्वर्गीय’ विशेषण जोड़े बिना शाब्दिक सम्बन्ध बनाए रखता है।
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: संकट के दिन
  rationale: एक प्रतिनिधिक विपत्ति-काल के एकवचन मुहावरे और गरिमापूर्ण शैली को बनाए रखता है।
- source_word: ὁ ἄγγελος ὁ παραιτούμενος τὸ γένος Ἰσραήλ
  choice: वह स्वर्गदूत जो इस्राएल के वंश की ओर से विनती करता है
  rationale: कठिन participle को अगले उद्देश्य-वाक्य के अनुरूप मध्यस्थतापूर्ण विनती के रूप में प्रस्तुत करता है, पर पाठगत कठिनाई पादटिप्पणी में बताई गई है।
- source_word: ἔξυπνος γενόμενος
  choice: जब मैं जागा
  rationale: दर्शन अथवा स्वप्न के बाद जागने वाले यूनानी कृदन्तीय मुहावरे का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: पद 2 में प्रथम पुरुष में बोलने वाले की पहचान
  choice: वचन को प्रथम पुरुष में ज्यों का त्यों रखा गया है और उसे सिंहासन पर विराजमान परमप्रधान से जुड़ा पढ़ने की सम्भावना खुली रखी गई है।
  alternative: स्वर्गदूत परमेश्वर की ओर से बोल रहा हो सकता है, अथवा यहाँ वक्ता-परिवर्तन से जुड़ी पाठ-परम्परा की सिलवट हो सकती है।
  rationale: मूल पाठ वक्ता को पूरी तरह स्पष्ट नहीं करता; इसलिए वचन को परोक्ष कथन बनाकर धर्मवैज्ञानिक तनाव समाप्त नहीं किया गया।
- issue: ‘पूर्वजों की पटियाओं’ का सन्दर्भ
  choice: मुख्य पाठ में केवल ‘पूर्वजों की पटियाओं’ रखा गया है।
  alternative: दर्शनात्मक साहित्य की परम्परा के आधार पर इन्हें स्वर्गीय, पूर्वलिखित पटियाएँ समझा जा सकता है।
  rationale: ‘स्वर्गीय’ प्रसंगतः सम्भव है, पर उपलब्ध यूनानी में यह विशेषण स्पष्ट रूप से नहीं है।
- issue: पद 6 में स्वर्गदूत की भूमिका
  choice: इस्राएल के वंश की ओर से विनती करने वाला रक्षक मध्यस्थ
  alternative: क्रिया का अर्थ ‘टालने वाला’, ‘क्षमा दिलाने वाला’ अथवा किसी हानि को रोकने वाला भी लिया जा सकता है।
  rationale: παραιτούμενος पाठगत और अर्थगत रूप से कठिन है, किन्तु ‘ताकि वह उन्हें न मारे’ वाला उद्देश्य-वाक्य इस्राएल की रक्षा के लिए विनती का समर्थन करता है।
- issue: पद 6 में ‘वह’ का कर्ता
  choice: सर्वनाम की अस्पष्टता बनाए रखी गई है।
  alternative: ‘वह’ परमेश्वर, प्रभु, अथवा प्रसंग में निहित दण्ड देने वाला हो सकता है।
  rationale: यूनानी infinitive रचना कर्ता को स्पष्ट नाम से नहीं बताती; उसे चुपचाप निश्चित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। ‘तू/तेरे’ का प्रयोग प्राचीन प्रत्यक्ष सम्बोधन की आत्मीय और गंभीर शैली के लिए किया गया है। मूल की वक्ता-संबंधी तथा पाठगत अस्पष्टताओं को मुख्य पाठ या पादटिप्पणियों में सुरक्षित रखा गया है।
