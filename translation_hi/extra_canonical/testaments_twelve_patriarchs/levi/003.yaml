  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
translation:
  language: hi
  text: 1 तब उन आकाशों के विषय में सुन जो तुझे दिखाए गए थे। सबसे निचला आकाश इसी कारण उदास है कि वह मनुष्यों के सारे अधर्म देखता है। 2 उसमें आग, हिम और बर्फ परमेश्वर के धर्मपूर्ण न्याय में न्याय के दिन के लिए तैयार रखे गए हैं; क्योंकि उसमें मनुष्यों के विरुद्ध प्रतिशोध के लिए दंड पहुँचाने वाली सारी आत्माएँ हैं। 3 दूसरे आकाश में सेनाओं की शक्तियाँ हैं, जिन्हें न्याय के दिन भरमाने वाली आत्माओं और बेलियार[b] के विरुद्ध प्रतिशोध लेने के लिए नियुक्त किया गया है; और उनके ऊपर पवित्र जन हैं। 4 सबसे ऊँचे निवास में महान महिमा समस्त पवित्रता से भी ऊपर विराजमान है। 5 उसके बाद वाले आकाश में प्रधान स्वर्गदूत हैं, जो सेवा करते हैं और धर्मियों के अनजाने में हुए सभी पापों के लिए प्रभु के समक्ष प्रायश्चित्त करते हैं[a]। 6 वे प्रभु को मनभावनी सुगंध, अर्थात् एक युक्तिसंगत और रक्तहीन बलि[c], चढ़ाते हैं। 7 उसके नीचे वाले आकाश में वे स्वर्गदूत हैं जो प्रभु के मुखमंडल के स्वर्गदूतों तक उत्तर पहुँचाते हैं। 8 उसके बाद वाले आकाश में सिंहासन और अधिकार हैं, जहाँ परमेश्वर को निरंतर स्तुतिगान चढ़ाए जाते हैं। 9 इसलिए, जब
    प्रभु हमारी ओर दृष्टि करता है, तब हम सब काँपते हैं, और आकाश, पृथ्वी और अथाह गहराई उसके प्रताप के सामने हिल जाते हैं। 10 पर मनुष्य इन बातों के प्रति असंवेदनशील होकर पाप करते हैं और परमप्रधान को क्रोध दिलाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रायश्चित्त करते हैं’ का अनुवाद ‘दोष का निवारण करते हैं’ या ‘प्रभु को प्रसन्न करते हैं’ भी हो सकता है; यूनानी क्रिया यहाँ बलिदानी संदर्भ में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: ‘बेलियार’ यूनानी पाठ में पाए जाने वाले नाम का रूप है; दूसरी परंपराओं में इसे प्रायः ‘बेलियाल’ कहा जाता है।
    reason: lexical_alternative
  - marker: c
    text: ‘युक्तिसंगत और रक्तहीन बलि’ में ‘युक्तिसंगत’ का अर्थ ‘तार्किक’ भी हो सकता है; अधिक व्याख्यात्मक अनुवाद में इसे ‘आत्मिक और रक्तहीन बलि’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνός
  choice: उदास
  rationale: शब्द निचले आकाश के भयावह और विषादपूर्ण स्वरूप को व्यक्त करता है; ‘उदास’ उसके भावात्मक रंग को रखता है, जबकि केवल ‘अँधेरा’ मूल के अर्थ-क्षेत्र को संकुचित कर सकता है।
- source_word: ἀδικίας
  choice: अधर्म
  rationale: नैतिक और धार्मिक अन्याय दोनों को समेटता है और बहुवचन के सामूहिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κρύσταλλον
  choice: बर्फ
  rationale: आग और हिम के साथ दंडकारी प्राकृतिक तत्व के रूप में पठनीय हिन्दी; ‘स्फटिक’ सम्भव है, पर इस प्रसंग में ठोस जमी हुई बर्फ अधिक संगत है।
- source_word: ἐκδίκησις
  choice: प्रतिशोध
  rationale: न्यायिक-प्रलयकालीन प्रसंग में मूल की प्रबल दंडात्मक धार को बनाए रखता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी पाठ के नामरूप को ‘बेलियाल’ से समरूप किए बिना लिप्यंतरित करता है।
- source_word: ἡ μεγάλη δόξα
  choice: महान महिमा
  rationale: ईश्वरीय उपस्थिति के श्रद्धापूर्ण परोक्ष नाम और उपाधिमूलक स्वर को सुरक्षित रखता है।
- source_word: ἐξιλασκόμενοι
  choice: प्रायश्चित्त करते हैं
  rationale: याजकीय और बलिदानी भाषा को स्वाभाविक हिन्दी में रखता है; क्रिया की दिशा ‘प्रभु के सामने’ से स्पष्ट की गई है।
- source_word: ἀγνοίαις
  choice: अनजाने में हुए सभी पापों
  rationale: अज्ञान या अनजाने में किए अपराधों के बलिदानी संदर्भ को स्पष्ट करता है, बिना उन्हें सामान्य भूलों तक सीमित किए।
- source_word: λογικὴν
  choice: बुद्धिसंगत
  rationale: शब्द की ‘युक्तिसंगत/बौद्धिक’ सम्भावना को बनाए रखता है और अधिक व्याख्यात्मक ‘आत्मिक’ को मुख्य पाठ में नहीं रखता।
- source_word: ἀναισθητοῦντες
  choice: संवेदनहीन होकर
  rationale: इन वास्तविकताओं को न समझने या न ग्रहण करने की नैतिक असंवेदनशीलता व्यक्त करता है।
theological_decisions:
- issue: धर्मियों के लिए प्रधान स्वर्गदूतों का याजकीय कार्य
  choice: ‘सेवा करते और ... प्रभु के सामने प्रायश्चित्त करते हैं’
  alternative: ‘प्रभु को प्रसन्न करते हैं’ अथवा सामान्य मध्यस्थ प्रार्थना
  rationale: मूल में स्पष्ट बलिदानी शब्दावली, सुवास और रक्तहीन बलि है; इसलिए इसे केवल प्रार्थना के रूप में हल्का नहीं किया गया।
- issue: महान महिमा की पहचान
  choice: उपाधि के रूप में ‘महान महिमा’
  alternative: सीधे ‘परमेश्वर’
  rationale: मूल की श्रद्धापूर्ण परोक्ष अभिव्यक्ति और रहस्योद्घाटनात्मक तनाव को सुरक्षित रखा गया है।
- issue: दुष्ट सत्ता का नाम
  choice: ‘बेलियार’
  alternative: ‘बेलियाल’
  rationale: यूनानी साक्ष्य के रूप को पारदर्शी ढंग से रखा गया है; परिचित बाइबिलीय रूप को पादटिप्पणी में बताया गया है।
- issue: आकाशीय स्तरों की क्रम-संरचना
  choice: भ्रष्ट/कठिन स्थान-सूचक वाक्यांशों को ‘अगले’ और ‘नीचे वाले’ आकाश के रूप में सावधानी से प्रस्तुत किया
  alternative: अंग्रेज़ी परामर्श-पाठ के अनुसार निश्चित सात-स्तरीय क्रम का पुनर्निर्माण
  rationale: यूनानी पाठ में कुछ स्थानों पर पाठभेद या भ्रष्ट पाठ के चिह्न हैं; अनिश्चितता को अत्यधिक सिद्धांतबद्ध क्रम में नहीं बदला गया।
- issue: 9वें पद का ब्रह्मांडीय कंपना
  choice: प्राप्त यूनानी पाठ के अनुसार प्रभु की दृष्टि पर सबके काँपने और आकाश, पृथ्वी तथा अथाह गहराई के हिलने का वर्णन
  alternative: अंग्रेज़ी परामर्श-पाठ का ‘उसकी पवित्रता की श्रेणी के द्वारा’ तथा पृथ्वी की नींव और गहराइयों का विस्तृत पाठ
  rationale: प्रदत्त यूनानी स्रोत में वे विस्तृत वाक्यांश नहीं हैं; इसलिए मूल-भाषा साक्ष्य को प्राथमिकता दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘आकाश’ बहुस्तरीय स्वर्गीय लोकों के लिए, ‘प्रधान स्वर्गदूत’, ‘सिंहासन’ और ‘अधिकार’ आकाशीय वर्गों के लिए प्रयुक्त हैं। मूल यूनानी में चिह्नित कठिन/भ्रष्ट पाठ को अनावश्यक निश्चितता के साथ पुनर्निर्मित नहीं किया गया; अंग्रेज़ी POB से अलग होने पर यूनानी स्रोत को प्राथमिकता दी गई है।
