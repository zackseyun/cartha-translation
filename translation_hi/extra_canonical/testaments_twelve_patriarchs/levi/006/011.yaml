translation:
  language: hi
  text: परन्तु परमेश्वर का क्रोध उन पर पूरी तरह आ पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔφθασε
  choice: आ पड़ा
  rationale: यहाँ क्रिया उनके ऊपर परमेश्वर के क्रोध के पहुँचने और प्रभावी रूप से आ जाने को व्यक्त करती है; ‘आ पड़ा’ आधुनिक हिन्दी में इस तीव्रता को स्वाभाविक ढंग से रखता है।
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: परमेश्वर का क्रोध
  rationale: यूनानी संबंधवाचक पदबंध का सीधा और धर्मशास्त्रीय रूप से तटस्थ अनुवाद।
- source_word: εἰς τέλος
  choice: पूरी तरह
  rationale: इस प्रसंग में वाक्यांश क्रोध के पूर्ण रूप से आ पहुँचने का भाव देता है; ‘पूरी तरह’ सम्भावित अंतिमता को अनावश्यक रूप से विशेष सिद्धान्त में नहीं बदलता।
theological_decisions:
- issue: εἰς τέλος में पूर्णता अथवा अन्तिम परिणाम का भाव
  choice: पूरी तरह
  alternative: अन्त तक
  rationale: ‘अन्त तक’ कालगत निरन्तरता या अंतिम विनाश का अधिक विशिष्ट अर्थ दे सकता है। ‘पूरी तरह’ यूनानी की पूर्णता को सुरक्षित रखते हुए अस्पष्टता को अधिक नहीं सुलझाता।
