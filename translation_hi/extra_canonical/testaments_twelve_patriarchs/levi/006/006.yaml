reference: Testament of Levi 6:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἤκουσεν²⁶ ὁ πατήρ *μου ⌈ταῦτα⌉²⁷ *καὶ ὀργισθεὶς²⁸ ἐλυπήθη²⁹ ὅτι κατεδέξαντο³⁰ τὴν περιτομὴν καὶ³¹ ἀπέθανον³², *καὶ ἐν ταῖς εὐλογίαις³³ †παρεῖδεν ἡμῖν³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/006.yaml
  text: And my father heard these things, and being angry, he was grieved because they had accepted circumcision and died, and in his blessings he passed over us.
translation:
  language: hi
  text: और मेरे पिता ने ये बातें सुनीं, और क्रोधित होकर वे दुःखी हुए कि उन्होंने खतना स्वीकार किया था और मर गए थे; और अपने आशीर्वादों में उन्होंने हमारी उपेक्षा की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργισθεὶς ἐλυπήθη
  choice: वे क्रोधित हुए और दुःखी भी
  rationale: यूनानी कृदंत और मुख्य क्रिया—क्रोधित होकर दुःखी होना—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखा गया है।
- source_word: κατεδέξαντο τὴν περιτομήν
  choice: उन लोगों ने खतना स्वीकार किया था
  rationale: καταδέχομαι के स्वेच्छापूर्वक मान लेने या स्वीकार करने के भाव को सुरक्षित रखता है।
- source_word: ἀπέθανον
  choice: वे मारे गए थे
  rationale: क्रिया का मूल अर्थ ‘मर गए’ भी हो सकता है, पर प्रसंग में हिंसक मृत्यु की बात है; हिन्दी में ‘मारे गए’ उस संदर्भ को स्वाभाविक रूप से व्यक्त करता है, जबकि कर्मकर्ता नहीं जोड़ता।
- source_word: ἐν ταῖς εὐλογίαις παρεῖδεν ἡμῖν
  choice: अपने आशीर्वादों में उन्होंने हमें छोड़ दिया
  rationale: पाठ की कठिन अंतिम अभिव्यक्ति को बिना अतिरिक्त कारण या व्याख्या जोड़े इस अर्थ में प्रस्तुत किया गया है कि पिता ने आशीर्वाद देते समय उन्हें सम्मिलित नहीं किया।
theological_decisions:
- issue: खतना स्वीकार करने के बाद हुई मृत्यु का निहित तनाव
  choice: ‘खतना स्वीकार किया था, फिर भी वे मारे गए थे’
  alternative: ‘खतना स्वीकार किया और मर गए’
  rationale: ‘फिर भी’ प्रसंग में पिता के दुःख का कारण स्पष्ट करता है—खतना स्वीकार कर लेने पर भी उनकी हत्या हुई—पर किसी धार्मिक सिद्धांत या नैतिक निर्णय को नहीं जोड़ता।
- issue: आशीर्वादों से वंचित किए जाने का स्वरूप
  choice: ‘अपने आशीर्वादों में उन्होंने हमें छोड़ दिया’
  alternative: ‘अपने आशीर्वादों में उन्होंने हमारी उपेक्षा की’
  rationale: ‘छोड़ दिया’ मूल के ‘पास से निकल जाना/ध्यान न देना’ वाले भाव को बनाए रखता है और जानबूझकर तिरस्कार करने की अपेक्षाकृत कठोर व्याख्या से बचता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास को हिन्दी की स्वाभाविक लय के लिए विभाजित किया गया है; मूल पाठ की घटनाओं का क्रम और अंतिम कठिन कथन सुरक्षित हैं।
