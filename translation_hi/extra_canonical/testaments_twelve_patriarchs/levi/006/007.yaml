  language: hi
  text: क्योंकि हमने पाप किया, इसलिए कि हमने यह उसकी इच्छा के विरुद्ध किया था, यद्यपि वह उस दिन निर्बल हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ γνώμην αὐτοῦ
  choice: उसकी इच्छा के विरुद्ध
  rationale: इस प्रसंग में γνώμη किसी के विचार या निर्णय मात्र के बजाय उसकी मंशा अथवा इच्छा को व्यक्त करता है; यह हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: ἐμαλακίσθη
  choice: निर्बल पड़ गया था
  rationale: क्रिया का मूल भाव दुर्बल या शिथिल हो जाना है; यह अनुवाद बिना अनावश्यक व्याख्या जोड़े उस भाव को सुरक्षित रखता है।
- source_word: καίγε
  choice: यद्यपि
  rationale: यहाँ शब्द पूर्व कथन के साथ रियायती विरोध व्यक्त करता है, इसलिए ‘यद्यपि’ उपयुक्त है।
theological_decisions:
- issue: ‘उसकी’ और ‘वह’ के संदर्भ की पहचान
  choice: सर्वनामों को मूल पाठ की तरह अनिर्दिष्ट रखा गया
  alternative: किसी व्यक्ति का नाम जोड़कर संदर्भ स्पष्ट करना
  rationale: इस पद में स्वयं नाम नहीं दिया गया है; नाम जोड़ने से मूल की संदर्भगत अस्पष्टता कृत्रिम रूप से समाप्त हो जाती।
- issue: पाप और विरोधी इच्छा के बीच संबंध
  choice: ‘क्योंकि… चूँकि…’ द्वारा कारण-संबंध बनाए रखा गया
  alternative: इसे दो स्वतंत्र कथनों के रूप में प्रस्तुत करना
  rationale: διότι और ἐπειδή पाप-स्वीकार और उसकी व्याख्या के बीच स्पष्ट कारणात्मक संबंध रखते हैं।
