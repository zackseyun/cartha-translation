id: T12P.LEV.6.8
reference: Testament of Levi 6:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἀλλ᾿ ἐγὼ εἶδον ὅτι ἀπόφασις θεοῦ ἦν εἰς κακὰ³⁸ διότι ἤθελον ἐποίησεν *καὶ τὴν Σαρρὰ³⁹ ⌈καὶ τὴν Ῥεβέκκα⌉⁴⁰ ποιῆσαι ⌈ὃν τρόπον ἐποίησαν *τὴν Δείναν⁴¹ *τὴν ἀδελφὴν ἡμῶν⁴²⌉, καὶ ὁ⁴³ Κύριος ἐκώλυσεν αὐτούς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/008.yaml
  text: But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them.
translation:
  language: hi
  text: पर मैंने देखा कि परमेश्वर ने उनके विरुद्ध विपत्ति का निर्णय किया था, क्योंकि वे सारा और रिबका के साथ भी वही करना चाहते थे जो उन्होंने हमारी बहन दीना के साथ किया था; और प्रभु ने उन्हें रोक दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόφασις θεοῦ
  choice: परमेश्वर ने…निर्णय किया था
  rationale: यूनानी संज्ञात्मक वाक्यांश को स्वाभाविक हिन्दी क्रियात्मक रूप दिया गया है, जबकि इसे परमेश्वर का न्यायिक निर्णय ही रखा गया है।
- source_word: εἰς κακά
  choice: विपत्ति
  rationale: बहुवचन ‘बुरी बातों/अनिष्टों’ का प्रसंगानुकूल सामूहिक अर्थ है; ‘विपत्ति’ दंडात्मक अनिष्ट को व्यक्त करती है, पर ‘विनाश’ जैसा अधिक निश्चित अर्थ नहीं जोड़ती।
- source_word: ποιῆσαι ὃν τρόπον ἐποίησαν
  choice: के साथ भी वही करना…जो उन्होंने…के साथ किया था
  rationale: मूल की संयत, पर स्पष्ट संकेतात्मक भाषा को बनाए रखा गया है; यौन हिंसा का विवरण पाठ में न होने के कारण उसे खुलकर नहीं जोड़ा गया।
- source_word: ἐκώλυσεν
  choice: रोक दिया
  rationale: यह सामान्य और सीधा हिन्दी समतुल्य है, जो प्रभु द्वारा उनके इरादे को विफल किए जाने का अर्थ देता है।
theological_decisions:
- issue: परमेश्वर के निर्णय और मानवीय बुरे इरादे का संबंध
  choice: परमेश्वर ने उनके विरुद्ध विपत्ति का निर्णय किया था, क्योंकि वे…करना चाहते थे
  alternative: यह परमेश्वर की ओर से उनके लिए बुराई की आज्ञा थी
  rationale: ‘εἰς κακά’ को उन लोगों के विरुद्ध आने वाली विपत्ति समझना प्रसंग और अंग्रेज़ी परामर्श-पाठ के अनुरूप है; इससे यह अर्थ नहीं निकलता कि परमेश्वर ने उनके दुष्कर्म की आज्ञा दी थी।
- issue: प्रभु द्वारा रोकना
  choice: प्रभु ने उन्हें रोक दिया
  alternative: प्रभु ने उन्हें पूरी तरह असमर्थ कर दिया
  rationale: मूल केवल रोकने की बात कहता है; रोकने के साधन या सीमा को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में है। ‘वही करना’ मूल की शिष्ट संकेतात्मकता और नैतिक तनाव को सुरक्षित रखता है। सारा, रिबका और दीना नामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
