    issue: Final conjunction ‘पर’ introduces a contrast absent from the Greek.
    rationale: The source reads καὶ ὁ Κύριος ἐκώλυσεν αὐτούς, ‘and the Lord restrained them.’ ‘पर’ can imply that the Lord's action stands in contrast to the preceding divine decree, whereas the source simply coordinates the clauses.
