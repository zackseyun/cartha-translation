base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/001.yaml
  text: And as I was going to my father, I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, to the right of Abim.
translation:
  language: hi
  text: और जब मैं अपने पिता के पास जा रहा था, तब मुझे काँसे की एक ढाल मिली; इसी कारण उस पहाड़ का नाम अस्पिस[a] है। वह पहाड़ गेबाल के पास, अबीमा के दाहिनी ओर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘अस्पिस’ का अर्थ ‘ढाल’ भी होता है।
    reason: यह पाद-टिप्पणी मिली हुई ढाल और पहाड़ के नाम के बीच मूल यूनानी शब्द-क्रीड़ा को सुरक्षित रखती है।
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: काँसे की एक ढाल
  rationale: ἀσπίς का सामान्य अर्थ ‘ढाल’ और χαλκοῦς का अर्थ ताँबे/काँसे से बना हुआ है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘काँसे की’ चुना गया।
- source_word: Ἄσπις
  choice: अस्पिस
  rationale: पहाड़ के नाम को यूनानी ध्वनि के निकट लिप्यंतरित किया गया और ‘ढाल’ के साथ शब्द-संबंध को पाद-टिप्पणी में स्पष्ट किया गया।
- source_word: ἐκ δεξιῶν Ἀβιμά
  choice: अबीमा के दाहिनी ओर
  rationale: स्थान-संबंधी यूनानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप; मूल पाठ के Ἀβιμά को ‘अबीमा’ के रूप में लिप्यंतरित किया गया।
- source_word: Γεβάλ
  choice: गेबाल
  rationale: स्थान-नाम का स्रोत-पाठ के अनुसार निकट देवनागरी लिप्यंतरण।
