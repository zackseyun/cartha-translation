  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλον
  choice: मार डाला
  rationale: यूनानी क्रिया यहाँ जान लेने के स्पष्ट अर्थ में है; ‘मार डाला’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: τὸν Συχὲμ
  choice: शकेम को
  rationale: व्यक्ति के नाम के रूप में प्रचलित हिन्दी बाइबलीय वर्तनी अपनाई गई है।
- source_word: ἐν πρώτοις
  choice: सबसे पहले
  rationale: यह अभिव्यक्ति क्रम में प्राथमिकता बताती है; अंग्रेज़ी परामर्श-पाठ भी इसी अर्थ की पुष्टि करता है।
- source_word: Συμεὼν
  choice: शिमोन
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: τὸν Ἐμμώρ
  choice: हमोर को
  rationale: Ἐμμώρ हिब्रू हमोर नाम का यूनानी रूप है; हिन्दी बाइबलीय परंपरा के अनुरूप ‘हमोर’ रखा गया है।
