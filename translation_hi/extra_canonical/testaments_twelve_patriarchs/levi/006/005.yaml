review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the sequence (μετὰ ταῦτα), arrival (ἐλθόντες), demonstrative reference to ‘that city,’ and the sword-edge idiom (ἐν στόματι μαχαίρας). However, ‘मार डाला’ (‘killed’) makes the city-as-object construction semantically awkward in Hindi and states a more explicit annihilating result than the Greek verb ἐπάταξαν (‘struck/smote’) itself necessarily does.
  naturalness: ‘उस नगर को ... मार डाला’ is not natural when the direct object is a city. ‘उस नगर पर तलवार की धार से प्रहार किया’ is idiomatic modern Hindi while retaining the source’s military idiom and its metonymic reference to the city and its inhabitants.
  terminology: ‘नगर,’ ‘तलवार की धार,’ and ‘मेरे भाई’ are appropriate, dignified, and consistent with the register. No theological terminology is involved.
  issues:
  - severity: medium
    issue: ‘मार डाला’ over-specifies the result and is awkward with ‘नगर’ as its object.
    rationale: ἐπάταξαν means ‘struck/smote’; in this idiomatic military context it can imply devastating violence, but the Greek wording does not require Hindi to state directly that the city was ‘killed.’ Recasting with ‘प्रहार किया’ preserves the source wording and reads naturally.
  revised_text: और इसके बाद मेरे भाई आकर उस नगर पर तलवार की धार से प्रहार किया।
