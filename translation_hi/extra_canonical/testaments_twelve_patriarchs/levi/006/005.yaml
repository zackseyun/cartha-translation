- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: समय-क्रम को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐλθόντες
  choice: आकर
  rationale: ग्रीक कृदन्त की पूर्ववर्ती क्रिया को संक्षिप्त और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: ἐπάταξαν τὴν πόλιν
  choice: उस नगर को ... मार डाला
  rationale: यहाँ ‘नगर’ उसके निवासियों के लिए लक्षणा है; युद्ध के प्रसंग में ἐπάταξαν का घातक आशय हिन्दी में व्यक्त किया गया है।
- source_word: ἐν στόματι μαχαίρας
  choice: तलवार की धार से
  rationale: शाब्दिक ‘तलवार के मुँह से’ के स्थान पर उसी प्राचीन मुहावरे का स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἐκείνην
  choice: उस
  rationale: पाठ में संकेतवाचक विशेषण को बनाए रखता है।
