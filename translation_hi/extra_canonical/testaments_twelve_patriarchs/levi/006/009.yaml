base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/009.yaml
  text: And they pursued Abraham our father while he was a stranger, and they oppressed his flocks while they were increasing, and they cruelly mistreated Eblan, his home-born servant.
translation:
  language: hi
  text: और उन्होंने हमारे पिता अब्राहम का पीछा किया, जबकि वे परदेशी थे; उनके बढ़ते हुए झुंडों को दबाया; और उनके घराने में जन्मे सेवक एब्लान के साथ अत्यन्त क्रूर व्यवहार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωξαν
  choice: पीछा किया
  rationale: क्रिया का मूल अर्थ पीछा करना या खदेड़ना है; प्रसंग में शत्रुतापूर्ण कार्रवाई का भाव बना रहता है।
- source_word: ξένον ὄντα
  choice: जब वह परदेशी थे
  rationale: अब्राहम की उस समय की परदेशी स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατεπόνησαν
  choice: सताया
  rationale: झुंडों को कष्ट पहुँचाने या दबाने के अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ποίμνια ὀγκούμενα ὄντα
  choice: जब उनके भेड़-बकरियों के झुंड बढ़ रहे थे
  rationale: ὀγκούμενα के बढ़ने या आकार में वृद्धि होने के भाव को बिना अनावश्यक रूपक के व्यक्त करता है; ποίμνια के लिए हिन्दी में परिचित सामूहिक पद चुना गया है।
- source_word: οἰκογενῆ
  choice: घर में जन्मे सेवक
  rationale: शाब्दिक अर्थ 'घर में जन्मा' है; प्रसंगानुसार सेवक जोड़ने से व्यक्ति की घरेलू स्थिति स्पष्ट होती है, जैसा परामर्श-पाठ में भी है।
- source_word: σφόδρα ἠκίσαντο
  choice: अत्यन्त क्रूर व्यवहार किया
  rationale: तीव्रता और दुर्व्यवहार दोनों को सहज, dignified हिन्दी में व्यक्त करता है।
