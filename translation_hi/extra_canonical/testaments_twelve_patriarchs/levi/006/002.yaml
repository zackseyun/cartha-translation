- source_word: ἐν τῇ καρδίᾳ μου
  choice: अपने हृदय में
  rationale: ‘हृदय’ मूल रूपक को बनाए रखता है और आंतरिक स्मरण तथा मनन, दोनों की गुंजाइश छोड़ता है।
