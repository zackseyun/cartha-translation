base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/010.yaml
  text: And indeed in this way they used to act toward all strangers, seizing the foreign women by force and driving them away.
translation:
  language: hi
  text: 'और सचमुच वे सभी परदेशियों के साथ ऐसा ही किया करते थे: परदेशी स्त्रियों को बलपूर्वक पकड़ लेते और उन्हें खदेड़ देते थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε οὕτως
  choice: और सचमुच...ऐसा ही
  rationale: καίγε के बलाघात और οὕτως के रीति-सूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐποίουν
  choice: किया करते थे
  rationale: अपूर्ण भूतकाल यहाँ बार-बार किए जाने वाले व्यवहार को दर्शाता है।
- source_word: πᾶσι τοῖς ξένοις
  choice: सभी परदेशियों के साथ
  rationale: ξένοις का अर्थ बाहरी अथवा अपरिचित लोग है; ‘परदेशी’ इस संदर्भ में स्पष्ट और सहज है।
- source_word: ἐν δυναστείᾳ ἁρπάζοντες
  choice: बलपूर्वक पकड़ लेते
  rationale: ἐν δυναστείᾳ बल अथवा प्रभुत्व के प्रयोग को और ἁρπάζοντες हिंसक ढंग से पकड़ लेने को व्यक्त करता है।
- source_word: τὰς ξένας
  choice: परदेशी स्त्रियों को
  rationale: स्त्रीलिंग बहुवचन विशेषण का संज्ञात्मक प्रयोग है; इसे ‘उनकी स्त्रियाँ’ न कहकर मूल के प्रत्यक्ष अर्थ और गैर-स्वामित्वसूचक अभिव्यक्ति को बनाए रखा गया है।
- source_word: ἐξενηλάτουν αὐτάς
  choice: उन्हें खदेड़ देते थे
  rationale: क्रिया निर्वासित करने, बाहर निकालने या खदेड़ने का भाव रखती है; ‘खदेड़ देते’ जबरन दूर किए जाने को स्वाभाविक रूप से व्यक्त करता है।
