source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Μετὰ δὲ τοῦτο συνεβούλευσα⁵ *τῷ πατρί μου καὶ⁶ τῷ⁷ Ῥουβὴμ⁸ ἵνα εἴπῃ⁹ *τοῖς υἱοῖς¹⁰ Ἐμμώρ¹¹ τοῦ¹² μὴ¹³ *περιτμηθῆναι αὐτούς¹⁴, ὅτι¹⁵ ἐζήλωσα *διὰ τὸ βδέλυγμα¹⁶, *ὃ ἐποίησαν¹⁷ *ἐπὶ τῇ ἀδελφῇ μου¹⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/003.yaml
  text: After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous because of the abomination which they had committed against my sister.
translation:
  language: hi
  text: इसके बाद मैंने अपने पिता और रूबेन से विचार-विमर्श किया कि वह एम्मोर के पुत्रों से कहे कि वे अपना खतना न कराएँ, क्योंकि मेरी बहन के साथ उन्होंने जो घिनौना काम किया था, उसके कारण मैं रोष से भर उठा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रोष से भर उठा’ का अनुवाद जिस यूनानी शब्द से हुआ है, उसमें तीव्र जोश, आवेश या ईर्ष्यापूर्ण उत्साह का भाव भी हो सकता है।
    reason: ἐζήλωσα की अर्थ-व्याप्ति को सुरक्षित रखना और पाठक को अनुवाद में चुने गए प्रसंगानुकूल भाव से अवगत कराना।
lexical_decisions:
- source_word: συνεβούλευσα
  choice: विचार-विमर्श किया
  rationale: यह क्रिया साथ मिलकर परामर्श करने या सलाह करने का भाव देती है; प्रसंग में ‘विचार-विमर्श किया’ स्वाभाविक और अर्थ-संगत है।
- source_word: περιτμηθῆναι
  choice: अपना खतना न कराएँ
  rationale: निष्क्रिय रूप का स्वाभाविक हिन्दी अनुवाद, जिसमें एम्मोर के पुत्रों द्वारा स्वयं खतना करवाने का आशय बना रहता है।
- source_word: ἐζήλωσα
  choice: मैं रोष से भर उठा था
  rationale: यहाँ क्रिया तीव्र आवेश या जोश का संकेत देती है; बहन के विरुद्ध किए गए घिनौने काम के प्रसंग में ‘रोष से भर उठा’ स्वाभाविक है, पर मूल में निहित आवेश को मात्र सामान्य क्रोध तक सीमित नहीं करता।
- source_word: βδέλυγμα
  choice: घिनौना काम
  rationale: ‘घृणित/घिनौनी वस्तु या कृत्य’ के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ἵνα εἴπῃ में एकवचन कर्ता का संदर्भ
  choice: ‘कि वह … कहे’ के द्वारा एकवचन और संदर्भगत अस्पष्टता सुरक्षित रखी
  alternative: ‘कि वे … कहें’ अथवा पिता को स्पष्ट कर्ता बनाना
  rationale: यूनानी पाठ में εἴπῃ एकवचन है, पर निकटवर्ती ‘मेरे पिता और रूबेन’ में से उसका निश्चित संदर्भ स्पष्ट नहीं है; इसलिए अनुवाद इसे नहीं सुलझाता।
translation_notes:
  register: आधुनिक, dignified और सहज हिन्दी अपनाई गई है। ‘एम्मोर’ को दिए गए यूनानी नाम-रूप के निकट रखा गया है; वाक्य में एकवचन ‘वह’ की मूल अस्पष्टता जानबूझकर सुरक्षित है।
