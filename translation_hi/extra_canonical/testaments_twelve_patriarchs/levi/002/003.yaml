source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς δὲ ἐποίμαινον¹⁸ ἐν Ἀβελμαούλ¹⁹, πνεῦμα συνέσεως Κυρίου ἦλθεν ἐπʼ ἐμέ²⁰, καὶ *ἐθεώρουν πάντας ἀνθρώπους²¹ *ἀφανίσαντας τὴν ὁδὸν αὐτῶν²², καὶ *ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία καὶ ἐπὶ πύργους ἡ ἀδικία ἐκάθητο²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/003.yaml
  text: And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers.
translation:
  language: hi
  text: जब मैं हाबिलमाऊल में भेड़ें चरा रहा था, तब प्रभु की ओर से समझ की आत्मा मुझ पर आई। मैंने देखा कि सब लोग अपने मार्ग को नष्ट कर रहे थे; पाप दीवार पर बनाया जा रहा था, और अन्याय मीनारों पर बैठा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινον
  choice: भेड़ें चरा रहा था
  rationale: क्रिया का मूल अर्थ चरवाही करना है; प्रसंग में स्वाभाविक हिन्दी के लिए कर्म ‘भेड़ें’ स्पष्ट किया गया है।
- source_word: Ἀβελμαούλ
  choice: हाबिलमाऊल
  rationale: स्थान-नाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: प्रभु की ओर से समझ का आत्मा
  rationale: संबंधवाचक पद की सम्भावित स्रोतगत भावना को बनाए रखते हुए इसे ‘प्रभु की ओर से’ व्यक्त किया गया है; ‘समझ का आत्मा’ मूल रूपक और अस्पष्टता को सुरक्षित रखता है।
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: अपने मार्ग को नष्ट कर रहे थे
  rationale: ἀφανίζω के प्रबल अर्थ ‘नष्ट करना/बरबाद करना’ को रखा गया है, न कि उसे केवल ‘भ्रष्ट करना’ बनाया गया।
- source_word: ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία
  choice: पाप दीवार पर बनाया जा रहा था
  rationale: निष्क्रिय अपूर्णकाल और असामान्य दृश्यात्मक रूपक को सहज बनाने के बजाय यथासम्भव संरक्षित किया गया है।
- source_word: ἐπὶ πύργους ἡ ἀδικία ἐκάθητο
  choice: अन्याय मीनारों पर बैठा था
  rationale: व्यक्तिकरण तथा बहुवचन ‘मीनारों’ को मूल के अनुसार बनाए रखा गया है।
theological_decisions:
- issue: πνεῦμα συνέσεως Κυρίου में संबंध
  choice: प्रभु की ओर से समझ का आत्मा
  alternative: प्रभु की समझ का आत्मा
  rationale: यूनानी संबंधकारक स्रोत अथवा स्वामित्व दोनों का संकेत दे सकता है। अंग्रेज़ी परामर्श-पाठ के अनुरूप स्रोतगत अर्थ चुना गया, पर ‘पवित्र आत्मा’ जैसा अधिक विशिष्ट धार्मिक पद आयात नहीं किया गया।
- issue: दृष्टि में पाप और अन्याय का व्यक्तिकरण
  choice: रूपक को शाब्दिक और खुला रखा गया
  alternative: पाप बढ़ रहा था और अन्याय शासन कर रहा था
  rationale: व्याख्यात्मक भावार्थ मूल के विचित्र दर्शनात्मक चित्र और उसकी धर्मवैचारिक तनावशीलता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। दर्शनात्मक वाक्य के असामान्य बिंब—दीवार पर पाप का बनाया जाना और मीनारों पर अन्याय का बैठना—जानबूझकर सुरक्षित रखे गए हैं।
