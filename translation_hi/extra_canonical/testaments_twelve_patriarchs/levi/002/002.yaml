base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/002.yaml
  text: And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor.
translation:
  language: hi
  text: और मैं उस समय जवान ही था, लगभग बीस वर्ष का; तभी मैंने शिमोन के साथ मिलकर अपनी बहन दीना का हमोर से बदला लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεώτερος
  choice: जवान ही
  rationale: यहाँ शब्द लेवी की अपेक्षाकृत कम आयु पर बल देता है; आधुनिक हिन्दी में ‘जवान ही था’ स्वाभाविक और स्पष्ट है।
- source_word: ὡς ἐτῶν εἴκοσι
  choice: लगभग बीस वर्ष का
  rationale: ὡς अनुमानित आयु को व्यक्त करता है, इसलिए ‘लगभग’ उपयुक्त है।
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: बदला लिया
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप, जो प्रतिशोध की क्रिया को बिना नैतिक अनुमोदन जोड़े व्यक्त करता है।
- source_word: μετὰ Συμεών
  choice: शिमोन के साथ मिलकर
  rationale: μετά सहभागिता दर्शाता है; ‘साथ मिलकर’ दोनों की संयुक्त कार्रवाई स्पष्ट करता है।
- source_word: ἀπὸ Ἐμμώρ
  choice: हमोर से
  rationale: ἀπό यहाँ उस व्यक्ति को सूचित करता है जिससे प्रतिशोध लिया गया; ‘से’ मूल अस्पष्टता को बनाए रखते हुए स्वाभाविक है।
theological_decisions:
- issue: प्रतिशोध की नैतिक स्थिति
  choice: घटना को वक्ता के अपने कथन के रूप में तटस्थ ढंग से रखा गया है
  alternative: ‘न्याय किया’ या ‘दंड दिया’
  rationale: ἐκδίκησις को ‘न्याय’ कहना कार्रवाई को वैध ठहरा सकता है; ‘बदला लिया’ मूल के प्रतिशोधात्मक अर्थ और नैतिक तनाव को सुरक्षित रखता है।
- issue: हमोर के संबंध में पूर्वसर्ग ἀπό
  choice: ‘हमोर से बदला लिया’
  alternative: ‘हमोर के विरुद्ध बदला लिया’
  rationale: ‘से’ स्रोत-पाठ की संक्षिप्त और कुछ हद तक असामान्य अभिव्यक्ति के निकट है तथा अनावश्यक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। नामों के प्रचलित बाइबलीय रूप ‘शिमोन’, ‘दीना’ और ‘हमोर’ अपनाए गए हैं।
