translation:
  language: hi
  text: और मैं मनुष्यजाति के लिए दुःखी था, और मैंने प्रभु से प्रार्थना की कि मैं बचाया जाऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην λυπούμενος
  choice: मैं … दुःखी था
  rationale: यह अपूर्णकालीन परिधीय रचना लगातार बनी हुई दुःख की अवस्था व्यक्त करती है; आधुनिक हिन्दी में स्वाभाविक ढंग से इसे ‘दुःखी था’ कहा गया है।
- source_word: ὑπὲρ γένους τῶν υἱῶν τῶν ἀνθρώπων
  choice: मनुष्यों की संतान के वंश के कारण
  rationale: γένος का वंश-संबंधी अर्थ और ‘मनुष्यों के पुत्रों’ की सामूहिक मानवता दोनों बनाए रखे गए हैं; ὑπέρ यहाँ दुःख के विषय अथवा कारण को सूचित करता है।
- source_word: ηὐξάμην τῷ Κυρίῳ
  choice: मैंने प्रभु से प्रार्थना की
  rationale: εὔχομαι का यहाँ संदर्भानुकूल अर्थ प्रार्थना करना है, और τῷ Κυρίῳ के लिए स्वाभाविक हिन्दी कारक ‘प्रभु से’ है।
- source_word: ὅπως σωθῶ
  choice: कि मैं बचाया जाऊँ
  rationale: σωθῶ कर्मवाच्य और उद्देश्य/अभिलाषा दोनों को व्यक्त करता है; ‘बचाया जाऊँ’ इस अस्पष्टता को बनाए रखता है कि उद्धार किस संकट से है।
theological_decisions:
- issue: σωθῶ में उद्धार या बचाव का आशय
  choice: बचाया जाऊँ
  alternative: उद्धार पाऊँ
  rationale: मूल पाठ यह नहीं बताता कि बचाया जाना आध्यात्मिक उद्धार है या किसी आसन्न संकट से रक्षा; ‘बचाया जाऊँ’ इस व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत के निकट भाषा रखी गई है। वाक्य की दो समन्वित क्रियाओं तथा मूल की अनिर्दिष्ट धार्मिक तनाव को बनाए रखा गया है।
