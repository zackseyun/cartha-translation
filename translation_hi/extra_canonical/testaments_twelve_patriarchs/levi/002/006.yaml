translation:
  language: hi
  text: और देखो, आकाश खुल गए, और प्रभु के एक स्वर्गदूत ने मुझसे कहा, “लेवी, लेवी, भीतर आ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: दर्शन के आकस्मिक और ध्यान खींचने वाले स्वर को बनाए रखता है।
- source_word: οἱ οὐρανοί
  choice: आकाश
  rationale: यूनानी बहुवचन का हिन्दी में स्वाभाविक सामूहिक रूप; ‘आकाश खुल गए’ से बहुस्तरीय स्वर्गीय क्षेत्र का संकेत भी बना रहता है।
- source_word: ἄγγελος Κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: अनिश्चित ἄγγελος को ‘एक’ से व्यक्त किया और Κυρίου को प्रचलित, गरिमापूर्ण ‘प्रभु’ के रूप में रखा।
- source_word: εἴσελθε
  choice: भीतर आ
  rationale: एकवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप, जिसमें प्रवेश करने की दिशा स्पष्ट है।
theological_decisions:
- issue: ‘प्रभु के स्वर्गदूत’ की पहचान
  choice: प्रभु का एक स्वर्गदूत
  alternative: प्रभु का स्वर्गदूत
  rationale: पाठ में स्वर्गदूत की किसी विशिष्ट या दिव्य पहचान को निश्चित नहीं किया गया है; ‘एक’ यूनानी की अनिश्चितता को सुरक्षित रखता है।
translation_notes:
