lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: सत्तर सप्ताह
  rationale: दानिय्येल-सदृश प्रकाशनात्मक काल-भाषा को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; वैकल्पिक शाब्दिक रूप “सत्तर सातक” अस्पष्ट होता।
- source_word: ἱερωσύνη
  choice: याजकाई
  rationale: यहाँ पद, सेवा और संस्था—तीनों को समेटने वाला पारम्परिक किन्तु बोधगम्य शब्द है।
- source_word: ἰωβηλαῖον
  choice: जुबली-काल
  rationale: काल-क्रम को स्पष्ट करता है और केवल उत्सव या वर्षगाँठ के आधुनिक अर्थ से भेद बनाए रखता है।
- source_word: χριόμενος
  choice: जो अभिषिक्त होगा
  rationale: याजकीय अभिषेक को स्पष्ट रखता है, पर स्वतः किसी विशिष्ट मसीही पहचान को पाठ में आरोपित नहीं करता।
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: वह परमेश्वर से ऐसे बात करेगा जैसे पिता से
  rationale: मूल की साहसपूर्ण पितृ-समान उपमा को बिना नरम किए स्वाभाविक हिन्दी में रखता है।
- source_word: πλήρης μετὰ κυρίου
  choice: प्रभु के साथ उसकी याजकाई पूर्ण होगी
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है; यह अनुवाद प्रभु के सम्बन्ध में पूर्णता का भाव रखता है, पर उसका अर्थ अधिक निश्चित नहीं करता।
- source_word: συλληφθήσεται ἐν πένθει ἀγαπητοῦ
  choice: वह किसी प्रिय जन के शोक के बीच गर्भ में आएगा
  rationale: गर्भधारण/गर्भ में आने का प्रसंगानुकूल अर्थ ग्रहण करता है, जबकि “प्रिय जन” किसे सूचित करता है, यह खुला छोड़ता है।
- source_word: παραληφθήσεται
  choice: उठा लिया जाएगा
  rationale: “ले लिए जाने” के मूल भाव को रखता है; पाठ यह स्पष्ट नहीं करता कि इसका आशय मृत्यु, हटाया जाना, या किसी दशा से आच्छादित होना है।
- source_word: μιασμός
  choice: अपवित्रता
  rationale: याजकीय प्रसंग में धार्मिक-विधि सम्बन्धी अशुद्धता और नैतिक भ्रष्टता दोनों की सम्भावना बनाए रखता है।
- source_word: ἀνακαινοποιήσουσιν οἶκον κυρίου
  choice: प्रभु के भवन का नवीकरण करेंगे
  rationale: मूल के पुनः नया करने के भाव को रखता है और पुनर्स्थापना तथा पुनर्निर्माण, दोनों सम्भावनाओं को खुला छोड़ता है।
theological_decisions:
- issue: पद 2 के कोष्ठकबद्ध वाक्य की पाठालोचनात्मक स्थिति
  choice: वाक्य को मुख्य पाठ में कोष्ठकों सहित रखा और पादटिप्पणी में उसकी अनिश्चितता बताई
  alternative: वाक्य को हटा देना, या बिना किसी संकेत के अभिन्न मूल पाठ की तरह छापना
  rationale: दिए गए यूनानी साक्ष्य में वाक्य चिह्नित है; पारदर्शिता के लिए न तो उसे चुपचाप हटाया गया और न उसकी पाठगत स्थिति को छिपाया गया।
- issue: जुबली-कालों में याजकों की पहचान
  choice: क्रम को भविष्यसूचक याजकीय अनुक्रम के रूप में अनूदित किया, पर किसी ऐतिहासिक व्यक्ति की पहचान पाठ में नहीं जोड़ी
  alternative: हर याजक को किसी ज्ञात महायाजक से जोड़ना, या पूरे क्रम को केवल प्रतीकात्मक युग कहना
  rationale: मूल पाठ स्वयं नाम नहीं देता; किसी निश्चित ऐतिहासिक या सम्प्रदायगत योजना को अनुवाद में डालना अतिक्रमण होता।
- issue: “संसार के उद्धार” वाले वाक्य का मसीही आशय
  choice: शब्दों का सीधा अनुवाद किया, पर अभिषिक्त व्यक्ति को शीर्षक रूप में “मसीह” नहीं कहा
  alternative: वाक्य को स्पष्ट रूप से किसी विशिष्ट मसीही व्यक्ति की भविष्यवाणी बनाना
  rationale: यूनानी कृदन्त तत्कालीन प्रसंग में याजकीय अभिषेक बताता है; सम्भावित व्यापक धर्मवैज्ञानिक अर्थ को पाठक के लिए खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। “याजकाई,” “अभिषिक्त,” “बँधुआई” और “प्रभु का भवन” जैसे परिचित बाइबिलीय शब्द रखे गए हैं, किन्तु वाक्य-विन्यास को वर्तमान हिन्दी में सुबोध बनाया गया है। मूल की वास्तविक अस्पष्टताएँ—विशेषतः पूर्णता, गर्भ में आने, उठा लिए जाने और अपवित्रता के सम्बन्ध में—अनावश्यक व्याख्या से नहीं मिटाई गईं।
