  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017.yaml
  text: 'And since you have heard about the seventy weeks[1], hear also about the priesthood. For in each jubilee there will be a priesthood. In the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be complete with the Lord. [And in the days of his joy he will arise for the salvation of the world.]


    In the second jubilee, the one anointed will be conceived in the sorrow of a beloved one, and his priesthood will be honored, and he will be glorified by all.


    But the third priest will be taken in grief. And the fourth will be in pains, because unrighteousness will increase upon him in abundance, and all Israel will hate, each one, his neighbor. The fifth will be taken in darkness. Likewise also the sixth and the seventh.


    But in the seventh there will be a defilement which I cannot speak of before men, for those who do these things will know them. Therefore they will be in captivity and in plundering, and their land and their possessions will be destroyed.


    And in the fifth week they will return to the land of their desolation[4][3][2], and they will renew the house of the Lord.'
translation:
  language: hi
  text: '**लेवी का वसीयतनामा 17**


    **1** और क्योंकि तुम सत्तर सप्ताहों[a] के विषय में सुन चुके हो, इसलिए अब याजकाई के विषय में भी सुनो। **2** हर जुबली-काल में एक याजकाई होगी। पहले जुबली-काल में जो याजकाई के लिए सबसे पहले अभिषिक्त होगा, वह महान होगा। वह परमेश्वर से ऐसे बात करेगा जैसे पिता से, और प्रभु के साथ उसकी याजकाई पूर्ण होगी। [और अपने आनंद के दिनों में वह संसार के उद्धार के लिए उठेगा।][b]


    **3** दूसरे जुबली-काल में उस अभिषिक्त का गर्भाधान किसी प्रियजन के शोक में होगा। उसकी याजकाई आदर पाएगी और सभी उसकी महिमा करेंगे।


    **4** परन्तु तीसरा याजक शोक में उठा लिया जाएगा। **5** चौथा पीड़ाओं में रहेगा, क्योंकि उस पर अधर्म बहुत बढ़ जाएगा, और सारे इस्राएल में हर एक अपने पड़ोसी से घृणा करेगा। **6** पाँचवाँ अन्धकार में उठा लिया जाएगा। **7** इसी प्रकार छठा और सातवाँ भी।


    **8** परन्तु सातवें में ऐसी अपवित्रता[c] होगी, जिसका वर्णन मैं लोगों के सामने नहीं कर सकता; क्योंकि जो इन्हें करते हैं, वे ही इन्हें जानेंगे। **9** इस कारण वे बँधुआई और लूटपाट में पड़ेंगे, और उनकी भूमि और उनकी सम्पत्ति नष्ट कर दी जाएगी।


    **10** और पाँचवें सप्ताह में वे अपनी उजड़ी हुई भूमि में लौटेंगे और प्रभु के भवन का नवीकरण करेंगे।[d]


    [a] “सत्तर सप्ताह” दानिय्येल के ग्रन्थ में पाई जाने वाली प्रकाशनात्मक काल-गणना की भाषा की याद दिलाता है। यह वचन मानकर चलता है कि श्रोता इसका पिछला वर्णन सुन चुके हैं।


    [b] कोष्ठकों में रखा वाक्य—“और अपने आनंद के दिनों में वह संसार के उद्धार के लिए उठेगा”—प्रयुक्त यूनानी पाठ-परम्परा में संदिग्ध है और सम्भवतः बाद में जोड़ा गया विस्तार हो सकता है। इसलिए इसे हटाने के बजाय कोष्ठकों में रखा गया है।


    [c] यहाँ “अपवित्रता” का अर्थ धार्मिक-विधि सम्बन्धी अशुद्धता और नैतिक भ्रष्टता, दोनों हो सकता है; विशेषकर इसलिए कि प्रसंग याजकाई के भ्रष्ट होने का है।


    [d] “प्रभु के भवन का नवीकरण करेंगे” उजाड़ के बाद मन्दिर को फिर से स्थापित करने या उसका पुनर्निर्माण करने का संकेत दे सकता है।'
