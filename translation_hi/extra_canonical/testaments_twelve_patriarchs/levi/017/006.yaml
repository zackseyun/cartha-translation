lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: पाँचवाँ
  rationale: यूनानी में क्रमवाचक विशेषण संज्ञा के रूप में प्रयुक्त है; हिन्दी में भी ‘पाँचवाँ’ संदर्भगत व्यक्ति या क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν σκότει
  choice: अन्धकार में
  rationale: ἐν के स्थानगत अर्थ और σκότος के शाब्दिक तथा सम्भावित रूपकात्मक अर्थ—दोनों को खुला रखता है।
- source_word: παραληφθήσεται
  choice: उठा लिया जाएगा
  rationale: यह παραλαμβάνω का भविष्यकालीन कर्मवाच्य रूप है। ‘उठा लिया जाएगा’ उसके ‘ले लेना/साथ ले जाना’ अर्थ को व्यक्त करता है और यह अस्पष्टता बनाए रखता है कि कर्ता कौन है तथा ले जाने का आशय अनुकूल है या प्रतिकूल।
theological_decisions:
- issue: παραληφθήσεται में निहित ले जाए जाने की प्रकृति
  choice: उठा लिया जाएगा
  alternative: पकड़ लिया जाएगा / ले जाया जाएगा
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि यह दैवी रूप से उठा लिया जाना, मृत्यु, गिरफ्तारी या कोई अन्य प्रकार का ले जाना है; इसलिए अनुवाद किसी एक व्याख्या को निश्चित नहीं करता।
translation_notes:
  register: संक्षिप्त, गम्भीर और मूल यूनानी वाक्य की रहस्यमय अस्पष्टता के अनुरूप आधुनिक मानक हिन्दी। ‘अन्धकार’ को केवल भौतिक या केवल आध्यात्मिक अर्थ तक सीमित नहीं किया गया है।
