id: T12P.LEV.17.3
reference: Testament of Levi 17:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐν¹⁸ τῷ δευτέρῳ ἰωβηλαίῳ ὁ¹⁹ χριόμενος ἐν πένθει ἀγαπητοῦ²⁰ συλληφθήσεται²¹ *καὶ ἔσται²² ἡ ἱερωσύνη αὐτοῦ τιμία²³, καὶ παρὰ πάντων²⁴ δοξασθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/003.yaml
  text: In the second jubilee, the anointed one will be seized in mourning for a beloved one, and his priesthood will be honored, and he will be glorified by all.
translation:
  language: hi
  text: दूसरी जुबली में, अभिषिक्त जन किसी प्रिय के शोक में पकड़ा जाएगा; उसका याजकपद प्रतिष्ठित होगा, और सब लोग उसकी महिमा करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰωβηλαίῳ
  choice: जुबली
  rationale: यह पद क्रमबद्ध ‘जुबली’ कालों का उल्लेख करता है; परिचित बाइबलीय पारिभाषिक शब्द बनाए रखने से काल-संबंधी अर्थ सुरक्षित रहता है।
- source_word: ὁ χριόμενος
  choice: अभिषिक्त जन
  rationale: यूनानी वर्तमान कर्मवाच्य कृदंत का शाब्दिक अर्थ ‘जिसका अभिषेक किया जा रहा है’ हो सकता है; यहाँ पदवी-सदृश प्रयोग को स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना इसे किसी विशिष्ट व्यक्ति के नाम से जोड़ने के।
- source_word: συλληφθήσεται
  choice: पकड़ा जाएगा
  rationale: क्रिया का सामान्य प्रसंगानुकूल अर्थ ‘पकड़ा/बंदी बनाया जाना’ है। ‘गर्भ में धारण किया जाएगा’ भी शब्दकोशीय रूप से संभव है, पर πένθει के साथ इस वाक्य में कम संभावित है।
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: किसी प्रिय के शोक में
  rationale: 'ἀγαπητοῦ का संबंध खुला रखा गया है: यह किसी प्रिय व्यक्ति के लिए शोक को दर्शाता है, पर उस व्यक्ति की पहचान या संबंध नहीं बताता।'
- source_word: ἡ ἱερωσύνη αὐτοῦ τιμία
  choice: उसका याजकपद प्रतिष्ठित होगा
  rationale: ἱερωσύνη को याजकीय पद/सेवा और τιμία को आदरणीय व प्रतिष्ठित होने के अर्थ में स्वाभाविक हिन्दी दी गई है।
- source_word: παρὰ πάντων δοξασθήσεται
  choice: सब लोग उसकी महिमा करेंगे
  rationale: यूनानी कर्मवाच्य ‘सबके द्वारा महिमान्वित किया जाएगा’ को अर्थ बनाए रखते हुए सहज सक्रिय हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘अभिषिक्त जन’ की पहचान
  choice: व्यक्ति की पहचान अनिर्दिष्ट रखी गई
  alternative: इसे स्पष्ट रूप से ‘मसीह’ कहना
  rationale: मूल पाठ केवल ὁ χριόμενος कहता है; किसी विशिष्ट मसीही पहचान को अनुवाद में जोड़ना मूल की अपेक्षा अधिक निर्णायक होता।
- issue: συλληφθήσεται का अर्थ
  choice: पकड़ा जाएगा
  alternative: गर्भ में धारण किया जाएगा
  rationale: क्रिया में दोनों अर्थ संभव हैं, किंतु शोक के प्रसंग और संशोधित स्रोत-पाठ के वाक्य-संबंध में ‘पकड़ा जाएगा’ अधिक संगत है; किसी गर्भधारण-संबंधी धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध बाइबलीय शैली अपनाई गई है। ‘जुबली’, ‘अभिषिक्त जन’ और ‘याजकपद’ जैसे पारिभाषिक शब्द रखे गए हैं; वाक्य को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
