id: T12P.LEV.17.2
reference: Testament of Levi 17:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/002.yaml
  text: For in each jubilee there will be a priesthood. And in the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be full with the Lord. [And in the days of his joy, he will arise for the salvation of the world.]
translation:
  language: hi
  text: क्योंकि हर जुबली में एक याजकाई होगी। और पहली जुबली में जो याजकाई के लिए सबसे पहले अभिषिक्त होगा, वह महान होगा और परमेश्वर से ऐसे बात करेगा जैसे पिता से; और उसकी याजकाई प्रभु के साथ परिपूर्ण होगी। [और उसके आनन्द के दिनों में वह संसार के उद्धार के लिए उठ खड़ा होगा।][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्ग कोष्ठकों में दिया गया अंतिम वाक्यांश यूनानी पाठ की संदिग्ध या अनिश्चित पाठ-परंपरा को दर्शाता है।
    reason: स्रोत-संपादन में खंड को वर्ग कोष्ठकों में रखा गया है; पाठक को इसकी पाठालोचनात्मक स्थिति बताना आवश्यक है।
lexical_decisions:
- source_word: ἰωβηλαῖον / ἰωβηλαίῳ
  choice: जुबली / जुबली में
  rationale: यह विशिष्ट काल-इकाई है; प्रचलित बाइबलीय पद ‘जुबली’ अर्थ को साधारण ‘उत्सव’ या केवल ‘पचासवाँ वर्ष’ तक सीमित किए बिना सुरक्षित रखता है।
- source_word: ἱερωσύνη
  choice: याजकाई
  rationale: यहाँ पद ‘याजक’ नहीं, बल्कि याजकीय पद, व्यवस्था या सेवा को सूचित करता है; ‘याजकाई’ संक्षिप्त और संदर्भानुकूल है।
- source_word: ὁ χριόμενος πρῶτος
  choice: जो ... सबसे पहले अभिषिक्त होगा
  rationale: वर्तमान कृदन्त के भाव और πρῶτος की प्राथमिकता दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: परमेश्वर से ऐसे बात करेगा जैसे पिता से
  rationale: मूल में परमेश्वर को सीधे ‘पिता’ कहने के बजाय तुलना है; हिन्दी में उसी संबंधगत अस्पष्टता को बनाए रखा गया है।
- source_word: πλήρης μετὰ κυρίου
  choice: प्रभु से परिपूर्ण
  rationale: वाक्यांश यूनानी में असामान्य है। ‘प्रभु से परिपूर्ण’ निकट रूप से πλήρης और μετά को दर्शाता है, बिना इसे ‘प्रभु में पूर्ण’ या ‘प्रभु के साथ पूर्ण’ बनाकर अर्थ निश्चित किए।
- source_word: ἀναστήσεται
  choice: उठ खड़ा होगा
  rationale: यह क्रिया सामान्यतः उठने और संदर्भानुसार पुनरुत्थान दोनों का संकेत दे सकती है; ‘उठ खड़ा होगा’ संभावित अर्थ-तनाव को खुला रखता है।
- source_word: σωτηρίᾳ κόσμου
  choice: संसार के उद्धार के लिए
  rationale: σωτηρία का धार्मिक और व्यापक बचाव-संबंधी अर्थ ‘उद्धार’ से स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: परमेश्वर और पिता के बीच संबंध
  choice: ‘परमेश्वर से ऐसे बात करेगा जैसे पिता से’
  alternative: ‘अपने पिता परमेश्वर से बात करेगा’
  rationale: मूल ὡς πατρί उपमा देता है और ‘परमेश्वर’ तथा ‘पिता’ को स्पष्टतः एक संयुक्त उपाधि नहीं बनाता।
- issue: ἀναστήσεται का पुनरुत्थान-संबंधी अर्थ
  choice: ‘उठ खड़ा होगा’
  alternative: ‘जी उठेगा’
  rationale: ‘जी उठेगा’ पुनरुत्थान का अर्थ निर्णायक बना देता; मूल क्रिया यहाँ अधिक व्यापक है, इसलिए तनाव सुरक्षित रखा गया है।
- issue: कोष्ठकबद्ध अंतिम वाक्यांश की पाठ-संदिग्धता
  choice: मुख्य पाठ में वर्ग कोष्ठकों सहित रखा और [a] से समझाया
  alternative: बिना कोष्ठक के सामान्य मुख्य पाठ के रूप में देना
  rationale: प्रदत्त आलोचनात्मक स्रोत स्वयं इस खंड को वर्ग कोष्ठकों में रखता है; पाठकीय स्थिति को छिपाना उचित नहीं।
- issue: ‘प्रभु से परिपूर्ण’ का आशय
  choice: असामान्य संबंध-वाचक अभिव्यक्ति को निकटता से बनाए रखा
  alternative: ‘प्रभु में उसकी याजकाई सिद्ध होगी’
  rationale: वैकल्पिक रूप πλήρης को ‘सिद्ध’ और μετά को ‘में’ बनाकर धर्मवैचारिक अर्थ को अनावश्यक रूप से निश्चित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘याजकाई’, ‘अभिषिक्त’, ‘उद्धार’ और ‘जुबली’ जैसे स्थापित धार्मिक पद रखे गए हैं। लंबे यूनानी वाक्य को हिन्दी में पठनीय बनाया गया है, पर उसके संयोजक क्रम, तुलनात्मक भाषा और वास्तविक अस्पष्टताओं को सुरक्षित रखा गया है।
