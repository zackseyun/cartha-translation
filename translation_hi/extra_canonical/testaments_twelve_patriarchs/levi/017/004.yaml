  text: But the third priest will be taken away with grief.
translation:
  language: hi
  text: परन्तु तीसरा याजक दुःख के साथ ले लिया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ τρίτος ἱερεὺς
  choice: परन्तु तीसरा याजक
  rationale: δὲ के विरोध अथवा क्रम-परिवर्तन के भाव को ‘परन्तु’ से, τρίτος को ‘तीसरा’ से और ἱερεύς को स्वाभाविक धार्मिक पद ‘याजक’ से व्यक्त किया गया है।
- source_word: λύπῃ
  choice: दुःख के कारण
  rationale: दत्तिव रूप λύπῃ दुःख से संबद्ध परिस्थिति, साधन अथवा कारण बता सकता है। यहाँ ‘दुःख के कारण’ स्वाभाविक हिन्दी है और दुःख से जुड़े उसके उठा लिए जाने का भाव रखता है।
- source_word: παραληφθήσεται
  choice: उठा लिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप को सुरक्षित रखा गया है। ‘उठा लिया जाएगा’ मृत्यु या हटाए जाने की सम्भावना को स्पष्टतः तय किए बिना παραλαμβάνω के ‘ले लिया जाना’ भाव को व्यक्त करता है।
theological_decisions:
- issue: याजक के उठा लिए जाने का सटीक आशय
  choice: उठा लिया जाएगा
  alternative: दूर कर दिया जाएगा / मर जाएगा
  rationale: यूनानी क्रिया स्वयं यह स्पष्ट नहीं करती कि आशय मृत्यु, पद से हटाया जाना, या किसी अन्य प्रकार से ले लिया जाना है; इसलिए अधिक निर्णायक व्याख्या पाठ में नहीं जोड़ी गई।
- issue: λύπῃ का संबंध
  choice: दुःख के कारण
  alternative: दुःख के साथ / दुःख में
  rationale: दत्तिव की अर्थगत गुंजाइश बनी हुई है। संदर्भ-विहीन छोटे वाक्य में कारणसूचक हिन्दी सबसे सहज है, पर इसे निश्चित धर्मवैज्ञानिक निष्कर्ष नहीं माना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। कर्मवाच्य और मूल की अर्थगत अस्पष्टता यथासंभव सुरक्षित रखी गई है।
