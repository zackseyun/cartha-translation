id: T12P.LEV.17.8
reference: Testament of Levi 17:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἐν δὲ τῷ ἑβδόμῳ²⁷ ἔσται μιασμός⁴¹, ὃν οὐ δύναμαι⁴² εἰπεῖν ἐνώπιον⁴³ ἀνθρώπων· ὅτι αὐτοὶ γνώσονται οἱ ποιοῦντες αὐτά.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/008.yaml
  text: But in the seventh there will be defilement, which I cannot speak of before men, because those who do these things will know them.
translation:
  language: hi
  text: परन्तु सातवें में अशुद्धता होगी, जिसका वर्णन मैं लोगों के सामने नहीं कर सकता; क्योंकि जो इन्हें करते हैं, वे स्वयं इन्हें जानेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ ἑβδόμῳ
  choice: परन्तु सातवें में
  rationale: मूल पाठ में संज्ञा अध्याहृत है; इसलिए ‘सातवें’ को बिना किसी अनिर्दिष्ट संज्ञा को जोड़कर रखा गया है, ताकि संदर्भगत अस्पष्टता बनी रहे।
- source_word: μιασμός
  choice: अशुद्धता
  rationale: यह शब्द अपवित्रता/कलंक का बोध देता है; ‘अशुद्धता’ सहज हिन्दी में व्यापक नैतिक और धार्मिक अर्थ-क्षेत्र को बनाए रखता है।
- source_word: ὃν οὐ δύναμαι εἰπεῖν
  choice: जिसका वर्णन मैं ... नहीं कर सकता
  rationale: शाब्दिक ‘जिसे मैं कह नहीं सकता’ हिन्दी में अस्वाभाविक है; ‘वर्णन’ अकथनीय कर्मों को प्रकट करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐνώπιον ἀνθρώπων
  choice: लोगों के सामने
  rationale: आधुनिक मानक हिन्दी में यह ‘मनुष्यों के सम्मुख’ की अपेक्षा अधिक स्वाभाविक है और सार्वजनिक रूप से कहने का आशय सुरक्षित रखता है।
- source_word: αὐτοὶ γνώσονται
  choice: वे स्वयं ... जानेंगे
  rationale: αὐτοὶ के बलाघात को ‘स्वयं’ से व्यक्त किया गया है और भविष्यकाल γνώσονται को ‘जानेंगे’ से बनाए रखा गया है।
theological_decisions:
- issue: ‘सातवें’ से अभिप्रेत वस्तु
  choice: संज्ञा न जोड़कर ‘सातवें में’ रखा गया
  alternative: ‘सातवें याजक-वर्ग/काल में’
  rationale: इस पद में संज्ञा स्पष्ट रूप से उपस्थित नहीं है; संदर्भ की व्याख्या को अनुवाद में निश्चित करना मूल की वास्तविक अस्पष्टता को मिटा देता।
- issue: ‘अशुद्धता’ का स्वरूप
  choice: व्यापक शब्द ‘अशुद्धता’
  alternative: ‘नैतिक भ्रष्टता’ या ‘धार्मिक अपवित्रता’
  rationale: μιασμός दोनों प्रकार के संकेत दे सकता है; किसी एक धार्मिक या नैतिक अर्थ तक सीमित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल यूनानी की वाक्य-रचना और अस्पष्टता को यथासंभव सुरक्षित रखते हुए केवल हिन्दी की स्वाभाविकता के लिए ‘कहने’ के स्थान पर ‘वर्णन’ प्रयोग किया गया है।
