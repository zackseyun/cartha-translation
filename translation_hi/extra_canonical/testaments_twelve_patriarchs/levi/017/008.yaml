review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the unspecified referent in ἐν δὲ τῷ ἑβδόμῳ (‘in the seventh’), the future assertion of μιασμός, the speaker’s inability to state it publicly, and the concluding rationale. However, ‘ऐसी’ introduces an intensifying/demonstrative nuance not expressed in the Greek. ‘ये काम’ is possible, but ‘ये बातें’ better retains the broad, deliberately unspecified αὐτά (‘these things’).
  naturalness: The Hindi is generally clear and suitably dignified. Recasting the final clause as ‘जो इन्हें करते हैं, वे स्वयं इन्हें जानेंगे’ avoids the slight ambiguity of ‘वे स्वयं उन्हें जानेंगे’ and is more direct in modern standard Hindi.
  terminology: ‘अशुद्धता’ is an acceptable broad rendering of μιασμός and appropriately avoids narrowing the term to exclusively ritual or moral impurity. ‘लोगों के सामने’ naturally conveys ἐνώπιον ἀνθρώπων in this context.
  issues:
  - severity: low
    issue: ‘ऐसी’ has no explicit basis in the Greek.
    rationale: The source says simply that ‘defilement’ will occur; it does not qualify it as ‘such defilement.’ Omitting ‘ऐसी’ more closely preserves the source’s restrained wording.
  - severity: low
    issue: ‘ये काम’ slightly narrows αὐτά.
    rationale: αὐτά means ‘these things’ and is intentionally unspecified. ‘ये बातें’ retains that breadth and fits the preceding refusal to speak publicly.
  revised_text: परन्तु सातवें में अशुद्धता होगी, जिसका वर्णन मैं लोगों के सामने नहीं कर सकता; क्योंकि जो इन्हें करते हैं, वे स्वयं इन्हें जानेंगे।
  revised_footnotes: []
