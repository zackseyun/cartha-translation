revisions:
- from: परन्तु सातवें में ऐसी अशुद्धता होगी, जिसका वर्णन मैं लोगों के सामने नहीं कर सकता; क्योंकि जो लोग ये काम करते हैं, वे स्वयं उन्हें जानेंगे।
  to: परन्तु सातवें में अशुद्धता होगी, जिसका वर्णन मैं लोगों के सामने नहीं कर सकता; क्योंकि जो इन्हें करते हैं, वे स्वयं इन्हें जानेंगे।
  rationale: The revision removes the unsupported qualifier ‘ऐसी’ and renders αὐτά consistently as ‘इन्हें/ये बातें’ in sense, while retaining the original’s ambiguity about what ‘the seventh’ and the unnamed actions refer to. No footnote is needed because the ambiguity is preserved directly in the translation.
  reviewer_model: gpt-5.6-terra
