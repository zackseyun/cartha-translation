id: T12P.LEV.17.10
reference: Testament of Levi 17:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/010.yaml
  text: And in the fifth week they will return to the land of their desolation, and they will renew the house of the Lord.
translation:
  language: hi
  text: और पाँचवें सप्ताह में वे अपनी उजड़ी हुई भूमि में लौटेंगे और प्रभु के भवन का नवीनीकरण करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέμπτῃ ἑβδομάδι
  choice: पाँचवें सप्ताह में
  rationale: यूनानी के क्रमवाचक विशेषण और काल-सूचक संज्ञा का सीधा तथा स्वाभाविक अनुवाद।
- source_word: γῆν ἐρημώσεως αὐτῶν
  choice: अपनी उजड़ी हुई भूमि
  rationale: शाब्दिक अर्थ ‘उनके उजाड़ की भूमि’ है; हिन्दी में यह रूप भूमि की उजड़ी अवस्था और उससे उनके संबंध—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνακαινοποιήσουσιν
  choice: नवीनीकरण करेंगे
  rationale: क्रिया का अर्थ फिर से नया करना अथवा पुनर्स्थापित करना है; ‘नवीनीकरण’ पुनर्निर्माण से व्यापक अर्थ को बनाए रखता है।
- source_word: οἶκον κυρίου
  choice: प्रभु के भवन
  rationale: οἶκος यहाँ धार्मिक भवन/मंदिर का संकेत दे सकता है; ‘भवन’ स्रोत की अपेक्षाकृत व्यापक अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: οἶκον κυρίου का आशय
  choice: प्रभु के भवन
  alternative: प्रभु के मंदिर
  rationale: ‘मंदिर’ संदर्भानुसार संभव है, पर यूनानी में सामान्य शब्द οἶκος है; ‘भवन’ अनावश्यक विशिष्टीकरण से बचता है और धार्मिक संदर्भ भी बनाए रखता है।
- issue: ἀνακαινοποιήσουσιν की क्रिया
  choice: नवीनीकरण करेंगे
  alternative: फिर से बनाएँगे
  rationale: स्रोत में केवल भौतिक पुनर्निर्माण नहीं, व्यापक पुनर्नवीकरण भी संभव है; इसलिए अर्थगत तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। स्रोत की भविष्यत्कालीन संरचना और समानांतर क्रियाओं को बनाए रखा गया है।
