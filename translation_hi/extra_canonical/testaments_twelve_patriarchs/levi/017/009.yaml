  text: इस कारण वे बंदी बनाए जाएँगे और लूटे जाएँगे; और उनकी भूमि और उनकी संपत्ति नष्ट कर दी जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἰχμαλωσίᾳ
  choice: बँधुआई में
  rationale: यह पद बंदी बनाकर पराए देश ले जाए जाने की अवस्था को दर्शाता है; ‘बँधुआई’ धार्मिक-साहित्यिक संदर्भ में स्वाभाविक और सटीक है।
- source_word: ἐν προνομῇ
  choice: लूट में
  rationale: संज्ञात्मक समानांतरता बनाए रखते हुए युद्धजन्य लूट और उजाड़े जाने का भाव व्यक्त करता है।
- source_word: ἡ ὕπαρξις
  choice: संपत्ति
  rationale: यहाँ बहुवचन-सदृश सामूहिक अर्थ में किसी की मिल्कियत या संसाधनों को सूचित करता है; ‘संपत्ति’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀφανισθήσεται
  choice: नष्ट कर दी जाएगी
  rationale: भविष्यकालीन कर्मवाच्य को सुरक्षित रखता है और पूरी तरह मिटा दिए जाने या विनाश का भाव देता है।
