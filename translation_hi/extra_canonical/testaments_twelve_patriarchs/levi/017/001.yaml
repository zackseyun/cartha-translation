  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/001.yaml
  text: And since you have heard about the seventy weeks, hear also about the priesthood.
translation:
  language: hi
  text: और चूँकि तुम सत्तर सप्ताहों के विषय में सुन चुके हो, पुरोहिताई के विषय में भी सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: सत्तर सप्ताहों
  rationale: यूनानी पदबंध का सीधा और स्वाभाविक अनुवाद; ‘सप्ताह’ मूल में निहित सात-सात की अवधियों को बनाए रखता है।
- source_word: ἱερωσύνης
  choice: पुरोहिताई
  rationale: यह शब्द पुरोहित के पद, कार्य और संस्था के सामूहिक भाव को व्यक्त करता है; केवल ‘पुरोहित’ कहने से अर्थ संकुचित हो जाता।
- source_word: ἀκούσατε
  choice: सुनो
  rationale: आज्ञार्थक रूप को सरल, प्रत्यक्ष और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘सत्तर सप्ताहों’ की कालगत व्याख्या
  choice: सत्तर सप्ताहों
  alternative: सत्तर सातकों
  rationale: पाठ स्वयं इन अवधियों की व्याख्या नहीं करता; इसलिए परिचित शाब्दिक अभिव्यक्ति रखी गई और किसी विशिष्ट भविष्यवाणीय गणना को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘क्योंकि… इसलिए’ से यूनानी ὅτι के प्रसंगगत कारण-संबंध को स्वाभाविक बनाया गया है, और καὶ को ‘भी’ से व्यक्त किया गया है।
