  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/005.yaml
  text: And the fourth will be in pains, because lawlessness will increase upon him to abundance, and all Israel will hate each one his neighbor.
translation:
  language: hi
  text: और चौथा पीड़ाओं में रहेगा, क्योंकि उस पर अधर्म बहुत बढ़ जाएगा, और सारे इस्राएल के लोग, हर एक अपने पड़ोसी से घृणा करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὀδύναις
  choice: पीड़ाओं में
  rationale: बहुवचन ὀδύναις की तीव्र शारीरिक या मानसिक वेदना की व्यापकता को बनाए रखता है।
- source_word: ἡ ἀδικία
  choice: अधर्म
  rationale: यहाँ ἀδικία अन्याय, दुष्टता और धर्म-विरुद्ध आचरण का व्यापक बोध देता है; ‘अधर्म’ इस संदर्भ में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: εἰς πλῆθος
  choice: बहुत बढ़ जाएगा
  rationale: शाब्दिक ‘बहुलता तक’ को सहज हिन्दी में वृद्धि की प्रचुर मात्रा के रूप में व्यक्त करता है।
- source_word: τὸν πλησίον αὐτοῦ
  choice: अपने पड़ोसी से
  rationale: πλησίον का सामान्य संबंधपरक अर्थ ‘पड़ोसी’ है; इसमें निकटवर्ती सह-मनुष्य का भाव सुरक्षित रहता है।
theological_decisions:
- issue: ἐπ’ αὐτῷ में सर्वनाम का संदर्भ
  choice: उस पर
  alternative: उसके समय में / उसके दौरान
  rationale: यूनानी पाठ का पुरुषवाचक एकवचन सर्वनाम संभवतः ‘चौथे’ से जुड़ता है, पर संबंध अस्पष्ट है। मुख्य पाठ में औपचारिक ‘उस पर’ रखकर इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
- issue: πᾶς Ἰσραήλ और ἕκαστος का संबंध
  choice: सारे इस्राएल में हर व्यक्ति
  alternative: सारा इस्राएल अपने-अपने पड़ोसी से घृणा करेगा
  rationale: यूनानी में सामूहिक ‘सारा इस्राएल’ के साथ ‘हर एक’ आता है। हिन्दी में ‘सारे इस्राएल में हर व्यक्ति’ दोनों तत्वों को स्पष्ट और स्वाभाविक ढंग से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और साधारण पाठक के लिए बोधगम्य रखी गई है। वाक्य की भविष्यवाणी-सदृश गंभीरता तथा मूल की अस्पष्टता को यथासंभव बनाए रखा गया है।
