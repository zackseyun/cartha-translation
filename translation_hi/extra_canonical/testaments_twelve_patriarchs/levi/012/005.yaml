base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/005.yaml
  text: I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt.
translation:
  language: hi
  text: जब मैंने कनान की भूमि में प्रवेश किया, तब मैं आठ वर्ष का था; जब मैंने शकेम को मार डाला, तब मैं अठारह वर्ष का था; जब मैंने पुरोहित के रूप में सेवा की, तब मैं उन्नीस वर्ष का था; जब मैंने विवाह किया, तब मैं अट्ठाईस वर्ष का था; और जब मैंने मिस्र में प्रवेश किया, तब मैं अड़तालीस वर्ष का था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अड़तालीस’ में अंतिम ‘आठ’ के लिए यूनानी पाठ का प्रमाण अनिश्चित है; कुछ पाठों में केवल ‘चालीस वर्ष’ है।
    reason: स्रोत संस्करण में καὶ ὀκτώ (‘और आठ’) को कोष्ठक में रखा गया है, जिससे यह संकेत मिलता है कि ‘आठ’ शब्द पाठगत रूप से अनिश्चित है।
lexical_decisions:
- source_word: εἰσῆλθον εἰς γῆν Χανάαν
  choice: कनान देश में आया
  rationale: यूनानी अभिव्यक्ति का स्वाभाविक आधुनिक हिन्दी रूप; ‘प्रवेश किया’ की अपेक्षा कथात्मक संदर्भ में अधिक सहज।
- source_word: ἀπέκτεινα τὸν Συχέμ
  choice: मैंने शकेम को मार डाला
  rationale: व्यक्तिवाचक नाम Συχέμ को कर्म के रूप में रखते हुए क्रिया की प्रत्यक्षता सुरक्षित रखी गई है।
- source_word: ἱεράτευσα
  choice: मैंने पुरोहित के रूप में सेवा की
  rationale: क्रिया का अर्थ पुरोहितीय सेवा करना है; यह अनुवाद किसी अतिरिक्त संस्थागत या संप्रदायगत अर्थ को नहीं जोड़ता।
- source_word: ἔλαβον γυναῖκα
  choice: मैंने विवाह किया
  rationale: शाब्दिक ‘पत्नी ली’ की जगह उसी अर्थ को व्यक्त करने वाला स्वाभाविक और सम्मानजनक आधुनिक हिन्दी प्रयोग।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र आया
  rationale: गंतव्य में प्रवेश करने के कथात्मक अर्थ को संक्षेप और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: लेवी की पुरोहितीय सेवा के आरम्भ का वर्णन
  choice: जब मैंने पुरोहित के रूप में सेवा की
  alternative: जब मैं पुरोहित बना
  rationale: ἱεράτευσα मुख्यतः पुरोहितीय कार्य या सेवा करने को व्यक्त करता है; ‘बना’ किसी औपचारिक नियुक्ति को अधिक स्पष्ट कर सकता था, जो यूनानी पाठ में अनिवार्य नहीं है।
- issue: मिस्र में प्रवेश के समय आयु की पाठगत अनिश्चितता
  choice: मुख्य पाठ में ‘अड़तालीस वर्ष’ और पादटिप्पणी में पाठांतर
  alternative: मुख्य पाठ में ‘चालीस वर्ष’
  rationale: संपादित स्रोत में καὶ ὀκτώ को कोष्ठक में रखा गया है, जबकि परामर्श-पाठ अड़तालीस पढ़ता है। मुख्य पाठ में पूर्ण संख्या रखकर पादटिप्पणी द्वारा वास्तविक पाठगत अनिश्चितता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य अपनाया गया है। समानांतर आयु-वाक्यों की लय बनाए रखी गई है और अनावश्यक धार्मिक पारिभाषिकता से बचा गया है।
