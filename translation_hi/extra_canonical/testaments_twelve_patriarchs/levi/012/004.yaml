  text: And in the ninety-fourth year of my life, Abraham took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day.
translation:
  language: hi
  text: और मेरे जीवन के चौरानवें वर्ष में, अब्राहम ने मेरी बेटी योकेबेद को अपने लिए पत्नी के रूप में ग्रहण किया, क्योंकि अब्राहम और मेरी बेटी एक ही दिन जन्मे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνενηκοστῷ τετάρτῳ
  choice: चौरानवें
  rationale: यूनानी क्रमवाचक पद का अर्थ ‘चौरानवाँ’ है; हिन्दी वाक्य में ‘चौरानवें वर्ष में’ स्वाभाविक रूप है।
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: यूनानी पाठ में स्पष्ट रूप से अब्राहम नाम है; इसे प्रचलित हिन्दी बाइबलीय वर्तनी में रखा गया है।
- source_word: Ἰωχαβὲδ
  choice: योकेबेद
  rationale: नाम का हिन्दी में प्रचलित बाइबलीय रूप चुना गया है।
- source_word: ἔλαβεν ... ἑαυτῷ εἰς γυναῖκα
  choice: अपने लिए पत्नी बनाया
  rationale: विवाह के लिए स्त्री को ग्रहण करने वाले यूनानी मुहावरे को अर्थ-सटीक और सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν μιᾷ ἡμέρᾳ ἐγεννήθησαν
  choice: एक ही दिन जन्मे थे
  rationale: दोनों के समान दिन जन्म लेने पर दिए गए यूनानी बल को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
