  text: '*Οἱ δὲ⁸ υἱοὶ Καὰθ⁹ Ἀβραάμ¹⁰, Ἰσαχάρ¹¹, Χεβρών¹² καὶ¹³ Ὀζηήλ¹⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/002.yaml
  text: And the sons of Kohath were Amram, Issachar, Hebron, and Uzziel.
translation:
  language: hi
  text: और कहात के पुत्र अब्राहम[a], इस्साकार, हेब्रोन और उज्जीएल थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ “अब्राहम” है; समानांतर वंशावलियों में कहात का पुत्र “अम्राम” मिलता है।
    reason: मूल पाठ के स्पष्ट पठन और अपेक्षित वंशावली-नाम के बीच के अंतर को सुरक्षित और पारदर्शी रखना।
lexical_decisions:
- source_word: Καὰθ
  choice: कहात
  rationale: यह कोहाती वंश के पूर्वज के नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: Ἀβραάμ
  choice: अब्राहम
  rationale: दिए गए यूनानी पाठ में स्पष्ट रूप से ‘अब्राहम’ है; वंशावली के अपेक्षित नाम ‘अम्राम’ को मुख्य पाठ में रखकर मूल पाठ की कठिनाई को चुपचाप सुधारा नहीं गया।
- source_word: Ἰσαχάρ
  choice: इस्साकार
  rationale: यूनानी नाम का स्वाभाविक और पहचाना जाने वाला हिन्दी रूप।
- source_word: Χεβρών
  choice: हेब्रोन
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ὀζηήλ
  choice: उज्जीएल
  rationale: यूनानी रूप से सूचित तथा हिन्दी पाठकों में परिचित बाइबलीय नाम।
theological_decisions:
- issue: कहात के पहले पुत्र के नाम में पाठगत/वंशावलीगत तनाव
  choice: मुख्य पाठ में ‘अब्राहम’ रखा गया और टिप्पणी में कठिनाई बताई गई।
  alternative: वंशावली के समानांतर प्रमाण और अंग्रेज़ी POB के अनुसार ‘अम्राम’ कर देना।
  rationale: अनुवाद दिए गए मूल-भाषा पाठ पर आधारित होना चाहिए और वास्तविक पाठगत तनाव को बिना सूचना के हल नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी स्रोत में उद्धृत वाक्य के बाद ‘वह मर गया’ जैसा कोई खंड नहीं है, इसलिए नवीनतम पुनरीक्षण-विवरण में उल्लिखित वह वाक्य नहीं जोड़ा गया।
