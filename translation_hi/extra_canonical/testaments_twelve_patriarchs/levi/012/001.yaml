translation:
  language: hi
  text: और गेरसाम ने एक स्त्री से विवाह किया, और उससे लोम्ने और सेमे को उत्पन्न किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γερσὰμ
  choice: गेरसाम
  rationale: यूनानी नाम का सरल देवनागरी लिप्यंतरण।
- source_word: γυναῖκα
  choice: एक स्त्री से विवाह किया
  rationale: ἔλαβεν ... γυναῖκα का स्वाभाविक आधुनिक हिन्दी अर्थ; इसका आशय पत्नी ग्रहण करना है।
- source_word: ἔτεκεν
  choice: जन्म दिया
  rationale: τίκτω का सीधा प्रसव-संबंधी अर्थ रखा गया है और पिछले खंड में उल्लिखित पत्नी को निहित कर्ता माना गया है।
- source_word: Λομνὴ καὶ Σεμεῆ
  choice: लोम्ने और सेमे
  rationale: दोनों व्यक्तिनामों का यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: ἔτεκεν के निहित कर्ता और ἐξ αὐτῆς का संबंध
  choice: पत्नी को जन्म देने वाली मानकर वाक्य प्रस्तुत किया गया है
  alternative: “और उससे उसने लोम्ने और सेमे को उत्पन्न किया”
  rationale: ἔτεκεν सामान्यतः स्त्री द्वारा जन्म देने के लिए प्रयुक्त होता है, इसलिए पत्नी को निहित कर्ता मानना अर्थ की दृष्टि से स्वाभाविक है; फिर भी यूनानी वाक्य की व्याकरणिक बनावट दूसरा पाठ भी संभव बनाती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
