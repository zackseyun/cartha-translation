  language: hi
  text: मेरे जीवन के एक सौ अठारहवें वर्ष में यूसुफ की मृत्यु हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωσήφ
  choice: यूसुफ
  rationale: इस नाम का प्रचलित और सहज हिन्दी बाइबलीय रूप।
- source_word: ἑκατοστῷ ὀγδόῳ καὶ δεκάτῳ
  choice: एक सौ अठारहवें
  rationale: यूनानी क्रमवाचक पद का स्वाभाविक हिन्दी रूप; यह ‘मेरे जीवन के वर्ष’ को विशेषित करता है।
- source_word: μου ἔτει
  choice: मेरे जीवन के ... वर्ष में
  rationale: शाब्दिक अर्थ ‘मेरे वर्ष में’ है; प्रसंगानुसार ‘जीवन के’ जोड़ने से आशय आधुनिक हिन्दी में स्पष्ट और स्वाभाविक होता है।
- source_word: ἀπέθανεν
  choice: की मृत्यु हो गई
  rationale: यूनानी साधारण भूतकाल का गरिमापूर्ण और स्वाभाविक हिन्दी निरूपण।
