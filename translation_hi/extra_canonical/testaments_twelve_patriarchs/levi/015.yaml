  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
translation:
  language: hi
  text: 15:1 इसलिए वह मन्दिर[a], जिसे प्रभु चुनेगा, तुम्हारी अशुद्धता में उजाड़ हो जाएगा, और तुम सब राष्ट्रों में बंदी होकर जाओगे। 2 तुम उनके लिए घृणा की वस्तु बनोगे, और परमेश्वर के धर्मपूर्ण न्याय[b] से अपमान और सदा की लज्जा पाओगे। 3 जितने लोग तुमसे घृणा करते हैं, वे तुम्हारे विनाश पर आनन्द मनाएँगे। 4 और यदि हमारे पूर्वज अब्राहम, इसहाक और याकूब के कारण तुम्हें दया न मिलती, तो तुम्हारे वंश[c] में से एक भी पृथ्वी पर शेष न रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मन्दिर’ के लिए यूनानी शब्द ναός है, जो विशेष रूप से पवित्र मन्दिर या उसके पवित्रस्थान को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘धर्मपूर्ण न्याय’ का अनुवाद ‘न्यायपूर्ण न्याय’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से ‘बीज’ है; यहाँ इसका अर्थ वाचा से जुड़ी वंश-परंपरा या संतान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ναός
  choice: मन्दिर
  rationale: यहाँ शब्द परमेश्वर द्वारा चुने गए पवित्र उपासना-स्थान, अर्थात यरूशलेम के मन्दिर, को सूचित करता है। ‘मन्दिर’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: ἔρημος ἔσται
  choice: उजाड़ हो जाएगा
  rationale: यह विनाश और परित्याग, दोनों का न्यायसूचक भाव रखता है तथा भविष्यवाणी की गंभीर शैली को बनाए रखता है।
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: तुम्हारी अशुद्धता के बीच
  rationale: ἐν के ‘में/बीच’ संबंध को बनाए रखते हुए उपासना-संबंधी और नैतिक दूषण का भाव व्यक्त किया गया है; इसे केवल स्पष्ट कारणवाचक ‘के कारण’ में नहीं बदला गया।
- source_word: αἰχμάλωτοι ἔσεσθε εἰς πάντα τὰ ἔθνη
  choice: तुम सब राष्ट्रों में बंदी होकर जाओगे
  rationale: यह बंदी बनाए जाने और राष्ट्रों में निर्वासन, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βδέλυγμα
  choice: घृणा की वस्तु
  rationale: यह यूनानी शब्द की तीव्र घृणा का भाव स्पष्ट और सहज हिन्दी में रखता है; केवल सामान्य ‘अप्रिय’ कहना इसकी शक्ति घटा देता।
- source_word: ὄνειδος
  choice: निन्दा
  rationale: निन्दा सार्वजनिक अपमान और तिरस्कार के अर्थ को गंभीर, बाइबिलीय हिन्दी में व्यक्त करती है।
- source_word: αἰσχύνην αἰώνιον
  choice: सदा की लज्जा
  rationale: यह लज्जा की स्थायी अवधि को व्यक्त करता है, पर पाठ से आगे बढ़कर किसी विकसित परलोक-संबंधी श्रेणी को आरोपित नहीं करता।
- source_word: δικαιοκρισίας
  choice: धर्ममय न्याय
  rationale: यौगिक शब्द ऐसे न्याय को दर्शाता है जिसका चरित्र धर्मपूर्ण और उचित है; ‘धर्ममय न्याय’ इस धार्मिक नैतिक बल को बनाए रखता है।
- source_word: ἀπωλείᾳ
  choice: विनाश
  rationale: संदर्भ में यह समुदाय के पतन और नाश को दर्शाता है; ‘विनाश’ स्पष्ट और पर्याप्त रूप से प्रबल है।
- source_word: ἔλεος λήψεσθε
  choice: तुम्हें दया मिलती
  rationale: सशर्त वाक्य में दया को प्राप्त वरदान के रूप में रखा गया है, न कि मनुष्य का स्वतःसिद्ध अधिकार मानकर।
- source_word: σπέρματος
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ संतान और वंश-परंपरा अभिप्रेत है। ‘वंश’ हिन्दी में स्वाभाविक रहते हुए वाचा-संबंधी वंशावली का भाव बचाता है।
- source_word: οὐ μὴ καταλειφθῇ
  choice: एक भी ... शेष न रहता
  rationale: ‘एक भी’ यूनानी के प्रबल निषेध और पूर्णता को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: पूर्वजों के कारण मिलने वाली दया
  choice: दया को अब्राहम, इसहाक और याकूब के कारण मिलने वाला बताया गया है।
  alternative: पूर्वजों को केवल विश्वासयोग्यता के उदाहरण मानना या उनके वाचा-संबंधी स्थान को अस्पष्ट कर देना।
  rationale: यूनानी पाठ दया को सीधे इन पूर्वजों से जोड़ता है। अनुवाद उस तनाव को बनाए रखता है, पर मध्यस्थता की कोई विकसित doctrinal व्याख्या नहीं जोड़ता।
- issue: ‘सदा की लज्जा’ का दायरा
  choice: इसे परमेश्वर के न्याय के अधीन स्थायी लज्जा के रूप में अनूदित किया गया है।
  alternative: इसे केवल अल्पकालीन ऐतिहासिक अपमान तक सीमित करना, अथवा स्पष्ट रूप से अंतिम दण्ड की व्यवस्थित धार्मिक धारणा बनाना।
  rationale: αἰώνιον गंभीर और टिकाऊ लज्जा व्यक्त करता है, किंतु यह अध्याय उसके स्वरूप को किसी अधिक विस्तृत धार्मिक प्रणाली में परिभाषित नहीं करता।
- issue: मन्दिर का उजाड़ होना और अशुद्धता
  choice: ‘तुम्हारी अशुद्धता के बीच’ रखकर ἐν की अस्पष्ट संबंधवाचकता सुरक्षित रखी गई है।
  alternative: इसे केवल ‘तुम्हारी अशुद्धता के कारण’ बनाकर स्पष्ट कारणवाचक अर्थ तय कर देना।
  rationale: अशुद्धता न्याय का प्रसंग और संभावित कारण है, पर यूनानी पूर्वसर्ग ἐν को अनुवाद में चुपचाप अधिक निश्चित कारणवाचक रूप नहीं दिया गया।
