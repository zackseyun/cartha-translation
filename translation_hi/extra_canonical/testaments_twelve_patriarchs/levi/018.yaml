  text: 1 And after their vengeance has come from the Lord[5], the priesthood will fail. 2 Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute a judgment of truth upon the earth for many days. 3 And his star will rise in heaven like a king, giving light with the light of knowledge like the sun by day, and he will be magnified in the inhabited world. 4 He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth. 5 The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; and the angels of the glory of the Lord's presence will be glad in him. 6 The heavens will be opened, and from the temple of glory sanctification will come upon him with a fatherly voice, as from Abraham to Isaac. 7 And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him. 8 For
    he will give the majesty of the Lord to his sons in truth forever, and there will be no successor to him for generation upon generation, forever. 9 And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. During his priesthood sin will fail, and the lawless will cease from evil. 10 And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam. 11 And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them. 12 And Beliar will be bound by him, and he will give authority to his children to trample on evil spirits. 13 And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever. 14 Then Abraham and Isaac and Jacob will exult, and I will be glad[10][9b][9a][7], and all the holy ones will put on righteousness.
translation:
  language: hi
  text: '**लेवी का वसीयतनामा 18**


    **1** उनका प्रतिशोध प्रभु की ओर से हो जाने के बाद याजकपद समाप्त हो जाएगा। **2** तब प्रभु एक नया याजक खड़ा करेगा, जिसे प्रभु के सभी वचन प्रकट किए जाएँगे; और वह बहुत दिनों तक पृथ्वी पर सत्य के अनुसार न्याय करेगा। **3** उसका तारा आकाश में राजा के समान उदय होगा; वह दिन में सूर्य के समान ज्ञान का प्रकाश फैलाएगा, और बसे हुए संसार में महान ठहरेगा। **4** वह पृथ्वी पर सूर्य के समान चमकेगा, आकाश के नीचे से सारा अंधकार दूर कर देगा, और सारी पृथ्वी पर शांति होगी।


    **5** उसके दिनों में आकाश आनंदित होगा, पृथ्वी प्रसन्न होगी और बादल हर्षित होंगे;[a] और प्रभु की उपस्थिति की महिमा के स्वर्गदूत उसमें आनंदित होंगे। **6** आकाश खुल जाएँगे, और महिमा के मंदिर से पवित्रीकरण पिता-सदृश वाणी के साथ उस पर आएगा, जैसे अब्राहम से इसहाक के पास। **7** उसके ऊपर परमप्रधान की महिमा की घोषणा की जाएगी, और समझ तथा पवित्रीकरण की आत्मा उस पर ठहरेगी।[b]


    **8** क्योंकि वह प्रभु का प्रताप अपने पुत्रों को सच्चाई में सदा के लिए देगा। पीढ़ी-दर-पीढ़ी, युगानुयुग उसका कोई उत्तराधिकारी नहीं होगा। **9** उसके याजकपद के समय पृथ्वी पर राष्ट्र ज्ञान में बढ़ेंगे और प्रभु के अनुग्रह से प्रकाश पाएँगे।[c] उसके याजकपद के समय पाप समाप्त हो जाएगा और अधर्मी बुराई करना छोड़ देंगे।[d] **10** निश्चय ही वह स्वर्गोद्यान के द्वार खोलेगा और आदम के विरुद्ध तनी हुई धमकी देने वाली तलवार को हटा देगा।[e] **11** वह पवित्र जनों को जीवन के वृक्ष में से खाने देगा, और पवित्रता की आत्मा उन पर बनी रहेगी।


    **12** वह बेलियार को बाँध देगा और अपने बच्चों को दुष्ट आत्माओं को पैरों तले रौंदने का अधिकार देगा। **13** प्रभु अपने बच्चों पर आनंदित होगा और अपने प्रिय जनों से युगानुयुग प्रसन्न रहेगा। **14** तब अब्राहम, इसहाक और याकूब आनंद से झूम उठेंगे; मैं भी प्रसन्न होऊँगा, और सभी पवित्र जन धार्मिकता को वस्त्र के समान पहनेंगे।


    **पाठ-संबंधी टिप्पणियाँ**


    [a] कुछ पांडुलिपियों में इसके बाद यह जोड़ा गया है: “और प्रभु का ज्ञान समुद्रों के जल के समान पृथ्वी पर उंडेला जाएगा।”


    [b] कुछ पांडुलिपियों में यह जोड़ा गया है: “जल में।”


    [c] कुछ पांडुलिपियों में यह जोड़ा गया है: “परंतु इस्राएल अज्ञान में घटता जाएगा और शोक में अंधकारमय हो जाएगा।”


    [d] कुछ पांडुलिपियों में यह जोड़ा गया है: “परंतु धर्मी उसमें विश्राम पाएँगे।”


    [e] यह धमकी देने वाली तलवार उस तलवार की ओर संकेत करती है जिसे आदम के अदन से निकाले जाने के बाद जीवन के वृक्ष तक जाने वाले मार्ग की रखवाली के लिए रखा गया था।'
  philosophy: optimal-equivalence
