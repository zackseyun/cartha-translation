    **5** उसके दिनों में आकाश आनंद मनाएगा, पृथ्वी मग्न होगी और बादल हर्षित होंगे;[a] और प्रभु की उपस्थिति की महिमा के स्वर्गदूत उसमें आनंदित होंगे। **6** आकाश खोल दिए जाएँगे और महिमा के मंदिर से पवित्रीकरण उस पर उतरेगा। साथ में पिता की-सी वाणी सुनाई देगी, जैसे अब्राहम की ओर से इसहाक के लिए सुनाई दी हो। **7** उसके ऊपर परमप्रधान की महिमा की घोषणा की जाएगी, और समझ तथा पवित्रीकरण की आत्मा उस पर ठहरेगी।[b]


    **8** क्योंकि वह प्रभु का प्रताप अपने पुत्रों को सच्चाई में सदा के लिए देगा। पीढ़ी-दर-पीढ़ी, युगानुयुग उसका कोई उत्तराधिकारी नहीं होगा। **9** उसके याजकपद के समय पृथ्वी पर राष्ट्र ज्ञान में बढ़ेंगे और प्रभु के अनुग्रह से प्रकाश पाएँगे।[c] उसके याजकपद के समय पाप समाप्त हो जाएगा और अधर्मी बुराई करना छोड़ देंगे।[d] **10** निश्चय ही वह स्वर्गोद्यान के द्वार खोलेगा और आदम के विरुद्ध खड्ग से मिलने वाली धमकी को दूर करेगा।[e] **11** वह पवित्र जनों को जीवन के वृक्ष में से खाने देगा, और पवित्रता की आत्मा उन पर बनी रहेगी।


    **12** वह बेलियार को बाँध देगा और अपने बच्चों को दुष्ट आत्माओं को पैरों तले रौंदने का अधिकार देगा। **13** प्रभु अपने बच्चों पर आनंदित होगा और अपने प्रिय जनों से युगानुयुग प्रसन्न रहेगा। **14** तब अब्राहम, इसहाक और याकूब आनंद से झूम उठेंगे; मैं भी प्रसन्न होऊँगा, और सभी पवित्र जन धार्मिकता को वस्त्र के समान पहनेंगे।


