lexical_decisions:
- source_word: ἱερωσύνη
  choice: याजकपद
  rationale: यह पद याजकीय कार्य, पद और व्यवस्था—तीनों को समेटता है; आधुनिक हिन्दी में ‘याजकपद’ प्रसंग के समाप्त होने और फिर नए याजक के उठाए जाने के बीच संबंध स्पष्ट रखता है।
- source_word: ἱερέα καινόν
  choice: एक नया याजक
  rationale: καινός की युगांतरकारी नवीनता को ‘नया’ सहज रूप से व्यक्त करता है और व्यक्ति की पहचान को मसीह या किसी ऐतिहासिक महायाजक के रूप में तय नहीं करता।
- source_word: κρίσιν ἀληθείας
  choice: सत्य के अनुसार न्याय
  rationale: यूनानी संबंधवाचक पदबंध की गंभीरता रखते हुए हिन्दी में स्वाभाविक अर्थ देता है; ‘सच्चा न्याय’ की तुलना में न्याय के सत्य-सम्मत चरित्र को अधिक स्पष्ट करता है।
- source_word: οἰκουμένη
  choice: सारा बसा हुआ संसार
  rationale: यह अमूर्त ब्रह्मांड नहीं, मानव-निवास वाले जगत का बोध कराता है।
- source_word: ἁγίασμα
  choice: पवित्रीकरण
  rationale: यह ऊपर से आने वाले पवित्र अभिषेक अथवा समर्पण का अमूर्त भाव बनाए रखता है, बिना किसी अनुल्लिखित वस्तु को जोड़ने के।
- source_word: φωνῆς πατρικῆς
  choice: पिता की-सी वाणी
  rationale: पितृसुलभ गुण और अब्राहम-इसहाक संबंध दोनों को सरल, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  choice: समझ तथा पवित्रीकरण की आत्मा
  rationale: ‘समझ’ बोध और विवेक को समेटता है; ‘पवित्रीकरण’ मूल के क्रियात्मक पवित्र भाव को बनाए रखता है।
- source_word: μεγαλωσύνη
  choice: प्रताप
  rationale: ईश्वरीय महानता और राजसी गरिमा दोनों को संक्षेप में व्यक्त करता है।
- source_word: διαδοχή
  choice: उत्तराधिकारी
  rationale: प्रसंग में याजकीय पद के किसी अन्य व्यक्ति को हस्तांतरित न होने की बात सहज रूप से व्यक्त होती है।
- source_word: τὰ ἔθνη
  choice: राष्ट्र
  rationale: यह गैर-यहूदी जनसमुदायों की व्यापकता रखता है और बाद की विशिष्ट पारिभाषिकता को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: φωτισθήσονται
  choice: प्रकाश पाएँगे
  rationale: अध्याय के प्रकाश और ज्ञान, दोनों रूपकों को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: व्यक्तिवाचक नाम को अनुवादित या किसी बाद की दानवी पहचान से समान किए बिना लिप्यंतरित किया गया है।
theological_decisions:
- issue: ‘नए याजक’ की पहचान
  choice: मुख्य पाठ में केवल ‘एक नया याजक’
  alternative: याजकीय मसीहा, यीशु, अथवा नवीकृत आदर्श याजकपद के किसी प्रतिनिधि के रूप में स्पष्ट पहचान
  rationale: पाठ एक विलक्षण और विश्वव्यापी भूमिका वाले याजक का वर्णन करता है, पर उसकी ऐतिहासिक या मसीही पहचान स्वयं स्पष्ट नहीं करता; अनुवाद इस तनाव को खुला रखता है।
- issue: पद 5, 7 और 9 की कोष्ठकबद्ध पाठ-वृद्धियाँ
  choice: मुख्य पाठ से अलग रखकर पादटिप्पणियों में देना
  alternative: उन्हें मुख्य पाठ में सम्मिलित करना
  rationale: स्रोत संस्करण उन्हें पाठ की अनिश्चित अथवा द्वितीयक सामग्री के रूप में चिह्नित करता है; पादटिप्पणी पाठक को प्रमाण दिखाती है और मुख्य पाठ को बिना सूचना बढ़ाने से बचाती है।
- issue: पद 11 का πνεῦμα ἁγιωσύνης
  choice: ‘पवित्रता की आत्मा’ और ‘पवित्र आत्मा’ को नाम-सूचक रूप में नहीं लिखना
  alternative: ‘पवित्र आत्मा’ को निश्चित त्रिएकवादी उपाधि के रूप में प्रस्तुत करना
  rationale: यूनानी पदबंध गहरा धार्मिक अर्थ रख सकता है, पर यहाँ बाद की धर्मसैद्धांतिक निश्चितता थोपना उचित नहीं है।
- issue: पद 8 और 12 में ‘उसके पुत्र/बच्चे’ का संदर्भ
  choice: सर्वनामगत अस्पष्टता को बनाए रखना
  alternative: इसे स्पष्टतः याजक के अनुयायी, प्रभु की संतान, इस्राएल, या किसी अन्य समूह के रूप में पहचानना
  rationale: मूल में αὐτοῦ का पूर्वपद प्रसंगतः विवादास्पद हो सकता है; अनुवाद ने उसे चुपचाप निश्चित नहीं किया।
- issue: पद 6 की पितृ-वाणी
