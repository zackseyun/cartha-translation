  text: '1[a]. And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar[b].

    2. And his sons answered him, saying, “Before the Lord we will walk, and according to his law.”

    3. And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him[c], “Witnesses.”'
translation:
  language: hi
  text: '**लेवी का वसीयतनामा 19**


    **1.** “और अब, मेरे बच्चों, तुम सब कुछ सुन चुके हो। अपने लिए चुन लो—या तो प्रकाश या अंधकार; या तो प्रभु की व्यवस्था या बेलियार के कर्म[a]।”[b]


    **2.** उसके पुत्रों ने उसे उत्तर दिया, “हम प्रभु के सामने और उसकी व्यवस्था के अनुसार चलेंगे।”[c]


    **3.** तब उनके पिता ने उनसे कहा, “प्रभु साक्षी है, उसके स्वर्गदूत साक्षी हैं, तुम साक्षी हो और मैं भी साक्षी हूँ—तुम्हारे मुँह के वचन के विषय में।” उसके पुत्रों ने उससे कहा, “हम साक्षी हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेलियार के काम।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में नाम “बेलियार” है; अन्य परंपराओं में इसका “बेलियाल” रूप भी मिलता है।
    reason: alternative_reading
  - marker: c
    text: “प्रभु के सामने चलना” बाइबिल का एक मुहावरा है, जिसका अर्थ परमेश्वर के सम्मुख उत्तरदायी और आज्ञाकारी जीवन जीना है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: अपने लिए चुन लो
  rationale: मध्यवाच्य आज्ञार्थक का आत्म-संबंधी बल बनाए रखता है और हिंदी में व्यक्तिगत, निर्णायक चुनाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φῶς / σκότος
  choice: प्रकाश / अंधकार
  rationale: नैतिक-प्रतीकात्मक विरोध को बिना ‘भलाई/बुराई’ जैसी व्याख्यात्मक अदला-बदली के सीधे सुरक्षित रखता है।
- source_word: νόμον κυρίου
  choice: प्रभु की व्यवस्था
  rationale: ‘व्यवस्था’ धार्मिक-वाचा संबंधी νόμος के लिए प्रतिष्ठित और सुबोध हिंदी शब्द है; κύριος को ‘प्रभु’ रखा गया है।
- source_word: ἔργα τοῦ Βελίαρ
  choice: बेलियार के कर्म
  rationale: ἔργα के नैतिक आशय और गंभीर शैली को ‘कर्म’ व्यक्त करता है; Βελίαρ को पाठ में प्राप्त रूप के अनुसार नाम की तरह लिप्यंतरित किया गया है।
- source_word: Ἐνώπιον κυρίου πορευσόμεθα
  choice: हम प्रभु के सामने चलेंगे
  rationale: परमेश्वर के सम्मुख उत्तरदायी जीवन जीने के बाइबिलीय मुहावरे को बनाए रखता है; अस्पष्टता से बचने के लिए पादटिप्पणी दी गई है।
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: उसकी व्यवस्था के अनुसार चलेंगे
  rationale: κατά के मानक या नियमन के भाव को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है; साझा क्रिया को हिंदी में दोहराना वाक्य को सुबोध बनाता है।
- source_word: Μάρτυς / μάρτυρες
  choice: साक्षी / साक्षी हैं
  rationale: पूरे पद में एक ही कानूनी-वाचागत शब्दावली बनाए रखी गई है।
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: तुम्हारे मुँह से निकले इस वचन के विषय में
  rationale: मूल के ठोस ‘तुम्हारे मुँह का वचन’ को स्वाभाविक हिंदी बनाते हुए उनके बोले हुए प्रण पर जोर सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रकाश/अंधकार’ और ‘प्रभु की व्यवस्था/बेलियार के कर्म’ का नैतिक द्वैत
  choice: दोनों समानांतर विकल्पों को सीधे और तीखे विरोध के रूप में रखा गया है।
  alternative: इन्हें ‘भलाई/बुराई’ या ‘धार्मिकता/दुष्टता’ कहकर अर्थ खोल देना।
  rationale: यूनानी पाठ की प्रकाश-अंधकार वाली प्रतीकात्मक और वसीयतनामाई शैली को सुरक्षित रखना चाहिए, न कि उसे अमूर्त नैतिक शब्दों में सीमित कर देना चाहिए।
- issue: Βελίαρ का रूप
  choice: बेलियार
  alternative: बेलियाल
  rationale: यूनानी साक्ष्य में Βελίαρ है; परिचित रूप से सामान्यीकरण करने के बजाय प्राप्त नाम-रूप का लिप्यंतरण स्रोत के प्रति अधिक पारदर्शी है।
- issue: पुत्रों का अंतिम उत्तर Μάρτυρες
  choice: “हम साक्षी हैं।”
  alternative: केवल “साक्षी।” या “साक्षी हैं।”
  rationale: यूनानी में बहुवचन विधेय से निहित प्रथम-पुरुष उत्तर समझ में आता है। हिंदी में ‘हम’ जोड़ना उस संक्षिप्त पुष्टि को स्पष्ट करता है, बिना कोई नया साक्षी-वर्ग जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, वसीयतनामाई और वाचा-संबंधी लहजा रखा गया है। ‘मेरे बच्चो’ पारिवारिक संबोधन को सहज बनाता है; ‘प्रभु’, ‘व्यवस्था’, ‘कर्म’ और ‘साक्षी’ पाठ की धार्मिक-कानूनी गंभीरता बनाए रखते हैं। मुहावरे को मुख्य पाठ में संरक्षित कर पादटिप्पणी में समझाया गया है।
