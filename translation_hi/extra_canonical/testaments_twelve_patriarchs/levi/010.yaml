  text: 1[v2]. And now, children, keep what I command you, since I have declared to you all that I heard from my fathers. 2[v2]. And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils from the Lord against him. 3. And you will act lawlessly in Israel, so that Jerusalem will not be able to bear it because of your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame. 4. And you will be scattered as captives among the nations, and there you will be for reproach and for a curse. 5. For the house which the Lord will choose shall be called Jerusalem[v5][v3], as the book of Enoch the righteous contains.
translation:
  language: hi
  text: '**लेवी का वसीयतनामा 10**


    **1** और अब, मेरे बच्चों, जिन बातों की आज्ञा मैं तुम्हें देता हूँ उनका पालन करो, क्योंकि जो कुछ मैंने अपने पूर्वजों से सुना है, वह सब मैंने तुम्हें बता दिया है।


    **2** देखो, मैं तुम्हारी उस भक्ति-विहीनता और अपराध का दोषी नहीं हूँ, जिसे तुम युगों की पूर्णता पर [संसार के उद्धारकर्ता, मसीह के विरुद्ध][a] करोगे—इस्राएल को भटकाते हुए और उसके विरुद्ध प्रभु की ओर से बड़ी विपत्तियाँ उठाते हुए।[b]


    **3** तुम इस्राएल में व्यवस्था-विरुद्ध काम करोगे, यहाँ तक कि तुम्हारी दुष्टता के कारण यरूशलेम इसे सह नहीं सकेगा; बल्कि मंदिर का परदा[c] फट जाएगा, ताकि वह तुम्हारी लज्जा को ढक न सके।


    **4** तुम बंदी होकर जाति-जाति में तितर-बितर किए जाओगे, और वहाँ निंदा और शाप के पात्र बनोगे।


    **5** क्योंकि जिस भवन को प्रभु चुनेगा, वह यरूशलेम कहलाएगा, जैसा धर्मी हनोक की पुस्तक में है।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “संसार के उद्धारकर्ता, मसीह के विरुद्ध” शब्द यहाँ प्रयुक्त यूनानी साक्ष्य में हैं, पर अनेक विद्वान इन्हें बाद में जोड़ा गया मसीही विस्तार मानते हैं। इसलिए इन्हें कोष्ठकों में रखा गया है।
    reason: textual_variant
  - marker: b
    text: “उसके विरुद्ध प्रभु की ओर से बड़ी विपत्तियाँ उठाते हुए” वाक्यांश की यूनानी वाक्य-रचना कठिन है। “उसके” का संकेत किसकी ओर है, इसे अलग-अलग ढंग से समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: इसका अनुवाद “पर्दा” या “आवरण” भी हो सकता है। यहाँ मंदिर के भीतरी भाग में लटके परदे का बिंब है।
    reason: lexical_alternative
  - marker: d
    text: हनोक की पुस्तक का उल्लेख दूसरे मंदिर-काल के उस व्यापक साहित्यिक संसार को दर्शाता है, जिसमें पूर्वजों से संबद्ध प्रामाणिक पुस्तकों का भी उद्धरण दिया जाता था, भले ही वे बाद में निर्धारित बाइबिल-संग्रह में सम्मिलित न हुई हों।
    reason: cultural_note
lexical_decisions:
- source_word: φυλάξατε
  choice: पालन करो
  rationale: आज्ञाओं के संदर्भ में यह आज्ञाकारी रीति से मानने का स्वाभाविक आधुनिक हिन्दी रूप है; केवल ‘रक्षा करो’ कहना आशय को संकुचित करता।
- source_word: ἐντέλλομαι
  choice: आज्ञा मैं तुम्हें देता हूँ
  rationale: लेवी के वसीयतनुमा उपदेश की अधिकारपूर्ण और आदेशात्मक ध्वनि बनाए रखता है।
- source_word: πατέρων
  choice: पूर्वजों
  rationale: बहुवचन यहाँ केवल प्रत्यक्ष पिताओं के बजाय पैतृक पूर्वजों का संकेत दे सकता है; हिन्दी में ‘पूर्वज’ इस व्यापकता को स्वाभाविक रूप से रखता है।
- source_word: ἀθῷός εἰμι
  choice: दोषी नहीं हूँ
  rationale: आने वाले पापों के उत्तरदायित्व से मुक्त होने का आशय सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: ἀσεβείας
  choice: भक्ति-विहीनता
  rationale: यह अपराध के धार्मिक और परमेश्वर-विरोधी आयाम को रखता है, न कि उसे केवल सामान्य दुष्टता बना देता है।
- source_word: παραβάσεως
  choice: अपराध
  rationale: ज्ञात मर्यादा या आज्ञा के उल्लंघन का भाव वर्तमान, सुबोध हिन्दी में व्यक्त करता है।
- source_word: συντελείᾳ τῶν αἰώνων
  choice: युगों की पूर्णता
  rationale: यूनानी की प्रलयकालीन और परिपूर्णता-संबंधी ध्वनि रखता है तथा इसे केवल ‘अंत समय’ में सरल नहीं करता।
- source_word: σωτῆρα
  choice: उद्धारकर्ता
  rationale: यूनानी उपाधि का धार्मिक भार और बचाने वाले का अर्थ सीधे व्यक्त करता है।
- source_word: χριστόν
  choice: मसीह
  rationale: यहाँ व्यक्तिनाम से अधिक अभिषिक्त जन की उपाधि है; ‘मसीह’ हिन्दी धार्मिक प्रयोग में इस भाव को रखता है।
- source_word: πλανῶντες
  choice: भटकाते हुए
  rationale: इस्राएल को सही मार्ग से दूर ले जाने की सक्रिय सामुदायिक क्रिया व्यक्त करता है।
- source_word: ἐπεγείροντες
  choice: खड़ी करते हुए
  rationale: विपत्तियों को उकसाने या अपने ऊपर लाने की कारक शक्ति व्यक्त करता है, जबकि कठिन वाक्य-संबंध को पूरी तरह व्याख्यायित नहीं करता।
- source_word: κακὰ μεγάλα
  choice: बड़ी विपत्तियाँ
  rationale: शाब्दिक ‘बड़ी बुराइयाँ’ हिन्दी में नैतिक बुरे कर्मों का भ्रम दे सकता है; संदर्भ में विनाशकारी दैवी संकट या न्याय का आशय अधिक स्वाभाविक रूप से ‘विपत्तियाँ’ से आता है।
- source_word: ἀνομήσετε
  choice: व्यवस्था-विरुद्ध काम करोगे
  rationale: सक्रिय और निरंतर विद्रोही आचरण का भाव रखता है और ‘अराजकता’ जैसे आधुनिक राजनीतिक अर्थ से बचता है।
- source_word: καταπέτασμα
  choice: परदा
  rationale: मंदिर के भीतर लटके विभाजक आवरण के लिए सामान्य और सुबोध हिन्दी शब्द है; विकल्प को टिप्पणी में रखा गया है।
- source_word: ὄνειδος ... κατάραν
  choice: निंदा और शाप के पात्र
  rationale: 'यूनानी के परिणामसूचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है: वे दूसरों की निंदा और शाप का लक्ष्य बनेंगे।'
- source_word: περιέχει ἡ βίβλος
  choice: पुस्तक में लिखा है
  rationale: शाब्दिक ‘पुस्तक में समाहित है’ की तुलना में यह उद्धरण-सूचक सूत्र का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: पद 2 में “संसार के उद्धारकर्ता, मसीह के विरुद्ध” पाठांश
  choice: मुख्य पाठ में वर्ग कोष्ठकों के भीतर रखा
  alternative: इसे बाद का प्रक्षेप मानकर छोड़ देना, अथवा बिना कोष्ठकों के निर्विवाद मूल पाठ की तरह रखना
  rationale: दिया गया यूनानी साक्ष्य इसे रखता है, किंतु इसकी स्पष्ट मसीही भाषा के कारण इसे प्रायः बाद का विस्तार माना जाता है। कोष्ठक साक्ष्य का अनुवाद भी रखते हैं और पाठगत संदेह भी दिखाते हैं।
- issue: पद 2 में “उसके विरुद्ध प्रभु की ओर से बड़ी विपत्तियाँ” का संबंध
  choice: सर्वनाम को ‘उसके’ के रूप में अस्पष्ट रखा और कठिनाई टिप्पणी में बताई
  alternative: ‘उसके’ को निश्चित रूप से मसीह, इस्राएल, या अपराधियों से जोड़ देना
  rationale: यूनानी वाक्य-विन्यास और सर्वनाम-संदर्भ कठिन है; किसी एक धर्मवैज्ञानिक व्याख्या को पाठ में थोपना उचित नहीं।
- issue: पद 3 में मंदिर का परदा फटना
  choice: इसे बिना व्याख्यात्मक विस्तार के भविष्यसूचक न्याय-बिंब के रूप में अनूदित किया
  alternative: इसे सुसमाचारों के दुःखभोग-वृत्तांत का स्पष्ट संकेत बताना, अथवा केवल याजकीय लज्जा का रूपक घोषित करना
  rationale: यूनानी पाठ परदा फटने और लज्जा न ढक पाने की बात करता है; अनुवाद इसी बिंब को रखता है, बाद की कैननिक व्याख्या को मूल पंक्ति में नहीं जोड़ता।
- issue: पद 5 में हनोक की पुस्तक का प्रामाणिक उद्धरण
  choice: उद्धरण को सीधे रखा और ऐतिहासिक साहित्यिक संदर्भ टिप्पणी में बताया
  alternative: हनोक की पुस्तक को आधुनिक कैनन की किसी निश्चित स्थिति में वर्गीकृत करके पाठ का दावा कमजोर या मजबूत करना
  rationale: पाठ स्वयं धर्मी हनोक की पुस्तक का प्रमाण देता है; अनुवाद उसके ऐतिहासिक दावे को बिना सांप्रदायिक निष्कर्ष जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘मेरे बच्चो’, ‘पालन करो’, ‘दोषी नहीं हूँ’ और ‘तितर-बितर किए जाओगे’ जैसे स्वाभाविक रूप रखे गए हैं। प्रलयकालीन पदावली में ‘युगों की पूर्णता’ और धार्मिक उपाधियों में ‘उद्धारकर्ता’ तथा ‘मसीह’ द्वारा मूल की गंभीरता बनाए रखी गई है। संदिग्ध मसीही पाठांश को वर्ग कोष्ठकों में तथा वास्तविक वाक्यगत अस्पष्टता को टिप्पणी में सुरक्षित रखा गया है।
