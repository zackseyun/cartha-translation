  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/001.yaml
  text: When I took a wife, I was twenty-eight years old, and her name was Melcha.
translation:
  language: hi
  text: जब मैंने विवाह किया, तब मैं अट्ठाईस वर्ष का था, और उसका नाम मेलखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: मैंने विवाह किया
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘मैंने स्त्री/पत्नी ली’ है; आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में इसका आशय ‘विवाह किया’ से स्पष्ट होता है।
- source_word: εἴκοσι καὶ ὀκτὼ ἐτῶν ὑπῆρχον
  choice: मैं अट्ठाईस वर्ष का था
  rationale: आयु बताने वाली यूनानी अभिव्यक्ति का सहज हिन्दी रूप।
- source_word: Μελχά
  choice: मेलखा
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण; अंतिम उच्चरित दीर्घ आ को सुरक्षित रखा गया है।
theological_decisions: []
