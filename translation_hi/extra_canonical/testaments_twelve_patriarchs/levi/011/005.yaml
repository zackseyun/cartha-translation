  text: And I saw in the vision that he stood in the midst of the congregation, in the heights.
translation:
  language: hi
  text: 'और मैंने दर्शन में देखा: वह ऊँचाइयों में सारी सभा के बीच खड़ा था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁράματι
  choice: दर्शन में
  rationale: यह यूनानी पद के दृश्यात्मक, प्रकाशन-संबंधी अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: μέσος ... πάσης τῆς συναγωγῆς
  choice: सारी सभा के बीच
  rationale: μέσος को ‘बीच’ और πάσης को ‘सारी’ के रूप में स्पष्ट रखा गया है; इससे मूल में उपस्थित संपूर्ण सभा का भाव सुरक्षित रहता है।
- source_word: ἐν ὑψηλοῖς
  choice: ऊँचाइयों में
  rationale: यह बहुवचन अभिव्यक्ति मूल के स्थान-संबंधी अर्थ को बनाए रखती है और उसे बिना आधार के केवल ‘स्वर्ग’ या ‘ऊँचे स्थानों’ तक सीमित नहीं करती।
- source_word: ἵστατο
  choice: खड़ा था
  rationale: अपूर्ण भूतकालीन रूप यहाँ दर्शन में दिखाई गई जारी अवस्था को व्यक्त करता है।
