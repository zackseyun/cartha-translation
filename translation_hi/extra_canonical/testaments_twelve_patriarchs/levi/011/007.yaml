  text: And a third son, Merari, was born to me in the fortieth year of my life; and because his mother had difficulty in childbirth, I called him Merari, which means bitterness.
translation:
  language: hi
  text: और मेरा तीसरा पुत्र, मरारी, मेरे जीवन के चालीसवें वर्ष में जन्मा। उसकी माता को प्रसव में कठिनाई हुई, इसलिए मैंने उसका नाम मरारी रखा, जिसका अर्थ है “कड़वाहट।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτεκέν μοι
  choice: मेरे लिए ... उत्पन्न हुआ
  rationale: यूनानी वाक्य में पुत्र-जन्म और μοι के संबंध को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ἐδυστόκησεν
  choice: प्रसव में कठिनाई हुई
  rationale: यह क्रिया कठिन प्रसव को सूचित करती है; यह प्रयोग आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πικριασμός
  choice: कड़वाहट
  rationale: नाम की दी गई यूनानी व्याख्या का सीधा अर्थ व्यक्त करता है।
