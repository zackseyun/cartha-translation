  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। नाम Μεραρεῖ को प्रचलित बाइबिलीय हिन्दी रूप “मरारी” में लिखा गया है; ὅ ἐστι को नामार्थ बताने वाले स्वाभाविक वाक्यांश “जिसका अर्थ है” से व्यक्त किया गया है।
