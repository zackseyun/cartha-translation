  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/002.yaml
  text: And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning.
translation:
  language: hi
  text: और वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया। मैंने उसका नाम गेरसाम रखा, क्योंकि हम परदेश की भूमि में रह रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συλλαβοῦσα
  choice: गर्भवती हुई
  rationale: यूनानी कृदंत का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: ἔτεκεν υἱόν
  choice: एक पुत्र को जन्म दिया
  rationale: मूल के अर्थ और कथात्मक क्रम को सीधे बनाए रखता है।
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ
  choice: मैंने उसका नाम … रखा
  rationale: नामकरण के इस सामी-प्रभावित यूनानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: Γηρσάμ
  choice: गेरसाम
  rationale: दिए गए यूनानी नाम-रूप Γηρσάμ का निकट देवनागरी लिप्यंतरण।
- source_word: ἐν γῇ παροικίας
  choice: परदेश की भूमि में
  rationale: παροικία यहाँ अपने स्थायी देश से बाहर अस्थायी/परदेशी निवास का बोध देता है; यह रूप उस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ἦμεν
  choice: हम … रह रहे थे
  rationale: अपूर्ण भूतकाल से व्यक्त जारी अवस्था को हिन्दी में स्वाभाविक ढंग से दर्शाता है।
