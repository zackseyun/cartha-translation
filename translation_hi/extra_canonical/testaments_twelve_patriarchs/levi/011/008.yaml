  text: Ἡ δὲ Ἰωχαβέδ³⁵ *ἐγεννήθη ἐν Αἰγύπτῳ τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει³⁶, *ἔνδοξος γὰρ ἦν τότε ἐν μέσῳ τῶν ἀδελφῶν μου³⁷.
