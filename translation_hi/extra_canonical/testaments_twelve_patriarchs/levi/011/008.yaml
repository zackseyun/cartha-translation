base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/008.yaml
  text: And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: hi
  text: और योकेबेद का जन्म मिस्र में मेरे जीवन के चौंसठवें वर्ष में हुआ; क्योंकि उस समय मैं अपने भाइयों के बीच प्रतिष्ठित था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωχαβέδ
  choice: योकेबेद
  rationale: बाइबलीय नाम Jochebed का प्रचलित आधुनिक हिन्दी रूप।
- source_word: τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει
  choice: मेरे जीवन के चौंसठवें वर्ष में
  rationale: लेवी की आयु के वर्ष को स्पष्ट करते हुए यूनानी क्रमवाचक अभिव्यक्ति का स्वाभाविक हिन्दी रूप।
- source_word: ἔνδοξος
  choice: बड़ा मान था
  rationale: यहाँ शब्द प्रसिद्धि, प्रतिष्ठा या सम्मान का बोध करा सकता है; संदर्भ में भाइयों के बीच प्रतिष्ठा को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἐν μέσῳ τῶν ἀδελφῶν μου
  choice: अपने भाइयों के बीच
  rationale: संबंध और समूह के भीतर प्रतिष्ठा—दोनों को सीधे बनाए रखता है।
theological_decisions:
- issue: ἔνδοξος का अर्थ
  choice: मेरा बड़ा मान था
  alternative: मैं प्रतिष्ठित था / मैं महिमावान था
  rationale: ‘महिमावान’ धार्मिक अर्थ का अनावश्यक भार ला सकता है; ‘बड़ा मान था’ मूल के सामाजिक सम्मान या प्रतिष्ठा के अर्थ को प्राकृतिक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी; वाक्य में मूल का कारणसूचक संबंध बनाए रखा गया है।
