source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διὰ τοῦτο ἐκάλεσα τὸ ὄνομα αὐτοῦ Καάθ²¹, [ὅ ἐστιν ἀρχὴ μεγαλείου καὶ συμβιβασμός]²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/006.yaml
  text: Therefore I called his name Kohath, [which is, the beginning of majesty and uniting].
translation:
  language: hi
  text: इसलिए मैंने उसका नाम कहात रखा, [जिसका अर्थ है—महिमा का आरम्भ और मेल][a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त यूनानी संस्करण में “जिसका अर्थ है—महिमा का आरम्भ और मेल” वाला अंश वर्ग कोष्ठकों में है, जो उसकी पाठगत स्थिति के बारे में संपादकीय अनिश्चितता दर्शाता है।
    reason: स्रोत में उपस्थित वर्ग कोष्ठकों के पाठालोचनात्मक संकेत को सामान्य पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले कथन से परिणामसूचक संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ Καάθ
  choice: मैंने उसका नाम कहात रखा
  rationale: यह यूनानी नामकरण-वाक्य का स्वाभाविक हिन्दी रूप है; ‘कहात’ इस बाइबलीय नाम का प्रचलित हिन्दी रूप है।
- source_word: ἀρχὴ μεγαλείου
  choice: महिमा का आरम्भ
  rationale: ἀρχή का मूल अर्थ ‘आरम्भ’ और μεγαλείου का अर्थ ‘महिमा/महानता’ है; यह चयन स्रोत की संक्षिप्त व्युत्पत्तिपरक भाषा बनाए रखता है।
- source_word: συμβιβασμός
  choice: मेल
  rationale: यह शब्द जोड़ने, एक करने या सामंजस्य स्थापित करने का भाव दे सकता है। ‘मेल’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा केवल ‘सभा’ का अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: συμβιβασμός के अर्थ की सीमा
  choice: मेल
  alternative: एकता; मिलाप; एकीकरण
  rationale: स्रोत में ‘सबका’ जैसा कोई विशेषण नहीं है, इसलिए ‘सबका एकीकरण’ नहीं जोड़ा गया। ‘मेल’ जोड़, एकता और सामंजस्य के बीच की अर्थगत खुलावट को अपेक्षाकृत सुरक्षित रखता है।
- issue: कोष्ठक में दिए गए वाक्यांश की पाठगत स्थिति
  choice: मुख्य पाठ में वर्ग कोष्ठक बनाए रखे गए
  alternative: कोष्ठक हटाकर वाक्यांश को निर्विवाद मुख्य पाठ मानना
  rationale: प्रदत्त यूनानी स्रोत स्वयं इस अंश को वर्ग कोष्ठकों में रखता है; अनिश्चितता को चुपचाप समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य रखा गया है। नाम का रूप ‘कहात’ लिया गया है। व्याख्यात्मक अंश के वर्ग कोष्ठक और उसकी अनिश्चितता सुरक्षित रखी गई है।
