id: T12P.LEV.14.3
reference: Testament of Levi 14:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς²³ γάρ ἐστιν ὁ †ἥλιος²⁴ καθαρὸς ἐνώπιον κυρίου †ἐπὶ τὴν γῆν²⁵, οὕτω καὶ ὑμεῖς ἐστε²⁸, οἱ φωστῆρες τοῦ Ἰσραήλ, παρὰ πάντα τὰ ἔθνη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/003.yaml
  text: For just as the sun is pure before the Lord upon the earth, so also you are, the lights of Israel, beyond all the nations.
translation:
  language: hi
  text: क्योंकि जैसे सूर्य धरती पर प्रभु के सामने शुद्ध है,[a] वैसे ही तुम भी—इस्राएल की ज्योतियाँ—सभी जातियों से बढ़कर हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “सूर्य” और “धरती पर” वाले शब्द पाठ-संदिग्ध चिह्नित हैं; यहाँ मुद्रित पाठ का अनुसरण किया गया है।
    reason: स्रोत-संस्करण में इन पदों पर आलोचनात्मक चिह्न हैं, इसलिए पाठगत अनिश्चितता पाठक के सामने रखना आवश्यक है।
lexical_decisions:
- source_word: καθαρός
  choice: शुद्ध
  rationale: यह नैतिक अथवा विधिक शुद्धता की संभावित व्यापकता बनाए रखता है और प्रसंग में सूर्य की निर्मलता को भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: φωστῆρες
  choice: ज्योति-पुंज
  rationale: बहुवचन संज्ञा के रूप में प्रकाश देने वाले खगोलीय पिंडों अथवा रूपकात्मक प्रकाश-स्रोतों का भाव बनाए रखता है; केवल ‘दीपक’ कहना सूर्य-संबंधी बिंब को सीमित कर देता।
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: सभी जातियों से बढ़कर
  rationale: παρά के तुलनात्मक भाव को व्यक्त करता है और ‘राष्ट्रों’ की अपेक्षा ‘जातियों’ द्वारा प्राचीन जनसमूहों का व्यापक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ‘वैसे ही तुम भी हो’ में निहित विधेय
  choice: ‘शुद्ध’ को दूसरी उपवाक्य में दोहराए बिना समानांतर रचना द्वारा निहित रखा गया
  alternative: ‘वैसे ही तुम भी सभी जातियों से बढ़कर शुद्ध हो’
  rationale: यूनानी में दूसरे उपवाक्य के साथ καθαρός दोहराया नहीं गया है। हिंदी रचना पहले उपवाक्य से उसका भाव ग्रहण करने देती है, पर अनावश्यक रूप से यह तय नहीं करती कि ‘सभी जातियों से बढ़कर’ विशेषतः शुद्धता को ही संशोधित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, सामान्य-पाठक-सुलभ शैली रखी गई है। डैश द्वारा ‘इस्राएल के ज्योति-पुंज’ को व्याख्यात्मक समानाधिकरण के रूप में स्पष्ट किया गया है।
