  terminology: “प्रभु,” “शुद्ध,” “इस्राएल,” and “जातियाँ” are appropriate. “इस्राएल की ज्योतियाँ” more directly and naturally represents φωστῆρες while retaining the metaphor without overinterpreting it.
  issues:
