    issue: “ज्योति-पुंज” is not the best equivalent for plural φωστῆρες.
    rationale: The Greek denotes lights or luminaries in the plural. “ज्योति-पुंज” can suggest a single aggregate or cluster, whereas “ज्योतियाँ” preserves the plural metaphor plainly.
