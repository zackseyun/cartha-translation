id: T12P.LEV.14.1
reference: Testament of Levi 14:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐγὼ¹ οὖν, τέκνα μου², ἔγνων³ ὅτι ἐπὶ τὰ τέλη τῶν αἰώνων ἀσεβήσετε⁴ *ἐπὶ Κυρίου, χεῖρας ἐπιβάλλοντες⁵ ἐν⁶ κακίᾳ [ἐπ᾿ αὐτὸν]⁷ καὶ ἐν⁸ πᾶσι τοῖς ἔθνεσιν γενήσεσθε⁹ χλευασμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/001.yaml
  text: Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands in wickedness [upon him], and among all the nations you will become a mockery.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, मैंने जान लिया है कि युगों के अंत में तुम प्रभु के विरुद्ध अधर्म करोगे, दुष्टता में [उस पर][a] हाथ डालते हुए, और सब जातियों के बीच उपहास बन जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उस पर’ शब्द कुछ यूनानी पाठ-साक्ष्यों में नहीं मिलते या पाठगत रूप से अनिश्चित हैं।
    reason: स्रोत-पाठ में [ἐπ᾿ αὐτόν] को कोष्ठकों में रखा गया है; हिन्दी पाठक को इस वास्तविक पाठगत अनिश्चितता की सूचना आवश्यक है।
lexical_decisions:
- source_word: ἔγνων
  choice: मैं जान गया हूँ
  rationale: ग्रीक के पूर्णतासूचक रूप में प्राप्त और वर्तमान तक स्थिर ज्ञान का भाव है; यह सामान्य वर्तमानकाल ‘मैं जानता हूँ’ से अधिक निकट है।
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: युगों के अंत में
  rationale: बहुवचन αἰώνων और τέλη को यथासंभव बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: प्रभु के विरुद्ध अधर्म करोगे
  rationale: ἀσεβέω का अर्थ भक्तिहीन या अधर्मी आचरण करना है, और ἐπί यहाँ विरोध की दिशा व्यक्त करता है।
- source_word: χεῖρας ἐπιβάλλοντες
  choice: हाथ डालोगे
  rationale: यह मुहावरा किसी को पकड़ने या उस पर हिंसक हाथ उठाने का संकेत दे सकता है; ‘हाथ डालना’ उस व्यापकता को बनाए रखता है।
- source_word: χλευασμός
  choice: उपहास
  rationale: संज्ञा का सीधा अर्थ मज़ाक या उपहास का विषय होना है; ‘उपहास बन जाओगे’ हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ‘उस पर’ की पाठगत स्थिति और संभावित मसीही संकेत
  choice: मुख्य पाठ में कोष्ठकों सहित ‘[उस पर]’ रखा और पाठांतर-टिप्पणी जोड़ी
  alternative: वाक्यांश हटाना, या बिना संकेत के निश्चित पाठ मानना
  rationale: ἐπ᾿ αὐτόν स्रोत में कोष्ठकित और पाठगत रूप से संदिग्ध है। इसे स्पष्ट या हटाकर संभावित संदर्भ को निश्चित करना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज धार्मिक गद्य। ‘मेरे बच्चो’ प्रत्यक्ष संबोधन है; ‘जातियों’ से ἔθνεσιν का पारंपरिक और व्यापक सामुदायिक अर्थ सुरक्षित रहता है।
