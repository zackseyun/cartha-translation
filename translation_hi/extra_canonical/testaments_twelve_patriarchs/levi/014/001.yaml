  verdict: revise
  source_fidelity: Greek ἔγνων is an aorist, and the draft’s ‘मैं जान गया हूँ’ can imply a momentary realization more strongly than the source requires. ‘मैंने जान लिया है’ preserves completed knowledge with present relevance in idiomatic Hindi. The disputed, bracketed ἐπ᾿ αὐτόν is appropriately retained as bracketed material with a note.
  naturalness: The verse is generally clear and suitably elevated. Changing ‘मैं जान गया हूँ’ to ‘मैंने जान लिया है’ is more natural in this prophetic disclosure. ‘हाथ डालते हुए’ makes the participial relation of ἐπιβάλλοντες explicit without over-specifying the precise nature of the action.
  terminology: ‘प्रभु,’ ‘अधर्म,’ ‘जातियों,’ and ‘उपहास’ are appropriate. ‘प्रभु के विरुद्ध अधर्म करोगे’ adequately renders ἀσεβήσετε ἐπὶ Κυρίου while avoiding doctrinal expansion.
  issues:
  - severity: low
    issue: Aspectual nuance of ἔγνων
    rationale: ‘मैं जान गया हूँ’ is possible, but can sound like a newly arrived-at realization. ‘मैंने जान लिया है’ better conveys completed knowledge in this context.
  - severity: low
    issue: Participial linkage of χεῖρας ἐπιβάλλοντες
    rationale: The Greek participle is most transparently reflected by ‘हाथ डालते हुए,’ dependent on the future verb ‘करोगे.’
