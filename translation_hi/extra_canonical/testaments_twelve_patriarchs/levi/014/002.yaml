source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ γὰρ ὁ πατὴρ ἡμῶν Ἰσραὴλ καθαρός ἐστιν¹⁸ ἀπὸ τῆς¹⁹ ἀσεβείας²⁰ τῶν ἀρχιερέων [οἵτινες ἐπιβαλοῦσι²¹ τὰς χεῖρας αὐτῶν ἐπὶ τὸν σωτῆρα τοῦ κόσμου]²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/002.yaml
  text: For our father Israel is pure from the ungodliness of the chief priests [who will lay their hands on the Savior of the world].
translation:
  language: hi
  text: क्योंकि हमारे पिता इस्राएल महायाजकों की अधार्मिकता से शुद्ध हैं [जो संसार के उद्धारकर्ता पर हाथ डालेंगे]।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πατὴρ ἡμῶν Ἰσραήλ
  choice: हमारा पूर्वज इस्राएल
  rationale: शाब्दिक ‘हमारा पिता’ सम्भव है, पर वंशपुरुष के अर्थ को आधुनिक हिन्दी में स्वाभाविक और स्पष्ट बनाने के लिए ‘पूर्वज’ चुना गया।
- source_word: καθαρός ἐστιν ἀπό
  choice: से निर्दोष है
  rationale: यहाँ καθαρός किसी अन्य के पाप या अधार्मिकता से मुक्त होने का भाव देता है; ‘निर्दोष’ हिन्दी में इस नैतिक असंबद्धता को सहज रूप से व्यक्त करता है।
- source_word: ἀσεβείας
  choice: अधार्मिकता
  rationale: यह शब्द ईश्वर-विरोधी या धर्महीन आचरण का संकेत देता है; ‘अधार्मिकता’ उसके धार्मिक और नैतिक दोनों आयाम बनाए रखता है।
- source_word: ἀρχιερέων
  choice: महायाजकों
  rationale: यह ἀρχιερεύς का प्रचलित और प्रसंगानुकूल हिन्दी धार्मिक पदनाम है; बहुवचन को सुरक्षित रखा गया है।
- source_word: ἐπιβαλοῦσι τὰς χεῖρας αὐτῶν ἐπί
  choice: पर हाथ डालेंगे
  rationale: ग्रीक मुहावरा विरोधपूर्वक पकड़ने या अधिकार में लेने का संकेत देता है। हिन्दी का ‘हाथ डालना’ इस आशय को अनावश्यक रूप से अधिक विशिष्ट किए बिना बनाए रखता है।
- source_word: τὸν σωτῆρα τοῦ κόσμου
  choice: संसार के उद्धारकर्ता
  rationale: ‘उद्धारकर्ता’ σωτήρ का प्रतिष्ठित और अर्थपूर्ण हिन्दी समतुल्य है, जबकि ‘संसार’ κόσμος की व्यापकता को व्यक्त करता है।
theological_decisions:
- issue: इस्राएल को महायाजकों की अधार्मिकता से शुद्ध बताने का अर्थ
  choice: ‘निर्दोष है’ द्वारा सहभागिता या दोष से मुक्त होने का भाव रखा गया
  alternative: ‘शुद्ध है’
  rationale: ‘शुद्ध’ अधिक शाब्दिक है, पर हिन्दी में अनुष्ठानिक शुद्धता का अनचाहा अर्थ ला सकता है। प्रसंग में नैतिक दोष से अलगाव अधिक सम्भावित है।
- issue: ‘उद्धारकर्ता’ की पहचान
  choice: पाठ की उपाधि को बिना अतिरिक्त पहचान या व्याख्या के रखा गया
  alternative: इसे स्पष्ट रूप से किसी नामित व्यक्ति से जोड़ना
  rationale: ग्रीक केवल ‘संसार का उद्धारकर्ता’ कहता है; अनुवाद को इससे आगे की धर्मवैचारिक पहचान आरोपित नहीं करनी चाहिए।
- issue: कोष्ठकित खंड की पाठालोचनात्मक स्थिति
  choice: वाक्यांश को वर्ग कोष्ठकों में यथावत रखा गया
  alternative: कोष्ठक हटाकर इसे निर्विवाद मुख्य पाठ बनाना या इसे छोड़ देना
  rationale: दिए गए यूनानी स्रोत में यह खंड वर्ग कोष्ठकों में चिह्नित है; वही अनिश्चितता प्रकाशन-पाठ में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। यूनानी स्रोत के वर्ग कोष्ठक सुरक्षित रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
