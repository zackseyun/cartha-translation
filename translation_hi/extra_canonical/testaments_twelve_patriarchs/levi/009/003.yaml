base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/003.yaml
  text: And when we came to Bethel, my father Jacob saw a vision about me, that I would be a priest to them.
translation:
  language: hi
  text: और जब हम बेतेल पहुँचे, तो मेरे पिता याकूब ने मेरे विषय में एक दर्शन देखा कि मैं उनके लिए याजक बनूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλθομεν εἰς Βεθήλ
  choice: हम बेतेल पहुँचे
  rationale: लक्ष्य तक आने के अर्थ को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है; ‘बेतेल’ प्रचलित स्थान-नाम है।
- source_word: ὅραμα
  choice: दर्शन
  rationale: स्वप्न या सामान्य दृश्य की अपेक्षा प्रकाशनात्मक vision के अर्थ को सुरक्षित रखता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: यूनानी पदबंध का निकट और गरिमापूर्ण हिन्दी रूप है।
- source_word: εἰς ἱερέα
  choice: याजक बनूँगा
  rationale: भूमिका अथवा पद में होने की भावी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: प्राप्तकर्ता/समुदाय के प्रति याजकीय सेवा का संबंध व्यक्त करता है, जबकि सर्वनाम के पूर्वसंदर्भ को मूल की तरह अनिर्दिष्ट रहने देता है।
theological_decisions:
- issue: याजकीय भूमिका का स्वरूप
  choice: याजक बनूँगा
  alternative: पुरोहित बनूँगा
  rationale: ‘याजक’ बाइबलीय हिन्दी में ἱερεύς का व्यापक और परिचित समतुल्य है तथा किसी विशेष संप्रदाय की पदावली नहीं थोपता।
- issue: αὐτοῖς में उल्लिखित समूह
  choice: उनके लिए
  alternative: उनका याजक
  rationale: मूल पाठ सर्वनाम के समूह को इस वाक्य में स्पष्ट नहीं करता; इसलिए अनावश्यक पहचान जोड़े बिना उसकी अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य-संरचना मूल के घटनाक्रम को बनाए रखती है।
