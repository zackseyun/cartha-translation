translation:
  language: hi
  text: और इसहाक मुझे लगातार बुलाते रहे, ताकि वे मुझे प्रभु की व्यवस्था की याद दिलाएँ, ठीक वैसे ही जैसे स्वर्गदूत ने मुझे वह दिखाई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλει
  choice: बुलाते रहे
  rationale: अपूर्णकाल और συνεχῶς मिलकर बार-बार अथवा निरंतर बुलाने का भाव देते हैं; हिन्दी में आदरसूचक बहुवचन इसहाक के लिए स्वाभाविक है।
- source_word: νόμον Κυρίου
  choice: प्रभु की व्यवस्था
  rationale: यह νόμος के धार्मिक और निर्देशात्मक अर्थ को स्वाभाविक बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: ἔδειξέ μοι
  choice: मुझे दिखाई थी
  rationale: क्रिया के प्रत्यक्ष अर्थ ‘दिखाना’ को बनाए रखता है और उसका निहित कर्म ‘व्यवस्था’ हिन्दी में स्पष्ट रूप से जुड़ता है।
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: ἄγγελος के इस अलौकिक संदर्भ का मानक और सहज हिन्दी रूप।
theological_decisions:
- issue: व्यवस्था को याद दिलाने और दिखाने वाले कर्ताओं का संबंध
  choice: इसहाक याद दिलाते हैं; स्वर्गदूत ने व्यवस्था दिखाई थी
  alternative: स्वर्गदूत ने इसहाक को दिखाया था, या इसहाक ने व्यवस्था दिखाई थी
  rationale: मूल वाक्य में με दोनों क्रियाओं के साथ लेवी को सूचित करता है, और καθὼς उपवाक्य में ὁ ἄγγελος स्पष्ट कर्ता है; अनूदित वाक्य इसी व्याकरणिक संबंध को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘ठीक वैसे ही जैसे’ καθὼς की तुलना को स्पष्ट रखता है; कोई संप्रदायगत व्याख्या नहीं जोड़ी गई।
