source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *παντὸς πρωτογεννήματός σου⁶⁰ καὶ οἴνου⁶¹ πρόσφερε *ἀπαρχὰς εἰς θυσίαν Κυρίῳ⁶² Γτῷ θεῷ⁶³⁾. *Καὶ πᾶσαν θυσίαν ἅλατι ἁλιεῖς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/014.yaml
  text: And of all your first produce and of wine offer firstfruits as a sacrifice to the Lord God. And every sacrifice you shall salt with salt.
translation:
  language: hi
  text: और अपनी सारी पहली उपज और दाखमधु में से प्रथमांश प्रभु परमेश्वर को बलि के रूप में चढ़ाना। और हर बलि पर नमक लगाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς πρωτογεννήματός σου
  choice: अपनी हर पहली उपज में से
  rationale: πρωτογέννημα यहाँ कृषि-संदर्भ में उपज का आरम्भिक/पहला भाग है; ‘पहली उपज’ आधुनिक हिन्दी में स्वाभाविक है और ‘पहिलौठा’ के पशु-संबंधी अर्थ से बचाती है।
- source_word: οἴνου
  choice: दाखमधु
  rationale: यह यूनानी ‘wine’ को स्पष्ट रूप से व्यक्त करता है और धार्मिक-ऐतिहासिक शैली के अनुकूल है।
- source_word: ἀπαρχὰς
  choice: प्रथम फल
  rationale: यह अर्पण के लिए अलग किए गए आरम्भिक हिस्से के धार्मिक अर्थ को बनाए रखता है।
- source_word: πρόσφερε ... εἰς θυσίαν
  choice: बलि के रूप में चढ़ाना
  rationale: आज्ञात्मक संदर्भ में πρόσφερε के चढ़ाने और θυσία के बलि-अर्थ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: Κυρίῳ τῷ θεῷ
  choice: प्रभु परमेश्वर के लिए
  rationale: संयुक्त ईश्वरीय उपाधि को किसी अतिरिक्त सम्प्रदायगत व्याख्या के बिना सुरक्षित रखता है।
- source_word: πᾶσαν θυσίαν ἅλατι ἁλιεῖς
  choice: हर बलि पर नमक लगाना
  rationale: यूनानी की शब्द-पुनरावृत्ति (‘नमक से नमकीन करना’) हिन्दी में अस्वाभाविक होती; यह अनुष्ठानिक क्रिया को संक्षेप और स्पष्ट रूप से देता है।
theological_decisions:
- issue: प्रथम उपज और प्रथम फल के बीच संभावित अर्थ-सन्निकटता
  choice: 'दोनों पदों को अलग रखा: ‘पहली उपज’ और ‘प्रथम फल’'
  alternative: ‘पहिलौठी उपज में से पहिला अंश’
  rationale: मूल में πρωτογέννημα और ἀπαρχή अलग शब्द हैं; हिन्दी में दोनों को एक ही पद से व्यक्त करने पर यह भेद मिट जाता।
- issue: नमक का प्रयोग
  choice: ‘हर बलि पर नमक लगाना’
  alternative: ‘हर बलि को नमक से नमकीन करना’
  rationale: मूल की ठोस अनुष्ठानिक आज्ञा को रखा गया है, पर उससे कोई प्रतीकात्मक या वाचा-संबंधी अर्थ स्वतः नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पितृ-संबंधी निर्देशात्मक शैली रखी गई है। संदर्भ में पूर्ववर्ती आज्ञाओं की निरंतरता मानकर क्रियाओं के लिए ‘चढ़ाना/लगाना’ रूप प्रयुक्त हुए हैं।
