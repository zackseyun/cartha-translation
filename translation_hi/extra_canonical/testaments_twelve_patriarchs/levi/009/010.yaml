source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Λαβὲ οὖν σεαυτῷ⁴² *γυναῖκα, ἔτι⁴³ νέος ὤν, *μὴ ἔχουσαν μῶμον μήτε βεβηλωμένην, μήτε ἀπὸ γένους⁴⁴ ἀλλοφύλων⁴⁵ ἐθνῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/010.yaml
  text: Therefore take for yourself a wife while you are still young, one who has no blemish or defilement, and not from the stock of foreign nations.
translation:
  language: hi
  text: इसलिए जब तू अभी जवान ही है, तब अपने लिए ऐसी पत्नी ले जिसमें कोई दोष न हो, जो अपवित्र भी न की गई हो और जो विदेशी जातियों के वंश से न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λαβὲ ... σεαυτῷ γυναῖκα
  choice: अपने लिए ... पत्नी ले
  rationale: यूनानी आज्ञार्थक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप; विवाह करने का आशय प्रसंग में स्पष्ट रहता है।
- source_word: ἔτι νέος ὤν
  choice: जब तू अभी जवान ही है
  rationale: समय-सूचक कृदन्तीय वाक्यांश और ἔτι के ‘अभी’ भाव को सुरक्षित रखता है।
- source_word: μὴ ἔχουσαν μῶμον
  choice: जिसमें कोई दोष न हो
  rationale: μῶμος के व्यापक अर्थ ‘दोष/कलंक’ को बनाए रखता है और उसे केवल शारीरिक दोष तक सीमित नहीं करता।
- source_word: μήτε βεβηλωμένην
  choice: जो अपवित्र न की गई हो
  rationale: पूर्ण निष्क्रिय कृदन्त के परिणामकारी और निष्क्रिय भाव को व्यक्त करता है; अपवित्रता का स्वरूप अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: μήτε ἀπὸ γένους ἀλλοφύλων ἐθνῶν
  choice: जो पराई जातियों के वंश की न हो
  rationale: γένος को ‘वंश’, ἀλλόφυλος को ‘पराई’, और ἔθνη को ‘जातियाँ’ देकर मूल की वंशगत तथा जातीय भाषा सुरक्षित रखी गई है।
theological_decisions:
- issue: पत्नी के लिए μῶμος और βεβηλωμένη के वर्णन का संबंध
  choice: ‘जिसमें कोई दोष न हो, जो अपवित्र न की गई हो’—दोनों को अलग विशेषताओं के रूप में रखा गया
  alternative: दोनों को मिलाकर ‘निर्दोष और शुद्ध’ कहना
  rationale: मूल में दो पृथक पद हैं; उन्हें अलग रखने से अर्थगत तनाव बना रहता है और ‘अपवित्र’ को केवल नैतिक, लैंगिक या अनुष्ठानिक अर्थ में सीमित नहीं किया जाता।
- issue: ἀλλοφύλων ἐθνῶν का सामाजिक-धार्मिक आशय
  choice: ‘पराई जातियों’
  alternative: ‘गैर-इस्राएली राष्ट्रों’ या ‘अन्यजातियों’
  rationale: मूल किसी विशिष्ट व्याख्यात्मक पहचान को स्पष्ट नहीं करता; ‘पराई जातियाँ’ उसकी बाहरी-समुदाय संबंधी भाषा को बिना सांप्रदायिक विस्तार के व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्राचीन पितृ-संबोधन के एकवचन को बनाए रखने के लिए ‘तू’ प्रयोग किया गया है; वाक्य में मूल की निषेधात्मक समानांतर संरचना यथासंभव सुरक्षित है।
