base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/012.yaml
  text: From twelve trees having leaves, then offer to the Lord, as Abraham taught me.
translation:
  language: hi
  text: तब पत्तों वाले बारह वृक्षों में से प्रभु को चढ़ा, जिस प्रकार अब्राहम ने मुझे भी सिखाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δώδεκα ... δένδρων ἐχόντων φύλλα
  choice: पत्तों वाले बारह वृक्षों
  rationale: यूनानी संबंधवाचक रचना का अर्थ सीधे और स्वाभाविक हिंदी में रखा गया है; वृक्षों के पत्तेदार होने की विशेषता सुरक्षित है।
- source_word: ἀνάγαγε
  choice: लेकर ... अर्पित करना
  rationale: यह आज्ञार्थक क्रिया शाब्दिक रूप से ‘ऊपर ले जा’ हो सकती है, पर प्रभु की ओर भेंट ले जाने के संदर्भ में ‘अर्पित करना’ स्वाभाविक है। ‘लेकर’ से ἐκ-संबंधी ‘में से’ रचना और चढ़ाने की गति दोनों स्पष्ट होती हैं।
- source_word: οὖν
  choice: इसलिए
  rationale: निष्कर्ष अथवा क्रमसूचक संयोजक का सामान्य अर्थ सुरक्षित रखा गया है।
- source_word: τῷ Κυρίῳ
  choice: प्रभु को
  rationale: दत्तिव को अर्पण के प्राप्तकर्ता के रूप में व्यक्त किया गया है।
- source_word: ὡς κἀμὲ Ἀβραὰμ ἐδίδαξε
  choice: जैसा अब्राहम ने मुझे सिखाया
  rationale: κἀμέ को ‘मुझे भी’ पढ़ना संभव है, पर उपलब्ध वाक्य-संदर्भ में बल अनिश्चित है; मुख्य पाठ में सहज हिंदी रखी गई है और अस्पष्टता पर टिप्पणी नहीं जोड़ी गई क्योंकि पाठ अत्यंत संक्षिप्त है।
theological_decisions:
- issue: प्रभु को दिए जाने वाले कर्म का स्वरूप
  choice: अर्पित करना
  alternative: ऊपर ले जाना
  rationale: ἀνάγω का मूल गतिसूचक अर्थ संभव है, किंतु धार्मिक संदर्भ में प्रभु के लिए वस्तु ले जाना अर्पण को सूचित करता है। अनुष्ठान का अधिक विशिष्ट प्रकार पाठ में नहीं जोड़ा गया।
- issue: κἀμέ में ‘भी’ का बल
  choice: मुझे
  alternative: मुझे भी
  rationale: κἀμέ सामान्यतः καὶ ἐμέ का संक्षेप है और ‘मुझे भी’ संभव है; फिर भी यहाँ हिंदी में ‘जैसा ... ने मुझे सिखाया’ तुलना को पर्याप्त रूप से व्यक्त करता है और अस्पष्ट ‘भी’ के लिए कृत्रिम पूर्वसंदर्भ नहीं बनाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। यूनानी वाक्य में प्रत्यक्ष आज्ञार्थक ἀνάγαγε है, लेकिन उद्धृत पाठ का आरंभ तारक-चिह्न और कुछ पाठ-सुधार संकेतों के साथ है; इसलिए हिंदी में निर्देशात्मक अनंत रूप ‘अर्पित करना’ अपनाया गया है, जो संभावित सूची या विधि-संदर्भ में स्वाभाविक बैठता है।
