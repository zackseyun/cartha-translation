source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ πρὸ⁴⁶ τοῦ εἰσελθεῖν σε⁴⁷ εἰς τὰ ἅγια, λούου· καὶ ἐν τῷ θύειν σε⁴⁸, νίπτου⁴⁹· καὶ ἀπαρτίζων πάλιν⁵⁰ τὴν θυσίαν, νίπτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/011.yaml
  text: And before you enter into the holy things, wash; and when you sacrifice, wash; and again, when you finish the sacrifice, wash.
translation:
  language: hi
  text: और पवित्र स्थान में प्रवेश करने से पहले स्नान करो; और बलि चढ़ाते समय धोओ; और बलि पूरी करने पर फिर धोओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ ἅγια
  choice: पवित्र स्थान में
  rationale: बहुवचन नपुंसकलिंग τὰ ἅγια मंदिर के पवित्र क्षेत्र या पवित्रस्थान को सूचित कर सकता है। प्रसंग में प्रवेश की क्रिया के कारण स्थानवाचक अनुवाद स्वाभाविक है।
- source_word: λούου
  choice: स्नान करना
  rationale: λούω सामान्यतः पूरे शरीर को धोने या स्नान करने के लिए प्रयुक्त होता है; इसलिए इसे बाद के νίπτου से अलग रखा गया है।
- source_word: νίπτου
  choice: अपने आप को धोना
  rationale: मध्यवाच्य आज्ञा शरीर के किसी अंग को धोने का संकेत दे सकती है, पर स्रोत अंग निर्दिष्ट नहीं करता; अतः ‘हाथ’ जोड़ने के बजाय व्यापक अभिव्यक्ति रखी गई है।
- source_word: ἀπαρτίζων
  choice: पूरी करने के बाद
  rationale: क्रिया का अर्थ बलि को पूरा या समाप्त करना है। हिन्दी में क्रम स्पष्ट और स्वाभाविक बनाने के लिए ‘के बाद’ प्रयुक्त हुआ है।
- source_word: θυσίαν
  choice: बलि
  rationale: याजकीय संदर्भ में θυσία का सीधा और प्रचलित हिन्दी समतुल्य ‘बलि’ है।
theological_decisions:
- issue: τὰ ἅγια का अर्थ
  choice: पवित्र स्थान
  alternative: पवित्र वस्तुएँ
  rationale: εἰσελθεῖν εἰς (‘में प्रवेश करना’) स्थानवाचक अर्थ का समर्थन करता है, यद्यपि यूनानी पद अपने आप में ‘पवित्र वस्तुएँ/बातें’ भी कह सकता है।
- issue: धोने की विधि या अंग
  choice: अपने आप को धोना
  alternative: हाथ धोना
  rationale: यूनानी पाठ में हाथों का स्पष्ट उल्लेख नहीं है, इसलिए अनुष्ठान के बारे में अतिरिक्त विवरण नहीं जोड़ा गया।
- issue: प्रभु की उपस्थिति का उल्लेख
  choice: कोई अतिरिक्त वाक्यांश नहीं
  alternative: प्रभु के सामने
  rationale: प्रस्तुत यूनानी स्रोत में ἐνώπιον या किसी दिव्य नाम का वाक्यांश नहीं है; अतः नवीनतम संशोधन टिप्पणी की असंगत सामग्री को पाठ में नहीं लिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण याजकीय निर्देश। तीनों आदेशों की पुनरावृत्ति और क्रम बनाए गए हैं; λούου तथा νίπτου का भेद क्रमशः ‘स्नान करना’ और ‘अपने आप को धोना’ से व्यक्त किया गया है।
