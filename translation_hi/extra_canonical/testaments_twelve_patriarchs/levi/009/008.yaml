  text: 'And every day he was instructing me, and being occupied with me, he said to me:'
translation:
  language: hi
  text: 'और वह हर दिन मुझे शिक्षा देता था और मुझ पर ध्यान देते हुए मुझसे कहता था:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετίζων με
  choice: मुझे शिक्षा देता था
  rationale: συνετίζω का अर्थ समझ या विवेक देना, समझाना अथवा शिक्षा देना है। यहाँ निरंतर शिक्षण के संदर्भ में सहज हिन्दी ‘शिक्षा देता था’ उपयुक्त है।
- source_word: ἀσχολούμενος εἰς ἐμὲ
  choice: मुझ पर ध्यान देते हुए
  rationale: यह असामान्य यूनानी वाक्यांश वक्ता के प्रति व्यस्त या समर्पित ध्यान को दर्शाता है। ‘मुझ पर ध्यान देते हुए’ अर्थ को स्वाभाविक हिन्दी में रखता है और अनावश्यक रूप से ‘देखभाल’ जैसा अतिरिक्त भाव नहीं जोड़ता।
- source_word: ἔλεγέ μοι
  choice: मुझसे कहता था
  rationale: अपूर्ण भूतकाल की पुनरावृत्त या जारी क्रिया को ‘कहता था’ से व्यक्त किया गया है; आगामी प्रत्यक्ष कथन के लिए विसर्ग रखा गया है।
