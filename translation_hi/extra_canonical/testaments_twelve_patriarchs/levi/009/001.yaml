- from: और दो दिन बाद, मैं और यहूदा अपने पिता याकूब के साथ अपने पुरखे इसहाक के पास गए।
  to: और दो दिन बाद, मैं और यहूदा अपने पिता याकूब के साथ हमारे पूर्वज इसहाक के पास ऊपर गए।
  rationale: The revision restores the upward-motion element of ἀνέβην and replaces the slightly awkward collective ‘पुरखे’ with the natural singular relational term ‘पूर्वज’. It retains the first-person narration, the order of Levi and Judah, and the shared relationship to Jacob and Isaac.
