  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/001.yaml
  text: And after two days, I and Judah went up with our father Jacob to Isaac our grandfather.
translation:
  language: hi
  text: और दो दिन बाद, मैं और यहूदा अपने पिता याकूब के साथ हमारे पूर्वज इसहाक के पास ऊपर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας δύο
  choice: दो दिन बाद
  rationale: यूनानी कालवाचक पद का स्वाभाविक और सटीक आधुनिक हिन्दी रूप।
- source_word: ἀνέβην
  choice: गए
  rationale: शाब्दिक अर्थ ‘ऊपर गया/चढ़ गया’ है, पर यहाँ किसी व्यक्ति के पास यात्रा करने के संदर्भ में हिन्दी में ‘गए’ अधिक स्वाभाविक है; बहुवचन क्रिया वक्ता और यहूदा दोनों को समेटती है।
- source_word: μετὰ τοῦ πατρὸς ἡμῶν Ἰακὼβ
  choice: अपने पिता याकूब के साथ
  rationale: ‘हमारे पिता’ को हिन्दी कथन में ‘अपने पिता’ कहना अधिक सहज है और संबंध को यथावत रखता है।
- source_word: πρὸς Ἰσαὰκ τὸν προπάτορα ἡμῶν
  choice: अपने पुरखे इसहाक के पास
  rationale: προπάτωρ का अर्थ पूर्वज/पुरखा है; ‘पुरखे’ सरल, गरिमापूर्ण और संबंधसूचक है। ‘के पास’ πρὸς की गंतव्य-सूचक भूमिका व्यक्त करता है।
