review_pass:
  verdict: revise
  source_fidelity: Greek ἀνέβην explicitly includes upward movement; the draft's ‘गए’ leaves this unexpressed. The relational term προπάτορα is broader than a strictly technical ‘grandfather’ and is best represented as ‘पूर्वज’, while the context still permits Isaac to be understood as their grandfather.
  naturalness: ‘हमारे पूर्वज इसहाक’ is more idiomatic and grammatically unambiguous in modern standard Hindi than ‘अपने पुरखे इसहाक’. ‘ऊपर गए’ retains the source's directional nuance without making the sentence unnatural.
  terminology: ‘पूर्वज’ appropriately renders προπάτωρ without imposing a narrower genealogical classification. Personal names remain in conventional Hindi biblical forms.
  issues:
  - severity: medium
    issue: The directional force of ἀνέβην is omitted.
    rationale: Although the English audit trail smooths this to ‘went,’ the Greek verb means ‘went up/ascended’; a Hindi optimal-equivalence rendering can preserve that detail naturally.
  - severity: low
    issue: ‘अपने पुरखे इसहाक’ is less clear and less idiomatic than a singular relational expression.
    rationale: पुरखे commonly has a plural or collective sense, whereas the Greek identifies one person as ‘our forefather.’ ‘हमारे पूर्वज इसहाक’ is clear and retains the source term’s breadth.
  revised_text: और दो दिन बाद, मैं और यहूदा अपने पिता याकूब के साथ हमारे पूर्वज इसहाक के पास ऊपर गए।
