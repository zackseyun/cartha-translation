  text: And from every clean animal and bird offer a sacrifice to the Lord.
translation:
  language: hi
  text: और हर शुद्ध पशु और पक्षी में से प्रभु के लिए बलि चढ़ाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς ζώου καθαροῦ
  choice: हर शुद्ध पशु
  rationale: ‘शुद्ध’ धार्मिक रीति से बलि के योग्य पशुओं की श्रेणी को व्यक्त करता है; παντός का स्वाभाविक हिन्दी रूप ‘हर’ है।
- source_word: πετεινοῦ
  choice: पक्षी
  rationale: यह उड़ने वाले जीव, विशेषतः बलि योग्य पक्षियों, के लिए सामान्य शब्द है; प्रसंग में ‘पक्षी’ सहज और पर्याप्त है।
- source_word: πρόσφερε θυσίαν
  choice: बलि चढ़ाना
  rationale: ग्रीक में आज्ञार्थक क्रिया है, पर निकटवर्ती निर्देश-श्रृंखला के अनुरूप हिन्दी में क्रियार्थक निर्देश ‘चढ़ाना’ संक्षिप्त और स्वाभाविक है।
- source_word: τῷ Κυρίῳ
  choice: प्रभु को
  rationale: किसके लिए बलि अर्पित की जाए, यह सम्प्रदान कारक द्वारा व्यक्त है; ‘प्रभु को’ इसका सीधा हिन्दी रूप है।
theological_decisions:
- issue: ‘शुद्ध’ की धार्मिक-विधिक धारणा
  choice: शुद्ध
  alternative: पवित्र
  rationale: καθαρός विधिक शुद्धता का द्योतक है, जबकि ‘पवित्र’ अर्थ को अलग धार्मिक श्रेणी की ओर ले जा सकता है।
- issue: आज्ञार्थक रूप का हिन्दी निरूपण
  choice: बलि चढ़ाना
  alternative: बलि चढ़ाओ
  rationale: मूल में स्पष्ट आज्ञा है और ‘चढ़ाओ’ अधिक प्रत्यक्ष है; फिर भी इस पद के निर्देशात्मक सूची-सदृश रूप में ‘चढ़ाना’ स्वाभाविक है और आदेश का बल संदर्भ में बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; धार्मिक-विधिक शब्दावली को सरल और गरिमापूर्ण रखा गया है।
