base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/007.yaml
  text: And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of freewill offerings, and of peace offerings.
translation:
  language: hi
  text: और उसने मुझे याजकपद, बलियों, संपूर्ण होमबलियों, स्वेच्छा की बलियों और मेलबलियों की व्यवस्था सिखाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερωσύνης
  choice: याजकपद
  rationale: यह शब्द पुरोहित के पद और सेवा-व्यवस्था को सूचित करता है; आधुनिक बाइबिलीय हिन्दी में ‘याजकपद’ संक्षिप्त और स्वाभाविक है।
- source_word: ὁλοκαυτωμάτων
  choice: पूर्ण होमबलियों
  rationale: यूनानी शब्द पूरी तरह जलाई जाने वाली बलियों को दर्शाता है; ‘पूर्ण’ जोड़ने से साधारण होमबलि की अपेक्षा उसका विशिष्ट अर्थ स्पष्ट रहता है।
- source_word: ἑκουσίου
  choice: स्वेच्छा-बलियों
  rationale: यह स्वेच्छा से चढ़ाई गई भेंट या बलि को दर्शाता है; सन्दर्भानुसार ‘बलि’ को स्पष्ट किया गया है।
- source_word: σωτηρίου
  choice: मेलबलियों
  rationale: बलिदानी शब्दावली में σωτήριον प्रायः शान्ति/कल्याण की बलि के लिए आता है; ‘मेलबलि’ प्रचलित और सामान्य पाठक के लिए सुबोध बाइबिलीय पद है।
theological_decisions:
- issue: बलिदानों की सूची में ἀπαρχῶν की स्थिति
  choice: अलग ‘पहली उपज’ मद नहीं जोड़ी गई
  alternative: ‘पहली उपजों’ या ‘पहले फलों की भेंटों’ को अलग मद के रूप में रखना
  rationale: प्रदत्त स्रोत-सुधार और लेखापरीक्षित परामर्श-पाठ इसे स्वतंत्र, प्रमाणित सूची-मद नहीं मानते। इसलिए अनिश्चित पाठ को जोड़कर सूची बढ़ाने से बचा गया, जबकि शेष बलिदानी श्रेणियाँ सुरक्षित रखी गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबिलीय शैली अपनाई गई है। सूची की समानान्तर संरचना बनाए रखी गई है और अनावश्यक व्याख्यात्मक विस्तार नहीं किया गया।
