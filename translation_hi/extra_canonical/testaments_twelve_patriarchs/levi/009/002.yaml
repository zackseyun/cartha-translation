source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εὐλόγησέν με *⁵ὁ πατὴρ τοῦ πατρός μου⁵ κατὰ⁶ *τῶν ὁραμάτων ὧν⁷ εἶδον· *καὶ οὐκ ἠθέλησε πορευθῆναι μεθ’ ἡμῶν εἰς Βεθήλ⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/002.yaml
  text: And my grandfather blessed me because of the visions that I had seen, and he was not willing to go with us to Bethel.
translation:
  language: hi
  text: और मेरे दादा ने उन दर्शनों के कारण मुझे आशीर्वाद दिया जो मैंने देखे थे; और वे हमारे साथ बेतेल जाने को इच्छुक नहीं थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πατὴρ τοῦ πατρός μου
  choice: मेरे दादा
  rationale: शाब्दिक अर्थ ‘मेरे पिता के पिता’ है; आधुनिक हिन्दी में ‘मेरे दादा’ इसका स्वाभाविक और सटीक रूप है।
- source_word: κατὰ τῶν ὁραμάτων ὧν εἶδον
  choice: उन दर्शनों के कारण ... जो मैंने देखे थे
  rationale: यहाँ κατὰ को दर्शनों के आधार या कारण की ओर संकेत करने वाला माना गया है; ‘के कारण’ प्रसंग का सहज हिन्दी रूप है, जबकि संबंधवाचक संरचना को सुरक्षित रखा गया है।
- source_word: οὐκ ἠθέλησε
  choice: तैयार नहीं हुए
  rationale: यह इच्छा या तत्परता न होने को स्वाभाविक हिन्दी में व्यक्त करता है; इसे असमर्थता या निषेध नहीं बनाया गया।
- source_word: Βεθήλ
  choice: बेतेल
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: दर्शनों और आशीर्वाद के बीच संबंध
  choice: दर्शनों के कारण
  alternative: दर्शनों के अनुसार
  rationale: κατά का रूप यहाँ पाठगत रूप से कुछ असामान्य है, पर प्रसंग में दर्शनों को आशीर्वाद का कारण या आधार समझना अधिक स्वाभाविक है। किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘दादा’ संबंध को स्वाभाविक बनाता है, और आदरसूचक बहुवचन ‘वे/हुए’ हिन्दी कथन में उपयुक्त है।
