base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/009.yaml
  text: Take heed to yourself from the spirit of sexual immorality, for this is persistent and is about to defile the holy things through your offspring.
translation:
  language: hi
  text: यौन अनैतिकता की आत्मा से अपने को बचाए रखना, क्योंकि वह निरन्तर बनी रहती है और तेरी सन्तान के द्वारा पवित्र वस्तुओं को अशुद्ध करने ही वाली है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρόσεχε σεαυτῷ ἀπό
  choice: अपने आप को ... से सावधान रखना
  rationale: चेतावनी और आत्म-सतर्कता की आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοῦ πνεύματος τῆς πορνείας
  choice: व्यभिचार की आत्मा
  rationale: πνεῦμα और πορνεία की धार्मिक-नैतिक भाषा को निकटता से सुरक्षित रखता है; यहाँ πορνεία व्यापक यौन अनैतिकता भी सूचित कर सकती है।
- source_word: ἐνδελεχῆ
  choice: निरन्तर लगी रहती है
  rationale: पाठ-संदिग्ध विशेषण के सम्भावित ‘लगातार/अविरत’ अर्थ को सहज हिन्दी में व्यक्त करता है, बिना उसकी प्रकृति को अनावश्यक रूप से स्पष्ट किए।
- source_word: μέλλει μιαίνειν
  choice: अशुद्ध करनेवाली है
  rationale: μέλλει की आसन्न अथवा भावी प्रवृत्ति और μιαίνω के धार्मिक अशुद्धीकरण के भाव को संक्षेप में रखता है।
- source_word: διὰ τοῦ σπέρματός σου
  choice: तेरे वंश के द्वारा
  rationale: σπέρμα का यहाँ प्रसंगानुकूल अर्थ संतान/वंश है; ‘वंश’ सामूहिक भाव और माध्यमसूचक διά दोनों को बनाए रखता है।
- source_word: τὰ ἅγια
  choice: पवित्र वस्तुओं
  rationale: नपुंसकलिंग बहुवचन की अस्पष्टता सुरक्षित है; इसे किसी विशेष पवित्रस्थान, संस्कार या समुदाय तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘व्यभिचार की आत्मा’ का व्यक्तिकरण
  choice: व्यभिचार की आत्मा
  alternative: यौन अनैतिकता की प्रवृत्ति
  rationale: मूल में πνεῦμα स्पष्ट रूप से उपस्थित है; इसे केवल मनोवैज्ञानिक प्रवृत्ति बनाना मूल की आध्यात्मिक भाषा को हल कर देता।
- issue: τὰ ἅγια का आशय
  choice: पवित्र वस्तुएँ
  alternative: पवित्र स्थान / पवित्र लोग
  rationale: यूनानी पद का संदर्भ खुला है, इसलिए अनुवाद में उसकी वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तेरे’ का प्रयोग प्राचीन पितृ-संबोधन की एकवचन निकटता बनाए रखता है। स्रोत में †ἐνδελεχῆ ἐστιν† पाठ-संदिग्ध है; मुख्य पाठ में सम्भावित अर्थ दिया गया है, पर कोई अतिरिक्त सिद्धान्तगत निष्कर्ष नहीं जोड़ा गया।
