review_pass:
  verdict: revise
  source_fidelity: The draft conveys the warning, the spiritual expression, persistence, defilement, and the open reference of τὰ ἅγια reasonably well. However, ‘व्यभिचार’ is narrower than πορνεία, and ‘अशुद्ध करनेवाली है’ does not adequately convey μέλλει (‘is about to’/imminently will).
  naturalness: ‘अपने आप को ... से सावधान रखना’ is understandable but less idiomatic than a direct Hindi warning such as ‘अपने को ... से बचाए रखना.’ The revised wording is natural modern standard Hindi while retaining the elevated admonitory register.
  terminology: ‘यौन अनैतिकता की आत्मा’ retains both the breadth of πορνεία and the explicit πνεῦμα language without reducing it to a merely psychological tendency. ‘पवित्र वस्तुओं’ appropriately leaves τὰ ἅγια unspecified. ‘सन्तान’ is a more direct rendering of σπέρμα here than ‘वंश,’ while preserving the collective/offspring sense.
  issues:
  - severity: medium
    issue: ‘व्यभिचार’ renders πορνεία too narrowly.
    rationale: व्यभिचार normally denotes adultery, whereas πορνεία has a broader sense of sexual immorality.
  - severity: medium
    issue: The imminence in μέλλει is not represented clearly.
    rationale: ‘अशुद्ध करनेवाली है’ can simply describe a characteristic; ‘अशुद्ध करने ही वाली है’ conveys the source’s prospective/imminent force.
  - severity: low
    issue: The opening imperative is somewhat awkward in Hindi.
    rationale: ‘अपने को ... से बचाए रखना’ is a more idiomatic and direct way to express the warning.
  revised_text: यौन अनैतिकता की आत्मा से अपने को बचाए रखना, क्योंकि वह निरन्तर बनी रहती है और तेरी सन्तान के द्वारा पवित्र वस्तुओं को अशुद्ध करने ही वाली है।
  revised_footnotes: []
