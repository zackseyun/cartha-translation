revisions:
- from: व्यभिचार की आत्मा से अपने आप को सावधान रखना, क्योंकि यह निरन्तर लगी रहती है और तेरे वंश के द्वारा पवित्र वस्तुओं को अशुद्ध करनेवाली है।
  to: यौन अनैतिकता की आत्मा से अपने को बचाए रखना, क्योंकि वह निरन्तर बनी रहती है और तेरी सन्तान के द्वारा पवित्र वस्तुओं को अशुद्ध करने ही वाली है।
  rationale: The revision broadens the rendering of πορνεία, retains the source’s explicit ‘spirit’ terminology, restores the imminent/prospective force of μέλλει, and uses more idiomatic Hindi. The obelized ἐνδελεχῆ ἐστιν clause is translated conservatively as ‘निरन्तर बनी रहती है,’ without adding an interpretation. No footnote anchor is present in the supplied Hindi draft, so no unanchored footnote has been introduced.
