translation:
  language: hi
  text: और वह भोर में उठकर मेरे द्वारा प्रभु को सब कुछ का दशमांश दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς τῷ πρωὶ
  choice: भोर को उठकर
  rationale: यूनानी कृदन्त और काल-सूचक पद का स्वाभाविक तथा संक्षिप्त हिन्दी रूप।
- source_word: ἀπεδεκάτωσε πάντα
  choice: सब वस्तुओं का दशमांश ... देने लगा
  rationale: क्रिया का मूल अर्थ दशमांश देना है। संदर्भ में यह रूप केवल एक बार की पूर्ण क्रिया के बजाय आगे आरम्भ हुई प्रक्रिया को भी व्यक्त कर सकता है; हिन्दी में ‘दशमांश देने लगा’ इसे स्वाभाविक ढंग से रखता है।
- source_word: δι’ ἐμοῦ
  choice: मेरे द्वारा
  rationale: माध्यम अथवा प्रतिनिधित्व का अर्थ बनाए रखता है और यह अस्पष्टता नहीं मिटाता कि लेवी ने दशमांश पहुँचाया या अनुष्ठान में मध्यस्थ की भूमिका निभाई।
- source_word: τῷ Κυρίῳ
  choice: प्रभु को
  rationale: परंपरागत और स्पष्ट धार्मिक संबोधन, जो यूनानी दत्तिव के प्राप्तकर्ता-संबंधी अर्थ को व्यक्त करता है।
theological_decisions:
- issue: दशमांश देने में ‘मेरे द्वारा’ की भूमिका
  choice: मेरे द्वारा
  alternative: मेरे हाथ से / मेरी मध्यस्थता से
  rationale: मूल δι’ ἐμοῦ की वास्तविक अस्पष्टता सुरक्षित रखी गई है; पाठ यह निश्चित नहीं करता कि भूमिका मात्र सुपुर्दगी की थी या पुरोहितीय मध्यस्थता की।
translation_notes:
