review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Most High hearing the prayer, separation from ἀδικία, and the threefold designation υἱός, θεράπων, λειτουργός. However, αὐτῷ in “become to him a son and a servant” is more naturally represented in Hindi by possessive relationship (“उसके पुत्र और सेवक”) than by purpose (“उसके लिए पुत्र, सेवक”). The final “उसके सामने सेवा करनेवाले” appropriately reflects λειτουργὸν τοῦ προσώπου αὐτοῦ, but its plural form can obscure the Greek singular addressee.
  naturalness: The sentence is generally clear and appropriately elevated. “उसके लिए पुत्र” is less idiomatic and can imply usefulness or purpose rather than filial relationship. Singular “सेवा करनेवाला” aligns smoothly with the individually addressed person while remaining natural with “तुम … बनो.”
  terminology: “परमप्रधान” is an established rendering of ὁ ὕψιστος. “अधर्म” is a defensible broad moral-religious rendering of ἀδικία. “पुत्र” preserves the masculine singular wording without doctrinal expansion. “सेवक” and “उसके सामने सेवा करनेवाला” retain the distinction between θεράπων and λειτουργός without prematurely specifying a priestly office.
  issues:
  - severity: medium
    issue: αὐτῷ is rendered as “उसके लिए” in the phrase concerning sonship and service.
    rationale: In this construction the dative denotes relationship or belonging (“to him”), not primarily purpose or benefit. “उसके पुत्र और सेवक” more directly conveys the source sense.
  - severity: low
    issue: “सेवा करनेवाले” is plural although the Greek addresses one person (σε; υἱόν, θεράποντα, λειτουργόν).
    rationale: Hindi “तुम” may be singular, but singular “सेवा करनेवाला” makes the individual reference explicit and preserves the source’s number.
  revised_text: इसलिए परमप्रधान ने तुम्हारी प्रार्थना सुन ली है कि वह तुम्हें अधर्म से अलग करे और तुम उसके पुत्र और सेवक तथा उसके सामने सेवा करनेवाला बनो।
  revised_footnotes: []
  revision_rationale: The revision changes only the relational force of αὐτῷ from “उसके लिए” to “उसके,” and makes the final role singular to match the Greek addressee. It preserves the draft’s register, the ambiguity of the infinitival construction, and the non-specific religious-service sense of λειτουργός.
