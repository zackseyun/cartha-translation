base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/002.yaml
  text: Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister before him.
translation:
  language: hi
  text: इसलिए परमप्रधान ने तुम्हारी प्रार्थना सुन ली है कि वह तुम्हें अधर्म से अलग करे और तुम उसके पुत्र और सेवक तथा उसके सामने सेवा करनेवाला बनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त यूनानी उपाधि का संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी रूप है।
- source_word: ἀδικίας
  choice: अधर्म
  rationale: यहाँ शब्द नैतिक अन्याय और दुष्टता के व्यापक भाव को व्यक्त करता है; ‘अधर्म’ धार्मिक-नैतिक संदर्भ में स्वाभाविक है।
- source_word: υἱὸν
  choice: पुत्र
  rationale: मूल के संबंधपरक रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: θεράποντα
  choice: सेवक
  rationale: व्यक्तिगत सेवा और समर्पण का सामान्य भाव स्पष्ट करता है तथा अगले पद λειτουργόν से कुछ भेद रखता है।
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: उसके सामने सेवा करनेवाले
  rationale: πρόσωπον के सामी-प्रभावित प्रयोग को ‘उसके सामने’ के रूप में व्यक्त करता है और λειτουργός की नियुक्त धार्मिक/उपासनात्मक सेवा को सहज हिन्दी में संप्रेषित करता है।
theological_decisions:
- issue: ‘पुत्र’ की संबंधपरक उपाधि
  choice: पुत्र
  alternative: संतान
  rationale: पाठ का पुल्लिंग एकवचन υἱόν स्पष्ट है; इसे व्यापक या रूपकात्मक अर्थ में बदलकर तनाव को हल नहीं किया गया।
- issue: प्रार्थना सुनने और अलग किए जाने के बीच संबंध
  choice: ‘कि वह तुम्हें… अलग करे’
  alternative: ‘तुम्हें… अलग करने के लिए’
  rationale: ग्रीक जननार्थक infinitive उद्देश्य अथवा प्रार्थना की विषय-वस्तु दोनों का संकेत दे सकता है; हिन्दी वाक्य प्रार्थना की स्वीकृत विषय-वस्तु को स्वाभाविक ढंग से रखता है, बिना प्रक्रिया को विस्तार से निर्धारित किए।
- issue: λειτουργός का धार्मिक पदभाव
  choice: सेवा करनेवाला
  alternative: याजकीय सेवक
  rationale: ‘याजकीय’ कहना संदर्भ से संभव हो सकता है, पर इस पद में स्वयं स्पष्ट रूप से नहीं कहा गया; इसलिए संप्रदायगत या अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सामान्य-पाठक-सुलभ शैली रखी गई है। ‘सेवक’ और ‘सेवा करनेवाले’ की निकट पुनरावृत्ति मूल के θεράπων और λειτουργός को अलग-अलग बनाए रखने के लिए स्वीकार की गई है।
