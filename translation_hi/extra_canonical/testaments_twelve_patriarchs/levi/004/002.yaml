revisions:
- from: इसलिए परमप्रधान ने तुम्हारी प्रार्थना सुन ली है कि वह तुम्हें अधर्म से अलग करे और तुम उसके लिए पुत्र, सेवक और उसके सामने सेवा करनेवाले बनो।
  to: इसलिए परमप्रधान ने तुम्हारी प्रार्थना सुन ली है कि वह तुम्हें अधर्म से अलग करे और तुम उसके पुत्र और सेवक तथा उसके सामने सेवा करनेवाला बनो।
  rationale: The revision changes only the relational force of αὐτῷ from “उसके लिए” to “उसके,” and makes the final role singular to match the Greek addressee. It preserves the draft’s register, the ambiguity of the infinitival construction, and the non-specific religious-service sense of λειτουργός.
  reviewer_model: gpt-5.6-terra
