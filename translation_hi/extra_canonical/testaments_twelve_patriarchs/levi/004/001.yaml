reference: Testament of Levi 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Νῦν οὖν γίνωσκε¹ ὅτι ποιήσει Κύριος κρίσιν ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων. Ὅτι² πετρῶν³ σχιζομένων, καὶ τοῦ ἡλίου σβεννυμένου⁴ καὶ ὑδάτων⁵ ξηραινομένων καὶ τοῦ⁶ πυρὸς καταπτήσσοντος⁷ καὶ πάσης [τῆς]⁸ κτίσεως κλονουμένης⁹ καὶ τῶν ἀοράτων πνευμάτων¹⁰ τηκομένων¹¹ καὶ¹² τοῦ ᾅδου σκυλευομένου¹³ [ἐπὶ τῷ πάθει τοῦ ὑψίστου]¹⁴ *οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις¹⁵, διὰ τοῦτο ἐν Γτῇ¹⁶ κολάσει κριθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/001.yaml
  text: Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are split, and the sun is extinguished, and waters dry up, and fire cowers, and all creation is shaken, and the invisible spirits melt away, and Hades is plundered at the suffering of the Most High[a], disobedient men will persist in their injustices; therefore they will be judged in punishment.
translation:
  language: hi
  text: इसलिए अब जान ले कि प्रभु मनुष्यों की सन्तानों का न्याय करेगा। क्योंकि जब चट्टानें फट जाएँगी, सूर्य बुझ जाएगा, जल सूख जाएगा, अग्नि सहम जाएगी, सारी सृष्टि हिलाई जाएगी, अदृश्य आत्माएँ पिघल जाएँगी, और परमप्रधान के दुःख के समय[a] अधोलोक लूट लिया जाएगा, तब भी अवज्ञा करने वाले मनुष्य अन्यायों में बने रहेंगे; इसलिए दण्ड के अन्तर्गत उनका न्याय किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमप्रधान के दुःख के समय’ वाला वाक्यांश यूनानी पाठ-परम्परा में अनिश्चित है और सम्भवतः बाद में जोड़ा गया विस्तार हो सकता है; यहाँ इसका अनुवाद इसलिए किया गया है क्योंकि यह उपलब्ध साक्षी-पाठ में मौजूद है।
    reason: textual_variant
lexical_decisions:
- source_word: κρίσιν ... κριθήσονται
  choice: न्याय करेगा ... उनका न्याय किया जाएगा
  rationale: एक ही यूनानी न्याय-शब्दावली की पुनरावृत्ति को बनाए रखते हुए हिन्दी में स्वाभाविक कर्तृवाच्य और कर्मवाच्य प्रयोग किया गया है।
- source_word: τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: मनुष्यों की सन्तानों
  rationale: शाब्दिक चित्र को सुरक्षित रखा गया है; इसे केवल सामान्यीकृत ‘मानवजाति’ में नहीं बदला गया।
- source_word: τοῦ πυρὸς καταπτήσσοντος
  choice: अग्नि सहम जाएगी
  rationale: क्रिया में भय से दुबकने या सिकुड़ने का भाव है; ‘सहम जाना’ इस असामान्य मानवीकरण को सहज हिन्दी में बनाए रखता है।
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: अधोलोक लूट लिया जाएगा
  rationale: ᾅδης के लिए आधुनिक पाठक-बोधगम्य ‘अधोलोक’ और σκυλεύω के लूटे जाने के प्रबल रूपक को रखा गया है।
- source_word: ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις
  choice: अवज्ञाकारी मनुष्य अपने अन्याय के कामों में लगे रहेंगे
  rationale: ἀπειθοῦντες को व्यक्तियों का गुण और ἐπιμενοῦσι को निरन्तर बने रहने की क्रिया मानकर दोनों अर्थों को अलग-अलग सुरक्षित रखा गया है; बहुवचन ἀδικίαις को ‘अन्याय के कामों’ से व्यक्त किया गया है।
- source_word: ἐν τῇ κολάσει κριθήσονται
  choice: दण्ड के अन्तर्गत उनका न्याय किया जाएगा
  rationale: उपलब्ध पाठ के ἐν और निश्चित पदबंध को दर्शाता है; ‘अधिक दण्ड’ नहीं चुना गया, क्योंकि वह प्रस्तुत यूनानी मुख्य पाठ में स्पष्ट नहीं है।
theological_decisions:
- issue: ἐπὶ τῷ πάθει τοῦ ὑψίστου में परमप्रधान के दुःख का उल्लेख
  choice: परमप्रधान के दुःख सहने पर
  alternative: इस पाठांश को छोड़ देना अथवा इसे किसी निश्चित मसीही व्याख्या के अनुसार स्पष्ट करना
  rationale: प्रस्तुत साक्षी में वाक्यांश मौजूद है, इसलिए उसका अनुवाद किया गया; उसकी पाठालोचनात्मक अनिश्चितता पादटिप्पणी में बताई गई और उसके कर्ता अथवा सिद्धान्तगत आशय को अतिरिक्त रूप से निर्धारित नहीं किया गया।
- issue: ᾅδης की धार्मिक संकल्पना
  choice: अधोलोक
  alternative: नरक
  rationale: ‘नरक’ अन्तिम दण्ड का अधिक विशिष्ट अर्थ ला सकता है; ‘अधोलोक’ मृतकों के लोक के व्यापक और यहाँ अधिक उपयुक्त अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। प्रलयात्मक बिम्बों की असामान्यता—अग्नि का सहमना, आत्माओं का पिघलना और अधोलोक का लूटा जाना—को सहज बनाने के नाम पर हटाया नहीं गया।
