  text: You shall shine the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.
translation:
  language: hi
  text: तू याकूब में ज्ञान का प्रकाश फैलाएगा, और इस्राएल के समस्त वंश के लिए सूर्य के समान होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωτιεῖς
  choice: प्रकाश फैलाएगा
  rationale: यह क्रिया ज्ञान के प्रकाश को चमकाने या प्रकाशित करने का भाव देती है; ‘प्रकाश फैलाएगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस सकर्मक अर्थ को व्यक्त करता है।
- source_word: ἐν τῷ Ἰακώβ
  choice: याकूब में
  rationale: मूल यूनानी के स्थान अथवा समुदाय-संबंधी प्रयोग को जानबूझकर व्यापक रखा गया है।
- source_word: παντὶ σπέρματι Ἰσραήλ
  choice: इस्राएल के समस्त वंश के लिए
  rationale: σπέρμα का सामूहिक अर्थ ‘वंश’ है; παντί को ‘समस्त’ से और संबंधसूचक भाव को ‘के लिए’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: प्रकाश और सूर्य की उपमाओं का संबंध
  choice: दोनों उपमाओं को अलग किंतु समानांतर कथनों के रूप में सुरक्षित रखा गया है।
  alternative: दूसरे कथन को पहले की व्याख्या बनाकर मिला देना।
  rationale: मूल पाठ ज्ञान के प्रकाश को फैलाने और सूर्य के समान होने—दोनों को स्वतंत्र समन्वित कथनों में रखता है; इन्हें मिलाने से काव्यात्मक तथा वैचारिक तनाव घट जाता।
translation_notes:
