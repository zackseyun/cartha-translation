source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δοθήσεταί σοι εὐλογία *καὶ παντὶ τῷ σπέρματί σου³⁵ ἕως³⁶ ἐπισκέψεται³⁷ Κύριος πάντα τὰ ἔθνη³⁸ ἐν σπλάγχνοις [υἱοῦ]³⁹ αὐτοῦ *ἕως αἰῶνος⁴⁰. [Πλὴν⁴¹ οἱ υἱοί σου ἐπιβαλοῦσι χεῖρας *ἐπ᾿ αὐτὸν⁴² *τοῦ ἀνασκολοπίσαι⁴³ αὐτόν.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/004.yaml
  text: And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son[a] forever.
translation:
  language: hi
  text: और तुम्हें तथा तुम्हारे सारे वंश को आशीष दी जाएगी, जब तक कि प्रभु अपने [पुत्र] की करुणा में सभी जातियों की सुधि न लें—सदा तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिखित साक्ष्य इस पद को विस्तार देकर स्पष्ट रूप से कहते हैं कि परमेश्वर सृष्टि का उद्धार करने के लिए ‘अपने पुत्र’ को भेजेगा, और लेवी के पुत्र उस पर हाथ डालकर उसे खूँटे पर बेधेंगे। यहाँ मुख्य पाठ संक्षिप्त पाठ का अनुसरण करता है; साथ ही ‘अपने [पुत्र] की करुणा’ में ‘पुत्र’ को कोष्ठकों में रखकर उसकी पाठगत अनिश्चितता दिखाई गई है।
    reason: textual_variant
lexical_decisions:
- source_word: σπέρματί
  choice: वंश
  rationale: यहाँ सामूहिक अर्थ में लेवी की भावी संतान का संकेत है; ‘वंश’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπισκέψεται
  choice: सुधि ले
  rationale: क्रिया में केवल देखने नहीं, बल्कि कृपापूर्वक ध्यान देने और सहायता के लिए आने का भाव है; ‘सुधि लेना’ इस व्यापकता को बनाए रखता है।
- source_word: ἐν σπλάγχνοις
  choice: करुणा में
  rationale: शाब्दिक रूप से अंतड़ियों/अंतरतम से निकली गहरी दया का मुहावरा है; हिन्दी में ‘करुणा’ इसका स्वाभाविक अर्थ देता है।
- source_word: ἔθνη
  choice: जातियों
  rationale: बहुवचन शब्द राष्ट्रों अथवा अन्यजातीय समुदायों को सूचित कर सकता है; ‘सब जातियाँ’ उस व्यापकता और संभावित अर्थ-तनाव को बनाए रखता है।
- source_word: ἕως αἰῶνος
  choice: सदा तक
  rationale: दीर्घकालिक अथवा अनंत काल के मुहावरे को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: υἱοῦ (‘पुत्र’) की पाठगत स्थिति
  choice: मुख्य पाठ में ‘[पुत्र]’ को कोष्ठकों में रखा गया
  alternative: शब्द को बिना कोष्ठक स्वीकार करना अथवा पूर्णतः छोड़ देना
  rationale: प्रदत्त यूनानी पाठ स्वयं इस शब्द को पाठगत रूप से संदिग्ध दिखाता है; कोष्ठक अनिश्चितता को बिना छिपाए सुरक्षित रखते हैं।
- issue: पद के अंत का विस्तृत खंड
  choice: संक्षिप्त मुख्य पाठ अपनाया और विस्तृत पाठांतर को पादटिप्पणी में बताया
  alternative: ‘तुम्हारे पुत्र उस पर हाथ डालेंगे और उसे सूली पर चढ़ाएँगे’ को मुख्य पाठ में शामिल करना
  rationale: पूरा अंतिम वाक्य प्रदत्त स्रोत में कोष्ठकबद्ध पाठांतर है, और परामर्श-पाठ संक्षिप्त रूप का अनुसरण करता है; इसलिए इसे मुख्य पाठ में निश्चित रूप से प्रस्तुत नहीं किया गया।
- issue: ‘पुत्र’ का रूप
  choice: सामान्य देवनागरी रूप ‘पुत्र’
  alternative: अंग्रेज़ी परंपरा की भाँति बड़े अक्षर से विशिष्ट मसीही उपाधि सूचित करना
  rationale: हिन्दी में बड़े और छोटे अक्षरों का भेद नहीं है; पाठगत अनिश्चितता के बीच अतिरिक्त सांप्रदायिक व्याख्या जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और शास्त्रीय भाव वाला रूप। ‘सुधि लेना’ कृपापूर्ण दैवी आगमन का भाव रखता है। डैश ‘जब तक’ और ‘सदा तक’ के असामान्य यूनानी संयोजन को मिटाए बिना हिन्दी वाक्य को पठनीय बनाता है।
