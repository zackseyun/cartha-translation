translation:
  language: hi
  text: और इसी कारण तुम्हें सलाह और समझ दी गई है, ताकि तुम अपने पुत्रों को इस विषय की समझ दे सको।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ
  choice: सलाह
  rationale: यहाँ शब्द का अर्थ परामर्श या विवेकपूर्ण सलाह है; आधुनिक हिन्दी में ‘सलाह’ सहज और स्पष्ट है।
- source_word: σύνεσις
  choice: समझ
  rationale: यह बोध और समझने की क्षमता को व्यक्त करता है; ‘समझ’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: τοῦ συνετίσαι
  choice: समझा सको
  rationale: यह प्रयोजनसूचक infinitive किसी को समझदार बनाने, शिक्षा देने या समझाने का भाव रखता है; प्रसंग में पुत्रों को बात समझाने का अर्थ उपयुक्त है।
- source_word: περὶ τούτου
  choice: इस विषय में
  rationale: ग्रीक पदबंध का निर्देशात्मक भाव बनाए रखता है और पूर्ववर्ती विषय की ओर संकेत करता है।
