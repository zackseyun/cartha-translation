base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/006.yaml
  text: For those who bless him will be blessed, and those who curse him will perish.
translation:
  language: hi
  text: क्योंकि जो उसे आशीर्वाद देते हैं, वे आशीष पाएँगे, और जो उसे शाप देते हैं, वे नाश हो जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εὐλογοῦντες
  choice: जो ... आशीर्वाद देते हैं
  rationale: वर्तमान कृदंत को स्वाभाविक हिन्दी संबंधवाचक वाक्यांश में रखा गया है; यह किसी के लिए भलाई और अनुग्रह की कामना करने का भाव बनाए रखता है।
- source_word: εὐλογημένοι ἔσονται
  choice: आशीष पाएँगे
  rationale: यूनानी भविष्यकालीन कर्मवाच्य अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना आशीष देने वाले कर्ता को पाठ से अधिक स्पष्ट किए।
- source_word: οἱ καταρώμενοι
  choice: जो ... शाप देते हैं
  rationale: καταράομαι के प्रतिकूल वचन और विनाश की कामना वाले अर्थ के लिए प्रचलित तथा गरिमापूर्ण हिन्दी पद।
- source_word: ἀπολοῦνται
  choice: नाश हो जाएँगे
  rationale: मध्यवाच्य रूप के भविष्यकालीन विनाश के अर्थ को व्यक्त करता है; इसे केवल मृत्यु या अनन्त दण्ड जैसे अधिक विशिष्ट अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: सर्वनाम αὐτόν का संदर्भ
  choice: उसे
  alternative: उसका स्पष्ट नाम या पद दोहराना
  rationale: इस पद में पुरुषवाचक सर्वनाम है और उसका संदर्भ पूर्ववर्ती प्रसंग से आता है; उसे स्पष्ट नाम से बदलना मूल की संदर्भगत निर्भरता को अनावश्यक रूप से सुलझा देता।
- issue: εὐλογημένοι ἔσονται में अप्रकट कर्ता
  choice: आशीष पाएँगे
  alternative: परमेश्वर उन्हें आशीष देगा
  rationale: यूनानी कर्मवाच्य है और आशीष देने वाले का नाम नहीं बताता; अनुवाद उसी अप्रकटता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण शैली। समानांतर वाक्य-विन्यास में ‘आशीर्वाद देते हैं/आशीष पाएँगे’ और ‘शाप देते हैं/नाश हो जाएँगे’ का विरोध मूल की संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
