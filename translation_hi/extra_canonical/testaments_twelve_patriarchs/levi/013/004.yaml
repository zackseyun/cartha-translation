id: T12P.LEV.13.4
reference: Testament of Levi 13:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται¹⁹ καὶ ἐπιθυμήσουσι πολλοὶ τῶν ἀνθρώπων δουλεῦσαι αὐτῷ²⁰ καὶ ἀκοῦσαι νόμου²¹ ἐκ τοῦ²² στόματος αὐτοῦ²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/004.yaml
  text: Indeed, he will gain many friends beyond his parents, and many among men will desire to serve him and to hear the law from his mouth.
translation:
  language: hi
  text: और सचमुच, वह अपने माता-पिता से भी बढ़कर बहुत से मित्र पाएगा[a]; और बहुत से लोग उसकी सेवा करने और उसके मुख से व्यवस्था सुनने की लालसा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अर्थ “माता-पिता से अधिक” भी हो सकता है, या “माता-पिता के अतिरिक्त”।
    reason: ὑπὲρ γονεῖς को तुलनात्मक अधिकता के रूप में, अथवा ‘परे/अतिरिक्त’ के भाव में समझा जा सकता है।
lexical_decisions:
- source_word: Καίγε
  choice: निश्चय ही
  rationale: यह आरम्भिक बलाघात और पुष्टि को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: φίλους ... κτήσεται
  choice: मित्र पाएगा
  rationale: κτάομαι का आशय मित्रों को प्राप्त करना या बना लेना है; ‘मित्र पाएगा’ सहज हिन्दी है और संबंध को केवल लेन-देन की वस्तु की तरह प्रस्तुत नहीं करता।
- source_word: ὑπὲρ γονεῖς
  choice: अपने माता-पिता से भी बढ़कर
  rationale: ὑπέρ के साथ कर्मकारक यहाँ तुलना या सीमा से आगे जाने का भाव देता है। मुख्य पाठ उस तुलना को बनाए रखता है; संभावित अर्थ-भेद पाद-टिप्पणी में दिया गया है।
- source_word: δουλεῦσαι αὐτῷ
  choice: उसकी सेवा करने
  rationale: δουλεύω अधीन होकर सेवा करने का भाव रखता है; यहाँ ‘सेवा करना’ प्रसंगानुकूल और सहज है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: νόμος के लिए ‘व्यवस्था’ धार्मिक-नैतिक विधान का स्थापित हिन्दी समतुल्य है; यूनानी में लेख न होने पर भी यहाँ सामान्य या ज्ञात व्यवस्था का आशय संभव है।
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: उसके मुख से
  rationale: स्रोत की शारीरिक उपमा और प्रत्यक्ष मौखिक शिक्षा का भाव सुरक्षित रहता है।
theological_decisions:
- issue: νόμου में निश्चित उपपद का अभाव
  choice: व्यवस्था
  alternative: कोई व्यवस्था / व्यवस्था की बातें
  rationale: यूनानी में νόμου अनिश्चित रूप में है, पर वाक्य में इसका स्वाभाविक आशय उससे सुनाई जाने वाली धार्मिक व्यवस्था या शिक्षा है। हिन्दी में ‘व्यवस्था सुनना’ इस संदर्भ को बिना अनावश्यक निश्चितता जोड़े पर्याप्त रूप से व्यक्त करता है।
- issue: ὑπὲρ γονεῖς का संबंध
  choice: माता-पिता से भी बढ़कर
  alternative: माता-पिता के अतिरिक्त / माता-पिता से अधिक
  rationale: वाक्यांश में वास्तविक तुलना या ‘परे’ का भाव अस्पष्ट है। मुख्य पाठ तुलनात्मक तनाव को बनाए रखता है और पाद-टिप्पणी वैकल्पिक समझ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘मुख’ और ‘व्यवस्था’ जैसे शब्द पाठ की धार्मिक गरिमा और स्रोत की अभिव्यक्ति बनाए रखते हैं। वाक्य-रचना को सरल रखा गया है और मूल के दोनों संयुक्त क्रियात्मक आशयों—सेवा करना तथा सुनना—को स्पष्ट रूप से जोड़ा गया है।
