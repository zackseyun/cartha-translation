  text: Ποιήσατε, Γοὖν²⁴⁾ δικαιοσύνην²⁵, τέκνα μου, ἐπὶ τῆς γῆς, ἵνα †εὕρητε²⁶ ἐν τοῖς οὐρανοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/005.yaml
  text: Therefore do righteousness, my children, on the earth, so that you may be found in the heavens.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, पृथ्वी पर धार्मिकता के काम करो, ताकि तुम स्वर्गों में पाए जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ अनिश्चित है; इसका अनुवाद यह भी हो सकता है: “ताकि तुम उसे स्वर्गों में पाओ।”'
    reason: स्रोत-संस्करण εὕρητε को पाठ-संदेह के चिह्न से चिह्नित करता है, और सक्रिय तथा निष्क्रिय/अकर्मक समझ के बीच वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: Ποιήσατε … δικαιοσύνην
  choice: धार्मिकता के काम करो
  rationale: यह यूनानी अभिव्यक्ति ‘धार्मिकता करना/आचरण में लाना’ बताती है। हिंदी में ‘धार्मिकता के काम करो’ उसका स्वाभाविक और क्रियात्मक अर्थ व्यक्त करता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन का स्नेहपूर्ण पारिवारिक स्वर बनाए रखा गया है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: स्थानसूचक अर्थ का सीधा और स्वाभाविक अनुवाद।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में
  rationale: यूनानी बहुवचन को बनाए रखा गया है; उसे एकवचन बनाकर पाठ की ब्रह्मांड-संबंधी अभिव्यक्ति को समतल नहीं किया गया।
theological_decisions:
- issue: εὕρητε का संदिग्ध अर्थ और पाठ
  choice: ताकि तुम … पाए जाओ
  alternative: ताकि तुम उसे स्वर्गों में पाओ
  rationale: मुद्रित यूनानी में शब्द पर पाठ-संदेह का चिह्न है। रूप देखने में सक्रिय ‘तुम पाओ’ हो सकता है, पर प्रसंग में अकर्मक/निष्क्रिय भाव ‘तुम पाए जाओ’ भी समझा गया है। मुख्य पाठ में संदर्भानुकूल निष्क्रिय अर्थ रखा गया और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्गों’ का बहुवचन स्रोत के अनुरूप है, और पाठगत अस्पष्टता को बिना किसी सांप्रदायिक व्याख्या के पादटिप्पणी में दर्शाया गया है।
