reference: Testament of Levi 13:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὅτι¹⁴ πᾶς, *ὃς γνώσεται¹⁵ *νόμον Κυρίου¹⁶, τιμηθήσεται, καὶ οὐκ ἔσται¹⁷ ξένος, ὅπου ὑπάγει¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/003.yaml
  text: For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes.
translation:
  language: hi
  text: क्योंकि जो कोई प्रभु की व्यवस्था को जान लेगा, उसका सम्मान होगा, और वह जहाँ कहीं जाएगा, वहाँ परदेशी नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσεται
  choice: जान लेगा
  rationale: यह भविष्यकालीन रूप ज्ञान प्राप्त करने या भली-भाँति जानने का भाव देता है; ‘जान लेगा’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νόμον Κυρίου
  choice: प्रभु की व्यवस्था
  rationale: ‘व्यवस्था’ νόμος का प्रचलित और प्रसंगानुकूल धार्मिक अनुवाद है, जो केवल किसी एक नियम के बजाय प्रभु की संपूर्ण विधि/शिक्षा का संकेत देता है।
- source_word: τιμηθήσεται
  choice: उसका सम्मान होगा
  rationale: यूनानी कर्मवाच्य भविष्यकाल को स्वाभाविक हिन्दी में रखा गया है और सम्मान देने वाले को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- source_word: ξένος
  choice: परदेशी
  rationale: यह शब्द अपरिचित, बाहरी व्यक्ति या विदेशी का अर्थ दे सकता है; यात्रा के प्रसंग में ‘परदेशी’ मूल की व्यापकता और भाव को बनाए रखता है।
- source_word: ὅπου ὑπάγει
  choice: जहाँ कहीं जाएगा
  rationale: अनिश्चित व्यापकता व्यक्त करने के लिए ‘जहाँ कहीं’ और भविष्याभिमुख कथन के अनुरूप ‘जाएगा’ स्वाभाविक है।
theological_decisions:
- issue: प्रभु की व्यवस्था को जानने और सम्मान पाने के बीच संबंध
  choice: मूल पाठ के सीधे कारणात्मक कथन को यथावत रखा गया
  alternative: इसे आज्ञापालन, उद्धार या धार्मिक योग्यता के विशेष सिद्धांत के रूप में स्पष्ट करना
  rationale: γνώσεται केवल ‘जानने’ को स्पष्ट करता है; पाठ से बाहर की धार्मिक व्याख्या जोड़ना उचित नहीं।
- issue: परदेशी न होने का आशय
  choice: रूपकात्मक अथवा सामाजिक अर्थ को खुला रखा गया
  alternative: इसे निश्चित रूप से नागरिकता, आतिथ्य, या परमेश्वर की स्वीकृति के अर्थ में समझाना
  rationale: मूल ξένος और प्रसंगगत वाक्यांश में अर्थगत विस्तार है, इसलिए अनुवाद ने किसी एक व्याख्या को निर्णायक नहीं बनाया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘व्यवस्था’ और ‘प्रभु’ जैसे स्थापित बाइबलीय पदों का प्रयोग किया गया है; वाक्य की भविष्यकालीन और कारणात्मक संरचना सुरक्षित रखी गई है।
