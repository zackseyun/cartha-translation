review_pass:
  verdict: revise
  source_fidelity: Draft correctly conveys the universal subject, teaching and doing what is good, and the comparison with Joseph. However, “उन पर चलता है” interprets πράττει as following teachings rather than doing/practising good things, and “बैठा था” makes the supplied verb more concrete than the Greek ellipsis and English audit trail (“was”).
  naturalness: The draft is generally fluent. “राजाओं के साथ सिंहासनासीन होगा” is a natural formal-register rendering that more precisely expresses σύνθρονος than “सिंहासन पर बैठेगा.”
  terminology: “यूसुफ” is the established Hindi form of Joseph. “सिंहासनासीन” accurately retains the shared-enthronement imagery without deciding the precise nature of the honor or office.
  issues:
  - severity: medium
    issue: πράττει is rendered as “उन पर चलता है.”
    rationale: The Greek means “does/practises [good things].” The draft shifts this to adherence to teachings, an interpretive narrowing. “उन्हें करता है” retains the direct object and the broad ethical sense.
  - severity: medium
    issue: σύνθρονος is rendered as merely sitting on a throne with kings, and the ellipsis for Joseph is supplied as “बैठा था.”
    rationale: The Greek adjective denotes being co-enthroned/enthroned with kings. “सिंहासनासीन होगा” represents this more directly. In the Joseph comparison, “था” naturally carries the elided predicate without introducing the more specific action “बैठा था.”
  revised_text: हर वह व्यक्ति जो अच्छी बातें सिखाता और उन्हें करता है, राजाओं के साथ सिंहासनासीन होगा, जैसे मेरा भाई यूसुफ भी था।
  revised_footnotes: []
  revision_rationale: The revision restores the direct force of “does [good things]” and renders σύνθρονος as co-enthronement in idiomatic, dignified modern Hindi. The final “था” preserves the Greek’s elliptical comparison and avoids adding a more specific verb than the source supplies.
