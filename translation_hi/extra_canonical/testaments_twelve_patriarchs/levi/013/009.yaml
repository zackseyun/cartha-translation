  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶς ὃς ἂν διδάσκει καλὰ καὶ πράττει⁶⁰ σύνθρονος ἔσται⁶¹ βασιλέων⁶², ὥσπερ⁶³ καὶ Ἰωσὴφ ὁ ἀδελφός⁶⁴ μου⁶⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/009.yaml
  text: Everyone who teaches good things and does them will be enthroned with kings, just as Joseph my brother also was.
translation:
  language: hi
  text: हर वह व्यक्ति जो अच्छी बातें सिखाता और उन्हें करता है, राजाओं के साथ सिंहासनासीन होगा, जैसे मेरा भाई यूसुफ भी था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὃς ἂν
  choice: हर वह व्यक्ति जो
  rationale: यह यूनानी अनिश्चित सार्वभौमिक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διδάσκει καλὰ
  choice: अच्छी बातें सिखाता
  rationale: καλά यहाँ नैतिक रूप से अच्छी बातों या शिक्षाओं को सूचित करता है; ‘अच्छी बातें’ मूल की व्यापकता बनाए रखता है।
- source_word: καὶ πράττει
  choice: और उन पर चलता है
  rationale: शाब्दिक अर्थ ‘और करता है’ है, पर हिन्दी में सिखाई हुई अच्छी बातों को स्वयं आचरण में लाने का आशय ‘उन पर चलता है’ से स्पष्ट और स्वाभाविक होता है।
- source_word: σύνθρονος ἔσται βασιλέων
  choice: राजाओं के साथ सिंहासन पर बैठेगा
  rationale: σύνθρονος का अर्थ किसी के साथ सिंहासन साझा करने या सह-सिंहासनासीन होने का है। यह अनुवाद राजकीय सम्मान और साथ बैठने—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: ὥσπερ καὶ Ἰωσὴφ ὁ ἀδελφός μου
  choice: ठीक वैसे ही जैसे मेरा भाई यूसुफ भी
  rationale: ὥσπερ का तुलनात्मक बल ‘ठीक वैसे ही’ से और καί का समावेशी बल ‘भी’ से सुरक्षित रहता है।
theological_decisions:
- issue: σύνθρονος में राजकीय पद या सम्मान का स्वरूप
  choice: राजाओं के साथ सिंहासन पर बैठेगा
  alternative: राजाओं के साथ सिंहासनासीन होगा
  rationale: मूल में सह-सिंहासन का चित्र है, पर यह स्पष्ट नहीं करता कि व्यक्ति स्वयं राजा है या राजाओं के समान सम्मानित है। चुना हुआ रूप उस तनाव को बनाए रखता है और किसी विशेष राजकीय या युगांत-संबंधी सिद्धांत को नहीं जोड़ता।
- issue: यूसुफ के उदाहरण में लुप्त क्रिया
  choice: भी बैठा था
  alternative: भी था
  rationale: यूनानी में दूसरी उपवाक्य की क्रिया पहले विधेय से समझी जाती है। हिन्दी में ‘बैठा था’ जोड़ने से तुलना स्पष्ट होती है, बिना नया अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सिंहासनासीन’ की अपेक्षा ‘सिंहासन पर बैठेगा’ अधिक सामान्य है, जबकि मूल का राजकीय बिंब भी सुरक्षित रहता है।
