revisions:
- from: हर वह व्यक्ति जो अच्छी बातें सिखाता और उन पर चलता है, राजाओं के साथ सिंहासन पर बैठेगा, ठीक वैसे ही जैसे मेरा भाई यूसुफ भी बैठा था।
  to: हर वह व्यक्ति जो अच्छी बातें सिखाता और उन्हें करता है, राजाओं के साथ सिंहासनासीन होगा, जैसे मेरा भाई यूसुफ भी था।
  rationale: The revision restores the direct force of “does [good things]” and renders σύνθρονος as co-enthronement in idiomatic, dignified modern Hindi. The final “था” preserves the Greek’s elliptical comparison and avoids adding a more specific verb than the source supplies.
  reviewer_model: gpt-5.6-terra
