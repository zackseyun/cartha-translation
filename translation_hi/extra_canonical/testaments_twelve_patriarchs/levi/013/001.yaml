id: T12P.LEV.13.1
reference: Testament of Levi 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *νῦν, τέκνα μου¹, ἐντέλλομαι ὑμῖν, φοβεῖσθε² *Κύριον τὸν Θεὸν ὑμῶν³ Γἐξ ὅλης τῆς καρδίας ὑμῶν⁴⁾, καὶ πορεύεσθε ἐν ἁπλότητι⁵ *κατὰ πάντα τὸν νόμον αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/001.yaml
  text: 'And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity in accordance with all his law.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ: अपने परमेश्वर प्रभु का भय अपने पूरे हृदय से मानो, और उसकी सारी व्यवस्था के अनुसार निष्कपटता से चलो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: आत्मीय संबोधन को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: φοβεῖσθε
  choice: भय मानो
  rationale: यहाँ परमेश्वर के प्रति श्रद्धापूर्ण भय और आज्ञाकारिता का भाव है; केवल ‘डरो’ अनावश्यक रूप से आतंक का अर्थ दे सकता है।
- source_word: ἐν ἁπλότητι
  choice: निष्कपटता से
  rationale: ἁπλότης यहाँ छल-कपट से रहित, एकनिष्ठ आचरण को सूचित करता है; ‘सरलता’ की अपेक्षा ‘निष्कपटता’ नैतिक अर्थ अधिक स्पष्ट करती है।
- source_word: κατὰ πάντα τὸν νόμον αὐτοῦ
  choice: उसकी सारी व्यवस्था के अनुसार
  rationale: ‘सारी’ πάντα की व्यापकता को और ‘के अनुसार’ κατά के मानक-अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: φοβεῖσθε में भय का स्वरूप
  choice: भय मानो
  alternative: डरो
  rationale: मूल शब्द की ‘fear’ संबंधी शक्ति बनाए रखते हुए वाक्य के धार्मिक संदर्भ में श्रद्धापूर्ण भय का संकेत दिया गया है; इसे केवल ‘आदर करो’ बनाकर मूल तनाव समाप्त नहीं किया गया।
- issue: νόμος का अनुवाद
  choice: व्यवस्था
  alternative: कानून
  rationale: धार्मिक-साहित्यिक संदर्भ में ‘व्यवस्था’ अधिक स्वाभाविक है और परमेश्वर द्वारा दिए गए समग्र विधान को व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। आज्ञार्थक क्रियाएँ बहुवचन संबोधन के अनुरूप रखी गई हैं।
