reference: Testament of Levi 13:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ⸀Ἐὰν γάρ τις φυλάξῃ αὐτὸν ἐκ τῶν πονηρῶν τούτων ἔργων⸀⁵¹ τότε⁵² γενήσεται⁵³ αὐτῷ σοφία⁵⁴ καὶ *παρὰ τοῖς πολεμίοις λαμπρὰ⁵⁵ καὶ ἐπὶ⁵⁶ γῆς ἀλλοτρίας⁵⁷ πατρίς, καὶ ἐν μέσῳ⁵⁸ ἐχθρῶν εὑρηθήσεται⁵⁹ φίλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/008.yaml
  text: For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend.
translation:
  language: hi
  text: क्योंकि यदि कोई अपने आपको इन बुरे कामों से बचाए रखे, तो शत्रुओं के बीच भी उसकी बुद्धि उज्ज्वल होगी; पराया देश उसके लिए स्वदेश बन जाएगा, और बैरियों के बीच वह मित्र पाया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃ αὐτὸν
  choice: अपने आपको ... बचाए रखे
  rationale: मध्यवाच्य भाव और नैतिक चौकसी—व्यक्ति स्वयं को बुरे कामों से दूर रखता है—को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν πονηρῶν τούτων ἔργων
  choice: इन बुरे कामों से
  rationale: δεικτικό ‘इन’ तथा नैतिक रूप से बुरे कर्मों का सीधा अर्थ सुरक्षित है।
- source_word: σοφία ... λαμπρά
  choice: उसकी बुद्धि उज्ज्वल होगी
  rationale: ग्रीक में ‘बुद्धि’ कर्ता और ‘उज्ज्वल/प्रतिष्ठित’ विधेय है; हिन्दी में संबंधसूचक ‘उसकी’ αὐτῷ के लाभ/संबंध भाव को स्वाभाविक रूप देता है।
- source_word: παρὰ τοῖς πολεμίοις
  choice: शत्रुओं के बीच भी
  rationale: παρά का सामाजिक परिवेशगत अर्थ ‘के बीच’ है; ‘भी’ विरोधाभासी बल को व्यक्त करता है।
- source_word: ἐπὶ γῆς ἀλλοτρίας πατρίς
  choice: पराया देश उसके लिए स्वदेश बन जाएगा
  rationale: संक्षिप्त ग्रीक नामिक वाक्यांश के विरोध—विदेश में स्वदेश—को स्पष्ट, किंतु बिना अतिरिक्त व्याख्या के, व्यक्त करता है।
- source_word: ἐν μέσῳ ἐχθρῶν εὑρηθήσεται φίλος
  choice: बैरियों के बीच वह मित्र पाया जाएगा
  rationale: εὑρηθήσεται की कर्मवाच्य संरचना ‘पाया जाएगा’ से सुरक्षित रहती है; ‘बैरी’ पुनरुक्ति घटाते हुए ἐχθρός का शत्रुतापूर्ण भाव रखता है।
