id: T12P.LEV.13.6
reference: Testament of Levi 13:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ σπείρατε²⁷ ἐν *ταῖς ψυχαῖς²⁸ ὑμῶν²⁹ ἀγαθὰ *καὶ εὑρήσετε³⁰ αὐτὰ³¹ *ἐν τῇ ζωῇ ὑμῶν³². *Ἐὰν δὲ σπείρητε πονηρὰ³³ *πᾶσαν ταραχὴν καὶ θλίψιν θερίσετε³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/006.yaml
  text: And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction.
translation:
  language: hi
  text: और अपने भीतर भलाई बोओ, और उसे अपने जीवन में पाओगे। पर यदि तुम बुराई बोओगे, तो हर प्रकार की उथल-पुथल और क्लेश काटोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: अपने प्राणों में
  rationale: ψυχή के भीतरी नैतिक-आध्यात्मिक अर्थ को रखते हुए ‘प्राण’ चुना गया; यह केवल मन तक अर्थ को सीमित नहीं करता।
- source_word: ἀγαθὰ
  choice: अच्छी बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण का वस्तुवाचक प्रयोग है; सामान्य और व्यापक नैतिक अर्थ बनाए रखा गया।
- source_word: ἐν τῇ ζωῇ ὑμῶν
  choice: अपने जीवन में
  rationale: यूनानी पूर्वसर्गीय पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πονηρὰ
  choice: बुरी बातें
  rationale: वस्तुवाचक बहुवचन को ἀγαθὰ के समानांतर रखा गया और अनावश्यक रूप से ‘पाप’ जैसे अधिक विशिष्ट धार्मिक शब्द से नहीं बदला गया।
- source_word: πᾶσαν ταραχὴν καὶ θλίψιν
  choice: हर प्रकार की उथल-पुथल और क्लेश
  rationale: πᾶσαν के व्यापक बल को ‘हर प्रकार की’ से व्यक्त किया; ταραχή के लिए अव्यवस्था/व्याकुलता दोनों का संकेत देने वाला ‘उथल-पुथल’ और θλῖψις के लिए गरिमापूर्ण ‘क्लेश’ चुना।
- source_word: θερίσετε
  choice: काटोगे
  rationale: बोने-काटने के कृषि-रूपक को सुरक्षित रखा गया; ‘फल पाओगे’ कहने से मूल बिंब कमजोर पड़ता।
theological_decisions:
- issue: बोने और काटने के नैतिक प्रतिफल का स्वरूप
  choice: वचन को उसके सामान्य कारण-परिणाम रूप में रखा गया
  alternative: इसे केवल अंतिम न्याय या दैवी दंड के स्पष्ट संदर्भ के रूप में अनूदित करना
  rationale: यूनानी पाठ यह निश्चित नहीं करता कि प्रतिफल इसी जीवन में, अंतिम न्याय में, या दोनों में है; अनुवाद ने इस तनाव को नहीं सुलझाया।
- issue: ψυχαῖς का अर्थ-क्षेत्र
  choice: प्राणों
  alternative: मन में / आत्माओं में
  rationale: ‘मन’ अर्थ को मानसिक क्षेत्र तक संकुचित कर सकता है, जबकि ‘आत्मा’ अधिक सिद्धान्तगत अर्थ ग्रहण कर सकता है; ‘प्राण’ व्यक्ति के भीतरी जीवन का अपेक्षाकृत व्यापक संकेत देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। ‘बोओ—काटोगे’ का मूल रूपक और दोनों वाक्यों की समानांतर संरचना सुरक्षित है।
