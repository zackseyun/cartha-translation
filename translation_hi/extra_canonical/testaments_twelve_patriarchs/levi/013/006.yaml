revisions:
- from: और अपने प्राणों में अच्छी बातें बोओ, तो उन्हें अपने जीवन में पाओगे। पर यदि तुम बुरी बातें बोओगे, तो हर प्रकार की उथल-पुथल और क्लेश काटोगे।
  to: और अपने भीतर भलाई बोओ, और उसे अपने जीवन में पाओगे। पर यदि तुम बुराई बोओगे, तो हर प्रकार की उथल-पुथल और क्लेश काटोगे।
  rationale: The revision replaces speech-specific “बातें” with broad moral abstractions that work naturally with the sowing metaphor and preserves the parallelism of ἀγαθά and πονηρά. “अपने भीतर” provides a modern, nontechnical rendering of ψυχαῖς, while “काटोगे” retains θερίσετε’s harvest image.
