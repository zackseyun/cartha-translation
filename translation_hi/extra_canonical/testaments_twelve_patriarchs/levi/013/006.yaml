review_pass:
  verdict: revise
  source_fidelity: Draft preserves the imperative/future structure, the sowing-and-reaping imagery, and the broad contrast of good and evil. However, “अच्छी बातें/बुरी बातें” normally means good/bad words or remarks in Hindi, which is too narrow and does not naturally function as the object of “बोओ.”
  naturalness: “अपने प्राणों में” is understandable but is elevated and less idiomatic for the inward moral sense in modern standard Hindi. “अपने भीतर” is broad, natural, and avoids imposing a technical doctrinal sense. “उथल-पुथल और क्लेश” is acceptable and retains the twofold consequence.
  terminology: Use “भलाई” and “बुराई” for the substantival neuter plurals ἀγαθά and πονηρά. This keeps the moral breadth without introducing the more specific term “पाप.”
  issues:
  - severity: medium
    issue: “अच्छी बातें/बुरी बातें” is semantically and idiomatically unsuitable.
    rationale: In contemporary Hindi, “बातें” chiefly denotes speech, statements, or topics. The Greek substantival adjectives denote good/evil things broadly, and the agricultural metaphor calls for a more natural moral object such as “भलाई/बुराई.”
  - severity: low
    issue: “प्राणों में” is less natural for the intended inward ethical sense.
    rationale: Although it can represent ψυχαῖς, “प्राण” commonly evokes life-breath or life itself in modern Hindi. “अपने भीतर” retains the text's broad inward sense without narrowing it to intellect or requiring a doctrinal reading.
  revised_text: और अपने भीतर भलाई बोओ, और उसे अपने जीवन में पाओगे। पर यदि तुम बुराई बोओगे, तो हर प्रकार की उथल-पुथल और क्लेश काटोगे।
  revised_footnotes: []
  revision_rationale: The revision replaces speech-specific “बातें” with broad moral abstractions that work naturally with the sowing metaphor and preserves the parallelism of ἀγαθά and πονηρά. “अपने भीतर” provides a modern, nontechnical rendering of ψυχαῖς, while “काटोगे” retains θερίσετε’s harvest image.
