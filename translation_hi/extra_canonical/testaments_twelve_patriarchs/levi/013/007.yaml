id: T12P.LEV.13.7
reference: Testament of Levi 13:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Σοφίαν κτήσασθε³⁵ *ἐν φόβῳ³⁶ Θεοῦ³⁷, ὅτι³⁸ ἐὰν *γένηται αἰχμαλωσία, καὶ ὀλοθρευθῶσι πόλεις καὶ χῶραι³⁹ *καὶ χρυσὸς καὶ ἄργυρος καὶ πᾶσα⁴⁰ κτῆσις⁴¹ ἀπολεῖται⁴², *τοῦ σοφοῦ τὴν σοφίαν⁴³ †οὐδεὶς⁴⁴ δύναται⁴⁵ ἀφελέσθαι⁴⁶ εἰ μὴ τύφλωσις⁴⁷ ἀσεβείας⁴⁸ καὶ πώρωσις⁴⁹ ἁμαρτίας⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/007.yaml
  text: Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perish, no one can take away the wise man's wisdom, except the blindness of ungodliness and the hardening of sin.
translation:
  language: hi
  text: परमेश्वर के भय में बुद्धि प्राप्त करो, क्योंकि यदि बंधुआई आ पड़े, नगर और प्रदेश नष्ट कर दिए जाएँ, और सोना, चाँदी तथा सारी संपत्ति मिट जाए, तो बुद्धिमान की बुद्धि को कोई नहीं छीन सकता—सिवाय अधार्मिकता के अंधेपन और पाप की कठोरता के।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοφίαν κτήσασθε
  choice: बुद्धि प्राप्त करो
  rationale: कτήσασθε अर्जित करने या अपने लिए प्राप्त करने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए मूल आज्ञा को बनाए रखता है।
- source_word: ἐν φόβῳ Θεοῦ
  choice: परमेश्वर के भय में
  rationale: मूल के औपचारिक और धार्मिक भाव को सुरक्षित रखा गया है; इसे केवल ‘श्रद्धा’ कहकर भय के वास्तविक अर्थ को कम नहीं किया गया।
- source_word: αἰχμαλωσία
  choice: बंधुआई
  rationale: यह युद्धजनित बंदी बनाए जाने या निर्वासन की सामूहिक दशा को व्यक्त करता है, केवल व्यक्तिगत कैद को नहीं।
- source_word: πόλεις καὶ χῶραι
  choice: नगर और प्रदेश
  rationale: χῶραι का अर्थ देश, भूभाग या प्रदेश हो सकता है; ‘प्रदेश’ इस व्यापक स्थानिक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: πᾶσα κτῆσις
  choice: सारी संपत्ति
  rationale: κτῆσις यहाँ अर्जित या स्वामित्व वाली वस्तुओं के सामूहिक अर्थ में है।
- source_word: τύφλωσις ἀσεβείας
  choice: अधार्मिकता का अंधापन
  rationale: τύφλωσις के अंधा कर देने वाले भाव और ἀσέβεια की ईश्वर-विरोधी/धर्महीन प्रवृत्ति को संक्षिप्त रूप में रखा गया है।
- source_word: πώρωσις ἁμαρτίας
  choice: पाप की कठोरता
  rationale: πώρωσις कठोर या संवेदनहीन हो जाने को सूचित करता है; मूल में ‘हृदय’ न होने के कारण उसे जोड़ा नहीं गया।
theological_decisions:
- issue: बुद्धि को छीन सकने वाले अपवाद का आशय
  choice: ‘सिवाय अधार्मिकता के अंधेपन और पाप की कठोरता के’ को प्रत्यक्ष अपवाद के रूप में रखा गया
  alternative: इसे ‘यदि मनुष्य अधार्मिकता से अंधा और पाप से कठोर न हो जाए’ जैसे व्याख्यात्मक वाक्य में बदलना
  rationale: यूनानी वाक्य अपवाद को संक्षिप्त और कुछ हद तक तनावपूर्ण ढंग से व्यक्त करता है। अनुवाद यह तय नहीं करता कि ये बाहरी शक्तियाँ हैं, आंतरिक दशाएँ हैं, या बुद्धि खोने की नैतिक प्रक्रिया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य की नीतिवचन-सदृश गंभीरता तथा मूल का नैतिक-धार्मिक तनाव सुरक्षित है।
