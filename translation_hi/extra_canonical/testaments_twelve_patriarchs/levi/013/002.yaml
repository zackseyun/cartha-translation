  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘और तुम भी’ मूल के δὲ καὶ ὑμεῖς के बल को रखता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
