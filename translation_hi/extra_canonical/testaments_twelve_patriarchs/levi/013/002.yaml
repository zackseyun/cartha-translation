base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/002.yaml
  text: And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing.
translation:
  language: hi
  text: और तुम भी अपने बच्चों को अक्षर-ज्ञान सिखाओ, ताकि वे परमेश्वर की व्यवस्था को निरन्तर पढ़ते हुए अपने पूरे जीवन में समझ-बूझ रखें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράμματα
  choice: अक्षर-ज्ञान
  rationale: यहाँ शब्द का आशय केवल अलग-अलग अक्षरों से नहीं, बल्कि पढ़ने-लिखने की शिक्षा से है; ‘अक्षर-ज्ञान’ इसे स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: σύνεσιν
  choice: समझ
  rationale: ग्रीक शब्द बोध और विवेकपूर्ण समझ को सूचित करता है; सामान्य आधुनिक हिन्दी में ‘समझ’ उपयुक्त है।
- source_word: ἐν πάσῃ τῇ ζωῇ αὐτῶν
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘उनके समस्त जीवन में’ है; ‘जीवन भर’ उसी कालगत विस्तार को सहज हिन्दी में रखता है।
- source_word: ἀναγινώσκοντες ἀδιαλείπτως
  choice: निरन्तर पढ़ते रहें
  rationale: वर्तमान कृदन्त और ‘बिना रुके’ के भाव को सतत अभ्यास के रूप में व्यक्त करता है, न कि अक्षरशः हर क्षण पढ़ने के रूप में।
- source_word: τὸν νόμον τοῦ Θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: ‘व्यवस्था’ νόμος का स्थापित और प्रसंगानुकूल धार्मिक अनुवाद है, जो दैवी नियम/तोरा के अर्थ को बनाए रखता है।
theological_decisions:
- issue: अक्षर-ज्ञान, समझ और परमेश्वर की व्यवस्था के अध्ययन का संबंध
  choice: ग्रीक वाक्य की आशयगत कड़ी को बनाए रखते हुए शिक्षा को जीवन भर की समझ और निरन्तर पठन की ओर उन्मुख किया गया है।
  alternative: इसे इस प्रकार कहना कि केवल व्यवस्था पढ़ने से ही अपने-आप समझ प्राप्त होती है।
  rationale: मूल कृदन्तीय रचना संबंध को कुछ खुला रखती है; अनुवाद को कोई कठोर कारणात्मक धार्मिक दावा नहीं जोड़ना चाहिए।
