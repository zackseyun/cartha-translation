  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘व्यवस्था’, ‘याजकपद’, ‘वेदियाँ’, ‘परमप्रधान’ और ‘निर्दोष लहू का दोष अपने सिर पर लेना’ जैसे पद मूल के धार्मिक तथा न्यायिक स्वर को बनाए रखते हैं। पद 3 की असहजता को अत्यधिक सहज बनाकर उसकी पाठगत और धर्मवैज्ञानिक अनिश्चितता नहीं मिटाई गई।
