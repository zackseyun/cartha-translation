  source_fidelity: संशोधन आवश्यक है। πλανηθήσεσθε भविष्यकालीन कर्मवाच्य है; इसलिए ‘भटकते रहोगे’ की अपेक्षा ‘भटकाए जाओगे’ अधिक निकट है। ἀναδεχόμενοι के साथ ‘निर्दोष लहू’ है, ‘लहू का दोष’ नहीं; अतिरिक्त ‘दोष’ हटाया गया है। अंतिम वाक्य में αὐτός का संदर्भ अनिर्णीत रखा गया है।
  naturalness: ‘दुष्ट विकृति में’ और ‘तितर-बितर होने के लिए ठहरोगे’ आधुनिक मानक हिन्दी में कुछ असहज हैं। उन्हें क्रमशः ‘बुरी कुटिलता में’ और ‘शाप के लिए और तितर-बितर होने के लिए’ किया गया है। ‘उसके कद को न जानते हुए’ वाक्य-विन्यास भी अधिक स्वाभाविक है।
  terminology: ‘याजकपद’, ‘वेदियाँ’, ‘व्यवस्था’, ‘परमप्रधान’, ‘धर्मी’ और ‘निर्दोष लहू’ मूल के धार्मिक एवं न्यायिक रजिस्टर के अनुकूल हैं। καινοποιοῦντα νόμον की असहजता को ‘व्यवस्था को नया करनेवाले’ में रखा गया है; इसे किसी निश्चित धार्मिक पहचान में नहीं बदला गया।
