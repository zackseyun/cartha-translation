  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016.yaml
  text: 'And now I know that for seventy weeks you will go astray[a], and you will profane the priesthood and defile the altars. And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.


    And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his stature, taking innocent blood upon your heads in wickedness.


    But I tell you that because of him your holy places will be laid waste to the ground. And no clean place will remain for you, but you will be among the nations of the earth for a curse and for scattering[b][a][a], until he himself visits again and shows compassion and receives you.'
translation:
  language: hi
  text: '16 अब मैं जानता हूँ कि सत्तर सप्ताहों तक तुम भटकाए जाओगे; तुम याजकपद को अपवित्र करोगे और वेदियों को अशुद्ध करोगे। 2 तुम व्यवस्था को ठुकरा दोगे और बुरी कुटिलता में भविष्यद्वक्ताओं के वचनों को तुच्छ जानोगे। तुम धर्मी जनों को सताओगे, भक्तों से घृणा करोगे और सच्चे लोगों के वचनों से घिन करोगे।


    3 और परमप्रधान की सामर्थ्य में व्यवस्था को नया करनेवाले एक मनुष्य को तुम भरमानेवाला कहोगे[a]। अंत में तुम उसे मार डालने के लिए टूट पड़ोगे; उसके कद[b] को न जानते हुए, तुम दुष्टता से निर्दोष लहू अपने सिरों पर ले लोगे।


    4 पर मैं तुमसे कहता हूँ कि उसके कारण तुम्हारे पवित्र स्थान भूमि तक उजाड़ दिए जाएँगे। 5 तुम्हारे लिए कोई शुद्ध स्थान नहीं रहेगा; बल्कि तुम अन्यजातियों के बीच शाप के लिए और तितर-बितर होने के लिए रहोगे, जब तक कि वह स्वयं फिर तुम्हारी सुधि न ले, दया न करे और तुम्हें ग्रहण न करे[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य का यूनानी पाठ कठिन है और उसमें पाठ-विक्षोभ के चिह्न हैं। अनुवाद उपलब्ध साक्षी का अनुसरण करता है, पर यह खंड किसी विस्तार या बाद में जोड़े गए अंश को प्रतिबिंबित कर सकता है। ‘व्यवस्था को नया करनेवाला’ का अर्थ ‘व्यवस्था को नई बनानेवाला’ भी हो सकता है, और यह किसी परिवर्तन लानेवाले व्यक्ति के विरुद्ध आरोप के रूप में सुना जा सकता है।
    reason: textual_variant; lexical_alternative
  - marker: b
    text: “कद” शाब्दिक अनुवाद है; इसका भाव “उसकी वास्तविक महत्ता” या “उसकी महिमा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “वह स्वयं फिर तुम्हारी सुधि ले” का कर्ता परमेश्वर समझा जा सकता है, या संभवतः पहले उल्लिखित मनुष्य; यूनानी पाठ किसी एक अर्थ को अनिवार्य नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: सत्तर सप्ताह
  rationale: मूल के काल-सूचक और संभवतः प्रलयदर्शी पदबंध को बिना ‘सत्तर सातकों’ जैसी अस्वाभाविक हिन्दी के अक्षरशः बनाए रखता है।
- source_word: πλανηθήσεσθε
  choice: तुम भटकते रहोगे
  rationale: नैतिक मार्गभ्रष्टता को व्यक्त करता है और इस संभावना को पूरी तरह बंद नहीं करता कि वे बहकाए भी गए हों।
- source_word: ἱερωσύνην βεβηλώσετε
  choice: याजकपद को अपवित्र करोगे
  rationale: ἱερωσύνη का संस्थागत और धार्मिक अर्थ बनाए रखते हुए cultic उल्लंघन को स्पष्ट करता है।
- source_word: θυσιαστήρια μιανεῖτε
  choice: वेदियों को अशुद्ध करोगे
  rationale: बहुवचन को बनाए रखता है और धार्मिक अशुद्धि का स्वाभाविक हिन्दी रूप देता है।
- source_word: τὸν νόμον ἀθετήσετε
  choice: व्यवस्था को ठुकरा दोगे
  rationale: कानून को केवल टालने नहीं, बल्कि अस्वीकार करने की शक्ति व्यक्त करता है; बाद की तकनीकी धर्मवैज्ञानिक भाषा से बचता है।
- source_word: ἐν διαστροφῇ κακῇ
  choice: दुष्ट विकृति में
  rationale: मूल के टेढ़ेपन, भ्रष्टता और नैतिक विकृति के भाव को सामान्य क्रिया-विशेषण में समतल नहीं करता।
- source_word: εὐσεβεῖς
  choice: भक्तों
  rationale: आधुनिक पाठक के लिए सहज रहते हुए ईश्वरभक्ति और धर्मनिष्ठा का भाव देता है।
- source_word: ἀληθινῶν λόγους
  choice: सत्य बोलनेवालों के वचन
  rationale: संक्षिप्त यूनानी रचना में निहित व्यक्तियों और उनके कथनों—दोनों को हिन्दी में स्पष्ट किंतु अनिर्णायक ढंग से व्यक्त करता है।
- source_word: ἄνδρα καινοποιοῦντα νόμον
  choice: जो मनुष्य ... व्यवस्था को नया करता है
  rationale: καινοποιέω के ‘नया करने’ के भाव को सुरक्षित रखता है और ‘सुधारक’ जैसी अधिक व्याख्यात्मक पदवी से बचता है।
- source_word: ἐν δυνάμει ὑψίστου
  choice: परमप्रधान की सामर्थ्य में
  rationale: दिव्य उपाधि तथा ἐν की निकट संरचना को बनाए रखता है, बिना यह निश्चित किए कि भाव केवल साधन का है।
- source_word: τὸ ἀνάστημα
  choice: उसके कद
  rationale: शाब्दिक देहगत अर्थ को मुख्य पाठ में रखता है; संभावित रूपक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐπισκέψηται
  choice: आकर सुधि न ले
  rationale: ἐπισκέπτομαι में निहित ‘भेंट/निरीक्षण/देखभाल’ के व्यापक भाव को स्वाभाविक धार्मिक हिन्दी में व्यक्त करता है।
- source_word: προσδέξηται
  choice: तुम्हें अपना न ले
  rationale: स्वीकार करने और अनुग्रहपूर्वक ग्रहण करने के संबंधपरक भाव को सरल हिन्दी में देता है।
theological_decisions:
- issue: व्यवस्था को नया करनेवाले मनुष्य और उसकी हत्या से संबंधित पाठ की पाठालोचनात्मक जटिलता
  choice: खंड को मुख्य पाठ में रखा गया और कठिनता को पादटिप्पणी में स्पष्ट किया गया।
  alternative: खंड को बाद का विस्तार मानकर छोड़ देना, अथवा उसे स्पष्ट रूप से मसीही भाषा में प्रस्तुत करना।
  rationale: प्रदत्त यूनानी साक्षी में खंड उपस्थित है। उसे चुपचाप हटाना या किसी विशिष्ट धर्मवैज्ञानिक पहचान में बाँधना मूल साक्ष्य और उसकी अनिश्चितता—दोनों को दबा देता।
- issue: καινοποιοῦντα νόμον का अर्थ
  choice: ‘व्यवस्था को नया करता है’
  alternative: ‘व्यवस्था का सुधार करता है’ या ‘नई व्यवस्था बनाता है’
  rationale: यह रूप मूल की अर्थगत असहजता और संभावित विरोधी आरोप को सुरक्षित रखता है; न तो व्यक्ति को स्वतः विधि-सुधारक घोषित करता है, न नई व्यवस्था का संस्थापक।
- issue: अंतिम αὐτός का संदर्भ
  choice: ‘वह स्वयं’ कहकर संदर्भ खुला रखा गया।
  alternative: इसे स्पष्ट रूप से परमेश्वर अथवा पहले उल्लिखित मनुष्य कहना।
  rationale: यूनानी सर्वनाम किसी एक संदर्भ को निर्णायक रूप से बाध्य नहीं करता; इसलिए मुख्य पाठ में धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
- issue: ‘उसके कारण’ (δι᾽ αὐτόν) का संदर्भ
  choice: सर्वनाम को ‘उसके कारण’ ही रखा गया।
  alternative: उसे परमेश्वर, मारे जानेवाले मनुष्य, या उसकी हत्या के कारण के रूप में स्पष्ट करना।
  rationale: निकटतम व्याकरणिक संदर्भ मनुष्य है, पर पाठ की जटिलता के कारण कारण-संबंध को अधिक विशिष्ट बनाना अनुचित होता।
