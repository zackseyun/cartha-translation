lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: विवाह किया
  rationale: यह यूनानी मुहावरा विवाह करने के अर्थ में है। आधुनिक हिन्दी में ‘विवाह किया’ स्वाभाविक और स्पष्ट है; शाब्दिक ‘पत्नी ली’ अनावश्यक रूप से पुरातन और असहज लगेगा।
- source_word: ἐν γῇ παροικίας
  choice: परदेश में प्रवासी होकर
  rationale: παροικία किसी देश में बाहरी या अस्थायी निवासी के रूप में रहने को सूचित करता है। यह अभिव्यक्ति उस अर्थ को स्पष्ट रखती है और निर्वासन का अधिक कठोर अर्थ नहीं थोपती।
- source_word: πρώτῃ τάξει
  choice: प्रथम श्रेणी
  rationale: τάξις पद, क्रम या श्रेणी को सूचित कर सकता है। ‘प्रथम श्रेणी’ उसकी स्थिति या प्रधानता से जुड़ी अस्पष्टता को बनाए रखता है।
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: सूर्योदय की ओर
  rationale: शाब्दिक अर्थ ‘सूर्य के उदय की ओर’ है। यह दिशा और सूर्योदय—दोनों संभावित भावों को ‘पूर्व की ओर’ की तुलना में अधिक निकटता से सुरक्षित रखता है।
- source_word: ἐν ὑψηλοῖς
  choice: ऊँचाइयों पर
  rationale: यह पद ऊँचे या संभवतः स्वर्गीय स्थानों का संकेत देता है। ‘ऊँचाइयों पर’ दर्शन की उन्नत छवि को बनाए रखता है, बिना किसी निश्चित ब्रह्मांड-विज्ञान को थोपे।
- source_word: συναγωγῆς
  choice: सभा
  rationale: यहाँ शब्द एकत्र समुदाय को दर्शाता है। ‘सभा’ आधुनिक हिन्दी में सहज है और धार्मिक समुदाय तथा सामान्य जमाव—दोनों अर्थों के लिए खुला रहता है।
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  choice: महिमा का आरम्भ और मेल
  rationale: नाम की यह व्याख्या पाठ की दृष्टि से कठिन है। अनुवाद उपलब्ध यूनानी के निकट रहते हुए ἀρχή को ‘आरम्भ’, μεγαλείον को ‘महिमा’ और συμβιβασμός को व्यापक ‘मेल’ से व्यक्त करता है।
- source_word: πικριασμός
  choice: कड़वाहट
  rationale: यह इसका सीधा अर्थ है और कठिन प्रसव से जुड़े नामकरण की व्याख्या को सुरक्षित रखता है।
- source_word: ἔνδοξος
  choice: प्रतिष्ठित
  rationale: शब्द सम्मानित या विशिष्ट माने जाने का भाव देता है। ‘प्रतिष्ठित’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: गेर्शाम और कहात के विषय में लेवी के दर्शनों का आशय
  choice: दर्शनों को पुत्रों की सापेक्ष स्थिति के बारे में संक्षिप्त भविष्यदर्शी कथनों के रूप में रखा गया है।
  alternative: इन्हें बाद की लेवीय याजकीय पदानुक्रम का स्पष्ट पूर्वसंकेत मानना, या केवल पारिवारिक प्रतीक समझना।
  rationale: यूनानी पाठ पद और ऊँचाई की छवियाँ देता है, पर उनका पूरा ऐतिहासिक या याजकीय अर्थ स्पष्ट नहीं करता। अनुवाद इस तनाव को व्याख्यात्मक विस्तार के बिना बनाए रखता है।
- issue: कहात के नाम की व्याख्या
  choice: पाठ की कठिनता को मुख्य अनुवाद में निकट अर्थ और पादटिप्पणी द्वारा दर्शाया गया है।
  alternative: वाक्यांश को किसी निश्चित याजकीय या मसीही अर्थ के अनुसार सुगम बनाना।
  rationale: उपलब्ध यूनानी साक्ष्य अस्पष्ट है; किसी विशेष धार्मिक परंपरा की व्याख्या थोपना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। वाक्य-विन्यास को हिन्दी-सुलभ बनाया गया है, जबकि दर्शन, नामकरण और कालक्रम की मूल संरचना सुरक्षित है। नामों के रूप हिन्दी बाइबलीय प्रचलन और यूनानी रूपों के संतुलन से चुने गए हैं।
