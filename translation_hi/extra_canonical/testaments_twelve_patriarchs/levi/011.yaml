  text: 1[a]. When I took a wife, I was twenty-eight years old, and her name was Melcha. 2. And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning. 3. And I saw concerning him that he was not in the first rank. 4. And Kohath was born in the thirty-fifth year of my life, and I saw in a vision, toward the sunrise, 5. that he stood in the midst of the congregation[b], in the heights. 6. Therefore I called his name Kohath, which is, beginning of majesty and assembly. 7. And a third son, Merari, was born to me in the fortieth year of my life; and because his mother bore him with difficulty, I called him Merari, which is bitterness. 8. And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: hi
  text: '**लेवी का वसीयतनामा 11**


    1. जब मैंने विवाह किया, तब मैं अट्ठाईस वर्ष का था। मेरी पत्नी का नाम मेलखा था। 2. वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया। मैंने उसका नाम गेर्शाम रखा, क्योंकि हम परदेश में प्रवासी होकर रह रहे थे। 3. मैंने उसके विषय में देखा कि वह प्रथम श्रेणी में नहीं था। 4. कहात का जन्म मेरे जीवन के पैंतीसवें वर्ष में, सूर्योदय की ओर हुआ। 5. मैंने एक दर्शन में देखा कि वह ऊँचाइयों पर सारी सभा के बीच खड़ा था। 6. इसलिए मैंने उसका नाम कहात रखा, जिसका अर्थ है, “महिमा का आरम्भ और मेल।”[a] 7. मेरे जीवन के चालीसवें वर्ष में मेरे तीसरे पुत्र मरारी का जन्म हुआ। उसकी माता को उसे जन्म देने में कठिनाई हुई थी, इसलिए मैंने उसका नाम मरारी रखा, जिसका अर्थ है, “कड़वाहट।” 8. मेरे जीवन के चौंसठवें वर्ष में योकेबेद का जन्म मिस्र में हुआ; क्योंकि उस समय मैं अपने भाइयों के बीच प्रतिष्ठित था।[b]


    [a] कहात के नाम के साथ जुड़ा यह व्याख्यात्मक वाक्यांश यूनानी साक्ष्य में पाठ की दृष्टि से कठिन है। यहाँ उपलब्ध अर्थ को बनाए रखा गया है और पाठ को अनुमान से अधिक सुगम बनाने का प्रयास नहीं किया गया है।


    [b] इस पद के आसपास यूनानी साक्ष्य के कुछ पाठांश संक्षिप्त या अस्थिर हैं। मुख्य कथन स्पष्ट है कि योकेबेद का जन्म मिस्र में लेवी के जीवन के चौंसठवें वर्ष में हुआ था।'
