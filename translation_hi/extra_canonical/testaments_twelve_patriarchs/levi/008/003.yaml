translation:
  language: hi
  text: और उनमें से हर एक कुछ लिए हुए था, और उन्होंने उसे मुझ पर रखा और मुझसे कहा, “अब से याजक बन जा—तू और तेरा सारा वंश।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάζοντες
  choice: कुछ उठाए हुए था
  rationale: यूनानी पाठ में क्रिया का कर्म स्पष्ट नहीं है; इसलिए अस्पष्टता बनाए रखते हुए स्वाभाविक हिन्दी में ‘कुछ’ जोड़ा गया है।
- source_word: ἐπέθηκαν μοι
  choice: उन्होंने वह मुझ पर रखा
  rationale: ἐπιτίθημι का यहाँ मूल अर्थ किसी वस्तु को किसी व्यक्ति पर रखना है; ‘वह’ पहले उल्लिखित अनिर्दिष्ट वस्तु की ओर संकेत करता है।
- source_word: ἱερέα
  choice: याजक
  rationale: धार्मिक पद के लिए प्रचलित और गरिमापूर्ण हिन्दी बाइबलीय शब्द।
- source_word: σπέρμα
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ सामूहिक भाव में भावी संतति अभिप्रेत है; आधुनिक हिन्दी में ‘वंश’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: याजकत्व का लेवी और उसकी संतति तक विस्तार
  choice: “तू और तेरा सारा वंश” के रूप में सामूहिक और भावी विस्तार बनाए रखा
  alternative: “तू और तेरी सारी संतान”
  rationale: σπέρμα सामूहिक एकवचन है और वंशगत निरंतरता व्यक्त करता है; ‘वंश’ उस धर्मवैचारिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: आदेशात्मक γενοῦ का स्वर
  choice: “याजक बन जा”
  alternative: “याजक हो जा”
  rationale: γενοῦ परिवर्तन या नियुक्ति का आदेश देता है; ‘बन जा’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है, बिना यह तय किए कि नियुक्ति का अनुष्ठान इसी क्षण पूर्ण हुआ।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल में कर्म के अनुल्लेख से उत्पन्न अस्पष्टता ‘कुछ’ द्वारा सुरक्षित रखी गई है। संबोधन एकवचन और निकट है, इसलिए ‘तू’ तथा ‘बन जा’ रखा गया है।
