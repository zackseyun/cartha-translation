lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: पाँचवें ने
  rationale: क्रमसूचक विशेषण यहाँ पहले से उल्लिखित व्यक्ति के लिए संज्ञा के रूप में प्रयुक्त है; हिन्दी में यही स्वाभाविक रूप है।
- source_word: κλάδον
  choice: डाल
  rationale: जैतून के पेड़ की शाखा के लिए सरल और स्वाभाविक हिन्दी शब्द।
- source_word: ἐλαίας
  choice: जैतून
