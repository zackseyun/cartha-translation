  text: Καὶ⁶⁸ ὁ πρῶτος κλῆρος ἔσται μέγας· καὶ ὑπὲρ αὐτὸν οὐ γενήσεται ἕτερος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/012.yaml
  text: And the first lot will be great, and no other will arise above it.
translation:
  language: hi
  text: और पहला भाग महान होगा, और उसके ऊपर कोई दूसरा नहीं आएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλῆρος
  choice: भाग
  rationale: यहाँ शब्द किसी व्यक्ति को मिले नियत हिस्से, पद या क्रम को सूचित करता है। ‘चिट्ठी’ शाब्दिक तो है, पर इस प्रसंग में आधुनिक हिन्दी पाठक के लिए भ्रमकारी हो सकती है; ‘भाग’ अर्थ की व्यापकता बनाए रखता है।
- source_word: μέγας
  choice: महान
  rationale: ‘महान’ μέγας के महत्व और श्रेष्ठता—दोनों संभावित आयामों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὑπὲρ αὐτὸν
  choice: उससे ऊपर
  rationale: यूनानी स्थानिक-तुलनात्मक अभिव्यक्ति को जानबूझकर निकटता से रखा गया है, ताकि इसे केवल ‘उससे बड़ा’ कहकर अर्थ सीमित न किया जाए।
- source_word: οὐ γενήσεται ἕτερος
  choice: कोई दूसरा नहीं होगा
  rationale: γενήσεται को स्वाभाविक हिन्दी में ‘होगा’ और ἕτερος को स्पष्ट रूप से ‘दूसरा’ कहा गया है; भाव यह है कि उसके ऊपर कोई अन्य अस्तित्व में नहीं आएगा।
theological_decisions:
- issue: ‘पहले भाग’ की पहचान और श्रेष्ठता का स्वरूप
  choice: पाठ में पहचान या सिद्धान्तगत व्याख्या जोड़े बिना ‘पहला भाग’ और ‘उससे ऊपर’ रखा गया।
  alternative: इसे किसी विशिष्ट याजकीय पद, व्यक्ति या ‘उससे महान’ के रूप में स्पष्ट करना।
  rationale: इस एक वाक्य में κλῆρος की सटीक पहचान और ὑπέρ की श्रेष्ठता का प्रकार पूर्णतः स्पष्ट नहीं है; अनुवाद मूल की संभावित व्यापकता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल यूनानी की दो समन्वित उपवाक्यीय संरचना के निकट अनुवाद। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
