translation:
  language: hi
  text: और पहले ने पवित्र तेल से मेरा अभिषेक किया और मुझे एक दंड दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: पहले ने
  rationale: मूल पाठ में विशेषण संज्ञा के रूप में प्रयुक्त है और संदर्भित व्यक्तियों में ‘पहले’ को दर्शाता है; अनावश्यक रूप से ‘पहला याजक’ या अन्य पहचान नहीं जोड़ी गई।
- source_word: ἤλειψέν με ἐλαίῳ ἁγίῳ
  choice: पवित्र तेल से मेरा अभिषेक किया
  rationale: ‘तेल लगाया’ मूल क्रिया का सामान्य अर्थ हो सकता है, पर पवित्र तेल और अनुष्ठानिक संदर्भ के कारण ‘अभिषेक किया’ स्वाभाविक और अर्थानुकूल है।
- source_word: ῥάβδον
  choice: एक दंड
  rationale: ग्रीक शब्द छड़ी, दंड या राजदंड का अर्थ दे सकता है। ‘दंड’ गरिमापूर्ण और संदर्भानुकूल है, जबकि मूल में स्पष्ट रूप से ‘याजकीय’ नहीं है, इसलिए वह विशेषण नहीं जोड़ा गया।
theological_decisions:
- issue: दंड की याजकीय पहचान
  choice: केवल ‘दंड’
  alternative: ‘याजकीय दंड’
  rationale: मूल यूनानी में ῥάβδον के साथ ‘याजकीय’ विशेषण नहीं है। प्रसंग इसका याजकीय संबंध सुझा सकता है, पर अनुवाद में उसे स्पष्ट रूप से जोड़ना मूल की अर्थ-सीमा को संकुचित करेगा।
