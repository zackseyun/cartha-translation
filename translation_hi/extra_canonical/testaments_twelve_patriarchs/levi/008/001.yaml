  text: And there again I saw a vision like the former one, after we had spent seventy days there.
translation:
  language: hi
  text: और वहाँ मैंने फिर पहले जैसा एक दर्शन देखा। यह तब हुआ जब हम वहाँ सत्तर दिन बिता चुके थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖ πάλιν
  choice: और वहाँ मैंने फिर
  rationale: संयुक्त पद Κἀκεῖ (‘और वहाँ’) तथा πάλιν (‘फिर’) दोनों के अर्थ को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: εἶδον ὅραμα
  choice: मैंने ... एक दर्शन देखा
  rationale: यूनानी में दर्शन देखने की सीधी अभिव्यक्ति है; हिन्दी में भी ‘दर्शन देखा’ प्रसंगानुकूल और स्पष्ट है।
- source_word: ὡς τὸ πρότερον
  choice: पहले जैसा
  rationale: पूर्व दर्शन से समानता व्यक्त होती है; ‘पहले जैसा’ सामान्य पाठक के लिए सहज है और किसी अतिरिक्त व्याख्या को नहीं जोड़ता।
- source_word: μετὰ τὸ ποιῆσαι ἡμᾶς ἐκεῖ ἡμέρας ἑβδομήκοντα
  choice: यह तब हुआ जब हम वहाँ सत्तर दिन बिता चुके थे
  rationale: शाब्दिक रूप से ‘हमारे वहाँ सत्तर दिन करने के बाद’; हिन्दी में ‘सत्तर दिन बिता चुके थे’ समयगत पूर्वता को स्वाभाविक रूप से व्यक्त करता है।
