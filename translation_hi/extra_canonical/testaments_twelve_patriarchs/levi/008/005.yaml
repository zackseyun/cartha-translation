base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/005.yaml
  text: And the second washed me with the Lord's pure water, and fed me holy bread and wine, and put around me a holy and glorious robe.
translation:
  language: hi
  text: और दूसरे ने मुझे प्रभु के शुद्ध जल से धोया, मुझे रोटी और पवित्र दाखमधु खिलाया-पिलाया, और मुझे एक पवित्र और महिमामय वस्त्र पहनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: दूसरे ने
  rationale: क्रम में दूसरे व्यक्ति का स्वाभाविक और संक्षिप्त संकेत; संदर्भ से व्यक्ति स्पष्ट है।
- source_word: ὕδατι κυρίου καθαρῷ
  choice: प्रभु के शुद्ध जल से
  rationale: κυρίου के संबंधकारक अर्थ और καθαρῷ के विशेषण-बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐψώμισέν με ἄρτον καὶ οἶνον ἅγιον
  choice: मुझे पवित्र रोटी और दाखमधु खिलाया
  rationale: क्रिया के भोजन कराने के अर्थ को सामान्य हिन्दी में व्यक्त करता है; ἅγιον को समन्वित रोटी और दाखमधु दोनों से संबंधित समझते हुए रखा गया है।
- source_word: στολὴν ἁγίαν καὶ ἔνδοξον
  choice: एक पवित्र और महिमामय वस्त्र
  rationale: στολή यहाँ विशिष्ट परिधान/लंबे वस्त्र को सूचित करता है; सामान्य पाठक के लिए 'वस्त्र' स्पष्ट है और दोनों विशेषण सुरक्षित रहते हैं।
- source_word: περιέθηκε μοι
  choice: मुझे … पहनाया
  rationale: शाब्दिक 'मेरे चारों ओर रखा' की अपेक्षा वस्त्र के संदर्भ में स्वाभाविक हिन्दी क्रिया, बिना आशय बदले।
theological_decisions:
- issue: पवित्र रोटी और दाखमधु की संभावित संस्कारात्मक प्रतिध्वनि
  choice: मूल के सीधे शब्दों को रखा गया, बिना किसी संस्कार का नाम जोड़े
  alternative: इसे स्पष्ट रूप से प्रभुभोज या किसी अन्य धार्मिक संस्कार से जोड़ना
  rationale: यूनानी पाठ ऐसी व्याख्या की संभावना रख सकता है, पर स्वयं उसका स्पष्ट नाम नहीं देता; इसलिए धार्मिक तनाव और संभावित संकेत को खुला रखा गया है।
- issue: κυρίου संबंधकारक का अर्थ
  choice: प्रभु के शुद्ध जल
  alternative: प्रभु से प्राप्त शुद्ध जल / प्रभु का पवित्र करने वाला जल
  rationale: सरल संबंधकारक को बनाए रखकर स्रोत, स्वामित्व या गुण की संभावित सूक्ष्मताओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। वाक्य की क्रमिक संरचना—धोना, खिलाना, पहनाना—यूनानी स्रोत के अनुरूप रखी गई है।
