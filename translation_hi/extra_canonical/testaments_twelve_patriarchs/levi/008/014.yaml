id: T12P.LEV.8.14
reference: Testament of Levi 8:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ὁ δὲ⁷⁵ τρίτος *ἐπικληθήσεται αὐτῷ ὄνομα καινόν⁷⁶, ὅτι βασιλεὺς †ἐκ τοῦ†⁷⁷ Ἰούδα ἀναστήσεται καὶ ποιήσει *ἱερατείαν νέαν, κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη⁷⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/014.yaml
  text: And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, according to the pattern of the nations, for all the nations.
translation:
  language: hi
  text: और तीसरे का एक नया नाम रखा जाएगा, क्योंकि यहूदा से एक राजा उठेगा[a] और वह सभी राष्ट्रों के लिए, राष्ट्रों के प्रतिरूप के अनुसार, एक नई याजक-व्यवस्था स्थापित करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहूदा से’ के लिए यूनानी पाठ की शब्दावली पाठ-समीक्षात्मक रूप से अनिश्चित है।
    reason: स्रोत संस्करण में †ἐκ τοῦ† को क्रक्स चिह्नों से चिह्नित किया गया है; मुख्य पाठ में सर्वाधिक संभावित अर्थ रखा गया और अनिश्चितता पादटिप्पणी में बताई गई।
lexical_decisions:
- source_word: ἐπικληθήσεται αὐτῷ ὄνομα καινόν
  choice: एक नए नाम से पुकारा जाएगा
  rationale: यूनानी निष्क्रिय अभिव्यक्ति का स्वाभाविक हिन्दी रूप; इसमें नया नाम मिलने का भाव बना रहता है।
- source_word: βασιλεὺς … Ἰούδα ἀναστήσεται
  choice: यहूदा से एक राजा उठेगा
  rationale: ἀναστήσεται के भविष्यकाल और उदय होने के भाव को बनाए रखता है; Ἰούδα को वंश अथवा क्षेत्र के रूप में स्पष्ट किए बिना मूल की व्यापकता सुरक्षित रखता है।
- source_word: ποιήσει ἱερατείαν νέαν
  choice: एक नई याजक-व्यवस्था स्थापित करेगा
  rationale: ἱερατεία यहाँ केवल किसी एक याजक का पद नहीं, बल्कि याजकत्व अथवा याजकीय व्यवस्था को सूचित करता है; 'स्थापित करेगा' प्रसंग में ποιήσει का स्वाभाविक अर्थ देता है।
- source_word: κατὰ τὸν τύπον τῶν ἐθνῶν
  choice: राष्ट्रों के नमूने के अनुसार
  rationale: τύπος के 'नमूना/प्रतिरूप' और κατὰ के 'के अनुसार' भाव को औपचारिक रूप से सुरक्षित रखा गया है; कठिन और संभावित रूप से तनावपूर्ण कथन को सरल बनाकर दूसरी व्याख्या नहीं थोपी गई।
- source_word: εἰς πάντα τὰ ἔθνη
  choice: सभी राष्ट्रों के लिए
  rationale: εἰς के लक्ष्य अथवा प्रयोजन के भाव को व्यक्त करता है और πάντα τὰ ἔθνη की सार्वभौमिक व्यापकता बनाए रखता है।
theological_decisions:
- issue: नई याजक-व्यवस्था और राष्ट्रों के नमूने के बीच संबंध
  choice: राष्ट्रों के नमूने के अनुसार
  alternative: राष्ट्रों के लिए एक नमूने के अनुसार / अन्यजातियों की रीति के अनुसार
  rationale: मूल यूनानी व्याकरणतः 'राष्ट्रों' को 'नमूने' से जोड़ता है, यद्यपि आशय कठिन है। अनुवाद ने इसे किसी विशेष मसीही अथवा सांप्रदायिक याजकत्व-सिद्धांत के अनुसार पुनर्व्याख्यायित नहीं किया।
- issue: यहूदा से उठने वाले राजा की पहचान
  choice: सिर्फ 'एक राजा'
  alternative: मसीहा-राजा
  rationale: पाठ स्वयं यहाँ राजा को स्पष्टतः 'मसीहा' नहीं कहता; इसलिए संभावित मसीही संकेत को नाम देकर निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। 'याजक-व्यवस्था' को 'याजकत्व' की अपेक्षा अधिक सहज किंतु संस्थागत अर्थ वाला रूप चुना गया। मूल के असामान्य 'राष्ट्रों के नमूने के अनुसार' को जानबूझकर पूरी तरह सहज बनाकर उसकी वास्तविक अस्पष्टता समाप्त नहीं की गई।
