base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/015.yaml
  text: And his appearance is beloved, like a prophet of the Most High, from the seed of Abraham our father.
translation:
  language: hi
  text: और उसका प्रकट होना प्रिय है—मानो परमप्रधान का कोई भविष्यद्वक्ता, जो हमारे पिता अब्राहम के वंश से हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  choice: प्रकट होना
  rationale: इस प्रसंग में यह शब्द केवल भौतिक उपस्थिति नहीं, किसी व्यक्ति के सामने आने या प्रकट होने का भाव देता है; इसलिए स्वाभाविक हिन्दी में ‘प्रकट होना’ चुना गया।
- source_word: ἀγαπητή
  choice: प्रिय
  rationale: स्त्रीलिंग विशेषण παρουσία के साथ है और उसके प्रकट होने को प्रिय या मनोहर बताता है; सरल और सीधा समतुल्य ‘प्रिय’ है।
- source_word: ὡς προφήτης ὑψίστου
  choice: मानो वह परमप्रधान का भविष्यद्वक्ता हो
  rationale: ὡς की तुलनात्मक अस्पष्टता को ‘मानो’ से बनाए रखा गया है; इसे सीधे पहचान-वाक्य में नहीं बदला गया।
- source_word: ἐκ σπέρματος Ἀβραὰμ
  choice: अब्राहम के वंश से
  rationale: σπέρμα का वंशावली-संबंधी अर्थ यहाँ ‘वंश’ से स्वाभाविक और स्पष्ट रूप में व्यक्त होता है।
- source_word: τοῦ πατρὸς ἡμῶν
  choice: हमारे पिता
  rationale: अब्राहम के लिए मूल पाठ का सामुदायिक और आदरपूर्ण संबंध यथावत रखा गया।
theological_decisions:
- issue: ὡς के कारण भविष्यद्वक्ता से संबंध की प्रकृति
  choice: ‘मानो वह ... भविष्यद्वक्ता हो’ द्वारा तुलना बनाए रखी
  alternative: ‘परमप्रधान के भविष्यद्वक्ता के रूप में’ या ‘वह परमप्रधान का भविष्यद्वक्ता है’
  rationale: मूल का ὡς तुलना, रूप-सादृश्य या भूमिका का संकेत दे सकता है; अनुवाद में इसे निश्चित पद-घोषणा बनाना मूल की अस्पष्टता मिटा देता।
- issue: παρουσία का आशय
  choice: ‘प्रकट होना’
  alternative: ‘उपस्थिति’ या ‘आगमन’
  rationale: इस वाक्य में व्यक्ति के दिखाई देने या सामने आने का अर्थ अधिक प्रसंगानुकूल है, जबकि ‘आगमन’ अनावश्यक भावी या पारिभाषिक अर्थ ला सकता है और ‘उपस्थिति’ हिन्दी में कम स्वाभाविक लगती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। मूल यूनानी की संक्षिप्त, कुछ असामान्य वाक्य-संरचना को स्पष्ट हिन्दी के लिए दो समन्वित कथनों में खोला गया है, पर तुलना और वंश-संबंध सुरक्षित रखे गए हैं।
