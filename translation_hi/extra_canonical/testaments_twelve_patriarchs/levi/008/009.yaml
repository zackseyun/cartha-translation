lexical_decisions:
- source_word: Ὁ ἕκτος
  choice: छठे ने
  rationale: पुल्लिंग क्रमवाचक विशेषण यहाँ पूर्वसंदर्भित छठे व्यक्ति के लिए संज्ञा के रूप में प्रयुक्त है।
- source_word: στέφανον
  choice: एक मुकुट
  rationale: यह शब्द मुकुट या विजय-माला को सूचित कर सकता है; संदर्भ के अभाव में स्वाभाविक और व्यापक हिन्दी शब्द ‘मुकुट’ चुना गया है।
- source_word: τῇ κεφαλῇ
  choice: मेरे सिर पर
  rationale: ग्रीक में μοι के साथ यह रचना उस व्यक्ति के सिर को दर्शाती है जिस पर मुकुट रखा गया; हिन्दी में स्वाभाविक रूप ‘मेरे सिर पर’ है।
- source_word: περιέθηκεν
  choice: रखा
  rationale: क्रिया का अर्थ चारों ओर रखना या पहनाना है; मुकुट के साथ सरल आधुनिक हिन्दी में ‘सिर पर रखा’ स्वाभाविक है।
