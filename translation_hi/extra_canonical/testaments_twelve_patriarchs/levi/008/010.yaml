id: T12P.LEV.8.10
reference: Testament of Levi 8:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ⁵⁵ ἕβδομος *διάδημά μοι ἱερατείας περιέθηκεν καὶ⁵⁶ ἐπλήρωσε⁵⁷ τὰς χεῖράς μου θυμιάματος⁵⁸, ὥστε ἱερατεύειν με⁵⁹ Κυρίῳ, *τῷ θεῷ⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/010.yaml
  text: And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.
translation:
  language: hi
  text: और सातवें ने मुझे याजकपद का मुकुट पहनाया और मेरे हाथ धूप से भर दिए, ताकि मैं प्रभु परमेश्वर के लिए याजक का काम करूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάδημα ἱερατείας
  choice: याजकपद का मुकुट
  rationale: διάδημα सिर पर पहनाए जाने वाले राजकीय या प्रतिष्ठासूचक मुकुट को दर्शाता है; संबंधवाचक ἱερατείας उसके याजकपद से जुड़े होने को स्पष्ट करता है।
- source_word: ἐπλήρωσε τὰς χεῖράς μου θυμιάματος
  choice: मेरे हाथ धूप से भर दिए
  rationale: मूल यूनानी के ठोस और संभवतः अभिषेक-संबंधी बिंब को बनाए रखते हुए θυμίαμα का स्वाभाविक हिन्दी रूप ‘धूप’ लिया गया है।
- source_word: ἱερατεύειν
  choice: याजक का काम करूँ
  rationale: क्रिया का अर्थ याजक के रूप में सेवा करना या याजकीय कार्य निभाना है; यह आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: Κυρίῳ, τῷ θεῷ
  choice: प्रभु परमेश्वर के लिए
  rationale: दोनों ईश्वरीय पदों को सुरक्षित रखा गया है और dative को उद्देश्य/सेवा-संबंध के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ἱερατεύειν Κυρίῳ का संबंध
  choice: प्रभु परमेश्वर के लिए याजक का काम करूँ
  alternative: प्रभु परमेश्वर के सामने याजक के रूप में सेवा करूँ
  rationale: यूनानी dative सामान्यतः उस सत्ता को दर्शाता है जिसके लिए याजकीय सेवा की जाती है; ‘के लिए’ इस संबंध को बिना अतिरिक्त स्थानिक अर्थ जोड़े व्यक्त करता है।
- issue: ‘हाथ भरने’ की अभिषेक-संबंधी संभावित तकनीकी अर्थछटा
  choice: शाब्दिक बिंब ‘मेरे हाथ धूप से भर दिए’ सुरक्षित रखा
  alternative: मुझे याजकपद के लिए अभिषिक्त किया
  rationale: पाठ स्वयं हाथों में धूप भरने की क्रिया कहता है; उसके संभावित अनुष्ठानिक अर्थ को व्याख्यात्मक रूप से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजकपद’, ‘मुकुट’ और ‘धूप’ मूल के धार्मिक तथा अनुष्ठानिक स्वर को बनाए रखते हैं।
