id: T12P.LEV.8.16
reference: Testament of Levi 8:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶν οὖν ἐπιθυμητὸν⁸⁶ ἐν Ἰσραὴλ⁸⁷ σοὶ⁸⁸ ἔσται καὶ τῷ σπέρματί σου⁸⁹, καὶ ἔδεσθε⁹⁰ πᾶν ὡραῖον ἐν⁹¹ ὁράσει, καὶ τὴν τράπεζαν Κυρίου διανεμεῖται⁹² τὸ σπέρμα σου⁹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/016.yaml
  text: Therefore every desirable thing in Israel will be for you and for your seed, and you will eat every beautiful thing for the eye, and your seed will apportion the table of the Lord.
translation:
  language: hi
  text: इसलिए इस्राएल की हर वांछनीय वस्तु तुम्हारी और तुम्हारे वंश[a] की होगी। तुम हर वह वस्तु खाओगे जो देखने में सुंदर हो, और तुम्हारा वंश प्रभु की मेज़ का बँटवारा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “बीज”; अर्थात् संतति या वंश।'
    reason: मूल यूनानी σπέρμα की ठोस उपमा और उसके सामूहिक अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: ἐπιθυμητόν
  choice: मनभावनी वस्तु
  rationale: यह शब्द किसी वांछनीय या प्रिय वस्तु को सूचित करता है; ‘मनभावनी’ आधुनिक हिन्दी में उसके आकर्षक और वांछित होने का भाव सहज रूप से रखता है।
- source_word: σπέρμα
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ सामूहिक रूप से भावी संतति अभिप्रेत है; ‘वंश’ स्वाभाविक हिन्दी में उस सामूहिक और पीढ़ीगत अर्थ को बनाए रखता है।
- source_word: πᾶν ὡραῖον ἐν ὁράσει
  choice: हर वह वस्तु ... जो देखने में सुंदर हो
  rationale: ἐν ὁράσει का अर्थ दृश्य रूप या देखने में होना है। यह उपलब्ध यूनानी पाठ का सीधा अर्थ रखता है और असंबद्ध पाठांतर ‘कार्य में’ को नहीं अपनाता।
- source_word: διανεμεῖται
  choice: बँटवारा करेगा
  rationale: क्रिया बाँटने, वितरित करने या भाग निर्धारित करने का भाव देती है। ‘मेज़ का बँटवारा’ मूल की ठोस किंतु कुछ असामान्य अभिव्यक्ति को अनावश्यक व्याख्या के बिना बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु की मेज़’ का आशय
  choice: प्रभु की मेज़
  alternative: प्रभु की मेज़ पर की भेंटें/भाग
  rationale: मूल पाठ केवल τράπεζαν Κυρίου कहता है। इसे बलिदानी भेंटों, याजकीय भागों या किसी विशिष्ट धार्मिक व्यवस्था के रूप में स्पष्ट करना संभावित आशय को पाठ में जोड़ देता; इसलिए मूल की व्यापकता और तनाव सुरक्षित रखा गया है।
- issue: σπέρμα का सामूहिक एकवचन
  choice: तुम्हारा वंश ... करेगा
  alternative: तुम्हारे वंशज ... करेंगे
  rationale: ‘वंश’ मूल के सामूहिक एकवचन को अधिक निकटता से दर्शाता है और भावी संतति के सामूहिक दायित्व को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाक्य की भविष्यकालीन प्रतिज्ञा, ‘देखने में सुंदर’ का दृश्य अर्थ, और ‘प्रभु की मेज़’ की मूल अस्पष्टता सुरक्षित रखी गई है।
