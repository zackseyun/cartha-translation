source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ λέγουσι⁶¹ πρός με· Λευί⁶², εἰς τρεῖς ἀρχὰς διαιρεθήσεται⁶³ τὸ σπέρμα σου⁶⁴, εἰς⁶⁵ σημεῖον⁶⁶ *δόξης Κυρίου ἐπερχομένου⁶⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/011.yaml
  text: And they say to me, “Levi, your seed will be divided into three divisions, as a sign of the glory of the Lord who is coming.”
translation:
  language: hi
  text: और वे मुझसे कहते हैं, “लेवी, तुम्हारा वंश तीन भागों में बाँटा जाएगा, आने वाले प्रभु की महिमा के चिह्न के रूप में।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα σου
  choice: तुम्हारा वंश
  rationale: शाब्दिक अर्थ ‘तुम्हारा बीज’ है, पर वंशजों के सामूहिक अर्थ में आधुनिक हिन्दी का स्वाभाविक और गरिमापूर्ण रूप ‘तुम्हारा वंश’ है।
- source_word: εἰς τρεῖς ἀρχὰς
  choice: तीन प्रधान भागों में
  rationale: ἀρχή में ‘आरम्भ’, ‘प्रधानता/शासन’ या ‘मुख्य विभाग’ का अर्थ हो सकता है। διαιρεθήσεται के साथ ‘प्रधान भाग’ विभाजन का भाव व्यक्त करता है और इसे निश्चित रूप से ‘पदों’ में नहीं बदलता।
- source_word: διαιρεθήσεται
  choice: बाँटा जाएगा
  rationale: यह भविष्यकालीन कर्मवाच्य क्रिया है और विभाजन को सीधे व्यक्त करती है।
- source_word: εἰς σημεῖον
  choice: चिह्न के रूप में
  rationale: यहाँ εἰς परिणाम अथवा भूमिका का संकेत देता है; ‘चिह्न के रूप में’ स्वाभाविक हिन्दी है।
- source_word: δόξης Κυρίου ἐπερχομένου
  choice: आने वाले प्रभु की महिमा
  rationale: ἐπερχομένου को Κυρίου से सम्बद्ध मानते हुए यह रूप ‘उस प्रभु की महिमा जो आ रहा है’ का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ἐπερχομένου का व्याकरणिक सम्बन्ध
  choice: ‘आने वाले’ को ‘प्रभु’ से सम्बद्ध किया गया है
  alternative: ‘आने वाली महिमा’
  rationale: पाठ में ἐπερχομένου पुल्लिंग सम्बन्धकारक एकवचन है और Κυρίου से मेल खाता है, जबकि δόξης स्त्रीलिंग है; इसलिए आने वाला प्रभु है, महिमा नहीं।
- issue: ἀρχάς का संस्थागत अर्थ
  choice: ‘प्रधान भाग’
  alternative: ‘पद’, ‘अधिकार-क्षेत्र’ या केवल ‘भाग’
  rationale: शब्द में प्रधानता अथवा अधिकार का संकेत संभव है, पर पदों की निश्चित धार्मिक व्यवस्था आरोपित करना स्रोत से अधिक विशिष्ट होगा। ‘प्रधान भाग’ इस संकेत और विभाजन—दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। वर्तमानकाल ‘कहते हैं’ ग्रीक λέγουσι के ऐतिहासिक वर्तमान को बनाए रखता है।
