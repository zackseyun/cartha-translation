  text: And the third put on me a linen garment, like an ephod.
translation:
  language: hi
  text: और तीसरे ने मुझे महीन लिनन का एक वस्त्र पहनाया, जो एपोद के समान था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυσσίνην
  choice: मलमल का एक वस्त्र
  rationale: यह शब्द महीन सन से बने उच्च-गुणवत्ता वाले वस्त्र का संकेत देता है; आधुनिक हिन्दी में स्वाभाविक और समझने योग्य रूप में पदार्थ तथा वस्त्र—दोनों भाव व्यक्त किए गए हैं।
- source_word: περιέθηκεν
  choice: पहनाया
  rationale: क्रिया का अर्थ किसी के चारों ओर वस्त्र रखना या उसे पहनाना है; प्रसंग में ‘पहनाया’ सबसे स्वाभाविक है।
- source_word: ἐφούδ
  choice: एपोद
  rationale: यह इब्रानी पुरोहितीय परिधान के यूनानी लिप्यंतरण का हिन्दी रूप है; विशिष्ट धार्मिक वस्तु होने के कारण इसे सामान्य परिधान के रूप में नहीं बदला गया।
- source_word: ὁμοίαν
  choice: के समान था
  rationale: मूल पाठ केवल समानता बताता है, पहचान नहीं; इस भेद को बनाए रखा गया है।
theological_decisions:
- issue: मलमल के वस्त्र और एपोद का संबंध
  choice: वस्त्र को एपोद ‘के समान’ बताया गया
  alternative: वस्त्र को स्वयं एपोद कहना
  rationale: मूल यूनानी ὁμοίαν तुलना व्यक्त करता है; इसलिए दोनों को एक ही वस्तु मानकर पाठ की वास्तविक अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप; ‘एपोद’ जैसे तकनीकी पुरोहितीय शब्द को सुरक्षित रखा गया है।
