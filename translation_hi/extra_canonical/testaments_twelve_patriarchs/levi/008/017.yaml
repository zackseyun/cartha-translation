reference: Testament of Levi 8:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐξ αὐτῶν⁹⁴ ἔσονται ἱερεῖς⁹⁵ καὶ⁹⁶ κριταὶ καὶ⁹⁶ γραμματεῖς· καὶ⁹⁷ ἐπὶ στόματος αὐτῶν †ληφθήσεται⁹⁸ τὸ ἅγιον⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/017.yaml
  text: And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”
translation:
  language: hi
  text: और उन्हीं में से याजक, न्यायी और शास्त्री होंगे; और उनके मुख से पवित्र वस्तु ग्रहण की जाएगी।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ग्रहण की जाएगी” वाला यूनानी शब्द पाठगत रूप से संदिग्ध चिह्नित है; वाक्य का सटीक आशय अनिश्चित है।
    reason: स्रोत संस्करण में ληφθήσεται के चारों ओर क्रक्स (†) है, इसलिए पाठ की वास्तविक कठिनाई पाठक के सामने रखना आवश्यक है।
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: उन्हीं में से
  rationale: समूह के भीतर से उत्पत्ति या चयन का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἱερεῖς
  choice: याजक
  rationale: धार्मिक सेवा-पद के लिए प्रचलित और प्रसंगानुकूल हिन्दी शब्द।
- source_word: κριταὶ
  choice: न्यायी
  rationale: न्याय करने वाले पदाधिकारियों का अर्थ रखता है और ‘न्यायाधीश’ की अपेक्षा प्राचीन प्रसंग में अधिक सहज है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: धार्मिक ग्रंथों तथा व्यवस्था से जुड़े लेखकों/विद्वानों के पारंपरिक अर्थ को बनाए रखता है।
- source_word: ἐπὶ στόματος αὐτῶν
  choice: उनके मुख से
  rationale: यूनानी रूपक को निकटता से सुरक्षित रखता है और वचन अथवा आधिकारिक उच्चारण का संकेत देता है।
- source_word: τὸ ἅγιον
  choice: पवित्र वस्तु
  rationale: नपुंसकलिंग विशेषण के संज्ञात्मक, किंतु अनिर्दिष्ट, अर्थ को किसी खास वस्तु या सिद्धांत के रूप में तय किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: ‘पवित्र’ से अभिप्रेत वस्तु या विषय की पहचान
  choice: पवित्र वस्तु
  alternative: पवित्र वचन / पवित्रता
  rationale: मूल τὸ ἅγιον अस्पष्ट है; अनुवाद उस अस्पष्टता को बनाए रखता है और इसे शास्त्र, बलि, पवित्र पद या किसी अन्य विशिष्ट धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
- issue: भ्रष्ट/संदिग्ध पाठ ληφθήσεται का अर्थ
  choice: ग्रहण की जाएगी
  alternative: स्वीकार किया जाएगा / लिया जाएगा
  rationale: प्राप्त यूनानी पाठ के निष्क्रिय भविष्यकाल को औपचारिक रूप से दर्शाया गया है, जबकि पाठगत अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। वाक्य-संरचना मूल के निकट रखी गई है; ‘मुख से’ और ‘पवित्र वस्तु’ जैसे पद जानबूझकर अस्पष्टता तथा प्राचीन अभिव्यक्ति को सुरक्षित रखते हैं।
