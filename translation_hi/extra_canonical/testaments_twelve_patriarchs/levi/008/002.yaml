id: T12P.LEV.8.2
reference: Testament of Levi 8:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶδον⁵ ἑπτὰ ἄνδρας⁶ ἐν ἐσθῆτι⁷ λευκῇ⁸ *λέγοντάς μοι⁹· Ἀναστὰς ἔνδυσαι τὴν στολὴν τῆς ἱερατείας, καὶ¹⁰ τὸν στέφανον τῆς δικαιοσύνης¹¹, *καὶ τὸ λόγιον¹² τῆς συνέσεως καὶ τὸν ποδήρη¹³ τῆς ἀληθείας καὶ τὸ πέταλον¹⁴ τῆς πίστεως καὶ τὴν μίτραν¹⁵ †τῆς κεφαλῆς†¹⁶ καὶ τὸ ἐφοὺδ τῆς προφητείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/002.yaml
  text: And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the breastpiece of understanding, and the full-length robe of truth, and the plate of faith, and the turban for the head, and the ephod of prophecy.”
translation:
  language: hi
  text: और मैंने सात पुरुषों को सफ़ेद वस्त्र पहने देखा। वे मुझसे कह रहे थे, “उठो, याजकपद का परिधान पहन लो—धार्मिकता का मुकुट, समझ का वक्षपट, सत्य का पाँव तक लंबा चोगा, विश्वास की पट्टिका, सिर की पगड़ी[a] और भविष्यवाणी का एपोद।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सिर की पगड़ी” के लिए यूनानी पाठ का यह अंश पाठ-संदिग्ध है; कुछ संपादक इसे भ्रष्ट या अनिश्चित मानते हैं।
    reason: †τῆς κεφαλῆς† पर संपादकीय क्रूक्स पाठगत अनिश्चितता दर्शाता है; मुख्य पाठ में अर्थ रखा गया है और अनिश्चितता टिप्पणी में बताई गई है।
lexical_decisions:
- source_word: στολὴν τῆς ἱερατείας
  choice: याजकपद का परिधान
  rationale: στολή को व्यापक ‘परिधान’ रखा गया है, क्योंकि आगे उसके विशिष्ट याजकीय अंगों की सूची आती है; ἱερατεία पद/सेवा के अर्थ में ‘याजकपद’ है।
- source_word: τὸ λόγιον τῆς συνέσεως
  choice: समझ का वक्षपट
  rationale: याजकीय परिधान के संदर्भ में λόγιον महायाजक के वक्षपट को सूचित करता है; ‘दैववाणी’ करने से वस्त्र-सूची का ठोस अर्थ अस्पष्ट हो जाता।
- source_word: τὸν ποδήρη τῆς ἀληθείας
  choice: सत्य का पाँव तक लंबा चोगा
  rationale: ποδήρης का शाब्दिक आशय पाँव तक पहुँचने वाला वस्त्र है; सहज आधुनिक हिन्दी में उसका आकार स्पष्ट किया गया है।
- source_word: τὸ πέταλον τῆς πίστεως
  choice: विश्वास की पट्टिका
  rationale: πέταλον यहाँ याजकीय धातु-पट्टिका है; ‘पट्टिका’ इस वस्तुगत अर्थ को संक्षेप में व्यक्त करता है।
- source_word: τὴν μίτραν
  choice: पगड़ी
  rationale: μίτρα याजकीय सिर-वस्त्र है; ‘पगड़ी’ आधुनिक हिन्दी में स्वाभाविक और बोधगम्य है।
- source_word: τὸ ἐφοὺδ τῆς προφητείας
  choice: भविष्यवाणी का एपोद
  rationale: ἐφούδ हिब्रू-उद्भूत विशिष्ट याजकीय वस्त्र का नाम है; इसे ‘एपोद’ के रूप में लिप्यंतरित किया गया है ताकि इसे किसी सामान्य वस्त्र से न मिलाया जाए।
theological_decisions:
- issue: याजकीय वस्तुओं के साथ अमूर्त गुणों का संबंध
  choice: ‘धार्मिकता का मुकुट’, ‘समझ का वक्षपट’ आदि संबंधसूचक संरचनाएँ यथावत रखी गईं
  alternative: इन गुणों को व्याख्यात्मक रूप से वस्तुओं के प्रतीक या उनसे मिलने वाले वरदान कहना
  rationale: यूनानी पाठ स्वयं संबंध का प्रकार स्पष्ट नहीं करता; अनुवाद ने प्रतीकात्मक अथवा प्रभावकारी अर्थ में से किसी एक को नहीं चुना।
- issue: भविष्यवाणी और एपोद का संबंध
  choice: ‘भविष्यवाणी का एपोद’
  alternative: ‘भविष्यवाणी करने वाला एपोद’
  rationale: स्रोत का संबंधकारक वाक्यांश वास्तविक संबंध को खुला छोड़ता है; क्रियात्मक अर्थ जोड़ना अनावश्यक व्याख्या होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज धार्मिक गद्य। ‘याजकपद’, ‘वक्षपट’ और ‘पट्टिका’ जैसे सटीक शब्दों के साथ दुर्लभ तकनीकी नाम ‘एपोद’ सुरक्षित रखा गया है। सूची को हिन्दी में स्वाभाविक बनाने के लिए डैश का प्रयोग किया गया है, पर सभी मूल घटक और उनका क्रम बनाए रखा गया है।
