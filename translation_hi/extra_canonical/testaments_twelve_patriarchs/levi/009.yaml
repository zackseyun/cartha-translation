  text: 'And after two days[a], I and Judah went up with our father Jacob to Isaac our grandfather. And the father of my father blessed me according to the visions that I had seen, and he was not willing to go with us to Bethel.


    And when we came to Bethel, my father Jacob saw a vision concerning me, that I would be a priest for them. And rising early in the morning, he gave a tenth of everything through me to the Lord.


    And so we came to Hebron to remain there. And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me. And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of firstfruits, of freewill offerings, and of peace offerings. And every day he kept instructing me in freewill offerings, and giving his attention to me he said:


    “Take heed to yourself from the spirit of sexual immorality[b], for this persists and is about to defile the holy things through your offspring. Therefore take for yourself a wife while you are still young, one having no blemish and not defiled, and not from the stock of foreign nations.


    And before you enter into the holy things, wash; and when you sacrifice in the presence of the Lord, wash your hands. And when you complete the sacrifice again, wash.


    And from twelve trees having leaves offer to the Lord, as Abraham taught me. And from every clean animal and bird offer a sacrifice to the Lord. And from all your first produce and wine offer firstfruits as a sacrifice to the Lord God[c][d]. And season every sacrifice with salt.”'
translation:
  language: hi
  text: '**लेवी का वसीयतनामा 9**


    1 दो दिन बाद मैं और यहूदा अपने पिता याकूब के साथ अपने पितामह इसहाक के पास चढ़ गए। 2 मेरे पिता के पिता ने उन दर्शनों के अनुसार मुझे आशीर्वाद दिया जो मैंने देखे थे; पर वे हमारे साथ बेतेल जाने को तैयार नहीं हुए।


    3 जब हम बेतेल पहुँचे, तब मेरे पिता याकूब ने मेरे विषय में एक दर्शन देखा कि मैं उनके लिए याजक बनूँगा। 4 फिर उन्होंने भोर को उठकर मेरे द्वारा हर वस्तु का दसवाँ भाग प्रभु को दिया।


    5 इसके बाद हम हेब्रोन आए और वहीं रहने लगे। 6 इसहाक मुझे बार-बार अपने पास बुलाते थे, ताकि मुझे प्रभु की व्यवस्था स्मरण दिलाएँ, ठीक वैसे ही जैसे स्वर्गदूत ने मुझे दिखाया था। 7 उन्होंने मुझे याजकपद की व्यवस्था—बलियों, पूरी तरह जलाई जाने वाली भेंटों, पहली उपज की भेंटों, स्वेच्छा-भेंटों और मेल-बलियों[c] की व्यवस्था—सिखाई। 8 वे हर दिन मुझे समझाते और मुझ पर विशेष ध्यान देते हुए कहते थे:


    9 “अपने आप को यौन अनैतिकता की आत्मा से बचाए रखना, क्योंकि वह लगातार बनी रहती है[a] और तेरे वंश के द्वारा पवित्र वस्तुओं को अशुद्ध करने वाली है। 10 इसलिए जब तू अभी जवान ही है, तब अपने लिए ऐसी पत्नी लेना जिसमें कोई दोष न हो, जो अपवित्र न की गई हो और जो परदेशी जातियों के वंश की न हो।


    11 “पवित्र वस्तुओं में प्रवेश करने से पहले स्नान करना। बलि चढ़ाते समय धोना, और बलि पूरी करने के बाद फिर धोना[b]।


    12 “पत्तों वाले बारह वृक्षों में से प्रभु को अर्पण चढ़ाना[d], जैसा अब्राहम ने मुझे सिखाया था। 13 हर शुद्ध पशु और पक्षी में से प्रभु को बलि चढ़ाना। 14 अपने हर पहलौठे और दाखमधु में से प्रभु परमेश्वर को बलि के रूप में प्रथम अंश चढ़ाना। और हर बलि में नमक डालना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लगातार बनी रहती है’ के पीछे का यूनानी पाठ कठिन है। इसका संभावित भाव यह है कि यौन अनैतिकता की आत्मा निरंतर या हठपूर्वक सक्रिय रहती है।
    reason: textual_variant
  - marker: b
    text: यहाँ बार-बार ‘धोने’ की आज्ञा बलि-संबंधी अनुष्ठान में संभवतः विशेष रूप से हाथ धोने को सूचित करती है, यद्यपि यूनानी पाठ अंग का नाम स्पष्ट नहीं करता।
    reason: cultural_note
  - marker: c
    text: ‘मेल-बलियाँ’ को अधिक व्यापक अर्थ में कल्याण या उद्धार से जुड़ी बलियाँ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘पत्तों वाले बारह वृक्षों’ का निर्देश अस्पष्ट है। अनुवाद यूनानी शब्दों के निकट रहता है और इससे आगे उस अनुष्ठान का पुनर्निर्माण नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεδεκάτωσε πάντα
  choice: हर वस्तु का दसवाँ भाग ... दिया
  rationale: क्रिया का अर्थ दशमांश देना है। यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट है और धार्मिक-कर्मकांड संबंधी अर्थ को बनाए रखती है।
- source_word: ἱερέα
  choice: याजक
  rationale: यह धार्मिक पद के लिए मानक और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: νόμον ἱερωσύνης
  choice: याजकपद की व्यवस्था
  rationale: मूल यूनानी के संबंधवाचक विन्यास को बनाए रखते हुए याजकीय नियमों का अर्थ स्पष्ट करता है।
- source_word: ὁλοκαυτωμάτων
  choice: पूरी तरह जलाई जाने वाली भेंटें
  rationale: यूनानी पद बलि के पूर्णतः जलाए जाने पर बल देता है; हिन्दी रूप उसी विशेषता को स्पष्ट करता है।
- source_word: ἀπαρχῶν
  choice: पहली उपज की भेंटें
  rationale: पहली उपज से दिए जाने वाले धार्मिक अर्पण का स्पष्ट और सुबोध रूप।
- source_word: ἑκουσίου
  choice: स्वेच्छा-भेंटें
  rationale: अर्पण के स्वैच्छिक स्वरूप को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σωτηρίου
  choice: मेल-बलियाँ
  rationale: बलियों की सूची में यह एक तकनीकी बलि-श्रेणी है। ‘मेल-बलि’ परिचित हिन्दी समतुल्य है, यद्यपि मूल पद में कल्याण या उद्धार का व्यापक भाव भी हो सकता है।
- source_word: πρόσεχε σεαυτῷ
  choice: अपने आप को ... बचाए रखना
  rationale: चेतावनी की गंभीरता रखते हुए आधुनिक हिन्दी में स्वाभाविक आदेश देता है।
- source_word: πνεύματος τῆς πορνείας
  choice: यौन अनैतिकता की आत्मा
  rationale: πορνεία का व्यापक नैतिक अर्थ और ‘आत्मा’ का व्यक्तिकृत आध्यात्मिक आयाम दोनों सुरक्षित रहते हैं।
- source_word: ἐνδελεχές
  choice: लगातार बनी रहती है
  rationale: पाठ कठिन है, पर उपलब्ध रूप निरंतरता या स्थायित्व का संकेत देता है; अनुवाद उसी संभावित अर्थ को बिना अधिक निश्चित बनाए व्यक्त करता है।
- source_word: μιαίνειν τὰ ἅγια
  choice: पवित्र वस्तुओं को अशुद्ध करने
  rationale: धार्मिक शुद्धता-अशुद्धता की ठोस शब्दावली और बहुवचन संदर्भ दोनों बनाए रखता है।
- source_word: μὴ ἔχουσαν μῶμον
  choice: जिसमें कोई दोष न हो
  rationale: ‘दोष’ शारीरिक/अनुष्ठानिक निष्कलंकता की प्रतिध्वनि बनाए रखता है, पर हिन्दी में अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: λούου ... νίπτου
  choice: स्नान करना ... हाथ धोना
  rationale: पहली क्रिया पूरे शरीर के स्नान और बाद की क्रिया प्रसंगानुसार हाथ धोने की ओर संकेत करती है; इस भेद को हिन्दी में व्यक्त किया गया है।
- source_word: ἅλατι ἁλιεῖς
  choice: नमक डालना
  rationale: हर बलि को नमक से युक्त करने की आज्ञा को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: याजकीय वंश से जुड़ी शुद्धता की चेतावनी
  choice: चेतावनी को इस रूप में रखा गया है कि यौन अनैतिकता लेवी के वंश के द्वारा पवित्र वस्तुओं को अशुद्ध कर सकती है।
  alternative: इसे केवल सामान्य नैतिक चेतावनी के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ स्पष्ट रूप से ‘तेरे वंश’ और ‘पवित्र वस्तुओं’ को जोड़ता है; इसलिए वंशानुगत याजकीय चिंता को सामान्यीकृत नहीं किया गया।
- issue: σωτηρίου की बलि-श्रेणी
  choice: मुख्य पाठ में ‘मेल-बलियाँ’।
  alternative: कल्याण-बलियाँ; उद्धार की बलियाँ।
  rationale: बलियों की तकनीकी सूची में ‘मेल-बलि’ सुबोध और प्रचलित है, जबकि मूल शब्द का अर्थ-क्षेत्र कल्याण और उद्धार तक विस्तृत हो सकता है।
- issue: याकूब के दर्शन में लेवी की भूमिका
  choice: ‘मैं उनके लिए याजक बनूँगा’।
  alternative: ‘मैं उनका याजक बनूँगा’।
  rationale: αὐτοῖς के दत्तिव रूप को निकटता से रखते हुए यह नहीं तय किया गया कि ‘उनके’ का सटीक समूह कौन है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। पितृपुरुष की शिक्षा में सम्मानसूचक बहुवचन और उद्धृत आज्ञाओं में पारंपरिक एकवचन ‘तू/तेरे’ का प्रयोग किया गया है। कर्मकांड संबंधी शब्दावली को जहाँ संभव हो परिचित रखा गया, पर मूल पाठ की कठिनाइयों और अस्पष्टताओं को पादटिप्पणियों में सुरक्षित किया गया है।
