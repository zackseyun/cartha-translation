id: T12P.LEV.3.1
reference: Testament of Levi 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 92-133, Levi pilot full)
  text: ῎Ακουσον οὖν¹ περὶ τῶν δει- χθέντων σοι οὐρα- νῶν· ὁ κατώτερος *διὰ τοῦτό σοί ἐστι στυγνός, ἐπειδὴ² ὁρᾷ πάσας³ τὰς ἀδικίας τῶν ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/001.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is gloomy for this reason: because it sees all the injustices of people.'
translation:
  language: hi
  text: तो उन स्वर्गों के विषय में सुन, जो तुझे दिखाए गए थे। सबसे निचला स्वर्ग इसी कारण उदास है कि वह मनुष्यों के सभी अन्यायों को देखता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουσον οὖν
  choice: इसलिए ... सुन
  rationale: आज्ञार्थक Ἄκουσον को सीधे और स्वाभाविक ढंग से “सुन” तथा निष्कर्षसूचक οὖν को “इसलिए” से व्यक्त किया गया है।
- source_word: τῶν δειχθέντων σοι οὐρανῶν
  choice: उन स्वर्गों ... जो तुझे दिखाए गए थे
  rationale: बहुवचन οὐρανῶν को “स्वर्गों” रखा गया और दत्तिवाचक σοι तथा भूतकालिक कृदंत को संबंधवाचक उपवाक्य में स्वाभाविक हिन्दी दी गई।
- source_word: ὁ κατώτερος
  choice: सबसे निचला स्वर्ग
  rationale: तुलनात्मक रूप यहाँ क्रमबद्ध स्वर्गों में निम्नतम स्तर को सूचित करता है; हिन्दी में संज्ञा “स्वर्ग” स्पष्टता के लिए दोहराई गई।
- source_word: στυγνός
  choice: उदास
  rationale: शब्द का भाव अंधकारमय, विषण्ण या उदास रूप का है; “उदास” दृश्य और भावात्मक गंभीरता को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: πάσας τὰς ἀδικίας
  choice: सारे अन्याय
  rationale: ἀδικία के बहुवचन को सामूहिक हिन्दी “सारे अन्याय” से व्यक्त किया गया है, जिससे अन्यायपूर्ण कर्म और स्थितियाँ दोनों समाहित रह सकें।
- source_word: τῶν ἀνθρώπων
  choice: मनुष्यों के
  rationale: सामान्य मानवजाति-सूचक अर्थ के लिए समावेशी और गरिमापूर्ण “मनुष्यों” चुना गया है।
theological_decisions:
- issue: स्वर्गों का बहुवचन और निम्नतम स्वर्ग का व्यक्तिकरण
  choice: “स्वर्गों” का बहुवचन रखा और “वह ... देखता है” द्वारा व्यक्तिकरण सुरक्षित रखा
  alternative: इसे एक ही “स्वर्ग” या केवल काव्यात्मक वातावरण के रूप में समझाना
  rationale: यूनानी पाठ स्पष्ट रूप से बहुवचन οὐρανῶν तथा एकवचन पुल्लिंग कर्ता और क्रिया का प्रयोग करता है; अनुवाद उसकी ब्रह्मांड-संबंधी कल्पना को बिना व्याख्यात्मक समतलीकरण के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा संबोधन रखा गया है। प्राचीन संदर्भ के व्यक्तिगत एकवचन σοι के लिए “तुझे” चुना गया है; भाषा सहज है, पर अत्यधिक बोलचाल की नहीं।
