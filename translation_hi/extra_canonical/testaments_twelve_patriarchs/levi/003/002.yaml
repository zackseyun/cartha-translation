  revised_text: और उसमें आग, हिम और बर्फ परमेश्वर द्वारा ठहराए हुए दिन के लिए तैयार रखे गए हैं, ताकि मनुष्यों पर परमेश्वर का धर्ममय न्याय हो। उसमें अधर्मियों से प्रतिशोध लेने के दंडों की सभी आत्माएँ हैं। उसके ऊपर पवित्र स्थान है, और उसमें न्याय के दिन के लिए नियुक्त सेनाओं के दल हैं, ताकि वे छल और बेलियार[b] की आत्माओं से प्रतिशोध लें। उनके ऊपर पवित्र जन हैं। सबसे ऊँचे स्थान में महान महिमा निवास करती है, जो समस्त पवित्रता से कहीं ऊपर है। उसके ठीक नीचे वाले स्वर्ग में प्रधान स्वर्गदूत हैं, जो सेवा करते हैं और धर्मियों के अनजाने में किए गए सभी पापों के लिए प्रभु को प्रायश्चित द्वारा प्रसन्न करते हैं[a]। वे प्रभु को सुगंधमय सुगंध, अर्थात् एक विवेकपूर्ण और रक्तहीन भेंट[c], चढ़ाते हैं। और इससे नीचे वाले स्वर्ग में वे स्वर्गदूत हैं, जो प्रभु की उपस्थिति में रहने वाले स्वर्गदूतों तक उत्तर पहुँचाते हैं। परंतु उससे ठीक नीचे वाले स्वर्ग में सिंहासन और प्रभुताएँ हैं, जहाँ परमेश्वर के लिए निरंतर स्तुतिगान किए जाते हैं। इसलिए, जब प्रभु अपनी पवित्रता की महिमा में हमारी ओर दृष्टि करता है, तब स्वर्ग काँप
    उठते हैं। पृथ्वी भी अपनी नींवों से हिल जाती है और थरथराती हुई अपनी गहराइयों तक काँप उठती है। किंतु मनुष्य इन बातों को न समझकर भटक जाते हैं और उसे क्रोधित करते हैं।
