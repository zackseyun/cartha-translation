  terminology: ‘बेलियार,’ ‘प्रधान स्वर्गदूत,’ ‘महान महिमा,’ ‘सिंहासन,’ और ‘प्रभुताएँ’ उपयुक्त हैं। ‘प्रायश्चित’ को इस तरह पुनर्गठित किया गया है कि प्रभु propitiation का लक्ष्य हैं, जबकि पाप उसके विषय हैं; पादटिप्पणी वैकल्पिक अर्थ को सुरक्षित रखती है।
