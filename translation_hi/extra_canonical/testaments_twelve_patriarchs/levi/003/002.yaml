  text: Καὶ ἔχει πῦρ χιόνα καὶ⁴ κρύσταλλον ἡτοιμασμένον⁵ εἰς A ª
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/002.yaml
  text: And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are
    shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.
translation:
  language: hi
  text: और उसमें आग, हिम और बर्फ परमेश्वर द्वारा ठहराए हुए दिन के लिए तैयार रखे गए हैं, ताकि मनुष्यों पर परमेश्वर का धर्ममय न्याय हो। उसमें अधर्मियों से प्रतिशोध लेने के दंडों की सभी आत्माएँ हैं। उसके ऊपर पवित्र स्थान है, और उसमें न्याय के दिन के लिए नियुक्त सेनाओं के दल हैं, ताकि वे छल और बेलियार[b] की आत्माओं से प्रतिशोध लें। उनके ऊपर पवित्र जन हैं। सबसे ऊँचे स्थान में महान महिमा निवास करती है, जो समस्त पवित्रता से कहीं ऊपर है। उसके ठीक नीचे वाले स्वर्ग में प्रधान स्वर्गदूत हैं, जो सेवा करते हैं और धर्मियों के अनजाने में किए गए सभी पापों के लिए प्रभु को प्रायश्चित द्वारा प्रसन्न करते हैं[a]। वे प्रभु को सुगंधमय सुगंध, अर्थात् एक विवेकपूर्ण और रक्तहीन भेंट[c], चढ़ाते हैं। और इससे नीचे वाले स्वर्ग में वे स्वर्गदूत हैं, जो प्रभु की उपस्थिति में रहने वाले स्वर्गदूतों तक उत्तर पहुँचाते हैं। परंतु उससे ठीक नीचे वाले स्वर्ग में सिंहासन और प्रभुताएँ हैं, जहाँ परमेश्वर के लिए निरंतर स्तुतिगान किए जाते हैं। इसलिए, जब प्रभु अपनी पवित्रता की महिमा में हमारी ओर दृष्टि करता है, तब स्वर्ग काँप उठते हैं।
    पृथ्वी भी अपनी नींवों से हिल जाती है और थरथराती हुई अपनी गहराइयों तक काँप उठती है। किंतु मनुष्य इन बातों को न समझकर भटक जाते हैं और उसे क्रोधित करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मियों के अनजाने में किए गए पापों के लिए प्रभु के सम्मुख प्रायश्चित करते हैं।” उपासना-संबंधी प्रसंगों में ग्रीक क्रिया का अर्थ “प्रभु को प्रसन्न करना” अथवा “प्रायश्चित करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बेलियार” नाम के ग्रीक रूप का लिप्यंतरण है; अन्य परंपराओं में इसे प्रायः “बेलियाल” कहा जाता है।
    reason: lexical_alternative
  - marker: c
    text: “विवेकपूर्ण और रक्तहीन भेंट” वाले वाक्यांश का अर्थ “बुद्धिसंगत” या, अधिक व्याख्यात्मक रूप से, “आत्मिक और रक्तहीन भेंट” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: आग
  rationale: सामान्य और सीधा हिन्दी समतुल्य; दंड-संबंधी संदर्भ को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाया।
- source_word: χιόνα
  choice: हिम
  rationale: ग्रीक में बर्फ के गिरने या जमी बर्फ का सामान्य बोध है; अगले पद के κρύσταλλον से भेद रखने के लिए ‘हिम’ चुना।
- source_word: κρύσταλλον
  choice: बर्फ
  rationale: इस संदर्भ में ठोस जमी हुई बर्फ का अर्थ स्वाभाविक है; ‘स्फटिक’ संभव शब्दार्थ है, पर आग और हिम की सूची में ‘बर्फ’ अधिक संदर्भसंगत है।
- source_word: ἡτοιμασμένον
  choice: तैयार रखे गए हैं
  rationale: सिर्फ तैयारी नहीं, नियत दिन तक सुरक्षित रखे जाने का भाव भी हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: Beliar
  choice: बेलियार
  rationale: ग्रीक रूप के निकट लिप्यंतरण रखा गया और प्रचलित वैकल्पिक रूप को पादटिप्पणी में बताया गया।
- source_word: propitiation / atonement terminology
  choice: प्रायश्चित करते हैं
  rationale: उपासना-संबंधी संदर्भ में स्वाभाविक हिन्दी; क्रोध-शमन और पाप-प्रायश्चित के बीच मूल की संभावित अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा।
- source_word: reasonable offering
  choice: विवेकपूर्ण भेंट
  rationale: ‘बौद्धिक’ की अपेक्षा अधिक सहज हिन्दी है और ‘आत्मिक’ जैसा व्याख्यात्मक निष्कर्ष मुख्य पाठ में नहीं थोपता।
- source_word: Great Glory
  choice: महान महिमा
  rationale: उपाधि की भव्यता और जानबूझकर रखी गई परोक्ष ईश-संज्ञा को सुरक्षित रखता है।
theological_decisions:
- issue: प्रधान स्वर्गदूतों की प्रायश्चितकारी सेवा
  choice: ‘प्रभु के सामने प्रायश्चित करते हैं’ रखा
  alternative: ‘प्रभु को प्रसन्न/शांत करते हैं’
  rationale: मूल उपासना-संबंधी क्रिया की अर्थगत व्यापकता को मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखा; किसी विशिष्ट प्रायश्चित-सिद्धांत को नहीं थोपा।
- issue: ‘बेलियार की आत्माएँ’ का संबंध
  choice: ‘छल और बेलियार की आत्माओं’ का समन्वित वाक्यांश रखा
  alternative: ‘छल की आत्माएँ, अर्थात बेलियार की आत्माएँ’
  rationale: दोनों को एक ही मान लेना संभव है, पर पाठ की संरचना उस पहचान को अनिवार्य नहीं करती; इसलिए अस्पष्टता नहीं मिटाई गई।
- issue: विवेकपूर्ण/आत्मिक रक्तहीन भेंट
  choice: ‘विवेकपूर्ण और रक्तहीन भेंट’
  alternative: ‘आत्मिक और रक्तहीन भेंट’
  rationale: ‘आत्मिक’ अधिक व्याख्यात्मक और संभावित रूप से सिद्धांतगत है; अधिक औपचारिक अर्थ मुख्य पाठ में रखा और विकल्प पादटिप्पणी में दिया।
- issue: महान महिमा की पहचान
  choice: उपाधि को ‘महान महिमा’ के रूप में बनाए रखा
  alternative: सीधे ‘परमेश्वर’ या ‘प्रभु’ लिखना
  rationale: पाठ की परोक्ष, उत्कर्षसूचक ईश-संज्ञा को स्पष्ट नाम में बदलना उसकी साहित्यिक और धर्मवैचारिक बनावट को समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। स्वर्गीय पदानुक्रम के लिए ‘प्रधान स्वर्गदूत’, ‘सिंहासन’ और ‘प्रभुताएँ’ जैसे पारंपरिक पर स्पष्ट शब्द प्रयुक्त हैं। उपलब्ध प्रत्यक्ष ग्रीक उद्धरण आरंभिक वाक्यांश तक सीमित और अंत में अपूर्ण है; उस अंश को प्राथमिक आधार बनाया गया, जबकि शेष पाठ के लिए प्रदत्त परीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानी से अनुसरण किया गया और उसकी वास्तविक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित रखी गईं।
