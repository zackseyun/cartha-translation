  text: 1[a]. I, Levi, was born in Haran, and I came with my father to Shechem. 2. And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor. 3[b]. And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers. 4. And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved. 5. Then sleep fell upon me, and I saw a high mountain, and I was on it. 6. And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi[c], enter.”
translation:
  language: hi
  text: 1. मैं, लेवी, हारान में जन्मा और अपने पिता के साथ शकेम आया। 2. उस समय मैं अभी जवान था, लगभग बीस वर्ष का; तब मैंने शिमोन के साथ मिलकर अपनी बहन दीना का हमोर से बदला लिया। 3. जब मैं आबेलमाऊल में भेड़ें चरा रहा था, तब प्रभु की ओर से समझ की एक आत्मा मुझ पर आई। मैंने देखा कि सब लोग अपने मार्ग को नष्ट कर रहे थे[a]; पाप दीवार पर बनाया जा रहा था और अन्याय मीनारों पर बैठा था। 4. तब मैं मनुष्य-संतानों के वंश[b] के लिए दुःखी हुआ और मैंने प्रभु से प्रार्थना की कि मेरा उद्धार हो। 5. तब मुझ पर नींद छा गई और मैंने एक ऊँचा पर्वत देखा; मैं उसी पर था। 6. और देखो, स्वर्ग खुल गए[c], और प्रभु के एक दूत ने मुझसे कहा, “लेवी, लेवी, प्रवेश कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने मार्ग को नष्ट करना” का शाब्दिक अर्थ अपने जीवन-मार्ग या आचरण को बरबाद अथवा भ्रष्ट करना है।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य-संतानों का वंश” एक गंभीर सामी-शैली की अभिव्यक्ति है, जिसका आशय मानवजाति है।
    reason: cultural_note
  - marker: c
    text: स्वर्गों का खुलना प्रकाशनात्मक दर्शनों की प्रचलित भाषा है; बाइबिल और अन्य यहूदी दर्शन-वृत्तांतों में भी ऐसी छवि मिलती है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: बदला लिया
  rationale: यह प्रतिशोध की सक्रिय और हिंसक कार्रवाई को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना उसे केवल भावनात्मक रोष तक सीमित किए।
- source_word: νεώτερος
  choice: अभी जवान था
  rationale: लगभग बीस वर्ष की आत्मकथात्मक आयु-सूचना के संदर्भ में यह स्वाभाविक हिन्दी है और तुलनात्मक युवावस्था का भाव रखती है।
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: प्रभु की ओर से समझ की एक आत्मा
  rationale: अनिश्चित पदबंध को किसी निश्चित उपाधि में नहीं बदलता और प्रभु से प्राप्त विवेक का भाव बनाए रखता है।
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: अपने मार्ग को नष्ट कर रहे थे
  rationale: क्रिया के प्रबल शाब्दिक अर्थ और नैतिक ‘मार्ग’ की बाइबिलीय छवि, दोनों को सुरक्षित रखता है।
- source_word: ἁμαρτία ... οἰκοδομεῖτο
  choice: पाप दीवार पर बनाया जा रहा था
  rationale: मूल की निष्क्रिय, वास्तु-संबंधी और असामान्य छवि को व्याख्यात्मक रूप से समतल नहीं करता।
- source_word: ἀδικία ἐκάθητο
  choice: अन्याय मीनारों पर बैठा था
  rationale: अन्याय के मानवीकरण और स्थिर दृश्यात्मक छवि को बनाए रखता है।
- source_word: γένος τῶν υἱῶν τῶν ἀνθρώπων
  choice: मनुष्य-संतानों के वंश
  rationale: मूल की गंभीर सामी शैली को यथासंभव रखता है, जबकि पादटिप्पणी उसके व्यापक मानवजातीय अर्थ को स्पष्ट करती है।
- source_word: ὅπως σωθῶ
  choice: कि मेरा उद्धार हो
  rationale: यह शारीरिक बचाव और व्यापक धार्मिक उद्धार—दोनों संभावनाओं को खुला रखता है।
- source_word: ἐπέπεσέ με ὕπνος
  choice: मुझ पर नींद छा गई
  rationale: साधारण ‘मैं सो गया’ के बजाय दर्शन-प्रसंग की सजीव मूल अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: आकाश खुल गए
  rationale: ग्रीक के बहुवचन और यहूदी प्रकाशनात्मक दर्शन की शैली को बनाए रखता है।
theological_decisions:
- issue: πνεῦμα συνέσεως की प्रकृति
  choice: प्रभु की ओर से समझ की एक आत्मा
  alternative: समझ का आत्मा / पवित्र आत्मा
  rationale: ग्रीक पदबंध किसी बाद की सिद्धान्तगत विशिष्ट पहचान को अनिवार्य नहीं करता; अनुवाद दैवी स्रोत बताता है पर उसे स्पष्टतः पवित्र आत्मा की उपाधि नहीं बनाता।
- issue: σωθῶ का आशय
  choice: मेरा उद्धार हो
  alternative: मैं बचाया जाऊँ / मेरी रक्षा हो
  rationale: संदर्भ नैतिक भ्रष्टता से मुक्ति और व्यापक उद्धार—दोनों अर्थों की अनुमति देता है; ‘उद्धार’ इस तनाव को बनाए रखता है।
- issue: पाप और अन्याय की वास्तु-संबंधी छवि
  choice: छवि को शाब्दिक और मानवीकृत रूप में रखना
  alternative: पाप बढ़ रहा था और अन्याय छाया हुआ था
  rationale: मूल दर्शन की रहस्यमय छवि को सरल नैतिक व्याख्या में बदलना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, कथात्मक और दर्शन-संबंधी शैली रखी गई है। नामों के रूप हारान, शकेम, शिमोन, दीना, हमोर और आबेलमाऊल चुने गए हैं। मूल की असामान्य वास्तु-छवियों और धार्मिक अस्पष्टताओं को सहज व्याख्या से प्रतिस्थापित नहीं किया गया।
