id: T12P.LEV.16.1
reference: Testament of Levi 16:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν *ἐγὼ ἔγνωκα¹ ὅτι ἑβδομήκοντα ἑβδομάδας² πλανηθήσεσθε³, καὶ τὴν ἱερωσύνην βεβηλώσετε⁴ καὶ *τὰ θυσιαστήρια⁵ μιανεῖτε⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/001.yaml
  text: And now I know that for seventy weeks you will go astray, and you will profane the priesthood and defile the altars.
translation:
  language: hi
  text: और अब मैं जानता हूँ कि तुम सत्तर सप्ताहों तक भटकते रहोगे, याजकाई को अपवित्र करोगे और वेदियों को दूषित करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνωκα
  choice: मैं जान गया हूँ
  rationale: पूर्णकालिक रूप वर्तमान में प्राप्त और स्थायी ज्ञान को व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए यूनानी पक्ष को बनाए रखता है।
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: सत्तर सप्ताहों तक
  rationale: शाब्दिक अर्थ ‘सत्तर सप्ताह’ है; कालगत प्रयोग को स्पष्ट करने के लिए ‘तक’ रखा गया है, बिना यह तय किए कि सप्ताह प्रतीकात्मक हैं या सामान्य।
- source_word: πλανηθήσεσθε
  choice: भटकते रहोगे
  rationale: निष्क्रिय रूप का भाव यहाँ मार्ग से भटकने/बहकने का है; ‘भटकते रहोगे’ अवधि और नैतिक-धार्मिक विचलन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἱερωσύνην
  choice: याजकाई
  rationale: यह शब्द याजकीय पद, सेवा और संस्था के समष्टिगत भाव को रखता है; केवल ‘याजकत्व’ की अपेक्षा आम पाठक के लिए अधिक सहज है।
- source_word: βεβηλώσετε
  choice: अपवित्र करोगे
  rationale: पवित्र वस्तु या व्यवस्था को लौकिक/अपवित्र बनाने का अर्थ सीधे व्यक्त होता है।
- source_word: θυσιαστήρια
  choice: वेदियों
  rationale: बहुवचन को सुरक्षित रखा गया है और बलिदान की वेदी के लिए प्रचलित बाइबिलीय हिन्दी शब्द चुना गया है।
- source_word: μιανεῖτε
  choice: दूषित करोगे
  rationale: अनुष्ठानिक अथवा नैतिक अशुद्धि पहुँचाने का अर्थ रखता है और पहले प्रयुक्त ‘अपवित्र’ से शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: ‘सत्तर सप्ताहों’ की प्रकृति
  choice: सत्तर सप्ताहों तक
  alternative: सत्तर सातकों तक / सत्तर सप्ताह अर्थात् प्रतीकात्मक काल
  rationale: मूल पाठ केवल ἑβδομάδας कहता है; अनुवाद इसे वर्षों, युगों या किसी विशेष भविष्यसूचक गणना के रूप में निर्धारित नहीं करता।
- issue: πλανηθήσεσθε का कर्तृत्व
  choice: तुम ... भटकते रहोगे
  alternative: तुम बहकाए जाओगे
  rationale: यूनानी रूप व्याकरणतः निष्क्रिय है, पर इसका प्रचलित अर्थ अकर्मक ‘भटकना’ भी हो सकता है। प्रसंग किसी बाहरी बहकाने वाले को स्पष्ट नहीं करता, इसलिए हिन्दी में कृत्रिम कर्ता नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और पाठयोग्य शैली। ‘याजकाई’ और ‘वेदियाँ’ बाइबिलीय संदर्भ को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज है।
