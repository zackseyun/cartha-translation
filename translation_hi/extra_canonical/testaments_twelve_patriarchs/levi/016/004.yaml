  text: '*Λέγω δὲ ὑμῖν ὅτι²⁷ δι᾽ αὐτὸν²⁸ ἔσονται²⁹ τὰ ἅγια ὑμῶν ἔρημα³⁰ ἕως ἐδάφους³¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/004.yaml
  text: But I tell you that because of him, your holy places will be laid waste to the ground.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि उसके कारण तुम्हारे पवित्र स्थान भूमि तक उजाड़ दिए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ αὐτόν
  choice: उसके कारण
  rationale: यूनानी कारणसूचक पदबंध का सीधा और स्वाभाविक अनुवाद; सर्वनाम की वास्तविक संदर्भगत अस्पष्टता बनाए रखता है।
- source_word: τὰ ἅγια ὑμῶν
  choice: तुम्हारे पवित्र स्थान
  rationale: नपुंसकलिंग बहुवचन substantival प्रयोग यहाँ पवित्र स्थलों या पवित्र परिसरों को सूचित करता है; हिन्दी में 'पवित्र स्थान' स्पष्ट और व्यापक है।
- source_word: ἔρημα ἕως ἐδάφους
  choice: उजाड़ होकर भूमि तक ढहा दिए जाएँगे
  rationale: '''उजाड़'' ἔρημα को और ''भूमि तक'' ἕως ἐδάφους की पूर्ण विनाश की सीमा को व्यक्त करता है; हिन्दी वाक्य में भाव स्पष्ट करने के लिए ''ढहा दिए जाएँगे'' प्रयुक्त है।'
theological_decisions:
- issue: δι᾽ αὐτόν में पुरुषवाचक सर्वनाम का संदर्भ
  choice: उसके कारण
  alternative: उस व्यक्ति के कारण / उसी के कारण
  rationale: मूल पद में संदर्भ इस वाक्य के भीतर स्पष्ट नहीं किया गया है, इसलिए अनुवाद ने किसी विशिष्ट व्यक्ति या धर्मवैचारिक पहचान को नहीं जोड़ा।
- issue: τὰ ἅγια का आशय
  choice: पवित्र स्थान
  alternative: पवित्र वस्तुएँ / पवित्रस्थान
  rationale: विनाश और भूमि तक ढहाए जाने के प्रसंग में स्थानगत अर्थ सर्वाधिक स्वाभाविक है, पर किसी विशेष मंदिर-संबंधी व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भविष्यवाणीपरक शैली। 'परन्तु' से δέ का विरोधात्मक संक्रमण रखा गया है और सर्वनामगत अस्पष्टता सुरक्षित है।
