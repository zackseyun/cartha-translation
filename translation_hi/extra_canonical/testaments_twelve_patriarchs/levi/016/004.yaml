review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the causal force and ambiguity of δι᾽ αὐτόν (''उसके कारण'') and takes τὰ ἅγια plausibly as holy places. However, ''उजाड़ होकर ... ढहा दिए जाएँगे'' adds an awkward, mixed construction: the Greek predicates a state of desolation (ἔσονται ... ἔρημα) qualified by destruction ''to the ground,'' rather than explicitly using a separate passive verb for being demolished.'
  naturalness: The sequence 'उजाड़ होकर भूमि तक ढहा दिए जाएँगे' is not idiomatic modern standard Hindi. A direct passive expression, 'भूमि तक उजाड़ दिए जाएँगे,' is natural and retains the catastrophic sense.
  terminology: '''पवित्र स्थान'' is a suitable non-sectarian rendering of τὰ ἅγια in this context. ''उसके कारण'' appropriately leaves the antecedent unspecified.'
  issues:
  - severity: medium
    issue: Awkward and overly expanded predicate
    rationale: '''उजाड़ होकर ... ढहा दिए जाएँगे'' combines desolation and demolition in a grammatically and stylistically strained way. Recasting it as ''भूमि तक उजाड़ दिए जाएँगे'' better represents the source''s desolation-to-the-ground expression without introducing a separate, overly specific action.'
  revised_text: पर मैं तुमसे कहता हूँ कि उसके कारण तुम्हारे पवित्र स्थान भूमि तक उजाड़ दिए जाएँगे।
