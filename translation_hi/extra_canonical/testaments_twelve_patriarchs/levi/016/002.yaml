source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ τὸν νόμον ἀθετήσετε⁷ καὶ λόγους προφητῶν ἐξουδενώσετε⁸ *ἐν διαστροφῇ κακῇ⁹. *διώξετε δὲ¹⁰ ἄνδρας¹¹ δικαίους, καὶ εὐσεβεῖς μισήσετε¹², ἀληθινῶν¹³ λόγους βδελύξεσθε¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/002.yaml
  text: And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.
translation:
  language: hi
  text: और तुम व्यवस्था को ठुकरा दोगे और दुष्ट कुटिलता में भविष्यद्वक्ताओं के वचनों को तुच्छ जानोगे। तुम धर्मी पुरुषों को सताओगे और भक्तों से घृणा करोगे; तुम सत्यनिष्ठों के वचनों से घृणा करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν νόμον ἀθετήσετε
  choice: व्यवस्था को ठुकरा दोगे
  rationale: ἀθετέω यहाँ किसी विधान को रद्द, अस्वीकार या निरर्थक ठहराने का भाव रखता है। ‘ठुकराना’ इस सक्रिय अवज्ञा को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λόγους προφητῶν ἐξουδενώσετε
  choice: भविष्यद्वक्ताओं के वचनों को तुच्छ जानोगे
  rationale: ἐξουδενόω का अर्थ तुच्छ या नगण्य समझना है; ‘वचन’ भविष्यद्वक्ताओं के कथनों के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν διαστροφῇ κακῇ
  choice: दुष्ट विकृति में
  rationale: शाब्दिक संरचना और पाठ की नैतिक तीव्रता को सुरक्षित रखा गया है। διαστροφή में टेढ़ापन, भ्रष्टता या विकृति का भाव है; अस्पष्ट क्रियाविशेषणीय संबंध को नहीं सुलझाया गया।
- source_word: ἄνδρας δικαίους
  choice: धर्मी मनुष्यों
  rationale: ἄνδρας का मूल अर्थ पुरुष हो सकता है, पर यहाँ व्यक्तियों के एक वर्ग का सामान्य उल्लेख है; ‘मनुष्यों’ से अर्थ अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं होता।
- source_word: εὐσεβεῖς
  choice: भक्त लोगों
  rationale: εὐσεβής ईश्वर के प्रति श्रद्धा और धार्मिक निष्ठा रखने वाले व्यक्ति को दर्शाता है। ‘भक्त’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: ἀληθινῶν λόγους
  choice: सत्य बोलने वालों के वचनों
  rationale: ἀληθινῶν को स्वतंत्र substantival विशेषण मानकर ‘सच्चे/सत्यनिष्ठ लोगों’ का अर्थ संभव है। अंग्रेज़ी परामर्श पाठ के अनुरूप ‘सत्य बोलने वालों’ से उसका मानवीय संदर्भ स्पष्ट होता है, जबकि ‘वचन’ को λόγους से जोड़ा गया है।
- source_word: βδελύξεσθε
  choice: घिन करोगे
  rationale: βδελύσσομαι तीव्र घृणा या जुगुप्सा व्यक्त करता है; ‘घिन करना’ साधारण पाठक के लिए स्पष्ट और मूल की तीव्रता के निकट है।
theological_decisions:
- issue: νόμος का संदर्भ
  choice: व्यवस्था
  alternative: कानून / मूसा की व्यवस्था
  rationale: ‘व्यवस्था’ बाइबलीय संदर्भ में νόμος का स्थापित और व्यापक अनुवाद है। मूल यहाँ स्पष्ट रूप से ‘मूसा की’ नहीं कहता, इसलिए वह विस्तार नहीं जोड़ा गया।
- issue: ἐν διαστροφῇ κακῇ का संबंध
  choice: मूल की तरह वाक्य में खुला रखा गया
  alternative: ‘अपनी दुष्ट विकृति के कारण’ या केवल भविष्यद्वक्ताओं के वचनों के प्रति तिरस्कार से जोड़ना
  rationale: यूनानी पदबंध का सटीक वाक्यगत संबंध कुछ अस्पष्ट है। कारण या स्वामित्व जोड़ने से अर्थ अनावश्यक रूप से निश्चित हो जाता।
- issue: ἀληθινῶν की व्याख्या
  choice: सत्य बोलने वाले व्यक्ति
  alternative: सच्चे वचन
  rationale: रूप ἀληθινῶν बहुवचन संबंधकारक है और λόγους को सीधे विशेषित करने के बजाय व्यक्तियों के लिए substantival रूप में समझा जा सकता है। निकटवर्ती व्यक्तियों—धर्मी और भक्त—की श्रृंखला भी इस पठन का समर्थन करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। समानांतर भविष्यकालीन क्रियाओं और आरोपों की क्रमिक तीव्रता को बनाए रखा गया है। कोई फुटनोट आवश्यक नहीं समझा गया।
