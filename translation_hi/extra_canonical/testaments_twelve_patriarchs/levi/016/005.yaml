id: T12P.LEV.16.5
reference: Testament of Levi 16:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *τόπος ὑμῖν καθαρὸς οὐκ ἔσται³², ἀλλ᾽ ἔσεσθε³³ ἐν τοῖς ἔθνεσιν εἰς κατάραν καὶ *εἰς διασκορπισμόν³⁴, ἕως³⁵ *αὐτὸς πάλιν³⁶ ἐπισκέψηται³⁷ καὶ *οἰκτειρήσῃ καὶ³⁸ προσδέξηται³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/005.yaml
  text: And no clean place will be for you, but you will be among the nations of the earth for a curse and for scattering, until he himself visits again and shows compassion and receives you.
translation:
  language: hi
  text: और तुम्हारे लिए कोई शुद्ध स्थान न होगा, बल्कि तुम राष्ट्रों के बीच शाप और बिखराव के लिए रहोगे, जब तक कि वह स्वयं फिर तुम्हारी सुधि न ले, तुम पर दया न करे और तुम्हें स्वीकार न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπος ... καθαρὸς
  choice: कोई शुद्ध स्थान
  rationale: ‘स्थान’ और ‘शुद्ध’ मूल यूनानी के सामान्य अर्थ को सीधे रखते हैं; यहाँ ‘पवित्र स्थान’ कहना अर्थ को अनावश्यक रूप से अधिक विशिष्ट कर देता।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: राष्ट्रों के बीच
  rationale: ἔθνη का सामूहिक और राजनीतिक-सामाजिक भाव सुरक्षित रहता है; मूल में ‘पृथ्वी के’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  choice: शापित और तितर-बितर होकर
  rationale: शाब्दिक ‘शाप और बिखराव के लिए’ हिन्दी में अस्वाभाविक और अस्पष्ट होता; यह रूप निर्वासन के परिणामस्वरूप उनकी दशा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह तय किए कि वे दूसरों के लिए शाप होंगे या स्वयं शापित दशा में रहेंगे।
- source_word: ἐπισκέψηται
  choice: सुधि न ले
  rationale: यहाँ क्रिया केवल ‘भेंट करने’ की नहीं, कृपापूर्वक ध्यान देने और सहायता करने की ओर संकेत करती है; ‘सुधि लेना’ इस भाव को स्वाभाविक और गरिमामय हिन्दी में रखता है।
- source_word: προσδέξηται
  choice: तुम्हें स्वीकार न करे
  rationale: क्रिया के ‘ग्रहण/स्वीकार करने’ के भाव को स्पष्ट करता है; हिन्दी में अपेक्षित कर्म ‘तुम्हें’ संदर्भ से पूरा किया गया है।
theological_decisions:
- issue: ἐπισκέψηται में ईश्वरीय आगमन अथवा कृपापूर्ण देखभाल
  choice: तुम्हारी सुधि न ले
  alternative: तुमसे फिर भेंट न करे
  rationale: संदर्भ दया और स्वीकार किए जाने का है; ‘सुधि लेना’ कृपापूर्ण हस्तक्षेप को व्यक्त करता है, जबकि किसी विशिष्ट अंतिम आगमन की धारणा आरोपित नहीं करता।
- issue: εἰς κατάραν का संबंध
  choice: शापित ... होकर
  alternative: शाप के लिए / शाप का कारण बनकर
  rationale: यूनानी पदबंध संबंध में कुछ संक्षिप्त है। चुना गया रूप निर्वासन की शापित दशा व्यक्त करता है और किसी दूसरे समूह द्वारा उन्हें शाप देने की विस्तृत व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज और पाठयोग्य शैली रखी गई है। ‘न होगा’, ‘सुधि न ले’ और ‘स्वीकार न करे’ भविष्यकालीन ‘जब तक’ संरचना में स्वाभाविक रूप से जुड़े हैं। मूल में अनुपस्थित ‘पृथ्वी के’ नहीं जोड़ा गया।
