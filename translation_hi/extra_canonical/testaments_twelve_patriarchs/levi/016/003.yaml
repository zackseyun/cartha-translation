id: T12P.LEV.16.3
reference: Testament of Levi 16:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '[Καὶ ἄνδρα καινοποιοῦντα¹⁵ νόμον *ἐν δυνάμει ὑψίστου¹⁶ πλάνου¹⁷ προσαγορεύσετε, καὶ τέλος †ὁρμήσετε τοῦ ἀποκτεῖναι¹⁸ αὐτόν, οὐκ εἰδότες¹⁹ αὐτοῦ τὸ ἀνάστημα†²⁰, τὸ²¹ ἀθῷον αἷμα²² *ἐν κακίᾳ²³ ἐπὶ τῆς²⁴ κεφαλῆς²⁵ ὑμῶν ἀναδεχόμενοι²⁶.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/003.yaml
  text: '[And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his rising, taking innocent blood in wickedness upon your heads.]'
translation:
  language: hi
  text: '[और जो मनुष्य परमप्रधान की सामर्थ्य से व्यवस्था को नया करेगा[a], उसे तुम भ्रम फैलानेवाला कहोगे; और अन्त में उसका कद[b] जाने बिना उसे मार डालने के लिए टूट पड़ोगे और दुष्टता से निर्दोष रक्त का दोष अपने सिर पर ले लोगे।]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “व्यवस्था का नवीकरण करेगा।”'
    reason: यूनानी और व्यापक अर्थ में “व्यवस्था को नया बनाना” या “व्यवस्था का नवीकरण करना” दोनों संभव हैं।
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “कद” या “ऊँचाई” है; यहाँ इसका संकेत उसके वास्तविक स्वरूप या महानता की ओर भी हो सकता है।
    reason: ἀνάστημα का सामान्य अर्थ कद/ऊँचाई है, किन्तु संदर्भ में इसका आशय अधिक व्यापक हो सकता है; स्रोत इसे निश्चित नहीं करता।
lexical_decisions:
- source_word: καινοποιοῦντα νόμον
  choice: व्यवस्था को नया करेगा
  rationale: Participial phrase literally presents the man as making the law new. This preserves the wording more directly than an interpretive expansion such as reforming or restoring the law.
- source_word: ἐν δυνάμει ὑψίστου
  choice: परमप्रधान की सामर्थ्य से
  rationale: Renders the divine title and instrumental force naturally, attaching the phrase to the man's making the law new, as the Greek word order most readily permits.
- source_word: πλάνου προσαγορεύσετε
  choice: उसे तुम भरमानेवाला कहोगे
  rationale: πλάνος denotes one who leads others astray, so भरमानेवाला is clearer and more personal here than the abstract धोखेबाज़.
- source_word: ὁρμήσετε τοῦ ἀποκτεῖναι αὐτόν
  choice: उसे मार डालने के लिए टूट पड़ोगे
  rationale: Conveys the forceful movement or impulse in ὁρμάω and the purpose of killing.
- source_word: ἀνάστημα
  choice: कद
  rationale: Preserves the ordinary concrete sense 'stature/height' rather than silently interpreting it as resurrection, dignity, or identity.
- source_word: τὸ ἀθῷον αἷμα ... ἐπὶ τῆς κεφαλῆς ὑμῶν ἀναδεχόμενοι
  choice: निर्दोष रक्त का दोष अपने सिर पर ले लोगे
  rationale: Natural Hindi makes explicit the culpability idiom implied by taking innocent blood upon one's head, without changing its moral force.
theological_decisions:
- issue: What the man's 'stature' signifies
  choice: Main text retains the literal image 'कद' and notes its possible broader sense.
  alternative: Translate interpretively as 'महानता,' 'पहचान,' or 'पुनरुत्थान.'
  rationale: The Greek ἀνάστημα can refer concretely to stature or height, while context may invite a figurative sense. The source does not securely resolve that tension.
- issue: Scope of 'in the power of the Most High'
  choice: Attach it to the man's making the law new.
  alternative: Attach it to the designation 'deceiver.'
  rationale: The phrase stands within the participial description before πλάνου προσαγορεύσετε; attaching it to the man's action gives the most coherent syntax while avoiding the theologically awkward claim that he is called a deceiver 'in the power of the Most High.'
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सहज। “व्यवस्था,” “परमप्रधान,” और “निर्दोष रक्त का दोष अपने सिर पर लेना” जैसे पद शास्त्रीय वातावरण बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्वाभाविक रखी गई है। स्रोत में पूरे वचन को घेरे हुए कोष्ठक पाठगत/संपादकीय अनिश्चितता का संकेत देते हैं, इसलिए अनुवाद में भी वे सुरक्षित रखे गए हैं।
