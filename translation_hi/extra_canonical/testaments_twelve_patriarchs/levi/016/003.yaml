- from: '[और जो मनुष्य परमप्रधान की सामर्थ्य से व्यवस्था को नया करेगा[a], उसे तुम भरमानेवाला कहोगे; और अन्त में उसे मार डालने के लिए टूट पड़ोगे। तुम उसका कद[b] नहीं जानोगे और दुष्टता से निर्दोष रक्त का दोष अपने सिर पर ले लोगे।]'
  to: '[और जो मनुष्य परमप्रधान की सामर्थ्य से व्यवस्था को नया करेगा[a], उसे तुम भ्रम फैलानेवाला कहोगे; और अन्त में उसका कद[b] जाने बिना उसे मार डालने के लिए टूट पड़ोगे और दुष्टता से निर्दोष रक्त का दोष अपने सिर पर ले लोगे।]'
  rationale: Revision retains the draft's lexical and theological restraint while restoring the Greek participial relation of ‘not knowing his stature’ to the act of attacking and killing him. It also uses a more natural Hindi rendering for the designation πλάνος. The disputed or potentially figurative force of ἀνάστημα remains in the footnote rather than being doctrinally resolved in the main text.
