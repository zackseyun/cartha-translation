base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/002.yaml
  text: 'For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: hi
  text: 'क्योंकि जब उसने उन्हें अपने पास बुलाया, तब वह स्वस्थ था; पर उसे यह प्रकट किया गया कि वह मरने वाला था। और जब वे इकट्ठे हो गए, तो उसने उनसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: स्वस्थ
  rationale: यहाँ कृदन्त का अर्थ शारीरिक रूप से स्वस्थ होना है; ‘स्वस्थ’ आधुनिक, सहज और मूल के निकट है।
- source_word: ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν
  choice: उसने उन्हें अपने पास बुलाया
  rationale: ग्रीक दिशा-सूचक वाक्यांश πρὸς ἑαυτόν को स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀπεκαλύφθη ... αὐτῷ
  choice: उस पर ... प्रकट किया गया था
  rationale: निष्क्रिय रूप को बनाए रखता है और प्रकाशन के कर्ता को अनिर्दिष्ट छोड़ता है, जैसा मूल में है।
- source_word: μέλλει ἀποθνήσκειν
  choice: वह मरने वाला है
  rationale: निकट भविष्य या आसन्न घटना का स्वाभाविक हिन्दी रूप है।
- source_word: συνήχθησαν
  choice: वे इकट्ठे हो गए
  rationale: निष्क्रिय/अकर्मक भाव को सहज आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: εἶπεν πρὸς αὐτούς
  choice: उसने उनसे कहा
  rationale: ग्रीक अभिव्यक्ति का प्रचलित और गरिमापूर्ण हिन्दी समतुल्य है।
theological_decisions:
- issue: प्रकाशन का कर्ता
  choice: कर्ता को अनिर्दिष्ट रखते हुए ‘उस पर यह प्रकट किया गया’
  alternative: ‘परमेश्वर ने उस पर प्रकट किया’
  rationale: मूल यूनानी में प्रकाशन देने वाले का स्पष्ट उल्लेख नहीं है; इसलिए उसे परमेश्वर कहकर जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। यूनानी वाक्यक्रम को हिन्दी की स्वाभाविकता के अनुसार सँवारा गया है, जबकि विरोधसूचक ‘पर’ और क्रमसूचक ‘और जब’ सुरक्षित रखे गए हैं।
