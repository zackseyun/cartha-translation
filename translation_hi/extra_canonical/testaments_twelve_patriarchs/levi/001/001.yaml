  text: A copy of the words of Levi, which he ordained for his sons about all that they would do, and all that would happen to them[a] until the day of judgment.
translation:
  language: hi
  text: लेवी के उन वचनों की प्रतिलिपि, जो उसने अपने पुत्रों के लिए निर्धारित किए थे—उन सब कामों के विषय में जो वे करेंगे, और उन सब बातों के विषय में जो न्याय के दिन तक उनके साथ घटेंगी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो न्याय के दिन तक उनके सामने आएँगी।” यूनानी मुहावरे में शाब्दिक रूप से भविष्य में उनके ‘सामने आने’ या उनसे ‘मिलने’ वाली बातों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह संज्ञा किसी लिखित पाठ की नकल या प्रति को सूचित करती है; ‘प्रतिलिपि’ आधुनिक मानक हिन्दी में सटीक और स्वाभाविक है।
- source_word: λόγων
  choice: वचनों
  rationale: यहाँ लेवी द्वारा अपने पुत्रों को दिए गए कथनों या निर्देशों का शीर्षक है; ‘वचन’ गरिमापूर्ण रहते हुए λόγοι की व्यापकता बनाए रखता है।
- source_word: διέθετο
  choice: ठहराया था
  rationale: मध्यवाच्य क्रिया में व्यवस्थित करने, निर्धारित करने या विधिवत निर्देश देने का भाव है। ‘ठहराया था’ उस औपचारिकता को रखता है, बिना इसे केवल ‘कहा’ या विशेष रूप से ‘आज्ञा दी’ तक सीमित किए।
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: उन सब कामों के विषय में जो वे करेंगे
  rationale: κατά को प्रसंगानुसार ‘के विषय में’ और πάντα ἃ को ‘उन सब ... जो’ से व्यक्त किया गया है; भविष्यकाल ποιήσουσιν सुरक्षित है।
- source_word: ὅσα συναντήσει αὐτοῖς
  choice: उन सब बातों के विषय में जो ... उनके साथ घटेंगी
  rationale: συναντάω का मूल चित्र ‘मिलने/सामने आने’ का है, पर इस मुहावरे में भविष्य में घटने वाली बातों का अर्थ स्वाभाविक है; ‘सामने आएँगी’ को पादटिप्पणी में रखा गया है।
- source_word: ἕως ἡμέρας κρίσεως
  choice: न्याय के दिन तक
  rationale: ἡμέρα κρίσεως का सीधा और स्थापित हिन्दी रूप, जिसमें न्याय की भावी समय-सीमा बनी रहती है।
theological_decisions:
- issue: ‘न्याय के दिन’ की प्रकृति और पहचान
  choice: न्याय के दिन
  alternative: अंतिम न्याय के दिन
  rationale: यूनानी पाठ केवल ἡμέρας κρίσεως कहता है; ‘अंतिम’ जोड़ना पाठ से अधिक विशिष्ट व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में शीर्षकीय, गरिमापूर्ण शैली रखी गई है। वाक्य की दो समानांतर धाराओं—वे क्या करेंगे और उनके साथ क्या घटेगा—को स्पष्ट रखा गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
