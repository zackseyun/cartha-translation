base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007.yaml
  text: And I said to my father Jacob[a], “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you. For from this day the city called Sychem shall be a city of fools. For just as one mocks a fool, so we mocked them, because they indeed committed folly in Israel by defiling my sister. Then, after taking her up[b], we came to Bethel.”
translation:
  language: hi
  text: 7 और मैंने अपने पिता याकूब से कहा, “तेरे द्वारा प्रभु कनानियों को तुच्छ कर देगा और उनकी भूमि तुझे और तेरे बाद तेरे वंश को देगा। 2 क्योंकि आज से सिकेमा[a] कहलाने वाला नगर ‘मूर्खों का नगर’ होगा; जैसे कोई किसी मूर्ख का उपहास करता है, वैसे ही हमने उनका उपहास किया। 3 उन्होंने निश्चय ही मेरी बहन को अशुद्ध करके[b] इस्राएल में मूर्खता का काम किया था। 4 फिर उसे अपने साथ लेकर[c] हम बेतेल आए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सिकेमा’ यूनानी पाठ में आए स्थान-नाम का रूप है; यह स्थान सामान्यतः ‘शकेम’ के नाम से जाना जाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपवित्र करके’; यूनानी शब्द नैतिक और धार्मिक अशुद्धता, दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसे वहाँ से ले जाकर’; यह कृदंत संभवतः बेतेल जाने से पहले दीना को उस स्थान से साथ ले जाने की ओर संकेत करता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐν σοὶ
  choice: तेरे द्वारा
  rationale: संदर्भ में यह याकूब के माध्यम से या उसके संबंध में होने वाली प्रभु की कार्रवाई को व्यक्त करता है। शाब्दिक ‘तुझमें’ आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होता।
- source_word: ἐξουδενώσει
  choice: तुच्छ कर देगा
  rationale: यह क्रिया किसी को नगण्य या कुछ न ठहराने का भाव रखती है। ‘नष्ट कर देगा’ संभावित अर्थ को आवश्यकता से अधिक निर्णायक बना देता।
- source_word: σπέρματί
  choice: वंश
  rationale: ‘वंश’ आधुनिक हिन्दी में स्वाभाविक रहते हुए पितृकालीन प्रतिज्ञा की सामूहिक संतति का भाव सुरक्षित रखता है; शाब्दिक ‘बीज’ यहाँ अस्वाभाविक होता।
- source_word: Σύκημα
  choice: सिकेमा
  rationale: मुख्य पाठ में इस यूनानी साक्षी के स्थान-नाम का निकट देवनागरी लिप्यंतरण रखा गया है; परिचित नाम ‘शकेम’ पाद-टिप्पणी में दिया गया है।
- source_word: ἀσυνέτων
  choice: मूर्खों का
  rationale: यह नैतिक निंदा को स्पष्ट रखता है और अगले वाक्य में ‘मूर्ख’ के साथ जानबूझकर की गई शब्द-पुनरावृत्ति बचाता है।
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: उपहास करता है / हमने उपहास किया
  rationale: दोनों रूपों की धातुगत प्रतिध्वनि को समान हिन्दी अभिव्यक्ति से सुरक्षित रखा गया है।
- source_word: ἀφροσύνην
  choice: मूर्खता का काम
  rationale: यह नैतिक अर्थ और ‘इस्राएल में मूर्खता’ की पारंपरिक अभिव्यक्ति बनाए रखता है, साथ ही आधुनिक हिन्दी में सहज है।
- source_word: μιάναντες
  choice: अशुद्ध करके
  rationale: यूनानी के नैतिक-धार्मिक अशुद्धता के भाव को बनाए रखता है और उससे अधिक स्पष्ट यौन शब्दावली पाठ में नहीं जोड़ता।
- source_word: Ἀπάραντες
  choice: उसे अपने साथ लेकर
  rationale: संदर्भानुसार कर्म दीना है और भाव उसे साथ लेकर बेतेल जाने का है। क्रिया के ‘वहाँ से ले जाने’ वाले संभावित अर्थ को पाद-टिप्पणी में रखा गया है।
- source_word: Βεθήλ
  choice: बेतेल
  rationale: स्थान-नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
theological_decisions:
- issue: याकूब से जुड़ी भूमि और संतति की प्रतिज्ञा
  choice: प्रभु द्वारा भूमि देने और याकूब के बाद उसके ‘वंश’ को पाने की भाषा स्पष्ट रखी गई।
  alternative: इसे केवल भावी विजय या ‘वंशजों’ के सामान्य उल्लेख के रूप में ढीला करना।
  rationale: यूनानी में भूमि और σπέρμα की पितृकालीन प्रतिज्ञा-सदृश बनावट है। ‘वंश’ इस धार्मिक प्रतिध्वनि को सहज हिन्दी में बनाए रखता है।
- issue: कनानियों के प्रति ἐξουδενώσει का आशय
  choice: ‘तुच्छ कर देगा’
  alternative: ‘नष्ट कर देगा’ या ‘नीचा दिखाएगा’
  rationale: चुना हुआ रूप नगण्य कर देने या कुछ न ठहराने की तीव्रता बचाता है, पर क्रिया को पूर्ण विनाश की व्याख्या में नहीं बदलता।
- issue: सिकेमा के लोगों के अपराध का नैतिक-धार्मिक चित्रण
  choice: ‘मूर्खता का काम’ और ‘अशुद्ध करके’
  alternative: ‘अत्याचार’ और ‘बलात्कार करके’ जैसे अधिक स्पष्ट सामाजिक या यौन शब्द
  rationale: मूल पाठ अपराध को मूर्खता और अशुद्धता की भाषा में रखता है। अनुवाद उसी धार्मिक-नैतिक तनाव को बनाए रखता है, बिना घटना की गंभीरता घटाए या यूनानी से अधिक विवरण जोड़े।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। संबोधन में ‘तू/तेरे’ का पारंपरिक निकट संबंध वाला रूप है। ‘उपहास’ और ‘मूर्खता’ नैतिक वसीयतनुमा शैली बनाए रखते हैं, जबकि वाक्यरचना सामान्य हिन्दी पाठक के लिए सरल है।
