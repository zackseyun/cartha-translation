  text: 1[a]. Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands on him in wickedness, and among all the nations you will become a mockery[b]. 2. For our father Israel is pure from the ungodliness of the chief priests, who will lay their hands on the savior of the world. 3. For just as the sun is pure before the Lord upon the earth, so also...
translation:
  language: hi
  text: 'लेवी का वसीयतनामा 14


    1. इसलिए, मेरे बच्चों, मैं जान गया हूँ कि युगों के अंत में तुम प्रभु के विरुद्ध अधर्म करोगे; दुष्टता से [उस पर] हाथ डालोगे[a] और सब जातियों के बीच उपहास का पात्र बनोगे। 2. क्योंकि हमारे पिता इस्राएल प्रधान याजकों के अधर्म से शुद्ध हैं—[जो संसार के उद्धारकर्ता पर हाथ डालेंगे]।[b] 3. क्योंकि जैसे सूर्य पृथ्वी पर प्रभु के सामने शुद्ध है, वैसे ही तुम भी, जो इस्राएल के ज्योति-पुंज हो, सब जातियों से बढ़कर हो।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उस पर’ के लिए यूनानी शब्द प्रदत्त पाठ में वर्ग कोष्ठकों में है। इसे पाठ में रखा गया है, पर इसका स्रोत-पाठ में होना अनिश्चित है।
    reason: textual_variant
  - marker: b
    text: वर्ग कोष्ठकों में दिया गया वाक्यांश प्रदत्त यूनानी पाठ में भी कोष्ठकबद्ध है। संभव है कि यह नकल-परंपरा में बाद में जोड़ा गया विस्तार हो; यहाँ इसे इसलिए अनूदित किया गया है क्योंकि यह उपलब्ध यूनानी पाठ में मौजूद है।
    reason: textual_variant
  - marker: c
    text: पद 3 में ‘सूर्य’ और ‘पृथ्वी पर’ से जुड़े यूनानी शब्द संपादित पाठ में संदिग्ध या दूषित पाठ के चिह्नों से अंकित हैं। फिर भी उपलब्ध शब्दों का अर्थ यहाँ अनूदित किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: मैं जान गया हूँ
  rationale: ग्रीक क्रिया अर्जित और वर्तमान तक प्रभाव रखने वाले ज्ञान को व्यक्त करती है; यह हिन्दी रूप उस पूर्ण भाव को स्वाभाविक ढंग से रखता है।
- source_word: ἀσεβήσετε
  choice: अधर्म करोगे
  rationale: यह क्रियात्मक रूप है और ईश्वर-विरोधी आचरण को व्यक्त करता है; केवल ‘अधर्मी होगे’ कहने की अपेक्षा क्रिया का बल सुरक्षित रहता है।
- source_word: ἐπὶ Κυρίου
  choice: प्रभु के विरुद्ध
  rationale: आगे के शत्रुतापूर्ण प्रसंग और ‘हाथ डालोगे’ के कारण ἐπί का विरोधात्मक अर्थ उपयुक्त है।
- source_word: χεῖρας ἐπιβάλλοντες / ἐπιβαλοῦσι τὰς χεῖρας
  choice: उस पर हाथ डालोगे / हाथ डालेंगे
  rationale: यह मुहावरा पकड़ने अथवा हिंसक कार्रवाई, दोनों की संभावना रखता है; हिन्दी बाइबलीय प्रयोग भी वही अस्पष्टता बनाए रखता है।
- source_word: χλευασμός
  choice: उपहास का पात्र
  rationale: यह सार्वजनिक तिरस्कार की स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθαρός
  choice: शुद्ध
  rationale: यह नैतिक और धार्मिक शुद्धता दोनों की ध्वनि बनाए रखता है।
- source_word: ἀρχιερέων
  choice: प्रधान याजकों
  rationale: बहुवचन और द्वितीय-मंदिरकालीन सामूहिक प्रयोग के अनुरूप है।
- source_word: σωτῆρα τοῦ κόσμου
  choice: संसार के उद्धारकर्ता
  rationale: ग्रीक पद का सीधा अर्थ दिया गया है; इसकी पाठ-संबंधी जटिलता पादटिप्पणी में बताई गई है।
- source_word: φωστῆρες τοῦ Ἰσραήλ
  choice: इस्राएल के ज्योति-पुंज
  rationale: φωστήρ प्रकाश देने वाले आकाशीय पिंड अथवा ज्योति का बिंब है; ‘ज्योति-पुंज’ सूर्य से जुड़ी उपमा को बनाए रखता है।
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: सब जातियों से बढ़कर
  rationale: παρά के तुलनात्मक अर्थ और वाक्य के प्रशंसात्मक बल को व्यक्त करता है, यद्यपि पाठ की अंतिम पंक्ति कठिन है।
theological_decisions:
- issue: पद 2 में प्रधान याजकों द्वारा ‘संसार के उद्धारकर्ता’ पर हाथ डालने वाला कोष्ठकबद्ध वाक्यांश
  choice: मुख्य पाठ में वर्ग कोष्ठकों सहित रखा गया और पादटिप्पणी में उसकी पाठगत स्थिति बताई गई।
  alternative: इसे बाद का विस्तार मानकर मुख्य पाठ से निकाल देना।
  rationale: प्रदत्त यूनानी पाठ में यह वाक्यांश उपस्थित किंतु कोष्ठकबद्ध है; इसे चुपचाप हटाने या निर्विवाद मूल पाठ मान लेने के बजाय दोनों तथ्य दिखाए गए हैं।
- issue: पद 1 में ‘प्रभु’ और ‘उस पर’ का संबंध
  choice: सीधे और चौंकाने वाले संबंध को यथावत रखा गया।
  alternative: इसे केवल प्रभु के अधिकार के विरुद्ध विद्रोह के रूप में ढीला करके अनुवाद करना, या ‘उस’ को स्पष्टतः ‘उद्धारकर्ता’ कहना।
  rationale: यूनानी पाठ स्वयं इस संबंध को पूरी तरह नहीं सुलझाता; अनुवाद ने उसकी भविष्यद्वाणी-सदृश तीक्ष्णता और वास्तविक अस्पष्टता बनाए रखी है।
- issue: पद 3 की सूर्य-वाली उपमा और इस्राएल के ज्योति-पुंजों की श्रेष्ठता
  choice: कठिन यूनानी को निकटता से अनूदित कर ‘सब जातियों से बढ़कर’ रखा गया।
  alternative: ‘सब जातियों के बीच’ या पाठ को अपूर्ण मानकर ‘वैसे ही…’ पर रोक देना।
  rationale: प्रदत्त यूनानी पाठ पद को आगे पूरा करता है; इसलिए अंग्रेज़ी परामर्श-पाठ की अपूर्णता को आधार नहीं बनाया गया। παρά का तुलनात्मक प्रयोग यहाँ अधिक संभावित है, जबकि पाठगत कठिनाई नोट में स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘बच्चो’, ‘हाथ डालना’, ‘उपहास का पात्र’ और ‘प्रधान याजक’ स्वाभाविक तथा बाइबलीय ध्वनि रखते हैं। अंग्रेज़ी परामर्श-पाठ के विपरीत, प्रदत्त यूनानी स्रोत में पद 3 अंत तक मौजूद है; इसलिए पूरा पद अनूदित किया गया है।
