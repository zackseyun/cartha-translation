source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XI. Καὶ οὐκέτι κληθήσομαι λύκος ἅρπαξ διὰ τὰς ἁρπαγὰς ὑμῶν ἀλλὰ [ἐργάτης Κυρίου διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/001.yaml
  text: No longer shall I be called a ravening wolf because of your acts of plunder, but [a worker of the Lord, distributing food to those who do what is good].
translation:
  language: hi
  text: 11:1 तुम्हारी लूटमार के कारण मैं अब कभी फाड़ खानेवाला भेड़िया नहीं कहलाऊँगा, बल्कि [प्रभु का काम करनेवाला, जो भलाई करने वालों को भोजन बाँटता है]।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: फाड़ खानेवाला भेड़िया
  rationale: यह यूनानी पद भेड़िये की हिंसक और लूटनेवाली प्रकृति को व्यक्त करता है; यह वाक्यांश हिन्दी में स्वाभाविक रहते हुए उस सजीव रूपक को बनाए रखता है।
- source_word: ἁρπαγάς
  choice: लूटमार
  rationale: बहुवचन संज्ञा का आशय लूटपाट या लूट के कामों से है; ‘लूटमार’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐργάτης Κυρίου
  choice: प्रभु का कार्यकर्ता
  rationale: ἐργάτης किसी काम करनेवाले या श्रमिक को दर्शाता है। ‘कार्यकर्ता’ यहाँ सेवा या काम करनेवाले व्यक्ति का व्यापक अर्थ देता है और अनावश्यक संस्थागत या सांप्रदायिक अर्थ से बचता है।
- source_word: διαδιδὼν τροφήν
  choice: भोजन बाँटता है
  rationale: कृदन्त का सतत कार्य हिन्दी में संबंधवाचक उपवाक्य द्वारा स्वाभाविक रूप से व्यक्त किया गया है; ‘बाँटना’ वितरण के भाव को स्पष्ट रखता है।
- source_word: τοῖς ἐργαζομένοις τὸ ἀγαθόν
  choice: भलाई करनेवालों को
  rationale: शाब्दिक अर्थ ‘जो भलाई का काम करते हैं’ है। ‘भलाई करनेवाले’ संक्षिप्त, स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: उत्तरार्ध की पाठ-संपादकीय स्थिति
  choice: ‘प्रभु का कार्यकर्ता...’ वाले पूरे उत्तरार्ध को वर्ग कोष्ठकों में रखा गया है।
  alternative: कोष्ठक हटाकर इसे निर्विवाद मूल पाठ की तरह प्रस्तुत करना।
  rationale: दिए गए यूनानी संस्करण में यह अंश वर्ग कोष्ठकों में है, जो इसकी पाठ-संपादकीय अनिश्चितता या प्रक्षेप होने की संभावना को दर्शाता है; अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिंसक पशु-रूपक और लूट से सेवा तथा उदार वितरण की ओर विरोधाभास को स्पष्ट बनाए रखा गया है।
