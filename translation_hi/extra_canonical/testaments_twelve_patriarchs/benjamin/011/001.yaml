review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Greek clause structure, the causal reference to the audience's plundering, and the editorial brackets around the uncertain latter clause. However, ‘कार्यकर्ता’ is not the most precise or neutral rendering of ἐργάτης in this context.
  naturalness: The Hindi is generally clear, but ‘अब फिर कभी’ is unnecessarily repetitive for οὐκέτι, and ‘प्रभु का कार्यकर्ता’ can suggest a modern organizational or political role. ‘प्रभु का काम करनेवाला’ is more idiomatic and directly reflects the source.
  terminology: ‘लूटमार’ suitably renders ἁρπαγάς; ‘भोजन बाँटता है’ and ‘भलाई करने वालों’ accurately convey the participial distribution clause and its recipients. The bracketed status must remain visible.
  issues:
  - severity: low
    issue: ‘अब फिर कभी’ redundantly intensifies οὐκέτι.
    rationale: The Greek means ‘no longer’; ‘अब कभी’ expresses this naturally without adding the repeated ‘फिर’.
  - severity: medium
    issue: ‘प्रभु का कार्यकर्ता’ is potentially misleading for ἐργάτης Κυρίου.
    rationale: In contemporary Hindi, ‘कार्यकर्ता’ often denotes an activist or organizational worker. ‘प्रभु का काम करनेवाला’ directly conveys a person doing the Lord’s work without importing that association.
