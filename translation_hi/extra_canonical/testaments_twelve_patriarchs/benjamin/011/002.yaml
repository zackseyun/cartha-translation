id: T12P.BEN.11.2
reference: Testament of Benjamin 11:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/002.yaml
  text: And in the last times a beloved one of the Lord shall arise [from the seed of Judah and Levi], doing good pleasure with his mouth, [enlightening all the nations with new knowledge], a light of knowledge, coming upon Israel in salvation, and snatching from them like a wolf, and giving to the assembly of the nations.
translation:
  language: hi
  text: और अंतिम समयों में प्रभु का एक प्रिय जन उठ खड़ा होगा—[यहूदा और लेवी के वंश से]—जो अपने मुख से भली इच्छा पूरी करता हुआ, [नए ज्ञान से सब जातियों को प्रकाश देता हुआ], ज्ञान की ज्योति, उद्धार के साथ इस्राएल पर आएगा, और भेड़िये के समान उनसे छीन लेगा, और जातियों की सभा को देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὑστέροις
  choice: अन्तिम समयों में
  rationale: यह काल-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है, बिना इसे किसी अधिक विशिष्ट युग-सिद्धान्त से बाँधे।
- source_word: ἀγαπητὸς Κυρίου
  choice: प्रभु का एक प्रिय जन
  rationale: ἀγαπητός को संज्ञात्मक रूप में व्यक्त करता है और सम्बन्धसूचक Κυρίου को स्पष्ट रखता है।
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: अपने मुख से प्रसन्नता का काम करेगा
  rationale: पाठ की असामान्य और कुछ अस्पष्ट संरचना को सहज सिद्धान्तगत अर्थ में बदलने के बजाय यथासंभव निकट रखा गया है।
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη
  choice: नए ज्ञान से सब जातियों को प्रकाश देगा
  rationale: φωτίζων के प्रकाश देने और γνῶσιν καινήν के साधन अथवा विषय-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φῶς γνώσεως
  choice: ज्ञान की ज्योति
  rationale: यूनानी रूपक का संक्षिप्त और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: उद्धार के साथ इस्राएल पर आएगा
  rationale: ἐπεμβαίνων की कठिन और असामान्य दिशा-छवि को सुरक्षित रखा है; इसे केवल ‘इस्राएल को उद्धार देगा’ बनाकर अर्थ निश्चित नहीं किया।
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: भेड़िये के समान उनसे छीन लेगा
  rationale: हिंस्र उपमा और ἀπ᾽ αὐτῶν के अस्पष्ट बहुवचन संकेत, दोनों को बनाए रखता है।
- source_word: συναγωγῇ τῶν ἐθνῶν
  choice: जातियों की सभा
  rationale: συναγωγή का सामान्य अर्थ ‘सभा’ रखा गया है; इसे किसी बाद की विशिष्ट संस्थागत पहचान से नहीं जोड़ा गया।
theological_decisions:
- issue: कोष्ठकबद्ध पाठ की पाठालोचनात्मक स्थिति
  choice: दोनों कोष्ठकबद्ध अंश मुख्य पाठ में उसी प्रकार कोष्ठकों में रखे गए
  alternative: उन्हें निर्विवाद मुख्य पाठ में मिला देना या हटा देना
  rationale: दिए गए यूनानी स्रोत में इन अंशों की अनिश्चित अथवा संपादकीय स्थिति संकेतित है; अनुवाद उस साक्ष्य को दृश्य रूप से सुरक्षित रखता है।
- issue: प्रिय जन की पहचान
  choice: ‘प्रभु का एक प्रिय जन’
  alternative: स्पष्ट रूप से ‘मसीह’ या किसी नामित व्यक्ति के रूप में पहचानना
  rationale: मूल पद व्यक्ति की पहचान को स्पष्ट नाम नहीं देता; अतः अनुवाद अतिरिक्त मसीही या सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
- issue: इस्राएल और जातियों के बीच क्रिया का अर्थ
  choice: ‘इस्राएल पर आएगा… उनसे छीन लेगा… जातियों की सभा को देगा’
  alternative: छीनी गई वस्तु या ‘उनसे’ के संकेत को स्पष्ट करके किसी निश्चित उद्धार-स्थानांतरण सिद्धान्त में बदलना
  rationale: मूल में कर्म और सर्वनाम-संदर्भ अस्पष्ट हैं; इस तनाव को जानबूझकर सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए बोधगम्य। ‘अन्तिम समयों’, ‘प्रिय जन’, ‘उद्धार’, ‘जातियों की सभा’ जैसे शब्द शास्त्रीय स्वर बनाए रखते हैं। स्रोत में कोई पादटिप्पणी आवश्यक नहीं लगी; पाठालोचनात्मक कोष्ठक सीधे मुख्य पाठ में सुरक्षित हैं।
