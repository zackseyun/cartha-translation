  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/005.yaml
  text: And through them he will visit as Jacob my father, saying, “He will fill up what is lacking in your tribe.”
translation:
  language: hi
  text: और उनके द्वारा वह मेरे पिता याकूब के समान आएगा और कहेगा[a], “वह स्वयं तुम्हारे गोत्र की कमियों को पूरा करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ‘कहते हुए’ है, जो आनेवाले व्यक्ति के कथन को प्रस्तुत करता है। उद्धरण में ‘वह स्वयं’ के लिए बलाघाती सर्वनाम है; उसका पूर्ववर्ती इस संक्षिप्त अंश में स्पष्ट नहीं किया गया है।
    reason: λεγων के व्याकरणिक संबंध और αὐτός के बल को स्पष्ट करता है, बिना किसी अनिश्चित वैकल्पिक वक्ता को आरोपित किए।
lexical_decisions:
- source_word: δι᾽ αὐτῶν
  choice: उनके माध्यम से
  rationale: बहुवचन सर्वनाम αὐτῶν को बनाए रखता है और διά के माध्यम-सूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φοιτήσει
  choice: आया करेगा
  rationale: φοιτάω में किसी स्थान पर आने-जाने या बार-बार उपस्थित होने का भाव हो सकता है; ‘आया करेगा’ भविष्य और आवर्ती भेंट—दोनों भावों को संक्षेप में रखता है।
- source_word: φυλῆς
  choice: गोत्र
  rationale: इस्राएल के जनजातीय/वंशगत संदर्भ में ‘गोत्र’ आधुनिक हिन्दी बाइबलीय प्रयोग के अनुरूप और ‘जाति’ से कम भ्रामक है।
- source_word: ἀναπληρώσει τὰ ὑστερήματα
  choice: जो कमी है, उसे पूरा करेगा
  rationale: यूनानी मुहावरे का अर्थ सहज हिन्दी में देता है और बहुवचन ‘कमियों’ को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: Αὐτός
  choice: वही
  rationale: आरम्भिक बलाघाती सर्वनाम का जोर सुरक्षित रखता है।
theological_decisions: []
