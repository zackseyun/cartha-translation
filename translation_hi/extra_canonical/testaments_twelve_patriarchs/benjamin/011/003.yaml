id: T12P.BEN.11.3
reference: Testament of Benjamin 11:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/003.yaml
  text: Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.
translation:
  language: hi
  text: युग की समाप्ति तक वह राष्ट्रों की सभाओं में और उनके शासकों के बीच रहेगा—सबके मुँह में संगीत की धुन के समान।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντελείας τοῦ αἰῶνος
  choice: युग की समाप्ति
  rationale: यह वाक्यांश किसी युग के पूर्ण अंत या समापन को दर्शाता है; ‘युग की समाप्ति’ मूल के काल-संबंधी और अंतिमता-संबंधी अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: συναγωγαῖς ἐθνῶν
  choice: अन्यजातियों की सभाओं
  rationale: συναγωγαῖς का मूल अर्थ सभाएँ या एकत्र होने के स्थान है, और ἐθνῶν यहाँ इस्राएल से बाहर के राष्ट्रों/अन्यजातियों को सूचित कर सकता है। ‘सभाओं’ शब्द बाद के संस्थागत अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ἐν τοῖς ἄρχουσιν αὐτῶν
  choice: उनके शासकों के बीच
  rationale: ἄρχουσιν अधिकार रखने वाले शासकों या अगुओं को दर्शाता है; ‘के बीच’ हिन्दी में व्यक्ति-समूह के संदर्भ में स्वाभाविक है।
- source_word: ὡς μουσικὸν μέλος
  choice: एक मधुर गीत के समान
  rationale: μέλος संगीत की धुन, गीत या गेय अंश हो सकता है। ‘मधुर गीत’ साधारण पाठक के लिए स्वाभाविक है और संगीतात्मक उपमा को स्पष्ट रखता है।
- source_word: ἐν στόματι πάντων
  choice: सबके मुँह में
  rationale: मूल रूपक का निकट और स्वाभाविक हिन्दी रूप है, जिसका आशय सबके द्वारा गाया या कहा जाना हो सकता है; अनुवाद इस संभावना को खुला रखता है।
theological_decisions:
- issue: ‘वह’ की पहचान
  choice: सर्वनाम ‘वह’ को बिना व्याख्यात्मक संज्ञा जोड़े बनाए रखा गया
  alternative: संदर्भ के आधार पर किसी नाम या पदवी से उसकी पहचान करना
  rationale: इस पद में केवल निहित कर्ता है; उसकी पहचान जोड़ना मूल में उपस्थित अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: ‘युग की समाप्ति’ का अंतिमकालीन अर्थ
  choice: मूल वाक्यांश का सीधा अनुवाद
  alternative: ‘संसार के अंत तक’
  rationale: ‘संसार’ कहने से सृष्टि या पृथ्वी के विनाश का अधिक निश्चित भाव आ सकता है, जबकि αἰών मुख्यतः युग को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। वाक्य की काव्यात्मक उपमा सुरक्षित है; किसी संप्रदायगत या अतिरिक्त व्याख्या को पाठ में नहीं जोड़ा गया।
