base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/004.yaml
  text: And in holy books he shall be recorded, both his work and his word; and he shall be God's chosen one forever.
translation:
  language: hi
  text: और पवित्र पुस्तकों में उसका उल्लेख किया जाएगा—उसके कार्य और उसके वचन दोनों का भी; और वह सदा तक परमेश्वर का चुना हुआ होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν βίβλοις ἁγίαις
  choice: पवित्र पुस्तकों में
  rationale: ग्रीक बहुवचन को सीधे और स्वाभाविक हिंदी में रखा गया है; इसे बाद की किसी निश्चित धर्मग्रंथ-सूची तक सीमित नहीं किया गया।
- source_word: ἀναγραφόμενος
  choice: उसका उल्लेख किया जाएगा
  rationale: शब्द का भाव लिखित अभिलेख में दर्ज या वर्णित किए जाने का है; ‘उल्लेख किया जाएगा’ आधुनिक हिंदी में सहज है और वाक्य के कर्मवाच्य को बनाए रखता है।
- source_word: τὸ ἔργον καὶ ὁ λόγος αὐτοῦ
  choice: उसके कार्य और उसके वचन, दोनों का
  rationale: ἔργον और λόγος के एकवचन तथा समानांतर संरचना को सुरक्षित रखा गया है। ‘वचन’ λόγος की कथन/संदेश संबंधी व्यापकता और गरिमा बनाए रखता है।
- source_word: ἐκλεκτὸς Θεοῦ
  choice: परमेश्वर का चुना हुआ जन
  rationale: संज्ञात्मक विशेषण ἐκλεκτός को व्यक्ति के लिए स्वाभाविक हिंदी में व्यक्त किया गया है; इससे ‘चुना हुआ’ का धार्मिक अर्थ बना रहता है, पर पहचान को अनावश्यक रूप से अधिक निश्चित नहीं किया जाता।
- source_word: ἕως τοῦ αἰῶνος
  choice: सदा तक
  rationale: मुहावरे का कालगत अर्थ ‘युग तक/सदा तक’ है। संदर्भ और अंग्रेजी परामर्श-पाठ के अनुरूप ‘सदा तक’ सहज तथा गरिमापूर्ण है।
theological_decisions:
- issue: ἐκλεκτὸς Θεοῦ में उल्लिखित व्यक्ति की पहचान
  choice: परमेश्वर का चुना हुआ जन
  alternative: परमेश्वर का चुना हुआ
  rationale: ‘जन’ केवल हिंदी में संज्ञात्मक स्पष्टता देता है; पाठ में व्यक्ति को किसी विशिष्ट उपाधि या बाद की धर्मवैज्ञानिक पहचान से नहीं जोड़ा गया।
- issue: ἕως τοῦ αἰῶνος की अवधि
  choice: सदा तक
  alternative: युग तक
  rationale: ‘युग तक’ अधिक शब्दशः है, किंतु हिंदी में अवधि सीमित होने का भ्रम दे सकता है। ‘सदा तक’ इस मुहावरे के सामान्य दीर्घकालिक/अनंत भाव को स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण धार्मिक गद्य। मूल यूनानी की समांतरता और कर्मवाच्य संरचना को यथासंभव बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज बनाया गया है।
