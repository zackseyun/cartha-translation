  text: Καὶ ἐν βίβλοις ἁγίαις ἔσται ἀναγραφόμενος, καὶ τὸ ἔργον καὶ ὁ λόγος αὐτοῦ· καὶ ἔσται ἐκλεκτὸς Θεοῦ²³ *ἕως τοῦ²⁴ αἰῶνος.
