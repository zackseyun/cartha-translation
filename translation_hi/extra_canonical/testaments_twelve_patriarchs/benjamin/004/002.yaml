source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ¹⁰ ἀγαθὸς ⁹ἄνθρωπος⁹ οὐκ ἔχει σκοτεινὸν ὀφθαλμόν¹¹, ἐλεεῖ¹² γὰρ πάντας, κἂν *ἁμαρτωλοὶ ὦσιν¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/002.yaml
  text: For the good man does not have a dark eye, for he has mercy on all, even if they are sinners.
translation:
  language: hi
  text: क्योंकि भले मनुष्य की आँख अँधेरी नहीं होती; वह सब पर दया करता है, चाहे वे पापी ही क्यों न हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: भला मनुष्य
  rationale: यह यूनानी पद नैतिक रूप से अच्छे व्यक्ति को सूचित करता है; ‘भला मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: अँधेरी आँख
  rationale: शाब्दिक बिंब ‘अँधेरी आँख’ के रूप में सुरक्षित रखा गया है; इसे ‘बुरी नज़र’ जैसे व्याख्यात्मक पद में बदलने से मूल की रूपकात्मक अस्पष्टता घट जाती।
- source_word: ἐλεεῖ
  choice: दया करता है
  rationale: क्रिया का सीधा और स्वाभाविक हिन्दी प्रतिरूप, जिसमें करुणा और दयापूर्ण व्यवहार दोनों समाहित हैं।
- source_word: πάντας
  choice: सब पर
  rationale: सार्वभौमिक विस्तार को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: κἂν ἁμαρτωλοὶ ὦσιν
  choice: चाहे वे पापी ही क्यों न हों
  rationale: रियायती भाव ‘भले ही वे पापी हों’ को सहज आधुनिक हिन्दी में व्यक्त करता है और ‘ही’ विरोधाभास पर उचित बल देता है।
theological_decisions:
- issue: ‘अँधेरी आँख’ का नैतिक अथवा उदारता-संबंधी अर्थ
  choice: मूल रूपक को ‘अँधेरी आँख’ के रूप में बनाए रखा
  alternative: ‘बुरी नज़र’ या ‘कंजूस दृष्टि’
  rationale: संदर्भ संभवतः निर्दय या द्वेषपूर्ण दृष्टि की ओर संकेत करता है, पर यूनानी पाठ स्वयं अर्थ को स्पष्ट नहीं करता; इसलिए वास्तविक रूपकात्मक तनाव को अनिर्णीत रखा गया है।
- issue: पापियों के प्रति दया
  choice: ‘सब पर दया करता है, चाहे वे पापी ही क्यों न हों’
  alternative: ‘सभी पापियों को क्षमा करता है’
  rationale: ἐλεεῖ का अर्थ दया करना है, अनिवार्यतः पापों की औपचारिक क्षमा देना नहीं; अतः अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। यूनानी वाक्य के कारणात्मक संबंध को ‘क्योंकि’ और अर्धविराम से स्पष्ट रखा गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
