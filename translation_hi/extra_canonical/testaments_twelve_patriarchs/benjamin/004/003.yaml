source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⸢Κἂν *μὴ βούλωνται περὶ αὐτοῦ εἰς καλά¹⁴, *οὗτος τὸ ἀγαθὸν ποιῶν¹⁵ νικᾷ τὸ κακόν, σκεπόμενος¹⁶ ὑπὸ τοῦ Θεοῦ¹⁷⸣. τοὺς †ἀδικοῦντας¹⁸ ἀγαπᾷ ὡς τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/003.yaml
  text: And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.
translation:
  language: hi
  text: और यदि वे उसके प्रति भलाई का इरादा न भी रखें, तो वह भलाई करके बुराई पर विजय पाता है, परमेश्वर की सुरक्षा में रहते हुए। वह अपने साथ अन्याय करने वालों से अपने प्राण के समान प्रेम करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ αὐτοῦ εἰς καλά
  choice: उसके प्रति भलाई का इरादा
  rationale: यह वाक्यांश दूसरों की उसके विषय में भली मंशा को व्यक्त करता है; हिन्दी में यह स्वाभाविक रहते हुए मूल अर्थ को बनाए रखता है।
- source_word: νικᾷ τὸ κακόν
  choice: बुराई पर विजय पाता है
  rationale: νικάω के विजय पाने और τὸ κακόν के बुराई अर्थ को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: क्योंकि परमेश्वर उसे अपनी शरण में रखता है
  rationale: मध्य/कर्मवाच्य कृदन्त में परमेश्वर द्वारा सुरक्षा या आच्छादन का भाव है; 'अपनी शरण में रखता है' आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τοὺς ἀδικοῦντας
  choice: जो उसके साथ अन्याय करते हैं
  rationale: ἀδικέω का सामान्य अर्थ अन्याय करना या गलत व्यवहार करना है; पाठगत चिह्न के बावजूद उपलब्ध यूनानी पाठ का अर्थ सुरक्षित रखा गया है।
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: अपने प्राण के समान
  rationale: ψυχή को यहाँ व्यक्ति के अपने जीवन/प्राण के अर्थ में लिया गया है; इससे मूल उपमा की तीव्रता बनी रहती है।
theological_decisions:
- issue: भलाई करके बुराई पर विजय पाने और परमेश्वर की सुरक्षा के बीच संबंध
  choice: कृदन्त को कारणात्मक रूप में 'क्योंकि' से जोड़ा गया
  alternative: '''परमेश्वर की शरण में रहते हुए'''
  rationale: σκεπόμενος परिस्थितिजन्य अथवा कारणात्मक दोनों रूपों में समझा जा सकता है। प्रसंग में परमेश्वर की सुरक्षा उसके विजय पाने की आधारभूमि बताती है, पर मूल की धार्मिक तनावपूर्ण निकटता को किसी विस्तृत सिद्धान्त में नहीं बदला गया।
- issue: शत्रु या अन्यायी से प्रेम की तीव्रता
  choice: अपने प्राण के समान प्रेम
  alternative: अपने आप के समान प्रेम
  rationale: ψυχή के स्पष्ट शब्दचित्र को बनाए रखा गया है और इसे अधिक परिचित धार्मिक सूत्र में बदलकर मूल की विशिष्ट अभिव्यक्ति को नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। वाक्य-संरचना मूल यूनानी के तर्कक्रम को बनाए रखते हुए हिन्दी के स्वाभाविक प्रवाह के अनुसार ढाली गई है।
