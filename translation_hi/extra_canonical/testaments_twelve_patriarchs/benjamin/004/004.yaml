id: T12P.BEN.4.4
reference: Testament of Benjamin 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἐάν¹⁹ τις δοξάζηται²⁰, οὐ²¹ φθονεῖ αὐτόν²²· ἐάν τις πλουτεῖ²³, οὐ ζηλοῖ²⁴· *ἐάν τις ἀνδρεῖος²⁵, ἐπαινεῖ²⁶ αὐτόν²⁷· τὸν σώφρονα ἀγαπῶν²⁸· ⸀τὸν πένητα ἐλεεῖ²⁹· *τῷ ἀσθενοῦντι³⁰ συμπάσχει³¹· τὸν Θεὸν φοβεῖται³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/004.yaml
  text: If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.
translation:
  language: hi
  text: यदि किसी को महिमा मिलती है, तो वह उससे ईर्ष्या नहीं करता; यदि कोई धनी हो जाता है, तो वह उससे जलता नहीं; यदि कोई वीर है, तो वह उसकी प्रशंसा करता है; वह संयमी व्यक्ति से प्रेम करता है; निर्धन पर दया करता है; दुर्बल के दुःख में सहभागी होता है; और परमेश्वर का भय मानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζηται
  choice: महिमा मिलती है
  rationale: मध्य/कर्मवाच्य रूप का स्वाभाविक हिन्दी रूप, जिसमें किसी व्यक्ति के सम्मानित या महिमान्वित होने का भाव बना रहता है।
- source_word: φθονεῖ
  choice: ईर्ष्या नहीं करता
  rationale: दूसरे को मिले सम्मान के कारण होने वाली ईर्ष्या को सीधे व्यक्त करता है।
- source_word: ζηλοῖ
  choice: जलता नहीं
  rationale: धनवान व्यक्ति के प्रति ईर्ष्यालु प्रतिक्रिया को सामान्य आधुनिक हिन्दी में व्यक्त करता है और निकटवर्ती φθονεῖ से शैलीगत भेद भी रखता है।
- source_word: ἀνδρεῖος
  choice: वीर
  rationale: साहस और शौर्य से युक्त व्यक्ति के लिए संक्षिप्त, प्रतिष्ठित और सहज शब्द।
- source_word: σώφρονα
  choice: संयमी व्यक्ति
  rationale: आत्मसंयम और विवेकपूर्ण आचरण का केंद्रीय भाव व्यक्त करता है, बिना अर्थ को केवल लैंगिक या बौद्धिक गुण तक सीमित किए।
- source_word: πένητα
  choice: निर्धन
  rationale: साधनों से वंचित गरीब व्यक्ति के लिए dignified आधुनिक हिन्दी शब्द।
- source_word: τῷ ἀσθενοῦντι
  choice: दुर्बल
  rationale: शारीरिक बीमारी तक अर्थ सीमित किए बिना कमजोरी या असमर्थता का व्यापक भाव सुरक्षित रखता है।
- source_word: συμπάσχει
  choice: दुःख में सहभागी होता है
  rationale: शाब्दिक रूप से ‘साथ दुःख सहना’ का स्वाभाविक हिन्दी रूप; केवल सहानुभूति महसूस करने से अधिक सहभागिता दर्शाता है।
- source_word: τὸν Θεὸν φοβεῖται
  choice: परमेश्वर का भय मानता है
  rationale: φοβεῖται के ‘भय/श्रद्धामय भय’ को पारंपरिक किंतु आज भी स्पष्ट हिन्दी अभिव्यक्ति में सुरक्षित रखता है; इसे स्तुति में नहीं बदलता।
theological_decisions:
- issue: τὸν Θεὸν φοβεῖται में ईश्वर के प्रति भाव
  choice: परमेश्वर का भय मानता है
  alternative: परमेश्वर का आदर करता है
  rationale: मूल क्रिया φοβεῖται स्पष्टतः भय का शब्द है। ‘आदर’ उसका संभावित धार्मिक आशय समझा सकता है, पर मूल की तनावपूर्ण और बहुअर्थी धार को नरम कर देगा।
- issue: συμπάσχει की सहभागितापूर्ण पीड़ा
  choice: दुर्बल के दुःख में सहभागी होता है
  alternative: दुर्बल से सहानुभूति रखता है
  rationale: मूल में केवल भावनात्मक सहानुभूति नहीं, बल्कि साथ दुःख सहने का विचार है; इसलिए अधिक सशक्त अभिव्यक्ति चुनी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। समानांतर शर्तीय वाक्यों और गुण-सूची की लय को बनाए रखा गया है। अंतिम खंड से पहले ‘और’ जोड़कर हिन्दी में सूची का स्वाभाविक समापन किया गया है।
