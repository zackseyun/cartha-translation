  text: And he loves the one who has the grace of a good spirit as his own soul.
translation:
  language: hi
  text: और जिसके पास भले आत्मा का अनुग्रह है, उससे वह अपने प्राण के समान प्रेम करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ἔχοντα
  choice: जिसमें ... है
  rationale: यह उस व्यक्ति को दर्शाता है जिसके पास या जिसमें आगे बताई गई कृपा विद्यमान है; हिन्दी में यह रचना स्वाभाविक है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: यह χάρις के कृपा/अनुग्रह के अर्थ को बनाए रखता है और धार्मिक संदर्भ में सहज है।
- source_word: ἀγαθοῦ πνεύματος
  choice: भली आत्मा का
  rationale: 'सम्बन्धकारक पदबंध को जानबूझकर खुला रखा गया है: इसका अर्थ भली आत्मा से मिलने वाला अनुग्रह या भली आत्मा से संबंधित अनुग्रह हो सकता है।'
- source_word: ἀγαπᾷ
  choice: प्रेम करता है
  rationale: क्रिया के वर्तमानकालीन और व्यक्तिगत प्रेम के अर्थ को सीधे व्यक्त करता है।
- source_word: κατὰ τὴν ψυχὴν αὐτοῦ
  choice: अपनी जान के समान
  rationale: κατά को तुलना के भाव में और ψυχή को व्यक्ति के अपने जीवन/प्राण के अर्थ में प्रस्तुत करता है; यह सामान्य हिन्दी में गहरी आत्मीयता व्यक्त करता है।
theological_decisions:
- issue: ἀγαθοῦ πνεύματος में πνεῦμα का आशय
  choice: भली आत्मा
  alternative: भले स्वभाव / पवित्र आत्मा
  rationale: मूल में न तो निश्चित उपपद है, न ऐसा स्पष्ट संकेत कि इसे पवित्र आत्मा का विशिष्ट नाम माना जाए। इसलिए व्यापक और वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: χάριν और ἀγαθοῦ πνεύματος का संबंध
  choice: भली आत्मा का अनुग्रह
  alternative: भली आत्मा से मिला अनुग्रह / भले स्वभाव की मनोहरता
  rationale: सम्बन्धकारक की व्याख्या को अत्यधिक निश्चित किए बिना मूल संरचना के निकट अभिव्यक्ति चुनी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त और सामान्य पाठक के लिए सहज शैली। ‘अपनी जान के समान’ बाइबिलीय गंभीरता रखते हुए स्वाभाविक हिन्दी है।
