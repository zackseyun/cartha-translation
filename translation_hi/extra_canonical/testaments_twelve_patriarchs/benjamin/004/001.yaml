base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/001.yaml
  text: See then, my children, the end of the good man. Imitate [in goodness] because of his compassion, so that you also may wear crowns of glory.
translation:
  language: hi
  text: 4:1 इसलिए, मेरे बच्चो, भले मनुष्य के अंत को देखो। उसकी करुणा के कारण भलाई में[a] अनुकरण करो, ताकि तुम भी महिमा के मुकुट धारण करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भलाई में’ शब्द संस्करण में कोष्ठकों के भीतर हैं; पाठ की यह अभिव्यक्ति अनिश्चित है।
    reason: मूल संस्करण की पाठ-संबंधी अनिश्चितता को पाठक के लिए दृश्यमान रखना।
lexical_decisions:
- source_word: τέλος
  choice: अंत
  rationale: यह मूल शब्द के व्यापक अर्थ को बनाए रखता है; यहाँ इसे केवल ‘परिणाम’ या ‘मृत्यु’ मानकर अर्थ को सीमित नहीं किया गया।
- source_word: ἀγαθοῦ ἀνδρός
  choice: भले मनुष्य
  rationale: यह नैतिक भलाई का स्वाभाविक और आधुनिक हिन्दी रूप है।
- source_word: μιμήσασθε
  choice: उसका अनुकरण करो
  rationale: यूनानी क्रिया का अर्थ ‘अनुकरण करना’ है। हिन्दी में स्वाभाविकता के लिए संदर्भ से स्पष्ट कर्म ‘उसका’ व्यक्त किया गया है।
- source_word: εὐσπλαγχνίαν
  choice: करुणा
  rationale: यह गहरी दया और सहृदयता को संक्षिप्त, dignified आधुनिक हिन्दी में व्यक्त करता है।
- source_word: στεφάνους δόξης φορέσητε
  choice: महिमा के मुकुट धारण करो
  rationale: मूल के बहुवचन मुकुट और ‘पहनने/धारण करने’ के रूपक को बनाए रखा गया है।
theological_decisions:
- issue: भले मनुष्य के ‘अंत’ का आशय
  choice: अंत
  alternative: परिणाम / मृत्यु
  rationale: τέλος में अंत, परिणति या परिणाम की संभावित अर्थ-छाया है। अनुवाद ने किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं किया।
- issue: महिमा के मुकुट
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: महिमामय प्रतिफल पाओ
  rationale: मूल का मुकुट-संबंधी चित्र धार्मिक प्रतिफल की व्याख्या किए बिना संरक्षित किया गया।
- issue: करुणा और अनुकरण के बीच कारण-संबंध
  choice: ‘उसकी करुणा के कारण’
  alternative: ‘उसकी करुणा का अनुकरण करो’
  rationale: मूल में διά के कारण-संबंध को बनाए रखा गया; उसे चुपचाप अनुकरण का प्रत्यक्ष कर्म नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन आत्मीय किंतु गरिमापूर्ण है। वाक्य सरल रखे गए हैं और मूल की आज्ञार्थक शैली तथा मुकुट के रूपक को सुरक्षित रखा गया है।
