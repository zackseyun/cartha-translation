  text: IV. ¹Ἴδετε¹ οὖν², *τέκνα μου³, τοῦ ἀγαθοῦ ἀνδρὸς⁴ τὸ τέλος⁵. μιμήσασθε⁶ [* ἐν ἀγαθῇ διὰ⁷ τὴν εὐσπλαγχνίαν⁷ αὐτοῦ, ἵνα ⁸καὶ ὑμεῖς⁷ στεφάνους⁸ δόξης φορέσητε⁹.
