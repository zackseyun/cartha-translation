review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal sequence and the literal, ambiguous burial phrase. However, “मिस्र से निकलने के इक्यानवेवें वर्ष में” does not clearly express the source’s temporal relation (“in the ninety-first year after the departure”); adding “बाद” resolves this. “ऊपर पहुँचाईं” is overly mechanical in Hindi for ἀνήγαγον; “ऊपर ले गए” retains the upward-motion component more naturally.
  naturalness: The proposed revision uses idiomatic modern Hindi while retaining the source’s compactness and ambiguity. “उन्हें ... दफनाया” is more natural than using “गाड़ दिया” for ancestral bones in this formal narrative register.
  terminology: “इस्राएल के पुत्र,” “कनान,” and “हेब्रोन” are retained. “पिताओं” is preserved for πατέρων and its deliberate repetition. The footnote keeps the literal wording but avoids implying with certainty that a direct-at-the-feet reading is excluded.
  issues:
  - severity: medium
    issue: The temporal phrase lacks an explicit equivalent of “after.”
    rationale: The Greek construction and English audit trail specify that the ninety-first year is reckoned after Israel’s departure from Egypt. The Hindi wording can be read as the ninety-first year of the departure event rather than elapsed time following it.
  - severity: low
    issue: “ऊपर पहुँचाईं” is awkward for transporting bones.
    rationale: Although it attempts to represent the upward sense of ἀνήγαγον, “ऊपर ले गए” is the normal Hindi expression and retains that sense.
  - severity: low
    issue: The footnote states the indirect-burial interpretation too categorically.
    rationale: The Greek phrase is literal and ambiguous. The note should say that it may refer to placement near ancestral tombs, not deny a direct spatial sense.
  revised_text: और इस्राएल के पुत्रों के मिस्र से निकलने के इक्यानवे वर्ष बाद, वे और उनके भाई कनान के युद्ध में अपने पिताओं की हड्डियाँ गुप्त रूप से ऊपर ले गए और उन्हें हेब्रोन में अपने पिताओं के पैरों के पास[a] दफनाया।
