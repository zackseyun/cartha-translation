base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/003.yaml
  text: And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly in the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].
translation:
  language: hi
  text: और इस्राएल के पुत्रों के मिस्र से निकलने के इक्यानवे वर्ष बाद, वे और उनके भाई कनान के युद्ध में अपने पिताओं की हड्डियाँ गुप्त रूप से ऊपर ले गए और उन्हें हेब्रोन में अपने पिताओं के पैरों के पास[a] दफनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने पिताओं के पैरों के पास’ यूनानी का शाब्दिक रूप है। इसका आशय पूर्वजों की कब्रों के निकट दफनाने के स्थान से हो सकता है, न कि अनिवार्यतः सीधे उनके पैरों के पास।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνενηκοστῷ πρώτῳ ἔτει
  choice: इक्यानवेवें वर्ष में
  rationale: यूनानी क्रमवाचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου
  choice: इस्राएल के पुत्रों के मिस्र से निकलने के
  rationale: ἐξόδου को यहाँ किसी तकनीकी धार्मिक पद के बजाय ऐतिहासिक प्रस्थान के अर्थ में ‘निकलने’ से व्यक्त किया गया है; ‘इस्राएल के पुत्र’ υἱῶν Ἰσραήλ की संरचना बनाए रखता है।
- source_word: ἀνήγαγον
  choice: ऊपर पहुँचाईं
  rationale: क्रिया में ऊपर ले जाने/पहुँचाने का भाव है; यह हड्डियों को हेब्रोन की ओर ले जाने की गति को बनाए रखता है।
- source_word: ἐν κρυφῇ
  choice: गुप्त रूप से
  rationale: क्रियाविशेषणीय वाक्यांश का स्पष्ट आधुनिक हिन्दी रूप।
- source_word: ἐν τῷ πολέμῳ Χαναάν
  choice: कनान के युद्ध में
  rationale: स्रोत की संक्षिप्त और कुछ असामान्य रचना को अनावश्यक रूप से ‘के समय’ या अन्य व्याख्यात्मक शब्द जोड़कर निश्चित नहीं किया गया।
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: अपने पिताओं के पैरों के पास
  rationale: यूनानी स्थान-सूचक वाक्यांश को निकटता से रखा गया है; सम्भावित समाधि-स्थान संबंधी आशय पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘पिताओं के पैरों के पास’ का आशय
  choice: मुख्य पाठ में शाब्दिक और अस्पष्ट अभिव्यक्ति बनाए रखी गई
  alternative: ‘अपने पूर्वजों की कब्रों के पास’
  rationale: यूनानी पाठ सीधे ‘पैरों के पास’ कहता है। इसे ‘कब्रों के पास’ कर देना सम्भावित आशय को पाठ में निश्चित कर देता, इसलिए वह व्याख्या केवल पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पिताओं’ को दोनों स्थानों पर बनाए रखने से यूनानी πατέρων की पुनरावृत्ति और वंशगत संदर्भ सुरक्षित रहता है; पादटिप्पणी सम्भावित समाधि-संबंधी अर्थ स्पष्ट करती है, पर मुख्य पाठ की अस्पष्टता नहीं मिटाती।
