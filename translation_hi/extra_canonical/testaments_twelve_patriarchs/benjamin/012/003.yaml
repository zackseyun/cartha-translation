  to: और इस्राएल के पुत्रों के मिस्र से निकलने के इक्यानवे वर्ष बाद, वे और उनके भाई कनान के युद्ध में अपने पिताओं की हड्डियाँ गुप्त रूप से ऊपर ले गए और उन्हें हेब्रोन में अपने पिताओं के पैरों के पास[a] दफनाया।
