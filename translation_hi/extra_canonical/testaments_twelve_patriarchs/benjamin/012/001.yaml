translation:
  language: hi
  text: और ये बातें कहकर उसने अपने पैर फैलाए और अच्छी [और भली][a] नींद सो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी संस्करण में “और भली” शब्द कोष्ठकों में हैं, जो उनकी पाठगत अनिश्चितता दर्शाते हैं।
    reason: स्रोत-पाठ में कोष्ठकित पद की अनिश्चित स्थिति को पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: उसने अपने पैर सीधे किए
  rationale: यह यूनानी अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; इससे मृत्यु से पहले पैर फैलाने या सीधा करने की क्रिया स्पष्ट रहती है।
- source_word: ἐκοιμήθη
  choice: नींद सो गया
  rationale: मूल क्रिया का सीधा अर्थ ‘सो गया’ है। प्रसंग में यह मृत्यु के लिए मृदु संकेत भी हो सकता है, इसलिए अनुवाद में ‘मर गया’ कहकर निहित अर्थ को स्पष्ट नहीं किया गया।
- source_word: καλῷ [καὶ ἀγαθῷ]
  choice: अच्छी [और भली]
  rationale: दो निकटार्थी यूनानी विशेषणों को अलग-अलग हिन्दी शब्दों से व्यक्त किया गया है और संस्करण में दूसरे पद की पाठगत अनिश्चितता को कोष्ठकों द्वारा बनाए रखा गया है।
theological_decisions:
- issue: ἐκοιμήθη में नींद और मृत्यु के बीच अर्थगत तनाव
  choice: नींद सो गया
  alternative: मर गया
  rationale: यूनानी पाठ नींद की भाषा का प्रयोग करता है, जो प्रसंग में मृत्यु का संकेत देती है। प्रत्यक्षतः ‘मर गया’ करने से मूल रूपक और उसकी संभावित धार्मिक ध्वनि समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पैर सीधे किए’ और ‘नींद सो गया’ सामान्य पाठक के लिए स्वाभाविक हैं तथा मृत्यु-संबंधी मूल व्यंजना को बिना अतिव्याख्या के सुरक्षित रखते हैं।
