source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Οἱ δὲ υἱοὶ αὐτοῦ ἐποίησαν ὡς προσέταξεν αὐτοῖς, καὶ ἄραντες τὸ σῶμα αὐτοῦ ἔθαψαν αὐτὸ⁴ ἐν Χεβρὼν μετὰ τῶν πατέρων αὐτοῦ. Καὶ⁶ *ὡς ἐπλήρωσε τοὺς λόγους αὐτοῦ⁷ εἶπεν⁸. Ἐντέλλομαι ὑμῖν, *τέκνα μου⁹, ἀνενέγκατε¹⁰ τὰ ὀστᾶ μου ἐξ Αἰγύπτου, καὶ *θάψατέ με¹¹ εἰς¹² Χεβρὼν ἐγγὺς¹³ τῶν πατέρων μου. 2. Καὶ¹⁴ ἀπέθανε Βενιαμίν¹⁵ *ἑκατὸν εἴκοσι πέντε¹⁶ ἐτῶν ἐν γήρει καλῷ· καὶ ἔθηκαν αὐτὸν ἐν παραθήκῃ¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/002.yaml
  text: 'And his sons did as he had commanded them, and they carried his body and buried him in Hebron with his fathers.


    And when he had finished his words, he said, “I command you, my children, carry my bones up out of Egypt, and bury me in Hebron near my fathers.”

    And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.'
translation:
  language: hi
  text: 'और उसके पुत्रों ने वैसा ही किया जैसा उसने उन्हें आज्ञा दी थी। वे उसका शव उठाकर ले गए और उसे हेब्रोन में उसके पूर्वजों के साथ दफ़ना दिया।


    जब वह अपनी बातें पूरी कर चुका, तो उसने कहा, “मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ कि मेरी हड्डियाँ मिस्र से ऊपर ले जाना और मुझे हेब्रोन में मेरे पूर्वजों के पास दफ़नाना।”


    और बिन्यामीन एक सौ पच्चीस वर्ष की आयु में, अच्छी वृद्धावस्था में मर गया; और उन्होंने उसे एक ताबूत में रखा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी παραθήκη का मूल अर्थ किसी वस्तु को रखे या सौंपे जाने का स्थान है। इस प्रसंग में “ताबूत” सबसे स्वाभाविक अर्थ है, यद्यपि शब्द अपने-आप में ताबूत का विशिष्ट नाम नहीं है।
    reason: मुख्य पाठ में प्रसंगानुकूल ठोस अर्थ दिया गया है, जबकि टिप्पणी यूनानी शब्द की व्यापकता और शेष अनिश्चितता को सुरक्षित रखती है।
lexical_decisions:
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: उसका शव उठाकर ले गए
  rationale: मृत व्यक्ति के σώμα के लिए ‘शव’ स्वाभाविक और प्रसंगानुकूल है; ἄραντες में उठाकर ले जाने का भाव सुरक्षित रखा गया है।
- source_word: μετὰ τῶν πατέρων αὐτοῦ / ἐγγὺς τῶν πατέρων μου
  choice: उसके पूर्वजों के साथ / मेरे पूर्वजों के पास
  rationale: πατέρες यहाँ वंश के पहले मृत जनों को दर्शाता है; आधुनिक हिन्दी में ‘पूर्वज’ अधिक स्पष्ट और स्वाभाविक है। साथ और पास के यूनानी भेद को भी बनाए रखा गया है।
- source_word: ἀνενέγκατε
  choice: ऊपर ले जाना
  rationale: क्रिया के दिशात्मक ‘ऊपर ले जाने’ के भाव को बनाए रखा गया है, जैसा मिस्र से कनान की ओर जाने के पारंपरिक वर्णन में होता है।
- source_word: ἐν γήρει καλῷ
  choice: अच्छे बुढ़ापे में
  rationale: यूनानी पद का सरल और निकट अर्थ रखा गया है, बिना ‘पूर्ण आयु’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: ἐν παραθήκῃ
  choice: सुरक्षित रख दिया
  rationale: παραθήκη का मूल अर्थ किसी वस्तु को संरक्षण या सुपुर्दगी में रखना है। ‘ताबूत’ संभव प्रसंगगत अर्थ है, पर यूनानी शब्द स्वयं उसे स्पष्ट रूप से नहीं कहता।
theological_decisions:
- issue: मृत्यु, दफ़न और अंतिम आज्ञा का कथात्मक क्रम
  choice: प्राप्त यूनानी पाठ का क्रम यथावत रखा गया
  alternative: घटनाओं को कालक्रमानुसार पुनर्व्यवस्थित करना
  rationale: पाठ में पहले शव दफ़नाने और फिर अंतिम वचन कहने का असामान्य क्रम है। इसे चुपचाप सुधारना स्रोत की वास्तविक पाठगत कठिनाई को मिटा देता।
- issue: παραθήκη को ‘ताबूत’ मानना
  choice: मुख्य पाठ में व्यापक अर्थ ‘सुरक्षित रख दिया’ रखा और टिप्पणी में विकल्प बताया
  alternative: ‘उसे ताबूत में रखा’
  rationale: दफ़नाने के लिए बाद में हड्डियाँ ले जाने की आज्ञा के संदर्भ में ताबूत संभव है, किंतु उपलब्ध यूनानी शब्द का प्रत्यक्ष अर्थ अधिक व्यापक है; इसलिए अनिश्चितता संरक्षित की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘मेरे बच्चो’ संबोधन आत्मीय और स्वाभाविक है। स्रोत में मौजूद असामान्य कथात्मक क्रम को संपादकीय रूप से नहीं बदला गया।
