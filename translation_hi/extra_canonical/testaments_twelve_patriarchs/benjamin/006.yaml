  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar’s deceit[a], for the angel of peace guides his soul. He does not look with passion on perishable things, nor does he gather wealth for pleasure. He does not delight in pleasure, nor grieve his neighbor; he is not filled with luxury, nor led astray by the wanderings of the eyes. For the Lord is his portion. A good purpose does not accept the glory or the dishonor that comes from men, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him and gives light to his soul, and he rejoices toward all people at all times. The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, of poverty and wealth; rather, it has one sincere and pure disposition toward all. It does not have double sight or hearing; for in everything that it does, or speaks, or sees, it knows that the Lord is looking on his soul. And it cleanses
    the mind, so as not to be condemned by men and by God. But the disposition of Beliar is twofold, and it has no singleness. Flee, therefore, evil-mindedness, my children, and love the good mind, which the law of God knows, so that you may rest in hope, because the good-minded man does not have a darkened eye. He shows mercy to all, even if they are sinners; even if they devise evil against him, by doing good he overcomes evil, being shielded by what is good. And he loves the righteous as his own soul. If anyone is glorified, he does not envy him; if anyone is enriched, he is not jealous; if anyone is valiant, he praises him; the virtuous man he commends; on the poor man he has mercy; with the weak he has compassion; to God he sings praise[d][c][b]. The one who has the grace of a good spirit he loves as his own soul.
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 6**


    **1** भले मनुष्य का संकल्प[a] बेलियार[b] की भरमानेवाली आत्मा के वश में नहीं होता, क्योंकि शान्ति का स्वर्गदूत उसके प्राण को मार्ग दिखाता है। **2** वह नाशवान वस्तुओं को लालसा की दृष्टि से नहीं देखता और न सुखभोग के लिए धन इकट्ठा करता है। **3** वह सुख में आनन्द नहीं खोजता, अपने पड़ोसी को दुःखी नहीं करता, विलासिता से तृप्त नहीं होता और आँखों के भटकाव में बहक नहीं जाता। क्योंकि प्रभु ही उसका भाग है। **4** भला संकल्प मनुष्यों से मिलने वाली महिमा या अपमान को स्वीकार नहीं करता और वह छल, झूठ, झगड़े या निन्दा को नहीं जानता। क्योंकि प्रभु उसके भीतर निवास करता है, उसके प्राण को प्रकाश देता है, और वह हर समय सब लोगों के प्रति आनन्दित रहता है। **5** भली मनोवृत्ति की दो जीभें[c] नहीं होतीं—आशीष और शाप की, अपमान और आदर की, शान्तता और अशान्ति की, कपट और सत्य की, गरीबी और धन की। इसके बजाय, वह सबके प्रति एक ही निष्कपट और शुद्ध भाव रखती है। **6** उसकी दृष्टि या सुनना दोहरा नहीं होता; क्योंकि वह जो कुछ करती, कहती या देखती है, उसमें जानती है कि प्रभु उसके प्राण की जाँच करता है। **7** वह अपने मन को शुद्ध करती
    है, ताकि वह मनुष्यों से और उसी प्रकार परमेश्वर से भी दोषी न ठहराई जाए। परन्तु बेलियार के काम दोहरे हैं और उनमें कोई एकरूपता नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘संकल्प’ (διαβούλιον) का अनुवाद ‘अभिप्राय’, ‘निश्चय’ या ‘परामर्श’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बेलियार’ इस यूनानी साक्ष्य में आए नाम का रूप है; बहुत-से पाठक इसे ‘बेलियाल’ नाम से जानते होंगे।
    reason: lexical_alternative
  - marker: c
    text: ‘दो जीभें’ मूल का सजीव रूपक है। यह केवल झूठ बोलने को नहीं, बल्कि परस्पर विरोधी ढंग से बोलने और व्यवहार करने वाले दोहरेपन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβούλιον
  choice: संकल्प
  rationale: यहाँ शब्द भले मनुष्य के स्थिर नैतिक अभिप्राय या निश्चय को दर्शाता है। ‘संकल्प’ इस इच्छात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πλάνης πνεύματος Βελίαρ
  choice: बेलियार की भरमानेवाली आत्मा
  rationale: πλάνη में भटकाव, भ्रम और धोखे का अर्थ-क्षेत्र है। ‘भरमानेवाली’ सक्रिय नैतिक-आध्यात्मिक गुमराह करने की शक्ति व्यक्त करता है, जबकि आत्मा और बेलियार के संबंध को खुला रखता है।
- source_word: ἐμπαθῶς
  choice: लालसा की दृष्टि से
  rationale: यह अव्यवस्थित इच्छा का व्यापक अर्थ देता है, केवल यौन कामना का नहीं; प्रसंग नाशवान वस्तुओं और धन का है।
- source_word: τὰ φθαρτά
  choice: नाशवान वस्तुएँ
  rationale: यह क्षणभंगुर भौतिक वस्तुओं और ‘प्रभु ही उसका भाग है’ के बीच विरोध को सुरक्षित रखता है।
- source_word: εἰς φιληδονίαν
  choice: सुखभोग के लिए
  rationale: यह धन-संचय के लक्ष्य के रूप में आत्मतुष्टि और भोग को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: आँखों के भटकाव
  rationale: 'मूल का दृश्य रूपक सुरक्षित रहता है: इच्छा से चंचल होकर इधर-उधर जाती दृष्टि।'
- source_word: μερὶς
  choice: भाग
  rationale: ‘प्रभु ही उसका भाग है’ शास्त्रीय-वाचिक विरासत और अपने सच्चे हिस्से या प्राप्ति का भाव बनाए रखता है।
- source_word: διάνοια / διάθεσιν
  choice: मनोवृत्ति / भाव
  rationale: इस अनुच्छेद में διάνοια केवल बौद्धिक क्षमता नहीं, बल्कि नैतिक रूप से अभिमुख भीतरी मन है। διάθεσις के लिए ‘भाव’ सबके प्रति स्थिर आन्तरिक रुख को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπισκέπτει
  choice: जाँच करता है
  rationale: यहाँ प्रभु के देखने, निरीक्षण करने और नैतिक लेखा लेने का भाव है; ‘जाँच’ इसे ‘भेंट करने’ की अपेक्षा प्रसंगानुकूल स्पष्ट करता है।
- source_word: ἁπλότητα
  choice: सरलता
  rationale: ‘सरलता’ दोहरेपन के विपरीत निष्कपट एकरूपता का अर्थ रखती है; इसे केवल ‘ईमानदारी’ कहने से अध्याय का एक बनाम दो का रूपक दब जाता।
theological_decisions:
- issue: Βελίαρ के नाम का रूप
  choice: बेलियार
  alternative: बेलियाल
  rationale: प्रस्तुत यूनानी साक्ष्य Βελίαρ देता है। इसलिए परिचित हिब्रू-आधारित रूप में सामान्यीकृत करने के बजाय इसी साक्ष्य का लिप्यन्तरण रखा गया है।
- issue: प्रभु किसकी जाँच करता है
  choice: प्रभु उसके प्राण की जाँच करता है
  alternative: प्रभु उसके मन को देख रहा है
  rationale: ψυχή को ‘प्राण’ और ἐπισκέπτει को ‘जाँच करता है’ कहकर मूल के आत्मिक तथा नैतिक निरीक्षण के तनाव को बनाए रखा गया है, बिना किसी विशिष्ट अन्तिम-न्याय सिद्धान्त को जोड़ने के।
- issue: मनुष्यों और परमेश्वर द्वारा दोषी ठहराया जाना
  choice: दोनों को मूल के अनुसार समानांतर रखा
  alternative: केवल परमेश्वर के न्याय को निर्णायक बताना
  rationale: मूल पाठ मनुष्यों और परमेश्वर दोनों का उल्लेख करता है। अनुवाद इस असहज समानांतरता को धार्मिक व्याख्या द्वारा हल्का या पुनर्व्यवस्थित नहीं करता।
- issue: अंग्रेज़ी परामर्श-पाठ में यूनानी उद्धरण से आगे की सामग्री
  choice: केवल उपलब्ध कराए गए यूनानी मूल-पाठ का अनुवाद किया
  alternative: अंग्रेज़ी POB में उपस्थित आगे के उपदेश को भी जोड़ना
  rationale: प्रस्तुत मूल-भाषा स्रोत इस अंश में ‘उनमें कोई सरलता नहीं’ पर समाप्त होता है। आगे की अंग्रेज़ी सामग्री के लिए यहाँ यूनानी स्रोत-साक्ष्य नहीं दिया गया; अतः उसे अपारदर्शी अंग्रेज़ी आधार से हिन्दी में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज उपदेशात्मक शैली रखी गई है। ‘प्रभु ही उसका भाग है’, ‘शान्ति का दूत’ और ‘दो जीभें’ जैसे मूल के शास्त्रीय रूपक सुरक्षित हैं। अत्यधिक संस्कृतनिष्ठ विकल्पों से बचते हुए ‘मनोवृत्ति’, ‘निष्कपट’ और ‘सुखभोग’ जैसे व्यापक रूप से बोधगम्य शब्द चुने गए हैं।
