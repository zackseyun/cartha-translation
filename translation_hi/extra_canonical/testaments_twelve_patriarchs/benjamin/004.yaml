  to: '**बिन्यामीन का वसीयतनामा 4**


    1[a]. इसलिए, मेरे बच्चों, भले मनुष्य के जीवन का परिणाम देखो। उसकी करुणा के कारण उस भले मनुष्य का अनुकरण करो, ताकि तुम भी महिमा के मुकुट पहनो।


