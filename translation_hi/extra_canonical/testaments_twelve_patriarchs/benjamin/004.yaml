- issue: अध्याय के आरम्भ से पहले OCR परत में ‘परमेश्वर के मेमने’ और निर्दोष के अधर्मियों के लिए मरने संबंधी पंक्तियाँ
  choice: स्पष्ट अध्यायारम्भ ‘इसलिए, मेरे बच्चो’ से अनुवाद आरम्भ किया गया और पूर्ववर्ती पंक्तियों को मुख्य पाठ में शामिल नहीं किया गया।
  alternative: उन मसीह-संबंधी और प्रायश्चित्त-संबंधी पंक्तियों को अध्याय 4 के आरम्भ का भाग मानना।
  rationale: प्रस्तुत यूनानी अध्याय-पाठ इस संबोधन से एक सुसंगत नैतिक उपदेश आरम्भ करता है, जबकि पूर्ववर्ती सामग्री पाठगत रूप से विस्थापित या प्रक्षिप्त प्रतीत होती है। इसे चुपचाप समाहित करने के बजाय पादटिप्पणी में दर्ज किया गया है।
- issue: σκοτεινὸν ὀφθαλμόν का अर्थ
  choice: मुख्य पाठ में ‘आँख अँधेरी’ का रूपक बनाए रखा गया।
  alternative: ‘बुरी आँख’, ‘ईर्ष्यालु दृष्टि’ या ‘कृपण स्वभाव’।
  rationale: रूपक ईर्ष्या, दुर्भावना या अनुदारता का संकेत दे सकता है, पर किसी एक व्याख्या को मूल पर थोपना उचित नहीं। आसपास का संदर्भ अर्थ की दिशा बताता है।
- issue: पद 5 की लंबी और छोटी पाठ-परंपराएँ
  choice: 'प्रस्तुत यूनानी स्रोत की छोटी पंक्ति का अनुवाद किया गया: भली आत्मा का अनुग्रह पाए व्यक्ति से अपने प्राण के समान प्रेम करना।'
  alternative: प्रभु का भय रखने वाले की रक्षा, परमेश्वर से प्रेम करने वाले की सहायता और परमप्रधान को अस्वीकार करने वाले को समझाकर लौटाने वाली विस्तृत सद्गुण-सूची शामिल करना।
  rationale: दिए गए यूनानी मूल में केवल छोटी पंक्ति उपलब्ध है। अंग्रेज़ी परामर्श-पाठ का विस्तार इस स्रोत से समर्थित नहीं है, इसलिए उसे मुख्य पाठ में न रखकर पाठांतर के रूप में नोट किया गया है।
- issue: χάριν ἀγαθοῦ πνεύματος में ‘आत्मा’ का स्वरूप
  choice: ‘भली आत्मा का अनुग्रह’ लिखा गया, बिना यह निश्चित किए कि आशय दिव्य आत्मा, मानवीय स्वभाव या आत्मिक वरदान से है।
  alternative: ‘पवित्र आत्मा का अनुग्रह’ या ‘अच्छे स्वभाव का वरदान’।
  rationale: यूनानी में πνεῦμα के साथ ‘पवित्र’ नहीं बल्कि ‘भला’ विशेषण है। इसलिए किसी विशिष्ट पवित्र-आत्मा संबंधी अर्थ को अनिवार्य नहीं बनाया गया।
