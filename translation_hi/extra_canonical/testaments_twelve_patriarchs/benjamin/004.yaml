  text: '1[a]. See then, my children, the outcome of the good man. Imitate the good, because of his compassion, so that you also may wear crowns of glory.


    2. For the good man does not have a darkened eye, for he shows mercy to all, even if they are sinners.


    3[b]. And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.


    4. If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.


    5. He defends the one who has the fear of the Lord; he helps the one who loves God; by admonishing, he turns back the one who rejects the Most High; and he loves, as his own soul[c], the one who has the grace of a good spirit.'
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 4**


    1[a]. इसलिए, मेरे बच्चों, भले मनुष्य के जीवन का परिणाम देखो। उसकी करुणा के कारण उस भले मनुष्य का अनुकरण करो, ताकि तुम भी महिमा के मुकुट पहनो।


    2[b]. क्योंकि भले मनुष्य की आँख अँधेरी नहीं होती; वह सब पर दया करता है, भले ही वे पापी हों।


    3. यदि वे उसके विषय में भलाई न सोचें, तो भी वह भलाई करके बुराई पर विजय पाता है, परमेश्वर की छत्रछाया में रहते हुए। जो उसके साथ अन्याय करते हैं, उनसे वह अपने प्राण के समान प्रेम करता है।


    4. यदि किसी को सम्मान मिलता है, तो वह उससे ईर्ष्या नहीं करता; यदि कोई धनी हो जाता है, तो वह उससे जलता नहीं; यदि कोई वीर है, तो वह उसकी प्रशंसा करता है। वह संयमी मनुष्य से प्रेम करता है, निर्धन पर दया करता है, निर्बल के दुःख में सहभागी होता है और परमेश्वर का भय मानता है।


    5[c]. जिस व्यक्ति को भली आत्मा का अनुग्रह मिला है, उससे वह अपने प्राण के समान प्रेम करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: OCR परत में इससे पहले ‘परमेश्वर के मेमने’ और निर्दोष व्यक्ति के अधर्मियों के लिए मरने से संबंधित कुछ पंक्तियाँ मिलती हैं। वे पाठगत रूप से कठिन हैं और इस अध्याय के सुसंगत आरम्भ के संदर्भ में विस्थापित प्रतीत होती हैं; इसलिए उन्हें यहाँ मुख्य पाठ में शामिल नहीं किया गया है।
    reason: textual_variant
  - marker: b
    text: ‘आँख अँधेरी’ को ‘बुरी आँख’ भी समझा जा सकता है—अर्थात ईर्ष्यालु, दुर्भावनापूर्ण या अनुदार दृष्टिकोण।
    reason: lexical_alternative
  - marker: c
    text: कुछ पाठ-साक्ष्य यहाँ संक्षिप्त हैं, जबकि अन्य में सद्गुणों की एक विस्तृत सूची मिलती है। मुख्य पाठ प्रस्तुत यूनानी स्रोत की संक्षिप्त पंक्ति का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: τέλος
  choice: जीवन का परिणाम
  rationale: यहाँ शब्द भले मनुष्य के आचरण से प्रकट होने वाले अंतिम फल या परिणति की ओर संकेत करता है। ‘जीवन का परिणाम’ हिन्दी में स्वाभाविक है और केवल मृत्यु का अर्थ लेने से बचाता है।
- source_word: μιμήσασθε
  choice: अनुकरण करो
  rationale: आज्ञार्थक क्रिया आदर्श के अनुसार आचरण करने का सीधा आह्वान है; ‘अनुकरण करो’ इस नैतिक बल को बनाए रखता है।
- source_word: εὐσπλαγχνία
  choice: करुणा
  rationale: यह गहरी दया और कोमल हृदयता का बोध कराता है। ‘करुणा’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: आँख अँधेरी
  rationale: यूनानी रूपक को व्याख्यात्मक ‘ईर्ष्यालु दृष्टि’ में बदलने के बजाय मुख्य पाठ में सुरक्षित रखा गया है; संदर्भ उसके द्वेषरहित और दयालु स्वभाव को स्पष्ट करता है।
- source_word: ἐλεεῖ
  choice: दया करता है
  rationale: यह केवल भाव नहीं, दूसरों के प्रति सक्रिय दयालुता व्यक्त करता है।
- source_word: νικᾷ τὸ κακόν
  choice: बुराई पर विजय पाता है
  rationale: यह भलाई और बुराई के नैतिक विरोध को स्पष्ट रखते हुए यूनानी क्रिया के विजय-संबंधी बल को बनाए रखता है।
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: परमेश्वर उसे अपनी छत्रछाया में रखता है
  rationale: मूल में परमेश्वर द्वारा ढके या आश्रय दिए जाने की छवि है। हिन्दी मुहावरा ‘छत्रछाया में रखना’ संरक्षण की उसी छवि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀδικοῦντας
  choice: जो उसके साथ अन्याय करते हैं
  rationale: यह व्यक्ति के विरुद्ध किए गए अन्याय को स्पष्ट करता है और प्रेम की नैतिक माँग को अक्षुण्ण रखता है।
- source_word: δοξάζηται
  choice: सम्मान मिलता है
  rationale: इस सूची में आशय सामाजिक प्रतिष्ठा या आदर पाने से है; ‘महिमान्वित होता है’ की तुलना में यह आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: φθονεῖ / ζηλοῖ
  choice: ईर्ष्या करता / जलता
  rationale: दो निकटार्थक यूनानी क्रियाओं के अलंकारिक संचय को हिन्दी में दो अलग किंतु संबंधित अभिव्यक्तियों से सुरक्षित रखा गया है।
- source_word: σώφρονα
  choice: संयमी मनुष्य
  rationale: नैतिक गुणों की इस सूची में आत्म-संयम प्रमुख है; ‘संयमी’ संक्षिप्त और प्रचलित है।
- source_word: συμπάσχει
  choice: दुःख में सहभागी होता है
  rationale: संयुक्त क्रिया केवल सहानुभूति नहीं, दूसरे के साथ दुःख सहने की भागीदारी व्यक्त करती है।
- source_word: χάριν ἀγαθοῦ πνεύματος
  choice: भली आत्मा का अनुग्रह
  rationale: 'संबंधकारक रचना को जानबूझकर खुला रखा गया है: इसका अर्थ भली आत्मा से प्राप्त अनुग्रह अथवा उससे संबंधित अनुग्रह हो सकता है।'
