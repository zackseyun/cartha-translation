  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/007.yaml
  text: Then we also will rise, each on our scepter, worshiping the king of the heavens, [the one who appeared on earth in the form of a man in humility; and as many as believed in him on the earth will rejoice with him].
translation:
  language: hi
  text: तब हम भी जी उठेंगे—हममें से हर एक अपने राजदंड पर[a]—और स्वर्गों के राजा को दण्डवत करेंगे, [जो दीनता में मनुष्य के रूप में पृथ्वी पर प्रकट हुआ; और पृथ्वी पर जितने लोग उस पर विश्वास करें, वे उसके साथ अनुग्रह पाएँगे[b]]।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने राजदंड पर” का यूनानी वाक्यांश असामान्य है; “राजदंड” यहाँ सम्भवतः हर कुल या गोत्र के राजकीय अधिकार का प्रतीक हो सकता है।
    reason: शाब्दिक अर्थ को रखते हुए सम्भावित प्रतीकात्मक आशय बताना।
  - marker: b
    text: प्रदत्त यूनानी पाठ का अर्थ “अनुग्रह पाएँगे” है; एक सम्भावित भिन्न पाठ के आधार पर अनुवाद “आनन्दित होंगे” भी मिलता है।
    reason: यूनानी पाठ और अंग्रेज़ी परामर्श-पाठ के बीच महत्त्वपूर्ण पाठगत/शब्दगत अंतर स्पष्ट करना।
  - marker: c
    text: कोष्ठकों में रखा अंश स्रोत-संस्करण में भी कोष्ठकों में है, जो उसके पाठगत रूप से संदिग्ध या गौण होने का संकेत देता है।
    reason: मूल संस्करण के आलोचनात्मक कोष्ठक को पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ἀναστησόμεθα
  choice: जी उठेंगे
  rationale: भविष्यकालीन पुनरुत्थान का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: हममें से हर एक अपने राजदंड पर
  rationale: यूनानी वाक्यांश की असामान्यता और सम्भावित प्रतीकात्मक अर्थ को बिना चुपचाप 'गोत्र' आदि में बदलकर सुरक्षित रखा गया है।
- source_word: προσκυνοῦντες
  choice: दण्डवत करेंगे
  rationale: राजा के सामने श्रद्धापूर्ण उपासना और झुकने—दोनों भावों को व्यक्त करता है।
- source_word: τὸν βασιλέα τῶν οὐρανῶν
  choice: स्वर्गों के राजा
  rationale: बहुवचन οὐρανῶν को बनाए रखा गया है।
- source_word: ἐν μορφῇ ἀνθρώπου
  choice: मनुष्य के रूप में
  rationale: μορφή का सीधा और स्वाभाविक अनुवाद।
- source_word: ἐν ταπεινώσει
  choice: दीनता में
  rationale: नम्रता, नीची अवस्था या अपमानित दशा की सम्भावित अर्थ-छटा को खुला रखता है।
- source_word: ὅσοι πιστεύσωσιν αὐτῷ
  choice: जितने लोग उस पर विश्वास करें
  rationale: अनिश्चित/सम्भाव्य क्रियारूप को भूतकाल 'विश्वास किया' या निश्चित भविष्य में नहीं बदला गया।
- source_word: χαρίσονται σὺν αὐτῷ
  choice: उसके साथ अनुग्रह पाएँगे
  rationale: प्रदत्त पाठ χαρίσονται को प्राथमिकता दी गई है; इसे परामर्श-पाठ के 'आनन्दित होंगे' के अनुसार बिना सूचना के नहीं बदला गया।
theological_decisions:
- issue: पृथ्वी पर मनुष्य के रूप में प्रकट राजा की पहचान
  choice: स्रोत की तरह केवल वर्णन रखा गया, कोई नाम नहीं जोड़ा गया
  alternative: उसे स्पष्ट रूप से मसीह या यीशु कहना
  rationale: पद पहचान को संकेतित करता है, पर इस वाक्य में नाम नहीं देता; अनुवाद को निहितार्थ से अधिक स्पष्ट नहीं बनाया गया।
- issue: πιστεύσωσιν का काल और पक्ष
  choice: विश्वास करें
  alternative: विश्वास किया था / विश्वास करेंगे
  rationale: यूनानी अओरिस्ट सब्जंक्टिव की खुली, सम्भाव्य अभिव्यक्ति को बनाए रखा गया है।
- issue: χαρίσονται का अर्थ
  choice: अनुग्रह पाएँगे
  alternative: आनन्दित होंगे
  rationale: दिए गए यूनानी रूप का सामान्य अर्थ अनुग्रह या कृपा से जुड़ा है; 'आनन्दित होंगे' सम्भवतः भिन्न पाठ χαρήσονται को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। असामान्य यूनानी वाक्यांश और पाठगत तनाव को टिप्पणियों सहित सुरक्षित रखा गया है। नवीनतम संशोधन में दिया गया 'वह सब जातियों का न्याय करेगा...' वाक्य प्रस्तुत यूनानी स्रोत से मेल नहीं खाता, इसलिए उसे नहीं अपनाया गया।
