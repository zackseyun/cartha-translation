revisions:
- from: क्योंकि इन बातों को मैं तुम्हारे लिए हर प्रकार की विरासत के बदले छोड़ जाता हूँ। इसलिए तुम भी इन्हें अपनी संतानों को सदा की संपत्ति के रूप में देना; क्योंकि अब्राहम, इसहाक और याकूब ने भी ऐसा ही किया।
  to: क्योंकि इन बातों को मैं तुम्हें हर प्रकार की विरासत के बदले छोड़ जाता हूँ। इसलिए इन्हें अपनी संतानों को चिरस्थायी संपत्ति के रूप में देना; क्योंकि अब्राहम, इसहाक और याकूब ने ऐसा ही किया।
  rationale: The revision removes the unsupported additive “भी,” makes the recipient of “छोड़ जाता हूँ” explicit with “तुम्हें,” and uses “चिरस्थायी संपत्ति” for the Greek phrase denoting an everlasting possession. It preserves the source’s unspecified “these things,” the inheritance comparison, and the nonsectarian ancestral example.
