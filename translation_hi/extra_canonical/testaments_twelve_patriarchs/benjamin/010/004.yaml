id: T12P.BEN.10.4
reference: Testament of Benjamin 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ ὑμῖν ἀντὶ πάσης κληρονομίας καταλειμπάνω¹⁴. καὶ ὑμεῖς Γοὖν δότε αὐτὰ¹⁵ τοῖς τέκνοις ὑμῶν *εἰς κατάσχεσιν¹⁶ αἰώνιον· οὕτω¹⁷ Γγὰρ˥ ἐποίησεν¹⁸ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/004.yaml
  text: For these things I leave to you instead of every inheritance. And you, therefore, give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did.
translation:
  language: hi
  text: क्योंकि इन बातों को मैं तुम्हें हर प्रकार की विरासत के बदले छोड़ जाता हूँ। इसलिए इन्हें अपनी संतानों को चिरस्थायी संपत्ति के रूप में देना; क्योंकि अब्राहम, इसहाक और याकूब ने ऐसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: इन बातों को
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का स्वाभाविक हिन्दी रूप; यह पूर्ववर्ती उपदेशों या बातों की ओर संकेत करता है।
- source_word: ἀντὶ πάσης κληρονομίας
  choice: हर प्रकार की विरासत के बदले
  rationale: ἀντί के प्रतिस्थापन-बोध और πάσης के व्यापक बल को सुरक्षित रखता है; ‘विरासत’ आधुनिक पाठकों के लिए स्पष्ट है।
- source_word: καταλειμπάνω
  choice: छोड़ जाता हूँ
  rationale: वसीयतनुमा प्रसंग में ‘पीछे छोड़ना/विरासत में देना’ का भाव देता है, जबकि क्रिया के मूल अर्थ को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पूर्व कथन से निकलने वाले निष्कर्ष या निर्देश को स्पष्ट करता है।
- source_word: τέκνοις
  choice: संतानों को
  rationale: ‘बच्चों’ की अपेक्षा वंशगत हस्तांतरण के प्रसंग में अधिक उपयुक्त और गरिमापूर्ण है।
- source_word: εἰς κατάσχεσιν αἰώνιον
  choice: सदा की संपत्ति के रूप में
  rationale: स्थायी अधिकार/अधिग्रहण के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अनन्त अधिकार’ की कानूनी कठोरता से बचता है।
- source_word: οὕτω ... ἐποίησεν
  choice: ऐसा ही किया
  rationale: यूनानी वाक्यांश का सीधा और स्वाभाविक हिन्दी प्रतिरूप।
theological_decisions:
- issue: ‘इन बातों’ का निहित संदर्भ
  choice: सामान्य संकेतवाचक ‘इन बातों’ बनाए रखा
  alternative: इसे ‘इन शिक्षाओं’ या ‘इन आज्ञाओं’ के रूप में स्पष्ट करना
  rationale: मूल पाठ वस्तु को विशिष्ट नाम नहीं देता; अस्पष्टता को बनाए रखना स्रोत के अधिक निकट है।
- issue: ‘सदा की संपत्ति’ का स्वरूप
  choice: इसे वंशानुगत रूप से दिए जाने वाले उपदेशों/बातों की स्थायी संपत्ति के रूप में खुला रखा
  alternative: इसे विशेष रूप से आध्यात्मिक विरासत कहना
  rationale: मूल में ‘आध्यात्मिक’ नहीं है; ऐसा जोड़ना व्याख्यात्मक धार्मिक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पारिवारिक-वसीयतनुमा शैली। ‘तुम’ बहुवचन संबोधन के रूप में प्रयुक्त है। वाक्य-संरचना स्रोत के तर्कक्रम को रखती है, पर हिन्दी की स्वाभाविकता के लिए ‘भी’ को पूर्वजों की समान क्रिया पर केंद्रित किया गया है।
