review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the main sense faithfully: the speaker leaves “these things” in place of inheritance and directs their transmission to descendants as an enduring possession. However, “तुम भी” adds an explicit “also” not represented by οὖν; the Greek connective is inferential (“therefore/then”), not additive.'
  naturalness: The register is generally natural and suitably solemn. “चिरस्थायी संपत्ति” is a more idiomatic and precise rendering of the enduring-possession phrase than “सदा की संपत्ति,” while retaining its nontechnical sense.
  terminology: “विरासत,” “संतानों,” and the traditional forms “अब्राहम, इसहाक और याकूब” are appropriate. “इन बातों” correctly preserves the unspecified referent of Ταῦτα.
  issues:
  - severity: low
    issue: “तुम भी” introduces an additive nuance.
    rationale: The source has οὖν (“therefore/then”) but no corresponding term for “also.” The final comparison with Abraham, Isaac, and Jacob supplies the rationale without requiring an added “भी.”
  - severity: low
    issue: “सदा की संपत्ति” is slightly less idiomatic for an enduring possession.
    rationale: “चिरस्थायी संपत्ति” naturally expresses εἰς κατάσχεσιν αἰώνιον as a lasting possession while avoiding doctrinal or legal over-specification.
  revised_text: क्योंकि इन बातों को मैं तुम्हें हर प्रकार की विरासत के बदले छोड़ जाता हूँ। इसलिए इन्हें अपनी संतानों को चिरस्थायी संपत्ति के रूप में देना; क्योंकि अब्राहम, इसहाक और याकूब ने ऐसा ही किया।
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported additive “भी,” makes the recipient of “छोड़ जाता हूँ” explicit with “तुम्हें,” and uses “चिरस्थायी संपत्ति” for the Greek phrase denoting an everlasting possession. It preserves the source’s unspecified “these things,” the inheritance comparison, and the nonsectarian ancestral example.
