id: T12P.BEN.10.11
reference: Testament of Benjamin 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⌜Ὑμεῖς οὖν, τέκνα μου⁶⁷, ἐὰν⁶⁸ πορευθῆτε⁶⁹ ἐν ἁγιασμῷ ⌜*ἐν ταῖς ἐντολαῖς⁷⁰ Κυρίου⌝, πάλιν κατοικήσετε⁷¹ ⌜ἐπʼ ἐλπίδι⌝ *ἐν ἐμοί⁷², καὶ συναχθήσεται⁷³ *πρὸς Κύριον⁷⁴ πᾶς Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/011.yaml
  text: You therefore, my children, if you walk in holiness in the commandments of the Lord, you will again dwell in hope with me, and all Israel will be gathered to the Lord.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, यदि तुम प्रभु की आज्ञाओं में पवित्रता से चलोगे, तो तुम फिर मेरे साथ[a] आशा में निवास करोगे, और समस्त इस्राएल प्रभु के पास इकट्ठा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुझमें।”
    reason: यूनानी ἐν ἐμοί को दर्ज करता है, जिसकी शाब्दिक अभिव्यक्ति और प्रसंगगत अर्थ के बीच तनाव है।
lexical_decisions:
- source_word: ἐν ἁγιασμῷ
  choice: पवित्रता से
  rationale: यूनानी पदबंध का स्वाभाविक हिन्दी रूप; यह पवित्र आचरण की रीति को व्यक्त करता है।
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  choice: प्रभु की आज्ञाओं में
  rationale: मूल के ἐν संबंधसूचक प्रयोग को बनाए रखता है और आज्ञाओं के दायरे में जीवन-चाल का भाव देता है।
- source_word: ἐπʼ ἐλπίδι
  choice: आशा में
  rationale: ἐλπίς का सीधा अर्थ ‘आशा’ है; ‘भरोसे’ या ‘निश्चय’ कहने से अर्थ अनावश्यक रूप से सीमित हो सकता था।
- source_word: κατοικήσετε
  choice: निवास करोगे
  rationale: स्थायी रूप से रहने या बसने के अर्थ को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: συναχθήσεται πρὸς Κύριον
  choice: प्रभु के पास इकट्ठा किया जाएगा
  rationale: कर्मवाच्य और πρὸς के दिशासूचक भाव—प्रभु की ओर/उनके पास—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ἐν ἐμοί का असामान्य संबंध
  choice: मेरे साथ[a]
  alternative: मुझमें
  rationale: शाब्दिक ‘मुझमें’ हिन्दी में अस्पष्ट और अप्राकृतिक है; प्रसंग में वक्ता के साथ पुनः निवास करने का अर्थ संभव है। फिर भी मूल की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘समस्त इस्राएल’ के एकत्र होने का कथन
  choice: समस्त इस्राएल प्रभु के पास इकट्ठा किया जाएगा
  alternative: इस्राएल के सभी लोग प्रभु के पास इकट्ठे किए जाएँगे
  rationale: सामूहिक एकवचन πᾶς Ἰσραήλ और कर्मवाच्य क्रिया को बिना किसी विशिष्ट अंतकाल-संबंधी व्याख्या के यथासंभव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संबोधनात्मक रखी गई है। ‘बच्चो’ स्वाभाविक सम्बोधन है; ‘निवास’ और ‘समस्त इस्राएल’ वसीयतनुमा धार्मिक शैली की गरिमा बनाए रखते हैं।
