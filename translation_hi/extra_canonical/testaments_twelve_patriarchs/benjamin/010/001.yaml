source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: X. Ὅτε¹ δὲ *ἦν Ἰωσὴφ ἐν Αἰγύπτῳ², ἐπεθύμουν ἰδεῖν τὴν εἰδέαν³ αὐτοῦ Γκαὶ τὴν μόρφωσιν⁴ τῆς ὄψεως αὐτοῦ⁵. καὶ δι᾽ εὐχῶν Ἰακὼβ τοῦ πατρός μου⁶ εἶδον Γαὐτόν, ἐν ἡμέρᾳ γρηγορῶν, *καθ᾽ ὃ ἦν⁶ πᾶσα⁷ ἡ εἰδέα⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/001.yaml
  text: When Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, just as his whole appearance was.
translation:
  language: hi
  text: जब यूसुफ मिस्र में था, तब मैं उसका रूप और उसके चेहरे की बनावट देखने के लिए लालायित था। और मैंने अपने पिता याकूब की प्रार्थनाओं के द्वारा उसे दिन में जागते हुए देखा, ठीक वैसा ही जैसा उसका पूरा रूप था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδέαν
  choice: रूप
  rationale: यहाँ यह शब्द यूसुफ के दिखाई देने वाले समग्र स्वरूप को दर्शाता है। सरल और स्वाभाविक हिन्दी के लिए ‘रूप’ चुना गया है और अंतिम वाक्यांश में इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: μόρφωσιν τῆς ὄψεως
  choice: चेहरे की बनावट
  rationale: ὄψις इस प्रसंग में चेहरे या मुखाकृति की ओर संकेत करता है और μόρφωσις उसकी आकृति अथवा संरचना को; ‘चेहरे की बनावट’ दोनों का सहज संयुक्त अर्थ देता है।
- source_word: ἐπεθύμουν
  choice: लालायित था
  rationale: यह साधारण इच्छा से अधिक प्रबल अभिलाषा व्यक्त करता है; ‘लालायित था’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: दिन में जागते हुए
  rationale: मूल के दिन और जागृत अवस्था, दोनों स्पष्ट तत्व सुरक्षित रखे गए हैं।
- source_word: δι᾽ εὐχῶν
  choice: प्रार्थनाओं के द्वारा
  rationale: διά के माध्यमसूचक भाव को सीधे बनाए रखता है और यह नहीं बताता कि प्रार्थनाओं ने किस रीति से दर्शन संभव किया।
theological_decisions:
- issue: यूसुफ को देखने की घटना का स्वरूप
  choice: ‘दिन में जागते हुए उसे देखा’ कहकर केवल मूल कथन प्रस्तुत किया गया है।
  alternative: इसे स्पष्ट रूप से ‘दर्शन’, ‘स्वप्न’ या अलौकिक प्रकट होना कहना।
  rationale: यूनानी पाठ जागृत और दिन के समय देखने पर बल देता है, पर घटना की विधा को कोई विशिष्ट धार्मिक नाम नहीं देता; इसलिए उस अस्पष्टता को सुरक्षित रखा गया है।
- issue: याकूब की प्रार्थनाओं की भूमिका
  choice: ‘प्रार्थनाओं के द्वारा’
  alternative: ‘प्रार्थनाओं के उत्तर में’ या ‘प्रार्थनाओं के कारण’
  rationale: मूल माध्यम को व्यक्त करता है, पर कारण, उत्तर या दैवी क्रियाविधि को और अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठक के लिए स्पष्ट किंतु गरिमापूर्ण। अंतिम खंड में मूल की कुछ असामान्य अभिव्यक्ति को जानबूझकर बनाए रखा गया है, ताकि ‘उसका पूरा रूप जैसा था’ का बल और εἰδέα की पुनरावृत्ति न मिटे।
