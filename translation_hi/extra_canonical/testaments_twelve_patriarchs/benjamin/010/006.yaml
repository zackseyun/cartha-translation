base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/006.yaml
  text: And then you will see Enoch and Seth and Abraham and Isaac and Jacob raised up at his right hand in rejoicing.
translation:
  language: hi
  text: और तब तुम हनोक, शेत, अब्राहम, इसहाक और याकूब को उसकी दाहिनी ओर उल्लास में जी उठे हुए देखोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψεσθε
  choice: तुम ... देखोगे
  rationale: द्वितीय पुरुष बहुवचन के भविष्यकाल को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνασταμένους
  choice: उठे हुए
  rationale: क्रिया का अर्थ ‘उठना’ या ‘जी उठना’ हो सकता है; यहाँ ‘उठे हुए’ मूल की सम्भावित अस्पष्टता को बनाए रखता है और अनावश्यक रूप से पुनरुत्थान को स्पष्ट नहीं करता।
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: उसके दाहिने
  rationale: सम्मान और निकटता के स्थान का स्वाभाविक हिन्दी रूप; सर्वनाम के संदर्भ को मूल की तरह अनिर्दिष्ट रखा गया है।
- source_word: ἐν ἀγαλλιάσει
  choice: आनन्द मनाते हुए
  rationale: उल्लासपूर्ण आनन्द को सामान्य आधुनिक हिन्दी में सक्रिय और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἀνασταμένους में पुनरुत्थान का सम्भावित संकेत
  choice: उठे हुए
  alternative: जी उठे हुए
  rationale: ग्रीक शब्द पुनरुत्थान का संकेत दे सकता है, पर केवल खड़े या उठे होने का भी; मुख्य पाठ में व्यापक अर्थ रखा गया है।
- issue: αὐτοῦ का संदर्भ
  choice: उसके
  alternative: परमेश्वर के / प्रभु के
  rationale: मूल पद में पूर्वगामी व्यक्तित्व का नाम नहीं है, इसलिए किसी विशेष नाम को जोड़कर धार्मिक अर्थ निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी की वाक्य-रचना तथा अस्पष्टताओं के निकट। व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
