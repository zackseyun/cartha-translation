review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the future second-person plural, the sequence of names, and the unspecified referent of αὐτοῦ. However, “उसके दाहिने” is incomplete/unnatural for ἐκ δεξιῶν αὐτοῦ (‘at/on his right side’). In this resurrection-context phrase, ἀνασταμένους is more faithfully rendered ‘जी उठे हुए’ than the potentially non-resurrection-specific ‘उठे हुए.’
  naturalness: The proposed revision uses idiomatic modern standard Hindi while retaining the concise, elevated register of the Greek.
  terminology: The established Hindi biblical forms हनोक, शेत, अब्राहम, इसहाक, and याकूब are retained. ‘जी उठे हुए’ conveys the participle without supplying a doctrinally specific agent or identifying the pronoun’s referent.
  issues:
  - severity: medium
    issue: Location expression is not idiomatic Hindi.
    rationale: ‘उसके दाहिने’ lacks the required locative expression and can sound incomplete. Greek ἐκ δεξιῶν αὐτοῦ denotes being at his right side.
  - severity: medium
    issue: ‘उठे हुए’ weakens the resurrection sense of ἀνασταμένους in context.
    rationale: Although ἀνίστημι can broadly mean rise/stand up, the surrounding eschatological setting and the perfect participle favor ‘raised/resurrected.’ ‘जी उठे हुए’ accurately communicates this without adding an explicit theological interpretation.
  revised_text: और तब तुम हनोक, शेत, अब्राहम, इसहाक और याकूब को उसकी दाहिनी ओर उल्लास में जी उठे हुए देखोगे।
  revised_footnotes: []
  revision_rationale: The revision corrects the Hindi rendering of the right-side location and reflects the contextual resurrection force of ἀνασταμένους. It leaves αὐτοῦ (‘his’) unresolved, as in the Greek, and preserves the source order and the association of rejoicing with those seen.
