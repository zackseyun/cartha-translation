source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ οἱ⁴³ πάντες ἀναστήσονται, οἱ μὲν εἰς δόξαν, οἱ δὲ εἰς ἀτιμίαν, καὶ κρινεῖ Κύριος⁴⁴ ἐν πρώτοις τὸν Ἰσραὴλ⁴⁵ περὶ τῆς *ἀδικίας αὐτῶν⁴⁶ [ὅτι παραγενόμενον⁴⁷ Θεὸν⁴⁴ ἐν σαρκί⁴⁸, οὐκ ἐπίστευσαν αὐτῷ⁴⁹].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/008.yaml
  text: And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first concerning their unrighteousness, [because when God came to them in flesh, they did not believe him].
translation:
  language: hi
  text: और सब लोग जी उठेंगे—कुछ महिमा के लिए और कुछ अनादर के लिए। और प्रभु सबसे पहले इस्राएल का न्याय उनके अधर्म के विषय में करेगा, [क्योंकि जब परमेश्वर देह में आया, तो उन्होंने उस पर विश्वास नहीं किया]।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσονται
  choice: जी उठेंगे
  rationale: यह भविष्यकालीन पुनरुत्थान को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: δόξαν
  choice: महिमा
  rationale: यह धार्मिक संदर्भ में δόξα का प्रचलित और अर्थपूर्ण हिन्दी समतुल्य है।
- source_word: ἀτιμίαν
  choice: अपमान
  rationale: δόξα के विपरीत, अनादर और लज्जाजनक दशा का भाव बनाए रखता है।
- source_word: κρινεῖ
  choice: न्याय करेगा
  rationale: क्रिया के न्यायिक अर्थ को बिना यह तय किए सुरक्षित रखता है कि परिणाम केवल दण्ड है या व्यापक न्याय।
- source_word: ἐν πρώτοις
  choice: पहले
  rationale: इस्राएल के न्याय की प्राथमिकता को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀδικίας
  choice: अधर्म
  rationale: नैतिक अन्याय और धार्मिक दुष्टता—दोनों की व्यापकता को समेटता है।
- source_word: ἐν σαρκί
  choice: देह में
  rationale: मूल के देहधारण-संबंधी कथन को औपचारिक रूप से निकट रखते हुए व्यक्त करता है।
- source_word: ἐπίστευσαν αὐτῷ
  choice: उस पर विश्वास नहीं किया
  rationale: व्यक्ति में विश्वास या भरोसे के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कोष्ठकबद्ध देहधारण-विषयक उपवाक्य की पाठगत स्थिति
  choice: मूल स्रोत की तरह वर्ग कोष्ठकों में रखा गया
  alternative: बिना कोष्ठकों के मुख्य पाठ में मिला देना या पादटिप्पणी में हटाना
  rationale: प्रदत्त यूनानी पाठ इस खंड को कोष्ठकबद्ध करता है; इसलिए उसकी पाठगत अनिश्चितता या संपादकीय स्थिति को चुपचाप समाप्त नहीं किया गया।
- issue: παραγενόμενον Θεὸν का कर्ता और आगमन
  choice: जब परमेश्वर देह में आया
  alternative: जब देह में आए परमेश्वर उनके पास पहुँचे
  rationale: यूनानी का मूल दावा और तनाव बनाए रखा गया है; हिन्दी में अनावश्यक रूप से कोई अतिरिक्त मसीही पदवी नहीं जोड़ी गई।
- issue: किस पर विश्वास नहीं किया गया
  choice: उस पर
  alternative: परमेश्वर पर / उसमें
  rationale: αὐτῷ को उसके व्याकरणिक पुरुषवाचक संकेत सहित रखा गया है और संदर्भ से अधिक विशिष्ट पहचान आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण धार्मिक शैली। वाक्य-विन्यास को सामान्य पाठक के लिए सहज बनाया गया है, जबकि वर्ग कोष्ठक और मूल की न्याय तथा देहधारण-संबंधी धार्मिक तीव्रता सुरक्षित रखी गई है। नवीन संशोधन में उद्धृत वैकल्पिक पाठ इस पद के प्रदत्त यूनानी से असंबद्ध है, इसलिए उसका अनुसरण नहीं किया गया।
