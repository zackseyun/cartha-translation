lexical_decisions:
- source_word: Καὶ ταῦτα εἰπὼν
  choice: और ये बातें कहने के बाद
  rationale: यूनानी कृदन्तीय वाक्यांश का स्वाभाविक हिन्दी रूप, जो कथन के क्रम को बनाए रखता है।
- source_word: Γινώσκετε οὖν
  choice: इसलिए ... जान लो
  rationale: γινώσκετε की आज्ञार्थक शक्ति और οὖν के निष्कर्षसूचक भाव, दोनों को स्पष्ट और सहज हिन्दी में रखा गया है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: स्नेहपूर्ण प्रत्यक्ष संबोधन को आधुनिक मानक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀποθνῄσκω
  choice: मैं मर रहा हूँ
  rationale: वर्तमानकालीन यूनानी रूप की आसन्न अथवा जारी मृत्यु की सीधी अभिव्यक्ति को बिना अधिक व्याख्या के सुरक्षित रखता है।
