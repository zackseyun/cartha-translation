base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/003.yaml
  text: Therefore, each one should practice truth toward his neighbor, and keep the law of the Lord and his commandments.
translation:
  language: hi
  text: इसलिए तुममें से हर एक अपने पड़ोसी के साथ सच्चाई से व्यवहार करे, और प्रभु की व्यवस्था तथा उसकी आज्ञाओं का पालन करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσατε ... ἀλήθειαν
  choice: सच्चाई से व्यवहार करे
  rationale: शाब्दिक ‘सत्य करो’ आधुनिक हिन्दी में अस्वाभाविक है। यह पदबंध सत्यनिष्ठ आचरण को व्यक्त करता है, जिसे ‘सच्चाई से व्यवहार करना’ स्वाभाविक और अर्थ-संगत ढंग से पहुँचाता है।
- source_word: ἕκαστος
  choice: तुममें से हर एक
  rationale: यूनानी बहुवचन आज्ञा के भीतर प्रत्येक व्यक्ति पर अलग-अलग दायित्व का भाव सुरक्षित रहता है।
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: अपने पड़ोसी के साथ
  rationale: πλησίον के नैतिक-सामाजिक अर्थ के लिए पारंपरिक और सहज ‘पड़ोसी’ रखा गया; πρὸς को सम्बन्धपरक सन्दर्भ में ‘के साथ’ व्यक्त किया गया।
- source_word: τὸν νόμον Κυρίου
  choice: प्रभु की व्यवस्था
  rationale: νόμος के धार्मिक विधान-संबंधी अर्थ को ‘व्यवस्था’ ठीक प्रकार व्यक्त करता है और ‘प्रभु’ के साथ मूल सम्बन्ध बनाए रखता है।
- source_word: τὰς ἐντολὰς αὐτοῦ φυλάξατε
  choice: उसकी आज्ञाओं का पालन करे
  rationale: φυλάσσω का मूल भाव सुरक्षित रखने/मानने का है; आज्ञाओं के सन्दर्भ में आधुनिक हिन्दी का स्वाभाविक प्रयोग ‘पालन करना’ है।
theological_decisions:
- issue: ‘प्रभु की व्यवस्था’ और ‘उसकी आज्ञाएँ’ का सम्बन्ध
  choice: दोनों पदों को अलग-अलग बनाए रखा गया
  alternative: दोनों को मिलाकर केवल ‘प्रभु की आज्ञाओं’ कहना
  rationale: मूल पाठ νόμος और ἐντολάς दोनों का स्पष्ट उल्लेख करता है; उन्हें मिलाने से सम्भावित अर्थ-भेद मिट जाएगा।
- issue: आज्ञार्थक क्रिया का हिन्दी रूप
  choice: सम्मानसूचक/उपदेशात्मक ‘करे ... पालन करे’
  alternative: प्रत्यक्ष बहुवचन आज्ञा ‘करो ... पालन करो’
  rationale: मूल में बहुवचन आज्ञार्थक है, पर ἕκαστος के कारण प्रत्येक श्रोता पर लागू उपदेश को हिन्दी में ‘हर एक ... करे’ अधिक स्वाभाविक ढंग से व्यक्त करता है और आदेश का बल बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सच्चाई से व्यवहार’ स्रोत के ‘सत्य करना’ मुहावरे का स्वाभाविक हिन्दी रूप है; ‘व्यवस्था’ और ‘आज्ञाएँ’ दोनों पृथक सुरक्षित हैं।
