reference: Testament of Benjamin 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ποιήσατε οὖν¹¹ ἀλήθειαν *ἕκαστος πρὸς τὸν πλησίον αὐτοῦ¹², Γκαὶ τὸν νόμον Κυρίου, καὶ τὰς ἐντολὰς αὐτοῦ¹³ φυλάξατε˥.'
