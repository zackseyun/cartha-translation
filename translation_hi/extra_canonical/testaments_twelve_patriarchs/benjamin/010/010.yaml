source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐλέγξει ἐν τοῖς ἐκλεκτοῖς *τῶν ἐθνῶν⁵⁸ τὸν Ἰσραήλ, ὥσπερ ἤλεγξεν τὸν Ἡσαῦ ἐν τοῖς Μαδιωαίοις τοῖς †ἀπατήσασιν⁵⁹ *ἀδελφοὺς αὐτῶν⁶⁰ [γενέσθαι διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας, καὶ⁶¹ ἀπηλλοτριώθησαν Θεοῦ]⁶², γενόμενοι⁶³ οὖν⁶⁴ τέκνα ἐν μερίδι φοβουμένων⁶⁵ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/010.yaml
  text: And he will convict Israel among the chosen of the nations, just as he convicted Esau among the Midianites, who deceived their brothers [to become through fornication and idolatry, and they were alienated from God], thus becoming children in the portion of those who fear the Lord.
translation:
  language: hi
  text: और वह जातियों के चुने हुओं के बीच इस्राएल का दोष प्रकट करेगा, जैसे उसने मिद्यानियों के बीच एसाव का दोष प्रकट किया था—उन मिद्यानियों ने अपने भाइयों को छल दिया था [कि वे यौन अनैतिकता और मूर्तिपूजा के द्वारा ऐसे बनें, और वे परमेश्वर से पराए हो गए]; इस प्रकार वे प्रभु का भय मानने वालों के हिस्से में संतान हो गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के यूनानी पाठ में कई पाठांतर और कठिन वाक्य-संबंध हैं। वर्ग कोष्ठकों में दिया गया अंश पाठगत रूप से अनिश्चित है। अंतिम ‘वे’ और ‘प्रभु का भय मानने वालों के हिस्से में संतान हो गए’ का संबंध किन व्यक्तियों से है, यह भी पूरी तरह स्पष्ट नहीं है।
    reason: स्रोत संस्करण कोष्ठकबद्ध अंश को पाठगत संदेह के साथ देता है, और अंतिम कृदन्त का कर्ता तथा ‘हिस्से’ का संबंध वाक्यगत रूप से अनिश्चित है।
lexical_decisions:
- source_word: ἐλέγξει / ἤλεγξεν
  choice: दोषी ठहराएगा / दोषी ठहराया था
  rationale: ἐλέγχω में दोष प्रकट करने, धिक्कारने और दोष सिद्ध करने का भाव है; यहाँ न्याय-संबंधी तुलना के कारण ‘दोषी ठहराना’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν
  choice: जातियों के चुने हुओं के बीच
  rationale: ἐν को स्थान/समूहगत अर्थ में और ἐκλεκτοῖς को ‘चुने हुए’ के रूप में रखा गया है; अस्पष्ट संबंध को व्याख्यात्मक ढंग से नहीं सुलझाया गया।
- source_word: ἀπατήσασιν
  choice: बहकाया था
  rationale: शब्द का अर्थ छल देना या भटका देना हो सकता है; आगे व्यभिचार और मूर्तिपूजा में पड़ने के संदर्भ में ‘बहकाना’ सहज है।
- source_word: πορνείας
  choice: व्यभिचार
  rationale: यह यौन अनैतिकता का व्यापक शब्द है; गरिमापूर्ण धार्मिक हिन्दी में ‘व्यभिचार’ प्रचलित है।
- source_word: ἀπηλλοτριώθησαν Θεοῦ
  choice: परमेश्वर से अलग हो गए
  rationale: मूल में अलगाव/पराया हो जाने का भाव है; इसे किसी विशिष्ट धर्मवैज्ञानिक सिद्धांत से जोड़े बिना स्पष्ट हिन्दी में रखा गया।
- source_word: τέκνα ἐν μερίδι φοβουμένων Κύριον
  choice: उन लोगों के भाग में संतान बने जो प्रभु का भय मानते हैं
  rationale: असामान्य यूनानी संरचना और उसके संभावित पाठगत तनाव को निकटता से सुरक्षित रखा गया है; ‘भाग’ μερίς और ‘संतान’ τέκνα को प्रत्यक्ष रूप से दर्शाते हैं।
theological_decisions:
- issue: ‘जातियों के चुने हुओं’ की पहचान
  choice: वाक्यांश को अनिर्धारित समूह के रूप में रखा गया
  alternative: ‘चुनी हुई अन्यजातियों की उपस्थिति में’ या किसी विशिष्ट धार्मिक समुदाय के रूप में पहचानना
  rationale: यूनानी वाक्यांश स्वयं पहचान स्पष्ट नहीं करता; किसी संप्रदायगत अर्थ को आरोपित करना उचित नहीं।
- issue: अंतिम कृदन्त γενόμενοι का कर्ता
  choice: निकटतम बहुवचन समूह के अनुरूप ‘वे’ रखा गया और अस्पष्टता पर पादटिप्पणी दी गई
  alternative: इसे ‘भाइयों’ अथवा किसी अन्य पूर्ववर्ती समूह से स्पष्ट रूप से जोड़ना
  rationale: पाठगत/वाक्यगत संरचना अस्थिर है; हिन्दी में एक व्याकरणिक कर्ता आवश्यक है, पर निश्चित पहचान का दावा नहीं किया गया।
- issue: कोष्ठकबद्ध पाठ की स्थिति
  choice: मुख्य पाठ में वर्ग कोष्ठक सुरक्षित रखे गए
  alternative: खंड को निर्बाध मुख्य पाठ में मिला देना या हटाना
  rationale: स्रोत संस्करण इस खंड को पाठगत संदेह के साथ प्रस्तुत करता है; यह जानकारी पाठक के लिए सुरक्षित रहनी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘इस्राएल’, ‘एसाव’, ‘मिद्यानी’, ‘परमेश्वर’ और ‘प्रभु’ जैसे स्थापित बाइबलीय रूप अपनाए गए हैं। स्रोत की कठिन संरचना को अनावश्यक रूप से सहज बनाकर उसका धर्मवैज्ञानिक तनाव नहीं मिटाया गया।
