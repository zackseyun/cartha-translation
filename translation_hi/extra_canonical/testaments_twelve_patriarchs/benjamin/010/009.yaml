source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ τότε κρινεῖ πάντα τὰ ἔθνη [ὅσα οὐκ ἐπίστευσαν αὐτῷ ἐπὶ τῆς⁵⁰ γῆς φανέντι⁵⁷].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/009.yaml
  text: And then he will judge all the nations, [as many as did not believe him when he appeared on earth].
translation:
  language: hi
  text: और तब वह सभी राष्ट्रों का न्याय करेगा—[उन सबका, जिन्होंने उस पर विश्वास नहीं किया, जब वह पृथ्वी पर प्रकट हुआ था]।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρινεῖ
  choice: न्याय करेगा
  rationale: भविष्यकालीन यूनानी क्रिया के न्यायिक अर्थ को स्वाभाविक और धर्मशास्त्रीय रूप से तटस्थ हिन्दी में व्यक्त करता है।
- source_word: πάντα τὰ ἔθνη
  choice: सभी राष्ट्रों
  rationale: ἔθνη के सामूहिक अर्थ को बनाए रखता है; संदर्भ स्वयं आगे अविश्वासियों तक दायरा सीमित करता है।
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: उस पर विश्वास नहीं किया
  rationale: व्यक्ति में विश्वास के अर्थ में आधुनिक हिन्दी का स्वाभाविक प्रयोग है; αὐτῷ का संदर्भगत पुरुषवाचक रूप बनाए रखा गया है।
- source_word: ἐπὶ τῆς γῆς φανέντι
  choice: जब वह पृथ्वी पर प्रकट हुआ था
  rationale: φανέντι के दत्तिव कृदन्त को कालवाचक उपवाक्य के रूप में स्पष्ट और सहज हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: न्याय का दायरा
  choice: मुख्य वाक्य में “सभी राष्ट्रों” और कोष्ठकीय अंश में “उन सबका, जिन्होंने…विश्वास नहीं किया” रखा गया
  alternative: “सभी अविश्वासी राष्ट्रों” के रूप में दोनों को मिला देना
  rationale: मूल पाठ की संरचना और उसके भीतर मौजूद संभावित दायरा-तनाव को बिना समतल किए सुरक्षित रखता है।
- issue: कोष्ठकीय पाठ की पाठालोचनात्मक स्थिति
  choice: अंश को वर्ग कोष्ठकों में ही रखा गया
  alternative: कोष्ठक हटाकर निर्विवाद मुख्य पाठ बनाना
  rationale: प्रदत्त यूनानी स्रोत में वर्ग कोष्ठक पाठ की अनिश्चित या गौण स्थिति दर्शाते हैं; अनुवाद में वही संकेत संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। मूल के वर्ग कोष्ठक यथावत रखे गए हैं; कोई फुटनोट आवश्यक नहीं।
