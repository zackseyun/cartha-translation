source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ πάντα δέδωκαν ἡμῖν εἰς κληρονομίαν¹⁹ *εἰπόντες· Φυλάξατε τὰς ἐντολὰς τοῦ Θεοῦ²⁰ ἕως ὅτου²¹ ἀποκαλύψει [Κύριος τὸ σωτήριον αὐτοῦ πᾶσι τοῖς ἔθνεσι].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/005.yaml
  text: For they gave us all these things as an inheritance, saying, ‘Keep the commandments of God until the time when [the Lord reveals his salvation to all the nations].’
translation:
  language: hi
  text: क्योंकि उन्होंने ये सब बातें हमें विरासत के रूप में दीं और कहा, “परमेश्वर की आज्ञाओं का पालन करते रहो, जब तक कि [प्रभु सब राष्ट्रों को अपना उद्धार प्रकट न करे]।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: विरासत के रूप में
  rationale: वंशगत रूप से सौंपी गई धरोहर के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Φυλάξατε
  choice: पालन ... करते रहो
  rationale: आज्ञाओं को सुरक्षित रखने और निरंतर मानते रहने के आशय को प्रसंगानुकूल हिन्दी में व्यक्त करता है।
- source_word: ἀποκαλύψει
  choice: प्रकट न करे
  rationale: भविष्यकालीन प्रकटीकरण के अर्थ को ‘जब तक’ वाले हिन्दी उपवाक्य में स्वाभाविक रूप से रखता है।
- source_word: τὸ σωτήριον αὐτοῦ
  choice: अपना उद्धार
  rationale: ग्रीक पद के उद्धारकारी कार्य/उद्धार के अर्थ को संक्षिप्त और धर्मशास्त्रीय रूप से खुला रखता है।
- source_word: πᾶσι τοῖς ἔθνεσι
  choice: सब राष्ट्रों पर
  rationale: दत्तिव के प्रकटीकरण-प्राप्तकर्ता वाले भाव को दर्शाता है; ‘राष्ट्र’ ἔθνη के सामूहिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: उद्धार के प्रकटीकरण की दिशा
  choice: सब राष्ट्रों पर अपना उद्धार प्रकट
  alternative: सब राष्ट्रों को अपना उद्धार प्रकट
  rationale: ग्रीक दत्तिव दोनों प्रकार से समझा जा सकता है; ‘पर’ सार्वजनिक और सार्वभौमिक प्रकटीकरण का भाव रखता है, बिना यह तय किए कि हर राष्ट्र उद्धार प्राप्त ही करता है।
- issue: कोष्ठकित पाठ की पाठालोचनात्मक स्थिति
  choice: मुख्य पाठ में वर्ग कोष्ठक बनाए रखे
  alternative: कोष्ठक हटाकर पाठ को निर्विवाद रूप में प्रस्तुत करना
  rationale: दिए गए मूल स्रोत में यह अंश वर्ग कोष्ठकों में है; उसकी पाठालोचनात्मक अनिश्चितता को छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘करते रहो’ निरंतर आज्ञापालन का भाव देता है। स्रोत में कोई फुटनोट-पाठ उपलब्ध न होने के कारण हिन्दी मुख्य पाठ में फुटनोट चिह्न नहीं जोड़े गए; वर्ग कोष्ठक मूल-स्रोत की स्थिति के अनुरूप सुरक्षित हैं।
