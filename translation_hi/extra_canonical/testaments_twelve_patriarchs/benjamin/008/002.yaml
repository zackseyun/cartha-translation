id: T12P.BEN.8.2
reference: Testament of Benjamin 8:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ καθαρὸς νοῦς οὐκ ἔχει μιασμὸν ἐπὶ¹⁷ κόπρου¹⁸ καὶ¹⁹ βόρβορον²⁰, Γ*ἀλλὰ μᾶλλον²¹ ἀμφότερα ψύγει²² καὶ ἀπελαύνει τὴν δυσωδίαν⁷, οὕτω καὶ ὁ καθαρὸς²³ νοῦς ἐν τοῖς μιασμοῖς²⁴ τῆς¹⁷ γῆς συνεχόμενος μᾶλλον †οἰκοδομεῖ²⁶, αὐτὸς δὲ οὐ μιαίνεται⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/002.yaml
  text: For the pure mind has no defilement from dung or filth, but rather repels both and drives away the stench; thus also the pure mind, when held among the defilements of the earth, rather †builds up†, and is itself not defiled.
translation:
  language: hi
  text: क्योंकि शुद्ध मन मल और कीचड़ से अशुद्ध नहीं होता, बल्कि वह उन दोनों को ठंडा करता है और दुर्गंध को दूर भगा देता है। इसी प्रकार, शुद्ध मन पृथ्वी की अशुद्धताओं में जकड़ा हुआ होने पर भी †निर्माण करता है†[a] और स्वयं अशुद्ध नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ †οἰκοδομεῖ† (‘निर्माण करता है’) क्रक्स-चिह्नों में है; अर्थात् इस स्थान का पाठ संदिग्ध माना गया है।
    reason: मूल संस्करण के क्रक्स-चिह्न को सुरक्षित रखते हुए पाठक को पाठगत अनिश्चितता बताना आवश्यक है; किसी अनुमानित अर्थ को निश्चित नहीं किया गया है।
lexical_decisions:
- source_word: καθαρὸς νοῦς
  choice: शुद्ध मन
  rationale: यह मूल यूनानी पद का सीधा और स्वाभाविक हिन्दी रूप है; नैतिक और आंतरिक शुद्धता का भाव बनाए रखता है।
- source_word: κόπρου καὶ βόρβορον
  choice: मल या कीचड़
  rationale: κόπρος के लिए ‘मल’ और βόρβορος के लिए ‘कीचड़’ सामान्य, स्पष्ट और गरिमापूर्ण शब्द हैं। यूनानी में καί है, पर निषेध के दायरे में हिन्दी का ‘या’ अधिक स्वाभाविक है।
- source_word: ψύγει
  choice: दूर हटा देता है
  rationale: प्राप्त पाठ का सामान्य शाब्दिक अर्थ ‘ठंडा करता है’ होगा, जो इस संदर्भ में असंगत प्रतीत होता है। वाक्य के समानांतर भाव और परामर्श-पाठ के अनुसार यहाँ विकर्षित करने या दूर करने का अर्थ लिया गया है।
- source_word: ἀπελαύνει τὴν δυσωδίαν
  choice: दुर्गंध मिटा देता है
  rationale: शाब्दिक भाव ‘दुर्गंध को खदेड़ देता है’ है; ‘मिटा देता है’ आधुनिक हिन्दी में वही परिणाम स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τοῖς μιασμοῖς τῆς γῆς συνεχόμενος
  choice: पृथ्वी की अशुद्धताओं के बीच घिरा रहने पर भी
  rationale: συνεχόμενος का दबे, रोके या घिरे होने का भाव ‘घिरा रहने’ से व्यक्त होता है; ‘पर भी’ विरोधाभास को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: †οἰκοδομεῖ†
  choice: †निर्माण करता है†
  rationale: प्राप्त यूनानी पद का सामान्य अर्थ ‘निर्माण करता है’ या ‘उन्नति करता है’ है, किंतु संदर्भ में पाठ संदिग्ध है; इसलिए अर्थ को सुधारकर निश्चित नहीं किया गया और क्रक्स-चिह्न बनाए रखे गए हैं।
theological_decisions:
- issue: सांसारिक अशुद्धताओं के बीच शुद्ध मन की अवस्था
  choice: ‘स्वयं अशुद्ध नहीं होता’ को स्पष्ट प्रतिज्ञान के रूप में रखा गया
  alternative: इसे पूर्ण निष्पापता या किसी विशिष्ट शुद्धीकरण-सिद्धांत की शिक्षा के रूप में विस्तार देना
  rationale: मूल केवल बाहरी अशुद्धताओं के बीच मन के अशुद्ध न होने की बात कहता है; उससे आगे कोई सांप्रदायिक या व्यवस्थित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
- issue: संदिग्ध क्रिया †οἰκοδομεῖ† का धर्मवैज्ञानिक अर्थ
  choice: ‘निर्माण करता है’ के रूप में खुला और संदिग्ध रखा गया
  alternative: ‘दूसरों की उन्नति करता है’, ‘सद्गुण बढ़ाता है’ या ‘शुद्ध करता है’
  rationale: ये विकल्प संदर्भ को सुगम बना सकते हैं, पर मूल के अस्पष्ट पाठ से निश्चित नहीं होते; इसलिए वास्तविक पाठगत तनाव सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की पुनरुक्ति (‘शुद्ध मन’) और नैतिक विरोधाभास सुरक्षित हैं। संदिग्ध पाठ को मौन रूप से ठीक नहीं किया गया।
