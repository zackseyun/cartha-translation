  text: VIII. *Ὑμεῖς δέ¹, *τέκνα μου², ἀπόδρατε³ τὴν κακίαν, Γ*τὸν φθόνον⁴ καὶ τὴν⁵ μισαδελφίαν⁶, καὶ προσκολλᾶσθε⁶ τῇ ἀγαθότητι Γκαὶ τῇ ἀγάπῃ⁷⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/001.yaml
  text: But you, my children, flee evil — envy and hatred of brothers — and cling to goodness and love.
translation:
  language: hi
  text: परन्तु हे मेरे बच्चों, बुराई से—अर्थात् ईर्ष्या और भाई-बन्धुओं के प्रति घृणा से—दूर भागो, और भलाई तथा प्रेम से जुड़े रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδρατε τὴν κακίαν
  choice: बुराई से भागो
  rationale: आज्ञार्थक क्रिया में तत्काल और सक्रिय रूप से दूर भागने का भाव है; ‘बुराई से बचो’ की अपेक्षा यह स्रोत की तीव्रता अधिक स्पष्ट रखता है।
- source_word: φθόνον
  choice: ईर्ष्या
  rationale: यह दूसरे की भलाई या उन्नति से जलने वाले द्वेषपूर्ण भाव का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: μισαδελφίαν
  choice: भाई-बन्धुओं से घृणा
  rationale: यौगिक शब्द का अर्थ अपने भाइयों अथवा समुदाय के भाई-बन्धुओं के प्रति घृणा है। ‘भाई-बन्धु’ पारिवारिक और सामुदायिक दोनों सम्भावनाएँ खुली रखता है।
- source_word: προσκολλᾶσθε
  choice: लिपटे रहो
  rationale: क्रिया दृढ़ता से जुड़ने और जुड़े रहने का अर्थ देती है; यह केवल सामान्य अनुसरण से अधिक निकटता व्यक्त करती है।
- source_word: ἀγαθότητι
  choice: भलाई
  rationale: नैतिक अच्छाई अथवा सद्गुण के सामान्य भाव को सरल और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀγάπῃ
  choice: प्रेम
  rationale: व्यापक प्रेम का सीधा और असाम्प्रदायिक हिन्दी पर्याय।
theological_decisions:
- issue: ‘भाइयों’ का दायरा
  choice: भाई-बन्धुओं
  alternative: भाइयों
  rationale: स्रोत का μισαδελφία पारिवारिक भाइयों या व्यापक भ्रातृ-समुदाय, दोनों की ओर संकेत कर सकता है। चुना हुआ पद इस सम्भावित व्यापकता को बिना निर्णायक व्याख्या थोपे बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, उपदेशात्मक और गरिमापूर्ण स्वर रखा गया है। सम्बोधन ‘हे मेरे बच्चो’ पितृसुलभ आग्रह को प्रकट करता है; आज्ञाएँ बहुवचन में हैं। स्रोत-पाठ में चिह्नित पाठभेद वाक्य के मूल अर्थ को नहीं बदलते, इसलिए कोई पादटिप्पणी आवश्यक नहीं मानी गई।
