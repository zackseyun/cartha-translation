  text: '1. And after saying these things, he stretched out his feet and fell asleep in a good sleep[a].

    2. And his sons did as he had commanded them, and they carried up his body and buried him in Hebron with his fathers.


    2. The number of his life was one hundred and twenty-five years[b]. And when he had finished his words, he said, “I command you, my children, carry up my bones out of Egypt, and bury me in Hebron near my fathers.”

    2. And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.

    3. And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly during the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].

    4. And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.'
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 12**


    **1.** ये बातें कहने के बाद उसने अपने पैर पसारे और वह अच्छी नींद में सो गया[a]।


    **2.** उसके पुत्रों ने वैसा ही किया जैसा उसने उन्हें आज्ञा दी थी, और वे उसका शव उठाकर ले गए और उसे हेब्रोन में उसके पूर्वजों के साथ दफ़ना दिया।


    **2.** और अपनी बातें पूरी करने के बाद उसने कहा, “मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ कि मेरी हड्डियाँ मिस्र से ऊपर ले जाना और मुझे हेब्रोन में मेरे पूर्वजों के पास दफ़ना देना।”[b]


    **2.** बिन्यामीन एक सौ पच्चीस वर्ष की आयु में, अच्छी वृद्धावस्था में मर गया; और उन्होंने उसे एक ताबूत में रख दिया।


    **3.** इस्राएल के पुत्रों के मिस्र से निकलने के इक्यानवेवें वर्ष में, वे और उनके भाई कनान में युद्ध के दौरान चुपके से अपने पूर्वजों की हड्डियाँ ऊपर ले गए और उन्हें हेब्रोन में अपने पूर्वजों के पैरों के पास दफ़ना दिया[c]।


    **4.** फिर वे कनान देश से लौट आए और मिस्र देश से अपने निकलने के दिन तक मिस्र में रहे।


    **पादटिप्पणियाँ**


    [a] कुछ यूनानी पांडुलिपियों में “अच्छी नींद” के बाद “और भली” भी जोड़ा गया है।


    [b] इस अध्याय में बिन्यामीन की मृत्यु और दफ़न तथा बाद में पूर्वजों की हड्डियाँ ले जाए जाने के बारे में एक-दूसरे पर चढ़े हुए समापन-विवरण सुरक्षित हैं। यह दोहराव संभवतः पाठ के संप्रेषण के जटिल इतिहास को दर्शाता है; यहाँ यूनानी साक्ष्य में जैसा पाठ मिला है, उसका वैसा ही अनुवाद किया गया है।


    [c] “अपने पूर्वजों के पैरों के पास” यूनानी पाठ का शाब्दिक रूप है। इसका आशय सीधे उनके पैरों के पास दफ़नाना न होकर पूर्वजों की कब्रों के निकट दफ़नाना भी हो सकता है।'
  philosophy: optimal-equivalence
