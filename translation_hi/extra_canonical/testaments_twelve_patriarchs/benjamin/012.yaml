    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: अच्छी नींद सो गया
  rationale: मृत्यु के लिए प्रयुक्त निद्रा-रूपक और यूनानी में नींद से जुड़े शब्दों की पुनरुक्ति दोनों सुरक्षित रखता है; इसे केवल “शांति से मर गया” कहकर अर्थ को सीमित नहीं करता।
- source_word: ἄραντες
  choice: उसका शव ऊपर ले गए
  rationale: क्रिया में उठाने अथवा ऊपर ले जाने का ठोस भाव है और यह आगे हड्डियों को मिस्र से ऊपर ले जाने की आज्ञा से शाब्दिक-सांकेतिक संबंध बनाए रखता है।
- source_word: ἐντέλλομαι
  choice: मैं तुम्हें आज्ञा देता हूँ
  rationale: पिता की अंतिम वसीयती आज्ञा की प्रबलता को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀνενέγκατε
  choice: मेरी हड्डियाँ मिस्र से ऊपर ले जाना
  rationale: मिस्र से अवशेष ऊपर ले जाने की गति और पूर्ववर्ती “ऊपर ले गए” से विषयगत संबंध सुरक्षित रहता है।
- source_word: ὀστᾶ
  choice: हड्डियाँ
  rationale: यूनानी का ठोस शारीरिक शब्द रखा गया है; सामान्यीकृत “अवशेष” मूल की विशिष्टता कम कर देता।
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: मेरे पूर्वजों के पास
  rationale: स्थानिक निकटता और वंशगत संबंध दोनों रखता है, पर दफ़न की सटीक व्यवस्था का अनावश्यक अनुमान नहीं लगाता।
- source_word: ἐν γήρει καλῷ
  choice: अच्छे बुढ़ापे में
  rationale: यूनानी बाइबिलीय मुहावरे का औपचारिक रूप सुरक्षित रखते हुए हिन्दी में बोधगम्य है।
- source_word: ἐν παραθήκῃ
  choice: एक ताबूत में
  rationale: शव को सुरक्षित रखे जाने के इस दफ़न-संदर्भ में ताबूत संभावित मूर्त अभिप्राय है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐν κρυφῇ
  choice: चुपके से
  rationale: कार्य के गुप्त ढंग को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: अपने पूर्वजों के पैरों के पास
  rationale: असामान्य यूनानी शारीरिक बिंब को सामान्य “पूर्वजों के पास” में समतल करने के बजाय सुरक्षित रखता है; संभावित स्थानिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अध्याय में दोहराए गए मृत्यु और दफ़न के समापन-विवरण
  choice: सभी सुरक्षित यूनानी विवरणों और उनकी पुनरावृत्ति का अनुवाद किया गया है।
  alternative: विवरणों को मिलाकर एक सुगम समापन बनाना या कुछ पंक्तियों को गौण मानकर हटाना।
  rationale: प्राप्त पाठ की जटिलता को चुपचाप सामंजस्यपूर्ण बनाना उचित नहीं; [b] में पाठक को इस संप्रेषणगत जटिलता से अवगत कराया गया है।
- issue: निर्गमन के इक्यानवेवें वर्ष का कालक्रम
  choice: विशिष्ट काल-सूचना को पाठ में सीधे रखा गया है।
  alternative: कालक्रम में संशोधन करना या उसे अस्पष्ट भाव में कहना।
  rationale: यूनानी साक्ष्य एक निश्चित कालगत दावा करता है; बाद में मिस्र लौटने के कथन से उत्पन्न ऐतिहासिक तनाव को अनुमान से दूर नहीं किया गया।
- issue: निद्रा के रूप में मृत्यु
  choice: “अच्छी नींद सो गया” कहकर रूपक और उसकी पुनरुक्ति बनाए रखी गई है।
  alternative: “शांति से मर गया” कहकर मृत्यु का अर्थ स्पष्ट कर देना।
  rationale: मूल की व्यंजना मृत्यु की ओर संकेत करती है, पर उसे सीधे व्यक्त नहीं करती; अनुवाद उसी साहित्यिक और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। “पूर्वज,” “आज्ञा,” और “अच्छे बुढ़ापे” जैसे शब्द वसीयतनामाई-बाइबिलीय गरिमा रखते हैं; “चुपके से” कृत्रिम संस्कृतनिष्ठता से बचाता है। मूल और परामर्श-पाठ में सुरक्षित असामान्य पुनरावृत्ति तथा पद-संख्या को जानबूझकर समतल नहीं किया गया।
