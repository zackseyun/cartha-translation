  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011.yaml
  text: '1 No longer shall I be called a ravening wolf because of your ravaging[a], but a worker of the Lord, distributing food to those who do what is good.

    2 And in the last times there shall arise from my seed one beloved of the Lord, hearing his voice and doing the good pleasure of his will, enlightening all the nations with new knowledge, entering upon Israel in salvation, and snatching away from them as a wolf, and giving to the gathering of the nations.

    3 Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.

    4 And in holy books he shall be recorded, both his work and his word; and he shall be God''s chosen one forever.

    5 And through him he shall pass through again as Jacob my father, saying[e][d][c][b], “He will fill up what is lacking in your tribe.”'
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 11**


    **1** अब तुम्हारी लूटमार के कारण मुझे फिर कभी लूटनेवाला भेड़िया नहीं कहा जाएगा, बल्कि प्रभु का कार्यकर्ता कहा जाएगा, जो भलाई करनेवालों को भोजन बाँटता है।


    **2** और बाद के समयों में यहूदा और लेवी के वंश से प्रभु का एक प्रिय जन उठ खड़ा होगा। वह अपने मुख से मनभावना कार्य करेगा, और नए ज्ञान से सभी राष्ट्रों को प्रकाशमान करेगा—वह ज्ञान का प्रकाश होगा।[a] वह उद्धार के साथ इस्राएल में प्रवेश करेगा,[b] भेड़िए के समान उनसे छीन लेगा, और राष्ट्रों की सभा को देगा।[c]


    **3** युग की पूर्णता तक[d] वह राष्ट्रों की सभाओं में और उनके शासकों के बीच रहेगा, और सबके मुख में संगीत की मधुर धुन के समान होगा।


    **4** पवित्र पुस्तकों में उसका काम और उसका वचन लिखा जाएगा; और वह सदा के लिए परमेश्वर का चुना हुआ जन होगा।


    **5** और उनके द्वारा वह मेरे पिता याकूब के समान आकर भेंट करेगा और कहेगा,[e] “वह तेरे गोत्र की कमियों को पूरा करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अध्याय का यूनानी पाठ, विशेषकर पद 2, पाठगत रूप से कठिन है। कुछ अंश विस्तारित या आंशिक रूप से दोहराए हुए प्रतीत होते हैं। यहाँ दिए गए यूनानी साक्ष्य का अनुवाद किया गया है और उसकी असामान्य पुनरुक्ति को पूरी तरह समतल नहीं किया गया।
    reason: textual_variant
  - marker: b
    text: 'कठिन यूनानी वाक्यांश का अर्थ यह भी हो सकता है: “उद्धार के द्वारा इस्राएल के बीच हस्तक्षेप करेगा।”'
    reason: lexical_alternative
  - marker: c
    text: यूनानी में दी जानेवाली वस्तु कही नहीं गई है। “राष्ट्रों की सभा” का अनुवाद “राष्ट्रों का जमावड़ा” भी किया जा सकता है।
    reason: ambiguity
  - marker: d
    text: अर्थात “युग के अंत तक” या “युग के पूरा होने तक।”
    reason: lexical_alternative
  - marker: e
    text: अंतिम वाक्य अस्पष्ट है। यूनानी में “उनके द्वारा” बहुवचन है; यह स्पष्ट नहीं है कि ‘वह’ कौन है और याकूब से तुलना किस प्रकार की जा रही है। φοιτήσει आने-जाने, पहुँचने या भेंट करने का भाव दे सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: लूटनेवाला भेड़िया
  rationale: यह ἅρπαξ की हिंसक, छीननेवाली शक्ति को बनाए रखता है और आगे ἁρπάζων के साथ शब्द-चित्र का संबंध भी स्पष्ट रखता है।
- source_word: ἁρπαγάς
  choice: लूटमार
  rationale: हिंसक रूप से छीनने और उजाड़ने का भाव देता है तथा पहले पद के भेड़िए वाले बिंब से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐργάτης Κυρίου
  choice: प्रभु का कार्यकर्ता
  rationale: ἐργάτης को सामान्यीकृत करके ‘सेवक’ नहीं बनाया गया; काम करनेवाले व्यक्ति का ठोस अर्थ सुरक्षित है।
- source_word: διαδιδὼν τροφὴν
  choice: भोजन बाँटता है
  rationale: भक्षक भेड़िए से दूसरों को भोजन देनेवाले व्यक्ति की ओर हुए उलटाव को सरल और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἀγαπητὸς Κυρίου
  choice: प्रभु का एक प्रिय जन
  rationale: भविष्य के व्यक्ति के लिए आदरपूर्ण भाषा रखते हुए यूनानी के संबंधसूचक अर्थ को सीधे व्यक्त करता है।
- source_word: ἐν ὑστέροις
  choice: बाद के समयों में
  rationale: मूल पदबंध में καιροῖς नहीं है; इसलिए अनिवार्य रूप से ‘अंतिम समय’ का निश्चित युगांतकारी अर्थ नहीं जोड़ा गया।
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη / φῶς γνώσεως
  choice: नए ज्ञान से सभी राष्ट्रों को प्रकाशमान करेगा—वह ज्ञान का प्रकाश होगा
  rationale: पाठ में साथ-साथ आए प्रकाश और ज्ञान के दोनों पदबंधों को मिटाए बिना उनकी कुछ हद तक पुनरुक्त संरचना बनाए रखता है।
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: उद्धार के साथ इस्राएल में प्रवेश करेगा
  rationale: कठिन यूनानी वाक्यांश में आगमन/प्रवेश और उद्धार दोनों भाव सुरक्षित रखे गए हैं; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: भेड़िए के समान उनसे छीन लेगा
  rationale: मूल की तरह छीनी जानेवाली वस्तु को अनिर्दिष्ट रखा गया है और भेड़िए का पुनरावर्ती बिंब सुरक्षित है।
- source_word: συναγωγῇ τῶν ἐθνῶν
  choice: राष्ट्रों की सभा
  rationale: συναγωγή के सामूहिक अर्थ को व्यक्त करता है, पर किसी बाद की विशिष्ट कलीसियाई संस्था को पाठ में नहीं डालता।
- source_word: συντελείας τοῦ αἰῶνος
  choice: युग की पूर्णता
  rationale: समापन और परिपूर्ण होने के दोनों भावों को बनाए रखता है; सहज विकल्प पाद-टिप्पणी में है।
- source_word: ὡς μουσικὸν μέλος ἐν στόματι πάντων
  choice: सबके मुख में संगीत की मधुर धुन के समान
  rationale: सार्वजनिक स्मरण या उच्चारण के काव्यात्मक बिंब को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: δι᾽ αὐτῶν φοιτήσει
  choice: उनके द्वारा वह ... आकर भेंट करेगा
  rationale: αὐτῶν के बहुवचन को एकवचन में बदलने के बजाय रखा गया है; φοιτήσει के आने-जाने अथवा भेंट करने के अर्थ को ‘आकर भेंट करेगा’ से व्यक्त किया गया है।
- source_word: τὰ ὑστερήματα τῆς φυλῆς σου
  choice: तेरे गोत्र की कमियों को पूरा करेगा
  rationale: ὑστερήματα की कमी/अभाव और ἀναπληρώσει की पूर्ति का परस्पर संबंध सीधे बनाए रखता है।
theological_decisions:
- issue: पद 2 में भावी प्रिय जन की वंशावली
  choice: दिए गए यूनानी पाठ के अनुसार ‘यहूदा और लेवी के वंश से’
  alternative: अंग्रेज़ी परामर्श-पाठ का ‘मेरे वंश से’, अर्थात बिन्यामीन का वंश
  rationale: प्रस्तुत यूनानी साक्ष्य में ἐκ σπέρματος Ἰούδα καὶ Λευί स्पष्ट है। पाठ की संभावित विस्तारित अवस्था को टिप्पणी में बताया गया है, पर मुख्य पाठ को अंग्रेज़ी परत के अनुसार नहीं बदला गया।
- issue: भावी व्यक्ति का मसीही या अन्य धार्मिक परिचय
  choice: उसे केवल ‘प्रभु का प्रिय जन’ और ‘परमेश्वर का चुना हुआ जन’ कहा गया
  alternative: उसे स्पष्ट रूप से मसीहा, मसीह, नबी या किसी नामित ऐतिहासिक व्यक्ति के रूप में पहचानना
  rationale: यूनानी पाठ उच्च और भविष्यसूचक भाषा का उपयोग करता है, पर व्यक्ति की निश्चित पहचान नहीं देता; इसलिए धार्मिक तनाव और अनिश्चितता सुरक्षित रखी गई है।
- issue: ἔθνη का अर्थ
  choice: राष्ट्र
  alternative: गैर-यहूदी
  rationale: यहूदी वसीयतनामा-संदर्भ में व्यापक सामूहिक अर्थ सुरक्षित रहता है और बाद की धार्मिक अंदरूनी/बाहरी श्रेणी समय से पहले नहीं थोपी जाती।
- issue: पद 5 में δι᾽ αὐτῶν का वचन और अस्पष्ट कर्ता
  choice: बहुवचन ‘उनके द्वारा’ तथा अनिर्दिष्ट ‘वह’ को रखा गया
  alternative: ‘उसके द्वारा’ करके इसे पद 2 के एक भावी व्यक्ति से स्पष्ट रूप से जोड़ना
  rationale: दिए गए यूनानी में αὐτῶν बहुवचन है और वाक्य का संबंध अस्पष्ट है। एक निश्चित मसीही या प्रतिनिधिक अर्थ थोपने के बजाय कठिनाई पाद-टिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, देवनागरी और गरिमापूर्ण भविष्यसूचक शैली में है। वाक्य सामान्य पाठक के लिए सुबोध रखे गए हैं, लेकिन पद 2 और 5 की वास्तविक पाठगत असहजता को कृत्रिम रूप से दूर नहीं किया गया। ‘प्रभु’, ‘परमेश्वर’, ‘राष्ट्र’, ‘गोत्र’ और ‘उद्धार’ जैसे परिचित धार्मिक शब्द प्रसंगानुकूल हैं; किसी विशिष्ट संप्रदाय की पारिभाषिक पहचान नहीं जोड़ी गई।
