id: T12P.BEN.6.4
reference: Testament of Benjamin 6:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Τὸ¹⁶ ἀγαθὸν διαβούλιον *οὐ δέχεται δόξης ⌈οὐκ ἀτιμίας⌉¹⁷ ἀνθρώπων, *καὶ πάντα δόλον¹⁸ ἢ¹⁹ ψεῦδος ἢ²⁰ μάχην *ἢ λοιδωρίαν²¹ *οὐκ οἶδε²². *Κύριος γὰρ²³ ἐν αὐτῷ κατοικεῖ²⁴, καὶ φωτίζει τὴν²⁵ ψυχὴν αὐτοῦ, καὶ χαίρει²⁶ πρὸς πάντας²⁷ ἐν παντὶ καιρῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/004.yaml
  text: A good purpose does not accept glory or dishonor from people, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him, and he lights up his soul, and he rejoices toward all at every time.
translation:
  language: hi
  text: भला संकल्प लोगों से न तो सम्मान स्वीकार करता है, न अपमान; और वह किसी छल, झूठ, झगड़े या निन्दा को नहीं जानता। क्योंकि प्रभु उस व्यक्ति में वास करता है, उसकी आत्मा को प्रकाश देता है, और वह व्यक्ति हर समय सबके प्रति आनन्दित रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ἀγαθὸν διαβούλιον
  choice: भला संकल्प
  rationale: διαβούλιον विचारपूर्वक ठहराए गए उद्देश्य या संकल्प को सूचित करता है; ‘भला संकल्प’ हिन्दी में स्वाभाविक रहते हुए नैतिक अर्थ बनाए रखता है।
- source_word: δόξης ... ἀτιμίας
  choice: सम्मान ... अपमान
  rationale: यह युग्म सामाजिक प्रतिष्ठा और अनादर का विरोध प्रकट करता है; ‘सम्मान/अपमान’ आधुनिक हिन्दी में स्पष्ट और संतुलित है।
- source_word: δόλον ... ψεῦδος ... μάχην ... λοιδωρίαν
  choice: छल, झूठ, झगड़े या निन्दा
  rationale: चारों संज्ञाओं का पृथक नैतिक बल सुरक्षित रखा गया है; μάχη यहाँ सामान्य संघर्ष या झगड़े के अर्थ में है और λοιδορία अपमानजनक निन्दा को दर्शाता है।
- source_word: φωτίζει τὴν ψυχὴν αὐτοῦ
  choice: उसकी आत्मा को प्रकाश देता है
  rationale: φωτίζει के प्रकाश-संबंधी रूपक को अक्षुण्ण रखते हुए हिन्दी में स्वाभाविक क्रिया-प्रयोग चुना गया है।
- source_word: χαίρει πρὸς πάντας ἐν παντὶ καιρῷ
  choice: हर समय सबके प्रति आनन्दित रहता है
  rationale: πρὸς πάντας की संबंधपरक दिशा और ἐν παντὶ καιρῷ की सार्वकालिकता दोनों को निकटता से रखा गया है।
theological_decisions:
- issue: ἐν αὐτῷ में सर्वनाम का संदर्भ
  choice: ‘उसमें’—भले संकल्प वाले व्यक्ति की ओर संकेत
  alternative: ‘भले संकल्प में’
  rationale: अगले पदबंध ‘उसकी आत्मा’ और ‘वह आनन्दित रहता है’ किसी व्यक्ति को विषय बनाते हैं; फिर भी यूनानी नपुंसकलिंग संकल्प से व्याकरणिक निकटता के कारण हल्का संदर्भगत तनाव बना रहता है।
- issue: φωτίζει का कर्ता
  choice: प्रभु
  alternative: भला संकल्प वाला व्यक्ति स्वयं अपनी आत्मा को प्रकाशित करता है
  rationale: निकटतम स्पष्ट कर्ता κύριος है और अंग्रेज़ी परामर्श-पाठ भी इसी पठन का समर्थन करता है; अतः प्रभु को संयुक्त क्रियाओं ‘वास करता है’ और ‘प्रकाश देता है’ का कर्ता रखा गया है।
- issue: χαίρει का कर्ता
  choice: भले संकल्प वाला व्यक्ति
  alternative: प्रभु
  rationale: αὐτοῦ के बाद मानवीय विषय की ओर लौटना प्रसंग और सद्गुण-वर्णन के अनुकूल है, यद्यपि यूनानी में कर्ता व्यक्त नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की क्रमिक सूची और कारणसूचक संरचना को बनाए रखते हुए अत्यधिक शब्दशः या कृत्रिम वाक्य-विन्यास से बचा गया है।
