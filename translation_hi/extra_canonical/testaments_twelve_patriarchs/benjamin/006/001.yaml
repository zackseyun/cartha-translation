source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VI. Τὸ διαβούλιον τοῦ ἀγαθοῦ ἀνδρὸς οὐκ ἔστιν ἐν χειρὶ πλάνης¹ πνεύματος² Βελίαρ· ὁ γὰρ ἄγγελος τῆς εἰρήνης ὁδηγεῖ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/001.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar's error, for the angel of peace guides his soul.
translation:
  language: hi
  text: भले मनुष्य का संकल्प बलियार के भटकाव की आत्मा के वश में नहीं होता, क्योंकि शांति का दूत उसकी आत्मा का मार्गदर्शन करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβούλιον
  choice: संकल्प
  rationale: यह शब्द विचारपूर्वक ठहराए गए उद्देश्य या अभिप्राय को व्यक्त करता है; यहाँ ‘संकल्प’ स्वाभाविक और संक्षिप्त है।
- source_word: ἀγαθοῦ ἀνδρός
  choice: भले मनुष्य
  rationale: ἀγαθός के नैतिक अर्थ को आधुनिक, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν χειρί
  choice: के वश में
  rationale: शाब्दिक ‘हाथ में’ यहाँ नियंत्रण या अधिकार का मुहावरा है; हिन्दी में ‘वश में’ वही अर्थ स्वाभाविक रूप से देता है।
- source_word: πλάνης πνεύματος Βελίαρ
  choice: बलियार की ओर से आनेवाली भटकानेवाली आत्मा
  rationale: यूनानी पदबंध का संबंध कुछ अस्पष्ट है। यह चयन πλάνη के सक्रिय अर्थ—भटकाना—और बलियार से आत्मा के संबंध, दोनों को व्यक्त करता है, बिना इसे केवल ‘त्रुटि’ तक सीमित किए।
- source_word: ἄγγελος τῆς εἰρήνης
  choice: शांति का दूत
  rationale: पदबंध का सीधा और पारंपरिक अर्थ सुरक्षित रखता है; ‘दूत’ साधारण पाठक के लिए स्पष्ट है।
- source_word: ψυχὴν
  choice: प्राण
  rationale: ψυχή यहाँ व्यक्ति के आंतरिक जीवन या जीवित आत्मस्वरूप को दर्शाता है; ‘प्राण’ हिन्दी में गरिमापूर्ण है और बाद वाले πνεῦμα से शब्दगत भेद भी बनाए रखता है।
- source_word: ὁδηγεῖ
  choice: मार्गदर्शन करता है
  rationale: निरंतर दिशा देने के वर्तमानकालीन भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πλάνης πνεύματος Βελίαρ का संबंध
  choice: ‘बलियार की ओर से आनेवाली भटकानेवाली आत्मा’
  alternative: ‘बलियार की भूल की आत्मा’ अथवा ‘बलियार की छलना की आत्मा’
  rationale: यूनानी में संबंधसूचक पदों की श्रृंखला एकाधिक व्याख्याएँ स्वीकार करती है। मुख्य पाठ बलियार को आत्मा का स्रोत/संबंध और πλάνη को उसका भटकानेवाला चरित्र मानता है; इससे अस्पष्टता को किसी विशिष्ट दानव-विज्ञान में कठोरता से नहीं बदला गया।
- issue: ἄγγελος को मानवीय या स्वर्गीय दूत मानना
  choice: ‘दूत’
  alternative: ‘स्वर्गदूत’
  rationale: ἄγγελος दोनों अर्थ दे सकता है। ‘दूत’ मूल की वास्तविक अस्पष्टता बनाए रखता है और अनावश्यक धर्मवैचारिक निर्धारण से बचता है।
- issue: ψυχή का स्वरूप
  choice: ‘प्राण’
  alternative: ‘आत्मा’ अथवा ‘जीवन’
  rationale: ‘प्राण’ आंतरिक जीवित व्यक्ति का अर्थ देता है, पर शरीर से पृथक आत्मा की किसी निश्चित दार्शनिक धारणा को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘बलियार’ नाम का निकट ध्वन्यंतरण है। वाक्य ने मूल के कारणसूचक संबंध और ‘वश’ बनाम ‘मार्गदर्शन’ के विरोध को सुरक्षित रखा है।
