base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/003.yaml
  text: He does not delight in pleasure, [does not grieve his neighbor, does not fill himself with luxury, does not go astray by the wanderings of the eyes]. For the Lord is his portion.
translation:
  language: hi
  text: वह सुख-भोग में आनंद नहीं लेता, [अपने पड़ोसी को दुःखी नहीं करता, अपने को विलासिता से नहीं भरता और आँखों की भटकन से बहक नहीं जाता]।[a] क्योंकि प्रभु उसका भाग है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों के भीतर का अंश स्रोत संस्करण में भी कोष्ठकों में दिया गया है, जो उसके पाठगत रूप से अनिश्चित होने का संकेत है।
    reason: मूल संस्करण में चिह्नित पाठगत अनिश्चितता को पाठक के लिए दृश्यमान रखना।
lexical_decisions:
- source_word: ἡδονῇ
  choice: सुख
  rationale: यह सामान्य ‘आनंद/सुख’ को व्यक्त करता है और अगले विशिष्ट शब्द τρυφή (‘ऐश्वर्य-विलास’) से भेद बनाए रखता है।
- source_word: τὸν πλησίον
  choice: अपने पड़ोसी को
  rationale: πλησίον का सीधा और बाइबिलीय रूप से परिचित अर्थ ‘पड़ोसी’ है; ‘अपने’ हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: τρυφῇ
  choice: ऐश्वर्य
  rationale: यह भोगपूर्ण वैभव या विलासिता का भाव देता है; ‘अपने को ऐश्वर्य से भरना’ मूल क्रिया ἐμπίπλαται की ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: आँखों के भटकाव
  rationale: असामान्य यूनानी अभिव्यक्ति की अस्पष्टता को बनाए रखते हुए आँखों के इधर-उधर भटकने या चंचल दृष्टि का भाव व्यक्त करता है।
- source_word: μερὶς
  choice: भाग
  rationale: ‘हिस्सा/विरासत में मिला अंश’ के बाइबिलीय धर्मवैचारिक अर्थ को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रभु उसका भाग है’ का आशय
  choice: रूपक को यथावत रखा गया
  alternative: प्रभु ही उसकी विरासत/सब कुछ है
  rationale: मूल का ‘भाग’ संबंधी वाचा और विरासत का रूपक धर्मवैचारिक रूप से अर्थपूर्ण है; व्याख्यात्मक विस्तार उस तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बाइबिलीय शैली रखी गई है। समानांतर नकारात्मक उपवाक्यों को मूल के निकट रखा गया है; ‘सुख’ और ‘ऐश्वर्य’ के बीच शब्दार्थगत अंतर बनाए रखा गया है।
