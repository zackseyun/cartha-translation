id: T12P.BEN.6.5
reference: Testament of Benjamin 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ ἀγαθὴ διάνοια²⁸ οὐκ ἔχει δύο γλώσσας²⁹ εὐλογίας καὶ κατάρας³⁰, ὕβρεως καὶ ⌈τιμῆς⌉³¹, ἡσυχίας καὶ ταραχῆς, ὑποκρίσεως καὶ ἀληθείας, [πενίας καὶ πλούτου]³², ἀλλὰ *μίαν ἔχει περὶ πάντας³³ εἰλικρινῆ³⁴ καὶ³⁵ καθαρὰν ⌈διάθεσιν⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/005.yaml
  text: The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, [of poverty and wealth], but rather has one sincere and pure disposition toward all.
translation:
  language: hi
  text: भला मन दो ज़बानें नहीं रखता—आशीष और शाप की, अपमान और सम्मान की, शांति और अशांति की, कपट और सत्य की, [गरीबी और धन की][a]—बल्कि वह सबके प्रति एक ही निष्कपट और शुद्ध भाव रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गरीबी और धन की’ शब्द यूनानी संस्करण में वर्ग कोष्ठकों में हैं, जो इनके पाठगत रूप से संदिग्ध होने का संकेत है।
    reason: स्रोत में चिह्नित पाठगत अनिश्चितता को पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: Ἡ ἀγαθὴ διάνοια
  choice: भला मन
  rationale: διάνοια यहाँ व्यक्ति की नैतिक मानसिक प्रवृत्ति को दर्शाता है; ‘भला मन’ सहज हिन्दी में इस अर्थ को व्यक्त करता है और अंतिम διάθεσις से अनावश्यक शब्दगत पुनरावृत्ति से बचाता है।
- source_word: δύο γλώσσας
  choice: दो ज़बानें
  rationale: मूल के ‘दो जिह्वाओं/ज़बानों’ वाले रूपक को सुरक्षित रखते हुए ‘ज़बान’ आधुनिक हिन्दी में दोहरे बोल या विरोधी वाणी का स्वाभाविक संकेत देता है।
- source_word: ὕβρεως καὶ τιμῆς
  choice: अपमान और सम्मान
  rationale: ὕβρις का यहाँ सम्मान के विलोम के रूप में अपमानजनक व्यवहार या अपमान अर्थ उपयुक्त है।
- source_word: ἡσυχίας καὶ ταραχῆς
  choice: शांति और अशांति
  rationale: यह जोड़ी स्थिरता/शांत अवस्था और हलचल/व्याकुलता का विरोध व्यक्त करती है; हिन्दी में यह संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: ὑποκρίσεως καὶ ἀληθείας
  choice: कपट और सत्य
  rationale: ‘कपट’ दिखावे या ढोंग सहित ὑπόκρισις की नैतिक असत्यता को संक्षेप में व्यक्त करता है।
- source_word: εἰλικρινῆ καὶ καθαρὰν διάθεσιν
  choice: निष्कपट और शुद्ध भाव
  rationale: ‘भाव’ यहाँ भीतर की स्थायी प्रवृत्ति या रुख को सरल हिन्दी में व्यक्त करता है; ‘निष्कपट’ और ‘शुद्ध’ दोनों विशेषणों का भेद बनाए रखा गया है।
theological_decisions:
- issue: ‘दो ज़बानें’ के रूपक का अर्थ
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: ‘दो तरह की बातें नहीं करता’
  rationale: मूल यूनानी का ठोस रूपक नैतिक द्वैधता को प्रभावशाली ढंग से व्यक्त करता है; उसे व्याख्यात्मक गद्य में बदलना आवश्यक नहीं है।
- issue: संदिग्ध पाठ ‘गरीबी और धन की’
  choice: मुख्य पाठ में वर्ग कोष्ठकों सहित रखा गया
  alternative: इसे बिना चिह्न के स्वीकार करना या मुख्य पाठ से हटाना
  rationale: उपलब्ध स्रोत में ये शब्द पाठगत संदेह के संकेतस्वरूप वर्ग कोष्ठकों में हैं; अनिश्चितता को चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। विरोधी शब्द-युग्मों की लय और मूल का ‘दो ज़बानें’ रूपक बनाए रखा गया है। ‘ज़बान’ बोलचाल में स्वाभाविक है, जबकि पूरा वाक्य साहित्यिक गरिमा बनाए रखता है।
