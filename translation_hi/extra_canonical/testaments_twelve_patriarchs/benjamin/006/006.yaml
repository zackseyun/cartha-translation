source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Οὐκ ἔχει *ὅρασιν οὔτε ἀκοὴν³⁶ διπλῆν· *πᾶν γὰρ ὃ³⁷ ποιεῖ, Γἢ³⁸ λαλεῖ, *ἢ ὁρᾷ³⁸, οἶδεν ὅτι³⁹ Κύριος ἐπισκέπτει⁴⁰ τὴν⁴¹ ψυχὴν αὐτοῦ. Καὶ καθαίρει τὴν διάνοιαν αὐτοῦ πρὸς⁴² τὸ μὴ καταγνωσθῆναι ὑπὸ *τῶν ἀνθρώπων, ὁμοίως καὶ ὑπὸ Θεοῦ. Ὁμοίως δὲ καὶ τοῦ Βελίαρ τὰ ἔργα διπλᾶ ἐστιν, καὶ ἀπλότητα ἐν αὐτοῖς οὐκ ἔχουσιν⁴³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/006.yaml
  text: It has neither double sight nor double hearing; for in everything it does, or speaks, or sees, it knows that the Lord watches over his soul. And he cleanses his mind so as not to be condemned by men, likewise also by God. And in the same way the works of Beliar are twofold, and they have no singleness in them.
translation:
  language: hi
  text: उसकी दृष्टि या श्रवण दोहरे नहीं हैं; क्योंकि वह जो कुछ करता, कहता या देखता है, उसके विषय में वह जानता है कि प्रभु उसके प्राण पर दृष्टि रखता है। वह अपनी बुद्धि को शुद्ध करता है, ताकि मनुष्यों द्वारा दोषी न ठहराया जाए, और उसी प्रकार परमेश्वर द्वारा भी। इसी प्रकार बेलियार के काम भी दोहरे हैं, और उनमें निष्कपटता नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρασιν ... ἀκοὴν διπλῆν
  choice: दृष्टि और ... सुनना दोहरा
  rationale: मूल के ‘दोहरी दृष्टि/श्रवण’ रूपक को बनाए रखा गया है; इसे केवल ‘कपट’ कहकर व्याख्यायित नहीं किया।
- source_word: ἐπισκέπτει
  choice: सुधि लेता है
  rationale: क्रिया में ध्यान देने, निरीक्षण करने और देखभाल करने का अर्थ-क्षेत्र है। ‘सुधि लेना’ इस बहुअर्थता को स्वाभाविक हिन्दी में कुछ हद तक सुरक्षित रखता है।
- source_word: ψυχὴν
  choice: प्राण
  rationale: यहाँ व्यक्ति के भीतरी जीवन/स्व को सूचित करता है; ‘प्राण’ गरिमापूर्ण है और केवल आधुनिक मनोवैज्ञानिक ‘मन’ तक अर्थ सीमित नहीं करता।
- source_word: διάνοιαν
  choice: बुद्धि
  rationale: विचारशील अंतःकरण अथवा मानसिक वृत्ति का संकेत; ‘बुद्धि’ सामान्य आधुनिक हिन्दी में सुबोध और स्रोत के निकट है।
- source_word: καταγνωσθῆναι
  choice: दोषी ठहराया जाए
  rationale: नैतिक निर्णय अथवा निंदा के न्यायात्मक भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀπλότητα
  choice: निष्कपटता
  rationale: संदर्भ में ‘दोहरेपन’ के विपरीत सरलता, एकनिष्ठता और निष्कपटता अभिप्रेत है; ‘निष्कपटता’ हिन्दी में विरोध को सबसे सहज ढंग से व्यक्त करती है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक लिप्यंतरण किया गया है, इसे व्याख्यात्मक उपाधि में नहीं बदला गया।
theological_decisions:
- issue: Κύριος ἐπισκέπτει τὴν ψυχὴν का आशय
  choice: प्रभु उसके प्राण की सुधि लेता है
  alternative: प्रभु उसके प्राण की जाँच करता है / उस पर दृष्टि रखता है
  rationale: ἐπισκέπτομαι में कृपालु देखभाल और निरीक्षण/जाँच दोनों संभव हैं। चुना हुआ वाक्यांश इस तनाव को किसी एक दिशा में कठोरता से तय नहीं करता।
- issue: मनुष्यों और परमेश्वर द्वारा दोषी ठहराया जाना
  choice: दोनों को समानांतर रखा गया
  alternative: मनुष्यों के सामने बदनामी और परमेश्वर के सामने न्याय को अलग-अलग स्पष्ट करना
  rationale: मूल ὁμοίως ... καὶ संरचना दोनों को समानांतर रखती है; अनुवाद अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
- issue: बेलियार के काम ‘दोहरे’ होना
  choice: दोहरे
  alternative: कपटी / दो-मुँहे
  rationale: διπλᾶ के रूपक को सीधे सुरक्षित रखा गया है और अगले पदांश ‘निष्कपटता नहीं’ को उसका अर्थ खोलने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। मूल के दोहरेपन बनाम निष्कपटता के शब्द-विरोध को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
