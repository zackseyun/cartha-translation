  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/002.yaml
  text: He does not look upon perishable things with passion, nor does he gather wealth for pleasure.
translation:
  language: hi
  text: वह नाशवान वस्तुओं को लालसा की दृष्टि से नहीं देखता, और न सुख-विलास के लिए धन इकट्ठा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ φθαρτά
  choice: नाशवान वस्तुओं
  rationale: यह यूनानी बहुवचन उन चीज़ों को दर्शाता है जो क्षय या विनाश के अधीन हैं; ‘नाशवान वस्तुएँ’ अर्थ को स्वाभाविक और स्पष्ट रूप में रखता है।
- source_word: ἐμπαθῶς
  choice: लालसा की दृष्टि से
  rationale: यह क्रियाविशेषण प्रबल या अनुचित वासना/आसक्ति से देखने का भाव देता है; संदर्भ में यह पदबंध केवल सामान्य ‘भावना’ के बजाय कामनापूर्ण आसक्ति को व्यक्त करता है।
- source_word: συνάγει πλοῦτον
  choice: धन इकट्ठा करता है
  rationale: συνάγει का मूल भाव संग्रह करना और πλοῦτον का अर्थ धन-संपत्ति है; यह सरल आधुनिक हिन्दी में सीधा समतुल्य है।
- source_word: εἰς φιληδονίαν
  choice: सुख-विलास के लिए
  rationale: φιληδονία सुख-भोग से प्रेम या भोगासक्ति को सूचित करता है; ‘सुख-विलास’ प्रयोजन और नैतिक भाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
