source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IX. Λέγω δὲ ὑμῖν καὶ πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου, *ὅτι πορνεύ(σ)ετε¹ πορνείαν Σοδόμων καὶ ἀπολε(ῖ)σθε ἕως βραχύ. Καὶ πάλιν ἀνανεωθήσεσθε καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/001.yaml
  text: And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again, and the kingdom of the Lord will not be among you.
translation:
  language: hi
  text: और मैं तुम्हें धर्मी हनोक के वचनों के आधार पर ये बातें भी बताता हूँ कि तुम सदोम-जैसा व्यभिचार करोगे और थोड़े समय के लिए नष्ट हो जाओगे। फिर तुम फिर से नवीकृत किए जाओगे, और प्रभु का राज्य तुम्हारे बीच नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράξεις ἀπὸ λογίων
  choice: वचनों से यह भी बताता हूँ
  rationale: यूनानी पदबंध शाब्दिक रूप से कुछ कठिन है; इसका आशय हनोक के वचनों पर आधारित आगामी कर्मों/घटनाओं की घोषणा करना है। स्वाभाविक हिन्दी में स्रोत-संबंध स्पष्ट रखा गया है।
- source_word: πορνείαν Σοδόμων
  choice: सदोम का-सा व्यभिचार
  rationale: πορνεία यौन अनैतिकता/व्यभिचार का व्यापक शब्द है। ‘का-सा’ सदोम से तुलना या सदोम-विशिष्ट प्रकार का भाव व्यक्त करता है, बिना अनावश्यक रूप से किसी एक विशेष कृत्य तक अर्थ सीमित किए।
- source_word: ἀπολεῖσθε
  choice: नष्ट हो जाओगे
  rationale: मध्य रूप का भविष्यकाल यहाँ विनाश या नाश को दर्शाता है; ‘नष्ट हो जाओगे’ इस तीव्रता को बनाए रखता है।
- source_word: ἕως βραχύ
  choice: थोड़े समय के लिए
  rationale: असामान्य यूनानी अभिव्यक्ति अस्थायी अवधि का संकेत देती है; अगले वाक्य के पुनर्नवीकरण से भी यही अर्थ समर्थित है।
- source_word: ἀνανεωθήσεσθε
  choice: नए किए जाओगे
  rationale: निष्क्रिय भविष्यकाल को बनाए रखा गया है और कर्ता को अनिर्दिष्ट छोड़ा गया है, जैसा स्रोत में है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: बहुवचन ὑμῖν के सामुदायिक/समूहगत भाव के लिए ‘तुम्हारे बीच’ स्वाभाविक है; ‘तुममें’ भी संभव है, पर वह आंतरिक अर्थ की ओर झुका सकता है।
theological_decisions:
- issue: ‘सदोम का व्यभिचार’ की पहचान
  choice: इसे व्यापक ‘व्यभिचार’ के रूप में रखा गया
  alternative: इसे किसी विशिष्ट यौन पाप के रूप में स्पष्ट करना
  rationale: मूल πορνεία व्यापक है और पद स्वयं अपराध का अधिक विशिष्ट विवरण नहीं देता; अतः व्याख्यात्मक संकीर्णता से बचा गया।
- issue: पुनर्नवीकरण का कर्ता
  choice: निष्क्रिय रूप ‘नए किए जाओगे’
  alternative: ‘प्रभु तुम्हें फिर नया करेगा’
  rationale: मूल पाठ कर्ता को स्पष्ट नहीं करता। ईश्वरीय कर्तृत्व संभव है, पर उसे पाठ में जोड़ना वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: पुनर्नवीकरण के बाद भी राज्य का न होना
  choice: तनाव को यथावत रखा गया
  alternative: वाक्य को ‘तब तक...नहीं होगा’ या सकारात्मक राज्य-प्रतिज्ञा में बदलना
  rationale: मूल पाठ में καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν स्पष्ट नकार रखता है। संदर्भ कठिन होने पर भी इसे धर्मवैज्ञानिक अपेक्षा के अनुसार सुधारा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में बहुवचन ‘तुम’, और भविष्यवाणी-सदृश गरिमामय किंतु सहज शैली। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
