source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πλὴν ἐν μερίδι ὑμῶν γενήσεται *ναὸς Θεοῦ¹⁴, καὶ *ἔσται ὁ ἔσχατος ἔνδοξος¹⁵ *ὑπὲρ τὸν πρῶτον¹⁶, καὶ *συναχθήσονται ἐκεῖ¹⁷ αἱ¹⁸ δώδεκα φυλαί, καὶ πάντα τὰ ἔθνη ἕως οὗ ὁ ὕψιστος ἀποστείλῃ¹⁹ τὸ σωτήριον αὐτοῦ²⁰ ἐν ἐπισκοπῇ μονογενοῦς προφήτου²¹. [3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/002.yaml
  text: Nevertheless, in your allotted portion there will be the temple of God, and the latter will be more glorious than the former; and there the twelve tribes and all the nations will be gathered, until the Most High sends his salvation in the visitation of an only-begotten prophet.
translation:
  language: hi
  text: फिर भी तुम्हारे हिस्से में परमेश्वर का मन्दिर होगा, और बाद का मन्दिर[a] पहले मन्दिर से अधिक महिमामय होगा। वहीं बारहों गोत्र और सभी राष्ट्र इकट्ठे किए जाएँगे, जब तक कि परमप्रधान एकलौते[b] भविष्यद्वक्ता के आगमन[c] में अपना उद्धार न भेजे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अन्तिम’; संदर्भ में सम्भवतः बाद का मन्दिर।
    reason: ἔσχατος में क्रमगत ‘बाद का’ और कालगत ‘अन्तिम’ दोनों अर्थ सम्भव हैं।
  - marker: b
    text: या ‘अद्वितीय’।
    reason: μονογενής एकमात्र होने या अपने प्रकार में अनोखा होने पर बल दे सकता है।
  - marker: c
    text: यूनानी शब्द का अर्थ ‘भेंट’, ‘निरीक्षण’ या विशेष हस्तक्षेप का समय भी हो सकता है।
    reason: ἐπισκοπή का अर्थ-क्षेत्र केवल शारीरिक आगमन से व्यापक है।
lexical_decisions:
- source_word: ἐν μερίδι ὑμῶν
  choice: तुम्हारे हिस्से में
  rationale: μερίς आवंटित हिस्से या भाग को सूचित करता है; आधुनिक हिन्दी में ‘हिस्से’ स्वाभाविक है और गोत्रीय भूभाग का संकेत बनाए रखता है।
- source_word: ὁ ἔσχατος ... ὑπὲρ τὸν πρῶτον
  choice: बाद का मन्दिर ... पहले मन्दिर से अधिक
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त हैं और निकटतम संदर्भ ‘मन्दिर’ है। ‘बाद का/पहले’ क्रमगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अन्तिम’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: συναχθήσονται
  choice: इकट्ठी की जाएँगी
  rationale: ग्रीक भविष्यकालीन कर्मवाच्य है; हिन्दी कर्मवाच्य ईश्वरीय कर्तृत्व को बिना स्पष्ट रूप से जोड़ते हुए मूल की अभिव्यक्ति बनाए रखता है।
- source_word: τὸ σωτήριον αὐτοῦ
  choice: अपना उद्धार
  rationale: σωτήριον यहाँ उद्धार अथवा उद्धारकारी साधन को सूचित कर सकता है। ‘अपना उद्धार’ मूल की संक्षिप्तता और अर्थ-विस्तार बनाए रखता है।
- source_word: μονογενοῦς προφήτου
  choice: एकलौते भविष्यद्वक्ता
  rationale: μονογενής किसी एकमात्र या अद्वितीय व्यक्ति को सूचित करता है। ‘एकलौते’ निकट और सहज हिन्दी है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐν ἐπισκοπῇ
  choice: आगमन में
  rationale: ἐπισκοπή का अर्थ भेंट, निरीक्षण या हस्तक्षेप का अवसर हो सकता है। भविष्यद्वक्ता के संदर्भ में ‘आगमन’ पठनीय है, पर व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘बाद का’ मन्दिर किसे सूचित करता है
  choice: संदर्भ के आधार पर ‘मन्दिर’ को स्पष्ट रूप से दोहराया गया
  alternative: ‘अन्तिम वाला’ या किसी व्यक्ति/युग के रूप में समझना
  rationale: ὁ ἔσχατος और τὸν πρῶτον व्याकरणतः संज्ञीकृत विशेषण हैं, पर तत्काल पूर्ववर्ती ναός उनका सबसे स्वाभाविक आशय है। ‘अन्तिम’ का संभावित कालान्तक अर्थ पादटिप्पणी में रखा गया है।
- issue: μονογενής का मसीही पारिभाषिक अर्थ
  choice: ‘एकलौते’ का अनुवाद किया गया, बिना भविष्यद्वक्ता की पहचान तय किए
  alternative: ‘अद्वितीय’ या स्पष्ट रूप से किसी नामित मसीही व्यक्ति से इसकी पहचान करना
  rationale: मूल पाठ केवल ‘एकलौते/अद्वितीय भविष्यद्वक्ता’ कहता है। अनुवाद किसी सम्प्रदायगत पहचान को पाठ में नहीं जोड़ता।
- issue: ἐπισκοπή में उद्धार भेजने का संबंध
  choice: ‘आगमन में’ रखकर संबंध की अस्पष्टता बनाए रखी गई
  alternative: ‘आगमन के द्वारा’ कहकर साधन का संबंध निश्चित करना
  rationale: ἐν साधन, अवसर या परिस्थिति सूचित कर सकता है। ‘में’ मूल की संबंधगत अस्पष्टता को अधिक अच्छी तरह सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्दिर’, ‘परमप्रधान’, ‘उद्धार’ और ‘भविष्यद्वक्ता’ जैसे स्थापित धार्मिक शब्द मूल की गंभीर शैली के अनुरूप हैं। वाक्य-रचना ग्रीक के क्रम और तनाव को यथासम्भव बनाए रखते हुए हिन्दी में स्वाभाविक की गई है।
