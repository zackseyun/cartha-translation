  terminology: ‘मंदिर का परदा’ is a natural rendering of τὸ ἅπλωμα τοῦ ναοῦ; ‘अन्यजातियों’ appropriately conveys τὰ ἔθνη in this literary-religious context. ‘परमेश्वर की आत्मा’ follows standard Hindi grammatical gender and preserves the theological term without doctrinal expansion.
