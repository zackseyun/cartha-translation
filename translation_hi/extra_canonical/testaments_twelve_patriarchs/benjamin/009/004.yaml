id: T12P.BEN.9.4
reference: Testament of Benjamin 9:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔσται τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον²⁴ καὶ μεταβήσεται²⁵ τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη, ὥσπερ²⁶ πῦρ ἐκχυνόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/004.yaml
  text: And the veil of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out.
translation:
  language: hi
  text: और मंदिर का परदा फट जाएगा, और परमेश्वर की आत्मा अन्यजातियों की ओर चली जाएगी, मानो आग उंडेली जा रही हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: मन्दिर का परदा
  rationale: ἅπλωμα का मूल भाव किसी फैलाई या लटकाई हुई वस्तु का है; मन्दिर के प्रसंग में स्वाभाविक हिन्दी ‘परदा’ है, जो अनावश्यक तकनीकीपन के बिना अभिप्रेत वस्तु बताता है।
- source_word: σχιζόμενον
  choice: फट जाएगा
  rationale: σχίζω के फाड़े या चिरे जाने के अर्थ को सहज भविष्यकालीन हिन्दी में व्यक्त करता है।
- source_word: μεταβήσεται
  choice: की ओर चला जाएगा
  rationale: क्रिया के पार जाने, स्थानांतरित होने या दूसरी ओर जाने के भाव को बनाए रखता है; इसे केवल ‘उतर आएगा’ कहना स्रोत में निहित गति को बदल देता।
- source_word: τὰ ἔθνη
  choice: अन्यजातियों
  rationale: यहाँ बहुवचन ἔθνη इस्राएल से बाहर की जातियों/राष्ट्रों की ओर संकेत करता है; ‘अन्यजातियाँ’ धार्मिक-साहित्यिक हिन्दी में संक्षिप्त और परिचित समतुल्य है।
- source_word: ὥσπερ πῦρ ἐκχυνόμενον
  choice: मानो आग उंडेली जा रही हो
  rationale: ὥσπερ की उपमा और ἐκχυνόμενον के उंडेले जाने वाले चित्र—दोनों को सुरक्षित रखता है, बिना आत्मा और आग को सीधे एक मान लेने के।
theological_decisions:
- issue: परमेश्वर के आत्मा का अन्यजातियों की ओर जाना
  choice: ‘अन्यजातियों की ओर चला जाएगा’ के रूप में दिशात्मक गति को रखा गया
  alternative: ‘अन्यजातियों पर उतर आएगा’ अथवा ‘अन्यजातियों में फैल जाएगा’
  rationale: μεταβήσεται में दूसरी ओर जाने/स्थानांतरित होने का भाव है। चुना हुआ पाठ किसी विशिष्ट ऐतिहासिक घटना या सम्प्रदायगत व्याख्या को आरोपित नहीं करता।
- issue: आग की उपमा का सम्बन्ध
  choice: ‘मानो आग उंडेली जा रही हो’
  alternative: ‘उंडेली गई आग के समान’ या ‘आग के समान उन पर उंडेला जाएगा’
  rationale: यूनानी वाक्य में उपमा का चित्र कुछ खुला हुआ है। हिन्दी में इसे इस प्रकार रखा गया है कि आग का बिम्ब स्पष्ट रहे, पर ‘उन पर’ जैसा अस्रोत तत्व न जोड़ा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और धर्मग्रन्थीय लय। ‘मन्दिर’, ‘परदा’, ‘परमेश्वर का आत्मा’ और ‘अन्यजातियाँ’ सामान्य पाठक के लिए परिचित हैं। स्रोत में कोई पाठ-टिप्पणी की सामग्री उपलब्ध न होने के कारण फुटनोट नहीं जोड़े गए।
