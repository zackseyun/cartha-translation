source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '[3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/003.yaml
  text: And he will enter into the first temple, and there the Lord will be insulted and will be lifted up on wood.[a]
translation:
  language: hi
  text: '[3] और वह पहले मन्दिर में प्रवेश करेगा, और वहाँ प्रभु का अपमान किया जाएगा और उन्हें काठ पर ऊँचा उठाया जाएगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 3–5 की पाठ-परम्परा अनिश्चित है, और इन्हें प्रायः बाद में जोड़ा गया विस्तार माना जाता है; फिर भी यहाँ इनका अनुवाद किया गया है, क्योंकि ये उपलब्ध कराए गए यूनानी पाठ में हैं।
    reason: textual_variant
lexical_decisions:
- source_word: τὸν πρῶτον ναόν
  choice: पहले मन्दिर
  rationale: क्रमसूचक πρῶτον और धार्मिक भवन के अर्थ वाले ναόν को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: Κύριος ὑβρισθήσεται
  choice: प्रभु का अपमान किया जाएगा
  rationale: ὑβρίζω यहाँ अपमान और दुर्व्यवहार का भाव रखता है; निष्क्रिय रूप को सुरक्षित रखते हुए सहज हिन्दी चुनी गई है।
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: काठ पर ऊँचा उठाया जाएगा
  rationale: ξύλον का शाब्दिक अर्थ लकड़ी या काठ है। मूल में ‘क्रूस’ स्पष्टतः नहीं है, इसलिए संभावित संकेत को व्याख्यात्मक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: ξύλον में क्रूसारोहण का संभावित संकेत
  choice: काठ पर
  alternative: क्रूस पर
  rationale: ‘क्रूस पर’ प्रसंग की एक सम्भावित मसीही व्याख्या को स्पष्ट कर देता, पर यूनानी पाठ केवल ξύλον कहता है; अतः मूल की अभिव्यक्ति और उसकी व्याख्यात्मक खुलावट सुरक्षित रखी गई।
- issue: दोनों निष्क्रिय क्रियाओं का कर्ता
  choice: दूसरी क्रिया में सम्मानसूचक सर्वनाम ‘उन्हें’ जोड़ा गया
  alternative: बिना सर्वनाम के संयुक्त निष्क्रिय वाक्य
  rationale: यूनानी में Κύριος दोनों निष्क्रिय क्रियाओं का समान कर्ता समझा जाता है। हिन्दी में स्पष्टता और प्रभु के लिए सम्मानसूचक प्रयोग हेतु ‘उन्हें’ रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध रूप अपनाया गया है। ‘मन्दिर’, ‘प्रभु’ और ‘काठ’ मूल यूनानी के निकट रहते हुए सामान्य पाठक के लिए बोधगम्य हैं; पाठगत अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
