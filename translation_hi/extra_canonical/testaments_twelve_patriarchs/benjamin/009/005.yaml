base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/005.yaml
  text: And having gone up from Hades, he will pass from earth to heaven. And I knew how lowly he would be on earth, and how glorious in heaven.
translation:
  language: hi
  text: और अधोलोक से ऊपर आने के बाद वह पृथ्वी से स्वर्ग जाएगा। और मैंने जान लिया कि वह पृथ्वी पर कैसा दीन होगा और स्वर्ग में कैसा महिमामय होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: अधोलोक
  rationale: यह यूनानी ‘हेडेस’ का स्वाभाविक हिन्दी धार्मिक-साहित्यिक समतुल्य है और इसे अंतिम दंड-स्थान के अर्थ तक सीमित नहीं करता।
- source_word: μεταβαίνων
  choice: चला जाएगा
  rationale: क्रिया में एक स्थान से दूसरे स्थान की ओर जाने या पार होने का भाव है; यहाँ पृथ्वी से स्वर्ग की दिशा स्पष्ट होने के कारण यह सहज हिन्दी है।
- source_word: ταπεινὸς
  choice: दीन
  rationale: संदर्भ में पृथ्वी पर नीची, विनम्र या अभावग्रस्त दशा का भाव है; ‘दीन’ इस अर्थ-क्षेत्र को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ἔνδοξος
  choice: महिमामय
  rationale: यह स्वर्ग में महिमा से युक्त अवस्था को व्यक्त करता है और ‘प्रसिद्ध’ जैसे लौकिक अर्थ से बचता है।
- source_word: ἔγνων
  choice: मैंने जान लिया था
  rationale: यूनानी एओरिस्ट के भूतकालीन बोध को बनाए रखता है और इसे वर्तमान काल ‘मैं जानता हूँ’ में नहीं बदलता।
theological_decisions:
- issue: ᾅδης की पहचान
  choice: अधोलोक
  alternative: नरक
  rationale: ‘नरक’ अंतिम दंड के स्थान का अधिक विशिष्ट अर्थ दे सकता है, जबकि यूनानी शब्द यहाँ मृतकों के लोक को व्यापक रूप में सूचित करता है।
- issue: ταπεινός का अर्थ
  choice: दीन
  alternative: नम्र
  rationale: ‘नम्र’ मुख्यतः चरित्रगत विनय का संकेत देता, जबकि मूल शब्द यहाँ पृथ्वी पर उसकी नीची या दीन दशा को भी व्यक्त कर सकता है; इसलिए व्यापक अर्थ वाला विकल्प रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास अपनाया गया है। सहभागी क्रिया ἀνελθών को ‘ऊपर आने के बाद’ से व्यक्त किया गया है, और पृथ्वी से स्वर्ग की गति तथा पृथ्वी की दीनता और स्वर्ग की महिमा के विरोध को स्पष्ट रखा गया है।
