  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। नामों के लिए प्रचलित हिन्दी बाइबिलीय रूप—याकूब, राहेल, बिन्यामीन, अब्राहम, इसहाक, यूसुफ और बिल्हा—अपनाए गए हैं। पद-संख्याएँ स्रोत की संरचना स्पष्ट करने के लिए दी गई हैं। आत्मीयता व्यक्त करने के लिए ‘स्नेह से चूमने’ और साधारण पाठक की स्पष्टता के लिए ‘दूध पीकर पला’ जैसे स्वाभाविक रूप चुने गए हैं।
