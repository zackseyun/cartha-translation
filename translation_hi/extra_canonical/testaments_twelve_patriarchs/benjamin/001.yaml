base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001.yaml
  text: 'The Copy of the Words of Benjamin[a], the twelfth son of Jacob, which he set in order for his sons, having lived one hundred and twenty-five years.


    And after kissing them, he said:


    Just as Isaac was born to Abraham in his old age, so I also was born to Jacob. And since Rachel my mother died while giving birth to me, I had no milk; so I was nursed by Bilhah, her maidservant. For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and after conceiving she bore me. For my father loved Rachel exceedingly, and he prayed to see two sons from her. Because of this I was called Benjamin[b], which means son of days.'
translation:
  language: hi
  text: '**याकूब और राहेल के बारहवें पुत्र बिन्यामीन की वसीयत**


    **1** यह बिन्यामीन के उन वचनों की प्रति है जिन्हें उसने अपने पुत्रों के लिए व्यवस्थित किया था। वह एक सौ पच्चीस वर्ष जीवित रहा था।


    **2** अपने पुत्रों को स्नेह से चूमने के बाद उसने कहा:


    “जिस प्रकार अब्राहम के बुढ़ापे में उसके यहाँ इसहाक का जन्म हुआ, उसी प्रकार याकूब के यहाँ मेरा जन्म हुआ। **3** मेरी माता राहेल मुझे जन्म देते समय मर गई थी,[b] इसलिए मुझे उसका दूध नहीं मिला; तब उसकी दासी बिल्हा ने मुझे दूध पिलाया। **4** यूसुफ को जन्म देने के बाद राहेल बारह वर्ष तक बाँझ रही। उसने उपवास के साथ प्रभु से प्रार्थना की; फिर गर्भवती होकर उसने मुझे जन्म दिया। **5** मेरे पिता राहेल से अत्यन्त प्रेम करते थे और प्रार्थना करते थे कि वे उससे उत्पन्न दो पुत्रों को देख सकें। **6** इसी कारण मेरा नाम बिन्यामीन रखा गया, जिसका अर्थ है ‘दिनों का पुत्र।’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति की पुस्तक में बिन्यामीन नाम की व्याख्या सामान्यतः अलग ढंग से की गई है; यहाँ यूनानी वसीयतनामा इसका अर्थ ‘दिनों का पुत्र’ बताता है।
    reason: cross_reference
  - marker: b
    text: 'उपलब्ध यूनानी पाठ की इस पंक्ति की वाक्यरचना कुछ असहज है, पर प्रसंग में अर्थ स्पष्ट है: राहेल बिन्यामीन को जन्म देते समय मर गई।'
    reason: textual_variant
lexical_decisions:
- source_word: διαθήκη
  choice: वसीयत
  rationale: शीर्षक में यह शब्द कुलपिता के अंतिम निर्देशों और विरासतस्वरूप कथन का संकेत देता है; ‘वसीयत’ आधुनिक हिन्दी में स्वाभाविक और विधा के अनुरूप है।
- source_word: ἀντίγραφον λόγων
  choice: वचनों की प्रति
  rationale: ἀντίγραφον का प्रतिलिपि-संबंधी अर्थ और λόγων का कथनों/वचनों वाला अर्थ दोनों सुरक्षित रहते हैं।
- source_word: διέθετο
  choice: व्यवस्थित किया
  rationale: क्रिया औपचारिक रूप से निर्धारित या क्रमबद्ध करने का भाव रखती है; यह अनावश्यक कानूनी अर्थ जोड़े बिना अंतिम उपदेश की सुविचारित प्रकृति बताती है।
- source_word: Καταφιλήσας
  choice: स्नेह से चूमने के बाद
  rationale: संयुक्त क्रिया आत्मीय और स्नेहपूर्ण चुम्बन का भाव देती है; हिन्दी में यह प्रसंगानुकूल और सहज है।
- source_word: ἐν γήρει αὐτοῦ
  choice: उसके बुढ़ापे में
  rationale: अब्राहम की वृद्धावस्था का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τέθνηκε γεννῶσά με
  choice: मुझे जन्म देते समय मर गई थी
  rationale: पाठ की वाक्यरचना कुछ असहज है, पर प्रसंग स्पष्ट रूप से राहेल की प्रसव के समय हुई मृत्यु को बताता है।
- source_word: γάλα οὐκ ἔσχον
  choice: मुझे उसका दूध नहीं मिला
  rationale: शाब्दिक ‘मेरे पास दूध नहीं था’ हिन्दी में अस्पष्ट होगा; प्रसंग में मातृ-दुग्ध न मिल पाने का आशय है।
- source_word: Βαλλὰν ... ἐθήλασα
  choice: मैं उसकी दासी बिल्हा का दूध पीकर पला
  rationale: ग्रीक में बिल्हा से दूध पीने/उसके द्वारा पाले जाने का भाव है; यह रूप आधुनिक हिन्दी में स्पष्ट है और अनावश्यक विवरण नहीं जोड़ता।
- source_word: ἐστείρευσεν
  choice: बाँझ रही
  rationale: यह प्रजनन-असमर्थता की अवधि को सीधे व्यक्त करता है और बारह वर्षों की अवधि से स्वाभाविक रूप से जुड़ता है।
- source_word: πρὸς Κύριον
  choice: प्रभु से
  rationale: प्रार्थना के लक्ष्य को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है; Κύριον का सम्मानसूचक धार्मिक अर्थ बना रहता है।
- source_word: μετὰ νηστείας
  choice: उपवास करके
  rationale: प्रार्थना के साथ उपवास की क्रिया को संक्षिप्त और सहज ढंग से रखता है।
- source_word: συλλαβοῦσα
  choice: गर्भवती होकर
  rationale: गर्भधारण की घटना को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Σφόδρα ἠγάπα
  choice: अत्यन्त प्रेम करते थे
  rationale: σφόδρα की तीव्रता और वसीयतनुमा गरिमामय शैली दोनों सुरक्षित हैं।
- source_word: υἱὸς ἡμερῶν
  choice: दिनों का पुत्र
  rationale: ग्रीक पाठ स्वयं यही व्युत्पत्ति देता है। इसे ‘दाहिने हाथ का पुत्र’ या ‘बुढ़ापे का पुत्र’ बनाना उपलब्ध ग्रीक साक्ष्य का सामंजस्यकारी परिवर्तन होता।
theological_decisions:
- issue: ग्रीक साक्ष्य में ‘बिन्यामीन’ नाम का अर्थ
  choice: स्पष्ट ग्रीक व्युत्पत्ति को ‘दिनों का पुत्र’ अनूदित किया गया
  alternative: उत्पत्ति की प्रचलित इब्रानी व्याख्या के अनुसार ‘दाहिने हाथ का पुत्र’, अथवा अर्थानुवाद के रूप में ‘बुढ़ापे का पुत्र’
  rationale: यहाँ उपलब्ध पाठ ὅ ἐστιν υἱὸς ἡμερῶν स्पष्ट रूप से ‘जिसका अर्थ दिनों का पुत्र है’ कहता है। मूल साक्ष्य और उत्पत्ति की प्रचलित व्याख्या के बीच तनाव को मिटाने के बजाय पाठ में बनाए रखना उचित है।
- issue: राहेल की प्रार्थना और गर्भधारण के बीच संबंध
  choice: घटनाओं का क्रम रखा गया—प्रार्थना, गर्भधारण, जन्म—पर प्रत्यक्ष कारणात्मक दावा नहीं जोड़ा गया
  alternative: यह स्पष्ट करना कि प्रार्थना के उत्तर में ही गर्भधारण हुआ
  rationale: ग्रीक पाठ घटनाओं को क्रम में रखता है, लेकिन अनुवाद में उससे अधिक स्पष्ट धर्मवैज्ञानिक कारण-परिणाम जोड़ना उचित नहीं।
