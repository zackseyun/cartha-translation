  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009.yaml
  text: '1. And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again[b], and the kingdom of the Lord will not be among you. 2. Nevertheless, in your allotted portion there will be the temple of God, and the last will be more glorious than the first; and there the twelve tribes will be gathered, and all the nations, until the Most High sends his salvation in the visitation of an only-begotten prophet.


    3. And he will enter into the first temple, and there the Lord will be treated with outrage, and he will be lifted up on wood. 4. And the curtain-spread of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out. 5. And when he has gone up from Hades, he will pass from earth to heaven. And I know how lowly he will be on earth[e][d][c], and how glorious in heaven.'
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 9**


    1. मैं तुम्हें धर्मी हनोक के वचनों में से ये घटनाएँ भी बताता हूँ: तुम सदोम का व्यभिचार करोगे और थोड़े समय के लिए नष्ट हो जाओगे। फिर तुम्हारा नवीनीकरण होगा, और प्रभु का राज्य तुम्हारे बीच नहीं होगा। 2. फिर भी, तुम्हारे भाग में परमेश्वर का मन्दिर होगा, और बाद वाला पहले वाले से अधिक महिमामय होगा। वहाँ बारहों गोत्र और सब जातियाँ इकट्ठी की जाएँगी, जब तक परमप्रधान अपने उद्धार को एकलौते भविष्यद्वक्ता की भेंट के समय न भेजे।[b]


    3.[a] वह पहले मन्दिर में प्रवेश करेगा; वहाँ प्रभु का अपमान किया जाएगा और वह लकड़ी पर ऊँचा उठाया जाएगा।[c] 4. मन्दिर का फैला हुआ परदा फट जाएगा,[d] और परमेश्वर का आत्मा उँडेले जाते हुए आग के समान जातियों के पास चला जाएगा। 5. अधोलोक से ऊपर चढ़ने के बाद[e] वह पृथ्वी से स्वर्ग की ओर जाएगा। मैं जान गया हूँ कि वह पृथ्वी पर कितना दीन होगा और स्वर्ग में कितना महिमामय।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 3–5 की पाठ-परम्परा अनिश्चित है और इन्हें प्रायः बाद की वृद्धि माना जाता है; यहाँ इनका अनुवाद इसलिए किया गया है क्योंकि ये उपलब्ध कराए गए यूनानी पाठ में हैं।
    reason: textual_variant
  - marker: b
    text: ‘एकलौते भविष्यद्वक्ता’ का अनुवाद ‘अद्वितीय भविष्यद्वक्ता’ भी हो सकता है। ‘भेंट’ के लिए प्रयुक्त यूनानी शब्द में निरीक्षण या निर्णायक हस्तक्षेप का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘लकड़ी पर ऊँचा उठाया जाएगा’ यूनानी अभिव्यक्ति का निकट अनुवाद है; ‘लकड़ी’ किसी वृक्ष या लकड़ी के खम्भे के लिए भी प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: d
    text: यहाँ यूनानी में मन्दिर के लटकते आवरण के लिए एक असामान्य शब्द है; इसे सामान्यतः मन्दिर के परदे के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: e
    text: ‘अधोलोक’ मृतकों का लोक है; इससे अनिवार्य रूप से अंतिम दण्ड का स्थान अभिप्रेत नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: πράξεις ἀπὸ λογίων
  choice: वचनों से प्रकट होनेवाली घटनाएँ
  rationale: πράξεις को केवल ‘काम’ कहने के बजाय भावी घटनाओं के अर्थ में लिया गया है, जबकि ἀπὸ λογίων के स्रोत-संबंध को बनाए रखा गया है।
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: सदोम का व्यभिचार करोगे
  rationale: ग्रीक की क्रिया-संज्ञा पुनरुक्ति का जोर हिन्दी में संक्षिप्त और गंभीर ‘व्यभिचार करोगे’ से व्यक्त होता है; ‘सदोम का’ मूल संबंध को बिना अधिक व्याख्या के रखता है।
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: थोड़े समय के लिए नष्ट हो जाओगे
  rationale: नाश के साथ जुड़ी सीमित अवधि को स्पष्ट रखा गया है और इसे ‘शीघ्र’ के अर्थ में नहीं बदला गया।
- source_word: ἀνανεωθήσεσθε
  choice: नए किए जाओगे
  rationale: भविष्यत् कर्मवाच्य और नवीकरण का अर्थ सुरक्षित रहता है; ‘पुनर्स्थापित’ जैसी अधिक व्याख्यात्मक शब्दावली से बचा गया है।
- source_word: ἐν μερίδι ὑμῶν
  choice: तुम्हारे भाग में
  rationale: यह बिन्यामीन के गोत्रीय भाग या विरासत की ओर संकेत कर सकता है; हिन्दी में ‘भाग’ इस अर्थ को खुला रखता है।
- source_word: ὁ ἔσχατος ἔνδοξος ὑπὲρ τὸν πρῶτον
  choice: बाद वाला पहले वाले से अधिक महिमामय होगा
  rationale: मन्दिर के दो चरणों या रूपों का तुलनात्मक कथन बिना अतिरिक्त पहचान जोड़े व्यक्त किया गया है।
- source_word: τὸ σωτήριον αὐτοῦ
  choice: अपने उद्धार को
  rationale: σωτήριον के संज्ञात्मक, भविष्यद्वाणी-संबंधी रूप को बनाए रखा गया है; इसे किसी व्यक्ति या घटना से स्पष्ट रूप से समान नहीं ठहराया गया।
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  choice: एकलौते भविष्यद्वक्ता के आगमन में
  rationale: ἐπισκοπή के निर्णायक आगमन/भेंट के भाव को सहज हिन्दी में दिया गया है और μονογενής की विशिष्टता तथा धर्मवैचारिक तनाव को ‘एकलौते’ से सुरक्षित रखा गया है।
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: लकड़ी पर ऊँचा उठाया जाएगा
  rationale: ξύλον को ‘क्रूस’ बनाकर व्याख्यायित नहीं किया गया; मूल की लकड़ी/काष्ठ वाली अभिव्यक्ति और कर्मवाच्य दोनों रखे गए हैं।
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: मन्दिर का फैला हुआ परदा
  rationale: असामान्य ἅπλωμα को सामान्य ‘पर्दा’ मात्र में समतल किए बिना उसके फैलाए हुए आवरण का भाव रखा गया है।
- source_word: ἐκ τοῦ ᾅδου
  choice: अधोलोक से
  rationale: ᾅδης मृतकों के लोक को सूचित करता है; इसे अंतिम दण्डस्थल के अर्थ वाले ‘नरक’ से नहीं मिलाया गया।
- source_word: ταπεινὸς
  choice: दीन
  rationale: यह विनम्र, नीची दशा या तुच्छ समझे जाने के भाव को समेटता है और महिमामय के साथ मूल विरोध को बनाए रखता है।
theological_decisions:
- issue: पद 3–5 के कोष्ठकबद्ध पाठ को शामिल करना
  choice: मुख्य पाठ में शामिल किया गया और [a] में इसकी पाठ-साक्ष्य संबंधी अनिश्चितता बताई गई।
  alternative: पद 3–5 को बाद की वृद्धि मानकर छोड़ देना या केवल पद 1–2 छापना।
  rationale: प्रदत्त यूनानी पाठ में ये पद उपस्थित हैं, यद्यपि संपादकीय कोष्ठकों में हैं; अतः इन्हें चुपचाप हटाने के बजाय पारदर्शी टिप्पणी के साथ अनूदित किया गया।
- issue: μονογενοῦς προφήτου का अर्थ
  choice: एकलौते भविष्यद्वक्ता
  alternative: अद्वितीय भविष्यद्वक्ता
  rationale: μονογενής की विशिष्ट और धर्मवैचारिक रूप से तनावपूर्ण भाषा को बनाए रखा गया है, जबकि सम्भव गुणात्मक अर्थ टिप्पणी में दिया गया है।
- issue: पद 3 में Κύριος का संदर्भ
  choice: ‘प्रभु’ को ज्यों का त्यों रखा गया।
  alternative: इसे ‘प्रभु का अभिषिक्त’ या ‘भविष्यद्वक्ता’ मानकर स्पष्ट करना।
  rationale: यूनानी में स्पष्ट रूप से Κύριος है; संदर्भ की कठिनाई को किसी बाद की धर्मवैचारिक पहचान से हल नहीं किया गया।
- issue: ἐπὶ ξύλου को क्रूस के रूप में पढ़ना
  choice: लकड़ी पर ऊँचा उठाया जाएगा
  alternative: क्रूस पर चढ़ाया जाएगा
  rationale: मूल पाठ ξύλον कहता है; सम्भावित क्रूस-संकेत को स्वीकार करते हुए भी अनुवाद में उससे अधिक विशिष्ट शब्द नहीं जोड़ा गया।
- issue: ᾅδης की प्रकृति
  choice: अधोलोक
  alternative: नरक
  rationale: यह मृतकों के लोक का सामान्य संकेत है और अनिवार्य रूप से अंतिम दण्ड के स्थान को नहीं दर्शाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-सदृश और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मन्दिर’, ‘गोत्र’, ‘उद्धार’, ‘परमप्रधान’, ‘अधोलोक’ जैसे स्थापित धार्मिक शब्द उपयोग किए गए हैं, पर पाठ में सम्प्रदायगत व्याख्या नहीं जोड़ी गई। असामान्य यूनानी पदों को जहाँ सम्भव हुआ स्वाभाविक हिन्दी में रखा गया और जहाँ अर्थगत तनाव महत्वपूर्ण था वहाँ पादटिप्पणी दी गई।
