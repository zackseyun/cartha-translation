id: T12P.BEN.7.1
reference: Testament of Benjamin 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VII. ΓΔιὰ τοῦτο¹, τέκνα μου, Γλέγω ὑμῖν¹¹, φεύγετε τὴν κακίαν² †Γτοῦ Βελίαρ³ ὅτι μάχαιραν³ δίδωσιν⁴ τοῖς πειθομένοις αὐτόν⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/001.yaml
  text: Therefore, my children, I tell you, flee the evil of Beliar, because he gives a sword to those who obey him.
translation:
  language: hi
  text: 'इसलिए, मेरे बच्चो, मैं तुमसे कहता हूँ: बेलियार की बुराई से भागो, क्योंकि वह उसकी आज्ञा मानने वालों को तलवार देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष या परिणाम का स्वाभाविक संबंध व्यक्त करता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: स्नेहपूर्ण पारिवारिक संबोधन को सरल और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: φεύγετε
  choice: भागो
  rationale: यूनानी आज्ञार्थक क्रिया में सक्रिय और तत्काल दूर हटने का भाव है; इसलिए इसे केवल ‘बचो’ बनाकर नरम नहीं किया गया।
- source_word: τὴν κακίαν τοῦ Βελίαρ
  choice: बलियार की बुराई
  rationale: सम्बन्धकारक रचना को यथावत रखा गया है, ताकि इसका अर्थ ‘बलियार से आनेवाली बुराई’ या ‘उसकी दुष्टता’—दोनों की ओर संकेत कर सके। Βελίαρ का लिप्यंतरण ‘बलियार’ किया गया है।
- source_word: μάχαιραν
  choice: तलवार
  rationale: मूल का ठोस और हिंसात्मक बिंब सुरक्षित रखा गया है।
- source_word: τοῖς πειθομένοις αὐτόν
  choice: अपनी बात माननेवालों को
  rationale: πειθομένοις यहाँ किसी के प्रभाव में आकर उसकी आज्ञा या बात मानने का भाव देता है; हिन्दी में कर्ता बलियार होने के कारण ‘अपनी’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: बलियार की पहचान
  choice: नाम को ‘बलियार’ के रूप में रखा गया है
  alternative: ‘शैतान’ या किसी अन्य व्याख्यात्मक उपाधि से बदलना
  rationale: मूल पाठ विशिष्ट नाम Βελίαρ प्रयोग करता है; उसे किसी बाद की धार्मिक पहचान से बदलना पाठ की सम्भावित विशिष्टता और अस्पष्टता को मिटा देता।
- issue: तलवार देने का अर्थ
  choice: ‘तलवार देता है’ का शाब्दिक बिंब रखा गया है
  alternative: ‘विनाश में डालता है’ या ‘हिंसा करवाता है’
  rationale: पाठ यह स्पष्ट नहीं करता कि तलवार हिंसा का साधन है, दण्ड है या आत्म-विनाश का संकेत; इसलिए व्याख्या जोड़े बिना मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। संबोधन में स्नेह और चेतावनी में तीव्रता दोनों बनाए रखे गए हैं। कोई पाद-टिप्पणी आवश्यक नहीं है।
