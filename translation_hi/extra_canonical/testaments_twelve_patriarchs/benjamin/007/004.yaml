source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διακοσίων ἐτῶν πάσχει, καὶ ἐννακοσιοστῷ²⁶ ἔτει ἐρημοῦται²⁷· διὰ γὰρ Ἄβελ τὸν ἀδελφὸν αὐτοῦ * ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο, ὁ δὲ Λαμὲχ ἐν ἑβδομηκοντάκις ἑπτά. Ὅτι³⁶ *ἕως τοῦ αἰῶνος³⁷ οἱ ὁμοιούμενοι *τῷ Καὶν³⁸ Γ*ἐπὶ φθόνῳ καὶ μισαδελφίᾳ τοιαύτῃ⁷ κολασθήσονται Γκρίσει⁷³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/004.yaml
  text: For two hundred years he suffers, and in the nine-hundredth year he was made desolate; for because of Abel his brother he was judged in all evils, but Lamech in seventy times seven. Because to the end of the age, those who become like Cain in envy and hatred of brothers will be punished with similar judgment.
translation:
  language: hi
  text: वह दो सौ वर्ष तक दुःख भोगता है, और नौ सौवें वर्ष में उजाड़ दिया जाता है; क्योंकि अपने भाई हाबिल के कारण सब विपत्तियों में उसका न्याय किया गया, पर लेमेक का सत्तर गुना सात में। क्योंकि युग के अंत तक, जो लोग ईर्ष्या और भाइयों से घृणा में कैन के समान बनते हैं, वे उसी प्रकार के न्याय से दण्डित किए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάσχει
  choice: दुःख भोगता है
  rationale: क्रिया का वर्तमानकालीन रूप और पीड़ा सहने का व्यापक अर्थ सुरक्षित रहता है।
- source_word: ἐρημοῦται
  choice: उजाड़ दिया जाता है
  rationale: यूनानी कर्मवाच्य वर्तमान को बनाए रखते हुए विनाश अथवा निर्जन किए जाने का अर्थ व्यक्त करता है।
- source_word: ἐκρίνετο
  choice: दोषी ठहराया गया
  rationale: इस दण्ड-संदर्भ में κρίνομαι का न्यायिक भाव व्यक्त होता है, यद्यपि सामान्य अर्थ ‘न्याय किया गया’ भी संभव है।
- source_word: ἐν ἑβδομηκοντάκις ἑπτά
  choice: सत्तर गुना सात में
  rationale: असामान्य और संक्षिप्त यूनानी वाक्यांश को जानबूझकर व्याख्यायित किए बिना सुरक्षित रखा गया है।
- source_word: ἕως τοῦ αἰῶνος
  choice: युग के अन्त तक
  rationale: संदर्भानुसार कालगत सीमा व्यक्त की गई है; शाब्दिक रूप ‘युग तक’ है।
- source_word: μισαδελφίᾳ
  choice: भाई से घृणा करने में
  rationale: दुर्लभ संज्ञा का सहज हिन्दी रूप, जिसमें भ्रातृ-द्वेष का स्पष्ट अर्थ बना रहता है।
- source_word: κολασθήσονται ... κρίσει
  choice: न्याय के द्वारा दण्ड पाएँगे
  rationale: भविष्य कर्मवाच्य और न्याय-दण्ड के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कैन और लेमेक की संख्यात्मक दण्ड-अवधि अथवा मात्रा
  choice: पाठ की संक्षिप्त और कठिन अभिव्यक्ति को जस का तस खुला रखा गया
  alternative: इसे स्पष्ट रूप से वर्षों की दण्ड-अवधि या प्रतिशोध की मात्रा बताना
  rationale: यूनानी पाठ ‘दो सौ वर्ष,’ ‘नौ सौवाँ वर्ष,’ और ‘सत्तर गुना सात’ के संबंध को पूर्णतः स्पष्ट नहीं करता; अनुवाद में अतिरिक्त सिद्धान्त या कालक्रम नहीं जोड़ा गया।
- issue: τοιαύτῃ का संबंध
  choice: ‘ऐसे ही न्याय’ के रूप में कैन-सदृश आचरण और उसके अनुरूप दण्ड का संबंध व्यक्त किया
  alternative: ‘ऐसी ईर्ष्या और भ्रातृ-घृणा के कारण न्याय में दण्डित होंगे’
  rationale: पांडुलिपीय रूप कठिन है; निकटवर्ती κρίσει के साथ विशेषण का संबंध अर्थसंगत है, पर समानता की प्रकृति को अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल के वर्तमान और भविष्य काल, कर्मवाच्य रूपों तथा कठिन संख्यात्मक वाक्यांश को यथासंभव सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
