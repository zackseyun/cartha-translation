source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/002.yaml
  text: 'And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.'
translation:
  language: hi
  text: 'और तलवार सात बुराइयों की जननी है। सबसे पहले मन बेलियार के द्वारा गर्भ धारण करता है,[a] और उसकी संतानें ये हैं: पहली ईर्ष्या, दूसरी विनाश, तीसरी विपत्ति, चौथी कैद, पाँचवीं अभाव, छठी उथल-पुथल और सातवीं उजाड़।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का यूनानी पाठ कुछ असंगत और संभवतः विकृत है; आशय यह प्रतीत होता है कि मन बेलियार के द्वारा इन बुराइयों को गर्भ में धारण करता है। चौथे पद का अर्थ भी पाठगत रूप से अनिश्चित है; यहाँ उसे ‘कैद’ समझा गया है।
    reason: मूल संस्करण में इस वाक्यांश पर पाठ-संशय के चिह्न हैं और ‘सबसे पहले’ तथा सूची के आरंभ के बीच व्याकरणिक असंगति है। चौथे असामान्य यूनानी पद के लिए अंग्रेज़ी audit trail के ‘captivity’ के अनुरूप, पर अनिश्चितता को स्वीकारते हुए, ‘कैद’ चुना गया है।
lexical_decisions:
- source_word: μάχαιρα
  choice: तलवार
  rationale: हिंसा के साधन के रूप में यूनानी शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: μήτηρ
  choice: जननी
  rationale: सात बुराइयों की उत्पत्ति के मातृ-रूपक को गरिमापूर्ण और स्पष्ट ढंग से बनाए रखता है।
- source_word: συλλαμβάνει
  choice: गर्भ धारण करता है
  rationale: क्रिया के गर्भाधान संबंधी रूपक को संरक्षित करता है; आगे गिनाई गई बुराइयों को संतान समझने में सहायक है।
- source_word: διάνοια
  choice: मन
  rationale: विचारशील आंतरिक क्षमता के लिए साधारण आधुनिक हिन्दी में स्पष्ट शब्द।
- source_word: φθόνος
  choice: ईर्ष्या
  rationale: दूसरे के लाभ से जलन या द्वेष के सामान्य अर्थ को व्यक्त करता है।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: नाश या बरबादी के व्यापक अर्थ को अनिर्दिष्ट रखता है।
- source_word: θλῖψις
  choice: विपत्ति
  rationale: कष्ट, दबाव और संकट के अर्थक्षेत्र को सहज हिन्दी में समेटता है।
- source_word: θεηλασία
  choice: लूटपाट
  rationale: पाठ-संदर्भ और प्राचीन शब्द के विपत्ति/धावा/लूट संबंधी अर्थ के आधार पर; अंग्रेज़ी परामर्श-पाठ के ‘captivity’ को यांत्रिक रूप से नहीं अपनाया गया।
- source_word: ἔνδεια
  choice: अभाव
  rationale: कमी, दरिद्रता या जरूरत की दशा के लिए व्यापक समतुल्य।
- source_word: ταραχή
  choice: उथल-पुथल
  rationale: अशांति, अव्यवस्था और व्याकुलता का जीवंत तथा स्वाभाविक हिन्दी रूप।
- source_word: ἐρήμωσις
  choice: उजाड़
  rationale: निर्जनता और विध्वंसोत्तर वीरानी दोनों को व्यक्त करता है।
theological_decisions:
- issue: बेलियार की भूमिका
  choice: ‘बेलियार के द्वारा’
  alternative: ‘बेलियार के कारण’ या ‘बेलियार की प्रेरणा से’
  rationale: यूनानी διά के माध्यम/कारण संबंधी खुलेपन को यथासंभव बनाए रखा गया है और किसी विशिष्ट दुष्टात्माविज्ञान को आरोपित नहीं किया गया।
- issue: भ्रष्ट मध्यवर्ती यूनानी वाक्यांश
  choice: ‘और उसकी संतानें ये हैं’
  alternative: शाब्दिक रूप से ‘और पहले है...’
  rationale: प्राप्त पाठ में चिह्नित विकृति/असंगति है। अंग्रेज़ी परामर्श-पाठ द्वारा सुरक्षित जन्म-रूपक सूची को स्पष्ट करता है, पर इसे फुटनोट से पाठगत रूप से पारदर्शी रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। मातृत्व, गर्भधारण और संतान का मूल रूपक बनाए रखा गया है। क्रमसूचक सूची को सहज हिन्दी वाक्य-विन्यास में प्रस्तुत किया गया है।
