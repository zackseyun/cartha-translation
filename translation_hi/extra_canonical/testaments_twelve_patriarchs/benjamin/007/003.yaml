id: T12P.BEN.7.3
reference: Testament of Benjamin 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διὰ τοῦτο καὶ¹⁸ ὁ Κάϊν ἑπτὰ ἐκδικίαις¹⁹ παρεδόθη²⁰ ὑπὸ τοῦ Θεοῦ²¹. *κατὰ γὰρ²² ἑκατοστὸν ἔτος²³ μίαν πληγὴν ἐπήγαγεν *ἐπʼ αὐτὸν²⁴ ⸀Κύριος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/003.yaml
  text: Because of this also, Cain was handed over by God to seven acts of vengeance. For every hundredth year the Lord brought one plague upon him.
translation:
  language: hi
  text: इसी कारण कैन भी परमेश्वर के द्वारा सात प्रतिशोधों के हवाले कर दिया गया। क्योंकि हर सौवें वर्ष प्रभु उस पर एक विपत्ति लाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο καὶ
  choice: इसी कारण ... भी
  rationale: कारणसूचक वाक्यांश और καὶ के समावेशी बल, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἑπτὰ ἐκδικίαις
  choice: सात प्रतिशोधों
  rationale: ἐκδικία के दंडात्मक प्रतिशोध के अर्थ को बनाए रखता है; इसे केवल सामान्य ‘दंड’ बनाकर अर्थ को संकुचित नहीं करता।
- source_word: παρεδόθη ὑπὸ τοῦ Θεοῦ
  choice: परमेश्वर के द्वारा ... हवाले कर दिया गया
  rationale: यूनानी कर्मवाच्य और स्पष्ट कर्ता ‘परमेश्वर के द्वारा’ दोनों सुरक्षित रहते हैं।
- source_word: κατὰ ... ἑκατοστὸν ἔτος
  choice: हर सौवें वर्ष
  rationale: वितरणात्मक κατά और क्रमवाचक ἑκατοστόν का सीधा अर्थ देता है; ‘सौ वर्षों में’ नहीं करता।
- source_word: μίαν πληγὴν
  choice: एक विपत्ति
  rationale: πληγή के आघात/विपत्ति/दंडकारी प्रहार के व्यापक अर्थ को यहाँ पठनीय रूप में व्यक्त करता है।
- source_word: ἐπήγαγεν ἐπʼ αὐτὸν
  choice: उस पर ... लाता था
  rationale: अपूर्ण भूतकाल की आवर्ती क्रिया को हिन्दी के ‘लाता था’ से व्यक्त करता है और ἐπί के लक्ष्यभाव को ‘उस पर’ से रखता है।
theological_decisions:
- issue: कैन के दंड का कर्ता
  choice: परमेश्वर के द्वारा
  alternative: कर्ता को न कहना
  rationale: मूल पाठ ὑπὸ τοῦ Θεοῦ के द्वारा परमेश्वर को स्पष्ट कर्ता बताता है, इसलिए इसे बनाए रखना आवश्यक है।
- issue: सात ἐκδικίαις का स्वरूप
  choice: सात प्रतिशोध
  alternative: सात दंड
  rationale: ‘प्रतिशोध’ मूल शब्द की न्याय-दंड संबंधी तीव्रता और पाठ की संभावित धर्मवैचारिक तनावशीलता को बिना व्याख्यात्मक नरमी के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और स्रोत-सन्निकट शैली। ‘हर सौवें वर्ष’ जानबूझकर रखा गया है, क्योंकि यूनानी क्रमवाचक अभिव्यक्ति को ‘हर सौ वर्ष’ कहना उसकी सूक्ष्मता घटा देता।
