base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010.yaml
  text: '1[a]. Now when Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, exactly as his whole appearance was.


    2. And after saying these things he said to them, “Know then, my children, that I am dying. 3[b]. Therefore do truth, each one toward his neighbor, and keep the law of the Lord and his commandments. 4. For these things I leave you instead of every inheritance. And you also give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did. 5. For they gave all these things to us as an inheritance, saying, ‘Keep the commandments of God until the time when you will see Enoch and Seth and Abraham and Isaac and Jacob risen up at his right hand in rejoicing.’


    6. Then we also will rise, each with our scepter, and we will worship the King of the heavens. 7. [the one who appeared on earth in the form of a man in humility; and all who believe in him on the earth will rejoice with him.]


    8. And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first for their unrighteousness [because when God came to them in flesh, they did not believe him]. 9. And then he will judge all the nations [which did not believe him when he appeared on earth]. 10. And through the chosen ones from among the nations he will convict Israel, just as he convicted Esau through the Midianites, who deceived their brothers into becoming, through sexual immorality and idolatry, estranged from God, and so they became children in the portion of those who fear the Lord.


    11. You therefore, my children, if you walk in holiness in the commandments of the Lord, you will dwell again with confidence in me[d][c], and all Israel will be gathered to the Lord.'
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 10**


    **1.** जब यूसुफ मिस्र में था, तब मैं उसके रूप और उसके मुख की आकृति को देखने के लिए लालायित था। और अपने पिता याकूब की प्रार्थनाओं के द्वारा मैंने उसे दिन के समय जागते हुए ठीक वैसा ही देखा, जैसा वह अपने पूरे रूप में था।


    **2.** ये बातें कहने के बाद उसने उनसे कहा, “मेरे बच्चो, जान लो कि मैं मर रहा हूँ। **3.** इसलिए तुममें से हर एक अपने पड़ोसी के साथ सच्चाई का व्यवहार करो[a], और प्रभु की व्यवस्था और उसकी आज्ञाओं का पालन करो। **4.** क्योंकि मैं तुम्हारे लिए ये बातें सारी विरासत के बदले छोड़ जाता हूँ। तुम भी इन्हें अपने बच्चों को सदा की संपत्ति के रूप में देना; क्योंकि अब्राहम, इसहाक और याकूब ने भी ऐसा ही किया। **5.** क्योंकि उन्होंने ये सब बातें हमें विरासत के रूप में दीं और कहा, ‘परमेश्वर की आज्ञाओं का पालन तब तक करना, जब तक [प्रभु अपना उद्धार सभी राष्ट्रों पर प्रकट न करे]।’[b]


    **6.** तब तुम हनोक, शेत, अब्राहम, इसहाक और याकूब को आनन्द में उसके दाहिने हाथ की ओर जी उठे हुए देखोगे। **7.** तब हम भी जी उठेंगे—हममें से हर एक अपने राजदण्ड के साथ[c]—और स्वर्गों के राजा को दण्डवत करेंगे, [जो दीनता में मनुष्य के रूप में पृथ्वी पर प्रकट हुआ; और पृथ्वी पर जितने लोग उस पर विश्वास करेंगे, वे उसके साथ आनन्दित होंगे]।[b]


    **8.** और सभी जी उठेंगे—कुछ महिमा के लिए और कुछ अपमान के लिए। प्रभु सबसे पहले इस्राएल का न्याय उनके अधर्म के कारण करेगा, [क्योंकि जब परमेश्वर देह में आया, तो उन्होंने उस पर विश्वास नहीं किया]।[b] **9.** तब वह उन सभी राष्ट्रों का न्याय करेगा [जिन्होंने पृथ्वी पर प्रकट हुए उस पर विश्वास नहीं किया]।[b] **10.** और वह राष्ट्रों में से चुने हुए लोगों के द्वारा इस्राएल को दोषी ठहराएगा, जैसे उसने मिद्यानियों के द्वारा एसाव को दोषी ठहराया था, जिन्होंने अपने भाइयों को [व्यभिचार और मूर्तिपूजा के द्वारा परमेश्वर से अलग हो जाने के लिए] बहकाया; और इस प्रकार वे प्रभु का भय मानने वालों के भाग में संतान बने।[b]


    **11.** इसलिए, मेरे बच्चो, यदि तुम प्रभु की आज्ञाओं में पवित्रता से चलोगे, तो तुम फिर मेरे साथ आशा में निवास करोगे[d], और सारा इस्राएल प्रभु के पास इकट्ठा किया जाएगा।


    **पादटिप्पणियाँ**


    [a] **“सच्चाई का व्यवहार करो”**—यूनानी मुहावरे का शाब्दिक अर्थ “सत्य करो” है; इसका आशय व्यवहार में सच्चाई बरतना है।


    [b] पद 5 तथा 7–10 में चौकोर कोष्ठकों में रखे गए यूनानी अंशों की पाठ-परंपरा संदिग्ध है। विशेष रूप से मनुष्य के रूप में या देह में परमेश्वर के प्रकट होने और उस पर विश्वास करने की स्पष्ट भाषा को प्रायः बाद का मसीही विस्तार माना जाता है। ये अंश उपलब्ध यूनानी साक्ष्य में होने के कारण अनूदित किए गए हैं, पर कोष्ठकों द्वारा अलग दिखाए गए हैं।


    [c] **“अपने राजदण्ड के साथ”**—यूनानी पद कठिन और पाठगत रूप से अनिश्चित है। इसका संकेत पुनरुत्थान में फिर से मिलने वाली प्रतिष्ठा या गोत्रीय शासन की ओर हो सकता है।


    [d] **“मेरे साथ आशा में”**—यूनानी पद का शाब्दिक रूप लगभग “आशा में, मुझमें” है। वाक्यांश का सटीक संबंध कठिन है; अनुवाद में ‘आशा’ और बिन्यामीन के साथ पुनः निवास, दोनों को सुरक्षित रखा गया है।'
