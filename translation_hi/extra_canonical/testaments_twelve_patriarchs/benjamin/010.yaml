lexical_decisions:
- source_word: εἰδέα / μόρφωσις / ὄψις
  choice: रूप / आकृति / मुख
  rationale: यूनानी में निकटार्थक शब्दों की पुनरावृत्ति यूसुफ को देखने की तीव्र इच्छा और दर्शन की स्पष्टता पर बल देती है; हिन्दी में संबंधित पर अलग शब्द रखे गए हैं।
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: दिन के समय जागते हुए
  rationale: यह नींद या स्वप्न के विपरीत जागृत अवस्था को बताता है; इसे तकनीकी रूप से ‘दर्शन’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: ποιήσατε ... ἀλήθειαν
  choice: सच्चाई का आचरण करे
  rationale: शाब्दिक ‘सत्य करो’ आधुनिक हिन्दी में अस्वाभाविक है। यह चयन यूनानी मुहावरे की ठोस नैतिक क्रिया को बनाए रखता है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: यह व्यापक सामाजिक और वाचागत नैतिक अर्थ को सुरक्षित रखता है और केवल सगे भाई तक सीमित नहीं करता।
- source_word: νόμος ... ἐντολαί
  choice: व्यवस्था ... आज्ञाएँ
  rationale: दोनों वाचागत शब्दों का भेद और बाइबिलीय परिचित शब्दावली बनाए रखी गई है।
- source_word: ἀντὶ πάσης κληρονομίας
  choice: सारी विरासत के बदले
  rationale: ἀντί की स्थानापन्न करने वाली शक्ति को बनाए रखते हुए नैतिक शिक्षा को बिन्यामीन की वास्तविक विरासत के रूप में प्रस्तुत किया गया है।
- source_word: κατάσχεσιν αἰώνιον
  choice: सदा की संपत्ति
  rationale: पीढ़ियों तक थामे और सौंपे जाने वाले स्थायी अधिकार का स्वाभाविक हिन्दी रूप।
- source_word: ἀνασταμένους ἐκ δεξιῶν αὐτοῦ
  choice: उसके दाहिने हाथ की ओर जी उठे हुए
  rationale: पुनरुत्थान और सम्मानित स्थान दोनों को रखा गया है, जबकि अस्पष्ट सर्वनाम ‘उसके’ को किसी स्पष्ट नाम से नहीं बदला गया।
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: अपने राजदण्ड के साथ
  rationale: पद पाठगत रूप से कठिन है। सहज हिन्दी दी गई है, पर पादटिप्पणी में अनिश्चितता और सम्भावित राजकीय या गोत्रीय संकेत बताया गया है।
- source_word: ἀτιμία
  choice: अपमान
  rationale: ‘महिमा’ के विपरीत न्याय-संबंधी औपचारिक विरोध को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: आशा के साथ मेरे पास
  rationale: कठिन यूनानी पद में ‘आशा’ को स्पष्ट रूप से सुरक्षित रखा गया है और ἐν ἐμοί को सन्दर्भानुकूल निकटता/निवास के अर्थ में प्रस्तुत किया गया है; वैकल्पिक अर्थ पादटिप्पणी में दिया है।
theological_decisions:
- issue: पद 5 और 7-10 की कोष्ठकबद्ध सामग्री
  choice: सामग्री का अनुवाद मुख्य पाठ में चौकोर कोष्ठकों सहित रखा और उसकी पाठगत स्थिति पादटिप्पणी में बताई।
  alternative: इन अंशों को बाद का मसीही प्रक्षेप मानकर छोड़ देना, या बिना किसी चिह्न के मूल पाठ का अभिन्न भाग मानना।
  rationale: दिए गए यूनानी साक्ष्य में ये अंश उपस्थित हैं, पर उनकी भाषा और पाठ-इतिहास संदेह उत्पन्न करते हैं। कोष्ठक साक्ष्य और अनिश्चितता दोनों को पारदर्शी रखते हैं।
- issue: पद 6 में ‘उसके दाहिने हाथ’ का संदर्भ
