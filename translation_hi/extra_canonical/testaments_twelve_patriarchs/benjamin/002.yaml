lexical_decisions:
- source_word: ἐγνώρισέν με
  choice: मुझे पहचान लिया
  rationale: संदर्भ में यूसुफ मिस्र पहुँचे बिन्यामीन को पहचानता है। यह अर्थ सहज है और क्रिया पर अनावश्यक आत्मवाचक अर्थ नहीं थोपता।
- source_word: ἔφυραν … αἵματι
  choice: लहू लगाया
  rationale: क्रिया का मूल भाव मिलाने या लपेटने का है; वस्त्र और लहू के संदर्भ में ‘लहू लगाया’ स्वाभाविक और दृश्यात्मक हिन्दी है।
- source_word: χιτών
  choice: कुरता
  rationale: यह शरीर के ऊपरी भाग पर पहने जानेवाले ठोस वस्त्र को दर्शाता है। ‘कुरता’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और अस्पष्ट ‘वस्त्र’ से अधिक मूर्त है।
- source_word: περίζωμα
  choice: कमर ढकने के लिए एक कपड़ा
  rationale: यह कमर या कटि के चारों ओर बाँधे जानेवाला वस्त्र है। वर्णनात्मक अनुवाद आधुनिक हिन्दी में स्पष्ट है और असहज तकनीकी शब्द से बचता है।
- source_word: φραγγελλώσαντες
  choice: कोड़े मारकर
  rationale: यह कठोर शारीरिक प्रहार को सूचित करता है; ‘कोड़े मारना’ उसकी क्रूरता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ῥάβδῳ μαστίζων
  choice: छड़ी से मार रहा था
  rationale: दोनों पद मिलकर छड़ी से प्रहार करने की क्रिया बताते हैं। हिन्दी में यह भेद स्पष्ट और अनावश्यक रूप से अलंकृत हुए बिना सटीक है।
- source_word: ὑπήντησεν αὐτῷ λέων
  choice: एक सिंह उसके सामने आ गया
  rationale: यह आकस्मिक मुठभेड़ का जीवंत कथात्मक भाव बनाए रखता है।
- source_word: ἀνεῖλεν
  choice: मार डाला
  rationale: यह हत्या या प्राण लेने की सीधी क्रिया है; आधुनिक हिन्दी में ‘मार डाला’ स्पष्ट और प्रभावी है।
- source_word: μέτοχοι
  choice: साथी
  rationale: यह उस व्यक्ति के साथ के व्यापारिक दल या सहयोगियों को सूचित करता है; ‘साथी’ कथात्मक हिन्दी में स्वाभाविक है।
- source_word: ἐν ἀνέσει με κατέσχεν (corrupt)
  choice: मुझे कुछ ढील देकर अपने पास रखा
  rationale: यूनानी पद विकृत है, पर ἄνεσις के ‘ढील/राहत’ और κατέχω के ‘रोककर रखना’ अर्थों को सावधानी से प्रतिबिंबित किया गया है; पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: हमारे भाइयों के काम
  rationale: यह भाइयों द्वारा किए गए ठोस कार्यों को दर्शाता है और उनके नैतिक भार को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐξηγησάμην
  choice: समझाया
  rationale: क्रिया किसी बात को खोलकर बताने या वर्णित करने का भाव रखती है; इस निर्देशात्मक संदर्भ में ‘समझाया’ सहज है।
- source_word: ἔννοιαι
  choice: मन में … विचार
  rationale: यह अंतःचिन्तन, अभिप्राय या मानसिक धारणा को दर्शाता है। ‘मन में विचार’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: यूसुफ द्वारा भाइयों के अपराध को छिपाना
  choice: यूसुफ को जानबूझकर बिन्यामीन से भाइयों के काम छिपाते हुए प्रस्तुत किया गया है।
  alternative: यूसुफ केवल घटनाओं का वर्णन करता है, उसके छिपाने के उद्देश्य पर बल नहीं दिया जाता।
  rationale: ἤθελεν γὰρ κρύπτειν ἀπʼ ἐμοῦ τὰ ἔργα τῶν ἀδελφῶν ἡμῶν स्पष्ट रूप से उसका उद्देश्य बताता है। इससे यूसुफ की संयमशीलता उभरती है, पर उसके आचरण का अतिरिक्त धर्मशास्त्रीय मूल्यांकन नहीं जोड़ा गया।
- issue: पद 5 में बहुवचन ‘उन्होंने झूठ नहीं कहा’ और अगले एकवचन कर्ता के बीच तनाव
  choice: उपलब्ध यूनानी के बहुवचन को मुख्य पाठ में बनाए रखा गया और अगले उपवाक्य में यूसुफ को नाम से स्पष्ट किया गया।
  alternative: अंग्रेज़ी परामर्श-पाठ के अनुसार इसे ‘यूसुफ ने झूठ नहीं कहा’ बनाया जा सकता था।
  rationale: मूल-भाषा के उपलब्ध पाठ में οὐκ ἐψεύσαντο αὐτοὶ बहुवचन है। अर्थगत कठिनाई को चुपचाप सुधारने के बजाय वास्तविक व्याकरणिक तनाव सुरक्षित रखा गया है।
- issue: पद 4 का विकृत यूनानी पाठ और बिक्री संबंधी वैकल्पिक पाठ
  choice: मुख्य पाठ में उपलब्ध यूनानी के संभावित अर्थ ‘कुछ ढील देकर अपने पास रखा’ को सावधानी से रखा गया।
  alternative: ‘उन्होंने मुझे अपने दल के दूसरे व्यापारियों को बेच दिया’ अथवा ‘इश्माएलियों को बेच दिया।’
  rationale: मुख्य पाठ के शब्द ἀνέσει और κατέσχεν राहत/ढील तथा रोककर रखने की ओर संकेत करते हैं, यद्यपि वाक्य विकृत है। बिक्री वाला पाठ अन्य साक्षियों से आता है और इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: अध्याय के अंतिम वाक्य को अधूरा मानना या उपलब्ध यूनानी के अनुसार पूरा अनुवाद करना
  choice: 'उपलब्ध यूनानी वाक्य को पूर्ण रूप में अनुवाद किया गया: बातें पिता के हृदय तक न पहुँचें।'
  alternative: अंग्रेज़ी परामर्श-पाठ की तरह वाक्य को ‘और ये बातें…’ पर अधूरा छोड़ना।
  rationale: प्रस्तुत मूल-पाठ में καὶ μὴ ἔλθωσιν οἱ λόγοι οὗτοι εἰς καρδίαν τοῦ πατρός μου एक पूर्ण निषेधात्मक उपवाक्य है। मूल-भाषा की प्रत्यक्ष साक्षी को प्राथमिकता दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। संवाद में ‘पिता’ और सम्मानसूचक ‘पहचानिए’ प्रसंगानुकूल हैं। ‘लहू’, ‘कुरता’, ‘कोड़े’ और ‘सिंह’ जैसे ठोस शब्द कथात्मक जीवंतता बनाए रखते हैं। विकृत या वैकल्पिक पाठ को मुख्य पाठ में अनधिकृत रूप से समतल नहीं किया गया; आवश्यक अनिश्चितताएँ पादटिप्पणियों में दी गई हैं।
