  revised_text: '## बिन्यामीन का वसीयतनामा 2


    **1** जब मैं मिस्र पहुँचा, तो मेरे भाई यूसुफ ने मुझे पहचान लिया और मुझसे कहा, “उन्होंने तुम्हारे वस्त्र को लहू से सना दिया और कहा, ‘देखो, क्या यह वही वस्त्र है?’”[a]


    **2** फिर उसने मुझसे कहा, “हाँ, भाई। जब उन्होंने मेरा वस्त्र उतार लिया, तब उन्होंने मुझे इश्माएलियों को दे दिया। इश्माएलियों ने मुझे एक कटि-वस्त्र दिया और कोड़े मारकर मुझसे दौड़ने को कहा।


    **3** उनमें से एक मुझे छड़ी से मार रहा था कि एक सिंह उससे आ मिला और उसे मार डाला।[b]


    **4** तब उसके साथी डर गए और कुछ राहत देकर मुझे रोक रखा।[c]


    **5** ये बातें कहकर उन्होंने झूठ नहीं कहा था; क्योंकि यूसुफ मुझसे हमारे भाइयों के कृत्य छिपाना चाहता था।


    **6** फिर उसने अपने भाइयों को अपने पास बुलाकर कहा,


    **7** “तुमने मेरे साथ जो किया, वह मेरे पिता को मत बताना; बल्कि उनसे वैसा ही कहना, जैसा मैंने बिन्यामीन को समझाया है।


    **8** तुम्हारे भीतर भी ऐसे ही विचार हों, और ये बातें मेरे पिता के हृदय तक न पहुँचें।”


    ### पादटिप्पणियाँ


    [a] इस वाक्य का यूनानी पाठ कुछ स्थानों पर अनिश्चित है। कुछ पाठ-साक्षियों में अधिक स्पष्ट रूप से है: “उन्होंने उसे भेजकर कहा, ‘देखो, क्या यह तुम्हारे पुत्र का वस्त्र है?’”


    [b] अन्य पाठ-साक्षी घटना को भिन्न ढंग से कहते हैं, पर इतना भाव बना रहता है कि यूसुफ का वस्त्र सँभालने वाला व्यक्ति किसी जंगली पशु—अक्सर सिंह—के द्वारा मारा गया।


    [c] यहाँ उपलब्ध यूनानी पाठ विकृत है। ‘कुछ राहत देकर मुझे रोक रखा’ एक सावधान, अस्थायी अनुवाद है। कुछ अन्य पाठ-साक्षियों में है कि उन्होंने उसे अपने दल के दूसरे व्यापारियों को बेच दिया; अन्य में इश्माएलियों को बेचने का उल्लेख है।'
