  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002.yaml
  text: '1 And when we went down into Egypt[a], Joseph my brother recognized me and said to me, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”

    2 And he said to me, “Yes, brother. For when the Ishmaelites took me, one of them stripped me of my tunic and gave me a loincloth; and after flogging me, he told me to run.

    3 And while he was going away to hide my garment, a lion met him and killed him.

    4 So his companions, being afraid, sold me to others of their company.

    5 Thus Joseph did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.

    6 And he called his brothers to himself and said,

    7 ‘Do not tell my father what you did to me, but speak in this way, just as I explained it to Benjamin.

    8 And let such thoughts be in you[b][c][d], and let not the words come…’'
translation:
  language: hi
  text: '## बिन्यामीन का वसीयतनामा 2


    **1** जब मैं मिस्र पहुँचा, तो मेरे भाई यूसुफ ने मुझे पहचान लिया और मुझसे कहा, “उन्होंने तुम्हारे कुरते पर लहू लगाया था और कहा था, ‘पहचानिए, क्या यह वही कुरता है?’”[a]


    **2** फिर उसने मुझसे कहा, “हाँ, भाई। जब उन्होंने मेरा कुरता उतार लिया, तब उन्होंने मुझे इश्माएलियों के हाथ सौंप दिया। उन्होंने मुझे कमर ढकने के लिए एक कपड़ा दिया और मुझे कोड़े मारकर दौड़ने को कहा।


    **3** उनमें से एक मुझे छड़ी से मार रहा था कि एक सिंह उसके सामने आ गया और उसने उसे मार डाला।[b]


    **4** तब उसके साथी डर गए और उन्होंने मुझे कुछ ढील देकर अपने पास रखा।[c]


    **5** यह सब कहते हुए उन्होंने झूठ नहीं कहा था; क्योंकि यूसुफ मुझसे हमारे भाइयों के काम छिपाना चाहता था।


    **6** फिर उसने अपने भाइयों को अपने पास बुलाकर कहा,


    **7** “तुमने मेरे साथ जो किया, वह मेरे पिता को मत बताना। इसके बजाय उनसे वही कहना जो मैंने बिन्यामीन को समझाया है।


    **8** तुम्हारे मन में भी ऐसे ही विचार रहें, और ये बातें मेरे पिता के हृदय तक न पहुँचें।”


    ### पादटिप्पणियाँ


    [a] इस वाक्य का यूनानी पाठ अस्थिर और कुछ स्थानों पर असहज है। कुछ पाठ-साक्षियों में अधिक स्पष्ट रूप से लिखा है, “उन्होंने उसे भेजकर कहा, ‘पहचानिए, क्या यह आपके पुत्र का कुरता है?’”


    [b] अन्य पाठ-साक्षी इस घटना को कुछ भिन्न शब्दों में बताते हैं, पर उनमें यह भाव बना रहता है कि यूसुफ के वस्त्र को ले जानेवाला व्यक्ति किसी हिंसक जंगली पशु—प्रायः सिंह—के हाथों मारा गया।


    [c] यहाँ उपलब्ध यूनानी पाठ विकृत है। इसका संभावित अर्थ है कि वे यूसुफ को अपेक्षाकृत कम कठोरता से अपने पास रखने लगे। कुछ अन्य पाठ-साक्षियों में लिखा है कि उन्होंने उसे अपने ही दल के दूसरे व्यापारियों को बेच दिया; कहीं इश्माएलियों को बेचे जाने का उल्लेख है।'
