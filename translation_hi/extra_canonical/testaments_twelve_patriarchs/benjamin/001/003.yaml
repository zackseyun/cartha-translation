    issue: An explicit possessive is supplied in “मुझे उनका दूध नहीं मिला.”
    rationale: The Greek says only that Benjamin had no milk; Rachel is the evident context, but the possessive is not stated. Omitting it better preserves the source’s wording and avoids unnecessary explicitness.
  revised_text: और चूँकि मेरी माँ राहेल मुझे जन्म देते समय मर गई थीं, मुझे दूध नहीं मिला; इसलिए मैंने उनकी दासी बिल्हा का दूध पिया।
