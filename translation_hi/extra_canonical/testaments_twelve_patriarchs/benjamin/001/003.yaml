  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ‘मेरी माँ राहेल’ मूल के संबंधसूचक apposition को स्वाभाविक ढंग से रखता है; अर्धविराम कारण और परिणाम के दो निकट जुड़े खंडों को अलग करता है।
