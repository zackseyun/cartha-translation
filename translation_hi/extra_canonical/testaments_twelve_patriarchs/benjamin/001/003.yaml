source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ ἐπειδὴ¹⁶ Ῥαχὴλ *ἡ μήτηρ μου¹⁷ τέθνηκε¹⁸ γεννῶσά με, *γάλα οὐκ ἔσχον· Βαλλὰν οὖν τὴν παιδίσκην αὐτῆς ἐθήλασα¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/003.yaml
  text: And since Rachel, my mother, died while giving birth to me, I had no milk; so I was nursed by Bilhah, her servant-girl.
translation:
  language: hi
  text: और चूँकि मेरी माँ राहेल मुझे जन्म देते समय मर गई थीं, मुझे दूध नहीं मिला; इसलिए मैंने उनकी दासी बिल्हा का दूध पिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέθνηκε
  choice: मर गई थीं
  rationale: यूनानी पूर्णकाल राहेल की मृत्यु को भूतकाल की पूर्ण घटना के रूप में प्रस्तुत करता है; हिन्दी में आदरसूचक बहुवचन स्वाभाविक है।
- source_word: γεννῶσά με
  choice: मुझे जन्म देते समय
  rationale: कालसूचक कृदंत का अर्थ स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: γάλα οὐκ ἔσχον
  choice: मुझे उनका दूध नहीं मिला
  rationale: शाब्दिक अर्थ ‘मेरे पास दूध नहीं था’ है; प्रसंग में आशय मृत माता के दूध से वंचित होना है। ‘उनका’ इस निहित संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना कथ्य बदले।
- source_word: παιδίσκην
  choice: दासी
  rationale: यह शब्द अधीनस्थ स्त्री सेविका या दास स्त्री को सूचित कर सकता है। ‘दासी’ हिन्दी में उस सामाजिक स्थिति को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: ἐθήλασα
  choice: मैंने … का दूध पिया
  rationale: यूनानी क्रिया सक्रिय रूप में शिशु के स्तनपान करने को बताती है; यह अनुवाद अंग्रेज़ी के कर्मवाच्य के बजाय मूल संरचना और दृष्टिकोण को सुरक्षित रखता है।
theological_decisions: []
