base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/004.yaml
  text: For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and having conceived, she bore me.
translation:
  language: hi
  text: क्योंकि राहेल यूसुफ को जन्म देने के बाद बारह वर्ष तक बाँझ रही। उसने उपवास के साथ प्रभु से प्रार्थना की, और गर्भ धारण करके उसने मुझे जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστείρευσεν
  choice: बाँझ रही
  rationale: यह क्रिया बारह वर्षों तक संतान उत्पन्न न कर पाने की अवस्था को व्यक्त करती है; आधुनिक और स्पष्ट हिन्दी में ‘बाँझ रही’ इसका सीधा समतुल्य है।
- source_word: προσηύξατο πρὸς Κύριον
  choice: प्रभु से प्रार्थना की
  rationale: ‘प्रभु की ओर/प्रभु से प्रार्थना की’ के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ νηστείας
  choice: उपवास करते हुए
  rationale: उपवास को प्रार्थना की परिस्थिति या संगति के रूप में रखता है, जैसा यूनानी वाक्य-विन्यास में है।
- source_word: συλλαβοῦσα τέτοκέ με
  choice: गर्भवती होकर मुझे जन्म दिया
  rationale: दोनों क्रमिक क्रियाओं—गर्भधारण और जन्म देने—को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: उपवास का संबंध प्रार्थना से है या गर्भधारण से
  choice: उपवास को प्रार्थना के साथ जोड़ा गया है
  alternative: ‘उपवास में गर्भवती होकर’ अथवा ‘उपवास करते हुए गर्भवती हुई’
  rationale: यूनानी में μετὰ νηστείας सीधे προσηύξατο के बाद आता है, इसलिए उसका सबसे स्वाभाविक संबंध प्रार्थना से है। गर्भधारण से उसे स्पष्ट रूप से जोड़ना पाठ में अनावश्यक अर्थ जोड़ देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘बाँझ’ मूल अर्थ को सीधे व्यक्त करता है, जबकि वाक्य-रचना सामान्य पाठक के लिए सहज रखी गई है।
