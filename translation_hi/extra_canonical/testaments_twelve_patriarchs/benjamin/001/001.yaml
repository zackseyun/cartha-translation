  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। शीर्षक और मुख्य वाक्य को अलग रखा गया है, जैसा यूनानी संरचना संकेत करती है। व्यक्ति-नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘याकूब’, ‘राहेल’ और ‘बिन्यामीन’ अपनाए गए हैं।
