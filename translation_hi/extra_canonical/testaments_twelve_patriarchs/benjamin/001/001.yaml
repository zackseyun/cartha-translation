translation:
  language: hi
  text: 'याकूब और राहेल के बारहवें पुत्र बिन्यामीन की वसीयत।


    बिन्यामीन के वचनों की प्रति, जिन्हें उसने अपने पुत्रों के लिए व्यवस्थित किया, जब वह एक सौ पच्चीस वर्ष जी चुका था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयत
  rationale: इस साहित्यिक शीर्षक में यह शब्द पूर्वज द्वारा मृत्यु से पहले दी गई अंतिम शिक्षाओं और निर्देशों के लिखित विधान को सूचित करता है; आधुनिक हिन्दी में ‘वसीयत’ इस विधा को संक्षेप और स्वाभाविक रूप से व्यक्त करती है।
- source_word: Ἀντίγραφον λόγων
  choice: वचनों की प्रति
  rationale: Ἀντίγραφον का मूल अर्थ लिखित प्रति है और λόγων यहाँ कथनों अथवा उपदेशात्मक वचनों को दर्शाता है।
- source_word: διέθετο
  choice: व्यवस्थित किया
  rationale: मध्यवाच्य क्रिया में प्रबंध करने, क्रम देने या निर्देश के रूप में निर्धारित करने का भाव है; ‘व्यवस्थित किया’ स्रोत की व्यापकता बनाए रखता है और इसे केवल ‘कहा’ तक सीमित नहीं करता।
- source_word: ζήσας ἔτη ἑκατὸν εἴκοσι πέντε
  choice: जब वह एक सौ पच्चीस वर्ष जी चुका था
  rationale: भूतकालिक कृदंत को स्वाभाविक हिन्दी में पूर्वकालिक परिस्थिति के रूप में रखा गया है, बिना यह अनावश्यक रूप से तय किए कि वचन ठीक मृत्यु के समय दिए गए थे।
