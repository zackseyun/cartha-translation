lexical_decisions:
- source_word: Σφόδρα
  choice: बहुत
  rationale: यह क्रियाविशेषण प्रेम की तीव्रता बताता है; आधुनिक स्वाभाविक हिन्दी में ‘बहुत प्रेम’ स्पष्ट और गरिमापूर्ण है।
- source_word: ἠγάπα
  choice: प्रेम करते थे
  rationale: अपूर्ण भूतकाल यहाँ निरंतर या स्थायी अतीत की भावना व्यक्त करता है।
- source_word: ηὔχετο
  choice: प्रार्थना की थी
  rationale: संदर्भ में यह परमेश्वर से की गई विनती को व्यक्त करता है; पूर्वकालिक क्रिया के रूप में हिन्दी में ‘की थी’ स्वाभाविक है।
- source_word: δύο υἱοὺς ἰδεῖν ἐξ αὐτῆς
  choice: कि वे उससे दो पुत्र देखें
  rationale: ‘देखें’ मूल यूनानी ἰδεῖν को बनाए रखता है, जबकि ‘उससे’ ἐξ αὐτῆς के मातृत्व-संबंधी अर्थ को संक्षेप में व्यक्त करता है।
