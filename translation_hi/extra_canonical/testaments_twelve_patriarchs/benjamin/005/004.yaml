source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ἐὰν γὰρ˥²⁶ ὑβρίσει²⁷ *ἄνδρα ὅσιον²⁸ μετανοεῖ²⁹, ἐλεεῖ γὰρ ⌈ὁ ὅσιος⌉ τῶν λοιδορούν³⁰ καὶ σιωπᾷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/004.yaml
  text: For if anyone insults a holy man, he repents; for the holy one has mercy on those who revile him and keeps silent.
translation:
  language: hi
  text: क्योंकि यदि कोई पवित्र मनुष्य का अपमान करता है, तो वह पश्चाताप करता है; क्योंकि वह पवित्र मनुष्य अपनी निन्दा करनेवालों पर दया करता और चुप रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβρίσει
  choice: अपमान करता है
  rationale: यहाँ क्रिया का अर्थ किसी के साथ उद्दंडतापूर्वक अपमानजनक व्यवहार करना है; प्रसंग में ‘अपमान करता है’ स्वाभाविक और स्रोत के अनुरूप है।
- source_word: ἄνδρα ὅσιον / ὁ ὅσιος
  choice: पवित्र मनुष्य / वह पवित्र मनुष्य
  rationale: ὅσιος नैतिक-धार्मिक निष्ठा या पवित्रता व्यक्त करता है। दूसरी अभिव्यक्ति को उसी पहले उल्लिखित व्यक्ति से स्पष्ट रूप से जोड़ा गया है।
- source_word: μετανοεῖ
  choice: पश्चाताप करता है
  rationale: μετανοέω मन-परिवर्तन के साथ अपने किए पर पश्चाताप का सामान्य अर्थ रखता है; धार्मिक आशय को बिना बढ़ाए ‘पश्चाताप करता है’ उपयुक्त है।
- source_word: τῶν λοιδορούν
  choice: अपनी निन्दा करनेवालों पर
  rationale: λοιδορέω मौखिक निन्दा, गाली या भला-बुरा कहने को दर्शाता है। कृदन्त का लक्ष्य पवित्र मनुष्य है, इसलिए हिन्दी में ‘अपनी’ संबंध स्पष्ट करता है।
- source_word: σιωπᾷ
  choice: चुप रहता है
  rationale: क्रिया का सीधा अर्थ मौन रहना है; ‘चुप रहता है’ आधुनिक और सहज हिन्दी है।
theological_decisions:
- issue: μετανοεῖ का कर्ता
  choice: अपमान करनेवाला पश्चाताप करता है
  alternative: पवित्र मनुष्य पश्चाताप करता है
  rationale: Ἐὰν ... ὑβρίσει का अनिर्दिष्ट कर्ता अगली एकवचन क्रिया μετανοεῖ का स्वाभाविक कर्ता बना रहता है, जबकि बाद के स्पष्ट ὁ ὅσιος से कर्ता बदलता है।
- issue: ὁ ὅσιος की पहचान
  choice: पहले उल्लिखित पवित्र मनुष्य
  alternative: सामान्यतः कोई भी पवित्र जन
  rationale: निश्चित पदबंध और वाक्य का प्रवाह इसे पहले के ἄνδρα ὅσιον की ओर संकेत करता हुआ पढ़ने का समर्थन करते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत की कारणसूचक पुनरावृत्ति को बनाए रखने के लिए दोनों स्थानों पर ‘क्योंकि’ रखा गया है।
