  text: Ἐὰν ἦτε ἀγαθοποιοῦντες καὶ *τὰ ἀκάθαρτα¹⁶ πνεύματα φεύξονται¹⁷ *ἀφʼ ὑμῶν¹⁸, καὶ¹⁹ τὰ θηρία²⁰ *φοβηθήσονται ὑμᾶς²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/002.yaml
  text: If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.
translation:
  language: hi
  text: यदि तुम भलाई करते रहोगे, तो अशुद्ध आत्माएँ भी तुम्हारे पास से भाग जाएँगी, और जंगली पशु तुमसे डरेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν ἦτε ἀγαθοποιοῦντες
  choice: यदि तुम भलाई करते रहोगे
  rationale: यह शर्तसूचक वाक्यांश निरंतर भलाई करने के भाव को व्यक्त करता है; आधुनिक हिन्दी में यह रूप स्वाभाविक और स्पष्ट है।
- source_word: τὰ ἀκάθαρτα πνεύματα
  choice: अशुद्ध आत्माएँ
  rationale: यह यूनानी पद का सीधा और धार्मिक संदर्भ में परिचित हिन्दी प्रतिरूप है।
- source_word: φεύξονται ἀφʼ ὑμῶν
  choice: तुम्हारे पास से भाग जाएँगी
  rationale: ἀπό यहाँ अलग होकर दूर जाने का भाव देता है; ‘पास से’ हिन्दी में इस संबंध को सहजता से व्यक्त करता है।
- source_word: τὰ θηρία
  choice: जंगली पशु
  rationale: θηρία का आशय वन्य अथवा हिंस्र पशुओं से हो सकता है; ‘जंगली पशु’ अर्थ को अनावश्यक रूप से केवल हिंस्रता तक सीमित नहीं करता।
- source_word: φοβηθήσονται ὑμᾶς
  choice: तुमसे डरेंगे
  rationale: यह सकर्मक भय के भाव का स्वाभाविक आधुनिक हिन्दी अनुवाद है।
theological_decisions:
- issue: अशुद्ध आत्माओं के भागने के कथन की शक्ति
  choice: मूल के भविष्यकालीन कथन को सीधे बनाए रखा गया है
  alternative: ‘भाग सकती हैं’ या किसी रूपकात्मक अर्थ में प्रस्तुत करना
  rationale: यूनानी φεύξονται निश्चित भविष्यकाल में है; पाठ की अलौकिक धारणा को नरम करना या रूपक मान लेना स्रोत में उपस्थित तनाव को अनुचित रूप से सुलझा देता।
- issue: καί का बल
  choice: पहले καί को ‘भी’ से व्यक्त किया गया है
  alternative: केवल ‘और’ अथवा बिना किसी बलसूचक शब्द के
  rationale: वाक्यक्रम में καί अशुद्ध आत्माओं को भी परिणाम के दायरे में रखने वाला बल दे सकता है; ‘भी’ इस संभावित जोर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। बहुवचन ‘तुम’ पूरे वाक्य में बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
