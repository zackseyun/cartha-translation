base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/005.yaml
  text: And if anyone betrays a righteous man, the righteous man prays; and even if for a little while he is brought low, before long he reappears far more radiant, as Joseph my brother became.
translation:
  language: hi
  text: और यदि कोई किसी धर्मी के साथ विश्वासघात करे, तो वह धर्मी प्रार्थना करता है; और भले ही वह थोड़े समय के लिए नीचा किया जाए, वह कुछ ही समय बाद और अधिक तेजस्वी रूप में फिर प्रकट होता है[a]—जैसा मेरा भाई यूसुफ हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेजस्वी’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘अधिक प्रसन्न’ या ‘अधिक उज्ज्वल’ भी हो सकता है।
    reason: मूल शब्द φαιδρότερος की अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: προδώσει
  choice: विश्वासघात करे
  rationale: इस क्रिया का मूल भाव किसी को धोखा देकर सौंप देना या उसके साथ विश्वासघात करना है। संदर्भ में सामान्य और स्वाभाविक हिन्दी ‘विश्वासघात करे’ उपयुक्त है।
- source_word: ταπεινωθῇ
  choice: उसे नीचा किया जाए
  rationale: यह कर्मवाच्य रूप अस्थायी रूप से दीन या अपमानित किए जाने का भाव देता है; ‘नीचा किया जाए’ मूल की व्यापकता बनाए रखता है।
- source_word: φαιδρότερος
  choice: पहले से कहीं अधिक तेजस्वी
  rationale: शब्द उज्ज्वल, दीप्त या प्रसन्न दिखाई देने का भाव दे सकता है। यूसुफ के पतन के बाद महिमा में प्रकट होने के संदर्भ में ‘तेजस्वी’ उपयुक्त है, जबकि पाद-टिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
- source_word: ἀναφαίνεται
  choice: फिर प्रकट होता है
  rationale: क्रिया दोबारा या नए रूप में दिखाई देने का संकेत देती है; ‘फिर प्रकट होता है’ इस पुनःप्रकट होने के भाव को स्पष्ट रखता है।
theological_decisions:
- issue: धर्मी की प्रतिक्रिया और बाद की प्रतिष्ठा के बीच संबंध
  choice: वाक्यों को क्रमिक रूप में रखा गया, पर प्रार्थना को उसकी पुनर्स्थापना का स्पष्ट कारण नहीं बताया गया।
  alternative: प्रार्थना के फलस्वरूप वह अधिक तेजस्वी होकर प्रकट होता है।
  rationale: यूनानी पाठ घटनाओं को साथ रखता है, पर स्पष्ट कारणसूचक संयोजक नहीं देता; इसलिए संभावित धार्मिक संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: यूसुफ के उदाहरण की अभिव्यक्ति
  choice: ‘जैसा मेरा भाई यूसुफ हुआ था’
  alternative: ‘जैसा मेरे भाई यूसुफ के साथ हुआ था’
  rationale: चुनी गई अभिव्यक्ति οἷος γέγονεν के व्यक्तित्व-केंद्रित रूप के निकट है और यूसुफ को पूर्व कथन का प्रत्यक्ष उदाहरण बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘धर्मी’, ‘प्रार्थना’ और ‘तेजस्वी’ जैसे परिचित धार्मिक-साहित्यिक शब्द रखे गए हैं; वाक्य-संरचना मूल के विरोधाभास और आशा को स्पष्ट करती है।
