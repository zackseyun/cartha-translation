base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/003.yaml
  text: For where there is fear of good works and light in the mind, darkness flees from it.
translation:
  language: hi
  text: क्योंकि जहाँ भले कामों का भय और मन में प्रकाश होता है, वहाँ अन्धकार उससे दूर भाग जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβος ἀγαθῶν ἔργων
  choice: भले कामों का भय
  rationale: यूनानी पदबंध का असामान्य और सम्भवतः जानबूझकर तनावपूर्ण अर्थ सुरक्षित रखा गया है; इसे बिना पर्याप्त आधार ‘भले कामों के प्रति श्रद्धा’ या ‘बुरे कामों का भय’ नहीं बनाया गया।
- source_word: φῶς εἰς διάνοιαν
  choice: मन में प्रकाश
  rationale: εἰς के दिशात्मक रूप को स्वाभाविक हिन्दी में अवस्थिति के रूप में व्यक्त किया गया है; διάνοια यहाँ विचारशील मन या अन्तर्बोध को सूचित करता है।
- source_word: ἀποδιδράσκει ἀπʼ αὐτοῦ
  choice: उससे दूर भाग जाता है
  rationale: क्रिया के प्रबल पलायन-बोध और ἀπό के अलगाव को रखा गया है। नपुंसकलिंग αὐτοῦ का पूर्वसंदर्भ अस्पष्ट है, इसलिए हिन्दी ‘उससे’ उसी अस्पष्टता को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: ‘भले कामों का भय’ का सम्भावित अर्थ
  choice: पाठ के प्रत्यक्ष शब्दों को तनाव सहित सुरक्षित रखा गया
  alternative: ‘भले कामों के प्रति श्रद्धा’ अथवा अनुमानित पाठ-सुधार के आधार पर ‘बुरे कामों का भय’
  rationale: उपलब्ध यूनानी स्रोत φόβος ἀγαθῶν ἔργων पढ़ता है। किसी विशिष्ट नैतिक या धर्मवैज्ञानिक व्याख्या को पाठ में आरोपित करना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘अन्धकार’ और ‘प्रकाश’ की नैतिक-आध्यात्मिक छवि को बनाए रखा गया है, जबकि मूल के असामान्य ‘भले कामों का भय’ को सहज बनाने के लिए अर्थ नहीं बदला गया।
