- from: इसलिए यदि तुम भी अपना मन भला रखोगे, तो दुष्ट लोग भी तुम्हारे साथ शान्ति से रहेंगे; और दुराचारी तुमसे लज्जित होकर भलाई की ओर फिरेंगे। लोभी लोग न केवल अपनी इस लालसा से दूर हो जाएँगे, बल्कि लोभ से जो कुछ उन्होंने पाया था, उसे संकट में पड़े लोगों को दे देंगे।
  to: इसलिए यदि तुम्हारा मन भी भला हो, तो दुष्ट लोग भी तुम्हारे साथ शान्ति से रहेंगे; और दुराचारी तुम्हारे कारण लज्जित होकर भलाई की ओर फिरेंगे। लोभी लोग न केवल उस आसक्ति से दूर हो जाएँगे, बल्कि लोभ से जुड़ी वे वस्तुएँ जो उनके पास थीं, संकट में पड़े लोगों को भी दे देंगे।
  rationale: The revision preserves the conditional assurance and moral sequence of the Greek while avoiding an unsupported assertion that the goods were acquired by greed. It also renders πάθος without added possessive or demonstrative nuance and makes the initial condition more idiomatic and closer to the Greek present conditional.
