review_pass:
  verdict: revise
  source_fidelity: The overall conditional progression and the three groups are preserved. However, “लोभ से जो कुछ उन्होंने पाया था” makes acquisition by greed explicit, whereas τὰ τῆς πλεονεξίας ἃ εἶχον more literally identifies the things connected with greed that they had; the Greek does not state how they acquired them. “अपनी इस लालसा” also adds both possessive and demonstrative nuance not present in τοῦ πάθους.
  naturalness: The draft is generally fluent modern Hindi. “यदि तुम्हारा मन भी भला हो” is a more idiomatic rendering of the present conditional than the future “यदि तुम भी अपना मन भला रखोगे.” “लोभ से जुड़ी वे वस्तुएँ जो उनके पास थीं” is somewhat more explicit than the Greek’s compressed phrasing but is natural and avoids implying a particular means of acquisition.
  terminology: “दुष्ट,” “दुराचारी,” “भलाई,” “लोभी,” and “संकट में पड़े लोग” are suitable. “आसक्ति” renders πάθος broadly while the surrounding references to greed supply the relevant context, without narrowing it to an acquired-goods motive or a sexual sense.
  issues:
  - severity: medium
    issue: “लोभ से जो कुछ उन्होंने पाया था” overstates τὰ τῆς πλεονεξίας ἃ εἶχον.
    rationale: The phrase says “the things of greed which they had,” not explicitly “what they obtained through greed.” The Hindi should retain the ambiguity about origin or manner of possession.
  - severity: low
    issue: “अपनी इस लालसा” adds possessive and demonstrative specification to τοῦ πάθους.
    rationale: Neither “अपनी” nor “इस” is expressed in the Greek. A neutral term for passion/attachment lets the nearby greed vocabulary provide the contextual qualification.
  - severity: low
    issue: The protasis is rendered with a future form (“रखोगे”) although ἔχετε is present subjunctive.
    rationale: Hindi need not mechanically reproduce Greek tense, but “यदि तुम्हारा मन भी भला हो” better represents the general present condition and reads naturally.
  revised_text: इसलिए यदि तुम्हारा मन भी भला हो, तो दुष्ट लोग भी तुम्हारे साथ शान्ति से रहेंगे; और दुराचारी तुम्हारे कारण लज्जित होकर भलाई की ओर फिरेंगे। लोभी लोग न केवल उस आसक्ति से दूर हो जाएँगे, बल्कि लोभ से जुड़ी वे वस्तुएँ जो उनके पास थीं, संकट में पड़े लोगों को भी दे देंगे।
  revised_footnotes: []
  revision_rationale: The revision preserves the conditional assurance and moral sequence of the Greek while avoiding an unsupported assertion that the goods were acquired by greed. It also renders πάθος without added possessive or demonstrative nuance and makes the initial condition more idiomatic and closer to the Greek present conditional.
