language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: V. Ἐὰν ⸀οὖν καὶ ὑμεῖς¹· ἔχετε² ἀγαθὴν³ ⸀διάνοιαν⁴, καὶ⸃ οἱ πονηροὶ ἄνθρωποι⁵ *εἰρηνεύσουσιν μεθʼ ὑμῶν⁶, καὶ οἱ ἄσωτοι αἰδεσθέντες⁷ ὑμᾶς⁸ ⸀ἐπιστρέψουσιν⁹ εἰς *τὸ ἀγαθόν¹⁰, καὶ οἱ πλεονεκτοῦντες¹¹ οὐ μόνον ἀποστήσονται *τοῦ πάθους¹² ἀλλὰ καὶ *τὰ τῆς¹³ πλεονεξίας *ἃ εἶχον¹⁴ δώσουσιν¹⁵ τοῖς θλιβομένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/001.yaml
  text: If, then, you also have a good mind, even wicked people will be at peace with you, and the profligate, being put to shame by you, will turn to what is good; and those who are greedy will not only turn away from their passion, but will also give to those in distress the things of greed that they had.
translation:
  language: hi
  text: इसलिए यदि तुम्हारा मन भी भला हो, तो दुष्ट लोग भी तुम्हारे साथ शान्ति से रहेंगे; और दुराचारी तुम्हारे कारण लज्जित होकर भलाई की ओर फिरेंगे। लोभी लोग न केवल उस आसक्ति से दूर हो जाएँगे, बल्कि लोभ से जुड़ी वे वस्तुएँ जो उनके पास थीं, संकट में पड़े लोगों को भी दे देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὴν διάνοιαν
  choice: अपना मन भला
  rationale: यह διάνοια के मानसिक रुझान और नैतिक अभिप्राय दोनों को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ πονηροὶ ἄνθρωποι
  choice: दुष्ट लोग
  rationale: नैतिक बुराई का सीधा और सामान्य हिन्दी रूप।
- source_word: οἱ ἄσωτοι
  choice: दुराचारी
  rationale: ἄσωτος यहाँ उच्छृंखल अथवा अपव्ययी जीवन जीने वालों की ओर संकेत करता है; ‘दुराचारी’ संदर्भ में व्यापक नैतिक अर्थ को बनाए रखता है।
- source_word: αἰδεσθέντες ὑμᾶς
  choice: तुमसे लज्जित होकर
  rationale: ग्रीक कर्मकारक के कारण उत्पन्न लज्जा/संकोच को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल ‘तुम्हारे सामने’ तक सीमित किए।
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: भलाई की ओर फिरेंगे
  rationale: दिशात्मक परिवर्तन को बनाए रखता है और ‘भलाई’ τὸ ἀγαθόν का सहज नैतिक रूप है।
- source_word: τοῦ πάθους
  choice: अपनी इस लालसा
  rationale: πάθος का शाब्दिक विस्तार व्यापक है, पर निकटवर्ती πλεονεξία इसे लोभपूर्ण अभिलाषा के रूप में संदर्भित करता है। ‘इस’ उसी पूर्वोक्त लोभ से संबंध स्पष्ट करता है।
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: लोभ से जो कुछ उन्होंने पाया था
  rationale: 'अटपटी ग्रीक अभिव्यक्ति को अर्थपूर्ण हिन्दी देता है: उनके पास मौजूद वे वस्तुएँ जो लोभ से जुड़ी थीं। ‘पाया’ अधिग्रहण का संकेत देता है, पर ‘लूट’ जैसा अनावश्यक रूप से विशिष्ट अर्थ नहीं जोड़ता।'
- source_word: τοῖς θλιβομένοις
  choice: संकट में पड़े लोगों को
  rationale: पीड़ित, दबे या विपत्ति झेल रहे लोगों के व्यापक अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भले मन के परिणामों की शर्त और निश्चितता
  choice: यदि… रखोगे, तो… रहेंगे/फिरेंगे/हो जाएँगे/दे देंगे
  alternative: इसे सामान्य नीतिवचन या केवल सम्भावना के रूप में नरम करना
  rationale: ग्रीक ἐάν के साथ भविष्यकालीन क्रियाएँ स्पष्ट शर्त-परिणाम संरचना बनाती हैं; पाठ के प्रबल दावे को उसी तनाव के साथ रखा गया है।
- issue: πάθος का नैतिक अर्थ
  choice: लोभ से संबंधित ‘लालसा’
  alternative: ‘विकार’, ‘जुनून’ या सामान्य ‘वासना’
  rationale: निकट संदर्भ में πλεονεκτοῦντες और πλεονεξίας अर्थ को लोभपूर्ण चाह की ओर सीमित करते हैं; ‘वासना’ आधुनिक हिन्दी में प्रायः यौन अर्थ दे सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। बहुवचन ‘तुम’ को पूरे पद में बनाए रखा गया है। वाक्य की क्रमिक नैतिक गति—शान्ति, परिवर्तन, लोभ का त्याग और पीड़ितों को देना—संरक्षित है।
