  text: III. *Νῦν οὖν, τέκνα μου, καὶ ὑμεῖς ⸀ἀγαπήσατε¹ Κύριον τὸν Θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς², καὶ³ φυλάξατε⁴ ἐντολὰς αὐτοῦ, *μιμούμενοι τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα ⸀Ἰωσήφ⁵. 2. Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹. 3. Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου. 4. Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ. 5. Καὶ ἀπὸ²⁴ ἐπιβουλῆς ἀνθρώπων ἢ θηρίων οὐ δύναται κυριευθῆναι²⁸, βοηθούμενος *†ζῆν ἀπ᾽ αὐτῆς† ὑπὸ τῆς ἀγάπης²⁹ ἧς³⁰ ἔχει πρὸς τὸν πλησίον. 6. *Καὶ γὰρ³¹ *ὁ Ἰωσὴφ ἐδεήθη τοῦ πατρὸς ἡμῶν³², ἵνα προσεύξηται *ὑπὲρ τῶν ἀδελφῶν αὐτοῦ³³· ἵνα μὴ³⁴ λογίσηται *⌈Κύριος⌉ αὐτοῖς³⁵ *ἁμαρτίαν, ὅτι ἐποίησαν
    πονηρὸν εἰς αὐτόν³⁶. 7. Καὶ *οὕτως ἐβόα Ἰακώβ³⁷· *ὦ τέκνον χρηστόν³⁸, ἐνίκησας³⁹ τὰ σπλάγχνα⁴⁰ Ἰακὼβ τοῦ πατρός σου· καὶ περιλαβὼν⁴¹ αὐτὸν⁴² ἐπὶ⁴³ δύο⁴⁴ ὥρας κατεφίλει, λέγων· 8. Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
