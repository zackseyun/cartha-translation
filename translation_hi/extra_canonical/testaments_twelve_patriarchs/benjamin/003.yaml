  text: 1[a]. Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph. 2. And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly. 3. Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every wickedness of affliction, they will certainly not rule over you, just as they did not over Joseph my brother. 4. How many men wanted to kill him, yet God sheltered him[b]. For the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God. 5. And he cannot be mastered by the plots of men or of beasts, since the Lord helps him through the love that he has toward his neighbor. 6. For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him. 7. And thus Jacob cried out,
    “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, for two hours he kept kissing him, saying, 8. “The heavenly prophecy will be fulfilled upon you.”
translation:
  language: hi
  text: 3:1 इसलिए अब, मेरे बच्चों, तुम भी प्रभु, स्वर्ग और पृथ्वी के परमेश्वर, से प्रेम करो और उसकी आज्ञाओं का पालन करो। भले और पवित्र पुरुष यूसुफ का अनुकरण करो। 2 तुम्हारा मन भलाई की ओर लगा रहे, जैसा तुम मुझे जानते हो; क्योंकि जिसका मन सीधा है, वह सब कुछ ठीक रीति से देखता है। 3 प्रभु का भय मानो और अपने पड़ोसी से प्रेम करो। यदि बेलियार की आत्माएँ क्लेश की हर प्रकार की दुष्टता में तुम्हें धकेल भी दें, तो वे निश्चय ही तुम पर प्रभुता न कर सकेंगी, जैसे वे मेरे भाई यूसुफ पर भी प्रभुता न कर सकीं। 4 कितने ही लोग उसे मार डालना चाहते थे, फिर भी परमेश्वर ने उसकी रक्षा की। क्योंकि जो परमेश्वर का भय मानता और अपने पड़ोसी से प्रेम करता है, उसे बेलियार की आत्मा चोट नहीं पहुँचा सकती, क्योंकि वह परमेश्वर के भय की आड़ में सुरक्षित रहता है। 5 मनुष्यों या पशुओं की साज़िशें भी उस पर अधिकार नहीं कर सकतीं, क्योंकि अपने पड़ोसी के प्रति जो प्रेम उसमें है, उसी के द्वारा उसे सहायता मिलती है।[a] 6 यूसुफ ने हमारे पिता से यह विनती भी की कि वे उसके भाइयों के लिए प्रार्थना करें, ताकि प्रभु उनके लेखे पाप न लगाए, क्योंकि
    उन्होंने उसके साथ बुराई की थी। 7 तब याकूब पुकार उठा, “हे भले पुत्र, तूने अपने पिता, याकूब, के हृदय की गहराइयों को जीत लिया है।” फिर उसने यूसुफ को गले लगाया और दो घंटे तक उसे चूमता रहा। उसने कहा, 8 “तेरे विषय में स्वर्गीय भविष्यवाणी पूरी होगी।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 5 का यूनानी पाठ इस स्थान पर भ्रष्ट और साक्षियों में अस्थिर है। कुछ पाठों में पशुओं या ‘वायु की आत्मा’ से संबंधित अतिरिक्त शब्द मिलते हैं; सहायता मिलने वाला वाक्यांश भी निश्चित नहीं है।
    reason: textual_variant
  - marker: b
    text: इसे “तेरे ऊपर स्वर्गीय भविष्यवाणी पूरी होगी” भी अनुवाद किया जा सकता है। साक्षियों में संबंधसूचक पूर्वसर्ग का पाठ थोड़ा भिन्न है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: प्रेम करो
  rationale: आज्ञार्थक रूप और नैतिक-वाचायी बल को सहज, मानक हिन्दी में बनाए रखता है।
- source_word: φυλάξατε ἐντολὰς
  choice: आज्ञाओं का पालन करो
  rationale: हिन्दी के शास्त्रीय उपदेशात्मक प्रयोग में स्वाभाविक है और आज्ञाओं को मानने/निभाने का अर्थ स्पष्ट करता है।
- source_word: μιμούμενοι
  choice: अनुकरण करो
  rationale: नैतिक आदर्श का अनुसरण करने वाले कृदन्तीय भाव को संक्षिप्त रूप से व्यक्त करता है।
- source_word: διάνοια
  choice: मन
  rationale: यहाँ नैतिक और बौद्धिक अभिमुखता दोनों का बोध कराता है तथा सामान्य पाठक के लिए स्वाभाविक है।
- source_word: εἰς τὸ ἀγαθόν
  choice: भलाई की ओर लगा रहे
  rationale: दिशात्मक अर्थ को हिन्दी की स्वाभाविक अभिव्यक्ति में सुरक्षित रखता है।
- source_word: ὀρθὴν ... ὀρθῶς
  choice: मन सीधा ... ठीक रीति से
  rationale: मूल की शब्द-क्रीड़ा को पूर्णतः दोहराना हिन्दी में अस्वाभाविक होता; फिर भी नैतिक सीधाई और सही दृष्टि का संबंध सुरक्षित है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: स्थापित शास्त्रीय नैतिक पद है और निकटवर्ती मनुष्य के प्रति प्रेम का आशय बनाए रखता है।
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: बेलियार की आत्माएँ
  rationale: यूनानी नाम Βελίαρ का लिप्यंतरण और बहुवचन πνεύματα दोनों सुरक्षित रखे गए हैं।
- source_word: ἐκστήσωσι
  choice: धकेल दें
  rationale: दुष्टता की ओर बाध्यकारी गति का संकेत देता है, बिना मनोवैज्ञानिक अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: κατακυριεύσωσιν
  choice: प्रभुता न कर सकेंगी
  rationale: विरोधी शक्तियों के शासन या वर्चस्व के भाव को व्यक्त करता है और प्रबल निषेध को बनाए रखता है।
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: अपनी आड़ में रखा / अपनी आड़ में रखता है
  rationale: दोनों स्थानों पर संरक्षण की आवरण-छवि को संगत रूप से बनाए रखता है।
- source_word: πληγῆναι
  choice: चोट नहीं पहुँचा सकती
  rationale: निष्क्रिय रूप के व्यावहारिक आशय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: हृदय की गहराइयों को जीत लिया
  rationale: शाब्दिक ‘अंतड़ियों’ के बजाय प्राचीन भावनात्मक मुहावरे को दर्शाता है, जबकि ἐνίκησας का ‘जीत लिया’ सुरक्षित रहता है।
theological_decisions:
- issue: पद 4 में सुरक्षा का माध्यम
  choice: परमेश्वर का भय स्वयं आड़ देने वाली शक्ति के रूप में रखा गया है।
  alternative: इसे केवल मनोवैज्ञानिक श्रद्धा या सामान्य ईश्वरीय सुरक्षा के रूप में समझाना।
  rationale: मूल वाक्य ‘परमेश्वर के भय द्वारा आड़ में रखे जाने’ की विशिष्ट धार्मिक भाषा प्रयुक्त करता है; उसके तनाव को हल नहीं किया गया।
- issue: पद 5 के भ्रष्ट/अस्थिर यूनानी वाक्यांश का अर्थ
  choice: पड़ोसी के प्रति प्रेम के द्वारा सहायता मिलने का न्यूनतम आशय रखा गया है; कर्ता को स्पष्टतः ‘प्रभु’ नहीं बनाया गया।
  alternative: अंग्रेज़ी परामर्श-पाठ की तरह ‘प्रभु उसकी सहायता करता है’ कहना।
  rationale: उपलब्ध यूनानी में ‘प्रभु’ स्पष्ट नहीं है और †ζῆν ἀπ᾽ αὐτῆς† पाठ भ्रष्ट है; अतः अनिश्चित कर्ता को निष्क्रिय हिन्दी में सुरक्षित रखा गया।
- issue: पद 6 की मध्यस्थ प्रार्थना
  choice: यूसुफ अपने पिता से भाइयों के लिए प्रार्थना करने को कहता है कि प्रभु उनके लेखे पाप न लगाए।
  alternative: यूसुफ द्वारा प्रत्यक्ष क्षमा को ही एकमात्र कथन बनाना।
  rationale: यूनानी पाठ प्रार्थना और परमेश्वर द्वारा पाप गिने जाने की भाषा स्पष्ट रूप से रखता है।
- issue: पद 8 के कोष्ठकबद्ध मसीही विस्तार
  choice: मुख्य पाठ में केवल ‘तेरे विषय में स्वर्गीय भविष्यवाणी पूरी होगी’ रखा गया है।
  alternative: परमेश्वर के मेम्ने, निर्दोष के मरने, वाचा के लहू और बेलियार के विनाश वाला पूरा कोष्ठकबद्ध विस्तार सम्मिलित करना।
  rationale: स्रोत में ये खंड संपादकीय वर्ग कोष्ठकों में हैं और अंग्रेज़ी POB भी उन्हें मुख्य पाठ में नहीं रखता; वर्तमान अध्याय-पाठ के लिए संदिग्ध/द्वितीयक विस्तार को आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण किंतु सामान्य पाठक के लिए सुलभ। ‘प्रभुता’, ‘लेखे पाप लगाना’ और ‘स्वर्गीय भविष्यवाणी’ जैसे पद शास्त्रीय गरिमा रखते हैं, पर अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है। पद 5 की पाठगत अनिश्चितता को अनावश्यक रूप से स्पष्ट नहीं किया गया; पद 8 के संपादकीय कोष्ठकबद्ध विस्तार को मुख्य पाठ से बाहर रखा गया है।
