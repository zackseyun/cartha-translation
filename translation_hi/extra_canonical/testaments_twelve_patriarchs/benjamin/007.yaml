  text: '7[a]. And he purifies his mind so as not to be condemned by men, and likewise by God. In the same way, the works of Beliar also are twofold, and they have no simplicity in them.


    Therefore, my children[b], I tell you: flee the evil of Beliar, because he gives a sword to those who obey him. And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.


    Because of this, Cain was handed over to seven acts of vengeance. For in one hundred years the Lord brought one plague upon him after another[c], and in the nine-hundredth year he was made desolate.'
translation:
  language: hi
  text: '**अध्याय 7**


    **1** इसलिए, मेरे बच्चो, मैं तुमसे कहता हूँ: बेलियार[a] की बुराई से भागो, क्योंकि वह अपनी बात माननेवालों को तलवार देता है।


    **2** वह तलवार सात बुराइयों की जननी है। पहले मन बेलियार के द्वारा गर्भ धारण करता है। उससे उत्पन्न होनेवाली बुराइयाँ ये हैं: पहली ईर्ष्या, दूसरी विनाश, तीसरी पीड़ा, चौथी बंदीपन[b], पाँचवीं अभाव, छठी उथल-पुथल और सातवीं उजाड़।


    **3** इसी कारण परमेश्वर ने कैन को सात प्रतिशोधों के हवाले कर दिया। प्रभु ने हर सौवें वर्ष उस पर एक विपत्ति डाली।


    **4** वह दो सौ वर्ष तक दुःख भोगता है और नौ सौवें वर्ष में उजाड़ दिया जाता है[c]। अपने भाई हाबिल के कारण वह इन सभी बुराइयों के द्वारा दण्डित हुआ, परन्तु लेमेक सत्तर गुना सात के द्वारा।


    **5** क्योंकि युग-युग तक जो लोग ईर्ष्या और ऐसे भ्रातृ-द्वेष में कैन के समान हैं, वे न्याय के द्वारा ऐसा ही दण्ड पाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी साक्षी में नाम का रूप ‘बेलियार’ है; अनेक पाठक इसे ‘बेलियाल’ नाम से जानते होंगे।
    reason: lexical_alternative
  - marker: b
    text: चौथी बुराई का यूनानी पाठ अनिश्चित है। मुद्रित रूप का अर्थ ‘ईश्वर की ओर से आई विपत्ति’ हो सकता है, जबकि अन्य पाठ-साक्ष्य ‘बंदीपन’ का समर्थन करते हैं। यहाँ सूची के समानान्तर रूपों के आधार पर ‘बंदीपन’ अपनाया गया है।
    reason: textual_variant
  - marker: c
    text: पाठ में सात प्रतिशोध, हर सौवें वर्ष एक विपत्ति, दो सौ वर्ष तक दुःख और नौ सौवें वर्ष उजाड़े जाने—ये सभी संख्यात्मक कथन साथ-साथ आते हैं। उनके बीच के कालक्रमिक तनाव को अनुवाद में यथावत रखा गया है।
    reason: textual_difficulty
lexical_decisions:
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी साक्षी के रूप ‘Βελίαρ’ को बनाए रखा गया है; अधिक परिचित ‘बेलियाल’ में सामान्यीकृत नहीं किया गया।
- source_word: μάχαιρα
  choice: तलवार
  rationale: यह नैतिक विनाश के साधन का गंभीर रूपक है; ‘तलवार’ स्वाभाविक और सटीक है।
- source_word: πειθομένοις
  choice: अपनी बात माननेवालों
  rationale: कृदन्त में राजी होने और आज्ञापालन, दोनों की छाया है। यह प्रयोग बेलियार के प्रभाव के आगे सक्रिय रूप से झुकने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: διάνοια
  choice: मन
  rationale: यहाँ आन्तरिक नैतिक विचार और अभिप्राय उत्पन्न करनेवाली शक्ति अभिप्रेत है।
- source_word: συλλαμβάνει
  choice: गर्भ धारण करता है
  rationale: ‘सात बुराइयों की जननी’ के साथ गर्भधारण और जन्म का रूपक स्पष्ट रूप से बनाए रखा गया है।
- source_word: φθόνος
  choice: ईर्ष्या
  rationale: दूसरे की भलाई से जलनेवाली नैतिक बुराई के लिए यह आधुनिक हिन्दी का सटीक शब्द है।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: शब्द के प्रबल, विनाशकारी अर्थ को किसी विशेष परवर्ती धर्मवैज्ञानिक तकनीकी अर्थ के बिना रखा गया है।
- source_word: θλῖψις
  choice: पीड़ा
  rationale: सूची में यह कष्ट और दबाव से उत्पन्न दुःख को दर्शाता है; ‘पीड़ा’ स्पष्ट और स्वाभाविक है।
- source_word: θεηλασία / αἰχμαλωσία
  choice: बंदीपन
  rationale: मुद्रित शब्द संदिग्ध है; समानान्तर पाठ-रूपों में ‘αἰχμαλωσία’ अर्थात् बंदी अवस्था का मजबूत समर्थन मिलता है। अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: ἔνδεια
  choice: अभाव
  rationale: कमी, दरिद्रता या आवश्यक वस्तुओं के न होने का व्यापक अर्थ बनाए रखता है।
- source_word: ταραχή
  choice: उथल-पुथल
  rationale: अव्यवस्था और व्याकुलता, दोनों का भाव सामान्य आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἐρήμωσις / ἐρημοῦται
  choice: उजाड़ / उजाड़ दिया जाता है
  rationale: संज्ञा और क्रिया के आपसी सम्बन्ध को हिन्दी में भी सुरक्षित रखा गया है।
- source_word: μισαδελφία
  choice: भाई से घृणा
  rationale: दुर्लभ संयुक्त शब्द का सीधा अर्थ रखा गया है; इसे सामान्य ‘द्वेष’ बनाकर कैन-हाबिल प्रसंग से उसका सम्बन्ध नहीं मिटाया गया।
theological_decisions:
- issue: बेलियार की भूमिका और मानवीय मन में बुराई का गर्भधारण
  choice: पाठ के जननी–गर्भधारण रूपक को स्पष्ट रूप से बनाए रखा गया।
  alternative: इसे केवल ‘मन में बुरे विचार आते हैं’ कहकर सामान्य बनाना।
  rationale: यूनानी पाठ तलवार को जननी और मन को गर्भ धारण करनेवाला बताता है। इस तनावपूर्ण मिश्रित रूपक को सुधारकर सपाट नहीं किया जाना चाहिए।
- issue: कैन के सात प्रतिशोध और कालक्रम
  choice: सात प्रतिशोध, हर सौवें वर्ष की विपत्ति, दो सौ वर्ष का दुःख और नौ सौवें वर्ष का उजाड़—सभी संख्याएँ यथावत रखी गईं।
  alternative: उत्पत्ति की कालगणना से सामंजस्य बैठाने के लिए संख्याओं को बदलना या अस्पष्ट करना।
  rationale: पाठ का कालक्रम कठिन और आन्तरिक रूप से तनावपूर्ण है, पर अनुवादक को उसे चुपचाप सामान्यीकृत नहीं करना चाहिए।
- issue: कैन और लेमेक के दण्ड का सम्बन्ध
  choice: कैन को ‘इन सभी बुराइयों’ से और लेमेक को ‘सत्तर गुना सात’ से दण्डित बताया गया।
  alternative: लेमेक के वाक्यांश में कोई व्याख्यात्मक संज्ञा, जैसे ‘प्रतिशोध’, जोड़ना।
  rationale: यूनानी वाक्य संक्षिप्त है और लेमेक के लिए माप तो देता है, पर संज्ञा को स्पष्ट नहीं दोहराता; हिन्दी में भी यह संक्षिप्तता और अस्पष्टता रखी गई।
- issue: अन्तिम न्याय का कथन
  choice: κρίσει को साधनात्मक अर्थ में ‘न्याय के द्वारा’ रखा गया।
  alternative: ‘न्याय के दिन’ या ‘परमेश्वर के न्याय में’।
  rationale: मूल पाठ न तो किसी विशेष न्याय-दिवस का उल्लेख करता है, न इस पद में कर्ता को स्पष्ट करता है; इसलिए अतिरिक्त धर्मवैज्ञानिक विवरण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बच्चो’, ‘अपनी बात माननेवालों’, ‘उथल-पुथल’ जैसे स्वाभाविक प्रयोगों के साथ मूल के नैतिक उपदेशात्मक स्वर को सुरक्षित रखा गया है। स्रोत में न होने के कारण अंग्रेज़ी परामर्श-पाठ की आरम्भिक पंक्तियाँ—मन को शुद्ध करने और बेलियार के कामों के दोहरे होने की बात—इस अध्याय के अनुवाद में नहीं जोड़ी गईं; इसके विपरीत, उपलब्ध यूनानी स्रोत के पद 4-5 भी पूर्णतः अनूदित किए गए हैं।
