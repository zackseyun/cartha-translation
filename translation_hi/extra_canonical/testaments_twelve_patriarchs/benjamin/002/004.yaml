source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ οὕτως οἱ μέτοχοι αὐτοῦ φοβηθέντες ἐν †ἀνέσει με κατέσχεν†.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/004.yaml
  text: And thus his companions, being afraid, †kept me at ease†.
translation:
  language: hi
  text: और इस प्रकार उसके साथी डर गए और मुझे कुछ ढील देकर रोके रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ विकृत या अत्यंत संदिग्ध है। शब्दशः भाव लगभग ‘ढील/राहत में मुझे पकड़े रखा’ है; कुछ पाठ-परंपराएँ प्रसंग को अलग ढंग से प्रस्तुत करती हैं।
    reason: मूल संस्करण में इस पदांश पर आलोचनात्मक चिह्न हैं, और कर्ता बहुवचन होने पर भी क्रिया एकवचन है। इसलिए ‘कुछ ढील देकर रोके रखा’ केवल एक सावधान, पठनीय प्रस्तुति है, निश्चित पुनर्निर्माण नहीं।
lexical_decisions:
- source_word: οἱ μέτοχοι αὐτοῦ
  choice: उसके साथी
  rationale: μέτοχοι का सामान्य अर्थ ‘सहभागी/साथी’ है; प्रसंग में स्वाभाविक हिन्दी ‘उसके साथी’ है।
- source_word: φοβηθέντες
  choice: डर गए
  rationale: यह aorist participle है; हिन्दी में मुख्य क्रिया से पहले हुई प्रतिक्रिया को सहज ढंग से व्यक्त करता है।
- source_word: ἐν ἀνέσει
  choice: चैन से
  rationale: ἀνάσις/ἄνεσις का भाव राहत, ढील या चैन है; पाठ संदिग्ध होने के कारण अर्थ को अधिक स्पष्ट करके नहीं बाँधा गया।
- source_word: με κατέσχεν
  choice: मुझे … रोके रखा
  rationale: κατέχω का मूल भाव पकड़कर रखना या रोक रखना है। यूनानी में एकवचन क्रिया और बहुवचन कर्ता का असामंजस्य पाठ की विकृति का संकेत है; हिन्दी मुख्य पाठ में स्वाभाविक बहुवचन रखा गया है।
theological_decisions:
- issue: बाद की समीक्षा में ‘इश्माएलियों के हाथ बेच दिया’ वाला पाठ
  choice: दिए गए यूनानी पाठ का अनुवाद किया गया और पाठगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया।
  alternative: उन्होंने मुझे इश्माएलियों के हाथ बेच दिया।
  rationale: दिए गए यूनानी वाक्य में ‘बेचना’ या ‘इश्माएली’ के लिए कोई शब्द नहीं है। इसलिए उस स्पष्टतर वैकल्पिक परंपरा को बिना प्रत्यक्ष पाठ-साक्ष्य के मुख्य पाठ में रखना उचित नहीं होगा।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। जानबूझकर कुछ असामान्य लगने वाला ‘चैन से रोके रखा’ रखा गया है, क्योंकि यूनानी पदांश स्वयं संदिग्ध है; पादटिप्पणी उस कठिनाई को स्पष्ट करती है।
