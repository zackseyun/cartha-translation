  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔννοιαι
  choice: विचार
  rationale: यहाँ मन के विचारों या धारणाओं के लिए स्वाभाविक और अर्थानुकूल हिन्दी शब्द।
- source_word: οἱ λόγοι οὗτοι
  choice: ये बातें
  rationale: संदर्भ में λόγοι कथित वचनों/बातों को सूचित करता है; आधुनिक हिन्दी में ‘ये बातें’ अधिक सहज है।
- source_word: καρδίαν
  choice: हृदय
  rationale: यूनानी रूपक को बनाए रखता है, जिसमें हृदय भीतरी चेतना और भावों का केंद्र है।
theological_decisions:
- issue: आज्ञार्थक क्रियाओं का बल
  choice: ‘हों’ और ‘न आएँ’ द्वारा इच्छासूचक/आज्ञार्थक भाव सुरक्षित रखा गया।
  alternative: ‘रखो’ और ‘मत पहुँचने दो’ जैसा प्रत्यक्ष आदेश
  rationale: γένωνται और μὴ ἔλθωσιν तीसरे पुरुष के आज्ञार्थक रूप हैं; हिन्दी में ‘हों’ और ‘न आएँ’ उनके रूप और हल्के इच्छासूचक तनाव को बेहतर बनाए रखते हैं।
