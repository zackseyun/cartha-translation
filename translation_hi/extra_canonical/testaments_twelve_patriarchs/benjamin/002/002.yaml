  text: और उसने मुझसे कहा, “हाँ, भाई। और जब उन्होंने मेरा कुरता उतार लिया, तब उन्होंने मुझे इश्माएलियों को सौंप दिया; और उन्होंने मुझे एक लंगोटी दी और कोड़े मारने के बाद मुझसे दौड़ने को कहा।”
