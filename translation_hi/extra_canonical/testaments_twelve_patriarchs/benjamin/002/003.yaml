  text: And one of them, while he was striking me with a rod, was met by a lion, and the lion killed him.
translation:
  language: hi
  text: और उनमें से एक मुझे छड़ी से पीट रहा था कि एक सिंह उसके सामने आ गया और उसे मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδῳ
  choice: छड़ी से
  rationale: यह दंड या छड़ी जैसे प्रहार के साधन को दर्शाता है; प्रसंग में सरल और स्वाभाविक हिन्दी है।
- source_word: μαστίζων
  choice: मार रहा था
  rationale: क्रिया लगातार प्रहार करने का भाव देती है। ‘कोड़े लगा रहा था’ ῥάβδος के साथ अनावश्यक रूप से अलग साधन का संकेत दे सकता था।
- source_word: ὑπήντησεν αὐτῷ
  choice: उसके सामने आ गया
  rationale: यूनानी में सिंह के उससे मिलने या उसका सामना करने का भाव है; यह हिन्दी में घटना की आकस्मिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνεῖλεν
  choice: मार डाला
  rationale: यहाँ क्रिया स्पष्ट रूप से प्राण लेने के अर्थ में है।
