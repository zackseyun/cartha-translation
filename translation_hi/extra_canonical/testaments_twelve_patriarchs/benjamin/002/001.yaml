base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/001.yaml
  text: And when I went into Egypt, my brother recognized me and said to me, “They smeared your tunic with blood,” they said. “See whether this is the tunic.”
translation:
  language: hi
  text: और जब मैं मिस्र गया, तो मेरे भाई ने मुझे पहचान लिया और मुझसे कहा, “उन्होंने तुम्हारे अंगरखे को लहू में सान दिया,” उन्होंने कहा।[a] “पहचानो कि क्या यह वही अंगरखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ग्रीक में “उन्होंने कहा” इसी स्थान पर आता है और कथन का क्रम कुछ असामान्य तथा अस्पष्ट है।
    reason: मूल की आकस्मिक उद्धरण-रचना को सहज बनाकर छिपाने के बजाय पाठक को उसकी वास्तविक अस्पष्टता से अवगत कराना।
lexical_decisions:
- source_word: ἐγνώρισέν με
  choice: मुझे पहचान लिया
  rationale: क्रिया का सीधा अर्थ यहाँ ‘मुझे पहचान लिया’ है; कर्मवाचक सर्वनाम με को स्पष्ट रूप से रखा गया है।
- source_word: χιτών
  choice: अंगरखा
  rationale: यह शरीर पर पहने जाने वाले वस्त्र के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: ἔφυραν ... αἵματι
  choice: लहू से सना था
  rationale: ग्रीक क्रिया वस्त्र को रक्त से दागने या लिप्त करने का भाव देती है; ‘सना’ हिन्दी में इस दृश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἐπίγνωθι
  choice: पहचानो
  rationale: आज्ञार्थक क्रिया यहाँ वस्त्र को देखकर उसकी पहचान निश्चित करने का आग्रह करती है।
- source_word: ὃ χιτὼν οὗτος
  choice: क्या यह वही अंगरखा है
  rationale: ग्रीक वाक्यांश असामान्य है, पर आशय किसी विशिष्ट अंगरखे की पहचान पूछना है; ‘वही’ निश्चित पद के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भाई की पहचान
  choice: मेरे भाई
  alternative: मेरा भाई यूसुफ
  rationale: ग्रीक केवल ὁ ἀδελφός μου कहता है; नाम जोड़ने से बचते हुए स्रोत की अभिव्यक्ति रखी गई है।
- issue: अंगरखे के स्वामी की पहचान
  choice: यह वही अंगरखा
  alternative: यह तुम्हारे पुत्र का अंगरखा
  rationale: ग्रीक में ‘तुम्हारे पुत्र का’ नहीं है। उत्पत्ति की समानांतर कथा के आधार पर उसे जोड़ना इस पाठ की वास्तविक शब्दावली को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। ऐतिहासिक वर्तमान λέγει को स्वाभाविक हिन्दी भूतकाल ‘कहा’ से व्यक्त किया गया है, जबकि एकवचन ‘मैं मिस्र आया’ और केवल ‘मेरे भाई’ जैसी स्रोतगत विशेषताएँ सुरक्षित रखी गई हैं।
