  text: Do not tell my father what you did to me, but speak in this way, just as I explained to Benjamin.
translation:
  language: hi
  text: “तुमने मेरे साथ जो किया, वह मेरे पिता को मत बताना; बल्कि ठीक वैसे ही कहना, जैसा मैंने बिन्यामीन को समझाया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ λέγετε
  choice: मत बताना
  rationale: निषेधात्मक आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; बहुवचन संबोधन का पृथक चिह्न हिन्दी क्रिया में आवश्यक नहीं है।
- source_word: ἃ ἐποιήσατέ μοι
  choice: तुमने मेरे साथ जो किया
  rationale: ग्रीक के संबंधवाचक वाक्यांश और μοι के पीड़ित/प्रभावित व्यक्ति वाले भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀλλʼ οὕτως λέξατε
  choice: बल्कि ठीक वैसे ही कहना
  rationale: ἀλλά के विरोध और οὕτως के ढंग-सूचक बल को स्पष्ट तथा स्वाभाविक रूप देता है।
- source_word: καθὼς ἐξηγησάμην τῷ Βενιαμίν
  choice: जैसा मैंने बिन्यामीन को समझाया था
  rationale: ἐξηγέομαι के ‘समझाना/विस्तार से बताना’ भाव को बिना किसी अनुल्लिखित कर्म-सर्वनाम को जोड़े व्यक्त करता है।
