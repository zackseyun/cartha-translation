translation:
  language: hi
  text: और ये बातें कहते हुए उन्होंने स्वयं झूठ नहीं बोला; क्योंकि वह मुझसे हमारे भाइयों के काम छिपाना चाहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐψεύσαντο αὐτοὶ
  choice: उन्होंने स्वयं झूठ नहीं बोला
  rationale: बहुवचन क्रिया और बलसूचक αὐτοὶ—दोनों को स्पष्ट रखा गया है; विषय को यूसुफ मानकर एकवचन नहीं किया गया।
- source_word: ταῦτα λέγοντες
  choice: ये बातें कहते हुए
  rationale: ग्रीक वर्तमान कृदंत का स्वाभाविक हिन्दी रूप, जो कथन और झूठ न बोलने की क्रिया का संबंध बनाए रखता है।
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: हमारे भाइयों के काम
  rationale: ἔργα का अपेक्षाकृत तटस्थ और व्यापक अर्थ रखा गया है; संदर्भ के आधार पर इसे पहले ही ‘करतूतें’ जैसे नकारात्मक शब्द से सीमित नहीं किया गया।
theological_decisions:
- issue: बहुवचन ‘उन्होंने’ और एकवचन ‘वह’ के संकेतित व्यक्तियों की पहचान
  choice: सर्वनामों की संख्या और अस्पष्ट पहचान को ग्रीक के अनुसार बनाए रखा गया
  alternative: नाम जोड़कर ‘यूसुफ’ या भाइयों की पहचान स्पष्ट करना
  rationale: मूल पाठ बहुवचन αὐτοὶ और एकवचन ἤθελεν का प्रयोग करता है, पर इस पद में उनके व्यक्तियों के नाम नहीं देता; अनुवाद में व्याख्यात्मक पहचान जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘उन्होंने स्वयं’ मूल के बहुवचन और बल दोनों को व्यक्त करता है; अर्धविराम कारणसूचक अगले खंड को स्पष्ट रूप से जोड़ता है।
