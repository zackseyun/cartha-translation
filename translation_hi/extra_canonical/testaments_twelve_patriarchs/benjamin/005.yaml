  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005.yaml
  text: '1[a]. If, then, you also have a good mind, even wicked people will be at peace with you, and the lawless[b], being put to shame before you, will turn back to what is good; and those who are greedy will not only withdraw from their passion, but will also give to those in distress the things of greed that they had possessed.


    2. If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.


    3. For where there is the fear of good works and light in the mind, darkness flees away from it.


    4. For if anyone does violence to a holy man, he changes his mind; for the holy one has mercy on those who revile him and keeps silent.


    5. And if anyone betrays a righteous soul and insults a righteous soul, the righteous man prays; and even if for a little while he is brought low, before long he appears far more radiant[e][d][c], as Joseph my brother also became.'
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 5**


    **1.** इसलिए यदि तुम भी भला मन रखोगे, तो दुष्ट लोग भी तुम्हारे साथ शांति से रहेंगे। उच्छृंखल लोग[a] तुम्हारे सामने लज्जित होकर भलाई की ओर लौटेंगे; और लोभी लोग न केवल अपनी लालसा से दूर हो जाएँगे, बल्कि लोभ की वे वस्तुएँ भी, जो उनके पास थीं,[b] संकट में पड़े लोगों को दे देंगे।


    **2.** यदि तुम भलाई करते रहोगे, तो अशुद्ध आत्माएँ भी तुम्हारे पास से भाग जाएँगी, और जंगली पशु तुमसे डरेंगे।


    **3.** क्योंकि जहाँ भले कामों का भय[c] और मन में प्रकाश होता है, वहाँ अंधकार उससे दूर भाग जाता है।


    **4.** क्योंकि यदि कोई किसी पवित्र मनुष्य का घोर अपमान करे, तो वह अपना मन बदलता है;[d] क्योंकि वह पवित्र जन अपने निंदकों पर दया करता और चुप रहता है।


    **5.** और यदि कोई किसी धर्मी के साथ विश्वासघात करे, तो वह धर्मी प्रार्थना करता है। भले ही उसे थोड़े समय के लिए दीन किया जाए, फिर भी कुछ ही समय बाद वह पहले से कहीं अधिक तेजस्वी दिखाई देता है—जैसा मेरा भाई यूसुफ हुआ था।[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उच्छृंखल लोग’ के लिए यूनानी शब्द का अर्थ ‘असंयमी,’ ‘अपव्ययी’ या ‘लापरवाह लोग’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “लोभ की वे वस्तुएँ जो उनके पास थीं”; संभव अर्थ है, “लोभ से कमाई हुई वस्तुएँ।”
    reason: lexical_alternative
  - marker: c
    text: “भले कामों का भय” एक कठिन पद है। इसका अर्थ भले कामों से जुड़ी श्रद्धा या भलाई के जीवन से उत्पन्न भय भी हो सकता है।
    reason: alternative_reading
  - marker: d
    text: “अपना मन बदलता है” का अनुवाद “पश्चाताप करता है” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: e
    text: यूसुफ कुछ समय तक दीन किया गया, पर बाद में उसका सम्मान और गौरव प्रकट हुआ। देखें उत्पत्ति 37; 39–45।
    reason: cross_reference
lexical_decisions:
- source_word: διάνοιαν
  choice: मन
  rationale: यहाँ शब्द आंतरिक नैतिक प्रवृत्ति और सोच, दोनों को व्यक्त करता है। ‘भला मन’ सरल है और इस दोहरे अर्थ को खुला रखता है।
- source_word: ἄσωτοι
  choice: उच्छृंखल लोग
  rationale: यह शब्द अपव्ययी, असंयमी या नैतिक रूप से बेलगाम लोगों को सूचित कर सकता है। ‘उच्छृंखल’ प्रसंग में नैतिक अव्यवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰρηνεύσουσιν μεθʼ ὑμῶν
  choice: तुम्हारे साथ शांति से रहेंगे
  rationale: यह अनुवाद संबंधपरक अर्थ को स्पष्ट करते हुए भविष्यकाल को बनाए रखता है।
- source_word: τοῦ πάθους
  choice: अपनी लालसा
  rationale: यहाँ πάθος लोभ को चलाने वाली भीतरी प्रबल इच्छा या विकार है; ‘लालसा’ प्रसंगानुकूल और सहज है।
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: लोभ से मिली वे वस्तुएँ भी, जो उनके पास थीं
  rationale: ग्रीक की संक्षिप्त अभिव्यक्ति को समझने योग्य बनाया गया है, पर वस्तुओं के प्राप्त होने की ठीक रीति को निर्णायक रूप से नहीं बाँधा गया।
- source_word: θλιβομένοις
  choice: संकट में पड़े लोगों
  rationale: यह दबाव, पीड़ा या क्लेश झेल रहे लोगों के लिए व्यापक और स्वाभाविक हिन्दी है।
- source_word: ἀκάθαρτα πνεύματα
  choice: अशुद्ध आत्माएँ
  rationale: यह नैतिक या आध्यात्मिक अशुद्धता वाले आत्मिक प्राणियों के लिए प्रचलित और स्पष्ट पद है।
- source_word: φόβος ἀγαθῶν ἔργων
  choice: भले कामों का भय
  rationale: ग्रीक पद कठिन और संबंध की दृष्टि से अस्पष्ट है। मुख्य पाठ में निकट अनुवाद रखकर संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ὑβρίσει
  choice: घोर अपमान करे
  rationale: क्रिया उद्दंड और गंभीर दुर्व्यवहार या अपमान का बोध करा सकती है। यह केवल साधारण गाली से अधिक तीव्रता व्यक्त करती है, पर अनिवार्य रूप से शारीरिक हिंसा नहीं मानती।
- source_word: μετανοεῖ
  choice: अपना मन बदलता है
  rationale: इस प्रसंग में पवित्र जन की दयालु चुप्पी के सामने अपमान करने वाले के रवैये में परिवर्तन मुख्य है; ‘पश्चाताप करता है’ भी संभव है।
- source_word: δίκαιον προδώσει
  choice: किसी धर्मी को विश्वासघात करके पकड़वा दे
  rationale: προδίδω विश्वासघात करने या किसी को शत्रुओं के हाथ सौंपने का अर्थ दे सकता है। यह अनुवाद दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: φαιδρότερος
  choice: पहले से कहीं अधिक तेजस्वी
  rationale: शब्द उज्ज्वल, आनंदित या गौरवशाली दिखाई देने का अर्थ दे सकता है। यूसुफ के उदाहरण में ‘तेजस्वी’ पुनः प्रतिष्ठा और प्रकट महिमा दोनों के लिए उपयुक्त है।
theological_decisions:
- issue: पद 3 में φόβος ἀγαθῶν ἔργων का संबंध
  choice: भले कामों का भय
  alternative: भले कामों के प्रति श्रद्धा; भले कामों से उत्पन्न भय
  rationale: ग्रीक संबंध अस्पष्ट है। मुख्य पाठ इसे निकट रूप में सुरक्षित रखता है और व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
- issue: पद 4 में μετανοεῖ का अर्थ
  choice: अपना मन बदलता है
  alternative: पश्चाताप करता है
  rationale: यहाँ तत्काल प्रसंग अपराधी की मनोवृत्ति के पलटने पर केंद्रित है। चुना गया अनुवाद धार्मिक पश्चाताप की संभावना को नकारे बिना मूल क्रिया का संज्ञानात्मक अर्थ बनाए रखता है।
- issue: पद 5 में धर्मी की प्रतिक्रिया
  choice: वह धर्मी प्रार्थना करता है
  alternative: वह धर्मी बदला नहीं लेता, बल्कि प्रार्थना करता है
  rationale: मुख्य पाठ केवल वही कहता है जो ग्रीक में स्पष्ट है; बदला न लेने का विचार प्रसंग से अनुमानित हो सकता है, पर उसे पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण उपदेशात्मक शैली रखी गई है। लंबे यूनानी वाक्यों को पठनीय हिन्दी वाक्यों में बाँटा गया है, जबकि कारणसूचक संबंध, नैतिक विरोध और कठिन पदों की वास्तविक अस्पष्टता सुरक्षित रखी गई है। पद 5 में अंग्रेज़ी परामर्श-पाठ का अतिरिक्त ‘धर्मी का अपमान करता है’ वाक्यांश नहीं लिया गया, क्योंकि प्रदत्त यूनानी स्रोत में वह उपस्थित नहीं है।
