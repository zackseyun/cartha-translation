  source_fidelity: 'पद 5 में ‘विश्वासघात करके पकड़वा दे’ यूनानी προδώσει से अधिक विशिष्ट है: मूल केवल धर्मी व्यक्ति के साथ विश्वासघात करने की बात कहता है, उसे पकड़वाने की नहीं। पद 1 में ‘लोभ से मिली’ वस्तुओं के प्राप्त होने का तरीका निश्चित कर देता है, जबकि τὰ τῆς πλεονεξίας ἃ εἶχον अधिक संक्षिप्त और खुला है। संशोधन इन दोनों स्थानों पर मूल की अस्पष्टता बनाए रखता है।'
  naturalness: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘लोभ की वे वस्तुएँ जो उनके पास थीं’ थोड़ा निकट अनुवाद है, फिर भी स्पष्ट और स्वाभाविक है।
  terminology: ‘भला मन,’ ‘उच्छृंखल,’ ‘अशुद्ध आत्माएँ,’ ‘भले कामों का भय,’ ‘अपना मन बदलता है,’ और ‘धर्मी’ स्रोत और स्थापित निर्णयों के अनुरूप हैं। पादटिप्पणियाँ अपने चिह्नों से सही स्थानों पर जुड़ी हैं।
  issues:
