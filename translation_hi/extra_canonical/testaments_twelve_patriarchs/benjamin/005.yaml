    issue: पद 5 में ‘पकड़वा दे’
    rationale: προδώσει का अर्थ विश्वासघात करना/धोखा देना है; प्रदत्त यूनानी पाठ किसी को पकड़वाने या अधिकारियों के हवाले करने का उल्लेख नहीं करता।
  - severity: low
    issue: पद 1 में ‘लोभ से मिली वे वस्तुएँ’
    rationale: यह वाक्यांश वस्तुओं के लोभ द्वारा अर्जित होने को मुख्य पाठ में निश्चित करता है। यूनानी ‘लोभ की वे वस्तुएँ जो उनके पास थीं’ के संबंध को खुला रखता है।
  revised_text: '**बिन्यामीन का वसीयतनामा 5**


    **1.** इसलिए यदि तुम भी भला मन रखोगे, तो दुष्ट लोग भी तुम्हारे साथ शांति से रहेंगे। उच्छृंखल लोग[a] तुम्हारे सामने लज्जित होकर भलाई की ओर लौटेंगे; और लोभी लोग न केवल अपनी लालसा से दूर हो जाएँगे, बल्कि लोभ की वे वस्तुएँ भी, जो उनके पास थीं,[b] संकट में पड़े लोगों को दे देंगे।


    **2.** यदि तुम भलाई करते रहोगे, तो अशुद्ध आत्माएँ भी तुम्हारे पास से भाग जाएँगी, और जंगली पशु तुमसे डरेंगे।


    **3.** क्योंकि जहाँ भले कामों का भय[c] और मन में प्रकाश होता है, वहाँ अंधकार उससे दूर भाग जाता है।


    **4.** क्योंकि यदि कोई किसी पवित्र मनुष्य का घोर अपमान करे, तो वह अपना मन बदलता है;[d] क्योंकि वह पवित्र जन अपने निंदकों पर दया करता और चुप रहता है।


    **5.** और यदि कोई किसी धर्मी के साथ विश्वासघात करे, तो वह धर्मी प्रार्थना करता है। भले ही उसे थोड़े समय के लिए दीन किया जाए, फिर भी कुछ ही समय बाद वह पहले से कहीं अधिक तेजस्वी दिखाई देता है—जैसा मेरा भाई यूसुफ हुआ था।[e]'
