  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008.yaml
  text: '1[a]. Therefore, if you also walk in holiness according to the Lord’s commands, you will dwell with me in safety, and all Israel will be gathered to the Lord.


    2. And I will no longer be called a ravening wolf because of your ravaging, but a worker of the Lord, distributing food to those who do what is good.


    3. And there will arise in the latter times one beloved of the Lord, from the tribe of Judah and Levi, who will accomplish the good pleasure of God with a new understanding for all the nations.


    4. His presence is in the mouth of all, and he will be chosen forever by the Lord, and through him the knowledge of the Lord will be given on the earth in portions of joy; and through him Israel will be enlightened.


    5. Then he will enter into the first temple, and there the Lord will be abused, and he will be lifted up upon a tree.


    6[b]. And the veil of the temple will be torn, and the Spirit of God will pass on to the nations like fire poured out.


    7. And he will ascend from Hades and will pass from earth into heaven.


    8. And I know how lowly he will be on earth, and how glorious in heaven.


    9. Now when Joseph was in Egypt, I longed to see his figure and appearance; and through the prayers of Jacob my father I saw him, while awake, that a spotless and holy virgin was giving birth to a lamb,


    10. and on its left side there was as it were a lion; and all the beasts rushed against him, and the lamb overcame them and destroyed them, and trampled them underfoot.


    11. And because of him the angels and men rejoiced, and all the land.


    12. These things will happen in their proper times. Therefore, my children, when you see that all these things have happened in Israel, know that the kingdom of the Lord is near.


    13. Then flee from every lawless deed and from the works of Beliar, and cling to what is good and to the law of the Lord.


    14. And bury me near my fathers.


    15. And he finished his commands, and said, “I am going to sleep with my fathers.”


    16. And he stretched out his feet and died in a beautiful and good old age.


    17. And each of his sons did as he had commanded them, and they put him in a coffin and kept him in Egypt until the day of the exodus.


    18. And when the sons of Israel went up from Egypt, they carried up the bones of Benjamin also[c], and buried them in Hebron at the right side of Abraham and Isaac and Jacob.'
translation:
  language: hi
  text: '**बिन्यामीन का वसीयतनामा 8**


    **1.** परन्तु हे मेरे बच्चों, दुष्टता, ईर्ष्या और भाई-बन्धुओं से घृणा से दूर भागो; और भलाई तथा प्रेम से दृढ़ता से जुड़े रहो।


    **2.** क्योंकि शुद्ध मन गोबर और कीचड़ के संपर्क में आकर अशुद्ध नहीं होता; बल्कि उन दोनों को ठंडा करता है और दुर्गन्ध को दूर भगा देता है। इसी प्रकार शुद्ध मन भी पृथ्वी की अशुद्धताओं से घिरा हुआ निर्माण का कार्य करता है[a], पर स्वयं अशुद्ध नहीं होता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ कठिन है। क्रिया का सामान्य शाब्दिक अर्थ “निर्माण करता है” या “निर्माण/उन्नति का कार्य करता है” है, पर उसका कर्म व्यक्त नहीं है; मुद्रित यूनानी संस्करण ने इस शब्द पर पाठ-संदेह का चिह्न लगाया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀπόδρατε
  choice: दूर भागो
  rationale: क्रिया में केवल बचने नहीं, तत्काल और दृढ़तापूर्वक भाग निकलने का भाव है।
- source_word: μισαδελφίαν
  choice: भाई से घृणा करना
  rationale: यह संयुक्त शब्द अपने भाई अथवा बंधु के प्रति घृणा को व्यक्त करता है; हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक और स्पष्ट है।
- source_word: προσκολλᾶσθε
  choice: लिपटे रहो
  rationale: यह दृढ़ता से जुड़ जाने और जुड़े रहने का सशक्त रूपक सुरक्षित रखता है।
- source_word: καθαρὸς νοῦς
  choice: शुद्ध मन
  rationale: νοῦς में मन, समझ और नैतिक वृत्ति के भाव सम्मिलित हैं; यहाँ उपदेशात्मक प्रसंग में 'शुद्ध मन' स्वाभाविक है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: κόπρου καὶ βόρβορον
  choice: गोबर और कीचड़
  rationale: दोनों ठोस और अप्रिय चित्रों को सरल, प्रत्यक्ष हिन्दी में सुरक्षित रखा गया है।
- source_word: ψύγει
  choice: ठंडा करता
  rationale: प्राप्त यूनानी पाठ का सामान्य शाब्दिक अर्थ यही है, यद्यपि प्रसंग में कथन कठिन है; अनुमान से इसे 'शुद्ध करता' नहीं बनाया गया।
- source_word: συνεχόμενος
  choice: से घिरा रहकर
  rationale: यह आसपास से दबे या घेरे हुए होने का भाव देता है और वाक्य में स्वाभाविक हिन्दी बनाता है।
- source_word: οἰκοδομεῖ
  choice: उन्नत करता है
  rationale: शाब्दिक 'निर्माण करता है' यहाँ अस्वाभाविक है; 'उन्नत करता है' रूपकगत सकारात्मक क्रिया को रखता है, जबकि पाठगत कठिनाई पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: अशुद्ध परिवेश में शुद्ध मन की नैतिक अक्षुण्णता
  choice: मन को अशुद्धताओं से घिरा हुआ, फिर भी स्वयं अशुद्ध न होने वाला बताया गया है।
  alternative: इसे अनुष्ठानिक शुद्धता या किसी विशिष्ट धार्मिक शुद्धि-सिद्धान्त के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ नैतिक उपदेश और रूपक प्रस्तुत करता है; अनुवाद किसी अतिरिक्त सांप्रदायिक या अनुष्ठानिक अर्थ को आरोपित नहीं करता।
- issue: कठिन क्रियाओं ψύγει और οἰκοδομεῖ का अर्थ
  choice: प्राप्त पाठ के कठिन और तनावपूर्ण अर्थ को मुख्य पाठ तथा पादटिप्पणी में बनाए रखा गया है।
  alternative: प्रसंग के आधार पर दोनों को अनुमानतः 'शुद्ध करता है' या 'सुधारता है' लिखना।
  rationale: पाठ स्वयं असामान्य है और οἰκοδομεῖ पर संपादकीय संदेह-चिह्न है; मौन रूप से पाठ-संशोधन करना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक रूप अपनाया गया है। उपलब्ध यूनानी स्रोत में इस खंड के केवल दो पद हैं; इसलिए असंबद्ध अंग्रेज़ी परामर्श-पाठ के अठारह पदों को आधार नहीं बनाया गया। यूनानी के कठिन या संभवतः विकृत पाठ को सहज बनाने के लिए चुपचाप बदला नहीं गया।
