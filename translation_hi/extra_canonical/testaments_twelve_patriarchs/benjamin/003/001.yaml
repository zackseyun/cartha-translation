source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: III. *Νῦν οὖν, τέκνα μου, καὶ ὑμεῖς ⸀ἀγαπήσατε¹ Κύριον τὸν Θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς², καὶ³ φυλάξατε⁴ ἐντολὰς αὐτοῦ, *μιμούμενοι τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα ⸀Ἰωσήφ⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/001.yaml
  text: Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph.
translation:
  language: hi
  text: अब इसलिए, मेरे बच्चों, तुम भी प्रभु, स्वर्ग और पृथ्वी के परमेश्वर, से प्रेम करो और उसकी आज्ञाओं का पालन करो; भले और पवित्र मनुष्य यूसुफ का अनुकरण करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: प्रेम करो
  rationale: यूनानी आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यह निरंतरता अथवा तीव्रता जैसी कोई अतिरिक्त धारणा नहीं जोड़ता।
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: उसकी आज्ञाओं का पालन करो
  rationale: φυλάσσω का मूल भाव ‘सुरक्षित रखना/मानना’ है; आज्ञाओं के संदर्भ में ‘पालन करना’ आधुनिक हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: μιμούμενοι
  choice: अनुकरण करो
  rationale: वर्तमान कृदंत मुख्य आज्ञाओं के साथ आचरण का ढंग बताता है; हिन्दी में समानांतर आज्ञार्थक रूप स्पष्ट और प्रवाहपूर्ण है।
- source_word: ἀγαθὸν καὶ ὅσιον
  choice: भले और पवित्र
  rationale: ἀγαθός नैतिक भलाई और ὅσιος धार्मिक/नैतिक पवित्रता व्यक्त करता है; दोनों विशेषणों का भेद बनाए रखा गया है।
- source_word: Ἰωσήφ
  choice: यूसुफ
  rationale: बाइबिलीय हिन्दी में Joseph के लिए प्रचलित नामरूप।
theological_decisions:
- issue: Κύριον τὸν Θεὸν τοῦ οὐρανοῦ καὶ τῆς γῆς का संबंध
  choice: स्वर्ग और पृथ्वी के परमेश्वर, प्रभु
  alternative: प्रभु, स्वर्ग और पृथ्वी के परमेश्वर
  rationale: दोनों पद एक ही सत्ता को सूचित करते हैं। चुना हुआ क्रम हिन्दी में स्वाभाविक रहते हुए ‘प्रभु’ और ‘परमेश्वर’ दोनों उपाधियों को स्पष्ट रूप से सुरक्षित रखता है।
- issue: यूसुफ के अनुकरण का आशय
  choice: भले और पवित्र मनुष्य यूसुफ का अनुकरण करो
  alternative: यूसुफ की भलाई और पवित्रता का अनुकरण करो
  rationale: मूल पाठ सीधे व्यक्ति यूसुफ के अनुकरण की बात करता है; इसे केवल उसके गुणों तक सीमित करना अर्थ की व्याख्यात्मक संकीर्णता होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आज्ञार्थक शैली। ‘मेरे बच्चो’ संबोधन सामान्य पाठक के लिए स्वाभाविक है; संस्कृतनिष्ठ ‘संतानो’ से बचा गया है। मूल यूनानी के कारणसूचक संक्रमण ‘इसलिए अब’ तथा सभी प्रमुख उपाधियाँ और नैतिक विशेषण बनाए गए हैं।
