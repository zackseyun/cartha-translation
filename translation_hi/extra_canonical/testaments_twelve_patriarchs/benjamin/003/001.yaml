  to: अब इसलिए, मेरे बच्चों, तुम भी प्रभु, स्वर्ग और पृथ्वी के परमेश्वर, से प्रेम करो और उसकी आज्ञाओं का पालन करो; भले और पवित्र मनुष्य यूसुफ का अनुकरण करो।
