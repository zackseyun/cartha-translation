id: T12P.BEN.3.5
reference: Testament of Benjamin 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀπὸ²⁴ ἐπιβουλῆς ἀνθρώπων ἢ θηρίων οὐ δύναται κυριευθῆναι²⁸, βοηθούμενος *†ζῆν ἀπ᾽ αὐτῆς† ὑπὸ τῆς ἀγάπης²⁹ ἧς³⁰ ἔχει πρὸς τὸν πλησίον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/005.yaml
  text: And he cannot be mastered by the plots of men or of beasts, being helped †to live from it† by the love which he has toward his neighbor.
translation:
  language: hi
  text: और वह मनुष्यों या पशुओं के षड्यंत्रों के वश में नहीं आ सकता; अपने पड़ोसी के प्रति उसके प्रेम से उसे †उससे जीवित रहने में† सहायता मिलती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उससे जीवित रहने में” वाला यूनानी वाक्यांश पाठगत रूप से संदिग्ध है; उसका ठीक अर्थ अनिश्चित है।
    reason: स्रोत संस्करण में ζῆν ἀπ᾽ αὐτῆς को क्रक्स चिह्नों से चिह्नित किया गया है। अनुवाद संभावित शब्दार्थ को रखता है, पर अनिश्चित पाठ को निश्चित अर्थ में नहीं बदलता।
lexical_decisions:
- source_word: ἐπιβουλῆς
  choice: षड्यंत्र
  rationale: यह शब्द किसी के विरुद्ध रची गई घात या साज़िश को व्यक्त करता है; ‘षड्यंत्र’ प्रसंग में स्वाभाविक और सटीक है।
- source_word: κυριευθῆναι
  choice: वश में नहीं आ सकता
  rationale: निष्क्रिय क्रिया का अर्थ किसी के प्रभुत्व या नियंत्रण में आ जाना है; यह हिन्दी अभिव्यक्ति अर्थ और वाच्य दोनों को सहज रूप में रखती है।
- source_word: βοηθούμενος … ὑπὸ τῆς ἀγάπης
  choice: प्रेम से सहायता पाकर
  rationale: यूनानी पाठ में सहायता देने वाला स्पष्टतः ‘प्रेम’ है, ‘प्रभु’ नहीं; इसलिए स्रोत में अनुपस्थित कर्ता नहीं जोड़ा गया।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: यह निकटवर्ती दूसरे व्यक्ति के लिए प्रचलित बाइबलीय और सामान्य हिन्दी शब्द है।
theological_decisions:
- issue: सहायता का कर्ता
  choice: उसका पड़ोसी के प्रति प्रेम उसकी सहायता करता है
  alternative: प्रभु प्रेम के द्वारा उसकी सहायता करता है
  rationale: मौजूदा यूनानी पाठ में ὑπὸ τῆς ἀγάπης है और ‘प्रभु’ के लिए कोई शब्द नहीं है; अतः प्रभु को जोड़ना पाठगत और धर्मवैचारिक विस्तार होता।
- issue: दूषित वाक्यांश ζῆν ἀπ᾽ αὐτῆς
  choice: †उसी से जीवित रहता है†
  alternative: वाक्यांश का अर्थ स्पष्ट करके सहज भावानुवाद करना
  rationale: स्रोत-संपादक ने इस वाक्यांश को दूषित अथवा संदिग्ध चिह्नित किया है। अनिश्चितता को छिपाने के बजाय निकटवर्ती संभावित अर्थ और संकेत-चिह्न बनाए रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य-पाठक-सुलभ शैली रखी गई है। अर्धविराम यूनानी वाक्य की सहभागी संरचना को स्पष्ट करता है। स्रोत की पाठगत अनिश्चितता को †…† और पादटिप्पणी द्वारा सुरक्षित रखा गया है।
