id: T12P.BEN.3.2
reference: Testament of Benjamin 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/002.yaml
  text: And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly.
translation:
  language: hi
  text: और तुम्हारी सोच भलाई की ओर लगी रहे, जैसा कि तुम जानते हो कि मेरी लगी है। क्योंकि जिसकी सोच सही है, वह हर बात को सही ढंग से देखता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάνοια
  choice: मन
  rationale: यहाँ शब्द सोचने की प्रवृत्ति और भीतरी मानसिक रुझान दोनों को व्यक्त करता है; सामान्य हिन्दी में ‘मन’ इसे स्वाभाविक और सुबोध ढंग से पहुँचाता है।
- source_word: εἰς τὸ ἀγαθόν
  choice: भलाई पर
  rationale: यह पदबंध मन के अच्छे और नैतिक रूप से भले विषय की ओर उन्मुख होने का भाव देता है; ‘भलाई पर लगा रहे’ हिन्दी में इस दिशा और स्थिरता को व्यक्त करता है।
- source_word: ὀρθὴν
  choice: सीधा
  rationale: ὀρθός का मूल भाव सीधा, सही या उचित होना है। ‘मन सीधा’ नैतिक और बौद्धिक शुद्धता के बीच मूल पाठ की व्यापकता बनाए रखता है।
- source_word: πάντα βλέπει ὀρθῶς
  choice: सब कुछ सही रीति से देखता है
  rationale: ‘देखता है’ मूल रूपक को सुरक्षित रखता है, जबकि ‘सही रीति से’ दृष्टि या परख के उचित होने का अर्थ देता है।
theological_decisions:
- issue: ‘सीधे मन’ और सही दृष्टि के बीच संबंध
  choice: 'कारणसूचक कथन को ज्यों का त्यों रखा गया: ‘क्योंकि जिसका मन सीधा है, वह सब कुछ सही रीति से देखता है।’'
  alternative: इसे पूर्ण पापरहितता, अचूक निर्णय या किसी विशिष्ट धार्मिक सिद्धांत के रूप में स्पष्ट करना
  rationale: मूल पाठ एक सामान्य नैतिक सूक्ति देता है और उसके दावे की सीमा स्पष्ट नहीं करता; इसलिए उसकी व्यापकता और तनाव को बिना सिद्धान्तगत विस्तार के सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली। ‘मन’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि यूनानी διάνοια की दोनों occurrences का संबंध स्पष्ट रहे।
