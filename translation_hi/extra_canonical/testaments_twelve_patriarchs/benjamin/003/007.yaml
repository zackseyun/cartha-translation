  text: And thus Jacob cried out, “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, he kept kissing him for two hours, saying,
translation:
  language: hi
  text: और याकूब इस प्रकार पुकार उठा, “हे भले पुत्र, तुमने अपने पिता याकूब का हृदय जीत लिया है!” फिर वह उसे गले लगाकर दो घंटे तक बार-बार चूमता रहा और कहता गया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνον χρηστόν
  choice: भले पुत्र
  rationale: τέκνον यहाँ संतान के लिए स्नेहपूर्ण संबोधन है और प्रसंग में पुरुष के लिए ‘पुत्र’ स्वाभाविक है; χρηστόν का नैतिक और स्नेहपूर्ण भाव ‘भले’ से व्यक्त होता है।
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: हृदय जीत लिया है
  rationale: ἐνίκησας का मूल बिंब ‘जीतना/विजय पाना’ है, जबकि σπλάγχνα भीतर की गहरी भावनाओं और स्नेह का केंद्र है। ‘हृदय जीत लिया’ हिन्दी में स्वाभाविक रहते हुए दोनों भावों को समेटता है।
- source_word: κατεφίλει
  choice: बार-बार चूमता रहा
  rationale: क्रिया का अपूर्णकाल और सघन/पुनरावृत्त चुंबन का भाव निरंतरता सहित व्यक्त किया गया है।
- source_word: ἐπὶ δύο ὥρας
  choice: दो घंटे तक
  rationale: अवधि को आधुनिक हिन्दी के स्वाभाविक रूप में व्यक्त करता है।
- source_word: λέγων
  choice: कहता गया
  rationale: यह participle अगले कथन की ओर ले जाते हुए आलिंगन और चुंबन के साथ चलती हुई वाणी को दर्शाता है।
