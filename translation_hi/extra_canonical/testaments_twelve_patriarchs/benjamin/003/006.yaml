source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ γὰρ³¹ *ὁ Ἰωσὴφ ἐδεήθη τοῦ πατρὸς ἡμῶν³², ἵνα προσεύξηται *ὑπὲρ τῶν ἀδελφῶν αὐτοῦ³³· ἵνα μὴ³⁴ λογίσηται *⌈Κύριος⌉ αὐτοῖς³⁵ *ἁμαρτίαν, ὅτι ἐποίησαν πονηρὸν εἰς αὐτόν³⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/006.yaml
  text: For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him.
translation:
  language: hi
  text: क्योंकि यूसुफ ने भी हमारे पिता से विनती की कि वे उसके भाइयों के लिए प्रार्थना करें, ताकि प्रभु उनके लेखे में पाप न गिने, क्योंकि उन्होंने उसके विरुद्ध बुराई की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: विनती की
  rationale: यह क्रिया आग्रहपूर्वक निवेदन करने का भाव रखती है; ‘विनती की’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τοῦ πατρὸς ἡμῶν
  choice: हमारे पिता से
  rationale: यूनानी संबंधकारक यहाँ निवेदन के संबोधन/लक्ष्य को व्यक्त करता है; हिन्दी में ‘से’ स्वाभाविक है।
- source_word: ὑπὲρ τῶν ἀδελφῶν αὐτοῦ
  choice: उसके भाइयों के लिए
  rationale: ὑπέρ का मध्यस्थ प्रार्थना वाला अर्थ ‘के लिए’ से स्पष्ट और सहज रूप में व्यक्त होता है।
- source_word: λογίσηται
  choice: लेखे में ... न गिने
  rationale: λογίζομαι में हिसाब लगाने या दोष आरोपित करने का भाव है; यह वाक्यांश उस लेखांकन-रूपक को सुरक्षित रखता है।
- source_word: ἁμαρτίαν
  choice: पाप
  rationale: धार्मिक और नैतिक दोनों संदर्भों में स्रोत का सीधा मानक हिन्दी समतुल्य।
- source_word: ἐποίησαν πονηρὸν εἰς αὐτόν
  choice: उन्होंने उसके साथ बुराई की थी
  rationale: शाब्दिक अर्थ ‘उसके विरुद्ध बुरा किया’ है; ‘उसके साथ बुराई की’ अधिक स्वाभाविक हिन्दी है और हानि/अन्याय का भाव बनाए रखती है।
theological_decisions:
- issue: क्या प्रभु पाप को क्षमा करते हैं या उसे दोष के रूप में गिनते हैं
  choice: प्रभु उनके लेखे में पाप न गिने
  alternative: प्रभु उनका पाप क्षमा कर दे
  rationale: स्रोत λογίσηται के ‘गिनने/लेखे में रखने’ वाले रूपक का प्रयोग करता है। ‘क्षमा’ निकटार्थी होते हुए भी स्रोत की न्यायिक-लेखांकन भाषा को समय से पहले स्पष्ट कर देती।
- issue: यूसुफ की मध्यस्थता और पिता की प्रार्थना का संबंध
  choice: यूसुफ ने पिता से भाइयों के लिए प्रार्थना करने की विनती की
  alternative: यूसुफ ने स्वयं भाइयों के लिए प्रार्थना की
  rationale: यूनानी पाठ स्पष्ट रूप से यूसुफ को पिता से प्रार्थना कराने का निवेदन करते हुए दिखाता है; भूमिकाओं को अलग रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘हमारे पिता’ ने वसीयतनामा-वक्ता के पारिवारिक दृष्टिकोण को बनाए रखा है। स्रोत की कारणसूचक पुनरावृत्ति Καὶ γὰρ ... ὅτι को ‘क्योंकि ... क्योंकि’ के रूप में रखा गया है; इससे तर्क-संबंध स्पष्ट रहता है, यद्यपि हिन्दी में हल्की पुनरावृत्ति सुनाई देती है।
