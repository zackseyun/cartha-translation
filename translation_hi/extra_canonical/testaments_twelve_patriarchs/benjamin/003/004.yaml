source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/004.yaml
  text: How many men wanted to kill him, and God sheltered him; for the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God.
translation:
  language: hi
  text: कितने ही लोग उसे मार डालना चाहते थे, और परमेश्वर ने उसे अपनी ओट में रखा; क्योंकि जो परमेश्वर का भय मानता और अपने पड़ोसी से प्रेम करता है, वह बेलियार की आत्मा से आहत नहीं हो सकता, क्योंकि वह परमेश्वर के भय से ढका हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πόσοι τῶν ἀνθρώπων
  choice: कितने ही लोग
  rationale: यह विस्मयात्मक भाव और अनिश्चित बड़ी संख्या को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: क्रिया के यहाँ प्रयुक्त स्पष्ट प्राण लेने के अर्थ को साधारण और सटीक हिन्दी में रखता है।
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: अपनी ओट में रखा / अपनी ओट में रखता है
  rationale: मूल के आवरण और संरक्षण—दोनों बिंबों को बनाए रखता है तथा एक ही यूनानी शब्द-मूल की पुनरावृत्ति को हिन्दी में भी दर्शाता है।
- source_word: φοβούμενος τὸν Θεὸν
  choice: परमेश्वर का भय मानता
  rationale: धार्मिक-साहित्यिक प्रयोग में श्रद्धामय भय का परिचित और अर्थपूर्ण हिन्दी रूप है।
- source_word: τὸν πλησίον
  choice: अपने पड़ोसी
  rationale: निकटवर्ती मनुष्य के नैतिक अर्थ को बाइबलीय और आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: πνεύματος τοῦ Βελίαρ
  choice: बेलियार की आत्मा
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण करते हुए πνεῦμα का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: πληγῆναι
  choice: चोट नहीं पहुँचा सकती
  rationale: मूल का शाब्दिक अर्थ 'मारा जाना/आघात पाना' है; यह चयन जानलेवा हमले तक अर्थ को अनावश्यक रूप से सीमित किए बिना आघात का भाव रखता है।
theological_decisions:
- issue: बेलियार की आत्मा द्वारा आघात की असमर्थता
  choice: उसे बेलियार की आत्मा चोट नहीं पहुँचा सकती
  alternative: बेलियार की आत्मा उसे मार नहीं सकती
  rationale: πληγῆναι व्यापक रूप से आघात या चोट खाने को दर्शाता है। अनुवाद यह निरपेक्ष कथन बनाए रखता है और उसे केवल मृत्यु अथवा आत्मिक हानि तक सीमित नहीं करता।
- issue: परमेश्वर के भय की रक्षक भूमिका
  choice: परमेश्वर का भय उसे अपनी ओट में रखता है
  alternative: वह परमेश्वर के भय से ढका हुआ है
  rationale: मूल के वर्तमान कर्मवाचक कृदंत का स्वाभाविक हिन्दी रूप दिया गया है, जबकि भय को संरक्षण के साधन के रूप में प्रस्तुत करने वाला धार्मिक तनाव सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। अर्धविराम मूल वाक्य की कारणात्मक निरंतरता बनाए रखता है। 'ओट' संरक्षण के आवरण-बिंब को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
