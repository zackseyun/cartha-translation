id: T12P.BEN.3.8
reference: Testament of Benjamin 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/008.yaml
  text: “The heavenly prophecy concerning you will be fulfilled, [concerning the lamb of God and savior of the world,] for the blameless one will be handed over by lawless men, and the sinless one will die for the ungodly [in the blood of the covenant, for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants].”
translation:
  language: hi
  text: “तुम्हारे विषय में स्वर्गीय भविष्यवाणी पूरी होगी—[परमेश्वर के मेमने और संसार के उद्धारकर्ता के विषय में]—क्योंकि निर्दोष जन अधर्मियों द्वारा सौंप दिया जाएगा, और निष्पाप जन अधर्मियों के लिए मर जाएगा, [वाचा के लहू में, अन्यजातियों और इस्राएल के उद्धार के लिए, और बेलियार तथा उसके सेवकों के विनाश के लिए]।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πληρωθήσεται
  choice: पूरी होगी
  rationale: भविष्यवाणी के पूर्ण होने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προφητεία οὐράνιος
  choice: स्वर्गीय भविष्यवाणी
  rationale: विशेषण और संज्ञा के मूल संबंध को बनाए रखता है; इसे अनावश्यक रूप से ‘स्वर्ग से आई’ कहकर नहीं खोलता।
- source_word: ἀμνὸς τοῦ Θεοῦ
  choice: परमेश्वर का मेमना
  rationale: धार्मिक बिंब और संबंधवाचक रचना को औपचारिक रूप से सुरक्षित रखता है।
- source_word: σωτὴρ τοῦ κόσμου
  choice: संसार का उद्धारकर्ता
  rationale: σωτήρ के उद्धार-संबंधी अर्थ और κόσμος की व्यापकता को बनाए रखता है।
- source_word: ἄμωμος
  choice: निर्दोष जन
  rationale: दोष या कलंक से रहित व्यक्ति का अर्थ देता है और अगले समानांतर विशेषण से भेद बनाए रखता है।
- source_word: ὑπὸ ἀνόμων παραδοθήσεται
  choice: अधर्मी लोग पकड़वा देंगे
  rationale: παραδίδωμι के सौंपे जाने या पकड़वाए जाने के भाव को हिन्दी में स्वाभाविक रूप से देता है; ἀνόμων को नैतिक-धार्मिक अर्थ में ‘अधर्मी’ रखा गया है।
- source_word: ἀναμάρτητος
  choice: निष्पाप जन
  rationale: पापरहित होने का स्पष्ट अर्थ देता है और ἄμωμος के साथ मूल का काव्यात्मक समानांतर बचाता है।
- source_word: ὑπὲρ ἀσεβῶν
  choice: भक्तिहीनों के लिए
  rationale: ὑπέρ का लाभ अथवा प्रतिनिधिक पक्ष वाला व्यापक ‘के लिए’ अर्थ सुरक्षित रखता है; प्रायश्चित्त की कोई विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: ἐν αἵματι διαθήκης
  choice: वाचा के लहू में
  rationale: ἐν की मूल अस्पष्टता और स्थापित वाचागत अभिव्यक्ति को यथासंभव सीधे रूप में सुरक्षित रखता है।
- source_word: ἐθνῶν
  choice: अन्यजातियों
  rationale: इस्राएल के साथ विरोधी समानांतर में गैर-इस्राएली जातियों का आशय स्पष्ट करता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: नाम को अर्थानुवाद के बजाय प्रचलित ध्वन्यात्मक रूप में रखा गया है।
theological_decisions:
- issue: ὑπὲρ ἀσεβῶν में मृत्यु का संबंध
  choice: भक्तिहीनों के लिए मर जाएगा
  alternative: भक्तिहीनों के स्थान पर मर जाएगा
  rationale: मूल ὑπέρ लाभ, पक्ष या प्रतिनिधित्व की गुंजाइश रखता है; ‘स्थान पर’ कहने से प्रतिस्थापन की एक विशिष्ट व्याख्या अनिवार्य हो जाती।
- issue: ἐν αἵματι διαθήκης का संबंध और साधन
  choice: वाचा के लहू में
  alternative: वाचा के लहू के द्वारा
  rationale: मूल ἐν को केवल साधनवाचक बनाकर उसकी संभावित क्षेत्रगत या अवस्थागत अस्पष्टता समाप्त नहीं की गई।
- issue: कोष्ठकबद्ध अंशों की पाठगत स्थिति
  choice: मुख्य पाठ में वर्ग कोष्ठकों सहित रखा
  alternative: बिना कोष्ठक के निर्बाध मुख्य पाठ
  rationale: दिए गए यूनानी स्रोत में दोनों अंश वर्ग कोष्ठकों में हैं; उनकी पाठालोचनात्मक अनिश्चितता को छिपाना उचित नहीं।
- issue: σωτηρίᾳ का लक्ष्य
  choice: अन्यजातियों और इस्राएल के उद्धार के लिए
  alternative: अन्यजातियों तथा इस्राएल को बचाने के लिए
  rationale: संज्ञात्मक रचना मूल की धार्मिक और साहित्यिक गरिमा बनाए रखती है, जबकि दोनों समूहों को समान रूप से उद्धार का लक्ष्य मानती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध धार्मिक गद्य। यूनानी पाठ के समानांतर पदबंध—‘निर्दोष जन… निष्पाप जन’—सुरक्षित रखे गए हैं। स्रोत में उपस्थित वर्ग कोष्ठक पाठगत अनिश्चितता दिखाने के लिए यथावत रखे गए हैं; कोई फुटनोट आवश्यक नहीं माना गया।
