reference: Testament of Benjamin 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/003.yaml
  text: Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every evil affliction, they will certainly not rule over you, just as they did not over Joseph my brother.
translation:
  language: hi
  text: प्रभु का भय मानो और अपने पड़ोसी से प्रेम रखो। यदि बेलियार[a] की आत्माएँ तुम्हें क्लेश से जुड़ी हर बुराई में धकेल दें, तब भी वे निश्चय ही तुम पर प्रभुता नहीं करेंगी, जैसे वे मेरे भाई यूसुफ पर भी प्रभुता नहीं कर सकीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'बेलियार: यहूदी साहित्य में दुष्टता से जुड़ा एक नाम; यहाँ बेलियार से संबद्ध आत्माओं का उल्लेख है।'
    reason: अपरिचित नाम की संक्षिप्त सांस्कृतिक पहचान देता है, पर आत्माओं और बेलियार के संबंध को मूल से अधिक निश्चित नहीं करता।
lexical_decisions:
- source_word: Φοβεῖσθε Κύριον
  choice: प्रभु का भय मानो
  rationale: आज्ञार्थक भाव और बाइबलीय ‘fear the Lord’ की श्रद्धा तथा जवाबदेही से जुड़ी अर्थ-छाया को बनाए रखता है।
- source_word: τὸν πλησίον
  choice: अपने पड़ोसी
  rationale: निकटवर्ती मनुष्य के अर्थ को सामान्य, सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: बेलियार की आत्माएँ
  rationale: बहुवचन πνεύματα और व्यक्तिवाचक नाम Βελίαρ, दोनों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: εἰς πᾶσαν πονηρίαν θλίψεως
  choice: क्लेश की हर प्रकार की बुराई में
  rationale: यूनानी का संबंध-वाचक, कुछ असहज वाक्यांश जानबूझकर पूरी तरह समतल नहीं किया गया; यह बुराई और क्लेश के बीच मूल संबंध को बनाए रखता है।
- source_word: ἐκστήσωσι ὑμᾶς
  choice: तुम्हें ... धकेल भी दें
  rationale: यहाँ क्रिया के किसी अवस्था या मार्ग से विचलित कर देने अथवा उन्मत्त रूप से ले जाने के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ μὴ κατακυριεύσωσιν ὑμῶν
  choice: तो भी वे निश्चय ही तुम पर प्रभुता नहीं करेंगी
  rationale: οὐ μή के प्रबल निषेध और κατακυριεύω के शासन अथवा वश में करने के अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: बेलियार की आत्माओं की पहचान
  choice: उन्हें बहुवचन आत्मिक सत्ताओं के रूप में अनूदित किया गया और बेलियार को नाम के रूप में रखा गया।
  alternative: ‘बेलियार की दुष्ट शक्तियाँ’ या ‘शैतान की आत्माएँ’ कहना।
  rationale: मूल पाठ न तो इन्हें केवल अमूर्त प्रभाव बनाता है, न बेलियार को सीधे किसी दूसरे नाम से पहचानता है; इसलिए उसकी अस्पष्टता सुरक्षित रखी गई।
- issue: दुष्ट आत्माओं के अधिकार का निषेध
  choice: ‘प्रभुता नहीं करेंगी’ कहा गया।
  alternative: ‘तुम्हें हानि नहीं पहुँचा सकेंगी’ कहना।
  rationale: मूल में हानि से पूर्ण सुरक्षा नहीं, बल्कि उन आत्माओं के प्रभुत्व का प्रबल निषेध है; क्लेश में धकेले जाने की संभावना साथ-साथ बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आज्ञात्मक है। ‘प्रभु का भय मानो’, ‘प्रेम रखो’ और ‘प्रभुता’ जैसे परिचित धार्मिक पद मूल की गंभीरता बनाए रखते हैं; ‘धकेल भी दें—तो भी’ शर्त और प्रबल निषेध को सहज हिन्दी में जोड़ता है।
