    **7:6** तब उसने मुझसे कहा, “तो देखो, तुम मुझसे प्रेम करते हो। मेरे लिए इतना ही बहुत हो: बस मेरे जीवन और मेरे बच्चों की सुध लो; तब मुझे आशा है कि मैं अपनी अभिलाषा भी पूरी कर लूँगी।” **7** पर वह नहीं जानती थी कि मैंने ऐसा अपने प्रभु[a] के कारण कहा था, उसके कारण नहीं। **8** क्योंकि यदि कोई अभिलाषा के आवेग के अधीन हो जाए और उसका दास बन जाए, जैसा वह भी बन गई थी, तो वह कोई अच्छी बात सुनकर भी उसे उसी आवेग के अनुसार समझता है और अपनी बुरी अभिलाषा की ओर मोड़ देता है।


    **8:1** इसलिए, मेरे बच्चो, मैं कहता हूँ कि जब वह मेरे पास से गई, तब लगभग छठा पहर[b] था। मैं उस पूरे दिन और पूरी रात प्रभु के सामने घुटने टेककर रहा। भोर के निकट मैं उठा और रोते हुए उससे छुटकारे की विनती करने लगा। **2** अंत में उसने बलपूर्वक मेरे वस्त्र पकड़ लिए और मुझे यौन-संबंध बनाने के लिए हिंसा से खींचने लगी। **3** जब मैंने देखा कि वह उन्मत्त होकर मेरा कुरता पकड़े हुए है, तो मैं उसे छोड़कर [अपने को छुड़ाते हुए][c] नंगा भाग गया। **4** पर उसने उस कुरते को अपने पास रखकर मुझ पर झूठा दोष लगाया। जब उसका पति आया, तो उसने मुझे अपने घर के बंदीगृह में डाल दिया; और अगले दिन मुझे कोड़े लगवाकर फ़िरौन के कारागार में भेज दिया। **5** जब मैं बेड़ियों में था, तब वह मिस्री स्त्री दुःख से व्याकुल थी। वह आकर चुपके से सुनती थी कि मैं कैसे अंधकार के घर[d] में प्रभु को धन्यवाद देता और भजन गाता था, और प्रसन्न स्वर से अपने परमेश्वर की महिमा करते हुए आनन्दित होता था, क्योंकि उस बहाने मुझे उस मिस्री स्त्री से छुटकारा मिल गया था।'
