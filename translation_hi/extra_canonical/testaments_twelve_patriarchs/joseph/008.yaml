  text: '6[a]. And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.” 7. But she did not know that I spoke thus because of my Lord, and not because of her. 8. For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he interprets it in terms of that passion, toward his evil desire[b].


    1. So I say, my children, that it was about the sixth hour when she left me. And bending my knee to the Lord all that day and all that night, toward dawn I rose, weeping and asking for deliverance from her. 2. At last, with evil intent, she seized my garments by force, dragging me violently toward intercourse. 3. Therefore, when I saw that in her frenzy she had hold of my tunic, I left it behind and fled naked. 4. But she, taking hold of it, slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me, he sent me into Pharaoh’s dungeon. 5. And while I was in chains[c], the Egyptian woman was constrained by grief.'
translation:
  language: hi
  text: '**यूसुफ का वसीयतनामा 7:6–8; 8:1–5**


    **7:6** तब उसने मुझसे कहा, “तो देखो, तुम मुझसे प्रेम करते हो। मेरे लिए इतना ही बहुत हो: बस मेरे जीवन और मेरे बच्चों की सुध लो; तब मुझे आशा है कि मैं अपनी अभिलाषा भी पूरी कर लूँगी।” **7** पर वह नहीं जानती थी कि मैंने ऐसा अपने प्रभु[a] के कारण कहा था, उसके कारण नहीं। **8** क्योंकि यदि कोई अभिलाषा के आवेग के अधीन हो जाए और उसका दास बन जाए, जैसा वह भी बन गई थी, तो वह कोई अच्छी बात सुनकर भी उसे अपनी बुरी अभिलाषा के अनुकूल ही समझता है।


    **8:1** इसलिए, मेरे बच्चो, मैं कहता हूँ कि जब वह मेरे पास से गई, तब लगभग छठा पहर[b] था। मैं उस पूरे दिन और पूरी रात प्रभु के सामने घुटने टेककर रहा। भोर के निकट मैं उठा और रोते हुए उससे छुटकारे की विनती करने लगा। **2** अंत में उसने बलपूर्वक मेरे वस्त्र पकड़ लिए और मुझे यौन-संबंध बनाने के लिए हिंसा से खींचने लगी। **3** जब मैंने देखा कि वह उन्मत्त होकर मेरा कुरता पकड़े हुए है, तो मैं उसे छोड़कर [अपने को छुड़ाते हुए][c] नंगा भाग गया। **4** पर उसने उस कुरते को पकड़कर[d] मुझ पर झूठा दोष लगाया। जब उसका पति आया, तो उसने मुझे अपने घर के बंदीगृह में डाल दिया; और अगले दिन मुझे कोड़े लगवाकर फ़िरौन के कारागार में भेज दिया। **5** जब मैं बेड़ियों में था, तब वह मिस्री स्त्री दुःख से व्याकुल थी। वह आकर चुपके से सुनती थी कि मैं कैसे अंधकार के घर[e] में प्रभु को धन्यवाद देता और भजन गाता था, और प्रसन्न स्वर से अपने परमेश्वर की महिमा करते हुए आनन्दित होता था, क्योंकि उस बहाने मुझे उस मिस्री स्त्री से छुटकारा मिल गया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरे प्रभु’ का अर्थ यहाँ परमेश्वर भी हो सकता है और यूसुफ का मानवीय स्वामी भी। आगे की प्रार्थना परमेश्वर की ओर संकेत करती है, पर यूनानी पद स्वयं दोनों अर्थों की गुंजाइश रखता है।
    reason: theological_ambiguity
  - marker: b
    text: ‘छठा पहर’ लगभग दोपहर का समय था।
    reason: historical_context
  - marker: c
    text: ‘अपने को छुड़ाते हुए’ कुछ यूनानी पाठ-साक्ष्यों में मिलता है; अन्य में ये शब्द नहीं हैं।
    reason: textual_variant
  - marker: d
    text: इस पद का यूनानी पाठ कुछ कठिन है। अनुवाद में सर्वनाम का संदर्भ यूसुफ के कुरते से लिया गया है, जैसा निकटवर्ती कथा-संदर्भ से स्पष्ट होता है।
    reason: textual_variant
  - marker: e
    text: ‘अंधकार का घर’ यहाँ कारागार के लिए प्रयुक्त रूपक है।
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: मेरे जीवन और मेरे बच्चों की सुध लो
  rationale: यह मुहावरा किसी के जीवन और हित को अपनी चिंता या जिम्मेदारी मानने का भाव देता है। ‘सुध लो’ आधुनिक, सहज और स्त्री की विनती में निहित भावनात्मक दबाव को बनाए रखता है।
- source_word: προσδοκίαν ἀπολαῦσαι καὶ τῆς ἐπιθυμίας μου
  choice: मुझे आशा है कि मैं अपनी अभिलाषा भी पूरी कर लूँगी
  rationale: ἀπολαύω में पाने या भोगने, दोनों का भाव हो सकता है। यहाँ उसकी कामनापूर्ति अभिप्रेत है; हिन्दी वाक्य स्पष्ट है, पर अनावश्यक रूप से अश्लील नहीं।
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας
  choice: अभिलाषा के आवेग के अधीन हो जाए
  rationale: ὑποπίπτω अधीन पड़ने और πάθος प्रबल, वश में करने वाले आवेग का संकेत देता है। यह केवल सामान्य इच्छा नहीं, बल्कि मनुष्य को दबा लेने वाली कामना है।
- source_word: δουλωθῇ αὐτῷ
  choice: उसका दास बन जाए
  rationale: δουλόω का दासता-संबंधी बल प्रत्यक्ष रखा गया है।
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: उसे उसी आवेग के अनुसार समझता है और अपनी बुरी अभिलाषा की ओर मोड़ देता है
  rationale: वाक्य का आशय है कि वासना मनुष्य की समझ को विकृत करती है, जिससे अच्छी बात भी बुरी इच्छा के अनुकूल ग्रहण की जाती है।
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: प्रभु के सामने घुटने टेककर रहा
  rationale: शाब्दिक चित्र और प्रार्थनापूर्ण मुद्रा दोनों स्वाभाविक हिन्दी में सुरक्षित हैं।
- source_word: λύτρωσιν ἐξ αὐτῆς
  choice: उससे छुटकारा
  rationale: यहाँ λύτρωσις व्यावहारिक बचाव या मुक्ति है, प्रायश्चित्त-संबंधी तकनीकी अर्थ नहीं।
- source_word: μετὰ βίας ἐφελκομένη με εἰς συνουσίαν
  choice: मुझे यौन-संबंध बनाने के लिए हिंसा से खींचने लगी
  rationale: συνουσία यहाँ स्पष्ट रूप से लैंगिक संबंध का द्योतक है। अनुवाद अर्थ को बिना व्यंजना में छिपाए सीधे और संयत ढंग से कहता है।
- source_word: χιτών
  choice: कुरता
  rationale: χιτών शरीर पर पहना जाने वाला भीतरी वस्त्र है। ‘कुरता’ साधारण हिन्दी पाठक के लिए ‘अंगरखा’ या लिप्यंतरित ‘ट्यूनिक’ से अधिक सहज है।
- source_word: ἐσυκοφάντησέ με
  choice: मुझ पर झूठा दोष लगाया
  rationale: क्रिया दुर्भावनापूर्ण झूठे आरोप को व्यक्त करती है; ‘झूठा दोष लगाया’ केवल ‘बदनाम किया’ से अधिक कथानक-संगत है।
- source_word: ἐπηκροᾶτό μου
  choice: चुपके से सुनती थी
  rationale: क्रिया ध्यान देकर या चोरी-छिपे सुनने का भाव रख सकती है। प्रसंग में उसका आकर कैद यूसुफ की स्तुति सुनना अभिप्रेत है।
- source_word: οἴκῳ τοῦ σκότους
  choice: अंधकार के घर
  rationale: मूल रूपक को सुरक्षित रखा गया है; संदर्भ में यह कारागार है।
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: उस बहाने मुझे ... छुटकारा मिल गया था
  rationale: πρόφασις बहाना, कथित कारण या अवसर हो सकता है। अनुवाद उसके आरोप को परमेश्वर की प्रत्यक्ष व्यवस्था घोषित किए बिना, विडंबनापूर्ण परिणाम को बनाए रखता है।
theological_decisions:
- issue: διὰ τὸν Κύριόν μου में ‘मेरे प्रभु’ का संदर्भ
  choice: मुख्य पाठ में ‘अपने प्रभु’ रखा गया है और टिप्पणी में संदर्भ की अस्पष्टता बताई गई है।
  alternative: इसे निश्चित रूप से ‘अपने परमेश्वर’ या ‘अपने स्वामी’ कहना।
  rationale: κύριος परमेश्वर अथवा मानवीय स्वामी, दोनों के लिए प्रयुक्त हो सकता है। निकटवर्ती प्रार्थना-प्रसंग परमेश्वर की ओर संकेत करता है, पर मूल पद में संज्ञा स्वयं संदिग्ध है; इसलिए हिन्दी में वही तनाव सुरक्षित है।
- issue: अभिलाषा द्वारा समझ का दास बनाया जाना
  choice: कथन को स्त्री के प्रसंग से निकला एक सामान्य नैतिक सिद्धांत माना गया है।
  alternative: इसे केवल मिस्री स्त्री की उस एक गलतफहमी तक सीमित करना।
  rationale: ग्रीक ‘यदि कोई’ से सामान्य कथन करता है, फिर ‘जैसा वह भी’ कहकर स्त्री को उदाहरण बनाता है। अनुवाद दोनों स्तरों को रखता है।
- issue: कारागार में यूसुफ का आनन्द
  choice: आनन्द को परमेश्वर की स्तुति और स्त्री से हुए छुटकारे से जोड़ा गया है।
  alternative: इसे कष्ट या अन्याय पर आनन्द करने का सिद्धांत बनाना।
  rationale: मूल पाठ विशेष रूप से धन्यवाद, भजन, परमेश्वर की महिमा और स्त्री से छुटकारे की बात करता है; इससे आगे कोई व्यवस्थित धार्मिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है—गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सहज। लैंगिक हिंसा को मूल के अनुरूप स्पष्ट किंतु संयत शब्दों में व्यक्त किया गया है। ‘प्रभु’, ‘परमेश्वर’, ‘अभिलाषा’, ‘कारागार’ और ‘महिमा’ जैसे शब्द वसीयतनामाई धार्मिक स्वर बनाए रखते हैं; वहीं ‘सुध लो’, ‘कुरता’ और ‘झूठा दोष लगाया’ पाठ को अनावश्यक रूप से पुरातन या कृत्रिम होने से बचाते हैं।
