  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/005.yaml
  text: So it seemed good to all of them for me to remain in Egypt with the merchant of their trade until they should return bringing merchandise.
translation:
  language: hi
  text: इसलिए उन सबको यह उचित लगा कि मैं मिस्र में उनके व्यापार के सौदागर के साथ तब तक रहूँ, जब तक वे माल लेकर लौट न आएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξεν
  choice: उचित लगा
  rationale: यह यूनानी पद सामूहिक निर्णय या सहमति को व्यक्त करता है; आधुनिक हिन्दी में ‘उचित लगा’ स्वाभाविक और अर्थसंगत है।
- source_word: τοῦ εἶναι με εἰς Αἴγυπτον
  choice: कि मैं मिस्र में ... रहूँ
  rationale: संबंधित पाठ और संशोधित परामर्श-पाठ के अनुरूप infinitive construction को ‘मिस्र में रहना’ समझा गया है, न कि स्पष्ट रूप से ‘मुझे छोड़ जाना’।
- source_word: τὸν μετάβολον
  choice: सौदागर
  rationale: यह व्यापार करने वाले व्यक्ति को सूचित करता है; ‘सौदागर’ सामान्य हिन्दी में व्यापारी की भूमिका स्पष्ट करता है।
- source_word: ἐμπορίαν
  choice: व्यापार का माल
  rationale: अंतिम प्रयोग में संदर्भानुसार व्यापार हेतु लाई गई वस्तुओं या माल का अर्थ है, केवल अमूर्त ‘व्यापार’ नहीं।
- source_word: ἐπιστρέψουσιν
  choice: लौट न आएँ
  rationale: यह वापसी की भावी क्रिया को स्वाभाविक हिन्दी अधीन वाक्य में व्यक्त करता है।
