  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: hi
  text: तब उनमें से जो प्रधान था, उसने मुझसे कहा, “तुम दास नहीं हो, क्योंकि तुम्हारा रूप भी यह स्पष्ट करता है।” पर मैंने उनसे कहा कि मैं उनका दास हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: उनमें से जो प्रधान था
  rationale: शाब्दिक अर्थ ‘उनमें से बड़ा’ है; प्रसंग में समूह के प्रमुख व्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द स्वामित्वाधीन दास को सूचित कर सकता है; ‘सेवक’ की तुलना में ‘दास’ मूल सामाजिक स्थिति को अधिक ठीक रखता है।
- source_word: ἡ ὄψις σου
  choice: तुम्हारा रूप
  rationale: ὄψις यहाँ बाहरी रूप या दिखावट को सूचित करता है; ‘रूप’ सहज है और केवल चेहरे तक अर्थ सीमित नहीं करता।
- source_word: δηλοῖ
  choice: साफ़ बता रहा है
  rationale: क्रिया का अर्थ प्रत्यक्ष या स्पष्ट कर देना है; यह मुहावरेदार हिन्दी में कथन की स्पष्टता बनाए रखता है।
- source_word: δοῦλος αὐτῶν ὑπάρχω
  choice: मैं उनका दास ही हूँ
  rationale: ὑπάρχω वास्तविक स्थिति को व्यक्त करता है और ‘ही’ उत्तर में निहित दृढ़ता को स्वाभाविक हिन्दी में सामने लाता है।
