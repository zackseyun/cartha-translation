translation:
  language: hi
  text: और परमेश्वर ने उसे मेरे हाथ में आशीष दी और उसे सोने, चाँदी और संपत्ति में बढ़ाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χειρί μου
  choice: मेरे हाथ में
  rationale: 'यूनानी के एकवचन और उसके माध्यम-सूचक रूपक को निकटता से सुरक्षित रखता है: यूसुफ के प्रबंध के अधीन या उसके द्वारा।'
- source_word: ἐπλήθυνεν αὐτὸν
  choice: उसके ... को बढ़ाया
  rationale: शाब्दिक ‘उसे बढ़ाया’ हिन्दी में अस्वाभाविक है; आगे उल्लिखित सोना, चाँदी और संपत्ति वृद्धि का क्षेत्र स्पष्ट करते हैं।
- source_word: ἐν χρυσίῳ καὶ ἀργυρίῳ καὶ ἔργῳ
  choice: उसके सोने, चाँदी और संपत्ति को
  rationale: χρυσίον और ἀργύριον को सीधे ‘सोना’ और ‘चाँदी’ कहा गया है। संदर्भ में ἔργον भौतिक साधन/माल-संपत्ति की ओर संकेत करता है; ‘काम’ यहाँ धन-वृद्धि के साथ अस्वाभाविक होगा।
theological_decisions:
- issue: आशीष का कर्ता और यूसुफ की मध्यस्थ भूमिका
  choice: परमेश्वर ने ... आशीष दी; ‘मेरे हाथ में’ और ‘मेरे कारण’ दोनों रखे
  alternative: परमेश्वर ने मेरे द्वारा उसे आशीष दी और समृद्ध किया
  rationale: मूल पाठ परमेश्वर को कर्ता बताता है, जबकि ἐν χειρί μου और ἐν के कारण यूसुफ की भूमिका व्यक्त होती है। दोनों अलग अभिव्यक्तियों को मिलाने से मूल की संभावित अर्थ-छटाएँ मिट जातीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मेरे हाथ में’ जानबूझकर कुछ रूपकात्मक रखा गया है ताकि यूनानी की अभिव्यक्ति और उसकी वास्तविक अस्पष्टता बनी रहे।
