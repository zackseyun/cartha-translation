base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/011.yaml
  text: Now therefore render judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you, because grace from heaven is upon him.
translation:
  language: hi
  text: अब इसलिए उसके विषय में निर्णय कीजिए और उस युवक को हमारे घर ले आइए, और इब्रानियों का परमेश्वर आपको आशीष देगा, क्योंकि उस पर स्वर्ग से कृपा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: उसके विषय में न्याय कीजिए
  rationale: यूनानी पदबंध का शाब्दिक रूप ‘उसके साथ न्याय करो’ हो सकता है, पर प्रसंग में किसी व्यक्ति के मामले में निर्णय करने का भाव है; इसलिए स्वाभाविक आधुनिक हिन्दी में ‘उसके विषय में न्याय कीजिए’ रखा गया।
- source_word: ἀφελοῦ τὸν νεανίαν εἰς τὸν οἶκον ἡμῶν
  choice: उस युवक को हमारे घर ले आइए
  rationale: ἀφελοῦ यहाँ युवक को अपने साथ लेकर घर लाने का भाव देता है। ‘ले आइए’ गंतव्य ‘हमारे घर’ के अनुरूप सहज हिन्दी है।
- source_word: ὁ Θεὸς τῶν Ἑβραίων
  choice: इब्रानियों का परमेश्वर
  rationale: समुदाय-संबंधी यूनानी पद का सीधा और प्रचलित बाइबिलीय हिन्दी रूप।
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: उस पर स्वर्ग की कृपा है
  rationale: πρὸς αὐτόν संबंध या अभिमुखता व्यक्त करता है; ‘उस पर’ हिन्दी में ईश्वरीय अनुग्रह की उपस्थिति को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘स्वर्ग की कृपा’ स्रोत की अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: εὐλογῆσαί σε ἔχει में भविष्यसूचक आशीष
  choice: तब ... आपको आशीष देगा
  alternative: आपको आशीष देने वाला है
  rationale: यूनानी परिभाषात्मक भाव आसन्न या निश्चित भविष्य दर्शाता है। ‘आशीष देगा’ स्वाभाविक हिन्दी में इस आश्वासन को सुरक्षित रखता है; ‘तब’ इसे पहले आग्रह के परिणाम से सहज रूप से जोड़ता है, बिना कोई सांप्रदायिक अर्थ जोड़े।
- issue: χάρις की प्रकृति
  choice: कृपा
  alternative: अनुग्रह
  rationale: ‘कृपा’ साधारण आधुनिक पाठकों के लिए अधिक सहज है और यहाँ युवक पर स्वर्गीय अनुकूलता/कृपा का व्यापक अर्थ बनाए रखती है; इसे उद्धार-संबंधी किसी विशिष्ट सिद्धांत तक सीमित नहीं किया गया।
translation_notes:
  register: आदरार्थक आज्ञार्थक रूप ‘कीजिए/ले आइए’ चुना गया है। भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। मूल में लंबे समन्वित वाक्य को हिन्दी की पठनीयता के लिए दो वाक्यों में बाँटा गया है।
