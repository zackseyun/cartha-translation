base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/010.yaml
  text: And she said to her husband, “The merchant has grown rich through the hands of a certain young Hebrew; and they say that he also was stolen by theft from the land of Canaan.”
translation:
  language: hi
  text: और उसने अपने पति से कहा, “एक इब्रानी युवक के हाथों वह व्यापारी धनी हो गया है; और लोग कहते हैं कि उसे भी कनान देश से चोरी से चुरा लिया गया था।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “चोरी से चुरा लिया गया” है; एक ही मूल के संज्ञा और क्रिया का प्रयोग चोरी पर बल देता है।
    reason: मुख्य पाठ में यूनानी की बलात्मक पुनरुक्ति को यथासंभव बनाए रखा गया है; पाद-टिप्पणी उसके शाब्दिक स्वरूप को स्पष्ट करती है।
lexical_decisions:
- source_word: μετάβολος
  choice: व्यापारी
  rationale: यहाँ यह शब्द व्यापार करने वाले व्यक्ति के लिए है; ‘व्यापारी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐν χερσίν τινος νέου Ἑβραίου
  choice: एक इब्रानी युवक के हाथों
  rationale: ‘हाथों’ के यूनानी रूपक को बनाए रखते हुए यह बताता है कि व्यापारी की समृद्धि उस युवक के काम या माध्यम से हुई।
- source_word: ἐπλούτησεν
  choice: धनी हो गया है
  rationale: यूनानी क्रिया के अर्थ ‘समृद्ध/धनी हो जाना’ और वर्तमान परिणाम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ γῆς Χαναάν
  choice: कनान देश से
  rationale: γῆ का आशय यहाँ भौगोलिक प्रदेश है; ‘कनान देश’ साधारण पाठक के लिए स्पष्ट है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘इब्रानी’ प्राचीन जातीय पहचान के लिए प्रचलित बाइबलीय हिन्दी है। मूल की बलात्मक अभिव्यक्ति ‘κλοπῇ ἔκλεψαν’ को ‘चोरी करके चुरा लिया’ के रूप में सुरक्षित रखा गया है।
