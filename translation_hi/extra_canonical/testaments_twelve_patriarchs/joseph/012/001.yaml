  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: hi
  text: जब मैं इश्माएलियों के साथ जा रहा था, तो वे मुझसे बार-बार पूछते थे, “क्या तुम दास हो?” और मैंने कहा, “मैं घराने का दास हूँ,” ताकि मैं अपने भाइयों को लज्जा न पहुँचाऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: जब मैं इश्माएलियों के साथ जा रहा था
  rationale: ग्रीक के साथ चलते/जाते आने के भाव को प्रसंगानुकूल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπηρώτων
  choice: बार-बार पूछते थे
  rationale: अपूर्ण भूतकाल प्रश्न करने की जारी या पुनरावृत्त क्रिया दर्शाता है।
- source_word: δοῦλος
  choice: दास
  rationale: यहाँ व्यक्ति की दास-अवस्था का स्पष्ट अर्थ है; ‘सेवक’ उसकी कठोरता को कम कर सकता है।
- source_word: δοῦλος ... ἐξ οἴκου
  choice: घर में जन्मा दास
  rationale: ἐξ οἴκου का शाब्दिक अर्थ ‘घर से/घराने का’ है; प्राचीन दासता के संदर्भ में यह किसी घर में जन्मे दास का स्वाभाविक संकेत है, यद्यपि वाक्यांश में कुछ अर्थगत संक्षिप्तता है।
- source_word: αἰσχύνω
  choice: लज्जित करूँ
  rationale: भाइयों पर अपमान या लज्जा लाने का प्रयोजनात्मक भाव सुरक्षित रखता है।
theological_decisions:
- issue: यूसुफ द्वारा अपनी स्थिति का वर्णन
  choice: ‘घर में जन्मा दास’ के रूप में अनुवाद
  alternative: ‘घराने का दास’ अथवा ‘घरेलू दास’
  rationale: पाठ के ἐξ οἴκου को हटाए बिना उस दावे को स्वाभाविक हिन्दी में रखा गया है जिसके द्वारा यूसुफ अपने भाइयों को दोषी ठहराने से बचता है; पाठ की नैतिक विडंबना को अलग से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; ऐतिहासिक दासता को स्पष्ट रखने के लिए ‘दास’ चुना गया है। प्रत्यक्ष कथन में स्रोत का आशय स्वाभाविक रूप से प्रस्तुत है और पुनरावृत्त प्रश्न का पहलू सुरक्षित है।
