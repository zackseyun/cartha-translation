translation:
  language: hi
  text: परन्तु प्रभु ने उस व्यापारी की दृष्टि में मुझे कृपा दिलाई, और उसने अपना घर मेरे भरोसे सौंप दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν ἐν ὀφθαλμοῖς
  choice: की दृष्टि में मुझे कृपा दिलाई
  rationale: यूनानी मुहावरे का अर्थ किसी की अनुकूल दृष्टि या कृपा पाना है; यह रूप मूल बिंब को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: τοῦ μεταβόλου
  choice: उस व्यापारी
  rationale: संदर्भ और अंग्रेज़ी परामर्श-पाठ के अनुसार यह व्यापार करने वाले व्यक्ति को दर्शाता है; निश्चित पद के लिए ‘उस’ रखा गया है।
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: उसने अपना घर मेरे भरोसे सौंप दिया
  rationale: ἐπίστευσεν का भाव किसी वस्तु या दायित्व को विश्वासपूर्वक सौंपना है; ‘घर’ मूल के व्यापक घरेलू प्रबंध या गृहस्थी संबंधी अर्थ को खुला रखता है।
theological_decisions:
- issue: प्रभु की कृपा और व्यापारी के विश्वास के बीच संबंध
  choice: 'दोनों को क्रमिक रूप में रखा गया: प्रभु ने कृपा दिलाई, और व्यापारी ने घर सौंपा'
  alternative: व्यापारी के सौंपने को सीधे प्रभु की क्रिया के रूप में व्यक्त करना
  rationale: यूनानी पाठ दो अलग क्रियाएँ रखता है और उनके संबंध को स्पष्ट रूप से परिभाषित नहीं करता; अनुवाद उसी तनाव और क्रम को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘परन्तु’ δέ के विरोधात्मक/संक्रमणकारी बल को व्यक्त करता है; कोई फुटनोट आवश्यक नहीं।
