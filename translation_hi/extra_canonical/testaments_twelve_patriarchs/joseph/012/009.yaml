  text: Κατ᾽ ἐκεῖνον δὲ¹ τὸν καιρὸν κατῆει² Μεμφίς³ †ἐν λαμπήνῃ†⁴ *ἡ γυνὴ⁵ τοῦ Πεντεφρὶ⁶ ⌜μετὰ δόξης πολλῆς, ὅτι ἤκουσε περὶ ἐμοῦ παρὰ τῶν εὐνούχων αὐτῆς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/009.yaml
  text: At that time the wife of Pentephri came down to Memphis in a litter, with great splendor, because she had heard about me from her eunuchs.
translation:
  language: hi
  text: उस समय पेनतेफ्री की पत्नी बड़ी शान के साथ पालकी[a] में मेम्फिस में उतर आई, क्योंकि उसने अपने खोजा सेवकों से मेरे बारे में सुना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पालकी में” के लिए प्रयुक्त यूनानी पदबंध का पाठ संदिग्ध है; इसका सम्भावित अर्थ “पालकी में” है।
    reason: मुद्रित यूनानी स्रोत में ἐν λαμπήνῃ पाठ-संदेह के चिह्नों के बीच है; पादटिप्पणी इस अनिश्चितता को स्पष्ट करती है।
lexical_decisions:
- source_word: κατῆει
  choice: उतर आई
  rationale: क्रिया में नीचे आने/उतरने का भाव है; यह रूप उस दिशात्मक संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν λαμπήνῃ
  choice: पालकी में
  rationale: λαμπήνη एक ढकी हुई सवारी या पालकी को सूचित करता है; स्रोत में पदबंध पाठ-संदिग्ध चिह्नों से घिरा है, इसलिए अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: μετὰ δόξης πολλῆς
  choice: बड़ी शान के साथ
  rationale: यह उसके आगमन के वैभव और सार्वजनिक ठाट को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐνούχων
  choice: खोजों
  rationale: प्राचीन राजकीय या उच्चवर्गीय गृहस्थी के बधिया पुरुष सेवकों के लिए ऐतिहासिक रूप से उपयुक्त और संक्षिप्त शब्द।
