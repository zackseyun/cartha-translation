  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/002.yaml
  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: hi
  text: तब उनमें से जो प्रधान था, उसने मुझसे कहा, “तुम दास नहीं हो, क्योंकि तुम्हारा हुलिया भी यह बात स्पष्ट करता है।” पर मैंने उनसे कहा कि मैं उनका दास हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: उनमें से जो प्रधान था
  rationale: शाब्दिक अर्थ ‘उनमें बड़ा’ है; प्रसंग में समूह के मुखिया या प्रधान का भाव है।
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द स्वामित्व और अधीन स्थिति को व्यक्त करता है; ‘सेवक’ की अपेक्षा ‘दास’ मूल अर्थ को अधिक ठीक रखता है।
- source_word: ἡ ὄψις σου
  choice: तुम्हारा रूप
  rationale: ὄψις बाहरी रूप या दिखाई देने वाली सूरत को दर्शाता है; सहज हिन्दी में ‘रूप’ उपयुक्त है।
- source_word: δηλοῖ
  choice: स्पष्ट कर देता है
  rationale: क्रिया का अर्थ प्रकट या स्पष्ट करना है; वाक्य में स्वाभाविक आधुनिक हिन्दी प्रयोग।
- source_word: ὑπάρχω
  choice: हूँ
  rationale: यहाँ अस्तित्व या वास्तविक स्थिति बताने वाली क्रिया है; हिन्दी में सरल ‘हूँ’ पर्याप्त और स्वाभाविक है।
theological_decisions:
- issue: जोसेफ की दास के रूप में स्थिति
  choice: ‘मैं उनका दास हूँ’ के रूप में कथन को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘मैं सचमुच उनका दास हूँ’ या ‘मैं उन्हीं का दास हूँ’
  rationale: यूनानी पाठ स्थिति का सीधा दावा करता है; अतिरिक्त बल जोड़ने से अर्थ अनावश्यक रूप से निश्चित हो जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष कथन की सादगी और मूल पाठ में बाहरी रूप तथा दास-स्थिति के बीच तनाव बनाए रखा गया है।
