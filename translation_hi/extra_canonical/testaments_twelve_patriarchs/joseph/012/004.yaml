  text: And when we had come into Egypt, they disputed concerning me, as to who, after betraying me, would receive the gold.
translation:
  language: hi
  text: जब हम मिस्र पहुँचे, तो वे मेरे विषय में इस बात पर झगड़ने लगे कि मेरे साथ विश्वासघात करके[a] सोना कौन पाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे विश्वासघातपूर्वक सौंपकर।”
    reason: यूनानी προδοὺς में विश्वासघात करने और किसी को सौंप देने—दोनों का भाव हो सकता है; वैकल्पिक अनुवाद इस अर्थ-व्याप्ति को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐμάχοντο
  choice: झगड़ने लगे
  rationale: यह क्रिया यहाँ किसी विषय को लेकर आपस में लड़ने या तीखा विवाद करने का भाव देती है; प्रसंग में ‘झगड़ने लगे’ स्वाभाविक और स्पष्ट है।
- source_word: προδοὺς
  choice: मेरे साथ विश्वासघात करके
  rationale: प्रδίδωμι का मूल भाव किसी को विश्वासघातपूर्वक सौंप देना या धोखा देना है। यह चयन नैतिक तीव्रता बनाए रखता है और केवल सामान्य बिक्री का अर्थ नहीं जोड़ता।
- source_word: χρυσίον
  choice: सोना
  rationale: यूनानी शब्द विशेष रूप से सोने को दर्शाता है, केवल सामान्य धन या रकम को नहीं।
- source_word: λάβῃ
  choice: पाए
  rationale: संभाव्य विचार-विमर्श के भीतर ‘कौन पाए’ हिंदी में स्वाभाविक रूप से अपेक्षित या संभावित प्राप्ति व्यक्त करता है।
