  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002.yaml
  text: And this man[a], Pharaoh’s chief cook, entrusted his house to me. And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame. I was imprisoned, I was beaten, I was mocked; and the Lord gave me compassion in the sight of the jailer. For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress[b]. For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, does he become weak or terrified. But in all these things he takes the lead[c], and in various ways he gives comfort.
translation:
  language: hi
  text: और इस व्यक्ति[a] ने, जो फ़िरौन का प्रधान रसोइया था, अपना घर मेरे भरोसे कर दिया। 2 मैंने एक निर्लज्ज स्त्री का विरोध किया, जो मुझ पर लगातार दबाव डालती रही कि मैं उसके साथ अधर्म करूँ; पर मेरे पिता के परमेश्वर ने मुझे धधकती ज्वाला[b] से बचा लिया। 3 मुझे बंदीगृह में डाला गया, पीटा गया और मेरा उपहास किया गया; फिर भी प्रभु ने बंदीगृह के अधिकारी की दृष्टि में मुझ पर दया कराई। 4 क्योंकि प्रभु उन्हें नहीं छोड़ता जो उसका भय मानते हैं—न अंधकार में, न बेड़ियों में, न क्लेशों में और न संकटों में। 5 क्योंकि परमेश्वर मनुष्य के समान लज्जित नहीं होता, न मनुष्य के पुत्र के समान भयभीत होता है, और न धरती से जन्मे प्राणी के समान निर्बल पड़ता या आतंकित होता है। 6 बल्कि इन सब परिस्थितियों में वह अगुवाई करता है[c] और विभिन्न प्रकार से सांत्वना देता है। वह थोड़े समय के लिए दूर हो जाता है, ताकि मन के संकल्प को परखे[d]। 7 दस परीक्षाओं में उसने मुझे खरा सिद्ध किया, और उन सब में मैंने धीरज धरा। क्योंकि सहनशीलता बड़ी औषधि है, और धैर्य बहुत-सी भलाई देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀρχιμάγειρος को कुछ पाठक कड़ाई से पाक-कर्म का पद न मानकर राजदरबार के किसी अधिकारी की उपाधि समझते हैं; मिस्र में यूसुफ की उत्पत्ति-कथा से तुलना करें।
    reason: lexical_alternative
  - marker: b
    text: ‘धधकती ज्वाला’ संभवतः यौन प्रलोभन के भस्मकारी संकट का रूपक है, यद्यपि यूनानी पाठ इस बिंब को स्वयं नहीं खोलता।
    reason: lexical_alternative
  - marker: c
    text: ‘अगुवाई करता है’ का अर्थ ‘आगे खड़ा रहता है’, ‘साथ खड़ा रहता है’ या ‘देखरेख करता है’ भी समझा जा सकता है; यूनानी क्रिया में नेतृत्व और देखभाल की कई संबंधित छटाएँ हैं।
    reason: alternative_reading
  - marker: d
    text: ‘मन’ के लिए प्रयुक्त यूनानी शब्द ψυχή का अर्थ ‘प्राण’ या ‘आत्मा’ भी हो सकता है, और ‘संकल्प’ विचारित उद्देश्य या अभिप्राय को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: प्रधान रसोइया
  rationale: यूनानी समास का प्रत्यक्ष संबंध रसोई और पाक-कर्म से है। यह दरबारी पद भी हो सकता है, पर मुख्य पाठ में स्रोत की पाक-संबंधी पारदर्शिता बनाए रखी गई है।
- source_word: ἠγωνισάμην
  choice: सामना किया
  rationale: क्रिया सक्रिय नैतिक संघर्ष व्यक्त करती है। ‘सामना किया’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक सैन्य भाव नहीं जोड़ता।
- source_word: γυναῖκα ἀναιδῆ
  choice: एक निर्लज्ज स्त्री
  rationale: ἀναιδής लज्जा या मर्यादा के अभाव को स्पष्ट करता है; ‘निर्लज्ज’ स्रोत का नैतिक मूल्यांकन बनाए रखता है।
- source_word: ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς
  choice: मुझ पर लगातार दबाव डालती रही कि मैं उसके साथ अधर्म करूँ
  rationale: कृदंत निरंतर अथवा बार-बार दिए गए दबाव को व्यक्त करता है। παρανομεῖν को केवल व्यभिचार तक सीमित न करके उसके व्यापक नैतिक-विधिक अर्थ में ‘अधर्म करना’ कहा गया है।
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  choice: मुझे धधकती ज्वाला से बचा लिया
  rationale: मूल का सजीव रूपक बिना उसे कामवासना के रूप में स्पष्ट करके सीमित किए सुरक्षित रखा गया है।
- source_word: ἔδωκέ με ... εἰς οἰκτιρμούς
  choice: मुझ पर करुणा कराई
  rationale: यूनानी मुहावरे का आशय है कि परमेश्वर ने बंदीगृह के अधिकारी से यूसुफ को करुणापूर्ण व्यवहार दिलाया। हिन्दी में यह कारणात्मक रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: τοὺς φοβουμένους αὐτόν
  choice: अपने डरवैयों
  rationale: यह पारंपरिक ‘परमेश्वर का भय मानने’ वाली नैतिक-धार्मिक अभिव्यक्ति को संक्षेप में सुरक्षित रखता है।
- source_word: προΐσταται
  choice: आगे खड़ा रहता है
  rationale: क्रिया में आगे होना, नेतृत्व करना, देखभाल करना और संरक्षण देना जैसे परस्पर संबंधित भाव संभव हैं। चित्रात्मक अनुवाद इस अर्थ-विस्तार को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: मन का संकल्प
  rationale: ψυχή यहाँ अंतःजीवन या मनुष्य के भीतरी प्राण को और διαβούλιον उसके विचारित उद्देश्य या संकल्प को सूचित करता है। ‘मन का संकल्प’ सामान्य हिन्दी में बोधगम्य है।
- source_word: μακροθυμία ... ὑπομονή
  choice: सहनशीलता ... धैर्य
  rationale: 'दो निकटार्थी गुणों का भेद रखा गया है: μακροθυμία दीर्घकाल तक सहने की वृत्ति है, जबकि ὑπομονή कठिनाई में दृढ़ बने रहने का धैर्य है।'
theological_decisions:
- issue: ‘मेरे पिता के परमेश्वर’ में पिता का वचन
  choice: एकवचन ‘मेरे पिता’ रखा गया
  alternative: ‘मेरे पूर्वजों के परमेश्वर’ अथवा ‘मेरे पितरों के परमेश्वर’
  rationale: यूनानी पाठ में एकवचन है और आत्मकथात्मक प्रसंग में याकूब से यूसुफ का निजी संबंध स्वाभाविक है।
- issue: ‘धधकती ज्वाला’ का आशय
  choice: रूपक को बिना खोले रखा गया
  alternative: ‘कामवासना की आग’ या ‘व्यभिचारी अभिलाषा’
  rationale: प्रसंग उसका नैतिक संकेत देता है, पर यूनानी स्वयं ज्वाला के बिंब को स्पष्ट नहीं करता।
- issue: προΐσταται में परमेश्वर की भूमिका
  choice: ‘आगे खड़ा रहता है’
  alternative: ‘अगुवाई करता है’, ‘साथ खड़ा रहता है’ या ‘देखरेख करता है’
  rationale: मूल क्रिया नेतृत्व, उपस्थिति और संरक्षण की संबंधित छटाएँ रख सकती है; चित्रात्मक भाषा इस वास्तविक अस्पष्टता को बनाए रखती है।
- issue: परमेश्वर का थोड़े समय के लिए दूर होना
  choice: कथन को सीधे रूप में सुरक्षित रखा गया
  alternative: ‘दूर प्रतीत होता है’ या ‘अपनी उपस्थिति छिपाता है’
  rationale: मूल ἀφίσταται स्पष्टतः ‘दूर होता/हटता है’ कहता है। धर्मवैज्ञानिक कठिनाई को कम करने के लिए ‘प्रतीत होता है’ जोड़ना स्रोत से आगे जाता।
- issue: ‘खरा सिद्ध किया’ में परीक्षा और अनुमोदन
  choice: परख के बाद प्रमाणित होने का संयुक्त भाव रखा गया
  alternative: ‘मेरी परीक्षा ली’
  rationale: δόκιμον ἀπέδειξέ με केवल परीक्षा नहीं, बल्कि परीक्षा में प्रमाणित या खरा सिद्ध किए जाने का अर्थ देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और उपदेशात्मक शैली रखी गई है। वाक्य सामान्य पाठक के लिए सरल हैं, पर ‘अधर्म’, ‘क्लेश’, ‘संकल्प’ और ‘खरा सिद्ध’ जैसे शब्द मूल की नैतिक तथा ज्ञानपरक गंभीरता बनाए रखते हैं। पद-संख्या 2–7 स्रोत के अनुरूप दी गई है; आरंभिक वाक्य अध्याय का पहला पद माना गया है।
