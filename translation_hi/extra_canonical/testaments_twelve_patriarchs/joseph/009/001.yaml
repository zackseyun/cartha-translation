source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/001.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: hi
  text: और जब मैं बेड़ियों में था, तब वह मिस्री स्त्री दुःख से व्याकुल थी। वह आकर मुझे सुनती थी कि मैं कैसे प्रभु को धन्यवाद देता, अंधकार के घर में स्तुतिगान करता, और हर्षित स्वर में आनन्दित होकर अपने परमेश्वर की महिमा करता था, क्योंकि किसी बहाने के द्वारा मैं उस मिस्री स्त्री से छुड़ा लिया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: बेड़ियों में
  rationale: यह कारावास और बंधन दोनों को स्वाभाविक तथा ठोस रूप में व्यक्त करता है।
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: दुःख से व्याकुल थी
  rationale: शाब्दिक ‘दुःख से जकड़ी हुई थी’ की अपेक्षा यह यूनानी मुहावरे का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: ἐπηκροᾶτό μου
  choice: मेरी बातें सुना करती थी
  rationale: अपूर्णकाल की आवृत्तिमूलक छाया बनाए रखता है और बिना प्रमाण चोरी-छिपे सुनने का भाव नहीं जोड़ता।
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: अंधकार के घर में
  rationale: मूल रूपक को सुरक्षित रखता है; इसे केवल ‘कारागार’ कहकर अर्थ सीमित नहीं करता।
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: प्रसन्न स्वर से
  rationale: हर्षपूर्ण और उत्साहभरे स्वर का सहज आधुनिक हिन्दी रूप।
- source_word: διὰ προφάσεως
  choice: एक बहाने के द्वारा
  rationale: πρόφασις की अस्पष्टता बनाए रखता है—यह बहाना, आरोप का आधार, या अवसर हो सकता है—और उसे किसी एक व्याख्या में नहीं बाँधता।
- source_word: ἀπηλλάγην
  choice: छुड़ा लिया गया था
  rationale: निष्क्रिय क्रिया का रूप और मुक्ति का भाव सुरक्षित रहता है, जबकि छुड़ाने वाले को मूल की तरह अनिर्दिष्ट रखा गया है।
theological_decisions:
- issue: यूसुफ की मुक्ति का कर्ता
  choice: निष्क्रिय ‘छुड़ा लिया गया था’
  alternative: ‘परमेश्वर ने मुझे छुड़ाया था’
  rationale: यद्यपि संदर्भ में परमेश्वर की स्तुति है, यूनानी वाक्य इस क्रिया में कर्ता को स्पष्ट नहीं करता; इसलिए उसे जोड़ा नहीं गया।
- issue: ‘बहाने’ का नैतिक या कथात्मक अर्थ
  choice: अस्पष्टता सहित ‘एक बहाने के द्वारा’
  alternative: ‘झूठे आरोप के कारण’ अथवा ‘उस अवसर के द्वारा’
  rationale: मूल πρόφασις को किसी स्पष्ट नैतिक मूल्यांकन या कथात्मक व्याख्या में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक रूप अपनाया गया है। ‘वह मिस्री स्त्री’ पहले उल्लेख में पहचान स्पष्ट करता है और अंतिम पदबंध में मूल की पुनरुक्ति बनाए रखी गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
