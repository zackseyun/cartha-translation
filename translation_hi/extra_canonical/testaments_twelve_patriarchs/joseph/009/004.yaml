  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/004.yaml
  text: How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.
translation:
  language: hi
  text: कितनी ही बार ऐसा हुआ कि, बीमार होने पर भी, वह असमय मेरे पास नीचे आती थी और जब मैं प्रार्थना कर रहा था, तब मेरी आवाज़ सुनती थी; और मैं उसकी कराहों को समझकर चुप रहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποσάκις
  choice: कितनी ही बार ऐसा हुआ
  rationale: यह विस्मयात्मक और बारंबारता-सूचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καίπερ ἀσθενοῦσα
  choice: बीमार होने पर भी
  rationale: रियायती कृदन्त का सीधा और सहज अनुवाद है।
- source_word: κατῄει πρὸς με
  choice: मेरे पास नीचे आ जाती
  rationale: κατῄει में निहित नीचे आने की दिशा को बनाए रखते हुए πρὸς με का अर्थ स्पष्ट किया गया है।
- source_word: ἐν ἀωρίᾳ
  choice: असमय
  rationale: शब्द अनुचित, असामान्य या देर के समय का संकेत दे सकता है; ‘असमय’ इस अस्पष्टता को संक्षेप में सुरक्षित रखता है।
- source_word: τῆς φωνῆς μου προσευχομένου
  choice: प्रार्थना करते हुए मेरी आवाज़
  rationale: ग्रीक वाक्यांश का आशय है कि यूसुफ प्रार्थना कर रहा था और स्त्री उसकी आवाज़ सुनती थी।
- source_word: συνίων τοὺς στεναγμούς
  choice: उसके कराहने का अर्थ समझकर
  rationale: συνίων केवल सुनने नहीं, समझने या आशय पहचानने को दर्शाता है; στεναγμούς के लिए प्रसंगानुकूल ‘कराहने’ चुना गया है।
- source_word: ἐσιώπων
  choice: चुप रहता
  rationale: अपूर्ण भूतकाल बार-बार या जारी रहने वाली प्रतिक्रिया को सूचित करता है।
