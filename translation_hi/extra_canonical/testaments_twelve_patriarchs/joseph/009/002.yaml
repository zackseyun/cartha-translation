source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις δὲ¹ ἔπεμψε πρός με λέγουσα². Εὐδόκησον³ ⸀πληρῶσαι τὴν ἐπιθυμίαν⸀ μου, καὶ λύω⁴ σε ἐκ⁵ τῶν δεσμῶν, ⸀καὶ ἀπαλλάξω σε ἐκ⁶ τοῦ σκότους⸀. *Ἐγὼ δὲ οὐδὲ⁷ ἕως⁸ ἐννοίας⁹ ἐξέκλινα¹⁰ πρὸς αὐτήν· *ὁ γὰρ θεὸς ἀγαπᾷ¹¹ μᾶλλον τὸν¹² ἐν¹³ λάκκῳ σκότους †πιστὸν¹⁴ ἐν σωφροσύνῃ¹⁵, ἢ τὸν ἐν ταμείοις †βασιλέα¹⁶ τρυφῶντα μετ’ ἀκολασίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/002.yaml
  text: Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.” But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.
translation:
  language: hi
  text: उसने कई बार मेरे पास कहला भेजा, “मेरी इच्छा पूरी करने के लिए मान जाओ; तब मैं तुम्हें बेड़ियों से छुड़ा दूँगी और अँधेरे से बाहर निकाल दूँगी।” लेकिन मैं मन में भी उसकी ओर नहीं मुड़ा; क्योंकि परमेश्वर उस व्यक्ति से अधिक प्रेम करता है जो अँधेरे के गड्ढे में संयम में विश्वासयोग्य बना रहता है, न कि उस व्यक्ति से जो भंडार-कक्षों में राजा[a] होकर अनैतिकता के साथ विलास करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'राजा: यूनानी संस्करण में इस शब्द को पाठ-संदिग्ध चिह्न से अंकित किया गया है।'
    reason: †βασιλέα की पाठगत अनिश्चितता को बिना किसी असमर्थित वैकल्पिक पाठ या व्याख्या को अपनाए पारदर्शी बनाता है।
lexical_decisions:
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: मेरी इच्छा पूरी करने के लिए मान जाओ
  rationale: यह आग्रह और सहमति—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में रखता है; प्रसंग की यौन अभिलाषा को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: λύω σε ἐκ τῶν δεσμῶν
  choice: तुम्हें बेड़ियों से छुड़ा दूँगी
  rationale: λύω और δεσμά के मुक्ति तथा बंधन संबंधी ठोस अर्थ को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα πρὸς αὐτήν
  choice: मैं मन में भी उसकी ओर नहीं मुड़ा
  rationale: विचार तक में न झुकने के ग्रीक बल को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πιστὸν ἐν σωφροσύνῃ
  choice: संयम रखते हुए विश्वासयोग्य बना रहता है
  rationale: πιστός को ‘विश्वासयोग्य’ और σωφροσύνη को नैतिक/यौन आत्म-संयम के व्यापक अर्थ में ‘संयम’ दिया गया है।
- source_word: ἐν ταμείοις βασιλέα τρυφῶντα
  choice: भंडार-कक्षों में राजा की तरह रहकर ... विलास करता है
  rationale: पाठ के असामान्य चित्र—ταμεῖα और βασιλεύς—को समतल किए बिना हिन्दी में बोधगम्य रखा गया है।
- source_word: μετ’ ἀκολασίας
  choice: अनैतिकता के साथ
  rationale: ἀκολασία के असंयम, उच्छृंखलता और नैतिक दुराचार के भाव को प्रसंगानुकूल व्यापक शब्द से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के ‘अधिक प्रेम’ की तुलनात्मक भाषा
  choice: परमेश्वर ... से अधिक प्रेम करता है
  alternative: परमेश्वर ... को अधिक स्वीकार करता है
  rationale: ἀγαπᾷ μᾶλλον का सीधा तुलनात्मक कथन बनाए रखा गया है; संभावित धर्मवैज्ञानिक तनाव को व्याख्यात्मक शब्द से नहीं हटाया गया।
- issue: πιστός का आशय
  choice: विश्वासयोग्य बना रहता है
  alternative: विश्वास रखनेवाला
  rationale: यहाँ नैतिक परीक्षा में निष्ठावान बने रहने का भाव प्रमुख है, पर धार्मिक विश्वास की छाया को भी ‘विश्वासयोग्य’ सुरक्षित रखता है।
- issue: βασιλέα की पाठगत कठिनाई
  choice: राजा की तरह
  alternative: राजा
  rationale: क्रूस-चिह्नित कठिन पाठ को पूर्णतः निश्चित पदवी न बनाकर उपमान के रूप में स्वाभाविक हिन्दी दी गई है, जबकि राजसी विलास का विरोधाभास बचा रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। वाक्य में मूल का नैतिक विरोध—अँधेरे के गड्ढे में संयमपूर्ण निष्ठा बनाम सुरक्षित समृद्धि में अनैतिक विलास—स्पष्ट रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
