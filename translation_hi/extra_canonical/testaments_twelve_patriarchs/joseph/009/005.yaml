reference: Testament of Joseph 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ⌜γὰρ⌝ *ὄντος μου²⁹ ἐν τῷ οἴκῳ αὐτῆς ἐγύμνου³⁰ τοὺς βραχίονας αὐτῆς καὶ³¹ τὰς κνήμας, ⌜*ἵνα †συμπέσω εἰς αὐτήν³². *ἦν γὰρ⌝ καὶ ὡραία πάνυ³³ ⌜μάλιστα κοσμουμένη³⁴⌝ πρὸς ἀπάτην³⁵ μου. Καὶ ὁ Κύριος ἐφύλαξέ με ἀπὸ τῶν ἐγχειρημάτων αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/005.yaml
  text: For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned to deceive me. But the Lord guarded me from her schemes.
translation:
  language: hi
  text: क्योंकि जब मैं उसके घर में होता था, तब वह अपनी बाँहें और पिंडलियाँ अनावृत करती थी, ताकि मैं उसके वश में आ जाऊँ। वह बहुत सुंदर थी और मुझे धोखा देने के लिए विशेष रूप से सजी-सँवरी रहती थी। पर प्रभु ने मुझे उसकी चालों से बचाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγύμνου τοὺς βραχίονας αὐτῆς καὶ τὰς κνήμας
  choice: अपनी बाँहें और पिंडलियाँ खोलकर दिखाती थी
  rationale: ἐγύμνου का अपूर्णकाल बार-बार होने वाली क्रिया दर्शाता है; ‘खोलकर दिखाती थी’ अंगों को अनावृत करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है। κνήμας के लिए ‘पिंडलियाँ’ शारीरिक अर्थ को सटीक रखता है।
- source_word: ἵνα συμπέσω εἰς αὐτήν
  choice: ताकि मैं उसके साथ पाप में पड़ जाऊँ
  rationale: शाब्दिक ‘उसमें गिर पड़ूँ’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा। प्रसंग यौन प्रलोभन का है; ‘उसके साथ पाप में पड़ जाऊँ’ गिरने के रूपक और नैतिक आशय दोनों को बनाए रखता है, बिना क्रिया को अनावश्यक रूप से स्पष्ट किए।
- source_word: ὡραία πάνυ
  choice: बहुत सुंदर
  rationale: ὡραία के सौंदर्य-संबंधी अर्थ और πάνυ की तीव्रता का सीधा, स्वाभाविक अनुवाद।
- source_word: μάλιστα κοσμουμένη
  choice: विशेष रूप से सजती-सँवरती थी
  rationale: κοσμουμένη सजने या अलंकृत होने को व्यक्त करता है; ‘सजती-सँवरती’ आधुनिक हिन्दी में स्वाभाविक है और कृदंत की निरंतर/अभ्यस्त क्रिया को रखता है।
- source_word: πρὸς ἀπάτην μου
  choice: मुझे धोखा देने के लिए
  rationale: उद्देश्यगत πρὸς और प्रथम पुरुष संबंध को सहज हिन्दी में व्यक्त करता है; यहाँ धोखा प्रलोभन द्वारा फँसाने का व्यापक भाव रखता है।
- source_word: ἐφύλαξέ με ἀπὸ τῶν ἐγχειρημάτων αὐτῆς
  choice: मुझे उसकी चालों से बचाए रखा
  rationale: ἐγχειρήματα प्रयत्नों, षड्यंत्रों या योजनाओं का संकेत देता है। ‘चालों’ प्रसंग में स्वाभाविक है; ‘बचाए रखा’ प्रभु की निरंतर संरक्षणकारी भूमिका व्यक्त करता है।
theological_decisions:
- issue: यूसुफ के ‘गिरने’ का नैतिक आशय
  choice: उसके साथ पाप में पड़ जाऊँ
  alternative: उस पर गिर पड़ूँ / उसके साथ संबंध बना लूँ
  rationale: ग्रीक रूपक को पूर्णतः शाब्दिक रखने पर हिन्दी में गलत भौतिक अर्थ निकल सकता है, जबकि ‘संबंध बना लूँ’ मूल की सांकेतिकता से अधिक स्पष्ट है। चुना हुआ पाठ नैतिक और यौन प्रसंग को बताता है, पर घटना का अनावश्यक विस्तार नहीं करता।
- issue: दैवीय संरक्षण और मानवीय परीक्षा
  choice: प्रभु ने मुझे उसकी चालों से बचाए रखा
  alternative: प्रभु ने उसकी चालों से मेरी रक्षा की
  rationale: दोनों संभव हैं; चुना गया रूप ἐφύλαξέ के संरक्षण के भाव को जीवंत हिन्दी में रखता है और यूसुफ के प्रतिरोध तथा प्रभु की रक्षा के बीच मूल तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। अपूर्णकाल की अभ्यस्त क्रियाओं को ‘होता था’, ‘दिखाती थी’ और ‘सजती-सँवरती थी’ से व्यक्त किया गया है। किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
