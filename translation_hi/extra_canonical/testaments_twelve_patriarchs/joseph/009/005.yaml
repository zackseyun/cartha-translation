  to: क्योंकि जब मैं उसके घर में होता था, तब वह अपनी बाँहें और पिंडलियाँ अनावृत करती थी, ताकि मैं उसके वश में आ जाऊँ। वह बहुत सुंदर थी और मुझे धोखा देने के लिए विशेष रूप से सजी-सँवरी रहती थी। पर प्रभु ने मुझे उसकी चालों से बचाया।
