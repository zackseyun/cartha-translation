  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Εἰ δὲ¹⁷ ἐν σωφροσύνῃ διάγων *θέλει καὶ¹⁸ δόξαν, καὶ¹⁹ οἶδεν ὁ ὕψιστος ὅτι συμφέρει, παρέχει²⁰ καὶ αὐτῷ καὶ ταῦτα²¹ ὡς κἀμοί.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/003.yaml
  text: But if one lives in self-control and also desires glory, and the Most High knows that it is beneficial, he grants these things also to him, as also to me.
translation:
  language: hi
  text: परन्तु यदि कोई संयम का जीवन जीते हुए महिमा भी चाहता है, और परमप्रधान जानता है कि यह हितकर है, तो वह उसे ये सब भी प्रदान करता है, जैसे मुझे भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: संयम
  rationale: यह शब्द आत्म-संयम, शुद्ध आचरण और विवेकपूर्ण मर्यादा के अर्थ-क्षेत्र को समेटता है; यहाँ संक्षिप्त और स्वाभाविक हिन्दी में ‘संयम’ उपयुक्त है।
- source_word: δόξαν
  choice: महिमा
  rationale: δόξα के सम्मान, प्रतिष्ठा और गौरव संबंधी अर्थ को धार्मिक-साहित्यिक प्रसंग में ‘महिमा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का प्रतिष्ठित और अर्थ-सटीक हिन्दी रूप है।
- source_word: συμφέρει
  choice: हितकर है
  rationale: मूल में लाभ या भलाई होने का भाव है; कर्ता अथवा लाभार्थी को अनावश्यक रूप से स्पष्ट किए बिना मूल की संक्षिप्तता और अस्पष्टता रखी गई है।
- source_word: καὶ ταῦτα
  choice: ये सब भी
  rationale: ταῦτα के बहुवचन संकेत को बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: महिमा की इच्छा और परमप्रधान द्वारा उसका प्रदान किया जाना
  choice: इच्छा को स्पष्ट रखा गया, पर प्रदान करना परमप्रधान के इस ज्ञान पर निर्भर रखा गया कि वह हितकर है।
  alternative: महिमा को व्यक्ति के लिए ‘उचित’ या ‘अनुकूल’ बताना।
  rationale: θέλει καὶ δόξαν स्पष्टतः महिमा चाहने की बात करता है, जबकि ὅτι συμφέρει ‘कि यह हितकर है’ कहता है; इसलिए इच्छा और ईश्वरीय हित-विवेक के बीच का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जैसे मुझे भी’ में मूल यूनानी की संक्षिप्त तुलनात्मक अभिव्यक्ति को बिना अनावश्यक पूर्ति के बनाए रखा गया है।
