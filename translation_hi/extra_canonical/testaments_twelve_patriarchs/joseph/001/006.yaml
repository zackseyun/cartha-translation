source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Μόνος ἤμην²³, καὶ ὁ Θεὸς²⁴ παρεκάλεσέ με· Ἐν ἀσθενείᾳ ἤμην, καὶ ὁ Κύριος²⁵ ἐπεσκέψατό με²⁶· Ἐν φυλακῇ ἤμην, καὶ ὁ †σωτὴρ²⁷ ἐχαρίτωσέ με²⁸· [Ἐν δεσμοῖς καὶ ἔλυσέ με.]²⁹
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/006.yaml
  text: I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]
translation:
  language: hi
  text: मैं अकेला था, और परमेश्वर ने मुझे सांत्वना दी। मैं दुर्बल था, और प्रभु ने मेरी सुधि ली। मैं बंदीगृह में था, और उद्धारकर्ता ने मुझ पर कृपा की। [मैं बेड़ियों में था, और उसने मुझे खोल दिया।][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मैं बेड़ियों में था...” वाला वाक्य कुछ पाठ-साक्ष्यों में अनुपस्थित है या पाठगत रूप से अनिश्चित माना गया है।
    reason: मूल संस्करण के वर्ग कोष्ठक पाठगत संदेह दर्शाते हैं; पाठक को इस स्थिति की जानकारी देना आवश्यक है।
lexical_decisions:
- source_word: παρεκάλεσέ με
  choice: मुझे सांत्वना दी
  rationale: संदर्भ में अकेलेपन के बीच दिलासा और प्रोत्साहन का भाव है; ‘सांत्वना दी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἀσθενείᾳ
  choice: दुर्बल था
  rationale: ἀσθένεια शारीरिक कमजोरी या व्यापक दुर्बलता दोनों का संकेत दे सकता है; ‘दुर्बल’ इस अर्थ-व्याप्ति को बनाए रखता है।
- source_word: ἐπεσκέψατό με
  choice: मेरी सुधि ली
  rationale: ἐπισκέπτομαι केवल मिलने नहीं, बल्कि देखभाल और सहायता के लिए ध्यान देने का भाव भी रखता है; ‘सुधि ली’ उस आशय को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ἐν φυλακῇ
  choice: बंदीगृह में
  rationale: यह वास्तविक कारावास को दर्शाता है; ‘बंदीगृह’ dignified और सामान्य आधुनिक हिन्दी है।
- source_word: ὁ σωτήρ
  choice: उद्धारकर्ता
  rationale: यह σωτήρ का सीधा और धार्मिक रूप से तटस्थ समतुल्य है।
- source_word: ἐχαρίτωσέ με
  choice: मुझ पर कृपा की
  rationale: क्रिया अनुग्रह या कृपापूर्ण व्यवहार का भाव देती है; ‘कृपा की’ मूल की संक्षिप्तता और धार्मिक गूँज बनाए रखता है।
- source_word: ἔλυσέ με
  choice: मुझे खोल दिया
  rationale: δεσμοῖς के साथ λύω का अर्थ बंधन खोलना है; यह अनिवार्य रूप से पूर्ण रिहाई का अर्थ जोड़ने से बचता है।
theological_decisions:
- issue: परमेश्वर, प्रभु और उद्धारकर्ता—तीन उपाधियों का संबंध
  choice: मूल के अनुसार तीनों पद अलग-अलग बनाए रखे गए हैं
  alternative: तीनों को एक ही उपाधि से समान कर देना
  rationale: यूनानी पाठ क्रमशः ὁ Θεός, ὁ Κύριος और ὁ σωτήρ प्रयोग करता है; अनुवाद इनके संदर्भगत संबंध को सिद्धांतगत रूप से तय नहीं करता।
- issue: कोष्ठकबद्ध अंतिम वाक्य की पाठगत स्थिति
  choice: वाक्य को वर्ग कोष्ठकों में रखकर पादटिप्पणी दी गई है
  alternative: वाक्य को बिना संकेत मुख्य पाठ में रखना या निकाल देना
  rationale: स्रोत संस्करण में यह अंश वर्ग कोष्ठकों में है और पाठगत अनिश्चितता को प्रकाशित अनुवाद में दृश्यमान रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और लयात्मक गद्य अपनाया गया है। समानांतर वाक्य-रचना (‘मैं... था, और...’) मूल की गवाही-सदृश शैली को बनाए रखती है।
