  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/001.yaml
  text: 'The testament of Joseph, the eleventh son of Jacob and Rachel. A copy of the testament of Joseph. When he was about to die, he called his sons and his brothers and said to them:'
translation:
  language: hi
  text: 'याकूब और राहेल के ग्यारहवें पुत्र यूसुफ की वसीयत। यूसुफ की वसीयत की एक प्रति। जब वह मरने ही वाला था, तब उसने अपने पुत्रों और अपने भाइयों को बुलाया और उनसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयत
  rationale: मृत्यु से पहले दी गई अंतिम शिक्षा और कथन के इस साहित्यिक प्रसंग में ‘वसीयत’ स्वाभाविक और सटीक है।
- source_word: τοῦ ἑνδεκάτου υἱοῦ
  choice: ग्यारहवें पुत्र
  rationale: यूनानी क्रमसूचक पद और संबंध को सीधे सुरक्षित रखता है।
- source_word: Ἀντίγραφον
  choice: एक प्रति
  rationale: लिखित दस्तावेज़ की नकल अथवा प्रतिलिपि का सामान्य, स्पष्ट हिन्दी रूप।
- source_word: Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν
  choice: जब वह मरने पर था
  rationale: आसन्न मृत्यु का भाव सहज आधुनिक हिन्दी में व्यक्त होता है, बिना यह जोड़ने के कि मृत्यु कितनी निकट थी।
- source_word: καλέσας
  choice: बुलाकर
  rationale: पूर्वकालिक कृदन्त को मुख्य क्रिया से स्वाभाविक हिन्दी संबंध में रखता है।
