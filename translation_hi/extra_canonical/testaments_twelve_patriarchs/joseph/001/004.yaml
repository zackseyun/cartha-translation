base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/004.yaml
  text: My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers preserved me. They lowered me into a pit, and the Most High brought me up.
translation:
  language: hi
  text: मेरे भाइयों ने मुझसे घृणा की, पर प्रभु ने मुझसे प्रेम किया। वे मुझे मार डालना चाहते थे, पर मेरे पूर्वजों के परमेश्वर ने मेरी रक्षा की। उन्होंने मुझे एक गड्ढे में उतार दिया, और परमप्रधान ने मुझे ऊपर निकाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμίσησάν με
  choice: मुझसे घृणा की
  rationale: यूनानी क्रिया के प्रबल अर्थ को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: यहाँ संदर्भानुसार अभिप्राय हत्या करना है; ‘मार डालना’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐφύλαξέν με
  choice: मेरी रक्षा की
  rationale: φυλάσσω के संरक्षण और सुरक्षित रखने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: λάκκον
  choice: गड्ढे
  rationale: यूसुफ की कथा के संदर्भ में प्राकृतिक भूमिगत खड्ड या गड्ढे का सामान्य और स्पष्ट हिन्दी पद।
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का प्रचलित, संक्षिप्त और गरिमापूर्ण हिन्दी रूप।
- source_word: ἀνήγαγέν με
  choice: मुझे ऊपर निकाला
  rationale: नीचे उतारे जाने के समानांतर ऊपर लाने या निकालने की गति को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: Κύριος और Θεὸς के अलग-अलग ईश्वरीय संबोधन
  choice: ‘प्रभु’ और ‘परमेश्वर’ को अलग रखा गया
  alternative: दोनों के लिए एक ही पद प्रयोग करना
  rationale: मूल यूनानी की शब्दावली और काव्यात्मक समानांतरता को सुरक्षित रखता है, बिना कृत्रिम रूप से दोनों संबोधनों की व्याख्या किए।
- issue: τῶν πατέρων μου का संबंध
  choice: ‘मेरे पूर्वजों के परमेश्वर’
  alternative: ‘मेरे पितरों के परमेश्वर’
  rationale: पूर्वजों से संबद्ध परमेश्वर का अर्थ बनाए रखते हुए आधुनिक सामान्य हिन्दी में अधिक सहज है; किसी विशिष्ट धर्मसांप्रदायिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। तीन विरोधी समानांतर वाक्यों की लय तथा ‘उन्होंने नीचे उतारा—परमप्रधान ने ऊपर निकाला’ का स्पष्ट वैपरीत्य संरक्षित है।
