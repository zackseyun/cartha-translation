base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/007.yaml
  text: Amid slanders he also spoke in my defense. By the bitter words of dreams he rescued me. A servant, he exalted me.
translation:
  language: hi
  text: निंदाओं के बीच उसने मेरा पक्ष भी लिया। सपनों के कड़वे वचनों के द्वारा[a] उसने मुझे बचाया। मैं दास था, और उसने मुझे ऊँचा उठाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पूर्वसर्ग का अर्थ यहाँ “के द्वारा” भी हो सकता है और “में/के बीच” भी।
    reason: मूल ἐν की साधनवाचक और परिस्थितिवाचक व्याख्याओं के बीच वास्तविक अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: διαβολαῖς
  choice: निंदाओं
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक अर्थ; इसमें झूठे आरोप या बदनामी का भाव हो सकता है, पर मूल पाठ उन्हें स्पष्ट रूप से निर्दिष्ट नहीं करता।
- source_word: συνηγόρησέ μοι
  choice: उसने मेरा पक्ष लिया
  rationale: क्रिया का अर्थ किसी के समर्थन में बोलना या उसकी पैरवी करना है; यह आधुनिक हिन्दी में स्वाभाविक रूप से प्रतिरक्षा का भाव व्यक्त करता है।
- source_word: λόγοις ἐνυπνίων πικροῖς
  choice: सपनों के कड़वे वचनों
  rationale: λόγοις को ‘वचनों’ और ἐνυπνίων को संबंधकारक ‘सपनों के’ के रूप में रखा गया है; ‘कड़वे’ मूल विशेषण की तीव्रता बनाए रखता है।
- source_word: ἐρρύσατό με
  choice: उसने मुझे बचाया
  rationale: ῥύομαι संकट से छुड़ाने या बचाने को दर्शाता है; यहाँ ‘बचाया’ सहज और पर्याप्त व्यापक है।
- source_word: Δοῦλος
  choice: मैं दास था
  rationale: δοῦλος की सामाजिक स्थिति को ‘दास’ सटीक रूप से व्यक्त करता है; खंडित यूनानी वाक्य को स्पष्ट हिन्दी बनाने के लिए निहित प्रथम पुरुष और ‘था’ जोड़े गए हैं।
- source_word: ὕψωσέ με
  choice: उसने मुझे ऊँचा उठाया
  rationale: क्रिया के शाब्दिक और रूपक दोनों आयाम सुरक्षित रहते हैं—स्थिति या सम्मान में ऊपर उठाना।
theological_decisions:
- issue: खंडित समानांतर वाक्यों में कर्ता और प्रथम पुरुष की पूर्ति
  choice: ‘उसने’ तथा अंतिम वाक्य में ‘मैं’ को स्पष्ट किया गया
  alternative: 'यूनानी की तरह कर्ता-विहीन खंड: ‘दास, और मुझे ऊँचा उठाया’'
  rationale: यूनानी प्रसंग में कर्ता और कर्म निहित/व्यक्त हैं, लेकिन शब्दशः खंड हिन्दी में अस्वाभाविक और अस्पष्ट होता। किसी विशिष्ट धार्मिक पहचान को पाठ में नहीं जोड़ा गया।
- issue: अंतिम καὶ का संबंध
  choice: ‘फिर भी’
  alternative: ‘और’
  rationale: दासत्व और ऊँचा उठाए जाने के बीच निहित विरोध को स्वाभाविक हिन्दी में व्यक्त किया गया है; इसे कारणात्मक या सिद्धान्तगत संबंध नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। छोटे समानांतर वाक्यों से मूल की संक्षिप्त लय बचाई गई है; ‘दास’ को अधिक नरम ‘सेवक’ से नहीं बदला गया।
