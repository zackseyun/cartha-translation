source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἀδελφοί μου καὶ τέκνα μου⁵, Ἀκούσατε Ἰωσὴφ⁶ τοῦ ἠγαπημένου ὑπὸ⁷ Ἰσραήλ⁸, Ἐνωτίσασθε *ῥήματα τοῦ στόματός μου.⁹'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/002.yaml
  text: My brothers and children, listen to Joseph, the beloved of Israel. Pay attention, my children, to your father.
translation:
  language: hi
  text: मेरे भाइयो और मेरे बच्चो, इस्राएल के प्रिय यूसुफ की सुनो; मेरे मुँह की बातों पर कान लगाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί μου καὶ τέκνα μου
  choice: मेरे भाइयो और मेरे बच्चो
  rationale: दोनों संबोधनों को अलग-अलग और स्वाभाविक हिन्दी संबोधन-रूपों में सुरक्षित रखा गया है।
- source_word: τοῦ ἠγαπημένου ὑπὸ Ἰσραήλ
  choice: इस्राएल के प्रिय
  rationale: यूनानी कर्मवाच्य भाव ‘इस्राएल द्वारा प्रेम किया गया’ को सहज हिन्दी में व्यक्त करता है; ‘इस्राएल’ व्यक्ति याकूब का नाम है, जैसा स्रोत में है।
- source_word: Ἐνωτίσασθε
  choice: कान लगाओ
  rationale: क्रिया का मूल बिंब कान देकर ध्यानपूर्वक सुनने का है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ῥήματα τοῦ στόματός μου
  choice: मेरे मुँह की बातें
  rationale: स्रोत के शाब्दिक मौखिक बिंब को बनाए रखा गया है, न कि अंग्रेज़ी परामर्श-पाठ के ‘अपने पिता’ वाले पुनर्कथन को अपनाया गया है।
theological_decisions:
- issue: यूसुफ का ‘इस्राएल का प्रिय’ होना
  choice: इस्राएल के प्रिय
  alternative: इस्राएल द्वारा प्रेम किए गए
  rationale: दोनों अर्थतः संभव हैं; चुना हुआ रूप हिन्दी में अधिक सहज है और संबंध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: दूसरे आदेश का आशय
  choice: मेरे मुँह की बातों पर कान लगाओ
  alternative: मेरे बच्चो, अपने पिता पर ध्यान दो
  rationale: मूल यूनानी स्पष्टतः वक्ता के मुँह की बातों को सुनने को कहता है। अंग्रेज़ी परामर्श-पाठ का ‘अपने पिता’ स्रोत में नहीं है, इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक वसीयतनामा-शैली के अनुकूल है। ‘भाइयो’ और ‘बच्चो’ के मानक संबोधन रूप रखे गए हैं।
