id: T12P.JOS.1.5
reference: Testament of Joseph 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐπράθην *εἰς δουλείαν¹⁹, *Καὶ ὁ πάντων δεσπότης²⁰ ἠλευθέρωσέν με· Εἰς αἰχμαλωσίαν ἐλήφθην²¹, Καὶ ἡ κραταιὰ αὐτοῦ χεὶρ ἐβοήθησέ μοι· Ἐν λιμῷ συνεσχέθην, Καὶ αὐτὸς ὁ Κύριος διέθρεψέ με²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/005.yaml
  text: I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was confined by famine, and the Lord himself nourished me.
translation:
  language: hi
  text: मुझे दासता में बेच दिया गया, और सबके स्वामी ने मुझे स्वतंत्र कर दिया। मुझे बंदी बना लिया गया, और उसके शक्तिशाली हाथ ने मेरी सहायता की। अकाल ने मुझे जकड़ लिया, और स्वयं प्रभु ने मेरा पोषण किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς δουλείαν
  choice: दासता में
  rationale: ग्रीक पदबंध का अर्थ दास के रूप में बेचे जाने की अवस्था है; ‘दासता में’ आधुनिक हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: ὁ πάντων δεσπότης
  choice: सबके स्वामी
  rationale: δεσπότης अधिकार-संपन्न स्वामी को सूचित करता है और πάντων का व्यापक अर्थ ‘सबके’ से सुरक्षित रहता है।
- source_word: εἰς αἰχμαλωσίαν ἐλήφθην
  choice: मुझे बंदी बना लिया गया
  rationale: शाब्दिक ‘बंदीपन में लिया गया’ की अपेक्षा यह स्वाभाविक हिन्दी है और पकड़े जाकर बंदी होने का अर्थ बनाए रखती है।
- source_word: ἡ κραταιὰ αὐτοῦ χείρ
  choice: उसके सामर्थी हाथ
  rationale: κραταιά शक्ति और प्रभाव को व्यक्त करता है; ‘सामर्थी हाथ’ बाइबलीय गरिमा रखते हुए सहज है।
- source_word: ἐν λιμῷ συνεσχέθην
  choice: मैं अकाल में घिर गया
  rationale: συνέχομαι के रोके, जकड़े या चारों ओर से दबाए जाने के भाव को ‘घिर गया’ स्वाभाविक रूप में व्यक्त करता है; λιμός को प्रसंगानुसार ‘अकाल’ रखा गया है।
- source_word: αὐτὸς ὁ Κύριος διέθρεψέ με
  choice: प्रभु ने स्वयं मेरा पोषण किया
  rationale: αὐτός का बल ‘स्वयं’ से और διατρέφω के निरंतर खिलाने/पालने के भाव का ‘पोषण किया’ से प्रतिनिधित्व होता है।
theological_decisions:
- issue: δεσπότης और Κύριος के अलग संबोधन
  choice: क्रमशः ‘स्वामी’ और ‘प्रभु’
  alternative: दोनों के लिए ‘प्रभु’
  rationale: मूल में प्रयुक्त दो अलग यूनानी पदों का भेद बनाए रखना अर्थगत बनावट और काव्यात्मक समानांतरता को सुरक्षित रखता है।
- issue: दैवी सहायता में ‘हाथ’ का रूपक
  choice: ‘उसके सामर्थी हाथ ने मेरी सहायता की’ को अक्षुण्ण रखा
  alternative: ‘उसने अपनी सामर्थ्य से मेरी सहायता की’
  rationale: मूल का मानवीकरणयुक्त बाइबलीय रूपक हटाने से धार्मिक और साहित्यिक स्वर कमजोर पड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। तीन विपत्तियों और तीन दैवी प्रत्युत्तरों की समानांतर संरचना बनाए रखने के लिए प्रत्येक वाक्य में ‘पर’ का प्रयोग किया गया है।
