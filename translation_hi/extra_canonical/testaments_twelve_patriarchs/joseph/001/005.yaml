revisions:
- from: मुझे दासता में बेच दिया गया, पर सबके स्वामी ने मुझे स्वतंत्र कर दिया। मुझे बंदी बना लिया गया, पर उसके सामर्थी हाथ ने मेरी सहायता की। मैं अकाल में घिर गया, पर प्रभु ने स्वयं मेरा पोषण किया।
  to: मुझे दासता में बेच दिया गया, और सबके स्वामी ने मुझे स्वतंत्र कर दिया। मुझे बंदी बना लिया गया, और उसके शक्तिशाली हाथ ने मेरी सहायता की। अकाल ने मुझे जकड़ लिया, और स्वयं प्रभु ने मेरा पोषण किया।
  rationale: The revision replaces interpretively adversative conjunctions with the source’s simple coordination, sharpens the famine clause to express the passive constraining sense of συνεσχέθην, and makes the ‘mighty hand’ idiom more natural in modern standard Hindi. The distinct titles ‘स्वामी’ and ‘प्रभु’ are retained. No footnote content or anchors are supplied in the draft that requires reproduction.
