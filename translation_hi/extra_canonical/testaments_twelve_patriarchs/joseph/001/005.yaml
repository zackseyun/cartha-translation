review_pass:
  verdict: revise
  source_fidelity: The three statements and corresponding divine actions are conveyed accurately. However, Greek καί is coordinative in each pair, not adversative; translating it as ‘पर’ introduces a contrast absent from the source. The final clause is better rendered with famine as the constraining agent, reflecting ἐν λιμῷ συνεσχέθην.
  naturalness: The draft is clear and appropriately dignified. ‘उसके सामर्थी हाथ’ is understandable but somewhat less idiomatic than ‘उसके शक्तिशाली हाथ.’ ‘अकाल ने मुझे जकड़ लिया’ is natural modern Hindi and preserves the sense of being constrained by famine.
  terminology: ‘दासता,’ ‘स्वामी,’ ‘बंदी,’ and ‘प्रभु’ appropriately preserve the source’s distinctions, including δεσπότης versus Κύριος. No doctrinally loaded alteration is needed.
  issues:
  - severity: medium
    issue: ‘पर’ is used in all three clauses for Greek καί.
    rationale: The source joins each affliction to God’s response with simple ‘and’; an adversative conjunction adds an interpretive contrast not explicitly present in the Greek.
  - severity: low
    issue: ‘अकाल में घिर गया’ only indirectly represents the constraining force of συνεσχέθην.
    rationale: ‘अकाल ने मुझे जकड़ लिया’ more directly conveys being held fast or confined by famine while remaining idiomatic.
  - severity: low
    issue: ‘सामर्थी हाथ’ is somewhat marked in modern Hindi.
    rationale: ‘शक्तिशाली हाथ’ is more natural while retaining the biblical metaphor and the force of κραταιά.
  revised_text: मुझे दासता में बेच दिया गया, और सबके स्वामी ने मुझे स्वतंत्र कर दिया। मुझे बंदी बना लिया गया, और उसके शक्तिशाली हाथ ने मेरी सहायता की। अकाल ने मुझे जकड़ लिया, और स्वयं प्रभु ने मेरा पोषण किया।
  revised_footnotes: []
