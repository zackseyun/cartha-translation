base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/003.yaml
  text: In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.
translation:
  language: hi
  text: मैंने अपने जीवन में ईर्ष्या और मृत्यु को देखा, और मैं भटकाया नहीं गया, बल्कि प्रभु के सत्य में बना रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: ईर्ष्या
  rationale: यह यूनानी संज्ञा द्वेषपूर्ण जलन या ईर्ष्या को दर्शाती है; यहाँ सीधा और स्वाभाविक हिन्दी समतुल्य उपयुक्त है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: मूल पाठ के सामान्य और प्रत्यक्ष अर्थ को बनाए रखता है।
- source_word: οὐκ ἐπλανήθην
  choice: मैं भटका नहीं
  rationale: निष्क्रिय रूप का अर्थ मार्ग से बहकाए या भटकाए जाने का हो सकता है; हिन्दी में ‘भटका नहीं’ स्वाभाविक रहते हुए यह भाव व्यक्त करता है।
- source_word: ἔμενα
  choice: बना रहा
  rationale: स्थिर रहने और निरंतर टिके रहने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  choice: प्रभु की सच्चाई में
  rationale: γενitive को ‘प्रभु की’ के रूप में खुला रखा गया है; ‘सच्चाई’ सत्यता, निष्ठा और सत्य के क्षेत्र—इन संभावित अर्थों को कठोरता से सीमित नहीं करती।
theological_decisions:
- issue: ‘प्रभु की सच्चाई’ का अर्थ
  choice: प्रभु की सच्चाई में
  alternative: प्रभु के सत्य में
  rationale: मूल ἀλήθεια सत्य, सत्यता या निष्ठा का संकेत दे सकता है। ‘सच्चाई’ इस संदर्भ में नैतिक निष्ठा का स्वाभाविक भाव देती है, बिना किसी विशेष सिद्धान्तगत अर्थ को आरोपित किए।
- issue: ईर्ष्या और मृत्यु को ‘देखना’
  choice: ईर्ष्या और मृत्यु को देखा
  alternative: ईर्ष्या और मृत्यु का सामना किया
  rationale: मूल εἶδον का दृश्य रूपक जानबूझकर सुरक्षित रखा गया है; इसे केवल ‘सामना किया’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फिर भी’ यूनानी καὶ…ἀλλʼ के विरोधात्मक प्रवाह को स्वाभाविक हिन्दी में स्पष्ट करता है। मूल में कोई ऐसी पाठगत अस्पष्टता नहीं है जिसके लिए प्रकाशन-पाठ में पादटिप्पणी आवश्यक हो।
