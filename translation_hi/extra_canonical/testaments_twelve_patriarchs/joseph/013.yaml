  source_fidelity: पद 1 में μεταπωλεῖς का अर्थ उन्हें ‘फिर से बेचता है’ है; मसौदे का ‘दास बनाकर बेच देता है’ पुनर्विक्रय के इस स्पष्ट पक्ष को कुछ धुंधला करता है। अन्य पद यूनानी पाठ के प्रति सामान्यतः विश्वसनीय हैं। विशेषतः पद 3 में यूनानी में अंग्रेज़ी audit trail का ‘fell upon him’ नहीं है, और मसौदा उसे उचित रूप से नहीं जोड़ता।
  naturalness: भाषा आधुनिक, प्रवाहपूर्ण और प्रसंगानुकूल है। ‘दलाल’, ‘मोल लिया’, और दण्ड-वर्णन के वाक्य स्वाभाविक हिन्दी हैं।
  terminology: δοῦλος/ἐλεύθερος के लिए ‘दास/स्वतंत्र’ और μετάβολος के लिए ‘दलाल’ उपयुक्त हैं। पद 1 में παῖδας के लिए ‘दासों के रूप में’ कहना स्रोत के आरोप को अधिक सटीक रखेगा।
  issues:
  - severity: medium
    issue: पद 1 में μεταπωλεῖς का पुनर्विक्रयार्थ पर्याप्त स्पष्ट नहीं है।
    rationale: यूनानी में ‘कनान देश से लोगों को चुराता है और उन्हें फिर दासों के रूप में बेचता है’ है। ‘दास बनाकर बेच देता है’ दास बनाने का अर्थ तो देता है, किंतु ‘फिर बेचता’ का स्पष्ट अर्थ नहीं देता।
  revised_text: '1. परन्तु पेंतेफ्रीस ने उसकी बातों पर विश्वास करके उस दलाल को बुलवाया और उससे कहा, “तेरे विषय में मैं यह क्या सुन रहा हूँ—कि तू कनान देश से लोगों को चुराता और उन्हें फिर दासों के रूप में बेचता है?”


    2. दलाल उसके पैरों पर गिर पड़ा और विनती करते हुए बोला, “स्वामी, मैं आपसे विनती करता हूँ, मैं नहीं जानता कि आप क्या कह रहे हैं।”


    3. पेंतेफ्रीस ने उससे कहा, “तो फिर यह इब्रानी लड़का कहाँ से आया है?” उसने उत्तर दिया, “इश्माएलियों ने इसे मेरे पास तब तक के लिए सौंपा है, जब तक वे लौट न आएँ।”


    4. परन्तु उसने उसकी बात पर विश्वास नहीं किया, बल्कि आज्ञा दी कि उसे नंगा करके पीटा जाए। जब वह अपनी उसी बात पर अड़ा रहा, तब पेंतेफ्रीस ने कहा, “तो उस जवान को लाया जाए।”


    5. जब मुझे भीतर लाया गया, तो मैंने पेंतेफ्रीस को दण्डवत किया, क्योंकि वह फ़िरौन के अधिकारियों में पद के अनुसार तीसरे स्थान पर था।


    6. उसने मुझे उस दलाल से अलग करके मुझसे पूछा, “तू दास है या स्वतंत्र?” मैंने कहा, “दास।”


    7. उसने पूछा, “किसका?” मैंने कहा, “इश्माएलियों का।”


    8. उसने कहा, “तू उनका दास कैसे बना?” मैंने उत्तर दिया, “उन्होंने मुझे कनान देश से मोल लिया था।”


    9. उसने मुझसे कहा, “तू निश्चय ही झूठ बोल रहा है।” और तुरन्त उसने आज्ञा दी कि मुझे भी नंगा करके पीटा जाए।'
  revised_footnotes: []
  revision_rationale: केवल पद 1 में पुनर्विक्रय के अर्थ को स्पष्ट करने के लिए ‘फिर दासों के रूप में बेचता है’ किया गया है। इससे मूल के μεταπωλεῖς और παῖδας दोनों सुरक्षित रहते हैं, जबकि शेष अनुवाद यथावत रखा गया है।
