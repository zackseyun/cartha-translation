lexical_decisions:
- source_word: μετάβολος
  choice: दलाल
  rationale: यहाँ व्यक्ति दासों की खरीद-बिक्री के मध्यस्थ के रूप में कार्य करता है; आधुनिक हिन्दी में ‘दलाल’ इस भूमिका को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ψυχὰς
  choice: लोगों को
  rationale: शाब्दिक अर्थ ‘प्राण/आत्माएँ’ है, पर इस आरोप में इसका सामी प्रयोग ‘व्यक्तियों/मनुष्यों’ के अर्थ में है; ‘लोगों’ से मानव-तस्करी का आशय स्पष्ट रहता है।
- source_word: παῖδας
  choice: दास बनाकर
  rationale: इस संदर्भ में παῖς आश्रित सेवक या दास को सूचित करता है; पुनर्विक्रय और बंधन की कठोरता बनाए रखने के लिए ‘दास’ चुना गया है।
- source_word: παῖς ὁ Ἑβραῖος
  choice: यह इब्रानी लड़का
  rationale: παῖς में आयु और सेवक-दशा दोनों की गुंजाइश है; प्रसंग में आगे νεανίσκος आने के कारण यहाँ ‘लड़का’ प्राकृतिक है, जबकि दासत्व अगले प्रश्नों में स्पष्ट है।
- source_word: γυμνὸν τύπτεσθαι
  choice: नंगा करके पीटा जाए
  rationale: यूनानी पाठ दण्ड के समय नग्न किए जाने और पीटे जाने दोनों को स्पष्ट रूप से कहता है; दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: προσεκύνησα
  choice: दण्डवत किया
  rationale: यहाँ उच्च अधिकारी के सामने सम्मानपूर्वक झुकने का आशय है; ‘दण्डवत’ उस बाह्य क्रिया को व्यक्त करता है, बिना इसे अनिवार्यतः उपासना बनाने के।
- source_word: δοῦλος / ἐλεύθερος
  choice: दास / स्वतंत्र
  rationale: कानूनी-सामाजिक विरोध को स्पष्ट रखने के लिए प्रबल और सटीक हिन्दी पद चुने गए हैं।
- source_word: ἐπριάσαντό με
  choice: मुझे ... मोल लिया था
  rationale: क्रिया खरीदने को स्पष्ट करती है; ‘मोल लिया’ गरिमापूर्ण और सहज हिन्दी है।
theological_decisions:
- issue: ψυχὰς का मानव-विषयक अर्थ
  choice: लोगों को चुराता
  alternative: आत्माओं को चुराता
  rationale: यह कथन मनुष्यों के अपहरण और दास-विक्रय का आरोप है, न कि आत्मिक उद्धार या विनाश का धर्मवैज्ञानिक कथन; इसलिए अर्थगत मुहावरा अपनाया गया।
- issue: προσκυνέω की धार्मिक अथवा दरबारी व्याख्या
  choice: पेंतेफ्रीस को दण्डवत किया
  alternative: पेंतेफ्रीस की उपासना की
  rationale: संदर्भ फ़िरौन के एक उच्च अधिकारी के सामने दरबारी सम्मान का है; धार्मिक उपासना का अर्थ आरोपित नहीं किया गया।
- issue: दासत्व की शब्दावली
  choice: दास
  alternative: सेवक
  rationale: पाठ में खरीद, स्वामित्व और स्वतंत्रता के विपरीत सामाजिक स्थिति मौजूद है; ‘सेवक’ उस बंधन को अनावश्यक रूप से हल्का कर सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। संवादों में सामाजिक दूरी के अनुसार पेंतेफ्रीस की ओर से ‘तू’ और दलाल की ओर से आदरसूचक ‘आप’ रखा गया है। यूनानी पाठ के अनुसार पद 3 में अंग्रेज़ी परामर्श-पाठ का अतिरिक्त ‘fell upon him’ नहीं अपनाया गया। पद 5 के अस्पष्ट/पाठ-संदिग्ध अंग्रेज़ी ‘he said’ को मूल यूनानी के आधार पर नहीं जोड़ा गया। पद 9 में उपलब्ध यूनानी वाक्य पूरा है, इसलिए अनावश्यक त्रिबिंदु के स्थान पर ‘पीटा जाए’ देकर वाक्य पूर्ण किया गया।
