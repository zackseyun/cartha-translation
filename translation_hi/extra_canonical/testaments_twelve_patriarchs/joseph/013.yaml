  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013.yaml
  text: '1. But Pentephris, persuaded by her words, ordered the broker to be brought, and said to him, “What is this that I hear concerning you—that you steal souls from the land of Canaan and sell them again as servants?”


    2. But the broker fell at his feet and begged him, saying, “I beg you, lord, I do not know what you are saying.”


    3. And Pentephris fell upon him and said to him, “From where, then, is this Hebrew servant before me?” And he said, “The Ishmaelites entrusted him to me until they return.”


    4. But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”


    5. And when I was brought in, I bowed down to Pentephris, for he was, he said, third in rank among Pharaoh’s rulers.


    6. And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”


    7. And he said, “Whose?” And I said, “The Ishmaelites’.”


    8. But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”


    9. But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked...'
translation:
  language: hi
  text: '1. परन्तु पेंतेफ्रीस ने उसकी बातों पर विश्वास करके उस दलाल को बुलवाया और उससे कहा, “तेरे विषय में मैं यह क्या सुन रहा हूँ—कि तू कनान देश से लोगों को चुराता और उन्हें फिर दासों के रूप में बेचता है?”


    2. दलाल उसके पैरों पर गिर पड़ा और विनती करते हुए बोला, “स्वामी, मैं आपसे विनती करता हूँ, मैं नहीं जानता कि आप क्या कह रहे हैं।”


    3. पेंतेफ्रीस ने उससे कहा, “तो फिर यह इब्रानी लड़का कहाँ से आया है?” उसने उत्तर दिया, “इश्माएलियों ने इसे मेरे पास तब तक के लिए सौंपा है, जब तक वे लौट न आएँ।”


    4. परन्तु उसने उसकी बात पर विश्वास नहीं किया, बल्कि आज्ञा दी कि उसे नंगा करके पीटा जाए। जब वह अपनी उसी बात पर अड़ा रहा, तब पेंतेफ्रीस ने कहा, “तो उस जवान को लाया जाए।”


    5. जब मुझे भीतर लाया गया, तो मैंने पेंतेफ्रीस को दण्डवत किया, क्योंकि वह फ़िरौन के अधिकारियों में पद के अनुसार तीसरे स्थान पर था।


    6. उसने मुझे उस दलाल से अलग करके मुझसे पूछा, “तू दास है या स्वतंत्र?” मैंने कहा, “दास।”


    7. उसने पूछा, “किसका?” मैंने कहा, “इश्माएलियों का।”


    8. उसने कहा, “तू उनका दास कैसे बना?” मैंने उत्तर दिया, “उन्होंने मुझे कनान देश से मोल लिया था।”


    9. उसने मुझसे कहा, “तू निश्चय ही झूठ बोल रहा है।” और तुरन्त उसने आज्ञा दी कि मुझे भी नंगा करके पीटा जाए।'
