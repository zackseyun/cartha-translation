source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐφόβουντο γὰρ τὸν *πατέρα μου²⁵, ἵνα μὴ *ἐλθὼν ἐν αὐτοῖς ποιήσῃ²⁶ ἐκδίκησιν κινδύνου²⁷. ἤκουον²⁸ γὰρ ὅτι μέγας ἐστὶ παρὰ Θεῷ²⁹ καὶ³⁰ ἀνθρώποις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/005.yaml
  text: For they feared my father, lest he come among them and take vengeance for the danger; for they had heard that he was great before God and men.
translation:
  language: hi
  text: क्योंकि वे मेरे पिता से डरते थे कि कहीं वह उनके बीच आकर उस संकट का बदला न लें; क्योंकि उन्होंने सुन रखा था कि वह परमेश्वर और मनुष्यों की दृष्टि में महान हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: यह यूनानी पद का स्वाभाविक और सीधा अर्थ देता है तथा पिता के उनके बीच आने की बात सुरक्षित रखता है।
- source_word: ποιήσῃ ἐκδίκησιν κινδύνου
  choice: उस संकट का बदला लें
  rationale: ἐκδίκησις को ‘बदला’ और κινδύνου को संबंधकारक रूप में ‘उस संकट का’ देकर कठिन किंतु स्रोत-संगत अभिव्यक्ति को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
- source_word: μέγας
  choice: महान
  rationale: यह ‘बड़ा/महान’ के मूल अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρὰ Θεῷ καὶ ἀνθρώποις
  choice: परमेश्वर और मनुष्यों की दृष्टि में
  rationale: παρά के यहाँ प्रतिष्ठा या मान्यता-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करते हुए दोनों क्षेत्रों—परमेश्वर और मनुष्य—को यथावत रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर और मनुष्यों के सामने/निकट महान’ का आशय
  choice: परमेश्वर और मनुष्यों की दृष्टि में महान
  alternative: परमेश्वर और मनुष्यों के सामने महान
  rationale: ‘दृष्टि में’ प्रतिष्ठा या मान्यता का भाव स्पष्ट करता है, पर यह नहीं बताता कि महानता का आधार क्या था; इस प्रकार पाठ की व्यापकता और तनाव सुरक्षित रहते हैं।
- issue: ἐκδίκησιν κινδύνου में संबंधकारक κινδύνου
  choice: उस संकट का बदला
  alternative: उनसे बदला / संकट के कारण प्रतिशोध
  rationale: स्रोत की असामान्य संरचना को किसी निश्चित कारण, लक्ष्य या पीड़ित के रूप में चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। आदरसूचक एकवचन के अनुरूप ‘लें’ और ‘हैं’ प्रयुक्त हैं।
