base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/002.yaml
  text: “Why did you say that you were a servant? For behold, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”
translation:
  language: hi
  text: “तुमने अपने आप को दास क्यों बताया? देखो, हमें पता चला है कि तुम कनान देश के एक प्रतिष्ठित व्यक्ति के पुत्र हो, और तुम्हारे पिता अब भी तुम्हारे लिए टाट ओढ़कर और राख में बैठकर शोक मना रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον
  choice: दास
  rationale: यूनानी शब्द सामाजिक अधीनता और दासत्व को व्यक्त करता है; ‘सेवक’ की अपेक्षा ‘दास’ स्रोत के अर्थ को अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: ἀνδρὸς μεγάλου
  choice: एक महान पुरुष
  rationale: शाब्दिक अर्थ और उस व्यक्ति की प्रतिष्ठा या ऊँचे पद—दोनों की संभावित व्यापकता को बनाए रखता है।
- source_word: πενθεῖ
  choice: शोक मना रहे हैं
  rationale: यह क्रिया गहरे मातमी शोक को सूचित करती है; स्वाभाविक आधुनिक हिन्दी में यही उपयुक्त अभिव्यक्ति है।
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: टाट ओढ़कर और राख में बैठकर
  rationale: यूनानी मुहावरे के शोक-संबंधी सांस्कृतिक अर्थ को सहज हिन्दी में मूर्त रूप देता है, बिना उसके प्रतीकों को हटाए।
theological_decisions: []
translation_notes:
  register: संवादात्मक किंतु गरिमापूर्ण आधुनिक मानक हिन्दी। ‘देखो’ से ἰδού की प्रत्यक्षता रखी गई है। वाक्य में स्रोत का प्रश्न, प्राप्त जानकारी, और पिता के निरंतर शोक का क्रम सुरक्षित है।
