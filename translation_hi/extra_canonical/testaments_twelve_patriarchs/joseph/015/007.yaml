  text: And they came near and asked me, saying, “Say that you were bought by us with silver, and he will release us.”
translation:
  language: hi
  text: वे मेरे पास आए और मुझसे अनुरोध करने लगे, “कह दो कि हमने तुम्हें चाँदी देकर खरीदा था, और वह हमें छोड़ देगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: मेरे पास आए
  rationale: क्रिया का अर्थ निकट आना या पास आना है; प्रसंग में ‘मेरे पास’ स्वाभाविक और स्पष्ट है।
- source_word: ᾔτουν με
  choice: मुझसे विनती करते हुए
  rationale: αἰτέω यहाँ किसी से अनुरोध करने का भाव रखता है; ‘विनती’ उनकी मुक्ति की याचना की तीव्रता को सहज हिन्दी में व्यक्त करती है।
- source_word: ἐν ἀργυρίῳ ἠγοράσθης ἡμῖν
  choice: हमने तुम्हें चाँदी देकर खरीदा था
  rationale: यूनानी निष्क्रिय रचना और कर्तृवाचक दैटिव को स्वाभाविक हिन्दी में सक्रिय रूप दिया गया है; ἐν ἀργυρίῳ भुगतान के साधन को दर्शाता है।
- source_word: κἀκεῖνος ἀπολῦσαι ἡμᾶς ἔχει
  choice: तब वह हमें छोड़ देगा
  rationale: ἔχει + infinitive को भावी परिणाम के रूप में समझते हुए सहज हिन्दी भविष्यकाल में रखा गया है; ἀπολύω का प्रसंगगत अर्थ हिरासत से छोड़ना है।
