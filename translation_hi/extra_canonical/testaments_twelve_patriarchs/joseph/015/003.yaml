base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/003.yaml
  text: When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”
translation:
  language: hi
  text: ये बातें सुनकर मेरा कलेजा फट गया और मेरा हृदय पिघल गया। मेरा बहुत रोने का मन हुआ, पर मैंने अपने आप को रोक लिया, ताकि मैं अपने भाइयों को लज्जित न करूँ। और मैंने उनसे कहा, “मैं नहीं जानता; मैं दास हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: मेरा कलेजा फट-सा गया
  rationale: यह यूनानी मुहावरा गहरे आंतरिक भाव-विघटन को व्यक्त करता है। ‘कलेजा’ आधुनिक हिन्दी में भावनाओं के अंतरतम का स्वाभाविक चित्र देता है, जबकि ‘फट-सा गया’ मूल की तीव्रता को बिना शाब्दिक शारीरिक दावे के बनाए रखता है।
- source_word: ἡ καρδία μου ἐτάκη
  choice: मेरा हृदय पिघल गया
  rationale: मूल रूपक को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ἤθελον δακρῦσαι πάνυ
  choice: मेरा बहुत रोने को मन हुआ
  rationale: इच्छा और उसकी तीव्रता दोनों को बोलचाल-सुलभ किंतु गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐπέσχον ἐμαυτόν
  choice: मैंने अपने आप को रोक लिया
  rationale: आत्म-संयम की क्रिया का स्पष्ट और स्वाभाविक अनुवाद।
- source_word: αἰσχύνω
  choice: लज्जित करूँ
  rationale: यहाँ अर्थ भाइयों को शर्मिंदा अथवा अपमानित करने का है; ‘लज्जित’ प्रसंग की गरिमा और मूल अर्थ दोनों रखता है।
- source_word: δοῦλός εἰμι
  choice: मैं तो दास हूँ
  rationale: ‘दास’ प्राचीन सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक ठीक ढंग से व्यक्त करता है; ‘तो’ उत्तर में वक्ता की प्रस्तुत पहचान पर स्वाभाविक बल देता है।
