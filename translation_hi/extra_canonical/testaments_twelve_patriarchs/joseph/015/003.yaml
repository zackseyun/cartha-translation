review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the sequence and central images: inward distress, melting heart, desire to weep, self-restraint to avoid shaming the brothers, and Joseph''s reply. The softening particle in “फट-सा गया” slightly reduces the unqualified force of διελύθη (“was torn apart”). “तो” in “मैं तो दास हूँ” adds emphasis not explicit in the Greek.'
  naturalness: The register is clear and suitably dignified. However, “मेरा बहुत रोने को मन हुआ” is less idiomatic than “मेरा बहुत रोने का मन हुआ.”
  terminology: “कलेजा” naturally conveys σπλάγχνα in an emotive Hindi idiom, “हृदय” appropriately retains καρδία, “लज्जित” fits αἰσχύνω, and “दास” correctly represents the social status denoted by δοῦλος rather than weakening it to “सेवक.”
  issues:
  - severity: low
    issue: The expression “फट-सा गया” qualifies the image of inner parts being torn apart.
    rationale: The Greek uses an unqualified verb; removing “-सा” better preserves its intensity while retaining natural Hindi idiom.
  - severity: low
    issue: “मेरा बहुत रोने को मन हुआ” is awkwardly formed.
    rationale: Modern standard Hindi normally uses “रोने का मन हुआ” in this construction.
  - severity: low
    issue: “तो” adds an unnecessary contrastive/emphatic nuance in the final statement.
    rationale: δοῦλός εἰμι is simply “I am a slave.”
  revised_text: ये बातें सुनकर मेरा कलेजा फट गया और मेरा हृदय पिघल गया। मेरा बहुत रोने का मन हुआ, पर मैंने अपने आप को रोक लिया, ताकि मैं अपने भाइयों को लज्जित न करूँ। और मैंने उनसे कहा, “मैं नहीं जानता; मैं दास हूँ।”
