  text: Then, indeed, they decided to sell me, so that I might not be found in their hands.
translation:
  language: hi
  text: तब उन्होंने निश्चय किया कि मुझे बेच दें, ताकि मैं उनके हाथों में न पाया जाऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε οὖν
  choice: तब
  rationale: Τότε का स्वाभाविक काल-संकेत रखा गया है। संदिग्ध/पाठांतरयुक्त οὖν को अलग से बल देकर अनावश्यक रूप से नहीं उभारा गया।
- source_word: ἐβουλεύσαντο
  choice: निश्चय किया
  rationale: मध्यवाच्य क्रिया यहाँ आपस में विचार करके निर्णय लेने का भाव देती है; ‘निश्चय किया’ आधुनिक हिन्दी में संक्षिप्त और सटीक है।
- source_word: πωλῆσαί με
  choice: कि मुझे बेच दें
  rationale: अनन्त क्रिया को हिन्दी में उद्देश्य/निर्णय की स्वाभाविक पूरक उपवाक्य-रचना से व्यक्त किया गया है।
- source_word: ἵνα μὴ εὑρεθῶ ἐν ταῖς χερσὶν αὐτῶν
  choice: ताकि मैं उनके हाथों में न पाया जाऊँ
  rationale: मूल के प्रयोजनसूचक ἵνα और कर्मवाच्य εὑρεθῶ को बनाए रखते हुए ‘उनके हाथों में’ की रूपकात्मक अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘उनके हाथों में पाया जाना’ का आशय
  choice: शाब्दिक रूपक को बनाए रखा
  alternative: ‘उनके कब्ज़े में न मिलूँ’ या ‘मेरे साथ जो हुआ उसका दोष उन पर न आए’
  rationale: मूल वाक्यांश उत्तरदायित्व, कब्ज़े या प्रत्यक्ष उपस्थिति की ओर संकेत कर सकता है; किसी एक व्याख्या को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास मूल यूनानी के निकट है, पर हिन्दी में स्वाभाविक रूप से प्रवाहित होता है।
