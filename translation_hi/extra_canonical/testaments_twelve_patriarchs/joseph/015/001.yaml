reference: Testament of Joseph 15:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἤθελε γὰρ ὁρᾶν με²⁴ ἐν πόθῳ ⌈ἁμαρτίας⌉²⁵. *ἐγὼ δὲ²⁶ ἠγνόουν ἐν²⁷ πᾶσι τούτοις²⁸. *Εἶπε δὲ πρὸς αὐτήν²⁹· Οὐκ ἐστὶ *τοῦτο τοῖς³⁰ Αἰγυπτίοις πρὸ ἀποδείξεως ἀφαιρεῖσθαι τὰ ἀλλότρια. Ταῦτα ⌜οὖν⌉³¹ εἶπε *περὶ τοῦ μεταβόλου³². *Ὁ δὲ παῖς³³ *ὀφείλει ἐγκατάκλειστος εἶναι³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/001.yaml
  text: For she wanted to see me in sinful desire, but I was unaware of all these things. And he said to her, “This is not the custom among the Egyptians, to take what belongs to others before proof is given.” So he said this concerning the merchant. But the boy ought to be kept confined.
translation:
  language: hi
  text: क्योंकि वह मुझे पापपूर्ण लालसा से देखना चाहती थी,[a] पर मैं इन सब बातों से अनजान था। तब उसने उस स्त्री से कहा, “मिस्रियों में यह रीति नहीं है कि प्रमाण प्रस्तुत किए जाने से पहले किसी दूसरे की वस्तु ले ली जाए।” उसने यह बात उस व्यापारी के विषय में कही। पर लड़के को बंद रखा जाना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप: “पाप की लालसा में।”'
    reason: मूल यूनानी की षष्ठी-रचना और उसकी संभावित अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: पापपूर्ण लालसा से
  rationale: शाब्दिक रूप ‘पाप की लालसा में’ है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और इच्छा के अनैतिक स्वरूप को बनाए रखता है।
- source_word: ἠγνόουν
  choice: अनजान था
  rationale: यहाँ अर्थ घटनाओं या मंशाओं से अवगत न होना है, न कि जानबूझकर उपेक्षा करना।
- source_word: πρὸ ἀποδείξεως
  choice: प्रमाण मिलने से पहले
  rationale: ἀπόδειξις का मूल भाव प्रमाण या सत्यापन है; वाक्य यह स्पष्ट नहीं करता कि किस दावे का प्रमाण अपेक्षित था।
- source_word: τὰ ἀλλότρια
  choice: किसी दूसरे की वस्तु
  rationale: नपुंसकलिंग बहुवचन का सामूहिक अर्थ ‘दूसरों की वस्तुएँ/पराया माल’ है; हिन्दी में एकवचन सामूहिक अभिव्यक्ति अधिक सहज है।
- source_word: μεταβόλου
  choice: व्यापारी
  rationale: यह शब्द लेन-देन या अदला-बदली करने वाले व्यक्ति को सूचित कर सकता है; प्रसंग में व्यापारी/सौदागर उपयुक्त है, जबकि ‘विनिमय’ निर्जीव प्रक्रिया बना देता है।
- source_word: ἐγκατάκλειστος εἶναι
  choice: बंद रखा जाना चाहिए
  rationale: यह पद किसी को निगरानी में भीतर बंद रखने का भाव देता है; ‘कैद’ संभव है, पर मूल में औपचारिक कारावास अनिवार्य नहीं।
theological_decisions:
- issue: पाप और लालसा का संबंध
  choice: पापपूर्ण लालसा
  alternative: पाप की लालसा
  rationale: षष्ठी ἁμαρτίας को स्वाभाविक हिन्दी में गुणवाचक रूप दिया गया है, पर इसे किसी विशेष पाप-सिद्धांत से नहीं जोड़ा गया।
- issue: वक्ता की पहचान
  choice: उसने उस स्त्री से कहा
  alternative: मैंने उस स्त्री से कहा
  rationale: उपलब्ध यूनानी पाठ में स्पष्ट तृतीय पुरुष εἶπε है। कथानक में वक्ता की पहचान अस्पष्ट रह सकती है, इसलिए अंग्रेज़ी परामर्श-पाठ के अनुरूप तृतीय पुरुष रखा गया और यूसुफ को वक्ता मानकर पाठ नहीं बदला गया।
- issue: अंतिम कथन का उद्धरण-संबंध
  choice: उद्धरण के रूप में, पर नए वाक्य में
  alternative: कथाकार का स्वतंत्र कथन
  rationale: यूनानी में प्रत्यक्ष कथन का आरंभ पहले हो चुका है और समापन-चिह्न मूल परंपरा का निश्चित भाग नहीं; इसे उसी कथन की स्वाभाविक निरंतरता माना गया, पर अनुच्छेद की टूटन को नए वाक्य से दिखाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘रीति’, ‘प्रमाण’ और ‘बंद रखा जाना’ औपचारिकता तथा स्पष्टता के बीच संतुलन रखते हैं।
