  text: Then the trader said to them, “Free me from the judgment of Potiphar.”
translation:
  language: hi
  text: तब व्यापारी ने उनसे कहा, “मुझे पोतीपर के न्याय से छुड़ाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μετάβολος
  choice: व्यापारी
  rationale: संदर्भ में यह व्यक्ति व्यापार या सौदे से जुड़ा हुआ है; इसलिए सामान्य आधुनिक हिन्दी में “व्यापारी” स्वाभाविक है।
- source_word: Λύσατέ με
  choice: मुझे … से छुड़ाओ
  rationale: λύω यहाँ किसी बंधन या संकट से मुक्त करने का भाव देता है; “छुड़ाओ” इस निवेदन को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς κρίσεως
  choice: के न्याय से
  rationale: κρίσις का मूल अर्थ न्याय, निर्णय या न्यायिक दंड हो सकता है। “न्याय” मूल की व्यापकता बनाए रखता है और केवल “दंड” मानकर अर्थ को सीमित नहीं करता।
- source_word: Πεντεφρί
  choice: पोतीपर
  rationale: यूनानी नामरूप Πεντεφρί को हिन्दी पाठकों के लिए परिचित बाइबलीय नाम “पोतीपर” के रूप में दिया गया है।
