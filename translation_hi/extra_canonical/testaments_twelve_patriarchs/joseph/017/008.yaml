base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/008.yaml
  text: And I did not exalt myself among them in arrogance because of my worldly glory, but I was among them as one of the least.
translation:
  language: hi
  text: और मैंने अपनी सांसारिक महिमा के कारण उनके बीच घमंड में अपने आपको ऊँचा नहीं किया, बल्कि मैं उनके बीच सबसे छोटों में से एक था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕψωσα ἐμαυτόν
  choice: अपने आपको ऊँचा किया
  rationale: मूल के आत्म-उत्थान के भाव को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ἀλαζονείᾳ
  choice: घमंड से
  rationale: ἀλαζονεία के अहंकारी आत्म-प्रदर्शन के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κοσμικήν μου δόξαν
  choice: अपनी सांसारिक महिमा
  rationale: κοσμικός का संसार से संबंधित अर्थ और δόξα का प्रतिष्ठा/महिमा संबंधी विस्तार सुरक्षित रखता है।
- source_word: ὡς εἷς τῶν ἐλαχίστων
  choice: सबसे छोटों में से एक बनकर
  rationale: ἐλάχιστος की विनम्र सामाजिक स्थिति को व्यक्त करता है; 'छोटों' मूल की व्यापकता को किसी विशिष्ट पद या वर्ग तक सीमित नहीं करता।
theological_decisions:
- issue: ἐλαχίστων का आशय
  choice: सबसे छोटों में से एक
  alternative: सबसे तुच्छ लोगों में से एक
  rationale: '''छोटों'' पद, प्रतिष्ठा या महत्त्व में न्यूनता की मूल अस्पष्टता को बचाता है, जबकि ''तुच्छ'' अनावश्यक रूप से अपमानसूचक अर्थ जोड़ सकता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। यूनानी वाक्य की विरोधात्मक संरचना—'नहीं..., बल्कि...'—और वक्ता की विनम्रता को स्पष्ट रखा गया है।
