reference: Testament of Joseph 17:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Τέρπεται γὰρ⁸ ὁ θεὸς⁷ ⌜ἐπὶ⌉ *ὁμονοίᾳ ἀδελφῶν⁸ καὶ⁷ ἐπὶ προαιρέσει καρδίας⁹ ⌜ἀγαθῆς⌉¹⁰ †εὐδοκοῦσιν¹¹ εἰς ἀγαθόν¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/003.yaml
  text: For God delights in the harmony of brothers and in the good intention of the heart; these are well-pleasing for good.
translation:
  language: hi
  text: क्योंकि परमेश्वर भाइयों के आपसी मेल और हृदय के अच्छे संकल्प से आनन्दित होता है; ये भलाई के लिए उसे प्रिय हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अन्तिम यूनानी शब्दों का वाक्य-विन्यास कठिन है; उनका अनुवाद ‘ये भलाई की ओर मनभावने हैं’ भी किया जा सकता है।
    reason: εὐδοκοῦσιν εἰς ἀγαθόν पाठगत और वाक्यगत रूप से असामान्य है; पादटिप्पणी वास्तविक अस्पष्टता को बिना मुख्य पाठ को बोझिल बनाए सुरक्षित रखती है।
lexical_decisions:
- source_word: ὁμονοίᾳ ἀδελφῶν
  choice: भाइयों के आपसी मेल
  rationale: ὁμόνοια आपसी सहमति, एकता और सौहार्द का भाव रखता है; ‘आपसी मेल’ आधुनिक हिन्दी में स्वाभाविक है और केवल बौद्धिक एकमतता तक अर्थ को सीमित नहीं करता।
- source_word: προαιρέσει καρδίας ἀγαθῆς
  choice: हृदय के अच्छे संकल्प
  rationale: προαίρεσις सोची-समझी इच्छा, अभिप्राय या संकल्प को दर्शाता है। ‘अच्छे संकल्प’ इस नैतिक और इच्छात्मक पहलू को संक्षेप में व्यक्त करता है, जबकि καρδίας के लिए ‘हृदय’ मूल रूपक को बनाए रखता है।
- source_word: Τέρπεται
  choice: आनन्दित होता है
  rationale: क्रिया का अर्थ प्रसन्न या आनन्दित होना है; ‘आनन्दित होता है’ परमेश्वर के विषय में स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: ये भलाई के लिए उसे प्रिय हैं
  rationale: प्राप्त यूनानी पाठ में बहुवचन क्रिया पूर्वोक्त आपसी मेल और अच्छे संकल्प की ओर संकेत करती प्रतीत होती है। ‘उसे’ संदर्भगत कर्ता परमेश्वर को स्पष्ट करता है, और εἰς ἀγαθόν की दिशात्मक/उद्देश्यात्मक अस्पष्टता को ‘भलाई के लिए’ के रूप में बनाए रखता है।
theological_decisions:
- issue: अन्तिम खंड में किसे प्रसन्न करने का भाव है
  choice: संदर्भ के आधार पर ‘उसे’ अर्थात परमेश्वर
  alternative: ‘ये भलाई के लिए मनभावने हैं’—प्रसन्न होने वाले को अनिर्दिष्ट रखना
  rationale: आरम्भिक खंड में परमेश्वर स्पष्ट विषय है, इसलिए हिन्दी में ‘उसे’ स्वाभाविक संबंध स्थापित करता है; फिर भी कठिन यूनानी वाक्यरचना को पादटिप्पणी में खुला रखा गया है।
- issue: εἰς ἀγαθόν का अर्थ
  choice: ‘भलाई के लिए’
  alternative: ‘भलाई की ओर’ या ‘भले परिणाम के लिए’
  rationale: ‘भलाई के लिए’ मूल पदबंध की उद्देश्य और दिशा—दोनों संभावनाओं को यथासंभव सुरक्षित रखता है और किसी विशेष नैतिक परिणाम को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। ‘आपसी मेल’ और ‘अच्छे संकल्प’ स्वाभाविक अभिव्यक्तियाँ हैं, जबकि ‘हृदय’ मूल धार्मिक-साहित्यिक रूपक को बनाए रखता है।
