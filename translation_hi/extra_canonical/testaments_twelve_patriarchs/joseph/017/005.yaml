  text: And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure.
translation:
  language: hi
  text: और मेरे पिता याकूब की मृत्यु के बाद, मैंने उनसे और भी अधिक प्रेम किया, और वे जो कुछ चाहते थे, वह मैं उनके लिए हद से बढ़कर करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσοτέρως
  choice: और भी अधिक
  rationale: तुलनात्मक बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπερεκπερισσοῦ
  choice: हद से बढ़कर
  rationale: मूल के अत्यधिक प्रबल क्रियाविशेषण का स्वाभाविक हिन्दी रूप है और साधारण पूर्ति से अधिक करने का भाव बनाए रखता है।
- source_word: ἐποίουν
  choice: करता था
  rationale: अपूर्ण भूतकाल की निरंतर या आदतन क्रिया को दर्शाता है।
