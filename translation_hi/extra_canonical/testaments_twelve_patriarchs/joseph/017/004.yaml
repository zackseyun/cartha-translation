base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/004.yaml
  text: And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them.
translation:
  language: hi
  text: और जब मेरे भाई मिस्र आए, तो वे स्वयं जानते हैं कि मैंने उनका धन उन्हें लौटा दिया, उन्हें उलाहना नहीं दिया, और उन्हें दिलासा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψα τὸ ἀργύριον αὐτοῖς
  choice: मैंने उनका रुपया उन्हें लौटा दिया
  rationale: ἀργύριον यहाँ भाइयों द्वारा लाया गया धन है; ‘रुपया’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और लौटाने की क्रिया तथा प्राप्तकर्ता दोनों को स्पष्ट रखता है।
- source_word: οὐκ ὠνείδισα αὐτούς
  choice: उन्हें उलाहना नहीं दिया
  rationale: ὀνειδίζω दोष लगाकर धिक्कारने या ताना देने का भाव रखता है; ‘उलाहना देना’ इस प्रसंग में स्वाभाविक और गरिमापूर्ण है।
- source_word: παρεκάλεσα αὐτούς
  choice: उन्हें ढाढ़स बँधाया
  rationale: παρακαλέω के अर्थक्षेत्र में बुलाना, समझाना, आग्रह करना और सांत्वना/प्रोत्साहन देना शामिल हैं। प्रसंग में यूसुफ का भाइयों को आश्वस्त करना अभिप्रेत जान पड़ता है, इसलिए ‘ढाढ़स बँधाया’ चुना गया, बिना इसे किसी विशिष्ट धर्मवैज्ञानिक अर्थ तक सीमित किए।
- source_word: αὐτοὶ γινώσκουσιν
  choice: वे स्वयं जानते हैं
  rationale: बलसूचक αὐτοί को ‘स्वयं’ से सुरक्षित रखा गया है और वर्तमानकाल γινώσκουσιν को ‘जानते हैं’ के रूप में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रथम-पुरुष कथन की सादगी और गरिमा बनाए रखी गई है। यूनानी καί की क्रमसूचक भूमिका के लिए आरम्भ में ‘और’, तथा अंतिम καί के विरोधात्मक प्रसंगगत बल के लिए ‘बल्कि’ रखा गया है।
