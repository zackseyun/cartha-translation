reference: Testament of Joseph 17:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ⌉³⁰ οἱ υἱοὶ *αὐτῶν υἱοί μου³¹, *καὶ οἱ υἱοί μου ὡς δοῦλοι αὐτῶν³², καὶ³³ ἡ ψυχὴ *αὐτῶν ψυχή μου³⁴, καὶ πᾶν ἄλγημα³⁵ αὐτῶν ἄλγημά μου³⁶, ⌜καὶ πᾶσα μαλακία αὐτῶν *ἀσθένειά μου, καὶ³⁷ ἡ βουλὴ³⁷⌉ αὐτῶν βουλή μου³⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/007.yaml
  text: And their sons were my sons, and my sons were as servants to them, and their souls were my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose.
translation:
  language: hi
  text: और उनके पुत्र मेरे पुत्र थे, और मेरे पुत्र उनके लिए दासों के समान थे; उनका प्राण मेरा प्राण था, उनका हर दुःख मेरा दुःख था, उनकी हर दुर्बलता मेरी बीमारी थी, और उनका संकल्प मेरा संकल्प था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοί
  choice: पुत्र
  rationale: मूल यूनानी में स्पष्ट रूप से पुरुषवाचक बहुवचन ‘पुत्र’ है; इसलिए अधिक सामान्य ‘सन्तान’ के बजाय इसे बनाए रखा गया।
- source_word: δοῦλοι
  choice: दासों
  rationale: δοῦλος का मूल अर्थ दास है। ‘दासों के समान’ ὡς की उपमा को भी स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ψυχή
  choice: प्राण
  rationale: यहाँ ψυχή गहरे आत्मीय जीवन और एकात्मता को व्यक्त करता है। ‘प्राण’ हिन्दी में इस रूपक को स्वाभाविक और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: ἄλγημα
  choice: दुःख
  rationale: शब्द पीड़ा या कष्ट को दर्शाता है; ‘दुःख’ शारीरिक अथवा भावनात्मक दोनों प्रकार की पीड़ा के लिए सहज है।
- source_word: μαλακία
  choice: दुर्बलता
  rationale: यह कमजोरी या दुर्बल अवस्था का बोध कराता है और अगले ἀσθένεια से आवश्यक भेद रखता है।
- source_word: ἀσθένεια
  choice: बीमारी
  rationale: इस समानांतर वाक्य में ἀσθένεια को रोगावस्था के रूप में प्रस्तुत किया गया है, जिससे μαλακία ‘दुर्बलता’ के साथ शब्दगत अंतर बना रहता है।
- source_word: βουλή
  choice: संकल्प
  rationale: βουλή योजना, अभिप्राय या निश्चय का अर्थ दे सकता है। ‘संकल्प’ यहाँ साझा उद्देश्य और इच्छा का भाव स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἡ ψυχὴ αὐτῶν ψυχή μου में सामूहिक एकवचन रूपक
  choice: उनका प्राण मेरा प्राण था
  alternative: उनके प्राण मेरे प्राण थे
  rationale: यूनानी पाठ व्याकरणतः एकवचन ψυχή का प्रयोग करता है और अनेक लोगों के बीच गहरी एकात्मता का तनाव बनाए रखता है; हिन्दी में सामूहिक एकवचन ‘उनका प्राण’ उसी रूपक को सुरक्षित रखता है।
- issue: पुत्रों के सम्बन्ध में दासत्व की उपमा
  choice: मेरे पुत्र उनके दासों के समान थे
  alternative: मेरे पुत्र उनकी सेवा करते थे
  rationale: मूल में ὡς (‘के समान’) और δοῦλοι (‘दास’) दोनों स्पष्ट हैं। इसे सामान्य सेवा में बदलना कथन की तीव्रता घटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्यरचना और बार-बार आने वाले ‘मेरा/मेरी’ को मूल की भावात्मक एकात्मता बनाए रखने के लिए सुरक्षित रखा गया है।
