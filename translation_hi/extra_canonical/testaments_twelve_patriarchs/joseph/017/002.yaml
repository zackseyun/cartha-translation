  text: Καὶ ὑμεῖς ⌜οὖν⌉ ἀγαπᾶτε ἀλλήλους, ⌜καὶ ἐν μακροθυμίᾳ⁴ *συγκρύπτετε ἀλλήλων⁵ τὰ ἐλαττώματα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/002.yaml
  text: You also, therefore, love one another, and with patience conceal one another’s shortcomings.
translation:
  language: hi
  text: इसलिए तुम भी एक-दूसरे से प्रेम करो और धीरज रखते हुए एक-दूसरे की कमियों को ढाँप दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: एक-दूसरे से प्रेम करो
  rationale: पारस्परिक प्रेम की आज्ञा को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν μακροθυμίᾳ
  choice: धीरज रखते हुए
  rationale: μακροθυμία का आशय उकसावे या दूसरों की कमियों के सामने सहनशील और धैर्यवान बने रहने से है; यह प्रयोग हिन्दी में सहज है।
- source_word: συγκρύπτετε
  choice: ढाँप दो
  rationale: क्रिया में किसी की कमी को सार्वजनिक करने के बजाय उसे छिपाने या ढाँपने का भाव है; ‘ढाँप दो’ मूल रूपक और नैतिक बल दोनों बनाए रखता है।
- source_word: τὰ ἐλαττώματα
  choice: कमियों
  rationale: यह शब्द दोष, दुर्बलता या न्यूनता को सूचित कर सकता है; ‘कमियाँ’ व्यापक और गैर-अतिव्याख्यात्मक विकल्प है।
theological_decisions:
- issue: दूसरों की कमियों को छिपाने की आज्ञा का दायरा
  choice: मूल के अनुसार ‘कमियों को ढाँप दो’ रखा गया
  alternative: कमियों को सह लो / क्षमा करो
  rationale: पाठ स्पष्टतः συγκρύπτετε (‘साथ मिलकर छिपाओ/ढाँपो’) कहता है, न कि केवल सहने या क्षमा करने वाली क्रिया; इसलिए संभावित नैतिक तनाव को व्याख्या द्वारा हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में आज्ञार्थक, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘इसलिए तुम भी’ यूनानी Καὶ ὑμεῖς οὖν के बल और क्रम को स्वाभाविक हिन्दी में सुरक्षित रखता है।
