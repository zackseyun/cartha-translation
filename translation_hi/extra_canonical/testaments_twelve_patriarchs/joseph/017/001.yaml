  text: See then, my children, how much I endured so that I might not put my brothers to shame.
translation:
  language: hi
  text: इसलिए देखो, मेरे बच्चो, मैंने कितना कुछ सहा, ताकि मैं अपने भाइयों को लज्जित न करूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε οὖν
  choice: इसलिए देखो
  rationale: Ὁρᾶτε का संबोधनात्मक बहुवचन आदेश ‘देखो’ और οὖν का निष्कर्षसूचक अर्थ ‘इसलिए’ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: शाब्दिक अर्थ ‘मेरी संतानो’ है, पर पिता द्वारा अपनी संतानों को सीधे संबोधित करने के लिए ‘मेरे बच्चो’ अधिक स्वाभाविक, वर्तमान और गरिमापूर्ण है।
- source_word: πόσα ὑπέμεινα
  choice: मैंने कितना कुछ सहा
  rationale: πόσα सहन की गई बातों या कष्टों की व्यापक मात्रा दिखाता है; ‘कितना कुछ’ इस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ἵνα μὴ αἰσχύνω
  choice: ताकि मैं ... लज्जित न करूँ
  rationale: ἵνα μή उद्देश्य को और αἰσχύνω किसी को लज्जा या अपमान में डालने को व्यक्त करता है; ‘लज्जित न करूँ’ मूल की सीधी causative संरचना बनाए रखता है।
- source_word: τοὺς ἀδελφούς μου
  choice: अपने भाइयों को
  rationale: हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है और Joseph के वास्तविक भाइयों का संदर्भ बनाए रखता है।
theological_decisions:
- issue: यूसुफ के सहने का व्यक्त उद्देश्य
  choice: ताकि मैं अपने भाइयों को लज्जित न करूँ
  alternative: ताकि मेरे भाइयों को लज्जा न उठानी पड़े
  rationale: मूल में αἰσχύνω सक्रिय क्रिया है, जिसका कर्ता यूसुफ है। चुना हुआ रूप उसकी संयमपूर्ण क्रिया को बनाए रखता है और उद्देश्य को निष्क्रिय परिणाम में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; पितृसुलभ संबोधन और शिक्षाप्रद स्वर को सरल किंतु गरिमापूर्ण रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं है।
