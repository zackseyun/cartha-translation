base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/006.yaml
  text: And I did not allow them to be distressed even in the smallest matter; indeed, everything that was in my hand I gave to them.
translation:
  language: hi
  text: और मैंने उन्हें छोटी-से-छोटी बात में भी कष्ट नहीं उठाने दिया; सच तो यह है कि जो कुछ मेरे हाथ में था, वह सब मैंने उन्हें दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβῆναι
  choice: कष्ट उठाने
  rationale: यह क्रिया दबाव, संकट या क्लेश सहने का भाव देती है; प्रसंग में ‘कष्ट उठाने’ स्वाभाविक और अर्थ-संगत है।
- source_word: ἕως μικροῦ πράγματος
  choice: छोटी-से-छोटी बात में भी
  rationale: शाब्दिक संरचना कुछ असामान्य है, पर इसका आशय अत्यल्प विषय तक की सीमा पर बल देना है; यह हिंदी अभिव्यक्ति उसी जोर को सहज रूप में रखती है।
- source_word: καίγε
  choice: सच तो यह है कि
  rationale: यहाँ कण पूर्व कथन का विरोध नहीं, बल्कि अगले कथन को बल देकर जोड़ता है।
- source_word: ἐν τῇ χειρί μου
  choice: मेरे हाथ में
  rationale: मूल रूपक को सुरक्षित रखा गया है; हिंदी में भी इसका अर्थ अधिकार या उपलब्ध साधन स्वाभाविक रूप से समझा जाता है।
- source_word: δέδωκα
  choice: दे दिया
  rationale: ग्रीक पूर्णकाल का परिणाम वर्तमान संदर्भ में निहित है; हिंदी में पूर्ण क्रिया ‘दे दिया’ इसे स्वाभाविक रूप से व्यक्त करती है।
