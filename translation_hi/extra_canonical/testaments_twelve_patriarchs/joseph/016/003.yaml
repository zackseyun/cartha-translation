  text: But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.
translation:
  language: hi
  text: पर वह खोजा मुझे खरीदना नहीं चाहता था। उसने उन्हें परखा, फिर वहाँ से चला गया और अपनी स्वामिनी को बताया कि वे उस लड़के के लिए बहुत ऊँची कीमत माँग रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: खोजा
  rationale: यह यूनानी पद राजकीय या घरेलू सेवा में नियुक्त बधिया पुरुष को दर्शाता है; ‘खोजा’ हिन्दी में इसका संक्षिप्त और प्रचलित समतुल्य है।
- source_word: μὴ θελήσας ἀγοράσαι με
  choice: मुझे खरीदना नहीं चाहता था
  rationale: नकारात्मक कृदन्त पदबंध को स्वाभाविक हिन्दी में कारणसूचक रूप दिया गया है, बिना यह जोड़े कि उसकी अनिच्छा का कारण क्या था।
- source_word: πειράσας αὐτούς
  choice: उन्हें परखकर
  rationale: πειράζω यहाँ विक्रेताओं की माँग या मोल-भाव की स्थिति जाँचने के अर्थ में है; ‘परखकर’ मूल की व्यापकता बनाए रखता है।
- source_word: δεσποίνῃ
  choice: स्वामिनी
  rationale: स्त्रीलिंग δεσποίνῃ के अधिकार-संबंधी अर्थ को गरिमापूर्ण और युगानुकूल हिन्दी में व्यक्त करता है।
- source_word: πολλὴν τιμὴν αἰτοῦσιν
  choice: बहुत ऊँचा दाम माँग रहे हैं
  rationale: व्यापारिक प्रसंग में τιμή का अर्थ ‘मूल्य/दाम’ है; मुहावरेदार हिन्दी में ‘ऊँचा दाम’ माँगी गई बड़ी राशि को स्पष्ट करता है।
- source_word: τοῦ παιδός
  choice: उस लड़के का
  rationale: παιδός आयु अथवा अधीन स्थिति वाले बालक/युवक के लिए प्रयुक्त हो सकता है; इस बिक्री-प्रसंग में ‘लड़का’ स्वाभाविक है और आयु को अत्यधिक निश्चित नहीं करता।
