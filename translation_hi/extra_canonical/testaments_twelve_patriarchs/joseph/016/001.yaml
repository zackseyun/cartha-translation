lexical_decisions:
- source_word: Μεμφὶς
  choice: मेम्फिस
  rationale: व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: Ἀγόρασον
  choice: खरीद लो
  rationale: आज्ञार्थक क्रिया का स्वाभाविक आधुनिक हिन्दी रूप; प्रसंग में व्यक्ति को खरीदने की प्राचीन प्रथा का सीधा उल्लेख बना रहता है।
- source_word: νεανίαν
  choice: जवान
  rationale: युवा पुरुष के लिए सहज और गरिमापूर्ण आधुनिक हिन्दी शब्द।
- source_word: ἀκούω
  choice: मैंने सुना है
  rationale: वर्तमान यूनानी रूप को हिन्दी में सूचना प्राप्त होने के स्वाभाविक मुहावरे से व्यक्त किया गया है।
- source_word: φησίν
  choice: वह कहती है
  rationale: मूल में उपस्थित कथावाचकीय मध्यवर्ती वाक्यांश को असामान्य होने पर भी छोड़ा नहीं गया।
- source_word: πωλοῦσιν αὐτόν
  choice: वे उसे बेच रहे हैं
  rationale: अनिर्दिष्ट बहुवचन कर्ता और पुरुषवाचक सर्वनाम दोनों सुरक्षित हैं।
