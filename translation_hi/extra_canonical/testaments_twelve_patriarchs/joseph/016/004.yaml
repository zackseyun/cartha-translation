  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग कर्ता को पूर्ववर्ती प्रसंग के अनुरूप ‘उसने’ से व्यक्त किया गया है। आदेशों का बल बनाए रखते हुए हिन्दी में स्वाभाविक संबोधन अपनाया गया है।
