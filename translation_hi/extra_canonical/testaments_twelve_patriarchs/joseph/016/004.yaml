  text: Then she sent another eunuch, saying, “Even if they ask two minas, pay them. Do not spare the gold. Only buy the boy and bring him to me.”
translation:
  language: hi
  text: तब उसने एक और खोजे को यह कहकर भेजा, “यदि वे दो मीना भी माँगें, तो दे देना। सोना खर्च करने में कोई कसर मत रखना। बस उस युवक को खरीदकर मेरे पास ले आना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχον
  choice: खोजे
  rationale: यह यूनानी शब्द राजकीय या घरेलू सेवा में नियुक्त नपुंसक पुरुष को सूचित करता है; ‘खोजा’ इसका संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: δύο μνᾶς
  choice: दो मीना
  rationale: मीना प्राचीन भार और मुद्रा की इकाई थी; ऐतिहासिक माप को आधुनिक मुद्रा में बदलने के बजाय लिप्यंतरित रूप रखा गया है।
- source_word: μὴ φείσασθε χρυσίου
  choice: सोना खर्च करने में कोई कसर मत रखना
  rationale: शाब्दिक अर्थ ‘सोने को मत बचाना’ है; चुना हुआ वाक्यांश बिना सीमा के भुगतान करने की आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν παῖδα
  choice: उस युवक को
  rationale: παῖς का अर्थ संदर्भानुसार बालक, युवक या सेवक हो सकता है; यूसुफ के संदर्भ में ‘युवक’ स्वाभाविक है और ‘दास’ जैसा अतिरिक्त कानूनी अर्थ नहीं जोड़ता।
