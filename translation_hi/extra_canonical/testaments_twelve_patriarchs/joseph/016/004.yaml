  verdict: approve
  source_fidelity: 'The Hindi accurately represents the Greek sequence and imperatives: she sends another eunuch; the conditional requested price is two minas; gold must not be spared; and the boy/youth is to be bought and brought to her. “दे देना” appropriately supplies the implied payment, without introducing an unsupported detail.'
  naturalness: The rendering is fluent, modern standard Hindi. The imperative forms are natural in reported speech, and “सोना खर्च करने में कोई कसर मत रखना” idiomatically conveys the force of μὴ φείσασθε χρυσίου.
  terminology: “खोजे” is a historically established Hindi term for εὐνοῦχος in this ancient court/household setting. “मीना” preserves the ancient monetary unit rather than misleadingly converting it. “युवक” is a contextually defensible rendering of the inherently flexible παῖς and does not impose the additional legal sense of ‘slave.’
