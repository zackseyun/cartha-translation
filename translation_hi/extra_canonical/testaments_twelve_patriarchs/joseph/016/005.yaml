translation:
  language: hi
  text: इसलिए वह खोजा आया, उसने उन्हें सोने के अस्सी सिक्के दिए और मुझे अपने साथ ले गया; पर उस मिस्री स्त्री से उसने कहा, “मैंने सौ दिए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: खोजा
  rationale: यूनानी शब्द का सामान्य अर्थ राजकीय या घरेलू सेवा में नियुक्त बधिया पुरुष है; ‘खोजा’ इसे संक्षेप और ऐतिहासिक रूप से व्यक्त करता है।
- source_word: χρυσοῦς
  choice: सोने के ... सिक्के
  rationale: यहाँ बहुवचन संज्ञा भुगतान में प्रयुक्त स्वर्ण-मुद्राओं को सूचित करती है; स्वाभाविक हिन्दी के लिए संख्या को बीच में रखा गया है।
- source_word: ἀνελάβετό με
  choice: मुझे अपने साथ ले गया
  rationale: क्रिया का अर्थ यहाँ भुगतान के बाद योसेफ को अपने अधिकार में लेकर साथ ले जाना है; केवल ‘मुझे लिया’ हिन्दी में अस्पष्ट और अस्वाभाविक होता।
- source_word: Αἰγυπτίᾳ
  choice: मिस्री स्त्री
  rationale: स्त्रीलिंग विशेषण संज्ञा के रूप में प्रयुक्त है और संदर्भित मिस्री महिला को दर्शाता है।
