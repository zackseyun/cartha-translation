  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: यह जानते हुए भी
  rationale: ग्रीक कृदन्त का अर्थ ‘जानते हुए’ है; ‘भी’ हिन्दी में मुख्य क्रिया के साथ इसके विरोधात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐσιώπησα
  choice: चुप रहा
  rationale: यह सरल और स्वाभाविक हिन्दी में जानबूझकर मौन रहने का भाव व्यक्त करता है।
- source_word: ὁ εὐνοῦχος
  choice: वह खोजा
  rationale: संज्ञा का प्रत्यक्ष अर्थ ‘खोजा’ है; निश्चित उपपद को प्रसंगानुसार ‘वह’ से व्यक्त किया गया है।
- source_word: αἰσχυνθῇ
  choice: लज्जित न हो
  rationale: यह कर्मवाच्य/अकर्मक भाव और उद्देश्यवाचक ἵνα के साथ संभाव्य अर्थ को सुरक्षित रखता है।
