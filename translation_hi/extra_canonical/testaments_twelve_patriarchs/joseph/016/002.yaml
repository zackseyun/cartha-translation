  text: So she immediately sent a eunuch among the Ishmaelites, asking for me to be sold.
translation:
  language: hi
  text: तब उसने तुरन्त इश्माएलियों के बीच एक खोजे को भेजा और मुझे बेच दिए जाने का अनुरोध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐθέως
  choice: तुरन्त
  rationale: यह क्रियाविशेषण घटना की तात्कालिकता व्यक्त करता है।
- source_word: εὐνοῦχον
  choice: एक खोजे को
  rationale: यूनानी शब्द दरबार अथवा घराने के बधिया पुरुष सेवक के लिए प्रयुक्त सामान्य पद है; ‘खोजा’ आधुनिक हिन्दी में इसका संक्षिप्त और पहचाना हुआ समतुल्य है।
- source_word: ἐν τοῖς Ἰσμαϊλίταις
  choice: इश्माएलियों के बीच
  rationale: ἐν का स्थानवाचक अर्थ सुरक्षित रखा गया है; यह केवल ‘इश्माएलियों के पास’ जाने से अधिक स्पष्ट रूप से उनके बीच उपस्थित होने को दर्शाता है।
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: मुझे बेच दिए जाने की माँग की
  rationale: διάπρασις यहाँ बिक्री/बेच दिए जाने के अर्थ में है। निष्क्रिय हिन्दी रचना मूल की यह बात बनाए रखती है कि यूसुफ बिक्री का विषय है, जबकि खरीदार को मूल से अधिक स्पष्ट नहीं करती।
