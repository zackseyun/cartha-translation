  text: 'And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as my husband.”


    2 So when I heard this, I tore my garments and said to her, “Woman, be ashamed before God, and do not do this lawless and evil deed, lest you be destroyed. For know this also: I will report your scheme to everyone.”


    3 Then she, being afraid, begged me not to report this scheme.


    4 And she went away, trying to win me over with gifts and every kind of pleasure.'
translation:
  language: hi
  text: '5 फिर एक और अवसर पर उसने मुझसे कहा, “यदि तुम व्यभिचार नहीं करना चाहते, तो मैं अपने पति को विष देकर मार डालूँगी और तुम्हें अपना पति बना लूँगी।”


    2 जब मैंने यह सुना, तो मैंने अपने वस्त्र फाड़े और उससे कहा, “हे स्त्री, परमेश्वर के सामने लज्जित हो और यह दुष्ट काम मत कर, कहीं ऐसा न हो कि तुम्हारा नाश हो जाए। यह भी जान लो कि मैं तुम्हारी यह योजना सबको बता दूँगा।”


    3 तब वह डर गई और मुझसे विनती करने लगी कि मैं उसकी यह योजना सबको न बताऊँ।


    4 फिर वह भेंटों और हर प्रकार के सुख से मुझे रिझाती हुई चली गई।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: व्यभिचार करना
  rationale: यह क्रिया वैवाहिक बेवफाई/परस्त्रीगमन के स्पष्ट यौन अर्थ को व्यक्त करती है; सामान्य और गरिमापूर्ण हिन्दी में ‘व्यभिचार करना’ उपयुक्त है।
- source_word: αἰδέσθητι τὸν Θεόν
  choice: परमेश्वर के सामने लज्जित हो
  rationale: αἰδέομαι का प्रधान भाव लज्जा और संकोच है, केवल भय नहीं; यह चयन संशोधित अंग्रेज़ी परामर्श-पाठ और यूनानी दोनों के अनुरूप है।
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: यह दुष्ट काम
  rationale: यूनानी पाठ में πονηράν स्पष्टतः ‘दुष्ट/बुरा’ है; ‘lawless’ मूल पायलट-पाठ में प्रत्यक्ष रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἐπίνοιαν
  choice: योजना
  rationale: प्रसंग में यह पति को विष देकर मारने की सोची-समझी युक्ति या षड्यंत्र है; सहज हिन्दी के लिए ‘योजना’ चुना गया।
- source_word: ἐπιθάλπουσά με
  choice: मुझे लुभाने का प्रयत्न करती रही
  rationale: शब्द में अनुग्रह, मनुहार या अपने पक्ष में करने का भाव है; उपहारों और सुखों के प्रसंग में ‘लुभाने’ से आशय स्वाभाविक रूप में स्पष्ट होता है।
- source_word: ἀπολαύσεσι πάσαις
  choice: हर प्रकार के सुख
  rationale: बहुवचन पद विभिन्न प्रकार के आनंद या भोग-सुख को समेटता है; अनावश्यक रूप से केवल यौन अर्थ तक सीमित नहीं किया गया।
theological_decisions:
- issue: αἰδέσθητι में भय या लज्जा
  choice: परमेश्वर के सामने लज्जित हो
  alternative: परमेश्वर से डर
  rationale: यूनानी क्रिया यहाँ लज्जा/संकोच का सीधा बोध कराती है। भय का अनुवाद सम्भव व्याख्या है, पर वह lexical nuance को बदल देता।
- issue: ‘lawless’ की उपस्थिति
  choice: केवल ‘दुष्ट काम’
  alternative: ‘अधर्मपूर्ण और दुष्ट काम’
  rationale: प्रदत्त यूनानी पायलट-पाठ में πρᾶξιν ... πονηράν है और ‘lawless’ के लिए अलग विशेषण नहीं है; इसलिए परामर्श-पाठ की विस्तारात्मक भाषा नहीं अपनाई गई।
- issue: विनाश की चेतावनी
  choice: कहीं ऐसा न हो कि तेरा नाश हो जाए
  alternative: वरना परमेश्वर तेरा नाश कर देगा
  rationale: ἐξολοθρευθῇς कर्मवाच्य है और कर्ता को स्पष्ट नहीं करता; परमेश्वर को प्रत्यक्ष कर्ता बनाकर मूल की अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष कथन में ‘तुम’ से संबोधन आरम्भ होता है, जबकि यूसुफ की कठोर चेतावनी में स्वाभाविक एकवचन ‘तू/तेरा’ रूप का प्रयोग किया गया है। पद-संख्या सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
