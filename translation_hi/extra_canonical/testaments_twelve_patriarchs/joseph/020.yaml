base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020.yaml
  text: '1[[to the Hippodrome]]. For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.


    2. But you shall carry up my bones with you[3a], for when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.


    3. And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.


    3a. But another reading says: “And bring up Zelpha your mother, and place her near Bilhah [by the Hippodrome], close to Rachel.”


    12. For my kingdom among you will be brought to completion like a watchman’s hut in an orchard[12b][12], which does not appear after the summer.”'
translation:
  language: hi
  text: '**यूसुफ का वसीयतनामा 20**


    **1** क्योंकि मैं जानता हूँ कि मेरी मृत्यु के बाद मिस्री तुम पर अत्याचार करेंगे; परन्तु परमेश्वर तुम्हारा बदला लेगा और तुम्हें उन प्रतिज्ञाओं में ले जाएगा जो तुम्हारे पुरखों से की गई थीं।


    **2** पर तुम मेरी हड्डियाँ भी अपने साथ ऊपर ले जाओगे; क्योंकि जब मेरी हड्डियाँ वहाँ ले जाई जाएँगी, तब प्रभु ज्योति में तुम्हारे साथ होगा और बेलियार अन्धकार में मिस्रियों के साथ होगा।


    **3** अपनी माता आसनत को [घुड़दौड़ के मैदान तक][a] ले जाना और उसे मेरी माता राहेल के निकट दफ़नाना।[b]


    **4** ये बातें कहकर उसने अपने पैर पसारे और सुखद नींद सो गया।


    **5** तब सारे इस्राएल और सारे मिस्र ने उसके लिए बहुत बड़ा शोक मनाया।


    **6** जब इस्राएली मिस्र से निकले, तब उन्होंने यूसुफ की हड्डियाँ इकट्ठी कीं और उसे हेब्रोन में उसके पुरखों के साथ दफ़नाया। उसके जीवन की कुल आयु एक सौ दस वर्ष थी।[c]


    **12** क्योंकि उसका राज्य अनन्त राज्य होगा, जो कभी समाप्त नहीं होगा। परन्तु मेरा राज्य तुम्हारे बीच पूरा हो जाएगा; वह फलोद्यान में पहरेदार की झोंपड़ी के समान है, जो गर्मी का मौसम बीत जाने पर लुप्त हो जाती है।[d][e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घुड़दौड़ के मैदान तक’ शब्द यूनानी गवाह में कोष्ठकों में हैं और पाठगत रूप से अनिश्चित हैं।
    reason: textual_variant
  - marker: b
    text: 'कुछ गवाहों में इसके स्थान पर यह पाठ मिलता है: “अपनी माता ज़िल्पा को ऊपर ले जाना और उसे घुड़दौड़ के मैदान के पास बिल्हा के निकट, राहेल के पास रखना।”'
    reason: alternative_reading
  - marker: c
    text: पद 6 का पूरा विवरण प्रदत्त यूनानी पाठ में पाठगत रूप से चिह्नित है। इसमें यूसुफ को हेब्रोन में उसके पुरखों के साथ दफ़नाया गया बताया गया है; इस पाठ को दूसरे प्राचीन विवरणों से मिलाकर बदला नहीं गया है।
    reason: textual_variant
  - marker: d
    text: प्रदत्त स्रोत में पद 6 के बाद अध्याय 19:12 से मिलती-जुलती यह पंक्ति संलग्न है और पद-संख्या 12 पर पहुँचती है। इससे संकेत मिलता है कि इस स्थान का पाठ संक्षिप्त, स्थानान्तरित या अंशरूप में संरक्षित है।
    reason: textual_variant
  - marker: e
    text: फलोद्यान में पहरेदार की झोंपड़ी फसल के मौसम की अस्थायी शरण का बिम्ब है, जो गर्मी का मौसम बीतने पर गायब हो जाती है; यशायाह 1:8 में मिलता-जुलता बिम्ब देखें। इस वाक्यांश के पास यूनानी पाठ में एक दूषित अथवा अपठनीय अंश भी है।
    reason: cross_reference
lexical_decisions:
- source_word: τελευτή
  choice: मृत्यु
  rationale: वसीयतनामे के प्रसंग में यह यूसुफ के जीवन के अन्त को सीधे व्यक्त करता है; ‘प्रस्थान’ मूल की स्पष्टता को अनावश्यक रूप से नरम कर देता।
- source_word: θλίψουσιν
  choice: अत्याचार करेंगे
  rationale: मिस्रियों द्वारा लगातार दमन और कठोर व्यवहार का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἐκδίκησιν ποιήσει
  choice: तुम्हारा बदला लेगा
  rationale: यूनानी पद दैवी प्रतिशोध अथवा पीड़ितों के पक्ष में न्यायपूर्ण प्रतिकार का सक्रिय भाव रखता है; इसे केवल ‘देखभाल करेगा’ बनाकर नरम नहीं किया गया।
- source_word: ἐπάξει
  choice: ले जाएगा
  rationale: क्रिया पहुँचाने या ले जाने का भाव देती है। मूल में ‘वापस’ स्पष्ट नहीं है, इसलिए वह विचार मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञाएँ
  rationale: पुरखों से सम्बद्ध वाचागत अर्थ को बनाए रखता है और हिन्दी बाइबलीय भाषा में सहज है।
- source_word: συνανοίσετε
  choice: अपने साथ ऊपर ले जाना
  rationale: मिस्र से हड्डियों को साथ लेकर ऊपर जाने की गति और सहगमन, दोनों को व्यक्त करता है।
- source_word: ἐν φωτί / ἐν σκότει
  choice: ज्योति में / अन्धकार में
  rationale: मूल के समानान्तर प्रकाश-अन्धकार विरोध को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी पाठ के व्यक्तिवाचक रूप को लिप्यन्तरित किया गया है; इसे ‘दुष्टता’ या ‘शैतान’ में व्याख्यायित नहीं किया गया।
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: सुखद नींद सो गया
  rationale: मृत्यु के लिए प्रयुक्त मूल रूपक को बनाए रखता है और उसे केवल ‘मर गया’ में समतल नहीं करता।
- source_word: ὀπωροφυλάκιον
  choice: फलोद्यान में पहरेदार की झोंपड़ी
  rationale: यह मौसमी रखवाली के लिए बनी अस्थायी झोंपड़ी का बिम्ब है; शब्दशः अर्थ और बिम्ब दोनों को स्पष्ट हिन्दी में रखा गया।
- source_word: ἐξαφανίζεται
  choice: लुप्त हो जाती है
  rationale: गर्मी का मौसम बीतने के बाद अस्थायी झोंपड़ी के गायब हो जाने का सीधा अर्थ देता है।
theological_decisions:
- issue: दैवी ἐκδίκησις का अर्थ
  choice: परमेश्वर इस्राएल की ओर से सक्रिय रूप से बदला लेता है।
  alternative: परमेश्वर केवल उनकी सुधि लेगा या सामान्य न्याय करेगा।
  rationale: मूल संज्ञा में प्रतिशोध और पीड़ित के न्यायसंगत समर्थन, दोनों की तीव्रता है। ‘बदला लेगा’ इस असुविधाजनक धार्मिक तनाव को छिपाता नहीं है।
- issue: प्रभु और बेलियार का ज्योति-अन्धकार विरोध
  choice: बेलियार को व्यक्तिवाचक सत्ता के रूप में रखकर समानान्तर विरोध का सीधा अनुवाद किया गया।
  alternative: बेलियार को ‘बुराई’ कहना या उसे मुख्य पाठ में ‘शैतान’ से मिला देना।
  rationale: यूनानी गवाह बेलियार का मानवीकरण करता है; अनुवाद उस अपोकैलिप्टिक बिम्ब को धर्मसैद्धान्तिक पुनर्व्याख्या के बिना सुरक्षित रखता है।
- issue: आसनत के दफ़नाने के निर्देश की पाठगत अस्थिरता
  choice: मुख्य पाठ में आसनत और राहेल वाला पाठ रखा गया तथा ज़िल्पा-बिल्हा वाला पाठ टिप्पणी में दिया गया।
  alternative: ज़िल्पा वाला पाठ मुख्य बनाना या दोनों पाठों को मिलाकर एक संयुक्त विवरण तैयार करना।
  rationale: प्रदत्त यूनानी पाठ आसनत वाला रूप देता है, जबकि परामर्श-स्तर दूसरे साक्षियों के वैकल्पिक पाठ को दर्ज करता है; दोनों को चुपचाप मिलाना उचित नहीं।
- issue: क्षणभंगुर ‘मेरे राज्य’ और अनन्त ‘उसके राज्य’ का तनाव
  choice: दोनों कथनों को उनके स्पष्ट विरोध के साथ रखा गया।
  alternative: ‘मेरे राज्य’ को भी अनन्त राज्य के अर्थ में समझाकर दोनों को मिला देना।
  rationale: मूल एक राज्य के अनन्त होने और यूसुफ के अपने राज्य के मौसमी झोंपड़ी की तरह मिट जाने के बीच तनाव रखता है; अनुवाद इसे हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध स्तर रखा गया है। ‘परमेश्वर’, ‘प्रभु’, ‘प्रतिज्ञा’, ‘ज्योति’ और ‘अन्धकार’ जैसे परिचित धार्मिक शब्द मूल की शैली बनाए रखते हैं। व्यक्तिनामों को प्रचलित हिन्दी रूपों में दिया गया है। पाठगत कोष्ठकों और अध्याय-अन्त के असंगत अंशों को चुपचाप हटाने के बजाय टिप्पणियों में स्पष्ट किया गया है।
