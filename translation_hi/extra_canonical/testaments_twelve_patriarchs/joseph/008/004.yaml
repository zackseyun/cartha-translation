source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐκείνη δὲ¹⁸ ⌜κρατήσασα τοῦτον¹⁹ ἐσυκοφάντησέ με· καὶ ἐλθὼν ὁ ἀνὴρ αὐτῆς ἔβαλέ με εἰς φυλακὴν ἐν τῷ αὐτοῦ οἴκῳ²⁰, καὶ τῇ ἑξῆς *μαστιγώσας ἐξέπεμψέ²¹ με εἰς *τὴν τοῦ Φαραὼ εἰρκτήν²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/004.yaml
  text: But she, having seized this while I was naked, slandered me; and when her husband came, he threw me into prison in his house, and on the next day, after flogging me, he sent me into Pharaoh’s dungeon.
translation:
  language: hi
  text: परन्तु उसने इसे पकड़ लिया और मुझ पर झूठा आरोप लगाया। जब उसका पति आया, तो उसने मुझे अपने घर के कारागार में डाल दिया; और अगले दिन मुझे कोड़े मारकर फ़िरौन के कारागार में भेज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατήσασα τοῦτον
  choice: उसने इसे पकड़ लिया
  rationale: पुल्लिंग संकेतवाचक सर्वनाम τοῦτον का संदर्भ इस अंश में स्पष्ट नहीं है; इसलिए किसी निश्चित वस्तु का नाम जोड़ने के बजाय मूल की संदर्भगत अस्पष्टता बनाए रखी गई है।
- source_word: ἐσυκοφάντησέ με
  choice: मुझ पर झूठा आरोप लगाया
  rationale: क्रिया का अर्थ दुर्भावनापूर्वक झूठा अभियोग लगाना है; यह आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: φυλακὴν ἐν τῷ αὐτοῦ οἴκῳ
  choice: अपने घर के बंदीगृह में
  rationale: यह उसके घर या अधिकार-क्षेत्र में स्थित हिरासत-स्थान को व्यक्त करता है; केवल ‘जेल’ कहने से घरेलू स्थान का संकेत खो सकता था।
- source_word: μαστιγώσας
  choice: मुझे कोड़े लगवाकर
  rationale: यूनानी पुल्लिंग कर्तृवाचक कृदन्त का कर्ता पति है। हिन्दी में ‘लगवाकर’ उसके अधिकार से दंड दिलाए जाने को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि स्वयं मारने की संभावना भी मूल में खुली है।
- source_word: τὴν τοῦ Φαραὼ εἱρκτήν
  choice: फ़िरौन के कारागार में
  rationale: εἱρκτή बंद कारावास या कठोर बंदीगृह है; ‘कारागार’ गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘इसे’ द्वारा मूल यूनानी सर्वनाम की वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखी गई है; अंग्रेज़ी परामर्श-पाठ में जोड़ा गया ‘while I was naked’ उपलब्ध उद्धृत यूनानी पंक्ति में प्रत्यक्षतः नहीं है, फिर भी पूर्ववर्ती प्रसंग से निहित परिस्थिति के रूप में मुख्य पाठ में रखा गया है।
