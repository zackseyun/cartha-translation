base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/006.yaml
  text: 'And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.”'
translation:
  language: hi
  text: 'और उसने मुझसे कहा, “देखो तो, तुम मुझसे प्रेम करते हो। मेरे लिए इतना ही काफ़ी हो: बस मेरे जीवन और मेरे बच्चों का ध्यान रखो; और मुझे आशा है कि मेरी इच्छा भी पूरी हो जाएगी।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾷς με
  choice: तुम मुझसे प्रेम करते हो
  rationale: क्रिया वर्तमान काल में सीधा व्यक्तिगत प्रेम व्यक्त करती है; हिन्दी में स्वाभाविक और अर्थनिष्ठ रूप।
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: मेरे जीवन और मेरे बच्चों की चिंता करो
  rationale: यहाँ ἀντιποιέομαι संबंधवाचक कारक के साथ किसी के हित या सुरक्षा की चिंता करने का भाव देता है; ‘दावा करना’ संदर्भ में अनुपयुक्त होगा।
- source_word: ἀπολαῦσαι ... τῆς ἐπιθυμίας μου
  choice: अपनी अभिलाषा का सुख भी पा लूँ
  rationale: ἀπολαύω का मूल भाव किसी वस्तु को प्राप्त करके उसका लाभ या सुख पाने का है; यह अनुवाद केवल ‘इच्छा पूरी होना’ कहकर उस भाव को सपाट नहीं करता।
theological_decisions:
- issue: वक्ता का लिंग
  choice: मुख्य पाठ में लिंग-निरपेक्ष ‘उसने’ और ‘मैं’ रखा गया
  alternative: ‘उस स्त्री ने’ अथवा ‘उस पुरुष ने’
  rationale: यूनानी λέγει क्रिया स्वयं वक्ता का लिंग नहीं बताती। इसलिए प्रसंग से लिंग आरोपित करने के बजाय मूल की व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और संवादात्मक रखी गई है। ‘तो देखो’ οὖν और ἰδού के संयुक्त बल को स्वाभाविक हिन्दी में व्यक्त करता है।
