reference: Testament of Joseph 8:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/005.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: hi
  text: और जब मैं बेड़ियों में था, तब वह मिस्री स्त्री दुःख से व्याकुल थी। वह आकर मेरी सुनती थी कि मैं कैसे प्रभु को धन्यवाद देता था, अन्धकार के घर में भजन गाता था, और प्रसन्न स्वर में आनन्दित होकर अपने परमेश्वर की महिमा करता था, क्योंकि किसी बहाने से मुझे उस मिस्री स्त्री से छुटकारा मिल गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: बेड़ियों में
  rationale: यह पदबन्ध वास्तविक बन्धन अथवा कारावास को सूचित करता है; ‘बेड़ियों में’ हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: दुःख से व्याकुल थी
  rationale: συνέχω का शाब्दिक भाव ‘जकड़े/दबाए रखना’ है; प्रसंग में दुःख से अभिभूत या व्याकुल होना स्वाभाविक हिन्दी अर्थ देता है।
- source_word: ἐπηκροᾶτό μου
  choice: छिपकर मेरी बातें सुनती थी
  rationale: क्रिया ध्यान लगाकर अथवा चोरी-छिपे सुनने का भाव रखती है; प्रसंग में उसके आकर यूसुफ को सुनने को व्यक्त किया गया है।
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: अन्धकार के घर में
  rationale: मूल रूपक को संरक्षित रखा गया है; यह कारागार की ओर संकेत करता है, पर उसे सीधे ‘कारागार’ बनाकर रूपक नहीं मिटाया गया।
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: प्रसन्न स्वर से
  rationale: ἱλαρός हर्षपूर्ण, प्रसन्न या उल्लसित भाव बताता है; ‘प्रसन्न स्वर’ आधुनिक हिन्दी में सहज है।
- source_word: διὰ προφάσεως
  choice: एक बहाने के द्वारा
  rationale: πρόφασις का सामान्य अर्थ बहाना या प्रकट कारण है। मूल की कुछ असामान्य अभिव्यक्ति और सम्भावित विडम्बना को बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: ἀπηλλάγην
  choice: मुझे ... से छुटकारा मिल गया था
  rationale: निष्क्रिय क्रिया का अर्थ छुड़ाया जाना या मुक्त होना है; हिन्दी में यह संरचना स्वाभाविक है और कर्ता को अनिर्दिष्ट रखती है।
theological_decisions:
- issue: यूसुफ के छुटकारे का कर्ता
  choice: निष्क्रिय रूप में ‘मुझे ... छुटकारा मिल गया था’
  alternative: ‘परमेश्वर ने मुझे ... छुड़ाया था’
  rationale: यद्यपि निकट प्रसंग में यूसुफ परमेश्वर की महिमा करता है, यूनानी वाक्य में छुटकारे का कर्ता स्पष्ट नहीं है; इसलिए उसे जोड़ा नहीं गया।
- issue: ‘अन्धकार का घर’ की पहचान
  choice: मूल रूपक को यथावत रखना
  alternative: ‘अन्धकारमय कारागार में’
  rationale: यह कारागार का संकेत हो सकता है, पर मूल की काव्यात्मक और धार्मिक ध्वनि बनाए रखने के लिए रूपक को स्पष्टार्थ से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘अन्धकार के घर’ और ‘एक बहाने के द्वारा’ जैसी स्रोत-पाठ की विशिष्ट अभिव्यक्तियों को सुरक्षित रखा गया है, जबकि कठिन यूनानी मुहावरों को साधारण पाठक के लिए स्वाभाविक हिन्दी में व्यक्त किया गया है।
