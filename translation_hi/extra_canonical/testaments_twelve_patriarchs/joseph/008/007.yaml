  text: पर वह नहीं जानती थी कि मैंने ऐसा अपने प्रभु के कारण कहा था, न कि उसके कारण।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔγνω
  choice: नहीं जानती थी
  rationale: ग्रीक एओरिस्ट को प्रसंगानुकूल भूतकाल में स्वाभाविक हिन्दी के साथ व्यक्त किया गया है।
- source_word: διὰ τὸν Κύριόν μου
  choice: अपने प्रभु के कारण
  rationale: διά के कारणवाचक अर्थ और μου के संबंध को बनाए रखता है; 'प्रभु' Κύριος का प्रतिष्ठित और संदर्भतः उपयुक्त रूप है।
- source_word: εἶπον οὕτως
  choice: मैंने ऐसा ... कहा था
  rationale: οὕτως को 'ऐसा' से और εἶπον को भूतकाल से निकट तथा स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: οὐχὶ δι᾽ αὐτήν
  choice: न कि उसके कारण
  rationale: पूर्ववर्ती διά की समानांतर कारणवाचक संरचना और मूल का स्पष्ट विरोध सुरक्षित रखा गया है।
theological_decisions:
- issue: Κύριόν μου का संदर्भ
  choice: अपने प्रभु
  alternative: अपने स्वामी
  rationale: मूल में संदर्भ को और स्पष्ट नहीं किया गया; इसलिए 'प्रभु' रखकर संभावित ईश्वरीय संकेत और शाब्दिक अस्पष्टता को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
