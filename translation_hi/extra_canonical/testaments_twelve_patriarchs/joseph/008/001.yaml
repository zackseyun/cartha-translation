id: T12P.JOS.8.1
reference: Testament of Joseph 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Λέγω οὖν¹, τέκνα μου², ὅτι ὥρα *ἦν ὡσεὶ³ ἕκτη ὅτε³ ἐξῆλθεν ἀπ᾽ ἐμοῦ⁴. *Καὶ κλίνας γόνυ⁵ πρὸς Κύριον ὅλην τὴν ἡμέραν καὶ ὅλην τὴν νύκτα⁶, πρὸς⁷ ὄρθρον ἀνέστην, δακρύων⁸ καὶ αἰτῶν⁹ λύτρωσιν *ἐξ αὐτῆς¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/001.yaml
  text: So I say to you, my children, that it was about the sixth hour when she left me. And after bending my knee to the Lord all day and all night, toward dawn I rose, weeping and asking for deliverance from her.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, मैं तुमसे कहता हूँ कि जब वह मेरे पास से चली गई, तब लगभग छठा घंटा था। और दिन भर तथा रात भर प्रभु के सामने घुटने टेकने के बाद, भोर होते-होते मैं उठा—रोता हुआ और उससे छुटकारा पाने की विनती करता हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥρα ἦν ὡσεὶ ἕκτη
  choice: लगभग छठा घंटा था
  rationale: प्राचीन समय-सूचक अभिव्यक्ति को मूल के निकट रखा गया है; इसे आधुनिक घड़ी के समय में बदलने से अनिश्चितता और सांस्कृतिक संदर्भ मिट जाता।
- source_word: ἐξῆλθεν ἀπ᾽ ἐμοῦ
  choice: वह मेरे पास से चली गई
  rationale: ἀπ᾽ ἐμοῦ अलग होने या पास से चले जाने का भाव देता है; सहज हिन्दी में यही अर्थ स्पष्ट है।
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: प्रभु के सामने घुटने टेकने के बाद
  rationale: शाब्दिक ‘प्रभु की ओर घुटना मोड़कर’ के बजाय प्रार्थना की मुद्रा को स्वाभाविक और अर्थनिष्ठ हिन्दी में व्यक्त किया गया है।
- source_word: πρὸς ὄρθρον
  choice: भोर होते-होते
  rationale: यह भोर के निकट या भोर की ओर बढ़ते समय को दर्शाता है; हिन्दी वाक्य में ‘भोर होते-होते’ स्वाभाविक है।
- source_word: λύτρωσιν ἐξ αὐτῆς
  choice: उससे छुटकारा पाने की
  rationale: λύτρωσις यहाँ उस स्त्री से मुक्ति या बचाव के लिए है; ‘छुटकारा’ प्रसंगानुकूल और सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: λύτρωσις का धार्मिक या सामान्य अर्थ
  choice: छुटकारा
  alternative: उद्धार
  rationale: इस प्रसंग में यूसुफ किसी स्त्री के प्रलोभन या प्रभाव से मुक्ति माँगता है; ‘उद्धार’ अनावश्यक रूप से व्यापक धर्मवैज्ञानिक अर्थ ला सकता है।
- issue: πρὸς Κύριον में प्रार्थना की दिशा
  choice: प्रभु के सामने
  alternative: प्रभु की ओर
  rationale: ‘प्रभु के सामने घुटने टेकना’ आधुनिक हिन्दी में प्रार्थनापूर्ण समर्पण को सहज रूप से व्यक्त करता है, बिना किसी विशिष्ट उपासना-पद्धति को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सुबोध शैली। ‘छठा घंटा’ मूल की प्राचीन समय-गणना को सुरक्षित रखता है। संबोधन में स्वाभाविक बहुवचन ‘मेरे बच्चो’ प्रयुक्त है।
