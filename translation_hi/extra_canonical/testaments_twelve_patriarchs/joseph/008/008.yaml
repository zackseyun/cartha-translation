id: T12P.JOS.8.8
reference: Testament of Joseph 8:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν γάρ τις *ὑποπέσῃ πάθει⁵⁰ ἐπιθυμίας⁵¹ καὶ *δουλωθῇ αὐτῷ⁵² ὡς κἀκείνη, κἂν ἀγαθόν⁵³ τι ἀκούσῃ⁵⁴ εἰς *ἐκεῖνο τὸ⁵⁵ πάθος⁵⁶ *ἐκλαμβάνει αὐτὸ⁵⁷ πρὸς *τὴν πονηρὰν ἐπιθυμίαν⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/008.yaml
  text: For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he takes it in relation to that passion, toward his evil desire.
translation:
  language: hi
  text: क्योंकि यदि कोई वासना के आवेग के अधीन हो जाए और उसका दास बन जाए, जैसा कि वह स्त्री भी थी, तो वह कोई अच्छी बात सुनकर भी उसे उसी आवेग के संदर्भ में, अपनी बुरी वासना के अनुकूल, समझता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας
  choice: वासना के आवेग के अधीन हो जाए
  rationale: ὑποπίπτω अधीन हो जाने का भाव देता है; πάθος यहाँ मन पर हावी आवेग है और ἐπιθυμία संदर्भ में अनैतिक वासना है। यह अनुवाद दोनों पदों का भेद यथासंभव बनाए रखता है।
- source_word: δουλωθῇ αὐτῷ
  choice: उसका दास बन जाए
  rationale: δουλόω दासत्व में आने या पूरी तरह वश में हो जाने की प्रबल उपमा रखता है, इसलिए इसे हल्का करके केवल ‘वश में’ नहीं किया गया।
- source_word: ἀγαθόν τι ἀκούσῃ
  choice: कोई अच्छी बात सुनकर
  rationale: ἀγαθόν τι व्यापक और अनिश्चित है; ‘अच्छी बात’ इसी अस्पष्टता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: εἰς ἐκεῖνο τὸ πάθος ἐκλαμβάνει αὐτό
  choice: उसे उसी आवेग से जोड़कर … समझता है
  rationale: ἐκλαμβάνει का आशय बात को किसी खास अर्थ या संदर्भ में ग्रहण करना है। ‘समझता है’ सहज हिन्दी है और ‘उसी आवेग से जोड़कर’ εἰς-वाक्यांश की दिशा स्पष्ट करता है।
- source_word: πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: अपनी बुरी वासना के अनुसार
  rationale: πρός यहाँ व्याख्या की दुष्ट अभिलाषा की ओर उन्मुखता बताता है। ‘के अनुसार’ हिन्दी में उस विकृत अर्थ-ग्रहण को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: πάθος और ἐπιθυμία के संबंध को कैसे व्यक्त किया जाए
  choice: ‘वासना के आवेग’ तथा आगे ‘बुरी वासना’
  alternative: ‘अभिलाषा की लालसा’ या दोनों स्थानों पर केवल ‘वासना’
  rationale: यूनानी पाठ में πάθος और ἐπιθυμία अलग शब्द हैं। हिन्दी में पूर्ण शाब्दिक पुनरावृत्ति अस्वाभाविक होती; चुनी हुई अभिव्यक्ति मन पर हावी दशा और उसकी अनैतिक दिशा दोनों को बनाए रखती है।
- issue: ὡς κἀκείνη में स्त्री-संदर्भ
  choice: ‘जैसा कि वह स्त्री भी बन गई थी’
  alternative: ‘जैसी कि वह भी थी’
  rationale: यूनानी स्त्रीलिंग संकेत को हिन्दी में स्पष्ट करना आवश्यक है, जबकि उसका नाम जोड़ना पाठ से परे होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दासत्व की मूल उपमा और अच्छे कथन को कामना के अनुसार विकृत ढंग से ग्रहण करने की नैतिक-मनोवैज्ञानिक धारणा सुरक्षित रखी गई है।
