lexical_decisions:
- source_word: Τέλος
  choice: अन्त में
  rationale: घटनाक्रम के चरम बिंदु या अंतिम प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βίᾳ / μετὰ βίας
  choice: बलपूर्वक / ज़बरदस्ती
  rationale: मूल में बल के दोहरे उल्लेख को बनाए रखते हुए हिन्दी में अनावश्यक यांत्रिक पुनरावृत्ति से बचाता है।
- source_word: ἐπελαμβάνετό μου τῶν ἱματίων
  choice: उसने ... मेरे वस्त्र पकड़ लिए
  rationale: वस्त्रों को बल से थाम लेने की क्रिया का स्पष्ट और स्वाभाविक अनुवाद।
- source_word: ἐφελκομένη με
  choice: मुझे ... खींचने लगी
  rationale: कृदन्त की जारी या प्रयत्नशील क्रिया को हिन्दी में सहज रूप से दर्शाता है।
- source_word: εἰς συνουσίαν
  choice: संभोग के लिए
  rationale: यहाँ συνουσία का संदर्भ स्पष्टतः यौन-संबंध है; इसलिए सटीक, वर्तमान और गरिमापूर्ण शब्द चुना गया है।
