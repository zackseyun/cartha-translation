  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण कथात्मक शैली अपनाई गई है। स्त्री की उन्मत्त अवस्था, अंगरखे पर उसकी जारी पकड़, और यूसुफ के तत्काल पलायन की गति को बनाए रखा गया है।
