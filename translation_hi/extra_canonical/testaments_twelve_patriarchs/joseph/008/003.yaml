source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς ⌜οὖν⌉¹⁴ εἶδον¹⁵ ὅτι μαινομένη¹⁶ κρατεῖ μου τὸν χιτῶνα, καταλείψας αὐτὸν [καὶ ἐκτιναξάμενος] ἔφυγον γυμνός¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/003.yaml
  text: Therefore, when I saw that she, in her frenzy, was seizing my tunic, leaving it [and shaking it off], I fled naked.
translation:
  language: hi
  text: इसलिए जब मैंने देखा कि वह उन्मत्त होकर मेरा अंगरखा पकड़े हुए है, तो उसे छोड़कर [और उसे झटककर][a] मैं नंगा भाग गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और उसे झटककर” यूनानी पाठ में कोष्ठकों में है; संभव है कि ये शब्द मूल पाठ का हिस्सा न हों। इसका अर्थ “अपने को छुड़ाकर” भी हो सकता है।
    reason: स्रोत संस्करण में καὶ ἐκτιναξάμενος को कोष्ठकों में दिया गया है, और मध्यवाच्य रूप अर्थ की कुछ वास्तविक अस्पष्टता बनाए रखता है।
lexical_decisions:
- source_word: μαινομένη
  choice: उन्मत्त होकर
  rationale: यह वर्तमान कृदन्त स्त्री की उन्मादपूर्ण अवस्था या व्यवहार को व्यक्त करता है; यह अनुवाद उसकी तीव्रता बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: κρατεῖ
  choice: पकड़े हुए है
  rationale: क्रिया का वर्तमान काल लगातार मजबूत पकड़ को सूचित करता है; ‘पकड़े हुए है’ हिन्दी में इस पहलू को सहज रूप से व्यक्त करता है।
- source_word: χιτῶνα
  choice: अंगरखा
  rationale: χιτών शरीर पर पहना जाने वाला वस्त्र है; ‘अंगरखा’ आधुनिक पाठक के लिए गरिमापूर्ण और पर्याप्त रूप से व्यापक समतुल्य है।
- source_word: καταλείψας αὐτόν
  choice: उसे छोड़कर
  rationale: पुल्लिंग सर्वनाम का निकटतम पूर्वपद अंगरखा है; संक्षिप्त अनुवाद मूल की संरचना बनाए रखता है।
- source_word: ἐκτιναξάμενος
  choice: उसे झटककर
  rationale: मध्यवाच्य कृदन्त झटककर अलग करने या अपने को छुड़ाने का भाव दे सकता है। मुख्य पाठ में संक्षिप्त ‘उसे झटककर’ रखा गया है, जबकि पाठगत अनिश्चितता को कोष्ठकों और पादटिप्पणी में दर्शाया गया है।
- source_word: γυμνός
  choice: नंगा
  rationale: शब्द निर्वस्त्र या अपर्याप्त वस्त्र पहने होने का भाव दे सकता है; प्रसंग में अंगरखा छोड़कर भागने की तीव्रता को ‘नंगा’ सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
