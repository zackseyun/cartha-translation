base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/001.yaml
  text: And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust, because you punish as a wrongdoer a free man who has been kidnapped.”
translation:
  language: hi
  text: और मेम्फिस ने खिड़कियों से मुझे पिटते हुए देखा—क्योंकि उसका घर पास ही था—और उसने उसके पास संदेश भेजकर कहा, “तुम्हारा फैसला अन्यायपूर्ण है, क्योंकि तुम एक अपहृत स्वतंत्र मनुष्य को ऐसे दंड दे रहे हो, मानो उसने अपराध किया हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ δὲ Μεμφὶς
  choice: और मेम्फिस ने
  rationale: व्यक्तिनाम को ध्वन्यात्मक रूप से रखा गया है; δὲ को प्रसंग आगे बढ़ाने वाले स्वाभाविक ‘और’ से व्यक्त किया गया है।
- source_word: διὰ τῶν θυρίδων
  choice: खिड़कियों से
  rationale: θυρίς छोटी खिड़की या झरोखे को सूचित कर सकता है; बहुवचन और सामान्य दृश्य-संदर्भ में ‘खिड़कियों’ सहज तथा पर्याप्त रूप से सटीक है।
- source_word: τυπτόμενόν με
  choice: मुझे पिटते हुए
  rationale: वर्तमान कर्मवाच्य कृदन्त चल रही मारपीट को दर्शाता है; हिन्दी में यह रूप उस पक्ष को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἀπέστειλε πρὸς αὐτόν
  choice: उसने उसके पास संदेश भेजकर
  rationale: क्रिया का शाब्दिक अर्थ ‘भेजा’ है, पर कथन के साथ हिन्दी में निहित संदेश को स्पष्ट करना स्वाभाविक है; αὐτόν की संदर्भगत अस्पष्टता ‘उसके’ में सुरक्षित है।
- source_word: Ἄδικος ἡ κρίσις σου
  choice: तुम्हारा न्याय अन्यायपूर्ण है
  rationale: κρίσις यहाँ न्यायिक निर्णय या न्याय को सूचित करता है; यह अनुवाद कथन की सीधी निन्दा बनाए रखता है।
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: एक अपहृत स्वतंत्र मनुष्य को
  rationale: κλαπέντα का मूल भाव ‘चुरा लिया गया’ है, पर मनुष्य के संदर्भ में ‘अपहृत’ आधुनिक हिन्दी में प्राकृतिक और अर्थ-सटीक है; ἐλεύθερον उसकी स्वतंत्र सामाजिक स्थिति को बनाए रखता है।
- source_word: ὡς ἀδικήσαντα
  choice: मानो उसने अपराध किया हो
  rationale: ὡς आरोपित या मानी हुई स्थिति दर्शाता है, इसलिए ‘मानो’ आवश्यक तनाव बनाए रखता है; ἀδικέω को यहाँ सामान्य अपराध/गलत काम के अर्थ में व्यक्त किया गया है।
