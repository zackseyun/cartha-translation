translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की प्रत्यक्ष वाणी, कर्मवाच्यता और ‘मानो’ में निहित आरोपित दोष को सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
