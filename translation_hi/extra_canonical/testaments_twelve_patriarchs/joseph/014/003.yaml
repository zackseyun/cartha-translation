  text: And the woman kept saying to her husband, “Why do you keep this captive and noble boy in chains, when he ought rather to be set free and waited upon?”
translation:
  language: hi
  text: और वह स्त्री अपने पति से बार-बार कहती थी, “तुम इस बंदी और कुलीन युवक को बेड़ियों में क्यों रखे हुए हो? उसे तो मुक्त होना और उसकी सेवा की जानी चाहिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγε
  choice: बार-बार कहती थी
  rationale: अपूर्ण भूतकाल यहाँ निरंतर या बारंबार कही जाने वाली बात का भाव देता है।
- source_word: αἰχμάλωτον
  choice: बंदी
  rationale: यह युद्धबंदी अथवा पकड़कर रखे गए व्यक्ति का सामान्य अर्थ संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὐγενῆ παῖδα
  choice: कुलीन युवक
  rationale: εὐγενής के उच्च/भले कुल में जन्मे होने के अर्थ को ‘कुलीन’ और παῖς के संदर्भानुकूल युवा पुरुष के अर्थ को ‘युवक’ से व्यक्त किया गया है।
- source_word: ἐν δεσμοῖς
  choice: बेड़ियों में
  rationale: शाब्दिक ‘बंधनों में’ की अपेक्षा बंदी की वास्तविक दशा के लिए यह अधिक स्वाभाविक और सजीव हिन्दी है।
- source_word: ἄνετον εἶναι
  choice: मुक्त रहना
  rationale: ἄνετος बंधन से छुड़ा हुआ या स्वतंत्र होने का भाव देता है; यह आवश्यक नहीं कि यहाँ औपचारिक रिहाई की क्रिया ही अभिप्रेत हो।
- source_word: ὑπηρετεῖσθαι
  choice: इसकी सेवा की जानी
  rationale: कर्मवाच्य रूप को सुरक्षित रखते हुए यह बताता है कि युवक दूसरों की सेवा पाने योग्य था।
