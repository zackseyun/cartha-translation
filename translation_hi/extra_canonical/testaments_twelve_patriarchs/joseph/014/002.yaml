  text: But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come.
translation:
  language: hi
  text: लेकिन चूँकि मैंने मार खाते हुए भी अपना बयान नहीं बदला, उसने आदेश दिया कि मुझे तब तक पहरे में रखा जाए, जब तक उस लड़के के मालिक न आ जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν λόγον μου
  choice: अपना बयान
  rationale: यहाँ λόγος किसी पहले कही गई बात या गवाही के अर्थ में है; न्यायिक-जैसे प्रसंग में ‘बयान’ स्वाभाविक और सटीक है।
- source_word: τυπτόμενος
  choice: मार खाते हुए
  rationale: वर्तमान कर्मवाच्य कृदन्त जारी मारपीट के दौरान न बदलने का भाव देता है।
- source_word: φυλαχθῆναί με
  choice: मुझे पहरे में रखने
  rationale: कर्मवाच्य infinitive हिरासत अथवा निगरानी में रखे जाने को व्यक्त करता है, बिना आधुनिक कारावास की अनावश्यक विशिष्टता जोड़े।
- source_word: οἱ κύριοι τοῦ παιδός
  choice: उस लड़के के मालिक
  rationale: κύριοι बहुवचन में स्वामी/मालिक हैं और παιδός यहाँ दास या सेवक कहे जाने वाले युवक की ओर संकेत कर सकता है; मूल का संबंध स्पष्ट रखते हुए उसे अधिक निश्चित नहीं किया गया।
