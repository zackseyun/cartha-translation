review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the beating, Joseph's refusal to alter his statement, the order for custody, and the arrival of the boy's plural masters. However, Ὡς δέ is causal in this context ('but since'), whereas 'लेकिन जब' makes it primarily temporal ('but when').
  naturalness: The revision uses a clear causal connector and slightly smoother Hindi syntax for the ordered custody.
  terminology: '''अपना बयान'' is an appropriate contextual rendering of τὸν λόγον μου. ''पहरे में रखा जाए'' preserves the guarded-custody sense of φυλαχθῆναί without adding a specific modern legal category. ''उस लड़के के मालिक'' retains the source''s wording and does not resolve the possible semantic range of παις beyond the English audit trail.'
  issues:
  - severity: medium
    issue: Causal connective rendered as temporal
    rationale: 'Ὡς δέ introduces the reason for the order: Joseph did not alter his statement despite being beaten. ''जब'' can imply merely that the order followed at that time; ''चूँकि'' preserves the causal relationship.'
  revised_text: लेकिन चूँकि मैंने मार खाते हुए भी अपना बयान नहीं बदला, उसने आदेश दिया कि मुझे तब तक पहरे में रखा जाए, जब तक उस लड़के के मालिक न आ जाएँ।
