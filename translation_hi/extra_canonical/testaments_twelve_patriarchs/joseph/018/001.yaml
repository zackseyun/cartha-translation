translation:
  language: hi
  text: अतः, यदि तुम भी प्रभु की आज्ञाओं के अनुसार चलोगे, तो परमेश्वर तुम्हें भली वस्तुएँ देकर सदा के लिए ऊँचा उठाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: आज्ञाओं पर चलोगे
  rationale: आज्ञाओं के अनुसार जीवन बिताने के यूनानी मुहावरे को स्वाभाविक और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ὑψώσει
  choice: ऊँचा उठाएगा
  rationale: क्रिया के मूल अर्थ ‘ऊँचा करना/प्रतिष्ठित करना’ को बनाए रखता है और केवल सम्मान या समृद्धि तक सीमित नहीं करता।
- source_word: ἐν ἀγαθοῖς
  choice: भली वस्तुएँ देकर
  rationale: शाब्दिक ‘भली वस्तुओं में/के साथ’ हिन्दी में अस्वाभाविक है; यह रूप साधन या अनुकूल दशा के भाव को सहजता से व्यक्त करता है, बिना उसे केवल धन या आध्यात्मिक आशीषों तक सीमित किए।
- source_word: εἰς αἰῶνας
  choice: सदा के लिए
  rationale: दीर्घकालिक अथवा अनंत स्थायित्व के भाव का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: प्रभु की आज्ञाओं पर चलने और परमेश्वर द्वारा ऊँचा उठाए जाने का संबंध
  choice: यदि…तो की शर्तात्मक संरचना सुरक्षित रखी गई
  alternative: इसे केवल सामान्य प्रोत्साहन या निश्चित प्रतिज्ञा के रूप में व्यक्त करना
  rationale: यूनानी ἐὰν के स्पष्ट शर्तात्मक बल को बनाए रखा गया है, बिना अनुग्रह और कर्मों के व्यापक धर्मवैज्ञानिक संबंध पर अतिरिक्त निष्कर्ष थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य शैली। ‘तुम’ बहुवचन संबोधन के रूप में प्रयुक्त है; पाठ में संबोधित समूह के संदर्भ के अनुकूल है।
