source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ *ἐάν τις θέλει⁷ κακοποιῆσαι ὑμᾶς, ὑμεῖς τῇ ἀγαθοεργείᾳ⁸ εὔχεσθε ὑπὲρ αὐτοῦ, καὶ ἀπὸ παντὸς κακοῦ λυτρωθήσεσθε ὑπὸ⁹ Κυρίου¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/002.yaml
  text: And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.
translation:
  language: hi
  text: और यदि कोई तुम्हारा बुरा करना चाहे, तो तुम भलाई करके उसके लिए प्रार्थना करो; और प्रभु तुम्हें हर बुराई से छुड़ाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοποιῆσαι
  choice: बुरा करना
  rationale: यह क्रिया किसी के विरुद्ध बुरा या हानिकारक काम करने का सामान्य अर्थ रखती है; सरल और स्वाभाविक हिन्दी में इसी व्यापकता को रखा गया है।
- source_word: τῇ ἀγαθοεργείᾳ
  choice: भलाई करते हुए
  rationale: संज्ञात्मक यूनानी पद का आशय भलाई के सक्रिय आचरण से है। हिन्दी में क्रियाविशेषणीय रूप वाक्य के संबंध को स्वाभाविक रखते हुए स्पष्ट करता है।
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: उसके लिए प्रार्थना करो
  rationale: ὑπέρ यहाँ उस व्यक्ति के हित में की जाने वाली प्रार्थना को व्यक्त करता है।
- source_word: ἀπὸ παντὸς κακοῦ
  choice: हर बुराई से
  rationale: κακόν का रूप संदर्भ में व्यापक है और नैतिक बुराई, विपत्ति या हानि को समेट सकता है; ‘बुराई’ इस व्यापकता को अनावश्यक रूप से सीमित नहीं करती।
- source_word: λυτρωθήσεσθε ὑπὸ Κυρίου
  choice: प्रभु तुम्हें…छुड़ाएगा
  rationale: यूनानी कर्मवाच्य ‘तुम प्रभु के द्वारा छुड़ाए जाओगे’ को अधिक स्वाभाविक हिन्दी कर्तृवाच्य में रखा गया है, जबकि उद्धारकर्ता के रूप में प्रभु स्पष्ट बना रहता है।
theological_decisions:
- issue: भलाई, प्रार्थना और छुटकारे के बीच संबंध
  choice: यूनानी क्रम को बनाए रखते हुए भलाई करने और विरोधी के लिए प्रार्थना करने के बाद प्रभु द्वारा छुटकारे की प्रतिज्ञा व्यक्त की गई है।
  alternative: इसे किसी यांत्रिक प्रतिफल-सिद्धांत या छुटकारा अर्जित करने की शर्त के रूप में स्पष्ट करना।
  rationale: मूल पाठ संबंध को बताता है, पर उसकी सटीक धार्मिक कार्यविधि नहीं समझाता; इसलिए उस तनाव को बिना अतिरिक्त व्याख्या के रहने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। बहुवचन ‘तुम’ मूल के बहुवचन सर्वनाम और क्रियाओं को दर्शाता है।
