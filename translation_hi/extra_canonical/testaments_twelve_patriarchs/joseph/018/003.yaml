id: T12P.JOS.18.3
reference: Testament of Joseph 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδοὺ¹⁰ ⌜γὰρ⌉¹¹ ὁρᾶτε ὅτι ⌜διὰ τὴν *ταπείνωσιν καὶ τὴν μακροθυμίαν μου¹²⌉ θυγατέρα *ἱερέως ἡλιουπόλεως¹³ ἔλαβον ἐμαυτῷ¹⁴ εἰς γυναῖκα¹⁵, καὶ ἑκατὸν τάλαντα *χρυσίου δέδονταί μοι¹⁶ *σὺν αὐτῇ¹⁷, *καὶ ὁ¹⁸ Κύριός μου¹⁹ αὐτοὺς²⁰ κατεδούλωσεν²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/003.yaml
  text: For see, you know that through my humility and my long-suffering I took for myself as wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.
translation:
  language: hi
  text: क्योंकि देखो, तुम जानते हो कि अपनी दीनता और सहनशीलता के कारण मैंने हेलियोपोलिस के याजक की बेटी को अपने लिए पत्नी के रूप में ग्रहण किया; और उसके साथ मुझे सौ किक्कार सोना दिया गया, और मेरे प्रभु ने उन्हें मेरे अधीन कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπείνωσιν
  choice: दीनता
  rationale: यह शब्द विनम्र या नीची अवस्था/भाव को व्यक्त करता है; प्रसंग में यूसुफ के सद्गुण के रूप में ‘दीनता’ स्वाभाविक और गरिमापूर्ण है।
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: यह दीर्घकाल तक सहने और क्रोध को रोकने का भाव रखता है; आधुनिक हिन्दी में ‘धीरज’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἱερέως
  choice: याजक
  rationale: ग्रीक पद धार्मिक अधिकारी को सूचित करता है; ‘याजक’ बाइबलीय संदर्भ में स्पष्ट है और ‘पुरोहित’ की संभावित हिन्दू-सांस्कृतिक विशिष्टता से बचता है।
- source_word: ἡλιουπόλεως
  choice: हेलियोपोलिस
  rationale: स्थाननाम का मानक लिप्यंतरण रखा गया है; इसका अनुवाद ‘सूर्यनगर’ नहीं किया गया।
- source_word: τάλαντα
  choice: किक्कार
  rationale: यह प्राचीन भार-मात्रा है, आधुनिक मुद्रा नहीं; हिन्दी बाइबलीय परंपरा का परिचित समतुल्य ‘किक्कार’ चुना गया।
- source_word: κατεδούλωσεν
  choice: मेरे अधीन कर दिया
  rationale: शाब्दिक अर्थ दास या अधीन बनाना है; यहाँ बहुवचन सर्वनाम का संदर्भ अस्पष्ट होने से ऐसा स्वाभाविक वाक्यांश चुना गया जो मूल की अधीनता को बनाए रखता है।
theological_decisions:
- issue: ‘मेरे प्रभु’ में प्रभु की पहचान
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: Κύριός μου को मूल की तरह बिना व्याख्या के रखा गया है; इससे यह निश्चय नहीं थोपा जाता कि संकेत परमेश्वर की ओर है या किसी मानवीय स्वामी की ओर।
- issue: αὐτούς का संदर्भ
  choice: उन्हें
  alternative: उनको अर्थात् संबंधित लोगों/वस्तुओं को स्पष्ट करके लिखना
  rationale: पुल्लिंग बहुवचन सर्वनाम का निकट संदर्भ पाठ में स्पष्ट नहीं है; मूल की वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय और स्रोत-समीप शैली रखी गई है। ἐμαυτῷ को ‘अपने लिए’ से स्पष्ट किया गया है। वाक्य की कारणात्मक शुरुआत γὰρ के लिए ‘क्योंकि’ से और Ἰδού के लिए ‘देखो’ से व्यक्त हुई है।
