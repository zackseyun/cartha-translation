  - severity: low
    issue: ‘बेटी को अपने लिए पत्नी बनाया’ का प्रयोग कुछ अस्वाभाविक है।
    rationale: यूनानी ἔλαβον ... εἰς γυναῖκα का आशय ‘पत्नी के रूप में ग्रहण किया’ है; यह आधुनिक मानक हिन्दी में अधिक स्वाभाविक है।
