id: T12P.JOS.18.4
reference: Testament of Joseph 18:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καίγε καὶ²² ὡραιότητα ἔδωκέ²³ μοι ὑπὲρ ὡραίους Ἰσραήλ, ⌜καὶ⌉ ἐφύλαξέ²⁴ με ⌜ἕως γήρους²⁵ ἐν δυνάμει καὶ⌉ ἐν κάλλει· *Καὶ γὰρ ὅμοιος ἤμην²⁶ ἐν πᾶσι τῷ²⁷ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/004.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things.
translation:
  language: hi
  text: सचमुच, उसने मुझे इस्राएल के सुंदर पुरुषों से भी बढ़कर सुंदरता दी, और बुढ़ापे तक मुझे सामर्थ्य और सुंदरता में बनाए रखा; क्योंकि मैं हर बात में याकूब के समान था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα
  choice: सुंदरता
  rationale: यहाँ शब्द शारीरिक रूप-सौंदर्य को व्यक्त करता है; आधुनिक हिन्दी में ‘सुंदरता’ स्वाभाविक और स्पष्ट है।
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: इस्राएल के सुंदर पुरुषों से भी बढ़कर
  rationale: ὑπέρ के तुलनात्मक भाव को सुरक्षित रखते हुए ὡραίους को पुरुषवाचक संदर्भ में अनूदित किया गया है।
- source_word: ἐφύλαξέ με
  choice: मुझे ... बनाए रखा
  rationale: संदर्भ में आशय केवल रक्षा करने का नहीं, बल्कि वृद्धावस्था तक सामर्थ्य और सुंदरता की दशा में सुरक्षित रखने का है।
- source_word: ἕως γήρους
  choice: बुढ़ापे तक
  rationale: मूल पाठ की काल-सीमा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: सामर्थ्य और सुंदरता में
  rationale: दोनों समानांतर गुणों को अलग और स्पष्ट रखते हुए यूनानी संरचना का निकट रूप दिया गया है।
- source_word: ἐν πᾶσι
  choice: हर बात में
  rationale: व्यापक समानता को बनाए रखता है, बिना यह निर्धारित किए कि समानता केवल रूप, चरित्र या जीवन-परिस्थितियों में थी।
theological_decisions:
- issue: याकूब से ‘हर बात में’ समानता का विस्तार
  choice: मैं हर बात में याकूब के समान था
  alternative: मैं इन सब बातों में याकूब के समान था
  rationale: ἐν πᾶσι व्यापक और कुछ हद तक खुला हुआ कथन है। अनुवाद ने इसे केवल पूर्वोक्त सामर्थ्य और सुंदरता तक सीमित करके अस्पष्टता को समाप्त नहीं किया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सचमुच’ Καίγε καὶ के बलात्मक आरंभ को व्यक्त करता है। किसी पाठालोचनात्मक पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि दिए गए पाठ में चिह्नित अंशों के आधार पर सतत अर्थ स्पष्ट है।
