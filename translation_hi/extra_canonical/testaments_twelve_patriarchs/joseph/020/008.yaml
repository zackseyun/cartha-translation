reference: Testament of Joseph 20:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ ἐν τῇ ἐξόδῳ τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου συνήγαγον τὰ ὀστᾶ Ἰωσήφ, καὶ ἔθαψαν αὐτὸν ἐν Χεβρὼν μετὰ τῶν πατέρων αὐτοῦ· ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ ἔτη ἑκατὸν δέκα⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/008.yaml
  text: And in the exodus of the sons of Israel from Egypt they gathered up the bones of Joseph, and buried him in Hebron with his fathers; and the years of his life were one hundred and ten years.
translation:
  language: hi
  text: और जब इस्राएल के पुत्र मिस्र से निकले, तब उन्होंने यूसुफ की हड्डियाँ इकट्ठी कीं और उसे हेब्रोन में उसके पुरखाओं के साथ दफ़नाया। उसके जीवन के वर्ष एक सौ दस थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἐξόδῳ
  choice: जब ... निकले
  rationale: ग्रीक संज्ञात्मक वाक्यांश का स्वाभाविक हिन्दी कालवाचक उपवाक्य; ‘निर्गमन’ की तकनीकी ध्वनि से बचते हुए अर्थ सुरक्षित रखा गया।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्र
  rationale: वंशगत सामूहिक पद का औपचारिक और स्रोत-सन्निकट अनुवाद।
- source_word: συνήγαγον τὰ ὀστᾶ Ἰωσήφ
  choice: उन्होंने यूसुफ की हड्डियाँ इकट्ठी कीं
  rationale: συνάγω के ‘एकत्र करना’ अर्थ को स्पष्ट रूप से रखा गया; यूसुफ का नाम मूल की तरह हड्डियों से संबद्ध है।
- source_word: ἔθαψαν αὐτὸν
  choice: उसे ... दफ़नाया
  rationale: एकवचन सर्वनाम मृत यूसुफ को व्यक्ति के रूप में संदर्भित करता है, केवल हड्डियों को नहीं।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पुरखाओं के साथ
  rationale: πατέρες यहाँ व्यापक अर्थ में पूर्वजों/पुरखाओं को सूचित करता है; ‘पिताओं’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔτη ἑκατὸν δέκα
  choice: एक सौ दस
  rationale: आयु की संख्या को मूल के अनुसार यथावत रखा गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ग्रीक पाठ के दोनों समन्वित खंड स्पष्ट वाक्यों में दिए गए हैं; कोई सांप्रदायिक या व्याख्यात्मक विस्तार नहीं जोड़ा गया।
