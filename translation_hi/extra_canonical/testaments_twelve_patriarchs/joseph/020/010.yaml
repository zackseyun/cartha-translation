  text: और सारे इस्राएल और सारे मिस्र ने उसके लिए बहुत शोक मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπένθησεν … πένθος μέγα
  choice: बहुत शोक मनाया
  rationale: यूनानी में सजातीय क्रिया और संज्ञा के द्वारा शोक की तीव्रता व्यक्त की गई है। स्वाभाविक आधुनिक हिन्दी में ‘बहुत शोक मनाया’ उसी बल को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  choice: सारे इस्राएल और सारे मिस्र
  rationale: दोनों समुदायों की व्यापक सहभागिता पर यूनानी पाठ का समान बल बनाए रखा गया है; यहाँ स्थाननाम अपने लोगों के लिए सामूहिक रूप से प्रयुक्त हैं।
- source_word: αὐτόν
  choice: उसके लिए
  rationale: शोक मनाने के हिन्दी प्रयोग में मृत व्यक्ति के संबंध को स्वाभाविक रूप से व्यक्त करता है, जबकि यूनानी कर्मकारक का आशय सुरक्षित रहता है।
