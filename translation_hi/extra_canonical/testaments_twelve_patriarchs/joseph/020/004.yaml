  text: And after saying these things, he stretched out his feet and fell asleep in a good sleep.
translation:
  language: hi
  text: और ये बातें कहकर उसने अपने पैर फैलाए और सुखद नींद में सो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: उसने अपने पैर सीधे किए
  rationale: शाब्दिक अर्थ ‘अपने पैर फैलाए’ है; मृत्यु-शय्या के प्रसंग में ‘पैर सीधे किए’ स्वाभाविक हिन्दी है और मूल क्रिया की देहगत छवि बनाए रखता है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: क्रिया का प्रत्यक्ष अर्थ ‘सो गया’ है और मृत्यु के लिए सौम्य रूपक भी हो सकता है; अनुवाद मूल की इसी अर्थगत दोहरी संभावना को सुरक्षित रखता है।
- source_word: ὕπνῳ καλῷ
  choice: सुखद नींद में
  rationale: वाक्यांश का अर्थ ‘अच्छी/सुखद नींद में’ है, ‘अच्छी वृद्धावस्था में’ नहीं। ‘सुखद’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: ‘सो गया’ का मृत्यु-सूचक प्रयोग
  choice: सो गया
  alternative: मर गया
  rationale: मूल पाठ मृत्यु को स्पष्ट क्रिया से नहीं, नींद की भाषा में व्यक्त करता है। ‘मर गया’ करने से मूल रूपक और उसकी संभावित धार्मिक अर्थछाया अनावश्यक रूप से समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल यूनानी की संक्षिप्तता तथा मृत्यु और नींद के बीच की अर्थगत अस्पष्टता सुरक्षित रखी गई है।
