  text: And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.
translation:
  language: hi
  text: और अपनी माता आसनत को [हिप्पोड्रोम के पास][a] ले आना और उसे मेरी माता राहेल के निकट दफना देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हिप्पोड्रोम के पास” शब्द मूल यूनानी पाठ में कोष्ठकों में हैं; संभवतः इनके पाठ में होने पर संदेह है।
    reason: स्रोत संस्करण में इस वाक्यांश को वर्ग कोष्ठकों में रखकर पाठ-संबंधी अनिश्चितता दर्शाई गई है।
lexical_decisions:
- source_word: ἀγάγετε
  choice: ले आना
  rationale: यह बहुवचन आज्ञार्थक क्रिया है; प्रसंग में पुत्रों को माता के शव को निर्दिष्ट स्थान पर लाने का निर्देश दिया गया है।
- source_word: παρὰ τὸν Ἱππόδρομον
  choice: हिप्पोड्रोम के पास
  rationale: παρά के स्थानवाचक अर्थ ‘के पास/निकट’ को सुरक्षित रखा गया है और स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: θάψατε
  choice: दफना देना
  rationale: यूनानी आज्ञार्थक क्रिया का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: πλησίον Ῥαχιὴλ τῆς μητέρος μου
  choice: मेरी माता राहेल के निकट
  rationale: संबंध और स्थान—दोनों को मूल के अनुसार सीधे और स्वाभाविक ढंग से व्यक्त करता है।
