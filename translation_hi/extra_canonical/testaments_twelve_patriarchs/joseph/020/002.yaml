base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/002.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: hi
  text: और तुम मेरी हड्डियाँ अपने साथ ऊपर ले जाओगे। क्योंकि जब मेरी हड्डियाँ वहाँ ऊपर ले जाई जाएँगी, तब प्रभु ज्योति में तुम्हारे साथ होगा, और बेलियार अंधकार में मिस्रियों के साथ होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: अपने साथ ऊपर ले जाना
  rationale: क्रिया में साथ ले जाने और ऊपर की ओर ले जाने—दोनों भाव हैं; हिंदी में स्वाभाविक आज्ञार्थक अभिव्यक्ति रखी गई है।
- source_word: τὰ ὀστᾶ μου
  choice: मेरी हड्डियाँ
  rationale: यूनानी बहुवचन का सीधा और स्पष्ट अनुवाद।
- source_word: ἀναγομένων
  choice: ऊपर ले जाई जाएँगी
  rationale: कर्मवाच्य कृदंत और ऊपर ले जाने के स्थानगत भाव को बनाए रखता है।
- source_word: ἐν φωτί
  choice: ज्योति में
  rationale: प्रकाश के साथ-साथ धार्मिक-प्रतीकात्मक अर्थ की संभावना बनाए रखने के लिए गरिमापूर्ण 'ज्योति' चुना गया।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक रूपांतरण किया गया; इसे व्याख्यात्मक उपाधि में नहीं बदला गया।
- source_word: ἐν σκότει
  choice: अंधकार में
  rationale: यूनानी पद का सीधा अनुवाद, जो ज्योति के साथ मूल विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु का 'ज्योति में' साथ होना और बेलियार का 'अंधकार में' साथ होना
  choice: दोनों समानांतर कथनों को बिना व्याख्या जोड़े शाब्दिक रूप से बनाए रखा गया।
  alternative: '''ज्योति के रूप में'' और ''अंधकार के वश में'' जैसे व्याख्यात्मक रूप'
  rationale: मूल पाठ में ἐν के अर्थ और इस प्रकाश-अंधकार विरोध की धर्मवैचारिक जटिलता को किसी एक व्याख्या में सीमित नहीं किया गया।
- issue: ἐκεῖ का संदर्भ
  choice: वहाँ
  alternative: प्रतिज्ञात देश में
  rationale: मूल का संकेतवाचक शब्द अस्पष्ट है; निर्दिष्ट भू-स्थान जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक शैली। 'ऊपर ले जाना' निर्गमन/स्थानगत दिशा को बनाए रखता है; 'ज्योति' और 'अंधकार' मूल के समानांतर प्रतीकात्मक तनाव को सुरक्षित रखते हैं।
