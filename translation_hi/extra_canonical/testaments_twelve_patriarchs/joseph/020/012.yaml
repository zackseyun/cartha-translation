reference: Testament of Joseph 20:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/012.yaml
  text: For his kingdom will be an everlasting kingdom that will not pass away. But my kingdom among you is brought to completion, like a watchman’s hut in an orchard, which disappears after the summer.”
translation:
  language: hi
  text: क्योंकि उसका राज्य एक अनन्त राज्य होगा, जो कभी समाप्त नहीं होगा। परन्तु तुम्हारे बीच मेरा राज्य पूरा हो रहा है, जैसे फलोद्यान में चौकीदार की झोंपड़ी, जो गरमी बीतने के बाद गायब हो जाती है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία αὐτοῦ
  choice: उसका राज्य
  rationale: सर्वनाम के वास्तविक संदर्भ को बिना व्याख्यात्मक पहचान जोड़े सुरक्षित रखा गया है।
- source_word: αἰώνιος
  choice: अनन्त
  rationale: राज्य की स्थायी और युगान्तकारी अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ παρελεύσεται
  choice: कभी समाप्त नहीं होगा
  rationale: शाब्दिक ‘बीत नहीं जाएगा’ की अपेक्षा राज्य के संदर्भ में अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: बहुवचन समुदाय के भीतर/मध्य का स्थान-संबंध व्यक्त करता है; ‘तुम्हारे अन्दर’ जैसा संभावित मनोवैज्ञानिक अर्थ नहीं थोपता।
- source_word: ἐπιτελεῖται
  choice: अपने अन्त पर पहुँच रहा है
  rationale: वर्तमान काल तथा समापन/पूर्णता के भाव को बनाए रखता है और इसे भविष्यकाल नहीं बनाता।
- source_word: ὀπωροφυλάκιον
  choice: फलोद्यान में बनी रखवाले की झोंपड़ी
  rationale: फलों की रखवाली के लिए बनी अस्थायी कुटिया का सांस्कृतिक आशय स्पष्ट करता है।
- source_word: μετὰ τὸ θέρος
  choice: गरमी बीतने के बाद
  rationale: θέρος का अर्थ गरमी का मौसम अथवा कटनी का समय हो सकता है; झोंपड़ी के मौसमी बिंब के अनुरूप मुख्य पाठ में ‘गरमी’ चुना गया है।
- source_word: ἐξαφανίζεται
  choice: गायब हो जाती है
  rationale: क्रिया के लुप्त/अदृश्य हो जाने के स्पष्ट अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसका राज्य’ और ‘मेरा राज्य’ के बीच विरोध
  choice: दोनों सर्वनाम ज्यों के त्यों रखे गए हैं
  alternative: ‘उसका’ की पहचान किसी मसीही या दैवी उपाधि से करना, अथवा ‘मेरा राज्य’ को वंश/शासन के रूप में समझाकर अनूदित करना
  rationale: यूनानी पाठ संदर्भित व्यक्तियों की पहचान इस वाक्य में स्पष्ट नहीं करता; अनुवाद उस धार्मिक तनाव को हल नहीं करता।
- issue: ἐπιτελεῖται का काल और अर्थ
  choice: ‘अपने अन्त पर पहुँच रहा है’
  alternative: ‘पूरा किया जाता है’ या ‘पूरा होगा’
  rationale: वर्तमान रूप को बनाए रखते हुए यहाँ अगले क्षणभंगुर झोंपड़ी-बिंब के अनुकूल समाप्ति का भाव व्यक्त किया गया है, पर विनाश जैसी अधिक तीखी व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘फलोद्यान’ और ‘रखवाले की झोंपड़ी’ बिंब को स्पष्ट रखते हैं। उपलब्ध यूनानी पाठ में ὀπωροφυλάκιον के बाद का ‘γος’ पाठगत/मुद्रणगत अवशेष प्रतीत होता है और सार्थक अनुवाद में शामिल नहीं किया गया।
