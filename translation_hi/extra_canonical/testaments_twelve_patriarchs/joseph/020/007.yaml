- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  choice: सारे इस्राएल और सारे मिस्र
  rationale: दोनों समुदायों की समग्रता व्यक्त करने वाले πᾶς/πᾶσα को समानांतर रूप में रखा गया है। यहाँ स्थाननाम अपने लोगों का सामूहिक बोध कराते हैं।
- source_word: ἐπένθησεν αὐτὸν
  choice: उसके लिए ... शोक मनाया
  rationale: हिन्दी में मृत व्यक्ति के संबंध में शोक व्यक्त करने का यह स्वाभाविक और स्पष्ट प्रयोग है।
- source_word: πένθος μέγα
  choice: बड़ा शोक
  rationale: मूल यूनानी के संज्ञात्मक बल को बनाए रखते हुए मुहावरेदार हिन्दी दी गई है; क्रिया और संज्ञा की पुनरुक्ति को अस्वाभाविक बनाए बिना अर्थ सुरक्षित है।
