translation:
  language: hi
  text: और ये बातें कहकर उसने अपने पैर फैलाए और सुखद नींद में सो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: उसने अपने पैर सीधे किए
  rationale: मृत्यु से पहले लेटने की मुद्रा का स्वाभाविक हिन्दी वर्णन; यूनानी ‘पैर फैलाने’ के भाव को बनाए रखता है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: यूनानी क्रिया का सामान्य अर्थ ‘सो जाना’ है और यहाँ मृत्यु के लिए प्रयुक्त सौम्य संकेत को बिना स्पष्ट किए सुरक्षित रखता है।
- source_word: ὕπνῳ καλῷ
  choice: सुखद नींद में
  rationale: καλῷ के सकारात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘सुंदर नींद’ की असहज शाब्दिकता से बचता है।
theological_decisions:
- issue: क्या ἐκοιμήθη को स्पष्ट रूप से ‘मर गया’ अनूदित किया जाए
  choice: सो गया
  alternative: उसकी मृत्यु हो गई
  rationale: मूल पाठ नींद की रूपकात्मक भाषा रखता है; अनुवाद उसे स्पष्ट मृत्यु-वर्णन में बदलकर निहित अर्थ का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल के मृत्यु-सूचक सौम्य रूपक को सुरक्षित रखा गया है।
