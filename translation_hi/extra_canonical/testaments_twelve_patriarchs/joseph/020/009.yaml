  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: hi
  text: और ये बातें कहकर उसने अपने पाँव फैलाए और सुखद नींद में सो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: ये बातें कहकर
  rationale: ग्रीक कालवाचक कृदंत को स्वाभाविक हिन्दी पूर्वकालिक क्रिया से व्यक्त किया गया है।
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: उसने अपने पैर सीधे किए
  rationale: ἐκτείνω का मूल अर्थ ‘फैलाना/सीधा करना’ है; मृत्युशय्या के प्रसंग में ‘पैर सीधे किए’ स्वाभाविक और सटीक है।
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: सुखद नींद में सो गया
  rationale: καλῷ का अर्थ यहाँ ‘अच्छी/सुखद’ रखा गया है। ग्रीक पाठ में ‘अनन्त’ नहीं है, इसलिए मृत्यु के संकेत को स्पष्ट सिद्धांतगत कथन में नहीं बदला गया।
theological_decisions:
- issue: क्या ‘सो गया’ को सीधे ‘मर गया’ या ‘अनन्त नींद सो गया’ कहा जाए
  choice: सुखद नींद में सो गया
  alternative: मर गया / अनन्त नींद सो गया
  rationale: κοιμάομαι मृत्यु के लिए सौम्य रूपक हो सकता है, पर मूल पाठ जानबूझकर ‘नींद’ की भाषा रखता है और αἰώνιος (‘अनन्त’) अनुपस्थित है। इसलिए मूल की रूपकात्मकता और संभावित अर्थ-तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कोई पादटिप्पणी आवश्यक नहीं; मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
