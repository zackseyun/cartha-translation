id: T12P.JOS.20.1
reference: Testament of Joseph 20:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/001.yaml
  text: For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि मेरी मृत्यु के बाद मिस्री तुम पर अत्याचार करेंगे; परन्तु परमेश्वर तुम्हारा बदला लेगा और तुम्हें तुम्हारे पूर्वजों की प्रतिज्ञाओं में ले जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψουσιν
  choice: अत्याचार करेंगे
  rationale: यह क्रिया दबाने, सताने या क्लेश देने का भाव रखती है; प्रसंग में ‘अत्याचार करेंगे’ स्वाभाविक और स्पष्ट है।
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: तुम्हारा बदला लेगा
  rationale: यूनानी पदबंध का शाब्दिक अर्थ ‘तुम्हारे प्रतिशोध को पूरा करेगा’ है; हिन्दी में ‘तुम्हारा बदला लेगा’ न्याय दिलाने का वही भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπάξει
  choice: ले जाएगा
  rationale: मूल क्रिया भीतर या किसी लक्ष्य तक ले जाने का संकेत देती है; पाठ में वापसी का अर्थ स्पष्ट रूप से नहीं है, इसलिए ‘वापस’ नहीं जोड़ा गया।
- source_word: τὰς ἐπαγγελίας τῶν πατέρων ὑμῶν
  choice: तुम्हारे पूर्वजों की प्रतिज्ञाओं में
  rationale: बहुवचन ‘प्रतिज्ञाओं’ और संबंधकारक की संक्षिप्तता को सुरक्षित रखा गया है; इसे किसी एक प्रतिज्ञात स्थान के रूप में स्पष्ट करके मूल की अभिव्यक्ति को सीमित नहीं किया गया।
theological_decisions:
- issue: प्रतिशोध में परमेश्वर की भूमिका
  choice: परमेश्वर तुम्हारा बदला लेगा
  alternative: परमेश्वर तुम्हें न्याय दिलाएगा
  rationale: ‘न्याय दिलाएगा’ अर्थ को नरम और व्यापक कर देता; मूल में ἐκδίκησις का प्रतिशोध अथवा दंडात्मक न्याय वाला तनाव बनाए रखा गया है।
- issue: पूर्वजों की प्रतिज्ञाओं का आशय
  choice: तुम्हारे पूर्वजों की प्रतिज्ञाओं में
  alternative: तुम्हारे पूर्वजों से की गई प्रतिज्ञाओं की पूर्ति में
  rationale: वैकल्पिक रूप प्रतिज्ञाओं के प्राप्तकर्ता और उनकी पूर्ति—दोनों की व्याख्या जोड़ देता है। मूल की संबंधकारक रचना और ‘प्रतिज्ञाओं में ले जाएगा’ वाली असामान्य पर अर्थपूर्ण छवि को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘मिस्री’, ‘परमेश्वर’ और ‘पूर्वज’ सामान्य पाठक के लिए स्पष्ट हैं। विरामचिह्न से विरोधी उपवाक्यों का संबंध उभारा गया है।
