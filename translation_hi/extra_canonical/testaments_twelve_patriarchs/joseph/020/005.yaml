base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/005.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: hi
  text: और तुम मेरी हड्डियों को अपने साथ ऊपर ले जाओगे; क्योंकि जब मेरी हड्डियाँ वहाँ ऊपर ले जाई जाएँगी, तब प्रभु ज्योति में तुम्हारे साथ होगा, और बेलियार अंधकार में मिस्रियों के साथ होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: अपने साथ ऊपर ले जाना
  rationale: क्रिया में साथ ले जाने और ऊपर चढ़ाकर ले जाने—दोनों भाव हैं; हिन्दी में स्वाभाविक आज्ञार्थक अभिव्यक्ति रखी गई है।
- source_word: τὰ ὀστᾶ μου
  choice: मेरी हड्डियाँ
  rationale: मूल के प्रत्यक्ष और ठोस अर्थ को यथावत रखा गया है।
- source_word: ἐν φωτί
  choice: ज्योति में
  rationale: प्रकाश के साथ-साथ धार्मिक प्रतीकात्मकता बनाए रखने के लिए गरिमापूर्ण ‘ज्योति’ चुना गया है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: व्यक्तिवाचक नाम का लिप्यन्तरण किया गया है; इसे व्याख्यात्मक उपाधि में नहीं बदला गया।
- source_word: ἐν σκότει
  choice: अन्धकार में
  rationale: ‘ज्योति में’ के स्पष्ट विरोध को बनाए रखते हुए मूल रूपक सुरक्षित रखा गया है।
theological_decisions:
- issue: प्रभु और बेलियार की उपस्थिति का ज्योति-अन्धकार से सम्बन्ध
  choice: ‘प्रभु ज्योति में तुम्हारे साथ होगा’ और ‘बेलियार अन्धकार में मिस्रियों के साथ होगा’
  alternative: ‘प्रभु का प्रकाश तुम्हारे साथ होगा’ और ‘बेलियार का अन्धकार मिस्रियों के साथ होगा’
  rationale: मूल में प्रभु और बेलियार स्वयं क्रमशः ‘ज्योति में’ और ‘अन्धकार में’ साथ होंगे; प्रकाश या अन्धकार को उनका स्वामित्व बताना मूल की वाक्यगत और धर्मवैचारिक तनाव को बदल देता।
- issue: ἐκεῖ का संकेत
  choice: वहाँ
  alternative: उस देश में / प्रतिज्ञात देश में
  rationale: मूल संकेतवाचक शब्द स्थान को स्पष्ट नाम नहीं देता; इसलिए निहित स्थान की पहचान अनुवाद में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और मूल-सापेक्ष शैली। ‘ऊपर ले जाना’ निर्गमन और गन्तव्य की ओर चढ़ने का मूल भाव बचाता है; ‘ज्योति/अन्धकार’ का समानान्तर विरोध अक्षुण्ण रखा गया है।
