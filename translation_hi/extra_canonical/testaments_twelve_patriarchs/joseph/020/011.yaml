id: T12P.JOS.20.11
reference: Testament of Joseph 20:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/011.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman’s hut in an orchard, which vanishes after the summer.
translation:
  language: hi
  text: क्योंकि उसका राज्य एक अनन्त राज्य होगा, जो बीत नहीं जाएगा। पर तुम्हारे बीच मेरा राज्य पूर्ण होता है, जैसे फलोद्यान में रखवाले की झोंपड़ी गर्मी बीत जाने के बाद लुप्त हो जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: राज्य
  rationale: यह यूनानी शब्द के शासन/राज्य दोनों अर्थों को समेटने वाला स्वाभाविक और पारंपरिक हिन्दी पद है।
- source_word: αἰώνιος
  choice: सदा का
  rationale: अनन्त स्थायित्व को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: οὐ παρελεύσεται
  choice: कभी समाप्त न होगा
  rationale: राज्य के न बीतने अथवा न मिटने का आशय सहज हिन्दी में देता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: बहुवचन संबोधन के साथ स्थानिक/सामुदायिक अर्थ को बनाए रखता है; इसे केवल ‘तुम्हारे भीतर’ मानकर अस्पष्टता को अनुचित रूप से सीमित नहीं करता।
- source_word: ἐπιτελεῖται
  choice: अपने अंत तक पहुँच जाएगा
  rationale: क्रिया में निहित पूर्ण होने और समाप्ति तक आने के अर्थ को संदर्भानुकूल बनाए रखता है।
- source_word: ὀπωροφυλάκιον
  choice: फलोद्यान में रखवाले की झोंपड़ी
  rationale: फल-बाग की रखवाली के लिए बनी अस्थायी कुटिया का सांस्कृतिक बिंब आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: θέρος
  choice: गरमी का मौसम
  rationale: यहाँ मौसमी अवधि का अर्थ है; इसी के बाद रखवाले की अस्थायी झोंपड़ी हट या लुप्त हो जाती है।
- source_word: ἐξαφανίζεται
  choice: लुप्त हो जाती है
  rationale: पूरी तरह ओझल या नष्ट हो जाने की तीव्रता को बनाए रखता है।
theological_decisions:
- issue: ‘उसका राज्य’ और ‘मेरा राज्य’ के बीच विरोध
  choice: दोनों सर्वनाम और राज्य-संबंधी विरोध यथावत रखा गया
  alternative: ‘उसका अनन्त शासन’ और ‘मेरी सत्ता’ जैसे व्याख्यात्मक भिन्न पद
  rationale: पाठ स्वयं दोनों राज्यों की पहचान या धर्मवैज्ञानिक संबंध स्पष्ट नहीं करता; इसलिए तनाव को सुलझाने के बजाय सुरक्षित रखा गया।
- issue: ἐν ὑμῖν का अर्थ
  choice: तुम्हारे बीच
  alternative: तुम्हारे भीतर
  rationale: बहुवचन समुदाय के संदर्भ में ‘बीच’ अधिक स्वाभाविक है, जबकि यूनानी की संभावित व्यापकता को किसी निजी आंतरिक राज्य तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। फलोद्यान की अस्थायी रखवाली-झोंपड़ी का बिंब संरक्षित है। उपलब्ध यूनानी पाठ में ὀπωροφυλάκιον के बाद का अंश पाठगत रूप से विकृत/अस्पष्ट दिखता है; अनुवाद ने स्पष्ट वाक्य-संरचना और प्रमाणित बिंब का अनुसरण किया है, बिना उस अस्पष्ट अंश से अतिरिक्त अर्थ जोड़ने के।
