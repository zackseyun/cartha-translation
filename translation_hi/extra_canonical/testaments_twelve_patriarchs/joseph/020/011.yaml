revisions:
- from: क्योंकि उसका राज्य सदा का राज्य होगा, जो कभी समाप्त न होगा। परन्तु तुम्हारे बीच मेरा राज्य अपने अंत तक पहुँच जाएगा और ऐसा लुप्त हो जाएगा, जैसे फलोद्यान में रखवाले की झोंपड़ी गरमी का मौसम बीतने के बाद लुप्त हो जाती है।
  to: क्योंकि उसका राज्य एक अनन्त राज्य होगा, जो बीत नहीं जाएगा। पर तुम्हारे बीच मेरा राज्य पूर्ण होता है, जैसे फलोद्यान में रखवाले की झोंपड़ी गर्मी बीत जाने के बाद लुप्त हो जाती है।
  rationale: The revision retains the source’s unresolved contrast and the communal sense of ‘तुम्हारे बीच,’ while rendering ἐπιτελεῖται with ‘पूर्ण होता है’ rather than interpreting it as ‘comes to its end.’ The disappearance remains in the simile, as in the Greek. No footnote is added, since the corrupt-looking material after ὀπωροφυλάκιον does not yield a secure additional meaning or an anchor requiring representation in the supplied translation.
  reviewer_model: gpt-5.6-terra
