  text: XI. *Καὶ ὑμεῖς οὖν¹, *τέκνα μου², ⌜ἔχετε ἐν πάσῃ³ πράξει ὑμῶν *πρὸ ὀφθαλμῶν ὑμῶν⁴ *τὸν τοῦ θεοῦ φόβον⁵, καὶ⁷ τιμᾶτε⁶ τοὺς ἀδελφοὺς ὑμῶν· πᾶς γὰρ ὁ⁷ ποιῶν⁸ νόμον Κυρίου ἀγαπηθήσεται ὑπʼ⁹ αὐτοῦ. 2. *Ἐρχόμενος δὲ¹⁰ *μετὰ τῶν Ἰσμαϊλιτῶν¹¹ *ἐπηρώτων με λέγοντες· Δοῦλος εἶ; Κἀγὼ εἶπον¹² ὅτι δοῦλός¹³ εἰμι¹⁴ ἐξ οἴκου¹⁵, ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου. 3. Λέγει δέ μοι ὁ μείζων αὐτῶν¹⁶· *Οὐκ εἶ δοῦλος¹⁷, ὅτι καὶ¹⁸ ἡ ὄψις σου δηλοῖ¹⁹. Ἐγὼ δὲ *λέγω αὐτοῖς²⁰ ὅτι¹⁸ δοῦλος ⌜αὐτῶν⌝ ὑπάρχω²¹. 4. Ὡς δὲ *εἰς Αἴγυπτον ἐφθάσαμεν ἐμάχοντο περὶ ἐμοῦ τὸ²² *τίς προδοὺς χρυσίον λάβῃ με²³. 5. Διὰ πᾶσιν ἔδοξεν *τοῦ εἶναι²⁴ με εἰς Αἴγυπτον πρὸς *τὸν μετάβολον τῆς ἐμπορίας²⁵ αὐτῶν, ἕως ὅτου²⁶ ἐπιστρέψουσιν²⁷ φέροντες²⁸ ἐμπορίαν²⁹. 6. *Ὁ δὲ Κύριος ἔδωκέ μοι³⁰ χάριν ἐν ὀφθαλμοῖς τοῦ μεταβόλου καὶ ἐπίστευσέ³¹ μοι τὸν οἶκον αὐτοῦ. 7. Καὶ εὐλόγησεν αὐτὸν *ὁ Θεὸς³² ἐν³³ χειρί μου, καὶ ἐπλήθυνεν *αὐτὸν ἐν χρυσίῳ καὶ ἀργυρίῳ³⁴ ⌜καὶ ἔργῳ³⁵⌝. 8. Καὶ ἤμην μετὰ αὐτοῦ³⁶ *μῆνας τρεῖς³⁷.
