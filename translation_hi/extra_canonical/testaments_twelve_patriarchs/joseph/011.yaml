base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011.yaml
  text: 'And so[a], my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.


    And when I was coming with the Ishmaelites, they kept asking me, saying[b], “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.'
translation:
  language: hi
  text: '11:1 इसलिए तुम भी, मेरे बच्चो, अपने हर काम में परमेश्वर का भय अपनी आँखों के सामने रखो और अपने भाइयों का आदर करो; क्योंकि जो कोई प्रभु की व्यवस्था का पालन करता है, उससे प्रभु प्रेम करेगा।


    11:2 जब मैं इश्माएलियों के साथ आ रहा था, तो वे मुझसे बार-बार पूछते थे, “क्या तुम दास हो?” मैंने कहा, “मैं घर का दास हूँ,”[a] ताकि मैं अपने भाइयों को लज्जित न करूँ।


    11:3 तब उनके सबसे बड़े ने मुझसे कहा, “तुम दास नहीं हो, क्योंकि तुम्हारा चेहरा भी यह प्रकट करता है।” पर मैंने उनसे कहा, “मैं उनका दास हूँ।”[b]


    11:4 जब हम मिस्र पहुँचे, तो वे मेरे विषय में झगड़ने लगे कि कौन सोना देकर मुझे ले ले।


    11:5 तब सबने यह तय किया कि मैं मिस्र में उनके व्यापारिक मध्यस्थ[c] के पास तब तक रहूँ, जब तक वे माल लेकर लौट न आएँ।


    11:6 प्रभु ने मुझे उस व्यापारिक मध्यस्थ की दृष्टि में अनुग्रह दिलाया, और उसने अपना घर मेरे भरोसे सौंप दिया।


    11:7 परमेश्वर ने मेरे द्वारा उसे आशीष दी और सोने, चाँदी और काम-धंधे[d] में उसकी बढ़ोतरी की।


    11:8 मैं उसके साथ तीन महीने रहा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अर्थ ‘घरेलू दास’ या संभवतः ‘घर में जन्मा दास’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनका’ शब्द पाठ-साक्ष्य में अनिश्चित है। इसके रहने पर आशय संभवतः यह है कि यूसुफ ने स्वयं को अपने भाइयों का दास बताया।
    reason: textual_uncertainty
  - marker: c
    text: इस यूनानी शब्द का अर्थ व्यापारिक मध्यस्थ, सौदागर या विनिमय करने वाला व्यापारी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘और काम-धंधे में’ शब्द कुछ पाठ-साक्ष्यों में अनिश्चित हैं।
    reason: textual_uncertainty
lexical_decisions:
- source_word: φόβον τοῦ θεοῦ
  choice: परमेश्वर का भय
  rationale: यह नैतिक और वाचा-संबंधी गंभीरता को बनाए रखता है; ‘श्रद्धा’ कहने से यूनानी की प्रबलता नरम पड़ सकती थी।
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: अपनी आँखों के सामने
  rationale: यूनानी के सजीव मुहावरे और निरंतर नैतिक सजगता की छवि को सुरक्षित रखता है।
- source_word: τιμᾶτε
  choice: आदर करो
  rationale: आज्ञार्थक नैतिक बल और पारिवारिक संदर्भ दोनों के लिए स्वाभाविक आधुनिक हिन्दी।
- source_word: ποιῶν νόμον Κυρίου
  choice: प्रभु की व्यवस्था का पालन करता है
  rationale: शाब्दिक ‘व्यवस्था को करता है’ हिन्दी में अस्वाभाविक है; ‘पालन’ उसी सक्रिय आज्ञाकारिता को स्पष्ट रूप से व्यक्त करता है।
- source_word: δοῦλος
  choice: दास
  rationale: यह प्रसंग बिक्री, स्वामित्व और सामाजिक स्थिति का है; ‘सेवक’ बंधुआ स्थिति को अनावश्यक रूप से हल्का कर देता।
- source_word: ἐξ οἴκου
  choice: घर का दास
  rationale: वाक्यांश घरेलू अथवा घर में जन्मे दास का संकेत दे सकता है; मुख्य पाठ में संक्षिप्त रूप रखा गया और अस्पष्टता पादटिप्पणी में बताई गई।
- source_word: ὁ μείζων αὐτῶν
  choice: उनके सबसे बड़े
  rationale: मूल में आयु अथवा पद—दोनों की संभावना है; ‘सबसे बड़े’ इस अस्पष्टता को ‘सरदार’ कहकर नहीं सुलझाता।
- source_word: μετάβολος τῆς ἐμπορίας
  choice: व्यापार का दलाल
  rationale: यह व्यापारिक मध्यस्थ या सौदागर को सूचित करता है; हिन्दी में ‘दलाल’ उस मध्यस्थ भूमिका को सीधे व्यक्त करता है।
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: अपना घर मेरे भरोसे सौंप दिया
  rationale: यह केवल विश्वास करने के बजाय गृह-प्रबंध का उत्तरदायित्व सौंपने का भाव व्यक्त करता है।
- source_word: ἐν χειρί μου
  choice: मेरे हाथों
  rationale: यूनानी के माध्यम-सूचक सामी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के भय का स्वरूप
  choice: ‘परमेश्वर का भय’ को यथावत रखा
  alternative: ‘परमेश्वर के प्रति श्रद्धा’
  rationale: पाठ भय, श्रद्धा और नैतिक जवाबदेही के संयुक्त धार्मिक भाव को खुला रखता है; केवल ‘श्रद्धा’ तनाव को नरम कर देती।
- issue: व्यवस्था करने वाले से प्रेम का कर्ता
  choice: ‘उससे वह प्रेम करेगा’
  alternative: ‘वह परमेश्वर का प्रिय होगा’
  rationale: यूनानी भविष्यकालीन कर्मवाच्य और निकटतम दिव्य संदर्भ को व्यक्तिगत ईश्वरीय प्रेम के रूप में रखा गया, बिना इसे प्रतिफल-सिद्धांत में विस्तृत किए।
- issue: यूसुफ का स्वयं को दास बताना
  choice: दास / घर का दास
  alternative: सेवक / घरेलू सेवक
  rationale: कथा में यूसुफ की बिक्री और स्वामित्व की स्थिति प्रमुख है; ‘दास’ मूल के सामाजिक कठोरपन को सुरक्षित रखता है।
- issue: भाइयों को लज्जित न करने का आशय
  choice: यूसुफ अपनी वास्तविक पारिवारिक स्थिति छिपाता है ताकि भाइयों का अपमान न हो
  alternative: वह केवल अपनी निजी लज्जा से बचता है
  rationale: क्रिया का प्रत्यक्ष कर्म ‘मेरे भाइयों’ है; अतः पाठ का बल भाइयों के प्रति संयम और उनकी प्रतिष्ठा बचाने पर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सरल कथात्मक शैली रखी गई है। पारिवारिक संबोधन ‘मेरे बच्चो’ और नैतिक आज्ञाएँ सीधे तथा मौखिक वसीयतनामे के अनुरूप हैं। दासता और व्यापार संबंधी शब्दों को नरम नहीं किया गया, जबकि दुर्लभ व्यापारिक पदों की व्याख्या पादटिप्पणी में दी गई है।
