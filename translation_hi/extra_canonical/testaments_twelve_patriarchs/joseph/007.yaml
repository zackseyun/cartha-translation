  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007.yaml
  text: '7. So that you may learn that the wickedness of the ungodly will not prevail over those who fear God in self-control, look: taking some of it before him, I ate it in your presence. And after saying this, I tasted it and said, “The God of my fathers and the angel of Abraham will be with me.” And I ate.


    8. But when she saw this, she fell on her face at my feet, weeping; and raising her up, I admonished her.


    9. And she agreed with me not to commit this impiety any longer. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would collapse suddenly, though she was not sick.


    10. And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he tried to heal her with words.


    11. Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking; or I will throw myself down a cliff, if you do not join yourself with me.”


    12. But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,


    13. “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband''s concubine, your rival, will beat your children and wipe out your memory from the earth.”'
translation:
  language: hi
  text: '7. “ताकि तू जान ले कि संयम से परमेश्वर का भय माननेवालों पर भक्तिहीन लोगों की दुष्टता प्रबल नहीं होगी—देख, मैं इसमें से लेकर तेरे सामने खा रहा हूँ।” यह कहकर मैंने इस प्रकार कहा, “मेरे पूर्वजों का परमेश्वर और अब्राहम का दूत मेरे साथ रहेगा।” और मैंने खा लिया।


    8. यह देखकर वह रोती हुई मेरे पाँवों के पास मुँह के बल गिर पड़ी। मैंने उसे उठाया और समझाया।


    9. तब उसने मुझसे सहमति जताई कि वह फिर ऐसी भक्तिहीनता नहीं करेगी। फिर भी उसका मन बुराई पर ही लगा रहा, और वह मुझे फँसाने का कोई उपाय ढूँढ़ती रही। वह कराहती और अचानक गिर पड़ती, हालाँकि वह बीमार नहीं थी।[a]


    10. जब उसके पति ने उसे देखा, तो उसने उससे पूछा, “तेरा चेहरा क्यों उतरा हुआ है?” उसने उससे कहा, “मैं हृदय की पीड़ा से तड़प रही हूँ, और मेरी आत्मा की कराहें मुझे जकड़े हुए हैं।” तब उसने बातों से उसे ठीक करने का प्रयास किया।


    11. फिर अवसर पाकर, जब उसका पति अभी बाहर ही था, वह झट से मेरे पास आई और मुझसे बोली, “मेरा दम घुट रहा है। यदि तू मेरे साथ संबंध नहीं बनाएगा, तो मैं अपने आपको किसी खड़ी चट्टान से नीचे फेंक दूँगी।”


    12. पर मैं समझ गया कि बेलियार की आत्मा उसे परेशान कर रही है। मैंने प्रभु से प्रार्थना की और उससे कहा,


    13. “अरी अभागी स्त्री, तू पापों में अपने को अंधा करती हुई क्यों व्याकुल और अशांत हो रही है? याद रख, यदि तू अपने आपको मार डालेगी, तो तेरे पति की उपपत्नी और तेरी सौत अस्तेथो तेरे बच्चों को पीटेगी, और पृथ्वी पर से तेरी स्मृति मिट जाएगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वह कराहती और अचानक गिर पड़ती, हालाँकि वह बीमार नहीं थी”—इस वाक्यांश का यूनानी पाठ संदिग्ध और कुछ हद तक अस्पष्ट है; अनुवाद प्रसंग और उपलब्ध पाठ के संभावित अर्थ का अनुसरण करता है।
    reason: मुद्रित यूनानी संस्करण इस पदांश को पाठगत कठिनाई के चिह्न से चिह्नित करता है, इसलिए अनिश्चितता पाठक के सामने रखना उचित है।
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: संयम से
  rationale: यहाँ नैतिक आत्म-संयम और शुद्ध आचरण का भाव है; केवल ‘बुद्धिमानी’ अर्थ को संकुचित कर देती।
- source_word: θεοσεβούντων
  choice: परमेश्वर का भय माननेवालों
  rationale: θεοσεβέω का आशय श्रद्धापूर्ण परमेश्वर-भक्ति है; आधुनिक हिन्दी में यह पदबंध सहज और धार्मिक गंभीरता बनाए रखता है।
- source_word: ὁ ἄγγελος Ἀβραάμ
  choice: अब्राहम का दूत
  rationale: यूनानी संबंधवाचक रचना को यथावत रखा गया है; यह तय नहीं किया गया कि दूत अब्राहम का संरक्षक था या उससे किसी अन्य प्रकार संबंधित।
- source_word: ἐνουθέτησα
  choice: समझाया
  rationale: इसका भाव चेतावनी देकर उचित आचरण की शिक्षा देना है; ‘डाँटा’ अनावश्यक कठोरता जोड़ता।
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: मेरे साथ संबंध बनाएगा
  rationale: संदर्भ में यह यौन-संबंध का शिष्ट किंतु स्पष्ट संकेत है; ‘मेरे साथ मिल’ आधुनिक हिन्दी में अस्पष्ट होता।
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: बेलियार की आत्मा
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण किया गया और πνεῦμα का सीधा अर्थ रखा गया; इसे निजी दानवशास्त्रीय व्याख्या से नहीं बदला गया।
- source_word: παλλακή
  choice: उपपत्नी
  rationale: यह पत्नी से भिन्न, निम्न वैवाहिक दर्जे वाली स्त्री को सूचित करता है; ‘रखैल’ अधिक अपमानजनक और अनौपचारिक है।
- source_word: ἀντίζηλος
  choice: सौत
  rationale: पति के संबंध में प्रतिद्वंद्वी स्त्री का स्वाभाविक हिन्दी संबंध-सूचक शब्द।
- source_word: κονδυλίσει
  choice: पीटेगी
  rationale: क्रिया का अर्थ घूँसे या प्रहार से मारना है; सामान्य हिन्दी में ‘पीटेगी’ अर्थ को स्पष्ट रखता है।
- source_word: τὸ μνημόσυνόν σου
  choice: तेरी स्मृति
  rationale: यह पृथ्वी पर बने रहनेवाली याद या स्मारक-स्मृति को दर्शाता है; ‘वंश’ कहना पाठ से अधिक विशिष्ट होता।
theological_decisions:
- issue: ‘मेरे पूर्वजों का परमेश्वर’ और ‘अब्राहम का दूत’ का संबंध
  choice: दोनों को ‘और’ से जुड़े पृथक व्याकरणिक पदों के रूप में रखा गया
  alternative: दूत को परमेश्वर की ही प्रत्यक्ष अभिव्यक्ति मानकर अनुवाद करना
  rationale: मूल पाठ ऐसी पहचान स्पष्ट रूप से स्थापित नहीं करता; अनुवाद में अस्पष्टता और धार्मिक तनाव सुरक्षित रखा गया।
- issue: बेलियार की आत्मा द्वारा स्त्री को परेशान करना
  choice: वर्णन को पात्र यूसुफ की समझ के रूप में प्रस्तुत किया गया
  alternative: इसे सर्वज्ञ कथावाचक का निर्विवाद निदान बनाना
  rationale: मूल में ‘मैं समझ गया’ है, इसलिए कथन की दृष्टि और सीमा बनाए रखना आवश्यक है।
- issue: आत्महत्या के परिणाम की चेतावनी
  choice: बच्चों की पिटाई और स्त्री की स्मृति मिटने को अलग परिणामों के रूप में रखा गया
  alternative: सौत को ही स्त्री की स्मृति मिटानेवाली कर्ता बनाना
  rationale: यूनानी वाक्य में दूसरे परिणाम का कर्ता निहित ‘तू’ है—अर्थात आत्महत्या से वह अपनी स्मृति खो देगी; इसे सौत की सीधी कार्रवाई नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। संबोधन की निकटता और मूल के एकवचन को बनाए रखने के लिए ‘तू/तेरे’ का प्रयोग किया गया है। यौन आग्रह को अश्लीलता के बिना स्पष्ट किया गया है। अध्याय-स्रोत में VI 7–9 और VII 1–5 का सतत अंश है; दिए गए प्रकाशन-ढाँचे के अनुसार पदों को 7–13 क्रम में प्रस्तुत किया गया है।
