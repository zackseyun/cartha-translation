  text: And after he had gone out, I ate neither that food nor any of her other foods, but wept, not having tasted them.
translation:
  language: hi
  text: और उसके चले जाने के बाद, मैं रोता रहा और मैंने न तो उस भोजन को चखा, न उस स्त्री के अन्य भोजनों में से किसी को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: उसके बाहर चले जाने के बाद
  rationale: संबंधवाचक संबंध स्पष्ट रखते हुए aorist genitive absolute का स्वाभाविक हिन्दी कालगत अनुवाद।
- source_word: ἔκλαιον
  choice: मैं रोया
  rationale: प्रथम पुरुष एकवचन अपूर्ण भूतकाल को प्रसंगानुकूल सरल भूत रूप में व्यक्त किया गया; क्रिया के सतत पक्ष को हिन्दी में अनावश्यक रूप से भारी नहीं बनाया।
- source_word: μὴ γευσάμενος
  choice: न ... चखा
  rationale: aorist participle का आशय मुख्य क्रिया के साथ जुड़ी स्वाद न लेने की क्रिया है; हिन्दी में समन्वित निषेध अधिक स्वाभाविक और स्पष्ट है।
- source_word: μήτε ἐκείνου μήτε ἄλλου τῶν ἐδεσμάτων αὐτῆς
  choice: न तो उस भोजन को ... न उसके दूसरे पकवानों में से किसी को
  rationale: दोनों μήτε का समानांतर निषेध सुरक्षित रखा; ἐκείνου को संदर्भित एकवचन भोजन और ἄλλου ... τῶν ἐδεσμάτων को उसके अन्य पकवानों में से किसी एक के रूप में व्यक्त किया।
