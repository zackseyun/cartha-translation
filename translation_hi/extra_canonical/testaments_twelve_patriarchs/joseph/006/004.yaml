translation:
  language: hi
  text: फिर एक दिन बाद वह मेरे पास आई। जब उसने भोजन पर ध्यान दिया, तो उसने मुझसे कहा, “क्या बात है कि तुमने भोजन नहीं खाया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ μίαν ἡμέραν
  choice: फिर एक दिन बाद
  rationale: कालक्रम और δέ के कथात्मक संक्रमण को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: जब उसने भोजन पर ध्यान दिया
  rationale: संदर्भ में ἐπιγινώσκω का आशय भोजन को पहचानने से अधिक उस पर गौर करने या उसे पड़ा हुआ देखकर ध्यान देने का है।
- source_word: Τί τοῦτο ὅτι
  choice: क्या बात है कि
  rationale: ग्रीक के प्रश्नात्मक आश्चर्य को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐκ ἔφαγες τοῦ βρώματος
  choice: तुमने भोजन नहीं खाया
  rationale: ग्रीक में भोजन के साथ आए संबंधकारक को हिन्दी में स्वाभाविक सकर्मक रचना द्वारा व्यक्त किया गया है।
