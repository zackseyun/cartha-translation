  text: And after this she sent me food mixed with sorcery.
translation:
  language: hi
  text: और इसके बाद उसने मुझे जादू-टोने से मिश्रित भोजन भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: भेजा
  rationale: ग्रीक ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन में भूतकाल से व्यक्त किया गया है।
- source_word: βρῶμα
  choice: भोजन
  rationale: यह सामान्य रूप से खाने की वस्तु या भोजन को दर्शाता है; प्रसंग में ‘भोजन’ सहज और पर्याप्त व्यापक है।
- source_word: ἐν γοητείᾳ
  choice: जादू-टोने से
  rationale: γοητεία यहाँ जादुई क्रिया या टोने का भाव रखता है; ‘जादू-टोना’ आधुनिक हिन्दी में स्पष्ट है और किसी खास धार्मिक परंपरा की तकनीकी शब्दावली नहीं थोपता।
- source_word: πεφυρμένον
  choice: सना हुआ
  rationale: क्रिया का मूल भाव किसी वस्तु में मिलाने या उससे लपेटे/सने होने का है। ‘सना हुआ’ भोजन और जादू-टोने के बीच जानबूझकर रखे गए मूर्त किंतु असामान्य संबंध को बनाए रखता है।
theological_decisions:
- issue: जादू-टोने का भोजन में मिश्रण
  choice: जादू-टोने से सना हुआ
  alternative: जादू-टोना मिलाया हुआ
  rationale: ग्रीक अभिव्यक्ति यह स्पष्ट नहीं करती कि कोई भौतिक पदार्थ मिलाया गया था या भोजन पर जादुई क्रिया की गई थी। चुना हुआ रूप इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
