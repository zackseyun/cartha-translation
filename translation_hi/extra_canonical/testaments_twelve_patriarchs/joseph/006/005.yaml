reference: Testament of Joseph 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ εἶπον *πρὸς αὐτήν²³· Ὅτι²⁴ ἐπλήρωσας αὐτὸ ⸀γοητείας⸀²⁵ θανάτου²⁶. καὶ *πῶς εἶπας²⁷ ὅτι Οὐ προσεγγίζω²⁸ τοῖς²⁹ εἰδώλοις³⁰ ἀλλὰ τῷ³¹ Κυρίῳ³² ⸀μόνῳ⸀³³;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/005.yaml
  text: And I said to her, “You have filled it with the sorcery of death. And how could you say, ‘I do not draw near to idols, but to the Lord alone’?”
translation:
  language: hi
  text: और मैंने उससे कहा, “तुमने उसे मृत्यु के जादू-टोने से भर दिया है। फिर तुम यह कैसे कह सकीं, ‘मैं मूर्तियों के निकट नहीं जाती, बल्कि केवल प्रभु के निकट जाती हूँ’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γοητείας θανάτου
  choice: मृत्यु के जादू-टोने
  rationale: संबंधकारक पदबंध की कठोरता और अशुभ अर्थ को बनाए रखता है; इसे केवल ‘घातक जादू’ बनाकर निहित संबंध को सीमित नहीं करता।
- source_word: προσεγγίζω
  choice: निकट जाती हूँ
  rationale: क्रिया के मूल स्थानिक अर्थ ‘निकट जाना’ को सुरक्षित रखता है, जबकि प्रसंग में उपासना या संबंध का संकेत पाठक के लिए खुला रहता है।
- source_word: εἰδώλοις
  choice: मूर्तियों
  rationale: धार्मिक संदर्भ में यूनानी शब्द का स्वाभाविक और प्रचलित हिन्दी समतुल्य।
- source_word: τῷ Κυρίῳ μόνῳ
  choice: केवल प्रभु के निकट
  rationale: μόνῳ के एकमात्रता-सूचक बल को ‘केवल’ द्वारा स्पष्ट रखते हुए κύριος को सम्मानित धार्मिक पद ‘प्रभु’ से अनूदित किया गया है।
- source_word: πῶς εἶπας
  choice: तुम यह कैसे कह सकीं
  rationale: संदर्भगत आरोप और विस्मय को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कथन की विषयवस्तु बदले।
theological_decisions:
- issue: ‘निकट जाना’ का उपासना-संबंधी आशय
  choice: शाब्दिक रूपक ‘निकट जाती हूँ’ बनाए रखा
  alternative: ‘उपासना करती हूँ’
  rationale: मूल προσεγγίζω सीधे ‘उपासना करना’ नहीं कहता; शाब्दिक अभिव्यक्ति धार्मिक निकटता, भक्ति या संपर्क की वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: ‘मृत्यु का जादू-टोना’ का संबंध
  choice: ‘मृत्यु के जादू-टोने’
  alternative: ‘घातक जादू-टोने’
  rationale: मूल के θανάτου संबंधकारक को विशेषण में बदलकर उसकी संभावित अर्थ-व्याप्ति को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी संवाद-शैली अपनाई गई है। स्त्री संबोधन के कारण ‘कह सकीं’ और ‘जाती हूँ’ प्रयोग हुए हैं। मूल की पुनरुक्त समानांतर संरचना को यथासंभव बनाए रखा गया है।
