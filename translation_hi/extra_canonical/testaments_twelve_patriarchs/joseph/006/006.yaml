base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/006.yaml
  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
translation:
  language: hi
  text: अब इसलिए जान लो कि मेरे पिता के परमेश्वर ने अपने दूत के द्वारा मुझ पर तुम्हारी दुष्टता प्रकट की थी; और इसके द्वारा मैंने इसे[a] तुम्हारा दोष उजागर करने के लिए सुरक्षित रखा, इस आशा में कि शायद इसे देखकर तुम पश्चाताप करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इसे” का संकेत किस वस्तु की ओर है, यूनानी पाठ में स्पष्ट नहीं है।
    reason: मूल में नपुंसकलिंग सर्वनाम αὐτό है, पर इस वाक्य में उसका स्पष्ट संज्ञात्मक पूर्वपद नहीं दिया गया; इसलिए संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
lexical_decisions:
- source_word: γνῶθι
  choice: जान लो
  rationale: आज्ञार्थक क्रिया का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ἀπεκάλυψέ μοι
  choice: मुझे ... प्रकट कर दी थी
  rationale: प्रकाशित या छिपी बात खोल देने के अर्थ को स्पष्ट रखता है; पूर्ण हुई पूर्ववर्ती क्रिया के लिए प्रसंगानुकूल भूतकाल लिया गया है।
- source_word: τὴν κακίαν σου
  choice: तुम्हारी दुष्टता
  rationale: κακία के नैतिक अर्थ को बिना नरम किए व्यक्त करता है।
- source_word: ἐφύλαξα
  choice: सँभाल रखा
  rationale: किसी वस्तु को सुरक्षित रखने या बचाकर रखने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς ἔλεγχόν σου
  choice: तुम्हारा दोष प्रकट करने के लिए
  rationale: ἔλεγχος में निहित दोष उजागर करने और सामना कराने के भाव को व्यक्त करता है, बिना इसे केवल कानूनी ‘प्रमाण’ तक सीमित किए।
- source_word: μετανοήσεις
  choice: तुम पश्चाताप करो
  rationale: मन और आचरण के परिवर्तन वाले नैतिक भाव का प्रचलित तथा उपयुक्त हिन्दी रूप।
theological_decisions:
- issue: प्रकाशन का माध्यम
  choice: परमेश्वर ने अपने दूत के द्वारा ... प्रकट कर दी थी
  alternative: परमेश्वर के दूत ने ... प्रकट कर दी थी
  rationale: यूनानी वाक्य में परमेश्वर कर्ता और दूत माध्यम है; अनुवाद इसी संबंध को बनाए रखता है।
- issue: ἔλεγχος का अर्थ
  choice: तुम्हारा दोष प्रकट करने के लिए
  alternative: तुम्हारे विरुद्ध प्रमाण के रूप में
  rationale: मूल शब्द दोषसिद्धि, भर्त्सना या अपराध उजागर करने का व्यापक भाव रखता है; मुख्य पाठ किसी एक न्यायिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन प्रत्यक्ष और गंभीर है। वाक्य की तर्क-श्रृंखला—प्रकाशन, वस्तु को सँभालना, दोष उजागर करना और पश्चाताप की आशा—को मूल क्रम में रखा गया है।
