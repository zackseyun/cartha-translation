id: T12P.JOS.6.2
reference: Testament of Joseph 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὡς δὲ⁴ ἦλθεν ὁ⁵ εὐνοῦχος ὁ κομίζων αὐτό⁶, *ἀνέβλεψα καὶ⁷ εἶδον *φοβερὸν ἄνδρα⁸ ἐπιδιδόντα μοι *μετὰ τοῦ τρυβλίου⁹ μάχαιραν· καὶ συνῆκα ὅτι¹⁰ *περιέργεια ἐστὶν εἰς ἀποπλάνησίν μου¹¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/002.yaml
  text: But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me a sword with the dish; and I understood that it was a scheme to lead me astray.
translation:
  language: hi
  text: पर जब उसे लाने वाला खोजा आया, तब मैंने नज़र उठाई और एक भयावह आदमी को थाली के साथ मुझे तलवार देते देखा; और मैं समझ गया कि यह मुझे भटकाने की एक चाल थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: खोजा
  rationale: यह यूनानी शब्द ऐसे पुरुष सेवक को सूचित करता है जिसे नपुंसक बनाया गया हो; ‘खोजा’ आधुनिक हिन्दी में संक्षिप्त और प्रसंगानुकूल पद है।
- source_word: ἀνέβλεψα
  choice: मैंने ऊपर दृष्टि की
  rationale: क्रिया का मूल अर्थ ऊपर देखना अथवा दृष्टि उठाना है; यह अनावश्यक व्याख्या जोड़े बिना उस दिशा-सूचक भाव को बनाए रखता है।
- source_word: φοβερὸν ἄνδρα
  choice: एक भयानक पुरुष
  rationale: φοβερός यहाँ भय उत्पन्न करने वाले रूप को व्यक्त करता है; ‘भयानक’ इस अनुभूति को सीधे रखता है।
- source_word: μετὰ τοῦ τρυβλίου μάχαιραν
  choice: थाली के साथ ... एक तलवार
  rationale: μετά संबंध को सामान्य रूप से ‘साथ’ कहा गया है, ताकि तलवार और थाली के ठीक स्थान अथवा ढंग को पाठ से अधिक निश्चित न किया जाए।
- source_word: περιέργεια
  choice: एक चाल
  rationale: इस प्रसंग में शब्द किसी कपटपूर्ण युक्ति या षड्यंत्रकारी उपाय को सूचित करता है; ‘चाल’ सहज हिन्दी में उद्देश्यपूर्ण छल को व्यक्त करता है।
- source_word: ἀποπλάνησίν μου
  choice: मुझे भटकाने
  rationale: ἀποπλανάω का अर्थ सही मार्ग से बहकाना या भटकाना है; यह नैतिक और व्यवहारगत अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: भयानक पुरुष की पहचान
  choice: उसे केवल ‘एक भयानक पुरुष’ कहा गया है
  alternative: उसे स्वर्गदूत, दुष्टात्मा या दर्शन की प्रतीकात्मक आकृति मानना
  rationale: यूनानी पाठ आकृति की पहचान स्पष्ट नहीं करता; इसलिए किसी अलौकिक या सांप्रदायिक व्याख्या को अनुवाद में नहीं जोड़ा गया।
- issue: περιέργεια का स्वरूप
  choice: ‘एक चाल’
  alternative: ‘जादू-टोना’, ‘दुष्ट योजना’ या ‘अनुचित जिज्ञासा’
  rationale: प्रसंग बहकाने के उद्देश्य वाली युक्ति बताता है, पर उसका विशिष्ट धार्मिक या जादुई स्वरूप निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ऊपर दृष्टि की’ कथात्मक गरिमा बनाए रखता है, जबकि ‘चाल’ प्रसंग के कपटपूर्ण आशय को सहज रूप से व्यक्त करता है।
