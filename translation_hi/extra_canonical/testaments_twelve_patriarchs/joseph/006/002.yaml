  to: पर जब उसे लाने वाला खोजा आया, तब मैंने नज़र उठाई और एक भयावह आदमी को थाली के साथ मुझे तलवार देते देखा; और मैं समझ गया कि यह मुझे भटकाने की एक चाल थी।
  rationale: The revision improves idiomatic modern Hindi while retaining the Greek text's referential ambiguity in ‘उसे,’ its identification of the figure as a man, the association of the sword with the dish, and the non-specific sense of a deceptive scheme meant to lead Joseph astray.
