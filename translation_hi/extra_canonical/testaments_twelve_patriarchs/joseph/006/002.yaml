  naturalness: ‘मैंने ऊपर दृष्टि की’ and especially ‘एक भयानक पुरुष’ are understandable but somewhat stiff in modern standard Hindi. ‘नज़र उठाई’ and ‘एक भयावह आदमी’ are more idiomatic while maintaining the narrative register.
  terminology: ‘खोजा’ is a historically established Hindi term for a eunuch and is suitable in this ancient courtly setting. ‘चाल’ appropriately conveys περιέργεια here without over-specifying magic, wrongdoing, or doctrinal significance. No theological interpretation is added.
