    rationale: ‘ऊपर दृष्टि की’ and ‘भयानक पुरुष’ are literal/formal calques that read less naturally than ‘नज़र उठाई’ and ‘भयावह आदमी’; this is a stylistic correction, not a change in meaning.
  revised_text: पर जब उसे लाने वाला खोजा आया, तब मैंने नज़र उठाई और एक भयावह आदमी को थाली के साथ मुझे तलवार देते देखा; और मैं समझ गया कि यह मुझे भटकाने की एक चाल थी।
