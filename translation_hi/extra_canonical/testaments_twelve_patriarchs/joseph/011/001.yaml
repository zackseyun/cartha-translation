source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὑμεῖς οὖν¹, *τέκνα μου², ⌜ἔχετε ἐν πάσῃ³ πράξει ὑμῶν *πρὸ ὀφθαλμῶν ὑμῶν⁴ *τὸν τοῦ θεοῦ φόβον⁵, καὶ⁷ τιμᾶτε⁶ τοὺς ἀδελφοὺς ὑμῶν· πᾶς γὰρ ὁ⁷ ποιῶν⁸ νόμον Κυρίου ἀγαπηθήσεται ὑπʼ⁹ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/001.yaml
  text: And so, my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.
translation:
  language: hi
  text: इसलिए तुम भी, मेरे बच्चो, अपने हर काम में परमेश्वर का भय अपनी आँखों के सामने रखो और अपने भाइयों का आदर करो; क्योंकि जो कोई प्रभु की व्यवस्था का पालन करता है, उससे प्रभु प्रेम करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: इसलिए तुम भी
  rationale: οὖν का निष्कर्षसूचक अर्थ और emphatic ὑμεῖς के ‘तुम भी’ भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन में आत्मीयता बनाए रखता है; आधुनिक मानक हिन्दी में संबोधन-रूप ‘बच्चो’ उपयुक्त है।
- source_word: ἐν πάσῃ πράξει ὑμῶν
  choice: अपने हर काम में
  rationale: πρᾶξις के कर्म/आचरण संबंधी व्यापक अर्थ को सामान्य और सहज हिन्दी में व्यक्त करता है।
- source_word: πρὸ ὀφθαλμῶν ὑμῶν τὸν τοῦ θεοῦ φόβον
  choice: परमेश्वर का भय अपनी आँखों के सामने रखो
  rationale: मूल दृश्यात्मक मुहावरे को बनाए रखता है और φόβος की श्रद्धामिश्रित भय संबंधी धार्मिक गंभीरता को केवल ‘श्रद्धा’ कहकर संकुचित नहीं करता।
- source_word: τιμᾶτε τοὺς ἀδελφοὺς ὑμῶν
  choice: अपने भाइयों का आदर करो
  rationale: τιμάω का सीधा अर्थ ‘आदर करना’ है; ἀδελφοί को प्रसंग के पारिवारिक संबोधन के अनुरूप ‘भाइयों’ रखा गया है।
- source_word: ποιῶν νόμον Κυρίου
  choice: प्रभु की व्यवस्था पर चलता है
  rationale: शाब्दिक ‘व्यवस्था को करता है’ अस्वाभाविक है; ‘व्यवस्था पर चलता है’ पालन/आचरण का वही आशय सहज हिन्दी में देता है।
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  choice: उससे वह प्रेम करेगा
  rationale: यूनानी भाववाच्य को स्वाभाविक कर्तृवाच्य हिन्दी में व्यक्त किया गया है; निकटतम एकवचन पूर्वपद ‘प्रभु’ के कारण ‘वह’ का संकेत उसी की ओर है।
theological_decisions:
- issue: ‘परमेश्वर का भय’ का अर्थ
  choice: परमेश्वर का भय
  alternative: परमेश्वर के प्रति श्रद्धा
  rationale: φόβος में भय और श्रद्धा दोनों की धार्मिक गूँज हो सकती है। ‘भय’ मूल की तनावपूर्ण व्यापकता बचाता है और उसे केवल सम्मान में नहीं बदलता।
- issue: व्यवस्था का पालन और प्रभु का प्रेम
  choice: 'कारणसूचक कथन को ज्यों का त्यों रखा गया: ‘क्योंकि जो कोई… उससे वह प्रेम करेगा’'
  alternative: इसे अनुग्रह, प्रतिफल या प्रमाण की किसी विशिष्ट धर्मवैज्ञानिक व्याख्या से स्पष्ट करना
  rationale: मूल पाठ γάρ द्वारा सीधा संबंध रखता है, पर उस संबंध का व्यवस्थित धर्मवैज्ञानिक स्वरूप नहीं बताता; इसलिए कोई सांप्रदायिक समाधान नहीं जोड़ा गया।
- issue: αὐτοῦ का संदर्भ
  choice: ‘वह’ को प्रभु के संदर्भ में रखा
  alternative: परमेश्वर को स्पष्ट रूप से दोहराना
  rationale: व्याकरण और निकटतम पूर्वपद Κυρίου इसे प्रभु की ओर संकेत करते हैं; सर्वनाम बनाए रखने से मूल की अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञार्थक बहुवचन तथा पितृसुलभ संबोधन सुरक्षित हैं। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
