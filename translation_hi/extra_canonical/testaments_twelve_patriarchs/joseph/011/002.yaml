revisions:
- from: और जब मैं इश्माएलियों के साथ जा रहा था, तो वे मुझसे बार-बार पूछते थे, “क्या तुम दास हो?” मैंने कहा, “हाँ, मैं घर में जन्मा दास हूँ,” ताकि मैं अपने भाइयों को लज्जित न करूँ।
  to: और जब मैं इश्माएलियों के साथ जा रहा था, तो वे मुझसे बार-बार पूछते थे, “क्या तुम दास हो?” मैंने कहा कि मैं घराने का दास हूँ, ताकि मैं अपने भाइयों को लज्जित न करूँ।
  rationale: The revision removes the unsupported claim that Joseph was born in the household and renders ἐξ οἴκου as “घराने का,” preserving its household affiliation without narrowing its meaning. It also removes the unspoken affirmative while retaining the direct question and the repeated force of the imperfect verb.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:19:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the journey, the Ishmaelites' repeated questioning, slavery status, and Joseph's motive. However, “घर में जन्मा दास” adds the specific idea of being born in the household, which is not stated by ἐξ οἴκου. The phrase more safely denotes a slave belonging to a household/household slave. The added “हाँ” is likewise not explicit in the Greek.
  naturalness: The Hindi is clear and appropriately narrative. “घराने का दास” is natural modern standard Hindi and avoids the unsupported birth-status implication.
  terminology: “इश्माएलियों,” “दास,” and “लज्जित” are suitable. Retaining “दास” appropriately reflects δοῦλος without softening the social status.
  issues:
  - severity: medium
    issue: “घर में जन्मा दास” over-specifies ἐξ οἴκου.
    rationale: The Greek says “a slave from/of a household” and does not include a word meaning “born.” Rendering it as household/household-owned slave preserves the source's scope.
  - severity: low
    issue: The reply begins with “हाँ,” though the Greek only reports that Joseph said he was a slave.
    rationale: The affirmative may be inferable, but it is not expressed and is unnecessary in a close translation.
  revised_text: और जब मैं इश्माएलियों के साथ जा रहा था, तो वे मुझसे बार-बार पूछते थे, “क्या तुम दास हो?” मैंने कहा कि मैं घराने का दास हूँ, ताकि मैं अपने भाइयों को लज्जित न करूँ।
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported claim that Joseph was born in the household and renders ἐξ οἴκου as “घराने का,” preserving its household affiliation without narrowing its meaning. It also removes the unspoken affirmative while retaining the direct question and the repeated force of the imperfect verb.
