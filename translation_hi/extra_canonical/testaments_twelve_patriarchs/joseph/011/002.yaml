  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: hi
  text: और जब मैं इश्माएलियों के साथ जा रहा था, तो वे मुझसे बार-बार पूछते थे, “क्या तुम दास हो?” मैंने कहा कि मैं घराने का दास हूँ, ताकि मैं अपने भाइयों को लज्जित न करूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος
  choice: जब मैं ... जा रहा था
  rationale: संदर्भ में इश्माएलियों के साथ यात्रा की प्रगतिशील क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰσμαϊλιτῶν
  choice: इश्माएलियों
  rationale: यूनानी जातिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ἐπηρώτων
  choice: बार-बार पूछते थे
  rationale: अपूर्णकाल चलती या दोहराई जाने वाली पूछताछ का संकेत देता है।
- source_word: δοῦλος
  choice: दास
  rationale: प्राचीन दासता-संबंधी सामाजिक स्थिति को स्पष्ट रखता है; केवल ‘सेवक’ कहने से अर्थ नरम पड़ सकता है।
- source_word: δοῦλός ... ἐξ οἴκου
  choice: घर में जन्मा दास
  rationale: ἐξ οἴκου का शाब्दिक अर्थ ‘घर से/घर का’ है; प्रसंग और प्राचीन प्रयोग के अनुसार यह घराने में जन्मे दास की स्थिति बताता है, न कि केवल घरेलू काम करने वाले सेवक की।
- source_word: αἰσχύνω
  choice: लज्जित करूँ
  rationale: अपने भाइयों को अपमान या लज्जा में डालने के भाव को गरिमापूर्ण और निकट अर्थ में रखता है।
