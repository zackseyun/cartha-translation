  text: '*Ἐρχόμενος δὲ¹⁰ *μετὰ τῶν Ἰσμαϊλιτῶν¹¹ *ἐπηρώτων με λέγοντες· Δοῦλος εἶ; Κἀγὼ εἶπον¹² ὅτι δοῦλός¹³ εἰμι¹⁴ ἐξ οἴκου¹⁵, ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου.'
