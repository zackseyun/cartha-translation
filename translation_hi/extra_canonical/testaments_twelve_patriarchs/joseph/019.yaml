revisions:
- from: 'और उसने मुझे इस्राएल के सुंदर पुरुषों से भी बढ़कर सुंदरता दी और बुढ़ापे तक मुझे सामर्थ्य और सुंदरता में बनाए रखा, क्योंकि मैं हर बात में याकूब के समान था।


    **19** अब, मेरे बच्चो, उस स्वप्न के विषय में भी सुनो जो मैंने देखा था।


    **2** बारह हिरन एक स्थान पर चर रहे थे। उनमें से नौ सारी पृथ्वी पर तितर-बितर हो गए, और उसी प्रकार वे तीन भी। **3** फिर मैंने देखा कि वे तीन हिरन तीन मेमने बन गए। उन्होंने प्रभु को पुकारा, और प्रभु उन्हें एक हरे-भरे और जल से भरपूर स्थान में ले गया; वह उन्हें अंधकार से प्रकाश में ले आया। **4** वहाँ वे प्रभु को तब तक पुकारते रहे, जब तक वे नौ हिरन उनके पास इकट्ठे नहीं हो गए। तब वे सब मानो बारह भेड़ें बन गए; और थोड़े समय बाद वे बढ़ते-बढ़ते बहुत-से झुंड हो गए।


    **5** इसके बाद मैंने देखा—बारह बैल एक बछिया का दूध पी रहे थे। उससे दूध का एक समुद्र उमड़ पड़ा, और बारह झुंडों तथा अनगिनत झुंडों ने उसमें से पिया। **6** चौथे बैल के सींग आकाश तक ऊँचे उठे और झुंडों के लिए दीवार के समान बन गए; और उन दोनों सींगों के बीच एक और सींग फूट निकला। **7** फिर मैंने एक बछड़े को देखा, जिसने उन्हें बारह बार घेर लिया और जो बैलों के लिए पूरी तरह सहायक बना।


    **8** फिर मैंने देखा कि एक कुँवारी उत्पन्न हुई[a], और उससे एक मेमना जन्मा[b]। उसके बाईं ओर सिंह के समान कुछ झपटा[c]। सभी जंगली पशु उस पर टूट पड़े, पर मेमने ने उन्हें पराजित किया, उनका नाश किया और उन्हें पैरों तले रौंद डाला। **9** उस पर स्वर्गदूत, मनुष्य और सारी पृथ्वी आनन्दित हुए। **10** ये बातें अंतिम दिनों में, अपने नियत समय पर घटित होंगी।


    **11** इसलिए, मेरे बच्चो, प्रभु की आज्ञाओं का पालन करो और लेवी तथा यहूदा का सम्मान करो; क्योंकि उनके वंश से तुम्हारे लिए इस्राएल का उद्धार उदित होगा। **12** उसका राज्य सदा का राज्य होगा, जो कभी समाप्त नहीं होगा। परन्तु तुम्हारे बीच मेरा राज्य समाप्त हो जाएगा; वह कटनी के बाद खेत की रखवाली की झोंपड़ी के समान लुप्त हो जाएगा[d]।'
