  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019.yaml
  text: 'And he gave me beauty beyond the handsome men of Israel[a], and preserved me until old age in strength and in beauty; for I was like Jacob in all things.


    Now listen, my children, also concerning the dream that I saw.


    2. Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also. So hear the dream that I saw. 3. And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord led them out into a flourishing and well-watered place, and brought them from darkness into light. 4. And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks. 5. And after these things I saw, and behold, twelve bulls suckling one heifer, and from her there came a sea of milk, and the twelve flocks and innumerable flocks drank from it. 6. And from the fourth bull the horns went up as far as heaven and became like a wall for the flocks, and between the two horns another horn sprang up. 7. And I saw a calf that encircled them twelve times, and it became for the bulls wholly a help.


    8. And I saw that a virgin was born, and from her was born a lamb, and on his left there rushed forth something like a lion; and all the beasts rushed against him, but the lamb overcame them and destroyed them and trampled them down. 9. And the angels and men and all the earth rejoiced over him. 10. And these things will happen in their season in the last days.


    11. Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you the salvation of Israel. 12. For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will come to an end, like a watchman''s hut after the summer[d][c][b], vanishing away.'
translation:
  language: hi
  text: 'और उसने मुझे इस्राएल के सुंदर पुरुषों से भी बढ़कर सुंदरता दी और बुढ़ापे तक मुझे सामर्थ्य और सुंदरता में बनाए रखा, क्योंकि मैं हर बात में याकूब के समान था।


    **19** अब, मेरे बच्चो, उस स्वप्न के विषय में भी सुनो जो मैंने देखा था।


    **2** बारह हिरन एक स्थान पर चर रहे थे। उनमें से नौ सारी पृथ्वी पर तितर-बितर हो गए, और वे तीन भी इसी प्रकार। **3** फिर मैंने देखा कि वे तीन हिरन तीन मेमने बन गए। उन्होंने प्रभु को पुकारा, और प्रभु उन्हें एक हरे-भरे और जल से भरपूर स्थान में ले गया; वह उन्हें अंधकार से प्रकाश में ले आया। **4** वहाँ वे प्रभु को तब तक पुकारते रहे, जब तक वे नौ हिरन उनके पास इकट्ठे नहीं हो गए। तब वे सब मानो बारह भेड़ें बन गए; और थोड़े समय बाद वे बढ़ते-बढ़ते बहुत-से झुंड हो गए।


    **5** इसके बाद मैंने देखा—बारह बैल एक बछिया का दूध पी रहे थे। उससे दूध का एक समुद्र उमड़ पड़ा, और बारह झुंडों और अनगिनत झुंडों ने उसमें से पिया। **6** चौथे बैल के सींग आकाश तक ऊँचे उठे और झुंडों के लिए दीवार के समान बन गए; और उन दोनों सींगों के बीच एक और सींग फूट निकला। **7** फिर मैंने एक बछड़े को देखा, जिसने उन्हें बारह बार घेर लिया और जो बैलों के लिए पूरी तरह सहायक बना।


    **8** फिर मैंने देखा कि एक कुँवारी का जन्म हुआ[a], और उससे एक मेमना जन्मा[b]। उसके बाईं ओर सिंह के समान कुछ झपटा[c]। सभी जंगली पशु उस पर टूट पड़े, पर मेमने ने उन्हें पराजित किया, उनका नाश किया और उन्हें पैरों तले रौंद डाला। **9** उस पर स्वर्गदूत, मनुष्य और सारी पृथ्वी आनन्दित हुए। **10** ये बातें अंतिम दिनों में, अपने नियत समय पर घटित होंगी।


    **11** इसलिए, मेरे बच्चो, प्रभु की आज्ञाओं का पालन करो और लेवी तथा यहूदा का सम्मान करो; क्योंकि उनके वंश से तुम्हारे लिए इस्राएल का उद्धार उदित होगा। **12** उसका राज्य सदा का राज्य होगा, जो कभी समाप्त नहीं होगा। परन्तु तुम्हारे बीच मेरा राज्य समाप्त हो जाएगा; वह कटनी के बाद खेत की रखवाली की झोंपड़ी के समान लुप्त हो जाएगा[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ यूनानी साक्षियों में अधिक स्पष्ट रूप से लिखा है, “यहूदा से एक कुँवारी उत्पन्न हुई,” जबकि एक अन्य रूप में है, “मैंने सींगों के बीच एक कुँवारी को देखा।”
    reason: textual_variant
  - marker: b
    text: 'कुछ साक्षी मेमने को “निर्दोष” कहते हैं; एक सम्भवतः बाद का पाठ यह भाषा भी जोड़ता है: “परमेश्वर का मेमना, जो संसार का पाप उठा ले जाता है।”'
    reason: textual_variant
  - marker: c
    text: “उसके बाईं ओर सिंह के समान कुछ झपटा” वाला वाक्य पाठ की दृष्टि से कठिन है। एक अन्य साक्षी दृश्य को अलग ढंग से कहता है, फिर भी मेमने पर जंगली पशुओं के शत्रुतापूर्ण आक्रमण का चित्र देता है।
    reason: alternative_reading
  - marker: d
    text: “कटनी के बाद खेत की रखवाली की झोंपड़ी” से आशय फसल के समय काम आने वाले उस अस्थायी आश्रय से है, जो कटनी समाप्त होने पर उजाड़ छोड़ दिया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: ὡραιότητα
  choice: सुंदरता
  rationale: यह शब्द शारीरिक सौंदर्य या आकर्षण दर्शाता है; ‘सुंदरता’ सहज आधुनिक हिन्दी है और आत्मकथात्मक बल बनाए रखती है।
- source_word: ἐφύλαξέ
  choice: बनाए रखा
  rationale: संदर्भ में परमेश्वर द्वारा यूसुफ को बुढ़ापे तक सामर्थ्य और सौंदर्य में सुरक्षित रखने का भाव है; हिन्दी में यह प्रयोग स्वाभाविक है।
- source_word: ἐνυπνίων
  choice: स्वप्न
  rationale: पाठ प्रतीकात्मक स्वप्न का वर्णन करता है; ‘स्वप्न’ dignified और सामान्यतः बोधगम्य है।
- source_word: ἔλαφοι
  choice: हिरन
  rationale: यूनानी शब्द मृग-जाति के पशु को सूचित करता है; ‘हिरन’ लिंग को अनावश्यक रूप से निश्चित किए बिना सहज हिन्दी देता है।
- source_word: ἀμνοί / ἀμνός
  choice: मेमने / मेमना
  rationale: हिरनों से भेड़-संबंधी और सम्भवतः बलिदानी प्रतीक की ओर परिवर्तन को बनाए रखता है।
- source_word: τόπον εὐθαλῆ καὶ ἔνυδρον
  choice: एक हरे-भरे और जल से भरपूर स्थान
  rationale: उर्वरता और प्रचुर जल की दोनों छवियाँ स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रहती हैं।
- source_word: ἐκ σκότους εἰς φῶς
  choice: अंधकार से प्रकाश में
  rationale: मुक्ति की पारदर्शी रूपकात्मक अभिव्यक्ति को निकटता से सुरक्षित रखता है।
- source_word: πρόβατα / ποίμνια
  choice: भेड़ें / झुंड
  rationale: व्यक्तिगत भेड़ों और बढ़कर बने अनेक झुंडों के बीच स्रोत-पाठ का भेद बनाए रखता है।
- source_word: βόες
  choice: बैल
  rationale: पुल्लिंग पशु-चित्र और बाद में आने वाले सींगों के संदर्भ में ‘बैल’ स्पष्ट और सजीव है।
- source_word: θηλάζοντες
  choice: दूध पी रहे थे
  rationale: असामान्य दृश्य को आधुनिक हिन्दी में बिना तकनीकी या असहज शब्दावली के स्पष्ट करता है।
- source_word: δάμαλιν
  choice: बछिया
  rationale: युवा मादा गोवंश के लिए स्वाभाविक हिन्दी समतुल्य है।
- source_word: κέρατα
  choice: सींग
  rationale: स्वप्न के प्रत्यक्ष पशु-चित्र और उसके सम्भावित शक्ति-संबंधी प्रतीक दोनों को बनाए रखता है।
- source_word: ἀνατελεῖ
  choice: उदित होगा
  rationale: क्रिया के ‘उगने/उदय होने’ वाले रूपक को बचाता है और भावी उद्धार की भविष्यवाणी के अनुरूप है।
- source_word: ὀπωροφυλάκιον
  choice: खेत की रखवाली की झोंपड़ी
  rationale: अस्थायी खेत-आश्रय की सांस्कृतिक छवि को सामान्य हिन्दी पाठक के लिए समझने योग्य बनाता है।
theological_decisions:
- issue: पद 8 और 11 में पाठांतरों द्वारा विस्तारित मसीही भाषा
  choice: मुख्य पाठ में अपेक्षाकृत संक्षिप्त और कम स्पष्टतः मसीही पाठ रखा गया है; कुँवारी और मेमने का मूल प्रतीक सुरक्षित है।
  alternative: ‘यहूदा से एक कुँवारी उत्पन्न हुई’, ‘निर्दोष मेमना’, और ‘परमेश्वर का मेमना, जो संसार का पाप उठा ले जाता है’ जैसे विस्तृत पाठ।
  rationale: प्रदत्त यूनानी पाठ में कोष्ठक और पाठालोचनात्मक संकेत उल्लेखनीय भिन्नता दिखाते हैं। इसलिए अधिक स्पष्ट बाद की भाषा को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में बताया गया है।
- issue: लेवी और यहूदा से आने वाले उद्धार तथा स्थायी शासक की पहचान
  choice: ‘इस्राएल का उद्धार’ और ‘उसका राज्य’ के रूप में अनुवाद किया गया है, बिना उस व्यक्ति या सत्ता की पहचान को पाठ से आगे निश्चित किए।
  alternative: भावी व्यक्ति को किसी बाद के विशिष्ट मसीही पदनाम से स्पष्टतः पहचानना, अथवा इसे केवल सामूहिक याजकीय-राजकीय उद्धार मानना।
  rationale: स्रोत भविष्य के उद्धार और शाश्वत राज्य की ओर संकेत करता है, पर विभिन्न साक्षी उसकी पहचान को अलग-अलग ढंग से तीक्ष्ण करते हैं; अनुवाद उस वास्तविक तनाव को खुला रखता है।
- issue: पद 8 में सिंह-सदृश आकृति और मेमने का सम्बन्ध
  choice: कठिन यूनानी वाक्य को ‘उसके बाईं ओर सिंह के समान कुछ झपटा’ के रूप में रखा गया और अनिश्चितता पादटिप्पणी में स्पष्ट की गई।
  alternative: सिंह को मेमने का गुण या सहयोगी रूप मानना, अथवा पूरे वाक्य को केवल शत्रुतापूर्ण पशु-आक्रमण में मिला देना।
  rationale: मूल वाक्य पाठतः कठिन है; किसी एक धर्मवैचारिक अर्थ को आरोपित करने के बजाय उसकी अस्पष्टता बनाए रखना उचित है।
