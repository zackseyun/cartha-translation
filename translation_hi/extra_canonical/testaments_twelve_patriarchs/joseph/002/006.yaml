  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/006.yaml
  text: But in all these things he takes the lead, and in various ways he encourages. For a short time he withdraws, in order to test the inner intent of the soul.
translation:
  language: hi
  text: परन्तु इन सब बातों में वह अगुआई करता है और अलग-अलग ढंग से प्रोत्साहित करता है। वह थोड़े समय के लिए हट जाता है, ताकि मन के सोचे-विचारे इरादे को परखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προΐσταται
  choice: अगुआई करता है
  rationale: यह क्रिया आगे खड़े होने, नेतृत्व करने या पहल करने का भाव रखती है; प्रसंग में ‘अगुआई करता है’ स्वाभाविक और अर्थ-संगत है।
- source_word: παρακαλεῖ
  choice: प्रोत्साहन देता है
  rationale: παρακαλέω के सांत्वना, आग्रह और प्रोत्साहन जैसे अर्थ हो सकते हैं; यहाँ व्यापक तथा प्रसंगानुकूल अर्थ ‘प्रोत्साहन देता है’ है।
- source_word: ἀφίσταται
  choice: दूर हो जाता है
  rationale: यहाँ अस्थायी रूप से हटने या अलग हो जाने का भाव है, जिसे अगले पदबंध ‘थोड़े समय के लिए’ के साथ स्पष्ट रखा गया है।
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: मन का भीतरी संकल्प
  rationale: ψυχή व्यक्ति के आंतरिक जीवन को और διαβούλιον विचारित इरादे या संकल्प को सूचित करता है; यह अनुवाद अभिव्यक्ति के आंतरिक आशय को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: कर्ता की पहचान
  choice: स्रोत की तरह केवल ‘वह’ रखा गया है
  alternative: कर्ता का नाम या आध्यात्मिक पद स्पष्ट करना
  rationale: इस अंश में कर्ता सर्वनाम से व्यक्त है; निकटवर्ती संदर्भ दिए बिना उसकी पहचान जोड़ना स्रोत की वास्तविक संदर्भ-निर्भरता को अनुचित रूप से समाप्त करता।
- issue: परीक्षा का विषय
  choice: ‘मन के भीतरी संकल्प’ को परखना
  alternative: ‘आत्मा की योजना’ को परखना
  rationale: यहाँ जोर व्यक्ति के भीतर विचारित अभिप्राय पर है; ‘आत्मा की योजना’ आधुनिक हिन्दी में किसी स्वतंत्र दैवी योजना का भ्रामक अर्थ दे सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। वाक्य-संरचना मूल यूनानी के दो चरणों—निरंतर अगुआई/प्रोत्साहन और थोड़े समय के लिए हटकर परीक्षा—को स्पष्ट बनाए रखती है।
