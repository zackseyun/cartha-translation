  source_fidelity: The draft accurately conveys προΐσταται as taking the lead, παρακαλεῖ as encouraging, and προσωρινή withdrawal for testing. However, ‘भीतरी’ is not explicit in the Greek, and ‘संकल्प’ alone somewhat narrows διαβούλιον, which denotes a considered purpose or deliberated intent.
  naturalness: The Hindi is clear and appropriately dignified. ‘मन का सोचा-विचारा इरादा’ is more idiomatic than ‘मन के भीतरी संकल्प’ while retaining the source’s emphasis on a deliberated inner intention.
  terminology: ‘अगुआई करता है’ and ‘प्रोत्साहित करता है’ are suitable modern-standard renderings. Rendering ψυχή contextually as ‘मन’ is acceptable here; no doctrinal identification of the referent is added.
  issues:
  - severity: low
    issue: ‘भीतरी’ adds an explicit modifier not present in the Greek.
    rationale: The genitive ‘of the soul’ already locates the intent within the person; the added adjective is interpretive and need not be stated.
  - severity: low
    issue: ‘संकल्प’ does not fully express the deliberative force of διαβούλιον.
    rationale: A phrase such as ‘सोचा-विचारा इरादा’ more directly represents a considered intent while remaining natural Hindi.
