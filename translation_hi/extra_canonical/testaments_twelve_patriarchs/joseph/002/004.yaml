reference: Testament of Joseph 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ¹² ἐγκαταλείπει¹³ Κύριος¹⁴ τοὺς φοβουμένους αὐτόν, *Οὐκ ἐν σκότει, ἢ δεσμοῖς¹⁵, ἢ θλίψεσιν, ἢ ἀνάγκαις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/004.yaml
  text: For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress.
translation:
  language: hi
  text: क्योंकि प्रभु उन लोगों को नहीं छोड़ता जो उसका भय मानते हैं—न अंधकार में, न बेड़ियों में, न क्लेशों में, न संकटों में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκαταλείπει
  choice: छोड़ता
  rationale: यह क्रिया संकट में किसी को त्याग देने या उसके हाल पर छोड़ देने का भाव रखती है; सरल आधुनिक हिन्दी में ‘छोड़ता’ स्वाभाविक है।
- source_word: τοὺς φοβουμένους αὐτόν
  choice: अपने भय माननेवालों
  rationale: बाइबलीय प्रयोग में यह प्रभु के प्रति श्रद्धायुक्त भय को व्यक्त करता है; ‘भय मानना’ इस धार्मिक अर्थ को बनाए रखता है।
- source_word: σκότει
  choice: अंधकार
  rationale: मूल का प्रत्यक्ष बिंब सुरक्षित रखा गया है; यह वास्तविक अथवा रूपकात्मक अंधकार, दोनों हो सकता है।
- source_word: δεσμοῖς
  choice: बेड़ियों
  rationale: बहुवचन शब्द बंधन अथवा कैद के साधनों को सूचित करता है; प्रसंग में ‘बेड़ियों’ अधिक सजीव और स्वाभाविक है।
- source_word: θλίψεσιν
  choice: क्लेशों
  rationale: दबाव, पीड़ा और विपत्ति का व्यापक भाव व्यक्त करता है।
- source_word: ἀνάγκαις
  choice: संकटों
  rationale: यह विवशता, तंगी या कठिन परिस्थिति का अर्थ दे सकता है; ‘संकटों’ से अर्थ की व्यापकता बनी रहती है।
theological_decisions:
- issue: प्रभु अपने भय माननेवालों को किस अर्थ में नहीं छोड़ता
  choice: परिस्थितियों की सूची को ‘छोड़ता’ के साथ सीधे जोड़ा गया
  alternative: ऐसा अनुवाद करना कि प्रभु उन्हें इन परिस्थितियों में पड़ने ही नहीं देता
  rationale: मूल यह नहीं कहता कि विश्वासी अंधकार, बेड़ियों या क्लेशों का अनुभव नहीं करेंगे; वह इन परिस्थितियों में प्रभु द्वारा न त्यागे जाने पर बल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सूची में ‘न…न…न…और न…’ की संरचना यूनानी पुनरावृत्ति और वाक्य के आश्वासनात्मक बल को स्वाभाविक हिन्दी में बनाए रखती है।
