review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the main assertion: the Lord does not abandon those who fear him. It also appropriately construes the following prepositional list as specifying circumstances in which abandonment does not occur, rather than claiming that such people never encounter darkness, bonds, affliction, or distress. ‘बेड़ियों’ is a concrete, contextually valid rendering of δεσμοῖς, and ‘संकटों’ suitably retains the broad force of ἀνάγκαις.'
  naturalness: The sentence is generally clear and appropriately dignified. However, ‘अपने भय माननेवालों’ is less natural in modern standard Hindi and can momentarily sound as though it concerns their own fear. An explicit relative clause, ‘जो उसका भय मानते हैं,’ is clearer while retaining the established reverential sense of the Greek expression.
  terminology: ‘प्रभु’ for Κύριος, ‘भय मानते हैं’ for φοβουμένους αὐτόν, ‘अंधकार’ for σκότει, ‘बेड़ियों’ for δεσμοῖς, ‘क्लेशों’ for θλίψεσιν, and ‘संकटों’ for ἀνάγκαις are suitable. No doctrinal expansion is introduced.
  issues:
  - severity: low
    issue: ‘अपने भय माननेवालों’ is potentially ambiguous and slightly unnatural.
    rationale: The Greek explicitly says ‘those fearing him’ (αὐτόν). ‘जो उसका भय मानते हैं’ expresses this object directly and is more idiomatic modern Hindi.
  revised_text: क्योंकि प्रभु उन लोगों को नहीं छोड़ता जो उसका भय मानते हैं—न अंधकार में, न बेड़ियों में, न क्लेशों में, न संकटों में।
  revised_footnotes: []
  revision_rationale: The revision only clarifies the referent of ‘his fear’ and improves modern Hindi idiom. The dash and repeated negative preserve the Greek’s elliptical assurance that the Lord does not abandon such people amid any of the listed circumstances.
