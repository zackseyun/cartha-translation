revisions:
- from: क्योंकि प्रभु अपने भय माननेवालों को नहीं छोड़ता—न अंधकार में, न बेड़ियों में, न क्लेशों में और न संकटों में।
  to: क्योंकि प्रभु उन लोगों को नहीं छोड़ता जो उसका भय मानते हैं—न अंधकार में, न बेड़ियों में, न क्लेशों में, न संकटों में।
  rationale: The revision only clarifies the referent of ‘his fear’ and improves modern Hindi idiom. The dash and repeated negative preserve the Greek’s elliptical assurance that the Lord does not abandon such people amid any of the listed circumstances.
