id: T12P.JOS.2.2
reference: Testament of Joseph 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἠγωνισάμην πρὸς γυναῖκα ἀναιδῆ ἐπείγουσάν² με παρανομεῖν μετʼ αὐτῆς, ἀλλʼ ὁ Θεὸς *τοῦ πατρός μου³ ἐρρύσατό⁴ με ἐκ⁵ φλογὸς καιομένης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/002.yaml
  text: And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame.
translation:
  language: hi
  text: और मैंने एक निर्लज्ज स्त्री से संघर्ष किया, जो मुझ पर उसके साथ व्यवस्था का उल्लंघन करने के लिए लगातार दबाव डाल रही थी; पर मेरे पिता के परमेश्वर ने मुझे धधकती ज्वाला से बचा लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγωνισάμην πρὸς
  choice: से जूझता रहा
  rationale: क्रिया संघर्ष या दृढ़ प्रतिरोध का बोध कराती है; प्रसंग में लगातार किए गए दबाव के विरुद्ध संघर्ष को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: γυναῖκα ἀναιδῆ
  choice: एक निर्लज्ज स्त्री
  rationale: ἀναιδής का मूल भाव लज्जा या संकोच से रहित होना है; ‘निर्लज्ज’ इसे सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐπείγουσάν με
  choice: मुझे ... लगातार उकसा रही थी
  rationale: वर्तमान कृदन्त बार-बार या निरंतर दबाव डालने का भाव देता है; हिन्दी में ‘लगातार’ उस पक्ष को स्पष्ट करता है।
- source_word: παρανομεῖν μετʼ αὐτῆς
  choice: अपने साथ व्यवस्था का उल्लंघन करने के लिए
  rationale: παρανομέω का अर्थ व्यवस्था के विरुद्ध चलना या अपराध करना है। यौन आशय प्रसंग से प्रकट है, पर स्रोत की अपेक्षाकृत परोक्ष अभिव्यक्ति को बनाए रखा गया है।
- source_word: ὁ Θεὸς τοῦ πατρός μου
  choice: मेरे पिता के परमेश्वर
  rationale: यूनानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप; निश्चित पद के भाव को हिन्दी में अलग संकेत की आवश्यकता नहीं है।
- source_word: ἐρρύσατό με
  choice: मुझे ... बचा लिया
  rationale: ῥύομαι संकट से छुड़ाने या बचाने का अर्थ देता है; ‘बचा लिया’ सामान्य पाठक के लिए सहज है।
- source_word: ἐκ φλογὸς καιομένης
  choice: धधकती ज्वाला से
  rationale: शाब्दिक अग्नि-बिंब को सुरक्षित रखा गया है और इसे केवल कामना या परीक्षा के रूपक के रूप में व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: ‘व्यवस्था का उल्लंघन’ का आशय
  choice: स्रोत की परोक्ष कानूनी-नैतिक भाषा को बनाए रखा
  alternative: ‘उसके साथ पाप करने’ या ‘व्यभिचार करने’
  rationale: παρανομεῖν व्यापक रूप से व्यवस्था-विरुद्ध आचरण बताता है। अधिक विशिष्ट अनुवाद प्रसंग को स्पष्ट करता, पर मूल की शब्दार्थगत व्यापकता घटा देता।
- issue: ‘धधकती ज्वाला’ का स्वरूप
  choice: अग्नि-बिंब को बिना व्याख्यात्मक विस्तार के रखा
  alternative: ‘वासना की धधकती आग’
  rationale: मूल यह तय नहीं करता कि ज्वाला शाब्दिक है, रूपक है, या दोनों स्तरों पर प्रयुक्त है; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुलभ है। ‘व्यवस्था का उल्लंघन’ कुछ औपचारिक है, पर παρανομεῖν की कानूनी-नैतिक छाया सुरक्षित रखने के लिए चुना गया है।
