source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ οὗτος [¹ὁ ἀρχιμάγειρος Φαραὼ]¹ ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/001.yaml
  text: And this man, the captain of Pharaoh's guard, entrusted his house to me.
translation:
  language: hi
  text: और इस व्यक्ति ने—जो फ़िरौन का प्रधान रसोइया था[a]—अपना घर मुझे सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘प्रधान रसोइया’; पद के संदर्भ में इसे ‘फ़िरौन के पहरेदारों का प्रधान’ भी समझा गया है।
    reason: यूनानी शब्द के प्रत्यक्ष अर्थ और कथा-संदर्भ पर आधारित पारंपरिक पदनाम, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: प्रधान रसोइया
  rationale: यूनानी शब्द का मूल और प्रत्यक्ष अर्थ ‘मुख्य/प्रधान रसोइया’ है। अंग्रेज़ी परामर्श-पाठ का ‘पहरेदारों का प्रधान’ संभावित पद-संदर्भ को दर्शाता है, पर मूल शब्द की पाक-गृह संबंधी अभिव्यक्ति को अस्पष्ट कर देता है।
- source_word: ἐπίστευσέ μοι
  choice: मुझे सौंप दिया
  rationale: क्रिया में भरोसा करके किसी वस्तु या उत्तरदायित्व को सौंपने का भाव है; हिंदी में यह प्रयोग स्वाभाविक रूप से दोनों पहलुओं को व्यक्त करता है।
- source_word: τὸν οἶκον αὐτοῦ
  choice: अपना घर
  rationale: οἶκος यहाँ केवल भवन नहीं, बल्कि गृहस्थी और उसके प्रबंध को भी सूचित कर सकता है; ‘घर’ इसी स्वाभाविक व्यापकता को बनाए रखता है।
theological_decisions:
- issue: फ़िरौन से संबंधित अधिकारी के पद की पहचान
  choice: मुख्य पाठ में ‘प्रधान रसोइया’, साथ में पाठांतर-संबंधी पादटिप्पणी
  alternative: ‘फ़िरौन के पहरेदारों का प्रधान’
  rationale: उपलब्ध यूनानी पाठ ἀρχιμάγειρος पढ़ता है, जिसका सीधा अर्थ ‘प्रधान रसोइया’ है। फिर भी उत्पत्ति की यूसुफ-कथा और अंग्रेज़ी परामर्श-पाठ पद को ‘पहरेदारों का प्रधान’ समझते हैं; पादटिप्पणी इस वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। वाक्य-विन्यास मूल यूनानी के ‘यह व्यक्ति’ पर दिए गए संकेत को बनाए रखता है, जबकि डैश के भीतर पदनाम स्वाभाविक हिंदी में स्पष्ट किया गया है।
