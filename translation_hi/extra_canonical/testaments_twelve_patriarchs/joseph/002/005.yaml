id: T12P.JOS.2.5
reference: Testament of Joseph 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός, Οὔτε¹⁶ ὡς υἱὸς ἀνθρώπου δειλιᾷ, Οὔτε¹⁷ ὡς γηγενὴς [ἀσθενεῖ ἢ]¹⁸ πτοεῖται¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/005.yaml
  text: For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, [does he become weak or] is he terrified.
translation:
  language: hi
  text: क्योंकि परमेश्वर मनुष्य के समान लज्जित नहीं होता, न मनुष्य के पुत्र के समान भयभीत होता है, और न मिट्टी से जन्मे प्राणी के समान [निर्बल होता या] आतंकित होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαισχύνεται
  choice: लज्जित होता
  rationale: यूनानी क्रिया का सीधा अर्थ लज्जित होना है; यहाँ परमेश्वर और मनुष्य के बीच तुलना को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: δειλιᾷ
  choice: भयभीत होता
  rationale: यह क्रिया डरने अथवा कायरतापूर्वक भय खाने का भाव रखती है; ‘भयभीत होता’ संदर्भ में स्पष्ट और गरिमापूर्ण है।
- source_word: γηγενής
  choice: मिट्टी से जन्मा प्राणी
  rationale: शाब्दिक अर्थ ‘धरती/मिट्टी से जन्मा’ है। ‘प्राणी’ जोड़ने से संज्ञा के रूप में प्रयुक्त विशेषण हिन्दी में स्पष्ट होता है और मनुष्य की पार्थिव प्रकृति का संकेत सुरक्षित रहता है।
- source_word: ἀσθενεῖ
  choice: निर्बल होता
  rationale: कोष्ठकबद्ध पाठ के ‘कमज़ोर/निर्बल होने’ के अर्थ को अलग क्रिया के रूप में सुरक्षित रखा गया है।
- source_word: πτοεῖται
  choice: आतंकित होता
  rationale: यह तीव्र भय या घबरा उठने को व्यक्त करता है और इससे पहले आए δειλιᾷ से अर्थगत भेद बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की तुलना मानव दुर्बलता से
  choice: तीनों नकारात्मक तुलनाओं को समानांतर रूप में रखा गया
  alternative: इन कथनों को परमेश्वर की अपरिवर्तनशीलता या सर्वशक्तिमत्ता की व्याख्यात्मक भाषा में बदलना
  rationale: मूल पाठ ठोस मानवीय तुलनाओं के द्वारा बात कहता है; किसी व्यवस्थित धर्मवैज्ञानिक निष्कर्ष को अनुवाद में जोड़ना उचित नहीं है।
- issue: विवादित/संदिग्ध पाठ ἀσθενεῖ ἢ
  choice: '[निर्बल होता या] को वर्ग कोष्ठकों में रखा गया'
  alternative: वाक्यांश को बिना कोष्ठक शामिल करना अथवा पूर्णतः छोड़ देना
  rationale: स्रोत संस्करण में यह अंश कोष्ठकबद्ध है; इसलिए उसकी पाठगत अनिश्चितता को दृश्य रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। मूल के त्रिस्तरीय समानांतर विन्यास और ‘न… न… और न…’ की लय को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं; वर्ग कोष्ठक स्रोत-पाठ की अनिश्चितता दर्शाते हैं।
