  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/003.yaml
  text: I was imprisoned, I was beaten, I was mocked, and the Lord gave me compassion in the sight of the jailer.
translation:
  language: hi
  text: मुझे बंदीगृह में डाला गया, मुझे पीटा गया, मेरा उपहास किया गया, और प्रभु ने बंदीगृह के पहरेदार के मन में मेरे लिए करुणा उत्पन्न की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφυλακίσθην
  choice: मुझे बंदीगृह में डाला गया
  rationale: यूनानी निष्क्रिय क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यह केवल बंदी बनाए जाने के बजाय कारावास में डाले जाने को व्यक्त करता है।
- source_word: ἐτύφθην
  choice: मुझे पीटा गया
  rationale: निष्क्रिय क्रिया के सामान्य अर्थ को सरल, स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐξεμυκτηρίσθην
  choice: मेरा उपहास किया गया
  rationale: क्रिया में तिरस्कारपूर्ण ठट्ठे या उपहास का भाव है; ‘उपहास’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यह κύριος का प्रचलित, प्रसंगानुकूल धार्मिक हिन्दी समतुल्य है।
- source_word: εἰς οἰκτιρμοὺς
  choice: मेरे प्रति करुणा उत्पन्न की
  rationale: οἰκτιρμοί के दया/करुणा संबंधी अर्थ को बनाए रखता है और हिन्दी में ‘दे दिया करुणा में’ जैसी अस्वाभाविक संरचना से बचता है।
- source_word: δεσμοφύλακος
  choice: बंदीगृह के पहरेदार
  rationale: शब्द का अर्थ कैदियों की रखवाली करने वाला अधिकारी या पहरेदार है; यह सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: प्रभु द्वारा οἰκτιρμοί देना
  choice: प्रभु ने पहरेदार में यूसुफ के प्रति करुणा उत्पन्न की
  alternative: प्रभु ने यूसुफ को पहरेदार की दृष्टि में कृपापात्र बनाया
  rationale: मूल पाठ का संज्ञा-शब्द οἰκτιρμοί सीधे करुणा/दया की ओर संकेत करता है, न कि केवल अनुग्रह या पक्षपात की ओर। हिन्दी वाक्य इसे स्वाभाविक बनाते हुए प्रभु की सक्रिय भूमिका बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन की क्रमिक, निष्क्रिय संरचना को पहले तीन खंडों में रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
