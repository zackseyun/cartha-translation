translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वक्ता की पीड़ा तथा स्त्री के प्रलोभन और दबाव की तीव्रता सुरक्षित है। उपलब्ध यूनानी पाठ के कोष्ठकीय पाठ ‘καὶ ἠπείλησέ μοι’ को अंग्रेज़ी परामर्श-पाठ के अनुरूप मुख्य पाठ में ग्रहण किया गया है; तारक-चिह्नित पाठांश भी अनूदित हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
