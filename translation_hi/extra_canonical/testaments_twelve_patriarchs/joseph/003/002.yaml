source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ποσάκις ἡ Αἰγυπτία¹ ἠπείλησέ² μοι³ θάνατον; ποσάκις⁴ τιμωρίαις⁵ ⸀με⸀⁶ παραδοῦσα⁷ ἀνεκαλέσατο⁸ [καὶ ἠπείλησέ μοι⁹] *καὶ μὴ θέλοντός μου¹⁰ συνελθεῖν αὐτῇ ἔλεγέ¹¹ μοι· Κυριεύσεις¹² *κἀμοὶ καὶ πάντων τῶν ἐν τῷ οἴκῳ μου¹³, *ἐὰν ἐπιδῷς ἑαυτὸν¹⁴ εἰς ἐμέ, καὶ ἔσῃ ὡς δεσπότης ἡμῶν¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/002.yaml
  text: How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments, she called me back, and threatened me; and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”
translation:
  language: hi
  text: उस मिस्री स्त्री ने कितनी ही बार मुझे जान से मारने की धमकी दी! कितनी ही बार उसने मुझे दंड भुगतने के लिए सौंप देने के बाद वापस बुलाया और मुझे धमकाया।ᵃ हालाँकि मैं उसके साथ यौन-संबंध बनाने को तैयार नहीं था, फिर भी उसने मुझसे कहा, “यदि तुम अपने आप को मुझे सौंप दो, तो तुम मुझ पर भी और मेरे घर में रहने वाले सभी लोगों पर अधिकार रखोगे, और हमारे स्वामी के समान होगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: उस मिस्री स्त्री
  rationale: स्त्रीलिंग विशेषण का संज्ञात्मक प्रयोग है; हिंदी में पहचान और लिंग दोनों स्पष्ट रखने के लिए स्वाभाविक विस्तार किया गया।
- source_word: τιμωρίαις με παραδοῦσα
  choice: मुझे दंड दिलाने के लिए सौंप दिया
  rationale: बहुवचन τιμωρίαις दंडात्मक यातनाओं या सजाओं की ओर संकेत कर सकता है; हिंदी में अस्वाभाविक शाब्दिक बहुवचन के बजाय व्यापक अर्थ रखा गया।
- source_word: συνελθεῖν αὐτῇ
  choice: उसके साथ संबंध बनाने
  rationale: संदर्भ में συνελθεῖν यौन मिलन का संकेत देता है; आधुनिक हिंदी में अर्थ स्पष्ट किंतु अश्लीलता से रहित रखा गया।
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: अपने आप को मुझे सौंप दो
  rationale: समर्पण और यौन सहमति, दोनों की संकेतात्मकता को बनाए रखता है; केवल ‘मेरे पास आओ’ कहने से समर्पण का भाव खो जाता।
- source_word: Κυριεύσεις
  choice: अधिकार रखोगे
  rationale: क्रिया के शासन या प्रभुत्व के अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὡς δεσπότης ἡμῶν
  choice: हमारे स्वामी के समान
  rationale: ὡς की तुलनात्मक शक्ति को बचाया गया है; सीधे ‘हमारे स्वामी होगे’ करने से मूल का ‘समान’ भाव मिट जाता।
