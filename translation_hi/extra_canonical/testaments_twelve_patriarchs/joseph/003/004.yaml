- from: और उन सात वर्षों के दौरान मैं उपवास करता रहा, फिर भी उस मिस्री को मैं ऐसा दिखाई देता था मानो सुख-विलास में जीवन बिता रहा हूँ; क्योंकि जो परमेश्वर के लिए उपवास करते हैं, उनके मुख पर कृपा दिखाई देती है।
  to: और उन सात वर्षों के दौरान मैं उपवास करता रहा, और उस मिस्री को मैं ऐसा दिखाई देता था मानो सुख-विलास में जीवन बिता रहा हूँ; क्योंकि जो परमेश्वर के लिए उपवास करते हैं, वे चेहरे की शोभा पाते हैं।
  rationale: The revision removes the unsupported explicit adversative and restores the Greek verb’s “receive” sense in the final clause. “चेहरे की शोभा” conveys χάρις in its appearance-related context without overdefining whether the favor is aesthetic, social, or divine.
