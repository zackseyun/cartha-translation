reference: Testament of Joseph 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐνήστευον ἐν τοῖς ἑπτὰ ἔτεσιν²¹ ἐκείνοις, καὶ ἐφαινόμην *τῷ Αἰγυπτίῳ²² ὡς ἐν τρυφῇ διάγων· ὅτι²³ οἱ νηστεύοντες *διὰ τὸν θεὸν²⁴ τοῦ προσώπου τὴν χάριν²⁵ λαμβάνουσιν²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/004.yaml
  text: And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; because those who fast for God receive favor in their appearance.
translation:
  language: hi
  text: और उन सात वर्षों के दौरान मैं उपवास करता रहा, और उस मिस्री को मैं ऐसा दिखाई देता था मानो सुख-विलास में जीवन बिता रहा हूँ; क्योंकि जो परमेश्वर के लिए उपवास करते हैं, वे चेहरे की शोभा पाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνήστευον
  choice: मैं उपवास करता रहा
  rationale: अपूर्ण भूतकाल यहाँ उन सात वर्षों के दौरान जारी अथवा बार-बार किए गए उपवास को व्यक्त करता है।
- source_word: τῷ Αἰγυπτίῳ
  choice: उस मिस्री को
  rationale: निश्चित उपपद सहित दत्तिव उस प्रसंग में उल्लिखित मिस्री व्यक्ति के दृष्टिकोण को दर्शाता है।
- source_word: ὡς ἐν τρυφῇ διάγων
  choice: मानो सुख-विलास में जीवन बिता रहा हूँ
  rationale: τρυφή आराम, ऐश्वर्य और विलास का भाव रखता है; यह वाक्य उपवास के बावजूद बाहरी रूप से अभावग्रस्त न दिखने की तुलना करता है।
- source_word: διὰ τὸν θεόν
  choice: परमेश्वर के लिए
  rationale: यूनानी पद का सीधा उद्देश्यपरक अर्थ सुरक्षित रखा गया है; इसे अधिक व्याख्यात्मक ‘परमेश्वर की खातिर’ या ‘परमेश्वर के कारण’ नहीं बनाया गया।
- source_word: τοῦ προσώπου τὴν χάριν λαμβάνουσιν
  choice: उनके मुख पर कृपा दिखाई देती है
  rationale: शाब्दिक रूप से ‘मुख की कृपा पाते हैं’; स्वाभाविक हिन्दी में इसका आशय चेहरे पर प्रकट अनुग्रह, शोभा अथवा मनोहरता है। ‘दिखाई देती है’ प्रसंग के दृश्य पक्ष को स्पष्ट करता है, बिना इसे केवल शारीरिक सुंदरता तक सीमित किए।
theological_decisions:
- issue: परमेश्वर के लिए किए गए उपवास और मुख की χάρις के बीच संबंध
  choice: कथन को कारणसूचक सामान्य प्रतिपादन के रूप में रखा गया है
  alternative: इसे सार्वभौमिक दैवी प्रतिज्ञा या उपवास से निश्चित शारीरिक सुंदरता मिलने के सिद्धांत के रूप में प्रस्तुत करना
  rationale: ὅτι कारण देता है, पर पाठ यह निर्धारित नहीं करता कि χάρις केवल शारीरिक सुंदरता, मनुष्यों की स्वीकृति, या दैवी अनुग्रह में से कौन-सा अर्थ रखती है; अतः इस तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘फिर भी’ मूल में अलग शब्द के रूप में नहीं है, पर दो उपवाक्यों के स्पष्ट विरोध—दीर्घ उपवास और विलासी जीवन जैसा दिखाई देना—को स्वाभाविक हिन्दी में व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
