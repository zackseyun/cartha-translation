translation:
  language: hi
  text: पर मैं अपने पिता की बातें याद करता था, और रोते हुए भीतर के कक्ष में जाकर प्रभु से प्रार्थना करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνημόνευον
  choice: स्मरण रखीं
  rationale: अपूर्ण भूतकाल यहाँ निरन्तर या उस समय सक्रिय स्मरण का संकेत दे सकता है; ‘स्मरण रखीं’ स्वाभाविक हिन्दी में पिता की बातों को मन में बनाए रखने का भाव देता है।
- source_word: λόγους πατρός μου
  choice: अपने पिता की बातें
  rationale: λόγους का सामान्य और प्रसंगानुकूल अर्थ ‘बातें/वचन’ है; आधुनिक सामान्य पाठक के लिए ‘बातें’ सहज है और इसका अर्थ केवल औपचारिक आदेशों तक सीमित नहीं करता।
- source_word: ταμεῖον
  choice: भण्डार-कक्ष
  rationale: यूनानी शब्द किसी भीतरी, निजी कक्ष या भण्डार-कक्ष को सूचित कर सकता है। ‘भण्डार-कक्ष’ इसका ठोस मूल अर्थ बनाए रखता है, यद्यपि प्रसंग में वह एकान्त स्थान भी है।
- source_word: κλαίων
  choice: रोते हुए
  rationale: वर्तमान कृदन्त प्रार्थना के साथ घट रही क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: προσηυχόμην Κυρίῳ
  choice: मैंने प्रभु से प्रार्थना की
  rationale: हिन्दी में प्रार्थना के संबोधन के लिए ‘से’ स्वाभाविक है; ‘प्रभु’ Κυρίῳ का प्रतिष्ठित और अर्थ-संगत रूप है।
theological_decisions:
- issue: ‘प्रभु’ की पहचान
  choice: मूल पाठ की तरह केवल ‘प्रभु’ रखा गया
  alternative: ‘परमेश्वर’ या किसी विशिष्ट नाम से पहचान करना
  rationale: Κυρίῳ स्वयं यहाँ अधिक विशिष्ट पहचान नहीं देता; अनुवाद में ऐसी पहचान जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। यूनानी के मुख्य वाक्य-संबंध और रोते हुए प्रार्थना करने की समकालिकता सुरक्षित रखी गई है।
