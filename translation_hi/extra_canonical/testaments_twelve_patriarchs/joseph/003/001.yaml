base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/001.yaml
  text: In ten temptations he proved me approved, and in them all I was patient; for patience is a great remedy, and endurance gives many good things.
translation:
  language: hi
  text: दस परीक्षाओं[a] में उसने मुझे खरा सिद्ध किया, और उन सबके दौरान मैंने धीरज रखा; क्योंकि धीरज एक बड़ी औषधि है, और सहनशीलता अनेक अच्छी बातें देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रलोभनों’। यूनानी शब्द दोनों अर्थ दे सकता है।
    reason: πειρασμοῖς की शाब्दिक और प्रसंगगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: πειρασμοῖς
  choice: परीक्षाओं
  rationale: यहाँ प्रसंग व्यक्ति को परखकर खरा सिद्ध किए जाने का है; ‘परीक्षाएँ’ इस अर्थ को व्यक्त करता है, जबकि यूनानी शब्द में ‘प्रलोभन’ का भाव भी संभव है।
- source_word: δόκιμον ἀπέδειξέ με
  choice: मुझे खरा सिद्ध किया
  rationale: δόκιμος का अर्थ जाँच में प्रमाणित या खरा पाया जाना है; यह वाक्यांश उस परिणाम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐμακροθύμησα / ἡ μακροθυμία
  choice: मैंने धीरज रखा / धीरज
  rationale: μακροθυμία कठिन परिस्थिति में लंबे समय तक संयम और धैर्य बनाए रखने को दर्शाता है; दोनों स्थानों पर एक ही मूल शब्द का संबंध सुरक्षित रखा गया है।
- source_word: φάρμακον
  choice: औषधि
  rationale: यूनानी रूपक का सीधा अर्थ दवा या उपचार है; ‘औषधि’ मूल रूपक को गरिमापूर्ण और स्पष्ट हिन्दी में सुरक्षित रखता है।
- source_word: ἡ ὑπομονή
  choice: सहनशीलता
  rationale: ὑπομονή विपत्ति के नीचे टिके रहने और सहते हुए दृढ़ बने रहने का भाव देता है; इसे μακροθυμία के लिए प्रयुक्त ‘धीरज’ से अलग रखा गया है।
- source_word: πολλὰ ἀγαθὰ δίδωσιν
  choice: बहुत-सी भलाई प्रदान करती है
  rationale: यह अभिव्यक्ति अनेक अच्छे फल या लाभ मिलने के व्यापक अर्थ को बिना अनावश्यक विशिष्टता के व्यक्त करती है।
theological_decisions:
- issue: क्रिया ἀπέδειξέ का कर्ता
  choice: ‘उसने’ के रूप में सर्वनाम बनाए रखा गया
  alternative: कर्ता को स्पष्ट रूप से ‘परमेश्वर’ या किसी अन्य पात्र के रूप में नाम देना
  rationale: दिए गए यूनानी वाक्य में कर्ता केवल क्रिया के पुरुषवाचक एकवचन रूप से निहित है; निकट संदर्भ के बिना उसे नाम देना अस्पष्टता को अनुचित रूप से समाप्त कर देगा।
- issue: πειρασμοί का अर्थक्षेत्र
  choice: मुख्य पाठ में ‘परीक्षाएँ’, पादटिप्पणी में ‘प्रलोभन’ की संभावना
  alternative: मुख्य पाठ में केवल ‘प्रलोभन’
  rationale: खरा सिद्ध किए जाने का प्रसंग ‘परीक्षा’ का समर्थन करता है, पर यूनानी शब्द नैतिक प्रलोभनों को भी सूचित कर सकता है; पादटिप्पणी दोनों अर्थों के तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘धीरज’ और ‘सहनशीलता’ द्वारा निकटार्थी यूनानी शब्दों μακροθυμία और ὑπομονή में हल्का भेद बनाए रखा गया है; ‘औषधि’ मूल उपचार-संबंधी रूपक को सुरक्षित रखता है।
