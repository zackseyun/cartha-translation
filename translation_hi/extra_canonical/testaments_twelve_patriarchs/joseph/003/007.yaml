  alternative: अनुमान से जोड़ना कि वह यूसुफ को अपना पुत्र बनाना चाहती थी
  rationale: उपलब्ध यूनानी पाठ केवल ‘वह बहाना करती थी’ पर समाप्त होता है; छूटी हुई बात जोड़ना स्रोत से परे व्याख्यात्मक विस्तार होता।
