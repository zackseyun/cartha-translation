base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/006.yaml
  text: And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.
translation:
  language: hi
  text: और मैं भोर को उठकर प्रभु के पास जाता और मिस्री स्त्री मेम्फिस के विषय में रोता था, क्योंकि वह मुझे बहुत और लगातार सताती थी; क्योंकि रात में भी वह मुझसे मिलने के बहाने मेरे पास आ जाती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὤρθριζον πρὸς Κύριον
  choice: मैं भोर को उठकर प्रभु से प्रार्थना करता
  rationale: ὀρθρίζω भोर में उठने या शीघ्र जाने का भाव देता है; πρὸς Κύριον के साथ प्रसंग में प्रभु की ओर उन्मुख प्रार्थना का आशय स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἔκλαιον περὶ Μεμφίας τῆς Αἰγυπτίας
  choice: मिस्री स्त्री मेम्फिया के विषय में रोता था
  rationale: नाम और उसकी मिस्री पहचान को बनाए रखते हुए περὶ की व्यापकता को ‘के विषय में’ से सुरक्षित रखा गया है; इसे केवल ‘उसके कारण’ नहीं बनाया गया।
- source_word: σφόδρα ἀδιαλείπτως ἠνόχλει μοι
  choice: वह मुझे बहुत अधिक और निरन्तर परेशान करती थी
  rationale: σφόδρα की तीव्रता और ἀδιαλείπτως की निरन्तरता दोनों को अलग-अलग स्पष्ट रखा गया है।
- source_word: λόγῳ ἐπισκέψεως
  choice: मुझसे मिलने के बहाने
  rationale: शाब्दिक रूप से ‘भेंट/मुलाक़ात के कथन या कारण से’; यहाँ λόγῳ कारण अथवा दिखाए गए आधार का भाव देता है, जिसे स्वाभाविक हिन्दी में ‘बहाने’ कहा गया है।
theological_decisions:
- issue: πρὸς Κύριον में निहित क्रिया
  choice: प्रभु से प्रार्थना करता
  alternative: प्रभु के पास/प्रभु की ओर भोर को उठता
  rationale: यूनानी में प्रार्थना की क्रिया स्पष्ट नहीं है, पर प्रभु की ओर भोर में उठना और रोना भक्तिपूर्ण प्रार्थना का संकेत देता है। हिन्दी में केवल ‘प्रभु की ओर उठता’ अस्वाभाविक होता; इसलिए निहित आशय व्यक्त किया गया, जबकि रोने की क्रिया अलग रखी गई।
- issue: स्त्री के रात में आने का आशय
  choice: केवल ‘मिलने के बहाने’ कहा गया
  alternative: अनैतिक उद्देश्य या प्रलोभन को स्पष्ट कर देना
  rationale: इस पद में उद्देश्य संकेतित हो सकता है, पर स्पष्ट रूप से कहा नहीं गया; अतः धार्मिक या नैतिक व्याख्या को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। आवृत्तिमूलक अपूर्ण भूतकाल को ‘करता था/करती थी/आ जाती थी’ से व्यक्त किया गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
