  text: And if my master was away, I drank no wine; and for three days I would take my food and give it to the poor and the sick.
translation:
  language: hi
  text: 5 जब कभी मेरा स्वामी बाहर होते थे, तो मैं दाखरस नहीं पीता था; और तीन दिन तक मैं अपना भोजन लेता और उसे निर्धनों और बीमारों को दे देता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεδήμει
  choice: कहीं बाहर गया होता
  rationale: क्रिया का अर्थ अपने निवास-स्थान से दूर या यात्रा पर होना है; यह स्वामी की अनुपस्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ κύριός μου
  choice: मेरा स्वामी
  rationale: दास और स्वामी के प्रसंग में κύριος के सामाजिक संबंध को स्पष्ट रखते हुए ‘स्वामी’ चुना गया है।
- source_word: οἶνον
  choice: दाखमधु
  rationale: οἶνος अंगूर से बने मद्य को दर्शाता है; ‘दाखमधु’ प्रतिष्ठित और अर्थ-स्पष्ट बाइबलीय हिन्दी है।
- source_word: τριημερίζων
  choice: तीन दिन तक
  rationale: दुर्लभ क्रिया का आशय तीन दिनों की अवधि तक ऐसा करना है; हिन्दी में अवधि को सहज रूप से व्यक्त किया गया है।
- source_word: μου τὴν τροφήν
  choice: अपने हिस्से का भोजन
  rationale: μου को भोजन से संबद्ध मानते हुए ‘मेरा भोजन’ का अर्थ रखा गया है; ‘अपने हिस्से का’ प्रसंग में उस भोजन को अधिक स्वाभाविक ढंग से दर्शाता है जिसे यूसुफ स्वयं न खाकर देता था।
- source_word: τοῖς πένησιν καὶ τοῖς ἀσθενοῦσιν
  choice: गरीबों और बीमारों को
  rationale: दोनों समूहों को उनके सामान्य अर्थ में सीधे और सुबोध हिन्दी में रखा गया है।
theological_decisions:
- issue: तीन दिनों और भोजन के बीच संबंध
  choice: तीन दिन तक मैं अपने हिस्से का भोजन लेकर ... दे देता था
  alternative: मैं तीन दिनों का अपना भोजन लेकर ... दे देता था
  rationale: τριημερίζων व्याकरणतः अवधि के दौरान की जाने वाली क्रिया को दर्शा सकता है; चुना गया पाठ ग्रीक की क्रियात्मक संरचना और अंग्रेज़ी परामर्श-पाठ के अनुरूप है, जबकि संचित तीन दिनों के राशन का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। अपूर्णकालीन यूनानी क्रियाओं की आदतन/दोहराई जाने वाली क्रिया को ‘पीता था’ और ‘दे देता था’ से व्यक्त किया गया है।
