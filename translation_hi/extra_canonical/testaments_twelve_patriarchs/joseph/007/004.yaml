reference: Testament of Joseph 7:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδὼν δὲ αὐτὴν ὁ *ἀνὴρ αὐτῆς⁴ λέγει⁶ πρὸς αὐτήν⁷· Τί συνέπεσε τὸ πρόσωπόν σου; ⌜πρὸς αὐτὸν⌝⁷ εἶπεν, ⌜ὅτι⌝⁷ *πόνον καρδίας ἐγὼ ἀλγῶ, καὶ οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με⁸. *Ὁ δὲ⁹ ἐθεράπευσεν¹⁰ αὐτὴν *ἐν λόγοις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/004.yaml
  text: And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he healed her with words.
translation:
  language: hi
  text: जब उसके पति ने उसे देखा, तो उससे कहा, “तुम्हारे चेहरे को क्या हो गया है?” उसने उससे कहा, “मैं हृदय की पीड़ा से तड़प रही हूँ, और मेरी आत्मा की कराहें मुझे जकड़े हुए हैं।” तब उसने बातों से उसे चंगा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί συνέπεσε τὸ πρόσωπόν σου
  choice: तुम्हारे चेहरे को क्या हो गया है?
  rationale: यूनानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप; चेहरे पर आए स्पष्ट बदलाव या उदासी को व्यक्त करता है।
- source_word: πόνον καρδίας ἐγὼ ἀλγῶ
  choice: मैं हृदय की पीड़ा से तड़प रही हूँ
  rationale: ἀλγῶ की सक्रिय वेदना और πόνον καρδίας के आंतरिक कष्ट, दोनों को बनाए रखता है।
- source_word: οἱ τοῦ πνεύματος στεναγμοί
  choice: मेरी आत्मा की कराहें
  rationale: πνεῦμα को यहाँ व्यक्ति के भीतरी आत्मिक पक्ष के अर्थ में ‘आत्मा’ रखा गया है और στεναγμοί का सजीव बहुवचन सुरक्षित है।
- source_word: συνέχουσί με
  choice: मुझे जकड़े हुए हैं
  rationale: क्रिया के दबोचने, घेर लेने या वश में रखने के बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐθεράπευσεν αὐτὴν ἐν λόγοις
  choice: उसने बातों से उसे चंगा कर दिया
  rationale: ἐθεράπευσεν को बिना ‘कोशिश की’ जैसी अतिरिक्त धारणा जोड़े परिणामसूचक रखा गया है; ἐν λόγοις का साधनवाचक अर्थ ‘बातों से’ है।
theological_decisions:
- issue: πνεῦμα का अर्थ
  choice: आत्मा
  alternative: मन / अंतर्मन
  rationale: मूल की आत्मा/भीतरी सत्ता संबंधी अभिव्यक्ति को खुला रखता है और इसे केवल मनोवैज्ञानिक अर्थ तक सीमित नहीं करता।
- issue: ἐθεράπευσεν की परिणामसूचकता
  choice: चंगा कर दिया
  alternative: दिलासा दिया / चंगा करने की कोशिश की
  rationale: मूल क्रिया स्पष्ट रूप से ‘उसने चंगा किया’ कहती है; ‘कोशिश की’ जोड़ना स्रोत से अधिक होगा, जबकि केवल ‘दिलासा दिया’ उपचार के अर्थ को कमजोर करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद स्वाभाविक हिन्दी में है, जबकि ‘हृदय’, ‘आत्मा’ और ‘चंगा’ मूल की भावात्मक तथा धार्मिक साहित्यिक गूंज सुरक्षित रखते हैं।
