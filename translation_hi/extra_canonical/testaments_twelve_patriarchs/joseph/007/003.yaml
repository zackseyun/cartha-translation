  text: '*ἡ δὲ⁶⁴ συνεθέτό μου⁶⁵ τοῦ⁶⁶ *μηκέτι ποιῆσαι⁶⁷ τὴν ἀσέβειαν ταύτην⁶⁸. **Ἔτι δὲ¹ ἡ καρδία αὐτῆς *ἔκειτο εἰς τὸ κακὸν καὶ περιεβλέπετο ποίῳ τρόπῳ με παγιδεύσῃ· στενάζουσα δὲ †συντόμως συνεπίπτε μὴ ἀσθενοῦσα².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/003.yaml
  text: And she agreed with me no longer to commit this impiety. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would suddenly collapse, though she was not actually sick.
translation:
  language: hi
  text: और वह मुझसे सहमत हो गई कि अब आगे यह अधर्म नहीं करेगी। फिर भी उसका मन बुराई पर ही लगा रहा, और वह इस ताक में इधर-उधर देखती रहती थी कि किस तरह मुझे फँसाए। वह कराहती हुई अचानक गिर पड़ती थी,[a] हालाँकि वह दुर्बल नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अचानक’ के लिए यूनानी शब्द (συντόμως) इस संस्करण में संदिग्ध चिह्नित है। अंतिम खंड का शाब्दिक अर्थ है, ‘दुर्बल न होते हुए।’
    reason: यह पादटिप्पणी चिह्नित यूनानी पाठगत अनिश्चितता को बताती है, पर उसके आधार पर अभिनय का अतिरिक्त अर्थ आरोपित नहीं करती।
lexical_decisions:
- source_word: ἀσέβειαν
  choice: अधर्म
  rationale: यह शब्द ईश्वर-विरोधी या नैतिक रूप से दुष्ट आचरण का संकेत देता है; ‘अधर्म’ आधुनिक हिन्दी में इसकी धार्मिक-नैतिक गंभीरता बनाए रखता है।
- source_word: ἡ καρδία αὐτῆς ἔκειτο εἰς τὸ κακόν
  choice: उसका मन बुराई पर ही लगा रहा
  rationale: ‘हृदय’ का शाब्दिक प्रयोग सम्भव है, पर यहाँ καρδία इच्छा और अभिप्राय का केंद्र है; ‘मन’ स्वाभाविक हिन्दी में वही भाव व्यक्त करता है, और ‘ही’ उसकी लगातार बनी हुई दुष्ट मंशा को उभारता है।
- source_word: παγιδεύσῃ
  choice: मुझे फँसाए
  rationale: मूल क्रिया जाल में पकड़ने या षड्यंत्रपूर्वक फँसाने का बिंब रखती है; ‘फँसाए’ सहज और सटीक है।
- source_word: μὴ ἀσθενοῦσα
  choice: हालाँकि वह दुर्बल नहीं थी
  rationale: ἀσθενέω का मूल अर्थ दुर्बल होना है और प्रसंग में बीमारी का भाव भी हो सकता है; ‘दुर्बल’ स्रोत के अधिक निकट रहते हुए अभिनय का संकेत बनाए रखता है।
theological_decisions:
- issue: ἀσέβεια की धार्मिक-नैतिक शक्ति
  choice: अधर्म
  alternative: दुष्टता / अपवित्र काम
  rationale: ‘अधर्म’ किसी विशिष्ट सम्प्रदायगत व्याख्या को जोड़े बिना आचरण की ईश्वर-विरोधी और नैतिक गंभीरता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस ताक में…कि’ निरंतर अवसर खोजने का स्वाभाविक हिन्दी मुहावरा है। अंतिम वाक्य में स्रोत की पाठगत अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है, जबकि मुख्य पाठ पठनीय रखा गया है।
