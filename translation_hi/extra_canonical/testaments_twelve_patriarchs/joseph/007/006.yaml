  text: But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,
translation:
  language: hi
  text: परन्तु जब मैं समझ गया कि बेलियार की आत्मा उसे परेशान कर रही है, तो मैंने प्रभु से प्रार्थना की और उससे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: जब मैं समझ गया
  rationale: यह क्रियाविशेषणीय कृदन्त मुख्य क्रिया से पहले हुई समझ को व्यक्त करता है; हिन्दी में काल-संबंध स्पष्ट और स्वाभाविक रखा गया है।
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: बेलियार की आत्मा
  rationale: यूनानी संबंधवाचक रचना का सीधा और अर्थगत रूप से खुला अनुवाद है; ‘बेलियार’ व्यक्तिनाम को लिप्यंतरित किया गया है।
- source_word: ἐνοχλεῖ αὐτήν
  choice: उसे परेशान कर रही है
  rationale: ἐνοχλεῖ यहाँ सताने या व्याकुल करने का भाव देता है; सामान्य आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: προσευξάμενος τῷ Κυρίῳ
  choice: मैंने प्रभु से प्रार्थना की
  rationale: कृदन्त को क्रमबद्ध हिन्दी उपवाक्य में बदला गया है और सम्प्रदान τῷ Κυρίῳ को स्वाभाविक ‘प्रभु से’ द्वारा व्यक्त किया गया है।
- source_word: εἶπον πρὸς αὐτήν
  choice: उससे कहा
  rationale: πρός के संबोधनात्मक प्रयोग को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘बेलियार की आत्मा’ का आशय
  choice: स्रोत की संबंधवाचक अभिव्यक्ति को यथावत खुला रखा गया
  alternative: ‘बेलियार नामक दुष्टात्मा’ या ‘बेलियार का प्रभाव’
  rationale: मूल पाठ यह निश्चित नहीं करता कि यह स्वयं बेलियार, उससे संबंधित कोई आत्मा, या उसका प्रभाव है; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य के अंत में अल्पविराम रखा गया है क्योंकि यह अगले पद में आने वाले कथन की भूमिका है।
