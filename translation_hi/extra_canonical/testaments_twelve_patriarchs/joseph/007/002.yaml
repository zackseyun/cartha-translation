  text: But when she saw this, she fell on her face at my feet, weeping; and I raised her up and admonished her.
translation:
  language: hi
  text: पर जब उसने यह देखा, तो वह रोती हुई मेरे पाँवों पर मुँह के बल गिर पड़ी; और मैंने उसे उठाकर समझाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πρόσωπον αὐτῆς εἰς τοὺς πόδας μου
  choice: मेरे पाँवों पर मुँह के बल
  rationale: यूनानी पाठ में शारीरिक मुद्रा और गिरने की दिशा दोनों व्यक्त हैं; यह हिन्दी में उन्हें स्वाभाविक और स्पष्ट रूप से बनाए रखता है।
- source_word: κλαίουσα
  choice: रोती हुई
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ चल रही अवस्था बताता है।
- source_word: ἀναστήσας αὐτήν
  choice: उसे उठाकर
  rationale: कृदंत की पूर्वकालिक क्रिया को सहज हिन्दी क्रम में व्यक्त करता है।
- source_word: ἐνουθέτησα
  choice: समझाया
  rationale: क्रिया का अर्थ चेताना, समझाना या उचित आचरण के लिए नसीहत देना हो सकता है; प्रसंग में 'समझाया' आधुनिक हिन्दी का स्वाभाविक और पर्याप्त व्यापक शब्द है।
theological_decisions: []
