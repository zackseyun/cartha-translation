  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य स्रोत के घटनाक्रम—देखना, गिरना और रोना, फिर उठाकर समझाना—को सुरक्षित रखता है।
