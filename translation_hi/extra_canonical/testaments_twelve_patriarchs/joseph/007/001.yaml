source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἵνα δὲ⁴⁵ μάθῃς⁴⁶, ὅτι⁴⁷ τῶν⁴⁸ ἐν σωφροσύνῃ θεοσεβούντων⁴⁹ οὐ κατισχύσει⁵⁰ κακία⁵¹ *τῶν ἀσεβούντων⁵². ⌈Ἰδοὺ⌉⁵³ λαβὼν⁵⁴ *ἐξ αὐτοῦ ἐνώπιόν σου ἐσθίων. Καὶ τοῦτο εἰπὼν εἶπον οὕτως⁵⁵. Ὁ Θεὸς τῶν πατέρων μου καὶ ὁ ἄγγελος Ἀβραὰμ⁵⁶ *ἔσται μετ᾽ ἐμοῦ⁵⁷. ⌈Ἔφαγον⌉⁵⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/001.yaml
  text: 'So that you may learn that the wickedness of the ungodly will not prevail over those who fear God with self-control, look: taking some of it in your presence, I will eat. And after saying this, I said thus, “The God of my fathers and the angel of Abraham will be with me.” And I ate.'
translation:
  language: hi
  text: 'ताकि तुम जान लो कि अधर्मियों की बुराई उन लोगों पर प्रबल नहीं होगी जो संयम के साथ परमेश्वर का आदर करते हैं, देखो: तुम्हारे सामने इसमें से कुछ लेकर मैं खाऊँगा।[a] और यह कहकर मैंने इस प्रकार कहा, “मेरे पूर्वजों का परमेश्वर और इब्राहीम का दूत मेरे साथ रहेगा।” और मैंने खाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य यहाँ संक्षिप्त और व्याकरण की दृष्टि से अधूरा-सा है; उसका अधिक शाब्दिक रूप है, “देखो, इसमें से कुछ लेकर तुम्हारे सामने खाते हुए।” प्रसंग के अनुसार निहित प्रथम पुरुष और भावी आशय स्पष्ट करके अनुवाद किया गया है।
    reason: मूल पाठ की असामान्य रचना और अनुवाद में आवश्यक रूप से स्पष्ट किए गए कर्ता तथा काल को पारदर्शी बनाना।
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: संयम से
  rationale: यह शब्द आत्म-संयम, विवेकपूर्ण शुद्ध आचरण और मर्यादा का भाव रखता है; यहाँ संक्षिप्त और स्वाभाविक हिन्दी में ‘संयम’ उपयुक्त है।
- source_word: θεοσεβούντων
  choice: परमेश्वर का भय मानते हैं
  rationale: यूनानी शब्द श्रद्धापूर्ण भय और भक्ति का संकेत देता है; ‘परमेश्वर का भय मानना’ धार्मिक अर्थ को स्पष्ट रखते हुए प्रचलित बाइबलीय हिन्दी है।
- source_word: οὐ κατισχύσει
  choice: प्रबल नहीं होगी
  rationale: क्रिया का अर्थ किसी पर हावी होने या उसके विरुद्ध सफल होने से है; ‘प्रबल नहीं होगी’ इस संघर्षात्मक भाव को बनाए रखता है।
- source_word: ὁ ἄγγελος Ἀβραὰμ
  choice: इब्राहीम का दूत
  rationale: संबंधकारक रचना को उसी प्रकार खुला रखा गया है; इसे ‘इब्राहीम की रक्षा करने वाला दूत’ आदि बनाकर संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: ‘परमेश्वर’ और ‘इब्राहीम का दूत’ के बीच संबंध
  choice: दोनों को स्रोत के समान ‘और’ से जोड़ा गया है
  alternative: दूत को परमेश्वर का ही रूप अथवा विशेष संरक्षक दूत बताना
  rationale: मूल पाठ दोनों पदों को अलग-अलग उल्लेखित करता है, पर उनके सटीक पारस्परिक संबंध की व्याख्या नहीं करता; इसलिए धर्मवैज्ञानिक तनाव को अनिर्णीत रखा गया है।
- issue: σωφροσύνη और परमेश्वर-भक्ति का संबंध
  choice: ‘संयम से परमेश्वर का भय मानते हैं’
  alternative: ‘पवित्रता में परमेश्वर की उपासना करते हैं’
  rationale: मूल में संयम/शुद्धचित्तता और श्रद्धापूर्ण परमेश्वर-भक्ति दोनों उपस्थित हैं; चुना हुआ रूप किसी विशिष्ट पवित्रता-सिद्धांत को आरोपित किए बिना दोनों को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। संबोधन के लिए ‘तुम’ रखा गया है, जो एकवचन प्रसंग में स्वाभाविक है और अनावश्यक रूप से कठोर या अत्यधिक औपचारिक नहीं लगता। स्रोत की पुनरुक्ति ‘यह कहकर मैंने इस प्रकार कहा’ को हटाया नहीं गया, क्योंकि वह यूनानी पाठ में स्पष्ट रूप से उपस्थित है।
