  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/005.yaml
  text: Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking, or I will throw myself down a cliff, if you do not lie with me.”
translation:
  language: hi
  text: तब अवसर पाकर वह मेरे पास भीतर लपककर आई—उस समय उसका पति अब भी बाहर था—और मुझसे कहने लगी, “मेरा दम घुट रहा है, या फिर मैं अपने आपको किसी खड़ी चट्टान से नीचे फेंक दूँगी, अगर तुम मेरे साथ शारीरिक संबंध नहीं बनाओगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκαιρίαν λαβοῦσα
  choice: अवसर पाकर
  rationale: ग्रीक मुहावरे का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: εἰσεπήδησε πρός με
  choice: मेरे पास भीतर दौड़ी आई
  rationale: क्रिया में भीतर आने और अचानक तेज़ी से बढ़ने, दोनों भावों को सुरक्षित रखा गया है।
- source_word: Ἄγχομαι
  choice: मेरा दम घुट रहा है
  rationale: वर्तमानकालीन शारीरिक घुटन का सीधा अर्थ देता है; इसे भावात्मक व्याख्या में नहीं बदला गया।
- source_word: εἰς κρημνὸν ῥίπτω ἐμαυτήν
  choice: अपने आपको किसी खड़ी चट्टान से नीचे फेंक दूँगी
  rationale: κρημνός के खड़े, गिरावट वाले स्थल को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: मेरे साथ शारीरिक संबंध बनाओगे
  rationale: यहाँ संदर्भानुसार यौन संसर्ग अभिप्रेत है; चयन स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी में स्वाभाविक है।
