base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/007.yaml
  text: “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband’s concubine, your rival, will beat your children and wipe out your memory from the earth.”
translation:
  language: hi
  text: “अभागी स्त्री, तू पापों में अंधी होकर क्यों इतनी व्याकुल और अशांत हो रही है? याद रख, यदि तू अपने प्राण ले लेगी, तो तेरे पति की उपपत्नी और तेरी प्रतिद्वंद्वी अस्थो तेरे बच्चों को पीटेगी, और तू पृथ्वी पर से अपनी स्मृति मिटा देगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄθλια
  choice: अभागी स्त्री
  rationale: संबोधन में स्त्रीलिंग विशेषण की दयनीय दशा और फटकार, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τάρασσον καὶ θορυβῇ
  choice: इतनी व्याकुल और अशांत क्यों हो रही है
  rationale: दो निकटार्थी क्रियाओं के मानसिक उद्वेग और आंतरिक हलचल को बनाए रखता है।
- source_word: ἐν ἁμαρτίαις τυφλώττουσα
  choice: पापों में अंधी होकर
  rationale: ग्रीक कृदंत की रूपकात्मक दृष्टिहीनता और पापों के बहुवचन को सुरक्षित रखता है।
- source_word: ἀνέλῃς σεαυτήν
  choice: अपने प्राण ले लेगी
  rationale: आत्महत्या के आशय को स्पष्ट, किंतु गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παλλακὴ
  choice: उपपत्नी
  rationale: विवाहिता पत्नी से अलग, अधीनस्थ यौन-संबंध वाली स्त्री के ऐतिहासिक अर्थ को संक्षेप और तटस्थता से व्यक्त करता है।
- source_word: ἀντίζηλός
  choice: प्रतिद्वंद्वी
  rationale: स्नेह और घरेलू प्रतिष्ठा के लिए प्रतिस्पर्धी स्त्री का अर्थ बनाए रखता है।
- source_word: κονδυλίσει
  choice: पीटेगी
  rationale: शारीरिक प्रहार के सामान्य अर्थ को सीधे और स्वाभाविक रूप में देता है।
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  choice: पृथ्वी पर से तेरी स्मृति मिट जाएगी
  rationale: शाब्दिक संरचना में कर्ता ‘तू’ है, पर मुहावरे का परिणाम—स्मृति का लोप—स्वाभाविक हिन्दी में कर्मवाच्य-सदृश रूप से व्यक्त होता है।
