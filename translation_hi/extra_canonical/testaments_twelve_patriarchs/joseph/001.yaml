base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001.yaml
  text: '3. In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.

    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, and the Most High brought me up.

    5. I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was gripped by famine, and the Lord himself nourished me.

    6. I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]

    7. Amid slanders he spoke in my defense. In the bitter talk of dreams he rescued me.'
translation:
  language: hi
  text: '**याकूब और राहेल के ग्यारहवें पुत्र यूसुफ की वसीयत**


    **1.** यह यूसुफ की वसीयत की प्रति है। जब उसके मरने का समय निकट आया, तो उसने अपने पुत्रों और भाइयों को बुलाकर उनसे कहा:


    **2.** “मेरे भाइयो और मेरे बच्चो, इस्राएल के प्रिय यूसुफ की सुनो; मेरे मुँह की बातों पर कान लगाओ।


    **3.** मैंने अपने जीवन में ईर्ष्या और मृत्यु देखी, फिर भी मैं भटका नहीं, बल्कि प्रभु की सच्चाई में बना रहा।


    **4.** मेरे भाइयों ने मुझसे घृणा की, पर प्रभु ने मुझसे प्रेम किया। वे मुझे मार डालना चाहते थे, पर मेरे पूर्वजों के परमेश्वर ने मुझे सुरक्षित रखा। उन्होंने मुझे गड्ढे में उतार दिया, पर परमप्रधान ने मुझे ऊपर निकाला।


    **5.** मुझे दासता में बेच दिया गया, पर सबके स्वामी ने मुझे स्वतंत्र किया। मुझे बंदी बनाया गया, पर उसके सामर्थी हाथ ने मेरी सहायता की। मैं अकाल की चपेट में आ गया, पर स्वयं प्रभु ने मेरा पालन-पोषण किया।


    **6.** मैं अकेला था, और परमेश्वर ने मुझे सांत्वना दी। मैं दुर्बल था, और प्रभु ने मेरी सुधि ली। मैं कारागार में था, और उद्धारकर्ता ने मुझ पर कृपा की। [मैं बेड़ियों में था, और उसने मुझे मुक्त कर दिया।][a]


    **7.** निंदाओं के बीच उसने मेरा पक्ष लिया। सपनों से जुड़ी कड़वी बातों के बीच उसने मुझे बचाया। मैं दास था, और उसने मुझे ऊँचा उठाया।[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिया गया वाक्य कुछ पाठ-परंपराओं में अनुपस्थित या संदिग्ध है।
    reason: मुद्रित यूनानी स्रोत स्वयं इस पंक्ति को वर्ग कोष्ठकों में रखता है, इसलिए पाठगत अनिश्चितता पाठक को बताना आवश्यक है।
  - marker: b
    text: इस अंतिम वाक्य का यूनानी पाठ अत्यंत संक्षिप्त और कुछ खंडित है; शाब्दिक रूप लगभग ‘दास—और उसने मुझे ऊँचा उठाया’ है।
    reason: मुख्य पाठ में सहज हिन्दी के लिए निहित क्रिया जोड़ी गई है, पर स्रोत की पाठगत कठिनाई छिपाई नहीं जानी चाहिए।
lexical_decisions:
- source_word: φθόνον καὶ τὸν θάνατον
  choice: ईर्ष्या और मृत्यु
  rationale: दोनों संज्ञाओं को उनकी ठोस और जानबूझकर तनावपूर्ण समानांतरता सहित रखा गया है; अर्थ को ‘मृत्यु का खतरा’ कहकर सीमित नहीं किया।
- source_word: ἀληθείᾳ Κυρίου
  choice: प्रभु की सच्चाई
  rationale: ἀλήθεια की व्यापक अर्थ-सीमा—सत्य, सत्यता और विश्वसनीयता—को खुला रखता है।
- source_word: ὁ πάντων δεσπότης
  choice: सबके स्वामी
  rationale: सार्वभौम अधिकार का स्वाभाविक हिन्दी रूप, बिना किसी अतिरिक्त सांप्रदायिक उपाधि के।
- source_word: ἐν λιμῷ συνεσχέθην
  choice: मैं अकाल की चपेट में आ गया
  rationale: συνέχομαι के घिरने या जकड़े जाने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπεσκέψατό με
  choice: मेरी सुधि ली
  rationale: यह केवल शारीरिक भेंट नहीं, बल्कि ध्यान और देखभाल का भाव भी रखता है।
- source_word: ἐχαρίτωσέ με
  choice: मुझ पर कृपा की
  rationale: कृपा अथवा अनुग्रह प्रदान करने का भाव रखता है और इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक सूत्र में नहीं बदलता।
- source_word: ἐν διαβολαῖς καὶ συνηγόρησέ μοι
  choice: मुझ पर झूठे दोष लगाए गए, और उसने मेरा पक्ष लिया
  rationale: διαβολαί को निंदात्मक आरोप और συνηγορέω को पक्ष-समर्थन के न्यायिक भाव में स्वाभाविक हिन्दी देता है।
- source_word: ἐν λόγοις ἐνυπνίων πικροῖς
  choice: सपनों से जुड़ी कड़वी बातों के बीच
  rationale: यूनानी पदबंध असामान्य है; अनुवाद ‘बातों’ और ‘सपनों’ का संबंध बनाए रखता है, पर यह तय नहीं करता कि सपने स्वयं कड़वे थे या उनके विषय में कही गई बातें।
- source_word: Δοῦλος καὶ ὕψωσέ με
  choice: मैं दास था, और उसने मुझे ऊँचा उठाया
  rationale: संक्षिप्त, कुछ खंडित यूनानी को पिछले समानांतर कथनों के अनुरूप न्यूनतम पूर्ति के साथ प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘प्रभु’, ‘परमेश्वर’, ‘परमप्रधान’, ‘सबके स्वामी’ और ‘उद्धारकर्ता’ जैसी अलग-अलग ईश्वरीय उपाधियाँ
  choice: स्रोत में आए भेदों को अलग-अलग बनाए रखा
  alternative: सभी को एक ही सामान्य उपाधि, जैसे ‘परमेश्वर’, से व्यक्त करना
  rationale: मूल की काव्यात्मक विविधता और धर्मवैज्ञानिक तनाव को समतल नहीं किया गया।
- issue: ‘प्रभु की सच्चाई में बना रहा’ का अर्थ
  choice: स्रोत की संबंधवाचक अस्पष्टता सुरक्षित रखी
  alternative: ‘प्रभु के प्रति विश्वासयोग्य रहा’ या ‘प्रभु के सत्य मार्ग पर रहा’
  rationale: यूनानी वाक्यांश सत्य, सत्यता अथवा प्रभु की विश्वसनीयता की ओर संकेत कर सकता है; किसी एक व्याख्या को मुख्य पाठ में अनिवार्य नहीं किया।
- issue: उद्धारकर्ता की पहचान
  choice: केवल स्रोत की उपाधि ‘उद्धारकर्ता’ दी
  alternative: इसे किसी विशिष्ट बाद की धर्मवैज्ञानिक पहचान से स्पष्ट करना
  rationale: पाठ स्वयं यहाँ उस पहचान को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। संबोधन में ‘भाइयो’ और ‘बच्चो’ स्वाभाविक मौखिक वसीयतनामा-शैली देते हैं। पद 3–7 की समानांतर, साक्ष्यात्मक लय को छोटे वाक्यों और बार-बार आने वाले ‘पर’/‘और’ द्वारा बनाए रखा गया है।
