  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006.yaml
  text: 1 And after this she sent me food mixed with sorcery[a]. 2 But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me, together with the dish, a sword; and I understood that it was a scheme to lead me astray. 3 So after he had gone out, I ate neither that food nor any of her other foods, but wept without tasting them. 4 Then after one day she came to me, and when she recognized the food, she said to me, “Why is it that you did not eat the food?” 5 And I said to her, “Because you filled it with deadly sorcery. And how did you say, ‘I do not draw near to idols, but to the Lord alone’? 6 Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and for this reason I kept it as evidence against you, to expose you, in hope that perhaps, when you saw it[b][a], you might repent.”
translation:
  language: hi
  text: '**यूसुफ़ का वसीयतनामा 6**


    1 इसके बाद उसने मेरे पास ऐसा भोजन भेजा जिसमें जादू-टोना मिला हुआ था। 2 जब वह खोजा भोजन लेकर आया, तो मैंने नज़र उठाई और देखा कि एक भयावह पुरुष थाली के साथ मुझे एक तलवार भी दे रहा है। तब मैं समझ गया कि यह मुझे भटकाने के लिए की गई कोई चाल थी।[a] 3 उसके बाहर चले जाने पर मैं रोया और न तो उस भोजन को और न उसके भेजे हुए किसी दूसरे व्यंजन को चखा।


    4 एक दिन बाद वह मेरे पास आई। भोजन को पहचानकर उसने मुझसे कहा, “क्या कारण है कि तुमने यह भोजन नहीं खाया?”


    5 मैंने उससे कहा, “क्योंकि तुमने इसे जानलेवा जादू-टोने से भर दिया था। फिर तुमने यह कैसे कहा था, ‘मैं मूर्तियों के निकट नहीं जाती, बल्कि केवल प्रभु के निकट जाती हूँ’?


    6 “इसलिए अब जान लो कि मेरे पिता के परमेश्वर ने अपने दूत के द्वारा तुम्हारी दुष्टता मुझ पर प्रकट कर दी। मैंने यह भोजन तुम्हें दोषी ठहराने के प्रमाण के रूप में बचाकर रखा,[b] ताकि शायद इसे देखकर तुम पश्चाताप करो।


    7 “और तुम यह जान लो कि भक्तिहीन लोगों की दुष्टता उन लोगों पर प्रबल नहीं होगी जो संयम से परमेश्वर की आराधना करते हैं। देखो, अब मैं इसमें से लेकर तुम्हारे सामने खाता हूँ।” इतना कहकर मैंने कहा, “मेरे पूर्वजों का परमेश्वर और अब्राहम का दूत मेरे साथ रहेगा।” तब मैंने वह भोजन खा लिया।


    8 यह देखकर वह रोती हुई औंधे मुँह मेरे पैरों पर गिर पड़ी। मैंने उसे उठाया और समझाया। 9 तब उसने मुझसे प्रतिज्ञा की कि वह फिर ऐसा अधर्म नहीं करेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भयावह पुरुष’ की पहचान यूनानी पाठ में नहीं बताई गई है। ‘चाल’ का अनुवाद किया गया शब्द किसी छलपूर्ण या जादुई युक्ति का संकेत भी दे सकता है।
    reason: मूल पाठ व्यक्ति की पहचान और περιέργεια की सटीक प्रकृति को खुला छोड़ता है।
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारे खंडन के लिए”; इसका अर्थ “तुम्हें दोषी ठहराने” या “तुम्हें तुम्हारा दोष दिखाने के लिए” भी हो सकता है।
    reason: ἔλεγχος दोष सिद्ध करने, खंडन करने या सुधार के लिए दोष उजागर करने के अर्थ रख सकता है।
lexical_decisions:
- source_word: βρῶμα
  choice: भोजन
  rationale: यह सामान्य रूप से खाने की वस्तु या भोजन को दर्शाता है; सभी प्रसंगों में किसी खास पकवान का अनावश्यक संकेत नहीं देता।
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: जिसमें जादू-टोना मिला हुआ था
  rationale: γοητεία जादुई या तांत्रिक क्रिया को और πεφυρμένον मिलाए जाने को व्यक्त करता है; यह रूप दोनों पहलुओं को स्वाभाविक हिन्दी में रखता है।
- source_word: φοβερὸν ἄνδρα
  choice: एक भयावह पुरुष
  rationale: φοβερός यहाँ डर और अशुभ संकट का बोध कराता है; व्यक्ति की पहचान अनिर्धारित रखी गई है।
- source_word: τρύβλιον
  choice: थाली
  rationale: यह भोजन रखने का पात्र है; हिन्दी में ‘थाली’ दृश्य को सहजता से व्यक्त करती है, यद्यपि पात्र का ठीक आकार निर्दिष्ट नहीं है।
- source_word: μάχαιρα
  choice: तलवार
  rationale: शब्द तलवार या बड़े छुरे के लिए प्रयुक्त हो सकता है; दृश्य की धमकीपूर्ण प्रकृति को रखते हुए ‘तलवार’ चुना गया है।
- source_word: περιέργεια
  choice: चाल
  rationale: यहाँ शब्द किसी कौतूहल के बजाय भटकाने के उद्देश्य से की गई धूर्त या संभवतः जादुई युक्ति बताता है।
- source_word: εἰς ἀποπλάνησίν μου
  choice: मुझे भटकाने के लिए
  rationale: यह नैतिक या आध्यात्मिक मार्ग से हटाने का भाव बनाए रखता है और प्रसंग में संभावित प्रलोभन को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: γοητείας θανάτου
  choice: जानलेवा जादू-टोना
  rationale: शाब्दिक ‘मृत्यु का जादू-टोना’ को स्वाभाविक हिन्दी में उसके घातक गुण या परिणाम के रूप में व्यक्त किया गया है।
- source_word: ἐν σωφροσύνῃ θεοσεβούντων
  choice: जो संयम से परमेश्वर की आराधना करते हैं
  rationale: σωφροσύνη में आत्मसंयम, शुद्ध आचरण और विवेक का क्षेत्र है; ‘संयम’ प्रसंगगत नैतिक बल को बिना संकीर्ण किए रखता है।
- source_word: συνεθέτό μου
  choice: उसने मुझसे प्रतिज्ञा की
  rationale: प्रसंग में यह आगे उस भक्तिहीन काम को न करने की सहमति या वचन को दर्शाता है; ‘प्रतिज्ञा की’ हिन्दी में आशय स्पष्ट करता है।
theological_decisions:
- issue: तलवार लिए ‘भयावह पुरुष’ की पहचान
  choice: व्यक्ति को केवल ‘भयावह पुरुष’ कहा गया है और उसकी पहचान खुली रखी गई है।
  alternative: उसे स्वर्गदूत, दुष्टात्मा, जादू-टोने से जुड़ा दृश्य या प्रतीकात्मक चेतावनी मानना।
  rationale: यूनानी पाठ केवल बताता है कि यूसुफ़ ने उसे देखा; वह उस व्यक्ति की प्रकृति या पहचान स्पष्ट नहीं करता।
- issue: περιέργεια की जादुई या सामान्य षड्यंत्रकारी प्रकृति
  choice: ‘चाल’
  alternative: ‘जादुई युक्ति’ या ‘छल’
  rationale: तत्काल प्रसंग जादू-टोने का है, पर यह संज्ञा अपने आप में केवल जादू तक सीमित नहीं; व्यापक शब्द मूल की अस्पष्टता बचाता है।
- issue: μετανοήσεις का अर्थ
  choice: पश्चाताप करो
  alternative: मन बदलो
  rationale: यह किसी निर्दिष्ट दुष्ट कर्म के सीधे सामना और उससे लौटने का प्रसंग है, इसलिए ‘पश्चाताप’ उपयुक्त है।
- issue: ‘अब्राहम का दूत’ की पहचान
  choice: शाब्दिक संबंध बनाए रखते हुए ‘अब्राहम का दूत’
  alternative: ‘अब्राहम की रक्षा करने वाला स्वर्गदूत’ या ‘अब्राहम के पास आने वाला दूत’
  rationale: मूल ὁ ἄγγελος Ἀβραάμ संबंध को विस्तार से नहीं बताता; व्याख्यात्मक पहचान जोड़ना उचित नहीं होगा।
- issue: भोजन खाने में दैवी रक्षा की धारणा
  choice: यूसुफ़ के कथन और उसके बाद भोजन करने की घटना को सीधे क्रम में रखा गया है।
  alternative: इसे प्रार्थना, चमत्कारी विषनिवारण या दैवी परीक्षा के रूप में स्पष्ट करना।
  rationale: पाठ परिणाम का धर्मवैज्ञानिक तंत्र नहीं समझाता; अनुवाद उसके भरोसे और कर्म को बताता है, पर अतिरिक्त सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘परमेश्वर’, ‘प्रभु’, ‘दूत’, ‘मूर्ति’, ‘आराधना’ और ‘पश्चाताप’ जैसे परिचित धार्मिक शब्द प्रयुक्त हैं। स्त्री का नाम इस अध्याय में मूल पाठ में नहीं आता, इसलिए अनुवाद में नहीं जोड़ा गया। पद 7 के असमतल यूनानी वाक्यक्रम को अर्थ बदले बिना स्वाभाविक हिन्दी क्रम में व्यवस्थित किया गया है।
