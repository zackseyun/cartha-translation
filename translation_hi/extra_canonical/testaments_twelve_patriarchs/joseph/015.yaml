lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: पाप की लालसा से
  rationale: ग्रीक संबंध को जानबूझकर खुला रखते हुए कामनापूर्ण और नैतिक आशय दोनों को व्यक्त करता है।
- source_word: τὰ ἀλλότρια
  choice: किसी दूसरे की वस्तु
  rationale: शाब्दिक अर्थ ‘दूसरे की चीज़ें’ है; प्रसंग में स्वामित्व का भाव स्पष्ट है।
- source_word: μεταβόλου / μετάβολος
  choice: अदला-बदली / व्यापारी
  rationale: पहले प्रयोग में विनिमय की घटना और बाद में व्यक्ति के लिए व्यापारी का अर्थ प्रसंगानुसार लिया गया है।
- source_word: δοῦλος
  choice: दास
  rationale: यह बाध्य स्वामित्व की सामाजिक स्थिति बताता है; ‘सेवक’ अर्थ को हल्का कर देता।
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: मेरा कलेजा फट गया
  rationale: शारीरिक रूपक और तीव्र भावनात्मक पीड़ा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: टाट ओढ़े और राख में बैठकर
  rationale: शोक की प्राचीन क्रिया को आधुनिक पाठक के लिए दृश्य और बोधगम्य बनाया गया है।
- source_word: ἐκδίκησιν κινδύνου
  choice: कठोर प्रतिशोध
  rationale: पाठ का वाक्यांश असामान्य है; ‘खतरनाक प्रतिशोध’ की अपेक्षा हिन्दी में स्वाभाविक रहते हुए उसकी तीव्रता व्यक्त की गई है।
- source_word: κρίσεως τοῦ Πεντεφρί
  choice: पोतीफर के न्याय
  rationale: κρίσις के न्याय/निर्णय संबंधी अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
theological_decisions:
- issue: याकूब की प्रतिष्ठा का क्षेत्र
  choice: परमेश्वर और मनुष्यों की दृष्टि में महान
  alternative: परमेश्वर और मनुष्यों के सामने महान
  rationale: παρὰ Θεῷ καὶ ἀνθρώποις को सम्मान या प्रतिष्ठा के रूप में व्यक्त करता है, बिना अलौकिक दर्जा जोड़ने के।
- issue: यूसुफ द्वारा भाइयों को लज्जित न करना
  choice: ताकि अपने भाइयों को लज्जित न करूँ
  alternative: ताकि अपने भाइयों की निन्दा न करूँ
  rationale: αἰσχύνω का सीधा अर्थ रखा गया है; इससे यूसुफ की प्रेरणा की नैतिक जटिलता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। अध्याय 14 की जारी पंक्तियों को 14:4–6 और नए अध्याय को 15:1–7 के रूप में स्पष्ट किया गया है। प्राचीन भावात्मक रूपकों को जहाँ सम्भव हो स्वाभाविक हिन्दी मुहावरों में रखा गया है।
