translation:
  language: hi
  text: और मुझे उससे अलग करके उसने मुझसे कहा, “क्या तुम दास हो या स्वतंत्र?” मैंने कहा, “दास।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρίσας
  choice: अलग ले जाकर
  rationale: यह कृदन्त किसी व्यक्ति से अलग किए जाने का भाव देता है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘अलग ले जाकर’ उपयुक्त है।
- source_word: Δοῦλος
  choice: दास
  rationale: ग्रीक शब्द स्वतंत्र व्यक्ति के विपरीत दास की सामाजिक-कानूनी स्थिति को दर्शाता है; ‘सेवक’ इस विरोध को कमजोर कर सकता है।
- source_word: ἐλεύθερος
  choice: स्वतंत्र
  rationale: यह दास के विपरीत स्वतंत्र सामाजिक-कानूनी स्थिति का सीधा और गरिमापूर्ण आधुनिक हिन्दी रूप है।
- source_word: λέγει
  choice: पूछा
  rationale: यद्यपि शाब्दिक अर्थ ‘कहता है’ है, इसके बाद प्रत्यक्ष प्रश्न है, इसलिए हिन्दी में ‘पूछा’ अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
