translation:
  language: hi
  text: पर उसने उसकी बात पर विश्वास नहीं किया, बल्कि आदेश दिया कि उसे नंगा करके पीटा जाए। जब वह इन्हीं बातों पर अड़ा रहा, तो पेंतेफ्रीस ने कहा, “तो फिर उस युवक को लाया जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐπίστευσεν αὐτῷ
  choice: उसकी बात पर विश्वास नहीं किया
  rationale: यहाँ αὐτῷ व्यक्ति पर सामान्य विश्वास के बजाय उसके कथन को सच मानने के अर्थ में है; स्वाभाविक हिन्दी में इसे स्पष्ट किया गया है।
- source_word: γυμνὸν τύπτεσθαι
  choice: उसे नंगा करके पीटने
  rationale: ग्रीक में γυμνόν पीटे जाने वाले की निर्वस्त्र अवस्था बताता है; यह कठोरता बिना नरमी किए व्यक्त की गई है।
- source_word: Ἐπιμένοντος ... τούτοις τοῖς λόγοις
  choice: जब वह इन्हीं बातों पर अड़ा रहा
  rationale: ἐπιμένω यहाँ अपने कथन पर दृढ़ बने रहने का भाव देता है; ‘अड़ा रहा’ आधुनिक और सहज है तथा संदर्भ की तनातनी बनाए रखता है।
- source_word: Ἐναχθήτω
  choice: लाया जाए
  rationale: तृतीय पुरुष आज्ञार्थक निष्क्रिय रूप को हिन्दी के औपचारिक आज्ञार्थक निष्क्रिय प्रयोग से व्यक्त किया गया है।
- source_word: ὁ νεανίσκος
  choice: उस जवान
  rationale: νεανίσκος एक युवा पुरुष को सूचित करता है; ‘जवान’ सामान्य आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
