base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/003.yaml
  text: And Pentephris said to him, “From where, then, is this Hebrew boy?” And he said, “The Ishmaelites entrusted him to me until they return.”
translation:
  language: hi
  text: तब पेन्तेफ्रेस ने उससे कहा, “तो यह इब्रानी लड़का[a] कहाँ का है?” उसने कहा, “इश्माएलियों ने इसे मेरे पास तब तक के लिए सौंपा है, जब तक वे लौट न आएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक।” यूनानी शब्द दोनों अर्थ दे सकता है।
    reason: παῖς की वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Πεντεφρής
  choice: पेन्तेफ्रेस
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण रखा गया है; इसे किसी अधिक परिचित बाइबलीय नाम से समान मानकर नहीं बदला गया।
- source_word: Πόθεν ... ἐστιν
  choice: कहाँ का है
  rationale: यहाँ प्रश्न लड़के की उत्पत्ति या उसके आने के स्थान के बारे में है; आधुनिक हिन्दी में यह स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: παῖς
  choice: लड़का
  rationale: शब्द आयु-सूचक ‘लड़का’ और अधीनस्थ भूमिका-सूचक ‘सेवक’ दोनों अर्थ दे सकता है। मुख्य पाठ में प्रसंगानुकूल और अंग्रेज़ी परामर्श-पाठ के अनुरूप ‘लड़का’ रखा गया तथा अस्पष्टता पादटिप्पणी में बताई गई।
- source_word: παρέθεντό μοι
  choice: मेरे पास ... सौंपा है
  rationale: क्रिया किसी व्यक्ति को दूसरे की देखरेख या जिम्मेदारी में सौंपने का भाव देती है।
- source_word: ἕως ὅτου ἐπιστρέψωσιν
  choice: जब तक वे लौट न आएँ
  rationale: अनिश्चित भावी वापसी तक की अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
