  text: But the broker fell at his feet and begged, saying, “I beg you, lord, I do not know what you are saying.”
translation:
  language: hi
  text: पर वह दलाल उसके पैरों पर गिर पड़ा और विनती करते हुए बोला, “स्वामी, मैं आपसे विनती करता हूँ, मैं नहीं जानता कि आप क्या कह रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: दलाल
  rationale: यहाँ शब्द किसी मध्यस्थ व्यापारी या सौदा कराने वाले व्यक्ति को सूचित करता है; आधुनिक हिन्दी में ‘दलाल’ प्रसंग के अनुकूल और सहज है।
- source_word: κύριε
  choice: स्वामी
  rationale: यह सम्मानपूर्ण प्रत्यक्ष संबोधन है; ‘स्वामी’ सामाजिक अधीनता और विनय को बनाए रखता है, बिना इसे अनिवार्यतः ईश्वरीय उपाधि बनाने के।
- source_word: οὐκ οἶδα
  choice: मैं नहीं जानता
  rationale: यूनानी कथन का सीधा और स्वाभाविक हिन्दी रूप, जो वक्ता के दावे की अस्पष्टता या संभावित अस्वीकार को ज्यों का त्यों रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। यूनानी में ‘विनती’ के साथ कोई स्पष्ट कर्म नहीं है, इसलिए ‘उससे विनती की’ जैसा जोड़ा हुआ कर्म नहीं रखा गया। संबोधन में आदरसूचक ‘आप’ प्रयुक्त हुआ है।
