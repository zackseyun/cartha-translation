source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ εἰσαχθεὶς προσεκύνησα τῷ Πεντεφρῇ³⁵, τρίτος³⁶ γὰρ ἦν *ἐν ἀξιώματι παρὰ τῶν³⁷ Φαραὼ ⌜ἀρχόντων⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/005.yaml
  text: And when I was brought in, I bowed down to Pentephris, for he was third in rank among Pharaoh’s rulers.
translation:
  language: hi
  text: और जब मुझे भीतर लाया गया, तो मैंने पेन्तेफ्रिस को दण्डवत किया, क्योंकि वह फ़िरौन के अधिकारियों में पद की दृष्टि से तीसरे स्थान पर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσαχθείς
  choice: जब मुझे भीतर लाया गया
  rationale: ग्रीक के कर्मवाच्य कृदन्त का स्वाभाविक हिन्दी रूप; प्रसंग में किसी के सामने भीतर ले जाए जाने का भाव रखता है।
- source_word: προσεκύνησα
  choice: मैंने ... को दण्डवत किया
  rationale: यहाँ पदाधिकारी के सामने सम्मानपूर्वक झुकने का भाव है; ‘दण्डवत किया’ उस शारीरिक सम्मान-क्रिया को स्पष्ट रखता है, बिना इसे अनिवार्यतः उपासना मानने के।
- source_word: τῷ Πεντεφρῇ
  choice: पेन्तेफ्रिस को
  rationale: व्यक्तिनाम का यूनानी रूप हिन्दी लिपि में निकटता से प्रस्तुत किया गया है।
- source_word: τρίτος ... ἐν ἀξιώματι
  choice: पद की दृष्टि से तीसरे स्थान पर
  rationale: ‘ἀξίωμα’ यहाँ पद, प्रतिष्ठा या आधिकारिक दर्जे को सूचित करता है; यह अनुवाद क्रम और पद दोनों स्पष्ट करता है।
- source_word: παρὰ τῶν Φαραὼ ἀρχόντων
  choice: फ़िरौन के अधिकारियों में
  rationale: पाठ में फ़िरौन से संबद्ध शासकीय पदाधिकारियों के समूह के भीतर उसकी श्रेणी बताई गई है; ‘अधिकारियों’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
theological_decisions:
- issue: προσκυνέω का धार्मिक अथवा दरबारी अर्थ
  choice: दण्डवत किया
  alternative: आराधना की / प्रणाम किया
  rationale: मानवीय अधिकारी पेन्तेफ्रिस के सामने प्रसंग दरबारी सम्मान का है। ‘आराधना’ अनुचित धार्मिक अर्थ जोड़ती, जबकि केवल ‘प्रणाम’ मूल क्रिया की गहरी शारीरिक मुद्रा को कम कर सकता था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। वाक्य ने यूनानी कारण-सूचक संरचना तथा पेन्तेफ्रिस के पदक्रम को स्पष्ट रूप से सुरक्षित रखा है।
