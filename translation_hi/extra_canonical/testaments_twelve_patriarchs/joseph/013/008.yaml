  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/008.yaml
  text: But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”
translation:
  language: hi
  text: पर उसने कहा, “तुम उनके दास कैसे बने?” मैंने कहा, “उन्होंने मुझे कनान देश से खरीदा था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: यह यूनानी शब्द स्वामित्व के अधीन व्यक्ति को सूचित करता है; ‘दास’ प्रसंग की सामाजिक वास्तविकता को ‘सेवक’ से अधिक स्पष्टता से व्यक्त करता है।
- source_word: ἐκ γῆς Χαναὰν
  choice: कनान देश से
  rationale: ἐκ का मूल अर्थ ‘से’ है; यह वाक्यांश खरीद के स्थान अथवा उस भूभाग से लाए जाने का संकेत दे सकता है, इसलिए स्रोत की संक्षिप्त अस्पष्टता बनाए रखी गई है।
- source_word: ἐπριάσαντό με
  choice: उन्होंने मुझे ... खरीदा था
  rationale: क्रिया का अर्थ ‘उन्होंने मुझे खरीदा’ है; ‘था’ पूर्व घटित घटना को स्वाभाविक हिन्दी में दर्शाता है।
