  text: '*Ὁ δὲ εἶπε⁴⁷· Πῶς αὐτῶν ἐγένου⁴⁸ δοῦλος; καὶ⁴⁹ εἶπον· Ὅτι ἐκ γῆς⁵⁰ Χαναὰν ἐπριάσαντό⁵¹ με.'
