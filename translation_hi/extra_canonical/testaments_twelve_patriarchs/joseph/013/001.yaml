  text: But Pentephris, persuaded by her words, ordered the broker to come, and said to him, “What is this that I hear concerning you, that you steal souls from the land of Canaan and sell them as servants?”
translation:
  language: hi
  text: परन्तु पेनतेफ्रिस ने उसकी बातों पर विश्वास करके दलाल को आने की आज्ञा दी और उससे कहा, “यह क्या है जो मैं तुम्हारे विषय में सुन रहा हूँ—कि तुम कनान देश से लोगों को चुराते हो और उन्हें दास बनाकर बेचते हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρὶς
  choice: पेनतेफ्रिस
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: πεισθεὶς τοῖς λόγοις αὐτῆς
  choice: उसकी बातों पर विश्वास करके
  rationale: यह वाक्यांश उसके कथनों से सहमत अथवा आश्वस्त हो जाने को व्यक्त करता है; सहज हिन्दी में ‘विश्वास करके’ उपयुक्त है।
- source_word: μετάβολον
  choice: दलाल
  rationale: यहाँ व्यक्ति मनुष्यों की खरीद-बिक्री में बिचौलिए की भूमिका निभाता है; ‘दलाल’ आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: ψυχὰς
  choice: लोगों को
  rationale: शाब्दिक अर्थ ‘प्राण/आत्माएँ’ है, पर इस प्रसंग में जीवित मनुष्यों के लिए प्रयुक्त है; हिन्दी में ‘लोगों’ से आशय स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐκ γῆς Χαναάν
  choice: कनान देश से
  rationale: स्रोत की भौगोलिक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: εἰς παῖδας μεταπωλεῖς
  choice: उन्हें दास बनाकर बेचते हो
  rationale: παῖδας यहाँ घरेलू सेवकों अथवा दासों की स्थिति दर्शाता है और μεταπωλεῖς पुनर्विक्रय का भाव रखता है; हिन्दी वाक्यांश उस व्यापारिक और दासत्व-संबंधी आशय को स्पष्ट करता है।
