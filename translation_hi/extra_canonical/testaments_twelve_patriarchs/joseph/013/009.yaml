  text: पर उसने मुझसे कहा, “तुम सचमुच झूठ बोल रहे हो।” और तुरंत उसने मुझे भी निर्वस्त्र करके पिटवाने का आदेश दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὄντως
  choice: सचमुच
  rationale: यह क्रियाविशेषण आरोप की प्रबल पुष्टि करता है; ‘सचमुच’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ψεύδῃ
  choice: झूठ बोल रहे हो
  rationale: मध्यम/कर्मवाच्य रूप यहाँ अर्थ की दृष्टि से ‘तुम झूठ बोलते/बोल रहे हो’ है; प्रसंगगत प्रत्यक्ष आरोप के लिए अपूर्ण वर्तमान ‘बोल रहे हो’ स्वाभाविक है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह बिना विलम्ब के अगली कार्रवाई होने को व्यक्त करता है।
- source_word: κἀμὲ
  choice: मुझे भी
  rationale: καὶ ἐμέ के संक्षिप्त रूप में ‘भी’ का समावेश स्पष्ट रूप से उपस्थित है और उसे बनाए रखा गया है।
- source_word: γυμνὸν τύπτεσθαι
  choice: नंगा करके पीटने
  rationale: यूनानी में γυμνόν विधेयात्मक है और τύπτεσθαι कर्मवाच्य; हिन्दी में ‘नंगा करके पीटने’ दोनों क्रियाओं को स्वाभाविक रूप से व्यक्त करता है।
