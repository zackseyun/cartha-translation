  text: 'But Memphis said to her husband[a], “I hear that they are selling the young man.”


    2 So she immediately sent a eunuch to the Ishmaelites, asking that I be sold to her.

    3 But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.

    4 Then she sent another eunuch, saying, “Even if they ask two minas, pay it. Do not spare the gold. Only buy the boy and bring him to me.”

    5 So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”

    6 But I, knowing it, kept silent[b][c], so that'
translation:
  language: hi
  text: '## यूसुफ का वसीयतनामा 16


    **1** पर मेम्फिस ने अपने पति से कहा, “उस युवक को मोल ले लो, क्योंकि मैंने सुना है कि वे उसे बेच रहे हैं।”


    **2** तब उसने तुरन्त एक खोजे को इश्माएलियों के पास भेजा और मुझे खरीदने के लिए माँगा।


    **3** पर वह खोजा मुझे मोल लेना नहीं चाहता था। वह उनसे दाम-भाव पूछकर लौट गया और अपनी मालकिन को बताया कि वे उस लड़के का बहुत ऊँचा दाम माँग रहे हैं।


    **4** तब उसने एक और खोजे को यह कहकर भेजा, “यदि वे दो मीना[a] भी माँगें, तो दे देना। सोना खर्च करने में संकोच मत करना। बस उस लड़के को मोल लेकर मेरे पास ले आना।”


    **5** तब उस खोजे ने जाकर उन्हें सोने के अस्सी टुकड़े[b] दिए और मुझे अपने साथ ले लिया; पर उस मिस्री स्त्री से उसने कहा, “मैंने सौ दिए हैं।”


    **6** मैं यह जानता था, फिर भी चुप रहा, ताकि वह खोजा लज्जित न हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मीना प्राचीन काल में भार और धन की एक इकाई थी; यहाँ इसे किसी आधुनिक राशि में बदलने के बजाय यूनानी नाम के अनुसार रखा गया है।
    reason: cultural_note
  - marker: b
    text: यूनानी में शाब्दिक रूप से “सोने के अस्सी” और फिर “सौ” है। सटीक सिक्का या मूल्यवर्ग निर्दिष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεμφὶς
  choice: मेम्फिस
  rationale: यूनानी पाठ में यह स्त्री का व्यक्तिगत नाम है; इसलिए इसे नगर के सामान्य उल्लेख या किसी उपाधि के रूप में नहीं, नाम के रूप में लिप्यंतरित किया गया है।
- source_word: νεανίαν / παιδός / παῖδα
  choice: युवक / लड़का
  rationale: पद 1 में νεανίαν के लिए ‘युवक’ रखा गया है, जबकि पद 3–4 के παῖς-रूपों के लिए ‘लड़का’; इससे स्रोत की शब्द-विविधता और यूसुफ की युवा अवस्था दोनों बनी रहती हैं।
- source_word: εὐνοῦχος
  choice: खोजा
  rationale: यह शब्द प्रसंग में शाब्दिक रूप से बधिया पुरुष सेवक/अधिकारी को दर्शाता है। केवल ‘अधिकारी’ कहने से स्रोत का स्पष्ट सामाजिक पद मिट जाता।
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: कहलवाया कि वे मुझे उसके हाथ बेच दें
  rationale: वाक्यांश बिक्री की व्यवस्था कराने को दर्शाता है। हिन्दी रूप बिक्री और खरीदार के रूप में स्त्री की भूमिका को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: πειράσας
  choice: दाम-भाव पूछकर
  rationale: यहाँ अर्थ विक्रेताओं की शर्तें जाँचने या उन्हें टटोलने का है, न कि नैतिक परीक्षा अथवा प्रलोभन का। व्यापारिक प्रसंग में ‘दाम-भाव पूछकर’ अधिक स्वाभाविक है।
- source_word: δεσποίνῃ
  choice: मालकिन
  rationale: यह घरेलू अधिकार और सेवक के साथ उसके संबंध को व्यक्त करता है; ‘महिला’ या ‘स्त्री’ इस संबंध को पर्याप्त रूप से नहीं दिखाते।
- source_word: πολλὴν τιμὴν
  choice: बहुत ऊँचा दाम
  rationale: खरीद-बिक्री के प्रसंग में τιμή का अर्थ कीमत है; यह हिन्दी में सहज व्यापारिक अभिव्यक्ति है।
- source_word: μνᾶς
  choice: मीना
  rationale: प्राचीन भार और मुद्रा की इकाई को आधुनिक रकम में बदलने के बजाय उसके ऐतिहासिक नाम से रखा गया है।
- source_word: μὴ φείσασθε χρυσίου
  choice: सोना खर्च करने में संकोच मत करना
  rationale: यह निषेधात्मक आज्ञा सोना बचाने या रोक रखने से मना करती है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए आर्थिक बल बनाए रखता है।
- source_word: χρυσοῦς
  choice: सोने के सिक्के
  rationale: शब्द सोने की मौद्रिक इकाइयों की ओर संकेत करता है, पर सटीक मूल्यवर्ग नहीं बताता। ‘सिक्के’ पठनीय है और पाद-टिप्पणी अनिश्चितता स्पष्ट करती है।
- source_word: ἀνελάβετό με
  choice: मुझे अपने साथ ले लिया
  rationale: दास-विक्रय के बाद यूसुफ को अपने अधिकार में लेकर वहाँ से ले जाने का भाव प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ἐσιώπησα
  choice: चुप रहा
  rationale: यह यूसुफ की जानबूझकर बरती गई चुप्पी को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूसुफ की बिक्री से जुड़ी सामाजिक स्थिति
  choice: मोल लेने, बेचने, दाम देने और साथ ले जाने की स्पष्ट व्यापारिक भाषा रखी गई है।
  alternative: इसे केवल घरेलू सेवा में नियुक्ति या संरक्षण की भाषा में नरम करना।
  rationale: यूनानी पाठ खरीद-बिक्री और कीमत को प्रत्यक्ष रूप से प्रस्तुत करता है। अनुवाद इस बंधुआ स्थिति को न तो छिपाता है और न धर्मसैद्धान्तिक कारण से नरम करता है।
- issue: यूसुफ की चुप्पी का नैतिक अर्थ
  choice: पाठ के अनुसार केवल यह कहा गया है कि वह खोजा लज्जित न हो, इसलिए यूसुफ चुप रहा।
  alternative: चुप्पी को धोखे की स्वीकृति, क्षमा, या किसी विशेष सद्गुण का स्पष्ट उदाहरण घोषित करना।
  rationale: स्रोत केवल यूसुफ का ज्ञान, मौन और उद्देश्य बताता है; इससे आगे का नैतिक या धर्मवैचारिक निष्कर्ष अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। ‘खोजा’ ऐतिहासिक सामाजिक पद को सीधे व्यक्त करता है; व्यापारिक क्रियाओं को नरम नहीं किया गया। पद 1 में यूनानी की स्पष्ट आज्ञा ‘उस युवक को मोल ले लो’ को शामिल किया गया है, जो परामर्शी अंग्रेज़ी पाठ में छूट गई थी। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में अपने वास्तविक आधार-स्थल पर लगाए गए हैं।
