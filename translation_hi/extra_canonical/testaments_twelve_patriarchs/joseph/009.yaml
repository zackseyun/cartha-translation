base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009.yaml
  text: '1[a]. But when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and with a cheerful voice, rejoicing, I glorified my God because by a pretext I had been delivered from the Egyptian woman. Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.”


    2[b]. But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.


    3. But if one lives in self-control, and the Most High knows that glory also is fitting for him, he grants that too to him, as also to me.


    4. How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.


    5. For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned for my deception[c]. But the Lord guarded me from her schemes.'
translation:
  language: hi
  text: '1[a] जब मैं बेड़ियों में था, तब वह मिस्री स्त्री दुःख से व्याकुल रहती थी। वह आकर छिपकर सुनती थी कि मैं कैसे प्रभु को धन्यवाद देता और अन्धकार के घर में भजन गाता था; और आनन्दित होकर प्रसन्न स्वर में अपने परमेश्वर की महिमा करता था, क्योंकि एक बहाने के द्वारा मैं उस मिस्री स्त्री से छुड़ा लिया गया था। उसने कई बार मेरे पास यह सन्देश भेजा, “मेरी अभिलाषा पूरी करने के लिए मान जा; तब मैं तुझे बेड़ियों से खोल दूँगी और अन्धकार से छुड़ा दूँगी।”


    2[b] परन्तु मैं मन में भी उसकी ओर नहीं मुड़ा; क्योंकि परमेश्वर उस व्यक्ति से, जो भण्डारों में राजा होकर अनैतिकता के साथ विलास करता है, कहीं अधिक उससे प्रेम करता है जो अन्धकार के गड्ढे में भी आत्म-संयम में विश्वासयोग्य रहता है।


    3 परन्तु यदि कोई आत्म-संयम में जीवन बिताता है और परमप्रधान जानता है कि महिमा भी उसके लिए हितकर है, तो वह उसे यह भी प्रदान करता है, जैसा उसने मुझे भी दिया है।


    4 कितनी ही बार वह अस्वस्थ होते हुए भी असमय मेरे पास नीचे उतर आती और प्रार्थना करते समय मेरी आवाज़ सुनती थी; और मैं उसकी कराहों को समझकर चुप हो जाता था।


    5 क्योंकि जब मैं उसके घर में था, तब वह अपनी बाँहें और पिंडलियाँ[c] उघाड़ती थी, ताकि मैं उस पर गिर पड़ूँ। वह बहुत सुन्दर थी और मुझे छलने के लिए विशेष रूप से सजी-सँवरी हुई थी। परन्तु प्रभु ने मुझे उसकी चालों से बचाए रखा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अन्धकार का घर” सम्भवतः यूसुफ के बन्दीगृह को दर्शाता है; यूनानी पाठ सीधे “कारागार” कहने के बजाय अन्धकार की छवि को बनाए रखता है।
    reason: cultural_note
  - marker: b
    text: 'इस यूनानी वाक्य का पाठ कठिन है। उसका शाब्दिक विरोध लगभग ऐसा है: “अन्धकार के गड्ढे में आत्म-संयम में विश्वासयोग्य व्यक्ति” और “भण्डारों में राजा, जो अनैतिकता के साथ विलास करता है।”'
    reason: textual_variant
  - marker: c
    text: यहाँ अनूदित “पिंडलियाँ” वाला यूनानी शब्द विशेष रूप से टाँगों के निचले भाग या पिंडलियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηκροᾶτό
  choice: छिपकर सुनती थी
  rationale: क्रिया ध्यानपूर्वक या एक ओर से सुनने का भाव देती है; अपूर्ण काल के आवर्ती भाव को भी रखा गया है।
- source_word: ἐν οἴκῳ τοῦ σκότους / ἐκ τοῦ σκότους
  choice: अन्धकार के घर में / अन्धकार से
  rationale: मूल यूनानी स्पष्ट रूप से कारागार नहीं कहता, इसलिए अन्धकार की सजीव छवि सुरक्षित रखी गई है।
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: प्रसन्न स्वर में
  rationale: ἱλαρός का हर्षपूर्ण और प्रसन्न भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: एक बहाने के द्वारा ... छुड़ा लिया गया था
  rationale: πρόφασις के बहाने अथवा आवरण के भाव और ἀπηλλάγην के निष्क्रिय छुटकारे—दोनों को बनाए रखा गया है।
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: मेरी अभिलाषा पूरी करने के लिए मान जा
  rationale: यह सहमति माँगने वाली प्रलोभनपूर्ण आज्ञा है; हिन्दी में अर्थ स्पष्ट और संवाद स्वाभाविक रहता है।
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα
  choice: मैं मन में भी उसकी ओर नहीं मुड़ा
  rationale: वाक्य बाहरी इनकार के साथ भीतरी विचार की शुद्धता पर भी बल देता है।
- source_word: σωφροσύνη
  choice: आत्म-संयम
  rationale: सन्दर्भ में यौन शुद्धता प्रमुख है, पर यूनानी सद्गुण का अर्थ उससे व्यापक है; आत्म-संयम इस विस्तार को बचाता है।
- source_word: ἐν λάκκῳ σκότους
  choice: अन्धकार के गड्ढे में
  rationale: λάκκος की ठोस गड्ढे वाली छवि को 'कालकोठरी' बनाकर व्याख्यायित नहीं किया गया।
- source_word: ἐν ταμείοις βασιλέα τρυφῶντα μετ’ ἀκολασίας
  choice: राजसी वैभव के भण्डारों में रहकर अनैतिकता के साथ विलास करता है
  rationale: पाठ कठिन है; अनुवाद भण्डारों, राजसी स्थिति, विलास और नैतिक उच्छृंखलता के विरोधी बिम्बों को पठनीय हिन्दी में रखता है।
- source_word: συμφέρει
  choice: हितकर है
  rationale: शब्द का मूल भाव लाभकारी या कल्याणकारी होना है; इसे केवल योग्यता या उपयुक्तता तक सीमित नहीं किया गया।
- source_word: ἐν ἀωρίᾳ
  choice: असमय
  rationale: अनुचित या असुविधाजनक समय का भाव संक्षेप और स्वाभाविक रूप में आता है।
- source_word: τοὺς στεναγμούς
  choice: कराहों
  rationale: यह 'आहों' से भारी शब्द है और दुःख, अस्वस्थता अथवा कामना से उपजी ध्वनि की अस्पष्टता को बनाए रखता है।
- source_word: τὰς κνήμας
  choice: पिंडलियाँ
  rationale: κνήμη सामान्य 'टाँगों' की अपेक्षा निचले पैर अथवा पिंडली को अधिक ठीक रूप से दर्शाता है।
- source_word: ἵνα συμπέσω εἰς αὐτήν
  choice: ताकि मैं उसके वश में पड़ जाऊँ
  rationale: शाब्दिक 'उसमें गिर पड़ूँ' हिन्दी में अस्वाभाविक और भ्रामक होता; यह प्रलोभन के आगे गिरने का प्रसंगगत आशय रखता है।
theological_decisions:
- issue: यूसुफ के छुटकारे और सुरक्षा में ईश्वरीय कार्य
  choice: परमेश्वर के प्रेम और प्रभु की रक्षा को स्पष्ट रखा गया
  alternative: घटना को केवल यूसुफ की नैतिक दृढ़ता या सामान्य दैवी विधान के रूप में कहना
  rationale: यूनानी पाठ आत्म-संयम के साथ परमेश्वर के प्रेम और प्रभु की सक्रिय सुरक्षा दोनों को प्रत्यक्ष रूप से व्यक्त करता है।
- issue: σωφροσύνη का धार्मिक-नैतिक अर्थ
  choice: आत्म-संयम
  alternative: ब्रह्मचर्य; शुद्धता; संयमशीलता
  rationale: प्रसंग इसे विशेषतः यौन प्रलोभन के प्रतिरोध पर लागू करता है, फिर भी मूल सद्गुण का अर्थ व्यापक है।
- issue: परमप्रधान द्वारा महिमा देना
  choice: यदि वह जानता है कि महिमा हितकर है, तो वह उसे प्रदान करता है
  alternative: यदि व्यक्ति महिमा के योग्य है, तो परमेश्वर उसे देता है
  rationale: συμφέρει को पात्रता में बदलने से बचते हुए लाभ अथवा कल्याण की मूल अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ गद्य अपनाया गया है। 'प्रभु', 'परमेश्वर' और 'परमप्रधान' जैसे पारम्परिक धार्मिक पद बनाए गए हैं; कठिन यूनानी बिम्बों को मिटाए बिना वाक्य-विन्यास स्वाभाविक किया गया है।
