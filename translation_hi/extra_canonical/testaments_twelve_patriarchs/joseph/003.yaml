  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003.yaml
  text: '1[a]. In a short time she would withdraw, to test the purpose of my soul. In ten temptations she proved me approved, and in them all I was patient; for patience is a great remedy.


    2. How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments[b], she called me back, and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”


    3. But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.


    4. And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; for those who fast for God''s sake receive grace of face.


    5. And if my master was away, I drank no wine; and every third day I would take my food, and I would give it to the poor and the sick.


    6. And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.


    7. And because she had no male child[d][c], she pretended'
translation:
  language: hi
  text: '1. दस परीक्षाओं में उसने मुझे परखकर खरा सिद्ध किया। उन सब में मैंने धीरज रखा, क्योंकि सहनशीलता बड़ी औषधि है और धीरज बहुत-सी भलाई देता है।


    2. उस मिस्री स्त्री ने कितनी ही बार मुझे जान से मार डालने की धमकी दी! कितनी ही बार उसने मुझे दण्ड भुगतने के लिए सौंप दिया, फिर मुझे वापस बुला लिया[a]; और जब मैं उसके साथ संबंध बनाने को तैयार नहीं हुआ, तो उसने मुझसे कहा, “यदि तुम अपने आप को मुझे सौंप दो, तो मुझ पर और मेरे घर के सब लोगों पर तुम्हारा अधिकार होगा, और तुम हमारे स्वामी होगे।”


    3. परन्तु मैं अपने पिता की बातें स्मरण करता था और अपने भीतरी कमरे में जाकर रोते हुए प्रभु से प्रार्थना करता था।


    4. उन सात वर्षों में मैं उपवास करता रहा, फिर भी उस मिस्री पुरुष[b] को ऐसा दिखाई देता था मानो मैं सुख-विलास में जी रहा हूँ; क्योंकि जो परमेश्वर के लिए उपवास करते हैं, वे मुख की शोभा पाते हैं।


    5. जब मेरा स्वामी बाहर गया होता, तब मैं दाखमधु नहीं पीता था। मैं हर तीसरे दिन भोजन लेता[c] और उसे निर्धनों और रोगियों को दे देता था।


    6. मैं भोर को उठकर प्रभु की ओर जाता और उस मिस्री स्त्री मेम्फिस[d] के विषय में रोता था, क्योंकि वह मुझे लगातार बहुत सताती थी। वह रात को भी मुझसे भेंट करने के बहाने मेरे पास आ जाती थी।


    7. और क्योंकि उसके कोई पुत्र नहीं था, इसलिए वह दिखावा करती थी…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-साक्षियों में यहाँ “और उसने मुझे धमकी दी” शब्द भी हैं।
    reason: textual_variant
  - marker: b
    text: यूनानी में यहाँ पुल्लिंग एकवचन “मिस्री” है; इससे सम्भवतः यूसुफ का मिस्री स्वामी अभिप्रेत है।
    reason: alternative_reading
  - marker: c
    text: इस पदबंध का अर्थ “तीन दिन के बाद” या तीन दिन का उपवास पूरा करके भोजन लेना भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: इस यूनानी पाठ-साक्षी में मिस्री स्त्री का नाम “मेम्फिस” दिया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: δόκιμον ἀπέδειξέ με
  choice: मुझे परखकर खरा सिद्ध किया
  rationale: δόκιμος का अर्थ परीक्षा में खरा या प्रमाणित पाया जाना है; हिन्दी में ‘खरा सिद्ध किया’ परीक्षण और स्वीकृतता दोनों को बनाए रखता है।
- source_word: μακροθυμία / ἐμακροθύμησα
  choice: सहनशीलता / मैंने धीरज रखा
  rationale: यह उकसावे और कष्ट के बीच संयमित, दीर्घ धैर्य को व्यक्त करता है; प्रसंगानुसार स्वाभाविक हिन्दी के लिए दो निकटवर्ती रूप प्रयुक्त हैं।
- source_word: ὑπομονή
  choice: धीरज
  rationale: यह कठिनाई के नीचे टिके रहने की दृढ़ता को सूचित करता है और μακροθυμία से निकटता रखते हुए भी अलग छाया बनाए रखता है।
- source_word: φάρμακον
  choice: औषधि
  rationale: मूल का उपचारात्मक रूपक सीधे और गरिमापूर्ण ढंग से सुरक्षित रहता है।
- source_word: συνελθεῖν αὐτῇ
  choice: उसके साथ संबंध बनाने
  rationale: यह यौन संबंध के लिए शिष्टोक्ति है; हिन्दी पदबंध आशय स्पष्ट करता है, पर अनावश्यक रूप से अशिष्ट नहीं होता।
- source_word: κυριεύσεις
  choice: तुम्हारा अधिकार होगा
  rationale: स्त्री द्वारा प्रस्तावित प्रभुत्व और घरेलू सत्ता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπιδῷς ἑαυτόν
  choice: अपने आप को मुझे सौंप दो
  rationale: यौन समर्पण और प्रलोभन की भाषा को बिना विस्तार के सुरक्षित रखता है।
- source_word: ταμεῖον
  choice: भीतरी कमरा
  rationale: प्रार्थना के लिए एकान्त निजी कक्ष का अर्थ देता है; ‘भण्डार’ इस प्रसंग में भ्रामक हो सकता था।
- source_word: τῷ Αἰγυπτίῳ
  choice: उस मिस्री पुरुष को
  rationale: विशेषण पुल्लिंग एकवचन है; अनुवाद लिंग स्पष्ट करता है, पर उसे बिना आधार सीधे स्वामी नहीं बनाता।
- source_word: ἐν τρυφῇ διάγων
  choice: सुख-विलास में जी रहा हूँ
  rationale: उपवास के बावजूद समृद्ध और आरामपूर्ण दिखने की विडम्बना को व्यक्त करता है।
- source_word: τοῦ προσώπου τὴν χάριν
  choice: उनके मुख पर अनुग्रह दिखाई देता है
  rationale: मूल की ठोस मुख-संबंधी छवि और θεολογिक ‘अनुग्रह’ दोनों को स्वाभाविक हिन्दी वाक्य में रखा गया है।
- source_word: τριημερίζων
  choice: हर तीसरे दिन
  rationale: क्रिया तीन-दिवसीय उपवास-लय का संकेत देती है; सटीक काल-अंतराल अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: λόγῳ ἐπισκέψεως
  choice: भेंट करने के बहाने
  rationale: λόγῳ यहाँ घोषित कारण या बहाने को दर्शाता है; हिन्दी में छलपूर्ण उद्देश्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: προσεποιεῖτο
  choice: वह बहाना करती थी
  rationale: क्रिया दिखावा या ढोंग करने को व्यक्त करती है। स्रोत अंश यहीं अधूरा रुकता है, इसलिए पूरक कथन नहीं जोड़ा गया।
theological_decisions:
- issue: प्रार्थना के प्रसंग में κύριος
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ प्रार्थना का संबोधन परमेश्वर की ओर है; ‘प्रभु’ उपयुक्त धार्मिक अर्थ रखता है, जबकि गृहस्वामी के लिए अलग से ‘स्वामी’ प्रयुक्त है।
- issue: उपवास और मुख के अनुग्रह का कथन
  choice: जो परमेश्वर के लिए उपवास करते हैं, उनके मुख पर अनुग्रह दिखाई देता है
  alternative: जो परमेश्वर के कारण उपवास करते हैं, वे मुख की शोभा पाते हैं
  rationale: अनुवाद पाठ के इस दावे को न तो केवल शारीरिक सौन्दर्य बनाता है, न उसका आध्यात्मिकीकरण करके दृश्य मुख-संबंधी भाषा मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। यौन प्रसंग में शिष्टोक्तिपूर्ण स्पष्टता रखी गई है। स्रोत का आरम्भ पूर्ववर्ती खण्ड की निरन्तरता है और उपलब्ध यूनानी अंश का अन्त προσεποιεῖτο पर अधूरा है; इसलिए अन्त में दीर्घविराम लगाया गया और कोई अनुमानित पूर्ति नहीं जोड़ी गई।
