  text: '3[a]. And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant. 4. And when we had come into Egypt, they disputed concerning me, as to who would deceive the merchant and receive money for me. 5. So it seemed good to all of them to leave me in Egypt with the merchant of their trade until they should return bringing merchandise[b]. 6. But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me. 7. And God blessed him in my hands, and increased him on my account in gold and silver and work. 8. And I was with him three months.


    1. Now at that time the wife of Pentephri came down to Memphis with great display, because she had heard about me from her eunuchs. 2. And she said to her husband, “The merchant has grown rich by the hands of a certain young Hebrew; and they say that he was stolen away by theft from the land of Canaan. 3. Now therefore execute judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you[c], because grace from heaven is upon him.”'
translation:
  language: hi
  text: '**यूसुफ का वसीयतनामा 11:3–8; 12:1–3**


    **11:3** तब उनमें जो प्रधान था, उसने मुझसे कहा, “तुम दास नहीं हो, क्योंकि तुम्हारा रूप भी यह साफ़ बता रहा है।” पर मैंने उनसे स्पष्ट कहा कि मैं उनका दास हूँ। **4** जब हम मिस्र पहुँचे, तो वे मेरे विषय में इस बात पर झगड़ने लगे कि कौन मुझे सौंपकर सोना पाएगा।[a] **5** तब उन सबको यह ठीक लगा कि वे मुझे मिस्र में उनके व्यापार के उस व्यापारी के पास छोड़ दें, जब तक वे माल लेकर लौट न आएँ। **6** पर प्रभु ने उस व्यापारी की दृष्टि में मुझ पर कृपा की, और उसने अपना घर मेरे भरोसे सौंप दिया। **7** परमेश्वर ने मेरे हाथों उसे आशीष दी और सोने, चाँदी और काम-धंधे में उसकी समृद्धि बढ़ाई।[b] **8** मैं उसके साथ तीन महीने रहा।


    **12:1** उसी समय पेंतेफ्री[c] की पत्नी बड़े ठाठ-बाट के साथ मेम्फिस आई,[d] क्योंकि उसने अपने खोजों से मेरे बारे में सुना था। **2** उसने अपने पति से कहा, “एक इब्रानी युवक के हाथों वह व्यापारी धनी हो गया है। लोग कहते हैं कि उस युवक को कनान देश से चोरी करके चुरा लिया गया था। **3** इसलिए अब उसके विषय में न्याय करो, उस युवक को लेकर हमारे घर आओ; तब इब्रानियों का परमेश्वर तुम्हें आशीष देगा, क्योंकि स्वर्ग की कृपा उस पर है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का यूनानी वाक्य पाठ की दृष्टि से कठिन और संभवतः संक्षिप्त या विकृत है। “मुझे सौंपकर” का अर्थ “मुझे धोखे से सौंपकर” भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: अंतिम यूनानी शब्द का अर्थ यहाँ अनिश्चित है; इसका अनुवाद “काम,” “उपज” या “व्यापार” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “पेंतेफ्री” मिस्री नाम का यूनानी रूप है। उत्पत्ति की परंपरा में इसे प्रायः पोतीपर अथवा उसके घराने से जोड़ा जाता है।
    reason: cross_reference
  - marker: d
    text: यहाँ यूनानी पाठ अनिश्चित है। संबंधित पद का अर्थ संभवतः यह है कि वह किसी ढकी हुई सवारी में, बड़े वैभव के साथ आई।
    reason: textual_variant
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: यूसुफ की खरीदी-बेची गई और स्वामित्वाधीन स्थिति को स्पष्ट रखने के लिए ‘सेवक’ की अपेक्षा ‘दास’ अधिक सटीक है।
- source_word: ἡ ὄψις σου δηλοῖ
  choice: तुम्हारा रूप भी यह साफ़ बता रहा है
  rationale: यह रूप-रंग और बाहरी व्यक्तित्व से लगाए गए निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τίς προδοὺς χρυσίον λάβῃ με
  choice: कौन सोना देकर मुझे लेगा
  rationale: वाक्य का यूनानी पाठ कठिन है। यह अनुवाद προδούς के ‘पहले देना/सौंपना’ और χρυσίον तथा λάβῃ के प्रत्यक्ष अर्थ को यथासंभव सुरक्षित रखता है; वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: μετάβολος
  choice: व्यापारी
  rationale: कथा में यह व्यक्ति माल और व्यक्तियों के लेन-देन से जुड़ा वाणिज्यिक मध्यस्थ है; ‘व्यापारी’ सहज और पर्याप्त व्यापक है।
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: उसने अपना घर मेरे भरोसे सौंप दिया
  rationale: मुहावरे का आशय पूरे घराने की देखरेख सौंपना है; हिन्दी वाक्य विश्वास और प्रबंधकीय दायित्व दोनों को व्यक्त करता है।
- source_word: ἐν χειρί μου
  choice: मेरे हाथों
  rationale: यह स्रोत का बाइबिलीय अभिकरण-सूचक मुहावरा बनाए रखता है और बताता है कि समृद्धि यूसुफ के प्रबंध के माध्यम से आई।
- source_word: ἔργῳ
  choice: काम-धंधे
  rationale: शब्द केवल शारीरिक काम नहीं, उत्पादक गतिविधि या व्यवसाय भी सूचित कर सकता है; ‘काम-धंधे’ इस व्यापकता को पठनीय हिन्दी में रखता है।
- source_word: μετὰ δόξης πολλῆς
  choice: बड़े ठाठ-बाट के साथ
  rationale: यहाँ δόξα बाहरी वैभव और प्रदर्शन को सूचित करता है, न कि धर्मशास्त्रीय ‘महिमा’ को।
- source_word: εὐνοῦχοι
  choice: खोजे
  rationale: यूनानी शब्द का ऐतिहासिक-सामाजिक अर्थ सीधे रखा गया है; इसे सामान्य ‘अधिकारी’ कहने से स्रोत की विशिष्टता मिट जाती।
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: उसके विषय में न्यायिक जाँच कराओ
  rationale: शाब्दिक ‘उसके साथ न्याय करो’ हिन्दी में अस्पष्ट है। प्रसंग में औपचारिक जाँच या निर्णय की माँग है, जिसे यह वाक्य बिना परिणाम तय किए व्यक्त करता है।
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: स्वर्ग की कृपा उस पर है
  rationale: यह दैवी अनुग्रह के यूसुफ पर स्थित होने की बात को सहज हिन्दी में रखता है।
theological_decisions:
- issue: κύριος और θεός का निकटवर्ती पदों में भेद
  choice: 11:6 में ‘प्रभु’ और 11:7 में ‘परमेश्वर’
  alternative: दोनों स्थानों पर ‘परमेश्वर’ करके सामंजस्य बैठाना
  rationale: यूनानी पाठ क्रमशः ὁ Κύριος और ὁ Θεός कहता है; स्रोत का यह अंतर बनाए रखा गया है।
- issue: इब्रानियों के परमेश्वर की आशीष का कथन
  choice: “इब्रानियों का परमेश्वर तुम्हें आशीष देगा”
  alternative: इसे कथाकार की निश्चित धर्मशास्त्रीय घोषणा मानकर और अधिक बल देना
  rationale: यह पेंतेफ्री की पत्नी का कथन है। अनुवाद वक्ता के दावे को उसी रूप में रखता है, उसकी विश्वसनीयता या धर्मशास्त्रीय समझ पर अतिरिक्त निर्णय नहीं देता।
- issue: उत्पत्ति 39 के साथ कथात्मक संबंध
  choice: उपलब्ध यूनानी कथा और उसके नाम-रूपों का अनुसरण
  alternative: नाम और घटनाक्रम को उत्पत्ति के परिचित हिन्दी पाठ के अनुरूप बदलना
  rationale: मूल-पाठ की प्रधानता के कारण पेंतेफ्री और व्यापारी संबंधी इस ग्रंथ की विशिष्ट कथा को उत्पत्ति से चुपचाप समरूप नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘दास,’ ‘प्रभु,’ ‘परमेश्वर’ और ‘मेरे हाथों’ जैसे बाइबिलीय पद स्रोत की सामाजिक तथा धार्मिक बनावट बनाए रखते हैं; कठिन यूनानी स्थानों को मुख्य पाठ में अनावश्यक रूप से कठोर न बनाकर पादटिप्पणियों में उनकी अनिश्चितता स्पष्ट की गई है।
