  text: '9[a]. And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I recognized her deceit and her delusion.

    10. And I spoke to her words of the Most High, to see whether perhaps she might turn back from her evil desire.

    11. So then, many times[b], as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.

    12. For she openly extolled me as chaste with respect to the bed, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded concerning your purity, and even if someone should tell him about us, he will not believe it.”

    13. In all these things I, lying low on the ground, kept begging the God of my fathers that he would rescue me from her deceit.

    14. Since she accomplished nothing in this way, again she began to come to me with words of instruction, wanting to learn the word of God.

    15. And she says to me, “If you want me to leave behind the idols, I will persuade my husband to withdraw from them, and we will go before your Lord, walking in the law of your Lord.”

    16. But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”

    17. But she kept contending, wanting to fulfill her desire.

    18. And I added fasting and prayer[d][c], so that the Lord might rescue me from her.'
translation:
  language: hi
  text: '9. जब मैं उसकी मंशा समझ गया, तो मृत्यु तक शोकित हुआ। पर उसके बाहर चले जाने के बाद मैं अपने आप में आया[a] और बहुत दिनों तक उसके लिए विलाप करता रहा, क्योंकि मैं उसके छल और उसके भ्रम को पहचान गया था।


    10. मैं उससे परमप्रधान की बातें कहता था कि शायद वह अपनी बुरी अभिलाषा से फिर जाए।


    11. इसलिए वह बहुत बार बातों से मेरी चापलूसी करती, मानो मैं कोई पवित्र पुरुष हूँ। वह अपने पति के सामने छल से मेरे संयम की प्रशंसा करती थी, क्योंकि वह अकेले में मुझे गिराना चाहती थी।


    12. वह सबके सामने मुझे शय्या के विषय में संयमी बताकर मेरी बड़ाई करती थी, पर एकांत में मुझसे कहती, “मेरे पति से मत डरो। उसे तुम्हारे संयम पर पूरा विश्वास है; इसलिए यदि कोई उससे हमारे विषय में कुछ कहे भी, तो वह विश्वास नहीं करेगा।”


    13. इन सब बातों के बीच मैं भूमि पर लेटकर परमेश्वर से निरंतर विनती करता रहा कि वह मुझे उसके छल से बचाए।[b]


    14. जब इस उपाय से उसका कुछ न चला, तो वह फिर शिक्षा की बातें लेकर मेरे पास आने लगी और परमेश्वर का वचन सीखना चाहती थी।


    15. उसने मुझसे कहा, “यदि तुम चाहते हो कि मैं मूर्तियों को त्याग दूँ, तो मेरे साथ संबंध बनाओ। मैं अपने पति को भी मूर्तियों से दूर होने के लिए मना लूँगी, और हम तुम्हारे प्रभु के सामने चलेंगे।”[c]


    16. पर मैंने उससे कहा, “प्रभु यह नहीं चाहता कि उसकी आराधना करनेवाले अशुद्धता में रहें। वह व्यभिचार करनेवालों से प्रसन्न नहीं होता, बल्कि उनसे प्रसन्न होता है जो शुद्ध हृदय और निष्कलंक होंठों से उसके निकट आते हैं।”


    17. फिर भी वह अपनी अभिलाषा पूरी करने की चाह में मुझसे बहस करती रही।


    18. पर मैं उपवास और प्रार्थना बढ़ाता रहा, ताकि प्रभु मुझे उससे बचाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं होश में आया।”
    reason: lexical_alternative
  - marker: b
    text: कुछ पाठ-परंपराओं में “परमेश्वर” के स्थान पर विस्तृत रूप “मेरे पूर्वजों का परमेश्वर” मिलता है। प्रस्तुत यूनानी पाठ में केवल “परमेश्वर” है।
    reason: textual_variant
  - marker: c
    text: “तुम्हारे प्रभु के सामने” के पास यूनानी पाठ संदिग्ध चिह्नित है। कुछ पाठ-परंपराओं में इसके बाद “तुम्हारे प्रभु की व्यवस्था पर चलते हुए” जैसा विस्तृत वाक्य मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  choice: मृत्यु तक शोकित हुआ
  rationale: यूनानी मुहावरे की तीव्रता और गरिमापूर्ण शैली को बनाए रखता है।
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: मैं अपने आप में आया
  rationale: मूल मुहावरे को दृश्यमान रखता है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: δόλος / πλάνη
  choice: छल / भ्रम
  rationale: 'दोनों नैतिक शब्दों का भेद रखता है: पहला कपटपूर्ण चाल और दूसरा भटकानेवाले भ्रम को सूचित करता है।'
- source_word: ῥήματα ὑψίστου
  choice: परमप्रधान की बातें
  rationale: संबंधकारक को परमप्रधान से निकली या उसकी कही हुई बातों के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπιθυμία τῆς πονηρᾶς
  choice: बुरी अभिलाषा
  rationale: संदर्भ की यौन और नैतिक नकारात्मकता को विशेषण के माध्यम से व्यक्त करता है, बिना मूल से अधिक स्पष्ट किए।
- source_word: σωφροσύνη / σώφρονα
  choice: संयम / संयमी
  rationale: यह व्यापक सद्गुण-सूचक शब्द है, जिसमें प्रसंगानुसार यौन आत्म-संयम भी सम्मिलित है।
- source_word: ὑποσκελίσαι
  choice: गिराना
  rationale: नैतिक पतन कराने के मूल रूपक को सहज हिन्दी में सुरक्षित रखता है।
- source_word: χαμοκοιτῶν
  choice: भूमि पर लेटकर
  rationale: दुर्लभ शब्द में निहित भूमि पर निम्न आसन या लेटने की शारीरिक मुद्रा को व्यक्त करता है, किंतु मुख के बल होने जैसी अनिश्चित बात नहीं जोड़ता।
- source_word: λόγῳ κατηχήσεως
  choice: शिक्षा पाने के बहाने
  rationale: प्रसंग में स्त्री का शिक्षार्थी बनकर आना छलपूर्ण है; हिन्दी पदबंध इस कार्यगत अर्थ को सहजता से देता है और बाद की कलीसियाई पारिभाषिकता से बचता है।
- source_word: συγγενοῦς μου
  choice: मेरे साथ संबंध बनाओ
  rationale: यहाँ क्रिया प्रसंगानुसार यौन संबंध की माँग करती है; अस्पष्ट हिन्दी 'मिलो' की अपेक्षा अर्थ को स्पष्ट करती है।
- source_word: προσετιθέμην νηστείαν καὶ προσευχήν
  choice: उपवास और प्रार्थना और भी अधिक करने लगा
  rationale: प्रक्रियात्मक अपूर्णकाल और 'बढ़ाने/जोड़ने' के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पद 13 में प्रार्थना के संबोधन की पाठ-परंपरा
  choice: परमेश्वर
  alternative: मेरे पूर्वजों का परमेश्वर
  rationale: प्रस्तुत यूनानी मुख्य पाठ में τοῦ Θεοῦ, अर्थात केवल 'परमेश्वर', है। विस्तृत कुलपितृ-संबंधी पाठ को मुख्य पाठ में नहीं जोड़ा गया; उसे पादटिप्पणी में दर्ज किया गया है।
- issue: पद 15 में Κυρίου σου का रूप
  choice: तुम्हारे प्रभु
  alternative: प्रभु / तुम्हारे परमेश्वर
  rationale: यूनानी में द्वितीय पुरुष संबंधवाचक सर्वनाम स्पष्ट है; उसे प्रचलित धार्मिक वाक्यांश के अनुरूप बदलकर समतल नहीं किया गया।
- issue: पद 16 में प्रभु की प्रसन्नता
  choice: वह व्यभिचार करनेवालों से प्रसन्न नहीं होता, बल्कि उनसे प्रसन्न होता है...
  alternative: वह व्यभिचारियों को स्वीकार नहीं करता
  rationale: εὐδοκεῖ के प्रसन्न होने/कृपा-दृष्टि रखने के भाव को रखा गया है और इसे किसी विशिष्ट उद्धार-सिद्धांत की शब्दावली में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। संबोधन और नैतिक शब्दावली को औपचारिक रखा गया, जबकि छलपूर्ण संवाद को स्वाभाविक प्रत्यक्ष कथन में व्यक्त किया गया है। प्रस्तुत यूनानी मुख्य पाठ को प्राथमिकता दी गई है; अंग्रेज़ी परामर्श-पाठ के विस्तृत या पुनर्स्थापित पाठों को बिना प्रमाण मुख्य पाठ में नहीं जोड़ा गया।
