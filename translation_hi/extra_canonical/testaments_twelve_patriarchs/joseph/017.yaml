base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017.yaml
  text: 1[a]. See then, my children, how much I endured so that I might not put my brothers to shame. 2. You also, therefore, love one another, and with patience conceal one another’s shortcomings. 3. For God delights in the harmony of brothers and in the purpose of a good heart that intends what is good. 4[b]. And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them. 5. And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure. 6. And I did not allow them to be distressed even in the smallest matter; rather, everything that was in my hand I gave to them. 7. And their sons were my sons, and my sons were as servants to them, and their soul was my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose. 8. And I did not exalt myself among them in arrogance because of my worldly glory[c],
    but I was among them as one of the least.
translation:
  language: hi
  text: '1. इसलिए, मेरे बच्चो, देखो कि मैंने कितना कुछ सहा, ताकि मैं अपने भाइयों को लज्जित न करूँ।


    2. इसलिए तुम भी एक-दूसरे से प्रेम करो और धीरज के साथ एक-दूसरे की कमियों को ढाँप दो।[a]


    3. क्योंकि परमेश्वर भाइयों की एकता से और ऐसे भले मन के संकल्प से प्रसन्न होता है जो भलाई चाहता है।[b]


    4. जब मेरे भाई मिस्र आए, तो वे स्वयं जानते हैं कि मैंने उनका रुपया उन्हें लौटा दिया; मैंने उन्हें उलाहना नहीं दिया, बल्कि उन्हें ढाढ़स बँधाया।


    5. और मेरे पिता याकूब की मृत्यु के बाद मैंने उनसे और भी अधिक प्रेम किया; वे जो कुछ चाहते थे, वह मैं उनके लिए सीमा से बढ़कर करता था।


    6. मैंने उन्हें छोटी-से-छोटी बात में भी दुःखी न होने दिया; बल्कि जो कुछ मेरे हाथ में था, वह सब मैंने उन्हें दे दिया।


    7. उनके बेटे मेरे बेटे थे, और मेरे बेटे उनके दासों के समान थे;[c] उनकी आत्मा मेरी आत्मा थी, उनका हर दर्द मेरा दर्द था, उनकी हर दुर्बलता मेरी बीमारी थी, और उनका विचार मेरा विचार था।


    8. अपनी सांसारिक प्रतिष्ठा के कारण मैंने उनके बीच घमंड से अपने आपको ऊँचा नहीं किया, बल्कि मैं उनके बीच सबसे छोटों में से एक के समान रहा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘एक-दूसरे की विफलताओं को छिपाए रखो’ भी हो सकता है। यूनानी क्रिया का आशय भाई की कमियों को कठोरता से उजागर न करना है।
    reason: lexical_alternative
  - marker: b
    text: ‘भले मन के संकल्प’ वाला वाक्यांश उपलब्ध यूनानी पाठ में व्याकरण और पाठ की दृष्टि से कठिन है। यहाँ उस स्पष्ट नैतिक भाव का अनुवाद किया गया है जिसमें मन भलाई की ओर उन्मुख है।
    reason: textual_variant
  - marker: c
    text: ‘दासों’ के लिए यूनानी शब्द douloi है। यह जान-बूझकर रखा गया प्रबल शब्द है, जो यूसुफ की विनम्रता और अपने घराने को भाइयों के अधीन मानने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχύνω
  choice: लज्जित करना
  rationale: क्रिया किसी को लज्जा या सार्वजनिक अपमान में डालने का भाव रखती है; यह रूप यूसुफ के संयम और पारिवारिक संबंध दोनों को स्पष्ट रखता है।
- source_word: μακροθυμίᾳ
  choice: धीरज के साथ
  rationale: यह दूसरों के प्रति सहनशील और दीर्घकालीन संयम को व्यक्त करता है; आधुनिक हिन्दी में ‘धीरज’ स्वाभाविक और गरिमापूर्ण है।
- source_word: συγκρύπτετε
  choice: ढाँप दो
  rationale: यह एक-दूसरे की कमियों को कठोरता से उजागर न करने का भाव देता है। ‘ढाँपना’ दया और भाईचारे का भाव रखता है, पर कमी के अस्तित्व को नकारता नहीं।
- source_word: ἐλαττώματα
  choice: कमियाँ
  rationale: नैतिक उपदेश के प्रसंग में यह सहज हिन्दी है और ‘दोष’ की अपेक्षा मूल के अपेक्षाकृत व्यापक भाव को बनाए रखती है।
- source_word: ὁμονοίᾳ
  choice: एकता
  rationale: शब्द समान मन और मेल को सूचित करता है; ‘भाइयों की एकता’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: προαιρέσει καρδίας
  choice: मन का संकल्प
  rationale: पद जान-बूझकर अपनाई गई भीतरी नैतिक प्रवृत्ति या अभिप्राय को व्यक्त करता है।
- source_word: παρεκάλεσα
  choice: ढाढ़स बँधाया
  rationale: इस मेल-मिलाप के प्रसंग में क्रिया का सांत्वना और आश्वासन देने वाला अर्थ अधिक उपयुक्त है, यद्यपि इसका अर्थ ‘प्रोत्साहित किया’ भी हो सकता है।
- source_word: ὑπερεκπερισσοῦ
  choice: भरपूर से भी बढ़कर
  rationale: तीव्रतासूचक क्रियाविशेषण असाधारण और अत्यधिक उदारता पर बल देता है; चुना हुआ रूप यह अतिरेक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δοῦλοι
  choice: दासों
  rationale: मूल शब्द वास्तविक अधीनता का प्रबल रूपक प्रस्तुत करता है। ‘दास’ उसकी तीव्रता बनाए रखता है और उसे केवल सामान्य सेवा तक सीमित नहीं करता।
- source_word: κοσμικήν ... δόξαν
  choice: सांसारिक प्रतिष्ठा
  rationale: यह यूसुफ के जगत में प्राप्त पद, सम्मान और वैभव को सूचित करता है; ‘प्रतिष्ठा’ प्रसंग में ‘महिमा’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: भाइयों की कमियों को ढाँपने का नैतिक उपदेश
  choice: ‘एक-दूसरे की कमियों को ढाँप दो’
  alternative: ‘एक-दूसरे के दोष छिपाओ’
  rationale: मूल का आशय पाप या बुराई का निषेध करना नहीं, बल्कि भाई की कमी को निर्दयता से उजागर न करना है। ‘ढाँप दो’ इस दयापूर्ण संयम को बिना किसी बाद की सिद्धान्तगत धारणा जोड़े व्यक्त करता है।
- issue: पद 3 का पाठगत रूप से कठिन वाक्यांश
  choice: ‘ऐसे भले मन के संकल्प से ... जो भलाई चाहता है’
  alternative: ‘भले मन के उस चुनाव से जो भलाई में प्रसन्न होता है’
  rationale: प्रेषित यूनानी में वचन-सामंजस्य और वाक्य-संबंध कठिन है। अनुवाद भलाई की ओर उन्मुख भीतरी अभिप्राय का स्पष्ट नैतिक अर्थ देता है, पर पादटिप्पणी में अनिश्चितता स्वीकार करता है।
- issue: पद 7 में δοῦλοι की शक्ति
  choice: ‘दासों के समान’
  alternative: ‘सेवकों के समान’
  rationale: यूसुफ अपने घराने को भाइयों के अधीन रखने की अत्यन्त विनम्र स्थिति बताता है। ‘दास’ मूल की जान-बूझकर रखी गई तीव्रता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। पारिवारिक संबोधन और समानांतर वाक्य-रचना को यथासंभव सुरक्षित रखा गया है। पाठगत कठिनाई को मुख्य पाठ में अत्यधिक पुनर्निर्मित करने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
