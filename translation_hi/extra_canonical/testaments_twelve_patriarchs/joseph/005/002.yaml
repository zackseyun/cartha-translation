id: T12P.JOS.5.2
reference: Testament of Joseph 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐγὼ οὖν, ὡς ἤκουσα τοῦτο, διέρρηξα *τὰ ἱμάτιά⁷ μου, καὶ εἶπον ⌜αὐτῇ⌝⁸· Γύναι, αἰδέσθητι τὸν Θεόν⁹, καὶ¹⁰ μὴ ποιήσῃς τὴν *πρᾶξιν ταύτην τὴν πονηράν¹¹, ἵνα μὴ¹² ἐξολοθρευθῇς· *ἐπεὶ καίγε γίνωσκε ὅτι ἐγὼ¹³ ἐξαγγελῶ¹⁴ *πᾶσιν τὴν ἐπίνοιάν σου ταύτην¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/002.yaml
  text: 'So when I heard this, I tore my garments and said to her, “Woman, have reverence for God, and do not do this evil deed, lest you be destroyed. For know this also: I will tell everyone of this scheme of yours.”'
translation:
  language: hi
  text: इसलिए जब मैंने यह सुना, तो मैंने अपने वस्त्र फाड़ डाले और उससे कहा, “हे स्त्री, परमेश्वर का भय मान और यह बुरा काम मत कर, कहीं ऐसा न हो कि तू नष्ट हो जाए। यह भी जान ले कि मैं तेरी इस योजना के बारे में सबको बता दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰδέσθητι τὸν Θεόν
  choice: परमेश्वर का भय मान
  rationale: यह पदबंध परमेश्वर के प्रति श्रद्धापूर्ण भय और संकोच रखने की आज्ञा देता है। हिंदी में ‘परमेश्वर का भय मान’ स्वाभाविक, गरिमापूर्ण और प्रसंगानुकूल अभिव्यक्ति है।
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: यह बुरा काम
  rationale: πρᾶξις किसी किए जाने वाले कार्य को और πονηράν उसकी नैतिक बुराई को व्यक्त करता है; ‘यह बुरा काम’ दोनों को सीधे और सहज रूप में रखता है।
- source_word: ἐξαγγελῶ πᾶσιν
  choice: सबको बता दूँगा
  rationale: ἐξαγγέλλω का अर्थ सबके सामने प्रकट या घोषित करना है। इस सीधी व्यक्तिगत चेतावनी में ‘सबको बता दूँगा’ स्वाभाविक हिंदी है।
- source_word: τὴν ἐπίνοιάν σου ταύτην
  choice: तेरी इस योजना के बारे में
  rationale: ἐπίνοια यहाँ सोची हुई योजना या युक्ति को सूचित करता है। ‘योजना’ मूल की अपेक्षाकृत व्यापक अर्थ-सीमा बनाए रखती है और अनावश्यक रूप से ‘षड्यंत्र’ जैसा अधिक तीखा भाव नहीं जोड़ती।
theological_decisions:
- issue: αἰδέσθητι में श्रद्धा, संकोच और भय का संबंध
  choice: परमेश्वर का भय मान
  alternative: परमेश्वर के प्रति श्रद्धा रख
  rationale: मूल क्रिया केवल आतंक नहीं, बल्कि परमेश्वर के प्रति श्रद्धापूर्ण संकोच का आग्रह करती है। चुनी हुई हिंदी अभिव्यक्ति धार्मिक संदर्भ में इसी व्यापक नैतिक भाव को स्वाभाविक रूप से व्यक्त करती है।
- issue: ἵνα μὴ ἐξολοθρευθῇς में विनाश का कर्ता
  choice: कहीं ऐसा न हो कि तू नष्ट हो जाए
  alternative: वरना परमेश्वर तुझे नष्ट कर देगा
  rationale: यूनानी पाठ कर्मवाच्य है और विनाश के कर्ता को स्पष्ट नहीं करता। अनुवाद उसी अस्पष्टता को बनाए रखता है और परमेश्वर को स्पष्ट कर्ता बनाकर नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। वक्ता और स्त्री के बीच एकवचन निकट संबोधन के अनुरूप ‘तू/तेरी’ रखा गया है; ‘हे स्त्री’ मूल Γύναι की गंभीर प्रत्यक्ष पुकार को सुरक्षित रखता है।
