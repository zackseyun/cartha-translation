lexical_decisions:
- source_word: Φοβηθεῖσα
  choice: वह डर गई
  rationale: स्त्रीलिंग एओरिस्ट कृदंत का स्वाभाविक हिन्दी रूप; यह मुख्य विनती की पृष्ठभूमि बताता है।
- source_word: ἠξίου με
  choice: मुझसे विनती करने लगी
  rationale: संदर्भ में ἀξιόω का अर्थ आग्रह या विनती करना है; अपूर्णकाल को जारी/आरंभ हुई विनती के रूप में सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἐξαγγελῶ
  choice: किसी को न बताऊँ
  rationale: क्रिया का अर्थ बाहर प्रकट करना या खबर देना है; आधुनिक सामान्य हिन्दी में ‘किसी को बताना’ स्वाभाविक है।
- source_word: ἐπίνοιαν
  choice: योजना
  rationale: यहाँ शब्द मन में रची युक्ति, मंशा या योजना को दर्शाता है; ‘योजना’ प्रसंगानुकूल है और अनावश्यक नैतिक व्याख्या नहीं जोड़ता।
