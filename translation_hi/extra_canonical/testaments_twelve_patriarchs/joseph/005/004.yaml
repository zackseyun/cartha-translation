  source_fidelity: The draft correctly conveys ἀνεχώρησεν as departure and reasonably renders ἐπιθάλπουσα in its contextual persuasive sense ('enticing/cajoling') rather than its literal 'warming/cherishing.' δώροις and ἀπολαύσεσι πάσαις are retained. Recasting the participial relation more directly improves fidelity.
