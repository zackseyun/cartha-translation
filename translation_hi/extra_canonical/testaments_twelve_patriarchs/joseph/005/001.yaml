  text: And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as a husband.”
translation:
  language: hi
  text: फिर एक और अवसर पर उसने मुझसे कहा, “यदि तुम व्यभिचार नहीं करना चाहते, तो मैं अपने पति को विष देकर मार डालूँगी और तुम्हें पति बना लूँगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἑτέρῳ χρόνῳ
  choice: एक और अवसर पर
  rationale: यह यूनानी पद का स्वाभाविक आधुनिक हिन्दी रूप है और किसी दूसरे समय अथवा अवसर का भाव स्पष्ट करता है।
- source_word: μοιχεῦσαι
  choice: व्यभिचार करना
  rationale: क्रिया का सीधा नैतिक और वैवाहिक अर्थ सुरक्षित रहता है।
- source_word: ἀνελῶ ... φαρμάκῳ
  choice: विष देकर मार डालूँगी
  rationale: φαρμάκῳ साधन को और ἀνελῶ जान लेने की स्पष्ट मंशा को व्यक्त करता है।
- source_word: λήψομαί σε εἰς ἄνδρα
  choice: तुम्हें पति बना लूँगी
  rationale: हिन्दी में स्वाभाविक ढंग से विवाह-संबंध में ग्रहण करने का अर्थ देता है और यूनानी में अनुपस्थित अतिरिक्त स्वत्वसूचक ‘अपना’ नहीं जोड़ता।
