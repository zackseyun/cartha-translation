  text: '1[a]. See, then, my children, how much endurance accomplishes, and prayer with fasting.


    2. So you also, if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.


    3[b]. And where the Most High dwells, even if envy should befall someone, or slavery, or slander, the Lord dwelling in him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.


    4. For every person, whether in deed or in word or in thought, comes together.


    5. My brothers knew how my father loved me, yet I was not exalted in my mind; but though I was a child, I had the fear of God in my heart, for I knew that all things will surely pass away.


    6. And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent, when I was being sold, so as not to tell the Ishmaelites that I was a son of Jacob[c], a great and mighty man.'
translation:
  language: hi
  text: '**यूसुफ का वसीयतनामा 10**


    **1.** इसलिए, मेरे बच्चों, देखो कि धीरज कितना कुछ कर दिखाता है, और उपवास के साथ की गई प्रार्थना भी।


    **2.** इसी प्रकार, यदि तुम हृदय की नम्रता के साथ धीरज धरते हुए संयम और शुद्धता का अनुसरण करोगे, और उपवास के साथ प्रार्थना करोगे, तो प्रभु तुममें वास करेगा, क्योंकि वह संयम से प्रेम करता है।


    **3.** और जहाँ परमप्रधान वास करता है, वहाँ किसी व्यक्ति पर चाहे ईर्ष्या आ पड़े, चाहे दासता या निंदा[a], उसमें वास करने वाला प्रभु उसके संयम के कारण न केवल उसे बुराइयों से छुड़ाता है, बल्कि उसे ऊँचा उठाता और महिमा भी देता है, जैसा उसने मेरे साथ किया।


    **4.** क्योंकि प्रत्येक मनुष्य—चाहे कर्म में, वचन में या विचार में—सामने आता है[b]।


    **5.** मेरे भाई जानते थे कि मेरे पिता मुझसे कितना प्रेम करते थे, फिर भी मैंने अपने मन में घमण्ड नहीं किया। यद्यपि मैं बालक था, मेरे हृदय में परमेश्वर का भय था, क्योंकि मैं जानता था कि सब कुछ बीत जाएगा।


    **6.** मैं बुराई में फूल नहीं गया, बल्कि अपने भाइयों का आदर करता था। उनके भय के कारण, बेचे जाते समय मैं चुप रहा और इश्माएलियों को यह नहीं बताया कि मैं एक महान और धर्मी पुरुष याकूब का पुत्र हूँ[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठा आरोप।” यूनानी शब्द दुर्भावनापूर्ण अथवा गढ़े हुए आरोप को भी सूचित कर सकता है, जो मिस्र में यूसुफ के अनुभव से मेल खाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ कठिन है। सम्भवतः भाव यह है कि मनुष्य कर्म, वचन और विचार—हर क्षेत्र में—प्रकट या प्रतिष्ठित होता है।
    reason: textual_variant
  - marker: c
    text: कुछ पाठ-साक्ष्यों में इस उपवाक्य का रूप भिन्न है, पर मुख्य भाव यह है कि बेचे जाते समय यूसुफ ने अपनी पारिवारिक पहचान प्रकट नहीं की। उपलब्ध यूनानी पाठ याकूब को “महान और धर्मी” कहता है।
    reason: textual_variant
lexical_decisions:
- source_word: ὑπομονή
  choice: धीरज
  rationale: यहाँ कठिनाई में टिके रहने वाली धैर्यपूर्ण दृढ़ता अभिप्रेत है। ‘धीरज’ सहज, गरिमापूर्ण और उपदेशात्मक संदर्भ के अनुकूल है।
- source_word: προσευχή μετὰ νηστείας
  choice: उपवास के साथ की गई प्रार्थना
  rationale: μετά प्रार्थना के साथ उपवास की संगति व्यक्त करता है; यह अनुवाद दोनों को अलग किए बिना उस संबंध को स्पष्ट रखता है।
- source_word: σωφροσύνη
  choice: संयम
  rationale: शब्द का अर्थ केवल यौन शुचिता तक सीमित नहीं, बल्कि स्वयं पर अनुशासित नियंत्रण भी है। साथ आए ‘शुद्धता’ से प्रसंग का नैतिक और यौन पहलू बना रहता है।
- source_word: ἁγνεία
  choice: शुद्धता
  rationale: यह नैतिक और विशेषतः यौन शुद्धता की ओर संकेत करता है; ‘शुद्धता’ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करती।
- source_word: ταπείνωσις καρδίας
  choice: हृदय की नम्रता
  rationale: यह आंतरिक विनम्रता पर बल देने वाले सामी भाव और गरिमापूर्ण धार्मिक शैली, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: κατοικέω
  choice: वास करना
  rationale: यह परमेश्वर की उपस्थिति के लिए प्रचलित और गरिमापूर्ण बाइबलीय हिन्दी है तथा यूनानी के भीतर निवास करने वाले भाव को बनाए रखती है।
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: यह यहूदी धार्मिक साहित्य में परमेश्वर की इस उपाधि का स्थापित और संक्षिप्त हिन्दी रूप है।
- source_word: φθόνος
  choice: ईर्ष्या
  rationale: यूसुफ के प्रति उसके भाइयों की वैरपूर्ण जलन के प्रसंग में यह स्वाभाविक और सटीक है।
- source_word: δουλεία
  choice: दासता
  rationale: यूसुफ की कथा में वास्तविक गुलामी अभिप्रेत है; ‘दासता’ उस कठोर स्थिति को नरम नहीं करती।
- source_word: συκοφαντία
  choice: बदनामी
  rationale: शब्द दुर्भावनापूर्ण निंदा या झूठे आरोप को सूचित कर सकता है। मुख्य पाठ में सहज ‘बदनामी’ रखा गया है और अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: ῥύεται
  choice: छुड़ाता है
  rationale: यह संकट और बुराइयों से सक्रिय उद्धार का भाव देता है और आधुनिक धार्मिक हिन्दी में सुबोध है।
- source_word: ὑψοῖ καὶ δοξάζει
  choice: ऊँचा उठाता और महिमा देता है
  rationale: दोनों क्रियाओं को अलग रखा गया है, जिससे यूसुफ की उन्नति और सम्मान का अलंकारिक युग्म बना रहता है।
- source_word: συνέρχεται
  choice: सामने आता है
  rationale: पद 4 का यूनानी पाठ कठिन है। ‘सामने आता है’ प्रकट होने के संभावित भाव को व्यक्त करता है, पर अनिश्चितता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: उपलब्ध यूनानी पाठ में याकूब के लिए ‘धर्मी’ है; इसलिए परामर्श-पाठ के ‘पराक्रमी’ के स्थान पर स्रोत-साक्ष्य का सीधा अर्थ लिया गया है।
theological_decisions:
- issue: यहूदी वसीयतनामा-साहित्य में परमेश्वर के भीतर वास करने की भाषा
  choice: κατοικήσει ἐν ὑμῖν और संबंधित कथनों को ‘तुममें वास करेगा’ तथा ‘उसमें वास करने वाला प्रभु’ के रूप में सीधा रखा गया है।
  alternative: इसे केवल परमेश्वर की कृपा, सहायता या साथ रहने के रूपक के रूप में स्पष्ट कर देना।
  rationale: यूनानी पाठ धर्मी व्यक्ति में दैवी उपस्थिति की सशक्त भाषा इस्तेमाल करता है। अनुवाद किसी बाद की सिद्धान्तगत व्यवस्था को आरोपित किए बिना इसी तनाव को बनाए रखता है।
- issue: σωφροσύνη का नैतिक दायरा
  choice: मुख्य पाठ में ‘संयम’
  alternative: केवल ‘ब्रह्मचर्य’ या ‘यौन शुचिता’
  rationale: यूसुफ के प्रसंग में यौन शुद्धता प्रमुख है, फिर भी यूनानी सद्गुण का अर्थ व्यापक आत्म-अनुशासन है। ‘संयम और शुद्धता’ दोनों पक्षों को बनाए रखते हैं।
- issue: पद 4 के कठिन पाठ का अर्थ
  choice: मुख्य पाठ में अपेक्षाकृत खुला ‘सामने आता है’, साथ में पाठगत पादटिप्पणी
  alternative: निश्चयपूर्वक ‘ऊँचा उठाया जाता है’ या अत्यंत शाब्दिक और अस्पष्ट ‘एकत्र होता है’
  rationale: संरक्षित यूनानी वाक्य व्याकरण और अर्थ दोनों में कठिन है। सम्भावित प्रकट होने के भाव को पठनीय रूप दिया गया है, लेकिन अनिश्चितता छिपाई नहीं गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण उपदेशात्मक शैली रखी गई है। ‘वास करना’, ‘परमप्रधान’, ‘धीरज’ और ‘धर्मी’ जैसे परिचित धार्मिक शब्दों का प्रयोग किया गया है, पर अत्यधिक संस्कृतनिष्ठ या पुरातन वाक्य-विन्यास से बचा गया है। ‘बच्चो’ संबोधन आत्मीय वसीयतनामाई स्वर देता है।
