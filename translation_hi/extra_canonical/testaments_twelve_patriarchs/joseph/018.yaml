base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018.yaml
  text: '1. If, then, you also walk in the commandments of the Lord, God will exalt you in good things forever.

    2. And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.

    3. For see, you yourselves know that through my humility and my long-suffering I took as my wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.

    4. Even so'
translation:
  language: hi
  text: '**यूसुफ का वसीयतनामा 18**


    1. इसलिए, यदि तुम भी प्रभु की आज्ञाओं में चलोगे, तो परमेश्वर तुम्हें सदा के लिए अच्छी बातों में ऊँचा उठाएगा।[a]


    2. और यदि कोई तुम्हारे साथ बुराई करना चाहे, तो तुम भलाई करते हुए उसके लिए प्रार्थना करो; तब प्रभु तुम्हें हर बुराई से छुड़ाएगा।


    3. क्योंकि देखो, तुम जानते हो कि अपनी दीनता और धीरज के कारण मैंने हेलियोपोलिस के याजक की बेटी को अपनी पत्नी के रूप में लिया, और उसके साथ मुझे सोने के सौ तोड़े दिए गए; और मेरे प्रभु ने उन्हें मेरे अधीन कर दिया।[b]


    4. और भी, उसने मुझे इस्राएल के सुंदर पुरुषों से भी बढ़कर सुंदरता दी और बुढ़ापे तक मुझे सामर्थ्य और सुंदरता में बनाए रखा; क्योंकि हर बात में मैं याकूब के समान था।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अच्छी बातों में” का अर्थ अच्छी वस्तुओं, अनुकूल दशाओं, या भलाई के क्षेत्र में भी हो सकता है।
    reason: ἐν ἀγαθοῖς का संदर्भ और अर्थ-क्षेत्र अस्पष्ट है।
  - marker: b
    text: “उन्हें” किसके लिए कहा गया है, यह स्पष्ट नहीं है। यूनानी सर्वनाम पुल्लिंग बहुवचन है और निकटवर्ती “सौ तोड़े” से व्याकरणिक रूप से मेल नहीं खाता; संभव है कि संकेत प्रसंग में समझे गए लोगों की ओर हो।
    reason: αὐτούς का स्पष्ट व्याकरणिक पूर्वपद उपलब्ध पाठ में नहीं है।
  - marker: c
    text: कुछ पाठ-परंपराओं में इस पद के कई शब्दों की उपस्थिति या रूप भिन्न है; यहाँ दिए गए यूनानी पाठ का अर्थ प्रस्तुत किया गया है।
    reason: स्रोत संस्करण के आलोचनात्मक चिह्न पद 4 में पर्याप्त पाठांतर-साक्ष्य दर्शाते हैं।
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: आज्ञाओं पर चलते रहोगे
  rationale: चलने की यूनानी रूपक-भाषा को स्वाभाविक हिन्दी में रखते हुए निरंतर जीवन-आचरण का भाव व्यक्त किया गया है।
- source_word: ἐν ἀγαθοῖς
  choice: अच्छी बातों में
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है और इसका आशय ‘अच्छी वस्तुओं/परिस्थितियों/बातों में’ हो सकता है; अनिश्चितता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῇ ἀγαθοεργείᾳ
  choice: भलाई करते हुए
  rationale: शाब्दिक ‘भलाई के कार्य के द्वारा’ की तुलना में यह वर्तमान हिन्दी में स्वाभाविक है और बुराई के उत्तर में सक्रिय भलाई का अर्थ रखता है।
- source_word: ταπείνωσιν
  choice: दीनता
  rationale: यहाँ आत्म-दमन नहीं, नम्र और नीची स्थिति सहने का गुण अभिप्रेत हो सकता है; ‘दीनता’ दोनों छायाओं को खुला रखती है।
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: लंबे समय तक सहते रहने और क्रोध रोकने के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τάλαντα χρυσίου
  choice: तोड़े सोना
  rationale: τάλαντον प्राचीन भार/मुद्रा-मान है; पारंपरिक और समझने योग्य ‘तोड़ा’ चुना गया, न कि आधुनिक मुद्रा में अनुमानित रूपांतरण।
- source_word: ὡραιότητα / κάλλει
  choice: सुंदरता / सुंदरता
  rationale: दोनों निकटार्थी यूनानी शब्द शारीरिक शोभा का संकेत देते हैं; कृत्रिम भेद थोपने के बजाय हिन्दी में समान सहज पद रखा गया है।
theological_decisions:
- issue: आज्ञापालन और परमेश्वर द्वारा ऊँचा उठाया जाना
  choice: शर्त और प्रतिफल के कथन को सीधे रूप में रखा गया
  alternative: इसे केवल सांसारिक समृद्धि या केवल अंतिम उद्धार के अर्थ में सीमित करना
  rationale: यूनानी पाठ ऊँचा उठाए जाने की प्रकृति को स्पष्ट नहीं करता; किसी विशिष्ट धर्मसैद्धांतिक योजना को आरोपित नहीं किया गया।
- issue: शत्रु के लिए प्रार्थना और बुराई से छुटकारा
  choice: भलाई और प्रार्थना के बाद प्रभु द्वारा ‘हर बुराई’ से छुड़ाए जाने का व्यापक कथन रखा गया
  alternative: इसे केवल नैतिक बुराई, उत्पीड़न, या अनन्त दंड से जोड़ना
  rationale: παντὸς κακοῦ व्यापक और संदर्भतः अस्पष्ट है, इसलिए इसे संकीर्ण नहीं किया गया।
- issue: यूसुफ का याकूब के समान होना
  choice: ‘हर बात में ... समान’ का व्यापक दावा ज्यों का त्यों रखा गया
  alternative: इसे केवल रूप-सौंदर्य या वृद्धावस्था की शक्ति तक सीमित करना
  rationale: ἐν πᾶσι व्यापक है; निकट संदर्भ शारीरिक गुणों का है, पर पाठ स्पष्ट सीमा नहीं लगाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और उपदेशात्मक शैली रखी गई है। ‘प्रभु’, ‘परमेश्वर’, ‘याजक’, ‘तोड़ा’ और ‘इस्राएल’ जैसे प्रचलित बाइबिलीय पद सामान्य पाठक की समझ को ध्यान में रखकर चुने गए हैं। वाक्यरचना को अत्यधिक संस्कृतनिष्ठ या पुरातन होने से बचाया गया है, जबकि मूल की नैतिक गंभीरता और अनिश्चितताएँ सुरक्षित रखी गई हैं।
