  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। न्यायिक प्रसंग के लिए ‘न्याय’, ‘बयान’, ‘प्रमाण’, ‘पहरे में’ और ‘बन्दी’ जैसे परिचित शब्द चुने गए हैं। प्राचीन दासता-संबंधी भाषा को ऐतिहासिक कथन के रूप में स्पष्ट रखा गया है, उसका समर्थन या संप्रदायगत अर्थारोपण नहीं किया गया।
