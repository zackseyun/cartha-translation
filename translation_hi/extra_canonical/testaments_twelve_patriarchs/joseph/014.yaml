  text: XIV. Ἡ δὲ Μεμφὶς¹ ἑώρα² διὰ *τῶν θυρίδων³ ⌜*τυπτόμενόν με⁴, *πλησίον γὰρ ἦν ὁ οἶκος αὐτῆς⁵, καὶ *ἀπέστειλε πρὸς αὐτόν⁶, λέγουσα⁷· *Ἄδικος⁸ ἡ κρίσις σου⁹, ὅτι τὸν *κλαπέντα ⌜ἐλεύθερον⌉ *τιμωρεῖς, ὡς ἀδικήσαντα¹⁰. 2. Ὡς δὲ ⌜ἐγὼ⌉¹¹ οὐκ ἤλλαξα *τὸν λόγον μου¹² ⌜τυπτόμενος⌉, ἐκέλευσε *φυλαχθῆναί με¹³, ἕως οὗ ἔλθωσιν¹⁴ οἱ κύριοι *τοῦ παιδός¹⁵. 3. *Ἡ δὲ γυνὴ¹⁶ ἔλεγε¹⁷ πρὸς *τὸν ἄνδρα αὐτῆς¹⁸· ⌜Τί⌉¹⁹ συνέχεις²⁰ τὸν αἰχμάλωτον καὶ εὐγενῆ παῖδα *ἐν δεσμοῖς²¹, *ὃν ἔδει μᾶλλον ἄνετον εἶναι²² καὶ ὑπηρετεῖσθαι²³. 4. *Ἤθελε γὰρ ὁρᾶν με²⁴ ἐν πόθῳ ⌈ἁμαρτίας⌉²⁵. *ἐγὼ δὲ²⁶ ἠγνόουν ἐν²⁷ πᾶσι τούτοις²⁸. 5. *Εἶπε δὲ πρὸς αὐτήν²⁹· Οὐκ ἐστὶ *τοῦτο τοῖς³⁰ Αἰγυπτίοις πρὸ ἀποδείξεως ἀφαιρεῖσθαι τὰ ἀλλότρια. 6. Ταῦτα ⌜οὖν⌉³¹ εἶπε *περὶ τοῦ μεταβόλου³². *Ὁ δὲ παῖς³³ *ὀφείλει ἐγκατάκλειστος εἶναι³⁴.
