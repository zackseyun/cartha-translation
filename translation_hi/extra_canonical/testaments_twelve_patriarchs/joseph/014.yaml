  text: 1[a]. And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust[b], because you punish as a wrongdoer a free man who has been kidnapped.” 2. But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come. 3. And the woman kept saying to her husband[c],
translation:
  language: hi
  text: '**यूसुफ की वसीयत 14**


    **1.** मेम्फिस ने खिड़कियों[a] से मुझे पिटते हुए देखा—क्योंकि उसका घर पास ही था—और उसने अपने पति के पास यह संदेश भेजा, “तुम्हारा न्याय अन्यायपूर्ण है, क्योंकि तुम एक ऐसे स्वतंत्र मनुष्य को अपराधी मानकर दण्ड दे रहे हो, जिसे चुरा लिया गया है[b]।”


    **2.** परन्तु पिटते समय भी जब मैंने अपना बयान नहीं बदला, तो उसने आज्ञा दी कि मुझे पहरे में रखा जाए, जब तक उस युवक के स्वामी न आ जाएँ।


    **3.** वह स्त्री अपने पति से कहती रही, “तुम इस कुलीन बंदी युवक को बेड़ियों में क्यों रखे हुए हो? उचित तो यह था कि उसे बन्धनमुक्त रखा जाता और उसकी सेवा की जाती।”


    **4.** क्योंकि वह पापपूर्ण लालसा से मुझे देखना चाहती थी; पर मैं इन सब बातों से अनजान था।


    **5.** उसके पति ने उससे कहा, “मिस्रियों में यह रीति नहीं है कि प्रमाण मिलने से पहले किसी दूसरे की सम्पत्ति छीन ली जाए।”


    **6.** उसने ये बातें उस व्यापारी[c] के विषय में कहीं। उस युवक को बंद रखा जाना चाहिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झरोखों से”; यूनानी शब्द प्राचीन भवन की खिड़की-जैसी खुली जगह या जालीदार वातायन के लिए भी प्रयुक्त हो सकता है।
    reason: cultural_note
  - marker: b
    text: शब्दशः, “जिस स्वतंत्र मनुष्य को चुराया गया है”; अर्थात जिसे गैरकानूनी रूप से पकड़कर दास के समान बेचा या रखा गया।
    reason: lexical_alternative
  - marker: c
    text: यूनानी शब्द का अर्थ सौदा करने वाला “व्यापारी”, “व्यापार-दलाल” या “बिचौलिया” हो सकता है; यहाँ सम्भवतः वही व्यक्ति अभिप्रेत है जिसने यूसुफ पर स्वामित्व का दावा किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεμφίς
  choice: मेम्फिस
  rationale: इसे स्त्री के व्यक्तिगत नाम के रूप में लिप्यन्तरित किया गया है; अगले वाक्यों में स्त्रीलिंग सर्वनाम इसी पात्र की ओर संकेत करते हैं।
- source_word: τυπτόμενόν με
  choice: मुझे पिटते हुए
  rationale: वर्तमान कृदन्त लगातार हो रही शारीरिक मार को व्यक्त करता है; किसी विशेष दण्ड-साधन का अनुमान नहीं लगाया गया।
- source_word: θυρίδων
  choice: खिड़कियों
  rationale: यह सामान्य और स्वाभाविक हिन्दी है; प्राचीन भवन की खुली खिड़की या जालीदार वातायन की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: Ἄδικος ἡ κρίσις σου
  choice: तुम्हारा न्याय अन्यायपूर्ण है
  rationale: κρίσις के न्यायिक और नैतिक दोनों बलों को रखा गया है।
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: एक ऐसे स्वतंत्र मनुष्य को ... जिसे चुरा लिया गया है
  rationale: शब्दशः चुराए गए स्वतंत्र व्यक्ति की चौंकाने वाली सामाजिक-कानूनी विडम्बना को सुरक्षित रखा गया है; मुख्य पाठ में केवल 'अपहरण' कहकर अर्थ को संकुचित नहीं किया गया।
- source_word: ὡς ἀδικήσαντα
  choice: अपराधी मानकर
  rationale: यह उस व्यक्ति को ऐसा मानकर दण्ड देने का भाव व्यक्त करता है जिसने अन्याय किया हो।
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: मैंने अपना बयान नहीं बदला
  rationale: कानूनी पूछताछ के प्रसंग में λόγος यूसुफ के कथन या गवाही को सूचित करता है।
- source_word: φυλαχθῆναί με
  choice: मुझे पहरे में रखा जाए
  rationale: मूल क्रिया हिरासत और निगरानी का अर्थ देती है, पर अनिवार्यतः किसी विशेष प्रकार की जेल का नहीं।
- source_word: οἱ κύριοι τοῦ παιδός
  choice: उस युवक के स्वामी
  rationale: κύριοι स्वामित्व या अधिकार रखने वालों को सूचित करता है; παῖς के लिए प्रसंगानुकूल 'युवक' रखा गया है, जबकि दासता की सामाजिक स्थिति 'स्वामी' से स्पष्ट रहती है।
- source_word: αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: इस कुलीन बंदी युवक
  rationale: αἰχμάλωτος की बंदी-दशा और εὐγενής की कुलीन उत्पत्ति दोनों सुरक्षित रखी गई हैं।
- source_word: ἄνετον εἶναι
  choice: बन्धनमुक्त रखा जाता
  rationale: ἄνετος यहाँ बन्धनों से मुक्त या खुला छोड़े जाने का भाव देता है, केवल अमूर्त स्वतंत्रता का नहीं।
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: पापपूर्ण लालसा से
  rationale: जननिवाचक सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करते हुए इच्छा की नैतिक प्रकृति को रखा गया है।
- source_word: πρὸ ἀποδείξεως ἀφαιρεῖσθαι τὰ ἀλλότρια
  choice: प्रमाण मिलने से पहले किसी दूसरे की सम्पत्ति छीन ली जाए
  rationale: ἀπόδειξις को प्रमाण और τὰ ἀλλότρια को दूसरे की वस्तु या सम्पत्ति के रूप में कानूनी प्रसंग के अनुसार प्रस्तुत किया गया है।
- source_word: μεταβόλου
  choice: व्यापारी
  rationale: यहाँ शब्द उस सौदा करने वाले व्यापारी या दलाल की ओर संकेत करता है जिसके दावे की जाँच होनी थी; अधिक आरोपात्मक अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐγκατάκλειστος εἶναι
  choice: बन्दी बनाकर रखा जाना चाहिए
  rationale: यह भीतर बन्द या हिरासत में रखने की आवश्यकता व्यक्त करता है।
theological_decisions:
- issue: यूसुफ की स्वतंत्र स्थिति और दासता के दावे के बीच तनाव
  choice: ‘स्वतंत्र मनुष्य’ और ‘स्वामी’ दोनों सामाजिक-कानूनी शब्द बनाए रखे गए
  alternative: ἐλεύθερον को ‘निर्दोष व्यक्ति’ और κύριοι को केवल ‘अधिकारी’ कहना
  rationale: मूल पाठ का नैतिक तनाव इसी में है कि जन्मतः स्वतंत्र व्यक्ति को चुराकर ऐसे लोगों के अधिकार में बताया जा रहा है जो उसके स्वामी होने का दावा करते हैं; इसे निर्दोषता के सामान्य कथन में बदलना मूल सामाजिक अर्थ मिटा देता।
- issue: स्त्री की इच्छा का नैतिक वर्णन
  choice: ‘पापपूर्ण लालसा’
  alternative: ‘पाप करने की इच्छा’ या केवल ‘लालसा’
  rationale: ἐν πόθῳ ἁμαρτίας इच्छा और पाप के सम्बन्ध को स्पष्ट करता है, पर पाप के किसी अतिरिक्त धर्मवैधानिक वर्गीकरण को नहीं जोड़ता।
- issue: मनुष्य को ‘सम्पत्ति’ कहने वाला कानूनी कथन
  choice: वक्ता के तर्क में ‘किसी दूसरे की सम्पत्ति’ को बनाए रखा
  alternative: ‘किसी दूसरे के व्यक्ति’ या ‘दास’
  rationale: यह कथावाचक की स्वीकृति नहीं, बल्कि मिस्री पति द्वारा व्यापारी के दावे की प्रक्रिया समझाने वाला कथन है। मूल की असुविधाजनक सामाजिक भाषा को न तो अनुमोदित किया गया, न नरम करके हटाया गया।
