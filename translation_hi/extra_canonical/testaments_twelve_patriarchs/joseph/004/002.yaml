source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἔλεγον *πρὸς αὐτὴν⁶¹ ῥήματα ὑψίστου, εἰ ἄρα ἐπιστρέψει⁶² ἀπὸ τῆς ἐπιθυμίας⁶³ τῆς πονηρᾶς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/002.yaml
  text: And I would speak to her words of the Most High, whether perhaps she might turn back from the evil desire.
translation:
  language: hi
  text: और मैं उससे परमप्रधान की बातें कहता रहा[a], कि शायद वह उस बुरी अभिलाषा से मुड़ जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया-रूप का अर्थ “वे उससे … कहते रहे” भी हो सकता है; प्रसंग में यूसुफ स्वयं बोल रहा है, इसलिए मुख्य पाठ में “मैं” रखा गया है।
    reason: ἔλεγον की प्रथम-पुरुष एकवचन और तृतीय-पुरुष बहुवचन, दोनों रूपात्मक संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: ῥήματα ὑψίστου
  choice: परमप्रधान की बातें
  rationale: ‘ῥήματα’ को स्वाभाविक बहुवचन ‘बातें’ और ‘ὑψίστου’ को परमेश्वर की उपाधि के रूप में ‘परमप्रधान’ अनूदित किया गया है।
- source_word: ἐπιστρέψει
  choice: फिर जाए
  rationale: यहाँ क्रिया का भाव किसी मार्ग या मनोवृत्ति से लौटने का है; ‘फिर जाए’ इस परिवर्तन को सहज हिंदी में व्यक्त करता है।
- source_word: τῆς ἐπιθυμίας τῆς πονηρᾶς
  choice: उस बुरी अभिलाषा
  rationale: ‘अभिलाषा’ इच्छा की प्रबलता को व्यक्त करती है और ‘उस’ यूनानी निश्चित पदबंध को दर्शाता है; पाठ में ‘उसकी’ जोड़कर स्वामित्व आरोपित नहीं किया गया।
theological_decisions:
- issue: ἔλεγον का कर्ता
  choice: मैं … कहता रहा
  alternative: वे … कहते रहे
  rationale: ἔλεγον रूपतः प्रथम पुरुष एकवचन और तृतीय पुरुष बहुवचन दोनों हो सकता है। यूसुफ के प्रथम-पुरुष कथन का प्रसंग ‘मैं’ का समर्थन करता है, जबकि अपूर्ण काल को ‘कहता रहा’ से व्यक्त किया गया है; वैकल्पिक व्याकरणिक संभावना पादटिप्पणी में सुरक्षित है।
- issue: εἰ ἄρα की अनिश्चितता
  choice: कि शायद
  alternative: यह देखने के लिए कि क्या
  rationale: ‘कि शायद’ संभाव्यता और अनिश्चितता बनाए रखता है तथा स्रोत में स्पष्ट रूप से न आए उद्देश्य-वाचक ‘यह देखने के लिए’ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी रखी गई है। ‘परमप्रधान’ पारंपरिक ईश्वरीय उपाधि को स्पष्ट रूप से व्यक्त करता है, और ‘बुरी अभिलाषा’ मूल की नैतिक तीव्रता बनाए रखती है।
