translation:
  language: hi
  text: इन सब बातों में मैं भूमि पर लेटकर परमेश्वर से लगातार विनती करता रहा कि वह मुझे उसके छल से बचाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτοις πᾶσιν
  choice: इन सब परिस्थितियों में
  rationale: यह वाक्यांश पहले वर्णित सभी घटनाओं और परीक्षाओं की ओर संकेत करता है; ‘परिस्थितियों’ जोड़ने से हिन्दी में आशय स्वाभाविक और स्पष्ट रहता है।
- source_word: χαμοκοιτῶν
  choice: भूमि पर पड़ा हुआ
  rationale: शब्द का मूल अर्थ भूमि पर लेटना या सोना है; यह अनिश्चितता बनाए रखता है कि वक्ता केवल लेटा था या वहीं सोता था।
- source_word: ἐδεόμην
  choice: लगातार विनती करता रहा
  rationale: अपूर्ण भूतकालीन रूप बार-बार या निरंतर की जा रही प्रार्थना को व्यक्त करता है।
- source_word: ῥύσεταί με
  choice: वह मुझे ... बचाए
  rationale: ῥύομαι संकट अथवा किसी के वश से छुड़ाने या बचाने का भाव देता है।
- source_word: τῆς δολιότητος αὐτῆς
  choice: उसके छल से
  rationale: δολιότης कपटपूर्ण चाल या छल को सूचित करता है; स्त्रीलिंग सर्वनाम का संबंध प्रसंग में उल्लिखित स्त्री से है।
theological_decisions:
- issue: उद्धार के लिए परमेश्वर से विनती
  choice: परमेश्वर से लगातार विनती करता रहा कि वह मुझे ... बचाए
  alternative: परमेश्वर से प्रार्थना करता रहा कि वह मुझे छुड़ाए
  rationale: पाठ परमेश्वर को मुक्ति का कर्ता बताता है, पर यहाँ किसी व्यापक उद्धार-सिद्धांत को आरोपित किए बिना तत्कालीन छल से बचाए जाने का अर्थ रखा गया है।
