  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘भूमि’ और ‘विनती’ औपचारिक गरिमा रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
