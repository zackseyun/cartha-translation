source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις οὖν¹ *ὡς ἁγίῳ ἀνδρὶ ἐν λόγοις² ἐκολάκευέ³ με⁴ καὶ⁵ μετὰ δόλου διὰ⁶ ῥημάτων ἐπαίνει⁷ *τὴν σωφροσύνην⁸ μου ἐνώπιον τοῦ ἀνδρὸς αὐτῆς⁹, βουλομένη *κατὰ μόνας¹⁰ ὑποσκελίσαι με.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/003.yaml
  text: So then, many times, as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.
translation:
  language: hi
  text: इसलिए वह बहुत बार मुझे पवित्र व्यक्ति के रूप में बातों से चापलूसी करती थी और छल से अपने पति के सामने मेरे संयम की प्रशंसा करती थी, क्योंकि वह मुझे एकांत में गिरा देना चाहती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκολάκευέ
  choice: चापलूसी करती थी
  rationale: यह क्रिया किसी को मीठी या प्रशंसात्मक बातों से रिझाने का भाव रखती है; हिंदी में ‘चापलूसी’ छलपूर्ण प्रशंसा को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: σωφροσύνην
  choice: संयम
  rationale: यहाँ शब्द यौन प्रलोभन के प्रसंग में आत्मसंयम और शील का संकेत देता है। ‘संयम’ व्यापक अर्थ को बनाए रखते हुए आधुनिक पाठक के लिए सहज है।
- source_word: ὑποσκελίσαι
  choice: फँसाना
  rationale: मूल क्रिया का चित्रात्मक अर्थ पाँव अड़ाकर गिराना और लाक्षणिक अर्थ किसी का पतन कराना है। इस प्रसंग में ‘फँसाना’ उसकी गुप्त कपटपूर्ण मंशा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κατὰ μόνας
  choice: अकेले में
  rationale: यह पद निजी या एकांत परिस्थिति को दर्शाता है; ‘अकेले में’ संक्षिप्त और स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: σωφροσύνη का नैतिक दायरा
  choice: संयम
  alternative: शील / पवित्रता
  rationale: ‘संयम’ आत्मनियंत्रण के मूल भाव को सुरक्षित रखता है और पाठ में ऐसा अतिरिक्त धार्मिक अर्थ नहीं जोड़ता जो यूनानी शब्द यहाँ अनिवार्य रूप से व्यक्त नहीं करता।
- issue: ὑποσκελίσαι का रूपक
  choice: फँसाना
  alternative: ठोकर खिलाकर गिराना / पतन कराना
  rationale: शाब्दिक रूपक को ज्यों का त्यों रखने पर हिंदी अस्वाभाविक होती; ‘फँसाना’ कपट से नैतिक पतन की ओर ले जाने की मंशा बताता है, बिना यह निश्चित किए कि वह सफल हुई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कथात्मक शैली। अपूर्ण भूतकाल (‘करती थी’) यूनानी की बारंबार क्रिया और चलती हुई कपटपूर्ण रणनीति को दर्शाता है। ‘मानो मैं कोई पवित्र पुरुष हूँ’ मूल ὡς ἁγίῳ ἀνδρὶ की हल्की अस्पष्टता बनाए रखता है।
