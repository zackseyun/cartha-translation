source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*᾿Εδόξαζε ⌜γάρ⌝¹¹ με ὡς σώφρονα *φανερῶς, καὶ ἐν κρυφῇ¹² ἔλεγέ μοι· Μὴ φοβηθῇς τὸν ἄνδρα μου· καὶ γὰρ πέπεισται¹⁴ περὶ τῆς σωφροσύνης σου¹⁵· ὅτι κἂν *τις αὐτῷ εἴπῃ¹⁶ περὶ ἡμῶν, *οὐ πιστεύσει¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/004.yaml
  text: For she openly extolled me as self-controlled, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded about your purity, and even if someone should tell him about us, he will not believe it.”
translation:
  language: hi
  text: क्योंकि वह खुले तौर पर मेरी प्रशंसा संयमी के रूप में करती थी, पर गुप्त रूप से मुझसे कहती थी, “मेरे पति से मत डरो; क्योंकि उसे तुम्हारे संयम के बारे में पूरा विश्वास है। यदि कोई उससे हमारे विषय में कुछ कह भी दे, तो वह उस बात पर विश्वास नहीं करेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρονα / σωφροσύνης
  choice: संयम / शुद्ध आचरण
  rationale: इस प्रसंग में यूनानी शब्द यौन आत्म-संयम और नैतिक शुचिता को सूचित करता है। पहले प्रयोग में स्वाभाविक हिन्दी के लिए ‘संयम’, और दूसरे में पति की दृष्टि में यूसुफ के चरित्र को व्यक्त करने के लिए ‘शुद्ध आचरण’ चुना गया है।
- source_word: φανερῶς
  choice: सबके सामने
  rationale: अर्थ ‘खुले रूप से/सार्वजनिक रूप से’ है; ‘सबके सामने’ आधुनिक हिन्दी में सहज है और ἐν κρυφῇ के साथ स्पष्ट विरोध बनाता है।
- source_word: ἐν κρυφῇ
  choice: अकेले में
  rationale: शाब्दिक अर्थ ‘गुप्त में’ है; यहाँ निजी रूप से कही गई बात अभिप्रेत है।
- source_word: πέπεισται
  choice: विश्वास है
  rationale: पूर्णकालिक रूप दृढ़ धारणा या आश्वस्त होने की स्थिति व्यक्त करता है; हिन्दी में ‘विश्वास है’ इसे स्वाभाविक ढंग से देता है।
- source_word: περὶ ἡμῶν
  choice: हमारे विषय में
  rationale: जानबूझकर अस्पष्ट रखा गया है कि कथित बात वास्तविक संबंध की होगी या उसके आरोप की; मूल पाठ भी इसे नहीं खोलता।
theological_decisions:
- issue: σωφροσύνη का नैतिक-यौन आशय
  choice: ‘संयम’ और ‘शुद्ध आचरण’ द्वारा व्यापक नैतिक तथा प्रसंगगत यौन शुचिता दोनों को रहने दिया गया है।
  alternative: ‘सतीत्व’ या ‘यौन पवित्रता’
  rationale: वैकल्पिक शब्द अर्थ को केवल यौन क्षेत्र तक सीमित कर सकते हैं, जबकि σωφροσύνη का अर्थ-क्षेत्र आत्म-संयम और विवेकपूर्ण शुद्ध आचरण भी समेटता है।
- issue: ‘हमारे विषय में’ की अस्पष्टता
  choice: आरोप की प्रकृति को स्पष्ट किए बिना मूल अस्पष्टता बनाए रखी गई है।
  alternative: ‘हमारे संबंध के विषय में’ या ‘हम दोनों के विषय में’
  rationale: ऐसी स्पष्टता पाठ में निहित संकेत को व्याख्या में बदल देती।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। प्रत्यक्ष कथन सहज रखा गया है; अनावश्यक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
