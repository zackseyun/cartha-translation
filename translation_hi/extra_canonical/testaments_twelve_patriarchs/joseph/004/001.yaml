id: T12P.JOS.4.1
reference: Testament of Joseph 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ νοήσας ἐγὼ⁵⁵ ἐλυπήθην ἕως θανάτου⁵⁶· *ἐξελθούσης δὲ⁵⁷ αὐτῆς ἦλθον εἰς ἐμαυτόν, καὶ ἐπένθησα⁵⁸ περὶ αὐτῆς⁵⁹ ἡμέρας πολλάς, *ὅτι ἔγνων τὸν δόλον αὐτῆς καὶ τὴν πλάνην⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/001.yaml
  text: And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I knew her deceit and her delusion.
translation:
  language: hi
  text: और जब मैं यह समझ गया, तो मैं मृत्यु की हद तक दुःखी हुआ। पर उसके बाहर निकल जाने के बाद मैं फिर होश में आया और बहुत दिनों तक उसके लिए शोक करता रहा, क्योंकि मैं उसके छल और उसके भ्रम को जान गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: यह समझ गया
  rationale: यहाँ क्रिया का अर्थ परिस्थिति और स्त्री के आशय को समझ लेने से है; ‘यह समझ गया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐλυπήθην ἕως θανάτου
  choice: मृत्यु की हद तक दुःखी हुआ
  rationale: यूनानी की तीव्र, शाब्दिक अभिव्यक्ति को बनाए रखता है, बिना इसे वास्तविक मृत्यु या केवल एक सामान्य मुहावरे के रूप में तय किए।
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: मैं अपने आप में आया
  rationale: मूल मुहावरे का रूप और आत्मसंयम अथवा सुध-बुध लौटने का भाव दोनों सुरक्षित रहते हैं।
- source_word: ἐπένθησα περὶ αὐτῆς
  choice: उसके लिए शोक करता रहा
  rationale: περὶ αὐτῆς में उसके विषय में अथवा उसके कारण शोक करने का भाव है; हिन्दी में यह चयन स्वाभाविक रहते हुए करुणा का संकेत देता है।
- source_word: τὸν δόλον αὐτῆς καὶ τὴν πλάνην
  choice: उसके छल और उसके भ्रम
  rationale: δόλος के जानबूझकर किए गए छल और πλάνη के भ्रम, भटकाव अथवा मोह—इन भिन्न भावों को अलग रखता है।
theological_decisions:
- issue: स्त्री के प्रति यूसुफ के शोक का स्वरूप
  choice: ‘उसके लिए शोक’ कहकर कारण को खुला रखा गया है
  alternative: ‘उसके कारण शोक’ या ‘उस पर विलाप’
  rationale: मूल περὶ αὐτῆς करुणा, चिंता अथवा उसके आचरण से उपजा शोक व्यक्त कर सकता है; अनुवाद इनमें से किसी एक को निर्णायक नहीं बनाता।
- issue: πλάνη का नैतिक या मानसिक आशय
  choice: ‘भ्रम’
  alternative: ‘बहकावा’ या ‘पथभ्रष्टता’
  rationale: ‘भ्रम’ इस बात को अनिर्णीत रखता है कि वह स्वयं भ्रमित थी या दूसरों को भटका रही थी, जबकि साथ का ‘छल’ उसके जानबूझकर किए गए कपट को पहले ही व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘मृत्यु की हद तक’ और ‘अपने आप में आया’ जैसे मूल के सशक्त मुहावरों को अर्थ स्पष्ट रखते हुए निकटता से प्रस्तुत किया गया है।
