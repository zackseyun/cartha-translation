id: T12P.JOS.4.8
reference: Testament of Joseph 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ πρὸς αὐτὴν ἔλεγον³⁸ *ὅτι οὐχ³⁹ ἐν ἀκαθαρσίᾳ θέλει⁴⁰ Κύριος τοὺς σεβομένους αὐτόν, οὔτε⁴¹ *τοῖς μοιχεύουσιν εὐδοκεῖ⁴², ⌈ἀλλὰ τοῖς ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις αὐτῷ προσερχομένοις⁴³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/008.yaml
  text: But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”
translation:
  language: hi
  text: पर मैंने उससे कहा, “प्रभु नहीं चाहता कि उसका आदर करनेवाले अशुद्धता में रहें। वह व्यभिचार करनेवालों से प्रसन्न नहीं होता, बल्कि उनसे प्रसन्न होता है जो शुद्ध हृदय और निष्कलंक होंठों से उसके निकट आते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς σεβομένους αὐτόν
  choice: उसका आदर करनेवाले
  rationale: σεβομένους श्रद्धापूर्ण आदर और भक्ति का भाव रखता है; ‘आदर करनेवाले’ आधुनिक हिन्दी में सहज है और अर्थ को किसी विशिष्ट धार्मिक पदावली तक सीमित नहीं करता।
- source_word: ἐν ἀκαθαρσίᾳ
  choice: अशुद्धता में
  rationale: यह अभिव्यक्ति नैतिक अथवा यौन अशुद्धता का व्यापक अर्थ बनाए रखती है; प्रसंग को देखते हुए इसे केवल अनुष्ठानिक अशुद्धता नहीं बनाया गया।
- source_word: τοῖς μοιχεύουσιν
  choice: व्यभिचार करनेवालों
  rationale: μοιχεύω का सीधा अर्थ वैवाहिक बेवफाई अथवा व्यभिचार करना है।
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: शुद्ध हृदय से
  rationale: καρδία व्यक्ति के भीतरी नैतिक और भावनात्मक केंद्र को दर्शाता है; प्रचलित और गरिमापूर्ण हिन्दी अभिव्यक्ति रखी गई।
- source_word: στόμασιν ἀμίαντοις
  choice: निष्कलंक होंठों से
  rationale: στόμασιν का शाब्दिक अर्थ ‘मुखों से’ है, पर हिन्दी में नैतिक रूप से अदूषित वाणी के संकेत हेतु ‘होंठों से’ अधिक स्वाभाविक है; ἀμίαντος का अर्थ निष्कलंक या अदूषित है।
- source_word: προσερχομένοις
  choice: उसके निकट आते हैं
  rationale: क्रिया का धार्मिक संदर्भ में परमेश्वर के पास आने का अर्थ है; इसे ‘उपासना करते हैं’ बनाकर निहित अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: θέλει का आशय
  choice: प्रभु नहीं चाहता
  alternative: प्रभु की इच्छा नहीं है
  rationale: दोनों संभव हैं; चुना गया रूप प्राकृतिक हिन्दी में मूल के इच्छासूचक कथन को सीधे व्यक्त करता है, बिना इसे किसी व्यवस्थित धर्मवैज्ञानिक सिद्धांत में बदलने के।
- issue: εὐδοκεῖ का पूरक और विरोधी संरचना
  choice: वह व्यभिचार करनेवालों से प्रसन्न नहीं होता, बल्कि उनसे प्रसन्न होता है जो...
  alternative: वह व्यभिचारियों को स्वीकार नहीं करता, बल्कि उन्हें जो...
  rationale: εὐδοκέω प्रसन्न होने या अनुकूल दृष्टि रखने का भाव देता है। ‘प्रसन्न होता है’ दोनों विपरीत पक्षों में क्रिया को स्पष्ट रखता है और ‘स्वीकार’ से उत्पन्न संभावित उद्धारशास्त्रीय अर्थ नहीं जोड़ता।
- issue: शुद्धता का स्वरूप
  choice: अशुद्धता, शुद्ध हृदय और निष्कलंक होंठ
  alternative: यौन अपवित्रता, निर्मल मन और पवित्र वाणी
  rationale: मूल पाठ हृदय और मुख/होंठ की छवियों के साथ व्यापक नैतिक भाषा रखता है। अनुवाद उसी तनाव को बनाए रखता है और अशुद्धता को केवल यौन व्यवहार तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। मूल यूनानी की ‘नहीं... न ही..., बल्कि...’ विरोधी संरचना को स्वाभाविक हिन्दी में दो वाक्यों द्वारा स्पष्ट किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
