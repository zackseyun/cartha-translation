  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/010.yaml
  text: And I added fasting and prayer, so that the Lord might rescue me from her.
translation:
  language: hi
  text: और मैंने उपवास और प्रार्थना भी जोड़े, ताकि प्रभु मुझे उस स्त्री से छुड़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσετιθέμην
  choice: और बढ़ाया
  rationale: मध्यवाच्य अपूर्णकाल यहाँ पहले से चल रहे आत्म-अनुशासन में उपवास और प्रार्थना जोड़ने अथवा उन्हें बढ़ाने का भाव देता है; स्वाभाविक हिन्दी में ‘और बढ़ाया’ इस निरंतरता को व्यक्त करता है।
- source_word: νηστείαν καὶ προσευχήν
  choice: उपवास और प्रार्थना
  rationale: दोनों धार्मिक अभ्यासों के मानक और सीधे हिन्दी पद हैं।
- source_word: ῥύσεταί με
  choice: मुझे छुड़ाए
  rationale: ῥύομαι संकट या किसी के वश से बचाने/छुड़ाने का अर्थ देता है; ‘छुड़ाए’ यहाँ व्यक्तिगत प्रलोभन से मुक्ति के संदर्भ में स्वाभाविक है।
- source_word: ἀπ᾽ αὐτῆς
  choice: उस स्त्री से
  rationale: स्त्रीलिंग सर्वनाम αὐτῆς का संदर्भ पूर्वोक्त स्त्री है; हिन्दी में केवल ‘उससे’ की संभावित अस्पष्टता से बचते हुए संदर्भ स्पष्ट किया गया है।
theological_decisions:
- issue: प्रार्थना का उद्देश्य और अपेक्षित छुटकारा
  choice: ‘ताकि प्रभु मुझे ... छुड़ाए’
  alternative: ‘कि प्रभु मुझे ... छुड़ाएगा’
  rationale: ὅπως के साथ भविष्यकाल उद्देश्य/अपेक्षित परिणाम व्यक्त कर सकता है। हिन्दी में ‘ताकि ... छुड़ाए’ प्रार्थनापूर्ण उद्देश्य को रखता है और परिणाम को यांत्रिक निश्चितता में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। वाक्य की प्रथम-पुरुष गवाही और यूनानी मूल का क्रम यथासंभव बनाए रखा गया है।
