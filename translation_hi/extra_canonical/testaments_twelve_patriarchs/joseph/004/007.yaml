  text: And she says to me, “If you want me to leave the idols, my kinsman, I will persuade my husband to withdraw from the idols, and we will walk before your Lord.”
translation:
  language: hi
  text: और वह मुझसे कहती है, “यदि तुम चाहते हो कि मैं मूर्तियों को त्याग दूँ, हे मेरे कुटुम्बी, तो मैं भी अपने पति को मूर्तियों से दूर हो जाने के लिए राज़ी करूँगी, और हम तुम्हारे प्रभु के सामने चलेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψω τὰ εἴδωλα
  choice: मैं मूर्तियों को त्याग दूँ
  rationale: καταλείπω का अर्थ यहाँ मूर्तिपूजा छोड़ना है; ‘त्याग दूँ’ स्वाभाविक हिन्दी में इस धार्मिक विच्छेद को स्पष्ट करता है।
- source_word: συγγενοῦς μου
  choice: हे मेरे कुटुम्बी
  rationale: पाठ में संबोधन के रूप में आए संबंधवाचक पद को बनाए रखा गया है; ‘कुटुम्बी’ रिश्तेदारी बताता है, पर अनावश्यक रूप से किसी निश्चित संबंध का दावा नहीं करता।
- source_word: πείθω τὸν ἄνδρα μου
  choice: मैं भी अपने पति को … मना लूँगी
  rationale: πείθω के समझाने/राज़ी करने के भाव और κἀγώ के ‘मैं भी’ को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἀποστῆναι ἀπὸ τῶν εἰδώλων
  choice: मूर्तियों से दूर हो जाने के लिए
  rationale: ἀφίστημι के अलग हटने या विमुख होने के भाव को सुरक्षित रखा गया है और पहली क्रिया से अनावश्यक समानता नहीं बनाई गई।
- source_word: πορευσόμεθα ἐνώπιον Κυρίου σου
  choice: हम तुम्हारे प्रभु के सामने चलेंगे
  rationale: πορεύομαι और ἐνώπιον की शाब्दिक छवि को प्राकृतिक तथा बाइबिलीय हिन्दी में रखा गया है; उपलब्ध यूनानी पाठ में ‘व्यवस्था में चलने’ जैसा अतिरिक्त वाक्यांश नहीं जोड़ा गया।
theological_decisions:
- issue: ‘तुम्हारे प्रभु के सामने चलना’ का आशय
  choice: रूपक को यथावत रखा गया
  alternative: हम तुम्हारे प्रभु की आज्ञा मानकर जीवन बिताएँगे
  rationale: यूनानी कथन जीवन-आचरण का संकेत दे सकता है, पर उसे व्याख्यात्मक शब्दों में खोलने से मूल की अर्थ-व्याप्ति संकुचित होती।
- issue: किस प्रभु की स्वीकृति व्यक्त होती है
  choice: ‘तुम्हारे प्रभु’
  alternative: ‘हमारे प्रभु’ या केवल ‘प्रभु’
  rationale: σου स्पष्ट रूप से द्वितीय पुरुष एकवचन संबंध सूचित करता है; वक्ता के विश्वास-परिवर्तन को इससे अधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष वचन की शर्त, संबोधन और समानांतर मूर्ति-त्याग की क्रियाएँ संरक्षित हैं।
