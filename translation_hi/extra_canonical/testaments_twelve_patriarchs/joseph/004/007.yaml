  verdict: revise
  source_fidelity: Draft closely represents the Greek clause sequence and preserves the vocative συγγενοῦς μου, the reciprocal κἀγώ, and σου ('your'). However, 'मना लूँगी' can mean 'refuse' in modern Hindi and is therefore unsafe for πείθω ('persuade').
  naturalness: The register is appropriately modern and dignified. 'हे मेरे कुटुम्बी' is intelligible but somewhat stiff; it accurately retains the source's deliberately nonspecific kinship address. 'राज़ी करूँगी' is the natural unambiguous rendering in this context.
  terminology: '''मूर्तियों'' suitably renders εἴδωλα, and ''प्रभु'' renders Κύριος without doctrinal expansion. ''त्याग दूँ'' and ''दूर हो जाने'' preserve the distinction between καταλείπω and ἀφίστημι adequately.'
  issues:
  - severity: medium
    issue: ‘मना लूँगी’ is ambiguous in modern Hindi.
    rationale: In common current usage, ‘किसी को मना लेना’ may mean to dissuade someone or obtain refusal, whereas πείθω τὸν ἄνδρα μου means ‘I will persuade my husband.’ ‘राज़ी करूँगी’ communicates the intended sense clearly.
  revised_text: और वह मुझसे कहती है, “यदि तुम चाहते हो कि मैं मूर्तियों को त्याग दूँ, हे मेरे कुटुम्बी, तो मैं भी अपने पति को मूर्तियों से दूर हो जाने के लिए राज़ी करूँगी, और हम तुम्हारे प्रभु के सामने चलेंगे।”
