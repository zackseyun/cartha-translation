  text: Since she accomplished nothing in this, she again began to come to me with words of instruction, wanting to learn the word of God.
translation:
  language: hi
  text: जब वह इसमें कुछ भी सफल न हुई, तो वह परमेश्वर का वचन सीखने के लिए फिर शिक्षा की बातें करने मेरे पास आने लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν ἴσχυσεν ἐν τούτῳ
  choice: वह इसमें कुछ भी सफल न हुई
  rationale: मुहावरे का अर्थ है कि उसका यह प्रयास निष्फल रहा; ‘इसमें’ मूल पाठ के संकेतात्मक और कुछ हद तक अस्पष्ट भाव को बनाए रखता है।
- source_word: πάλιν ἔτι
  choice: फिर
  rationale: दोनों क्रियाविशेषण पुनरावृत्ति पर बल देते हैं; हिन्दी में केवल ‘फिर’ स्वाभाविक रूप से वही आशय व्यक्त करता है।
- source_word: λόγῳ κατηχήσεως
  choice: शिक्षा की बातें लेकर
  rationale: κατήχησις मौखिक शिक्षा या निर्देश को सूचित करता है; यह प्रयोग उस बहाने अथवा बातचीत के विषय को सहज हिन्दी में व्यक्त करता है।
- source_word: ἤρχετο πρὸς με
  choice: मेरे पास आने लगी
  rationale: ἤρχετο को आरम्भसूचक अर्थ में लिया गया है और πρὸς με को ‘मेरे पास’ से स्पष्ट किया गया है।
- source_word: τοῦ μαθεῖν λόγον Θεοῦ
  choice: परमेश्वर का वचन सीखने की इच्छा से
  rationale: उद्देश्यसूचक infinitive को स्वाभाविक हिन्दी में अभिप्राय के रूप में प्रस्तुत किया गया है; λόγον Θεοῦ का प्रतिष्ठित और सटीक रूप ‘परमेश्वर का वचन’ रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर का वचन’ का आशय
  choice: वाक्यांश को बिना विस्तार के ‘परमेश्वर का वचन’ रखा गया
  alternative: ‘परमेश्वर की शिक्षा’ या किसी विशिष्ट धर्मग्रंथ का नाम
  rationale: मूल λόγον Θεοῦ यह निर्धारित नहीं करता कि आशय सामान्य ईश्वरीय शिक्षा है, मौखिक संदेश है या कोई निश्चित लिखित ग्रंथ; अनुवाद इस व्यापकता को सुरक्षित रखता है।
- issue: स्त्री की घोषित इच्छा वास्तविक थी या बहाना
  choice: ‘इच्छा से’ कहा गया, पर उसकी नीयत पर स्पष्ट निर्णय नहीं जोड़ा गया
  alternative: ‘सीखने का बहाना करके’
  rationale: आसपास का प्रसंग छल का संकेत दे सकता है, किन्तु इस यूनानी वाक्य में ‘बहाना’ स्पष्ट रूप से नहीं है; इसलिए निहित तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। स्त्रीलिंग सर्वनाम प्रसंग तथा अंग्रेज़ी परामर्श-पाठ के अनुरूप है। वाक्य-क्रम को हिन्दी में स्वाभाविक बनाया गया है, जबकि मूल की अस्पष्टता और उद्देश्य-संबंध सुरक्षित रखे गए हैं।
