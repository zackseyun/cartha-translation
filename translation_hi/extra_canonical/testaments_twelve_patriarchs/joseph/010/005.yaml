id: T12P.JOS.10.5
reference: Testament of Joseph 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Γινώσκουσιν¹⁹ οἱ ἀδελφοί μου²⁰ πῶς ἠγάπησέ με ὁ πατήρ μου²¹, καὶ οὐχὶ²² ὑψούμην²³ ⸀ἐν τῇ διανοίᾳ²⁴ μου⸃, καίπερ νήπιος ὑπάρχων²⁵, ⸀εἶχον τὸν *φόβον τοῦ θεοῦ²⁶ ἐν τῇ καρδίᾳ²⁷ μου⸃· ᾔδειν²⁸ γὰρ ὅτι πάντα²⁹ παρελεύσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/005.yaml
  text: My brothers knew how my father loved me, yet I was not exalted in my mind; though I was a child, I had the fear of God in my heart, for I knew that surely all things will pass away.
translation:
  language: hi
  text: मेरे भाई जानते हैं कि मेरे पिता मुझसे कितना प्रेम करते थे, फिर भी मैं अपने मन में घमण्ड से नहीं फूला। बालक होते हुए भी मेरे हृदय में परमेश्वर का भय था, क्योंकि मैं जानता था कि सब कुछ बीत जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψούμην ἐν τῇ διανοίᾳ μου
  choice: मैं अपने मन में घमण्ड से नहीं फूला
  rationale: शाब्दिक अर्थ ‘अपने मन में ऊँचा नहीं उठा’ है; हिन्दी में यह स्वाभाविक मुहावरा आन्तरिक गर्व या आत्मोन्नति को स्पष्ट रखता है।
- source_word: νήπιος
  choice: बालक
  rationale: यहाँ आयु और अपरिपक्व अवस्था का सामान्य संकेत है; ‘बालक’ गरिमापूर्ण और सहज है।
- source_word: φόβον τοῦ θεοῦ
  choice: परमेश्वर का भय
  rationale: धार्मिक-साहित्यिक पदबंध को बिना उसे केवल ‘श्रद्धा’ में सीमित किए सुरक्षित रखा गया है।
- source_word: πάντα παρελεύσεται
  choice: सब कुछ बीत जाएगा
  rationale: πάντα की व्यापकता और παρέρχομαι के नश्वरता/गुज़र जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर का भय’ का अर्थ
  choice: मूल पदबंध ‘परमेश्वर का भय’ बनाए रखा
  alternative: ‘परमेश्वर के प्रति श्रद्धा’
  rationale: ‘श्रद्धा’ अर्थ के एक पक्ष को उजागर करती, पर मूल की सम्भावित श्रद्धा, भय और भक्तिपूर्ण विस्मय की व्यापकता को घटा देती।
- issue: ‘सब कुछ बीत जाएगा’ की व्यापकता
  choice: असीम सामान्य कथन बनाए रखा
  alternative: ‘सांसारिक वस्तुएँ बीत जाएँगी’
  rationale: मूल πάντα किसी स्पष्ट सीमित वर्ग का उल्लेख नहीं करता; इसलिए व्याख्यात्मक सीमा नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। वाक्य-संरचना मूल यूनानी के विचार-क्रम के निकट है, पर हिन्दी में स्वाभाविक प्रवाह रखा गया है।
