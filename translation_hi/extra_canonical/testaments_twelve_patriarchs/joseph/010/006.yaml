source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ *†οὐκ ἐπήρθην ἐν κακῷ† ἀλλ᾽³⁰ ἐτίμουν *τοὺς ἀδελφούς μου³¹, καὶ διὰ τὸν φόβον αὐτῶν³² *καὶ ἐσιώπουν πιπρασκόμενος ἐσιώπουν³³ εἰπεῖν³⁴ *τοῖς Ἰσμαϊλίταις³⁵ ὅτι³⁶ υἱός εἰμι Ἰακὼβ³⁷ ἀνδρὸς μεγάλου³⁸ *καὶ δικαίου³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/006.yaml
  text: And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent when I was being sold, not telling the Ishmaelites that I was a son of Jacob, a great and righteous man.
translation:
  language: hi
  text: और मैं बुराई में घमंड से नहीं फूला;[a] बल्कि मैंने अपने भाइयों का आदर किया। उनसे डरकर मैं चुप रहा, जब मुझे बेचा जा रहा था, और मैंने इश्माएलियों को नहीं बताया कि मैं याकूब का पुत्र हूँ, जो महान और धर्मी व्यक्ति था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्यांश का यूनानी पाठ पाठालोचन की दृष्टि से संदिग्ध चिह्नित है; उपलब्ध पाठ का शाब्दिक भाव है, “मैं बुराई में घमंड से नहीं फूला।” ‘बुराई के कारण’ भी एक संभावित व्याख्या है।
    reason: मूल संस्करण में οὐκ ἐπήρθην ἐν κακῷ को क्रक्स चिह्नों से घेरा गया है; इसलिए पाठ की अनिश्चितता तथा ἐν κακῷ की वैकल्पिक व्याख्या पाठक के सामने रखनी आवश्यक है।
lexical_decisions:
- source_word: ἐπήρθην
  choice: घमंड से फूल उठा
  rationale: क्रिया का भाव स्वयं को ऊँचा समझने या घमंड से भरने का है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के रूपक के निकट है।
- source_word: ἐτίμουν
  choice: आदर किया
  rationale: यह τιμάω के सम्मान देने वाले अर्थ को सरल, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: φόβον αὐτῶν
  choice: उनके डर से
  rationale: संदर्भ में इसका सर्वाधिक स्वाभाविक अर्थ भाइयों से भय है, पर यूनानी संबंधकारक की व्याकरणिक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: ἐσιώπουν
  choice: चुप रहा
  rationale: स्रोत में मौन रहने की निरंतर क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: πιπρασκόμενος
  choice: बेचा जाते समय
  rationale: वर्तमान कर्मवाच्य कृदंत की समकालिकता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δικαίου
  choice: धर्मी
  rationale: δικαίου का अर्थ नैतिक रूप से न्यायी या धर्मी है, न कि शक्तिशाली।
theological_decisions:
- issue: याकूब के लिए δικαίου का वर्णन
  choice: धर्मी
  alternative: न्यायी
  rationale: ‘धर्मी’ व्यक्ति के समग्र नैतिक चरित्र को व्यक्त करता है और इस धार्मिक-साहित्यिक संदर्भ में अधिक स्वाभाविक है; इससे कोई विशिष्ट संप्रदायगत अर्थ नहीं जोड़ा गया।
- issue: भाइयों के भय से मौन रहने का कारण
  choice: उनके डर से
  alternative: उनके भय के कारण / उनके भय से
  rationale: संदर्भ जोसेफ द्वारा अपने भाइयों से डरने की ओर संकेत करता है, लेकिन αὐτῶν की संभावित कर्तृवाचक व्याख्या को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। स्रोत में ἐσιώπουν की पुनरावृत्ति संभवतः पाठ-परंपरा या संपादकीय समस्या है; हिन्दी में अनावश्यक दुहराव न रखकर एक ही बार ‘चुप रहा’ कहा गया है। ‘इश्माएली’ सामान्य हिन्दी बाइबलीय नाम-रूप है।
