  text: See, then, my children, how much endurance and prayer with fasting accomplish.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, देखो कि धीरज और उपवास के साथ की गई प्रार्थना कितना कुछ कर सकते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: देखो
  rationale: वर्तमान आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; श्रोताओं को पिछले अनुभव से निष्कर्ष देखने के लिए बुलाता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन का आत्मीय और सामान्य आधुनिक हिन्दी रूप।
- source_word: πόσα κατεργάζεται
  choice: कितना कुछ कर सकती है
  rationale: ग्रीक वाक्यांश उपलब्धि या प्रभाव की व्यापकता बताता है; यह हिन्दी में स्वाभाविक रहते हुए उसके बल को सुरक्षित रखता है।
- source_word: ἡ ὑπομονὴ
  choice: धीरज
  rationale: ὑπομονή विपत्ति में टिके रहने वाले धैर्य और दृढ़ता को व्यक्त करता है; ‘धीरज’ सहज और गरिमापूर्ण है।
- source_word: ἡ προσευχὴ μετὰ νηστείας
  choice: उपवास के साथ की गई प्रार्थना
  rationale: 'μετά के संबंध को स्पष्ट रखता है: प्रार्थना उपवास के साथ की जाती है; दोनों को असंबद्ध साधनों के रूप में नहीं बाँटता।'
theological_decisions:
- issue: क्रिया के कर्ताओं का संबंध
  choice: ‘धीरज’ और ‘उपवास के साथ की गई प्रार्थना’ दोनों को संयुक्त कर्ता के रूप में रखा गया है।
  alternative: केवल धीरज को पहली क्रिया का कर्ता मानकर प्रार्थना को अलग वाक्यांश बनाना।
  rationale: दोनों संज्ञाओं के साथ लेख और καί का समन्वय उन्हें κατεργάζεται के संयुक्त कर्ताओं के रूप में पढ़ने का समर्थन करता है; एकवचन क्रिया नपुंसक बहुवचन πόσα की ओर आकर्षित हो सकती है या संयुक्त धारणा को एक समग्र शक्ति मान सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय संबोधन और शिक्षाप्रद, गरिमापूर्ण लहजा। ‘कर सकती है’ संयुक्त साधनों को एक समग्र शक्ति की तरह व्यक्त करता है और ग्रीक एकवचन क्रिया का स्वाभाविक हिन्दी समकक्ष है।
