id: T12P.JOS.10.3
reference: Testament of Joseph 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅπου δὲ κατοικεῖ ὁ ὕψιστος¹⁰, κἂν *φθόνος τις περιπέσῃ, κἂν δουλία, κἂν συκοφαντία¹¹, *ὁ Κύριος κατοικῶν ἐπ᾽ αὐτὸν¹² διὰ τὴν σωφροσύνην οὐ μόνον⁷ ἐκ τῶν κακῶν ῥύεται¹³ αὐτόν¹⁴, ⸀ἀλλὰ καὶ ὑψοῖ¹⁵ καὶ δοξάζει αὐτὸν ὡς κἀμέ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/003.yaml
  text: But where the Most High dwells, even if envy should fall upon someone, or slavery, or slander, the Lord who dwells with him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.
translation:
  language: hi
  text: पर जहाँ परमप्रधान निवास करता है, वहाँ यदि किसी पर ईर्ष्या, दासता या झूठा आरोप आ पड़े, तो प्रभु, जो उसके साथ निवास करता है, उसके संयम के कारण उसे न केवल विपत्तियों से बचाता है, बल्कि उसे ऊँचा उठाता और महिमा भी देता है, जैसा उसने मेरे साथ किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: φθόνος
  choice: ईर्ष्या
  rationale: यह यूनानी शब्द के द्वेषपूर्ण ईर्ष्या के मूल अर्थ को सीधे व्यक्त करता है।
- source_word: συκοφαντία
  choice: झूठा आरोप
  rationale: प्रसंग में इसका आशय बदनामी या दुर्भावनापूर्ण मिथ्या अभियोग से है; यह सामान्य पाठक के लिए स्पष्ट है।
- source_word: σωφροσύνη
  choice: संयम
  rationale: यह आत्म-संयम और नैतिक शुद्धता दोनों को समेटता है तथा यूसुफ के प्रसंग में उपयुक्त है।
- source_word: τῶν κακῶν
  choice: विपत्तियों
  rationale: यहाँ बहुवचन κακά उन बुरे हालात या संकटों की ओर संकेत करता है जिनका पहले उल्लेख है; 'विपत्तियाँ' हिन्दी में स्वाभाविक है।
- source_word: ὑψοῖ καὶ δοξάζει
  choice: ऊँचा उठाता और महिमा भी देता है
  rationale: दोनों समांतर क्रियाओं का भेद और बल सुरक्षित रखा गया है।
theological_decisions:
- issue: प्रभु के निवास और व्यक्ति के संयम के बीच संबंध
  choice: प्रभु, जो उसके साथ निवास करता है, उसके संयम के कारण
  alternative: '''उस पर निवास करने वाला प्रभु'' अथवा संयम को प्रभु के निवास का कारण मानना'
  rationale: यूनानी ἐπ᾽ αὐτόν का शाब्दिक रूप अस्पष्ट/असहज है। 'उसके साथ' निवास की निकटता व्यक्त करता है, जबकि διὰ τὴν σωφροσύνην को उद्धारकारी कार्य से जोड़कर मूल वाक्य का संभावित संबंध सुरक्षित रखा गया है।
- issue: अंतिम तुलना ὡς κἀμέ
  choice: जैसा उसने मेरे साथ किया
  alternative: जैसा मुझे भी ऊँचा उठाया और महिमा दी
  rationale: संक्षिप्त यूनानी तुलना में निहित क्रिया को स्वाभाविक हिन्दी में स्पष्ट किया गया है, बिना किसी अतिरिक्त धर्मवैज्ञानिक दावे के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य की विरोधसूचक शुरुआत के लिए δέ का अनुवाद 'पर' किया गया है। सूची और 'न केवल... बल्कि... भी' की संरचना मूल के अलंकारिक प्रवाह को बनाए रखती है।
