reference: Testament of Joseph 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πάντας⁷ γὰρ ⸀ἀνθρώπους¹⁶ ἢ ἐν ἔργῳ⁷ *ἢ ἐν λόγῳ, ἢ ἐν διανοίᾳ¹⁷ †συνέρχεται¹⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/004.yaml
  text: For it comes upon all people either in deed or in word or in mind.
translation:
  language: hi
  text: क्योंकि यह सभी लोगों पर—चाहे काम में, वचन में या विचार में—आ पड़ता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में अंतिम क्रिया का सामान्य अर्थ “साथ आता है” या “मिलता है” है, पर यहाँ वाक्य-विन्यास असामान्य है; इसलिए अर्थ “आ पड़ता है” लिया गया है।
    reason: स्रोत संस्करण में क्रिया को संदिग्ध चिह्न से अंकित किया गया है और उसका कर्मकारक पदों के साथ प्रयोग कठिन है; पाठक को वास्तविक पाठगत अस्पष्टता बताना आवश्यक है।
lexical_decisions:
- source_word: Πάντας … ἀνθρώπους
  choice: सभी लोगों पर
  rationale: यूनानी में यह कर्मकारक बहुवचन है; प्रसंग में निहित कर्ता के प्रभाव का लक्ष्य सभी मनुष्य हैं। सहज हिन्दी में ‘पर’ इस संबंध को स्पष्ट करता है।
- source_word: ἐν ἔργῳ
  choice: काम में
  rationale: ἔργον यहाँ किए हुए कार्य या आचरण के क्षेत्र को बताता है; ‘काम’ सामान्य पाठक के लिए स्वाभाविक और व्यापक है।
- source_word: ἐν λόγῳ
  choice: वचन में
  rationale: λόγος इस त्रिक में बोले गए शब्द/वाणी को सूचित करता है; ‘वचन’ गरिमापूर्ण और संक्षिप्त समानांतर पद है।
- source_word: ἐν διανοίᾳ
  choice: विचार में
  rationale: διάνοια मन, समझ या विचार को दर्शाता है; यहाँ कार्य और वचन के साथ आंतरिक विचार का क्षेत्र अभिप्रेत है।
- source_word: συνέρχεται
  choice: आ पड़ता है
  rationale: शाब्दिक अर्थ ‘साथ आता/मिलता है’ है, पर सभी लोगों के कर्मकारक के साथ यह प्रयोग ‘सामना करता है/आ पड़ता है’ के अर्थ में समझा जाता है। निहित एकवचन कर्ता को ‘यह’ से बनाए रखा गया है।
theological_decisions:
- issue: निहित कर्ता की पहचान
  choice: सर्वनाम ‘यह’ रखा गया, बिना उसका स्पष्ट नाम बताए
  alternative: प्रसंग से किसी पाप, परीक्षा, आत्मा या अन्य शक्ति का नाम जोड़ना
  rationale: दिए गए यूनानी वाक्य में कर्ता व्यक्त नहीं है। उसका धर्मवैचारिक नाम जोड़ना मूल की अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘काम, वचन, विचार’ की त्रिक संरचना और मूल का निहित कर्ता सुरक्षित हैं।
