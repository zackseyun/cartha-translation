revisions:
- from: इसी प्रकार तुम भी, यदि धीरज और प्रार्थना के साथ, उपवास करते हुए और मन की दीनता में, संयम और पवित्रता का पीछा करोगे, तो प्रभु तुममें वास करेगा, क्योंकि वह संयम से प्रेम करता है।
  to: इसी प्रकार तुम भी, यदि धीरज के साथ और उपवास सहित प्रार्थना में, हृदय की नम्रता के साथ, संयम और पवित्रता की खोज करोगे, तो प्रभु तुममें वास करेगा, क्योंकि वह संयम से प्रेम करता है।
  rationale: The revision keeps the Greek conditional syntax and all its principal terms, while explicitly associating fasting with prayer, using a natural Hindi expression for actively pursuing virtues, and restoring the source's 'heart' imagery. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:21:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the conditional structure, the paired virtues, the Lord's dwelling 'in you,' and the causal clause. However, its ordering makes 'उपवास करते हुए' sound like a general accompaniment to pursuing the virtues, rather than retaining the Greek's closer connection of fasting with prayer. 'मन की दीनता' is intelligible but is less direct than the source's 'humility of heart.'
  naturalness: The current sentence is understandable, but 'संयम और पवित्रता का पीछा करोगे' is somewhat literal and awkward for abstract virtues in modern standard Hindi. 'की खोज करोगे' naturally conveys sustained pursuit without weakening the sense.
  terminology: '''संयम'' suitably renders σωφροσύνη, and ''पवित्रता'' is a suitably broad rendering of ἁγνεία. ''वास करेगा'' is appropriate for κατοικήσει. ''हृदय की नम्रता'' is both idiomatic in religious Hindi and closer to ταπεινώσει καρδίας.'
  issues:
  - severity: medium
    issue: Fasting is not explicitly linked to prayer.
    rationale: In the Greek, μετὰ νηστείας most closely qualifies προσευχῇ. The draft's 'प्रार्थना के साथ, उपवास करते हुए' can instead suggest that fasting generally accompanies the pursuit.
  - severity: low
    issue: Literal but less natural idiom for pursuing virtues.
    rationale: '''संयम और पवित्रता का पीछा करना'' is understandable, but ''संयम और पवित्रता की खोज करना'' is more natural modern Hindi for μεταδιώκητε while retaining its active, continuing sense.'
  - severity: low
    issue: '''मन की दीनता'' is less source-close than needed.'
    rationale: The source explicitly has 'of heart.' 'हृदय की नम्रता' preserves this imagery and is standard, comprehensible Hindi.
  revised_text: इसी प्रकार तुम भी, यदि धीरज के साथ और उपवास सहित प्रार्थना में, हृदय की नम्रता के साथ, संयम और पवित्रता की खोज करोगे, तो प्रभु तुममें वास करेगा, क्योंकि वह संयम से प्रेम करता है।
  revised_footnotes: []
  revision_rationale: The revision keeps the Greek conditional syntax and all its principal terms, while explicitly associating fasting with prayer, using a natural Hindi expression for actively pursuing virtues, and restoring the source's 'heart' imagery. No doctrinal interpretation has been added.
