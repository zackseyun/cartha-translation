id: T12P.JOS.10.2
reference: Testament of Joseph 10:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὕτως καὶ ὑμεῖς⁴, ⌜ἐὰν τὴν σωφροσύνην καὶ τὴν ἁγνείαν μεταδιώκητε⁵ ἐν ὑπομονῇ καὶ *προσευχῇ μετὰ νηστείας ἐν ταπεινώσει⁶ καρδίας, ὁ⁷ Κύριος κατοικήσει⁸ ἐν ὑμῖν, ὅτι ἀγαπᾷ⁹ τὴν σωφροσύνην.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/002.yaml
  text: So you also, if you pursue self-control and purity with endurance and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.
translation:
  language: hi
  text: इसी प्रकार तुम भी, यदि धीरज के साथ और उपवास सहित प्रार्थना में, हृदय की नम्रता के साथ, संयम और पवित्रता की खोज करोगे, तो प्रभु तुममें वास करेगा, क्योंकि वह संयम से प्रेम करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: संयम
  rationale: यहाँ शब्द आत्म-संयम और नैतिक शुद्धचित्तता का भाव रखता है; सहज हिन्दी में ‘संयम’ इस अर्थ को सबसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἁγνείαν
  choice: पवित्रता
  rationale: यूनानी शब्द नैतिक और विशेषतः यौन शुचिता का संकेत दे सकता है; ‘पवित्रता’ उसके व्यापक अर्थ को बनाए रखती है और प्रसंग में स्वाभाविक है।
- source_word: μεταδιώκητε
  choice: पीछा करोगे
  rationale: क्रिया किसी गुण को उत्साह और निरंतरता से पाने का प्रयत्न करने का भाव देती है; ‘पीछा करना’ उस सक्रियता को सुरक्षित रखता है।
- source_word: ὑπομονῇ
  choice: धीरज
  rationale: यह कठिनाई के बीच टिके रहने और सहनशील दृढ़ता का भाव व्यक्त करता है।
- source_word: κατοικήσει
  choice: वास करेगा
  rationale: क्रिया स्थायी रूप से रहने या निवास करने का अर्थ देती है; धार्मिक गद्य में ‘वास करेगा’ स्पष्ट और गरिमापूर्ण है।
- source_word: ταπεινώσει καρδίας
  choice: मन की दीनता
  rationale: शाब्दिक रूप ‘हृदय की दीनता’ है, पर आधुनिक हिन्दी में ‘मन की दीनता’ आंतरिक नम्रता का भाव अधिक स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: ἐν ὑμῖν का स्थानगत अर्थ
  choice: तुममें
  alternative: तुम्हारे बीच
  rationale: बहुवचन ὑμῖν दोनों अर्थों की अनुमति दे सकता है, पर निकटतम और अधिक सीधा अनुवाद ‘तुममें’ है; यह मूल की आंतरिक निवास-संबंधी सम्भावना को बनाए रखता है।
- issue: σωφροσύνη का नैतिक विस्तार
  choice: संयम
  alternative: शुद्धचित्तता
  rationale: ‘संयम’ सामान्य पाठक के लिए अधिक स्पष्ट है और आत्म-नियंत्रण के केंद्रीय भाव को व्यक्त करता है, यद्यपि यूनानी शब्द में विवेकपूर्ण तथा शुद्ध आचरण का व्यापक संकेत भी है।
- issue: μετὰ νηστείας का प्रार्थना से संबंध
  choice: प्रार्थना के साथ, उपवास करते हुए
  alternative: उपवास सहित प्रार्थना के साथ
  rationale: मूल में ‘उपवास के साथ’ निकटतः प्रार्थना से जुड़ता है। चुना हुआ रूप इस संबंध को बनाए रखते हुए हिन्दी वाक्य को सहज रखता है और इसे केवल धीरज का विशेषण नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। वाक्य की यूनानी शर्तात्मक संरचना और साधनों की क्रमबद्धता यथासंभव सुरक्षित रखी गई है; कोई सम्प्रदायगत शब्दावली नहीं जोड़ी गई।
