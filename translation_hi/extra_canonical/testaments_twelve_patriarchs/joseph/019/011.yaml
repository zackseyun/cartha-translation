id: T12P.JOS.19.11
reference: Testament of Joseph 19:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὑμεῖς οὖν, τέκνα μου, φυλάξατε τὰς ἐντολὰς Κυρίου, καὶ τιμᾶτε³⁸ τὸν *Λευὶ καὶ τὸν Ἰούδαν³⁹. ὅτι *ἐκ τοῦ σπέρματος⁴⁰ αὐτῶν ἀνατελεῖ ὑμῖν⁴¹ [ὁ ἀμνὸς τοῦ Θεοῦ, ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου]⁴², σώζων [πάντα τὰ ἔθνη καὶ]⁴⁸ τὸν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/011.yaml
  text: Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you [the lamb of God, who takes away the sin of the world,] saving [all the nations and] Israel.
translation:
  language: hi
  text: इसलिए, मेरे बच्चों, प्रभु की आज्ञाओं का पालन करो और लेवी तथा यहूदा का आदर करो; क्योंकि उनके वंश से तुम्हारे लिए [परमेश्वर का मेमना, जो संसार का पाप उठा ले जाता है,] उदय होगा और [सब राष्ट्रों तथा] इस्राएल का उद्धार करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: पालन करो
  rationale: शाब्दिक अर्थ ‘सुरक्षित रखो’ है, पर आज्ञाओं के संदर्भ में आधुनिक हिन्दी में ‘पालन करो’ स्वाभाविक और अर्थ-सटीक है।
- source_word: τιμᾶτε
  choice: आदर करो
  rationale: लेवी और यहूदा को सम्मान देने की आज्ञा को सामान्य, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: σπέρματος
  choice: वंश
  rationale: यहाँ शारीरिक बीज से उत्पन्न संतति/वंश अभिप्रेत है; ‘वंश’ हिन्दी में अधिक स्वाभाविक है।
- source_word: ἀνατελεῖ
  choice: उदय होगा
  rationale: क्रिया के उदित होने वाले मसीही बिंब को बनाए रखता है, बजाय अस्पष्ट रूप से केवल ‘उत्पन्न होगा’ कहने के।
- source_word: αἴρων
  choice: उठा ले जाता है
  rationale: ग्रीक वर्तमान कृदंत का मूल बिंब और पाप को दूर करने का आशय दोनों सुरक्षित रहते हैं।
- source_word: σώζων
  choice: उद्धार करेगा
  rationale: भावी मुख्य क्रिया के साथ जुड़ा कृदंत है; हिन्दी में परिणामकारी भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘उनके वंश’ में लेवी और यहूदा दोनों का समावेश
  choice: उनके वंश से
  alternative: उनके वंशों से / उनके वंशजों में से
  rationale: ग्रीक में बहुवचन सर्वनाम αὐτῶν के साथ एकवचन σπέρματος है; अनुवाद इसी सामूहिक और संभावित रूप से तनावपूर्ण अभिव्यक्ति को बनाए रखता है।
- issue: ἀμνὸς τοῦ Θεοῦ का मसीही पदबंध
  choice: परमेश्वर का मेमना
  alternative: ईश्वर का मेमना
  rationale: यह पदबंध मूल की बलिदानी छवि को सीधे बनाए रखता है और किसी अतिरिक्त व्याख्यात्मक पहचान को पाठ में नहीं जोड़ता।
- issue: कोष्ठकित अंशों की पाठालोचनात्मक स्थिति
  choice: वर्ग कोष्ठक यथावत रखे गए
  alternative: अंशों को बिना कोष्ठक मुख्य पाठ में समाहित करना
  rationale: स्रोत संस्करण इन शब्दों की पाठगत अनिश्चितता दर्शाता है; उसे मिटाना उचित नहीं होगा।
- issue: τὴν ἁμαρτίαν का एकवचन
  choice: संसार का पाप
  alternative: संसार के पाप
  rationale: ग्रीक में ‘पाप’ एकवचन है; धार्मिक रूप से परिचित बहुवचन के बजाय स्रोत का व्याकरण और सामूहिक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। स्रोत के वर्ग कोष्ठक पाठगत अनिश्चितता के संकेत के रूप में सुरक्षित रखे गए हैं; कोई फुटनोट आवश्यक नहीं है।
