review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the emphatic opening, the comparison with the handsome men of Israel, preservation through old age, the broad statement of likeness to Jacob, and the plural ‘dreams’ with οἶδα (‘I know’) rather than ‘I saw.’
  naturalness: ‘मुझे सामर्थ्य और सुंदरता में बनाए रखा’ is understandable but not idiomatic modern Hindi. Rendering the state adjectivally is more natural while preserving the Greek sense.
  terminology: ‘इस्राएल,’ ‘याकूब,’ ‘रूपवान,’ and ‘स्वप्न’ are appropriate, consistent biblical-register terms. ‘रूप’ is possible, but ‘सुंदरता’ more directly matches ὡραιότητα and avoids the slightly compressed expression ‘रूप दिया.’
  issues:
