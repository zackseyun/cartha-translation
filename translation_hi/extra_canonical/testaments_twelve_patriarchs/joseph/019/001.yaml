id: T12P.JOS.19.1
reference: Testament of Joseph 19:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καίγε καὶ²² ὡραιότητα ἔδωκέ²³ μοι ὑπὲρ ὡραίους Ἰσραήλ, ⌜καὶ⌉ ἐφύλαξέ²⁴ με ⌜ἕως γήρους²⁵ ἐν δυνάμει καὶ⌉ ἐν κάλλει· *Καὶ γὰρ ὅμοιος ἤμην²⁶ ἐν πᾶσι τῷ²⁷ Ἰακώβ. Ἀκούσατε δέ¹, τέκνα μου, καὶ *περὶ ὧν †οἶδα ἐνυπνίων².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/001.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things. Now listen, my children, also concerning the dreams that I know about.
translation:
  language: hi
  text: निश्चय ही, उसने मुझे इस्राएल के रूपवान पुरुषों से भी बढ़कर सुंदरता दी और बुढ़ापे तक मुझे सामर्थ्यवान और सुंदर बनाए रखा; क्योंकि मैं हर बात में याकूब के समान था। अब, मेरे बच्चो, उन स्वप्नों के विषय में भी सुनो जिनके बारे में मैं जानता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα
  choice: रूप
  rationale: यहाँ शारीरिक आकर्षण या सुंदरता का भाव है; ‘रूप’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: इस्राएल के रूपवान पुरुषों से भी बढ़कर
  rationale: तुलनात्मक अर्थ को स्पष्ट रखते हुए ‘इस्राएल’ को सामूहिक समुदाय के बजाय उसके रूपवान पुरुषों के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἐφύλαξέ με
  choice: मुझे ... बनाए रखा
  rationale: सामर्थ्य और सुंदरता की अवस्था के बुढ़ापे तक सुरक्षित बने रहने का भाव संदर्भानुकूल ढंग से व्यक्त होता है।
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: सामर्थ्य और सुंदरता में
  rationale: दोनों समानांतर संज्ञाओं और उनके पृथक बल को सुरक्षित रखा गया है।
- source_word: ἐν πᾶσι
  choice: हर बात में
  rationale: व्यापक दावे को बिना किसी विशिष्ट व्याख्या में सीमित किए स्वाभाविक हिन्दी में रखा गया है।
- source_word: περὶ ὧν οἶδα ἐνυπνίων
  choice: उन स्वप्नों के विषय में ... जिनके बारे में मैं जानता हूँ
  rationale: ἐνυπνίων के बहुवचन और कठिन पाठ οἶδα के ‘मैं जानता हूँ’ अर्थ—दोनों को बनाए रखा गया है; इसे ‘जो मैंने देखे’ में नहीं बदला गया।
theological_decisions:
- issue: यूसुफ का याकूब के समान ‘हर बात में’ होना
  choice: क्योंकि मैं हर बात में याकूब के समान था
  alternative: क्योंकि मैं सभी गुणों में याकूब के समान था
  rationale: मूल का व्यापक और संभवतः तनावपूर्ण कथन जस का तस रखा गया है; ‘गुणों’ जोड़कर उसके आशय को नैतिक या चरित्रगत समानता तक सीमित नहीं किया गया।
- issue: स्वप्नों के संबंध में ज्ञान का दावा
  choice: जिनके बारे में मैं जानता हूँ
  alternative: जो मैंने देखे थे
  rationale: दूषित या कठिन पाठ के बावजूद उपलब्ध यूनानी οἶδα का अर्थ सुरक्षित रखा गया है और परिचित बाइबलीय कथानक के आधार पर इसे चुपचाप ‘देखे’ नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन ‘मेरे बच्चो’ स्वाभाविक प्रत्यक्ष वाणी बनाए रखता है। ‘निश्चय ही’ Καίγε के बलाघात को व्यक्त करता है।
