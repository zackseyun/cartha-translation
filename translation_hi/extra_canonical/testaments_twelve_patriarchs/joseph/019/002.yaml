translation:
  language: hi
  text: बारह हिरन एक स्थान पर चर रहे थे, और उन नौ को सारी पृथ्वी पर बिखेर दिया गया; इसी प्रकार उन तीन को भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: हिरन
  rationale: यह यूनानी बहुवचन सामान्य रूप से हिरन/मृग को दर्शाता है; आधुनिक हिन्दी में ‘हिरन’ सहज और स्पष्ट है।
- source_word: ἐνέμοντο
  choice: चर रहे थे
  rationale: मध्यवाच्य क्रिया यहाँ पशुओं के चरने का स्वाभाविक अर्थ देती है।
- source_word: ἐν τόπῳ
  choice: एक स्थान पर
  rationale: यूनानी पद में अनिश्चित स्थान का भाव है; ‘एक स्थान पर’ इसे स्वाभाविक हिन्दी में रखता है।
- source_word: διεσπάρησαν
  choice: तितर-बितर हो गए
  rationale: निष्क्रिय क्रिया के बिखेर दिए जाने/बिखर जाने के भाव को बिना किसी अनुल्लिखित कर्ता को जोड़े व्यक्त करता है।
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: सारी पृथ्वी पर
  rationale: वाक्यांश के व्यापक भौगोलिक अर्थ को सीधे बनाए रखता है।
- source_word: ὁμοίως δὲ καὶ οἱ τρεῖς
  choice: और उसी प्रकार वे तीन भी
  rationale: संक्षिप्त यूनानी समानांतरता और ‘भी’ के बल को सुरक्षित रखता है; पहले समूह के साथ निहित क्रिया हिन्दी में स्पष्ट रहती है।
theological_decisions:
- issue: बारह हिरनों के नौ और तीन के समूहों का प्रतीकात्मक अर्थ
  choice: पाठ में कोई व्याख्या नहीं जोड़ी गई
  alternative: समूहों को विशिष्ट गोत्रों, राष्ट्रों या ऐतिहासिक घटनाओं से स्पष्ट रूप से जोड़ना
  rationale: इस पद का यूनानी पाठ केवल दृश्य का वर्णन करता है; प्रतीकात्मक पहचान जोड़ना मूल की अस्पष्टता को अनुचित रूप से समाप्त कर देता।
