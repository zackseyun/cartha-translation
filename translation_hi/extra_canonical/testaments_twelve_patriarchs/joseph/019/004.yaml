source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐκεῖ ἐβόησαν πρὸς Κύριον μέχρι οὐ συνήχθησαν *πρὸς αὐτοὺς¹⁷ οἱ ἐννέα ἔλαφοι καὶ ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα, καὶ μετ’ ὀλίγον χρόνον ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/004.yaml
  text: And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks.
translation:
  language: hi
  text: और वहाँ वे प्रभु को तब तक पुकारते रहे, जब तक वे नौ हिरन उनके पास इकट्ठे न हो गए। तब वे बारह भेड़ों के समान हो गए; और थोड़े ही समय बाद वे बढ़ते गए और बहुत-से झुंड बन गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησαν πρὸς Κύριον
  choice: प्रभु को ... पुकारते रहे
  rationale: इससे ऊँची और व्याकुल प्रार्थनापूर्ण पुकार का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: οἱ ἐννέα ἔλαφοι
  choice: वे नौ हिरन
  rationale: ἔλαφοι का सामान्य और सहज हिन्दी समतुल्य ‘हिरन’ है; निश्चित उपपद को ‘वे’ से दर्शाया गया है।
- source_word: ὡς δώδεκα πρόβατα
  choice: बारह भेड़ों के समान
  rationale: ὡς की उपमात्मक शक्ति को बनाए रखा गया है; इसे वास्तविक रूपांतरण के रूप में नहीं खोला गया।
- source_word: ποίμνια πολλά
  choice: बहुत-से झुंड
  rationale: ποίμνια पशुओं के अनेक झुंडों को सूचित करता है; सन्दर्भ स्वयं भेड़ों का संकेत देता है, इसलिए अनावश्यक पुनरुक्ति से बचा गया है।
theological_decisions:
- issue: बारह पशुओं के ‘भेड़ों के समान’ होने का स्वरूप
  choice: उपमा को ज्यों का त्यों रखा गया
  alternative: वे बारह भेड़ें बन गए
  rationale: यूनानी ὡς स्पष्टतः ‘के समान’ कहता है; इसे वास्तविक रूपांतरण बना देना मूल की प्रतीकात्मक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
- issue: प्रभु की पुकार और नौ हिरनों के इकट्ठा होने का सम्बन्ध
  choice: ‘जब तक’ द्वारा कालगत सम्बन्ध रखा गया
  alternative: प्रभु ने नौ हिरनों को उनके पास इकट्ठा कर दिया
  rationale: मूल में कर्मवाच्य συνήχθησαν है और कर्ता स्पष्ट नहीं है; इसलिए ईश्वरीय कर्तृत्व को व्याख्यात्मक रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘वे’ के सर्वनाम-सन्दर्भ की मूल अस्पष्टता को यथासम्भव बनाए रखा गया है।
