source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ τοῦ τετάρτου βοὸς ἀνέβησαν τὰ κέρατα μέχρι τοῦ οὐρανοῦ καὶ ἐγένοντο ὡς τεῖχος τῶν ποιμνῶν, καὶ ἐν μέσῳ τῶν δύο²² κεράτων ἐξεβλάστησε²³ ἄλλο κέρας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/006.yaml
  text: And from the fourth bull its horns went up as far as heaven and became like a wall of the flocks, and in the midst of the two horns another horn sprouted.
translation:
  language: hi
  text: और चौथे बैल के सींग आकाश तक उठे और झुंडों की दीवार के समान हो गए; और दोनों सींगों के बीच एक और सींग फूट निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ τετάρτου βοὸς
  choice: चौथे बैल के
  rationale: संबंधकारक पदबंध को स्वाभाविक हिन्दी में रखा गया है; आगे के ‘सींग’ इसी बैल के हैं।
- source_word: μέχρι τοῦ οὐρανοῦ
  choice: आकाश तक
  rationale: ऊँचाई की अंतिम सीमा को स्रोत के अनुरूप संक्षिप्त और स्पष्ट रूप में व्यक्त करता है।
- source_word: ὡς τεῖχος τῶν ποιμνῶν
  choice: झुंडों के लिए दीवार के समान
  rationale: τεῖχος की रक्षात्मक छवि ‘दीवार’ से बनी रहती है। यूनानी संबंधकारक τῶν ποιμνῶν को प्रसंगानुकूल लाभार्थक अर्थ में ‘झुंडों के लिए’ कहा गया है, बिना झुंडों का प्रकार जोड़े।
- source_word: ἐν μέσῳ τῶν δύο κεράτων
  choice: उन दोनों सींगों के बीच
  rationale: स्थान-संबंध को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐξεβλάστησε
  choice: फूट निकला
  rationale: क्रिया की वनस्पतिक ‘अंकुरित होने’ वाली सजीव छवि को सींग के संदर्भ में सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दर्शन में चौथे बैल, झुंडों और सींगों की पहचान
  choice: प्रतीकों को बिना व्याख्यात्मक पहचान दिए ज्यों का त्यों रखा गया
  alternative: इन प्रतीकों को किसी विशेष ऐतिहासिक व्यक्ति, समुदाय या मसीही व्यक्तित्व से स्पष्टतः जोड़ना
  rationale: इस पद का यूनानी पाठ स्वयं प्रतीकों की पहचान नहीं बताता; अनुवाद में किसी संप्रदायगत या निजी व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण और दर्शनात्मक शैली अपनाई गई है। वाक्य की समानांतर संरचना तथा ‘दीवार’ और ‘फूट निकला’ की मूल बिंबात्मकता सुरक्षित रखी गई है।
