  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/007.yaml
  text: And I saw a calf that encircled them twelve times, and it became wholly a help to the bulls.
translation:
  language: hi
  text: और मैंने एक बछड़ा देखा, जिसने उनके चारों ओर बारह बार चक्कर लगाया, और वह बैलों के लिए पूरी तरह[a] सहायक बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूरी तरह’ के लिए यूनानी पाठ संपादक द्वारा संदिग्ध चिह्नित है।
    reason: मूल संस्करण में ὁλοκλήρως के बाद प्रश्नचिह्न है, जो पाठ या पठन के प्रति संपादकीय अनिश्चितता दर्शाता है।
lexical_decisions:
- source_word: μόσχον
  choice: बछड़ा
  rationale: यूनानी शब्द यहाँ कम उम्र के गोवंश को दर्शाता है; ‘बछड़ा’ सहज और प्रसंगानुकूल है।
- source_word: δωδεκάκις περιέβαλλε αὐτούς
  choice: उन्हें बारह बार घेर लिया
  rationale: ‘बारह बार’ और घेरने की क्रिया को बिना प्रतीकात्मक अर्थ जोड़े सीधे सुरक्षित रखा गया है।
- source_word: τοῖς βουσὶ
  choice: बैलों के लिए
  rationale: बहुवचन βουσὶ का संदर्भ यहाँ पहले वर्णित गोवंश से है; अंग्रेज़ी परामर्श-पाठ के अनुरूप ‘बैलों’ चुना गया है।
- source_word: ὁλοκλήρως εἰς βοήθειαν
  choice: पूरी तरह सहायक
  rationale: ὁλοκλήρως की समग्रता और εἰς βοήθειαν के सहायता-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बछड़े और बैलों की प्रतीकात्मक पहचान
  choice: प्रतीकों की पहचान बताए बिना दृश्य को यथावत रखा गया
  alternative: बछड़े या बैलों को किसी विशिष्ट व्यक्ति अथवा समूह के रूप में स्पष्ट करना
  rationale: पद स्वयं प्रतीकों की पहचान नहीं खोलता; व्याख्यात्मक या सांप्रदायिक निष्कर्ष अनुवाद में जोड़ना उचित नहीं है।
- issue: सहायता की सीमा
  choice: ‘पूरी तरह सहायक’
  alternative: ‘उन सबका उद्धारकर्ता’ या ‘पूर्ण सहायता’
  rationale: मूल βοήθεια सहायता को व्यक्त करता है, अनिवार्य रूप से उद्धार को नहीं; इसलिए धर्मवैचारिक विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। वाक्य की पुनरावृत्त संयोजक संरचना मूल के निकट है, पर हिन्दी में स्वाभाविक क्रम अपनाया गया है।
