id: T12P.JOS.19.12
reference: Testament of Joseph 19:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/012.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman's hut after the summer, vanishing away.
translation:
  language: hi
  text: क्योंकि उसका राज्य सदा रहनेवाला राज्य होगा, जो कभी समाप्त नहीं होगा। पर तुम्हारे बीच मेरा राज्य पूर्ण किया जाएगा, जैसे ग्रीष्म ऋतु[a] के बाद फलों की रखवाली करने वाले की झोंपड़ी[b] लुप्त हो जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कटनी के बाद।” यूनानी शब्द का अर्थ “ग्रीष्म ऋतु” अथवा फसल काटने का समय हो सकता है।
    reason: θέρος की वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: इस शब्द के बाद उपलब्ध यूनानी पाठ में कुछ अक्षर अस्पष्ट हैं; वे अनुवाद में नहीं लिए गए हैं।
    reason: मुद्रित यूनानी स्रोत में ὀπωροφυλάκιον के बाद ⌜γος⌉ के रूप में चिह्नित संदिग्ध पाठ के प्रति पाठक को सचेत करना।
lexical_decisions:
- source_word: βασιλεία αὐτοῦ
  choice: उसका राज्य
  rationale: सर्वनाम की मूल अस्पष्टता को बनाए रखा गया है; पद स्वयं यह स्पष्ट नहीं करता कि ‘उसका’ किसे सूचित करता है।
- source_word: βασιλεία ἔσται αἰώνιος
  choice: सदा रहनेवाला राज्य होगा
  rationale: αἰώνιος के स्थायित्व को सहज आधुनिक हिन्दी में व्यक्त करता है और अगले उपवाक्य के साथ अनावश्यक शब्द-दोहराव से बचता है।
- source_word: οὐ παρελεύσεται
  choice: कभी समाप्त नहीं होगा
  rationale: राज्य के न मिटने या न टलने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: बहुवचन ὑμῖν के सामुदायिक अर्थ को सीधे व्यक्त करता है।
- source_word: ἐπιτελεῖται
  choice: अपनी पूर्णता पर पहुँचेगा
  rationale: क्रिया के ‘पूरा किया जाना/पूर्ण होना’ भाव को सुरक्षित रखता है; इसे केवल ‘अन्त हो जाएगा’ कहकर उसके अर्थ को संकुचित नहीं करता।
- source_word: ὀπωροφυλάκιον
  choice: रखवाले की झोंपड़ी
  rationale: यह खेत या फल-बगीचे की रखवाली के लिए बनी अस्थायी कुटिया को सूचित करता है; संक्षिप्त और बोधगम्य हिन्दी चुनी गई है।
- source_word: μετὰ τὸ θέρος
  choice: ग्रीष्म ऋतु के बाद
  rationale: θέρος का मूल ऋतु-संबंधी अर्थ रखा गया है, जबकि उसके सम्भावित ‘कटनी’ अर्थ को पादटिप्पणी में बताया गया है।
- source_word: ἐξαφανίζεται
  choice: लुप्त हो जाएगा
  rationale: पूरी तरह ओझल या गायब हो जाने के प्रबल अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ‘उसका राज्य’ की पहचान
  choice: सर्वनाम को ‘उसका’ ही रखा गया
  alternative: किसी विशिष्ट मसीही या अन्य व्यक्ति का नाम जोड़ना
  rationale: यूनानी पद में केवल αὐτοῦ है; संदर्भ से बाहर किसी पहचान को निश्चित करना मूल की वास्तविक अस्पष्टता को मिटा देता।
- issue: यूसुफ के राज्य का परिणाम
  choice: ‘अपनी पूर्णता पर पहुँचेगा’
  alternative: ‘समाप्त हो जाएगा’
  rationale: ἐπιτελεῖται में पूर्णता और परिणति दोनों की सम्भावना है। अनुवाद पूर्णता का भाव रखता है, जबकि आगे का ‘लुप्त हो जाएगा’ उसके समाप्त होने का परिणाम स्पष्ट कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सदा रहनेवाला’, ‘अपनी पूर्णता पर पहुँचेगा’ और ‘लुप्त हो जाएगा’ मूल के स्थायित्व, परिणति और विलुप्ति के परस्पर विरोध को स्पष्ट रखते हैं।
