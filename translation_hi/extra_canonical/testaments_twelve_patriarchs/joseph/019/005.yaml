source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ¹⁸ μετὰ ταῦτα ἑώρων *καὶ ἰδοὺ¹⁵ δώδεκα βόες θηλάζοντες¹⁹ μίαν δάμαλιν, ἢ ἐκ²⁰ . . . γάλακτος θάλασσαν ἐποίει καὶ ἔπινον ἐξ αὐτοῦ²¹ αἱ δώδεκα ποίμναι καὶ ἀνηρίθμητα ποίμνια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/005.yaml
  text: And after these things I saw, and behold, twelve bulls suckling one heifer, and it made a sea of milk, and the twelve flocks and innumerable flocks drank from it.
translation:
  language: hi
  text: इन बातों के बाद मैंने देखा—और देखो, बारह बैल एक ही बछिया का दूध पी रहे थे। वहाँ दूध का एक समुद्र बन रहा था,[a] और बारह झुंडों और अनगिनत झुंडों ने उसमें से पिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्यांश का यूनानी पाठ कुछ खंडित और अनिश्चित है। शाब्दिक रूप से उसमें ‘दूध का समुद्र बना रहा था’ कहा गया है, पर बनाने वाला कर्ता स्पष्ट नहीं है; इसका अर्थ यह भी हो सकता है कि बछिया ने दूध का समुद्र बना दिया।
    reason: δάμαλιν के बाद उपलब्ध यूनानी पाठ में रिक्ति है; इसलिए ἐποίει के कर्ता की पहचान निश्चित नहीं की जा सकती।
lexical_decisions:
- source_word: βόες
  choice: बैल
  rationale: यहाँ बारह नर गोवंश के लिए सहज और विशिष्ट हिन्दी शब्द; दृश्य की असामान्यता को बनाए रखता है।
- source_word: δάμαλιν
  choice: बछिया
  rationale: युवा मादा गोवंश के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θηλάζοντες
  choice: दूध पी रहे थे
  rationale: शाब्दिक ‘स्तनपान कर रहे थे’ की अपेक्षा पशुओं के संदर्भ में अधिक स्वाभाविक, पर अर्थतः निकट।
- source_word: ποίμναι / ποίμνια
  choice: झुंड / दूसरे झुंड
  rationale: ग्रीक शब्द भेड़ों तक सीमित नहीं है; व्यापक पशु-समूह का अर्थ रखते हुए बारह और अनगिनत समूहों का भेद स्पष्ट किया गया है।
- source_word: θάλασσαν
  choice: समुद्र
  rationale: दूध की विशाल मात्रा के सशक्त रूपक को ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: दूध का समुद्र बनाने वाले कर्ता की पहचान
  choice: उस बछिया ने
  alternative: वहाँ दूध का एक समुद्र बन गया / उसने दूध का एक समुद्र बना दिया
  rationale: ἐποίει एकवचन है और निकटतम स्त्रीलिंग संज्ञा δάμαλιν की ओर संकेत कर सकता है; फिर भी आसपास का यूनानी पाठ क्षतिग्रस्त/अनिश्चित है, इसलिए अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, दृश्यात्मक और सामान्य पाठक के लिए सहज शैली। ‘और देखो’ ने मूल के दर्शन-वर्णन का अचानक उभरता बल बनाए रखा है; असामान्य पशु-चित्र को सामान्य बनाने का प्रयास नहीं किया गया।
