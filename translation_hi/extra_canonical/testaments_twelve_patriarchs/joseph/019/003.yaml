source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἑώρων ὅτι τρεῖς¹⁴ ἔλαφοι τρεῖς ἀμνοὶ ἐγίνοντο καὶ ἐβόησαν πρὸς Κύριον καὶ ἐξήγαγε αὐτοὺς Κύριος¹⁵ εἰς τόπον εὐθαλῆ καὶ ἔνυδρον, καὶ ἤγαγε¹⁶ αὐτοὺς ἐκ σκότους εἰς φῶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/003.yaml
  text: And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord brought them out to a flourishing and well-watered place, and brought them from darkness into light.
translation:
  language: hi
  text: और मैंने देखा कि वे तीन हिरन तीन मेमने बन गए। उन्होंने प्रभु को पुकारा, और प्रभु उन्हें निकालकर हरे-भरे और जल से भरपूर स्थान में ले गया; और प्रभु उन्हें अंधकार से प्रकाश में ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: हिरन
  rationale: यह सामान्य और सहज आधुनिक हिन्दी शब्द यूनानी बहुवचन का स्वाभाविक अर्थ देता है।
- source_word: ἀμνοὶ
  choice: मेमने
  rationale: यह ἀμνός के अर्थ ‘भेड़ के बच्चे’ को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἐβόησαν πρὸς Κύριον
  choice: उन्होंने प्रभु को पुकारा
  rationale: βοάω की तीव्र पुकार और πρὸς के लक्ष्य को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐξήγαγε
  choice: निकालकर ... ले गया
  rationale: क्रिया में निहित ‘बाहर निकालने’ की गति को बनाए रखता है और अगले गंतव्य के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: εὐθαλῆ καὶ ἔνυδρον
  choice: हरे-भरे और जल से भरपूर
  rationale: εὐθαλής की फलती-फूलती हरियाली और ἔνυδρος की जल-समृद्धि दोनों को स्पष्ट, चित्रात्मक हिन्दी में रखता है।
- source_word: ἐκ σκότους εἰς φῶς
  choice: अंधकार से प्रकाश में
  rationale: मूल रूपक और उसके संभावित आध्यात्मिक अर्थ को बिना व्याख्या जोड़े ज्यों का त्यों सुरक्षित रखता है।
theological_decisions:
- issue: अंधकार से प्रकाश की ओर लाए जाने का आशय
  choice: रूपक को बिना विस्तार के सुरक्षित रखा गया
  alternative: इसे पाप से उद्धार या अज्ञान से ज्ञान के रूप में स्पष्ट करना
  rationale: यूनानी पाठ स्वयं व्याख्या नहीं देता; इसलिए उसकी वास्तविक अर्थगत और धर्मवैचारिक व्यापकता को सीमित नहीं किया गया।
- issue: κύριος की पुनरावृत्ति
  choice: दोनों स्थानों पर ‘प्रभु’ रखा गया
  alternative: दूसरे उल्लेख में केवल ‘वह’ कहना
  rationale: मूल पाठ की स्पष्ट पुनरावृत्ति और कर्ता की पहचान को बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज और कथात्मक शैली। वाक्य-विन्यास को हिन्दी की स्वाभाविकता के अनुसार ढाला गया है, जबकि दृश्यात्मक रूपक और मूल क्रियाओं की दिशा सुरक्षित रखी गई है।
