  text: Ταῦτα δὲ³⁶ γενήσεται ἐν καιρῷ αὐτῶν³⁷ ἐν ἐσχάταις ἡμέραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/010.yaml
  text: But these things will happen in their time, in the last days.
translation:
  language: hi
  text: पर ये बातें उनके समय में, अन्तिम दिनों में घटित होंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन सर्वनाम को प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ हल्के विरोध अथवा कथन के संक्रमण को दर्शाता है; इसे अत्यधिक प्रबल विरोध नहीं बनाया गया।
- source_word: γενήσεται
  choice: घटित होंगी
  rationale: भविष्यकालीन ‘होंगी/घटेंगी’ का अर्थ देता है; मूल पाठ में अनिवार्यता का भाव नहीं जोड़ा गया।
- source_word: ἐν καιρῷ αὐτῶν
  choice: उनके समय में
  rationale: αὐτῶν के बहुवचन संबंधसूचक भाव को बनाए रखता है और ‘नियत’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: अन्तिम दिनों में
  rationale: मूल यूनानी के पारंपरिक कालगत पदबंध का सीधा और सुबोध अनुवाद है।
theological_decisions:
- issue: ‘अन्तिम दिनों’ का कालगत अर्थ
  choice: अन्तिम दिनों में
  alternative: अन्त के दिनों में
  rationale: मूल की युगांत-संबंधी भाषा को बिना उसकी अवधि या सटीक पहचान निर्धारित किए सुरक्षित रखा गया।
- issue: घटना की अनिवार्यता
  choice: घटित होंगी
  alternative: अवश्य घटित होंगी
  rationale: प्रदत्त यूनानी γενήσεται साधारण भविष्य को व्यक्त करता है; ‘अवश्य’ जोड़ना मूल से अधिक बल देना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट शैली। दो कालगत पदबंधों को अलग रखा गया है ताकि मूल पाठ की संरचना और संभावित अर्थगत तनाव बना रहे।
