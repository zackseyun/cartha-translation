id: T12P.JOS.19.8
reference: Testament of Joseph 19:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ εἶδον²⁶ *ὅτι [ἐκ τοῦ Ἰούδα ἐγεννήθη] †παρθένος, [ἔχουσα στολὴν βυσσίνην, καὶ ἐξ αὐτῆς] ἐγεννήθη ἀμνὸς [ἄμωμος]²⁷ *καὶ ἦν²⁸ ἐξ ἀριστερῶν αὐτοῦ ὡς λέων· καὶ πάντα τὰ θηρία ὥρμων³⁰ *κατ᾽ αὐτοῦ³¹ καὶ ἐνίκησεν αὐτὰ ὁ ἀμνός, καὶ ἀπώλεσεν *αὐτὰ εἰς καταπάτημα³².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/008.yaml
  text: And I saw that [from Judah was born] a virgin, [wearing a robe of fine linen, and from her] a [blameless] lamb was born; and on his left there was, as it were, a lion; and all the beasts were rushing against him, and the lamb overcame them and destroyed them for trampling.
translation:
  language: hi
  text: और मैंने देखा कि [यहूदा से] एक कुँवारी उत्पन्न हुई[a], [जो महीन सन का वस्त्र पहने हुए थी, और उससे] एक [निर्दोष] मेमना उत्पन्न हुआ[b]। और उसके बाईं ओर मानो एक सिंह था; और सब जंगली पशु उस पर झपट रहे थे, और मेमने ने उन्हें पराजित किया और उन्हें पैरों तले रौंदे जाने के लिए उनका विनाश कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहूदा से’ शब्द प्रदत्त यूनानी संस्करण में वर्ग कोष्ठकों में हैं, जो उनकी पाठगत अनिश्चितता को दर्शाते हैं।
    reason: स्रोत संस्करण की संपादकीय कोष्ठक-चिह्नित सामग्री को पारदर्शी बनाना।
  - marker: b
    text: ‘जो महीन सन का वस्त्र पहने हुए थी, और उससे’ तथा ‘निर्दोष’ प्रदत्त यूनानी संस्करण में वर्ग कोष्ठकों में हैं।
    reason: मुख्य पाठ को बोझिल किए बिना शेष कोष्ठकित सामग्री की पाठगत स्थिति बताना।
lexical_decisions:
- source_word: παρθένος
  choice: कुँवारी
  rationale: यह सामान्य और गरिमापूर्ण हिन्दी शब्द यूनानी में अविवाहित/कौमार्ययुक्त युवती के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: στολὴν βυσσίνην
  choice: महीन मलमल का वस्त्र
  rationale: βύσσινος उच्च कोटि के महीन सन-वस्त्र को सूचित करता है; ‘महीन मलमल’ साधारण पाठक के लिए सहज है और वस्त्र की उत्कृष्ट महीनता बनाए रखता है।
- source_word: ἀμνὸς ἄμωμος
  choice: निर्दोष मेमना
  rationale: ἀμνός के लिए ‘मेमना’ और ἄμωμος के लिए ‘निर्दोष’ चुना गया है; इससे बलि-संबंधी निष्कलंकता का संकेत बना रहता है, पर कोई अतिरिक्त व्याख्या नहीं जोड़ी जाती।
- source_word: ἐξ ἀριστερῶν αὐτοῦ ὡς λέων
  choice: उसके बाईं ओर मानो एक सिंह था
  rationale: वाक्यांश को उसके स्थानगत और तुलनात्मक अर्थ में रखा गया है; सिंह को झपटने वाले पशुओं से मिलाया या ‘झपट पड़ा’ नहीं बनाया गया।
- source_word: ὥρμων κατ᾽ αὐτοῦ
  choice: उस पर झपट रहे थे
  rationale: अपूर्णकाल निरंतर/प्रगतिशील आक्रमण दिखाता है; ‘झपट रहे थे’ उस गति और विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπώλεσεν αὐτὰ εἰς καταπάτημα
  choice: उनका नाश करके उन्हें पैरों तले रौंदे जाने के लिए डाल दिया
  rationale: शाब्दिक रूप से कठिन उद्देश्य/परिणाम-वाचक εἰς καταπάτημα को सुरक्षित रखा गया है; इसे सीधे ‘उसने उन्हें रौंद डाला’ बनाकर क्रिया का आशय नहीं बदला गया।
theological_decisions:
- issue: कुँवारी, मेमने और सिंह की पहचान
  choice: प्रतीकों को बिना नाम दिए उसी रूप में रखा गया है
  alternative: कुँवारी को मरियम, मेमने को मसीह, या सिंह को किसी निश्चित व्यक्ति/गोत्र के रूप में स्पष्ट करना
  rationale: पद स्वयं इन प्रतीकों की व्याख्या नहीं करता; किसी विशिष्ट धर्मवैज्ञानिक पहचान को पाठ में जोड़ना मूल की अर्थगत खुली जगह को समाप्त कर देता।
- issue: ‘यहूदा से’, वस्त्र-वर्णन और ‘निर्दोष’ की पाठगत स्थिति
  choice: इन शब्दों को मुख्य पाठ में वर्ग कोष्ठकों सहित रखा और पादटिप्पणियों में उनकी संपादकीय स्थिति बताई गई है
  alternative: उन्हें बिना संकेत के पूर्णतः स्वीकार करना या मुख्य पाठ से हटा देना
  rationale: प्रदत्त यूनानी संस्करण इन्हें वर्ग कोष्ठकों में देता है; इसलिए उनके अर्थ को बचाते हुए पाठगत अनिश्चितता भी दिखाई जानी चाहिए।
- issue: सिंह और आक्रमणकारी पशुओं के बीच संबंध
  choice: सिंह केवल मेमने के बाईं ओर विद्यमान बताया गया है; आक्रमण सब जंगली पशु करते हैं
  alternative: सिंह को झपटता हुआ दिखाना या उसे आक्रमणकारी पशुओं का अगुवा मानना
  rationale: ὥρμων का स्पष्ट कर्ता πάντα τὰ θηρία है; उसे सिंह पर स्थानांतरित करना यूनानी वाक्यरचना को बदल देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। वाक्य-संयोजन मूल के क्रम के निकट है, जबकि ‘मानो’, ‘झपट रहे थे’ और अंतिम उद्देश्य-वाक्यांश को सहज हिन्दी में रखा गया है। वर्ग कोष्ठक स्रोत-संपादन की अनिश्चितता दर्शाते हैं, पादटिप्पणी-चिह्न उसी मुख्य पाठ में दिए गए हैं।
