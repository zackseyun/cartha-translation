translation:
  language: hi
  text: और स्वर्गदूत, मनुष्य और सारी पृथ्वी उसके कारण आनन्दित हो रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον
  choice: आनन्दित हुए
  rationale: यूनानी क्रिया का अर्थ प्रसन्न या आनन्दित होना है; बहुवचन कर्ताओं के साथ सहज आधुनिक हिन्दी रूप चुना गया।
- source_word: ἐπ᾽ αὐτῷ
  choice: उसके कारण
  rationale: ἐπί के दत्तिव प्रयोग में यहाँ आनन्द का आधार या कारण व्यक्त होता है; ‘उस पर’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है, जबकि व्यक्ति-संदर्भ बना रहता है।
- source_word: οἱ ἄγγελοι
  choice: स्वर्गदूत
  rationale: ἄγγελοι के धार्मिक संदर्भ का प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: οἱ ἄνθρωποι
  choice: मनुष्य
  rationale: सामूहिक अर्थ में सभी मानवों को व्यक्त करता है और मूल के सामान्य पद को अनावश्यक रूप से सीमित नहीं करता।
- source_word: πᾶσα ἡ γῆ
  choice: सारी पृथ्वी
  rationale: मूल के व्यापक, सृष्टिगत कथन को यथावत रखता है; इसे केवल पृथ्वी के निवासियों तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘सारी पृथ्वी’ का व्यक्तिकरण
  choice: सारी पृथ्वी उसके कारण आनन्दित हुई
  alternative: पृथ्वी के सभी लोग उसके कारण आनन्दित हुए
  rationale: मूल पाठ पृथ्वी को स्वयं आनन्दित होने वाली बताता है। उसके काव्यात्मक और सृष्टिगत विस्तार को किसी व्याख्यात्मक मानवीय अर्थ में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज अनुवाद। संयुक्त कर्ताओं के कारण अंतिम क्रिया बहुवचन में रखी गई है; ‘सारी पृथ्वी’ का मूल काव्यात्मक व्यक्तिकरण सुरक्षित है।
