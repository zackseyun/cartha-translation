source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὁ γὰρ πένης³², ἐὰν ἄφθονος ἐπὶ πᾶσι Κυρίῳ εὐαρεστῇ³³, οὗτος³⁴ *ὑπὲρ πάντας³⁵ †πλουτεῖ³⁶, ὅτι οὐκ ἔχει τὸν *περισπασμὸν τῶν ματαίων ἀνθρώπων³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/006.yaml
  text: For the poor man, if being free from envy in all things he is pleasing to the Lord, this one is richer than all, because he does not have the distraction of vain people.
translation:
  language: hi
  text: क्योंकि निर्धन व्यक्ति, यदि वह हर बात में उदार रहकर प्रभु को प्रसन्न करता है,[a] तो वह सबसे अधिक धनी है, क्योंकि उसे व्यर्थ लोगों की उलझन नहीं होती।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हर बात में उदार रहकर” का अनुवाद “सब बातों में भरपूर रहकर” या “हर बात में ईर्ष्या से रहित रहकर” भी किया जा सकता है।
    reason: ἄφθονος के अर्थ में उदार, प्रचुर, या ईर्ष्या/कृपणता से रहित होने की संभावनाएँ हैं; ἐπὶ πᾶσι का दायरा ‘हर बात में’ है।
  - marker: b
    text: 'शाब्दिक रूप में: “व्यर्थ लोगों की उलझन।”'
    reason: यह स्पष्ट नहीं है कि ‘व्यर्थ’ विशेषण लोगों के चरित्र, उनके प्रयत्नों, या उनसे संबद्ध उलझन के मूल्यांकन पर कितना बल देता है।
lexical_decisions:
- source_word: πένης
  choice: निर्धन व्यक्ति
  rationale: यह सामान्य आर्थिक अभाव में रहनेवाले व्यक्ति को सूचित करता है; ‘निर्धन’ आधुनिक, गरिमापूर्ण और स्पष्ट है।
- source_word: ἄφθονος
  choice: उदार
  rationale: इस संदर्भ में शब्द का अर्थ कृपणता या रोक-टोक से रहित, अर्थात उदार होना अधिक स्वाभाविक है। ‘भरपूर’ संभव है, पर निर्धन व्यक्ति और उसके नैतिक आचरण के विरोधाभास में ‘उदार’ बेहतर बैठता है।
- source_word: ἐπὶ πᾶσι
  choice: सबके प्रति
  rationale: पूर्वसर्गीय पद को व्यक्ति-संबंधी दायरे के रूप में समझा गया है। व्याकरणतः ‘सब बातों में’ भी संभव है, इसलिए अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: εὐαρεστῇ
  choice: प्रभु को प्रसन्न करता है
  rationale: दत्तिव Κυρίῳ के साथ यह प्रभु को स्वीकार्य या प्रसन्न करनेवाले आचरण का बोध कराता है।
- source_word: ὑπὲρ πάντας πλουτεῖ
  choice: सबसे अधिक धनी है
  rationale: 'तुलनात्मक आशय को स्वाभाविक हिन्दी में व्यक्त करता है: निर्धन होते हुए भी वह दूसरों से बढ़कर वास्तविक संपन्नता रखता है।'
- source_word: περισπασμὸν
  choice: उलझन
  rationale: शब्द ध्यान बँटानेवाली चिंता, व्यस्तता या खिंचाव का भाव रखता है; ‘उलझन’ आधुनिक हिन्दी में इस व्यापक अर्थ को सहजता से व्यक्त करता है।
- source_word: ματαίων ἀνθρώπων
  choice: व्यर्थ जीवन जीनेवाले लोग
  rationale: शाब्दिक ‘व्यर्थ मनुष्य’ हिन्दी में अस्वाभाविक है। यह रूप उनके जीवन या प्रयत्नों की निष्फलता को व्यक्त करता है, उनके मानवीय मूल्य को नकारता नहीं।
theological_decisions:
- issue: निर्धनता और वास्तविक धन का संबंध
  choice: ‘सबसे अधिक धनी’ रखकर नैतिक-आत्मिक विरोधाभास को खुला रखा गया है।
  alternative: इसे स्पष्ट करके ‘आत्मिक रूप से सबसे धनी’ कहना।
  rationale: मूल पाठ धन का प्रकार स्पष्ट नहीं करता; ‘आत्मिक रूप से’ जोड़ने पर निहितार्थ को अनावश्यक रूप से निश्चित कर दिया जाता।
- issue: ἄφθονος का अर्थ
  choice: ‘उदार’—कृपणता से रहित।
  alternative: ‘सब बातों में भरपूर’ या ‘ईर्ष्या से रहित’।
  rationale: शब्द उदारता/बिना रोक दिए देने का अर्थ रख सकता है। यहाँ निर्धन व्यक्ति का उदार होना कथन के विरोधाभास और अगले ‘धनी’ से अर्थपूर्ण संबंध बनाता है; फिर भी वैकल्पिक व्याकरणिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। वाक्य का ज्ञानोक्तिपरक विरोधाभास बनाए रखा गया है और अस्पष्ट स्थलों को मुख्य पाठ में जबरन निश्चित करने के बजाय पादटिप्पणियों में दर्शाया गया है।
