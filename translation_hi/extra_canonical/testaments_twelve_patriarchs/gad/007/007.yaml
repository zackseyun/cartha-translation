translation:
  language: hi
  text: इसलिए अपने-अपने मन से घृणा निकाल फेंको और निष्कपट हृदय से एक-दूसरे से प्रेम करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχῶν
  choice: मनों
  rationale: यहाँ बहुवचन ψυχαί व्यक्ति के भीतरी भाव-जगत को सूचित करता है, जहाँ घृणा बसती है; आधुनिक हिन्दी में ‘मन’ इस आशय को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: μῖσος
  choice: घृणा
  rationale: ग्रीक शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य, जो वैरपूर्ण आंतरिक भाव को बनाए रखता है।
- source_word: Ἐξάρατε
  choice: निकाल फेंको
  rationale: आज्ञार्थक क्रिया में किसी वस्तु को पूरी तरह दूर कर देने का बल है; ‘निकाल फेंको’ उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν εὐθύτητι καρδίας
  choice: निष्कपट हृदय से
  rationale: εὐθύτης का मूल भाव सीधापन और ईमानदार निष्कपटता है। यह प्रयोग प्रेम की आंतरिक सच्चाई को सहज आधुनिक हिन्दी में व्यक्त करता है।
