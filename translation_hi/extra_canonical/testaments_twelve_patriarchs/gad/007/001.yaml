review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast, the comparative sense of someone prospering beyond the hearers, the prohibition against grief, intercession for that person, and the concluding benefit. The passive form of τελειωθῇ should be retained without specifying the agent.
  naturalness: The overall Hindi is clear and appropriately dignified. However, ‘वह सिद्ध किया जाए’ is less natural in modern standard Hindi and can suggest being proved or demonstrated rather than being made complete.
  terminology: ‘उन्नति करे,’ ‘प्रार्थना करो,’ and ‘भला’ are suitable. Replacing ‘सिद्ध किया जाए’ with ‘पूर्ण बनाया जाए’ better reflects τελειωθῇ while retaining the source’s passive construction and leaving the agent unspecified.
  issues:
  - severity: medium
    issue: ‘सिद्ध किया जाए’ for τελειωθῇ
    rationale: In current Hindi, ‘सिद्ध किया जाए’ commonly has the sense ‘be proved/established’ and is not the clearest expression of being made complete. ‘पूर्ण बनाया जाए’ more directly conveys completion and preserves the passive ambiguity of the Greek.
  revised_text: पर यदि कोई तुमसे अधिक उन्नति करे, तो दुःखी न हो; बल्कि उसके लिए प्रार्थना करो कि वह पूर्ण बनाया जाए। क्योंकि इसी में तुम्हारा भला है।
