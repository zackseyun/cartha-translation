id: T12P.GAD.7.1
reference: Testament of Gad 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/001.yaml
  text: But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be made complete. For in this way it is to your advantage.
translation:
  language: hi
  text: पर यदि कोई तुमसे अधिक उन्नति करे, तो दुःखी न हो; बल्कि उसके लिए प्रार्थना करो कि वह पूर्ण बनाया जाए। क्योंकि इसी में तुम्हारा भला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐοδοῦται
  choice: उन्नति करे
  rationale: क्रिया का मूल भाव सफल होने या समृद्धि पाने का है; ‘उन्नति करे’ आधुनिक हिन्दी में व्यापक है और इसे केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: μὴ λυπεῖσθε
  choice: दुःखी न हो
  rationale: यह दूसरों की उन्नति पर शोक या मनस्ताप न करने की सीधी निषेधाज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: उसके लिए प्रार्थना करो
  rationale: ὑπέρ के हितार्थ भाव और εὔχεσθε के प्रार्थना-संबंधी अर्थ को सीधे सुरक्षित रखता है।
- source_word: τελειωθῇ
  choice: सिद्ध किया जाए
  rationale: निष्क्रिय विधिलिंग के ‘पूर्णता तक पहुँचाए जाने’ के भाव को बनाए रखता है; ‘सिद्ध’ यहाँ नैतिक या व्यक्तित्वगत पूर्णता के अर्थ को खुला रखता है।
- source_word: συμφέρον
  choice: भला
  rationale: लाभकारी या हितकर होने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल भौतिक लाभ मानने के।
theological_decisions:
- issue: τελειωθῇ में पूर्णता का स्वरूप और कर्ता
  choice: सिद्ध किया जाए
  alternative: वह पूर्ण हो जाए
  rationale: यूनानी निष्क्रिय रूप को सुरक्षित रखा गया है और यह तय नहीं किया गया कि सिद्ध करने वाला स्पष्टतः परमेश्वर है या कोई प्रक्रिया; इस प्रकार मूल की धार्मिक अस्पष्टता बनी रहती है।
- issue: ‘इसी में तुम्हारा भला है’ का आशय
  choice: क्योंकि इसी में तुम्हारा भला है
  alternative: क्योंकि इस प्रकार यह तुम्हारे लिए लाभकारी है
  rationale: मूल कथन यह स्पष्ट नहीं करता कि दूसरे की सिद्धता, उसके लिए प्रार्थना करना, या पूरी बताई गई रीति किस प्रकार हितकर है; हिन्दी में भी इस संबंध को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन अनिर्दिष्ट व्यक्ति के लिए ‘कोई’ और सामूहिक श्रोताओं के लिए प्रसंगानुकूल सामान्य ‘तुम’ शैली अपनाई गई है।
