  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/003.yaml
  text: Examine the judgments of the Lord, and your purpose will be illumined and be at rest.
translation:
  language: hi
  text: प्रभु के निर्णयों को परखो, और तुम्हारा उद्देश्य आलोकित होगा और शांत होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξέτασον
  choice: परखो
  rationale: यह क्रिया ध्यानपूर्वक जाँचने और विचार करने का भाव रखती है; ‘परखो’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: κρίματα Κυρίου
  choice: प्रभु के निर्णयों
  rationale: κρίματα न्यायिक निर्णयों, विधानों या न्यायपूर्ण कार्यों को सूचित कर सकता है। ‘निर्णयों’ मूल की बहुवचनता और व्यापकता बनाए रखता है।
- source_word: καταλάμψει
  choice: प्रकाश पाएगा
  rationale: पाठ में भविष्यकालीन प्रकाश या आलोकित होने का भाव है। ‘प्रकाश पाएगा’ हिन्दी में उद्देश्य/संकल्प के स्पष्ट या आलोकित होने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ διαβούλιόν σου
  choice: तुम्हारा संकल्प
  rationale: διαβούλιον विचार, योजना, अभिप्राय या संकल्प का अर्थ दे सकता है। ‘संकल्प’ यहाँ मन में ठहरे उद्देश्य को व्यक्त करता है, पर अस्पष्टता को पूरी तरह किसी विशिष्ट अर्थ में सीमित नहीं करता।
- source_word: ἡσυχάσει
  choice: शांत हो जाएगा
  rationale: यह शांत, स्थिर या विश्राम में आने का भाव देता है। ‘शांत हो जाएगा’ मूल के भविष्यकाल और मानसिक स्थिरता दोनों को बनाए रखता है।
theological_decisions:
- issue: κρίματα को दंड, आज्ञा या न्यायपूर्ण निर्णय के रूप में समझना
  choice: निर्णयों
  alternative: न्याय-विधानों
  rationale: ‘निर्णयों’ किसी एक धार्मिक-वैधानिक अर्थ को थोपे बिना प्रभु के न्यायिक निर्णयों और विधानों की संभावित अर्थ-सीमा को खुला रखता है।
- issue: διαβούλιον का नैतिक उद्देश्य या मानसिक विचार-विमर्श
  choice: संकल्प
  alternative: विचार
  rationale: ‘संकल्प’ व्यक्ति की सोची हुई दिशा या उद्देश्य को व्यक्त करता है और अंग्रेज़ी परामर्श-पाठ के ‘purpose’ से भी मेल खाता है; फिर भी इसे किसी विशिष्ट सिद्धान्त से नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी आज्ञार्थक शैली अपनाई गई है। वाक्य की समानांतर भविष्यकालीन संरचना सुरक्षित रखी गई है। ग्रीक संस्करण में चिह्नित पाठ-संदेहों के लिए दिए गए अंकीय संकेतों की सामग्री उपलब्ध नहीं थी, इसलिए बिना आधार कोई पाठालोचनात्मक पादटिप्पणी नहीं जोड़ी गई।
