  text: For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment.
translation:
  language: hi
  text: क्योंकि यदि बुराई से ली गई वस्तुएँ उससे ले ली जाती हैं,[a] या यदि वह पश्चाताप करता है, तो उसे क्षमा कर दिया जाता है; पर यदि वह पश्चाताप नहीं करता, तो उसे अनन्त दण्ड के लिए रखा जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह यूनानी वाक्य पाठगत और व्याकरणिक रूप से कठिन है। इसका अर्थ यह भी हो सकता है: “यदि वह उन्हें बुराई से छीन लेता है, तो पश्चाताप करने पर उन्हें छोड़ देता या लौटा देता है।”'
    reason: ἀφαιρεῖται, αὐτά, μετανοήσαντι और ἀφίησι के संबंध से सक्रिय और निष्क्रिय—दोनों प्रकार की समझ संभव होती है; मूल की वास्तविक अनिश्चितता पाठक को बताना आवश्यक है।
lexical_decisions:
- source_word: ἐν κακοῖς
  choice: बुराई से
  rationale: यह पदबंध साधन अथवा परिस्थिति का बोध करा सकता है। संक्षिप्त हिन्दी अभिव्यक्ति मूल की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाती।
- source_word: μετανοήσαντι / ἀμετανόητος
  choice: यदि वह पश्चाताप करता है / यदि वह पश्चाताप नहीं करता
  rationale: दोनों परस्पर-विरोधी यूनानी रूपों को स्वाभाविक आधुनिक हिन्दी में समानांतर ढंग से रखा गया है।
- source_word: ἀφίησι
  choice: उसे क्षमा कर दिया जाता है
  rationale: क्रियापद सामान्यतः ‘छोड़ना, जाने देना, क्षमा करना’ व्यक्त करता है। उपलब्ध वाक्य-विन्यास और परामर्श-पाठ के अनुसार यहाँ क्षमा का अर्थ मुख्य पाठ में रखा गया है, जबकि पाठगत वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
- source_word: αἰωνίαν κόλασιν
  choice: अनन्त दण्ड
  rationale: αἰώνιος और κόλασις का सीधा, प्रतिष्ठित और धर्मवैचारिक रूप से अनावश्यक विस्तार से मुक्त हिन्दी रूप।
- source_word: τηρεῖται
  choice: रखा जाता है
  rationale: मूल निष्क्रिय क्रिया ‘सुरक्षित/रखा जाना’ को बनाए रखता है और यह नहीं जोड़ता कि रखने वाला कौन है।
theological_decisions:
- issue: पश्चाताप, क्षमा और दण्ड के बीच संबंध
  choice: मूल के क्रम में पश्चाताप करने वाले के लिए क्षमा और अपश्चातापी के लिए अनन्त दण्ड रखा गया है।
  alternative: इसे प्रायश्चित्त की किसी विशिष्ट सम्प्रदायगत व्यवस्था या कर्मों द्वारा क्षमा अर्जित करने के सिद्धान्त के रूप में स्पष्ट करना।
  rationale: यूनानी वाक्य केवल इन परिणामों का विरोध प्रस्तुत करता है; वह उनके विस्तृत धर्मवैचारिक तंत्र की व्याख्या नहीं करता।
- issue: ἀφίησι का कर्तृवाच्य रूप और अस्पष्ट वाक्य-विन्यास
  choice: मुख्य पाठ में प्रसंगानुकूल निष्क्रिय अर्थ ‘उसे क्षमा कर दिया जाता है’ रखा गया है और वैकल्पिक सक्रिय अर्थ पाद-टिप्पणी में सुरक्षित है।
  alternative: ‘वह उन्हें छोड़ देता/लौटा देता है’ को बिना टिप्पणी मुख्य पाठ में रखना।
  rationale: प्रेषित यूनानी पंक्ति पाठगत और वाक्यगत रूप से कठिन है; एक ही व्याख्या को निर्विवाद बताना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘अपश्चातापी’ जैसे अपेक्षाकृत दुर्लभ शब्द के स्थान पर ‘पश्चाताप नहीं करता’ रखा गया है। मुख्य वाक्य का संतुलित विरोध और मूल का निष्क्रिय ‘रखा जाता है’ सुरक्षित रखा गया है।
