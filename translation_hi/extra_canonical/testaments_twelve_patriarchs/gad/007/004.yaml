  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/004.yaml
  text: But if someone becomes rich through evil, like Esau my father's brother, do not be jealous; rather, await the appointed limit of the Lord.
translation:
  language: hi
  text: लेकिन यदि कोई बुरे कामों के द्वारा धनी हो जाए, जैसे एसाव, मेरे पिता का भाई, तो ईर्ष्या मत करो[a]; क्योंकि प्रभु की ठहराई हुई सीमा की प्रतीक्षा करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ईर्ष्या मत करो” का अर्थ “उसका अनुकरण करने की लालसा मत करो” भी हो सकता है।
    reason: ζηλόω ईर्ष्या और उत्साहपूर्वक अनुकरण या वैसा बनने की आकांक्षा—दोनों अर्थों में प्रयुक्त हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, “प्रभु की सीमा की प्रतीक्षा करो।” “सीमा” किसी ठहराई हुई हद या अंत-बिंदु को सूचित कर सकती है; पद यह नहीं बताता कि वह किस विशेष घटना से संबंधित है।
    reason: ὅρον का संदर्भगत आशय निश्चित नहीं है; पादटिप्पणी अस्पष्टता बनाए रखती है और उसे दण्ड, मृत्यु, या न्याय जैसी किसी एक व्याख्या से नहीं जोड़ती।
lexical_decisions:
- source_word: ἐκ κακῶν
  choice: बुरे कामों से
  rationale: शाब्दिक ‘बुराइयों से’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और अनैतिक साधनों से धन पाने का आशय व्यक्त करता है।
- source_word: πλουτήσει
  choice: धनी हो जाए
  rationale: भविष्यकालीन क्रिया का शर्तवाचक सन्दर्भ में सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πατράδελφος
  choice: मेरे पिता का भाई
  rationale: यूनानी शब्द का सटीक संबंधसूचक अर्थ; ‘चाचा’ से अधिक स्पष्ट और क्षेत्रीय संबंध-शब्दों की अस्पष्टता से मुक्त।
- source_word: ζηλώσητε
  choice: ईर्ष्या मत करना
  rationale: संदर्भ में दुष्ट साधनों से समृद्ध व्यक्ति की सम्पन्नता देखकर ईर्ष्या करने का निषेध प्रमुख है; अनुकरण का अर्थ भी संभव है और पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ὅρον
  choice: सीमा
  rationale: मूल शब्द का सीधा अर्थ ‘सीमा/निर्धारित हद’ है। ‘अन्त’, ‘दण्ड’ या ‘निर्णय’ कहने से पाठ की वास्तविक अस्पष्टता अनावश्यक रूप से सुलझ जाती।
- source_word: ἐκδέξασθε
  choice: प्रतीक्षा करना
  rationale: बहुवचन आज्ञार्थक ‘बाट जोहो/प्रतीक्षा करो’ का अर्थ देता है; वाक्य में पहले आए निषेध के साथ सामान्य आज्ञार्थक ‘करना’ सहज और गरिमापूर्ण है।
theological_decisions:
- issue: ‘प्रभु की सीमा’ का आशय
  choice: अस्पष्ट रूप ‘प्रभु की सीमा’ बनाए रखा
  alternative: प्रभु का ठहराया हुआ अन्त / प्रभु का दण्ड आने तक प्रतीक्षा करना
  rationale: ὅρον किसी निर्धारित सीमा, अवधि या अन्त-बिंदु की ओर संकेत कर सकता है, पर पद स्वयं यह स्पष्ट नहीं करता कि वह मृत्यु, दण्ड, न्याय या समृद्धि का अन्त है। इसलिए किसी एक धर्मवैचारिक व्याख्या को मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एसाव—मेरे पिता का भाई—’ को मध्यस्थ व्याख्यात्मक पदबंध के रूप में डैशों से अलग किया गया है। अंतिम उपवाक्य में ‘क्योंकि’ मूल γάρ को बनाए रखता है, भले ही हिन्दी में उसका तर्क संक्षिप्त और सूक्तिपरक लगे।
