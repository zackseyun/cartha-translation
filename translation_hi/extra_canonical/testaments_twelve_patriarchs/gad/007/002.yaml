reference: Testament of Gad 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/002.yaml
  text: And if he is exalted still more, do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who provides good and beneficial things to all people.
translation:
  language: hi
  text: और यदि वह और भी ऊँचा उठाया जाए, तो उससे ईर्ष्या मत करो; स्मरण रखो कि हर देह मर जाएगी। परन्तु प्रभु को स्तुतिगान अर्पित करो, जो सब मनुष्यों को अच्छी और लाभकारी वस्तुएँ प्रदान करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον ὑψοῦται
  choice: और भी ऊँचा उठाया जाए
  rationale: यूनानी निष्क्रिय रूप और तुलनात्मक भाव को बनाए रखता है; प्रसंग यह स्पष्ट नहीं करता कि ऊँचा उठाया जाना प्रतिष्ठा, पद या समृद्धि में है।
- source_word: μὴ φθονεῖτε αὐτῷ
  choice: उससे ईर्ष्या मत करो
  rationale: φθονέω का स्वाभाविक आधुनिक हिन्दी समतुल्य ‘ईर्ष्या करना’ है।
- source_word: πᾶσα σὰρξ
  choice: हर देह
  rationale: मूल की सामी-प्रभावित अभिव्यक्ति और मनुष्य की नश्वरता पर उसके बल को सुरक्षित रखता है।
- source_word: ὕμνους προσφέρετε
  choice: स्तुतिगान अर्पित करो
  rationale: ὕμνους को ‘स्तुतिगान’ और προσφέρετε को उपासना-संबंधी ‘अर्पित करो’ से व्यक्त किया गया है।
- source_word: παρέχοντι
  choice: प्रदान करता है
  rationale: निरंतर उपलब्ध कराने या देने का भाव सहज और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: τὰ καλὰ καὶ συμφέροντα
  choice: अच्छी और लाभकारी वस्तुएँ
  rationale: 'दोनों विशेषणों का भेद बनाए रखता है: καλὰ नैतिक अथवा गुणात्मक अच्छाई और συμφέροντα हितकारी लाभ को सूचित करता है।'
- source_word: πᾶσιν ἀνθρώποις
  choice: सब मनुष्यों को
  rationale: मूल के सार्वभौमिक मानवीय दायरे को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ऊँचा उठाए जाने का कर्ता और क्षेत्र
  choice: निष्क्रिय ‘ऊँचा उठाया जाए’ रखा गया
  alternative: ‘वह और अधिक उन्नति करे’ या ‘परमेश्वर उसे और ऊँचा उठाए’
  rationale: यूनानी पाठ न तो कर्ता बताता है, न उन्नति का विशिष्ट क्षेत्र; इसलिए परमेश्वर को स्पष्ट कर्ता बनाना या अर्थ को सांसारिक उन्नति तक सीमित करना उचित नहीं।
- issue: ‘हर देह’ का आशय
  choice: मूल रूपक को बनाए रखा
  alternative: ‘हर मनुष्य मरेगा’
  rationale: ‘हर देह’ शारीरिक नश्वरता पर मूल पाठ के बल को बचाता है, जबकि सामान्य पाठक भी प्रसंग से इसका मानवीय आशय समझ सकता है।
- issue: प्रभु द्वारा सब मनुष्यों को प्रदान करना
  choice: ‘सब मनुष्यों को’ अपरिवर्तित रखा
  alternative: इसे किसी सीमित धार्मिक समुदाय के लिए समझाना
  rationale: πᾶσιν ἀνθρώποις सार्वभौमिक है; पाठ में निहित व्यापकता को किसी संप्रदायगत सीमा से संकुचित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। ‘परन्तु’ और ‘अर्पित’ धार्मिक-नैतिक उपदेश के औपचारिक स्वर को बनाए रखते हैं। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
