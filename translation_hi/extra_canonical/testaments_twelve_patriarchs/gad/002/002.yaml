  to: और उसके स्वप्नों के कारण मैंने उसके प्रति अपना द्वेष और बढ़ाया, और मैं उसे जीवितों की धरती से चाट जाना चाहता था, जैसे बछड़ा मैदान की हरी वनस्पति चाट जाता है।
