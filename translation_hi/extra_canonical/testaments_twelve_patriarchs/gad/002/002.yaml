base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/002.yaml
  text: And because of the dreams I added hatred toward him, and I wanted to lick him up from the land of the living, as a calf licks up the green growth of the field.
translation:
  language: hi
  text: और उसके स्वप्नों के कारण मैंने उसके प्रति अपना द्वेष और बढ़ाया, और मैं उसे जीवितों की धरती से चाट जाना चाहता था, जैसे बछड़ा मैदान की हरी वनस्पति चाट जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὰ ἐνύπνια
  choice: उसके स्वप्नों के कारण
  rationale: बहुवचन ‘स्वप्नों’ और कारणसूचक διά को सीधे रखा गया है; संदर्भ से स्वप्न उसी व्यक्ति के हैं।
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: मैंने उसके प्रति अपने द्वेष को और बढ़ाया
  rationale: προστίθημι के ‘और जोड़ना/बढ़ाना’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है और पहले से उपस्थित द्वेष की वृद्धि बनाए रखता है।
- source_word: ἐκλεῖξαι
  choice: चाटकर मिटा देना
  rationale: क्रिया का सजीव शाब्दिक चित्र ‘चाट लेना’ है; विनाशकारी आशय स्पष्ट करने के लिए ‘मिटा देना’ जोड़ा गया है, जबकि अगले उपवाक्य में चाटने की उपमा बनी रहती है।
- source_word: ἐκ γῆς ζώντων
  choice: जीवितों की धरती से
  rationale: पारंपरिक और अर्थपूर्ण सामी-प्रभावित अभिव्यक्ति को सुरक्षित रखा गया है; इसका आशय जीवित संसार से समाप्त करना है।
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: मैदान की हरी घास
  rationale: χλωρά का अर्थ हरी वनस्पति/कोमल हरियाली है; बछड़े के संदर्भ में ‘हरी घास’ सहज और ठोस हिन्दी है।
theological_decisions:
- issue: हत्या अथवा पूर्ण विनाश का आशय
  choice: ‘जीवितों की धरती से ... चाटकर मिटा देना’ द्वारा हिंसक आशय और मूल रूपक दोनों रखना
  alternative: सिर्फ ‘मार डालना’ या सिर्फ ‘चाट जाना’
  rationale: ‘मार डालना’ मूल के असामान्य रूपक को खो देता, जबकि केवल ‘चाट जाना’ आधुनिक हिन्दी में विनाश का आशय अस्पष्ट कर सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गंभीर और कथात्मक है। मूल यूनानी की तीखी, लगभग अतिशयोक्तिपूर्ण पशु-उपमा को सहज बनाए बिना संरक्षित किया गया है।
