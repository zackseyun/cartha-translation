source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 5. Οὕτως¹⁴ ὁ Θεὸς τῶν πατέρων ἡμῶν ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν, ἵνα μὴ ποιήσωμεν ἐν τῷ Ἰσραὴλ ἀνομίαν μεγάλην. [β, Α, S¹] 4. Καὶ οὕτως τῇ πλεονεξίᾳ ἐπληροφορήθημεν¹⁹ τῆς ἀναιρέσεως αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/004.yaml
  text: 'Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    And so, through greed, we were fully persuaded of his murder.'
translation:
  language: hi
  text: 'इस प्रकार हमारे पूर्वजों के परमेश्वर ने उसे हमारे हाथों से छुड़ा लिया, ताकि हम इस्राएल में घोर अधर्म न कर बैठें।[a]


    इस प्रकार लोभ के कारण हम उसकी हत्या के विषय में पूरी तरह आश्वस्त हो गए।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य यूनानी α-पाठ में पद 5 के रूप में मिलता है।
    reason: प्रदत्त मूल-पाठ में इस वाक्य की पाठ-परंपरा और पद-संख्या स्पष्ट रूप से अलग चिह्नित है।
  - marker: b
    text: यह वाक्य यूनानी β-पाठ तथा A और S¹ साक्षियों में पद 4 के रूप में मिलता है।
    reason: अलग यूनानी पाठ-साक्षियों में संरक्षित रूप को पाठक के सामने पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के परमेश्वर
  rationale: यूनानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप; यह इस्राएल के पूर्वजों की ओर संकेत बनाए रखता है।
- source_word: ἐρρύσατο
  choice: छुड़ा लिया
  rationale: क्रिया का भाव किसी को दूसरों के हाथ या अधिकार से बचाकर निकालने का है; ‘हमारे हाथों से’ के साथ ‘छुड़ा लिया’ स्वाभाविक है।
- source_word: ἀνομίαν μεγάλην
  choice: घोर अधर्म
  rationale: ἀνομία व्यवस्था-विरुद्ध दुष्कर्म या अधर्म को व्यक्त करता है; μεγάλην की तीव्रता को प्राकृतिक हिन्दी में ‘घोर’ से व्यक्त किया गया है।
- source_word: πλεονεξίᾳ
  choice: लोभ के कारण
  rationale: करण/कारण सूचक संप्रदान रूप को स्पष्ट हिन्दी में व्यक्त करता है और πλεονεξία के लालच/लोभ के मूल अर्थ को बनाए रखता है।
- source_word: ἐπληροφορήθημεν
  choice: पूरी तरह आश्वस्त हो गए
  rationale: पूर्ण निश्चय या दृढ़ विश्वास तक पहुँचने के निष्क्रिय भाव को दर्शाता है; इसे केवल ‘ठान लिया’ बनाकर इच्छाशक्ति के अर्थ तक सीमित नहीं किया गया।
- source_word: τῆς ἀναιρέσεως αὐτοῦ
  choice: उसकी हत्या करने के लिए
  rationale: संदर्भ में ἀναίρεσις किसी को मार डालने को सूचित करता है; हिन्दी में प्रयोजनसूचक रचना वाक्य को स्वाभाविक बनाती है, यद्यपि यूनानी संबंधवाचक संरचना अधिक शाब्दिक है।
theological_decisions:
- issue: इस्राएल में ἀνομία का स्वरूप
  choice: घोर अधर्म
  alternative: एक बड़ा व्यवस्था-विरुद्ध काम
  rationale: ‘अधर्म’ नैतिक और व्यवस्था-विरोधी दोनों आयामों को खुला रखता है तथा किसी विशेष धार्मिक संप्रदाय की परिभाषा नहीं थोपता।
- issue: हत्या के विषय में ἐπληροφορήθημεν का भाव
  choice: पूरी तरह आश्वस्त हो गए
  alternative: हत्या करने पर पूरी तरह अड़ गए
  rationale: मूल क्रिया निश्चय/पूर्ण विश्वास का भाव देती है; अनुवाद इसे केवल दृढ़ संकल्प या इच्छा के रूप में नहीं बदलता, जिससे मूल की असहज नैतिक मनोवैज्ञानिक भाषा सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘न कर बैठें’ संभावित गंभीर कृत्य को स्वाभाविक ढंग से व्यक्त करता है। दोनों स्रोत-पंक्तियों को अलग अनुच्छेदों में रखा गया है और पाठ-साक्ष्य संबंधी भिन्नता फुटनोटों में बताई गई है।
