source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: II. Ὁμολογῶ τοίνυν¹ τὴν ἁμαρτίαν μου, τέκνα², ὅτι πλειστάκις ἤθελον³ ἀνελεῖν αὐτόν, *ἐπειδὴ ἐμίσουν αὐτὸν ἐκ ψυχῆς⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/001.yaml
  text: Therefore I confess my sin, children, that many times I wanted to kill him, because I hated him from my soul.
translation:
  language: hi
  text: इसलिए, हे बच्चों, मैं अपना पाप स्वीकार करता हूँ कि मैंने कई बार उसे मार डालना चाहा, क्योंकि मैं मन से उससे घृणा करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: मैं ... मान लेता हूँ
  rationale: वर्तमानकालीन ‘स्वीकार/अंगीकार करता हूँ’ का स्वाभाविक और स्पष्ट हिन्दी रूप; पाप के संदर्भ में अपराध को स्वीकार करने का भाव सुरक्षित है।
- source_word: τέκνα
  choice: हे मेरे बच्चो
  rationale: प्रत्यक्ष संबोधन को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; प्रसंगगत संबंध के कारण ‘मेरे’ निहित भाव व्यक्त करता है।
- source_word: πλειστάκις
  choice: कई बार
  rationale: बार-बार या अनेक अवसरों पर इच्छा होने का अर्थ सरल आधुनिक हिन्दी में देता है।
- source_word: ἤθελον ἀνελεῖν
  choice: मार डालना चाहा
  rationale: हत्या करने की इच्छा को सीधे व्यक्त करता है और यूनानी क्रिया ἀναιρέω की घातक तीव्रता बनाए रखता है।
- source_word: ἐκ ψυχῆς
  choice: मन से
  rationale: घृणा की भीतरी और गहरी प्रकृति को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक ‘प्राण से’ यहाँ असहज और भ्रामक हो सकता है।
theological_decisions:
- issue: ὅτι का संबंध
  choice: ‘कि’ के द्वारा स्वीकारोक्ति की विषय-वस्तु से जोड़ा गया
  alternative: विराम-चिह्न लगाकर स्वतंत्र कथन बनाना
  rationale: यूनानी ὅτι स्वाभाविक रूप से बताता है कि स्वीकार किया गया पाप क्या था; हिन्दी में ‘कि’ इसे स्पष्ट रूप से सुरक्षित रखता है।
- issue: ἐκ ψυχῆς की तीव्रता
  choice: ‘मन से’
  alternative: ‘पूरे मन से’ या ‘अपनी आत्मा से’
  rationale: मूल में ‘पूरे’ के लिए अलग शब्द नहीं है, इसलिए तीव्रता बढ़ाए बिना आंतरिक घृणा का भाव रखा गया है; ‘आत्मा’ अनावश्यक धर्मवैज्ञानिक अर्थ पैदा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष संबोधन और स्वीकारोक्ति की गंभीरता बनाए रखी गई है।
