translation:
  language: hi
  text: परन्तु मेरे पूर्वजों के परमेश्वर ने उसे मेरे हाथों से छुड़ा लिया, ताकि मैं इस्राएल में अधर्म का कोई काम न करूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: मेरे पूर्वजों के परमेश्वर
  rationale: यह यूनानी संबंधवाचक पदबंध का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; “पितरों” की अपेक्षा “पूर्वजों” को सामान्य आधुनिक पाठक अधिक सहजता से समझता है।
- source_word: ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου
  choice: उसे मेरे हाथों से छुड़ा लिया
  rationale: ἐρρύσατο का उद्धार अथवा संकट से बचाने का भाव और “मेरे हाथों से” का रूपक दोनों सुरक्षित रहते हैं।
- source_word: ἀνόμημα
  choice: अधर्म का काम
  rationale: यह शब्द व्यवस्था-विरुद्ध अपराध या दुष्कर्म का संकेत देता है। “अधर्म का काम” उसके नैतिक और विधि-विरोधी दोनों आयामों को सामान्य हिन्दी में व्यक्त करता है।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: मूल की सामुदायिक अथवा जनजातीय सीमा को बिना अतिरिक्त व्याख्या के यथावत रखता है।
theological_decisions:
- issue: दैवी हस्तक्षेप और मानवीय अपराध की रोकथाम
  choice: परमेश्वर ने उसे छुड़ाया, जिसके परिणामस्वरूप वक्ता अधर्म करने से बचा
  alternative: परमेश्वर ने वक्ता की इच्छा या क्षमता को प्रत्यक्ष रूप से बदल दिया
  rationale: मूल पाठ केवल यह कहता है कि परमेश्वर ने पीड़ित को वक्ता के हाथों से छुड़ाया, ताकि अपराध न हो; वह हस्तक्षेप की सटीक रीति या मानवीय इच्छा के स्वरूप को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। “परन्तु” प्रसंगगत विरोध को व्यक्त करता है, जबकि वाक्यरचना साधारण पाठकों के लिए स्वाभाविक रखी गई है।
