source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 3. Καὶ κρυφῆ πράσας αὐτὸν Ἰούδας τοῖς Ἰσμαιλίταις. [β, Α, S¹] 3. Διὸ¹⁵ ἐγὼ καὶ Συμεὼν¹⁶ πεπράκαμεν αὐτὸν τοῖς Ἰσμαηλίταις [*τριάκοντα χρυσίων¹⁷, καὶ τὰ δέκα ἀποκρύψαντες τὰ εἴκοσι ἐδείξαμεν τοῖς ἀδελφοῖς ἡμῶν¹⁸].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/003.yaml
  text: 'But Judah sold him secretly to the Ishmaelites.


    Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers.'
translation:
  language: hi
  text: '[α-पाठ] 3 और यहूदा ने उसे चुपके से इश्माएलियों को बेच दिया।


    [β, A, S¹-पाठ] 3 इसलिए मैंने और शिमोन ने उसे सोने के तीस टुकड़ों के बदले इश्माएलियों को बेच दिया; और उनमें से दस छिपाकर हमने अपने भाइयों को बीस दिखाए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρυφῆ πράσας
  choice: चुपके से ... बेच दिया
  rationale: κρυφῆ गोपनीय ढंग को और πράσας बिक्री को व्यक्त करता है; यह सहज आधुनिक हिन्दी में मूल अर्थ बनाए रखता है।
- source_word: τοῖς Ἰσμαηλίταις
  choice: इश्माएलियों के हाथ
  rationale: समुदाय का पारंपरिक हिन्दी नाम रखते हुए विक्रय के प्राप्तकर्ता को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τριάκοντα χρυσίων
  choice: तीस सोने के सिक्कों में
  rationale: χρυσίων का आशय सोने की मौद्रिक इकाइयों/सिक्कों से है; केवल 'सोने' कहने की अपेक्षा यह हिन्दी में अधिक स्पष्ट है।
- source_word: ἀποκρύψαντες
  choice: छिपा लिए
  rationale: यह बिक्री की रकम में से दस को गुप्त रखने का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ἐδείξαμεν
  choice: दिखाए
  rationale: मूल क्रिया के प्रत्यक्ष अर्थ को बनाए रखा गया है; इसे 'दिए' या 'बताए' बनाकर अर्थ नहीं बदला गया।
theological_decisions:
- issue: पांडुलिपि-परंपराओं में कर्ता और विवरण का अंतर
  choice: α-पाठ और β, A, S¹-पाठ दोनों को अलग-अलग प्रस्तुत किया गया
  alternative: दोनों पाठों को मिलाकर एक सतत कथन बनाना
  rationale: α-पाठ में यहूदा अकेला और गुप्त विक्रय करता है, जबकि दूसरे पाठ में गाद शिमोन के साथ बिक्री और धन छिपाने की बात कहता है। इन वास्तविक पाठांतरों को मिलाने से स्रोत का तनाव मिट जाता।
- issue: विक्रय-मूल्य वाले कोष्ठकित अंश की पाठगत स्थिति
  choice: अंश को मुख्य β, A, S¹-पाठ में रखा गया
  alternative: इसे फुटनोट में रखना या निकाल देना
  rationale: प्रदत्त स्रोत में यह अंश तारक-चिह्न और कोष्ठकों सहित मौजूद है तथा अंग्रेज़ी परामर्श-पाठ भी इसे मुख्य पाठ में ग्रहण करता है; उपलब्ध साक्ष्य के आधार पर इसे अनिश्चित कहने हेतु अलग संपादकीय विवरण नहीं दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। स्रोत में दो स्वतंत्र पाठ-रूप दिए गए हैं, इसलिए उन्हें अनुच्छेद के भीतर पाठ-संज्ञाओं सहित अलग रखा गया है। किसी फुटनोट की आवश्यकता नहीं पड़ी और मुख्य पाठ में कोई अप्रयुक्त फुटनोट-चिह्न नहीं है।
