  text: '1[a]. And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, my children, by the spirit of hatred, because it is evil in all the deeds of men. 2. For whatever the one who hates may do, it is abominable. If someone does the law of the Lord[b], the hater does not praise him. If someone fears the Lord and desires what is righteous, the hater does not love him. 3. He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.'
translation:
  language: hi
  text: 1[a] अब सत्य की एक बात सुनो, ताकि तुम धार्मिकता का आचरण करो और परमप्रधान की हर व्यवस्था का पालन करो। हे मेरे बच्चो, घृणा की आत्मा से भटकाए न जाओ, क्योंकि वह मनुष्यों के सभी कामों में बुरी है। 2 घृणा करनेवाला जो कुछ भी करे, वह घृणित होता है। यदि कोई प्रभु की व्यवस्था का पालन करता है, तो घृणा करनेवाला उसकी प्रशंसा नहीं करता। यदि कोई प्रभु का भय मानता और जो धर्मसंगत है उसकी इच्छा करता है, तो वह उससे प्रेम नहीं करता। 3 वह सत्य की निंदा करता है, सफल होनेवाले से ईर्ष्या करता है[b], परनिंदा को गले लगाता है और घमंड से प्रेम करता है; क्योंकि घृणा उसकी आत्मा को अंधा कर देती है—जैसा मेरे साथ भी हुआ था, जब मैं यूसुफ को देखता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्ची बात सुनो” अथवा “सत्य का वचन सुनो।” यूनानी आरंभ को अनिश्चित या अधिक निश्चित उपदेशात्मक वाक्यांश, दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सफल होनेवाले” का अनुवाद “उन्नति करनेवाले” या संभवतः “ठीक आचरण करनेवाले” भी हो सकता है; निकट संदर्भ में ईर्ष्या का उल्लेख सफलता के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: सत्य की एक बात
  rationale: यूनानी में अनिश्चित और अधिक निश्चित, दोनों अर्थ संभव हैं। यह चयन उपदेशात्मक आरंभ को स्वाभाविक हिन्दी में रखता है और अस्पष्टता को पादटिप्पणी में सुरक्षित करता है।
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: धार्मिकता का आचरण करने के लिए
  rationale: उद्देश्यसूचक infinitive और व्यापक नैतिक अर्थ—दोनों को व्यक्त करता है; इसे केवल सामाजिक न्याय तक सीमित नहीं करता।
- source_word: πάντα νόμον ὑψίστου
  choice: परमप्रधान की हर व्यवस्था
  rationale: πάντα का वितरणात्मक बल, νόμος का विधि/व्यवस्था संबंधी अर्थ और परमेश्वर की उपाधि—तीनों सुरक्षित हैं।
- source_word: πλανᾶσθε
  choice: भटकाए न जाओ
  rationale: मध्य/कर्मवाच्य भाव और घृणा की आत्मा द्वारा गुमराह किए जाने की धारणा को बनाए रखता है।
- source_word: πνεύματι τοῦ μίσους
  choice: घृणा की आत्मा
  rationale: व्यक्तिरूप या अर्ध-व्यक्तिरूप नैतिक शक्ति को बनाए रखता है, पर इसे अनिवार्य रूप से दुष्टात्मा नहीं ठहराता।
- source_word: βδελυκτόν
  choice: घृणित
  rationale: तीव्र नैतिक अस्वीकृति व्यक्त करने वाला सहज और गरिमापूर्ण आधुनिक हिन्दी शब्द।
- source_word: φοβεῖται Κύριον
  choice: प्रभु का भय मानता
  rationale: परिचित बाइबिलीय मुहावरा है और श्रद्धामिश्रित नैतिक भय को सुरक्षित रखता है।
- source_word: θέλει τὸ δίκαιον
  choice: धार्मिक बात की इच्छा करता है
  rationale: τὸ δίκαιον की नैतिक और धार्मिक ऊँचाई बनाए रखता है तथा इसे केवल व्यावहारिक रूप से 'सही' तक सीमित नहीं करता।
- source_word: τῷ κατορθοῦντι
  choice: सफल होनेवाले
  rationale: ईर्ष्या के तात्कालिक संदर्भ में सफलता या उन्नति का अर्थ अधिक स्वाभाविक है; 'ठीक आचरण करनेवाला' संभव विकल्प है।
- source_word: καταλαλιὰν ἀσπάζεται
  choice: बदनामी को गले लगाता है
  rationale: दुर्भावनापूर्ण परनिंदा और उसके स्नेहपूर्ण स्वागत की सजीव रूपक-भाषा दोनों रखता है।
- source_word: ἐκτυφλοῖ τὴν ψυχὴν
  choice: आत्मा को अंधा कर देती है
  rationale: घृणा के भीतरूनी नैतिक और बोधात्मक प्रभाव का मूल रूपक सीधे बनाए रखता है।
theological_decisions:
- issue: घृणा का आत्मिक शक्ति के रूप में व्यक्तिरूपण
  choice: मुख्य पाठ में ‘घृणा की आत्मा’
  alternative: ‘घृणा की भावना’ या ‘घृणापूर्ण मनोवृत्ति’
  rationale: यूनानी πνεῦμα को बनाए रखने से पाठ का नैतिक-आत्मिक तनाव सुरक्षित रहता है, बिना इसे निश्चित रूप से किसी स्वतंत्र दुष्टात्मा के रूप में समझाए।
- issue: धार्मिकता और सही आचरण का संबंध
  choice: δικαιοσύνη को ‘धार्मिकता’ और τὸ δίκαιον को ‘धार्मिक बात’
  alternative: ‘न्याय’ और ‘जो सही है’
  rationale: संदर्भ परमेश्वर के सामने व्यापक नैतिक आचरण का है। फिर भी शब्दों को किसी संप्रदाय-विशेष की आरोपित धार्मिक शिक्षा से नहीं जोड़ा गया।
- issue: घृणा करनेवाले के प्रत्येक कार्य का मूल्यांकन
  choice: ‘जो कुछ भी करे, वह घृणित होता है’ के रूप में कठोर कथन बनाए रखा
  alternative: ‘घृणा से किया गया हर काम घृणित है’
  rationale: वैकल्पिक रूप कथन को केवल घृणा से प्रेरित कार्यों तक सीमित कर देता, जबकि उपलब्ध यूनानी पाठ घृणा करनेवाले व्यक्ति के कार्यों के बारे में अधिक व्यापक और तनावपूर्ण कथन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, मौखिक उपदेश जैसा प्रवाह रखा गया है। ‘परमप्रधान’, ‘धार्मिकता’, ‘प्रभु का भय मानना’ और ‘आत्मा को अंधा करना’ जैसे बाइबिलीय पद सामान्य पाठक के लिए बोधगम्य रखते हुए मूल की ऊँची नैतिक शैली बनाए रखते हैं। सर्वनाम-संदर्भ स्पष्ट करने के लिए पद 2 में घृणा करनेवाले के लिए ‘वह’ रखा गया है; पद 3 के अंतिम वाक्य में हिन्दी की स्पष्टता हेतु ‘मेरी आत्मा’ दोहराया गया है।
