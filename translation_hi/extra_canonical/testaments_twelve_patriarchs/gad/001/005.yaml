translation:
  language: hi
  text: 5. और वह हेब्रोन में हमारे पिता के पास लौट आया। और उसने उसे अपने पास टिकाकर लिटाया, क्योंकि वह उससे बहुत प्रेम करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: लौट आया
  rationale: क्रिया के लौटने के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνέκλινεν αὐτὸν πλησίον αὐτοῦ
  choice: उन्होंने उसे अपने पास बैठाया
  rationale: ἀνακλίνω का शाब्दिक अर्थ भोजन के लिए टिकाकर बैठाना या लिटाना हो सकता है; आधुनिक हिन्दी में प्रसंग को अनावश्यक रूप से विशिष्ट किए बिना ‘अपने पास बैठाया’ स्वाभाविक है।
- source_word: ἠγάπα αὐτὸν πάνυ
  choice: वह उससे बहुत प्रेम करते थे
  rationale: πάνυ की तीव्रता को ‘बहुत’ और ἀγαπάω को गरिमापूर्ण सामान्य शब्द ‘प्रेम’ से व्यक्त किया गया है।
theological_decisions:
- issue: ἀνέκλινεν और ἠγάπα के कर्ता की पहचान
  choice: दूसरे वाक्य में ‘हमारे पिता’ को कर्ता और लौटने वाले व्यक्ति को कर्म माना गया है।
  alternative: लौटने वाले व्यक्ति ने पिता को अपने पास बैठाया और वह पिता से प्रेम करता था।
  rationale: निकटतम स्पष्ट पुरुषवाचक संदर्भ ‘हमारे पिता’ है और प्रेम के कारण उसे अपने पास बैठाने का कथन इसी पाठ-प्रवाह में अधिक स्वाभाविक है; फिर भी यूनानी सर्वनाम अपने आप में नामों को दोहराकर भेद स्पष्ट नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘बैठाया’ को शाब्दिक ‘लिटाया/भोजन के लिए टिकाकर बैठाया’ के स्थान पर चुना गया है, ताकि प्राचीन भोजन-मुद्रा का संभावित भाव रहते हुए आधुनिक पाठक के लिए वाक्य सहज रहे।
