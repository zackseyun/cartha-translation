  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/002.yaml
  text: 'Listen, my children: I was the ninth son born to Jacob, and I was brave over the flocks.'
translation:
  language: hi
  text: सुनो, मेरे बच्चो! मैं याकूब का नौवाँ पुत्र था और भेड़-बकरियों के झुंडों की रखवाली में वीर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन में आत्मीयता बनाए रखते हुए τέκνα के व्यापक अर्थ को व्यक्त करता है।
- source_word: ἐγενόμην ἔννατος υἱὸς τῷ Ἰακώβ
  choice: मैं याकूब का नौवाँ पुत्र था
  rationale: यूनानी वाक्य की वंश-क्रम संबंधी सूचना को स्पष्ट, स्वाभाविक हिन्दी में रखता है; ‘जन्मा’ जोड़ना आवश्यक नहीं है।
- source_word: ἀνδρεῖος
  choice: वीर
  rationale: साहस और पराक्रम का भाव संक्षिप्त तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐπὶ τῶν ποιμνίων
  choice: भेड़-बकरियों के झुंडों की रखवाली में
  rationale: ποιμνία के पशु-झुंड और प्रसंगगत चरवाही के क्षेत्र—दोनों को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है।
