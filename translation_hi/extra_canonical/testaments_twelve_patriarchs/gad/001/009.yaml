base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/009.yaml
  text: And the spirit of hatred was in me, and I did not want to perceive Joseph, neither through hearing nor through sight, because he rebuked us to our face, saying that we were eating the livestock without Judah. For in everything he said to our father, he believed him.
translation:
  language: hi
  text: 9. घृणा की आत्मा मुझमें थी, और मैं न तो यूसुफ के बारे में सुनना चाहता था, न उसे अपनी आँखों से देखना; क्योंकि उसने हमारे सामने हमें इस बात पर डाँटा था कि हम यहूदा के बिना पशुओं को खा रहे थे। क्योंकि वह पिता से जो कुछ कहता था, पिता उसकी हर बात मान लेते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: घृणा की आत्मा
  rationale: यूनानी की व्यक्तिपरक तथा आध्यात्मिक अभिव्यक्ति को यथावत रखा गया है; इसे केवल ‘घृणा की भावना’ बनाकर उसका आशय सीमित नहीं किया गया।
- source_word: οὔτε δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν ἰδεῖν τὸν Ἰωσήφ
  choice: न तो यूसुफ के बारे में सुनना चाहता था, न उसे अपनी आँखों से देखना
  rationale: मूल का शाब्दिक ढाँचा ‘न सुनने के द्वारा, न आँखों के द्वारा देखना’ हिन्दी में अस्वाभाविक है। अनुवाद सुनने और देखने—दोनों इंद्रियगत पक्षों—को स्पष्ट और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: κατὰ πρόσωπον ἤλεγξεν ἡμᾶς
  choice: हमारे मुँह पर हमें फटकारते हुए
  rationale: ‘सामने/मुँह पर’ सार्वजनिक और प्रत्यक्ष उलाहने का भाव देता है, जबकि ἐλέγχω के लिए ‘फटकारना’ प्रसंगानुकूल है।
- source_word: χωρὶς Ἰούδα
  choice: यहूदा के बिना
  rationale: χωρίς की मूल अस्पष्टता सुरक्षित है—इसका अर्थ यहूदा की अनुपस्थिति में या उसे सम्मिलित किए बिना हो सकता है।
- source_word: τὰ θρέμματα
  choice: पशुओं
  rationale: शब्द पाले गए पशुओं या मवेशियों को सूचित करता है; ‘पशु’ आधुनिक हिन्दी में व्यापक और स्वाभाविक है।
- source_word: ἐπείθετο αὐτῷ
  choice: पिता उसकी हर बात मान लेते थे
  rationale: क्रिया का भाव ‘उससे सहमत/आश्वस्त होना, उसकी बात मानना’ है। प्रसंग और निकटवर्ती ‘पिता’ से निहित कर्ता स्पष्ट किया गया है।
theological_decisions:
- issue: ‘घृणा की आत्मा’ का स्वरूप
  choice: व्यक्तिपरक ‘आत्मा’ वाली भाषा बनाए रखी गई
  alternative: ‘घृणा की भावना’ या ‘मेरे भीतर घृणा थी’
  rationale: मूल πνεῦμα को मनोवैज्ञानिक भावना तक सीमित करना एक संभावित आध्यात्मिक अर्थ को समय से पहले समाप्त कर देता।
- issue: अंतिम वाक्य में निहित कर्ता
  choice: पिता को कर्ता मानकर ‘पिता उसकी हर बात मान लेते थे’
  alternative: यूसुफ पिता की बात मानता था
  rationale: τῷ πατρὶ (‘पिता से/पिता को’) और αὐτῷ (‘उसकी’) के साथ प्रसंग का स्वाभाविक अर्थ यह है कि पिता यूसुफ की बात पर विश्वास करते या उसे मान लेते थे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्रोत की असामान्य श्रवण-दृष्टि रचना को अर्थ-संगत हिन्दी में खोला गया है, जबकि ‘घृणा की आत्मा’ और ‘यहूदा के बिना’ जैसी अर्थगत तनाव वाली अभिव्यक्तियाँ जानबूझकर सुरक्षित रखी गई हैं।
