  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/001.yaml
  text: 'The copy of the testament of Gad, which he spoke to his sons in the one hundred and twenty-fifth year of his life, saying to them:'
translation:
  language: hi
  text: 'गाद की वसीयत की प्रतिलिपि, जो उसने अपने जीवन के एक सौ पच्चीसवें वर्ष में अपने पुत्रों को सुनाई, और उनसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह यूनानी संज्ञा किसी लिखित दस्तावेज़ की नकल या प्रति को सूचित करती है; ‘प्रतिलिपि’ उसी अर्थ को स्वाभाविक और औपचारिक ढंग से व्यक्त करती है।
- source_word: διαθήκης
  choice: वसीयत
  rationale: इस साहित्यिक संदर्भ में यह मृत्यु से पहले दी गई अंतिम शिक्षाओं अथवा निर्देशों के दस्तावेज़ को दर्शाता है; ‘वसीयत’ शीर्षकीय शैली के लिए संक्षिप्त और परिचित है।
- source_word: ἐλάλησε
  choice: कहा
  rationale: मूल क्रिया बोलने को व्यक्त करती है। आधुनिक हिन्दी में ‘अपने पुत्रों से कहा’ स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: अपने जीवन के एक सौ पच्चीसवें वर्ष में
  rationale: क्रमवाचक आयु-सूचना को मूल के अनुरूप रखा गया है; इसे ‘एक सौ पच्चीस वर्ष की आयु में’ बनाकर संभावित गणनात्मक अंतर को नहीं मिटाया गया।
- source_word: λέγων αὐτοῖς
  choice: 'उसने उनसे कहा:'
  rationale: यूनानी सहभागी रूप का शाब्दिक ‘उनसे कहते हुए’ हिन्दी में शीर्षक-वाक्य को बोझिल बनाता। स्वतंत्र उपवाक्य मूल की प्रस्तावनात्मक भूमिका को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
