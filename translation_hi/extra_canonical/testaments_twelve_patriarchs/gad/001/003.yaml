  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। यूनानी अपूर्ण भूतकाल की आदतन क्रियाओं को ‘करता था/पड़ता/लेता’ से व्यक्त किया गया है; अतिमानवीय शक्ति के वर्णन को नरम या तर्कसंगत बनाने का प्रयास नहीं किया गया।
