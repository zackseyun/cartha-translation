base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/003.yaml
  text: I therefore guarded the flock by night; and when a lion or a wolf or any wild beast came against the flock, I would chase it down, and overtaking it I would seize its foot with my hand, and hurl it about a stone's throw, and so kill it.
translation:
  language: hi
  text: इसलिए मैं रात में झुंड की रखवाली करता था। जब कोई सिंह, भेड़िया या कोई भी जंगली पशु झुंड पर टूट पड़ता, तो मैं उसका पीछा करता; और उसके पास पहुँचकर मैं अपने हाथ से उसका पैर पकड़ लेता, उसे पत्थर फेंकने की दूरी जितनी दूर फेंक देता, और उसे मार डालता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: रखवाली करता था
  rationale: अपूर्ण भूतकाल यहाँ बीते समय की नियमित क्रिया व्यक्त करता है।
- source_word: τὸ ποίμνιον / τὴν ποίμνην
  choice: झुंड
  rationale: दोनों यूनानी रूप पशुओं के झुंड को सूचित करते हैं; प्रसंग में सहज और संक्षिप्त हिन्दी।
- source_word: ἐπὶ τὴν ποίμνην
  choice: झुंड पर टूट पड़ता
  rationale: केवल दिशा नहीं, हिंसक पशु के आक्रमण का प्रसंग व्यक्त करता है।
- source_word: κατεδίωκον
  choice: उसका पीछा करता
  rationale: लगातार पीछा करने की क्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: φθάνων ἐκράτουν
  choice: उसे जा पकड़ने पर ... पकड़ लेता
  rationale: φθάνων का यहाँ पीछा करके पहुँचने अथवा पकड़ लेने का भाव और ἐκράτουν का बलपूर्वक थामना सुरक्षित है।
- source_word: ἠκόντισα
  choice: फेंक देता
  rationale: क्रिया का बलपूर्वक दूर उछालने का अर्थ प्रसंग में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὡσεὶ λίθου βολήν
  choice: लगभग उतनी दूर ... जितनी दूर पत्थर फेंका जाता है
  rationale: दूरी बताने वाली यूनानी उपमा को बिना अनावश्यक निश्चित माप दिए सुरक्षित रखा गया है।
- source_word: ἀνῄρουν
  choice: मार डालता
  rationale: यहाँ जंगली पशु को जान से मार देने का स्पष्ट अर्थ है।
theological_decisions: []
