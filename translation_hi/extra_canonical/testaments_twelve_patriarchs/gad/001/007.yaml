source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. *Ἦν γὰρ ἰδὼν⁴⁶ ὅτι ἀρνα⁴⁷ ἐξειλάμην⁴⁸ *ἐκ τοῦ⁴⁹ στόματος τῆς⁵⁰ ἄρκου, κἀκείνην⁵¹ ἐθανάτωσα, *τὸν δὲ⁵² ἀρνὸν ἔθυσα· *περὶ οὗ ἐλυπούμην⁵³, ὅτι οὐκ *ἠδύνατο ζῆν⁵⁴, καὶ⁵⁵ ἐφάγομεν αὐτόν⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/007.yaml
  text: For he had seen that I rescued a lamb from the mouth of a bear, and I killed her, but I slaughtered the lamb — over which I grieved, because it could not live — and we ate it.
translation:
  language: hi
  text: क्योंकि उसने देखा था कि मैंने एक मेमने को मादा भालू के मुँह से छुड़ाया और उस मादा भालू को मार डाला; फिर उस मेमने का वध किया। मुझे उस मेमने के लिए दुःख था, क्योंकि वह जीवित नहीं रह सकता था; और हमने उसे खा लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνα / ἀρνὸν
  choice: मेमना / उस मेमने को
  rationale: यह ἀρήν का रूप है और यहाँ भेड़ के बच्चे को दर्शाता है; आधुनिक हिन्दी में ‘मेमना’ स्वाभाविक और सटीक है।
- source_word: ἄρκου … κἀκείνην
  choice: मादा भालू … उस भालू को
  rationale: κἀκείνην का स्त्रीलिंग रूप बताता है कि संदर्भ मादा भालू का है; हिन्दी में पहली बार इसे स्पष्ट किया गया है।
- source_word: ἐξειλάμην
  choice: छुड़ाया
  rationale: मुँह से बचाकर निकाल लेने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐθανάτωσα
  choice: मार डाला
  rationale: क्रिया का सीधा अर्थ प्राण ले लेना है और भालू के प्रसंग में यही स्वाभाविक हिन्दी है।
- source_word: ἔθυσα
  choice: वध कर दिया
  rationale: यहाँ मेमने को उसके जीवित न रह सकने के कारण मारने और फिर खाने का प्रसंग है; ‘बलि चढ़ाया’ अनावश्यक धार्मिक अर्थ जोड़ सकता है।
- source_word: ἐλυπούμην
  choice: मुझे … दुःख हुआ
  rationale: मेमने के विषय में गहरे खेद या शोक को साधारण, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἔθυσα में बलिदान-संबंधी संभावित अर्थ
  choice: वध कर दिया
  alternative: बलि चढ़ा दिया
  rationale: निकटवर्ती कथन—मेमने का जीवित न रह सकना और उसका खाया जाना—पशु-वध का संकेत देता है; पाठ स्पष्ट रूप से धार्मिक बलिदान नहीं बताता, इसलिए ऐसा धार्मिक आशय नहीं जोड़ा गया।
- issue: मेमने के वध और वक्ता के दुःख का संबंध
  choice: वाक्यों का मूल क्रम और तनाव बनाए रखा गया
  alternative: ‘इसलिए दुःखी होकर मैंने उसे वध किया’
  rationale: यूनानी पाठ दुःख को मेमने के विषय में बताता है, न कि स्पष्ट रूप से वध करने की मनःस्थिति के रूप में; कारण-संबंध को अधिक निश्चित बनाना मूल की अस्पष्टता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यखंडों में बाँटा गया है, जबकि घटनाक्रम और कारण-संबंध सुरक्षित हैं।
