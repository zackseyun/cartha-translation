  text: 6. यूसुफ ने हमारे पिता को बताया कि जिल्पा और बिल्हा के बेटे सबसे अच्छे पाले हुए पशुओं का वध करके उन्हें रूबेन और यहूदा की राय के विरुद्ध खा रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θύουσι
  choice: मारकर
  rationale: यह क्रिया बलि चढ़ाने या वध करने, दोनों अर्थों में आ सकती है; यहाँ पशुओं को खाने का उल्लेख होने के कारण सामान्य वध का अर्थ संदर्भ के अनुकूल है।
- source_word: τὰ θρέμματα τὰ καλά
  choice: पशुओं में से सबसे अच्छे पशुओं
  rationale: θρέμματα पाले गए पशुओं को और καλά यहाँ उनकी उत्तम अथवा चुनिंदा गुणवत्ता को दर्शाता है।
- source_word: παρὰ γνώμην
  choice: की सहमति के बिना
  rationale: इस मुहावरे का भाव किसी की राय, निर्णय या अनुमति के विरुद्ध कार्य करना है; सहज हिन्दी में ‘सहमति के बिना’ इस आशय को स्पष्ट रखता है।
