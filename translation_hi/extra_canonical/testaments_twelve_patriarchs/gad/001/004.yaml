lexical_decisions:
- source_word: ἐποίμαινε
  choice: पशु चराता रहा
  rationale: क्रिया का अर्थ चरवाहे के रूप में पशुओं की देखभाल करना है; अपूर्णकाल निरंतर गतिविधि को दर्शाता है।
- source_word: ἡμέρας τριάκοντα
  choice: तीस दिन तक
  rationale: अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπάρχων νέος
  choice: उम्र में छोटा होने के कारण
  rationale: यूसुफ की कम आयु और उसके बाद बताई गई दुर्बलता के बीच संदर्भगत संबंध को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: ἐμαλακίσθη
  choice: कमज़ोर पड़ गया
  rationale: यहाँ निष्क्रिय क्रिया शारीरिक रूप से दुर्बल हो जाने का भाव देती है।
- source_word: καύσωνος
  choice: तेज़ गरमी
  rationale: ग्रीक शब्द झुलसाने वाली प्रचंड गरमी को सूचित करता है; ‘तेज़ गरमी’ हिन्दी में व्यापक और स्वाभाविक है तथा इसे केवल गरम हवा ‘लू’ तक सीमित नहीं करता।
