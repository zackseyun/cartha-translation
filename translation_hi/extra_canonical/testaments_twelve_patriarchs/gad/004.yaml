  text: Therefore guard yourselves[a], my children, from hatred, because it works lawlessness even against the Lord himself. For it does not want to hear the words of his commandments concerning love of one's neighbor, and it sins against God. For if a brother falls, it is eager at once to report it to everyone, and it hastens that he may be judged and punished and die. And if it is some servant, it brings accusations against him before his master, and in every distress it rejoices over him, if perhaps he may be put to death. For hatred works together with envy also against those who prosper; hearing of their success and seeing it, it is always weakened. Just as love would even make the dead alive and would call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned only a little to live. For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love,
    through longsuffering[c][b], works together with the law of God for the salvation of men.
translation:
  language: hi
  text: '**गाद का वसीयतनामा 4**


    **1** इसलिए, मेरे बच्चो, अपने आप को घृणा से बचाए रखो, क्योंकि वह स्वयं प्रभु के विरुद्ध भी अधर्म का काम करती है। **2** क्योंकि वह पड़ोसी से प्रेम करने के विषय में प्रभु की आज्ञाओं की बातों को सुनना नहीं चाहती और परमेश्वर के विरुद्ध पाप करती है। **3** यदि कोई भाई गिर पड़े, तो वह तुरंत सबको यह बताने के लिए उतावली हो जाती है और जल्दी करती है कि उसका न्याय हो, उसे दण्ड दिया जाए और वह मर जाए। **4** और यदि वह दास हो, तो घृणा उसके स्वामी के सामने उस पर दोष लगाती है[a] और उसके हर क्लेश में प्रसन्न होती है, इस आशा में कि शायद उसे मार डाला जाए। **5** घृणा ईर्ष्या के साथ मिलकर उन लोगों के विरुद्ध भी काम करती है जो उन्नति करते हैं; उनकी उन्नति के विषय में सुनकर और उसे देखकर वह सदा निर्बल पड़ जाती है। **6** जैसे प्रेम मरे हुओं को भी जीवित कर देना और मृत्यु-दण्ड पाए हुओं को वापस बुला लेना चाहता है, वैसे ही घृणा जीवितों को मार डालना चाहती है और जिन्होंने थोड़ा-सा पाप किया है[b], उन्हें भी जीवित नहीं रहने देना चाहती। **7** क्योंकि घृणा की आत्मा मन की दुर्बलता[c] के द्वारा मनुष्यों की मृत्यु के लिए हर
    बात में शैतान के साथ मिलकर काम करती है; पर प्रेम की आत्मा धैर्य के द्वारा मनुष्यों के उद्धार के लिए परमेश्वर की व्यवस्था के साथ मिलकर काम करती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘वह उसके स्वामी के पास उसकी मुखबिरी करती है’ भी हो सकता है। यूनानी अभिव्यक्ति किसी अधिकारी के सामने शत्रुतापूर्ण शिकायत या अभियोग का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘जिन्होंने थोड़ा-सा पाप किया है’ का अनुवाद ‘जिन्होंने किसी छोटी बात में पाप किया है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘मन की दुर्बलता’ के लिए प्रयुक्त यूनानी शब्द में मन का छोटापन, निरुत्साह या कायरता का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μῖσος
  choice: घृणा
  rationale: अमूर्त संज्ञा को बनाए रखने से घृणा एक क्षणिक भावना के बजाय पूरे अनुच्छेद में सक्रिय और मानवीकृत दुष्प्रवृत्ति के रूप में सामने आती है।
- source_word: ἀνομίαν ποιεῖ
  choice: अधर्म करती है
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप; यह अधर्म के सक्रिय आचरण को व्यक्त करता है और असहज शाब्दिक अनुवाद से बचता है।
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: उसकी आज्ञाओं के वचन
  rationale: λόγων और ἐντολῶν दोनों को स्पष्ट रखता है और बोलकर दिए गए नैतिक निर्देश को केवल ‘आज्ञाएँ’ कहकर समेटता नहीं।
- source_word: ἀγάπης τοῦ πλησίον
  choice: पड़ोसी से प्रेम करने
  rationale: आधुनिक हिन्दी में स्वाभाविक है और प्रेम के विषय अथवा लक्ष्य को स्पष्ट रखता है।
- source_word: ἀναγγεῖλαι τοῖς πᾶσιν
  choice: सबको यह बताने
  rationale: दूसरे के पतन को सार्वजनिक करने का भाव सरल और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: δοῦλος
  choice: दास
  rationale: स्वामी के अधीन बँधी सामाजिक स्थिति यहाँ प्रसंग के लिए महत्त्वपूर्ण है; ‘सेवक’ उस स्थिति को नरम कर सकता है।
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: उसके स्वामी के सामने उस पर दोष लगाती है
  rationale: वाक्य का शत्रुतापूर्ण अभियोगात्मक अर्थ व्यक्त करता है, जबकि यूनानी पद की कुछ संभावित व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀσθενεῖ
  choice: निर्बल पड़ जाती है
  rationale: उन्नति देखकर घृणा के बीमार अथवा कमजोर पड़ने की तीखी मानवीकृत छवि को बनाए रखता है।
- source_word: ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: जिन्होंने थोड़ा-सा पाप किया है
  rationale: मात्रा और छोटे विषय—दोनों संभावनाओं में से सहज हिन्दी चुनी गई है; दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: ὀλιγοψυχίας
  choice: हृदय की दुर्बलता
  rationale: शब्द के ‘छोटे मन/साहस की कमी’ वाले अर्थ-क्षेत्र को साधारण पाठक के लिए बोधगम्य रूप में व्यक्त करता है।
- source_word: μακροθυμίᾳ
  choice: धीरज
  rationale: दीर्घ-सहनशीलता और क्रोध में विलम्ब के नैतिक भाव को संक्षिप्त, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: τῷ νόμῳ τοῦ Θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος का स्थापित बाइबलीय अर्थ रखता है और इसे केवल किसी एक आज्ञा तक सीमित नहीं करता।
theological_decisions:
- issue: घृणा और प्रेम का सक्रिय शक्तियों तथा ‘आत्माओं’ के रूप में मानवीकरण
  choice: आरम्भिक पदों में ‘घृणा’ और ‘प्रेम’ को सक्रिय कर्ता रखा गया और पद 7 में ‘घृणा की आत्मा’ तथा ‘प्रेम की आत्मा’ का स्पष्ट रूप बनाए रखा गया।
  alternative: सभी कथनों को केवल मानवीय भावनाओं या मनोवैज्ञानिक प्रवृत्तियों के रूप में सपाट कर देना।
  rationale: यूनानी पाठ अमूर्त संज्ञाओं से स्पष्ट πνεῦμα भाषा की ओर बढ़ता है। अनुवाद इस आध्यात्मिक और नैतिक तनाव को बिना किसी अतिरिक्त तात्त्विक व्यवस्था के सुरक्षित रखता है।
- issue: प्रेम द्वारा मृतकों को जीवित करने की भाषा
  choice: ‘मरे हुओं को भी जीवित कर देना’ और मृत्यु-दण्ड पाए लोगों को ‘वापस बुला लेना’ जैसी प्रबल भाषा ज्यों की त्यों रखी गई।
  alternative: इसे ‘प्रेम सबकी सहायता करना चाहता है’ जैसे सामान्य नैतिक कथन में बदल देना, अथवा इसे अनिवार्य रूप से शाब्दिक पुनरुत्थान घोषित करना।
  rationale: स्रोत की तीव्र अलंकारिक भाषा को बनाए रखने से नैतिक अतिशयोक्ति और सम्भावित धार्मिक अनुगूँज दोनों खुली रहती हैं।
- issue: परमेश्वर की व्यवस्था के साथ प्रेम की आत्मा का सहयोग
  choice: συνεργεῖ का समानान्तर रूप दोनों खण्डों में ‘साथ मिलकर काम करती है’ रखा गया।
  alternative: प्रेम की आत्मा को परमेश्वर की व्यवस्था के समान या उसका स्रोत बताना।
  rationale: पाठ सहयोग की बात करता है, पहचान या उद्गम की नहीं; इसलिए सम्बन्ध को उससे अधिक व्यवस्थित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल शैली रखी गई है। ‘बच्चो’, ‘पड़ोसी’, ‘दास’, ‘व्यवस्था’ और ‘उद्धार’ जैसे शब्द सामान्य बाइबलीय पाठक के लिए परिचित हैं। मूल की पुनरावृत्ति, न्यायिक कठोरता और प्रेम-घृणा का समानान्तर मानवीकरण जानबूझकर सुरक्षित रखा गया है।
