  text: 1[a]. But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be brought to completion. For in this way it is to your advantage. 2. And if he is exalted still more[b], do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who gives good and profitable things to all people. 3. Examine the judgments of the Lord, and your purpose will be illumined and be at rest. 4. But if someone grows rich through evil, like Esau my father's brother, do not be jealous; rather, wait for the appointed limit of the Lord. 5. For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment. 6. For the poor man, if being free from envy in all things he is pleasing to the Lord, is richer than all, because he does not have the distraction of vain people. 7. Therefore cast out hatred from your souls[d][c], and love one another in deed and in word and in the
    disposition of your soul.
translation:
  language: hi
  text: '**गाद का वसीयतनामा 7**


    **1.** यदि कोई तुमसे अधिक समृद्ध होता है, तो दुखी न हो; बल्कि उसके लिए प्रार्थना करो कि उसे पूर्णता तक पहुँचाया जाए।[a] क्योंकि इसी में तुम्हारा भला है। **2.** और यदि वह और भी ऊँचा उठाया जाता है, तो उससे ईर्ष्या न करो; याद रखो कि हर देह मर जाएगी। बल्कि प्रभु को स्तुतिगान अर्पित करो, जो सब मनुष्यों को अच्छी और लाभकारी वस्तुएँ देता है। **3.** प्रभु के निर्णयों को परखो; तब तुम्हारा विचार प्रकाशित होगा और शांत हो जाएगा।[b]


    **4.** पर यदि कोई बुरे कामों से धनी हो जाए—जैसे मेरे पिता का भाई एसाव—तो उससे ईर्ष्या न करो, बल्कि प्रभु द्वारा ठहराई गई सीमा की प्रतीक्षा करो।[c] **5.** क्योंकि यदि वह उन्हें बुराइयों के द्वारा छीन ले, या मन फिरानेवाले को क्षमा कर दे, अथवा जो मन नहीं फिराता वह अनन्त दण्ड के लिए रखा जाता है।[d][e] **6.** क्योंकि निर्धन मनुष्य, यदि हर बात में ईर्ष्या से रहित होकर प्रभु को प्रसन्न करता है, तो वह सबसे अधिक धनी है; क्योंकि उसे निरर्थक मनुष्यों की उलझनों का सामना नहीं करना पड़ता। **7.** इसलिए अपने प्राणों से घृणा निकाल दो और हृदय की खराई से एक-दूसरे से प्रेम करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसे पूर्णता तक पहुँचाया जाए” का अनुवाद “उसे सिद्ध किया जाए” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद का यूनानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: “प्रभु के निर्णयों को परखो, और तुम्हारा विचार प्रकाशित होकर शांत हो जाएगा।”'
    reason: textual_variant
  - marker: c
    text: “ठहराई गई सीमा” का अर्थ “ठहराया हुआ समय” या “आदेश” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: पद 5 का यूनानी वाक्य पाठगत और व्याकरणिक दृष्टि से कठिन है। “उन्हें” का पूर्वपद और “बुराइयों के द्वारा” का संबंध स्पष्ट नहीं है; मुख्य पाठ इस अस्पष्टता को यथासंभव बनाए रखता है।
    reason: textual_variant
  - marker: e
    text: “अनन्त दण्ड” का अनुवाद “युगस्थायी दण्ड” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐοδοῦται
  choice: समृद्ध होता है
  rationale: यहाँ क्रिया यात्रा की सफलता नहीं, बल्कि दूसरे व्यक्ति के फलने-फूलने या समृद्ध होने को दर्शाती है; यही आगे ईर्ष्या के प्रसंग से मेल खाता है।
- source_word: τελειωθῇ
  choice: पूर्णता तक पहुँचे
  rationale: यह अभिव्यक्ति केवल अधिक सफलता नहीं, बल्कि पूर्ण या परिपक्व परिणाम की ओर संकेत करती है और किसी तकनीकी धार्मिक अर्थ को आरोपित नहीं करती।
- source_word: συμφέρον / συμφέροντα
  choice: भला / लाभकारी
  rationale: दोनों स्थानों पर लाभ की समान धारणा रखी गई है, पर स्वाभाविक हिन्दी के लिए प्रसंगानुसार अलग रूप चुने गए हैं।
- source_word: ὑψοῦται
  choice: ऊँचा उठाया जाता है
  rationale: यह सामाजिक प्रतिष्ठा या उन्नति दोनों को समेटता है और यूनानी कर्मवाच्य की गुंजाइश बनाए रखता है।
- source_word: πᾶσα σὰρξ
  choice: हर देह
  rationale: यह मृत्युशीलता का पारंपरिक सूत्र है; इसे केवल ‘हर मनुष्य’ करके उसके देह-संबंधी रूपक को मिटाया नहीं गया।
- source_word: ὕμνους προσφέρετε
  choice: स्तुतिगान अर्पित करो
  rationale: ‘अर्पित करो’ προσφέρετε में निहित उपासना और भेंट की छाया को सुरक्षित रखता है।
- source_word: κρίματα Κυρίου
  choice: प्रभु के निर्णय
  rationale: यह परमेश्वर के न्यायिक निर्णयों या शासनकारी विधानों को सूचित कर सकता है; ‘निर्णय’ दोनों संभावनाओं के लिए पर्याप्त खुला है।
- source_word: διαβούλιόν
  choice: विचार
  rationale: शब्द भीतरी विचार-विमर्श, संकल्प या योजना को दर्शा सकता है; ‘विचार’ आधुनिक हिन्दी में सहज है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ὅρον Κυρίου
  choice: प्रभु द्वारा ठहराई गई सीमा
  rationale: ὅρος में सीमा, निर्धारित अवधि या आदेश की अर्थ-छायाएँ हैं; मुख्य पाठ में ‘ठहराई गई सीमा’ इनका व्यापक संतुलन रखता है।
- source_word: ἄφθονος
  choice: ईर्ष्या से रहित
  rationale: अध्याय में ईर्ष्या-विरोधी शिक्षा प्रमुख है, इसलिए यहाँ ‘उदार’ की अपेक्षा ‘ईर्ष्या से रहित’ प्रसंग के अधिक अनुकूल है।
- source_word: ἐν εὐθύτητι καρδίας
  choice: सीधे हृदय से
  rationale: यह हृदय की निष्कपटता और खराई को स्वाभाविक, समझने योग्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τελειωθῇ का आशय
  choice: ‘पूर्णता तक पहुँचे’
  alternative: ‘सिद्ध किया जाए’ या ‘पूरी तरह सफल हो’
  rationale: चुना हुआ रूप नैतिक अथवा जीवनगत परिपक्वता की संभावना को बनाए रखता है, पर बाद की किसी विशिष्ट ‘सिद्धता’ की शिक्षा को पाठ में नहीं जोड़ता।
- issue: दुष्ट की समृद्धि के संदर्भ में ὅρον Κυρίου
  choice: ‘प्रभु द्वारा ठहराई गई सीमा’
  alternative: ‘प्रभु का ठहराया समय’ या ‘प्रभु का आदेश’
  rationale: यूनानी पद सीमा, अवधि और निर्णय में से एक से अधिक भाव रख सकता है; अनुवाद इस वास्तविक अस्पष्टता को टिप्पणी सहित सुरक्षित रखता है।
- issue: αἰωνίαν κόλασιν का कालगत बल
  choice: ‘अनन्त दण्ड’
  alternative: ‘युगस्थायी दण्ड’
  rationale: इस चेतावनी के प्रसंग में ‘अनन्त दण्ड’ सीधा और पारंपरिक अर्थ देता है, जबकि αἰώνιος के वैकल्पिक कालगत बोध को पादटिप्पणी में रखा गया है।
- issue: पद 5 में पश्चात्ताप और क्षमा का वाक्य-संबंध
  choice: ‘यदि वह मन फिराता है, तो उसे क्षमा मिलती है’
  alternative: क्रिया ἀφίησι को कर्तृवाचक ‘वह छोड़ देता है’ समझना
  rationale: प्राप्त यूनानी वाक्य कठिन और संभवतः विकृत है। प्रसंग में पश्चात्तापी व्यक्ति की क्षमा सर्वाधिक सुसंगत है, पर पाठगत कठिनाई स्पष्ट रूप से नोट की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गंभीर और उपदेशात्मक रखी गई है। ‘ईर्ष्या’, ‘घृणा’, ‘मन फिराना’ और ‘सीधा हृदय’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की धार्मिक और नैतिक गरिमा भी बनी रहती है। अंग्रेज़ी परामर्श-पाठ में पद 7 के बाद जो विस्तारित वाक्यांश था, वह उपलब्ध यूनानी स्रोत में नहीं है; इसलिए उसे हिन्दी मुख्य पाठ में नहीं जोड़ा गया।
