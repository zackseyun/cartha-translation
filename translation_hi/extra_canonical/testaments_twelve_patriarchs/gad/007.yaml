  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶. 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹. 3. Ἐξέτασον *κρίματα Κυρίου¹² καὶ †καταλάμψει¹³ καὶ ἡσυχάσει¹⁴ τὸ διαβούλιόν σου. 4. Ἐὰν δὲ¹⁵ ἐκ κακῶν¹⁶ τις πλουτήσει, ὡς Ἡσαῦ ὁ πατράδελφός¹⁷ μου, μὴ ζηλώσητε¹⁸· ὅρον¹⁹ γὰρ²⁰ Κυρίου ἐκδέξασθε²¹. 5. Εἰ²² ἀφαιρεῖται²³ †αὐτὰ²⁴ *ἐν κακοῖς²⁵, ἢ μετανοήσαντι²⁶, ἀφίησι²⁷, ἢ²⁸ ἀμετανόητος²⁹ τηρεῖται³⁰ εἰς *αἰωνίαν κόλασιν³¹. 6. Ὁ γὰρ πένης³², ἐὰν ἄφθονος ἐπὶ πᾶσι Κυρίῳ εὐαρεστῇ³³, οὗτος³⁴ *ὑπὲρ πάντας³⁵ †πλουτεῖ³⁶, ὅτι οὐκ ἔχει τὸν *περισπασμὸν τῶν ματαίων ἀνθρώπων³⁷. 7. Ἐξάρατε οὖν³⁸ τὸ †μῖσος³⁹ ἀπὸ τῶν ψυχῶν ὑμῶν, καὶ ἀγαπήσατε⁴⁰ ἀλλήλους ἐν εὐθύτητι καρδίας.
