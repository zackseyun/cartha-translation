  to: '**गाद का वसीयतनामा 6**


    **1.** और अब, मेरे बच्चों, मैं तुमसे आग्रह करता हूँ: तुममें से हर एक अपने पड़ोसी से प्रेम करे और अपने हृदयों से घृणा निकाल दे। काम, वचन और आत्मा की भावना से एक-दूसरे से प्रेम करो।


    **2.** क्योंकि मैं स्वयं अपने पिता के सामने यूसुफ से शांति की बातें करता था; पर जब मैं उनके पास से बाहर निकलता था, तो घृणा की आत्मा मेरे मन को अंधकारमय कर देती और मेरे विचारों को ऐसा व्याकुल कर देती कि मैं उसे मार डालना चाहता था।


    **3.** हृदय से एक-दूसरे से प्रेम करो। यदि कोई तुम्हारे विरुद्ध पाप करे, तो उससे शांति की बात करो[a] और अपने मन में कोई छल न रखो। यदि वह अपना दोष स्वीकार करे और मन बदल ले, तो उसे क्षमा कर दो।


    **4.** पर यदि वह इनकार करे, तो उससे झगड़ा न करो, कहीं ऐसा न हो कि उसके शपथ खाने पर तुम दुगुना पाप कर बैठो।


    **5.** झगड़े में किसी पराए व्यक्ति को तुम्हारी गुप्त बात न सुनने दो[b], कहीं ऐसा न हो कि वह तुमसे घृणा करके तुम्हारा शत्रु बन जाए और तुम्हारे विरुद्ध कोई बड़ा पाप कर बैठे। क्योंकि तुमसे विष ग्रहण करने के बाद वह अक्सर या तो छल से तुम्हारी हत्या कर देता है या तुम्हारे विरुद्ध बुरी चालें चलता है।


    **6.** पर यदि वह इनकार करे और दोष दिखाए जाने पर लज्जित हो, तो शांत रहो और उसे फिर दोष न दो। क्योंकि जो इनकार करता है, वह तुम्हारे विरुद्ध अपराध करने के विषय में मन बदलता है और डरकर मेल कर लेता है[c]।


    **7.** पर यदि वह निर्लज्ज बना रहे और बुराई पर अड़ा रहे, तब भी उसे हृदय से क्षमा कर दो और बदला परमेश्वर को सौंप दो।'
  rationale: पद 6 से मूल-पाठ में अनुपस्थित ‘फिर अपराध न करने’ का उद्देश्य-वाक्य हटाया गया। पद 5 के कठिन περιεργάζεται वाले वाक्यांश को कम व्याख्यात्मक रखा गया। साथ ही, आधुनिक मानक हिन्दी की वर्तनी और कुछ असहज वाक्यांशों को सुधारा गया, जबकि पाठ-भेदों की अनिश्चितता टिप्पणियों में सुरक्षित रखी गई।
