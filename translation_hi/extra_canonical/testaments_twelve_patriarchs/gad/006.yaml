  text: '1[a]. And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and with the intention of the soul.


    2. For I myself, in my father’s presence, spoke peaceably to Joseph; but when I went out from his presence, the spirit of hatred darkened my mind and disturbed my understanding so that I wanted to kill him.


    3. Love one another from the heart; and if anyone sins against you[b], speak peace to him, and in your soul hold no deceit; and if he confesses and changes his mind, forgive him.


    4. But if he denies it, do not contend with him, lest, when he swears an oath, you sin doubly.


    5. Do not let a stranger hear your secret in a quarrel, lest, hating you, he become your enemy and commit a great sin against you; for many times he either kills by treachery or entangles you in evils, having taken in from you the poison.


    6. But if he denies it and is ashamed when reproved, be still and do not reprove him further. For the one who denies it repents of having done wrong against you, so as not to wrong you again, and, being afraid, makes peace.


    7. But even if he is shameless and persists in his wrongdoing, even so forgive him from the heart[c], and leave vengeance to God.'
translation:
  language: hi
  text: '**गाद का वसीयतनामा 6**


    **1.** और अब, मेरे बच्चों, मैं तुमसे आग्रह करता हूँ: तुममें से हर एक अपने पड़ोसी से प्रेम करे और अपने हृदयों से घृणा निकाल दे। काम, वचन और आत्मा की भावना से एक-दूसरे से प्रेम करो।


    **2.** क्योंकि मैं स्वयं अपने पिता के सामने यूसुफ से शांति की बातें करता था; पर जब मैं उनके पास से बाहर निकलता था, तो घृणा की आत्मा मेरे मन को अंधकारमय कर देती और मेरे विचारों को ऐसा व्याकुल कर देती कि मैं उसे मार डालना चाहता था।


    **3.** हृदय से एक-दूसरे से प्रेम करो। यदि कोई तुम्हारे विरुद्ध पाप करे, तो उससे शांति की बात करो[a] और अपने मन में कोई छल न रखो। यदि वह अपना दोष स्वीकार करे और मन बदल ले, तो उसे क्षमा कर दो।


    **4.** पर यदि वह इनकार करे, तो उससे झगड़ा न करो, कहीं ऐसा न हो कि उसके शपथ खाने पर तुम दुगुना पाप कर बैठो।


    **5.** झगड़े में किसी पराए व्यक्ति को तुम्हारी गुप्त बात न सुनने दो[b], कहीं ऐसा न हो कि वह तुमसे घृणा करके तुम्हारा शत्रु बन जाए और तुम्हारे विरुद्ध कोई बड़ा पाप कर बैठे। क्योंकि तुमसे विष ग्रहण करने के बाद वह अक्सर या तो छल से तुम्हारी हत्या कर देता है या तुम्हारे विरुद्ध बुरी चालें चलता है।


    **6.** पर यदि वह इनकार करे और दोष दिखाए जाने पर लज्जित हो, तो शांत रहो और उसे फिर दोष न दो। क्योंकि जो इनकार करता है, वह तुम्हारे विरुद्ध अपराध करने के विषय में मन बदलता है और डरकर मेल कर लेता है[c]।


    **7.** पर यदि वह निर्लज्ज बना रहे और बुराई पर अड़ा रहे, तब भी उसे हृदय से क्षमा कर दो और बदला परमेश्वर को सौंप दो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 3 में ‘उससे शांति की बात करो’ और ‘अपने मन में कोई छल न रखो’ के क्रम तथा शब्दों में पाण्डुलिपीय भिन्नता है। शांति से बोलने और भीतर छल न रखने का मूल आशय स्पष्ट है।
    reason: textual_variant
  - marker: b
    text: पद 5 का पाठ कई स्थानों पर कठिन है। चेतावनी यह है कि झगड़े में कोई निजी बात किसी पराए व्यक्ति के सामने खुल जाने से वह शत्रुता और छलपूर्ण हिंसा की ओर बढ़ सकता है। अंत का ‘विष’ घृणा के लिए रूपक है, जिसे वह झगड़ने वाले से ग्रहण करता है।
    reason: textual_variant
  - marker: c
    text: पद 6 में अपराध से मुकरने वाले के मन बदलने, डरने और मेल करने से संबंधित शब्द पाण्डुलिपियों में अलग-अलग हैं। समग्र अर्थ यह है कि दोष दिखाए जाने की लज्जा उसे अपराध छोड़कर मेल करने की ओर ले जा सकती है।
    reason: textual_variant
lexical_decisions:
- source_word: παραινῶ
  choice: आग्रह करता हूँ
  rationale: वसीयतनामे में दी जा रही गंभीर नैतिक सीख का बल बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: नैतिक सन्दर्भ में निकटवर्ती मनुष्य के लिए स्थापित और स्पष्ट शब्द है।
- source_word: ἐξάρατε τὸ μῖσος
  choice: घृणा निकाल दे
  rationale: हृदय से घृणा को निर्णायक रूप से दूर करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διανοίᾳ ψυχῆς
  choice: आत्मा के संकल्प से
  rationale: यूनानी पद के आन्तरिक और उद्देश्यपूर्ण भाव को केवल ‘सच्चे मन से’ कहकर सपाट नहीं करता।
- source_word: εἰρηνικά
  choice: शान्ति की बातें
  rationale: बाहरी शान्तिपूर्ण वाणी और भीतरी घृणा के बीच का विरोध सुरक्षित रखता है।
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: घृणा की आत्मा
  rationale: मूल के सजीव नैतिक अथवा आत्मिक चित्र को बिना केवल भावना में बदल दिए बनाए रखता है।
- source_word: νοῦν / λογισμόν
  choice: मन / विचार
  rationale: दो निकट सम्बन्धित मानसिक शब्दों का भेद रखते हुए हिन्दी में अनावश्यक कृत्रिमता से बचता है।
- source_word: εἰπὲ αὐτῷ εἰρήνην / ἐν εἰρήνῃ
  choice: उससे शान्ति की बात करो
  rationale: मूल की कुछ हद तक सामी शैली वाली शान्तिपूर्ण सम्बोधन की आज्ञा को बनाए रखता है।
- source_word: δόλον
  choice: छल
  rationale: मन में छिपी कपटपूर्ण भावना के लिए संक्षिप्त और सामान्य आधुनिक शब्द है।
- source_word: μετανοέω
  choice: मन बदलना
  rationale: व्यक्तिगत अपराध को मानकर अपना रुख बदलने के प्रसंग को दर्शाता है, बिना हर occurrence को तकनीकी धार्मिक पद बनाने के।
- source_word: φιλονείκει
  choice: झगड़ा न करो
  rationale: विवाद को हठपूर्वक बढ़ाने का अर्थ साधारण पाठक के लिए स्पष्ट करता है।
- source_word: ἐκδίκησιν
  choice: बदला
  rationale: स्वयं प्रतिशोध न लेकर न्याय परमेश्वर पर छोड़ने की नैतिक धार को स्पष्ट और प्रभावी हिन्दी में रखता है।
theological_decisions:
- issue: व्यक्तिगत अपराध के प्रसंग में μετανοέω का अनुवाद
  choice: मन बदल ले / मन बदलता है
  alternative: पश्चात्ताप करे
  rationale: यहाँ स्वीकारोक्ति, लज्जा और दूसरे व्यक्ति के प्रति व्यवहार बदलने पर बल है; ‘मन बदलना’ संज्ञानात्मक और नैतिक दोनों पहलुओं को खुला रखता है।
- issue: अन्तिम वाक्य में प्रतिशोध
  choice: बदला परमेश्वर पर छोड़ दो
  alternative: न्याय परमेश्वर को सौंप दो
  rationale: मूल ἐκδίκησις प्रतिशोध या दण्डात्मक न्याय की तनावपूर्ण धार रखता है; ‘न्याय’ कहने से उसे नरम करके समय से पहले हल नहीं किया गया।
- issue: घृणा की आत्मा की प्रकृति
  choice: घृणा की आत्मा
  alternative: घृणा की भावना
  rationale: यह तय नहीं किया गया कि पद केवल मनोभाव है या किसी आत्मिक शक्ति का संकेत; मूल की वास्तविक अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक रखी गई है। ‘बच्चो’, ‘पड़ोसी’, ‘छल’, ‘मेल’ और ‘बदला’ जैसे सामान्य शब्द पठनीयता बनाए रखते हैं, जबकि ‘आत्मा के संकल्प’ और ‘घृणा की आत्मा’ मूल की विशिष्ट तथा कुछ हद तक अस्पष्ट अभिव्यक्ति को सुरक्षित रखते हैं। पद 5–6 के कठिन पाठ को मुख्य पाठ में अत्यधिक पुनर्निर्मित करने के बजाय टिप्पणियों में स्पष्ट किया गया है।
