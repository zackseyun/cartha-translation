base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/003.yaml
  text: He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.
translation:
  language: hi
  text: वह सत्य की निंदा करता है, सफल होने वाले से ईर्ष्या करता है, परनिंदा को गले लगाता है और घमंड से प्रेम करता है; क्योंकि घृणा उसकी आत्मा को अंधा कर देती है, जैसे उसने मेरी आत्मा को भी अंधा कर दिया था, जब मैं यूसुफ को देखता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψέγει
  choice: निन्दा करता है
  rationale: यह क्रिया दोष लगाने, धिक्कारने या निन्दा करने का भाव रखती है; यहाँ ‘सत्य की निन्दा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: τῷ κατορθοῦντι
  choice: सफल होनेवाले
  rationale: κατορθόω का अर्थ सही ढंग से करना, लक्ष्य पाना या सफल होना हो सकता है। प्रसंग में ईर्ष्या के साथ ‘सफल होनेवाला’ सबसे स्वाभाविक है, जबकि मूल की उपलब्धि/सफलता की व्यापकता बनी रहती है।
- source_word: καταλαλιὰν ἀσπάζεται
  choice: बदनामी को गले लगाता है
  rationale: καταλαλιά दूसरों के विरुद्ध बुरी बातें कहने, निन्दात्मक चर्चा या बदनामी का द्योतक है; ἀσπάζεται के ग्रहण या स्वागत के सजीव रूपक को ‘गले लगाता है’ बनाए रखता है।
- source_word: ὑπερηφανίαν ἀγαπᾷ
  choice: घमण्ड से प्रेम करता है
  rationale: मूल के सीधे और तीखे कथन को सुरक्षित रखते हुए ὑπερηφανία को सामान्य आधुनिक हिन्दी में ‘घमण्ड’ कहा गया है।
- source_word: ἐκτυφλοῖ
  choice: अन्धा कर देती है
  rationale: यह तीव्र क्रिया पूरी तरह अन्धा कर देने का भाव देती है; हिन्दी में यही रूपक स्वाभाविक है।
theological_decisions:
- issue: घृणा द्वारा आत्मा को अन्धा करने का रूपक
  choice: रूपक को शाब्दिक-सजीव रूप में रखा गया
  alternative: ‘घृणा उसकी समझ नष्ट कर देती है’
  rationale: मूल ψυχή और ἐκτυφλοῖ को व्याख्यात्मक रूप से ‘मन/समझ’ में बदलना उसके नैतिक और आध्यात्मिक तनाव को घटा देता।
- issue: अन्तिम तुलना का कर्ता और कर्म
  choice: ‘जैसे उसने मेरी आत्मा को भी अन्धा कर दिया था’
  alternative: ‘जैसा मेरे साथ भी हुआ था’
  rationale: यूनानी वाक्य में अन्तिम उपवाक्य संक्षिप्त है, पर पिछले कथन से घृणा का मेरी आत्मा को अन्धा करना स्पष्टतः निहित है। हिन्दी में अर्थपूर्ण वाक्य के लिए इसे दोहराया गया, बिना कोई अतिरिक्त सिद्धान्त जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और नैतिक उपदेश के अनुरूप शैली रखी गई है। ‘निन्दा’, ‘ईर्ष्या’, ‘घमण्ड’ और ‘आत्मा’ जैसे प्रचलित शब्द मूल की गंभीरता बनाए रखते हैं।
