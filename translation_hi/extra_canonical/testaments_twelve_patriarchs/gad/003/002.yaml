base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/002.yaml
  text: Whatever the one who hates may do is abominable. If anyone does the law of the Lord, the hater does not praise him. If anyone fears the Lord and desires what is righteous, the hater does not love him.
translation:
  language: hi
  text: घृणा करने वाला जो कुछ भी करता है, वह घृणित होता है। यदि कोई प्रभु की व्यवस्था का पालन करता है, तो घृणा करने वाला उसकी प्रशंसा नहीं करता। यदि कोई प्रभु का भय मानता है और जो उचित है उसकी इच्छा करता है, तो घृणा करने वाला उससे प्रेम नहीं करता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μισῶν
  choice: घृणा करने वाला
  rationale: वर्तमान कृदंत का व्यक्तिवाचक बल बनाए रखता है और तीनों वाक्यों में उसी व्यक्ति का स्पष्ट, स्वाभाविक उल्लेख करता है।
- source_word: βδελυκτόν
  choice: घृणित
  rationale: इसका प्रबल नैतिक-विकर्षण का भाव सुरक्षित रहता है; सामान्य पाठक के लिए भी यह स्पष्ट और गरिमापूर्ण है।
- source_word: ποιῇ τὸν νόμον Κυρίου
  choice: प्रभु की व्यवस्था का पालन करता है
  rationale: यूनानी में शाब्दिक रूप से ‘व्यवस्था को करता है’ है; हिन्दी में ‘व्यवस्था का पालन करना’ उसी आशय की स्वाभाविक अभिव्यक्ति है।
- source_word: φοβεῖται Κύριον
  choice: प्रभु का भय मानता है
  rationale: धार्मिक संदर्भ में स्थापित हिन्दी प्रयोग है और भय तथा श्रद्धापूर्ण आज्ञाकारिता के बीच स्रोत की व्यापकता को बनाए रखता है।
- source_word: τὸ δίκαιον
  choice: धार्मिकता
  rationale: नपुंसकलिंगी विशेषण के संज्ञात्मक प्रयोग को नैतिक रूप से ‘जो उचित/धर्मी है’ के भाव में संक्षेप और गरिमा से व्यक्त करता है।
theological_decisions:
- issue: ‘प्रभु की व्यवस्था को करना’ का अर्थ
  choice: प्रभु की व्यवस्था का पालन करना
  alternative: प्रभु की व्यवस्था को पूरा करना
  rationale: ‘पालन करना’ आज्ञाओं के अनुसार आचरण का सीधा अर्थ देता है और ‘पूरा करना’ से उत्पन्न संभावित अतिरिक्त धर्मवैज्ञानिक अर्थ से बचता है।
- issue: τὸ δίκαιον की अभिव्यक्ति
  choice: धार्मिकता की इच्छा रखता है
  alternative: जो उचित है उसकी इच्छा रखता है
  rationale: ‘धार्मिकता’ नैतिक और धार्मिक आयाम दोनों रखती है, पर इसे किसी विशिष्ट सम्प्रदायगत सिद्धान्त तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ὁ μισῶν को हर बार स्पष्ट रूप से दोहराया गया है, ताकि मूल की कर्ता-संगति बनी रहे और उसे अस्पष्ट सर्वनाम में न बदला जाए।
