reference: Testament of Gad 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: III. Καὶ νῦν ἀκούσατε¹ λόγον² ἀληθείας³, *τοῦ ποιεῖν⁴ δικαιοσύνην, καὶ πάντα⁵ νόμον⁶ ὑψίστου, καὶ μὴ⁷ πλανᾶσθε⁸ τέκνα *τῷ πνεύματι⁹ τοῦ μίσους¹⁰, ὅτι κακόν ἐστιν ἐπὶ πάσαις ταῖς¹¹ πράξεσι τῶν¹¹ ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/001.yaml
  text: 'And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, children, by the spirit of hatred, because it is evil in all the deeds of men.'
translation:
  language: hi
  text: और अब सत्य की बात सुनो, ताकि तुम धार्मिकता का आचरण करो और परमप्रधान की हर व्यवस्था का पालन करो। हे बच्चो, घृणा की आत्मा से भटकाए न जाओ, क्योंकि वह मनुष्यों के सभी कामों में बुरी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: सत्य की बात
  rationale: यूनानी पदबंध का सहज और अर्थनिष्ठ रूप; ‘वचन’ की अपेक्षा सामान्य उपदेशात्मक संदर्भ में ‘बात’ अधिक स्वाभाविक है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: नैतिक रूप से उचित आचरण और धर्मपरायणता—दोनों अर्थक्षेत्रों को बनाए रखता है।
- source_word: πάντα νόμον ὑψίστου
  choice: परमप्रधान की हर व्यवस्था
  rationale: ὑψίστου को पारंपरिक दिव्य उपाधि ‘परमप्रधान’ और νόμον को व्यापक आज्ञा/व्यवस्था के अर्थ में प्रस्तुत करता है।
- source_word: τῷ πνεύματι τοῦ μίσους
  choice: घृणा की आत्मा से
  rationale: मूल के व्यक्तिवाची अथवा प्रभावकारी ‘आत्मा’ संबंधी तनाव को बिना केवल ‘भावना’ बनाकर घटाए सुरक्षित रखता है।
- source_word: πλανᾶσθε
  choice: भटकाए न जाओ
  rationale: मध्य/कर्मवाच्य रूप के अनुसार बाहरी प्रभाव द्वारा पथभ्रष्ट किए जाने का भाव बनाए रखता है।
- source_word: κακόν ἐστιν ἐπὶ πάσαις ταῖς πράξεσι
  choice: वह मनुष्यों के सभी कामों में बुराई ही करती है
  rationale: मुहावरेदार हिन्दी में घृणा की आत्मा के हर मानवीय कर्म पर बुरे प्रभाव को व्यक्त करता है; ‘ही’ सर्वव्यापक नकारात्मकता पर बल देता है।
theological_decisions:
- issue: ‘घृणा की आत्मा’ का स्वरूप
  choice: घृणा की आत्मा
  alternative: घृणा की भावना
  rationale: मूल πνεῦμα की संभावित आध्यात्मिक सत्ता और मनोवृत्ति—दोनों की अस्पष्टता को बनाए रखा गया है; इसे केवल मनोवैज्ञानिक भावना मानकर सीमित नहीं किया गया।
- issue: अंतिम उपवाक्य में κακόν का संबंध
  choice: घृणा की आत्मा मनुष्यों के सभी कामों में बुराई करती है
  alternative: वह मनुष्यों के हर काम के लिए बुरी है
  rationale: ἐπὶ πάσαις ταῖς πράξεσι का सटीक संबंध कुछ असहज/व्यापक है। चुना हुआ रूप मूल आशय को स्वाभाविक हिन्दी में व्यक्त करता है, पर घृणा को स्वयं हर मानवीय कर्म के बराबर नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी; उपदेशात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘हे बच्चो’ में मूल τέκνα का संबोधन रखा गया है, पर यूनानी में अनुपस्थित ‘मेरे’ नहीं जोड़ा गया।
