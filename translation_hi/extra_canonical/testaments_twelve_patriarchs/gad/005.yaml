    2. इसलिए, मेरे बच्चो, मैं अपने अनुभव से तुमसे ये बातें कहता हूँ, ताकि तुम शैतानी घृणा को निकाल फेंको और परमेश्वर के प्रेम से जुड़े रहो। 3. धार्मिकता घृणा को निकाल देती है और नम्रता ईर्ष्या को दूर करती है।[b] क्योंकि धर्मी और नम्र मनुष्य अन्याय करने में लज्जा अनुभव करता है—इसलिए नहीं कि कोई दूसरा उसे दोषी ठहराता है, बल्कि इसलिए कि उसका अपना हृदय उसे दोषी ठहराता है, क्योंकि प्रभु उसकी आत्मा पर दृष्टि रखता है। 4. वह किसी पवित्र मनुष्य के विरुद्ध बुरा नहीं बोलता, क्योंकि परमेश्वर का भय उसमें वास करता है। 5. प्रभु को ठेस पहुँचाने के भय से वह किसी मनुष्य के साथ तनिक भी अन्याय नहीं करना चाहता—विचार तक में नहीं।


    6. यूसुफ के विषय में पश्चात्ताप करने के बाद ही अन्ततः मैंने ये बातें सीखीं। 7. क्योंकि परमेश्वर के अनुसार सच्चा पश्चात्ताप [अज्ञान को दूर करता और][a] अन्धकार को भगा देता है; वह आँखों को ज्योति देता, आत्मा को ज्ञान प्रदान करता और मन के संकल्प को उद्धार की ओर ले जाता है। 8. और उसने यह मनुष्यों से नहीं सीखा; बल्कि पश्चात्ताप के द्वारा वह लौटनेवालों को ग्रहण करना जानता है।[c]


    9. क्योंकि परमेश्वर ने मुझे यकृत का रोग दिया; और यदि मेरे पिता की प्रार्थनाओं ने मेरी सहायता न की होती, तो मेरा प्राण लगभग निकल ही गया होता। 10. क्योंकि मनुष्य जिन अंगों के द्वारा व्यवस्था का उल्लंघन करता है, उन्हीं के द्वारा उसे दण्ड मिलता है। 11. इसलिए, चूँकि मेरा कलेजा यूसुफ के प्रति निर्दय बना रहा था, मैं भी अपने यकृत में कष्ट पाता हुआ दस वर्ष तक निर्दयतापूर्वक दण्डित किया गया—उतने ही समय तक, जितने समय मैं यूसुफ के विरुद्ध अड़ा रहा था।[d]'
