  text: '1[a]. Hatred, then, is evil, because it keeps company with falsehood continually, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.


    2. Therefore I say these things to you from experience, my children, so that you may drive out the devilish hatred and cling to the love of God. 3. Righteousness casts out hatred, and humility removes jealousy[b]. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul. 4. He does not speak against a holy man, because the fear of God dwells in him. 5. For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.


    6. These things I learned at last after I repented concerning Joseph. 7. For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the purpose toward salvation. 8. And he did not learn this from men, but through repentance he knows how to receive those who turn back.


    9. For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed. 10. For by the very things through which a man transgresses, through those he is punished. 11. Since, then, my liver lay pitilessly set against Joseph, I too, suffering in my liver[c], was judged pitilessly for ten years.'
translation:
  language: hi
  text: '**गाद का वसीयतनामा 5**


    1. इसलिए घृणा बुरी है, क्योंकि वह निरन्तर झूठ का साथ देती और सत्य के विरुद्ध बोलती है। वह छोटी बातों को बड़ा बनाती, प्रकाश को अन्धकार के रूप में प्रस्तुत करती और मीठे को कड़वा कहती है। वह बदनामी करना सिखाती, क्रोध और युद्ध भड़काती, और हृदय को उद्दण्डता, हर प्रकार के लालच, बुराइयों और शैतानी विष से भर देती है।


    2. इसलिए, मेरे बच्चो, मैं अपने अनुभव से तुमसे ये बातें कहता हूँ, ताकि तुम शैतानी घृणा को निकाल फेंको और परमेश्वर के प्रेम से जुड़े रहो। 3. धार्मिकता घृणा को निकाल देती है और नम्रता ईर्ष्या को दूर करती है।[b] क्योंकि धर्मी और नम्र मनुष्य अन्याय करने में लज्जा अनुभव करता है—इसलिए नहीं कि कोई दूसरा उसे दोषी ठहराता है, बल्कि इसलिए कि उसका अपना हृदय उसे दोषी ठहराता है, क्योंकि प्रभु उसकी आत्मा पर दृष्टि रखता है। 4. वह किसी पवित्र मनुष्य के विरुद्ध बुरा नहीं बोलता, क्योंकि परमेश्वर का भय उसमें वास करता है। 5. प्रभु को ठेस पहुँचाने के भय से वह किसी मनुष्य के साथ तनिक भी अन्याय नहीं करना चाहता—विचार तक में नहीं।


    6. यूसुफ के विषय में पश्चात्ताप करने के बाद अन्ततः मैंने ये बातें सीखीं। 7. क्योंकि परमेश्वर के अनुसार सच्चा पश्चात्ताप [अज्ञान को दूर करता और][a] अन्धकार को भगा देता है; वह आँखों को ज्योति देता, आत्मा को ज्ञान प्रदान करता और मन के संकल्प को उद्धार की ओर ले जाता है। 8. और उसने यह मनुष्यों से नहीं सीखा; बल्कि पश्चात्ताप के द्वारा वह लौटनेवालों को ग्रहण करना जानता है।[c]


    9. क्योंकि परमेश्वर ने मुझे यकृत का रोग दिया; और यदि मेरे पिता की प्रार्थनाओं ने मेरी सहायता न की होती, तो मेरा प्राण लगभग निकल ही गया होता। 10. क्योंकि मनुष्य जिन बातों के द्वारा व्यवस्था का उल्लंघन करता है, उन्हीं के द्वारा उसे दण्ड मिलता है। 11. इसलिए, चूँकि मेरा कलेजा यूसुफ के प्रति निर्दय बना रहा था, मैं भी अपने यकृत में कष्ट पाता हुआ दस अवधियों तक निर्दयतापूर्वक दण्डित किया गया—उतने ही समय तक, जितने समय मैं यूसुफ के विरुद्ध अड़ा रहा था।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अज्ञान को दूर करता और” शब्द यूनानी पाठ-साक्ष्य में अनिश्चित हैं; इसलिए इन्हें कोष्ठकों में रखा गया है।
    reason: textual_variant
  - marker: b
    text: “ईर्ष्या” के लिए यूनानी शब्द का अर्थ “जलन” या प्रतिद्वंद्वितापूर्ण ईर्ष्या भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस वाक्य का कर्ता यूनानी में स्पष्ट नहीं है। सन्दर्भ के अनुसार इसे परमेश्वर समझा जा सकता है; दूसरा सम्भव अर्थ पश्चात्ताप या पश्चात्ताप करनेवाले व्यक्ति से जुड़ता है।
    reason: ambiguity
  - marker: d
    text: यूनानी में “दस अवधियों” का समय-मान निर्दिष्ट नहीं है; इसे “दस वर्ष” भी समझा गया है। अन्तिम उपवाक्य मूल में उपस्थित है और गाद की बीमारी की अवधि को यूसुफ के विरुद्ध उसके अड़े रहने की अवधि से जोड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μῖσος
  choice: घृणा
  rationale: अमूर्त दुर्गुण के रूप में प्रयुक्त संज्ञा को सुरक्षित रखता है और पूरे अध्याय की विषयवस्तु से मेल खाता है।
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: निरन्तर झूठ का साथ देती है
  rationale: घृणा और झूठ की लगातार संगति का मानवीकरण स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: छोटी बातों को बड़ा बनाती है
  rationale: यूनानी के संक्षिप्त अलंकारिक विरोध को स्पष्ट और सहज रूप में रखता है।
- source_word: συκοφαντίαν
  choice: बदनामी करना
  rationale: प्रसंग में दुर्भावनापूर्ण निन्दा अथवा झूठे आरोप का सामान्य आधुनिक हिन्दी रूप।
- source_word: ὕβριν
  choice: उद्दण्डता
  rationale: यह केवल मन का अहंकार नहीं, बल्कि अपमानजनक और सीमा लाँघनेवाले व्यवहार का भाव भी व्यक्त करता है।
- source_word: πλεονεξίαν
  choice: लालच
  rationale: अधिक पाने की अनुचित लालसा के लिए सरल और व्यापक आधुनिक शब्द।
- source_word: ἰοῦ διαβολικοῦ
  choice: शैतानी विष
  rationale: विष की सजीव छवि और विशेषणात्मक संबंध दोनों सुरक्षित रहते हैं।
- source_word: τὸ ζῆλος
  choice: ईर्ष्या
  rationale: यहाँ प्रतिद्वंद्वितापूर्ण ईर्ष्या या जलन का दुर्गुण अभिप्रेत है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: μετάνοια
  choice: पश्चात्ताप
  rationale: यूसुफ के प्रति गाद के नैतिक परिवर्तन और परमेश्वर की ओर उन्मुख धार्मिक परिवर्तन, दोनों का भार वहन करता है।
- source_word: τὰ ἥπατα / τῷ ἥπατι
  choice: कलेजा / यकृत
  rationale: पहले प्रयोग में भावनाओं के केन्द्र का रूपक दिखाने के लिए 'कलेजा', और रोग के शारीरिक स्थान के लिए 'यकृत' रखा गया है; इससे यूनानी शब्द-क्रीड़ा भी यथासम्भव दिखाई देती है।
theological_decisions:
- issue: पद 6–8 में μετάνοια का अर्थ
  choice: पश्चात्ताप
  alternative: मन बदलना
  rationale: पद 6 में यूसुफ के प्रति दृष्टिकोण बदलना शामिल है, पर पद 7–8 इसे व्यापक नैतिक और परमेश्वर-संबंधी परिवर्तन बनाते हैं; 'पश्चात्ताप' दोनों आयामों को समेटता है।
- issue: पद 7 का कोष्ठकबद्ध वाक्यांश
  choice: '[अज्ञान को दूर करता और] को कोष्ठकों सहित रखा गया'
  alternative: वाक्यांश को छोड़ देना अथवा बिना कोष्ठक के मूल पाठ में मिला देना
  rationale: यूनानी साक्ष्य में इसकी पाठगत अनिश्चितता को पाठक से छिपाए बिना अर्थ भी उपलब्ध कराया गया है।
- issue: पद 8 में कर्ता की पहचान
  choice: मुख्य पाठ में पुरुषवाचक एकवचन को बनाए रखा; टिप्पणी में परमेश्वर को सम्भावित कर्ता बताया
  alternative: पश्चात्ताप को कर्ता मानना अथवा वाक्य को निर्वैयक्तिक बनाना
  rationale: यूनानी वाक्य में कर्ता स्पष्ट नहीं है। सन्दर्भ में परमेश्वर सम्भावित है, पर अनिश्चितता को फुटनोट में सुरक्षित रखा गया है।
- issue: पद 10 में अंग और दण्ड का संबंध
  choice: जिन अंगों के द्वारा उल्लंघन, उन्हीं के द्वारा दण्ड
  alternative: जिन बातों में पाप, उन्हीं में दण्ड
  rationale: अगले पद में कलेजे/यकृत की शब्द-क्रीड़ा इस शारीरिक-साधनात्मक अर्थ का समर्थन करती है; इसे सामान्य प्रतिफल-सिद्धान्त में विलीन नहीं किया गया।
- issue: पद 11 में χρόνους δέκα
  choice: दस वर्ष
  alternative: दस कालखंड अथवा दस अवधियाँ
  rationale: χρόνους अपने आप में सामान्यतः 'समय/अवधियाँ' है; पर परम्परागत पाठ-सन्दर्भ में इसे वर्षों के रूप में समझा गया है। निश्चितता से अधिक न दिखाने के लिए शाब्दिक स्थिति फुटनोट में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। नैतिक उपदेश में छोटे, समानान्तर वाक्य रखकर यूनानी की अलंकारिक गति बचाई गई है। 'परमेश्वर', 'प्रभु', 'धार्मिकता', 'आत्मा' और 'उद्धार' जैसे स्थापित धार्मिक शब्द रखे गए हैं, पर किसी सम्प्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
