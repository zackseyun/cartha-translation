id: T12P.GAD.4.3
reference: Testament of Gad 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. ΓἘὰν γὰρ πέσῃ ὁ ἀδελφός⁹, *σπουδάζει εὐθὺς¹⁰ ἀναγγεῖλαι τοῖς¹¹ πᾶσιν, καὶ σπεύδει *περὶ αὐτοῦ ἵνα κριθεὶς¹² καὶ κολασθεὶς ἀποθάνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/003.yaml
  text: For if a brother falls, it is eager at once to report it to everyone, and it hastens concerning him so that, having been judged and punished, he may die.
translation:
  language: hi
  text: क्योंकि यदि कोई भाई गिर जाए, तो वह तुरन्त सबको इसकी सूचना देने के लिए उतावला होता है और उसके मामले में जल्दबाज़ी करता है, ताकि उसका न्याय हो, उसे दण्ड दिया जाए और वह मर जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέσῃ
  choice: गिर जाए
  rationale: मूल की रूपकात्मक और नैतिक अस्पष्टता को बनाए रखता है; इसे विशेष रूप से ‘पाप करे’ कहकर सीमित नहीं किया गया।
- source_word: σπουδάζει
  choice: उतावला होता है
  rationale: यहाँ निहित तत्पर और उत्सुक प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναγγεῖλαι
  choice: यह बताने
  rationale: किसी के पतन की बात सबके सामने सूचित या प्रकट करने का सामान्य अर्थ देता है।
- source_word: σπεύδει περὶ αὐτοῦ
  choice: उसके विषय में ... जल्दी मचाता है
  rationale: περὶ αὐτοῦ को स्पष्ट रूप से बनाए रखते हुए σπεύδει की हड़बड़ी और सक्रिय तत्परता व्यक्त करता है।
- source_word: κριθεὶς
  choice: दोषी ठहराया जाए
  rationale: इस दण्डात्मक प्रसंग में केवल ‘न्याय किया जाए’ की अपेक्षा निर्णय द्वारा दोषी ठहराए जाने का भाव अधिक स्वाभाविक है।
- source_word: κολασθεὶς
  choice: दण्ड पाए
  rationale: यूनानी निष्क्रिय कृदन्त के दण्डित होने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀποθάνῃ
  choice: मर जाए
  rationale: मूल के स्पष्ट मृत्यु-सूचक अर्थ का सीधा अनुवाद है।
theological_decisions:
- issue: ‘वह’ का पूर्वपद
  choice: सर्वनाम ‘वह’ को बनाए रखा गया, जो पूर्ववर्ती प्रसंग में वर्णित दुर्गुण या घृणा की ओर संकेत करता है।
  alternative: अर्थ स्पष्ट करने के लिए उस दुर्गुण का नाम दोहराना।
  rationale: इस पद में यूनानी कर्ता अंतर्निहित है; उपलब्ध पदांश से उसका नाम जोड़ना पाठ में अनावश्यक व्याख्या आयात करता।
- issue: भाई का ‘गिरना’
  choice: ‘गिर जाए’
  alternative: ‘पाप करे’ या ‘अपराध करे’
  rationale: मूल πέσῃ का रूपकात्मक खुलापन और नैतिक तनाव सुरक्षित रखा गया है।
- issue: न्याय और मृत्यु के बीच संबंध
  choice: ‘कि वह दोषी ठहराया जाए, दण्ड पाए और मर जाए’
  alternative: ‘ताकि न्याय और दण्ड के परिणामस्वरूप उसकी मृत्यु हो’
  rationale: मूल के क्रम—κριθεὶς, κολασθεὶς, ἀποθάνῃ—को बिना अतिरिक्त कारणात्मक धर्मवैचारिक व्याख्या के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। वाक्य की कठोर दण्डात्मक गति तथा मूल में कर्ता की अंतर्निहित अस्पष्टता को सुरक्षित रखा गया है।
