revisions:
- from: क्योंकि यदि कोई भाई गिर जाए, तो वह तुरन्त सबको यह बताने के लिए उतावला होता है और उसके विषय में इस बात के लिए जल्दी मचाता है कि वह दोषी ठहराया जाए, दण्ड पाए और मर जाए।
  to: क्योंकि यदि कोई भाई गिर जाए, तो वह तुरन्त सबको इसकी सूचना देने के लिए उतावला होता है और उसके मामले में जल्दबाज़ी करता है, ताकि उसका न्याय हो, उसे दण्ड दिया जाए और वह मर जाए।
  rationale: The revision removes the unwarranted specification that the brother is ‘found guilty’ and replaces an awkward expression of urgent action with idiomatic Hindi. It otherwise preserves the source’s implicit subject, the ambiguity of ‘fall,’ the public reporting to all, and the stated progression from judgment and punishment to death.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:32:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the figurative openness of πέσῃ (‘गिर जाए’) and the sequence of reporting, judgment, punishment, and death. However, ‘दोषी ठहराया जाए’ narrows κριθεὶς (‘having been judged’) to a guilty verdict, which the Greek itself does not explicitly state. The revised wording retains the passive judicial action without importing that result.
  naturalness: ‘उसके विषय में इस बात के लिए जल्दी मचाता है’ is not idiomatic modern standard Hindi. ‘उसके मामले में जल्दबाज़ी करता है’ is natural while retaining the Greek’s somewhat terse περὶ αὐτοῦ (‘concerning him’).
  terminology: ‘न्याय हो’ renders κριθεὶς without adding a conviction; ‘दण्ड दिया जाए’ clearly renders κολασθεὶς. ‘मर जाए’ remains a direct rendering of ἀποθάνῃ. The antecedent of ‘वह’ remains appropriately unexpanded, since the Greek subject is implicit and depends on prior context.
  issues:
  - severity: medium
    issue: ‘दोषी ठहराया जाए’ over-specifies κριθεὶς.
    rationale: κριθεὶς means ‘having been judged’ and does not itself explicitly say ‘found guilty.’ The surrounding punitive context may imply an adverse outcome, but the translation should not state it as part of this participle’s lexical meaning.
  - severity: medium
    issue: ‘उसके विषय में इस बात के लिए जल्दी मचाता है’ is unnatural Hindi.
    rationale: The phrase is grammatically and stylistically strained. A more idiomatic expression can preserve the sense of urgent action concerning the fallen brother.
  revised_text: क्योंकि यदि कोई भाई गिर जाए, तो वह तुरन्त सबको इसकी सूचना देने के लिए उतावला होता है और उसके मामले में जल्दबाज़ी करता है, ताकि उसका न्याय हो, उसे दण्ड दिया जाए और वह मर जाए।
  revised_footnotes: []
  revision_rationale: The revision removes the unwarranted specification that the brother is ‘found guilty’ and replaces an awkward expression of urgent action with idiomatic Hindi. It otherwise preserves the source’s implicit subject, the ambiguity of ‘fall,’ the public reporting to all, and the stated progression from judgment and punishment to death.
