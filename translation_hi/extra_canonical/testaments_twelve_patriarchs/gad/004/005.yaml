  text: 5. *Τῷ γὰρ φθόνῳ συνεργεῖ τὸ μῖσος¹⁹, καὶ²⁰ κατὰ τῶν εὐπραγούντων· *ἐν προκοπῇ²¹ ἀκούων καὶ²² ὁρῶν πάντοτε ἀσθενεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/005.yaml
  text: For hatred works together with envy, even against those who prosper; hearing and seeing them in their progress, it is always weakened.
translation:
  language: hi
  text: क्योंकि घृणा ईर्ष्या के साथ मिलकर काम करती है, यहाँ तक कि सफल होनेवालों के विरुद्ध भी; उन्हें उन्नति करते सुनकर और देखकर ईर्ष्या सदा दुर्बल पड़ती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  choice: ईर्ष्या
  rationale: यह दूसरों की उन्नति से उत्पन्न डाह या जलन को दर्शाता है; आधुनिक मानक हिन्दी में ‘ईर्ष्या’ स्पष्ट और स्वाभाविक है।
- source_word: μῖσος
  choice: घृणा
  rationale: यह φθόνος से अलग भाव है और विरोधपूर्ण hatred को व्यक्त करता है; दोनों शब्दों का भेद बनाए रखा गया है।
- source_word: εὐπραγούντων
  choice: फलते-फूलते लोगों
  rationale: कृदंत का अर्थ उन लोगों से है जिनका काम अच्छा चल रहा है या जो समृद्ध हो रहे हैं; यह हिन्दी अभिव्यक्ति उस व्यापक अर्थ को सहज रूप में रखती है।
- source_word: ἐν προκοπῇ
  choice: उनकी उन्नति
  rationale: προκοπή आगे बढ़ने, प्रगति या उन्नति का संकेत देता है; प्रसंग में ईर्ष्या के लक्ष्य बने लोगों की उन्नति अभिप्रेत है।
- source_word: ἀσθενεῖ
  choice: दुर्बल पड़ती है
  rationale: क्रिया अकर्मक रूप में कमजोर होने या शक्ति खोने का भाव देती है; इसे सक्रिय ‘कमजोर करती है’ नहीं बनाया गया।
theological_decisions:
- issue: अंतिम क्रिया और कृदंतों का कर्ता
  choice: ईर्ष्या
  alternative: घृणा
  rationale: ἀκούων और ὁρῶν पुल्लिंग एकवचन हैं और निकटवर्ती पुल्लिंग φθόνος से व्याकरणतः मेल खाते हैं, जबकि μῖσος नपुंसकलिंग है। फिर भी कथन की संरचना के कारण ‘घृणा’ को अंतिम क्रिया का कर्ता समझने की कुछ संभावना बनी रहती है, इसलिए इसे पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घृणा’ और ‘ईर्ष्या’ को अलग भावों के रूप में बनाए रखा गया है तथा यूनानी के अकर्मक अंतिम क्रियार्थ को स्पष्ट किया गया है।
