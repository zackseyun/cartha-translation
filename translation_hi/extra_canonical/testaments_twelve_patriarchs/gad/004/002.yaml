  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/002.yaml
  text: For it does not want to hear the words of his commandments concerning love for his neighbor, and it sins against God.
translation:
  language: hi
  text: क्योंकि वह उसकी उन आज्ञाओं के वचन सुनना नहीं चाहता जो पड़ोसी से प्रेम के विषय में हैं, और परमेश्वर के विरुद्ध पाप करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλει ἀκούειν
  choice: सुनना नहीं चाहता
  rationale: इच्छा और सुनने—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: उसकी आज्ञाओं की बातें
  rationale: λόγων और ἐντολῶν दोनों को व्यक्त करता है; αὐτοῦ का संदर्भ स्रोत में जैसा है वैसा ही अस्पष्ट रखा गया है।
- source_word: περὶ ἀγάπης τοῦ πλησίον
  choice: अपने पड़ोसी से प्रेम करने के विषय में
  rationale: पड़ोसी के प्रति प्रेम का अर्थ साधारण और स्पष्ट हिन्दी में देता है।
- source_word: εἰς Θεὸν ἁμαρτάνει
  choice: परमेश्वर के विरुद्ध पाप करता है
  rationale: εἰς के लक्ष्य/विरोध संबंधी भाव को हिन्दी में स्वाभाविक रीति से व्यक्त करता है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसकी’ सर्वनाम को बनाए रखा
  alternative: ‘परमेश्वर की’ कहकर संदर्भ स्पष्ट करना
  rationale: इस पृथक पद में सर्वनाम का पूर्वपद निश्चित नहीं है; अनुवाद में उसे चुपचाप निर्धारित नहीं किया गया।
- issue: निहित कर्ता का लिंग
  choice: ‘वह’ का प्रयोग
  alternative: किसी विशेष नैतिक वृत्ति या व्यक्ति का नाम जोड़ना
  rationale: ग्रीक में कर्ता पूर्ववर्ती संदर्भ से निहित है; हिन्दी में आवश्यक सर्वनाम दिया गया, पर उसकी पहचान नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा dignified किंतु सामान्य पाठक के लिए सहज है। मूल की सर्वनाम-संबंधी अस्पष्टता और नैतिक कथन की तीव्रता सुरक्षित रखी गई है।
