id: T12P.GAD.4.6
reference: Testament of Gad 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὥσπερ²³ ἡ ἀγάπη Γκαὶ¹ τοὺς νεκροὺς *θέλει ζωοποιῆσαι²⁴ καὶ τοὺς ἐν²⁵ ἀποφάσει θανάτου θέλει²⁶ ἀνακαλέσασθαι, οὕτως καὶ²⁷ τὸ μῖσος τοὺς ζῶντας θέλει ἀποκτεῖναι, καὶ *τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας²⁸ οὐ θέλει ζῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/006.yaml
  text: Just as love wants to make the dead alive and to call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned in a little matter to live.
translation:
  language: hi
  text: जैसे प्रेम मरे हुओं को जीवित करना और जिन्हें मृत्युदण्ड सुनाया गया है उन्हें वापस बुलाना चाहता है, वैसे ही घृणा जीवितों को मार डालना चाहती है और यह नहीं चाहती कि थोड़ी-सी बात में पाप करने वाले जीवित रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: यह सामान्य और स्वाभाविक हिन्दी शब्द यूनानी संज्ञा के सकारात्मक नैतिक अर्थ को सीधे व्यक्त करता है।
- source_word: θέλει ζωοποιῆσαι
  choice: जीवित करना चाहता है
  rationale: θέλει की इच्छा-सूचक शक्ति और ζωοποιῆσαι के ‘जीवन देना/जीवित करना’ अर्थ, दोनों को स्पष्ट रूप से बनाए रखा गया है।
- source_word: ἐν ἀποφάσει θανάτου
  choice: जिन्हें मृत्यु-दण्ड सुनाया गया है
  rationale: ἀπόφασις को न्यायिक निर्णय के रूप में समझते हुए स्वाभाविक हिन्दी में मृत्यु की सुनाई गई सजा व्यक्त की गई है।
- source_word: ἀνακαλέσασθαι
  choice: वापस बुलाना
  rationale: क्रिया के मूल ‘फिर बुलाना/वापस बुलाना’ अर्थ को रखा गया है; इसे क्षमा करना या पुनर्जीवित करना कहकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: μῖσος
  choice: घृणा
  rationale: यह प्रेम के प्रतिलोम नैतिक भाव को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: थोड़ी-सी बात में पाप करनेवाले
  rationale: ἐν ὀλίγῳ की अस्पष्टता को बनाए रखते हुए इसे पाप की अपेक्षाकृत छोटी बात या प्रसंग के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: प्रेम द्वारा मृतकों को जीवित करने और मृत्यु-दण्ड पाए लोगों को वापस बुलाने का कथन
  choice: इसे प्रेम की इच्छा के रूप में शाब्दिक-सन्निकट ढंग से रखा गया है
  alternative: इसे परमेश्वर के पुनरुत्थान, क्षमा या दण्ड-मुक्ति का स्पष्ट धर्मवैज्ञानिक दावा बनाना
  rationale: पाठ प्रेम और घृणा का मानवीकरण करता है और θέλει को दोहराता है; किसी विशिष्ट सिद्धान्त को जोड़ना स्रोत की सीमा से आगे जाता।
- issue: ἐν ὀλίγῳ का आशय
  choice: ‘थोड़ी-सी बात में’
  alternative: ‘थोड़ा पाप करनेवाले’ या ‘एक छोटे पाप के दोषी’
  rationale: यूनानी पद मात्रा, छोटे प्रसंग या मामूली विषय की ओर संकेत कर सकता है; चुनी हुई अभिव्यक्ति इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल की ‘जैसे… वैसे ही…’ समानांतर संरचना और प्रेम तथा घृणा के मानवीकरण को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
