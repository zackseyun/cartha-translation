id: T12P.GAD.4.7
reference: Testament of Gad 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Τὸ γὰρ πνεῦμα τοῦ μίσους *διὰ τῆς²⁹ ὀλιγοψυχίας συνεργεῖ τῷ Σατανᾷ ἐν πᾶσιν εἰς θάνατον τῶν ἀνθρώπων, τὸ δὲ πνεῦμα τῆς ἀγάπης *ἐν μακροθυμίᾳ³⁰ συνεργεῖ *τῷ νόμῳ³¹ τοῦ Θεοῦ εἰς σωτηρίαν τῶν³² ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/007.yaml
  text: For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through longsuffering, works together with the law of God for the salvation of men.
translation:
  language: hi
  text: क्योंकि घृणा की आत्मा मन की दुर्बलता के द्वारा हर बात में शैतान के साथ मिलकर मनुष्यों की मृत्यु के लिए काम करती है; परन्तु प्रेम की आत्मा धीरज के द्वारा परमेश्वर की व्यवस्था के साथ मिलकर मनुष्यों के उद्धार के लिए काम करती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοψυχίας
  choice: हृदय की दुर्बलता
  rationale: यह यूनानी शब्द ‘हिम्मत हारना/मन का दुर्बल होना’ व्यक्त करता है। ‘कायरता’ अनावश्यक रूप से कठोर होता, जबकि यह चयन मूल की व्यापक अर्थ-छाया बनाए रखता है।
- source_word: μακροθυμίᾳ
  choice: धीरज
  rationale: यहाँ दीर्घ-सहनशीलता और उकसावे के बीच टिके रहने का भाव है; ‘धीरज’ आधुनिक हिन्दी में स्वाभाविक और सुबोध है।
- source_word: συνεργεῖ
  choice: के साथ मिलकर … काम करती है
  rationale: क्रिया का सहयोग या सहकार्य का स्पष्ट भाव सुरक्षित रखा गया है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: धार्मिक सन्दर्भ में परमेश्वर की ‘व्यवस्था’ νόμος का स्वाभाविक हिन्दी समतुल्य है और इसे केवल किसी एक आज्ञा तक सीमित नहीं करती।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: यह धार्मिक सन्दर्भ में बचाव तथा मुक्ति के व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: πνεῦμα को व्यक्तिगत आत्मिक सत्ता या आन्तरिक प्रवृत्ति के रूप में समझना
  choice: आत्मा
  alternative: भावना/प्रवृत्ति
  rationale: मूल दोनों पदों में πνεῦμα का समानान्तर प्रयोग करता है। ‘आत्मा’ उस सम्भावित व्यक्तिकरण और मूल की अस्पष्टता को सुरक्षित रखता है; इसे केवल मनोवैज्ञानिक प्रवृत्ति मानकर सीमित नहीं किया गया।
- issue: ‘परमेश्वर की व्यवस्था के साथ मिलकर’ सहकार्य की भाषा
  choice: मूल सहकार्य की भाषा को ज्यों का त्यों बनाए रखा
  alternative: परमेश्वर की व्यवस्था के अनुसार काम करती है
  rationale: συνεργεῖ τῷ νόμῳ सीधे तौर पर ‘व्यवस्था के साथ सहकार्य’ कहता है। इसे ‘के अनुसार’ कर देना मूल की असामान्य किन्तु अर्थपूर्ण अभिव्यक्ति को हल कर देता।
- issue: εἰς θάνατον और εἰς σωτηρίαν का लक्ष्यसूचक प्रयोग
  choice: मृत्यु के लिए / उद्धार के लिए
  alternative: मृत्यु की ओर / उद्धार की ओर
  rationale: लक्ष्य अथवा परिणाम की मूल समानान्तर संरचना बनाए रखी गई है और उसके कारणात्मक बल को कम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। यूनानी वाक्य की विरोधात्मक समानान्तरता—घृणा/प्रेम, दुर्बलता/धीरज, शैतान/परमेश्वर की व्यवस्था, मृत्यु/उद्धार—सुरक्षित रखी गई है।
