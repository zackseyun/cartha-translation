source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ *δοῦλός τις ᾖ¹³, συμβαλεῖ¹⁴ αὐτὸν πρὸς τὸν κύριον αὐτοῦ, καὶ ἐν πάσῃ θλίψει¹⁵ *ἐπιχαίρει αὐτῷ¹⁶, εἴπως¹⁷ θανατωθῇ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/004.yaml
  text: And if someone is a servant, it slanders him to his master, and in every distress it rejoices over him, if perhaps he may be put to death.
translation:
  language: hi
  text: और यदि कोई दास हो, तो वह उसके स्वामी के पास उसकी निंदा करती है और उसकी हर विपत्ति में प्रसन्न होती है कि शायद वह मार डाला जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: यह यूनानी शब्द स्वामी के अधीन दास को दर्शाता है; ‘दास’ आधुनिक हिन्दी में अर्थ को संक्षिप्त और स्पष्ट रूप से रखता है।
- source_word: συμβαλεῖ ... πρὸς τὸν κύριον αὐτοῦ
  choice: उसके स्वामी के सामने उसकी निंदा करती है
  rationale: इस प्रसंग में क्रिया का भाव दास को उसके स्वामी के विरुद्ध बदनाम करने या उस पर आरोप लगाने का है; यह वाक्यांश उस संबंध और हानिकारक वाणी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν πάσῃ θλίψει ἐπιχαίρει αὐτῷ
  choice: उसके हर संकट पर खुश होती है
  rationale: ἐπιχαίρει किसी की विपत्ति पर दुर्भावनापूर्वक प्रसन्न होने का भाव रखता है; ‘संकट’ θλίψις की व्यापकता बनाए रखता है।
- source_word: εἴπως θανατωθῇ
  choice: कि शायद वह मार डाला जाए
  rationale: ‘शायद’ εἴπως की अनिश्चित आशा/संभावना को बनाए रखता है और कर्मवाच्य ‘मार डाला जाए’ θανατωθῇ के प्राणदंड अथवा हिंसक मृत्यु के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: निंदा करने और खुश होने वाले कर्ता की पहचान
  choice: स्त्रीलिंग ‘करती है/होती है’ द्वारा प्रसंगगत ‘घृणा’ को कर्ता माना गया
  alternative: लिंग-निरपेक्ष ‘वह ... करता है’ या कर्ता को स्पष्ट रूप से दोहराना
  rationale: पद का अव्यक्त कर्ता निकटवर्ती प्रसंग में व्यक्तित्व-प्राप्त ‘घृणा’ है। हिन्दी में स्त्रीलिंग क्रियाएँ उस संबंध को स्पष्ट रखती हैं, जबकि मुख्य पाठ में ऐसा कोई नया कर्ता नहीं जोड़ा गया जो यूनानी में नहीं है।
- issue: εἴπως में निहित अनिश्चितता
  choice: ‘कि शायद’
  alternative: ‘इस आशा से कि’
  rationale: मूल की अनिश्चितता और दुर्भावनापूर्ण इच्छा दोनों को बिना निश्चित परिणाम बनाए सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दास’ ऐतिहासिक सामाजिक स्थिति को नरम किए बिना व्यक्त करता है; वाक्य में घृणा के मानवीकरण और मृत्यु की अनिश्चित संभावना को बनाए रखा गया है।
