translation:
  language: hi
  text: इसलिए मेरे बच्चों, घृणा से सावधान रहो, क्योंकि वह प्रभु के विरुद्ध भी अधर्म करती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: अपने आप को बचाए रखो
  rationale: मध्यवाच्य आज्ञार्थक का आत्म-सुरक्षा का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μίσους
  choice: घृणा
  rationale: यह μῖσος का सीधा और गरिमापूर्ण हिन्दी समकक्ष है; आगे स्त्रीलिंग ‘वह’ से घृणा को कर्ता बनाए रखा गया है।
- source_word: ἀνομίαν ποιεῖ
  choice: अधर्म करती है
  rationale: शाब्दिक अर्थ ‘व्यवस्था-विहीनता/अन्याय करना’ है; ‘अधर्म करना’ धार्मिक-नैतिक उल्लंघन का व्यापक भाव संक्षेप में बनाए रखता है।
- source_word: καὶ εἰς αὐτὸν τὸν Κύριον
  choice: स्वयं प्रभु के विरुद्ध भी
  rationale: καί के समावेशी/बलाघाती भाव और αὐτόν के जोर—‘प्रभु स्वयं’—दोनों को स्वाभाविक हिन्दी क्रम में सुरक्षित रखता है।
theological_decisions:
- issue: घृणा को अधर्म करने वाले कर्ता के रूप में प्रस्तुत करना
  choice: ‘वह ... अधर्म करती है’ द्वारा घृणा का व्यक्तिकरण बनाए रखा
  alternative: ‘घृणा करने वाला ... अधर्म करता है’
  rationale: यूनानी वाक्य में ποιεῖ का कर्ता निकटवर्ती ‘घृणा’ है; उसे व्यक्ति पर स्थानांतरित करने से मूल की आलंकारिक और नैतिक तीव्रता बदल जाती।
- issue: प्रभु के विरुद्ध उल्लंघन का बल
  choice: ‘स्वयं प्रभु के विरुद्ध भी’
  alternative: ‘प्रभु के विरुद्ध भी’
  rationale: αὐτόν का स्पष्ट बल हटाए बिना यह दिखाता है कि घृणा केवल मनुष्यों के विरुद्ध अपराध नहीं, प्रभु के विरुद्ध भी अधर्म है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संबोधनात्मक शैली रखी गई है। ‘मेरे बच्चो’ सामान्य पाठकों के लिए स्वाभाविक है; वाक्य में मूल यूनानी का निष्कर्षसूचक ‘इसलिए’ तथा घृणा का व्यक्तिकरण सुरक्षित है।
