  to: क्योंकि मैं अपने पिता के सामने यूसुफ से शान्ति की बातें करता था; परन्तु उसके पास से निकलने के बाद घृणा की आत्मा मेरे मन को अन्धकारमय करती थी और उसे मार डालने की ओर मेरी सोच को व्याकुल करती थी।
