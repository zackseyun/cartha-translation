id: T12P.GAD.6.2
reference: Testament of Gad 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ἐγὼ γὰρ⁸ κατὰ πρόσωπον τοῦ πατρὸς μου⁹, εἰρηνικὰ¹⁰ ἐλάλουν τῷ Ἰωσήφ· *ἐξερχόμενος δὲ ἐξ αὐτοῦ¹¹ τὸ πνεῦμα *τοῦ μίσους ἐσκότιζέ μου τὸν νοῦν¹², καὶ ἐτάρασσέ¹³ *μου τὸν λογισμόν¹⁴ *πρὸς τὸ¹⁵ ἀνελεῖν αὐτόν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/002.yaml
  text: For I myself, in my father’s presence, spoke peaceably to Joseph; but when I had gone out from him, the spirit of hatred darkened my mind and disturbed my thoughts to kill him.
translation:
  language: hi
  text: क्योंकि मैं अपने पिता के सामने यूसुफ से शान्ति की बातें करता था; परन्तु उसके पास से निकलने के बाद घृणा की आत्मा मेरे मन को अन्धकारमय करती थी और उसे मार डालने की ओर मेरी सोच को व्याकुल करती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόσωπον τοῦ πατρὸς μου
  choice: अपने पिता के सामने
  rationale: यूनानी वाक्यांश का स्वाभाविक और अर्थ-सटीक हिन्दी रूप; इसमें पिता की उपस्थिति का भाव बना रहता है।
- source_word: εἰρηνικὰ ἐλάλουν
  choice: शान्ति की बातें करता था
  rationale: नपुंसकलिंग बहुवचन εἰρηνικά को केवल बोलने के ढंग के बजाय शान्तिपूर्ण बातों के रूप में व्यक्त करता है और अपूर्णकाल की आवृत्तिमूलक छाया बचाता है।
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: घृणा की आत्मा
  rationale: मूल की व्यक्तिकृत आध्यात्मिक भाषा को बिना मनोवैज्ञानिक रूप में सीमित किए यथावत रखता है।
- source_word: ἐσκότιζέ μου τὸν νοῦν
  choice: मेरे मन को अन्धकारमय कर देती
  rationale: νοῦς के लिए सामान्य और स्वाभाविक ‘मन’ तथा ἐσκότιζε के रूपक को सुरक्षित रखा गया है।
- source_word: ἐτάρασσέ μου τὸν λογισμόν
  choice: मेरे विचारों को विचलित करती थी
  rationale: λογισμός के चिंतन/विचार के अर्थ को दर्शाता है; हिन्दी में बहुवचन ‘विचारों’ अधिक स्वाभाविक है।
- source_word: πρὸς τὸ ἀνελεῖν αὐτόν
  choice: उसे मार डालने के लिए
  rationale: उद्देश्य अथवा दिशा का सीधा भाव रखता है और ‘मैं चाहता था’ जैसी अनुलिखित इच्छा नहीं जोड़ता।
theological_decisions:
- issue: ‘घृणा की आत्मा’ का स्वरूप
  choice: इसे ‘घृणा की आत्मा’ के रूप में रखा गया
  alternative: ‘घृणा की भावना’
  rationale: πνεῦμα की वास्तविक अस्पष्टता—आध्यात्मिक सत्ता, प्रभाव, या मनोवृत्ति—को केवल भावना मानकर हल नहीं किया गया।
- issue: हत्या की ओर विचारों के विचलन में कर्तृत्व
  choice: वाक्य की व्याकरणिक संरचना के अनुसार ‘घृणा की आत्मा’ को क्रिया का कर्ता रखा गया
  alternative: ‘मेरे मन में उसे मारने की इच्छा हुई’
  rationale: वैकल्पिक रूप मूल की व्यक्तिकृत बाहरी/आध्यात्मिक प्रेरक शक्ति को हटाकर कथन को केवल आन्तरिक इच्छा बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘शान्ति’, ‘अन्धकारमय’ और ‘घृणा की आत्मा’ पाठ की प्राचीन नैतिक-आध्यात्मिक गंभीरता बनाए रखते हैं; अपूर्णकालीन क्रियाओं को ‘करता था/कर देती/करती थी’ से व्यक्त किया गया है।
