source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ ἀρνεῖται²⁸, μὴ φιλονείκει αὐτῷ, μήποτε²⁹ ὁμόσαντος αὐτοῦ δισσῶς ἁμαρτάνεις³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/004.yaml
  text: But if he denies it, do not contend with him, lest, when he swears, you sin doubly.
translation:
  language: hi
  text: परन्तु यदि वह इनकार करे, तो उससे विवाद मत करो, कहीं ऐसा न हो कि उसके शपथ लेने पर तुम दोहरा पाप करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνεῖται
  choice: इनकार करे
  rationale: यह यूनानी क्रिया किसी बात को नकारने या मानने से इनकार करने का सामान्य अर्थ देती है; संदर्भ स्पष्ट किए बिना उसी व्यापकता को रखा गया है।
- source_word: μὴ φιλονείκει αὐτῷ
  choice: उससे झगड़ा मत करो
  rationale: φιλονικέω विवाद या झगड़े पर अड़े रहने का भाव देता है। साधारण आधुनिक हिन्दी में ‘झगड़ा मत करो’ स्वाभाविक और स्पष्ट है।
- source_word: ὁμόσαντος αὐτοῦ
  choice: उसके शपथ खाने पर
  rationale: यह संबंधवाचक एओरिस्ट कृदंत है और उसके शपथ खाने की परिस्थिति बताता है; यूनानी में शपथ की विषयवस्तु नहीं दी गई, इसलिए उसे नहीं जोड़ा गया।
- source_word: δισσῶς ἁμαρτάνεις
  choice: तुम दुगुना पाप करो
  rationale: δισσῶς का सीधा अर्थ ‘दुगुने रूप में/दोहरा’ है। ‘दुगुना पाप करो’ मूल की संक्षिप्तता और नैतिक बल को बनाए रखता है।
theological_decisions:
- issue: ‘दुगुना पाप’ का आशय
  choice: वाक्य को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: दो अलग-अलग पापों की पहचान करके अनुवाद करना
  rationale: पद स्वयं यह स्पष्ट नहीं करता कि दोनों पाप कौन-से हैं; उनका नाम देना मूल की वास्तविक अस्पष्टता को अनुचित रूप से सुलझा देता।
- issue: शपथ की सत्यता या असत्यता
  choice: केवल ‘उसके शपथ खाने पर’
  alternative: ‘उसके झूठी शपथ खाने पर’
  rationale: मूल यूनानी केवल शपथ खाने की क्रिया कहता है और उसे झूठी नहीं बताता; अतः नैतिक अर्थ को अतिरिक्त रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक लहजा रखा गया है। निषेध के लिए ‘मत करो’ सामान्य पाठक के लिए स्वाभाविक है; मूल की शर्त, चेतावनी और अस्पष्टता सुरक्षित रखी गई है।
