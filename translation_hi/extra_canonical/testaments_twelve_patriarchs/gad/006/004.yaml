review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional denial, the prohibition against contentious dispute, the unspecified act of swearing, and the ambiguous statement that the addressee sins doubly. The genitive absolute ὁμόσαντος αὐτοῦ is suitably represented as a circumstance ('when/on his swearing'), without adding that the oath is false or specifying its content.
  naturalness: ‘उसके शपथ खाने पर’ is understandable but less natural in modern standard Hindi than ‘उसके शपथ लेने पर.’ ‘विवाद मत करो’ also more closely and naturally conveys φιλονικέω here than the somewhat stronger, colloquial ‘झगड़ा मत करो.’
  terminology: ‘इनकार करे,’ ‘शपथ लेने,’ and ‘दोहरा पाप’ are clear, dignified modern-Hindi choices. ‘दोहरा पाप’ retains the adverbial force of δισσῶς without explaining what the twofold sin consists of.
