source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
translation:
  language: hi
  text: पर यदि वह इनकार करे और डाँटे जाने पर लज्जित हो, तो चुप रहो; उसे मत डाँटो। क्योंकि इनकार करने वाला तुम्हारे विरुद्ध पाप करने पर पछताता है, और भयभीत होकर वह मेल कर लेता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνήσηται / ἀρνούμενος
  choice: इनकार करे / इनकार करने वाला
  rationale: यह यूनानी क्रिया किसी आरोप या किए गए काम को नकारने का भाव देती है; आधुनिक हिन्दी में ‘इनकार करना’ स्वाभाविक और सटीक है।
- source_word: αἰδεσθῇ
  choice: लज्जित हो
  rationale: क्रिया में लज्जा या संकोच अनुभव करने का भाव है; प्रसंग में ‘लज्जित हो’ स्पष्ट है।
- source_word: ἐλεγχόμενος / ἐλέγξῃς
  choice: समझाए जाने पर / समझाओ
  rationale: ἐλέγχω दोष दिखाने, टोकने या सुधारने के लिए समझाने को व्यक्त कर सकता है। हिन्दी में एक ही शब्द-मूल रखकर पुनरावृत्ति बची रहती है, जबकि ‘दोषी ठहराना’ यहाँ अत्यधिक न्यायिक लगता।
- source_word: ἡσύχασον
  choice: चुप रहो
  rationale: आज्ञार्थक क्रिया यहाँ बोलना या उलाहना देना रोक देने का निर्देश है; ‘चुप रहो’ सहज आधुनिक हिन्दी है।
- source_word: πλημμελῆσαι εἰς σέ
  choice: तुम्हारे विरुद्ध पाप करने पर
  rationale: πλημμελέω गलती या अपराध करने का भाव रखता है और नैतिक प्रसंग में ‘पाप करना’ उचित है; εἰς σέ को ‘तुम्हारे विरुद्ध’ से व्यक्त किया गया है।
- source_word: εἰρηνεύει
  choice: मेल कर लेता है
  rationale: यह क्रिया शांति स्थापित करने या मेल में आने का संकेत देती है; संबंधपरक प्रसंग में ‘मेल कर लेना’ स्वाभाविक है।
theological_decisions:
- issue: इनकार और पश्चाताप के बीच का तनाव
  choice: 'दोनों कथनों को बिना सामंजस्य बैठाए यथावत रखा गया: वह इनकार करता है, फिर भी पछताता है।'
  alternative: इनकार को पश्चाताप का प्रत्यक्ष प्रमाण या केवल बाहरी प्रतिक्रिया बताना।
  rationale: स्रोत-पाठ स्वयं इस मनोवैज्ञानिक और नैतिक तनाव को रखता है; अनुवाद को कोई अतिरिक्त व्याख्या नहीं जोड़नी चाहिए।
- issue: भय का आशय
  choice: ‘भयभीत होकर’ रखा गया, भय का कारण या स्वरूप निर्दिष्ट नहीं किया गया।
  alternative: ‘परमेश्वर से डरकर’, ‘दंड से डरकर’ या ‘लज्जा के कारण’।
  rationale: φοβηθείς में भय का कारण अस्पष्ट है; किसी खास धर्मवैचारिक आशय को जोड़ना स्रोत से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की तर्कगत असहजता—इनकार करने वाले का पछताना—जानबूझकर सुरक्षित रखी गई है। उपलब्ध यूनानी पाठ में अंग्रेज़ी परामर्श-पाठ का ‘ताकि वह फिर तुम्हारे साथ बुरा न करे’ खंड प्रत्यक्ष रूप से नहीं दिखता; इसलिए इसे पाठ की प्रवाहमान परंपरा के आधार पर रखा गया है, पर कोई अतिरिक्त व्याख्यात्मक विस्तार नहीं जोड़ा गया।
