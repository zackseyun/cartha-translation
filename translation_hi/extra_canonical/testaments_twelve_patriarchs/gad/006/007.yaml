id: T12P.GAD.6.7
reference: Testament of Gad 6:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/007.yaml
  text: But even if he is shameless and persists in evil, even so forgive him from the heart, and give vengeance to God.
translation:
  language: hi
  text: पर यदि वह निर्लज्ज हो और बुराई पर अड़ा रहे, तो भी उसे हृदय से क्षमा कर दो और प्रतिशोध परमेश्वर को सौंप दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδής
  choice: निर्लज्ज
  rationale: यह शब्द लज्जा या संकोच से रहित होने का भाव सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐνίσταται τῇ κακίᾳ
  choice: बुराई पर अड़ा रहे
  rationale: ἐνίσταται के विरोधपूर्वक डटे या अड़े रहने के भाव और τῇ κακίᾳ के व्यापक अर्थ ‘बुराई’—दोनों को सुरक्षित रखता है।
- source_word: ἄφες αὐτῷ ἀπὸ καρδίας
  choice: उसे हृदय से क्षमा कर दो
  rationale: क्षमा के आदेश और उसके अंतःकरण से होने पर समान बल देता है।
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  choice: प्रतिशोध परमेश्वर को सौंप दो
  rationale: शाब्दिक ‘प्रतिशोध परमेश्वर को दे दो’ की अपेक्षा हिंदी में स्वाभाविक है, साथ ही प्रतिशोध का अधिकार परमेश्वर के हाथ में देने का मूल भाव बनाए रखता है।
theological_decisions:
- issue: मानवीय क्षमा और दैवी प्रतिशोध के बीच तनाव
  choice: क्षमा करने और प्रतिशोध परमेश्वर को सौंपने—दोनों आदेशों को स्पष्ट रखा गया है।
  alternative: ‘बदला मत लो’ कहकर वाक्य को व्याख्यात्मक रूप देना।
  rationale: यूनानी पाठ दैवी प्रतिशोध की धारणा को हटाता नहीं, बल्कि मनुष्य को हृदय से क्षमा करने और प्रतिशोध परमेश्वर के हाथ में देने को कहता है; इस तनाव को अनिर्णीत रखना स्रोत के प्रति अधिक निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। ‘तो भी’ καὶ οὕτως के रियायती बल को व्यक्त करता है।
