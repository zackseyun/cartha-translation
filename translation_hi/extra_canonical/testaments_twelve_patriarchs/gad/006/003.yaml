base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/003.yaml
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
translation:
  language: hi
  text: एक-दूसरे से दिल से प्रेम करो। यदि कोई तुम्हारे विरुद्ध पाप करे, तो उससे शान्ति की बात कहो और अपने मन में कोई छल न रखो। यदि वह पश्चाताप करके अपना पाप स्वीकार करे, तो उसे क्षमा कर दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ यूनानी साक्षियों में: “उससे शान्तिपूर्वक बात करो और घृणा का विष निकाल दो; अपने मन में कोई छल न रखो। यदि वह अपना पाप मानकर पश्चाताप करे, तो उसे क्षमा कर दो।”'
    reason: β, A और S¹ पाठ-परम्परा में ‘शान्तिपूर्वक’ तथा ‘घृणा का विष निकाल दो’ का अतिरिक्त वाक्यांश है और स्वीकार तथा पश्चाताप का क्रम मुख्य α-पाठ से भिन्न है।
lexical_decisions:
- source_word: ἀπὸ καρδίας
  choice: दिल से
  rationale: यह यूनानी पद निष्कपट और आन्तरिक प्रेम को व्यक्त करता है; ‘दिल से’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἁμαρτήσει εἰς σέ
  choice: तुम्हारे विरुद्ध पाप करे
  rationale: εἰς σέ अपराध की दिशा या पीड़ित व्यक्ति को बताता है; यह अनुवाद उस सम्बन्धपरक अर्थ को बनाए रखता है।
- source_word: εἰπὲ αὐτῷ εἰρήνην
  choice: उससे शान्ति की बात कहो
  rationale: मुख्य α-पाठ के असामान्य किंतु अर्थपूर्ण शब्द-विन्यास को सहज हिन्दी में रखते हुए मेल-मिलाप की वाणी का भाव सुरक्षित किया गया है।
- source_word: ἐν τῇ ψυχῇ σου μὴ κρατήσῃς δόλον
  choice: अपने मन में कोई छल न रखो
  rationale: ψυχή यहाँ व्यक्ति के भीतरी मन को सूचित करता है और δόλος छिपे कपट या छल को; वर्तमान हिन्दी में यह संयोजन स्पष्ट है।
- source_word: ὁμολογήσῃ
  choice: अपना पाप मानकर
  rationale: सन्दर्भ में क्रिया अपराध को स्वीकार करने की ओर संकेत करती है; कर्म को स्पष्ट करने से हिन्दी में अर्थ पूरा और स्वाभाविक बनता है।
- source_word: μετανοήσας
  choice: पश्चाताप करे
  rationale: यह मन और आचरण के परिवर्तन सहित पश्चाताप को दर्शाने वाला मानक और धार्मिक रूप से तटस्थ हिन्दी शब्द है।
- source_word: ἄφες αὐτῷ
  choice: उसे क्षमा कर दो
  rationale: सन्दर्भ में ἀφίημι अपराध को छोड़ देने अर्थात क्षमा करने का अर्थ देता है।
theological_decisions:
- issue: क्षमा से पहले स्वीकार और पश्चाताप का सम्बन्ध
  choice: यदि वह अपना पाप मानकर पश्चाताप करे, तो उसे क्षमा कर दो
  alternative: यदि वह पश्चाताप करके अपना पाप माने, तो उसे क्षमा कर दो
  rationale: मुख्य α-पाठ में पश्चाताप के बाद स्वीकार करने का क्रम है, जबकि β-पाठ में स्वीकार करने के बाद पश्चाताप का क्रम है। वाक्य को स्वाभाविक हिन्दी में प्रस्तुत करते हुए दोनों क्रियाओं की शर्त को बनाए रखा गया और पाठांतर को पादटिप्पणी में बताया गया।
- issue: शान्ति कहने की प्रकृति
  choice: उससे शान्ति की बात कहो
  alternative: उससे शान्तिपूर्वक बात करो
  rationale: मुख्य α-पाठ εἰρήνην को कर्म के रूप में रखता है (‘शान्ति कहो’), जबकि β-पाठ ἐν εἰρήνῃ पढ़ता है (‘शान्ति से/शान्तिपूर्वक’)। मुख्य पाठ को आधार बनाया गया और वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक स्वर अपनाया गया है। ‘दिल से’ और ‘मन में’ सामान्य पाठक के लिए स्वाभाविक हैं; ‘पाप’, ‘पश्चाताप’ और ‘क्षमा’ मूल के नैतिक-धार्मिक अर्थ को बिना किसी सम्प्रदायगत विस्तार के व्यक्त करते हैं।
