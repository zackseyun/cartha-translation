id: T12P.GAD.6.5
reference: Testament of Gad 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. [Μὴ³¹ ἀκούσῃ³² ἐν μάχῃ ἀλλότριος³³ τὸ³⁴ μυστήριόν σου³⁵, *ἵνα μὴ³⁶ μισήσας³⁷ *ἐχθράνῃ σε³⁸, καὶ μεγάλην ἁμαρτίαν ἐργάσηται³⁹ [ἐν σοί]⁴⁰. ὅτι πολλάκις *δολοφωνεῖ σε⁴¹ ἢ περιεργάζεται σε⁴² ἐν κακοῖς⁴³] *λαβὼν ἀπό σου⁴⁴ τὸν ἰόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/005.yaml
  text: Do not let another hear your secret in a quarrel, lest, having come to hate you, he become your enemy and commit a great sin against you; for many times he either murders you by treachery or entangles you in evils, having received the poison from you.
translation:
  language: hi
  text: झगड़े के समय किसी दूसरे व्यक्ति को अपना भेद न सुनने दो, कहीं ऐसा न हो कि वह तुमसे घृणा करके तुम्हारा शत्रु बन जाए और तुम्हारे विरुद्ध[a] बड़ा पाप करे। क्योंकि तुमसे विष पाकर वह अक्सर या तो छल से तुम्हारी हत्या कर देता है या तुम्हें बुराइयों में उलझा देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “तुममें”; ये शब्द पाठ की दृष्टि से अनिश्चित हैं।
    reason: '[ἐν σοί] को संपादित यूनानी पाठ में अनिश्चित रूप से चिह्नित किया गया है और इसका शाब्दिक रूप हिन्दी में अस्पष्ट हो सकता है।'
lexical_decisions:
- source_word: ἐν μάχῃ
  choice: झगड़े के समय
  rationale: यहाँ μάχη का आशय युद्ध से अधिक पारस्परिक झगड़े या कलह से है।
- source_word: ἀλλότριος
  choice: किसी दूसरे व्यक्ति
  rationale: संदर्भ में इसका अर्थ अपने से अलग कोई अन्य व्यक्ति है; ‘परदेशी’ या ‘अजनबी’ अनावश्यक रूप से संकीर्ण होगा।
- source_word: τὸ μυστήριόν σου
  choice: अपना भेद
  rationale: μυστήριον यहाँ किसी निजी या छिपी हुई बात को दर्शाता है; ‘भेद’ स्वाभाविक और अर्थ-सटीक है।
- source_word: δολοφωνεῖ σε
  choice: छल से तुम्हारी हत्या कर देता है
  rationale: क्रिया में कपटपूर्वक या विश्वासघात से मार डालने का प्रबल भाव है।
- source_word: περιεργάζεται σε ἐν κακοῖς
  choice: तुम्हें बुराइयों में उलझा देता है
  rationale: वाक्यांश किसी को हानिकारक या बुरी परिस्थितियों में फँसाने अथवा उलझाने का भाव देता है।
- source_word: τὸν ἰόν
  choice: विष
  rationale: 'मूल का सजीव रूपक बनाए रखा गया है: झगड़े में खोला गया भेद दूसरे व्यक्ति को हानि पहुँचाने का ‘विष’ देता है।'
theological_decisions:
- issue: ἐχθράνῃ σε का संबंधपरक अर्थ
  choice: तुम्हारा शत्रु बन जाए
  alternative: तुमसे शत्रुता करने लगे
  rationale: दोनों अर्थ संभव हैं; चुना हुआ रूप प्रसंग में स्वाभाविक है और घृणा से शत्रुता की ओर बढ़ने की चेतावनी को बनाए रखता है।
- issue: '[ἐν σοί] की पाठगत अनिश्चितता'
  choice: तुम्हारे विरुद्ध[a]
  alternative: तुममें
  rationale: संदर्भ में पाप का लक्ष्य व्यक्ति है, इसलिए ‘तुम्हारे विरुद्ध’ अर्थ स्पष्ट करता है; पादटिप्पणी मूल के शाब्दिक रूप और पाठगत अनिश्चितता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में चेतावनी और नीतिपरक गंभीरता बनाए रखी गई है। वाक्य सहज है, पर ‘भेद’, ‘छल से हत्या’ और ‘विष’ जैसे मूल के तीखे रूपकों को नरम नहीं किया गया।
