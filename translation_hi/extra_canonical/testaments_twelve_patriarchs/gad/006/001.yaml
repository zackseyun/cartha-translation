source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VI. *Καὶ νῦν¹, τέκνα μου, Γπαραινῶ ὑμῖν⌉². ἀγαπᾶτε³ ἕκαστος *τὸν πλησίον⁴ αὑτοῦ⁵, καὶ ἐξάρατε τὸ μῖσος ἀπὸ τῶν καρδιῶν ὑμῶν· ἀγαπήσατε⁶ ἀλλήλους⁷ ἐν ἔργῳ καὶ λόγῳ καὶ διανοίᾳ ψυχῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/001.yaml
  text: 'And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and in thought of soul.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चों, मैं तुमसे आग्रह करता हूँ: तुम में से हर एक अपने पड़ोसी से प्रेम करे, और तुम अपने हृदयों से घृणा दूर कर दो। कर्म, वचन और आत्मा की सोच में एक-दूसरे से प्रेम करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραινῶ
  choice: मैं तुम्हें समझाता हूँ
  rationale: यह क्रिया आग्रहपूर्ण सलाह और नैतिक उपदेश का भाव रखती है; ‘समझाता हूँ’ आधुनिक, सहज और गरिमापूर्ण हिन्दी में उस भाव को व्यक्त करता है।
- source_word: τὸν πλησίον
  choice: अपने पड़ोसी
  rationale: ‘पड़ोसी’ πλησίον का पारंपरिक और व्यापक अर्थ वाला हिन्दी समतुल्य है—वह निकटवर्ती व्यक्ति अथवा सह-मनुष्य दोनों का संकेत दे सकता है।
- source_word: ἐξάρατε τὸ μῖσος
  choice: घृणा निकाल दे
  rationale: ἐξαίρω के हटाने या बाहर निकाल देने के सशक्त भाव को बनाए रखा गया है।
- source_word: ἐν ἔργῳ καὶ λόγῳ
  choice: काम, वचन ... में
  rationale: ἔργον और λόγος के ठोस समानांतर को क्रमशः ‘काम’ और गरिमापूर्ण ‘वचन’ द्वारा सुरक्षित रखा गया है।
- source_word: διανοίᾳ ψυχῆς
  choice: मन के विचार में
  rationale: διανοίᾳ के विचार/मानसिक अभिप्राय और ψυχῆς के आंतरिक मन-जीवन संबंध को यथासंभव संक्षिप्त रूप में रखा गया है, बिना इसे केवल ‘इरादा’ बनाकर सीमित किए।
theological_decisions:
- issue: διανοίᾳ ψυχῆς में आंतरिक प्रेम का स्वरूप
  choice: मन के विचार में
  alternative: मन की भावना से / पूरे मन से
  rationale: मूल पदबंध कुछ असामान्य और अर्थ की दृष्टि से खुला है। चुना हुआ अनुवाद ‘विचार’ को स्पष्ट रखता है और इसे भावनात्मकता या संपूर्ण समर्पण की व्याख्या में नहीं बदलता।
- issue: πλησίον का दायरा
  choice: पड़ोसी
  alternative: निकटवर्ती जन / सह-मनुष्य
  rationale: मूल शब्द के नैतिक और संबंधपरक विस्तार को निर्धारित किए बिना पारंपरिक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधे संबोधन और नैतिक उपदेश की गरिमा रखी गई है। बहुवचन ‘बच्चो’ तथा ‘तुम्हें/अपने हृदयों’ मूल के आत्मीय पारिवारिक स्वर के अनुरूप हैं। अंतिम पदबंध की ग्रीक संरचना को पूरी तरह असहज बनाए बिना उसकी वास्तविक अर्थगत कठिनाई सुरक्षित रखी गई है।
