  text: He does not speak against a holy man, because the fear of God dwells in him.
translation:
  language: hi
  text: वह किसी पवित्र मनुष्य की निन्दा नहीं करता, क्योंकि उसमें परमेश्वर का भय वास करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλεῖ
  choice: निन्दा करता
  rationale: इस क्रिया का अर्थ किसी के विरुद्ध बुरा या अपमानजनक बोलना है; ‘निन्दा करना’ इसे स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: ἀνδρὸς ὁσίου
  choice: किसी पवित्र मनुष्य की
  rationale: ἀνήρ यहाँ सामान्यतः पुरुष/मनुष्य को और ὅσιος परमेश्वर के प्रति पवित्र या भक्त आचरण को सूचित करता है; हिन्दी में ‘पवित्र मनुष्य’ मूल के निकट है।
- source_word: ὁ φόβος τοῦ Θεοῦ
  choice: परमेश्वर का भय
  rationale: यह पारंपरिक और स्रोत-संगत धार्मिक पद है, जिसमें परमेश्वर के प्रति श्रद्धामय भय का भाव बना रहता है।
- source_word: οἰκεῖ ἐν αὐτῷ
  choice: उसमें ... वास करता है
  rationale: οἰκέω के ‘निवास करना/बसना’ रूपक को ‘वास करना’ गरिमापूर्ण और स्पष्ट हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसमें’ का संदर्भ
  choice: सर्वनाम की मूल अस्पष्टता बनाए रखी गई
  alternative: स्पष्ट करना कि परमेश्वर का भय उस व्यक्ति में वास करता है जो निन्दा नहीं करता
  rationale: ग्रीक αὐτῷ व्याकरणतः निकटवर्ती ‘पवित्र मनुष्य’ अथवा कर्ता की ओर समझा जा सकता है; अनुवाद में इसे चुपचाप निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी की संक्षिप्त संरचना के निकट।
