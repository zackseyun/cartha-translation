base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/009.yaml
  text: For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने मुझे जिगर की बीमारी से पीड़ित किया; और यदि मेरे पिता की प्रार्थनाओं ने मेरी सहायता न की होती, तो मेरा प्राण लगभग निकल ही गया होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπήγαγε ... μοι ὁ Θεὸς νόσον ἥπατος
  choice: परमेश्वर ने मुझे जिगर की बीमारी से पीड़ित किया
  rationale: यह यूनानी वाक्य में परमेश्वर को रोग लाने वाले कर्ता के रूप में बनाए रखता है, पर आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है। ‘जिगर’ सामान्य आधुनिक शब्द है।
- source_word: αἱ εὐχαὶ τοῦ πατρός μου
  choice: मेरे पिता की प्रार्थनाओं
  rationale: बहुवचन εὐχαὶ को ‘प्रार्थनाओं’ और संबंधसूचक पद को सीधे ‘मेरे पिता की’ से व्यक्त किया गया है।
- source_word: ἐβοήθησάν μοι
  choice: मेरी सहायता न की होती
  rationale: स्रोत के प्रतिकल्पनात्मक निषेध को हिन्दी की स्वाभाविक शर्तीय रचना में सुरक्षित रखा गया है।
- source_word: ὀλίγου δεῖν ἐξέλειπε τὸ πνεῦμα μου
  choice: मेरा प्राण लगभग निकल ही गया होता
  rationale: मुहावरेदार यूनानी अभिव्यक्ति निकट-मृत्यु को दर्शाती है। ‘प्राण निकलना’ आधुनिक हिन्दी में स्वाभाविक है और πνεῦμα की जीवन-श्वास/जीवन के अर्थ को यहाँ उपयुक्त रूप से व्यक्त करता है।
theological_decisions:
- issue: रोग में परमेश्वर की कारक भूमिका
  choice: परमेश्वर ने मुझे ... पीड़ित किया
  alternative: परमेश्वर ने मुझ पर ... बीमारी आने दी
  rationale: स्रोत का सक्रिय क्रियापद Ἐπήγαγε परमेश्वर को प्रत्यक्ष कर्ता बनाता है; ‘आने दी’ कहना मूल में निहित तनाव को नरम कर देता।
- issue: पिता की प्रार्थनाओं की प्रभावशीलता
  choice: प्रार्थनाओं ने मेरी सहायता न की होती
  alternative: प्रार्थनाओं के कारण परमेश्वर ने मेरी सहायता न की होती
  rationale: मूल पाठ प्रार्थनाओं को व्याकरणिक कर्ता बनाता है। अनकहे मध्यस्थ कर्ता को जोड़कर किसी विशेष धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यकृत’ की अपेक्षा ‘जिगर’ अधिक सहज है; ‘प्राण निकलना’ निकट-मृत्यु के भाव को स्वाभाविक रूप से संप्रेषित करता है।
