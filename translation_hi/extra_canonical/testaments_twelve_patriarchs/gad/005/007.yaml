source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/007.yaml
  text: For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
translation:
  language: hi
  text: 7 क्योंकि परमेश्वर के अनुसार सच्चा पश्चात्ताप [अज्ञान को मिटाता है और][a] अंधकार को भगा देता है, आँखों को ज्योति देता है, आत्मा को ज्ञान प्रदान करता है और मन को उद्धार की ओर ले जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अज्ञान को मिटाता है और”—ये शब्द यूनानी पाठ में पाठगत रूप से अनिश्चित हैं।
    reason: स्रोत-संपादित यूनानी पाठ में ये शब्द कोष्ठकों में हैं; मुख्य पाठ में कोष्ठक और पादटिप्पणी दोनों रखकर इस अनिश्चितता को सुरक्षित किया गया है।
lexical_decisions:
- source_word: Ἡ κατὰ Θεὸν ἀληθὴς μετάνοια
  choice: परमेश्वर के अनुसार होने वाला सच्चा पश्चात्ताप
  rationale: κατὰ Θεόν के संबंधपरक अर्थ को बनाए रखा गया है; ‘परमेश्वर की इच्छा के अनुरूप’ अधिक सहज होता, पर ‘इच्छा’ मूल में स्पष्ट नहीं है। μετάνοια के लिए सामान्य और गरिमापूर्ण ‘पश्चात्ताप’ उपयुक्त है।
- source_word: ἀναιρεῖ τὴν ἄγνοιαν
  choice: अज्ञान को मिटाता है
  rationale: ἀναιρέω यहाँ अज्ञान को दूर या समाप्त करने का अर्थ देता है; ‘मिटाता है’ आधुनिक हिन्दी में स्वाभाविक है और कथन की शक्ति बनाए रखता है।
- source_word: φυγαδεύει τὸ σκότος
  choice: अंधकार को भगा देता है
  rationale: φυγαδεύω का चित्रात्मक अर्थ ‘भगा देना’ है; इसे केवल ‘दूर करना’ कहने की अपेक्षा मूल बिंब सुरक्षित रहता है।
- source_word: φωτίζει τοὺς ὀφθαλμοὺς
  choice: आँखों को ज्योति देता है
  rationale: शाब्दिक बिंब और आध्यात्मिक संकेत दोनों सुरक्षित हैं; ‘आँखें खोलता है’ अर्थ को अधिक व्याख्यात्मक बना देता।
- source_word: γνῶσιν παρέχει τῇ ψυχῇ
  choice: आत्मा को ज्ञान प्रदान करता है
  rationale: ψυχή को यहाँ ‘आत्मा’ और παρέχει को गरिमापूर्ण, सहज ‘प्रदान करता है’ से व्यक्त किया गया है।
- source_word: ὁδηγεῖ τὸ διαβούλιον πρὸς σωτηρίαν
  choice: मन को उद्धार की ओर ले जाता है
  rationale: διαβούλιον विचार-विमर्श करने वाली मानसिक शक्ति, विचार या मन को सूचित कर सकता है। ‘मन’ संक्षिप्त, स्वाभाविक और पर्याप्त रूप से व्यापक है; πρὸς की दिशात्मकता ‘की ओर’ में बनी रहती है।
theological_decisions:
- issue: κατὰ Θεόν में पश्चात्ताप और परमेश्वर का संबंध
  choice: परमेश्वर के अनुसार होने वाला
  alternative: परमेश्वर की इच्छा के अनुरूप / परमेश्वर-प्रेरित
  rationale: मूल वाक्यांश यह स्पष्ट नहीं करता कि पश्चात्ताप का मानदंड परमेश्वर की इच्छा है, उसका स्रोत परमेश्वर है, या वह परमेश्वर की दृष्टि में उचित है। अनुवाद इस तनाव को किसी एक व्याख्या में सीमित नहीं करता।
- issue: σωτηρία का आशय
  choice: उद्धार
  alternative: मुक्ति / कल्याण
  rationale: ‘उद्धार’ σωτηρία का स्थापित और व्यापक हिन्दी समतुल्य है। पद यह निर्धारित नहीं करता कि यहाँ विशेष रूप से आध्यात्मिक, नैतिक या अंतिम उद्धार अभिप्रेत है, इसलिए कोई अतिरिक्त विशेषण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। समानांतर क्रियाओं की लय—मिटाता है, भगा देता है, ज्योति देता है, ज्ञान प्रदान करता है, ले जाता है—मूल यूनानी की क्रमिक संरचना को प्रतिबिंबित करती है।
