base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/008.yaml
  text: And he did not learn this from men, but through repentance he knows how to receive those who turn back.
translation:
  language: hi
  text: 8. और उसने यह मनुष्यों से नहीं सीखा, परन्तु वह पश्चाताप के द्वारा लौटने वालों को स्वीकार करना जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ ἀνθρώπων
  choice: मनुष्यों से
  rationale: स्रोत या शिक्षा के उद्गम को व्यक्त करने वाले यूनानी पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: μετανοίας
  choice: पश्चाताप करके
  rationale: μετάνοια यहाँ मन-परिवर्तन और उससे जुड़ी वापसी को दर्शाता है; क्रियाविशेषणीय रूप आधुनिक हिन्दी में संबंध स्पष्ट करता है।
- source_word: τοὺς ἐπιστρέφοντας
  choice: लौटने वालों
  rationale: ἐπιστρέφω की दिशा बदलकर वापस आने की धारणा को बनाए रखता है, बिना पाठ में किसी अनुल्लिखित लक्ष्य को जोड़े।
- source_word: δέχεσθαι
  choice: स्वीकार करना
  rationale: स्वागतपूर्वक ग्रहण करने के अर्थ को गरिमापूर्ण और सामान्य हिन्दी में व्यक्त करता है।
- source_word: οἶδε … δέχεσθαι
  choice: जानता है कि … कैसे स्वीकार करना है
  rationale: ज्ञानसूचक क्रिया के साथ infinitive की क्षमता/रीति वाली स्वाभाविक हिन्दी अभिव्यक्ति।
theological_decisions:
- issue: διὰ μετανοίας का वाक्यगत संबंध
  choice: इसे ‘लौटने वालों’ से जोड़कर ‘पश्चाताप करके लौटने वालों’ के रूप में मुख्य पाठ में रखा गया।
  alternative: 'इसे ‘जानता है’ अथवा ‘स्वीकार करना’ से जोड़कर अर्थ निकाला जा सकता है: ‘परन्तु पश्चाताप के द्वारा वह लौटने वालों को स्वीकार करना जानता है।’'
  rationale: यूनानी पदक्रम दोनों संबंधों की कुछ गुंजाइश देता है। मुख्य पाठ अर्थ की अधिक स्वाभाविक संगति अपनाता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘उसने/वह’ में मूल यूनानी के पुल्लिंग एकवचन कर्ता को बनाए रखा गया है और संदर्भ से बाहर उसकी पहचान नहीं जोड़ी गई।
