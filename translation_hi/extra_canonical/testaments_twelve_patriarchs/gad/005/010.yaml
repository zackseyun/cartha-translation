  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/010.yaml
  text: For by the very things through which a man transgresses, through those he is punished.
translation:
  language: hi
  text: क्योंकि मनुष्य जिन बातों के द्वारा व्यवस्था का उल्लंघन करता है, उन्हीं के द्वारा वह दण्ड पाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομεῖ
  choice: व्यवस्था का उल्लंघन करता है
  rationale: क्रिया का अर्थ केवल सामान्य अपराध करना नहीं, बल्कि मान्य व्यवस्था या नियम के विरुद्ध चलना है; यह पदबंध उस अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κολάζεται
  choice: दण्ड पाता है
  rationale: मध्य/कर्मवाच्य रूप के प्रतिफलात्मक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: δι’ ὧν … δι’ ἐκείνων
  choice: जिन बातों के द्वारा … उन्हीं के द्वारा
  rationale: यूनानी वाक्य की साधनात्मक समानता और न्यायसंगत प्रत्युत्तर की संरचना को सुरक्षित रखता है।
theological_decisions:
- issue: अपराध और दण्ड के साधनों के बीच प्रतिफलात्मक संबंध
  choice: उन्हीं के द्वारा वह दण्ड पाता है
  alternative: उन्हीं बातों के कारण उसे दण्ड मिलता है
  rationale: यूनानी διά के दोहराव को दोनों स्थानों पर समान रूप से ‘के द्वारा’ कहना उस वास्तविक अस्पष्टता को बनाए रखता है कि वे बातें दण्ड का कारण हैं या उसका साधन।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मनुष्य’ लिंग-सामान्य ἄνθρωπος के लिए प्रयुक्त हुआ है; मूल के संक्षिप्त सूक्तिपरक रूप और दोहराव को सुरक्षित रखा गया है।
