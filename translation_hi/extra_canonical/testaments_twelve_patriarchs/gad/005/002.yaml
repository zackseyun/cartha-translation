  text: 2. *Ταῦτα οὖν¹⁹ ἐκ πείρας²⁰ λέγω ὑμῖν, τέκνα μου, ὅπως ἐξώσητε²¹ τὸ μῖσος *τὸ διαβολικόν²², καὶ κολληθῆτε τῇ ἀγάπῃ τοῦ²³ Θεοῦ²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/002.yaml
  text: Therefore I say these things to you from experience, my children, so that you may drive out devilish hatred and cling to the love of God.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, मैं अपने अनुभव से तुमसे ये बातें कहता हूँ, ताकि तुम शैतानी घृणा को निकाल फेंको और परमेश्वर के प्रेम से जुड़े रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πείρας
  choice: अपने अनुभव से
  rationale: यह वाक्यांश प्रत्यक्ष अनुभव से प्राप्त ज्ञान के आधार पर बोलने का भाव व्यक्त करता है।
- source_word: ἐξώσητε
  choice: अपने भीतर से निकाल दो
  rationale: क्रिया का मूल अर्थ बाहर खदेड़ना या निकाल देना है; ‘अपने भीतर से’ हिन्दी में निहित नैतिक आशय को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: τὸ μῖσος τὸ διαβολικόν
  choice: शैतानी बैर
  rationale: μῖσος के लिए ‘बैर’ प्रसंगानुकूल और सहज है, जबकि διαβολικόν की विशेषणात्मक शक्ति ‘शैतानी’ से बनी रहती है।
- source_word: κολληθῆτε
  choice: जुड़े रहो
  rationale: यह दृढ़ता से लग जाने और संबंध बनाए रखने का भाव देता है; आधुनिक हिन्दी में ‘जुड़े रहो’ स्वाभाविक और स्पष्ट है।
- source_word: τῇ ἀγάπῃ τοῦ Θεοῦ
  choice: परमेश्वर के प्रेम से
  rationale: सम्बन्धकारक की वास्तविक अस्पष्टता—परमेश्वर का प्रेम अथवा परमेश्वर के प्रति प्रेम—हिन्दी पदबंध में सुरक्षित रहती है।
theological_decisions:
- issue: ‘परमेश्वर के प्रेम’ में सम्बन्धकारक का अर्थ
  choice: परमेश्वर के प्रेम से
  alternative: परमेश्वर के प्रति प्रेम से
  rationale: यूनानी τοῦ Θεοῦ वस्तुनिष्ठ या व्यक्तिनिष्ठ दोनों अर्थ दे सकता है; हिन्दी का चुना हुआ पदबंध इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- issue: διαβολικόν का संदर्भ
  choice: शैतानी
  alternative: निंदक/दोष लगाने वाला
  rationale: यहाँ विशेषण नैतिक-आध्यात्मिक गुण बताता है और अंग्रेज़ी परामर्श-पाठ भी ‘devilish’ का समर्थन करता है; ‘शैतानी’ किसी विशिष्ट सांप्रदायिक व्याख्या के बिना उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय, उपदेशात्मक और गरिमापूर्ण शैली रखी गई है। ‘मेरे बच्चो’ सम्बोधन को स्वाभाविक हिन्दी विरामचिह्नों के साथ रखा गया है; कोई पादटिप्पणी आवश्यक नहीं।
