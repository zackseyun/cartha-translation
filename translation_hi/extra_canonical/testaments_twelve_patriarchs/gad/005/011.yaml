source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 11. Ἐπεὶ Γοὖν⌉ ἔκειτο⁶⁵ τὰ ἥπατα μου ἀνιλεως⁶⁶ κατὰ τοῦ Ἰωσήφ, *τῷ ἥπατι⁶⁷ πάσχων⁶⁸ ἀνιλεως ἐκρινόμην ἐπὶ *χρόνους δέκα⁶⁹, καθ’ *ὃν χρόνον⁷⁰ ἐπείχον⁷¹ τῷ Ἰωσήφ⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/011.yaml
  text: Since, then, my liver was pitilessly set against Joseph, I too, suffering in my liver, was judged pitilessly for ten years.
translation:
  language: hi
  text: 11 इसलिए, जब मेरा कलेजा यूसुफ़ के विरुद्ध निर्दय था, तब मुझे भी कलेजे की पीड़ा सहते हुए दस वर्षों तक निर्दयतापूर्वक न्याय के अधीन किया गया—उसी अवधि तक, जिस दौरान मैं यूसुफ़ के विरुद्ध वैर रखता रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘यकृत’। प्राचीन प्रयोग में इसे भावनाओं का केंद्र भी माना जा सकता था; यहाँ यूसुफ़ के प्रति निर्दय वैर और उसी अंग की पीड़ा के बीच शब्द-संबंध है।
    reason: ‘कलेजा’ हिन्दी में भावनात्मक तथा शारीरिक, दोनों संकेतों को स्वाभाविक रूप से रखता है; पादटिप्पणी शाब्दिक अंग और प्राचीन भावार्थ स्पष्ट करती है।
lexical_decisions:
- source_word: τὰ ἥπατά μου / τῷ ἥπατι
  choice: मेरा कलेजा / कलेजे में
  rationale: ἧπαρ का शाब्दिक अर्थ ‘यकृत’ है, पर यहाँ वही अंग वैरपूर्ण भाव के केंद्र और शारीरिक पीड़ा के स्थान—दोनों रूपों में आता है। ‘कलेजा’ आधुनिक पाठक के लिए इस दोहरे प्रयोग को ‘यकृत’ से अधिक स्वाभाविक रूप में बनाए रखता है।
- source_word: ἀνιλέως
  choice: निर्दयता से / निर्दयतापूर्वक
  rationale: एक ही यूनानी क्रियाविशेषण का दोहराव व्यक्ति के यूसुफ़ के प्रति निर्दय भाव और उसे मिले कठोर न्याय-दंड के बीच जानबूझकर समानता बनाता है; हिन्दी में भी यह पुनरावृत्ति रखी गई है।
- source_word: ἐκρινόμην
  choice: न्याय-दंड भोगना पड़ा
  rationale: मध्य/कर्मवाच्य रूप का भाव ‘मेरा न्याय हुआ’ है। हिन्दी में स्वाभाविकता के लिए इसे न्याय के फलस्वरूप दंड भोगने के रूप में व्यक्त किया गया है, पर न्याय करने वाले की पहचान नहीं जोड़ी गई।
- source_word: χρόνους δέκα
  choice: दस वर्षों तक
  rationale: χρόνος मूलतः ‘समय/अवधि’ है; प्रसंग और प्राचीन पाठ की समझ के अनुसार यहाँ दस वर्ष अभिप्रेत हैं, न कि दस महीने।
- source_word: ἐπείχον τῷ Ἰωσήφ
  choice: मैं यूसुफ़ के विरुद्ध वैर रखता रहा था
  rationale: यह कठिन वाक्यांश यूसुफ़ के विरुद्ध लगातार शत्रुतापूर्ण मनोभाव का संकेत देता है। ‘वैर रखना’ उस अवधि और विरोध—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय-दंड देने वाले की पहचान
  choice: कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘परमेश्वर ने मुझे दंड दिया’
  rationale: यूनानी में ἐκρινόμην कर्मवाच्य है और न्याय करने वाले का नाम नहीं दिया गया। दैवी न्याय का संकेत संभव है, पर उसे स्पष्ट कर्ता बनाना मूल की अस्पष्टता को समाप्त कर देता।
- issue: वैर की अवधि और दंड की अवधि का संबंध
  choice: दोनों को समान अवधि के रूप में व्यक्त किया
  alternative: अंतिम उपवाक्य को छोड़ देना
  rationale: καθ’ ὃν χρόνον… दंड की अवधि को यूसुफ़ के विरुद्ध रहे वैर की अवधि से जोड़ता है। स्रोत-पाठ में उपस्थित इस प्रतिफलात्मक समानता को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘कलेजा’ लोकबोध्य है, जबकि वाक्य की नैतिक-न्यायिक गंभीरता के लिए ‘न्याय-दंड’ और ‘वैर’ चुने गए हैं। मूल के दोहराव, कर्मवाच्य अस्पष्टता और अवधि-समानता को यथासंभव सुरक्षित रखा गया है।
