source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: V. ⸀Κακὸν οὖν¹ ἐστι² τὸ μῖσος³, ὅτι *ἐνδελεχεῖ συνεχῶς³ *τῷ ψεύδει, λαλῶν⁴ κατὰ τῆς⁵ ἀληθείας, καὶ τὰ μικρὰ μεγάλα ποιεῖ⁶, τὸ *φῶς σκότος⁷ παρέχει⁸, καὶ⁹ τὸ γλυκὺ πικρὸν λέγει¹⁰, ⸀καὶ⸀ συκοφαντίαν¹¹ ἐκδιδάσκει *καὶ ὀργὴν¹² ⸀ἐκταράσσει⸀¹³ καὶ πόλεμον ⸀διεγείρει⸀¹⁴, καὶ ὕβριν¹⁵ καὶ πᾶσαν πλεονεξίαν, κακῶν¹⁶ καὶ¹⁷ ἰοῦ διαβολικοῦ τὴν καρδίαν ἐκπληροῖ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/001.yaml
  text: Hatred, then, is evil, because it continually associates with falsehood, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.
translation:
  language: hi
  text: इसलिए घृणा बुरी है, क्योंकि वह निरन्तर झूठ का साथ देती है और सत्य के विरुद्ध बोलती है। वह छोटी बातों को बड़ा बना देती है, प्रकाश को अन्धकार के रूप में प्रस्तुत करती है और मीठे को कड़वा कहती है। वह निन्दा करना सिखाती है, क्रोध और युद्ध भड़काती है, और हृदय को उद्दण्डता, हर प्रकार के लोभ, बुराइयों और शैतानी विष से भर देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μῖσος
  choice: बैर
  rationale: यहाँ घृणा की केवल भावना नहीं, बल्कि सत्य-विरोधी और संघर्षकारी वैरभाव का चित्र है; ‘बैर’ इस सक्रिय संबंधपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: निरन्तर झूठ का साथ देता
  rationale: दोनों निरन्तरता-सूचक तत्वों और झूठ के साथ लगातार जुड़े रहने के भाव को सहज हिन्दी में रखा गया है।
- source_word: συκοφαντίαν
  choice: बदनामी करना
  rationale: शब्द झूठे दोषारोपण अथवा निन्दात्मक बदनामी का संकेत देता है; सामान्य पाठक के लिए ‘बदनामी करना’ स्पष्ट और स्वाभाविक है।
- source_word: ὕβριν
  choice: उद्दण्डता
  rationale: यह अपमानजनक अहंकार, धृष्टता और मर्यादा-भंग के अर्थ-क्षेत्र को संक्षेप में व्यक्त करता है।
- source_word: πλεονεξίαν
  choice: लोभ
  rationale: दूसरों से अधिक पाने अथवा हड़पने की अतृप्त इच्छा के लिए प्रचलित और संदर्भानुकूल हिन्दी शब्द।
- source_word: ἰοῦ διαβολικοῦ
  choice: शैतानी विष
  rationale: ἰός का ‘विष’ और διαβολικός का ‘शैतानी’ अर्थ सीधे बनाए रखा गया है, बिना उसे केवल रूपकात्मक दुष्टता में विलीन किए।
theological_decisions:
- issue: διαβολικοῦ का अर्थ
  choice: शैतानी
  alternative: निन्दक का / दुष्टतापूर्ण
  rationale: विशेषण को उसके व्यक्तिगत दुष्ट-सत्ता से जुड़े सामान्य धार्मिक अर्थ में रखा गया है, पर ‘शैतान का विष’ कहकर यूनानी विशेषण को अनावश्यक रूप से स्वामित्व-संबंध में नहीं बदला गया।
- issue: μῖσος की अभिव्यक्ति
  choice: बैर
  alternative: घृणा
  rationale: इस पद में μῖσος को ऐसी सक्रिय शक्ति के रूप में व्यक्त किया गया है जो झूठ, बदनामी, क्रोध और युद्ध को जन्म देती है; ‘बैर’ उस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल की क्रमिक, तीव्र होती हुई दोष-सूची और प्रकाश/अन्धकार तथा मीठे/कड़वे के विरोधों को सुरक्षित रखा गया है।
