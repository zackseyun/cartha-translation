  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/006.yaml
  text: These things I learned at last after I repented concerning Joseph.
translation:
  language: hi
  text: ये बातें मैं अंततः तब समझा, जब मैंने यूसुफ के विषय में पश्चाताप किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक सर्वनाम का स्वाभाविक हिन्दी रूप।
- source_word: ἔσχατον ἔγνων
  choice: मैं अंततः ... समझा
  rationale: ἔσχατον यहाँ कालगत अर्थ में ‘अंततः’ है; ἔγνων के लिए ‘समझा’ उस अनुभवजन्य बोध को सहज हिन्दी में व्यक्त करता है।
- source_word: μετὰ τὸ μετανοῆσαί με
  choice: तब, जब मैंने ... पश्चाताप किया
  rationale: कालवाचक infinitive construction को स्वाभाविक हिन्दी उपवाक्य में रखा गया है; μετανοέω का नैतिक संदर्भ ‘पश्चाताप करना’ से सुरक्षित रहता है।
- source_word: περὶ Ἰωσήφ
  choice: यूसुफ के विषय में
  rationale: περί के अपेक्षाकृत खुले संबंधार्थ को बनाए रखता है और यह अनावश्यक रूप से तय नहीं करता कि पश्चाताप यूसुफ के विरुद्ध किए गए व्यवहार पर था या उसके बारे में रखे गए रवैये पर।
theological_decisions:
- issue: μετανοέω में मन-परिवर्तन और नैतिक पश्चाताप का संबंध
  choice: पश्चाताप किया
  alternative: मन बदला
  rationale: इस प्रसंग में यूसुफ से संबंधित पूर्व दोष को स्वीकार करने का नैतिक आयाम है; ‘पश्चाताप’ इसे व्यक्त करता है, बिना किसी विशिष्ट सांप्रदायिक सिद्धांत को आरोपित किए।
- issue: περὶ Ἰωσήφ का संबंध
  choice: यूसुफ के विषय में
  alternative: यूसुफ के साथ किए व्यवहार के लिए
  rationale: मूल यूनानी संक्षिप्त और कुछ हद तक अस्पष्ट है। चुना हुआ रूप उस अस्पष्टता को सुरक्षित रखता है; विकल्प अर्थ को आवश्यकता से अधिक स्पष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘अंततः’ को उस स्थान पर रखा गया है जहाँ उसका संबंध ‘समझा’ से स्पष्ट रहे, जबकि पश्चाताप के बाद की कालगत क्रमबद्धता भी बनी रहे।
