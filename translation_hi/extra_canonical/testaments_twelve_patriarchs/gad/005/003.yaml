source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. Ἡ²⁵ δικαιοσύνη²⁶ ἐκβάλλει τὸ μῖσος²⁷, ἡ ταπείνωσις ἀναιρεῖ *τὸ ζῆλος²⁸. ὁ γὰρ δίκαιος καὶ ταπεινῶς αἰδεῖται ποιῆσαι ἄδικον²⁹, ⸀οὐχ ὑπ᾽ ἄλλου³⁰ καταγινωσκόμενος³¹ ἀλλ᾽³² ὑπὸ τῆς ἰδίας καρδίας³³, ὅτι Κύριος ἐπισκοπεῖ³⁴ *τὴν ψυχὴν³⁵ αὐτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/003.yaml
  text: Righteousness casts out hatred, and humility removes jealousy. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul.
translation:
  language: hi
  text: धार्मिकता घृणा को दूर कर देती है, और नम्रता ईर्ष्या को मिटा देती है। क्योंकि धर्मी व्यक्ति, विनम्र होकर, अन्याय करने में लज्जित होता है—इसलिए नहीं कि कोई दूसरा उसे दोषी ठहराता है, बल्कि इसलिए कि उसका अपना हृदय उसे दोषी ठहराता है, क्योंकि प्रभु उसकी आत्मा पर दृष्टि रखता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यहाँ अमूर्त नैतिक गुण का बोध है; ‘धार्मिकता’ न्यायपूर्ण और सही आचरण दोनों को समेटती है।
- source_word: ἐκβάλλει
  choice: दूर कर देती है
  rationale: मूल अर्थ ‘बाहर निकालना’ है; घृणा के संदर्भ में यह स्वाभाविक हिन्दी अभिव्यक्ति है और उसकी निष्कासन-शक्ति बनाए रखती है।
- source_word: ταπείνωσις
  choice: नम्रता
  rationale: यहाँ दीनता या अपमान नहीं, विनम्र स्वभाव अपेक्षित है।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: संदर्भ में यह सकारात्मक उत्साह के बजाय द्वेषपूर्ण जलन को दर्शाता है।
- source_word: αἰδεῖται
  choice: लज्जित होता है
  rationale: क्रिया नैतिक संकोच और लज्जा व्यक्त करती है, केवल भय नहीं।
- source_word: καταγινωσκόμενος
  choice: दोषी ठहराता है
  rationale: न्यायिक/नैतिक दोषारोपण का भाव सुरक्षित रहता है; वाच्य को हिन्दी में प्रसंगानुसार सक्रिय रूप में व्यक्त किया गया है।
- source_word: ἐπισκοπεῖ
  choice: दृष्टि रखता है
  rationale: मूल में निरीक्षण, देखरेख और सजग अवलोकन का भाव है; यह चयन किसी एक संकीर्ण अर्थ तक सीमित नहीं करता।
- source_word: ψυχή
  choice: आत्मा
  rationale: मानव के भीतरी जीवन/प्राण के लिए परंपरागत और गरिमापूर्ण समतुल्य; मूल की अर्थ-विस्तृति पूर्णतः सीमित नहीं की गई।
theological_decisions:
- issue: अपने हृदय द्वारा दोषी ठहराया जाना
  choice: ‘उसका अपना हृदय उसे दोषी ठहराता है’
  alternative: ‘वह अपने ही हृदय में दोषी ठहरता है’
  rationale: मूल ὑπὸ τῆς ἰδίας καρδίας हृदय को दोषबोध के कर्ता/स्रोत के रूप में प्रस्तुत करता है; स्पष्ट हिन्दी में यही संबंध रखा गया है।
- issue: प्रभु का आत्मा पर ἐπισκοπεῖν
  choice: ‘प्रभु उसकी आत्मा पर दृष्टि रखता है’
  alternative: ‘प्रभु उसकी आत्मा की जाँच करता है’
  rationale: ‘दृष्टि रखता है’ निरीक्षण और देखभाल दोनों की संभाव्यता बचाता है; ‘जाँच करता है’ केवल न्यायिक परीक्षण की ओर अर्थ को संकुचित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और नैतिक-उपदेशात्मक रजिस्टर अपनाया गया है। ग्रीक पाठ की पुनरुक्ति और कारणसूचक संरचना को यथासंभव सुरक्षित रखते हुए वाक्य को स्वाभाविक हिन्दी में रखा गया है।
