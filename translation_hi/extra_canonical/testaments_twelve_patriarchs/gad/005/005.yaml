id: T12P.GAD.5.5
reference: Testament of Gad 5:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Φοβούμενος γὰρ⁴¹ μὴ προσκρούσαι⁴² Κυρίῳ⁴³, οὐ θέλει τὸ καθόλου⁴⁴ οὐδὲ⁴⁵ ἕως ἐννοίας⁴⁶ ἀδικῆσαι ἄνθρωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/005.yaml
  text: For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.
translation:
  language: hi
  text: क्योंकि वह इस डर से कि कहीं प्रभु को अप्रसन्न न कर दे, किसी मनुष्य के साथ अन्याय करना तनिक भी नहीं चाहता—विचार में भी नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενος
  choice: इस डर से
  rationale: यह वर्तमान कृदन्त मुख्य क्रिया के कारण को व्यक्त करता है; सहज हिन्दी में ‘इस डर से’ उसी संबंध को स्पष्ट रखता है।
- source_word: προσκρούσαι Κυρίῳ
  choice: प्रभु को अप्रसन्न कर दे
  rationale: προσκόπτω/προσκρούω का यहाँ भाव प्रभु के विरुद्ध चूककर उन्हें रुष्ट या अप्रसन्न करने का है; शाब्दिक ‘ठोकर खाना’ हिन्दी में आशय भटका देगा।
- source_word: τὸ καθόλου
  choice: तनिक भी नहीं
  rationale: पूर्ण निषेध को स्वाभाविक आधुनिक हिन्दी में प्रबल रूप से व्यक्त करता है।
- source_word: ἕως ἐννοίας
  choice: विचार में भी नहीं
  rationale: मन की धारणा या सोच तक अन्याय न करने की सीमा को संक्षिप्त और सहज रूप में रखता है।
- source_word: ἀδικῆσαι ἄνθρωπον
  choice: किसी मनुष्य के साथ अन्याय करना
  rationale: ἀδικέω के नैतिक अर्थ ‘अन्याय/गलत करना’ और अनिश्चित सामान्य कर्म ‘मनुष्य’ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु के प्रति προσκρούσαι का अर्थ
  choice: प्रभु को अप्रसन्न करना
  alternative: प्रभु के विरुद्ध अपराध करना
  rationale: यूनानी पद में ठोकर, टकराव या अप्रसन्न करने की अर्थ-छाया है। ‘अपराध करना’ संभव है, पर वह कानूनी-धार्मिक अर्थ को आवश्यकता से अधिक निश्चित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी वाक्य के कारणात्मक ढाँचे और ‘विचार तक’ पहुँचने वाले प्रबल निषेध को बनाए रखा गया है।
