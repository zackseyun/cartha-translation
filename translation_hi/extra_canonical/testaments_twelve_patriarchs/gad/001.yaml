  language: hi
  text: '**गाद का वसीयतनामा 1**


    **1.** यह गाद के वसीयतनामे की प्रति है—वे बातें जो उसने अपने जीवन के एक सौ पच्चीसवें वर्ष में अपने पुत्रों से कही थीं। उसने उनसे कहा:[a]


    **2.** “मेरे बच्चो, सुनो। मैं याकूब का नौवाँ पुत्र था और भेड़-बकरियों के झुंडों की रखवाली करने में साहसी था।


    **3.** मैं रात में झुंड की रखवाली करता था। जब कभी कोई सिंह, भेड़िया या कोई दूसरा जंगली पशु झुंड पर टूट पड़ता, तो मैं उसका पीछा करता। उसे जा पकड़ता, अपने हाथ से उसका पैर थाम लेता, उसे पत्थर फेंकने की दूरी तक फेंक देता और मार डालता था।


    **4.** मेरा भाई यूसुफ तीस दिन तक हमारे साथ पशु चराता रहा। वह युवा था और लू से दुर्बल हो गया।


    **5.** तब वह हेब्रोन में हमारे पिता के पास लौट गया। हमारे पिता उसे अपने पास लिटाते थे, क्योंकि वे उससे बहुत प्रेम करते थे।


    **6.** यूसुफ ने हमारे पिता से कहा कि जिल्पा और बिल्हा के पुत्र झुंड के सबसे अच्छे पशुओं को बलि चढ़ाकर रूबेन और यहूदा की इच्छा के विरुद्ध उन्हें खा जाते हैं।


    **7.** दरअसल, उसने देखा था कि मैंने एक मेमने को भालू के मुँह से छुड़ाया और उस भालू को मार डाला। फिर मैंने उस मेमने को भी बलि चढ़ा दिया, क्योंकि वह जीवित नहीं रह सकता था—इस बात का मुझे दुःख था—और हमने उसे खा लिया।


    **8.** इसी कारण मैं यूसुफ से उस दिन तक बैर रखता रहा, जिस दिन वह बेच दिया गया।[b]


    **9.** घृणा की आत्मा मुझमें थी। मैं न तो यूसुफ को अपने कानों से सुनना चाहता था, न उसे अपनी आँखों से देखना; क्योंकि उसने हमारे मुँह पर हमें दोषी ठहराते हुए कहा था कि हम यहूदा की अनुपस्थिति में झुंड के पशु खा रहे थे। वह हमारे पिता से जो कुछ कहता था, हमारे पिता उसकी बात मान लेते थे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी पाठ की आरंभिक कथा में कई कठिन और अलग-अलग पाठ-रूप मिलते हैं। यहाँ अनुवाद ने उस पाठ-रूप का अनुसरण किया है जिसमें गाद अपनी चरवाही की शक्ति और यूसुफ के प्रति अपने बैर की शुरुआत का वर्णन करता है।
    reason: textual_variant
  - marker: b
    text: यूनानी पद का शाब्दिक अर्थ “उसके निपटारे के दिन तक” भी हो सकता है; प्रसंग में यह यूसुफ के बेचे जाने की ओर संकेत करता है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀντίγραφον διαθήκης
  choice: वसीयतनामे की प्रति
  rationale: ἀντίγραφον प्रतिलिपि या प्रति को और διαθήκη इस साहित्यिक संदर्भ में अंतिम उपदेशात्मक वसीयतनामे को सूचित करता है।
- source_word: ἀνδρεῖος ἐπὶ τῶν ποιμνίων
  choice: भेड़-बकरियों के झुंडों की रखवाली करने में साहसी
  rationale: ἀνδρεῖος का बल और वीरता-संबंधी अर्थ रखा गया है, जबकि ἐπὶ τῶν ποιμνίων को स्वाभाविक हिन्दी में चरवाही के क्षेत्र से जोड़ा गया है।
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  choice: लू से दुर्बल हो गया
  rationale: καύσων तीखी गर्मी या लू और ἐμαλακίσθη उससे उत्पन्न कमजोरी दर्शाता है।
- source_word: παρὰ γνώμην
  choice: इच्छा के विरुद्ध
  rationale: यह वाक्यांश किसी की राय, सहमति या इच्छा के विपरीत काम करने का भाव देता है; पाठ में रूबेन और यहूदा दोनों इसके साथ जुड़े हैं।
- source_word: ἐνεκότουν
  choice: बैर रखता रहा
  rationale: क्रिया क्षणिक क्रोध से अधिक टिके हुए रोष और द्वेष को व्यक्त करती है।
- source_word: πνεῦμα τοῦ μίσους
  choice: घृणा की आत्मा
  rationale: अध्याय के नैतिक-आध्यात्मिक कथन को बिना केवल मनोवैज्ञानिक भावना में बदल दिए शब्दशः और सुबोध रूप में रखा गया है।
- source_word: κατὰ πρόσωπον ἤλεγξεν
  choice: हमारे मुँह पर हमें दोषी ठहराया
  rationale: मुहावरे की प्रत्यक्ष, आमने-सामने भर्त्सना और अपराध उजागर करने की शक्ति सुरक्षित रहती है।
- source_word: τὰ θρέμματα
  choice: झुंड के पशु
  rationale: शब्द पाले गए पशुओं को दर्शाता है; चरवाही के प्रसंग में यह ‘मवेशी’ से अधिक व्यापक और स्पष्ट है।
theological_decisions:
- issue: ‘घृणा की आत्मा’ का स्वरूप
  choice: व्यक्तिगत नैतिक दशा और सक्रिय आध्यात्मिक प्रभाव—दोनों की सम्भावना खुली रखते हुए ‘घृणा की आत्मा’
  alternative: घृणा की भावना
  rationale: πνεῦμα को केवल मनोदशा मान लेने से पाठ का आध्यात्मिक आयाम मिट सकता है; अनुवाद मूल की वास्तविक अस्पष्टता बनाए रखता है।
- issue: यूसुफ की शिकायत में उल्लिखित भाई
  choice: रूबेन और यहूदा
  alternative: यहूदा और यूसुफ अथवा केवल यहूदा
  rationale: दिए गए यूनानी पाठ में स्पष्ट रूप से Ῥουβὶμ καὶ Ἰούδα लिखा है; इसलिए अंग्रेज़ी परामर्श-पाठ से भिन्न होने पर भी मूल साक्ष्य का अनुसरण किया गया है।
- issue: यूसुफ के बेचे जाने का संकेत
  choice: मुख्य पाठ में ‘जिस दिन वह बेच दिया गया’, साथ में पाठगत टिप्पणी
  alternative: जिस दिन उसका निपटारा हुआ
  rationale: διαπράσεως का रूप कठिन है, पर कथा-संदर्भ बिक्री का दृढ़ संकेत देता है; टिप्पणी शाब्दिक अनिश्चितता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘मेरे बच्चो’, ‘लू’, ‘बैर रखना’ और ‘मुँह पर दोषी ठहराना’ जैसे स्वाभाविक प्रयोग मूल की पारिवारिक कथा और नैतिक तीव्रता बनाए रखते हैं। दिए गए यूनानी स्रोत में उपलब्ध केवल आरंभिक नौ अनुच्छेदों का अनुवाद किया गया है; अंग्रेज़ी परामर्श-पाठ की भिन्न, विस्तृत पाठ-परंपरा को मूल में अनुपस्थित सामग्री जोड़ने के लिए आधार नहीं बनाया गया।
