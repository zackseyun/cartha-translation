    **4.** मेरा भाई यूसुफ तीस दिन तक हमारे साथ पशु चराता रहा। वह छोटा था, इसलिए लू से दुर्बल हो गया।


    **5.** तब वह हेब्रोन में हमारे पिता के पास लौट गया। हमारे पिता उसे अपने पास लिटाते थे, क्योंकि वह उससे बहुत प्रेम करते थे।


    **6.** यूसुफ ने हमारे पिता से कहा कि जिल्पा और बिल्हा के पुत्र झुंड के सबसे अच्छे पशुओं को मारकर रूबेन और यहूदा की इच्छा के विरुद्ध उन्हें खा जाते हैं।


    **7.** दरअसल, उसने देखा था कि मैंने एक मेमने को भालू के मुँह से छुड़ाया और उस भालिन को मार डाला। फिर मैंने उस मेमने को भी मार दिया, क्योंकि वह जीवित नहीं रह सकता था—इस बात का मुझे दुःख था—और हमने उसे खा लिया।


