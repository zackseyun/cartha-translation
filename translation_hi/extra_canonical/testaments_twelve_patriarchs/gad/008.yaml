  text: 'Say these things[a], you also, to your children:


    that they honor Levi and Judah; for from them the Lord will raise up salvation for Israel.

    And tell them concerning Joseph, that they should love him, because in every affliction he was innocent,

    and he kept the commandment of God, not returning evil for evil.

    For he suffered much from his brothers, yet he loved them,

    and though they plotted against him, he spoke peaceably to them.


    And now, my children, I command you: love one another from the heart,

    and if anyone sins against you, speak peaceably to him, and in your soul hold no deceit;

    and if he confesses and repents, forgive him.

    But if he denies it, do not become heated in argument with him,

    lest, after taking in poison[b], he begin to swear and so commit a double sin.

    If anyone prospers beyond you, do not be grieved;

    but pray also for him, that he may be made complete in every good thing.


    If anyone is glorified, do not envy him;

    if anyone is enriched, do not be jealous.

    Bless the Lord who gives good things to all,

    because the poor man, if he is free from envy, is rich before the Lord.

    Do not hate a beautiful woman because of her appearance,

    and do not hate a man because of the abundance of his glory.

    For God gives the good things of the earth to whom he wills.


    Seek uprightness in your own works,

    and pray for your neighbor, so that if he prospers in every good thing, you may not be jealous.

    For the one who is jealous is always in turmoil,

    and the one who hates is always darkened.

    Love one another in deed and in word and in the intention of the soul.

    For I also spoke peaceably with Joseph, but in my heart I intended to kill him.

    The spirit of hatred is evil, because it is never at peace with men;

    it always desires their downfall.

    It weakens the body and disturbs the soul,

    and it puts wrath upon the mind.


    Therefore, if anyone does evil to you, do good to him,

    and pray for him; and you will be redeemed by the Lord from every evil.

    For if anyone prospers, and if he is shameless or lawless, do not be jealous;

    but wait for the end from the Lord.

    For either he receives his reward in this life,

    or, if he is kept for punishment, he will be repaid in the judgment.

    And if a poor man prospers and is without envy, even if he is not rich,

    he is blessed beyond all men, because he has the treasure that does not perish.

    Therefore cast away hatred[c], and love one another in uprightness of heart.'
translation:
  language: hi
  text: '**गाद का वसीयतनामा 8**


    **1** तुम भी ये बातें अपने बच्चों से कहना, ताकि वे यहूदा और लेवी का आदर करें; क्योंकि उन्हीं में से प्रभु इस्राएल के लिए उद्धार प्रकट करेगा।[a]


    **2** क्योंकि मुझे पता है कि तुम्हारे बच्चे उससे विमुख हो जाएँगे और हर प्रकार की दुष्टता, पीड़ा और भ्रष्टता में पड़कर प्रभु से दूर हो जाएँगे।[b]


    **3** थोड़ी देर शांत रहने के बाद उसने फिर कहा, “मेरे बच्चो, अपने पिता की बात मानो और मुझे मेरे पुरखों के निकट दफ़नाना।”


    **4** फिर उसने अपने पैर उठाए और शांति से सो गया।[c]


    **5** पाँच वर्ष बाद वे उसे हेब्रोन ले गए और उसे उसके पुरखों के साथ रख दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उन्हीं में से” यहूदा और लेवी दोनों की ओर संकेत करता है। कथन उद्धार के स्वरूप या उसके किसी एक विशेष वंश से संबंध को और संकीर्ण रूप में परिभाषित नहीं करता। यूनानी पाठ की कुछ पाठ-परंपराओं में “तुम्हारे लिए” भी मिलता है।
    reason: textual_and_theological_ambiguity
  - marker: b
    text: “उससे” का संदर्भ संभवतः प्रभु है, यद्यपि यूनानी सर्वनाम का संकेत पूरी तरह स्पष्ट नहीं है। “पीड़ा” के लिए प्रयुक्त शब्द का अर्थ “हानि” या “उत्पीड़न” भी हो सकता है।
    reason: referential_and_lexical_ambiguity
  - marker: c
    text: “सो गया” मृत्यु के लिए प्रयुक्त मूल यूनानी रूपक है।
    reason: metaphor_clarification
lexical_decisions:
- source_word: τιμήσωσιν
  choice: आदर करें
  rationale: यह संबंधपरक और सामुदायिक सम्मान व्यक्त करता है, बिना इसे आराधना या उपासना का अर्थ दिए।
- source_word: ἀνατελεῖ
  choice: उदय करेगा
  rationale: क्रिया के उदित करने या प्रकट करने वाले चित्र को बनाए रखता है; इसे केवल सामान्य ‘लाएगा’ में नहीं बदलता।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: दैवी बचाव के धार्मिक और व्यापक अर्थ को सुरक्षित रखता है।
- source_word: ἀποστήσονται
  choice: दूर हो जाएँगे
  rationale: यहाँ किसी व्यक्ति या प्रभु से अलग होने अथवा विमुख होने का अर्थ स्वाभाविक हिंदी में व्यक्त होता है; औपचारिक ‘धर्मत्याग करेंगे’ से अधिक व्यापक है।
- source_word: κακώσει
  choice: बुराई
  rationale: संदर्भ में दुष्ट आचरण और हानि की व्यापक श्रेणी को व्यक्त करता है; यूनानी शब्द ‘दुःख/उत्पीड़न’ का भाव भी ले सकता है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: मृत्यु के लिए प्रयुक्त मूल रूपक को सुरक्षित रखता है।
- source_word: ἐξάρας τοὺς πόδας
  choice: अपने पैर समेटे
  rationale: मृत्यु-शय्या के प्रसंग में पैरों को ऊपर खींचकर समेट लेने की स्वाभाविक क्रिया व्यक्त करता है।
- source_word: ἀνήγαγον
  choice: ले गए
  rationale: हेब्रोन की ओर शव को ले जाने का अर्थ सहज हिंदी में देता है; ‘ऊपर ले गए’ मूल क्रिया का अधिक शाब्दिक विकल्प है।
theological_decisions:
- issue: यहूदा और लेवी से उद्धार का उदय होना
  choice: ‘उन्हीं में से प्रभु इस्राएल के लिए उद्धार उदय करेगा’
  alternative: ‘उनसे इस्राएल के लिए उद्धार उदय होगा’
  rationale: प्रभु को कर्ता मानने वाले प्रस्तुत यूनानी पाठ का अनुसरण किया गया है, जबकि ‘उन्हीं में से’ का बहुवचन खुला रखा गया है; इसे किसी एक वंश, पद या बाद की विशिष्ट मसीही व्याख्या तक सीमित नहीं किया गया।
- issue: पद 2 में ‘उससे’ का संदर्भ
  choice: सर्वनाम ‘उससे’ बनाए रखा
  alternative: ‘प्रभु से दूर हो जाएँगे’
  rationale: मूल में αὐτοῦ का निकटतम संदर्भ पूर्णतः निर्विवाद नहीं है। अनुवाद पहले सर्वनाम को बनाए रखता है और वाक्य के अंत में प्रभु से दूरी को स्पष्ट रूप से व्यक्त करता है।
- issue: गाद की मृत्यु का वर्णन
  choice: ‘शांति से सो गया’
  alternative: ‘शांति से मर गया’
  rationale: मृत्यु के लिए यूनानी रूपक को बिना किसी अतिरिक्त मध्यावस्था-संबंधी सिद्धांत को आरोपित किए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। पारिवारिक संबोधन में “मेरे बच्चो” और मृत्यु-संस्कार के लिए “पूर्वजों के पास/साथ” रखा गया है। उपलब्ध यूनानी अध्याय के पाँचों पदों का ही अनुवाद किया गया है; अंग्रेज़ी परामर्श-पाठ में उपस्थित, पर इस दिए गए यूनानी स्रोत में अनुपस्थित विस्तृत नैतिक सामग्री को शामिल नहीं किया गया।
