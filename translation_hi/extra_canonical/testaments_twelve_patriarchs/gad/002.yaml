  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002.yaml
  text: '1 Therefore I confess my sin[a], children: many times I wanted to kill him, because I hated him from my soul. 2 And because of the dreams I added hatred toward him, and I wanted to wipe him out from the land of the living, as a calf licks up the green growth of the field. 3 But Judah sold him secretly to the Ishmaelites. 4 Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers. 4 And so, through greed, we were fully set on his murder. 5 But the God of my fathers rescued him from my hands[d][c][b], so that I might not commit a lawless deed in Israel.'
translation:
  language: hi
  text: '**गाद का वसीयतनामा 2**


    1 इसलिए, मेरे बच्चों, मैं अपना पाप स्वीकार करता हूँ[a]: मैंने कई बार उसे मार डालना चाहा, क्योंकि मैं अपने पूरे प्राण से उससे घृणा करता था। 2 उसके स्वप्नों के कारण उसके प्रति मेरी घृणा और भी बढ़ गई। मैं उसे जीवितों की भूमि से मिटा देना चाहता था[b], जैसे बछड़ा खेत की हरी वनस्पति को चाट जाता है। 3 और यहूदा ने उसे चुपके से इश्माएलियों को बेच दिया[c]। 4 इस प्रकार हमारे पितरों के परमेश्वर ने उसे हमारे हाथों से छुड़ा लिया, ताकि हम इस्राएल में बड़ा अधर्म न करें।


    3 इसलिए शिमोन और मैंने उसे सोने के तीस टुकड़ों के बदले इश्माएलियों को बेच दिया[d]। उनमें से दस छिपाकर हमने अपने भाइयों को बीस ही दिखाए। 4 इस प्रकार लालच के कारण उसे मार डालने का हमारा इरादा पक्का हो गया। 5 पर मेरे पितरों के परमेश्वर ने उसे मेरे हाथों से छुड़ा लिया, ताकि मैं इस्राएल में अधर्म न करूँ।


    [a] इस अध्याय में यूसुफ को बेचे जाने की घटना के एक से अधिक पाठ-रूप सुरक्षित हैं। उन्हें आपस में मिलाकर एक बनाने के बजाय यहाँ दोनों पाठ-परंपराओं का अनुवाद दिया गया है।


    [b] इसका अनुवाद “उसे चाटकर मिटा देना” या “उसे पूरी तरह निगल जाना” भी हो सकता है। यूनानी क्रिया का मूल अर्थ “चाट लेना” है, जिसे आगे आने वाला बछड़े का उपमान स्पष्ट करता है।


    [c] कुछ प्राचीन प्रतियों के अनुसार यहूदा ने उसे चुपके से बेच दिया; दूसरी पाठ-परंपरा कहती है, “इसलिए शिमोन और मैंने उसे इश्माएलियों को बेच दिया।”


    [d] “सोने के तीस टुकड़े” इसी यूनानी पाठ के अनुसार है। दस छिपाकर भाइयों को बीस दिखाने वाला वाक्य भी इसी वैकल्पिक पाठ-परंपरा का भाग है।'
