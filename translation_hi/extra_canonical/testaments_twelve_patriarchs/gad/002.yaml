lexical_decisions:
- source_word: Ὁμολογῶ
  choice: मैं ... स्वीकार करता हूँ
  rationale: यह सहज आधुनिक हिन्दी में पश्चात्तापपूर्ण और स्पष्ट अंगीकार व्यक्त करता है।
- source_word: ἁμαρτίαν
  choice: पाप
  rationale: यह मूल शब्द के नैतिक और धार्मिक भार को बनाए रखता है।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: गाद की हत्या करने की मंशा को स्पष्ट, सशक्त और अनार्ष भाषा में व्यक्त करता है।
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: मैं अपने पूरे प्राण से उससे घृणा करता था
  rationale: ‘प्राण’ मूल के ψυχή को प्रतिबिंबित करता है और तीव्रता को सामान्य ‘बहुत अधिक’ में हल्का नहीं करता।
- source_word: ἐνύπνια
  choice: स्वप्न
  rationale: संदर्भ यूसुफ के स्वप्नों का है; ‘स्वप्न’ गरिमापूर्ण और सर्वबोध्य है।
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: उसके प्रति मेरी घृणा और भी बढ़ गई
  rationale: शाब्दिक ‘घृणा जोड़ दी’ की अपेक्षा यह स्वाभाविक हिन्दी है और बढ़ोतरी का भाव सुरक्षित रखती है।
- source_word: ἐκλεῖξαι
  choice: मिटा देना
  rationale: जीवितों की भूमि से हटाने के मुहावरेदार आशय को मुख्य पाठ में स्पष्ट करता है; ‘चाट लेने’ का ठोस अर्थ उपमान और पादटिप्पणी में सुरक्षित है।
- source_word: ἐκ γῆς ζώντων
  choice: जीवितों की भूमि से
  rationale: मूल के उन्नत बाइबलीय मुहावरे को निकटता से बनाए रखता है।
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: मैदान की हरी वनस्पति
  rationale: बहुवचन-सामूहिक हरियाली को केवल ‘घास’ तक सीमित नहीं करता।
- source_word: κρυφῆ
  choice: चुपके से
  rationale: गुप्त रूप से किए गए कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐρρύσατο
  choice: छुड़ा लिया
  rationale: तात्कालिक प्राण-संकट से ठोस उद्धार का अर्थ देता है।
- source_word: ἀνομίαν μεγάλην / ἀνόμημα
  choice: घोर अधर्म का काम / अधर्म का काम
  rationale: कानूनी-नैतिक गंभीरता बनाए रखते हुए दोनों यूनानी रूपों के परिमाणगत अंतर को दर्शाता है।
- source_word: πλεονεξίᾳ
  choice: लालच के कारण
  rationale: धन-लिप्सा की प्रेरणा को सरल और सटीक रूप में व्यक्त करता है।
theological_decisions:
- issue: यूसुफ को बेचे जाने के परस्पर भिन्न पाठ-रूप
  choice: यहूदा द्वारा गुप्त रूप से बेचने वाला पाठ और शिमोन तथा गाद द्वारा बेचने वाला पाठ, दोनों अलग अनुच्छेदों में प्रस्तुत किए गए हैं।
  alternative: दोनों वृत्तांतों को मिलाकर एक सुगठित कथा बनाना या किसी एक पाठ-परंपरा को छोड़ देना।
  rationale: उपलब्ध यूनानी साक्ष्य समानांतर पाठ-रूप सुरक्षित रखता है; दोनों का अनुवाद पाठगत और धर्मवैचारिक तनाव को ईमानदारी से सामने रखता है।
- issue: ἐκλεῖξαι और बछड़े के उपमान का अर्थ
  choice: मुख्य वाक्य में मुहावरेदार ‘मिटा देना’, और अगले उपमान में ठोस ‘चाटकर साफ कर देना’ रखा गया है।
  alternative: दोनों स्थानों पर ‘चाट लेना’ कहना, अथवा उपमान को सामान्य ‘नष्ट करना’ में बदल देना।
  rationale: इससे हत्या/उन्मूलन का आशय हिन्दी पाठक के लिए स्पष्ट रहता है, जबकि मूल शब्दचित्र और उसकी जानबूझकर की गई पुनरावृत्ति भी दिखाई देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘मेरे बच्चो’, ‘मार डालना’, ‘चुपके से’ और ‘इरादा पक्का हो गया’ स्वाभाविक कथात्मक हिन्दी देते हैं; ‘पूरे प्राण से’, ‘जीवितों की भूमि’ और ‘अधर्म’ मूल की बाइबलीय ऊँचाई तथा नैतिक गंभीरता बनाए रखते हैं। दो पाठ-परंपराओं की दोहरी पद-संख्या जानबूझकर सुरक्षित रखी गई है।
