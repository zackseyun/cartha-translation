lexical_decisions:
- source_word: μετὰ ἔτη πέντε
  choice: पाँच वर्ष बाद
  rationale: यूनानी कालवाचक पदबंध का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: ἀνήγαγον αὐτὸν εἰς Χεβρών
  choice: वे उसे हेब्रोन ले गए
  rationale: ἀνάγω में निहित ‘ऊपर ले जाने’ का भाव सम्भव है, पर यहाँ गंतव्य तक पहुँचाने का सामान्य अर्थ अधिक स्वाभाविक है; अनावश्यक भौगोलिक व्याख्या नहीं जोड़ी गई।
- source_word: ἔθηκαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पुरखाओं के साथ रख दिया
  rationale: ‘रख दिया’ मूल क्रिया के निकट है और दफनाए जाने के प्रसंग को स्पष्ट रूप से ग्रहण करते हुए भी मूल की अभिव्यक्ति को ‘दफना दिया’ में सीमित नहीं करता; πατέρων का यहाँ वंशगत अर्थ ‘पुरखाओं’ से व्यक्त होता है।
