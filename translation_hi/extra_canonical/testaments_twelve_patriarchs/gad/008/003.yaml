  text: 'And after resting a little he spoke again: My children, obey your father, and bury me near my fathers.'
translation:
  language: hi
  text: और थोड़ा विश्राम करने के बाद उसने फिर कहा, “मेरे बच्चो, अपने पिता की बात मानो और मुझे मेरे पूर्वजों के पास दफ़ना देना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσυχάσας ὀλίγον
  choice: थोड़ा विश्राम करने के बाद
  rationale: यह कृदन्तीय पद थोड़ी देर शांत रहने या विश्राम करने का भाव देता है; प्रसंग में सहज हिन्दी के लिए यह चयन किया गया।
- source_word: ὑπακούσατε
  choice: बात मानो
  rationale: आज्ञार्थक क्रिया का अर्थ आज्ञापालन करना है; पिता और बच्चों के सीधे संबोधन में ‘बात मानो’ स्वाभाविक और स्पष्ट है।
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: मेरे पूर्वजों के पास
  rationale: πατέρων यहाँ मृत पितरों/पूर्वजों की ओर संकेत करता है; ‘पूर्वजों’ आधुनिक हिन्दी में अभिप्राय स्पष्ट रखता है और ‘पास’ स्थानिक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ‘मेरे पिताओं’ का अभिप्राय
  choice: मेरे पूर्वजों
  alternative: मेरे पितरों
  rationale: यह वंशगत दफ़न-स्थान का संकेत है। ‘पूर्वजों’ सामान्य पाठकों के लिए स्पष्ट है और किसी विशिष्ट धार्मिक कर्मकाण्ड का अतिरिक्त संकेत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण पारिवारिक संबोधन रखा गया है। ‘बच्चो’ का संबोधन-वचन मानक वर्तनी के अनुसार प्रयुक्त है; प्रत्यक्ष कथन के लिए उद्धरण-चिह्न जोड़े गए हैं।
