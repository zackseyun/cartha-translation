  text: Speak these things, you also, to your children, so that they may honor Judah and Levi; for from them the Lord will raise up for you salvation for Israel.
translation:
  language: hi
  text: तुम भी ये बातें अपने बच्चों से कहो, ताकि वे यहूदा और लेवी का आदर करें; क्योंकि उन्हीं में से प्रभु तुम्हारे लिए, इस्राएल के लिए, उद्धार प्रकट करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε
  choice: कहो
  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τιμήσωσιν
  choice: आदर करें
  rationale: सम्मान देने के अर्थ को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: ἀνατελεῖ
  choice: उदित करेगा
  rationale: क्रिया का मूल बिंब ‘उगना/उदय होना’ सुरक्षित रखता है; केवल सामान्य ‘उत्पन्न करेगा’ कहकर मसीही-संकेतात्मक तनाव को समतल नहीं करता।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: धार्मिक-साहित्यिक प्रसंग में मुक्ति, बचाव और छुटकारे की व्यापक अर्थ-सीमा वाला प्रचलित शब्द।
theological_decisions:
- issue: उद्धार का यहूदा और लेवी ‘में से’ उदित होना
  choice: ‘उन्हीं में से ... उद्धार उदित करेगा’
  alternative: ‘उनके द्वारा ... छुटकारा देगा’
  rationale: ἐξ αὐτῶν की उत्पत्ति-सूचक भाषा और ἀνατελεῖ के उदय-बिंब को बनाए रखा गया; यह निर्धारित नहीं किया गया कि संकेत किसी व्यक्ति, व्यक्तियों या व्यापक उद्धारकारी कार्य की ओर है।
- issue: ὑμῖν और τῷ Ἰσραήλ का संबंध
  choice: ‘तुम्हारे लिए—इस्राएल के लिए—’
  alternative: ‘तुम्हारे लिए इस्राएल का उद्धार’
  rationale: खंडित यूनानी में दोनों दत्तिवों का संबंध कुछ असहज/अस्पष्ट है। विराम-चिह्न द्वारा इस्राएल को ‘तुम्हारे’ का स्पष्टीकरण मानने की संभावना दर्शाई गई, बिना ‘इस्राएल का उद्धार’ जैसा अलग संबंध थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष उपदेशात्मक और गरिमापूर्ण शैली। उपलब्ध यूनानी खंड में क्रम ‘यहूदा और लेवी’ है, इसलिए अंग्रेज़ी परामर्श-पाठ के समान वही क्रम रखा गया। ‘उदित करेगा’ जानबूझकर थोड़ा साहित्यिक है, ताकि यूनानी रूपक सुरक्षित रहे।
