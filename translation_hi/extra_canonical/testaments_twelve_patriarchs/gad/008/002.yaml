source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ἐγὼ γὰρ ἔγνων⁶, ὅτι ἀποστήσονται⁷ τὰ τέκνα ὑμῶν ἀπ᾽ αὐτοῦ⁸, καὶ⁹ πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ ἔσονται ἀπὸ¹⁰ Κυρίου.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/002.yaml
  text: For I have known that your children will turn away from him, and in every wickedness and affliction and corruption they will be away from the Lord.
translation:
  language: hi
  text: क्योंकि मैं जान गया हूँ कि तुम्हारी संतानें उससे[a] दूर हो जाएँगी, और हर प्रकार की दुष्टता, क्लेश और भ्रष्टता में होंगी और प्रभु से दूर होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उससे” का संकेत किसकी ओर है, इस पद के उपलब्ध यूनानी अंश में स्पष्ट नहीं है; संभव है कि आशय प्रभु से हो।
    reason: सर्वनाम αὐτοῦ के अस्पष्ट पूर्वपद को पाठक के सामने बनाए रखना।
lexical_decisions:
- source_word: ἔγνων
  choice: मैं जान गया हूँ
  rationale: यूनानी क्रिया के पूर्ण हुए बोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀποστήσονται
  choice: फिर जाएगी
  rationale: यह क्रिया दूर हटने, त्याग देने या विद्रोह करने का अर्थ दे सकती है; ‘फिर जाएगी’ संदर्भ को अनावश्यक रूप से अधिक निश्चित किए बिना विमुखता व्यक्त करता है।
- source_word: τὰ τέκνα ὑμῶν
  choice: तुम्हारी संतान
  rationale: समूहवाचक एकवचन हिन्दी में वंशजों के सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ
  choice: हर प्रकार की दुष्टता, क्लेश और भ्रष्टता में पड़कर
  rationale: तीनों संज्ञाओं का भेद बनाए रखता है; ‘में पड़कर’ यूनानी वाक्य की परिस्थिति को सुबोध हिन्दी में जोड़ता है।
- source_word: ἀπὸ Κυρίου
  choice: प्रभु से दूर
  rationale: ἀπό के अलगाव-सूचक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀπ᾽ αὐτοῦ में सर्वनाम का संदर्भ
  choice: उससे
  alternative: प्रभु से
  rationale: इस खंड में सर्वनाम का पूर्वपद स्पष्ट नहीं है। उसे सीधे ‘प्रभु’ मान लेने के बजाय मूल की वास्तविक संदिग्धता सुरक्षित रखी गई है।
- issue: विमुखता और नैतिक पतन का संबंध
  choice: दुष्टता, क्लेश और भ्रष्टता में पड़कर प्रभु से दूर हो जाएगी
  alternative: प्रभु से दूर रहकर हर दुष्टता, क्लेश और भ्रष्टता में होगी
  rationale: यूनानी का क्रम और अलगाव का भाव बनाए रखते हुए हिन्दी वाक्य को पठनीय बनाया गया है, पर यह निर्णायक दावा नहीं किया गया कि नैतिक पतन दूरी का कारण है या परिणाम।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गंभीर और वसीयतनुमा भविष्यवाणी के अनुरूप है। ‘संतान’ सामूहिक अर्थ में है, इसलिए क्रियाएँ एकवचन स्त्रीलिंग में रखी गई हैं।
