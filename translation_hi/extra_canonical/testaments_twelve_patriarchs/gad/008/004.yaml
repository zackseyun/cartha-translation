lexical_decisions:
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  choice: अपने पैर समेटकर
  rationale: मृत्यु-शय्या के प्रसंग में यह स्वाभाविक हिन्दी है और पैरों को ऊपर खींचने/समेटने की यूनानी क्रिया को व्यक्त करती है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: यूनानी में शाब्दिक अर्थ ‘सो गया’ है और मृत्यु के लिए प्रयुक्त सौम्य रूपक भी बना रहता है; इसे सीधे ‘मर गया’ करके तनाव समाप्त नहीं किया गया।
- source_word: ἐν εἰρήνῃ
  choice: शान्ति से
  rationale: यह स्वाभाविक हिन्दी में शांतिपूर्ण अवस्था या रीति को व्यक्त करता है और यूनानी वाक्यांश का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ἐκοιμήθη में नींद और मृत्यु का रूपक
  choice: सो गया
  alternative: उसकी मृत्यु हो गई
  rationale: स्रोत का निद्रा-संबंधी रूपक जानबूझकर सुरक्षित रखा गया है; प्रसंग पाठक को मृत्यु का आशय समझने देता है।
translation_notes:
