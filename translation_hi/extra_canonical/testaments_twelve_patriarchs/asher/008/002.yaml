  text: और उसके पुत्रों ने वह सब किया जो उसने उन्हें आज्ञा दी थी, और वे उसे हेब्रोन ले गए और उसके पितरों के साथ उसे दफनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν ... ὅσα ἐνετείλατο αὐτοῖς
  choice: वैसा ही किया जैसा उसने उन्हें आज्ञा दी थी
  rationale: ग्रीक के आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और आज्ञापालन की पूर्णता बनाए रखता है।
- source_word: ἀπήγαγον αὐτὸν ἐν Χεβρὼν
  choice: वे उसे हेब्रोन ले गए
  rationale: यहाँ क्रिया का अर्थ मृत देह को हेब्रोन ले जाना है; हिन्दी में 'ले गए' स्पष्ट और स्वाभाविक है।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पूर्वजों के साथ
  rationale: πατέρων का बहुवचन इस दफ़न-संदर्भ में वंश के पहले मृत जनों को दर्शाता है; 'पूर्वजों' से अर्थ सहज और गैर-सांप्रदायिक रहता है।
