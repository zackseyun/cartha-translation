  text: VIII. Καὶ¹ εἰπὼν αὐτοῖς ταῦτα ἐνετείλατο λέγων²· Θάψατέ με ἐν³ Χεβρών⁴. Καὶ ἀπέθανεν⁵ †ὕπνῳ⁶ καλῷ κοιμηθείς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/001.yaml
  text: And after saying these things to them, he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep.
translation:
  language: hi
  text: 'और ये बातें उनसे कहकर उसने उन्हें यह आज्ञा दी: “मुझे हेब्रोन में दफ़नाना।” फिर वह मर गया, अच्छी नींद सोकर।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यह क्रिया निर्देश देने से अधिक प्रबल है; ‘आज्ञा दी’ उसके आदेशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Θάψατέ με
  choice: मुझे … दफ़नाना
  rationale: यूनानी बहुवचन आज्ञार्थक है; हिन्दी में संबोधित समूह के लिए यह स्वाभाविक आदेशात्मक रूप है।
- source_word: Χεβρών
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: एक अच्छी नींद सोते हुए
  rationale: ‘सोना/नींद’ की मूल पुनरुक्ति और मृत्यु के रूपक को बनाए रखा गया है; इसे केवल ‘शांतिपूर्वक’ कहकर व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: मृत्यु को नींद के रूप में व्यक्त करने वाला वाक्य
  choice: वह मर गया—एक अच्छी नींद सोते हुए
  alternative: वह शांतिपूर्वक मर गया
  rationale: मूल पाठ स्पष्ट रूप से ‘मर गया’ और ‘नींद सोते हुए’ दोनों कहता है। रूपक को किसी विशिष्ट परलोक-सिद्धांत में बदलने या केवल भावार्थ में समेटने के बजाय दोनों तत्व सुरक्षित रखे गए हैं।
- issue: † चिह्नित पाठ की संभावित पाठगत कठिनाई
  choice: मुख्य पाठ के उपलब्ध शब्दों का निकट अनुवाद
  alternative: ‘वह सुखद निद्रा में सो गया’
  rationale: प्रदत्त यूनानी में ὕπνῳ καλῷ κοιμηθείς पाठगत रूप से चिह्नित है, पर कोई वैकल्पिक पाठ नहीं दिया गया। इसलिए अस्पष्टता को बिना अनुमानित संशोधन के बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘और… फिर…’ क्रम कथा-प्रवाह को स्वाभाविक बनाता है, जबकि अंतिम पदबंध की असामान्य पुनरुक्ति मूल यूनानी की काव्यात्मक और रूपकात्मक बनावट के कारण जानबूझकर रखी गई है।
