  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008.yaml
  text: And after saying these things to them[a], he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep. And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: hi
  text: '**8:1** उनसे ये बातें कहने के बाद उसने उन्हें आज्ञा दी: “मुझे हेब्रोन में दफ़नाना।” और वह मर गया—अच्छी नींद में सोते हुए।[a] **2** उसके पुत्रों ने वैसा ही किया जैसा उसने उन्हें आज्ञा दी थी। वे उसे हेब्रोन ले गए और उसके पितरों के साथ उसे दफ़नाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से मृत्यु के सीधे कथन के साथ ‘अच्छी नींद में सोते हुए’ कहा गया है; इस प्रकार मृत्यु और निद्रा की पारंपरिक छवि दोनों साथ रखी गई हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यह क्रिया अंतिम निर्देश के अधिकारपूर्ण और गंभीर स्वर को व्यक्त करती है; दोनों occurrences में एक ही शब्दावली रखना यूनानी पुनरावृत्ति को भी सुरक्षित रखता है।
- source_word: Θάψατέ
  choice: दफ़नाना
  rationale: प्रत्यक्ष आज्ञार्थक भाव को सरल और स्पष्ट रूप में रखता है; हिंदी में उद्धृत आदेश के रूप में यह स्वाभाविक है।
- source_word: Χεβρών
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: ἀπέθανεν
  choice: वह मर गया
  rationale: मृत्यु के स्पष्ट कथन को सीधे अनूदित किया गया है; उसके बाद आने वाली निद्रा-छवि को इसका स्थानापन्न नहीं बनाया गया।
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: एक अच्छी नींद सोकर
  rationale: यूनानी के संज्ञा और क्रिया—दोनों में उपस्थित निद्रा-भाषा को बनाए रखता है और उसे केवल ‘शांति से’ कहकर समतल नहीं करता।
- source_word: ἀπήγαγον
  choice: ले गए
  rationale: शरीर को दूसरे स्थान तक पहुँचाने का भाव स्वाभाविक आधुनिक हिंदी में व्यक्त होता है, बिना मूल में अनुपस्थित ‘शव’ जोड़े।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पितरों के साथ
  rationale: पारंपरिक पारिवारिक और दफ़न-सूत्र को सुरक्षित रखता है; ‘पूर्वजों’ की तुलना में ‘पितरों’ में मूल की संबंधपरक बनावट अधिक बनी रहती है।
theological_decisions:
- issue: मृत्यु का निद्रा की छवि के साथ वर्णन
  choice: ‘वह मर गया’ और ‘एक अच्छी नींद सोकर’—दोनों को बनाए रखा
  alternative: केवल ‘वह शांति से मर गया’ या केवल ‘वह सो गया’
  rationale: यूनानी पाठ मृत्यु का स्पष्ट कथन और निद्रा-संबंधी कृदंत—दोनों देता है। दोनों को रखना साहित्यिक और धर्मवैचारिक तनाव को बिना हल किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘दफ़नाना’ और ‘ले गए’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘पितरों के साथ’ मूल के पारंपरिक दफ़न-सूत्र को बनाए रखता है। विराम-चिह्न निद्रा-वाक्यांश की असामान्य परंतु जानबूझकर सुरक्षित रखी गई संरचना को स्पष्ट करते हैं।
