base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/003.yaml
  text: Until the Most High visits the earth, himself coming as a man, eating and drinking with men, and crushing the head of the dragon upon the water; this one will save Israel and all the nations [God appearing as a man].
translation:
  language: hi
  text: परमप्रधान के पृथ्वी की सुधि लेने तक—वह स्वयं मनुष्य के रूप में आकर, मनुष्यों के साथ खाते-पीते और जल के ऊपर अजगर का सिर कुचलते हुए—वही इस्राएल और सभी राष्ट्रों को बचाएगा [मनुष्य का वेश धारण किए हुए परमेश्वर]।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम कोष्ठकित शब्द यूनानी संपादित पाठ में भी कोष्ठकों में दिए गए हैं; इससे इस अंश की पाठगत स्थिति पर अनिश्चितता सूचित होती है।
    reason: स्रोत संस्करण की कोष्ठक-चिह्नित पाठालोचनात्मक अनिश्चितता पाठक के सामने बनाए रखना।
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त उपाधि का प्रचलित, गरिमापूर्ण और निकटार्थी हिन्दी रूप है।
- source_word: ἐπισκέψηται τὴν γῆν
  choice: पृथ्वी की सुधि ले
  rationale: ἐπισκέπτομαι में केवल भौतिक रूप से ‘भेंट करना’ नहीं, बल्कि ध्यान देने और हस्तक्षेप करने का भाव भी हो सकता है; ‘सुधि लेना’ इस अर्थ-विस्तार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὡς ἄνθρωπος
  choice: मनुष्य के रूप में
  rationale: ὡς की तुलना/प्रकट रूप की गुंजाइश को बनाए रखता है और इसे सीधे, अधिक निर्णायक देहधारण-सूत्र में नहीं बदलता।
- source_word: ἐσθίων καὶ πίνων
  choice: खाए-पिए
  rationale: साथ रहने के ठोस मानवीय कार्यों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν κάραν τοῦ δράκοντος
  choice: अजगर का सिर
  rationale: κάρα का अर्थ ‘सिर’ और δράκων का पारंपरिक चित्रात्मक अर्थ ‘अजगर/विशाल सर्प’ है; ‘अजगर’ संक्षिप्त और परिचित है।
- source_word: ἐπὶ τοῦ ὕδατος
  choice: जल के ऊपर
  rationale: ἐπί के स्थानिक अर्थ को बिना यह तय किए सुरक्षित रखता है कि क्रिया जल की सतह पर है या उसके ऊपर।
- source_word: σώσει
  choice: बचाएगा
  rationale: σῴζω के व्यापक उद्धार/रक्षा अर्थ को साधारण पाठक के लिए स्पष्ट रखता है और प्रसंग से अधिक धर्मशास्त्रीय विशिष्टता नहीं जोड़ता।
- source_word: ὑποκρινόμενος
  choice: वेश धारण किए हुए
  rationale: यहाँ शब्द भूमिका निभाने, अपने को किसी रूप में प्रस्तुत करने या वेश लेने का भाव देता है; यह ‘प्रकट होने’ से अधिक सटीक है, पर ‘छल करने’ जैसा अनावश्यक नकारात्मक निर्णय नहीं जोड़ता।
theological_decisions:
- issue: परमप्रधान और मनुष्य के रूप में आने वाले व्यक्ति की पहचान
  choice: ‘वह स्वयं’ और ‘वही’ द्वारा यूनानी पाठ की प्रत्यक्ष पहचान बनाए रखी गई।
  alternative: दो अलग व्यक्तियों या किसी प्रतिनिधि के रूप में अर्थ स्पष्ट करना।
  rationale: मूल पाठ αὐτός और οὗτος से पहचान को मजबूत करता है; अनुवाद को इस तनाव को न तो कम करना चाहिए, न किसी बाद की धर्मसैद्धांतिक व्याख्या में विस्तार देना चाहिए।
- issue: ὡς ἄνθρωπος और कोष्ठकित θεὸς εἰς ἄνδρα ὑποκρινόμενος का संबंध
  choice: मुख्य वाक्य में ‘मनुष्य के रूप में’ और कोष्ठकित अंश में ‘मनुष्य का वेश धारण किए हुए परमेश्वर’ रखा गया।
  alternative: दोनों को ‘परमेश्वर मनुष्य बन गया’ कहना।
  rationale: ऐसा निर्णायक कथन मूल की तुलना/भूमिका-वेश संबंधी भाषा से आगे जाता; अलग-अलग अभिव्यक्तियाँ मूल की वास्तविक शब्दगत और धर्मशास्त्रीय खिंचाव को सुरक्षित रखती हैं।
- issue: इस्राएल और सभी राष्ट्रों का उद्धार
  choice: दोनों कर्मों को समान रूप से ‘बचाएगा’ से जोड़ा गया।
  alternative: इस्राएल के लिए राजनीतिक मुक्ति और राष्ट्रों के लिए आत्मिक उद्धार अलग-अलग निर्दिष्ट करना।
  rationale: मूल एक ही क्रिया σώσει दोनों पर लागू करता है और उद्धार की विधि या प्रकृति नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘परमप्रधान’, ‘पृथ्वी’, ‘जल’ और ‘इस्राएल’ शास्त्रीय संदर्भ के अनुरूप हैं, जबकि वाक्य-रचना सामान्य पाठक के लिए प्रवाहपूर्ण रखी गई है। आरंभिक Ἕως οὗ की अधूरी-सी प्रत्याशा और उसके बाद οὗτος σώσει के परिणाम को हिन्दी में डैश और ‘तब तक नहीं; वही’ से व्यक्त किया गया है, यद्यपि यह संरचना मूल की तनावपूर्ण वाक्य-गति को प्राथमिकता देती है।
