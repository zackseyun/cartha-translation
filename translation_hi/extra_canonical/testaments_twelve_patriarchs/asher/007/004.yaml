  text: Therefore, my children, you also tell these things to your children, so that they may not disobey him.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, तुम भी ये बातें अपने बच्चों को बताओ, ताकि वे उसकी अवज्ञा न करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε
  choice: बताना
  rationale: ग्रीक का आदेशात्मक भाव रखा गया है; प्रसंग में अगली पीढ़ी को शिक्षा देने के लिए आधुनिक हिंदी में यह स्वाभाविक है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: प्रत्यक्ष संबोधन और स्नेहपूर्ण पैतृक स्वर को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: μὴ ἀπειθήσωσιν
  choice: ताकि वे उसकी आज्ञा न टालें
  rationale: ἀπειθέω यहाँ किसी की बात या अधिकार को न मानने का भाव देता है; यह चयन केवल सामान्य अविश्वास की अपेक्षा उस संबंधपरक अवज्ञा को अधिक स्पष्ट करता है।
- source_word: αὐτῷ
  choice: उसकी
  rationale: पुल्लिंग एकवचन सर्वनाम को बिना उसके संदर्भ को पाठ से बाहर जाकर निश्चित किए सुरक्षित रखा गया है।
theological_decisions:
- issue: αὐτῷ का संदर्भ
  choice: उसकी आज्ञा न टालें
  alternative: उसकी अवज्ञा न करें / उस पर अविश्वास न करें
  rationale: ग्रीक सर्वनाम का पूर्वपद इस पद में नहीं दिया गया है। अनुवाद ने 'उसकी' रखकर संदर्भगत अस्पष्टता सुरक्षित रखी है और किसी विशिष्ट व्यक्ति या ईश्वर का नाम नहीं जोड़ा।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में पैतृक संबोधन और आदेश का स्वर बनाए रखा गया है।
