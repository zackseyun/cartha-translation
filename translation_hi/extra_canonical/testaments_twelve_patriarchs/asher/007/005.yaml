source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ ἔγνων³³ ὅτι ⸀ἀπειθοῦντες⸀³⁴ *ἀπειθήσετε, καὶ ἀσεβοῦντες ἀσεβήσετε³⁵, μὴ προσέχοντες³⁶ *τῷ νόμῳ³⁷ θεοῦ, ἀλλ᾽ ἐντολαῖς ἀνθρώπων *κακίᾳ διαφθειρόμενοι³⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/005.yaml
  text: For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि अवज्ञा करते हुए तुम अवज्ञा करोगे, और अधर्म करते हुए अधर्म करोगे; परमेश्वर की व्यवस्था पर ध्यान न देते हुए, बल्कि मनुष्यों की आज्ञाओं के माध्यम से दुष्टता से भ्रष्ट होते जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: मैं जान गया था
  rationale: यूनानी एओरिस्ट के भूतकालीन बोध को बनाए रखता है; इसे केवल वर्तमानकालीन ‘मैं जानता हूँ’ बनाकर कालगत भेद मिटाया नहीं गया।
- source_word: ἀπειθοῦντες ἀπειθήσετε
  choice: अवज्ञा करते हुए अवज्ञा करोगे
  rationale: सहजात कृदंत और क्रिया की जानबूझकर की गई पुनरुक्ति को बनाए रखता है, जो लगातार और निश्चित अवज्ञा पर बल देती है।
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: अधर्म करते हुए अधर्म करोगे
  rationale: मूल की समानांतर पुनरुक्ति और नैतिक-धार्मिक अर्थ को सुरक्षित रखता है।
- source_word: νόμῳ θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: ‘व्यवस्था’ νόμος का परिचित, गरिमापूर्ण और प्रसंगानुकूल हिन्दी रूप है।
- source_word: ἐντολαῖς ἀνθρώπων
  choice: मनुष्यों की आज्ञाओं
  rationale: θεοῦ और ἀνθρώπων के विरोध को स्पष्ट रखते हुए ἐντολή का सीधा अर्थ व्यक्त करता है।
- source_word: κακίᾳ διαφθειρόμενοι
  choice: दुष्टता से भ्रष्ट होते जाओगे
  rationale: κακία को भ्रष्टता का साधन/कारण मानता है और वर्तमान कृदंत की क्रमिक प्रक्रिया को ‘होते जाओगे’ से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की व्यवस्था और मनुष्यों की आज्ञाओं के बीच विरोध
  choice: ‘ध्यान नहीं दोगे, बल्कि ... ध्यान देकर’
  alternative: ‘परमेश्वर की व्यवस्था पर ध्यान न देकर, मनुष्यों की आज्ञाओं के द्वारा दुष्टता से भ्रष्ट हो जाओगे’
  rationale: यूनानी में दोनों संज्ञाएँ दत्तिव में हैं और ἀλλά स्पष्ट विरोध बनाता है; इसलिए दूसरे खंड में ‘ध्यान देकर’ को निहित मानना व्याकरणतः स्वाभाविक है, जबकि वैकल्पिक साधनवाचक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। मूल यूनानी की दो समानांतर पुनरुक्तियों को उनकी असामान्य किंतु अर्थपूर्ण बलाघात सहित रखा गया है।
