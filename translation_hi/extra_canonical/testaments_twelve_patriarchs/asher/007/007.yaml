source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἀλλ᾽ ἐπισυνάξει ὑμᾶς⁴⁵ ἐν πίστει διὰ τῆς⁴⁶ εὐσπλαγχνίας αὐτοῦ, καὶ⁴⁷ δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/007.yaml
  text: But the Lord will gather you in faith through his compassion, and through Abraham and Isaac and Jacob.
translation:
  language: hi
  text: परन्तु वह अपनी करुणा के द्वारा विश्वास में तुम्हें इकट्ठा करेगा, और अब्राहम, इसहाक और याकूब के द्वारा भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισυνάξει
  choice: इकट्ठा करेगा
  rationale: यह क्रिया बिखरे हुए लोगों को फिर एकत्र करने का भाव रखती है; सरल आधुनिक हिन्दी में ‘इकट्ठा करेगा’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν πίστει
  choice: विश्वास में
  rationale: यूनानी पूर्वसर्ग ἐν की अस्पष्टता को बनाए रखते हुए इसे साधनवाचक ‘विश्वास के द्वारा’ में सीमित नहीं किया गया।
- source_word: διὰ τῆς εὐσπλαγχνίας αὐτοῦ
  choice: अपनी करुणा के द्वारा
  rationale: εὐσπλαγχνία गहरी दया/करुणा को दर्शाता है और διά संबंधकारक के साथ माध्यम अथवा आधार का भाव देता है।
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: अब्राहम, इसहाक और याकूब के द्वारा भी
  rationale: διά की पुनरावृत्ति और καί को स्पष्ट रखते हुए पितृपुरुषों की माध्यमगत भूमिका संबंधी मूल पाठ का तनाव सुरक्षित रखा गया है।
theological_decisions:
- issue: कर्ता की पहचान
  choice: ‘वह’ रखा गया
  alternative: ‘प्रभु’
  rationale: उद्धृत यूनानी वाक्य में कर्ता सर्वनाम के रूप में निहित है; अंग्रेज़ी परामर्श-पाठ का ‘the Lord’ संभवतः प्रसंग से स्पष्ट किया गया है। केवल उपलब्ध यूनानी साक्ष्य के आधार पर ‘प्रभु’ जोड़ने के बजाय संदर्भगत अस्पष्टता सुरक्षित रखी गई।
- issue: पितृपुरुषों के द्वारा एकत्र किया जाना
  choice: ‘के द्वारा भी’ का सीधा अनुवाद
  alternative: ‘अब्राहम, इसहाक और याकूब के कारण/उनसे की गई प्रतिज्ञा के अनुसार’
  rationale: मूल में केवल διά है; किसी विशेष वाचाई या मध्यस्थतावादी व्याख्या को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘परन्तु’ विरोधसूचक ἀλλά को व्यक्त करता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
