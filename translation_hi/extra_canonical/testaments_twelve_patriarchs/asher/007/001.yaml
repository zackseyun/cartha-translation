reference: Testament of Asher 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VII. Μὴ γίνεσθε¹ ὡς Σόδομα², ἥτις ἠγνόησε³ *τοὺς ἀγγέλους⁴ Κυρίου, καὶ ἀπώλετο ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/001.yaml
  text: Do not be like Sodom, which did not recognize the angels of the Lord, and perished forever.
translation:
  language: hi
  text: सदोम के समान मत बनो, जिसने प्रभु के स्वर्गदूतों को नहीं पहचाना और जो सदा के लिए नष्ट हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: मत बनो
  rationale: निषेधात्मक वर्तमान आज्ञार्थक का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: ὡς Σόδομα
  choice: सदोम के समान
  rationale: ὡς की तुलना को स्पष्ट रखते हुए पारंपरिक स्थान-नाम ‘सदोम’ अपनाया गया।
- source_word: ἠγνόησε
  choice: नहीं पहचाना
  rationale: यहाँ क्रिया का अर्थ स्वर्गदूतों की वास्तविक पहचान न कर पाना है; ‘अनजान रहा’ की अपेक्षा प्रसंग में ‘नहीं पहचाना’ अधिक स्पष्ट है।
- source_word: τοὺς ἀγγέλους Κυρίου
  choice: प्रभु के स्वर्गदूतों
  rationale: ἄγγελος के लिए इस प्रसंग में ‘स्वर्गदूत’ सामान्य और अर्थ-स्पष्ट हिन्दी पद है; Κυρίου का संबंध यथावत रखा गया।
- source_word: ἀπώλετο ἕως αἰῶνος
  choice: सदा के लिए नष्ट हो गया
  rationale: विनाश की पूर्ण घटना और ἕως αἰῶνος की स्थायी अवधि दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सदोम का दोष किस रूप में व्यक्त किया जाए
  choice: प्रभु के स्वर्गदूतों को ‘नहीं पहचाना’
  alternative: प्रभु के स्वर्गदूतों की उपेक्षा की
  rationale: मूल ἠγνόησε पहचान अथवा ज्ञान के अभाव को व्यक्त करता है; ‘उपेक्षा’ जानबूझकर तिरस्कार का अतिरिक्त अर्थ जोड़ सकती है।
- issue: ἕως αἰῶνος की अवधि
  choice: सदा के लिए
  alternative: युग तक
  rationale: मुहावरे का अभिप्राय स्थायी विनाश है; शाब्दिक ‘युग तक’ आधुनिक हिन्दी में अस्पष्ट और अप्राकृतिक होगा।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य की चेतावनीपूर्ण शैली तथा सदोम, प्रभु और स्वर्गदूत जैसे पारंपरिक धार्मिक पद सुरक्षित हैं।
