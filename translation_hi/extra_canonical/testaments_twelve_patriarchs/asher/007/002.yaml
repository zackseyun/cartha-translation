review_pass:
  verdict: revise
  source_fidelity: Draft closely follows the Greek future sequence and correctly retains the passive handing-over, desolation of the land, destruction of the holy things, worldwide scattering, and contempt comparison. The final Hindi clause, however, renders εἰς διασπορὰν somewhat awkwardly as “बिखराव में पड़े हुए”; a direct future-state expression better represents the source without adding a specific cause such as exile.
  naturalness: The register is appropriately grave and modern. “तुम बिखराव में पड़े हुए” is not idiomatic modern Hindi in this syntactic setting, and “तुम्हारा देश” can be improved to “तुम्हारी भूमि” for the land sense of γῆ.
  terminology: “पवित्र वस्तुएँ” appropriately preserves the breadth of τὰ ἅγια. “बेकार पानी” is more natural than “अनुपयोगी पानी” while retaining the deliberately unusual source image of useless water.
  issues:
  - severity: medium
    issue: Awkward rendering of εἰς διασπορὰν
    rationale: “बिखराव में पड़े हुए” is grammatically and idiomatically strained. “तुम बिखरे हुए हो जाओगे” naturally conveys the dispersed condition without narrowing it to a later technical sense or asserting exile.
  - severity: low
    issue: γῆ rendered as “देश”
    rationale: “भूमि” more directly expresses the land/territory sense here and avoids the possible modern political-national sense of “देश”.
  revised_text: क्योंकि मैं जानता हूँ कि तुम पाप करोगे और अपने शत्रुओं के हाथों में सौंप दिए जाओगे; तुम्हारी भूमि उजाड़ हो जाएगी, तुम्हारी पवित्र वस्तुएँ नष्ट कर दी जाएँगी, और तुम पृथ्वी के चारों कोनों में तितर-बितर कर दिए जाओगे। तुम बिखरे हुए हो जाओगे और बेकार पानी के समान तुच्छ ठहराए जाओगे।
