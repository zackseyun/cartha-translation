id: T12P.ASH.7.2
reference: Testament of Asher 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ οἶδα⁵ ὅτι ἁμαρτήσετε⁶ καὶ παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν, ⌜καὶ¹⁸ ἡ γῆ ὑμῶν⁹ ἐρημωθήσεται¹⁰, καὶ τὰ ἅγια ὑμῶν καταφθαρήσονται¹¹, καὶ ὑμεῖς¹² διασκορπισθήσεσθε¹³ εἰς τὰς τέσσαρας¹⁴ γωνίας *τῆς γῆς¹⁵, καὶ ἔσεσθε *εἰς διασπορὰν¹⁶ ἐξουδενωμένοι ὡς¹⁷ ὕδωρ¹⁸ ἄχρηστον¹⁹.⌝'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/002.yaml
  text: For I know that you will sin and be handed over into the hands of your enemies, and your land will be made desolate, and your holy things destroyed, and you will be scattered to the four corners of the earth, and you will be in the dispersion, despised like useless water.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि तुम पाप करोगे और अपने शत्रुओं के हाथों में सौंप दिए जाओगे; तुम्हारी भूमि उजाड़ हो जाएगी, तुम्हारी पवित्र वस्तुएँ नष्ट कर दी जाएँगी, और तुम पृथ्वी के चारों कोनों में तितर-बितर कर दिए जाओगे। तुम बिखरे हुए हो जाओगे और बेकार पानी के समान तुच्छ ठहराए जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν
  choice: अपने शत्रुओं के हाथों में सौंप दिए जाओगे
  rationale: यूनानी कर्मवाच्य और ‘हाथों में’ मुहावरे को निकटता से रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: τὰ ἅγια ὑμῶν
  choice: तुम्हारी पवित्र वस्तुएँ
  rationale: बहुवचन संज्ञात्मक विशेषण का व्यापक अर्थ सुरक्षित रखा गया है; इसे विशेष रूप से मंदिर, पवित्र स्थान या पात्र मानकर सीमित नहीं किया गया।
- source_word: εἰς τὰς τέσσαρας γωνίας τῆς γῆς
  choice: पृथ्वी के चारों कोनों में
  rationale: मूल के पारंपरिक भौगोलिक मुहावरे को स्पष्ट और परिचित हिन्दी रूप में रखा गया है।
- source_word: εἰς διασπορὰν
  choice: बिखराव में पड़े हुए
  rationale: διασπορά के निर्वासन अथवा जातीय ‘डायस्पोरा’ संबंधी भाव को साधारण पाठक के लिए समझने योग्य बनाया गया, बिना उसे किसी बाद की तकनीकी संज्ञा तक सीमित किए।
- source_word: ἐξουδενωμένοι ὡς ὕδωρ ἄχρηστον
  choice: अनुपयोगी पानी के समान तुच्छ समझे जाओगे
  rationale: ἐξουδενωμένοι का अपमानित/तुच्छ माने जाने का भाव और ἄχρηστον का ‘किसी काम का नहीं’ अर्थ दोनों सुरक्षित हैं।
theological_decisions:
- issue: ‘पवित्र वस्तुओं’ का संदर्भ
  choice: तुम्हारी पवित्र वस्तुएँ
  alternative: तुम्हारे पवित्र स्थान
  rationale: मूल τὰ ἅγια नपुंसकलिंग बहुवचन है और पवित्र वस्तुओं, पवित्र स्थानों या पवित्र बातों की ओर संकेत कर सकता है; मुख्य पाठ में व्यापक अभिव्यक्ति रखी गई है।
- issue: διασπορά का अर्थ
  choice: बिखराव में पड़े हुए
  alternative: निर्वासन में / प्रवासी समुदाय में
  rationale: मूल में बिखरे होने की दशा प्रमुख है; ‘निर्वासन’ कारण को अधिक निश्चित करता और ‘प्रवासी समुदाय’ बाद की तकनीकी धारणा को आगे लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, भविष्यवाणी-सदृश चेतावनी का स्वर रखा गया है। संयुक्त यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है, जबकि विचारक्रम और कर्मवाच्य संरचना सुरक्षित रखी गई है।
