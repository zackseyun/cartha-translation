review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal connection, future dispersal, and the three-part object of ignorance. However, it treats οἱ ἀδελφοί μου ('my brothers') as a direct address to the audience ('मेरे भाइयो'). In the Greek it is nominative and appositional to Gad and Dan, as reflected by the English audit text; it should identify Gad and Dan as the speaker's brothers.
  naturalness: The draft is generally fluent, but the fronted vocative creates a misleading addressee relationship. The revised wording is natural modern standard Hindi and retains the elevated prophetic register.
  terminology: ‘गाद,’ ‘दान,’ ‘भूमि,’ ‘गोत्र,’ and ‘भाषा’ are suitable. ‘गोत्र’ appropriately renders φυλή in this tribal context. ‘तितर-बितर कर दिए जाओगे’ clearly represents the Greek future passive.
  issues:
  - severity: high
    issue: ‘मेरे भाइयो’ is translated as a vocative addressed to ‘तुम’.
    rationale: The Greek οἱ ἀδελφοί μου is nominative plural, appositional to Γὰδ καὶ Δάν, not vocative. The draft therefore changes who is called the speaker’s brothers.
  revised_text: और इसी कारण तुम मेरे भाई गाद और दान के समान तितर-बितर कर दिए जाओगे, और उनकी भूमि, गोत्र और भाषा को नहीं जानोगे।
  revised_footnotes: []
