id: T12P.ASH.7.6
reference: Testament of Asher 7:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ διὰ τοῦτο³⁹ διασκορπισθήσεσθε⁴⁰ ὡς Γὰδ καὶ⁴¹ Δάν, οἱ ἀδελφοί μου⁴², *καὶ ἀγνοήσετε χώρας αὐτῶν⁴³ καὶ φυλὴν καὶ γλῶσσαν⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/006.yaml
  text: And because of this you will be scattered, like Gad and Dan, my brothers, and you will not know their land, tribe, and language.
translation:
  language: hi
  text: और इसी कारण तुम मेरे भाई गाद और दान के समान तितर-बितर कर दिए जाओगे, और उनकी भूमि, गोत्र और भाषा को नहीं जानोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: ग्रीक कारणसूचक वाक्यांश को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: διασκορπισθήσεσθε
  choice: तितर-बितर हो जाओगे
  rationale: भविष्यकालीन कर्मवाच्य रूप में बिखेर दिए जाने/बिखर जाने का भाव है; हिन्दी में यह मुहावरा निर्वासन या व्यापक बिखराव के अर्थ को सहज रूप से संप्रेषित करता है।
- source_word: ὡς Γὰδ καὶ Δάν
  choice: गाद और दान के समान
  rationale: ὡς की तुलना को बनाए रखते हुए दोनों नामों का प्रचलित हिन्दी लिप्यंतरण दिया गया है।
- source_word: οἱ ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: सम्बोधन समझकर हिन्दी का सम्बोधन-बहुवचन रखा गया है; इसे वाक्य में आरम्भिक सम्बोधन के रूप में रखना स्वाभाविक हिन्दी देता है और ग्रीक के सम्भावित सम्बन्ध को अनावश्यक रूप से केवल गाद और दान से नहीं जोड़ता।
- source_word: ἀγνοήσετε
  choice: नहीं जानोगे
  rationale: मूल क्रिया के सामान्य अर्थ ‘अनजान होना/न जानना’ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: χώρας αὐτῶν καὶ φυλὴν καὶ γλῶσσαν
  choice: उनकी भूमि, गोत्र और भाषा
  rationale: सूची की तीनों संज्ञाओं को क्रम सहित रखा गया है; φυλή के लिए वंश-समुदाय सूचक ‘गोत्र’ इस साहित्यिक-सांस्कृतिक सन्दर्भ में उपयुक्त है।
theological_decisions:
- issue: ‘मेरे भाइयो’ का वाक्यगत सम्बन्ध
  choice: इसे श्रोताओं के प्रत्यक्ष सम्बोधन के रूप में रखा गया है।
  alternative: ‘मेरे भाई गाद और दान के समान’ पढ़ना, जहाँ यह पद गाद और दान का विशेषण हो।
  rationale: ग्रीक में οἱ ἀδελφοί μου का स्थान व्याकरणिक रूप से कुछ तनाव उत्पन्न करता है, पर अंग्रेज़ी परामर्श-पाठ और प्रसंग इसे सम्बोधन समझते हैं। हिन्दी में विराम और पद-स्थान द्वारा यही अर्थ स्पष्ट किया गया है, बिना मूल तुलना बदले।
- issue: ‘उनकी’ का संकेत
  choice: αὐτῶν को ‘उनकी’ के रूप में स्पष्ट संकेत के बिना सुरक्षित रखा गया है।
  alternative: इसे सीधे ‘गाद और दान की’ भूमि आदि कहना।
  rationale: मूल सर्वनाम का सन्दर्भ सम्भवतः गाद और दान है, पर अनुवाद में नामों को दोहराकर अस्पष्टता को कृत्रिम रूप से समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सहज शैली। भविष्यवाणी का स्वर और मूल सूची का क्रम सुरक्षित है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
