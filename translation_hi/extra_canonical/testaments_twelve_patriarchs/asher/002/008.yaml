  terminology: '''व्यभिचार,'' ''यौन अनैतिकता,'' ''उपवास,'' ''आज्ञाओं का पालन,'' and ''दुष्टता'' are appropriate modern-standard Hindi renderings. No doctrinal expansion is introduced.'
  issues:
