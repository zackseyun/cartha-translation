id: T12P.ASH.2.8
reference: Testament of Asher 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος⁴⁸ μοιχεύει *καὶ πορνεύει⁴⁹ καὶ ἀπέχεται ἐδεσμάτων⁵⁰. καὶ⁵¹ νηστεύων κακοποιεῖ, καὶ τῇ³⁵ δυναστείᾳ *τοῦ πλούτου⁵² πολλοὺς κατασύρει⁵³, καὶ ἐκ⁵⁴ τῆς ὑπερόγκου⁵⁵ κακίας ποιεῖ⁵⁶ ⌈τὰς⌉⁵⁷ ἐντολάς⁵⁸. τοῦτο διπρόσωπόν ἐστιν⁵⁹, *τὸ δὲ ὅλον⁶⁰ κακόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/008.yaml
  text: Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the power of wealth he drags many down, and out of excessive wickedness keeps the commandments. This is double-faced, but it is altogether evil.
translation:
  language: hi
  text: कोई दूसरा व्यक्ति व्यभिचार करता है और यौन अनैतिकता में लिप्त होता है, और कुछ खाद्य पदार्थों से परहेज़ करता है। वह उपवास करते हुए भी बुराई करता है, और धन की शक्ति से बहुतों को नीचे खींच ले जाता है, और अत्यधिक दुष्टता के कारण आज्ञाओं का पालन करता है। यह दोहरे चेहरे वाला है, पर पूरी तरह बुरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεύει καὶ πορνεύει
  choice: व्यभिचार और यौन-अनैतिकता करता है
  rationale: μοιχεύει के वैवाहिक बेवफाई-संबंधी विशिष्ट अर्थ और πορνεύει के व्यापक अवैध यौन आचरण, दोनों को अलग बनाए रखता है।
- source_word: ἀπέχεται ἐδεσμάτων
  choice: कुछ खाद्य पदार्थों से परहेज़ करता है
  rationale: ἀπέχεται का संयम/त्याग और ἐδεσμάτων का खाद्य पदार्थों का अर्थ सहज आधुनिक हिन्दी में व्यक्त होता है; प्रसंग किसी विशेष भोजन को नहीं बताता।
- source_word: τῇ δυναστείᾳ τοῦ πλούτου
  choice: धन की शक्ति से
  rationale: धन से प्राप्त प्रभुत्व या सामर्थ्य को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πολλοὺς κατασύρει
  choice: बहुतों को नीचे गिराता है
  rationale: κατασύρει में नीचे खींचने और दूसरों के पतन का कारण बनने की सशक्त छवि सुरक्षित रहती है।
- source_word: ποιεῖ τὰς ἐντολάς
  choice: आज्ञाओं का पालन करता है
  rationale: शाब्दिक ‘आज्ञाओं को करता है’ की अपेक्षा हिन्दी का स्वाभाविक धार्मिक मुहावरा है, जबकि बाहरी आज्ञापालन और भीतर की दुष्टता का तनाव बना रहता है।
- source_word: διπρόσωπόν
  choice: दोहरे चेहरे वाला
  rationale: ‘दो-मुँहा’ सम्भव है, पर यह चयन मूल के दोहरे रूप/चरित्र की छवि को गरिमापूर्ण हिन्दी में अधिक निकटता से रखता है।
- source_word: τὸ δὲ ὅλον κακόν
  choice: पर पूरी तरह बुरा है
  rationale: समग्र नैतिक मूल्यांकन को स्वाभाविक हिन्दी में देता है, बिना किसी एक कर्म तक सीमित किए।
theological_decisions:
- issue: दुष्टता के कारण आज्ञाओं का पालन करने का विरोधाभास
  choice: ‘अत्यधिक दुष्टता के कारण आज्ञाओं का पालन करता है’ को यथावत रखा
  alternative: इसे ‘दुष्टता के बावजूद आज्ञाओं का पालन करता है’ या ‘दिखावे के लिए’ कहना
  rationale: ग्रीक ἐκ कारण/स्रोत का संकेत देता है। वाक्य जानबूझकर नैतिक तनाव उत्पन्न करता है; उसे सहज बनाने के लिए ‘बावजूद’ या कोई अनकहा उद्देश्य जोड़ना मूल की कठिनाई को मिटा देता।
- issue: उपवास और खाद्य-संयम का नैतिक मूल्य
  choice: इन्हें बाहरी धार्मिक आचरण के रूप में बिना अतिरिक्त व्याख्या रखा
  alternative: इन प्रथाओं को अपने-आप पाखंड या पुण्य घोषित करना
  rationale: पाठ का निर्णय व्यक्ति के मिले-जुले आचरण और समग्र बुराई पर है; उपवास अथवा भोजन-संयम के विषय में अलग सिद्धान्त स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण। वाक्य की पुनरावृत्ति तथा नैतिक विरोधाभास को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
