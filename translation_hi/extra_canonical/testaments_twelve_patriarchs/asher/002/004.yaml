id: T12P.ASH.2.4
reference: Testament of Asher 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: †Καίγε ἀγάπη οὖσα, ἐν πονηρίᾳ ἐστὶν ὁ συγκρύπτων²⁰ τὸ κακὸν ὑπὲρ τὸ ὄνομα τὸ καλόν·† τὸ δὲ τέλος τῆς πράξεως ἔρχεται εἰς κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/004.yaml
  text: Even if they are in love, they are in wickedness, hiding evil under a good name; but the end of the deed comes to evil.
translation:
  language: hi
  text: प्रेम होने पर भी, जो व्यक्ति अच्छे नाम की आड़ में बुराई छिपाता है, वह दुष्टता में है; पर उसके कार्य का अंत बुराई में परिणत होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη οὖσα
  choice: प्रेम होने पर भी
  rationale: पाठ की असामान्य और संभवतः विकृत यूनानी रचना को अत्यधिक स्पष्ट किए बिना अंग्रेज़ी परामर्श-पाठ के concessive अर्थ को रखा गया है।
- source_word: ὁ συγκρύπτων τὸ κακὸν
  choice: वह व्यक्ति ... जो ... बुराई छिपाता है
  rationale: संज्ञात्मक वर्तमान कृदंत को स्वाभाविक हिन्दी संबंधवाचक वाक्य में व्यक्त किया गया है; निरंतर/चरित्रगत कर्म का भाव बना रहता है।
- source_word: ὑπὲρ τὸ ὄνομα τὸ καλόν
  choice: भले नाम की आड़ में
  rationale: शाब्दिक स्थान-संबंध के बजाय मुहावरेदार हिन्दी चुनी गई है, जिसका आशय बुराई को अच्छे नाम के नीचे ढकना है।
- source_word: τὸ τέλος τῆς πράξεως
  choice: उस काम का अंत
  rationale: πρᾶξις को सामान्य पाठक के लिए सहज ‘काम’ कहा गया है और लेख-सूचकता को ‘उस’ से जोड़ा गया है।
- source_word: ἔρχεται εἰς κακόν
  choice: बुराई में होता है
  rationale: यूनानी के ‘बुराई की ओर/में आता है’ को स्वाभाविक हिन्दी में रखा गया है, बिना ‘विनाश’ जैसे अधिक विशिष्ट परिणाम को आयात किए।
theological_decisions:
- issue: प्रेम और दुष्टता का तनाव
  choice: प्रेम होने पर भी ... दुष्टता में है
  alternative: जो प्रेम का दिखावा करता है, वह दुष्ट है
  rationale: मूल पाठ प्रेम को केवल दिखावा नहीं कहता; इसलिए प्रेम की वास्तविकता और दुष्ट कर्म के बीच असहज तनाव सुरक्षित रखा गया है।
- issue: अंतिम परिणाम की प्रकृति
  choice: उस काम का अंत बुराई में होता है
  alternative: उस काम का परिणाम विनाश होता है
  rationale: κακόν का व्यापक अर्थ ‘बुराई’ रखा गया है; इसे दंड, विनाश या किसी खास धर्मवैज्ञानिक परिणाम तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। मूल यूनानी पंक्ति के संपादकीय क्रूक्स और व्याकरणिक असामान्यता के कारण वाक्य को पूर्णतः पुनर्व्याख्यायित नहीं किया गया; ‘वह व्यक्ति’ जोड़कर हिन्दी में कर्ता स्पष्ट किया गया है।
