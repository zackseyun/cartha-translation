base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/002.yaml
  text: There is a man who does not pity his servants; and though this is double-faced, the whole of it is evil.
translation:
  language: hi
  text: एक मनुष्य ऐसा है जो अपने सेवकों पर दया नहीं करता; और यद्यपि यह दोमुंहा है, फिर भी यह सब बुरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ οἰκτείρει
  choice: दया नहीं करता
  rationale: यह यूनानी क्रिया करुणा या दया दिखाने के अर्थ में है; आधुनिक हिन्दी में यह सहज और सटीक है।
- source_word: λειτουργοὺς αὐτοῦ
  choice: अपने सेवकों
  rationale: λειτουργούς यहाँ सेवा करने वालों को दर्शाता है और αὐτοῦ उनका संबंध उस मनुष्य से बताता है; ‘अपने सेवकों’ से यह संबंध स्वाभाविक हिन्दी में स्पष्ट होता है, बिना अतिरिक्त बल दिए।
- source_word: διπρόσωπον
  choice: दोहरे मुख वाला
  rationale: शाब्दिक चित्र ‘दो मुख वाला’ है और संदर्भ में किसी कर्म या आचरण के दोहरे चरित्र को व्यक्त करता है; इस रूपक को व्याख्यात्मक रूप से हल करने के बजाय सुरक्षित रखा गया है।
- source_word: τὸ ὅλον πονηρόν
  choice: पूरी तरह बुरा
  rationale: वाक्यांश समूचे आचरण के बुरा होने पर बल देता है; यह हिन्दी अभिव्यक्ति अर्थ को स्वाभाविक ढंग से संप्रेषित करती है।
theological_decisions:
- issue: दोहरे चरित्र और समग्र बुराई के बीच तनाव
  choice: ‘यद्यपि ... फिर भी’ के द्वारा दोनों कथनों को साथ रखा गया
  alternative: ‘इसके दो पहलू हैं, पर कुल मिलाकर यह बुरा है’
  rationale: मूल पाठ किसी अच्छे पहलू को स्पष्ट नहीं करता और ‘समग्र’ को केवल ‘कुल मिलाकर’ कहना उसकी तीव्रता घटा सकता है; इसलिए मूल का तनाव और अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दोहरे मुख वाला’ जानबूझकर रूपकात्मक है, क्योंकि मूल यूनानी भी असामान्य और कुछ हद तक अस्पष्ट अभिव्यक्ति रखता है।
