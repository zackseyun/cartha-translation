reference: Testament of Asher 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: II. *Ἔστιν οὖν¹ ἡ² ψυχὴ *ἐν λόγοις †ἀφιστῶσα³ τὸ καλὸν ὑπὲρ *τοῦ κακοῦ⁴, καὶ *τὸ τέλος⁵ *τοῦ πράγματος⁶ εἰς κακίαν †ἄγων⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/001.yaml
  text: There is, then, a soul that in words turns away from the good for the sake of evil, and leads the outcome of the matter into wickedness.
translation:
  language: hi
  text: तो एक ऐसी आत्मा है जो बातों में बुराई के लिए भलाई से दूर हो जाती है और मामले के परिणाम को दुष्टता की ओर ले जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχὴ
  choice: प्राण
  rationale: यहाँ ψυχή व्यक्ति के भीतरी नैतिक जीवन या प्राण को दर्शाता है; ‘प्राण’ मूल रूपक को बनाए रखता है और इसे केवल ‘व्यक्ति’ बनाकर स्पष्ट नहीं करता।
- source_word: ἐν λόγοις
  choice: बातों में
  rationale: λόγοις का बहुवचन और वचन/कथन का क्षेत्र सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἀφιστῶσα τὸ καλὸν
  choice: भलाई से दूर हो जाता है
  rationale: ἀφίστημι को अकर्मक अर्थ में ग्रहण किया गया है—भलाई को हटाना नहीं, उससे दूर होना—जैसा कि यूनानी पाठ और संशोधित परामर्श-पाठ सुझाते हैं।
- source_word: ὑπὲρ τοῦ κακοῦ
  choice: बुराई के लिए
  rationale: ὑπέρ यहाँ बुराई के पक्ष, हित या खातिर की दिशा बताता है; ‘के लिए’ इस संभावित विस्तार को खुला रखता है।
- source_word: τὸ τέλος τοῦ πράγματος
  choice: उस कार्य का परिणाम
  rationale: τέλος यहाँ अंतिम नतीजा और πρᾶγμα संबंधित कार्य/मामला है; हिन्दी में ‘परिणाम’ स्वाभाविक है, जबकि ‘कार्य’ ठोस संदर्भ बनाए रखता है।
- source_word: εἰς κακίαν ἄγων
  choice: दुष्टता की ओर ले जाता है
  rationale: εἰς के दिशात्मक भाव और ἄγω के ‘ले जाना’ अर्थ को सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: ψυχή का आशय
  choice: प्राण
  alternative: मनुष्य / आत्मा
  rationale: ‘मनुष्य’ मूल के आत्मिक-नैतिक रूपक को समतल कर देता, जबकि ‘आत्मा’ हिन्दी में विशिष्ट तात्त्विक अर्थ ग्रहण कर सकता है। ‘प्राण’ पर्याप्त रूप से व्यापक और गरिमामय है।
- issue: ἀφιστῶσα की वाच्यता और संबंध
  choice: भलाई से दूर हो जाता है
  alternative: भलाई को दूर कर देता है
  rationale: पाठगत कठिनाई को देखते हुए संशोधित यूनानी समझ के अनुरूप अकर्मक पाठ चुना गया है; इससे कोई अतिरिक्त धार्मिक निष्कर्ष आरोपित नहीं होता।
- issue: मिश्रित लिंग वाले कृदंतों का अनुवाद
  choice: दोनों क्रियाओं का कर्ता ‘प्राण’ रखा गया
  alternative: दूसरी क्रिया के लिए अलग निहित कर्ता मानना
  rationale: ἀφιστῶσα स्त्रीलिंग और ἄγων पुल्लिंग होने की पाठगत असंगति के बावजूद वाक्य का सामान्य अर्थ एक ही ψυχή को दोनों क्रियाओं का कर्ता समझता है; हिन्दी में अस्पष्ट या कृत्रिम कर्ता जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमामय और स्रोत-सन्निकट शैली अपनाई गई है। ‘इसलिए एक ऐसा प्राण है’ यूनानी Ἔστιν οὖν की अस्तित्ववाचक संरचना को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
