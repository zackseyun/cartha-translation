reference: Testament of Asher 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὁ πλεονεκτῶν³³ τὸν³⁴ πλησίον²⁸ πτωχούς, παροργίζει τὸν Θεόν, καὶ³⁵ τὸν ὕψιστον³⁶ ἐπιορκεῖ καὶ τὸν πτωχὸν³⁷ ἐλεεῖ³⁸. τὸν ἐντολέα³⁹ *τοῦ νόμου⁴⁰ Κύριον⁴¹ ἀθετεῖ⁴² καὶ παροξύνει, καὶ τὸν πένητα ἀναπαύει.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/006.yaml
  text: The one who defrauds his neighbor provokes God, swears falsely by the Most High, sets aside and provokes the Lord, the giver of the law, and gives rest to the poor.
translation:
  language: hi
  text: जो अपने पड़ोसी[a] को ठगता है, वह परमेश्वर को क्रोधित करता है, परमप्रधान के नाम पर झूठी शपथ खाता है, और निर्धन पर दया करता है। वह व्यवस्था देनेवाले प्रभु को अस्वीकार करता और उन्हें क्रोधित करता है, और दरिद्र को विश्राम देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ में ‘पड़ोसी’ के बाद ‘निर्धनों’ (πτωχούς) भी आया है, पर वाक्य में उसका संबंध व्याकरण की दृष्टि से अस्पष्ट है।
    reason: प्राप्त यूनानी पाठ में एक असंगत बहुवचन कर्मपद है; उसे चुपचाप अर्थ में मिलाने के बजाय पाठगत अस्पष्टता दर्ज की गई है।
lexical_decisions:
- source_word: πλεονεκτῶν
  choice: ठगता है
  rationale: यह क्रिया लोभवश किसी का अनुचित लाभ उठाने या उससे छल करने को व्यक्त करती है; इस प्रसंग में ‘ठगता है’ सहज और सटीक है।
- source_word: ἐπιορκεῖ
  choice: झूठी शपथ खाता है
  rationale: क्रिया झूठी शपथ खाने या शपथ तोड़ने का भाव देती है; τὸν ὕψιστον के साथ आशय परमप्रधान के नाम पर झूठी शपथ खाना है।
- source_word: ἐλεεῖ
  choice: दया करता है
  rationale: मूल क्रिया का सीधा अर्थ दया या करुणा दिखाना है; इसे छोड़ा नहीं गया, क्योंकि पद में बुरे और अच्छे कर्म का जानबूझकर तनाव दिखाई देता है।
- source_word: ἀθετεῖ
  choice: अस्वीकार करता है
  rationale: यहाँ अर्थ किसी को नकारना, तुच्छ जानना या उसकी सत्ता को रद्द करना है; ‘अस्वीकार करता है’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀναπαύει
  choice: विश्राम देता है
  rationale: मूल के ‘आराम/राहत पहुँचाने’ के बिंब को बनाए रखने के लिए अपेक्षाकृत औपचारिक समानता रखी गई है।
theological_decisions:
- issue: एक ही व्यक्ति द्वारा निर्धन पर दया करने और प्रभु का विरोध करने का तनाव
  choice: दोनों कथनों को बिना सामंजस्य बैठाए ज्यों का त्यों रखा गया
  alternative: ‘फिर भी’ जोड़कर विरोध को स्पष्ट करना या दया वाले खंड को छोड़ देना
  rationale: यूनानी पाठ में दोनों कथन स्पष्ट रूप से उपस्थित हैं और इस रचना के दोहरे आचरण के विषय के अनुरूप वास्तविक नैतिक तनाव रखते हैं।
- issue: τοῦ νόμου Κύριον की व्याख्या
  choice: ‘व्यवस्था की आज्ञा देनेवाले प्रभु’
  alternative: ‘व्यवस्था के प्रभु’ या ‘व्यवस्था देनेवाले प्रभु’
  rationale: ἐντολέα का अर्थ आज्ञा देनेवाला है; अनुवाद प्रभु को व्यवस्था का आदेशदाता बताता है, बिना अतिरिक्त धार्मिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमप्रधान’, ‘व्यवस्था’ और ‘प्रभु’ जैसे स्थापित धार्मिक पद बनाए गए हैं। यूनानी के समानांतर खंडों तथा अच्छे-बुरे कर्मों के असुविधाजनक मेल को सरल बनाकर हटाया नहीं गया है।
