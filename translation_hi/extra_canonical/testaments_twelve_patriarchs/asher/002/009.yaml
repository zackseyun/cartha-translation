  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/009.yaml
  text: Such people are like hares, because they are half clean, but in truth they are unclean.
translation:
  language: hi
  text: ऐसे लोग खरहे हैं, क्योंकि वे आधे शुद्ध हैं, किंतु सत्य तो यह है कि वे अशुद्ध हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δασύποδες
  choice: खरहे
  rationale: यूनानी शब्द का शाब्दिक अर्थ ‘रोएँदार पाँव वाले’ है और यह सामान्यतः खरहे (hares) के लिए प्रयुक्त होता है। ‘खरहा’ आधुनिक हिन्दी में इस जीव का सटीक नाम है और खरगोश से उसका भेद बनाए रखता है।
- source_word: ἐξ ἡμισείας ... καθαροί
  choice: आधे तो शुद्ध
  rationale: मूल के ‘आधे/आंशिक रूप से शुद्ध’ भाव को सरल हिन्दी में रखता है और बाहरी आंशिक शुद्धता तथा वास्तविक अशुद्धता के विरोध को स्पष्ट करता है।
- source_word: τὸ δ᾽ ἀληθὲς ἀκάθαρτοί εἰσι
  choice: पर वास्तव में अशुद्ध हैं
  rationale: ἀληθές यहाँ वास्तविक स्थिति को सूचित करता है; ‘वास्तव में’ स्वाभाविक हिन्दी में उसी विरोध को व्यक्त करता है।
theological_decisions:
- issue: आंशिक शुद्धता और वास्तविक अशुद्धता का तनाव
  choice: ‘आधे तो शुद्ध हैं, पर वास्तव में अशुद्ध हैं’ के रूप में तनाव को यथावत रखा गया है।
  alternative: इसे नैतिक पाखंड या व्यवस्था-विषयक अशुद्धता की स्पष्ट व्याख्या में बदलना।
  rationale: मूल पाठ स्वयं अनुप्रयोग को विस्तार से नहीं समझाता; इसलिए किसी विशेष धार्मिक व्याख्या को जोड़ने के बजाय उसकी जानबूझकर रखी गई विरोधाभासी भाषा सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘खरहे’ अपेक्षाकृत सटीक प्राणी-संज्ञा है; वाक्यरचना साधारण पाठक के लिए सहज है।
