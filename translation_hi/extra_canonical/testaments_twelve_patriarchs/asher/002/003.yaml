source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν ἄνθρωπος ἀγαπῶν πονηρευόμενον †ὃ ἐστι πονηρία†¹³, ὅτι καὶ ἀποθανεῖν αἱρεῖται ἐν κακῷ· καὶ περὶ τούτου φανερόν ἐστι †τὸ ὅλον†¹⁴ διπρόσωπόν ἐστι τὸ δὲ πᾶν κακὴ πρᾶξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/003.yaml
  text: And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man's account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.
translation:
  language: hi
  text: एक मनुष्य ऐसा भी है जो बुराई करनेवाले से प्रेम करता है—और यह बुराई है[a]—क्योंकि वह मनुष्य बुराई में मरना भी चुनता है। इसके विषय में स्पष्ट है कि यह बात दोहरे चेहरे वाली है[b]; पर यह सब एक बुरा कर्म है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ संदिग्ध है; शाब्दिक रूप से, “जो बुराई है।” इसका संकेत बुराई करनेवाले से प्रेम करने की ओर हो सकता है।
    reason: संपादित यूनानी में †ὃ ἐστι πονηρία† को पाठगत रूप से संदिग्ध चिह्नित किया गया है।
  - marker: b
    text: “दोहरे चेहरे वाली” के निकट यूनानी शब्द संदिग्ध हैं। इसका अर्थ यह भी हो सकता है कि पूरी बात दोहरे स्वरूप की है।
    reason: †τὸ ὅλον† पाठगत रूप से संदिग्ध है और वाक्य के व्याकरणिक विषय की पहचान को प्रभावित करता है।
lexical_decisions:
- source_word: πονηρευόμενον
  choice: बुराई करनेवाले
  rationale: वर्तमान कृदंत के सक्रिय और निरंतर भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀποθανεῖν αἱρεῖται ἐν κακῷ
  choice: बुराई में मरना तक चुनता है
  rationale: ‘चुनता है’ ऐच्छिक निर्णय को और ‘तक’ यूनानी καί के बलाघात को व्यक्त करता है; ‘बुराई में’ मूल अभिव्यक्ति की नैतिक अस्पष्टता बनाए रखता है।
- source_word: διπρόσωπον
  choice: दो चेहरे वाला
  rationale: ‘दो-मुँहा’ की अपेक्षा अधिक गरिमापूर्ण रहते हुए मूल के ‘दो चेहरों’ वाले रूपक को सुरक्षित रखता है।
- source_word: κακὴ πρᾶξις
  choice: बुरा कर्म
  rationale: πρᾶξις को किसी सामान्य स्थिति के बजाय किए गए कार्य के रूप में व्यक्त करता है।
theological_decisions:
- issue: बुराई करनेवाले से प्रेम करने के नैतिक मूल्यांकन का संदर्भ
  choice: ‘यह स्वयं बुराई है’ को उसी प्रेम की ओर संकेत करने दिया गया है
  alternative: इसे बुराई करनेवाले व्यक्ति अथवा उसके आचरण का वर्णन मानना
  rationale: निकटस्थ नपुंसकलिंग संबंधवाचक पद पूरे पूर्ववर्ती विचार की ओर संकेत कर सकता है, पर पाठ संदिग्ध है; इसलिए टिप्पणी में अनिश्चितता बताई गई है।
- issue: मरने को चुननेवाले व्यक्ति का संकेत
  choice: सिर्फ ‘वह भी’ रखा गया है
  alternative: ‘वह मनुष्य स्वयं’ या ‘उस मनुष्य के लिए’
  rationale: यूनानी में कर्ता अंतर्निहित है और ‘उसके लिए’ के समान स्पष्ट पद नहीं है; अतः अंग्रेज़ी परामर्श-पाठ की व्याख्यात्मक स्पष्टता को मूल पाठ में नहीं जोड़ा गया।
- issue: ‘दो चेहरे वाला’ किसे कहा गया है
  choice: मुख्य पाठ में आरंभिक मनुष्य को इसका संदर्भ माना गया है
  alternative: ‘समूची बात दोहरे स्वरूप की है’
  rationale: संदर्भ व्यक्ति की दोहरी नैतिक प्रवृत्ति पर केंद्रित है, किंतु संदिग्ध τὸ ὅλον के कारण वैकल्पिक व्याकरणिक समझ फुटनोट में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘बुराई’, ‘कर्म’ और ‘दो चेहरे वाला’ जैसे पद नैतिक तनाव और मूल रूपक को बनाए रखते हैं। दोनों पाठगत कठिनाइयों के लिए मुख्य पाठ में [a] और [b] अंकित हैं।
