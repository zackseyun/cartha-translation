base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/005.yaml
  text: Another steals, acts unjustly, plunders, is greedy, and shows mercy to the poor. This too is double-faced, but the whole of it is evil.
translation:
  language: hi
  text: एक और व्यक्ति चोरी करता है, अन्याय करता है, लूटता है, लालच करता है और गरीबों पर दया करता है। यह भी दोमुंहा है, पर समूचा ही बुरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλος
  choice: दूसरा व्यक्ति
  rationale: यह पिछले संदर्भ में एक अन्य प्रकार के व्यक्ति को इंगित करता है; केवल ‘दूसरा’ की अपेक्षा हिन्दी में ‘दूसरा व्यक्ति’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: ἁρπάζει
  choice: लूटता है
  rationale: क्रिया बलपूर्वक छीनने या लूटने का भाव रखती है और ‘चोरी करता है’ से अलग अर्थ बनाए रखती है।
- source_word: πλεονεκτεῖ
  choice: लोभ करता है
  rationale: यह दूसरों का लाभ उठाकर अधिक पाने की लालसा का संकेत दे सकता है; ‘लोभ करता है’ संक्षिप्त रूप से उस नैतिक दोष को व्यक्त करता है, यद्यपि अर्थ में शोषण का भाव भी संभव है।
- source_word: ἐλεεῖ πτωχούς
  choice: गरीबों पर दया करता है
  rationale: यूनानी पद का सीधा और स्वाभाविक हिन्दी रूप, जिसमें दया दिखाने का कार्य बना रहता है।
- source_word: διπρόσωπον
  choice: दोहरे चेहरे वाला
  rationale: शाब्दिक रूपक को सुरक्षित रखता है और व्यक्ति के परस्पर-विरोधी आचरण को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: τὸ δὲ ὅλον πονηρόν ἐστιν
  choice: पर कुल मिलाकर बुरा है
  rationale: ‘समग्र रूप से’ के निर्णय को सहज आधुनिक हिन्दी में व्यक्त करता है; दया के एक अच्छे दिखने वाले कर्म के बावजूद पूरे आचरण पर नकारात्मक निर्णय सुरक्षित रहता है।
theological_decisions:
- issue: दया के कर्म और समग्र नैतिक चरित्र के बीच तनाव
  choice: संयोजक ‘और’ रखा गया; ‘फिर भी’ नहीं जोड़ा गया
  alternative: ‘फिर भी गरीबों पर दया करता है’
  rationale: यूनानी καὶ केवल संयोजन करता है। विरोध का भाव व्यापक वाक्य से उभरता है, इसलिए अनूदित पाठ में अतिरिक्त विरोधसूचक बल नहीं जोड़ा गया।
- issue: ‘पूरा’ किसे बुरा कहा गया है
  choice: ‘कुल मिलाकर बुरा है’
  alternative: ‘उसका पूरा आचरण बुरा है’
  rationale: τὸ ὅλον में संदर्भगत अस्पष्टता है—यह पूरे मिश्रित आचरण या व्यक्ति की समग्र दशा की ओर संकेत कर सकता है। स्पष्ट संज्ञा जोड़ने के बजाय अनुवाद उस व्यापकता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण है। समानांतर क्रियाओं की लय और यूनानी मूल का नैतिक तनाव बनाए रखा गया है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
