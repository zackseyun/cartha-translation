  text: For God also, in the tablets of the commandments, has declared it so.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने भी आज्ञाओं की पटियाओं पर ऐसा ही कहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: क्योंकि ... भी
  rationale: यह संयोजन पिछले कथन का आधार प्रस्तुत करता है और साथ ही परमेश्वर के कथन को अतिरिक्त समर्थन के रूप में जोड़ता है।
- source_word: ὁ Θεὸς
  choice: परमेश्वर
  rationale: ईश्वर के लिए स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी पद।
- source_word: ἐν ταῖς πλαξὶ τῶν ἐντολῶν
  choice: आज्ञाओं की पटियाओं में
  rationale: बहुवचन πλαξὶ को ‘पटियाओं’ और संबंधसूचक τῶν ἐντολῶν को ‘आज्ञाओं की’ से निकटता से व्यक्त किया गया है।
- source_word: οὕτως εἶπεν
  choice: ऐसा ही कहा है
  rationale: οὕτως का संकेतात्मक अर्थ ‘ऐसा ही’ बनाए रखते हुए यूनानी एओरिस्ट को हिन्दी के स्वाभाविक उद्धरण-संदर्भ में पूर्ण वर्तमान से व्यक्त किया गया है।
theological_decisions:
- issue: पटियाओं पर कथन का अभिकर्ता
  choice: परमेश्वर ने ... कहा है
  alternative: परमेश्वर ने ... घोषित किया है
  rationale: εἶπεν का सीधा अर्थ ‘कहा’ है; ‘घोषित किया’ अनावश्यक रूप से अधिक औपचारिक और व्याख्यात्मक होता।
- issue: ‘आज्ञाओं की पटियाएँ’ का संदर्भ
  choice: सामान्य संकेत को यथावत रखा
  alternative: मूसा की व्यवस्था की पटियाएँ / दस आज्ञाओं की पटियाएँ
  rationale: मूल पाठ न तो मूसा का नाम लेता है, न आज्ञाओं की संख्या बताता है; इसलिए इन बातों को पाठ में नहीं जोड़ा गया।
