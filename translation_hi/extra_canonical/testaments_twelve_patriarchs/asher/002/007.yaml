id: T12P.ASH.2.7
reference: Testament of Asher 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Τὴν⁴³ ψυχὴν σπιλοῖ, καὶ⌉ τὸ σῶμα λαμπρύνει⁴⁴, πολλοὺς ἀναιρεῖ καὶ ὀλίγους ἐλεεῖ, καὶ τοῦτο⁴⁵ διπρόσωπόν⁴⁶ ἐστι, *τὸ δὲ ὅλον πονηρόν ἐστιν⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/007.yaml
  text: It stains the soul and makes the body bright; it kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.
translation:
  language: hi
  text: यह आत्मा को कलंकित करता है और शरीर को चमकाता है; यह बहुतों को मार डालता है और थोड़े ही लोगों पर दया करता है। यह भी दो-मुँहा है, पर समूचे रूप में बुरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπιλοῖ
  choice: कलंकित करता है
  rationale: यह क्रिया दाग लगाने या अशुद्ध करने का भाव रखती है; ‘कलंकित’ आत्मा के नैतिक दूषण को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: λαμπρύνει
  choice: चमकाता है
  rationale: यूनानी शब्द का मूल अर्थ उज्ज्वल या दीप्तिमान बनाना है। इसे सीधे रखा गया है ताकि आत्मा के कलंक और शरीर की बाहरी चमक के बीच का विरोध बना रहे।
- source_word: ἀναιρεῖ
  choice: मार डालता है
  rationale: इस प्रसंग में शब्द जीवन लेने या नष्ट करने का अर्थ देता है; ‘मार डालता है’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: ἐλεεῖ
  choice: दया करता है
  rationale: यह यूनानी क्रिया दया या करुणा दिखाने को व्यक्त करती है; ‘दया करता है’ इसका सीधा और स्वाभाविक रूप है।
- source_word: διπρόσωπον
  choice: दो-मुँहा
  rationale: शाब्दिक भाव ‘दो चेहरों वाला’ है और यहाँ नैतिक दोहरेपन का संकेत है; ‘दो-मुँहा’ उस रूपक को संक्षिप्त और समझने योग्य ढंग से बनाए रखता है।
- source_word: τὸ ὅλον πονηρόν
  choice: समूचे रूप में बुरा
  rationale: यह अनुवाद पूरे विषय को बुरा ठहराने वाले यूनानी कथन को बनाए रखता है, बिना उसे केवल ‘कुल मिलाकर’ अर्थात मिश्रित मूल्यांकन जैसा नरम किए।
theological_decisions:
- issue: नपुंसकलिंग विषय का संदर्भ
  choice: ‘यह’ का प्रयोग
  alternative: ‘वह’ या पुल्लिंग ‘वह व्यक्ति’
  rationale: यूनानी में विषय नपुंसकलिंग है और प्रसंग में किसी वस्तु, प्रवृत्ति या आचरण की ओर संकेत करता है। ‘यह’ संदर्भ की अनिश्चितता को बनाए रखता है और अनावश्यक व्यक्तिकरण से बचता है।
- issue: बाहरी शारीरिक चमक और भीतरी नैतिक दूषण का तनाव
  choice: दोनों कथनों को सीधे विरोध में रखा गया
  alternative: ‘शरीर को सुंदर दिखाता है’ जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: मूल पाठ आत्मा को कलंकित करने और शरीर को चमकाने का तीखा विरोध प्रस्तुत करता है। सीधे अनुवाद से यह नैतिक तनाव बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। समानांतर वाक्य-विन्यास और मूल पाठ के तीखे नैतिक विरोध को सुरक्षित रखा गया है।
