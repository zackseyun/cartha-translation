  text: '1 There is, then, a soul that in its words turns away the good for the sake of evil, and leads the outcome of the matter into wickedness.


    2 There is a man who does not pity his own servants; and though this is double-faced, the whole of it is evil.


    3 And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man''s account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.


    4 Even if they are in love, they are in wickedness when they hide evil under a good name; but the end of the deed comes to evil.


    5 Another steals, acts unjustly, plunders, is greedy, and yet shows mercy to the poor. This too is double-faced, but the whole of it is evil.


    6 The one who defrauds his neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, the giver of the law, yet gives rest to the poor.


    7 He stains the soul and makes the body bright; he kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.


    8 Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the force of his wealth he drags many down, and out of his excessive wickedness performs the commandments. This is double-faced, but the whole of it is evil.


    9 Such people are like hares, because they are half clean, but in truth they are unclean.


    10 For God also, in the tablets of the commandments, has declared it so.'
translation:
  language: hi
  text: 'आशेर का वसीयतनामा 2


    1 इसलिए ऐसी आत्मा होती है जो अपनी बातों में बुराई के लिए भलाई को ठुकरा देती है और उस बात के परिणाम को दुष्टता की ओर ले जाती है।


    2 ऐसा मनुष्य भी होता है जो अपने सेवकों पर दया नहीं करता। यह दोहरा आचरण है, पर कुल मिलाकर बुरा ही है।


    3 ऐसा मनुष्य भी होता है जो बुराई करनेवाले से प्रेम करता है[a], क्योंकि वह भी बुराई में मरना चुनता है। उसके विषय में यह स्पष्ट है कि उसका आचरण दोहरा है, पर कुल मिलाकर वह बुरा काम ही है।


    4 प्रेम होते हुए भी, जो बुराई को भले नाम की आड़ में छिपाता है, वह दुष्टता में है[b]; ऐसे काम का अंत बुराई में होता है।


    5 कोई दूसरा चोरी करता, अन्याय करता, लूटता और लालच करता है, फिर भी गरीबों पर दया करता है। यह भी दोहरा आचरण है, पर कुल मिलाकर बुरा ही है।


    6 जो अपने पड़ोसी का अनुचित लाभ उठाता है, वह परमेश्वर को क्रोधित करता, परमप्रधान की झूठी शपथ खाता और गरीब पर दया करता है। वह व्यवस्था की आज्ञा देनेवाले प्रभु को ठुकराता और क्रोधित करता है, फिर भी निर्धन को राहत देता है[c]।


    7 वह आत्मा को कलंकित करता और शरीर को चमकाता है; बहुतों को मार डालता और थोड़े लोगों पर दया करता है। यह भी दोहरा आचरण है, पर कुल मिलाकर बुरा ही है।


    8 कोई दूसरा व्यभिचार और यौन-अनैतिकता करता है, फिर भी कुछ भोजनों से परहेज़ करता है। उपवास करते हुए भी वह बुराई करता है; अपने धन की शक्ति से बहुतों को नीचे गिरा देता है और अपनी अत्यधिक दुष्टता से आज्ञाओं को पूरा करता है। यह दोहरा आचरण है, पर कुल मिलाकर बुरा ही है।


    9 ऐसे लोग खरगोशों के समान हैं[d], क्योंकि वे आधे तो शुद्ध हैं, पर वास्तव में अशुद्ध हैं।


    10 क्योंकि परमेश्वर ने आज्ञाओं की पत्थर की पटियाओं में भी ऐसा ही कहा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 3 का यूनानी पाठ कुछ स्थानों पर संदिग्ध है। ‘बुराई करनेवाले से प्रेम करता है’ उपलब्ध शब्दों का निकटतम अर्थ है; ‘बुराई में मरना चुनता है’ का कर्ता और उससे संबंध पूरी तरह स्पष्ट नहीं है।
    reason: पाठगत कठिनाई और वाक्य-संबंध की अनिश्चितता बताना, बिना मुख्य पाठ में असमर्थित कारण-संबंध जोड़े।
  - marker: b
    text: 'पद 4 का यूनानी वाक्य बहुत कठिन और संभवतः विकृत है। अनुवाद इसका संभावित भाव देता है: प्रेम के होते हुए भी बुराई को भले नाम की आड़ में छिपाना दुष्टता है और उसका अंत बुरा होता है।'
    reason: अस्पष्ट स्रोत को झूठी निश्चितता से प्रस्तुत करने से बचना।
  - marker: c
    text: पद 6 में यूनानी पाठ गरीब पर दया करने और निर्धन को राहत देने की बात दो बार, दुष्ट कर्मों के साथ रखता है। यह दोहराव मूल के ‘दोहरे आचरण’ को उभार सकता है।
    reason: असामान्य पुनरुक्ति को जानबूझकर सुरक्षित रखने का आधार स्पष्ट करना।
  - marker: d
    text: यूनानी शब्द का शाब्दिक अर्थ ‘रोएँदार पाँव वाले’ है और यहाँ वह खरगोश या खरहे को दर्शाता है। उपमा उस प्राचीन वर्गीकरण की ओर संकेत करती है जिसमें जुगाली करने के कारण वह आंशिक रूप से शुद्ध-जैसा, पर खुर न चिरे होने के कारण अशुद्ध माना गया था।
    reason: सांस्कृतिक और व्यवस्था-संबंधी उपमा आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: διπρόσωπον
  choice: दोहरा आचरण
  rationale: शाब्दिक अर्थ ‘दो-मुँहा’ है, पर प्रसंग में परस्पर विरोधी नैतिक कर्मों का मिश्रण अभिप्रेत है। ‘दोहरा आचरण’ आधुनिक हिन्दी में स्वाभाविक है और रूपक की शक्ति बनाए रखता है।
- source_word: πλεονεκτεῖ / πλεονεκτῶν
  choice: लालच करता / अनुचित लाभ उठाता
  rationale: यह शब्द लोभ और दूसरे का शोषण करके लाभ लेने—दोनों अर्थ दे सकता है; पद 5 और 6 के अलग वाक्य-संदर्भों में उपयुक्त हिन्दी चुनी गई है।
- source_word: ἐπιορκεῖ
  choice: झूठी शपथ खाता
  rationale: मूल क्रिया झूठी शपथ या शपथभंग को सूचित करती है; ‘परमप्रधान की झूठी शपथ’ स्रोत की संक्षिप्त रचना को बनाए रखती है।
- source_word: ἀθετεῖ
  choice: ठुकराता
  rationale: अर्थ रद्द करना, अस्वीकार करना या उपेक्षा करना है। यहाँ व्यवस्था देनेवाले प्रभु के अधिकार को अस्वीकार करने का बल सुरक्षित रखा गया है।
- source_word: δασύποδες
  choice: खरगोशों
  rationale: शाब्दिक रूप से ‘रोएँदार पाँव वाले’; यूनानी बाइबिलीय प्रयोग में यह खरगोश/खरहा के लिए नाम है। साधारण हिन्दी पाठक के लिए ‘खरगोश’ स्पष्ट है।
- source_word: πορνεύει
  choice: यौन-अनैतिकता करता है
  rationale: व्यापक यौन दुराचार का अर्थ है और पहले आए ‘व्यभिचार’ से इसका भेद बनाए रखता है।
theological_decisions:
- issue: अच्छे और बुरे कर्मों के मिश्रण का नैतिक मूल्यांकन
  choice: ‘कुल मिलाकर बुरा ही है’
  alternative: ‘संपूर्णतः दुष्ट है’
  rationale: τὸ ὅλον के समग्र मूल्यांकन को स्पष्ट रखा गया है, बिना यह दावा जोड़े कि हर पृथक कार्य अपने आप में बुरा है।
- issue: पद 6 में दया और दुष्टता का तनाव
  choice: गरीब पर दया करने और निर्धन को राहत देने—दोनों विरोधी कथनों को रखा गया
  alternative: एक दोहराव हटाकर केवल एक दया-संबंधी कथन रखना
  rationale: प्राप्त यूनानी पाठ में दोनों कथन हैं और अध्याय का विषय ही विरोधाभासी, दोहरा आचरण है; इसलिए तनाव को संपादकीय ढंग से सरल नहीं किया गया।
- issue: पद 8 में दुष्ट व्यक्ति द्वारा आज्ञाओं का पालन
  choice: ‘दुष्टता के बीच आज्ञाओं का पालन करता है’
  alternative: ‘दुष्ट उद्देश्य से आज्ञाओं का पालन करता है’
  rationale: ग्रीक वाक्य कठिन है और उद्देश्य स्पष्ट नहीं करता। हिन्दी में कारण या मंशा जोड़ने के बजाय मूल की धर्मवैचारिक विडंबना और अस्पष्टता बचाई गई है।
- issue: पद 9 की शुद्धता
  choice: ‘आधे तो शुद्ध... वास्तव में अशुद्ध’
  alternative: खाद्य-व्यवस्था का विस्तार मुख्य पाठ में जोड़ना
  rationale: मूल संक्षिप्त धार्मिक उपमा देता है। उसकी पृष्ठभूमि पादटिप्पणी में बताई गई है, मुख्य पाठ में व्याख्या नहीं मिलाई गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। नैतिक विरोध को दिखाने के लिए ‘फिर भी’ और ‘दोहरा आचरण’ का नियमित प्रयोग किया गया है। स्रोत के संदिग्ध पदों 3–4 को अत्यधिक सहज बनाकर उनकी अनिश्चितता नहीं छिपाई गई; आवश्यक विवरण पादटिप्पणियों में दिया गया है।
