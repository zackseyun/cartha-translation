  language: hi
  text: '**याकूब और जिल्पा के दसवें पुत्र आशेर का वसीयतनामा**[a]


    **1.** आशेर के वसीयतनामे की प्रति।


    **2.** अपने जीवन के एक सौ पच्चीसवें वर्ष में, जब वह स्वस्थ था, उसने अपने पुत्रों से कहा, “हे आशेर की सन्तानो, अपने पिता की सुनो; और परमेश्वर के सामने जो कुछ सीधा है, वह सब मैं तुम्हें दिखाऊँगा।


    **3.** परमेश्वर ने मनुष्यों के पुत्रों को दो मार्ग, दो अभिप्राय, दो प्रकार के काम, दो ढंग और दो परिणाम दिए हैं।


    **4.** इसलिए सब कुछ दोहरा है—एक को दूसरे के सामने रखा गया है।[b]


    **5.** क्योंकि दो मार्ग हैं—भलाई का और बुराई का; और हमारी छाती के भीतर दो अभिप्राय हैं, जो इनके बीच भेद करते हैं।[c]


    **6.** इसलिए यदि प्राण ठीक रीति से चलना चाहता है, तो वह अपने सारे काम धार्मिकता से करता है; और यदि वह पाप कर भी बैठे, तो तुरन्त पश्चात्ताप करता है।


    **7.** क्योंकि जो उचित है उस पर विचार करके और दुष्टता को दूर फेंककर वह तुरन्त बुराई को परास्त करता और पाप को जड़ से उखाड़ देता है।


    **8.** पर यदि उसका अभिप्राय बुराई की ओर झुकता है, तो उसके सारे काम दुष्टता में होते हैं। वह भलाई को ठुकराता और बुराई से लिपट जाता है, और बेलियार के वश में हो जाता है। यदि वह कोई भला काम करे भी, तो उसे बुराई में बदल देता है।[d]


    **9.** क्योंकि जब वह भलाई करना आरम्भ भी करता है, तो उसके काम का अन्त उसे बुराई की ओर ले जाता है, क्योंकि उसके अभिप्राय का भंडार एक दुष्ट आत्मा से भरा हुआ है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह शीर्षक यूनानी पाठ की उपरिलिपि में है; इसके बाद पद 1 में “आशेर के वसीयतनामे की प्रति” लिखा है।
    reason: textual_structure
  - marker: b
    text: यूनानी वाक्य का शाब्दिक रूप है, “सब वस्तुएँ दो-दो हैं, एक दूसरे के सामने”; यहाँ परस्पर विरोध में रखी जोड़ियों का भाव है।
    reason: source_ambiguity
  - marker: c
    text: “छाती” उस ठोस यूनानी शब्द का अनुवाद है जो भीतरी विचार-विमर्श के स्थान को दर्शाता है; भावार्थ में “हृदय” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: इस पद के यूनानी पाठ में कर्ता और व्याकरणिक रूप एक समान नहीं हैं; अनुवाद में प्रसंग के अनुसार “प्राण” को निहित कर्ता माना गया है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ὑγιαίνων
  choice: जब वह स्वस्थ था
  rationale: परिस्थितिवाचक कृदन्त आशेर की बोलते समय शारीरिक दशा बताता है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: εὐθές
  choice: जो कुछ सीधा है
  rationale: ‘सीधा’ मूल स्थानिक रूपक को बनाए रखते हुए परमेश्वर के सामने नैतिक उचितता का अर्थ व्यक्त करता है।
- source_word: διαβούλια / διαβούλιον
  choice: अभिप्राय
  rationale: यह केवल बाहरी योजना नहीं, बल्कि भीतर के विचार-विमर्श से बनी नैतिक दिशा या मंशा को दर्शाता है।
- source_word: πράξεις
  choice: काम
  rationale: सामान्य पाठक के लिए स्वाभाविक हिन्दी में नैतिक कर्मों का अर्थ देता है और सूची में ‘अभिप्राय’ से अलग रहता है।
- source_word: τρόπους
  choice: ढंग
  rationale: ὁδοί के लिए प्रयुक्त ‘मार्ग’ की पुनरावृत्ति से बचते हुए कार्य या आचरण की रीति को बनाए रखता है।
- source_word: τέλεα
  choice: परिणाम
  rationale: नैतिक मार्ग की अंतिम परिणति या निष्पत्ति का बोध कराता है; केवल ‘अन्त’ की तुलना में सामान्य हिन्दी में अधिक स्पष्ट है।
- source_word: στέρνοις
  choice: छाती के भीतर
  rationale: मूल का ठोस शारीरिक बिम्ब बनाए रखा गया है; पादटिप्पणी में भावार्थ ‘हृदय’ बताया गया है।
- source_word: πορευθῆναι
  choice: मार्ग पर चलना
  rationale: चलने के बाइबलीय नैतिक रूपक को हिन्दी में स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता से
  rationale: नैतिक सच्चाई और उचित आचरण को संक्षिप्त, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: μετανοεῖ
  choice: पश्चात्ताप करता है
  rationale: विशिष्ट पाप के तुरन्त बाद नैतिक परिवर्तन के प्रसंग में यह प्रचलित और उचित अनुवाद है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी पाठ के व्यक्तिगत नाम का लिप्यन्तरण है; इसे अमूर्त ‘निकम्मापन’ या किसी अन्य प्रचलित रूप में बदलकर व्याख्यात्मक निर्णय नहीं थोपा गया।
theological_decisions:
- issue: आरम्भिक नैतिक द्वैत
  choice: दो मार्गों और दो भीतरी अभिप्रायों के तीखे नैतिक विरोध को सीधे बनाए रखा गया।
  alternative: इसे पूर्ण तत्त्वमीमांसात्मक द्वैतवाद मानना, या केवल अच्छे-बुरे चुनावों की सामान्य भाषा में नरम कर देना।
  rationale: पाठ मानव नैतिक जीवन में विरोधी मार्गों और अभिप्रायों पर बल देता है, पर स्वयं दो समान परम शक्तियों का सिद्धान्त स्पष्ट नहीं करता।
- issue: बेलियार की पहचान
  choice: बेलियार को व्यक्तिगत नाम के रूप में रखा गया।
  alternative: ‘बेलियाल’ लिखना या इसे ‘दुष्टता/निकम्मापन’ जैसे अमूर्त भाव में अनूदित करना।
  rationale: Βελίαρ यहाँ शासन करने वाली दुष्ट सत्ता की तरह प्रयुक्त है; लिप्यन्तरण पाठ की अस्पष्टता और व्यक्तित्व दोनों को सुरक्षित रखता है।
- issue: पद 8 में कर्ता की असंगति
  choice: प्रसंग के आधार पर प्राण को निहित कर्ता मानकर पठनीय हिन्दी दी गई और पाठगत कठिनाई पादटिप्पणी में बताई गई।
  alternative: यूनानी के बदलते लिंग और वचन को हिन्दी में भी असंगत छोड़ देना।
  rationale: साक्ष्य की कठिनाई छिपाए बिना वाक्य का सम्भावित अर्थ स्पष्ट किया गया है।
- issue: पद 9 में भले काम का बुरा अन्त
  choice: वाक्य को इस रूप में रखा गया कि बुरे अभिप्राय से भरा व्यक्ति भलाई आरम्भ करे भी, तो काम का अन्त उसे बुराई की ओर ले जाता है।
  alternative: मूल में स्पष्ट रूप से न पाए जाने वाले शब्द जोड़कर ‘बुरे ढंग से भलाई करना’ कहना।
  rationale: यह यूनानी के उपलब्ध शब्दों और वाक्यक्रम के अधिक निकट है तथा कारण को अगले उपवाक्य—दुष्ट आत्मा से भरा अभिप्राय—में रहने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘प्राण’, ‘धार्मिकता’, ‘पश्चात्ताप’ और ‘वसीयतनामा’ जैसे स्थापित धार्मिक-साहित्यिक शब्द रखे गए हैं, जबकि अत्यधिक संस्कृतनिष्ठ पदावली से बचा गया है। उपलब्ध यूनानी अंश केवल उपरिलिपि और पद 1–9 तक है; इसलिए परामर्शार्थ अंग्रेज़ी पाठ में आए पद 10–12 को स्रोत-साक्ष्य के बिना इस मसौदे में सम्मिलित नहीं किया गया।
