  text: '...crushing the head of the dragon upon the water[a]. He will save Israel and all the nations [God appearing as a man].


    4 Therefore, my children, you also tell these things to your children, so that they may not disobey him. 5 For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men. 6 And because of this you will be scattered, like Gad and Dan my brothers, and you will not know their land, tribe, and language. 7 But the Lord will gather you in faith through his compassion[c][b], and through Abraham and Isaac and Jacob.'
translation:
  language: hi
  text: 'आशेर का वसीयतनामा 7


    1 सदोम के समान मत बनो, जिसने प्रभु के स्वर्गदूतों को नहीं पहचाना और सदा के लिए नष्ट हो गया। 2 क्योंकि मैं जानता हूँ कि तुम पाप करोगे और अपने शत्रुओं के हाथों सौंप दिए जाओगे। तुम्हारा देश उजाड़ हो जाएगा, तुम्हारी पवित्र वस्तुएँ नष्ट कर दी जाएँगी, और तुम पृथ्वी के चारों कोनों में तितर-बितर कर दिए जाओगे। तितर-बितर होकर तुम निकम्मे पानी के समान तुच्छ ठहरोगे। 3 यह तब तक होगा, जब तक परमप्रधान पृथ्वी की सुधि न ले। वह स्वयं मनुष्य के रूप में आकर मनुष्यों के साथ खाएगा-पीएगा और पानी पर ड्रैगन का सिर कुचल देगा। वही इस्राएल और सब राष्ट्रों को बचाएगा—[मनुष्य के रूप में प्रकट परमेश्वर]।


    4 इसलिए, मेरे बच्चो, तुम भी ये बातें अपने बच्चों को बताना, ताकि वे उसकी अवज्ञा न करें। 5 क्योंकि मैं जानता हूँ कि अवज्ञा करते हुए तुम अवज्ञा करोगे और अधर्म करते हुए अधर्म करोगे। तुम परमेश्वर की व्यवस्था पर ध्यान नहीं दोगे, बल्कि मनुष्यों की आज्ञाओं के कारण दुष्टता से भ्रष्ट होते जाओगे। 6 इसी कारण तुम मेरे भाइयों गाद और दान के समान तितर-बितर कर दिए जाओगे, और उनके देशों, गोत्र और भाषा से अनजान हो जाओगे। 7 पर वह अपनी करुणा के द्वारा और अब्राहम, इसहाक और याकूब के द्वारा तुम्हें विश्वास में फिर इकट्ठा करेगा।[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘विश्वास में’ का अर्थ ‘विश्वासयोग्यता में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह तितर-बितर किए जाने और बाद में फिर इकट्ठा किए जाने की छवि इस्राएल के धर्मग्रंथों में बार-बार आने वाले वाचा-दंड और पुनर्स्थापना के विषयों की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: ἠγνόησε
  choice: नहीं पहचाना
  rationale: संदर्भ में यह केवल जानकारी न होने के बजाय प्रभु के स्वर्गदूतों को पहचानने या स्वीकार करने में विफलता बताता है; ‘नहीं पहचाना’ दोनों संभावनाओं को पर्याप्त रूप से खुला रखता है।
- source_word: παραδοθήσεσθε εἰς χεῖρας
  choice: हाथों सौंप दिए जाओगे
  rationale: यूनानी के प्रचलित अधिकार और पराधीनता-सूचक मुहावरे को हिन्दी में स्वाभाविक बाइबलीय रूप में रखा गया है।
- source_word: τὰ ἅγια
  choice: पवित्र वस्तुएँ
  rationale: बहुवचन संज्ञा का संदर्भ मंदिर, पवित्र स्थानों या पवित्र संपत्तियों में से किसी एक तक सीमित नहीं किया गया।
- source_word: ἐξουδενωμένοι
  choice: तुच्छ समझा जाएगा
  rationale: यह निष्क्रिय भाव में अपमानित या नगण्य माने जाने को व्यक्त करता है; ‘तुच्छ समझा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ὕδωρ ἄχρηστον
  choice: निकम्मा पानी
  rationale: शाब्दिक रूप से ‘अनुपयोगी पानी’; ‘निकम्मा’ उपमा की तिरस्कारपूर्ण तीव्रता बनाए रखता है।
- source_word: ἐπισκέψηται
  choice: सुधि न ले
  rationale: यह केवल देखने नहीं, बल्कि हस्तक्षेपकारी दैवी आगमन या कृपापूर्ण ध्यान का अर्थ दे सकता है; ‘सुधि लेना’ इस व्यापकता को स्वाभाविक हिन्दी में रखता है।
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: अजगर का सिर कुचल देगा
  rationale: δράκων की प्रलयात्मक छवि और सिर को चूर करने वाली निर्णायक विजय दोनों सुरक्षित रखी गई हैं।
- source_word: ὑποκρινόμενος
  choice: प्रकट होकर
  rationale: मूल शब्द भूमिका ग्रहण करने, रूप धारण करने या अभिनय करने का भाव दे सकता है। यहाँ ‘ढोंग करते हुए’ अनावश्यक रूप से छल का अर्थ थोपता; ‘प्रकट होकर’ कठिन वाक्य का सतही अर्थ देता है, जबकि कोष्ठक और टिप्पणी पाठगत तनाव बनाए रखते हैं।
- source_word: ἀπειθέω
  choice: आज्ञा न मानना / आज्ञा का उल्लंघन करना
  rationale: पद 4–5 में धातु की पुनरावृत्ति को हिन्दी में निकटवर्ती समानार्थी अभिव्यक्तियों से रखा गया है, ताकि वाक्य समझने योग्य भी रहे और मूल की जोरदार पुनरुक्ति भी सुनाई दे।
- source_word: ἀσεβοῦντες / ἀσεβήσετε
  choice: अधर्म करते हुए अधर्म करोगे
  rationale: सजातीय पुनरुक्ति को जानबूझकर बनाए रखा गया है; ‘अधर्म’ ईश्वर-विरोधी आचरण को गरिमापूर्ण और समझने योग्य ढंग से व्यक्त करता है।
- source_word: νόμῳ θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: यह यहूदी वसीयतनामा-संदर्भ में ‘कानून’ से अधिक स्वाभाविक है और दैवी निर्देश तथा विधि दोनों का भाव रखता है।
- source_word: ἐντολαῖς ἀνθρώπων
  choice: मनुष्यों की आज्ञाओं
  rationale: परमेश्वर की व्यवस्था के साथ मूल का स्पष्ट विरोध सुरक्षित रखा गया है।
- source_word: διασκορπισθήσεσθε
  choice: तितर-बितर कर दिए जाओगे
  rationale: वाचा-दंड और निर्वासन की भाषा को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: ἐν πίστει
  choice: विश्वास में
  rationale: यह ‘विश्वास’ और ‘विश्वासयोग्यता’ दोनों अर्थों की संभावना रखता है; संक्षिप्त रूप मूल की खुली हुई अर्थ-सीमा को सबसे अच्छी तरह बचाता है।
- source_word: εὐσπλαγχνίας
  choice: करुणा
  rationale: भीतर से उमड़ने वाली दया का स्वाभाविक, गरिमापूर्ण हिन्दी समतुल्य।
theological_decisions:
- issue: सदोम के अपराध का स्वरूप
  choice: केवल इतना कहा गया कि उसने प्रभु के स्वर्गदूतों को नहीं पहचाना
  alternative: यहाँ किसी विशेष यौन, सामाजिक या आतिथ्य-संबंधी अपराध को स्पष्ट करना
  rationale: यूनानी वाक्य स्वयं अपराध की व्याख्या नहीं करता; किसी एक धार्मिक व्याख्या को जोड़ना मूल की संक्षिप्तता और अस्पष्टता को मिटा देता।
- issue: ὁ ὕψιστος और आने वाले पुरुष का संबंध
  choice: सर्वनाम ‘वह स्वयं’ रखा गया, जिससे मूल की व्याकरणिक निरंतरता बनी रहे
  alternative: ‘मसीहा’, ‘प्रभु’ या किसी अन्य स्पष्ट पदवी को जोड़ना
  rationale: पाठ परमप्रधान का उल्लेख करता है और फिर ‘वह स्वयं’ कहता है, पर बाद की धर्मसैद्धांतिक शब्दावली नहीं देता। अनुवाद को वही तनाव बनाए रखना चाहिए।
- issue: θεὸς εἰς ἄνδρα ὑποκρινόμενος
  choice: वर्ग कोष्ठकों में ‘परमेश्वर मनुष्य के रूप में प्रकट होकर’
  alternative: पाठ से हटा देना; ‘परमेश्वर मनुष्य होने का ढोंग करते हुए’; ‘मनुष्य के रूप में परमेश्वर की भूमिका निभाते हुए’
  rationale: प्रदत्त यूनानी साक्षी इस वाक्यांश को पाठगत संदेह सूचित करने वाले कोष्ठकों में देता है। उसे कोष्ठकों सहित अनूदित करना साक्षी का सम्मान करता है, जबकि ‘प्रकट होकर’ छल का अनावश्यक आरोप नहीं लगाता।
- issue: ‘वही इस्राएल और सब राष्ट्रों को बचाएगा’ का कर्ता
  choice: ‘वही’ द्वारा निकटवर्ती आने वाले पात्र की ओर संकेत, बिना नई उपाधि जोड़े
  alternative: ‘प्रभु’, ‘परमेश्वर’ या ‘मसीहा’ को स्पष्ट कर्ता बनाना
  rationale: यूनानी οὗτος संकेतवाचक है; अधिक स्पष्ट धार्मिक पदवी जोड़ना पाठ से आगे जाना होता।
- issue: ἐν πίστει का अर्थ
  choice: ‘विश्वास में’
  alternative: ‘विश्वासयोग्यता में’ अथवा ‘विश्वास के द्वारा’
  rationale: यूनानी वाक्यांश साधन, क्षेत्र या विश्वासयोग्यता का भाव दे सकता है। ‘विश्वास में’ इस बहुअर्थता को अपेक्षाकृत सुरक्षित रखता है।
- issue: पद 7 में इकट्ठा करने वाला
  choice: ‘वह’ रखा गया
  alternative: अंग्रेज़ी परामर्श-पाठ के समान ‘प्रभु’ जोड़ना
  rationale: यूनानी में पद 7 का कर्ता क्रिया में निहित है और वहाँ κύριος नहीं है; इसलिए अनुवाद ने स्पष्ट संज्ञा नहीं जोड़ी।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। मूल की भविष्यवाणी-संबंधी पुनरुक्तियों को जहाँ अर्थपूर्ण था वहाँ बनाए रखा गया है। ‘व्यवस्था’, ‘तितर-बितर’, ‘सुधि लेना’ और ‘करुणा’ जैसे पद बाइबलीय अनुनाद रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं। पाठगत रूप से संदिग्ध वाक्यांश को वर्ग कोष्ठकों और टिप्पणी से पारदर्शी बनाया गया है।
