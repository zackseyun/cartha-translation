    1 सदोम के समान मत बनो, जिसने प्रभु के स्वर्गदूतों को नहीं पहचाना और सदा के लिए नष्ट हो गया। 2 क्योंकि मैं जानता हूँ कि तुम पाप करोगे और अपने शत्रुओं के हाथों सौंप दिए जाओगे। तुम्हारा देश उजाड़ हो जाएगा, तुम्हारी पवित्र वस्तुएँ नष्ट कर दी जाएँगी, और तुम पृथ्वी के चारों कोनों में तितर-बितर कर दिए जाओगे। बिखराव में तुम्हें निकम्मे पानी के समान तुच्छ समझा जाएगा। 3 यह तब तक होगा, जब तक परमप्रधान पृथ्वी की सुधि न ले। वह स्वयं मनुष्य के रूप में आकर मनुष्यों के साथ खाएगा-पीएगा और पानी पर अजगर का सिर कुचल देगा। वही इस्राएल और सब राष्ट्रों को बचाएगा—[परमेश्वर मनुष्य के रूप में प्रकट होकर][a]।


    4 इसलिए, मेरे बच्चो, तुम भी ये बातें अपने बच्चों को बताना, ताकि वे उसकी आज्ञा न टालें। 5 क्योंकि मैं जानता हूँ कि तुम आज्ञा न मानते हुए आज्ञा का उल्लंघन करोगे और अधर्म करते हुए अधर्म करोगे। तुम परमेश्वर की व्यवस्था पर ध्यान नहीं दोगे, बल्कि मनुष्यों की आज्ञाओं के कारण दुष्टता से भ्रष्ट होते जाओगे। 6 इसी कारण तुम मेरे भाइयों गाद और दान के समान तितर-बितर कर दिए जाओगे, और उनके देश, गोत्र और भाषा को नहीं जानोगे। 7 पर वह अपनी करुणा के द्वारा और अब्राहम, इसहाक और याकूब के द्वारा तुम्हें विश्वास में फिर इकट्ठा करेगा।[b][c]'
