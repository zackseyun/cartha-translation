source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἔστι τις μισῶν¹³ τὸν ἐλεήμονα καὶ ἄδικον¹⁴, ⌜καὶ⌝¹⁵ τὸν μοιχὸν καὶ¹⁶ νηστεύοντα¹⁷, *καὶ αὐτό ἐστι διπρόσωπον¹⁸, ἀλλὰ ⌈τὸ πᾶν⌉ ἔργον ἀγαθόν¹⁹, ὅτι μιμεῖται²⁰ Κύριον, μὴ²¹ †προσδοκώμενος²² τὸ δοκοῦν καλὸν †μετὰ²³ *τοῦ ἀληθινοῦ²⁴ καλοῦ²⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/003.yaml
  text: There is one who hates the merciful and the unjust, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what seems good along with what is truly good.
translation:
  language: hi
  text: कोई व्यक्ति ऐसा है जो दयालु और अन्यायी, तथा व्यभिचारी और उपवास करनेवाले—सबसे घृणा करता है। यह भी दोहरा आचरण है, फिर भी समूचा कार्य अच्छा है, क्योंकि वह प्रभु का अनुकरण करता है और सच्ची भलाई के साथ उस वस्तु की अपेक्षा नहीं करता जो अच्छी प्रतीत होती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य का अंतिम यूनानी अंश पाठगत रूप से संदिग्ध है। इसका अर्थ संभवतः यह है कि वह सच्ची भलाई के साथ उस वस्तु की अपेक्षा नहीं करता जो केवल अच्छी प्रतीत होती है; अन्य अर्थ भी संभव हैं।
    reason: προσδοκώμενος और उसके निकटवर्ती शब्द संपादित स्रोत में संशय-चिह्नित हैं। मुख्य पाठ में एक संभावित अर्थ दिया गया है, इसलिए अनिश्चितता बताना आवश्यक है।
lexical_decisions:
- source_word: ἐλεήμονα
  choice: दयालु
  rationale: यह विशेषण दया दिखानेवाले व्यक्ति को सूचित करता है; संक्षिप्त संज्ञात्मक प्रयोग हिन्दी में स्वाभाविक है।
- source_word: διπρόσωπον
  choice: दोहरा रुख
  rationale: शाब्दिक अर्थ ‘दो-मुँहा’ है, पर यहाँ विपरीत प्रकार के लोगों के प्रति समान घृणा के द्वैध स्वरूप की बात है; ‘दोहरा रुख’ अर्थ को गरिमापूर्ण और सहज हिन्दी में रखता है।
- source_word: τὸ πᾶν ἔργον ἀγαθόν
  choice: पूरा कार्य अच्छा है
  rationale: पाठ के विरोधाभासी मूल्यांकन को बिना समझाकर समाप्त किए सीधे बनाए रखता है।
- source_word: μιμεῖται Κύριον
  choice: प्रभु का अनुकरण करता है
  rationale: μιμεῖται का सीधा अर्थ अनुकरण करना है; Κύριον को बिना निश्चित उपपद के भी प्रसंगानुसार ‘प्रभु’ रखा गया है।
- source_word: τὸ δοκοῦν καλὸν
  choice: जो केवल अच्छी दिखाई देती है
  rationale: δοκοῦν वास्तविक भलाई के विपरीत प्रतीत होनेवाली भलाई बताता है; ‘केवल’ इस निहित विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τοῦ ἀληθινοῦ καλοῦ
  choice: जो सचमुच अच्छा है
  rationale: ἀληθινός को ‘सचमुच’ से व्यक्त करने पर वास्तविक और प्रतीयमान भलाई का अंतर स्पष्ट रहता है।
theological_decisions:
- issue: विपरीत नैतिक प्रकारों से घृणा करने को ‘अच्छा’ कहने का तनाव
  choice: 'पाठ का विरोधाभास ज्यों का त्यों रखा गया: ‘फिर भी पूरा कार्य अच्छा है।’'
  alternative: इसे नैतिक भेदभाव, निष्पक्षता या बुरे कर्म से घृणा के रूप में व्याख्यायित करना।
  rationale: यूनानी पाठ स्वयं कठिन और तनावपूर्ण है; अनुवाद में कोई धार्मिक व्याख्या जोड़कर इसे सहज नहीं बनाया गया।
- issue: ‘दयालु और अन्यायी’ तथा ‘व्यभिचारी और उपवास करनेवाले’ की व्याकरणिक संबद्धता
  choice: प्रत्येक पद को अलग व्यक्ति/वर्ग के रूप में पढ़ा गया, जैसा वाक्य का नैतिक विरोध और परामर्श-पाठ सुझाता है।
  alternative: 'प्रत्येक जोड़ी को एक ही व्यक्ति के संयुक्त गुणों के रूप में पढ़ना: ‘दयालु किंतु अन्यायी’ और ‘व्यभिचारी किंतु उपवास करनेवाला।’'
  rationale: यूनानी में प्रत्येक जोड़ी के भीतर एक ही उपपद होने से वैकल्पिक पाठ संभव है, पर चार विपरीत वर्गों वाला पाठ उपलब्ध संपादित अंग्रेज़ी परामर्श और वाक्य के ‘दोहरा रुख’ कथन से बेहतर मेल खाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण। कठिन मूल वाक्य की पुनरावृत्ति और धर्मवैचारिक तनाव को अत्यधिक व्याख्यायित नहीं किया गया। ‘दोहरा रुख’ बोलचाल के ‘दो-मुँहा’ से कम आरोपात्मक और साहित्यिक प्रसंग के अधिक अनुकूल है।
