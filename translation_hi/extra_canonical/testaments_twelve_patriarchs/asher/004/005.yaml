id: T12P.ASH.4.5
reference: Testament of Asher 4:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
translation:
  language: hi
  text: 'क्योंकि ऐसे लोग चिकारे और हिरनों के समान हैं: जंगली पशुओं के ढंग के कारण वे अशुद्ध प्रतीत होते हैं, फिर भी वे हर प्रकार से शुद्ध हैं, क्योंकि वे प्रभु के प्रति उत्साह से चलते हैं, और उन बातों से दूर रहते हैं जिनसे परमेश्वर भी घृणा करता है और जिन्हें वह आज्ञाओं के द्वारा मना करता है, भलाई से बुराई को दूर रखते हुए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάσι καὶ ἐλάφοις
  choice: चिकारे और हिरनों
  rationale: दोनों वन्य पशुओं के भेद को बनाए रखते हुए आधुनिक हिन्दी के परिचित और स्वाभाविक शब्द चुने गए हैं।
- source_word: ἐν ἤθει ἀγρίων
  choice: जंगली पशुओं जैसा स्वभाव होने के कारण
  rationale: ἦθος यहाँ चाल-ढाल, प्रकृति या स्वभाव का अर्थ दे सकता है; ‘स्वभाव’ प्रसंग में सहज है और पशुओं से तुलना को स्पष्ट रखता है।
- source_word: τὸ δὲ πᾶν καθαροί
  choice: फिर भी वे हर प्रकार से शुद्ध हैं
  rationale: यह अभिव्यक्ति उनकी प्रत्यक्ष अशुद्धता और वास्तविक पूर्ण शुद्धता के बीच प्रबल विरोध व्यक्त करती है।
- source_word: ἐν ζήλῳ Κυρίου πορεύονται
  choice: वे प्रभु के लिए उत्साह से चलते हैं
  rationale: ‘चलते हैं’ नैतिक जीवन-मार्ग के रूपक को बनाए रखता है; संबंधवाचक Κυρίου को स्वाभाविक हिन्दी में ‘प्रभु के लिए’ कहा गया है, यद्यपि ‘प्रभु के उत्साह में’ भी संभव है।
- source_word: ἀπεχόμενοι
  choice: दूर रहते हैं
  rationale: यह क्रिया जान-बूझकर परहेज़ करने या अपने को अलग रखने का भाव देती है।
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: बुराई को भलाई से अलग रखते हैं
  rationale: मूल पाठ में बुराई को भलाई से दूर रखने का चित्र है; हिन्दी में ‘अलग रखते हैं’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἐν ζήλῳ Κυρίου में संबंध का अर्थ
  choice: प्रभु के लिए उत्साह से
  alternative: प्रभु के उत्साह में
  rationale: यूनानी संबंधवाचक रूप लक्ष्य, संबंध या स्रोत का संकेत दे सकता है। प्रसंग में लोगों की प्रभु-निष्ठा प्रमुख है, इसलिए लक्ष्य/निष्ठा का भाव चुना गया, बिना किसी सांप्रदायिक व्याख्या को जोड़े।
- issue: शुद्धता और जंगली पशुओं की उपमा
  choice: दिखाई देने वाली अशुद्धता और वास्तविक शुद्धता, दोनों को विरोध के रूप में बनाए रखा
  alternative: वन्य पशुओं को स्वयं नैतिक रूप से अशुद्ध ठहराना
  rationale: पाठ बाहरी आभास और संपूर्ण शुद्धता में तनाव रखता है; अनुवाद ने इस तनाव को हल किए बिना सुरक्षित रखा है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। वाक्य-संरचना मूल के तर्क और विरोध को बनाए रखते हुए हिन्दी में सहज की गई है।
