base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/001.yaml
  text: For good men, being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God.
translation:
  language: hi
  text: क्योंकि भले लोग एक ही मुख वाले होते हैं; चाहे दो-मुँहे लोग उन्हें पाप करते हुए मानें, फिर भी वे परमेश्वर के सामने धर्मी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοὶ ἄνθρωποι
  choice: भले लोग
  rationale: यह सहज आधुनिक हिन्दी में नैतिक रूप से अच्छे लोगों का अर्थ व्यक्त करता है।
- source_word: μονοπρόσωποι
  choice: एक ही मुख वाले
  rationale: मूल के ‘एक-मुखी’ रूपक को बनाए रखता है और अगले विरोधी पद ‘दो-मुँहे’ से स्पष्ट संबंध बनाता है।
- source_word: διπροσώπων
  choice: दो-मुँहे लोग
  rationale: मूल के ‘दो मुख वाले’ रूपक और कपट के निहितार्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἁμαρτάνειν
  choice: पाप करते हुए
  rationale: क्रिया के धार्मिक-नैतिक अर्थ को सीधे व्यक्त करता है; इसे केवल ‘गलती करना’ बनाकर कमजोर नहीं किया गया।
- source_word: δίκαιοί
  choice: धर्मी
  rationale: परमेश्वर के सामने सही ठहरने अथवा धार्मिक होने की मूल धार्मिक भाषा और संभावित तनाव को बनाए रखता है।
- source_word: παρὰ τῷ Θεῷ
  choice: परमेश्वर की दृष्टि में
  rationale: परमेश्वर के आकलन में होने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दूसरों द्वारा पापी समझे जाने और परमेश्वर की दृष्टि में धर्मी होने का तनाव
  choice: दोनों कथनों को बिना सामंजस्य बैठाए साथ रखा गया
  alternative: यह स्पष्ट करना कि उनका काम वास्तव में पाप नहीं है
  rationale: मूल पाठ बाहरी मानवीय निर्णय और परमेश्वर के निर्णय के बीच तनाव रखता है, पर आरोप की सत्यता को विस्तार से नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एक ही मुख वाले’ और ‘दो-मुँहे’ के माध्यम से यूनानी शब्द-युग्म का रूपक जानबूझकर सुरक्षित रखा गया है।
