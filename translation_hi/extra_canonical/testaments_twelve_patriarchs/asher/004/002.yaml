source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Πολλοὶ ⌜δὲ⌝⁷ ἀναιροῦντες τοὺς⁸ πονηρούς, δύο⁹ ποιοῦσιν ἔργα *καλοῦ τε καὶ κακοῦ¹⁰, *τὸ δὲ ὅλον¹¹ καλόν, ὅτι τὸ¹² κακὸν ἐκριζώσας ἀπώλεσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/002.yaml
  text: And many, in doing away with the wicked, do two things, good and evil; yet the whole is good, because he has uprooted and destroyed the evil.
translation:
  language: hi
  text: और बहुत-से लोग दुष्टों का नाश करते हुए दो काम करते हैं—एक भला और एक बुरा; फिर भी पूरा कार्य भला है, क्योंकि उसने¹ बुराई को जड़ से उखाड़कर नष्ट कर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιροῦντες τοὺς πονηρούς
  choice: दुष्टों का नाश करते हुए
  rationale: ἀναιρέω यहाँ दुष्ट व्यक्तियों को रास्ते से हटाने या नष्ट करने का प्रबल अर्थ रखता है; ‘नाश करना’ प्रसंग की नैतिक कठोरता को बिना नरम किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δύο ποιοῦσιν ἔργα καλοῦ τε καὶ κακοῦ
  choice: दो प्रकार के काम करते हैं—भला भी और बुरा भी
  rationale: ग्रीक में ‘दो काम’ के साथ भले और बुरे का विरोध है। ‘दो प्रकार के काम’ हिन्दी में इस असामान्य रचना का अर्थ स्पष्ट रखता है, पर तनाव को समाप्त नहीं करता।
- source_word: τὸ δὲ ὅλον καλόν
  choice: फिर भी समूचा काम भला है
  rationale: ὅλον समग्र कार्य या परिणाम की ओर संकेत करता है। ‘समूचा काम’ पूर्ववर्ती ἔργα से संबंध बनाए रखता है।
- source_word: τὸ κακὸν ἐκριζώσας ἀπώλεσεν
  choice: बुराई को जड़ से उखाड़कर मिटा दिया है
  rationale: ἐκριζόω के जड़ से उखाड़ने वाले चित्र और ἀπόλλυμι के नष्ट करने वाले अर्थ—दोनों को अलग क्रियाओं में सुरक्षित रखा गया है।
theological_decisions:
- issue: एक ऐसे कार्य का नैतिक मूल्यांकन जिसमें भला और बुरा दोनों सम्मिलित हैं
  choice: ‘फिर भी समूचा काम भला है’ कहकर मूल पाठ का निष्कर्ष ज्यों का त्यों रखा गया
  alternative: इसे केवल अच्छे अंतिम परिणाम या अच्छे उद्देश्य के आधार पर समझाकर नैतिक तनाव को हल करना
  rationale: ग्रीक स्वयं भले और बुरे दोनों कार्यों तथा पूरे के भला होने के बीच तनाव रखता है; अनुवाद को किसी विशेष नैतिक सिद्धांत के द्वारा इसे चुपचाप नहीं सुलझाना चाहिए।
- issue: अंतिम एकवचन कृदंत और क्रिया का कर्ता
  choice: प्रारंभिक बहुवचन कर्ता के अनुरूप स्वाभाविक हिन्दी में ‘उन्होंने’
  alternative: शाब्दिक रूप से ‘उसने’, जैसा सुरक्षित ग्रीक पाठ की एकवचन व्याकरण और अंग्रेज़ी परामर्श-पाठ में है
  rationale: वाक्य की शुरुआत πολλοί और ποιοῦσιν से बहुवचन में होती है, जबकि अंतिम ἐκριζώσας ἀπώλεσεν एकवचन है; यह संभवतः पाठगत या व्याकरणिक असंगति है। मुख्य हिन्दी पाठ में स्पष्ट पूर्वपद के साथ बहुवचन अधिक सुबोध है, बिना किसी नए पात्र को मान लिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर और गरिमापूर्ण, पर सामान्य पाठक के लिए सहज। ‘दुष्ट’, ‘भला’, ‘बुरा’, ‘बुराई’ जैसे सीधे नैतिक शब्द मूल की पुनरुक्ति और विरोध को बनाए रखते हैं।
