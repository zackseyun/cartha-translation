id: T12P.ASH.4.4
reference: Testament of Asher 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος²⁶ οὐ θέλει *ἰδεῖν ⌈ἡμέρας⌉ ἀγαθὰς²⁷ μετὰ ἀσώτων, ἵνα μὴ αἰσχράνει²⁸ τὸ σῶμα²⁹ καὶ τὴν ψυχὴν μολυνεῖ³⁰. *καίγε τοῦτο διπρόσωπον³¹, ὅλον³² δὲ καλόν³³ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/004.yaml
  text: Another does not wish to see good days with the wasteful, lest he disgrace the body and defile the soul. Even though this is double-faced, yet it is wholly good.
translation:
  language: hi
  text: दूसरा व्यक्ति अपव्ययी लोगों के साथ अच्छे दिन देखना नहीं चाहता, कहीं ऐसा न हो कि वह शरीर को कलंकित करे और आत्मा को दूषित करे। फिर भी यह दो-मुँहा है, और पूरी तरह अच्छा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλος
  choice: एक और मनुष्य
  rationale: यह पिछले संदर्भ में दूसरे प्रकार के व्यक्ति का संकेत है; हिन्दी में केवल ‘दूसरा’ की अपेक्षा यह अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: अच्छे दिन देखना
  rationale: यूनानी मुहावरे की छवि को बनाए रखते हुए सुख-समृद्धि के दिन बिताने का भाव देता है।
- source_word: ἀσώτων
  choice: अपव्ययी लोगों
  rationale: ἄσωτος में उच्छृंखल अथवा फिजूलखर्च जीवन का भाव हो सकता है; यहाँ अच्छे दिनों और संगति के संदर्भ में ‘अपव्ययी’ मूल अर्थ के निकट है और अस्पष्टता को अनावश्यक रूप से नैतिक विशिष्टता में नहीं बदलता।
- source_word: αἰσχράνει
  choice: लज्जित करे
  rationale: यह क्रिया शरीर को कलंकित, अपमानित या लज्जाजनक बनाने का भाव रखती है; इसे μολυνεῖ से अलग रखा गया है।
- source_word: μολυνεῖ
  choice: अशुद्ध करे
  rationale: आत्मा को दूषित अथवा अपवित्र करने का भाव; सहज आधुनिक हिन्दी में ‘अशुद्ध करे’ उपयुक्त है।
- source_word: διπρόσωπον
  choice: दोहरा रुख
  rationale: शाब्दिक अर्थ ‘दो-मुँहा’ है, पर यहाँ आचरण के द्वैध स्वरूप का संकेत है; ‘दोहरा रुख’ नकारात्मक आरोप को अत्यधिक तीखा किए बिना तनाव बनाए रखता है।
- source_word: ὅλον δὲ καλόν
  choice: फिर भी यह पूरी तरह अच्छा है
  rationale: विरोधसूचक δὲ और समग्र सकारात्मक मूल्यांकन दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: διπρόσωπον और नैतिक अच्छाई के बीच तनाव
  choice: ‘यद्यपि यह दोहरा रुख है, फिर भी यह पूरी तरह अच्छा है’
  alternative: ‘यह भी दो-मुँहापन है, पर पूर्णतः भला है’
  rationale: मूल पाठ स्वयं द्वैधता को स्वीकारते हुए उसे समग्रतः अच्छा कहता है। अनुवाद इस संभावित विरोधाभास को समझाकर समाप्त नहीं करता, बल्कि ज्यों का त्यों बनाए रखता है।
- issue: शरीर और आत्मा के साथ अलग-अलग क्रियाएँ
  choice: शरीर को ‘लज्जित’ और आत्मा को ‘अशुद्ध’ करना
  alternative: दोनों के लिए ‘दूषित करना’
  rationale: αἰσχράνει और μολυνεῖ का भेद अर्थपूर्ण है; उसे बनाए रखने से शरीर और आत्मा के विषय में मूल पाठ की अलग शब्दावली सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की नैतिक विडंबना तथा ‘दोहरा रुख’ और ‘पूरी तरह अच्छा’ के बीच मूल तनाव को नहीं सुलझाया गया है।
