  text: But you, my children, do not become double-faced like them, with both goodness and wickedness; rather cling to goodness alone, because the Lord God rests in it, and people long for it. But flee wickedness, destroying its scheme by your good deeds; for the double-faced are not of God, but serve their own desires, so that they may please Beliar.
translation:
  language: hi
  text: '**आशेर का वसीयतनामा 3**


    **1** परन्तु, हे मेरे बच्चों, तुम उनकी तरह भलाई और बुराई दोनों में दोमुंहे न बनो; बल्कि केवल भलाई से जुड़े रहो, क्योंकि प्रभु परमेश्वर उसमें विश्राम करता है और लोग उसकी लालसा करते हैं। **2** बुराई से भागो और अपने भले कामों से उसकी चाल को नष्ट कर दो; क्योंकि दोमुंहे परमेश्वर के नहीं हैं, बल्कि अपनी ही इच्छाओं के दास हैं, ताकि वे बेलियार[a] और अपने जैसे मनुष्यों को प्रसन्न करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बेलियार—यहाँ बुराई से जुड़ी एक विरोधी सत्ता का नाम।
    reason: अपरिचित प्राचीन नाम की न्यूनतम पहचान देता है, बिना उसकी सटीक धर्मवैज्ञानिक पहचान निश्चित किए।
lexical_decisions:
- source_word: διπρόσωποι
  choice: दोहरा चेहरा रखनेवाले
  rationale: यूनानी के ‘दो चेहरे’ वाले रूपक को बनाए रखता है और भलाई तथा बुराई दोनों से जुड़ी विभाजित निष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κολλήθητε
  choice: लिपटे रहो
  rationale: क्रिया का मूल भाव दृढ़ता से चिपके रहने या जुड़े रहने का है; यह केवल सामान्य पसंद से अधिक गहरी निष्ठा व्यक्त करता है।
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: उसमें विश्राम करता है
  rationale: ‘विश्राम करना’ स्रोत के ठोस धार्मिक रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: τὸ διαβούλιον
  choice: उसकी चाल
  rationale: संदर्भ में यह बुराई की सोची-समझी योजना या षड्यंत्र है; ‘चाल’ आधुनिक हिन्दी में दुष्ट योजना का भाव संक्षेप में देता है।
- source_word: οὐκ εἰσὶ τοῦ Θεοῦ
  choice: परमेश्वर के नहीं हैं
  rationale: यूनानी संबंधवाचक अभिव्यक्ति को जानबूझकर संक्षिप्त रखा गया है, ताकि ‘परमेश्वर से संबंधित/उसके अपने’ होने की व्यापकता बनी रहे।
- source_word: δουλεύουσιν
  choice: गुलामी करते हैं
  rationale: स्रोत में केवल ‘सेवा’ नहीं बल्कि दास की तरह अधीन रहने का प्रबल भाव है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण है और इसे किसी विशेष धर्मवैज्ञानिक पहचान में नहीं बदला गया।
theological_decisions:
- issue: प्रभु परमेश्वर का भलाई में ‘विश्राम करना’
  choice: रूपक को यथावत रखा गया
  alternative: ‘प्रसन्न होता है’ या ‘निवास करता है’
  rationale: ‘प्रसन्न होना’ अर्थ को सीमित करता और ‘निवास करना’ अलग रूपक लाता; मूल पाठ का तनाव और चित्रात्मकता बनाए रखना उचित है।
- issue: ‘परमेश्वर के नहीं हैं’ का संबंधवाचक अर्थ
  choice: शाब्दिक रूप से ‘परमेश्वर के नहीं हैं’
  alternative: ‘परमेश्वर के लोग नहीं हैं’ या ‘परमेश्वर से संबंधित नहीं हैं’
  rationale: मूल वाक्य सदस्यता, स्वामित्व और संबंध के बीच खुला है; किसी एक व्यवस्थित धर्मवैज्ञानिक अर्थ को थोपने से बचा गया।
- issue: अंतिम समानांतर पदबंध τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: ‘और अपने जैसे लोगों को’ शामिल किया गया
  alternative: अंग्रेज़ी परामर्श-पाठ की तरह इसे छोड़ देना
  rationale: यह पदबंध उपलब्ध यूनानी स्रोत में स्पष्ट रूप से उपस्थित है और ‘बेलियार’ के साथ ἀρέσωσιν का दूसरा दत्तिव कर्म है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। ‘हे मेरे बच्चो’ संबोधन की आत्मीयता तथा आज्ञार्थक वाक्यों की गंभीरता सुरक्षित है। स्रोत के दोहरे चेहरे, लिपटने, विश्राम करने और गुलामी करने जैसे रूपकों को जहाँ संभव था, प्रत्यक्ष रखा गया है।
