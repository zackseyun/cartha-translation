source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: III. Ὑμεῖς¹ δὲ², *τέκνα μου³, μὴ γίνεσθε *κατ᾽ αὐτοὺς⁴ διπρόσωποι, ἀγαθότητος καὶ κακίας, ἀλλὰ τῇ ἀγαθότητι μόνῃ⁵ κολλήθητε, ὅτι ⌜Κύριος⌝⁶ ὁ Θεὸς *ἀναπαύεται ἐν⁷ αὐτῇ⁸, καὶ οἱ ἄνθρωποι *αὐτὴν ποθοῦσιν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/001.yaml
  text: But you, my children, do not become double-faced[a] like them, in goodness and wickedness, but cling to goodness alone, because the Lord God rests in it, and people long for it.
translation:
  language: hi
  text: लेकिन तुम, मेरे बच्चो, उनकी तरह भलाई और बुराई में दोहरे चरित्र वाले न बनो, बल्कि केवल भलाई से जुड़े रहो, क्योंकि प्रभु परमेश्वर भलाई में विश्राम करता है और लोग भलाई की लालसा करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διπρόσωποι
  choice: दोहरे चरित्र वाले
  rationale: यूनानी शब्द का शाब्दिक बिंब ‘दो-मुँहा/दो-चेहरा’ है, पर यहाँ आशय केवल सामाजिक कपट नहीं, बल्कि भलाई और बुराई में बँटे नैतिक चरित्र से है।
- source_word: κολλήθητε
  choice: लिपटे रहो
  rationale: यह क्रिया दृढ़ता से जुड़ने और अलग न होने का भाव देती है; ‘लिपटे रहो’ उस सघन संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: उसमें विश्राम करता है
  rationale: मूल के स्थानवाचक और धर्मवैचारिक रूपक को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखा गया है।
- source_word: ποθοῦσιν
  choice: लालसा करते हैं
  rationale: यह शब्द साधारण इच्छा से अधिक गहरी चाह व्यक्त करता है; ‘लालसा’ उसी तीव्रता को दर्शाती है।
theological_decisions:
- issue: भलाई में प्रभु परमेश्वर के ‘विश्राम’ का अर्थ
  choice: 'रूपक को ज्यों का त्यों रखा गया: ‘उसमें विश्राम करता है’'
  alternative: ‘उससे प्रसन्न होता है’ या ‘उसमें वास करता है’
  rationale: यूनानी ἀναπαύεται विश्राम का स्पष्ट बिंब रखता है। इसे प्रसन्नता या वास के रूप में खोलना मूल की संभावित अर्थ-व्याप्ति को अनावश्यक रूप से सीमित करता।
- issue: ‘भलाई और बुराई’ का διπρόσωποι से संबंध
  choice: विराम-चिह्नों के द्वारा बँटे हुए नैतिक चरित्र की व्याख्या के रूप में प्रस्तुत किया
  alternative: ‘भलाई और बुराई में दो-मुँहे न बनो’
  rationale: मूल वाक्य-संरचना कुछ संक्षिप्त है; चुना गया रूप अर्थ-संबंध स्पष्ट करता है, पर यह दावा नहीं करता कि व्यक्ति स्वयं भलाई या बुराई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘हे मेरे बच्चो’ पितृसुलभ संबोधन को रखता है; ‘परन्तु’ और ‘प्रभु परमेश्वर’ पाठ की वसीयतनुमा तथा धार्मिक गरिमा बनाए रखते हैं।
