id: T12P.ASH.3.2
reference: Testament of Asher 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Τὴν ⌜δὲ⌝ κακίαν ἀποδράσατε¹⁰, ἀναιροῦντες *τὸ διαβούλιον¹¹ ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι, ὅτι οἱ διπρόσωποι *οὐκ εἰσὶ τοῦ Θεοῦ¹², ἀλλὰ ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν, ἵνα τῷ Βελίαρ ἀρέσωσιν, καὶ τοῖς ὁμοίοις¹³ αὐτῶν ἀνθρώποις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/002.yaml
  text: But flee wickedness, destroying its plan by your good deeds; for the double-faced are not of God, but are enslaved to their own desires, so that they may please Beliar[b].
translation:
  language: hi
  text: परन्तु दुष्टता से दूर भागो, और अपने भले कामों के द्वारा उसकी योजना को नष्ट करते हुए ऐसा करो; क्योंकि दोहरा चेहरा रखने वाले लोग परमेश्वर के नहीं हैं, बल्कि अपनी ही लालसाओं के दासत्व में हैं, ताकि वे बेलियार[a] को और अपने जैसे लोगों को प्रसन्न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बेलियार” उस नाम का यूनानी रूप है जिसे प्रायः “बेलियाल” भी लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κακίαν
  choice: दुष्टता
  rationale: यह शब्द नैतिक बुराई या दुष्टता को दर्शाता है; यहाँ सामान्य और स्वाभाविक हिन्दी संज्ञा उपयुक्त है।
- source_word: ἀποδράσατε
  choice: दूर भागो
  rationale: आदेशात्मक क्रिया केवल बचने नहीं, बल्कि सक्रिय रूप से भाग निकलने का भाव रखती है।
- source_word: τὸ διαβούλιον
  choice: उसकी योजना
  rationale: यहाँ आशय दुष्टता की युक्ति या योजना से है; 'योजना' आधुनिक पाठक के लिए स्पष्ट है और पाठ में निहित मानवीकरण को बनाए रखती है।
- source_word: διπρόσωποι
  choice: दोहरे चेहरे वाले लोग
  rationale: यूनानी रूपक का सीधा अर्थ सुरक्षित रखते हुए कपटपूर्ण दोहरेपन का भाव व्यक्त किया गया है।
- source_word: δουλεύουσιν
  choice: दास हैं
  rationale: क्रिया का अर्थ केवल सेवा करना नहीं, दासत्व में होना है; इसलिए इच्छाओं की अधीनता का प्रबल भाव रखा गया है।
- source_word: ἐπιθυμίαις
  choice: लालसाओं
  rationale: संदर्भ में यह शब्द तटस्थ इच्छाओं से अधिक अनियंत्रित या नैतिक रूप से दूषित अभिलाषाओं को सूचित करता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: यूनानी नाम-रूप का हिन्दी लिप्यंतरण किया गया है; प्रचलित वैकल्पिक रूप फुटनोट में दिया गया है।
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: अपने जैसे लोगों को
  rationale: मूल यूनानी में उपस्थित इस अंतिम पदबंध को अंग्रेज़ी परामर्श-पाठ में छूट जाने के बावजूद अनुवाद में सुरक्षित रखा गया है।
theological_decisions:
- issue: οὐκ εἰσὶ τοῦ Θεοῦ का संबंधसूचक अर्थ
  choice: परमेश्वर के नहीं हैं
  alternative: परमेश्वर से नहीं हैं
  rationale: मूल वाक्यांश संबंध या अपनापन व्यक्त कर सकता है; 'परमेश्वर के नहीं हैं' इस तनाव को बिना यह निश्चित किए बनाए रखता है कि आशय उत्पत्ति, पक्ष या स्वामित्व में से कौन-सा है।
- issue: बेलियार की पहचान
  choice: नाम को बेलियार के रूप में रखा गया
  alternative: शैतान जैसे किसी व्याख्यात्मक पद से बदलना
  rationale: मूल पाठ एक विशिष्ट नाम का प्रयोग करता है; उसकी पहचान को अनुवाद में व्याख्यात्मक रूप से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। वाक्य की उपदेशात्मक तीव्रता, दासत्व का रूपक और 'दोहरे चेहरे' की मूल छवि सुरक्षित हैं। मूल यूनानी का अंतिम पदबंध 'और अपने जैसे लोगों को' अंग्रेज़ी POB में अनुपस्थित था, पर स्रोत-साक्ष्य के आधार पर शामिल किया गया है।
