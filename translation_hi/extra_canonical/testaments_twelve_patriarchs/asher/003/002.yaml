review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the final Greek phrase, καὶ τοῖς ὁμοίοις αὐτῶν ἀνθρώποις ('and people like them'), which is absent from the supplied English audit text. It also conveys δουλεύουσιν with an appropriately strong slavery/subjection sense. A small revision makes the participial relation of ἀναιροῦντες ('by/destroying') clearer in Hindi and improves the rendering of διπρόσωποι.
  naturalness: The draft is generally clear and suitably formal. 'दोहरे चेहरे वाले लोग' is understandable but somewhat calqued; 'दोहरा चेहरा रखने वाले' is more natural modern Hindi while retaining the image. '...के दास हैं' is valid, but '...के दासत्व में हैं' more idiomatically expresses enslavement to desires.
  terminology: '''परमेश्वर,'' ''बेलियार,'' and the explanatory footnote are appropriate. ''दुष्टता'' is acceptable in this elevated admonitory register. The footnote marker is correctly anchored to ''बेलियार.'''
  issues:
  - severity: low
    issue: Greek participial construction is flattened into a second imperative.
    rationale: ἀναιροῦντες modifies the command to flee wickedness and expresses means/manner. 'उसकी योजना को नष्ट करते हुए' better reflects this relationship than a separate 'नष्ट कर दो.'
  - severity: low
    issue: The expression for διπρόσωποι is slightly wooden in Hindi.
    rationale: '''दोहरा चेहरा रखने वाले'' is more idiomatic than ''दोहरे चेहरे वाले'' and preserves the source image without adding an interpretive label such as ''कपटी.'''
