  text: 'Therefore take heed, you also, my children, following the commandments of the Lord with a single face, in truth. For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against mankind. You therefore, my children, keep the law of the Lord, and do not attend to evil as though it were good; but look instead to what is truly good, and preserve it in all the commandments of the Lord, conducting yourselves in it and resting in it. For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and of Beliar. For when a wicked soul departs, it is tormented by the evil spirit, which it also served in lusts and wicked deeds. But if it is peaceful in joy, it knows the angel of peace, and rejoices in him; and at its death he leads it into eternal life. And it does not come into the destruction of Beliar, as do the souls of sinners. You see, therefore, that in the last
    times the sons of truth will escape the spirits of deceit and Beliar, but the sons of lawlessness will be destroyed. For the latter will hand over their souls to Beliar in confusion, but the former will be found in joy. For every one of those who are double-faced, though he says, ''I am for the Lord,'' serves Beliar, and his works go to the evil one. Be persuaded, therefore, my children, that there are two ways of all things, one of good and one of evil; and in these are the two dispositions in our breasts that discern them. Therefore if the soul takes pleasure in the good, all its deeds are in righteousness; and if it sins, it immediately repents. For, having its mind set on righteousness and hating wickedness, it casts away the evil and roots out the sin. But if it inclines to evil, all its deeds are in wickedness, and it drives away the good and clings to the evil, and is ruled by Beliar. For even if it does what is good, it twists it toward evil. For when it begins to do good, it
    brings the end of the action over to evil, since the treasure of its inclination is filled with an evil spirit. Another may steal, deal unjustly, plunder, defraud, and yet show compassion to the poor: this too has a double face, but the whole is evil. He who defrauds his neighbor provokes God, and swears falsely by the Most High, and yet has pity on the poor. The Lord who gave the law he sets at naught and provokes, yet he refreshes the poor. He defiles the soul and makes the body glad; he kills many and has mercy on a few: this too has a double face. Another does not commit adultery, nor fornication, and abstains from foods, but when he fasts he does evil, and by his power and his wealth he overthrows many; and despite his excessive goodness, he practices lawlessness: this too has a double face. Such men are hares, clean like those that divide the hoof, but in fact they are unclean. For God said in the tablets of the commandments. But do not become, my children, like Sodom, which did
    not recognize the angels of the Lord and perished forever. For I know that you will sin, and be handed over into the hands of your enemies; and your land will be made desolate, and your holy places destroyed, and you will be scattered to the four corners of the earth. And you will be counted in the dispersion as water that vanishes, until the Most High visits the earth, himself coming as a man, with men eating and drinking, and breaking the head of the dragon in the water. He will save Israel and all the nations, God speaking in the person of man. Therefore tell these things to your children also, that they may disobey him. For I know that they will surely be lawless and will not heed the law of God, but the commandments of men; and they will be scattered as leaves are scattered by the wind, and as water is dispersed. But you, my children, if you walk in holiness according to the commandments of the Lord, you will dwell again in safety, and all Israel will be gathered to the Lord.'
translation:
  language: hi
  text: '**आशेर का वसीयतनामा 6**


    **1** इसलिए, हे मेरे बच्चो, तुम भी सावधान रहो। एकमुख होकर[a] प्रभु की आज्ञाओं का सच्चाई से पालन करो। **2** क्योंकि दोहरे मुख वाले लोगों को दुगना दंड मिलता है: वे स्वयं बुराई करते हैं और बुराई करने वालों से सहमत भी होते हैं। इस प्रकार वे भरमाने वाली आत्माओं की नकल करते हैं और मनुष्यों के विरुद्ध संघर्ष करते हैं।


    **3** इसलिए, हे मेरे बच्चो, प्रभु की व्यवस्था का पालन करो। बुराई पर इस तरह ध्यान न दो मानो वह भलाई हो; बल्कि जो सचमुच भला है उसी पर दृष्टि लगाए रखो। प्रभु की सभी आज्ञाओं में उस भलाई को थामे रहो, उसी के अनुसार अपना आचरण करो और उसी में विश्राम पाओ। **4** क्योंकि मनुष्यों के अंत उनकी धार्मिकता प्रकट करते हैं और प्रभु तथा बेलियार के स्वर्गदूतों को ज्ञात होते हैं।


    **5** क्योंकि जब किसी दुष्ट व्यक्ति की आत्मा प्रस्थान करती है, तो वह उस दुष्ट आत्मा से यातना पाती है जिसकी उसने अपनी लालसाओं और बुरे कामों में सेवा की थी। **6** लेकिन यदि वह आनंद में शांत रहती है, तो वह शांति के स्वर्गदूत को पहचानती है; और वह उसे अनन्त जीवन में ले जाता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘एक ही मुख वाला होकर’ है। यह अगले पद के ‘दोहरे मुख वाले’ लोगों के विपरीत है और निष्कपट, अविभाजित निष्ठा का भाव देता है।
    reason: असामान्य किन्तु महत्वपूर्ण यूनानी रूपक को समझाना।
  - marker: b
    text: इस पद का यूनानी पाठ कठिन है। अंतिम वाक्य में निहित कर्ता और ‘उसे’ का संबंध पूर्णतः स्पष्ट नहीं है। अनुवाद यूनानी के संक्षिप्त, अस्पष्ट रूप को बनाए रखता है; इसलिए यहाँ किसी अतिरिक्त वाक्यांश या निश्चित पहचान को नहीं जोड़ा गया है।
    reason: पाठगत और व्याकरणिक अनिश्चितता को बिना कृत्रिम समाधान के सुरक्षित रखना।
lexical_decisions:
- source_word: μονοπροσώπως
  choice: एकमुख होकर
  rationale: यह शब्द शाब्दिक रूप से ‘एक मुख से/एक ही मुख वाला होकर’ है और अगले पद के διπρόσωποι (‘दोहरे मुख वाले’) के साथ जानबूझकर विरोध रचता है। ‘एकनिष्ठ होकर’ अधिक सहज होता, पर मुख के रूपक को मिटा देता।
- source_word: διπρόσωποι
  choice: दोहरे मुख वाले लोग
  rationale: ‘दोगले’ अत्यधिक बोलचाल और अपमानसूचक है; यह चयन मूल के मुख-संबंधी रूपक को dignified आधुनिक हिन्दी में बनाए रखता है।
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: भरमाने वाली आत्माएँ
  rationale: πλάνη में भटकाव और धोखा दोनों निहित हैं। ‘भरमाने वाली’ यहाँ इन आत्माओं की सक्रिय भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ὄντως καλόν
  choice: जो सचमुच भला है
  rationale: ὄντως के बल को स्पष्ट रखते हुए भलाई की वास्तविकता और केवल दिखने वाली भलाई के बीच अंतर सुरक्षित रहता है।
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: मनुष्यों का अंत
  rationale: τέλη यहाँ जीवन के परिणाम या अंतिम दशा का संकेत दे सकता है। ‘अंत’ मूल की व्यापकता और न्याय-विषयक तनाव दोनों को बचाता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: नैतिक सहीपन और परमेश्वर-संबंधी धार्मिक अर्थ दोनों के लिए प्रचलित, गरिमापूर्ण शब्द।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: नाम को हिन्दी लिप्यंतरण में रखा गया है; इसे ‘शैतान’ कहकर पहचान को व्याख्यात्मक रूप से तय नहीं किया गया।
- source_word: ἐπιθυμίαις
  choice: लालसाओं
  rationale: संदर्भ में नैतिक रूप से दूषित इच्छाओं का भाव है; ‘इच्छाओं’ की तुलना में ‘लालसाओं’ से यह स्पष्ट होता है।
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: शांति का स्वर्गदूत
  rationale: व्यक्तिगत स्वर्गदूतीय सत्ता का सीधा और संप्रदाय-निरपेक्ष अनुवाद।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: स्रोत का पारंपरिक धार्मिक पदबंध स्वाभाविक हिन्दी में यथावत रखा गया है।
theological_decisions:
- issue: ‘एकमुख’ और ‘दोहरे मुख’ का नैतिक रूपक
  choice: दोनों अभिव्यक्तियों में ‘मुख’ का समान रूपक रखा गया
  alternative: ‘एकनिष्ठ’ और ‘कपटी’
  rationale: मूल यूनानी दोनों पदों के बीच शब्दगत विरोध स्थापित करता है। अधिक व्याख्यात्मक विकल्प उस साहित्यिक और नैतिक तनाव को मिटा देता।
- issue: प्रभु और बेलियार से संबंधित स्वर्गदूत
  choice: ‘प्रभु के स्वर्गदूतों तथा बेलियार के दूतों’
  alternative: ‘प्रभु और बेलियार के स्वर्गदूतों’ अथवा ‘प्रभु के स्वर्गदूतों और बेलियार पर’
  rationale: यूनानी में दूसरे संबंधसूचक पद के साथ ἀγγέλοις दोबारा नहीं आया, पर समानांतर संरचना उसका लोप मानने की अनुमति देती है। हिन्दी में अर्थगम्यता के लिए ‘दूतों’ जोड़ा गया, और पादटिप्पणी में रूपगत स्थिति बताई गई।
- issue: दुष्ट आत्मा और दुष्ट आत्मिक शक्ति के बीच संबंध
  choice: मानवीय आत्मा के लिए ‘आत्मा’ और यातना देने वाले के लिए ‘दुष्ट आत्मिक शक्ति’
  alternative: दोनों के लिए ‘आत्मा’
  rationale: यूनानी ψυχή और πνεῦμα में भेद करता है। हिन्दी में दोनों को केवल ‘आत्मा’ कहने से कर्ताओं में भ्रम होता; ‘आत्मिक शक्ति’ भेद स्पष्ट करता है, बिना उस सत्ता की पहचान को संप्रदायगत रूप से तय किए।
- issue: पद 6 में सर्वनामों और कर्ताओं की पहचान
  choice: पहला कर्ता विदा होती आत्मा, अंतिम कर्ता शांति का स्वर्गदूत
  alternative: आत्मा स्वयं अनन्त जीवन में प्रवेश करती है, या पूरा वाक्य किसी अन्य पाठ के अनुसार विस्तृत होता है
  rationale: उपलब्ध यूनानी में γινώσκει का कर्ता निकट संदर्भ की आत्मा है और εἰσφέρει αὐτόν में कर्ता स्वर्गदूत समझा जा सकता है, यद्यपि लिंग-संबंधी और पाठगत कठिनाई बनी रहती है। अनूदित पाठ इसे पठनीय बनाता है और पादटिप्पणी अनिश्चितता सुरक्षित रखती है।
- issue: अंग्रेज़ी परामर्श-पाठ में पद 6 के बाद की अतिरिक्त सामग्री
  choice: केवल प्रदत्त यूनानी स्रोत में उपस्थित 6:1–6 का अनुवाद
  alternative: अंग्रेज़ी POB में जारी पूरे अध्याय को अनूदित करना
  rationale: प्रदत्त मूल-भाषा पाठ पद 6 के इसी बिंदु पर समाप्त होता है। उसके बाद की अंग्रेज़ी सामग्री के लिए यहाँ मूल-भाषाई साक्ष्य उपलब्ध नहीं है, इसलिए उसे इस स्रोत-आधारित मसौदे में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपदेशात्मक शैली रखी गई है। ‘हे मेरे बच्चो’, ‘व्यवस्था’, ‘धार्मिकता’, ‘स्वर्गदूत’ और ‘अनन्त जीवन’ जैसे परिचित धार्मिक शब्द सामान्य पाठक के लिए बोधगम्य हैं। स्रोत के ‘मुख’ रूपक को जानबूझकर बनाए रखा गया है, जबकि अत्यधिक संस्कृतनिष्ठ या बोलचाल के अपमानसूचक विकल्पों से बचा गया है। पद-विभाजन दिया गया है।
