source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VI. Προσέχετε οὖν *καὶ ὑμεῖς, τέκνα μου¹, *τὰς ἐντολὰς² Κυρίου³ μονοπροσώπως *ἀκολουθοῦντες τῇ ἀληθείᾳ⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/001.yaml
  text: Therefore take heed, you also, my children, following the commandments of the Lord with singleness of purpose, in truth.
translation:
  language: hi
  text: इसलिए तुम भी, मेरे बच्चो, सावधान रहो और प्रभु की आज्ञाओं का एकनिष्ठ होकर और सच्चाई से पालन करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: सावधान रहो
  rationale: यह वर्तमानकालीन आज्ञार्थक क्रिया सजग रहने और ध्यान देने का आग्रह करती है; ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक और अर्थसंगत है।
- source_word: τὰς ἐντολὰς Κυρίου
  choice: प्रभु की आज्ञाओं पर चलो
  rationale: शाब्दिक रूप से ‘प्रभु की आज्ञाएँ’ है; ἀκολουθοῦντες के साथ हिन्दी में ‘आज्ञाओं पर चलना’ आज्ञापालन का स्वाभाविक बोध देता है।
- source_word: μονοπροσώπως
  choice: एकनिष्ठ होकर
  rationale: यह दुर्लभ क्रियाविशेषण एक ही लक्ष्य या अविभाजित उद्देश्य की ओर उन्मुखता बताता है; ‘एकनिष्ठ होकर’ उस एकाग्र और निष्कपट प्रतिबद्धता को संक्षेप में व्यक्त करता है।
- source_word: ἀκολουθοῦντες τῇ ἀληθείᾳ
  choice: सत्य का अनुसरण करते हुए
  rationale: दत्तिव τῇ ἀληθείᾳ को ἀκολουθέω के पूरक के रूप में लेकर ‘सत्य का अनुसरण’ किया गया है, जिससे यूनानी वाक्य का व्याकरणिक संबंध बना रहता है।
theological_decisions:
- issue: ἀκολουθοῦντες का ‘आज्ञाओं’ और ‘सत्य’ से संबंध
  choice: ‘सत्य का अनुसरण करते हुए’ को मुख्य कृदंत-वाक्यांश रखा और ‘आज्ञाओं पर चलो’ द्वारा आज्ञापालन व्यक्त किया।
  alternative: ‘एकनिष्ठ होकर प्रभु की आज्ञाओं का अनुसरण करो, सत्य में’
  rationale: यूनानी में ἀκολουθοῦντες के बाद दत्तिव τῇ ἀληθείᾳ सीधे उसके साथ जुड़ सकता है, जबकि τὰς ἐντολὰς कर्मकारक है। प्रस्तुत हिन्दी दोनों तत्वों—प्रभु की आज्ञाओं का पालन और सत्य का अनुसरण—को सुरक्षित रखती है, बिना ‘सत्य में’ जैसे अस्पष्ट वाक्यांत को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली। ‘मेरे बच्चो’ आत्मीय संबोधन को बनाए रखता है; ‘एकनिष्ठ’ सामान्य पाठक के लिए बोधगम्य रहते हुए μονοπροσώπως की उद्देश्यगत एकता व्यक्त करता है।
