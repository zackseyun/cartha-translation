review_pass:
  verdict: revise
  source_fidelity: Draft retains the principal exhortation, the children-address, the Lord's commandments, and the sense of undivided commitment. However, it makes ‘truth’ the object of ‘follow’ (‘सत्य का अनुसरण’) while recasting the commandments as the object of a separate idiom (‘आज्ञाओं पर चलो’). In the Greek sequence, τὰς ἐντολὰς Κυρίου is the explicit accusative associated with ἀκολουθοῦντες, while τῇ ἀληθείᾳ is best retained as the concluding dative expression, ‘in truth / sincerely.’
  naturalness: The draft is fluent modern Hindi, but ‘सत्य का अनुसरण करते हुए ... आज्ञाओं पर चलो’ reverses the clearer source-level relationship. The revision is direct, idiomatic, and suitably exhortative.
  terminology: ‘प्रभु,’ ‘आज्ञाएँ,’ and ‘एकनिष्ठ’ are appropriate. ‘सच्चाई से’ renders the final τῇ ἀληθείᾳ naturally without forcing a technical or doctrinal interpretation.
  issues:
  - severity: medium
    issue: The syntactic roles of ‘the commandments’ and ‘truth’ have been shifted.
    rationale: The draft says ‘सत्य का अनुसरण’ and treats ‘प्रभु की आज्ञाओं’ through the separate Hindi expression ‘आज्ञाओं पर चलो.’ The Greek explicitly places ‘the commandments of the Lord’ as the accusative complement of following, with τῇ ἀληθείᾳ retained as a dative final qualifier. A revision better preserves both elements and their relative force.
  revised_text: इसलिए तुम भी, मेरे बच्चो, सावधान रहो और प्रभु की आज्ञाओं का एकनिष्ठ होकर और सच्चाई से पालन करो।
  revised_footnotes: []
  revision_rationale: The revision keeps the imperative exhortation natural in Hindi while making ‘प्रभु की आज्ञाओं’ the direct content of obedience/following. ‘एकनिष्ठ होकर’ conveys μονοπροσώπως, and ‘सच्चाई से’ preserves the concise final ‘in truth’ without over-interpreting the dative expression.
