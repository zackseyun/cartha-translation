- from: इसलिए तुम भी, मेरे बच्चो, सावधान रहो और एकनिष्ठ होकर सत्य का अनुसरण करते हुए प्रभु की आज्ञाओं पर चलो।
  to: इसलिए तुम भी, मेरे बच्चो, सावधान रहो और प्रभु की आज्ञाओं का एकनिष्ठ होकर और सच्चाई से पालन करो।
  rationale: The revision keeps the imperative exhortation natural in Hindi while making ‘प्रभु की आज्ञाओं’ the direct content of obedience/following. ‘एकनिष्ठ होकर’ conveys μονοπροσώπως, and ‘सच्चाई से’ preserves the concise final ‘in truth’ without over-interpreting the dative expression.
