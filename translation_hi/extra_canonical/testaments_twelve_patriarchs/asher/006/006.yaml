id: T12P.ASH.6.6
reference: Testament of Asher 6:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν δὲ *ἔστω ἥσυχος²⁸ *ἐν χαρᾷ²⁹ †γνωρίζει³⁰ τὸν ἄγγελον τῆς εἰρήνης, *καὶ εἰσφέρει αὐτὸν εἰς ζωὴν αἰώνιον³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/006.yaml
  text: But if it is at rest in joy, it recognizes the angel of peace, and he brings it into eternal life.
translation:
  language: hi
  text: पर यदि वह आनंद में शांत रहे, तो वह शांति के दूत को पहचानती है, और शांति का दूत उसे अनन्त जीवन में ले जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में अंतिम क्रिया का कर्ता व्यक्त नहीं है और सर्वनाम αὐτόν पुल्लिंग है। इसलिए व्याकरणिक क्रम से यह अर्थ भी निकल सकता है: “और वह [आत्मा] उसे [दूत को] अनन्त जीवन में ले जाती है।” मुख्य पाठ संदर्भानुकूल अर्थ देता है कि शांति का दूत आत्मा को अनन्त जीवन में ले जाता है।'
    reason: अंतिम उपवाक्य में उपलब्ध यूनानी पाठ की कर्ता-कर्म संबंधी कठिनाई और वैकल्पिक व्याकरणिक पठन सुरक्षित रखना, जबकि मुख्य पाठ में संदर्भानुकूल अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: ἥσυχος
  choice: शांत
  rationale: यह शब्द स्थिर, निश्चल या शांत होने का भाव देता है; ‘शांत’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ मनःस्थिति को स्पष्ट करता है।
- source_word: ἐν χαρᾷ
  choice: आनन्द में
  rationale: ग्रीक पूर्वसर्गीय पद का निकट और स्वाभाविक रूप, जो शांति और आनन्द के संयुक्त भाव को बनाए रखता है।
- source_word: γνωρίζει
  choice: पहचानती है
  rationale: यहाँ अर्थ केवल जानकारी रखने का नहीं, ‘शान्ति के दूत’ को पहचानने का है। स्त्रीलिंग क्रिया निहित ‘आत्मा’ के संदर्भ को दर्शाती है।
- source_word: τὸν ἄγγελον τῆς εἰρήνης
  choice: शान्ति के दूत को
  rationale: ἄγγελος के लिए ‘दूत’ धार्मिक साहित्य में परिचित और व्यापक शब्द है; संबंधकारक को ‘शान्ति के’ से सीधे व्यक्त किया गया है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: ग्रीक पद का मानक, स्पष्ट और धर्मवैचारिक रूप से तटस्थ हिन्दी रूप।
theological_decisions:
- issue: अन्तिम उपवाक्य में कर्ता और कर्म की पहचान
  choice: मुख्य पाठ में ‘वह उसे’ द्वारा शान्ति के दूत को कर्ता और आत्मा को कर्म समझा गया है।
  alternative: 'वर्तमान ग्रीक पाठ को व्याकरणिक क्रम में पढ़ने पर निहित आत्मा कर्ता हो सकती है और पुल्लिंग αὐτόν का संकेत दूत की ओर हो सकता है: ‘वह उसे [दूत को] अनन्त जीवन में ले जाती है।’'
  rationale: प्राप्त ग्रीक वाक्य पाठगत रूप से कठिन है। सन्दर्भ और परामर्श-पाठ उस अर्थ का समर्थन करते हैं जिसमें शान्ति का दूत आत्मा को अनन्त जीवन में ले जाता है; फिर भी वास्तविक ग्रीक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण धार्मिक गद्य। ‘आनन्द’, ‘शान्ति का दूत’ और ‘अनन्त जीवन’ जैसे परिचित पद रखे गए हैं। निहित आत्मा के लिए स्त्रीलिंग ‘पहचानती है’ प्रयुक्त है; अंतिम ‘वह उसे’ मूल की सर्वनामगत कठिनाई को अनावश्यक विस्तार के बिना बनाए रखता है।
