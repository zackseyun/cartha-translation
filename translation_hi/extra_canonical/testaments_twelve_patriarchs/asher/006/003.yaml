id: T12P.ASH.6.3
reference: Testament of Asher 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Ὑμεῖς οὖν, τέκνα μου⁷ᵃ, τὸν νόμον Κυρίου⁹ φυλάξατε· καὶ¹⁰ μὴ προσέχετε *τῷ κακῷ ὡς καλῷ¹¹, ἀλλὰ κατὰ¹² τὸ ὄντως⁹ καλὸν¹³ ἀποβλέπετε, καὶ διατηρεῖτε αὐτὸ ἐν πάσαις ταῖς¹⁴ ἐντολαῖς Κυρίου, εἰς αὐτὸ¹⁵ ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/003.yaml
  text: You therefore, my children, keep the law of the Lord, and do not look upon evil as good; but look instead to what is truly good, and keep it in all the commandments of the Lord, turning toward it and resting in it.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, प्रभु की व्यवस्था का पालन करो। बुराई को भलाई समझकर उस पर ध्यान मत दो, बल्कि जो सचमुच भला है उसी की ओर दृष्टि लगाए रखो। प्रभु की सभी आज्ञाओं में उसे थामे रहो, उसी की ओर मुड़ते और उसी में विश्राम करते रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: पालन करो
  rationale: व्यवस्था के संदर्भ में ‘रक्षा करो’ की अपेक्षा ‘पालन करो’ स्वाभाविक हिन्दी है और आज्ञा को सँभालकर मानने का भाव व्यक्त करता है।
- source_word: μὴ προσέχετε τῷ κακῷ ὡς καλῷ
  choice: बुराई को भलाई समझकर उस पर ध्यान मत दो
  rationale: προσέχετε के ध्यान लगाने/मन देने के अर्थ और ὡς καλῷ के ‘भलाई के रूप में’ भाव, दोनों को स्पष्ट रखा गया है।
- source_word: τὸ ὄντως καλὸν ἀποβλέπετε
  choice: जो सचमुच भला है उसी की ओर दृष्टि लगाए रखो
  rationale: ὄντως की वास्तविकता पर दी गई शक्ति तथा ἀποβλέπετε के लक्ष्य करके देखने के निरंतर भाव को सुरक्षित रखता है।
- source_word: διατηρεῖτε αὐτό
  choice: उसे थामे रहो
  rationale: διατηρέω के सावधानी से बनाए रखने/सुरक्षित रखने का भाव सहज हिन्दी में व्यक्त होता है; सर्वनाम का संदर्भ ‘जो सचमुच भला है’ ही रहने दिया गया है।
- source_word: εἰς αὐτὸ ἀναστρεφόμενοι
  choice: उसी की ओर मुड़ते रहो
  rationale: εἰς के दिशात्मक अर्थ को प्रमुखता दी गई है। ἀναστρέφω में आचरण करने का अर्थ भी संभव है, पर यहाँ अंग्रेज़ी परामर्श-पाठ और पूर्वसर्ग मिलकर ‘ओर मुड़ना’ का समर्थन करते हैं।
- source_word: ἐν αὐτῷ καταπαύοντες
  choice: उसी में विश्राम करते रहो
  rationale: καταπαύω के ठहरने/विश्राम करने के अर्थ को सीधा रखा गया है और ἐν का ‘में’ सुरक्षित है।
theological_decisions:
- issue: αὐτό (‘उसे/उसी’) का संदर्भ
  choice: सर्वनाम को ‘जो सचमुच भला है’ से संबद्ध रखते हुए दोहराया गया
  alternative: इसे ‘प्रभु’ या ‘प्रभु की व्यवस्था’ के रूप में स्पष्ट करना
  rationale: ग्रीक में नपुंसकलिंग αὐτό निकटवर्ती τὸ ... καλόν की ओर संकेत करता है। इसे किसी विशिष्ट धार्मिक तात्पर्य में बदलना मूल की व्याकरणिक दिशा और उसकी संभावित वैचारिक व्यापकता को संकरा कर देता।
- issue: ἀναστρεφόμενοι का अर्थ
  choice: उसी की ओर मुड़ते रहो
  alternative: उसी के अनुसार आचरण करते रहो
  rationale: क्रिया में ‘आचरण करना/जीवन बिताना’ संभव है, किंतु εἰς αὐτό दिशात्मक पाठ का समर्थन करता है। वास्तविक भलाई की ओर उन्मुख होने और उसमें विश्राम करने की समानांतर संरचना भी इस चुनाव के अनुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक बहुवचन संबोधन अपनाया गया है। ‘मेरे बच्चो’ में संबोधन-रूप की मानक वर्तनी रखी गई है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए मूल के लंबे वाक्य को तीन वाक्यों में बाँटा गया, जबकि तर्कक्रम और पुनरुक्त सर्वनाम सुरक्षित रखे गए हैं।
