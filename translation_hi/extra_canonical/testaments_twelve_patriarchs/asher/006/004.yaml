source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι τὰ τέλη τῶν ἀνθρώπων δεικνύουσι¹⁷ τὴν δικαιοσύνην αὐτῶν¹⁸, *καὶ †γνωρίζονται¹⁹ *τοῖς ἀγγέλοις²⁰ Κυρίου, καὶ τοῦ Βελίαρ²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/004.yaml
  text: For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and to Beliar.
translation:
  language: hi
  text: क्योंकि मनुष्यों के अंत उनकी धार्मिकता प्रकट करते हैं, और वे प्रभु के तथा बेलियार के स्वर्गदूतों को ज्ञात होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ τέλη
  choice: अंतिम परिणाम
  rationale: बहुवचन पद केवल मृत्यु के क्षण नहीं, बल्कि जीवन के अंत में प्रकट होने वाले परिणाम या परिणति को भी सूचित कर सकता है; ‘अंतिम परिणाम’ इस अर्थ-क्षेत्र को स्वाभाविक हिन्दी में रखता है।
- source_word: τὴν δικαιοσύνην αὐτῶν
  choice: उनकी धार्मिकता
  rationale: δικαιοσύνη यहाँ नैतिक धार्मिकता/सही आचरण का भाव रखता है; ‘धार्मिकता’ पाठ की धर्मवैचारिक गंभीरता को बनाए रखता है।
- source_word: γνωρίζονται
  choice: ज्ञात हो जाते हैं
  rationale: मध्य/कर्मवाच्य रूप को बिना यह जोड़े व्यक्त किया गया है कि उन्हें कौन सक्रिय रूप से प्रकट करता है।
- source_word: τοῖς ἀγγέλοις Κυρίου, καὶ τοῦ Βελίαρ
  choice: प्रभु के स्वर्गदूतों और बेलियार के स्वर्गदूतों को
  rationale: दोनों संबंधवाचक पदों को ‘स्वर्गदूतों’ से जोड़ा गया है; दूसरे स्थान पर संज्ञा की पुनरावृत्ति हिन्दी में संबंध स्पष्ट करती है और बेलियार को स्वयं समानांतर प्राप्तकर्ता मानने से बचाती है।
theological_decisions:
- issue: ‘प्रभु’ और ‘बेलियार’ के साथ स्वर्गदूतों का संबंध
  choice: दोनों के अपने-अपने स्वर्गदूत
  alternative: प्रभु के स्वर्गदूत और स्वयं बेलियार
  rationale: यूनानी में Κυρίου और τοῦ Βελίαρ दोनों संबंधकारक हैं और τοῖς ἀγγέλοις पर निर्भर होना व्याकरणतः सबसे सीधा पाठ है; इसलिए अंग्रेज़ी परामर्श-पाठ की व्याख्या के बजाय मूल संरचना का अनुसरण किया गया है।
- issue: γνωρίζονται का कर्ता
  choice: ‘वे’ रखकर संदर्भगत अस्पष्टता सुरक्षित रखी गई
  alternative: स्पष्ट रूप से ‘मनुष्य’ या ‘अंतिम परिणाम’ कहना
  rationale: यूनानी बहुवचन रूप निकटवर्ती ‘अंतिम परिणामों’ की ओर लौट सकता है, जबकि अर्थगत रूप से मनुष्यों की ओर संकेत भी समझा जा सकता है; हिन्दी सर्वनाम इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बेलियार’ को प्राचीन नाम के रूप में लिप्यंतरित किया गया है।
