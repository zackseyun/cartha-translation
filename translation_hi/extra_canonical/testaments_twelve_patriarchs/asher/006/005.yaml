revisions:
- from: क्योंकि जब कोई दुष्ट आत्मा चली जाती है, तब वह उस दुष्ट आत्मा से यातना पाती है, जिसकी वह बुरी अभिलाषाओं और बुरे कामों में दासी बनी रही थी।
  to: क्योंकि जब किसी दुष्ट व्यक्ति की आत्मा चली जाती है, तब उसे दुष्टात्मा यातना देती है, जिसकी वह बुरी अभिलाषाओं और बुरे कामों में दासी थी।
  rationale: The revision preserves the restrained “departs” language, retains the Greek's active sense that the soul was subject to/served the evil spirit, and distinguishes the human soul from the evil spirit in clear modern Hindi. “किसी दुष्ट व्यक्ति की आत्मा” makes explicit the possessive sense naturally implicit in the Greek phrase without identifying departure more narrowly as death.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:30:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly takes ἐδούλευεν as active, with the departing soul as the implied subject and the evil spirit (ὃ) as the object: the soul served/was enslaved to that spirit. This is closer to the Greek than the English audit trail''s interpretive “enslaved it.” However, rendering both ψυχή and πνεῦμα as “आत्मा” obscures the source''s distinction and produces the misleading phrase “उस दुष्ट आत्मा.”'
  naturalness: The sentence is generally fluent, but repeating “दुष्ट आत्मा” for two distinct referents makes the Hindi unclear. “दुष्टात्मा” is a concise, established-style designation for an evil spirit and distinguishes it from a person's soul.
  terminology: Render ψυχή as “आत्मा” and πνεῦμα as “दुष्टात्मा” here. “दासी थी” accurately expresses the continuing state denoted by the imperfect ἐδούλευεν without introducing the additional inceptive nuance of “बनी रही थी.”
  issues:
  - severity: medium
    issue: ψυχή and πνεῦμα are both translated “आत्मा.”
    rationale: The Greek intentionally uses different terms, “soul” and “spirit.” The identical Hindi rendering creates referential ambiguity and makes the agent of torment appear to be the same “wicked soul.”
  - severity: low
    issue: “दासी बनी रही थी” adds a becoming/remained nuance.
    rationale: ἐδούλευεν denotes ongoing service or slavery. “दासी थी” conveys the enduring relation more directly in this context.
  revised_text: क्योंकि जब किसी दुष्ट व्यक्ति की आत्मा चली जाती है, तब उसे दुष्टात्मा यातना देती है, जिसकी वह बुरी अभिलाषाओं और बुरे कामों में दासी थी।
  revised_footnotes: []
  revision_rationale: The revision preserves the restrained “departs” language, retains the Greek's active sense that the soul was subject to/served the evil spirit, and distinguishes the human soul from the evil spirit in clear modern Hindi. “किसी दुष्ट व्यक्ति की आत्मा” makes explicit the possessive sense naturally implicit in the Greek phrase without identifying departure more narrowly as death.
