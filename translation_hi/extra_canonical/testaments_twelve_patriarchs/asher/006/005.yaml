source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτε²² γὰρ †πονηρὰ²³ ἡ ψυχὴ ἀπέρχεται²⁴, βασανίζεται ὑπὸ τοῦ πονηροῦ πνεύματος, *ὃ καὶ²⁵ ἐδούλευεν²⁶ ἐν ἐπιθυμίαις²⁷ καὶ ἔργοις πονηροῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/005.yaml
  text: For when a wicked soul departs, it is tormented by the evil spirit, which also enslaved it in lusts and wicked deeds.
translation:
  language: hi
  text: क्योंकि जब किसी दुष्ट व्यक्ति की आत्मा चली जाती है, तब उसे दुष्टात्मा यातना देती है, जिसकी वह बुरी अभिलाषाओं और बुरे कामों में दासी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρὰ ἡ ψυχὴ
  choice: दुष्ट आत्मा
  rationale: ψυχή यहाँ मनुष्य की मृत्यु के समय विदा होने वाली आत्मा को दर्शाता है; ‘दुष्ट’ उसके नैतिक चरित्र को बनाए रखता है।
- source_word: ἀπέρχεται
  choice: चली जाती है
  rationale: मूल में केवल ‘विदा होना/चले जाना’ है; अनुवाद इसे स्पष्ट रूप से ‘मरना’ कहकर निहित अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὑπὸ τοῦ πονηροῦ πνεύματος
  choice: उस दुष्ट आत्मा से
  rationale: ὑπό के साथ कर्ता-सूचक भाव को स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है। ψυχή और πνεῦμα का हिन्दी में समान रूप ‘आत्मा’ होना संदर्भगत पुनरुक्ति पैदा करता है, पर ‘आत्मिक सत्ता’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: ἐδούλευεν
  choice: दासी बनी रही थी
  rationale: सक्रिय अपूर्णकालीन क्रिया का मूल भाव ‘दास होकर सेवा करना/अधीन रहना’ है। यह जारी रही दासता को व्यक्त करता है; इसे सकर्मक ‘उसने दास बनाया’ कहना यूनानी रूप से पुष्ट नहीं है।
- source_word: ἐν ἐπιθυμίαις καὶ ἔργοις πονηροῖς
  choice: बुरी अभिलाषाओं और बुरे कामों में
  rationale: ἐν का क्षेत्रगत भाव बनाए रखते हुए ἐπιθυμίαις को नैतिक संदर्भ में ‘बुरी अभिलाषाएँ’ और ἔργοις को सामान्य, सुबोध ‘काम’ कहा गया है।
theological_decisions:
- issue: दुष्ट आत्मा और दुष्ट प्रेतात्मा के बीच संबंध
  choice: मनुष्य की आत्मा को उस दुष्ट आत्मा की दासी के रूप में प्रस्तुत किया गया है।
  alternative: दुष्ट आत्मा ने मनुष्य की आत्मा को दास बनाया था।
  rationale: ὃ को संबंधवाचक कर्म और ψυχή को ἐδούλευεν का अंतर्निहित कर्ता समझना क्रिया के सक्रिय रूप और उसके सामान्य ‘दास होकर सेवा करना’ अर्थ के अधिक निकट है। अंग्रेज़ी परामर्श-पाठ का ‘enslaved it’ अर्थगत रूप से संभव व्याख्या देता है, पर यूनानी क्रियारूप का सीधा प्रतिनिधित्व नहीं करता।
- issue: आत्मा के चले जाने का अर्थ
  choice: ‘चली जाती है’ कहकर मृत्यु का संकेत निहित रहने दिया गया है।
  alternative: ‘मर जाती है’ या ‘देह छोड़ देती है’।
  rationale: मूल पाठ देह या मृत्यु का स्पष्ट उल्लेख नहीं करता; इसलिए उसकी अभिव्यक्ति की व्यापकता और संयम सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दासी बनी रही थी’ स्त्रीलिंग ‘आत्मा’ से व्याकरणिक सामंजस्य रखता है और अपूर्णकाल की निरंतरता भी व्यक्त करता है।
