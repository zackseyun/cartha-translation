  text: Ὅτι οἱ διπρόσωποι δισσῶς †κολάζονται⁵, ⌜Ὅτι καὶ πράσσουσι τὸ κακόν, καὶ συνευδοκοῦσι τοῖς πράσσουσιν⁶, *μιμούμενοι τὰ πνεύματα τῆς πλάνης καὶ κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι⁷.⌝
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/002.yaml
  text: For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against men.
translation:
  language: hi
  text: क्योंकि दो-मुँहे लोग दोगुना दंड पाते हैं[a], क्योंकि वे बुराई भी करते हैं और बुराई करने वालों का अनुमोदन भी करते हैं, छल की आत्माओं का अनुकरण करते हुए और मनुष्यों के विरुद्ध संघर्ष करते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-संपादक ‘दंड पाते हैं’ के लिए दिए गए यूनानी शब्द को पाठ की दृष्टि से संदिग्ध मानते हैं।
    reason: प्रदत्त यूनानी पाठ में κολάζονται के पहले क्रिटिकल डैगर और संबद्ध फुटनोट-संकेत हैं, जो पाठगत अनिश्चितता दर्शाते हैं।
lexical_decisions:
- source_word: διπρόσωποι
  choice: दोहरे चेहरे वाले लोग
  rationale: शाब्दिक ‘दो-मुँहे’ अर्थ को बनाए रखते हुए ऐसे लोगों का बोध कराता है जिनका आचरण दोहरा है; संदर्भ में केवल सामान्य ‘कपटी’ कहने से मूल रूपक खो जाता।
- source_word: δισσῶς
  choice: दुगना
  rationale: διπρόσωποι के ‘दोहरे’ भाव और दण्ड की द्विगुणता के बीच मूल शब्द-क्रीड़ा को यथासंभव सुरक्षित रखता है।
- source_word: κολάζονται
  choice: दण्ड पाते हैं
  rationale: मध्य/कर्मवाच्य रूप का स्वाभाविक हिन्दी प्रतिरूप; पाठ में कर्ता निर्दिष्ट किए बिना दण्डित होने का अर्थ देता है।
- source_word: συνευδοκοῦσι
  choice: सहमत भी होते हैं
  rationale: बुराई करने वालों के कार्य को अनुमोदन या समर्थन देने का भाव व्यक्त करता है; मात्र निष्क्रिय जानकारी नहीं।
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: भरमाने वाली आत्माएँ
  rationale: γενitive पदबंध को स्वाभाविक हिन्दी में सक्रिय गुण के रूप में प्रस्तुत करता है; πλάνη में भ्रम, भटकाव और छल का अर्थक्षेत्र है।
- source_word: συναγωνιζόμενοι
  choice: उनके साथ मिलकर संघर्ष करते हैं
  rationale: συν- के ‘साथ मिलकर’ और ἀγωνίζομαι के ‘संघर्ष करना’ दोनों घटकों को व्यक्त करता है; निहित सहयोद्धाओं का संकेत निकटवर्ती आत्माओं की ओर है।
theological_decisions:
- issue: ‘भरमाने वाली आत्माओं’ की पहचान
  choice: मूल के सामान्य बहुवचन को बनाए रखा गया
  alternative: उन्हें स्पष्ट रूप से ‘दुष्टात्माएँ’ या ‘शैतानी आत्माएँ’ कहना
  rationale: मूल τὰ πνεύματα τῆς πλάνης उनकी भूमिका बताता है, पर कोई अधिक विशिष्ट धार्मिक वर्गीकरण नहीं देता।
- issue: दण्ड देने वाला कर्ता
  choice: ‘दण्ड पाते हैं’ द्वारा कर्ता अनिर्दिष्ट रखा गया
  alternative: ‘परमेश्वर उन्हें दुगना दण्ड देता है’
  rationale: ग्रीक कर्मवाच्य में दण्डदाता का नाम नहीं है; उसे जोड़ना मूल की अंतर्निहित अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘दोहरे चेहरे’ और ‘दुगना’ के माध्यम से यूनानी की शब्द-क्रीड़ा बचाई गई है। अर्धविराम से कारण के भीतर आचरण और आत्मिक सहभागिता के संबंध को स्पष्ट रखा गया है।
