  verdict: revise
  source_fidelity: Draft accurately conveys the overall sequence and the uprooting metaphor. However, Δίκαια is more specifically ‘righteous/just things’ than the broad ‘जो कुछ सही है,’ and ἀνατρέπει more directly denotes overturning or overthrowing than ‘परास्त कर देती है.’
  naturalness: The draft is generally fluent modern Hindi. The revision retains its clear syntax while using ‘धर्मसंगत बातों’ and ‘ध्वस्त’ for more precise, idiomatic expression.
  terminology: ‘धर्मसंगत’ conveys the ethical force of Δίκαια without imposing a sectarian theological sense. ‘दुष्टता,’ ‘बुराई,’ and ‘पाप’ appropriately distinguish the Greek terms while preserving the source’s rhetorical progression.
  issues:
  - severity: medium
    issue: Δίκαια rendered as ‘जो कुछ सही है’
    rationale: This is intelligible but somewhat generic; the Greek has a marked ethical sense, ‘righteous’ or ‘just things.’ ‘धर्मसंगत बातों’ better preserves that force.
  - severity: medium
    issue: ἀνατρέπει rendered as ‘परास्त कर देती है’
    rationale: ‘परास्त’ expresses defeat, whereas the verb’s concrete image is overturning/overthrowing. ‘ध्वस्त कर देती है’ more closely reflects the destructive-overturning sense in natural Hindi.
  revised_text: क्योंकि धर्मसंगत बातों पर विचार करके और दुष्टता को त्यागकर, वह तुरंत बुराई को ध्वस्त कर देती है और पाप को जड़ से उखाड़ देती है।
  revised_footnotes: []
