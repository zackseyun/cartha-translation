base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/007.yaml
  text: For by considering what is righteous and casting away wickedness, it at once overturns evil and uproots sin.
translation:
  language: hi
  text: क्योंकि धर्मसंगत बातों पर विचार करके और दुष्टता को त्यागकर, वह तुरंत बुराई को ध्वस्त कर देती है और पाप को जड़ से उखाड़ देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαια
  choice: जो कुछ सही है
  rationale: नपुंसकलिंग बहुवचन का अर्थ यहाँ ‘सही/धर्मसंगत बातें’ है; यह रूप किसी अमूर्त धार्मिक पद की अपेक्षा सामान्य आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: λογιζομένη
  choice: विचार करके
  rationale: मध्यवाच्य स्त्रीलिंग कृदन्त का आशय मन में विचार करने या ध्यान में रखने से है; हिन्दी में पूर्वकालिक क्रिया मुख्य क्रिया से इसका संबंध स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀπορρίπτουσα
  choice: त्यागकर
  rationale: शब्द का मूल भाव दूर फेंकने या अस्वीकार करने का है; ‘त्यागकर’ दुष्टता से निर्णायक अलगाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀνατρέπει
  choice: परास्त कर देती है
  rationale: यूनानी क्रिया का शाब्दिक भाव उलट देने या गिरा देने का है; ‘परास्त कर देती है’ बुराई के संदर्भ में परिणाम को स्वाभाविक और सशक्त हिन्दी में रखता है।
- source_word: ἐκριζοῖ
  choice: जड़ से उखाड़ देती है
  rationale: यह मूल रूपक को सीधे सुरक्षित रखता है और पाप के पूर्ण उन्मूलन का भाव व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग कृदन्तों में निहित कर्ता
  choice: वह
  alternative: कर्ता को स्पष्ट नाम से दोहराना
  rationale: इस पद में कर्ता प्रत्यक्ष रूप से नहीं दिया गया, पर स्त्रीलिंग कृदन्त पूर्ववर्ती संदर्भ की स्त्रीलिंग संज्ञा की ओर संकेत करते हैं। ‘वह’ मूल की संदर्भ-निर्भरता और अस्पष्टता को बनाए रखता है।
- issue: Δίκαια का नैतिक अर्थ
  choice: जो कुछ सही है
  alternative: धार्मिकता की बातें
  rationale: मूल शब्द नैतिक रूप से उचित बातों को सूचित करता है, पर किसी विशिष्ट सांप्रदायिक या व्यवस्थित धर्मवैज्ञानिक अर्थ को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह’ के स्त्रीलिंग क्रियारूप मूल यूनानी के स्त्रीलिंग कृदन्तों को प्रतिबिंबित करते हैं और कर्ता की पहचान को पूर्ववर्ती संदर्भ पर निर्भर रहने देते हैं।
