  language: hi
  text: इसलिए सब कुछ दोहरा है—एक-दूसरे के सामने।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: ग्रीक पदबंध निष्कर्ष या परिणाम को व्यक्त करता है; आधुनिक हिन्दी में ‘इसलिए’ इसका सहज और सटीक रूप है।
- source_word: πάντα
  choice: सभी वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन यहाँ व्यापक अर्थ में ‘सब वस्तुओं/बातों’ को दर्शाता है; ‘सभी वस्तुएँ’ कथन की सार्वभौमिकता बनाए रखता है।
- source_word: δύο εἰσίν
  choice: दो प्रकार की हैं
  rationale: शाब्दिक ‘दो हैं’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा। प्रसंगगत द्विविधता को बिना उसका स्वरूप निर्धारित किए ‘दो प्रकार की’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: एक-दूसरे के आमने-सामने
  rationale: κατέναντι विरोधी या सम्मुख स्थिति बताता है। यह रूप परस्पर आमने-सामने होने का भाव सुरक्षित रखता है और केवल नैतिक विरोध का अर्थ थोपता नहीं।
theological_decisions:
- issue: द्विविधता का स्वरूप
  choice: ‘दो प्रकार की’ कहकर कथन को सामान्य और अनिर्धारित रखा गया
  alternative: ‘दो विरोधी पक्षों में बँटी हैं’
  rationale: मूल पाठ दोपन और आमने-सामने की स्थिति बताता है, पर यहाँ यह स्पष्ट नहीं करता कि हर जोड़ी पूर्णतः नैतिक, तत्त्वमीमांसक या शत्रुतापूर्ण विरोध है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। उपलब्ध ग्रीक पाठ को प्राथमिक माना गया है; नवीनतम संशोधन में दिया गया असंबद्ध वाक्य इस पद के ग्रीक स्रोत से मेल नहीं खाता, इसलिए उसे नहीं अपनाया गया।
