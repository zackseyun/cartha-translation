id: T12P.ASH.1.6
reference: Testament of Asher 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν οὖν²⁶ ἡ ψυχὴ θέλει²⁷ *†καλῶς πορευθῆναι†, πάσας τὰς πράξεις αὐτῆς ποιεῖ²⁸ ἐν δικαιοσύνῃ, *κἂν ἁμάρτῃ²⁹ εὐθὺς³⁰ μετανοεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
translation:
  language: hi
  text: इसलिए, यदि आत्मा अच्छी तरह चलना चाहती है[a], तो वह अपने सारे काम धार्मिकता से करती है; और यदि वह पाप करे भी, तो तुरंत पश्चाताप करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यह पदबंध पाठगत अनिश्चितता के चिह्नों के बीच दिया गया है; इसका शाब्दिक अर्थ ‘अच्छी तरह चलना’ है।
    reason: मूल संस्करण καλῶς πορευθῆναι को क्रिटिकल डैगरों के बीच रखता है; पाठगत अनिश्चितता को पाठक से छिपाया नहीं जाना चाहिए।
lexical_decisions:
- source_word: ψυχὴ
  choice: आत्मा
  rationale: यहाँ व्यक्ति के भीतर इच्छा और नैतिक निर्णय करनेवाले पक्ष का उल्लेख है; ‘आत्मा’ आधुनिक हिन्दी में इसका स्वाभाविक और पर्याप्त रूप है।
- source_word: θέλει
  choice: चाहती है
  rationale: साधारण इच्छा व्यक्त करनेवाली यूनानी क्रिया का सीधा और सहज अनुवाद।
- source_word: καλῶς πορευθῆναι
  choice: सही ढंग से चलना
  rationale: πορεύομαι के ‘चलना’ रूपक को बनाए रखते हुए καλῶς को स्वाभाविक हिन्दी में व्यक्त किया गया है; संदर्भ नैतिक जीवन-चाल का है।
- source_word: πράξεις
  choice: काम
  rationale: ‘काम’ सामान्य पाठक के लिए स्वाभाविक है और व्यक्ति के सभी कार्यों को समेटता है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता से
  rationale: δικαιοσύνη के नैतिक अर्थ—सही और न्यायपूर्ण आचरण—को पारंपरिक किंतु समझ में आनेवाले शब्द ‘धार्मिकता’ से व्यक्त किया गया है।
- source_word: κἂν ἁμάρτῃ
  choice: यदि वह पाप कर भी बैठे
  rationale: κἄν की concessive छाया (‘यदि…भी’) को रखा गया है; ‘कर बैठे’ संभावित चूक को सहज हिन्दी में व्यक्त करता है।
- source_word: εὐθὺς μετανοεῖ
  choice: तुरंत पश्चाताप करती है
  rationale: εὐθύς की तात्कालिकता और μετανοέω के मन-परिवर्तन/पश्चाताप के अर्थ को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: आत्मा के धर्ममय आचरण और संभावित पाप के बीच तनाव
  choice: ‘यदि वह पाप कर भी बैठे’
  alternative: ‘वह पाप नहीं करती’ या पाप की संभावना को कमज़ोर करना
  rationale: पाठ स्वयं धर्ममय आचरण के साथ पाप की वास्तविक संभावना और तत्काल पश्चाताप को रखता है; इस तनाव को बिना व्यवस्थित धर्मशास्त्रीय समाधान जोड़े सुरक्षित रखा गया है।
- issue: ‘धार्मिकता’ का आशय
  choice: व्यापक नैतिक धार्मिकता
  alternative: किसी विशेष मत की आरोपित या घोषित धार्मिकता
  rationale: संदर्भ कर्मों के चरित्र का है; इसलिए किसी संप्रदायगत धार्मिक सिद्धांत को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल वाक्य-विन्यास। ‘चलना’ के नैतिक रूपक को बनाए रखा गया है और स्त्रीलिंग क्रियाएँ ‘आत्मा’ के व्याकरणिक लिंग के अनुसार हैं।
