source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Δύο ὁδοὺς *ἔδωκεν ὁ Θεὸς τοῖς υἱοῖς τῶν ἀνθρώπων¹⁴, καὶ δύο διαβούλια, ⌜καὶ δύο πράξεις, *καὶ δύο τρόπους¹⁵⌝, *καὶ ⌜δύο⌝ τέλεα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/003.yaml
  text: God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two ends.
translation:
  language: hi
  text: परमेश्वर ने मनुष्यों को दो मार्ग, दो अभिप्राय, दो कर्म, दो ढंग और दो अंत दिए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδοὺς
  choice: मार्ग
  rationale: यह नैतिक जीवन-पथों के अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: मनुष्यों के पुत्रों को
  rationale: मूल की सामी-प्रभावित अभिव्यक्ति को औपचारिक निकटता के साथ सुरक्षित रखा गया है; इसका आशय मानवजाति से है।
- source_word: διαβούλια
  choice: अभिप्राय
  rationale: यह विचार-विमर्श से बने इरादे या उद्देश्य का संकेत देता है और केवल आकस्मिक 'विचार' से अधिक सटीक है।
- source_word: πράξεις
  choice: कर्म
  rationale: नैतिक संदर्भ में किए गए कार्यों के लिए संक्षिप्त, स्वाभाविक और गरिमापूर्ण पद।
- source_word: τρόπους
  choice: ढंग
  rationale: व्यवहार या कार्य करने के तरीकों का व्यापक अर्थ सुरक्षित रखता है, बिना इसे अनावश्यक रूप से 'स्वभाव' तक सीमित किए।
- source_word: τέλεα
  choice: परिणाम
  rationale: यहाँ दो मार्गों से जुड़े अंतिम निष्कर्ष या परिणतियाँ अभिप्रेत हैं; 'अंत' की अपेक्षा आधुनिक हिन्दी में अधिक स्पष्ट है।
theological_decisions:
- issue: परमेश्वर द्वारा दो मार्ग दिए जाने का कथन
  choice: मूल के सीधे कथन को ज्यों का त्यों रखा गया
  alternative: इसे केवल परमेश्वर द्वारा मनुष्य के सामने दो विकल्प रखने के रूप में स्पष्ट करना
  rationale: ग्रीक ἔδωκεν स्पष्टतः 'दिए' कहता है। स्वतंत्र इच्छा, दैवी नियति या नैतिक उत्तरदायित्व के संबंध को पद स्वयं नहीं सुलझाता, इसलिए अनुवाद भी तनाव को बनाए रखता है।
- issue: τέλεα का अर्थ
  choice: परिणाम
  alternative: अंत
  rationale: दो नैतिक मार्गों की अलग-अलग परिणतियों का भाव संदर्भानुकूल है, पर पद की अंतिमता भी 'परिणाम' में पर्याप्त रूप से बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य। सूची की पुनरावृत्ति को बनाए रखते हुए देवनागरी में प्रवाह के लिए दीर्घ विराम का प्रयोग किया गया है। उपलब्ध नवीन संशोधन असंबद्ध पाठ प्रस्तुत करता है और दिए गए यूनानी स्रोत से मेल नहीं खाता, इसलिए उसका अनुसरण नहीं किया गया।
