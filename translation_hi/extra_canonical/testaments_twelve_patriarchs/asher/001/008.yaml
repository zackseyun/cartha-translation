source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν δὲ *ἐν †πονηρᾷ³⁶ κλίνῃ³⁷ †τὸ διαβούλιον†³⁸, *πᾶσα πρᾶξις αὐτῆς ἐστιν³⁹ ἐν πονηρίᾳ, καὶ⁴⁰ ἀπωθουμένη⁴¹ τὸ ἀγαθόν, *καὶ προσκολλώμενος⁴² τὸ κακόν, καὶ κυριευθεὶς⁴³ ὑπὸ⁴⁴ τοῦ Βελίαρ· κἂν⁴⁵ ἀγαθὸν⁴⁶ πράξει⁴⁷, Γἐν πονηρίᾳ⁴⁸ αὐτὸ⁴⁹ μεταστρέφει⁵⁰˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/008.yaml
  text: But if the intent inclines to evil, all its actions are in wickedness, driving away the good and clinging to the evil, and ruled by Beliar; and even if it does something good, it turns it into evil.
translation:
  language: hi
  text: 'परन्तु यदि उसका इरादा बुराई की ओर झुकता है, तो उसके सभी काम दुष्टता में होते हैं: वह भलाई को ठुकराता है, बुराई से चिपक जाता है, और बलिआर के अधीन है। और यदि वह कुछ भला करे भी, तो उसे बुराई में बदल देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: इरादा
  rationale: यहाँ शब्द मन के विचार-विमर्श से बने अभिप्राय या मंशा को व्यक्त करता है; आधुनिक हिन्दी में ‘इरादा’ स्वाभाविक और निकट अर्थ देता है।
- source_word: ἐν πονηρίᾳ
  choice: दुष्टता में
  rationale: ग्रीक की अवस्थासूचक अभिव्यक्ति को बनाए रखता है और नैतिक बुराई का अर्थ देता है।
- source_word: ἀπωθουμένη τὸ ἀγαθόν
  choice: भलाई को ठुकराता
  rationale: ἀπωθέομαι में दूर धकेलने या अस्वीकार करने का भाव है; ‘ठुकराता’ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: προσκολλώμενος τὸ κακόν
  choice: बुराई से चिपक जाता है
  rationale: क्रिया का शाब्दिक भाव दृढ़ता से जुड़ने या चिपकने का है, जिसे यहाँ सजीव रूप में सुरक्षित रखा गया है।
- source_word: κυριευθεὶς ὑπὸ τοῦ Βελίαρ
  choice: बलिआर के वश में हो जाता है
  rationale: निष्क्रिय कृदन्त का अर्थ किसी के शासन या प्रभुत्व में आ जाना है; ‘वश में’ सामान्य हिन्दी में स्पष्ट है।
- source_word: μεταστρέφει
  choice: बुराई में बदल देता है
  rationale: यह क्रिया पलट देने या रूपांतरित कर देने को दर्शाती है; प्रसंग में भले काम को बुराई की ओर मोड़ना अभिप्रेत है।
theological_decisions:
- issue: बलिआर की पहचान
  choice: व्यक्तिवाचक नाम ‘बलिआर’ को यथावत लिप्यंतरित किया गया है।
  alternative: ‘शैतान’ या ‘दुष्ट’ जैसे अर्थसूचक प्रतिस्थापन।
  rationale: मूल पाठ विशिष्ट नाम Βελίαρ प्रयोग करता है; उसे किसी बाद की धार्मिक पहचान से बदलना पाठ की ऐतिहासिक और धर्मवैचारिक विशिष्टता को मिटा देता।
- issue: भले काम का बुराई में बदलना
  choice: कथन को मूल की पूर्ण तीव्रता के साथ रखा गया है।
  alternative: इसे ‘बुरे उद्देश्य से करता है’ या ‘उसका परिणाम बुरा होता है’ कहकर स्पष्ट करना।
  rationale: मूल पाठ यह नहीं बताता कि परिवर्तन मंशा, स्वरूप या परिणाम में है; इसलिए उसकी वास्तविक अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की लंबी यूनानी कृदन्त-श्रृंखला को हिन्दी में स्पष्ट उपवाक्यों में बाँटा गया है, पर उसके नैतिक क्रम और बल को सुरक्षित रखा गया है।
