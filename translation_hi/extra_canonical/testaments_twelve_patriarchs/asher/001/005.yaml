source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὁδοὶ *⌜γὰρ⌝ εἰσὶ²⁰ δύο, καλοῦ καὶ κακοῦ· ἐν οἷς²¹ εἰσι τὰ δύο²² διαβούλια ἐν στέρνοις²³ ἡμῶν²⁴ *διακρίνοντα αὐτά²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/005.yaml
  text: For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.
translation:
  language: hi
  text: क्योंकि दो मार्ग हैं—भलाई के और बुराई के; और उनमें हमारे हृदयों में दो संकल्प हैं, जो उन्हें अलग करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ
  choice: मार्ग
  rationale: ‘मार्ग’ नैतिक जीवन-पद्धति के रूपक को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: καλοῦ καὶ κακοῦ
  choice: भलाई का और बुराई का
  rationale: यह नैतिक विरोध को स्पष्ट रखता है; ‘अच्छे और बुरे’ की अपेक्षा संज्ञात्मक रूप मूल यूनानी संबंध को अधिक सहजता से व्यक्त करता है।
- source_word: διαβούλια
  choice: संकल्प
  rationale: यह विचार-विमर्श से उपजे आंतरिक उद्देश्य या इरादे का अर्थ दे सकता है और यहाँ नैतिक अभिमुखता के संदर्भ में स्वाभाविक है।
- source_word: ἐν στέρνοις ἡμῶν
  choice: हमारे हृदयों में
  rationale: शाब्दिक अर्थ ‘हमारी छातियों में’ है, पर यूनानी मुहावरे में यह भीतरी मनुष्य का स्थान है; हिन्दी में ‘हृदयों में’ उसका स्वाभाविक समतुल्य है।
- source_word: διακρίνοντα αὐτά
  choice: जो उनके बीच भेद करते हैं
  rationale: 'वाक्यांश की वास्तविक अस्पष्टता को यथासंभव बनाए रखता है: बहुवचन कृदंत निकटवर्ती ‘दो संकल्पों’ से जुड़ता है, जबकि सर्वनाम का संकेत पूर्वोक्त मार्गों की ओर समझा जा सकता है।'
theological_decisions:
- issue: दो मार्गों और दो आंतरिक संकल्पों का संबंध
  choice: ‘उन्हीं के अनुरूप’ द्वारा संबंध व्यक्त किया गया, पर उसे कठोर कारणात्मक या सिद्धान्तगत दावे में नहीं बदला गया।
  alternative: ‘उनमें दो संकल्प हैं’ का शब्दशः अनुवाद
  rationale: यूनानी ἐν οἷς का शाब्दिक स्थानगत प्रयोग हिन्दी में अस्पष्ट या अस्वाभाविक होता; चुना गया रूप नैतिक अनुरूपता दिखाता है, बिना किसी संप्रदायगत व्याख्या के।
- issue: διακρίνοντα का कर्ता और αὐτά का संदर्भ
  choice: ‘दो संकल्प’ को भेद करने वाला माना और ‘उनके’ को दोनों मार्गों की ओर संकेत करने दिया।
  alternative: मार्ग स्वयं संकल्पों को अलग करते हैं, अथवा संकल्प स्वयं एक-दूसरे से भिन्न हैं।
  rationale: व्याकरणतः नपुंसक बहुवचन कृदंत τὰ δύο διαβούλια से स्वाभाविक रूप से मेल खाता है; फिर भी सर्वनाम-संदर्भ की अंतर्निहित अस्पष्टता को पूर्णतः सुलझाने का दावा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। नैतिक ‘दो मार्ग’ रूपक और आंतरिक संकल्पों के बीच मूल पाठ का तनाव सुरक्षित रखा गया है।
