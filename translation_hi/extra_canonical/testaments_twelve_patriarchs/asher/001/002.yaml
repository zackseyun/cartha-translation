source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὑγιαίνων ⌜γὰρ⌝⁶ *εἶπε πρὸς αὐτούς⁷. Ἀκούσατε, τέκνα⁸ Ἀσήρ, τοῦ πατρὸς ὑμῶν, καὶ⁹ πᾶν τὸ εὐθὲς¹⁰ ἐνώπιον *τοῦ Θεοῦ¹¹ ὑποδείξω¹² ὑμῖν¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/002.yaml
  text: While still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything that is upright before God.”
translation:
  language: hi
  text: स्वस्थ रहते हुए उसने उनसे कहा, “हे आशेर की सन्तानो, अपने पिता की सुनो, और मैं तुम्हें वह सब दिखाऊँगा जो परमेश्वर के सामने सीधा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: स्वस्थ रहते हुए
  rationale: वर्तमान कृदन्त व्यक्ति की उस समय जारी स्वस्थ अवस्था को व्यक्त करता है; इसे केवल ‘स्वस्थ’ कहने की अपेक्षा यह अधिक स्वाभाविक और सटीक है।
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: आज्ञार्थक बहुवचन को आधुनिक हिन्दी के सीधे, स्वाभाविक सम्बोधन में रखा गया है।
- source_word: τέκνα Ἀσήρ
  choice: हे आशेर की सन्तानो
  rationale: वंशजों के सामूहिक सम्बोधन को हिन्दी में स्पष्ट किया गया है और सम्बोधन का गरिमापूर्ण स्वर सुरक्षित रखा गया है।
- source_word: πᾶν τὸ εὐθὲς
  choice: वह सब ... जो ... सीधा है
  rationale: εὐθύς के नैतिक रूपक ‘सीधा/सही’ को ‘सीधा’ से सुरक्षित रखा गया है, ताकि मूल की छवि को केवल ‘धर्मी’ जैसे अधिक व्याख्यात्मक शब्द में न बदला जाए।
- source_word: ἐνώπιον τοῦ Θεοῦ
  choice: परमेश्वर के सामने
  rationale: मूल के स्थानगत रूपक और परमेश्वर के मूल्यांकन के भाव—दोनों को सीधे ढंग से बनाए रखता है।
- source_word: ὑποδείξω
  choice: दिखाऊँगा
  rationale: क्रिया के मूल अर्थ को सुरक्षित रखता है; प्रसंग में इसमें सिखाने या समझाने का भाव हो सकता है, पर उसे पाठ में अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ‘परमेश्वर के सामने सीधा’ में नैतिक मानक का अनुवाद
  choice: रूपक को ‘सीधा’ के रूप में बनाए रखा
  alternative: ‘परमेश्वर की दृष्टि में सही/धर्मी’
  rationale: ग्रीक εὐθὲς में ‘सीधा’ और उससे निकला नैतिक ‘सही’ दोनों निहित हैं। ‘सीधा’ मूल रूपक और उसकी सम्भावित व्यापकता को सुरक्षित रखता है, जबकि ‘धर्मी’ अधिक विशिष्ट धर्मशास्त्रीय अर्थ आरोपित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक वसीयतनुमा सम्बोधन। ‘सन्तानो’ पारिवारिक तथा वंशगत अर्थ देता है; ‘परमेश्वर के सामने सीधा’ जानबूझकर मूल की नैतिक रूपकात्मकता बनाए रखता है।
