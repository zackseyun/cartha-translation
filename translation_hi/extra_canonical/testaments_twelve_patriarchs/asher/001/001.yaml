translation:
  language: hi
  text: 'याकूब और ज़िल्पा के दसवें पुत्र आशेर की वसीयत।


    1 आशेर की वसीयत की प्रतिलिपि—वे बातें जो उसने अपने जीवन के एक सौ पच्चीसवें वर्ष में अपने पुत्रों से कही।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयत
  rationale: यहाँ यह शब्द कुलपिता द्वारा मृत्यु से पहले अपने पुत्रों को दिए गए अंतिम उपदेशों के साहित्यिक रूप को दर्शाता है; आधुनिक हिन्दी में ‘वसीयत’ इसका संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: ग्रीक शब्द किसी लिखित पाठ की नकल या प्रति को सूचित करता है; इसलिए उसके दस्तावेज़ीय भाव को सुरक्षित रखा गया है।
- source_word: ἐλάλησε
  choice: से कहीं
  rationale: संदर्भ में आशेर द्वारा अपने पुत्रों को कही गई बातों का बोध है; ‘बातें ... कहीं’ हिन्दी में स्वाभाविक है और कथन की मौखिक प्रकृति बनाए रखता है।
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: अपने जीवन के एक सौ पच्चीसवें वर्ष में
  rationale: मूल की क्रमसूचक आयु-अभिव्यक्ति को ठीक रूप में रखा गया है; इसका अर्थ 125 वर्ष पूरे होने के बाद कहना आवश्यक नहीं है।
