id: T12P.ASH.1.9
reference: Testament of Asher 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὅτε γὰρ⁵¹ ἄρξεται⁵² *τὸ ἀγαθὸν ποιεῖν⁵³, τὸ τέλος τῆς πράξεως *εἰς πονηρὸν αὐτῷ ἐλαύνει⁵⁴. ἐπειδὴ ὁ⁵⁵ θησαυρὸς⁵⁶ τοῦ διαβουλίου⁵⁷ πονηροῦ⁵⁸ πνεύματος πεπλήρωται⁵⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/009.yaml
  text: For whenever it begins to do good, the end of the action drives him into evil, because the treasure of its purpose is filled with an evil spirit.
translation:
  language: hi
  text: क्योंकि जब भी वह[a] भलाई करने लगता है, उस कार्य का अंत उसे बुराई की ओर धकेल देता है, क्योंकि उसकी योजना का भंडार दुष्ट आत्मा से भरा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में इस क्रिया का कर्ता यहाँ स्पष्ट रूप से नहीं बताया गया है; ‘वह’ का पूर्वपद आस-पास के संदर्भ से समझा जाता है।
    reason: मूल पाठ में निहित कर्ता और उसके संदर्भगत पूर्वपद की अस्पष्टता बनाए रखने के लिए।
lexical_decisions:
- source_word: τὸ ἀγαθὸν ποιεῖν
  choice: भलाई करने
  rationale: यूनानी पद का सीधा अर्थ ‘भलाई करना’ है; इसे संशोधित अंग्रेज़ी पुनरीक्षण के ‘भलाई के विरुद्ध बुराई करना’ के अनुसार नहीं बदला गया।
- source_word: τὸ τέλος τῆς πράξεως
  choice: उस काम का अंत
  rationale: ‘कार्य/कर्म का अंत अथवा परिणाम’ को सामान्य आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς πονηρὸν ... ἐλαύνει
  choice: बुराई की ओर धकेल देता है
  rationale: ἐλαύνει की बलपूर्ण गति और εἰς की दिशात्मकता दोनों सुरक्षित रखी गई हैं।
- source_word: ὁ θησαυρὸς τοῦ διαβουλίου
  choice: उसकी मंशा का भंडार
  rationale: θησαυρός के ‘भंडार’ और διαβούλιον के ‘मंशा/योजना’ संबंधी भाव को बनाए रखता है, बिना इसे किसी विशिष्ट धर्मशास्त्रीय संकल्पना में बदलने के।
- source_word: πονηροῦ πνεύματος
  choice: एक दुष्ट आत्मा
  rationale: अनिश्चित लेख के अभाव वाली यूनानी अभिव्यक्ति को हिन्दी में स्वाभाविक अनिश्चित रूप दिया गया है; ‘आत्मा’ πνεῦμα का औपचारिक समतुल्य है।
theological_decisions:
- issue: आरंभिक क्रिया का कर्ता
  choice: वह
  alternative: यह / मनुष्य
  rationale: यूनानी वाक्य में कर्ता स्पष्ट रूप से दोहराया नहीं गया और उसका पूर्वपद संदर्भ से आता है; इसलिए किसी विशिष्ट मानवीय या आध्यात्मिक कर्ता को पाठ में आरोपित नहीं किया गया।
- issue: πονηροῦ πνεύματος का आशय
  choice: एक दुष्ट आत्मा
  alternative: दुष्ट प्रवृत्ति / बुरी भावना
  rationale: ‘आत्मा’ स्रोत की वास्तविक आध्यात्मिक अथवा गुणात्मक अस्पष्टता को बनाए रखता है; इसे केवल मनोवैज्ञानिक प्रवृत्ति बनाना अनावश्यक व्याख्या होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। वाक्य की कारणात्मक पुनरावृत्ति (‘क्योंकि… क्योंकि…’) मूल यूनानी की संरचना के निकट रहने के लिए बनाए रखी गई है।
