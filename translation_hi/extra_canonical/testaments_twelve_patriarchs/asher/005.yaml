  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005.yaml
  text: '1[a]. See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in wealth, greed; in merriment, drunkenness; in laughter, grief[b]; in marriage, debauchery. 2. Death follows life, dishonor glory, night day, darkness light; but all things are under the day: righteous things under life, and unrighteous things under death. Therefore eternal life also awaits death. 3. And one cannot say that truth is falsehood, nor that what is righteous is unrighteous, because all truth is under the light, just as all things are under God. 4. Therefore I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought out the commandments of the Most High[c], walking according to all my strength.'
translation:
  language: hi
  text: '**आशेर का वसीयतनामा 5**


    **1** देखो, मेरे बच्चो, किस प्रकार सभी बातों में दो हैं—एक दूसरे के विपरीत, और उनमें से एक दूसरे के नीचे छिपा है: संपत्ति में लोभ[a], उल्लास में मदहोशी, हँसी में शोक, और विवाह में उच्छृंखलता। **2** जीवन के पीछे मृत्यु आती है, महिमा के पीछे अपमान, दिन के पीछे रात और प्रकाश के पीछे अंधकार। परन्तु सभी बातें दिन के अधीन हैं: धर्म की बातें जीवन के अधीन और अधर्म की बातें मृत्यु के अधीन[c]। इसलिए अनन्त जीवन भी मृत्यु की प्रतीक्षा करता है[b]। **3** कोई सत्य को झूठ और धर्म की बात को अधर्म नहीं कह सकता, क्योंकि हर सत्य प्रकाश के अधीन है, जैसे सभी बातें परमेश्वर के अधीन हैं। **4** इसलिए मैंने अपने जीवन में इन सभी बातों को परखा; मैं प्रभु के सत्य से नहीं भटका, और अपनी पूरी सामर्थ्य के अनुसार चलते हुए परमप्रधान की आज्ञाओं को खोजता रहा।


    [a] **लोभ** का अर्थ यहाँ “और अधिक पाने की लालसा” भी हो सकता है।


    [b] “अनन्त जीवन भी मृत्यु की प्रतीक्षा करता है” पाठ और अर्थ—दोनों की दृष्टि से कठिन वाक्य है। अनुवाद ने इसका अर्थ खोलकर बताने के बजाय यूनानी वाक्य की विरोधाभासी अभिव्यक्ति को बनाए रखा है।


    [c] इस अध्याय में बार-बार आया “के अधीन” संभवतः नैतिक या विश्वव्यापी क्षेत्र अथवा सत्ता का बोध कराता है: “दिन के अधीन … जीवन के अधीन … मृत्यु के अधीन … प्रकाश के अधीन … परमेश्वर के अधीन।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
