    reason: cultural_note
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: देखो
  rationale: पैतृक उपदेश के आरम्भ में प्रयुक्त आज्ञार्थक क्रिया का सीधा, स्वाभाविक और प्रभावशाली हिन्दी रूप।
- source_word: τέκνα
  choice: मेरे बच्चो
  rationale: वसीयतनामे के आत्मीय संबोधन को बनाए रखता है; हिन्दी संबोधन में “मेरे” स्वाभाविक है।
- source_word: δύο ... ἓν κατέναντι τοῦ ἑνός
  choice: दो हैं—एक दूसरे के विपरीत
  rationale: नैतिक द्वंद्व और यूनानी वाक्य की संतुलित रचना दोनों को स्पष्ट रखता है, बिना इसे केवल “दो पहलू” कहकर हल्का किए।
- source_word: κέκρυπται
  choice: नीचे छिपा हुआ
  rationale: पूर्ण निष्क्रिय क्रिया के छिपे होने के भाव को व्यक्त करता है और आगे बार-बार आने वाले ὑπό के ‘अधीन/नीचे’ संबंध की प्रतिध्वनि बचाता है।
- source_word: κτίσει
  choice: संपत्ति
  rationale: इस प्रसंग में अर्जित वस्तु या संपत्ति का भाव लोभ के साथ स्वाभाविक बैठता है; ‘सृष्टि’ अर्थ यहाँ सूची के नैतिक समानांतरों में कम उपयुक्त है।
- source_word: πλεονεξία
  choice: लोभ
  rationale: अधिक पाने की लालसा व्यक्त करने वाला सरल, आधुनिक और नैतिक रूप से स्पष्ट शब्द।
- source_word: εὐφροσύνη
  choice: आनंद-विनोद
  rationale: उत्सवी प्रसन्नता का भाव देता है और उसके भीतर छिपे मतवालेपन के विरोध को स्वाभाविक बनाता है।
- source_word: μέθη
  choice: मतवालापन
  rationale: नशे की दशा और उससे जुड़ी नैतिक अति को सामान्य हिन्दी में व्यक्त करता है।
- source_word: πένθος
  choice: शोक
  rationale: हँसी के साथ तीखा और संक्षिप्त विरोध निर्मित करता है; यह व्यक्तिगत दुःख और मातम दोनों को समेट सकता है।
- source_word: ἀσωτία
  choice: उच्छृंखलता
  rationale: अनैतिक या असंयमित जीवन का व्यापक भाव बचाता है और इसे केवल व्यभिचार तक सीमित नहीं करता।
- source_word: διαδέχεται
  choice: के पीछे ... आती है
  rationale: क्रमशः एक के बाद दूसरे के आने का अर्थ सहज हिन्दी में देता है और विरोधी युग्मों की लय बनाए रखता है।
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: धर्म की बातें / अधर्म की बातें
  rationale: नपुंसकलिंग बहुवचन को केवल धर्मी और अधर्मी व्यक्तियों तक सीमित न करके कर्मों, वस्तुओं और विषयों की श्रेणी के रूप में रखता है।
- source_word: ἐξεζήτησα
  choice: खोजता रहा
  rationale: उपसर्गयुक्त क्रिया के लगनपूर्वक खोजने के भाव और जीवनभर की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: διὸ καὶ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει का विरोधाभासी कथन
  choice: इसलिए अनन्त जीवन भी मृत्यु की प्रतीक्षा करता है।
  alternative: इसलिए मृत्यु के पार अनन्त जीवन है।
  rationale: यूनानी व्याकरण में ‘अनन्त जीवन’ स्वाभाविक रूप से कर्ता और ‘मृत्यु’ कर्म है। अर्थ कठिन होने पर भी व्याख्यात्मक पुनर्लेखन से धार्मिक तनाव मिटाया नहीं गया।
- issue: बार-बार प्रयुक्त ὑπό का संबंध
  choice: ‘के अधीन’ को मुख्य पाठ में बनाए रखना
  alternative: ‘के पक्ष में’, ‘के क्षेत्र में’ या ‘का है’
  rationale: यह चयन नैतिक क्षेत्र, व्यवस्था या सत्ता—इन सम्भव अर्थों में से किसी एक को निर्णायक रूप से आरोपित नहीं करता और मूल की आवर्ती अलंकारिक संरचना बचाता है।
- issue: ἀσωτία का विवाह-संदर्भ में अर्थ
  choice: उच्छृंखलता
  alternative: व्यभिचार
  rationale: संदर्भ यौन अनैतिकता की ओर संकेत कर सकता है, पर यूनानी शब्द व्यापक असंयम और अपव्ययी दुर्व्यवहार भी बताता है; इसलिए संकीर्ण धार्मिक निष्कर्ष नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। विरोधी युग्मों की सूत्रात्मक लय रखी गई है। ‘के अधीन’ कुछ असामान्य सुनाई देता है, पर मूल के जानबूझकर दोहराए गए ὑπό और उसकी वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखने के लिए इसे बरकरार रखा गया है।
