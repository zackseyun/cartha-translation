  text: IV. Οἱ γὰρ ἀγαθοὶ ἄνθρωποι¹ *⌜καὶ⌝ μονοπρόσωποι κἂν² νομισθῶσι παρὰ τῶν³ διπροσώπων⁴ ἁμαρτάνειν⁵, δίκαιοί εἰσι παρὰ τῷ⁶ Θεῷ. 2. Πολλοὶ ⌜δὲ⌝⁷ ἀναιροῦντες τοὺς⁸ πονηρούς, δύο⁹ ποιοῦσιν ἔργα *καλοῦ τε καὶ κακοῦ¹⁰, *τὸ δὲ ὅλον¹¹ καλόν, ὅτι τὸ¹² κακὸν ἐκριζώσας ἀπώλεσεν. 3. *Ἔστι τις μισῶν¹³ τὸν ἐλεήμονα καὶ ἄδικον¹⁴, ⌜καὶ⌝¹⁵ τὸν μοιχὸν καὶ¹⁶ νηστεύοντα¹⁷, *καὶ αὐτό ἐστι διπρόσωπον¹⁸, ἀλλὰ ⌈τὸ πᾶν⌉ ἔργον ἀγαθόν¹⁹, ὅτι μιμεῖται²⁰ Κύριον, μὴ²¹ †προσδοκώμενος²² τὸ δοκοῦν καλὸν †μετὰ²³ *τοῦ ἀληθινοῦ²⁴ καλοῦ²⁵. 4. Ἄλλος²⁶ οὐ θέλει *ἰδεῖν ⌈ἡμέρας⌉ ἀγαθὰς²⁷ μετὰ ἀσώτων, ἵνα μὴ αἰσχράνει²⁸ τὸ σῶμα²⁹ καὶ τὴν ψυχὴν μολυνεῖ³⁰. *καίγε τοῦτο διπρόσωπον³¹, ὅλον³² δὲ καλόν³³ ἐστιν. 5. *Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².
