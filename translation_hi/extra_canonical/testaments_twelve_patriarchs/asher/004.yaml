  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004.yaml
  text: '1 For good men[a], being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God. 2 And many, in doing away with the wicked, perform two works, one good and one evil; yet the whole is good, because he has uprooted and destroyed the evil. 3 There is one who hates the merciful man and the unjust man, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what only seems good together with what is truly good[b]. 4 Another does not wish to see good days with the wasteful, lest he defile his body and pollute his soul. Even though this is double-faced, yet it is wholly good. 5 For such men are like gazelles and deer: in the bearing of wild animals they seem to be unclean, but in every respect they are clean, because they walk in zeal for the Lord, keeping away from those things which God also hates and forbids through the commandments[d][c], thus holding back
    evil from good.'
translation:
  language: hi
  text: '1 क्योंकि भले मनुष्य एकमुखी होते हैं[a]। दोमुखी लोग भले ही उन्हें पाप करते हुए समझें, फिर भी वे परमेश्वर की दृष्टि में धर्मी हैं। 2 बहुत-से लोग दुष्टों को मिटाते हुए दो प्रकार के काम करते हैं—एक भला और दूसरा बुरा—फिर भी पूरा काम भला होता है, क्योंकि ऐसा व्यक्ति बुराई को जड़ से उखाड़कर नष्ट कर देता है। 3 कोई व्यक्ति उस मनुष्य से घृणा करता है जो दयालु तो है, पर अन्यायी भी, और उस व्यभिचारी से भी जो उपवास करता है। यह भी दोमुखी जान पड़ता है, फिर भी पूरा काम भला है, क्योंकि वह प्रभु का अनुकरण करता है और उस भलाई की अपेक्षा नहीं करता जो केवल भली दिखाई देती है, सच्ची भलाई के साथ[b]। 4 कोई दूसरा उच्छृंखल लोगों के साथ अच्छे दिन देखना नहीं चाहता, ताकि वह अपने शरीर को कलंकित और अपनी आत्मा को दूषित न करे। यह भी दोमुखी जान पड़ता है, फिर भी पूरी तरह भला है। 5 ऐसे लोग चिकारे और हिरनों के समान हैं: जंगली पशुओं जैसी चाल-ढाल के कारण वे अशुद्ध दिखाई देते हैं, पर वास्तव में हर प्रकार से शुद्ध हैं[c], क्योंकि वे प्रभु के लिए उत्साह से चलते हैं। जिन बातों से परमेश्वर घृणा करता और अपनी आज्ञाओं के द्वारा
    मना करता है, उनसे वे दूर रहते हैं; परमेश्वर बुराई को भलाई से अलग रखता है[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एकमुखी’ और ‘दोमुखी’ मूल यूनानी के ‘एक मुख’ और ‘दो मुख’ वाले रूपक को बनाए रखते हैं। भाव क्रमशः निष्कपटता और दोहरेपन का है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में यहाँ वाक्य-विन्यास कठिन और पाठ कुछ अनिश्चित है। मुख्य विरोध उस भलाई के बीच है जो केवल भली दिखाई देती है और उस भलाई के बीच जो सचमुच भली है।
    reason: textual_and_lexical_note
  - marker: c
    text: 'पशुओं की यह तुलना बाहरी जंगली चाल-ढाल और वास्तविक शुद्धता के बीच विरोध दिखाती है: वे देखने में संदेहास्पद लग सकते हैं, फिर भी शुद्ध हैं।'
    reason: cultural_note
  - marker: d
    text: अंतिम यूनानी वाक्यांश बहुत संक्षिप्त है। ‘बुराई को भलाई से अलग रखता है’ का कर्ता यूनानी में एकवचन है और निकटस्थ ‘परमेश्वर’ से संबद्ध समझा गया है; इसका अनुवाद ‘बुराई को भलाई से दूर रखता है’ भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μονοπρόσωποι
  choice: एकमुखी
  rationale: यह अध्याय के मुख-रूपक को बनाए रखता है और διπρόσωποι के साथ स्पष्ट विरोध रचता है; केवल ‘निष्कपट’ कहने से मूल बिंब खो जाता।
- source_word: διπρόσωποι / διπρόσωπον
  choice: दोमुखी
  rationale: ‘दोमुंहा’ की अपेक्षा यह अधिक मर्यादित है और मूल यूनानी के बार-बार आने वाले ‘दो मुख’ के रूपक को सुरक्षित रखता है। जहाँ काम के विषय में यह शब्द आया है, वहाँ ‘दोमुखी जान पड़ता है’ कहा गया है ताकि इसे सीधे कपट न समझा जाए।
- source_word: ἀναιροῦντες
  choice: मिटाते हुए
  rationale: यूनानी क्रिया का अर्थ मार डालना अथवा हटा देना दोनों हो सकता है। ‘मिटाना’ इस व्यापकता को बचाता है और निकटवर्ती बुराई को जड़ से उखाड़ने के बिंब से मेल खाता है।
- source_word: τὸ δὲ ὅλον καλόν
  choice: फिर भी पूरा काम भला होता है
  rationale: 'यह दोहराया गया मूल्यांकन लेखक के तर्क का केंद्र है: बाहर से मिश्रित दिखने वाला काम अपने समग्र लक्ष्य में भला हो सकता है।'
- source_word: τὸν ἐλεήμονα καὶ ἄδικον / τὸν μοιχὸν καὶ νηστεύοντα
  choice: जो दयालु तो है, पर अन्यायी भी / उस व्यभिचारी से भी जो उपवास करता है
  rationale: प्रत्येक यूनानी पद-समूह में एक ही निश्चित उपपद है, इसलिए विशेषणों को दो अलग व्यक्तियों के बजाय एक ही व्यक्ति के विरोधी गुणों के रूप में प्रस्तुत किया गया है।
- source_word: μιμεῖται Κύριον
  choice: प्रभु का अनुकरण करता है
  rationale: यह दिव्य आचरण का नैतिक अनुकरण व्यक्त करता है; ‘अनुसरण’ की तुलना में ‘अनुकरण’ मूल क्रिया के अधिक निकट है।
- source_word: τὸ δοκοῦν καλὸν ... τοῦ ἀληθινοῦ καλοῦ
  choice: जो केवल भला दिखाई देता है ... सच्ची भलाई
  rationale: इससे दिखावटी अथवा प्रत्यक्ष भलाई और वास्तविक भलाई के बीच मूल विरोध स्पष्ट रहता है।
- source_word: ἀσώτων
  choice: उच्छृंखल लोगों
  rationale: यह केवल धन बरबाद करने वालों तक अर्थ को सीमित किए बिना नैतिक असंयम और दुराचार का भाव व्यक्त करता है।
- source_word: αἰσχράνει ... μολυνεῖ
  choice: शरीर को कलंकित ... आत्मा को दूषित
  rationale: दो अलग क्रियाएँ रखकर शरीर और आत्मा के समानांतर दूषण को सुरक्षित रखा गया है।
- source_word: δορκάσι καὶ ἐλάφοις
  choice: चिकारे और हिरनों
  rationale: दोनों पशुओं का भेद रखते हुए चित्र को हिंदी पाठक के लिए स्वाभाविक बनाया गया है।
- source_word: ἐν ἤθει ἀγρίων
  choice: जंगली पशुओं जैसी चाल-ढाल
  rationale: ἦθος यहाँ बाहरी ढंग या व्यवहार का संकेत देता है, जिसके कारण गलत आकलन होता है।
- source_word: ἐν ζήλῳ Κυρίου
  choice: प्रभु के लिए उत्साह से
  rationale: इसे मनुष्यों का प्रभु की ओर निर्देशित उत्साह समझा गया है, न कि प्रभु का अपना उत्साह।
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: भलाई से बुराई को दूर रखते हैं
  rationale: संक्षिप्त यूनानी वाक्यांश की रोकने अथवा अलग रखने की छवि बचती है, बिना उसके आशय को आवश्यकता से अधिक निश्चित किए।
theological_decisions:
- issue: बाहर से मिश्रित अथवा ‘दोमुखी’ दिखने वाले कामों का नैतिक मूल्यांकन
  choice: पाठ बाहरी दोहरेपन और भीतरी कपट को एक नहीं मानता; कुछ कठोर या मिश्रित दिखने वाले काम बुराई को हटाने के अपने समग्र लक्ष्य में भले बताए गए हैं।
  alternative: हर प्रकार का दोहरापन अनिवार्य रूप से निंदनीय है; अथवा पाठ किसी भी बुरे साधन को अच्छे लक्ष्य के लिए उचित ठहराता है।
  rationale: ‘यह भी दोमुखी जान पड़ता है, फिर भी पूरा काम भला है’ की पुनरावृत्ति तनाव को बनाए रखती है। अनुवाद न तो इसे कपट की प्रशंसा बनाता है, न हर साधन की खुली स्वीकृति।
- issue: Κύριον का संदर्भ
  choice: प्रभु
  alternative: परमेश्वर; यहोवा
  rationale: यूनानी साक्ष्य में Κύριον है। ‘प्रभु’ उपाधि का सीधा, संदर्भानुकूल अनुवाद है और बाद की विशिष्ट मसीही पहचान को पाठ में आरोपित नहीं करता।
- issue: पद 3 में दया/अन्याय और व्यभिचार/उपवास के जोड़े
  choice: प्रत्येक जोड़े को एक ऐसे व्यक्ति के मिले-जुले गुण माना गया है जिससे धर्मी व्यक्ति घृणा करता है।
  alternative: दयालु, अन्यायी, व्यभिचारी और उपवास करने वाला—चार अलग-अलग व्यक्ति।
  rationale: यूनानी व्याकरण में प्रत्येक जोड़े से पहले एक ही निश्चित उपपद है। फिर भी वाक्य का नैतिक तनाव—कुछ दिखाई देने वाली भलाई का सच्ची भलाई न होना—सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण गद्य रखा गया है। अध्याय के केंद्रीय मुख-रूपक को ‘एकमुखी/दोमुखी’ से सुरक्षित रखा गया, पर कामों के लिए ‘जान पड़ता है’ जोड़कर यह स्पष्ट किया गया कि लेखक हर जगह कपट की बात नहीं कर रहा। पद 3 और अंतिम वाक्य की वास्तविक भाषिक कठिनाइयों को पादटिप्पणियों में खुला रखा गया है।
