id: T12P.ASH.5.2
reference: Testament of Asher 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Τὴν⁷ ζωὴν ὁ θάνατος διαδέχεται, τὴν δόξαν ἡ ἀτιμία, τὴν ἡμέραν ἡ νύξ⁸, τὸ φῶς τὸ σκότος· τὰ δὲ πάντα⁹ ὑπὸ ἡμέραν εἰσίν¹⁰, ὑπὸ ζωὴν¹¹ τὰ δίκαια, ⌜ὑπὸ θανάτου τὰ ἄδικα⌝¹². διὸ καὶ¹³ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/002.yaml
  text: 'Death follows life, dishonor follows glory, night follows day, darkness follows light. But all things are under day: the righteous under life, and the unrighteous under death. Therefore eternal life also awaits death.'
translation:
  language: hi
  text: 'जीवन के बाद मृत्यु आती है, महिमा के बाद अपमान, दिन के बाद रात और प्रकाश के बाद अंधकार। परन्तु सब कुछ दिन के अधीन है: धर्मी जीवन के अधीन और अधर्मी मृत्यु के अधीन। इसलिए अनन्त जीवन भी मृत्यु की प्रतीक्षा करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαδέχεται
  choice: के बाद ... आती है
  rationale: यह क्रिया क्रम में किसी के बाद आने या उसका स्थान लेने का भाव रखती है। स्वाभाविक हिन्दी में समानान्तर वाक्य-रचना के साथ ‘के बाद’ इस क्रम को स्पष्ट रखता है।
- source_word: ἀτιμία
  choice: अपमान
  rationale: यह δόξα (‘महिमा’) के विपरीत अनादर या प्रतिष्ठाहीनता का भाव व्यक्त करता है; ‘अपमान’ सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: ὑπὸ ἡμέραν
  choice: दिन के अधीन
  rationale: ग्रीक की असामान्य और सम्भवतः प्रतीकात्मक अभिव्यक्ति को सहज अर्थ लगाकर बदलने के बजाय यथासम्भव सुरक्षित रखा गया है।
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: धर्मी / अधर्मी
  rationale: नपुंसकलिंग बहुवचन विशेषण संदर्भ में ‘धर्मी बातें/कार्य’ या ‘धर्मी लोग’ दोनों की ओर संकेत कर सकते हैं। हिन्दी में अंग्रेज़ी परामर्श-पाठ के अनुरूप व्यक्तिवाचक रूप चुना गया, यद्यपि मूल की व्यापकता पूरी तरह समाप्त नहीं होती।
- source_word: ἀναμένει
  choice: प्रतीक्षा करता है
  rationale: मूल क्रिया ‘प्रतीक्षा करना/बाट जोहना’ है। अन्तिम कथन की जानबूझकर रखी गई उलटबाँसी को व्याख्यात्मक ढंग से हल नहीं किया गया।
theological_decisions:
- issue: अन्तिम वाक्य में अनन्त जीवन और मृत्यु का सम्बन्ध
  choice: अनन्त जीवन मृत्यु की भी प्रतीक्षा करता है
  alternative: मृत्यु के बाद अनन्त जीवन आता है
  rationale: ग्रीक में कर्ता ‘अनन्त जीवन’ है और कर्म ‘मृत्यु’; उलट कर अधिक सहज धर्मवैज्ञानिक कथन बनाना मूल की व्याकरणिक दिशा और तनाव को मिटा देता।
- issue: ‘धर्मी/अधर्मी’ का संदर्भ
  choice: व्यक्तियों को सूचित करने वाले ‘धर्मी’ और ‘अधर्मी’
  alternative: धर्मी बातें/कार्य और अधर्मी बातें/कार्य
  rationale: संज्ञीकृत विशेषण दोनों अर्थ सम्भव बनाते हैं। निकटवर्ती ‘जीवन’ और ‘मृत्यु’ के अधीन होने की भाषा व्यक्तियों के अर्थ को स्वाभाविक बनाती है, पर मूल की सम्भावित व्यापकता स्वीकार की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गम्भीर किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। चार आरम्भिक विरोधी युग्मों की लय सुरक्षित है। ‘दिन के अधीन’ और अन्तिम वाक्य की असामान्यता को व्याख्यात्मक पुनर्लेखन से नहीं हटाया गया।
