id: T12P.ASH.5.1
reference: Testament of Asher 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: V. Ὁρᾶτε¹, τέκνα², πῶς δύο³ εἰσὶν ⌜ἐν πᾶσιν⌝, ἓν⁴ κατέναντι τοῦ ἑνός, *καὶ ἓν ὑπὸ τοῦ ἑνὸς⁵ κέκρυπται· ⌜ἐν τῇ κτίσει ἡ πλεονεξία, ἐν τῇ εὐφροσύνῃ ἡ μέθη, ἐν τῷ γέλωτι τὸ πένθος, ἐν τῷ γάμῳ ἡ ἀσωτία⌝⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/001.yaml
  text: 'See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in creation, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery.'
translation:
  language: hi
  text: 'देखो, बच्चो, सब बातों में दो होते हैं: एक दूसरे के सामने होता है, और दूसरा पहले के नीचे छिपा होता है—सृष्टि में लालच, आनंद में नशा, हँसी में शोक, और विवाह में उच्छृंखलता।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: देखो
  rationale: प्रत्यक्ष संबोधन और चेतावनी के बल को सरल, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τέκνα
  choice: हे मेरे बच्चो
  rationale: वक्ता के आत्मीय पितृवत् संबोधन को स्पष्ट करता है; हिन्दी संबोधन में ‘हे’ गरिमापूर्ण है।
- source_word: δύο
  choice: दो पहलू
  rationale: केवल ‘दो’ हिन्दी में अधूरा और अस्पष्ट लगता; ‘पहलू’ संदर्भगत द्वैत को व्यक्त करता है, बिना उन्हें स्वतंत्र सत्ताएँ ठहराए।
- source_word: ἐν πᾶσιν
  choice: सब वस्तुओं में
  rationale: ‘सभी बातों में’ की अपेक्षा मूल के व्यापक, वस्तुगत कथन के अधिक निकट है।
- source_word: κατέναντι τοῦ ἑνός
  choice: एक दूसरे के विपरीत
  rationale: परस्पर विरोध की मूल धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ τοῦ ἑνὸς κέκρυπται
  choice: एक दूसरे के नीचे छिपा हुआ
  rationale: ‘नीचे/अधीन’ के स्थानिक रूपक को बनाए रखता है और उसे केवल ‘भीतर’ कहकर व्याख्यायित नहीं करता।
- source_word: κτίσει
  choice: सृष्टि
  rationale: κτίσις का प्राथमिक अर्थ ‘सृष्टि/रचना’ है; कठिन किंतु पाठ-साक्ष्य से समर्थित युग्म को बदलकर ‘धन-संचय’ नहीं किया गया।
- source_word: εὐφροσύνῃ
  choice: आनंद
  rationale: हर्ष और उत्सवपूर्ण प्रसन्नता का सहज आधुनिक हिन्दी रूप।
- source_word: μέθη
  choice: मतवालापन
  rationale: मद्य से उत्पन्न नशे की दशा को दर्शाता है, साथ ही संज्ञात्मक युग्म की शैली बनाए रखता है।
- source_word: πένθος
  choice: शोक
  rationale: विलाप या गहरे दुःख के लिए संक्षिप्त और गरिमापूर्ण समतुल्य।
- source_word: ἀσωτία
  choice: भोग-विलास
  rationale: शब्द की उच्छृंखल, अपव्ययी और असंयमी जीवनचर्या की व्यापकता को रखता है; इसे केवल ‘व्यभिचार’ बनाकर यौन अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘सब वस्तुओं में दो’ का स्वरूप
  choice: ‘दो पहलू’
  alternative: ‘दो शक्तियाँ’ या ‘दो स्वभाव’
  rationale: मूल केवल δύο कहता है; ‘शक्तियाँ’ या ‘स्वभाव’ किसी विशिष्ट द्वैतवादी तत्त्वमीमांसा को पाठ में जोड़ देते।
- issue: विवाह में ἀσωτία
  choice: ‘भोग-विलास’
  alternative: ‘व्यभिचार’
  rationale: विवाह का संदर्भ यौन उच्छृंखलता का संकेत दे सकता है, पर ἀσωτία का अर्थ उससे व्यापक है; अनुवाद ने इस तनाव को संकुचित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय किंतु गरिमापूर्ण संबोधन। वाक्य की सूक्तिपरक समानांतर संरचना और मूल के कठिन विरोधी युग्म सुरक्षित रखे गए हैं।
