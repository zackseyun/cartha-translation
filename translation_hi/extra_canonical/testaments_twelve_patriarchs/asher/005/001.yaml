  to: 'देखो, बच्चो, सब बातों में दो होते हैं: एक दूसरे के सामने होता है, और दूसरा पहले के नीचे छिपा होता है—सृष्टि में लालच, आनंद में नशा, हँसी में शोक, और विवाह में उच्छृंखलता।'
