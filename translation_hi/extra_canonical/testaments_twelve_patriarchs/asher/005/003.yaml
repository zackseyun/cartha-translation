id: T12P.ASH.5.3
reference: Testament of Asher 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ οὐκ¹⁵ ἔστιν εἰπεῖν τὴν ἀλήθειαν ψεῦδος, οὐδὲ *τὸ δίκαιον ἄδικον¹⁶, ὅτι πᾶσα ἀλήθεια ὑπὸ *τοῦ φωτός¹⁷ ἐστιν, ⌜καθὼς τὰ πάντα¹⁸ ὑπὸ *τοῦ Θεοῦ¹⁹⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/003.yaml
  text: And one cannot call truth falsehood, nor what is righteous unrighteous, because all truth is under the light, just as all things are under God.
translation:
  language: hi
  text: और सत्य को झूठ, या जो न्यायसंगत है उसे अन्यायपूर्ण, नहीं कहा जा सकता, क्योंकि सारा सत्य प्रकाश के अधीन है, जैसे सब कुछ परमेश्वर के अधीन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπεῖν
  choice: कहना
  rationale: यहाँ क्रिया का अर्थ किसी वस्तु को दूसरी वस्तु ठहराना या कहना है; हिंदी में ‘सत्य को झूठ कहना’ स्वाभाविक और सीधा है।
- source_word: τὴν ἀλήθειαν ψεῦδος
  choice: सत्य को झूठ
  rationale: मूल के स्पष्ट नैतिक विरोध को संक्षिप्त और स्वाभाविक हिंदी में सुरक्षित रखा गया है।
- source_word: τὸ δίκαιον ἄδικον
  choice: जो सही है उसे गलत
  rationale: नपुंसकलिंग विशेषणों के संज्ञात्मक प्रयोग को सामान्य पाठक के लिए सहज रूप में व्यक्त करता है और ‘न्यायी व्यक्ति’ जैसे अधिक सीमित अर्थ से बचता है।
- source_word: ὑπὸ τοῦ φωτός
  choice: प्रकाश के अधीन
  rationale: ὑπό के स्थानिक अथवा अधिकार-क्षेत्र संबंधी रूपक को बनाए रखा गया है; ‘प्रकाश से’ कहने पर कारण या कर्ता का अनचाहा अर्थ निकल सकता था।
- source_word: ὑπὸ τοῦ Θεοῦ
  choice: परमेश्वर के अधीन
  rationale: पहले ὑπό-वाक्यांश के समानांतर संरचना रखते हुए परमेश्वर की सार्वभौमिक प्रभुता का भाव व्यक्त किया गया है।
theological_decisions:
- issue: ‘प्रकाश के अधीन’ रूपक का अर्थ
  choice: रूपक को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया
  alternative: ‘प्रकाश के क्षेत्र में’ या ‘प्रकाश द्वारा प्रकट’
  rationale: मूल यूनानी कथन संक्षिप्त है और प्रकाश से संबंध की ठीक प्रकृति स्पष्ट नहीं करता; अनुवाद में इस वास्तविक अस्पष्टता को किसी विशेष धर्मवैज्ञानिक व्याख्या से नहीं बाँधा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। दोनों नैतिक विरोधों और ‘प्रकाश/परमेश्वर के अधीन’ समानांतरता को सुरक्षित रखा गया है। उपलब्ध स्रोत में आलोचनात्मक चिह्न तो हैं, पर उनके वैकल्पिक पाठों का विवरण नहीं दिया गया; इसलिए अनुमान पर आधारित पादटिप्पणी नहीं जोड़ी गई।
