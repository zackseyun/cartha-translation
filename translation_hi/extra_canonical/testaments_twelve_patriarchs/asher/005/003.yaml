review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two negated predications and the parallel statements that all truth is under the light and all things are under God. However, ‘जो सही है उसे गलत’ weakens the ethical/juridical force of τὸ δίκαιον ἄδικον.
  naturalness: The sentence is fluent modern Hindi. ‘सारा सत्य’ more idiomatically represents πᾶσα ἀλήθεια than ‘हर सत्य’ in this abstract, collective sense.
  terminology: ‘न्यायसंगत’ and ‘अन्यायपूर्ण’ retain the moral and justice-related contrast of δίκαιον/ἄδικον more accurately than the broad everyday contrast ‘सही/गलत’. ‘प्रकाश के अधीन’ and ‘परमेश्वर के अधीन’ appropriately preserve the source’s parallel and ambiguity.
  issues:
  - severity: medium
    issue: The rendering ‘जो सही है उसे गलत’ is semantically too broad for τὸ δίκαιον ἄδικον.
    rationale: The Greek contrast concerns what is just/righteous versus unjust, not merely what is factually correct versus incorrect. The revision retains this ethical sense without imposing a doctrinal interpretation.
  - severity: low
    issue: ‘हर सत्य’ is less natural than ‘सारा सत्य’ for πᾶσα ἀλήθεια.
    rationale: The Greek refers collectively to all truth; ‘सारा सत्य’ expresses that abstraction smoothly in modern Hindi.
  revised_text: और सत्य को झूठ, या जो न्यायसंगत है उसे अन्यायपूर्ण, नहीं कहा जा सकता, क्योंकि सारा सत्य प्रकाश के अधीन है, जैसे सब कुछ परमेश्वर के अधीन है।
