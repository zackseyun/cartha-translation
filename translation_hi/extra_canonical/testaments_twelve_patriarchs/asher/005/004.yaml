id: T12P.ASH.5.4
reference: Testament of Asher 5:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ταῦτα οὖν²⁰ πάντα ⌜ἐγὼ⌝²¹ ἐδοκίμασα ἐν τῇ ζωῇ μου, καὶ οὐκ ἐπλανήθην ἀπὸ τῆς ἀληθείας Κυρίου, καὶ²² τὰς ἐντολὰς τοῦ ὑψίστου²³ ἐξεζήτησα²⁴ κατὰ πᾶσαν ἰσχύν μου πορευόμενος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/004.yaml
  text: So then I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought the commandments of the Most High with all my strength as I walked.
translation:
  language: hi
  text: इसलिए मैंने अपने जीवन में इन सब बातों को परखा, और मैं प्रभु के सत्य से नहीं भटका; और अपनी पूरी शक्ति से चलते हुए मैंने परमप्रधान की आज्ञाओं को खोजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοκίμασα
  choice: परखा
  rationale: यह क्रिया जाँचने और अनुभव द्वारा सही ठहराने के भाव को व्यक्त करती है; ‘परखा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: οὐκ ἐπλανήθην
  choice: मैं ... नहीं भटका
  rationale: मध्य/निष्क्रिय रूप यहाँ मार्ग से भटकने का भाव देता है; हिन्दी में ‘नहीं भटका’ स्वाभाविक है और अनावश्यक रूप से किसी बाहरी भटकाने वाले को नहीं जोड़ता।
- source_word: τῆς ἀληθείας Κυρίου
  choice: प्रभु के सत्य
  rationale: संबंधकारक संरचना को सीधे रखा गया है और ‘सत्य’ के धार्मिक तथा नैतिक दोनों संभावित अर्थ सुरक्षित हैं।
- source_word: τὰς ἐντολὰς τοῦ ὑψίστου
  choice: परमप्रधान की आज्ञाओं
  rationale: ‘परमप्रधान’ ὁ ὕψιστος का प्रतिष्ठित और अर्थ-सटीक हिन्दी रूप है; ‘आज्ञाएँ’ ἐντολαί के लिए सहज धार्मिक शब्द है।
- source_word: ἐξεζήτησα
  choice: खोजा
  rationale: क्रिया के मन लगाकर तलाशने/जानने का भाव ‘खोजा’ से व्यक्त होता है; ‘पालन किया’ कहने से स्रोत से अधिक अर्थ जुड़ जाता।
- source_word: κατὰ πᾶσαν ἰσχύν μου πορευόμενος
  choice: अपनी पूरी शक्ति से चलते हुए
  rationale: यह रूप δύναμις-सदृश सामर्थ्य और πορευόμενος के ‘चलते हुए’ दोनों तत्वों को बनाए रखता है तथा यह पूरी तरह तय नहीं करता कि सामर्थ्य विशेष रूप से खोजने से जुड़ा है या समग्र आचरण से।
theological_decisions:
- issue: ‘परमप्रधान की आज्ञाओं को खोजा’ बनाम ‘उनका पालन किया’
  choice: आज्ञाओं को खोजा
  alternative: आज्ञाओं का पालन किया
  rationale: यूनानी ἐξεζήτησα स्पष्टतः खोजने/मन लगाकर तलाशने की क्रिया है। पालन का भाव प्रसंग में निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट कर देना मूल की अर्थ-सीमा को संकरा कर देता।
- issue: अंतिम कृदंत का संबंध
  choice: ‘अपनी पूरी शक्ति से चलते हुए’ को संरचनात्मक रूप से खुला रखा
  alternative: ‘अपनी पूरी शक्ति से आज्ञाओं को खोजा’ या ‘पूरी शक्ति से उन पर चला’
  rationale: यूनानी पदक्रम में κατὰ πᾶσαν ἰσχύν μου और πορευόμενος का सटीक पारस्परिक संबंध कुछ हद तक खुला है। अनुवाद दोनों को रखता है और किसी एक व्याख्या को पूर्णतः आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। दो समन्वित कथनों को अर्धविराम से अलग कर यूनानी वाक्य की प्रवाहशीलता और दूसरे καί का बल बनाए रखा गया है।
