id: T12P.SIM.7.2
reference: Testament of Simeon 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ἀναστήσει γὰρ¹³ Κύριος¹⁴ ἐκ¹⁵ τοῦ Λευὶ ὡς¹⁶ ἀρχιερέα *καὶ ἐκ¹⁷ τοῦ Ἰούδα¹⁸ ὡς¹⁵ βασιλέα¹⁹ [Θεὸν καὶ ἄνθρωπον]²⁰, οὗτος²¹ σώσει *[πάντα τὰ ἔθνη καὶ] τὸ γένος τοῦ Ἰσραήλ²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/002.yaml
  text: For the Lord will raise up from Levi a high priest, and from Judah a king, [God and man]; he will save [all the nations and] the race of Israel.
translation:
  language: hi
  text: क्योंकि प्रभु लेवी में से महायाजक के रूप में और यहूदा में से राजा के रूप में [परमेश्वर और मनुष्य] को खड़ा करेगा; वह [सब राष्ट्रों को और] इस्राएल के वंश को बचाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστήσει
  choice: खड़ा करेगा
  rationale: यह ἐγείρω/ἀνίστημι से जुड़े उठाने या नियुक्त करने के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκ τοῦ Λευὶ / ἐκ τοῦ Ἰούδα
  choice: लेवी में से / यहूदा में से
  rationale: ἐκ के उद्गम अथवा वंशगत स्रोत के अर्थ को सीधे व्यक्त करता है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: यह प्रचलित और सटीक धार्मिक पदनाम है।
- source_word: βασιλέα
  choice: राजा
  rationale: राजकीय पद का सीधा आधुनिक हिन्दी समतुल्य।
- source_word: τὰ ἔθνη
  choice: सब राष्ट्रों
  rationale: संदर्भ में ἔθνη का व्यापक सामूहिक अर्थ रखा गया है; इसे केवल गैर-यहूदियों तक सीमित नहीं किया गया।
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: इस्राएल के वंश
  rationale: γένος के कुल, जाति अथवा वंश के अर्थों में यहाँ 'वंश' स्वाभाविक है और मूल की वंशगत धारणा बचाता है।
- source_word: σώσει
  choice: बचाएगा
  rationale: भविष्यकालीन उद्धार/रक्षा के व्यापक अर्थ को साधारण, स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाक्यांश Θεὸν καὶ ἄνθρωπον की पाठ-संदिग्धता
  choice: '[परमेश्वर और मनुष्य] को कोष्ठकों में रखा गया'
  alternative: बिना कोष्ठक इसे निश्चित मूल पाठ मानना, या इसे हटा देना
  rationale: प्रदत्त यूनानी संस्करण में यह वाक्यांश वर्ग कोष्ठकों में है; इसलिए उसकी पाठालोचनात्मक अनिश्चितता को अनुवाद में भी स्पष्ट रखा गया है।
- issue: πάντα τὰ ἔθνη καὶ की पाठ-संदिग्धता
  choice: '[सब राष्ट्रों को और] को कोष्ठकों में रखा गया'
  alternative: इसे निश्चित पाठ के रूप में शामिल करना, या केवल इस्राएल के वंश का उल्लेख करना
  rationale: स्रोत में यह अंश वर्ग कोष्ठकों में है। कोष्ठक व्यापक राष्ट्र-उद्धार वाले पाठ और छोटे पाठ, दोनों की गवाही को सुरक्षित रखते हैं।
- issue: ὡς का अनुवाद
  choice: 'हिन्दी में पदों को सीधे अनिश्चित पदबंध के रूप में प्रस्तुत किया: ''एक महायाजक'' और ''एक राजा'''
  alternative: '''महायाजक के रूप में'' और ''राजा के रूप में'''
  rationale: यूनानी ὡς की उपस्थिति मान्य है, पर इस निर्माण में हिन्दी का सीधा पदबंध अधिक स्वाभाविक है और व्यक्ति की भूमिका/पद का वही अर्थ देता है।
- issue: οὗτος का बल
  choice: '''वही'''
  alternative: '''वह'''
  rationale: यह सर्वनाम पूर्वोक्त व्यक्तित्व की ओर संकेत करता है; 'वही' उसका संकेतात्मक बल बनाए रखता है, बिना इस अस्पष्टता को पूरी तरह सुलझाए कि दोनों पद एक संयुक्त व्यक्तित्व का वर्णन कैसे करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण धार्मिक शैली। स्रोत में वर्ग कोष्ठकों से चिह्नित दोनों पाठ-संदिग्ध अंशों को उसी प्रकार सुरक्षित रखा गया है। कोई फुटनोट आवश्यक नहीं; इसलिए मुख्य पाठ में फुटनोट-चिह्न नहीं हैं।
