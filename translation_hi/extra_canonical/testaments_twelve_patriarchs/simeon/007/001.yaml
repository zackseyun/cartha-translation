source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα¹ μου, ἐπακούσατε² τοῦ³ Λευὶ καὶ τοῦ⁴ Ἰούδα⁵ καὶ⁷ μὴ ἐπαίρεσθε⁸ ἐπὶ τὰς δύο γενεὰς⁹ ταύτας, ὅτι ἐξ αὐτῶν¹⁰ ἀνατελεῖ ἡμῖν¹¹ τὸ σωτήριον ⌜τοῦ Θεοῦ⌝¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/001.yaml
  text: And now, my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will rise for us.
translation:
  language: hi
  text: और अब, मेरे बच्चों, लेवी और यहूदा की बात सुनो। इन दोनों गोत्रों से अपने आपको ऊँचा न समझो, क्योंकि इन्हीं में से हमारे लिए परमेश्वर का उद्धार[a] उदय होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर का’ शब्द यूनानी संस्करण में पाठगत अनिश्चितता दर्शाने वाले संपादकीय चिह्नों के भीतर हैं।
    reason: प्रदत्त स्रोत-पाठ में ⌜τοῦ Θεοῦ⌝ विशेष संपादकीय चिह्नों में है; इसलिए इस पाठगत अनिश्चितता को सूचित करना आवश्यक है।
lexical_decisions:
- source_word: ἐπακούσατε
  choice: की सुनो
  rationale: यह आज्ञार्थक क्रिया केवल सुनने नहीं, बल्कि ध्यान देकर मानने का भाव रखती है; हिंदी में ‘की सुनो’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γενεὰς
  choice: गोत्रों
  rationale: यहाँ लेवी और यहूदा से निकले इस्राएली वंश-समूह अभिप्रेत हैं; प्रसंग में ‘गोत्र’ आधुनिक हिंदी बाइबलीय प्रयोग में सबसे स्पष्ट है।
- source_word: μὴ ἐπαίρεσθε ἐπὶ
  choice: से अपने आपको ऊँचा न समझो
  rationale: मूल में स्वयं को इन दो समूहों के ऊपर उठाने या उनसे श्रेष्ठ मानने का भाव है; यह अनुवाद तुलना और घमंड दोनों को बनाए रखता है।
- source_word: ἀνατελεῖ
  choice: उदय होगा
  rationale: क्रिया का मूल बिंब उगने या उदित होने का है; ‘उदय होगा’ उस बिंब को बनाए रखते हुए हिंदी में गरिमापूर्ण और बोधगम्य है।
- source_word: τὸ σωτήριον
  choice: उद्धार
  rationale: यह संज्ञा छुटकारे या उद्धार को दर्शाती है; ‘उद्धार’ धार्मिक संदर्भ में परिचित है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: उद्धार का लेवी और यहूदा ‘में से’ उदय होना
  choice: इन्हीं में से हमारे लिए परमेश्वर का उद्धार उदय होगा
  alternative: इन दोनों के द्वारा परमेश्वर हमें उद्धार देगा
  rationale: मूल पाठ उद्धार के इन दोनों गोत्रों ‘में से’ उदय होने की बात करता है, पर उसकी प्रक्रिया या प्रतिनिधियों को स्पष्ट नहीं करता। चुना हुआ रूप उस संभावित मसीही या याजकीय-राजकीय संकेत को व्याख्या द्वारा सीमित नहीं करता।
- issue: τοῦ Θεοῦ की पाठगत स्थिति
  choice: मुख्य पाठ में ‘परमेश्वर का’ रखा और पाठगत टिप्पणी जोड़ी
  alternative: केवल ‘उद्धार’
  rationale: प्रदत्त यूनानी संस्करण में ये शब्द संपादकीय पाठगत चिह्नों के भीतर हैं। अर्थपूर्ण पाठ को मुख्य अनुवाद में रखते हुए पादटिप्पणी वास्तविक पाठगत अनिश्चितता बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण संबोधन रखा गया है। ‘मेरे बच्चो’ सामान्य पाठक के लिए स्वाभाविक है; ‘गोत्र’, ‘उद्धार’ और ‘उदय’ मूल के वंशगत, धार्मिक और रूपकात्मक आयामों को बनाए रखते हैं।
