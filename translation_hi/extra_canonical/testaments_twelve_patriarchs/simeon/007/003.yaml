review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the command to the children and their keeping/observance of what was commanded across successive generations. However, “तुम्हें ये बातें मानने की आज्ञा देता हूँ” makes obedience by the present addressees explicit within the first command. Greek ἐντέλλομαι ὑμῖν ταῦτα means “I command/charge you these things,” without separately stating “to obey.”
  naturalness: The proposed revision is idiomatic modern standard Hindi and retains the formal, exhortative register. “इन बातों की आज्ञा देता हूँ” naturally expresses commanding these matters, while the following purpose clauses remain clear.
  terminology: “संतानों” appropriately renders τέκνοις inclusively. “पालन करें” is suitable for φυλάξωσιν in relation to instructions. “अपनी पीढ़ियों तक” preserves the possessive ambiguity and forward-generational scope of εἰς τὰς γενεὰς αὐτῶν without adding an ethnic referent.
  issues:
  - severity: medium
    issue: 'The first clause adds an explicit infinitival object: “मानने की.”'
    rationale: This recasts “I command these things to you” as “I command you to obey these things.” While obedience is contextually expected, it is not expressed by a separate verb or infinitive in the Greek and should not be inserted where a natural Hindi alternative is available.
  revised_text: इसलिए मैं तुम्हें इन बातों की आज्ञा देता हूँ, ताकि तुम भी अपनी संतानों को आज्ञा दो कि वे अपनी पीढ़ियों तक इनका पालन करें।
  revised_footnotes: []
