translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; संबोधन बहुवचन ‘तुम’ है। वाक्य की उद्देश्यसूचक शृंखला और पीढ़ियों तक आज्ञा पहुँचाने का क्रम सुरक्षित रखा गया है।
