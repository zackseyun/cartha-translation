  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/003.yaml
  text: Therefore I command these things to you, so that you also may command your children, that they may keep them for their generations.
translation:
  language: hi
  text: इसलिए मैं तुम्हें इन बातों की आज्ञा देता हूँ, ताकि तुम भी अपनी संतानों को आज्ञा दो कि वे अपनी पीढ़ियों तक इनका पालन करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι / ἐντέλλεσθε
  choice: मानने की आज्ञा देता हूँ / मानने की आज्ञा दो
  rationale: क्रिया का मूल अर्थ आज्ञा देना है। हिन्दी में केवल ‘ये बातें आज्ञा देता हूँ’ अस्वाभाविक होता, इसलिए निहित पालन को ‘मानने’ से स्पष्ट किया गया है।
- source_word: τέκνοις
  choice: सन्तानों
  rationale: यहाँ अगली पीढ़ियों तक निर्देश पहुँचाने का प्रसंग है; ‘सन्तान’ पुत्र-पुत्रियों दोनों को समेटता है।
- source_word: φυλάξωσιν αὐτά
  choice: इनका पालन करें
  rationale: φυλάσσω का अर्थ सुरक्षित रखना या ध्यानपूर्वक मानना हो सकता है; आदेशों के संदर्भ में ‘पालन करना’ स्वाभाविक और सटीक है।
- source_word: εἰς τὰς γενεὰς αὐτῶν
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा निर्देशों के भावी पीढ़ियों में निरंतर पालन का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना स्रोत से बाहर कोई जातीय विस्तार जोड़े।
