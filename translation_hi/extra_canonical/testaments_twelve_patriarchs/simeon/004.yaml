  text: 1[a]. Now my father kept asking about me, because he had seen me gloomy, and I told him, “My liver is swollen.” 2. For I was grieving more than all the others, because I was responsible for the sale of Joseph. 3. And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not distressed. 4. But Joseph was a good man[b], and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers. 5. Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you favor and glory and blessing upon your heads, just as you saw in Joseph. 6. All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us riches and livestock and produce. 7. And you also, my children, let each one love his brother with a good heart, and the spirit of
    envy will depart from you. 8. For this makes the soul savage, and destroys the body; it brings anger and war to one’s designs, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling. 9. For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body start up in fear, and wakes the mind in turmoil; and like an evil and venomous spirit[c][d], so he appears to people.
translation:
  language: hi
  text: '**शिमोन का वसीयतनामा 4**


    1. मेरे पिता मेरे विषय में बार-बार पूछते रहते थे, क्योंकि उन्होंने मुझे उदास देखा था। मैंने उनसे कहा, “मेरा कलेजा सूज गया है।”[a] 2. मैं सबसे बढ़कर शोक कर रहा था, क्योंकि यूसुफ को बेचे जाने के लिए मैं ही उत्तरदायी था। 3. जब हम मिस्र गए और उसने मुझे जासूस समझकर बाँध दिया, तब मैं जान गया कि मैं न्याय के अनुसार दुःख भोग रहा हूँ, और मैं व्याकुल नहीं हुआ।


    4. पर यूसुफ भला मनुष्य था। परमेश्वर की आत्मा उसमें थी, और वह करुणामय और दयालु था। उसने मुझसे बैर नहीं रखा, बल्कि मुझसे और मेरे भाइयों से प्रेम किया। 5. इसलिए, मेरे बच्चो, हर प्रकार की जलन और डाह से अपने आपको बचाए रखो[b] और हृदय की निष्कपटता से चलो,[c] ताकि परमेश्वर तुम्हें भी कृपा, महिमा और आशीष तुम्हारे सिरों पर प्रदान करे, जिन्हें तुमने यूसुफ में देखा है। 6. उसने जीवन भर इस बात के लिए हमें कभी ताना नहीं दिया। इसके विपरीत, उसने हमें अपने प्राण के समान प्रेम किया, अपने पुत्रों से भी बढ़कर हमारा सम्मान किया और हमें धन, पशु और उपज उदारता से दी।


    7. मेरे बच्चो, तुम भी अपने-अपने भाई से सच्चे मन से प्रेम करो, और डाह की आत्मा तुमसे दूर हो जाएगी। 8. क्योंकि डाह प्राण को उग्र बना देती है और शरीर को नष्ट करती है। वह मनुष्य के विचारों में क्रोध और संघर्ष उत्पन्न करती है, उसे रक्तपात के लिए उकसाती है, बुद्धि को उन्माद में ले जाती है, प्राण में खलबली और शरीर में कंपकंपी पैदा करती है। 9. यहाँ तक कि नींद में भी डाह उसे बुराई के दृश्य दिखाकर खाती रहती है, दुष्ट आत्माओं से उसके प्राण को व्याकुल करती है, उसके शरीर को भय से चौंका देती है और अशांति में उसकी बुद्धि को जगा देती है। इस प्रकार वह लोगों को किसी दुष्ट और विषैले आत्मा के समान दिखाई देता है।[d]


    **पादटिप्पणियाँ**


    [a] “मेरा कलेजा सूज गया है” भीतरी पीड़ा या व्याकुलता बताने वाला एक प्राचीन शारीरिक मुहावरा है। शिमोन अपने पिता को अपने उदास दिखाई देने का शारीरिक कारण बताता है।


    [b] “जलन” और “डाह” यहाँ दो परस्पर संबंधित यूनानी शब्दों (ζῆλος और φθόνος) का अनुवाद हैं; इस प्रसंग में दोनों का अर्थ नकारात्मक है।


    [c] “हृदय की निष्कपटता” का अनुवाद “एकनिष्ठ हृदय” या “हृदय की सच्चाई” भी किया जा सकता है।


    [d] अंतिम वाक्य के दो अर्थ संभव हैं: डाह रखने वाला व्यक्ति लोगों को दुष्ट और विषैले आत्मा जैसा दिखाई देता है, अथवा डाह स्वयं ऐसी दिखाई देती है।'
  philosophy: optimal-equivalence
