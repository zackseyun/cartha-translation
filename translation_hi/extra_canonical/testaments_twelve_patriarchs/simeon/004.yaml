    4. पर यूसुफ भला मनुष्य था। परमेश्वर का आत्मा उसमें था, और वह करुणामय और दयालु था। उसने मुझसे बैर नहीं रखा, बल्कि मेरे भाइयों के साथ मुझसे भी प्रेम किया। 5. इसलिए, मेरे बच्चो, हर प्रकार की जलन और डाह से अपने आप को बचाए रखो[b] और मन की निष्कपटता से चलो,[c] ताकि परमेश्वर तुम्हें भी कृपा, महिमा और आशीष प्रदान करे—तुम्हारे सिरों पर—जैसा तुमने यूसुफ में देखा है। 6. उसने जीवन भर इस बात के लिए हमें कभी ताना नहीं दिया। इसके विपरीत, उसने हमें अपने प्राण के समान प्रेम किया, अपने पुत्रों से भी बढ़कर हमारा सम्मान किया और हमें धन, पशु और उपज उदारता से दी।


    7. मेरे बच्चो, तुम भी अपने-अपने भाई से सच्चे मन से प्रेम करो, और डाह की आत्मा तुमसे दूर हो जाएगी। 8. क्योंकि डाह प्राण को हिंसक बना देती है और शरीर को नष्ट करती है। वह मनुष्य के विचारों में क्रोध और संघर्ष उत्पन्न करती है, उसे रक्तपात के लिए उकसाती है, बुद्धि को उन्माद में ले जाती है, प्राण में खलबली और शरीर में कंपकंपी पैदा करती है। 9. यहाँ तक कि नींद में भी डाह उसे बुराई के दृश्य दिखाकर भीतर से खाती रहती है, दुष्ट आत्माओं से उसके प्राण को व्याकुल करती है, उसके शरीर को भय से चौंका देती है और अशांति में उसकी बुद्धि को जगा देती है। इस प्रकार वह लोगों को किसी दुष्ट और विषैले आत्मा के समान दिखाई देता है।[d]


    **पादटिप्पणियाँ**


    [a] “मेरा कलेजा सूज गया है” भीतरी पीड़ा या व्याकुलता बताने वाला एक प्राचीन शारीरिक मुहावरा है। शिमोन अपने पिता को अपने उदास दिखाई देने का शारीरिक कारण बताता है।


    [b] “जलन” और “डाह” यहाँ दो परस्पर संबंधित यूनानी शब्दों (ζῆλος और φθόνος) का अनुवाद हैं; इस प्रसंग में दोनों का अर्थ नकारात्मक है।


    [c] “मन की निष्कपटता” का अनुवाद “एकनिष्ठ मन” या “मन की सच्चाई” भी किया जा सकता है।


    [d] अंतिम वाक्य के दो अर्थ संभव हैं: डाह रखने वाला व्यक्ति लोगों को दुष्ट और विषैले आत्मा जैसा दिखाई देता है, अथवा डाह स्वयं ऐसी दिखाई देती है।'
