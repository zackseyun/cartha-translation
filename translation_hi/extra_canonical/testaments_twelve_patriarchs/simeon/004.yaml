lexical_decisions:
- source_word: σκυθρωπός
  choice: उदास
  rationale: दिखाई देने वाली मनोव्यथा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: मेरा कलेजा सूज गया है
  rationale: प्राचीन शारीरिक मुहावरे की ठोस छवि को बनाए रखता है; उसका सांस्कृतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τῆς πράσεως
  choice: बेचे जाने
  rationale: यह सामान्य विश्वासघात नहीं, विशेष रूप से यूसुफ की बिक्री को सूचित करता है।
- source_word: δικαίως πάσχω
  choice: न्याय के अनुसार दुःख भोग रहा हूँ
  rationale: δικαίως के नैतिक-न्यायिक भाव को सुरक्षित रखता है और अपराध के उचित परिणाम का संकेत देता है।
- source_word: ἀγαθὸς ἀνήρ
  choice: भला मनुष्य
  rationale: सरल और गरिमापूर्ण हिन्दी में यूसुफ के नैतिक चरित्र को व्यक्त करता है।
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  choice: परमेश्वर का आत्मा उसमें था
  rationale: यूनानी वाक्य की सीधी संरचना और दिव्य उपस्थिति के प्रबल अर्थ को बनाए रखता है।
- source_word: ἐμνησικάκησέν
  choice: बैर नहीं रखा
  rationale: पुराने अपराध को मन में रखकर द्वेष न पालने का मुहावरेदार हिन्दी रूप है।
- source_word: ἁπλότης καρδίας
  choice: मन की निष्कपटता
  rationale: कपटहीन, अविभाजित और सच्चे भीतरी स्वभाव को व्यक्त करता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ζῆλος / φθόνος
  choice: जलन और डाह
  rationale: संबंधित किन्तु अलग दोनों नकारात्मक पदों को बनाए रखता है।
- source_word: ψυχή
  choice: प्राण
  rationale: शरीर, बुद्धि और आत्मिक प्रभावों के साथ प्रयुक्त मानव-स्वभाव संबंधी भाषा को सामान्य हिन्दी में अलग और पहचाने जाने योग्य रखता है।
- source_word: ἐδόξασεν
  choice: सम्मान किया
  rationale: यहाँ किसी को प्रतिष्ठा देने का अर्थ है, न कि उसे उपासना-संबंधी महिमा देना।
- source_word: ἔκστασις
  choice: उन्माद
  rationale: सामान्य मानसिक विचलन से अधिक तीव्र, नियंत्रण खो देने वाली अवस्था को दर्शाता है।
- source_word: ἰοβόλον
  choice: विषैला
  rationale: विष फैलाने या विष से भरे होने की यूनानी छवि को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: यूसुफ में πνεῦμα θεοῦ
  choice: परमेश्वर का आत्मा उसमें था
  alternative: परमेश्वर की ओर से एक आत्मा उसमें था / परमेश्वर की आत्मा उसमें थी
  rationale: प्रसंग दिव्य उपस्थिति या सामर्थ्य की ओर प्रबल संकेत करता है, पर अनुवाद मूल पदबंध से आगे जाकर उसके कार्य का धर्मसैद्धान्तिक विवरण नहीं जोड़ता।
- issue: ψυχή की मानव-स्वभाव संबंधी भाषा
  choice: प्राण
  alternative: जीवन / अंतर्मन / आत्मा
  rationale: अध्याय में ψυχή शरीर और बुद्धि के साथ अलग रूप में आता है। “प्राण” उस वैचारिक भेद को बनाए रखते हुए आधुनिक हिन्दी पाठक के लिए समझने योग्य है।
- issue: अंतिम वाक्य का कर्ता
  choice: हिन्दी सर्वनाम “वह” द्वारा संदर्भ को खुला रखा गया
  alternative: डाह रखने वाला व्यक्ति दुष्ट आत्मा जैसा दिखाई देता है / डाह दुष्ट आत्मा जैसी दिखाई देती है
  rationale: यूनानी वाक्य में अंतिम कर्ता का संदर्भ व्यक्ति अथवा डाह—दोनों की ओर लिया जा सकता है; मुख्य पाठ इस वास्तविक अस्पष्टता को नहीं मिटाता और पादटिप्पणी दोनों अर्थ बताती है।
