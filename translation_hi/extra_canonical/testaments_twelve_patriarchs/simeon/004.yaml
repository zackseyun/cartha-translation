  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, वसीयतनामात्मक उपदेशात्मक स्वर रखा गया है। “बच्चो,” “अपने-अपने भाई,” और “अपने आप को बचाए रखो” जैसे रूप सामान्य पाठक के लिए सहज हैं। प्राचीन शारीरिक मुहावरे और प्राण-शरीर-बुद्धि की वैचारिक शब्दावली को अत्यधिक आधुनिक मनोवैज्ञानिक भाषा में विलीन नहीं किया गया।
