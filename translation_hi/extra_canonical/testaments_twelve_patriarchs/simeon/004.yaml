    reason: lexical_alternative
  - marker: c
    text: “हृदय की निष्कपटता” का अनुवाद “एकनिष्ठ हृदय” या “हृदय की सच्चाई” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: 'अंतिम वाक्य के दो अर्थ संभव हैं: डाह रखने वाला व्यक्ति लोगों को दुष्ट और विषैले आत्मा जैसा दिखाई देता है, अथवा डाह स्वयं ऐसी दिखाई देती है।'
