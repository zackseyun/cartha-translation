base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/001.yaml
  text: A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died.
translation:
  language: hi
  text: शिमोन के वचनों की एक प्रति[a]—वे वचन जो उसने अपने पुत्रों से उसकी मृत्यु से पहले, अपने जीवन के एक सौ बीसवें वर्ष में, उस समय जब उसका भाई यूसुफ मरा, कहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शिमोन के वचनों का अभिलेख’।
    reason: Ἀντίγραφον के ‘प्रति’ और ‘लिखित अभिलेख’ दोनों सम्भव अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: वचनों की एक प्रति
  rationale: Ἀντίγραφον का मूल अर्थ लिखित प्रति या नकल है; λόγων के लिए ‘वचनों’ गरिमापूर्ण और स्वाभाविक है। वैकल्पिक अर्थ ‘वचनों का अभिलेख’ पादटिप्पणी में रखा गया है।
- source_word: ἐλάλησε τοῖς υἱοῖς αὐτοῦ
  choice: उसने ... अपने पुत्रों से कही थी
  rationale: यूनानी में संबोधन का भाव है; हिन्दी में ‘पुत्रों से कही’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτὸν
  choice: मरने से पहले
  rationale: मूल के काल-संबंध को सीधे और सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  choice: अपने जीवन के एक सौ बीसवें वर्ष में
  rationale: क्रमवाचक यूनानी अभिव्यक्ति का औपचारिक किंतु स्पष्ट हिन्दी रूप।
- source_word: ἐν ᾧ χρόνῳ
  choice: उस समय जब
  rationale: समकालिकता को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
