  text: 'And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up, kissed them[b], and said:'
translation:
  language: hi
  text: 'जब शिमोन बीमार था, तब उसके पुत्र उससे मिलने आए। अपनी शक्ति बटोरकर वह उठ बैठा, उन्हें चूमा[a] और कहा:'
  philosophy: optimal-equivalence
