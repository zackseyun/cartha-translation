    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρρωστοῦντος
  choice: जब … बीमार था
  rationale: यूनानी संबंधवाचक कृदंत की कालगत पृष्ठभूमि को स्वाभाविक आधुनिक हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: ἐπισκέψασθαι
  choice: मिलने
  rationale: बीमार व्यक्ति के पास जाकर उसका हाल जानने के अर्थ में ‘मिलने’ सहज हिन्दी है; प्रसंग से भेंट का उद्देश्य स्पष्ट रहता है।
- source_word: ἐνισχύσας
  choice: अपने को सँभाला
  rationale: यहाँ क्रिया का भाव बीमारी की दशा में शक्ति जुटाने या स्वयं को संभालने का है; इस हिन्दी प्रयोग में दोनों पहलू स्वाभाविक रूप से आते हैं।
- source_word: ἐκάθισε
  choice: उठकर बैठ गया
  rationale: बीमार शिमोन के संदर्भ में केवल ‘बैठा’ कहने के बजाय हिन्दी का यह प्रयोग लेटी हुई अवस्था से बैठने का प्रसंगगत भाव स्पष्ट करता है।
- source_word: κατεφίλησεν
  choice: स्नेह से चूमा
  rationale: उपसर्गयुक्त तीव्र क्रिया आत्मीय अथवा बार-बार चूमने का संकेत दे सकती है। मुख्य पाठ में स्नेह का भाव रखा गया है और संभावित पुनरावृत्ति को टिप्पणी में बताया गया है।
