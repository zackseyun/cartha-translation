base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006.yaml
  text: '1 Behold, I have told you everything, so that I may be cleared from your sin. 2 But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.


    3 Then the seed of Canaan will perish, and no remnant will remain for Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed. 4 Then the land of Ham will fail, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.


    5 Then a great sign will be glorified for Israel, because the Lord God, appearing on the earth, will come and save Adam in him. 6 Then all the spirits of deceit will be given over to be trampled down, and men will rule over the evil spirits. 7 Then I also will arise in gladness, and I will bless the Most High for his wonders.'
translation:
  language: hi
  text: '**शिमोन का वसीयतनामा 6**


    **1** देखो, मैंने तुमसे सब कुछ कह दिया है, ताकि मैं तुम्हारे पाप से दोषमुक्त ठहरूँ। **2** पर यदि तुम अपने भीतर से ईर्ष्या और हृदय की हर कठोरता निकाल दो, तो मेरी हड्डियाँ इस्राएल में गुलाब के समान खिलेंगी, और मेरा शरीर याकूब में सोसन के फूल के समान होगा; मेरी सुगंध लबानोन की सुगंध के समान होगी। मुझसे पवित्र जन युगानुयुग बढ़ते जाएँगे, और उनकी शाखाएँ दूर-दूर तक फैलेंगी।


    **3** तब कनान का वंश मिट जाएगा, और अमालेक में कोई बचा हुआ न रहेगा। कप्पदूकिया के सभी लोग नष्ट हो जाएँगे, और सभी हित्ती पूरी तरह मिटा दिए जाएँगे। **4** तब हाम का देश लुप्त हो जाएगा, और हर एक जाति नष्ट हो जाएगी। तब सारी पृथ्वी अशांति से और आकाश के नीचे का सारा संसार युद्ध से विश्राम पाएगा।


    **5** तब इस्राएल के लिए एक महान चिह्न महिमामय किया जाएगा।[a] **6** तब छल की सभी आत्माएँ पैरों तले रौंदे जाने के लिए सौंप दी जाएँगी, और मनुष्य दुष्ट आत्माओं पर शासन करेंगे। **7** तब मैं भी आनन्द में जी उठूँगा और परमप्रधान को उसके अद्भुत कामों के लिए धन्य कहूँगा। [क्योंकि परमेश्वर ने शरीर धारण करके और मनुष्यों के साथ भोजन करके मनुष्यों को बचाया।][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त यूनानी पाठ में पद 5 इतना ही है। कुछ पाठ-रूपों में इसके बाद पृथ्वी पर परमेश्वर के प्रकट होने और आदम को बचाने से संबंधित एक अतिरिक्त वाक्य मिलता है।
    reason: अंग्रेज़ी परामर्श-पाठ और प्रदत्त यूनानी स्रोत के बीच महत्त्वपूर्ण पाठांतर को सूचित करना आवश्यक है।
  - marker: b
    text: ‘क्योंकि परमेश्वर ने…मनुष्यों को बचाया’ वाला वाक्य इस यूनानी संस्करण में वर्ग कोष्ठकों में है, जो इसकी पाठीय स्थिति को अनिश्चित दर्शाते हैं।
    reason: स्रोत-संस्करण में स्पष्ट रूप से चिह्नित पाठीय अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: मैं तुम्हारे पाप के दोष से निर्दोष ठहरूँ
  rationale: न्यायिक भाव को बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है; वाक्य को इस तरह नहीं बदला गया कि शिमोन स्वयं को धर्मी ठहराने का दावा करता प्रतीत हो।
- source_word: σκληροκαρδίαν
  choice: हर प्रकार की कठोरता
  rationale: शाब्दिक अर्थ ‘हृदय की कठोरता’ है; प्रसंग में भीतरी कठोर मनोवृत्ति अभिप्रेत है और ‘अपने भीतर से’ इसे स्पष्ट करता है।
- source_word: ἅγιοι
  choice: पवित्र जन
  rationale: यह बहुवचन संज्ञा है; ‘संत’ की संभावित संस्थागत या पंथगत ध्वनि से बचते हुए मूल अर्थ रखा गया है।
- source_word: σπέρμα Χαναάν
  choice: कनान का वंश
  rationale: σπέρμα का शाब्दिक अर्थ ‘बीज’ है, पर जातीय वंश के संदर्भ में ‘वंश’ आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: πάντα τὰ πνεύματα τῆς πλάνης
  choice: छल की सभी आत्माएँ
  rationale: πλάνη भ्रम, भटकाव या छल को सूचित कर सकता है; यहाँ दुष्ट आत्माओं के समानांतर ‘छल’ उपयुक्त है, पर सत्ता-संबंधी कथन को बढ़ाया नहीं गया।
- source_word: ἀναστησόμαι
  choice: जी उठूँगा
  rationale: भविष्यकालीन पुनरुत्थान का सामान्य अर्थ सुरक्षित है; केवल ‘उठ खड़ा होऊँगा’ कहने से संभावित पुनरुत्थान-संकेत धुँधला पड़ता।
- source_word: ἐνδοξασθήσεται
  choice: महिमामय किया जाएगा
  rationale: असामान्य यूनानी कर्मवाच्य को सहज व्याख्या से बदलने के बजाय हिन्दी में भी कर्मवाच्य रखा गया है।
theological_decisions:
- issue: पद 5 में अंग्रेज़ी परामर्श-पाठ का विस्तृत उद्धार-वाक्य
  choice: प्रदत्त यूनानी पाठ में उपलब्ध केवल ‘इस्राएल के लिए एक महान चिह्न महिमामय किया जाएगा’ का अनुवाद
  alternative: ‘क्योंकि प्रभु परमेश्वर पृथ्वी पर प्रकट होकर आएगा और उसमें आदम को बचाएगा’ जोड़ना
  rationale: प्रदत्त यूनानी स्रोत में यह अतिरिक्त वाक्य नहीं है; इसलिए परामर्श-स्तर के अंग्रेज़ी पाठ से इसे मूल पाठ में आयात नहीं किया गया।
- issue: पद 7 का कोष्ठकबद्ध देहधारण-वाक्य
  choice: वाक्य का अनुवाद पाठ में कोष्ठकों सहित रखा और पाठालोचनात्मक टिप्पणी दी
  alternative: इसे बिना संकेत मुख्य पाठ में मिला देना या पूर्णतः हटा देना
  rationale: यूनानी स्रोत इसे वर्ग कोष्ठकों में देता है, इसलिए इसकी अनिश्चित पाठीय स्थिति को छिपाया नहीं गया।
- issue: ‘परमेश्वर ने शरीर धारण किया’ की व्याख्या
  choice: मूल कथन का सीधा अनुवाद
  alternative: इसे किसी विशिष्ट मसीही व्यक्ति या परिभाषित सिद्धान्त से स्पष्ट करना
  rationale: मूल में व्यक्ति का नाम नहीं दिया गया; किसी सम्प्रदायगत पहचान या विकसित धर्मवैज्ञानिक सूत्र को जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। जातीय नामों को प्रचलित बाइबिलीय रूपों—कनान, अमालेक, कप्पदूकी, हित्ती और हाम—में रखा गया है। काव्यात्मक वनस्पति-चित्रों तथा भविष्यसूचक कर्मवाच्य को यथासंभव सुरक्षित रखा गया है।
