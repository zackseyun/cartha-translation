  text: And when Simeon had finished commanding his sons, he fell asleep with his fathers, being one hundred and twenty years old.
translation:
  language: hi
  text: और जब शिमोन अपने पुत्रों को आज्ञाएँ दे चुका था, तब वह अपने पूर्वजों के साथ सो गया; उसकी आयु एक सौ बीस वर्ष थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: आज्ञाएँ दे चुका
  rationale: यह संयुक्त अभिव्यक्ति निर्देश देने की क्रिया पूरी हो जाने को बताती है; सहज हिन्दी में पूर्णता बनाए रखने के लिए यह रूप चुना गया।
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: अपने पुत्रों को
  rationale: यूनानी संबंधवाचक सर्वनाम और अप्रत्यक्ष कर्म का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: मृत्यु के लिए प्रयुक्त मूल के सौम्य रूपक को स्पष्ट किए बिना ज्यों का त्यों बनाए रखता है।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: अपने पूर्वजों के साथ
  rationale: πατέρες यहाँ व्यापक वंशगत अर्थ में है; ‘पूर्वज’ आधुनिक हिन्दी में ‘पितरों’ की अपेक्षा अधिक सहज और गैर-सांप्रदायिक है।
- source_word: ὢν ἐτῶν ἑκατὸν εἴκοσι
  choice: एक सौ बीस वर्ष की आयु में
  rationale: आयु बताने वाले यूनानी कृदन्तीय वाक्यांश का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: मृत्यु के लिए निद्रा का रूपक
  choice: सो गया
  alternative: मर गया
  rationale: ‘मर गया’ आशय स्पष्ट करता, पर ἐκοιμήθη में उपस्थित निद्रा-रूपक और उसकी सम्भावित धार्मिक अनुगूँज मिटा देता; इसलिए मूल रूपक सुरक्षित रखा गया।
- issue: ‘पिताओं’ का वंशगत अर्थ
  choice: पूर्वजों
  alternative: पितरों
  rationale: ‘पूर्वजों’ मूल के सामूहिक वंशगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और अनावश्यक कर्मकाण्डीय अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल यूनानी की घटनाक्रम-संरचना, पूर्ण हुई आज्ञा और मृत्यु के निद्रा-रूपक को सुरक्षित रखा गया है।
