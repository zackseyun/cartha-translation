  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी। यूनानी पाठ की दो-वाक्यीय संरचना तथा हड्डियों को हेब्रोन पहुँचाने का संदर्भ सुरक्षित रखा गया है। युद्ध के पक्षों या कारण के बारे में पाठ से अधिक स्पष्टता नहीं जोड़ी गई।
