translation:
  language: hi
  text: और उन्होंने उसे लकड़ी के एक ताबूत में रखा, उसकी हड्डियों को हेब्रोन ले जाने के लिए। और मिस्रियों के एक युद्ध में वे उन्हें गुप्त रूप से हेब्रोन ले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θήκῃ ξυλίνῃ
  choice: लकड़ी के एक ताबूत में
  rationale: θήκη संदर्भ में शव रखने की पेटी है; ‘ताबूत’ आधुनिक हिन्दी में स्वाभाविक और सटीक है, जबकि ξυλίνη उसकी लकड़ी की सामग्री स्पष्ट करता है।
- source_word: ἀναγαγεῖν / ἀνήγαγον
  choice: ले जाएँ / वहाँ ले गए
  rationale: क्रिया का मूल भाव ऊपर अथवा पूर्वोक्त गंतव्य तक ले जाना है। हिन्दी में हेब्रोन की ओर गमन को स्वाभाविक ढंग से व्यक्त किया गया; दूसरे वाक्य में ‘वहाँ’ हेब्रोन को स्पष्टतः पुनः इंगित करता है।
- source_word: τὰ ὀστᾶ αὐτοῦ / αὐτά
  choice: उसकी हड्डियाँ / उन्हें
  rationale: सर्वनामों का संबंध शिमोन की हड्डियों से बनाए रखा गया है।
- source_word: ἐν πολέμῳ Αἰγυπτίων
  choice: मिस्रियों के युद्ध के समय
  rationale: शाब्दिक संरचना ‘मिस्रियों के युद्ध में’ है, पर हिन्दी में यह संबंध अस्पष्ट हो सकता है; ‘के समय’ ἐν के कालगत संदर्भ को स्वाभाविक रूप देता है और युद्ध किसके बीच था, यह अनिर्धारित ही रखता है।
- source_word: κρυφῇ
  choice: चुपके से
  rationale: क्रियाविशेषण गुप्त रीति से किए गए कार्य को बताता है; ‘चुपके से’ सामान्य आधुनिक हिन्दी में सहज है।
