base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/004.yaml
  text: For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague on the Egyptians, so that each man would not recognize his brother, even with a lamp.
translation:
  language: hi
  text: क्योंकि मंत्र पढ़ने वाले उनसे कहते थे कि जब यूसुफ की हड्डियाँ बाहर ले जाई जाएँगी, तब सारी भूमि पर अंधकार और घोर अंधकार छा जाएगा और मिस्रियों पर एक बड़ी विपत्ति आएगी, यहाँ तक कि दीपक के प्रकाश में भी हर व्यक्ति अपने भाई को पहचान नहीं पाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαοιδοί
  choice: मंत्र पढ़नेवाले
  rationale: यह शब्द जादुई मंत्र या अभिचार करनेवालों को सूचित करता है; यह चयन सामान्य ‘जादूगर’ की अपेक्षा मूल शब्द के मंत्रोच्चार वाले भाव को अधिक स्पष्ट रखता है।
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσήφ
  choice: जब यूसुफ की हड्डियाँ बाहर ले जाई जाएँगी
  rationale: शाब्दिक ‘यूसुफ की हड्डियों के निकलने पर’ को स्वाभाविक हिन्दी में व्यक्त करते हुए हड्डियों को किसी के द्वारा ले जाए जाने का प्रसंग सुरक्षित रखा गया है।
- source_word: ἐν πάσῃ τῇ γῇ
  choice: सारी भूमि पर
  rationale: γῆ के ‘भूमि/देश’ अर्थ को किसी एक भौगोलिक व्याख्या तक सीमित किए बिना रखा गया है।
- source_word: σκότος καὶ γνόφος
  choice: अन्धकार और घना अँधेरा
  rationale: दो निकटार्थी यूनानी पदों की तीव्रता और पुनरुक्ति को हिन्दी में बनाए रखता है।
- source_word: πληγὴ μεγάλη
  choice: एक भारी विपत्ति
  rationale: πληγή का अर्थ प्रहार, विपत्ति या महामारी हो सकता है; ‘भारी विपत्ति’ इस प्रसंग में व्यापक अर्थ को सुरक्षित रखता है।
- source_word: μετὰ λύχνου
  choice: दीपक होते हुए भी
  rationale: 'परिणाम की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है: प्रकाश उपलब्ध होने पर भी पहचान संभव न होगी।'
