  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/003.yaml
  text: For the Egyptians were keeping Joseph’s bones in the tombs of the kings, so as to bring him up.
translation:
  language: hi
  text: क्योंकि मिस्री यूसुफ़ की हड्डियों को राजाओं की कब्रों में सुरक्षित रखे हुए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: सुरक्षित रखे हुए थे
  rationale: अपूर्ण भूतकाल में जारी रखवाली या संरक्षण का भाव व्यक्त करता है और इस संदर्भ में स्वाभाविक हिन्दी है।
- source_word: τὰ ὀστᾶ τοῦ Ἰωσήφ
  choice: यूसुफ़ की हड्डियों को
  rationale: यूनानी संबंधकारक रचना को सहज हिन्दी स्वामित्व-रचना में व्यक्त किया गया है।
- source_word: οἱ Αἰγύπτιοι
  choice: मिस्री
  rationale: मिस्र के लोगों के लिए प्रचलित और सामान्य आधुनिक हिन्दी पद।
- source_word: ἐν τοῖς μνήμασι τῶν βασιλέων
  choice: राजाओं की कब्रों में
  rationale: बहुवचन और संबंधकारक अर्थ दोनों सुरक्षित हैं; प्राचीन मिस्री दफ़न-स्थलों के लिए 'कब्रें' स्पष्ट और सहज है।
theological_decisions:
- issue: अंग्रेज़ी परामर्श-पाठ में अतिरिक्त उद्देश्य-वाक्यांश
  choice: '''so as to bring him up'' के समान कोई वाक्यांश शामिल नहीं किया गया'
  alternative: अंत में 'ताकि उसे ऊपर ले जाएँ' जोड़ना
  rationale: दिए गए यूनानी स्रोत-पाठ में इस अतिरिक्त उद्देश्य-वाक्यांश का कोई आधार नहीं है; इसलिए मूल-भाषा साक्ष्य को प्राथमिकता दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। 'सुरक्षित रखे हुए थे' यूनानी अपूर्ण भूतकाल की जारी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
