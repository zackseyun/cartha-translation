base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001.yaml
  text: 'A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died. And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up and kissed them[b], and said:'
translation:
  language: hi
  text: 'याकूब और लिआ के दूसरे पुत्र शिमोन की वसीयत


    1 शिमोन के वचनों की एक प्रति[a]—वे वचन जो उसने अपने पुत्रों से अपनी मृत्यु से पहले कहे, जो उसके जीवन के एक सौ बीसवें वर्ष में, उस समय हुई जब उसके भाई यूसुफ की मृत्यु हुई। 2 जब शिमोन बीमार था, तो उसके पुत्र उससे मिलने आए। अपनी शक्ति बटोरकर वह उठकर बैठ गया, उन्हें चूमा[b] और कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिमोन के वचनों का एक अभिलेख’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया स्नेह से या बार-बार चूमने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: एक प्रति
  rationale: यह शब्द लिखित प्रतिलिपि या अभिलेख का बोध करा सकता है। ‘एक प्रति’ दस्तावेज़ी शीर्षक की शैली और मूल अर्थ की व्यापकता को बनाए रखता है।
- source_word: λόγων
  choice: वचनों की
  rationale: ‘वचन’ गरिमापूर्ण किंतु सहज है और इसे किसी सुव्यवस्थित भाषण के रूप में अनावश्यक रूप से सीमित नहीं करता।
- source_word: πρὸ τοῦ ἀποθανεῖν
  choice: अपनी मृत्यु से पहले
  rationale: यूनानी कालवाचक रचना का स्वाभाविक और निकट हिन्दी रूप है।
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει
  choice: अपने जीवन के एक सौ बीसवें वर्ष में
  rationale: यह औपचारिक काल-सूचना को बनाए रखता है और इसे केवल ‘एक सौ बीस वर्ष की आयु में’ कहकर संक्षिप्त नहीं करता।
- source_word: ἐν ᾧ χρόνῳ
  choice: उस समय जब
  rationale: यह शिमोन के अंतिम वचनों की परिस्थिति को यूसुफ की मृत्यु से जोड़ने वाली मूल संयोजक रचना को स्पष्ट रूप से रखता है।
- source_word: Ἀρρωστοῦντος
  choice: जब शिमोन बीमार था
  rationale: यह संबंधवाचक स्वतंत्र रचना को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त करता है।
- source_word: ἐπισκέψασθαι
  choice: उससे मिलने
  rationale: संदर्भ में यह बीमारी के समय चिंता और देखभाल से प्रेरित भेंट का स्वाभाविक हिन्दी रूप है।
- source_word: ἐνισχύσας
  choice: अपनी शक्ति बटोरकर
  rationale: यह बैठने से पहले शिमोन द्वारा किए गए शारीरिक प्रयास को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: ἐκάθισε
  choice: उठकर बैठते हुए
  rationale: बीमारी और शय्या के संदर्भ में क्रिया का आशय केवल बैठना नहीं, बल्कि उठकर बैठना प्रतीत होता है; हिन्दी में यह दृश्य स्वाभाविक ढंग से व्यक्त होता है।
- source_word: κατεφίλησεν
  choice: चूमा
  rationale: मूल की सघन क्रिया स्नेहपूर्ण या बार-बार चूमने का संकेत दे सकती है, पर मुख्य पाठ में ‘चूमा’ सहज है; अतिरिक्त भाव को टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: शिमोन के अंतिम वचनों को यूसुफ की मृत्यु से जोड़ने वाली काल-सूचना
  choice: दोनों काल-सूचनाओं को कथात्मक भूमिका के अंग के रूप में सीधे अनूदित किया गया है।
  alternative: यूसुफ की मृत्यु के उल्लेख को बाद की संपादकीय टिप्पणी मानना या कालक्रम को संक्षिप्त करके भावानुवाद करना।
  rationale: उपलब्ध यूनानी पाठ इस सूचना को भूमिका का अभिन्न भाग बनाकर प्रस्तुत करता है। इसलिए किसी आलोचनात्मक अनुमान के आधार पर इसे हटाया या सामंजस्यपूर्ण ढंग से बदला नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रखी गई है। नामों के लिए प्रचलित बाइबिलीय रूप—याकूब, लिआ, शिमोन और यूसुफ—अपनाए गए हैं। दस्तावेज़ी भूमिका की औपचारिकता बनाए रखते हुए कथात्मक वाक्यों को स्वाभाविक हिन्दी क्रम में रखा गया है।
