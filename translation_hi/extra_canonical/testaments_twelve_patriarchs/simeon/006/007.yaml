  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/007.yaml
  text: Then I also will arise in gladness, and I will bless the Most High for his wonders [because God, having taken a body and eaten with men, saved men].
translation:
  language: hi
  text: तब मैं भी आनन्द में उठ खड़ा होऊँगा और उसके अद्भुत कार्यों के लिए परमप्रधान को धन्य कहूँगा [क्योंकि परमेश्वर ने शरीर धारण करके और मनुष्यों के साथ भोजन करके मनुष्यों को बचाया][a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्ग कोष्ठकों में दिया गया खण्ड प्रस्तुत यूनानी संस्करण में भी कोष्ठकित है। “उठ खड़ा होऊँगा” का अनुवाद “जी उठूँगा” भी हो सकता है।
    reason: कोष्ठकित खण्ड की पाठालोचनात्मक स्थिति तथा ἀναστησόμαι के ‘उठ खड़ा होने’ और ‘जी उठने’ के बीच अर्थ-अस्पष्टता को बनाए रखने के लिए।
lexical_decisions:
- source_word: ἀναστησόμαι
  choice: जी उठूँगा
  rationale: यह भविष्यकालीन रूप उठ खड़े होने या पुनर्जीवित होने—दोनों अर्थ दे सकता है; प्रसंग के परलोकगत स्वर को ध्यान में रखते हुए ‘जी उठूँगा’ चुना गया।
- source_word: ἐν εὐφροσύνῃ
  choice: आनन्द के साथ
  rationale: ग्रीक पद हर्ष या उल्लास की अवस्था बताता है; यह सहज और गरिमापूर्ण हिन्दी है।
- source_word: εὐλογήσω
  choice: धन्य कहूँगा
  rationale: परमप्रधान की स्तुति और प्रशंसा के धार्मिक भाव को निकटता से व्यक्त करता है।
- source_word: τὸν ὕψιστον
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त उपाधि का स्थापित और संक्षिप्त हिन्दी रूप।
- source_word: τοῖς θαυμασίοις αὐτοῦ
  choice: उसके अद्भुत कामों
  rationale: θαυμάσια को केवल अमूर्त ‘आश्चर्यों’ के बजाय परमेश्वर के विस्मयकारी कार्यों के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया।
- source_word: σῶμα λαβών
  choice: शरीर धारण किया
  rationale: शाब्दिक ‘शरीर लिया’ की अपेक्षा यह स्वाभाविक हिन्दी है और देह ग्रहण करने का मूल अर्थ सुरक्षित रखती है।
- source_word: συνεσθίων ἀνθρώποις
  choice: मनुष्यों के साथ भोजन किया
  rationale: सहभोज के अर्थ को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है।
- source_word: ἔσωσεν ἀνθρώπους
  choice: मनुष्यों को बचाया
  rationale: σῴζω के व्यापक उद्धार/बचाव अर्थ को बिना अतिरिक्त सिद्धान्तगत व्याख्या के प्रस्तुत करता है।
theological_decisions:
- issue: ἀναστησόμαι में साधारण उठने और पुनरुत्थान की सम्भावित अस्पष्टता
  choice: जी उठूँगा
  alternative: उठ खड़ा होऊँगा
  rationale: ‘जी उठूँगा’ सम्भावित पुनरुत्थान-संकेत को बनाए रखता है, जबकि पादटिप्पणी वैकल्पिक शाब्दिक अर्थ दर्ज करती है।
- issue: परमेश्वर के शरीर धारण करने वाला खण्ड पाठ में कोष्ठकित है
  choice: मुख्य पाठ में वर्ग कोष्ठकों सहित रखा
  alternative: बिना कोष्ठक के समाहित करना या हटाना
  rationale: प्रदत्त यूनानी संस्करण में यह खण्ड वर्ग कोष्ठकों में है; इसलिए उसकी पाठालोचनात्मक स्थिति को दृश्य रूप से सुरक्षित रखा गया।
- issue: σῶμα λαβών का अवतार-संबंधी कथन
  choice: परमेश्वर ने शरीर धारण किया
  alternative: परमेश्वर ने एक शरीर लिया
  rationale: स्वाभाविक हिन्दी में मूल दावे को बनाए रखा गया, पर किसी विशिष्ट सम्प्रदायगत सूत्र को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठकों के लिए स्पष्ट किन्तु गरिमापूर्ण। ‘परमप्रधान’, ‘धन्य कहूँगा’ और ‘शरीर धारण किया’ धार्मिक स्वर बनाए रखते हैं; वाक्यरचना को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
