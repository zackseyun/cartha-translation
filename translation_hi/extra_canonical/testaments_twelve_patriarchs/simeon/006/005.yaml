  text: Then a great sign will be glorified for Israel.
translation:
  language: hi
  text: तब इस्राएल के लिए एक महान चिह्न महिमान्वित होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: कालक्रम सूचक क्रिया-विशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: σημεῖον
  choice: चिह्न
  rationale: यह यूनानी शब्द किसी संकेत, निशानी या अलौकिक चिह्न को दर्शा सकता है; ‘चिह्न’ इसकी व्यापकता बनाए रखता है।
- source_word: ἐνδοξασθήσεται
  choice: महिमान्वित होगा
  rationale: भविष्यकालीन कर्मवाच्य रूप और ‘महिमा पाने/महिमामय ठहराए जाने’ का भाव सुरक्षित रहता है; कठिन मूल पाठ को सरल बनाकर किसी अन्य अर्थ में नहीं बदला गया।
- source_word: μέγα
  choice: महान
  rationale: विशेषण को ‘चिह्न’ के साथ उसके प्रबल गुणात्मक अर्थ में रखा गया है।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल के लिए
  rationale: सम्प्रदान कारक का संभावित हितार्थक भाव दर्शाता है और मूल की कुछ असामान्य अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: ‘चिह्न’ की पहचान
  choice: चिह्न को किसी व्यक्ति, मसीही घटना या विशिष्ट चमत्कार के रूप में स्पष्ट नहीं किया गया।
  alternative: इसे स्पष्ट रूप से मसीहा अथवा उद्धार की घटना बताना।
  rationale: उपलब्ध यूनानी वाक्य केवल ‘एक महान चिह्न’ कहता है; पहचान जोड़ना स्रोत से आगे जाना होता।
- issue: ἐνδοξασθήσεται का अर्थ
  choice: कर्मवाच्य ‘महिमान्वित होगा’ रखा गया।
  alternative: ‘प्रकट होगा’ या ‘महिमा लाएगा’।
  rationale: वैकल्पिक रूप अधिक सहज हो सकते हैं, पर वे यूनानी क्रिया के महिमा-संबंधी अर्थ अथवा उसके कर्मवाच्य स्वरूप को बदल देते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल यूनानी की असामान्य किंतु अर्थपूर्ण संरचना के निकट अनुवाद। ‘इस्राएल’ सामान्य बाइबलीय वर्तनी के अनुसार रखा गया है।
