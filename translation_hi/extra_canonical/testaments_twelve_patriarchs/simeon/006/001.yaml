  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/001.yaml
  text: Behold, I have told you everything, so that I may be justified from your sin.
translation:
  language: hi
  text: देखो, मैंने तुम्हें सब कुछ बता दिया है, ताकि मैं तुम्हारे पाप से निर्दोष ठहरूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले यूनानी उद्गार का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: εἴρηκα
  choice: मैंने ... बता दिया है
  rationale: पूर्णकालीन क्रिया के वर्तमान परिणाम को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: सर्वसमावेशी अर्थ को सीधे बनाए रखता है।
- source_word: δικαιωθῶ
  choice: निर्दोष ठहरूँ
  rationale: न्यायिक रूप से सही या दोषमुक्त ठहराए जाने का अर्थ देता है; यहाँ केवल सामान्य ‘धर्मी ठहरूँ’ की अपेक्षा पाप-संबंधी प्रसंग में अधिक स्पष्ट है।
- source_word: ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: तुम्हारे पाप से
  rationale: ἀπό की स्रोत/अलगाव-संबंधी अस्पष्टता को यथासंभव सीधे सुरक्षित रखता है और इसे ‘तुम्हारे पाप के दोष से’ कहकर अनावश्यक रूप से नहीं खोलता।
theological_decisions:
- issue: δικαιωθῶ का न्यायिक अथवा नैतिक अर्थ
  choice: निर्दोष ठहरूँ
  alternative: धर्मी ठहरूँ / न्यायोचित ठहरूँ
  rationale: मूल निष्क्रिय क्रिया में किसी निर्णय द्वारा सही या दोषरहित ठहरने का भाव है। ‘निर्दोष ठहरूँ’ प्रसंग में सुबोध है, पर किसी विशिष्ट सिद्धान्तगत अर्थ को आरोपित नहीं करता।
- issue: ‘तुम्हारे पाप से’ संबंध का अर्थ
  choice: संबंध को अस्पष्ट ही रखा गया
  alternative: तुम्हारे पाप के दोष से मुक्त ठहरूँ
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि आशय दोष, सहभागिता, उत्तरदायित्व या अलगाव में से ठीक किससे है; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम्हें/तुम्हारे’ मूल ὑμῖν/ὑμῶν के अनुरूप है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है।
