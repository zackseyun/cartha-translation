source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε ἀπολεῖται²⁰ τὸ²¹ σπέρμα Χαναάν *καὶ ἐγκατάλειμμα²² οὐκ ἔσται ἐν²³ τῷ ᾿Αμαλήκ, Γκαὶ ἀπολοῦνται πάντες οἱ Καππαδόκαι²⁴ *καὶ πάντες οἱ Χετταῖοι ἐξολοθρευθήσονται²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/003.yaml
  text: Then the seed of Canaan will perish, and no remnant will remain in Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed.
translation:
  language: hi
  text: तब कनान का वंश नष्ट हो जाएगा, और अमालेक में कोई बचा हुआ न रहेगा; सभी कप्पदोकियाई नष्ट हो जाएँगे, और सभी हित्ती पूरी तरह मिटा दिए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα Χαναάν
  choice: कनान का वंश
  rationale: σπέρμα का शाब्दिक अर्थ ‘बीज’ है, पर किसी जनसमूह के संदर्भ में आधुनिक हिन्दी में ‘वंश’ अधिक स्वाभाविक है और वंशजों की सामूहिक धारणा बनाए रखता है।
- source_word: ἐγκατάλειμμα
  choice: कोई बचा हुआ
  rationale: यह शब्द बचे हुए व्यक्ति या अवशेष को सूचित करता है; ‘कोई बचा हुआ न रहेगा’ हिन्दी में स्वाभाविक ढंग से पूर्ण विनाश व्यक्त करता है।
- source_word: ἐν τῷ Ἀμαλήκ
  choice: अमालेक में
  rationale: ἐν के स्थानवाचक अर्थ को सीधे रखा गया है; इसे ‘अमालेक के लिए’ या ‘अमालेक का’ बनाकर संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: Καππαδόκαι
  choice: कप्पदोकियाई
  rationale: जाति/प्रदेशवासी-सूचक यूनानी बहुवचन को आधुनिक हिन्दी के स्वाभाविक जननाम से व्यक्त किया गया है।
- source_word: ἐξολοθρευθήσονται
  choice: पूरी तरह मिटा दिए जाएँगे
  rationale: क्रिया के भविष्यकालीन कर्मवाच्य और संपूर्ण उन्मूलन के प्रबल भाव दोनों को सुरक्षित रखा गया है।
theological_decisions:
- issue: विनाश-संबंधी भविष्यवाणी की तीव्रता
  choice: नष्ट हो जाएगा / पूरी तरह मिटा दिए जाएँगे
  alternative: लुप्त हो जाएगा / समाप्त कर दिए जाएँगे
  rationale: मूल में ἀπόλλυμι और अधिक प्रबल ἐξολοθρεύω के बीच तीव्रता का अंतर है; हिन्दी अनुवाद में दूसरे कथन को ‘पूरी तरह’ द्वारा अधिक प्रबल रखा गया है, बिना किसी धर्मवैज्ञानिक व्याख्या को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। मूल के भविष्यकाल, जातीय नामों और क्रमिक रूप से तीव्र होते विनाश-वर्णन को बनाए रखा गया है।
