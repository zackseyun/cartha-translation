id: T12P.SIM.6.2
reference: Testament of Simeon 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν δὲ⁴ ἀφέλητε⁵ ἀφ᾽ ὑμῶν τὸν φθόνον καὶ πᾶσαν σκληροκαρδίαν⁶, Ὡς⁷ ῥόδον ἀνθήσει⁸ τὰ ὀστᾶ μου⁹ ἐν Ἰσραήλ, καὶ¹⁰ ὡς κρίνον *ἡ σάρξ μου¹⁰ ἐν Ἰακώβ, καὶ ἔσται¹¹ *ἡ ὀσμή μου ὡς¹² ὀσμὴ Λιβάνου,¹³ καὶ πληθυνθήσονται¹⁴ ἅγιοι¹⁵ *ἐξ ἐμοῦ¹⁶ *ἕως αἰῶνας¹⁷ αἰώνων¹⁷ καὶ *οἱ κλάδοι¹⁸ αὐτῶν¹⁹ εἰς μακρὰν ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/002.yaml
  text: But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.
translation:
  language: hi
  text: लेकिन यदि तुम अपने भीतर से ईर्ष्या और मन की हर कठोरता दूर कर दो, तो मेरी हड्डियाँ इस्राएल में गुलाब की तरह खिलेंगी, और मेरा मांस याकूब में सोसन के फूल की तरह; मेरी सुगंध लबानोन की सुगंध जैसी होगी। मुझसे पवित्र जन युगानुयुग बढ़ते जाएँगे, और उनकी शाखाएँ दूर-दूर तक फैलेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: ईर्ष्या
  rationale: यह यूनानी संज्ञा डाह या ईर्ष्या को व्यक्त करती है; आधुनिक हिन्दी में ‘ईर्ष्या’ स्पष्ट और स्वाभाविक है।
- source_word: πᾶσαν σκληροκαρδίαν
  choice: हर प्रकार की कठोरता
  rationale: शाब्दिक अर्थ ‘हृदय की हर कठोरता’ है। ‘अपने भीतर से’ के साथ ‘हर प्रकार की कठोरता’ स्वाभाविक हिन्दी में आंतरिक हठ और संवेदनहीनता का भाव रखता है।
- source_word: ῥόδον
  choice: गुलाब
  rationale: यह सामान्यतः गुलाब के लिए प्रयुक्त शब्द है और पुष्पित होने की उपमा को सहज रखता है।
- source_word: κρίνον
  choice: सोसन का फूल
  rationale: κρίνον प्रायः lily को दर्शाता है; ‘सोसन का फूल’ बाइबलीय साहित्य में परिचित है और केवल ‘कुमुदिनी’ कहने से उत्पन्न जलीय पौधे की संभावित गलत छवि से बचाता है।
- source_word: ὀσμὴ Λιβάνου
  choice: लबानोन की सुगंध
  rationale: स्थान-नाम और सुगंध की पुनरावृत्ति को मूल के अनुरूप रखा गया है; इससे उपमा की काव्यात्मकता बनी रहती है।
- source_word: ἅγιοι
  choice: पवित्र जन
  rationale: विशेषण के संज्ञात्मक बहुवचन को किसी विशिष्ट पद या सम्प्रदाय से जोड़े बिना व्यक्त करता है।
- source_word: ἕως αἰῶνας αἰώνων
  choice: युगानुयुग
  rationale: दीर्घ, निरंतर काल के यूनानी मुहावरे का गरिमापूर्ण और प्रचलित हिन्दी रूप।
- source_word: οἱ κλάδοι αὐτῶν εἰς μακρὰν ἔσονται
  choice: उनकी शाखाएँ दूर-दूर तक फैलेंगी
  rationale: शाब्दिक संरचना ‘दूर तक होंगी’ है; हिन्दी में ‘फैलेंगी’ शाखाओं के विस्तार का निहित भाव स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘मुझसे’ उत्पन्न या बढ़ने वाले पवित्र जनों की पहचान
  choice: पहचान को अनिर्दिष्ट रखते हुए ‘मुझसे पवित्र जन ... बहुत होते जाएँगे’
  alternative: इसे शिमोन के वंशजों, संतों या किसी विशिष्ट धार्मिक समुदाय के रूप में स्पष्ट करना
  rationale: मूल पाठ केवल ἐξ ἐμοῦ कहता है और इन पवित्र जनों की सटीक पहचान नहीं बताता; अनुवाद उस अस्पष्टता को सुरक्षित रखता है।
- issue: हड्डियों, मांस, सुगंध और शाखाओं का अर्थ
  choice: रूपकों को बिना व्याख्यात्मक विस्तार के यथावत रखना
  alternative: इन्हें पुनरुत्थान, वंश-वृद्धि या स्मृति की स्पष्ट भविष्यवाणी बनाना
  rationale: मूल काव्यात्मक चित्र अनेक अर्थों की गुंजाइश रखता है; किसी एक धर्मवैज्ञानिक अर्थ को आरोपित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। वाक्य की भविष्यसूचक और काव्यात्मक लय बनाए रखते हुए मूल की समानांतर उपमाएँ सुरक्षित रखी गई हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
