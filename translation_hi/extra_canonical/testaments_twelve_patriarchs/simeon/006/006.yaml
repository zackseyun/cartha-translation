  source_fidelity: The future passive sense of δοθήσεται and the scope of πάντα τὰ πνεύματα are retained. However, καταπάτησις specifically denotes trampling/treading underfoot; ‘कुचले जाने’ can more broadly suggest crushing and loses that image.
