base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/006.yaml
  text: Then all the spirits of deceit will be given over to trampling, and men will rule over the evil spirits.
translation:
  language: hi
  text: तब छल की सारी आत्माएँ रौंदे जाने के लिए सौंप दी जाएँगी, और मनुष्य दुष्ट आत्माओं पर शासन करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: छल की सारी आत्माएँ
  rationale: πλάνη यहाँ भटकाव, धोखे या छल का भाव रखता है। ‘छल’ प्रसंगानुकूल और सहज है, जबकि संबंधवाचक संरचना मूल यूनानी की अस्पष्टता बनाए रखती है।
- source_word: εἰς καταπάτησιν
  choice: कुचले जाने के लिए
  rationale: यह पद कुचले या पैरों तले रौंदे जाने की दशा को व्यक्त करता है। कर्मवाच्य रूप हिंदी में δοθήσεται के साथ स्वाभाविक है और आशय स्पष्ट करता है।
- source_word: βασιλεύσουσιν
  choice: शासन करेंगे
  rationale: βασιλεύω का मूल भाव राजा की तरह राज्य या शासन करना है; ‘शासन करेंगे’ आधुनिक हिंदी में स्वाभाविक रहते हुए इस अधिकारपूर्ण भाव को सुरक्षित रखता है।
- source_word: τῶν πονηρῶν πνευμάτων
  choice: दुष्ट आत्माओं पर
  rationale: संबंधकारक यहाँ शासन के विषय या क्षेत्र को दर्शाता है, इसलिए हिंदी में ‘पर’ उपयुक्त है। πονηρός का नैतिक अर्थ ‘दुष्ट’ से ठीक व्यक्त होता है।
theological_decisions:
- issue: मनुष्यों द्वारा दुष्ट आत्माओं पर शासन
  choice: और मनुष्य दुष्ट आत्माओं पर शासन करेंगे
  alternative: और लोग दुष्ट आत्माओं पर अधिकार रखेंगे
  rationale: मूल पाठ के οἱ ἄνθρωποι और βασιλεύσουσιν को सीधे रखा गया है; यह नहीं बताया गया कि ये कौन-से मनुष्य हैं या शासन का स्वरूप क्या होगा, ताकि पाठ की अपनी व्यापकता और तनाव सुरक्षित रहें।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य गरिमापूर्ण, स्पष्ट और मूल की भविष्यकालीन भविष्यवाणी-संबंधी शैली के अनुरूप है। ‘मनुष्य’ को सामूहिक अर्थ में रखा गया है।
