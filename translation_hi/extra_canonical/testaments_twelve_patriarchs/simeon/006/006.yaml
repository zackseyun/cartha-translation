  terminology: ‘छल की सारी आत्माएँ,’ ‘मनुष्य,’ ‘दुष्ट आत्माएँ,’ and ‘शासन करेंगे’ suitably render the Greek without adding theological interpretation. The revision only sharpens the concrete force of καταπάτησις.
