  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/004.yaml
  text: Then the land of Ham will perish, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.
translation:
  language: hi
  text: तब हाम की भूमि नष्ट हो जाएगी, और हर जनसमुदाय नष्ट हो जाएगा। तब सारी पृथ्वी उपद्रव से शांत हो जाएगी, और आकाश के नीचे की सारी पृथ्वी युद्ध से शांत हो जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείψει
  choice: नष्ट हो जाएगा
  rationale: क्रिया का मूल भाव समाप्त हो जाने या लुप्त हो जाने का है; न्याय और विनाश के इस संदर्भ में यह स्वाभाविक और सटीक है।
- source_word: ἡ γῆ Χάμ
  choice: हाम का देश
  rationale: γῆ यहाँ किसी भूभाग या देश को सूचित करता है; 'हाम की भूमि' की अपेक्षा 'हाम का देश' आधुनिक हिन्दी में अधिक सहज है।
- source_word: πᾶς ὁ λαὸς
  choice: उसकी सारी प्रजा
  rationale: λαός का अर्थ यहाँ देश से संबद्ध जनसमुदाय है। 'उसकी' संदर्भगत संबंध स्पष्ट करता है, यद्यपि यूनानी में संबंधसूचक सर्वनाम व्यक्त नहीं है।
- source_word: ἀπολεῖται
  choice: मिट जाएगी
  rationale: यह नाश हो जाने का प्रबल भाव रखता है; पहले खंड की पुनरुक्ति को अत्यधिक कठोर बनाए बिना अर्थ सुरक्षित रहता है।
- source_word: καταπαύσει ... ἀπὸ ταραχῆς
  choice: उपद्रव से शांत हो जाएगी
  rationale: καταπαύω का भाव रुकने और विश्राम पाने दोनों का है; हिन्दी में यह विन्यास अशांति के अंत को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πᾶσα ἡ ὑπ᾿ οὐρανῶν
  choice: आकाश के नीचे का सारा संसार
  rationale: पाठ में संज्ञा अध्याहृत है। यह वाक्यांश समस्त अधोलौकिक जगत/मानव संसार को दर्शाता है; हिन्दी में स्पष्टता के लिए 'संसार' जोड़ा गया है।
theological_decisions:
- issue: πᾶς ὁ λαὸς का दायरा
  choice: हाम के देश की सारी प्रजा
  alternative: हर जाति / हर जनसमुदाय
  rationale: निकटवर्ती एकवचन 'हाम का देश' के साथ निश्चित एकवचन λαός को संबद्ध प्रजा समझना व्याकरण और संदर्भ के अनुकूल है; इसे सार्वभौमिक 'हर जाति' बनाने से कथन का दायरा अनावश्यक रूप से बढ़ सकता है।
- issue: πᾶσα ἡ ὑπ᾿ οὐρανῶν में अध्याहृत संज्ञा
  choice: सारा संसार
  alternative: सारी पृथ्वी / वे सभी जो आकाश के नीचे हैं
  rationale: स्त्रीलिंग रूप संभवतः γῆ की पुनरुक्ति को अध्याहृत मानता है, पर शब्दशः हिन्दी अस्वाभाविक होगी। 'सारा संसार' व्यापकता बनाए रखता है और किसी विशिष्ट प्राणी-समूह तक अर्थ सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यवाणीपरक शैली रखी गई है। समानांतर वाक्य-संरचना और 'उपद्रव...युद्ध' का संतुलन सुरक्षित है।
