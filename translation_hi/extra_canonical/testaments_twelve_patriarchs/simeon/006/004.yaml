- from: तब हाम का देश नष्ट हो जाएगा, और उसकी सारी प्रजा मिट जाएगी। तब सारी पृथ्वी उपद्रव से शांत हो जाएगी, और आकाश के नीचे का सारा संसार युद्ध से।
  to: तब हाम की भूमि नष्ट हो जाएगी, और हर जनसमुदाय नष्ट हो जाएगा। तब सारी पृथ्वी उपद्रव से शांत हो जाएगी, और आकाश के नीचे की सारी पृथ्वी युद्ध से शांत हो जाएगी।
