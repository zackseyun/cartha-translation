source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἑώρακα γὰρ ἐγὼ²⁵ ἐν χαρακτῆρι γραφῆς²⁶ Ἐνώχ, ὅτι οἱ²⁷ υἱοὶ ὑμῶν²⁸ *ἐν πορνείᾳ²⁹ φθαρήσονται, καὶ *τοῖς υἱοῖς Λευὶ³⁰ *ἀδικήσουσιν ἐν ῥομφαίᾳ³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/004.yaml
  text: For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.
translation:
  language: hi
  text: क्योंकि मैंने हनोक के लेख में देखा है कि तुम्हारे पुत्र यौन अनैतिकता में भ्रष्ट हो जाएँगे और लेवी के पुत्रों के साथ तलवार से अन्याय करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: हनोक के लेख में
  rationale: वाक्यांश हनोक से संबद्ध लिखित अभिलेख या रचना की ओर संकेत करता है; सहज हिन्दी में संक्षेप रखते हुए अर्थ सुरक्षित है।
- source_word: ἐν πορνείᾳ φθαρήσονται
  choice: व्यभिचार में भ्रष्ट हो जाएँगे
  rationale: ἐν का क्षेत्रगत अर्थ ‘में’ रखा गया है, जबकि πορνεία के यौन अनैतिकता-संबंधी आशय को गरिमापूर्ण और परिचित ‘व्यभिचार’ से व्यक्त किया गया है।
- source_word: τοῖς υἱοῖς Λευὶ ἀδικήσουσιν
  choice: लेवी के पुत्रों के साथ अन्याय करेंगे
  rationale: ἀδικέω का व्यापक अर्थ ‘अन्याय करना/हानि पहुँचाना’ है; ‘अन्याय करेंगे’ स्रोत की अस्पष्टता को बिना अनावश्यक विशिष्टता के बनाए रखता है।
- source_word: ἐν ῥομφαίᾳ
  choice: तलवार से
  rationale: यहाँ ἐν साधनसूचक है; ῥομφαία को सामान्य पाठक के लिए स्वाभाविक रूप से ‘तलवार’ कहा गया है।
theological_decisions:
- issue: हनोक के लेख की प्रकृति या प्रामाणिक स्थिति
  choice: केवल ‘हनोक के लेख’ कहा गया
  alternative: ‘हनोक की पुस्तक’ या ‘हनोक का पवित्रशास्त्र’
  rationale: γραφή यहाँ लेखन/लेख को सूचित कर सकता है; पाठ स्वयं उसकी ग्रंथ-सूचीगत या धार्मिक स्थिति निश्चित नहीं करता।
- issue: लेवी के पुत्रों के विरुद्ध तलवार वाले अन्याय का स्वरूप
  choice: ‘तलवार से अन्याय करेंगे’
  alternative: ‘तलवार से मार डालेंगे’
  rationale: ἀδικέω हत्या को अनिवार्यतः निर्दिष्ट नहीं करता; इसलिए हिंसक अन्याय की व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, स्पष्ट और कथात्मक शैली। ‘तुम्हारे पुत्र’ का बहुवचन संबोधन तथा भविष्यवाणी का भाव ज्यों का त्यों रखा गया है।
