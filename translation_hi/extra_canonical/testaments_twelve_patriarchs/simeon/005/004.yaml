review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the prophetic assertion, the reference to Enoch’s writing, the future passive sense of φθαρήσονται, and the broad sense of ἀδικήσουσιν rather than specifying killing. However, ‘व्यभिचार’ commonly denotes adultery in modern Hindi and is narrower than πορνεία, which here denotes sexual immorality more broadly.
  naturalness: The sentence is generally clear and suitably serious. ‘यौन अनैतिकता’ is more precise and natural for the broad sexual sense of the Greek. The remaining phrasing, including ‘लेवी के पुत्रों के साथ तलवार से अन्याय करेंगे,’ retains the source’s deliberately non-specific description of sword-related wrongdoing.
  terminology: ‘हनोक के लेख’ appropriately avoids asserting that the referred writing is a canonical book. ‘भ्रष्ट हो जाएँगे’ suitably renders the corrupting/destructive passive. ‘यौन अनैतिकता’ is preferable to the narrower ‘व्यभिचार.’
  issues:
  - severity: medium
    issue: ‘व्यभिचार’ is too narrow for πορνεία.
    rationale: In modern Hindi, ‘व्यभिचार’ predominantly refers to adultery, whereas πορνεία can encompass sexual immorality generally. The wider term should be retained without importing a more specific offence.
  revised_text: क्योंकि मैंने हनोक के लेख में देखा है कि तुम्हारे पुत्र यौन अनैतिकता में भ्रष्ट हो जाएँगे और लेवी के पुत्रों के साथ तलवार से अन्याय करेंगे।
