revisions:
- from: क्योंकि मैंने हनोक के लेख में देखा है कि तुम्हारे पुत्र व्यभिचार में भ्रष्ट हो जाएँगे और लेवी के पुत्रों के साथ तलवार से अन्याय करेंगे।
  to: क्योंकि मैंने हनोक के लेख में देखा है कि तुम्हारे पुत्र यौन अनैतिकता में भ्रष्ट हो जाएँगे और लेवी के पुत्रों के साथ तलवार से अन्याय करेंगे।
  rationale: Only the rendering of πορνεία has been broadened from ‘व्यभिचार’ to ‘यौन अनैतिकता’ to match the Greek semantic range. No footnote is required, and the source’s ambiguity concerning the exact sword-related wrong remains intact.
