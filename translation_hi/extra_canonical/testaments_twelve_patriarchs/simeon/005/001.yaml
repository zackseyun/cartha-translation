base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/001.yaml
  text: Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.
translation:
  language: hi
  text: इसी कारण यूसुफ रूप में सुंदर और देखने में मनोहर था, क्योंकि उसमें कोई बुराई वास नहीं करती थी; क्योंकि चेहरा आत्मा की अशांति प्रकट करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει
  choice: रूप-रंग में सुंदर
  rationale: यह अभिव्यक्ति यूसुफ के शारीरिक रूप और गठन की सुंदरता बताती है; आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को बनाए रखती है।
- source_word: καλὸς τῇ ὄψει
  choice: देखने में मनोहर
  rationale: पहले पदबंध की अनावश्यक पुनरावृत्ति किए बिना बाहरी दृश्य प्रभाव को व्यक्त करता है।
- source_word: ἐνοίκησεν
  choice: वास नहीं करती थी
  rationale: क्रिया का मूल भाव किसी के भीतर निवास करने का है; इसलिए केवल ‘थी’ के बजाय ‘वास करना’ रखा गया है।
- source_word: ταραχῆς τοῦ πνεύματος
  choice: आत्मा की अशांति
  rationale: ταραχή के आंदोलन, व्याकुलता या आंतरिक विक्षोभ के अर्थ को ‘अशांति’ व्यक्त करती है; πνεῦμα को यहाँ मनुष्य की भीतरी आत्मा के रूप में अनूदित किया गया है।
- source_word: τὸ πρόσωπον δηλοῖ
  choice: चेहरे से प्रकट हो जाती है
  rationale: यूनानी वाक्य में चेहरा आंतरिक अशांति को प्रकट करने वाला है; हिन्दी में यह भाव इस अकर्मक रचना से अधिक स्वाभाविक ढंग से आता है।
theological_decisions:
- issue: πνεῦμα का आशय
  choice: आत्मा
  alternative: मन
  rationale: मूल शब्द πνεῦμα है और प्रसंग व्यक्ति के भीतर वास करने वाली बुराई तथा उसके बाहरी प्रकटीकरण को जोड़ता है। ‘आत्मा’ मूल की व्यापकता और धार्मिक-नैतिक तनाव को सुरक्षित रखता है; ‘मन’ अर्थ को केवल मानसिक अवस्था तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘रूप-रंग में सुंदर’ और ‘देखने में मनोहर’ मूल के निकटवर्ती किंतु अलग पदबंधों का भेद बनाए रखते हैं। कोई पाठालोचनात्मक या व्याख्यात्मक पाद-टिप्पणी आवश्यक नहीं है।
