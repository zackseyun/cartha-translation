review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the three imperatives/future sequence, the moral sense of ἀγαθύνατε (‘make good’), the δρόμοι/ὁδοί metaphor, and the parallel reference to the Lord and human beings. The final expression, however, is an idiom in which finding χάρις ‘before’ someone means receiving favor in that person's sight; a word-for-word rendering with ‘के सामने कृपा पाओगे’ is less clear in Hindi.
  naturalness: The register is appropriately dignified and modern. ‘प्रभु और मनुष्यों के सामने कृपा पाओगे’ is awkward Hindi, because people ordinarily receive ‘कृपा’ from someone rather than ‘in front of’ them. ‘की दृष्टि में अनुग्रह पाओगे’ communicates the source idiom naturally while retaining its twofold parallelism.
  terminology: ‘प्रभु,’ ‘हृदय,’ and ‘मार्ग’ are suitable and consistent with the source’s register. ‘अनुग्रह’ in the final clause is a broad term for favor and can apply to both God and people here; it does not impose a doctrinal distinction absent from the Greek.
  issues:
  - severity: low
    issue: The final prepositional expression is overly literal and unnatural in Hindi.
    rationale: ἐνώπιον Κυρίου καὶ ἀνθρώπων modifies the idiom ‘find favor.’ In Hindi, ‘प्रभु और मनुष्यों की दृष्टि में अनुग्रह पाओगे’ expresses being favorably regarded by both without implying a spatial setting.
  revised_text: और अब, मेरे बच्चो, प्रभु के सामने अपने हृदयों को भला बनाओ, और मनुष्यों के सामने अपने मार्ग सीधे करो; और तुम प्रभु और मनुष्यों की दृष्टि में अनुग्रह पाओगे।
  revised_footnotes: []
  revision_rationale: Only the final idiom has been adjusted for natural modern Hindi. The source’s repeated ‘before’ relationship and its single, shared concept of χάρις/favor remain intact; ‘और’ is retained rather than introducing an explicit causal inference.
