  to: और अब, मेरे बच्चो, प्रभु के सामने अपने हृदयों को भला बनाओ, और मनुष्यों के सामने अपने मार्ग सीधे करो; और तुम प्रभु और मनुष्यों की दृष्टि में अनुग्रह पाओगे।
