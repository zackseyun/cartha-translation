reference: Testament of Simeon 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα μου⁹, Ἀγαθύνατε τὰς καρδίας ὑμῶν¹⁰ ἐνώπιον Κυρίου¹¹, καὶ¹² εὐθύνατε τὰς ὁδοὺς ὑμῶν ἐνώπιον τῶν¹³ ἀνθρώπων¹⁴ καὶ ἔσεσθε εὑρίσκοντες χάριν *ἐνώπιον Κυρίου καὶ ἀνθρώπων¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/002.yaml
  text: And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will find favor before the Lord and men.
translation:
  language: hi
  text: और अब, मेरे बच्चो, प्रभु के सामने अपने हृदयों को भला बनाओ, और मनुष्यों के सामने अपने मार्ग सीधे करो; और तुम प्रभु और मनुष्यों की दृष्टि में अनुग्रह पाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन की आत्मीयता और बहुवचन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: अपने हृदयों को भला बनाओ
  rationale: क्रिया ἀγαθύνω के ‘भला/अच्छा बनाना’ भाव को औपचारिक निकटता से रखता है और नैतिक आह्वान को अस्पष्ट किए बिना संरक्षित करता है।
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: अपने मार्ग सीधे करो
  rationale: ‘मार्ग’ के रूपक और εὐθύνω के सीधे करने के अर्थ दोनों को बनाए रखता है।
- source_word: χάριν
  choice: कृपा
  rationale: यहाँ ‘अनुग्रह/स्वीकृति’ के व्यापक अर्थ वाला पारंपरिक और सुबोध शब्द है; परमेश्वर और मनुष्यों दोनों के संदर्भ में उपयुक्त है।
- source_word: ἐνώπιον Κυρίου καὶ ἀνθρώπων
  choice: प्रभु और मनुष्यों के सामने
  rationale: एक ही पूर्वसर्गीय वाक्यांश का समानांतर संबंध सुरक्षित रखता है।
theological_decisions:
- issue: हृदय को भला बनाने की आज्ञा में मानवीय नैतिक उत्तरदायित्व
  choice: प्रत्यक्ष आज्ञार्थक रूप ‘भला बनाओ’ रखा गया
  alternative: ‘अपने मन शुद्ध रखो’ या ईश्वरीय परिवर्तन का भाव जोड़ना
  rationale: यूनानी पाठ स्वयं प्रत्यक्ष आज्ञा देता है; उसमें शुद्धता या किसी विशिष्ट कृपा-सिद्धांत को जोड़ना मूल की सीमा से बाहर होता।
- issue: χάρις का प्रभु और मनुष्यों दोनों से संबंध
  choice: दोनों के लिए समान रूप से ‘कृपा पाओगे’
  alternative: प्रभु से ‘अनुग्रह’ और मनुष्यों से ‘सम्मान’ पाओगे
  rationale: मूल में एक ही संज्ञा दोनों पर लागू है; अलग-अलग अर्थ देकर समानांतरता को हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा और सामान्य पाठक के लिए सुबोध रूप। ‘हृदय’, ‘मार्ग’ और ‘कृपा’ मूल के नैतिक तथा रूपकात्मक स्वर को बनाए रखते हैं।
