source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔσονται ὀλιγοστοί³⁶ ἐπιμεριζόμενοι³⁷ *ἐν τῷ³⁸ Λευὶ καὶ *ἐν τῷ³⁹ Ἰούδᾳ⁴⁰ καὶ οὐκ⁴¹ ἔσται ἐξ ὑμῶν *τις εἰς ἡγεμονίαν⁴² καθὼς καὶ ὁ πατὴρ ἡμῶν⁴³ προεφήτευσεν⁴⁴ *ἐν ταῖς⁴⁵ εὐλογίαις⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/006.yaml
  text: And they will be few in number, being divided among Levi and among Judah, and none from among you will be for leadership, just as our father also prophesied in the blessings.
translation:
  language: hi
  text: और वे गिनती में थोड़े होंगे और लेवी तथा यहूदा में बाँटे हुए होंगे। तुम में से कोई भी नेतृत्व में न होगा, ठीक जैसा हमारे पिता ने भी आशीषों में भविष्यवाणी की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοστοί
  choice: गिनती में थोड़े
  rationale: यह शब्द संख्या में कम होने का भाव देता है; यह प्रयोग आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐπιμεριζόμενοι
  choice: बाँट दिए जाएँगे
  rationale: मध्यम/कर्मवाच्य कृदन्त का वितरण या विभिन्न समूहों में बाँटे जाने का भाव सुरक्षित रखा गया है।
- source_word: ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ
  choice: लेवी तथा यहूदा के बीच
  rationale: यहाँ लेवी और यहूदा को उनके वंशीय समूहों के अर्थ में समझते हुए यूनानी ἐν का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: εἰς ἡγεμονίαν
  choice: अगुआई करनेवाला
  rationale: शाब्दिक अर्थ ‘नेतृत्व/शासन के लिए’ है; व्यक्तिगत पद या भूमिका के संदर्भ में यह हिन्दी रूप सहज है और राजकीय शासन तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐν ταῖς εὐλογίαις
  choice: आशीषों में
  rationale: बहुवचन और निश्चित संदर्भ को बनाए रखा गया है; यह पूर्वज द्वारा दी गई भविष्यसूचक आशीषों की ओर संकेत करता है।
theological_decisions:
- issue: ἡγεμονίαν का दायरा
  choice: अगुआई
  alternative: शासन
  rationale: यूनानी शब्द नेतृत्व, अधिकार या शासन को सूचित कर सकता है। ‘अगुआई’ व्यापकता बनाए रखता है और कथन को केवल राजसत्ता के विषय में मान लेने से बचाता है।
- issue: ‘हमारे पिता’ की पहचान
  choice: पाठ में केवल ‘हमारे पिता’ रखा गया
  alternative: ‘हमारे पिता याकूब’
  rationale: मूल पाठ नाम नहीं देता; संदर्भ से पहचान संभव होने पर भी अनुवाद में नाम जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य-विन्यास को हिन्दी की स्वाभाविकता के लिए दो वाक्यों में बाँटा गया है, जबकि मूल के कारणात्मक और भविष्यसूचक संबंध सुरक्षित हैं।
