source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλ' οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι³², ὅτι *πόλεμον Κυρίου πολεμήσει³³ καὶ νικήσει ⌜πᾶσαν⌝³⁴ παρεμβολὴν³⁵ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/005.yaml
  text: But they will not be able to stand against Levi, because he will wage the Lord’s war and will defeat your whole camp.
translation:
  language: hi
  text: पर वे लेवी का सामना नहीं कर सकेंगे, क्योंकि वह प्रभु का युद्ध लड़ेगा और तुम्हारी पूरी छावनी को हरा देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστῆναι
  choice: सामना करना
  rationale: यह क्रिया विरोध में टिकने या प्रतिरोध करने का भाव रखती है; यहाँ स्वाभाविक हिन्दी में ‘सामना करना’ उस अर्थ को स्पष्ट रखता है।
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: प्रभु का युद्ध लड़ेगा
  rationale: यूनानी में संज्ञा और उसी मूल की क्रिया का बलपूर्ण प्रयोग है। हिन्दी का प्रचलित वाक्यांश ‘युद्ध लड़ना’ अर्थ और जोर दोनों को सहज रूप से व्यक्त करता है।
- source_word: νικήσει
  choice: हरा देगा
  rationale: भविष्यकालीन विजय को साधारण, स्पष्ट और निर्णायक हिन्दी में व्यक्त करता है।
- source_word: πᾶσαν παρεμβολὴν ὑμῶν
  choice: तुम्हारी पूरी छावनी
  rationale: παρεμβολή का मूल अर्थ सैन्य छावनी या पड़ाव है; ‘पूरी’ πᾶσαν को दर्शाता है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
theological_decisions:
- issue: ‘प्रभु का युद्ध’ का संबंध
  choice: वह युद्ध जो प्रभु का है
  alternative: प्रभु की ओर से युद्ध / प्रभु के लिए युद्ध
  rationale: यूनानी संबंधकारक Κυρίου उद्देश्य, स्वामित्व या पक्ष को खुला छोड़ता है। शाब्दिक ‘प्रभु का युद्ध’ इस वास्तविक अस्पष्टता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सैन्य संदर्भ के अनुरूप है। ‘पर’ विरोध को स्वाभाविक ढंग से जोड़ता है, जबकि ‘लेवी’ प्रचलित हिन्दी नामरूप है।
