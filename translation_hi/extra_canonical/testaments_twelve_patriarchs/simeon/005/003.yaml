  text: Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.
translation:
  language: hi
  text: इसलिए अपने आप को यौन अनैतिकता से बचाए रखो, क्योंकि यौन अनैतिकता बुराइयों की जननी है; वह परमेश्वर से अलग करती और बेलियार के निकट ले जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: अपने आप को बचाए रखो
  rationale: मध्यम आज्ञार्थक क्रिया में आत्म-सुरक्षा और लगातार सावधान रहने का भाव है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πορνεία
  choice: व्यभिचार
  rationale: यहाँ व्यापक यौन अनैतिकता का बोध है। ‘व्यभिचार’ गरिमापूर्ण और सामान्य धार्मिक हिन्दी में परिचित है, यद्यपि संदर्भ के अनुसार इसका अर्थ केवल परस्त्रीगमन तक सीमित नहीं है।
- source_word: μήτηρ τῶν κακῶν
  choice: बुराइयों की जननी
  rationale: मूल रूपक को सीधे और स्वाभाविक ढंग से सुरक्षित रखा गया है।
- source_word: χωρίζουσα ἀπὸ τοῦ θεοῦ
  choice: मनुष्य को परमेश्वर से अलग करता
  rationale: यूनानी कृदंत में कर्म स्पष्ट नहीं है; हिन्दी में अर्थ-स्पष्टता के लिए सामान्य कर्म ‘मनुष्य को’ जोड़ा गया है, बिना किसी विशेष समूह को निर्धारित किए।
- source_word: προσεγγίζουσα τῷ Βελίαρ
  choice: बेलियार के निकट ले जाता है
  rationale: पहले कृदंत के समानांतर कारणकारी भाव रखा गया है और Βελίαρ का लिप्यंतरण ‘बेलियार’ किया गया है।
theological_decisions:
- issue: πορνεία का अर्थ-क्षेत्र
  choice: व्यभिचार
  alternative: यौन अनैतिकता
  rationale: ‘व्यभिचार’ पाठ की गरिमा और संक्षिप्तता बनाए रखता है; इसे व्यापक यौन दुराचार के अर्थ में लिया गया है, न कि केवल विवाहेतर संबंध के संकीर्ण अर्थ में।
- issue: कृदंतों का निहित कर्म
  choice: मनुष्य को
  alternative: तुम्हें
  rationale: मूल यूनानी यह स्पष्ट नहीं करता कि अलग और निकट किसे किया जाता है। ‘मनुष्य को’ कथन को सामान्य सिद्धांत के रूप में रखता है और मूल की अस्पष्टता को अनावश्यक रूप से दूसरे पुरुष तक सीमित नहीं करता।
- issue: Βελίαρ की पहचान
  choice: बेलियार
  alternative: शैतान
  rationale: मूल का विशिष्ट नाम सुरक्षित रखा गया है; उसे किसी व्याख्यात्मक समानार्थी से बदलकर धार्मिक पहचान को अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपदेशात्मक और सामान्य पाठक के लिए सुबोध शैली। वाक्य की समानांतर क्रियात्मक संरचना तथा ‘जननी’ का मूल रूपक बनाए रखा गया है।
