id: T12P.SIM.9.1
reference: Testament of Simeon 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔκλαυσαν¹ οἱ² *υἱοὶ Συμεὼν³ τὸν πατέρα αὐτῶν⁴. Καὶ ἦσαν *εἰς Αἴγυπτον⁵ ἕως ἡμέρας ἐξόδου αὐτῶν⁶ *ἐν χειρὶ Μωϋσῆ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009/001.yaml
  text: And the sons of Simeon wept for their father. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: hi
  text: और शिमोन के पुत्र अपने पिता के लिए रोए। वे मिस्र में उस दिन तक थे जब मूसा के द्वारा उनका निकलना हुआ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मूसा के हाथ से।”'
    reason: यूनानी ἐν χειρὶ Μωϋσῆ में ‘हाथ’ की ठोस छवि है, जबकि हिन्दी मुख्य पाठ में उसका स्वाभाविक साधनवाचक अर्थ दिया गया है।
lexical_decisions:
- source_word: ἔκλαυσαν ... τὸν πατέρα αὐτῶν
  choice: अपने पिता के लिए रोए
  rationale: यूनानी में क्रिया के साथ कर्मकारक पद शोक मनाने का भाव व्यक्त करता है; हिन्दी में ‘के लिए रोए’ स्वाभाविक और अर्थानुरूप है।
- source_word: ἦσαν εἰς Αἴγυπτον
  choice: मिस्र में ... वहीं थे
  rationale: ἦσαν का सीधा भाव ‘थे’ रखा गया है; ‘वहीं’ अवधि-सूचक ‘तक’ के साथ हिन्दी वाक्य को स्वाभाविक बनाता है, बिना ‘बने रहे’ जैसा अतिरिक्त बल जोड़े।
- source_word: ἡμέρας ἐξόδου αὐτῶν
  choice: अपने निकलने के दिन
  rationale: ἐξόδου का मूल अर्थ यहाँ बाहर निकलना या प्रस्थान करना है; ‘निकलने’ से निर्गमन का भाव सरल आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: मूसा के द्वारा
  rationale: ‘हाथ में/हाथ से’ वाला यूनानी साधन अथवा माध्यम का मुहावरा है। मुख्य पाठ में स्वाभाविक हिन्दी ‘के द्वारा’ रखी गई है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘वे’ किन लोगों को सूचित करता है
  choice: सर्वनाम ‘वे’ को यथावत रखा गया
  alternative: ‘उनके वंशज’
  rationale: यूनानी पाठ οἱ υἱοὶ Συμεών के बाद ἦσαν में उन्हीं का व्याकरणिक संदर्भ बनाए रखता है। ऐतिहासिक समयांतर को स्पष्ट करने के लिए ‘वंशज’ जोड़ना संभव व्याख्या है, पर स्रोत में वह शब्द नहीं है; इसलिए अस्पष्टता नहीं मिटाई गई।
- issue: निर्गमन में मूसा की भूमिका
  choice: ‘मूसा के द्वारा’
  alternative: ‘मूसा के नेतृत्व में’
  rationale: ‘नेतृत्व में’ अर्थ की व्याख्या करता है, जबकि ἐν χειρί माध्यम/साधन और ‘हाथ’ की छवि दोनों रख सकता है। मुख्य पाठ में माध्यम का भाव दिया गया और शाब्दिक छवि टिप्पणी में सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘अपने पिता के लिए रोए’ शोक का स्वाभाविक हिन्दी प्रयोग है। दूसरे वाक्य में स्रोत के ‘थे’ को बनाए रखते हुए शब्दक्रम को हिन्दी के अनुकूल किया गया है।
