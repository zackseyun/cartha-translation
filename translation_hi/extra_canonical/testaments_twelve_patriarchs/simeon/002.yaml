  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002.yaml
  text: '1. Hear, my children, Simeon your father, and I will declare to you what I have in my heart.

    2. I was born from Jacob as the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.

    3. For I became very strong; I did not shrink from any deed, nor was I afraid in any matter.

    4. For my heart was hard, and my liver unmoved, and my inward parts without compassion.

    5. For courage also is given by the Most High to men in soul and in body.

    6. But in the time of my youth I was very jealous of Joseph, because my father loved him above all.

    7. And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.

    8. But his God and the God of our fathers sent his angel and rescued him from my hands.

    9. For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.

    10. And when Reuben heard these things, he was grieved, for he wanted to bring him back safely to our father.

    11. But when I heard this, I was very angry with Judah, because he had let him go alive;

    12. and for five months I was sick in my liver. And the Lord struck me, and my hand was withered for seven days.

    13. And I knew, my children, that this happened to me because of Joseph. And after changing my mind I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.

    14. For I knew that I had devised an evil thing before the Lord and against Jacob my father concerning Joseph my brother, by envying him.'
translation:
  language: hi
  text: 'सिमोन का वसीयतनामा 2


    1. हे मेरे बच्चो, अपने पिता सिमोन की सुनो; मैं तुम्हें वह बताऊँगा जो मेरे हृदय में है।


    2. मैं याकूब से उत्पन्न हुआ और अपने पिता का दूसरा पुत्र था। मेरी माता लिआ ने मेरा नाम सिमोन रखा, क्योंकि प्रभु ने उसकी विनती सुन ली थी।


    3. मैं बहुत बलवान हो गया था; मैं किसी काम से पीछे नहीं हटा और न किसी परिस्थिति से डरा।


    4. मेरा हृदय कठोर था, मेरा कलेजा अटल[a] था और मेरे भीतर दया का कोई भाव न था।


    5. क्योंकि साहस भी परमप्रधान की ओर से मनुष्यों को प्राण और शरीर में दिया जाता है।


    6. अपनी जवानी के दिनों में मैं यूसुफ से बहुत ईर्ष्या करता था, क्योंकि मेरे पिता उसे सबसे बढ़कर प्रेम करते थे।


    7. मैंने उसे मार डालने के लिए अपना कलेजा उसके विरुद्ध कठोर कर लिया[a], क्योंकि छल के शासक और ईर्ष्या की आत्मा ने मेरी बुद्धि को अंधा कर दिया था। इसलिए मैंने न तो उसे अपना भाई समझकर उसका ध्यान रखा, न अपने पिता याकूब पर दया की।


    8. परन्तु उसके परमेश्वर और हमारे पूर्वजों के परमेश्वर ने अपना दूत भेजकर उसे मेरे हाथों से छुड़ा लिया।


    9. जब मैं हमारे झुंडों के लिए मरहम[b] लाने शकेम गया और रूबेन दोतान गया—जहाँ हमारी आवश्यक वस्तुएँ और हमारा सारा भंडार था—तब मेरे भाई यहूदा ने यूसुफ को इश्माएलियों के हाथ बेच दिया।


    10. यह सुनकर रूबेन दुःखी हुआ, क्योंकि वह यूसुफ को हमारे पिता के पास वापस ले जाना चाहता था।


    11. पर जब मैंने यह सुना, तो मैं यहूदा पर बहुत क्रोधित हुआ, क्योंकि उसने यूसुफ को जीवित जाने दिया था। मैं पाँच महीने तक उस पर क्रोधित रहा।


    12. प्रभु मुझे तोड़ता रहा और उसने मुझे कुछ करने से रोक दिया, क्योंकि मेरा दाहिना हाथ सात दिनों तक आधा सूख गया था[c]।


    13. तब हे मेरे बच्चो, मैं समझ गया कि मेरे साथ यह यूसुफ के कारण हुआ था। मैंने मन फिराया, रोया और प्रभु परमेश्वर से प्रार्थना की कि मेरा हाथ फिर ठीक हो जाए और मैं हर प्रकार की अशुद्धता, ईर्ष्या और मूर्खता से दूर रहूँ।


    14. क्योंकि मैं जान गया था कि यूसुफ से ईर्ष्या करके मैंने अपने भाई यूसुफ के विषय में प्रभु के सामने और अपने पिता याकूब के विरुद्ध एक बुरी योजना बनाई थी।


    [a] यूनानी पाठ में शाब्दिक रूप से “जिगर” है। प्राचीन भाषा में इसे भावनाओं और दृढ़ संकल्प का केंद्र माना जाता था; हिन्दी में इसी शारीरिक बिंब को “कलेजा” से व्यक्त किया गया है।


    [b] “मरहम” अनुवादित यूनानी शब्द का अर्थ लेप, मलहम या चिकनाई का पदार्थ हो सकता है।


    [c] यूनानी पाठ का शाब्दिक अर्थ है कि दाहिना हाथ “आधा सूखा हुआ” हो गया था; आशय है कि वह आंशिक रूप से निष्क्रिय या अशक्त हो गया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से “जिगर” है। प्राचीन भाषा में इसे भावनाओं और दृढ़ संकल्प का केंद्र माना जाता था; हिन्दी में इसी शारीरिक बिंब को “कलेजा” से व्यक्त किया गया है।
    reason: मूल के शरीर-अंग वाले बिंब को बनाए रखते हुए आधुनिक पाठक के लिए उसका सांस्कृतिक अर्थ स्पष्ट करना।
  - marker: b
    text: “मरहम” अनुवादित यूनानी शब्द का अर्थ लेप, मलहम या चिकनाई का पदार्थ हो सकता है।
    reason: ἄλειμμα का सटीक पदार्थ प्रसंग से निश्चित नहीं है।
  - marker: c
    text: यूनानी पाठ का शाब्दिक अर्थ है कि दाहिना हाथ “आधा सूखा हुआ” हो गया था; आशय है कि वह आंशिक रूप से निष्क्रिय या अशक्त हो गया था।
    reason: दुर्लभ ἡμίξηρος के शाब्दिक बिंब और संभावित कार्यात्मक अर्थ दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: τὰ ἤπατά / τὰ ἤπατά μου
  choice: कलेजा / अपना कलेजा
  rationale: शाब्दिक अर्थ ‘जिगर’ है, जो प्राचीन मानव-विज्ञान में भावनाओं और संकल्प का स्थान था। आधुनिक हिन्दी का ‘कलेजा’ शारीरिक बिंब और भावात्मक अर्थ दोनों को अधिक स्वाभाविक रूप से बनाए रखता है; फुटनोट मूल बिंब स्पष्ट करता है।
- source_word: ἀνδρεία
  choice: साहस
  rationale: यहाँ शब्द शौर्य, धैर्य या वीरता का भाव देता है। ‘साहस’ साधारण पाठक के लिए स्वाभाविक है और इसे केवल युद्ध-वीरता तक सीमित नहीं करता।
- source_word: ζήλου / φθόνου
  choice: ईर्ष्या
  rationale: दोनों शब्दों के अर्थ-क्षेत्र यहाँ विरोधी डाह/ईर्ष्या में मिलते हैं। प्रसंग में यूसुफ के प्रति सिमोन की घातक ईर्ष्या प्रमुख है।
- source_word: ἄρχων τῆς πλάνης
  choice: छल का शासक
  rationale: ‘प्लाने’ में भटकाव, भ्रम और छल का अर्थ संभव है। औपचारिक उपाधि को बनाए रखते हुए किसी विशिष्ट नामित दुष्ट सत्ता की पहचान आरोपित नहीं की गई।
- source_word: ἄλειμμα
  choice: मरहम
  rationale: यह लेप, मलहम या अभिषेक/चिकनाई के पदार्थ को सूचित कर सकता है। ‘मरहम’ पठनीय है, जबकि अर्थ की अनिश्चितता फुटनोट में सुरक्षित रखी गई है।
- source_word: ἡμίξηρος
  choice: आधा सूख गया था
  rationale: दुर्लभ संयुक्त विशेषण का निकट शाब्दिक अर्थ रखा गया है; फुटनोट संभावित कार्यात्मक आशय बताता है।
- source_word: μετανοήσας
  choice: मैंने मन फिराया
  rationale: यह केवल विचार बदलने से अधिक, बुराई से पश्चात्तापपूर्वक मुड़ने को व्यक्त करता है; ‘मन फिराया’ धार्मिक अर्थ को रखता है, पर किसी विशेष संप्रदायगत सूत्र को आरोपित नहीं करता।
theological_decisions:
- issue: ‘छल के शासक’ की पहचान
  choice: उपाधि को ‘छल का शासक’ ही रखा गया
  alternative: इसे सीधे ‘शैतान’ कहना
  rationale: यूनानी पाठ किसी नाम का प्रयोग नहीं करता। मूल की अस्पष्टता और इस ग्रंथ की आत्मिक-सत्ता संबंधी भाषा को सुरक्षित रखा गया है।
- issue: साहस का स्रोत और मानव की प्राण-शरीर संरचना
  choice: ‘परमप्रधान की ओर से… प्राण और शरीर में’
  alternative: ‘आत्मा और शरीर को’ या किसी द्वैतवादी व्याख्या में विस्तार
  rationale: मूल ψυχαῖς καὶ σώμασιν को निकटता से रखा गया है और मानव-स्वरूप पर अतिरिक्त सिद्धांत नहीं जोड़ा गया।
- issue: सिमोन की शारीरिक पीड़ा का दैवी कारण
  choice: पाठ के कारणात्मक संबंध को स्पष्ट रखा गया
  alternative: इसे केवल स्वाभाविक बीमारी या रूपक बनाना
  rationale: वक्ता स्वयं इसे यूसुफ के विरुद्ध अपने अपराध से जोड़ता है और प्रभु की कार्रवाई बताता है; अनुवाद इस धार्मिक दावे को न नरम करता है, न उससे आगे जाता है।
- issue: पद 11–12 और अंग्रेज़ी परामर्श-पाठ में अंतर
  choice: यूनानी के अनुसार पाँच महीने क्रोधित रहना और दाहिने हाथ का सात दिन आधा सूखना
  alternative: अंग्रेज़ी POB के ‘पाँच महीने कलेजे में बीमार’ पाठ का अनुसरण
  rationale: प्रदत्त यूनानी पाठ में ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ स्पष्टतः पाँच महीने क्रोधित रहने की बात कहता है; स्रोत-साक्ष्य को प्राथमिकता दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। वाक्य विन्यास को हिन्दी में स्वाभाविक बनाया गया है, पर प्रमुख शारीरिक बिंब, आत्मिक सत्ताओं की अनिर्दिष्ट उपाधियाँ और दैवी दंड का कारणात्मक दावा सुरक्षित रखा गया है। नामों के लिए प्रचलित हिन्दी बाइबिल रूप—याकूब, लिआ, सिमोन, यूसुफ, रूबेन, यहूदा, शकेम, दोतान और इश्माएली—अपनाए गए हैं।
