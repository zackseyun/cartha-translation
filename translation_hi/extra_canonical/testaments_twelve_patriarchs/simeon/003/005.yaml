reference: Testament of Simeon 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν γάρ²¹ τις ἐπὶ Κύριον καταφύγῃ, *ἀποτρέχει τὸ πονηρὸν πνεῦμα ἀπʼ αὐτοῦ²², καὶ γίνεται ἡ διάνοια²³ κούφη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/005.yaml
  text: For if anyone takes refuge in the Lord, the evil spirit runs away from him, and the mind becomes light.
translation:
  language: hi
  text: क्योंकि यदि कोई प्रभु की शरण ले, तो दुष्ट आत्मा उससे दूर भाग जाती है और मन हल्का हो जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ Κύριον καταφύγῃ
  choice: प्रभु की शरण ले
  rationale: यह यूनानी पद संकट से बचने के लिए प्रभु को आश्रय बनाने का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘की शरण लेना’ स्वाभाविक और सटीक है।
- source_word: ἀποτρέχει
  choice: दूर भाग जाती है
  rationale: क्रिया का मूल चित्र किसी के पास से भाग जाने का है; ‘दूर भाग जाती है’ उस गतिशीलता को स्पष्ट रखता है।
- source_word: τὸ πονηρὸν πνεῦμα
  choice: दुष्ट आत्मा
  rationale: यह पद किसी बुरी आत्मिक सत्ता को सूचित करता है; ‘दुष्ट आत्मा’ प्रचलित और प्रत्यक्ष समतुल्य है।
- source_word: ἡ διάνοια
  choice: मन
  rationale: यहाँ शब्द मानसिक अवस्था या अंतःचेतना के अर्थ में है; साधारण हिन्दी में ‘मन’ सबसे सहज है।
- source_word: κούφη
  choice: हलका
  rationale: शब्द का अर्थ भार से मुक्त या हलका होना है। ‘हलका’ मूल रूपक और उसकी संभावित मानसिक-भावात्मक व्यापकता दोनों को बनाए रखता है।
theological_decisions:
- issue: दुष्ट आत्मा के हटने और मन के हलका होने के बीच संबंध
  choice: दोनों कथनों को ‘और’ से समानांतर रखा गया
  alternative: मन के हलका होने को दुष्ट आत्मा के भागने का स्पष्ट परिणाम बताना
  rationale: यूनानी पाठ καὶ से दोनों बातें जोड़ता है, पर कारण-परिणाम संबंध को स्पष्ट रूप से परिभाषित नहीं करता; इसलिए उस तनाव को खुला रखा गया है।
- issue: διάνοια के स्वामी का संकेत
  choice: ‘मन’ कहा गया, ‘उसका मन’ नहीं
  alternative: ‘उसका मन’
  rationale: उपलब्ध यूनानी पाठ में स्वामित्व-सूचक सर्वनाम नहीं है। हिन्दी में संदर्भ से संबंधित व्यक्ति समझ में आता है, इसलिए मूल की अनिर्दिष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। ‘हलका’ मूल रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
