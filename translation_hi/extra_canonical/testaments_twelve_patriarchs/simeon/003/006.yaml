source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ λοιπὸν συμπαθεῖ²⁴ τῷ φθονουμένῳ²⁵, καὶ²⁶ συγγινώσκει²⁷ *τοῖς ἀγαπῶσιν²⁸ αὐτόν²⁹, καὶ οὕτως³⁰ παύεται τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/006.yaml
  text: And from then on he has compassion for the one envied, and forgives those who love him, and so he ceases from envy.
translation:
  language: hi
  text: और तब से वह उस व्यक्ति के प्रति सहानुभूति रखता है जिससे ईर्ष्या की जाती है, और उससे प्रेम करनेवालों को क्षमा करता है; इस प्रकार वह ईर्ष्या करना छोड़ देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιπὸν
  choice: तब से
  rationale: संदर्भ में यह आगे होनेवाले परिवर्तन को सूचित करता है; आधुनिक हिन्दी में ‘तब से’ स्वाभाविक है।
- source_word: συμπαθεῖ
  choice: सहानुभूति रखता है
  rationale: क्रिया का अर्थ किसी के दुःख या स्थिति में सहभागी भाव रखना है; यह दत्तिव τῷ φθονουμένῳ के साथ सहज हिन्दी देता है।
- source_word: τῷ φθονουμένῳ
  choice: उस व्यक्ति के प्रति ... जिससे ईर्ष्या की जाती है
  rationale: यूनानी वर्तमान कर्मवाच्य कृदंत का अर्थ ‘ईर्ष्या का पात्र व्यक्ति’ है; अनुवाद कर्मवाच्य अर्थ बनाए रखता है।
- source_word: συγγινώσκει
  choice: क्षमा करता है
  rationale: यहाँ संदर्भानुसार दोष को समझते हुए छोड़ देने या क्षमा करने का भाव है, जैसा प्राचीन प्रयोग और परामर्श-पाठ संकेत करते हैं।
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: उससे प्रेम करनेवालों को
  rationale: बहुवचन कृदंत और αὐτόν के पुरुषवाचक कर्म को सीधे बनाए रखा गया है।
- source_word: παύεται τοῦ φθόνου
  choice: ईर्ष्या करना छोड़ देता है
  rationale: παύομαι के साथ संबंधकारक से किसी दशा या आचरण से रुकने का भाव आता है; हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक है।
theological_decisions:
- issue: αὐτόν का संदर्भ
  choice: ‘उससे’ को निकटतम पुरुषवाचक व्यक्ति, अर्थात् ईर्ष्या के पात्र व्यक्ति, की ओर संकेत करने दिया गया है।
  alternative: इसे ईर्ष्यालु व्यक्ति की ओर संकेत मानकर ‘उससे [ईर्ष्यालु से] प्रेम करनेवालों’ का अर्थ लिया जा सकता है।
  rationale: सर्वनाम का व्याकरणिक संदर्भ कुछ हद तक अस्पष्ट है; हिन्दी में सर्वनाम बनाए रखने से इस वास्तविक अस्पष्टता को अनावश्यक रूप से निर्णीत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘ईर्ष्या’ को पूरे वाक्य में एकरूप रखा गया है और किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
