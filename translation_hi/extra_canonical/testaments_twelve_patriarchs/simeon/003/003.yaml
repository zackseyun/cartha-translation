  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/003.yaml
  text: But it always urges him to kill the one envied; and the one envied always flourishes, while the one who envies wastes away.
translation:
  language: hi
  text: पर वह सदा ईर्ष्या करने वाले को उस व्यक्ति को मार डालने के लिए उकसाता है जिससे वह ईर्ष्या करता है; और जिससे ईर्ष्या की जाती है वह सदा फलता-फूलता है, जबकि ईर्ष्या करने वाला मुरझाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποβάλλει
  choice: उकसाती है
  rationale: यह क्रिया किसी के मन में हानिकारक काम करने की प्रेरणा डालने या उसे उसके लिए उकसाने का भाव रखती है; आधुनिक हिन्दी में ‘उकसाती है’ स्वाभाविक और सटीक है।
- source_word: ἀνελεῖν
  choice: मार डाले
  rationale: यहाँ infinitive का अर्थ व्यक्ति को प्राण से मार देना है; ‘मार डाले’ उद्देश्य और हिंसक परिणाम दोनों स्पष्ट करता है।
- source_word: τὸν φθονούμενον
  choice: जिससे वह ईर्ष्या करता है
  rationale: शाब्दिक ‘ईर्ष्या किया जाने वाला’ अस्वाभाविक होता; संबंधवाचक रचना यूनानी कृदन्त का अर्थ सहज हिन्दी में सुरक्षित रखती है।
- source_word: ἀνθεῖ
  choice: फलता-फूलता है
  rationale: मूलतः ‘खिलता है’; प्रसंग में व्यक्ति की उन्नति या समृद्ध दशा के लिए हिन्दी का प्रचलित रूपक ‘फलता-फूलता है’ उपयुक्त है।
- source_word: μαραίνεται
  choice: मुरझाता जाता है
  rationale: यह ‘कुम्हलाना/मुरझाना’ बताता है और ἀνθεῖ के पुष्प-संबंधी रूपक के साथ विरोध बनाए रखता है; ‘जाता है’ क्रमिक क्षय का भाव देता है।
theological_decisions:
- issue: क्रिया ὑποβάλλει का निहित कर्ता
  choice: स्त्रीलिंग ‘वह ... उकसाती है’ द्वारा पूर्ववर्ती संदर्भ के कर्ता को अनिर्दिष्ट रखते हुए संकेतित किया गया
  alternative: ‘ईर्ष्या सदा उकसाती है’ कहकर कर्ता को स्पष्ट करना
  rationale: इस पद में कर्ता स्वयं व्यक्त नहीं है और पूर्ववर्ती कथन से ग्रहण किया जाता है। उसका नाम जोड़ना मूल की अंतर्पदीय निर्भरता और संभावित अस्पष्टता को अनावश्यक रूप से हल कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फलता-फूलता’ और ‘मुरझाता’ मूल के खिलने बनाम कुम्हलाने के रूपकीय विरोध को बनाए रखते हैं। कोई पाद-टिप्पणी आवश्यक नहीं है।
