  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/004.yaml
  text: For two years, then, in fear of the Lord I afflicted my soul with fasting, and I learned that the release from envy comes through fear of God.
translation:
  language: hi
  text: तब मैंने दो वर्ष तक प्रभु के भय में उपवास करते हुए अपने प्राण को कष्ट दिया, और जाना कि ईर्ष्या से मुक्ति परमेश्वर के भय के द्वारा होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάκωσα τὴν ψυχήν μου
  choice: मैंने अपने प्राण को कष्ट दिया
  rationale: यूनानी मुहावरे की आत्म-अनुशासन और दुःख उठाने की धारणा को निकटता से रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: ἐν νηστείᾳ
  choice: उपवास करके
  rationale: साधन अथवा रीति का भाव स्पष्ट करता है और आधुनिक हिन्दी में सहज है।
- source_word: ἡ λύσις τοῦ φθόνου
  choice: ईर्ष्या से मुक्ति
  rationale: λύσις के बन्धन से छूटने के भाव तथा φθόνος की ईर्ष्या/द्वेषपूर्ण जलन को संक्षेप में व्यक्त करता है।
- source_word: διὰ φόβου θεοῦ γίνεται
  choice: परमेश्वर के भय के द्वारा मिलती है
  rationale: διὰ के माध्यम-सूचक अर्थ और γίνεται के घटित/प्राप्त होने के भाव को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ‘प्रभु/परमेश्वर का भय’ का अर्थ
  choice: भय
  alternative: श्रद्धा / श्रद्धापूर्ण भय
  rationale: φόβος का सीधा और पारंपरिक समतुल्य रखा गया है; केवल ‘श्रद्धा’ करने से मूल का भय-संबंधी तनाव कम हो जाता।
- issue: ψυχή का अनुवाद
  choice: प्राण
  alternative: आत्मा / स्वयं
  rationale: ‘प्राण’ यहाँ व्यक्ति के भीतरी जीवन/स्वयं को दर्शाता है और ‘आत्मा’ से उत्पन्न संभावित तत्त्वमीमांसात्मक संकीर्णता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। ‘इसलिए’ से οὖν का निष्कर्षसूचक संबंध, और ‘प्रभु’ तथा ‘परमेश्वर’ से स्रोत में κύριος तथा θεός का भेद सुरक्षित रखा गया है।
