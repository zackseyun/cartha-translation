source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα¹ μου² Γἀκούσατέ μου καὶ¹³ φυλάξασθε⁴ ἀπὸ *τοῦ πνεύματος⁵ τῆς πλάνης καὶ τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/001.yaml
  text: And now, my children, hear me and guard yourselves against the spirit of deceit and envy.
translation:
  language: hi
  text: और अब, मेरे बच्चों, मेरी सुनो और अपने आप को भटकावे और ईर्ष्या की आत्मा से बचाए रखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: शाब्दिक अर्थ ‘मेरी संतानो’ है; संबोधन में ‘मेरे बच्चो’ अधिक स्वाभाविक, आत्मीय और आधुनिक हिन्दी है।
- source_word: ἀκούσατέ μου
  choice: मेरी सुनो
  rationale: यूनानी में आज्ञार्थक संबोधन है; ‘मेरी सुनो’ ध्यान देकर बात मानने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: φυλάξασθε ἀπό
  choice: अपने आप को ... से बचाए रखो
  rationale: मध्यवाच्य आज्ञार्थक रूप आत्म-सुरक्षा का भाव देता है; यह चयन निरंतर सावधानी को भी स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πνεύματος τῆς πλάνης
  choice: भटकावे की आत्मा
  rationale: πλάνη में भटकाव, भ्रम या छल का अर्थ हो सकता है। ‘भटकावा’ इस व्यापकता को बनाए रखता है और केवल जानबूझकर किए गए छल तक अर्थ को सीमित नहीं करता।
- source_word: φθόνου
  choice: ईर्ष्या
  rationale: यह φθόνος का प्रचलित और सटीक हिन्दी समतुल्य है, जिसमें दूसरे की भलाई से जलने का भाव निहित है।
theological_decisions:
- issue: ‘भटकावे और ईर्ष्या की आत्मा’ में एक आत्मा या दो
  choice: एकवचन ‘आत्मा’ को दोनों संबंधवाचक पदों के साथ रखा गया
  alternative: ‘भटकावे की आत्मा और ईर्ष्या’ अथवा ‘भटकावे और ईर्ष्या की आत्माओं’
  rationale: यूनानी में πνεύματος एकवचन है और उसके साथ πλάνης तथा φθόνου जुड़े हैं। हिन्दी वाक्य उसी व्याकरणिक तनाव को बनाए रखता है और यह तय नहीं करता कि यहाँ व्यक्तिगत दुष्ट आत्मा, प्रभाव या प्रवृत्ति अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक उपदेश के अनुकूल रखी गई है। ‘बच्चो’ संबोधन में देवनागरी वर्तनी के अनुसार बिना अनुस्वार के है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
