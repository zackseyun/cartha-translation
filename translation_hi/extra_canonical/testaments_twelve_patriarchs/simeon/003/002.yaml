base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/002.yaml
  text: For envy masters the whole mind of a person, and does not allow him either to eat or to drink or to do anything good.
translation:
  language: hi
  text: क्योंकि ईर्ष्या मनुष्य के पूरे मन पर अधिकार कर लेती है और उसे न तो खाने देती है, न पीने देती है, और न कोई भला काम करने देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  choice: ईर्ष्या
  rationale: यह यूनानी शब्द दूसरे के लाभ या भलाई से उपजने वाली ईर्ष्या को दर्शाता है; आधुनिक हिन्दी में ‘ईर्ष्या’ इसका स्वाभाविक और सटीक रूप है।
- source_word: κυριεύει
  choice: अधिकार कर लेती है
  rationale: क्रिया प्रभुत्व जमाने या स्वामी बन बैठने का भाव रखती है; यह चयन ईर्ष्या की नियंत्रक शक्ति को स्पष्ट करता है।
- source_word: πάσης τῆς διανοίας
  choice: पूरी बुद्धि
  rationale: πάσης की समग्रता को ‘पूरी’ से और διάνοια के विचारशील मानसिक क्षेत्र को ‘बुद्धि’ से व्यक्त किया गया है।
- source_word: ποιῆσαί τι ἀγαθόν
  choice: कोई भला काम करने
  rationale: वाक्यांश का सामान्य नैतिक अर्थ सहज आधुनिक हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: ईर्ष्या के मानसिक प्रभुत्व की व्यापकता
  choice: मनुष्य की पूरी बुद्धि पर अधिकार
  alternative: मनुष्य के पूरे मन पर शासन
  rationale: ‘पूरी’ से πάσης का बल सुरक्षित रखा गया है, जबकि ‘अधिकार’ κυριεύει के प्रभुत्व को व्यक्त करता है; किसी विशिष्ट मनोवैज्ञानिक या सांप्रदायिक अर्थ को आरोपित नहीं किया गया।
