  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/001.yaml
  text: Hear, my children, Simeon your father, and I will declare to you what I have in my heart.
translation:
  language: hi
  text: मेरे बच्चो, अपने पिता शिमोन की सुनो, और मैं तुम्हें वह सब बताऊँगा जो मेरे हृदय में है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया को सरल और स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में इसका अर्थ ध्यान देकर सुनना है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: पिता द्वारा अपनी संतान को किए गए आत्मीय संबोधन को आधुनिक, सहज हिन्दी में सुरक्षित रखता है।
- source_word: Συμεὼν τοῦ πατρὸς ὑμῶν
  choice: अपने पिता शिमोन की
  rationale: यूनानी में ‘सुनो’ के कर्म के रूप में आए ‘तुम्हारे पिता शिमोन’ को हिन्दी की स्वाभाविक ‘की सुनो’ संरचना में प्रस्तुत किया गया है।
- source_word: ἀναγγελῶ
  choice: बताऊँगा
  rationale: भविष्यकाल और किसी बात को प्रकट या सुनाने के भाव को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου
  choice: वह सब जो मेरे हृदय में है
  rationale: ‘ὅσα’ की समावेशी व्यापकता और ‘हृदय’ के भीतरी विचारों या भावों वाले रूपक को यथावत रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में आत्मीय, गरिमापूर्ण और मौखिक वसीयतनुमा संबोधन के अनुकूल रखी गई है। ‘हृदय’ को ‘मन’ से नहीं बदला गया, ताकि स्रोत का पारंपरिक रूपक बना रहे।
