  text: For in the time of my youth I was very jealous of Joseph, because my father loved him above all.
translation:
  language: hi
  text: क्योंकि अपनी जवानी के दिनों में मैं यूसुफ़ से बहुत ईर्ष्या करता था; इसका कारण यह था कि मेरे पिता उससे सबसे बढ़कर प्रेम करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου
  choice: क्योंकि अपनी जवानी के दिनों में
  rationale: γὰρ का कारणसूचक संबंध ‘क्योंकि’ से रखा गया है और समयसूचक वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: πολλὰ ἐζήλωσα τὸν Ἰωσήφ
  choice: मैं यूसुफ़ से बहुत ईर्ष्या करता था
  rationale: यहाँ ζηλόω संदर्भ में यूसुफ़ के प्रति तीव्र ईर्ष्या दर्शाता है; हिन्दी में व्यक्ति के साथ ‘से ईर्ष्या करना’ स्वाभाविक है।
- source_word: ἠγάπα αὐτὸν ὁ πατήρ μου παρὰ πάντας
  choice: मेरे पिता उससे सबसे बढ़कर प्रेम करते थे
  rationale: παρὰ πάντας की तुलनात्मक शक्ति को ‘सबसे बढ़कर’ से सुरक्षित रखा गया है; ‘सब’ किन लोगों को सूचित करता है, इसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: पिता के प्रेम की तुलना का दायरा
  choice: सबसे बढ़कर
  alternative: अपने सभी पुत्रों से बढ़कर
  rationale: यूनानी पाठ केवल παρὰ πάντας (‘सबसे/सब लोगों से बढ़कर’) कहता है; ‘पुत्रों’ को जोड़ने से निहित संदर्भ स्पष्ट होता, पर मूल की संक्षिप्तता और संभावित व्यापकता घटती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यूसुफ़’ प्रचलित हिन्दी बाइबलीय नामरूप है; कारणसूचक γὰρ और ὅτι दोनों के संबंध क्रमशः ‘क्योंकि’ और ‘इसलिए कि’ से स्पष्ट किए गए हैं।
