  text: And Reuben, hearing these things, was grieved, for he wanted to bring him safely back to his father.
translation:
  language: hi
  text: और ये बातें सुनकर रूबेन दुःखी हुआ, क्योंकि वह उसे उसके पिता के पास वापस ले जाना चाहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: सुनकर
  rationale: कालसूचक कृदन्त को स्वाभाविक हिन्दी पूर्वकालिक क्रिया से व्यक्त किया गया है।
- source_word: ἐλυπήθη
  choice: दुःखी हुआ
  rationale: यूनानी निष्क्रिय रूप यहाँ मनोदशा में आने का अर्थ देता है; यह हिन्दी में सहज और सटीक है।
- source_word: ἀπαγαγεῖν
  choice: वापस ले जाना
  rationale: संदर्भ में यूसुफ को पिता के पास लौटा ले जाने का आशय है। 'सुरक्षित' मूल यूनानी में स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: πρὸς τὸν πατέρα
  choice: उसके पिता के पास
  rationale: लेख के साथ 'पिता' और कर्म-संदर्भ को हिन्दी में स्पष्ट करने के लिए 'उसके' रखा गया है; यह 'हमारे पिता' नहीं कहता।
