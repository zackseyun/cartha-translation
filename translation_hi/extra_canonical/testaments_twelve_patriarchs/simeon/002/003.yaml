base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/003.yaml
  text: For I became very strong; I did not shrink from any deed, nor was I afraid of anything.
translation:
  language: hi
  text: क्योंकि मैं बहुत बलवान हो गया; मैं किसी भी काम से पीछे नहीं हटा और न किसी बात से डरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνατός
  choice: बलवान
  rationale: यह δυνατός के सामर्थ्यवान या शक्तिशाली होने के सामान्य अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐδειλίασα
  choice: पीछे नहीं हटा
  rationale: क्रिया का आशय डर या कायरता के कारण किसी कार्य से सकुचाने अथवा हटने से है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से चरित्रगत ‘कायर’ का ठप्पा नहीं लगाता।
- source_word: πρᾶξιν
  choice: कोई भी काम करने से
  rationale: πρᾶξις यहाँ कार्य या कर्म को सूचित करता है; निषेध के साथ हिन्दी में ‘कोई भी काम’ इसका स्वाभाविक रूप है।
- source_word: ἀπὸ παντὸς πράγματος
  choice: किसी बात से
  rationale: शाब्दिक रूप से ‘हर वस्तु/मामले से’; निषेध के साथ ‘किसी बात से’ व्यापक अर्थ को सहज हिन्दी में बनाए रखता है।
