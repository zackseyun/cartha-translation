translation:
  language: hi
  text: परन्तु ये बातें सुनकर मैं यहूदा पर बहुत क्रोधित हुआ, क्योंकि उसने उसे जीवित छोड़ दिया था; और मैं पाँच महीने तक उस पर क्रोधित रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθην ἐπὶ τὸν Ἰούδαν σφόδρα
  choice: मैं यहूदा पर बहुत क्रोधित हुआ
  rationale: ‘σφόδρα’ की तीव्रता को ‘बहुत’ से और ‘ἐπὶ’ के लक्ष्य को ‘यहूदा पर’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ζῶντα αὐτὸν ἀπέλυσεν
  choice: उसने उसे जीवित जाने दिया था
  rationale: यह वाक्यांश इस बात पर बल देता है कि व्यक्ति को मारने के बजाय जीवित छोड़ दिया गया; ‘जाने दिया’ ἀπέλυσεν का सहज और प्रसंगानुकूल रूप है।
- source_word: ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ
  choice: मैं पाँच महीने तक उस पर क्रोधित रहा
  rationale: यूनानी कालावधि-सूचक संरचना का अर्थ स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में दिया गया है।
