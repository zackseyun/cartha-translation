base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/007.yaml
  text: And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.
translation:
  language: hi
  text: और मैंने उसके विरुद्ध अपना मन कठोर कर लिया[a], ताकि उसे मार डालूँ; क्योंकि भ्रम के शासक और ईर्ष्या की आत्मा ने मेरी बुद्धि को अंधा कर दिया था, जिससे मैं न तो उसे भाई मानता था और न ही अपने पिता याकूब को बख्शता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मैंने उसके विरुद्ध अपना जिगर दृढ़ किया”; प्राचीन प्रयोग में जिगर को भीतरी भावों और संकल्प का केंद्र माना जाता था।'
    reason: मूल यूनानी के असामान्य शारीरिक बिंब को दर्ज करते हुए मुख्य पाठ में स्वाभाविक हिन्दी देना।
lexical_decisions:
- source_word: ἐστήριξα ... τὰ ἤπατά μου
  choice: अपना मन कठोर कर लिया
  rationale: यूनानी में शाब्दिक रूप से ‘अपने जिगर को दृढ़ किया’ है। यहाँ जिगर आंतरिक भावों और संकल्प का केंद्र है; स्वाभाविक हिन्दी में भाव को ‘मन कठोर कर लिया’ से व्यक्त किया गया है, और मूल बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: भ्रम का शासक
  rationale: πλάνη भटकाव, भ्रम या छल का अर्थ दे सकता है। ‘भ्रम’ नैतिक और मानसिक भटकाव की व्यापकता बनाए रखता है, जबकि ἄρχων के लिए ‘शासक’ औपचारिक पद-सूचक भाषा को सुरक्षित रखता है।
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: ईर्ष्या की आत्मा
  rationale: ζῆλος इस संदर्भ में सकारात्मक उत्साह नहीं, बल्कि भाई के प्रति विनाशकारी ईर्ष्या है; πνεῦμα का प्रत्यक्ष और संदर्भानुकूल अनुवाद ‘आत्मा’ है।
- source_word: ἐτύφλωσέ μου τὸν νοῦν
  choice: मेरी बुद्धि को अंधा कर दिया था
  rationale: यूनानी रूपक को बनाए रखते हुए νοῦς को यहाँ विचार और नैतिक समझ की क्षमता के अर्थ में ‘बुद्धि’ कहा गया है।
- source_word: μὴ προσέχειν αὐτῷ ὡς ἀδελφῷ
  choice: मैं ... उसे भाई मानता था
  rationale: शाब्दिक ‘भाई के रूप में उस पर ध्यान न देना’ का आशय उसके साथ भाई जैसा संबंध या व्यवहार न रखना है; हिन्दी में ‘भाई मानना’ इसे सहज रूप से व्यक्त करता है।
- source_word: μηδὲ φείσασθαι τῷ πατρί μου Ἰακώβ
  choice: न ही अपने पिता याकूब को बख्शता था
  rationale: φείδομαι का अर्थ छोड़ देना, बख्शना या किसी के प्रति रियायत करना है। ‘बख्शता’ कथन की कठोरता और पिता पर पड़ने वाले परिणाम दोनों को खुला रखता है।
theological_decisions:
- issue: ‘भ्रम के शासक’ की पहचान
  choice: उपाधि को उसी रूप में रखा गया और किसी विशिष्ट नाम से नहीं जोड़ा गया।
  alternative: इसे सीधे ‘शैतान’ कहना।
  rationale: मूल पाठ केवल ὁ ἄρχων τῆς πλάνης कहता है; किसी नाम को जोड़ना पाठ में निहित धार्मिक पहचान से आगे जाना होता।
- issue: ‘भ्रम के शासक’ और ‘ईर्ष्या की आत्मा’ का संबंध
  choice: दोनों पदों को समन्वित रूप में रखा गया, बिना यह तय किए कि वे एक ही सत्ता के दो वर्णन हैं या अलग कर्ता।
  alternative: उन्हें स्पष्ट रूप से एक ही सत्ता अथवा दो अलग-अलग सत्ताएँ बताना।
  rationale: यूनानी में दोनों संज्ञा-पद καί से जुड़े हैं और एकवचन क्रिया आई है; यह व्याकरणिक तनाव हिन्दी में अनावश्यक व्याख्या जोड़े बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। वाक्य की स्वीकारोक्तिपूर्ण कठोरता बनाए रखी गई है। ‘बख्शता’ तीखा किंतु प्रचलित शब्द है; यह पिता के प्रति निर्दयता को किसी एक विशिष्ट परिणाम तक सीमित नहीं करता।
