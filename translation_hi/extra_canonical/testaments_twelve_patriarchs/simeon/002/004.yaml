review_pass:
  verdict: revise
  source_fidelity: ‘हृदय कठोर’ and ‘कलेजा अचल’ convey καρδία σκληρά and τὰ ἤπατα ἀκίνητα well, including the deliberately bodily imagery. However, σπλάγχνα (‘inward parts,’ literally inner organs/entrails and figuratively the seat of compassion) is reduced to the abstract locative ‘मेरे अंतरतम में’; the source predicates lack of compassion of the inward parts themselves.
  naturalness: The draft is fluent and appropriately grave. ‘कलेजा अचल’ is marked but intelligible and suitably retains the source’s unusual metaphor. ‘मेरे भीतर के अंगों में करुणा नहीं थी’ is natural modern Hindi while retaining the source’s bodily plural imagery better than ‘मेरे अंतरतम में कोई करुणा न थी।’
  terminology: ‘हृदय’ and ‘कलेजा’ are sound choices. ‘करुणा’ adequately represents ἀσυμπαθῆ in context. The revision restores σπλάγχνα as ‘भीतर के अंगों’ without imposing an interpretive theological sense.
  issues:
  - severity: medium
    issue: σπλάγχνα is rendered as ‘अंतरतम’ rather than as the inward parts/inner organs.
    rationale: While ‘अंतरतम’ conveys inner feeling, it omits the source’s concrete bodily imagery and changes the syntax from ‘my inward parts [were] without compassion’ to ‘there was no compassion in my inmost being.’
  revised_text: क्योंकि मेरा हृदय कठोर था, मेरा कलेजा अचल था, और मेरे भीतर के अंगों में करुणा नहीं थी।
