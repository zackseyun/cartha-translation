source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἡ γὰρ καρδία μου ἦν σκληρά, καὶ *τὰ ἤπατά¹⁵ μου ἀκίνητα καὶ τὰ σπλάγχνα μου ἀσυμπαθῆ¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/004.yaml
  text: For my heart was hard, and my liver unmoved, and my inward parts without compassion.
translation:
  language: hi
  text: क्योंकि मेरा हृदय कठोर था, मेरा कलेजा अचल था, और मेरे भीतर के अंगों में करुणा नहीं थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  choice: हृदय
  rationale: यह मनुष्य के भीतरी नैतिक और भावात्मक केंद्र का स्वाभाविक तथा गरिमापूर्ण हिन्दी बोध देता है।
- source_word: τὰ ἤπατά
  choice: कलेजा
  rationale: यूनानी शब्द का शाब्दिक शारीरिक अर्थ ‘यकृत/कलेजा’ है; यहाँ भावनाओं के केंद्र के रूप में प्रयुक्त रूपक को बनाए रखने के लिए अधिक स्वाभाविक ‘कलेजा’ चुना गया।
- source_word: ἀκίνητα
  choice: अचल
  rationale: मूल अर्थ ‘न हिलने वाला’ है; यह करुणा से न पिघलने या प्रभावित न होने की रूपकात्मक कठोरता को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: σπλάγχνα
  choice: अंतरतम
  rationale: शाब्दिक अर्थ ‘अंतड़ियाँ/भीतरी अंग’ है, पर यूनानी में यह गहरी भावनाओं और दया के अंतःस्थान को भी दर्शाता है; ‘अंतरतम’ आधुनिक हिन्दी में उसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀσυμπαθῆ
  choice: कोई करुणा न थी
  rationale: यह ‘सहानुभूति या दया से रहित’ होने का स्पष्ट, सहज और संदर्भानुकूल हिन्दी रूप है।
theological_decisions:
- issue: शारीरिक अंगों की त्रिस्तरीय रूपकात्मक भाषा
  choice: ‘हृदय’ और ‘कलेजा’ को बनाए रखते हुए σπλάγχνα को ‘अंतरतम’ कहना
  alternative: ‘हृदय कठोर था, यकृत अचल था और अंतड़ियाँ निर्दयी थीं’
  rationale: यह मूल की तीव्र आंतरिक-शारीरिक कल्पना को पर्याप्त रूप से बचाता है, पर हिन्दी में अनचाहे चिकित्सकीय या हास्यास्पद प्रभाव से बचते हुए वक्ता की नैतिक संवेदनहीनता को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘कलेजा अचल’ की असामान्य रूपकात्मकता मूल यूनानी की अभिव्यक्ति को जानबूझकर सुरक्षित रखती है।
