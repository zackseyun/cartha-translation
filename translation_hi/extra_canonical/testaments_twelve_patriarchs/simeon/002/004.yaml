  to: क्योंकि मेरा हृदय कठोर था, मेरा कलेजा अचल था, और मेरे भीतर के अंगों में करुणा नहीं थी।
  rationale: 'The revision retains the draft’s successful renderings of ‘heart’ and ‘liver’ while restoring the plural, bodily force of σπλάγχνα in idiomatic Hindi. No footnote is required: the unusual anatomy is explicit in the translation, and no footnote content or required anchor has been supplied.'
