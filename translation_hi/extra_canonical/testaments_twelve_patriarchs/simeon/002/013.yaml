id: T12P.SIM.2.13
reference: Testament of Simeon 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
translation:
  language: hi
  text: और मेरे बच्चो, मैंने जान लिया कि यूसुफ के कारण मेरे साथ यह हुआ। तब मैंने पश्चाताप करके आँसू बहाए और प्रभु परमेश्वर से प्रार्थना की कि मेरा हाथ पहले जैसा हो जाए और मैं हर प्रकार की अशुद्धता, ईर्ष्या और सारी मूर्खता से दूर रहूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: हे मेरे बच्चो
  rationale: पुत्रवत संबोधन को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περὶ Ἰωσὴφ
  choice: यूसुफ के कारण
  rationale: संदर्भ में περί घटना के कारण या संबंध को दर्शाता है; यहाँ कारणार्थ अधिक उपयुक्त है।
- source_word: μετανοήσας
  choice: पश्चाताप करके
  rationale: यहाँ मन-परिवर्तन के साथ नैतिक खेद और व्यवहार बदलने का भाव है।
- source_word: ἀποκατασταθῇ ἡ χείρ μου
  choice: मेरा हाथ फिर से ठीक हो जाए
  rationale: ἀποκαθίστημι के पुनःस्थापन के भाव को सरल, स्वाभाविक हिन्दी में रखता है।
- source_word: ἀποσχῶ
  choice: मैं ... से दूर रहूँ
  rationale: अपने को रोकने या अलग रखने का आशय सहज हिन्दी में व्यक्त करता है।
- source_word: μολυσμοῦ
  choice: अशुद्धता
  rationale: नैतिक या धार्मिक दूषण की व्यापकता को अनावश्यक रूप से सीमित किए बिना व्यक्त करता है।
- source_word: φθόνου
  choice: ईर्ष्या
  rationale: दूसरे के हित या प्रतिष्ठा से जलने के मूल अर्थ का सामान्य हिन्दी समतुल्य है।
- source_word: ἀφροσύνης
  choice: मूर्खता
  rationale: अविवेकपूर्ण और नैतिक रूप से अनुचित आचरण के व्यापक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: यूसुफ और दंड के बीच संबंध
  choice: यूसुफ के कारण ही मेरे साथ यह हुआ
  alternative: यूसुफ के विषय में यह मेरे साथ हुआ
  rationale: ग्रीक περί में कुछ लचीलापन है, पर प्रसंग वक्ता के यूसुफ के प्रति व्यवहार को उसके कष्ट का कारण बताता है; वाक्य को इससे आगे किसी विशिष्ट दैवी-दंड सिद्धांत में नहीं बदला गया।
- issue: μετανοέω का नैतिक-धार्मिक अर्थ
  choice: पश्चाताप करके
  alternative: मन बदलकर
  rationale: रोने, प्रार्थना करने और आगे अशुद्धता व ईर्ष्या से दूर रहने के संदर्भ में ‘पश्चाताप’ अधिक स्वाभाविक है, जबकि यह पश्चाताप की कोई संप्रदायगत परिभाषा आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन आत्मीय किन्तु गरिमापूर्ण है। वाक्य को सामान्य पाठक के लिए सहज रखा गया है और मूल की कारणात्मकता, पश्चाताप, प्रार्थना तथा नैतिक संयम की क्रमबद्धता सुरक्षित रखी गई है।
