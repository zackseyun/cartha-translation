review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately follows the Greek sequence: recognition regarding Joseph, repentance, weeping, prayer to the Lord God, restoration of the hand, and abstention from defilement, envy, and foolishness. However, “ही” adds an emphatic exclusivity not expressed in the source.'
  naturalness: The Hindi is clear and modern. “मेरा हाथ फिर से ठीक हो जाए” is understandable, but “मेरा हाथ पहले जैसा हो जाए” more directly conveys restoration rather than merely improvement or healing.
  terminology: “पश्चाताप,” “प्रभु परमेश्वर,” “अशुद्धता,” “ईर्ष्या,” and “मूर्खता” are appropriate, non-sectarian renderings in context. “बच्चो” is a natural plural vocative in this register.
  issues:
  - severity: low
    issue: Unwarranted emphasis in “यूसुफ के कारण ही”
    rationale: περὶ Ἰωσὴφ is rendered in the audit trail as “because of Joseph,” but the Greek does not supply an equivalent of “ही.” Omitting it preserves the stated causal sense without added exclusivity.
  - severity: low
    issue: Restoration of the hand is softened as being ‘well again’
    rationale: ἀποκατασταθῇ denotes restoration. “पहले जैसा हो जाए” naturally retains the restoration sense in Hindi.
  revised_text: और मेरे बच्चो, मैंने जान लिया कि यूसुफ के कारण मेरे साथ यह हुआ। तब मैंने पश्चाताप करके आँसू बहाए और प्रभु परमेश्वर से प्रार्थना की कि मेरा हाथ पहले जैसा हो जाए और मैं हर प्रकार की अशुद्धता, ईर्ष्या और सारी मूर्खता से दूर रहूँ।
  revised_footnotes: []
  revision_rationale: 'Two small adjustments improve fidelity: the unsupported emphatic “ही” is removed, and the request for the hand’s restoration is expressed as becoming as it was before. The syntax, register, and ethical terms are otherwise retained.'
