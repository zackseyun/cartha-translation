id: T12P.SIM.2.2
reference: Testament of Simeon 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐγὼ ἐγεννήθην ἐξ Ἰακὼβ *υἱὸς δεύτερος τῷ πατρὶ μου⁵, *καὶ Λία⁶ ἡ μήτηρ μου ἐκάλεσέ με⁷ Συμεώνα⁸, ὅτι⁹ ἤκουσε Κύριος τῆς δεήσεως αὐτῆς¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/002.yaml
  text: I was born from Jacob, the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.
translation:
  language: hi
  text: मैं याकूब से जन्मा, अपने पिता का दूसरा पुत्र। मेरी माता लिआ ने मेरा नाम शिमोन रखा, क्योंकि प्रभु ने उसकी विनती सुन ली थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἐξ Ἰακώβ
  choice: मैं याकूब से जन्मा
  rationale: मूल के जन्म और वंश-संबंध दोनों को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: υἱὸς δεύτερος τῷ πατρὶ μου
  choice: अपने पिता का दूसरा पुत्र
  rationale: इसे पहले कथन के समानाधिकरण के रूप में रखा गया है, जिससे मूल यूनानी की संरचना और अर्थ बने रहते हैं।
- source_word: ἐκάλεσέ με Συμεώνα
  choice: मेरा नाम शिमोन रखा
  rationale: नाम रखने के अर्थ में यूनानी प्रयोग का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: δεήσεως
  choice: विनती
  rationale: यह शब्द प्रार्थनापूर्ण याचना को दर्शाता है; ‘विनती’ सामान्य पाठक के लिए स्पष्ट और धार्मिक प्रसंग के अनुकूल है।
theological_decisions:
- issue: Κύριος के लिए संबोधन
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में सामान्य उपाधि Κύριος है; ‘प्रभु’ स्रोत की अभिव्यक्ति को सुरक्षित रखता है और किसी विशिष्ट हिब्रू आधार-पाठ को अनुमान से नहीं जोड़ता।
- issue: αὐτῆς का निर्देश
  choice: उसकी
  alternative: मेरी माता की
  rationale: मूल सर्वनाम को बनाए रखा गया है; निकटतम स्त्रीलिंग पूर्वपद ‘मेरी माता लिआ’ होने के कारण संदर्भ स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। पहले वाक्य में समानाधिकरणात्मक संरचना मूल यूनानी के संक्षिप्त बल को बनाए रखती है।
