source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καίγε συνετρίβει με *ὁ Κύριος⁷⁸ καὶ ἐκώλυσεν δράσιν⁷⁹ *ἀπʼ ἐμοῦ⁸⁰. *ὅτι ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν ἐπὶ ἡμέρας ἑπτά⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/012.yaml
  text: And the Lord crushed me and held back action from me, for my right hand became half-withered for seven days.
translation:
  language: hi
  text: और सचमुच प्रभु ने मुझे कुचल दिया और मुझसे कार्य करना रोक दिया, क्योंकि मेरा दाहिना हाथ सात दिन तक आधा सूखा रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετρίβει
  choice: कुचल दिया
  rationale: क्रिया का मूल अर्थ तोड़ना या कुचलना है। प्रसंग में यह प्रभु द्वारा कठोर शारीरिक दंड देने को व्यक्त करता है; हिन्दी में स्वाभाविकता के लिए पूर्ण घटना के रूप में रखा गया है।
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: मुझे कुछ करने से रोक दिया
  rationale: शाब्दिक रूप से ‘मुझसे क्रिया/कार्य को रोक दिया’; यह अनिश्चितता बनाए रखता है कि रोकी गई ‘क्रिया’ कोई सामान्य कार्य था या हिंसक कृत्य, और हिन्दी में सहज है।
- source_word: ἡμίξηρος
  choice: आधा सूख गया था
  rationale: संयुक्त विशेषण का निकट अर्थ ‘आधा-सूखा/अर्ध-शुष्क’ है। ‘अधमरा’ जैसी व्याख्यात्मक अभिव्यक्ति से बचते हुए शारीरिक दशा को प्रत्यक्ष रखा गया है।
- source_word: ἐπὶ ἡμέρας ἑπτά
  choice: सात दिनों तक
  rationale: अवधि का स्वाभाविक और सटीक हिन्दी रूप।
theological_decisions:
- issue: प्रभु द्वारा दंड का प्रत्यक्ष कर्तृत्व
  choice: ‘प्रभु ने मुझे कुचल दिया’ में प्रभु को स्पष्ट कर्ता रखा गया
  alternative: ‘मैं प्रभु के द्वारा पीड़ित हुआ’ या दंड को केवल अनुमति के रूप में प्रस्तुत करना
  rationale: यूनानी पाठ में ὁ Κύριος स्पष्ट कर्ता है; धार्मिक तनाव को नरम या अप्रत्यक्ष नहीं किया गया।
- issue: दाहिने हाथ की दशा का अर्थ
  choice: ‘आधा सूख गया’
  alternative: ‘आधा निष्क्रिय’ या ‘अधमरा’
  rationale: मूल ἡμίξηρος की ठोस शारीरिक छवि सुरक्षित रखी गई और उससे आगे किसी चमत्कारी अथवा चिकित्सकीय व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। वाक्य की कठोरता और कारणसूचक संबंध को मूल के अनुरूप बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं; इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
