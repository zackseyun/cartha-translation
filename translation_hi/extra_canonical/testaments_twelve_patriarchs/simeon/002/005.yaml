  text: For courage also is given by the Most High to men in soul and body.
translation:
  language: hi
  text: क्योंकि साहस भी परमप्रधान की ओर से मनुष्यों को आत्मा और शरीर में दिया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνδρεία
  choice: साहस
  rationale: यहाँ संज्ञा का अर्थ साहस या वीरता है; आधुनिक हिन्दी में “साहस” स्वाभाविक और व्यापक है।
- source_word: ὑψίστου
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि का औपचारिक और प्रचलित हिन्दी रूप है।
- source_word: ἐν ψυχαῖς καὶ σώμασιν
  choice: आत्मा और शरीर में
  rationale: यूनानी बहुवचन मनुष्यों के सामूहिक संदर्भ के कारण है; हिन्दी में वितरक अर्थ स्वाभाविक रूप से एकवचन संज्ञाओं से व्यक्त होता है।
theological_decisions:
- issue: साहस का स्रोत और उसके मानवीय आयाम
  choice: “परमप्रधान की ओर से” तथा “आत्मा और शरीर में” को स्पष्ट रूप से बनाए रखा गया।
  alternative: इसे केवल भीतरी आत्मिक शक्ति या केवल शारीरिक वीरता के रूप में समझाना।
  rationale: मूल पाठ साहस को परमप्रधान का दिया हुआ बताता है और आत्मा तथा शरीर दोनों का उल्लेख करता है; अनुवाद इस द्वि-आयामी कथन को बिना व्याख्यात्मक संकुचन के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट वाक्य। “क्योंकि” Ἐπειδὴ के कारणसूचक संबंध को और “भी” καί के योगात्मक बल को व्यक्त करता है।
