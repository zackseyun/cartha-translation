id: T12P.SIM.2.8
reference: Testament of Simeon 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλ᾿ ὁ θεὸς⁴⁰ αὐτοῦ καὶ⁴¹ ὁ θεὸς *τῶν πατέρων⁴² ἡμῶν⁴³ *ἀπέστειλε τὸν ἄγγελον αὐτοῦ καὶ⁴⁴ ἐρρύσατο⁴⁵ αὐτὸν ἐκ τῶν χειρῶν μου⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/008.yaml
  text: But his God and the God of our fathers sent his angel and rescued him from my hands.
translation:
  language: hi
  text: परन्तु उसके परमेश्वर और हमारे पूर्वजों के परमेश्वर ने अपने दूत को भेजा और उसे मेरे हाथों से छुड़ा लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों
  rationale: यह आधुनिक हिन्दी में वंशगत पुरखों का स्वाभाविक और स्पष्ट बोध कराता है; यहाँ πατέρων का आशय केवल निकटवर्ती पिताओं से नहीं है।
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: अपने दूत को
  rationale: ἄγγελος के धार्मिक और कथात्मक अर्थ को बनाए रखते हुए सम्बन्धवाचक αὐτοῦ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐρρύσατο
  choice: छुड़ा लिया
  rationale: क्रिया संकट और शत्रुतापूर्ण अधिकार से बचाने या निकालने का भाव रखती है; इस प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: ἐκ τῶν χειρῶν μου
  choice: मेरे हाथों से
  rationale: यूनानी मुहावरे की सजीवता तथा वक्ता के वश या हिंसक पहुँच से बचाए जाने का भाव सुरक्षित रहता है।
theological_decisions:
- issue: ‘उसके परमेश्वर’ और ‘हमारे पूर्वजों के परमेश्वर’ का संयुक्त वर्णन
  choice: दोनों पदों को ‘और’ से यथावत जोड़ा गया
  alternative: दोनों को मिलाकर केवल ‘हमारे पूर्वजों के परमेश्वर’ कहना
  rationale: मूल पाठ का दोहरा संबोधन उस व्यक्ति के परमेश्वर और सामूहिक पैतृक पहचान—दोनों पर बल देता है; इसे समेटने से अर्थगत बल घट जाता।
- issue: दूत की पहचान
  choice: केवल ‘अपने दूत’
  alternative: ‘अपने स्वर्गदूत’ या किसी विशिष्ट दूत का नाम
  rationale: ἄγγελος स्वयं दूत को सूचित करता है, पर मूल पाठ यहाँ उसकी पहचान या श्रेणी को अधिक निश्चित नहीं करता; इसलिए अतिरिक्त धार्मिक विवरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल कथात्मक शैली रखी गई है। ‘परन्तु’ विरोधसूचक मोड़ को स्पष्ट करता है और ‘पूर्वजों’ सामान्य पाठक के लिए ‘पितरों’ से अधिक सहज है।
