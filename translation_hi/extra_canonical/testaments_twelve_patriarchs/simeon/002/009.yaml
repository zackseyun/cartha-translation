  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। लंबे ग्रीक वाक्य की संबंध-संरचना को डैशों से स्पष्ट किया गया है, और ‘वहाँ आकर’ को ἐλθών के स्पष्ट अनुवाद के रूप में रखा गया है।
