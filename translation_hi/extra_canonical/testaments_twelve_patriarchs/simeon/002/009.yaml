  to: क्योंकि जब मैं अपने झुंडों के लिए लेप लाने शकेम गया था और रूबेन दोतान गया था, जहाँ हमारी आवश्यक वस्तुएँ और हमारा सारा भंडार था, तब मेरे भाई यहूदा ने इश्माएलियों के पास आकर उसे बेच दिया।
