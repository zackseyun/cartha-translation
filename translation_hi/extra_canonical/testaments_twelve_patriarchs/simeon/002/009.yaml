base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/009.yaml
  text: For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.
translation:
  language: hi
  text: क्योंकि जब मैं अपने झुंडों के लिए लेप लाने शकेम गया था और रूबेन दोतान गया था, जहाँ हमारी आवश्यक वस्तुएँ और हमारा सारा भंडार था, तब मेरे भाई यहूदा ने इश्माएलियों के पास आकर उसे बेच दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλειμμα
  choice: मरहम
  rationale: यह शब्द लेप या मलने योग्य औषधीय पदार्थ को दर्शाता है; आधुनिक हिन्दी में ‘मरहम’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ποιμνίοις
  choice: झुंडों
  rationale: ग्रीक बहुवचन का सीधा और सहज हिन्दी रूप; पशुओं की जाति स्रोत में निर्दिष्ट नहीं है।
- source_word: τὰ ἐγχρῄζοντα ἡμῖν
  choice: हमारी आवश्यक वस्तुएँ
  rationale: अर्थ है वे चीज़ें जिनकी हमें आवश्यकता थी; इसे सामान्य रखकर स्रोत की व्यापकता सुरक्षित की गई है।
- source_word: πᾶσα ἡ ἀπόθεσις
  choice: हमारा सारा भंडार
  rationale: ἀπόθεσις यहाँ संचित सामग्री या भंडार के अर्थ में है।
- source_word: τοῖς Ἰσμαηλίταις
  choice: इश्माएलियों के हाथ
  rationale: सम्प्रदान कारक बिक्री के प्राप्तकर्ताओं को दर्शाता है; हिन्दी मुहावरे में ‘के हाथ बेच दिया’ स्वाभाविक है।
