review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the division of travel—Simeon to Shechem and Reuben to Dothan—and correctly locates the supplies and stores at Dothan. However, ἄλειμμα is a topical ointment/anointing substance, not necessarily a medicinal ‘मरहम’. Also, the participle ἐλθών modifies Judah and is more directly represented as his coming to the Ishmaelites, rather than the vague ‘वहाँ आकर’.
  naturalness: The revised sentence is natural modern standard Hindi while retaining the source sentence’s narrative structure and its explicit travel details.
  terminology: ‘लेप’ is appropriately broad for ἄλειμμα and does not add a specifically medicinal sense. ‘झुंडों’, ‘आवश्यक वस्तुएँ’, ‘भंडार’, and ‘इश्माएलियों’ are suitable. ‘बेच दिया’ faithfully renders the sale without interpretive expansion.
  issues:
  - severity: medium
    issue: ‘मरहम’ narrows ἄλειμμα to a medicinal salve.
    rationale: The Greek denotes ointment or a substance for applying/anointing and does not itself require a therapeutic meaning.
  - severity: medium
    issue: ‘वहाँ आकर’ leaves Judah’s destination in ἐλθών unclear.
    rationale: The Greek associates Judah’s coming with ‘the Ishmaelites’; ‘इश्माएलियों के पास आकर’ represents this more explicitly without adding interpretation.
  revised_text: क्योंकि जब मैं अपने झुंडों के लिए लेप लाने शकेम गया था और रूबेन दोतान गया था, जहाँ हमारी आवश्यक वस्तुएँ और हमारा सारा भंडार था, तब मेरे भाई यहूदा ने इश्माएलियों के पास आकर उसे बेच दिया।
  revised_footnotes: []
  revision_rationale: The revision replaces the overly medicinal ‘मरहम’ with the broader ‘लेप’ and makes explicit that Judah came to the Ishmaelites, as indicated by the Greek participial construction. No footnotes are required because the translation can state the source meaning directly and no disputed ambiguity is being resolved.
