revisions:
- from: क्योंकि मैं जान गया था कि मैंने अपने भाई यूसुफ से ईर्ष्या करके प्रभु और अपने पिता याकूब के सामने एक बुरे काम की कल्पना की थी।
  to: क्योंकि मैं जान गया था कि मैंने प्रभु और अपने पिता याकूब के सामने अपने भाई यूसुफ के विषय में एक बुरी बात मन में सोची थी, उससे ईर्ष्या करते हुए।
  rationale: The revision explicitly preserves Joseph as the subject concerning whom the evil thought was formed and retains envy as the accompanying participial motive or circumstance. It also uses a more idiomatic Hindi expression for an evil thought that was conceived but not necessarily enacted.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:52:56Z'
review_pass:
  verdict: revise
  source_fidelity: Draft correctly preserves the past realization, the evil intention as merely conceived rather than carried out, the ‘before’ relationship to both the Lord and Jacob, and Simeon’s envy. However, it absorbs διὰ Ἰωσὴφ (‘concerning Joseph’) into the envy phrase, so the stated object of the evil thought is no longer explicit.
  naturalness: ‘एक बुरे काम की कल्पना की थी’ is understandable but somewhat awkward in modern Hindi and can sound like imagining an already defined act. ‘एक बुरी बात मन में सोची थी’ is more idiomatic while retaining the unexecuted inward thought.
  terminology: ‘प्रभु,’ ‘पिता याकूब,’ ‘यूसुफ,’ and ‘ईर्ष्या’ are appropriate, standard choices. No doctrinally loaded wording is introduced.
  issues:
  - severity: medium
    issue: The phrase ‘अपने भाई यूसुफ से ईर्ष्या करके’ does not explicitly render διὰ Ἰωσὴφ τὸν ἀδελφόν μου.
    rationale: The Greek and the English audit trail identify Joseph as the matter/concerning whom the evil thought was conceived, followed by the participial description ‘being envious of him.’ The Hindi should retain both relations rather than merge them.
  - severity: low
    issue: ‘एक बुरे काम की कल्पना की थी’ is less natural and slightly overconcrete for πονηρὸν πρᾶγμα ἐνεθυμήθην.
    rationale: The source describes an evil matter entertained in thought, not an act performed. A phrase referring to an evil thing thought in the mind better fits both the sense and Hindi idiom.
  revised_text: क्योंकि मैं जान गया था कि मैंने प्रभु और अपने पिता याकूब के सामने अपने भाई यूसुफ के विषय में एक बुरी बात मन में सोची थी, उससे ईर्ष्या करते हुए।
  revised_footnotes: []
  revision_rationale: The revision explicitly preserves Joseph as the subject concerning whom the evil thought was formed and retains envy as the accompanying participial motive or circumstance. It also uses a more idiomatic Hindi expression for an evil thought that was conceived but not necessarily enacted.
