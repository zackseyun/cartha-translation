id: T12P.SIM.2.14
reference: Testament of Simeon 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἔγνων⁹⁴ γὰρ ὅτι πονηρὸν πρᾶγμα ἐνεθυμήθην ἐνώπιον κυρίου⁹⁵ καὶ⁹⁶ *Ἰακὼβ τοῦ πατρός μου⁹⁷ *διὰ Ἰωσὴφ⁹⁸ *τὸν ἀδελφόν μου, φθονήσας αὐτῷ⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/014.yaml
  text: For I knew that I had conceived an evil deed before the Lord and Jacob my father concerning Joseph my brother, being envious of him.
translation:
  language: hi
  text: क्योंकि मैं जान गया था कि मैंने प्रभु और अपने पिता याकूब के सामने अपने भाई यूसुफ के विषय में एक बुरी बात मन में सोची थी, उससे ईर्ष्या करते हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: मैं जान गया था
  rationale: क्रिया के पूर्ण हुए बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πονηρὸν πρᾶγμα
  choice: एक बुरे काम
  rationale: πρᾶγμα को केवल अमूर्त ‘बात’ नहीं, बल्कि सोचे गए दुष्कर्म के रूप में व्यक्त करता है।
- source_word: ἐνεθυμήθην
  choice: कल्पना की थी
  rationale: मन में किसी काम का विचार करने या उसे ठानने का भाव रखता है, बिना यह कहे कि काम वास्तव में किया गया।
- source_word: ἐνώπιον κυρίου καὶ Ἰακὼβ τοῦ πατρός μου
  choice: प्रभु और अपने पिता याकूब के सामने
  rationale: ἐνώπιον का सीधा संबंध दोनों पदों से बनाए रखता है और मूल में अनुपस्थित ‘विरुद्ध’ नहीं जोड़ता।
- source_word: διὰ Ἰωσὴφ τὸν ἀδελφόν μου
  choice: अपने भाई यूसुफ से ... करके
  rationale: διά के कारण-संबंध को अगले कृदंत के साथ स्वाभाविक हिन्दी वाक्य में समाहित करता है।
- source_word: φθονήσας αὐτῷ
  choice: उससे ईर्ष्या करके
  rationale: दत्तिव αὐτῷ के साथ φθονέω का सामान्य अर्थ ‘उससे ईर्ष्या करना’ है; कृदंत मुख्य विचार की परिस्थिति या कारण बताता है।
theological_decisions:
- issue: क्या याकूब के प्रति अपराध का अर्थ स्पष्ट रूप से जोड़ा जाए
  choice: ‘प्रभु और अपने पिता याकूब के सामने’
  alternative: ‘प्रभु के सामने और अपने पिता याकूब के विरुद्ध’
  rationale: यूनानी पाठ में ‘विरुद्ध’ के लिए अलग शब्द नहीं है; इसलिए नैतिक संबंध को अधिक स्पष्ट बनाकर मूल की संरचनात्मक अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कल्पना की थी’ मन में दुष्कर्म सोचने का भाव देता है, जबकि उसे संपन्न कार्य नहीं बनाता।
