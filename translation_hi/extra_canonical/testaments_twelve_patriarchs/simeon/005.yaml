  revised_text: '5


    1 इसलिए यूसुफ शरीर से सुन्दर और देखने में मनोहर था, क्योंकि उसमें कोई बुराई नहीं बसी थी; क्योंकि चेहरा मन की उथल-पुथल प्रकट करता है।


    2 अब, मेरे बच्चो, प्रभु के सामने अपने हृदयों को भला बनाओ और लोगों के सामने अपने मार्ग सीधे करो; तब तुम प्रभु और लोगों के सामने कृपा पाओगे।


