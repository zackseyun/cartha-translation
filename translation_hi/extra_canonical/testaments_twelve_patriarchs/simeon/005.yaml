    5 पर वे लेवी का सामना नहीं कर सकेंगे, क्योंकि वह प्रभु का युद्ध लड़ेगा और तुम्हारी सारी सेना को हरा देगा।


    6 वे गिने-चुने रह जाएँगे, लेवी और यहूदा में बँटे हुए; और तुममें से कोई भी शासन के लिए नहीं होगा, ठीक वैसे ही जैसे हमारे पिता ने भी अपनी आशीषों में भविष्यवाणी की थी।'
