  text: V. Διὰ τοῦτο Ἰωσὴφ ἦν¹ ὡραῖος *τῷ εἴδει², καὶ καλὸς *τῇ ὄψει, ὅτι³ οὐκ ἐνοίκησεν⁴ *ἐν αὐτῷ⁵ οὐδὲν⁶ πονηρόν· ἐκ γὰρ⁷ τῆς ταραχῆς τοῦ πνεύματος τὸ πρόσωπον δηλοῖ⁸. 2. Καὶ νῦν, τέκνα μου⁹, Ἀγαθύνατε τὰς καρδίας ὑμῶν¹⁰ ἐνώπιον Κυρίου¹¹, καὶ¹² εὐθύνατε τὰς ὁδοὺς ὑμῶν ἐνώπιον τῶν¹³ ἀνθρώπων¹⁴ καὶ ἔσεσθε εὑρίσκοντες χάριν *ἐνώπιον Κυρίου καὶ ἀνθρώπων¹⁵. 3. *Φυλάξασθε οὖν¹⁶ *ἀπὸ τῆς πορνείας¹⁷, ὅτι *ἡ πορνεία¹⁸ μήτηρ¹⁹ ἐστὶ²⁰ τῶν κακῶν, χωρίζουσα²¹ *ἀπὸ τοῦ²² θεοῦ καὶ προσεγγίζουσα²³ τῷ Βελίαρ²⁴. 4. Ἑώρακα γὰρ ἐγὼ²⁵ ἐν χαρακτῆρι γραφῆς²⁶ Ἐνώχ, ὅτι οἱ²⁷ υἱοὶ ὑμῶν²⁸ *ἐν πορνείᾳ²⁹ φθαρήσονται, καὶ *τοῖς υἱοῖς Λευὶ³⁰ *ἀδικήσουσιν ἐν ῥομφαίᾳ³¹. 5. Ἀλλ' οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι³², ὅτι *πόλεμον Κυρίου πολεμήσει³³ καὶ νικήσει ⌜πᾶσαν⌝³⁴ παρεμβολὴν³⁵ ὑμῶν. 6. Καὶ ἔσονται ὀλιγοστοί³⁶ ἐπιμεριζόμενοι³⁷ *ἐν τῷ³⁸ Λευὶ καὶ *ἐν τῷ³⁹ Ἰούδᾳ⁴⁰ καὶ οὐκ⁴¹ ἔσται ἐξ ὑμῶν *τις εἰς ἡγεμονίαν⁴² καθὼς καὶ ὁ πατὴρ ἡμῶν⁴³ προεφήτευσεν⁴⁴ *ἐν ταῖς⁴⁵ εὐλογίαις⁴⁶.
