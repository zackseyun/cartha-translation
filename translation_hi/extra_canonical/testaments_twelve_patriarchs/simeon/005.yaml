  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005.yaml
  text: 'Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.


    And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will be finding favor before the Lord and men.


    Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.


    For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and will defeat your whole host.


    And they will be few in number, being divided in Levi and in Judah, and none from among you will be for leadership, just as our father also prophesied in his blessings.'
translation:
  language: hi
  text: '5


    1 इसलिए यूसुफ शरीर से सुन्दर और देखने में मनोहर था, क्योंकि उसमें कोई बुराई नहीं बसी थी; क्योंकि चेहरा मन की उथल-पुथल प्रकट करता है।


    2 अब, मेरे बच्चो, प्रभु के सामने अपने हृदयों को भला बनाओ और लोगों के सामने अपने मार्ग सीधे करो; तब तुम प्रभु और लोगों के सामने कृपा पाओगे।


    3 इसलिए अपने आपको यौन अनैतिकता से बचाए रखो, क्योंकि यौन अनैतिकता बुराइयों की जननी है; वह परमेश्वर से अलग करती और बेलियार[a] के निकट ले जाती है।


    4 क्योंकि मैंने हनोक के लेख में देखा है कि तुम्हारे पुत्र यौन अनैतिकता में भ्रष्ट हो जाएँगे और लेवी के पुत्रों पर तलवार से अत्याचार करेंगे।


    5 पर वे लेवी का सामना नहीं कर सकेंगे, क्योंकि वह प्रभु का युद्ध लड़ेगा और तुम्हारी सारी सेना को हरा देगा।


    6 वे गिने-चुने रह जाएँगे, लेवी और यहूदा में बँटे हुए; और तुममें से कोई भी शासन के लिए नहीं होगा, ठीक वैसे ही जैसे हमारे पिता ने भी अपनी आशीषों में भविष्यवाणी की थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेलियार’ बुराई से संबद्ध एक प्राचीन नाम या उपाधि है; इसे प्रायः शैतानी विरोधी सत्ता के रूप में समझा जाता है।
    reason: दुर्लभ नाम की संक्षिप्त पहचान देता है, पर मुख्य पाठ में उसकी प्रकृति के बारे में कोई व्याख्यात्मक निष्कर्ष नहीं थोपता।
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει, καὶ καλὸς τῇ ὄψει
  choice: डील-डौल सुन्दर और रूप मनोहर
  rationale: εἶδος और ὄψις के निकटार्थक किंतु अलग पहलुओं—शारीरिक बनावट और दृश्य रूप—को स्वाभाविक हिन्दी में अलग रखा गया है।
- source_word: ταραχῆς τοῦ πνεύματος
  choice: मन की उथल-पुथल
  rationale: यहाँ πνεῦμα आंतरिक मनोभाव या अंतःस्थिति को सूचित करता है; ‘आत्मा’ संभावित धार्मिक अर्थ को अनावश्यक रूप से प्रमुख कर सकता था।
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: अपने हृदयों को भला बनाओ
  rationale: आज्ञार्थक क्रिया और नैतिक ‘भलाई’ दोनों को निकटता से सुरक्षित रखा गया है।
- source_word: πορνεία
  choice: व्यभिचार
  rationale: प्राचीन धार्मिक-नैतिक संदर्भ में अवैध या अनैतिक यौन आचरण का व्यापक, परिचित हिन्दी पद चुना गया है।
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: हनोक के लेख में
  rationale: ग्रीक पदबंध का अभिप्राय हनोक से संबद्ध लिखित अभिलेख/ग्रंथ है; हिन्दी में अनावश्यक तकनीकीपन से बचते हुए अर्थ दिया गया है।
- source_word: ἀδικήσουσιν
  choice: अन्याय करेंगे
  rationale: क्रिया की व्यापक नैतिक धारणा को सुरक्षित रखा गया है; संदर्भ में तलवार हिंसा का साधन बताती है।
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: प्रभु का युद्ध लड़ेगा
  rationale: संज्ञा और सजातीय क्रिया की सामी शैली को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: παρεμβολὴν
  choice: सेना
  rationale: सैन्य प्रसंग में इसका अर्थ छावनी, दल या सेना हो सकता है; ‘सेना’ यहाँ सबसे स्पष्ट और स्वाभाविक है।
- source_word: εἰς ἡγεμονίαν
  choice: नेतृत्व के लिए
  rationale: पदबंध नेतृत्व या शासन की स्थिति के लिए योग्यता/नियुक्ति दर्शाता है; अस्पष्टता को किसी खास राजकीय पद में सीमित नहीं किया गया।
theological_decisions:
- issue: चेहरे और आंतरिक दशा का संबंध
  choice: ‘मन की उथल-पुथल चेहरे से प्रकट हो जाती है’
  alternative: ‘चेहरा आत्मा की व्याकुलता प्रकट करता है’
  rationale: पाठ का नैतिक-मानसिक दावा यथावत रखा गया, पर πνεῦμα को अनिवार्यतः किसी विशिष्ट आत्मा-सिद्धांत से नहीं जोड़ा गया।
- issue: व्यभिचार का कर्ता और परमेश्वर से अलगाव
  choice: ‘वह मनुष्य को परमेश्वर से अलग करके बेलियार के निकट ले जाता है’
  alternative: ‘वह परमेश्वर से अलग होता और बेलियार के निकट जाता है’
  rationale: ग्रीक स्त्रीलिंग कृदंत πορνεία से व्याकरणतः जुड़े हैं, पर अर्थगत कर्म अप्रकट है। हिन्दी में स्पष्टता के लिए सामान्य ‘मनुष्य को’ जोड़ा गया, बिना किसी विशिष्ट उद्धारशास्त्रीय निष्कर्ष के।
- issue: ‘प्रभु का युद्ध’ का स्वामित्व
  choice: ‘वह प्रभु का युद्ध लड़ेगा’
  alternative: ‘वह प्रभु के लिए युद्ध लड़ेगा’
  rationale: सम्बन्धकारक Κυρίου को जानबूझकर खुला रखा गया है—यह प्रभु का अपना युद्ध या प्रभु की ओर से लड़ा गया युद्ध दोनों संकेत कर सकता है।
- issue: लेवी और यहूदा में बाँटे जाने का आशय
  choice: ‘जो लेवी और यहूदा में बाँट दिए जाएँगे’
  alternative: ‘जो लेवी और यहूदा के बीच बँटे होंगे’
  rationale: ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ की कठिन और संभावित वंशीय/राजनीतिक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के निकट रूप में रखा गया है।
