base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009.yaml
  text: And the sons of Simeon wept for their father[c][b][a]. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: hi
  text: और शिमोन के पुत्र अपने पिता के लिए रोए। और वे मिस्र में उस दिन तक रहे, जिस दिन मूसा के हाथ से उनका प्रस्थान हुआ।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उनका निर्गमन हुआ, उस दिन तक।”
    reason: lexical_alternative
  - marker: b
    text: “मूसा के हाथ से” एक बाइबलीय मुहावरा है, जिसका अर्थ “मूसा के द्वारा” या “मूसा की अगुवाई में” है।
    reason: cultural_note
  - marker: c
    text: 'स्रोत में इसके बाद की पंक्ति सीधे अगली रचना के शीर्षक में चली जाती है: “याकूब और लिआ के तीसरे पुत्र लेवी का वसीयतनामा।” वह शिमोन 9 का भाग नहीं है।'
    reason: textual_variant
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: रोए
  rationale: κλαίω का यह रूप रोने या विलाप करने को व्यक्त करता है। ‘रोए’ सहज और गरिमापूर्ण है तथा औपचारिक शोक-विधि का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: υἱοὶ Συμεὼν
  choice: शिमोन के पुत्र
  rationale: वंशावली और कुलपितृ-संबंधी प्रसंग में υἱοί का विशिष्ट अर्थ ‘पुत्र’ है; व्यापक ‘सन्तान’ यहाँ कम सटीक होता।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र में
  rationale: यद्यपि εἰς प्रायः दिशा (‘में/की ओर’) बताता है, ἦσαν के साथ यहाँ इसका आशय मिस्र में बने रहने की अवस्था से है।
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: उस दिन तक ... उनका प्रस्थान
  rationale: ἐξόδου सामान्य संज्ञा के रूप में ‘प्रस्थान’ या ‘निकलना’ हो सकता है। ‘प्रस्थान’ मूल की सामान्य संज्ञा को बनाए रखता है, जबकि मूसा का उल्लेख ऐतिहासिक निर्गमन की ओर संकेत स्पष्ट करता है।
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: मूसा के हाथ से
  rationale: यह सामर्थ्य, माध्यम या अगुवाई बताने वाला बाइबलीय मुहावरा है। शाब्दिक रूप बनाए रखने से मूल की शास्त्रीय शैली सुरक्षित रहती है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ἐξόδου को सामान्य ‘प्रस्थान’ मानना या विशिष्ट ऐतिहासिक ‘निर्गमन’ के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में सामान्य संज्ञा ‘प्रस्थान’
  alternative: ‘निर्गमन’ अथवा ‘मिस्र से निर्गमन’
  rationale: यूनानी पाठ में यह सामान्य संज्ञा है, किसी पुस्तक के शीर्षक के रूप में चिह्नित नहीं। मूसा का उल्लेख ऐतिहासिक घटना का संकेत बनाए रखता है, इसलिए मुख्य पाठ स्रोत से अधिक विशिष्ट नहीं बनाया गया।
- issue: ἐν χειρὶ Μωϋσῆ के मुहावरे का अनुवाद
  choice: ‘मूसा के हाथ से’ मुहावरे को बनाए रखा
  alternative: ‘मूसा के द्वारा’ अथवा ‘मूसा की अगुवाई में’
  rationale: अधिक व्याख्यात्मक विकल्प अर्थ को सहज बना सकते हैं, पर ‘हाथ से’ मूल की बाइबलीय अभिव्यक्ति और उसकी एजेंसी-संबंधी अर्थ-व्याप्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वसीयतनामाई शैली रखी गई है। ‘और’ से दोनों वाक्यों का आरम्भ यूनानी καὶ की कथात्मक लय को दर्शाता है। ‘थे’ को ἦσαν के निकट रखा गया है; अधिक व्याख्यात्मक ‘रहे’ से बचा गया।
