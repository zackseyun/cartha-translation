    **3** क्योंकि मिस्री यूसुफ की हड्डियों को राजाओं की कब्रों में सुरक्षित रखे हुए थे।[b]


    **4** जादू-मंत्र करने वाले उनसे कहते थे कि जब यूसुफ की हड्डियाँ बाहर जाएँगी,[c] तब सारे देश पर अंधकार और घोर अँधेरा छा जाएगा और मिस्रियों पर बड़ी विपत्ति आएगी—यहाँ तक कि दीपक लेकर भी कोई अपने भाई को पहचान नहीं पाएगा।'
