  revised_text: '**शिमोन का वसीयतनामा 8**


    **1** जब शिमोन अपने पुत्रों को आज्ञाएँ दे चुका, तब वह अपने पुरखाओं के साथ सो गया। वह एक सौ बीस वर्ष का था।


