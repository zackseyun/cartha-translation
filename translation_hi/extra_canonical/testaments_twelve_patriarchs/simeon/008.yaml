  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पुरखाओं के साथ सो गया’ और ‘अंधकार और घोर अँधेरा’ जैसे पद मूल की बाइबलीय-साहित्यिक बनावट बनाए रखते हैं। कठिन यूनानी वाक्यांशों को मुख्य पाठ में कृत्रिम रूप से स्पष्ट नहीं किया गया; वास्तविक अनिश्चितता पादटिप्पणियों में दी गई है। पद-संख्या जोड़ी गई है और प्रत्येक पादटिप्पणी-चिह्न [a], [b], [c] मुख्य पाठ में उपस्थित है।
