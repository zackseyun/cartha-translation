  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008.yaml
  text: 'And when Simeon had finished commanding his sons[a], he fell asleep with his fathers, being one hundred and twenty years old.


    And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly during a war of the Egyptians.


    For the Egyptians were keeping the bones of Joseph in the tombs of the kings, so as to bring him up. For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague for the Egyptians[c][b], so that even with a lamp each man would not recognize his brother.'
translation:
  language: hi
  text: '**शिमोन का वसीयतनामा 8**


    **1** जब शिमोन अपने पुत्रों को आज्ञाएँ दे चुका, तब वह अपने पुरखाओं के साथ सो गया। वह एक सौ बीस वर्ष का था।


    **2** उन्होंने उसे लकड़ी के एक ताबूत में रखा, ताकि उसकी हड्डियाँ हेब्रोन ले जाई जा सकें। मिस्रियों के युद्ध के समय वे उसकी हड्डियाँ गुप्त रूप से वहाँ ले गए।[a]


    **3** क्योंकि मिस्री यूसुफ की हड्डियों को राजाओं की कब्रों में सुरक्षित रखे हुए थे।[b]


    **4** जादू-मंत्र करने वाले उनसे कहते थे कि जब यूसुफ की हड्डियाँ बाहर जाएँगी,[c] तब सारे देश पर अंधकार और घोर अँधेरा छा जाएगा और मिस्रियों पर बड़ी विपत्ति आएगी—यहाँ तक कि दीपक लेकर भी कोई अपने भाई को पहचान नहीं पाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। इसका अर्थ ‘मिस्र के किसी युद्ध के समय गुप्त रूप से’ अथवा ‘मिस्रियों के बीच युद्ध के समय गुप्त रूप से’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: कुछ पाठ-साक्ष्यों में ‘कब्रों’ के स्थान पर ‘भंडार-कोठरियाँ’ है; तब अर्थ होगा, ‘मिस्री यूसुफ की हड्डियों को राजाओं की भंडार-कोठरियों में सुरक्षित रखे हुए थे।’
    reason: textual_variant
  - marker: c
    text: यूसुफ की हड्डियों को कनान ले जाने के विषय में उत्पत्ति 50:25 और निर्गमन 13:19 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: συνετέλεσεν … ἐντελλόμενος
  choice: आज्ञाएँ दे चुका
  rationale: यह पदबंध शिमोन द्वारा अपने अंतिम, अधिकारपूर्ण निर्देश पूरे करने को व्यक्त करता है। यह सहज हिन्दी में पूर्णता और पैतृक अधिकार—दोनों बनाए रखता है।
- source_word: ἐκοιμήθη μετὰ τῶν πατέρων αὐτοῦ
  choice: अपने पुरखाओं के साथ सो गया
  rationale: मृत्यु के लिए प्रयुक्त पारंपरिक रूपक और पूर्वजों से जुड़ा बाइबलीय सूत्र दोनों सुरक्षित रखे गए हैं; इसे सीधे ‘मर गया’ कहकर सपाट नहीं किया गया।
- source_word: θήκῃ ξυλίνῃ
  choice: लकड़ी के एक ताबूत में
  rationale: अंत्येष्टि के प्रसंग में लकड़ी के पात्र के लिए ‘ताबूत’ सबसे स्पष्ट और स्वाभाविक आधुनिक हिन्दी शब्द है।
- source_word: τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ
  choice: ताकि उसकी हड्डियाँ हेब्रोन ले जाई जा सकें
  rationale: ἀναγαγεῖν में स्थानांतरण की दिशा निहित है; हिन्दी में गंतव्य ‘हेब्रोन’ के साथ ‘ले जाई जा सकें’ अधिक स्वाभाविक है और आशय को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  choice: मिस्रियों के युद्ध के समय … छिपाकर
  rationale: संकुचित यूनानी वाक्यांश के दोनों तत्व—युद्ध का समय और गुप्त रूप से ले जाना—सुरक्षित हैं। युद्ध किसके विरुद्ध या किनके बीच था, इसे मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: ἐφύλαττον
  choice: सुरक्षित रखे हुए थे
  rationale: अपूर्णकाल निरंतर अभिरक्षा या रोके रखने का भाव देता है। यह अनुवाद केवल ‘रखना’ और सक्रिय ‘पहरा देना’ के बीच का व्यापक अर्थ बनाए रखता है।
- source_word: μνήμασι τῶν βασιλέων
  choice: राजाओं की कब्रों में
  rationale: प्राप्त यूनानी पाठ का सीधा समाधिस्थलीय अर्थ लिया गया है; ‘भंडार-कोठरियों’ वाला पाठांतर पादटिप्पणी में सुरक्षित है।
- source_word: ἐπαοιδοί
  choice: जादू-मंत्र करने वाले
  rationale: शब्द का संबंध मंत्रोच्चार और जादुई अनुष्ठान करने वालों से है। यह सामान्य पाठकों के लिए ‘मंत्रसाधक’ जैसे अपेक्षाकृत दुर्लभ शब्द से अधिक स्पष्ट है।
- source_word: σκότος καὶ γνόφος
  choice: अंधकार और घोर अँधेरा
  rationale: दो समानार्थी पदों की बलात्मक जोड़ी को बनाए रखते हुए स्वाभाविक हिन्दी अभिव्यक्ति दी गई है।
- source_word: πληγὴ μεγάλη
  choice: बड़ी विपत्ति
  rationale: πληγή का अर्थ प्रहार, प्रकोप या सामूहिक आपदा हो सकता है। ‘विपत्ति’ इस संदर्भ में व्यापकता बनाए रखती है और इसे अनिवार्य रूप से बीमारी या महामारी तक सीमित नहीं करती।
theological_decisions:
- issue: मृत्यु के लिए ἐκοιμήθη का रूपक
  choice: सो गया
  alternative: मर गया; विश्राम को प्राप्त हुआ
  rationale: मूल पाठ मृत्यु को नींद के पारंपरिक रूपक में व्यक्त करता है। इसे बनाए रखने से साहित्यिक और धर्मवैचारिक भार सुरक्षित रहता है, बिना पुनरुत्थान या मृत्यु की अवस्था के विषय में कोई अतिरिक्त निष्कर्ष जोड़े।
- issue: यूसुफ की हड्डियों को मिस्रियों द्वारा रोके रखने का कठिन पाठ
  choice: मिस्रियों ने हड्डियाँ राजाओं की कब्रों में सुरक्षित रखीं और जादू-मंत्र करने वालों की चेतावनी इसका कारण बताती है
  alternative: ‘कब्रों’ के स्थान पर ‘राजाओं की भंडार-कोठरियों’; कठिन वाक्यांश का ऐसा पुनर्निर्माण जिसमें हड्डियों को ऊपर ले जाने का अतिरिक्त उद्देश्य हो
  rationale: मुख्य अनुवाद प्रदत्त यूनानी पाठ के सर्वाधिक सीधे और सुसंगत अर्थ का अनुसरण करता है। पाठांतर को छिपाने या निर्गमन-वृत्तांत के साथ चुपचाप सामंजस्य बैठाने के बजाय पादटिप्पणी में दर्ज किया गया है।
- issue: यूसुफ की हड्डियों के बाहर जाने पर आने वाली πληγή
  choice: बड़ी विपत्ति
  alternative: बड़ी महामारी; बड़ा प्रहार; भयंकर प्रकोप
  rationale: यह चयन दैवी न्याय जैसी संभावित प्रतिध्वनि को नकारता नहीं, पर मूल शब्द की व्यापकता को किसी एक विशिष्ट प्रकार की आपदा में सीमित भी नहीं करता।
