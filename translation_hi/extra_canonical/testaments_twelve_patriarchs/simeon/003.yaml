  text: And now[a], my children, hear me, and guard yourselves from the spirit of deceit and envy. For envy masters a man's whole mind, and does not allow him either to eat or to drink or to do anything good. But it is always urging him to kill the one envied; and while the one envied is always flourishing, the one who envies wastes away[b]. For two years, then, in the fear of the Lord I afflicted my soul with fasting, and I learned that release from envy comes through the fear of God. For if anyone flees for refuge to the Lord, the evil spirit runs away from him, and his mind becomes light. And from then on he has compassion on the one envied, and forgives those who love him[c], and so he ceases from envy.
translation:
  language: hi
  text: 3:1 और अब, मेरे बच्चो, मेरी सुनो और अपने आपको भटकाव और डाह की आत्मा[a] से बचाए रखो। 2 क्योंकि डाह मनुष्य के पूरे मन पर अधिकार कर लेती है और उसे न तो खाने देती है, न पीने, और न कोई भला काम करने देती है। 3 बल्कि वह उसे सदा उस व्यक्ति को मार डालने के लिए उकसाती रहती है जिससे डाह की जाती है। जिस व्यक्ति से डाह की जाती है वह तो सदा फलता-फूलता है, पर डाह करने वाला मुरझाता जाता है[b]। 4 इसलिए दो वर्ष तक मैंने प्रभु के भय में उपवास करके अपने प्राण को कष्ट दिया, और मैंने जाना कि परमेश्वर के भय के द्वारा डाह से छुटकारा मिलता है। 5 क्योंकि यदि कोई प्रभु की शरण में भागकर आए, तो वह दुष्ट आत्मा उससे दूर भाग जाती है और उसका मन हल्का हो जाता है। 6 इसके बाद वह उस व्यक्ति के प्रति सहानुभूति रखने लगता है जिससे डाह की जाती है, और उससे प्रेम करने वालों को क्षमा करता है[c]; इस प्रकार वह डाह करना छोड़ देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भटकाव की आत्मा” का अर्थ “भ्रम की आत्मा” या “धोखे की आत्मा” भी हो सकता है। यूनानी πλάνη में सत्य से भटकने और धोखे—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिससे डाह की जाती है ... डाह करने वाला।” यूनानी में डाह के निशाने पर आए व्यक्ति और डाह करने वाले के बीच तीखा विरोध है।
    reason: lexical_alternative
  - marker: c
    text: “उससे प्रेम करने वालों” में “उससे” का संकेत या तो उस व्यक्ति की ओर हो सकता है जिससे पहले डाह की जाती थी, या उस व्यक्ति की ओर जो डाह से चंगा हो रहा है। यूनानी सर्वनाम संक्षिप्त है और संदर्भ में उसका संकेत स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: φυλάξασθε
  choice: अपने आप को ... से बचाए रखो
  rationale: मध्यवाच्य आज्ञार्थक का आत्मवाचक बल बनाए रखते हुए यह पितृ-सुलभ चेतावनी और निरंतर नैतिक सतर्कता दोनों व्यक्त करता है।
- source_word: πνεῦμα τῆς πλάνης
  choice: भटकावे ... की आत्मा
  rationale: πλάνη सत्य से भटकने, भ्रम और धोखे का अर्थ दे सकता है। “भटकावा” इस अर्थ-क्षेत्र को किसी एक व्याख्या तक सीमित नहीं करता; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: φθόνος
  choice: डाह
  rationale: यह दूसरे की भलाई या उन्नति से उत्पन्न विरोधी जलन को व्यक्त करता है और पूरे अध्याय में यूनानी पद की एकरूपता बनाए रखता है।
- source_word: κυριεύει πάσης τῆς διανοίας
  choice: मनुष्य के पूरे मन पर अधिकार कर लेती है
  rationale: κυριεύει के प्रभुत्वकारी बल और διάνοια के विचारशील मन—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑποβάλλει ἀνελεῖν
  choice: मार डालने के लिए उकसाती रहती है
  rationale: ὑποβάλλει निरंतर भीतरी उकसावे को और ἀνελεῖν हिंसक विनाश या हत्या को व्यक्त करता है।
- source_word: ἀνθεῖ ... μαραίνεται
  choice: फलता-फूलता है ... मुरझाता जाता है
  rationale: यह मूल के खिलने और मुरझाने वाले रूपक तथा दोनों व्यक्तियों के तीखे विरोध को सुरक्षित रखता है।
- source_word: ἐκάκωσα τὴν ψυχήν μου ἐν νηστείᾳ
  choice: उपवास करके अपने प्राण को कष्ट दिया
  rationale: यह तपश्चर्यात्मक अभिव्यक्ति की गंभीरता और उपवास के साधनात्मक अर्थ को बनाए रखता है; ψυχή को यहाँ “प्राण” कहना मूल मुहावरे को “स्वयं” में समतल करने से बचाता है।
- source_word: λύσις τοῦ φθόνου
  choice: डाह से छुटकारा
  rationale: λύσις के बंधन से खुलने या मुक्त होने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: κούφη
  choice: हल्का
  rationale: मूल विशेषण के रूपक को सुरक्षित रखा गया है, जिससे डाह के मानसिक बोझ के हटने का भाव आता है।
theological_decisions:
- issue: κύριος और θεός का अनुवाद
  choice: प्रभु / परमेश्वर
  alternative: यहोवा / परमेश्वर
  rationale: यहाँ यूनानी κύριος किसी स्पष्ट इब्रानी दिव्य नाम वाले उद्धरण का प्रतिनिधित्व नहीं करता; इसलिए “प्रभु” स्रोत के स्तर को सुरक्षित रखता है। θεός के लिए सामान्य हिन्दी बाइबलीय पद “परमेश्वर” रखा गया है।
- issue: τὸ πονηρὸν πνεῦμα में दुष्टता की व्यक्तिगत आध्यात्मिक सक्रियता
  choice: वह दुष्ट आत्मा
  alternative: एक दुष्ट आत्मा; दुष्ट प्रवृत्ति
  rationale: निश्चित उपपद एक निश्चित सत्ता या शक्ति की ओर संकेत करता है। पाठ दुर्गुण को आध्यात्मिक शक्ति के रूप में प्रस्तुत करता है; इसे केवल मनोवैज्ञानिक प्रवृत्ति बनाकर धार्मिक तनाव को समाप्त नहीं किया गया।
- issue: ψυχή का तपश्चर्यात्मक संदर्भ
  choice: प्राण
  alternative: आत्मा; स्वयं
  rationale: “प्राण को कष्ट दिया” मूल अभिव्यक्ति की गंभीरता और शास्त्रीय मुहावरे को बनाए रखता है, जबकि “स्वयं को अनुशासित किया” अर्थ को अधिक व्याख्यात्मक बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, और गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। “डाह” को विषयगत पद के रूप में पूरे अंश में स्थिर रखा गया है। वाक्य-रचना को हिन्दी के अनुरूप किया गया है, पर “आत्मा,” “प्राण को कष्ट देना,” “शरण में भागकर आना,” और “मन हल्का होना” जैसे मूल रूपकों एवं धार्मिक तनावों को बनाए रखा गया है।
