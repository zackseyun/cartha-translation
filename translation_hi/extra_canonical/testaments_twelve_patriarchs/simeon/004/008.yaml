id: T12P.SIM.4.8
reference: Testament of Simeon 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὅτι⁵⁸ ἀγριοῖ τοῦτο⁵⁹ τὴν ψυχήν⁶⁰, καὶ φθείρει *τὸ σῶμα⁶¹, *ὀργὴν καὶ πόλεμον παρέχει τῷ διαβουλίῳ⁶², καὶ εἰς⁶³ αἵματα⁶⁴ παροξύνει, καὶ εἰς ἔκστασιν ἄγει⁶⁵ *τὴν διάνοιαν⁶⁶, καὶ κλόνον⁶⁹ παρέχει τῇ ψυχῇ⁷⁰ καὶ τρόμον τῷ σώματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/008.yaml
  text: For this makes the soul savage, and destroys the body; it brings anger and war into one’s plans, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling.
translation:
  language: hi
  text: क्योंकि यह आत्मा को उग्र बना देता है और शरीर को नष्ट करता है; यह विचार-विमर्श में क्रोध और युद्ध ले आता है, रक्तपात के लिए उकसाता है, बुद्धि को उन्माद में ले जाता है, और आत्मा को उथल-पुथल तथा शरीर को कंपकंपी देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγριοῖ
  choice: क्रूर बना देता है
  rationale: क्रिया का अर्थ जंगली, उग्र या हिंसक स्वभाव का बना देना है; आधुनिक हिन्दी में ‘क्रूर बना देता है’ सहज है और नैतिक उग्रता को स्पष्ट करता है।
- source_word: τὴν ψυχήν
  choice: आत्मा
  rationale: ψυχή यहाँ व्यक्ति के भीतरी जीवन या आत्मा को दर्शाता है; आगे διάνοια और σῶμα से भेद बनाए रखने के लिए ‘आत्मा’ उचित है।
- source_word: τὸ σῶμα
  choice: शरीर
  rationale: σῶμα का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: τῷ διαβουλίῳ
  choice: मनसूबों में
  rationale: दुर्लभ रूप का आशय विचार-विमर्श, योजना या मनसूबे से है। ‘मनसूबों में’ मूल की संभावित योजना-संबंधी दिशा को बनाए रखता है, यद्यपि पाठ कठिन है।
- source_word: πόλεμον
  choice: संघर्ष
  rationale: शाब्दिक अर्थ ‘युद्ध’ है, पर भीतरी योजनाओं के संदर्भ में ‘संघर्ष’ अधिक स्वाभाविक है और मूल की विरोधात्मक तीव्रता बनाए रखता है।
- source_word: εἰς αἵματα
  choice: रक्तपात के लिए
  rationale: बहुवचन ‘रक्तों’ का मुहावरेदार अर्थ हिंसक रक्तपात है।
- source_word: ἔκστασιν
  choice: उन्माद
  rationale: संदर्भ में सामान्य ‘परमानंद’ नहीं, बल्कि मानसिक विक्षोभ या अपने ऊपर नियंत्रण खोने की दशा अभिप्रेत है।
- source_word: τὴν διάνοιαν
  choice: बुद्धि
  rationale: यह सोचने-समझने की क्षमता को सूचित करता है और ψυχή से आवश्यक भेद बनाए रखता है।
- source_word: κλόνον
  choice: उथल-पुथल
  rationale: शब्द आंदोलन, विक्षोभ या भारी हलचल का बोध देता है; ‘उथल-पुथल’ आत्मा की आंतरिक अशांति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τρόμον
  choice: कंपकंपी
  rationale: भय या तीव्र व्याकुलता से होने वाले शारीरिक कांपने को स्पष्ट करता है।
theological_decisions:
- issue: ψυχή और διάνοια के बीच भेद
  choice: ψυχή के लिए ‘आत्मा’ और διάνοια के लिए ‘बुद्धि’
  alternative: दोनों के लिए क्रमशः ‘मन’ और ‘सोच’
  rationale: मूल में अलग आंतरिक पक्षों का उल्लेख है। चुने हुए शब्द इस भेद को बनाए रखते हैं, बिना किसी व्यवस्थित आत्मा-विज्ञान को पाठ पर थोपे।
- issue: ἔκστασις का स्वरूप
  choice: उन्माद
  alternative: बेसुधी / सुध-बुध खो देना
  rationale: यहाँ विनाशकारी प्रभावों की सूची है, इसलिए सकारात्मक धार्मिक ‘परमानंद’ संदर्भानुकूल नहीं है; फिर भी ‘उन्माद’ मानसिक विक्षोभ की पर्याप्त व्यापकता रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। यूनानी वाक्य की क्रमिक, संचयी लय को अर्धविराम और समानांतर क्रियाओं द्वारा सुरक्षित किया गया है। कठिन τῷ διαβουλίῳ को अत्यधिक निश्चित किए बिना ‘मनसूबों में’ अनूदित किया गया है।
