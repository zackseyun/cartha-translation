source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ὅτι καὶ⁷¹ ἐν ὕπνῳ *τις ζῆλος⁷² κακίας αὐτὸν⁷³ φαντάζουσα⁷⁴ κατεσθίει⁷⁵ καὶ⁷⁶ πνεύμασι πονηροῖς⁷⁷ διαταράσσει⁷⁸ τὴν ψυχὴν αὐτοῦ, καὶ ἐκθροεῖσθαι τὸ σῶμα ποιεῖ, καὶ ἐν ταραχῇ διυπνίζει⁷⁹ τὸν νοῦν, καὶ ὡς⁸⁰ πνεῦμα πονηρὸν *καὶ ἰοβόλον⁸¹, *οὕτως φαίνεται⁸² τοῖς ἀνθρώποις⁸³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/009.yaml
  text: For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body shudder, and wakes the mind in turmoil; and like an evil and venomous spirit, so he appears to people.
translation:
  language: hi
  text: क्योंकि नींद में भी ईर्ष्या[a] उसे बुराई के दृश्य दिखाकर खा जाती है, दुष्ट आत्माओं से उसकी आत्मा को व्याकुल करती है, उसके शरीर को कंपा देती है और उसके मन को व्याकुलता में जगा देती है। इस प्रकार वह लोगों को दुष्ट और विषैली आत्मा के समान दिखाई देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ प्रसंग के अनुसार ‘ईर्ष्या’, ‘डाह’ या ‘उत्साह’ हो सकता है; यहाँ उसका नकारात्मक अर्थ अभिप्रेत है।
    reason: ζῆλος की वास्तविक अर्थ-सीमा को दर्ज करना।
lexical_decisions:
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: इस नकारात्मक प्रसंग में यह शब्द विनाशकारी ईर्ष्या या डाह को दर्शाता है; ‘उत्साह’ यहाँ संदर्भ के अनुकूल नहीं है।
- source_word: φαντάζουσα
  choice: दृश्य दिखाकर
  rationale: क्रिया मन में छवियाँ या दृश्य उपस्थित करने का भाव देती है; यह केवल सामान्य ‘कल्पना’ से अधिक सजीव है।
- source_word: κατεσθίει
  choice: भीतर ही भीतर खा जाती है
  rationale: मूल में ‘खा जाना/निगल जाना’ का रूपक है। हिन्दी में यह प्रयोग ईर्ष्या के धीरे-धीरे नष्ट करने वाले प्रभाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκθροεῖσθαι
  choice: कंपा देती है
  rationale: शरीर को चौंका देने, थरथरा देने या व्याकुल कर देने का भाव है; अनावश्यक रूप से ‘भय से’ नहीं जोड़ा गया।
- source_word: διυπνίζει
  choice: जगा देती है
  rationale: मूल क्रिया मन को नींद से जगा देने का संकेत करती है; ‘घबराहट में’ साथ रखकर ταραχή का भाव सुरक्षित किया गया है।
- source_word: ἰοβόλον
  choice: विषैले
  rationale: शब्द का शाब्दिक भाव विष छोड़ने या विष फेंकने वाला है; ‘विषैला’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: दुष्ट आत्माओं की भूमिका
  choice: दुष्ट आत्माओं के द्वारा उसकी आत्मा को व्याकुल करती है
  alternative: दुष्ट आत्माओं से उसकी आत्मा को व्याकुल करती है
  rationale: πνεύμασι πονηροῖς करण कारक के रूप में समझा जा सकता है। ‘के द्वारा’ साधन का भाव स्पष्ट करता है, पर इस अंश से इनके कार्य-तंत्र के बारे में अतिरिक्त धर्मवैज्ञानिक दावा नहीं किया गया।
- issue: अंतिम तुलना में व्यक्ति और आत्मा का संबंध
  choice: वह लोगों को एक दुष्ट और विषैले आत्मा के समान दिखाई देता है
  alternative: वह लोगों को मानो स्वयं एक दुष्ट और विषैला आत्मा दिखाई देता है
  rationale: ὡς तुलना को व्यक्त करता है। अनुवाद व्यक्ति को सचमुच दुष्ट आत्मा घोषित करने के बजाय मूल की उपमा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ईर्ष्या को कर्ता बनाए रखकर मूल वाक्य की सजीव मानवीकरण-शैली सुरक्षित की गई है। ‘भीतर ही भीतर खा जाती है’ हिन्दी में स्वाभाविक मुहावरा है और यूनानी रूपक को बनाए रखता है।
