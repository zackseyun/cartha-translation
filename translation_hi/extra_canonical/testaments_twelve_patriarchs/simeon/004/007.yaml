source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὑμεῖς⁵², τέκνα μου⁵³, ἀγαπήσατε⁵⁴ ἕκαστος τὸν ἀδελφὸν⁵⁵ αὐτοῦ⁵⁶ ἐν ἀγαθῇ καρδίᾳ, καὶ *ἀποστήσεται ἀφ᾽ ὑμῶν τὸ πνεῦμα τοῦ φθόνου⁵⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/007.yaml
  text: And you also, my children, let each one love his brother with a good heart, and the spirit of envy will depart from you.
translation:
  language: hi
  text: और तुम भी, मेरे बच्चों, तुम में से हर एक अपने भाई से भले मन से प्रेम करे, और ईर्ष्या की आत्मा तुमसे दूर हो जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: प्रेम करे
  rationale: आज्ञार्थक भाव को स्वाभाविक हिन्दी में ‘तुममें से हर एक ... प्रेम करे’ द्वारा व्यक्त किया गया है।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई से
  rationale: एकवचन और पारस्परिक नैतिक संदर्भ को बनाए रखता है; ‘भाई’ को अनावश्यक रूप से व्यापक या संप्रदायगत अर्थ नहीं दिया गया।
- source_word: ἐν ἀγαθῇ καρδίᾳ
  choice: सच्चे मन से
  rationale: शाब्दिक ‘भले हृदय से’ की अपेक्षा यह आधुनिक हिन्दी में निष्कपट और सद्भावपूर्ण अंतःकरण का स्वाभाविक बोध देता है।
- source_word: τὸ πνεῦμα τοῦ φθόνου
  choice: ईर्ष्या की आत्मा
  rationale: πνεῦμα की ठोस अभिव्यक्ति और पाठ की संभावित आध्यात्मिक अर्थच्छाया को सुरक्षित रखा गया है।
- source_word: ἀποστήσεται ἀφ᾽ ὑμῶν
  choice: तुमसे दूर हो जाएगी
  rationale: भविष्यकाल तथा अलग होकर चले जाने के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘ईर्ष्या की आत्मा’ का स्वरूप
  choice: ईर्ष्या की आत्मा
  alternative: ईर्ष्या की भावना
  rationale: मूल πνεῦμα की अस्पष्टता को बनाए रखा गया है—यह व्यक्तिगत आत्मिक सत्ता अथवा मनोवृत्ति, दोनों की ओर संकेत कर सकता है; केवल ‘भावना’ कहने से यह तनाव समाप्त हो जाता।
- issue: दूसरे खंड का संबंध
  choice: ‘तब’ के साथ परिणामसूचक कथन
  alternative: साधारण ‘और’ से समन्वय
  rationale: ग्रीक καί के संदर्भगत परिणाम को स्वाभाविक हिन्दी में स्पष्ट किया गया है, बिना इसे कठोर कारण-परिणाम सिद्धांत बनाने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। संबोधन ‘मेरे बच्चो’ आत्मीयता बनाए रखता है; वाक्य आज्ञा और प्रतिज्ञात परिणाम, दोनों को स्पष्ट रूप से व्यक्त करता है।
