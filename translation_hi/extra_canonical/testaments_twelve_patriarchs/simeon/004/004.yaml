base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/004.yaml
  text: But Joseph was a good man, and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers.
translation:
  language: hi
  text: परन्तु यूसुफ एक भला मनुष्य था। उसमें परमेश्वर का आत्मा था, और वह करुणामय और दयालु था। उसने मुझसे बैर नहीं रखा, बल्कि मुझसे और मेरे भाइयों से प्रेम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἀνήρ
  choice: भला मनुष्य
  rationale: यह सहज और गरिमापूर्ण हिन्दी में नैतिक भलाई व्यक्त करता है; केवल ‘अच्छा आदमी’ की अपेक्षा प्रसंग के लिए अधिक उपयुक्त है।
- source_word: ἔχων πνεῦμα θεοῦ ἐν αὐτῷ
  choice: उसमें परमेश्वर का आत्मा था
  rationale: यूनानी कृदन्तीय वाक्यांश का स्वाभाविक हिन्दी रूप है और उसमें स्पष्ट न किया गया कारणात्मक संबंध नहीं जोड़ता।
- source_word: εὔσπλαγχνος καὶ ἐλεήμων
  choice: करुणामय और दयालु
  rationale: दोनों निकटार्थक गुणों को अलग रखते हुए पहले शब्द की अंतःकरण से उपजी करुणा और दूसरे की दयालुता को व्यक्त करता है।
- source_word: οὐκ ἐμνησικάκησέν με
  choice: उसने मुझसे बैर नहीं रखा
  rationale: क्रिया का अर्थ पिछली बुराई को याद रखकर द्वेष पालना है; ‘बैर नहीं रखा’ आधुनिक हिन्दी में इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: ἠγάπησέ με σὺν τοῖς ἀδελφοῖς μου
  choice: मुझसे और मेरे भाइयों से प्रेम किया
  rationale: 'σύν की समावेशी भावना को स्वाभाविक हिन्दी में व्यक्त करता है: यूसुफ ने वक्ता को उसके भाइयों सहित प्रेम किया।'
theological_decisions:
- issue: यूसुफ में परमेश्वर के आत्मा की उपस्थिति और उसके गुणों के बीच संबंध
  choice: वाक्यों को समन्वित रूप में रखा गया, स्पष्ट कारणात्मक ‘क्योंकि’ नहीं जोड़ा गया
  alternative: ‘परमेश्वर का आत्मा उसमें होने के कारण वह...’
  rationale: यूनानी पाठ में ἔχων और ὑπάρχων कृदन्त हैं, पर कारणात्मक संबंध स्पष्ट रूप से चिह्नित नहीं है; अतः निहित धर्मवैज्ञानिक कारण को अनिवार्य अर्थ नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण शैली। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, जबकि उसके सभी प्रमुख संबंध और अर्थ सुरक्षित रखे गए हैं।
