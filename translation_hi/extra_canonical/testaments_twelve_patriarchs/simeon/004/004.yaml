reference: Testament of Simeon 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἰωσὴφ δὲ¹⁷ ἦν *ἀγαθὸς ἀνήρ¹⁸, καὶ¹⁹ ἔχων²⁰ πνεῦμα θεοῦ *ἐν αὐτῷ²¹, εὔσπλαγχνος καὶ ἐλεήμων ὑπάρχων²² οὐκ²³ ἐμνησικάκησέν με²⁴, ἀλλὰ²⁵ ἠγάπησέ με *σὺν τοῖς ἀδελφοῖς μου²⁶.
