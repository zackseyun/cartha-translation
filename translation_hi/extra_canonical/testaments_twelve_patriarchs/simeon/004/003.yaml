source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὅτε¹⁰ κατέβημεν εἰς Αἴγυπτον, καὶ¹¹ ἔδησέ¹² με¹³ ὡς κατάσκοπον¹⁴, ἔγνων ὅτι δικαίως πάσχω¹⁵ καὶ οὐκ ἐλυπούμην¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/003.yaml
  text: And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not grieved.
translation:
  language: hi
  text: और जब हम मिस्र गए और उसने मुझे जासूस समझकर बाँध दिया, तब मैंने जान लिया कि मैं उचित ही कष्ट सह रहा हूँ, और मैं दुःखी नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβημεν
  choice: हम ... गए
  rationale: ग्रीक में शाब्दिक अर्थ ‘हम नीचे गए’ है; हिन्दी में मिस्र की यात्रा के लिए केवल ‘गए’ अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
- source_word: ὡς κατάσκοπον
  choice: जासूस समझकर
  rationale: ὡς यहाँ आरोपित हैसियत या धारणा व्यक्त करता है; ‘जासूस समझकर’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δικαίως πάσχω
  choice: मैं न्यायोचित दंड भोग रहा हूँ
  rationale: δικαίως का अर्थ ‘न्यायपूर्वक/उचित रूप से’ और πάσχω का अर्थ ‘सहना/भोगना’ है। प्रसंग में शिमोन अपने कष्ट को अपने अपराध का उचित फल मानता है, इसलिए ‘न्यायोचित दंड भोग रहा हूँ’ स्पष्ट और स्वाभाविक है।
- source_word: οὐκ ἐλυπούμην
  choice: मैं दुःखी नहीं हुआ
  rationale: λυπέομαι दुःख या शोक अनुभव करने को दर्शाता है; ‘दुःखी नहीं हुआ’ इसका सीधा और सामान्य हिन्दी रूप है।
theological_decisions:
- issue: δικαίως πάσχω में कष्ट और दंड का संबंध
  choice: न्यायोचित दंड भोग रहा हूँ
  alternative: उचित रूप से कष्ट सह रहा हूँ
  rationale: प्रसंग अपराधबोध और उचित प्रतिफल की स्वीकृति का है। ‘दंड’ इस निहित न्यायिक भाव को संक्षेप में व्यक्त करता है, बिना किसी विशेष प्रायश्चित्त-सिद्धांत को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। किसी पादटिप्पणी की आवश्यकता नहीं है।
