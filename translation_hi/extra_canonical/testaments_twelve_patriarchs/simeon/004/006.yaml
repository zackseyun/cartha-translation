id: T12P.SIM.4.6
reference: Testament of Simeon 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Πάσας⁴⁰ τὰς ἡμέρας⁴¹ οὐκ⁴² ὠνείδισεν ἡμᾶς⁴³ *περὶ τοῦ πράγματος τούτου⁴⁴, ἀλλ᾿⁴⁵ ἠγάπησεν ἡμᾶς ὡς τὴν *ψυχὴν αὐτοῦ⁴⁶ καὶ ὑπὲρ τοὺς υἱοὺς αὐτοῦ⁴⁷ ἐδόξασεν⁴⁸ ἡμᾶς, καὶ⁴⁹ *πλοῦτον καὶ κτήνη καὶ καρπὸν⁵⁰ *ἐχαρίσατο ἡμῖν⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/006.yaml
  text: All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us wealth and livestock and produce.
translation:
  language: hi
  text: अपने जीवन भर उसने इस बात को लेकर हमें कभी उलाहना नहीं दिया, बल्कि उसने हमें अपने प्राण के समान प्रेम किया, अपने पुत्रों से भी बढ़कर हमारा सम्मान किया, और हमें धन, पशु और उपज प्रदान की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάσας τὰς ἡμέρας
  choice: अपने जीवन भर
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है; प्रसंग में यह स्वाभाविक हिन्दी में उसके पूरे जीवनकाल की निरंतरता व्यक्त करता है।
- source_word: ὠνείδισεν
  choice: उलाहना नहीं दिया
  rationale: क्रिया में पिछले अपराध या लज्जाजनक बात को लेकर धिक्कारने अथवा ताना देने का भाव है; ‘उलाहना’ इसे सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: अपने प्राण के समान
  rationale: ψυχή का यहाँ आत्मीय जीवन/प्राण का अर्थ है; ‘प्राण’ मूल उपमा की तीव्रता बनाए रखता है और इसे केवल भावनात्मक ‘स्वयं’ में नहीं बदलता।
- source_word: ἐδόξασεν
  choice: सम्मान किया
  rationale: यहाँ क्रिया का भाव प्रतिष्ठा या आदर देने का है; ‘महिमा दी’ हिन्दी में इस मानवीय संबंध के संदर्भ में अस्वाभाविक होता।
- source_word: πλοῦτον καὶ κτήνη καὶ καρπὸν
  choice: धन, पशु और उपज
  rationale: तीनों भौतिक अनुदानों को सीधे और स्वाभाविक रूप में व्यक्त करता है; καρπός यहाँ कृषि-उत्पादन/उपज के अर्थ में है।
- source_word: ἐχαρίσατο
  choice: प्रदान की
  rationale: मूल क्रिया उदारतापूर्वक देने का भाव रखती है; ‘प्रदान की’ दानशीलता और गरिमापूर्ण शैली दोनों को बनाए रखता है।
theological_decisions: []
