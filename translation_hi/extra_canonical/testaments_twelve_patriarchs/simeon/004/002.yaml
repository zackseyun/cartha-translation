  source_fidelity: Greek imperfect Ἐπένθουν is accurately rendered as an ongoing past action, ‘शोक मना रहा था.’ The comparative phrase παρὰ πάντας is conveyed faithfully by ‘औरों से बढ़कर,’ and αἴτιος τῆς πράσεως Ἰωσήφ is accurately represented as responsibility for Joseph’s being sold. The causal connection marked by γάρ is retained.
