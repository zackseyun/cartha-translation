  terminology: ‘यूसुफ़’ follows standard Hindi biblical usage. ‘शोक मना रहा था’ appropriately conveys mourning, while ‘उत्तरदायी’ preserves αἴτιος as culpable responsibility without asserting that Simeon was the sole cause.
