  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐπένθουν γὰρ *παρὰ πάντας⁷ ὅτι ἐγὼ ἤμην⁸ αἴτιος *τῆς πράσεως⁹ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/002.yaml
  text: For I was grieving more than all the others, because I was responsible for the sale of Joseph.
translation:
  language: hi
  text: क्योंकि मैं औरों से बढ़कर शोक मना रहा था, इसलिए कि यूसुफ़ के बेचे जाने का उत्तरदायी मैं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπένθουν
  choice: शोक मना रहा था
  rationale: यह क्रिया बीते समय में जारी गहरे दुःख या मातम को व्यक्त करती है; ‘शोक मना रहा था’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: παρὰ πάντας
  choice: औरों से बढ़कर
  rationale: तुलनात्मक अर्थ ‘सबकी अपेक्षा अधिक’ को सहज हिन्दी में व्यक्त करता है, बिना यह अनावश्यक रूप से तय किए कि तुलना का दायरा ठीक किन लोगों तक सीमित है।
- source_word: αἴτιος
  choice: उत्तरदायी
  rationale: यह कारण होने और दोषपूर्ण जिम्मेदारी उठाने—दोनों भावों को समेटता है।
- source_word: τῆς πράσεως Ἰωσήφ
  choice: यूसुफ़ के बेचे जाने का
  rationale: πρᾶσις का यहाँ अर्थ ‘बिक्री’ है; कर्मवाच्य हिन्दी से यूसुफ़ को बेचे जाने की घटना स्पष्ट और स्वाभाविक ढंग से व्यक्त होती है।
theological_decisions:
- issue: यूसुफ़ की बिक्री के लिए शिमोन की जिम्मेदारी की तीव्रता
  choice: ‘उत्तरदायी मैं था’
  alternative: ‘उसका कारण मैं था’
  rationale: αἴτιος वास्तविक जिम्मेदारी बताता है, पर पद अकेले यह आवश्यक रूप से नहीं कहता कि वही एकमात्र कारण था। ‘उत्तरदायी’ नैतिक गंभीरता बनाए रखते हुए इस संभावित अतिव्याख्या से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। ‘यूसुफ़’ में प्रचलित हिन्दी बाइबलीय वर्तनी अपनाई गई है।
