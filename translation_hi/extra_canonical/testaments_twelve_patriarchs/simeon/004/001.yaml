base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/001.yaml
  text: My father kept asking about me, because he had seen me gloomy, and I said to him, “My liver is swollen.”
translation:
  language: hi
  text: मेरे पिता मेरे बारे में बार-बार पूछते रहे, क्योंकि उन्होंने मुझे उदास देखा था। मैं उनसे कहता रहा, “मेरे जिगर में सूजन है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτῶν περὶ ἐμοῦ
  choice: मेरे बारे में बार-बार पूछते रहे
  rationale: अपूर्ण भूतकाल की निरंतर अथवा बार-बार होने वाली क्रिया और ‘मेरे विषय में’ के अर्थ—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σκυθρωπόν
  choice: उदास
  rationale: चेहरे पर छाई उदासी या मलिनता का सामान्य, सहज और संदर्भानुकूल हिन्दी रूप।
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: मेरे जिगर में सूजन है
  rationale: यूनानी अभिव्यक्ति यकृत/जिगर के सूजने की शारीरिक शिकायत बताती है। ‘जिगर’ प्रत्यक्ष कथन में ‘यकृत’ से अधिक स्वाभाविक है, और ‘में सूजन है’ हिन्दी में मुहावरेदार चिकित्सा-संबंधी अभिव्यक्ति है।
- source_word: ἔλεγον αὐτῷ
  choice: मैं उनसे कहता रहा
  rationale: अपूर्ण भूतकाल की जारी अथवा दोहराई गई क्रिया को बनाए रखता है; आदरसूचक ‘उनसे’ पिता के लिए स्वाभाविक आधुनिक हिन्दी है।
