  terminology: ‘जलन और डाह,’ ‘हृदय की सरलता,’ ‘अनुग्रह,’ ‘महिमा,’ and ‘आशीष’ are suitable, distinct, and theologically non-sectarian renderings. ‘यूसुफ में’ rightly preserves the source’s unusual wording without interpretive expansion.
