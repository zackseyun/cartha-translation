id: T12P.SIM.4.5
reference: Testament of Simeon 4:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Φυλάξασθε οὖν ὑμεῖς²⁷, τέκνα²⁸ μου, ἀπὸ²⁹ παντὸς ζήλου καὶ φθόνου³⁰ καὶ πορεύεσθε ἐν *ἁπλότητι καρδίας³¹, ἵνα δῷ³⁴ Γκαὶ ὑμῖν⁷³⁵ ὁ Θεὸς χάριν καὶ δόξαν καὶ εὐλογίαν *ἐπὶ τὰς κεφαλὰς ὑμῶν³⁶, καθὼς³⁷ ἴδετε³⁸ *ἐν Ἰωσήφ³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/005.yaml
  text: Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you grace and glory and blessing upon your heads, just as you saw in Joseph.
translation:
  language: hi
  text: इसलिए, हे मेरे बच्चो, तुम हर प्रकार की जलन और डाह से अपने आप को बचाए रखो, और हृदय की सरलता में चलो, ताकि परमेश्वर तुम्हें भी तुम्हारे सिरों पर अनुग्रह, महिमा और आशीष दे, जैसा तुमने यूसुफ में देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήλου καὶ φθόνου
  choice: जलन और डाह
  rationale: दोनों निकटार्थी यूनानी शब्दों का भेद यथासंभव बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी प्रयोग किया गया है।
- source_word: ἁπλότητι καρδίας
  choice: हृदय की सरलता
  rationale: ἁπλότης यहाँ निष्कपटता, एकनिष्ठता और सरलता का भाव रखता है; ‘हृदय की सरलता’ मूल रूपक और उसकी व्यापकता बनाए रखता है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: यह χάρις का निकट और धर्मग्रंथीय हिन्दी समतुल्य है तथा केवल सामान्य ‘कृपा’ या ‘पक्ष’ की तुलना में मूल की धार्मिक अनुगूँज बेहतर रखता है।
- source_word: δόξαν
  choice: महिमा
  rationale: δόξα का सीधा और स्थापित हिन्दी समतुल्य।
- source_word: εὐλογίαν ἐπὶ τὰς κεφαλὰς ὑμῶν
  choice: आशीष दे—तुम्हारे सिरों पर
  rationale: ‘सिरों पर’ की मूल ठोस छवि सुरक्षित रखी गई है; विराम-चिह्न हिन्दी में वाक्य को स्वाभाविक बनाता है।
- source_word: ἐν Ἰωσήφ
  choice: यूसुफ में
  rationale: मूल का असामान्य पर अर्थपूर्ण ἐν-संबंध सुरक्षित रखा गया है; इसे ‘यूसुफ के साथ’ या ‘यूसुफ के जीवन में’ करके चुपचाप स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ἁπλότης का नैतिक अर्थ
  choice: हृदय की सरलता
  alternative: निष्कपट हृदय से
  rationale: ‘सरलता’ मूल संज्ञात्मक अभिव्यक्ति और उसके संभावित अर्थ-विस्तार को बनाए रखती है, जबकि ‘निष्कपट’ अर्थ को कुछ अधिक सीमित कर देता।
- issue: χάρις का अनुवाद
  choice: अनुग्रह
  alternative: कृपा
  rationale: ‘अनुग्रह’ χάρις से निकट धर्मशास्त्रीय correspondence रखता है, पर पद को किसी विशिष्ट साम्प्रदायिक सिद्धांत की ओर नहीं मोड़ता।
- issue: ἐν Ἰωσήφ की अस्पष्टता
  choice: जैसा तुमने यूसुफ में देखा
  alternative: जैसा तुमने यूसुफ के जीवन में देखा
  rationale: मूल यूनानी की संक्षिप्त और कुछ अस्पष्ट संरचना को बनाए रखा गया है; ‘जीवन में’ जोड़ना एक सम्भावित अर्थ को स्पष्ट रूप से चुन लेता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘हे मेरे बच्चो’ पितृसुलभ प्रत्यक्ष संबोधन को रखता है। निकटार्थी ‘जलन’ और ‘डाह’ दोनों रखे गए हैं, और मूल की ठोस ‘सिरों पर’ छवि तथा ‘यूसुफ में’ की वास्तविक अस्पष्टता नहीं मिटाई गई है।
