  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007.yaml
  text: And now[[God and man]], my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will arise for us. For the Lord will raise up from Levi as a high priest, and from Judah as a king, [God and man]; he will save [all the nations and] the race of Israel[[all the nations and]]. Therefore I command these things to you, so that you also may command your children[the race of Israel], that they may keep them throughout their generations.
translation:
  language: hi
  text: 7 अब, मेरे बच्चो, लेवी और यहूदा की बात ध्यान से सुनो। इन दोनों गोत्रों से बढ़कर अपने आपको ऊँचा मत समझो, क्योंकि इन्हीं में से हमारे लिए परमेश्वर का उद्धार उदित होगा। 2 क्योंकि प्रभु लेवी में से एक महायाजक और यहूदा में से एक राजा को खड़ा करेगा—[परमेश्वर और मनुष्य][a]—और वह [सब जातियों और][b] इस्राएल के वंश[c] को बचाएगा। 3 इसलिए मैं तुम्हें ये आज्ञाएँ देता हूँ, ताकि तुम भी अपने बच्चों को इनके पालन की आज्ञा दो और वे अपनी पीढ़ियों तक इनका पालन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर और मनुष्य” शब्द प्रदत्त यूनानी पाठ में कोष्ठकों में हैं; इससे इनके पाठ में मूल रूप से होने पर अनिश्चितता या बाद में जोड़े जाने की संभावना सूचित होती है।
    reason: textual_variant
  - marker: b
    text: “सब जातियों और” शब्द भी यूनानी पाठ में कोष्ठकों में हैं और संभवतः पाठ का बाद का विस्तार हो सकते हैं।
    reason: textual_variant
  - marker: c
    text: या “इस्राएल के लोगों।” यूनानी शब्द γένος वंश, कुल या एक ही मूल से जुड़े जन-समुदाय का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούσατε
  choice: की बात ध्यान से सुनो
  rationale: यह आज्ञार्थक क्रिया केवल सुनने नहीं, बल्कि ध्यान देकर मानने की ओर संकेत करती है। हिंदी में यह अभिव्यक्ति उस उत्तरदायी श्रवण को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: μὴ ἐπαίρεσθε ἐπὶ
  choice: के सामने अपने आपको ऊँचा मत समझो
  rationale: मूल में आत्म-उत्थान और इन दो वंश-समूहों के प्रति घमंड, दोनों भाव हैं। यह हिंदी रूप तुलना और अभिमान को स्पष्ट रखता है।
- source_word: γενεὰς
  choice: गोत्रों
  rationale: यहाँ शब्द लेवी और यहूदा नामक इस्राएली वंश-समूहों को सूचित करता है; अतः सामान्य अर्थ 'पीढ़ियाँ' के बजाय संदर्भानुकूल 'गोत्रों' चुना गया है।
- source_word: τὸ σωτήριον τοῦ Θεοῦ
  choice: परमेश्वर का उद्धार
  rationale: यह औपचारिक भविष्यवाणी-सदृश पदबंध परमेश्वर के बचाने के कार्य अथवा उद्धार के मूर्त प्रकट होने, दोनों की संभावना खुली रखता है।
- source_word: ἀνατελεῖ
  choice: उदित होगा
  rationale: क्रिया का मूल बिंब उगने या उदित होने का है। इसे बनाए रखने से भविष्यवाणी की काव्यात्मक भाषा सुरक्षित रहती है।
- source_word: ἀναστήσει
  choice: खड़ा करेगा
  rationale: यह किसी नियुक्त नेता को उत्पन्न या प्रतिष्ठित करने का भविष्यवाणी-संबंधी मुहावरा है; हिंदी बाइबलीय प्रयोग में 'खड़ा करेगा' स्वाभाविक और पर्याप्त रूप से खुला है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: यह याजकीय पद का मानक और विशिष्ट हिंदी रूप है।
- source_word: βασιλέα
  choice: राजा
  rationale: मूल के स्पष्ट राजकीय पद को बिना सामान्यीकृत किए रखा गया है।
- source_word: σώσει
  choice: बचाएगा
  rationale: यह पूर्ववर्ती 'उद्धार' से अर्थगत संबंध बनाए रखता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: इस्राएल का वंश
  rationale: γένος में वंश, कुल और जन-समुदाय का भाव है। 'वंश' इसकी वंशावलीगत छाया को बनाए रखता है; वैकल्पिक सहज अर्थ पादटिप्पणी में दिया गया है।
- source_word: φυλάξωσιν
  choice: पालन करें
  rationale: आज्ञाओं के संदर्भ में क्रिया का अर्थ उन्हें सुरक्षित रखने के साथ मानना भी है; आधुनिक हिंदी में 'पालन करें' सबसे स्पष्ट है।
theological_decisions:
- issue: कोष्ठकबद्ध Θεὸν καὶ ἄνθρωπον
  choice: मुख्य पाठ में '[परमेश्वर और मनुष्य]' के रूप में रखा गया
  alternative: इसे संभावित उत्तरकालीन विस्तार मानकर छोड़ देना, या 'ईश्वरीय और मानवीय' कहकर व्याख्यात्मक अनुवाद करना
  rationale: प्रदत्त यूनानी पाठ इसे पाठ-संदिग्ध रूप में चिह्नित करता है। शब्दशः अनुवाद और पादटिप्पणी पाठक को प्रमाण की स्थिति बताते हैं तथा किसी बाद की सिद्धान्तगत व्याख्या को पाठ में आरोपित नहीं करते।
- issue: कोष्ठकबद्ध πάντα τὰ ἔθνη
  choice: मुख्य पाठ में '[सब जातियों और]' के रूप में रखा गया
  alternative: संदिग्ध विस्तार मानकर छोड़ देना, या 'सब गैर-यहूदियों' कहना
  rationale: प्रदत्त यूनानी साक्ष्य में पदबंध उपस्थित किंतु कोष्ठकबद्ध है। 'जातियों' व्यापक संभावित अर्थ रखता है और 'गैर-यहूदी' जैसी अधिक विशिष्ट व्याख्या आरोपित नहीं करता।
- issue: याजकीय और राजकीय पदों की वाक्यगत संख्या
  choice: लेवी में से एक महायाजक और यहूदा में से एक राजा को खड़ा करने की भाषा रखी गई, जिसके बाद एकवचन 'वह' है
  alternative: दो अलग-अलग व्यक्तियों को स्पष्ट कर देना, या दोनों पदों को निश्चित रूप से एक ही व्यक्ति में मिला देना
  rationale: यूनानी पाठ में दोनों पदों के बाद οὗτος और σώσει एकवचन हैं, पर रचना में व्याकरणिक तनाव बना हुआ है। अनुवाद इसे किसी एक धर्मवैज्ञानिक निष्कर्ष से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। 'महायाजक', 'गोत्र' और 'उद्धार' जैसे स्थापित धार्मिक शब्द संदर्भगत सटीकता के लिए रखे गए हैं। पाठ-संदिग्ध अंशों के लिए वर्गाकार कोष्ठक और अनिवार्य [a]–[c] पादटिप्पणी-चिह्न प्रयुक्त हैं।
