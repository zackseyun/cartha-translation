source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔσεσθε αὐτῷ εἰς υἱοὺς¹⁷ ἐν ἀληθείᾳ¹⁸, *καὶ πορεύεσθε¹⁸ ἐν προστάγμασιν¹⁹ αὐτοῦ πρώτοις καὶ ἐσχάτοις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/002.yaml
  text: And you will be to him sons in truth, and you will walk in his commandments, the first and the last.
translation:
  language: hi
  text: और तुम वास्तव में उसके पुत्र होगे, और उसकी पहली और आख़िरी आज्ञाओं का पालन करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς υἱοὺς
  choice: उसके पुत्र
  rationale: ग्रीक का संबंधसूचक भाव स्वाभाविक हिन्दी में रखा गया है; ‘पुत्र’ मूल के बहुवचन और पारिवारिक रूपक को बनाए रखता है।
- source_word: ἐν ἀληθείᾳ
  choice: सचमुच
  rationale: यहाँ पदबंध को क्रियाविशेषणीय अर्थ में लिया गया है—वे वास्तविक रूप से उसके पुत्र होंगे; इससे शाब्दिक ‘सत्य में’ की अस्वाभाविकता से बचते हुए मूल भाव सुरक्षित रहता है।
- source_word: πορεύεσθε ἐν προστάγμασιν
  choice: आज्ञाओं पर चलोगे
  rationale: ‘चलना’ नैतिक आचरण के रूपक को बनाए रखता है और ‘आज्ञाओं पर चलना’ आधुनिक हिन्दी में बोधगम्य है।
- source_word: πρώτοις καὶ ἐσχάτοις
  choice: पहली और आख़िरी
  rationale: दोनों विशेषणों को ‘आज्ञाओं’ से जोड़ा गया है, जैसा उनके कारक-वचन का सामंजस्य संकेत करता है; क्रम अथवा संपूर्ण विस्तार की संभावित ध्वनि को अनावश्यक रूप से नहीं खोला गया।
theological_decisions:
- issue: ‘पुत्र’ का रूपक
  choice: लिंग-विशिष्ट ‘पुत्र’ बनाए रखा
  alternative: ‘संतान’
  rationale: υἱούς स्पष्ट रूप से ‘पुत्रों’ को व्यक्त करता है; तटस्थ शब्द लेने से स्रोत का पारिवारिक और संभवतः धर्मवैचारिक रूपक बदल जाता।
- issue: ‘पहली और आख़िरी’ का आशय
  choice: इन्हें ‘आज्ञाओं’ के विशेषण के रूप में रखा
  alternative: ‘आरम्भ से अन्त तक’ अथवा ‘पहली से आख़िरी तक’
  rationale: मूल यूनानी विशेषणात्मक है और उसका सटीक व्यावहारिक आशय कुछ खुला है; अनुवाद ने उसे व्याख्यात्मक समग्रता-वाक्य में नहीं बदला।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आख़िरी’ वर्तमान मानक हिन्दी में स्वाभाविक है; वाक्य की समानांतर भविष्यकालीन संरचना मूल के दो खंडों को सुरक्षित रखती है।
