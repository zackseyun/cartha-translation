source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἐξ αὐτῆς βλαστήσει²⁴ ῥάβδος δικαιοσύνης²⁵ τοῖς ἔθνεσι, *κρῖναι καὶ σῶσαι²⁶ πάντας τοὺς²⁷ ἐπικαλουμένους τὸν²⁸ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/005.yaml
  text: And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.
translation:
  language: hi
  text: और उसमें से राष्ट्रों के लिए धार्मिकता की छड़ी फूट निकलेगी, ताकि वह न्याय करने और प्रभु को पुकारने वाले सब लोगों को बचाने के लिए हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ αὐτῆς
  choice: उसी से
  rationale: स्त्रीलिंग सर्वनाम का पूर्ववर्ती इस पद में स्पष्ट नहीं है; इसलिए किसी संज्ञा को जोड़कर संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: βλαστήσει
  choice: फूट निकलेगी
  rationale: वनस्पति के अंकुरित होने की मूल छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ῥάβδος δικαιοσύνης
  choice: धार्मिकता की एक छड़ी
  rationale: ῥάβδος की दंड, राजदंड या शाखा-सदृश छड़ी संबंधी संभावित अर्थ-व्याप्ति को किसी एक व्याख्या तक सीमित किए बिना मूल रूपक को सुरक्षित रखता है।
- source_word: τοῖς ἔθνεσι
  choice: राष्ट्रों के लिए
  rationale: यहाँ ἔθνη का बहुवचन सामूहिक जनसमुदायों को दर्शाता है; 'राष्ट्रों' से उसका व्यापक और तटस्थ अर्थ व्यक्त होता है।
- source_word: κρῖναι καὶ σῶσαι
  choice: न्याय करे और ... बचाए
  rationale: दोनों समानांतर infinitives के न्याय और उद्धार संबंधी अलग-अलग कार्यों को स्पष्ट रूप से बनाए रखा गया है।
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: जो प्रभु को पुकारते हैं
  rationale: ἐπικαλέομαι के प्रार्थनापूर्वक आह्वान के अर्थ को सामान्य, प्रतिष्ठित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ῥάβδος δικαιοσύνης की मसीहाई अथवा राजकीय पहचान
  choice: धार्मिकता की एक छड़ी
  alternative: धार्मिकता का राजदंड / धार्मिक शाखा
  rationale: पद में रूपक मौजूद है, पर उसका आशय स्पष्ट करके किसी विशिष्ट मसीहाई या राजकीय व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: κρῖναι का अर्थ
  choice: न्याय करे
  alternative: दोषी ठहराए
  rationale: κρίνω का अर्थ केवल दंडादेश नहीं, व्यापक रूप से न्याय करना भी हो सकता है; व्यापक अर्थ तनाव को सुरक्षित रखता है।
- issue: πάντας की व्यापकता
  choice: उन सबको
  alternative: कुछ लोगों को
  rationale: मूल का πάντας स्पष्ट रूप से समावेशी है और उसकी सीमा अगले संबंधवाचक वाक्यांश—जो प्रभु को पुकारते हैं—से निर्धारित होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और शास्त्रीय रूपक-संरक्षण वाला अनुवाद। ‘वह’ का प्रयोग ‘छड़ी’ के व्यक्तित्वपूर्ण कर्ता के रूप में मूल वाक्य के उद्देश्यसूचक infinitives को सहज हिन्दी में व्यक्त करता है।
