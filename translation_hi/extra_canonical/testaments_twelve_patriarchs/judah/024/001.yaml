source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἀνοιγήσονται ἐπ᾽ αὐτῷ¹⁰ οἱ οὐρανοὶ ἐκχέαι¹⁴ πνεῦμα¹⁵ εὐλογίαν πατρὸς ἁγίου¹⁶, καὶ αὐτὸς ἐκχέει ἐφ᾽ ὑμᾶς πνεῦμα χάριτος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/001.yaml
  text: He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.
translation:
  language: hi
  text: और उसके ऊपर आकाश खुल जाएँगे, ताकि पवित्र पिता की आशीषस्वरूप आत्मा[a] उंडेली जाए; और वह स्वयं तुम पर अनुग्रह की आत्मा उंडेलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र पिता की आशीष की आत्मा।”
    reason: यूनानी में ‘आत्मा’, ‘आशीष’ और ‘पवित्र पिता’ के बीच व्याकरणिक संबंध को एक से अधिक प्रकार से समझा जा सकता है।
lexical_decisions:
- source_word: ἀνοιγήσονται ἐπ᾽ αὐτῷ οἱ οὐρανοί
  choice: उसके ऊपर आकाश खुल जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य और ἐπί के स्थान/दिशा-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ यूनानी शब्द के व्यक्तिगत अथवा दैवी संकेत को अनावश्यक रूप से केवल ‘प्रभाव’ या ‘भावना’ तक सीमित नहीं किया गया।
- source_word: εὐλογίαν πατρὸς ἁγίου
  choice: पवित्र पिता की आशीषस्वरूप
  rationale: εὐλογίαν को πνεῦμα के समानाधिकरण में समझते हुए आत्मा को पवित्र पिता की ओर से मिलने वाली आशीष के रूप में व्यक्त किया गया है।
- source_word: πνεῦμα χάριτος
  choice: अनुग्रह का आत्मा
  rationale: संबंधकारक की संक्षिप्तता और धार्मिक अर्थ-गहनता को बनाए रखता है; इसे व्याख्यात्मक रूप से ‘दयालु स्वभाव’ नहीं बनाया गया।
- source_word: ἐκχέει
  choice: उंडेलेगा
  rationale: आत्मा दिए जाने के लिए प्रयुक्त मूल उंडेलने की सजीव छवि को सुरक्षित रखता है।
theological_decisions:
- issue: पहले उपवाक्य में उंडेलने वाला कर्ता
  choice: आकाश खुलेंगे, ताकि आत्मा उंडेला जाए
  alternative: वह उस पर आत्मा उंडेलेगा
  rationale: यूनानी में ‘आकाश’ स्पष्ट कर्ता है, जबकि अंग्रेज़ी परामर्श-पाठ पहले वाक्य का कर्ता ‘he’ बनाता है। हिन्दी में कर्मवाच्य रखकर स्रोत की संरचना सुरक्षित की गई और आकाश को अस्वाभाविक रूप से व्यक्तिगत कर्ता बनाकर नहीं उभारा गया।
- issue: ‘आशीष’ और ‘आत्मा’ का संबंध
  choice: आशीषस्वरूप आत्मा
  alternative: आशीष की आत्मा
  rationale: यूनानी पदबंध में समानाधिकरण और संबंधकारक का संबंध संक्षिप्त तथा कुछ हद तक अस्पष्ट है। मुख्य पाठ एक स्वाभाविक सम्भावना देता है और पादटिप्पणी वैकल्पिक संरचना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘आकाश खुल जाएँगे’ और ‘उंडेलेगा’ मूल की भविष्यसूचक तथा रूपकात्मक भाषा बनाए रखते हैं।
