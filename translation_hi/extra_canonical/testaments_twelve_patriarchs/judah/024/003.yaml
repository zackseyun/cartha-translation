  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/003.yaml
  text: '[This is the shoot of the Most High God, a spring providing life to all flesh.]'
translation:
  language: hi
  text: '[यह परमप्रधान परमेश्वर का अंकुर है, और यह वह सोता है जो सबको जीवन देता है।]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστός
  choice: कोंपल
  rationale: यह शब्द पौधे से निकलने वाली नई शाखा या अंकुर को दर्शाता है; ‘कोंपल’ इस रूपक को सहज और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: Θεοῦ ὑψίστου
  choice: परमप्रधान परमेश्वर की
  rationale: संबंधकारक पदबंध और ὑψίστου की उपाधि दोनों को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: πηγή
  choice: सोता
  rationale: यहाँ जीवन देने वाले जल-स्रोत का रूपक है; ‘सोता’ जीवित या फूटते हुए जल के प्राकृतिक स्रोत का भाव देता है।
- source_word: πᾶσι παρέχουσα ζωήν
  choice: जो सबको जीवन देता है
  rationale: παρέχουσα का सक्रिय अर्थ ‘प्रदान करना/देना’ रखा गया है और πᾶσι का अनुवाद ‘सबको’ किया गया है। यूनानी पाठ में ‘देहधारी प्राणी’ या ‘सारी देह’ के लिए कोई स्पष्ट संज्ञा नहीं है।
theological_decisions:
- issue: ‘सबको’ के दायरे की व्याख्या
  choice: सबको
  alternative: सभी प्राणियों को / सारी देह को
  rationale: πᾶσι अपने आप में व्यापक और संदर्भतः अस्पष्ट है। अनुवाद में कोई अतिरिक्त संज्ञा जोड़कर इसके दायरे को सीमित या निर्धारित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत की वर्गाकार कोष्ठक-रचना सुरक्षित रखी गई है; कोई पाद-टिप्पणी आवश्यक नहीं है।
