  text: Τότε ἀναλάμψει³¹ σκῆπτρον βασιλείας μου, καὶ ἀπὸ τῆς ῥίζης ὑμῶν²² γενήσεται πυθμήν²³·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/004.yaml
  text: Then the scepter of my kingdom will shine forth, and from your root a shoot will arise.
translation:
  language: hi
  text: तब मेरे राज्य का राजदंड चमक उठेगा, और तुम्हारी जड़ से एक अंकुर निकलेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: चमक उठेगा
  rationale: क्रिया भविष्यकाल में अचानक या प्रकट रूप से चमकने का भाव देती है; ‘चमक उठेगा’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σκῆπτρον βασιλείας μου
  choice: मेरे राज्य का राजदंड
  rationale: σκῆπτρον राजकीय अधिकार के प्रतीक राजदंड को और βασιλείας μου ‘मेरे राज्य/राजसत्ता’ को व्यक्त करता है; वाक्य की रूपकात्मकता सुरक्षित रखी गई है।
- source_word: ἀπὸ τῆς ῥίζης ὑμῶν
  choice: तुम्हारी जड़ से
  rationale: मूल पाठ के वंश-वृक्ष संबंधी रूपक और बहुवचन संबोधन ὑμῶν को यथासंभव सीधे रखा गया है; हिन्दी में ‘तुम्हारी’ का रूप एकवचन और बहुवचन दोनों संदर्भों में समान हो सकता है।
- source_word: πυθμήν
  choice: अंकुर
  rationale: शब्द का मूल अर्थ आधार, तना या वृक्ष का निचला भाग हो सकता है, पर जड़ से उत्पन्न होने के इस वनस्पति-रूपक में ‘अंकुर’ सबसे स्वाभाविक और संदर्भानुकूल हिन्दी है।
theological_decisions:
- issue: राजदंड और अंकुर के संभावित मसीहाई संकेत
  choice: रूपकों को बिना व्याख्यात्मक विस्तार के अक्षुण्ण रखा गया
  alternative: उन्हें स्पष्ट रूप से किसी मसीहाई व्यक्ति या राजा के रूप में पहचानना
  rationale: यूनानी पंक्ति स्वयं केवल राजदंड के चमकने और जड़ से अंकुर निकलने की बात कहती है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को अनुवाद में जोड़ना मूल से आगे जाना होता।
- issue: βασιλείας का अर्थ
  choice: राज्य
  alternative: राजसत्ता
  rationale: दोनों अर्थ संभव हैं। ‘मेरे राज्य का राजदंड’ अधिक स्वाभाविक है और राजकीय क्षेत्र तथा अधिकार की मूल अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। मूल के समानांतर दो रूपकों—राजदंड और जड़ से अंकुर—को स्पष्ट किए बिना सुरक्षित रखा गया है।
