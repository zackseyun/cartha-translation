  text: I caught a wild mare and, after seizing it, I subdued it.
translation:
  language: hi
  text: मैंने सिंह को मार डाला और उसके मुँह से बकरी का बच्चा छुड़ा लिया। फिर मैंने भालू को पैर से पकड़कर चट्टान से नीचे फेंक दिया,[a] और वह चकनाचूर हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्यांश का यूनानी पाठ कठिन और संभवतः विकृत है; शब्दशः इसमें ‘चट्टान को छोड़ दिया’ जैसा असंगत रूप मिलता है। प्रसंग के आधार पर अर्थ ‘चट्टान से नीचे फेंक दिया’ लिया गया है।
    reason: प्राप्त यूनानी पाठ की वास्तविक पाठगत कठिनाई छिपाए बिना प्रसंगानुकूल अनुवाद स्पष्ट करना।
lexical_decisions:
- source_word: λέοντα
  choice: सिंह
  rationale: यूनानी शब्द का सीधा और स्वाभाविक हिन्दी समकक्ष; मूल में वन्य घोड़ी नहीं, सिंह है।
- source_word: ἀφειλόμην
  choice: छुड़ा लिया
  rationale: यहाँ अर्थ किसी वस्तु को दूसरे के अधिकार या पकड़ से निकाल लेना है; ‘उसके मुँह से’ के साथ यह हिन्दी में स्वाभाविक है।
- source_word: ἔριφον
  choice: बकरी का बच्चा
  rationale: ἔριφος विशेष रूप से बकरी के बच्चे को दर्शाता है; सामान्य पाठक के लिए स्पष्ट रूप चुना गया।
- source_word: ἄρκον
  choice: भालू
  rationale: यूनानी का सामान्य और सटीक हिन्दी समकक्ष।
- source_word: συνετρίβη
  choice: चकनाचूर हो गया
  rationale: निष्क्रिय क्रिया का अर्थ बुरी तरह टूट या कुचल जाना है; गिरने के प्रसंग में यह सशक्त और स्वाभाविक है।
