  text: I know that I ran with a hind and caught it, and I made it food for my father, and he ate.
translation:
  language: hi
  text: मैं जानता हूँ कि मैं एक हिरनी के साथ दौड़ा, उसे पकड़ लिया, और उसे अपने पिता के लिए भोजन बनाया; और उन्होंने खाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: मैं जानता हूँ
  rationale: ग्रीक पूर्णरूप का वर्तमान अर्थ है, इसलिए वक्ता के दृढ़ आत्मज्ञान को सीधे व्यक्त किया गया है।
- source_word: συνέδραμον ἐλάφῳ
  choice: मैं एक हिरनी के साथ-साथ दौड़ा
  rationale: συντρέχω में साथ या बराबरी से दौड़ने का भाव है; ἐλάφῳ यहाँ संदर्भ और अंग्रेज़ी परामर्श-पाठ के अनुसार मादा हिरन के रूप में लिया गया है।
- source_word: ἐπίασα αὐτὴν
  choice: उसे पकड़ लिया
  rationale: क्रिया का सामान्य अर्थ पकड़ना या काबू में करना है; स्त्रीलिंग सर्वनाम हिरनी की ओर संकेत करता है।
- source_word: ἐποίησα αὐτὴν βρῶμα
  choice: उसका मांस … भोजन के रूप में तैयार किया
  rationale: शाब्दिक ‘उसे भोजन बनाया’ हिन्दी में अस्वाभाविक और संभावित रूप से अस्पष्ट होता; शिकार को खाने योग्य बनाने का आशय स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τῷ πατρί μου
  choice: अपने पिता के लिए
  rationale: हितार्थक सम्प्रदान को सहज हिन्दी में ‘के लिए’ से व्यक्त किया गया है।
- source_word: ἔφαγεν
  choice: उन्होंने उसे खाया
  rationale: एकवचन कर्ता पिता हैं; हिन्दी में पिता के लिए आदरसूचक बहुवचन स्वाभाविक है।
