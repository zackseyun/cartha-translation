source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔδωκέ μοι Κύριος¹ χάριν *ἐν πᾶσι τοῖς ἔργοις μου, ἐν τε² ἀγρῷ καὶ ἐν τῷ οἴκῳ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/001.yaml
  text: And the Lord gave me favor in all my works, in the field and in the house.
translation:
  language: hi
  text: और प्रभु ने मेरे सब कामों में—खेत में और घर में—मुझ पर कृपा की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκέ μοι Κύριος χάριν
  choice: प्रभु ने मुझ पर कृपा की
  rationale: यूनानी में शाब्दिक अर्थ ‘प्रभु ने मुझे कृपा दी’ है; स्वाभाविक आधुनिक हिन्दी में ‘मुझ पर कृपा की’ वही भाव स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐν πᾶσι τοῖς ἔργοις μου
  choice: मेरे सब कामों में
  rationale: ‘ἔργοις’ के व्यापक अर्थ को ‘कामों’ से रखा गया है, और ‘πᾶσι’ को ‘सब’ से पूर्ण रूप में व्यक्त किया गया है।
- source_word: ἐν τε ἀγρῷ καὶ ἐν τῷ οἴκῳ
  choice: खेत में और घर में
  rationale: दोनों कार्य-क्षेत्रों के समानांतर संबंध को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: χάριν का अर्थ
  choice: कृपा
  alternative: अनुग्रह / सफलता
  rationale: ‘कृपा’ ईश्वरीय अनुकूलता को व्यक्त करती है और इसे केवल सांसारिक सफलता तक सीमित नहीं करती; पाठ में परिणाम का अधिक विशिष्ट वर्णन नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। डैश द्वारा ‘खेत में और घर में’ को ‘सब कामों’ की व्याख्या के रूप में स्पष्ट किया गया है।
