  text: मैं जंगली सूअर पर दौड़ पड़ा, और दौड़ते हुए उसे जा पकड़ा और चीर डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ ἀγρίῳ χοίρῳ κατέδραμον
  choice: मैंने जंगली सूअर का पीछा करके उसे जा पकड़ा
  rationale: κατατρέχω यहाँ शिकार का पीछा कर अंततः जा पकड़ने/धर लेने का भाव देता है; इस अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: προέλαβον
  choice: मैंने उसे पकड़ लिया
  rationale: क्रिया का मूल भाव आगे निकलने या जा पकड़ने का हो सकता है; प्रसंग में लक्ष्य को पकड़ लेना सबसे सहज है, जबकि पहले खंड के साथ जानबूझकर बनी पुनरुक्ति भी बनी रहती है।
- source_word: ἐν τῷ τρέχειν με
  choice: दौड़ते-दौड़ते
  rationale: यह मेरे दौड़ने के दौरान घटित क्रिया को दर्शाता है; हिन्दी में यह संक्षिप्त, स्वाभाविक और स्पष्ट कालगत अभिव्यक्ति है।
- source_word: κατεσπάραξα αὐτόν
  choice: उसे चीर डाला
  rationale: κατασπαράσσω हिंसक ढंग से फाड़ने या चीरने का तीव्र भाव रखता है; ‘चीर डाला’ उसी बल को सहज हिन्दी में बनाए रखता है।
