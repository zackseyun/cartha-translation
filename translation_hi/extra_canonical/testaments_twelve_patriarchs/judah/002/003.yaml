source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Τὴν δὲ δορκάδα⁷ *διὰ τοῦ δρόμου⁸ ἐκράτουν, καὶ πᾶν ὃ ἦν ἐν τοῖς πεδίοις⁹ κατελάμβανον.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/003.yaml
  text: And I would seize the gazelle along the road, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and threw it down the cliff, and it was crushed.
translation:
  language: hi
  text: मैं दौड़ते हुए हिरनी को पकड़ लेता था,[a] और मैदानों में जो कुछ भी होता था, उसे पकड़ लेता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “मार्ग के सहारे/मार्ग में।” यूनानी पदबंध का अर्थ “दौड़ के दौरान” भी हो सकता है; यहाँ वही अर्थ मुख्य पाठ में लिया गया है।'
    reason: διὰ τοῦ δρόμου में δρόμος के ‘दौड़’ और ‘मार्ग’ संबंधी संभावित अर्थों को बिना किसी एक को अनुचित रूप से निश्चित किए सुरक्षित रखता है।
lexical_decisions:
- source_word: δορκάδα
  choice: हिरनी
  rationale: δορκάς छोटी, तेज़ दौड़ने वाली मृग-जाति के पशु—रो हिरन या गज़ेल—के लिए प्रयुक्त हो सकता है। ‘हिरनी’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और प्रजाति को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: διὰ τοῦ δρόμου
  choice: दौड़ते-दौड़ते
  rationale: δρόμος का अर्थ ‘दौड़/दौड़ना’ और कभी ‘मार्ग’ भी हो सकता है। इस प्रसंग में यह यहूदा की दौड़ने की क्षमता बताता जान पड़ता है, इसलिए साधन या गतिविधि का भाव रखा गया है।
- source_word: κατελάμβανον
  choice: जा पकड़ता था
  rationale: क्रिया में पीछा करके पहुँच जाने, धर लेने या पकड़ लेने का भाव है। अपूर्ण भूतकाल को आदतन क्रिया ‘पकड़ लेता था’ से व्यक्त किया गया है।
