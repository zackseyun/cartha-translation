  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उपलब्ध यूनानी स्रोत में केवल यही वाक्य है; अंग्रेज़ी परामर्श-पाठ में इसके बाद सिंह और भालू संबंधी वाक्य हैं, पर वे दिए गए यूनानी अंश में नहीं हैं, इसलिए उन्हें इस मसौदे में शामिल नहीं किया गया।
