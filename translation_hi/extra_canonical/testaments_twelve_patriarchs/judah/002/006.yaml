translation:
  language: hi
  text: हेब्रोन में एक तेंदुआ कुत्ते पर झपटा। मैंने उसे पूँछ से पकड़कर चट्टान पर दे मारा, और वह दो टुकड़ों में फट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάρδαλις
  choice: तेंदुआ
  rationale: यूनानी शब्द का सामान्य और स्वाभाविक हिन्दी समतुल्य।
- source_word: προσεπήδησεν ἐπὶ τὸν κύνα
  choice: कुत्ते पर झपटा
  rationale: अचानक आगे बढ़कर आक्रमण करने की क्रिया को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πιάσας αὐτὴν ἀπὸ τῆς κέρκου
  choice: उसे पूँछ से पकड़कर
  rationale: मूल की क्रिया और शरीर के अंग को सीधे बनाए रखता है; स्त्रीलिंग सर्वनाम का हिन्दी में स्वाभाविक संदर्भात्मक रूप लिया गया है।
- source_word: ἀπηκόντισα αὐτὴν ἐπὶ τὴν πέτραν
  choice: चट्टान पर दे मारा
  rationale: जोर से फेंककर चट्टान से टकराने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐρράγη εἰς δύο
  choice: वह दो टुकड़ों में फट गया
  rationale: हिंसक रूप से दो भागों में फट जाने के मूल अर्थ को स्पष्टतः सुरक्षित रखता है।
