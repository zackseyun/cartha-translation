translation:
  language: hi
  text: मुझे उस प्रदेश में एक जंगली बैल चरता हुआ मिला। उसके सींग पकड़कर मैंने उसे चारों ओर झकझोरा, अंधा कर दिया, फिर उसे पटककर मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βοῦν ἄγριον
  choice: एक जंगली साँड़
  rationale: βοῦς का अर्थ सामान्यतः गाय-बैल जाति का पशु हो सकता है, पर सींग पकड़कर उससे संघर्ष के इस प्रसंग में पुल्लिंग ‘साँड़’ स्वाभाविक और सटीक है।
- source_word: τὴν χώραν νεμόμενον
  choice: उस प्रदेश में … चरते हुए
  rationale: χώρα को व्यापक भूभाग के अर्थ में ‘प्रदेश’ और νέμομαι को पशु के चरने के सामान्य अर्थ में प्रस्तुत किया गया है।
- source_word: κρατήσας τῶν κεράτων
  choice: उसके सींग पकड़कर
  rationale: κρατέω यहाँ मजबूती से थामने का भाव देता है; हिन्दी में ‘पकड़कर’ सहज है और नियंत्रण का भाव प्रसंग से स्पष्ट रहता है।
- source_word: κύκλῳ συσσείσας
  choice: चारों ओर झकझोरा
  rationale: κύκλῳ चारों ओर/घुमाकर और συσσείω जोर से हिलाने का भाव देता है; यह अनावश्यक व्याख्या किए बिना दोनों तत्वों को रखता है।
- source_word: σκοτίσας
  choice: उसकी आँखों के आगे अँधेरा कर दिया
  rationale: शब्द का मूल अर्थ ‘अँधेरा करना’ है और प्रसंग में अंधा या चकराया कर देने का भाव हो सकता है। यह अभिव्यक्ति उस वास्तविक अस्पष्टता को बनाए रखती है।
- source_word: ῥίψας ἀνεῖλον αὐτόν
  choice: उसे पटककर मार डाला
  rationale: ῥίπτω फेंकने/पटकने और ἀναιρέω मार डालने का स्पष्ट क्रम व्यक्त करते हैं; उपलब्ध यूनानी पाठ के इस अंश को अंग्रेज़ी परामर्श-पाठ में छूट जाने पर भी अनुवाद में रखा गया है।
