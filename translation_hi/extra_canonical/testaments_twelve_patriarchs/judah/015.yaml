  text: 1[a]. The man who commits sexual immorality, even while being ruined, does not perceive it; and while being dishonored, he is not ashamed. 2. For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered. 3[b]. I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom. 4. And although I repented concerning these things, I ate neither meat nor drank wine until my old age, and I saw no joy at all. 5. And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's very support.
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 15**


    1. जो व्यभिचार करता है, वह उजाड़ा जाते हुए भी इसे नहीं समझता[a]; और अपमानित होते हुए भी लज्जित नहीं होता। 2. क्योंकि यदि कोई राजा भी हो और व्यभिचार करे, तो वह व्यभिचार का दास बनकर अपने राजपद से वंचित कर दिया जाता है—जैसा मेरे साथ भी हुआ। 3. मैंने अपनी लाठी दे दी—अर्थात् अपने गोत्र का सहारा; और अपना कमरबंद—अर्थात् अपनी शक्ति; और अपना राजमुकुट—अर्थात् अपने राज्य का गौरव। 4. इन बातों के विषय में पश्चात्ताप करने के बाद[b], मैंने बुढ़ापे तक न दाखरस पिया, न मांस खाया, और किसी भी आनंद का अनुभव नहीं किया। 5. परमेश्वर के दूत ने मुझे दिखाया कि स्त्रियाँ राजा पर अधिकार रखती हैं और निर्धन पर प्रभुता करती हैं[c]। वे राजा से उसका गौरव, पुरुष से उसकी शक्ति, और निर्धन से उसका अल्पतम सहारा तक छीन लेती हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक चित्र है, “निर्वस्त्र किया जाते हुए भी”; यहाँ इसका आशय उजाड़े जाने या वंचित किए जाने से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “इन बातों के विषय में अपना मन बदलने के बाद” भी हो सकता है; संदर्भ में पश्चात्ताप का भाव प्रबल है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी कथन संक्षिप्त और कठोर है तथा सामान्य रूप से “स्त्रियाँ” कहता है; मूल पाठ स्वयं इसे केवल किसी विशेष प्रकार की स्त्रियों तक सीमित नहीं करता।
    reason: discourse_clarification
lexical_decisions:
- source_word: πορνεύσας / πορνεύῃ / πορνείᾳ
  choice: व्यभिचार करता है / व्यभिचार / व्यभिचार का
  rationale: यह पद यौन अनैतिकता का स्पष्ट नैतिक अर्थ रखता है। ‘व्यभिचार’ आधुनिक हिन्दी में संक्षिप्त, गंभीर और सामान्यतः बोधगम्य है; अलग-अलग रूपों में क्रिया और दासता की संज्ञा दोनों स्वाभाविक रहती हैं।
- source_word: γυμνούμενος
  choice: सब कुछ से वंचित होते हुए
  rationale: मूल अर्थ ‘निर्वस्त्र/उघाड़ा किया जाना’ है। सन्दर्भ में यह प्रतिष्ठा और पद छिनने की छवि है; हिन्दी में अर्थ स्पष्ट रखने के लिए ‘वंचित’ चुना गया, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: ἀδοξῶν
  choice: अपमानित होते हुए
  rationale: यह गौरव या प्रतिष्ठा खोने का भाव व्यक्त करता है और आगे राजकीय गौरव छिनने से अर्थगत सम्बन्ध बनाए रखता है।
- source_word: γυμνοῦται τῆς βασιλείας
  choice: अपने राजपद से वंचित कर दिया जाता है
  rationale: यहाँ βασιλεία व्यक्ति की राजकीय सत्ता या पद को सूचित करती है, न कि केवल भौगोलिक राज्य को। निष्क्रिय रूप मूल में किसी वस्त्र की तरह पद छिन जाने की तीव्र छवि रखता है।
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: व्यभिचार का दास बनकर
  rationale: दासता की मूल उपमा को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है; इसे केवल ‘आदत पड़ना’ कहकर नैतिक अधीनता को हल्का नहीं किया गया।
- source_word: ῥάβδος
  choice: लाठी
  rationale: अगला स्पष्टीकरण इसे गोत्र का ‘सहारा’ कहता है, इसलिए ‘लाठी’ वस्तु और सहारे की दोहरी छवि को ‘राजदंड’ से बेहतर बनाए रखती है।
- source_word: ζώνη
  choice: कमरबंद
  rationale: यह सामान्य आधुनिक हिन्दी में पहचाना जाने वाला वस्त्र है और उसके प्रतीकात्मक अर्थ ‘शक्ति’ को स्पष्ट रहने देता है।
- source_word: διάδημα
  choice: राजमुकुट
  rationale: διάδημα राजकीय चिह्न है। ‘राजमुकुट’ सामान्य पाठक को इसका आशय तुरंत बताता है और राजकीय गौरव से इसका सम्बन्ध स्पष्ट करता है।
- source_word: μετανοήσας
  choice: पश्चात्ताप करने के बाद
  rationale: यहाँ यहूदा अपने पाप के प्रति प्रतिक्रिया और उसके बाद के कठोर संयम का वर्णन करता है; इसलिए केवल संज्ञानात्मक ‘मन बदलना’ से अधिक उपयुक्त penitential अर्थ ‘पश्चात्ताप’ है। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: न दाखमधु पिया, न मांस खाया
  rationale: यूनानी में एक ही क्रिया दोनों संज्ञाओं पर लागू है, पर हिन्दी में पेय के साथ ‘पिया’ और भोजन के साथ ‘खाया’ जोड़ना आवश्यक और स्वाभाविक है। ‘दाखमधु’ οἶνος को मदिरायुक्त अंगूरी पेय के रूप में स्पष्ट रखता है।
- source_word: εὐφροσύνην
  choice: आनंद
  rationale: यह प्रसन्नता या उत्सवी हर्ष का व्यापक भाव देता है। ‘किसी भी आनंद’ πᾶσαν के व्यापक निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κρατοῦσι / κατακυριεύουσιν
  choice: वश में कर लेती हैं / प्रभुता करती हैं
  rationale: 'दोनों यूनानी क्रियाओं की समान लेकिन अलग तीव्रता को बचाया गया है: पहली नियंत्रण या पकड़, दूसरी प्रभुतापूर्ण आधिपत्य व्यक्त करती है।'
- source_word: ἐλάχιστον στήριγμα
  choice: बचा-खुचा सहारा तक
  rationale: शाब्दिक अर्थ ‘सबसे छोटा/अत्यल्प सहारा’ है। ‘बचा-खुचा’ निर्धन के पास उपलब्ध अत्यल्प साधन का भाव सामान्य हिन्दी में प्रभावी ढंग से देता है।
theological_decisions:
- issue: μετανοήσας में मानसिक परिवर्तन और नैतिक पश्चात्ताप के बीच अर्थ-चयन
  choice: पश्चात्ताप करने के बाद
  alternative: इन बातों के विषय में मन बदलने के बाद
  rationale: पाप की स्वीकारोक्ति, त्यागी हुई वस्तुओं और दीर्घकालीन संयम का निकट सन्दर्भ नैतिक पश्चात्ताप को प्रमुख बनाता है। फिर भी क्रिया में ‘मन बदलने’ का व्यापक अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: पद 5 में स्त्रियों के विषय में व्यापक नकारात्मक कथन
  choice: वक्ता के सार्वत्रिक कथन को बिना समर्थन, नरमी या विस्तार के सीधे अनूदित किया गया
  alternative: इसे केवल प्रलोभक स्त्रियों, व्यभिचारी सम्बन्धों या किसी विशिष्ट स्त्री तक सीमित करना
  rationale: प्राप्त यूनानी पाठ αἱ γυναῖκες सामान्य बहुवचन प्रयोग करता है और स्वयं कोई स्पष्ट सीमा नहीं जोड़ता। अनुवाद को लेखक के दावे को ईमानदारी से प्रस्तुत करना चाहिए, न उसे आधुनिक सहमति बनाना चाहिए और न चुपचाप उसका दायरा बदलना चाहिए।
- issue: पद 5 की संक्षिप्त त्रिस्तरीय समानांतर रचना
  choice: राजा का गौरव, पुरुष की शक्ति और निर्धन का सहारा—तीनों को अलग-अलग रखा गया
  alternative: राजा की महिमा और शक्तिशाली पुरुष की शक्ति को एक ही पदबंध मानना, अथवा सामाजिक श्रेणियों को ‘सभी लोगों’ में समेट देना
  rationale: मूल वाक्य रचना संक्षिप्त और कुछ असमतल है, पर उपलब्ध शब्द तीन हानियों को क्रमशः रखता है। हिन्दी में न्यूनतम पूर्ति के साथ वही तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘राजपद’, ‘गोत्र’, ‘कमरबंद’, ‘राजमुकुट’ और ‘परमेश्वर का दूत’ जैसे शब्द मूल के ऐतिहासिक-धार्मिक वातावरण को रखते हैं, जबकि अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है। अंग्रेज़ी परामर्श-पाठ के विपरीत पद 5 में ‘सदा’ नहीं जोड़ा गया, क्योंकि प्रस्तुत यूनानी स्रोत में उसके अनुरूप कोई शब्द नहीं है; और पद 1 का γυμνούμενος वास्तविक स्रोत-पाठ के अनुसार अनूदित किया गया है।
