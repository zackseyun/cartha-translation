base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/003.yaml
  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
translation:
  language: hi
  text: परन्तु माकीर के लोग पाँचवें दिन फिर हम पर चढ़ आए; और उन पर प्रबल तलवार से धावा बोलते हुए[a], हम उन पर भारी पड़े और चढ़ाई पर चढ़ने से पहले ही उन्हें मार डाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी क्रिया προσδίδωσι व्याकरण की दृष्टि से असामान्य है: प्रथम पुरुष बहुवचन में भूतकालीन वर्णन के बीच अचानक तृतीय पुरुष एकवचन वर्तमान काल आ जाता है। सम्भव है कि यह किसी सहभागी पदबंध—अर्थात् ‘उनके विरुद्ध अपने को झोंकते हुए’—का लिपिकीय संक्षेप या बिगड़ा हुआ रूप हो। मूल पाठ को बदले बिना अनुवाद में प्रसंग से प्रकट आक्रामक कार्रवाई का भाव दिया गया है।'
    reason: textual_variant
  - marker: b
    text: τὴν ἀνάβασιν, ἀναβῆναι के साथ उसी धातु से बनी कर्मकारक संज्ञा है—शाब्दिक अर्थ, ‘चढ़ाई को चढ़ना’। यह उस ढलान, दर्रे या सुरक्षित पहुँच-मार्ग को सूचित कर सकता है जिस तक शत्रु पहुँचने या जिस पर चढ़ने का प्रयास कर रहे थे।
    reason: lexical_note
lexical_decisions:
- source_word: ἐπῆλθον ἡμῶν
  choice: हम पर चढ़ आए
  rationale: ἐπέρχομαι यहाँ व्यक्ति के सम्बन्ध में शत्रुतापूर्ण आगे बढ़ने या आक्रमण करने का भाव रखता है। ‘हम पर चढ़ आए’ स्वाभाविक हिन्दी में उस आक्रामक गति को बनाए रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रियाविशेषण दोबारा किए गए आक्रमण को सूचित करता है; ‘फिर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: प्रबल तलवार से
  rationale: κραταιός का अर्थ प्रबल या सामर्थी और μάχαιρα का अर्थ तलवार है; ἐν यहाँ साधन का बोध कराता है। यह चयन मूल की युद्ध-संबंधी गरिमा को रखता है।
- source_word: περιγινόμεθα αὐτῶν
  choice: हम उन पर भारी पड़े
  rationale: περιγίγνομαι के साथ सम्बन्धकारक का अर्थ किसी पर बढ़त पाना या विजय पाना है। ‘भारी पड़े’ आधुनिक हिन्दी में युद्धगत श्रेष्ठता को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἀναβῆναι τὴν ἀνάβασιν
  choice: चढ़ाई पर चढ़ने
  rationale: मूल में एक ही धातु से बने क्रिया और संज्ञा का प्रयोग है—शाब्दिक रूप से ‘चढ़ाई को चढ़ना’। हिन्दी में ‘चढ़ाई पर चढ़ना’ उस पुनरुक्ति और दिशात्मक-सामरिक भाव को यथासम्भव सुरक्षित रखता है।
