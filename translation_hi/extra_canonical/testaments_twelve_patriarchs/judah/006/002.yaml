source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ *συνάψαντες ἐτρέψαμεν⁴ αὐτοὺς⁵ καὶ τοὺς ἀπὸ Σιλὼμ⁶ συμμάχους αὐτῶν⁷ ἀπεκτείναμεν⁸ καὶ οὐκ ἐδώκαμεν αὐτοῖς⁹ διέξοδον¹⁰ τοῦ εἰσελθεῖν πρὸς ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/002.yaml
  text: And when we joined battle, we routed them; and we killed those from Shiloh, their allies, and gave them no way of escape.
translation:
  language: hi
  text: और जब हम उनसे युद्ध में भिड़े, तो हमने उन्हें खदेड़ दिया; और शीलो से आए उनके सहयोगियों को मार डाला। हमने उन्हें हमारी ओर आने का कोई मार्ग नहीं दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक भाव है, “हमारी ओर आने/प्रवेश करने का कोई मार्ग नहीं दिया।” कुछ अनुवाद इसे युद्ध से निकल भागने का मार्ग न मिलने के अर्थ में लेते हैं।
    reason: अंतिम यूनानी वाक्यांश और प्रसंगगत ‘बच निकलने’ वाले अर्थ के बीच वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: συνάψαντες
  choice: जब हम उनसे युद्ध में भिड़े
  rationale: संदर्भ में यह युद्ध आरम्भ करने या युद्ध में भिड़ने का भाव देता है; कालगत कृदन्त को स्वाभाविक हिन्दी उपवाक्य के रूप में रखा गया है।
- source_word: ἐτρέψαμεν
  choice: हमने उन्हें खदेड़ दिया
  rationale: युद्ध के प्रसंग में क्रिया का अर्थ शत्रु को पीछे हटने या भागने पर विवश करना है।
- source_word: Σιλώμ
  choice: शीलो
  rationale: यह बाइबलीय स्थान-नाम Shiloh का प्रचलित हिन्दी लिप्यंतरण है, यद्यपि यूनानी रूप Σιλώμ है।
- source_word: συμμάχους
  choice: सहयोगियों
  rationale: यह युद्ध में साथ देने वाले मित्र-पक्ष या सहयोद्धाओं को सूचित करता है; आधुनिक पाठक के लिए 'सहयोगी' स्पष्ट और स्वाभाविक है।
- source_word: διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς
  choice: हमारे पास पहुँचने का कोई रास्ता
  rationale: यह यूनानी के 'हमारी ओर/हमारे पास प्रवेश करने का मार्ग' को सीधे बनाए रखता है और अंग्रेज़ी परामर्श-पाठ के 'escape' अर्थ को बिना पर्याप्त स्रोत-आधार के मुख्य पाठ में नहीं लाता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, प्रवाहपूर्ण और गरिमापूर्ण रखी गई है। युद्ध-वर्णन की तीव्रता बनी रहती है, जबकि अंतिम वाक्यांश की स्रोतगत अस्पष्टता को मुख्य पाठ और पादटिप्पणी में स्पष्ट किया गया है।
