    issue: Final directional phrase is somewhat softened.
    rationale: “हमारे पास पहुँचने” can suggest simply arriving at a destination. The Greek πρὸς ἡμᾶς more directly means “toward us/to us”; “हमारी ओर आने” retains this force while preserving the difficult sense of the whole expression.
