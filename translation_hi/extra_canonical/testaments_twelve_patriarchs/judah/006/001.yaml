- source_word: οἱ ἀπὸ Ἰωβὴλ
  choice: योबेल के लोग
  rationale: ἀπό किसी स्थान से आने या उससे संबंधित लोगों को दर्शाता है; हिन्दी में ‘योबेल के लोग’ सहज और अर्थनिष्ठ है।
- source_word: ἦλθον ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: हमसे युद्ध करने आ गए
  rationale: ἐπί के विरोधात्मक भाव और εἰς πόλεμον के उद्देश्य को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
