  text: And as we came to the city[a], their women were rolling stones down on us from the summit of the mountain on which the city stood.
translation:
  language: hi
  text: और जब हम नगर पहुँचे[a], तो उनकी स्त्रियाँ उस पहाड़ की चोटी से, जिस पर नगर बसा था, नीचे हमारी ओर पत्थर लुढ़का रही थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्रोत-पाठ में τῇ τῇ πόλει है—सम्प्रदान कारक के निश्चित उपपद τῇ की अनजाने में हुई पुनरावृत्ति, जो स्पष्टतः प्रतिलिपिकार की भूल है। अनुवाद एक ही τῇ πόλει, अर्थात् ‘नगर पहुँचे’, पढ़ता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκύλιον
  choice: लुढ़का रही थीं
  rationale: अपूर्ण भूतकाल चलती या बार-बार की जा रही कार्रवाई को दर्शाता है; यह रूप उस निरंतर रक्षात्मक प्रहार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λίθους ἐφ’ ἡμᾶς
  choice: नीचे हमारी ओर पत्थर
  rationale: λίθους का अर्थ ‘पत्थर’ है और ἐφ’ ἡμᾶς शत्रुतापूर्ण दिशा बताता है। ‘नीचे हमारी ओर’ पहाड़ी भूस्थिति और हमलावर गति दोनों को स्पष्ट करता है।
- source_word: κορυφῆς τοῦ ὄρους
  choice: पहाड़ की चोटी
  rationale: κορυφή सबसे ऊपरी भाग या शिखर और ὄρος पहाड़ को सूचित करता है; ‘पहाड़ की चोटी’ सटीक तथा सामान्य आधुनिक हिन्दी है।
- source_word: ἐν ᾗ ἦν ἡ πόλις
  choice: जिस पर नगर बसा था
  rationale: यह संबंधवाचक उपवाक्य पहाड़ को नगर के स्थान के रूप में पहचानता है। ‘बसा था’ हिन्दी में नगर की स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
