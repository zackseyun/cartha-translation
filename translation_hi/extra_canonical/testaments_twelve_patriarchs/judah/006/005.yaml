  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/005.yaml
  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
translation:
  language: hi
  text: और मैंने शिमोन और अन्य लोगों[a] को उनके पीछे[b] छिपा दिया, और हमने ऊँची भूमि पर अधिकार कर लिया और इस नगर को भी पूरी तरह नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पदबंध का शाब्दिक रूप अस्पष्ट है: “शिमोन और साथ ही [कोई अन्य]” अथवा “उस व्यक्ति को शिमोन के साथ।” दूसरे व्यक्ति या दल का नाम नहीं दिया गया है। यहाँ “अन्य लोगों” उस अनिर्दिष्ट पक्ष को व्यक्त करता है।'
    reason: lexical_note
  - marker: b
    text: यहाँ प्रयुक्त दुर्लभ यूनानी क्रिया-विशेषण का अर्थ “पीछे” या “पीछे से” है। इससे संकेत मिलता है कि छिपा हुआ दल शत्रुओं के पीछे से आक्रमण करने के लिए रखा गया था।
    reason: cultural_note
lexical_decisions:
- source_word: ὑποκρύψας
  choice: मैंने ... छिपा दिया
  rationale: यह क्रिया जान-बूझकर किसी को ओट में रखने या छिपाने को व्यक्त करती है। यूनानी एकवचन कृदन्त यह संकेत करता है कि यह काम यहूदा ने किया, जबकि आगे की मुख्य क्रियाएँ बहुवचन में हैं; हिन्दी में इसे स्पष्ट उपवाक्य बनाकर स्वाभाविक रूप से रखा गया है।
- source_word: τὸν τε καὶ Συμεὼν
  choice: शिमोन और उसके साथ के लोगों
  rationale: पाठ की τε ... καί रचना शिमोन को किसी अन्य व्यक्ति या दल के साथ जोड़ती है, पर उस दूसरे पक्ष का नाम स्पष्ट नहीं है। यह अनुवाद सैन्य प्रसंग में उस अनिर्दिष्ट साथियों के दल को सहज हिन्दी में व्यक्त करता है, और पाठगत अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखता है।
- source_word: ἐξωπίσθεν
  choice: उनके पीछे
  rationale: दुर्लभ क्रिया-विशेषण पीछे की ओर या पीछे से होने का भाव देता है। यहाँ यह शत्रु के पीछे छिपाकर रखे गए दल की स्थिति बताता है।
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: हमने ऊँचे स्थान पर अधिकार कर लिया
  rationale: ἐπιλαμβάνομαι संबंधकारक के साथ पकड़ लेने या अधिकार में लेने का अर्थ देता है, और substantival ὑψηλοῦ किसी ऊँचे स्थान अथवा ऊँची भूमि को सूचित करता है। यह चयन सैन्य प्रसंग में स्वाभाविक है और इसे अनावश्यक रूप से 'शिखर' तक सीमित नहीं करता।
- source_word: ἐξωλοθρεύσαμεν
  choice: पूरी तरह नष्ट कर दिया
  rationale: तीव्रार्थक संयुक्त क्रिया सम्पूर्ण विनाश का बोध कराती है। 'पूरी तरह नष्ट कर दिया' आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी में उस तीव्रता को बनाए रखता है।
- source_word: καὶ ταύτην τὴν πόλιν
  choice: इस नगर को भी
  rationale: καί का योगात्मक बल बताता है कि यह नगर भी पहले वर्णित विजयों की शृंखला में सम्मिलित था।
