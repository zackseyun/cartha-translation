lexical_decisions:
- source_word: ἐνόμιζον
  choice: मैंने समझा
  rationale: यहाँ क्रिया वक्ता की उस समय की धारणा व्यक्त करती है; ‘मैंने समझा’ स्वाभाविक हिन्दी में इसी अर्थ को रखता है।
- source_word: οὐδεὶς ἔγνω
  choice: किसी को पता नहीं था
  rationale: शाब्दिक ‘किसी ने नहीं जाना’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है और अज्ञान की स्थिति को ठीक व्यक्त करता है।
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: मैं उसके पास गया था
  rationale: यूनानी वाक्यांश का मूल स्थानगत अर्थ सुरक्षित रखा गया है; प्रसंगगत यौन संकेत को खुलकर जोड़कर अस्पष्टता का समाधान नहीं किया गया।
theological_decisions:
- issue: ‘उसके पास गया’ में संभावित यौन संकेत
  choice: अप्रत्यक्ष अभिव्यक्ति को बनाए रखा गया
  alternative: मैंने उसके साथ शारीरिक संबंध बनाया था
  rationale: यूनानी εἰσῆλθον πρὸς αὐτήν स्वयं अप्रत्यक्ष है। अधिक स्पष्ट अनुवाद स्रोत की वास्तविक अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण कर देता।
