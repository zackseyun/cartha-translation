  text: I was forty-six years old, and I spent seventy-three years in Egypt.
translation:
  language: hi
  text: मैं छियालीस वर्ष का था, और मैंने मिस्र में तिहत्तर वर्ष बिताए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤμην δὲ ἐγὼ
  choice: मैं ... था
  rationale: δὲ यहाँ हल्का संयोजक/विषय-परिवर्तन सूचक है; हिन्दी में आरम्भिक ‘अब’ या ‘परन्तु’ जोड़ना अप्राकृतिक और अर्थ की दृष्टि से अनावश्यक होता। स्पष्ट ἐγὼ का भाव ‘मैं’ से बना रहता है।
- source_word: ἐτῶν τεσσαράκοντα καὶ ἕξ
  choice: छियालीस वर्ष का
  rationale: आयु व्यक्त करने का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα
  choice: तिहत्तर वर्ष बिताए
  rationale: समयावधि के साथ ποιέω का अर्थ यहाँ ‘वर्ष बिताना’ है; शब्दशः ‘किए’ हिन्दी में अस्वाभाविक होगा।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र में
  rationale: यद्यपि εἰς सामान्यतः दिशा सूचित करता है, ‘वर्ष बिताए’ के संदर्भ में यह मिस्र में निवास की अवधि बताता है; हिन्दी में ‘मिस्र में’ स्पष्ट और स्वाभाविक है।
