  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। नाम Ἐνὰν को स्रोत के अनुसार ‘एनान’ लिप्यंतरित किया गया है। अंग्रेज़ी परामर्श-पाठ के अंतिम ‘of the inn’ को ग्रहण नहीं किया गया, क्योंकि दिए गए प्राथमिक यूनानी पाठ में उसके अनुरूप कोई शब्द नहीं है।
