  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/001.yaml
  text: After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal attire and sat in Enaim, at the city gate of the inn.
translation:
  language: hi
  text: 12:1 इसके बाद, जब तामार को विधवा हुए दो वर्ष हो गए और उसने सुना कि मैं भेड़ों की ऊन कतरने ऊपर जा रहा हूँ, तो वह विवाह के परिधान पहनकर सज-सँवर गई और एनान नगर के फाटक के पास बैठ गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμὰρ μετὰ ἔτη δύο
  choice: जब तामार को विधवा हुए दो वर्ष हो गए
  rationale: ग्रीक संबंधकारक निरपेक्ष रचना को स्वाभाविक आधुनिक हिन्दी में कालसूचक उपवाक्य के रूप में व्यक्त किया।
- source_word: ἀνέρχομαι
  choice: मैं ... ऊपर जा रहा हूँ
  rationale: वक्ता के प्रथम पुरुष और क्रिया में निहित ऊपर जाने के भाव, दोनों को बनाए रखा।
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: भेड़ों की ऊन कतरने
  rationale: ग्रीक में शाब्दिक रूप से ‘भेड़ों को कतरना’ है; हिन्दी में प्रयोजन को स्पष्ट और स्वाभाविक बनाने के लिए ‘ऊन’ जोड़ा गया।
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: दुल्हन के वस्त्रों से अपना श्रृंगार किया
  rationale: क्रिया और संज्ञा की ध्वन्यात्मक पुनरुक्ति को यथासंभव रखते हुए νυμφικός का विवाह-संबंधी परिधान वाला अर्थ व्यक्त किया।
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: एनान नगर के फाटक के पास
  rationale: प्राथमिक यूनानी पाठ में ‘एनान में, नगर में, फाटक के पास’ है। इसे हिन्दी में स्वाभाविक भौगोलिक वाक्यांश बनाया; ‘सराय’ मूल यूनानी में नहीं है, इसलिए नहीं जोड़ा।
