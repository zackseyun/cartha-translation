translation:
  language: hi
  text: क्योंकि मैंने कहा, “कहीं ऐसा न हो कि उसने किसी और से गिरवी की वस्तुएँ लेकर छल किया हो और मुझसे बात करते समय पहले वाली बातों का इस्तेमाल किया हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον γάρ
  choice: क्योंकि मैंने कहा
  rationale: अपूर्णकालीन ἔλεγον कथात्मक संदर्भ में कही गई सोच को प्रस्तुत करता है; स्वाभाविक हिन्दी में ‘मैंने कहा’ उपयुक्त है।
- source_word: Μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंका या संशय व्यक्त करता है; हिन्दी का यह प्रयोग उस अनिश्चितता को बनाए रखता है।
- source_word: ἐν δολιότητι ἐποίησε
  choice: छल किया हो
  rationale: शाब्दिक अर्थ ‘छलपूर्वक किया’ है; ‘छल किया हो’ आधुनिक हिन्दी में सहज और अर्थ-सटीक है।
- source_word: παρὰ ἑτέρας λαβοῦσα
  choice: किसी और से ... लेकर
  rationale: ἑτέρας को लिंग या पहचान से अधिक विशिष्ट किए बिना ‘किसी और’ रखा गया है।
- source_word: τοὺς ἀρραβῶνας
  choice: गिरवी की वस्तुएँ
  rationale: बहुवचन संज्ञा उन वस्तुओं को सूचित करती है जो प्रतिज्ञा या भुगतान की जमानत के रूप में दी गई थीं; केवल ‘गिरवी’ की अपेक्षा यह हिन्दी में अधिक स्पष्ट है।
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: मुझसे वही बातें कही हों जो उसने पहले कही थीं
  rationale: मुहावरे का अर्थ पहले प्रयुक्त कथनों को फिर से सामने वाले से कहना है; यह अनुवाद πρώτοις के पूर्व-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
