translation:
  language: hi
  text: इसलिए दाखमधु पीकर मतवाला हो जाने पर मैं उसे पहचान न सका, और उसके शृंगार के बाहरी रूप के माध्यम से उसकी सुंदरता ने मुझे धोखा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς … οἴνῳ
  choice: दाखमधु पीकर मतवाला हो गया
  rationale: कृदंत और करणवाचक संज्ञा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘दाखमधु’ मदिराजन्य अंगूरी पेय का अर्थ स्पष्ट रखता है।
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: मैंने उसे नहीं पहचाना
  rationale: ἐπιγινώσκω के प्रसंगानुकूल अर्थ ‘पहचानना’ को सीधे सुरक्षित रखता है।
- source_word: ἠπάτησέ με
  choice: उसने … मुझे धोखा दिया
  rationale: क्रिया के सक्रिय भाव और प्रथम पुरुष कर्म को स्पष्टतः बनाए रखता है।
- source_word: τὸ κάλλος αὐτῆς
  choice: अपनी सुंदरता के द्वारा
  rationale: सुंदरता को छल के साधन के रूप में प्रस्तुत करने वाले यूनानी वाक्य-संबंध को व्यक्त करता है।
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: अपने शृंगार के बाहरी रूप से
  rationale: σχῆμα के दृश्य बाहरी रूप और κόσμησις के सजने-सँवरने/शृंगार के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: छल में सुंदरता और शृंगार के बाहरी रूप का परस्पर संबंध
  choice: 'दोनों साधनात्मक पदों को बनाए रखा: ‘अपने शृंगार के बाहरी रूप से, अपनी सुंदरता के द्वारा’'
  alternative: ‘अपने शृंगार की सुंदर छटा से’ जैसे एकीकृत रूप में अनुवाद
  rationale: मूल पाठ के κάλλος और σχῆμα τῆς κοσμήσεως को मिलाकर एक अर्थ कर देने के बजाय उनके तनाव और संबंध को खुला रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। मूल यूनानी की साधनात्मक अभिव्यक्तियों को कुछ औपचारिकता के साथ अलग-अलग रखा गया है, ताकि कोई स्रोत-तत्त्व लुप्त न हो।
