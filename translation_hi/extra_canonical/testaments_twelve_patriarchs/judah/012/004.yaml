  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/004.yaml
  text: And turning aside to her, I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived.
translation:
  language: hi
  text: 4. तब उसकी ओर मुड़कर मैंने कहा, “मैं तुम्हारे पास आऊँगा।” उसने कहा, “तुम मुझे क्या दोगे?” मैंने अपनी लाठी और अपना राजमुकुट उसे जमानत के तौर पर दे दिया। और जब मैं उसके पास गया, तो वह गर्भवती हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: उसकी ओर मुड़कर
  rationale: यह दिशा बदलकर स्त्री की ओर जाने या मुड़ने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Εἰσέρχομαι πρὸς σε
  choice: मैं तुम्हारे पास आना चाहता हूँ
  rationale: यौन आशय वाले यूनानी शिष्टोक्ति-प्रयोग को हिन्दी में संकेतात्मक किंतु बोधगम्य रखा गया है; इसे अनावश्यक रूप से आरंभ में ही स्पष्ट नहीं किया गया।
- source_word: ῥάβδος
  choice: लाठी
  rationale: यह हाथ में रखी जाने वाली छड़ी या लाठी का सामान्य अर्थ देता है और आधुनिक पाठक के लिए सहज है।
- source_word: διάδημα
  choice: राजमुकुट
  rationale: διάδημα राजसत्ता सूचित करने वाला मुकुट या शिरोबंध है; प्रसंग में 'राजमुकुट' स्वाभाविक और गरिमापूर्ण है, पर स्रोत में अलग से 'मेरे राज्य का' नहीं है।
- source_word: εἰς ἀρραβῶνα
  choice: बंधक के रूप में
  rationale: वस्तुओं को भविष्य के भुगतान की जमानत या गिरवी के रूप में देने का भाव स्पष्ट करता है।
- source_word: συνήλθον αὐτῇ
  choice: मैंने उसके साथ सहवास किया
  rationale: इस प्रसंग में साथ आने का वाक्यांश यौन संबंध का शिष्टोक्ति-प्रयोग है; हिन्दी में परिणाम से संबंध स्पष्ट रखने हेतु स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: συνελήφθη
  choice: वह गर्भवती हो गई
  rationale: इस संदर्भ में क्रिया का अर्थ गर्भ धारण करना है।
theological_decisions:
- issue: अंग्रेज़ी परामर्श-पाठ में 'मेरी अंगूठी' और 'मेरे राज्य का' का होना
  choice: इन दोनों तत्वों को अनुवाद में नहीं जोड़ा गया
  alternative: “अपनी लाठी, अपनी अंगूठी और अपने राज्य का राजमुकुट”
  rationale: प्रदत्त प्राथमिक यूनानी पाठ में केवल τὴν ῥάβδον μου καὶ τὸ διάδημά μου, अर्थात् 'मेरी लाठी और मेरा राजमुकुट', है। इसलिए अंग्रेज़ी परामर्श-पाठ के अतिरिक्त शब्दों को मूल-साक्ष्य पर वरीयता नहीं दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। आरंभिक प्रस्ताव में मूल की शिष्टोक्ति बनाए रखी गई है, जबकि बाद की क्रिया को प्रसंगानुसार स्पष्ट किया गया है।
