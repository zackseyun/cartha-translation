  text: Yet those in the city said that there had been no prostitute at the gate, because she had come from another place and sat at the gate for a short time.
translation:
  language: hi
  text: 9 फिर भी नगर के लोगों ने कहा कि फाटक पर कोई वेश्या नहीं थी, क्योंकि वह किसी दूसरी जगह से आई थी और थोड़ी देर के लिए फाटक पर बैठी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  choice: नगर के लोग
  rationale: यह स्वाभाविक हिन्दी में नगर के निवासियों को व्यक्त करता है, बिना यह जोड़े कि बोलने वाले सभी निवासी थे।
- source_word: πύλη
  choice: फाटक
  rationale: संदर्भ में यह नगर के प्रवेश-द्वार को सूचित करता है; ‘फाटक’ सामान्य पाठक के लिए सहज और स्पष्ट है।
- source_word: τελεσικόμενον
  choice: वेश्या
  rationale: इस दुर्लभ और पाठगत रूप से कठिन शब्द का आशय प्रसंग तथा यूनानी संस्करण की व्याख्यात्मक परंपरा में देह-व्यापार करने वाली स्त्री है; हिन्दी में ‘वेश्या’ संक्षिप्त, गरिमापूर्ण और प्रत्यक्ष है।
- source_word: πρὸς βραχύ
  choice: थोड़ी देर के लिए
  rationale: यह वाक्यांश उसके फाटक पर बैठने की अल्प अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξ ἄλλου χωρίου
  choice: किसी दूसरी जगह से
  rationale: χωρίον के व्यापक स्थान-संबंधी अर्थ को बनाए रखता है और अनावश्यक रूप से ‘गाँव’ या किसी विशिष्ट बस्ती का अर्थ नहीं थोपता।
