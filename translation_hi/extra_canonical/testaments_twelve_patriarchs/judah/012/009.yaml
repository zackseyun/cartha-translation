translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। यूनानी वाक्य के कारण-संबंध और इस तनाव को बनाए रखा गया है कि नगरवासी उसे स्थानीय वेश्या नहीं मानते थे, क्योंकि वह बाहर से आकर केवल थोड़ी देर फाटक पर बैठी थी।
