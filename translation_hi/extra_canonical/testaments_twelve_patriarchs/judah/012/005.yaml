  text: But I, not knowing what I had done, wanted to kill her. But she sent the pledges secretly and put me to shame.
translation:
  language: hi
  text: 5 पर मैं यह नहीं जानता था कि मैंने क्या किया था, मैं उसे मार डालना चाहता था। लेकिन उसने वे जमानत की वस्तुएँ[a] गुप्त रूप से भेज दीं और मुझे लज्जित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, गिरवी रखी हुई वस्तुएँ; ये आश्वासन और पहचान के लिए दी गई वस्तुएँ थीं।
    reason: ἀρραβῶνας जमानत या गिरवी के रूप में दी गई वस्तुओं को सूचित करता है; पादटिप्पणी अर्थ की व्याख्या करती है, बिना यह निश्चित किए कि कौन-सी विशिष्ट वस्तुएँ अभिप्रेत हैं।
lexical_decisions:
- source_word: Ἀγνοῶν
  choice: यह नहीं जानता था
  rationale: वर्तमान कृदंत का प्रसंगानुकूल भूतकालीन भाव व्यक्त करता है और यह बनाए रखता है कि यहूदा अपने किए की पहचान से अनजान था।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: यहाँ क्रिया का सीधा अर्थ जान से मार देना है; सरल और स्वाभाविक हिन्दी में इसकी गंभीरता सुरक्षित रहती है।
- source_word: τοὺς ἀρραβῶνας
  choice: वे निशानियाँ
  rationale: संदर्भ में ये पहचान सिद्ध करने के लिए गिरवी रखी हुई वस्तुएँ हैं। मुख्य पाठ में सहज 'निशानियाँ' और पादटिप्पणी में शाब्दिक अर्थ देने से संदर्भ स्पष्ट रहता है।
- source_word: κατῄσχυνέ
  choice: लज्जित कर दिया
  rationale: क्रिया के अपमानित अथवा लज्जित करने के भाव को बिना यह तय किए सुरक्षित रखता है कि यह केवल निजी शर्म थी या सार्वजनिक निरुत्तरता।
theological_decisions:
- issue: यहूदा की अज्ञानता और उत्तरदायित्व के बीच तनाव
  choice: “यह नहीं जानता था कि मैंने क्या किया है” को सीधे रखा गया
  alternative: “उसे पहचान न पाने के कारण”
  rationale: मूल यूनानी व्यापक और कुछ हद तक अस्पष्ट है; उसे केवल स्त्री की पहचान तक सीमित कर देना मूल के नैतिक तनाव को अनावश्यक रूप से सुलझा देता।
- issue: गुप्त रूप से निशानियाँ भेजने का परिणाम
  choice: “मुझे लज्जित कर दिया”
  alternative: “मुझे निरुत्तर कर दिया”
  rationale: मूल में लज्जा/अपमान का स्पष्ट भाव है; 'निरुत्तर' संभावित परिणाम तो बताता है, पर मूल भाव को हल्का कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। दोहरे δέ को क्रमशः प्रवाहानुकूल “पर” और स्पष्ट विरोधसूचक “लेकिन” से व्यक्त किया गया है।
