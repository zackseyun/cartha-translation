  text: But I did not approach her again for the rest of my life, because I had done this abomination in all Israel.
translation:
  language: hi
  text: परन्तु मैं अपने जीवन भर फिर कभी उसके पास तक नहीं गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισα αὐτῇ
  choice: उसके पास नहीं गया
  rationale: यह यूनानी अभिव्यक्ति शाब्दिक रूप से ‘उसके निकट नहीं गया’ है; प्रसंग में यौन-संबंध का संकेत हो सकता है, पर मूल की परोक्षता बनाए रखने के लिए स्वाभाविक हिन्दी में ‘उसके पास नहीं गया’ चुना गया।
- source_word: ἔτι
  choice: फिर
  rationale: यहाँ इसका अर्थ आगे कभी दोबारा उस स्त्री के पास न जाने से है।
- source_word: ἕως τῆς ζωῆς μου
  choice: अपने जीवन भर
  rationale: यूनानी वाक्यांश का आशय जीवन की शेष अवधि तक है; ‘अपने जीवन भर’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: अंग्रेज़ी परामर्श-पाठ में अतिरिक्त कारणवाचक वाक्य
  choice: ‘क्योंकि मैंने सारे इस्राएल में यह घृणित काम किया था’ को सम्मिलित नहीं किया गया
  alternative: अंग्रेज़ी POB के अनुसार कारणवाचक उपवाक्य जोड़ना
  rationale: प्रदत्त यूनानी मूल में इस उपवाक्य के अनुरूप कोई शब्द नहीं हैं। स्रोत-साक्ष्य को प्राथमिकता देते हुए इसे अनुवाद में जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी। ‘परन्तु’ से Ἀλλ᾽ का विरोधात्मक बल रखा गया है और यौन आशय को मूल की तरह परोक्ष छोड़ा गया है।
