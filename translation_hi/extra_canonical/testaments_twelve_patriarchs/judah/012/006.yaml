source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καλέσας δὲ αὐτὴν⁴⁵, ἤκουσα καὶ τοὺς ἐν μυστηρίῳ λόγους⁴⁶, *οὓς καθεύδων σὺν αὐτῇ ἐν τῇ μέθῃ μου⁴⁷ ἐλάλησα. *Καὶ οὐκ ἠδυνήθην ἀνελεῖν αὐτήν, ὅτι παρὰ Κυρίου ἦν⁴⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/006.yaml
  text: And when I called her, I also heard the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord.
translation:
  language: hi
  text: और जब मैंने उसे बुलाया, तब मैंने वे गुप्त बातें भी सुनीं जो मैंने नशे में उसके साथ सोते समय कही थीं। और मैं उसे मार न सका, क्योंकि यह प्रभु की ओर से था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλέσας
  choice: जब मैंने ... बुलाया
  rationale: कृदन्त का स्वाभाविक हिन्दी कालवाचक उपवाक्य; अर्थ ‘बुलाना/अपने पास बुलाना’ है।
- source_word: τοὺς ἐν μυστηρίῳ λόγους
  choice: वे गुप्त बातें
  rationale: शाब्दिक ‘गुप्त रूप से कहे गए शब्द’; प्रसंग में ‘गुप्त बातें’ सहज है और गोपनीय कथनों का भाव रखता है।
- source_word: καθεύδων σὺν αὐτῇ
  choice: उसके साथ सोते समय
  rationale: मूल में ‘उसके साथ सोना’ है; हिन्दी अभिव्यक्ति इसकी संभावित यौन अर्थच्छाया को बिना बढ़ाए या मिटाए बनाए रखती है।
- source_word: ἐν τῇ μέθῃ μου
  choice: नशे में
  rationale: मद्यप अवस्था का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप।
- source_word: ἀνελεῖν
  choice: मार
  rationale: यहाँ क्रिया का अर्थ जान से मारना है; ‘हत्या करना’ की अपेक्षा कथन में अधिक स्वाभाविक।
- source_word: παρὰ Κυρίου
  choice: प्रभु की ओर से
  rationale: उत्पत्ति अथवा स्रोत का अर्थ व्यक्त करता है और मूल का धार्मिक पद ‘प्रभु’ बनाए रखता है।
theological_decisions:
- issue: ὅτι παρὰ Κυρίου ἦν में निहित कर्ता का संदर्भ
  choice: क्योंकि यह प्रभु की ओर से था
  alternative: क्योंकि वह प्रभु की ओर से थी
  rationale: यूनानी ἦν के साथ स्पष्ट कर्ता नहीं है; ‘यह’ घटना/मामले की ओर संकेत कर सकता है और मूल की वास्तविक अस्पष्टता को सुरक्षित रखता है, जबकि स्त्रीलिंग ‘वह’ इसे अनावश्यक रूप से उस स्त्री पर निश्चित कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्यक्रम को हिन्दी के अनुरूप बनाया गया है, पर नशे, साथ सोने और प्रभु की ओर से होने संबंधी मूल कथन की अस्पष्टता तथा तनाव सुरक्षित हैं।
