  text: For it was a law of the Amorites that a widow should sit openly in prostitution.
translation:
  language: hi
  text: 2. क्योंकि एमोरियों का यह नियम था कि विधवा सात दिन तक फाटक के पास सबके सामने बैठी रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νόμος
  choice: नियम
  rationale: यहाँ समुदाय की प्रथा या बाध्यकारी व्यवस्था का अर्थ है; आधुनिक हिन्दी में ‘नियम’ स्वाभाविक और स्पष्ट है।
- source_word: τῶν Ἀμορραίων
  choice: एमोरियों का
  rationale: जाति-नाम Ἀμορραῖοι का प्रचलित हिन्दी रूप अपनाया गया है।
- source_word: τὴν χηρεύουσαν
  choice: विधवा
  rationale: कृदन्त का आशय उस स्त्री से है जो विधवा हो चुकी है; संक्षिप्त हिन्दी संज्ञा अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: προκαθεσθαι
  choice: सबके सामने बैठी रहे
  rationale: क्रिया में आगे या सार्वजनिक रूप से बैठने का भाव है; ‘सबके सामने’ उसे सहज हिन्दी में व्यक्त करता है, बिना वेश्यावृत्ति का ऐसा अर्थ जोड़े जो दिए गए यूनानी पाठ में नहीं है।
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: सात दिन तक
  rationale: अवधि बताने वाली यूनानी अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद।
- source_word: παρὰ τὴν πύλην
  choice: फाटक के पास
  rationale: παρά के स्थान-सूचक अर्थ और πύλη के नगर अथवा परिसर के फाटक वाले अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: अंग्रेज़ी परामर्श-पाठ में वेश्यावृत्ति का उल्लेख
  choice: वेश्यावृत्ति का उल्लेख नहीं जोड़ा गया
  alternative: ‘वेश्यावृत्ति के लिए/वेश्यावृत्ति में बैठी रहे’
  rationale: प्रस्तुत यूनानी स्रोत में πορνεία या उसके समान कोई पद नहीं है। इसलिए अंग्रेज़ी परामर्श-पाठ के इस तत्व को मूल-पाठ के विरुद्ध हिन्दी में आयात नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-क्रम हिन्दी के अनुसार स्वाभाविक किया गया है, जबकि सात दिनों की अवधि, फाटक के पास का स्थान और सार्वजनिक रूप से बैठने का भाव सुरक्षित हैं।
