  text: 1[a]. After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal adornment and sat in Enaim, at the city gate of the inn. 2. For it was a law of the Amorites that a widow should sit there openly for prostitution. 3. So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment. 4[b]. And turning aside to her I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived. 5. But I, not knowing what I had done, wanted to kill her. Yet she sent the pledges secretly and put me to shame. 6. And when I called her, I heard also the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord. 7. For I said, “Perhaps she did this deceitfully,
    having received the pledge from another.” 8. But I did not approach her again for the rest of my life, because I had done this abomination in all Israel. 9. Yet those in the city said that there had been no harlot sitting at the gate, because she had come from another place and sat for a short time at the gate. 10. And I supposed that no one knew that I had gone in to her. 11. And after this we came into Egypt to Joseph because of the famine. 12. Now I was forty-six years old[d][c], and I spent seventy-three years in Egypt.
translation:
  language: hi
  text: 'यहूदा का वसीयतनामा 12


    1. इसके बाद, जब तामार को विधवा हुए दो वर्ष हो गए और उसने सुना कि मैं भेड़ें कतरने ऊपर जा रहा हूँ, तो उसने दुल्हन का श्रृंगार किया और एनान नगर में फाटक के पास बैठ गई। 2. क्योंकि एमोरियों की यह प्रथा थी कि विधवा सात दिन तक फाटक के पास बैठी रहे। 3. तब मैं दाखमधु पीकर मतवाला था, इसलिए मैंने उसे नहीं पहचाना; और उसके श्रृंगार के रूप से प्रकट उसके सौंदर्य ने मुझे धोखा दिया। 4. मैं उसकी ओर मुड़ा और बोला, “मैं तुम्हारे पास आऊँगा।” उसने कहा, “तुम मुझे क्या दोगे?” तब मैंने अपनी लाठी और अपना राजमुकुट बयाने के रूप में उसे दे दिया। फिर जब मैंने उसके साथ संबंध बनाया, तो वह गर्भवती हो गई। 5. मैं नहीं जानता था कि मैंने क्या किया था, इसलिए मैं उसे मार डालना चाहता था। पर उसने वे बयाने चुपके से भेजकर मुझे लज्जित कर दिया। 6. जब मैंने उसे बुलाया, तो मैंने वे गुप्त बातें भी सुनीं जो मैंने मतवालेपन में उसके साथ सोते समय कही थीं। तब मैं उसे मार न सका, क्योंकि यह प्रभु की ओर से हुआ था।[a] 7. क्योंकि मैंने कहा, “कहीं ऐसा तो नहीं कि उसने छल से यह किया हो—किसी दूसरे से वे बयाने लेकर उन्हीं पहले कही गई बातों का मेरे
    सामने उपयोग किया हो।” 8. फिर मैं जीवन भर उसके निकट नहीं गया। 9. नगर के लोग भी कहते थे कि फाटक पर कोई ‘तेलेसिकोमेनोन’ नहीं बैठा था;[b] क्योंकि वह किसी दूसरी जगह से आई थी और थोड़ी देर के लिए फाटक पर बैठी थी। 10. मैं समझता था कि किसी को पता नहीं चला कि मैं उसके पास गया था। 11. इसके बाद अकाल के कारण हम यूसुफ के पास मिस्र आए। 12. उस समय मैं छियालीस वर्ष का था, और मैंने मिस्र में तिहत्तर वर्ष बिताए।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रभु की ओर से” घटना में परमेश्वर की व्यवस्था या अधिराज्य का संकेत दे सकता है; यह आवश्यक नहीं कि उस कार्य को परमेश्वर की स्वीकृति मिली हो।
    reason: theological_ambiguity
  - marker: b
    text: यहाँ यूनानी शब्द का पाठ और अर्थ अनिश्चित है। इसका आशय किसी संस्कार से जुड़े व्यक्ति या किसी विशेष प्रकार से सार्वजनिक रूप में बैठने वाले व्यक्ति से हो सकता है; इसलिए मुख्य पाठ में इसका लिप्यंतरण रखा गया है।
    reason: textual_uncertainty
  - marker: c
    text: पाठ कहता है कि यहूदा उस समय छियालीस वर्ष का था और उसने मिस्र में तिहत्तर वर्ष बिताए। इन संख्याओं को किसी दूसरी काल-गणना से मिलाने के लिए नहीं बदला गया है।
    reason: chronological_tension
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: उसने दुलहन का श्रृंगार किया
  rationale: सजातीय यूनानी शब्दों की पुनरुक्ति जानबूझकर किए गए वैवाहिक श्रृंगार पर बल देती है; हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: एनान नगर में फाटक के पास
  rationale: प्रदत्त यूनानी पाठ में न सराय है, न ‘एनाइम’; इसलिए उपलब्ध α-पाठ का सीधा अनुसरण किया गया है।
- source_word: προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην
  choice: सात दिन तक फाटक के पास सामने बैठी रहे
  rationale: प्रदत्त स्रोत में ‘सात दिन’ स्पष्ट है और वेश्यावृत्ति का कोई संज्ञापद नहीं है। προκαθεσθαι के सार्वजनिक/सामने बैठने के भाव को ‘सामने बैठी रहे’ से व्यक्त किया गया है।
- source_word: τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: उसके श्रृंगार के रूप से प्रकट उसके सौंदर्य
  rationale: यह सौंदर्य और श्रृंगार के बाहरी रूप के बीच यूनानी संबंध को बनाए रखता है, यद्यपि हिन्दी वाक्य को स्वाभाविक बनाया गया है।
- source_word: Εἰσέρχομαι πρὸς σε / συνήλθον αὐτῇ
  choice: मैं तुम्हारे पास आऊँगा / मैंने उसके साथ संबंध बनाया
  rationale: पहले कथन में मूल लैंगिक मुहावरे की परोक्षता रखी गई है; बाद के वर्णन में अर्थ स्पष्ट करने के लिए सामान्य आधुनिक हिन्दी प्रयोग किया गया है।
- source_word: ῥάβδον ... διάδημα
  choice: लाठी ... राजमुकुट
  rationale: प्रदत्त यूनानी स्रोत में केवल ये दो वस्तुएँ हैं। ‘अँगूठी’ और ‘मेरे राज्य का’ जोड़ना स्रोत या उत्पत्ति-वृत्तांत से सामंजस्य बैठाना होता। διάδημα राजकीय शिरोभूषण है।
- source_word: ἀρραβών
  choice: बयाना
  rationale: यह किसी वचन या लेन-देन की गारंटी के रूप में दी गई वस्तु को व्यक्त करता है; बहुवचन में उन वस्तुओं को सामूहिक रूप से दर्शाता है।
- source_word: ἀνελεῖν
  choice: मरवा डालना
  rationale: क्रिया का अर्थ मार डालना/समाप्त कर देना है। न्यायिक या निजी निष्पादन स्पष्ट न होने के कारण हिन्दी में कारणकर्ता रूप प्रसंग के अनुकूल है।
- source_word: οἱ ἐν μυστηρίῳ λόγοι
  choice: गुप्त बातें
  rationale: शाब्दिक अर्थ रहस्य में कही गई बातें है; ‘गुप्त बातें’ सामान्य हिन्दी में अर्थ बनाए रखता है।
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: उन्हीं पहले कही गई बातों का मेरे सामने उपयोग किया हो
  rationale: यह वाक्यांश प्रदत्त यूनानी स्रोत में है और इसे छोड़ा नहीं गया; ‘पहली बातें’ का संदर्भ कुछ अस्पष्ट ही रखा गया है।
- source_word: τελεσικόμενον
  choice: ‘तेलेसिकोमेनोन’
  rationale: यह रूप पाठगत और अर्थगत रूप से अत्यंत अनिश्चित है। किसी वेश्या या अनुष्ठानकर्ता का निश्चित अर्थ थोपने के बजाय लिप्यंतरण कर पादटिप्पणी दी गई है।
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  choice: मैंने मिस्र में तिहत्तर वर्ष बिताए
  rationale: ‘वर्ष किए’ का यूनानी मुहावरा समय बिताने का अर्थ देता है; εἰς को यहाँ मिस्र में निवास की दिशा/स्थिति के प्रसंग में स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: παρὰ Κυρίου ἦν (पद 6)
  choice: क्योंकि यह प्रभु की ओर से हुआ था
  alternative: क्योंकि यही प्रभु की इच्छा थी
  rationale: मूल वाक्य घटना को प्रभु की ओर से बताता है, पर यह स्पष्ट नहीं करता कि आशय आदेश, अनुमोदन, न्याय या परमेश्वर की अधिराज्यपूर्ण व्यवस्था है। चुना हुआ रूप इस तनाव को खुला रखता है।
- issue: διάδημα का राजकीय भाव (पद 4)
  choice: राजमुकुट
  alternative: साधारण सिरबंद
  rationale: राजकीय शब्द को उत्पत्ति के वृत्तांत से मिलाने के लिए कमज़ोर नहीं किया गया, पर प्रदत्त पाठ में अनुपस्थित ‘मेरे राज्य का’ भी नहीं जोड़ा गया।
- issue: विधवा के फाटक पर बैठने की एमोरी प्रथा (पद 2)
  choice: पाठ के अनुसार प्रथा का वर्णन, बिना वेश्यावृत्ति जोड़े
  alternative: वेश्यावृत्ति के लिए बैठना
  rationale: प्रदत्त यूनानी स्रोत में ἐπὶ ἑπτὰ ἡμέρας (‘सात दिन तक’) है, न कि ἐν πορνείᾳ। इसलिए नैतिक/यौन अर्थ अंग्रेज़ी परामर्श-पाठ से आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। कथावाचक की प्रथम-पुरुष वसीयतनामाई वाणी बनाए रखी गई। जहाँ प्रदत्त यूनानी स्रोत अंग्रेज़ी परामर्श-पाठ से भिन्न है—विशेषकर पद 1–2, 4, 7–9—वहाँ यूनानी को प्राथमिकता दी गई है। अस्पष्ट τελεσικόμενον का अर्थ अनुमान से निश्चित नहीं किया गया।
