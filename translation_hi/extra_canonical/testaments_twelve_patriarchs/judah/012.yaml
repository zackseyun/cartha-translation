    1. इसके बाद, जब तामार को विधवा हुए दो वर्ष हो गए और उसने सुना कि मैं भेड़ों की ऊन कतरने ऊपर जा रहा हूँ, तो उसने दुलहन का श्रृंगार किया और एनान नगर में फाटक के पास बैठ गई। 2. क्योंकि एमोरियों की यह प्रथा थी कि विधवा सात दिन तक फाटक के पास सामने बैठी रहे। 3. तब मैं दाखमधु पीकर मतवाला था, इसलिए मैंने उसे नहीं पहचाना; और उसके श्रृंगार के रूप से प्रकट उसके सौंदर्य ने मुझे धोखा दिया। 4. मैं उसकी ओर मुड़ा और बोला, “मैं तुम्हारे पास आऊँगा।” उसने कहा, “तुम मुझे क्या दोगे?” तब मैंने अपनी लाठी और अपना राजमुकुट बयाने के रूप में उसे दे दिया। फिर जब मैंने उसके साथ संबंध बनाया, तो वह गर्भवती हो गई। 5. मैं नहीं जानता था कि मैंने क्या किया है, इसलिए मैं उसे मरवा डालना चाहता था। पर उसने वे बयाने चुपके से भेजकर मुझे लज्जित कर दिया। 6. जब मैंने उसे बुलाया, तो मैंने वे गुप्त बातें भी सुनीं जो मैंने मतवालेपन में उसके साथ सोते समय कही थीं। तब मैं उसे मरवा न सका, क्योंकि यह प्रभु की ओर से हुआ था।[a] 7. क्योंकि मैंने कहा, “कहीं ऐसा तो नहीं कि उसने छल से यह किया हो—किसी दूसरे से वे बयाने लेकर उन्हीं पहले कही
    गई बातों का मेरे सामने उपयोग किया हो।” 8. फिर मैं जीवन भर उसके निकट नहीं गया। 9. नगर के लोग भी कहते थे कि फाटक पर कोई ‘तेलेसिकोमेनोन’ नहीं था;[b] क्योंकि वह किसी दूसरी जगह से आई थी और थोड़ी देर के लिए फाटक पर बैठी थी। 10. मैं समझता था कि किसी को पता नहीं चला कि मैं उसके पास गया था। 11. इसके बाद अकाल के कारण हम यूसुफ के पास मिस्र आए। 12. उस समय मैं छियालीस वर्ष का था, और मैंने मिस्र में तिहत्तर वर्ष बिताए।[c]'
