  language: hi
  text: '**यहूदा का वसीयतनामा 21**


    **1** “और अब, मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ: लेवी से प्रेम करो, जिससे तुम बने रहो। अपने आपको उससे ऊँचा न उठाओ, कहीं ऐसा न हो कि तुम पूरी तरह नष्ट कर दिए जाओ। **2** क्योंकि परमेश्वर ने मुझे राजपद और उसे याजकपद दिया; और उसने राजपद को याजकपद के अधीन कर दिया। **3** उसने मुझे पृथ्वी की वस्तुएँ दीं और उसे स्वर्ग की वस्तुएँ। **4** इस प्रकार परमेश्वर का याजकपद पृथ्वी के राजपद से श्रेष्ठ है—जब तक कि वह पापों के कारण प्रभु से दूर होकर गिर न जाए और पृथ्वी के राजपद के वश में न हो जाए।


    **5** क्योंकि प्रभु के दूत ने मुझसे कहा, ‘प्रभु ने उसे तुझसे बढ़कर चुना है कि वह उसके निकट आए, उसकी मेज़ पर खाए और इस्राएल के पुत्रों की उत्तम उपज की पहली भेंटें उसे चढ़ाए। पर तू याकूब का राजा होगा।’


    **6** “तू उनके बीच समुद्र के समान होगा। क्योंकि जैसे समुद्र में धर्मी और अधर्मी दोनों होते हैं—कुछ बंदी बना लिए जाते हैं और दूसरे धनी हो जाते हैं—वैसे ही तेरे भीतर भी हर प्रकार के लोग होंगे: कुछ संकट में पड़कर बंदी बना लिए जाएँगे, और दूसरे पराया माल छीनकर धनी होंगे।[b]


    **7** “क्योंकि जो राजा होंगे, वे समुद्री दैत्यों के समान होंगे; वे मनुष्यों को मछलियों के समान निगल जाएँगे। वे स्वतंत्र लोगों के बेटे-बेटियों को दास बना लेंगे और घर, खेत, भेड़-बकरियों के झुंड और धन-संपत्ति लूट लेंगे। **8** वे लोभ में फूलकर, अन्याय से बहुतों का मांस कौओं को देंगे;[c] वे बुराइयों और ऐसे अभिमान में आगे बढ़ते जाएँगे, यहाँ तक कि ऊँचे उठ जाएँगे। **9** झंझावातों के समान झूठे भविष्यद्वक्ता उठ खड़े होंगे और सभी धर्मियों को सताएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: पद 6 का यूनानी पाठ कठिन और संभवतः विकृत है। वह शाब्दिक रूप से समुद्र में “धर्मी और अधर्मी” तथा कुछ के बंदी बनाए जाने और कुछ के धनी होने की बात करता है; अनुवाद इस असामान्य कथन को यथासंभव बनाए रखता है।
    reason: textual_variant
  - marker: c
    text: 'पद 8 में यूनानी वाक्य अधूरा या विकृत प्रतीत होता है: उसमें “बहुतों का मांस,” “अन्याय से” और “कौओं को” शब्द तो हैं, पर ‘देंगे’ जैसी क्रिया व्यक्त नहीं है। सन्दर्भ के आधार पर यह क्रिया अर्थ स्पष्ट करने के लिए जोड़ी गई है। इस उपलब्ध यूनानी पाठ में ‘कौओं’ के अतिरिक्त किसी दूसरे पक्षी का उल्लेख नहीं है।'
    reason: textual_variant
lexical_decisions:
- source_word: παραγγέλλω
  choice: मैं तुम्हें आज्ञा देता हूँ
  rationale: यह पिता की अंतिम, बाध्यकारी शिक्षा की प्रबलता बनाए रखता है; केवल ‘समझाता हूँ’ कहना दुर्बल होता।
- source_word: ἀγαπᾶτε τὸν Λευί
  choice: लेवी से प्रेम करो
  rationale: सीधी नैतिक आज्ञा को सरल और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: अपने आपको उससे ऊँचा न उठाओ
  rationale: यूनानी की ऊँचा उठने वाली रूपक-छवि को बनाए रखता है और इसे केवल ‘अनादर’ तक सीमित नहीं करता।
- source_word: βασιλεία / ἱερατεία
  choice: राजपद / याजकपद
  rationale: यहाँ भूभागों की अपेक्षा यहूदा और लेवी को सौंपे गए पदों और अधिकारों पर बल है।
- source_word: ὑπέταξε
  choice: अधीन कर दिया
  rationale: पाठ में व्यक्त वास्तविक पदानुक्रम को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: τὰ ἐπὶ γῆς / τὰ ἐν οὐρανοῖς
  choice: पृथ्वी की वस्तुएँ / स्वर्ग की वस्तुएँ
  rationale: यूनानी समानांतरता और दोनों व्यापक क्षेत्रों को यथावत रखता है।
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: प्रभु से दूर होकर गिर न जाए
  rationale: गिरने और प्रभु से अलग होने, दोनों भावों को रखता है; इसे किसी व्यवस्थित धर्मसिद्धान्त की तकनीकी शब्दावली में नहीं बाँधता।
- source_word: προσεγγίζειν αὐτῷ
  choice: उसके निकट आए
  rationale: लेवी की उपासना-संबंधी, याजकीय पहुँच का भाव बनाए रखता है।
- source_word: ἐντρυφημάτων
  choice: उत्तम वस्तुओं
  rationale: संदर्भ में इस्राएल की बढ़िया या मनभावनी उपज/भेंट अभिप्रेत है; ‘विलास’ जैसा शाब्दिक विकल्प यहाँ भ्रामक होता।
- source_word: κήτη
  choice: समुद्री दैत्य
  rationale: विशाल और भयानक समुद्री जीव की छवि को ‘बड़ी मछली’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: καταιγίδες
  choice: झंझावात
  rationale: झूठे भविष्यद्वक्ताओं की प्रचंड और विनाशकारी उपस्थिति की उपमा को गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यहूदा के राजपद और लेवी के याजकपद का पारस्परिक स्थान
  choice: राजपद को याजकपद के अधीन बताया गया है।
  alternative: दोनों पदों को बिना किसी अधीनता के केवल समानांतर दैवी भूमिकाएँ मानना।
  rationale: ὑπέταξε स्पष्ट रूप से अधीन किए जाने को व्यक्त करता है; अनुवाद यहूदा की प्रतिष्ठा बचाने के लिए इस कथन को नरम नहीं करता।
- issue: याजकपद की श्रेष्ठता से जुड़ी शर्त
  choice: याजकपद श्रेष्ठ है, पर पाप के कारण प्रभु से गिरकर पृथ्वी के राजपद के वश में हो सकता है।
  alternative: गिरने वाली सत्ता पृथ्वी का राजपद है, अथवा शर्त को छोड़ देना।
  rationale: निकटतम व्याकरणिक कर्ता ἡ ἱερατεία है। इससे याजकपद की श्रेष्ठता और उसके नैतिक पतन की वास्तविक संभावना, दोनों का तनाव सुरक्षित रहता है।
- issue: लेवी का प्रभु के निकट आना, उसकी मेज़ पर खाना और पहला फल चढ़ाना
  choice: इन्हें याजकीय और उपासना-संबंधी कार्यों के रूप में सीधे रखा गया है।
  alternative: ‘मेज़’ को केवल सामान्य आत्मिक संगति का रूपक मानना।
  rationale: निकट आने, मेज़ पर खाने और पहला फल चढ़ाने का संयुक्त क्रम स्पष्ट रूप से याजकीय-उपासना संदर्भ रखता है।
- issue: समुद्र की उपमा का दायरा
  choice: यहूदा की राजकीय-सामाजिक व्यवस्था में बंदी बनाए जाने वाले और लूट से धनी होने वाले, दोनों प्रकार के लोग दिखाई देते हैं।
  alternative: उपमा को केवल अन्यजातियों या सामान्य मानवता पर लागू करना।
  rationale: ἐν σοὶ सीधे ‘तेरे भीतर’ कहता है, जबकि πᾶν γένος ἀνθρώπων उसका प्रभाव विभिन्न प्रकार के लोगों तक फैलाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘राजपद’ और ‘याजकपद’ पदाधिकारी भूमिकाओं का भेद स्पष्ट करते हैं। एकवचन ‘तू’ उस उद्धृत वाणी में रखा गया है जहाँ दूत सीधे यहूदा को संबोधित करता है; आरम्भ में ‘तुम’ उसके बच्चों के लिए है। स्रोत में उपलब्ध पद 9 के अंतिम वाक्य—धर्मियों को सताने की बात—को भी पूर्ण रूप से अनूदित किया गया है।
