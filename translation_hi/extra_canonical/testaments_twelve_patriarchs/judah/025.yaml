  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025.yaml
  text: '1. And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be chiefs of the tribes in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and so all the rest in order.


    2. And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.


    3. And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.


    4. And those who died in sorrow will rise in joy, and the poor for the Lord’s sake will be made rich, and those dying for the Lord’s sake will awake to life.


    5. And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 25**


    1. इन बातों के बाद अब्राहम, इसहाक और याकूब जीवन के लिए जी उठेंगे। मैं और मेरे भाई इस्राएल में प्रधान होंगे—पहला लेवी, दूसरा मैं, तीसरा यूसुफ, चौथा बिन्यामीन, पाँचवाँ शिमोन, छठा इस्साकार, और फिर इसी प्रकार शेष सभी अपने क्रम में।


    2. प्रभु ने लेवी को आशीष दी; उपस्थिति के दूत ने मुझे; महिमा की शक्तियों ने शिमोन को; आकाश ने रूबेन को; पृथ्वी ने इस्साकार को; समुद्र ने जबूलून को; पर्वतों ने यूसुफ को; तंबू ने बिन्यामीन को; ज्योतियों ने दान को; आनंद ने नप्ताली को; सूर्य ने गाद को; और चंद्रमा ने आशेर को।[a]


    3. तुम प्रभु की प्रजा होगे और तुम्हारी भाषा एक होगी। वहाँ बेलियार के भटकावे की आत्मा नहीं रहेगी, क्योंकि उसे सदा के लिए आग में फेंक दिया जाएगा।[b]


    4. जो दुःख में मर गए, वे आनंद में जी उठेंगे; जो प्रभु के कारण निर्धन हैं, वे धनवान किए जाएँगे; और जो प्रभु के कारण मरते हैं, वे जीवन के लिए जाग उठेंगे।[c]


    5. याकूब के हिरन उल्लास से दौड़ेंगे और इस्राएल के उकाब आनंद से उड़ेंगे। [परंतु अधर्मी शोक मनाएँगे और पापी रोएँगे।][d] सभी जातियाँ सदा-सर्वदा प्रभु की महिमा करेंगी।


    [a] उपलब्ध यूनानी मुख्य पाठ में पद 2 की सूची कई स्थानों पर संक्षिप्त या लुप्त है। “इस्साकार,” “जबूलून,” “पर्वतों,” और “तंबू” से जुड़े वाक्यांश इस सूची के अन्य पाठ-साक्ष्यों से पूरे किए गए हैं।


    [b] यूनानी मुख्य पाठ में केवल “सदा के लिए” है; “आग में” अन्य पाठ-साक्ष्यों में मिलता है और वाक्य का संभावित पूर्ण रूप दर्शाता है।


    [c] “आनंद में” अन्य पाठ-साक्ष्यों में मिलता है; यूनानी मुख्य पाठ में केवल “जी उठेंगे” है।


    [d] कोष्ठकों में दिया वाक्य यूनानी पाठ में है, पर संभवतः बाद में जोड़ा गया अंश है।'
