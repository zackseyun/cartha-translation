lexical_decisions:
- source_word: ἀναστήσεται / ἀναστήσονται
  choice: जी उठेंगे
  rationale: पुनरुत्थान का स्पष्ट अर्थ रखते हुए आधुनिक और स्वाभाविक हिन्दी प्रयोग।
- source_word: ἔξαρχοι
  choice: प्रधान
  rationale: शाब्दिक अर्थ ‘अगुए/शासक’ है। उपलब्ध मुख्य यूनानी में ‘गोत्रों के’ नहीं है, इसलिए ‘प्रधान’ मूल की अस्पष्टता को सुरक्षित रखता है।
- source_word: ἄγγελος τοῦ προσώπου
  choice: उपस्थिति का दूत
  rationale: ‘πρόσωπον’ के दैवी उपस्थिति-संबंधी अर्थ को बनाए रखता है; ‘मुख का दूत’ आधुनिक हिन्दी में भ्रामक होता।
- source_word: πνεῦμα πλάνης
  choice: भटकावे की आत्मा
  rationale: πλάνη में छल, भ्रम और पथभ्रष्टता की अर्थ-सीमा है; यह चयन उसे केवल बौद्धिक ‘धोखे’ तक सीमित नहीं करता।
- source_word: διὰ Κύριον
  choice: प्रभु के कारण
  rationale: διά + accusative का कारणार्थक बल बनाए रखता है और ‘प्रभु के लिए’ की संभावित उद्देश्यवाचक अस्पष्टता से बचता है।
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: याकूब के हिरन
  rationale: प्रस्तुत α-पाठ में स्पष्ट रूप से ‘याकूब’ है; अंग्रेज़ी परामर्श-पाठ के ‘यूसुफ’ को मूल पर प्राथमिकता नहीं दी गई।
- source_word: εἰς αἰῶνας
  choice: सदा-सर्वदा
  rationale: दीर्घकालिक/अनंत स्तुति के मुहावरे को गरिमापूर्ण, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पद 3 में बेलियार की आत्मा का अंतिम दंड
  choice: मुख्य पाठ का ‘सदा के लिए’ रखा और ‘आग में’ को पादटिप्पणी-सहित पाठ में पुनर्स्थापित किया
  alternative: केवल ‘उसे सदा के लिए फेंक दिया जाएगा’
  rationale: दिए गए यूनानी मुख्य पाठ में εἰς τὸν αἰῶνα है, जबकि अंग्रेज़ी परामर्श-पाठ ‘into the fire forever’ देता है। पाठगत अंतर को छिपाने के बजाय चिह्नित किया गया।
- issue: पद 4 में पुनरुत्थान का भाव
  choice: ‘दुःख में मर गए’ और पाठ-साक्ष्यगत ‘आनंद में’
  alternative: ‘दुःख में मरने वाले जी उठेंगे’
  rationale: मुख्य पाठ दुःख और मृत्यु को जोड़ता है; अंग्रेज़ी परामर्श-पाठ में ‘in joy’ है। पूरक पद को पादटिप्पणी से पारदर्शी बनाया गया।
- issue: पद 2 की ब्रह्मांडीय आशीष-सूची
  choice: अन्य पाठ-साक्ष्य से सूची पूर्ण करके पादटिप्पणी दी
  alternative: खंडित मुख्य यूनानी को ज्यों का त्यों रखना
  rationale: मुख्य पाठ में संयोजक अवयवों के लोप से असंगत अनुक्रम बनता है। परामर्श-पाठ संभवतः पूर्णतर साक्ष्य सुरक्षित रखता है; इसलिए पठनीयता और पाठगत पारदर्शिता दोनों रखी गईं।
- issue: पद 5 का न्याय-वाक्य
  choice: कोष्ठकों में मुख्य पाठ के अनुसार शामिल किया
  alternative: अंग्रेज़ी POB की तरह छोड़ देना
  rationale: दिए गए यूनानी पाठ में वाक्य मौजूद है, यद्यपि संपादकीय कोष्ठक उसकी संदिग्ध/द्वितीयक स्थिति बताते हैं। उसे हटाने के बजाय दृश्य रूप से चिह्नित करना मूल-साक्ष्य के प्रति अधिक निष्ठावान है।
