  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/004.yaml
  text: Wine also reveals the mysteries of God and of men, just as I too revealed to the Canaanite woman the commandments of God and the mysteries of Jacob my father—things that God told me not to reveal.
translation:
  language: hi
  text: दाखरस परमेश्वर और मनुष्यों के रहस्य भी प्रकट करता है, जिस प्रकार मैंने भी कनानी स्त्री को परमेश्वर की आज्ञाएँ और अपने पिता याकूब के रहस्य प्रकट किए—वे बातें जिन्हें परमेश्वर ने मुझे प्रकट न करने को कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶνος
  choice: दाखमधु
  rationale: यहाँ मादक पेय के रूप में दाखरस अभिप्रेत है; ‘दाखमधु’ सामान्य पाठक को मदिरा का अर्थ स्पष्ट करता है और प्रसंग की नैतिक धार बनाए रखता है।
- source_word: μυστήρια
  choice: रहस्य
  rationale: ग्रीक शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य; परमेश्वर तथा मनुष्यों से संबंधित गुप्त बातों का भाव सुरक्षित रहता है।
- source_word: ἀποκαλύπτει / ἀπεκάλυψα
  choice: प्रकट कर देता है / प्रकट कर दिए
  rationale: दोनों रूपों में एक ही मूल क्रिया का संबंध बनाए रखा गया है; पहले वाक्य में दाखमधु के प्रभाव और दूसरे में यहूदा के वास्तविक कृत्य को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τῇ Χαναναίτιδι
  choice: उस कनानी स्त्री के सामने
  rationale: सम्प्रदान कारक का अर्थ स्पष्ट करता है और ग्रीक के अनुसार इसे ‘प्रकट करने’ की क्रिया के निकट रखता है।
- source_word: ἐντολὰς τοῦ Θεοῦ
  choice: परमेश्वर की आज्ञाएँ
  rationale: ἐντολή के अधिकारपूर्ण निर्देश वाले अर्थ को मानक बाइबलीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: μυστήρια Θεοῦ καὶ ἀνθρώπων का संबंध
  choice: परमेश्वर और मनुष्यों के रहस्य
  alternative: परमेश्वर तथा मनुष्यों से संबंधित गुप्त बातें
  rationale: स्रोत की समानांतर और कुछ हद तक खुली संरचना को बनाए रखा गया है; यह तय नहीं किया गया कि ये रहस्य स्वामित्व, उद्गम या विषय के अर्थ में हैं।
- issue: निषेधात्मक ईश्वरीय कथन का कर्ता और आशय
  choice: वे बातें जिन्हें परमेश्वर ने मुझे प्रकट न करने को कहा था
  alternative: जिन्हें परमेश्वर ने कहा था कि मैं प्रकट न करूँ
  rationale: ग्रीक ἃ μοι εἶπεν ὁ Θεὸς μὴ ἀποκαλῦψαι का आशय स्वाभाविक हिन्दी में दिया गया है, बिना निषेध के धार्मिक कारण को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ग्रीक के ‘प्रकट करना’ वाले शब्द-संबंध को दोनों उपवाक्यों में बनाए रखा गया है और कनानी स्त्री का उल्लेख क्रिया के पास रखा गया है।
