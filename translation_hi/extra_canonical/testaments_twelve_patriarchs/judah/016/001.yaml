reference: Testament of Judah 16:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε² οὖν, τέκνα μου, *τὸν ὅρον τοῦ οἴνου³, *ἔστι γὰρ ἐν αὐτῷ τέσσαρα⁵ πνεύματα πονηρά⁷, ἐπιθυμίας, πυρώσεως, ἀσωτίας, αἰσχροκερδίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/001.yaml
  text: 'Guard yourselves, therefore, my children, from the boundary of wine; for in it there are four evil spirits: desire, burning passion, debauchery, and shameful gain.'
translation:
  language: hi
  text: 'इसलिए, मेरे बच्चों, दाखरस की सीमा[a] से सावधान रहो; क्योंकि उसमें चार दुष्ट आत्माएँ हैं: लालसा, भड़कती हुई कामना, भोग-विलास और लज्जाजनक लाभ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दाखरस की सीमा” का अर्थ दाखरस के सेवन की मर्यादा, या वह बिंदु भी हो सकता है जहाँ उसका प्रभाव मनुष्य को सीमा से बाहर ले जाता है; यूनानी वाक्यांश असामान्य है।
    reason: ὅρος τοῦ οἴνου की शाब्दिक और अर्थगत अस्पष्टता स्पष्ट करना, बिना किसी एक व्याख्या को निश्चित किए।
lexical_decisions:
- source_word: Φυλάξασθε
  choice: सावधान रहो
  rationale: मध्यवाची आज्ञार्थक का अर्थ यहाँ अपने को किसी संकट से बचाने या उससे चौकन्ना रहने का है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: दाखमधु की सीमा
  rationale: ὅρος का मूल अर्थ सीमा या हद है। असामान्य यूनानी अभिव्यक्ति को किसी निश्चित व्याख्या—जैसे केवल मात्रा की मर्यादा या मद्यपान का चरम बिंदु—में बदलने के बजाय उसकी वास्तविक अस्पष्टता रखी गई है।
- source_word: ἐπιθυμίας
  choice: लालसा
  rationale: यह तीव्र इच्छा या वासना को व्यक्त करता है; व्यापक अर्थ बनाए रखने के लिए केवल यौन अर्थ तक सीमित नहीं किया गया।
- source_word: πυρώσεως
  choice: भड़कती हुई कामना
  rationale: शब्द में जलने या प्रज्वलित होने का बिंब है और इस प्रसंग में उद्दीप्त आवेग का भाव देता है। 'कामना' प्रसंगानुकूल है, जबकि 'भड़कती हुई' अग्नि-बिंब को बनाए रखता है।
- source_word: ἀσωτίας
  choice: भोग-विलास
  rationale: यह उच्छृंखल, असंयमी और अपव्ययी जीवन को सूचित करता है। 'भोग-विलास' सामान्य पाठक के लिए स्वाभाविक है और मद्य-संबंधी उच्छृंखलता के प्रसंग में उपयुक्त है।
- source_word: αἰσχροκερδίας
  choice: नीच कमाई
  rationale: संयुक्त शब्द लज्जाजनक या अनैतिक लाभ की चाह अथवा प्राप्ति को व्यक्त करता है। यह चयन 'लाभ' की धारणा और उसकी नैतिक निंदनीयता दोनों रखता है।
theological_decisions:
- issue: चार अमूर्त दुर्गुणों को πνεύματα πονηρά कहना
  choice: चार दुष्ट आत्माएँ
  alternative: चार बुरी प्रवृत्तियाँ
  rationale: मूल पाठ स्पष्ट रूप से πνεύματα, अर्थात 'आत्माएँ', कहता है। इसे केवल मनोवैज्ञानिक प्रवृत्तियों में बदलना पाठ की आध्यात्मिक भाषा और संभावित तात्त्विक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'दाखमधु' प्राचीन संदर्भ और οἶνος के अर्थ को स्पष्ट करता है; सूची में अमूर्त संज्ञाओं की समानांतरता यथासंभव बनाए रखी गई है।
