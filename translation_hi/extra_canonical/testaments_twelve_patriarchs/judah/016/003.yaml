source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Εἰ δὲ θέλετε σωφρόνως ζῆσαι, μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε¹⁵, ἵνα μὴ ἁμαρτήσητε¹⁶ ἐν λόγοις ὕβρεως¹⁷ καὶ μάχαις²⁰ καὶ συκοφαντίαις²¹ καὶ παραβάσεσι²² ἐντολῶν²³ Θεοῦ²⁴, καὶ ἀπολεῖσθε²⁵ οὐκ²⁶ ἐν καιρῷ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/003.yaml
  text: But if you want to live with self-control, do not touch wine at all, lest you drink and sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.
translation:
  language: hi
  text: पर यदि तुम संयम से जीना चाहते हो, तो दाखमधु को बिलकुल हाथ न लगाओ, कहीं ऐसा न हो कि तुम उद्दंड बातें कहने, लड़ाई-झगड़े करने, झूठे आरोप लगाने और परमेश्वर की आज्ञाओं का उल्लंघन करने में पाप करो और समय से पहले नष्ट हो जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφρόνως
  choice: संयम से
  rationale: यह क्रिया-विशेषण विवेकपूर्ण, आत्म-संयमित आचरण को व्यक्त करता है; प्रसंग में ‘संयम से’ सहज और सटीक है।
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: दाखमधु को बिलकुल हाथ न लगाओ
  rationale: ἐφάπτεσθε का स्पर्श करने का बिंब बनाए रखते हुए पूर्ण परहेज़ का आशय व्यक्त किया गया है।
- source_word: λόγοις ὕβρεως
  choice: उद्दंड बातें कहने
  rationale: ὕβρις में अपमानजनक उद्दंडता और धृष्टता का भाव है; यह चयन केवल सामान्य कठोर वाणी से अधिक प्रबल अर्थ रखता है।
- source_word: συκοφαντίαις
  choice: झूठे आरोप लगाने
  rationale: शब्द का आशय निंदात्मक या मिथ्या अभियोगों से है; आधुनिक हिन्दी में यह वाक्यांश स्पष्ट है।
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: समय से पहले
  rationale: शाब्दिक ‘तुम्हारे समय में नहीं’ का स्वाभाविक आशय असमय अथवा नियत समय से पहले नष्ट होना है।
theological_decisions:
- issue: दाखमधु से संबंधित निषेध की सीमा
  choice: दाखमधु को बिलकुल हाथ न लगाओ
  alternative: दाखमधु मत पियो
  rationale: यूनानी पाठ स्पर्श न करने और ‘बिलकुल’ का प्रबल निषेध रखता है; इसे केवल पीने तक सीमित नहीं किया गया।
- issue: प्रस्तुत यूनानी पाठ और अंग्रेज़ी परामर्श-पाठ में ‘पीना’
  choice: ‘पीना’ नहीं जोड़ा गया
  alternative: कहीं ऐसा न हो कि तुम पीकर पाप करो
  rationale: दिए गए यूनानी मूल में πίνητε अथवा उसके समान ‘पीना’ व्यक्त करने वाला पद नहीं है। इसलिए बाद की अंग्रेज़ी पुनरीक्षा का अतिरिक्त ‘drink’ हिन्दी पाठ में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सीधे संबोधन वाला बहुवचन रूप रखा गया है। पाप के क्षेत्रों को समानांतर क्रियात्मक पदबंधों में व्यक्त किया गया है, जिससे यूनानी सूची स्पष्ट बनी रहे।
