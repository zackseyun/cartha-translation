id: T12P.JUD.16.2
reference: Testament of Judah 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐὰν πίνητε οἶνον¹⁰ ἐν εὐφροσύνῃ¹¹, ἐστὶ αἰδούμενος μετὰ φόβου Θεοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/002.yaml
  text: If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness slips in.
translation:
  language: hi
  text: यदि तुम आनन्द में दाखरस पीओ, तो परमेश्वर के भय के साथ शालीन रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शालीन रहो” का अनुवाद “लज्जाशील” या “संकोचशील रहो” भी हो सकता है; यूनानी शब्द में लज्जा, संकोच और आदरयुक्त शालीनता के भाव हैं।
    reason: αἰδούμενος की अर्थ-सीमा को सुरक्षित रखने और इसे केवल मद्यपान की मात्रा में संयम तक सीमित न करने के लिए।
lexical_decisions:
- source_word: οἶνον
  choice: दाखमधु
  rationale: यह οἶνος का स्वाभाविक और स्पष्ट हिन्दी समतुल्य है तथा मादक दाखरस का अर्थ बनाए रखता है।
- source_word: ἐν εὐφροσύνῃ
  choice: आनन्द में
  rationale: यह वाक्यांश हर्ष या उत्सव की अवस्था/परिस्थिति बताता है; संक्षिप्त हिन्दी मूल की व्यापकता को बनाए रखती है।
- source_word: αἰδούμενος
  choice: मर्यादा में रहो
  rationale: मूल कृदन्त αἰδέομαι से है, जिसमें लज्जा, संकोच और आदरयुक्त शालीनता का भाव है। प्रसंग में 'मर्यादा में रहो' स्वाभाविक है और इसे केवल मद्यपान की मात्रा के अर्थ में सीमित नहीं करता।
- source_word: μετὰ φόβου Θεοῦ
  choice: परमेश्वर का भय मानते हुए
  rationale: यह परमेश्वर के प्रति श्रद्धामिश्रित भय को स्वाभाविक हिन्दी में व्यक्त करता है और उसे सामान्य सावधानी में नहीं बदलता।
theological_decisions:
- issue: मद्यपान के विषय में कथन का बल
  choice: शर्तीय कथन को यथावत रखा गया; न तो मद्यपान का निषेध जोड़ा गया, न उसकी स्वीकृति को आवश्यकता से अधिक प्रबल किया गया।
  alternative: इसे मद्यपान की अनुमति या पूर्ण निषेध के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ केवल 'यदि तुम पियो' कहता है और परमेश्वर के भय के साथ मर्यादा का निर्देश देता है।
- issue: अंग्रेज़ी परामर्श-पाठ का अतिरिक्त वाक्य
  choice: केवल उपलब्ध यूनानी स्रोत से प्रमाणित वाक्य का अनुवाद किया गया।
  alternative: अंग्रेज़ी POB में आए नशे और निर्लज्जता वाले अगले वाक्य को भी सम्मिलित करना।
  rationale: दिए गए मूल-भाषा स्रोत में वह अतिरिक्त सामग्री उपस्थित नहीं है; स्रोत-आधार के बिना उसे इस पद में जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी अपनाई गई है। 'दाखमधु' शास्त्रीय संदर्भ में स्पष्ट है, जबकि 'मर्यादा में रहो' मूल के शालीनता और संकोच के भाव को स्वाभाविक रूप से व्यक्त करता है।
