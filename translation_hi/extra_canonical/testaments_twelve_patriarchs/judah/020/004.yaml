base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/004.yaml
  text: 'For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast.'
translation:
  language: hi
  text: क्योंकि छल के शासक ने मुझे अंधा कर दिया, और मैं मनुष्य के समान तथा पापों में भ्रष्ट देह के समान अनजान रहा; और स्वयं को अजेय समझते हुए मैंने अपनी ही दुर्बलता को पहचाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: छल का शासक
  rationale: ἄρχων सत्ता रखने वाले शासक को और πλάνη भटकाने वाले छल या भ्रम को सूचित करता है; यह रूपक को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ἠγνόησα
  choice: मैं अज्ञान में रहा
  rationale: क्रिया का अर्थ न जानना या अनजान रहना है; यह जानबूझकर उपेक्षा करने का भाव नहीं जोड़ता।
- source_word: σὰρξ
  choice: देह
  rationale: यहाँ σάρξ मनुष्य की शारीरिक और दुर्बल अवस्था को दर्शाता है; ‘देह’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἀκαταμάχητος
  choice: अजेय
  rationale: शब्द का शाब्दिक भाव है ‘जिसे युद्ध में पराजित न किया जा सके’; ‘अजेय’ संक्षिप्त और सटीक है।
theological_decisions:
- issue: अपनी दुर्बलता पहचानने और स्वयं को अजेय समझने के बीच तनाव
  choice: दोनों कथनों को यूनानी क्रम और तनाव सहित रखा गया
  alternative: अर्थ को सुगम बनाने के लिए ‘अपनी दुर्बलता को नहीं पहचाना’ करना
  rationale: प्राप्त यूनानी पाठ में καὶ ἐπέγνων स्पष्टतः ‘और मैंने पहचाना’ है; संभावित वैचारिक कठिनाई को पाठ-संशोधन द्वारा मिटाना उचित नहीं।
- issue: ‘छल के शासक’ की पहचान
  choice: उपाधि को सामान्य रूप में रखा गया
  alternative: इसे स्पष्टतः शैतान या किसी अन्य नामित सत्ता के रूप में पहचानना
  rationale: मूल पाठ सत्ता का नाम नहीं देता; किसी विशिष्ट धार्मिक पहचान को जोड़ना मूल से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। दो बार आए ὡς को ‘होने के नाते’ से व्यक्त किया गया है, और मूल पाठ का असहज किंतु वास्तविक वैचारिक तनाव सुरक्षित रखा गया है।
