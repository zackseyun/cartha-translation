review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the ruler of deceit, blindness, ignorance, sinful corruption, recognition of weakness, and the concluding claim of invincibility. However, its second ‘होने के नाते’ attaches ‘पापों से भ्रष्ट देह’ to the subsequent recognition of weakness, whereas the Greek ὡς ἄνθρωπος καὶ ὡς σὰρξ ἐν ἁμαρτίαις φθαρείς qualifies ‘I was ignorant.’
  naturalness: The Hindi is generally fluent and appropriately dignified. Recasting the paired ὡς phrases as parallel comparisons makes their scope clear in modern standard Hindi without smoothing away the source's deliberately difficult sequence.
  terminology: ‘छल का शासक,’ ‘देह,’ ‘दुर्बलता,’ and ‘अजेय’ are suitable and preserve the source’s unexpanded terminology. No named identity should be supplied for the ruler of deceit.
  issues:
  - severity: medium
    issue: The phrase ‘पापों से भ्रष्ट देह होने के नाते मैंने स्वयं को अजेय समझते हुए अपनी ही दुर्बलता को पहचाना’ syntactically links the corrupt-flesh phrase with recognizing weakness.
    rationale: In Greek, both ὡς ἄνθρωπος and ὡς σὰρξ ἐν ἁμαρτίαις φθαρείς belong with ἠγνόησα (‘I was ignorant’), before καὶ ἐπέγνων (‘and I recognized’). The Hindi should preserve that scope while retaining the textual tension of recognizing weakness while thinking oneself invincible.
  revised_text: क्योंकि छल के शासक ने मुझे अंधा कर दिया, और मैं मनुष्य के समान तथा पापों में भ्रष्ट देह के समान अनजान रहा; और स्वयं को अजेय समझते हुए मैंने अपनी ही दुर्बलता को पहचाना।
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek clause order and, especially, makes the paired descriptions ‘as a man’ and ‘as flesh corrupted in sins’ modify the speaker's ignorance. It retains the received text's tension between recognizing personal weakness and considering oneself invincible, without emendation or doctrinal explanation.
