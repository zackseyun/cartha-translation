revisions:
- from: क्योंकि छल के शासक ने मुझे अंधा कर दिया था। मनुष्य होने के नाते मैं अज्ञान में रहा और पापों से भ्रष्ट देह होने के नाते मैंने स्वयं को अजेय समझते हुए अपनी ही दुर्बलता को पहचाना।
  to: क्योंकि छल के शासक ने मुझे अंधा कर दिया, और मैं मनुष्य के समान तथा पापों में भ्रष्ट देह के समान अनजान रहा; और स्वयं को अजेय समझते हुए मैंने अपनी ही दुर्बलता को पहचाना।
  rationale: The revision preserves the Greek clause order and, especially, makes the paired descriptions ‘as a man’ and ‘as flesh corrupted in sins’ modify the speaker's ignorance. It retains the received text's tension between recognizing personal weakness and considering oneself invincible, without emendation or doctrinal explanation.
  reviewer_model: gpt-5.6-terra
