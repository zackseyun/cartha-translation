base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/005.yaml
  text: And the Spirit of truth accuses all, and the sinner is consumed from his own heart, and to lift up
translation:
  language: hi
  text: और सत्य का आत्मा सब पर आरोप लगाता है[a], और पापी अपने ही हृदय से जला हुआ है, और न्यायाधीश की ओर अपना मुख नहीं उठा सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सब” का अर्थ “सब लोगों” या अधिक व्यापक रूप से “सब कुछ” भी समझा जा सकता है।
    reason: यूनानी πάντων का रूप दोनों अर्थों की संभावना रखता है, यद्यपि आरोप लगाने के संदर्भ में व्यक्तियों का अर्थ अधिक स्वाभाविक है।
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: सत्य का आत्मा
  rationale: संबंधवाचक यूनानी पदबंध को निकटता से रखते हुए स्वाभाविक और धर्मशास्त्रीय रूप से अनिर्णायक हिन्दी प्रयोग चुना गया है।
- source_word: κατηγορεῖ
  choice: दोष लगाता है
  rationale: क्रिया का अर्थ आरोप लगाना या अभियोग करना है; यह केवल गवाही देने की अपेक्षा अधिक सटीक है।
- source_word: πάντων
  choice: सब पर
  rationale: संदर्भ में अभियोग के लक्ष्य के रूप में सभी व्यक्तियों का अर्थ सर्वाधिक स्वाभाविक है, हालांकि यूनानी रूप व्यापक अर्थ की अनुमति देता है।
- source_word: ἐμπεπύρισται
  choice: दग्ध होता है
  rationale: पूर्ण निष्क्रिय रूप आग से जलाए जाने या जलने की तीव्र अवस्था व्यक्त करता है; ‘भस्म हो जाता है’ परिणाम को आवश्यकता से अधिक निश्चित करता।
- source_word: ἐκ τῆς ἰδίας καρδίας
  choice: अपने ही हृदय से
  rationale: ἐκ के स्रोत-बोध और ἰδίας के आत्मसंबंधी बल को सुरक्षित रखा गया है।
- source_word: ἆραι πρόσωπον πρὸς τὸν κριτὴν οὐ δύναται
  choice: न्यायाधीश की ओर अपना मुख नहीं उठा सकता
  rationale: पूरा यूनानी उपवाक्य अनूदित किया गया है; ‘मुख उठाना’ लज्जा या दोष के कारण सामना न कर पाने की मूल छवि बनाए रखता है।
theological_decisions:
- issue: ‘सत्य का आत्मा’ की पहचान
  choice: पदबंध को ज्यों का त्यों रखते हुए किसी विशिष्ट दैवी व्यक्तित्व की स्पष्ट पहचान नहीं जोड़ी गई।
  alternative: ‘सत्य का आत्मा’ को व्याख्यात्मक रूप से ‘पवित्र आत्मा’ कहना।
  rationale: मूल पाठ केवल ‘सत्य का आत्मा’ कहता है; किसी सांप्रदायिक या बाद की धर्मशास्त्रीय पहचान को अनुवाद में आरोपित नहीं किया गया।
- issue: पापी के दग्ध होने का स्रोत
  choice: ‘अपने ही हृदय से’ रखा गया।
  alternative: इसे बाहरी दैवी दंड या अंतरात्मा की आग के रूप में स्पष्ट करना।
  rationale: मूल में कारण या प्रक्रिया की व्याख्या नहीं है; उसकी तनावपूर्ण अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘दग्ध’ कुछ साहित्यिक है, पर आग से जलने की मूल छवि और तीव्रता को संक्षेप में सुरक्षित रखता है। अंग्रेज़ी परामर्श-पाठ के अधूरे अंत के विपरीत, उपलब्ध यूनानी स्रोत में न्यायाधीश की ओर मुख न उठा सकने वाला पूरा उपवाक्य मौजूद है और उसे अनूदित किया गया है।
