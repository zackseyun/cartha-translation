base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/002.yaml
  text: Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
translation:
  language: hi
  text: चाँदी के कारण मैंने अपने बच्चों को खो दिया; और यदि मेरे पश्चाताप, मेरी दीनता और मेरे पिता की प्रार्थनाएँ मेरी सहायता के लिए एक साथ न आई होतीं, तो मैं निःसंतान मर गया होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τὸ ἀργύριον
  choice: चाँदी के लोभ के कारण
  rationale: ἀργύριον का मूल अर्थ ‘चाँदी’ है और प्रसंग में धन के लिए किए गए कृत्य का कारण सूचित होता है। ‘लोभ’ जोड़ने से आधुनिक हिन्दी में कारण स्वाभाविक और स्पष्ट होता है, जबकि ‘चाँदी’ की मूल छवि बनी रहती है।
- source_word: ἀπώλεσα τὰ τέκνα μου
  choice: मैंने अपने बच्चों को खो दिया
  rationale: ἀπόλλυμι यहाँ संतान-वियोग को व्यक्त करता है; ‘खो दिया’ कारण में वक्ता की भूमिका और परिणाम दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἡ μετάνοιά μου
  choice: मेरे पश्चाताप
  rationale: μετάνοια के लिए ‘पश्चाताप’ प्रचलित, स्पष्ट और धार्मिक रूप से अनावश्यक संकीर्णता से मुक्त शब्द है।
- source_word: ἡ ταπείνωσίς μου
  choice: मेरे दीन होने
  rationale: ταπείνωσις आत्म-दीनता या नम्र किए जाने का भाव रखता है। ‘दीन होने’ से क्रियात्मक और व्यक्तिगत भाव आता है, बिना इसे केवल मानसिक ‘विनम्रता’ तक सीमित किए।
- source_word: συνεδράμον
  choice: मिलकर मेरी सहायता न की होती
  rationale: συντρέχω का शाब्दिक भाव ‘साथ दौड़ना’ है, पर यहाँ सहायता के लिए एक साथ आना अभिप्रेत है। ‘मिलकर सहायता’ बहुवचन कर्ताओं और संयुक्त सहयोग को सुरक्षित रखता है।
- source_word: ἄτεκνος ... ἀποθανεῖν
  choice: निःसन्तान ही मर गया होता
  rationale: ἄτεκνος का सीधा अर्थ ‘सन्तानरहित’ है; ‘निःसन्तान’ dignified और संक्षिप्त हिन्दी रूप है।
theological_decisions:
- issue: पश्चाताप, दीनता और पिता की प्रार्थनाओं की संयुक्त भूमिका
  choice: तीनों ने मिलकर सहायता की
  alternative: केवल पश्चाताप को निर्णायक बताना
  rationale: यूनानी वाक्य तीनों तत्वों को संयुक्त कर्ता के रूप में रखता है; अनुवाद किसी एक को स्वतंत्र या सर्वोपरि कारण नहीं बनाता।
- issue: अप्रत्यक्ष दैवी सहायता
  choice: ‘मेरी सहायता’ कहकर साधन को खुला रखा
  alternative: ‘परमेश्वर ने मुझे बचाया’
  rationale: मूल पाठ सहायता का उल्लेख करता है, पर इस वाक्य में सहायता करने वाले के रूप में परमेश्वर का स्पष्ट नाम नहीं देता; इसलिए निहित धर्मवैज्ञानिक एजेंसी को स्पष्ट कथन में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की प्रतिकल्पनात्मक संरचना और मूल की धर्मवैज्ञानिक संयुक्तता सुरक्षित रखी गई है।
