source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὁδηγεῖ³, ὅτι⁴ ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς⁵ ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα⁷ αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/001.yaml
  text: For it leads astray, because in the delusion of silver they call those who are not gods gods, and it causes the one who has it to fall into ecstasy.
translation:
  language: hi
  text: क्योंकि यह भटका देती है; चाँदी के भ्रम में लोग उन्हें देवता कहते हैं जो देवता हैं ही नहीं, और यह उसे अपने आपे से बाहर कर देती है जिसके पास यह होती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“अपने आपे से बाहर”: यूनानी शब्द का अर्थ भावावेश, बेसुधी या उन्माद की दशा भी हो सकता है।'
    reason: ἔκστασις की अर्थ-व्याप्ति और प्रसंगगत अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: πλάνῃ ἀργυρίου
  choice: चाँदी के भ्रम में
  rationale: πλάνη के ‘भ्रम/भटकावे’ और ἀργύριον के मूल अर्थ ‘चाँदी’ को बनाए रखा गया है; यहाँ चाँदी धन का भी संकेत हो सकती है।
- source_word: τοὺς μὴ ὄντας θεοὺς
  choice: उन्हें ... जो देवता हैं ही नहीं
  rationale: यूनानी निषेध के बल को स्वाभाविक हिन्दी में ‘हैं ही नहीं’ द्वारा व्यक्त किया गया है।
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: अपने आपे से बाहर कर देती है
  rationale: ἔκστασις की मूल धारणा सामान्य अवस्था या आत्म-संयम से बाहर हो जाने की है। यह वाक्यांश उसके संभावित अर्थों—भावावेश, बेसुधी या उन्माद—में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: जो देवता नहीं हैं उन्हें देवता कहना
  choice: उन्हें देवता कहते हैं जो देवता हैं ही नहीं
  alternative: झूठे देवताओं को देवता कहते हैं
  rationale: मूल पाठ की स्पष्ट विरोधाभासी संरचना रखी गई है और ‘झूठे’ जैसा व्याख्यात्मक विशेषण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल में स्त्रीलिंग सर्वनाम αὐτήν किसी पूर्वोक्त स्त्रीलिंग संज्ञा की ओर संकेत करता है; उपलब्ध अंश में उसका पूर्वपद नहीं है, इसलिए हिन्दी में तटस्थ ‘यह’ रखा गया है।
