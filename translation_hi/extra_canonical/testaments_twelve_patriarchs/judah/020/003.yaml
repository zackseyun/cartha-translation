  text: But the God of my fathers had mercy on me, because I did this in ignorance.
translation:
  language: hi
  text: परन्तु मेरे पूर्वजों के परमेश्वर ने मुझ पर दया की, क्योंकि मैंने यह अज्ञानवश किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: मेरे पूर्वजों के परमेश्वर
  rationale: यह यूनानी संबंधवाचक पदबंध का स्वाभाविक और सटीक हिन्दी रूप है; ‘पितरों’ की अपेक्षा ‘पूर्वजों’ को आधुनिक पाठक अधिक सहजता से समझते हैं।
- source_word: ἐλέησε με
  choice: मुझ पर दया की
  rationale: ἐλεέω के अर्थ को प्रचलित, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν ἀγνωσίᾳ
  choice: अनजाने में
  rationale: अज्ञान अथवा जानकारी के अभाव में किए गए कार्य का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: τοῦτο ἐποίησα
  choice: मैंने यह ... किया था
  rationale: τοῦτο को अनिर्दिष्ट ‘यह’ ही रखा गया है और पूर्वकालीन प्रसंग को हिन्दी में स्वाभाविक बनाने के लिए पूर्ण भूतकाल प्रयुक्त हुआ है।
theological_decisions:
- issue: दया का कारण और अज्ञान का संबंध
  choice: ‘क्योंकि’ के द्वारा स्पष्ट कारणसूचक संबंध बनाए रखा गया
  alternative: ‘जबकि मैंने यह अनजाने में किया था’
  rationale: यूनानी ὅτι यहाँ सीधे उस आधार या कारण को प्रस्तुत करता है जिस पर वक्ता परमेश्वर की दया का उल्लेख करता है; इसे कमजोर या पुनर्व्याख्यायित नहीं किया गया।
