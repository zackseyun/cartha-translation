  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबिलीय गद्य। ‘परन्तु’ विरोधसूचक Ἀλλ᾽ को स्पष्ट रखता है; किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
