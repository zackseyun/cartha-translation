  source_fidelity: यूनानी पाठ के प्रति अनुवाद निष्ठावान है। «ἐν πολυτελεῖ ἐσθῆτι» का ‘बहुमूल्य वस्त्र पहनाकर’ स्वाभाविक रूप से ‘महँगे वस्त्र में’ का आशय देता है; «ἀναγάγετε με ἐν Χεβρὼν» का ‘मुझे हेब्रोन ले जाओ’ सही है, और ‘ऊपर ले जाओ’ का निहित दिशात्मक भाव फुटनोट में सुरक्षित है। «ἔνθα καὶ οἱ πατέρες μου» में निहित, अपूर्ण ‘जहाँ मेरे पिता/पुरखे भी [हैं]’ को ‘जहाँ मेरे पूर्वज भी हैं’ द्वारा बिना अनावश्यक विस्तार के व्यक्त किया गया है। दिया गया अंग्रेज़ी POB पाठ इस यूनानी अंश से असंबद्ध है; इसलिए उसे सुधार का आधार नहीं बनाया गया।
  naturalness: पाठ आधुनिक मानक हिंदी में सहज, स्पष्ट और गरिमापूर्ण है। ‘कोई ... दफन न करे; बल्कि ... ले जाओ’ मूल के निषेधात्मक आदेश और उसके बाद बहुवचन आदेश को अच्छे ढंग से बनाए रखता है।
  terminology: ‘हेब्रोन’ प्रचलित हिंदी बाइबिलीय नाम-रूप है। ‘पूर्वज’ यहाँ οἱ πατέρες μου के कुल-पितृ/पुरखों वाले व्यापक संदर्भ को स्वाभाविक रूप से व्यक्त करता है, जबकि मुख्य पाठ में ‘दफन हैं’ जैसी प्रसंगानुमित सूचना नहीं जोड़ी गई है।
