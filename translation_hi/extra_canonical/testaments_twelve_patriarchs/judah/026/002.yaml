translation:
  language: hi
  text: कोई मुझे बहुमूल्य वस्त्र पहनाकर दफन न करे; बल्कि मुझे हेब्रोन ले जाओ[a], जहाँ मेरे पूर्वज भी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “ऊपर ले जाओ।”'
    reason: ἀναγάγετε में निहित ऊपर की ओर ले जाने के भाव को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: बहुमूल्य वस्त्र पहनाकर
  rationale: यूनानी पद का अर्थ ‘महँगे/बहुमूल्य वस्त्र में’ है। हिंदी में दफनाने के प्रसंग में ‘वस्त्र पहनाकर’ स्वाभाविक और स्पष्ट है।
- source_word: ἀναγάγετε
  choice: ले जाओ
  rationale: क्रिया में ऊपर की ओर ले जाने का भाव है, पर हिंदी में गंतव्य के साथ ‘हेब्रोन ले जाओ’ अधिक स्वाभाविक है; शाब्दिक भाव फुटनोट में सुरक्षित रखा गया है।
- source_word: οἱ πατέρες μου
  choice: मेरे पूर्वज
  rationale: यहाँ मृत कुलपिताओं/पुरखों का संकेत है। आधुनिक हिंदी में ‘पूर्वज’ स्पष्ट है और केवल निकटवर्ती जैविक पिता का भ्रम नहीं पैदा करता।
theological_decisions:
- issue: पूर्वजों के साथ होने का आशय
  choice: ‘जहाँ मेरे पूर्वज भी हैं’ के स्थानगत कथन को यथावत रखा
  alternative: ‘मेरे पूर्वजों के पास’ या ‘जहाँ मेरे पूर्वज भी दफन हैं’
  rationale: यूनानी में केवल ‘जहाँ मेरे पूर्वज भी [हैं]’ कहा गया है। ‘दफन हैं’ प्रसंग से संभव है, पर उसे मुख्य पाठ में जोड़ने से निहित बात स्पष्ट कथन बन जाती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। उपलब्ध यूनानी पाठ को प्राथमिकता दी गई है, क्योंकि दिया गया अंग्रेज़ी परामर्श-पाठ इस यूनानी वाक्य से मेल नहीं खाता।
