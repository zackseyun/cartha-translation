base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/001.yaml
  text: Therefore keep, my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness.
translation:
  language: hi
  text: इसलिए, मेरे बच्चो, प्रभु की सारी व्यवस्था का पालन करो, क्योंकि जो उसके मार्गों को सीधा करते हैं, उनके लिए आशा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: पालन करो
  rationale: आज्ञा के रूप में प्रयुक्त इस क्रिया का अर्थ यहाँ केवल सुरक्षित रखना नहीं, बल्कि व्यवस्था को मानना और उसके अनुसार चलना है।
- source_word: πάντα τὸν νόμον Κυρίου
  choice: प्रभु की पूरी व्यवस्था
  rationale: πάντα समग्रता पर बल देता है; νόμος के लिए बाइबलीय संदर्भ में सहज और स्थापित हिन्दी शब्द ‘व्यवस्था’ चुना गया है।
- source_word: κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: उसके मार्गों पर सीधाई से चलते हैं
  rationale: यूनानी पद का शाब्दिक रूप ‘उसके मार्गों को सीधा करते हैं’ है। प्रसंग में यह परमेश्वर के मार्गों के अनुसार सीधे आचरण करने का भाव देता है; हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई और शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित रखी गई।
- source_word: ἐλπὶς
  choice: आशा
  rationale: मूल संज्ञा का सीधा और प्रसंगानुकूल हिन्दी समतुल्य है; पाठ यह स्पष्ट नहीं करता कि आशा का विशिष्ट विषय क्या है।
theological_decisions:
- issue: ‘उसके मार्गों को सीधा करना’ और ‘उसके मार्गों पर सीधाई से चलना’
  choice: मुख्य पाठ में नैतिक आचरण का स्वाभाविक हिन्दी रूप रखा गया है।
  alternative: ‘जो उसके मार्गों को सीधा करते हैं’
  rationale: शाब्दिक विकल्प को मुख्य पाठ में रखने से ऐसा आभास हो सकता है कि मनुष्य प्रभु के मार्गों को सुधारता है। फिर भी यूनानी की संरचना को छिपाया नहीं गया, इसलिए उसे पाद-टिप्पणी में दिया गया है।
- issue: आशा किसके लिए है
  choice: ‘उनके लिए आशा है’
  alternative: ‘वह उनकी आशा है’
  rationale: ἐστὶν ἐλπὶς τοῖς... अनिश्चित रूप से ‘आशा है’ कहता है; व्यवस्था अथवा प्रभु को स्पष्ट रूप से ‘उनकी आशा’ ठहराना मूल की अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आज्ञात्मक शैली रखी गई है। ‘मेरे बच्चो’ आत्मीय संबोधन है; ‘प्रभु’ और ‘व्यवस्था’ बाइबलीय संदर्भ के परिचित शब्द हैं।
