- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला प्रत्यक्ष उद्गार है और यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: एक सौ अठारह वर्ष का हूँ
  rationale: यूनानी में शाब्दिक रूप से आयु के वर्षों का उल्लेख है; हिन्दी में आयु बताने का स्वाभाविक ढंग अपनाया गया है।
- source_word: ἀποθνῄσκω σήμερον
  choice: आज मैं मर रहा हूँ
  rationale: वर्तमानकालीन क्रिया मृत्यु की आसन्नता को व्यक्त करती है; इसे भविष्यकाल में बदलकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
