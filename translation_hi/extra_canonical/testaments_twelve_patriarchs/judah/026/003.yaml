  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/003.yaml
  text: And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.
translation:
  language: hi
  text: और ये बातें कहकर वह सो गया। उसके पुत्रों ने ठीक वैसा ही किया जैसा उसने उन्हें आज्ञा दी थी, और उन्होंने उसे हेब्रोन में उसके पूर्वजों के साथ दफ़ना दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: मृत्यु के लिए प्रयुक्त यूनानी सौम्य रूपक को बनाए रखता है; स्रोत में अंग्रेज़ी परामर्श-पाठ का ‘अच्छे बुढ़ापे में’ वाक्यांश नहीं है।
- source_word: κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς
  choice: ठीक वैसा ही किया जैसा उसने उन्हें आज्ञा दी थी
  rationale: ‘सब कुछ जो उसने उन्हें आदेश दिया था’ का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पूर्वजों के साथ
  rationale: यहाँ πατέρες वंशगत पुरखों को सूचित करता है; आधुनिक हिन्दी में ‘पूर्वज’ स्पष्ट और स्वाभाविक है।
- source_word: ἐν Χεβρὼν
  choice: हेब्रोन में
  rationale: यूनानी स्थाननाम का प्रचलित हिन्दी लिप्यंतरण और ἐν के स्थानीय अर्थ का सीधा अनुवाद।
theological_decisions:
- issue: ἐκοιμήθη में मृत्यु का रूपक
  choice: सो गया
  alternative: मर गया
  rationale: मूल पाठ जानबूझकर ‘सो गया’ कहता है; इसे ‘मर गया’ कर देना मूल की रूपकात्मक और संभावित धर्मवैचारिक प्रतिध्वनि को मिटा देता।
- issue: अंग्रेज़ी POB में अतिरिक्त काल-परिस्थिति
  choice: ‘अच्छे बुढ़ापे में’ को शामिल नहीं किया
  alternative: वह अच्छे बुढ़ापे में सो गया
  rationale: प्रदत्त यूनानी पाठ में इस वाक्यांश का आधार नहीं है; मूल-भाषा साक्ष्य को प्राथमिकता दी गई।
- issue: अंग्रेज़ी POB का ‘वे उसे हेब्रोन ले गए’
  choice: केवल हेब्रोन में दफ़नाने का कथन
  alternative: वे उसे हेब्रोन ले गए और वहाँ दफ़ना दिया
  rationale: प्रदत्त यूनानी में ‘ऊपर ले गए’ के अनुरूप कोई क्रिया नहीं है; ἔθαψαν ... ἐν Χεβρών केवल हेब्रोन में दफ़नाना बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘सो गया’ मूल के मृत्यु-संबंधी सौम्य रूपक को सुरक्षित रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
