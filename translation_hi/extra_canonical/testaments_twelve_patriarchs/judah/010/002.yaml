  text: But Er was wicked, and an angel of the Lord killed him.
translation:
  language: hi
  text: परन्तु एर दुष्ट था, और प्रभु के एक स्वर्गदूत ने उसे मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρός
  choice: दुष्ट
  rationale: यह शब्द नैतिक बुराई को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄγγελος Κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: यूनानी पदबंध अनिश्चित रूप में है; इसलिए किसी विशिष्ट स्वर्गदूत का संकेत दिए बिना ‘एक’ रखा गया है।
- source_word: ἐθανάτωσεν
  choice: मार डाला
  rationale: क्रिया का कारक अर्थ स्पष्ट है—स्वर्गदूत ने एर की मृत्यु कराई; ‘मार डाला’ इसका सहज और सटीक हिन्दी रूप है।
theological_decisions:
- issue: एर की मृत्यु में कर्ता की पहचान
  choice: प्रभु के एक स्वर्गदूत ने उसे मार डाला
  alternative: प्रभु ने उसे मार डाला
  rationale: मूल यूनानी स्पष्ट रूप से ‘प्रभु के एक स्वर्गदूत’ को क्रिया का कर्ता बताता है; इसे उत्पत्ति 38:7 की भाषा के अनुरूप बनाने के लिए बदलना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘परन्तु’ δέ के विरोधात्मक संबंध को दर्शाता है। कोई पादटिप्पणी आवश्यक नहीं है।
