source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ὅτε³³ ἠπείλησα αὐτῷ³⁴, συνῆλθε μὲν³⁵ αὐτῇ, *διέφθειρε δὲ τὸ σπέρμα³⁶ ἐπὶ³⁷ τῆν γῆν³⁸, κατὰ τὴν ἐντολὴν τῆς μητρὸς αὐτοῦ³⁹. καίγε οὗτος⁴⁰ ἀπέθανεν⁴¹ ἐν πονηρίᾳ⁴². 6. Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ⁴³, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ⁴⁴ οὐκ ἀφῆκεν⁴⁵. Ἐπονηρεύσατο γὰρ⁴⁶, ὅτι⁴⁷ οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/005.yaml
  text: And when I threatened him, he went in to her, but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because she was not from the daughters of Canaan, as she herself was.
translation:
  language: hi
  text: '5 जब मैंने उसे धमकाया, तब उसने उसके साथ सहवास किया, पर अपनी माँ की आज्ञा के अनुसार अपना वीर्य भूमि पर बहाकर नष्ट कर दिया। इसलिए वह भी दुष्टता में मर गया।


    6 मैं शेला को भी उसे देना चाहता था, पर शेला की माँ ने ऐसा नहीं होने दिया; क्योंकि उसने दुष्टतापूर्वक व्यवहार किया: तामार कनान की बेटियों में से नहीं थी, जबकि वह स्वयं कनान की बेटियों में से थी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆλθε αὐτῇ
  choice: वह उसके पास गया
  rationale: यह यौन-संबंध के लिए प्रयुक्त यूनानी मुहावरा है। हिन्दी में यह बाइबिलीय शालीनता बनाए रखते हुए संदर्भ से अर्थ स्पष्ट करता है।
- source_word: διέφθειρε δὲ τὸ σπέρμα ἐπὶ τῆν γῆν
  choice: अपना वीर्य भूमि पर बहाकर नष्ट कर दिया
  rationale: σπέρμα का सामान्य अर्थ ‘बीज’ हो सकता है, पर इस यौन प्रसंग में ‘वीर्य’ आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; διέφθειρε की नष्ट करने की धारणा भी सुरक्षित है।
- source_word: ἐν πονηρίᾳ
  choice: दुष्टता में
  rationale: मूल की नैतिक भाषा और उसकी संक्षिप्तता को बनाए रखा गया है; इसे किसी विशिष्ट पाप तक सीमित नहीं किया गया।
- source_word: Σηλὼμ
  choice: शेला
  rationale: यह यहूदा के पुत्र के प्रचलित बाइबिलीय नाम के अनुरूप हिन्दी रूप है।
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: कनान की बेटियों में से
  rationale: मूल की सामुदायिक/वंशगत अभिव्यक्ति को औपचारिक रूप से बनाए रखा गया है।
theological_decisions:
- issue: ओनान की मृत्यु और उसकी दुष्टता के बीच संबंध
  choice: इसलिए वह भी दुष्टता में मर गया
  alternative: इस कारण परमेश्वर ने उसे मार डाला
  rationale: मूल केवल यह कहता है कि वह दुष्टता में मरा; वह कर्ता के रूप में परमेश्वर का स्पष्ट उल्लेख नहीं करता। अनुवाद ने अतिरिक्त कारण या दैवी कर्तृत्व नहीं जोड़ा।
- issue: अंतिम वाक्य में सर्वनामों की पहचान
  choice: ‘वह स्त्री’ से तामार और ‘वह स्वयं’ से शेला की माँ का संकेत स्पष्ट किया
  alternative: दोनों स्थानों पर केवल ‘वह’ रखना
  rationale: यूनानी में स्त्रीलिंग सर्वनाम संदर्भ से अलग-अलग स्त्रियों की ओर संकेत करते हैं। हिन्दी में लगातार ‘वह’ रखने से वाक्य लगभग अबोध हो जाता; संज्ञा जोड़े बिना ‘वह स्त्री’ और ‘वह स्वयं कनानी थी’ द्वारा संदर्भ स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यौन प्रसंग को न तो अश्लील बनाया गया है, न अस्पष्ट; पद 5 और 6 को उपलब्ध स्रोत-पाठ के अनुसार अलग अंकित किया गया है।
