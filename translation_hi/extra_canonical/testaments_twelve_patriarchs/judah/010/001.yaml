  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/001.yaml
  text: After these things, Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram.
translation:
  language: hi
  text: इन बातों के बाद मेरा पुत्र एर मेसोपोटामिया से अराम की बेटी तामार को अपने लिए पत्नी के रूप में ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: इन बातों के बाद
  rationale: यह यूनानी काल-संयोजक का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἄγεται
  choice: ले आया
  rationale: यहाँ ऐतिहासिक वर्तमान को हिन्दी कथात्मक भूतकाल में व्यक्त किया गया है; विवाह के लिए स्त्री को लाने का भाव अगले पदबंध से स्पष्ट किया गया है।
- source_word: ἑαυτῷ εἰς γυναῖκα
  choice: अपने लिए पत्नी बनाकर
  rationale: मध्यवाच्य और उद्देश्यसूचक पदबंध—अपने लिए पत्नी के रूप में ग्रहण करना—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ἐκ Μεσοποταμίας
  choice: मेसोपोटामिया से
  rationale: ἐκ के उद्गम या प्रस्थान-स्थान के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: θυγατέρα Ἀράμ
  choice: अराम की बेटी
  rationale: सम्बन्धसूचक यूनानी संरचना का सीधा अनुवाद है; पाठ में अराम को व्यक्ति मानने और क्षेत्र मानने के बीच जो संभावित तनाव है, उसे किसी अतिरिक्त व्याख्या से नहीं सुलझाया गया।
