  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘ब्याह लाया’ की अपेक्षा ‘पत्नी बनाकर ले आया’ चुना गया, ताकि मूल के ‘अपने लिए’ और ‘पत्नी के रूप में’ दोनों घटक स्पष्ट रहें। उपलब्ध सामग्री में पाठांतर-संकेतों का विवरण नहीं दिया गया है, इसलिए कोई अप्रमाणित पादटिप्पणी नहीं जोड़ी गई।
