source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐν ταῖς ἡμέραις τοῦ θαλάμου¹⁸ *ἐπεγυμβρευσα αὐτῇ¹⁹ τὸν²⁰ Αὐνάν²⁰. Καίγε οὗτος²¹ ἐν πονηρίᾳ²² οὐκ ἔγνω αὐτήν²³, ποιήσας σὺν αὐτῇ ἐνιαυτόν²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/004.yaml
  text: During the days of the bridal chamber I gave her to Onan in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year.
translation:
  language: hi
  text: विवाह-कक्ष के दिनों में मैंने उसका ओनान के साथ देवर-विवाह करा दिया। पर उसने भी दुष्टतापूर्वक उसे नहीं जाना, यद्यपि वह एक वर्ष तक उसके साथ रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: विवाह-कक्ष के दिनों में
  rationale: शाब्दिक रूपक को बनाए रखा गया है; θάλαμος विवाह अथवा दांपत्य-कक्ष को सूचित करता है।
- source_word: ἐπεγυμβρευσα αὐτῇ τὸν Αὐνάν
  choice: मैंने उसका देवर-विवाह ओनान से करा दिया
  rationale: दुर्लभ क्रिया का आशय विधवा का मृत पति के भाई से विवाह कराना है। स्वाभाविक हिन्दी में संबंध स्पष्ट किया गया है, बिना मूल आशय बदले।
- source_word: οὐκ ἔγνω αὐτήν
  choice: उसे नहीं जाना
  rationale: यौन-संबंध के लिए प्रयुक्त बाइबलीय व्यंजना को ज्यों का त्यों रखा गया है; इसे अधिक स्पष्ट बनाकर मूल की संयत अभिव्यक्ति को समाप्त नहीं किया गया।
- source_word: ἐν πονηρίᾳ
  choice: दुष्टता के कारण
  rationale: वाक्य में कारणगत भाव स्वाभाविक है और ओनान के आचरण का नैतिक मूल्यांकन बनाए रखता है।
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: यद्यपि वह एक वर्ष तक उसके साथ रहा
  rationale: मुहावरे का अर्थ उसके साथ एक वर्ष बिताना है; विरोधसूचक संबंध को हिन्दी में ‘यद्यपि’ से व्यक्त किया गया।
theological_decisions:
- issue: ‘नहीं जाना’ का अर्थ
  choice: मूल की यौन-संबंध संबंधी व्यंजना सुरक्षित रखी गई
  alternative: उसके साथ दांपत्य संबंध नहीं बनाया
  rationale: स्पष्ट विकल्प अधिक सहज है, पर वह मूल यूनानी की जानबूझकर रखी गई व्यंजना को खोल देता है।
- issue: देवर-विवाह की पहचान
  choice: विवाह को ‘देवर-विवाह’ कहा गया
  alternative: मैंने उसे ओनान को पत्नी के रूप में दे दिया
  rationale: ἐπιγαμβρεύω संबंधी क्रिया विशिष्ट लेवीरेट प्रथा का संकेत देती है; ‘देवर-विवाह’ आधुनिक हिन्दी में इसे संक्षेप और ठीक ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘विवाह-कक्ष’ और ‘उसे नहीं जाना’ जैसे बाइबलीय रूपकों को मूल के निकट रहने के लिए सुरक्षित रखा गया है।
