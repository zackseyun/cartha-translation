revisions:
- from: विवाह-कक्ष के दिनों में मैंने उसका देवर-विवाह ओनान से करा दिया। फिर भी उसने भी दुष्टता के कारण उसे नहीं जाना, यद्यपि वह एक वर्ष तक उसके साथ रहा।
  to: विवाह-कक्ष के दिनों में मैंने उसका ओनान के साथ देवर-विवाह करा दिया। पर उसने भी दुष्टतापूर्वक उसे नहीं जाना, यद्यपि वह एक वर्ष तक उसके साथ रहा।
  rationale: The revision resolves the possessive ambiguity in the levirate-marriage clause and renders ἐν πονηρίᾳ as manner rather than as a stated cause. The restrained biblical euphemism for sexual relations and the source’s contrastive structure are retained.
