  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ¹⁴ αὐτὸς οὐκ ἔγνω αὐτὴν¹⁵ κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ¹⁵, οὐ γὰρ ἤθελεν ἔχειν τέκνα ἐξ¹⁷ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/003.yaml
  text: And he did not know her, by the scheming of his mother, for he did not want to have children by her.
translation:
  language: hi
  text: और उसने अपनी माता की धूर्त चाल के कारण उसके साथ सहवास नहीं किया, क्योंकि वह उससे संतान उत्पन्न नहीं करना चाहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνω αὐτήν
  choice: उसके साथ सहवास नहीं किया
  rationale: यूनानी में शाब्दिक अर्थ ‘उसे नहीं जाना’ है, पर यहाँ ‘जानना’ यौन-संबंध का प्रचलित शिष्टोक्ति-प्रयोग है। आधुनिक हिन्दी में अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है।
- source_word: κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ
  choice: अपनी माता की धूर्त चाल के कारण
  rationale: πανουργία यहाँ नकारात्मक अर्थ में चतुराई, छल या षड्यंत्रपूर्ण चाल को सूचित करता है। ‘के कारण’ इस प्रसंग में κατὰ के कारणात्मक भाव को सहज हिन्दी में व्यक्त करता है, बिना चाल का स्वरूप बताए।
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: उससे संतान उत्पन्न करना
  rationale: यह वाक्यांश उसके द्वारा उस स्त्री से संतान पाने/होने की इच्छा न रखने को व्यक्त करता है। एकवचन सामूहिक ‘संतान’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ‘जानना’ की यौन शिष्टोक्ति
  choice: मुख्य पाठ में अर्थ स्पष्ट करते हुए ‘सहवास नहीं किया’
  alternative: ‘उसे नहीं जाना’
  rationale: शाब्दिक विकल्प आधुनिक हिन्दी में यौन अर्थ स्पष्ट नहीं करता और गलत समझा जा सकता है; स्पष्ट अनुवाद स्रोत के अभिप्रेत अर्थ को सुरक्षित रखता है।
- issue: माता की चाल और पुत्र की इच्छा के बीच उत्तरदायित्व
  choice: दोनों कारणों को यथावत रखा गया—माता की धूर्त चाल और उसकी अपनी अनिच्छा
  alternative: किसी एक को निर्णायक कारण बनाना
  rationale: यूनानी पाठ दोनों तत्वों को साथ रखता है; अनुवाद इस तनाव को बिना समाधान थोपे सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘माता’ और ‘संतान’ साहित्यिक गरिमा देते हैं, जबकि ‘सहवास’ यौन शिष्टोक्ति का सटीक तथा संयत हिन्दी रूप है।
