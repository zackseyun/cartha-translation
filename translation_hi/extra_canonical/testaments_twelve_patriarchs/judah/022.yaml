  text: The Lord will bring divisions among them against one another[a], and there will be continual wars in Israel. And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes[c][b],
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 22**


    **1** तब प्रभु उनके बीच आपसी फूट डालेगा, और इस्राएल में निरन्तर युद्ध होते रहेंगे।[a]


    **2** और परदेशियों के बीच मेरा राज्य समाप्त किया जाएगा,[b] जब तक इस्राएल का उद्धार न आ जाए,[c] जब तक धार्मिकता के परमेश्वर का आगमन न हो,[d] याकूब और सभी जातियों को शांति से विश्राम दिलाने के लिए।


    **3** वह मेरे राज्य की शक्ति को सदा तक सुरक्षित रखेगा; क्योंकि प्रभु ने मुझसे शपथ खाई है कि वह मेरे वंश से राज्य को सदा के लिए नहीं मिटाएगा।[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘लगातार युद्ध।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘परदेशियों के बीच मेरा राज्य पूर्ण किया जाएगा।’ यूनानी क्रिया का अर्थ किसी बात का पूरा होना और उसका अन्त हो जाना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘इस्राएल का छुटकारा।’ इस पदबंध में मसीही अनुगूँज हो सकती है, पर यूनानी पाठ किसी व्यक्ति को स्पष्ट रूप से ‘उद्धारकर्ता’ नहीं कहता।
    reason: alternative_reading
  - marker: d
    text: या, ‘धार्मिकता के परमेश्वर की उपस्थिति।’ यूनानी παρουσία का अर्थ आगमन और उपस्थित होना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: e
    text: ‘वह’ व्याकरणतः निकटवर्ती ‘धार्मिकता के परमेश्वर’ की ओर संकेत करता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: Ἐπάξει
  choice: डालेगा
  rationale: भविष्यत्कालीन क्रिया यहाँ किसी स्थिति को उत्पन्न करने या लोगों पर लाने का भाव रखती है। ‘फूट डालेगा’ आधुनिक हिन्दी में स्वाभाविक है और प्रभु की सक्रिय भूमिका बनाए रखता है।
- source_word: διαιρέσεις κατ᾽ ἀλλήλων
  choice: आपसी फूट
  rationale: διαιρέσεις आन्तरिक विभाजन को और κατ᾽ ἀλλήλων परस्पर विरोध को व्यक्त करता है। ‘आपसी फूट’ दोनों भावों को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: πόλεμοι συνεχεῖς
  choice: निरन्तर युद्ध
  rationale: स्रोत-साक्ष्य और परामर्श-परत में युद्धों के लगातार बने रहने का अर्थ है; ‘निरन्तर युद्ध’ उसकी कालगत तीव्रता बनाए रखता है।
- source_word: ἀλλοφύλοις
  choice: परदेशियों
  rationale: शब्द का व्यापक अर्थ दूसरे लोगों या विदेशी जातियों से है। यहाँ इसे विशेष रूप से पलिश्तियों तक सीमित करने के लिए पर्याप्त प्रसंग नहीं है।
- source_word: συντελεσθήσεται
  choice: समाप्त हो जाएगा
  rationale: क्रिया पूर्ण किए जाने और अन्त तक पहुँचने, दोनों अर्थ दे सकती है। फूट और युद्ध के नकारात्मक प्रसंग में समाप्ति अधिक सम्भावित है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: इस्राएल का उद्धार
  rationale: नपुंसकलिंग σωτήριον यहाँ मुख्यतः उद्धार या छुटकारे को सूचित करता है, किसी व्यक्ति को स्पष्ट रूप से ‘उद्धारकर्ता’ नहीं कहता। हिन्दी ‘उद्धार’ घटना और सम्भावित मसीही अनुगूँज दोनों को खुला रखता है।
- source_word: παρουσίας Θεοῦ τῆς δικαιοσύνης
  choice: धार्मिकता के परमेश्वर का आगमन
  rationale: παρουσία को यहाँ ‘आगमन’ कहना भविष्यसूचक गति के अनुकूल है। Θεοῦ τῆς δικαιοσύνης की संबंधवाचक रचना को बिना किसी सम्प्रदायगत विस्तार के ‘धार्मिकता के परमेश्वर’ कहा गया है।
- source_word: τοῦ ἡσυχάσαι τὸν Ἰακὼβ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη
  choice: जो याकूब और सब जातियों को शांति में विश्राम देगा
  rationale: ἡσυχάζω का भाव शांत होने या चैन पाने का है। हिन्दी में कारक अर्थ ‘विश्राम देगा’ वाक्य-संबंध को स्पष्ट और पठनीय बनाता है, पर मूल उद्देश्यसूचक infinitive का आशय बनाए रखता है।
- source_word: φυλάξει κράτος τῆς βασιλείας μου
  choice: मेरे राज्य की शक्ति की रक्षा करेगा
  rationale: φυλάσσω रक्षा या संरक्षण और κράτος शक्ति अथवा प्रभुत्व को व्यक्त करते हैं। ‘राज्य की शक्ति’ मूल संबंधवाचक रचना के निकट है।
- source_word: ἐκ τοῦ σπέρματός μου
  choice: मेरे वंश से
  rationale: σπέρμα का शाब्दिक अर्थ बीज है, पर वंशगत राजसत्ता के इस प्रसंग में ‘वंश’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: τὸ σωτήριον τοῦ Ἰσραήλ का स्वरूप
  choice: इस्राएल का उद्धार
  alternative: इस्राएल का छुटकारा; इस्राएल का उद्धारकर्ता
  rationale: यूनानी रूप स्वाभाविक रूप से उद्धार की वस्तु या घटना बताता है। सम्भावित मसीही अनुगूँज को न नकारा गया है, न मुख्य पाठ में उसे स्पष्ट व्यक्ति बनाकर तय किया गया है।
- issue: συντελεσθήσεται ἡ βασιλεία μου का अर्थ
  choice: मेरा राज्य समाप्त हो जाएगा
  alternative: मेरा राज्य पूर्ण किया जाएगा
  rationale: तात्कालिक प्रसंग फूट और निरन्तर युद्ध का है, इसलिए समाप्ति का अर्थ अधिक उपयुक्त है। क्रिया की वास्तविक ‘पूर्ण होने’ वाली अर्थ-सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: παρουσία का अनुवाद
  choice: आगमन
  alternative: उपस्थिति; प्रकट होना
  rationale: भविष्यसूचक ‘जब तक’ संरचना में ‘आगमन’ स्वाभाविक है, पर शब्द स्थायी उपस्थिति का भाव भी रख सकता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: पद 3 में αὐτός का पूर्वपद
  choice: वही
  alternative: वह—अर्थात परमेश्वर; वह—अर्थात इस्राएल के उद्धार से सम्बद्ध व्यक्ति
  rationale: पुल्लिंग सर्वनाम का सन्दर्भ व्याकरण और निकटवर्ती पदबंध के कारण पूरी तरह निर्विवाद नहीं है। ‘वही’ अस्पष्टता बनाए रखता है और पादटिप्पणी पाठक को इससे अवगत कराती है।
- issue: राज्य के अनन्त बने रहने का कथन
  choice: मेरे वंश से राज्य को सदा के लिए नहीं मिटाएगा
  alternative: मेरे वंश से राजत्व को कभी समाप्त नहीं करेगा
  rationale: मूल पाठ यहूदा के वंश और βασίλειον के बीच स्थायी सम्बन्ध बताता है। अनुवाद इससे आगे बढ़कर किसी विशेष ऐतिहासिक या सम्प्रदायगत पूर्ति की पहचान नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यसूचक लय बनाए रखने के लिए ‘जब तक…न’ और ‘सदा तक’ का प्रयोग हुआ है। ‘जातियाँ’, ‘वंश’, ‘उद्धार’ और ‘राज्य’ जैसे परिचित धार्मिक-ऐतिहासिक शब्द चुने गए हैं, पर किसी विशिष्ट सम्प्रदाय की पारिभाषिक व्याख्या नहीं जोड़ी गई।
