base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023.yaml
  text: 'Until the coming of the God of righteousness[a], to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me with an oath not to blot out the kingdom.


    Great indeed is my grief, my children, because of the acts of sexual immorality and sorceries that you will practice in the kingdom, following ventriloquists and omens and demons of deception. You will make your daughters musicians and prostitutes, and you will mingle in the abominations of the nations. Because of these things the Lord will bring upon you famine and pestilence, death and a sword of vengeance, siege, and the insults of enemies and friends[d][c][b]. By foreigners my kingdom will be brought to its end.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 23**


    **1** मेरे बच्चो, मुझे बहुत दुःख है, क्योंकि तुम राज्य में निर्लज्ज यौनाचार और जादू-टोना करोगे। तुम पेट से बोलनेवाले ओझाओं[a], शकुनों और भटकानेवाली दुष्टात्माओं के पीछे चलोगे।


    **2** तुम अपनी बेटियों को गायिका और वेश्या बना दोगे[b], और अन्यजातियों के घृणित आचरणों में घुल-मिल जाओगे।


    **3** इन बातों के कारण प्रभु तुम पर अकाल और महामारी, मृत्यु और बदला लेनेवाली तलवार, घेराबंदी, चीर-फाड़ने के लिए कुत्ते, शत्रुओं के ताने और शत्रुओं के हाथों विनाश[c], आँखों का सड़ना, शिशुओं की हत्या, संपत्ति की लूट, परमेश्वर के मंदिरों का जलाया जाना, भूमि का उजाड़ा जाना और स्वयं तुम्हारी अन्यजातियों में दासता लाएगा।


    **4** वे तुम्हारे बेटों को बधिया करके अपनी स्त्रियों के लिए खोजे बना देंगे।


    **5** यह तब तक रहेगा, जब तक तुम्हारा प्रभु तुम्हारी सुधि न ले। पूरे मन से पश्चाताप करो और उसकी सभी आज्ञाओं पर चलते हुए, वह तुम्हें अन्यजातियों की बंधुआई से निकाल लाएगा[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘पेट से बोलनेवाले’ है। प्राचीन संसार में यह पद उन ओझाओं या आत्मिक माध्यमों के लिए प्रयुक्त होता था जो मृतकों अथवा आत्माओं की वाणी सुनाने का दावा करते थे।
    reason: cultural_note
  - marker: b
    text: यूनानी पदों का शाब्दिक रूप ‘संगीत में निपुण स्त्रियाँ और सार्वजनिक स्त्रियाँ’ है; इस संदर्भ में दूसरा पद संभवतः वेश्याओं को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: ‘शत्रुओं के हाथों विनाश’ का यूनानी पद शाब्दिक रूप से ‘शत्रुओं का विनाश’ भी पढ़ा जा सकता है। संदर्भ तुम पर आनेवाले दंडों की सूची है।
    reason: ambiguity
  - marker: d
    text: 'इस पद का यूनानी वाक्य संक्षिप्त और व्याकरण की दृष्टि से असमतल है। ‘पूरे मन से पश्चाताप करो’ आज्ञार्थक है, जबकि आगे ‘उसकी आज्ञाओं पर चलते हुए’ और ‘वह तुम्हें ... निकाल लाएगा’ का संबंध पूरी तरह स्पष्ट नहीं है। इसे इस प्रकार भी विराम दिया जा सकता है: ‘जब तक तुम्हारा प्रभु तुम्हारी सुधि न ले—पूरे मन से पश्चाताप करो और उसकी सभी आज्ञाओं पर चलो—और वह तुम्हें अन्यजातियों की बंधुआई से निकाल लाए।’'
    reason: textual_syntax
lexical_decisions:
- source_word: ἀσελγείας
  choice: निर्लज्ज यौनाचार
  rationale: यह शब्द केवल सामान्य अनैतिकता नहीं, बल्कि निर्लज्ज और उच्छृंखल कामुक आचरण व्यक्त करता है।
- source_word: γοητείας
  choice: जादू-टोना
  rationale: अवैध जादुई क्रियाओं के लिए सहज और व्यापक रूप से समझा जानेवाला आधुनिक हिन्दी पद।
- source_word: ἐγγαστρομύθους
  choice: पेट से बोलनेवाले ओझाओं
  rationale: यूनानी का शाब्दिक चित्र ‘पेट से बोलनेवाले’ है, पर प्राचीन संदर्भ में ये प्रेतात्माओं से संपर्क का दावा करनेवाले माध्यम थे; ‘ओझाओं’ से धार्मिक-सांस्कृतिक आशय स्पष्ट रहता है।
- source_word: κληδόσι
  choice: शकुनों
  rationale: यह उन संकेतों या आकस्मिक कथनों को दर्शाता है जिन्हें भविष्यसूचक संकेत माना जाता था।
- source_word: δαίμοσιν πλάνης
  choice: भटकानेवाले दुष्टात्माओं
  rationale: गुण या प्रभाव बतानेवाले संबंधकारक को स्वाभाविक हिन्दी में रखा गया है; ‘दुष्टात्मा’ यहाँ दैवी-विरोधी आत्मिक सत्ता का अर्थ स्पष्ट करता है।
- source_word: μουσικὰς καὶ δημοσίας
  choice: गायिका और वेश्या
  rationale: μουσικάς सार्वजनिक मनोरंजन से जुड़ी संगीत-कलाकार स्त्रियों और δημοσίας सार्वजनिक रूप से उपलब्ध स्त्रियों, अर्थात वेश्याओं, की ओर संकेत करता है।
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: बदला लेनेवाली तलवार
  rationale: स्रोत की कर्मकारक संज्ञा और उसके स्त्रीलिंग कृदंत को निकटता से बनाए रखा गया है।
- source_word: κύνας εἰς διασπασμόν
  choice: चीर-फाड़ने के लिए कुत्ते
  rationale: विनाशकारी न्याय की ठोस और कठोर मूल छवि को नरम नहीं किया गया।
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: आँखों का सड़ना
  rationale: σφακελισμός ऊतक के गलने या सड़ने को दर्शाता है; सामान्य पाठक के लिए स्पष्ट रूप चुना गया।
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: संपत्ति की लूट
  rationale: ὑπάρχοντα का प्रचलित अर्थ निजी माल-संपत्ति है, और ἁρπαγή हिंसक छीनने या लूट को दर्शाता है।
- source_word: ἐκτεμοῦσι ... εἰς εὐνούχους
  choice: बधिया करके ... खोजे बना देंगे
  rationale: क्रिया शारीरिक बधियाकरण और परिणामस्वरूप खोजा बनाए जाने को स्पष्ट करती है; मूल की कठोरता बरकरार रखी गई है।
- source_word: ἐπισκέψηται
  choice: सुधि ले
  rationale: यहाँ क्रिया केवल देखने नहीं, हस्तक्षेप करनेवाली कृपालु सुधि लेने या भेंट करने का भाव रखती है।
theological_decisions:
- issue: दंड-सूची में ‘शत्रुओं का विनाश’ (ἀπώλειαν ἐχθρῶν) का संबंध
  choice: शत्रुओं के हाथों विनाश
  alternative: शत्रुओं का विनाश
  rationale: पूरा अनुच्छेद समुदाय पर आनेवाले दंड गिनाता है, इसलिए संबंधकारक को कर्तृवाचक समझना संदर्भानुकूल है; फिर भी यूनानी पद अपने आप में दोनों अर्थ दे सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: पद 5 में पश्चात्ताप, आज्ञापालन और प्रभु की सुधि का संबंध
  choice: पश्चात्ताप और आज्ञापालन को प्रभु के छुड़ाने से जुड़ी परिस्थिति के रूप में रखा गया
  alternative: 'इसे स्वतंत्र आदेश मानना: ‘पूरे मन से पछताओ और उसकी सब आज्ञाओं पर चलो’'
  rationale: यूनानी वाक्य व्याकरण की दृष्टि से संक्षिप्त और असमतल है। अनुवाद घटनाओं का संबंध दिखाता है, पर ऐसी निश्चित धर्मशास्त्रीय कार्य-कारण योजना नहीं बनाता जो स्रोत स्पष्ट रूप से नहीं बताता।
- issue: ‘परमेश्वर के मंदिरों’ का बहुवचन
  choice: मूल बहुवचन को बनाए रखा
  alternative: परमेश्वर के मंदिर का जलाया जाना
  rationale: ναῶν θεοῦ पाठ में बहुवचन है। किसी एक ऐतिहासिक मंदिर या घटना से सामंजस्य बैठाने के लिए इसे एकवचन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। भविष्यवाणी की कठोर दंड-छवियों को नरम नहीं किया गया। ‘अन्यजातियाँ’, ‘दुष्टात्माएँ’, ‘आज्ञाएँ’ और ‘बंधुआई’ जैसे परिचित धार्मिक पद संदर्भ की यहूदी वसीयतनामाई भाषा बनाए रखते हैं; जहाँ यूनानी पाठ वास्तविक रूप से अस्पष्ट या असमतल है, वहाँ मुख्य पाठ को पठनीय रखते हुए पादटिप्पणी में विकल्प दिया गया है।
