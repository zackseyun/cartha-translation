  text: '1[a]. For it leads astray, because in the delusion of silver they call those who are not gods gods, and it makes the one who has it fall into frenzy. 2. Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless. 3. But the God of my fathers had mercy on me, because I did this in ignorance[b]. 4. For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast. 9. And the spirit of truth testifies against all things, and the sinner is burned up by his own heart[c], and cannot lift up his face to the judge.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 20**


    1 इसलिए, मेरे बच्चो, जान लो कि दो आत्माएँ मनुष्य के साथ लगी रहती हैं—सत्य की आत्मा और भटकाव की आत्मा। 2 उनके बीच विवेक[a] है, और मनुष्य जिस ओर चाहे उसकी ओर झुक सकता है। 3 इन दोनों में से प्रत्येक मनुष्यों के कर्मों से पहचानी जाती है, क्योंकि वे प्रभु द्वारा उनके सीने में लिखे हुए हैं। 4 ऐसा कोई समय नहीं है जब मनुष्यों के कर्म प्रभु की दृष्टि से बच सकें, क्योंकि वे उनके सीने में लिखे हुए हैं। 5 सत्य की आत्मा सबके विरुद्ध दोषारोपण करती है; पापी अपने ही हृदय से दग्ध होता है और न्यायाधीश के सामने सिर नहीं उठा सकता।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 2–4 का यूनानी पाठ कठिन और पाठभेदों से युक्त है, विशेषकर ‘विवेक’ तथा सीने में लिखे होने के वर्णन के विषय में। अनुवाद उपलब्ध साक्ष्यों के साझा आशय को व्यक्त करता है, न कि किसी एक विस्तृत पाठरूप को निश्चित मानता है।
    reason: textual_variant
  - marker: b
    text: यूनानी वाक्यांश का शाब्दिक अर्थ है, ‘अपने ही हृदय से दग्ध होता है।’ इसका संबंध इस तरह भी समझा जा सकता है कि उसका अपना हृदय उसे दग्ध करता है। अंतिम वाक्य न्यायालय के बिंब को आगे बढ़ाता है।
    reason: lexical_and_metaphorical_ambiguity
lexical_decisions:
- source_word: δύο πνεύματα
  choice: दो आत्माएँ
  rationale: यूनानी पाठ वास्तविक नैतिक-आध्यात्मिक शक्तियों की भाषा बोलता है। ‘आत्माएँ’ इस भाषा को बनाए रखता है, पर उन्हें केवल मनोवैज्ञानिक प्रवृत्तियाँ या निश्चित रूप से स्वर्गदूत/दुष्टात्माएँ घोषित नहीं करता।
- source_word: σχολάζουσι τῷ ἀνθρώπῳ
  choice: मनुष्य के साथ लगी रहती हैं
  rationale: क्रिया यहाँ कठिन है और किसी व्यक्ति के साथ उपस्थित तथा सक्रिय रहने का भाव देती है। यह चयन स्वाभाविक हिन्दी में उस सक्रिय संगति को व्यक्त करता है।
- source_word: πλάνη
  choice: भटकाव
  rationale: शब्द में भूल, भ्रम और नैतिक पथभ्रष्टता तीनों की गुंजाइश है। ‘भटकाव’ इस व्यापकता को ‘छल’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: συνείδησις
  choice: विवेक
  rationale: यह भीतरी नैतिक चेतना को दर्शाता है। ‘विवेक’ आधुनिक हिन्दी में सहज है और केवल बौद्धिक समझ तक अर्थ को सीमित नहीं करता।
- source_word: στῆθος
  choice: सीना
  rationale: यूनानी पाठ की शारीरिक और लेख-अंकन संबंधी छवि को बनाए रखने के लिए ‘हृदय’ के बजाय ‘सीना’ रखा गया है।
- source_word: κατηγορεῖ
  choice: दोष लगाती है
  rationale: क्रिया का न्यायिक अर्थ आरोप लगाने का है। यह पद 5 के न्यायी-संबंधी बिंब के साथ स्पष्ट और स्वाभाविक हिन्दी देता है।
- source_word: κριτής
  choice: न्यायी
  rationale: शब्द न्याय करने वाले व्यक्ति को सूचित करता है। ‘न्यायी’ धार्मिक-साहित्यिक गरिमा बनाए रखते हुए ‘न्यायाधीश’ से कम प्रशासनिक सुनाई देता है।
theological_decisions:
- issue: ‘दो आत्माओं’ का स्वरूप
  choice: उन्हें सत्य और भटकाव की वास्तविक नैतिक-आध्यात्मिक शक्तियों के रूप में रखा गया है।
  alternative: उन्हें केवल दो मनोवैज्ञानिक प्रवृत्तियाँ अथवा स्पष्ट रूप से दो अलौकिक प्राणी मानना।
  rationale: πνεύματα का सीधा अर्थ सुरक्षित रखा गया है, जबकि पाठ जितना कहता है उससे आगे जाकर उनका व्यवस्थित तात्त्विक स्वरूप निर्धारित नहीं किया गया।
- issue: विवेक की इच्छा और नैतिक झुकाव
  choice: विवेक को दोनों के बीच जिधर चाहे झुक सकने वाला बताया गया है।
  alternative: मनुष्य स्वयं स्वतंत्र रूप से चुनता है, या कोई आत्मा विवेक को अनिवार्य रूप से नियंत्रित करती है।
  rationale: कठिन यूनानी वाक्य में कर्ता अस्पष्ट है। हिन्दी में भीतरी विवेक के झुकाव का सामान्य अर्थ दिया गया है, बिना स्वतंत्र इच्छा की विस्तृत धार्मिक व्याख्या आरोपित किए।
- issue: सत्य की आत्मा का न्यायिक कार्य
  choice: वह ‘सब पर दोष लगाती है।’
  alternative: वह केवल प्रत्येक पाप का साक्ष्य देती है, अथवा सभी मनुष्यों को दोषी ठहराती है।
  rationale: πάντων का संदर्भ व्यापक और कुछ अस्पष्ट है; अनुवाद न्यायिक बल बनाए रखता है, पर ‘सब’ को वस्तुओं, कर्मों या व्यक्तियों में से किसी एक तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘मेरे बच्चो’, ‘विवेक’, ‘सीना’ और ‘सिर नहीं उठा सकता’ जैसे प्रयोग प्राकृतिक हिन्दी देते हैं। मूल के आत्मिक, शारीरिक-अंकन और न्यायिक बिंब सुरक्षित रखे गए हैं; भ्रष्ट या कठिन पाठ को पादटिप्पणी में स्पष्ट किया गया है।
