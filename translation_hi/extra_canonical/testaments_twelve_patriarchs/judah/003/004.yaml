translation:
  language: hi
  text: और अखोर से दो घंटे तक लड़ने के बाद मैंने उसे मार डाला; और उसकी ढाल को दो टुकड़ों में काटकर उसके पाँव काट डाले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀχὼρ
  choice: आखोर
  rationale: यूनानी व्यक्तिनाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: ἐπὶ ὥρας δύο
  choice: दो घंटे तक
  rationale: अवधि बताने वाले यूनानी पदबंध का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: ἀπέκτεινα
  choice: मार डाला
  rationale: क्रिया के स्पष्ट वध-संबंधी अर्थ को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς δύο μέρη ποιήσας τὴν ἀσπίδα αὐτοῦ
  choice: उसकी ढाल के दो टुकड़े करके
  rationale: कृदंत रचना और ढाल को दो भागों में करने की क्रिया, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: συνέκοψα τοὺς πόδας αὐτοῦ
  choice: उसके पाँव काट डाले
  rationale: συγκόπτω की प्रबल काटने की क्रिया को व्यक्त करता है और प्रसंग में अंग काट डालने का भाव स्वाभाविक रूप से देता है।
