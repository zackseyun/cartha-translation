  text: But I wrapped my garment around my arm and slung four stones at them; from behind and in front around the waist of one seated on a horse, I picked up a stone of sixty litras and hurled it, struck the horse, and killed it. And I fought King Nahor for about two hours, and after smashing the shield into pieces, I cut off his feet, and so I killed him.
translation:
  language: hi
  text: पर मैंने अपना वस्त्र अपनी बाँह पर लपेट लिया और गोफन से उन पर पत्थर चलाए। मैंने उनमें से चार को मार डाला, और बाकी भाग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνελύθην … τὴν στολήν μου ἐπὶ τὴν χεῖρά μου
  choice: मैंने अपना वस्त्र अपनी बाँह पर लपेट लिया
  rationale: यूनानी वाक्यांश वस्त्र को हाथ/बाँह के चारों ओर लपेटने का भाव देता है। युद्ध के प्रसंग में स्वाभाविक हिन्दी के लिए ‘बाँह’ चुना गया है।
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: गोफन से उन पर पत्थर चलाए
  rationale: σφενδονάω गोफन से प्रहार करने या पत्थर चलाने को व्यक्त करता है; साधनवाचक λίθοις को स्पष्ट रूप से ‘पत्थर’ रखा गया है।
- source_word: τέσσαρας ἐξ αὐτῶν ἀνεῖλον
  choice: मैंने उनमें से चार को मार डाला
  rationale: ἀναιρέω यहाँ युद्ध-संदर्भ में ‘मार डालना’ है; ‘चार’ व्यक्तियों की संख्या है, पत्थरों की नहीं।
- source_word: οἱ δὲ λοιποὶ ἔφυγον
  choice: और बाकी भाग गए
  rationale: सरल, सीधा और मूल के विरोधात्मक परिणाम को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कथात्मक और युद्ध-वर्णन के अनुरूप गरिमापूर्ण भाषा। उपलब्ध यूनानी स्रोत में केवल वस्त्र बाँह पर लपेटने, गोफन से पत्थर चलाने, चार जनों को मारने और शेष के भागने का वर्णन है; अंग्रेज़ी परामर्श-पाठ में जो घोड़े, साठ लित्रा के पत्थर और राजा नाहोर से युद्ध की अतिरिक्त सामग्री है, वह दिए गए यूनानी पद में नहीं होने के कारण अनुवाद में सम्मिलित नहीं की गई।
