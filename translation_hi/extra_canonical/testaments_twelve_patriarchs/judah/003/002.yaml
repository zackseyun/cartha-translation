  text: And the other king, Taphou, while he was sitting on the horse, I killed; and so I scattered all his people.
translation:
  language: hi
  text: और दूसरे राजा ताफू को, जब वह घोड़े पर बैठा हुआ था, मैंने मार डाला; और इस प्रकार मैंने उसके सभी लोगों को तितर-बितर कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν Ταφούα
  choice: ताफू को
  rationale: यूनानी व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण किया गया है; कर्मकारक संबंध को ‘को’ से व्यक्त किया गया है।
- source_word: καθήμενον ἐπὶ τοῦ ἵππου
  choice: जब वह घोड़े पर बैठा हुआ था
  rationale: कृदंत पदबंध की समकालिक परिस्थिति को सहज आधुनिक हिन्दी में स्पष्ट किया गया है। निश्चित उपपद का अनावश्यक स्वामित्वसूचक अर्थ नहीं जोड़ा गया।
- source_word: ἀνεῖλον
  choice: मैंने मार डाला
  rationale: यह क्रिया यहाँ युद्ध के प्रसंग में वध करने का स्पष्ट अर्थ देती है; ‘मार डाला’ स्वाभाविक और अर्थ-सटीक है।
- source_word: διεσκόρπισα
  choice: मैंने … तितर-बितर कर दिया
  rationale: प्रथम पुरुष एकवचन कर्ता और लोगों को पूरी तरह छिन्न-भिन्न करने की क्रिया सुरक्षित रखी गई है।
