source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ὅτε δὲ¹ *ἦλθον² οἱ δύο βασιλεῖς τῶν Χαναναίων τεθωρακισμένοι³ ἐπὶ τὰ *ποίμνια ἡμῶν⁴ καὶ λαὸς πολὺς⁵ *μετ᾽ αὐτῶν⁶, *κἀγὼ μόνος⁷ δραμὼν ἐπὶ τὸν βασιλέα⁸ †τὸν ἕνα⁹ καὶ κατεσπάραξα τὰ ὀστᾶ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/001.yaml
  text: And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I brought him down and so killed him.
translation:
  language: hi
  text: जब कनानियों के दोनों राजा कवच पहने हुए हमारे पशुओं के झुंडों पर चढ़ आए और उनके साथ बहुत-से लोग भी थे, तब मैं अकेला दौड़कर उनमें से एक राजा[a] पर टूट पड़ा और उसकी हड्डियाँ तोड़ डालीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी संस्करण में “एक” वाला पद पाठ-संदिग्ध चिह्न से अंकित है; आशय संभवतः दोनों राजाओं में से एक राजा है।
    reason: मुद्रित स्रोत में τὸν ἕνα के साथ पाठ-संदेह का चिह्न है; अनिश्चितता को छिपाने के बजाय संक्षेप में बताया गया है।
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: कवच पहने हुए
  rationale: यह कृदंत राजाओं के हथियारबंद और कवचधारी होने को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὰ ποίμνια ἡμῶν
  choice: हमारे पशुओं के झुंडों पर चढ़ आए
  rationale: ἐπί के शत्रुतापूर्ण आशय को 'पर चढ़ आए' व्यक्त करता है; 'पशुओं के झुंड' ποίμνια को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: κἀγὼ μόνος δραμὼν ἐπὶ
  choice: तब मैं अकेला दौड़कर ... पर टूट पड़ा
  rationale: दौड़ने और आक्रमण करने—दोनों भावों को स्वाभाविक, ऊर्जस्वी हिन्दी में बनाए रखता है।
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: उसकी हड्डियाँ तोड़ डालीं
  rationale: उपलब्ध यूनानी पाठ में स्पष्ट रूप से 'उसकी हड्डियाँ' है; तीव्र क्रिया को 'तोड़ डालीं' व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ में आए 'पिंडलियों पर मारना', 'गिराना' और 'मार डालना' इस प्रस्तुत यूनानी वाक्य में प्रत्यक्ष रूप से नहीं हैं, इसलिए उन्हें मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली दृढ़ और गरिमापूर्ण रखी गई है। युद्ध-वर्णन की तीव्रता बनी रहती है, पर प्रस्तुत यूनानी पाठ से बाहर की घटनाएँ नहीं जोड़ी गईं।
