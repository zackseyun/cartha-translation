base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/003.yaml
  text: And I found Achor, a giant man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.
translation:
  language: hi
  text: और मैंने विशालकाय राजा आखोर को पाया, जो घोड़े पर सवार होकर आगे और पीछे की ओर तीर चला रहा था। तब मैं उछलकर साठ लित्रा[a] का एक पत्थर उठा लाया, उसे घोड़े पर दे मारा और उसे मार डाला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लित्रा प्राचीन भार की एक इकाई थी; उसका सटीक मान स्थान और काल के अनुसार बदल सकता था।
    reason: अपरिचित प्राचीन भार-माप को समझाने के लिए।
  - marker: b
    text: ‘उसे’ से घोड़ा या आखोर अभिप्रेत हो सकता है; यूनानी पाठ में संदर्भ स्पष्ट नहीं है।
    reason: मूल पाठ की सर्वनाम-संबंधी अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Ἀχὼρ βασιλέα γίγαντα
  choice: दैत्याकार राजा आखोर
  rationale: βασιλέα को ‘राजा’ और γίγαντα को आकार/कद बताने वाले ‘दैत्याकार’ से व्यक्त किया गया है; नाम को ‘आखोर’ रूप में लिप्यंतरित किया गया।
- source_word: βάλλοντα τόξα ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: घोड़े पर आगे और पीछे की ओर तीर चला रहा था
  rationale: ग्रीक में शाब्दिक रूप से ‘धनुष चला रहा’ है, जिसका स्वाभाविक हिन्दी अर्थ ‘तीर चला रहा’ है; आगे और पीछे दोनों दिशाओं का उल्लेख सुरक्षित रखा गया।
- source_word: ἀνελάμενος λίθον
  choice: एक पत्थर उठाकर
  rationale: मध्य कृदन्त का अर्थ प्रसंग में पत्थर उठा लेने से है; इसे सहज हिन्दी क्रम में रखा गया।
- source_word: ἑξήκοντα λιτρῶν
  choice: साठ लित्रा का
  rationale: प्राचीन भार-माप को अनुमानित आधुनिक भार में बदलने के बजाय लिप्यंतरित किया गया, जिससे स्रोत की ऐतिहासिक विशिष्टता बनी रहे।
- source_word: δέδωκα τῷ ἵππῳ
  choice: घोड़े पर दे मारा
  rationale: पाठ का आशय पत्थर से घोड़े पर प्रहार करना है; हिन्दी में ‘दे मारा’ इस बलपूर्ण क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπέκτεινα αὐτόν
  choice: उसे मार डाला
  rationale: पुल्लिंग सर्वनाम αὐτόν का संदर्भ व्याकरणतः निकटवर्ती ‘घोड़े’ अथवा पहले उल्लिखित आखोर, दोनों में से हो सकता है; मुख्य पाठ में अस्पष्ट सर्वनाम को कायम रखा गया।
theological_decisions:
- issue: अंतिम सर्वनाम αὐτόν का संदर्भ
  choice: ‘उसे’ के रूप में संदर्भ अस्पष्ट रखा गया
  alternative: स्पष्ट रूप से ‘आखोर को’ या ‘घोड़े को’ कहना
  rationale: ग्रीक पुल्लिंग सर्वनाम दोनों संभावित पुल्लिंग पूर्वपदों से जुड़ सकता है। अनुवाद में किसी एक अर्थ को बिना पर्याप्त आधार निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। वाक्य-संरचना को हिन्दी में स्वाभाविक बनाया गया, पर ‘आगे और पीछे’, प्राचीन भार-माप तथा अंतिम सर्वनाम की अस्पष्टता जैसे स्रोतगत तत्व सुरक्षित रखे गए हैं।
