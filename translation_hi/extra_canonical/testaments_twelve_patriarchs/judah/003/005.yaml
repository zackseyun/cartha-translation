lexical_decisions:
- source_word: θώρακα
  choice: कवच
  rationale: यह शब्द धड़ की रक्षा करने वाले वक्ष-कवच को सूचित करता है; सामान्य पाठक के लिए स्वाभाविक ‘कवच’ पर्याप्त स्पष्ट है।
- source_word: ἰδού
  choice: तभी
  rationale: यहाँ कथानक में अचानक नई घटना की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘तभी’ इस प्रभाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἑταῖροι
  choice: साथी
  rationale: संदर्भ में उस पुरुष के साथ के लोगों के लिए तटस्थ और स्वाभाविक शब्द।
- source_word: πολεμεῖν με
  choice: मुझसे लड़ने
  rationale: क्रिया के युद्ध/संघर्ष-संबंधी अर्थ को प्रसंगानुकूल सहज हिन्दी में रखा गया है।
