  text: And the Lord gave me favor in all my works[a], in the field and in the house. I know that I ran with a hind and caught it, and I made it food for my father, and he ate. And I would seize the gazelle in its course, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and cast it down the cliff, and it was crushed. I ran down the wild boar, and I overtook it as I ran and tore it apart. I caught a wild mare and, after seizing it, subdued it. A leopard in Hebron sprang upon the dog, and I caught it by the tail and flung it against the rock, and it was split in two. I found a wild ox grazing in the land, and taking hold of its horns[c][b], I shook it round and round and struck it blind.
translation:
  language: hi
  text: '2


    1 और प्रभु ने मेरे सब कामों में—खेत में और घर में—मुझ पर अनुग्रह किया।[a][b] 2 मैं जानता हूँ कि मैं एक हिरनी के साथ-साथ दौड़ा और उसे पकड़ लिया; मैंने उसे अपने पिता के लिए भोजन बनाया, और उन्होंने खाया। 3 मैं दौड़ते हुए चिंकारे को पकड़ लेता था, और मैदानों में जो कुछ था, उसे जा पकड़ता था। 4 मैंने सिंह को मार डाला और उसके मुँह से बकरी का एक बच्चा छीन लिया। मैंने भालू का पैर पकड़कर उसे खड़ी चट्टान से नीचे फेंक दिया, और वह कुचल गया। 5 मैंने जंगली सूअर का पीछा करके उसे जा पकड़ा और दौड़ते-दौड़ते उसे चीर डाला। 6 हेब्रोन में एक तेंदुआ कुत्ते पर झपटा; मैंने उसकी पूँछ पकड़कर उसे चट्टान पर दे मारा, और वह दो टुकड़ों में फट गया। 7 मैंने एक जंगली बैल[c] को उस प्रदेश में चरते पाया। मैंने उसके सींग पकड़कर उसे गोल-गोल झकझोरा, उसे अंधा कर दिया, फिर पटककर मार डाला। 8 और मैंने एक सिंह को वश में किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अध्याय का यूनानी पाठ कुछ स्थानों पर कठिन और असंबद्ध है, विशेषकर वन्य पशुओं से हुई मुठभेड़ों के क्रम में। अनुवाद उपलब्ध यूनानी पाठ के आशय का अनुसरण करता है और उसकी आकस्मिक शैली को अनावश्यक रूप से समतल नहीं करता।
    reason: textual_variant
  - marker: b
    text: “अनुग्रह” का अर्थ यहाँ प्रभु की कृपा से मिली सफलता या सहायता है। इसे “कृपा” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “जंगली बैल” के स्थान पर “जंगली साँड़” भी संभव है। यूनानी शब्द एक शक्तिशाली, पालतू न बनाए गए गोवंशी पशु को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  choice: अनुग्रह
  rationale: यहाँ शब्द यहूदा के सभी कार्यों में प्रभु से मिली कृपापूर्ण सहायता और सफलता को व्यक्त करता है। “अनुग्रह” दैवी स्रोत को बनाए रखता है, जबकि पादटिप्पणी में “कृपा” का विकल्प दिया गया है।
- source_word: Κύριος
  choice: प्रभु
  rationale: ईश्वर के लिए प्रयुक्त उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
- source_word: ἐλάφῳ
  choice: हिरनी
  rationale: संदर्भ में सर्वनाम स्त्रीलिंग है; इसलिए सामान्य “हिरन” की अपेक्षा “हिरनी” अधिक सटीक है।
- source_word: δορκάδα
  choice: चिकारा
  rationale: δορκάς गज़ेल जाति के पशु को सूचित करता है; आधुनिक हिन्दी में “चिकारा” सहज और विशिष्ट नाम है।
- source_word: ἀφειλόμην
  choice: छीन लिया
  rationale: सिंह के मुँह से बलपूर्वक निकाल लेने की क्रिया को स्पष्ट करता है।
- source_word: κρημνόν
  choice: खड़ी चट्टान
  rationale: शब्द तीखी ढाल या खड़ी चट्टानी गिरावट को दर्शाता है; प्रसंग में नीचे फेंकने का दृश्य स्पष्ट होता है।
- source_word: βοῦν ἄγριον
  choice: जंगली बैल
  rationale: एक शक्तिशाली जंगली गोवंशी पशु का सामान्य, स्पष्ट हिन्दी रूप; “जंगली साँड़” भी संभव है।
- source_word: ἡμέρωσα
  choice: वश में किया
  rationale: क्रिया का अर्थ जंगली पशु को पालतू या काबू में करना है; “वश में किया” प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: यहूदा के पराक्रम में दैवी भूमिका
  choice: आरंभिक वाक्य यह स्पष्ट रखता है कि यहूदा को उसके सभी कार्यों में प्रभु का अनुग्रह मिला।
  alternative: इसे केवल एक सामान्य आशीष-वाक्य मानकर प्रत्यक्ष दैवी सहायता पर कम बल दिया जा सकता है।
  rationale: यूनानी पाठ सफलता का मूल यहूदा की अपनी शक्ति मात्र में नहीं, बल्कि प्रभु से प्राप्त χάρις में रखता है; अनुवाद दैवी अनुग्रह और मानवीय पराक्रम दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप रखा गया है। यूनानी स्रोत की संक्षिप्त, पराक्रम-सूची जैसी शैली और कुछ असमतल वाक्यक्रम को अत्यधिक विस्तार देकर नहीं सँवारा गया। उपलब्ध यूनानी स्रोत में अंग्रेज़ी परामर्श-पाठ का “जंगली घोड़ी” वाला वाक्य नहीं है, इसलिए उसे मुख्य पाठ में सम्मिलित नहीं किया गया; इसके विपरीत यूनानी में उपस्थित बैल को मार डालने और सिंह को वश में करने के कथन सुरक्षित रखे गए हैं।
