source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Εἶδε⁵⁶ γὰρ⁵⁷ *ἐν ὁράματι⁵⁸ †περὶ ἐμοῦ⁵⁹ ὅτι ἄγγελος δυνάμεως⁶⁰ συνέπεταί μοι⁶¹ ἐν πᾶσι, τοῦ μὴ⁶² ἡττᾶσθαί⁶³ μοι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/008.yaml
  text: For he saw in a vision concerning me that an angel of power accompanied me in all things, so that I might not be touched.
translation:
  language: hi
  text: क्योंकि उसने दर्शन में मेरे बारे में देखा था कि सामर्थ्य का एक स्वर्गदूत हर बात में मेरे साथ है, ताकि मैं पराजित न होऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος δυνάμεως
  choice: सामर्थ्य का एक स्वर्गदूत
  rationale: यह संबंधवाचक यूनानी पदबंध को स्वाभाविक हिन्दी में रखता है। यहाँ ἄγγελος के अलौकिक अभिप्राय को स्पष्ट करने के लिए ‘स्वर्गदूत’ चुना गया है, जबकि δυνάμεως को ‘सामर्थ्य’ कहा गया है।
- source_word: συνέπεταί μοι
  choice: मेरे साथ रहता है
  rationale: क्रिया साथ देने या साथ रहने का भाव व्यक्त करती है। ‘साथ रहता है’ प्रसंग में निरंतर संरक्षण का स्वाभाविक अर्थ देता है, बिना यह जोड़ने के कि स्वर्गदूत विशेष रूप से युद्ध कर रहा था।
- source_word: ἐν πᾶσι
  choice: हर बात में
  rationale: शाब्दिक ‘सब में’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है और यूनानी की व्यापकता बनाए रखता है।
- source_word: τοῦ μὴ ἡττᾶσθαί μοι
  choice: ताकि मैं पराजित न होऊँ
  rationale: ἡττάομαι का सामान्य अर्थ ‘हारना/पराजित होना’ है। इसलिए मूल यूनानी के आधार पर इसे ‘मुझे छुआ न जाए’ नहीं किया गया। उद्देश्यसूचक infinitive को हिन्दी में ‘ताकि’ से व्यक्त किया गया है।
theological_decisions:
- issue: स्वर्गदूत की भूमिका और परिणाम
  choice: साथ रहने के फलस्वरूप वक्ता पराजित नहीं होता
  alternative: स्वर्गदूत के कारण वक्ता को कोई छू नहीं सकता
  rationale: मूल पाठ स्वर्गदूत की उपस्थिति को वक्ता के पराजित न होने से जोड़ता है। ‘छूना’ यहाँ यूनानी क्रिया ἡττάομαι का प्रत्यक्ष अर्थ नहीं है और सुरक्षा के स्वरूप को अनावश्यक रूप से बदल देता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मेरे विषय में एक दर्शन में देखा था’ मूल वाक्य-विन्यास के निकट है; ‘हर बात में मेरे साथ रहता है’ साधारण पाठक के लिए सहज है।
