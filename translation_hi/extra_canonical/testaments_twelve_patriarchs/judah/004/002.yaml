lexical_decisions:
- source_word: ἀνῆλθον ... ἐπὶ τοῦ τείχους
  choice: शहरपनाह पर चढ़ गया
  rationale: यहाँ ἀνῆλθον ऊपर चढ़ने को और τεῖχος नगर की रक्षात्मक दीवार को दर्शाता है; ‘शहरपनाह’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: ἀνεῖλον
  choice: मार डाला
  rationale: क्रिया का अर्थ यहाँ राजा की हत्या करना है; सरल और स्पष्ट हिन्दी चुनी गई है।
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: सभी बंदियों को अपने अधिकार में ले लिया
  rationale: ग्रीक पद सामूहिक रूप से युद्ध में पकड़े गए लोगों को सूचित करता है। शाब्दिक ‘सारी बंधुआई’ की अपेक्षा यह हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है और स्रोत में उपस्थित अंतिम वाक्यांश को सुरक्षित रखता है।
