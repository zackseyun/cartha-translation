  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/003.yaml
  text: And so we set Hebron free and took all the captives.
translation:
  language: hi
  text: अगले दिन हम अरेता गए। वह एक शक्तिशाली नगर था और हमें जान से मार डालने की धमकी दे रहा था। मैं और गाद ने नगर के पूर्व से धावा बोला, और रूबेन और लेवी ने पश्चिम से। इस प्रकार हमने बंदी बनाए गए लोगों को छुड़ा लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: अगले दिन
  rationale: संदर्भ में यह मुहावरा अगले दिन की घटना का स्वाभाविक संकेत देता है।
- source_word: Ἀρετάν
  choice: अरेता
  rationale: यूनानी स्थान-नाम का निकट देवनागरी लिप्यंतरण; इसे परामर्श-पाठ के ‘हेब्रोन’ से नहीं बदला गया क्योंकि उपलब्ध यूनानी पाठ स्पष्ट रूप से अरेता कहता है।
- source_word: πόλιν κραταιάν
  choice: एक शक्तिशाली नगर
  rationale: κραταιός नगर की शक्ति और दुर्जेयता व्यक्त करता है; ‘शक्तिशाली’ अर्थ को अनावश्यक सैन्य विस्तार के बिना रखता है।
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: हमें जान से मार डालने की धमकी दे रहा था
  rationale: शाब्दिक ‘हमें मृत्यु की धमकी देता’ के स्थान पर आधुनिक हिन्दी का स्वाभाविक और समानार्थी प्रयोग।
- source_word: προσέφθημεν
  choice: पहले जा पहुँचे
  rationale: क्रिया में दूसरों से पहले पहुँचने या बढ़कर पहुँच जाने का भाव है; हिन्दी में इसे संक्षेप और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀπὸ ἀνατολῶν … ἀπὸ δυσμῶν
  choice: पूर्व दिशा से … पश्चिम दिशा से
  rationale: आक्रमण या पहुँचने की विपरीत दिशाओं को स्पष्ट रखते हुए मूल संरचना सुरक्षित की गई है।
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: हमने बंदी बनाए गए लोगों को छुड़ा लिया
  rationale: यूनानी अमूर्त पद ‘बंदी अवस्था/बंदी समूह’ के लिए प्रयुक्त है; प्रसंग में हिन्दी का व्यक्तिवाचक बहुवचन अधिक स्वाभाविक है और मुक्ति का आशय बनाए रखता है।
