  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। उपलब्ध यूनानी स्रोत को प्राथमिकता दी गई है; इसलिए अंग्रेज़ी परामर्श-पाठ के संक्षिप्त ‘हेब्रोन’ वाले रूप के बजाय अरेता, नगर की धमकी, चार भाइयों की दिशाएँ और बंदियों की मुक्ति—सभी विवरण सुरक्षित रखे गए हैं।
