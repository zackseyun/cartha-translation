  text: और उन पर भय छा गया, और उन्होंने हमारे विरुद्ध युद्ध करना बंद कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρόμος
  choice: आतंक
  rationale: यह शब्द भय से उत्पन्न तीव्र दहशत या कंपकंपी का भाव व्यक्त करता है; प्रसंग में स्वाभाविक और सशक्त हिन्दी के लिए ‘आतंक’ चुना गया।
- source_word: ἐπέπεσεν ἐπ᾽ αὐτούς
  choice: उन पर ... छा गया
  rationale: यूनानी मुहावरे ‘उन पर आ पड़ा’ का स्वाभाविक हिन्दी रूप, जिसमें भय के अचानक उन्हें वश में कर लेने का भाव सुरक्षित है।
- source_word: ἐπαύσαντο πολεμοῦντες ἡμᾶς
  choice: उन्होंने हमारे विरुद्ध युद्ध करना बंद कर दिया
  rationale: ἐπαύσαντο की समाप्ति और πολεμοῦντες के निरंतर युद्ध करने के भाव को स्पष्ट तथा सहज हिन्दी में रखा गया है।
