base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/001.yaml
  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: hi
  text: इसके बाद दक्षिण की ओर से हम पर एक युद्ध आ पड़ा, जो शकेम के युद्ध से भी बड़ा था। तब मैंने अपने भाइयों के साथ युद्ध के लिए पाँति बाँधी; हमने एक हज़ार पुरुषों का पीछा किया और उनमें से दो सौ को तथा चार राजाओं को मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ νότον
  choice: दक्षिण की ओर से
  rationale: युद्ध के दक्षिण दिशा से आने का स्वाभाविक हिन्दी संकेत; यूनानी पदबंध में दिशा का भाव है।
- source_word: τοῦ ἐν Σικίμοις
  choice: शकेम के युद्ध से
  rationale: तुलना के संदर्भ में निहित संज्ञा ‘युद्ध’ को हिन्दी में स्पष्ट किया गया; Σίκιμοις को प्रचलित बाइबिलीय नाम ‘शकेम’ से व्यक्त किया।
- source_word: παραταξάμενοι
  choice: युद्ध के लिए पाँति बाँधी
  rationale: क्रिया का सैन्य अर्थ युद्ध-विन्यास में खड़े होने या सेना सजाने का है; यह अभिव्यक्ति सामान्य पाठक के लिए स्पष्ट और स्रोत के निकट है।
- source_word: ἐδιώξαμεν
  choice: हमने ... पीछा किया
  rationale: मूल क्रिया के प्रत्यक्ष अर्थ ‘पीछा करना’ को बनाए रखा।
- source_word: ἀπεκτείναμεν
  choice: मार डाला
  rationale: हिंसक मृत्यु कराने के स्पष्ट अर्थ को बिना नरम किए स्वाभाविक हिन्दी में रखा।
- source_word: τέσσαρας βασιλεῖς
  choice: चार राजाओं को
  rationale: दो सौ मारे गए लोगों के अतिरिक्त चार राजाओं के मारे जाने की समन्वित संरचना सुरक्षित रखी।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सहज शैली रखी गई है। यूनानी पाठ की युद्ध-संबंधी स्पष्टता तथा संख्याएँ यथावत् हैं। ‘बड़ा’ अंग्रेज़ी परामर्श-पाठ और दिए गए यूनानी तुलनात्मक विन्यास के अनुसार रखा गया है, यद्यपि प्रस्तुत यूनानी पंक्ति में तुलनात्मक विशेषण प्रत्यक्ष रूप से अस्पष्ट/लुप्त प्रतीत होता है।
