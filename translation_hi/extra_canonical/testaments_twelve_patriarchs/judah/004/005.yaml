  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/005.yaml
  text: Then my father Jacob killed Belisath, king of all, father of kings, a giant man in strength, twelve cubits tall.
translation:
  language: hi
  text: मेरे पिता याकूब ने बेलिसाथ को मार डाला, जो सब राजाओं का राजा था—बल में महाकाय और बारह हाथ ऊँचा पुरुष।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλε
  choice: मार डाला
  rationale: क्रिया का सीधा अर्थ ‘मार डालना/वध करना’ है; यहाँ इसे सहज और स्पष्ट आधुनिक हिन्दी में रखा गया है।
- source_word: βασιλέα πάντων τῶν βασιλέων
  choice: सभी राजाओं का राजा
  rationale: प्राप्त यूनानी पाठ में शाब्दिक अर्थ ‘सभी राजाओं का राजा’ है। अंग्रेज़ी परामर्श-पाठ का ‘father of kings’ इस यूनानी वाक्यांश में उपस्थित नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἄνδρα γίγαντα τῇ ἰσχύι
  choice: बल में दैत्य के समान एक पुरुष
  rationale: असामान्य यूनानी अभिव्यक्ति में शारीरिक सामर्थ्य और दैत्याकारता दोनों का संकेत है; हिन्दी इसे स्वाभाविक बनाती है, पर केवल कद या केवल बल तक सीमित नहीं करती।
- source_word: πηχῶν δώδεκα
  choice: बारह हाथ
  rationale: πη̂χυς प्राचीन ‘क्यूबिट’ माप है, जिसे हिन्दी बाइबलीय परंपरा और सामान्य बोध के अनुसार ‘हाथ’ कहा गया है।
theological_decisions:
- issue: बेलिसाथ की उपाधि
  choice: सभी राजाओं का राजा
  alternative: सबका राजा, राजाओं का पिता
  rationale: मूल यूनानी में πατήρ (‘पिता’) केवल आरंभ में याकूब के लिए है; बेलिसाथ के लिए ‘राजाओं का पिता’ जोड़ना स्रोत से समर्थित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी में आरंभिक ‘तब’ नहीं है, इसलिए अंग्रेज़ी परामर्श-पाठ का ‘Then’ नहीं जोड़ा गया। डैश द्वारा उपाधि के बाद बेलिसाथ का वर्णन स्वाभाविक रूप से जोड़ा गया है।
