  text: 'And now I command you[a], my children: hear Judah your father, and keep my words, with thoughts set on doing all the righteous requirements of the Lord and obeying the commands of God.


    Because I boasted that in wars the face of a beautiful woman had not deceived me, and I reproached Reuben my brother concerning Bilhah, my father’s wife, the spirit of jealousy and of sexual immorality arrayed themselves against me, until I sinned with Anan the Canaanite woman and with Tamar my daughter-in-law.


    For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, in the name of his daughter, he showed me an immeasurable abundance of gold, for he was a king. And he adorned her with gold and pearls[d][c][b], and made her pour wine for us at the banquet.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 13**


    **1** अब, हे मेरे बच्चों, मैं तुम्हें आज्ञा देता हूँ: अपने पिता यहूदा की सुनो[a] और मेरी बातों का पालन करो, ताकि तुम प्रभु के सभी धर्मसंगत नियमों को पूरा करो और परमेश्वर की आज्ञाएँ मानो। **2** अपनी अभिलाषाओं के पीछे मत चलो, न अपने मन के घमंड में। अपने कामों और अपनी जवानी की शक्ति पर डींग मत मारो, क्योंकि यह भी प्रभु की दृष्टि में बुरा है।


    **3** क्योंकि मैंने भी डींग मारी थी कि युद्धों में किसी सुंदर स्त्री के मुख ने मुझे धोखा दिया था[b], और मैंने अपने भाई रूबेन को अपने पिता की पत्नी बिल्हा के विषय में धिक्कारा था। इसी कारण ईर्ष्या और यौन अनैतिकता की आत्मा ने मेरे विरुद्ध मोर्चा बाँध लिया, यहाँ तक कि मैंने उस कनानी स्त्री[c] और अपनी बहू तामार के साथ पाप किया।


    **4** क्योंकि मैंने अपने ससुर से कहा था, “मैं अपने पिता से सलाह करूँगा और तब तुम्हारी बेटी को ब्याह लूँगा।” पर वह राजी नहीं हुआ; इसके बजाय उसने मुझे अपनी बेटी को देने के संबंध में[d] सोने का अथाह भंडार दिखाया, क्योंकि वह राजा था। **5** उसने उसे सोने और मोतियों से सजाया और भोज के समय उसे स्त्रियों-जैसी सुंदरता में हमारे लिए दाखमधु परोसने को कहा।


    **6** दाखमधु ने मेरी आँखों को भ्रमित कर दिया और सुख-विलास ने मेरे मन को अंधकारमय कर दिया। **7** मैं उस पर मोहित हो गया और उसके साथ सहवास किया। इस प्रकार मैंने प्रभु की आज्ञा और अपने पिता की आज्ञा का उल्लंघन किया और उसे अपनी पत्नी बना लिया। **8** तब प्रभु ने मेरे मन की योजना के अनुसार मुझे प्रतिफल दिया, क्योंकि उसकी संतानों से मुझे आनंद नहीं मिला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में आरंभिक वाक्य व्याकरण की दृष्टि से कुछ असहज है; आशय बच्चों को अपने पिता यहूदा की सुनने और उसकी बातों का पालन करने की आज्ञा देना है।
    reason: textual_variant
  - marker: b
    text: प्राप्त यूनानी पाठ में ‘मुझे धोखा दिया था’ है, पर यह कथन प्रसंग में कठिन है। कुछ लोग यहाँ मूल आशय ‘मुझे धोखा नहीं दिया था’ समझते हैं।
    reason: textual_variant
  - marker: c
    text: यूनानी पाठ में यहाँ किसी व्यक्तिगत नाम के बजाय ‘उस कनानी स्त्री’ है। यह प्रसंग उत्पत्ति 38 में यहूदा के कनानी विवाह की परंपरा से संबंधित समझा जा सकता है।
    reason: cross_reference
  - marker: d
    text: ‘अपनी बेटी को देने के संबंध में’ एक कठिन यूनानी वाक्यांश का सावधान अनुवाद है। इसका आशय संभवतः प्रस्तावित विवाह के संबंध में धन दिखाना है, शायद बेटी के साथ दी जाने वाली संपत्ति के रूप में।
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: मेरी बातों का पालन करो
  rationale: यह आज्ञा शब्दों को सुरक्षित रखने और उनके अनुसार चलने—दोनों का भाव रखती है; आधुनिक हिन्दी में ‘पालन करो’ प्रसंगानुकूल और सहज है।
- source_word: δικαιώματα Κυρίου
  choice: प्रभु की सभी धार्मिक विधियाँ
  rationale: δικαιώματα को नैतिक-दैवी नियमों के रूप में व्यक्त करते हुए ἐντολαῖς (‘आज्ञाएँ’) से शब्दगत भेद बनाए रखा गया है।
- source_word: ἐπιθυμιῶν
  choice: अभिलाषाओं
  rationale: यह शब्द इच्छाओं या लालसाओं के लिए है; प्रसंग में नकारात्मक नैतिक अर्थ है, जिसे ‘अभिलाषाओं के पीछे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: καυχᾶσθε / ἐγκαυχησάμενος
  choice: डींग मत मारो / मैंने डींग मारी थी
  rationale: घमंड से आत्मप्रशंसा करने का भाव स्पष्ट रहता है और दोनों संबद्ध यूनानी रूपों का हिन्दी में सुसंगत अनुवाद होता है।
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: ईर्ष्या और यौन अनैतिकता की आत्मा
  rationale: ‘आत्मा’ को केवल मनोवृत्ति बनाकर सपाट नहीं किया गया; मूल की सजीव, विरोधी शक्ति वाली भाषा सुरक्षित रखी गई है। ζῆλος का प्रसंगानुकूल अर्थ ‘ईर्ष्या’ और πορνεία का व्यापक नैतिक अर्थ ‘यौन अनैतिकता’ है।
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: मेरे विरुद्ध मोर्चा बाँध लिया
  rationale: क्रिया के सैनिक रूपक को सहज आधुनिक हिन्दी में जीवंत रखा गया है।
- source_word: συνετέλεσα εἰς
  choice: के साथ पाप किया
  rationale: पाठ का वाक्यांश कठिन और परोक्ष है। स्वीकारोक्तिपरक नैतिक प्रसंग को स्पष्ट किया गया है, पर कृत्य का अनावश्यक विस्तार नहीं किया गया।
- source_word: εἰς δόσιν αὐτῆς
  choice: अपनी बेटी के साथ देने के लिए
  rationale: वाक्यांश को विवाह के संबंध में दिखाई गई संपत्ति के रूप में समझते हुए अनुवाद किया गया है, किंतु कठिनाई को पादटिप्पणी में खुला रखा गया है।
- source_word: διέστρεψέν μου τοὺς ὀφθαλμούς
  choice: मेरी आँखों को भ्रमित कर दिया
  rationale: शाब्दिक ‘आँखों को विकृत कर दिया’ हिन्दी में अस्वाभाविक है; यहाँ मदिरा से दृष्टि और विवेक बिगड़ने का भाव है।
- source_word: κατὰ τὸ διαβούλιον τῆς ψυχῆς μου
  choice: मेरे मन की योजना के अनुसार
  rationale: διαβούλιον विचार, मंशा या योजना का संकेत देता है। ‘मन की योजना’ मूल की आंतरिक नैतिक जवाबदेही को सुरक्षित रखता है।
theological_decisions:
- issue: दुर्गुणों का आत्मा के रूप में मानवीकरण
  choice: ‘ईर्ष्या और यौन अनैतिकता की आत्मा ने मेरे विरुद्ध मोर्चा बाँध लिया’
  alternative: ‘ईर्ष्या और कामवासना मुझ पर छा गई’
  rationale: मूल पाठ नैतिक संघर्ष को आत्मा और सैनिक आक्रमण की भाषा में प्रस्तुत करता है। इसे केवल मनोवैज्ञानिक अनुभूति में बदलना पाठ की धार्मिक और आलंकारिक बनावट को सपाट कर देता।
- issue: संदिग्ध पाठ में स्त्री द्वारा धोखा दिए जाने का कथन
  choice: प्राप्त यूनानी पाठ के सकारात्मक कथन ‘मुझे धोखा दिया था’ का अनुवाद, साथ में पाठगत टिप्पणी
  alternative: ‘मुझे धोखा नहीं दिया था’
  rationale: निषेध यूनानी मुख्य पाठ में नहीं है, यद्यपि प्रसंग और कुछ व्याख्याएँ उसकी अपेक्षा कर सकती हैं। अनुवाद ने उपलब्ध पाठ को बदले बिना कठिनाई स्पष्ट की है।
- issue: सहवास संबंधी परोक्ष स्वीकारोक्ति
  choice: ‘के साथ पाप किया’
  alternative: ‘के साथ संबंध बनाए’ या अत्यंत शाब्दिक अस्पष्ट अनुवाद
  rationale: यह अंश पश्चात्तापपूर्ण नैतिक स्वीकारोक्ति है। ‘पाप किया’ उस मूल्यांकन को स्पष्ट रखता है, जबकि कृत्य के स्वरूप को मूल से अधिक विशिष्ट नहीं बनाता।
- issue: दैवी प्रतिफल और संतानों में आनंद न मिलना
  choice: ‘प्रभु ने मेरे मन की योजना के अनुसार मुझे प्रतिफल दिया’
  alternative: इसे स्पष्ट रूप से किसी विशेष दंड या संतानों की मृत्यु के रूप में समझाना
  rationale: पाठ प्रतिफल का दावा करता है, पर उसके स्वरूप को केवल ‘संतानों से आनंद नहीं मिला’ कहकर छोड़ता है। अनुवाद ने इस धार्मिक तनाव को बिना अतिरिक्त ऐतिहासिक या सैद्धांतिक निष्कर्ष के सुरक्षित रखा है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। ‘हे मेरे बच्चो’, ‘दाखमधु’, ‘धार्मिक विधियाँ’ और ‘प्रतिफल’ वसीयतनामे की गंभीर शैली बनाए रखते हैं; वहीं ‘डींग मारना’, ‘मोर्चा बाँधना’ और ‘भ्रमित करना’ पाठ को अनावश्यक रूप से पुरातन या तकनीकी होने से बचाते हैं। पद-संख्याएँ जोड़ी गई हैं ताकि पूरा अध्याय 13 स्पष्ट रूप से पढ़ा और उद्धृत किया जा सके।
