- source_word: πορνεία
  choice: व्यभिचार
  rationale: यह शब्द व्यापक यौन अनैतिकता को सूचित करता है; यहाँ सहज और प्रतिष्ठित हिन्दी में ‘व्यभिचार’ चुना गया है।
- source_word: φιλαργυρία
