- issue: दो बुराइयों का व्याकरणिक कर्ता और व्यक्ति पर उनका प्रभाव
  choice: जहाँ आशय दोनों बुराइयों का है वहाँ बहुवचन ‘ये/उन्होंने’, और जहाँ प्रभावित मनुष्य का है वहाँ एकवचन ‘वह/उसकी’
  alternative: सभी क्रियाओं में एकवचन कर्ता
  rationale: यूनानी नपुंसकलिंग बहुवचन ταῦτα के साथ एकवचन क्रिया आ सकती है, पर अर्थतः व्यभिचार और धनलोभ दोनों अभिप्रेत हैं। आगे αὐτοῦ सामान्य पीड़ित मनुष्य को सूचित करता है। हिन्दी में अर्थगत सम्बन्ध स्पष्ट रखते हुए मूल तनाव सुरक्षित रखा गया है।
- issue: ईश्वर की आज्ञाकारिता
  choice: परमेश्वर की आज्ञा मान नहीं सकता
  alternative: परमेश्वर का आज्ञापालन नहीं कर सकता
  rationale: Θεῷ ὑπακοῦσαι का सीधा और सामान्य हिन्दी रूप चुना गया है; नैतिक असमर्थता का कथन जस का तस रखा गया है और उसके दार्शनिक स्वरूप की व्याख्या नहीं जोड़ी गई।
