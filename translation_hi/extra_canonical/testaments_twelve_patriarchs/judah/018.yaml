- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: उसकी आत्मा की समझ
  rationale: διαβούλιον में विचार-विमर्श, निर्णय-बुद्धि या अभिप्राय का भाव है; ‘समझ’ सामान्य पाठक के लिए स्वाभाविक है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: उसे घमण्ड करना सिखाती हैं
  rationale: यूनानी वाक्यांश का कार्यकारक भाव बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: στερίσκει
  choice: वंचित कर देती हैं
  rationale: क्रिया का अर्थ किसी वस्तु से महरूम करना है।
- source_word: καταδαπανᾷ τὰς σάρκας
  choice: उसके शरीर को क्षीण कर देती हैं
  rationale: शाब्दिक बिम्ब ‘मांस को पूरी तरह खपा देना’ है; ‘शरीर को क्षीण करना’ हिन्दी में उसका प्रभाव स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: λόγους εὐσεβείας
  choice: भक्ति की बातें
  rationale: εὐσέβεια में परमेश्वर के प्रति श्रद्धापूर्ण आचरण का भाव है; ‘भक्ति’ संक्षिप्त और सर्वसुलभ है।
- source_word: προσοχθίζει
  choice: चिढ़ता है
  rationale: क्रिया अप्रसन्नता, खीझ या विरोध दर्शाती है; ‘चिढ़ता है’ मूल की तीव्रता को बिना अतिव्याख्या के व्यक्त करता है।
- source_word: πάθεσιν
  choice: वासनाओं
  rationale: सन्दर्भ में यह व्यक्ति को दास बनानेवाली प्रबल प्रवृत्तियों—व्यभिचार और धनलोभ—को सूचित करता है।
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: वह दिन में भी ऐसे चलता है, मानो रात हो
  rationale: मूल का प्रकाश-अन्धकार बिम्ब पूर्णतः सुरक्षित रखा गया है; अंग्रेज़ी परामर्श-पाठ में छूटा यह उपवाक्य यूनानी स्रोत से पुनः सम्मिलित किया गया है।
