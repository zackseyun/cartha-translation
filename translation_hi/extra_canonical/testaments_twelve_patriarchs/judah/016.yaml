  text: '1[a]. Guard yourselves, therefore, my children, against the limit of wine; for in it there are four evil spirits: desire, heated passion, dissipation, and shameful gain[b].


    2. If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness enters.


    3. But if you want to live with self-control, do not touch wine at all, lest you sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.


    4. Wine also reveals the mysteries of God and of men, just as I too revealed the commandments of God and the mysteries of Jacob my father to the Canaanite woman—things that God told me not to reveal.


    5[c]. And wine becomes the cause of war and turmoil.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 16**


    **1.** इसलिए, मेरे बच्चों, दाखमधु की सीमा से सावधान रहो[a], क्योंकि उसमें चार दुष्ट आत्माएँ हैं[b]: लालसा, भड़कता हुआ आवेग, उच्छृंखलता और नीच लाभ की लालसा।


    **2.** यदि तुम आनंद से दाखमधु पियो, तो परमेश्वर का भय मानते हुए मर्यादित रहो।


    **3.** पर यदि तुम संयम से जीना चाहते हो, तो दाखमधु को बिलकुल हाथ न लगाओ, कहीं ऐसा न हो कि तुम उद्दंड वचनों, झगड़ों, झूठे आरोपों और परमेश्वर की आज्ञाओं के उल्लंघनों में पाप करो और अपने समय से पहले नाश हो जाओ।


    **4.** दाखमधु परमेश्वर और मनुष्यों के भेद भी प्रकट कर देता है। इसी प्रकार मैंने भी परमेश्वर की आज्ञाएँ और अपने पिता याकूब के भेद उस कनानी स्त्री को प्रकट किए—वे बातें जिन्हें परमेश्वर ने मुझसे प्रकट न करने को कहा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘दाखमधु की सीमा’। इसका अर्थ ‘दाखमधु की मात्रा’ या ‘दाखमधु की हद’ भी हो सकता है; संभवतः चेतावनी उसकी उचित सीमा न लाँघने की है।
    reason: lexical_alternative
  - marker: b
    text: ‘दुष्ट आत्माएँ’ से यहाँ व्यक्तिरूप में प्रस्तुत अवगुण अभिप्रेत हो सकते हैं, या वास्तविक आत्मिक शक्तियाँ भी; यूनानी पाठ दोनों के बीच का तनाव खुला रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: दाखमधु की सीमा का ध्यान रखो
  rationale: ὅρος का मूल अर्थ सीमा या हद है। हिन्दी वाक्यांश असामान्य रूपक को बनाए रखते हुए यह संकेत देता है कि दाखमधु की उचित सीमा नहीं लाँघनी चाहिए।
- source_word: πνεύματα πονηρά
  choice: दुष्ट आत्माएँ
  rationale: यूनानी पाठ स्पष्ट रूप से आत्माओं की भाषा इस्तेमाल करता है। इसे केवल मनोवैज्ञानिक प्रवृत्तियों में बदलने के बजाय मूल की नैतिक और संभवतः आत्मिक दोनों ध्वनियाँ सुरक्षित रखी गई हैं।
- source_word: ἐπιθυμίας
  choice: लालसा
  rationale: यह व्यापक इच्छा या तृष्णा का शब्द है; इसे केवल यौन वासना तक सीमित नहीं किया गया।
- source_word: πυρώσεως
  choice: भड़कता आवेग
  rationale: शब्द में जलने या भड़क उठने का बिंब है। यह अनुवाद उसी बिंब और मदिरा से उत्पन्न तीव्र उत्तेजना, दोनों को व्यक्त करता है।
- source_word: ἀσωτίας
  choice: उच्छृंखलता
  rationale: यह बेलगाम, अपव्ययी और असंयमित आचरण को सूचित करता है; आधुनिक हिन्दी में ‘उच्छृंखलता’ इसका संक्षिप्त और स्वाभाविक रूप है।
- source_word: αἰσχροκερδίας
  choice: लज्जाजनक लाभ-लालसा
  rationale: यौगिक शब्द में लज्जाजनक/नीच और लाभ, दोनों भाव हैं। ‘लाभ-लालसा’ लाभ पाने की दूषित प्रवृत्ति को स्पष्ट करती है।
- source_word: αἰδούμενος
  choice: मर्यादा में रहो
  rationale: यह लज्जाशील, संकोची या मर्यादित व्यवहार का भाव रखता है। प्रसंग में यह परमेश्वर के भय के अधीन नियंत्रित आचरण की चेतावनी है।
- source_word: σωφρόνως
  choice: संयम से
  rationale: शब्द विवेकपूर्ण, अनुशासित और आत्मसंयमी जीवन को व्यक्त करता है।
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: दाखमधु को बिलकुल हाथ न लगाओ
  rationale: मूल निषेध पूर्ण और जोरदार है; इसे केवल अति से बचने की सलाह बनाकर कमजोर नहीं किया गया।
- source_word: λόγοις ὕβρεως
  choice: उद्दंड वचनों
  rationale: ὕβρις में अहंकारी, अपमानकारी और सीमा लाँघने वाले व्यवहार का भाव है; ‘उद्दंड’ इस नैतिक तीव्रता को बनाए रखता है।
- source_word: συκοφαντίαις
  choice: झूठे आरोपों
  rationale: यह निंदा, मिथ्या अभियोग या दुर्भावनापूर्ण आरोप का अर्थ दे सकता है। यहाँ ‘झूठे आरोप’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: μυστήρια
  choice: भेद
  rationale: यह गुप्त या अप्रकट बातों के अर्थ में है। ‘भेद’ धार्मिक रहस्य और निजी गुप्त बात—दोनों संदर्भों में स्वाभाविक है।
theological_decisions:
- issue: चार अवगुणों के लिए आत्मिक या मनोवैज्ञानिक भाषा
  choice: ‘दुष्ट आत्माएँ’ का शाब्दिक रूप रखा गया।
  alternative: दुष्ट प्रवृत्तियाँ या बुरे आवेग
