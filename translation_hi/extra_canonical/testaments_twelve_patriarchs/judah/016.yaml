- issue: दाखमधु से पूर्ण परहेज की चेतावनी
  choice: ‘बिलकुल हाथ न लगाओ’
  alternative: अधिक दाखमधु न पियो या उसकी सीमा न लाँघो
  rationale: पद 3 में μηδ᾽ ὅλως और ἐφάπτεσθε मिलकर पूर्ण निषेध व्यक्त करते हैं। इसे पद 1 की सीमा-संबंधी चेतावनी के अनुरूप नरम नहीं किया गया।
- issue: परमेश्वर और मनुष्यों के μυστήρια
  choice: ‘भेद’
  alternative: रहस्य या गुप्त योजनाएँ
  rationale: ‘भेद’ पाठ को किसी विशिष्ट धर्मवैज्ञानिक रहस्य-प्रणाली से नहीं जोड़ता और परमेश्वर तथा मनुष्यों दोनों से संबंधित गुप्त बातों की व्यापकता बनाए रखता है।
