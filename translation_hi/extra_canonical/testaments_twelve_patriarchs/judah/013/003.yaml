base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/003.yaml
  text: and I reproached Reuben my brother concerning Bilhah, my father’s wife, and the spirit of jealousy and sexual immorality arrayed themselves against me, until I completed it with Anan the Canaanite woman and with Tamar my daughter-in-law.
translation:
  language: hi
  text: और मैंने अपने भाई रूबेन को बिल्हा, जो मेरे पिता की पत्नी थी, के विषय में उलाहना दिया; और ईर्ष्या और यौन-दुराचार की आत्मा मेरे विरुद्ध मोर्चा बाँधकर खड़ी हो गई, यहाँ तक कि मैंने कनानी स्त्री[a] और अपनी बहू तामार के साथ उसे पूरा किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ इस स्थान पर विकृत या संदिग्ध है; उपलब्ध पाठ का अर्थ ‘कनानी स्त्री’ है। कुछ पाठ-पुनर्निर्माण यहाँ किसी स्त्री का नाम मानते हैं।
    reason: क्रूक्स चिह्न तथा English POB के ‘Anan’ और प्रस्तुत यूनानी पाठ के अंतर को पारदर्शी बनाना आवश्यक है।
  - marker: b
    text: 'शाब्दिक रूप से: ‘मैंने उसे पूरा किया।’ संदर्भ यौन पाप की ओर संकेत करता है, पर यूनानी क्रिया स्वयं ‘मैंने पाप किया’ नहीं कहती।'
    reason: स्रोत की असामान्य और अर्थगत रूप से अस्पष्ट अभिव्यक्ति को बिना चुपचाप स्पष्ट किए सुरक्षित रखना।
lexical_decisions:
- source_word: ὠνείδιζον
  choice: धिक्कारा
  rationale: क्रिया का अर्थ उलाहना देने या निंदा करने का है; ‘धिक्कारा’ प्रसंग की नैतिक भर्त्सना को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: ईर्ष्या और व्यभिचार की आत्मा
  rationale: यूनानी के एकवचन πνεῦμα और दोनों संबंधवाचक संज्ञाओं को बनाए रखा गया है; ζῆλος यहाँ प्रतिद्वंद्वी ईर्ष्या और πορνεία यौन अनैतिकता/व्यभिचार का संकेत देता है।
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: मेरे विरुद्ध मोर्चा बाँध लिया
  rationale: मूल में युद्ध-संबंधी बिंब है—किसी के विरुद्ध स्वयं को युद्ध-पंक्ति में लगाना। हिन्दी मुहावरा उसी बिंब और विरोध को बनाए रखता है।
- source_word: συνετέλεσα
  choice: उसे पूरा कर दिया
  rationale: शाब्दिक अर्थ ‘पूरा किया/अंत तक पहुँचाया’ है। संदर्भगत पाप को स्पष्टतः जोड़ने के बजाय मूल की कठिन और कुछ अस्पष्ट अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: νύμφην
  choice: बहू
  rationale: तामार से यहूदा के पारिवारिक संबंध के संदर्भ में νύμφη का अपेक्षित अर्थ ‘बहू’ है।
theological_decisions:
- issue: ‘ईर्ष्या और व्यभिचार की आत्मा’ की प्रकृति
  choice: इसे व्यक्तिवाची आत्मिक शक्ति की भाषा में यथावत रखा गया
  alternative: इसे केवल ‘ईर्ष्या और व्यभिचार की प्रवृत्ति’ कहना
  rationale: πνεῦμα और युद्ध-संबंधी क्रिया पाठ में आत्मा को सक्रिय विरोधी के रूप में प्रस्तुत करते हैं; इसे मनोवैज्ञानिक प्रवृत्ति मात्र बना देना पाठ की धार्मिक-साहित्यिक तनाव को मिटा देता।
- issue: संदिग्ध कर्म के नैतिक स्वरूप की स्पष्टता
  choice: ‘उसे पूरा कर दिया’
  alternative: ‘मैंने पाप किया’
  rationale: संदर्भ नैतिक अपराध का संकेत देता है, पर συνετέλεσα स्वयं ‘पाप किया’ नहीं कहता। इसलिए व्याख्यात्मक नैतिक शब्द पाठ में नहीं जोड़ा गया।
- issue: स्त्री के नाम की पाठगत स्थिति
  choice: मुख्य पाठ में केवल ‘कनानी स्त्री’ और पाठांतर को पादटिप्पणी में रखा
  alternative: English POB के अनुसार ‘अनान नामक कनानी स्त्री’
  rationale: दिए गए यूनानी पाठ में †τὴν Χανανανίτην है और ‘अनान’ स्पष्ट रूप से उपस्थित नहीं है; अतः अप्रमाणित नाम मुख्य पाठ में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘मोर्चा बाँध लिया’ मूल के युद्ध-बिंब को स्वाभाविक हिन्दी में व्यक्त करता है। नामों के रूप ‘रूबेन’, ‘बिल्हा’ और ‘तामार’ सामान्य हिन्दी बाइबलीय प्रयोग के अनुरूप हैं।
