  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। ‘ससुर’ संबंधसूचक संबोधन के रूप में रखा गया है, जैसा मूल में है। प्रत्यक्ष कथन में ‘तुम्हारी’ प्रयुक्त हुआ है; अस्पष्ट स्वर्ण-वाक्यांश को मुख्य पाठ और पादटिप्पणी में सावधानी से प्रस्तुत किया गया है।
