  choice: मैं अपने पिता से सलाह करूँगा
  rationale: क्रिया और संबंधवाचक पद का सीधा तथा स्वाभाविक हिन्दी रूप; इसमें पिता की अनुमति लेने का अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: λήψομαι τὴν θυγατέρα σου
  choice: तुम्हारी बेटी से विवाह करूँगा
  rationale: शाब्दिक ‘तुम्हारी बेटी को लूँगा’ आधुनिक हिन्दी में अस्वाभाविक और भ्रामक होता; विवाह-संदर्भ में आशय स्पष्ट किया गया।
- source_word: οὐκ ἠθέλησεν
  choice: वह इसके लिए राज़ी नहीं हुआ
  rationale: ‘उसने नहीं चाहा’ की अपेक्षा प्रसंग में स्वाभाविक है, जबकि उसकी अनिच्छा का लक्ष्य ‘इसके लिए’ जानबूझकर कुछ खुला रखा गया है।
- source_word: χρυσίου πλῆθος ἄπειρον
  choice: बेहिसाब सोना
  rationale: असीम/अपरिमेय मात्रा के अतिशयोक्तिपूर्ण भाव को साधारण पाठक के लिए सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: Βασιλεὺς γὰρ ἦν
  choice: क्योंकि वह राजा था
  rationale: कारणसूचक γάρ और संक्षिप्त स्वतंत्र वाक्य की संरचना सुरक्षित रखी गई।
