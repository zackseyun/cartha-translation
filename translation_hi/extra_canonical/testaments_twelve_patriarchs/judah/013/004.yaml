base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/004.yaml
  text: For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, he showed me an immense amount of gold in the name of his daughter, for he was a king.
translation:
  language: hi
  text: क्योंकि मैंने अपने ससुर से कहा था, “मैं अपने पिता से सलाह करूँगा और तब तुम्हारी बेटी से विवाह करूँगा।” लेकिन वह इसके लिए राज़ी नहीं हुआ; बल्कि अपनी बेटी को विवाह में देने के संबंध में उसने मुझे असीम मात्रा में सोना दिखाया।[a] क्योंकि वह राजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपनी बेटी को विवाह में देने के संबंध में” यूनानी वाक्यांश εἰς δόσιν αὐτῆς को दर्शाता है। इसका संबंध उस समय बेटी को विवाह में देने से है, पर यह पूरी तरह स्पष्ट नहीं है कि सोना उसी अवसर पर दिया जाना था, विवाह की व्यवस्था का प्रस्ताव था, या उसका कोई अन्य संबंध था।
    reason: यूनानी वाक्यांश सोने और बेटी को विवाह में देने के बीच संबंध बताता है, लेकिन उस संबंध की सटीक प्रकृति स्पष्ट नहीं करता; इसलिए मुख्य पाठ और पादटिप्पणी किसी निश्चित दहेज या प्रलोभन-व्याख्या को नहीं थोपते।
lexical_decisions:
