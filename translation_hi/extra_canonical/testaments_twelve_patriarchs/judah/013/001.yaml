id: T12P.JUD.13.1
reference: Testament of Judah 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, ἀκούσατε *Ἰούδα¹ τοῦ πατρὸς ὑμῶν⁷² καὶ φυλάξασθε⁹ τοὺς λόγους μου¹⁰ τοῦ ποιεῖν⁷ πάντα¹¹ τὰ δικαιώματα Κυρίου¹³ καὶ ὑπακούειν¹⁴ ἐντολαῖς⁵ Θεοῦ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/001.yaml
  text: 'And now I command you, my children: listen to Judah, your father, and keep my words in your hearts, to do all the righteous commands of the Lord and to obey the commands of God.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ: अपने पिता यहूदा की सुनो और मेरी बातों को संभालकर रखो, ताकि तुम प्रभु की सभी विधियों का पालन करो और परमेश्वर की आज्ञाएँ मानो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: मैं तुम्हें आज्ञा देता हूँ
  rationale: यह वर्तमानकालीन प्रत्यक्ष आदेश है; हिन्दी में स्वाभाविक और स्रोत के निकट अभिव्यक्ति।
- source_word: ἀκούσατε Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: अपने पिता यहूदा की सुनो
  rationale: यहूदा का अपने विषय में तृतीय पुरुष में बोलना स्रोत की विशिष्टता है; उसे हटाया या सामान्यीकृत नहीं किया गया।
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: मेरी बातों को सँभालकर रखो
  rationale: φυλάσσω में सुरक्षित रखने और सावधानी से मानने, दोनों का भाव है। स्रोत में ‘हृदयों में’ के लिए कोई स्पष्ट शब्द नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: δικαιώματα Κυρίου
  choice: प्रभु की सभी विधियाँ
  rationale: δικαιώματα यहाँ स्थापित धार्मिक-नैतिक विधियों या विधान का बोध कराता है; ‘विधियाँ’ इसे केवल सामान्य आदेशों में सीमित नहीं करता।
- source_word: ὑπακούειν ἐντολαῖς Θεοῦ
  choice: परमेश्वर की आज्ञाएँ मानो
  rationale: ὑπακούω का आशय आज्ञाकारी होकर सुनना/मानना है; आधुनिक हिन्दी में ‘आज्ञाएँ मानना’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: Κυρίου और Θεοῦ के समानांतर उल्लेख
  choice: ‘प्रभु’ और ‘परमेश्वर’ दोनों पद अलग-अलग बनाए रखे
  alternative: दोनों को एक ही हिन्दी पद से अनूदित करना
  rationale: स्रोत की समानांतर शब्दावली और उसकी संभावित धार्मिक बारीकी को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया।
- issue: τοῦ ποιεῖν का संबंध
  choice: उद्देश्य/परिणाम के रूप में ‘ताकि तुम ... पालन करो’
  alternative: ‘पालन करने के लिए’ को केवल ‘मेरी बातों को सँभालकर रखो’ से जोड़ना
  rationale: यूनानी रचना में संबंध कुछ ढीला है; हिन्दी में आज्ञा के अपेक्षित उद्देश्य को स्पष्ट किया गया, पर कोई अतिरिक्त धार्मिक दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘बच्चो’ संबोधन का प्रचलित बहुवचन रूप है। अंग्रेज़ी परामर्श-पाठ में आया ‘अपने हृदयों में’ मूलतः दिए गए यूनानी पाठ में नहीं है, इसलिए हिन्दी में नहीं जोड़ा गया।
