translation:
  language: hi
  text: और उसने उसे सोने और मोतियों से सजाया, और भोज के समय उससे स्त्री-सुलभ सौंदर्य के साथ हमारे लिए दाखरस उँड़ेलवाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: सजाया
  rationale: क्रिया का सीधा अर्थ अलंकृत या सजाना है; सोने और मोतियों के संदर्भ में ‘सजाया’ स्वाभाविक और स्पष्ट है।
- source_word: οἰνοχοεῖν
  choice: दाखमधु परोसवाया
  rationale: इसका अर्थ प्यालों में दाखमधु उड़ेलना अथवा परोसना है। प्रयोजक रचना ἐποίησεν ... οἰνοχοεῖν को ‘उससे ... परोसवाया’ से व्यक्त किया गया है।
- source_word: ἐν τῷ δείπνῳ
  choice: भोज के समय
  rationale: δείπνον यहाँ सामूहिक भोजन या दावत को दर्शाता है; ‘भोज के समय’ आधुनिक हिन्दी में सहज है।
- source_word: ἐν κάλλει γυναικῶν
  choice: स्त्रियोचित सौंदर्य के साथ
  rationale: यूनानी पद का शाब्दिक भाव ‘स्त्रियों के सौंदर्य में’ है। ‘स्त्रियोचित सौंदर्य’ उस भाव को सुबोध हिन्दी में रखता है, बिना उसे केवल वस्त्र या श्रृंगार तक सीमित किए।
theological_decisions:
- issue: अंतिम पदबंध ἐν κάλλει γυναικῶν की उपस्थिति
  choice: इसे मुख्य पाठ में रखा गया है।
  alternative: अंग्रेज़ी परामर्श-पाठ की तरह इसे छोड़ देना।
  rationale: प्रदत्त यूनानी स्रोत में यह पदबंध स्पष्ट रूप से उपस्थित है; मूल-भाषा साक्ष्य को प्राथमिकता देते हुए इसका अनुवाद आवश्यक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘दाखमधु’ प्राचीन भोज के संदर्भ को स्पष्ट करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
