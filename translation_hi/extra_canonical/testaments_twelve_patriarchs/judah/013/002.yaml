  text: Because I boasted that in wars the face of a beautiful woman had not deceived me,
translation:
  language: hi
  text: क्योंकि मैंने भी यह घमंड किया था कि युद्धों में किसी सुंदर स्त्री का चेहरा मुझे बहका नहीं सका था,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त यूनानी पाठ में यहाँ शाब्दिक रूप से “मुझे बहका दिया था” है, पर यह पाठ संदिग्ध चिह्नित है; प्रसंग के आधार पर कुछ पाठ और अनुवाद “मुझे बहका नहीं सका था” समझते हैं।
    reason: मूल संस्करण में ἠπάτησέ με के चारों ओर पाठ-संदेह का संकेत है, जबकि वाक्य का आशय निषेध की अपेक्षा करता प्रतीत होता है।
lexical_decisions:
- source_word: ἐγκαυχησάμενος
  choice: यह घमंड किया था
  rationale: यह कृदन्त आत्मविश्वास से की गई डींग या घमंड को व्यक्त करता है; सहज आधुनिक हिन्दी में क्रियात्मक रूप रखा गया है।
- source_word: ἐν πολέμοις
  choice: युद्धों में
  rationale: बहुवचन को बनाए रखते हुए प्रसंग के युद्ध-अनुभव का सीधा अनुवाद किया गया है।
- source_word: πρόσωπον γυναικὸς εὐμόρφου
  choice: किसी सुंदर स्त्री का चेहरा
  rationale: πρόσωπον का ठोस अर्थ ‘चेहरा’ और εὐμόρφου का अर्थ ‘सुंदर’ रखा गया है; अनिश्चित भाव के लिए ‘किसी’ स्वाभाविक हिन्दी देता है।
- source_word: ἠπάτησέ με
  choice: मुझे बहका नहीं सका था
  rationale: ἀπατάω छल देने के साथ पथभ्रष्ट या बहका देने का भाव रखता है। स्त्री के चेहरे के प्रभाव वाले प्रसंग में ‘बहकाना’ स्वाभाविक है; पाठ में अपेक्षित निषेध की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: यूनानी पाठ में निषेध की पाठगत समस्या
  choice: मुख्य पाठ में ‘नहीं’ रखा गया
  alternative: ‘मुझे बहका दिया था’
  rationale: प्राप्त पंक्ति में ἠπάτησέ με सकारात्मक रूप में है, पर शब्द पर आलोचनात्मक चिह्न है और वाक्य का घमंड वाला तर्क अपेक्षित निषेध की ओर संकेत करता है; परामर्शी अंग्रेज़ी पाठ भी निषेध रखता है। अनिश्चितता को छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मूल का कारणसूचक तथा अगले कथन पर निर्भर अधूरा वाक्य बनाए रखने के लिए अंत में अल्पविराम रखा गया है।
