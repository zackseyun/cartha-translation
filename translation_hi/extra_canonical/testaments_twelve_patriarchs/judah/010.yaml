lexical_decisions:
- source_word: πονηρός / ἐν πονηρίᾳ / ἐπονηρεύσατο
  choice: दुष्ट / दुष्टता में / उसने यह दुष्टता की
  rationale: मूल में बार-बार आने वाले एक ही नैतिक शब्द-समूह को हिंदी में यथासंभव एकरूप रखता है और उसके प्रबल नैतिक आरोप को सुरक्षित रखता है।
- source_word: ἄγγελος Κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: यूनानी पद में निश्चित उपपद नहीं है; इसलिए इसे किसी विशिष्ट, पूर्वपरिचित ‘प्रभु के स्वर्गदूत’ के रूप में निश्चित नहीं किया गया।
- source_word: οὐκ ἔγνω αὐτήν
  choice: उससे वैवाहिक संबंध नहीं रखा
  rationale: हिंदी में केवल ‘उसे नहीं जाना’ इस प्रसंग में अस्पष्ट और अस्वाभाविक हो सकता है। मुख्य पाठ अर्थ स्पष्ट करता है, जबकि पाद-टिप्पणी मूल बाइबलीय शिष्टोक्ति को सुरक्षित रखती है।
- source_word: πανουργία
  choice: चालाकी
  rationale: माँ की सोची-समझी और छलपूर्ण योजना का भाव सहज आधुनिक हिंदी में व्यक्त होता है।
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: उससे संतान चाहता था
  rationale: वंश और प्रजनन से संबंधित मूल आशय को स्वाभाविक, संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: ἐπεγυμβρευσα αὐτῇ
  choice: देवर-विवाह के कर्तव्य के अनुसार ... सौंपा
  rationale: क्रिया में निहित मृत भाई की विधवा के प्रति पारिवारिक विवाह-कर्तव्य को स्पष्ट करता है, बिना सामान्य विवाह में बदल दिए।
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: विवाह के दिनों में
  rationale: ‘विवाह-कक्ष के दिनों में’ की ठोस छवि के आशय को आधुनिक हिंदी में सहज बनाता है और समयगत अस्पष्टता बनाए रखता है।
- source_word: συνῆλθε μὲν αὐτῇ
  choice: उसके साथ संबंध तो बनाया
  rationale: यौन मिलन का अर्थ स्पष्ट करता है और μέν...δέ की विरोधात्मक संरचना को ‘तो...पर’ से व्यक्त करता है।
- source_word: διέφθειρε τὸ σπέρμα ἐπὶ τὴν γῆν
  choice: अपना वीर्य भूमि पर नष्ट कर दिया
  rationale: मूल की स्पष्ट शारीरिक छवि और उत्पत्ति 38 से उसका संबंध बनाए रखता है; ‘बीज’ की अपेक्षा प्रसंग में ‘वीर्य’ अधिक स्पष्ट है।
- source_word: οὐκ ἀφῆκεν
  choice: ऐसा नहीं होने दिया
  rationale: माँ द्वारा यहूदा की योजना रोकने का अर्थ स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: कनान की बेटियों
  rationale: मूल की पारिवारिक-जातीय बाइबलीय अभिव्यक्ति को बनाए रखता है; अगले वाक्यांश में सहजता के लिए ‘कनानी’ कहा गया है।
theological_decisions:
- issue: एर की मृत्यु में कर्तृत्व
  choice: एर को ‘प्रभु के एक स्वर्गदूत’ द्वारा मारा गया बताया गया है।
  alternative: मृत्यु को सीधे प्रभु का कार्य बताना या ‘प्रभु के स्वर्गदूत’ को एक निश्चित विशिष्ट पात्र मानना।
  rationale: प्रस्तुत प्राथमिक यूनानी पाठ ἄγγελος Κυρίου कहता है; अनिश्चित हिंदी रूप स्रोत की व्याकरणिक सावधानी को बनाए रखता है।
- issue: ओनान की मृत्यु और परामर्श-पाठ में अतिरिक्त कथन
  choice: प्राथमिक यूनानी स्रोत के अनुसार केवल यह कहा गया है कि वह अपनी दुष्टता में मर गया।
  alternative: परामर्श के अंग्रेजी पाठ का कथन जोड़ना कि प्रभु ने ओनान को भी मार गिराया।
  rationale: दिए गए α-स्तंभ के यूनानी पाठ में वह अतिरिक्त कथन नहीं है। स्रोत-साक्ष्य को प्राथमिकता देते हुए उसे मुख्य पाठ में नहीं जोड़ा गया; इस प्रकार दैवी कर्तृत्व को मूल से अधिक निश्चित नहीं बनाया गया।
- issue: देवर-विवाह की शब्दावली
  choice: देवर-विवाह के कर्तव्य को मुख्य पाठ में स्पष्ट किया गया।
  alternative: केवल ‘विवाह में दिया’ कहना और प्रथा को निहित छोड़ना।
  rationale: यूनानी क्रिया सांस्कृतिक रूप से विशिष्ट पारिवारिक दायित्व व्यक्त करती है; स्पष्ट अनुवाद साधारण पाठक को प्रसंग समझने में सहायता देता है।
- issue: ‘जानना’ वाली यौन शिष्टोक्ति
  choice: मुख्य पाठ में अर्थ स्पष्ट कर ‘वैवाहिक संबंध’ कहा गया और शाब्दिक रूप पाद-टिप्पणी में दिया गया।
  alternative: मुख्य पाठ में शाब्दिक ‘उसे नहीं जाना’ रखना।
  rationale: आधुनिक हिंदी में शाब्दिक रूप गलत समझा जा सकता है; यह व्यवस्था अर्थ और मूल साहित्यिक रूप दोनों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘वैवाहिक संबंध’, ‘देवर-विवाह’ और ‘वीर्य’ जैसे शब्द प्रसंग को स्पष्ट रखते हैं, जबकि ‘प्रभु’, ‘स्वर्गदूत’, ‘भूमि’ और ‘कनान की बेटियाँ’ बाइबलीय गरिमा बनाए रखते हैं। प्राथमिक यूनानी पाठ को अंग्रेजी परामर्श-पाठ पर वरीयता दी गई है; इसलिए उसमें अनुपस्थित ओनान को देने और प्रभु द्वारा उसे मार गिराने वाला अतिरिक्त वाक्य मुख्य पाठ में सम्मिलित नहीं किया गया।
