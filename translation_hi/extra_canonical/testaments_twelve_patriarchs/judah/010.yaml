  text: After these things[a], Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram. But Er was wicked, and an angel of the Lord killed him. And I gave her to Onan, my second son, and behold, the Lord struck him down also. For he did not know her, through the scheming of his mother, because he did not want to have children by her. During the days of the bridal chamber I gave Onan to her in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year. And when I threatened him, he went in to her[b], but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because Tamar was not from the daughters of Canaan[d][c], as she herself was.
translation:
  language: hi
  text: '### यहूदा का वसीयतनामा 10


    **1** इन बातों के बाद मेरे पुत्र एर ने मेसोपोटामिया से अराम की बेटी तामार को अपनी पत्नी के रूप में ग्रहण किया।[a] **2** पर एर दुष्ट था, और प्रभु के एक स्वर्गदूत ने उसे मार डाला। **3** एर ने अपनी माँ की चालाकी के कारण तामार के साथ सहवास नहीं किया,[b] क्योंकि वह उससे संतान नहीं चाहता था। **4** विवाह के दिनों में मैंने ओनान को देवर-विवाह के कर्तव्य के अनुसार तामार को सौंपा;[c] फिर भी वह भी दुष्टता में उसके साथ सहवास नहीं करता था, यद्यपि वह एक वर्ष तक उसके साथ रहा। **5** जब मैंने उसे धमकाया, तब उसने तामार के साथ सहवास तो किया, पर अपनी माँ की आज्ञा के अनुसार अपना वीर्य भूमि पर नष्ट कर दिया। वह भी अपनी दुष्टता में मर गया। **6** मैं शेलह को भी तामार को देना चाहता था, पर उसकी माँ ने ऐसा नहीं होने दिया। उसने यह दुष्टता इसलिए की कि तामार कनान की बेटियों में से नहीं थी, जबकि वह स्वयं कनानी थी।[d]


    [a] कुछ यूनानी पाठ-साक्ष्यों में घटनाओं के क्रम और समय के छोटे-छोटे भेद हैं। इनमें यह भी शामिल है कि एर दूसरे दिन मरा या तीसरी रात, और ओनान को तामार के साथ तुरंत जोड़ा गया या विवाह की अवधि में।


    [b] यूनानी में शाब्दिक अभिव्यक्ति “उसे नहीं जाना” है। बाइबल की भाषा में “जानना” यौन संबंध के लिए प्रयुक्त एक शिष्टोक्ति हो सकती है।


    [c] देवर-विवाह में मृत पुरुष के भाई से यह अपेक्षा की जाती थी कि वह विधवा के द्वारा अपने मृत भाई के लिए वंश चलाए। तुलना करें: उत्पत्ति 38।


    [d] इस अध्याय में “दुष्ट” और “दुष्टता” की बार-बार आने वाली भाषा एर और ओनान के आचरण तथा उनकी माँ द्वारा विवाह रोकने को एक ही नैतिक क्रम में जोड़ती है।'
  philosophy: optimal-equivalence
