lexical_decisions:
- source_word: ὕδασι
  choice: जलस्रोतों
  rationale: बहुवचन किसी जल-स्थान, सोतों या जलधाराओं का संकेत देता है। ‘जलस्रोतों’ आधुनिक हिन्दी में स्वाभाविक है और केवल एक जलराशि का अर्थ थोपने से बचता है।
- source_word: Χωζηβά
  choice: खोज़ेबा
  rationale: यूनानी रूप का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है; अनिश्चित भौगोलिक पहचान को अनुवाद द्वारा तय नहीं किया गया।
- source_word: ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: हमसे युद्ध करने आए
  rationale: विरोधी दिशा और युद्ध के उद्देश्य, दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: συνάψαντες ἐτρέψαμεν
  choice: हमने उनसे युद्ध किया और उन्हें खदेड़ दिया
  rationale: पहला पद युद्ध में भिड़ने और दूसरा युद्ध में शत्रु को पलटाकर भगाने का अर्थ देता है।
- source_word: συμμάχους
  choice: सहयोगी
  rationale: यह सैन्य गठबन्धन का बोध कराता है और साधारण पाठक के लिए स्पष्ट है।
- source_word: διέξοδον
  choice: बच निकलने का कोई रास्ता
  rationale: मूल संज्ञा निकास या बाहर निकलने के मार्ग को सूचित करती है; युद्ध-प्रसंग में यह स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: प्रबल तलवार लेकर
  rationale: κραταιᾷ की शक्ति-सूचक भाषा और μαχαίρᾳ के हथियार-संदर्भ को रखा गया है, जबकि असामान्य वाक्य-संरचना को पादटिप्पणी में बताया गया है।
- source_word: ἐξωλοθρεύσαμεν
  choice: पूरी तरह विनाश कर दिया
  rationale: क्रिया सामान्य मारने से अधिक सम्पूर्ण नाश का बोध कराती है।
theological_decisions:
- issue: असामान्य προσδίδωσι और पद 3 की युद्ध-क्रिया
  choice: ‘हम ... उन पर टूट पड़े’ के रूप में प्रकट सामरिक आशय दिया गया और पाठगत कठिनाई पादटिप्पणी में रखी गई।
  alternative: क्रिया का शब्दशः पर व्याकरणहीन अनुवाद करना, या बिना सूचना दिए यूनानी पाठ में संशोधन मान लेना।
  rationale: इससे पाठ पठनीय रहता है, पर स्रोत की वास्तविक अनिश्चितता छिपाई नहीं जाती।
- issue: पद 5 में शिमोन से सम्बद्ध विकृत यूनानी वाक्यांश
  choice: प्रसंगानुसार ‘शिमोन और मैं ... छिप गए’ अनुवादित किया गया और अनिश्चितता स्पष्ट की गई।
  alternative: ‘शिमोन और दूसरे लोगों को छिपाकर’ अथवा विकृत शब्दक्रम का यांत्रिक अनुवाद।
  rationale: उपलब्ध यूनानी में एकवचन कृदन्त और शिमोन-संबंधी पद का मेल अस्पष्ट है। प्रथम पुरुष कथावाचक और तत्पश्चात बहुवचन क्रियाओं के आधार पर चुना पाठ सम्भाव्य है, निर्णायक नहीं।
- issue: प्रदत्त यूनानी साक्षी की सीमा
  choice: केवल दिए गए पाँच पदों का अनुवाद किया गया।
  alternative: अन्य संस्करणों से अतिरिक्त सामग्री जोड़कर अध्याय को पूरा करना।
  rationale: मूल-भाषा साक्ष्य की प्राथमिकता और संपादकीय पारदर्शिता बनाए रखने के लिए अप्रदत्त सामग्री नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। युद्ध-वर्णन को प्रत्यक्ष रखा गया है, पर अनावश्यक पुरातन या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। स्थान-नाम यूनानी रूपों के निकट देवनागरी में लिप्यंतरित हैं और पाठगत विकृतियाँ मुख्य पाठ में अनुमानपूर्वक छिपाने के बजाय पादटिप्पणियों में स्पष्ट की गई हैं।
