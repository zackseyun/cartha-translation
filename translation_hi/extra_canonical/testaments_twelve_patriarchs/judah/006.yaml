  text: 1. And when I was at the waters of Chozeba[a], those from Jobel came against us for battle. 2. And joining battle, we put them to flight; and we killed those from Shilom, their allies, and gave them no way of escape. 3. But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[b], we prevailed over them and killed them before they could scale the ascent. 4. And as we came to the city, their women were rolling stones down on us from the summit of the mountain on which the city stood[c]. 5. And having hidden Simeon and the others behind them, we seized the height, and utterly destroyed this city also.
translation:
  language: hi
  text: '1. जब मैं खोज़ेबा के जलस्रोतों[a] के पास था, तब योबेल के लोग हमसे युद्ध करने आए। 2. हमने उनसे युद्ध किया और उन्हें खदेड़ दिया। उनके सहयोगी शिलोम के लोगों को हमने मार डाला और उन्हें बच निकलने का कोई रास्ता नहीं दिया। 3. पर पाँचवें दिन माखीर के लोगों ने फिर हम पर आक्रमण किया। हम प्रबल तलवार लेकर उन पर टूट पड़े[b], उन पर विजय पाई और उनके चढ़ाई चढ़ पाने से पहले ही उन्हें मार डाला। 4. जब हम उस नगर के पास पहुँचे[c], तब उनकी स्त्रियाँ उस पर्वत की चोटी से, जिस पर नगर बसा था, हम पर पत्थर लुढ़का रही थीं। 5. तब शिमोन और मैं उनके पीछे छिप गए[d]; हमने ऊँचाई पर अधिकार कर लिया और इस नगर का भी पूरी तरह विनाश कर दिया।


    [a] ‘खोज़ेबा’, ‘योबेल’ और ‘शिलोम’ इस यूनानी साक्षी में आए नामों के लिप्यंतरण हैं; इन स्थानों की पहचान अनिश्चित है।

    [b] इस वाक्य की यूनानी क्रिया का व्याकरण कथावृत्त के शेष भाग से मेल नहीं खाता और सम्भवतः लेखक-प्रतिलिपिकार की संक्षिप्त या बिगड़ी हुई अभिव्यक्ति है। अनुवाद बिना मूल पाठ बदले उसके प्रकट युद्ध-संबंधी आशय को व्यक्त करता है।

    [c] यूनानी पाठ में यहाँ निश्चयवाचक उपपद दो बार आया है; यह प्रतिलिपि की स्पष्ट भूल जान पड़ती है। अनुवाद में उसे एक ही बार माना गया है।

    [d] यहाँ यूनानी पाठ व्याकरण की दृष्टि से विकृत और अस्पष्ट है। प्रसंग के आधार पर इसे ‘शिमोन और मैं ... छिप गए’ समझा गया है; दूसरे पाठ-साक्ष्यों में शब्द-विन्यास अलग हो सकता है।'
  philosophy: optimal-equivalence
