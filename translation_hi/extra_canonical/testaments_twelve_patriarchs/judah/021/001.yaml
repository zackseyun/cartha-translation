id: T12P.JUD.21.1
reference: Testament of Judah 21:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXI. Καὶ νῦν, τέκνα μου¹, παραγγέλλω ὑμῖν, ἀγαπᾶτε² τὸν Λευὶ³, ἵνα διαμείνητε⁴, καὶ⁵ μὴ ἐπαίρεσθε⁷ ἐπ᾽ αὐτὸν⁸, ἵνα μὴ ἐξολοθρευθῆτε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/001.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves against him, lest you be utterly destroyed.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ: लेवी से प्रेम करो, ताकि तुम बने रहो; और उसके विरुद्ध अपने आपको ऊँचा न उठाओ, कहीं ऐसा न हो कि तुम पूरी तरह नष्ट कर दिए जाओ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संबोधन के रूप में स्वाभाविक आधुनिक हिन्दी; τέκνα के पारिवारिक और उपदेशात्मक भाव को बनाए रखता है।
- source_word: παραγγέλλω ὑμῖν
  choice: मैं तुम्हें आज्ञा देता हूँ
  rationale: क्रिया के स्पष्ट आदेशात्मक बल को सीधे व्यक्त करता है।
- source_word: ἀγαπᾶτε τὸν Λευὶ
  choice: लेवी से प्रेम करो
  rationale: ἀγαπᾶτε का सीधा आदेश सुरक्षित रखते हुए हिन्दी की स्वाभाविक विभक्ति का प्रयोग किया गया है।
- source_word: ἵνα διαμείνητε
  choice: ताकि तुम बने रहो
  rationale: διαμένω के टिके रहने, कायम रहने या बने रहने के अर्थ को जानबूझकर व्यापक रखा गया है; पाठ यह नहीं बताता कि किस दशा या स्थान में बने रहना है।
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν
  choice: उसके विरुद्ध अपने आपको ऊँचा न उठाओ
  rationale: ἐπαίρεσθε की आत्म-उन्नयन की छवि और ἐπ᾽ αὐτόν के विरोधात्मक संबंध, दोनों को सुरक्षित रखता है।
- source_word: ἵνα μὴ ἐξολοθρευθῆτε
  choice: कहीं ऐसा न हो कि तुम पूरी तरह नष्ट कर दिए जाओ
  rationale: निषेधात्मक परिणाम/आशंका और यूनानी कर्मवाच्य के साथ पूर्ण विनाश की तीव्रता को बनाए रखता है।
theological_decisions:
- issue: लेवी से प्रेम करने के परिणाम का स्वरूप
  choice: “ताकि तुम बने रहो” कहकर संबंध को खुला रखा गया है।
  alternative: इसे किसी विशिष्ट धार्मिक पद, वाचा या उद्धार-सिद्धांत से जोड़ना।
  rationale: मूल पद διαμείνητε के आशय या संदर्भ को अधिक स्पष्ट नहीं करता; अतः अनुवाद ने कोई संप्रदायगत व्याख्या नहीं जोड़ी।
- issue: विनाश कराने वाले कर्ता की पहचान
  choice: कर्मवाच्य “नष्ट कर दिए जाओ” रखा गया है।
  alternative: “परमेश्वर तुम्हें नष्ट कर दे” या “तुम नष्ट हो जाओ।”
  rationale: ग्रीक में कर्ता अनुल्लिखित है; उसे परमेश्वर मानकर स्पष्ट करना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की आदेशात्मक गंभीरता तथा कारण-परिणाम की दोनों ἵνα संरचनाएँ स्पष्ट हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
