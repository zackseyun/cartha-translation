id: T12P.JUD.21.2
reference: Testament of Judah 21:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ἐμοὶ γὰρ¹⁰ ἔδωκεν¹¹ ὁ Θεὸς¹² τὴν βασιλείαν, κἀκείνῳ¹² τὴν ἱερατείαν¹³, καὶ¹⁴ ὑπέταξε¹⁴ τὴν βασιλείαν τῇ ἱερωσύνῃ¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/002.yaml
  text: For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने मुझे राजसत्ता दी और उसे याजकपद, और उसने राजसत्ता को याजकपद के अधीन कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλείαν
  choice: राजसत्ता
  rationale: यहाँ अमूर्त सत्ता/शासनाधिकार अभिप्रेत है; ‘राज्य’ से भूभाग या प्रजा का अर्थ निकल सकता है।
- source_word: ἱερατείαν / ἱερωσύνῃ
  choice: याजकपद
  rationale: दोनों निकटार्थी यूनानी संज्ञाएँ यहाँ याजकीय पद और अधिकार को सूचित करती हैं; एकरूप हिंदी पद वाक्य का समानांतर और संबंध स्पष्ट रखता है।
- source_word: ὑπέταξε
  choice: अधीन कर दिया
  rationale: क्रिया में अधिकार-क्रम के अंतर्गत रखने का स्पष्ट भाव है, जिसे यह स्वाभाविक हिंदी अभिव्यक्ति सुरक्षित रखती है।
- source_word: κἀκείνῳ
  choice: और उसे
  rationale: मूल का पुरुषवाचक संकेत बिना किसी ऐसे नाम या पहचान को जोड़े रखा गया है जो इस पद में स्वयं नहीं दी गई।
theological_decisions:
- issue: राजसत्ता और याजकपद के बीच अधिकार-संबंध
  choice: राजसत्ता को याजकपद के अधीन कर दिया
  alternative: राज्य को पुरोहिताई के अधीन किया
  rationale: मूल वाक्य स्पष्ट रूप से राजकीय अधिकार को याजकीय पद के अधीन रखता है; अनुवाद इस तनाव को न कम करता है, न उससे कोई अतिरिक्त सांप्रदायिक शासन-सिद्धांत निकालता है।
- issue: ἔδωκεν और ὑπέταξε का कर्ता
  choice: दोनों के लिए परमेश्वर को कर्ता बनाए रखा
  alternative: दूसरी क्रिया का कर्ता अस्पष्ट छोड़ना
  rationale: यूनानी वाक्य में स्पष्ट नया कर्ता नहीं आता, इसलिए आरंभ का ‘परमेश्वर’ स्वाभाविक रूप से दोनों क्रियाओं का कर्ता है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और स्रोत की त्रिखंडी समानांतर रचना के निकट। ‘याजकपद’ बाइबिलीय संदर्भ में सटीक है, जबकि ‘राजसत्ता’ अमूर्त βασιλεία को ‘राज्य’ की भौगोलिक अस्पष्टता से बचाती है।
