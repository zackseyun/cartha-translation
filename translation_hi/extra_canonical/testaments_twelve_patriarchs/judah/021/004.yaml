  text: For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.
translation:
  language: hi
  text: क्योंकि इस प्रकार परमेश्वर का याजकपद पार्थिव राज्य से श्रेष्ठ है—जब तक कि वह पापों के कारण प्रभु से विमुख होकर पतित न हो जाए और पार्थिव राज्य के अधीन न कर दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: परमेश्वर का याजकपद
  rationale: ἱερατεία यहाँ याजकीय पद अथवा संस्था को सूचित करता है; ‘याजकपद’ इसे संक्षिप्त और औपचारिक रूप में व्यक्त करता है।
- source_word: ὑπερέχει
  choice: से श्रेष्ठ है
  rationale: क्रिया का अर्थ किसी से ऊपर होना या बढ़कर होना है; तुलना के संदर्भ में ‘श्रेष्ठ है’ स्वाभाविक है।
- source_word: τῆς ἐπιγείου βασιλείας
  choice: पृथ्वी के राज्य से
  rationale: ἐπίγειος का सीधा अर्थ ‘पृथ्वी का/पार्थिव’ और βασιλεία का अर्थ यहाँ राजसत्ता या राज्य है; ‘पृथ्वी का राज्य’ मूल की पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου
  choice: पापों के कारण प्रभु से दूर होकर पतित न हो जाए
  rationale: ἐκπίπτω और ἀπό में प्रभु से गिरकर अलग हो जाने का भाव है; ‘दूर होकर पतित’ दोनों पहलुओं को बिना किसी विशेष doctrinal व्याख्या के रखता है।
- source_word: κυριευθῇ
  choice: के अधीन न कर दिया जाए
  rationale: निष्क्रिय रूप किसी के प्रभुत्व में लाए जाने को दर्शाता है; ‘अधीन कर दिया जाए’ स्वाभाविक हिन्दी में उस निष्क्रिय अर्थ को बनाए रखता है।
theological_decisions:
- issue: याजकपद की श्रेष्ठता पर शर्त
  choice: ‘जब तक कि’ के द्वारा शर्त को स्पष्ट रखा गया
  alternative: ‘यदि ... न हो’
  rationale: ἐὰν μή अपवाद अथवा नकारात्मक शर्त प्रस्तुत करता है। हिन्दी में ‘जब तक कि ... न’ प्रवाहपूर्ण है और यह तनाव बनाए रखता है कि पाप के कारण याजकपद अपनी श्रेष्ठ स्थिति से गिर सकता है।
- issue: ἐκπέσῃ का कर्ता
  choice: कर्त्ता को ‘वह’ रखकर निकटतम संज्ञा ‘याजकपद’ की ओर संकेत
  alternative: याजक अथवा याजकवर्ग को स्पष्ट रूप से कर्ता बनाना
  rationale: यूनानी में कर्ता व्याकरणतः ἡ ἱερατεία है। किसी निहित मानवीय समूह को जोड़ना मूल की रूपकात्मक और सामूहिक अभिव्यक्ति को अनावश्यक रूप से हल कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी। वाक्य की तुलना, शर्त और निष्क्रिय क्रिया को सुरक्षित रखा गया है; मूल में ‘पृथ्वी के राज्य’ की पुनरावृत्ति को शैलीगत संक्षेप के बजाय जानबूझकर बनाए रखा गया है।
