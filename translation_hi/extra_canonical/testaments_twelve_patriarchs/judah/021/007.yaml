id: T12P.JUD.21.7
reference: Testament of Judah 21:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ὅτι οἱ βασιλεύσουσιν⁵⁰ ὡς κήτη ἔσονται, *καταπίνοντες ἀνθρώπους⁵¹ ὡς ἰχθύας· υἱοὺς καὶ θυγατέρας ἐλευθέρους⁵² καταδουλώσουσιν⁵³, *οἴκους, ἀγρούς⁵⁴, ποίμνια, χρήματα ἁρπάσουσιν⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/007.yaml
  text: For the kings will be like sea monsters, swallowing people like fish; they will make sons and daughters of free people servants, and they will seize houses, fields, flocks, and wealth.
translation:
  language: hi
  text: क्योंकि जो राज्य करेंगे, वे समुद्री दैत्यों के समान होंगे, मनुष्यों को मछलियों की तरह निगलते हुए; वे स्वतंत्र बेटों-बेटियों को दास बना देंगे और घर, खेत, झुंड और धन लूट लेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ βασιλεύσουσιν
  choice: राजा
  rationale: पाठ में substantival future participle है, जिसका आशय ‘जो राज्य करेंगे/शासक’ है; प्रसंगानुकूल और स्वाभाविक हिन्दी में ‘राजा’ चुना गया।
- source_word: κήτη
  choice: समुद्री दैत्य
  rationale: κήτη बड़े और भयावह समुद्री जीवों के लिए प्रयुक्त होता है; ‘समुद्री दैत्य’ उपमा की विकरालता बनाए रखता है, बिना किसी विशिष्ट प्राणी की पहचान थोपे।
- source_word: ἀνθρώπους
  choice: मनुष्यों
  rationale: यह सामान्य रूप से मानवों को सूचित करता है; ‘मनुष्यों’ स्रोत की व्यापकता बनाए रखता है।
- source_word: καταδουλώσουσιν
  choice: दास बना लेंगे
  rationale: क्रिया का स्पष्ट अर्थ अधीन करके दास बनाना है; यह हिन्दी में स्वाभाविक और स्रोत के बल के अनुरूप है।
- source_word: ἐλευθέρους
  choice: स्वतंत्र लोगों के
  rationale: रूप α-column में accusative masculine plural है और ‘बेटे-बेटियों’ के साथ सीधा व्याकरणिक सामंजस्य अस्पष्ट है; अंग्रेज़ी परामर्श-पाठ के समान इसे स्वतंत्र लोगों के बेटे-बेटियों के रूप में समझना सम्भव और स्वाभाविक है।
- source_word: ποιμνια
  choice: भेड़-बकरियों के झुंड
  rationale: ποίμνια पशुधन के झुंड, विशेषतः छोटे पालतू पशुओं के समूह, को दर्शाता है; साधारण हिन्दी में यह अधिक स्पष्ट है।
- source_word: χρήματα
  choice: धन
  rationale: यह संपत्ति/धन-संपदा के व्यापक अर्थ में है; सूची के अंत में ‘धन’ संक्षिप्त और स्वाभाविक है।
- source_word: ἁρπάσουσιν
  choice: लूट लेंगे
  rationale: क्रिया बलपूर्वक छीनने या हथियाने को दर्शाती है; ‘लूट लेंगे’ अत्याचारी राजाओं के प्रसंग में उसका बल बनाए रखता है।
theological_decisions:
- issue: ‘स्वतंत्र’ विशेषण का संबंध
  choice: ‘स्वतंत्र लोगों के बेटे-बेटियों’
  alternative: ‘स्वतंत्र बेटे-बेटियों’
  rationale: उपलब्ध यूनानी रूप ἐλευθέρους पुल्लिंग बहुवचन है, जबकि ‘बेटे और बेटियाँ’ मिश्रित पदबंध के साथ इसका संबंध कुछ तनावपूर्ण है। अनुवाद अर्थपूर्ण पाठ देता है, पर इसे कोई विशिष्ट सामाजिक-धार्मिक सिद्धांत नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सरल। हिंसक बिंब और समानांतर क्रियाएँ स्पष्ट रखी गई हैं; अनावश्यक धर्म-सांप्रदायिक शब्दावली नहीं जोड़ी गई।
