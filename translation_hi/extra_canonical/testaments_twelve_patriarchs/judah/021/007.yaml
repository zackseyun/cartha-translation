- from: क्योंकि राजा समुद्री दैत्यों के समान होंगे; वे मनुष्यों को मछलियों की तरह निगल जाएँगे। वे स्वतंत्र लोगों के बेटे-बेटियों को दास बना लेंगे और घर, खेत, भेड़-बकरियों के झुंड और धन लूट लेंगे।
  to: क्योंकि जो राज्य करेंगे, वे समुद्री दैत्यों के समान होंगे, मनुष्यों को मछलियों की तरह निगलते हुए; वे स्वतंत्र बेटों-बेटियों को दास बना देंगे और घर, खेत, झुंड और धन लूट लेंगे।
  rationale: The revision follows the supplied Greek more closely by rendering the future substantival expression as “जो राज्य करेंगे” and by attaching “स्वतंत्र” directly to “बेटों-बेटियों.” It also preserves the participial force of καταπίνοντες (“निगलते हुए”) and avoids narrowing “flocks” to particular animals. No footnote is needed because the supplied base text permits a straightforward rendering and no textual alternative is provided.
