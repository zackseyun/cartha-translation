review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the predatory sea-creature comparison, the swallowing of people, enslavement, and seizure of property. However, οἱ βασιλεύσουσιν is more precisely “those who will rule/reign” than simply “kings,” and ἐλευθέρους directly qualifies the coordinated “sons and daughters” in the supplied Greek, not an unstated group of free parents.
  naturalness: The Hindi is generally clear and modern. “स्वतंत्र बेटों-बेटियों” is more direct and natural for the Greek syntax than “स्वतंत्र लोगों के बेटे-बेटियों.” Retaining “झुंड” rather than specifying sheep and goats avoids adding a narrower referent than ποίμνια requires.
  terminology: “समुद्री दैत्य,” “दास बना देंगे,” and “धन” are suitable and retain the force and scope of κήτη, καταδουλώσουσιν, and χρήματα. “जो राज्य करेंगे” represents the substantival future verb without unnecessarily turning it into a fixed royal title.
  issues:
  - severity: medium
    issue: The relationship of ἐλευθέρους is rendered as “स्वतंत्र लोगों के,” introducing parents/people not expressed in the Greek.
    rationale: In the supplied text, ἐλευθέρους is accusative masculine plural and can modify the mixed coordinated expression υἱοὺς καὶ θυγατέρας. The Hindi should therefore say that the sons and daughters themselves are free.
  - severity: low
    issue: “राजा” does not explicitly reflect the future verbal force of οἱ βασιλεύσουσιν.
    rationale: “जो राज्य करेंगे” preserves both the substantival use and the future sense.
  - severity: low
    issue: “भेड़-बकरियों के झुंड” narrows ποίμνια.
    rationale: ποίμνια denotes flocks; “झुंड” retains the generic scope without adding animal types.
  revised_text: क्योंकि जो राज्य करेंगे, वे समुद्री दैत्यों के समान होंगे, मनुष्यों को मछलियों की तरह निगलते हुए; वे स्वतंत्र बेटों-बेटियों को दास बना देंगे और घर, खेत, झुंड और धन लूट लेंगे।
