review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the supplied α-column in retaining only ‘ravens’ (κόρακας), rather than importing ‘ibises’ from the English audit trail. However, it does not clearly retain ἐπὶ κακῷ with πλεονεξίᾳ (‘evil greed’ / greed directed toward evil), and its first sentence supplies ‘fill’ without making the underlying elliptical construction sufficiently transparent in the main phrasing.
  naturalness: The register is generally modern and dignified. ‘बहुतों के मांस से कौओं को भर देंगे’ is understandable but somewhat stiff; ‘बहुतों का मांस कौओं को खिला देंगे’ is more idiomatic while preserving the supplied sense. The revised wording also avoids attaching ‘बुराई’ to the wrong clause.
  terminology: ‘लोभ,’ ‘घमंड,’ and ‘कौए’ are suitable modern-standard Hindi choices. ‘बुरी लोभ-लालसा’ renders the morally qualified πλεονεξίᾳ without adding doctrinal interpretation. The final passive/ambiguous elevation is retained with ‘ऊँचे उठाए जाएँगे.’
  issues:
  - severity: medium
    issue: The qualifier ἐπὶ κακῷ is not represented clearly.
    rationale: In the draft, ‘बुराई की ओर’ modifies ‘बढ़ेंगे,’ whereas the Greek places ἐπὶ κακῷ beside πλεονεξίᾳ and the participle ὑψούμενοι. A translation should preserve the association with evil greed as far as Hindi permits.
  - severity: low
    issue: The first clause is awkwardly phrased and its ellipsis needs a more precise note.
    rationale: The supplied Greek excerpt has no overt finite verb governing ‘ravens’ and ‘flesh.’ Hindi must supply a verb, but the note should state that the feeding sense is supplied from the elliptical syntax, not that a specific Greek verb meaning ‘fill’ is present.
  - severity: low
    issue: The final verbal form should preserve passive ambiguity.
    rationale: ὑψοῦνται is formally passive. ‘ऊँचे उठ जाएँगे’ can be read intransitively; ‘ऊँचे उठाए जाएँगे’ better preserves the form while leaving the agent unstated.
  revised_text: और वे अन्याय से बहुतों का मांस कौओं को खिला देंगे[a]। बुरी लोभ-लालसा में फूलकर वे बुराइयों और ऐसे घमंड में आगे बढ़ते जाएँगे, यहाँ तक कि वे ऊँचे उठाए जाएँगे।
