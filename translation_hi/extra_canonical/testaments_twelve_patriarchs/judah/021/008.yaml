source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ πολλῶν σάρκας ἀδίκως⁵⁵ κόρακας⁵⁵ ἐπὶ κακῷ⁶⁰ τῇ πλεονεξίᾳ ὑψούμενοι· καὶ προκόψουσιν ἐπὶ κακὰ καὶ ὑπερηφανίᾳ τοιούτου ἕως ὑψοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/008.yaml
  text: And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed.
translation:
  language: hi
  text: और वे अन्याय से बहुतों का मांस कौओं को खिला देंगे[a]। बुरी लोभ-लालसा में फूलकर वे बुराइयों और ऐसे घमंड में आगे बढ़ते जाएँगे, यहाँ तक कि वे ऊँचे उठाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य यहाँ अत्यंत संक्षिप्त है और ‘बहुतों का मांस’ तथा ‘कौओं’ के साथ कोई स्पष्ट क्रिया नहीं देता। हिन्दी में अर्थ पूरा करने के लिए ‘खिला देंगे’ जोड़ा गया है। प्रस्तुत यूनानी α-पाठ में केवल ‘कौए’ हैं, ‘आइबिस’ नहीं।
    reason: textual_and_syntactical_uncertainty
lexical_decisions:
- source_word: κόρακας
  choice: कौओं को
  rationale: प्रस्तुत α-पाठ में शब्द विशेष रूप से ‘कौए’ है; इसलिए परामर्शार्थ अंग्रेज़ी पाठ के ‘ibises’ को हिन्दी मुख्य पाठ में नहीं जोड़ा गया।
- source_word: πλεονεξίᾳ
  choice: लोभ में
  rationale: यह अत्यधिक पाने की लालसा, लालच या लोभ को व्यक्त करता है; आधुनिक हिन्दी में ‘लोभ’ संक्षिप्त और गरिमापूर्ण है।
- source_word: ὑψούμενοι / ὑψοῦνται
  choice: फूलकर / ऊँचे उठ जाएँगे
  rationale: पहले प्रयोग में संदर्भानुसार घमंड से फूलने का भाव है, जबकि अंतिम प्रयोग का ‘ऊँचे उठना’ अपेक्षाकृत शाब्दिक रखा गया है ताकि अस्पष्टता और पुनरावृत्ति बनी रहे।
- source_word: προκόψουσιν
  choice: आगे बढ़ेंगे
  rationale: क्रिया प्रगति करने या आगे बढ़ने का संकेत देती है; यहाँ उसका लक्ष्य बुराई है।
theological_decisions:
- issue: अंतिम ἕως ὑψοῦνται में ऊँचा किए जाने का कर्ता अस्पष्ट है
  choice: यहाँ तक कि वे ऊँचे उठ जाएँगे
  alternative: यहाँ तक कि वे ऊँचे किए जाएँगे
  rationale: स्रोत यह नहीं बताता कि कौन उन्हें ऊँचा करता है। चुना हुआ रूप किसी दैवी कर्ता को अनावश्यक रूप से आरोपित किए बिना अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। स्रोत की असामान्य पुनरावृत्ति—बुराई में आगे बढ़ना, घमंड, और ऊँचा उठना—हटाई नहीं गई।
