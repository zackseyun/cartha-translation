  to: और वे अन्याय से बहुतों का मांस कौओं को खिला देंगे[a]। बुरी लोभ-लालसा में फूलकर वे बुराइयों और ऐसे घमंड में आगे बढ़ते जाएँगे, यहाँ तक कि वे ऊँचे उठाए जाएँगे।
