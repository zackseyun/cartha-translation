id: T12P.JUD.21.5
reference: Testament of Judah 21:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ὁ γὰρ⁵ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ²⁸, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν³¹ ἐντρυφημάτων³² υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/005.yaml
  text: For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer the firstfruits of the delights of the sons of Israel[c] to him. But you shall be king of Jacob.
translation:
  language: hi
  text: क्योंकि प्रभु के दूत ने मुझसे कहा, “प्रभु ने तुम्हारी अपेक्षा उसे चुना है कि वह उसके निकट आए, उसकी मेज़ पर भोजन करे और इस्राएल के पुत्रों की उत्तम वस्तुओं का पहला अंश[a] उसे चढ़ाए। पर तुम याकूब के राजा होगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस्राएल के पुत्रों की उत्तम वस्तुओं का पहला अंश” सम्भवतः इस्राएल से लाई गई चुनी हुई उपज या समृद्ध प्रथम भेंटों को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ὑπὲρ σὲ
  choice: तुम्हारी अपेक्षा
  rationale: तुलनात्मक अर्थ ‘तुम्हारे ऊपर/तुमसे बढ़कर’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: προσεγγίζειν αὐτῷ
  choice: उसके निकट आए
  rationale: यूनानी के निकट आने के भाव को बनाए रखता है और उसके सम्भावित उपासना-संबंधी आशय को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: उसकी मेज़ पर भोजन करे
  rationale: यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप; मेज़, सहभागिता और पवित्र सेवा से जुड़ी सम्भावित अर्थ-छायाओं को खुला रखता है।
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: उत्तम वस्तुओं का पहला अंश
  rationale: ἀπαρχαί के प्रथम अर्पित अंश और ἐντρυφήματα की मनोहर, समृद्ध या स्वादिष्ट वस्तुओं की व्यापकता को पठनीय हिन्दी में साथ रखता है।
- source_word: βασιλεὺς Ἰακώβ
  choice: याकूब के राजा
  rationale: स्रोत की संबंध-सूचक रचना को निकटता से रखता है; यहाँ ‘याकूब’ कुल या प्रजा का सामूहिक नाम भी हो सकता है।
theological_decisions:
- issue: निकट आने, मेज़ पर भोजन करने और चढ़ाने का याजकीय आशय
  choice: मूल की ठोस क्रियाओं को बिना पदवी जोड़े रखा गया
  alternative: इसे स्पष्ट रूप से ‘याजकीय सेवा करने’ के रूप में अनूदित करना
  rationale: संदर्भ याजकीय भूमिका की ओर संकेत कर सकता है, पर इस पद में पदवी प्रत्यक्ष नहीं है; इसलिए निहितार्थ को व्याख्या द्वारा निश्चित नहीं किया गया।
- issue: याकूब पर राजत्व
  choice: ‘याकूब के राजा’
  alternative: ‘इस्राएल पर राजा’
  rationale: मूल पाठ Ἰακώβ कहता है; ‘इस्राएल’ कर देने से पाठ का विशिष्ट शब्द बदल जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। प्रत्यक्ष कथन के लिए हिन्दी उद्धरण-चिह्न लगाए गए हैं; याजकीय और राजकीय भूमिकाओं के बीच मूल पाठ का तनाव बनाए रखा गया है।
