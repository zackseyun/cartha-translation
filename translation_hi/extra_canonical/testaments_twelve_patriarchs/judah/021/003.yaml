lexical_decisions:
- source_word: τὰ ἐπὶ γῆς
  choice: पृथ्वी की वस्तुएँ
  rationale: यह पदबंध पृथ्वी पर स्थित या पृथ्वी से संबंधित बातों/वस्तुओं को समष्टिगत रूप से दर्शाता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: τὰ ἐν οὐρανοῖς
  choice: स्वर्ग की वस्तुएँ
  rationale: ग्रीक बहुवचन οὐρανοῖς का शाब्दिक अर्थ ‘स्वर्गों में’ हो सकता है, पर आधुनिक हिन्दी में ‘स्वर्ग’ अधिक स्वाभाविक है और यहाँ स्वर्गीय क्षेत्र की वस्तुओं का आशय सुरक्षित रखता है।
- source_word: ἐκείνῳ
  choice: उसे
  rationale: मूल का संकेतवाचक सर्वनाम संदर्भित दूसरे व्यक्ति को दर्शाता है; पद में उसका नाम नहीं जोड़ा गया।
theological_decisions:
- issue: पृथ्वी और स्वर्ग के अधिकार-क्षेत्रों का वितरण
  choice: मूल की समानांतर और संक्षिप्त अभिव्यक्ति को बनाए रखा गया
  alternative: ‘मुझे पृथ्वी का अधिकार और उसे स्वर्ग का अधिकार दिया’
  rationale: मूल पाठ स्पष्ट रूप से ‘अधिकार’ नहीं कहता; ऐसी व्याख्या जोड़ने से कथन की वास्तविक व्यापकता और अस्पष्टता सीमित हो जाती।
