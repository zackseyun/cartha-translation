source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσῃ³⁶ ἐν αὐτοῖς³⁷ ὡς³⁸ ἡ³⁹ θάλασσα. Καθάπερ⁴⁰ γὰρ⁴¹ ἐν αὐτῇ δίκαιοι καὶ ἄδικοι, οἱ μὲν αἰχμαλωτίζονται οἱ δὲ πλουτοῦσιν⁴⁴, οὕτως καὶ ἐν σοὶ πᾶν γένος ἀνθρώπων· οἱ μὲν †κωδυνεύσουσιν αἰχμαλωτιζόμενοι, οἱ δὲ πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/006.yaml
  text: 'And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.'
translation:
  language: hi
  text: 'और तू उनके बीच समुद्र के समान होगा। क्योंकि जैसे समुद्र में धर्मी और अधर्मी दोनों होते हैं—कुछ बंदी बना लिए जाते हैं और दूसरे धनवान हो जाते हैं—वैसे ही तुझमें भी हर प्रकार के मनुष्य होंगे: कुछ खतरे में पड़ेंगे[a] और बंदी बना लिए जाएँगे, जबकि दूसरे दूसरों की संपत्ति छीनकर धनवान हो जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खतरे में पड़ेंगे’ के लिए यूनानी पांडुलिपि-पाठ में शब्द विकृत है; सम्भवतः आशय ‘खतरे में पड़ेंगे’ है।
    reason: मूल संस्करण में †κωδυνεύσουσιν पाठगत रूप से संदिग्ध है और सम्भावित रूप κινδυνεύσουσιν के आधार पर अर्थ लिया गया है।
lexical_decisions:
- source_word: θάλασσα
  choice: समुद्र
  rationale: मूल उपमा को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δίκαιοι καὶ ἄδικοι
  choice: धर्मी और अधर्मी दोनों
  rationale: नैतिक विरोध को बिना किसी अतिरिक्त सांप्रदायिक अर्थ के स्पष्ट करता है; ‘दोनों’ यूनानी वाक्य की संक्षिप्त संरचना को हिन्दी में सहज बनाता है।
- source_word: πᾶν γένος ἀνθρώπων
  choice: हर प्रकार के मनुष्य
  rationale: शाब्दिक ‘मनुष्यों की हर जाति’ यहाँ अस्वाभाविक और आधुनिक हिन्दी में भ्रामक हो सकती है; यह चयन व्यापक मानवीय विविधता का भाव सुरक्षित रखता है।
- source_word: αἰχμαλωτίζονται / αἰχμαλωτιζόμενοι
  choice: बंदी बना लिए जाते हैं / बंदी बना लिए जाएँगे
  rationale: दोनों रूपों में बंदी बनाए जाने का निष्क्रिय अर्थ और वर्तमान-भविष्य का भेद सुरक्षित है।
- source_word: ἁρπάζοντες τὰ ἀλλότρια
  choice: पराया माल छीनकर
  rationale: ἁρπάζω के बलपूर्वक हड़पने और τὰ ἀλλότρια के दूसरों की संपत्ति होने—दोनों भावों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: धर्मी और अधर्मी के समुद्र में होने का संक्षिप्त कथन
  choice: ‘जैसे समुद्र में धर्मी और अधर्मी दोनों होते हैं’
  alternative: ‘जैसे समुद्र में धर्मी और अधर्मी तूफ़ानों से उछाले जाते हैं’
  rationale: यूनानी पाठ में ‘तूफ़ानों से उछाले जाते हैं’ के लिए स्पष्ट शब्द नहीं है; अतः अंग्रेज़ी परामर्श-पाठ की इस व्याख्यात्मक पूर्ति को मुख्य पाठ में नहीं जोड़ा गया।
- issue: समुद्र और ‘तुझमें’ हर प्रकार के मनुष्यों की उपमा
  choice: उपमा की असामान्य और तनावपूर्ण भाषा को यथावत रखा
  alternative: ‘तेरे वंश में’ या ‘तेरे राज्य में’ करके संदर्भ को निश्चित करना
  rationale: ἐν σοί का अर्थ शाब्दिक रूप से ‘तुझमें’ है; मूल की अस्पष्टता को किसी विशिष्ट वंशगत या राजनैतिक व्याख्या से नहीं बाँधा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तू/तुझमें’ रखा गया है, जिससे प्राचीन वसीयतनुमा प्रत्यक्ष संबोधन सुरक्षित रहता है। वाक्य की समानांतर संरचना और नैतिक तनाव बनाए रखे गए हैं।
