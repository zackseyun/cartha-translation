  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/003.yaml
  text: And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me likewise.
translation:
  language: hi
  text: और मेरे पूर्वज अब्राहम ने मुझे इस्राएल में राज करने की आशीष दी, और याकूब ने भी मुझे वैसी ही आशीष दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρόπατός μου
  choice: मेरे पूर्वज
  rationale: πρόπατωρ दूर के पुरुष पूर्वज को सूचित करता है; यहाँ अब्राहम के लिए स्वाभाविक और सटीक हिन्दी पद ‘पूर्वज’ है।
- source_word: εὐλόγησέ με βασιλεύειν
  choice: मुझे ... राज करने की आशीष दी
  rationale: यूनानी रचना में εὐλογέω के साथ infinitive βασιλεύειν आशीष की विषयवस्तु बताता है; हिन्दी में ‘राज करने की आशीष दी’ इसे सहज रूप से व्यक्त करता है।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: स्थान अथवा समुदाय के भीतर शासन—दोनों संभावनाओं को ‘इस्राएल में’ उसी संक्षिप्तता और अस्पष्टता के साथ बनाए रखता है।
- source_word: οὕτως
  choice: वैसी ही
  rationale: यह पहले कही गई आशीष की समानता को दर्शाता है; ‘वैसी ही आशीष’ हिन्दी में संदर्भ स्पष्ट रखते हुए स्वाभाविक है।
theological_decisions:
- issue: अब्राहम और याकूब द्वारा यहूदा को दी गई राजत्व-संबंधी आशीष
  choice: कथन को सीधे वंशपरंपरागत आशीष के रूप में रखा गया
  alternative: इसे भविष्यवाणी, अधिकार-प्रदान, या किसी विशिष्ट मसीही सिद्धांत के रूप में स्पष्ट करना
  rationale: मूल यूनानी केवल आशीष देने और इस्राएल में राज करने का कथन करता है; उससे आगे का धर्मवैज्ञानिक अर्थ अनिर्धारित छोड़ना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘राज करना’ ने βασιλεύειν का सीधा अर्थ रखा है और ‘वैसी ही आशीष’ ने οὕτως के संदर्भ को स्वाभाविक ढंग से व्यक्त किया है।
