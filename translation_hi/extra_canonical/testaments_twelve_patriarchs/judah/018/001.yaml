  text: जिसे प्रभु ने मुझे अपने पिता की आज्ञा मानते हुए दिया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἣν
  choice: जिसे
  rationale: यह स्त्रीलिंग संबंधवाचक सर्वनाम है और पूर्ववर्ती प्रसंग में आए किसी स्त्रीलिंग संज्ञा-पद की ओर संकेत करता है; उपलब्ध अंश में उसे स्पष्ट किए बिना संबंध बनाए रखा गया है।
- source_word: ἔδωκέ μοι Κύριος
  choice: प्रभु ने ... मुझे दिया था
  rationale: यूनानी शब्दक्रम और दान के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; काल को प्रसंगगत पूर्व घटना के रूप में रखा गया है।
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: मेरे पिता की आज्ञा मानने पर
  rationale: ὑπακοή के आज्ञाकारिता/आज्ञा मानने के अर्थ को सरल आधुनिक हिन्दी में देता है। 'पर' मूल के ἐν की परिस्थितिगत या संबद्ध भूमिका को बनाए रखता है और स्पष्ट कारणसूचक 'क्योंकि' जोड़ने से बचता है।
theological_decisions:
- issue: आज्ञाकारिता और प्रभु के देने के बीच संबंध
  choice: मेरे पिता की आज्ञा मानने पर
  alternative: क्योंकि मैंने अपने पिता की आज्ञा मानी
  rationale: मूल ἐν संबंध या परिस्थिति व्यक्त करता है; उसे सीधे कारण के रूप में निर्धारित करना मूल की संभावित व्यापकता को अनावश्यक रूप से सीमित करता।
- issue: ἣν के निहित पूर्वपद की पहचान
  choice: संबंधवाचक 'जिसे' द्वारा अस्पष्टता सुरक्षित रखी
  alternative: '''कृपा'' जोड़कर ''जो कृपा'' कहना'
  rationale: दिए गए यूनानी अंश में 'कृपा' के लिए कोई प्रत्यक्ष संज्ञा नहीं है। अंग्रेज़ी परामर्श-पाठ का 'favor' संभवतः पूर्ववर्ती संदर्भ को स्पष्ट करता है, पर उपलब्ध मूल अंश के आधार पर उसे यहाँ जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्यांश की मूल खंडात्मक प्रकृति और अंत का अल्पविराम सुरक्षित रखा गया है, क्योंकि यह संभवतः पिछले वाक्यांश के स्त्रीलिंग पूर्वपद से जुड़ता और आगे जारी रहता है।
