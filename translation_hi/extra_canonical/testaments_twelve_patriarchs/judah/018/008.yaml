source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Θυσίας Θεοῦ ἐμποδίζει²⁹, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει³⁰. *Προφήτου λαλοῦντος οὐκ ἀκούει³¹, καὶ λόγους εὐσεβείας³³ προσοχθίζει³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/008.yaml
  text: They hinder the sacrifices of God, and do not remember the blessing of God. They do not listen when a prophet speaks, and resent words of godliness.
translation:
  language: hi
  text: वे परमेश्वर के बलिदानों में बाधा डालते हैं और परमेश्वर की आशीष को स्मरण नहीं करते। वे भविष्यद्वक्ता के बोलने पर उसकी नहीं सुनते और भक्ति की बातों से चिढ़ते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ
  choice: परमेश्वर के बलिदानों
  rationale: बहुवचन ‘बलिदानों’ यूनानी Θυσίας के रूप को बनाए रखता है और Θεοῦ के संबंध को सीधे व्यक्त करता है।
- source_word: ἐμποδίζει
  choice: बाधा डालते हैं
  rationale: क्रिया का मूल अर्थ रोकना या व्यवधान उत्पन्न करना है; संदर्भ और अंग्रेज़ी परामर्श-पाठ के अनुसार निहित कर्ता बहुवचन रखा गया है।
- source_word: εὐλογίαν Θεοῦ
  choice: परमेश्वर की आशीष
  rationale: εὐλογία के धार्मिक और सामान्य दोनों अर्थों के लिए ‘आशीष’ स्वाभाविक तथा सटीक है।
- source_word: οὐ μνημονεύει
  choice: स्मरण नहीं करते
  rationale: μνημονεύω का सीधा अर्थ याद या स्मरण करना है; ‘स्मरण’ गरिमापूर्ण किंतु सुबोध है।
- source_word: Προφήτου λαλοῦντος
  choice: भविष्यद्वक्ता के बोलने पर
  rationale: यूनानी संबंधकारक स्वतंत्र रचना को स्वाभाविक हिन्दी कालगत उपवाक्य में व्यक्त किया गया है।
- source_word: οὐκ ἀκούει
  choice: उसकी नहीं सुनते
  rationale: संदर्भ में केवल ध्वनि सुनना नहीं, भविष्यद्वक्ता की बात पर ध्यान देना या मानना अभिप्रेत है; हिन्दी मुहावरा ‘उसकी सुनना’ यह अर्थ सँभालता है।
- source_word: λόγους εὐσεβείας
  choice: भक्ति की बातों
  rationale: εὐσέβεια के लिए ‘भक्ति’ परमेश्वर के प्रति श्रद्धापूर्ण जीवन का सहज हिन्दी शब्द है; λόγους को प्रसंगानुकूल ‘बातों’ कहा गया है।
- source_word: προσοχθίζει
  choice: चिढ़ते हैं
  rationale: क्रिया अप्रसन्नता, खीझ या विरक्ति प्रकट करती है; ‘चिढ़ते हैं’ आधुनिक और स्पष्ट है।
theological_decisions:
- issue: क्रियाओं के व्याकरणिक रूप और निहित कर्ता
  choice: पूरे पद में बहुवचन ‘वे’
  alternative: यूनानी पांडुलिपि के एकवचन क्रियारूपों के अनुसार ‘वह’
  rationale: प्रदत्त यूनानी में क्रियाएँ रूपतः एकवचन हैं, पर अंग्रेज़ी POB की समीक्षा ने आरंभिक बहुवचन संदर्भ के अनुरूप पूरे पद को बहुवचन माना है। हिन्दी में असंगति से बचते हुए उसी प्रवाह को रखा गया, बिना किसी विशिष्ट समूह की पहचान जोड़े।
- issue: λόγους εὐσεβείας का धार्मिक आशय
  choice: भक्ति की बातें
  alternative: धर्मपरायणता के वचन
  rationale: ‘भक्ति’ εὐσέβεια की परमेश्वर-संबंधी श्रद्धा को सहज रूप से व्यक्त करती है और किसी संप्रदाय-विशेष की शब्दावली नहीं थोपती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। समानांतर वाक्य-संरचना और आरोपात्मक लय को बनाए रखा गया है।
