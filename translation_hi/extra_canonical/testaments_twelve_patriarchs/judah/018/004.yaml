- source_word: ἔγνωκα
  choice: मैं जानता हूँ
  rationale: यूनानी पूर्णकाल का वर्तमान परिणाम यहाँ वर्तमान ज्ञान को व्यक्त करता है; स्वाभाविक हिन्दी में ‘जानता हूँ’ उपयुक्त है।
- source_word: ὅσα κακὰ
  choice: कौन-कौन से बुरे काम
  rationale: ὅσα की व्यापकता और κακά के बहुवचन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ποιήσετε
  choice: करोगे
