- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: अन्तिम दिनों में
  rationale: पारंपरिक और सुबोध वाक्यांश, जो कालगत तथा युगान्त-संबंधी संभावित अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
