base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/006.yaml
  text: For these turn one away from the law of God, and blind the judgment of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor.
translation:
  language: hi
  text: क्योंकि ये बातें मनुष्य को परमेश्वर की व्यवस्था से दूर कर देती हैं, उसकी आत्मा के विवेक को अंधा कर देती हैं, घमंड सिखाती हैं, और उसे अपने पड़ोसी पर दया करने नहीं देतीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφιστᾷ
  choice: दूर कर देती हैं
  rationale: यह क्रिया किसी को किसी आधार या निष्ठा से हटा देने का भाव रखती है; यहाँ परमेश्वर की व्यवस्था से विमुख करने का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τοῦ νόμου τοῦ θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος के धार्मिक और नैतिक आशय को व्यक्त करने के लिए मानक बाइबलीय हिन्दी 'व्यवस्था' उपयुक्त है।
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: उसकी आत्मा की निर्णय-शक्ति
  rationale: διαβούλιον विचार-विमर्श, विवेकपूर्ण निर्णय या निर्णय-सामर्थ्य का बोध कराता है; 'निर्णय-शक्ति' मूल की अस्पष्टता को अनावश्यक रूप से 'उद्देश्य' में नहीं बदलती और हिन्दी में समझने योग्य है।
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: उसे घमंड करना सिखाती हैं
  rationale: ὑπερηφανία अहंकार या घमंड है, और ἐκδιδάσκει सिखाने का भाव देता है; हिन्दी वाक्य में निहित कर्म को स्पष्ट करने के लिए 'उसे' जोड़ा गया है।
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  choice: अपने पड़ोसी पर दया
  rationale: ἐλεέω के लिए 'दया करना' और πλησίον के लिए शास्त्रीय तथा व्यापक रूप से समझा जाने वाला 'पड़ोसी' चुना गया है।
theological_decisions:
- issue: ‘आत्मा के διαβούλιον’ का स्वरूप
  choice: आत्मा की निर्णय-शक्ति
  alternative: आत्मा का विचार-विमर्श / आत्मा का उद्देश्य
  rationale: मूल शब्द आंतरिक विचार और निर्णय के क्षेत्र को सूचित करता है। 'निर्णय-शक्ति' नैतिक विवेक का संकेत देती है, पर इसे किसी विशिष्ट धर्मवैज्ञानिक सिद्धांत के रूप में परिभाषित नहीं करती।
- issue: बहुवचन ταῦτα का संदर्भ
  choice: ये बातें
  alternative: ये वस्तुएँ / ये दोष
  rationale: पिछले संदर्भ की स्पष्ट पहचान इस पद में नहीं दी गई; इसलिए तटस्थ 'ये बातें' मूल के संकेतात्मक बहुवचन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। समानांतर यूनानी क्रियाओं की श्रृंखला को हिन्दी में बनाए रखा गया है। ‘मनुष्य’ पहले खंड में स्पष्ट किया गया है और आगे सर्वनामों से उसी का संदर्भ रखा गया है।
