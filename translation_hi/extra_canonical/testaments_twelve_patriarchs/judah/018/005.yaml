translation:
  language: hi
  text: इसलिए, मेरे बच्चों, यौन अनैतिकता और धन के लोभ से अपने आपको बचाए रखो, और अपने पिता यहूदा की बात सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: अपने आपको बचाए रखो
  rationale: मध्यम आत्मवाच्य आज्ञा का स्वाभाविक हिन्दी रूप; निरंतर सावधानी और आत्मरक्षा का भाव व्यक्त करता है।
- source_word: πορνείας
  choice: व्यभिचार
  rationale: यहाँ व्यापक यौन अनैतिकता के लिए प्रचलित, संक्षिप्त और गरिमापूर्ण धार्मिक शब्द।
- source_word: φιλαργυρίας
  choice: धन के लोभ
  rationale: शाब्दिक अर्थ ‘चाँदी/धन से प्रेम’; आधुनिक हिन्दी में नकारात्मक नैतिक आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀκούσατε
  choice: की बात सुनो
  rationale: संदर्भ में केवल ध्वनि सुनना नहीं, बल्कि पिता के निर्देश पर ध्यान देना अभिप्रेत है; फिर भी ‘मानो’ कहकर आज्ञापालन को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: अपने पिता यहूदा
  rationale: यूनानी संबंध को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है और यहूदा को वक्ता तथा पिता दोनों के रूप में सुरक्षित रखा गया है।
