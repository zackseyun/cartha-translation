  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρελάλησα
  choice: बात का ... विरोध नहीं किया
  rationale: क्रिया का मूल भाव किसी के विरुद्ध बोलना या उसकी बात का प्रतिवाद करना है। यह अनुवाद अंग्रेज़ी परामर्श-पाठ के ‘दुःखी किया’ की अपेक्षा यूनानी शब्द के अधिक निकट है और अगले उपवाक्य में वर्णित आज्ञापालन से स्वाभाविक रूप से जुड़ता है।
- source_word: πάντα ὅσα μοι ἔλεγεν ἐποίουν
  choice: वे मुझसे जो कुछ कहते थे, वह सब मैं करता था
  rationale: ἔλεγεν और ἐποίουν के अपूर्णकाल निरंतर अथवा आदतन व्यवहार बताते हैं; हिन्दी में ‘कहते थे’ और ‘करता था’ उसी भाव को स्वाभाविक ढंग से व्यक्त करते हैं।
