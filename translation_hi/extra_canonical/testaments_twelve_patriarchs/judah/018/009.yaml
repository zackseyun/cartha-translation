source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει³⁵, *καὶ Θεῷ ὑπακοῦσαι³⁶ οὐ δύναται³⁷, ὅτι ἐτύφλωσε³⁸ τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/009.yaml
  text: For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.
translation:
  language: hi
  text: क्योंकि वह दो परस्पर विरोधी आवेगों का दास है और परमेश्वर की आज्ञा नहीं मान सकता, क्योंकि उसने उसकी आत्मा को अंधा कर दिया है और वह दिन के समय ऐसे चलता है जैसे रात में चलता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν
  choice: वासनाओं
  rationale: यहाँ शब्द उन प्रबल और परस्पर विरोधी इच्छाओं या आवेगों को सूचित करता है जिनके अधीन व्यक्ति दासवत है; ‘वासनाएँ’ इस नैतिक संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: δουλεύει
  choice: दास है
  rationale: यूनानी क्रिया का मूल भाव दास के रूप में सेवा करना या अधीन होना है; संक्षिप्त हिंदी अभिव्यक्ति उस बंधन को बनाए रखती है।
- source_word: ὑπακοῦσαι
  choice: आज्ञा मानना
  rationale: इसका अर्थ सुनकर अधीन होना/पालन करना है; परमेश्वर के संदर्भ में ‘आज्ञा मानना’ सहज और सटीक है।
- source_word: ἐτύφλωσε
  choice: अंधा कर दिया है
  rationale: एकवचन क्रिया को एकवचन ही रखा गया है और स्रोत में निहित कर्ता की अस्पष्टता को नहीं मिटाया गया।
- source_word: πορεύεται
  choice: चलता है
  rationale: शाब्दिक चलने और रूपक जीवन-आचरण दोनों की संभावना को बनाए रखता है।
theological_decisions:
- issue: ἐτύφλωσε का कर्ता
  choice: ‘उसने’—एकवचन और संदर्भगत रूप से अस्पष्ट
  alternative: ‘उन्होंने’ या ‘वे उसकी आत्मा को अंधा कर देती हैं’—दो वासनाओं को कर्ता मानना
  rationale: प्राप्त यूनानी पाठ में क्रिया ἐτύφλωσε एकवचन है, जबकि निकटवर्ती ‘दो वासनाएँ’ बहुवचन हैं। इसलिए अंग्रेज़ी परामर्श-पाठ के बहुवचन समाधान को न अपनाकर मूल की व्याकरणिक और अर्थगत कठिनाई सुरक्षित रखी गई है।
- issue: अंतिम उपवाक्य का समावेश
  choice: ‘और वह दिन में भी ऐसे चलता है मानो रात हो’ शामिल किया गया
  alternative: अंग्रेज़ी POB की तरह इसे छोड़ देना
  rationale: यह वाक्यांश उपलब्ध यूनानी स्रोत में स्पष्ट रूप से उपस्थित है और आत्मिक अंधेपन की छवि को आगे बढ़ाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए बोधगम्य हिंदी। वाक्य-संरचना मूल के कारणात्मक प्रवाह और अंतिम दिन-रात की उपमा को सुरक्षित रखती है।
