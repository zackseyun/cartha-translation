  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/007.yaml
  text: It deprives his soul of every goodness, and holds him fast in pains and labors; it drives sleep away from him, and consumes his flesh.
translation:
  language: hi
  text: वह उसकी आत्मा को हर प्रकार की भलाई से वंचित कर देता है और उसे पीड़ा और कठिन परिश्रम में जकड़े रखता है; वह उसकी नींद उड़ा देता है और उसके शरीर को क्षीण कर देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: वंचित कर देता है
  rationale: यह क्रिया किसी वस्तु से महरूम कर देने या छीन लेने का भाव व्यक्त करती है; हिन्दी में यह प्रयोग स्वाभाविक और अर्थ-सटीक है।
- source_word: πάσης ἀγαθότητος
  choice: हर प्रकार की भलाई
  rationale: πάσης की व्यापकता और ἀγαθότης के नैतिक/कल्याणकारी अर्थ को बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
- source_word: συνέχει
  choice: जकड़े रखता है
  rationale: मूल में थामे रखने, दबोचे रखने या घेरे रखने का सशक्त भाव है; यह वाक्य के कष्टकारी संदर्भ में उपयुक्त है।
- source_word: πόνοις καὶ μόχθοις
  choice: पीड़ा और कठिन परिश्रम
  rationale: πόνος के दुख/पीड़ा तथा μόχθος के श्रमसाध्य परिश्रम के अलग-अलग पक्षों को बनाए रखता है।
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: उसकी नींद उड़ा देता है
  rationale: शाब्दिक संरचना असामान्य है, पर आशय उससे नींद दूर कर देने का है; हिन्दी मुहावरा इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: उसके शरीर को क्षीण कर देता है
  rationale: καταδαπανάω पूरी तरह खपा देने या गलाने का भाव देता है; बहुवचन σάρκας को हिन्दी में स्वाभाविक सामूहिक अर्थ ‘शरीर’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्रियाओं के कर्ता का वचन
  choice: एकवचन ‘वह’
  alternative: बहुवचन ‘वे’
  rationale: ग्रीक की सभी प्रमुख क्रियाएँ एकवचन हैं और αὐτόν/αὐτοῦ भी एक व्यक्ति को कर्म/सम्बन्ध के रूप में दर्शाते हैं; इसलिए पूर्ववर्ती एकवचन कर्ता के लिए ‘वह’ रखा गया है।
- issue: ψυχή का अनुवाद
  choice: आत्मा
  alternative: प्राण या जीवन
  rationale: इस संदर्भ में ψυχή व्यक्ति के भीतरी नैतिक अस्तित्व की ओर संकेत कर सकती है; ‘आत्मा’ इस अर्थ को बनाए रखती है और पाठ की सम्भावित धार्मिक गहराई को संकुचित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली अपनाई गई है। समानांतर क्रियाओं में एकवचन कर्ता बनाए रखा गया है; ‘नींद उड़ा देता है’ स्वाभाविक हिन्दी मुहावरा है, जबकि ‘जकड़े रखता है’ और ‘क्षीण कर देता है’ मूल की तीव्रता को सँभालते हैं।
