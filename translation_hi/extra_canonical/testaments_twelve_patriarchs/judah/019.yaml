  text: My children[b][a], the love of money leads to idolatry.
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 19**


    **1** मेरे बच्चों, धन का प्रेम मूर्तिपूजा की ओर ले जाता है।[a] क्योंकि धन के भ्रम में लोग उन्हें देवता कहते हैं जो देवता हैं ही नहीं; और यह प्रेम, जिसके भीतर यह है, उसे सुध-बुध खो बैठने पर मजबूर कर देता है।[b] **2** मेरे बच्चों, धन के कारण मैंने अपनी संतान खो दी। यदि मेरे पश्चाताप, मेरी नम्रता, और मेरे पिता की प्रार्थनाओं ने मेरी सहायता न की होती, तो मैं निःसंतान मर गया होता। **3** परन्तु मेरे पूर्वजों के परमेश्वर ने मुझ पर दया की, क्योंकि मैंने यह अनजाने में किया था। **4** क्योंकि भ्रम के शासक ने मुझे अंधा कर दिया था; और मैं, मनुष्य और पापों में भ्रष्ट देह होकर, अज्ञान में रहा। अपने को अजेय समझते हुए मैंने अपनी ही दुर्बलता को पहचाना।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश संक्षिप्त है; शब्दशः, “धन का प्रेम मूर्तिपूजा की ओर।” यहाँ निहित नैतिक संबंध को “ले जाता है” से व्यक्त किया गया है। इसका अनुवाद “मूर्तिपूजा की ओर झुकता है” भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: यूनानी अभिव्यक्ति का अर्थ सामान्य अवस्था से बाहर हो जाना है; इसका अनुवाद “उन्माद में पड़ जाना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ में “अपनी दुर्बलता को पहचाना” और “अपने को अजेय समझते हुए” दोनों साथ आते हैं। अनुवाद इस तनाव को बनाए रखता है।
    reason: ambiguity
lexical_decisions:
- source_word: Τέκνα μου
  choice: मेरे बच्चो
  rationale: यह संबोधन कुलपिता की आत्मीय और उपदेशात्मक वाणी को सहज आधुनिक हिन्दी में रखता है; यूनानी शब्द को केवल ‘पुत्रो’ तक सीमित नहीं करता।
- source_word: φιλαργυρία
  choice: धन का प्रेम
  rationale: यह शब्द चाँदी अथवा धन से प्रेम को विशेष रूप से व्यक्त करता है; सामान्य ‘लोभ’ की अपेक्षा मूल शब्द की संरचना और नैतिक बल को अधिक निकटता से बचाता है।
- source_word: πρὸς εἰδωλολατρίαν
  choice: मूर्तिपूजा की ओर ले जाता है
  rationale: πρός की दिशात्मक शक्ति को बनाए रखते हुए लुप्त क्रियात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है; इसे ‘मूर्तिपूजा है’ कहकर दोनों की पूर्ण समानता नहीं ठहराई गई।
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: धन के मोह में पड़कर
  rationale: πλάνη में भ्रम, बहकावा और भटकाव के भाव हैं। ‘मोह’ धन से उत्पन्न भ्रामक आकर्षण को इस प्रसंग में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: सुध-बुध खो बैठने पर मजबूर कर देता है
  rationale: यहाँ ἔκστασις सामान्य आत्मिक परमानंद नहीं, बल्कि सामान्य मानसिक अवस्था से विचलन या बेसुधी सूचित करता है। चुना हुआ रूप अर्थ को स्पष्ट रखते हुए अनावश्यक चिकित्सकीय निदान से बचता है।
- source_word: συνεδράμον
  choice: मेरी सहायता न की होती
  rationale: क्रिया का मूल भाव साथ दौड़कर सहायता पहुँचाना है। हिन्दी में ‘सहायता करना’ प्रतिकल्पित वाक्य में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: भ्रम का शासक
  rationale: ἄρχων के शासकीय भाव और πλάνη के भ्रम/बहकावे को बनाए रखा गया है, बिना इस पात्र की पहचान को पाठ से आगे जाकर निश्चित किए।
- source_word: ἀκαταμάχητος
  choice: अजेय
  rationale: शब्द का अर्थ है ऐसा जिससे लड़ा न जा सके या जिसे पराजित न किया जा सके; ‘अजेय’ संक्षिप्त, गरिमापूर्ण और सटीक है।
theological_decisions:
- issue: धन के प्रेम और मूर्तिपूजा का संबंध
  choice: ‘मूर्तिपूजा की ओर ले जाता है’ के रूप में दिशात्मक नैतिक संबंध
  alternative: ‘धन का प्रेम मूर्तिपूजा है’
  rationale: प्राप्त यूनानी वाक्यांश संक्षिप्त है और उसमें स्पष्ट सीमित क्रिया नहीं है। πρός सामान्यतः दिशा बताता है, इसलिए पूर्ण तादात्म्य घोषित करने के बजाय दिशात्मक संबंध सुरक्षित रखा गया है।
- issue: ‘भ्रम के शासक’ की पहचान
  choice: उपाधि को बिना अतिरिक्त पहचान के यथावत रखना
  alternative: इसे स्पष्ट रूप से ‘शैतान’ कहना
  rationale: पाठ केवल ὁ ἄρχων τῆς πλάνης कहता है। किसी विशिष्ट नाम को जोड़ना मूल स्रोत से आगे जाना और व्याख्यात्मक परंपरा को पाठ में आयात करना होता।
- issue: दुर्बलता पहचानने और स्वयं को अजेय समझने का तनाव
  choice: दोनों भावों को एक साथ बनाए रखना
  alternative: इसे कालक्रम बनाकर ‘बाद में मैंने अपनी दुर्बलता पहचानी’ कहना
  rationale: यूनानी में ἐπέγνων सकारात्मक रूप से ‘मैंने पहचाना’ है और νομίζων ‘समझते हुए’ कहता है। अनुवाद ने इस असहज किंतु वास्तविक तनाव को मिटाने के लिए ‘बाद में’ या निषेध नहीं जोड़ा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। संबोधन में आत्मीयता, नैतिक चेतावनी में गंभीरता और आत्मस्वीकार में मूल पाठ की असहजता सुरक्षित है। संस्कृतनिष्ठ शब्द केवल वहाँ रखे गए हैं जहाँ वे प्रचलित और सटीक हैं, जैसे ‘मूर्तिपूजा’, ‘पश्चाताप’, ‘निःसंतान’ और ‘अजेय’।
