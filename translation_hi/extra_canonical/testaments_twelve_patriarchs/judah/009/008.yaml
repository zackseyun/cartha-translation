  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/008.yaml
  text: And they were giving us five hundred cors of wheat, and five hundred baths of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.
translation:
  language: hi
  text: और वे हमें पाँच सौ कोर गेहूँ, पाँच सौ बत तेल और पाँच सौ माप दाखमधु देते रहे—उस अकाल तक, जब हम मिस्र उतर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυροῦ κόρους πεντακοσίους
  choice: पाँच सौ कोर गेहूँ
  rationale: κόρος एक प्राचीन अन्न-माप है; इकाई का नाम सुरक्षित रखते हुए हिन्दी में स्वाभाविक क्रम अपनाया गया है।
- source_word: ἐλαίου †ὕφης πεντακοσίους
  choice: पाँच सौ बात तेल
  rationale: यहाँ पाठ दूषित/अनिश्चित है, पर संदर्भ और प्रमाण विशिष्ट द्रव-माप 'बात' की ओर संकेत करते हैं; इसलिए सामान्य 'माप' के बजाय इकाई का नाम रखा गया है।
- source_word: οἴνου *μέτρα πεντακόσια
  choice: पाँच सौ माप दाखमधु
  rationale: μέτρα सामान्यतः 'माप' है और पाठ-चिह्न अनिश्चितता दर्शाता है; अतः कोई अधिक विशिष्ट इकाई आरोपित नहीं की गई।
- source_word: ἕως τοῦ λιμοῦ
  choice: उस अकाल तक
  rationale: ἕως की कालगत सीमा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατήλθομεν εἰς Αἴγυπτον
  choice: हम मिस्र उतर गए
  rationale: बाइबलीय भौगोलिक प्रयोग 'मिस्र उतरना' को प्राकृतिक हिन्दी में बनाए रखता है।
