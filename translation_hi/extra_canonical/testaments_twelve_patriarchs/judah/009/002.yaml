  text: And when the eighteen years were fulfilled, Esau, my father's brother, returned to us with a large and strong people.
translation:
  language: hi
  text: और जब अठारह वर्ष पूरे हो गए, तब मेरे पिता का भाई एसाव एक विशाल और शक्तिशाली जनसमूह के साथ हमारे पास लौट आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληρωθέντων τῶν δεκαοκτὼ ἐτῶν
  choice: जब अठारह वर्ष पूरे हो गए
  rationale: कालावधि पूरी होने के यूनानी भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπανῆλθεν ἡμῖν
  choice: हमारे पास लौट आया
  rationale: ἐπανῆλθεν का मूल अर्थ ‘लौट आया’ है; ἡμῖν को प्रसंगानुकूल ‘हमारे पास’ रखा गया है, बिना ‘हमारे विरुद्ध’ का भाव जोड़े।
- source_word: ὁ ἀδελφὸς τοῦ πατρός μου
  choice: मेरे पिता का भाई
  rationale: मूल संबंध-सूचक वाक्यांश का सीधा और स्पष्ट अनुवाद है।
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: एक विशाल और शक्तिशाली जनसमूह के साथ
  rationale: βαρεῖ यहाँ संख्या/प्रभाव में भारी या विशाल समुदाय का बोध कराता है; ἰσχυρῷ के लिए ‘शक्तिशाली’ रखा गया है। ‘जनसमूह’ आधुनिक हिन्दी में λαός के इस सैन्य-सामूहिक प्रयोग को स्वाभाविक बनाता है।
