  text: And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting around it, we besieged it.
translation:
  language: hi
  text: और हमने एसाव के पुत्रों का पीछा किया। उनके पास भी एक किलाबंद नगर था, और हम उसमें प्रवेश नहीं कर सके। तब उसके चारों ओर डेरा डालकर, हम उसकी घेराबंदी करते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδιώξαμεν
  choice: पीछा किया
  rationale: क्रिया के तीव्र पीछा करने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς υἱοὺς Ἡσαῦ
  choice: एसाव के पुत्रों
  rationale: वंशज या लोग अर्थ की सम्भावना को संकुचित किए बिना यूनानी की औपचारिक अभिव्यक्ति बनाए रखता है।
- source_word: πόλις ὀχυρά
  choice: किलाबंद नगर
  rationale: सुरक्षित और दुर्गीकृत नगर का आशय संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: περικαθίσαντες
  choice: चारों ओर डेरा डालकर
  rationale: शाब्दिक रूप से चारों ओर बैठने की क्रिया यहाँ सैन्य प्रसंग में नगर को घेरकर टिक जाने, अर्थात डेरा डालने, को सूचित करती है।
- source_word: ἐπολιορκοῦμεν
  choice: घेर लिया
  rationale: नगर की सैन्य घेराबंदी के अर्थ को सामान्य पाठक के लिए स्वाभाविक हिन्दी में व्यक्त करता है।
