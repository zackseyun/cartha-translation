  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/005.yaml
  text: And because they did not open to us after twenty days, while they were watching, I brought a ladder; and placing my shield over my head and receiving the stones, I went up and killed four of their mighty men.
translation:
  language: hi
  text: और जब उन्होंने बीस दिन तक द्वार नहीं खोले, तब उनके देखते-देखते मैं एक सीढ़ी ले आया। अपनी ढाल सिर के ऊपर रखकर और दीवार से आते पत्थरों को झेलते हुए मैं ऊपर चढ़ गया और उनके नगर के चार शक्तिशाली पुरुषों को मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἠνοίγον
  choice: द्वार नहीं खोले
  rationale: यूनानी में कर्म व्यक्त नहीं है, पर घेराबंदी के प्रसंग में नगर के द्वार अर्थ में निहित हैं; हिन्दी में स्वाभाविक और स्पष्ट वाक्य के लिए ‘द्वार’ जोड़ा गया।
- source_word: δρώντων αὐτῶν
  choice: उनके देखते-देखते
  rationale: यह अभिव्यक्ति उनके देखते या निगरानी करते रहने का भाव संक्षेप में सुरक्षित रखती है।
- source_word: προσάγω κλίμακα
  choice: मैं एक सीढ़ी ले आया
  rationale: προσάγω यहाँ सीढ़ी को पास लाने का संकेत देता है; ‘ले आया’ सहज आधुनिक हिन्दी है।
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: दीवार से आते पत्थरों को झेलते हुए
  rationale: शाब्दिक ‘पत्थरों को ग्रहण करते हुए’ हिन्दी में भ्रामक होता; युद्ध के प्रसंग में इसका आशय दीवार से फेंके गए पत्थरों का सामना करना है।
- source_word: δυνάστας
  choice: वीर पुरुषों
  rationale: शब्द शक्तिशाली या प्रमुख योद्धाओं को सूचित करता है; प्रसंगानुकूल ‘वीर पुरुष’ उनकी युद्ध-सामर्थ्य व्यक्त करता है, बिना किसी औपचारिक पदवी को आरोपित किए।
