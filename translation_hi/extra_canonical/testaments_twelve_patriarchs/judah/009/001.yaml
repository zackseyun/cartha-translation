  text: For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.
translation:
  language: hi
  text: अठारह वर्षों तक मेरे पिता ने अपने भाई एसाव के साथ शांति बनाए रखी, और मेसोपोटामिया से, लाबान के यहाँ से, हमारे आने के बाद उसके पुत्र हमारे साथ रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέκα καὶ ὀκτὼ ἔτη
  choice: अठारह वर्ष तक
  rationale: समयावधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐποίησεν ... εἰρήνην
  choice: शांति बनाए रखी
  rationale: शाब्दिक अर्थ ‘शांति की’ है; प्रसंग में दीर्घकालीन शांतिपूर्ण संबंध का भाव है।
- source_word: μετὰ τοῦ ἀδελφοῦ αὐτοῦ Ἡσαῦ
  choice: अपने भाई एसाव के साथ
  rationale: यूनानी संबंध और व्यक्तिनाम को सीधे तथा स्पष्ट रूप में सुरक्षित रखता है।
- source_word: καὶ οἱ υἱοὶ αὐτοῦ μεθ᾽ ἡμῶν
  choice: तब उसके पुत्र हमारे साथ रहे
  rationale: यूनानी में क्रिया लुप्त है; हिन्दी में पूर्ण वाक्य के लिए ‘रहे’ की स्वाभाविक पूर्ति की गई है।
- source_word: ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν
  choice: मेसोपोटामिया में लाबान के यहाँ से
  rationale: दोहरे ἀπό को हिन्दी में स्वाभाविक ढंग से प्रस्तुत करते हुए यह भाव रखा गया है कि वापसी मेसोपोटामिया स्थित लाबान के यहाँ से हुई।
