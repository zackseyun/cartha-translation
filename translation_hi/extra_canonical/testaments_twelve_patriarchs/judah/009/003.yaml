lexical_decisions:
- source_word: ἔπαισεν ἐν τόξῳ
  choice: धनुष से मारा
  rationale: क्रिया ἔπαισεν प्रहार करने या मारने को व्यक्त करती है और ἐν τόξῳ साधन बताता है; इसलिए यह स्वाभाविक और स्रोत-संगत अनुवाद है।
- source_word: ἤρθη
  choice: उठा लिया गया
  rationale: यह αἴρω का कर्मवाच्य रूप है, जिसका सीधा अर्थ ‘उठाया गया’ या प्रसंगानुसार ‘ले जाया गया’ हो सकता है। ‘उठा लिया गया’ मूल की कर्मवाच्यता और अर्थगत खुलापन बनाए रखता है।
- source_word: ὁ νεκρὸς
  choice: उसका शव
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का अर्थ ‘मृत व्यक्ति’ या ‘मृत देह’ है। हिंदी में ‘उसका शव’ स्पष्ट और स्वाभाविक है तथा संदर्भ में एसाव की ओर संकेत करता है।
- source_word: ἐν ὄρει Σεείρ
  choice: सेईर पर्वत पर
  rationale: ἐν यहाँ घटना का स्थान बताता है; नाम Σεείρ को प्रचलित हिंदी बाइबलीय रूप ‘सेईर’ में लिप्यंतरित किया गया है।
