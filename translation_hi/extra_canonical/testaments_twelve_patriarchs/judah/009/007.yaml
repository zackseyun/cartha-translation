translation:
  language: hi
  text: तब उन्होंने हमसे शांति की शर्तें माँगीं, और हमारे पिता के साथ विचार-विमर्श हो जाने पर हमने उन्हें कर देनेवाले अधीन लोगों के रूप में स्वीकार कर लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ऐसे अधीन लोग है जो कर या भेंट चुकाते हों।
    reason: ‘कर देनेवाले अधीन लोग’ में निहित राजनीतिक अधीनता और नियमित देयता को स्पष्ट करता है।
lexical_decisions:
- source_word: τὰ πρὸς εἰρήνην
  choice: शांति की शर्तें
  rationale: शाब्दिक अर्थ ‘शांति से संबंधित बातें’ है; प्रसंग में यह स्वाभाविक रूप से शांति की शर्तों को सूचित करता है।
- source_word: γενομένης βουλῆς μετὰ τοῦ πατρὸς ἡμῶν
  choice: हमारे पिता के साथ विचार-विमर्श हो जाने पर
  rationale: γενоμένης βουλῆς की परिस्थिति-सूचक संबंधवाचक रचना और μετά के सहभागी भाव को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ὑποδεξάμενοι
  choice: स्वीकार कर लिया
  rationale: यहाँ क्रिया का अर्थ उनका स्वागत या ग्रहण करना है; अगले विधेय विशेषण के साथ ‘स्वीकार करना’ सबसे उपयुक्त है।
- source_word: ὑποφόρους
  choice: अपने अधीन कर देनेवालों
  rationale: यह शब्द अधीनता के साथ कर या भेंट चुकाने की बाध्यता बताता है। इसे छोड़ा नहीं गया, क्योंकि यह यूनानी वाक्य की महत्वपूर्ण राजनीतिक शर्त है।
