  text: 'Therefore keep[a], my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness. And bury me near my fathers.


    And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.


    And if you walk in holiness according to all the commandments of the Lord, you will again dwell securely with me[b], and all Israel will be gathered to the Lord forever.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 26**


    **1** इसलिए, मेरे बच्चों, प्रभु की सारी व्यवस्था का पालन करो, क्योंकि जो उसके मार्गों को सीधा करते हैं, उनके लिए आशा है।


    **2** फिर उसने उनसे कहा, “देखो, मैं एक सौ अठारह वर्ष का हूँ और आज मर रहा हूँ। **3** कोई मुझे बहुमूल्य वस्त्र पहनाकर दफ़न न करे, बल्कि मुझे हेब्रोन ले जाओ, जहाँ मेरे पूर्वज भी हैं।”


    **4** यह कहकर वह सो गया[a]। उसके पुत्रों ने वह सब किया जिसकी उसने उन्हें आज्ञा दी थी। उन्होंने उसे हेब्रोन में उसके पूर्वजों के साथ दफ़नाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सो गया” यहाँ मृत्यु के लिए प्रयुक्त प्राचीन शिष्टोक्ति है।
    reason: lexical_alternative
