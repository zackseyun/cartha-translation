- source_word: Φυλάξατε
  choice: पालन करो
  rationale: व्यवस्था के संदर्भ में यह स्वाभाविक हिन्दी है और आज्ञा को सावधानी से मानने का भाव व्यक्त करती है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: पारिवारिक संबोधन को सीधे और समावेशी रूप में रखता है; यूनानी शब्द केवल पुत्रों तक सीमित नहीं है।
- source_word: πάντα τὸν νόμον Κυρίου
  choice: प्रभु की सारी व्यवस्था
  rationale: πάντα की समग्रता और νόμος के वाचागत धार्मिक अर्थ, दोनों को बनाए रखता है।
- source_word: κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: उसके मार्गों को सीधा रखते हैं
  rationale: यूनानी क्रिया के सकर्मक अर्थ ‘सीधा करना/सही दिशा देना’ को सामान्यीकृत करके केवल ‘मार्गों पर चलते हैं’ नहीं बनाया गया।
- source_word: ἐλπίς
  choice: आशा
  rationale: उपदेशात्मक और धार्मिक संदर्भ में संज्ञा का सीधा तथा स्वाभाविक अनुवाद।
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: बहुमूल्य वस्त्र पहनाकर
  rationale: दफ़नाने के प्रसंग में हिन्दी मुहावरे के अनुसार वस्त्र से सजाकर दफ़नाने का आशय स्पष्ट करता है।
- source_word: ἀναγάγετε με
  choice: मुझे ... ले जाओ
  rationale: हेब्रोन की ओर शव ले जाने की आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ऊपर ले जाओ’ का भौगोलिक संकेत हिन्दी में अनावश्यक रूप से कठोर लगता।
- source_word: ἐκοιμήθη
  choice: वह सो गया
  rationale: मृत्यु के लिए प्रयुक्त प्राचीन शिष्टोक्ति को बनाए रखता है और वसीयतनामे की शैली सुरक्षित करता है।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पूर्वजों के साथ
  rationale: πατέρες यहाँ कुल-पिताओं अथवा पूर्वजों को दर्शाता है; ‘पिताओं’ की अपेक्षा आधुनिक हिन्दी में ‘पूर्वजों’ अधिक स्पष्ट है।
theological_decisions:
- issue: व्यवस्था-पालन और आशा का संबंध
  choice: आशा को उन लोगों से सीधे जोड़ा गया है जो प्रभु के मार्गों को सीधा रखते हैं।
  alternative: इसे सामान्य नैतिकता अथवा ‘धार्मिकता से चलने’ के रूप में विस्तार देना।
  rationale: उपलब्ध यूनानी पाठ व्यवस्था, आशा और प्रभु के मार्गों के बीच सीधा संबंध रखता है; अनुवाद में अतिरिक्त धार्मिकता-संबंधी पद नहीं जोड़ा गया।
- issue: मृत्यु का वर्णन
  choice: ‘वह सो गया’ शिष्टोक्ति को सुरक्षित रखा गया।
  alternative: ‘वह मर गया।’
  rationale: ἐκοιμήθη मृत्यु का प्रचलित प्राचीन रूपक है और इसका साहित्यिक-धार्मिक तनाव मिटाना उचित नहीं।
- issue: अंग्रेज़ी परामर्श-पाठ की अतिरिक्त समापन सामग्री
  choice: केवल उपलब्ध यूनानी स्रोत के चार पदों का अनुवाद किया गया।
  alternative: अच्छी वृद्धावस्था, पवित्रता में चलने, यहूदा के साथ सुरक्षित रहने और समस्त इस्राएल के सदा के लिए प्रभु के पास इकट्ठा होने वाली पंक्तियाँ जोड़ना।
  rationale: ये कथन दिए गए α-स्तंभ के यूनानी स्रोत में उपस्थित नहीं हैं; स्रोत-आधारित पाठ में इन्हें सम्मिलित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वसीयतनामे के उपदेशात्मक स्वर के अनुकूल रखी गई है। पद-संख्या स्रोत के अनुसार दी गई है। अंग्रेज़ी POB में उपस्थित, पर दिए गए यूनानी पाठ में अनुपस्थित वाक्यों को शामिल नहीं किया गया।
