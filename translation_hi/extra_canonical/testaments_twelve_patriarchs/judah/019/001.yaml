  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: मेरे बच्चो
  rationale: प्रत्यक्ष संबोधन और आत्मीयता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡ φιλαργυρία
  choice: धन का लोभ
  rationale: शाब्दिक अर्थ ‘चाँदी/धन से प्रेम’ है; ‘धन का लोभ’ आधुनिक हिन्दी में इसके नकारात्मक नैतिक भाव को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: πρὸς εἰδωλολατρίαν
  choice: मूर्तिपूजा की ओर
  rationale: πρός यहाँ दिशा या परिणति दर्शाता है; ‘की ओर’ इस संबंध को बिना अनावश्यक रूप से पूर्ण समानता ठहराए सुरक्षित रखता है।
- source_word: ὁδηγεῖ
  choice: ले जाता है
  rationale: क्रिया के मार्गदर्शन अथवा किसी परिणाम की ओर पहुँचाने के अर्थ का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: धन-लोभ और मूर्तिपूजा का संबंध
  choice: ‘मूर्तिपूजा की ओर ले जाता है’
  alternative: ‘मूर्तिपूजा है’
  rationale: यूनानी पाठ दोनों को समान घोषित नहीं करता, बल्कि धन के लोभ को मूर्तिपूजा की दिशा में ले जाने वाला बताता है; अनुवाद उसी वैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। संबोधन के लिए मानक सम्बोधन रूप ‘बच्चो’ और φιλαργυρία के लिए सामान्य पाठक को सहज ‘धन का लोभ’ चुना गया है।
