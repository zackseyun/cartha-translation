  text: 'These two things turn away a man''s mind[a]. For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.


    Such is the wine-drinker, my children, because the one who gets drunk has regard for no one. For see, it also led me astray, so that I was not ashamed before the multitude of the city. In the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.


    After drinking wine, I was not ashamed of the commandment of God, and I took a Canaanite woman. For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink. But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and feel no shame[c][b], but even boast in his dishonor and think it good.'
translation:
  language: hi
  text: '14:1 और अब, मेरे बच्चो, मैं तुमसे कहता हूँ: दाखरस पीकर मतवाले न हो, क्योंकि दाखरस मन को सत्य से भटका देता है, उसमें वासना का उग्र क्रोध भर देता है और आँखों को भ्रम की ओर ले जाता है। 2 क्योंकि यौन-अनैतिकता की आत्मा मन के सुख के लिए दाखरस को अपना सेवक बनाती है; निश्चय ही ये दोनों मनुष्य की बुद्धि को फेर देते हैं। 3 यदि कोई मतवाला होने तक दाखरस पीता है, तो वह तुम्हारे मन को गंदे विचारों से व्याकुल कर देता है और शरीर को यौन-अनैतिकता के सुख के लिए भड़का देता है; और वह पाप करता है और लज्जित नहीं होता।


    4 मेरे बच्चो, दाखरस पीनेवाला ऐसा ही होता है, क्योंकि जो मतवाला हो जाता है वह किसी का लिहाज़ नहीं करता। 5 देखो, दाखरस ने मुझे भी ऐसा भटका दिया कि मैं नगर की भीड़ के सामने लज्जित न हुआ। सबकी आँखों के सामने मैं तामार की ओर मुड़ गया, मैंने बड़ा पाप किया और अपने पुत्रों की अशुद्धता का परदा खोल दिया।[a] 6 दाखरस पीने के बाद परमेश्वर की आज्ञा का अनादर करने में मुझे लज्जा न हुई, और मैंने एक कनानी स्त्री को पत्नी बना लिया।


    7 मेरे बच्चो, दाखरस पीनेवाले को बहुत समझ की आवश्यकता होती है। दाखरस पीने की समझ यही है: जब तक उसमें लज्जा हो, वह पिए।[b] 8 पर यदि वह सीमा पार कर जाए, तो भ्रम की आत्मा[c] उसके मन में प्रवेश करती है और मतवाले को अशोभनीय बातें बोलने और अधर्म करने पर उकसाती है। वह लज्जित नहीं होता, बल्कि अपने अपमान पर घमंड करता है और उसे अच्छा समझता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपने पुत्रों की लज्जाजनक अशुद्धता को प्रकट कर दिया।” यूनानी वाक्यांश कठिन है; इसका आशय यह हो सकता है कि तामार के साथ यहूदा के पाप के कारण परिवार की अशुद्धता खुलकर सामने आ गई।
    reason: lexical_alternative
  - marker: b
    text: “जब तक उसमें लज्जा हो, वह पिए” वाली भाषा संयम को बचे हुए आत्मनियंत्रण के रूप में प्रस्तुत करती है। आशय यह है कि लज्जा और संकोच मिट जाने पर मतवालापन उस पर हावी हो चुका है।
    reason: cultural_note
  - marker: c
    text: या, “भटकाव की आत्मा।” मूल अभिव्यक्ति यह तय नहीं करती कि इसे किसी अलग आत्मिक सत्ता के रूप में समझा जाए या भ्रम पैदा करनेवाले प्रभाव के रूप में।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: मन को सत्य से भटका देता है
  rationale: διαστρέφει में विकृत करने और सही दिशा से फेरने, दोनों का भाव है; सहज हिन्दी में नैतिक भटकाव को स्पष्ट रखते हुए सत्य से दूरी भी सुरक्षित रहती है।
- source_word: ὀργὴν ἐπιθυμίας
  choice: वासना का उग्र आवेग
  rationale: असामान्य यूनानी संयोग में ὀργή की तीव्रता और ἐπιθυμία की लालसा दोनों हैं। यह अनुवाद उसे केवल ‘क्रोध’ या केवल ‘इच्छा’ बनाकर सीमित नहीं करता।
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: व्यभिचार की आत्मा
  rationale: πνεῦμα की व्यक्तिकृत भाषा और πορνεία का यौन-अनैतिकता संबंधी नैतिक बल बनाए रखा गया है।
- source_word: συνταράσσει
  choice: उथल-पुथल मचा देता है
  rationale: संयुक्त क्रिया मन को तीव्र रूप से अस्त-व्यस्त करने का चित्र देती है; यह हिन्दी उसी प्रबलता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: πάροινος
  choice: दाखमधु के वश में रहनेवाला
  rationale: यह शब्द केवल किसी अवसर पर पीनेवाले के बजाय मदिरा से चरित्रगत रूप से प्रभावित व्यक्ति का संकेत देता है; अगले वाक्य के ‘मतवाला’ से भेद भी बना रहता है।
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: किसी का लिहाज़ नहीं करता
  rationale: यह मुहावरा सामाजिक और नैतिक संकोच के लोप को व्यक्त करता है; ‘लिहाज़’ आधुनिक हिन्दी में दोनों पहलुओं को समेटता है।
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: अपने पुत्रों की अशुद्धता का परदा खोल दिया
  rationale: कठिन और रूपकात्मक यूनानी वाक्यांश में ‘खोलना’, ‘परदा’, ‘अशुद्धता’ और ‘पुत्रों’ के संबंध को बिना निर्णायक व्याख्या थोपे सुरक्षित रखा गया है।
- source_word: σύνεσις τῆς οἰνοποσίας
  choice: दाखमधु पीने की समझ
  rationale: σύνεσις यहाँ विवेकपूर्ण आत्मसंयम का संकेत देती है; सरल ‘समझ’ उपदेशात्मक लहजे में स्वाभाविक है और कथन की असहज नैतिक धार को नरम नहीं करती।
- source_word: αἰσχρορρημονεῖν
  choice: लज्जाजनक बातें कहलवाती
  rationale: क्रिया अशोभनीय या शर्मनाक वाणी बोलने को दर्शाती है; कारणवाचक रचना ποιεῖ के व्याकरणिक संबंध को भी बनाए रखती है।
- source_word: παρανομεῖν
  choice: अधर्म करवाती है
  rationale: शब्द नियम या व्यवस्था के विरुद्ध आचरण का बोध देता है; ‘अधर्म’ धार्मिक-नैतिक संदर्भ में सुबोध और गरिमापूर्ण है।
theological_decisions:
- issue: πνεῦμα τῆς πλάνης को कितना व्यक्तिकृत रखा जाए
  choice: मुख्य पाठ में ‘भ्रम की आत्मा’
  alternative: ‘भटकाव की प्रवृत्ति’ या निश्चित रूप से ‘वह दुष्ट आत्मा’
  rationale: मूल में πνεῦμα स्पष्ट है, इसलिए व्यक्तिकरण रखा गया; पर पाठ जितना कहता है उससे आगे बढ़कर इसकी पहचान या सत्ता-श्रेणी निर्धारित नहीं की गई।
- issue: व्यभिचार की आत्मा और दाखमधु के संबंध का चित्र
  choice: ‘दाखमधु को अपना सेवक बनाती है’
  alternative: इसे केवल मनोवैज्ञानिक प्रभाव के रूप में निरूपित करना
  rationale: मूल का διάκονον वाला व्यक्तिकृत रूपक सुरक्षित रखा गया है और उसे किसी विशिष्ट दानवशास्त्रीय सिद्धांत में नहीं बदला गया।
- issue: तामार संबंधी स्वीकारोक्ति में पुत्रों की अशुद्धता के परदे का अर्थ
  choice: रूपक को निकट और कुछ हद तक अस्पष्ट रखा गया
  alternative: इसे स्पष्ट रूप से पारिवारिक कलंक, यौन अनावरण या पुत्रों की लज्जा कहना
  rationale: यूनानी वाक्यांश कठिन है और अनेक संबंध संभव हैं; अनुवाद किसी एक धर्मवैचारिक या कथात्मक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाता।
- issue: ‘जब तक लज्जा बाकी हो, तभी तक पिए’ का नैतिक आशय
  choice: मूल की संयम-संबंधी शर्त को ज्यों का त्यों रखा गया
  alternative: इसे पूर्ण मद्यनिषेध की आज्ञा के रूप में पुनर्लेखित करना
  rationale: अध्याय का आरंभ मतवाला न होने की आज्ञा देता है, जबकि पद 7 सीमा और बची हुई लज्जा की भाषा बोलता है। इस तनाव को किसी सांप्रदायिक निष्कर्ष से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘दाखमधु’, ‘मतवाला’, ‘लिहाज़’, ‘व्यभिचार’ और ‘अधर्म’ जैसे शब्द उपदेशात्मक प्राचीन संदर्भ तथा वर्तमान पठनीयता के बीच संतुलन रखते हैं। कठिन रूपकों और आत्मा-संबंधी भाषा को व्याख्यात्मक रूप से सपाट नहीं किया गया।
