  language: hi
  text: '1 अगले दिन हमें बताया गया कि गास नगर का राजा एक बड़ी सेना के साथ हमारी ओर आ रहा है।


    2 तब मैं और दान एमोरियों के पास गए और उनके सहयोगी होने का ढोंग करके उनके नगर में घुस गए।


    3 गहरी रात में मेरे भाई हमारे पास आए। हमने उनके लिए फाटक खोल दिए, और उन सबका संहार किया और लूटपाट की।


    4 फिर हम ताम्ना के निकट पहुँचे, जहाँ शत्रु राजाओं का सारा सामान था।


    5 तब उनके द्वारा अपमानित होकर मुझे क्रोध आ गया, और मैं चोटी पर उनकी ओर झपटा। वे मुझ पर गोफन से पत्थर चलाते और तीर बरसाते रहे।


    6 यदि मेरे भाई दान ने मेरे साथ मिलकर युद्ध न किया होता,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λαῷ πολλῷ
  choice: एक बड़ी सेना के साथ
  rationale: λαός का सामान्य अर्थ ‘लोग’ है, पर राजा के आक्रमण के सैन्य प्रसंग में यह सशस्त्र जनसमूह या सेना को दर्शाता है।
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: उनके सहयोगी होने का ढोंग करके
  rationale: यूनानी वाक्य में यह एमोरी होने का नहीं, बल्कि एमोरियों के सहयोगी होने का दिखावा है।
- source_word: Νυκτὸς βαθείας
  choice: आधी रात के बाद
  rationale: शाब्दिक भाव ‘गहरी रात’ है; आधुनिक हिन्दी में रात के बहुत आगे बढ़ चुकने का स्वाभाविक संकेत दिया गया है।
- source_word: ἐξωλοθρεύσαμεν
  choice: नाश करके
  rationale: यह क्रिया पूर्ण विनाश का प्रबल अर्थ रखती है; उसे नरम नहीं किया गया।
- source_word: ἐπρονομεύσαμεν
  choice: नगर को लूट लिया
  rationale: क्रिया का अर्थ लूटना है। कर्म मूल पाठ में व्यक्त नहीं है, इसलिए हिन्दी में प्रसंगगत ‘नगर’ जोड़ा गया, बिना अंग्रेज़ी परत की अतिरिक्त सामग्री ग्रहण किए।
- source_word: ἀποσκευή
  choice: सारा सामान
  rationale: सैन्य प्रसंग में यह सामान, रसद या बोझा हो सकता है; व्यापक और सहज ‘सामान’ मूल की सीमा बनाए रखता है।
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς ἐπὶ τὴν κορυφήν
  choice: मैं उनकी ओर चोटी तक चढ़ दौड़ा
  rationale: आक्रमण की तीव्रता और κορυφήν की ऊँचाई—दोनों को हिन्दी में सुरक्षित रखा गया है।
- source_word: ἐσφενδόνιζον με ἐν λίθοις καὶ τοξεύοντες
  choice: मुझ पर गोफन से पत्थर चलाते और तीर बरसाते रहे
  rationale: अपूर्णकाल निरंतर आक्रमण दिखाता है; ‘रहे’ उसी प्रवाह को व्यक्त करता है।
theological_decisions:
- issue: हिंसक वर्णन की तीव्रता
  choice: ‘उन सबका नाश’ को स्पष्ट रूप से रखा गया
  alternative: नरम अभिव्यक्ति, जैसे ‘उन्हें हरा दिया’
  rationale: मूल यूनानी पूर्ण विनाश कहता है; नैतिक या धर्मवैचारिक असुविधा के कारण कथन को हल्का करना उचित नहीं।
- issue: अंग्रेज़ी परामर्श-पाठ में पद 3 की अतिरिक्त सामग्री
  choice: केवल यूनानी स्रोत में उपस्थित विनाश और लूट का अनुवाद किया गया
  alternative: ‘उनका सब कुछ’, ‘सब कुछ लूटने’ और ‘तीन दीवारें ढा देने’ की सामग्री जोड़ना
  rationale: प्रदत्त यूनानी स्रोत में तीन दीवारों या विस्तृत कर्मों का पाठ नहीं है; इसलिए अंग्रेज़ी परत की असमर्थित वृद्धि को ग्रहण नहीं किया गया।
- issue: पद 4 में शत्रु राजाओं का उल्लेख
  choice: ‘शत्रु राजाओं’ को शामिल किया गया
  alternative: केवल ‘उनका सामान’
  rationale: τῶν πολεμίων βασιλέων मूल यूनानी में स्पष्ट रूप से उपस्थित है और इसे हटाना अर्थ-संकुचन होता।
- issue: पद 6 का अधूरा शर्त-वाक्य
  choice: अल्पविराम के साथ अधूरा ही रखा गया
  alternative: परिणाम-वाक्य अनुमान से पूरा करना
  rationale: प्रदत्त स्रोत इसी स्थान पर अपूर्ण है; अनुवाद में अनुमानित निष्कर्ष जोड़ना मूल की सीमा से बाहर होता।
