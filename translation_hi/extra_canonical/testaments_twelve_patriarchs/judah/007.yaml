  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। वाक्य सामान्य पाठक के लिए सहज हैं, पर युद्ध-वर्णन की कठोरता और पद 6 की अपूर्णता को छिपाया नहीं गया। नामों को ‘गास’, ‘दान’, ‘एमोरी’ और ‘ताम्ना’ रूप में लिप्यंतरित किया गया है।
