  text: Τὰς θυγατέρας ὑμῶν μουσικὰς καὶ δημοσίας¹² ποιήσετε¹³, *καὶ ἐπιμιγήσεσθε¹⁴ ἐν βδελύγμασι ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/002.yaml
  text: You will make your daughters musicians and public women, and you will mingle with the abominations of the nations.
translation:
  language: hi
  text: तुम अपनी बेटियों को संगीतकार स्त्रियाँ और सार्वजनिक स्त्रियाँ[a] बनाओगे, और तुम अन्यजातियों के घृणित कामों में घुल-मिल जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सार्वजनिक स्त्रियाँ” का अर्थ संभवतः ऐसी स्त्रियाँ है जिन्हें यौन प्रयोजनों के लिए सार्वजनिक रूप से उपलब्ध कराया गया हो; यूनानी अभिव्यक्ति संक्षिप्त और कुछ हद तक अस्पष्ट है।
    reason: δημοσίας के संभावित यौन आशय को स्पष्ट करता है, पर मुख्य पाठ में उससे अधिक निश्चित अर्थ आरोपित नहीं करता।
lexical_decisions:
- source_word: μουσικὰς
  choice: गायिका
  rationale: यह शब्द संगीत-कला से जुड़ी स्त्रियों को सूचित करता है। प्रसंग में स्वाभाविक और सामान्य हिन्दी के लिए “गायिका” चुना गया, यद्यपि अर्थ अधिक व्यापक रूप से संगीत करने वाली स्त्रियाँ भी हो सकता है।
- source_word: δημοσίας
  choice: सार्वजनिक स्त्रियाँ
  rationale: यूनानी विशेषण का शाब्दिक अर्थ “सार्वजनिक” है; स्त्रीलिंग बहुवचन में इसका आशय अस्पष्ट तथा संभवतः यौन अनैतिकता से जुड़ा है। मुख्य पाठ में इस असहज लेकिन अर्थपूर्ण अभिव्यक्ति को सुरक्षित रखा गया और पाद-टिप्पणी में संभावित आशय बताया गया।
- source_word: ἐπιμιγήσεσθε
  choice: सहभागी हो जाओगे
  rationale: क्रिया का मूल भाव दूसरों के साथ घुलने-मिलने या सम्मिलित होने का है। यहाँ घृणित कामों के साथ संलग्नता व्यक्त करने के लिए “सहभागी” स्वाभाविक है और केवल सामाजिक मेल-जोल तक अर्थ को सीमित नहीं करता।
- source_word: βδελύγμασι ἐθνῶν
  choice: अन्यजातियों के घृणित कामों
  rationale: βδέλυγμα उस वस्तु या आचरण को दर्शाता है जो घृणित है। बहुवचन को हिन्दी में स्पष्ट करने के लिए “घृणित कामों” कहा गया; ἐθνῶν के लिए बाइबलीय किन्तु सामान्यतः बोधगम्य “अन्यजातियों” रखा गया।
theological_decisions:
- issue: “सार्वजनिक स्त्रियाँ” का संभावित यौन आशय
  choice: मुख्य पाठ में शाब्दिक अस्पष्टता बनाए रखी गई और पाद-टिप्पणी दी गई।
  alternative: “वेश्याएँ” या “सबके लिए उपलब्ध स्त्रियाँ”
  rationale: δημοσίας अपने आप में सीधे और निर्विवाद रूप से “वेश्याएँ” नहीं कहता। अधिक स्पष्ट अनुवाद संभावित निहितार्थ को निश्चित अर्थ बना देता, इसलिए मूल की अस्पष्टता और नैतिक तनाव सुरक्षित रखा गया।
- issue: ἐν βδελύγμασι के संबंध का स्वरूप
  choice: “घृणित कामों में सहभागी”
  alternative: “घृणित कामों के साथ घुल-मिल”
  rationale: यह चयन संलग्नता को स्पष्ट करता है, पर किसी विशिष्ट धार्मिक या नैतिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, चेतावनीपूर्ण और सीधा भविष्यकाल रखा गया है। “सार्वजनिक स्त्रियाँ” जानबूझकर कुछ असहज है, क्योंकि यूनानी मूल भी संक्षिप्त और अर्थगत रूप से तनावपूर्ण है; पाद-टिप्पणी सामान्य पाठक के लिए संभावित आशय स्पष्ट करती है।
