source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*ἕως τῆς¹¹ παρουσίας Θεοῦ¹² τῆς δικαιοσύνης¹³, *τοῦ ἡσυχάσαι τὸν¹⁴ Ἰακὼβ¹⁵ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη¹⁴. 3. Καὶ αὐτὸς φυλάξει κράτος¹⁵ τῆς βασιλείας μου¹⁶ ἕως¹⁷ αἰῶνος¹⁸· ὅρκῳ γὰρ ὤμοσέ¹⁹ μοι Κύριος μὴ ἐξαλείψειν²⁰ τὸ βασίλειον ἐκ τοῦ σπέρματός μου ἕως αἰῶνος²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/001.yaml
  text: Until the coming of the God of righteousness, to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me by an oath not to blot out the kingdom. Much grief is mine, my children, because of the sexual immoralities and sorceries that you will do in the kingdom, following ventriloquists, omens, and deceiving demons.
translation:
  language: hi
  text: धार्मिकता के परमेश्वर के आगमन तक, ताकि याकूब और सब राष्ट्रों को शान्ति में विश्राम मिले। और वह मेरे राज्य की सामर्थ्य को सदा बनाए रखेगा; क्योंकि प्रभु ने मुझसे शपथपूर्वक प्रतिज्ञा की कि वह राज्य को मेरे वंश में से सदा के लिए नहीं मिटाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσίας
  choice: आगमन
  rationale: यह शब्द उपस्थित होने या आने का भाव रखता है; यहाँ भावी घटना के संदर्भ में ‘आगमन’ स्वाभाविक और सटीक है।
- source_word: Θεοῦ τῆς δικαιοσύνης
  choice: धार्मिकता के परमेश्वर
  rationale: यूनानी संबंधवाचक संरचना को जानबूझकर खुला रखते हुए शाब्दिक तनाव सुरक्षित रखा गया है; इसे ‘धर्मी परमेश्वर’ बनाकर अर्थ सीमित नहीं किया गया।
- source_word: ἡσυχάσαι
  choice: विश्राम मिले
  rationale: यहाँ शांत होने या विश्राम पाने का भाव है; ‘शान्ति में विश्राम’ निकटवर्ती ἐν εἰρήνῃ के साथ स्वाभाविक हिन्दी देता है।
- source_word: φυλάξει κράτος
  choice: सामर्थ्य को ... बनाए रखेगा
  rationale: φυλάσσω का संरक्षण और κράτος का सामर्थ्य/प्रभुत्व संबंधी भाव साथ रखा गया है।
- source_word: σπέρματός μου
  choice: मेरे वंश
  rationale: शाब्दिक ‘बीज’ के बजाय वंशगत राजसत्ता के प्रसंग में सामान्य और सुस्पष्ट हिन्दी चुनी गई।
- source_word: ἐξαλείψειν
  choice: मिटाएगा
  rationale: क्रिया का मूल भाव मिटा देने या लोप कर देने का है; राज्य के संदर्भ में ‘मिटाना’ उपयुक्त है।
theological_decisions:
- issue: ‘वह’ (αὐτός) का संदर्भ
  choice: सर्वनाम ‘वह’ को बनाए रखा गया
  alternative: इसे स्पष्ट रूप से ‘परमेश्वर’ या किसी भावी शासक के रूप में पहचानना
  rationale: दिए गए यूनानी अंश में सर्वनाम का संदर्भ पूर्णतः स्पष्ट नहीं है; किसी विशिष्ट पहचान को जोड़ना पाठ की वास्तविक अस्पष्टता मिटा देता।
- issue: Θεοῦ τῆς δικαιοσύνης की व्याख्या
  choice: ‘धार्मिकता के परमेश्वर’
  alternative: ‘धर्मी परमेश्वर’ या ‘न्याय के परमेश्वर’
  rationale: संबंधवाचक पदबंध का रूप सुरक्षित रखा गया है और धार्मिकता को केवल गुणविशेष में नहीं बदला गया।
- issue: राज्य की वंशगत निरंतरता
  choice: ‘मेरे वंश से राज्य को ... नहीं मिटाएगा’
  alternative: ‘मेरे राज्य को ... नहीं मिटाएगा’
  rationale: दिए गए यूनानी पाठ में ἐκ τοῦ σπέρματός μου स्पष्टतः ‘मेरे वंश से’ कहता है; अंग्रेज़ी परामर्श-पाठ में छूटा यह अंश मूल-साक्ष्य के आधार पर शामिल किया गया।
- issue: अंग्रेज़ी परामर्श-पाठ का अतिरिक्त दुःख और कुकर्मों वाला वाक्य
  choice: शामिल नहीं किया गया
  alternative: अंग्रेज़ी पाठ के अनुसार जोड़ना
  rationale: यह वाक्य उपलब्ध कराए गए यूनानी स्रोत-अंश में नहीं है; स्रोत-साक्ष्य के बिना इसे मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-समीप शैली रखी गई है। ‘शान्ति’, ‘धार्मिकता’, ‘वंश’ और ‘शपथ’ जैसे परिचित धार्मिक-साहित्यिक शब्द सामान्य पाठक के लिए बोधगम्य हैं। उपलब्ध यूनानी पाठ और निर्दिष्ट पद-संदर्भ/अंग्रेज़ी परामर्श-पाठ के बीच सामग्री-असंगति है; इसलिए मसौदा केवल उपलब्ध यूनानी साक्ष्य का अनुवाद करता है।
