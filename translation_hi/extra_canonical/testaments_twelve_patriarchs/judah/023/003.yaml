source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἀνθ᾽ ὧν ἐπάξει²⁵ Κύριος ἐφ᾽ ὑμᾶς²⁶ λιμὸν καὶ λοιμόν¹⁹, θάνατον καὶ ῥομφαίαν, ἐκδικοῦσαν²⁰, πολιορκίαν, καὶ κύνας εἰς διασπασμόν²⁰, καὶ ἐχθρῶν ὀνειδισμοὺς²², καὶ ἀπώλειαν²² ἐχθρῶν, καὶ²⁴ σφακελισμὸν *ὀφθαλμῶν²⁴, καὶ νηπίων ἀναιρέσεις²⁵, *ὑπαρχόντων ἁρπαγὴν²⁶, ναῶν θεοῦ ἐμπρησμόν²⁹, γῆς ἐρήμωσιν²⁹, ὑμῶν δὲ αὐτῶν³⁰ δουλείαν ἐν ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/003.yaml
  text: Because of these things the Lord will bring upon you famine and pestilence, death and the avenging sword, siege, and the reproaches of enemies and friends. By foreigners my kingdom will be brought to an end.
translation:
  language: hi
  text: इन बातों के कारण प्रभु तुम पर अकाल और महामारी, मृत्यु और प्रतिशोध लेनेवाली तलवार, घेराबंदी, तुम्हें फाड़ डालने के लिए कुत्ते, शत्रुओं के ताने, शत्रुओं का विनाश[a], आँखों का सड़ जाना, शिशुओं की हत्या, संपत्ति की लूट, परमेश्वर के मंदिरों को आग लगाकर जलाया जाना, भूमि का उजड़ना, और स्वयं तुम्हारी अन्यजातियों के बीच दासता लाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शत्रुओं का विनाश” का अर्थ “शत्रुओं द्वारा किया गया विनाश” भी हो सकता है।
    reason: यूनानी संबंधकारक ἐχθρῶν को वस्तुगत या कर्तृवाचक, दोनों प्रकार से समझा जा सकता है; सूची के संदर्भ में दूसरा अर्थ भी संभावित है।
lexical_decisions:
- source_word: Ἀνθ᾽ ὧν
  choice: इन बातों के कारण
  rationale: पूर्ववर्ती अपराधों या घटनाओं की ओर संकेत करनेवाले कारणसूचक वाक्यांश का स्वाभाविक हिन्दी रूप।
- source_word: λοιμόν
  choice: महामारी
  rationale: व्यापक घातक संक्रामक विपत्ति के सामान्य अर्थ को आधुनिक और सुबोध हिन्दी में व्यक्त करता है।
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: बदला लेनेवाली तलवार
  rationale: स्त्रीलिंग कृदंत ἐκδικοῦσαν का संबंध ῥομφαίαν से है; तलवार को दंड या प्रतिशोध देनेवाली शक्ति के रूप में बनाए रखा गया है।
- source_word: κύνας εἰς διασπασμόν
  choice: तुम्हें नोच डालने के लिए कुत्ते
  rationale: διασπασμός के फाड़ने या अंग-अंग कर देने के तीखे बिंब को स्पष्ट, प्राकृतिक हिन्दी में सुरक्षित रखता है; संदर्भ से कर्म 'तुम्हें' ग्रहण किया गया है।
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: आँखों का सड़ जाना
  rationale: σφακελισμός ऊतक के गलने, सड़ने या गैंग्रीन होने को दर्शाता है; साधारण पाठक के लिए चिकित्सकीय शब्द 'गैंग्रीन' से अधिक बोधगम्य रूप चुना गया है।
- source_word: νηπίων ἀναιρέσεις
  choice: शिशुओं की हत्या
  rationale: ἀναίρεσις यहाँ हिंसक प्राणहरण है और νήπια छोटे बच्चों या शिशुओं को सूचित करता है।
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: संपत्ति की लूट
  rationale: ὑπάρχοντα का संज्ञात्मक प्रयोग possessions के अर्थ में और ἁρπαγή हिंसक छीनने या लूट को दर्शाता है।
- source_word: ναῶν θεοῦ ἐμπρησμόν
  choice: परमेश्वर के मंदिरों को आग लगाया जाना
  rationale: मूल के बहुवचन ναῶν और आग लगाकर नष्ट करने के अर्थ वाले ἐμπρησμός दोनों को बनाए रखता है।
- source_word: ὑμῶν δὲ αὐτῶν δουλείαν ἐν ἔθνεσι
  choice: स्वयं तुम्हारी अन्यजातियों के बीच दासता
  rationale: αὐτῶν का बलाघात 'स्वयं तुम्हारी' से और δουλεία की कठोर सामाजिक दशा 'दासता' से व्यक्त की गई है; ἔθνεσι के लिए यहूदी संदर्भानुकूल 'अन्यजातियों' चुना गया है।
theological_decisions:
- issue: दंड के कर्ता के रूप में प्रभु
  choice: प्रभु ... लाएगा
  alternative: ये विपत्तियाँ तुम पर आएँगी
  rationale: ἐπάξει का स्पष्ट कर्ता Κύριος है; न्याय-संबंधी तनाव को निष्क्रिय भाषा से नरम नहीं किया गया।
- issue: ἐχθρῶν के साथ ἀπώλειαν का संबंध
  choice: शत्रुओं का विनाश
  alternative: शत्रुओं द्वारा विनाश
  rationale: सामान्य व्याकरण के अनुसार संबंधकारक को पहले वस्तुगत अर्थ में लिया गया है, पर प्रसंग में कर्तृवाचक अर्थ संभव होने के कारण अस्पष्टता को पादटिप्पणी में दर्ज किया गया है।
- issue: English POB की संक्षिप्त और भिन्न पाठ-सामग्री
  choice: दिए गए यूनानी स्रोत की पूरी सूची का अनुवाद
  alternative: अंग्रेज़ी POB के अनुसार संक्षिप्त पाठ, जिसमें मित्रों के ताने और राज्य का अंत है
  rationale: प्राथमिक आधार मूल-भाषा स्रोत है। प्रस्तुत यूनानी में 'मित्र', 'मेरा राज्य' या 'विदेशियों द्वारा अंत' नहीं है, जबकि उसमें कई अतिरिक्त विपत्तियाँ स्पष्ट रूप से मौजूद हैं; अतः अंग्रेज़ी परामर्श-पाठ को मूल पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गंभीर और गरिमापूर्ण रखी गई है। विपत्तियों की संचयी सूची और उसके कठोर बिंब सुरक्षित हैं। अत्यधिक संस्कृतनिष्ठ विकल्पों से बचते हुए ‘घेराबंदी’, ‘दासता’ और ‘अन्यजातियाँ’ जैसे प्रचलित धार्मिक-साहित्यिक शब्द प्रयोग किए गए हैं।
