  terminology: नामों के रूप अरेता, गाद, रूबेन, लेवी और बाबुए यथावत रखे गए हैं। αἰχμαλωσία के लिए ‘बंदी’/‘बंदियों’ संदर्भानुकूल है, जबकि पादटिप्पणी उसके व्यापक सामूहिक अर्थ की संभावना स्पष्ट करती है। ‘तलवार की धार’ और ‘मीनार में शरण’ उपयुक्त हैं।
