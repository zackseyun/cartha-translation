  revised_text: 'यहूदा का वसीयतनामा 5


    1. अगले दिन हम अरेता गए। वह एक शक्तिशाली नगर था, जो हमें मार डालने की धमकी दे रहा था। मैं और गाद ने नगर के पूर्व की ओर से आक्रमण किया, और रूबेन और लेवी ने पश्चिम की ओर से।


    2. दीवार पर तैनात लोगों ने जब समझा कि हम अकेले हैं, तो वे हमारी ओर खिंचे चले आए।


    3. तब दीवार उछल उठी।[a]


    4. इस प्रकार मेरे भाई चुपके से दीवार के दोनों ओर से नगर में घुस गए।


    5. हमने तलवार की धार से नगर को अपने अधिकार में कर लिया। जिन्होंने मीनार में शरण ली थी, उन्हें हमने आग में जला दिया। इस प्रकार हमने उन सभी को और उनकी सारी संपत्ति को अपने अधिकार में कर लिया।


    6. जब हम वहाँ से जा रहे थे, तब बाबुए[b] के लोगों ने हमारे बंदियों[c] को पकड़ लिया। यह देखकर हमने उनसे युद्ध छेड़ दिया।


    7. हमने उन सबको मार डाला और अपने बंदियों को फिर से छुड़ा लिया।'
