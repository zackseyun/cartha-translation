  text: 1[a]. And on the next day we went to Areta, a city still mighty and strong, threatening us with death. 2. But I and Gad attacked from the east of the city, and Reuben and Levi from the west. 3. And those on the wall, thinking that we were alone[b], were drawn out toward us. 4. So my brothers secretly, from both sides of the wall, climbed it with stakes and entered the city without their knowing it. 5. And we took it by the edge of the sword, and those who had fled for refuge in the towers we burned with fire; and so we captured them all. 6. And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue. 7. And we killed them also, and burned the city[c], and everything in it.
translation:
  language: hi
  text: 'यहूदा का वसीयतनामा 5


    1. अगले दिन हम अरेता गए। वह एक शक्तिशाली नगर था, जो हमें मार डालने की धमकी दे रहा था। मैं और गाद ने नगर के पूर्व की ओर से आक्रमण किया, और रूबेन और लेवी ने पश्चिम की ओर से।


    2. दीवार पर तैनात लोगों ने जब समझा कि हम अकेले हैं, तो वे हमारी ओर खिंचे चले आए।


    3. तब दीवार उछल उठी।[a]


    4. इस प्रकार मेरे भाई चुपके से दीवार के दोनों ओर से नगर में घुस गए।


    5. हमने तलवार की धार से नगर को अपने अधिकार में कर लिया। जिन्होंने मीनार में शरण ली थी, उन्हें हमने आग में जला दिया। इस प्रकार हमने उन सभी को और उनकी सारी संपत्ति को अपने अधिकार में कर लिया।


    6. जब हम वहाँ से जा रहे थे, तब बाबुए[b] के लोगों ने हमारे बंदियों[c] को पकड़ लिया। यह देखकर हमने उनसे युद्ध छेड़ दिया।


    7. हमने उन सबको मार डाला और अपने बंदियों को फिर से छुड़ा लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का शाब्दिक अर्थ “दीवार उछल उठी” है और इसका अभिप्राय कठिन है। प्रसंग दीवार पार करके नगर में प्रवेश का संकेत देता है। अन्य पाठ-साक्षी अधिक विस्तार से कहते हैं कि यहूदा के भाई खूंटों या बल्लियों के सहारे दीवार पर चढ़े।
    reason: textual_variant
  - marker: b
    text: 'यूनानी पाठ में इस स्थान-नाम का रूप अनिश्चित चिह्नित है: “बाबुए।” दूसरे पाठ-साक्षियों में अलग नाम मिलते हैं।'
    reason: textual_variant
  - marker: c
    text: यहाँ प्रयुक्त यूनानी शब्द का अर्थ “बंदियों का समूह” हो सकता है; व्यापक अर्थ में यह युद्ध में पकड़े गए लोगों और लूट को भी सूचित कर सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: κραταιάν
  choice: शक्तिशाली
  rationale: प्रस्तुत α-पाठ में एक ही विशेषण है; इसलिए अंग्रेज़ी परामर्श-पाठ के दोहरे ‘mighty and strong’ के बजाय एक स्वाभाविक और अर्थ-सटीक हिन्दी विशेषण रखा गया है।
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: हमें मार डालने की धमकी दे रहा था
  rationale: शाब्दिक ‘हमें मृत्यु की धमकी’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और प्राणघातक धमकी का बल बनाए रखता है।
- source_word: προσέφθημεν
  choice: पहले पहुँच गए
  rationale: यह क्रिया किसी से पहले पहुँचने या अग्रता लेने का भाव देती है। प्रस्तुत पाठ में सीधे ‘आक्रमण किया’ कहना क्रिया के अर्थ को आवश्यकता से अधिक निश्चित करता।
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  choice: हमारी ओर खिंचे चले आए
  rationale: मध्य/निष्क्रिय रूप और πρὸς की दिशात्मकता को बनाए रखते हुए सैन्य युक्ति का संकेत स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: λάθρα
  choice: चुपके से
  rationale: गुप्त और बिना ध्यान खींचे किए गए प्रवेश को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐν στόματι μαχαίρας
  choice: तलवार की धार से
  rationale: यूनानी और सामी युद्ध-वर्णन के मुहावरे का प्रतिष्ठित तथा बोधगम्य हिन्दी समतुल्य है।
- source_word: ἐν τῷ πύργῳ καταφυγόντας
  choice: जिन्होंने मीनार में शरण ली थी
  rationale: एकवचन πύργος और καταφεύγω में निहित शरण लेने, दोनों को सुरक्षित रखा गया है।
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: हमारे बंदियों
  rationale: संदर्भ में अमूर्त ‘बंदीपन’ के बजाय युद्ध में पकड़े गए लोगों का समूह अधिक संभावित है; फिर भी लूट के अर्थ की संभावना पादटिप्पणी में खुली रखी गई है।
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: हमारा उनसे युद्ध छिड़ गया
  rationale: प्रस्तुत यूनानी में कर्ता-संबंध व्याकरणिक रूप से कठिन है। यह हिन्दी रूप किसी अनिश्चित कर्ता को थोपे बिना युद्ध आरम्भ होने का आशय देता है।
theological_decisions:
- issue: पद 3 में कठिन यूनानी वाक्यांश ἀνεπήδησεν τὸ τεῖχος
  choice: मुख्य पाठ में ‘तब दीवार लाँघी गई’ रखा गया और कठिनाई को पादटिप्पणी में बताया गया।
  alternative: अत्यंत शाब्दिक रूप ‘दीवार उछल उठी’; अथवा अन्य पाठ-परंपरा के अनुसार भाइयों का खूंटों के सहारे दीवार चढ़ना।
  rationale: प्रस्तुत α-पाठ का व्याकरण संदिग्ध है। प्रसंग दीवार पार करके नगर में प्रवेश का संकेत देता है, पर दूसरे साक्षियों का विस्तृत वर्णन चुपचाप मुख्य पाठ में आयात नहीं किया गया।
- issue: पद 6–7 की घटनाओं का रूप
  choice: प्रस्तुत यूनानी के अनुसार बाबुए के लोगों ने बंदियों को पकड़ा, युद्ध हुआ, और बंदी फिर छुड़ा लिए गए।
  alternative: 'अंग्रेज़ी परामर्श-पाठ का विस्तृत रूप: बंदियों को पुत्रों को सौंपना, तप्फुए तक युद्ध करना, नगर जलाना।'
  rationale: ये अतिरिक्त बातें दिए गए α-पाठ में नहीं हैं। मूल-भाषा स्रोत को प्राथमिकता देते हुए उन्हें हिन्दी मुख्य पाठ में शामिल नहीं किया गया।
- issue: αἰχμαλωσία का संदर्भगत अर्थ
  choice: बंदियों का समूह
  alternative: युद्ध की लूट अथवा समूची बंदी-संपत्ति
  rationale: व्यक्तियों पर केंद्रित अर्थ प्रसंग में सहज है, लेकिन संज्ञा सामूहिक युद्ध-लूट का व्यापक अर्थ भी रख सकती है; इसलिए संभावना पादटिप्पणी में दर्ज है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। ‘अपने अधिकार में कर लिया’, ‘शरण ली’ और ‘युद्ध छिड़ गया’ जैसे वाक्यांश सामान्य पाठक के लिए स्पष्ट हैं, जबकि युद्ध-वर्णन की कठोरता को नरम नहीं किया गया। नामों का देवनागरी लिप्यंतरण प्रस्तुत यूनानी रूपों पर आधारित है।
