translation:
  language: hi
  text: दाखरस पीने के बाद, मैं परमेश्वर की आज्ञा से लज्जित नहीं हुआ, और मैंने एक कनानी स्त्री से विवाह कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: दाखमधु पी लेने के बाद
  rationale: Aorist participle को मुख्य क्रिया से पहले पूरी हुई क्रिया के रूप में व्यक्त किया गया है; οἶνος के लिए प्रसंगानुकूल और गरिमापूर्ण ‘दाखमधु’ चुना गया है।
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: मैं परमेश्वर की आज्ञा से लज्जित नहीं हुआ
  rationale: ग्रीक में ‘लज्जित होना’ के साथ ‘परमेश्वर की आज्ञा’ सीधा कर्म है। कथन का अर्थ तनावपूर्ण और कुछ असामान्य है, इसलिए उसे ‘आज्ञा की अवहेलना की’ जैसे स्पष्टार्थक रूप में बदलकर निहित अर्थ तय नहीं किया गया।
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: मैंने एक कनानी स्त्री से विवाह कर लिया
  rationale: पत्नी के रूप में स्त्री ‘लेने’ के सामी-यूनानी मुहावरे को स्वाभाविक आधुनिक हिन्दी में ‘विवाह कर लिया’ कहा गया है।
theological_decisions:
- issue: परमेश्वर की आज्ञा के प्रति यहूदा की प्रतिक्रिया
  choice: ‘आज्ञा से लज्जित नहीं हुआ’ के रूप में मूल की अस्पष्टता बनाए रखी गई
  alternative: ‘परमेश्वर की आज्ञा की अवहेलना की’ या ‘आज्ञा का भय नहीं माना’
  rationale: वैकल्पिक रूप प्रसंग को स्पष्ट कर सकते हैं, पर वे यूनानी पाठ के असामान्य कथन का एक निश्चित नैतिक अर्थ निर्धारित कर देंगे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कनानी स्त्री’ सामान्य बाइबलीय जातिनाम है; वाक्य की मूल theological/semantic tension को जानबूझकर सरल नहीं किया गया।
