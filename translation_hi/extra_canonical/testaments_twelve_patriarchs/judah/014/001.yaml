  register: संक्षिप्त, dignified आधुनिक मानक हिन्दी। ‘भटका देती हैं’ मूल के ‘दूर कर देती हैं’ वाले भाव को सहज रूप देता है और जिस वस्तु से बुद्धि विमुख होती है उसे अनिर्दिष्ट ही रखता है, जैसा यूनानी पाठ में है।
