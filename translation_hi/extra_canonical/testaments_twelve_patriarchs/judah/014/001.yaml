  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/001.yaml
  text: These two things turn a man's mind away.
translation:
  language: hi
  text: क्योंकि ये दोनों बातें मनुष्य की बुद्धि को भटका देती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίγε
  choice: क्योंकि
  rationale: यह कण पिछले कथन के कारण या पुष्टि की ओर संकेत करता है; इस स्वतंत्र पद में स्वाभाविक हिन्दी के लिए ‘क्योंकि’ रखा गया। इसके बलवाचक भाव को अलग शब्द जोड़कर अनावश्यक रूप से नहीं बढ़ाया गया।
- source_word: τὰ δύο ταῦτα
  choice: ये दोनों बातें
  rationale: नपुंसकलिंग बहुवचन अभिव्यक्ति दो पूर्वोक्त विषयों की ओर संकेत करती है; ‘बातें’ सामान्य और संदर्भ-निरपेक्ष है।
- source_word: ἀφιστῶσι
  choice: भटका देती हैं
  rationale: क्रिया का अर्थ दूर करना, विमुख करना या मार्ग से हटाना है। ‘भटका देती हैं’ मन की दिशा बिगाड़ने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना यह तय किए कि वह किस निर्दिष्ट वस्तु से दूर होता है।
- source_word: τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: मनुष्य की बुद्धि
  rationale: διάνοια विचार, समझ और मानसिक विवेक की क्षमता को सूचित करता है; यहाँ ‘बुद्धि’ हिन्दी में इस संज्ञानात्मक भाव को ‘मन’ से अधिक स्पष्ट रखती है। ἄνθρωπος सामान्य मानव के अर्थ में है, इसलिए ‘मनुष्य’ चुना गया।
theological_decisions: []
