  text: '*Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν²⁹ μὴ αἰσχυνθῆναι τὸ πλῆθος³⁰ πόλεως⁴⁹ ὅτι ἐν⁵¹ ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν³² μεγάλην³³, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/004.yaml
  text: For behold, it also led me astray, so that I was not ashamed before the multitude of the city. For in the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.
translation:
  language: hi
  text: देखो, उसने मुझे भी ऐसा भटका दिया कि मैं नगर की भीड़ के सामने लज्जित होने से नहीं शर्माया। क्योंकि सबकी आँखों के सामने मैं तामार की ओर मुड़ गया, मैंने एक बड़ा पाप किया, और अपने पुत्रों की अशुद्धता का आवरण खोल दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने अपने पुत्रों की अशुद्धता का आवरण खोल दिया।” यह असामान्य रूपक संभवतः उनकी अशुद्धता को प्रकट करने का संकेत देता है।
    reason: मूल यूनानी का कठिन, पुनरुक्त रूपक मुख्य पाठ में रखा गया है; टिप्पणी केवल संभावित अर्थ बताती है और उसे निश्चित नहीं करती।
lexical_decisions:
- source_word: ἐπλάνησεν
  choice: उसने मुझे…भटका दिया
  rationale: क्रिया सकर्मक है और किसी पूर्वोक्त कर्ता की ओर संकेत करती है; हिन्दी में सर्वनाम रखकर प्रसंगगत संदर्भ और मूल की अनिश्चितता सुरक्षित रखी गई है।
- source_word: τὸ πλῆθος πόλεως
  choice: नगर की भीड़
  rationale: यह मूल यूनानी पद का संक्षिप्त और स्वाभाविक हिन्दी रूप है; इसे केवल ‘लोगों’ में बदलकर सामूहिकता का भाव कम नहीं किया गया।
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: मैं तामार की ओर मुड़ गया
  rationale: ἐκκλίνω के मार्ग से हटने या दूसरी ओर मुड़ने के नैतिक और दिशात्मक दोनों भावों को बनाए रखता है।
- source_word: ἀνεκάλυψα τὸ κάλυμμα
  choice: आवरण खोल दिया
  rationale: मूल में एक जानबूझकर उभारा गया रूपक है—‘आवरण को अनावृत करना’; हिन्दी में उसका असामान्य किंतु बोधगम्य रूप सुरक्षित रखा गया है।
- source_word: ἀκαθαρσίας
  choice: अशुद्धता
  rationale: यह शब्द नैतिक या लैंगिक अपवित्रता का संकेत दे सकता है; व्यापक अर्थ वाला ‘अशुद्धता’ मूल की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: ‘अपने पुत्रों की अशुद्धता का आवरण खोल दिया’ का आशय
  choice: रूपक को मुख्य पाठ में यथासंभव अक्षुण्ण रखा गया
  alternative: ‘अपने पुत्रों की अशुद्धता प्रकट कर दी’
  rationale: सरल वैकल्पिक रूप अर्थ की व्याख्या कर देता, जबकि यूनानी वाक्यांश स्वयं असामान्य और संभावित रूप से बहुअर्थी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘देखो’ से Ἰδού का बल, ‘सबकी आँखों के सामने’ से सार्वजनिकता, और अंतिम वाक्यांश में मूल का कठिन रूपक सुरक्षित है।
