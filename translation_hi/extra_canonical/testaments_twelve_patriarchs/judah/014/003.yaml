lexical_decisions:
- source_word: πάροινος
  choice: मदिरा पीनेवाला
  rationale: यह शब्द मदिरापान में लिप्त या मदिरा के अधीन रहनेवाले व्यक्ति को दर्शाता है; प्रसंग में स्वाभाविक और स्पष्ट हिंदी अभिव्यक्ति चुनी गई है।
- source_word: ὁ μεθύων
  choice: मतवाला
  rationale: वर्तमान कृदंत का आशय नशे में रहने या धुत होनेवाले व्यक्ति से है; ‘मतवाला’ संक्षिप्त रूप में इस अवस्था को व्यक्त करता है।
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: किसी का लिहाज़ नहीं करता
  rationale: αἰδέομαι में संकोच, आदर या मान रखने का भाव है; यह मुहावरा सामाजिक मर्यादा की परवाह न करने का अर्थ स्वाभाविक हिंदी में देता है।
