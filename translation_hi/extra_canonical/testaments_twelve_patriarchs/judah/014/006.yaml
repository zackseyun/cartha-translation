id: T12P.JUD.14.6
reference: Testament of Judah 14:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πολλὴ⁴⁰ γὰρ⁴¹ τῷ πίνοντι οἶνον⁴², τέκνα μου⁴³, καὶ αὕτη ἐστὶν ἡ σύνεσις⁴⁴ τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ⁴⁵, πίνει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/006.yaml
  text: 'For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink.'
translation:
  language: hi
  text: 'क्योंकि, मेरे बच्चो, दाखमधु पीने वाले को बहुत समझ-बूझ चाहिए; और दाखमधु पीने की समझ-बूझ यही है: जब तक उसे लाज है, वह पीए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में अंतिम क्रिया का शाब्दिक रूप “वह पीता है” है; प्रसंग में इसे “वह पीए,” अर्थात सशर्त अनुमति या निर्देश, के रूप में भी समझा जा सकता है।
    reason: स्रोत के निर्देशवाचक क्रियारूप और प्रसंग से संभव नीति-सूचक अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: σύνεσις
  choice: समझ-बूझ
  rationale: यह शब्द व्यावहारिक समझ और विवेक का भाव देता है; सरल ‘समझ’ की अपेक्षा ‘समझ-बूझ’ यहाँ मदिरापान में आवश्यक संयत निर्णय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἶνος / οἰνοποσία
  choice: दाखमधु / दाखमधु पीना
  rationale: οἶνος अंगूरी मदिरा को सूचित करता है। ‘दाखमधु’ आधुनिक हिन्दी में गरिमापूर्ण और बाइबिलीय संदर्भ के अनुकूल है, जबकि ‘मदिरा’ स्रोत की अंगूर-विशिष्टता को कम कर देती।
- source_word: αἰδώς
  choice: लाज
  rationale: यहाँ शब्द सामाजिक लज्जा, मर्यादा-बोध और आत्मसंयम से जुड़ी संकोचशीलता को व्यक्त करता है। ‘लाज’ सामान्य पाठक के लिए स्वाभाविक है और केवल अपराधबोध का अर्थ नहीं थोपता।
- source_word: πίνει
  choice: वह पीए
  rationale: यूनानी रूप व्याकरणतः वर्तमानकालीन निर्देशवाचक ‘वह पीता है’ है, पर वाक्य की नीति-सूचक संरचना इसे अनुमतिपरक अथवा निर्देशात्मक अर्थ दे सकती है। हिन्दी संभावनार्थक रूप उस प्रसंगगत बल को व्यक्त करता है।
theological_decisions:
- issue: क्या पद दाखमधु पीने की आज्ञा देता है या संयम की सीमा बताता है
  choice: ‘जब तक उसमें लाज बनी रहे, वह पीए’ के रूप में सशर्त अनुमति
  alternative: ‘जब तक उसमें लाज बनी रहती है, वह पीता है’ के रूप में केवल वर्णन
  rationale: प्रसंग मदिरापान के लिए व्यावहारिक नीति प्रस्तुत करता है। फिर भी यूनानी अंतिम क्रिया का शाब्दिक रूप निर्देशवाचक है, इसलिए पाठ में सशर्त-निर्देशात्मक अर्थ रखा गया और व्याकरणिक विकल्प पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन ‘मेरे बच्चो’ सामान्य पारिवारिक शिक्षा का स्वर बनाए रखता है। पहले खंड में यूनानी में निहित पद को अगले खंड के σύνεσις के आधार पर ‘समझ-बूझ चाहिए’ के रूप में स्वाभाविक हिन्दी में पूरा किया गया है।
