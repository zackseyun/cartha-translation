id: T12P.JUD.14.7
reference: Testament of Judah 14:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ⁴⁶ τὸν ὅρον, ἐμβάλλει⁴⁸ εἰς⁴⁹ τὸν νοῦν αὐτοῦ⁵⁰ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν⁵¹ καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι⁵³ τῇ ἀτιμίᾳ⁵⁴ καὶ νομίζειν εἶναι καλόν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/007.yaml
  text: But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and not feel shame, but rather boast in his dishonor and think it good.
translation:
  language: hi
  text: पर यदि वह बढ़ता जाता है और सीमा पार कर देता है, तो भटकावे की आत्मा उसके मन में प्रवेश करती है और मतवाले को लज्जाजनक बातें बोलने, विधि-विरुद्ध आचरण करने और लज्जित न होने देती है; बल्कि वह अपने अपमान पर घमण्ड करता है और उसे अच्छा समझता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: सीमा पार कर जाता है
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप, जो निर्धारित मर्यादा से आगे निकलने का भाव बनाए रखता है।
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: भटकावे की आत्मा
  rationale: πλάνη में भ्रम, धोखा और पथभ्रष्टता के मिले-जुले अर्थ हैं; ‘भटकावा’ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: उसके मन में यह बात डालती है
  rationale: ग्रीक क्रिया के प्रेरक अर्थ को सहज हिन्दी में व्यक्त करता है; ‘यह बात’ आगे आने वाले दुष्कर्मों की प्रेरणा की ओर संकेत करती है।
- source_word: αἰσχρορρημονεῖν
  choice: अश्लील बातें कहलवाती
  rationale: लज्जाजनक या अभद्र वाणी के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: παρανομεῖν
  choice: अधर्म करवाती है
  rationale: कानून या मान्य मर्यादा के विरुद्ध आचरण का व्यापक नैतिक भाव सुरक्षित रहता है।
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: अपने अपमान पर घमण्ड करता
  rationale: ἀτιμία के अनादर/अपमान के भाव और καυχᾶσθαι के गर्वपूर्ण प्रदर्शन को निकटता से रखता है।
theological_decisions:
- issue: भटकावे की आत्मा की कर्तृत्व-भूमिका
  choice: इसे व्यक्तिगत कर्ता के रूप में रखते हुए ‘उसके मन में ... डालती है’ कहा गया है।
  alternative: इसे केवल मानसिक भ्रम या नशे के प्रभाव के रूप में अनुवाद करना।
  rationale: मूल में τὸ πνεῦμα कर्ता है; अनुवाद यह तय नहीं करता कि यह स्वतंत्र आध्यात्मिक सत्ता है या प्रभाव का व्यक्तिकरण।
- issue: ἀτιμία का आशय
  choice: ‘अपमान’
  alternative: ‘लज्जाजनक आचरण’ या ‘बदनामी’
  rationale: मूल की अस्पष्टता बनाए रखते हुए उस दशा पर गर्व करने की विडम्बना व्यक्त होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज गद्य। वाक्य की कारणात्मक गति तथा नशे से निर्लज्जता और आत्म-प्रशंसा तक की तीव्र प्रगति सुरक्षित रखी गई है।
