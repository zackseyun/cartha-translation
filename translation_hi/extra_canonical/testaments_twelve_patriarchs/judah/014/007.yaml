revisions:
- from: पर यदि वह सीमा पार कर जाता है, तो भटकावे की आत्मा उसके मन में यह बात डालती है और उस मतवाले से अश्लील बातें कहलवाती और अधर्म करवाती है; वह लज्जित नहीं होता, बल्कि अपने अपमान पर घमण्ड करता और उसे अच्छा समझता है।
  to: पर यदि वह बढ़ता जाता है और सीमा पार कर देता है, तो भटकावे की आत्मा उसके मन में प्रवेश करती है और मतवाले को लज्जाजनक बातें बोलने, विधि-विरुद्ध आचरण करने और लज्जित न होने देती है; बल्कि वह अपने अपमान पर घमण्ड करता है और उसे अच्छा समझता है।
