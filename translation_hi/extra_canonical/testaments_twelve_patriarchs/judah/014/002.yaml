source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει¹⁷ τὸν νοῦν σου¹⁸, καὶ εἰς πορνείαν ἐκθερμαίνει²⁰ τὸ σῶμα πρὸς ἡδονήν, καὶ²¹ πράσσει τὴν ἁμαρτίαν²² καὶ οὐκ αἰσχύνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/002.yaml
  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: hi
  text: क्योंकि यदि कोई मतवाला होने तक मदिरा पीता है, तो वह अशुद्ध विचारों से तुम्हारे मन को व्याकुल कर देती है, शरीर को सुख की ओर यौन अनैतिकता के लिए उत्तेजित करती है, और पाप करती है तथा लज्जित नहीं होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον εἰς μέθην
  choice: दाखमधु पीकर मतवाला हो जाए
  rationale: यह वाक्यांश केवल पीने नहीं, बल्कि मतवालेपन की हद तक पीने को दर्शाता है।
- source_word: διαλογισμοῖς ῥυπαροῖς
  choice: गंदे विचारों से
  rationale: ῥυπαρός नैतिक अशुद्धता या गंदगी का बोध कराता है; सरल आधुनिक हिन्दी में ‘गंदे विचार’ स्वाभाविक है।
- source_word: συνταράσσει τὸν νοῦν
  choice: तुम्हारे मन को अशांत कर देता है
  rationale: क्रिया तीव्र रूप से विचलित या उद्विग्न करने का अर्थ देती है; ‘अशांत’ पठनीय रहते हुए तीव्र मानसिक हलचल बताता है।
- source_word: πορνείαν
  choice: व्यभिचार
  rationale: यहाँ शब्द व्यापक यौन अनैतिकता को सूचित करता है; ‘व्यभिचार’ प्रतिष्ठित और सामान्यतः समझा जाने वाला हिन्दी धार्मिक पद है।
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: सुख के लिए शरीर को भड़का देता है
  rationale: ἐκθερμαίνει शरीर में तीव्र कामोत्तेजना जगाने का चित्र देता है; ‘भड़का देता है’ उस रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐκ αἰσχύνεται
  choice: लज्जित नहीं होता
  rationale: मूल का सीधा अर्थ शर्म या लज्जा अनुभव न करना है।
theological_decisions:
- issue: अंतिम क्रियाओं का कर्ता
  choice: ‘तब वह पाप करता है’ में व्यक्ति को कर्ता रखा
  alternative: ‘शरीर पाप करता है’ या ‘वह [दाखमधु] पाप करता है’
  rationale: ग्रीक में कर्ता व्यक्त नहीं है और निकटवर्ती नपुंसकलिंग ‘शरीर’ व्याकरणिक कर्ता नहीं बन सकता; प्रसंगानुसार पीने वाला व्यक्ति सबसे स्वाभाविक कर्ता है, पर ‘तब’ लगाकर परिणाम-क्रम स्पष्ट किया गया है।
- issue: πορνεία की सीमा
  choice: ‘व्यभिचार’
  alternative: ‘यौन अनैतिकता’
  rationale: मूल शब्द का अर्थ व्यापक हो सकता है। ‘व्यभिचार’ संक्षिप्त और गरिमापूर्ण है, यद्यपि आधुनिक प्रयोग में कभी-कभी इसे केवल विवाहेतर संबंध तक सीमित समझा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दूसरे पुरुष ‘तुम्हारे’ को ग्रीक σου के अनुसार बनाए रखा गया है, जबकि आरंभ का τις अनिश्चित ‘कोई’ है।
