source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ δέδωκα αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου *εἰς ἀρραβῶνα.
  language: Greek
  note: 'Greek from Charles XII.4b (α): the pledge handover. Project''s English distributes this single α-clause across project vv 9-10. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: hi
  text: और मैंने अपनी लाठी और अपना मुकुट उसे गिरवी के रूप में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: लाठी
  rationale: यह सामान्य, स्वाभाविक हिन्दी है और उस व्यक्तिगत दंड/छड़ी को स्पष्ट करता है जिसे यहूदा ने गिरवी रखा।
- source_word: διάδημα
  choice: मुकुट
  rationale: राजकीय शिरोभूषण के लिए आधुनिक पाठक को सहज शब्द; यूनानी पाठ में केवल यही वस्तु है, इसलिए अंग्रेज़ी परामर्श-पाठ के अतिरिक्त ‘कमरबंद’ को नहीं जोड़ा गया।
- source_word: εἰς ἀρραβῶνα
  choice: बयाने के रूप में
  rationale: ἀρραβών यहाँ किसी प्रतिज्ञा की गारंटी के रूप में दी गई वस्तु, अर्थात गिरवी/बयाना, दर्शाता है; ‘बयाना’ प्रसंग में स्वाभाविक और अर्थ-सटीक है।
theological_decisions:
- issue: ‘तेरे राज्य का मुकुट’ बनाम स्रोत का केवल ‘मेरा मुकुट’
  choice: अपना मुकुट
  alternative: अपने राज्य का मुकुट
  rationale: मूल यूनानी τὸ διάδημά μου में ‘राज्य’ नहीं है; इसलिए परामर्श-पाठ की व्याख्यात्मक वृद्धि को मुख्य पाठ में नहीं अपनाया गया।
- issue: प्रत्यक्ष संवाद बनाम हस्तांतरण का कथन
  choice: हस्तांतरण का कथन
  alternative: “मैं क्या बयाना दूँ?” … “अपनी लाठी…”
  rationale: दिए गए यूनानी खंड में केवल वस्तुएँ देने की क्रिया है; प्रश्नोत्तर इस खंड में मौजूद नहीं है। स्रोत-आधारित अनुवाद उसी कथन को रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। पद में कोई पादटिप्पणी आवश्यक नहीं; सभी सूचनाएँ सीधे उपलब्ध यूनानी पाठ से व्यक्त की गई हैं।
