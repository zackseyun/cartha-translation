source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: hi
  text: क्योंकि वह दो परस्पर विरोधी वासनाओं का दास है और परमेश्वर की आज्ञा नहीं मान सकता, क्योंकि इनसे उसकी आत्मा अंधी हो गई है और वह दिन में भी ऐसे चलता है मानो रात हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν
  choice: वासनाओं
  rationale: यहाँ शब्द उन प्रबल और दास बना लेने वाली मनोवृत्तियों या आवेगों को दर्शाता है; ‘वासनाएँ’ संदर्भ की नैतिक गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐναντίοις
  choice: परस्पर विरोधी
  rationale: दोनों आवेगों के एक-दूसरे के विपरीत होने का अर्थ स्पष्ट करता है।
- source_word: δουλεύει
  choice: दास है
  rationale: यूनानी क्रिया में केवल प्रभाव में होने से अधिक, दासत्व और अधीनता का भाव है।
- source_word: ὑπακοῦσαι
  choice: आज्ञा मान
  rationale: परमेश्वर के प्रति सुनने और आज्ञापालन करने के संयुक्त भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: इनसे उसकी आत्मा अंधी हो गई है
  rationale: यूनानी में क्रिया एकवचन है, पर निकटवर्ती कारण दो विरोधी वासनाएँ हैं; हिन्दी में यह रचना कारण को स्पष्ट रखते हुए अस्वाभाविक कर्ता-सामंजस्य से बचती है।
- source_word: πορεύεται
  choice: चलता है
  rationale: जीवन-आचरण के रूपक और वास्तविक चलने, दोनों की संभावित छाया को बनाए रखता है।
theological_decisions:
- issue: दो विरोधी वासनाओं और परमेश्वर की आज्ञाकारिता का संबंध
  choice: वासनाओं के दासत्व के कारण आज्ञा मानने में असमर्थता
  alternative: इसे पूर्ण दार्शनिक या आध्यात्मिक अक्षमता की व्यवस्थित शिक्षा के रूप में स्पष्ट करना
  rationale: मूल पाठ नैतिक दासत्व और अंधेपन का चित्र देता है, पर किसी विशिष्ट मत-पद्धति को परिभाषित नहीं करता; इसलिए तनाव को बिना अतिरिक्त सिद्धान्त जोड़े बनाए रखा गया है।
- issue: ‘आत्मा’ का अर्थ
  choice: आत्मा
  alternative: मन या अंतःकरण
  rationale: ψυχή का सीधा और संदर्भानुकूल समतुल्य ‘आत्मा’ है; इसे केवल मानसिक क्षमता तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘दिन में भी ऐसे चलता है मानो रात हो’ मूल उपमा को स्पष्ट और स्वाभाविक रूप में रखता है।
