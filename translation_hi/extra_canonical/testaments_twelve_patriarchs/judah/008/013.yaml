reference: Testament of Judah 8:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: hi
  text: कुछ दिनों के बाद[a] यह खबर मिली कि तामार ने वेश्यावृत्ति की है और वह गर्भवती है। यह सुनकर मैंने कहा, “उसे बाहर निकालो और वह जला दी जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 38:24 की परंपरा में यहाँ “लगभग तीन महीने बाद” है; इस यूनानी पाठ में “कुछ दिनों के बाद” है।
    reason: प्रस्तुत यूनानी पाठ और परिचित उत्पत्ति-परंपरा/अंग्रेज़ी परामर्श-पाठ के काल-संबंधी अंतर को पारदर्शी रखना।
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινὰς
  choice: कुछ दिनों के बाद
  rationale: प्रस्तुत यूनानी पाठ का सीधा अर्थ यही है; अंग्रेज़ी परामर्श-पाठ के ‘तीन महीने बाद’ को मूल पाठ पर आरोपित नहीं किया गया।
- source_word: ἐκπεπόρνευκε
  choice: व्यभिचार किया है
  rationale: यह पूर्णकालिक क्रिया यौन अनैतिकता/वेश्याचार का आरोप व्यक्त करती है। आधुनिक सामान्य हिन्दी में ‘व्यभिचार’ प्रसंग की न्यायिक और नैतिक गंभीरता को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि यूनानी शब्द में ‘वेश्या जैसा आचरण’ का अधिक तीखा भाव भी है।
- source_word: ἐν γαστρὶ ἔχει
  choice: वह गर्भवती है
  rationale: शाब्दिक मुहावरे ‘गर्भ में रखती है’ के बजाय उसका स्वाभाविक आधुनिक हिन्दी अर्थ दिया गया है।
- source_word: Ἐξαγάγετε αὐτὴν καὶ καυθήτω
  choice: उसे बाहर निकालो और जला दो
  rationale: आदेश की कठोरता और क्रम को स्पष्ट, सहज हिन्दी में रखा गया है। यूनानी में दूसरा आदेश कर्मवाच्य है (‘वह जलाई जाए’), पर हिन्दी में सक्रिय आज्ञार्थ अधिक स्वाभाविक है और आशय नहीं बदलता।
theological_decisions:
- issue: यहूदा की मनःस्थिति का वर्णन
  choice: केवल ‘यह सुनकर मैंने कहा’ रखा गया
  alternative: ‘अपने क्रोध के अहंकार में समझ से रहित होकर’ जोड़ना
  rationale: प्रस्तुत यूनानी स्रोत में यह आत्मविश्लेषण नहीं है; इसलिए अंग्रेज़ी परामर्श-पाठ की व्याख्यात्मक सामग्री को मुख्य पाठ में नहीं जोड़ा गया।
- issue: तामार का संबंध और सूचना के कथन का रूप
  choice: यूनानी के अनुसार अप्रत्यक्ष सूचना रखी गई
  alternative: ‘तामार, तुम्हारी बहू...’ के रूप में प्रत्यक्ष उद्धरण
  rationale: प्रस्तुत यूनानी में ‘तुम्हारी बहू’, ‘देखो’, या सूचना देने वाले के सीधे शब्द नहीं हैं।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। न्यायादेश की कठोरता को नरम नहीं किया गया। ‘व्यभिचार’ सामान्य पाठक के लिए बोधगम्य है, जबकि टिप्पणी में यूनानी शब्द के अधिक तीखे वेश्याचार-संबंधी भाव को स्वीकार किया गया है।
