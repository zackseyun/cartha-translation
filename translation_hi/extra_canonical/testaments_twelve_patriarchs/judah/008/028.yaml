id: T12P.JUD.8.28
reference: Testament of Judah 8:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: hi
  text: क्योंकि ये बातें मनुष्य को परमेश्वर की व्यवस्था से दूर कर देती हैं, उसकी आत्मा के विचार-विवेक को अंधा कर देती हैं, अहंकार सिखाती हैं, और उसे अपने पड़ोसी पर दया करने नहीं देतीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का स्वाभाविक हिन्दी रूप; यह पूर्ववर्ती दोषों या आचरणों की ओर संकेत करता है।
- source_word: ἀφιστᾷ
  choice: दूर कर देती हैं
  rationale: क्रिया का अर्थ अलग या विमुख कर देना है; हिन्दी में कारणकारी भाव स्पष्ट रखा गया है।
- source_word: τοῦ νόμου τοῦ θεοῦ
  choice: परमेश्वर की व्यवस्था से
  rationale: νόμος के धार्मिक और नैतिक अर्थ को प्रचलित बाइबलीय हिन्दी ‘व्यवस्था’ से व्यक्त किया गया है।
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: उसकी आत्मा की विचार-शक्ति
  rationale: διαβούλιον विचार-विमर्श, मनोवृत्ति या निर्णय-सामर्थ्य का संकेत दे सकता है; ‘विचार-शक्ति’ मूल की मानसिक क्रिया को सहज हिन्दी में रखती है, जबकि ‘आत्मा’ ψυχή की धार्मिक-मानवीय व्यापकता बनाए रखता है।
- source_word: τυφλοῖ
  choice: अंधा कर देती हैं
  rationale: मूल के रूपक को सीधे सुरक्षित रखा गया है।
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: उसे घमंड करना सिखाती हैं
  rationale: ὑπερηφανία को सरल आधुनिक हिन्दी ‘घमंड’ से व्यक्त किया गया है और क्रियात्मक वाक्य-रचना मूल के ‘सिखाती हैं’ भाव को रखती है।
- source_word: ἐλεῆσαι
  choice: दया ... करने
  rationale: क्रिया का अर्थ दया या करुणा दिखाना है; ‘दया करना’ सामान्य और गरिमापूर्ण हिन्दी है।
- source_word: τὸν πλησίον αὐτοῦ
  choice: अपने पड़ोसी पर
  rationale: πλησίον का पारंपरिक और व्यापक बाइबलीय समतुल्य ‘पड़ोसी’ है, जिसका आशय निकटवर्ती या साथी मनुष्य भी हो सकता है।
theological_decisions:
- issue: ψυχή और διαβούλιον के संबंध का अनुवाद
  choice: आत्मा की विचार-शक्ति
  alternative: मन की प्रवृत्ति / आत्मा का विचार
  rationale: मूल वाक्य आत्मा से संबंधित विचार-विमर्श या निर्णय-सामर्थ्य को अंधा किए जाने की बात करता है। चुना हुआ रूप किसी विशिष्ट मनोवैज्ञानिक या सांप्रदायिक सिद्धांत को थोपे बिना इस संबंध को बनाए रखता है।
- issue: πλησίον का दायरा
  choice: पड़ोसी
  alternative: साथी मनुष्य
  rationale: ‘पड़ोसी’ मूल शब्द का मान्य शाब्दिक-बाइबलीय रूप है; पाठ स्वयं इसके दायरे को और सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। समानांतर क्रियाओं को बनाए रखते हुए जहाँ आवश्यक था वहाँ ‘मनुष्य/उसे/उसकी’ जोड़ा गया है, ताकि यूनानी के निहित कर्म का हिन्दी में स्वाभाविक संदर्भ बने।
