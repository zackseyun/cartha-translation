  text: Ἐμοὶ ἔδωκε τὰ ἐπὶ γῆς, ἐκείνῳ τὰ ἐν οὐρανοῖς.
  language: Greek
  note: Greek from Charles XXI.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/037.yaml
  text: To me he gave the things on earth; to him the things in heaven.
translation:
  language: hi
  text: उसने मुझे पृथ्वी की वस्तुएँ दीं, और उसे स्वर्ग की वस्तुएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπὶ γῆς
  choice: पृथ्वी की वस्तुएँ
  rationale: यह यूनानी पद पृथ्वी पर स्थित या पृथ्वी से संबंधित बातों/वस्तुओं को व्यापक रूप से दर्शाता है; संदर्भ के अभाव में इसकी व्यापकता बनाए रखी गई है।
- source_word: τὰ ἐν οὐρανοῖς
  choice: स्वर्ग की वस्तुएँ
  rationale: बहुवचन οὐρανοῖς का स्वाभाविक हिन्दी रूप यहाँ ‘स्वर्ग’ है; ‘वस्तुएँ’ मूल के नपुंसकलिंग बहुवचन और उसकी अनिर्दिष्ट व्यापकता को सुरक्षित रखता है।
- source_word: ἐκείνῳ
  choice: उसे
  rationale: मूल में दूरसूचक सर्वनाम है, पर इस संक्षिप्त अंश में व्यक्ति की पहचान नहीं दी गई; इसलिए अस्पष्टता को बिना नाम जोड़े बनाए रखा गया है।
theological_decisions:
- issue: पृथ्वी और स्वर्ग से संबंधित अधिकार या वस्तुओं का बँटवारा
  choice: ‘वस्तुएँ’ कहकर मूल की व्यापक और अनिर्दिष्ट अभिव्यक्ति बनाए रखी गई।
  alternative: ‘अधिकार’ या ‘राज्य’
  rationale: मूल पाठ में अधिकार या राज्य के लिए स्पष्ट संज्ञा नहीं है; ऐसी व्याख्या जोड़ना धार्मिक आशय को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। समानांतर यूनानी संरचना को संक्षिप्त हिन्दी वाक्य में सुरक्षित रखा गया है।
