  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: hi
  text: इसलिए, मेरे बच्चों, यौन अनैतिकता और धन के लोभ से अपने आप को बचाए रखो, और अपने पिता यहूदा की बात सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: अपने आप को बचाए रखो
  rationale: मध्यम आज्ञार्थक का आत्म-संरक्षण और निरंतर सावधानी का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πορνείας
  choice: व्यभिचार
  rationale: यह व्यापक यौन अनैतिकता का संकेत देता है; ‘व्यभिचार’ गरिमापूर्ण और सामान्य बाइबिलीय हिन्दी में परिचित शब्द है।
- source_word: φιλαργυρίας
  choice: धन के लोभ
  rationale: शाब्दिक अर्थ ‘चाँदी/धन से प्रेम’ है; ‘धन का लोभ’ आधुनिक हिन्दी में इसके नकारात्मक नैतिक आशय को स्पष्ट रखता है।
- source_word: ἀκούσατε
  choice: बात सुनो
  rationale: सिर्फ ध्वनि सुनने के बजाय ध्यान देकर मानने योग्य उपदेश सुनने का भाव संदर्भानुकूल रूप से व्यक्त होता है।
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: अपने पिता यहूदा
  rationale: यूनानी संबंध-वाक्यांश का अर्थ सीधे और स्वाभाविक हिन्दी क्रम में सुरक्षित है।
