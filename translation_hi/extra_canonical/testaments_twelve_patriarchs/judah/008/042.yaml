source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: hi
  text: और मैं जान गया हूँ कि [अंतिम दिनों में][a] तुम जितनी भी बुराइयाँ करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अंतिम दिनों में” शब्द चार्ल्स के यूनानी पाठ में कोष्ठकों में हैं और उनके द्वारा बाद का ईसाई प्रक्षेप माने गए हैं; परियोजना की नीति के अनुसार इन्हें यहाँ सुरक्षित रखा गया है। एक अन्य पाठ-परंपरा में धर्मी हनोक की पुस्तकों को पढ़ने का उल्लेख मिलता है।
    reason: कोष्ठकित खंड की संपादकीय स्थिति और महत्वपूर्ण β-पाठभेद को स्पष्ट करना।
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: वाक्य को पूर्ववर्ती कथन से जोड़ने वाला सामान्य संयोजक।
- source_word: ἔγνωκα
  choice: मैं जान गया हूँ
  rationale: पूर्णकालिक क्रिया के ‘जान चुका हूँ/ज्ञान प्राप्त हुआ है’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; β-पाठ के ‘मैंने पढ़ा’ को इसमें नहीं मिलाया गया।
- source_word: ὅσα κακὰ
  choice: कितनी बुराइयाँ
  rationale: ὅσα की परिमाणात्मक व्यापकता और κακά के बहुवचन अर्थ को बनाए रखता है।
- source_word: ποιήσετε
  choice: तुम ... करोगे
  rationale: द्वितीय पुरुष बहुवचन भविष्यकाल का सीधा और स्पष्ट रूप।
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: अन्तिम दिनों में
  rationale: प्रचलित युगान्त-संबंधी अभिव्यक्ति का औपचारिक किंतु सहज हिन्दी रूप।
theological_decisions:
- issue: भिन्न पाठ में हनोक की पुस्तकों का उल्लेख
  choice: α-पाठ के केवल ‘मैं जान गया हूँ’ का अनुवाद किया गया
  alternative: ‘मैंने धर्मी हनोक की पुस्तकों में पढ़ा है’
  rationale: दिए गए मूल स्रोत का मुख्य α-पाठ Καὶ ἔγνωκα है; β-पाठ की सामग्री को मूल वाक्य में मिलाना पाठभेद को अनुचित रूप से सुलझा देता।
- issue: कोष्ठकित ‘अन्तिम दिनों में’ खंड
  choice: मुख्य पाठ में रखा और पादटिप्पणी से उसकी स्थिति बताई
  alternative: इसे प्रक्षेप मानकर मुख्य पाठ से हटाना
  rationale: परियोजना की नीति के अनुसार चार्ल्स द्वारा चिह्नित ईसाई प्रक्षेप को संरक्षित किया गया, साथ ही उसकी पाठ-संपादकीय स्थिति पारदर्शी रखी गई।
- issue: अंग्रेज़ी परामर्श-पाठ की विस्तृत सामग्री
  choice: ‘पुत्रों का प्रभु से फिरना’ और ‘प्रभु के सामने हर दुःख’ नहीं जोड़े गए
  alternative: अंग्रेज़ी POB के अनुसार विस्तृत कथन देना
  rationale: ये विवरण प्रस्तुत α-पाठ में नहीं हैं; स्रोत-साक्ष्य से पहले अनुवाद करने के सिद्धांत के अनुसार अनधिकृत विस्तार से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-समीपी शैली। ‘जान गया हूँ’ सामान्य पाठक के लिए सहज है और यूनानी पूर्णकाल की वर्तमान-प्रासंगिक उपलब्धि को व्यक्त करता है।
