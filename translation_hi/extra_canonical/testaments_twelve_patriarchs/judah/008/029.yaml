source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: hi
  text: वह उसके प्राण को हर प्रकार की भलाई से वंचित कर देता है, उसे पीड़ाओं और परिश्रमों में दबाए रखता है, उसकी नींद उड़ा देता है और उसकी देह को क्षीण कर देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: वंचित कर देता है
  rationale: यह क्रिया किसी वस्तु से महरूम करने या उसे छीन लेने का भाव रखती है; हिन्दी में यह स्वाभाविक और अर्थ-सटीक है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: उसके प्राण को
  rationale: ψυχή यहाँ व्यक्ति के भीतरी जीवन या प्राण को सूचित करती है; केवल ‘मन’ कहना अर्थ को संकुचित कर देता।
- source_word: ἀπὸ πάσης ἀγαθότητος
  choice: हर प्रकार की भलाई से
  rationale: πάσης की व्यापकता और ἀγαθότης के नैतिक/कल्याणकारी अर्थ दोनों सुरक्षित रहते हैं।
- source_word: συνέχει αὐτὸν
  choice: उसे ... जकड़े रखता है
  rationale: συνέχω में दबाकर बाँधे या घेरे रखने का भाव है; यह केवल सामान्य ‘सताने’ से अधिक सटीक है।
- source_word: ἐν πόνοις καὶ μόχθοις
  choice: कठिन परिश्रम और कष्टों में
  rationale: 'दोनों निकटार्थी शब्दों का भेद यथासंभव रखा गया है: μόχθος श्रम/कठिन मेहनत और πόνος पीड़ा/कष्ट का संकेत देता है।'
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: उसकी नींद उड़ा देता है
  rationale: यूनानी अभिव्यक्ति का आशय नींद को उससे दूर कर देना है; यह आधुनिक हिन्दी का स्पष्ट और स्वाभाविक मुहावरा है।
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: उसके शरीर को घुला देता है
  rationale: καταδαπανάω पूर्णतः क्षीण या खपा देने का भाव देता है; बहुवचन σάρκας को हिन्दी में स्वाभाविक सामूहिक अर्थ ‘शरीर’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्रियाओं का निहित कर्ता
  choice: एकवचन ‘वह’
  alternative: अंग्रेज़ी परामर्श-पाठ के अनुसार बहुवचन ‘वे’
  rationale: उपलब्ध यूनानी पाठ की सभी मुख्य क्रियाएँ एकवचन हैं और कर्ता पूर्ववर्ती प्रसंग से निहित है। इसलिए बिना प्रमाण बहुवचन आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘प्राण’, ‘वंचित’, ‘जकड़े’ और ‘घुला देता है’ मूल के भीतरी जीवन, दमन और शारीरिक क्षय के प्रबल बिंबों को सहज भाषा में बनाए रखते हैं।
