  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: hi
  text: नगर के लोग भी कहते थे, “फाटक पर कोई वेश्या[a] नहीं थी; वह किसी दूसरी जगह से आई थी और थोड़ी देर के लिए फाटक पर बैठी थी।” और वे सोचते थे कि किसी को यह पता नहीं चला कि मैं उसके पास भीतर गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का पाठ और अर्थ अनिश्चित है; प्रसंग में इसका आशय संभवतः वेश्या या यौनकर्मी से है।
    reason: दुर्लभ/संदिग्ध यूनानी रूप τελεσικόμενον की वास्तविक शाब्दिक अनिश्चितता बताने के लिए।
lexical_decisions:
- source_word: τελεσικόμενον
  choice: वेश्या
  rationale: पाठ में यह दुर्लभ और संदिग्ध रूप है, पर प्रसंग तथा उपलब्ध यूनानी पाठ-परंपरा इसे फाटक पर बैठी यौनकर्मी के अर्थ में समझने का समर्थन करती है। अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: ἐξ ἄλλου χωρίου
  choice: किसी दूसरी जगह से
  rationale: χωρίον यहाँ किसी अन्य स्थान या इलाके को सूचित करता है; सहज हिन्दी में व्यापक अर्थ बनाए रखा गया है।
- source_word: πρὸς βραχὺ
  choice: थोड़ी देर के लिए
  rationale: यह समय की संक्षिप्त अवधि व्यक्त करता है।
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: मैं उसके पास भीतर गया था
  rationale: εἰσέρχομαι का भीतर जाने वाला बिंब बनाए रखा गया है और प्रसंगगत यौन संकेत को स्पष्ट व्याख्या से तीखा नहीं किया गया।
theological_decisions:
- issue: अंग्रेज़ी परामर्श-पाठ में पाप और लज्जा की स्वीकृति
  choice: इसे मुख्य पाठ में शामिल नहीं किया गया
  alternative: “मैं समझ गया कि मैंने पाप किया था... क्योंकि मैं लज्जित था” जोड़ना
  rationale: प्रदत्त यूनानी स्रोत में इस कथन के स्थान पर यह है कि यहूदा ने सोचा, किसी को उसके स्त्री के पास भीतर जाने का पता नहीं चला। स्रोत-साक्ष्य को प्राथमिकता दी गई है।
- issue: नगरवासियों के कथन और स्त्री के अस्थायी रूप से बैठने के बीच तनाव
  choice: दोनों कथनों को ज्यों का त्यों साथ रखा गया
  alternative: स्त्री को स्पष्ट रूप से “अजनबी” कहकर या कथन का तर्क समझाकर तनाव मिटाना
  rationale: यूनानी की असहजता और संभावित पाठगत तनाव को व्याख्यात्मक विस्तार द्वारा चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। “फाटक” नगर-द्वार के अर्थ में है। स्रोत में अनुपस्थित अंग्रेज़ी परामर्श-पाठ की पाप और लज्जा संबंधी पंक्ति नहीं जोड़ी गई।
