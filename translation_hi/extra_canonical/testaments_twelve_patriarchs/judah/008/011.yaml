  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: hi
  text: मैंने गिरवी रखी हुई वस्तुएँ लेने के लिए किसी को भेजा, पर वह नहीं मिली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπεμψα
  choice: मैंने ... किसी को भेजा
  rationale: ग्रीक क्रिया में भेजे गए व्यक्ति का उल्लेख नहीं है; हिन्दी में स्वाभाविक और अर्थपूर्ण अभिव्यक्ति के लिए अनिर्दिष्ट ‘किसी को’ जोड़ा गया है।
- source_word: τοῦ λαβεῖν
  choice: वापस लेने के लिए
  rationale: यह उद्देश्य बताने वाला infinitive है; प्रसंग में पहले दिए गए बयाने को पुनः प्राप्त करने का भाव है।
- source_word: τοὺς ἀρραβῶνας
  choice: बयाना
  rationale: बहुवचन यूनानी संज्ञा गिरवी/प्रतिभूति के रूप में दी गई वस्तुओं को सूचित करती है। आधुनिक हिन्दी में ‘बयाना’ इस लेन-देन संबंधी अर्थ को सरलता से व्यक्त करता है।
- source_word: οὐχ εὗρον αὐτήν
  choice: वह नहीं मिली
  rationale: शाब्दिक रूप ‘मैंने उसे नहीं पाया’ है, पर हिन्दी में किसी स्त्री को खोज न पाने के लिए ‘वह नहीं मिली’ अधिक स्वाभाविक है और कर्ता-परिवर्तन से आशय नहीं बदलता।
theological_decisions:
- issue: उत्पत्ति की विस्तृत परंपरा से सामग्री जोड़ना
  choice: केवल उपलब्ध यूनानी α-पाठ का अनुवाद किया गया
  alternative: अंग्रेज़ी POB के अनुसार बकरी का बच्चा और उस स्थान के लोगों से पूछताछ जोड़ना
  rationale: दिए गए यूनानी स्रोत में न बकरी के बच्चे का उल्लेख है, न एनैम में लोगों से पूछने का। स्रोत से बाहर की कथात्मक सामग्री जोड़ने से इस पाठ-रूप की विशिष्टता मिट जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बयाना’ सामान्य पाठक के लिए ‘गिरवी की वस्तुएँ’ से अधिक स्वाभाविक है; वाक्य में यूनानी स्रोत की संक्षिप्तता सुरक्षित रखी गई है।
