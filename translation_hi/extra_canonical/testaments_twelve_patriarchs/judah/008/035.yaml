source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: hi
  text: 'और अब, मेरे बच्चों, मैं तुम्हें आदेश देता हूँ: लेवी से प्रेम करो, ताकि तुम टिके रहो; और अपने आप को उसके विरुद्ध ऊँचा मत उठाओ, कहीं ऐसा न हो कि तुम पूरी तरह नष्ट कर दिए जाओ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶτε τὸν Λευὶ
  choice: लेवी से प्रेम करो
  rationale: ἀγαπάω के सीधे आज्ञार्थक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἵνα διαμείνητε
  choice: ताकि तुम बने रहो
  rationale: διαμένω का अर्थ केवल जीवित रहना नहीं, बल्कि टिके या कायम रहना भी है; इसलिए यूनानी पाठ की व्यापकता सुरक्षित रखी गई है।
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: उसके विरुद्ध अपने आपको ऊँचा न उठाओ
  rationale: ἐπαίρομαι की आत्म-अभिमान या स्वयं को ऊँचा करने की छवि और ἐπί के विरोधात्मक भाव—दोनों को बनाए रखता है।
- source_word: ἵνα μὴ ἐξολοθρευθῆτε
  choice: कहीं ऐसा न हो कि तुम पूरी तरह नष्ट कर दिए जाओ
  rationale: निषेधात्मक परिणाम/आशंका और निष्क्रिय क्रिया के साथ ἐξολοθρεύω की पूर्ण विनाश की तीव्रता सुरक्षित रखता है।
theological_decisions:
- issue: लेवी से प्रेम करने और बने रहने के बीच संबंध
  choice: “ताकि तुम बने रहो” के रूप में उद्देश्य/परिणाम का संबंध खुला रखा गया
  alternative: “ताकि तुम जीवित रहो”
  rationale: διαμείνητε निरंतर बने रहने, टिके रहने या जीवित रहने का संकेत दे सकता है; किसी विशिष्ट धार्मिक व्याख्या को थोपे बिना व्यापक अर्थ रखा गया है।
- issue: विनाश के कर्ता की पहचान
  choice: निष्क्रिय रूप “नष्ट कर दिए जाओ”
  alternative: “परमेश्वर तुम्हें नष्ट न कर दे”
  rationale: यूनानी पाठ कर्ता का नाम नहीं बताता; इसलिए संभावित दैवी निष्क्रियता को स्पष्ट करके नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। “मेरे बच्चो” संबोधन स्नेहपूर्ण पितृ-वाणी को दर्शाता है, जबकि आज्ञा और चेतावनी की गंभीरता बनी रहती है।
