source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: hi
  text: क्योंकि यदि कोई दाखमधु पीकर मतवाला हो जाता है, तो वह अशुद्ध विचारों से उसके मन को उथल-पुथल कर देता है और उसके शरीर को सुख की ओर गरमाकर यौन अनैतिकता के लिए उकसाता है; फिर वह पाप करता है और लज्जित नहीं होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον εἰς μέθην
  choice: दाखमधु पीकर मतवाला हो जाए
  rationale: ‘मत्तता तक दाखमधु पीने’ का स्वाभाविक आधुनिक हिन्दी रूप; कारण और परिणति दोनों स्पष्ट रहते हैं।
- source_word: διαλογισμοῖς ῥυπαροῖς
  choice: अशुद्ध विचारों से
  rationale: ῥυπαρός की नैतिक अशुद्धता को व्यक्त करता है, बिना उसे केवल शारीरिक गंदगी तक सीमित किए।
- source_word: συνταράσσει τὸν νοῦν
  choice: मन को उथल-पुथल कर देता है
  rationale: συνταράσσω में निहित तीव्र विचलन और आंतरिक अव्यवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: πορνείαν
  choice: यौन अनैतिकता
  rationale: यह व्यापक यूनानी शब्द है; ‘व्यभिचार’ कहने पर अर्थ अनावश्यक रूप से केवल वैवाहिक बेवफाई तक सीमित हो सकता है।
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: सुख की लालसा में उसके शरीर को … भड़का देता है
  rationale: शरीर को उत्तेजित/गरम करने और काम-सुख की ओर प्रेरित करने की छवि को स्वाभाविक तथा गरिमापूर्ण भाषा में रखता है।
- source_word: οὐκ αἰσχύνεται
  choice: लज्जित नहीं होता
  rationale: αἰσχύνομαι का सीधा नैतिक और भावात्मक अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: πορνείαν का नैतिक दायरा
  choice: यौन अनैतिकता
  alternative: व्यभिचार
  rationale: मूल शब्द अनेक प्रकार के अवैध या अनैतिक यौन आचरण को समेट सकता है; किसी संप्रदायगत या अत्यधिक संकीर्ण परिभाषा को नहीं थोपा गया।
- issue: दाखमधु और पाप के बीच संबंध
  choice: 'पाठ की क्रमिकता रखी गई: मतवालापन मन को विचलित और शरीर को भड़काता है, फिर व्यक्ति पाप करता है'
  alternative: दाखमधु स्वयं व्यक्ति से अनिवार्य रूप से पाप करवाता है
  rationale: मूल में दाखमधु की उकसाने वाली भूमिका और मनुष्य के पाप करने—दोनों को रखा गया है; नैतिक उत्तरदायित्व या कारणता को मूल से अधिक निर्णायक नहीं बनाया गया।
- issue: मूल में तीसरे और दूसरे पुरुष का परिवर्तन
  choice: सुसंगत तीसरा पुरुष—‘उसके मन’—अपनाया गया
  alternative: ‘कोई… तुम्हारे मन को’
  rationale: यूनानी पाठ के व्यक्ति-परिवर्तन को शब्दशः रखने से हिन्दी में संदर्भ भ्रमित होता; सामान्य कथन का अर्थ बदले बिना आधुनिक हिन्दी में कर्ता-संदर्भ स्पष्ट किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘दाखमधु’, ‘अशुद्ध विचार’, ‘यौन अनैतिकता’ और ‘लज्जित’ जैसे शब्द मूल की नैतिक गंभीरता बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
