source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: hi
  text: इसलिए अपने आपको लेवी से ऊँचा न उठाओ और मेरे विरुद्ध न उठो, बल्कि दोनों में प्रभु का पूरा आदर करो; और मनुष्यों के बीच लेवी के निकट आओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य का कोई सीधा समकक्ष उपलब्ध यूनानी α-पाठ में नहीं है। यह परियोजना-पाठ अध्याय 21:1 के ‘अपने आपको ऊँचा न उठाओ’ विषय और 21:5 के ‘निकट आना’ (προσεγγίζειν) भाव को मिलाता है। ‘दोनों में प्रभु का पूरा आदर करो’ वाला अंश α-पाठ में नहीं मिलता; वहाँ 21:6 आगे दूसरे वाक्य से आरम्भ होता है।
    reason: पाठक को बताना आवश्यक है कि यह पद किसी एक प्रत्यक्ष यूनानी वाक्य का अनुवाद नहीं, बल्कि स्रोत-विषयों पर आधारित परियोजना-परिभाषा है।
lexical_decisions:
- source_word: προσεγγίζειν (XXI.5)
  choice: निकट रहो
  rationale: मूल क्रिया में पास आने या निकट संबंध रखने का भाव है। इस संयोजित उपदेश में ‘निकट रहो’ स्वाभाविक हिन्दी है और संबंधपरक अर्थ को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: “do not exalt yourselves” theme (XXI.1)
  choice: अपने आपको … से ऊँचा न उठाओ
  rationale: यह उपलब्ध यूनानी अंश के विषयगत निषेध को हिन्दी में रूपक सहित सुरक्षित रखता है और इसे केवल घमण्ड या अधिकार के किसी एक अर्थ तक सीमित नहीं करता।
- source_word: “in both” (project paraphrase)
  choice: दोनों में
  rationale: अंग्रेज़ी परामर्श-पाठ की अस्पष्टता सुरक्षित रखी गई है; संदर्भ से इसका संकेत लेवी और वक्ता की ओर हो सकता है, पर हिन्दी पाठ इसे निर्णायक रूप से नहीं बाँधता।
theological_decisions:
- issue: लेवी के ऊपर स्वयं को ऊँचा उठाने का निषेध
  choice: लेवी की तुलना में श्रेष्ठता जताने और वक्ता के विरुद्ध उठने—दोनों को अलग निषेधों के रूप में रखा गया है।
  alternative: इसे केवल पुरोहिती अधिकार के अधीन रहने की स्पष्ट आज्ञा बनाना।
  rationale: उपलब्ध स्रोत-सूचना इतनी विशिष्ट संप्रदायगत या संस्थागत व्याख्या का समर्थन नहीं करती।
- issue: “दोनों में प्रभु का पूरा आदर करो” का संदर्भ
  choice: ‘दोनों में’ की वास्तविक अस्पष्टता बनाए रखी गई है।
  alternative: ‘हम दोनों के द्वारा’ या ‘लेवी और यहूदा दोनों में’ कहकर संदर्भ निश्चित करना।
  rationale: यह उपवाक्य प्रत्यक्ष α-पाठ में नहीं है और परामर्श-पाठ भी ‘both’ का आशय स्पष्ट नहीं करता; अतः अनुवाद में आशय जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘ऊँचा न उठाओ’ मूल रूपक को बचाता है; ‘निकट रहो’ संबंधपरक और स्वाभाविक है। उपलब्ध VIII.1–3 का यूनानी पाठ इस परियोजना-पद से प्रत्यक्ष रूप से संबंधित नहीं है, इसलिए उससे शब्दावली आयात नहीं की गई।
