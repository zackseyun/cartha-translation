  source_fidelity: 'The project English is itself a disclosed composite rather than a direct rendering of the supplied α-witness. The Hindi correctly retains that status in its footnote and preserves the unresolved reference of “both.” However, “लेवी के निकट रहो” means ‘remain/be near Levi,’ whereas the audit text and the cited προσεγγίζειν motif call for a movement/approach imperative: ‘draw near to Levi.’'
  naturalness: The register is clear, modern, and suitably dignified. “मेरे विरुद्ध उठो” is understandable but less idiomatic than “मेरे विरुद्ध न उठो.” The revised wording is smoother while retaining the elevated exhortative tone.
  terminology: लेवी and प्रभु are appropriate. “पूरा आदर” naturally conveys ‘honor in full’ without imposing an interpretation on “दोनों में.”
  issues:
  - severity: medium
    issue: ‘निकट रहो’ does not fully render ‘draw near.’
    rationale: It describes a static state rather than the imperative of approaching indicated by the English audit trail and by the cited Greek motif προσεγγίζειν. ‘लेवी के निकट आओ’ preserves the intended directional sense.
  - severity: low
    issue: Word order in ‘न मेरे विरुद्ध उठो’ is slightly awkward.
    rationale: ‘मेरे विरुद्ध न उठो’ is the more natural modern Hindi negative imperative and does not alter the meaning.
