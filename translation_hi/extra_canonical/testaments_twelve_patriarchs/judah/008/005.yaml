  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: hi
  text: वह विवाह की सज्जा से सजकर एनान[a] नगर में फाटक के पास बैठ गई। क्योंकि एमोरियों में यह नियम था कि विधवा स्त्री[b] सात दिन तक फाटक के पास बैठी रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में स्थान-नाम “एनान” है; अन्य परंपराओं में इसका रूप “एनैम” मिलता है।
    reason: यूनानी रूप और अधिक परिचित नाम-रूप के अंतर को स्पष्ट करना।
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “विधवा स्त्री” है। प्रस्तुत यूनानी वाक्य में “विवाह करने वाली” या “व्यभिचार में” के लिए कोई शब्द नहीं है।
    reason: अंग्रेज़ी परामर्श-पाठ से महत्वपूर्ण अंतर बताना और मूल पाठ की कठिनाई को सुरक्षित रखना।
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: दुल्हन के वस्त्रों और आभूषणों से सजकर
  rationale: यह पदबंध दुल्हन-संबंधी पूरी सज्जा का संकेत देता है; स्वाभाविक हिन्दी में वस्त्र और आभूषण दोनों व्यक्त किए गए हैं।
- source_word: ἐν Ἐνὰν τῇ πόλει
  choice: एनान नगर में
  rationale: स्थान-नाम का लिप्यंतरण उपलब्ध यूनानी रूप Ἐνάν के आधार पर किया गया है।
- source_word: πρὸς τὴν πύλην / παρὰ τὴν πύλην
  choice: फाटक के पास
  rationale: दोनों यूनानी पदबंध नगर के फाटक के निकट बैठने का स्थान बताते हैं।
- source_word: Νόμος
  choice: नियम
  rationale: यहाँ शब्द किसी औपचारिक धर्मशास्त्रीय व्यवस्था के बजाय एमोरियों की प्रचलित सामाजिक रीति या नियम को दर्शाता है।
- source_word: τὴν χηρεύουσαν
  choice: विधवा स्त्री
  rationale: यूनानी क्रिया χηρεύω का सीधा अर्थ विधवा होना या विधवा के रूप में रहना है; इसलिए अंग्रेज़ी परामर्श-पाठ के 'about to marry' को नहीं अपनाया गया।
- source_word: προκαθεσθαι
  choice: सबके सामने बैठी रहे
  rationale: शब्द में आगे या सार्वजनिक रूप से बैठने का भाव है; प्रसंग में फाटक पर दिखाई देने योग्य ढंग से बैठना अभिप्रेत है।
theological_decisions:
- issue: क्या इस नियम में व्यभिचार या वेश्यावृत्ति का उल्लेख है
  choice: मुख्य पाठ में ऐसा कोई उल्लेख नहीं जोड़ा गया
  alternative: अंग्रेज़ी POB के अनुसार ‘व्यभिचार में’ या ‘वेश्यावृत्ति के लिए’ जोड़ना
  rationale: प्रस्तुत यूनानी स्रोत में πορνεία या उसके समानार्थी कोई शब्द नहीं है। स्रोत से अनुपस्थित नैतिक या यौन अर्थ जोड़ना अनुचित होगा।
- issue: χηρεύουσαν की पहचान
  choice: विधवा स्त्री
  alternative: विवाह करने वाली स्त्री
  rationale: मूल यूनानी का प्रत्यक्ष अर्थ सुरक्षित रखा गया है, भले ही इससे प्रसंग में तनाव या पाठगत कठिनाई बनी रहे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रीति’ भी संभव था, पर νόμος के लिए ‘नियम’ चुना गया है। अनुवाद ने उपलब्ध यूनानी अंश से बाहर की पूर्वपीठिका—जैसे उसके यह जानने की बात कि यहूदा ऊपर जा रहा था—नहीं जोड़ी।
