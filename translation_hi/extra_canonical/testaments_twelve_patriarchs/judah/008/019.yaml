source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: hi
  text: मेरे बच्चो, पियक्कड़ ऐसा ही होता है, क्योंकि नशे में व्यक्ति किसी का भी लिहाज़ नहीं करता। देखो, नशे ने मुझे भी ऐसा बहकाया कि मैं नगर के जनसमूह के सामने लज्जित नहीं हुआ; क्योंकि सबकी आँखों के सामने मैं तामार की ओर मुड़ गया, मैंने बड़ा पाप किया और अपने पुत्रों की अशुद्धता का आवरण खोल दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने पुत्रों की अशुद्धता का आवरण खोल दिया” यूनानी का लगभग शाब्दिक अनुवाद है। यह पदबंध कठिन और अर्थ की दृष्टि से अनिश्चित है; इसका संबंध पुत्रों की अशुद्धता या लज्जा को प्रकट करने से हो सकता है।
    reason: कठिन यूनानी रूपक κάλυμμα ἀκαθαρσίας υἱῶν μου को मुख्य पाठ में सुरक्षित रखते हुए उसके अनिश्चित अर्थ का संकेत देना।
lexical_decisions:
- source_word: πάροινος
  choice: पियक्कड़
  rationale: यह शब्द मदिरा के वश में रहने वाले या मदिरा से उत्पन्न दुर्व्यवहार करने वाले व्यक्ति को सूचित करता है; आधुनिक हिन्दी में “पियक्कड़” इसका सहज और सशक्त समतुल्य है।
- source_word: ὁ μεθύων
  choice: मतवाला व्यक्ति
  rationale: वर्तमान कृदन्त नशे की दशा में व्यक्ति को दर्शाता है; यह πάροινος से शब्दगत भिन्नता भी बनाए रखता है।
- source_word: ἐπλάνησεν
  choice: बहकाया
  rationale: क्रिया का अर्थ भटका देना या पथ से हटा देना है। संदर्भ में कर्ता निहित रूप से मदिरा/नशा है, जिसे हिन्दी में स्पष्ट करना आवश्यक है।
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: मैं तामार की ओर मुड़ गया
  rationale: ἐκκλίνω में मार्ग से हटने या किसी ओर मुड़ने का भाव है। यह यौन संबंध को सीधे जोड़ने के बजाय यूनानी पाठ की अभिव्यक्ति और नैतिक संकेत दोनों को सुरक्षित रखता है।
- source_word: ἁμαρτίαν μεγάλην
  choice: बड़ा पाप
  rationale: यूनानी पद का सीधा, स्वाभाविक और धर्मवैचारिक रूप से तटस्थ अनुवाद।
- source_word: τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: अपने पुत्रों की अशुद्धता का परदा
  rationale: दुरूह यूनानी पदबंध को जानबूझकर लगभग शाब्दिक रखा गया है, क्योंकि उसका सटीक आशय अनिश्चित है और उसे केवल “लज्जा” कहने से मूल रूपक तथा अस्पष्टता मिट जाएगी।
theological_decisions:
- issue: पाप का स्वरूप और तामार की घटना
  choice: “तामार की ओर मुड़ गया” तथा “बड़ा पाप किया”
  alternative: “तामार के पास गया/उससे संबंध बनाया”
  rationale: मूल क्रिया संकेतात्मक है। अधिक स्पष्ट यौन भाषा कथात्मक संदर्भ से संभव है, पर यूनानी पाठ से अधिक निश्चित अर्थ आरोपित करेगी।
- issue: पुत्रों की अशुद्धता का परदा
  choice: मूल की अस्पष्ट और रूपकात्मक अभिव्यक्ति सुरक्षित रखी गई
  alternative: “अपने पुत्रों की लज्जा प्रकट कर दी”
  rationale: वैकल्पिक अनुवाद अर्थ को सहज बनाता है, पर κάλυμμα और ἀκαθαρσία दोनों की विशिष्ट शब्दावली तथा पदबंध की वास्तविक कठिनाई को दबा देता है।
- issue: अंग्रेज़ी परामर्श-पाठ में “परमेश्वर की आज्ञा का उल्लंघन”
  choice: इसे मुख्य पाठ में शामिल नहीं किया गया
  alternative: “मुझे भी परमेश्वर की आज्ञा का उल्लंघन करने को बहकाया”
  rationale: प्रदत्त यूनानी स्रोत में इस वाक्यांश का कोई समतुल्य नहीं है; स्रोत-आधारित अनुवाद में इसे जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन में आत्मीय “मेरे बच्चो” और चेतावनी के स्वर में “देखो” स्वाभाविक हिन्दी देते हैं। अंतिम वाक्यांश की असहजता मूल पाठ की दुरूहता के कारण संरक्षित है और पादटिप्पणी में स्पष्ट की गई है।
