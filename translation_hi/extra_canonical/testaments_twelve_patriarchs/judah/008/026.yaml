id: T12P.JUD.8.26
reference: Testament of Judah 8:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: hi
  text: और परमेश्वर के दूत ने मुझे दिखाया कि स्त्रियाँ राजा को वश में कर लेती हैं और निर्धन पर अधिकार जमाती हैं। वे राजा से उसकी महिमा, पुरुष से उसकी शक्ति, और निर्धन से उसकी दरिद्रता का थोड़ा-सा सहारा भी छीन लेती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: राजा को वश में कर लेती हैं
  rationale: κρατέω के नियंत्रण या वश में रखने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ τοῦ βασιλέως को आशयगत कर्म माना गया है।
- source_word: κατακυριεύουσιν
  choice: अधिकार जमाती हैं
  rationale: इसमें प्रभुत्व और कठोर नियंत्रण का भाव है; सामान्य ‘राज करती हैं’ की अपेक्षा यूनानी उपसर्ग κατά की तीव्रता बेहतर बनी रहती है।
- source_word: δόξαν
  choice: महिमा
  rationale: δόξα के प्रतिष्ठा, गौरव और वैभव संबंधी व्यापक अर्थ को बनाए रखता है।
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: पुरुष से उसकी शक्ति
  rationale: ἀνήρ को ‘पुरुष’ और δύναμις को ‘शक्ति’ रूप में सीधे प्रस्तुत करता है; इसे ‘बलवान पुरुष’ कहना पाठ में निहित विशेषण जोड़ देता।
- source_word: πτωχοῦ
  choice: निर्धन
  rationale: πτωχός का अर्थ गरीब या अभावग्रस्त व्यक्ति है; ‘निर्धन’ dignified और आधुनिक मानक हिन्दी है।
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  choice: उसकी दरिद्रता का थोड़ा-सा सहारा भी
  rationale: 'असहज परंतु अर्थपूर्ण यूनानी पदबंध को यथासंभव सुरक्षित रखता है: निर्धन के पास अपनी दरिद्र अवस्था में जो न्यूनतम सहारा है, वह भी छिन जाता है।'
theological_decisions:
- issue: वाक्य का स्त्रियों के विषय में सार्वकालिक या सार्वभौमिक दावा होना
  choice: ‘सदा’ या ‘सभी’ नहीं जोड़ा गया
  alternative: स्त्रियाँ सदा राजा और भिखारी दोनों पर शासन करती हैं
  rationale: उपलब्ध यूनानी पाठ में English POB के ‘forever’ अथवा ‘alike’ का स्पष्ट समकक्ष नहीं है। स्रोत से परे सार्वकालिक दावा जोड़ने से बचा गया।
- issue: राजा और पुरुष को एक ही व्यक्ति मानना
  choice: सूची को ‘राजा… पुरुष… निर्धन’ के तीन समानांतर पदों के रूप में रखा गया
  alternative: राजा से उसकी पुरुषोचित शक्ति और महिमा छीन लेती हैं
  rationale: विरामचिह्न संपादकीय हैं और यूनानी संरचना कुछ असमतल है। उपलब्ध पाठ δόξαν के बाद τοῦ ἀνδρός τὴν δύναμιν को एक पृथक समानांतर पद की तरह पढ़ने देता है; English POB भी यही विभाजन अपनाता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की कठोर सामान्यीकृत अभिव्यक्ति को नरम या व्याख्यायित नहीं किया गया, पर यूनानी में न मिलने वाले ‘सदा’ और ‘दोनों समान रूप से’ जैसे विस्तार भी नहीं जोड़े गए।
