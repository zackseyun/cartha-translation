source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:34 ('after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him') has no direct α-counterpart in Charles VIII-XXVI. The 'contend against Levi' / 'angel guides Levi' theme is the project's homiletic bridge between the wine-warning section and the Levi/Judah priesthood-vs-kingship discourse of Charles XXI; the α-text moves directly from Judah's Canaanite-marriage shame (XIX-XX) to the 'love Levi' command at XXI.1 without the lawlessness-prediction the project English supplies. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/034.yaml
  text: For I know that after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him and me the spirit of deceit has misled.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि मेरी मृत्यु के बाद तुम अधर्म करोगे और लेवी से संघर्ष करोगे; पर तुम उस पर प्रबल न हो सकोगे, क्योंकि प्रभु का दूत उसका मार्गदर्शन करता है, जबकि मुझे छल की आत्मा ने भटका दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पूरा वाक्य चार्ल्स (1908) के उपलब्ध α-यूनानी पाठ में प्रत्यक्ष रूप से नहीं मिलता। यह परियोजना में मदिरा-विषयक चेतावनी और लेवी तथा यहूदा के याजकत्व-राजत्व संबंधी विवेचन के बीच रखा गया एक उपदेशात्मक सेतु है; इसलिए यहाँ इसका अनुवाद परियोजना के अंग्रेज़ी पाठ के आधार पर दिया गया है।
    reason: पाठकों को प्रत्यक्ष मूल-भाषा साक्ष्य के अभाव और इस पद की परियोजनागत स्थिति के बारे में स्पष्ट बताना आवश्यक है।
lexical_decisions:
- source_word: 'No direct α-Greek counterpart; project English: “act lawlessly”'
  choice: अधर्म करोगे
  rationale: यह सहज आधुनिक हिन्दी में नैतिक और धार्मिक व्यवस्था के उल्लंघन—दोनों का भाव रखता है, बिना किसी अनुपलब्ध यूनानी पद का दावा किए।
- source_word: 'No direct α-Greek counterpart; project English: “contend against Levi”'
  choice: लेवी से संघर्ष करोगे
  rationale: ‘संघर्ष’ विरोध और टकराव दोनों व्यक्त करता है; यह केवल मौखिक विवाद तक अर्थ को सीमित नहीं करता।
- source_word: 'No direct α-Greek counterpart; project English: “prevail against him”'
  choice: उस पर प्रबल न हो सकोगे
  rationale: यह विजय या वर्चस्व प्राप्त न कर पाने का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में देता है।
- source_word: 'No direct α-Greek counterpart; project English: “the angel of the Lord guides him”'
  choice: प्रभु का दूत उसका मार्गदर्शन करता है
  rationale: ‘दूत’ धार्मिक परंपरा में स्वाभाविक है और ‘मार्गदर्शन’ निरंतर अगुवाई का भाव बनाए रखता है।
- source_word: 'No direct α-Greek counterpart; project English: “the spirit of deceit has misled me”'
  choice: मुझे छल की आत्मा ने भटका दिया है
  rationale: यह व्यक्तिकृत ‘आत्मा’ और छल द्वारा पथभ्रष्ट किए जाने की धार्मिक-नैतिक भाषा को सुरक्षित रखता है।
theological_decisions:
- issue: लेवी की सफलता और यहूदा के भटकाव के बीच विरोध
  choice: वाक्य के दोनों पक्षों को ‘जबकि’ से स्पष्ट विरोध में रखा गया है।
  alternative: दो स्वतंत्र कारणवाचक वाक्य बनाना।
  rationale: यह प्रभु के दूत द्वारा लेवी के मार्गदर्शन और छल की आत्मा द्वारा वक्ता के भटकाव के बीच मौजूद धार्मिक तनाव को सुरक्षित रखता है।
- issue: ‘छल की आत्मा’ की सत्ता या प्रकृति
  choice: ‘आत्मा’ को यथावत रखा गया है।
  alternative: इसे केवल ‘छल’ या ‘भ्रम’ कहकर अमूर्त बनाना।
  rationale: परियोजना के अंग्रेज़ी पाठ में व्यक्तिकृत आध्यात्मिक अभिकर्ता का संकेत है; अनुवाद उसकी प्रकृति को और अधिक परिभाषित नहीं करता।
- issue: प्रत्यक्ष यूनानी आधार का अभाव
  choice: मुख्य पाठ का अनुवाद परियोजना के अंग्रेज़ी पाठ से किया गया है और पाठालोचनात्मक स्थिति पाद-टिप्पणी में स्पष्ट की गई है।
  alternative: इस पद को बिना सूचना के प्रत्यक्ष यूनानी अनुवाद के रूप में प्रस्तुत करना या पूर्णतः हटा देना।
  rationale: इससे परियोजना-पद सुरक्षित रहता है, पर α-साक्ष्य के विषय में भ्रामक दावा नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और धार्मिक कथन के अनुरूप है। अनुपलब्ध यूनानी मूल का पुनर्निर्माण नहीं किया गया, और अंग्रेज़ी परियोजना-पाठ की अर्थगत संरचना को स्वाभाविक हिन्दी में रखा गया है।
