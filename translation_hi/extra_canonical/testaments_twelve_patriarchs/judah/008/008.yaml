  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:8 (the 'I will send you a kid from the flock... will you give me a pledge until you send it?' exchange) has no direct counterpart in the Charles α-text of XII.4, which collapses Tamar's question 'Τί μοι δώσεις;' directly into Judah handing over the pledges. The kid-from-the-flock question is drawn from the broader Genesis 38 tradition that informs the project English; α witnesses no Greek for this specific exchange. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/008.yaml
  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: hi
  text: तब मैंने कहा, “मैं झुंड में से बकरी का एक बच्चा तुम्हारे पास भेज दूँगा।” उसने कहा, “जब तक तुम उसे भेज न दो, क्या तुम मुझे कोई जमानत दोगे?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह संवाद उपलब्ध यूनानी α-पाठ में नहीं मिलता; वहाँ तामार के प्रश्न के बाद यहूदा सीधे बंधक की वस्तुएँ दे देता है। यह पंक्ति उत्पत्ति 38:17 में सुरक्षित व्यापक परंपरा पर आधारित है।
    reason: प्रत्यक्ष यूनानी आधार के अभाव और प्रयुक्त मूल-भाषाई आधार को पारदर्शी बनाना।
lexical_decisions:
- source_word: Genesis 38:17 גְּדִי־עִזִּים
  choice: बकरी का एक बच्चा
  rationale: परियोजना-पाठ की यह पंक्ति उपलब्ध यूनानी α-पाठ में नहीं है; इसके निकटतम मूल-भाषाई साक्ष्य, उत्पत्ति 38:17 के इब्रानी पदबंध, का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: Genesis 38:17 עֵרָבוֹן
  choice: बंधक
  rationale: ऐसी वस्तु जिसे वचन पूरा होने तक जमानत के रूप में रखा जाए; ‘बंधक’ संवाद के कानूनी और अस्थायी भाव को बनाए रखता है।
- source_word: Genesis 38:17 עַד שָׁלְחֶךָ
  choice: जब तक तुम उसे भेजो
  rationale: इब्रानी की समय-संबंधी अस्पष्टता और भावी प्रेषण का अर्थ बनाए रखा गया है।
theological_decisions:
- issue: इस वाक्य का यूनानी α-साक्ष्य में अभाव
  choice: परियोजना के अपेक्षित पद को उत्पत्ति 38:17 के इब्रानी परंपरागत साक्ष्य के आधार पर अनूदित किया और पाठालोचनात्मक टिप्पणी जोड़ी
  alternative: वाक्य को छोड़ देना, क्योंकि Charles α-पाठ में इसका सीधा प्रतिरूप नहीं है
  rationale: दिए गए पद की अनुवाद-आवश्यकता पूरी करते हुए स्रोत-साक्ष्य की वास्तविक स्थिति स्पष्ट रखना आवश्यक है; टिप्पणी पाठ को यूनानी α-पाठ का भाग बताने से बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद सरल, स्वाभाविक और गरिमापूर्ण रखा गया है। ‘बकरी का एक बच्चा’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘बंधक’ मूल प्रसंग की जमानत-संबंधी धारणा को संक्षेप में व्यक्त करता है।
