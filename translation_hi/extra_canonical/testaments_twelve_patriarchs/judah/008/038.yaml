source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: hi
  text: क्योंकि परमेश्वर का याजकपद सांसारिक राजसत्ता से इसी प्रकार श्रेष्ठ है—जब तक कि वह पापों के कारण प्रभु से दूर होकर पतित न हो जाए और सांसारिक राजसत्ता के अधीन न हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: श्रेष्ठ है
  rationale: यह क्रिया पद, प्रतिष्ठा या अधिकार में बढ़कर होने का भाव देती है; यहाँ तुलनात्मक श्रेष्ठता स्वाभाविक हिन्दी में व्यक्त की गई है।
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: परमेश्वर का याजकपद
  rationale: ‘याजकपद’ संस्था, पद और अधिकार—तीनों के सामूहिक भाव को बनाए रखता है।
- source_word: τῆς ἐπιγείου βασιλείας
  choice: सांसारिक राजसत्ता
  rationale: ἐπίγειος का अर्थ पृथ्वी से संबंधित/सांसारिक है और βασιλεία यहाँ भूभाग से अधिक शासन-सत्ता को सूचित करती है।
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: प्रभु से दूर होकर पतित न हो जाए
  rationale: ἐκπίπτω में अपने स्थान या संबंध से गिर जाने का भाव है; ‘दूर होकर पतित’ स्रोत के संबंध-विच्छेद और पतन दोनों को व्यक्त करता है।
- source_word: κυριευθῇ
  choice: अधीन न कर दिया जाए
  rationale: निष्क्रिय रूप किसी दूसरी सत्ता द्वारा वश में किए जाने या प्रभुत्व में लाए जाने को व्यक्त करता है।
theological_decisions:
- issue: याजकपद की राजसत्ता पर श्रेष्ठता सशर्त है या अपवाद-वाक्य है
  choice: श्रेष्ठता के कथन के साथ पापजनित पतन और अधीनता का स्पष्ट अपवाद रखा गया है
  alternative: श्रेष्ठता को निरपेक्ष बताकर बाद के खंड को केवल ऐतिहासिक घटना समझना
  rationale: ἐὰν μή स्रोत में वास्तविक शर्त/अपवाद प्रस्तुत करता है; अनुवाद इसे धर्मवैचारिक रूप से समतल नहीं करता।
- issue: ‘प्रभु’ की पहचान
  choice: ‘प्रभु’ ही रखा गया है
  alternative: ‘परमेश्वर’ से स्पष्ट करना
  rationale: यूनानी में Κυρίου है; संदर्भ संभावित पहचान सुझा सकता है, पर अनुवाद स्रोत की पदावली और उसकी संभावित अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली। अंग्रेज़ी परामर्श-पाठ में जोड़ी गई ‘जैसे स्वर्ग पृथ्वी से ऊँचा है’ उपमा उपलब्ध यूनानी पाठ में नहीं है, इसलिए उसे मुख्य पाठ में नहीं लिया गया।
