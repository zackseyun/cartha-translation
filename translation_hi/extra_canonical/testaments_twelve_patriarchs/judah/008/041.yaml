source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: hi
  text: क्योंकि उसी के कारण प्रभु तुममें से राजसत्ता को और लेवी में से याजकपद को चुनेगा, ताकि प्रभु सब राष्ट्रों और इस्राएल के वंश के लिए हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पूरे वाक्य का उपलब्ध α-यूनानी पाठ में कोई प्रत्यक्ष समकक्ष नहीं है। यह परियोजना में यहूदा 22:2–3 और 24:6 के विषयों—इस्राएल का उद्धार तथा प्रभु को पुकारने वाले सब लोगों का न्याय और उद्धार—का समन्वित कथन है।
    reason: पाठक को स्पष्ट करना आवश्यक है कि मुख्य पाठ किसी एक संरक्षित यूनानी पद का सीधा अनुवाद नहीं, बल्कि परियोजना का समन्वय है।
lexical_decisions:
- source_word: because of him
  choice: उसी के कारण
  rationale: सर्वनाम का संदर्भ मूल परियोजना-पाठ में स्पष्ट नहीं है; इसलिए उसकी वास्तविक अस्पष्टता बनाए रखी गई है।
- source_word: kingship
  choice: राजसत्ता
  rationale: यह शब्द केवल किसी एक राजा के पद के बजाय शासनाधिकार और राजकीय संस्था—दोनों का भाव व्यक्त करता है।
- source_word: priesthood
  choice: याजकपद
  rationale: यह लेवी से संबद्ध धार्मिक पद और कार्य को सहज, प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: the race of Israel
  choice: इस्राएल का वंश
  rationale: ‘वंश’ सामूहिक वंशपरंपरा का स्वाभाविक हिन्दी रूप है और अनावश्यक आधुनिक जातीय अर्थों से बचाता है।
theological_decisions:
- issue: यह कथन राजसत्ता को यहूदा और याजकपद को लेवी से जोड़ता है।
  choice: इन दोनों भूमिकाओं को अलग-अलग वंशों से जोड़ने वाला कथन यथावत रखा गया है।
  alternative: इसे किसी बाद की विशिष्ट मसीही या संप्रदायगत व्यवस्था के रूप में स्पष्ट करना।
  rationale: उपलब्ध साक्ष्य ऐसी अतिरिक्त व्याख्या को अनिवार्य नहीं करता; अनुवाद को परियोजना-पाठ के धर्मवैचारिक तनाव से आगे नहीं जाना चाहिए।
- issue: ‘प्रभु सब राष्ट्रों और इस्राएल के वंश के लिए हो’ का संबंध और आशय खुला है।
  choice: ‘के लिए हो’ रखा गया है।
  alternative: ‘पर राज्य करे’, ‘उद्धारकर्ता हो’ या ‘परमेश्वर हो’ जैसे अधिक निश्चित पद जोड़ना।
  rationale: परियोजना के अंग्रेज़ी पाठ में संबंध अस्पष्ट है और प्रत्यक्ष यूनानी समकक्ष अनुपस्थित है; इसलिए अर्थ को किसी एक धर्मवैचारिक निष्कर्ष तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसी के कारण’ तथा ‘के लिए हो’ में मौजूद संदर्भगत और धर्मवैचारिक अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
