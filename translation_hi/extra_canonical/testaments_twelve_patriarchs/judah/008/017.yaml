base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: hi
  text: क्योंकि यौन-अनैतिकता की आत्मा मन को सुख देने के लिए दाखमधु को अपने सेवक के रूप में रखती है; क्योंकि ये दोनों मनुष्य की समझ को दूर कर देते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: व्यभिचार की आत्मा
  rationale: यूनानी संबंधवाचक पदबंध को निकटता से रखते हुए πορνεία के व्यापक यौन-अनैतिकता संबंधी अर्थ को पारंपरिक और स्वाभाविक हिंदी ‘व्यभिचार’ से व्यक्त किया गया है।
- source_word: τὸν οἶνον ὡς διάκονον ἔχει
  choice: दाखमधु को ... अपना सेवक बनाती है
  rationale: διάκονος का मूल सेवक-संबंधी रूपक बनाए रखा गया है; ‘बनाती है’ हिंदी में ἔχει ὡς की कार्यात्मक शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πρὸς τὴν ἡδονὴν τοῦ νοός
  choice: मन के सुख के लिए
  rationale: νοῦς को यहाँ मानसिक चेतना के अर्थ में ‘मन’ और ἡδονή को ‘सुख’ कहा गया है, बिना इसे केवल शारीरिक आनंद तक सीमित किए।
- source_word: ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: मनुष्य की समझ को भटका देते हैं
  rationale: ἀφίστημι में हटाने या विमुख करने का भाव है; ‘भटका देते हैं’ समझ को सही स्थिति या दिशा से दूर करने की क्रिया को सहज हिंदी में संप्रेषित करता है।
theological_decisions:
- issue: ‘व्यभिचार की आत्मा’ का व्यक्तिकरण
  choice: व्यक्तिकृत भाषा को यथावत रखा गया
  alternative: ‘व्यभिचारी प्रवृत्ति’
  rationale: मूल पाठ πνεῦμα कहता है और दाखमधु को उसका सेवक बताता है; इसे केवल मनोवैज्ञानिक प्रवृत्ति बना देना मूल की संभावित आध्यात्मिक और अलंकारिक अस्पष्टता को समाप्त कर देता।
- issue: ‘ये दोनों’ का संदर्भ
  choice: सर्वनाम को अस्पष्टता सहित रखा गया
  alternative: ‘व्यभिचार और दाखमधु’
  rationale: यूनानी τὰ δύο ταῦτα स्पष्ट नाम दोहराए बिना निकटवर्ती दो तत्वों की ओर संकेत करता है; अनुवाद में भी वही संदर्भगत तनाव सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘दाखमधु’ ने οἶνος का प्राचीन धार्मिक-साहित्यिक रंग बनाए रखा है, जबकि वाक्य-विन्यास को स्वाभाविक हिंदी के अनुरूप किया गया है।
