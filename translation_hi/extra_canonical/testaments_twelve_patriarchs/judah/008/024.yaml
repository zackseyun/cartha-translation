id: T12P.JUD.8.24
reference: Testament of Judah 8:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα γὰρ τὴν ῥάβδον μου, τουτέστι τὸ στήριγμα τῆς ἐμῆς φυλῆς, καὶ τὴν ζώνην μου, τουτέστιν τὴν δύναμιν, καὶ τὸ διάδημα, τουτέστιν τὴν δόξαν τῆς βασιλείας μου.
  language: Greek
  note: Greek from Charles XV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: hi
  text: क्योंकि मैंने अपनी लाठी दे दी—अर्थात् अपने गोत्र का सहारा; और अपना कमरबंद—अर्थात् अपनी शक्ति; और अपना राजमुकुट—अर्थात् अपने राज्य का गौरव।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: लाठी
  rationale: यह सामान्यतः हाथ में रखी जाने वाली लाठी या अधिकार-दंड को सूचित कर सकता है; प्रसंग स्वयं इसे गोत्र के ‘सहारे’ के रूप में स्पष्ट करता है, इसलिए ‘लाठी’ मूल रूपक को सहज रूप में बनाए रखता है।
- source_word: στήριγμα
  choice: सहारा
  rationale: गोत्र को स्थिर रखने वाले आधार या अवलंब का भाव आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ζώνην
  choice: कमरबंद
  rationale: प्राचीन परिधान में कमर पर बाँधी जाने वाली वस्तु का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: δύναμιν
  choice: शक्ति
  rationale: मूल शब्द की सामर्थ्य, बल और क्षमता की व्यापक अर्थ-सीमा को सुरक्षित रखता है।
- source_word: διάδημα
  choice: राजमुकुट
  rationale: διάδημα राजसत्ता के चिह्न को दर्शाता है; ‘राजमुकुट’ सामान्य पाठक के लिए स्पष्ट है और अगले वाक्यांश ‘मेरे राज्य’ से मेल खाता है।
- source_word: δόξαν τῆς βασιλείας μου
  choice: अपने राज्य का गौरव
  rationale: δόξα के सम्मान, वैभव और गौरव के भाव को ‘गौरव’ में संक्षेपित किया गया है; βασιλεία यहाँ यहूदा के राजत्व/राज्य से संबंधित है।
theological_decisions:
- issue: तीन वस्तुओं की प्रतीकात्मक व्याख्या
  choice: मूल पाठ के ‘अर्थात्’ वाले तीनों स्पष्टीकरण ज्यों के त्यों बनाए रखे गए हैं।
  alternative: प्रतीकों का अतिरिक्त नैतिक, मसीही या संप्रदायगत अर्थ खोलना।
  rationale: यूनानी पाठ स्वयं लाठी, कमरबंद और राजमुकुट की व्याख्या क्रमशः सहारे, शक्ति और राज्य के गौरव के रूप में करता है; इससे आगे जाना पाठ में बाहरी धर्मवैज्ञानिक निष्कर्ष जोड़ता।
- issue: βασιλεία का अर्थ
  choice: राज्य
  alternative: राजसत्ता
  rationale: ‘राज्य का गौरव’ हिन्दी में स्वाभाविक है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है; यद्यपि मूल में शासन या राजत्व का भाव भी संभव है, प्रसंग किसी एक संकीर्ण अर्थ को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर यूनानी संरचना को अर्धविराम और दीर्घ विराम-चिह्नों द्वारा सुरक्षित रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
