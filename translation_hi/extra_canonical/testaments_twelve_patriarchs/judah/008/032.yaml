source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: hi
  text: मेरे बच्चो, धन का लोभ मूर्तिपूजा की ओर ले जाता है, क्योंकि धन के भ्रम में लोग जो देवता नहीं हैं, उन्हें देवता कहते हैं; और यह लोभ जिस किसी में होता है, उसे सुध-बुध खो बैठने की दशा में डाल देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंग्रेज़ी POB के विषयगत सार में यह भी कहा गया है कि मदिरा यौन अनैतिकता की ओर ले जाती है और ये बातें मन को परमेश्वर की व्यवस्था से फेर देती हैं। प्रस्तुत यूनानी पाठ में यहाँ केवल धनलोभ, मूर्तिपूजा, अस्तित्वहीन देवताओं को देवता कहना, और सुध-बुध खोने की दशा का कथन है।
    reason: अंग्रेज़ी POB audit trail में जोड़ा गया विषयगत सार उपलब्ध यूनानी पाठ में नहीं है; इसलिए उसे मूल पाठ का भाग बनाए बिना पारदर्शी रूप से सूचित किया गया है।
lexical_decisions:
- source_word: Τέκνα μου
  choice: मेरे बच्चो
  rationale: पितृसुलभ प्रत्यक्ष संबोधन को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ἡ φιλαργυρία
  choice: धन का लोभ
  rationale: शाब्दिक अर्थ ‘चाँदी/धन से प्रेम’ है; ‘धन का लोभ’ सामान्य पाठक के लिए स्वाभाविक है और नैतिक आशय स्पष्ट रखता है।
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: मूर्तिपूजा की ओर ले जाता है
  rationale: दिशा और परिणाम व्यक्त करने वाली यूनानी रचना का सीधा तथा सहज अनुवाद।
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: धन के मोह में
  rationale: πλάνη में भ्रम, भटकाव और धोखे का भाव है; ‘मोह’ धन से उत्पन्न विवेकभ्रंश को संक्षेप में व्यक्त करता है।
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: उन्हें देवता कहते हैं जो वास्तव में देवता नहीं हैं
  rationale: झूठे देवताओं के विषय में मूल का स्पष्ट निषेध सुरक्षित रखा गया है।
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: सुध-बुध खो देने की दशा में पहुँचा देता है
  rationale: ἔκστασις का मूल भाव स्वयं से बाहर हो जाना अथवा सामान्य मानसिक स्थिति से हट जाना है; यहाँ नकारात्मक संदर्भ में मानसिक विवेकभ्रंश व्यक्त किया गया है, न कि धार्मिक परमानंद।
theological_decisions:
- issue: अंग्रेज़ी POB में दाखमधु और यौन अनैतिकता का अतिरिक्त कथन
  choice: इसे मुख्य पाठ में शामिल नहीं किया गया
  alternative: ‘दाखमधु यौन अनैतिकता की ओर ले जाता है’ जोड़ना
  rationale: प्रस्तुत यूनानी स्रोत में यह उपवाक्य नहीं है; स्रोत-साक्ष्य को प्राथमिकता देते हुए विषयगत संकलन से आए अतिरिक्त कथन को मूल वचन के रूप में नहीं जोड़ा गया।
- issue: ἔκστασις की व्याख्या
  choice: नकारात्मक विवेकभ्रंश/सुध-बुध खोना
  alternative: ‘परमानंद’ या ‘आत्मिक समाधि’
  rationale: धनलोभ के दुष्परिणाम वाले प्रसंग में सकारात्मक धार्मिक अनुभव का अर्थ असंगत होगा; फिर भी विशिष्ट मनोवैज्ञानिक अवस्था थोपे बिना व्यापक अर्थ रखा गया है।
- issue: θεούς का हिन्दी रूप
  choice: देवता
  alternative: ईश्वर
  rationale: बहुवचन और मूर्तिपूजा के संदर्भ को ‘देवता’ अधिक ठीक प्रकार से व्यक्त करता है और एकमात्र परमेश्वर के लिए प्रयुक्त पद से भेद बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठकों के लिए सुबोध। वाक्य की चेतावनीपूर्ण और पितृसुलभ शैली सुरक्षित रखी गई है; अनावश्यक संस्कृतनिष्ठ शब्दावली से बचा गया है।
