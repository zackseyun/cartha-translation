id: T12P.JUD.8.21
reference: Testament of Judah 8:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ αὕτη ἐστὶν ἡ σύνεσις τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ, πίνει.
  language: Greek
  note: Greek from Charles XIV.7b (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: hi
  text: 'और दाखमधु पीने में विवेक यही है: जब तक उसमें मर्यादा-बोध है, वह पीता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνεσις
  choice: समझदारी
  rationale: यहाँ इसका अर्थ मदिरापान में विवेकपूर्ण संयम है; ‘समझदारी’ आधुनिक और सहज हिन्दी में इसे व्यक्त करता है।
- source_word: οἰνοποσίας
  choice: दाखमधु पीने
  rationale: यह शब्द दाखमधु के सेवन को सूचित करता है; ‘दाखमधु’ प्राचीन संदर्भ बनाए रखता है और ‘पीने’ से वाक्य स्वाभाविक बनता है।
- source_word: αἰδῶ
  choice: लज्जा-बोध
  rationale: ग्रीक शब्द मर्यादा, संकोच और लज्जा की नैतिक चेतना को समेटता है; ‘लज्जा-बोध’ केवल बाहरी शर्म के बजाय उस आंतरिक संवेदना को व्यक्त करता है।
- source_word: ἕως ὅτε
  choice: जब तक
  rationale: मूल पाठ में दी गई अवधि अथवा सीमा को सीधे बनाए रखता है।
- source_word: πίνει
  choice: वह पी सकता है
  rationale: शाब्दिक रूप ‘वह पीता है’ है, किंतु प्रसंग में यह विवेकपूर्ण मदिरापान की अनुमेय सीमा बताता है; इसलिए हिन्दी में निहित अनुमोदन को स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: मदिरापान की अनुमति और उसकी नैतिक सीमा
  choice: 'पाठ को सीमित अनुमति के रूप में प्रस्तुत किया गया है: लज्जा-बोध बने रहने तक पी सकता है।'
  alternative: इसे मदिरापान की पूर्ण मनाही या निर्बंध अनुमति के रूप में प्रस्तुत करना।
  rationale: ग्रीक न तो पूर्ण निषेध करता है, न निर्बंध स्वीकृति देता है; वह αἰδώς को सीमा बनाता है।
- issue: अंग्रेज़ी परामर्श-पाठ की विस्तृत व्याख्या
  choice: केवल ग्रीक में प्रत्यक्ष रूप से मौजूद संक्षिप्त शर्त रखी गई है।
  alternative: ‘भटककर निर्लज्जता में न जाए’ जैसे अंग्रेज़ी विस्तार को मुख्य पाठ में जोड़ना।
  rationale: मूल ग्रीक में यह विस्तार अलग शब्दों में मौजूद नहीं है; उसका आशय αἰδῶ में निहित हो सकता है, पर उसे स्वतंत्र उपवाक्य बनाना स्रोत से अधिक स्पष्टता जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को मूल ग्रीक की संक्षिप्तता के निकट रखा गया है; अंग्रेज़ी POB के व्याख्यात्मक विस्तार को आधार-पाठ पर आरोपित नहीं किया गया।
