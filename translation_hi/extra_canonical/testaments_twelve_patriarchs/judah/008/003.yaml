  text: Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ οὐκ ἀφῆκεν. Ἐπονηρεύσατο γὰρ, ὅτι οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή.
  language: Greek
