base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: hi
  text: मैं शेलह को भी उसे देना चाहता था, लेकिन उसकी माँ ने ऐसा नहीं होने दिया। उसने यह दुष्टता इसलिए की कि वह स्त्री कनान की बेटियों में से नहीं थी, जबकि वह स्वयं कनानी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में दोनों जगह स्त्रीलिंग सर्वनाम हैं। प्रसंग के अनुसार पहली स्त्री तामार और दूसरी शेलह की माँ है; अर्थात तामार कनानी नहीं थी, जबकि शेलह की माँ कनानी थी।
    reason: सर्वनामों का संदर्भ मूल में अंतर्निहित है और बिना नाम लिए आधुनिक हिन्दी में अस्पष्ट हो सकता है।
lexical_decisions:
- source_word: Ἤθελον
  choice: मैं ... चाहता था
  rationale: अपूर्ण भूतकाल यहाँ बीते समय की इच्छा या मंशा व्यक्त करता है।
- source_word: τὸν Σηλὼμ δοῦναι αὐτῇ
  choice: शेलह को भी उसे देना
  rationale: मूल की विवाह-संबंधी संक्षिप्त अभिव्यक्ति को बनाए रखा गया है; प्रसंग में अर्थ पत्नी के रूप में देना है।
- source_word: οὐκ ἀφῆκεν
  choice: ऐसा नहीं होने दिया
  rationale: शाब्दिक अर्थ ‘अनुमति नहीं दी’ है; हिन्दी में इस प्रसंग के लिए यह स्वाभाविक रूप है।
- source_word: Ἐπονηρεύσατο
  choice: उसने यह दुष्टता ... की
  rationale: क्रिया नैतिक रूप से बुरा या दुष्ट व्यवहार करने का बोध देती है; इसे केवल ‘नापसंद किया’ जैसा हल्का नहीं किया गया।
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: कनान की बेटियों
  rationale: मूल की सामूहिक और वंश-सूचक अभिव्यक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: प्रदान किए गए यूनानी पाठ और अंग्रेज़ी POB में कथ्य का अंतर
  choice: 'यूनानी पाठ का कथ्य अनूदित किया गया: यहूदा शेलह को तामार को देना चाहता था, पर शेलह की माँ ने रोका'
  alternative: 'अंग्रेज़ी POB का कथ्य: यहूदा ने शेलह को नहीं दिया और इसे अपने ऊपर प्रभु के न्याय से जोड़ा'
  rationale: निर्देश के अनुसार मूल-भाषा स्रोत को प्राथमिकता दी गई। अंग्रेज़ी पाठ में आए तिम्ना, याकूब, यूसुफ और दैवी न्याय का उल्लेख इस दिए हुए यूनानी पद में नहीं है, इसलिए उसे आयात नहीं किया गया।
- issue: स्त्रीलिंग सर्वनामों के संदर्भ
  choice: पहले स्त्री-संदर्भ को ‘वह स्त्री’ और अंतिम को ‘वह स्वयं’ रखा गया, तथा पादटिप्पणी में संभावित संदर्भ स्पष्ट किया गया
  alternative: मुख्य पाठ में सीधे ‘तामार’ और ‘शेलह की माँ’ लिख देना
  rationale: यूनानी में नाम दोहराए नहीं गए हैं। अर्थ-सुगमता देते हुए मूल की सर्वनामगत अस्पष्टता को पूरी तरह मिटाया नहीं गया।
