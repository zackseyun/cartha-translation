review_pass:
  verdict: revise
  source_fidelity: Draft correctly preserves the progression from sexual immorality through unperceived exposure and loss of honor to a king's loss of kingship through enslavement to πορνεία. However, “नंगा किए जाते समय भी इसका बोध नहीं करता” adds an awkward temporal framing and leaves “इसका” without a clear antecedent. “राजपद” is possible, but “राजत्व” more directly represents τῆς βασιλείας (‘kingship/royal rule’) and retains the source's abstract contrast with slavery.
  naturalness: The draft is generally clear and suitably grave. “अनावृत किए जाते हुए भी उसे इसका एहसास नहीं होता” is more idiomatic than “नंगा किए जाते समय भी इसका बोध नहीं करता,” while retaining the deliberately stark stripping/exposure image. “प्रतिष्ठा खोने पर भी” naturally expresses ἀδοξῶν without narrowing it to a single act of insult.
  terminology: Because Greek πορνεύω/πορνεία has a wider sense than Hindi “व्यभिचार,” which commonly denotes adultery specifically, “यौन अनैतिकता” is the more source-inclusive modern Hindi rendering. The slavery metaphor and the personal concluding claim are retained.
  issues:
  - severity: medium
    issue: “व्यभिचार” can be read too narrowly.
    rationale: πορνεύω and πορνεία denote sexual immorality broadly; “व्यभिचार” in current Hindi often specifically means adultery. “यौन अनैतिकता” avoids restricting the source's scope.
  - severity: low
    issue: The first clause is syntactically awkward and “इसका” is unclear.
    rationale: γυμνούμενος means being stripped/bared; the revised wording retains this image while giving “इसका” a natural referent in Hindi.
  - severity: low
    issue: “राजपद” is somewhat narrower than βασιλεία.
    rationale: The Greek denotes kingship/royal rule, not merely an office. “राजत्व” better preserves the abstraction and the king/slave reversal.
  revised_text: जो यौन अनैतिकता करता है, वह अनावृत किए जाते हुए भी उसे इसका एहसास नहीं होता, और प्रतिष्ठा खोने पर भी लज्जित नहीं होता। क्योंकि यदि कोई राजा भी हो और यौन अनैतिकता करे, तो वह यौन अनैतिकता का दास बनकर अपने राजत्व से वंचित हो जाता है—जैसा कि मैंने स्वयं भी सहा।
  revised_footnotes: []
