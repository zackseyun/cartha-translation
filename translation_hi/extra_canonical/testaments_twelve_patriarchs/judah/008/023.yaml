id: T12P.JUD.8.23
reference: Testament of Judah 8:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a servant to sexual immorality, as I myself also suffered.
translation:
  language: hi
  text: जो यौन अनैतिकता करता है, वह अनावृत किए जाते हुए भी उसे इसका एहसास नहीं होता, और प्रतिष्ठा खोने पर भी लज्जित नहीं होता। क्योंकि यदि कोई राजा भी हो और यौन अनैतिकता करे, तो वह यौन अनैतिकता का दास बनकर अपने राजत्व से वंचित हो जाता है—जैसा कि मैंने स्वयं भी सहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας / πορνεύῃ
  choice: जो व्यभिचार करता है / व्यभिचार करे
  rationale: πορνεύω यौन अनैतिकता में लिप्त होने को दर्शाता है। ‘व्यभिचार’ संक्षिप्त, गरिमापूर्ण और प्रसंग में व्यक्ति को वासना का दास बनाने वाले आचरण के लिए स्वाभाविक हिन्दी है; इसे केवल कानूनी अर्थ में परस्त्रीगमन तक सीमित करके नहीं पढ़ना चाहिए।
- source_word: γυμνούμενος / γυμνοῦται
  choice: नंगा किए जाते समय / वंचित कर दिया जाता है
  rationale: पहले प्रयोग में देहगत और रूपकात्मक अनावृत्ति की तीखी छवि बनाए रखी गई है। दूसरे में साथ आए संबंधकारक τῆς βασιλείας के कारण ‘राजपद से वंचित’ स्वाभाविक हिन्दी में ‘राजत्व से उतार/खाली कर दिया जाना’ व्यक्त करता है।
- source_word: οὐκ αἰσθάνεται
  choice: इसका बोध नहीं करता
  rationale: αἰσθάνομαι का अर्थ अनुभव करना, ध्यान देना या समझ पाना हो सकता है। ‘बोध नहीं करता’ इस अर्थ-विस्तार को रखता है और केवल आर्थिक ‘हानि जानने’ का विचार आरोपित नहीं करता।
- source_word: ἀδοξῶν
  choice: अपमानित होने पर
  rationale: शाब्दिक भाव गौरव या प्रतिष्ठा खोने का है। ‘अपमानित होने पर’ साधारण पाठक के लिए स्पष्ट है और अगले ‘लज्जित नहीं होता’ से स्वाभाविक रूप से जुड़ता है।
- source_word: τῆς βασιλείας
  choice: अपने राजपद से
  rationale: यहाँ βασιλεία राजा की सत्ता, पद या राजकीय प्रतिष्ठा को सूचित करती है। ‘राजपद’ व्यक्ति की अधीनता और पदच्युति के विरोधाभास को साफ रखता है।
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: व्यभिचार का दास बनकर
  rationale: 'δουλεύω की दासत्व-छवि को सीधे सुरक्षित रखा गया है: राजा होते हुए भी वह यौन अनैतिकता की सेवा और अधीनता में आ जाता है।'
- source_word: ὡς κἀγὼ ἔπαθον
  choice: जैसा कि मैंने स्वयं भी भोगा
  rationale: πάσχω का अर्थ सहना या अनुभव करना है। ‘भोगा’ परिणाम को निजी अनुभव के रूप में व्यक्त करता है, बिना यह तय किए कि संकेत किस विशिष्ट घटना की ओर है।
theological_decisions:
- issue: व्यभिचार के परिणाम को नैतिक अचेतनता और दासत्व के रूप में प्रस्तुत करना
  choice: मूल की अनावृत्ति, अपमान और दासत्व की छवियाँ बनाए रखी गईं
  alternative: इसे केवल प्रतिष्ठा या सांसारिक हानि के सामान्य कथन में बदलना
  rationale: 'यूनानी पाठ नैतिक विडंबना रखता है: अपराधी अपनी अनावृत्ति नहीं पहचानता, और राजा होकर भी उसी पाप का दास हो जाता है। इसे नरम करना पाठ की नैतिक और धर्मवैचारिक तीक्ष्णता घटाता।'
- issue: राजत्व खोने का स्वरूप
  choice: ‘राजपद से वंचित कर दिया जाता है’
  alternative: ‘उसका उद्धार खो जाता है’ या ‘परमेश्वर उसका राज्य छीन लेता है’
  rationale: पाठ राजकीय पद/सत्ता की बात करता है; उद्धार अथवा प्रत्यक्ष दैवी कर्ता जोड़ना मूल से परे किसी विशेष धर्मसिद्धांत को आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, चेतावनीपूर्ण वाक्य-विन्यास अपनाया गया है। ‘नंगा किए जाते’ की असुविधाजनक किंतु जानबूझकर तीखी छवि मूल के γυμνόω को सुरक्षित रखती है। ‘राजत्व’ की अपेक्षा ‘राजपद’ आम पाठक के लिए अधिक सहज है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
