  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: hi
  text: वह परमेश्वर के लिए बलियाँ चढ़ाने में बाधा डालता है और परमेश्वर को धन्य कहना स्मरण नहीं करता। भविष्यद्वक्ता के बोलने पर वह नहीं सुनता, और भक्ति की बातों से चिढ़ता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ ἐμποδίζει
  choice: वह परमेश्वर को बलि चढ़ाने में बाधा डालता है
  rationale: ग्रीक में क्रिया सक्रिय है—‘बाधा डालता है’; इसलिए अंग्रेज़ी की कर्मवाच्य व्याख्या के बजाय मूल वाक्य की अस्पष्टता और सक्रिय बल बनाए रखा गया।
- source_word: εὐλογίαν Θεοῦ οὐ μνημονεύει
  choice: परमेश्वर को धन्य कहना याद नहीं रखता
  rationale: εὐλογία यहाँ परमेश्वर की स्तुति अथवा उसे धन्य कहने का भाव दे सकता है; यह अनुवाद उस उपासना-संबंधी अर्थ को सहज हिन्दी में रखता है।
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  choice: भविष्यद्वक्ता के बोलने पर वह नहीं सुनता
  rationale: जननात्मक निरपेक्ष रचना को समयसूचक हिन्दी में व्यक्त किया गया और οὐκ ἀκούει का सीधा अर्थ ‘नहीं सुनता’ सुरक्षित रखा गया।
- source_word: λόγους εὐσεβείας προσοχθίζει
  choice: भक्ति की बातों से चिढ़ता है
  rationale: εὐσέβεια के लिए सामान्य, धर्मसम्मत ‘भक्ति’ और προσοχθίζει के लिए अप्रसन्नता/खीझ का स्वाभाविक शब्द ‘चिढ़ता’ चुना गया।
theological_decisions:
- issue: बलि चढ़ाने में बाधा का कर्ता अथवा प्रभावित व्यक्ति
  choice: 'सक्रिय रूप: ‘वह ... बाधा डालता है’'
  alternative: ‘उसे ... बलि चढ़ाने से रोका जाता है’ या ‘वह ... बलि चढ़ाने में बाधित होता है’
  rationale: प्राप्त ग्रीक पाठ में ἐμποδίζει सक्रिय तृतीय पुरुष एकवचन है और व्यक्त कर्म निर्दिष्ट नहीं है। पाठ को कर्मवाच्य बनाना अंग्रेज़ी परामर्श-पाठ की व्याख्या को मूल पर थोप देता।
- issue: भविष्यद्वक्ता की वाणी पर प्रतिक्रिया
  choice: ‘नहीं सुनता’ और ‘भक्ति की बातों से चिढ़ता है’ को अलग कथनों के रूप में रखा
  alternative: ‘भविष्यद्वक्ता को सुनकर वह नाराज़ और क्रोधित होता है’
  rationale: ग्रीक में क्रोध का स्पष्ट शब्द नहीं है; प्रσοχθίζει का संबंध ‘भक्ति की बातों’ से है। अतः अंग्रेज़ी में हुए संयोजन को नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल ग्रीक की सक्रिय वाक्यरचना और समानांतर नकारात्मक कथनों को सुरक्षित रखा गया है।
