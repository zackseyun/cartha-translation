  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/002.yaml
  text: She bore me Er and Onan and Shelah. And the Lord killed the first two, for Er was wicked; and Onan, when he had married Tamar, spilled the seed upon the ground, according to the commandment of his mother, and he also died through wickedness.
translation:
  language: hi
  text: उसने मेरे तीन पुत्रों—एर, ओनान और शेला—को जन्म दिया। उनमें से पहले दो को प्रभु ने मार डाला, क्योंकि शेला जीवित रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ विस्तृत पाठ-परंपराओं में आगे एर की दुष्टता तथा तामार से विवाह के बाद ओनान के भूमि पर वीर्य गिराने और दुष्टता के कारण मरने का वर्णन मिलता है; प्रदत्त यूनानी पाठ यहाँ केवल इतना कहता है कि प्रभु ने पहले दो को मार डाला और शेला जीवित रहा।
    reason: अंग्रेज़ी परामर्श-पाठ और प्रदत्त यूनानी स्रोत के बीच महत्वपूर्ण विस्तार-अंतर को पारदर्शी बनाना।
lexical_decisions:
