  choice: उसने मेरे लिए ... को जन्म दिया
  rationale: यूनानी वाक्य की संबंधसूचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए यह स्पष्ट किया गया कि ये यहूदा के पुत्र थे।
- source_word: Ἦρ, Αὐνὰν, Σηλώμ
  choice: एर, ओनान और शेलह
  rationale: बाइबलीय नामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
- source_word: ἀνεῖλεν Κύριος
  choice: प्रभु ने मार डाला
  rationale: ἀναιρέω के यहाँ प्रत्यक्ष और कठोर अर्थ को नरम किए बिना व्यक्त किया गया है।
- source_word: τοὺς μὲν δύο
  choice: उनमें से पहले दो
  rationale: संदर्भ में तीन पुत्रों में से एर और ओनान की ओर संकेत है; हिन्दी में इसे स्पष्ट और सहज बनाया गया है।
- source_word: ὁ γὰρ Σηλὼμ ἔζησεν
  choice: पर शेलह जीवित रहा
  rationale: γάρ यहाँ पिछले कथन का स्पष्टीकरण देता है; हिन्दी में विरोधात्मक 'पर' जीवित बचे तीसरे पुत्र और मारे गए पहले दो के बीच संबंध को स्वाभाविक रूप से दिखाता है।
theological_decisions:
- issue: प्रभु द्वारा पहले दो पुत्रों की मृत्यु
  choice: कारण जोड़े बिना मूल यूनानी के अनुसार केवल यह कहा गया कि प्रभु ने उन्हें मार डाला
  alternative: अंग्रेज़ी POB के अनुसार एर की दुष्टता और ओनान द्वारा वीर्य भूमि पर गिराने का विस्तृत वर्णन जोड़ना
  rationale: प्रदत्त यूनानी पाठ में वे विस्तार उपस्थित नहीं हैं। स्रोत-साक्ष्य को प्राथमिकता देते हुए अनुल्लिखित नैतिक और कथात्मक विवरण मुख्य पाठ में नहीं जोड़े गए।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। 'मार डाला' मूल क्रिया की कठोरता बनाए रखता है। मुख्य पाठ को उपलब्ध यूनानी साक्ष्य तक सीमित रखा गया है और पाठांतर-सदृश विस्तृत सामग्री को पादटिप्पणी में बताया गया है।
