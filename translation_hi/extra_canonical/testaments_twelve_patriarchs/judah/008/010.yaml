source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ὡς συνήλθον αὐτῇ συνελήφθη. 5. Ἀγνοῶν δὲ ἐγὼ ὃ ἐποίησα,'
  language: Greek
  note: 'Greek from Charles XII.4c-5a (α): the union and Judah''s unawareness. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/010.yaml
  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: hi
  text: और जब मैंने उसके साथ संबंध बनाया, तो वह गर्भवती हो गई। पर मैं नहीं जानता था कि मैंने क्या किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  choice: मैंने उसके साथ संबंध बनाया
  rationale: यहाँ συνέρχομαι का प्रसंगानुसार अर्थ यौन-संबंध बनाना है। चुना हुआ वाक्यांश अर्थ को स्पष्ट रखते हुए मर्यादित और आधुनिक हिन्दी में है।
- source_word: συνελήφθη
  choice: वह गर्भवती हो गई
  rationale: इस प्रसंग में क्रिया का अर्थ गर्भधारण करना है; सहज हिन्दी के लिए कर्मवाच्य रूप के बजाय स्वाभाविक अभिव्यक्ति अपनाई गई है।
- source_word: Ἀγνοῶν
  choice: मैं नहीं जानता था
  rationale: यह शब्द यहूदा की उस समय की अनभिज्ञता व्यक्त करता है; स्रोत में कारण स्पष्ट नहीं किया गया है।
- source_word: ὃ ἐποίησα
  choice: कि मैंने क्या किया था
  rationale: यूनानी की जानबूझकर सामान्य और आत्मपरक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
theological_decisions:
- issue: यहूदा की अनभिज्ञता का कारण
  choice: कारण को अनिर्दिष्ट रखा गया है
  alternative: अंग्रेज़ी परामर्श-पाठ के अनुसार इसे दाखमधु के प्रभाव से जोड़ना
  rationale: प्रदत्त यूनानी अंश केवल यह कहता है कि वह अपने किए से अनभिज्ञ था; उसमें दाखमधु का उल्लेख नहीं है। स्रोत से परे कारण जोड़ना उचित नहीं होगा।
- issue: स्त्री को पहचानने का कथन
  choice: उसे पहचान न पाने और विदा होते समय की बात शामिल नहीं की गई
  alternative: अंग्रेज़ी परामर्श-पाठ की विस्तृत पंक्ति जोड़ना
  rationale: ये विवरण प्रदत्त यूनानी पाठ में उपस्थित नहीं हैं। अनुवाद को उपलब्ध मूल-पाठ साक्ष्य तक सीमित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। यौन-संबंध के लिए न तो अत्यधिक सांकेतिक और न ही अशिष्ट अभिव्यक्ति चुनी गई है।
