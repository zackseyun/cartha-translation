  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: hi
  text: परन्तु यदि वह सीमा लाँघ जाता है, तो भ्रम की आत्मा उसके मन में घुस पड़ती है और उस मतवाले से अश्लील बातें बुलवाती है और उससे व्यवस्था का उल्लंघन करवाती है। वह लज्जित नहीं होता, बल्कि अपनी अपमानजनक दशा पर घमंड करता है और उसे अच्छा समझता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: सीमा पार कर जाता है
  rationale: मात्रा या संयम की निर्धारित सीमा लाँघने का भाव सहज हिन्दी में सुरक्षित रहता है।
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: उसके मन में प्रवेश करती है
  rationale: शाब्दिक अर्थ ‘उसके मन में डालती है’ है, पर यहाँ आत्मा कर्ता है; ‘प्रवेश करती है’ प्रभावी और स्वाभाविक हिन्दी देते हुए मानसिक आक्रमण का भाव रखता है।
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: भटकावे की आत्मा
  rationale: πλάνη में भ्रम, धोखा और भटकाव के अर्थ हैं। ‘भटकावा’ नैतिक और मानसिक पथभ्रष्टता को बिना अनावश्यक रूप से केवल झूठ तक सीमित किए व्यक्त करता है।
- source_word: αἰσχρορρημονεῖν
  choice: अश्लील बातें कहलवाती
  rationale: क्रिया का अर्थ लज्जाजनक या अश्लील वचन बोलना है; प्रेरक संरचना ποιεῖ के कारण ‘कहलवाती’ चुना गया।
- source_word: παρανομεῖν
  choice: अधर्म करवाती है
  rationale: कानून या उचित मर्यादा के विरुद्ध आचरण का व्यापक नैतिक अर्थ व्यक्त करता है।
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: अपने अपमान पर घमंड करता है
  rationale: ἀτιμία का मूल भाव अनादर, अपमान या लज्जाजनक दशा है; पाठ के विरोधाभास को बनाए रखा गया है।
- source_word: νομίζειν εἶναι καλόν
  choice: उसे अच्छा समझता है
  rationale: ग्रीक में καλόν ‘अच्छा/सुंदर/सम्माननीय’ हो सकता है। ‘अच्छा’ मूल की व्यापकता सुरक्षित रखता है; अंग्रेज़ी परामर्श-पाठ का ‘glory’ ग्रीक में प्रत्यक्ष नहीं है।
theological_decisions:
- issue: ‘भटकावे की आत्मा’ को व्यक्तिगत सत्ता या प्रभाव मानना
  choice: व्याकरण के अनुसार ‘आत्मा’ को कर्ता रखते हुए अभिव्यक्ति को खुला रखा गया है।
  alternative: इसे केवल ‘भ्रम उसके मन पर छा जाता है’ जैसे मनोवैज्ञानिक प्रभाव के रूप में कहना।
  rationale: ग्रीक τὸ πνεῦμα कर्ता है, पर पाठ उसकी तत्त्वमीमांसक प्रकृति स्पष्ट नहीं करता; इसलिए अस्पष्टता को नहीं सुलझाया गया।
- issue: अंतिम καλόν का अर्थ
  choice: अच्छा
  alternative: गौरव की बात / सम्माननीय
  rationale: καλόν की अर्थ-सीमा व्यापक है। ‘अच्छा’ पाठ के नैतिक मूल्य-विपर्यय को सीधे व्यक्त करता है और अंग्रेज़ी परत के ‘glory’ को मूल में आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए स्पष्ट। वाक्य को पठनीयता हेतु दो वाक्यों में बाँटा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
