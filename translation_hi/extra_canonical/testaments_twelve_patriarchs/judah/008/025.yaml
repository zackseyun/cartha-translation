id: T12P.JUD.8.25
reference: Testament of Judah 8:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: hi
  text: और वास्तव में, इन बातों पर पश्चाताप करके, मैंने अपने बुढ़ापे तक न दाखमधु पिया, न मांस खाया, और किसी भी आनंद का अनुभव नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: इन बातों के कारण पश्चाताप करके
  rationale: कृदन्तीय रचना और ἐπὶ τούτοις के कारण/विषय संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: दाखमधु और मांस नहीं खाया
  rationale: यूनानी में ἔφαγον दोनों पदार्थों पर लागू है; हिन्दी में ‘खाया’ को दोनों के साथ रखना कुछ असामान्य होते हुए भी मूल अभिव्यक्ति की ठोस संरचना को सुरक्षित रखता है।
- source_word: ἕως γήρους μου
  choice: अपने बुढ़ापे तक
  rationale: γήρας यहाँ वृद्धावस्था को दर्शाता है; यह कहना आवश्यक नहीं कि संयम मृत्यु तक रहा।
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: किसी भी आनंद का अनुभव नहीं किया
  rationale: शाब्दिक ‘कोई आनंद नहीं देखा’ हिन्दी में अप्राकृतिक है; ‘अनुभव नहीं किया’ मुहावरे का आशय और उसकी व्यापकता व्यक्त करता है।
theological_decisions:
- issue: पश्चाताप और उसके बाद के संयम का संबंध
  choice: पश्चाताप के परिणामस्वरूप व्यक्तिगत संयम के रूप में प्रस्तुत किया
  alternative: इसे सभी के लिए अनिवार्य धार्मिक तपस्या या प्रायश्चित्त-विधान के रूप में प्रस्तुत करना
  rationale: मूल पाठ प्रथम पुरुष में यहूदा की प्रतिक्रिया बताता है और कोई सार्वभौमिक आदेश नहीं देता।
- issue: πᾶσαν εὐφροσύνην की व्यापकता
  choice: ‘किसी भी आनंद’ कहकर मूल के व्यापक कथन को बनाए रखा
  alternative: इसे केवल भोज, उत्सव या सांसारिक मनोरंजन तक सीमित करना
  rationale: संदर्भ ऐसा सीमित अर्थ संभव कर सकता है, पर यूनानी वाक्य स्वयं सामान्य और प्रबल है; अनुवाद में उसे चुपचाप सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मकथात्मक, गंभीर और संयमित शैली। ‘दाखमधु’ प्राचीन संदर्भ के लिए स्पष्ट और गरिमापूर्ण है। किसी पादटिप्पणी की आवश्यकता नहीं।
