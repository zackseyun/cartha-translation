id: T12P.JUD.8.36
reference: Testament of Judah 8:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
  note: Greek from Charles XXI.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने मुझे राजसत्ता दी और उसे याजकपद; और उसने राजसत्ता को याजकपद के अधीन कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεός
  choice: परमेश्वर
  rationale: यूनानी पाठ में ‘परमेश्वर’ है; अंग्रेज़ी परामर्श-पाठ के ‘प्रभु’ के बजाय मूल स्रोत का सीधा अनुसरण किया गया।
- source_word: τὴν βασιλείαν
  choice: राजसत्ता
  rationale: यहाँ भाव केवल भौगोलिक ‘राज्य’ नहीं, राजा का शासनाधिकार है; ‘राजसत्ता’ इस अर्थ को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: τὴν ἱερατείαν / τῇ ἱερωσύνῃ
  choice: याजकपद
  rationale: दोनों निकटार्थी यूनानी संज्ञाएँ यहाँ याजकीय पद और अधिकार को दर्शाती हैं; हिन्दी में एकरूप ‘याजकपद’ प्रसंग का समानांतर विन्यास बनाए रखता है।
- source_word: ὑπέταξε
  choice: अधीन कर दिया
  rationale: क्रिया में अधिकार-व्यवस्था के अंतर्गत रखने का स्पष्ट भाव है, जिसे ‘अधीन कर दिया’ ठीक प्रकार से व्यक्त करता है।
theological_decisions:
- issue: राजसत्ता और याजकपद का पारस्परिक संबंध
  choice: ‘राजसत्ता को याजकपद के अधीन’ का स्पष्ट पदानुक्रम सुरक्षित रखा गया।
  alternative: इसे केवल सहयोग, सम्मान या धार्मिक मार्गदर्शन के संबंध के रूप में नरम करना।
  rationale: यूनानी ὑπέταξε और संप्रदान कारक τῇ ἱερωσύνῃ वास्तविक अधीनता व्यक्त करते हैं; व्याख्यात्मक तनाव को बदले बिना रखा गया।
- issue: ईश-नाम
  choice: ‘परमेश्वर’
  alternative: ‘प्रभु’
  rationale: मूल यूनानी में Θεός है, κύριος नहीं; इसलिए स्रोत-संगत पद चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘मुझे…उसे’ का समानांतर ढाँचा तथा वाक्य का कारणसूचक आरंभ मूल के निकट रखा गया है।
