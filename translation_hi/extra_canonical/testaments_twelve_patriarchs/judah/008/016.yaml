id: T12P.JUD.8.16
reference: Testament of Judah 8:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चो, मैं तुमसे कहता हूँ: मदिरा पीकर मतवाले मत बनो। क्योंकि मदिरा मन को सत्य से भटका देती है, कामना का उग्र आवेग जगा देती है और आँखों को भटकाव में ले जाती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: यह आत्मीय पितृ-संबोधन है; आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण रूप।
- source_word: μὴ μεθύσκεσθε οἴνῳ
  choice: दाखमधु पीकर मतवाले न हो
  rationale: निषेध का केंद्र नशे की दशा में होना है; ‘दाखमधु’ οἶνος का स्पष्ट तथा प्रसंगानुकूल अनुवाद है।
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: मन को सत्य से भटका देता है
  rationale: διαστρέφει में मोड़ने अथवा विकृत दिशा में ले जाने का भाव है; यह वाक्य हिन्दी में स्वाभाविक रहते हुए स्रोत का आशय रखता है।
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: अभिलाषा का आवेग भड़का देता है
  rationale: ग्रीक पदबंध असामान्य है। ὀργή के तीव्र आवेग/उत्तेजना और ἐπιθυμία की अभिलाषा को बिना अनावश्यक धर्मवैज्ञानिक व्याख्या के व्यक्त किया गया है।
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  choice: आँखों को भ्रम की ओर ले जाता है
  rationale: मूल के ‘आँखों’ रूपक और πλάνη के भ्रम/भटकाव दोनों को निकटता से सुरक्षित रखा गया है।
theological_decisions:
- issue: मदिरा के विषय में निषेध का दायरा
  choice: ‘दाखमधु पीकर मतवाले न हो’
  alternative: ‘दाखमधु मत पीओ’
  rationale: ग्रीक μεθύσκεσθε मतवाला होने को निषिद्ध करता है, प्रत्येक प्रकार के सेवन को नहीं; इसलिए पाठ से अधिक व्यापक निषेध आरोपित नहीं किया गया।
- issue: ὀργὴν ἐπιθυμίας की व्याख्या
  choice: ‘अभिलाषा का आवेग’
  alternative: ‘कामना का क्रोध’ अथवा ‘वासना की उग्रता’
  rationale: मूल पदबंध की अर्थगत तन्यता बनाए रखी गई है और इसे केवल यौन वासना या शाब्दिक क्रोध तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय उपदेशात्मक और गरिमापूर्ण शैली। वाक्यरचना साधारण पाठक के लिए सहज रखी गई है; मूल के कारणात्मक क्रम और आँखों वाले रूपक को बनाए रखा गया है।
