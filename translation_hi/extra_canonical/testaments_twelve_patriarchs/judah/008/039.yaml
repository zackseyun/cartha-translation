id: T12P.JUD.8.39
reference: Testament of Judah 8:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: hi
  text: क्योंकि प्रभु के दूत ने मुझसे कहा, “प्रभु ने तुझसे बढ़कर उसे[a] चुना है कि वह उसके निकट आए, उसकी मेज़ पर भोजन करे और इस्राएलियों की उत्तम वस्तुओं के पहले अंश उसे चढ़ाए। पर तू याकूब का राजा होगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात लेवी को; यूनानी पाठ में यहाँ केवल “उसे” है।
    reason: संदर्भगत पूर्वपद स्पष्ट करना, साथ ही मूल की सर्वनामात्मक अभिव्यक्ति सुरक्षित रखना।
  - marker: b
    text: कुछ विषयगत रूपांतरणों में यहाँ “सिंह के समान” जोड़ा गया है, पर इस यूनानी पाठ में ये शब्द नहीं हैं।
    reason: परियोजना अंग्रेज़ी और प्रदत्त यूनानी साक्ष्य के बीच महत्वपूर्ण पाठांतर को पारदर्शी बनाना।
lexical_decisions:
- source_word: Αὐτὸν
  choice: उसे
  rationale: यूनानी पाठ में नाम नहीं, केवल बलाघाती सर्वनाम है। संदर्भ में इसका संकेत लेवी की ओर है, पर मुख्य पाठ में नाम जोड़कर मूल की अभिव्यक्ति को अधिक स्पष्ट नहीं किया गया।
- source_word: ὑπὲρ σὲ ἐξελέξατο
  choice: तुझसे पहले चुन लिया है
  rationale: यहाँ ὑπέρ तुलना अथवा प्राथमिकता व्यक्त करता है; सहज हिन्दी में ‘तुझसे पहले’ लेवी को याजकीय निकटता के लिए प्राथमिकता दिए जाने का भाव रखता है।
- source_word: προσεγγίζειν αὐτῷ
  choice: उसके निकट आए
  rationale: निकट आने की भाषा उपासना और याजकीय सेवा का संकेत दे सकती है; अनुवाद उस संकेत को बनाए रखता है, पर उसकी व्याख्या मुख्य पाठ में नहीं जोड़ता।
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: उसकी मेज़ से खाए
  rationale: शाब्दिक यूनानी ‘उसकी मेज़ खाना’ हिन्दी में अस्वाभाविक है; ‘मेज़ से खाना’ उसी भोज-सहभागिता के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: उत्तम भोजनों के पहले फल
  rationale: ἀπαρχαί के अर्पण-संबंधी ‘पहले फल’ को बनाए रखा गया है, जबकि ἐντρυφήματα को संदर्भानुकूल ‘उत्तम भोजन’ कहा गया है।
- source_word: βασιλεὺς Ἰακώβ
  choice: याकूब का राजा
  rationale: यूनानी संबंधकारक पद का सीधा और जानबूझकर खुला अनुवाद है; ‘याकूब’ कुल अथवा इस्राएली समुदाय को सूचित कर सकता है।
theological_decisions:
- issue: चुने हुए व्यक्ति की पहचान
  choice: मुख्य पाठ में ‘उसे’, और पादटिप्पणी में लेवी की संदर्भगत पहचान
  alternative: मुख्य पाठ में सीधे ‘लेवी को’
  rationale: मूल यूनानी में सर्वनाम है। संदर्भ समझने में सहायता दी गई है, किंतु मूल से बाहर का नाम मुख्य पाठ में आरोपित नहीं किया गया।
- issue: लेवी की याजकीय भूमिका और यहूदा की राजकीय भूमिका
  choice: निकट आने, मेज़ से खाने, पहले फल चढ़ाने और याकूब का राजा होने—सभी तत्व सुरक्षित रखे गए
  alternative: अंग्रेज़ी POB की तरह मध्यवर्ती याजकीय विवरण संक्षिप्त करना
  rationale: मूल-भाषा स्रोत को प्राथमिकता देते हुए पद की याजकीय और राजकीय भूमिकाओं के बीच तनाव तथा समानांतरता को बनाए रखना आवश्यक है।
- issue: समापन में सिंह की उपमा
  choice: ‘सिंह के समान’ मुख्य पाठ में नहीं जोड़ा गया
  alternative: परियोजना अंग्रेज़ी के अनुसार ‘सिंह के समान’ जोड़ना
  rationale: प्रदत्त α यूनानी पाठ में ὡς λέων अनुपस्थित है। व्यापक परंपरा में सिंह-चित्र मौजूद होने पर भी उसे इस पद के मूल पाठ का अंग नहीं बनाया जा सकता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तू/तुझसे’ प्राचीन पितृसत्तात्मक संबोधन की गंभीरता और एकवचन को व्यक्त करता है। वाक्य मूल यूनानी की औपचारिक घोषणा-शैली रखता है, पर हिन्दी प्रवाह के लिए उपवाक्य स्वाभाविक क्रम में व्यवस्थित हैं।
