review_pass:
  verdict: revise
  source_fidelity: Draft preserves the full Greek sequence omitted by the English audit text and correctly excludes the unsupported lion simile. However, ὑπὲρ σέ is comparative preference ('over/above you'), not primarily temporal 'before you'; and ἀπαρχὰς ... ἐντρυφημάτων is better represented as first portions/fruits of Israel's good or choice things, rather than specifically 'excellent foods.'
  naturalness: The register and direct singular address are appropriate. 'उसकी मेज़ पर भोजन करे' is more idiomatic Hindi for συμμετοχή at someone's table than 'उसकी मेज़ से खाए.'
  terminology: '''पहले अंश'' accurately conveys ἀπαρχαί in an offering context without restricting it to agricultural fruit. ''उत्तम वस्तुएँ'' keeps ἐντρυφήματα broad and avoids importing a food-only sense.'
  issues:
  - severity: medium
    issue: ὑπὲρ σέ is translated temporally as 'तुझसे पहले.'
    rationale: In this construction it expresses Levi's preferential/superior selection in relation to Judah. A temporal rendering can suggest merely earlier selection rather than selection over Judah.
  - severity: medium
    issue: ἐντρυφημάτων is narrowed to 'उत्तम भोजनों.'
    rationale: The Greek can denote delights, good things, or choice possessions; the source does not require that these be foods. 'उत्तम वस्तुओं' preserves the broader expression.
  - severity: low
    issue: The table idiom is somewhat unnatural as 'मेज़ से खाए.'
    rationale: '''मेज़ पर भोजन करे'' is idiomatic modern Hindi and expresses eating at the Lord''s table without altering the sense.'
