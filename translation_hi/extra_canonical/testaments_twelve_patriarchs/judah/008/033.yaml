- from: और मैं जानता हूँ कि इन दोनों के कारण मेरा वंश व्यभिचारजनित विनाश में पड़ेगा; वे मेरे पुत्रों में से बुद्धिमान पुरुषों को भी भ्रष्ट कर देंगे और यहूदा के उस राज्य को छोटा कर देंगे, जिसे प्रभु ने मेरे पिता की आज्ञा मानने के कारण मुझे दिया था।
  to: और मैं जानता हूँ कि इन दोनों के कारण मेरा वंश यौन-दुराचार के विनाश में पड़ जाएगा; ये दोनों मेरे पुत्रों में से बुद्धिमान पुरुषों को भी भ्रष्ट कर देंगे और यहूदा के उस राज्य को घटा देंगे, जो प्रभु ने मुझे मेरे पिता की आज्ञा मानने पर दिया था।
  rationale: The revision remains limited to the supplied Greek text, not the English POB’s expanded warning. It broadens the rendering of πορνεία appropriately, clarifies that the two previously mentioned evils are the agents of corruption, and uses more natural Hindi for the kingdom’s reduction. “मेरे पिता की आज्ञा मानने पर” preserves the source’s concise obedience expression without forcing a doctrinal interpretation of the preposition.
