id: T12P.JUD.8.33
reference: Testament of Judah 8:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: hi
  text: और मैं जानता हूँ कि इन दोनों के कारण मेरा वंश यौन-दुराचार के विनाश में पड़ जाएगा; ये दोनों मेरे पुत्रों में से बुद्धिमान पुरुषों को भी भ्रष्ट कर देंगे और यहूदा के उस राज्य को घटा देंगे, जो प्रभु ने मुझे मेरे पिता की आज्ञा मानने पर दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὰ δύο ταῦτα
  choice: इन दोनों के कारण
  rationale: यह पिछले प्रसंग में उल्लिखित दो बुराइयों—सोना और स्त्रियों का सौंदर्य—की ओर संकेत करता है; मूल की संक्षिप्त अनाफोरिक अभिव्यक्ति बनाए रखी गई है।
- source_word: τὸ γένος μου
  choice: मेरा वंश
  rationale: γένος यहाँ यहूदा की संतति अथवा वंश के अर्थ में है।
- source_word: εἰς ἀπώλειαν πορνείας
  choice: व्यभिचारजनित विनाश में
  rationale: कठिन यूनानी पदबंध में ἀπώλεια और πορνεία दोनों को सुरक्षित रखते हुए उनके कारणात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἀλλοιώσουσι
  choice: भ्रष्ट कर देंगे
  rationale: शाब्दिक अर्थ ‘बदल देंगे’ है, पर इस नैतिक चेतावनी के संदर्भ में बिगाड़ने या भ्रष्ट करने का भाव है।
- source_word: βασιλείαν Ἰούδα
  choice: यहूदा के उस राज्य को
  rationale: राजत्व/राज्य की सम्भव अर्थ-सीमा में यहाँ दिए गए और घटाए जाने वाले शासन-क्षेत्र के लिए ‘राज्य’ सहज है।
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: छोटा कर देंगे
  rationale: कारक संरचना और राज्य के घटाए जाने का सीधा भाव रखा गया है।
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: मेरे पिता की आज्ञा मानने के कारण
  rationale: ἐν ὑπακοῇ को प्रसंगानुसार आधार/कारण के रूप में व्यक्त किया गया है; ‘आज्ञाकारिता’ की अपेक्षा यह साधारण पाठक के लिए अधिक स्वाभाविक है।
theological_decisions:
- issue: चेतावनी का विषय
  choice: मूल यूनानी के ‘इन दोनों’ और उनके विनाशकारी प्रभाव को रखा गया
  alternative: English POB की तरह संयम, कनानी स्त्रियों से विवाह, धन और उपहारों को स्पष्ट रूप से जोड़ना
  rationale: प्रस्तुत यूनानी साक्ष्य में ये विस्तृत उपदेश प्रत्यक्ष रूप से नहीं हैं; वे व्यापक प्रसंग का विषयगत समेकन हैं। अनुवाद ने स्रोत-पद की सीमा का पालन किया है।
- issue: राज्य मिलने का आधार
  choice: ‘मेरे पिता की आज्ञा मानने के कारण’
  alternative: ‘मेरे पिता के प्रति आज्ञाकारिता में’
  rationale: मूल के ἐν की कुछ व्याकरणिक लचक बनी रहती है, पर हिन्दी में कारणात्मक पाठ अधिक स्वाभाविक और प्रसंगसंगत है; इसे ईश्वरीय अनुग्रह पर कोई व्यापक सिद्धान्त घोषित नहीं किया गया।
- issue: πορνεία का अर्थ
  choice: व्यभिचार
  alternative: यौन अनैतिकता / वेश्यागमन
  rationale: पद व्यापक यौन दुराचार सूचित कर सकता है। ‘व्यभिचार’ dignified और परिचित है, यद्यपि अर्थ को केवल वैवाहिक बेवफाई तक सीमित नहीं समझना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। English POB के विषयगत विस्तार के बजाय उपलब्ध यूनानी स्रोत को प्राथमिकता दी गई है। ‘यहूदा’ को व्यक्ति के नाम और उससे जुड़े राज्य—दोनों के संदर्भ में स्वाभाविक रूप से रखा गया है।
