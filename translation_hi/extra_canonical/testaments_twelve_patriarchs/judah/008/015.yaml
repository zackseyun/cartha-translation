base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: hi
  text: उन्हें पहचानकर मैंने कहा, “तामार मुझसे अधिक धर्मी ठहरी है।” इसके बाद मैंने उसके साथ फिर कभी शारीरिक संबंध नहीं बनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “उसे जानना” शारीरिक संबंध के लिए शिष्टोक्ति है; वाक्य का भाव है कि इसके बाद उसने उसके साथ फिर ऐसा नहीं किया।
    reason: मूल यूनानी की शिष्टोक्ति और οὐ προσεθέμην ἔτι का ‘फिर/आगे नहीं’ भाव स्पष्ट करना।
lexical_decisions:
- source_word: Ἐπιγνοὺς
  choice: उन्हें पहचानकर
  rationale: क्रिया का कर्म यूनानी में अंतर्निहित है; प्रसंग में तामार से संबंधित पहचानी गई वस्तुओं की ओर संकेत होने के कारण हिन्दी में बहुवचन कर्म स्पष्ट किया गया है।
- source_word: Δεδικαίωται ... ἢ ἐγώ
  choice: मुझसे अधिक धर्मी ठहरी है
  rationale: पूर्णकालिक कर्मवाच्य रूप और तुलनात्मक ἢ को स्वाभाविक हिन्दी में व्यक्त करता है; यह उत्पत्ति 38:26 की प्रसिद्ध अभिव्यक्ति से भी मेल खाता है।
- source_word: τοῦ γνῶναι αὐτήν
  choice: उसके साथ ... शारीरिक संबंध नहीं रखा
  rationale: ‘जानना’ यहाँ यौन संबंध के लिए प्रयुक्त शिष्टोक्ति है; शाब्दिक हिन्दी भ्रामक होती, इसलिए अर्थ को स्पष्ट और गरिमापूर्ण रूप दिया गया है।
- source_word: οὐ προσεθέμην ἔτι
  choice: फिर ... दोबारा ... नहीं रखा
  rationale: यूनानी वाक्यांश किसी कार्य को आगे या फिर से न करने का भाव देता है।
theological_decisions:
- issue: तामार और यहूदा की धार्मिकता की तुलना
  choice: “तामार मुझसे अधिक धर्मी ठहरी है”
  alternative: “तामार निर्दोष ठहराई गई है, न कि मैं”
  rationale: ἢ ἐγώ तुलनात्मक अर्थ ग्रहण कर सकता है और उत्पत्ति 38:26 की पृष्ठभूमि में यही सबसे स्वाभाविक है; अनुवाद तामार को सर्वथा निष्पाप घोषित करने के बजाय यहूदा की तुलना में उचित ठहराए जाने का भाव रखता है।
- issue: परामर्शार्थ अंग्रेज़ी पाठ में उपस्थित अतिरिक्त सामग्री
  choice: “मैं लज्जित हुआ” और “क्योंकि मैंने उसे अपने पुत्र शेला को नहीं दिया” को शामिल नहीं किया गया
  alternative: अंग्रेज़ी POB के अनुसार दोनों वाक्यांश जोड़ना
  rationale: दिए गए यूनानी स्रोत-पाठ में ये शब्द नहीं हैं; स्रोत-साक्ष्य को प्राथमिकता देते हुए उनका अंतःक्षेप नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धर्मी ठहरी’ न्यायिक तथा नैतिक दोनों अर्थों की गुंजाइश बनाए रखता है। यौन शिष्टोक्ति को अश्लीलता के बिना स्पष्ट किया गया है।
