base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: hi
  text: इसलिए, दाखमधु के नशे में होने के कारण मैंने उसे नहीं पहचाना; और उसके श्रृंगार की शैली के माध्यम से उसकी सुंदरता ने मुझे धोखा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς ... οἴνῳ
  choice: दाखमधु से मतवाला होने के कारण
  rationale: कृदंत का कारणसूचक संबंध स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘दाखमधु’ οἶνος का स्पष्ट और गरिमापूर्ण रूप है।
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: मैंने उसे नहीं पहचाना
  rationale: ἐπιγινώσκω का यहाँ सीधा अर्थ पहचानना है; कर्ता और स्त्रीलिंग कर्म को स्पष्ट रखा गया है।
- source_word: ἠπάτησέ με
  choice: मुझे बहका दिया
  rationale: क्रिया में धोखा देने अथवा पथभ्रष्ट करने की अर्थ-छाया है; ‘बहका दिया’ प्रसंग में स्वाभाविक है और मूल की अस्पष्टता को अनावश्यक रूप से ‘मन’ जोड़कर नहीं सुलझाता।
- source_word: τὸ κάλλος αὐτῆς
  choice: उसकी सुंदरता
  rationale: मूल संज्ञा-रचना को सीधे बनाए रखा गया है।
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: उसके साज-सिंगार के रूप के द्वारा
  rationale: διά के माध्यमसूचक भाव और σχῆμα की बाहरी आकृति/रूप की धारणा को सुरक्षित रखा गया है; κόσμησις को स्वाभाविक हिन्दी ‘साज-सिंगार’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक स्तर अपनाया गया है। वाक्य मूल यूनानी के कारण और माध्यम के संबंधों को बनाए रखता है तथा अंग्रेज़ी परामर्श-पाठ में जोड़े गए ‘मन’ को मूल में न होने के कारण शामिल नहीं करता।
