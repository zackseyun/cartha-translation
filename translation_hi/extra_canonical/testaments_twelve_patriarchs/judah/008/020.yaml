source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πιὼν τὸν οἶνον οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ, καὶ ἔλαβον γυναῖκα Χαναναίαν. 7. Πολλὴ γὰρ τῷ πίνοντι οἶνον, τέκνα μου,
  language: Greek
  note: Greek from Charles XIV.6-7a (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/020.yaml
  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: hi
  text: मदिरा पी लेने के बाद मैंने परमेश्वर की आज्ञा का मान नहीं रखा और एक कनानी स्त्री को पत्नी बना लिया। मेरे बच्चों, मदिरा पीनेवाले को बहुत विवेक से काम लेना चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध यूनानी पाठ यहाँ अधूरा है: शाब्दिक रूप से, “क्योंकि मदिरा पीनेवाले के लिए बहुत…।” संदर्भ और परामर्श-पाठ के आधार पर वाक्य का भाव इस प्रकार पूरा किया गया है।'
    reason: मूल साक्ष्य में वाक्य अपूर्ण है; पूर्ति को पाठक से छिपाना उचित नहीं।
lexical_decisions:
- source_word: οἶνος
  choice: मदिरा
  rationale: यह यूनानी शब्द अंगूरी मद्य को सूचित करता है; आधुनिक हिन्दी में ‘मदिरा’ स्वाभाविक, गरिमापूर्ण और ‘शराब’ की अपेक्षा कम संकीर्ण है।
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: मैंने परमेश्वर की आज्ञा का मान नहीं रखा
  rationale: शाब्दिक संरचना असामान्य है और लज्जा/सम्मान के भाव से जुड़ी है। प्रसंग में यह अनादर या उल्लंघन व्यक्त करती है; यह रूप हिन्दी में अर्थ को स्वाभाविक रखता है, बिना उसे केवल ‘आज्ञा तोड़ी’ तक सीमित किए।
- source_word: γυναῖκα Χαναναίαν
  choice: एक कनानी स्त्री को पत्नी
  rationale: जातीय पहचान और वैवाहिक अर्थ दोनों स्पष्ट रखे गए हैं।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: पितृसुलभ संबोधन को सरल, आधुनिक और प्रत्यक्ष हिन्दी में रखा गया है।
theological_decisions:
- issue: परमेश्वर की आज्ञा के प्रति यहूदा के व्यवहार का वर्णन
  choice: आज्ञा का मान नहीं रखा
  alternative: आज्ञा से लज्जित नहीं हुआ / आज्ञा का उल्लंघन किया
  rationale: यूनानी क्रिया की असामान्य रचना को किसी विशेष नैतिक या विधिक व्याख्या में पूरी तरह सीमित न करके अनादर का मूल भाव सुरक्षित रखा गया है।
- issue: खंडित यूनानी वाक्य में मदिरापान और विवेक का संबंध
  choice: मदिरा पीनेवाले को बहुत विवेक से काम लेना चाहिए
  alternative: क्योंकि मदिरा पीनेवाले के लिए बहुत…
  rationale: दिया गया यूनानी पाठ ‘πολλὴ’ के बाद अपेक्षित संज्ञा या पूर्ण कथन नहीं देता। परामर्श-पाठ में सुरक्षित अर्थ को सहज हिन्दी में प्रस्तुत किया गया है और पाठगत अपूर्णता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और पितृसुलभ उपदेशात्मक स्वर। ‘मदिरा’ का प्रयोग प्राचीन अंगूरी मद्य के लिए किया गया है।
