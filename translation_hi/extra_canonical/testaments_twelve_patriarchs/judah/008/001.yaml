  text: And while I was there, Barshaba, the king of Adullam, entertained us and made a drinking feast for us; and when he urged me, he gave me his daughter, whose name was Shua, as a wife.
translation:
  language: hi
  text: और जब मैं वहाँ था, तब अदुल्लाम के राजा बरशाबा ने हमारा आतिथ्य किया और हमारे लिए मदिरा-भोज रखा; और उसके आग्रह करने पर उसने अपनी बेटी, जिसका नाम साबा था, मुझे पत्नी के रूप में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸς ὃν ἐλθὼν ἤμην
  choice: जब मैं वहाँ पहुँचा
  rationale: पाठ की व्याकरणिक बनावट कुछ असहज है; प्रसंगानुकूल स्थानवाचक अर्थ रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: Βαρσαβὰ
  choice: बरशाबा
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: ἐποίησεν ἡμῖν πότον
  choice: उसने हमारे लिए मदिरा-भोज रखा
  rationale: πότος यहाँ केवल पेय नहीं, सामूहिक पान अथवा मदिरा-भोज को सूचित करता है; ἡμῖν को ‘हमारे लिए’ से स्पष्ट रखा गया है।
- source_word: παρακαλέσας
  choice: बहुत आग्रह करके
  rationale: इस संदर्भ में क्रिया का अर्थ अनुरोध अथवा आग्रह करना है; ‘बहुत’ हिन्दी में आग्रह की बलवत्ता स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Σαβά
  choice: शूआ
  rationale: यहूदी परंपरा में परिचित नाम-रूप को अपनाया गया है, यद्यपि यूनानी रूप ‘सबा’ के निकट है।
- source_word: εἰς γυναῖκα
  choice: पत्नी के रूप में
  rationale: विवाहार्थ दिए जाने का सीधा और आधुनिक हिन्दी रूप।
