translation:
  language: hi
  text: तब मैं उसकी ओर मुड़कर बोला, “मैं तुम्हारे पास आऊँगा।” उसने कहा, “तुम मुझे क्या दोगे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: उसकी ओर मुड़ा
  rationale: ἐκκλίνω यहाँ मार्ग से हटकर स्त्री की ओर मुड़ने का भाव देता है; यह स्वाभाविक हिन्दी में क्रिया की दिशा बनाए रखता है।
- source_word: Εἰσέρχομαι πρὸς σε
  choice: मैं तुम्हारे पास आना चाहता हूँ
  rationale: शाब्दिक अर्थ ‘मैं तुम्हारे पास भीतर आता हूँ’ है, पर प्रसंग में यह यौन संबंध का शिष्ट संकेत है। हिन्दी में ‘तुम्हारे पास आना’ संकेत को बनाए रखता है, जबकि ‘चाहता हूँ’ कथन के आशय को स्वाभाविक बनाता है।
- source_word: Τί μοι δώσεις;
  choice: तुम मुझे क्या दोगे?
  rationale: यूनानी प्रश्न का सीधा और संक्षिप्त प्रतिरूप; उपलब्ध यूनानी पाठ में अंग्रेज़ी परामर्श-पाठ का अतिरिक्त उद्देश्यवाचक वाक्यांश नहीं है।
