id: T12P.JUD.8.14
reference: Testament of Judah 8:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: hi
  text: 'तब उसने मेरे पास यह संदेश भेजा: “जिस पुरुष की ये वस्तुएँ हैं, उसी से मैं गर्भवती हूँ। इसलिए पहचान कि यह अंगूठी, छड़ी और मुकुट किसके हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλε πρός με λέγουσα
  choice: उसने मेरे पास यह संदेश भेजा
  rationale: यूनानी में केवल भेजकर कहने या संदेश भिजवाने की बात है; ‘चुपके से’ और वस्तुएँ भेजने का विवरण मूल α-पाठ में नहीं है।
- source_word: Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν
  choice: जिस पुरुष की ये वस्तुएँ हैं
  rationale: संबंधवाचक यूनानी वाक्यांश का स्वाभाविक और निकट हिन्दी रूप।
- source_word: ἐγὼ ἐν γαστρὶ ἔχω
  choice: उसी से मैं गर्भवती हूँ
  rationale: शाब्दिक अर्थ ‘मैं गर्भ में धारण किए हुए हूँ’; वर्तमान हिन्दी में आशय को स्पष्ट और सहज रूप से व्यक्त किया गया है।
- source_word: ἐπίγνωθι
  choice: पहचान
  rationale: आज्ञार्थक क्रिया का अर्थ ध्यान से पहचानना या निश्चित करना है।
- source_word: ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα
  choice: अंगूठी, छड़ी और मुकुट
  rationale: α-पाठ की वस्तुओं और उनके क्रम को सुरक्षित रखा गया है; ζώνη (‘कमरबंद’) इस स्रोत-पाठ में नहीं है। διάδημα राजकीय सिरबंद या मुकुट को दर्शाता है; सामान्य पाठक के लिए ‘मुकुट’ स्वाभाविक है।
theological_decisions:
- issue: गर्भधारण के कथन में संबंध की अभिव्यक्ति
  choice: उसी से मैं गर्भवती हूँ
  alternative: मैं उसके बच्चे को गर्भ में लिए हुए हूँ
  rationale: मूल कथन पिता की पहचान को वस्तुओं के स्वामी से जोड़ता है; चुना हुआ रूप यही संबंध बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- issue: अंग्रेज़ी परामर्श-पाठ और यूनानी α-पाठ का अंतर
  choice: यूनानी के अनुसार अंगूठी, छड़ी और मुकुट
  alternative: अंग्रेज़ी POB के अनुसार छड़ी, कमरबंद और मुकुट
  rationale: निर्दिष्ट मूल-भाषा स्रोत प्राथमिक है। इसलिए अंग्रेज़ी पाठ में आए ‘कमरबंद’, वस्तुओं के बदले हुए क्रम, ‘चुपके से’, और बाहर लाए जाने के प्रसंग को शामिल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष रखी गई है। संबोधन एकवचन है, जैसा प्रसंग और यूनानी आज्ञार्थक रूप संकेत करते हैं। मूल में जो बातें नहीं हैं—उसे बाहर लाया जाना, गुप्त रूप से भेजना, तथा कमरबंद—उन्हें नहीं जोड़ा गया।
