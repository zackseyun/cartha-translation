  text: XI. Κἀγὼ ᾔδειν ὅτι πονηρὸν² γένος ἦν³ τῶν Χαναναίων⁴, ἀλλὰ τὸ διαβούλιον⁵ τῆς νεότητος ἐτύφλωσε τὴν διάνοιάν μου. 2. Καὶ ἰδὼν⁸ αὐτὴν οἰνοχοοῦσαν⁹ ἠπατήθην, καὶ *†ἔλαβον αὐτὴν μὴ βουλευσαμένου τοῦ πατρός μου¹⁰. 3. Τὸν υἱόν μου Ἦρ¹¹. 4. Καὶ ὅτε ἀπενεκρώθη³⁰ ἐνιαυτόν¹³, *ὅτι αἰσθηθεὶς¹³ ἑαυτοῦ μου¹⁴ διὰ τὸν φόβον¹⁵ τοῦ μέλλειν με ἀποθανεῖν¹⁶ προηγαγον²⁰ ἀναβαίνοντα. 5. Αὐτὴ δὲ¹¹ ἀπόντος ἐμοῦ¹² ἐπορεύθη καὶ ἔλαβε τῷ¹³ Σηλὼμ¹⁴ γυναῖκα ἐκ¹⁵ τῆς Χαναάν¹⁶. *Ἐπιγνοὺς δὲ ἐγὼ¹⁸ ὃ ἐποίησε κατηρασάμην αὐτὴν¹⁹ ἐν ὀδύνῃ ψυχῆς μου. *Καίγε ἀπέθανεν ἐν τῇ²¹ πονηρίᾳ ²¹αὐτῆς ²μετὰ τῶν υἱῶν αὐτῆς²².
