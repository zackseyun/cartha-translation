  text: 1 And I knew that the race of the Canaanites was evil[a], but the impulse of youth blinded my understanding. 2 And when I saw her pouring wine, I was deceived, and I took her, though my father had not given counsel. 3 But while I was away, she went and took for Shelah a wife from Canaan. 4 And when I learned what she had done, I cursed her in the anguish of my soul. 5 And indeed she died in her wickedness[c][b], with her children.
translation:
  language: hi
  text: 1 मैं जानता था कि कनानियों का वंश दुष्ट था[a], पर जवानी के आवेग ने मेरी समझ को अंधा कर दिया। 2 जब मैंने उसे दाखमधु परोसते देखा, तो मैं धोखा खा गया और मैंने उसे ले लिया[b], यद्यपि मेरे पिता ने इसकी सलाह नहीं दी थी[c]।[d] 3 पर जब मैं दूर था, तब उसने जाकर शेलह के लिए कनान से एक पत्नी ले ली। 4 जब मुझे पता चला कि उसने क्या किया है, तो मैंने अपने मन की घोर पीड़ा में उसे शाप दिया। 5 और सचमुच वह अपनी दुष्टता में ही अपने पुत्रों समेत मर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी γένος का अर्थ ‘वंश’, ‘कुल’ या ‘जनसमूह’ हो सकता है। यहाँ इसे आधुनिक जैविक नस्ल की धारणा के अर्थ में नहीं समझना चाहिए।
    reason: lexical_alternative
  - marker: b
    text: ‘उसे ले लिया’ का आशय संभवतः ‘उसे पत्नी के रूप में ले लिया’ है, पर यूनानी अभिव्यक्ति अधिक संक्षिप्त और आकस्मिक है।
    reason: lexical_alternative
  - marker: c
    text: इसका अर्थ यह भी हो सकता है कि यहूदा ने अपने पिता याकूब की सलाह या स्वीकृति के बिना ऐसा किया।
    reason: alternative_reading
  - marker: d
    text: उपलब्ध यूनानी पाठ में यहाँ ‘मेरे पुत्र एर’ और उसकी मृत्यु से संबंधित कुछ अत्यंत दूषित तथा असंबद्ध शब्द आते हैं। उनसे कोई विश्वसनीय पूर्ण वाक्य पुनर्निर्मित नहीं किया जा सकता; इसलिए उन्हें मुख्य पाठ में अनुमान से पूरा नहीं किया गया है।
    reason: textual_uncertainty
lexical_decisions:
- source_word: πονηρὸν γένος
  choice: कनानियों का वंश दुष्ट था
  rationale: γένος यहाँ वंश, कुल या जनसमूह का बोध कराता है। ‘वंश’ प्राचीन वंशगत अर्थ को रखता है और आधुनिक जैविक ‘नस्ल’ की अनावश्यक ध्वनि से बचता है; πονηρός का नैतिक बल ‘दुष्ट’ में बना रहता है।
- source_word: διαβούλιον τῆς νεότητος
  choice: जवानी का आवेग
  rationale: शाब्दिक रूप से यह युवावस्था की सलाह, योजना या मनोवृत्ति कह सकता है; प्रसंग में यह उस उतावले युवा आवेग को सूचित करता है जिसने यहूदा की समझ पर अधिकार कर लिया।
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: मेरी समझ को अंधा कर दिया
  rationale: मूल का अंधेपन वाला रूपक और διάνοια का विचार-समझ संबंधी अर्थ दोनों सुरक्षित रहते हैं।
- source_word: οἰνοχοοῦσαν
  choice: दाखमधु परोसते
  rationale: कृदन्त का अर्थ दाखमधु उँडेलना या परोसना है। हिंदी में ‘परोसते’ दृश्य को स्वाभाविक और स्पष्ट रखता है।
- source_word: ἠπατήθην
  choice: मैं धोखा खा गया
  rationale: यूनानी कर्मवाच्य को स्वाभाविक हिंदी में रखते हुए बहकाए या भ्रमित किए जाने का भाव सुरक्षित किया गया है।
- source_word: ἔλαβον αὐτὴν
  choice: मैंने उसे ले लिया
  rationale: मूल अभिव्यक्ति संक्षिप्त और कठोर है। संदर्भ विवाह की ओर संकेत करता है, पर मुख्य पाठ में उसे स्पष्ट करके मूल की संक्षिप्तता को समाप्त नहीं किया गया।
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: मेरे पिता ने इसकी सलाह नहीं दी थी
  rationale: यह पिता द्वारा विचार या सलाह न दिए जाने को व्यक्त करता है। इसे केवल कानूनी ‘अनुमति’ तक सीमित नहीं किया गया।
- source_word: ἀπόντος ἐμοῦ
  choice: जब मैं दूर था
  rationale: यह ‘मेरी अनुपस्थिति में’ का सहज कथात्मक हिंदी रूप है।
- source_word: ἔλαβε τῷ Σηλὼμ γυναῖκα ἐκ τῆς Χαναάν
  choice: शेलह के लिए कनान से एक पत्नी ले ली
  rationale: यूनानी मुहावरा किसी के लिए पत्नी प्राप्त या निर्धारित करने का है। ‘कनान से’ स्थान और जनसमूह के बीच मूल की संभावित अस्पष्टता को बनाए रखता है।
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: अपने मन की घोर पीड़ा में
  rationale: ὀδύνη की तीव्र वेदना और ψυχή की भीतरी भावभूमि को सहज, गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: अपने पुत्रों समेत
  rationale: υἱοί का विशिष्ट अर्थ ‘पुत्र’ है; इसलिए व्यापक ‘बच्चों’ के बजाय इसे सीधे रखा गया है।
theological_decisions:
- issue: कनानियों के विषय में सामूहिक नैतिक कथन
  choice: कनानियों का वंश दुष्ट था
  alternative: कनानी लोग भ्रष्ट थे
  rationale: मूल पाठ एक व्यापक वंशगत-सामूहिक नैतिक दावा करता है। अनुवाद उसे छिपाता नहीं, पर ‘वंश’ चुनकर आधुनिक नस्लीय सिद्धांत आरोपित करने से बचता है।
- issue: ἔλαβον αὐτήν का वैवाहिक आशय
  choice: मैंने उसे ले लिया
  alternative: मैंने उससे विवाह कर लिया
  rationale: संदर्भ में विवाह का आशय संभावित है, किंतु यूनानी वाक्य जानबूझकर संक्षिप्त है। मुख्य पाठ उसकी कठोर संक्षिप्तता रखता है और पादटिप्पणी वैवाहिक अर्थ बताती है।
- issue: पिता की भूमिका—सलाह या अनुमति
  choice: मेरे पिता ने इसकी सलाह नहीं दी थी
  alternative: मेरे पिता की अनुमति के बिना
  rationale: βουλεύομαι विचार-विमर्श या सलाह से संबंधित है; केवल ‘अनुमति’ कहना अर्थ को अधिक निश्चित और कानूनी बना देता।
- issue: प्रेषित यूनानी पाठ का दूषित मध्यांश
  choice: अर्थहीन अंश को मुख्य कथन में पुनर्निर्मित न करके पादटिप्पणी में स्पष्ट करना
  alternative: खंडित शब्दों से एर की मृत्यु का अनुमानित वाक्य बनाना
  rationale: प्राप्त पाठ में ‘मेरे पुत्र एर’ और मृत्यु से जुड़े शब्दों का असंबद्ध, व्याकरणतः दूषित अंश है। अनुमान लगाकर नया कथन बनाना स्रोत की वास्तविक अनिश्चितता को छिपाता; इसलिए स्वीकृत सुसंगत कथानुक्रम रखा गया और पाठगत समस्या स्पष्ट बताई गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘दाखमधु’, ‘शाप’ और ‘वंश’ पाठ की प्राचीन वसीयतनुमा गंभीरता बनाए रखते हैं। जातिगत कथन को ईमानदारी से रखा गया है, पर आधुनिक नस्लीय अर्थ से बचने के लिए ‘नस्ल’ नहीं चुना गया। दूषित यूनानी मध्यांश पर मौन रहने के बजाय पाठगत पादटिप्पणी दी गई है।
