  source_fidelity: पद 1 में «ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν» के दोहरे ‘से’ का अर्थ ‘मेसोपोटामिया में लाबान के यहाँ से’ करने के बजाय ‘मेसोपोटामिया से, लाबान के यहाँ से’ होना चाहिए। पद 2 में βαρύς के भाव को ‘विशाल’ तक सीमित न रखकर ‘भारी-भरकम’ से अधिक निकटता से रखा गया है। पद 3, 5–8 मूल के अनुसार हैं; विशेषतः पद 6 में कोई अतिरिक्त वाक्य नहीं जोड़ा गया है और पद 7 में ὑποφόρους का करदाता-अधीनता वाला भाव सुरक्षित है।
  naturalness: संशोधित पाठ आधुनिक, सहज और गरिमामय हिन्दी रखता है। ‘भारी-भरकम और शक्तिशाली जन-समूह’ βαρύς καὶ ἰσχυρός का स्वाभाविक निकट अनुवाद है।
  terminology: प्रचलित बाइबिलीय नाम—याकूब, एसाव, रूबेन, गाद, सेईर और मिस्र—रखे गए हैं। ‘कोर’ को माप-इकाई के रूप में लिप्यंतरित रखा गया है। तेल की दूषित/अस्पष्ट माप के लिए ‘इकाई’ और सम्बद्ध टिप्पणी उचित हैं।
