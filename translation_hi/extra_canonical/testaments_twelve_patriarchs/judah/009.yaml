  text: 'For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.


    2 And when the eighteen years were fulfilled, Esau, my father''s brother, came against us with a heavy and powerful people.


    3 And Jacob struck Esau with a bow, and he fell, slain by Jacob''s bow, dead on Mount Seir.


    4 And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting down around it, we besieged it.


    5 And because they did not open to us after twenty days, while they were watching, I brought up a ladder; and placing my shield over my head, and receiving the stones, I went up and killed four of their mighty men.


    6 And Reuben and Gad killed another six. Then they entered in succession.


    7 Then they asked from us terms of peace, and after counsel had been taken with our father, we accepted them.


    8 And they were giving us five hundred cors of wheat, and five hundred measures of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.'
translation:
  language: hi
  text: 'यहूदा का वसीयतनामा 9


    1 हमारे मेसोपोटामिया से, लाबान के यहाँ से आने के बाद, मेरे पिता ने अठारह वर्ष तक अपने भाई एसाव के साथ शांति बनाए रखी, और उसके बेटे हमारे साथ रहे।


    2 अठारह वर्ष पूरे होने पर मेरे पिता का भाई एसाव एक भारी-भरकम और शक्तिशाली जन-समूह लेकर हमारे विरुद्ध आया।


    3 तब याकूब ने धनुष से एसाव को मारा, और उसका शव सेईर पर्वत पर उठा लिया गया।[a]


    4 हमने एसाव के बेटों का पीछा किया। उनके पास भी एक गढ़वाला नगर था, और हम उसमें प्रवेश नहीं कर सके। इसलिए हमने उसके चारों ओर डेरा डालकर उसे घेर लिया।


    5 जब बीस दिन तक उन्होंने हमारे लिए फाटक नहीं खोले, तो उनके देखते-देखते मैं एक सीढ़ी आगे ले आया। अपनी ढाल सिर के ऊपर रखकर मैं चढ़ गया और दीवार से फेंके जा रहे पत्थरों को रोकते हुए उनके नगर के चार सामर्थी शासकों को मार डाला।


    6 रूबेन और गाद ने छह और लोगों को मार डाला।


    7 तब उन्होंने हमसे शांति की शर्तें माँगीं। अपने पिता से विचार-विमर्श करने के बाद हमने उन्हें कर देने वाली प्रजा के रूप में स्वीकार कर लिया।


    8 वे हमें पाँच सौ कोर गेहूँ, पाँच सौ इकाई तेल[b] और पाँच सौ माप दाखमधु देते रहे—उस अकाल तक, जब हम मिस्र उतर गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक भाव है, “और मृत देह सेईर पर्वत पर उठा ली गई।” क्रिया निष्क्रिय है; शव को किसने उठाया, यह नहीं बताया गया है।
    reason: ἤρθη ὁ νεκρός की निष्क्रियता सुरक्षित रखता है, पर ἐν ὄρει Σεείρ के सामान्य स्थानवाचक अर्थ से आगे अनावश्यक संभावनाएँ नहीं जोड़ता।
  - marker: b
    text: तेल की माप बताने वाला यूनानी शब्द इस स्थान पर दूषित या अस्पष्ट है; इसलिए यहाँ सामान्य शब्द “इकाई” रखा गया है।
    reason: प्राप्त पाठ का †ὕφης सुरक्षित अर्थ नहीं देता; अनुमान से किसी विशिष्ट प्राचीन माप का नाम देना उचित नहीं।
lexical_decisions:
- source_word: ἐποίησεν ... εἰρήνην
  choice: शान्ति बनाए रखी
  rationale: यह मुहावरा अठारह वर्षों तक चली शांतिपूर्ण स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: एक विशाल और शक्तिशाली जन-समूह
  rationale: βαρύς का शाब्दिक ‘भारी’ हिन्दी में अस्वाभाविक होता; यहाँ संख्या/प्रभाव की विशालता और ἰσχυρός की शक्ति दोनों रखी गई हैं।
- source_word: ἤρθη ὁ νεκρὸς
  choice: उसका शव ... उठा लिया गया
  rationale: ग्रीक के निष्क्रिय और कुछ अस्पष्ट कथन को बनाए रखा गया है; अंग्रेज़ी परत की तरह धनुष से मारे जाने और गिरने का अतिरिक्त विवरण नहीं जोड़ा गया।
- source_word: πόλις ὀχυρά
  choice: गढ़वाला नगर
  rationale: साधारण पाठक के लिए स्पष्ट और ऐतिहासिक परिवेश के अनुकूल रूप।
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: दीवार से फेंके जा रहे पत्थरों को रोकते हुए
  rationale: वाक्य का युद्ध-संदर्भ रखते हुए अस्वाभाविक शाब्दिक ‘पत्थर ग्रहण करते हुए’ से बचा गया।
- source_word: δυνάστας
  choice: सामर्थी शासकों
  rationale: शब्द में शक्ति और प्रभुत्व दोनों के भाव हैं; केवल ‘वीर’ कहने से शासकीय अर्थ खो जाता।
- source_word: ὑποφόρους
  choice: कर देनेवाली प्रजा
  rationale: मूल में मौजूद अधीनता और कर/नज़राना देने की स्थिति को पुनर्स्थापित किया गया है, जिसे अंग्रेज़ी परामर्श-पाठ ने छोड़ दिया था।
- source_word: κόρους
  choice: कोर
  rationale: प्राचीन माप की इकाई को सामान्य आधुनिक इकाई में बदलने के बजाय लिप्यंतरित किया गया।
- source_word: οἴνου
  choice: दाखमधु
  rationale: गरिमामय और प्रचलित बाइबिलीय हिन्दी; स्रोत के सामान्य ‘wine’ अर्थ को व्यक्त करता है।
theological_decisions:
- issue: एसाव की मृत्यु का वर्णन
  choice: याकूब ने धनुष से मारा; फिर शव उठाए जाने का अस्पष्ट निष्क्रिय कथन
  alternative: याकूब के धनुष से एसाव मारा गया और गिर पड़ा
  rationale: ग्रीक पाठ स्पष्ट रूप से यह विस्तृत कारण-परिणाम नहीं कहता; कथा की हिंसा को न घटाते हुए पाठगत अस्पष्टता सुरक्षित रखी गई।
- issue: एसाव के बेटों की शान्ति-स्थिति
  choice: उन्हें कर देनेवाली प्रजा के रूप में स्वीकार किया
  alternative: केवल उनकी शान्ति-याचना स्वीकार की
  rationale: ὑποφόρους अधीन करदाता बनने का स्पष्ट संकेत देता है; इसे हटाना राजनीतिक और नैतिक तनाव को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमामय कथात्मक शैली। नामों और प्राचीन मापों के लिए प्रचलित बाइबिलीय रूप रखे गए हैं। अंग्रेज़ी परामर्श-पाठ में पद 6 के अंत का अतिरिक्त वाक्य मूल यूनानी में न होने के कारण नहीं लिया गया; पद 7 का ‘कर देनेवाली प्रजा’ मूल से पुनर्स्थापित किया गया है।
