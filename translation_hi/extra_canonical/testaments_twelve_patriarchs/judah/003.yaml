  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज वीरगाथात्मक कथन अपनाया गया है। हिंसक युद्ध-वर्णन को स्रोत के अनुरूप स्पष्ट रखा गया, पर अनावश्यक अलंकरण नहीं जोड़ा गया। प्राचीन नामों और भार-माप का देवनागरी लिप्यंतरण किया गया है; धार्मिक पदों में गैर-सांप्रदायिक शब्दावली रखी गई है।
