  text: '1[a]. And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I dragged him down and so killed him.


    2. And the other king, Taphou, while he was sitting on his horse, I killed; and so I scattered all his people[b].


    3. And I found Achor, a giant of a man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.


    4. And after fighting with Achor for two hours, I killed him; and when I had cut his shield into two pieces, I hacked through his feet.


    5. And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.


    6. But I wrapped my garment around my arm and slung stones at them; four of them I killed[c], and the others fled.'
translation:
  language: hi
  text: '### यहूदा का वसीयतनामा 3


    1. जब कनानियों के दो राजा कवच पहने हुए बहुत-से लोगों के साथ हमारे पशुओं के झुंडों पर चढ़ आए,[a] तब मैं अकेला दौड़कर एक राजा पर टूट पड़ा और उसकी हड्डियाँ चकनाचूर कर दीं।


    2. दूसरे राजा ताफू को, जो अपने घोड़े पर बैठा था, मैंने मार डाला; और इस प्रकार उसके सारे लोगों को तितर-बितर कर दिया।


    3. फिर मैंने आखोर नामक एक विशालकाय पुरुष को पाया, जो घोड़े पर बैठे-बैठे आगे और पीछे की ओर तीर चला रहा था। मैं उछलकर साठ लित्रा का एक पत्थर उठा लाया[b] और उससे घोड़े पर प्रहार करके उसे मार डाला।[c]


    4. फिर मैंने आखोर से दो घंटे तक युद्ध किया और उसे मार डाला। मैंने उसकी ढाल के दो टुकड़े कर दिए और उसके पैरों को काट डाला।


    5. जब मैं उसका कवच उतार रहा था, तभी देखो, उसके आठ साथी मुझसे लड़ने लगे।


    6. तब मैंने अपना वस्त्र अपनी बाँह पर लपेट लिया और गोफन से उन पर पत्थर चलाए। मैंने उनमें से चार को मार डाला और बाकी भाग गए।


    7. मेरे पिता याकूब ने बेलिसाथ को मार डाला, जो सब राजाओं का राजा और बल में बारह हाथ का एक विशालकाय पुरुष था।[d]


    8. तब उन सब पर आतंक छा गया और उन्होंने हमसे युद्ध करना छोड़ दिया।


    9. इसी कारण जब मैं अपने भाइयों के साथ रहता था, तब मेरे पिता युद्धों के विषय में निश्चिंत रहते थे।


    10. क्योंकि उन्होंने मेरे विषय में एक दर्शन देखा था कि सामर्थ्य का एक स्वर्गदूत हर बात में मेरे साथ चलता है, ताकि मैं पराजित न होऊँ।


    [a] इस अध्याय की यूनानी पाठ-परंपरा काफी उलझी हुई है। कुछ पांडुलिपियों में विरोधियों के नाम अलग रूपों में मिलते हैं, जैसे खोरा या नाखोर; युद्ध-वृत्तांत के कुछ अंश दोहराए गए हैं या उनका क्रम बदला हुआ है।


    [b] “लित्रा” प्राचीन भार-माप था। यहाँ आधुनिक माप में ठीक-ठीक भार बताने के बजाय पत्थर के असाधारण भारीपन पर बल दिया गया है।


    [c] यूनानी में “उसे” का व्याकरणिक संबंध घोड़े या आखोर, दोनों से हो सकता है। पर अगले पद में आखोर से युद्ध और उसकी मृत्यु का वर्णन होने के कारण यहाँ घोड़े का अभिप्राय अधिक संभव है।


    [d] यूनानी पाठ का शाब्दिक अर्थ “बल में बारह हाथ का” है, जो असामान्य अभिव्यक्ति है। संभव है कि किसी पाठ-परंपरा में यह उसके डील-डौल या कद का संकेत रहा हो, पर मुख्य पाठ की कठिनता को यथावत रखा गया है।'
  philosophy: optimal-equivalence
