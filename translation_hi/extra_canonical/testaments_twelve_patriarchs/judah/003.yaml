    4. फिर मैंने आखोर से दो घंटे तक युद्ध किया और उसे मार डाला। मैंने उसकी ढाल के दो टुकड़े कर दिए और उसके पैरों को काट डाला।


    5. जब मैं उसका कवच उतार रहा था, तभी देखो, उसके आठ साथी मुझसे लड़ने लगे।


    6. तब मैंने अपना वस्त्र अपनी बाँह पर लपेट लिया और गोफन से उन पर पत्थर चलाए। मैंने उनमें से चार को मार डाला और बाकी भाग गए।


    7. मेरे पिता याकूब ने बेलिसाथ को मार डाला, जो सब राजाओं का राजा और दैत्याकार पुरुष था; उसका बल बारह हाथ का था।[d]


