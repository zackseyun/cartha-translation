lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: कवच पहने हुए
  rationale: यह कृदंत युद्ध के लिए कवच से सुसज्जित होने का बोध कराता है; यह रूप आधुनिक और सहज है।
- source_word: ποίμνια
  choice: पशुओं के झुंड
  rationale: शब्द चरवाही के अधीन पशुधन के समूहों को दर्शाता है; केवल भेड़ों तक अर्थ सीमित नहीं किया गया।
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: उसकी हड्डियाँ चकनाचूर कर दीं
  rationale: प्रदत्त यूनानी पाठ में ‘हड्डियाँ’ और उन्हें हिंसापूर्वक तोड़ने या चीरने का भाव है; परामर्शी अंग्रेज़ी के ‘पिंडलियों पर मारकर नीचे खींचा’ को यहाँ आधार नहीं बनाया गया।
- source_word: διεσκόρπισα
  choice: तितर-बितर कर दिया
  rationale: मूल क्रिया बिखेर देने को व्यक्त करती है और सैन्य पराजय का परिणाम भी स्वाभाविक रूप से बताती है।
- source_word: γίγαντα
  choice: दैत्याकार पुरुष
  rationale: यह असाधारण आकार का वीरगाथात्मक चित्र बनाए रखता है, पर व्यक्ति को किसी विशिष्ट पौराणिक जाति का सदस्य घोषित नहीं करता।
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: साठ लित्रा का एक पत्थर
  rationale: प्राचीन इकाई का लिप्यंतरण स्रोत की सांस्कृतिक विशिष्टता बचाता है; आधुनिक भार में अनिश्चित रूपांतरण नहीं किया गया।
- source_word: σφενδονήσας
  choice: गोफन से ... पत्थर चलाए
  rationale: क्रिया गोफन से प्रक्षेप्य चलाने का स्पष्ट बोध कराती है।
- source_word: ἄγγελος δυνάμεως
  choice: सामर्थ्य का एक स्वर्गदूत
  rationale: सम्बन्धवाचक संरचना को बनाए रखा गया है; इसे बिना आधार किसी विशिष्ट नाम या पदवी से नहीं जोड़ा गया।
- source_word: συνέπεταί μοι
  choice: मेरे साथ रहता है
  rationale: क्रिया साथ चलने या साथ बने रहने का भाव देती है; हिन्दी में यह दर्शन के आश्वासन को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: पद 2–4 में विरोधियों के नाम और युद्ध-घटनाओं का अस्थिर पाठ
  choice: प्रदत्त यूनानी पाठ के अनुसार ताफू और आखोर नाम रखे गए और घटनाओं का मौजूदा क्रम सुरक्षित रखा गया।
  alternative: खोरा या नाखोर जैसे वैकल्पिक नाम लेना अथवा दोहराए हुए प्रसंगों को समन्वित करके एक घटना बनाना।
  rationale: पाठ की जटिलता को चुपचाप सुलझाने के बजाय मुख्य पाठ को स्रोत के अनुसार रखा और पादटिप्पणी में पांडुलिपीय अस्थिरता बताई गई।
- issue: पद 3 में αὐτόν का संदर्भ
  choice: इसे घोड़े के लिए समझा गया।
  alternative: इसे आखोर के लिए समझना।
  rationale: अगले पद में आखोर दो घंटे तक युद्ध करता और फिर मारा जाता है; अतः कथानक में घोड़े की मृत्यु अधिक संगत है। फिर भी यूनानी सर्वनाम की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: पद 7 में τῇ ἰσχύι πηχῶν δώδεκα की कठिन अभिव्यक्ति
  choice: ‘उसका बल बारह हाथ का था’ के रूप में औपचारिक कठिनता बनाए रखी गई।
  alternative: ‘उसका कद बारह हाथ था’ कहकर इसे शारीरिक ऊँचाई मान लेना।
  rationale: ‘बल’ और ‘हाथ’ का संयोजन स्रोत में असामान्य है। संभावित अर्थ को मुख्य पाठ में निश्चित कर देना पाठ की वास्तविक कठिनता मिटा देता।
- issue: पद 10 में स्वर्गदूत की पहचान
  choice: अनिश्चित पदबंध ‘सामर्थ्य का एक स्वर्गदूत’ रखा गया।
  alternative: उसे किसी नामित प्रधान स्वर्गदूत, मसीही आकृति या निजी रक्षक-दूत के सिद्धांत से पहचानना।
  rationale: स्रोत ऐसी विशिष्ट पहचान नहीं देता; अनावश्यक सांप्रदायिक या व्याख्यात्मक निष्कर्ष से बचना उचित है।
