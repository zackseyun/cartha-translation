translation:
  language: hi
  text: 'याकूब और लिआ के चौथे पुत्र यहूदा का वसीयतनामा


    1 यहूदा के उन वचनों की प्रतिलिपि, जो उसने अपनी मृत्यु से पहले अपने पुत्रों से कहे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयतनामा
  rationale: यह शीर्षक मृत्यु से पहले संतान को दिए गए अंतिम उपदेश और विरासत-संबंधी कथन को सूचित करता है; आधुनिक हिन्दी में ‘वसीयतनामा’ इस साहित्यिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यूनानी शब्द किसी लिखित नकल या प्रति का बोध कराता है; इसलिए इसे केवल ‘वचन’ न बनाकर पाठ-संचरण का संकेत सुरक्षित रखा गया है।
- source_word: λόγων
  choice: वचनों
  rationale: यहाँ शब्द कथनों या कही हुई बातों के अर्थ में है; ‘वचन’ गरिमापूर्ण और सहज है।
- source_word: ἐλάλησε
  choice: कहे
  rationale: साधारण बोलने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: अपनी मृत्यु से पहले
  rationale: शाब्दिक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
