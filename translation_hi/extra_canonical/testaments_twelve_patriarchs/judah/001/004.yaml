  text: अपनी जवानी में मैं तेज़ था, और अपने पिता की हर बात मानता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξύς
  choice: तेज़
  rationale: यह शब्द तीक्ष्णता, फुर्ती या प्रखरता का भाव दे सकता है। संदर्भ विशेष प्रकार की क्षमता निश्चित नहीं करता, इसलिए सहज हिन्दी का व्यापक शब्द ‘तेज़’ मूल की संक्षिप्त अस्पष्टता बनाए रखता है।
- source_word: ὑπήκουον
  choice: मानता था
  rationale: यहाँ पिता की बात सुनकर आज्ञापालन करने का भाव है; ‘बात मानता था’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: κατὰ πάντα λόγον
  choice: हर बात
  rationale: शाब्दिक रूप से ‘हर वचन/बात के अनुसार’; पिता के निर्देशों के व्यापक पालन को सहज हिन्दी में व्यक्त करता है।
