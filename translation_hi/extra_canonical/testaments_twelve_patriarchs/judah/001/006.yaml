  text: And when I had grown up, my father prayed for me, saying, ‘You shall be a king, prospering in all things.’
translation:
  language: hi
  text: और जब मैं बड़ा हो गया, तब मेरे पिता ने मेरे लिए प्रार्थना की और कहा, “तू राजा होगा और हर बात में सफल होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: मैं बड़ा हो गया
  rationale: यहाँ क्रिया का आशय परिपक्व होने या बड़े हो जाने से है; साधारण आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ηὔξατό μοι
  choice: मेरे लिए प्रार्थना करते हुए
  rationale: मध्यवाच्य क्रिया और μοι मिलकर यह भाव देते हैं कि पिता ने वक्ता के लिए प्रार्थना की; इसे केवल ‘आशीर्वाद दिया’ कहना स्रोत की क्रिया को अनावश्यक रूप से बदल देता।
- source_word: Βασιλεὺς ἔσῃ
  choice: तू राजा होगा
  rationale: भविष्यकालीन कथन को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: κατευοδούμενος ἐν πᾶσιν
  choice: हर बात में सफल होगा
  rationale: κατευοδόω सफलता या अनुकूल प्रगति का भाव देता है; ἐν πᾶσιν की व्यापकता ‘हर बात में’ से सुरक्षित रहती है।
theological_decisions:
- issue: पिता के कथन का स्वरूप
  choice: इसे प्रार्थना से जुड़ा भविष्यवाची कथन रखा गया है
  alternative: इसे औपचारिक आशीर्वाद या निश्चित भविष्यवाणी कहना
  rationale: ηὔξατό μοι का प्राथमिक अर्थ उसके लिए प्रार्थना करना है, जबकि λέγων के बाद कथन आता है; अनुवाद इससे अधिक विशिष्ट धार्मिक श्रेणी आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। पारिवारिक प्रत्यक्ष संबोधन में ‘तू’ मूल के एकवचन निकट संबोधन को स्वाभाविक रूप से व्यक्त करता है।
