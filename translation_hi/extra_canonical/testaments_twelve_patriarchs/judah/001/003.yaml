base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/003.yaml
  text: “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’
translation:
  language: hi
  text: “हे मेरे बच्चों, अपने पिता यहूदा की बात सुनो। मैं अपने पिता याकूब का चौथे पुत्र के रूप में जन्मा, और मेरी माता लिआ ने मेरा नाम यहूदा रखा। उसने कहा, ‘मैं प्रभु की स्तुति करती हूँ, क्योंकि उसने मुझे चौथा पुत्र भी दिया है।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: की बात सुनो
  rationale: आज्ञार्थक क्रिया को स्वाभाविक हिन्दी में व्यक्त किया गया; अगले पदबंध में वक्ता की पहचान जुड़ने से अर्थ स्पष्ट रहता है।
- source_word: τέκνα μου
  choice: हे मेरे बच्चो
  rationale: संबोधन का स्नेह और प्रत्यक्षता बनाए रखने के लिए आधुनिक, सहज बहुवचन रूप चुना गया।
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: मैं ... चौथा पुत्र पैदा हुआ
  rationale: जन्म-क्रम बताने वाले यूनानी कथन को स्वाभाविक हिन्दी में रखा गया।
- source_word: ἐπωνόμασέν με Ἰούδαν
  choice: मेरा नाम यहूदा रखा
  rationale: नामकरण के लिए प्रचलित और स्पष्ट हिन्दी अभिव्यक्ति।
- source_word: Ἀνθομολογοῦμαι τῷ Κυρίῳ
  choice: मैं प्रभु की स्तुति करती हूँ
  rationale: क्रिया यहाँ धन्यवादपूर्ण प्रशंसा व्यक्त करती है; स्त्रीलिंग रूप वक्ता लिआ के अनुरूप है।
- source_word: καὶ τέταρτον υἱόν
  choice: चौथा पुत्र भी
  rationale: καί के योगात्मक बल को ‘भी’ से सुरक्षित रखा गया।
theological_decisions:
- issue: Κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में सामान्य उपाधि Κύριος है; किसी विशिष्ट हिब्रू पुनर्निर्माण को आरोपित किए बिना ‘प्रभु’ स्रोत का औपचारिक और पारंपरिक समतुल्य है।
- issue: Ἀνθομολογοῦμαι में प्रशंसा और धन्यवाद का संबंध
  choice: स्तुति करती हूँ
  alternative: धन्यवाद देती हूँ
  rationale: क्रिया में अंगीकार, धन्यवाद और प्रशंसा के अर्थ-क्षेत्र मिलते हैं। नाम ‘यहूदा’ से जुड़े प्रशंसा-भाव को बनाए रखते हुए ‘स्तुति’ चुना गया, बिना इसे संकीर्ण सिद्धान्तगत अर्थ देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। यूनानी स्रोत की प्रत्यक्ष वाणी और जन्म-क्रम सुरक्षित रखा गया है। स्रोत में ‘लिआ ... ἤμην’ व्याकरणगत रूप से दूषित प्रतीत होता है; प्रसंग और नामकरण-क्रिया के आधार पर आशय ‘मेरी माता लिआ ने’ के रूप में प्रस्तुत किया गया है।
