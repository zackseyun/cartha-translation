review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Κύριος (“प्रभु”), despite the conflicting latest English audit text; the supplied Greek explicitly reads ἔδωκέ μοι Κύριος. It also correctly does not add the father's name. The sense of ἀλλοιώσουσι as harmful alteration/corruption is acceptable in context. A small wording revision better reflects ἐν ὑπακοῇ πατρός μου as obedience to one's father and σμικρυνθῆναι as diminution of the kingdom.
  naturalness: “राज्य को छोटा कर देंगे” is understandable but not idiomatic for the reduction or weakening of a kingdom. “राज्य को घटा देंगे” is more natural and suitably direct. “मेरे पिता की आज्ञा मानने के कारण” is more idiomatic than the abstract construction “मेरे पिता के प्रति मेरी आज्ञाकारिता के कारण.”
  terminology: “प्रभु,” “यहूदा,” and “राज्य” are appropriate. “भ्रष्ट कर देंगे” is a defensible contextual rendering of ἀλλοιώσουσι and does not over-specify a particular mechanism of corruption.
  issues:
  - severity: low
    issue: Idiomatic rendering of the kingdom's diminution
    rationale: σμικρυνθῆναι ποιήσουσιν means that they will cause Judah's kingdom to be diminished. Hindi “छोटा कर देंगे” is literal but less natural than “घटा देंगे.”
  - severity: low
    issue: Expression of obedience to the father
    rationale: ἐν ὑπακοῇ πατρός μου is most naturally rendered as acting in obedience to one's father. The revision states this directly without adding Jacob's name or introducing doctrinal interpretation.
  revised_text: क्योंकि वे मेरे पुत्रों में से बुद्धिमान पुरुषों को भी भ्रष्ट कर देंगे और यहूदा के राज्य को घटा देंगे—उस राज्य को, जिसे प्रभु ने मेरे पिता की आज्ञा मानने के कारण मुझे दिया था।
  revised_footnotes: []
  revision_rationale: The revision makes two minor idiomatic improvements while preserving the Greek's syntax and claims. In particular, it retains “प्रभु” because Κύριος is present in the supplied Greek source; the English audit trail's omission is not followed. No footnote is needed.
