reference: Testament of Judah 17:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὅτι καὶ¹⁶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν¹⁷ Ἰούδα σμικρυνθῆναι ποιήσουσιν¹⁸, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/003.yaml
  text: For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which he gave me because of my obedience to my father Jacob.
translation:
  language: hi
  text: क्योंकि वे मेरे पुत्रों में से बुद्धिमान पुरुषों को भी भ्रष्ट कर देंगे और यहूदा के राज्य को घटा देंगे—उस राज्य को, जिसे प्रभु ने मेरे पिता की आज्ञा मानने के कारण मुझे दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοιώσουσι
  choice: भ्रष्ट कर देंगे
  rationale: मूल अर्थ ‘बदल देना’ है, पर यहाँ बुद्धिमान लोगों पर हानिकारक नैतिक प्रभाव का संदर्भ है; ‘भ्रष्ट करना’ उसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: βασιλείαν Ἰούδα
  choice: यहूदा के राज्य
  rationale: यह पदबंध यहूदा से संबद्ध राज्य या राजसत्ता को दर्शाता है; ‘यहूदा का राज्य’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: छोटा कर देंगे
  rationale: कारक संरचना का अर्थ है ‘घटने/छोटा होने का कारण बनेंगे’; हिन्दी में सक्रिय अभिव्यक्ति अर्थ को सीधे रखती है।
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: मेरे पिता के प्रति मेरी आज्ञाकारिता के कारण
  rationale: ἐν यहाँ आधार या कारण का भाव देता है और πατρός μου संबंध का लक्ष्य है; मूल में पिता का नाम ‘याकूब’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: Κύριος
  choice: प्रभु
  rationale: प्रस्तुत यूनानी स्रोत में Κύριος स्पष्ट रूप से विद्यमान है; इसलिए इसे अनुवाद में बनाए रखा गया है।
theological_decisions:
- issue: राज्य देने वाले कर्ता की पहचान
  choice: ‘प्रभु ने ... मुझे दिया था’
  alternative: ‘उसने ... मुझे दिया था’
  rationale: यूनानी मूल में Κύριος स्पष्ट है। अंग्रेज़ी परामर्श-पाठ की नवीनतम समीक्षा इसके अभाव का दावा करती है, पर वह दिए गए मूल-पाठ से मेल नहीं खाता; स्रोत-साक्ष्य को प्राथमिकता दी गई।
- issue: पिता की पहचान
  choice: केवल ‘मेरे पिता’
  alternative: ‘मेरे पिता याकूब’
  rationale: यद्यपि संदर्भ में पिता याकूब हैं, मूल पद में नाम नहीं दिया गया; अतः व्याख्यात्मक जोड़ से बचा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। दोहराए गए ‘उस राज्य को’ से स्त्रीलिंग संबंधवाचक ἣν का स्पष्ट संबंध ‘यहूदा के राज्य’ से बना रहता है और अर्थगत अस्पष्टता नहीं आती।
