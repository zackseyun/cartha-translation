source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/001.yaml
  text: 'And now I command you, my children: do not love silver, nor set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चों, मैं तुम्हें आज्ञा देता हूँ: चाँदी से प्रेम न करना और स्त्रियों की सुंदरता पर अपनी दृष्टि न टिकाना; क्योंकि मैं भी सोने और सुंदरता के कारण कनानी स्त्री बेसुए की ओर भटक गया था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριον
  choice: चाँदी
  rationale: यूनानी शब्द का सीधा अर्थ ‘चाँदी’ है; प्रसंग में यह धन का भी संकेत दे सकता है, पर मूल बिंब बनाए रखा गया है।
- source_word: ἐπιβλέπειν εἰς κάλλος γυναικῶν
  choice: स्त्रियों की सुंदरता पर दृष्टि लगाना
  rationale: यह केवल देखने से अधिक, आकर्षण से निगाह टिकाने का भाव व्यक्त करता है और निषेध की नैतिक तीव्रता बनाए रखता है।
- source_word: ἐπλανήθην
  choice: भटककर ... चला गया
  rationale: मूल क्रिया के ‘भटका दिया जाना/मार्ग से हट जाना’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कारणकारी भूमिका को अत्यधिक निश्चित किए।
- source_word: Βησουὲ
  choice: बेसुए
  rationale: यूनानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: τὴν Χαναναίαν
  choice: कनानी स्त्री
  rationale: स्त्रीलिंग जातिवाचक विशेषण को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: धन और सौंदर्य के कारण यहूदा का भटकना
  choice: ‘सोने और सुंदरता के कारण भटककर’
  alternative: ‘सोने और सुंदरता ने मुझे बहकाकर’
  rationale: मूल में निष्क्रिय रूप है, पर साधन या कारण की सटीक भूमिका खुली रहती है; चुना गया रूप इस नैतिक तनाव को बनाए रखता है और सोने या सुंदरता को पूर्णतः व्यक्तिकृत कर्ता नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली। ‘मेरे बच्चो’ संबोधन को स्वाभाविक हिन्दी रूप में रखा गया है; ‘चाँदी’ और ‘सोना’ के मूल बिंब सुरक्षित हैं।
