review_pass:
  verdict: revise
  source_fidelity: Draft correctly renders οἶδα, διὰ τὰ δύο ταῦτα, and τὸ γένος μου. However, “विनाश की ओर जाएगा” shifts ἔσται εἰς ἀπώλειαν (“will be for/designed for destruction”) into a journey toward destruction. “व्यभिचार” is narrower than πορνεία, and “से” is less clear than the causal construal reflected in the English audit trail.
  naturalness: The revision is idiomatic modern standard Hindi while retaining the grave testamentary register. “विनाश के लिए होगा” is a natural way to express future destiny without adding an event or process absent from the Greek.
  terminology: “यौन अनैतिकता” appropriately represents the broader ethical range of πορνεία; “व्यभिचार” can specifically denote adultery and is therefore too narrow here. “वंश” remains suitable for γένος.
  issues:
  - severity: medium
    issue: “विनाश की ओर जाएगा” renders the construction as movement toward destruction.
    rationale: ἔσται εἰς ἀπώλειαν states that the speaker’s offspring will be for destruction, rather than that it will go toward it.
  - severity: medium
    issue: “व्यभिचार” narrows πορνείας.
    rationale: πορνεία can include adultery but more broadly denotes sexual immorality; the broader Hindi expression preserves that range.
  - severity: low
    issue: “व्यभिचार से” leaves the intended causal relation less explicit.
    rationale: The English audit trail construes πορνείας causally. “यौन अनैतिकता के कारण” communicates this clearly without introducing a specific doctrinal account.
  revised_text: और मैं जानता हूँ कि इन दोनों बातों के कारण मेरा वंश यौन अनैतिकता के कारण विनाश के लिए होगा।
