  to: और मैं जानता हूँ कि इन दोनों बातों के कारण मेरा वंश यौन अनैतिकता के कारण विनाश के लिए होगा।
  rationale: The text is revised to preserve the source’s future state/destiny construction (ἔσται εἰς ἀπώλειαν), retain the audit trail’s causal understanding of πορνείας, and use a Hindi term broad enough for πορνεία. No footnote is needed because the causal rendering follows the supplied English POB audit trail and no structural ambiguity requires an anchor.
