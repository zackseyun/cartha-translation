source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα¹² ὅτι διὰ τὰ δύο ταῦτα ἔσται¹³ τὸ γένος μου¹⁴ *εἰς ἀπώλειαν πορνείας¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/002.yaml
  text: And I know that because of these two things my offspring will be for destruction because of sexual immorality.
translation:
  language: hi
  text: और मैं जानता हूँ कि इन दोनों बातों के कारण मेरा वंश यौन अनैतिकता के कारण विनाश के लिए होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: पूर्ण रूप वर्तमान अर्थ रखता है और वक्ता के निश्चित ज्ञान को व्यक्त करता है।
- source_word: διὰ τὰ δύο ταῦτα
  choice: इन दोनों बातों के कारण
  rationale: διά के कारणसूचक अर्थ और δύο के स्पष्ट संख्यात्मक संकेत को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὸ γένος μου
  choice: मेरा वंश
  rationale: γένος यहाँ यहूदा की भावी संतति या वंश को दर्शाता है; ‘वंश’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἔσται εἰς ἀπώλειαν
  choice: विनाश की ओर जाएगा
  rationale: शाब्दिक संरचना ‘विनाश के लिए होगा’ हिन्दी में अस्वाभाविक है; यह रूप εἰς की परिणाम या गंतव्य की दिशा को बनाए रखता है, बिना विनाश को पहले ही पूर्ण हुआ बताने के।
- source_word: πορνείας
  choice: व्यभिचार से
  rationale: πορνεία व्यापक यौन अनैतिकता को सूचित कर सकता है; इस वसीयतनुमा नैतिक संदर्भ में ‘व्यभिचार’ साधारण पाठक के लिए स्वाभाविक है, और संबंधवाचक रूप को कारण/स्रोत के रूप में ‘से’ द्वारा रखा गया है।
theological_decisions:
- issue: πορνείας का ἀπώλειαν से संबंध
  choice: ‘व्यभिचार से विनाश की ओर’—व्यभिचार को विनाश का कारण या माध्यम समझने की गुंजाइश
  alternative: ‘व्यभिचार के विनाश के लिए’ अथवा ‘व्यभिचार के कारण विनाश के लिए होगा’
  rationale: यूनानी संबंधवाचक पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। चुना हुआ हिन्दी रूप अंग्रेज़ी परामर्श-पाठ के कारणात्मक संकेत के अनुरूप है, पर इसे किसी विशिष्ट दंड-सिद्धांत में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गंभीर और वसीयतनुमा स्वर। पद में कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
