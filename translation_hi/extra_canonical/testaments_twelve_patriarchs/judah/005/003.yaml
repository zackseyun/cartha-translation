lexical_decisions:
- source_word: οἱ ἐπὶ τοῦ τείχους
  choice: शहरपनाह पर खड़े लोग
  rationale: यह पदबंध दीवार/नगर-प्राचीर पर स्थित लोगों को दर्शाता है; ‘शहरपनाह’ युद्ध और नगर-सुरक्षा के संदर्भ में स्वाभाविक तथा सटीक है।
- source_word: ὅτι ἡμεῖς μόνοι ἐσμέν
  choice: यह सोचकर कि हम अकेले हैं
  rationale: ὅτι यहाँ उन लोगों की धारणा की विषयवस्तु बताता है। हिन्दी में कारणगत कृदंत-रचना प्रसंग को सहज बनाती है।
- source_word: ἐφειλκύσθησαν
  choice: खिंचे चले आए
  rationale: क्रिया के आकर्षित या खींचे जाने के भाव को बनाए रखते हुए यह हिन्दी में उनकी आगे की गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πρὸς ἡμᾶς
  choice: हमारी ओर
  rationale: πρός के दिशात्मक अर्थ को सुरक्षित रखता है और अनावश्यक रूप से शत्रुतापूर्ण ‘हमारे विरुद्ध’ अर्थ नहीं जोड़ता।
