  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उपलब्ध यूनानी पाठ में अंग्रेज़ी परामर्श-पाठ के ‘उन्हें अपने पुत्रों को सौंपने’ और ‘थप्पूए तक’ वाले अंश नहीं हैं, इसलिए उन्हें मुख्य पाठ में नहीं जोड़ा गया।
