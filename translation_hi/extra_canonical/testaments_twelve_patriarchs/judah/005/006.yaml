source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐν δὲ τῷ ἀπιέναι ἡμᾶς²², ἄνδρες †Βαβουὲ ἐπελάβοντο²³ τὴν αἰχμαλωσίαν ἡμῶν, καὶ ἰδόντες ἡμεῖς συνῆψαν πόλεμον μετ᾽ αὐτῶν²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/006.yaml
  text: And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue.
translation:
  language: hi
  text: जब हम वहाँ से जा रहे थे, तब बाबूए[a] के लोगों ने हमारे बंदियों को पकड़ लिया। यह देखकर हमने उनसे युद्ध छेड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में इस स्थान का नाम अनिश्चित है; मुद्रित पाठ में इसे “बाबूए” के लगभग रूप में दिया गया है, जबकि एक अन्य पाठ-परंपरा इसे “थप्पूए” मानती है।
    reason: मूल संस्करण में स्थान-नाम के आगे पाठ-संदेह का चिह्न है, और परामर्शार्थ अंग्रेज़ी पाठ में भिन्न नाम मिलता है; इस अनिश्चितता को छिपाना उचित नहीं।
lexical_decisions:
- source_word: ἀπιέναι
  choice: वहाँ से जा रहे थे
  rationale: क्रिया का अर्थ ‘चले जाना/प्रस्थान करना’ है; प्रसंगानुकूल सहज हिन्दी में स्थान से प्रस्थान व्यक्त किया गया है।
- source_word: ἄνδρες
  choice: लोगों
  rationale: यहाँ नगर या समूह के पुरुष प्रतिनिधियों के लिए प्रयुक्त सामान्य बहुवचन है; हिन्दी में ‘के लोगों’ अधिक स्वाभाविक है और अनावश्यक रूप से केवल वयस्क पुरुषों पर बल नहीं देता।
- source_word: ἐπελάβοντο
  choice: पकड़ लिया
  rationale: मध्य रूप का आशय किसी पर हाथ डालकर उसे अपने अधिकार में लेना है; बंदियों के संदर्भ में ‘पकड़ लिया’ स्पष्ट और स्वाभाविक है।
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: हमारे बंदियों
  rationale: एकवचन भाववाचक/समूहवाचक संज्ञा यहाँ बंदी बनाए गए लोगों के समूह को सूचित करती है; हिन्दी में बहुवचन अधिक सहज है।
- source_word: ἰδόντες ἡμεῖς
  choice: यह देखकर हमने
  rationale: ग्रीक कृदन्त घटना को देखकर की गई अगली कार्रवाई बताता है; कर्ता पर दिए गए बल को ‘हमने’ से बनाए रखा गया है।
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: उनसे युद्ध छेड़ दिया
  rationale: मुहावरे का शाब्दिक अर्थ युद्ध को जोड़ना/आरम्भ करना है; ‘युद्ध छेड़ दिया’ वर्तमान हिन्दी में स्वाभाविक समतुल्य है।
