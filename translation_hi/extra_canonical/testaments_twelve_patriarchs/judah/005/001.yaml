  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले वाक्य के बाद विराम देकर नगर के वर्णन को हिन्दी में स्पष्ट बनाया गया है; इससे मूल अर्थ या संबंध नहीं बदलता।
