  text: Καὶ¹ τῇ ἑξῆς ἀπήλθομεν εἰς Ἀρετὰν², πόλιν κραταιάν³, *ἀπειλοῦσαν ἡμῖν θάνατον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/001.yaml
  text: And on the next day we went to Areta, a city still mighty and strong, threatening us with death.
translation:
  language: hi
  text: और अगले दिन हम अरेता गए। वह एक शक्तिशाली नगर था, जो हमें जान से मार डालने की धमकी दे रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: अगले दिन
  rationale: स्त्रीलिंग विशेषण के साथ निहित ἡμέρᾳ (‘दिन’) को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: ἀπήλθομεν
  choice: हम ... गए
  rationale: यहाँ क्रिया का आशय किसी स्थान की ओर जाने से है; ‘चले गए’ की अपेक्षा ‘गए’ अधिक सहज है और अनावश्यक प्रस्थान-बल नहीं जोड़ता।
- source_word: Ἀρετάν
  choice: अरेता
  rationale: स्थान-नाम का यूनानी रूप से सीधा देवनागरी लिप्यंतरण किया गया है।
- source_word: πόλιν κραταιάν
  choice: एक शक्तिशाली नगर
  rationale: κραταιός का अर्थ ‘शक्तिशाली/प्रबल’ है। स्रोत में केवल एक विशेषण है, इसलिए अंग्रेज़ी परामर्श-पाठ के ‘still mighty and strong’ को दोहराया नहीं गया।
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: जो हमें जान से मार डालने की धमकी दे रहा था
  rationale: यूनानी पदबंध का मुहावरेदार हिन्दी रूप चुना गया है; इससे मृत्यु की धमकी का अर्थ स्पष्ट रहता है और नगर को मानवीय कर्ता के रूप में प्रस्तुत करने वाला मूल रूपक भी बना रहता है।
