source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ κατελάβομεν αὐτὴν¹⁸ ἐν στόματι μαχαίρας¹⁹, καὶ τοὺς ἐν τῷ πύργῳ²⁰ καταφυγόντας ἐν πυρὶ ἐνεπρήσαμεν, καὶ οὕτως πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/005.yaml
  text: And we took it by the edge of the sword, and those who had fled for refuge in the tower we burned with fire; and so we captured them all.
translation:
  language: hi
  text: और हमने तलवार की धार से उस पर अधिकार कर लिया। जो लोग शरण लेने के लिए मीनार में भाग गए थे, उन्हें हमने आग में जला दिया। इस प्रकार हमने उन सभी को और उनकी सारी संपत्ति को अपने अधिकार में ले लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβομεν αὐτήν
  choice: हमने ... उस पर अधिकार कर लिया
  rationale: क्रिया का अर्थ यहाँ किसी स्त्रीलिंग स्थान या नगरी को बलपूर्वक अपने अधिकार में लेना है; पूर्ववर्ती संदर्भ के बिना उसका नाम जोड़ना उचित नहीं।
- source_word: ἐν στόματι μαχαίρας
  choice: तलवार की धार से
  rationale: यूनानी का शाब्दिक रूप ‘तलवार के मुँह से’ है; हिन्दी में ‘तलवार की धार से’ वही प्रचलित युद्ध-संबंधी भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ πύργῳ
  choice: मीनार में
  rationale: स्रोत में शब्द एकवचन है, इसलिए ‘मीनार’ रखा गया है, ‘मीनारों’ नहीं।
- source_word: καταφυγόντας
  choice: शरण लेने के लिए ... भाग गए थे
  rationale: यह क्रिया संकट से बचने के लिए किसी सुरक्षित स्थान में जा छिपने या शरण लेने का भाव देती है।
- source_word: πάντα τὰ αὐτῶν
  choice: उनकी सारी संपत्ति
  rationale: शाब्दिक अर्थ ‘उनका सब कुछ’ है; लूट या विजय के प्रसंग में इसका स्वाभाविक आशय उनकी वस्तुओं अथवा संपत्ति से है। यह वाक्यांश अंग्रेज़ी परामर्श-पाठ में छूट गया है, पर यूनानी स्रोत में स्पष्ट रूप से उपस्थित है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यूनानी स्रोत के अंतिम पदबंध καὶ πάντα τὰ αὐτῶν को अंग्रेज़ी POB में न होने पर भी अनुवाद में सुरक्षित रखा गया है। युद्ध की कठोरता को न नरम किया गया है, न बढ़ाया गया है।
