  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/004.yaml
  text: But all my brothers, having driven stakes into the wall from both sides, entered the city while they were unaware.
translation:
  language: hi
  text: और इस प्रकार मेरे भाई चुपके से दीवार के दोनों ओर से नगर में प्रवेश कर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह पूर्ववर्ती घटनाक्रम से साधन या परिणाम का स्वाभाविक संबंध व्यक्त करता है।
- source_word: λάθρα
  choice: चुपके से
  rationale: यूनानी क्रियाविशेषण गुप्त या अनदेखे ढंग से किए गए प्रवेश को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους
  choice: दीवार के दोनों ओर से
  rationale: शाब्दिक अर्थ ‘दीवार के दोनों भागों/ओरों से’ है; आधुनिक हिन्दी में ‘दोनों ओर से’ अधिक स्वाभाविक है और स्थानगत अर्थ सुरक्षित रखता है।
- source_word: εἰσῆλθον εἰς τὴν πόλιν
  choice: नगर में प्रवेश कर गए
  rationale: यह नगर के भीतर जाने की पूर्ण हुई क्रिया को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
