base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
translation:
  language: hi
  text: और सचमुच, इन बातों का पश्चाताप करके, मैंने अपनी वृद्धावस्था तक न तो दाखरस पिया, न मांस खाया, और कोई आनंद नहीं देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: और सचमुच
  rationale: यह संयोजन पिछले कथन से संबंध बनाए रखते हुए कथन पर बल देता है।
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: इन बातों के लिए पश्चाताप करने के बाद
  rationale: μετανοέω यहाँ केवल विचार बदलने से अधिक, किए हुए कामों पर खेद और जीवन में परिवर्तन का भाव रखता है; ἐπὶ τούτοις का स्वाभाविक हिन्दी रूप ‘इन बातों के लिए’ है।
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: न दाखमधु पिया, न मांस खाया
  rationale: यूनानी में एक ही क्रिया ἔφαγον दोनों संज्ञाओं के साथ आई है, पर हिन्दी में पेय के लिए ‘पिया’ और भोजन के लिए ‘खाया’ कहना स्वाभाविक तथा अर्थ की दृष्टि से सटीक है।
- source_word: ἕως γήρους μου
  choice: अपने बुढ़ापे तक
  rationale: यह समय-सीमा को सीधे व्यक्त करता है और मूल पाठ की अवधि-संबंधी अस्पष्टता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: किसी भी प्रकार का आनंद नहीं देखा
  rationale: ‘आनंद देखना’ मूल की अभिव्यक्ति को बनाए रखता है, जबकि ‘किसी भी प्रकार का’ πᾶσαν के साथ निषेध के व्यापक बल को स्पष्ट करता है।
theological_decisions:
- issue: पश्चाताप का स्वरूप
  choice: पश्चाताप
  alternative: मन बदलना
  rationale: संदर्भ में वक्ता अपने पूर्व कर्मों के फलस्वरूप संयम अपनाता है, इसलिए ‘पश्चाताप’ μετανοήσας के नैतिक भाव को अधिक ठीक रूप से व्यक्त करता है, बिना किसी विशिष्ट सांप्रदायिक अर्थ को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘दाखमधु’ प्राचीन संदर्भ के अनुरूप है; यूनानी के अस्वाभाविक साझा क्रियापद को हिन्दी में ‘पिया/खाया’ के स्वाभाविक युग्म से व्यक्त किया गया है।
