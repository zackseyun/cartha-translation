source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/002.yaml
  text: For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered.
translation:
  language: hi
  text: क्योंकि यदि कोई राजा भी हो और यौन अनैतिकता में लिप्त हो, तो यौन अनैतिकता का दास बनकर वह राजत्व से वंचित हो जाता है, जैसा कि मैंने भी सहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύῃ / πορνείᾳ
  choice: व्यभिचार करे / व्यभिचार का
  rationale: यहाँ शब्द अनुचित यौन आचरण को सूचित करता है। प्रसंग में संज्ञा और क्रिया की पुनरावृत्ति बनाए रखते हुए ‘व्यभिचार’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: γυμνοῦται τῆς βασιλείας
  choice: अपने राजपद से वंचित कर दिया जाता है
  rationale: शाब्दिक अर्थ ‘राजत्व से नग्न/विहीन किया जाता है’ है; हिन्दी में ‘राजपद से वंचित’ पद और अधिकार छिन जाने का भाव स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: δουλεύσας
  choice: दास बन जाता है
  rationale: मूल में दासत्व या अधीनता का प्रबल रूपक है; इसे केवल ‘अधीन’ कहकर हल्का नहीं किया गया।
- source_word: ὡς κἀγὼ ἔπαθον
  choice: जैसा कि मैंने भी भुगता
  rationale: ἔπαθον के अनुभव और कष्ट—दोनों भावों को ‘भुगता’ संक्षेप में सँभालता है और वक्ता के निजी परिणाम को बनाए रखता है।
theological_decisions:
- issue: यौन पाप और राजत्व के संबंध की प्रकृति
  choice: ‘राजपद से वंचित कर दिया जाता है’ के रूप में कथन को यथावत रखा
  alternative: इसे केवल नैतिक प्रतिष्ठा या भावी आध्यात्मिक पुरस्कार खोने के अर्थ में स्पष्ट करना
  rationale: मूल पाठ यह नहीं बताता कि राजत्व का खोना राजनीतिक, नैतिक या आध्यात्मिक अर्थ में है; इसलिए किसी एक व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: व्यभिचार के प्रति दासत्व
  choice: दासत्व का रूपक स्पष्ट रूप से रखा
  alternative: ‘व्यभिचार के वश में हो जाता है’
  rationale: ‘दास’ मूल δουλεύσας की शक्ति और धर्मशास्त्रीय तनाव को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सहज और गरिमापूर्ण शैली। यूनानी वाक्य की कारणसूचक शुरुआत, राजत्व खोने का निष्क्रिय भाव, और व्यभिचार के दासत्व का रूपक सुरक्षित रखा गया है।
