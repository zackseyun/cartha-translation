source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ²⁴ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν²⁹ βασιλέως αἴρουσιν³⁰ τὴν δόξαν τοῦ ἀνδρὸς⁵¹ τὴν δύναμιν, *τοῦ δὲ πτωχοῦ³⁴ *τὴν⁵² πτωχείας⁵³ ἐλάχιστον στήριγμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/005.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's support.
translation:
  language: hi
  text: और परमेश्वर के दूत ने मुझे दिखाया कि स्त्रियाँ राजा को अपने वश में रखती हैं और निर्धन पर अधिकार जमाती हैं। वे राजा से उसकी महिमा, पुरुष से उसकी शक्ति, और निर्धन से उसकी निर्धनता का सबसे छोटा सहारा छीन लेती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम यूनानी पदबंध का शब्दशः भाव है: “निर्धन से उसकी निर्धनता का सबसे छोटा सहारा।” इसका वाक्य-विन्यास दुरूह है और ‘निर्धनता का’ संबंध पूरी तरह स्पष्ट नहीं है।'
    reason: यूनानी के कठिन πτωχείας ἐλάχιστον στήριγμα पदबंध और उसके संबंधवाचक अर्थ की अनिश्चितता को पारदर्शी रखना।
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: राजा को अपने वश में रखती हैं
  rationale: κρατέω के नियंत्रण या पकड़ रखने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी में ‘सदा’ का कोई स्पष्ट शब्द नहीं है, इसलिए अंग्रेज़ी परामर्श-पाठ का ‘forever’ नहीं लिया गया।
- source_word: τοῦ πτωχοῦ κατακυριεύουσιν
  choice: निर्धन पर अधिकार जमाती हैं
  rationale: κατακυριεύω साधारण शासन से अधिक, किसी पर प्रभुत्व या अधिकार जमाने का प्रबल भाव रखता है।
- source_word: αἴρουσιν
  choice: छीन लेती हैं
  rationale: संदर्भ में αἴρω का अर्थ केवल ‘उठाना’ नहीं, बल्कि किसी की महिमा, शक्ति और सहारा उससे दूर कर देना है।
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: पुरुष से उसकी शक्ति
  rationale: ἀνήρ को ‘पुरुष’ रखा गया है; इसे राजा का विशेषण बनाकर ‘शक्तिशाली पुरुष’ कहना यूनानी वाक्य-विन्यास की तीन समानांतर इकाइयों—राजा, पुरुष, निर्धन—को धुंधला कर सकता है।
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  choice: उसकी गरीबी में बचा-खुचा थोड़ा-सा सहारा
  rationale: दुरूह यूनानी पदबंध में ἐλάχιστον ‘बहुत थोड़ा/न्यूनतम’ और στήριγμα ‘सहारा’ है। हिन्दी रूप उस निर्धन के अल्पतम सहारे के छिन जाने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: स्त्रियों के विषय में कथन का व्यापक स्वर
  choice: मूल के सामान्य बहुवचन ‘स्त्रियाँ’ को यथावत रखा गया
  alternative: इसे ‘कुछ स्त्रियाँ’ या किसी विशेष प्रकार की स्त्रियों तक सीमित करना
  rationale: स्रोत स्वयं कोई सीमा नहीं लगाता। अनावश्यक सामान्यीकरण को नरम करना व्याख्यात्मक जोड़ होता, जबकि कथन की साहित्यिक और नैतिक कठोरता को अनसुलझा रहने देना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘अपने वश में रखना’, ‘अधिकार जमाना’ और ‘छीन लेना’ मूल के बढ़ते हुए नियंत्रण और वंचना के भाव को स्पष्ट करते हैं। अंग्रेज़ी परामर्श-पाठ में आया ‘forever’ यूनानी स्रोत में स्पष्ट रूप से उपस्थित नहीं है, इसलिए उसे शामिल नहीं किया गया।
