  text: Ὁ πορνεύσας¹ γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/001.yaml
  text: The one who commits sexual immorality, while being ruined, does not perceive it; and while being dishonored, he is not ashamed.
translation:
  language: hi
  text: जो यौन अनैतिकता करता है, वह लुटते हुए भी यह नहीं समझता कि वह लुट रहा है; और अपमानित होते हुए भी उसे लज्जा नहीं होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας
  choice: जो व्यभिचार करता है
  rationale: संज्ञात्मक कृदंत उस व्यक्ति को दर्शाता है जो यौन अनैतिकता करता है। प्रसंग के अनुरूप ‘व्यभिचार’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: γυμνούμενος
  choice: अपना सब कुछ लुटते जाने पर
  rationale: शाब्दिक अर्थ ‘नंगा किया जाता हुआ’ है, पर यहाँ आर्थिक या सामाजिक रूप से वंचित और बरबाद किए जाने का भाव है। यह रूप उस प्रक्रिया और उसके विनाशकारी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ αἰσθάνεται
  choice: इसे नहीं समझता
  rationale: αἰσθάνομαι का भाव अनुभव करने, ध्यान देने या पहचानने का है; ‘समझता’ यहाँ अपनी दुर्दशा का बोध न होने को स्पष्ट करता है।
- source_word: ἀδοξῶν
  choice: अपमानित होते हुए
  rationale: यह कृदंत सम्मान या प्रतिष्ठा खोने का भाव रखता है; कर्मवाच्य हिन्दी मूल में निहित दुर्दशा को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: οὐκ αἰσχύνεται
  choice: लज्जित नहीं होता
  rationale: मूल के लज्जा अनुभव न करने के भाव का सीधा और गरिमापूर्ण अनुवाद।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में चेतावनीपूर्ण, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। समानांतर यूनानी कृदंतों को ‘पर भी’ संरचना से जोड़ा गया है, ताकि व्यक्ति की बढ़ती दुर्दशा और उसके बोध तथा लज्जा के अभाव का विरोधाभास स्पष्ट रहे।
