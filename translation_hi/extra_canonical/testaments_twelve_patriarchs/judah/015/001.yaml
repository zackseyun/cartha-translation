revisions:
- from: जो व्यभिचार करता है, वह अपना सब कुछ लुटते जाने पर भी इसे नहीं समझता; और अपमानित होते हुए भी लज्जित नहीं होता।
  to: जो यौन अनैतिकता करता है, वह लुटते हुए भी यह नहीं समझता कि वह लुट रहा है; और अपमानित होते हुए भी उसे लज्जा नहीं होती।
  rationale: The revision retains the source’s two parallel participial circumstances and its moral-warning register. It renders γυμνούμενος with ‘लुटते हुए’ without importing ‘सब कुछ,’ uses a broader Hindi expression for πορνεύσας, and resolves the unclear pronoun by explicitly stating what the person does not perceive.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:22:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft captures the paired irony of the Greek participles: the sexually immoral person fails to perceive his own undoing and feels no shame amid dishonor. However, ‘अपना सब कुछ’ adds a totalizing possession claim not expressed by γυμνούμενος (‘being stripped/despoiled’), and ‘इसे’ has an unclear antecedent.'
  naturalness: The current Hindi is generally fluent and appropriately proverbial in register. Recasting the first clause avoids the added ‘सब कुछ’ and makes the object of perception explicit without losing the compact parallelism.
  terminology: ‘व्यभिचार’ can specifically mean adultery, whereas πορνεύσας is broader sexual immorality. ‘यौन अनैतिकता’ more safely represents the Greek category. ‘लज्जा’ and ‘अपमानित’ are suitable for αἰσχύνεται and ἀδοξῶν.
  issues:
  - severity: medium
    issue: ‘अपना सब कुछ लुटते जाने’ is more specific than γυμνούμενος.
    rationale: The Greek depicts being stripped or despoiled, figuratively ruined; it does not state that the person loses ‘everything’ or explicitly frame this as his own possessions.
  - severity: medium
    issue: ‘व्यभिचार’ narrows πορνεύσας.
    rationale: In modern Hindi, ‘व्यभिचार’ often denotes adultery, while the Greek term denotes sexual immorality more broadly.
  - severity: low
    issue: The pronoun ‘इसे’ is ambiguous.
    rationale: Its referent is inferable but not grammatically explicit; ‘कि वह लुट रहा है’ states the intended lack of perception clearly.
  revised_text: जो यौन अनैतिकता करता है, वह लुटते हुए भी यह नहीं समझता कि वह लुट रहा है; और अपमानित होते हुए भी उसे लज्जा नहीं होती।
  revised_footnotes: []
  revision_rationale: The revision retains the source’s two parallel participial circumstances and its moral-warning register. It renders γυμνούμενος with ‘लुटते हुए’ without importing ‘सब कुछ,’ uses a broader Hindi expression for πορνεύσας, and resolves the unclear pronoun by explicitly stating what the person does not perceive.
