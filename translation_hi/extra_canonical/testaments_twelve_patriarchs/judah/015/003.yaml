id: T12P.JUD.15.3
reference: Testament of Judah 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα⁸ γὰρ τὴν ῥάβδον μου, τουτέστι⁹ τὸ στήριγμα τῆς ἐμῆς φυλῆς¹⁰, καὶ τὴν ζώνην μου, τουτέστιν¹¹ τὴν δύναμιν, καὶ τὸ διάδημα¹², τουτέστιν¹³ τὴν δόξαν τῆς βασιλείας μου¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/003.yaml
  text: I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom.
translation:
  language: hi
  text: क्योंकि मैंने अपनी छड़ी—अर्थात् अपने गोत्र का सहारा—और अपना कमरबंद—अर्थात् अपनी शक्ति—और अपना राजमुकुट—अर्थात् अपने राज्य का गौरव—दे दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: छड़ी
  rationale: यह सामान्य, ठोस अर्थ को बनाए रखता है और आगे दिए गए प्रतीकात्मक स्पष्टीकरण ‘गोत्र का सहारा’ से स्वाभाविक रूप से जुड़ता है।
- source_word: φυλῆς
  choice: गोत्र
  rationale: वंश-आधारित इस्राएली समूह के लिए ‘गोत्र’ सटीक और प्रचलित हिन्दी शब्द है।
- source_word: ζώνην
  choice: कमरबंद
  rationale: प्राचीन परिधान की कमर पर बाँधी जाने वाली वस्तु को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: δύναμιν
  choice: शक्ति
  rationale: मूल के व्यापक अर्थ को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: διάδημα
  choice: राजमुकुट
  rationale: διάδημα राजसत्ता के चिह्न को सूचित करता है; ‘राजमुकुट’ साधारण पाठक के लिए स्पष्ट है और βασιλείας के संदर्भ से मेल खाता है।
- source_word: δόξαν τῆς βασιλείας μου
  choice: मेरे राज्य का गौरव
  rationale: मूल संबंध और राजकीय महिमा के भाव को सीधे बनाए रखता है।
theological_decisions:
- issue: तीनों वस्तुओं की प्रतीकात्मक व्याख्या
  choice: ‘अर्थात्’ के साथ मूल में दिए गए तीनों स्पष्टीकरण स्पष्ट रूप से बनाए रखे गए।
  alternative: वस्तुओं और उनके अर्थों को रूपक मानकर अधिक व्याख्यात्मक भाषा जोड़ना।
  rationale: मूल पाठ स्वयं अर्थ बताता है; अतिरिक्त धर्मवैचारिक निष्कर्ष जोड़ना उचित नहीं है।
- issue: βασιλεία का अर्थ
  choice: राज्य
  alternative: राजसत्ता
  rationale: ‘राज्य का गौरव’ मूल की स्वाभाविक और संभवतः व्यापक अभिव्यक्ति है; ‘राजसत्ता’ अर्थ को केवल शासनाधिकार तक सीमित कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। मूल की तीन समानांतर वस्तुओं और उनके स्पष्टीकरणों को दीर्घ विराम-चिह्नों द्वारा स्पष्ट किया गया है।
