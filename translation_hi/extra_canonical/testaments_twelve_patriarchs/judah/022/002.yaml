source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἐν ἀλλοφύλοις⁵ συντελεσθήσεται ἡ βασιλεία μου⁶, ἕως⁷ τοῦ ἐλθεῖν⁸ τὸ⁹ σωτήριον τοῦ¹⁰ Ἰσραήλ¹⁰,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/002.yaml
  text: And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes,
translation:
  language: hi
  text: और परदेशियों के बीच मेरा राज्य समाप्त कर दिया जाएगा, जब तक इस्राएल का उद्धार न आ जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀλλοφύλοις
  choice: परदेशियों के बीच
  rationale: ἀλλόφυλοι का अर्थ दूसरे कुल या जाति के लोग, अर्थात विदेशी/परदेशी है; ‘के बीच’ यूनानी ἐν की स्थान-संबंधी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συντελεσθήσεται
  choice: समाप्त कर दिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप राज्य के अंत तक पहुँचा दिए जाने को व्यक्त करता है; यह अनिश्चित कर्ता और मूल पाठ की कर्मवाच्यता को बनाए रखता है।
- source_word: ἡ βασιλεία μου
  choice: मेरा राज्य
  rationale: βασιλεία यहाँ यहूदा के राजकीय शासन/राज्य को सूचित करता है; संक्षिप्त और प्रत्यक्ष समतुल्य रखा गया है।
- source_word: ἕως τοῦ ἐλθεῖν
  choice: जब तक … न आ जाए
  rationale: कालगत सीमा बताने वाली यूनानी रचना का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: इस्राएल का उद्धार
  rationale: σωτήριον को अमूर्त ‘उद्धार’ के रूप में रखा गया है और संबंधकारक की वास्तविक अस्पष्टता—इस्राएल के लिए उद्धार या इस्राएल से संबद्ध उद्धार—को नहीं सुलझाया गया।
theological_decisions:
- issue: ‘इस्राएल का उद्धार’ में संबंधकारक की व्याख्या
  choice: अस्पष्ट संबंध को यथावत रखते हुए ‘इस्राएल का उद्धार’
  alternative: इस्राएल के लिए उद्धार / इस्राएल का उद्धारकर्ता
  rationale: मूल τὸ σωτήριον τοῦ Ἰσραήλ किसी व्यक्ति को स्पष्ट रूप से ‘उद्धारकर्ता’ नहीं कहता और संबंधकारक का ठीक अर्थ खुला छोड़ता है; हिन्दी पदबंध वही तनाव बनाए रखता है।
- issue: राज्य के अंत का कर्ता
  choice: कर्मवाच्य ‘समाप्त कर दिया जाएगा’
  alternative: मेरा राज्य समाप्त हो जाएगा
  rationale: यूनानी कर्मवाच्य है और अंत कराने वाले को नामित नहीं करता; अनुवाद भी किसी मानवीय या दैवी कर्ता को जोड़ता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज भाषा। वाक्य-रचना मूल के क्रम और कालगत तनाव को निकटता से सुरक्षित रखती है।
