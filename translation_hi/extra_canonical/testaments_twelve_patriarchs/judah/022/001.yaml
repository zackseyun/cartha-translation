reference: Testament of Judah 22:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐπάξει¹ δὲ αὐτοῖς Κύριος διαιρέσεις *κατ᾽ ἀλλήλων¹³, καὶ ἔσονται *συνεχεῖς ἔσονται³ ἐν Ἰσραήλ⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/001.yaml
  text: The Lord will bring divisions among them against one another, and continual wars will be in Israel.
translation:
  language: hi
  text: प्रभु उनके बीच एक-दूसरे के विरुद्ध फूट डालेगा, और इस्राएल में लगातार युद्ध होते रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπάξει
  choice: डालेगा
  rationale: क्रिया का मूल भाव ‘ले आएगा/उत्पन्न करेगा’ है; ‘फूट डालेगा’ आधुनिक हिन्दी में स्वाभाविक और कारणवाचक अर्थ के अनुरूप है।
- source_word: διαιρέσεις
  choice: फूट
  rationale: यहाँ बहुवचन संज्ञा आपसी विभाजनों या कलह को व्यक्त करती है; हिन्दी में सामूहिक ‘फूट’ अधिक स्वाभाविक है।
- source_word: κατ᾽ ἀλλήλων
  choice: एक-दूसरे के विरुद्ध
  rationale: परस्पर विरोध के अर्थ को सीधे और बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: συνεχεῖς
  choice: लगातार
  rationale: निरंतर या बार-बार जारी रहने की धारणा को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: स्थानवाचक वाक्यांश का सीधा अनुवाद।
theological_decisions:
- issue: फूट लाने में प्रभु की प्रत्यक्ष भूमिका
  choice: प्रभु ... फूट डालेगा
  alternative: उनके बीच फूट पड़ने देगा
  rationale: यूनानी Ἐπάξει प्रभु को कर्ता बनाता है; ‘पड़ने देगा’ कहने से प्रत्यक्ष कारणवाचक तनाव अनावश्यक रूप से नरम पड़ जाता।
- issue: दूसरे खंड में युद्ध का स्पष्ट उल्लेख
  choice: लगातार युद्ध होते रहेंगे
  alternative: वे इस्राएल में लगातार घिरे रहेंगे
  rationale: प्रदत्त यूनानी पाठ में दूसरे खंड की पाठ-स्थिति कुछ असामान्य है, पर परामर्श-पाठ और संपादकीय साक्ष्य ‘लगातार युद्ध’ को ग्रहण करते हैं; हिन्दी में इसी अर्थ को स्वाभाविक रूप से व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘इस्राएल’ बाइबिलीय नाम का प्रचलित हिन्दी रूप है।
