source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἰδὼν⁸ αὐτὴν οἰνοχοοῦσαν⁹ ἠπατήθην, καὶ *†ἔλαβον αὐτὴν μὴ βουλευσαμένου τοῦ πατρός μου¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/002.yaml
  text: And when I saw her pouring wine, I was deceived, and I took her, my father not having taken counsel.
translation:
  language: hi
  text: और जब मैंने उसे दाखमधु उँडेलते देखा, तो मैं धोखा खा गया और मैंने उसे ले लिया, जबकि मेरे पिता ने विचार-विमर्श नहीं किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰνοχοοῦσαν
  choice: दाखमधु परोसते
  rationale: यह वर्तमान कृदन्त किसी को दाखमधु उँडेलकर देने या परोसने की क्रिया बताता है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘परोसते’ चुना गया।
- source_word: ἠπατήθην
  choice: मैं धोखा खा गया
  rationale: यूनानी निष्क्रिय रूप का सीधा अर्थ ‘मैं छला/भ्रमित किया गया’ है; ‘धोखा खा गया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए निष्क्रिय भाव बनाए रखता है।
- source_word: ἔλαβον αὐτήν
  choice: मैंने उसे अपना लिया
  rationale: शाब्दिक अर्थ ‘मैंने उसे लिया’ है, पर स्त्री को वैवाहिक या संगिनी के रूप में लेने के प्रसंग में ‘अपना लिया’ अधिक स्वाभाविक है और संबंध की सटीक प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: मेरे पिता से सलाह लिए बिना
  rationale: यूनानी संबंधवाचक निरपेक्ष रचना का कर्ता व्याकरणतः ‘मेरे पिता’ है—अर्थात पिता ने विचार/परामर्श नहीं किया। हिन्दी में यह रचना स्वाभाविक है, यद्यपि दृष्टिकोण बदलकर पुत्र द्वारा पिता से सलाह न लेने के रूप में व्यक्त होती है।
theological_decisions:
- issue: अंतिम खंड में सलाह लेने वाले का व्याकरणिक कर्ता
  choice: ‘मेरे पिता से सलाह लिए बिना’
  alternative: ‘मेरे पिता ने विचार नहीं किया था’
  rationale: मूल यूनानी में ‘मेरे पिता’ विचार/परामर्श करने वाले कर्ता हैं। फिर भी हिन्दी में अलग से ‘पिता ने विचार नहीं किया’ अस्पष्ट और असहज हो सकता है; चुना हुआ रूप प्रसंगगत आशय को सहज बनाता है, पर व्याकरणिक दृष्टिकोण में हल्का परिवर्तन करता है।
- issue: ἔλαβον αὐτήν में संबंध की प्रकृति
  choice: ‘उसे अपना लिया’
  alternative: ‘उससे विवाह कर लिया’
  rationale: इस पद में विवाह का शब्द स्पष्टतः नहीं है। इसलिए धार्मिक-सामाजिक निष्कर्ष जोड़ने के बजाय मूल की अपेक्षाकृत खुली अभिव्यक्ति सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबलीय साहित्य के अनुकूल है। अंतिम वाक्यांश को लंबे कृदन्तीय ढाँचे के बजाय स्वाभाविक हिन्दी में व्यक्त किया गया है।
