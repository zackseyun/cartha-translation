id: T12P.JUD.11.1
reference: Testament of Judah 11:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἀγὼ ᾔδειν ὅτι πονηρὸν² γένος ἦν³ τῶν Χαναναίων⁴, ἀλλὰ τὸ διαβούλιον⁵ τῆς νεότητος ἐτύφλωσε τὴν διάνοιάν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/001.yaml
  text: And I knew that the race of the Canaanites was evil, but the impulse of youth blinded my understanding.
translation:
  language: hi
  text: और मैं जानता था कि कनानियों का वंश दुष्ट था, फिर भी जवानी के आवेग[a] ने मेरी समझ को अंधा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जवानी की सोच” अथवा “जवानी की मंशा।”
    reason: यूनानी διαβούλιον विचार, योजना, मंशा या प्रेरक झुकाव को व्यक्त कर सकता है; ‘आवेग’ प्रसंगानुकूल है, पर यही एकमात्र संभव अर्थ नहीं।
lexical_decisions:
- source_word: πονηρὸν γένος
  choice: दुष्ट वंश
  rationale: πονηρός यहाँ नैतिक बुराई व्यक्त करता है और γένος किसी जातीय वंश या समुदाय को; ‘दुष्ट वंश’ मूल कथन की कठोरता को बिना घटाए स्वाभाविक हिन्दी देता है।
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: जवानी के आवेग
  rationale: διαβούλιον में विचार, मंशा या प्रेरक झुकाव का भाव हो सकता है। प्रसंग में ‘जवानी के आवेग’ ऐसा स्वाभाविक हिन्दी रूप है जो युवा अवस्था से उपजी विवेकहीन प्रेरणा को व्यक्त करता है।
- source_word: τὴν διάνοιάν μου
  choice: मेरी समझ
  rationale: διάνοια मन, विचार-शक्ति या समझ को सूचित करता है; अंधा किए जाने की उपमा के साथ ‘समझ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फिर भी’ यूनानी ἀλλά के विरोध को स्वाभाविक हिन्दी में उभारता है, जबकि ‘अंधा कर दिया’ मूल रूपक को ज्यों का त्यों बनाए रखता है।
