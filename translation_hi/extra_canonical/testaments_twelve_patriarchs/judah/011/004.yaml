- source_word: Ἐπιγνοὺς
  choice: जब मुझे पता चला
  rationale: यह क्रिया किसी किए गए काम को जान लेने या पहचान लेने को व्यक्त करती है; प्रसंग में सहज आधुनिक हिन्दी के लिए यह रूप चुना गया।
- source_word: κατηρασάμην
  choice: मैंने ... शाप दिया
  rationale: यूनानी क्रिया का सीधा अर्थ शाप देना है; इसकी तीव्रता को बिना नरम किए रखा गया।
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: अपने मन की पीड़ा में
  rationale: ψυχή यहाँ व्यक्ति के आंतरिक भाव-जगत को सूचित करता है; 'मन' आधुनिक हिन्दी में स्वाभाविक है और वाक्यांश की भावनात्मक पीड़ा बनाए रखता है।
