  text: And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.
translation:
  language: hi
  text: और अगले दिन हमें बताया गया कि गास नगर का राजा बहुत से लोगों के साथ हमारी ओर आ रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: अगले दिन
  rationale: संदर्भ में यह स्वाभाविक रूप से अगले दिन का संकेत देता है; हिन्दी में यही स्पष्ट और सहज अभिव्यक्ति है।
- source_word: ἐρρέθη πρὸς ἡμᾶς
  choice: हमें यह समाचार मिला
  rationale: शाब्दिक अर्थ ‘हमसे कहा गया’ है, पर यहाँ सूचना दिए जाने का भाव है; चुनी हुई अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Γαὰς πόλεως βασιλεὺς
  choice: गास नगर का राजा
  rationale: यूनानी संबंध-वाचक रचना को सीधे और स्पष्ट हिन्दी में व्यक्त किया गया है; स्थान-नाम का लिप्यंतरण ‘गास’ रखा गया है।
- source_word: ἐν λαῷ πολλῷ
  choice: एक बड़ी भीड़ के साथ
  rationale: λαός यहाँ राजा के साथ आने वाले बड़ी संख्या के लोगों या सैन्य समूह को दर्शाता है; स्रोत की अस्पष्टता बनाए रखने के लिए ‘सेना’ नहीं जोड़ा गया।
- source_word: ἔρχεται πρὸς ἡμᾶς
  choice: हमारे विरुद्ध आ रहा है
  rationale: πρός का मूल अर्थ ‘हमारी ओर’ हो सकता है, पर युद्ध-संदर्भ में विरोधी उद्देश्य निहित है; ‘हमारे विरुद्ध’ अंग्रेज़ी परामर्श-पाठ और प्रसंग दोनों के अनुरूप है।
