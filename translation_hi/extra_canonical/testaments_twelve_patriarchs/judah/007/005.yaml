translation:
  language: hi
  text: तब उनके द्वारा अपमानित होकर मुझे क्रोध आया, और मैं उन पर धावा बोलते हुए चोटी तक जा पहुँचा। वे मुझ पर पत्थर फेंकते और तीर चलाते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβριζόμενος
  choice: उनके अपमान करने पर
  rationale: यह पद उनके द्वारा किए गए अपमान या उद्दंड दुर्व्यवहार को व्यक्त करता है; प्रसंग में स्वाभाविक और स्पष्ट हिन्दी के लिए यह चयन किया गया।
- source_word: ὠργίσθην
  choice: मुझे क्रोध आया
  rationale: यूनानी अओरिस्ट निष्क्रिय रूप यहाँ अवस्था में प्रवेश, अर्थात क्रोधित हो जाने, को व्यक्त करता है।
- source_word: ὥρμησα ἐπ᾽ αὐτούς
  choice: मैं उन पर झपटा
  rationale: ὁρμάω का अर्थ आवेग और तीव्रता से किसी पर धावा बोलना है; ‘झपटा’ इसे संक्षिप्त, सजीव हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὴν κορυφήν
  choice: चोटी तक जा पहुँचा
  rationale: κορυφή यहाँ किसी ऊँचे स्थान की चोटी या शिखर है; ‘तक’ लक्ष्य/सीमा का भाव बनाए रखता है।
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: वे मुझ पर पत्थर बरसाते ... रहे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती क्रिया दिखाता है। क्रिया मूलतः गोफन से मारने का संकेत दे सकती है, पर वाक्य में साधन के रूप में पत्थरों पर जोर है; ‘पत्थर बरसाते’ स्वाभाविक हिन्दी में निरंतर प्रहार व्यक्त करता है।
- source_word: τοξεύοντες
  choice: तीर चलाते
  rationale: धनुष से तीर मारने की क्रिया को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है; मुख्य अपूर्ण क्रिया के साथ जारी कार्रवाई का भाव रखा गया है।
