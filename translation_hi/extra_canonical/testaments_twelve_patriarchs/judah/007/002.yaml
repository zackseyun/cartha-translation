  text: So Dan and I, pretending to be allies to the Amorites, entered their city.
translation:
  language: hi
  text: तब मैं और दान अमोरियों के पास गए और उनके सहयोगी होने का दिखावा करके उनके नगर में प्रवेश कर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθέντες πρὸς Ἀμορραίους
  choice: अमोरियों के पास गए
  rationale: यह यूनानी गति और लक्ष्य—अमोरियों की ओर/उनके पास जाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: उनके सहयोगी होने का दिखावा करके
  rationale: वाक्यांश का अर्थ अमोरी होने का स्वाँग भरना नहीं, बल्कि उनके सहयोगी होने का ढोंग करना है। ‘सहयोगी’ सामान्य पाठक के लिए सहज है और σύμμαχος के सैन्य-सहयोगी अर्थ को पर्याप्त रूप से रखता है।
- source_word: εἰσήλθομεν εἰς τὴν πόλιν αὐτῶν
  choice: उनके नगर में प्रवेश कर गए
  rationale: मूल के प्रथम पुरुष बहुवचन और नगर के अमोरियों से संबंध को स्पष्ट तथा स्वाभाविक रूप में सुरक्षित रखता है।
