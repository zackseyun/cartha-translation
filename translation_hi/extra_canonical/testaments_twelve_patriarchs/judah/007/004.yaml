lexical_decisions:
- source_word: ἐπροσεγγίσαμεν
  choice: हम ... के पास पहुँचे
  rationale: क्रिया का अर्थ निकट आना या पास पहुँचना है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: Θάμνῃ
  choice: तिम्ना
  rationale: स्थान-नाम का प्रचलित बाइबलीय हिन्दी लिप्यंतरण चुना गया है।
- source_word: ἀποσκευὴ
  choice: सामान
  rationale: यह यात्रा या सैन्य दल के साथ रखे सामान और रसद-सामग्री को सूचित कर सकता है; संदर्भ में व्यापक और सहज हिन्दी शब्द रखा गया है।
- source_word: τῶν πολεμίων βασιλέων
  choice: शत्रु राजाओं का
  rationale: मूल यूनानी में स्वामित्व स्पष्ट रूप से ‘शत्रु राजाओं’ से जुड़ा है; इसे अंग्रेज़ी परामर्श-पाठ के सर्वनाम ‘their’ की अपेक्षा प्रत्यक्ष रूप में सुरक्षित रखा गया है।
