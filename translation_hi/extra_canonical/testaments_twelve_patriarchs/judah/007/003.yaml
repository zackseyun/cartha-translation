source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Νυκτὸς δὲ βαθείας⁷ ἤλθον⁸ πρὸς ἡμᾶς οἱ ἀδελφοί μου, καὶ ἀνοίξαντες τὰς πύλας αὐτοῖς, πάντας αὐτοὺς ἐξωλοθρεύσαμεν⁹ καὶ ἐπρονομεύσαμεν¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/003.yaml
  text: And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering all that was theirs, we tore down their three walls.
translation:
  language: hi
  text: और गहरी रात में मेरे भाई हमारे पास आए। हमने उनके लिए फाटक खोल दिए, फिर उन सबका सर्वनाश कर दिया और लूटपाट की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νυκτὸς δὲ βαθείας
  choice: और गहरी रात में
  rationale: यूनानी पदबंध रात के बहुत बीत जाने अथवा उसके गहरे समय को व्यक्त करता है; यह अनुवाद उसके चित्रात्मक भाव को बनाए रखता है।
- source_word: οἱ ἀδελφοί μου
  choice: मेरे भाई
  rationale: बहुवचन और प्रथम पुरुष संबंधसूचक सर्वनाम का सीधा, स्वाभाविक अनुवाद।
- source_word: ἀνοίξαντες τὰς πύλας αὐτοῖς
  choice: हमने उनके लिए फाटक खोल दिए
  rationale: कर्तृवाचक कृदंत का कर्ता मुख्य क्रिया का ‘हम’ है, और αὐτοῖς लाभार्थक अर्थ में ‘उनके लिए’ है।
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: उन सबका पूरी तरह विनाश कर दिया
  rationale: ἐξολοθρεύω के प्रबल, संपूर्ण विनाश के भाव और πάντας की समग्रता—दोनों को व्यक्त करता है।
- source_word: ἐπρονομεύσαμεν
  choice: लूटपाट की
  rationale: क्रिया का अर्थ लूटना अथवा लूटमार करना है; उपलब्ध यूनानी पाठ में इसका कोई व्यक्त कर्म नहीं दिया गया है, इसलिए अनिर्दिष्ट रूप रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। उपलब्ध यूनानी पाठ ἐπρονομεύσαμεν पर समाप्त होता है; इसलिए अंग्रेज़ी परामर्श-पाठ में आए ‘उनका सब कुछ’ और ‘उनकी तीन दीवारें ढा दीं’ जैसे विवरण मूल-स्रोत प्रमाण के अभाव में शामिल नहीं किए गए।
