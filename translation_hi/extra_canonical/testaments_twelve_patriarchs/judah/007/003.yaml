    issue: The phrase “उन सबका पूरी तरह विनाश कर दिया” is somewhat heavy and less idiomatic in modern Hindi.
    rationale: The Greek verb ἐξωλοθρεύσαμεν is emphatic, comprehensive destruction. “उन सबका सर्वनाश कर दिया” states this naturally and clearly in Hindi.
