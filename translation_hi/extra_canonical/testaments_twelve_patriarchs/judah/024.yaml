  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय धार्मिक गद्य अपनाया गया है। रूपक—तारा, सूर्य, कोंपल, सोता, जड़, तना और छड़ी—को व्याख्यात्मक रूप से समतल नहीं किया गया। ‘प्रभु’, ‘अनुग्रह’, ‘धार्मिकता’ और ‘राजदण्ड’ जैसे व्यापक रूप से समझे जाने वाले धार्मिक शब्द बनाए रखे गए हैं।
