  text: '1. He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.

    2. And you will be for him sons in truth, and you will walk in his commands, first and last.

    3. [This is the shoot of the Most High God, a spring for the life of all flesh.]

    4. Then the scepter of my kingdom will shine forth, and from your root a stem will arise.

    5. And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 24**


    1. इसके बाद याकूब में से तुम्हारे लिए शान्ति में एक तारा उदित होगा, और मेरे वंश से एक मनुष्य धार्मिकता के सूर्य के समान उठ खड़ा होगा। वह नम्रता और धार्मिकता से मनुष्यों के साथ चलेगा, और उसमें कोई पाप नहीं पाया जाएगा।


    2. उसके ऊपर स्वर्ग खुल जाएंगे, ताकि पवित्र पिता की आशीष का आत्मा उस पर उँडेलें; और वह स्वयं तुम पर अनुग्रह का आत्मा उँडेलेगा।


    3. तुम उसके लिए सत्य में पुत्र होगे, और उसकी पहली और आखिरी आज्ञाओं में चलोगे।


    4. [यही परमप्रधान परमेश्वर की कोंपल और सबको जीवन देनेवाला सोता है।][a]


    5. तब मेरे राज्य का राजदण्ड चमक उठेगा, और तुम्हारी जड़ से एक तना निकलेगा।


    6. उसी से राष्ट्रों के लिए धार्मिकता की एक छड़ी फूट निकलेगी, ताकि वह उन सबका न्याय करे और उन्हें बचाए जो प्रभु को पुकारते हैं।


    [a] यह वाक्य यूनानी पाठ में वर्ग कोष्ठकों में दिया गया है; इसकी पाठ-परम्परा अनिश्चित मानी गई है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य यूनानी पाठ में वर्ग कोष्ठकों में दिया गया है; इसकी पाठ-परम्परा अनिश्चित मानी गई है।
    reason: स्रोत संस्करण में पूरा वाक्य वर्ग कोष्ठकों में है; अनुवाद में यह पाठगत संकेत बनाए रखना आवश्यक है।
lexical_decisions:
- source_word: ἄστρον
  choice: तारा
  rationale: मूल रूपक को सीधे बनाए रखता है और याकूब से उदित होने की मसीही/राजकीय प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἥλιος δικαιοσύνης
  choice: धार्मिकता का सूर्य
  rationale: यूनानी संबंधवाचक पदबंध का औपचारिक और परिचित रूप; इसे केवल ‘धर्मी सूर्य’ कहने से निहित गुणात्मक तनाव घट सकता था।
- source_word: πραΰτης
  choice: नम्रता
  rationale: व्यवहारगत कोमलता और दीनता दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πνεῦμα χάριτος
  choice: अनुग्रह का आत्मा
  rationale: πνεῦμα को ‘आत्मा’ और χάρις को ‘अनुग्रह’ देकर धार्मिक पदबंध की खुली अर्थ-सीमा बनाए रखी गई है।
- source_word: προστάγματα
  choice: आदेश
  rationale: ‘आज्ञाएँ’ भी सम्भव है, पर ‘आदेश’ मूल के निर्देशात्मक अर्थ को स्वाभाविक हिन्दी में रखता है और किसी विशिष्ट विधि-संहिता का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: βλαστός
  choice: कोंपल
  rationale: उगते हुए नए अंकुर की वनस्पतिक छवि को स्पष्ट और प्राकृतिक हिन्दी में सुरक्षित रखता है।
- source_word: πηγή
  choice: सोता
  rationale: जीवन देनेवाले जल-स्रोत की छवि के लिए ‘सोता’ सहज और संक्षिप्त है।
- source_word: σκῆπτρον
  choice: राजदण्ड
  rationale: राजकीय अधिकार के प्रतीक को ठीक रूप में व्यक्त करता है।
- source_word: πυθμήν
  choice: तना
  rationale: जड़ से निकलने वाले मूल तने की वनस्पतिक छवि को बनाए रखता है; ‘ठूँठ’ यहाँ अनावश्यक रूप से मृत या कटे वृक्ष का संकेत देता।
- source_word: ῥάβδος δικαιοσύνης
  choice: धार्मिकता की एक छड़ी
  rationale: ῥάβδος की दण्ड/छड़ी वाली छवि को सुरक्षित रखा गया है और इसे σκῆπτρον के समान ‘राजदण्ड’ बनाकर दोनों शब्दों का भेद नहीं मिटाया गया।
- source_word: ἔθνη
  choice: जाति-जाति के लोग
  rationale: आधुनिक हिन्दी पाठक के लिए ‘जातियों’ की अपेक्षा स्पष्ट है और गैर-इस्राएली राष्ट्रों/लोगों की सामूहिक व्यापकता बनाए रखता है।
theological_decisions:
- issue: ‘याकूब में से’ और ‘मेरे वंश से’ आनेवाली आकृति की पहचान
  choice: पाठ की उपाधियों और मानवीय भाषा को ज्यों का त्यों रखा गया, किसी नाम से पहचान नहीं की गई।
  alternative: इसे स्पष्ट रूप से मसीह या किसी अन्य विशिष्ट व्यक्ति के रूप में नामित करना।
  rationale: यूनानी पाठ एक मनुष्य, तारे, सूर्य, कोंपल, तने और छड़ी की परस्पर जुड़ी छवियाँ देता है, पर इस अंश में उसका नाम नहीं बताता।
- issue: पवित्र पिता की आशीष, आत्मा और उस पर उँडेले जाने का वाक्य-संबंध
  choice: ‘पवित्र पिता की आशीष का आत्मा’ और प्रयोजनसूचक ‘ताकि ... उँडेला जाए’ रखा गया।
  alternative: ‘पवित्र पिता आशीष का आत्मा उस पर उँडेलेगा’ या ‘आत्मा अर्थात् पवित्र पिता की आशीष’ कहना।
  rationale: यूनानी वाक्य रचना संक्षिप्त और कुछ असमतल है; चुना गया रूप उसके संबंधों को यथासम्भव सुरक्षित रखता है, बिना पिता और आत्मा के संबंध पर अतिरिक्त सिद्धान्त थोपे।
- issue: ‘पुत्र’ का संबंध
  choice: ‘उसके पुत्र’
  alternative: ‘परमेश्वर के पुत्र’ या ‘पिता के पुत्र’।
  rationale: αὐτῷ का निकटतम पाठगत संदर्भ उसी आनेवाले व्यक्ति की ओर है; स्पष्ट संज्ञा जोड़ना मूल की सर्वनामगत अस्पष्टता को मिटा देता।
- issue: न्याय और उद्धार का कर्ता
  choice: एकवचन ‘वह’ द्वारा दोनों क्रियाएँ उसी उगनेवाली छड़ी/व्यक्ति से जोड़ी गईं।
  alternative: प्रभु को न्याय और उद्धार का प्रत्यक्ष कर्ता बनाना।
  rationale: यूनानी infinitives κρῖναι καὶ σῶσαι का व्याकरणिक संबंध उगनेवाली ῥάβδος से है, जबकि ‘प्रभु’ वह है जिसे लोग पुकारते हैं; दोनों की पहचान को अनकहा ही रखा गया।
- issue: कोष्ठकबद्ध पद 4 की स्थिति
  choice: मुख्य पाठ में वर्ग कोष्ठक और फुटनोट सहित रखा गया।
  alternative: इसे बिना संकेत के मुख्य पाठ में मिला देना या पूरी तरह हटा देना।
  rationale: प्रदत्त यूनानी स्रोत स्वयं इस वाक्य को वर्ग कोष्ठकों में रखता है; पाठक को इसकी पाठगत स्थिति दिखाना आवश्यक है।
