  text: 'The Testament of Judah[a], the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.


    2 So they gathered and came to him, and he said to them:


    3 “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’ 4 I was keen in my youth, and I obeyed my father in every matter. 5 And I honored my mother and my mother''s sister. 6 And when I had grown up, my father blessed me, saying, ‘You shall be a king[b], prospering in all things.’”'
translation:
  language: hi
  text: 'याकूब और लेआ के चौथे पुत्र यहूदा की वसीयत


    1 यहूदा के उन वचनों की प्रतिलिपि, जो उसने मरने से पहले अपने पुत्रों से कहे।


    2 तब वे इकट्ठे होकर उसके पास आए, और उसने उनसे कहा:


    3 “मेरे बच्चों, अपने पिता यहूदा की सुनो। मैं अपने पिता याकूब के चौथे पुत्र के रूप में जन्मा। मेरी माता लेआ ने मेरा नाम यहूदा रखा और कहा, ‘मैं प्रभु की स्तुति करती हूँ, क्योंकि उसने मुझे चौथा पुत्र भी दिया है।’ 4 मैं अपनी युवावस्था में तेज[a] था और अपने पिता की हर बात मानता था। 5 मैं अपनी माता और अपनी माता की बहन[b] का आदर करता था। 6 जब मैं बड़ा हुआ, तो मेरे पिता ने मेरे लिए प्रार्थना की और कहा, ‘तू राजा होगा और हर बात में सफलता पाएगा।’[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेज’ के लिए प्रयुक्त यूनानी शब्द फुर्तीला, प्रखर या उत्साही होने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ स्पष्ट रूप से ‘मेरी माता की बहन’ कहता है; अर्थात उसकी मौसी।
    reason: kinship_clarity
  - marker: c
    text: ‘सफलता पाएगा’ का अनुवाद ‘समृद्ध होगा’ या ‘जिसका मार्ग सफल किया जाएगा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयत
  rationale: इस साहित्यिक शीर्षक में यह शब्द कुलपिता के अंतिम उपदेश और विरासतस्वरूप कथन को सूचित करता है; ‘वाचा’ यहाँ अनावश्यक रूप से अलग धर्मवैज्ञानिक अर्थ ला सकती है।
- source_word: Ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह यहूदा के बोले हुए वचनों के लिखित रूप की दस्तावेज़ी भूमिका को सीधे व्यक्त करता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: संदर्भ में श्रोता पुत्र हैं, पर τέκνα का सामान्य अर्थ ‘बच्चे’ है; संबोधन को उसी व्यापक रूप में रखा गया है।
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: मैं ... चौथे पुत्र के रूप में जन्मा
  rationale: हिन्दी में जन्म-क्रम व्यक्त करने का स्वाभाविक ढंग है और यूनानी में ‘होने’ की घटना का आशय स्पष्ट करता है।
- source_word: Ἀνθομολογοῦμαι
  choice: मैं ... स्तुति करती हूँ
  rationale: लिआ के नामकरण-वचन में क्रिया कृतज्ञतापूर्ण प्रशंसा व्यक्त करती है।
- source_word: ὀξὺς
  choice: तेज
  rationale: मूल विशेषण में फुर्ती, प्रखरता या उत्साह की गुंजाइश है; ‘तेज’ उसकी व्यापकता को यथासंभव बनाए रखता है।
- source_word: κατὰ πάντα λόγον
  choice: हर बात
  rationale: शाब्दिक ‘हर वचन’ की अपेक्षा यह हिन्दी में पिता के प्रत्येक निर्देश या कही हुई बात को मानने का स्वाभाविक भाव देता है।
- source_word: ηὔξατό μοι
  choice: मेरे लिए प्रार्थना की
  rationale: उपलब्ध यूनानी पाठ में क्रिया εὔχομαι से है, जिसका सीधा अर्थ प्रार्थना करना है; इसलिए परामर्श-पाठ के कार्यात्मक ‘आशीर्वाद दिया’ के स्थान पर स्रोत-पाठ का रूप रखा गया है।
- source_word: κατευοδούμενος
  choice: सफलता पाएगा
  rationale: यह सफल होने, मार्ग सुगम किए जाने अथवा समृद्ध होने का भाव दे सकता है; मुख्य पाठ में सरल और स्वाभाविक हिन्दी चुनी गई है।
theological_decisions:
- issue: लिआ के कथन में Κυρίῳ का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ शब्द इस्राएल के परमेश्वर के लिए ईश्वरीय उपाधि के रूप में प्रयुक्त है; ‘प्रभु’ आधुनिक हिन्दी में उपयुक्त और परंपरागत रूप है।
- issue: यहूदा के पिता की क्रिया ηὔξατό μοι
  choice: मेरे लिए प्रार्थना की
  alternative: मुझे आशीर्वाद दिया
  rationale: कथन का प्रसंग पितृसत्तात्मक आशीर्वचन जैसा है, किंतु प्रस्तुत यूनानी क्रिया सीधे प्रार्थना करने को व्यक्त करती है। स्रोत-साक्ष्य को प्राथमिकता देते हुए कार्यात्मक व्याख्या से तनाव को मिटाया नहीं गया।
- issue: राजत्व के साथ κατευοδούμενος का भाव
  choice: हर बात में सफलता पाएगा
  alternative: हर बात में समृद्ध होगा / जिसका मार्ग सफल किया जाएगा
  rationale: मूल कृदंत सफलता और सफलतापूर्वक मार्गदर्शन दोनों का संकेत दे सकता है; मुख्य पाठ स्पष्ट रखा गया है और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। पद-संख्या संरक्षित है। प्रत्यक्ष कथन में पारिवारिक संबोधन स्वाभाविक रखा गया है, जबकि अस्पष्ट यूनानी पदों को पाद-टिप्पणियों में खोला गया है।
