  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पारिवारिक उपदेश का स्वर रखा गया है। ‘हे मेरे बच्चो’ संबोधन में आत्मीयता और वसीयतनामे की गंभीरता दोनों हैं। अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘आज्ञा’, ‘व्यभिचार’, ‘वंश’ और ‘राज्य’ जैसे स्थापित धार्मिक-साहित्यिक शब्द बनाए गए हैं।
