  text: 'And now I command you, my children: do not love silver, and do not set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.


    And I know that because of these two things my seed will come to the ruin of sexual immorality. For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which the Lord gave me because of my obedience to my father Jacob.'
translation:
  language: hi
  text: '**यहूदा का वसीयतनामा 17**


    **1** अब, हे मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ: चाँदी से प्रेम न करना और स्त्रियों की सुंदरता पर निगाह न टिकाना; क्योंकि मैं भी सोने और सुंदरता के कारण कनानी स्त्री बेसुए[a] की ओर भटक गया था।


    **2** मैं जानता हूँ कि इन दोनों बातों के कारण मेरा वंश व्यभिचार के विनाश की ओर जाएगा[b]। ये मेरे पुत्रों में से बुद्धिमान पुरुषों को भी भ्रष्ट कर देंगी और यहूदा के राज्य को क्षीण कर देंगी, जिसे प्रभु ने मेरे पिता की आज्ञा मानने के कारण मुझे दिया था।


    **3** मैंने अपने पिता याकूब की कभी अवज्ञा नहीं की, क्योंकि जो कुछ वह मुझसे कहते थे, वह सब मैं करता था।


    **4** मेरे पूर्वज अब्राहम ने मुझे इस्राएल में राज्य करने का आशीर्वाद दिया, और याकूब ने भी मुझे इसी प्रकार आशीर्वाद दिया।


    **5** और मैं जानता हूँ कि मेरे वंश से राज्य स्थापित होगा[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम ‘बेसुए’ है; इसे किसी दूसरे परिचित नाम के अनुसार नहीं बदला गया है।
    reason: अपरिचित व्यक्तिनाम और संभावित पाठ-परंपरागत पहचान के बारे में पाठक को सचेत करना।
  - marker: b
    text: यूनानी में शाब्दिक पदबंध ‘व्यभिचार के विनाश की ओर’ है। इसका आशय व्यभिचार से उपजनेवाला विनाश अथवा व्यभिचार में पड़कर होनेवाला विनाश हो सकता है।
    reason: मूल षष्ठी-रचना की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: शाब्दिक रूप से, ‘मुझसे राज्य खड़ा होगा।’
    reason: ἐξ ἐμοῦ और στήσεται की अधिक प्रत्यक्ष अभिव्यक्ति दर्ज करना।
lexical_decisions:
- source_word: ἀργύριον
  choice: चाँदी
  rationale: मूल शब्द का सीधा अर्थ ‘चाँदी’ है; प्रसंग में धन का भाव भी है, पर समानांतर ‘सोना’ के कारण धातु का नाम बनाए रखना उचित है।
- source_word: ἐπιβλέπει εἰς κάλλος
  choice: सुंदरता पर दृष्टि लगाना
  rationale: यह केवल देखने के बजाय आकृष्ट होकर निगाह टिकाने की चेतावनी व्यक्त करता है।
- source_word: Βησουὲ
  choice: बेसुए
  rationale: यूनानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण; पहचान को किसी अधिक परिचित बाइबलीय नाम से नहीं बदला गया।
- source_word: ἀλλοιώσουσι
  choice: भ्रष्ट कर देंगी
  rationale: शाब्दिक अर्थ ‘बदल देंगी’ है, पर यहाँ नैतिक रूप से बिगाड़ने का नकारात्मक आशय स्पष्ट है।
- source_word: παρελάλησα
  choice: बात कभी नहीं काटी
  rationale: शब्द में विरोध में बोलने अथवा कही हुई बात के विरुद्ध जाने का भाव है; वर्तमान हिन्दी में यह आज्ञाकारिता के प्रसंग को सहज रूप से व्यक्त करता है।
- source_word: στήσεται τὸ βασίλειον
  choice: राज्य स्थापित होगा
  rationale: στήσεται में खड़े होने, टिकने या स्थापित होने का भाव हो सकता है; राज्य के संदर्भ में ‘स्थापित होगा’ स्वाभाविक है।
theological_decisions:
- issue: ἀπώλειαν πορνείας में संबंधवाचक षष्ठी का अर्थ
  choice: व्यभिचार से होनेवाले विनाश की ओर जाएगा
  alternative: व्यभिचार के विनाश में पड़ेगा / व्यभिचार के कारण नाश होगा
  rationale: यूनानी पदबंध संक्षिप्त और कुछ अस्पष्ट है। मुख्य पाठ में स्वाभाविक हिन्दी देते हुए व्यभिचार और विनाश का निकट संबंध रखा गया है; पादटिप्पणी में अधिक शाब्दिक रूप बताया गया है।
- issue: ἐξ ἐμοῦ में वंशगत अर्थ
  choice: मेरे वंश से
  alternative: मुझसे
  rationale: ‘मुझसे’ मूल के अधिक निकट है, किंतु भाव यह है कि यहूदा से निकलने वाली वंश-रेखा से राज्य स्थापित होगा। इसे किसी विशिष्ट बाद के शासक या मसीही व्याख्या से नहीं जोड़ा गया।
- issue: प्रभु द्वारा राज्य दिए जाने का कारण
  choice: मेरे पिता की आज्ञा मानने के कारण
  alternative: मेरे पिता के प्रति मेरी आज्ञाकारिता में
  rationale: ἐν ὑπακοῇ πατρός μου कारण या परिस्थिति दोनों का संकेत दे सकता है। प्रसंग में यहूदा अपनी आज्ञाकारिता को राज्य मिलने से जोड़ता है; पाठ के इस दावे को बिना धर्मसैद्धांतिक विस्तार के रखा गया है।
