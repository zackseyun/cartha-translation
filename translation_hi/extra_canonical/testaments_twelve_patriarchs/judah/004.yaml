  alternative: दोनों स्थानों पर ‘सारी बंदी-संपत्ति’ या ‘सारी लूट’
  rationale: यूनानी संज्ञा सामूहिक रूप से बंदियों अथवा बंदी बनाए जाने की स्थिति को सूचित कर सकती है। निकटवर्ती क्रियाओं के अनुसार हिन्दी रूप बदला गया है, बिना यह मानने के कि दोनों स्थानों पर अनिवार्यतः वही व्यक्ति अभिप्रेत हैं।
