  text: '**यहूदा का वसीयतनामा 4**


    **1** इसके बाद हमारे विरुद्ध दक्षिण में शकेम-वाला युद्ध हुआ।[a] अपने भाइयों के साथ मोर्चा बाँधकर हमने एक हज़ार पुरुषों का पीछा किया और उनमें से दो सौ को, और चार राजाओं को, मार डाला।


    **2** मैं नगर की दीवार पर चढ़ गया और उनके राजा को मार डाला; और हमने सारे बंदियों को ले लिया।


    **3** अगले दिन हम अरेता गए, जो एक शक्तिशाली नगर था और हमें मृत्यु की धमकी दे रहा था। मैं और गाद ने नगर पर पूर्व की ओर से आक्रमण किया, और रूबेन और लेवी ने पश्चिम की ओर से; इस प्रकार हमने बंदियों को छुड़ा लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘दक्षिण में ... शकेम का/शकेम-वाला युद्ध’ की रचना संक्षिप्त और कुछ असामान्य है। यहाँ ‘शकेम-वाला युद्ध’ उसी संबंध को अनिर्णीत रखते हुए अनूदित करता है। अंग्रेज़ी audit trail में ‘शकेम के युद्ध से भी बड़ा’ है, पर दिए गए यूनानी α-पाठ में ‘बड़ा’ शब्द नहीं है।
