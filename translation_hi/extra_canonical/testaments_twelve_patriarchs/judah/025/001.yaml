id: T12P.JUD.25.1
reference: Testament of Judah 25:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXV. Καὶ¹ μετὰ ταῦτα *ἀναστήσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ εἰς ζωήν², *καὶ ἐγὼ καὶ οἱ ἀδελφοί μου ἔξαρχοι³ *ἐν Ἰσραὴλ ἐσόμεθα⁵, πρῶτος Λευί⁶, δεύτερος ἐγώ⁷, τρίτος Ἰωσήφ⁸, τέταρτος Βενιαμίν⁹, *πέμπτος Συμεών, ἕκτος Ἰσαχάρ¹⁰, καὶ¹² *πάντες καθεξῆς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/001.yaml
  text: 'And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be rulers of scepters in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and thus all the rest in order.'
translation:
  language: hi
  text: और इन बातों के बाद अब्राहम, इसहाक और याकूब जीवन के लिए जी उठेंगे। मैं और मेरे भाई इस्राएल में अगुए होंगे—पहला लेवी, दूसरा मैं, तीसरा यूसुफ, चौथा बिन्यामीन, पाँचवाँ शिमोन, छठा इस्साकार, और इसी तरह शेष सभी अपने-अपने क्रम में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεται ... εἰς ζωήν
  choice: जीवन के लिए जी उठेंगे
  rationale: ἀνίστημι के पुनरुत्थान-संबंधी अर्थ और εἰς ζωήν की दिशा/परिणति दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है। यूनानी क्रिया एकवचन है, किंतु संयुक्त कर्ताओं के कारण हिन्दी में व्याकरणानुसार बहुवचन आवश्यक है।
- source_word: ἔξαρχοι
  choice: अगुए
  rationale: इसका अर्थ प्रधान, नेता या अगुआ है। उपलब्ध यूनानी पाठ में σκήπτρων (‘राजदंडों के’) अथवा φυλῶν (‘गोत्रों के’) नहीं है, इसलिए ‘राजदंडों के शासक’ या ‘गोत्रों के प्रधान’ जोड़ना स्रोत से आगे जाता।
- source_word: καθεξῆς
  choice: अपने-अपने क्रम में
  rationale: क्रमशः या निर्धारित अनुक्रम में होने का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: πάντες
  choice: शेष सभी
  rationale: पहले गिनाए गए छह भाइयों के बाद बाकी सभी भाइयों को समाविष्ट करने वाला सन्दर्भगत अर्थ है।
theological_decisions:
- issue: पितृपुरुषों का जीवन के लिए उठना
  choice: जीवन के लिए जी उठेंगे
  alternative: फिर जीवित हो उठेंगे
  rationale: εἰς ζωήν को केवल पुनर्जीवित होने में विलीन न करके जीवन की ओर/जीवन के लिए उठने की मूल अभिव्यक्ति बनाए रखी गई है; उसके स्वरूप के बारे में अतिरिक्त धर्मवैज्ञानिक विवरण नहीं जोड़ा गया।
- issue: यहूदा और उसके भाइयों की भावी भूमिका
  choice: इस्राएल में अगुए होंगे
  alternative: इस्राएल के गोत्रों के प्रधान होंगे / राजदंडों के शासक होंगे
  rationale: मौजूदा मूल-पाठ केवल ἔξαρχοι ἐν Ἰσραήλ पढ़ता है। इसलिए ‘गोत्र’ या ‘राजदंड’ को पाठ में आयात किए बिना नेतृत्व का सामान्य अर्थ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। सूची की औपचारिक लय बनाए रखने के लिए दीर्घ विराम का उपयोग किया गया है।
