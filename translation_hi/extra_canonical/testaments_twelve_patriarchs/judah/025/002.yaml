base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/002.yaml
  text: And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.
translation:
  language: hi
  text: और प्रभु ने लेवी को आशीष दी; उपस्थिति के दूत ने मुझे; महिमा की शक्तियों ने शिमोन को; आकाश ने रूबेन को; पृथ्वी ने इस्साकार को; समुद्र ने जबूलून को; पहाड़ों ने यूसुफ को; तंबू ने बिन्यामीन को[a]; ज्योतियों ने दान को; आनंद ने नप्ताली को; सूर्य ने गाद को; और चंद्रमा ने आशेर को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्राप्त यूनानी α-पाठ यहाँ अपूर्ण है: उसमें ‘पृथ्वी’ के बाद अपेक्षित कर्म नहीं है और फिर ‘समुद्र’ तथा ‘यूसुफ’ दोनों कर्मकारक रूप में साथ आते हैं। इसलिए ‘इस्साकार… जबूलून… पहाड़ों… तंबू… बिन्यामीन’ वाला क्रम समानांतर बारह-पुत्र सूची के आधार पर पुनर्रचित है।'
    reason: मध्यांश की वास्तविक पाठगत क्षति और अनुवाद में अपनाई गई पुनर्रचना को पारदर्शी बनाना।
lexical_decisions:
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: उपस्थिति का दूत
  rationale: शाब्दिक रूप से ‘मुख/सम्मुखता का दूत’; यहाँ πρόσωπον परमेश्वर की निकट उपस्थिति का संकेत देता है। ‘उपस्थिति’ आधुनिक हिन्दी में अर्थ को स्वाभाविक और धर्मशास्त्रीय रूप से खुला रखता है।
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: महिमा की शक्तियाँ
  rationale: δυνάμεις के बहुवचन और उसकी संभावित स्वर्गीय-सत्ता संबंधी ध्वनि को बिना किसी विशिष्ट व्याख्या में सीमित किए सुरक्षित रखा गया है।
- source_word: αἱ φωστῆρες
  choice: ज्योतियाँ
  rationale: यह बहुवचन आकाशीय प्रकाश-पिंडों अथवा प्रकाश देने वाली सत्ताओं, दोनों की गुंजाइश रखता है।
- source_word: ἡ τρυφή
  choice: आनंद
  rationale: τρυφή सुख, विलास या आनंद का बोध करा सकता है; इस आशीष-सूची में ‘आनंद’ सहज है और अनावश्यक नकारात्मक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ἐμέ की पहचान
  choice: मुझे
  alternative: यहूदा को
  rationale: ग्रीक प्रथम पुरुष ‘मुझे’ कहता है; वक्ता की पहचान यहूदा है, फिर भी अनुवाद में मूल की प्रत्यक्ष वाणी बनाए रखी गई है।
- issue: हर खंड में ‘आशीष दी’ की पुनरावृत्ति
  choice: पहले खंड के बाद क्रिया को अध्याहृत रखा
  alternative: हर नाम के साथ ‘आशीष दी’ दोहराना
  rationale: ग्रीक में केवल आरंभ में εὐλόγησε व्यक्त है और आगे समानांतर खंडों में क्रिया लुप्त है; हिन्दी में अर्धविरामों द्वारा यही काव्यात्मक संरचना स्पष्ट रहती है।
- issue: मध्य सूची के पाठगत अंतराल का प्रस्तुतीकरण
  choice: समानांतर बारह-पुत्र सूची के स्पष्ट ढाँचे के अनुसार इस्साकार, जबूलून, पहाड़ और बिन्यामीन वाले खंड पाठ में दिए, पर पादटिप्पणी में उनकी पुनर्रचित स्थिति स्पष्ट की
  alternative: प्राप्त α-पाठ की टूटी हुई रचना ‘पृथ्वी; समुद्र को यूसुफ को’ जैसी असंगत हिन्दी में ज्यों की त्यों रखना
  rationale: दिया गया यूनानी पाठ ἡ γῆ के बाद कर्म नहीं देता और τὴν θάλασσαν तथा τὸν Ἰωσήφ को लगातार कर्मकारक में रखता है, जिससे प्रतिलिपिगत लोप स्पष्ट है। पुनर्रचना सूची का अर्थ और संरचना लौटाती है, जबकि पादटिप्पणी स्रोत की वास्तविक अनिश्चितता नहीं छिपाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पाठ-सुलभ रखी गई है। नामों के साथ चलने वाली संक्षिप्त समानांतर सूची को अर्धविरामों से व्यक्त किया गया है। ‘उपस्थिति’, ‘शक्तियाँ’ और ‘ज्योतियाँ’ जैसे शब्द मूल की स्वर्गीय और प्रतीकात्मक अस्पष्टता बनाए रखते हैं।
