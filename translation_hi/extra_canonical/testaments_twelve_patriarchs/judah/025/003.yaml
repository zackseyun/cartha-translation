  text: And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.
translation:
  language: hi
  text: और तुम प्रभु की प्रजा होगे, और एक ही भाषा होगी, और वहाँ बेलियार से जुड़ी भटकाने वाली कोई आत्मा नहीं होगी, क्योंकि उसे सदा के लिए फेंक दिया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दिए गए यूनानी पाठ में ‘आग में’ शब्द नहीं हैं; इसलिए मुख्य पाठ में केवल इतना अनुवाद किया गया है: ‘उसे सदा के लिए फेंक दिया जाएगा।’'
    reason: अंग्रेज़ी POB audit trail में ‘आग में’ है, पर समीक्षा के लिए दिए गए प्राथमिक यूनानी पाठ में वह गंतव्य नहीं है।
lexical_decisions:
- source_word: λαὸν Κυρίου
  choice: प्रभु की प्रजा
  rationale: यह सामान्य, सामूहिक और गरिमापूर्ण अभिव्यक्ति है, जो यूनानी संबंधवाचक पदबंध को स्वाभाविक हिन्दी में रखती है।
- source_word: γλῶσσα μία
  choice: तुम्हारी भाषा एक होगी
  rationale: शाब्दिक अर्थ ‘एक भाषा/एक जीभ’ है; प्रसंग में साझा भाषा अभिप्रेत है। ‘तुम्हारी’ हिन्दी में संबंध स्पष्ट करता है, बिना आशय बदले।
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: बेलियार की ओर से भटकाने वाली कोई आत्मा
  rationale: πλάνης को केवल ‘छल’ तक सीमित न करके उसके भटकाव के भाव को व्यक्त किया गया है। τοῦ Βελιάρ संबंध या स्रोत दोनों सूचित कर सकता है; ‘की ओर से’ स्रोत का स्वाभाविक पाठ देता है।
- source_word: ἐμβληθήσεται εἰς τὸν αἰῶνα
  choice: उसे सदा के लिए फेंक दिया जाएगा
  rationale: प्राप्त यूनानी पाठ में कर्मवाच्य क्रिया और कालगत पदबंध है; यहाँ ‘आग में’ के लिए कोई स्पष्ट यूनानी शब्द नहीं है, इसलिए अंग्रेज़ी परामर्श-पाठ की उस वृद्धि को मुख्य पाठ में नहीं लिया गया।
theological_decisions:
- issue: फेंके जाने वाली सत्ता का अनिर्दिष्ट कर्तृ/कर्म-संदर्भ
  choice: ‘उसे’ द्वारा निकटतम स्त्रीलिंग संज्ञा ‘आत्मा’ की ओर संकेत, पर गंतव्य अनिर्दिष्ट
  alternative: ‘बेलियार को’ या ‘आग में’ स्पष्ट करना
  rationale: यूनानी ἐμβληθήσεται का निहित विषय संदर्भ से समझा जाता है, पर पाठ स्वयं बेलियार या आग को स्पष्ट नहीं करता। अनिश्चितता बनाए रखना स्रोत-संगत है।
- issue: τοῦ Βελιάρ का संबंध
  choice: ‘बेलियार की ओर से’
  alternative: ‘बेलियार के छल की आत्मा’ अथवा ‘बेलियार की भटकाने वाली आत्मा’
  rationale: यूनानी संबंधवाचक रूप स्वामित्व, स्रोत या संबद्धता व्यक्त कर सकता है। चुना हुआ रूप स्रोत का भाव देता है और बेलियार तथा आत्मा को अनिवार्यतः एक ही सत्ता नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। छोटे वाक्यों से भविष्यवाणी का प्रवाह स्पष्ट रखा गया है। ‘बेलियार’ नाम का लिप्यंतरण किया गया है और वास्तविक स्रोतगत अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
