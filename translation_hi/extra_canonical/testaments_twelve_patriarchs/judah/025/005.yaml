source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ οἱ ἔλαφοι⁴⁸ Ἰακὼβ⁴⁹ δραμοῦνται ἐν ἀγαλλιάσει⁴⁹, καὶ ἀετοὶ Ἰσραὴλ⁴⁹ πετασθήσονται ἐν χαρᾷ· [οἱ δὲ ἀσεβεῖς πενθήσουσι καὶ οἱ ἁμαρτωλοὶ κλαύσονται]⁵¹, καὶ πάντες οἱ λαοὶ δοξάσουσι Κύριον εἰς αἰῶνας⁵².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/005.yaml
  text: And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.
translation:
  language: hi
  text: और याकूब के हिरन उल्लास से दौड़ेंगे, और इस्राएल के उकाब आनंद से उड़ेंगे; [पर अधर्मी शोक मनाएँगे और पापी रोएँगे][a]; और सभी जातियाँ सदा-सर्वदा प्रभु की महिमा करेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पर अधर्मी शोक मनाएँगे और पापी रोएँगे”—दिए गए यूनानी संस्करण में यह खंड वर्ग-कोष्ठकों में है, जो इसके पाठ में संपादकीय आरक्षण या पाठगत अनिश्चितता दर्शाता है।
    reason: मूल-स्रोत के वर्ग-कोष्ठकों से सूचित पाठगत स्थिति को स्पष्ट करना।
lexical_decisions:
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: याकूब के हिरन
  rationale: प्राथमिक यूनानी पाठ में Ἰακώβ (‘याकूब’) है, इसलिए अंग्रेज़ी परामर्श-पाठ के ‘Joseph’ के स्थान पर मूल-स्रोत का अनुसरण किया गया। रूपक को समझाकर बदलने के बजाय यथावत रखा गया।
- source_word: ἐν ἀγαλλιάσει
  choice: उल्लास से
  rationale: यह अभिव्यक्ति प्रबल हर्ष और उत्सवपूर्ण आनंद का बोध कराती है; ‘उल्लास से’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἀετοὶ Ἰσραήλ
  choice: इस्राएल के उकाब
  rationale: ἀετοί का सीधा अर्थ ‘उकाब’ है। समानांतर पशु-रूपक को सुरक्षित रखा गया।
- source_word: οἱ ἀσεβεῖς … οἱ ἁμαρτωλοί
  choice: अधर्मी … पापी
  rationale: 'दो अलग यूनानी पदों और उनके अर्थगत अंतर को बनाए रखा गया: पहला भक्ति/धर्म से विमुख लोगों और दूसरा पाप करने वालों को सूचित करता है।'
- source_word: πάντες οἱ λαοί
  choice: सभी जातियाँ
  rationale: λαοί यहाँ अनेक जनसमुदायों/राष्ट्रों को दर्शाता है; बाइबलीय सन्दर्भ में ‘जातियाँ’ संक्षिप्त और परिचित है।
- source_word: εἰς αἰῶνας
  choice: सदा-सर्वदा
  rationale: कालों तक बने रहने वाले अनन्त स्तुतिगान का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: याकूब/यूसुफ नाम का पाठांतर
  choice: याकूब
  alternative: यूसुफ
  rationale: दिए गए प्राथमिक यूनानी स्रोत में स्पष्ट रूप से Ἰακώβ है। अंग्रेज़ी POB का ‘Joseph’ मूल-स्रोत से समर्थित नहीं है, इसलिए उसे ग्रहण नहीं किया गया।
- issue: कोष्ठकबद्ध न्याय-वाक्य का समावेश
  choice: मुख्य पाठ में रखा और पाठगत टिप्पणी जोड़ी
  alternative: अंग्रेज़ी POB की तरह वाक्यांश को छोड़ देना
  rationale: दिए गए यूनानी स्रोत में वाक्यांश उपस्थित है, यद्यपि संपादकीय वर्ग-कोष्ठकों में है। उसे चुपचाप हटाने के बजाय उसकी पाठगत अनिश्चितता स्पष्ट की गई।
- issue: पशु-रूपकों की व्याख्या
  choice: हिरन और उकाब के रूपकों को अक्षरशः सुरक्षित रखा
  alternative: उन्हें याकूब और इस्राएल के वीरों अथवा वंशजों के रूप में स्पष्ट करना
  rationale: पाठ स्वयं रूपक का आशय नहीं खोलता; व्याख्यात्मक विस्तार genuine ambiguity को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। वाक्य की काव्यात्मक समानांतरता—हिरन/उकाब, उल्लास/आनंद, अधर्मी/पापी—को यथासंभव सुरक्षित रखा गया है।
