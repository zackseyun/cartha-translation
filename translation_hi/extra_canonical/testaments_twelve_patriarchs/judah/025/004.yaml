  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ³⁹ ἐν λύπῃ τελευτήσαντες ἀναστήσονται ⁴⁰καὶ οἱ πτωχοὶ⁴¹ διὰ Κύριον⁴³ πλουτισθήσονται⁴⁴ καὶ⁴⁴ οἱ ἀποθνήσκοντες διὰ Κύριον⁴⁵ ἐξυπνισθήσονται⁴⁶ εἰς ζωήν⁴⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/004.yaml
  text: And those who died in sorrow will rise in joy, and the poor because of the Lord will be made rich, and those dying because of the Lord will awake to life.
translation:
  language: hi
  text: और जो दुःख में मर गए, वे जी उठेंगे; और जो निर्धन प्रभु के कारण[a] हैं, वे धनी किए जाएँगे; और जो प्रभु के कारण मर रहे हैं, वे जीवन के लिए जाग उठेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रभु के कारण” का अनुवाद “प्रभु के लिए” या “प्रभु के निमित्त” भी हो सकता है। यही यूनानी वाक्यांश अगले खंड में फिर आया है।
    reason: διά + कर्मकारक यहाँ कारण और उद्देश्य/निष्ठा के बीच अर्थगत तनाव रखता है; पादटिप्पणी इस अस्पष्टता को बिना मुख्य पाठ को बोझिल किए सुरक्षित रखती है।
lexical_decisions:
- source_word: ἐν λύπῃ τελευτήσαντες
  choice: जो दुःख में मर गए
  rationale: ग्रीक कृदंत पूर्ण हो चुकी मृत्यु को और ἐν λύπῃ मृत्यु की दुःखपूर्ण अवस्था को व्यक्त करता है। स्रोत में ‘आनन्द में’ जैसा कोई पद नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἀναστήσονται
  choice: जी उठेंगे
  rationale: पुनरुत्थान के अर्थ को स्वाभाविक और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: οἱ πτωχοὶ
  choice: जो निर्धन ... हैं
  rationale: πτωχοί आर्थिक अभाव में पड़े लोगों को सूचित करता है; ‘निर्धन’ गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: πλουτισθήσονται
  choice: धनी किए जाएँगे
  rationale: ग्रीक भविष्यत् कर्मवाच्य को सुरक्षित रखता है और कर्ता को अनकहा ही रहने देता है।
- source_word: οἱ ἀποθνήσκοντες
  choice: जो ... मर रहे हैं
  rationale: वर्तमान कृदंत की जारी प्रक्रिया को बनाए रखता है और पहले खंड के पूर्ण कृदंत से उसका भेद सुरक्षित करता है।
- source_word: ἐξυπνισθήσονται εἰς ζωήν
  choice: जीवन के लिए जाग उठेंगे
  rationale: जागने की मूल छवि और εἰς ζωήν की लक्ष्य-दिशा दोनों को बनाए रखता है।
theological_decisions:
- issue: διὰ Κύριον का अर्थ
  choice: प्रभु के कारण
  alternative: प्रभु के लिए / प्रभु के निमित्त
  rationale: कर्मकारक के साथ διά कारण या प्रेरक आधार व्यक्त कर सकता है। मुख्य पाठ में निकटतम कारणार्थक अभिव्यक्ति रखी गई है, जबकि उद्देश्य अथवा निष्ठा-संबंधी अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- issue: ἀναστήσονται में आनन्द का उल्लेख
  choice: केवल ‘जी उठेंगे’
  alternative: ‘आनन्द में जी उठेंगे’
  rationale: दिए गए प्राथमिक ग्रीक पाठ में ‘आनन्द में’ के लिए कोई शब्द नहीं है; इसलिए अंग्रेज़ी परामर्श-पाठ की इस वृद्धि को हिन्दी में नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। समानांतर तीन खंडों और भविष्यकाल को सुरक्षित रखा गया है; पहले और तीसरे खंड में मृत्यु की अलग-अलग ग्रीक क्रियात्मक अवस्थाओं का भेद भी बनाए रखा गया है।
