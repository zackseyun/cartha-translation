source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Διὰ τοῦτο καὶ ὁ Κύριος *πολλοὺς ἰχθύας ἐνέπλησέ με²⁵ ἐν τῇ ἄγρᾳ τῶν ἰχθύων²⁶. Ὁ γὰρ μεταδιδοὺς τῷ πλησίον²⁷, λαμβάνει πολλαπλασίονα²⁸ παρὰ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/006.yaml
  text: For this reason the Lord also filled me with many fish in the catch of fish. For the one who shares with his neighbor receives many times more from the Lord.
translation:
  language: hi
  text: इसी कारण प्रभु ने भी मछलियाँ पकड़ने में मुझे बहुत-सी मछलियों से भर दिया। क्योंकि जो अपने पड़ोसी के साथ बाँटता है, वह प्रभु से कई गुना अधिक पाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पूर्ववर्ती कथन से स्पष्ट कारणात्मक संबंध बनाए रखता है।
- source_word: ἐνέπλησέ με πολλοὺς ἰχθύας
  choice: मुझे बहुत-सी मछलियों से भर दिया
  rationale: यूनानी की असामान्य परंतु अर्थपूर्ण अभिव्यक्ति को यथासंभव सुरक्षित रखा गया है; आशय भरपूर पकड़ मिलने का है।
- source_word: ἐν τῇ ἄγρᾳ τῶν ἰχθύων
  choice: मछलियाँ पकड़ते समय
  rationale: ἄγρα पकड़ या शिकार की क्रिया/परिणाम को सूचित कर सकता है; यहाँ स्वाभाविक हिन्दी में मछली पकड़ने का प्रसंग व्यक्त किया गया है, बिना 'जाल' जोड़ने के, जो यूनानी में स्पष्ट नहीं है।
- source_word: ὁ μεταδιδοὺς
  choice: जो ... के साथ बाँटता है
  rationale: क्रिया अपने पास की वस्तु में दूसरे को सहभागी बनाने या देने का अर्थ रखती है।
- source_word: τῷ πλησίον
  choice: अपने पड़ोसी
  rationale: निकटवर्ती व्यक्ति या पड़ोसी के पारंपरिक और सहज अर्थ को रखा गया है।
- source_word: πολλαπλασίονα
  choice: कई गुना
  rationale: यह मात्र 'बहुत अधिक' नहीं, बल्कि गुणित प्रतिफल का अर्थ देता है।
theological_decisions:
- issue: बाँटने और प्रभु से प्रतिफल पाने का संबंध
  choice: 'कारणात्मक नीति-वचन को सीधे रखा गया: बाँटने वाला प्रभु से कई गुना पाता है।'
  alternative: इसे केवल सामान्य समृद्धि या निश्चित भौतिक प्रतिफल के रूप में स्पष्ट करना।
  rationale: मूल पाठ प्रतिफल के स्वरूप को निर्दिष्ट नहीं करता; इसलिए भौतिक या आत्मिक अर्थ को जबरन निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। स्रोत की पुनरुक्ति और 'मुझे ... से भर दिया' वाली रूपकात्मक अभिव्यक्ति को अर्थ खोए बिना बनाए रखा गया है।
