  text: मैंने बीच में एक अन्य सीधे खड़े लकड़ी के खंभे पर चादर तान दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀθόνην
  choice: चादर
  rationale: यहाँ कपड़े की बड़ी चादर या पट को सूचित करता है; प्रसंग के अभाव में सामान्य और स्वाभाविक शब्द चुना गया है।
- source_word: ἐξέτεινα
  choice: तान दी
  rationale: क्रिया का अर्थ फैलाना या खींचकर तानना है; कपड़े के साथ ‘तान दी’ स्वाभाविक है।
- source_word: ἐν ἑτέρῳ ξύλῳ ὀρθῷ
  choice: एक दूसरे सीधे खड़े लकड़ी के खंभे पर
  rationale: ἕτερος को ‘दूसरे’, ξύλον को इस संरचनात्मक संदर्भ में ‘लकड़ी का खंभा’, और ὀρθός को ‘सीधे खड़े’ के रूप में व्यक्त किया गया है।
- source_word: ἐν μέσῳ
  choice: बीच में
  rationale: ग्रीक वाक्यांश की स्थानगत अस्पष्टता बनाए रखता है और यह निर्धारित नहीं करता कि ‘बीच’ किस वस्तु या क्षेत्र का है।
