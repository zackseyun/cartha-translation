translation:
  language: hi
  text: और मैं अपने शिकार में से हर परदेशी को करुणा दिखाते हुए बाँट देता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῆς θήρας μου
  choice: अपने शिकार में से
  rationale: θήρα यहाँ शिकार से प्राप्त वस्तु या पकड़ को सूचित करता है; हिन्दी में ‘अपने शिकार में से’ स्रोत की संक्षिप्तता और वितरण के भाव को बनाए रखता है।
- source_word: παντὶ ἀνθρώπῳ ξένῳ
  choice: हर परदेशी को
  rationale: ξένος का अर्थ प्रसंग में अपरिचित अथवा बाहर से आया व्यक्ति है; ‘परदेशी’ गरिमापूर्ण और सहज हिन्दी में इस सामाजिक अर्थ को व्यक्त करता है।
- source_word: σπλαγχνιζόμενος
  choice: करुणा दिखाते हुए
  rationale: यह कृदन्त गहरी दया से प्रेरित होने का भाव रखता है; यह चयन क्रिया के साथ उसके प्रेरक भाव को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: μετεδίδουν
  choice: बाँट देता था
  rationale: अपूर्ण भूतकाल नियमित या बार-बार किए गए साझा करने के कार्य को दर्शाता है; ‘बाँट देता था’ उस पुनरावृत्त भाव को व्यक्त करता है।
