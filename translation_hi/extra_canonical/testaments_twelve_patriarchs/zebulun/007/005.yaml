  text: If anyone was a foreigner, or sick, or aged, after boiling the fish and preparing them well, I would offer them to each according to need, suffering with them and feeling their pain.
translation:
  language: hi
  text: यदि कोई परदेशी, बीमार या बूढ़ा होता, तो मैं मछलियाँ उबालकर और उन्हें अच्छी तरह तैयार करके, हर एक की आवश्यकता के अनुसार सबको देता था; मैं उनके दुख में दुखी होता और उनके साथ पीड़ा सहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξένος
  choice: परदेशी
  rationale: यहाँ संज्ञा के रूप में ऐसे व्यक्ति का संकेत है जो स्थानीय समुदाय से बाहर का या अपरिचित है; ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है और ‘अतिथि’ की अतिरिक्त धारणा नहीं जोड़ता।
- source_word: ἐψήσας τοὺς ἰχθύας
  choice: मछलियाँ उबालकर
  rationale: क्रिया का मूल अर्थ पकाना या उबालना हो सकता है; उपलब्ध संदर्भ और परामर्श-पाठ के अनुसार ‘उबालकर’ चुना गया है।
- source_word: ποιήσας αὐτὰ ἀγαθῶς
  choice: उन्हें अच्छी तरह तैयार करके
  rationale: शाब्दिक ‘उन्हें भली रीति से करके’ हिन्दी में अस्वाभाविक है; भोजन के संदर्भ में यह अभिव्यक्ति उचित ढंग से तैयार करने को दर्शाती है।
- source_word: κατὰ τὴν ἑκάστου χρείαν
  choice: हर एक की आवश्यकता के अनुसार
  rationale: वितरण या तैयारी को प्रत्येक व्यक्ति की अलग आवश्यकता के अनुरूप रखता है, बिना आवश्यकता का प्रकार निर्धारित किए।
- source_word: συναλγῶν καὶ συμπάσχων
  choice: उनके दुख में दुखी होता और उनके साथ कष्ट सहता था
  rationale: 'दोनों निकटार्थी कृदंतों का भेद बनाए रखा गया है: पहला दूसरे की पीड़ा से दुखी होने और दूसरा उसके साथ दुःख भोगने को व्यक्त करता है।'
