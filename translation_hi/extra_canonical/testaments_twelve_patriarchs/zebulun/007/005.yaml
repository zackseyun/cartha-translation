  to: यदि कोई परदेशी, बीमार या बूढ़ा होता, तो मैं मछलियाँ उबालकर और उन्हें अच्छी तरह तैयार करके, हर एक की आवश्यकता के अनुसार सबको देता था; मैं उनके दुख में दुखी होता और उनके साथ पीड़ा सहता था।
