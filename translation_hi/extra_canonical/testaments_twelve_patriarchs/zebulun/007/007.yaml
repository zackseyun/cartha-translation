  text: For five years, then, I fished, sharing with everyone I had seen, and providing for all my father’s house.
translation:
  language: hi
  text: तब पाँच वर्ष तक मैं मछली पकड़ता रहा; जिस किसी को मैं देखता, उसे उसमें से हिस्सा देता, और अपने पिता के पूरे घराने की ज़रूरतें पूरी करता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέντε οὖν ἔτη
  choice: इसलिए पाँच वर्ष तक
  rationale: οὖν का निष्कर्षसूचक संबंध ‘इसलिए’ से और समयावधि को ‘पाँच वर्ष तक’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἡλίευσα
  choice: मैं मछलियाँ पकड़ता रहा
  rationale: क्रिया का अर्थ मछली पकड़ना है; पाँच वर्षों की अवधि में जारी गतिविधि दिखाने के लिए ‘पकड़ता रहा’ उपयुक्त है।
- source_word: παντὶ ἀνθρώπῳ ὃν ἑωράκειν μεταδιδούς
  choice: जिस किसी को मैं देखता, उसे उसमें से बाँट देता
  rationale: μεταδίδω का आशय अपने पास की वस्तु में हिस्सा देना है। ‘उसमें से’ का संकेत पकड़ी हुई मछलियों की ओर है, जबकि यूनानी की व्यापकता ‘जिस किसी’ में सुरक्षित है।
- source_word: παντὶ τῷ οἴκῳ τοῦ πατρός μου ἐξαρκῶν
  choice: अपने पिता के पूरे घराने की आवश्यकताएँ पूरी करता था
  rationale: ἐξαρκέω यहाँ पर्याप्त साधन उपलब्ध कराने अथवा पालन-पोषण का भाव देता है; ‘घराना’ οἶκος के पारिवारिक-सामुदायिक अर्थ को व्यक्त करता है।
