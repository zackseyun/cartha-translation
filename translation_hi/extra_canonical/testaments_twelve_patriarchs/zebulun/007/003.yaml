translation:
  language: hi
  text: और मैं समुद्र-तटों पर चलता-फिरता, अपने पिता के घराने के लिए मछलियाँ पकड़ता था, जब तक हम मिस्र पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπορευόμενος τοὺς αἰγιαλούς
  choice: समुद्र-तटों पर घूमता हुआ
  rationale: διαπορεύομαι चलते या विचरते हुए एक क्षेत्र से गुजरने का भाव देता है, और αἰγιαλούς बहुवचन में तटों अथवा तटीय भागों को दर्शाता है।
- source_word: ἁλιεύων ἰχθύας
  choice: मछलियाँ पकड़ता था
  rationale: शाब्दिक पुनरुक्ति ‘मछलियों के लिए मछली पकड़ना’ के बजाय हिन्दी में स्वाभाविक ढंग से निरंतर/अभ्यस्त क्रिया व्यक्त की गई है।
- source_word: τῷ οἴκῳ τοῦ πατρός μου
  choice: अपने पिता के घराने के लिए
  rationale: οἶκος यहाँ केवल भवन नहीं, बल्कि पिता के परिवार या गृहस्थी को सूचित करता है; ‘घराने’ से यह व्यापक अर्थ सुरक्षित रहता है।
- source_word: ἕως ὅτου ἤλθομεν εἰς Αἴγυπτον
  choice: जब तक कि हम मिस्र नहीं आए
  rationale: यूनानी काल-सीमा और एकवचन वक्ता से बहुवचन ‘हम’ में हुए स्पष्ट परिवर्तन को ज्यों का त्यों रखा गया है।
