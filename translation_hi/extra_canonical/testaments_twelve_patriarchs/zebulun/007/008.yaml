  text: 7. *Καὶ τὸ μὲν ἥμισυ³² *ἐν τῷ χειμῶνι³³ ἐτοιμαίμην μετὰ τῶν ἀδελφῶν μου. 8. Εἰ δὲ μὴ ἔχετε δοῦναι τῷ χρήζοντι, συμπάσχετε αὐτῷ⁷ ἐν σπλάγχνοις ἐλέους. 9. Οἶδα⁸ ὅτι ἡ χείρ μου *οὐχ εὗρε⁹ ἐπιδοῦναι¹⁰ τῷ χρήζοντι, καὶ ἐπὶ¹¹ ἑπτὰ σταδίους συμπορευόμενος αὐτῷ ἔκλαιον· καὶ τὰ σπλάγχνα μου *ἐστρέφετο ἐπʼ αὐτῷ¹² εἰς συμπάθειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/008.yaml
  text: Half of it I would set aside in winter with my brothers. But if you do not have anything to give to the one in need, suffer with him in inward parts of mercy. I know that my own hand did not find anything to give to the one in need, and walking together with him for seven stadia I would weep; and my inward parts turned toward him in sympathy.
translation:
  language: hi
  text: यदि तुम्हारे पास किसी ज़रूरतमंद को देने के लिए कुछ न हो, तो गहरी करुणा के साथ उसके दुःख में सहभागी बनो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “करुणा के अंतरंग अंगों में”; यह अंतरतम से उमड़ने वाली गहरी करुणा का मुहावरा है।
    reason: मूल पाठ के शारीरिक मुहावरे और उसकी भावात्मक तीव्रता को पाठक के लिए दृश्यमान रखना।
lexical_decisions:
- source_word: τῷ χρήζοντι
  choice: किसी ज़रूरतमंद को
  rationale: वर्तमान कृदंत उस व्यक्ति को सूचित करता है जिसे आवश्यकता है; यह हिन्दी में स्वाभाविक और व्यापक रूप से समझ में आने वाला रूप है।
- source_word: συμπάσχετε αὐτῷ
  choice: उसके दुःख में सहभागी बनो
  rationale: क्रिया का मूल भाव केवल मन में सहानुभूति रखना नहीं, बल्कि दूसरे के साथ दुःख अनुभव करना है; इस अनुवाद में वह सहभागिता बनी रहती है।
- source_word: ἐν σπλάγχνοις ἐλέους
  choice: हृदय की गहरी करुणा के साथ
  rationale: यूनानी शारीरिक मुहावरे का आशय अंतरतम से उपजने वाली करुणा है; शब्दशः अस्वाभाविक हिन्दी के बजाय अर्थपूर्ण आधुनिक अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: करुणा को केवल भावना या सक्रिय सह-दुःख के रूप में व्यक्त करना
  choice: उसके दुःख में सहभागी बनो
  alternative: उस पर दया करो
  rationale: मूल συμπάσχετε दूसरे के साथ दुःख सहने का भाव रखता है; सामान्य ‘दया करो’ इस पारस्परिक सहभागिता को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है। भाषा सरल और गरिमापूर्ण रखी गई है, जबकि मूल के ‘साथ दुःख सहने’ और अंतरतम करुणा के भाव सुरक्षित हैं।
