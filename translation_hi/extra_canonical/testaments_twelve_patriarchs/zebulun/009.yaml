  text: 1 Therefore pay attention to the waters[a], and understand that when they move to one place, they carry down stones, wood, earth, and various other things. 2 But if they are divided into many streams, the ground swallows them up, and they become easy to despise. 3 So also you, if you are divided, will become like this. 4 Therefore do not be split under two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members. 5 For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow two kingdoms, and you will do every abomination. 6 And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses. 7 And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go
    astray in their evil deeds. 8 And after these things the Lord himself will rise for you[c][b], the light of righteousness.
translation:
  language: hi
  text: '**जबूलून का वसीयतनामा 9**


    1 इसलिए जलधाराओं पर ध्यान दो और समझो कि जब वे एक ही स्थान की ओर बढ़ती हैं, तो पत्थरों, लकड़ियों, मिट्टी और तरह-तरह की दूसरी वस्तुओं को अपने साथ बहा ले जाती हैं। 2 लेकिन यदि वे बहुत-सी धाराओं में बँट जाएँ, तो धरती उन्हें सोख लेती है और वे तुच्छ समझी जाने लगती हैं। 3 इसी प्रकार, यदि तुम भी विभाजित हो जाओगे, तो तुम्हारी दशा ऐसी ही होगी। 4 इसलिए दो सिरों के अधीन होकर अलग-अलग न हो जाना, क्योंकि प्रभु ने जो कुछ बनाया है, उसका एक सिर, दो कंधे, दो हाथ, दो पैर और शेष सभी अंग होते हैं। 5 क्योंकि मैंने अपने पूर्वजों के लेखों से जाना है कि तुम इस्राएल में विभाजित हो जाओगे, दो राज्यों के पीछे चलोगे और हर प्रकार का घृणित काम करोगे। 6 तुम्हारे शत्रु तुम्हें बंदी बना लेंगे, और तुम अन्यजातियों के बीच अनेक दुर्बलताओं और क्लेशों में सताए जाओगे। 7 इसके बाद प्रभु को स्मरण करके तुम लौटोगे[a], और वह तुम पर दया करेगा, क्योंकि वह दयालु और करुणामय है। वह मनुष्यों की संतानों की बुराई का लेखा नहीं रखता, क्योंकि वे देह हैं और अपने बुरे कामों में भटक जाते हैं[b]। 8 इसके बाद स्वयं प्रभु तुम्हारे लिए उदय होगा[c]—धार्मिकता
    का प्रकाश।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-साक्ष्यों में इसके स्थान पर है, “तुम प्रभु को स्मरण करके मन फिराओगे, और वह तुम्हें लौटा लाएगा।”
    reason: textual_variant
  - marker: b
    text: 'कुछ पाठ-साक्ष्य इस कारण-वाक्य को विस्तार से देते हैं: “क्योंकि वे देह हैं और भटकाने वाली आत्माएँ उन्हें उनके सभी कामों में भटका देती हैं।”'
    reason: textual_variant
  - marker: c
    text: या, “तुम्हारे लिए उगेगा”; चित्र प्रभु के उगते प्रकाश के समान प्रकट होने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ... ἐπὶ τὰ ὕδατα
  choice: जलधाराओं पर ध्यान दो
  rationale: सीधे उपदेश का बल बनाए रखते हुए बहते जल के बहुवचन चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: एक ही स्थान की ओर बढ़ती हैं
  rationale: मूल के ‘एक ही स्थान की ओर जाने’ के भाव को रखता है और अनावश्यक रूप से धाराओं के संगम की व्याख्या नहीं जोड़ता।
- source_word: κατασύρουσιν
  choice: अपने साथ बहा ले जाती हैं
  rationale: जल के प्रवाह द्वारा वस्तुओं को खींचकर ले जाने का ठोस चित्र सहज हिन्दी में सुरक्षित रहता है।
- source_word: ἀφανίζει
  choice: सोख लेती है
  rationale: अलग-अलग हुई जलधाराओं के धरती में लुप्त होने का प्रसंगगत अर्थ स्पष्ट और चित्रात्मक रूप से व्यक्त होता है।
- source_word: εὐκαταφρόνητα
  choice: तुच्छ समझी जाने लगती हैं
  rationale: विभाजन के बाद नगण्य और आसानी से उपेक्षित हो जाने के अर्थ को बनाए रखता है।
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: दो सिरों के अधीन होकर अलग-अलग न हो जाना
  rationale: χωρισθῆτε को पहले आए ‘विभाजित’ से अलग शब्दावली में व्यक्त करते हुए शारीरिक और राजनीतिक ‘दो सिरों’ के रूपक को सुरक्षित रखता है।
- source_word: γραφῇ τῶν πατέρων μου
  choice: अपने पूर्वजों के लेखों
  rationale: वंशगत प्रामाणिक लेखन का भाव रखता है, पर उसे अनिवार्य रूप से धर्मग्रंथ घोषित नहीं करता।
- source_word: ἐξακολουθήσετε
  choice: दो राज्यों के पीछे चलोगे
  rationale: मूल क्रिया के अनुसरण और निष्ठा के भाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: βδέλυγμα
  choice: घृणित काम
  rationale: नैतिक और धार्मिक रूप से अत्यंत आपत्तिजनक कर्म का प्रबल, किंतु सामान्य पाठक के लिए स्पष्ट, अनुवाद है।
- source_word: ἀνατελεῖ
  choice: उदय होगा
  rationale: उगते प्रकाश के बिंब को बनाए रखता है और प्रभु के प्रकट होने को किसी एक संकीर्ण धार्मिक व्याख्या तक सीमित नहीं करता।
- source_word: φῶς δικαιοσύνης
  choice: धार्मिकता का प्रकाश
  rationale: मूल संज्ञात्मक रूपक और उसकी सम्भावित उद्धारकारी तथा मसीही प्रतिध्वनियों को खुला रखता है।
theological_decisions:
- issue: पद 7 में स्मरण, लौटने और परमेश्वर द्वारा फेर लाने का पाठांतर
  choice: मुख्य पाठ में ‘प्रभु को स्मरण करके तुम लौटोगे’
  alternative: ‘तुम प्रभु को स्मरण करके मन फिराओगे, और वह तुम्हें लौटा लाएगा’
  rationale: प्रदत्त आधार-पाठ में मनुष्य के लौटने वाला पाठ है; वैकल्पिक साक्ष्य में पश्चात्ताप और परमेश्वर द्वारा फेर लाना है। अर्थगत धार्मिक अंतर को टिप्पणी में सुरक्षित रखा गया है।
- issue: पद 7 में मनुष्य के भटकने का कारण
  choice: ‘वे देह हैं और अपने बुरे कामों में भटक जाते हैं’
  alternative: ‘वे देह हैं और भटकाने वाली आत्माएँ उन्हें उनके सभी कामों में भटका देती हैं’
  rationale: मुख्य पाठ संक्षिप्त यूनानी पाठ का अनुसरण करता है; आत्मिक शक्तियों वाला विस्तृत पाठ बिना मिलावट किए पाद-टिप्पणी में दिया गया है।
- issue: पद 8 में ‘धार्मिकता का प्रकाश’
  choice: इसे स्वयं प्रभु के उदय से जुड़ा खुला दैवी रूपक रखा गया है
  alternative: इसे केवल एक मसीही पदवी या केवल सामान्य पुनर्स्थापना का रूपक मानना
  rationale: मूल वाक्य धार्मिक अर्थ की व्यापक सम्भावना रखता है; अनुवाद किसी एक बाद की सिद्धान्तगत पहचान को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष उपदेशात्मक शैली रखी गई है। ‘सिर’, ‘अंग’, ‘देह’ और ‘धार्मिकता का प्रकाश’ जैसे मूल रूपकों को व्याख्यात्मक रूप से समतल नहीं किया गया। ‘अन्यजातियाँ’, ‘करुणामय’ और ‘लेखा रखना’ जैसे परिचित बाइबिलीय पद प्रयोग किए गए हैं, पर वाक्य-संरचना सामान्य आधुनिक पाठक के लिए सहज रखी गई है।
