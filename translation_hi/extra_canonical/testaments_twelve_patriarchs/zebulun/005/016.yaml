    reason: cultural_note
lexical_decisions:
- source_word: ἔλεος
  choice: दया
  rationale: यह यूनानी संज्ञा करुणा और दयालु व्यवहार दोनों को व्यक्त करती है; ‘दया’ आधुनिक हिन्दी में इसका स्वाभाविक और गरिमापूर्ण समतुल्य है।
- source_word: ἐν σπλάγχνοις ὑμῶν
  choice: अपने हृदय में
  rationale: शाब्दिक अर्थ ‘अपने भीतरी अंगों में’ है, पर यूनानी मुहावरे में σπλάγχνα गहरी करुणा के आंतरिक केंद्र को दर्शाता है; हिन्दी में ‘हृदय’ उसी भाव को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: τῷ πλησίον αὐτοῦ
  choice: अपने पड़ोसी के साथ
  rationale: πλησίον का अर्थ निकटवर्ती या साथी मनुष्य है; ‘पड़ोसी’ बाइबलीय प्रयोग को बनाए रखते हुए सामान्य हिन्दी में बोधगम्य है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ
  rationale: μετά के संबंधसूचक अर्थ को बनाए रखा गया है; प्रसंग में यह व्यक्ति के व्यवहार के अनुरूप प्रभु के व्यवहार को व्यक्त करता है।
theological_decisions:
- issue: मानवीय व्यवहार और प्रभु के प्रत्युत्तर के बीच समानता
  choice: ‘वैसा ही प्रभु उसके साथ करेगा’
  alternative: ‘प्रभु भी उसके साथ वैसा ही करेगा’
  rationale: οὕτω की प्रतिरूपात्मक शक्ति को स्पष्ट रखा गया है, जबकि स्रोत में न होने के कारण अतिरिक्त ‘भी’ जोड़ना आवश्यक नहीं समझा गया। यह वाक्य के नैतिक प्रत्युत्तर को व्यक्त करता है, उसके धर्मशास्त्रीय तंत्र को विस्तार से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण उपदेशात्मक शैली अपनाई गई है। ‘हृदय में दया रखो’ मूल मुहावरे की भावात्मक गहराई को स्वाभाविक हिन्दी में व्यक्त करता है; फुटनोट शाब्दिक सांस्कृतिक बिंब को सुरक्षित रखता है।
