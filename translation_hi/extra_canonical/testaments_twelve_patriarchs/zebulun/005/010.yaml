  text: For they stripped Joseph of the tunic when they sold him, and clothed him in a servant’s garment.
translation:
  language: hi
  text: क्योंकि जब उन्होंने यूसुफ को बेचा, तब उसका कुरता उतार लिया और उसे दास का वस्त्र पहना दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: कुरता
  rationale: यह शरीर पर पहने जाने वाले अंदरूनी या मूल वस्त्र को दर्शाता है; ‘कुरता’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: πιπράσκειν
  choice: बेचा
  rationale: वर्तमान infinitive के साथ ἐν समय-संबंध व्यक्त करता है; हिन्दी में पूर्ण घटना के संदर्भ में ‘जब उन्होंने ... बेचा’ स्वाभाविक है।
- source_word: ἱμάτιον δουλικόν
  choice: दासों वाला वस्त्र
  rationale: δουλικόν दास से संबंधित या दासोचित वस्त्र बताता है। ‘दासों वाला वस्त्र’ सामाजिक पहचान को स्पष्ट रखते हुए सहज हिन्दी देता है।
