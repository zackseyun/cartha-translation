source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. *Καὶ γὰρ²⁵ υἱοὶ²⁶ τῶν ἀδελφῶν μου ἠσθένουν καὶ²⁷ ἀπέθνησκον διὰ Ἰωσήφ²⁸, ⌈ὅτι οὐκ ἐποίησαν ἔλεος *ἐν σπλάγχνοις αὐτῶν²⁹⌉. οἱ δὲ *ἐμοὶ υἱοὶ³⁰ ἄνοσοι διεφυλάχθησαν³¹ καθὼς³² οἴδατε³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/017.yaml
  text: For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their inward parts; but my sons were kept free from sickness, as you know.
translation:
  language: hi
  text: क्योंकि मेरे भाइयों के बेटे यूसुफ के कारण बीमार थे और मर रहे थे, क्योंकि उन्होंने अपने भीतर दया नहीं दिखाई थी; पर मेरे बेटे रोग से मुक्त रखे गए, जैसा कि तुम जानते हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ τῶν ἀδελφῶν μου
  choice: मेरे भाइयों के बेटे
  rationale: ग्रीक संबंध-वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: διὰ Ἰωσήφ
  choice: यूसुफ के कारण
  rationale: διά के कारणवाचक अर्थ को बनाए रखता है; स्रोत यह स्पष्ट नहीं करता कि यूसुफ किस अर्थ में कारण था।
- source_word: ἔλεος
  choice: दया
  rationale: करुणामय व्यवहार के सामान्य नैतिक अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: ἐν σπλάγχνοις αὐτῶν
  choice: अपने अंतःकरण में
  rationale: शाब्दिक रूप से ‘अपने भीतर के अंगों में’; प्राचीन भावात्मक मुहावरे को आधुनिक, dignified हिन्दी में प्रस्तुत करता है और आंतरिक करुणा का भाव बनाए रखता है।
- source_word: ἄνοσοι διεφυλάχθησαν
  choice: बीमारी से बचे रहे
  rationale: रोगरहित सुरक्षित रखे जाने के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूसुफ और बीमारी/मृत्यु के बीच कारण-संबंध
  choice: ‘यूसुफ के कारण’ कहकर संबंध को अस्पष्ट ही रखा गया
  alternative: ‘यूसुफ के साथ किए गए व्यवहार के कारण’
  rationale: विस्तृत विकल्प संभावित आशय समझाता है, पर ग्रीक पाठ में निहित अस्पष्टता को अनावश्यक रूप से सुलझा देता।
- issue: दया का आंतरिक स्थान
  choice: ‘अपने अंतःकरण में’
  alternative: ‘अपने हृदयों में’ अथवा ‘अपनी अंतड़ियों में’
  rationale: ‘हृदय’ अधिक परिचित है पर σπλάγχνα की देहगत छवि को सामान्यीकृत करता है; ‘अंतड़ियाँ’ अत्यधिक शाब्दिक और आधुनिक हिन्दी में अप्राकृतिक है। ‘अंतःकरण’ भीतरी भाव-जगत को गरिमापूर्ण ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। कारणवाचक पुनरावृत्ति (‘क्योंकि… क्योंकि…’) मूल ग्रीक की तर्क-रचना बनाए रखने के लिए रखी गई है।
