source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/014.yaml
  text: And now, my children, I command you to keep the commandments of the Lord, and to show mercy to your neighbor, and to have compassion toward all, not only toward people but also toward unreasoning animals.
translation:
  language: hi
  text: और अब, मेरे बच्चों, मैं तुम्हें आदेश देता हूँ कि प्रभु की आज्ञाओं का पालन करो, अपने पड़ोसी के प्रति दया करो, और सबके प्रति करुणा रखो—न केवल मनुष्यों के प्रति, बल्कि विवेकहीन प्राणियों के प्रति भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: प्रभु की आज्ञाओं का पालन करो
  rationale: φυλάσσειν का मूल भाव ‘सुरक्षित रखना/मानना’ है; आज्ञाओं के संदर्भ में आधुनिक हिन्दी में ‘पालन करना’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  choice: अपने पड़ोसी पर दया करो
  rationale: यह पदबंध दया का व्यवहार करने को कहता है। ‘पड़ोसी’ πλησίον के संबंधपरक अर्थ को सीधे बनाए रखता है।
- source_word: εὐσπλαγχνίαν ἔχειν πρὸς πάντας
  choice: सबके प्रति करुणा रखो
  rationale: εὐσπλαγχνία गहरी अंतःकरणजन्य करुणा का बोध कराता है; ‘करुणा रखना’ हिन्दी में स्वाभाविक है और ἔχειν को भी व्यक्त करता है।
- source_word: ἀλόγοις ζώοις
  choice: विवेकहीन प्राणियों
  rationale: ἀλόγοις का आशय तर्क या वाणी से रहित है और ζώοις जीवित प्राणियों को दर्शाता है। ‘विवेकहीन प्राणी’ इस भेद को बनाए रखता है, जबकि केवल ‘पशु’ स्रोत की अभिव्यक्ति को कुछ संकुचित कर देता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। तीन समानांतर आदेशों को स्पष्ट रखा गया है। अंतिम विरोध—मनुष्यों तक सीमित नहीं, बल्कि अन्य जीवित प्राणियों तक भी—को दीर्घ विराम के द्वारा उभारा गया है।
