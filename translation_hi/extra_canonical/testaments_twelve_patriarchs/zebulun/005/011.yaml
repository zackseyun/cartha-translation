  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/011.yaml
  text: And Simeon took the tunic and did not want to give it up. For he wanted to cut him down with the sword, being angry because he had not killed him.
translation:
  language: hi
  text: और शिमोन ने कुरता ले लिया और उसे सौंप देना नहीं चाहता था। वह उसे तलवार से काट डालना चाहता था, क्योंकि वह इस बात पर क्रोधित था कि उसने उसे मार नहीं डाला था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ अंतिम उपवाक्य में यह स्पष्ट करने के लिए व्यक्तियों के नाम नहीं देता कि किसने किसे नहीं मारा था।
    reason: मूल पाठ में सर्वनामों के संदर्भ की वास्तविक अस्पष्टता को बनाए रखना।
lexical_decisions:
- source_word: χιτών
  choice: अंगरखा
  rationale: यह उस पहने जाने वाले वस्त्र के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है जिसे शिमोन ने लिया था।
- source_word: ῥομφαία
  choice: तलवार
  rationale: स्रोत में बड़े धारदार हथियार का सामान्य बोध है; आधुनिक पाठक के लिए ‘तलवार’ स्पष्ट और उपयुक्त है।
- source_word: κατακόψαι
  choice: काट डालना
  rationale: यह साधारण ‘काटना’ से अधिक प्रबल क्रिया है और हिंसक, घातक आशय को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: οὐκ ἤθελε δοῦναι αὐτόν
  choice: उसे देना नहीं चाहा
  rationale: वस्त्र को सौंपने से इनकार का अर्थ सीधे व्यक्त होता है; ‘छोड़ना’ जोड़ने से स्रोत से अधिक व्याख्या हो सकती थी।
theological_decisions:
- issue: अंतिम उपवाक्य में सर्वनामों के संदर्भ
  choice: ‘उसने उसे मार नहीं डाला था’ के रूप में अस्पष्टता बनाए रखी गई
  alternative: व्यक्तियों के नाम जोड़कर कर्ता और कर्म स्पष्ट करना
  rationale: यूनानी पाठ में कर्ता और कर्म के नाम स्पष्ट रूप से नहीं दिए गए; नाम जोड़ना व्याख्यात्मक निर्णय होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य-विन्यास सरल, स्वाभाविक और गरिमापूर्ण रखा गया है। ‘अंगरखा’ और ‘तलवार’ सामान्य बाइबलीय प्रसंग में सहज हैं, जबकि अंतिम वाक्य में मूल की अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
