id: T12P.ZEB.5.15
reference: Testament of Zebulun 5:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Διὰ γὰρ ταῦτα εὐλόγησέ με ὁ¹¹ Κύριος, *καὶ πάντων¹² τῶν ἀδελφῶν μου ἀσθενούντων ἐγὼ ἄνοσος παρῆλθον¹³. οἶδε¹⁴ γὰρ¹⁵ Κύριος ἑκάστου τὴν προαίρεσιν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/015.yaml
  text: For because of these things the Lord blessed me, and when all my brothers were ill, I passed through unharmed. For the Lord knows each person’s intention.
translation:
  language: hi
  text: क्योंकि इन्हीं बातों के कारण प्रभु ने मुझे आशीष दी; और जब मेरे सभी भाई बीमार थे, तब मैं रोग से बचा रहा। क्योंकि प्रभु हर व्यक्ति की मंशा जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλόγησέ
  choice: आशीष दी
  rationale: यूनानी क्रिया का स्वाभाविक और धार्मिक संदर्भ के अनुकूल हिन्दी रूप।
- source_word: ἀσθενούντων
  choice: बीमार थे
  rationale: यहाँ शारीरिक दुर्बलता अथवा बीमारी का संकेत है; प्रसंग में ‘बीमार थे’ सहज और स्पष्ट है।
- source_word: ἄνοσος παρῆλθον
  choice: रोग से बचा रहा
  rationale: ἄνοσος का अर्थ ‘रोगरहित’ है और παρῆλθον परिस्थिति से सकुशल निकलने का भाव दे सकता है; संयुक्त रूप मूल अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προαίρεσιν
  choice: मंशा
  rationale: यह व्यक्ति के जान-बूझकर किए गए चुनाव, अभिप्राय या नैतिक इरादे को सूचित करता है; ‘मंशा’ इस अर्थ को संक्षेप में सुरक्षित रखती है।
theological_decisions:
- issue: आशीष और आचरण के बीच कारण-संबंध
  choice: ‘इन्हीं बातों के कारण’ कहकर स्पष्ट कारण-संबंध बनाए रखा गया।
  alternative: इसे केवल समय-संबंध या सामान्य निष्कर्ष की तरह अनूदित करना।
  rationale: Διὰ γὰρ ταῦτα स्पष्टतः पूर्ववर्ती बातों को आशीष का कारण बताता है; अनुवाद इसे न तो कम करता है, न कोई अतिरिक्त सिद्धांत जोड़ता है।
- issue: प्रभु द्वारा मनुष्य की προαίρεσις को जानना
  choice: ‘हर व्यक्ति की मंशा जानता है’
  alternative: ‘हर व्यक्ति का उद्देश्य/चुनाव जानता है’
  rationale: मूल में नैतिक अभिप्राय और सचेत प्रवृत्ति का तनाव है; ‘मंशा’ इसे किसी विशेष मतवादी अर्थ में सीमित किए बिना व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘प्रभु’ और ‘आशीष’ धार्मिक साहित्य में परिचित हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है।
