base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/018.yaml
  text: And when I was in the land of Canaan, by the seashore, I used to catch prey[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].
translation:
  language: hi
  text: और जब मैं कनान देश में समुद्र-तट पर था, तब मैं अपने पिता याकूब के लिए शिकार पकड़ा करता था[a]; और जब बहुत-से लोगों का समुद्र में दम घुट रहा था, तब मैं सकुशल बना रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘मैं शिकार का शिकार करता था’ है; समुद्र-तट का प्रसंग मछली या अन्य समुद्री जीव पकड़ने का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: अनुवाद यहाँ दिए गए यूनानी स्रोत-अंश के अंत पर समाप्त होता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐθήρευον θήραν
  choice: शिकार पकड़ा करता था
  rationale: यूनानी में सजातीय क्रिया और संज्ञा का शाब्दिक भाव ‘शिकार का शिकार करता था’ है। स्वाभाविक हिन्दी में ‘शिकार पकड़ा करता था’ उस व्यापक अर्थ को बनाए रखता है; समुद्र-तट का प्रसंग मछली या समुद्री जीव पकड़ने की ओर संकेत करता है, पर मूल पाठ उसे स्पष्ट नहीं करता।
- source_word: πολλῶν ἀγχομένων ἐν τῇ θαλάσσῃ
  choice: बहुत-से लोग समुद्र में दम घुटने से मर रहे थे
  rationale: ἀγχομένων का मूल भाव गला घुटने/दम घुटने का है। समुद्र के प्रसंग में केवल ‘डूब रहे थे’ कहना अर्थ को अधिक विशिष्ट बना देता; हिन्दी में पूर्ण घटनार्थ स्पष्ट करने के लिए ‘दम घुटने से मर रहे थे’ रखा गया है।
- source_word: ἀβλαβὴς διέμενον
  choice: मैं बिना हानि के बचा रहा
  rationale: ἀβλαβής ‘अहानिकर/बिना चोट या हानि’ और διαμένω ‘बना रहना, टिके रहना’ व्यक्त करता है। यह अनुवाद सकुशल बने रहने का अर्थ देता है, बिना किसी चमत्कारिक कारण को जोड़े।
