  text: But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.”
translation:
  language: hi
  text: लेकिन हम सब उठ खड़े हुए और उससे कहा, “यदि तू वह कुरता नहीं देगा, तो हम अपने पिता से कह देंगे कि इस्राएल में यह बुरा काम तूने अकेले किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: उठ खड़े हुए
  rationale: यह यूनानी कृदन्त केवल शारीरिक रूप से उठने के साथ-साथ दृढ़ होकर सामने आने का भाव भी दे सकता है; यह हिन्दी अभिव्यक्ति दोनों संभावनाएँ बनाए रखती है।
- source_word: χιτῶνα
  choice: कुरता
  rationale: χιτών शरीर पर पहना जाने वाला अंदरूनी या निकटवर्ती वस्त्र था। आधुनिक सामान्य हिन्दी में ‘कुरता’ सहज है और अनावश्यक रूप से किसी विशिष्ट पारंपरिक परिधान का संकेत नहीं देता।
- source_word: τὸ πονηρὸν τοῦτο
  choice: यह बुरा काम
  rationale: नपुंसकलिंग विशेषण का संज्ञात्मक प्रयोग किसी दुष्कर्म या बुरी बात को दर्शाता है; ‘बुरा काम’ प्रसंग में स्वाभाविक और अर्थ-संगत है।
- source_word: μόνος
  choice: अकेले
  rationale: यह शब्द दोष केवल उसी पर डालने की भाइयों की धमकी को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: ‘इस्राएल में’ का आशय
  choice: इस्राएल में
  alternative: इस्राएल के विरुद्ध / इस्राएल के बीच
  rationale: यूनानी ἐν Ἰσραήλ को उसके सीधे और जानबूझकर अस्पष्ट रूप में रखा गया है; इसे किसी व्यक्ति, परिवार या समुदाय के रूप में निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भाइयों की सीधी धमकी दिखाने के लिए संवाद में ‘तू’ और ‘कह देंगे’ का प्रयोग किया गया है। मूल पाठ में कोई आवश्यक पाठालोचनात्मक या अर्थ-स्पष्टीकरण संबंधी पाद-टिप्पणी नहीं जोड़ी गई।
