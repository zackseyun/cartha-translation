base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/001.yaml
  text: And they said to Jacob, “Recognize, then, whether this is your son’s tunic[a].” And they did so.
translation:
  language: hi
  text: और उन्होंने याकूब से कहा, “पहचानिए, क्या यह आपके पुत्र का कुरता[a] है?” और उन्होंने ऐसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंगरखा” अथवा “चोगा”; यूनानी χιτών के लिए “कुरता” अधिक विशिष्ट अर्थ व्यक्त करने हेतु चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίγνωθι
  choice: पहचानिए
  rationale: ग्रीक आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; वस्त्र देखकर पहचान करने का भाव सुरक्षित रहता है।
- source_word: χιτών
  choice: कुरता
  rationale: यह शरीर पर पहने जाने वाले अंतर्वस्त्र अथवा लंबी कमीज़-जैसे परिधान को दर्शाता है; आधुनिक पाठक के लिए ‘कुरता’ सहज है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: καὶ ἐποίησαν οὕτως
  choice: और उन्होंने ऐसा ही किया
  rationale: ग्रीक वाक्यांश की संक्षिप्तता तथा संदर्भगत अस्पष्टता को बिना विस्तार किए बनाए रखता है।
