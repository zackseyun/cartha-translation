  text: And I wept together with Joseph, and my heart thundered, and the joints of my body trembled, and I had no strength.
translation:
  language: hi
  text: और मैं यूसुफ़ के साथ रो रहा था; मेरा हृदय गरज रहा था, मेरे शरीर के जोड़ काँप रहे थे, और मैं खड़ा नहीं हो पा रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον ... σὺν τῷ Ἰωσήφ
  choice: मैं यूसुफ़ के साथ रोया
  rationale: क्रिया के अपूर्ण भूतकाल और σύν के साथ होने के भाव को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: ἐβόμβει ἡ καρδία μου
  choice: मेरा हृदय गरज उठा
  rationale: ἐβόμβει हृदय के भीतर गूँजने, गड़गड़ाने या तीव्र धड़कन जैसी ध्वनि का सशक्त चित्र देता है; ‘गरज उठा’ स्रोत की रूपकात्मक तीव्रता बनाए रखता है।
- source_word: οἱ ἁρμοὶ τοῦ σώματός μου ἔτρεμον
  choice: मेरे शरीर के जोड़ काँपने लगे
  rationale: ἁρμοί का सीधा अर्थ शरीर के जोड़ है और ἔτρεμον के निरंतर/आरंभित कंपन को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: οὐκ ἠδυνάμην στῆναι
  choice: मैं खड़ा न रह सका
  rationale: यूनानी वाक्यांश का अर्थ खड़े होने या खड़ा रह पाने की असमर्थता है; यह अनुवाद अंग्रेज़ी परत के सामान्यीकृत ‘मेरे पास शक्ति न थी’ की अपेक्षा मूल के अधिक निकट है।
