review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the epistemic force of Οὐκ ἔγνων and the exception introduced by παρεκτὸς. However, its relative-clause formulation (“ऐसा कोई पाप ... जो मैंने ... किया हो”) weakens the source's direct statement that the speaker did not know that he had sinned, and “मन के इरादे में” is grammatically awkward and overly narrows ἐννοία toward intention.
  naturalness: The wording is broadly understandable, but “मन के इरादे में” is not idiomatic modern standard Hindi. A direct past-tense formulation is smoother and more faithful to the Greek narrative context.
  terminology: “पाप” is appropriate for ἥμαρτον. “मन में” provides a natural, suitably broad rendering of ἐννοίας, which can denote thought, understanding, or intention; it avoids resolving that lexical range too narrowly.
  issues:
  - severity: medium
    issue: The construction “मुझे ऐसा कोई पाप मालूम नहीं जो मैंने ... किया हो” is less direct than the Greek.
    rationale: Οὐκ ἔγνων ὅτι ἥμαρτον says literally that the speaker did not know that he had sinned. “मुझे मालूम नहीं था कि मैंने ... पाप किया था” retains both the knowledge claim and the past orientation without recasting it as an indefinite-past relative clause.
  - severity: medium
    issue: “मन के इरादे में” is awkward and semantically restrictive.
    rationale: ἐννοία has a broader mental sense than only ‘इरादा.’ “मन में” is idiomatic and preserves ambiguity between thought and intention.
  revised_text: और मुझे मालूम नहीं था कि मैंने अपने जीवन में पाप किया था, सिवाय मन में।
  revised_footnotes: []
  revision_rationale: The revision directly reflects the Greek knowledge verb and past sinning, retains the exception, and uses idiomatic Hindi while leaving ἐννοίας broad rather than imposing a specific psychological or theological sense.
