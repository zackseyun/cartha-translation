translation:
  language: hi
  text: और मुझे मालूम नहीं था कि मैंने अपने जीवन में पाप किया था, सिवाय मन में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔγνων
  choice: मुझे ऐसा कोई ... मालूम नहीं
  rationale: यूनानी का शाब्दिक अर्थ ‘मैंने नहीं जाना’ है; आत्मपरीक्षण के इस संदर्भ में आधुनिक हिन्दी का यह प्रयोग स्वाभाविक रूप से बताता है कि वक्ता को अपने किए किसी पाप का ज्ञान नहीं था।
- source_word: ἐν ταῖς ἡμέραις μου
  choice: अपने जीवन में
  rationale: शाब्दिक ‘अपने दिनों में’ के आशय को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρεκτὸς ἐννοίας
  choice: सिवाय मन के इरादे में
  rationale: παρεκτός अपवाद दर्शाता है और ἔννοια मन की सोच, अभिप्राय या इरादे को सूचित कर सकता है। ‘मन के इरादे’ से बाहरी कर्म और आंतरिक आशय का तनाव बनाए रखा गया है।
theological_decisions:
- issue: क्या कथन पूर्ण निष्पापता का दावा करता है या ज्ञात पाप का अभाव बताता है
  choice: ‘मुझे ... मालूम नहीं’ द्वारा ज्ञान-सम्बन्धी सीमा बनाए रखी गई
  alternative: ‘मैंने कोई पाप नहीं किया’
  rationale: Οὐκ ἔγνων सीधे पाप न करने के बजाय पाप का ज्ञान न होने की बात कहता है; इसे निरपेक्ष निष्पापता के दावे में बदलना उचित नहीं।
- issue: ἔννοια का अर्थ
  choice: ‘मन के इरादे’
  alternative: ‘विचार’ या ‘मन में’
  rationale: शब्द विचार और अभिप्राय दोनों की ओर संकेत कर सकता है। चुना हुआ रूप आंतरिक मानसिक आशय को व्यक्त करता है, बिना किसी विशिष्ट धार्मिक व्याख्या को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रथम-पुरुष आत्मकथात्मक स्वर, सहज पर गरिमापूर्ण भाषा। मूल की कुछ असामान्य अभिव्यक्ति को स्पष्ट किया गया है, पर ज्ञात पाप और मानसिक इरादे के बीच का तनाव सुरक्षित रखा गया है।
