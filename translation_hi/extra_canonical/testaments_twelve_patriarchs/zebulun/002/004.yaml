language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Οὐ²⁷ μνήσκομαι²⁸ ὅτι παρανομίαν ἐποίησα, πλὴν τὴν ἄγνοιαν ἣν ἐποίησα²⁹ ἐπὶ τοῦ³⁰ Ἰωσήφ, ὅτι ἐβεβαίωσα³¹ τοῖς ἀδελφοῖς μου³² *μὴ εἰπεῖν³³ *τῷ πατρί μου³⁴ τὸ γενόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/004.yaml
  text: I do not remember that I committed lawlessness, except for the ignorance that I committed concerning Joseph, in that I assured my brothers not to tell my father what had happened.
translation:
  language: hi
  text: मुझे याद नहीं कि मैंने व्यवस्था का उल्लंघन किया हो, सिवाय उस काम के जो मैंने यूसुफ के विषय में अज्ञान में किया था—जब मैंने अपने भाइयों को दृढ़तापूर्वक समझाया कि वे मेरे पिता को न बताएँ कि क्या हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομίαν
  choice: व्यवस्था का उल्लंघन
  rationale: शब्द का मूल भाव स्थापित व्यवस्था या नियम के विरुद्ध किए गए अपराध का है; यह आधुनिक हिन्दी में स्वाभाविक रहते हुए ‘अधर्म’ से अधिक विशिष्ट है।
- source_word: ἄγνοιαν ἣν ἐποίησα
  choice: उस अज्ञानतापूर्ण काम के जो मैंने ... किया था
  rationale: ἄγνοια सामान्यतः अज्ञान या अनभिज्ञता है, जबकि ἐποίησα के साथ शाब्दिक ‘अज्ञान किया’ हिन्दी में अस्वाभाविक है। यह रूप मूल की असामान्य अभिव्यक्ति और दोषपूर्ण कार्य—दोनों को यथासंभव बनाए रखता है।
- source_word: ἐπὶ τοῦ Ἰωσήφ
  choice: यूसुफ के विषय में
  rationale: ἐπί के यहाँ प्रसंग-संबंधी अर्थ को तटस्थ रखा गया है; ‘यूसुफ के विरुद्ध’ कहने से मूल की अपेक्षा अधिक शत्रुतापूर्ण अर्थ निश्चित हो सकता था।
- source_word: ἐβεβαίωσα τοῖς ἀδελφοῖς μου
  choice: मैंने अपने भाइयों को दृढ़ किया
  rationale: βεβαιόω का अर्थ दृढ़ या सुनिश्चित करना है। वाक्य-विन्यास कुछ असामान्य है, इसलिए अनुवाद भी इसे पूरी तरह किसी अधिक विशिष्ट अर्थ, जैसे शपथ दिलाना या वचन देना, में नहीं बदलता।
- source_word: τὸ γενόμενον
  choice: कि क्या हुआ था
  rationale: कृदंत का स्वाभाविक हिन्दी रूप, जो घटना का विवरण जोड़े बिना मूल की सामान्यता बनाए रखता है।
theological_decisions:
- issue: वक्ता के अपराध की प्रकृति
  choice: ‘अज्ञानतापूर्ण काम’ कहकर ἄγνοια को नैतिक दोष से जुड़ा रखा गया
  alternative: ‘अनजाने में हुई भूल’ या केवल ‘अज्ञान’
  rationale: मूल में वही क्रिया ἐποίησα अपराध और ἄγνοια दोनों के साथ आती है। ‘अनजाने में हुई भूल’ निर्दोषता को आवश्यकता से अधिक स्पष्ट कर देती, जबकि केवल ‘अज्ञान किया’ हिन्दी में दुर्बोध होता।
- issue: भाइयों के साथ सहमति का स्वरूप
  choice: ‘भाइयों को दृढ़ किया’
  alternative: ‘भाइयों को शपथ दिलाई’, ‘भाइयों को आश्वासन दिया’, या ‘भाइयों के साथ पक्का किया’
  rationale: पाठ यह स्पष्ट नहीं करता कि औपचारिक शपथ हुई, आदेश दिया गया, या परस्पर समझौता हुआ। इसलिए किसी एक विशिष्ट धार्मिक या कानूनी रूप को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘व्यवस्था का उल्लंघन’ और ‘अज्ञानतापूर्ण काम’ मूल के नैतिक शब्दों को बनाए रखते हैं; अंतिम उपवाक्य में ग्रीक की वास्तविक वाक्यगत अस्पष्टता को अत्यधिक स्पष्ट नहीं किया गया है।
