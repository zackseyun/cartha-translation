revisions:
- from: मुझे याद नहीं कि मैंने कभी व्यवस्था का उल्लंघन किया हो, सिवाय उस अज्ञानतापूर्ण काम के जो मैंने यूसुफ के विषय में किया था—मैंने अपने भाइयों को दृढ़ किया कि वे मेरे पिता को न बताएँ कि क्या हुआ था।
  to: मुझे याद नहीं कि मैंने व्यवस्था का उल्लंघन किया हो, सिवाय उस काम के जो मैंने यूसुफ के विषय में अज्ञान में किया था—जब मैंने अपने भाइयों को दृढ़तापूर्वक समझाया कि वे मेरे पिता को न बताएँ कि क्या हुआ था।
  rationale: The revision keeps the source’s moral and syntactic contours while using idiomatic modern Hindi. It retains neutrality concerning Joseph and does not specify whether the brothers made an oath, entered an agreement, or were merely instructed. “दृढ़तापूर्वक समझाया” is a natural contextual rendering of the Greek verb without importing a formal legal or religious act.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T23:53:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders παρανομίαν as “व्यवस्था का उल्लंघन” and keeps ἐπὶ τοῦ Ἰωσήφ suitably neutral as “यूसुफ के विषय में.” It also correctly retains the concealment of “what happened.” However, “अज्ञानतापूर्ण काम” shifts the noun ἄγνοια (“ignorance”) somewhat into a separately specified act, and “भाइयों को दृढ़ किया” is not idiomatic Hindi for ἐβεβαίωσα in this construction.
  naturalness: “मैंने अपने भाइयों को दृढ़ किया” is structurally understandable but unnatural in modern standard Hindi. “उन्हें दृढ़तापूर्वक समझाया” provides a natural rendering while retaining the sense of reinforcing or urging them toward nondisclosure. Removing “कभी” avoids adding an explicit “ever” not present in the Greek.
  terminology: “व्यवस्था का उल्लंघन” is an appropriate, nonsectarian rendering of παρανομία. “अज्ञान” should remain visible as the key term for ἄγνοια; “अज्ञान में किया गया काम” expresses the Greek’s unusual repeated “did/committed” wording naturally without defining the precise nature of the ignorance or offense.
  issues:
  - severity: medium
    issue: The phrase “अपने भाइयों को दृढ़ किया” is unnatural Hindi.
    rationale: 'Although it reflects the root sense of βεβαιόω, this collocation is not normal modern Hindi and may obscure the intended force: Zebulun reinforced or strongly urged his brothers not to disclose the event.'
  - severity: low
    issue: “अज्ञानतापूर्ण काम” makes the referent of ἄγνοια more concrete than the Greek noun itself.
    rationale: The Greek calls it “the ignorance” that he did/committed. “अज्ञान में किया गया काम” preserves both the noun’s semantic field and its association with a culpable action.
  - severity: low
    issue: “कभी” is not explicit in the Greek.
    rationale: The Greek says he does not remember that he committed lawlessness; omission of “कभी” adheres more closely without affecting natural Hindi.
  revised_text: मुझे याद नहीं कि मैंने व्यवस्था का उल्लंघन किया हो, सिवाय उस काम के जो मैंने यूसुफ के विषय में अज्ञान में किया था—जब मैंने अपने भाइयों को दृढ़तापूर्वक समझाया कि वे मेरे पिता को न बताएँ कि क्या हुआ था।
