translation:
  language: hi
  text: फिर भी, जब वे उसे मार डालना चाहते थे, तो मैंने आँसू बहाते हुए उनसे विनती की कि वे यह पाप न करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πλὴν
  choice: फिर भी
  rationale: यह पिछले प्रसंग से विरोध या अपवाद का संबंध व्यक्त करता है; आधुनिक हिन्दी में ‘फिर भी’ स्वाभाविक और स्पष्ट है।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: यहाँ क्रिया का अर्थ जान से मार देना है; ‘मार डालना’ सामान्य पाठक के लिए सीधा और सटीक है।
- source_word: μετὰ δακρύων προσεκάλουν
  choice: आँसू बहाते हुए ... विनती की
  rationale: यह वाक्यांश अश्रुओं के साथ गंभीर आग्रह को व्यक्त करता है; हिन्दी में यह संरचना भाव और क्रिया दोनों को स्वाभाविक रूप से बनाए रखती है।
- source_word: μὴ ποιῆσαι τὴν ἁμαρτίαν ταύτην
  choice: कि वे यह पाप न करें
  rationale: यूनानी निषेधात्मक आशय और ‘इस पाप’ की निकट-संदर्भित विशेषता को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
