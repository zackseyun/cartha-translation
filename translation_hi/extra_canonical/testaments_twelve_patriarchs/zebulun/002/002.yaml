revisions:
- from: मैं, जबूलून, अपने माता-पिता के लिए एक अच्छा उपहार बना; क्योंकि जब मेरा जन्म हुआ, तब मेरे पिता की बहुत बढ़ोतरी हुई, और भेड़-बकरियाँ तथा गाय-बैल भी बहुत बढ़े—उस समय जब चितकबरी छड़ियों के बीच उनका भाग था।
