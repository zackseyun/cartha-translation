id: T12P.ZEB.2.2
reference: Testament of Zebulun 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. Ἐγὼ¹⁶ Ζαβουλὼν δόσις ἀγαθὴ¹⁷ γέγονα¹⁸ τοῖς γονεῦσί μου· ἐν γὰρ τῷ τεχθῆναι¹⁹ με, ηὐξήνθη²⁰ ὁ πατήρ μου²¹ σφόδρα καὶ τὰ πρόβατα²² καὶ τὰ βουκόλια, ὅτε²³ *ἐν ταῖς ποικίλαις ῥάβδοις²⁴ εἶχον²⁵ τὸν κλῆρον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/002.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased greatly, and so did the sheep and the cattle, when he had his portion among the variegated rods.
translation:
  language: hi
  text: मैं, जबूलून, अपने माता-पिता के लिए एक अच्छी देन बना; क्योंकि जब मेरा जन्म हुआ, तब मेरे पिता की बहुत वृद्धि हुई, और भेड़ों तथा गो-धन की भी—उस समय जब चितकबरी छड़ियों के बीच उनका हिस्सा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόσις ἀγαθή
  choice: एक अच्छा उपहार
  rationale: यूनानी पद का सीधा और स्वाभाविक अर्थ; जबूलून को माता-पिता के लिए मिली अच्छी देन के रूप में प्रस्तुत करता है।
- source_word: ηὐξήνθη
  choice: बहुत बढ़ोतरी हुई
  rationale: मूल क्रिया के ‘बढ़ना/वृद्धि होना’ अर्थ को बनाए रखता है और केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: τὰ πρόβατα καὶ τὰ βουκόλια
  choice: भेड़-बकरियाँ तथा गाय-बैल
  rationale: सामान्य हिन्दी में पशु-समूहों को सहज रूप से व्यक्त करता है; πρόβατα छोटे पालतू पशुओं और βουκόλια गो-पशुओं के झुंड को सूचित करता है।
- source_word: τὸν κλῆρον
  choice: उनका भाग
  rationale: κλῆρος के हिस्से/भाग के अर्थ को सुरक्षित रखता है, बिना यह तय किए कि यहाँ भूमि, पशुधन या किसी समझौते का हिस्सा अभिप्रेत है।
- source_word: ἐν ταῖς ποικίλαις ῥάβδοις
  choice: चितकबरी छड़ियों के बीच
  rationale: ἐν के स्थानिक भाव और ποικίλαις के चितकबरे/बहुरंगे अर्थ को निकटता से व्यक्त करता है; कथन की असामान्य छवि को सरल बनाकर मिटाता नहीं।
theological_decisions:
- issue: जन्म और याकूब की वृद्धि के बीच संबंध
  choice: ‘क्योंकि जब मेरा जन्म हुआ’ के साथ मूल का कारणात्मक और कालगत संबंध बनाए रखा गया।
  alternative: इसे केवल संयोगसूचक ‘मेरे जन्म के समय’ कहना।
  rationale: γάρ कारणात्मक संबंध देता है, जबकि ἐν τῷ τεχθῆναί με समय भी बताता है; अनुवाद दोनों आयामों को सुरक्षित रखता है।
- issue: चितकबरी छड़ियों और ‘भाग’ का अस्पष्ट संबंध
  choice: ‘छड़ियों के बीच उनका भाग था’ कहकर मूल की संरचना और अस्पष्टता बनाए रखी गई।
  alternative: उत्पत्ति की कथा के आधार पर इसे ‘छड़ियों के द्वारा उन्होंने अपना हिस्सा पाया’ के रूप में स्पष्ट करना।
  rationale: मूल पाठ साधन, स्थान या कथा-संकेत के संबंध को पूरी तरह स्पष्ट नहीं करता; व्याख्यात्मक समाधान थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘मैं, जबूलून’ आत्मपरिचय की मूल शैली बनाए रखता है। पशु-समूहों के लिए प्रचलित युग्म प्रयुक्त हैं और अंतिम वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
