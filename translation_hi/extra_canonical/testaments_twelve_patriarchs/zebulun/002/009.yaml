base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/009.yaml
  text: But even if I have sinned, discipline me with discipline, my brothers; but do not raise your hand in the murder of your brother, for the sake of Jacob your father.”
translation:
  language: hi
  text: “परन्तु यदि मैंने पाप किया भी है, तो मुझे अनुशासन देकर सुधारो, मेरे भाइयो; पर तुम्हारे पिता याकूब के कारण अपने भाई की हत्या करने के लिए हाथ मत उठाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δὲ καὶ ἥμαρτον
  choice: परन्तु यदि मैंने पाप किया भी है
  rationale: καὶ की concessive force को ‘भी’ से रखा गया है और aorist ἥμαρτον को स्वाभाविक पूर्ण भूतकाल में व्यक्त किया गया है।
- source_word: ἐν παιδείᾳ παιδεύσατέ με
  choice: मुझे अनुशासन देकर सुधारो
  rationale: मूल की cognate अभिव्यक्ति अनुशासनात्मक सुधार पर बल देती है। हिन्दी में ‘अनुशासन से अनुशासित करो’ अस्वाभाविक है, इसलिए अर्थ और बल को स्वाभाविक रूप में रखा गया है।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: प्रत्यक्ष संबोधन के लिए आधुनिक मानक हिन्दी का संबोधन-रूप प्रयुक्त है।
- source_word: τὴν δὲ χεῖρα ὑμῶν μὴ ἐνέγκατε ἐν φόνῳ ἀδελφοῦ ὑμῶν
  choice: पर अपने भाई की हत्या करने के लिए हाथ मत उठाओ
  rationale: हाथ को हत्या में लगाने की यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी समतुल्य ‘हाथ उठाना’ है; ‘हत्या करने के लिए’ φόνῳ के स्पष्ट घातक आशय को सुरक्षित रखता है।
- source_word: διὰ Ἰακὼβ τὸν πατέρα ὑμῶν
  choice: अपने पिता याकूब के कारण
  rationale: διά + accusative के कारण/खातिर वाले अर्थ को जानबूझकर व्यापक रखा गया है; यह याकूब के प्रति विचार या उसके कारण रुकने—दोनों भावों को समेट सकता है।
theological_decisions:
- issue: वक्ता के पाप की शर्त और सम्भावना
  choice: यदि मैंने पाप किया भी है
  alternative: भले ही मैंने पाप किया है
  rationale: εἰ δὲ καὶ को निश्चित स्वीकारोक्ति में बदलने के बजाय उसकी शर्तात्मक तथा concessive छाया सुरक्षित रखी गई है।
- issue: भाई के विरुद्ध हिंसा की सीमा
  choice: हत्या करने के लिए हाथ मत उठाओ
  alternative: अपने भाई पर हाथ मत उठाओ
  rationale: φόνῳ विशेष रूप से हत्या/वध को सूचित करता है; केवल सामान्य हिंसा कहना मूल के घातक आशय को कमजोर कर देता।
- issue: याकूब के उल्लेख का प्रेरक संबंध
  choice: अपने पिता याकूब के कारण
  alternative: अपने पिता याकूब की खातिर
  rationale: ‘के कारण’ διά की अस्पष्टता को अपेक्षाकृत अधिक सुरक्षित रखता है और भाव को केवल सम्मान या विनती तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। ‘परन्तु’ और ‘भाइयो’ औपचारिकता बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज है। मूल की धातु-पुनरुक्ति का यांत्रिक अनुकरण न करके ‘अनुशासन देकर सुधारो’ कहा गया है।
