translation:
  language: hi
  text: क्योंकि शिमोन, दान और गाद यूसुफ को मार डालने के लिए यूसुफ के विरुद्ध आए, और वह उनसे आँसू बहाते हुए बात करता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὸν Ἰωσὴφ
  choice: यूसुफ के विरुद्ध
  rationale: ἐπί + कर्मकारक यहाँ शत्रुतापूर्ण दिशा या आक्रमण का भाव देता है; ‘के विरुद्ध’ इसे स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: उसे मार डालने के लिए
  rationale: ἀναιρέω का यहाँ आशय प्राण लेने से है; प्रयोजनसूचक संबंध को ‘के लिए’ से व्यक्त किया गया है।
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती वाणी का संकेत दे सकता है; ‘कहता रहा’ उस पक्ष को सुरक्षित रखता है, जबकि आगे कथन न होने पर भी हिन्दी स्वाभाविक रहती है।
- source_word: μετὰ δακρύων
  choice: आँसू बहाते हुए
  rationale: शाब्दिक ‘आँसुओं के साथ’ की अपेक्षा यह आधुनिक हिन्दी में भाव और परिस्थिति को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἔλεγεν का कर्ता
  choice: ‘वह’ को निकटतम एकवचन पुरुष यूसुफ के रूप में रहने दिया गया
  alternative: कर्ता को किसी अन्य प्रसंगगत व्यक्ति के रूप में स्पष्ट करना
  rationale: यूनानी में कर्ता नाम से दोहराया नहीं गया, पर एकवचन क्रिया और निकटतम एकवचन पुरुषवाचक संदर्भ यूसुफ की ओर संकेत करते हैं; अनावश्यक व्याख्यात्मक नाम जोड़ने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी γάρ को ‘क्योंकि’ से और अपूर्ण भूतकाल को ‘कहता रहा’ से व्यक्त किया गया है।
