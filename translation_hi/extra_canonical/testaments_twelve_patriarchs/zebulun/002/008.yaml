  text: 2. Ἐλεήσατέ με ἀδελφοί μου⁷. οἰκτειρήσατε⁸ σπλάγχνα⁹ Ἰακὼβ τοῦ πατρὸς ἡμῶν¹⁰. Μὴ¹¹ ἐπαγάγετε¹² τὰς χεῖρας ὑμῶν Γτοῦ˥¹³ ἐκχέαι αἷμα ἀθῷον, ὅτι οὐχ ἥμαρτον¹⁴ καὶ πεσὼν εἰς ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/008.yaml
  text: “Have mercy on me, my brothers; have compassion, by the compassion of Jacob our father. Do not bring your hands upon me to shed innocent blood, for I have not sinned against you.”
translation:
  language: hi
  text: “हे मेरे भाइयो, मुझ पर दया करो; हमारे पिता याकूब की ममता पर दया करो। निर्दोष का खून बहाने के लिए मुझ पर हाथ न उठाओ, क्योंकि मैंने तुम्हारे विरुद्ध पाप नहीं किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεήσατέ με
  choice: मुझ पर दया करो
  rationale: प्रत्यक्ष विनती और दया के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἰκτειρήσατε σπλάγχνα Ἰακὼβ τοῦ πατρὸς ἡμῶν
  choice: हमारे पिता याकूब की करुणा का विचार करके मुझ पर तरस खाओ
  rationale: οἰκτειρήσατε की आज्ञार्थक विनती और σπλάγχνα के गहरे करुणाभाव को बनाए रखता है। यूनानी वाक्यांश संक्षिप्त और कुछ असामान्य है; ‘का विचार करके’ उस संबंध को सहज हिन्दी में व्यक्त करता है, बिना उसे किसी संप्रदायगत अर्थ में बाँधे।
- source_word: Μὴ ἐπαγάγετε τὰς χεῖρας ὑμῶν
  choice: मुझ पर हाथ न उठाओ
  rationale: हिंसा के लिए हाथ बढ़ाने के आशय को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है; कर्म का संकेत प्रसंग से स्पष्ट है।
- source_word: ἐκχέαι αἷμα ἀθῷον
  choice: निर्दोष का खून बहाने के लिए
  rationale: ‘निर्दोष खून बहाना’ की तुलना में हिन्दी में व्यक्ति की निर्दोषता अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त होती है।
- source_word: οὐχ ἥμαρτον … εἰς ὑμᾶς
  choice: मैंने तुम्हारे विरुद्ध पाप नहीं किया है
  rationale: ἁμαρτάνω εἰς के संबंधसूचक अर्थ को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: याकूब की ‘करुणा’ को विनती का आधार मानने वाले वाक्यांश का अर्थ
  choice: याकूब की करुणा का विचार करके
  alternative: याकूब की अंतड़ियों/हृदय पर तरस खाओ; अथवा याकूब की करुणा के द्वारा
  rationale: σπλάγχνα शाब्दिक रूप से आंतरिक अंग और रूपकतः गहरी करुणा को दर्शाता है। पाठ का व्याकरण असामान्य है, इसलिए अनुवाद करुणा के भाव और याकूब से उसके संबंध को रखता है, पर कोई विशिष्ट धर्मवैज्ञानिक मध्यस्थता आरोपित नहीं करता।
- issue: अंतिम यूनानी खंड καὶ πεσὼν εἰς ὑμᾶς
  choice: मुख्य पाठ में अलग अनुवाद नहीं
  alternative: ‘और तुम्हारे बीच पड़कर/तुम्हारे हाथों में पड़कर’ जैसे पाठ
  rationale: दिया गया पाठ अंतिम खंड में पाठगत या वाक्यगत कठिनाई दर्शाता है, जबकि परामर्श-पाठ इसे ‘तुम्हारे विरुद्ध’ के अर्थ में समेटता है। अस्थिर शब्दों से हिन्दी में अप्रमाणित नया कथन जोड़ने के बजाय निर्विवाद आशय प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘हे मेरे भाइयो’ भावपूर्ण संबोधन को सुरक्षित रखता है; ‘खून बहाना’ सामान्य पाठक के लिए ‘रक्त बहाना’ से अधिक सहज है, जबकि प्रसंग की गंभीरता बनी रहती है।
