translation:
  language: hi
  text: लेकिन मैं यूसुफ़ के कारण बहुत दिनों तक छिपकर रोता रहा। मैं अपने भाइयों से डरता था, क्योंकि उन सबने मिलकर यह तय किया था कि जो कोई इस भेद को प्रकट करे, उसे मार डाला जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν κρυφῇ
  choice: छिपकर
  rationale: यह यूनानी पद गुप्त रूप से किए गए कार्य को दर्शाता है; आधुनिक हिन्दी में ‘छिपकर’ स्वाभाविक और स्पष्ट है।
- source_word: διὰ τὸν Ἰωσήφ
  choice: यूसुफ़ के कारण
  rationale: διά के कारणवाचक अर्थ को सीधे बनाए रखता है और शोक का संबंध यूसुफ़ से जोड़ता है, बिना अधिक व्याख्या किए।
- source_word: τὸ μυστήριον
  choice: इस भेद
  rationale: संदर्भ में किसी गुप्त रखी गई बात का संकेत है; ‘भेद’ dignified और सामान्य हिन्दी है तथा अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἀναιρεθῆναι
  choice: मार डाला जाए
  rationale: यह क्रिया यहाँ प्राण लेने या हत्या किए जाने का सीधा अर्थ देती है; कर्मवाच्य रूप को हिन्दी में सुरक्षित रखा गया है।
