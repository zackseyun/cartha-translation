review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek sequence and relations: private weeping for many days because of Joseph, fear of the brothers, their unanimous agreement, disclosure of the secret, and the threatened killing. The passive force of ἀναιρεθῆναι is preserved in “मार डाला जाए.”'
  naturalness: The wording is generally natural modern standard Hindi. However, beginning a separate sentence with “क्योंकि मैं...” and then placing the reason after a semicolon is syntactically less smooth in Hindi. Joining the fear and its stated reason produces a clearer, idiomatic sentence without altering the source’s logic.
  terminology: “यूसुफ़,” “भेद,” and “मार डाला जाए” are appropriate. “भेद” naturally conveys τὸ μυστήριον here as a concealed matter, without importing a technical religious sense.
  issues:
  - severity: low
    issue: Awkward placement of the causal conjunction in the second sentence
    rationale: Greek γάρ introduces the explanation of the preceding statement, while ὅτι introduces the reason for fear. Hindi is clearer when “क्योंकि” directly connects the fear to the brothers’ agreement.
  revised_text: लेकिन मैं यूसुफ़ के कारण बहुत दिनों तक छिपकर रोता रहा। मैं अपने भाइयों से डरता था, क्योंकि उन सबने मिलकर यह तय किया था कि जो कोई इस भेद को प्रकट करे, उसे मार डाला जाए।
