  to: लेकिन मैं यूसुफ़ के कारण बहुत दिनों तक छिपकर रोता रहा। मैं अपने भाइयों से डरता था, क्योंकि उन सबने मिलकर यह तय किया था कि जो कोई इस भेद को प्रकट करे, उसे मार डाला जाए।
