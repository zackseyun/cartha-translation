  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/010.yaml
  text: And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.
translation:
  language: hi
  text: और जब वह शोक से ये बातें कह रहा था, तब मैं उसका विलाप सह न सका और रोने लगा; मेरा कलेजा बह निकला, और मेरे भीतर के अंगों का सारा आधार शिथिल पड़ गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γὀδυρόμενος˥
  choice: शोक से
  rationale: क्रिया के साथ प्रयुक्त यह रूप दुःख और विलाप की अवस्था व्यक्त करता है; आधुनिक हिन्दी में सहज और गरिमापूर्ण अभिव्यक्ति।
- source_word: τῶν οἰμωγῶν
  choice: उसका विलाप
  rationale: οἰμωγή तीव्र शोक-ध्वनि या करुण पुकार है। एकवचन सामूहिक हिन्दी संज्ञा ‘विलाप’ मूल भाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: मेरा कलेजा मानो पिघलकर बह गया
  rationale: शाब्दिक चित्र ‘मेरे यकृत बह निकले’ हिन्दी में अस्वाभाविक और शरीर-विच्छेदन जैसा लगेगा। ‘कलेजा’ आंतरिक भाव-केन्द्र का स्वाभाविक हिन्दी समतुल्य है; ‘मानो’ रूपक को स्पष्ट रखते हुए चित्र की तीव्रता बचाता है।
- source_word: πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου
  choice: मेरे भीतर का सारा बल
  rationale: ὑπόστασις यहाँ भीतरी अंगों की ठोस सत्ता, आधार या सामर्थ्य का संकेत दे सकता है। ‘भीतर का सारा बल’ शारीरिक-भावात्मक ढहाव को सहज हिन्दी में रखता है, बिना दार्शनिक अर्थ आरोपित किए।
- source_word: ἐχαυνοῦτο
  choice: ढीला पड़ गया
  rationale: शब्द के शिथिल, दुर्बल या निढाल हो जाने के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
