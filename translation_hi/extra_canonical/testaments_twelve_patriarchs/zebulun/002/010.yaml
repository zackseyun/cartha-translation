  text: 4. Ὡς δὲ ἔλεγεν Γὀδυρόμενος˥²⁰ τὰ *ῥήματα ταῦτα²¹, *μὴ φέρων ἐγὼ τῶν οἰμωγῶν²² Γἠρξάμην κλαίειν˥, καὶ τὰ ἤπατά μου ἐξεχύθησαν²³, καὶ πᾶσα²⁴ ἡ ὑπόστασις²⁵ τῶν σπλάγχνων μου ἐχαυνοῦτο²⁶.
