  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/001.yaml
  text: Therefore pay attention to the waters, and understand that when they flow together to the same place, they carry down stones, wood, earth, and various other things.
translation:
  language: hi
  text: इसलिए जलधाराओं पर ध्यान दो, और समझो कि जब वे एक ही स्थान पर साथ बहती हैं, तो पत्थर, लकड़ी, मिट्टी और कई दूसरी वस्तुएँ भी बहाकर ले जाती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε ... ἐπὶ τὰ ὕδατα
  choice: जलधाराओं पर ध्यान दो
  rationale: बहुवचन ὕδατα को प्रसंगानुकूल गतिशील जलराशियों/धाराओं के रूप में व्यक्त किया गया है; ‘ध्यान दो’ προσέχετε की सीधी और स्वाभाविक आज्ञा है।
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: एक ही स्थान पर साथ बहती हैं
  rationale: πορεύονται का मूल अर्थ ‘जाती हैं’ है, पर जल के संदर्भ में ‘बहती हैं’ स्वाभाविक है; ἐπὶ τὸ αὐτό धाराओं के एक स्थान पर मिलने या अभिसरण करने का भाव रखता है।
- source_word: κατασύρουσιν
  choice: बहाकर ले जाती हैं
  rationale: क्रिया नीचे की ओर घसीटकर ले जाने का संकेत दे सकती है; हिंदी में जल के साथ ‘बहाकर ले जाना’ अर्थ को सहज और पर्याप्त रूप से व्यक्त करता है।
- source_word: λίθους, ξύλα, γῆν καὶ ἕτερά τινα
  choice: पत्थर, लकड़ी, मिट्टी और कई दूसरी वस्तुएँ भी
  rationale: सूची को सीधे रखा गया है; ἕτερά τινα की अनिश्चित विविधता को ‘कई दूसरी वस्तुएँ’ और καί को ‘भी’ से व्यक्त किया गया है।
