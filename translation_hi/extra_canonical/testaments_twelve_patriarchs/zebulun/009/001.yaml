  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और चित्रात्मक शैली। पद में कोई स्पष्ट धर्मवैज्ञानिक विवाद नहीं है; जलधाराओं के अभिसरण और उनके द्वारा वस्तुओं को बहा ले जाने की प्राकृतिक उपमा को बिना अतिरिक्त व्याख्या के रखा गया है।
