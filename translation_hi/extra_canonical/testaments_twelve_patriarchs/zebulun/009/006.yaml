translation:
  language: hi
  text: और तुम्हारे शत्रु तुम्हें बंदी बनाकर ले जाएँगे, और तुम जाति-जाति के बीच बहुत-सी दुर्बलताओं और विपत्तियों से पीड़ित किए जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωτεύσουσιν
  choice: बंदी बनाकर ले जाएँगे
  rationale: यह क्रिया युद्धबंदी बनाने और बंधुआई में ले जाने का भाव रखती है; इस संयुक्त अभिव्यक्ति से दोनों पहलू स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: ἐν ἔθνεσιν
  choice: जाति-जाति के बीच
  rationale: बहुवचन ἔθνεσιν के बिखराव-सूचक भाव को आधुनिक, सहज हिन्दी में व्यक्त करता है; केवल किसी एक राष्ट्र का संकेत नहीं देता।
- source_word: ἀσθενείαις
  choice: दुर्बलताओं
  rationale: मूल शब्द का व्यापक अर्थ दुर्बलता, अशक्तता या बीमारी हो सकता है; ‘दुर्बलताओं’ मूल की अर्थगत व्यापकता को बनाए रखता है।
- source_word: θλίψεσιν
  choice: विपत्तियों
  rationale: शब्द क्लेश, दबाव और संकट का बोध कराता है; ‘विपत्तियों’ इस प्रसंग में स्वाभाविक तथा पर्याप्त व्यापक है।
- source_word: κακωθήσεσθε
  choice: पीड़ित किए जाओगे
  rationale: भविष्यत् कर्मवाच्य का अर्थ सुरक्षित रहता है और बाहरी अत्याचार या दुर्व्यवहार का संकेत मिलता है।
