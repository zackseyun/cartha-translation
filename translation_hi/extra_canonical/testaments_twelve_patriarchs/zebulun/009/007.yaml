reference: Testament of Zebulun 9:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Καὶ μετὰ ταῦτα μνησθέντες Κύριον †ἐπιστρέψετε³³ καὶ ἐλεήσει³⁴ ὑμᾶς, ὅτι ἐλεήμων ἐστὶ καὶ εὔσπλαγχνος, *καὶ οὐ λογίζεται³⁵ κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων διότι σάρξ εἰσιν καὶ πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/007.yaml
  text: And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go astray in their evil deeds.
translation:
  language: hi
  text: और इन बातों के बाद, जब तुम प्रभु को स्मरण करोगे, तब तुम लौट आओगे, और वह तुम पर दया करेगा; क्योंकि वह दयालु और करुणामय है। वह मनुष्यों के पुत्रों के नाम बुराई नहीं लिखता, क्योंकि वे देह हैं और अपने बुरे कामों में भटक जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησθέντες Κύριον
  choice: जब तुम प्रभु को स्मरण करोगे
  rationale: ग्रीक कृदन्त का समय-सापेक्ष भाव स्वाभाविक हिन्दी उपवाक्य से व्यक्त किया गया है; ‘स्मरण’ गरिमापूर्ण और स्पष्ट है।
- source_word: ἐπιστρέψετε
  choice: तुम लौट आओगे
  rationale: भविष्यकाल और ‘वापस मुड़ने/लौटने’ के मूल अर्थ को रखा गया है, बिना ‘मन फिराना’ जैसी अधिक व्याख्यात्मक धार्मिक शब्दावली थोपे।
- source_word: ἐλεήμων ... καὶ εὔσπλαγχνος
  choice: दयालु और करुणामय
  rationale: दोनों निकटार्थी किन्तु अलग गुणों को हिन्दी में अलग रखा गया है।
- source_word: οὐ λογίζεται κακίαν
  choice: अधर्म का लेखा नहीं रखता
  rationale: λογίζεται के हिसाबी/गिनने के बिंब को बनाए रखते हुए κακία को नैतिक बुराई के अर्थ में ‘अधर्म’ कहा गया है।
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: मनुष्यों के पुत्रों के
  rationale: स्रोत की सामी-प्रभावित अभिव्यक्ति का औपचारिक रूप सुरक्षित रखा गया है।
- source_word: σάρξ εἰσιν
  choice: वे देहधारी हैं
  rationale: शाब्दिक ‘वे मांस हैं’ हिन्दी में अस्वाभाविक है; ‘देहधारी’ मानवीय शारीरिक/दुर्बल दशा का आशय देता है, पर उसे केवल ‘कमज़ोर’ कहकर व्याख्यात्मक रूप से सीमित नहीं करता।
- source_word: πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν
  choice: अपने बुरे कामों में भटक जाते हैं
  rationale: मध्य/कर्मवाच्य πλανῶνται की अस्पष्टता को ‘भटक जाते हैं’ से बनाए रखा गया है और πράξεις को सामान्य, सुबोध ‘काम’ से व्यक्त किया गया है।
theological_decisions:
- issue: ἐπιστρέψετε का धार्मिक आशय
  choice: लौट आओगे
  alternative: मन फिराओगे / पश्चाताप करोगे
  rationale: स्रोत केवल लौटने/मुड़ने की क्रिया कहता है; स्पष्ट पश्चाताप-संबंधी पारिभाषिक शब्द जोड़ना अनावश्यक व्याख्या होती।
- issue: परमेश्वर द्वारा κακία न गिनने का कथन
  choice: अधर्म का लेखा नहीं रखता
  alternative: अधर्म का दोषी नहीं ठहराता / अधर्म को उनके विरुद्ध नहीं गिनता
  rationale: मूल कथन की व्यापकता और धार्मिक तनाव को रखा गया है; न्यायशास्त्रीय अर्थ को न तो बढ़ाया गया, न नरम किया गया।
- issue: σάρξ के कारणसूचक कथन का अर्थ
  choice: क्योंकि वे देहधारी हैं
  alternative: क्योंकि वे दुर्बल मनुष्य हैं
  rationale: ‘दुर्बल’ निहितार्थ हो सकता है, पर स्रोत का ठोस ‘देह/मांस’ शब्द उससे अधिक व्यापक है; इसलिए अपेक्षाकृत स्रोत-समीप रूप चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, साधारण पाठकों के लिए सुबोध रूप। वाक्य-प्रवाह सहज रखने के लिए ग्रीक कृदन्त को कालवाचक उपवाक्य बनाया गया है। किसी फुटनोट की आवश्यकता नहीं समझी गई।
