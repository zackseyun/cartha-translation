source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. ΓΜὴ οὖν˥¹⁵ *χωρισθῆτε ἐν δυσὶ κεφαλαῖς¹⁶. ὅτι πᾶν ὃ ἐποίησεν ὁ¹⁷ Κύριος κεφαλὴν μίαν κέκτηται¹⁸, *καὶ ὤμους δύο, χεῖρας δύο, πόδας δύο καὶ τὰ λοιπὰ μέλη ἅπαντα¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/004.yaml
  text: Therefore do not be divided into two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members.
translation:
  language: hi
  text: इसलिए तुम दो सिरों में न बँटो, क्योंकि प्रभु ने जो कुछ बनाया है, उसका एक ही सिर है, दो कंधे, दो हाथ, दो पैर और बाकी सभी अंग हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: दो सिरों में न बँटो
  rationale: मूल के विभाजन और ‘दो सिरों’ के देह-संबंधी रूपक—दोनों को सुरक्षित रखता है; अगले वाक्य में एक सिर और अन्य अंगों का उल्लेख इसी रूपक को स्पष्ट करता है।
- source_word: πᾶν ὃ ἐποίησεν ὁ Κύριος
  choice: प्रभु ने जो कुछ बनाया है
  rationale: यूनानी नपुंसकलिंग एकवचन की व्यापक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: κεφαλὴν μίαν κέκτηται
  choice: उसका एक ही सिर है
  rationale: κέκτηται के ‘अपने पास रखना/होना’ भाव को सहज हिन्दी में व्यक्त करता है और μίαν के बल को ‘एक ही’ से बनाए रखता है।
- source_word: τὰ λοιπὰ μέλη ἅπαντα
  choice: बाकी सभी अंग
  rationale: μέλη का देह-संदर्भित अर्थ ‘अंग’ है; λοιπά और ἅπαντα की संयुक्त व्यापकता ‘बाकी सभी’ से व्यक्त होती है।
theological_decisions:
- issue: ‘दो सिरों’ के रूपक का अर्थ
  choice: रूपक को शाब्दिक रूप में ‘दो सिरों में न बँटो’ रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘दो अगुओं/दल़ों में न बँटो’ कहा जा सकता था।
  rationale: मूल पाठ ‘सिरों’ के आशय को स्वयं स्पष्ट नहीं करता और तुरंत शारीरिक अंगों की उपमा देता है; इसलिए किसी विशेष कलीसियाई, राजनीतिक या आध्यात्मिक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और रूपक-संरक्षक शैली। ‘तुम’ बहुवचन संबोधन के रूप में स्वाभाविक है; वाक्य-संरचना मूल की कारणसूचक गति को बनाए रखती है।
