  text: For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow after two kingdoms, and you will commit every abomination.
translation:
  language: hi
  text: क्योंकि मैंने अपने पूर्वजों के लेखों से यह जाना है कि तुम इस्राएल में विभाजित हो जाओगे, दो राज्यों के पीछे चलोगे और हर घृणित काम करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γραφῇ τῶν πατέρων μου
  choice: अपने पूर्वजों के लेखों से
  rationale: एकवचन γραφῇ यहाँ लिखित सामग्री या ग्रंथ-संग्रह का बोध करा सकता है; स्वाभाविक हिन्दी में ‘लेखों’ से यह अर्थ स्पष्ट होता है और πατέρων को वंशगत संदर्भ में ‘पूर्वजों’ कहा गया है।
- source_word: Διαιρεθήσεσθε ἐν Ἰσραήλ
  choice: तुम इस्राएल में विभाजित हो जाओगे
  rationale: भविष्यकालीन कर्मवाच्य और ἐν Ἰσραήλ की स्थान/समुदायगत अस्पष्टता को निकटता से सुरक्षित रखता है।
- source_word: δύο βασιλείαις ἐξακολουθήσετε
  choice: दो राज्यों के पीछे चलोगे
  rationale: ἐξακολουθέω का आशय किसी के पीछे चलने या उसका अनुसरण करने से है; ‘पीछे चलोगे’ मूल रूपक को बनाए रखता है।
- source_word: πᾶν βδέλυγμα ποιήσετε
  choice: हर प्रकार का घृणित काम करोगे
  rationale: शाब्दिक ‘हर घृणित वस्तु करोगे’ हिन्दी में अस्वाभाविक है; यह रूप βδέλυγμα की नैतिक घृणितता और ποιέω की क्रियात्मकता दोनों व्यक्त करता है।
theological_decisions:
- issue: ‘दो राज्यों’ का आशय
  choice: दो राज्यों
  alternative: दो राजवंशों / दोनों राज्यों
  rationale: मूल βασιλείαις को बिना ऐतिहासिक या सांप्रदायिक पहचान जोड़े सामान्य रूप में रखा गया है।
- issue: βδέλυγμα की धार्मिक-नैतिक तीव्रता
  choice: घृणित काम
  alternative: घोर पाप / अशुद्ध काम
  rationale: ‘घृणित’ मूल शब्द की प्रबल नकारात्मकता रखता है, जबकि ‘पाप’ या ‘अशुद्ध’ जैसी व्याख्यात्मक सीमाएँ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी का गंभीर और गरिमापूर्ण स्वर रखा गया है। वाक्य सामान्य पाठक के लिए सहज है, पर मूल यूनानी की कर्मवाच्यता, क्रम और अर्थगत तनाव यथासंभव सुरक्षित हैं।
