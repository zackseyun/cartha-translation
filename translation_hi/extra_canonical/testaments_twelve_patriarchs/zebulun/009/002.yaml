  text: But if they are divided into many parts, the earth destroys them, and they become easy to despise.
translation:
  language: hi
  text: पर यदि वे बहुत-से भागों में बँट जाएँ, तो पृथ्वी उन्हें मिटा देती है, और वे आसानी से तुच्छ समझे जाने लगते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πολλὰ διαιρεθῶσιν
  choice: बहुत-से भागों में बँट जाएँ
  rationale: बहुवचन πολλὰ को बिना 'धाराएँ' जैसे प्रसंगगत अर्थ जोड़े सामान्य 'भागों' के रूप में रखा गया है; कर्मवाच्य और संभाव्य शर्त भी सुरक्षित हैं।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: γῆ का सीधा और गरिमापूर्ण हिन्दी समतुल्य; इसे अधिक व्याख्यात्मक 'भूमि' या 'मिट्टी' नहीं बनाया गया।
- source_word: ἀφανίζει
  choice: मिटा देती है
  rationale: क्रिया का अर्थ गायब कर देना, नष्ट कर देना या अस्तित्व से हटा देना हो सकता है। 'मिटा देती है' इस अर्थ-परास को स्वाभाविक हिन्दी में व्यक्त करता है, बिना 'निगल लेती है' जैसा चित्र जोड़ने के।
- source_word: γίνονται εὐκαταφρόνητα
  choice: तुच्छ समझे जाने लगते हैं
  rationale: εὐκαταφρόνητα का भाव 'आसानी से तुच्छ समझे जाने योग्य' है। चुना गया रूप हिन्दी में स्वाभाविक है और γίνονται के परिणामी भाव को 'लगते हैं' से व्यक्त करता है।
