source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. Καὶ μετὰ ταῦτα⁴⁵ ἀνατελεῖ⁴⁶ ⌜ὑμῖν⌝ *αὐτὸς ὁ⁴⁷ Κύριος, *φῶς δικαιοσύνης⁴⁸,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/008.yaml
  text: And after these things the Lord himself will rise for you, the light of righteousness.
translation:
  language: hi
  text: और इन बातों के बाद स्वयं प्रभु तुम्हारे लिए उदित होंगे—धार्मिकता का प्रकाश।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यूनानी वाक्यांश के क्रम और संदर्भगत व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνατελεῖ
  choice: उदित होंगे
  rationale: क्रिया का अर्थ प्रकाश या सूर्य के उदय होने का बिंब रखता है; ‘प्रकट होंगे’ की तुलना में मूल रूपक अधिक स्पष्ट रूप से सुरक्षित रहता है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: समुदाय को संबोधित बहुवचन और हितार्थ भाव दोनों को व्यक्त करता है।
- source_word: αὐτὸς ὁ Κύριος
  choice: स्वयं प्रभु
  rationale: αὐτός के बलाघात को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: φῶς δικαιοσύνης
  choice: धार्मिकता का प्रकाश
  rationale: सम्बन्धकारक संरचना की वास्तविक अस्पष्टता बनाए रखता है—यह धार्मिकता से युक्त, धार्मिकता देने वाला, या धार्मिकता प्रकट करने वाला प्रकाश हो सकता है।
theological_decisions:
- issue: ‘प्रभु’ और ‘धार्मिकता का प्रकाश’ का पारस्परिक संबंध
  choice: डैश के द्वारा ‘धार्मिकता का प्रकाश’ को प्रभु का समानाधिकरणात्मक वर्णन रखा गया है।
  alternative: ‘और धार्मिकता का प्रकाश’ को अलग कर्ता या परिणाम मानना।
  rationale: मूल में कोई संयोजक नहीं है और पदबंध स्वाभाविक रूप से ‘प्रभु’ का समानाधिकरण अथवा वर्णन करता है; फिर भी डैश व्याख्या को अत्यधिक कठोर नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। भविष्यकाल में आदरसूचक बहुवचन ‘होंगे’ का प्रयोग ‘प्रभु’ के लिए किया गया है।
