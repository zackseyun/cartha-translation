  text: '1[a]. And when they had done this, they all sat down to eat and drink. But I, seeing that Joseph was grieving, did not eat with them, but I kept watch over the pit, praying for help for him.


    2. And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits which our fathers dug and found no water.”


    3. For this reason the Lord prevented water from springing up in them, so that Joseph might be preserved[b].


    4. And they did so until they sold him to the Ishmaelites.


    5. As for his price, my children, I had no share in it. But Simeon and Dan and Gad, and their sons, took his price and bought sandals for themselves and for their wives and their children,


    6. saying, “We will not eat from it, because it is the price of our brother’s blood; rather, we will trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”


    7. Therefore it is written in the record of the law of Moses: “The man who does not wish to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”


    8. And the brothers of Joseph were not willing to raise up the life of their brother, and the Lord removed from them the sandal which they wore against Joseph their brother.


    9. For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner of those before King Pharaoh.


    10. And not only did they bow down to him, but immediately, as they fell before him, they were also spat upon[c], and they were put to shame by the Egyptians.'
translation:
  language: hi
  text: '1. जब यूसुफ ने देखा कि मैं भी उसके साथ रो रहा हूँ और भाई उसे मार डालने के लिए बढ़े आ रहे हैं, तो वह मेरे पीछे आ छिपा और मुझसे उसकी सहायता करने की विनती करने लगा।


    2. इसी बीच रूबेन उठकर बोला, “आओ, मेरे भाइयो, हम इसे जान से न मारें। इसके बजाय इसे इन सूखे गड्ढों में से किसी एक में डाल दें, जिन्हें हमारे पुरखाओं ने खोदा था, पर उनमें पानी नहीं मिला।”


    3. प्रभु ने इसी कारण उनमें पानी फूटने नहीं दिया था, ताकि यूसुफ की रक्षा हो सके।


    4. उन्होंने ऐसा ही किया और उसे तब तक वहीं रखा, जब तक उन्होंने उसे इश्माएलियों के हाथ बेच नहीं दिया।


    5. मेरे बच्चो, यूसुफ को बेचकर जो दाम मिला, उसमें मेरा कोई हिस्सा नहीं था। पर शिमोन, दान और गाद ने अपने बेटों के साथ मिलकर उसका दाम लिया और उससे अपने लिए, अपनी पत्नियों के लिए और अपने बच्चों के लिए जूतियाँ खरीदीं।


    6. उन्होंने कहा, “हम इससे कुछ नहीं खाएँगे, क्योंकि यह हमारे भाई के खून का दाम है। इसके बजाय हम इसे पैरों तले रौंदेंगे, क्योंकि उसने कहा था कि वह हम पर राज करेगा। तब हम देखेंगे कि उसके सपनों का क्या होता है!”


    7. इसीलिए मूसा की व्यवस्था के लेख में लिखा है: “जो व्यक्ति अपने भाई के लिए वंश चलाना नहीं चाहता, उसकी जूती उतारी जाए और उसके मुँह पर थूका जाए।”[a]


    8. यूसुफ के भाई अपने भाई का जीवन खड़ा करने को तैयार नहीं हुए[b]; इसलिए प्रभु ने उनसे वह जूती उतार दी, जिसे उन्होंने अपने भाई यूसुफ के विरुद्ध पहना था।


    9. क्योंकि जब वे मिस्र आए, तो द्वार के बाहर यूसुफ के सेवकों ने उनकी जूतियाँ उतार दीं। फिर उन्होंने यूसुफ के सामने उसी प्रकार दण्डवत् किया, जैसे राजा फ़िरौन के सामने किया जाता था।


    10. उन्होंने उसके सामने केवल दण्डवत् ही नहीं किया, बल्कि जैसे ही वे उसके आगे गिरे, उसी क्षण उन पर थूका भी गया[c], और मिस्रियों ने उन्हें लज्जित किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह व्यवस्थाविवरण 25:5–10 की ओर संकेत है, जहाँ अपने मृत भाई का वंश चलाने का दायित्व स्वीकार न करने वाले व्यक्ति को जूती उतारने और मुँह पर थूकने के द्वारा सार्वजनिक रूप से लज्जित किया जाता है।
    reason: cross_reference
  - marker: b
    text: यूनानी शब्दावली असामान्य है; इसका शाब्दिक भाव है, “अपने भाई का जीवन खड़ा करना।” लेखक पिछले पद में आए देवर-विवाह संबंधी कानूनी मुहावरे को यहाँ कठोर कानूनी उद्धरण के बजाय नैतिक उपमा के रूप में ढालता हुआ जान पड़ता है।
    reason: lexical_alternative
  - marker: c
    text: कुछ पाठक थूके जाने को व्यवस्था-वचन के प्रतीकात्मक विस्तार के रूप में समझ सकते हैं, न कि अनिवार्यतः एक ऐतिहासिक विवरण के रूप में; फिर भी यूनानी कथानक इसे सीधे घटित घटना के रूप में कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: λάκκων / ξηρῶν λάκκων
  choice: गड्ढों / सूखे गड्ढों
  rationale: संदर्भ में ये पुरखाओं द्वारा खोदे गए ऐसे स्थान हैं जिनमें पानी नहीं मिला। ‘गड्ढे’ यूनानी शब्द की व्यापकता बनाए रखता है; ‘सूखे’ आगे के स्पष्टीकरण से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐκώλυσε ... ἀναβλῦσαι ὕδωρ
  choice: पानी फूटने नहीं दिया
  rationale: यह प्रभु की सक्रिय क्रिया और पानी के फूट निकलने की सजीव छवि दोनों को सहज हिन्दी में रखता है।
- source_word: περιποίησις
  choice: रक्षा हो सके
  rationale: यहाँ आशय गड्ढे में यूसुफ के प्राणों के संरक्षण से है। ‘रक्षा’ दैवी प्रबंध का भाव रखता है, पर व्यापक उद्धार का अतिरिक्त अर्थ नहीं थोपता।
- source_word: τιμή
  choice: दाम
  rationale: संदर्भ यूसुफ को बेचने पर मिले मूल्य का है। ‘दाम’ बोलचाल में स्पष्ट है और ‘खून का दाम’ के नैतिक बल को बनाए रखता है।
- source_word: ὑποδήματα
  choice: जूतियाँ
  rationale: यह सामान्य पादुका के लिए स्वाभाविक आधुनिक हिन्दी है और व्यवस्था-वचन में जूती उतारने की सांस्कृतिक छवि को बनाए रखता है।
- source_word: καταπατήσωμεν
  choice: पैरों तले रौंदेंगे
  rationale: यह क्रिया धन के प्रति तिरस्कार और जूतियों से उसके प्रतीकात्मक संबंध को स्पष्ट रखती है।
- source_word: ἀναστῆσαι σπέρμα
  choice: वंश चलाना
  rationale: शाब्दिक ‘बीज खड़ा करना’ आधुनिक हिन्दी में अस्वाभाविक और अस्पष्ट होता। ‘वंश चलाना’ देवर-विवाह संबंधी कानूनी मुहावरे का अर्थ साधारण पाठक तक पहुँचाता है।
- source_word: ζωὴν ἀδελφοῦ αὐτῶν
  choice: अपने भाई का जीवन खड़ा करने
  rationale: यूनानी पाठ का असामान्य ‘जीवन खड़ा करना’ पिछले पद के कानूनी मुहावरे को नैतिक उपमा में बदलता है। इसे सामान्य ‘वंश चलाना’ में सुधार देने के बजाय इसकी जानबूझकर असहजता बचाई गई है।
- source_word: παῖδες
  choice: सेवकों
  rationale: मिस्री राजकीय परिवेश में यह पद यूसुफ की सेवा करने वालों को दर्शाता है; ‘सेवक’ उनकी भूमिका बताता है, बिना आयु या दास-स्थिति निश्चित किए।
- source_word: προσεκύνησαν
  choice: दण्डवत् किया
  rationale: यह शारीरिक रूप से झुककर सम्मान प्रकट करने की क्रिया को संक्षिप्त और बाइबिलीय हिन्दी में व्यक्त करता है, बिना इसे अनिवार्यतः आराधना बनाने के।
theological_decisions:
- issue: सूखे गड्ढे की दैवी-प्रबंध संबंधी व्याख्या
  choice: प्रभु ने पानी फूटने नहीं दिया ताकि यूसुफ की रक्षा हो सके।
  alternative: गड्ढे का सूखा होना मात्र बाद की नैतिक व्याख्या था।
  rationale: यूनानी पाठ स्पष्ट रूप से प्रभु को कर्ता बनाता है और यूसुफ के संरक्षण को उद्देश्य बताता है; इसलिए दैवी सक्रियता को कमज़ोर नहीं किया गया।
- issue: देवर-विवाह की व्यवस्था का यूसुफ पर नैतिक अनुप्रयोग
  choice: कानूनी उद्धरण को अर्थपूर्ण आधुनिक हिन्दी में रखा, लेकिन अगले पद के असामान्य ‘जीवन खड़ा करने’ को सुरक्षित रखा।
  alternative: दोनों स्थानों पर ‘वंश चलाना’ करके भाषिक तनाव मिटा देना।
  rationale: लेखक यूसुफ की बिक्री को जूती उतारने और सार्वजनिक अपमान की व्यवस्था से उपमात्मक रूप से जोड़ता है। यूनानी प्रयोग अनियमित है; उसे चुपचाप सामान्य करना उचित नहीं।
- issue: यूसुफ के सामने दण्डवत्
  choice: राजकीय सम्मान की शारीरिक क्रिया के रूप में ‘दण्डवत् किया’।
  alternative: ‘आराधना की’, जिससे धार्मिक उपासना का अर्थ आ सकता था।
  rationale: संदर्भ फ़िरौन-सदृश राजकीय सम्मान का है। अनुवाद क्रिया को प्रबल रखता है, पर धार्मिक आराधना का अनावश्यक निष्कर्ष नहीं जोड़ता।
- issue: मिस्र में थूके जाने का वर्णन
  choice: इसे कथानक में प्रत्यक्ष घटना के रूप में अनूदित किया।
  alternative: इसे केवल व्यवस्था-वचन की प्रतीकात्मक प्रतिध्वनि मानना।
  rationale: यूनानी कथन इसे सीधे घटित घटना के रूप में प्रस्तुत करता है, यद्यपि इसका साहित्यिक उद्देश्य पहले उद्धृत व्यवस्था से संबंध बनाना है।
translation_notes:
  register: 'भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘मेरे भाइयो’, ‘मेरे बच्चो’, ‘दण्डवत्’ और ‘व्यवस्था’ जैसे रूप बाइबिलीय वातावरण बनाए रखते हैं। मूल में अध्याय III से पहले जुड़े हुए चार वाक्यों को प्रदत्त इकाई और अंग्रेज़ी परामर्श-पाठ के अनुरूप पद 1–4 तथा अध्याय III के सात पदों को संक्षेपित क्रम में पद 5–10 के रूप में प्रस्तुत किया गया है। आरंभिक यूनानी वाक्य की पाठगत/व्याकरणिक कठिनाई में प्रसंगानुकूल अर्थ चुना गया है: यूसुफ ज़बूलून के पीछे शरण लेता और उससे सहायता माँगता है।'
