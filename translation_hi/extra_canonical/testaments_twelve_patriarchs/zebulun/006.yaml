  text: First[a], then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it. And I fastened a piece of wood behind it[b], and
translation:
  language: hi
  text: तो सबसे पहले मैंने समुद्र में चलने के लिए एक नाव बनाई, क्योंकि प्रभु ने मुझे उसमें समझ और बुद्धि[b] दी। और मैंने उसके पीछे लकड़ी का एक टुकड़ा लगाया, और—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध यूनानी अध्याय-पाठ खंडित है और “और मैंने उसके पीछे लकड़ी का एक टुकड़ा लगाया, और—” के बाद वाक्य के बीच में ही टूट जाता है।
    reason: textual_variant
  - marker: b
    text: यहाँ “बुद्धि” से केवल सैद्धांतिक ज्ञान ही नहीं, बल्कि निर्माण का व्यावहारिक कौशल भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκάφος
  choice: नाव
  rationale: यह समुद्र में चलने वाले जलयान के लिए एक सामान्य शब्द है। ‘नाव’ स्वाभाविक है और जलयान के आकार या प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπιπλέειν
  choice: समुद्र पर चल सके
  rationale: इसका मूल भाव पानी की सतह पर तैरने या आगे बढ़ने का है; बनाई गई नाव के संदर्भ में ‘समुद्र पर चल सके’ उद्देश्यपूर्ण जलयात्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σύνεσιν
  choice: समझ
  rationale: यह σοφία के साथ प्रयुक्त होकर सूझ-बूझ और ग्रहण-क्षमता का भाव देता है; ‘समझ’ सरल और व्यापक हिन्दी समतुल्य है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: ‘बुद्धि’ इसके व्यापक अर्थ को बनाए रखती है, जबकि संदर्भ में निर्माण-कौशल का व्यावहारिक भाव भी संभव है; उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: सर्वनाम के संदर्भ को अधिक स्पष्ट करके मूल की संभावित अस्पष्टता मिटाने के बजाय निकट और संक्षिप्त रूप रखा गया है।
- source_word: καθῆκα
  choice: लगाया
  rationale: नाव बनाने के प्रसंग में यह लकड़ी के भाग को रखने, जोड़ने या लगाने का संकेत देता है; ‘लगाया’ स्वाभाविक है और जोड़ने की सटीक विधि को निश्चित नहीं करता।
- source_word: ξύλον
  choice: लकड़ी का एक टुकड़ा
  rationale: बचा हुआ पाठ यह स्पष्ट नहीं करता कि यह कौन-सा नौकायन-संबंधी भाग था; यह अनुवाद बिना अतिरिक्त अनुमान के मूल के सामान्य अर्थ को रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ शब्द परमेश्वर के लिए प्रयुक्त हुआ है; ‘प्रभु’ आधुनिक हिन्दी बाइबिलीय भाषा में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: तकनीकी योग्यता का दिव्य स्रोत
  choice: प्रभु ने जबूलून को इस कार्य के लिए समझ और बुद्धि दी।
  alternative: ‘बुद्धि’ को केवल नाव बनाने का व्यावहारिक कौशल समझा जा सकता है।
  rationale: मूल पाठ σύνεσις और σοφία दोनों को साथ रखता है। निर्माण का संदर्भ व्यावहारिक कौशल सुझाता है, पर शब्दों का व्यापक बौद्धिक और धार्मिक भाव भी बना रहता है; इसलिए मुख्य पाठ में दोनों आयामों को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘मैंने ही सबसे पहले’ से Πρῶτος और बलसूचक ἐγώ दोनों व्यक्त होते हैं। अंतिम डैश खंडित वाक्य को दिखाता है।
