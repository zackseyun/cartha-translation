base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001.yaml
  text: '1 A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.


    2 And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.


    3 I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.


    4 I do not know that I sinned in my days, except in thought.


    5 I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.


    6 But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.


    7 Yet when they wanted to kill him, with tears I begged them not to commit this sin.'
translation:
  language: hi
  text: '**याकूब और लिआ के छठे पुत्र ज़बूलून की वसीयत[a]**


    **1** ज़बूलून के उन वचनों की प्रतिलिपि, जिनके द्वारा उसने अपनी मृत्यु से पहले अपने पुत्रों को निर्देश दिया। उस समय उसके जीवन का एक सौ चौदहवाँ वर्ष[b] था और यूसुफ़ की मृत्यु के दो वर्ष बीत चुके थे।


    **2** उसने उनसे कहा, “मेरी सुनो।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में शीर्षक के पितृपुरुष के नाम में भिन्नता है; आगे का पाठ स्पष्ट रूप से ज़बूलून को वक्ता बताता है।
    reason: textual_variant
  - marker: b
    text: शीर्षक में दी गई आयु की संख्या अलग-अलग पांडुलिपियों में भिन्न है; यहाँ प्रस्तुत यूनानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
  - marker: c
    text: उपलब्ध कराए गए यूनानी स्रोत-पाठ का अंश यहीं समाप्त होता है; इसलिए आगे के शब्द इस मसौदे में नहीं जोड़े गए हैं।
    reason: source_boundary
lexical_decisions:
- source_word: Διαθήκη
  choice: वसीयत
  rationale: यह पितृपुरुष के मृत्यु-पूर्व उपदेशों के लिए प्रयुक्त ग्रंथ-शीर्षक है; ‘वाचा’ यहाँ संभावित अर्थ होते हुए भी इस साहित्यिक संदर्भ में कम स्वाभाविक है।
- source_word: Ἀντίγραφον λόγων
  choice: वचनों की प्रतिलिपि
  rationale: ἀντίγραφον के लिखित प्रति होने के भाव और λόγων के औपचारिक ‘वचनों’ दोनों को बनाए रखता है।
- source_word: διέθετο
  choice: निर्देश दिया
  rationale: यहाँ क्रिया मृत्यु-पूर्व आदेश या व्यवस्था देने को सूचित करती है; हिंदी में स्वाभाविक रहते हुए उसके वसीयतनुमा बल को व्यक्त करती है।
- source_word: Ἀκούσατέ μου
  choice: मेरी बात सुनो
  rationale: प्रत्यक्ष संबोधन का सहज और गरिमापूर्ण हिंदी रूप; वाक्य उपलब्ध यूनानी पाठ में यहीं कट जाता है।
theological_decisions:
- issue: Διαθήκη का अर्थ
  choice: वसीयत
  alternative: वाचा
  rationale: ग्रंथ की विधा मृत्यु-पूर्व पितृकीय उपदेश है। ‘वसीयत’ इस साहित्यिक अर्थ को स्पष्ट रखती है और अनावश्यक रूप से covenant-संबंधी धार्मिक अर्थ आरोपित नहीं करती।
- issue: मृत्यु-पूर्व निर्देश की क्रिया διέθετο
  choice: अपने पुत्रों को निर्देश दिया
  alternative: अपने पुत्रों के लिए वसीयत की
  rationale: क्रिया के आदेशात्मक और व्यवस्थात्मक अर्थ को रखा गया है, पर हिंदी में संपत्ति-संबंधी कानूनी वसीयत तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। नामों के रूप ‘ज़बूलून’, ‘याकूब’, ‘लिआ’ और ‘यूसुफ़’ रखे गए हैं। उपलब्ध मूल-भाषा पाठ केवल 2 पद के आरंभ तक है, इसलिए अंग्रेज़ी परामर्श-पाठ में उपस्थित आगे की सामग्री को मूल यूनानी साक्ष्य के बिना अनूदित नहीं किया गया।
