  text: 'And you will return to your land, and you will see him in Jerusalem because of his holy name; and healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deceit will be trampled down. And he will turn all the nations to zeal for him, and you will see God in the form of a man, whom the Lord will choose—Jerusalem is his name.


    9. And again, by the craftiness of your deeds you will provoke him to anger, and you will be cast away from him until the time of completion.


    10. And now, my children, do not be grieved because I am dying, nor fall down in sorrow because I am coming to my end. For I will rise again in your midst, as a ruler in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, all who keep the law of the Lord. But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations. But as for me, I now hasten to my rest, as also my fathers did. But you, fear the Lord all the days of your life with all your strength.


    And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.'
translation:
  language: hi
  text: 'और तुम अपने देश लौटोगे और उसके पवित्र नाम के कारण यरूशलेम में उसे देखोगे। उसके पंखों में चंगाई और करुणा होगी। वह स्वयं मनुष्यों की सारी बंधुआई को बेलियार के वश से मुक्त करेगा, और भटकानेवाली हर आत्मा पैरों तले रौंदी जाएगी। वह सभी जातियों को उसके प्रति उत्साह में ले आएगा, और तुम मनुष्य के रूप में परमेश्वर को देखोगे, जिसे प्रभु चुनेगा—उसका नाम यरूशलेम है।[a]


    9 फिर तुम अपने कामों की धूर्तता से उसे क्रोध दिलाओगे और पूर्णता के समय तक उससे दूर कर दिए जाओगे।


    10 अब, मेरे बच्चो, मेरे मरने के कारण दुःखी मत हो और इसलिए शोक से निढाल मत हो कि मेरा अंत आ रहा है। 2 क्योंकि मैं फिर तुम्हारे बीच जी उठूँगा, धार्मिकता की संतानों के बीच एक शासक के रूप में; और मैं अपने गोत्र के उन सब लोगों के बीच आनन्दित होऊँगा जो प्रभु की व्यवस्था का पालन करेंगे।[b] 3 पर दुष्टों पर प्रभु अनन्त आग लाएगा और पीढ़ियों की पीढ़ियों तक उनका नाश करेगा। 4 जहाँ तक मेरी बात है, मैं अब अपने विश्राम की ओर शीघ्रता से जा रहा हूँ, जैसे मेरे पिता भी गए थे। 5 पर तुम अपने जीवन के सारे दिन अपनी पूरी शक्ति से प्रभु का भय मानो।[c]


    6 ये बातें कहने के बाद वह सो गया,[d] और उसके पुत्रों ने उसे लकड़ी के एक ताबूत में रख दिया। 7 बाद में वे उसे ऊपर ले जाकर हेब्रोन में उसके पिता के साथ दफ़ना आए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके पंखों में चंगाई... उसका नाम यरूशलेम है’ वाला अंश कुछ यूनानी पाठ-साक्ष्यों में विस्तृत पाठ के रूप में मिलता है। अंतिम वाक्य का यूनानी पाठ कठिन है और इसका अर्थ यह भी समझा जा सकता है कि प्रभु यरूशलेम को उसके लिए चुनेगा या उसे नाम देगा।
    reason: मुख्य पाठ के बड़े पाठांतर और ‘यरूशलेम’ संबंधी वास्तविक व्याकरणिक अस्पष्टता को बताना आवश्यक है।
  - marker: b
    text: 'कुछ पाठ-साक्ष्य इसके बाद जोड़ते हैं: ‘और अपने पिता जबूलून की आज्ञाओं का।’'
    reason: ग्रीक स्रोत में कोष्ठकित अतिरिक्त पाठ है, जिसे आधार-पाठ में ग्रहण किए बिना पाठक के लिए सुरक्षित रखा गया है।
  - marker: c
    text: 'कुछ पाठ-साक्ष्य अधिक विस्तार से कहते हैं: ‘हमारे परमेश्वर प्रभु का भय अपने जीवन के सारे दिन अपनी पूरी शक्ति से मानना।’'
    reason: पांडुलिपीय विस्तार अर्थ को अधिक स्पष्ट करता है, पर उसका पाठ-साक्ष्य अनिश्चित है।
  - marker: d
    text: कुछ पाठ-साक्ष्य यहाँ ‘अच्छी नींद में’ जोड़ते हैं।
    reason: ग्रीक स्रोत में यह कोष्ठकित और संदिग्ध अतिरिक्त पाठ है; इसलिए इसे मुख्य पाठ में शामिल नहीं किया गया है।
lexical_decisions:
- source_word: εὐσπλαγχνία
  choice: करुणा
  rationale: यह आंतरिक दया और सहृदयता को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: इसे सामान्य संज्ञा या शैतान जैसे किसी बाद के धर्मवैज्ञानिक पर्याय में बदलने के बजाय व्यक्तिनाम के रूप में लिप्यंतरित किया गया है।
- source_word: πνεῦμα πλάνης
  choice: भरमानेवाली हर आत्मा
  rationale: πλάνη में भ्रम और भटकाने दोनों का भाव है; यह अनुवाद जानबूझकर उस सक्रिय अर्थ को बनाए रखता है।
- source_word: παραζήλωσιν αὐτοῦ
  choice: अपने प्रति उत्साह
  rationale: ζῆλος के उत्साह/ईर्ष्या के अर्थ-क्षेत्र में संदर्भानुकूल सकारात्मक अर्थ लिया गया है, पर इसे सांप्रदायिक तकनीकी शब्द नहीं बनाया गया।
- source_word: συμπέσητε
  choice: शोक से निढाल मत हो
  rationale: मूल क्रिया के ‘ढह पड़ने’ के बिंब और प्रसंग के शोकभाव दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἡγούμενος
  choice: शासक
  rationale: यह नेतृत्व और अधिकार दोनों व्यक्त करता है तथा स्रोत के पद को केवल सामान्य ‘अगुआ’ तक सीमित नहीं करता।
- source_word: ἀνάπαυσιν
  choice: विश्राम
  rationale: मृत्यु के लिए प्रयुक्त मूल के शिष्ट रूपक को बनाए रखता है।
- source_word: θήκην ξυλίνην
  choice: लकड़ी का ताबूत
  rationale: दफ़नाने के संदर्भ में ‘लकड़ी का पात्र’ की अपेक्षा यह आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: मनुष्य के रूप में परमेश्वर को देखना
  choice: मूल कथन को सीधे ‘मनुष्य के रूप में परमेश्वर’ रखा गया
  alternative: ‘परमेश्वर के चुने हुए मनुष्य’ अथवा किसी विशिष्ट मसीही पहचान के रूप में व्याख्या करना
  rationale: ग्रीक θεὸν ἐν σχήματι ἀνθρώπου का स्पष्ट, किंतु धर्मवैज्ञानिक रूप से तनावपूर्ण कथन सुरक्षित रखा गया है; उसकी पहचान को आगे से तय नहीं किया गया।
- issue: ‘यरूशलेम उसका नाम है’ का संबंध
  choice: विराम-चिह्न के साथ कठिन पाठ को मुख्य पाठ में बनाए रखा गया और पादटिप्पणी दी गई
  alternative: यरूशलेम को चयन का स्थान मानकर वाक्य को सुगम बनाना
  rationale: ग्रीक पाठ व्याकरण और अर्थ दोनों में कठिन है; मौन रूप से सुधारना वास्तविक अस्पष्टता मिटा देता।
- issue: ‘मैं फिर जी उठूँगा’
  choice: व्यक्तिगत प्रथम-पुरुष पुनरुत्थान-कथन बनाए रखा गया
  alternative: इसे केवल स्मृति, वंश या गोत्र की पुनर्स्थापना के रूपक में बदलना
  rationale: ἀναστήσομαι πάλιν का सीधा अर्थ सुरक्षित रखा गया है और उसकी धर्मवैज्ञानिक व्याख्या पाठक पर छोड़ी गई है।
- issue: अनन्त आग और पीढ़ी-दर-पीढ़ी नाश
  choice: दोनों अभिव्यक्तियाँ साथ रखी गईं
  alternative: दोनों को मिलाकर केवल ‘सदा का दण्ड’ कहना
  rationale: स्रोत के αἰώνιον और ἕως γενεὰς γενεῶν के बीच उपस्थित तनाव को किसी निश्चित दण्ड-सिद्धांत में समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पारिवारिक संबोधन ‘मेरे बच्चो’, मृत्यु के लिए ‘विश्राम’ और ‘सो गया’, तथा न्याय-वर्णन की गंभीरता को बनाए रखा गया है। अध्याय 10 से पहले स्रोत में उपलब्ध पूर्ववर्ती अनुच्छेद और पद 9 भी अनुवादित किए गए हैं, क्योंकि वे दिए गए मूल-पाठ और परामर्श-पाठ दोनों का भाग हैं।
