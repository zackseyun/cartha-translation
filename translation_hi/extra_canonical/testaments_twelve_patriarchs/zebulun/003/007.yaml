  text: 4. Διὰ τοῦτο οὖν¹⁹ ἐν γραφῇ *νόμου Μωσέως γέγραπται²⁰· Τὸν μὴ θέλοντα *ἀναστῆσαι σπέρμα²¹ τῷ ἀδελφῷ αὐτοῦ ὑπολύεσθαι²² τὸ ὑπόδημα αὐτοῦ²³ καὶ ἐμπτύεσθαι εἰς τὸ πρόσωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/007.yaml
  text: 'Therefore it is written in the book of the law of Moses: “The one who does not want to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”'
translation:
  language: hi
  text: इसलिए मूसा की व्यवस्था के ग्रन्थ में लिखा है, “जो अपने भाई का वंश चलाना[a] नहीं चाहता, उसकी जूती उतारी जाए और उसके चेहरे पर थूका जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने भाई के लिए बीज खड़ा करना,” अर्थात् सन्तान के द्वारा उसके नाम और वंश को आगे बढ़ाना।
    reason: यूनानी मुहावरे की मूल छवि और उसका प्रसंगगत अर्थ दोनों सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐν γραφῇ νόμου Μωσέως
  choice: मूसा की व्यवस्था के ग्रन्थ में
  rationale: γραφή यहाँ लिखित पवित्र ग्रन्थ अथवा पुस्तक को सूचित करता है; ‘ग्रन्थ’ आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: ἀναστῆσαι σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: अपने भाई का वंश चलाना
  rationale: शाब्दिक अर्थ ‘अपने भाई के लिए बीज खड़ा करना’ है। प्रसंग में यह मृत भाई के नाम और वंश को सन्तान द्वारा आगे बढ़ाने का मुहावरा है; ‘वंश चलाना’ हिन्दी में उसी आशय को सहज रूप से व्यक्त करता है।
- source_word: ὑπολύεσθαι τὸ ὑπόδημα αὐτοῦ
  choice: उसकी जूती उतारी जाए
  rationale: यूनानी निष्क्रिय रूप और दण्डसूचक क्रिया को बनाए रखता है; ὑπόδημα के लिए सामान्य तथा स्पष्ट ‘जूती’ चुना गया है।
- source_word: ἐμπτύεσθαι εἰς τὸ πρόσωπον
  choice: उसके मुँह पर थूका जाए
  rationale: यूनानी का निष्क्रिय और अपमानसूचक अर्थ सीधे ढंग से सुरक्षित रहता है; कर्ता मूल पाठ में अनिर्दिष्ट है।
theological_decisions:
- issue: ‘भाई के लिए बीज खड़ा करने’ की वंशगत धारणा
  choice: मुख्य पाठ में ‘अपने भाई का वंश चलाना’
  alternative: ‘अपने भाई के लिए सन्तान उत्पन्न करना’ या शाब्दिक ‘बीज खड़ा करना’
  rationale: यह चयन देवर-विवाह से जुड़ी वंश-रक्षा की धारणा व्यक्त करता है, पर किसी अतिरिक्त वैधानिक या सम्प्रदायगत व्याख्या को पाठ में नहीं जोड़ता। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। उद्धरण में विधिक निष्क्रिय शैली (‘उतारी जाए’, ‘थूका जाए’) मूल यूनानी के अनुरूप है; जहाँ मूल में कर्ता नहीं बताया गया, वहाँ हिन्दी में भी उसे अनिर्दिष्ट रखा गया है।
