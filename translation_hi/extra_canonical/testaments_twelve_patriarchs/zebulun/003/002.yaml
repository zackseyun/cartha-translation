  text: And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits, which our fathers dug and found no water.”
translation:
  language: hi
  text: इसी बीच रूबेन उठ खड़ा हुआ और बोला, “आओ, मेरे भाइयो, हम उसे न मारें, बल्कि उसे इन सूखे गड्ढों में से किसी एक में डाल दें, जिन्हें हमारे पुरखाओं ने खोदा था और जिनमें उन्हें पानी नहीं मिला था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ μεταξὺ
  choice: इसी बीच
  rationale: समय-संबंधी संक्रमण को स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀναστὰς
  choice: उठ खड़ा हुआ
  rationale: कृदन्त का क्रियात्मक बल बनाए रखता है और हिन्दी में सहज है।
- source_word: Δεῦτε ἀδελφοί μου
  choice: आओ, मेरे भाइयो
  rationale: आह्वान और प्रत्यक्ष संबोधन दोनों को सुरक्षित रखता है।
- source_word: μὴ ἀποκτείνωμεν αὐτόν
  choice: हम उसे जान से न मारें
  rationale: प्रथम पुरुष बहुवचन निषेधात्मक प्रस्ताव को स्पष्ट रूप से व्यक्त करता है।
- source_word: ξηρῶν λάκκων
  choice: सूखे गड्ढों
  rationale: ξηρός और λάκκος का सीधा, प्रसंगानुकूल अर्थ; जलरहित खुदे हुए गड्ढों का बोध देता है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पुरखाओं
  rationale: यहाँ पूर्वजों के अर्थ में स्वाभाविक हिन्दी रूप है, न कि केवल तत्कालीन पिताओं का संकेत।
- source_word: οὐχ εὗρον ὕδωρ
  choice: उनमें पानी नहीं मिला
  rationale: यूनानी में कर्ता ‘हमारे पुरखा’ हैं; हिन्दी में यह स्वाभाविक रूप उसी घटना को व्यक्त करता है कि खोदने पर पानी नहीं मिला।
