review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Joseph seeing Zebulun weep with him, the brothers’ lethal advance, and Joseph’s appeal. However, κατέφυγεν ὄπισθέν μου is more directly and safely rendered as taking refuge ‘behind me,’ rather than merely coming into the narrator’s cover. The final phrase specifies aid directed toward Joseph; this should be made explicit in Hindi.
  naturalness: The draft is fluent modern Hindi. ‘मेरे पीछे शरण ली’ is equally natural in a narrative register and more closely reflects the spatial and protective wording of the Greek.
  terminology: ‘मार डालने,’ ‘शरण,’ and ‘सहायता’ are appropriate, clear choices. Rendering the requested aid reflexively as ‘अपनी सहायता करने के लिए’ makes the Greek referent clear without importing interpretation.
  issues:
  - severity: medium
    issue: The beneficiary of the requested help is not explicit.
    rationale: δεόμενος τῆς πρὸς αὐτὸν βοηθείας indicates an appeal for help directed toward Joseph. ‘मुझसे सहायता की विनती’ can leave unclear whose assistance is sought.
  - severity: low
    issue: ‘मेरी आड़ में आ गया’ is less precise than the source’s ‘took refuge behind me.’
    rationale: ὄπισθέν μου explicitly has the spatial sense ‘behind me,’ while κατέφυγεν expresses seeking refuge.
  revised_text: जब यूसुफ ने देखा कि मैं उसके साथ रो रहा हूँ और भाई उसे मार डालने के लिए उसकी ओर बढ़ रहे हैं, तो उसने मेरे पीछे शरण ली और अपनी सहायता करने के लिए मुझसे विनती करने लगा।
