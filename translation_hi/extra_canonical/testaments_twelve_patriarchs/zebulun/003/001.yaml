  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/001.yaml
  text: And when Joseph saw me weeping with him, and the brothers coming on to kill him, he took refuge behind me, begging me for help on his behalf.
translation:
  language: hi
  text: जब यूसुफ ने देखा कि मैं उसके साथ रो रहा हूँ और भाई उसे मार डालने के लिए उसकी ओर बढ़ रहे हैं, तो उसने मेरे पीछे शरण ली और अपनी सहायता करने के लिए मुझसे विनती करने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνκλαίοντά μοι αὐτῷ
  choice: मैं भी उसके साथ रो रहा हूँ
  rationale: συνκλαίω के सहभागितापूर्ण अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; αὐτῷ यूसुफ के साथ रोने का संकेत देता है।
- source_word: ἐπερχομένους ἀνελεῖν αὐτόν
  choice: उसे मार डालने के लिए आगे बढ़ रहे हैं
  rationale: ἐπέρχομαι की निकट आते/आगे बढ़ते हुए आक्रमण की गति और ἀναιρέω के प्राण लेने के आशय—दोनों को बनाए रखता है।
- source_word: κατέφυγον ὄπισθέν μου
  choice: वह मेरी आड़ में आ गया
  rationale: शाब्दिक रूप से ‘मेरे पीछे शरण ली’; ‘मेरी आड़ में’ संरक्षण खोजने का भाव स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  choice: मुझसे सहायता की विनती करने लगा
  rationale: δεόμενος की विनती और βοηθεία की सहायता को व्यक्त करता है। ग्रीक वाक्यांश असहज/पाठगत रूप से संदिग्ध है; प्रसंगानुसार सहायता यूसुफ के अपने लिए माँगी गई है, जिसे हिन्दी में अनावश्यक पुनरुक्ति के बिना रखा गया है।
