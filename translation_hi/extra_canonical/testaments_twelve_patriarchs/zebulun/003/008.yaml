  text: And the brothers of Joseph were not willing to preserve the life of their brother, and the Lord took from them the sandal that they wore against Joseph their brother.
translation:
  language: hi
  text: और यूसुफ के भाई अपने भाई का जीवन बचाना नहीं चाहते थे[a]; और प्रभु ने उनसे वह जूती ले ली, जो उन्होंने अपने भाई यूसुफ के विरुद्ध पहन रखी थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ यहाँ संदिग्ध और व्याकरण की दृष्टि से असामान्य है; शाब्दिक रूप में ‘अपने भाई का जीवन नहीं चाहते थे’ जैसा पाठ मिलता है।
    reason: मूल पाठ में ζωὴν के साथ पाठ-संदेह चिह्न है और निहित क्रिया स्पष्ट नहीं है।
  - marker: b
    text: ‘जूती … यूसुफ के विरुद्ध पहन रखी थी’ मूल का असामान्य बिंब है; इसका आशय पाठ में स्पष्ट नहीं किया गया है।
    reason: रूपक की वास्तविक अस्पष्टता सुरक्षित रखने और अनावश्यक व्याख्या से बचने के लिए।
lexical_decisions:
- source_word: οὐκ ἠθέλησαν … ζωὴν ἀδελφοῦ αὐτῶν
  choice: अपने भाई का जीवन बचाना नहीं चाहते थे
  rationale: यूनानी पाठ में ‘जीवन’ कर्मकारक रूप में है और क्रिया-संबंध कुछ असामान्य तथा पाठ-संदिग्ध है। हिन्दी में प्रसंगानुकूल अर्थ ‘जीवन बचाना/जीवित रखना’ स्वाभाविक है, पर पादटिप्पणी द्वारा अनिश्चितता बनाए रखी गई है।
- source_word: ὁ Κύριος
  choice: प्रभु
  rationale: यह κύριος का प्रतिष्ठित, सहज और धार्मिक रूप से निरपेक्ष हिन्दी समतुल्य है।
- source_word: ὑπέλυσεν αὐτοὺς τὸ ὑπόδημα
  choice: उनसे वह जूती ले ली
  rationale: वाक्यांश का शाब्दिक विन्यास कठिन है; ὑπολύω में उतारने या अलग कर देने का भाव हो सकता है। अंग्रेज़ी परामर्श-पाठ के अनुरूप ‘ले ली’ अर्थ को सुबोध रखता है और असामान्य जूती-रूपक को नहीं मिटाता।
- source_word: κατὰ Ἰωσὴφ
  choice: यूसुफ के विरुद्ध
  rationale: κατά का यहाँ विरोधात्मक अर्थ प्रत्यक्ष रूप से सुरक्षित रखा गया है; अस्पष्ट बिंब की कोई अतिरिक्त व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
theological_decisions:
- issue: प्रभु द्वारा जूती ले लिए जाने का दंडात्मक अथवा प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में केवल मूल कथन रखा गया
  alternative: इसे ईश्वरीय दंड, अधिकार-हरण या बिक्री से प्राप्त वस्तु के रूप में स्पष्ट करना
  rationale: यूनानी पाठ स्वयं प्रतीक का अर्थ नहीं खोलता। किसी विशिष्ट धर्मवैज्ञानिक या व्याख्यात्मक निष्कर्ष को आरोपित करने के बजाय वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘जीवन बचाना’ सामान्य पाठक के लिए स्वाभाविक है; ‘जूती’ और ‘विरुद्ध पहन रखी थी’ की असामान्यता जानबूझकर रखी गई है, क्योंकि वही स्रोत-पाठ में उपस्थित है।
