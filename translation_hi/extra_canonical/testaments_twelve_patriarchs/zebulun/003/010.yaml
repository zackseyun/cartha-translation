source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Οὐ μόνον δὲ προσεκύνησαν αὐτῷ⁴² ἀλλὰ καὶ ἐνεπτύσθησαν⁴³ παραχρῆμα⁴⁴ πεσόντες ἔμπροσθεν αὐτοῦ, καὶ⁴⁵ ἠσχύνθησαν⁴⁶ παρὰ⁴⁷ τῶν⁴⁸ Αἰγυπτίων⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/010.yaml
  text: And not only did they bow down to him, but they also immediately fell before him and spat, and they were put to shame by the Egyptians.
translation:
  language: hi
  text: और उन्होंने न केवल उसे दण्डवत किया, बल्कि उसके सामने गिरते ही उन पर भी थूका गया[a]; और मिस्रियों ने उन्हें लज्जित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में क्रिया निष्क्रिय है: उन पर थूका गया। थूकने वाला व्यक्ति या समूह नहीं बताया गया है।'
    reason: ἐνεπτύσθησαν निष्क्रिय रूप है; यह भोगी को स्पष्ट करता है, पर कर्ता को नहीं।
lexical_decisions:
- source_word: προσεκύνησαν
  choice: दण्डवत किया
  rationale: यह क्रिया झुककर या भूमि पर गिरकर सम्मान प्रकट करने को दर्शाती है; यहाँ ‘दण्डवत किया’ प्रसंग के शारीरिक भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐνεπτύσθησαν
  choice: थूका
  rationale: इस पाठ-रूप को कर्तृवाच्य अर्थ ‘उन्होंने थूका’ के रूप में प्रस्तुत किया गया है, न कि ‘उन पर थूका गया’; यूनानी में थूकने का लक्ष्य स्पष्ट नहीं है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह अव्यय कार्य की तात्कालिकता व्यक्त करता है।
- source_word: ἠσχύνθησαν παρὰ τῶν Αἰγυπτίων
  choice: मिस्रियों ने उन्हें लज्जित किया
  rationale: यूनानी निष्क्रिय रचना और कर्ता-सूचक पद को आधुनिक हिन्दी की स्वाभाविक कर्तृवाच्य रचना में व्यक्त किया गया है।
theological_decisions:
- issue: दण्डवत करने और थूकने की असामान्य क्रिया-श्रृंखला
  choice: दोनों क्रियाओं को बिना सामंजस्य बैठाए ज्यों का त्यों रखा गया
  alternative: ‘उन पर थूका गया’ या ‘उस पर थूका’ कहकर दृश्य को स्पष्ट करना
  rationale: प्रस्तुत यूनानी पाठ कर्ता को वही रखता है, पर थूकने का लक्ष्य नहीं बताता; इसलिए कथात्मक तनाव और स्रोत की अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। ‘दण्डवत किया’ प्राचीन सम्मान-भंगिमा को स्पष्ट करता है, जबकि वाक्य का असामान्य क्रम और तनाव मूल के अनुसार सुरक्षित है।
