source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. Διὰ γὰρ τοῦτο ἐκώλυσε ὁ⁴⁴ Κύριος *τοῦ μὴ ἀναβλῦσαι ὕδωρ⁴⁵ ἐν αὐτοῖς ἵνα *γένηται περιποίησις τῷ⁴⁶ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/003.yaml
  text: For this reason the Lord prevented water from springing up in them, so that provision might be made for Joseph, his brother.
translation:
  language: hi
  text: क्योंकि इसी कारण प्रभु ने उनमें पानी फूटने नहीं दिया, ताकि यूसुफ के लिए प्रबंध हो सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रबंध” का अनुवाद “संरक्षण” भी किया जा सकता है।
    reason: यूनानी περιποίησις में प्रबंध/प्राप्ति और संरक्षण—दोनों अर्थ-छायाएँ संभव हैं।
lexical_decisions:
- source_word: ἀναβλῦσαι ὕδωρ
  choice: पानी फूटने
  rationale: यह अभिव्यक्ति जल के भीतर से निकलने या उमड़ने का स्वाभाविक चित्र बनाए रखती है।
- source_word: γένηται περιποίησις
  choice: प्रबंध हो सके
  rationale: περιποίησις यहाँ यूसुफ के हित में किए जाने वाले प्रबंध या व्यवस्था का बोध करा सकता है; यह केवल ‘बचाया जाए’ कहकर अर्थ को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: ἐν αὐτοῖς
  choice: उनमें
  rationale: मूल यूनानी के बहुवचन संकेत को बनाए रखा गया है; इस अलग दिए गए पद में उसका पूर्ववर्ती संदर्भ स्पष्ट नहीं है।
theological_decisions:
- issue: यूसुफ के लिए प्रभु की उद्देश्यपूर्ण व्यवस्था
  choice: ताकि यूसुफ के लिए प्रबंध हो सके
  alternative: ताकि यूसुफ बचाया जा सके
  rationale: मूल का περιποίησις प्रबंध, प्राप्ति या संरक्षण जैसे अर्थों की गुंजाइश रखता है। ‘प्रबंध’ उद्देश्यपूर्ण ईश्वरीय व्यवस्था व्यक्त करता है और किसी एक धर्मवैचारिक व्याख्या को निर्णायक नहीं बनाता।
- issue: ‘उसका भाई’ का समावेश
  choice: मुख्य पाठ में नहीं जोड़ा गया
  alternative: यूसुफ, उसके भाई, के लिए
  rationale: प्रदत्त यूनानी पाठ में केवल τῷ Ἰωσήφ है; इसलिए अंग्रेज़ी परामर्श-पाठ में आए ‘his brother’ को स्रोत-पाठ के बिना मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। आरंभ का ‘क्योंकि इसी कारण’ यूनानी γὰρ और διὰ τοῦτο दोनों को व्यक्त करता है; यद्यपि स्वतंत्र हिन्दी वाक्य में कुछ पुनरुक्ति लग सकती है, यह पिछले कथन से मूल के तार्किक संबंध को सुरक्षित रखता है।
