source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. *Ἀλλὰ Συμεὼν² καὶ *ὁ Δὰν καὶ ὁ Γὰδ καὶ τὰ τέκνα αὐτῶν³, καὶ⁴ λαβόντες *τὴν τιμὴν αὐτοῦ⁵ ἐπρίαντο⁶ ὑποδήματα ἑαυτοῖς⁷ *καὶ ταῖς γυναιξὶν αὐτῶν⁸ Γκαὶ τοῖς τέκνοις αὐτῶν˥⁹, εἰπόντες· 3. *Οὐ φαγόμεθα αὐτήν¹⁰, ὅτι τιμὴ ἐστιν *αἵματος τοῦ ἀδελφοῦ ἡμῶν¹¹, ἀλλὰ καταπατήσει¹² καταπατήσωμεν¹³ αὐτήν, ἀνθ' ὧν εἶπεν βασιλεῦσαι¹⁴ ἐφ' ἡμᾶς¹⁵, καὶ ἴδωμεν¹⁶ τί ἐστι¹⁷ *τὰ ἐνύπνια¹⁸ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/006.yaml
  text: saying, “We will not eat it, because it is the price of our brother’s blood; rather, let us trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”
translation:
  language: hi
  text: यह कहते हुए, “हम इसे नहीं खाएँगे, क्योंकि यह हमारे भाई के खून की कीमत है। बल्कि आओ, हम इसे पैरों तले रौंदें, क्योंकि उसने कहा था कि वह हम पर राज करेगा; तब हम देखेंगे कि उसके सपने क्या हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμή
  choice: कीमत
  rationale: यहाँ शब्द उस धन या मूल्य को दर्शाता है जो भाई के खून के बदले मिला; ‘कीमत’ इस अर्थ को सहज और स्पष्ट रखता है।
- source_word: αἵματος τοῦ ἀδελφοῦ ἡμῶν
  choice: हमारे भाई के खून
  rationale: ‘खून’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और अपराध तथा पारिवारिक संबंध की तीव्रता बनाए रखता है।
- source_word: καταπατήσωμεν
  choice: आओ, हम इसे पैरों तले रौंदें
  rationale: पहले पुरुष के उपदेशात्मक संभावनार्थक रूप को सामूहिक आग्रह के रूप में व्यक्त किया गया है; ‘पैरों तले’ क्रिया की ठोस छवि बनाए रखता है।
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: वह हम पर राज करेगा
  rationale: राजकीय प्रभुत्व का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τί ἐστι τὰ ἐνύπνια αὐτοῦ
  choice: उसके सपने क्या हैं
  rationale: मूल की कुछ असामान्य, चुनौतीपूर्ण अभिव्यक्ति को बिना ‘उनका क्या होता है’ जैसा परिणामसूचक अर्थ जोड़े सुरक्षित रखा गया है।
theological_decisions:
- issue: भाई के खून की कीमत से लाभ उठाने से इनकार
  choice: ‘हम इसे नहीं खाएँगे’ का सीधा रूप रखा गया
  alternative: ‘हम इस धन से भोजन नहीं खरीदेंगे’
  rationale: मूल यूनानी में वस्तु को सीधे ‘खाने’ की अभिव्यक्ति है। उसका आशय धन का उपभोग करना हो सकता है, पर अनुवाद में उस निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: सपनों के सत्य या परिणाम का संकेत
  choice: ‘उसके सपने क्या हैं’
  alternative: ‘उसके सपनों का क्या होता है’
  rationale: वैकल्पिक रूप उत्पत्ति की कथा के संदर्भ में सहज है, पर वह मूल के ‘क्या हैं’ को परिणामसूचक बना देता है; इसलिए वास्तविक अस्पष्टता बनाए रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। प्रत्यक्ष कथन में ‘आओ’ सामूहिक उकसावे को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘खून की कीमत’ और ‘पैरों तले रौंदें’ मूल की कठोर नैतिक और दृश्यात्मक शक्ति बनाए रखते हैं।
