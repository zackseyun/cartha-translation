  text: 6. Καὶ *γὰρ ἐλθόντες ἐν Αἰγύπτῳ³³ ὑπελύθησαν³⁴ *ὑπὸ τῶν παίδων³⁵ Ἰωσὴφ ἔξωθεν³⁶ τοῦ πυλῶνος, καὶ οὕτως³⁷ προσεκύνησαν³⁸ *τῷ Ἰωσὴφ³⁹ κατὰ τὸν τύπον βασιλέως⁴⁰ Φαραώ⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/009.yaml
  text: For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner before King Pharaoh.
translation:
  language: hi
  text: क्योंकि जब वे मिस्र पहुँचे, तो फाटक के बाहर यूसुफ के परिचारकों ने उनके जूते उतार दिए; और इस प्रकार उन्होंने राजा फ़िरौन के सामने की रीति के अनुसार यूसुफ को दण्डवत किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπελύθησαν
  choice: उनके जूते उतरवाए
  rationale: यह निष्क्रिय क्रिया यहाँ किसी के पादत्राण उतरवाए जाने को व्यक्त करती है। हिन्दी में कर्तृवाच्य रूप के साथ ‘यूसुफ के सेवकों ने’ अधिक स्वाभाविक है और यूनानी अर्थ को बनाए रखता है।
- source_word: παίδων
  choice: सेवकों
  rationale: παῖς का अर्थ ‘बालक’ भी हो सकता है, पर इस दरबारी प्रसंग में यूसुफ के सेवक या परिचारक अभिप्रेत हैं।
- source_word: πυλῶνος
  choice: फाटक
  rationale: यह किसी भवन या परिसर के प्रवेश-द्वार अथवा फाटक को दर्शाता है; ‘फाटक’ सामान्य और स्पष्ट हिन्दी है।
- source_word: προσεκύνησαν
  choice: दण्डवत किया
  rationale: क्रिया सम्मानपूर्वक भूमि की ओर झुकने या दण्डवत करने को व्यक्त करती है; राजकीय प्रसंग में ‘दण्डवत किया’ उपासना का अनावश्यक धार्मिक अर्थ जोड़े बिना शारीरिक सम्मान स्पष्ट करता है।
- source_word: κατὰ τὸν τύπον
  choice: रीति के अनुसार
  rationale: τύπος यहाँ स्थापित ढंग, नमूने या प्रथा के अर्थ में है; ‘रीति के अनुसार’ स्वाभाविक हिन्दी में उस औपचारिक अनुकरण को व्यक्त करता है।
theological_decisions:
- issue: यूसुफ को किए गए προσκυνέω का स्वरूप
  choice: दण्डवत किया
  alternative: आराधना की
  rationale: राजा फ़िरौन के दरबार की रीति से तुलना इसे राजकीय सम्मान का संकेत बनाती है; ‘आराधना’ पाठ में अनावश्यक धर्मवैज्ञानिक निष्कर्ष जोड़ देती।
- issue: βασιλέως Φαραώ के साथ τύπος का संबंध
  choice: राजा फ़िरौन के सामने की रीति के अनुसार
  alternative: राजा फ़िरौन के नमूने के अनुसार
  rationale: यूनानी संबंध संक्षिप्त और कुछ असहज है। चुना हुआ रूप फ़िरौन की उपस्थिति में प्रचलित दरबारी रीति का संभावित आशय व्यक्त करता है, बिना किसी विशिष्ट धार्मिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली। ‘फ़िरौन’, ‘यूसुफ’, ‘दण्डवत’ और ‘फाटक’ सामान्य पाठक के लिए परिचित हैं। मूल के कारणसूचक आरम्भ को ‘क्योंकि’ से और घटनाक्रम को अर्धविराम से सुरक्षित रखा गया है।
