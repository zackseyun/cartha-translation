  text: और उन्होंने ऐसा ही किया, जब तक कि उन्होंने उसे इश्माएलियों को बेच नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  choice: उन्होंने ऐसा ही किया
  rationale: ग्रीक पदबंध का स्वाभाविक और निकट हिन्दी रूप; ‘ही’ पूर्वोक्त ढंग के अनुसार कार्य करने पर बल देता है।
- source_word: ἕως ὅτου
  choice: जब तक कि
  rationale: यह कालगत सीमा को बनाए रखता है और अगले कार्य तक जारी आचरण को व्यक्त करता है।
- source_word: ἐπώλησαν αὐτὸν
  choice: उन्होंने उसे ... बेच नहीं दिया
  rationale: 'हिन्दी में ‘जब तक कि’ के साथ नकारात्मक क्रियारूप स्वाभाविक है, जबकि समूचे वाक्य का सकारात्मक अर्थ वही रहता है: अंततः उसे बेच दिया गया।'
- source_word: τοῖς Ἰσμαηλίταις
  choice: इश्माएलियों के हाथ
  rationale: समुदाय के प्रचलित हिन्दी नाम को रखते हुए ‘के हाथ बेचना’ खरीदार को स्वाभाविक ढंग से व्यक्त करता है।
