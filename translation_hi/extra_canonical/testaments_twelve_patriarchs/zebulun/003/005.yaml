  text: For I had no share in his price, my children.
translation:
  language: hi
  text: क्योंकि उसकी कीमत में मेरा कोई हिस्सा नहीं था, मेरे बच्चों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-परंपराओं में इसके आगे भाइयों द्वारा उस कीमत से जूतियाँ खरीदने का विस्तृत वर्णन मिलता है; प्रस्तुत यूनानी पाठ में यह वाक्य यहीं समाप्त होता है।
    reason: उपलब्ध संस्करणों में पाए जाने वाले लंबे पाठ और दिए गए स्रोत-पाठ के अंतर से पाठक को अवगत कराना।
lexical_decisions:
- source_word: τίμημα
  choice: कीमत
  rationale: यहाँ शब्द उस मूल्य या धनराशि को सूचित करता है जो उसे बेचने पर मिली; ‘कीमत’ सरल और प्रसंगानुकूल है।
- source_word: οὐκ ἐκοινώνησα
  choice: मेरा कोई हिस्सा नहीं था
  rationale: क्रिया का अर्थ किसी वस्तु या लाभ में सहभागी होना है। यह स्वाभाविक हिन्दी में उस धनराशि में भाग न लेने की बात स्पष्ट करता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: प्रत्यक्ष संबोधन को आधुनिक मानक हिन्दी में आत्मीय और गरिमापूर्ण रूप से रखा गया है।
theological_decisions:
- issue: ‘उसकी कीमत’ का संदर्भ
  choice: सर्वनाम और संक्षिप्त अभिव्यक्ति को यथावत रखा गया
  alternative: ‘उसे बेचकर मिली रकम’
  rationale: ग्रीक पाठ केवल ‘उसकी कीमत’ कहता है; विस्तृत अर्थ को मुख्य पाठ में जोड़ना मूल की संदर्भ-निर्भरता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे बच्चो’ में सम्बोधन के कारण ‘बच्चो’ रूप प्रयुक्त है।
