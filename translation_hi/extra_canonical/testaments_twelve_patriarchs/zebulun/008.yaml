  text: 'And so, my children, have compassion toward every person with mercy, so that the Lord also, having had compassion on you, may show you mercy. For indeed in the last days God will send his compassion upon the earth, and wherever he finds merciful compassion, there he dwells. For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.


    And when we went down into Egypt, Joseph did not hold a grudge against us. Giving heed to him, then, you also, my children, love one another, and let each one not reckon evil against his brother. For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.'
translation:
  language: hi
  text: '8 इसलिए, मेरे बच्चो, हर मनुष्य पर दया और करुणा रखो, ताकि प्रभु भी तुम पर करुणा करके तुम पर दया करे। 2 क्योंकि निश्चय ही अन्तिम दिनों में परमेश्वर अपनी करुणा पृथ्वी पर भेजेगा; और जहाँ कहीं वह दयाभरी करुणा पाएगा, वहीं वह निवास करेगा। 3 क्योंकि मनुष्य अपने पड़ोसी पर जितनी करुणा दिखाता है, प्रभु भी उस पर उतनी ही करुणा करता है।


    4 जब हम मिस्र गए, तब यूसुफ ने हमारे विरुद्ध मन में बैर नहीं रखा। 5 इसलिए, मेरे बच्चो, उसके उदाहरण पर ध्यान देते हुए तुम भी एक-दूसरे से प्रेम करो, और तुम में से कोई भी अपने भाई के विरुद्ध बुराई का लेखा न रखे। 6 क्योंकि यह एकता को अलग करता है, हर रिश्तेदारी को बिखेरता है, आत्मा को व्याकुल करता है और चेहरे को बिगाड़ देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνία / σπλάγχνα / σπλαγχνίζομαι
  choice: करुणा / करुणा करना
  rationale: एक ही यूनानी शब्द-समूह की पुनरावृत्ति को यथासम्भव बनाए रखते हुए आधुनिक हिन्दी में गहरी दयाभावना व्यक्त की गई है।
- source_word: ἐν ἐλέει / ἐλεέω / σπλάγχνα ἐλέους
  choice: दया करके / दया करना / दयालु करुणा
  rationale: ἔλεος और σπλάγχνα के निकट, पर अलग अर्थों को ‘दया’ और ‘करुणा’ द्वारा अलग रखा गया है; असामान्य संयुक्त अभिव्यक्ति भी नहीं मिटाई गई।
- source_word: ὁ πλησίον
  choice: पड़ोसी
  rationale: शाब्दिक निकटता और नैतिक अर्थ दोनों को सुरक्षित रखने वाला परिचित बाइबलीय हिन्दी शब्द।
- source_word: οὐκ ἐμνησικάκησεν
  choice: मन में बैर नहीं रखा
  rationale: मुहावरे का अर्थ पुराने अपराध को याद रखकर द्वेष या वैमनस्य पालना है; यह हिन्दी में सहज और स्पष्ट है।
- source_word: λογίζεσθε ... κακίαν
  choice: बुराई का विचार न करे
  rationale: ‘हिसाब लगाना/मन में गिनना’ की शाब्दिक छाया से अधिक स्वाभाविक हिन्दी, पर भाई के विरुद्ध बुरा मनसूबा या दुर्भावना रखने का अर्थ खुला रहता है।
- source_word: πᾶσαν συγγένειαν
  choice: हर पारिवारिक बन्धन
  rationale: συγγένεια रक्त-संबंध, कुल-नाता या रिश्तेदारी को सूचित करता है; ‘पारिवारिक बन्धन’ प्रसंग में स्वाभाविक है।
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: चेहरे की शोभा बिगाड़ देता है
  rationale: क्रिया के नष्ट, कुरूप या ओझल करने वाले बल को ऐसा हिन्दी रूप दिया गया है जो आन्तरिक अशान्ति के चेहरे पर प्रभाव को स्पष्ट करता है।
theological_decisions:
- issue: अन्तिम दिनों में परमेश्वर का ‘अपनी करुणा’ भेजना
  choice: परमेश्वर अपनी करुणा पृथ्वी पर भेजेगा
  alternative: परमेश्वर अपना करुणामय जन/करुणा का अवतार भेजेगा
  rationale: मूल τὰ σπλάγχνα αὐτοῦ अमूर्त और रूपकात्मक है; पाठ स्वयं किसी विशिष्ट व्यक्तित्व या अवतार की पहचान नहीं करता, इसलिए सम्भावित मसीही अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: करुणा के अनुपात में प्रभु की करुणा
  choice: मनुष्य जितनी करुणा... प्रभु भी उतनी ही करुणा
  alternative: जो मनुष्य करुणा करता है, प्रभु उस पर करुणा करता है
  rationale: ὅσον... τοσοῦτον की अनुपातात्मक और धर्मवैज्ञानिक रूप से तनावपूर्ण भाषा को नरम किए बिना सुरक्षित रखा गया है।
- issue: जहाँ दयालु करुणा मिले वहाँ परमेश्वर का निवास
  choice: वहीं वह निवास करेगा
  alternative: उस व्यक्ति में वह निवास करेगा
  rationale: ἐν αὐτῷ का संकेत व्यक्ति या उस स्थान/परिस्थिति की ओर समझा जा सकता है; ‘वहीं’ हिन्दी में इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘मेरे बच्चो’ सम्बोधन में आत्मीयता रखी गई है। मूल के करुणा-दया शब्द-समूह और पद 2–3 की धर्मवैज्ञानिक अस्पष्टता को जानबूझकर सुरक्षित रखा गया है; कोई पादटिप्पणी आवश्यक नहीं समझी गई।
