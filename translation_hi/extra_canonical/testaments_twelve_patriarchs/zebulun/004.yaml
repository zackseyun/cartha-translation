    **5** जब रूबेन लौटा और उसने सुना कि उसकी अनुपस्थिति में यूसुफ बेच दिया गया है, तो उसने शोक करते हुए अपना कुरता फाड़ा और कहा, “अब मैं अपने पिता याकूब को कैसे मुँह दिखाऊँगा?” **6** फिर वह चाँदी लेकर व्यापारियों के पीछे दौड़ा; पर वे उसे नहीं मिले। तब वह दुःखी होकर लौट आया। व्यापारी मुख्य मार्ग छोड़कर एक छोटे रास्ते से त्रोग्लोदितों के प्रदेश से होकर निकल गए थे।[d] **7** रूबेन बहुत दुःखी था और उस दिन उसने रोटी नहीं खाई। तब दान उसके पास आया और बोला, **8** “मत रो और दुःखी मत हो। हमने सोच लिया है कि अपने पिता से क्या कहना है। **9** आओ, तलवार से बकरी का एक बच्चा काटें, उसके लहू से यूसुफ के कुरते पर दाग लगाएँ और उसे याकूब के पास भेजकर कहें, ‘पहचानकर देखिए, क्या यह आपके पुत्र का कुरता है?’” और उन्होंने वैसा ही किया।'
