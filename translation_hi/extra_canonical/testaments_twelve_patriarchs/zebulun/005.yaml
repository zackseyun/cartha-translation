  text: αὐτὸν τῷ Ἰακὼβ λέγοντες⁵⁵. Ἐπίγνωθι, ὁ⁵⁶ *χιτὼν τοῦ υἱοῦ σου ἐστίν⁵⁷; *καὶ ἐποίησαν οὕτως⁵⁸. 10. ΓΤὸν γὰρ χιτῶνα˥⁵⁹ ἐξέδυσαν τὸν⁶⁰ Ἰωσὴφ ἐν *τῷ πιπράσκειν⁶¹ αὐτόν⁶², *καὶ ἐνέδυσαν αὐτὸν ἱμάτιον δουλικόν⁶³. 11. *Ἔλαβε δὲ Συμεὼν τὸν χιτῶνα⁶⁴, Γκαὶ˥⁶⁵ οὐκ ἤθελε δοῦναι αὐτόν⁶⁶, Γ*ἐβούλετο γὰρ⁶⁷ τῇ ῥομφαίᾳ⁶⁸ *κατακόψαι αὐτόν⁶⁹˥, ὀργιζόμενος ὅτι οὐκ⁷⁰ ἀνεῖλεν αὐτόν. 12. Ἀναστάντες δὲ⁷¹ *Γπάντες˥⁷² εἴπομεν αὐτῷ⁷³, ὅτι⁷⁴ ἐὰν μὴ δῷς *τὸν χιτῶνα⁷⁴, εἴπωμεν⁷⁵ Γτῷ πατρὶ ἡμῶν˥⁷⁶ ὅτι σὺ⁷³ μόνος ἐποίησας τὸ πονηρὸν *τοῦτο ἐν Ἰσραήλ⁷⁷. 13. *Καὶ οὕτως δέδωκεν αὐτὸν αὐτοῖς⁷⁸. Καὶ⁷⁹ ἐποίησαν καθὼς *εἶπεν ὁ Δάν⁷⁹. V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰. 2. Διὰ γὰρ ταῦτα εὐλόγησέ με ὁ¹¹ Κύριος, *καὶ πάντων¹² τῶν ἀδελφῶν μου ἀσθενούντων ἐγὼ ἄνοσος παρῆλθον¹³. οἶδε¹⁴ γὰρ¹⁵ Κύριος ἑκάστου τὴν προαίρεσιν¹⁶. 3. *Ἔχετε οὖν¹⁷ ἔλεος ἐν¹⁸ σπλάγχνοις
    ὑμῶν¹⁹, ὅτι *εἴ τι ἂν²⁰ ποιήσῃ²¹ τῷ πλησίον αὐτοῦ, *οὕτω Κύριος²² ποιήσει²³ *μετʼ αὐτοῦ²⁴. 4. *Καὶ γὰρ²⁵ υἱοὶ²⁶ τῶν ἀδελφῶν μου ἠσθένουν καὶ²⁷ ἀπέθνησκον διὰ Ἰωσήφ²⁸, ⌈ὅτι οὐκ ἐποίησαν ἔλεος *ἐν σπλάγχνοις αὐτῶν²⁹⌉. οἱ δὲ *ἐμοὶ υἱοὶ³⁰ ἄνοσοι διεφυλάχθησαν³¹ καθὼς³² οἴδατε³³. 5. Καὶ ὅτε ἤμην *ἐν γῇ³⁴ Χαναὰν *εἰς τὴν παραλίαν³⁵ ἐθήρευον θήραν³⁶ Ἰακὼβ³⁷ τῷ πατρί μου³⁸, καὶ πολλῶν ἀγχομένων *ἐν τῇ θαλάσσῃ³⁹, ἐγὼ ἀβλαβὴς διέμενον⁴⁰.
