    **5** अब, मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ कि प्रभु की आज्ञाओं का पालन करो, अपने पड़ोसी पर दया करो, और सबके प्रति करुणा रखो—केवल मनुष्यों के प्रति ही नहीं, बल्कि विवेकहीन पशुओं के प्रति भी। इन्हीं बातों के कारण प्रभु ने मुझे आशीष दी; जब मेरे सभी भाई बीमार पड़े, तब मैं बिना बीमार हुए उस समय से निकल गया। क्योंकि प्रभु हर एक की मनसा जानता है। इसलिए अपने हृदय में दया रखो[b], क्योंकि मनुष्य अपने पड़ोसी के साथ जो कुछ करता है, प्रभु भी उसके साथ वैसा ही करेगा। मेरे भाइयों के पुत्र यूसुफ के कारण बीमार पड़े और मरते रहे, क्योंकि उनके हृदय में दया नहीं थी; पर मेरे पुत्र बीमारी से बचे रहे, जैसा तुम जानते हो।


    जब मैं कनान देश में समुद्र-तट के पास था, तब मैं अपने पिता याकूब के लिए शिकार पकड़ा करता था[c]। और जब बहुत-से लोग समुद्र में दम घुटने से मर रहे थे, तब मैं सकुशल बचा रहा[d]।'
