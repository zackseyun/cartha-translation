  text: 'And they said to Jacob[a], “Recognize, then, whether this is your son’s tunic.” And they did so. For they stripped Joseph of the tunic when they were selling him, and clothed him in a servant’s garment. And Simeon took the tunic and did not want to give it. For he wanted to cut him down with the sword, being angry because he had not killed him. But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.” And so he gave it to them.


    And now, my children, I command you to guard your neighbor and to have compassion toward all, not only among people, but also toward unreasoning animals. For because of these things the Lord blessed me, and when all my brothers were sick, I passed through without illness. For the Lord knows each person’s purpose. Have mercy, therefore, in your hearts[b], because whatever a person does to his neighbor, so the Lord also will do with him. For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their hearts; but my sons were kept free from sickness, as you know.


    And when I was in the land of Canaan, by the seashore, I used to catch fish[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].'
translation:
  language: hi
  text: 'उन्होंने याकूब को वह वस्त्र दिखाकर कहा, “पहचानिए, क्या यह आपके पुत्र का कुरता[a] है?” और उन्होंने वैसा ही किया। क्योंकि यूसुफ को बेचते समय उन्होंने उसका कुरता उतार लिया था और उसे दास का वस्त्र पहना दिया था। शिमोन ने वह कुरता ले लिया और उसे देना नहीं चाहता था, क्योंकि वह उस कुरते को तलवार से काट डालना चाहता था। वह इस बात से क्रुद्ध था कि उसने उसे मार नहीं डाला था। पर हम सब उठ खड़े हुए और उससे कहा, “यदि तू कुरता नहीं देगा, तो हम अपने पिता से कह देंगे कि इस्राएल में यह बुरा काम तूने अकेले किया है।” तब उसने कुरता उन्हें दे दिया, और उन्होंने वैसा ही किया जैसा दान ने कहा था।


    **5** अब, मेरे बच्चो, मैं तुम्हें आज्ञा देता हूँ कि प्रभु की आज्ञाओं का पालन करो, अपने पड़ोसी पर दया करो, और सबके प्रति करुणा रखो—केवल मनुष्यों के प्रति ही नहीं, बल्कि विवेकहीन पशुओं के प्रति भी। इन्हीं बातों के कारण प्रभु ने मुझे आशीष दी; जब मेरे सभी भाई बीमार पड़े, तब मैं बिना बीमार हुए रहा। क्योंकि प्रभु हर एक का अभिप्राय जानता है। इसलिए अपने हृदय में दया रखो[b], क्योंकि मनुष्य अपने पड़ोसी के साथ जो कुछ करता है, प्रभु भी उसके साथ वैसा ही करेगा। मेरे भाइयों के पुत्र यूसुफ के कारण बीमार पड़े और मरते रहे, क्योंकि उनके हृदय में दया नहीं थी; पर मेरे पुत्र बीमारी से बचे रहे, जैसा तुम जानते हो।


    जब मैं कनान देश में समुद्र-तट के पास था, तब मैं अपने पिता याकूब के लिए शिकार पकड़ा करता था[c]। और जब समुद्र में बहुतों का दम घुट रहा था, तब मैं सकुशल बचा रहा[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी χιτών शरीर पर पहना जाने वाला मूल वस्त्र था; इसका अनुवाद ‘अंगरखा’, ‘चोगा’ या ‘कुरता’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी मुहावरे का शाब्दिक रूप है, “अपने भीतरी अंगों में दया रखो”; प्राचीन प्रयोग में भीतरी अंग गहरी करुणा का केंद्र माने जाते थे।
    reason: cultural_note
  - marker: c
    text: यूनानी में शाब्दिक रूप से “मैं शिकार का आखेट करता था” है। समुद्र-तट के संदर्भ से मछली या समुद्री जीव पकड़ना अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: प्रदान किया गया यूनानी स्रोत-अंश इसी वाक्य पर समाप्त होता है; आगे का प्रसंग यहाँ उपलब्ध नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: χιτών
  choice: कुरता
  rationale: यह शरीर पर पहने जाने वाले मूल वस्त्र को दर्शाता है। आधुनिक हिन्दी में ‘कुरता’ सहज और अपेक्षाकृत विशिष्ट है; ‘चोगा’ या ‘अंगरखा’ अधिक बाहरी वस्त्र का आभास दे सकते हैं।
- source_word: ἱμάτιον δουλικόν
  choice: दास का वस्त्र
  rationale: δουλικός दासत्व से संबद्ध स्थिति को स्पष्ट करता है; केवल ‘सेवक का वस्त्र’ बंधुआ स्थिति की तीव्रता घटा सकता है।
- source_word: κατακόψαι
  choice: काट डालना
  rationale: तलवार के साथ प्रयुक्त यह क्रिया प्रबल हिंसा व्यक्त करती है। ‘काट डालना’ उस चित्र को बनाए रखता है, पर अनावश्यक रूप से टुकड़े-टुकड़े करने का अर्थ निश्चित नहीं करता।
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: प्रभु की आज्ञाओं का पालन करो
  rationale: प्राप्त यूनानी पाठ में कर्म ‘प्रभु की आज्ञाएँ’ है, न कि ‘अपने पड़ोसी’। इसलिए अंग्रेज़ी परामर्श-पाठ के ‘guard your neighbor’ के बजाय स्रोत-पाठ का अर्थ रखा गया है।
- source_word: εὐσπλαγχνίαν
  choice: करुणा
  rationale: यह गहरी, स्नेहपूर्ण दया का बोध कराता है; ‘करुणा’ आधुनिक हिन्दी में स्वाभाविक और नैतिक भारयुक्त है।
- source_word: ἀλόγοις ζώοις
  choice: विवेकहीन पशु
  rationale: ἀλόγοις मनुष्यों के विपरीत वाणी/तर्क-विवेक से रहित प्राणियों को सूचित करता है। यह अनोखा नैतिक विस्तार स्पष्ट रखा गया है।
- source_word: προαίρεσιν
  choice: मनसा
  rationale: शब्द सोची-समझी इच्छा, चुनाव या अभिप्राय का संकेत देता है। ‘मनसा’ भीतरी नैतिक अभिप्राय को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ἔλεος ἐν σπλάγχνοις
  choice: अपने हृदय में दया
  rationale: σπλάγχνα का शाब्दिक अर्थ भीतरी अंग है, किंतु यहाँ वे गहरी भावनाओं के केंद्र का मुहावरा हैं। हिन्दी में ‘हृदय में दया’ स्वाभाविक समतुल्य है।
- source_word: ἀβλαβὴς διέμενον
  choice: सकुशल बचा रहा
  rationale: वाक्य संकट के बीच अहानि और निरंतर सुरक्षित रहने को व्यक्त करता है; यह हिन्दी में सहज रूप से दोनों पहलू रखता है।
- source_word: ἐθήρευον θήραν
  choice: शिकार पकड़ा करता था
  rationale: यूनानी में शाब्दिक रूप से ‘शिकार का आखेट करता था’ है। समुद्र-तट का संदर्भ मछली पकड़ने की संभावना देता है, पर उसे मुख्य पाठ में निश्चित न करके मूल व्यापकता बचाई गई है।
theological_decisions:
- issue: जैसा व्यवहार, वैसा ही प्रभु का प्रतिफल (5:3)
  choice: “मनुष्य अपने पड़ोसी के साथ जो कुछ करता है, प्रभु भी उसके साथ वैसा ही करेगा।”
  alternative: “प्रभु भी उसके साथ उसी प्रकार व्यवहार करेगा।”
  rationale: यूनानी कथन कठोर पारस्परिक नैतिक सिद्धांत प्रस्तुत करता है। उसे सामान्य उपदेश बनाकर नरम नहीं किया गया।
- issue: करुणा का विस्तार पशुओं तक (5:1)
  choice: “केवल मनुष्यों के प्रति ही नहीं, बल्कि विवेकहीन पशुओं के प्रति भी”
  alternative: “मनुष्यों के साथ-साथ पशुओं के प्रति भी”
  rationale: मूल पाठ मनुष्य और ἄλογα ζῷα का स्पष्ट अंतर रखते हुए दया का क्षेत्र बढ़ाता है; इस असामान्य नैतिक दावे को दृश्यमान रखा गया।
- issue: यूसुफ के कारण बीमारी और मृत्यु (5:4)
  choice: 'कारण-संबंध को सीधे रखा गया: “यूसुफ के कारण”'
  alternative: “यूसुफ के साथ किए गए व्यवहार के कारण”
  rationale: मूल διὰ Ἰωσήφ संक्षिप्त और अर्थ की दृष्टि से खुला है। व्याख्यात्मक विस्तार जोड़कर दंड की कार्यविधि निश्चित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। संबोधन में पिता के लिए आदरसूचक “आपके” और भाइयों के बीच सीधे कथन में “तू” प्रसंगानुकूल है। स्रोत-पाठ की अस्पष्टताओं—विशेषकर समुद्र-तट के ‘शिकार’, यूसुफ के कारण बीमारी, और समुद्र में दम घुटने वालों की पहचान—को अनावश्यक व्याख्या से निश्चित नहीं किया गया। अंग्रेज़ी परामर्श-पाठ से भिन्न, यूनानी के स्पष्ट वाक्यांश ‘प्रभु की आज्ञाओं का पालन करो’ को बहाल किया गया है।
