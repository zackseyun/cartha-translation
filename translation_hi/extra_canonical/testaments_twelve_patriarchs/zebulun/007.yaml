  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007.yaml
  text: 1[a]. Therefore, my children, have compassion in mercy toward every person, so that the Lord also may have compassion in mercy toward you. 2. Because in the last days you also will send forth your compassion upon the earth, and wherever the Most High finds a heart of compassion, there he dwells. 3. For in the measure that a man has compassion on his neighbors, so also the Lord has compassion on him. 4. And when we came down into Egypt, Joseph my brother tested us, and he learned that I was compassionate. 5. For when I sat by him, I did not grieve him with envy, and I did not speak bitterly against him. 6. And after these things, my children, I urge you not to hold malice in your hearts against one another[b], and to love one another in deed and in word. 7. For in the presence of my father I spoke peaceably to Joseph; and when I had gone out, Dan told us that the prince of the eunuchs was seeking to destroy him, because he had become attached to him as a pure and good young man. 8.
    But I wept over Joseph, and I prayed for him, that the Lord would deliver him from every evil intention. 9. And afterward the Ishmaelites came and took him away, and they persuaded him to go with them, and they sold him to Potiphar in Egypt. 10. But because of the compassion that I had shown to my brother, the Lord did not let me fall into the same testing. 11. And when all my brothers were sick, and our father was grieving because of them, I had compassion on every poor man and every sick man, and I gave to all in simplicity of heart. 12. And if I had nothing to give to the needy, I walked with him for seven stadia, weeping with him in mercy. 13. Therefore, my children, have compassion in mercy toward every person with a good heart, so that God also may give you compassion and mercy. 14. For if a man does not have compassion on his neighbor, he provokes the Lord. 15. And if he hardens his heart, and does not have compassion on his neighbor, and does not help the poor, the Lord will
    judge him. 16. For throughout all my life I did not walk in crookedness, but in all simplicity. 17. I did not set my mind on silver or gold, or on any glory of men. 18. I did not wear a double face. 19. I did not devise evil against my neighbor. 20. I did not corrupt my speech with many-colored words. 21. I walked with all men in simplicity of heart. 22. Therefore, my children, do you also have these things, and every spirit of Beliar will flee from you, and no deed of wicked men will rule over you; and every wild beast you will master, since you have with you the God of heaven and earth and walk with men in simplicity of heart. 23. And after he had said these things, he commanded them to carry his body to Hebron and to bury it with his fathers. 24. And when he had fallen asleep at a good old age, his sons laid him in a coffin. 25[c][d]. And afterward they carried him up to Hebron and buried him with his fathers.
translation:
  language: hi
  text: '**जबूलून का वसीयतनामा 7**


    **1.** मैंने बीच में लकड़ी का एक और सीधा खंभा खड़ा करके उस पर कपड़े का पाल तान दिया।[a] **2.** फिर मैं उसी नाव में तटों के साथ-साथ जाता और अपने पिता के घराने के लिए मछलियाँ पकड़ता रहा, जब तक कि हम मिस्र नहीं आए।


    **3.** अपनी पकड़ी हुई मछलियों में से मैं हर परदेशी को करुणा से द्रवित होकर हिस्सा देता था।[b] **4.** यदि कोई परदेशी, रोगी या बूढ़ा होता, तो मैं मछलियाँ पकाता और हर एक की आवश्यकता के अनुसार उन्हें अच्छी तरह तैयार करके सबको देता था; मैं उनके दुःख में दुःखी होता और उनके साथ कष्ट सहता था। **5.** इस कारण प्रभु ने भी मछलियाँ पकड़ते समय मुझे बहुत-सी मछलियों से भरपूर किया। क्योंकि जो अपने पड़ोसी को हिस्सा देता है, वह प्रभु से कई गुना पाता है।


    **6.** इस प्रकार मैंने पाँच वर्ष तक मछलियाँ पकड़ीं; जिस किसी मनुष्य को मैं देखता, उसे हिस्सा देता और अपने पिता के सारे घराने की आवश्यकता भी पूरी करता था।[b] **7.** और आधा भाग मैं जाड़े में अपने भाइयों के साथ तैयार करता था।[c]


    **8.** यदि तुम्हारे पास किसी जरूरतमंद को देने के लिए कुछ न हो, तो दया से भरे अंतरतम के साथ उसके दुःख में सहभागी होओ। **9.** मैं जानता हूँ कि जब मेरे हाथ को किसी जरूरतमंद को देने के लिए कुछ नहीं मिला, तब मैं उसके साथ सात स्तादिया[d] तक चला और रोता रहा; मेरा अंतरतम उसके लिए करुणा से उमड़ पड़ा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 1 में पाल बनाने का वर्णन संक्षिप्त और कुछ अस्पष्ट है। यूनानी पाठ का अधिक शाब्दिक अर्थ है, “मैंने बीच में लकड़ी के एक और सीधे टुकड़े पर कपड़ा तान दिया।”
    reason: textual_or_semantic_ambiguity
  - marker: b
    text: पद 3–5 और पद 6 का अंतिम भाग संस्करण में कोष्ठकों के भीतर छपे हैं, जो यूनानी पाठ-परंपरा में इनके असमान प्रमाण की ओर संकेत करता है।
    reason: textual_variant
  - marker: c
    text: “आधा भाग” किस वस्तु या उपज का है, यह उपलब्ध यूनानी वाक्य में स्पष्ट नहीं है; संभवतः संकेत पकड़ी हुई मछलियों के किसी भाग की ओर है।
    reason: semantic_ambiguity
  - marker: d
    text: सात स्तादिया लगभग 1.3 किलोमीटर है।
    reason: cultural_note
lexical_decisions:
- source_word: ὀθόνη
  choice: कपड़े का पाल
  rationale: मूल अर्थ कपड़े की चादर है, पर लकड़ी के सीधे खंभे पर तानने और नाव में यात्रा करने का प्रसंग इसे पाल के रूप में पहचानता है; ‘कपड़े का’ मूल वस्तु-संकेत को बनाए रखता है।
- source_word: σπλαγχνίζομαι / σπλάγχνα
  choice: करुणा से द्रवित होना / दया से भरा अंतरतम
  rationale: यह शब्द गहरी, अंतःकरण से उठने वाली करुणा का शारीरिक रूपक रखता है। हिन्दी में ‘अंतरतम’ उस गहराई को बचाता है, जबकि ‘करुणा से द्रवित’ स्वाभाविक नैतिक क्रिया व्यक्त करता है।
- source_word: μεταδίδωμι
  choice: हिस्सा देना
  rationale: यह केवल सामान्य दान नहीं, अपनी प्राप्त वस्तु में दूसरे को सहभागी करने का भाव देता है।
- source_word: συναλγῶν καὶ συμπάσχων
  choice: उनके दुःख में दुःखी होता और उनके साथ कष्ट सहता था
  rationale: 'दोनों निकटार्थक क्रियाओं की पुनरुक्ति को बनाए रखा गया है: पीड़ा का अनुभव करना और पीड़ित के साथ उसमें सहभागी होना।'
- source_word: πλησίον
  choice: पड़ोसी
  rationale: नैतिक उपदेश के प्रसंग में यह निकटवर्ती या साथी मनुष्य के लिए पारंपरिक और सहज हिन्दी पद है।
- source_word: στάδιον
  choice: स्तादिया
  rationale: प्राचीन दूरी की इकाई को ऐतिहासिक रूप में रखा गया है और अनुमानित आधुनिक दूरी पादटिप्पणी में दी गई है।
- source_word: ἐξαρκῶν
  choice: आवश्यकता पूरी करता
  rationale: शब्द का भाव पर्याप्त होना या जरूरत पूरी करना है; घराने के लिए आपूर्ति के प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: ἐστρέφετο ... εἰς συμπάθειαν
  choice: करुणा से उमड़ पड़ा
  rationale: शाब्दिक ‘मुड़ गया’ हिन्दी में अस्पष्ट होता; यह चयन भीतर उठने वाली तीव्र सहानुभूति को व्यक्त करता है और σπλάγχνα के अंतरंग रूपक को ‘अंतरतम’ द्वारा बनाए रखता है।
theological_decisions:
- issue: उदारता के प्रत्युत्तर में प्रभु से कई गुना प्राप्त होना
  choice: कारण और प्रतिफल की स्पष्ट उक्ति को ज्यों का त्यों रखा गया है
  alternative: इसे केवल सामान्य आशीष या नैतिक कहावत के रूप में नरम करना
  rationale: यूनानी पाठ मानवीय बाँटने और प्रभु से मिलने वाले बहुगुणित प्रतिफल के बीच प्रत्यक्ष संबंध प्रस्तुत करता है; अनुवाद को इस धार्मिक तनाव को कम नहीं करना चाहिए।
- issue: करुणा का देहगत रूपक
  choice: ‘दया से भरा अंतरतम’ और ‘अंतरतम ... उमड़ पड़ा’
  alternative: केवल ‘उस पर दया करो’
  rationale: मूल में करुणा केवल कर्तव्य नहीं, भीतर तक अनुभव की गई सहभागिता है। स्वाभाविक हिन्दी में रूपक का भाव सुरक्षित रखा गया है।
- issue: अंग्रेज़ी परामर्श-पाठ और प्रदत्त यूनानी स्रोत के विषय-वस्तु का अंतर
  choice: प्रदत्त यूनानी स्रोत का ही अनुवाद किया गया है
  alternative: अंग्रेज़ी POB की अलग विषय-वस्तु और 25 पदों को आधार बनाना
  rationale: निर्देशानुसार मूल-भाषा स्रोत प्राथमिक है। अंग्रेज़ी परत इस यूनानी अंश से मेल नहीं खाती, इसलिए उससे अनुपस्थित सामग्री आयात नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मछली पकड़ने, बाँटने और करुणा के ठोस चित्रों को नहीं समतल किया गया। मूल संस्करण के वर्ग-कोष्ठक मुख्य पाठ में यांत्रिक रूप से नहीं रखे गए, क्योंकि वे कथन का हिस्सा नहीं बल्कि पाठ-साक्ष्य का संपादकीय संकेत हैं; उनकी सूचना [b] में दी गई है। पद 7 की वास्तविक अस्पष्टता को अनुवाद और [c] दोनों में सुरक्षित रखा गया है।
