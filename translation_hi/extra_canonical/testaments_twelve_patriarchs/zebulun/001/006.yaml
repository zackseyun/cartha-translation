base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/006.yaml
  text: But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.
translation:
  language: hi
  text: पर मैं यूसुफ़ के कारण बहुत दिनों तक छिपकर रोता रहा; क्योंकि मैं अपने भाइयों से डरता था—उन सबने मिलकर तय किया था कि जो कोई यह भेद खोले, उसे मार डाला जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “wept in secret”'
  choice: छिपकर रोता रहा
  rationale: उपलब्ध यूनानी अंश इस पद तक संरेखित नहीं है; इसलिए परामर्श-पाठ के भाव को स्वाभाविक हिन्दी में रखा गया है। ‘छिपकर’ गोपनीय ढंग से रोने को स्पष्ट करता है।
- source_word: 'English consultation: “because of Joseph”'
  choice: यूसुफ़ के कारण
  rationale: कारण-संबंध को जानबूझकर व्यापक रखा गया है; यह निश्चय नहीं किया गया कि दुःख केवल यूसुफ़ की कथित मृत्यु, उसके साथ हुए व्यवहार, या अपराधबोध के कारण था।
- source_word: 'English consultation: “disclosed the secret”'
  choice: यह भेद खोले
  rationale: ‘भेद खोलना’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है तथा भाइयों की गुप्त कार्रवाई प्रकट करने का भाव देता है।
- source_word: 'English consultation: “should be put to death”'
  choice: उसे मार डाला जाए
  rationale: मृत्युदंड के निर्णय की कठोरता और कर्मवाच्य अर्थ को सीधे तथा स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: यूसुफ़ के विषय में ज़बुलून की भूमिका और अपराधबोध
  choice: पद में केवल उसके गुप्त शोक और भाइयों के भय को व्यक्त किया गया है।
  alternative: उसके शोक को पश्चात्ताप या व्यक्तिगत निर्दोषता की स्पष्ट घोषणा के रूप में प्रस्तुत करना।
  rationale: परामर्श-पाठ ऐसी धर्मवैचारिक व्याख्या को स्पष्ट नहीं करता; अतः नैतिक तनाव को अनिर्णीत रखा गया है।
- issue: भाइयों के सामूहिक निर्णय का स्वरूप
  choice: ‘उन सबने मिलकर तय किया था’
  alternative: इसे औपचारिक शपथ, न्यायिक आदेश, या वाचा कहना।
  rationale: उपलब्ध पद-साक्ष्य केवल सामूहिक सहमति बताता है; उससे अधिक विशिष्ट धार्मिक या कानूनी अर्थ जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गंभीर और सामान्य पाठक के लिए सहज। उपलब्ध मूल-भाषा सामग्री केवल अध्याय के आरंभ का असंरेखित यूनानी अंश है और 1:6 का यूनानी पाठ नहीं देती। इसलिए मसौदा अंग्रेज़ी POB परामर्श-पाठ पर सावधानी से आधारित है; जहाँ मूल यूनानी की पुष्टि संभव नहीं, वहाँ कोई काल्पनिक पुनर्निर्माण या पाद-टिप्पणी नहीं जोड़ी गई।
