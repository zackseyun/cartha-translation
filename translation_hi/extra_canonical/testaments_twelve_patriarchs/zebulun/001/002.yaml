base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/002.yaml
  text: 'And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.'
translation:
  language: hi
  text: उसने उनसे कहा, “हे जबूलून के पुत्रो, मेरी सुनो;[a] अपने पिता की बातों पर ध्यान दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी अंश यहाँ केवल “उसने उनसे कहा, ‘मेरी सुनो’” तक सुरक्षित है; वचन का शेष भाग परीक्षित अंग्रेज़ी परामर्श-पाठ के आधार पर दिया गया है।
    reason: पांडुलिपि-स्रोत की सीमा को स्पष्ट करना और ऐसी सामग्री को प्रत्यक्ष यूनानी प्रमाणित न बताना जो दिए गए यूनानी अंश में उपस्थित नहीं है।
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप; कर्ता पूर्ववर्ती प्रसंग से समझा जाता है।
- source_word: Ἀκούσατέ μου
  choice: मेरी सुनो
  rationale: आज्ञार्थक बहुवचन और वक्ता की ओर ध्यान देने की पुकार—दोनों को संक्षिप्त, बोलचाल-सुलभ तथा गरिमापूर्ण हिन्दी में रखता है।
- source_word: sons of Zebulun
  choice: हे जबूलून के पुत्रो
  rationale: उपलब्ध यूनानी अंश में ये शब्द आगे दिखाई नहीं देते, पर परीक्षित अंग्रेज़ी परामर्श-पाठ के संबोधन को औपचारिक संबोधन के रूप में सुरक्षित रखा गया है।
- source_word: words of your father
  choice: अपने पिता की बातों
  rationale: ‘बातों’ आधुनिक हिन्दी में स्वाभाविक है और केवल लिखित शब्दों के बजाय पिता के कथनों के व्यापक अर्थ को व्यक्त करता है।
