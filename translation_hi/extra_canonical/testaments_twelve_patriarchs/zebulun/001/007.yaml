  text: Yet when they wanted to kill him, with tears I begged them not to commit this sin.
translation:
  language: hi
  text: फिर भी, जब वे उसे मार डालना चाहते थे, तो मैंने आँसू बहाते हुए उनसे विनती की कि वे यह पाप न करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wanted to kill him (verse-level Greek unavailable)
  choice: उसे मार डालना चाहते थे
  rationale: यह उपलब्ध अंग्रेज़ी परामर्श-पाठ के आशय को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: with tears I begged them (verse-level Greek unavailable)
  choice: मैंने आँसू बहाते हुए उनसे विनती की
  rationale: वक्ता की भावनात्मक अवस्था और उसकी गंभीर प्रार्थना—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: this sin (verse-level Greek unavailable)
  choice: यह पाप
  rationale: नैतिक और धार्मिक अर्थ को बिना किसी अतिरिक्त व्याख्या के सीधे सुरक्षित रखता है।
theological_decisions:
- issue: हत्या की मंशा को ‘पाप’ कहना
  choice: ‘यह पाप’ को यथावत रखा गया
  alternative: ‘ऐसा अपराध’
  rationale: परामर्श-पाठ में प्रयुक्त धार्मिक-नैतिक शब्दावली को बनाए रखना उचित है; ‘अपराध’ कहने से θεολογिक आयाम कम हो सकता था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। उपलब्ध यूनानी अंश केवल अध्याय के आरंभ तक है और इस पद से पद-स्तर पर संरेखित नहीं है; इसलिए मसौदा अंग्रेज़ी POB परामर्श-पाठ के आधार पर सावधानी से तैयार किया गया है। नवीनतम संशोधन में दिया गया दान का पाठ इस संदर्भ और उपलब्ध जबूलून शीर्षक से असंगत है, इसलिए उसे ग्रहण नहीं किया गया।
