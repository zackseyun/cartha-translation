base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/001.yaml
  text: A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.
translation:
  language: hi
  text: जबूलून के उन वचनों की प्रतिलिपि, जो उसने अपनी मृत्यु से पहले अपने पुत्रों को दिए थे—अपने जीवन के एक सौ चौदहवें वर्ष में, यूसुफ की मृत्यु के दो वर्ष बाद।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: वचनों की प्रतिलिपि
  rationale: Ἀντίγραφον का अर्थ लिखित प्रति/प्रतिलिपि और λόγων का अर्थ वचन या कथन है; शीर्षकीय शैली बनाए रखी गई है।
- source_word: διέθετο
  choice: दिए थे
  rationale: यहाँ क्रिया अंतिम निर्देश या वसीयतनुमा वचन देने का भाव रखती है; सरल हिन्दी में ‘दिए थे’ स्वाभाविक है और अत्यधिक कानूनी अर्थ आरोपित नहीं करता।
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: अपनी मृत्यु से पहले
  rationale: यूनानी कालगत वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει
  choice: एक सौ चौदहवें वर्ष में
  rationale: पांडुलिपि-पाठ के क्रम का संख्यात्मक अर्थ 114 है।
- source_word: μετὰ οὖν δύο ἔτη τοῦ θανάτου Ἰωσήφ
  choice: यूसुफ की मृत्यु के दो वर्ष बाद
  rationale: समय-संबंध को सीधे व्यक्त करता है; οὖν यहाँ कथात्मक संयोजक है, जिसका अलग अनुवाद हिन्दी में आवश्यक नहीं।
theological_decisions:
- issue: वक्ता की पहचान और आयु के संबंध में नवीनतम संशोधन का विरोध
  choice: मूल यूनानी के अनुसार ‘जबूलून’ और ‘एक सौ चौदहवें वर्ष’ रखा गया
  alternative: ‘दान’ और ‘एक सौ बीसवें वर्ष’
  rationale: प्रदत्त यूनानी स्रोत स्पष्टतः Ζαβουλών तथा ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ कहता है। नवीनतम संशोधन इस अंश के स्रोत-साक्ष्य से मेल नहीं खाता और संभवतः किसी अन्य वसीयतनामे का पाठ मिला देता है।
- issue: διέθετο का वसीयतनुमा अर्थ
  choice: अपने पुत्रों को दिए थे
  alternative: अपने पुत्रों को आज्ञा दी थी / उनके लिए वसीयत की थी
  rationale: क्रिया में अंतिम निर्देश देने का भाव संभव है, पर औपचारिक कानूनी ‘वसीयत’ या केवल ‘आज्ञा’ कहना अर्थ को अनावश्यक रूप से संकीर्ण कर सकता है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। शीर्षकीय अपूर्ण-वाक्य की प्रकृति सुरक्षित रखी गई है। प्रदत्त संदर्भ 1:1 के अनुसार अगले पद के ‘उसने उनसे कहा: मेरी सुनो’ को शामिल नहीं किया गया।'
