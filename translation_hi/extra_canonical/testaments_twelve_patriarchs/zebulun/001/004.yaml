  text: I do not know that I sinned in my days, except in thought.
translation:
  language: hi
  text: मुझे मालूम नहीं कि मैंने अपने जीवन में मन में पाप करने के सिवा कोई और पाप किया हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: I do not know that I sinned
  choice: मुझे मालूम नहीं कि मैंने…पाप किया हो
  rationale: दिए गए अंग्रेज़ी परामर्श-पाठ की ज्ञान-संबंधी अनिश्चितता को बनाए रखता है; इसे अधिक निश्चित ‘मैंने पाप नहीं किया’ में नहीं बदलता। इस पद का यूनानी पाठ उपलब्ध अंश में संरेखित नहीं है।
- source_word: except in thought
  choice: मन में पाप करने के सिवा
  rationale: विचार या आंतरिक मन के स्तर पर हुए पाप का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है और किसी विशिष्ट प्रकार के विचार को अनावश्यक रूप से नहीं जोड़ता।
- source_word: in my days
  choice: अपने जीवन में
  rationale: सेमेटिक ढंग की समय-अभिव्यक्ति का स्वाभाविक हिन्दी अर्थ देता है।
theological_decisions:
- issue: पापहीनता के दावे और वक्ता के सीमित आत्मज्ञान के बीच तनाव
  choice: ‘मुझे मालूम नहीं कि…’ वाली अनिश्चित अभिव्यक्ति बनाए रखी गई
  alternative: ‘मैंने…कोई पाप नहीं किया’
  rationale: परामर्श-पाठ पूर्ण निष्पापता का सीधा और निरपेक्ष दावा नहीं, बल्कि वक्ता के ज्ञान की सीमा के भीतर कथन करता है; इसलिए तनाव को निर्णीत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्वाभाविक वाक्य-विन्यास। उपलब्ध यूनानी अंश इस पद तक संरेखित नहीं है, इसलिए मसौदा दिए गए परीक्षित अंग्रेज़ी परामर्श-पाठ पर सावधानी से आधारित है।
