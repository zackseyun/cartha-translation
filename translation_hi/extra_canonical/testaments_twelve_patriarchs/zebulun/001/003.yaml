base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/003.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.
translation:
  language: hi
  text: मैं, जबूलून, अपने माता-पिता के लिए एक अच्छा उपहार था; क्योंकि जब मेरा जन्म हुआ, तब मेरे पिता बहुत ही समृद्ध हुए, और भेड़-बकरियाँ और गाय-बैल भी बहुत बढ़ गए, जब उन्होंने चितकबरी छड़ियों के द्वारा अपना हिस्सा पाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह संकेत याकूब द्वारा लाबान के पशुधन में से अपना हिस्सा प्राप्त करने की कथा की ओर है; देखें उत्पत्ति 30:37–43।
    reason: ‘चितकबरी छड़ियों’ की संक्षिप्त और असामान्य अभिव्यक्ति का साहित्यिक संदर्भ स्पष्ट करता है, पर मुख्य पाठ में व्याख्या नहीं जोड़ता।
lexical_decisions:
- source_word: δῶρον ἀγαθόν (परामर्श-पाठ में प्रतिबिंबित)
  choice: एक अच्छा उपहार
  rationale: जबूलून के अपने माता-पिता के लिए ‘अच्छा उपहार’ ठहरने की रूपकात्मक और संभवतः नाम-संबंधी भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ποίμνια καὶ βουκόλια (परामर्श-पाठ में flocks and herds)
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: सामान्य हिन्दी पाठक के लिए पशुओं के दोनों समूहों को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ῥάβδοι ῥανταί (परामर्श-पाठ में speckled rods)
  choice: चितकबरी छड़ियाँ
  rationale: छड़ियों के धब्बेदार/चितकबरे स्वरूप की असामान्य छवि को सामान्यीकृत या हटाए बिना बनाए रखता है।
- source_word: κλῆρος / portion (परामर्श-पाठ में प्रतिबिंबित)
  choice: हिस्सा
  rationale: ‘भाग’ या ‘विरासत’ की अपेक्षा यहाँ पशुधन में प्राप्त निर्धारित अंश के लिए सहज आधुनिक हिन्दी है।
theological_decisions:
- issue: जबूलून के जन्म और याकूब की समृद्धि के बीच संबंध
  choice: 'कथन को कारणात्मक रूप में रखा: ‘क्योंकि जब मेरा जन्म हुआ...’'
  alternative: इसे केवल काल-संयोग के रूप में अनूदित करना
  rationale: परामर्श-पाठ का कारणसूचक संबंध जबूलून को माता-पिता के लिए ‘अच्छा उपहार’ कहे जाने का आधार देता है; इसे कमजोर नहीं किया गया।
- issue: चितकबरी छड़ियों के द्वारा हिस्सा पाने का आशय
  choice: असामान्य कथन को ज्यों का त्यों बनाए रखा
  alternative: उत्पत्ति की कथा समझाने के लिए पशुओं के प्रजनन या परमेश्वर की कृपा का उल्लेख जोड़ना
  rationale: पद स्वयं कार्य-कारण की विस्तृत व्याख्या नहीं करता; इसलिए कोई अतिरिक्त धार्मिक या प्राकृतिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। उपलब्ध यूनानी अंश पद 1:3 तक पदानुसार संरेखित नहीं है, इसलिए मसौदा परामर्श-पाठ में सुरक्षित पद-सामग्री पर आधारित है; जहाँ संभावित यूनानी शब्दावली का उल्लेख है, उसे निर्णायक पाठ-साक्ष्य के बजाय सावधानीपूर्वक प्रतिबिंब के रूप में चिह्नित किया गया है।
