  text: I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.
translation:
  language: hi
  text: 'मुझे याद नहीं कि मैंने कभी कोई अधर्म किया हो, सिवाय उस अनजाने अपराध के जो मैंने यूसुफ के विषय में किया था: मैंने अपने भाइयों को वचन दिया था कि जो कुछ हुआ था, वह अपने पिता को नहीं बताऊँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lawlessness (verse-level Greek not supplied/aligned)
  choice: अधर्म
  rationale: यह सामान्य पाठक के लिए स्वाभाविक और गरिमापूर्ण है तथा केवल किसी विशेष विधि के उल्लंघन तक अर्थ को सीमित नहीं करता।
- source_word: unwitting wrong (verse-level Greek not supplied/aligned)
  choice: अनजाना अपराध
  rationale: यह कृत्य की गलतता और उसके अनजाने स्वरूप—दोनों को बनाए रखता है।
- source_word: pledge (verse-level Greek not supplied/aligned)
  choice: वचन
  rationale: भाइयों के प्रति की गई गंभीर प्रतिबद्धता को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ज़बूलून का अपने आचरण के विषय में दावा
  choice: “मुझे याद नहीं कि मैंने कभी कोई अधर्म किया हो”
  alternative: “मैंने कभी कोई अधर्म नहीं किया”
  rationale: स्मृति से जुड़े दावे को पूर्ण निष्पापता के दावे में नहीं बदला गया।
- issue: यूसुफ के प्रसंग में दोष की प्रकृति
  choice: “अनजाने अपराध”
  alternative: “अनजाने में किया गया पाप”
  rationale: उपलब्ध अंग्रेज़ी परामर्श-पाठ में ‘wrong’ है; इसलिए इसे अधिक स्पष्ट धार्मिक श्रेणी ‘पाप’ में बदलकर तनाव का समाधान नहीं किया गया।
