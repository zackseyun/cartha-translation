  register: आधुनिक मानक हिन्दी; आत्मस्वीकृतिपूर्ण, गंभीर और सहज शैली। उपलब्ध यूनानी अंश केवल अध्याय के आरंभ तक है और इस पद से पद-स्तर पर संरेखित नहीं है, इसलिए मसौदा अंग्रेज़ी POB परामर्श-पाठ के सहारे सावधानी से तैयार किया गया है। नवीनतम संशोधन में दिया गया ‘दान’ संबंधी पाठ इस संदर्भ और उपलब्ध स्रोत से असंबद्ध है, अतः उसका अनुसरण नहीं किया गया।
