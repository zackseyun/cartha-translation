source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ λαβὼν τὸ ἀργύριον κατέδραμεν ὀπίσω τοῖς ἐμπόροις· μὴ εὑρὼν δὲ αὐτοὺς ὑπέστρεψεν ὀδυρόμενος²⁵. καταλιπόντες²⁶ δὲ οἱ ἔμποροι τὴν πλατεῖαν ὁδὸν διόδευσαν²⁷ διὰ *Τρωγλοδιτῶν ἐν συντόμῳ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/006.yaml
  text: And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes.
translation:
  language: hi
  text: और चाँदी लेकर वह व्यापारियों के पीछे दौड़ा। पर जब वे नहीं मिले, तो वह दुःखी होकर लौट आया। व्यापारियों ने मुख्य सड़क छोड़ दी थी और त्रोग्लोदितों के बीच से होकर एक छोटे मार्ग से गए थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“त्रोग्लोदित” एक प्राचीन जनसमूह का नाम है। यूनानी वाक्यांश का अधिक शाब्दिक अर्थ है: “त्रोग्लोदितों के बीच से होकर संक्षिप्त मार्ग से गए।”'
    reason: अपरिचित प्राचीन नाम को स्पष्ट करता है और «त्रोग्लोदितों के बीच/उनके माध्यम से» संबंधी मूल की स्थान-संबंधी गुंजाइश बनाए रखता है।
lexical_decisions:
- source_word: τὸ ἀργύριον
  choice: चाँदी
  rationale: यूनानी शब्द यहाँ धनराशि के रूप में चाँदी को दर्शाता है; स्रोत की ठोस मुद्रा-संबंधी छवि बनाए रखी गई है।
- source_word: κατέδραμεν ὀπίσω τοῖς ἐμπόροις
  choice: व्यापारियों के पीछे दौड़ा
  rationale: पीछा करने के लिए दौड़ने की क्रिया को स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त किया गया है।
- source_word: ὑπέστρεψεν ὀδυρόμενος
  choice: दुःखी होकर लौट आया
  rationale: यूनानी मूल में उपस्थित लौटने और शोकित होने—दोनों भाव सुरक्षित रखे गए हैं, यद्यपि अंग्रेज़ी परामर्श-पाठ में यह अंश छूट गया है।
- source_word: τὴν πλατεῖαν ὁδὸν
  choice: मुख्य सड़क
  rationale: शाब्दिक अर्थ 'चौड़ी सड़क' है, पर प्रसंग में यह सामान्य या प्रमुख मार्ग के विपरीत छोटे मार्ग को सूचित करता है; 'मुख्य सड़क' सहज और अर्थ-संगत है।
- source_word: διὰ Τρωγλοδιτῶν ἐν συντόμῳ
  choice: त्रोग्लोदितों के क्षेत्र से होकर छोटा रास्ता लिया था
  rationale: जनसमूह के नाम को लिप्यंतरित किया गया और हिन्दी में आवश्यक 'क्षेत्र' जोड़कर मार्ग का आशय स्पष्ट किया गया; ἐν συντόμῳ को संक्षिप्त मार्ग के अर्थ में प्रस्तुत किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी मूल में अंग्रेज़ी POB से छूटा हुआ “वह दुःखी होकर लौट आया” पुनः स्थापित किया गया है। पूर्ववर्ती प्रसंग से स्पष्ट एकवचन कर्ता को ‘वह’ ही रहने दिया गया है।
