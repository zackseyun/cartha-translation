  text: But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Dan and Gad might leap up and kill him.
translation:
  language: hi
  text: परन्तु यूसुफ पर दया करके मैंने भोजन नहीं किया और गड्ढे पर निगाह रखता रहा, क्योंकि यहूदा को डर था कि कहीं शिमोन, दान और गाद कूद पड़कर उसे मार न डालें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: दया आई
  rationale: यह कृपा और गहरी करुणा का भाव व्यक्त करता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκ ἔφαγον
  choice: मैंने भोजन नहीं किया
  rationale: यूनानी के सीधे नकारात्मक कथन को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: προσέχων δὲ τῷ λάκκῳ
  choice: बल्कि मैं गड्ढे पर नज़र रखता रहा
  rationale: यह गड्ढे की ओर लगातार ध्यान देने या उसकी निगरानी करने का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποπηδήσαντες
  choice: झपटकर
  rationale: यह अचानक सक्रिय होकर आगे बढ़ने के भाव को व्यक्त करता है; प्रसंग में केवल शाब्दिक 'कूद पड़ना' की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἀνέλωσιν
  choice: मार न डालें
  rationale: इस प्रसंग में क्रिया का आशय हत्या कर देना है, जिसे हिन्दी में स्पष्ट रखा गया है।
