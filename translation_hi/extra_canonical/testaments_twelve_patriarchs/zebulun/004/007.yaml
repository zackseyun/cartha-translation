  text: Reuben was grieved, and he did not eat bread on that day. Then Dan came near and said to him,
translation:
  language: hi
  text: रूबेन दुःखी था और उसने उस दिन रोटी नहीं खाई। तब दान उसके पास आया और उससे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπούμενος
  choice: दुःखी था
  rationale: यह वर्तमान कृदंत रूबेन की उस समय की शोकपूर्ण मनःस्थिति व्यक्त करता है; सरल और स्वाभाविक हिन्दी में इसे ‘दुःखी था’ कहा गया है।
- source_word: ἄρτον
  choice: रोटी
  rationale: यहाँ शब्द भोजन के रूप में खाई जाने वाली रोटी को सूचित करता है; मूल का स्पष्ट कर्म बनाए रखा गया है।
- source_word: προσελθὼν
  choice: पास आया
  rationale: इसका मूल अर्थ निकट आना है; ‘उसके पास आया’ प्रसंग और अगले सर्वनाम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: सम्प्रदान αὐτῷ को हिन्दी में स्वाभाविक रूप से ‘उससे’ व्यक्त किया गया है; कथन अगले पद में जारी रहता है।
