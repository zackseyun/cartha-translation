  text: When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?”
translation:
  language: hi
  text: जब रूबेन आया और उसने सुना कि उसकी अनुपस्थिति में उसे बेच दिया गया था, तब उसने अपना वस्त्र फाड़ लिया और विलाप करते हुए कहा, “मैं अपने पिता याकूब का सामना कैसे करूँगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  choice: उसने अपना कुरता फाड़ लिया
  rationale: χιτών शरीर पर पहना जाने वाला वस्त्र है; ‘कुरता’ आधुनिक हिन्दी में इसका सहज निकटतम रूप है और एकवचन को भी बनाए रखता है।
- source_word: Πῶς ὄψωμαι τὸ πρόσωπον
  choice: मैं ... कैसे मुँह दिखाऊँगा?
  rationale: शाब्दिक अर्थ ‘मैं मुख कैसे देखूँगा?’ है, पर प्रसंग में यह लज्जा और पिता का सामना न कर पाने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: θρηνῶν
  choice: विलाप करते हुए
  rationale: यह शब्द साधारण रोने से अधिक शोकपूर्ण मातम या विलाप को व्यक्त करता है।
