translation:
  language: hi
  text: जब उन्होंने देखा कि मैं भोजन नहीं कर रहा था, तो उन्होंने मुझे उसकी रखवाली करने के लिए लगा दिया, जब तक कि उसे इश्माएलियों को बेच नहीं दिया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρῶντές με δὲ μὴ ἐσθίοντα
  choice: जब उन्होंने देखा कि मैं भोजन नहीं कर रहा था
  rationale: ग्रीक कृदंत-वाक्यांश को स्वाभाविक हिन्दी काल-वाक्य में व्यक्त किया गया है; δέ यहाँ कथा को आगे बढ़ाता है और इसके लिए अलग से ‘परन्तु’ कहना आवश्यक नहीं है।
- source_word: ἔθετό με τηρεῖν αὐτόν
  choice: उन्होंने मुझे उसकी रखवाली करने के लिए लगा दिया
  rationale: τίθημι के नियुक्त करने/काम पर लगाने के भाव और τηρεῖν के पहरा देने अथवा सुरक्षित निगरानी रखने के भाव को सहज हिन्दी में रखा गया है।
- source_word: ἕως οὗ ἀπεδόθη τοῖς Ἰσμαηλίταις
  choice: जब तक कि उसे इश्माएलियों के हाथ बेच नहीं दिया गया
  rationale: ἀποδίδωμι यहाँ बिक्री के लिए सौंपे जाने का अर्थ देता है। τοῖς Ἰσμαηλίταις को मूल यूनानी के अनुसार स्पष्ट रूप से शामिल किया गया है, यद्यपि परामर्शी अंग्रेज़ी पाठ में यह पद छूट गया है।
