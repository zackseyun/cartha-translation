source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '4. (α-text omits this verse; β-text reads: ἐποίησε δὲ ἐν τῷ λάκκῳ τρεῖς ἡμέρας καὶ τρεῖς νύκτας καὶ οὕτως ἐπράθη ἄσιτος.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/004.yaml
  text: He spent three days and three nights in the pit, and so he was sold while fasting.
translation:
  language: hi
  text: '[a] उसने गड्ढे में तीन दिन और तीन रातें बिताईं, और इस तरह वह भूखा ही बेच दिया गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद α-पाठ में नहीं है; β-पाठ में पाया जाता है।
    reason: मूल संस्करण में स्पष्ट पाठांतर है, इसलिए पद की पांडुलिपीय स्थिति पाठक को बताना आवश्यक है।
lexical_decisions:
- source_word: ἐποίησε ... ἐν τῷ λάκκῳ
  choice: गड्ढे में ... बिताईं
  rationale: समयवाचक पद ‘तीन दिन और तीन रातें’ के साथ ποιέω का स्वाभाविक हिन्दी अर्थ ‘बिताना’ है।
- source_word: ἐπράθη
  choice: बेच दिया गया
  rationale: यूनानी क्रिया का कर्मवाच्य और भूतकालीन अर्थ सुरक्षित रखा गया है।
- source_word: ἄσιτος
  choice: भूखा ही
  rationale: शाब्दिक अर्थ ‘बिना भोजन किए’ है; प्रसंग में ‘भूखा ही’ सहज और सटीक है तथा ‘उपवास’ जैसा संभावित धार्मिक आशय नहीं जोड़ता।
theological_decisions:
- issue: ἄσιτος में स्वैच्छिक उपवास अथवा भोजन से वंचित रहने का अर्थ
  choice: भूखा ही
  alternative: उपवास करते हुए
  rationale: मूल शब्द केवल भोजन न करने/न मिलने की अवस्था बताता है; स्वैच्छिक धार्मिक उपवास निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘तीन दिन और तीन रातें’ की मूल पुनरुक्त संरचना तथा कर्मवाच्य बनाए रखे गए हैं।
