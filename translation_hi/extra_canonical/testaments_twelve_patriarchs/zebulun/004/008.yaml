translation:
  language: hi
  text: “मत रो और दुखी मत हो; क्योंकि हमने ढूँढ़ निकाला है कि हम अपने पिता से क्या कहें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ κλαῖε μηδὲ λυποῦ
  choice: मत रो और न दुखी हो
  rationale: दोनों समानांतर निषेधों को सहज आधुनिक हिन्दी में अलग-अलग बनाए रखा गया है।
- source_word: εὕρομεν
  choice: हमने यह सोच लिया है
  rationale: शाब्दिक अर्थ ‘हमने पा लिया’ है, पर τί εἴπωμεν के साथ इसका आशय उपाय या उत्तर सोच लेने का है; हिन्दी में यह प्रयोग अधिक स्वाभाविक है।
- source_word: τί εἴπωμεν
  choice: क्या कहें
  rationale: ग्रीक विचारवाचक परोक्ष प्रश्न और संभाव्य भाव को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: τῷ πατρὶ ἡμῶν
  choice: अपने पिता से
  rationale: कहने की दिशा के लिए हिन्दी में ‘से’ स्वाभाविक है; ‘अपने’ सामूहिक ‘हमारे’ संबंध को स्पष्ट करता है।
