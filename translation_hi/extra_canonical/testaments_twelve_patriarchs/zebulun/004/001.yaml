source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. *Ἤκουσαν γὰρ ὅσα ἐνεδείξαντο αὐτῷ κακά⁵⁰. IV. Μετὰ δὲ τὸ †πραθῆναι¹ αὐτὸν ἐκάθησαν οἱ ἀδελφοί μου² ἐσθίειν καὶ πίνειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/001.yaml
  text: For they had heard how much evil had been done against him. And after he had been thrown into the pit, my brothers sat down to eat and drink.
translation:
  language: hi
  text: क्योंकि उन्होंने सुन लिया था कि उसके विरुद्ध कितने बुरे काम किए गए थे। उसके बेचे जाने[a] के बाद मेरे भाई खाने-पीने बैठ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्रदत्त यूनानी पाठ में “बेचे जाने” है, लेकिन संपादक ने इस शब्द को पाठगत रूप से संदिग्ध चिह्नित किया है। एक वैकल्पिक पाठगत समाधान है: “गड्ढे में डाले जाने।”'
    reason: यूनानी संस्करण का † चिह्न पाठगत अनिश्चितता बताता है। मुख्य पाठ उपलब्ध यूनानी शब्द का अनुवाद करता है, जबकि पाद-टिप्पणी वैकल्पिक पाठगत समाधान को स्पष्ट करती है।
lexical_decisions:
- source_word: ὅσα … κακά
  choice: कितनी बुराइयाँ
  rationale: यह यूनानी पद किए गए अनेक बुरे कामों की मात्रा/व्याप्ति व्यक्त करता है; सहज हिन्दी में इसे ‘कितनी बुराइयाँ’ कहा गया है।
- source_word: ἐνεδείξαντο αὐτῷ
  choice: उसके साथ … की गई थीं
  rationale: शाब्दिक रूप ‘उन्होंने उसके प्रति दिखाईं/कीं’ हिन्दी में असहज है। कर्मवाच्य रचना पीड़ित पर किए गए बुरे व्यवहार को स्वाभाविक ढंग से व्यक्त करती है, यद्यपि कर्ता को स्पष्ट नहीं करती।
- source_word: πραθῆναι
  choice: बेचे जाने
  rationale: उपलब्ध यूनानी पाठ में क्रिया πιπράσκω का कर्मवाच्य रूप है, जिसका अर्थ ‘बेचा जाना’ है; इसलिए अंग्रेज़ी परामर्श-पाठ के ‘गड्ढे में फेंके जाने’ के बजाय स्रोत-पाठ का अनुसरण किया गया है।
- source_word: ἐσθίειν καὶ πίνειν
  choice: खाने-पीने
  rationale: यूनानी के दो समन्वित क्रियार्थों को हिन्दी के स्वाभाविक संयुक्त पद में रखा गया है।
theological_decisions:
- issue: 'यूसुफ के साथ हुई घटना: बेचा जाना या गड्ढे में डाला जाना'
  choice: मुख्य पाठ में ‘बेचे जाने’
  alternative: ‘गड्ढे में डाले जाने’
  rationale: प्रदत्त यूनानी पाठ πραθῆναι स्पष्टतः ‘बेचे जाने’ कहता है, हालाँकि संपादकीय † पाठ-संदेह दर्शाता है और अंग्रेज़ी POB एक भिन्न पाठगत समाधान अपनाता है। स्रोत-साक्ष्य को प्राथमिकता देते हुए मुख्य पाठ में ‘बेचे जाने’ रखा और अनिश्चितता पाद-टिप्पणी में बताई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘खाने-पीने बैठ गए’ सामान्य पाठक के लिए स्वाभाविक है। पहले वाक्य में कर्मवाच्य प्रयोग से यूनानी की कुछ कर्ता-संबंधी अस्पष्टता बनी रहती है।
