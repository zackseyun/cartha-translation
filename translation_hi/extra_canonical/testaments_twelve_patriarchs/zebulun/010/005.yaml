  text: And now, my children, do not be grieved that I am dying, nor fall down that I am coming to my end.
translation:
  language: hi
  text: और अब, मेरे बच्चो, इस बात से दुखी न हो कि मैं मर रहा हूँ, और न इस बात से गिर पड़ो कि मैं अपने अंत पर पहुँच रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: प्रत्यक्ष संबोधन में स्वाभाविक आधुनिक हिन्दी; यूनानी के आत्मीय पारिवारिक भाव को बनाए रखता है।
- source_word: μὴ λυπεῖσθε
  choice: दुखी न हो
  rationale: λυπέομαι के भावात्मक अर्थ को सरल और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: μηδὲ συμπέσητε
  choice: और न ... टूटकर गिर पड़ो
  rationale: συμπίπτω के शाब्दिक ‘गिर पड़ना’ और प्रसंगगत ‘शोक से टूट जाना’—दोनों आयामों को बचाता है।
- source_word: ἀπολήγω
  choice: अंत पर पहुँचने
  rationale: क्रिया का ‘समाप्त होना/अंत तक पहुँचना’ अर्थ सुरक्षित है और मृत्यु के समानांतर कथन को अनावश्यक रूप से पूरी तरह समान नहीं बनाता।
