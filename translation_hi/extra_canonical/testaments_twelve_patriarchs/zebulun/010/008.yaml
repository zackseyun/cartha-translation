  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/008.yaml
  text: But as for me, now I hasten to my rest, as also my fathers did.
translation:
  language: hi
  text: परन्तु मैं अब अपने विश्राम की ओर शीघ्रता से जा रहा हूँ, जैसे मेरे पूर्वज भी गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάπαυσίν
  choice: विश्राम
  rationale: यह शब्द मृत्यु के लिए प्रयुक्त सौम्य रूपक को बनाए रखता है और हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ἀποτρέχω
  choice: शीघ्रता से जा रहा हूँ
  rationale: क्रिया में निहित शीघ्र आगे बढ़ने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘जा रहा हूँ’ कहने से उसकी तीव्रता खो जाती।
- source_word: οἱ πατέρες μου
  choice: मेरे पूर्वज
  rationale: यहाँ बहुवचन का आशय पहले मर चुके पितृपुरुषों से है; ‘पूर्वज’ आधुनिक हिन्दी में इस सामूहिक अर्थ को स्पष्ट और सहज रूप से देता है।
theological_decisions:
- issue: ‘विश्राम’ का मृत्यु से संबंध
  choice: मूल रूपक ‘विश्राम’ को बनाए रखा गया
  alternative: ‘मृत्यु’ या ‘कब्र’ को स्पष्ट रूप से कहना
  rationale: ग्रीक पाठ मृत्यु को प्रत्यक्ष रूप से नहीं कहता; वह ‘अपने विश्राम’ की ओर जाने की भाषा रखता है। अनुवाद उस धार्मिक और साहित्यिक अर्थ-व्यंजना को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य। ‘परन्तु मैं’ से ἐγὼ δὲ का विरोधात्मक बल, ‘अब’ से νῦν, और ‘जैसे…भी’ से ὡς καὶ सुरक्षित रखा गया है।
