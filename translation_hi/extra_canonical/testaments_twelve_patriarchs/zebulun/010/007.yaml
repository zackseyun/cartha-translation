- from: परन्तु प्रभु भक्तिहीनों पर अनन्त आग लाएगा और पीढ़ी-दर-पीढ़ी उनका नाश करेगा।
  to: परन्तु प्रभु अभक्तों पर अनन्त अग्नि लाएगा, और पीढ़ियों की पीढ़ियों तक उनका नाश करेगा।
