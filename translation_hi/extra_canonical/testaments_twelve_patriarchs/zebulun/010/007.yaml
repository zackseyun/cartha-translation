review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the two distinct temporal expressions: πῦρ αἰώνιον as “अनन्त …” and ἕως γενεὰς γενεῶν without conflating it with the preceding phrase. The future actions and the object of destruction are retained. A more explicit Hindi duration phrase better represents the Greek generational idiom.'
  naturalness: “भक्तिहीनों” and “अनन्त आग” are understandable, but “अभक्तों” and the dignified “अनन्त अग्नि” are more idiomatic for modern standard Hindi scripture register. “पीढ़ियों की पीढ़ियों तक” more clearly conveys the source expression than the somewhat looser “पीढ़ी-दर-पीढ़ी.”
  terminology: “अभक्त” suitably conveys ἀσεβεῖς here without importing a more specific doctrinal category such as “अधर्मी.” “अनन्त अग्नि” directly reflects πῦρ αἰώνιον. The generational phrase is retained rather than interpreted as simply “forever.”
  issues:
  - severity: low
    issue: The duration phrase is somewhat compressed.
    rationale: “पीढ़ी-दर-पीढ़ी” can suggest repetition, but does not explicitly mark the extent expressed by ἕως γενεὰς γενεῶν. “पीढ़ियों की पीढ़ियों तक” preserves the source's idiom and ambiguity more closely.
  - severity: low
    issue: Two lexical choices are less natural in the intended register.
    rationale: “भक्तिहीनों” is intelligible but less idiomatic than “अभक्तों” for ἀσεβεῖς, and “अनन्त अग्नि” is more elevated and scripturally natural than “अनन्त आग.”
  revised_text: परन्तु प्रभु अभक्तों पर अनन्त अग्नि लाएगा, और पीढ़ियों की पीढ़ियों तक उनका नाश करेगा।
