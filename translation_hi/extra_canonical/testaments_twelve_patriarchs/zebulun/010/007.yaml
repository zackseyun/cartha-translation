base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/007.yaml
  text: But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations.
translation:
  language: hi
  text: परन्तु प्रभु अभक्तों पर अनन्त अग्नि लाएगा, और पीढ़ियों की पीढ़ियों तक उनका नाश करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: भक्तिहीनों
  rationale: यह शब्द उन लोगों को दर्शाता है जिनमें परमेश्वर के प्रति श्रद्धा और भक्ति नहीं है; ‘भक्तिहीन’ आधुनिक हिन्दी में इसका संक्षिप्त और स्वाभाविक रूप है।
- source_word: πῦρ αἰώνιον
  choice: अनन्त आग
  rationale: ग्रीक पदबंध के कालगत बल को सीधे बनाए रखता है और पाठ में निहित न्याय की गंभीरता को कम नहीं करता।
- source_word: ἕως γενεὰς γενεῶν
  choice: पीढ़ी-दर-पीढ़ी
  rationale: ग्रीक की पुनरुक्त पीढ़ी-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है; इसे सीधे ‘सदा के लिए’ बनाकर संभावित अर्थ-भेद को समाप्त नहीं किया गया।
theological_decisions:
- issue: अनन्त आग और नाश के कालगत संबंध
  choice: ‘अनन्त आग’ तथा ‘पीढ़ी-दर-पीढ़ी उनका नाश करेगा’ को अलग-अलग उसी तनाव के साथ रखा गया है।
  alternative: दोनों को मिलाकर ‘सदा के लिए नष्ट कर देगा’ कहना।
  rationale: मूल यूनानी में आग के लिए αἰώνιον और नाश के लिए ἕως γενεὰς γενεῶν प्रयुक्त हैं; अनुवाद ने दोनों अभिव्यक्तियों को एक ही कालगत सूत्र में समतल नहीं किया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘परन्तु’ विरोधसूचक δέ को व्यक्त करता है; वाक्य का भविष्यकाल और न्यायपरक स्वर सुरक्षित रखा गया है।
