source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ ταῦτα εἰπὼν ἐκοιμήθη [†ὕπνῳ²⁴ καλῷ], καὶ ἔθηκαν αὐτὸν *οἱ υἱοὶ αὐτοῦ²⁵ *εἰς θήκην ξυλίνην²⁶. 7. Ὕστερον δὲ *ἀναγαγόντες ἔθαψαν αὐτὸν ἐν Χεβρών²⁷ μετὰ τῶν πατέρων αὐτοῦ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/010.yaml
  text: And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.
translation:
  language: hi
  text: और ये बातें कहकर वह सो गया, और उसके पुत्रों ने उसे लकड़ी के एक ताबूत में रख दिया। बाद में वे उसे ऊपर ले गए और हेब्रोन में उसके पूर्वजों के साथ दफ़ना दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: वह सो गया
  rationale: यूनानी क्रिया का शाब्दिक अर्थ ‘सो गया’ है और यहाँ मृत्यु के लिए प्रयुक्त सौम्य रूपक को बनाए रखता है।
- source_word: θήκην ξυλίνην
  choice: लकड़ी का एक ताबूत
  rationale: θήκη संदर्भ में शव रखने की पेटी है; ξυλίνη स्पष्ट करता है कि वह लकड़ी की थी।
- source_word: ἀναγαγόντες
  choice: ऊपर ले गए
  rationale: क्रिया में ऊपर की ओर ले जाने का भाव है; इसे केवल ‘ले गए’ करके भौगोलिक संकेत को हटाया नहीं गया।
- source_word: τῶν πατέρων αὐτοῦ
  choice: उसके पूर्वजों
  rationale: सेमिटिक-यूनानी प्रयोग में ‘पिता’ यहाँ व्यापक वंशगत अर्थ रखता है; स्वाभाविक हिन्दी में ‘पूर्वज’ अभिप्रेत अर्थ देता है।
theological_decisions:
- issue: ἐκοιμήθη में मृत्यु का रूपक
  choice: सो गया
  alternative: मर गया
  rationale: मूल पाठ मृत्यु को सीधे न कहकर निद्रा के रूपक से व्यक्त करता है; अनुवाद उसी तनाव और शैली को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘दफ़ना दिया’ सामान्य और स्पष्ट है; कोई पंथ-विशिष्ट शब्दावली नहीं जोड़ी गई।
