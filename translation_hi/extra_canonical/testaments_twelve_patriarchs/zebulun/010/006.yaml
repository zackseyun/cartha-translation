  text: 2. Ἀναστήσομαι γὰρ⁴ πάλιν *ἐν μέσῳ⁵ ὑμῶν, ⌈ὡς ἡγούμενος *ἐν μέσῳ⁶ υἱῶν δικαιοσύνης⌉, καὶ⁷ εὐφρανθήσομαι⁸ *ἐν μέσῳ⁹ τῆς φυλῆς μου, *οἵτινες φυλάξουσιν¹⁰ νόμον Κυρίου [καὶ ἐντολὰς¹¹ Ζαβουλὼν πατρὸς αὐτῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
translation:
  language: hi
  text: क्योंकि मैं फिर तुम्हारे बीच उठूँगा, धार्मिकता के पुत्रों के बीच एक अगुवे के रूप में; और मैं अपने गोत्र के बीच आनन्दित होऊँगा—वे जो प्रभु की व्यवस्था और अपने पिता जबूलून की आज्ञाओं का पालन करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और अपने पिता जबूलून की आज्ञाओं” शब्द दिए गए यूनानी संस्करण में पाठगत अनिश्चितता दर्शाने वाले कोष्ठकों में हैं।
    reason: स्रोत संस्करण द्वारा कोष्ठकित अंतिम वाक्यांश की पाठगत अनिश्चितता को पारदर्शी रूप से दिखाना।
lexical_decisions:
- source_word: Ἀναστήσομαι ... πάλιν
  choice: मैं फिर ... जी उठूँगा
  rationale: क्रिया ἀνίστημι और πάλιν का संयुक्त अर्थ ‘फिर उठना’ है; मृत्यु के बाद के इस वसीयतनुमा संदर्भ में ‘जी उठूँगा’ स्वाभाविक हिन्दी है।
- source_word: ἐν μέσῳ ὑμῶν
  choice: तुम्हारे बीच
  rationale: स्थान और समुदाय के भीतर उपस्थिति—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ὡς ἡγούμενος
  choice: एक अगुवे के रूप में
  rationale: ἡγούμενος नेतृत्व करने वाले व्यक्ति को दर्शाता है; ‘अगुवा’ अर्थ को बिना अतिरिक्त शासकीय आशय जोड़े रखता है।
- source_word: υἱῶν δικαιοσύνης
  choice: धार्मिकता के पुत्रों
  rationale: मूल सामी-प्रभावित संबंधवाचक पदबंध को बनाए रखा गया है; इसे केवल ‘धर्मी लोगों’ में समतल नहीं किया गया।
- source_word: φυλῆς μου
  choice: अपने गोत्र
  rationale: φυλή इस प्रसंग में इस्राएली वंश-समूह अर्थात गोत्र को सूचित करता है।
- source_word: φυλάξουσιν
  choice: पालन करेंगे
  rationale: व्यवस्था और आज्ञाओं को मानने तथा सुरक्षित रखने के व्यावहारिक भाव के लिए स्वाभाविक हिन्दी।
- source_word: νόμον Κυρίου
  choice: प्रभु की व्यवस्था
  rationale: νόμος का इस यहूदी धार्मिक संदर्भ में प्रचलित और अर्थ-सटीक अनुवाद ‘व्यवस्था’ है।
theological_decisions:
- issue: Ἀναστήσομαι πάλιν में पुनरुत्थान का संकेत
  choice: फिर ... जी उठूँगा
  alternative: फिर उठ खड़ा होऊँगा
  rationale: निकट संदर्भ में मृत्यु के बाद पुनः उठने का आशय प्रबल है। फिर भी किसी विस्तृत पुनरुत्थान-सिद्धान्त को पद में नहीं जोड़ा गया।
- issue: ‘धार्मिकता के पुत्रों’ की पहचान
  choice: मूल पदबंध को यथावत रखा
  alternative: धर्मी लोग
  rationale: यह पदबंध किसी विशिष्ट समुदाय या गुण-संबंध को संकेत कर सकता है; व्याख्यात्मक सरलीकरण से उसकी सम्भावित धर्मवैचारिक गूँज मिट सकती थी।
- issue: अन्तिम वाक्यांश की पाठगत अनिश्चितता
  choice: मुख्य पाठ में रखा और पादटिप्पणी से चिह्नित किया
  alternative: मुख्य पाठ से हटाना
  rationale: दिए गए यूनानी संस्करण में यह वाक्यांश कोष्ठकित है, जबकि उपलब्ध पाठ-साक्ष्य और परामर्श-पाठ इसे सम्मिलित करते हैं; इसलिए इसे हटाए बिना अनिश्चितता बताई गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गोत्र’, ‘व्यवस्था’ और ‘धार्मिकता के पुत्र’ जैसे प्रसंग-सापेक्ष बाइबलीय पदों को संरक्षित किया गया है; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए लंबे यूनानी वाक्य को दो वाक्यों में बाँटा गया है।
