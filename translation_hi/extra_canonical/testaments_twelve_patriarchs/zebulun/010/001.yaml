source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: καὶ ἐπιστρέψετε⁵² *εἰς τὴν γῆν⁵³ ὑμῶν⁵⁴, καὶ ὄψεσθε αὐτὸν⁵⁵ ἐν Ἱερουσαλὴμ ⌈διὰ τὸ ὄνομα αὐτοῦ *τὸ ἅγιον⁵⁶⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/001.yaml
  text: And you will return to your land, and you will see him in Jerusalem because of his holy name.
translation:
  language: hi
  text: और तुम अपने देश में लौटोगे, और यरूशलेम में उसे उसके पवित्र नाम के कारण देखोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψετε
  choice: लौटोगे
  rationale: भविष्यकालीन अर्थ और अपने देश की ओर वापस जाने की स्वाभाविक हिन्दी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: γῆν
  choice: देश
  rationale: यहाँ γῆ का आशय उनकी अपनी भूमि/देश से है; आधुनिक हिन्दी में “अपने देश” अधिक सहज है।
- source_word: ὄψεσθε
  choice: देखोगे
  rationale: मध्य-रूप का सामान्य भविष्यकालीन अर्थ “तुम देखोगे” है।
- source_word: διὰ τὸ ὄνομα αὐτοῦ τὸ ἅγιον
  choice: उसके पवित्र नाम के कारण
  rationale: διά के कारणवाचक अर्थ को बिना अतिरिक्त व्याख्या के सीधे व्यक्त करता है।
theological_decisions:
- issue: αὐτόν (‘उसे’) का संदर्भ
  choice: उसे
  alternative: संदर्भित व्यक्ति का नाम जोड़ना
  rationale: इस पद में व्यक्ति का नाम स्पष्ट नहीं है; सर्वनाम बनाए रखने से मूल की संदर्भगत अस्पष्टता सुरक्षित रहती है।
- issue: “उसके पवित्र नाम के कारण” का संबंध
  choice: वाक्य के अंत में कारणवाचक पदबंध
  alternative: इसे केवल यरूशलेम अथवा केवल देखने की क्रिया से स्पष्ट रूप से जोड़ना
  rationale: यूनानी वाक्यांश का सटीक संबंध कुछ हद तक खुला है; हिन्दी क्रम मूल अर्थ को स्वाभाविक रखते हुए उसे अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी के निकट। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
