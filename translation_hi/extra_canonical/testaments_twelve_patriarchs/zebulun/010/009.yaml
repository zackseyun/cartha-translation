source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Ὑμεῖς δὲ φοβεῖσθε Κύριον¹⁹ [τὸν θεὸν ἡμῶν²⁰ ἐν πάσῃ ἰσχύι ὑμῶν²¹ πάσας τὰς²² ἡμέρας τῆς ζωῆς ὑμῶν]²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/009.yaml
  text: But you, fear the Lord our God with all your strength all the days of your life.
translation:
  language: hi
  text: पर तुम प्रभु—हमारे परमेश्वर—का भय अपनी सारी शक्ति से अपने जीवन के सभी दिनों में मानो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्रोत संस्करण में ‘हमारे परमेश्वर’ से लेकर पद के अंत तक का अंश कोष्ठकों में है, जो इसके पाठगत रूप पर अनिश्चितता दर्शाता है।
    reason: मुद्रित यूनानी स्रोत में दिए गए कोष्ठकों को पाठक के सामने पारदर्शी रूप से रखना।
lexical_decisions:
- source_word: φοβεῖσθε
  choice: भय मानो
  rationale: यह आज्ञात्मक क्रिया परमेश्वर के प्रति श्रद्धापूर्ण भय और आज्ञाकारिता का भाव रखती है; ‘भय मानो’ इस धार्मिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Κύριον τὸν θεὸν ἡμῶν
  choice: प्रभु—हमारे परमेश्वर—का
  rationale: ‘हमारे परमेश्वर’ को ‘प्रभु’ के समानाधिकरण के रूप में रखा गया है, जिससे दोनों यूनानी पद सुरक्षित रहते हैं और उन्हें दो अलग सत्ताओं के रूप में पढ़ने की गुंजाइश नहीं बनती।
- source_word: ἐν πάσῃ ἰσχύι ὑμῶν
  choice: अपनी सारी शक्ति से
  rationale: यह स्रोत के पूर्ण समर्पण अथवा सामर्थ्य के भाव को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς ὑμῶν
  choice: अपने जीवन के सभी दिनों में
  rationale: स्रोत के ‘सभी दिन’ वाले ठोस समय-संबंधी रूप को संक्षिप्त ‘जीवन भर’ में विलीन किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘प्रभु’ और ‘हमारे परमेश्वर’ का संबंध
  choice: ‘हमारे परमेश्वर’ को ‘प्रभु’ का समानाधिकरण माना गया
  alternative: ‘प्रभु हमारे परमेश्वर’ को एक संयुक्त उपाधि की तरह लिखना
  rationale: यूनानी कारक-सामंजस्य दोनों पदों को एक ही संबोधित सत्ता के रूप में प्रस्तुत करता है; डैश हिन्दी में इस संबंध को स्पष्ट रखते हुए अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ते।
- issue: श्रद्धापूर्ण भय का अर्थ
  choice: ‘भय मानो’
  alternative: ‘आदर करो’
  rationale: केवल ‘आदर’ कहना φοβεῖσθε में निहित भय के वास्तविक तनाव को घटा देता; चुना हुआ रूप श्रद्धा और भय दोनों की संभावना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर आज्ञात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध है। ‘अपने जीवन के सभी दिनों में’ स्रोत की संरचना को अपेक्षाकृत निकटता से रखता है।
