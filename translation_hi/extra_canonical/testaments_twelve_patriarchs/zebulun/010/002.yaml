id: T12P.ZEB.10.2
reference: Testament of Zebulun 10:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἴασις *καὶ εὐσπλαγχνία⁵⁷ ἐν⁵⁸ ταῖς πτέρυξιν αὐτοῦ. Αὐτὸς λυτρώσεται πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων ἐκ τοῦ Βελίαρ καὶ πᾶν πνεῦμα πλάνης πατηθήσεται⁵⁹.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/002.yaml
  text: And healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deception will be trampled down.
translation:
  language: hi
  text: और चंगाई और करुणा उसके पंखों में होंगी। वह स्वयं मनुष्यों की हर बंधुआई को बेलियार से छुड़ाएगा, और धोखे की हर आत्मा पैरों तले रौंदी जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴασις
  choice: चंगाई
  rationale: यह रोग या टूटन से स्वस्थ किए जाने का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εὐσπλαγχνία
  choice: करुणा
  rationale: यह गहरी दयालु सहानुभूति का सामान्य और स्पष्ट हिन्दी पर्याय है।
- source_word: πτέρυξιν
  choice: पंखों
  rationale: मूल के रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: λυτρώσεται
  choice: छुड़ाएगा
  rationale: यह मुक्ति या छुटकारे की क्रिया को सहज हिन्दी में व्यक्त करता है और वाक्य में ἐκ τοῦ Βελίαρ के साथ स्वाभाविक बैठता है।
- source_word: αἰχμαλωσίαν
  choice: बंधुआई
  rationale: यह कैद अथवा पराधीन दशा का सामूहिक भाव बनाए रखता है; इसे बंदियों में बदलकर अर्थ को व्यक्तियों तक सीमित नहीं करता।
- source_word: Βελίαρ
  choice: बेलियार
  rationale: व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण।
- source_word: πνεῦμα πλάνης
  choice: भरमाने वाली हर आत्मा
  rationale: संबंधवाचक पदबंध की संभावित सक्रिय शक्ति—भटकाने या भ्रम में डालने वाली आत्मा—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πατηθήσεται
  choice: पैरों तले रौंदी जाएगी
  rationale: मूल के दमन और पराजय के सशक्त निष्क्रिय रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: αἰχμαλωσίαν का आशय
  choice: हर बंधुआई
  alternative: सभी बंदियों
  rationale: मूल अमूर्त संज्ञा 'बंधुआई/कैद' रखता है; इसलिए व्यक्तियों का अर्थ मानकर चुपचाप स्पष्ट नहीं किया गया।
- issue: πνεῦμα πλάνης की संबंधवाचक अस्पष्टता
  choice: भरमाने वाली हर आत्मा
  alternative: भ्रम की हर आत्मा
  rationale: πλάνη भ्रम, भटकाव या छलना का भाव दे सकता है। चयन हिन्दी में अर्थपूर्ण है, पर किसी विशिष्ट दुष्टात्मा-सिद्धांत को आरोपित नहीं करता।
- issue: αὐτός का बल
  choice: वह स्वयं
  alternative: वही
  rationale: कर्तृवाचक सर्वनाम के स्पष्ट बल को बनाए रखा गया है, बिना उसकी पहचान को पाठ से आगे निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। भविष्यकाल और निष्क्रिय वाच्य को मूल के अनुरूप रखा गया है। 'पंखों' का रूपक ज्यों का त्यों सुरक्षित है।
