  naturalness: The wording is generally natural, dignified modern Hindi. 'बंधुआई' is appropriate in this elevated, scriptural register for the abstract condition of captivity, and 'पैरों तले रौंदी जाएगी' naturally conveys the crushing image.
  terminology: '''चंगाई,'' ''करुणा,'' ''पंखों,'' ''बंधुआई,'' and ''बेलियार'' are suitable. Replacing the active explanatory phrase for πνεῦμα πλάνης with ''धोखे की हर आत्मा'' better preserves the source construction and aligns with the English audit trail''s ''spirit of deception.'''
