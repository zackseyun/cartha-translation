source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἐπιστρέψει *πάντα τὰ⁶⁰ ἔθνη εἰς παραζήλωσιν αὐτοῦ⁶¹, καὶ ὄψεσθε *θεὸν ἐν σχήματι ἀνθρώπου⁶² *ὃν ἂν ἐκλέξηται Κύριος Ἱερουσαλὴμ ὄνομα αὐτῷ⁶³.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/003.yaml
  text: And he will turn all the nations to his jealousy, and you will see God in human form, whom the Lord will choose for him—Jerusalem is his name.
translation:
  language: hi
  text: और वह सब राष्ट्रों को उसकी ईर्ष्या की ओर मोड़ेगा[a], और तुम परमेश्वर को मनुष्य के रूप में देखोगे, जिसे प्रभु उसके लिए चुनेगा। “यरूशलेम” उसका नाम है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ईर्ष्या” के लिए प्रयुक्त यूनानी शब्द का अर्थ प्रतिस्पर्धी जलन या किसी का अनुकरण करने के लिए जागा उत्साह भी हो सकता है।
    reason: παραζήλωσις की वास्तविक अर्थ-सीमा को बनाए रखना और इसे केवल सकारात्मक ‘उत्साह’ के रूप में सीमित न करना।
  - marker: b
    text: इस यूनानी अंश की वाक्य-रचना कठिन है। “जिसे,” “उसके लिए” और “उसका” किस-किस की ओर संकेत करते हैं, यह निश्चित नहीं है; “यरूशलेम उसका नाम है” का पिछले वाक्य से संबंध भी अस्पष्ट है।
    reason: स्रोत में सर्वनामों के संदर्भ और अंतिम नाम-वाक्य की संबद्धता अनिश्चित है; अनुवाद में इसे चुपचाप सुलझाना उचित नहीं।
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: मोड़ेगा
  rationale: क्रिया का मूल भाव दिशा या दशा बदलने का है; यहाँ राष्ट्रों को किसी भाव की ओर प्रवृत्त करने का अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: παραζήλωσιν
  choice: ईर्ष्या
  rationale: शब्द में ईर्ष्या, प्रतिस्पर्धी जलन अथवा अनुकरण के लिए उकसने का अर्थ हो सकता है। संदर्भ अस्पष्ट होने के कारण इसे केवल सकारात्मक ‘उत्साह’ नहीं बनाया गया।
- source_word: ἐν σχήματι ἀνθρώπου
  choice: मनुष्य के रूप में
  rationale: यह यूनानी वाक्यांश के दृश्य रूप/आकृति संबंधी अर्थ को सीधे और स्वाभाविक हिन्दी में रखता है।
- source_word: Ἱερουσαλὴμ ὄνομα αὐτῷ
  choice: “यरूशलेम” उसका नाम है
  rationale: असामान्य यूनानी नाम-वाक्य की संक्षिप्तता और उसके पुल्लिंग सर्वनाम को यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर को मनुष्य के रूप में’ कथन की पहचान
  choice: परमेश्वर को मनुष्य के रूप में
  alternative: किसी मनुष्य में परमेश्वर को / परमेश्वर-सदृश मनुष्य को
  rationale: θεὸν स्पष्ट रूप से ‘परमेश्वर’ कहता है और ἐν σχήματι ἀνθρώπου उसके मानवीय रूप का वर्णन करता है; किसी विशिष्ट मतानुसार इसकी पहचान नहीं जोड़ी गई।
- issue: ὃν और αὐτῷ के पूर्वपद
  choice: उसे, जिसे प्रभु उसके लिए चुनेगा
  alternative: जिसे प्रभु चुनेगा / जिसे प्रभु यरूशलेम के लिए चुनेगा
  rationale: यूनानी में दोनों पुल्लिंग सर्वनामों के पूर्वपद और वाक्यांशों का पारस्परिक संबंध स्पष्ट नहीं है। अनुवाद ने सर्वनाम बनाए रखे हैं और अस्पष्टता को टिप्पणी में बताया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘राष्ट्र’ प्राचीन सामूहिक जातीय-राजनीतिक अर्थ को व्यक्त करता है। कठिन यूनानी वाक्य-रचना को अत्यधिक पुनर्गठित नहीं किया गया, ताकि उसकी वास्तविक अस्पष्टता बनी रहे।
