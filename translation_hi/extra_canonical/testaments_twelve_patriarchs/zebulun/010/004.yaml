  text: And again, in the craftiness of your works you will provoke him, and you will be cast away from him until the time of completion.
translation:
  language: hi
  text: और फिर, अपने कामों की धूर्तता में तुम उसे क्रोधित करोगे, और पूर्णता के समय तक उससे दूर कर दिए जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ πανουργίᾳ τῶν ἔργων ὑμῶν
  choice: अपने कामों की धूर्तता में
  rationale: ἐν के स्थानिक/परिस्थितिजन्य भाव और ἔργων के सामान्य अर्थ ‘कामों’ को बनाए रखते हुए πανουργία का नकारात्मक भाव ‘धूर्तता’ से व्यक्त किया गया है।
- source_word: παροργίσετε
  choice: क्रोधित करोगे
  rationale: क्रिया का अर्थ किसी को रोष दिलाना या उकसाकर क्रोधित करना है; सहज हिन्दी में ‘क्रोधित करोगे’ उपयुक्त है।
- source_word: ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
  choice: उसके पास से निकाल दिए जाओगे
  rationale: निष्क्रिय भविष्य और उससे दूर किए जाने के भाव को स्पष्ट रखता है, बिना ‘त्यागे जाने’ की अतिरिक्त स्थायी धार्मिक व्याख्या जोड़े।
- source_word: ἕως καιροῦ συντελείας
  choice: पूर्णता के समय तक
  rationale: καιρός को ‘समय’ और συντέλεια को ‘पूर्णता’ देकर स्रोत की कुछ हद तक अस्पष्ट अन्तकालिक अभिव्यक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘उस’ की पहचान
  choice: सर्वनाम ‘उसे/उसके’ को यथावत रखा गया
  alternative: ईश्वर का नाम स्पष्ट रूप से जोड़ना
  rationale: इस पद के यूनानी पाठ में केवल αὐτόν/αὐτοῦ है; संदर्भगत पहचान को अनुवाद में अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: καιρὸς συντελείας का आशय
  choice: ‘पूर्णता का समय’
  alternative: ‘अन्त का समय’ या ‘युग की समाप्ति’
  rationale: शब्दावली में समापन/परिपूर्ण होने का भाव है, पर पद स्वयं यह निश्चित नहीं करता कि इसका आशय जगत का अन्त, दण्ड की अवधि का अन्त, या किसी योजना की पूर्णता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और स्रोत-सापेक्ष भाषा। ‘धूर्तता’ नैतिक नकारात्मकता को स्पष्ट करती है; वाक्य की भविष्यवाणी-सदृश गंभीरता बनाए रखी गई है।
