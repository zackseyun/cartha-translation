  verdict: revise
  source_fidelity: The draft accurately represents the future force, the situational sense of ἐν, the negative nuance of πανουργία, and the deliberately unspecified pronoun. However, “उसके पास से निकाल दिए जाओगे” can suggest removal from his physical proximity or domain. ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ more directly conveys being cast away/rejected from him; “उससे दूर कर दिए जाओगे” retains the passive and separation without adding that spatial implication.
  naturalness: The Hindi is generally clear and suitably grave. Replacing “उसके पास से निकाल दिए जाओगे” with “उससे दूर कर दिए जाओगे” is more idiomatic in this context.
  terminology: “धूर्तता,” “कामों,” and “पूर्णता के समय तक” are defensible, source-responsive choices. The pronouns should remain unspecified, as in Greek.
  issues:
  - severity: medium
    issue: “उसके पास से निकाल दिए जाओगे” is too spatially specific for ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ.
    rationale: The Greek passive denotes being cast away from him. “उससे दूर कर दिए जाओगे” better preserves the separation and passive action while avoiding an added image of being removed from his vicinity.
  revised_text: और फिर, अपने कामों की धूर्तता में तुम उसे क्रोधित करोगे, और पूर्णता के समय तक उससे दूर कर दिए जाओगे।
