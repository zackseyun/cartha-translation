base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002.yaml
  text: '1 Sons of Zebulun[a], pay attention to the words of your father.

    2 I, Zebulun, became a good gift to my parents; for when I was born, my father prospered greatly, and the sheep and the cattle also, when with the variegated rods he had his share.

    3 And I do not know that I sinned in my days, except in intention.

    4 I do not remember that I committed lawlessness, except for the ignorance that I showed concerning Joseph, in that I gave my brothers my word not to tell my father what had happened.

    5 But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.

    6 Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin[b].

    7 For Simeon and Dan and Gad came against Joseph to kill him, and he said to them with tears,

    8 “Have mercy on me, my brothers; pity the inward compassion of Jacob our father. Do not lay your hands on me to shed innocent blood, for I have not sinned against you.

    9 But even if I have sinned, discipline me with correction, my brothers; yet do not bring your hand to the murder of your brother, for the sake of Jacob your father.”

    10 And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.

    11 And I wept together with Joseph, and my heart thundered, and the joints of my body trembled[c][d], and I had no strength.'
translation:
  language: hi
  text: 'जबूलून का वसीयतनामा 2


    1 जबूलून के पुत्रों, अपने पिता की बातों पर ध्यान दो।


    2 मैं, जबूलून, अपने माता-पिता के लिए एक अच्छा उपहार ठहरा; क्योंकि जब मेरा जन्म हुआ, तब मेरे पिता की बहुत उन्नति हुई, और उनकी भेड़-बकरियाँ और गाय-बैल भी बहुत बढ़ गए—उस समय जब चितकबरी छड़ियों के द्वारा उन्हें अपना हिस्सा मिला था।[a]


    3 मैं नहीं जानता कि मैंने अपने जीवन के दिनों में पाप किया हो—सिवाय मन के इरादे में।[b]


    4 मुझे याद नहीं कि मैंने कोई अधर्म किया हो, सिवाय उस अज्ञान के जो मैंने यूसुफ के विषय में दिखाया: मैंने अपने भाइयों को वचन दिया था कि जो कुछ हुआ था, वह अपने पिता को न बताऊँगा।


    5 पर यूसुफ के कारण मैं बहुत दिनों तक छिपकर रोता रहा। मैं अपने भाइयों से डरता था, क्योंकि उन सबने मिलकर ठहराया था कि जो कोई यह रहस्य खोले, उसे मार डाला जाए।


    6 फिर भी, जब वे उसे मार डालना चाहते थे, तब मैंने आँसू बहाते हुए उनसे विनती की कि वे यह पाप न करें।


    7 क्योंकि शिमोन, दान और गाद यूसुफ को मार डालने के लिए उसके पास आए थे। तब यूसुफ ने आँसू बहाते हुए उनसे कहा,


    8 “मेरे भाइयों, मुझ पर दया करो; हमारे पिता याकूब की ममता पर दया करो।[d] निर्दोष का खून बहाने के लिए मुझ पर हाथ मत उठाओ, क्योंकि मैंने तुम्हारे विरुद्ध पाप नहीं किया है।


    9 और यदि मैंने पाप किया भी है, तो मेरे भाइयों, मुझे अनुशासन देकर सुधारो; पर अपने पिता याकूब के कारण अपने भाई की हत्या करने को हाथ मत बढ़ाओ।”


    10 जब वह विलाप करते हुए ये बातें कह रहा था, तब मैं उसकी चीखें सह न सका और रोने लगा। मेरा कलेजा उँडेल दिया गया,[c] और मेरे भीतर के अंगों की सारी शक्ति जाती रही।


    11 मैं यूसुफ के साथ रोया; मेरा हृदय गरज उठा, मेरे शरीर के जोड़ काँपने लगे, और मैं खड़ा न रह सका।


    पादटिप्पणियाँ


    [a] चितकबरी छड़ियों का उल्लेख उत्पत्ति 30 में याकूब द्वारा पशुओं के प्रजनन की व्यवस्था की ओर संकेत करता है।


    [b] जिस यूनानी पद का अनुवाद “सिवाय मन के इरादे में” किया गया है, वह कठिन है। संभव है कि वह बाहरी काम के बजाय मन के भीतर के विचार या इरादे की ओर संकेत करता हो।


    [c] शाब्दिक अर्थ है, “मेरा यकृत उँडेल दिया गया।” यह तीव्र शोक व्यक्त करने वाली एक सजीव प्राचीन उक्ति है।


    [d] शाब्दिक अर्थ है, “हमारे पिता याकूब के अंतरांगों पर दया करो।” प्राचीन भाषा में शरीर के भीतरी अंग गहरी करुणा और स्नेह को व्यक्त करते थे; यहाँ अभिप्राय याकूब की पितृ-ममता का विचार करना है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: चितकबरी छड़ियों का उल्लेख उत्पत्ति 30 में याकूब द्वारा पशुओं के प्रजनन की व्यवस्था की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: जिस यूनानी पद का अनुवाद “सिवाय मन के इरादे में” किया गया है, वह कठिन है। संभव है कि वह बाहरी काम के बजाय मन के भीतर के विचार या इरादे की ओर संकेत करता हो।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ है, “मेरा यकृत उँडेल दिया गया।” यह तीव्र शोक व्यक्त करने वाली एक सजीव प्राचीन उक्ति है।
    reason: cultural_note
  - marker: d
    text: शाब्दिक अर्थ है, “हमारे पिता याकूब के अंतरांगों पर दया करो।” प्राचीन भाषा में शरीर के भीतरी अंग गहरी करुणा और स्नेह को व्यक्त करते थे; यहाँ अभिप्राय याकूब की पितृ-ममता का विचार करना है।
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: ध्यान दो
  rationale: वसीयतनुमा संबोधन में आज्ञार्थक आग्रह को स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: δόσις ἀγαθή
  choice: एक अच्छा उपहार
  rationale: ठोस संज्ञा ‘उपहार’ को बनाए रखता है और इसे केवल ‘आशीष’ कहकर अर्थ को धर्मवैचारिक रूप से संकुचित नहीं करता।
- source_word: ηὐξήνθη σφόδρα
  choice: बहुत उन्नति हुई
  rationale: याकूब के घराने और पशुधन की वृद्धि के प्रसंग में आर्थिक समृद्धि तथा बढ़ोतरी दोनों का स्वाभाविक संकेत देता है।
- source_word: ποικίλαις ῥάβδοις
  choice: चितकबरी छड़ियों
  rationale: उत्पत्ति 30 के प्रसंग को पहचानने योग्य रखते हुए विविध रंग अथवा धब्बेदार रूप का बोध कराता है।
- source_word: παρεκτὸς ἐννοίας
  choice: सिवाय मन के इरादे में
  rationale: यूनानी पद की कठिनता और बाहरी कर्म बनाम भीतरी विचार की नैतिक तनातनी को बिना समतल किए बनाए रखता है।
- source_word: παρανομίαν
  choice: अधर्म
  rationale: सामान्य ‘गलती’ की अपेक्षा शब्द के नैतिक और व्यवस्था-विरोधी भार को सुरक्षित रखता है।
- source_word: ἄγνοιαν
  choice: अज्ञान
  rationale: जबूलून द्वारा अपनी भूल को जानबूझकर किए विद्रोह के बजाय अज्ञान के रूप में बताने को सीधे बनाए रखता है।
- source_word: ἐβεβαίωσα
  choice: वचन दिया था
  rationale: मौन रखने की सहमति में दृढ़ प्रतिबद्धता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μυστήριον
  choice: रहस्य
  rationale: यहाँ यूसुफ के साथ हुई घटना से जुड़ी छिपाई गई बात अभिप्रेत है; किसी बाद की तकनीकी धर्मवैचारिक धारणा को नहीं जोड़ा गया।
- source_word: ἀναιρεθῆναι
  choice: मार डाला जाए
  rationale: मृत्युदंड-सदृश धमकी को स्पष्ट और गंभीर रूप में व्यक्त करता है।
- source_word: προσεκάλουν
  choice: विनती की
  rationale: आँसुओं के साथ किए गए गहरे आग्रह को हिन्दी में स्वाभाविक रूप देता है।
- source_word: σπλάγχνα
  choice: अंतरांगों
  rationale: करुणा के प्राचीन देहगत रूपक को मुख्य पाठ में सुरक्षित रखता है और पादटिप्पणी उसके सांस्कृतिक अर्थ को स्पष्ट करती है।
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: मेरा कलेजा उँडेल दिया गया
  rationale: यकृत से जुड़े मूल सजीव देहगत चित्र को पठनीय हिन्दी में बनाए रखता है; शाब्दिक शारीरिक संदर्भ पादटिप्पणी में दिया गया है।
- source_word: ἐβόμβει ἡ καρδία μου
  choice: मेरा हृदय गरज उठा
  rationale: तीव्र ध्वनि और भावात्मक आघात वाले यूनानी चित्र को नरम किए बिना हिन्दी में पुनरुत्पन्न करता है।
theological_decisions:
- issue: यूसुफ के प्रसंग में दोष मानने के बावजूद जबूलून का अपने पाप के विषय में कथन
  choice: 'उसके कथन को उसी तनाव के साथ रखा गया है: वह अपने दिनों में पाप न जानने की बात कहता है, फिर मन के इरादे और यूसुफ के विषय में अपने अज्ञान का अपवाद देता है।'
  alternative: पूरे अनुच्छेद को केवल ‘यूसुफ के मामले को छोड़कर मैं निर्दोष था’ के सरल दावे में बदल देना।
  rationale: यूनानी पाठ की नैतिक जटिलता को सुरक्षित रखना आवश्यक है; अनुवाद पाठक की ओर से संभावित विरोधाभास का समाधान नहीं करता।
- issue: करुणा और शोक की देहगत भाषा
  choice: ‘अंतरांगों’, ‘कलेजा उँडेल दिया गया’ और काँपते जोड़ों जैसे शारीरिक चित्र बनाए रखे गए हैं।
  alternative: इन्हें ‘बहुत दया करो’, ‘मेरा दिल टूट गया’ अथवा अन्य अमूर्त भावात्मक भाषा से बदल देना।
  rationale: मूल की वक्तृत्व-शक्ति देहगत और भावप्रवण है। पादटिप्पणियाँ अर्थ स्पष्ट करती हैं, पर मुख्य पाठ की प्राचीन बनावट को मिटाती नहीं हैं।
- issue: यूसुफ का निर्दोष होने का दावा और काल्पनिक दोष की स्वीकृति
  choice: ‘मैंने तुम्हारे विरुद्ध पाप नहीं किया’ और ‘यदि मैंने पाप किया भी है’ दोनों कथन यथावत तनाव में रखे गए हैं।
  alternative: दूसरे कथन को केवल सामान्य दंड-विधान के सिद्धांत के रूप में ढीला कर देना।
  rationale: यूसुफ की प्रार्थना में निर्दोषता के दावे और सुधार स्वीकार करने की तत्परता दोनों उपस्थित हैं; किसी एक को दूसरे पर हावी नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध स्तर रखा गया है। पारिवारिक संबोधनों में ‘पुत्रो’ और ‘भाइयो’ जैसे स्वाभाविक सम्बोधन प्रयुक्त हैं। मूल की असामान्य देहगत उपमाओं को जहाँ संभव था मुख्य पाठ में रखा गया और सांस्कृतिक दूरी को पादटिप्पणियों से समझाया गया है। पद 3 की कठिन यूनानी रचना को जानबूझकर अत्यधिक सहज नहीं बनाया गया, ताकि वास्तविक अस्पष्टता बनी रहे।
