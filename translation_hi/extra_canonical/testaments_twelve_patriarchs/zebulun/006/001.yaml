translation:
  language: hi
  text: 6:1 तो सबसे पहले मैंने समुद्र में चलाने के लिए एक नाव बनाई, क्योंकि प्रभु ने मुझे उसके लिए समझ और बुद्धि दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉
  choice: फिर सबसे पहले
  rationale: Πρῶτος की प्राथमिकता और οὖν के प्रसंगगत संक्रमण—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σκάφος
  choice: नाव
  rationale: समुद्र पर चलने वाले जलयान के लिए सरल और व्यापक रूप से समझा जाने वाला शब्द।
- source_word: ἐπιπλέειν ἐν τῇ θαλάσσῃ
  choice: जो समुद्र पर चल सके
  rationale: जलयान के तैरते हुए समुद्र में आगे बढ़ने का आशय सहज हिन्दी में देता है।
- source_word: σύνεσιν καὶ σοφίαν
  choice: समझ और बुद्धि
  rationale: 'दोनों निकटवर्ती किंतु अलग संकल्पनाओं को बनाए रखता है: व्यावहारिक समझ और बुद्धिमत्ता।'
- source_word: ἐν αὐτῷ
  choice: इस काम के लिए
  rationale: ग्रीक सर्वनाम का संदर्भ नाव बनाने/चलाने के कार्य से है; शाब्दिक ‘उसमें’ हिन्दी में अस्पष्ट होता, इसलिए वास्तविक संदर्भ को स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: कौशल और बुद्धि का स्रोत
  choice: प्रभु ने मुझे ... दी थी
  alternative: मुझे ... मिली थी
  rationale: मूल पाठ स्पष्ट रूप से प्रभु को समझ और बुद्धि देने वाला बताता है; कर्तृवाच्य रचना इस धार्मिक दावे को सुरक्षित रखती है।
