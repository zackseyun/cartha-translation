  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθῆκα
  choice: लगा दिया
  rationale: यहाँ किसी वस्तु के पीछे लकड़ी रखने अथवा जोड़ने की क्रिया व्यक्त होती है; ‘लगा दिया’ आधुनिक हिन्दी में स्वाभाविक है और अंग्रेज़ी परामर्श-पाठ के ‘fastened’ के अनुरूप भी है।
- source_word: ξύλον
  choice: लकड़ी का एक टुकड़ा
  rationale: ξύλον का अर्थ लकड़ी या लकड़ी से बनी वस्तु हो सकता है; अनिश्चित संदर्भ में ‘लकड़ी का एक टुकड़ा’ ठोस और सहज अभिव्यक्ति है।
- source_word: ὄπισθεν αὐτοῦ
  choice: उसके पीछे
  rationale: αὐτοῦ पुल्लिंग/नपुंसकलिंग संबंधवाचक रूप है और उपलब्ध खंड में उसका पूर्वपद नहीं है; ‘उसके’ संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: καί
  choice: और
  rationale: खंड के अंत में उपस्थित संयोजक को बनाए रखा गया है, क्योंकि वाक्य अगली इकाई में जारी है।
