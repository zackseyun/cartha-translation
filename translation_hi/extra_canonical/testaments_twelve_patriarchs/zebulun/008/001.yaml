  text: VIII. Καὶ ὑμεῖς οὖν, τέκνα μου, ἔχετε εὐσπλαγχνίαν *κατὰ παντὸς ἀνθρώπου¹ ἐν ἐλέει, ἵνα καὶ ὁ Κύριος *εἰς ὑμᾶς σπλαγχνισθεὶς² ἐλεήσῃ ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/001.yaml
  text: And so, my children, have compassion toward every person in mercy, so that the Lord also, having compassion on you, may show you mercy.
translation:
  language: hi
  text: इसलिए तुम भी, मेरे बच्चों, हर मनुष्य के प्रति दया से भरी करुणा रखो, ताकि प्रभु भी तुम पर करुणा करके तुम पर दया करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उपदेश से निष्कर्ष या परिणाम का संबंध व्यक्त करता है।
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: पितृसुलभ संबोधन को सहज और आधुनिक हिन्दी में बनाए रखता है।
- source_word: εὐσπλαγχνίαν
  choice: करुणा
  rationale: यह हृदय से उपजी सहानुभूतिपूर्ण दया का भाव व्यक्त करता है।
- source_word: κατὰ παντὸς ἀνθρώπου
  choice: हर मनुष्य के प्रति
  rationale: व्यापकता को बिना किसी अपवाद के सुरक्षित रखता है और हिन्दी में संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἐλέει
  choice: दया से भरी
  rationale: शाब्दिक 'दया में' की अस्वाभाविकता से बचते हुए करुणा के दयामय स्वरूप को बनाए रखता है।
- source_word: σπλαγχνισθεὶς
  choice: करुणा करके
  rationale: यूनानी कृदन्त की पूर्ववर्ती या साथ चलती क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐλεήσῃ
  choice: दया करे
  rationale: ἐλεέω का सीधा अर्थ रखता है और εὐσπλαγχνία तथा σπλαγχνίζομαι से उसका निकट संबंध भी सुनाई देता है।
theological_decisions:
- issue: मानवीय करुणा और प्रभु की दया के बीच संबंध
  choice: “ताकि” के द्वारा उद्देश्य/परिणाम का संबंध यथावत रखा गया
  alternative: 'इसे केवल सामान्य समानता के रूप में प्रस्तुत करना: “और प्रभु भी...”'
  rationale: ἵνα स्पष्टतः उद्देश्य अथवा अपेक्षित परिणाम दर्शाता है; अनुवाद इस तनाव को बिना यह तय किए बनाए रखता है कि प्रभु की दया अर्जित की जाती है या यह नैतिक प्रतिफल की भाषा है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पितृसुलभ उपदेशात्मक लहजा। ‘करुणा’ और ‘दया’ दोनों को रखा गया है ताकि मूल पाठ की निकटार्थी किन्तु अलग शब्दावली समतल न हो।
