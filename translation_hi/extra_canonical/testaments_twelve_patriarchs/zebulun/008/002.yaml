  text: 2. Ὅτι καίγε³ ἐπʼ ἐσχάτων τῶν⁴ ἡμερῶν ὁ Θεὸς ἀποστελεῖ⁵ *τὰ σπλάγχνα⁶ αὐτοῦ ἐπὶ τῆς⁷ γῆς, καὶ ὅπου εὕρῃ σπλάγχνα ἐλέους, ἐν αὐτῷ κατοικεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/002.yaml
  text: For indeed in the last days God will send his compassion upon the earth, and wherever he finds compassion of mercy, there he dwells.
translation:
  language: hi
  text: क्योंकि सचमुच अन्तिम दिनों में परमेश्वर अपनी करुणा पृथ्वी पर भेजेगा; और जहाँ कहीं वह दया से भरी करुणा पाएगा, वहीं वह निवास करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: अपनी करुणा
  rationale: शाब्दिक अर्थ ‘उसकी अंतड़ियाँ/अंतरंग अंग’ है, पर यूनानी में यह गहरी आंतरिक करुणा का मुहावरा है; आधुनिक हिन्दी में ‘अपनी करुणा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: σπλάγχνα ἐλέους
  choice: दयाभरी करुणा
  rationale: दोनों निकटार्थी शब्दों की संयुक्त तीव्रता को बनाए रखता है और इसे केवल एक सामान्य ‘दया’ में सीमित नहीं करता।
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν
  choice: अन्तिम दिनों में
  rationale: काल-संबंधी पारंपरिक अर्थ को स्पष्ट, सहज हिन्दी में सुरक्षित रखता है।
- source_word: κατοικεῖ
  choice: निवास करेगा
  rationale: वाक्य के भविष्यकालीन संदर्भ के अनुरूप है और स्थायी रूप से रहने के भाव को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की करुणा भेजे जाने और उसके निवास का संबंध
  choice: 'दोनों कथनों को ज्यों का त्यों रखा गया है: परमेश्वर करुणा भेजता है और दयाभरी करुणा मिलने पर वहीं निवास करता है।'
  alternative: ‘करुणा’ को किसी विशिष्ट मसीही व्यक्ति, आत्मा या गुण का नाम मानकर स्पष्ट करना।
  rationale: यूनानी पाठ स्वयं उस पहचान को स्पष्ट नहीं करता; अतः उसकी वास्तविक धार्मिक और रूपकात्मक अस्पष्टता सुरक्षित रखी गई है।
- issue: κατοικεῖ का काल
  choice: मुख्य भविष्यकाल ‘भेजेगा’ के प्रभाव में ‘निवास करेगा’।
  alternative: रूपगत वर्तमान के अनुसार ‘निवास करता है’।
  rationale: वर्तमान रूप को भविष्यवाणी में भविष्यकालीन घटना के सजीव/सामान्य परिणाम के रूप में समझना प्रसंगानुकूल है, यद्यपि वर्तमान अनुवाद भी व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय पर सामान्य पाठक के लिए सहज। ‘दयाभरी करुणा’ जानबूझकर कुछ गहन और पुनरुक्तिपूर्ण है, क्योंकि मूल में σπλάγχνα और ἔλεος का संयुक्त भाव है।
