  text: और जब हम मिस्र गए, तो यूसुफ ने हमसे कोई बैर नहीं रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατήλθομεν εἰς Αἴγυπτον
  choice: हम मिस्र गए
  rationale: यूनानी में शाब्दिक अर्थ ‘हम मिस्र को नीचे गए’ है; आधुनिक हिन्दी में ‘मिस्र गए’ स्वाभाविक है और यात्रा की दिशा को अनावश्यक रूप से उभारता नहीं।
- source_word: οὐκ ἐμνησικάκησεν ἡμῖν
  choice: उसने हमसे कोई बैर नहीं रखा
  rationale: ἐμνησικάκησεν का अर्थ बीती बुराई को याद रखकर द्वेष या रंजिश पालना है। ‘बैर नहीं रखा’ इसे संक्षिप्त, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
