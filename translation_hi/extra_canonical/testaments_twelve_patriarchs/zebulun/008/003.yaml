  text: For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.
translation:
  language: hi
  text: क्योंकि मनुष्य अपने पड़ोसी पर जितनी करुणा करता है, प्रभु भी उस पर उतनी ही करुणा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνίζεται
  choice: दया करता है
  rationale: यह क्रिया भीतर से उमड़ने वाली करुणा या दया को व्यक्त करती है; आधुनिक हिन्दी में “दया करता है” सहज, स्पष्ट और दोनों प्रयोगों में समानांतर है।
- source_word: τὸν πλησίον αὐτοῦ
  choice: अपने पड़ोसी
  rationale: πλησίον का अर्थ निकटवर्ती व्यक्ति अथवा पड़ोसी है; “अपने पड़ोसी” मूल के संबंधसूचक αὐτοῦ को भी स्वाभाविक हिन्दी में रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: धार्मिक संदर्भ में Κύριος का प्रतिष्ठित और व्यापक हिन्दी समतुल्य “प्रभु” है।
- source_word: Ὅσον ... τοσοῦτον
  choice: जितनी ... उतनी ही
  rationale: यूनानी परिमाणात्मक सहसंबंध को हिन्दी की स्वाभाविक तुलनात्मक संरचना में सुरक्षित रखा गया है।
theological_decisions:
- issue: मानवीय दया और प्रभु की दया के बीच परिमाणात्मक संबंध
  choice: “जितनी ... उतनी ही” संबंध को स्पष्ट रूप से बनाए रखा गया
  alternative: इसे सामान्य कारण-परिणाम के रूप में “यदि...तो...” कहना
  rationale: मूल ὅσον...τοσοῦτον समानुपाती संबंध व्यक्त करता है। पद के संभावित प्रतिफलात्मक या माप-संबंधी धार्मिक तनाव को बिना व्याख्यात्मक नरमी के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी की समानांतर वाक्य-रचना के निकट।
