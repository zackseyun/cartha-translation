  text: Paying attention to him, you also, my children, love one another, and let each one not reckon evil against his brother.
translation:
  language: hi
  text: जिस पर ध्यान देते हुए, मेरे बच्चों, तुम भी एक-दूसरे से प्रेम करो, और तुममें से कोई भी अपने भाई के विरुद्ध बुराई न सोचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχοντες
  choice: ध्यान लगाए हुए हो
  rationale: यह वर्तमान कृदंत किसी की ओर निरंतर ध्यान देने या उससे सावधान प्रेरणा लेने का भाव रखता है; हिंदी में यह सहज और स्रोत के निकट है।
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: एक-दूसरे से प्रेम करो
  rationale: पारस्परिक प्रेम की आज्ञा को स्पष्ट, स्वाभाविक और गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: μὴ λογίζεσθε ἕκαστος κακίαν
  choice: तुममें से कोई भी ... बुराई न सोचे
  rationale: λογίζομαι के ‘विचार करना/मन में ठानना’ और κακία के ‘बुराई’ संबंधी अर्थ को बिना उसे केवल द्वेष या बदला मानकर सीमित किए व्यक्त करता है।
- source_word: πρὸς τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई के विरुद्ध
  rationale: πρός के यहाँ प्रतिकूल संबंध को ‘के विरुद्ध’ से स्पष्ट किया गया है; ‘भाई’ का पारिवारिक और सामुदायिक विस्तार खुला रहता है।
theological_decisions:
- issue: ὃν के पूर्वगामी की पहचान
  choice: जिसकी ओर
  alternative: उसकी ओर
  rationale: इस पद में पूर्वगामी का नाम नहीं दिया गया है। संबंधवाचक रूप स्रोत की वाक्य-संरचना और संदर्भ-निर्भरता को बनाए रखता है, जबकि किसी विशिष्ट व्यक्ति की पहचान आरोपित नहीं करता।
- issue: κακία का आशय
  choice: बुराई
  alternative: द्वेष
  rationale: ‘द्वेष’ अर्थ को केवल शत्रुता तक सीमित कर सकता है; व्यापक ‘बुराई’ मूल शब्द की नैतिक व्यापकता और संभावित अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में आत्मीय पितृवत संबोधन ‘मेरे बच्चो’ रखा गया है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है; स्रोत के कृदंतीय आरंभ और ‘तुम भी’ के बल को बनाए रखा गया है।
