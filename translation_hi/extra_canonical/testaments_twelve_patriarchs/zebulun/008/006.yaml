source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Ὅτι τοῦτο⁷ χωρίζει ἑνότητα¹⁸, καὶ Γπᾶσαν συγγένειαν˥¹⁹ διασκορπίζει²⁰, Γκαὶ τὴν ψυχὴν ταράσσει˥²¹ καὶ τὸ πρόσωπον ἀφανίζει²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/006.yaml
  text: For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.
translation:
  language: hi
  text: क्योंकि यह एकता को तोड़ देता है, हर रिश्तेदारी को बिखेर देता है, आत्मा को व्याकुल करता है और चेहरे को विकृत कर देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρίζει ἑνότητα
  choice: एकता को तोड़ देता है
  rationale: χωρίζει का मूल भाव अलग करना या विभाजित करना है; स्वाभाविक हिन्दी में ‘एकता को तोड़ना’ उसी प्रभाव को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: πᾶσαν συγγένειαν
  choice: हर पारिवारिक बंधन
  rationale: συγγένεια रक्त-संबंध, नातेदारी या रिश्तेदारी के समुदाय को सूचित करता है। ‘पारिवारिक बंधन’ यहाँ संबंध और जुड़ाव दोनों पहलुओं को साधारण आधुनिक हिन्दी में समेटता है।
- source_word: διασκορπίζει
  choice: छिन्न-भिन्न कर देता है
  rationale: क्रिया का अर्थ चारों ओर बिखेरना या तितर-बितर करना है; संबंधों के संदर्भ में ‘छिन्न-भिन्न’ अधिक स्वाभाविक है और विघटन की तीव्रता बनाए रखता है।
- source_word: τὴν ψυχὴν ταράσσει
  choice: आत्मा को व्याकुल करता है
  rationale: ψυχή के लिए धार्मिक-साहित्यिक संदर्भ में ‘आत्मा’ और ταράσσει के लिए ‘व्याकुल करता है’ उपयुक्त हैं; यह भीतर की अशांति को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: चेहरे की शोभा बिगाड़ देता है
  rationale: πρόσωπον का सीधा अर्थ चेहरा है। ἀφανίζει मिटाने, नष्ट करने, अदृश्य करने या कुरूप बनाने का भाव रख सकता है; इस संदर्भ में ‘चेहरे की शोभा बिगाड़ना’ स्वाभाविक हिन्दी में बाहरी रूप पर पड़े दुष्प्रभाव को व्यक्त करता है, जबकि केवल ‘चेहरा नष्ट करना’ अस्वाभाविक होता।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: आत्मा
  alternative: मन / प्राण
  rationale: पद आंतरिक व्यक्ति पर पड़ने वाले प्रभाव की बात करता है। ‘आत्मा’ स्रोत के धार्मिक और मानवशास्त्रीय खुलेपन को बनाए रखता है; इसे केवल मानसिक अवस्था तक सीमित नहीं किया गया।
- issue: ἀφανίζει की अर्थ-सीमा
  choice: चेहरे की शोभा बिगाड़ देता है
  alternative: चेहरे को कुरूप कर देता है / चेहरे को मिटा देता है
  rationale: यूनानी क्रिया तीव्र है और उसका शाब्दिक अर्थ नष्ट या ओझल करना भी हो सकता है। संदर्भ में चेहरे की दशा बिगड़ने का अर्थ सबसे संगत है; ‘शोभा’ जोड़ने से हिन्दी स्वाभाविक बनती है, पर किसी विशिष्ट दैहिक या आध्यात्मिक सिद्धांत को आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर यूनानी वाक्य-रचना को चार क्रमिक क्रियाओं के रूप में सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
