translation:
  language: hi
  text: 'यहूदा ने [कहा], “मैं सचमुच [सब कुछ सीखना चाहता हूँ]।”


    [प्रभु] ने उससे कहा, “जीवित [परमेश्वर इस] अभाव के पूरे [स्थान में कहीं भी वास नहीं करता]।”


    यहूदा ने [पूछा], “[हम पर कौन शासन करेगा]?”


    प्रभु ने उत्तर दिया, “[देखो, यहाँ] वह सब कुछ [वास करता है] जो शेष रहनेवाली वस्तुओं [में] है। तुम उन पर [शासन] करोगे।”


    यहूदा ने कहा, “देखो, शासक[a] हमारे ऊपर हैं, ताकि वे हम पर शासन करें।”


    प्रभु ने उत्तर दिया, “तुम ही उन पर शासन करोगे। जब तुम अपने भीतर से ईर्ष्या निकाल दोगे, तब तुम ज्योति को वस्त्र के समान पहनोगे और विवाह-कक्ष[b] में प्रवेश करोगे।”


    यहूदा ने पूछा, “[हमारे] वस्त्र हमें कैसे दिए जाएँगे?”


    प्रभु ने उत्तर दिया, “कुछ लोग वे तुम्हें देंगे और दूसरे [उन्हें] ग्रहण करेंगे, [पाठ लुप्त है][c] और वे ही तुम्हें तुम्हारे वस्त्र [देंगे]। क्योंकि उस स्थान तक कौन पहुँच सकता है, जब वह इतना अधिक [भयावह] है? फिर भी जीवन के वस्त्र मनुष्यों को दिए जाएँगे, क्योंकि वे उस मार्ग को जानते हैं जिस पर वे चलेंगे। वास्तव में, वहाँ पहुँचना मेरे लिए भी कठिन है।”


    मरियम ने कहा, “इस प्रकार, हर दिन की परेशानी <उस दिन के लिए पर्याप्त है>[d]। मज़दूर अपने भोजन के योग्य हैं। शिष्य अपने गुरुओं के बराबर होंगे।”


    उसने यह बात ऐसी स्त्री के रूप में कही जो सब कुछ समझती थी।'
