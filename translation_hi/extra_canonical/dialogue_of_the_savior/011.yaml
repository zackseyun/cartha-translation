  footnotes:
  - marker: a
    text: ‘शासक’ उस शब्द का अनुवाद है जिसे प्रायः ‘आर्खोन’ कहा जाता है; इस साहित्य में यह सांसारिक शासकों के साथ-साथ ब्रह्माण्डीय शक्तियों का भी संकेत कर सकता है।
    reason: विशिष्ट पारिभाषिक सम्भावना को मुख्य पाठ पर थोपे बिना बताना।
  - marker: b
    text: ‘विवाह-कक्ष’ यहाँ सम्भवतः प्रतीकात्मक धार्मिक भाषा है; पाठ इसके ठीक अर्थ को स्पष्ट नहीं करता।
    reason: प्रतीक की वास्तविक अस्पष्टता बनाए रखना।
  - marker: c
    text: यहाँ उपलब्ध साक्षी में एक रिक्त कोष्ठक है, जो लुप्त अथवा अपठनीय पाठ का संकेत देता है।
    reason: मूल साक्षी के पाठगत अंतराल को स्पष्ट और दृश्य रखना।
  - marker: d
    text: कोणीय कोष्ठक उन शब्दों को दिखाते हैं जिन्हें अनुवादक ने अपेक्षित अर्थ पूरा करने के लिए जोड़ा है।
    reason: साक्षी में प्रयुक्त संपादकीय संकेत का अर्थ बताना।
lexical_decisions:
- source_word: archons
  choice: शासक
  rationale: ग्रीक मूल के पारिभाषिक शब्द ‘आर्खोन’ का अर्थ पाठक के लिए स्पष्ट रखने हेतु सामान्य हिन्दी ‘शासक’ चुना गया; इसकी विशिष्ट पारलौकिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: bridal chamber
  choice: विवाह-कक्ष
  rationale: प्रतीकात्मक अर्थ को बिना सिद्धान्तगत व्याख्या के बनाए रखने वाला निकट औपचारिक अनुवाद।
- source_word: garments of life
  choice: जीवन के वस्त्र
  rationale: रूपक को ज्यों का त्यों रखा गया है; इसे अमरता, दीक्षा या किसी संस्कार के रूप में निर्धारित नहीं किया गया।
- source_word: deficiency
  choice: अभाव
  rationale: ‘कमी’ की अपेक्षा ‘अभाव’ इस ब्रह्माण्डीय अथवा अस्तित्वगत कथन की गरिमा और अस्पष्टता दोनों बनाए रखता है।
- source_word: students
  choice: शिष्य
  rationale: गुरु-शिष्य सम्बन्ध के संदर्भ में स्वाभाविक हिन्दी; केवल आधुनिक विद्यालयी ‘विद्यार्थी’ तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: शासकों की पहचान
  choice: मुख्य पाठ में ‘शासक’ और पादटिप्पणी में पारलौकिक सम्भावना
  alternative: ‘आर्खोन’ का लिप्यंतरण अथवा ‘दुष्ट स्वर्गिक शक्तियाँ’
  rationale: पाठ स्वयं उनकी प्रकृति पूरी तरह नहीं बताता; इसलिए किसी विशिष्ट ग्नॉस्टिक या दानवी व्याख्या को आरोपित नहीं किया गया।
- issue: विवाह-कक्ष का अर्थ
  choice: प्रतीक को अव्याख्यायित रखना
  alternative: इसे किसी निश्चित संस्कार, स्वर्गीय मिलन या उद्धार-अवस्था के रूप में अनूदित करना
  rationale: स्रोत की धार्मिक प्रतीकात्मकता और वास्तविक अस्पष्टता सुरक्षित रखी गई।
- issue: ‘मेरे लिए भी कठिन’ कथन
  choice: स्पष्ट पाठानुसार रखा गया
  alternative: मसीह-विषयक कठिनाई से बचने के लिए वक्ता या सर्वनाम बदलना
  rationale: कथन में निहित धर्मवैचारिक तनाव को चुपचाप हल नहीं किया गया।
- issue: जीवित परमेश्वर और अभाव का स्थान
  choice: खंडित पुनर्स्थापन सहित सीधा कथन
  alternative: वाक्य को किसी विकसित ब्रह्माण्ड-विज्ञान के अनुसार विस्तार देना
  rationale: पांडुलिपीय अपूर्णता और कथन की अनिश्चित सीमा को सुरक्षित रखा गया।
