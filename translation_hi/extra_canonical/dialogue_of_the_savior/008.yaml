translation:
  language: hi
  text: 'यहूदा ने उत्तर दिया, “हे प्रभु, मुझे बताइए, [भूकंप] का कंपन पृथ्वी को कैसे हिलाता है?”


    प्रभु ने एक पत्थर उठाकर अपने हाथ में लिया। [उन्होंने उससे कहा, “मैं] अपने हाथ में क्या पकड़े हुए हूँ?”


    उसने उत्तर दिया, “[यह] एक पत्थर है।”


    उन्होंने उनसे कहा, “जो [पृथ्वी] को थामे हुए है, वही आकाश को भी थामे हुए है। जब महामहिमा से एक वचन निकलता है, तो वह उससे मिलेगा जो आकाश और पृथ्वी को थामे हुए है। पृथ्वी नहीं हिलेगी। यदि वह हिलती, तो नीचे गिर जाती; पर वह नहीं हिलती, ताकि पहला वचन निष्फल न हो। वचन ने संसार को स्थापित किया, उसमें वास किया और उसकी सुगंध सूँघी। हे मनुष्य के पुत्रो,[a] मैं तुम सबको वह सब घोषित करता हूँ जो अचल है, क्योंकि तुम उसी स्थान से हो। तुम उन लोगों के हृदयों में रहते हो जो आनंद और सत्य में बोलते हैं। यदि वचन पिता की देह से निकलकर मनुष्यों के बीच आता है और वे उसे स्वीकार नहीं करते, तो वह अपने स्थान पर लौट जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मनुष्य के पुत्रो”; यहाँ बहुवचन है। यह पांडुलिपि में प्रचलित एकवचन उपाधि “मनुष्य का पुत्र” से अलग संबोधन हो सकता है।
    reason: असामान्य बहुवचन को पाठक के लिए स्पष्ट करते हुए उसकी संभावित धार्मिक अस्पष्टता बनाए रखना।
lexical_decisions:
- source_word: Majesty
  choice: महामहिमा
  rationale: दैवी गरिमा के व्यक्तिवाचक-सदृश प्रयोग और ऊँचे धार्मिक भाव को बनाए रखता है।
- source_word: word
  choice: वचन
  rationale: सिर्फ सामान्य ‘शब्द’ के बजाय इस अंश में सृष्टि-स्थापक और पिता से निकलने वाली सत्ता के धार्मिक अर्थ को व्यक्त करता है, पर उसकी सटीक तात्त्विक पहचान तय नहीं करता।
- source_word: supports
  choice: थामे हुए है
  rationale: प्राकृतिक हिंदी में आधार देने और गिरने से रोके रखने—दोनों भावों को संजोता है।
- source_word: set up the world
  choice: संसार को स्थापित किया
  rationale: सृष्टि की स्थापना का अर्थ देता है, बिना इसे अनिवार्य रूप से शून्य से सृजन के रूप में व्याख्यायित किए।
- source_word: Sons of Man
  choice: मनुष्य के पुत्रो
  rationale: बहुवचन और असामान्य संबोधन को औपचारिक रूप से सुरक्षित रखता है; प्रचलित एकवचन मसीही उपाधि में नहीं बदलता।
theological_decisions:
- issue: ‘वचन’ की पहचान
  choice: ‘वचन’ को व्यक्तित्वपूर्ण और सृष्टि-संबंधी भाषा सहित रखा गया
  alternative: इसे स्पष्ट रूप से मसीह या केवल बोला हुआ आदेश कहना
  rationale: पाठ स्वयं स्पष्ट पहचान नहीं देता; अनुवाद को इस धार्मिक तनाव और अस्पष्टता को बनाए रखना चाहिए।
- issue: पृथ्वी के न हिलने और ‘पहले वचन’ के निष्फल न होने का संबंध
  choice: ‘ताकि पहला वचन निष्फल न हो’ का उद्देश्यसूचक संबंध सुरक्षित रखा गया
  alternative: इसे कारणसूचक या व्याख्यात्मक वाक्य में बदलना
  rationale: साक्षी का तर्क असामान्य है; उसे सहज बनाने के लिए पुनर्व्याख्या करना उचित नहीं।
- issue: पिता की देह
  choice: शाब्दिक ‘पिता की देह’ रखा गया
  alternative: ‘पिता के भीतर से’ या ‘पिता की उपस्थिति से’
  rationale: देह-संबंधी ठोस और संभवतः धर्मवैचारिक भाषा को नरम करना मूल की संभावित धार को मिटा देता।
- issue: ‘तुम उसी स्थान से हो’
  choice: ‘स्थान’ को अनिर्दिष्ट रखा गया
  alternative: इसे स्वर्ग या पिता के लोक के रूप में स्पष्ट करना
  rationale: पाठ उस स्थान को नाम नहीं देता, इसलिए उसकी संदर्भगत अस्पष्टता सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, किंतु सहज शैली अपनाई गई है। कोष्ठक पांडुलिपि की क्षति या संपादकीय पुनर्स्थापन को दर्शाते हैं। वाक्य के बीच आने वाले पांडुलिपि-पृष्ठांक 13 और 14 हटाए गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण यह मसौदा अंतरिम है।
