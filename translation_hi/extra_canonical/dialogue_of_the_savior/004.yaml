    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम प्रारूप है। चौकोर कोष्ठक संपादकीय पुनर्स्थापन या क्षतिग्रस्त पाठ को, और “[. . .]” लुप्त अथवा अपठनीय अंश को दर्शाते हैं; खाली “[]” भी साक्ष्य की अनिश्चित रिक्ति को सुरक्षित रखता है। कॉप्टिक पांडुलिपि से प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: आधार-साक्ष्य की सीमाएँ और पाठ में प्रयुक्त क्षति-पुनर्स्थापन संकेत स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: धार्मिक उपाधि का स्वाभाविक और व्यापक आधुनिक हिन्दी समतुल्य।
- source_word: maintain in order
  choice: सुव्यवस्थित रखना
  rationale: भीतर की अवस्था को क्रम और उचित दशा में बनाए रखने का अर्थ सुरक्षित रखता है, बिना उसका आध्यात्मिक अर्थ अधिक स्पष्ट किए।
- source_word: souls
  choice: आत्माएँ
  rationale: दिए गए साक्ष्य का सीधा समतुल्य; आत्मा और शरीर के बीच पाठ में उपस्थित भेद को बनाए रखता है।
- source_word: mind
  choice: मन
  rationale: हिन्दी में बोध, विचार और आंतरिक चेतना को समेटने वाला सहज शब्द; स्रोत-समीक्षा लंबित होने के कारण अधिक तकनीकी विकल्प नहीं चुना गया।
- source_word: righteous
  choice: धर्मी
  rationale: नैतिक-धार्मिक अर्थ को संक्षिप्त और परिचित रूप में व्यक्त करता है।
- source_word: accept
  choice: ग्रहण करना
  rationale: व्यक्ति, वचन या आत्माओं को स्वीकार करने की पाठगत बहुअर्थता को ‘स्वीकार’ की तुलना में कुछ अधिक गरिमामय ढंग से बनाए रखता है।
theological_decisions:
- issue: ‘what is inside you’ की पहचान
  choice: पहले ‘तुम्हारे भीतर की बात’, फिर पाठ के स्पष्टीकरण ‘अर्थात् [आत्मा]’ को यथावत रखा
  alternative: हर स्थान पर सीधे ‘आत्मा’ कहना
  rationale: साक्ष्य पहले एक अस्पष्ट आंतरिक तत्व कहता है और बाद में उसे आत्मा के रूप में स्पष्ट करता है; अनुवाद इस क्रम और तनाव को नहीं मिटाता।
- issue: आत्माओं का न मरना और नष्ट न होना
  choice: कथन को बिना सिद्धान्तगत व्याख्या के सीधा रखा
  alternative: इसे आत्मा की स्वाभाविक अमरता या अंतिम उद्धार के रूप में स्पष्ट करना
  rationale: खंडित संदर्भ ऐसी किसी विस्तृत धर्मवैज्ञानिक निष्पत्ति को निश्चित नहीं करता।
- issue: ‘truth seeks’ का कर्तृत्व
  choice: ‘सत्य ... को खोजता है’
  alternative: ‘बुद्धिमान और धर्मी सत्य को खोजते हैं’
  rationale: साक्ष्य में सत्य स्वयं खोजने वाला कर्ता है; उलटाव से कथन का धर्मवैज्ञानिक बल बदल जाता।
- issue: ‘my word’ का स्वरूप
  choice: ‘मेरे वचन’
  alternative: इसे संदेश, शिक्षा या किसी व्यक्तिकृत वचन के रूप में निर्दिष्ट करना
  rationale: खंडित पाठ यह निर्धारित नहीं करता कि ‘वचन’ केवल शिक्षा है या अधिक व्यक्तिकृत धारणा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली अपनाई गई है। संवाद की संक्षिप्तता, बहुवचन संबोधन और पांडुलिपि की खंडित अवस्था सुरक्षित रखी गई है। ‘छोटों’, ‘साथियों’, ‘भीतर की बात’ और ‘उसे जो उन्हें ग्रहण करेगा’ जैसी अस्पष्ट अभिव्यक्तियों को व्याख्यात्मक विस्तार से नहीं बाँधा गया।
