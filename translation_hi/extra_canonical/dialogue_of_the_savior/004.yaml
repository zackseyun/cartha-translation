  source_fidelity: The draft generally follows the supplied English witness and carefully retains lacunae and bracketed restorations. However, “your bodies will be illuminated” is future in the witness, whereas “प्रकाशित रहेंगे” changes it to a continuing state. The final sentence also places bracketed restoration signals over words not bracketed in the witness and does not adequately reflect the restored recipient in “to [you].”
  naturalness: The Hindi is largely clear and suitably dignified. “जो तुम्हारे भीतर है” is more idiomatic than “अपने भीतर की बात” in this context, while preserving the source’s initial ambiguity. “टिका रहेगा” more naturally conveys “will survive.”
  terminology: “उद्धारकर्ता,” “प्रभु,” “आत्माएँ,” “मन,” “धर्मी,” and “वचन” are appropriate and do not impose a sectarian interpretation. “ग्रहण” is retained for “accept,” preserving the witness’s potentially broad sense.
  issues:
  - severity: medium
    issue: Future illumination rendered as a durative state
    rationale: The witness says “your bodies will be [illuminated],” but the draft has “तुम्हारे शरीर [प्रकाशित] रहेंगे” (“will remain illuminated”). “रहेंगे” adds a continuative sense not present in the supplied witness.
  - severity: medium
    issue: Final restoration brackets do not align adequately with the witness
    rationale: The draft brackets “तुम मेरे,” although the witness brackets “[you might accept]” and leaves “my word” unbracketed; it also renders “to [you]” as “[तुम्हारे पास],” obscuring the restored second-person recipient. The revision keeps the Hindi idiomatic while more faithfully signaling the witness’s restored elements.
  - severity: low
    issue: “अपने भीतर की बात” is less natural and slightly more concrete than needed
    rationale: “What is inside you” is initially indefinite. “जो तुम्हारे भीतर है” is natural modern Hindi and retains that indefiniteness until the later “[the soul]” clarification.
