translation:
  language: hi
  text: 'मत्ती ने कहा, “कैसे [. . .]?”


    [] उद्धारकर्ता ने कहा, “[यदि तुम अपने भीतर की बात को सुव्यवस्थित नहीं रखते], तो [तुम्हारा कार्य] बना रहेगा, पर तुम [नहीं]।”


    यहूदा ने [कहा], “प्रभु, [मैं इन] छोटों [से संबंधित] आत्माओं के सभी कर्म [जानना चाहता हूँ]। जब [. . .], तब वे कहाँ निवास करेंगी? [. . .] आत्मा [. . .]?”


    प्रभु ने [कहा, “. . . उन्हें ग्रहण करो]। वे न मरती हैं, न नष्ट होती हैं, क्योंकि उन्होंने [अपने] साथियों को और उसे समझ लिया है जो उन्हें ग्रहण करेगा; क्योंकि सत्य बुद्धिमानों और धर्मियों को खोजता है।”


    उद्धारकर्ता ने [कहा], “शरीर का दीपक मन है। जब तक [तुम्हारे भीतर की बात]—अर्थात् [आत्मा]—सुव्यवस्थित रहती है, तुम्हारे शरीर [प्रकाशित] रहेंगे। जब तुम्हारे हृदय अंधकारमय हो जाते हैं, तब वह प्रकाश, जिसकी तुम [] आशा करते हो, [तुमसे दूर रहेगा]। मैंने [तुम्हें अपने पास बुलाया है], क्योंकि मैं शीघ्र ही चला जाऊँगा, ताकि [तुम मेरे] वचन को अपने बीच [ग्रहण कर सको। देखो], मैं उसे [तुम्हारे पास] भेजता हूँ।”[a]'
  philosophy: optimal-equivalence
