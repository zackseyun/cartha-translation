translation:
  language: hi
  text: 'उसके शिष्यों ने [कहा, “प्रभु], कौन है जो खोजता है, और [कौन] है जो प्रकट करता है?”


    [प्रभु] ने [उनसे] कहा, “जो खोजता है, [वही] प्रकट करता है।”


    मत्ती ने [फिर उससे कहा, “प्रभु], जब मैं [आपकी बात सुनता हूँ] और जब मैं बोलता हूँ, तो कौन है जो [बोलता है, और] कौन है जो सुनता है?”


    [प्रभु] ने कहा, “जो बोलता है, वही [सुनता] है; और जो देख सकता है, वही प्रकट करता है।”


    मरियम ने कहा, “प्रभु, देखिए, [जब मैं] शरीर धारण किए हुए हूँ, तो मेरे आँसू कहाँ से बहते हैं और मेरी हँसी कहाँ से आती है?”


    प्रभु ने कहा, “[शरीर ही] अपने कर्मों के कारण रोता है, [और उन कर्मों के कारण भी] जो अभी किए जाने बाकी हैं। मन [आत्मा के फलों के कारण] हँसता है। जो अंधकार में [खड़ा] नहीं है, वह [ज्योति] को देख [नहीं] सकेगा।[a]


    मैं तुमसे कहता हूँ, [जो कुछ ज्योति से रहित है] वह अंधकार है; [और जो] अंधकार में [खड़ा नहीं है, वह] ज्योति को देख [नहीं] सकेगा।[b] परंतु [छल की संतानें] बाहर निकाल दी गईं […]। तुम ज्योति को वस्त्र के समान धारण करोगे और [इस प्रकार सदा जीवित रहोगे] […]। [यदि …], तो ऊपर और नीचे की [हर] शक्ति तुम्हारे साथ क्रूरता से व्यवहार करेगी। उस स्थान पर [सब] कुछ के अंत के कारण रोना और [दाँत पीसना] [होगा]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य उपलब्ध साक्ष्य में इसी विरोधाभासी रूप में है। पांडुलिपि-क्षति या पुनर्स्थापन के कारण अर्थ अनिश्चित हो सकता है।
    reason: पाठक को कठिन नकारात्मक कथन और उसकी पाठालोचनात्मक अनिश्चितता से अवगत कराना।
  - marker: b
    text: यह कथन पिछले वाक्य को दोहराता है। कोष्ठकों में दिए गए शब्द क्षतिग्रस्त पाठ की पूर्ति दर्शाते हैं; सीधी कॉप्टिक समीक्षा अभी लंबित है।
    reason: पुनरावृत्ति, पुनर्स्थापन और स्रोत-समीक्षा की अस्थायी स्थिति स्पष्ट करना।
lexical_decisions:
- source_word: reveals
  choice: प्रकट करता है
  rationale: ‘प्रकाशित’ की अपेक्षा यह सामान्य आधुनिक हिन्दी में सहज है और किसी बात या सत्य को उजागर करने का व्यापक अर्थ बनाए रखता है।
- source_word: wearing a body
  choice: शरीर धारण किए हुए हूँ
  rationale: शाब्दिक वस्त्र-रूपक को स्वाभाविक हिन्दी में रखते हुए शरीर और व्यक्ति के बीच मूल पाठ की दूरी बनाए रखता है।
- source_word: mind
  choice: मन
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के ‘mind’ का सीधा और गैर-सांप्रदायिक हिन्दी समतुल्य; कॉप्टिक समीक्षा लंबित होने के कारण ‘बुद्धि’ या ‘चित्त’ से अर्थ सीमित नहीं किया गया।
- source_word: spirit
  choice: आत्मा
  rationale: धार्मिक संदर्भ में प्रचलित समतुल्य है; मूल में पवित्र आत्मा, मानवीय आत्मा या आध्यात्मिक तत्त्व में से कौन अभिप्रेत है, इसे अनावश्यक रूप से निश्चित नहीं करता।
- source_word: sons of deceit
  choice: छल की संतानें
  rationale: सेमिटिक संबंधवाचक अभिव्यक्ति का रूपक सुरक्षित रखता है और इसे केवल ‘छली लोग’ कहकर सपाट नहीं करता।
- source_word: put on the light
  choice: ज्योति को वस्त्र के समान धारण करोगे
  rationale: ‘put on’ के वस्त्र-रूपक को स्पष्ट और स्वाभाविक हिन्दी में संरक्षित किया गया है।
- source_word: powers
  choice: शक्ति
  rationale: ब्रह्मांडीय या आध्यात्मिक सत्ताओं की संभावना खुली रखता है; ‘अधिकारी’ या ‘दुष्टात्माएँ’ कहकर व्याख्या आरोपित नहीं करता।
- source_word: gnashing of teeth
  choice: दाँत पीसना
  rationale: पारंपरिक चित्र और उसकी भावात्मक तीव्रता को सरल आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: खोजने और प्रकट करने वाले की पहचान
  choice: ‘वही’ के द्वारा दोनों को एक ही व्यक्ति बताया गया
  alternative: इसे पारस्परिक आध्यात्मिक प्रक्रिया या किसी विशिष्ट दिव्य सत्ता के रूप में स्पष्ट करना
  rationale: साक्ष्य केवल पहचान का कथन करता है; उसकी दार्शनिक या धार्मिक व्याख्या पाठ में नहीं जोड़ी गई।
- issue: शरीर, मन और आत्मा का संबंध
  choice: तीनों शब्द अलग रखे गए
  alternative: उन्हें एक ही आंतरिक व्यक्ति के पहलुओं के रूप में समतल करना, या कठोर द्वैतवाद के रूप में प्रस्तुत करना
  rationale: अंश में वास्तविक तनाव है, पर वह पूर्ण तत्त्वमीमांसीय व्यवस्था नहीं बताता; इसलिए भेद सुरक्षित रखा गया।
- issue: अंधकार में न खड़े होने पर ज्योति न देख पाने का विरोधाभासी कथन
  choice: उपलब्ध साक्ष्य के नकारों को ज्यों का त्यों बनाए रखा
  alternative: ‘जो अंधकार में खड़ा है’ या ‘जो अंधकार से बाहर नहीं आता’ करके कथन को तार्किक बनाना
  rationale: पांडुलिपि की क्षति या पुनर्स्थापन के कारण पाठ कठिन हो सकता है; बिना कॉप्टिक समीक्षा के मौन संशोधन उचित नहीं।
- issue: ‘छल की संतानें’ की पहचान
  choice: पहचान अनिर्धारित रखी गई
  alternative: उन्हें दुष्टात्माएँ, अविश्वासी या किसी ऐतिहासिक समूह के रूप में नामित करना
  rationale: उपलब्ध साक्ष्य किसी विशिष्ट पहचान का आधार नहीं देता।
- issue: ‘सब कुछ के अंत’ का आशय
  choice: व्यापक और अस्पष्ट रूप रखा गया
  alternative: जगत का अंत, युग का अंत या प्रत्येक व्यक्ति का अंत
  rationale: अंग्रेज़ी साक्ष्य में ‘everything’ है और स्रोत-पाठ की समीक्षा लंबित है; संकीर्ण अंतकालीन अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का dignified किंतु सुबोध संवादात्मक रूप अपनाया गया है। वर्ग कोष्ठक मूल साक्ष्य में पुनर्स्थापित या अनिश्चित पाठ को, और […] पाठ-लोप को दर्शाते हैं। अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘ज्योति’, ‘आत्मा’ और ‘धारण’ जैसे प्रसंगानुकूल धार्मिक शब्द रखे गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; प्रत्यक्ष कॉप्टिक स्रोत-समीक्षा आवश्यक है।
