translation:
  language: hi
  text: 'यहूदा ने पूछा, “हे प्रभु, हमें बताइए, [आकाश और] पृथ्वी के अस्तित्व में आने से पहले क्या [था]?”[a]


    प्रभु ने कहा, “अंधकार और जल था, और […] एक आत्मा [जल] के ऊपर था। और मैं तुमसे [सच] कहता हूँ: देखो, जिसे तुम खोजते हो और जिसके विषय में पूछते हो, वह तुम्हारे भीतर [है]; और उसमें आत्मा की सामर्थ्य और उसका रहस्य [है], क्योंकि वह [आत्मा से उत्पन्न होता है]। अधर्म मन को [निरंतर नष्ट करने के लिए] भीतर आया। देखो, […]।”


    [मत्ती] ने कहा, “हे प्रभु, हमें बताइए, [जीवात्मा] कहाँ स्थापित है, और सच्चा [मन] कहाँ निवास करता है?”[b]


    प्रभु ने [कहा], “उन दोनों के [बीच] आत्मा की आग अस्तित्व में आई; इस प्रकार [आत्मा] उत्पन्न हुआ, और उनके भीतर सच्चा मन भी। यदि कोई जीवात्मा को ऊँचाई पर स्थापित करे, तो [वह] ऊँचा उठाया जाएगा।”


    मत्ती ने उनसे पूछा, […] “[क्या खतना आवश्यक नहीं है], जब उसे [सच्चे अर्थ के अनुसार] समझा जाए?”


    प्रभु ने [कहा, “खतना] तुम्हारे [काम से] अधिक लाभदायक है। अपने भीतर से [उस चीज़ को निकाल दो जो] तुम्हें सताती है—हाँ, वह सब कुछ जो तुम्हारे हृदयों [के भीतर] है। क्योंकि जैसे-जैसे तुम्हारे हृदयों [का खतना होता है], वैसे-वैसे तुम ऊपर और नीचे की शक्तियों पर विजय पाने का मार्ग [पाओगे]। और मैं तुमसे कहता हूँ: जिसके पास [सामर्थ्य] है, वह उसका त्याग करे [और] मन फिराए; और जो [समझता] है, वह खोजे, पाए और आनन्द करे।”[c]


    यहूदा ने कहा, “देखिए, [मैं] देखता हूँ कि सब कुछ [ठीक] पृथ्वी के ऊपर एक चिह्न के समान है; और इसी कारण वे इस रीति से अस्तित्व में आए हैं।”


    प्रभु ने [कहा], “जब पिता ने संसार को स्थापित किया, तब उसने उसके जल में से कुछ [एकत्र किया], और उसमें से वचन निकला। […] उसने बहुत [कष्ट सहा, परन्तु] वह उन [तारों] के मार्ग से भी ऊँचा था जो सारी पृथ्वी को घेरे हुए हैं।”


    [उन्होंने आगे कहा], “ऊपर [एकत्र किया हुआ] जल तारों के पार है, और जल के [पार] एक विशाल अग्निकुंड है, जो दीवार के समान उन्हें घेरे हुए है। जैसे ही भीतर की कई सत्ताएँ शेष सत्ताओं से अलग हुईं, समयावधियों की [गणना होने लगी]।


    “जब [वह समूची वस्तु] स्थापित हो गई, तब उसने नीचे की ओर [देखा]—उस पिता ने, जिसने उससे कहा, ‘जा, [अपने भीतर से कुछ उत्पन्न कर], ताकि [पृथ्वी] पीढ़ी से [पीढ़ी तक] और युग से युग तक किसी वस्तु से वंचित न रहे।’[d]


    “तब [उसने] अपने भीतर से दूध के सोते, मधु के सोते, तेल और दाखमधु के सोते, अच्छे फल, मनभावने स्वाद और स्वास्थ्य देने वाली जड़ें उत्पन्न कीं, [ताकि] पृथ्वी पीढ़ी [से] पीढ़ी तक और युग से युग तक किसी वस्तु से वंचित न रहे।


    “वह ऊपर […] है; […] खड़ा हुआ [और उसने] अपना सौन्दर्य दिखाया […]। और बाहर [एक महान ज्योति थी], उस ज्योति से भी अधिक उज्ज्वल जो उसके समान है, क्योंकि वह ऊपर और नीचे के [सभी] ऐओनों पर शासन करती है।[e] [ज्योति] आग में से निकाली गई और ऊपर तथा नीचे [आकाशमंडल] में बिखेर दी गई। ऊपर आकाश पर और नीचे पृथ्वी पर जो हैं, वे उनसे लटके हुए हैं। सब कुछ उन्हीं पर टिका है।”[f]


    यह सुनकर यहूदा घुटनों के बल गिरकर दंडवत हुआ और प्रभु की स्तुति की।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: चौकोर कोष्ठकों में दिए शब्द क्षतिग्रस्त या लुप्त पाठ की विद्वत्तापूर्ण पूर्ति दर्शाते हैं; […] उस स्थान को दिखाता है जहाँ पाठ पढ़ा नहीं जा सकता या लुप्त है।
    reason: पांडुलिपि की खंडित अवस्था और अनुवाद में पूरित पाठ को पाठक के सामने स्पष्ट करना।
  - marker: b
    text: यहाँ ‘आत्मा’ और ‘जीवात्मा’ स्रोत-साक्ष्य में अलग शब्दों के अनुवाद हैं; ‘मन’ एक तीसरा पद है।
    reason: मानव के आंतरिक तत्त्वों के बीच पाठगत भेद बनाए रखना।
  - marker: c
    text: इस अनुच्छेद का आरंभ बहुत खंडित है। ‘तुम्हारे काम से अधिक लाभदायक’ और इसके बाद के वाक्य का सटीक संबंध अनिश्चित है।
    reason: दुर्बल पाठ-साक्ष्य से उत्पन्न व्याकरणिक और अर्थगत अनिश्चितता बताना।
  - marker: d
    text: इस अनुच्छेद के ‘वह’, ‘उसने’ और ‘उससे’ किस सत्ता या वस्तु की ओर संकेत करते हैं, यह खंडित पाठ में निश्चित नहीं है।
    reason: अस्पष्ट सर्वनामों की कृत्रिम पहचान से बचना।
  - marker: e
    text: ‘ऐओन’ एक प्राचीन ब्रह्मांड-विज्ञान संबंधी पद है; प्रसंग के अनुसार इसका अर्थ युग, लोक या दीर्घजीवी ब्रह्मांडीय सत्ता हो सकता है।
    reason: तकनीकी पद की वास्तविक अर्थ-सीमा और अस्पष्टता सुरक्षित रखना।
  - marker: f
    text: ‘वे’, ‘उनसे’ और ‘उन्हीं’ के पूर्वपद इस क्षतिग्रस्त अंश में स्पष्ट नहीं हैं।
    reason: अंतिम वाक्यों में संख्या और संदर्भ की पांडुलिपीय अस्पष्टता इंगित करना।
lexical_decisions:
- source_word: spirit
  choice: आत्मा
  rationale: धार्मिक और ब्रह्मांड-विषयक दोनों संदर्भों में स्वाभाविक हिन्दी शब्द; ‘soul’ से भेद बनाए रखने के लिए उसके लिए ‘जीवात्मा’ रखा गया है।
- source_word: soul
  choice: जीवात्मा
  rationale: ‘spirit’ के लिए प्रयुक्त ‘आत्मा’ से स्रोत-पाठ का शब्दगत भेद स्पष्ट रखता है।
- source_word: true mind
  choice: सच्चा मन
  rationale: ‘मन’ सामान्य पाठक के लिए सहज है और बौद्धिक तथा आंतरिक चेतना—दोनों अर्थों की संभावित व्यापकता बनाए रखता है।
- source_word: word
  choice: वचन
  rationale: सृष्टि-संबंधी संदर्भ में गरिमापूर्ण और पारंपरिक है, पर इसे स्पष्टतः किसी विशिष्ट धर्मसैद्धांतिक पहचान में सीमित नहीं करता।
- source_word: powers
  choice: शक्तियाँ
  rationale: ऊपर और नीचे की अलौकिक सत्ताओं के लिए स्रोत की खुली और बहुवचन भाषा सुरक्षित रखता है।
- source_word: aeons
  choice: ऐओन
  rationale: विशिष्ट प्राचीन ब्रह्मांड-विज्ञान संबंधी पद का लिप्यंतरण किया गया है; साधारण ‘युग’ से उसका संभावित सत्ता/लोक-संबंधी अर्थ खो सकता था।
- source_word: firmament
  choice: आकाशमंडल
  rationale: प्राचीन ब्रह्मांड-रचना की धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: circumcision
  choice: खतना
  rationale: आधुनिक मानक हिन्दी में सर्वाधिक समझा जाने वाला शब्द; बाहरी और हृदयगत खतने के पाठगत तनाव को बनाए रखता है।
theological_decisions:
- issue: आत्मा, जीवात्मा और मन का परस्पर संबंध
  choice: तीनों को अलग शब्दों—‘आत्मा’, ‘जीवात्मा’ और ‘मन’—से प्रस्तुत किया गया।
  alternative: सभी के लिए प्रसंगानुसार ‘आत्मा’ या ‘चित्त’ का प्रयोग।
  rationale: पाठ इन तत्त्वों में भेद करता दिखाई देता है; उन्हें मिलाना उसके मानव-विज्ञान संबंधी तनाव को अनावश्यक रूप से सुलझा देता।
- issue: खतने का अर्थ
  choice: शारीरिक खतने के प्रश्न और हृदयों के खतने के उत्तर—दोनों को यथावत रखा गया।
  alternative: पूरे अंश को केवल रूपकात्मक ‘मन की शुद्धि’ के रूप में अनुवाद करना।
  rationale: पाठ बाहरी कर्म और आंतरिक परिवर्तन के बीच संबंध को अस्पष्ट तथा तनावपूर्ण रखता है; अनुवाद ने कोई सांप्रदायिक निष्कर्ष नहीं थोपा।
- issue: ‘वचन’ की पहचान
