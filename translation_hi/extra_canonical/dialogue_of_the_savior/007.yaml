id: DSAV.007
reference: Dialogue of the Savior — The Place of Life
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'Mary asked her brothers: “Where will you store [these] questions you ask the Son of [Man]?”


    The Lord [said] to her: “Sister, [no one] can ask concerning these matters [except] one who possesses a place in the heart [] to store them. And a person like this can depart from [the world] and enter into the place [of life], and will not be detained in this world of poverty.”


    Matthew said: “Lord, I want [to behold] that place of life, [where] there is no iniquity, but where there is instead only pure [light].”


    The Lord answered: “Brother Matthew, you cannot see it as [long as you] wear the flesh.”


    Matthew said: “Lord, [if I] cannot see it, at least allow me to know it.”


    The Lord said: “Everyone who has known himself has seen it. Everything he is given to do, he does. Someone like that has thus come to [be like] that place in goodness.”'
