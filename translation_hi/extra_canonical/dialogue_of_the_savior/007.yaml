translation:
  language: hi
  text: 'मरियम ने अपने भाइयों से पूछा, “मनुष्य के [पुत्र] से जो [ये] प्रश्न तुम पूछते हो, उन्हें कहाँ सँजोकर रखोगे?”


    प्रभु ने उससे [कहा], “बहन, इन बातों के विषय में [कोई भी] प्रश्न नहीं कर सकता, [सिवाय] उसके जिसके हृदय में इन्हें सँजोने का स्थान [] हो। ऐसा व्यक्ति [संसार] से निकलकर [जीवन के] स्थान में प्रवेश कर सकता है और दरिद्रता के इस संसार में रोका नहीं जाएगा।”


    मत्ती ने कहा, “प्रभु, मैं जीवन के उस स्थान को [देखना] चाहता हूँ, [जहाँ] अधर्म नहीं है, बल्कि केवल शुद्ध [प्रकाश] है।”


    प्रभु ने उत्तर दिया, “भाई मत्ती, तुम उसे नहीं देख सकते, जब तक [तुम] देह धारण किए हुए हो।”


    मत्ती ने कहा, “प्रभु, [यदि मैं] उसे देख नहीं सकता, तो कम-से-कम मुझे उसे जानने दीजिए।”


    प्रभु ने कहा, “जिस किसी ने स्वयं को जाना है, उसने उसे देखा है। जिसे जो कुछ करने को दिया जाता है, वह उसे करता है। ऐसा व्यक्ति इस प्रकार भलाई में उस स्थान के [समान] हो गया है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Son of [Man]
  choice: मनुष्य के [पुत्र]
  rationale: परंपरागत पदवी को बनाए रखते हुए कोष्ठक द्वारा पाठ की पुनर्स्थापित सामग्री स्पष्ट रखी गई है।
- source_word: store
  choice: सँजोकर रखना
  rationale: प्रश्नों को भीतर सुरक्षित ग्रहण करने के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: place in the heart
  choice: हृदय में ... स्थान
  rationale: स्थान और आंतरिक ग्रहणशीलता, दोनों की मूल छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: place of life
  choice: जीवन का स्थान
  rationale: रहस्यमय स्थान-संबंधी भाषा को 'लोक' या 'स्वर्ग' जैसे अधिक निश्चित धर्मवैचारिक शब्दों से नहीं बदला गया।
- source_word: world of poverty
  choice: दरिद्रता का यह संसार
  rationale: poverty के ठोस और संभवतः आध्यात्मिक दोनों अर्थ खुले रखता है।
- source_word: pure light
  choice: निर्मल ज्योति
  rationale: दिग्निफाइड और सहज धार्मिक हिन्दी में प्रकाश की शुद्धता व्यक्त करता है।
- source_word: wear the flesh
  choice: देह धारण किए हुए होना
  rationale: शाब्दिक 'देह पहनना' की अस्वाभाविकता से बचते हुए देह को अस्थायी आवरण मानने वाली छवि बनाए रखता है।
- source_word: known himself
  choice: अपने आप को जाना
  rationale: आत्मज्ञान के कथन को ज्यों का त्यों रखता है और उसमें किसी विशिष्ट धर्मसिद्धान्त का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ‘जीवन के स्थान’ की पहचान
  choice: इसे अनिर्दिष्ट रहस्यमय स्थान के रूप में रखा गया
  alternative: इसे स्वर्ग, परमेश्वर का राज्य या मोक्षलोक कहना
  rationale: साक्ष्य स्वयं इसकी स्पष्ट पहचान नहीं करता; अधिक निश्चित पद मूल की अस्पष्टता को समाप्त कर देते।
- issue: ‘अपने आप को जानना’ का आशय
  choice: प्रत्यक्ष आत्मज्ञान-संबंधी कथन को बनाए रखा गया
  alternative: इसे परमेश्वर को जानना, उद्धार पाना या दिव्य स्वरूप पहचानना कहना
  rationale: अनुवाद में निहित धर्मवैचारिक तनाव को किसी संप्रदायगत व्याख्या से हल नहीं किया गया।
- issue: अंतिम वाक्य में व्यक्ति और स्थान की समानता
  choice: ‘भलाई में उस स्थान के [समान]’
  alternative: ‘उस अच्छे स्थान में पहुँच गया’
  rationale: वाक्य व्यक्ति के उस स्थान जैसा हो जाने की संभावना रखता है; केवल वहाँ पहुँचने का अर्थ देने से यह तनाव मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध। सभी वर्ग कोष्ठक पांडुलिपि की क्षति या संपादकीय पुनर्स्थापना को मूल साक्ष्य के अनुसार दिखाते हैं; खाली [] को भी यथावत रखा गया है। चूँकि प्रत्यक्ष कॉप्टिक समीक्षा लंबित है, यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-सचेत अनुवाद है।
