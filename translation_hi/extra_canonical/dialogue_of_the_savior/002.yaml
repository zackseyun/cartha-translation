translation:
  language: hi
  text: '“जब तुम स्तुति अर्पित करो, तो इस प्रकार करो:


    हे पिता, हमारी सुन,

    जैसे तूने अपने एकमात्र पुत्र की सुनी,

    और उसे अपने पास ग्रहण भी किया।

    [तूने] उसे बहुत [परिश्रम] से विश्राम दिया।

    हमारी सामर्थ्य [पराजित नहीं की जा सकती],

    [क्योंकि] तेरी युद्ध-सेनाएँ [पराजित नहीं की जा सकतीं],

    [. . .] ज्योति [. . .] जीवित [. . .] अगम्य [. . . जीवित]।

    [सच्चे] वचन ने [जीवन के लिए] मन-फिराव [दिया है],

    [और यह] तुझसे [निकला है]।

    तू एकाकी जन का विचार और पूर्ण शांति है।

    एक बार फिर हमारी सुन,

    जैसे तूने अपने चुने हुओं की सुनी।

    तेरे बलिदान के द्वारा चुने हुए भीतर प्रवेश करेंगे।

    अपने भले कामों के द्वारा उन्होंने अपनी आत्माओं को शरीर के अंधे अंगों से मुक्त किया है,

    ताकि वे [] सदा तक अस्तित्व में रह सकें।

    आमेन।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: offer up praise
  choice: स्तुति अर्पित करो
  rationale: प्रार्थनात्मक और बलिदानी छाया को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: only Son
  choice: एकमात्र पुत्र
  rationale: ‘only’ का सीधा अर्थ सुरक्षित रखा गया; पांडुलिपीय स्रोत की समीक्षा के बिना अधिक विशिष्ट धर्मशास्त्रीय पद नहीं जोड़ा गया।
- source_word: rest
  choice: विश्राम
  rationale: मूल साक्ष्य में निहित विश्राम/परिश्रम से राहत का अर्थ बनाए रखता है।
- source_word: battle forces
  choice: युद्ध-सेनाएँ
  rationale: सैन्य बिंब को स्पष्ट रखते हुए ‘forces’ की सामूहिकता व्यक्त करता है।
- source_word: inaccessible
  choice: अगम्य
  rationale: दुर्गम अथवा पहुँच से परे होने का गरिमापूर्ण और संक्षिप्त हिन्दी पद।
- source_word: repentance
  choice: मन-फिराव
  rationale: केवल पछतावे के बजाय दिशा और मन के परिवर्तन का भाव व्यक्त करता है।
- source_word: solitary
  choice: एकाकी जन
  rationale: शब्द की संभावित व्यक्तिवाचक/आध्यात्मिक अस्पष्टता को ‘एकांतवासी’ जैसे अधिक संप्रदायगत अर्थ में सीमित नहीं करता।
- source_word: elect
  choice: चुने हुए
  rationale: चयन के धार्मिक अर्थ को सामान्य, बोधगम्य हिन्दी में सुरक्षित रखता है।
- source_word: blind bodily limbs
  choice: शरीर के अंधे अंग
  rationale: असामान्य और तनावपूर्ण मूल रूपक को व्याख्यात्मक ढंग से सरल किए बिना बनाए रखता है।
theological_decisions:
- issue: ‘तेरे बलिदान’ का कर्ता अथवा आशय
  choice: तेरे बलिदान के द्वारा
  alternative: तुझे चढ़ाए गए बलिदान के द्वारा
  rationale: साक्ष्य की व्याकरणिक और धर्मशास्त्रीय अस्पष्टता को नहीं सुलझाया गया; हिन्दी में वही खुलापन रखा गया है।
- issue: भले कामों द्वारा आत्माओं की मुक्ति
  choice: पाठ के प्रत्यक्ष कथन को यथावत रखा
  alternative: अनुग्रह अथवा विश्वास संबंधी व्याख्यात्मक भाषा जोड़ना
  rationale: दूसरी परंपराओं की धर्मशास्त्रीय प्रणाली आयात किए बिना उपलब्ध साक्ष्य का तनाव सुरक्षित रखा गया।
- issue: ‘एकाकी जन’ की पहचान
  choice: पहचान अनिर्धारित रखी
  alternative: इसे परमेश्वर, मसीह, साधक या संन्यासी के रूप में स्पष्ट करना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य किसी एक पहचान को निर्णायक रूप से स्थापित नहीं करता।
- issue: ‘वचन’ का व्यक्तित्व
  choice: ‘वचन’ रखा, पर उसे स्पष्ट रूप से किसी नामित व्यक्ति से नहीं जोड़ा
  alternative: ‘मसीह’ लिखना
  rationale: पाठ में उपस्थित धर्मशास्त्रीय संभावना को सुरक्षित रखते हुए उससे अधिक निश्चित दावा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। सम्बोधन में निकटता और मूल की एकवचनता बनाए रखने के लिए ‘तू/तेरी’ का प्रयोग किया गया है। चौकोर कोष्ठक, रिक्ति और बिंदु पांडुलिपि-क्षति तथा संपादकीय पुनर्स्थापन के संकेत के रूप में यथासंभव ज्यों के त्यों रखे गए हैं। यह मसौदा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
