review_pass:
  verdict: revise
  source_fidelity: The draft substantially follows the provisional English witness and retains its damaged-text signals. However, the added “[a]” is not present in the witness, and the coordination “खोज की और [सच्चा जीवन पा लिया]” weakens the witness’s participial sense (“having [discovered]”).
  naturalness: Several phrases are understandable but unnecessarily stiff or awkward in modern standard Hindi, especially “जहाँ तक तुम्हारा संबंध है,” “भरपूर प्रयत्न करो,” and “भटकाव में न ले जाओ.” The revision uses idiomatic, dignified Hindi while retaining the warning’s causal sense.
  terminology: “क्रोध,” “ईर्ष्या,” “कर्म,” “सच्चा जीवन,” “विश्राम,” and “उद्धारकर्ता” are suitable. “आत्माओं और प्राणों” preserves the source’s two distinct terms without importing a doctrinal theory; the verb is adjusted for natural Hindi.
  issues:
  - severity: medium
    issue: Unwitnessed footnote marker “[a]” appears in the translated text.
    rationale: The English POB text has an empty bracket followed by a lacuna (“[] [. . .]”), not a footnote anchor. Adding an anchor and an explanatory note introduces editorial structure not present in the audited text.
  - severity: low
    issue: The discovered-life clause is rendered as coordinated actions rather than a completed participial action.
    rationale: “the one who searched, having [discovered the true life]” is more closely represented by “जिसने खोज की और [सच्चे जीवन को पा लिया है]”; this preserves the relation while respecting the restoration brackets.
  - severity: low
    issue: Some wording is less natural than needed in modern Hindi.
    rationale: “स्वयं ... मुक्त होने का भरसक प्रयत्न करो” and “भटकने न दो” are clearer and more idiomatic without altering meaning.
  revised_text: '“तुम स्वयं [क्रोध] और ईर्ष्या से मुक्त होने का भरसक प्रयत्न करो। अपने [कर्मों] को अपने ऊपर से उतार फेंको, और मत [. . .]। [] [. . .] निंदा [. . .], क्योंकि मैं [तुमसे . . .] कहता हूँ, तुम [. . .] बहुत [. . .] पाओगे [. . .] जिसने खोज की और [सच्चे जीवन को पा लिया है]। वह [विश्राम पाएगा और] सदा जीवित रहेगा। मैं [तुमसे कहता हूँ, सावधान रहो], ताकि तुम अपनी आत्माओं और प्राणों को भटकने न दो।”


    [उद्धारकर्ता का संवाद]'
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported footnote anchor and retains the witness’s empty bracket and lacuna exactly as textual-damage signals. It improves idiomatic Hindi and more closely reflects the completed-action force of “having discovered,” while leaving all restorations in square brackets and making no theological expansion.
