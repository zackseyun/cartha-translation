base_translation:
  language: en
  yaml_path: translation/extra_canonical/dialogue_of_the_savior/015.yaml
  text: 'As for you, strive diligently to free yourselves from [wrath] and jealousy. Strip yourselves of your [works], and do not [. . .]. [] [. . .] reproach [. . .], because I say to [you, . . .] you will receive [. . .] much [. . .] the one who searched and [discovered the true life]. This person will [attain rest and] live forever. I say to [you, guard yourselves], so that you do not lead [your] spirits and souls into error.


    [The Dialogue] of the Savior'
translation:
  language: hi
  text: '“जहाँ तक तुम्हारा संबंध है, अपने आपको [क्रोध] और ईर्ष्या से मुक्त करने के लिए भरपूर प्रयत्न करो। अपने [कर्मों] को अपने ऊपर से उतार फेंको, और मत [. . .]। [a] [. . .] निंदा [. . .], क्योंकि मैं [तुमसे . . .] कहता हूँ, तुम [. . .] बहुत [. . .] पाओगे [. . .] वह जिसने खोज की और [सच्चा जीवन पा लिया]। वह [विश्राम पाएगा और] सदा जीवित रहेगा। मैं [तुमसे कहता हूँ, सावधान रहो], ताकि तुम [अपनी] आत्माओं और प्राणों को भटकाव में न ले जाओ।”


    [उद्धारकर्ता का संवाद]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ और आगे के चौकोर कोष्ठक संपादकीय पुनर्स्थापन दर्शाते हैं; “[. . .]” पांडुलिपि के नष्ट या अपठनीय अंश को दिखाता है। इस स्थान पर पाठ का वाक्य-संबंध सुरक्षित रूप से पुनर्निर्मित नहीं किया जा सकता।
    reason: खंडित कॉप्टिक पांडुलिपि की स्थिति और अनुवाद की अनिश्चितता पाठक के सामने स्पष्ट रखना आवश्यक है।
lexical_decisions:
- source_word: wrath
  choice: क्रोध
  rationale: कोष्ठकों में पुनर्स्थापित भाव को सामान्य, गरिमापूर्ण और सीधा हिन्दी रूप देता है।
- source_word: jealousy
  choice: ईर्ष्या
  rationale: नैतिक संदर्भ में स्वाभाविक आधुनिक हिन्दी शब्द।
- source_word: works
  choice: कर्म
  rationale: यहाँ अस्पष्ट बहुवचन को बनाए रखता है; इसे केवल ‘पाप’ या ‘बुरे काम’ कहकर धर्मवैचारिक अर्थ सीमित नहीं किया गया।
- source_word: strip from yourselves
  choice: अपने ऊपर से उतार फेंको
  rationale: वस्त्र उतारने जैसी मूल रूपकात्मक तीव्रता बनाए रखता है और कर्मों से अलग होने का भाव देता है।
- source_word: true life
  choice: सच्चा जीवन
  rationale: ‘वास्तविक’ की अपेक्षा धार्मिक-आध्यात्मिक प्रसंग में सहज है, पर अर्थ को किसी विशिष्ट सिद्धांत तक सीमित नहीं करता।
- source_word: rest
  choice: विश्राम
  rationale: शारीरिक राहत और अंतिम आध्यात्मिक विश्राम—दोनों संभावनाएँ खुली रखता है।
- source_word: spirits and souls
  choice: आत्माओं और प्राणों
  rationale: दो अलग संज्ञाओं का भेद बनाए रखने के लिए ‘spirits’ को ‘आत्माएँ’ और ‘souls’ को ‘प्राण’ दिया गया; पूर्ण समानार्थी बनाकर तनाव मिटाया नहीं गया।
- source_word: lead ... into error
  choice: भटकाव में ले जाओ
  rationale: जानबूझकर या अनजाने में गलत दिशा देने की मूल गतिशील छवि सुरक्षित रखता है।
theological_decisions:
- issue: ‘works’ का नैतिक या आध्यात्मिक आशय
  choice: कर्मों
  alternative: बुरे कर्मों / सांसारिक कामों
  rationale: उपलब्ध साक्ष्य में विशेषण नहीं है; इसलिए कर्मों को स्वतः बुरा या सांसारिक घोषित नहीं किया गया।
- issue: ‘rest’ का अंतिम उद्धार-संबंधी अर्थ
  choice: विश्राम पाएगा
  alternative: मुक्ति पाएगा
  rationale: ‘मुक्ति’ अधिक व्याख्यात्मक और सिद्धांत-विशिष्ट होती; ‘विश्राम’ स्रोत की छवि तथा संभावित बहुअर्थता बचाता है।
- issue: ‘live forever’ की प्रकृति
  choice: सदा जीवित रहेगा
  alternative: अनन्त जीवन पाएगा
  rationale: क्रियात्मक कथन को बनाए रखा गया और इसे किसी व्यवस्थित धर्मवैचारिक पद में नहीं बदला गया।
- issue: spirit और soul का संबंध
  choice: आत्माओं और प्राणों
  alternative: आत्मा और मन / रूहों और आत्माओं
  rationale: दोनों पद अलग रखे गए, पर उनके पारस्परिक संबंध पर कोई अतिरिक्त मानवशास्त्रीय सिद्धांत नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष कॉप्टिक समीक्षा अभी शेष है। चौकोर कोष्ठक और दीर्घविराम पांडुलिपीय क्षति तथा संपादकीय पुनर्स्थापन के संकेत के रूप में सुरक्षित रखे गए हैं। शीर्षक में ‘Savior’ के लिए ‘उद्धारकर्ता’ चुना गया है।
