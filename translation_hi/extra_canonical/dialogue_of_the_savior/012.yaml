translation:
  language: hi
  text: 'शिष्यों ने उनसे पूछा, “परिपूर्णता क्या है, और न्यूनता क्या है?”


    उन्होंने उनसे कहा, “तुम परिपूर्णता से आए हो, और न्यूनता के स्थान में रहते हो।


    और देखो, उसका प्रकाश मुझ पर बरसा है।”


    मत्ती ने पूछा, “प्रभु, मुझे बताइए कि जो मरे हुए हैं वे कैसे मरते हैं, और जो जीवित हैं वे कैसे जीते हैं।”


    [] प्रभु ने कहा, “[तुमने] मुझसे एक [सच्चे] कथन के विषय में पूछा है, जिसे आँख ने नहीं देखा; और केवल तुम ही हो जिनसे मैंने यह सुना है। पर मैं तुमसे कहता हूँ: जब वह जो मनुष्य को जीवित रखता है उससे निकाल लिया जाता है, तो वह मरा हुआ कहलाएगा; और जब वह जो जीवित है, मरे हुए में <प्रवेश करता है>, तो वह जीवित कहलाएगा।”[a]


    यहूदा ने पूछा, “सच-सच कहें तो कुछ लोग क्यों <मरते हैं> और कुछ क्यों जीते हैं?”


    प्रभु ने कहा, “जो कुछ सत्य से आता है, वह नहीं मरेगा। जो कुछ स्त्री से आता है, वह मरेगा।”


    मरियम ने पूछा, “प्रभु, मुझे बताइए कि मैं इस स्थान में क्यों आई हूँ—लाभ पाने के लिए या हानि उठाने के लिए?”


    प्रभु ने उत्तर दिया, “तुम प्रकट करनेवाले की संपदा प्रकट करती हो।”[b]


    मरियम ने उनसे पूछा, “प्रभु, तो क्या कोई ऐसा स्थान है जिसे सत्य ने छोड़ दिया है, या जिसमें सत्य का अभाव है?”[c]


    प्रभु ने कहा, “वह स्थान जहाँ मैं निवास नहीं करता।”


    मरियम ने कहा, “प्रभु, आप भय और विस्मय उत्पन्न करते हैं, [] यहाँ तक कि उन लोगों के लिए [भस्म करनेवाली आग के समान] जो [आपको] नहीं जानते।”[d]


    मत्ती ने पूछा, “हम इसी समय विश्राम क्यों नहीं पाते?”


    प्रभु ने कहा, “जिसे तुम अपने साथ नहीं ले जा सकते, उसे पीछे छोड़ देने पर तुम विश्राम पाओगे।”


    मत्ती ने पूछा, “छोटा बड़े के साथ कैसे मेल खाता है?”


    प्रभु ने कहा, “इन बोझों को पीछे छोड़ देने से।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठक [ ] पांडुलिपि में पुनर्स्थापित पाठ और कोणीय कोष्ठक < > संपादकीय रूप से पूरित पाठ को दर्शाते हैं। इस अंश की प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है।
    reason: पाठीय और संपादकीय संकेतों को स्पष्ट करना तथा अनुवाद के अस्थायी स्रोताधार को ईमानदारी से बताना।
  - marker: b
    text: “प्रकट करनेवाले की संपदा” का अर्थ संदर्भ में अस्पष्ट है; इसे किसी विशेष व्यक्ति, ज्ञान या आध्यात्मिक पद के रूप में निश्चित नहीं किया गया है।
    reason: वास्तविक अर्थगत और धर्मवैज्ञानिक अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: 'उपलब्ध साक्षी इस प्रश्न को दो प्रकार से समझने देता है: ऐसा स्थान जिसे सत्य ने छोड़ दिया हो, अथवा ऐसा स्थान जहाँ सत्य का अभाव हो।'
    reason: स्रोत-साक्षी में दिए वैकल्पिक संबंध को संरक्षित करना।
  - marker: d
    text: “[भस्म करनेवाली आग के समान]” और “[आपको]” पुनर्स्थापित पाठ हैं; इस वाक्य में इनके पहले पांडुलिपि की एक रिक्ति भी [] से सूचित की गई है।
    reason: खंडित पाठ और पुनर्निर्माण की स्थिति बताना, बिना अपठनीय रिक्ति को कृत्रिम शब्दों से भरने के।
lexical_decisions:
- source_word: fullness
  choice: परिपूर्णता
  rationale: यह अमूर्त और संभवतः पारिभाषिक अर्थ को बनाए रखता है; ‘भरपूरी’ की तुलना में अधिक स्वाभाविक दार्शनिक-वाचक संज्ञा है।
- source_word: deficiency
  choice: न्यूनता
  rationale: ‘अभाव’ संभव था, पर ‘न्यूनता’ fullness के साथ वैचारिक विरोध को अधिक स्पष्ट रखते हुए अर्थ को किसी विशिष्ट धर्मवैज्ञानिक तंत्र में सीमित नहीं करती।
- source_word: what animates a person
  choice: वह जो मनुष्य को जीवित रखता है
  rationale: अंतर्निहित तत्त्व को ‘आत्मा’ या ‘प्राण’ मानकर निश्चित करने के बजाय साक्ष्य की अस्पष्टता सुरक्षित रखी गई है।
- source_word: revealer
  choice: प्रकट करनेवाला
  rationale: कर्तृवाचक अर्थ को सीधे रखा गया है और किसी पहचाने हुए व्यक्ति या पदवी को अनावश्यक रूप से आरोपित नहीं किया गया।
- source_word: rest
  choice: विश्राम
  rationale: शारीरिक आराम तथा आध्यात्मिक विश्रांति—दोनों संभावनाएँ खुली रहती हैं।
- source_word: harmonize
  choice: मेल खाता है
  rationale: आधुनिक और सहज अभिव्यक्ति, जो सामंजस्य या अनुरूपता के अस्पष्ट संबंध को बनाए रखती है।
theological_decisions:
- issue: ‘his light’ में सर्वनाम का संदर्भ
  choice: ‘उसका प्रकाश’
  alternative: ‘परमेश्वर का प्रकाश’ या ‘उसकी ज्योति’
  rationale: साक्षी में पूर्वपद स्पष्ट नहीं है; किसी विशिष्ट व्यक्ति को जोड़ने के बजाय सर्वनाम की संदर्भगत अस्पष्टता रखी गई है।
- issue: मनुष्य को सजीव करनेवाले तत्त्व की पहचान
  choice: ‘वह जो मनुष्य को जीवित रखता है’
  alternative: ‘आत्मा’ या ‘प्राण’
  rationale: मूल कॉप्टिक की समीक्षा लंबित है और अंग्रेज़ी साक्षी व्याख्यात्मक वाक्यांश देता है; किसी निश्चित मानवशास्त्रीय सिद्धांत को आरोपित नहीं किया गया।
- issue: ‘जो कुछ स्त्री से आता है’ का आशय
  choice: शाब्दिक संरचना बनाए रखी गई
  alternative: ‘जो स्त्री से जन्मता है’
  rationale: ‘जन्म’ संभावित अर्थ है, पर उपलब्ध साक्षी का व्यापक और तनावपूर्ण कथन संकुचित नहीं किया गया।
- issue: सत्य से रहित स्थान संबंधी प्रश्न
  choice: दोनों संभावनाएँ—सत्य द्वारा छोड़ा हुआ अथवा सत्य का अभाव—मुख्य पाठ में रखीं
  alternative: केवल ‘जहाँ सत्य नहीं है’
  rationale: अंग्रेज़ी साक्षी दो संभावित संबंध प्रस्तुत करता है; अनिश्चितता का मौन समाधान नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक संवाद और गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। पारिभाषिक अमूर्तताओं को बनाए रखते हुए वाक्यों को स्वाभाविक हिन्दी में रखा गया। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; नाग हम्मादी कॉप्टिक पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण पाठीय पुनर्स्थापन और अस्पष्टताओं को स्पष्ट रूप से चिह्नित किया गया है।
