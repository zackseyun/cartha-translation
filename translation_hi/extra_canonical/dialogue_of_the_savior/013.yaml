    rationale: साक्ष्य में [If you have understood] एक इकाई है, जबकि मसौदे में इसे ‘[यदि तुमने] ... [समझ लिया है]’ कर दिया गया है। खंडित साक्ष्य में पुनर्स्थापित अंशों की सीमाएँ सुरक्षित रहनी चाहिए।
