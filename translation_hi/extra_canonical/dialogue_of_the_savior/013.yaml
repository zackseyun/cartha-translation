translation:
  language: hi
  text: '**सब कुछ समझना**


    मरियम ने कहा, “मैं सब कुछ [ठीक उसी रूप में] समझना चाहती हूँ जैसा वह है।”


    प्रभु ने कहा, “जो जीवन की खोज करता है, उसके लिए यही धन होगा, क्योंकि संसार का दिया हुआ [विश्राम] झूठा है और उसका सोना-चाँदी छलपूर्ण है।”


    उनके शिष्यों ने उनसे पूछा, “हम क्या करें कि हमारा कार्य पूरा हो जाए?”


    प्रभु ने उनसे [कहा], “हर परिस्थिति के लिए तैयार रहो। धन्य है वह जिसने […] [संघर्ष को जाना और अपनी आँखों से] युद्ध देखा है। उसने न किसी को मारा है, न [वह] मारा गया है, बल्कि वह विजयी होकर निकला है।”


    यहूदा ने पूछा, “प्रभु, मुझे बताइए, मार्ग का आरम्भ क्या है?”


    उन्होंने कहा, “प्रेम और भलाई। यदि इनमें से केवल एक भी शासक शक्तियों[a] में होती, तो बुराई कभी अस्तित्व में न आती।”


    मत्ती ने कहा, “प्रभु, आपने सब वस्तुओं के अंत के विषय में बिना कठिनाई के बताया है।”


    प्रभु ने कहा, “जो कुछ मैंने तुमसे कहा, वह सब तुमने समझ लिया है और विश्वास के साथ स्वीकार किया है। यदि तुम उसे जानते हो, तो वह तुम्हारा है; यदि नहीं जानते, तो वह तुम्हारा नहीं है।”


    उन्होंने उनसे पूछा, “हम किस स्थान पर जा रहे हैं?”


    प्रभु ने कहा, “जिस स्थान तक तुम पहुँच सकते हो, उसमें अपना स्थान ग्रहण करो।”


    मरियम ने पूछा, “क्या इस प्रकार व्यवस्थित की गई हर वस्तु दिखाई देती है?”


    प्रभु ने कहा, “मैंने तुमसे कहा है कि जो देख सकता है, वही प्रकट भी करता है।”


    उनके बारह शिष्यों ने उनसे पूछा, “गुरु, [के साथ] […] शान्ति […] हमें सिखाइए […].”


    प्रभु ने कहा, “[यदि तुमने] वह सब [समझ लिया है] जो मैंने [तुमसे कहा है], तो तुम [मृत्यु से परे हो जाओगे, क्योंकि] तुम […] सब कुछ।”


    मरियम ने कहा, “सत्य के रहस्य के विषय में मैं प्रभु से केवल एक बात [कहूँगी]। हम इसी में स्थिर खड़े हैं, और इसी में संसार से सम्बन्ध रखनेवाली बातों के सामने हम पारदर्शी हैं।”


    यहूदा ने मत्ती से कहा, “हम समझना चाहते हैं कि जब हम [देह] की नाशशीलता से निकल जाएँगे, तब हमें किस प्रकार के वस्त्र पहनाए जाएँगे।”


    प्रभु ने कहा, “शासकों और प्रबन्धकों के पास ऐसे वस्त्र हैं जो केवल कुछ समय के लिए दिए जाते हैं और टिकते नहीं। पर तुम, जो सत्य के पुत्र हो, उन वस्त्रों को मत पहनो जो केवल कुछ समय तक टिकते हैं। इसके बजाय मैं तुमसे कहता हूँ: जब तुम अपने वस्त्र उतारोगे, तब तुम धन्य होगे, क्योंकि […] [बाहरी वस्तु को उतार देना] कोई बड़ी बात नहीं है।”


    […] ने कहा, “क्या बोलनेवाला मैं हूँ और क्या ग्रहण करनेवाला भी मैं ही हूँ […]?”


    प्रभु ने कहा, “हाँ, [वह जो] अपने पिता को [विवेकपूर्ण ढंग से ग्रहण करता है]।”


    [a] “शासक शक्तियाँ”: साक्ष्य-पाठ में यूनानी मूल का शब्द *archons* है; इस साहित्य में यह प्रायः विश्व पर शासन करनेवाली अलौकिक शक्तियों के लिए प्रयुक्त होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“शासक शक्तियाँ”: साक्ष्य-पाठ में यूनानी मूल का शब्द *archons* है; इस साहित्य में यह प्रायः विश्व पर शासन करनेवाली अलौकिक शक्तियों के लिए प्रयुक्त होता है।'
    reason: अपरिचित तकनीकी पद का अर्थ बताए बिना उसे किसी एक विकसित धर्मवैज्ञानिक व्यवस्था के साथ पूर्णतः समान ठहराने से बचना।
lexical_decisions:
- source_word: life
  choice: जीवन
  rationale: वाक्य की आध्यात्मिक तथा अस्तित्वगत व्यापकता बनाए रखने के लिए सामान्य और गरिमापूर्ण शब्द चुना गया।
- source_word: '[rest]'
  choice: '[विश्राम]'
  rationale: साक्ष्य-पाठ में यह संपादकीय पुनर्स्थापना है; इसलिए हिन्दी में भी कोष्ठक बनाए रखे गए और अर्थ को किसी विशेष धर्मवैज्ञानिक धारणा तक सीमित नहीं किया गया।
- source_word: archons
  choice: शासक शक्तियाँ
  rationale: केवल ‘शासक’ कहने से मानवीय अधिकारी समझे जा सकते थे; ‘शासक शक्तियाँ’ इस ग्रन्थ-संसार में सम्भावित अलौकिक अर्थ को व्यक्त करता है, जबकि पादटिप्पणी मूल पारिभाषिक शब्द की सूचना देती है।
- source_word: the beginning of the path
  choice: मार्ग का आरम्भ
  rationale: रूपक को सीधे बनाए रखा गया है और ‘मार्ग’ की आध्यात्मिक अस्पष्टता को नहीं खोला गया।
- source_word: garments
  choice: वस्त्र
  rationale: मूल रूपक को बनाए रखा गया है; इसे शरीर, आत्मिक आवरण या किसी संस्कार के रूप में व्याख्यायित नहीं किया गया।
- source_word: destructibility of the [flesh]
  choice: '[देह] की नाशशीलता'
  rationale: पुनर्स्थापित ‘flesh’ के लिए चिह्न सुरक्षित रखा गया और अमूर्त destructibility को स्वाभाविक हिन्दी में ‘नाशशीलता’ कहा गया।
- source_word: transparent
  choice: पारदर्शी
  rationale: साक्ष्य-पाठ का असामान्य और सम्भवतः तकनीकी रूपक जानबूझकर सुरक्षित रखा गया; इसे ‘निर्दोष’ या ‘अदृश्य’ बनाकर अर्थ-निर्णय नहीं किया गया।
- source_word: in [a logical way]
  choice: '[विवेकपूर्ण ढंग से]'
  rationale: खंडित और संपादकीय रूप से पुनर्स्थापित पद को चिह्नित रखते हुए ऐसा हिन्दी रूप चुना गया जो ‘logical/rational’ का बोध देता है, पर वाक्य की कठिनता को पूरी तरह समतल नहीं करता।
theological_decisions:
- issue: बुराई की उत्पत्ति और archons की भूमिका
  choice: शर्तात्मक कथन को ज्यों का त्यों रखा गया कि प्रेम या भलाई होती तो बुराई अस्तित्व में न आती
  alternative: इसे पतन, पाप या किसी विशिष्ट सृष्टि-विज्ञान की स्पष्ट व्याख्या में बदलना
  rationale: पाठ स्वयं एक तनावपूर्ण, संक्षिप्त दावा करता है; किसी सम्प्रदायगत कारण-सिद्धान्त को जोड़ना उचित नहीं।
- issue: ‘मृत्यु से परे’ होने का अर्थ
  choice: पुनर्स्थापित पाठ को कोष्ठकों सहित ‘मृत्यु से परे हो जाओगे’ कहा गया
  alternative: ‘अमर आत्मा बनोगे’, ‘अनन्त जीवन पाओगे’ या शारीरिक पुनरुत्थान का स्पष्ट उल्लेख
  rationale: खंडित साक्ष्य यह तय नहीं करता कि अभिप्राय शारीरिक, आत्मिक या ज्ञान-संबंधी अमरता है।
- issue: वस्त्र उतारने का रूपक
  choice: वस्त्र-भाषा को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे देह-त्याग, सांसारिक पहचान, बपतिस्मा या तपस्या के रूप में स्पष्ट करना
  rationale: पाठ की रूपकात्मक बहुअर्थता सुरक्षित रहनी चाहिए।
- issue: ‘जो देखता है वही प्रकट करता है’ में कर्ता की पहचान
  choice: एक ही व्यक्ति को देखने और प्रकट करनेवाला दर्शानेवाला वाक्य रखा गया
  alternative: प्रभु को प्रकट करनेवाला और शिष्य को देखनेवाला अलग-अलग मानना
  rationale: साक्ष्य की कोष्ठकीय व्याख्या समान कर्ता की ओर संकेत करती है, किन्तु उसकी पहचान नहीं बताती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। संवाद में आदरसूचक ‘आप’ और शिष्यों को सम्बोधन में प्रसंगानुकूल ‘तुम’ रखा गया है। वर्ग कोष्ठक संपादकीय पुनर्स्थापन को और […] पाठ-हानि को दर्शाते हैं। उपलब्ध आधार कॉप्टिक पाण्डुलिपि का प्रत्यक्ष परीक्षण नहीं, बल्कि दिया गया सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए मसौदा अनिवार्यतः अस्थायी है और स्रोत-भाषा समीक्षा के बाद जाँचा जाना चाहिए।
