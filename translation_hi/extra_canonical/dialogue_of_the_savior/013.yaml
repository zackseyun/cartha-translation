  revised_text: '**सब कुछ समझना**


    मरियम ने कहा, “मैं सब कुछ [ठीक उसी रूप में] समझना चाहती हूँ जैसा वह है।”


    प्रभु ने कहा, “जो जीवन की खोज करता है, उसके लिए यही उसका धन होगा, क्योंकि जो [विश्राम] संसार (देता है) वह झूठा है, और उसका सोना और चाँदी छलपूर्ण हैं।”


    उनके शिष्यों ने उनसे पूछा, “हम क्या करें कि हमारा कार्य पूरा हो जाए?”


    प्रभु ने उनसे [कहा], “हर परिस्थिति में तैयार रहो। धन्य है वह जिसने [] [संघर्ष को जाना और अपनी आँखों से] युद्ध देखा है। उसने न किसी को मारा है, न [वह] मारा गया है, बल्कि वह विजयी होकर निकला है।”


    यहूदा ने पूछा, “प्रभु, मुझे बताइए, मार्ग का आरम्भ क्या है?”


    उन्होंने कहा, “प्रेम और भलाई। यदि इनमें से केवल एक भी आर्कोनों[a] में होती, तो बुराई कभी अस्तित्व में न आती।”


    मत्ती ने कहा, “प्रभु, आपने सब वस्तुओं के अंत के विषय में बिना कठिनाई के कहा है।”


    प्रभु ने कहा, “जो कुछ मैंने तुमसे कहा, वह सब तुमने समझ लिया है और उसे विश्वासपूर्वक स्वीकार किया है। यदि तुम उसे जानते हो, तो वह तुम्हारा है; यदि तुम उसे नहीं जानते, तो वह तुम्हारा नहीं है।”


    उन्होंने उनसे पूछा, “हम किस स्थान पर जा रहे हैं?”


    प्रभु ने कहा, “उस स्थान को ग्रहण करो जहाँ तक तुम पहुँच सकते हो।”


    मरियम ने पूछा, “क्या इस प्रकार स्थापित हर वस्तु दिखाई देती है?”


    प्रभु ने कहा, “मैंने तुमसे कहा है कि जो देख सकता है (वही प्रकट करता है)।”


    उनके बारह शिष्यों ने उनसे पूछा, “गुरु, [के साथ] [] शान्ति […] हमें सिखाइए […].”


    प्रभु ने कहा, “[यदि तुम समझ चुके हो] वह सब जो मैंने [तुमसे कहा है], तो तुम [अमर हो जाओगे, क्योंकि] तुम […] सब कुछ।”


    मरियम ने कहा, “सत्य के रहस्य के विषय में मैं प्रभु से केवल एक बात [कहूँगी]। इसी में हम खड़े हैं, और इसी में हम संसार से संबंधित बातों के प्रति पारदर्शी हैं।”


    यहूदा ने मत्ती से कहा, “हम समझना चाहते हैं कि जब हम [देह] की नाशशीलता से निकल जाएँगे, तब हमें किस प्रकार के वस्त्र पहनाए जाएँगे।”


    प्रभु ने कहा, “शासकों और प्रशासकों के पास ऐसे वस्त्र हैं जो केवल कुछ समय के लिए दिए जाते हैं और टिकते नहीं। पर तुम, सत्य के पुत्र होने के नाते, उन वस्त्रों को मत पहनो जो केवल कुछ समय तक टिकते हैं। इसके बजाय मैं तुमसे कहता हूँ: जब तुम अपने वस्त्र उतारोगे, तब तुम धन्य होगे, क्योंकि [] [बाहरी वस्तु को उतार देना] कोई बड़ी बात नहीं है।”


    […] ने कहा, “क्या बोलनेवाला मैं हूँ और क्या ग्रहण करनेवाला भी मैं ही हूँ […]?”


    प्रभु ने कहा, “हाँ, [वह जो] तुम्हारे पिता को [तार्किक ढंग से ग्रहण करता है]।”


    [a] “आर्कोन”: साक्ष्य-पाठ में यूनानी मूल का शब्द *archons* है। इस साहित्य में यह प्रायः शासनकारी, और कभी अलौकिक समझी जानेवाली, शक्तियों या अधिकारियों के लिए प्रयुक्त होता है।'
