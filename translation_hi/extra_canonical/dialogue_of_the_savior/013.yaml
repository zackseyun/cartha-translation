    rationale: ‘Blessed is the one who has known [] …’ और ‘[with] [] tranquility’ में साक्ष्य का रिक्त कोष्ठक एक अनसुलझे अंतराल को सूचित करता है; उसे दीर्घ-विराम में बदलना संपादकीय सूचना को बदल देता है।
