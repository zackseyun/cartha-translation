  source_fidelity: 'मसौदा समग्रतः दिए गए अंग्रेज़ी साक्ष्य का निकटता से अनुसरण करता है, किंतु कई स्थानों पर संपादकीय चिह्नों का रूप बदल गया है: रिक्त कोष्ठक [] को […] कर दिया गया है, एक स्थान पर कोष्ठकीय वाक्यांश का विभाजन/क्रम बदल गया है, और ‘(is the same one who)’ के गोल कोष्ठक लुप्त हैं। अंतिम उत्तर में ‘your Father’ को ‘अपने पिता’ करना भी साक्ष्य से कम सटीक है। संशोधन में खंडित पाठ और संपादकीय पुनर्स्थापनों के चिह्न यथासंभव सुरक्षित रखे गए हैं।'
  naturalness: हिन्दी का संवादात्मक और गरिमापूर्ण स्तर अच्छा है। फिर भी ‘जिस स्थान तक तुम पहुँच सकते हो, उसमें अपना स्थान ग्रहण करो’ मूल के सीधे आदेश से कुछ भिन्न है, और ‘संसार से सम्बन्ध रखनेवाली बातों के सामने’ की अपेक्षा ‘संसार से संबंधित बातों के प्रति’ अधिक स्वाभाविक तथा निकट है। ‘तार्किक ढंग से’ ‘logical way’ के लिए ‘विवेकपूर्ण ढंग से’ से अधिक निकट है।
  terminology: ‘आर्कोन’ को लिप्यंतरित तकनीकी पद के रूप में रखना अधिक सुरक्षित है, क्योंकि ‘शासक शक्तियाँ’ मूल पद के अलौकिक अर्थ का पूर्वनिर्णय कुछ हद तक कर देता है। पादटिप्पणी उसके सामान्य साहित्यिक प्रयोग की सीमित सूचना देती है। ‘अमर’ ‘deathless’ का सीधा, गैर-सांप्रदायिक समकक्ष है।
  issues:
