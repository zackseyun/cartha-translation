translation:
  language: hi
  text: 'उसने यहूदा, मत्ती और मरियम को [अपने साथ लिया] […] ताकि [उन्हें स्वर्ग और पृथ्वी की अंतिम] सीमा दिखाए। जब उसने अपना [हाथ] उन पर रखा, तो उन्होंने आशा की कि वे उसे [देख] सकेंगे।


    यहूदा ने ऊपर की ओर देखा और एक बहुत ऊँचा स्थान देखा; फिर उसने नीचे अथाह गहराई का स्थान देखा।[a]


    यहूदा ने मत्ती से कहा, “भाई, कौन इतनी ऊँचाई पर चढ़ सकता है या नीचे अथाह गहराई में उतर सकता है, जबकि वहाँ एक विशाल अग्निकुंड और बड़ा आतंक है?”


    उसी क्षण ऊँचाई से एक वचन निकला। यहूदा वहाँ खड़ा था और उसने देखा कि वह वचन किस प्रकार नीचे उतरा।[b]


    उसने वचन से पूछा, “तुम नीचे क्यों उतरे हो?”


    मनुष्य के पुत्र ने उनका अभिवादन किया और उनसे कहा, “एक सामर्थ्य से निकले बीज में कुछ कमी थी, और वह पृथ्वी की अथाह गहराई में उतर गया। महामहिम ने [उसे] स्मरण किया और उसके पास [वचन भेजा]। वचन उस बीज को महामहिम की [उपस्थिति] के सामने ऊपर ले आया, ताकि […] पहला वचन खो न जाए।”[c]


    [उसके] चेले उसकी बताई हर बात पर चकित हुए और उन्होंने सब कुछ विश्वास के साथ ग्रहण किया, क्योंकि वे यह भी जानते थे कि अधर्म पर विचार करना व्यर्थ है।


    तब उसने अपने चेलों से कहा, “क्या मैंने तुमसे नहीं कहा था कि जो अच्छा है, उसे एक दिखाई देनेवाली आवाज़ और बिजली की चमक के समान प्रकाश में ऊपर उठा लिया जाएगा?”[d]


    उसके सभी चेलों ने उसकी स्तुति की और कहा, “प्रभु, आपके यहाँ प्रकट होने से पहले किसने आपकी स्तुति की, जबकि सारी स्तुतियाँ आपकी ही हैं? अथवा किसने [आपको] धन्य कहा, जबकि सारे आशीष आपके ही हैं?”


    जब वे वहाँ खड़े थे, उसने दो आत्माओं को अपने साथ एक ही प्राण को ले जाते देखा। तभी बिजली बड़े तेज़ से चमकी। मनुष्य के पुत्र से एक वचन निकला, जिसने कहा, “उन्हें उनके वस्त्र दे दो!”[e]


    तब छोटा बड़े के समान हो गया। वे उन लोगों के [समान] थे जिन्हें ऊपर ग्रहण किया गया था। […] [उनमें कोई भेद नहीं था]। उसने जो [वचन कहे, उनसे] चेले [आश्वस्त हो गए]।


    मरियम ने [उससे कहा, “देखिए,] मैं उस बुराई को देखती हूँ जो आरंभ से ही लोगों को [प्रभावित करती है], जब वे एक-दूसरे के साथ रहते हैं।”


    प्रभु ने [उससे] कहा, “जब तुम उन्हें देखती हो, [तो तुम] बहुत कुछ [जानती हो]। वे [वहाँ एक साथ नहीं रहेंगे]। पर जब तुम उसे देखोगी जो अनंतकाल से विद्यमान है, तब वह महान दर्शन होगा।”[f]


    उन सबने उससे कहा, “हमें इसका अर्थ समझाइए।”


    उसने उनसे कहा, “तुम उसे किस प्रकार देखना चाहते हो—[ऐसे] दर्शन में जो मिट जाता है, या ऐसे दर्शन में जो सदा बना रहता है?”


    उसने आगे कहा, “जो तुम्हारे [बाद] बना रहेगा, उसे बचाने के लिए भरसक प्रयत्न करो; उसे खोजो और उसके भीतर से बोलो, ताकि तुम जो कुछ खोजते हो वह तुम्हारे अपने साथ एकरूप हो। क्योंकि मैं तुमसे सच [कहता] हूँ: जीवित परमेश्वर तुम्हारे भीतर [है], […] [जैसे तुम भी] परमेश्वर के भीतर हो।”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अथाह गहराई” उस गहरे अधोलोक-सदृश स्थान का अनुवाद है जिसे साक्ष्य ‘abyss’ कहता है; यहाँ इसे किसी विशेष पारिभाषिक लोक-नाम से नहीं जोड़ा गया है।
    reason: स्थान की धर्मवैज्ञानिक पहचान को अनावश्यक रूप से निश्चित होने से बचाना।
  - marker: b
    text: यहाँ “वचन” किसी उच्चरित कथन, संदेश या व्यक्तिकृत वचन की ओर संकेत कर सकता है; पाठ इसे बोलते और नीचे उतरते हुए दिखाता है।
    reason: मूल अभिव्यक्ति की जीवंत किंतु अनिश्चित पहचान बनाए रखना।
  - marker: c
    text: “एक सामर्थ्य से निकले बीज में कुछ कमी थी” और “पहला वचन” दोनों कठिन एवं संभवतः पाठगत रूप से क्षतिग्रस्त अभिव्यक्तियाँ हैं; उनका सटीक आशय अनिश्चित है।
    reason: कठिन स्रोत-पाठ और पुनर्निर्माण की अनिश्चितता बताना।
  - marker: d
    text: “दिखाई देनेवाली आवाज़” मूल साक्ष्य में भी एक असामान्य, इंद्रियों को मिलानेवाली अभिव्यक्ति है; इसे सरल बनाकर केवल प्रकाश या ध्वनि नहीं किया गया।
    reason: मूल की जानबूझकर या पाठगत रूप से विचित्र छवि बचाना।
  - marker: e
    text: “आत्माओं,” “प्राण” और “उनके वस्त्र” का परस्पर संबंध इस खंड में स्पष्ट नहीं है।
    reason: खंडित दृश्य पर अतिरिक्त धर्मवैज्ञानिक संरचना आरोपित न करना।
  - marker: f
    text: “जो अनंतकाल से विद्यमान है” का आशय एक शाश्वत सत्ता है; पाठ यहाँ उसका कोई और स्पष्ट नाम नहीं देता।
    reason: उपाधि की खुली पहचान बनाए रखना।
  - marker: g
    text: अंतिम वाक्यों में पांडुलिपि के रिक्त स्थान और पुनर्स्थापन हैं। “तुम्हारे बाद” का अर्थ “तुम्हारे चले जाने के बाद” या संभवतः “तुम्हारे पीछे” भी हो सकता है।
    reason: खंडित पाठ और स्थान/काल संबंधी वास्तविक अस्पष्टता दर्ज करना।
lexical_decisions:
- source_word: abyss
  choice: अथाह गहराई
  rationale: यह सहज आधुनिक हिन्दी में नीचे की असीम गहराई व्यक्त करता है और इसे स्वतः किसी विशिष्ट धर्मवैज्ञानिक ‘पाताल’ से नहीं जोड़ता।
- source_word: word
  choice: वचन
  rationale: पाठ में यह बोलता, उतरता और भेजा जाता है; ‘वचन’ इस व्यक्तिकृत अर्थ को बनाए रखता है, पर टिप्पणी में ‘कथन/संदेश’ की संभावना खुली रखी गई है।
- source_word: power
  choice: सामर्थ्य
  rationale: ‘शक्ति’ भी संभव है, पर ‘सामर्थ्य’ किसी विशिष्ट देव-सत्ता या तकनीकी ग्नॉस्टिक श्रेणी को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Majesty
  choice: महामहिम
  rationale: मूल साक्ष्य के व्यक्तिकृत सर्वोच्च गौरव/महिमा-सूचक पद को गरिमापूर्ण और संज्ञात्मक रूप में रखा गया है।
- source_word: seed
  choice: बीज
  rationale: रूपक को व्याख्यायित किए बिना यथावत रखा गया है।
- source_word: soul
  choice: प्राण
  rationale: यहाँ ‘आत्मा’ लिखने पर साथ आए ‘दो spirits’ से भेद मिट जाता; ‘प्राण’ दोनों शब्दों का अंतर बनाए रखता है।
- source_word: Eternally Existent One
  choice: जो अनंतकाल से विद्यमान है
  rationale: स्वाभाविक हिन्दी में पद की कालातीत सत्ता व्यक्त होती है, बिना किसी अतिरिक्त पारिभाषिक नाम को आरोपित किए।
- source_word: vision
  choice: दर्शन
  rationale: यह देखने की अनुभूति और आध्यात्मिक दृष्टि, दोनों संभावनाओं को बनाए रखता है।
theological_decisions:
- issue: ‘वचन’ की पहचान
  choice: व्यक्तिकृत ‘वचन’ रखा गया, पर उसे सीधे मसीह अथवा किसी अन्य निश्चित सत्ता के रूप में नहीं पहचाना गया।
  alternative: ‘संदेश’, ‘आवाज़’, या स्पष्ट रूप से ‘मसीह’
  rationale: इस अंश में ‘वचन’ और ‘मनुष्य का पुत्र’ पास-पास आते हैं, किंतु उनका संबंध पूर्णतः स्पष्ट नहीं है; अनुवाद उस तनाव को खुला रखता है।
- issue: ‘एक सामर्थ्य से निकला बीज’
  choice: रूपक और अनिश्चित संबंध को यथासंभव शाब्दिक रखा गया।
  alternative: ‘दैवी शक्ति का अंश’ या ‘शक्ति द्वारा बोया गया बीज’
  rationale: ये विकल्प व्याकरणिक और धर्मवैज्ञानिक अर्थ को मूल साक्ष्य से अधिक निश्चित कर देते।
- issue: ‘जीवित परमेश्वर तुम्हारे भीतर’
  choice: भीतर होने के पारस्परिक कथन को ज्यों का त्यों रखा गया।
  alternative: इसे केवल नैतिक उपस्थिति, आत्मिक एकता, या तत्त्वगत अभिन्नता के रूप में समझाना
  rationale: पाठ स्वयं संबंध की प्रकृति नहीं खोलता; किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया।
