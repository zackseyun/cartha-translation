translation:
  language: hi
  text: '“जो कोई परिपूर्णता के कार्य को [नहीं] जानता, वह कुछ नहीं जानता।


    “जो अंधकार में खड़ा नहीं होता, वह [अस्पष्ट] प्रकाश को नहीं देख सकता।[a]


    “जो यह [नहीं समझता] कि आग कैसे अस्तित्व में आई, वह उसके भीतर जल जाएगा और उसके उद्गम को नहीं जानेगा।


    “यदि कोई पहले पानी को नहीं समझता, तो वह कुछ नहीं जानता; क्योंकि उस पानी में बपतिस्मा लेने से ऐसे व्यक्ति को क्या लाभ?


    “जो यह नहीं समझता कि बहती हुई हवा कैसे अस्तित्व में आई, वह भी उसके साथ उड़ा दिया जाएगा।


    “जो यह नहीं समझता कि जिस शरीर को वह पहने हुए है, वह कैसे अस्तित्व में आया, वह भी उसके साथ नष्ट हो जाएगा।


    “और जो पुत्र को नहीं जानता, वह [पिता] को कैसे जानेगा?


    “जो सब वस्तुओं की जड़ को नहीं जानता, उससे सब कुछ छिपा हुआ है।


    “जो अधर्म की जड़ को नहीं जानता, वह उससे अपरिचित नहीं रहेगा।


    “जो यह नहीं समझते कि वे कैसे आए, वे यह भी नहीं समझेंगे कि वे कैसे जाएंगे।


    “और जो [अपने आपको ऊंचा करेगा] और फलस्वरूप नीचा किया जाएगा, वह इस संसार से अपरिचित नहीं है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पंक्ति में ‘प्रकाश’ से पहले पांडुलिपि में एक रिक्त या अस्पष्ट अंश है; उसका निश्चित पाठ उपलब्ध नहीं है।
    reason: स्रोत में [] द्वारा चिह्नित पाठगत रिक्ति को हिन्दी मुख्य पाठ में अकेले रिक्त कोष्ठक रखने के बजाय स्पष्ट पाठालोचनात्मक टिप्पणी से दर्शाना आवश्यक है।
lexical_decisions:
- source_word: deed of completeness
  choice: परिपूर्णता का कार्य
  rationale: ‘कार्य’ deed की क्रियात्मकता और ‘परिपूर्णता’ completeness की अमूर्तता को बिना अतिरिक्त व्याख्या के बनाए रखते हैं।
- source_word: stands ... in the darkness
  choice: अंधकार में खड़ा होता
  rationale: रूपक को व्याख्यायित किए बिना साक्षी की ठोस स्थान-संबंधी भाषा सुरक्षित रखी गई है।
- source_word: came into existence
  choice: अस्तित्व में आई/आया
  rationale: उत्पत्ति के ढंग या कारण के विषय में मूल साक्षी की व्यापक अभिव्यक्ति को बनाए रखता है।
- source_word: the body he wears
  choice: जिस शरीर को वह पहने हुए है
  rationale: शरीर को वस्त्र की तरह पहनने वाले असामान्य रूपक को सहज बनाकर मिटाया नहीं गया।
- source_word: root
  choice: जड़
  rationale: मूल कारण और उद्गम दोनों की संभावनाओं वाला रूपक यथावत रखा गया है।
- source_word: will be no stranger to it
  choice: उससे अपरिचित नहीं रहेगा
  rationale: वाक्य के संभावित विडंबनात्मक या नैतिक तनाव को बिना ‘उसमें भागी होगा’ जैसी व्याख्या जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: ‘पुत्र’ और ‘पिता’ का संबंध
  choice: पुत्र और [पिता]
  alternative: पुत्र और परमपिता
  rationale: पाठ की संक्षिप्त उपाधियों को बनाए रखा गया और ऐसी शब्दावली नहीं जोड़ी गई जो किसी बाद की सांप्रदायिक व्याख्या को पहले से निर्धारित करे।
- issue: शरीर के नाश का कथन
  choice: वह भी उसके साथ नष्ट हो जाएगा
  alternative: उसका भी शरीर के साथ विनाश होगा
  rationale: कथन का तीखा द्विअर्थ और सर्वनाम-संबंध सुरक्षित रखा गया; आत्मा, पुनरुत्थान या अंतिम दंड के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
- issue: अंतिम वाक्य में ऊंचा और नीचा किया जाना
  choice: '[अपने आपको ऊंचा करेगा] और फलस्वरूप नीचा किया जाएगा'
  alternative: '[अभिमान करेगा] और इसलिए अपमानित होगा'
  rationale: स्थानिक रूपक और कर्मवाच्य संरचना को बनाए रखा गया; इसे केवल नैतिक ‘अभिमान’ के अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। स्रोत-साक्ष्य स्वयं सार्वजनिक-डोमेन अंग्रेजी अनुवाद है और कॉप्टिक की प्रत्यक्ष समीक्षा लंबित है; इसलिए कोष्ठकीय पुनर्स्थापनाएं सुरक्षित रखी गई हैं, पांडुलिपि का बाधक पृष्ठ-संकेत हटाया गया है, और संदिग्ध स्थानों पर अति-निश्चय से बचा गया है।
