translation:
  language: hi
  text: 'मरियम ने पूछा, “राई का दाना [किस] प्रकार का है? क्या वह स्वर्ग का है या पृथ्वी का?”[a]


    प्रभु ने कहा, “जब पिता ने अपने लिए संसार की व्यवस्था कर दी, तब जो बहुत कुछ बचा था, उसे उसने सबकी माता के पास छोड़ दिया। इसी कारण वह बोता और काम करता है।”


    यहूदा ने कहा, “आपने यह बात हमसे सच्चे मन से कही है। जब हम प्रार्थना करें, तो कैसे करें?”


    प्रभु ने कहा, “उस स्थान में प्रार्थना करो जहाँ कोई स्त्री नहीं है।”[b]


    मत्ती कहता है, “वह हमसे कहता है, ‘उस स्थान में प्रार्थना करो जहाँ कोई स्त्री नहीं है।’ इसका अर्थ है स्त्री के कार्यों को नष्ट करना। इसका कारण यह नहीं कि जन्म का कोई दूसरा प्रकार है, बल्कि यह है कि वे [जन्म देना] बंद कर दें।”


    मरियम ने कहा, “क्या वे कभी नष्ट नहीं होंगे?”


    प्रभु ने कहा, “[तुम] जानते हो कि वे [फिर] नष्ट हो जाएँगे, […], और [यहाँ विद्यमान स्त्री के कार्य भी] [नष्ट] हो जाएँगे।”[c]


    यहूदा ने [मत्ती से] कहा, “[स्त्री] के कार्य निश्चय ही नष्ट हो जाएँगे। तब शासक [अपने युगों को पुकारेंगे], और हम उनका सामना करने के लिए तैयार होंगे।”[d]


    प्रभु ने कहा, “क्या वे [तुम्हें देखेंगे, और क्या वे] उन्हें देखेंगे जो तुम्हें स्वीकार करते हैं? देखो, पिता की ओर से एक सच्चा वचन मौन में, बिजली की चमक के साथ, अथाह गहराई की ओर निकलता है, और वह उत्पन्न करनेवाला है। क्या वे उसे देखते हैं, या उस पर विजय पाते हैं? निश्चय ही तुम उस [मार्ग] को अधिक अच्छी तरह जानते हो, जिसे [न कोई स्वर्गदूत] जानता है, न कोई सत्ता। वह पिता और पुत्र का मार्ग है, क्योंकि दोनों एक हैं; और तुम उस [मार्ग] पर चलोगे जिसे तुम जान चुके हो। शासक चाहे बहुत विशाल हो जाएँ, फिर भी वे उस तक नहीं पहुँच सकेंगे। मैं तुमसे [सच] कहता हूँ, उस तक पहुँचना मेरे लिए भी कठिन है।”


    […] [मरियम] ने [प्रभु से] पूछा, “यदि कार्य [नष्ट किए जाते हैं, तो वास्तव में] किसी कार्य को कौन नष्ट करता है?”


    [प्रभु ने कहा], “तुम जानते हो कि [जब भी] मैं [उसे] नष्ट करता हूँ, [वह] अपने स्थान पर चला जाएगा।”


    यहूदा ने कहा, “आत्मा कैसे दिखाई देती है?”


    प्रभु ने कहा, “तलवार कैसे [दिखाई देती] है?”


    यहूदा ने कहा, “प्रकाश कैसे दिखाई देता है?”


    प्रभु ने कहा, “[वह] अपने ही द्वारा सदा [दिखाई देता] है।”


    यहूदा ने पूछा, “कौन किसके कार्यों को विलीन करता है? क्या कार्य संसार को [विलीन करते] हैं, या संसार कार्यों को विलीन करता है?”[e]


    प्रभु ने [उत्तर दिया], “जो [समझता है, वही कार्यों को विलीन करता है]। ऐसा इसलिए है कि जिसने कार्यों को जान लिया है, उसके लिए पिता की [इच्छा] पूरी करना आवश्यक है।”


    [a] उपलब्ध पाठ में यहाँ प्रश्न का आरंभ खंडित है; कोष्ठक में दिए शब्द संपादकीय पुनर्स्थापन हैं।

    [b] “जहाँ कोई स्त्री नहीं है” पाठ का जानबूझकर संरक्षित कठिन कथन है; अगले अनुच्छेद में मत्ती इसकी व्याख्या “स्त्री के कार्यों” और जन्म देने की समाप्ति के रूप में करता है।

    [c] इस वाक्य में पांडुलिपि अत्यंत खंडित है; अनुवाद में पुनर्स्थापित शब्द कोष्ठकों में और रिक्त स्थान […] से दिखाए गए हैं।

    [d] “शासक” उस पारलौकिक शक्तियों के लिए प्रयुक्त पद है जिन्हें प्राचीन ज्ञानवादी साहित्य में प्रायः यूनानी मूल के अनुसार ‘आर्खोन’ कहा जाता है। “युग” भी यहाँ पारलौकिक सत्ता अथवा लोक के अर्थ में हो सकता है।

    [e] “विलीन करना” का अर्थ नष्ट करना, खोल देना या समाप्त कर देना भी हो सकता है; पाठ इस संबंध को प्रश्न के रूप में खुला रखता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध पाठ में यहाँ प्रश्न का आरंभ खंडित है; कोष्ठक में दिए शब्द संपादकीय पुनर्स्थापन हैं।
    reason: पाठीय क्षति और पुनर्निर्माण को स्पष्ट करना।
  - marker: b
    text: “जहाँ कोई स्त्री नहीं है” पाठ का जानबूझकर संरक्षित कठिन कथन है; अगले अनुच्छेद में मत्ती इसकी व्याख्या “स्त्री के कार्यों” और जन्म देने की समाप्ति के रूप में करता है।
    reason: कठिन कथन को छिपाए बिना निकट संदर्भ बताना।
  - marker: c
    text: इस वाक्य में पांडुलिपि अत्यंत खंडित है; अनुवाद में पुनर्स्थापित शब्द कोष्ठकों में और रिक्त स्थान […] से दिखाए गए हैं।
    reason: अत्यधिक अनिश्चित पाठ की स्थिति बताना।
  - marker: d
    text: “शासक” उस पारलौकिक शक्तियों के लिए प्रयुक्त पद है जिन्हें प्राचीन ज्ञानवादी साहित्य में प्रायः यूनानी मूल के अनुसार ‘आर्खोन’ कहा जाता है। “युग” भी यहाँ पारलौकिक सत्ता अथवा लोक के अर्थ में हो सकता है।
    reason: दो तकनीकी ब्रह्मांड-विज्ञान संबंधी पदों की अर्थ-सीमा समझाना।
  - marker: e
    text: “विलीन करना” का अर्थ नष्ट करना, खोल देना या समाप्त कर देना भी हो सकता है; पाठ इस संबंध को प्रश्न के रूप में खुला रखता है।
    reason: क्रिया की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: Mother of the All
  choice: सबकी माता
  rationale: पारलौकिक उपाधि को सामान्य स्त्री-संज्ञा से अलग रखते हुए सहज हिंदी में रखा गया; ‘समस्त की माता’ की अपेक्षा अधिक स्वाभाविक।
- source_word: works
  choice: कार्य
  rationale: पूरे अंश में एक ही मुख्य पद बनाए रखा गया ताकि कर्म, सृष्टिगत क्रिया और उत्पन्न परिणाम के बीच स्रोत की अस्पष्टता बनी रहे।
- source_word: archons
  choice: शासक
  rationale: मूल पद का अर्थ-सुलभ हिंदी रूप मुख्य पाठ में दिया गया और तकनीकी ‘आर्खोन’ को पादटिप्पणी में समझाया गया।
- source_word: aeons
  choice: युग
  rationale: प्राचीन ज्ञानवादी पारिभाषिक अर्थ को पूरी तरह किसी एक व्याख्या में सीमित किए बिना पारंपरिक समतुल्य चुना गया।
- source_word: abyss
  choice: अथाह गहराई
  rationale: ‘अगाध’ या लिप्यंतरित तकनीकी शब्द की अपेक्षा आधुनिक पाठक के लिए स्पष्ट, पर पारलौकिक संकेत सुरक्षित।
- source_word: generative
  choice: उत्पन्न करनेवाला
  rationale: जननशीलता और सृजन-क्षमता दोनों की संभावना को बनाए रखता है।
- source_word: dissolves
  choice: विलीन करता है
  rationale: नष्ट करने और खोल देने के बीच स्रोत की संभावित अर्थ-व्याप्ति को बचाने के लिए अपेक्षाकृत व्यापक क्रिया।
theological_decisions:
- issue: ‘Pray in the place where there is no woman’ का अर्थ
  choice: कठिन कथन को शाब्दिक रूप में रखा और मत्ती की आंतरिक व्याख्या को स्वयं बोलने दिया।
  alternative: इसे सीधे ‘कामना से रहित होकर प्रार्थना करो’ जैसे आध्यात्मिक अर्थ में बदलना।
  rationale: ऐसा अर्थांतरण पाठ की लैंगिक और जन्म-संबंधी वास्तविक तनाव को मिटा देता तथा किसी बाद की व्याख्या को मूल कथन में आयात करता।
- issue: Father and Son ‘the two are one’
  choice: ‘दोनों एक हैं’
  alternative: ‘दोनों एक सत्ता/स्वभाव हैं’
  rationale: पाठ संबंध या तत्वमीमांसीय स्वरूप स्पष्ट नहीं करता; इसलिए संप्रदायगत सिद्धांतात्मक विस्तार नहीं जोड़ा गया।
- issue: ‘difficult even for me to attain to it’
  choice: ‘उस तक पहुँचना मेरे लिए भी कठिन है’
  alternative: कथन को नरम कर प्रभु के लिए केवल दूसरों का नेतृत्व कठिन बताना।
  rationale: स्रोत का चौंकानेवाला धर्मवैचारिक तनाव जस का तस रखा गया।
- issue: works of the female
  choice: ‘स्त्री के कार्य’
  alternative: ‘स्त्रीत्व के कर्म’, ‘देह की वासनाएँ’ या ‘प्रजनन के कार्य’
