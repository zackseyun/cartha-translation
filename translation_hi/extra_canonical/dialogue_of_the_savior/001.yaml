translation:
  language: hi
  text: 'उद्धारकर्ता का संवाद — भूमिका


    उद्धारकर्ता ने अपने शिष्यों से कहा, “भाइयो, अब हमारे लिए अपना काम रोककर विश्राम में स्थिर हो जाने का समय आ पहुँचा है, क्योंकि जो विश्राम में स्थिर होता है, वह सदा के लिए विश्राम पाएगा। मैं तुमसे कहता हूँ, सदा [. . .] कालबद्धता से परे उठो [. . .]। [मैं] तुमसे [कहता हूँ], [. . .] [उनसे मत डरो जो . . .] तुम्हें। मैं [तुमसे कहता हूँ], क्रोध भयावह है, [और जो कोई] क्रोध भड़काता है, वह [भयावह व्यक्ति है]। फिर भी, क्योंकि तुम [दुःख सह सके हो], यह तुम्हारे [भीतर से . . .] निकल सकता है।


    “लोगों ने क्रोध के विषय में इन वचनों को डरते और काँपते हुए स्वीकार किया है। क्रोध ने उनके ऊपर अधिपतियों[a] को नियुक्त किया, क्योंकि कोई भी क्रोध से बच नहीं सकता। लेकिन जब मैं आया, तो मैंने एक मार्ग खोला और लोगों को पार जाने के रास्ते के विषय में शिक्षा दी—चुने हुए और एकाकी लोगों[b] के लिए, [] उनके लिए जिन्होंने पिता को जाना है और जो सत्य के प्रति विश्वासयोग्य रहे हैं—और तुमने स्तुति अर्पित की।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अधिपति” उस प्राचीन पद का अनुवाद है जिसे प्रायः “आर्खोन” कहा जाता है; इसका अर्थ शासक या शासन करने वाली सत्ता हो सकता है।
    reason: तकनीकी या ब्रह्मांडीय अर्थ की सम्भावना बताए बिना उसे मुख्य पाठ में निश्चित नहीं किया गया।
  - marker: b
    text: “एकाकी” का आशय यहाँ अनिश्चित है; यह अकेले रहने वाले, अविभाजित मन वाले, या किसी विशिष्ट आध्यात्मिक समूह के लोगों की ओर संकेत कर सकता है।
    reason: स्रोत पद की वास्तविक अर्थ-सीमा और theological ambiguity को सुरक्षित रखना।
lexical_decisions:
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: यह पदवी आधुनिक हिन्दी में स्वाभाविक और धार्मिक रूप से व्यापक है; यह किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ती।
- source_word: stand at rest
  choice: विश्राम में स्थिर हो जाना
  rationale: ‘खड़े रहना’ और ‘विश्राम’ दोनों की स्रोत-छवि को यथासंभव बनाए रखते हुए हिन्दी में अर्थपूर्ण अभिव्यक्ति दी गई है।
- source_word: temporality
  choice: कालबद्धता
  rationale: समय के अधीन या समय से बँधी अवस्था का दार्शनिक भाव सुरक्षित रहता है; क्षतिग्रस्त संदर्भ के कारण इसे अधिक स्पष्ट करके नहीं खोला गया।
- source_word: anger
  choice: क्रोध
  rationale: पूरे अनुच्छेद में एक ही प्रमुख शब्द बनाए रखने से क्रोध के व्यक्तिकृत और सामान्य दोनों प्रयोगों का तनाव सुरक्षित रहता है।
- source_word: archons
  choice: अधिपति
  rationale: शासन करने वाली सत्ताओं का मूल अर्थ देता है, जबकि पादटिप्पणी प्राचीन तकनीकी पद की सम्भावना स्पष्ट करती है।
- source_word: elect and solitary
  choice: चुने हुए और एकाकी लोग
  rationale: दोनों अलग विशेषणों को बनाए रखा गया है; ‘एकाकी’ को तपस्वी, अविवाहित या किसी संप्रदाय-विशेष के सदस्य के रूप में सीमित नहीं किया गया।
- source_word: crossing over
  choice: पार जाना
  rationale: स्रोत की रूपकात्मक अस्पष्टता सुरक्षित है; यह नहीं बताया गया कि पार जाना मृत्यु, जगत या किसी आध्यात्मिक सीमा से संबंधित है।
theological_decisions:
- issue: क्रोध का व्यक्तिकरण
  choice: ‘क्रोध ने ... अधिपतियों को नियुक्त किया’ को प्रत्यक्ष रूप में रखा गया
  alternative: इसे ‘क्रोध के कारण शासक उन पर अधिकार करने लगे’ जैसे व्याख्यात्मक वाक्य में बदलना
  rationale: मूल साक्ष्य में क्रोध कर्ता के रूप में आता है; उसकी ब्रह्मांडीय, मनोवैज्ञानिक या अलंकारिक प्रकृति का निर्णय अनुवाद में नहीं किया गया।
- issue: ‘चुने हुए और एकाकी’ की पहचान
  choice: दोनों पदों को सामान्य और खुला रखा गया
  alternative: इन्हें किसी विशिष्ट मठवासी, ज्ञानवादी या कलीसियाई वर्ग के नाम के रूप में प्रस्तुत करना
  rationale: उपलब्ध साक्ष्य ऐसी संप्रदायगत पहचान को निश्चित नहीं करता।
- issue: ‘यह तुम्हारे भीतर से निकल सकता है’ में सर्वनाम का संकेत
  choice: ‘यह’ को अस्पष्ट रखा गया
  alternative: ‘क्रोध’, ‘दुःख’ या किसी आध्यात्मिक तत्व को स्पष्ट कर्ता बनाना
  rationale: पांडुलिपि-क्षति और वाक्य-संबंध के कारण संदर्भ अनिश्चित है; अनुवाद को इसे चुपचाप तय नहीं करना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। वर्ग कोष्ठक, रिक्त कोष्ठक और बिंदु पांडुलिपि की क्षति अथवा संपादकीय पुनर्स्थापन के संकेत के रूप में यथासंभव सुरक्षित रखे गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है।
