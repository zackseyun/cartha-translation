translation:
  language: hi
  text: '“मैं तुम्हें बताऊँगा कि विनाश का समय कब आएगा।[a] अंधकार की पहली शक्ति तुम्हें आ घेरेगी; डरो मत,[b] और न यह कहो, ‘देखो, समय आ गया है।’[c] पर जब तुम एक अकेला दण्ड देखो [. . .]।[d] जान लो कि [. . .] कार्य से [. . .] और शासक शक्तियाँ [. . .] तुम्हें आ घेरेंगी [. . .]। भय ही [अंधकार] की वास्तविक शक्ति है। इसलिए जो शीघ्र ही तुम्हें आ घेरने वाला है, यदि तुम उससे डरोगे, तो वह तुम पर अधिकार कर लेगा; और उनमें से एक भी तुम्हें न छोड़ेगा, न तुम पर दया करेगा। इसके बजाय अपने भीतर [जो है] उस पर ध्यान दो,[e] क्योंकि तुम हर सांसारिक वस्तु पर अधिकार पा चुके हो। यह [तुम्हें] ऊपर ऐसे [स्थान] तक पहुँचा [देगा], जहाँ [न कोई] शासन है [न कोई] अत्याचारी। जब तुम [. . .], तब तुम उन [. . .] को देखोगे, और तुम भी [उन्हें सुनोगे। मैं] तुमसे कहता हूँ, तर्कबुद्धि [. . .]। तर्कबुद्धि वह [. . . जहाँ] सत्य [है]। पर वे [. . .] और तुम [. . .] सत्य। यह [जीवित मन के भीतर . . . है]। इसलिए [. . .] और तुम्हारा आनन्द [. . .], ताकि [. . .] तुम्हारी आत्माएँ [. . .], ताकि वचन [. . .] न करे, जिसे उन्होंने ऊपर उठाया [. . .] और
    वे उसे [समझ] न सके [. . .]। जो तुम्हारे [भीतर] है और जो तुम्हारे [बाहर] है, दोनों को एक ही बना दो।[f]


    “वह [] पारगमन-स्थल निश्चय ही तुम्हारी [दृष्टि] में भयावह है, फिर भी उसमें से होकर जाने में संकोच मत करो। उसकी गहराई बहुत अधिक है, उसकी [ऊँचाई] विशाल है! [एकचित्त रहो . . .], और आग [. . .] ओस की बूँदें [. . .] सारी शक्तियाँ [. . .] तुम्हें। वे [. . .], और [सारी] शक्तियाँ [. . .] वे [. . .] पहले। मैं [तुमसे] कहता हूँ, [. . .] आत्मा [. . .] बन जाएगी [. . .] उन सबमें [. . .] तुम हो [. . .] और वह [. . .] मत सोओ [. . .] पुत्र [. . .] और तुम [. . .] तुम [. . .]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: पाठाधार की सीमा स्पष्ट करना।
  - marker: b
    text: खंडित पांडुलिपि के कारण वक्ता जिन परिस्थितियों या शक्तियों का उल्लेख करता है, उनका पूरा क्रम सुरक्षित नहीं है।
    reason: आदेश के अपूर्ण संदर्भ को बताना।
  - marker: c
    text: “समय” से ठीक कौन-सा समय अभिप्रेत है, यह इस खंड में निश्चित नहीं किया गया है।
    reason: अनावश्यक प्रलय-संबंधी विशिष्टीकरण से बचना।
  - marker: d
    text: “एक अकेला दण्ड” का आशय अस्पष्ट है; आगे का पाठ नष्ट है।
    reason: दुर्बोध प्रतीक और पाठ-हानि दर्ज करना।
  - marker: e
    text: कोष्ठकों और वर्ग कोष्ठकों में दी गई सामग्री साक्ष्य में पुनर्स्थापित या संदिग्ध शब्दों को दिखाती है; “[. . .]” पांडुलिपि की रिक्ति या नष्ट पाठ को दर्शाता है।
    reason: पाठ-संकेतों की व्याख्या करना।
  - marker: f
    text: “भीतर” और “बाहर” को एक करने का कथन व्याख्या के लिए खुला है; पाठ स्वयं इसका आशय स्पष्ट नहीं करता।
    reason: वास्तविक धार्मिक-दर्शनात्मक अस्पष्टता बनाए रखना।
lexical_decisions:
- source_word: destruction
  choice: विनाश
  rationale: साक्ष्य के व्यापक, प्रलय-संबंधी अर्थ को बिना यह तय किए बनाए रखता है कि आशय जगत, शरीर या किसी सत्ता के विनाश से है।
- source_word: power of darkness
  choice: अंधकार की शक्ति
  rationale: ‘शक्ति’ सत्ता और सामर्थ्य दोनों की संभावित छाया बनाए रखती है।
- source_word: solitary staff
  choice: एक अकेला दण्ड
  rationale: ‘दण्ड’ staff की वस्तुगत और प्रतीकात्मक दोनों संभावनाएँ रखता है; खंडित प्रसंग के कारण अर्थ स्पष्ट नहीं किया गया।
- source_word: archons
  choice: शासक शक्तियाँ
  rationale: अपरिचित लिप्यंतरण के बजाय सामान्य पाठक के लिए अर्थसूचक पद चुना गया, पर इसे केवल मानवीय शासक नहीं बनाया गया।
- source_word: logic
  choice: तर्कबुद्धि
  rationale: अंग्रेज़ी साक्ष्य के ‘logic’ को केवल औपचारिक तर्कशास्त्र तक सीमित किए बिना विचार-विवेक की क्षमता के रूप में व्यक्त करता है; कॉप्टिक जाँच लंबित है।
- source_word: living mind
  choice: जीवित मन
  rationale: साक्ष्य की असामान्य अभिव्यक्ति और उसकी संभावित धार्मिक-दर्शनात्मक गूँज को सामान्यीकृत नहीं किया गया।
- source_word: crossing place
  choice: पारगमन-स्थल
  rationale: स्थान और उससे होकर गुजरने की क्रिया, दोनों को व्यक्त करता है, बिना इसे किसी विशिष्ट परलोक-भूगोल से जोड़ने के।
- source_word: single mind
  choice: एकचित्त
  rationale: एकाग्रता और आंतरिक अविभाजन दोनों की संभावना रखने वाला स्वाभाविक हिन्दी पद।
theological_decisions:
- issue: अंधकार की शक्ति और भय का संबंध
  choice: “भय ही [अंधकार] की वास्तविक शक्ति है” को प्रत्यक्ष रूप में रखा गया
  alternative: भय को केवल अंधकार का एक साधन या मनोवैज्ञानिक प्रतिक्रिया बताना
  rationale: पाठ की धार्मिक और मनोवैज्ञानिक तनावपूर्ण पहचान को बिना व्याख्यात्मक नरमी के सुरक्षित रखा गया।
- issue: भीतर और बाहर को एक करना
  choice: कथन को आदेशात्मक और अस्पष्ट रहने दिया गया
  alternative: इसे नैतिक अखंडता, रहस्यवादी एकता या शरीर-आत्मा के मेल के रूप में स्पष्ट करना
  rationale: खंडित प्रसंग किसी एक सिद्धान्तगत अर्थ को निर्णायक नहीं बनाता।
- issue: शासनहीन और अत्याचारी-विहीन स्थान
  choice: “जहाँ न कोई शासन है न कोई अत्याचारी”
  alternative: इसे सीधे स्वर्ग, परमेश्वर का राज्य या किसी गूढ़ लोक का नाम देना
  rationale: साक्ष्य स्थान का स्वरूप अस्पष्ट रखता है; किसी सम्प्रदायगत ब्रह्माण्ड-विज्ञान को आरोपित नहीं किया गया।
- issue: आत्मा का सभी में बनना
  choice: खंडित वाक्य को खंडित ही रखा गया
  alternative: आत्मा के विलय, रूपान्तरण या उद्धार का पूर्ण सिद्धान्त गढ़ना
  rationale: पांडुलिपि की रिक्तियाँ ऐसी किसी पूर्ण व्याख्या का आधार नहीं देतीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और साधारण पाठक के लिए सुबोध शैली रखी गई है। पांडुलिपि-हानि के सभी संकेत सुरक्षित हैं; जहाँ अंग्रेज़ी साक्ष्य में रिक्त वर्ग-कोष्ठक [] है, उसे भी जस का तस रखा गया है। भाषा को जानबूझकर किसी विशिष्ट सम्प्रदाय, गूढ़वादी प्रणाली या नामित व्याख्याकार की शब्दावली में नहीं ढाला गया।
