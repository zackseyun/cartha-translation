translation:
  language: hi
  text: '1. इसलिए मैं, जो समस्त जगत् की पूर्ण पूर्वयोजना हूँ, अपने ही बीज का रूप धारण करके प्रकट हुई, क्योंकि सबसे पहले मेरा ही अस्तित्व था। मैं हर मार्ग पर चली, क्योंकि मैं प्रकाश की संपदा हूँ।


    2. मैं परिपूर्णता[a] की स्मृति हूँ। फिर भी मैं अंधकार के लोक में उतरी और तब तक आगे बढ़ती रही, जब तक कारागार के बीच में नहीं पहुँच गई। अव्यवस्था[b] की नींवें काँप उठीं। उनकी दुष्टता के कारण मैं उनसे छिप गई, और वे मुझे पहचान न सके।


    3. मैं दूसरी बार फिर लौटी और चारों ओर गई।


    4. मैं प्रकाश के प्राणियों के बीच से निकली—वही प्रकाश जो मैं हूँ—क्योंकि मैं पूर्वयोजना की स्मृति हूँ।


    5. अपने कार्य को पूरा करने के लिए मैं अंधकार के बीच और अधोलोक[c] के भीतर उतरी। अव्यवस्था की नींवें काँप उठीं और अव्यवस्था में रहनेवालों पर गिरकर उन्हें नष्ट करने लगीं। तब मैं फिर शीघ्रता से ऊपर, अपने प्रकाश-मूल की ओर चली गई, ताकि वे समय से पहले नष्ट न हो जाएँ।


    6. तीसरी बार भी मैं निकली—मैं, जो प्रकाश के भीतर का प्रकाश हूँ; मैं, जो पूर्वयोजना की स्मृति हूँ—ताकि अंधकार के बीच और अधोलोक के भीतर प्रवेश करूँ। मैंने उनके युग[d] की पूर्णता के प्रकाश से अपना मुख भर लिया। फिर मैं उनके कारागार के बीच, अर्थात् शरीर के कारागार में, प्रवेश कर गई और कहा, “जिसके कान सुनते हैं, वह गहरी नींद से जाग उठे!” तब वह रोया और उसके आँसू बहने लगे।


    7. उसने अपने कड़वे आँसू पोंछे और कहा, “कौन मेरा नाम पुकार रहा है? और जब मैं कारागार की बेड़ियों में जकड़ा हूँ, तब यह आशा मेरे पास कहाँ से आई?”


    8. मैंने कहा, “मैं शुद्ध प्रकाश की पूर्वयोजना हूँ।


    9. मैं उस कुँवारे आत्मा[e] का विचार हूँ, जो तुम्हें उठाकर प्रशंसा के योग्य स्थान पर ले जाता है।


    10. उठो और स्मरण करो कि तुम वही हो जिसने ध्यान दिया था। अपने मूल के पीछे चलो—वह मूल मैं ही हूँ, दयामयी। अभाव के स्वर्गदूतों, अव्यवस्था के दुष्टात्माओं और तुम्हें फँसानेवाले सब प्राणियों से अपनी रक्षा करो। गहरी नींद और अधोलोक के भीतरी कारावास से सावधान रहो।”


    11. तब मैंने उसे उठाया और पाँच मुहरों वाले जल के प्रकाश से उस पर मुहर लगाई,[f] ताकि अब से मृत्यु उस पर अधिकार न कर सके। और देखो, अब मैं पूर्ण युग में ऊपर चढ़ूँगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परिपूर्णता’ यहाँ समस्त दिव्य पूर्णता या उसके लोक के लिए प्रयुक्त एक तकनीकी पद हो सकता है।
    reason: Fullness के सामान्य और तकनीकी ब्रह्मांड-विज्ञान संबंधी अर्थों को अलग किए बिना पाठक को संकेत देना।
  - marker: b
    text: ‘अव्यवस्था’ केवल अस्त-व्यस्त दशा नहीं, बल्कि यहाँ अंधकार से जुड़ा एक ब्रह्मांडीय क्षेत्र भी हो सकती है।
    reason: Chaos के व्यक्त/स्थानीय तकनीकी अर्थ को सुरक्षित रखना।
  - marker: c
    text: ‘अधोलोक’ मृतकों या निम्न शक्तियों के क्षेत्र का संकेत है; इसे अनिवार्य रूप से अंतिम दंड के ‘नरक’ के समान न समझें।
    reason: Hades पर बाद की नरक-कल्पना आरोपित करने से बचना।
  - marker: d
    text: ‘युग’ के पीछे का पद कालखंड, अलौकिक सत्ता या उससे संबद्ध लोक-व्यवस्था का अर्थ दे सकता है।
    reason: aeon की वास्तविक अर्थगत बहुलता को बनाए रखना।
  - marker: e
    text: ‘कुँवारा आत्मा’ स्रोत की विशिष्ट उपाधि है; इसे यहाँ किसी अन्य परिचित धार्मिक उपाधि से समान नहीं माना गया है।
    reason: virginal Spirit को ‘पवित्र आत्मा’ बनाकर सिद्धांतगत पहचान आरोपित करने से बचना।
  - marker: f
    text: ‘पाँच मुहरें’ संभवतः किसी रहस्यात्मक शुद्धिकरण या दीक्षा-विधान की ओर संकेत करती हैं, पर उसका ठीक स्वरूप इस अंश में स्पष्ट नहीं है।
    reason: अनुष्ठानिक संकेत समझाना, बिना किसी विशिष्ट संस्कार की पहचान थोपे।
lexical_decisions:
- source_word: Providence
  choice: पूर्वयोजना
  rationale: यहाँ वक्ता के रूप में व्यक्त दिव्य, पूर्ववर्ती योजना/देखरेख का भाव है। केवल ‘प्रबंध’ अपेक्षाकृत प्रशासनिक और ‘विधान’ अधिक नियतिवादी सुनाई देता; ‘पूर्वयोजना’ स्त्रीलिंग वक्ता के साथ भी स्वाभाविक है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: तकनीकी ब्रह्मांड-विज्ञान संबंधी अर्थ को बनाए रखते हुए साधारण हिन्दी में बोधगम्य शब्द चुना गया; पहली उपस्थिति पर टिप्पणी दी गई है।
- source_word: Chaos
  choice: अव्यवस्था
  rationale: इसे केवल आधुनिक अर्थ ‘अराजकता’ तक सीमित न करके आदिम/ब्रह्मांडीय क्षेत्र का संकेत रखा गया; टिप्पणी से तकनीकी प्रयोग स्पष्ट किया गया है।
- source_word: Hades
  choice: अधोलोक
  rationale: ‘नरक’ कहने से दंड-स्थान का बाद का धार्मिक अर्थ अनावश्यक रूप से जुड़ सकता था; ‘अधोलोक’ मृतकों के निम्न क्षेत्र की व्यापकता बनाए रखता है।
- source_word: aeon
  choice: युग
  rationale: स्रोत में यह काल और अलौकिक लोक/व्यवस्था दोनों का तकनीकी संकेत हो सकता है; मुख्य पाठ में पठनीय ‘युग’ और टिप्पणी में अस्पष्टता सुरक्षित रखी गई है।
- source_word: virginal Spirit
  choice: कुँवारा आत्मा
  rationale: स्रोत की असामान्य उपाधि को सामान्य ‘पवित्र आत्मा’ में नहीं बदला गया, जिससे किसी परिचित सिद्धांत को आरोपित न किया जाए।
- source_word: light-root
  choice: प्रकाश-मूल
  rationale: स्रोत के रूपक और तकनीकी संबंध को संक्षिप्त समास में सुरक्षित रखा गया।
- source_word: five seals
  choice: पाँच मुहरें
  rationale: अनुष्ठानिक/रहस्यात्मक पद को व्याख्यायित किए बिना शाब्दिक रूप में रखा गया।
theological_decisions:
- issue: Providence का व्यक्तित्व और व्याकरणिक लिंग
  choice: 'स्त्रीलिंग प्रथम-पुरुष वक्ता: ‘पूर्वयोजना ... प्रकट हुई/चली/उतरी’'
  alternative: लिंग-निरपेक्ष या पुल्लिंग ‘ईश्वरीय प्रबंध’
  rationale: पाठ में Providence स्वयं बोलती हुई एक व्यक्त सत्ता है; हिन्दी में चुना गया संज्ञा-रूप स्त्रीलिंग है। इससे वक्ता को किसी नामित पारंपरिक पात्र के साथ समान नहीं ठहराया गया।
- issue: वक्ता का अपने बीज में रूपांतरण
  choice: ‘अपने ही बीज का रूप धारण करके प्रकट हुई’
  alternative: ‘अपने बीज में बदल गई’
  rationale: मूल साक्ष्य में कठिन रूपांतरण-भाषा है। हिन्दी वाक्य को पठनीय बनाया गया, पर बीज, आत्म-संबंध और प्रकट होने की धारणा को बनाए रखा गया; इसे जन्म या अवतार के किसी निश्चित सिद्धांत में नहीं बदला गया।
- issue: अव्यवस्था की नींवों का गिरना और विनाश
  choice: नींवें ही निवासियों पर गिरकर उन्हें नष्ट करने लगीं
  alternative: निवासी नींवों को गिराने और दूसरों को नष्ट करने लगे
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में कृदंतों का कर्ता अस्पष्ट है। निकटतम व्याकरणिक संबंध ‘नींवें’ से बनता है, पर टिप्पणी में स्रोत-भाषा समीक्षा लंबित होने की सीमा स्वीकार की गई है।
- issue: ‘जिसके कान सुनते हैं’ का आह्वान
  choice: सामान्य सुननेवाले व्यक्ति के लिए खुला आह्वान
  alternative: किसी विशिष्ट दीक्षित या नामित आदम के लिए आह्वान
  rationale: पाठ किसी व्यक्ति का नाम नहीं देता; इसलिए पहचान को निश्चित नहीं किया गया।
- issue: पाँच मुहरों वाले जल का प्रकाश
  choice: एक संयुक्त, रहस्यात्मक मुहर-विधान के रूप में प्रस्तुत
  alternative: स्पष्ट बपतिस्मा या किसी विशेष संस्कार के रूप में पहचान
  rationale: पाठ ‘जल’, ‘प्रकाश’ और ‘पाँच मुहरों’ को जोड़ता है, पर किसी बाद की सांप्रदायिक संस्कार-व्यवस्था से स्पष्ट समानता स्थापित नहीं करता।
- issue: मृत्यु का व्यक्तिकरण
  choice: ‘मृत्यु’ को अधिकार करनेवाली शक्ति के रूप में रखा
  alternative: सिर्फ शारीरिक मृत्यु से बचना
  rationale: बड़े अक्षर वाले अंग्रेज़ी साक्ष्य और प्रसंग में मृत्यु एक शक्ति भी हो सकती है; हिन्दी में अर्थ को केवल जैविक मृत्यु तक सीमित नहीं किया गया।
