  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: hi
  text: '**यूहन्ना का गुप्त ग्रंथ — माता का पश्चाताप**


    1. फिर मैंने कहा, “प्रभु, ‘वह आगे-पीछे घूमती रही’ का क्या अर्थ है?” वह मुसकराया और बोला, “यह मत समझो कि इसका संबंध मूसा के कहे हुए शब्दों, ‘{जल के:2} ऊपर,’ से है। नहीं!


    2. इसके बजाय, जब उसने उस बुराई को देखा जो घटित हुई थी और उस चोरी को जो उसके पुत्र ने की थी, तो उसने पश्चाताप किया। अज्ञान के अंधकार में विस्मृति ने उसे घेर लिया, और वह लज्जित होने लगी। [उसने लौटने का साहस नहीं किया], बल्कि [वह इधर-उधर घूमती] रही।[a]


    3. यही गति ‘आगे-पीछे जाना’ है। उस अभिमानी ने अपनी माता से सामर्थ्य प्राप्त की, क्योंकि वह अज्ञानी था और मानता था कि उसकी माता के सिवा कोई अस्तित्व में नहीं है।


    4. पर जब उसने अपने बनाए हुए स्वर्गदूतों की सेना को देखा, तो उसने अपने आपको उनसे ऊँचा उठाया।


    5. फिर जब माता ने जाना कि अंधकार का वस्त्र दोषपूर्ण था, तब वह समझ गई कि उसका सहचर उससे सहमत नहीं हुआ था।


    6. उसने बहुत रोते हुए पश्चाताप किया, और समूची परिपूर्णता ने उसकी पश्चाताप की प्रार्थना सुनी। उन्होंने उसकी ओर से अदृश्य, कुमारी आत्मा की स्तुति की।[b]


    7. और [वह] सहमत हुआ। पर जब [अदृश्य आत्मा] सहमत हुआ, तो उनकी समूची परिपूर्णता में से पवित्र आत्मा उस पर उंडेला गया। क्योंकि उसका सहचर अकेले उसके पास नहीं आया, बल्कि परिपूर्णता के माध्यम से उसके पास आया, ताकि वह उसकी कमी को ठीक कर सके। तब उसे ऊपर उठा लिया गया—फिर भी उसके अपने युग में नहीं, बल्कि उसके पुत्र के ऊपर—ताकि वह नौवें लोक में तब तक रहे, जब तक उसकी कमी ठीक न हो जाए।[c]


    8. ऊँचे स्वर्गीय युग से एक वाणी भी निकली, “मनुष्य विद्यमान है, और मनुष्य का पुत्र भी।” प्रधान शासक यल्दाबाओथ ने उसे सुन लिया और समझा कि वह वाणी उसकी माता से आई थी, पर वह नहीं जानता था कि वह कहाँ से आई थी।


    9. उसने उन्हें भी प्रकट किया—अर्थात पवित्र और परिपूर्ण माता-पिता को, परिपूर्ण पूर्वदृष्टि को, अदृश्य जन के प्रतिरूप को, जो सबका पिता है और जिसके द्वारा सब कुछ अस्तित्व में आया, उस आदि-मनुष्य को—क्योंकि उसने पुरुष-रूप में अपना प्रतिरूप प्रकट किया।[d]


    10. तब प्रधान शासक का पूरा युग काँप उठा और अथाह गहराई की नींवें हिल गईं। पदार्थ के ऊपर के जल का तल उस प्रकट हुए प्रतिरूप के दर्शन से प्रकाशित हो गया। जब सभी सत्ताओं और प्रधान शासक ने देखा, तो उन्होंने अपने नीचे का पूरा क्षेत्र प्रकाशित पाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों के भीतर के शब्द क्षतिग्रस्त या अपूर्ण पाठ की विद्वत पुनर्स्थापनाएँ हैं।
    reason: पांडुलिपीय अनिश्चितता दिखाने के लिए।
  - marker: b
    text: ‘परिपूर्णता’ उस समूचे दिव्य क्षेत्र या उसकी सभी दिव्य सत्ताओं के लिए प्रयुक्त तकनीकी शब्द है।
    reason: ज्ञानवादी पारिभाषिक अर्थ स्पष्ट करने के लिए।
  - marker: c
    text: ‘युग’ (एओन) का अर्थ कालखंड, दिव्य सत्ता या दिव्य लोक हो सकता है। यहाँ ‘नौवाँ लोक’ स्थानसूचक संदर्भ के कारण है। पद के आरंभ में कर्ता पांडुलिपीय रूप से अनिश्चित है।
    reason: मूल पद की वास्तविक शब्दार्थगत और पाठगत अस्पष्टता सुरक्षित रखने के लिए।
  - marker: d
    text: इस पद का वाक्यविन्यास कठिन है। ‘माता-पिता’ एक संयुक्त दिव्य उपाधि भी हो सकती है; और यह भी अनिश्चित है कि सूची में आए नाम अलग-अलग सत्ताएँ हैं या एक ही सत्ता की उपाधियाँ।
    reason: वाक्यविन्यास और धर्मवैचारिक पहचान की अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: Fullness
  choice: परिपूर्णता
  rationale: ज्ञानवादी संदर्भ में समस्त दिव्य पूर्णता का तकनीकी भाव बनाए रखता है; केवल ‘पूर्णता’ की अपेक्षा ‘परिपूर्णता’ अधिक स्वाभाविक और विशिष्ट है।
- source_word: aeon
  choice: युग
  rationale: मूल की कालिक और दिव्य-लोक संबंधी बहुअर्थता को पूरी तरह किसी एक व्याख्या में सीमित नहीं करता; पद 7 में स्थानसूचक संदर्भ के कारण ‘नौवाँ लोक’ रखा गया है।
- source_word: archon / authorities
  choice: शासक / सत्ताएँ
  rationale: पदानुक्रम और अधिकार का भाव स्पष्ट करता है, जबकि किसी बाद की सांप्रदायिक पारिभाषिकता को आरोपित नहीं करता।
- source_word: Mother-Father
  choice: माता-पिता
  rationale: संयुक्त उभयलिंगी उपाधि को सहज हिन्दी में सुरक्षित रखता है; यह साधारण बहुवचन भी समझा जा सकता है, इसलिए टिप्पणी द्वारा अस्पष्टता बताई गई है।
- source_word: Providence
  choice: पूर्वदृष्टि
  rationale: केवल सामान्य ‘प्रबंध’ नहीं, बल्कि पूर्वज्ञान/दिव्य चिंतन का व्यक्ति-सदृश तकनीकी आशय व्यक्त करता है।
- source_word: Primal Man
  choice: आदि-मनुष्य
  rationale: आद्य स्वर्गीय मानव-प्रतिरूप का भाव रखता है और इसे सीधे ऐतिहासिक आदम के रूप में निश्चित नहीं करता।
- source_word: deficiency
  choice: कमी
  rationale: स्रोत की अपूर्णता या अभाव की धारणा को सरल, तटस्थ हिन्दी में रखता है।
- source_word: oblivion
  choice: विस्मृति
  rationale: सामान्य भूलने से अधिक गहन, लगभग सत्ता-सदृश विस्मरण का भाव देता है।
theological_decisions:
- issue: पद 7 में सहमति देने वाले का संदिग्ध कर्ता
  choice: '[वह] और [अदृश्य आत्मा] के पुनर्स्थापन संकेत सुरक्षित रखे गए'
  alternative: दोनों स्थानों पर निश्चित रूप से ‘अदृश्य आत्मा’ लिखना
  rationale: पांडुलिपीय पुनर्स्थापन और सर्वनाम की अनिश्चितता को चुपचाप हल करना उचित नहीं होगा।
- issue: पद 7 में सहचर का आगमन
  choice: ‘अकेले उसके पास नहीं आया, बल्कि परिपूर्णता के माध्यम से’
  alternative: ‘उसका सहचर उसके पास नहीं आया; परिपूर्णता आई’
  rationale: साक्ष्य सहचर के आने का निषेध नहीं, बल्कि उसके अकेले आने का निषेध करता है।
- issue: पद 8 का ‘The Man ... Son of Man’
  choice: ‘मनुष्य विद्यमान है, और मनुष्य का पुत्र भी’
  alternative: ‘आदम है और मानव-पुत्र है’
  rationale: विशिष्ट स्वर्गीय उपाधियों का तनाव सुरक्षित रहता है और उन्हें अनावश्यक रूप से बाइबिल के किसी एक पात्र या मसीही पदवी से समान नहीं किया गया।
- issue: पद 9 में वाक्य का कर्ता और कर्म
  choice: संभावित वस्तुओं की सूची के रूप में अनुवाद
  alternative: ‘माता-पिता ने उन्हें शिक्षा दी’
  rationale: अंग्रेज़ी साक्ष्य का वाक्यविन्यास अस्पष्ट है; अनुवाद ने ‘उसने उन्हें प्रकट किया’ रखा है, पर टिप्पणी में अनिश्चितता स्पष्ट की है।
- issue: आत्मा के लिए व्याकरणिक लिंग
  choice: ‘अदृश्य... आत्मा’ के साथ पुल्लिंग क्रिया
  alternative: स्त्रीलिंग क्रिया
  rationale: आधुनिक मानक हिन्दी में ‘आत्मा’ सामान्यतः पुल्लिंग माना जाता है; ‘कुमारी’ स्रोत की virginal विशेषता को अलग से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। तकनीकी ज्ञानवादी पदों को जहाँ संभव हुआ अर्थानुवाद दिया गया और आवश्यक स्थानों पर टिप्पणियाँ जोड़ी गईं। {जल के:2} चिह्न उपलब्ध साक्ष्य के अनुसार यथावत रखा गया है। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण यह मसौदा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम स्रोत-सचेत प्रस्तुति है।
