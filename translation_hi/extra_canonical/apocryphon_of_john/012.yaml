  revised_text: '**यूहन्ना का गुप्त ग्रंथ — माता का पश्चाताप**


    1. फिर मैंने कहा, “प्रभु, ‘वह आगे-पीछे घूमती रही’ का क्या अर्थ है?” वह मुसकराया और बोला, “यह मत समझो कि इसका संबंध मूसा के कहे हुए शब्दों, ‘{जल:2} के ऊपर,’ से है। नहीं!


    2. इसके बजाय, जब उसने उस बुराई को देखा जो घटित हुई थी और उस चोरी को जो उसके पुत्र ने की थी, तो उसने पश्चाताप किया। अज्ञान के अंधकार में विस्मृति ने उसे घेर लिया, और वह लज्जित होने लगी। [उसने लौटने का साहस नहीं किया], बल्कि [वह इधर-उधर घूमती] रही।[a]


    3. यही गति ‘आगे-पीछे जाना’ है। उस अभिमानी ने अपनी माता से सामर्थ्य प्राप्त की, क्योंकि वह अज्ञानी था और मानता था कि उसकी माता के सिवा कोई अस्तित्व में नहीं है।


    4. पर जब उसने अपने बनाए हुए स्वर्गदूतों की सेना को देखा, तो उसने अपने आपको उनसे ऊँचा उठाया।


    5. फिर जब माता ने जाना कि अंधकार का वस्त्र दोषपूर्ण था, तब वह समझ गई कि उसका सहचर उसके साथ सहमत नहीं हुआ था।


    6. उसने बहुत रोते हुए पश्चाताप किया, और समूची परिपूर्णता ने उसकी पश्चाताप की प्रार्थना सुनी। उसके लिए उन्होंने अदृश्य, कुमारी आत्मा की स्तुति की।[b]


    7. और [वह] सहमत हुआ। पर जब [अदृश्य आत्मा] सहमत हुआ, तो उनकी समूची परिपूर्णता से पवित्र आत्मा उस पर उंडेला गया। क्योंकि उसका सहचर अकेले उसके पास नहीं आया, बल्कि परिपूर्णता के माध्यम से उसके पास आया, ताकि वह उसकी कमी को सुधार सके। तब उसे ऊपर उठा लिया गया—फिर भी उसके अपने युग में नहीं, बल्कि उसके पुत्र के ऊपर—ताकि वह नौवें लोक में तब तक रहे, जब तक वह अपनी कमी को सुधार न ले।[c]


    8. ऊँचे स्वर्गीय युग से एक वाणी भी निकली, “मनुष्य विद्यमान है, और मनुष्य का पुत्र भी।” प्रधान शासक यल्दाबाओथ ने उसे सुन लिया और समझा कि वह वाणी उसकी माता से आई थी, पर वह नहीं जानता था कि वह कहाँ से आई थी।


    9. उसने उन्हें यह भी सिखाया—अर्थात् पवित्र और परिपूर्ण माता-पिता को, परिपूर्ण पूर्वदृष्टि को, अदृश्य जन के प्रतिरूप को, जो सबका पिता है और जिसके द्वारा सब कुछ अस्तित्व में आया, उस आदि-मनुष्य को—क्योंकि उसने पुरुष-रूप में अपनी समानता प्रकट की।[d]


    10. तब प्रधान शासक का पूरा युग काँप उठा और अथाह गहराई की नींवें हिल गईं। पदार्थ के ऊपर के जल का तल उस प्रकट हुए प्रतिरूप के दर्शन से प्रकाशित हो गया। जब सभी सत्ताओं और प्रधान शासक ने देखा, तो उन्होंने अपने नीचे का पूरा क्षेत्र प्रकाशित पाया।'
