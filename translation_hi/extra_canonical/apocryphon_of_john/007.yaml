  text: '1. Eternal Life also, with his Will, and Mind with Precognition, attended and praised the unseen Spirit and Barbelo, given that they had come into being on her account.


    2. The holy Spirit also completed the self-generated God, his Son, together with Barbelo, so that he would attend the great and unseen, virginal Spirit of the self-generated God, the Christ, whom he had praised with a loud voice.


    3. He came forth by means of Providence, and the unseen, virginal Spirit appointed the truly self-generated God over the All.


    4. He also subjected every authority under him, as well as the truth to be inside him, so that he would know the All, he who had been named with a name exalted above every name, because that name will be spoken to those who deserve it,


    5. given that from Light, which is Christ, and Indestructibility, by means of the gift of the Spirit and the four [great] lights from the self-generated God [...]. He waited for them to attend «8» him,


    6. even the three: Will, Idea, and Life,


    7. even the four powers: Understanding, Grace, Perception, and Discretion.


    8. Further, Grace pertains to the light-aeon Armozel—who is the first angel—and there are three more aeons together with this aeon: Grace, Truth, and Form;


    9. also the second light, Oriael, who had been appointed over the second aeon.


    10. Further, there are three more aeons together with him: Reflection, Perception, and Memory.


    11. Further, the third light is Daveithai, who has been appointed over the third aeon, and there are three more aeons together with him: Understanding, Love, and Ideal Form.


    12. Further, the fourth aeon was appointed over the fourth light, Eleleth.


    13. Further, there are three more aeons together with him: Perfection, Peace, and Sophia.


    14. These are the four lights who attend the self-generated God.


    15. These are the twelve aeons who attend the Son of the Mighty One, the self-generated, Christ, by means of the will and the gift of the unseen Spirit, and the twelve aeons pertain to the self-generated Son.


    16. Further, everything was established by means of the will of the holy Spirit, by means of the self-generated one.'
translation:
  language: hi
  text: '**यूहन्ना का गुप्त ग्रंथ — चार ज्योतियाँ**


    1. अनन्त जीवन भी उसकी इच्छा के साथ, और मन पूर्वज्ञान के साथ, अदृश्य आत्मा और बारबेलो की सेवा में उपस्थित हुए और उनकी स्तुति की, क्योंकि वे उसी के कारण अस्तित्व में आए थे।


    2. पवित्र आत्मा ने भी बारबेलो के साथ मिलकर स्वयं-उत्पन्न परमेश्वर, अपने पुत्र, को पूर्ण किया, ताकि वह महान, अदृश्य, कुँवारी आत्मा की सेवा में उपस्थित रहे—वही स्वयं-उत्पन्न परमेश्वर, मसीह, जिसकी उसने ऊँचे स्वर से स्तुति की थी।


    3. वह पूर्वविधान के द्वारा प्रकट हुआ, और अदृश्य, कुँवारी आत्मा ने सचमुच स्वयं-उत्पन्न परमेश्वर को समस्त सृष्टि के ऊपर नियुक्त किया।


    4. उसने हर सत्ता को उसके अधीन कर दिया और सत्य को भी उसके भीतर रखा, ताकि वह समस्त सृष्टि को जाने। उसे ऐसा नाम दिया गया था जो हर नाम से ऊँचा है, क्योंकि वह नाम उन्हीं को बताया जाएगा जो उसके योग्य हैं।


    5. क्योंकि ज्योति से—जो मसीह है—और अविनाशिता से, आत्मा के वरदान के द्वारा, और स्वयं-उत्पन्न परमेश्वर से निकली चार [महान] ज्योतियों के द्वारा [...]। वह उनकी प्रतीक्षा करता रहा कि वे उसकी सेवा में उपस्थित हों,[a]


    6. अर्थात् ये तीन: इच्छा, विचार और जीवन;


    7. और ये चार शक्तियाँ: समझ, अनुग्रह, बोध और विवेक।


    8. फिर अनुग्रह ज्योति-युग अरमोज़ेल से संबंधित है—जो पहला स्वर्गदूत है—और इस युग के साथ तीन और युग हैं: अनुग्रह, सत्य और स्वरूप।


    9. दूसरी ज्योति ओरियाएल है, जिसे दूसरे युग के ऊपर नियुक्त किया गया था।


    10. उसके साथ भी तीन और युग हैं: मनन, बोध और स्मृति।


    11. तीसरी ज्योति दवेइताई है, जिसे तीसरे युग के ऊपर नियुक्त किया गया है; और उसके साथ तीन और युग हैं: समझ, प्रेम और आदर्श स्वरूप।


    12. फिर चौथा युग चौथी ज्योति एलेलेथ के ऊपर नियुक्त किया गया।[b]


    13. उसके साथ भी तीन और युग हैं: पूर्णता, शान्ति और सोफ़िया।[c]


    14. ये वे चार ज्योतियाँ हैं जो स्वयं-उत्पन्न परमेश्वर की सेवा में उपस्थित रहती हैं।


    15. ये वे बारह युग हैं जो अदृश्य आत्मा की इच्छा और उसके वरदान के द्वारा सामर्थी के पुत्र—स्वयं-उत्पन्न मसीह—की सेवा में उपस्थित रहते हैं; और ये बारह युग स्वयं-उत्पन्न पुत्र से संबंधित हैं।


    16. और सब कुछ पवित्र आत्मा की इच्छा से, स्वयं-उत्पन्न के द्वारा स्थापित किया गया।


    [a] यहाँ मूल साक्ष्य में वाक्य खंडित है; कोष्ठक और त्रिबिंदु पाठ की क्षति अथवा पुनर्स्थापन को दर्शाते हैं। पांडुलिपि का बीच में आया पृष्ठ-संकेत हटा दिया गया है।


    [b] पहले तीन वर्णनों में ज्योति को युग के ऊपर नियुक्त बताया गया है, पर यहाँ उपलब्ध पाठ चौथे युग को चौथी ज्योति के ऊपर नियुक्त बताता है। इस अंतर को यथावत रखा गया है।


    [c] “सोफ़िया” यूनानी मूल का नाम है, जिसका अर्थ “प्रज्ञा” है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ मूल साक्ष्य में वाक्य खंडित है; कोष्ठक और त्रिबिंदु पाठ की क्षति अथवा पुनर्स्थापन को दर्शाते हैं। पांडुलिपि का बीच में आया पृष्ठ-संकेत हटा दिया गया है।
    reason: पद 5 की पाठगत अपूर्णता और संपादकीय चिह्नों की पारदर्शिता।
  - marker: b
    text: पहले तीन वर्णनों में ज्योति को युग के ऊपर नियुक्त बताया गया है, पर यहाँ उपलब्ध पाठ चौथे युग को चौथी ज्योति के ऊपर नियुक्त बताता है। इस अंतर को यथावत रखा गया है।
    reason: संभावित पाठगत असंगति को बिना प्रमाण सुधारे जाने से रोकना।
  - marker: c
    text: “सोफ़िया” यूनानी मूल का नाम है, जिसका अर्थ “प्रज्ञा” है।
    reason: लिप्यंतरित नाम का अर्थ साधारण हिन्दी पाठक को बताना।
lexical_decisions:
- source_word: self-generated (Coptic source review pending)
  choice: स्वयं-उत्पन्न
  rationale: पाठ की विशिष्ट ब्रह्माण्ड-विज्ञान संबंधी उपाधि को सामान्य ‘स्वयंभू’ में समेटने के बजाय उसकी रचनात्मक बनावट और पुनरावृत्ति सुरक्षित रखी गई।
- source_word: aeon
  choice: युग
  rationale: आम पाठक के लिए बोधगम्य हिन्दी शब्द चुना गया, पर इसे कालखंड मात्र न समझा जाए; इस ग्रंथ में यह व्यक्त या दिव्य लोक-सत्ता का भी संकेत कर सकता है।
- source_word: attend
  choice: सेवा में उपस्थित होना
  rationale: केवल ‘सेवा करना’ या ‘साथ रहना’ कहने के बजाय उपस्थिति और परिचर्या दोनों अर्थों को व्यक्त किया गया।
- source_word: Providence
  choice: पूर्वविधान
  rationale: इसे एक नामित दैवी सत्ता/गुण के रूप में रखते हुए केवल सामान्य ‘व्यवस्था’ नहीं किया गया।
- source_word: the All
  choice: समस्त सृष्टि
  rationale: अंग्रेज़ी साक्ष्य के तकनीकी समष्टिगत अर्थ को सहज हिन्दी में दिया गया; यह केवल भौतिक जगत तक सीमित नहीं माना गया।
- source_word: Indestructibility
  choice: अविनाशिता
  rationale: अमूर्त तथा संभवतः व्यक्त दैवी सत्ता का भाव बनाए रखने के लिए संज्ञात्मक रूप चुना गया।
- source_word: Form / Ideal Form
  choice: स्वरूप / आदर्श स्वरूप
  rationale: दोनों संबंधित पदों के बीच उपलब्ध साक्ष्य में दिखने वाला भेद सुरक्षित रखा गया।
- source_word: Sophia
  choice: सोफ़िया
  rationale: नामित सत्ता के रूप में लिप्यंतरण रखा गया और अर्थ ‘प्रज्ञा’ पादटिप्पणी में दिया गया।
theological_decisions:
- issue: ‘पवित्र आत्मा’, ‘अदृश्य आत्मा’ और ‘कुँवारी आत्मा’ का संबंध
  choice: स्रोत की अलग-अलग उपाधियों को यथावत रखा गया
  alternative: सभी को एक ही मानकीकृत पद ‘पवित्र आत्मा’ से प्रस्तुत करना
  rationale: ग्रंथ की अंतर्निहित पहचान अथवा भेद को किसी बाद की त्रिएकतावादी या अन्य सांप्रदायिक रूपरेखा से तय नहीं किया गया।
- issue: स्वयं-उत्पन्न परमेश्वर, पुत्र और मसीह की वाक्यगत पहचान
  choice: स्रोत की तनावपूर्ण और कुछ हद तक अस्पष्ट समानाधिकरण संरचना सुरक्षित रखी गई
  alternative: सभी पदों को स्पष्ट रूप से एक ही सत्ता या अलग-अलग सत्ताएँ घोषित करना
  rationale: उपलब्ध साक्ष्य जिस सीमा तक पहचान करता है, अनुवाद उससे आगे नहीं जाता।
- issue: चौथे युग और चौथी ज्योति की नियुक्ति
  choice: पद 12 की उलटी दिशा को पाठानुसार रखा गया
  alternative: पद 9 और 11 के अनुरूप ‘एलेलेथ को चौथे युग के ऊपर नियुक्त किया गया’ करना
  rationale: संभावित लिपिकीय अथवा साक्ष्यगत असंगति को मौन रूप से सुधारा नहीं गया; पादटिप्पणी में बताया गया है।
- issue: खंडित पद 5
  choice: वाक्य की अपूर्णता, वर्ग कोष्ठक और त्रिबिंदु बनाए रखे गए
  alternative: संदर्भ से पूरा वाक्य पुनर्निर्मित करना
  rationale: पांडुलिपि-क्षति और वास्तविक अनिश्चितता को छिपाने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। तकनीकी ब्रह्माण्ड-विज्ञान संबंधी पदों में जहाँ संभव हुआ, सहज हिन्दी और सीमित लिप्यंतरण का संतुलन रखा गया। प्रत्यक्ष कॉप्टिक स्रोत-समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; इसलिए संदिग्ध वाक्य-संबंधों को अत्यधिक स्पष्ट नहीं किया गया।
