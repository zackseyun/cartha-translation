  source_fidelity: प्रत्यक्ष कॉप्टिक पाठ की समीक्षा लंबित है; अतः समीक्षा उपलब्ध अंग्रेज़ी साक्ष्य के प्रति की गई है। पद 2 में मसौदे ने ‘स्वयं-उत्पन्न परमेश्वर, मसीह’ को कुँवारी आत्मा के साथ इस प्रकार जोड़ा था कि स्रोत की possessive/समानाधिकरणीय संरचना बदल जाती थी। उसे अधिक निकट और कम व्याख्यात्मक रूप में सुधारा गया है। पद 3–4 में तकनीकी ‘the All’ को ‘समस्त सृष्टि’ करने से उसका व्यापक, ब्रह्माण्डीय संकेत संकुचित हो सकता था; इसलिए ‘समस्त’ रखा गया है। पद 5 की क्षति, वर्ग-कोष्ठक और त्रिबिंदु सुरक्षित हैं तथा पद 12 की उलटी नियुक्ति नहीं सुधारी गई है।
  naturalness: संशोधित पाठ आधुनिक मानक हिन्दी में पठनीय है। ‘सेवा में उपस्थित रहना’ को यथावत रखा गया है, क्योंकि यह केवल सामान्य उपस्थिति नहीं बल्कि attend के परिचर्या-संकेत को भी बचाता है। पद 2 की वाक्य-रचना स्रोत की कठिनता बनाए रखते हुए अधिक स्पष्ट की गई है; कोई सिद्धान्तगत पहचान आरोपित नहीं की गई।
  terminology: ‘स्वयं-उत्पन्न’, ‘युग’, ‘पूर्वविधान’, ‘अविनाशिता’, ‘अनुग्रह’, और ‘सोफ़िया’ सुसंगत रखे गए हैं। नामों के देवनागरी रूपों में ओरिएल और दवेइथाई अधिक स्वाभाविक लिप्यंतरण हैं। ‘समस्त’ को technical the All के लिए रखा गया है, जिससे इसे केवल भौतिक सृष्टि न समझा जाए।
  issues:
  - severity: medium
    issue: पद 2 में कुँवारी आत्मा और स्वयं-उत्पन्न परमेश्वर/मसीह का संबंध बदल गया था।
    rationale: मसौदे का ‘वही स्वयं-उत्पन्न परमेश्वर, मसीह’ कुँवारी आत्मा को ही परमेश्वर/मसीह बना देता था, जबकि उपलब्ध साक्ष्य की संरचना ‘the ... Spirit of the self-generated God, the Christ’ है। संशोधन possessive संबंध रखता है, पर कठिन समानाधिकरण को कृत्रिम रूप से हल नहीं करता।
  - severity: medium
    issue: पद 3 और 4 में ‘the All’ का ‘समस्त सृष्टि’ अनुवाद अत्यधिक सीमित है।
    rationale: स्रोत में यह व्यापक समष्टिगत पद है; ‘समस्त’ उस विस्तार और तकनीकी खुलेपन को बेहतर बचाता है।
  - severity: low
