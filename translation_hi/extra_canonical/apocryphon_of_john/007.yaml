    reason: संभावित पाठगत असंगति को बिना प्रमाण सुधारे जाने से रोकना।
  - marker: c
    text: “सोफ़िया” यूनानी मूल का नाम है, जिसका अर्थ “प्रज्ञा” है।
    reason: लिप्यंतरित नाम का अर्थ साधारण हिन्दी पाठक को बताना।
  revision_rationale: सुरक्षित संशोधन केवल वहाँ किए गए हैं जहाँ हिन्दी पाठ ने उपलब्ध अंग्रेज़ी साक्ष्य के संबंधों को बदल दिया था या तकनीकी विस्तार को अनावश्यक रूप से सीमित किया था। खंडित पाठ, असंगत पद 12, तथा जटिल पद 2 की अंतर्निहित अनिश्चितता को संरक्षित रखा गया है।
