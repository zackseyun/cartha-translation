translation:
  language: hi
  text: '1. फिर, सिद्ध मन के पूर्वज्ञान से, अदृश्य आत्मा की इच्छा और स्वयं-उत्पन्न की इच्छा के प्रकट होने के द्वारा, सिद्ध मनुष्य—पहला प्रकाशन, अर्थात् सत्य—प्रकट हुआ।


    2. उसी का नाम कुँवारी आत्मा ने पिगेरा-अदामा[s] रखा; और उसने उसे प्रथम युग के ऊपर सामर्थी जन, स्वयं-उत्पन्न मसीह, के साथ नियुक्त किया—प्रथम ज्योति अरमोज़ेल के पास, और उसकी शक्तियाँ उसके साथ थीं।[b]


    3. फिर अदृश्य जन ने उसे आत्मिक और अभेद्य सामर्थ्य प्रदान किया।


    4. तब उसने बोलकर अदृश्य आत्मा की महिमा की और उसकी स्तुति करते हुए कहा, “आपके कारण ही सब कुछ अस्तित्व में आया है, और सब कुछ आपके पास लौटेगा।


    5. मैं आपकी और स्वयं-उत्पन्न की, और तीन युगों—पिता, माता और पुत्र, उस सिद्ध सामर्थ्य—की स्तुति और महिमा करूँगा।”


    6. उसने उसके पुत्र सेत को भी दूसरे युग के ऊपर, दूसरी ज्योति ओरोइएल के सामने नियुक्त किया। तीसरे युग के भीतर सेत का वंश तीसरी ज्योति दावेइताई के ऊपर नियुक्त किया गया, और उसी में पवित्र जनों के प्राण रखे गए।


    7. फिर चौथे युग के भीतर उन लोगों के प्राण रखे गए जो परिपूर्णता से परिचित नहीं थे और जिन्होंने तुरंत मन नहीं फिराया, बल्कि कुछ समय तक वैसे ही बने रहे और बाद में मन फिराया।


    8. ये चौथी ज्योति एलेलेथ हैं।[c]


    9. ये वे सृजे हुए प्राणी हैं जो अदृश्य आत्मा की महिमा करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: साक्ष्य में इस स्थान पर अकेला ‘9’ संभवतः पांडुलिपि का पृष्ठ-संकेत है; उसे वाक्य का भाग नहीं माना गया है।
    reason: वाक्य को बाधित करने वाले संपादकीय/पृष्ठ संकेत का स्पष्टीकरण।
  - marker: c
    text: 'यह वाक्य मूल साक्ष्य में भी असामान्य है: बहुवचन ‘ये’ को एकवचन ‘चौथी ज्योति, एलेलेथ’ से जोड़ा गया है।'
    reason: असामान्य व्याकरण और संभावित पाठगत तनाव को बिना सुधार किए बताना।
lexical_decisions:
- source_word: Precognition of Perfect Mind
  choice: सिद्ध मन का पूर्वज्ञान
  rationale: तकनीकी अवधारणा की औपचारिकता बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट संज्ञा-पद चुना गया।
- source_word: self-generated one
  choice: स्वयं-उत्पन्न
  rationale: मूल की विशिष्ट उपाधि को सामान्य धार्मिक शब्दावली में मिलाए बिना यथासंभव निकट रखा गया।
- source_word: aeon
  choice: युग
  rationale: सामान्य पाठक के लिए बोधगम्य हिन्दी शब्द चुना गया, पर प्रसंग में यह दैवी लोक/सत्ता-संबंधी तकनीकी अर्थ रखता है।
- source_word: the All
  choice: सब कुछ
  rationale: समस्त अस्तित्व के सामूहिक अर्थ को सहज हिन्दी में व्यक्त किया गया; इसे किसी बाद की दार्शनिक प्रणाली के अनुसार सीमित नहीं किया गया।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: ग्नॉस्टिक तकनीकी अर्थ की ओर संकेत बनाए रखने के लिए अमूर्त संज्ञा और आरंभिक बड़े अक्षर की भरपाई अर्थगत विशिष्टता से की गई।
- source_word: invulnerable strength
  choice: अभेद्य सामर्थ्य
  rationale: ऐसी शक्ति का भाव रखा गया जिसे क्षति नहीं पहुँचाई जा सकती।
- source_word: seed of Seth
  choice: सेत का वंश
  rationale: यहाँ सामूहिक संतति का अर्थ अधिक स्वाभाविक है; शाब्दिक 'बीज' हिन्दी में अनावश्यक अस्पष्टता पैदा करता।
- source_word: souls
  choice: प्राण
  rationale: व्यक्तियों के अभौतिक जीवन-तत्त्व के लिए गरिमापूर्ण, सामान्य हिन्दी शब्द; इसे किसी विशिष्ट सांप्रदायिक आत्मा-सिद्धांत से नहीं बाँधा गया।
theological_decisions:
- issue: Perfect Man का उद्गम
  choice: ‘प्रकट हुआ’ द्वारा उद्गम व्यक्त किया
  alternative: ‘निकल आया’ या ‘उत्पन्न हुआ’
  rationale: साक्ष्य में issued forth पूरक/पुनर्निर्मित है; ‘प्रकट हुआ’ प्रथम प्रकाशन के साथ संबंध रखते हुए उत्पत्ति की प्रकृति को अत्यधिक निश्चित नहीं करता।
- issue: Father, Mother, Son और perfect power का व्याकरणिक संबंध
  choice: ‘पिता, माता और पुत्र, उस सिद्ध सामर्थ्य’
  alternative: ‘पिता, माता, पुत्र और सिद्ध सामर्थ्य’ चार समांतर पद
  rationale: मूल विराम-रचना अस्पष्ट है; प्रस्तुत रूप apposition की संभावना बचाता है, पर पूर्णतः निर्णायक नहीं बनता।
- issue: अनुताप की प्रकृति
  choice: ‘मन फिराया’
  alternative: ‘पश्चात्ताप किया’
  rationale: repent के दिशा-परिवर्तन वाले भाव को सहज हिन्दी में रखा और केवल भावनात्मक पछतावे तक सीमित नहीं किया।
- issue: अनुच्छेद 8 की असामान्य पहचान
  choice: बहुवचन ‘ये’ और एकवचन ‘चौथी ज्योति’ का तनाव जस का तस रखा
  alternative: ‘यह चौथी ज्योति एलेलेथ है’
  rationale: साक्ष्य की असामान्य wording को harmonize नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ रूप अपनाया गया है। तकनीकी नामों का देवनागरी लिप्यंतरण किया गया और विशिष्ट उपाधियों को सामान्य बाइबलीय पदों में विलीन नहीं किया गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है।
