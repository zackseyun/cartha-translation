translation:
  language: hi
  text: '“तुम्हारे सुनते-सुनते मैंने तुम्हारे लिए सब कुछ पूरा कर दिया है। मैंने तुम्हें ये सारी बातें इसलिए बताई हैं कि तुम इन्हें लिख लो और गुप्त रूप से अपने संगी आत्माओं में बाँट दो, क्योंकि यह अचल वंश का रहस्य है।”[a]


    उद्धारकर्ता ने ये वचन उसे भी सौंपे, ताकि वह इन्हें लिख ले और बंद करके सुरक्षित रखे। उसने उससे कहा, “शापित हो वह जो इन वचनों का सौदा किसी भेंट के बदले करे—चाहे भोजन, पेय, वस्त्र या ऐसी ही कोई और वस्तु हो।”


    ये वचन भी रहस्यपूर्वक उसे सौंपे गए। फिर उद्धारकर्ता अचानक उसकी दृष्टि से ओझल हो गया। वह अपने संगी शिष्यों के पास गया और उन्हें बताया कि उद्धारकर्ता ने उससे क्या कहा था।


    यीशु मसीह। आमीन।


    यूहन्ना के अनुसार गुप्त लेख'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “संगी आत्माएँ” और “अचल वंश” इस ग्रंथ की पारिभाषिक, किंतु यहाँ अस्पष्ट, अभिव्यक्तियाँ हैं। इनके लिए “साथी आत्माएँ” और “अविचल जाति” भी संभव अनुवाद हैं।
    reason: दो असामान्य पदों की वास्तविक शब्दार्थगत और धार्मिक अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: in your hearing
  choice: तुम्हारे सुनते-सुनते
  rationale: श्रवण की उपस्थिति और चलती हुई वाणी—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: companion spirits
  choice: संगी आत्माएँ
  rationale: असामान्य आध्यात्मिक पदावली को सामान्य ‘साथियों’ में विलीन किए बिना उसकी अस्पष्टता सुरक्षित रखता है।
- source_word: unmoving race
  choice: अचल वंश
  rationale: ‘unmoving’ के स्थिर/अविचल भाव और ‘race’ की समूह-वंश संबंधी भाषा को संक्षिप्त रूप में रखता है।
- source_word: keep them locked away
  choice: बंद करके सुरक्षित रखे
  rationale: भौतिक रूप से बंद रखने और गोपनीय संरक्षण—दोनों अर्थ व्यक्त होते हैं।
- source_word: trade these sayings for a gift
  choice: इन वचनों का सौदा किसी भेंट के बदले करे
  rationale: पवित्र कथनों को लाभ के लिए विनिमय करने की निंदा को स्पष्ट रखता है।
- source_word: in a mystery
  choice: रहस्यपूर्वक
  rationale: गुप्त रीति से सौंपे जाने का भाव देता है, पर कथनों की रहस्यमय प्रकृति को पूरी तरह परिभाषित नहीं करता।
- source_word: The Secret Writing According to John
  choice: यूहन्ना के अनुसार गुप्त लेख
  rationale: शीर्षक की पारंपरिक ‘according to’ संरचना और ‘secret writing’ की साहित्यिक प्रकृति दोनों सुरक्षित हैं।
theological_decisions:
- issue: ‘अचल वंश’ की पहचान
  choice: पद को बिना व्याख्या के ‘अचल वंश’ रखा गया
  alternative: ‘अविचल जाति’ या किसी विशिष्ट आध्यात्मिक समुदाय की व्याख्यात्मक पहचान
  rationale: साक्ष्य में पद पारिभाषिक और धार्मिक रूप से तनावपूर्ण है; अनुवाद में उसकी पहचान तय कर देना उचित नहीं।
- issue: ‘संगी आत्माओं’ का आशय
  choice: आध्यात्मिक पदावली को ज्यों का त्यों खुला रखा गया
  alternative: ‘साथी विश्वासियों’ अथवा ‘आत्मिक साथियों’
  rationale: ‘spirits’ को मनुष्यों/विश्वासियों के रूप में स्पष्ट करना स्रोत की वास्तविक अस्पष्टता को मिटा देता।
- issue: वचनों को छिपाकर रखने और बाँटने का संबंध
  choice: दोनों कथनों को उनके अलग प्रसंगों में बिना सामंजस्यकारी व्याख्या के रखा गया
  alternative: केवल चुने हुए लोगों में वितरण के रूप में स्पष्ट करना
  rationale: पाठ स्वयं गुप्त वितरण और बंद संरक्षण दोनों कहता है; अनुवाद को इस तनाव को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध गद्य रखा गया है। संबोधन में एकवचन ‘तुम’ अपनाया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण पारिभाषिक विकल्प सावधानीपूर्वक और जहाँ आवश्यक हो वहाँ पादटिप्पणी सहित दिए गए हैं। पांडुलिपि का पृष्ठ-संकेत हटाया गया है।
