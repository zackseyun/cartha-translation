id: APOJ.021
reference: Apocryphon of John — Conclusion
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: '1. In your hearing I have finished everything for your sake, but I have said everything to you so that you may write them down and distribute them in secret to your companion spirits, because this is the mystery of the unmoving race.”


    2. The savior also entrusted these sayings to him so that he would write them down and keep them locked away, and he said to him: “Cursed be any who will trade these sayings for a gift, either of food, or of drink, or of garments, or of any other thing like these.” «32»


    3. These sayings were also entrusted to him in a mystery, and suddenly he vanished from him, and he departed to his companion disciples and informed them about what the savior had said to him.


    <center>Jesus Christ. Amen.</center>

    <center>The Secret Writing According to John</center>'
