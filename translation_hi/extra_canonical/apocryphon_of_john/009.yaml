    She willed to bring forth a likeness from out of herself, apart from the agreement of the Spirit, who had not accepted it, and apart from her companion, and apart from his deliberation, and although the face of her maleness had not accepted this.


    Further, she brought forth despite having failed to find her companion, as well as having deliberated apart from the agreement of the Spirit and the knowledge of her companion, «10» and on account of the invulnerable strength dwelling inside her,


    her thought did not remain barren, and she produced from herself something that was incomplete and that differed from her own appearance, because she had created him apart from her companion, and he differed from the appearance of his mother, because he possesses a different form.


    Further, when she saw (the result of) her own will, he morphed into a lion-faced {dragon:1} form,


    and his eyes resembled lightning fires that flash.


    She thrust him away from her, outside those places, so that none of the immortal ones could see him, because she had created him in ignorance.


    She also surrounded him with a shining cloud, and she erected a throne in the midst of the cloud, so that none could see him, apart from the holy Spirit — whose name is the Mother of the Living — and she called his name Yaltabaoth.


    This is the chief archon who procured a strong power from his mother,


    and he extricated himself from her, and moved away from the places where he had been born.'
translation:
  language: hi
  text: '1. फिर, मनन की सोफिया ने, जो एक ऐओन थी, अदृश्य आत्मा और पूर्वज्ञान की धारणा के साथ, अपने आप ही एक विचार किया।


    2. उसने अपने भीतर से एक प्रतिरूप उत्पन्न करना चाहा—आत्मा की सहमति के बिना, जिसने इसे स्वीकार नहीं किया था; अपने सहचर और उसके विचार-विमर्श के बिना; और तब भी, जब उसके पुरुष-पक्ष के मुख ने इसे स्वीकार नहीं किया था।[a]


    3. फिर, अपना सहचर न मिलने पर भी उसने उत्पन्न किया। उसने आत्मा की सहमति और अपने सहचर के ज्ञान के बिना विचार किया था; और उसके भीतर वास करने वाली अभेद्य शक्ति के कारण,


    4. उसका विचार निष्फल नहीं रहा। उसने अपने भीतर से कुछ ऐसा उत्पन्न किया जो अपूर्ण था और उसके अपने स्वरूप से भिन्न था, क्योंकि उसने उसे अपने सहचर के बिना रचा था। वह अपनी माता के स्वरूप से भिन्न था, क्योंकि उसका रूप अलग था।


    5. फिर, जब उसने अपनी इच्छा का परिणाम देखा, तो वह सिंहमुखी अजगर के रूप में बदल गया।[b]


    6. उसकी आँखें चमकती हुई बिजली की ज्वालाओं जैसी थीं।


    7. उसने उसे अपने से दूर, उन स्थानों के बाहर धकेल दिया, ताकि अमर जनों में से कोई उसे न देख सके, क्योंकि उसने उसे अज्ञान में रचा था।


    8. उसने उसे एक चमकते बादल से भी घेर दिया और बादल के बीच एक सिंहासन स्थापित किया, ताकि जीवितों की माता कहलाने वाली पवित्र आत्मा के सिवा कोई उसे न देख सके। उसने उसका नाम यालताबाओथ रखा।[c]


    9. यही प्रधान आर्कोन है, जिसने अपनी माता से प्रबल शक्ति प्राप्त की।[d]


    10. वह अपने को उससे अलग करके उन स्थानों से दूर चला गया जहाँ वह उत्पन्न हुआ था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके पुरुष-पक्ष के मुख’ मूल गवाही के एक कठिन और संभवतः पारिभाषिक वाक्यांश का निकट अनुवाद है; इसका आशय उसके पुरुष सहचर या पुरुष प्रतिरूप से हो सकता है।
    reason: वाक्यांश की वास्तविक अस्पष्टता और असामान्य रूपक को स्पष्ट करना।
  - marker: b
    text: उपलब्ध अंग्रेज़ी गवाही में ‘सिंहमुखी अजगर’ है; ‘अजगर’ के साथ लगा संपादकीय संकेत यहाँ नहीं रखा गया। कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: संपादकीय स्थिति और स्रोतगत सीमा बताना।
  - marker: c
    text: ‘यालताबाओथ’ नाम की वर्तनी पांडुलिपियों और आधुनिक लिप्यंतरणों में भिन्न मिल सकती है।
    reason: व्यक्तिनाम की लिप्यंतरण-विविधता बताना।
  - marker: d
    text: ‘आर्कोन’ ज्ञानवादी ग्रंथों का पारिभाषिक पद है, जिसका सामान्य अर्थ ‘शासक’ या ‘अधिपति’ है।
    reason: अपरिचित तकनीकी शब्द को पाठक के लिए समझाना।
lexical_decisions:
- source_word: aeon
  choice: ऐओन
  rationale: इस ज्ञानवादी पारिभाषिक पद को केवल ‘युग’ कहना यहाँ व्यक्तित्व/दैवी सत्ता का अर्थ खो सकता है; इसलिए लिप्यंतरण रखा गया।
- source_word: Sophia of Reflection
  choice: मनन की सोफिया
  rationale: ‘Sophia’ को नाम के रूप में रखा और ‘Reflection’ को स्वाभाविक किंतु खुला अर्थ देने के लिए ‘मनन’ किया।
- source_word: likeness
  choice: प्रतिरूप
  rationale: समान आकृति या अनुरूप सत्ता का भाव देता है, बिना उसे केवल चित्र या प्रतिमा तक सीमित किए।
- source_word: companion
  choice: सहचर
  rationale: लिंग और संबंध की पारिभाषिक गंभीरता रखते हुए आधुनिक, बोधगम्य शब्द चुना गया।
- source_word: chief archon
  choice: प्रधान आर्कोन
  rationale: विशिष्ट ज्ञानवादी पद ‘archon’ का लिप्यंतरण किया गया; ‘प्रधान’ उसके पदानुक्रम को व्यक्त करता है।
- source_word: Yaltabaoth
  choice: यालताबाओथ
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया।
theological_decisions:
- issue: ‘face of her maleness’ का अस्पष्ट रूपक
  choice: उसके पुरुष-पक्ष के मुख
  alternative: उसकी पुरुष सत्ता / उसका पुरुष प्रतिरूप
  rationale: साक्ष्य में उपस्थित असामान्य ‘मुख’ और स्त्री सत्ता के ‘पुरुष-पक्ष’ दोनों को बनाए रखा गया; किसी निश्चित तत्त्वमीमांसात्मक व्याख्या को आरोपित नहीं किया।
- issue: पवित्र आत्मा और ‘जीवितों की माता’ का संबंध
  choice: जीवितों की माता कहलाने वाली पवित्र आत्मा
  alternative: पवित्र आत्मा—जिसका नाम जीवितों की माता है
  rationale: मूल गवाही की पहचान को बनाए रखते हुए हिंदी वाक्य को सहज बनाया गया; इसे किसी बाद की त्रित्ववादी व्यवस्था के अनुसार नहीं बदला गया।
- issue: Sophia की सृष्टि में अज्ञान और असहमति
  choice: अज्ञान, आत्मा की असहमति और सहचर की अनुपस्थिति स्पष्ट रखी
  alternative: इसे नैतिक पाप या केवल भूल के रूप में स्पष्ट करना
  rationale: पाठ के धर्मवैचारिक तनाव को किसी संप्रदायगत श्रेणी में हल नहीं किया गया।
- issue: उत्पन्न सत्ता के लिए पुल्लिंग संकेत
  choice: ‘उसे/वह’ पुल्लिंग में
  alternative: नपुंसक ‘वह वस्तु’
  rationale: अंग्रेज़ी गवाही पहले ‘something’ कहती है पर आगे ‘him/he’ का प्रयोग करती है; हिंदी में आगे की वैयक्तिक सत्ता को ध्यान में रखकर पुल्लिंग रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। ज्ञानवादी पारिभाषिक पदों ‘ऐओन’ और ‘आर्कोन’ को अर्थ-संकुचन से बचाने के लिए लिप्यंतरित किया गया है। अनुच्छेद/पद क्रम और कथन की पुनरावृत्ति मूल गवाही के अनुरूप रखी गई। पांडुलिपि का बाधक पृष्ठ-संकेत «10» हटाया गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी गवाही पर आधारित है; कॉप्टिक स्रोत-भाषा समीक्षा लंबित होने के कारण कठिन स्थलों पर टिप्पणियाँ दी गई हैं।
