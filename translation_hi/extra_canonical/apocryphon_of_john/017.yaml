  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: hi
  text: 'मैं ज्ञान के वृक्ष पर उकाब के रूप में प्रकट हुआ। यह वृक्ष निर्मल ज्योति की पूर्वदृष्टि का प्रतिबिंब है। मैं इसलिए प्रकट हुआ कि उन्हें शिक्षा दूँ और उनकी गहरी नींद से उन्हें जगाऊँ, क्योंकि वे दोनों पतित दशा में थे और उन्हें अपने नंगेपन का बोध हो गया था।


    प्रतिबिंब ज्योति के रूप में उनके सामने प्रकट हुई और उसने उनकी बुद्धि जगा दी। पर जब याल्दाबाओथ ने जान लिया कि वे उससे दूर हो गए हैं, तो उसने अपनी पृथ्वी को शाप दिया।


    वह उस स्त्री के पास उस समय पहुँचा, जब वह अपने पति के लिए अपने आपको तैयार कर रही थी।


    वह उसका अधिपति था, यद्यपि वह उस रहस्य को नहीं जानता था जो पवित्र आदेश के द्वारा घटित हुआ था। वे उस पर दोष लगाने से डरते थे। उसने अपने भीतर का अज्ञान अपने स्वर्गदूतों के सामने प्रकट कर दिया; फिर उसने उन्हें स्वर्गोद्यान से निकाल दिया और उन्हें घोर अंधकार पहना दिया।


    प्रधान शासक ने उस कुँवारी को भी देखा जो आदम के पास खड़ी थी, और यह भी कि जीवन का दीप्तिमान प्रतिबिंब उसके भीतर प्रकट हुआ था। याल्दाबाओथ अज्ञान से भर गया। जब समस्त की पूर्वदृष्टि ने यह देखा, तो उसने दूत भेजे, और उन्होंने शीघ्र ही हव्वा में से जीवन को निकाल लिया।


    तब प्रधान शासक ने उसे अशुद्ध किया और उससे दो पुत्र उत्पन्न किए—पहला और दूसरा: एलोईम और यावे।


    एलोईम का मुख भालू जैसा है, पर यावे का मुख बिल्ली जैसा है।


    यावे न्यायी है, पर एलोईम अन्यायी है।


    यावे को आग और वायु पर नियुक्त किया गया, जबकि एलोईम को जल और पृथ्वी पर। पर छल करने के उद्देश्य से उसने उन्हें कैन और हाबिल नाम दिए।


    प्रधान शासक के कारण ही आज तक यौन-संबंध चलता आया है। उसी ने आदम की स्त्री के भीतर यौन-लालसा रोपी। यौन-संबंध के द्वारा उसने शरीरों की प्रतिकृतियाँ बनाईं और उनमें अपनी झूठी आत्मा फूँक दी।


    उसने उन दोनों शासकों को कई अधिपत्य-क्षेत्रों पर नियुक्त किया, ताकि वे कब्र पर शासन करें।[a]


    पर जब आदम को अपनी ही पूर्वज्ञान-रूपी समानता का बोध हुआ, तो उसने मनुष्य-पुत्र की समानता को उत्पन्न किया और उसका नाम सेत रखा—ठीक उस रीति के अनुसार, जिस रीति से वह वंश युगों में विद्यमान है।[b]


    इसी प्रकार माता ने भी अपनी आत्मा नीचे भेजी, जो उसी की समानता में है, और उसके साथ उस जन की एक प्रतिरूप-छवि भी भेजी जो परिपूर्णता में वास करता है; क्योंकि वह नीचे उतरनेवाले युगों के लिए निवास-स्थान तैयार करेगी।[c]


    उसने उन्हें प्रधान शासक से मिला विस्मृति का जल भी पिलाया, ताकि वे अपने उद्गम का स्थान न जान सकें।[d]


    इस प्रकार वह बीज कुछ समय तक सहायता के लिए बना रहा, ताकि जब आत्मा पवित्र युगों से निकले, तो वह उसे उठाए और उसकी न्यूनता से उसे चंगा करे, जिससे समूची परिपूर्णता पवित्र और निर्दोष हो जाए।”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कब्र’ संभवतः भौतिक देह या नश्वर जगत के लिए रूपक है; पाठ स्वयं इसे स्पष्ट नहीं करता।
    reason: तकनीकी ज्ञानवादी रूपक की वास्तविक संदर्भ-सीमा अनिश्चित है।
  - marker: b
    text: ‘युग’ यहाँ कॉप्टिक-ज्ञानवादी परंपरा के ‘एऑन’ हैं—ये कालखंडों के साथ-साथ दिव्य या स्वर्गीय सत्ताओं का भी बोध करा सकते हैं। ‘वंश’ का आशय आध्यात्मिक जाति/संतति भी हो सकता है।
    reason: दो तकनीकी पदों की बहुअर्थकता पाठ की समझ के लिए आवश्यक है।
  - marker: c
    text: ‘परिपूर्णता’ उस दिव्य पूर्ण क्षेत्र के लिए तकनीकी पद है जिसे प्रायः ‘प्लेरोमा’ कहा जाता है।
    reason: साधारण पूर्णता और विशिष्ट ज्ञानवादी ब्रह्मांडीय क्षेत्र में भेद बताना आवश्यक है।
  - marker: d
    text: इस वाक्य में ‘उसने’ किसे सूचित करता है, उपलब्ध अंग्रेज़ी साक्ष्य में स्पष्ट नहीं है; अनुवाद ने अनिश्चितता बनाए रखी है।
    reason: कर्ता की वास्तविक संदर्भ-अस्पष्टता को चुपचाप सुलझाने से बचना।
  - marker: e
    text: अंतिम वाक्य में ‘बीज’, ‘आत्मा’ और ‘उसे’ के आपसी संदर्भ जटिल हैं; ‘बीज’ किसी आध्यात्मिक संतति या भीतर स्थित दिव्य तत्व का बोध करा सकता है।
    reason: स्रोत-भाषा समीक्षा लंबित होने के कारण सर्वनाम और तकनीकी रूपक की सीमा बताना आवश्यक है।
lexical_decisions:
- source_word: archon
  choice: शासक; chief archon = प्रधान शासक
  rationale: इस ज्ञानवादी पद का मूल अर्थ शासक/अधिकारी है। सहज हिन्दी के लिए ‘शासक’ रखा गया और पदानुक्रम बताने के लिए ‘प्रधान शासक’ प्रयोग किया गया।
- source_word: Providence
  choice: पूर्वदृष्टि
  rationale: यहाँ स्त्रीलिंग दैवी सत्ता के रूप में प्रयुक्त पद को केवल सामान्य ‘प्रबंध’ न बनाकर उसके व्यक्तित्व और पूर्वज्ञान-संबंधी अर्थ को बनाए रखता है।
- source_word: Reflection
  choice: प्रतिबिंब
  rationale: ज्ञानवादी सत्ता/अभिव्यक्ति के रूप में प्रयुक्त अमूर्त पद का निकट औपचारिक रूप रखा गया है और स्त्रीलिंग सर्वनाम से उसका व्यक्तिकरण सुरक्षित है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: प्लेरोमा-संबंधी तकनीकी अवधारणा को अर्थपूर्ण हिन्दी में रखा गया है, बिना किसी बाद की सांप्रदायिक व्याख्या को आरोपित किए।
- source_word: aeons
  choice: युग
  rationale: स्रोत परंपरा में ये केवल कालखंड नहीं, अलौकिक सत्ताएँ भी हो सकती हैं; ‘युग’ मूल बहुअर्थकता को कुछ हद तक बचाता है और टिप्पणी से स्पष्ट किया गया है।
- source_word: simulacrum
  choice: प्रतिरूप-छवि
  rationale: सिर्फ ‘छवि’ कहने से नकल अथवा प्रतिनिधि रूप का भाव घटता; संयुक्त पद दोनों पक्षों को बचाता है।
- source_word: false spirit
  choice: झूठी आत्मा
  rationale: ‘spirit’ की देह में फूँके जाने की छवि और उसकी असत्य/भ्रामक प्रकृति दोनों को सीधे रखा गया है।
- source_word: seed
  choice: बीज
  rationale: ज्ञानवादी वंश या आध्यात्मिक तत्व की संभावित सामूहिकता को व्याख्यात्मक रूप से सीमित किए बिना स्रोत का रूपक सुरक्षित रखा गया है।
theological_decisions:
- issue: यौन-संबंध और प्रधान शासक के बीच संबंध
  choice: 'कारणात्मक कथन को सीधे रखा: ‘प्रधान शासक के कारण ही...’'
  alternative: इसे केवल यौन-दुराचार या वासना के आरंभ तक सीमित करना
  rationale: साक्ष्य में व्यापक और तनावपूर्ण दावा है; उसे नैतिक रूप से नरम या प्रचलित धर्मशास्त्र के अनुकूल नहीं बनाया गया।
- issue: हव्वा को ‘अशुद्ध’ करने का कथन
  choice: ‘उसने उसे अशुद्ध किया’
  alternative: ‘उसके साथ बलात्कार किया’ अथवा ‘उसे भ्रष्ट किया’
  rationale: मूल साक्ष्य ‘polluted’ कहता है और घटना की सटीक प्रकृति अस्पष्ट है; अधिक विशिष्ट हिंसात्मक अर्थ जोड़ना स्रोत से आगे जाता।
- issue: एलोईम/यावे और कैन/हाबिल की पहचान
  choice: नामों और छलपूर्ण नामकरण को यथावत रखा
  alternative: बाइबिलीय नामों को मानक ईश्वर-नामों से समीकृत या सुधारना
  rationale: यह रचना जानबूझकर तनावपूर्ण वैकल्पिक ब्रह्मांड-विज्ञान प्रस्तुत करती है; उसे प्रामाणिक बाइबिलीय कथानक के अनुरूप नहीं किया गया।
- issue: आत्मा के सर्वनाम और अंतिम वाक्य के संदर्भ
  choice: पुल्लिंग ‘वह/उसे’ बनाए रखा
  alternative: निर्लिंग या बहुवचन पुनर्लेखन
  rationale: अंग्रेज़ी साक्ष्य में संदर्भ अस्पष्ट है कि उठाया और चंगा किया जाने वाला ‘बीज’ है या कोई व्यक्ति; अनुवाद ने इस अस्पष्टता को पूर्णतः हल नहीं किया।
- issue: माता और पूर्वदृष्टि का स्त्रीलिंग व्यक्तिकरण
  choice: स्त्रीलिंग सर्वनाम रखा
  alternative: अमूर्त निर्लिंग संज्ञाएँ
