  revised_text: 'मैं ज्ञान के वृक्ष पर उकाब के रूप में प्रकट हुआ। वह वृक्ष निर्मल ज्योति की दैवी व्यवस्था का प्रतिबिंब है। मैं इसलिए प्रकट हुआ कि उन्हें शिक्षा दूँ और उनकी गहरी नींद से जगाऊँ, क्योंकि वे दोनों पतित दशा में थे और उन्हें अपने नंगेपन का बोध हो गया था।


    प्रतिबिंब ज्योति के रूप में उनके सामने प्रकट हुई और उसने उनकी बुद्धि जगा दी। पर जब याल्दाबाओथ ने जान लिया कि वे उससे दूर हो गए हैं, तो उसने अपनी पृथ्वी को शाप दिया।


    वह उस स्त्री के पास उस समय पहुँचा, जब वह अपने पति के लिए अपने को तैयार कर रही थी।


    वह उसका अधिपति था, यद्यपि वह उस रहस्य को नहीं जानता था जो पवित्र आदेश के द्वारा घटित हुआ था। वे उस पर दोष लगाने से डरते थे। उसने अपने भीतर का अज्ञान अपने स्वर्गदूतों के सामने प्रकट किया; फिर उसने उन्हें स्वर्गोद्यान से निकाल दिया और घोर अंधकार से ढाँप दिया।


    प्रधान शासक ने उस कुँवारी को भी देखा जो आदम के पास खड़ी थी, और देखा कि जीवन का दीप्तिमान प्रतिबिंब उसके भीतर प्रकट हुआ था। याल्दाबाओथ अज्ञान से भर गया। जब समस्त की दैवी व्यवस्था ने यह देखा, तो उसने दूत भेजे, और उन्होंने शीघ्र ही हव्वा में से जीवन को निकाल लिया।


    तब प्रधान शासक ने उसे दूषित किया और उससे दो पुत्र उत्पन्न किए—पहला और दूसरा: एलोईम और यावे।


    एलोईम का मुख भालू जैसा है, पर यावे का मुख बिल्ली जैसा है।


    यावे न्यायी है, पर एलोईम अन्यायी है।


    यावे को आग और वायु पर नियुक्त किया गया, जबकि एलोईम को जल और पृथ्वी पर। पर छल करने के उद्देश्य से उसने उन्हें कैन और हाबिल नाम दिए।


    प्रधान शासक के कारण ही आज तक यौन-संबंध बना रहा है। उसी ने आदम की स्त्री के भीतर यौन-लालसा रोपी। यौन-संबंध के द्वारा उसने देहों की प्रतिकृतियाँ बनाईं और उनमें अपनी मिथ्या आत्मा फूँक दी।


    उसने उन दोनों शासकों को कई अधिपत्य-क्षेत्रों पर नियुक्त किया, ताकि वे कब्र पर शासन करें।


    पर जब आदम को अपने ही पूर्वज्ञान के प्रतिरूप का बोध हुआ, तो उसने मनुष्य-पुत्र का प्रतिरूप उत्पन्न किया, जिसका नाम उसने सेत रखा—उस रीति के अनुरूप जिस रीति से वह वंश एऑनों के बीच विद्यमान है।[a]


    इसी प्रकार माता ने भी अपनी आत्मा नीचे भेजी, जो उसी की समानता में है, और उसके साथ उस जन का एक प्रतिरूप भी भेजा जो परिपूर्णता में वास करता है; क्योंकि वह नीचे उतरनेवाले एऑनों के लिए निवास-स्थान तैयार करेगी।[b]


