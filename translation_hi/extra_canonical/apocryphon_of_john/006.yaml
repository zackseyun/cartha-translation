  revised_text: '### यूहन्ना का गुप्त ग्रंथ — मसीह का अभिषेक


    1. उसने उस शुद्ध ज्योति और उसकी चिनगारी के साथ, जो अदृश्य आत्मा को घेरे हुए है, बारबेलो की ओर भी दृष्टि की; और उसने उससे गर्भ धारण किया।[a]


    2. उसने धन्यता के समान एक ज्योति के द्वारा ज्योति की एक चिनगारी उत्पन्न की; पर वह दूसरी ज्योति उसकी महानता के बराबर नहीं है।


    3. ऐसा माता-पिता का एकलौता था, जो प्रकट हुआ था; वह उसकी एकमात्र संतान, पिता का एकलौता, शुद्ध ज्योति था।


    4. अदृश्य, कुँआरे आत्मा ने भी उस ज्योति के कारण आनन्द मनाया, जो अस्तित्व में आई थी और उसके पूर्वविचार की प्रथम सामर्थ्य—अर्थात् बारबेलो—से प्रकट हुई थी।


    5. उसने अपने अभिषेक से उसका अभिषेक किया, जब तक कि वह सिद्ध न हो गया। उसमें अभिषेक की कोई कमी न रही, क्योंकि उसने अदृश्य आत्मा के अभिषेक से उसका अभिषेक किया था। जब वह उस पर अभिषेक उँडेल रहा था, तब वह उसके पास उपस्थित रहा; और जैसे ही उसने आत्मा से प्राप्त किया, उसने पवित्र आत्मा और सिद्ध पूर्वविचार की स्तुति की, जिसके कारण वह प्रकट हुआ था।


    6. उसने यह विनती भी की कि उसे एक सहकर्मी दिया जाए—अर्थात् मन—और वह सहर्ष सहमत हो गया।


    7. जब अदृश्य आत्मा सहमत हो गया, तब मन निकट आया। वह मसीह—अर्थात् अभिषिक्त जन[b]—के पास उपस्थित रहा और मसीह तथा बारबेलो की स्तुति करता रहा। ये सभी मौन के भीतर निवास करने लगे।


    8. मन ने यह भी चाहा कि अदृश्य आत्मा के वचन[c] के द्वारा कुछ रचे। उसकी इच्छा साकार हुई और मन तथा ज्योति के साथ निकट आकर उसकी स्तुति करने लगी।


    9. वचन इच्छा के पीछे चला, क्योंकि वचन के द्वारा स्वयं-उत्पन्न परमेश्वर मसीह ने सब कुछ रचा।'
