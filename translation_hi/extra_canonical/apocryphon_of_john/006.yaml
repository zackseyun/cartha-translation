  text: 'He also peered into Barbelo with the pure light that surrounds the unseen Spirit, and his spark, and from him she conceived.


    He begot a light-spark by means of a light similar to blessedness, but (the latter) is not equal to his greatness.


    Such was an only-begotten one of the Mother-Father who had issued forth, he being his only offspring, the only-begotten one of the Father, the pure light.


    The unseen, virginal Spirit also rejoiced because of the light who had come into being, who had issued forth from the first power of his Providence—which is Barbelo—


    and he anointed him with his anointing until he became perfect, lacking nothing of the anointing because he had anointed him with the anointing of the unseen Spirit, and he attended him as he poured onto him, and as soon as he had received of the Spirit, he extolled the holy Spirit and the perfect Providence on whose account he had issued forth.


    He also entreated to give him a companion laborer, which is Mind, and he agreed gladly.


    And when the unseen Spirit had agreed, «7» Mind approached, and he attended Christ (the anointed), extolling him and Barbelo, and all of these came to dwell inside silence.


    Mind also willed to make something by means of the Logos of the unseen Spirit, and his (potential) will became actual, and approached with Mind and Light extolling him.


    And the Logos followed Will, because by means of the Logos, Christ, the self-generated God, created the All.'
translation:
  language: hi
  text: '### यूहन्ना का गुप्त ग्रंथ — मसीह का अभिषेक


    1. उसने उस शुद्ध ज्योति और उसकी चिनगारी के साथ, जो अदृश्य आत्मा को घेरे हुए है, बारबेलो की ओर भी दृष्टि की; और उससे उसने गर्भ धारण किया।[a]


    2. उसने धन्यता के समान एक ज्योति के द्वारा ज्योति की एक चिनगारी उत्पन्न की; पर वह दूसरी ज्योति उसकी महानता के बराबर नहीं है।


    3. इस प्रकार माता-पिता से एक एकलौता प्रकट हुआ। वह उसकी एकमात्र संतान, पिता का एकलौता और शुद्ध ज्योति था।


    4. अदृश्य, कुँवारे आत्मा ने भी उस ज्योति के कारण आनन्द मनाया, जो अस्तित्व में आई थी और उसके पूर्वविचार की प्रथम सामर्थ्य—अर्थात् बारबेलो—से प्रकट हुई थी।


    5. उसने अपने अभिषेक से उसका अभिषेक किया, जब तक कि वह सिद्ध न हो गया। उसमें अभिषेक की कोई कमी न रही, क्योंकि उसने अदृश्य आत्मा के अभिषेक से उसका अभिषेक किया था। जब वह उस पर अभिषेक उँडेल रहा था, तब वह उसके साथ रहा; और जैसे ही उसने आत्मा में से पाया, उसने पवित्र आत्मा और सिद्ध पूर्वविचार की स्तुति की, जिसके कारण वह प्रकट हुआ था।


    6. उसने यह विनती भी की कि उसे एक सहकर्मी दिया जाए—अर्थात् मन—और वह सहर्ष सहमत हो गया।


    7. जब अदृश्य आत्मा सहमत हो गया, तब मन निकट आया। वह मसीह—अर्थात् अभिषिक्त जन[b]—के साथ रहा और उसकी तथा बारबेलो की स्तुति करता रहा। ये सभी मौन के भीतर निवास करने लगे।


    8. मन ने यह भी चाहा कि अदृश्य आत्मा के वचन के द्वारा कुछ बनाए। उसकी इच्छा साकार हुई और मन तथा ज्योति के साथ निकट आकर उसकी स्तुति करने लगी।


    9. वचन[c] इच्छा के पीछे चला, क्योंकि वचन के द्वारा स्वयं-उत्पन्न परमेश्वर मसीह ने सब कुछ रचा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य में ‘उसने’, ‘उसकी’ और ‘उससे’ के संदर्भ उपलब्ध अनुवाद-साक्ष्य में पूरी तरह स्पष्ट नहीं हैं; अनुवाद ने इस अस्पष्टता को जानबूझकर नहीं मिटाया है।
    reason: पहले वाक्य की सर्वनाम-संबंधी वास्तविक अनिश्चितता पाठक के सामने रखना।
  - marker: b
    text: ‘मसीह’ का अर्थ ‘अभिषिक्त जन’ है।
    reason: स्रोत में Christ के साथ दी गई व्याख्या को स्पष्ट रखना।
  - marker: c
    text: यहाँ ‘वचन’ उस पद का अनुवाद है जिसे यूनानी रूप में Logos कहा जाता है; इसका अर्थ ‘वचन’, ‘विवेकपूर्ण कथन’ या ‘सृजनकारी अभिव्यक्ति’ हो सकता है।
    reason: बहुअर्थी तकनीकी पद को किसी एक संकीर्ण अर्थ तक सीमित होने से बचाना।
lexical_decisions:
- source_word: Barbelo
  choice: बारबेलो
  rationale: इस विशिष्ट ज्ञानवादी नाम को अर्थानुवाद करने के बजाय ध्वन्यात्मक रूप में रखा गया है।
- source_word: Providence
  choice: पूर्वविचार
  rationale: यहाँ यह बारबेलो के लिए प्रयुक्त एक विशिष्ट सत्ता-सूचक पद है; ‘विधान’ कहने से बाद की धर्मवैज्ञानिक धारणाएँ आ सकती थीं।
- source_word: Mind
  choice: मन
  rationale: अमूर्त किंतु व्यक्तिरूप सत्ता का सरल हिन्दी प्रतिरूप; जहाँ यह नामवत प्रयुक्त है वहाँ आरंभिक अक्षर से भेद हिन्दी में संभव नहीं, इसलिए प्रसंग संरक्षित रखा गया है।
- source_word: Logos
  choice: वचन
  rationale: रचनात्मक, व्यक्तिरूप Logos के लिए परिचित और अर्थपूर्ण हिन्दी पद; फुटनोट में यूनानी पद की व्यापकता स्पष्ट की गई है।
- source_word: self-generated
  choice: स्वयं-उत्पन्न
  rationale: स्रोत के आत्मोत्पत्ति-संबंधी दावे को किसी अधिक परंपरागत धर्मवैज्ञानिक उपाधि में बदले बिना सीधे रखा गया है।
- source_word: Mother-Father
  choice: माता-पिता
  rationale: संयुक्त मातृ-पितृ अभिव्यक्ति को बनाए रखा गया है; इसे केवल पिता या माता बनाकर तनाव हल नहीं किया गया।
- source_word: the All
  choice: सब कुछ
  rationale: सहज आधुनिक हिन्दी में ब्रह्मांडीय समग्रता व्यक्त होती है, बिना ‘सृष्टि’ शब्द जोड़कर वस्तु और क्रिया का संबंध पहले से निर्धारित किए।
theological_decisions:
- issue: मसीह और अभिषिक्त की पहचान
  choice: ‘मसीह—अर्थात् अभिषिक्त जन’
  alternative: केवल ‘मसीह’ या केवल ‘अभिषिक्त’
  rationale: पाठ स्वयं Christ को ‘the anointed’ कहकर स्पष्ट करता है; दोनों रूप रखने से नाम और अर्थ दोनों बचते हैं।
- issue: अभिषेक के द्वारा सिद्ध होना
  choice: स्रोत के क्रम और पुनरुक्ति को बनाए रखा
  alternative: इसे संक्षिप्त करके ‘आत्मा ने उसे पूर्णतः अभिषिक्त किया’ कहना
  rationale: अभिषेक, सिद्धता और आत्मा के बीच पाठ की विशिष्ट धर्मवैज्ञानिक कड़ी को किसी प्रचलित मसीही सूत्र के अनुसार सरल नहीं किया गया।
- issue: व्यक्तिरूप अमूर्त सत्ताएँ
  choice: मन, इच्छा, वचन और ज्योति को प्रसंगानुसार व्यक्तिरूप रहने दिया
  alternative: उन्हें केवल मानसिक गुणों या क्रियाओं के रूप में समझाना
  rationale: पाठ में ये सत्ताएँ निकट आती, अनुसरण करती और स्तुति करती हैं; इस तनाव को बरकरार रखा गया है।
- issue: लिंग और सर्वनाम
  choice: उपलब्ध साक्षी के पुल्लिंग/स्त्रीलिंग संकेतों का यथासंभव अनुसरण
  alternative: हर सर्वनाम के स्थान पर अनुमानित नाम भरना
  rationale: नाम भरने से अस्पष्ट कर्ताओं की पहचान अनावश्यक रूप से निश्चित हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्रोत-सामग्री में प्रत्यक्ष कॉप्टिक पाठ उपलब्ध नहीं था; यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है और कॉप्टिक स्रोत-पुनरीक्षण लंबित है। अनुच्छेद 7 में आया नंगा पृष्ठ-संकेत «7» मुख्य पाठ का भाग न मानकर हटाया गया है। स्रोत की जानबूझकर दोहराई गई ‘अभिषेक’ शब्दावली और अमूर्त सत्ताओं के व्यक्तिरूप व्यवहार को शैलीगत असहजता के बावजूद संरक्षित रखा गया है।
