  source_fidelity: मसौदा अंग्रेज़ी साक्ष्य के मूल क्रम, पुनरुक्तियों और व्यक्तिरूप अमूर्त सत्ताओं को अधिकांशतः बनाए रखता है। फिर भी पद 1 में गर्भधारण करने वाली सत्ता का सर्वनामिक संबंध हिन्दी में उलट जाता है; पद 3 में ‘प्रकट हुआ’ माता-पिता के बजाय एकलौते के साथ व्याकरणतः जोड़ा जाना चाहिए; और पद 5 तथा 7 में ‘attended’ का ‘साथ रहा’ अनुवाद अपेक्षाकृत कमजोर है। प्रत्यक्ष कॉप्टिक पाठ उपलब्ध न होने से यह समीक्षा प्रदत्त अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य तक सीमित है।
