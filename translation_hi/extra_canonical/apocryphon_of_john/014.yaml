  text: 'However, all the angels and demons labored until they had formed the psychic body. Their creation was entirely inert and without movement for a prolonged time.


    When, however, the mother wished to regain the power she had granted to the chief archon, she entreated the Most Merciful Mother-Father of the All.


    With the sacred decree, he dispatched the five lights down onto the place of the angels of the chief archon, and they counseled him that they should bring forth the power of the mother, and they said to Yaltabaoth, “Blow of your Spirit into his face, and his body will stand up.” And he blew into his face his Spirit, which is the power of his mother.


    He was unaware, because he exists in ignorance, and the power of the mother went forth from Yaltabaoth into the psychic body they had formed according to the image of he who is from the beginning.


    The body moved and attained strength, and it was radiant, and at that time the rest of «20» the powers grew envious, because he had come into existence through all of them, and they had bestowed their power on the man, and his intellect surpassed (that of) those who had made him, and the chief archon.


    When, however, they saw that he was radiant, and that he could reason better than they, and that he was unburdened by evil, they took him up and thrust him down into the nethermost region of all matter.


    However, the Blessed One, the Mother-Father, the beneficent and merciful one, showed mercy to the power of the mother which had been brought forth from the chief ruler, because they might acquire power over the psychic and sensory body, and through his beneficent Spirit and his great mercy he dispatched to Adam a helper, Radiant Reflection who emerges out of him, who is called “{Life:1}.”


    She, however, helps the entire creation by laboring together with him, and by restoring to him his perfection, and by instructing him concerning the descent of his seed, and by instructing him concerning the way of ascent, the way by which it descended.


    Further, Reflection of Light was concealed inside Adam, so that the archons would be unknowing, but that Reflection would be a rectification of the deficiency of the mother, and the man became visible on account of the light-shadow inside him, and his intellect surpassed (that of) all those who had made him.'
translation:
  language: hi
  text: 'फिर भी, सभी स्वर्गदूत और दुष्टात्माएँ तब तक परिश्रम करती रहीं, जब तक उन्होंने प्राणमय शरीर[a] को गढ़ नहीं लिया। उनकी रचना बहुत समय तक पूरी तरह निष्क्रिय और गतिहीन पड़ी रही।


    पर जब माता ने उस शक्ति को वापस पाना चाहा जो उसने प्रधान शासक[b] को दी थी, तो उसने समस्त जगत के परम दयालु माता-पिता से विनती की।


    पवित्र आदेश के द्वारा उन्होंने पाँच ज्योतियों को प्रधान शासक के स्वर्गदूतों के स्थान पर नीचे भेजा। उन्होंने उसे यह परामर्श दिया कि वे माता की शक्ति को बाहर निकालें। उन्होंने यालताबाओथ से कहा, “अपनी आत्मा में से उसके मुख पर फूँक मार, तब उसका शरीर उठ खड़ा होगा।” तब उसने उसके मुख पर अपनी आत्मा फूँकी—वही उसकी माता की शक्ति थी।


    उसे इसका भान नहीं था, क्योंकि वह अज्ञान में रहता है। इस प्रकार माता की शक्ति यालताबाओथ से निकलकर उस प्राणमय शरीर में चली गई, जिसे उन्होंने उस आदि से विद्यमान जन की प्रतिमा के अनुसार गढ़ा था।


    शरीर हिलने लगा, उसमें बल आ गया और वह प्रकाशमान हो उठा। तब बाकी शक्तियाँ ईर्ष्या करने लगीं, क्योंकि वह उन सबके द्वारा अस्तित्व में आया था और उन्होंने अपनी शक्ति उस मनुष्य को दे दी थी। उसकी बुद्धि उसे बनाने वालों की बुद्धि से, और प्रधान शासक की बुद्धि से भी, बढ़कर थी।


    पर जब उन्होंने देखा कि वह प्रकाशमान है, उनसे अधिक अच्छी तरह विचार कर सकता है और बुराई के बोझ से मुक्त है, तो उन्होंने उसे उठाकर समस्त पदार्थ के सबसे निचले प्रदेश में धकेल दिया।


    लेकिन धन्य, उपकारी और दयालु माता-पिता ने माता की उस शक्ति पर दया की जो प्रधान शासक से बाहर निकाली गई थी, क्योंकि शासक प्राणमय और इंद्रियग्राह्य शरीर[c] पर अधिकार पा सकते थे। इसलिए उन्होंने अपनी उपकारी आत्मा और महान दया के द्वारा आदम के पास एक सहायक भेजी—प्रकाशमान चिंतन[d], जो उन्हीं में से निकलती है और “जीवन” कहलाती है।


    वह उसके साथ मिलकर परिश्रम करते हुए सारी सृष्टि की सहायता करती है। वह उसे फिर से उसकी पूर्णता तक पहुँचाती है, उसे उसके वंश के नीचे उतरने के विषय में सिखाती है, और ऊपर चढ़ने का वह मार्ग बताती है जिससे होकर वह नीचे उतरा था।[e]


    फिर प्रकाश का चिंतन आदम के भीतर छिपा दिया गया, ताकि शासक उससे अनजान रहें और वह चिंतन माता की न्यूनता को सुधार दे। उसके भीतर की प्रकाशमय छाया[f] के कारण मनुष्य प्रकट हुआ, और उसकी बुद्धि उसे बनाने वाले सभी जनों की बुद्धि से बढ़कर थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्राणमय शरीर” उस शरीर के लिए प्रयुक्त तकनीकी पद है जो केवल भौतिक शरीर से अलग है, पर अभी पूर्ण आध्यात्मिक अवस्था में नहीं पहुँचा।
    reason: ‘psychic’ का आधुनिक ‘मानसिक’ अर्थ भ्रामक हो सकता है।
  - marker: b
    text: “शासक” यूनानी मूल के पद “आर्खोन” का अर्थ है; इस ग्रंथ में यह जगत पर शासन करने वाली निम्नतर शक्तियों के लिए प्रयुक्त होता है।
    reason: ग्रंथ-विशिष्ट पदावली स्पष्ट करना।
  - marker: c
    text: “इंद्रियग्राह्य शरीर” का अर्थ ऐसा शरीर भी हो सकता है जो इंद्रियों से अनुभव करता है, या ऐसा शरीर जो इंद्रियों से दिखाई-पड़ता है।
    reason: sensory body की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखना।
  - marker: d
    text: “चिंतन” के पीछे का पद “प्रतिबिंब,” “पूर्वचिंतन” या व्यक्तिरूप दिव्य विचार का भाव भी दे सकता है। यहाँ इसे एक स्त्रीलिंग सहायक सत्ता के रूप में प्रस्तुत किया गया है।
    reason: Reflection की तकनीकी और व्यक्तिसूचक प्रकृति बताना।
  - marker: e
    text: “जिससे होकर वह नीचे उतरा था” में “वह” आदम, उसके वंश, या उसमें स्थित शक्ति की ओर संकेत कर सकता है; उपलब्ध गवाह इसे निश्चित नहीं करता।
    reason: सर्वनाम-संदर्भ की स्रोतगत अस्पष्टता बनाए रखना।
  - marker: f
    text: “प्रकाशमय छाया” पाठ का विरोधाभासी संयुक्त बिंब है; इसे केवल “प्रकाश” या केवल “छाया” बनाकर सरल नहीं किया गया है।
    reason: मूल धार्मिक-प्रतीकात्मक तनाव सुरक्षित रखना।
lexical_decisions:
- source_word: psychic body
  choice: प्राणमय शरीर
  rationale: यहाँ ‘psychic’ आधुनिक मनोवैज्ञानिक अर्थ में नहीं, बल्कि प्राण/आत्मा से संबद्ध शरीर की तकनीकी श्रेणी है। ‘प्राणमय’ सहज भी है और पाठ की विशिष्ट मानव-विज्ञान संबंधी धारणा को सपाट नहीं करता।
- source_word: chief archon
  choice: प्रधान शासक
  rationale: ‘archon’ का मूल अर्थ शासक है। देवनागरी लिप्यंतरण की अपेक्षा अर्थपूर्ण पद चुना गया और तकनीकी पहचान के लिए पादटिप्पणी दी गई।
- source_word: Mother-Father of the All
  choice: समस्त जगत के परम दयालु माता-पिता
  rationale: युग्मित मातृ-पितृ उपाधि को बनाए रखा गया; इसे केवल ‘पिता’ या केवल ‘माता’ करके इसकी धार्मिक तनावपूर्ण भाषा को नहीं मिटाया गया।
- source_word: five lights
  choice: पाँच ज्योतियाँ
  rationale: ‘ज्योतियाँ’ व्यक्तिसदृश दिव्य सत्ताओं और प्रकाश—दोनों अर्थों को खुला रखती है।
- source_word: Radiant Reflection / Reflection of Light
  choice: प्रकाशमान चिंतन / प्रकाश का चिंतन
  rationale: ‘Reflection’ संभवतः चिंतन, पूर्वविचार या प्रतिरूप की तकनीकी धारणा लिए है। ‘चिंतन’ स्त्रीलिंग सहायक सत्ता के रूप में आगे आने वाले सर्वनाम-संदर्भ के साथ अर्थपूर्ण है, पर अनिश्चितता पादटिप्पणी में दर्ज है।
- source_word: Life
  choice: जीवन
  rationale: मूल नाम/उपाधि का सीधा अर्थ दिया गया और गवाह का संपादकीय संकेत {Life:1} प्रकाशन-पाठ में नहीं रखा गया।
- source_word: light-shadow
  choice: प्रकाशमय छाया
  rationale: विरोधाभासी संयुक्त बिंब को समझाकर समाप्त करने के बजाय सुरक्षित रखा गया।
theological_decisions:
- issue: आदम में फूँकी गई आत्मा की पहचान
  choice: ‘अपनी आत्मा’ और ‘वही उसकी माता की शक्ति थी’ दोनों कथनों को साथ रखा
  alternative: इसे सीधे परमेश्वर की जीवनदायी श्वास के रूप में समतल करना
  rationale: पाठ का कथानक यालताबाओथ की अज्ञानता और उसके भीतर से माता की शक्ति निकलने पर निर्भर है; इस तनाव को बनाए रखना आवश्यक है।
- issue: माता-पिता के लिए सर्वनाम
  choice: सम्मानसूचक बहुवचन ‘उन्होंने’
  alternative: एकवचन पुल्लिंग ‘उसने’
  rationale: हिन्दी में संयुक्त ‘माता-पिता’ के साथ स्वाभाविक व्याकरण अपनाते हुए उभयलिंगी उपाधि को सुरक्षित रखा गया। यह सत्ताओं की संख्या पर दार्शनिक निर्णय नहीं है।
- issue: प्रकाशमान चिंतन का स्त्री रूप
  choice: ‘सहायक भेजी’ और ‘वह ... करती है’
  alternative: लिंग-निरपेक्ष या पुल्लिंग रूप
  rationale: अंग्रेज़ी गवाह में इस सत्ता के लिए स्त्रीलिंग सर्वनाम है और इसका संबंध माता की शक्ति से है; इसलिए हिन्दी में स्त्रीलिंग संकेत बनाए रखा गया।
- issue: वंश के अवतरण और आरोहण का कर्ता
  choice: अंतिम ‘वह’ की संदर्भगत अस्पष्टता बनाए रखी
  alternative: स्पष्ट रूप से ‘उसका वंश’ जोड़कर कर्ता निश्चित करना
  rationale: गवाह का वाक्य ascent और descent के कर्ता को पूरी तरह स्पष्ट नहीं करता; पादटिप्पणी में दोनों संभावनाएँ बताई गई हैं।
- issue: माता की deficiency
  choice: ‘माता की न्यूनता’
  alternative: ‘माता की भूल’ या ‘पाप’
  rationale: पाठ ontological कमी/अपूर्णता कहता है; नैतिक दोष या पाप का अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु पठनीय गद्य रखा गया है। ‘आर्खोन’ जैसे अपरिचित लिप्यंतरण को मुख्य पाठ में न रखकर ‘शासक’ कहा गया है और पादटिप्पणी में तकनीकी पृष्ठभूमि दी गई है। यह मसौदा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी गवाह पर आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन पदों और सर्वनामों पर सावधानीपूर्वक पादटिप्पणियाँ दी गई हैं।
