  revised_text: 'फिर भी, सभी स्वर्गदूत और दुष्टात्माएँ तब तक परिश्रम करते रहे, जब तक उन्होंने प्राणिक शरीर[a] को गढ़ नहीं लिया। उनकी रचना बहुत समय तक पूरी तरह निष्क्रिय और गतिहीन रही।


    पर जब माता ने उस शक्ति को फिर से प्राप्त करना चाहा जो उसने प्रधान शासक[b] को दी थी, तो उसने समस्त के परम दयालु माता-पिता से विनती की।


    पवित्र आदेश के साथ उन्होंने पाँच ज्योतियों को प्रधान शासक के स्वर्गदूतों के स्थान पर नीचे भेजा। उन्होंने उसे सलाह दी कि वे माता की शक्ति को प्रकट करें। उन्होंने यालताबाओथ से कहा, “अपनी आत्मा में से उसके मुख पर फूँक मार, और उसका शरीर उठ खड़ा होगा।” तब उसने उसके मुख पर अपनी आत्मा फूँकी, जो उसकी माता की शक्ति थी।


    वह इससे अनजान था, क्योंकि वह अज्ञान में रहता है; और माता की शक्ति यालताबाओथ से निकलकर उस प्राणिक शरीर में चली गई जिसे उन्होंने आदि से विद्यमान उस जन की छवि के अनुसार गढ़ा था।


