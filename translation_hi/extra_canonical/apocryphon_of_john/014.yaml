    पर जब उन्होंने देखा कि वह प्रकाशमान है, उनसे अधिक अच्छी तरह तर्क कर सकता है और बुराई के बोझ से मुक्त है, तो उन्होंने उसे उठाकर समस्त पदार्थ के सबसे निचले प्रदेश में धकेल दिया।


    लेकिन धन्य, उपकारी और दयालु माता-पिता ने माता की उस शक्ति पर दया की जो प्रधान शासक से प्रकट की गई थी, क्योंकि वे प्राणिक और इंद्रियग्राह्य शरीर[c] पर अधिकार पा सकते थे। अपनी उपकारी आत्मा और महान दया के द्वारा उन्होंने आदम के पास एक सहायक भेजी—दीप्तिमान प्रतिबिंब[d], जो उनसे निकलती है और “जीवन[1]” कहलाती है।


    वह उसके साथ मिलकर परिश्रम करते हुए सारी सृष्टि की सहायता करती है, उसे उसकी पूर्णता में फिर से स्थापित करती है, उसके वंश के नीचे उतरने के विषय में उसे सिखाती है, और ऊपर चढ़ने के उस मार्ग के विषय में सिखाती है जिससे होकर वह नीचे उतरा था।[e]


