translation:
  language: hi
  text: '**यूहन्ना का रहस्योद्घाटन — परम एकत्व**


    1. [मैंने भी] इसे [समझने के लिए पूछा; और उसने] मुझसे कहा, “मोनाड[a] [ऐसा एकत्व है, जिससे] ऊँचा कुछ भी नहीं।


    2. [वही है जो] [परमेश्वर] और समस्त के पिता के रूप में [विद्यमान है]—[अदृश्य] जन, जो [समस्त से ऊँचा है, जो] अविनाशिता और निर्मल ज्योति के रूप में [विद्यमान है], जिस पर कोई [आँख] दृष्टि नहीं डाल सकती।


    3. वह [अदृश्य] [आत्मा है]। उसके विषय में किसी देवता या वैसी ही किसी वस्तु के रूप में [सोचना] उचित नहीं, क्योंकि वह देवता से भी बढ़कर है। उससे ऊँचा कुछ भी नहीं है, और कोई उस पर शासन नहीं करता।


    4. [इसका कारण यह है कि वह] अपने अधीन किसी वस्तु के भीतर [विद्यमान] नहीं [है, क्योंकि सब कुछ] उसके भीतर विद्यमान है; वह स्वयं-[स्थापित] है।


    5. [वह अनन्त है], क्योंकि उसे [किसी वस्तु की] आवश्यकता नहीं; वह पूर्ण सिद्धता है।


    6. [उसमें किसी वस्तु की कमी न थी] कि उसके द्वारा सिद्ध किए जाने के लिए उसे [उसकी] आवश्यकता होती।


    7. [बल्कि], वह [ज्योति] में सदा सर्वथा सिद्ध है।


    8. वह [असीम है], क्योंकि उससे [पहले] कोई ऐसा नहीं है जो उसकी सीमा ठहरा सके।


    9. उसकी थाह नहीं पाई जा सकती, [क्योंकि] उससे पहले कोई ऐसा नहीं है जो [उसकी थाह पा सके]।


    10. [वह] माप से परे है, क्योंकि [उससे पहले कोई ऐसा विद्यमान नहीं था जो] उसे [माप सकता]।


    11. [वह अदृश्य है, क्योंकि किसी ने] उसे [नहीं] देखा।


    12. [वह अनन्त है], क्योंकि वह अनन्तकाल से [विद्यमान है]।


    13. वह [अवर्णनीय है, क्योंकि] कोई ऐसा विद्यमान नहीं था जो उसकी कल्पना करके [उसके विषय में] बोल सकता।


    14. उसका नाम नहीं रखा जा सकता, क्योंकि [उससे पहले कोई ऐसा विद्यमान नहीं था] जो उसका [नाम रख सकता]।


    15. वह [असीम ज्योति] है—निर्मल, पवित्र और [निष्कलंक]।


    16. वह अवर्णनीय है और [पूर्ण] अविनाशिता में [विद्यमान है]।


    17. (वह) सिद्धता के भीतर [सीमित नहीं] (है), न धन्यता के भीतर, न ईश्वरत्व के भीतर; बल्कि वह (इन सबसे) अत्यन्त ऊँचा है।


    18. वह न शरीरधारी है, [न] अशरीरी।


    19. वह न बड़ा है, [न] छोटा।


    20. [यह कहना असम्भव है] कि उसका कोई परिमाण है या [कोई गुण है], क्योंकि कोई उसे [समझ नहीं सकता]।


    21. वह [सत्ताओं] के बीच की कोई सत्ता नहीं है, [बल्कि वह] अत्यन्त ऊँचा है—[ऐसे नहीं] मानो वह दूसरों से अधिक ऊँचा हो, बल्कि (वह अपने आप में ऊँचा है)।


    22. वह न आयोनों[b] में [सहभागी होता है], न कालबद्धता में; क्योंकि जो किसी ऐसे [आयोन] में सहभागी होता है जिसे पहले स्थापित किया गया था [...]।


    23. उसे समय का माप [नहीं] नहीं दिया गया था,[c] [क्योंकि] वह किसी दूसरे से कुछ प्राप्त नहीं करता; [क्योंकि तब वह उसे] उधार के रूप में [प्राप्त करता]। जो किसी दूसरे से पहले विद्यमान है, उसे [किसी दूसरे से] कुछ ग्रहण करने की [आवश्यकता नहीं]।


    24. इसका कारण यह है कि वही अपनी ज्योति में [अपनी ओर] दृष्टि लगाए, प्रतीक्षा करता है, क्योंकि [...] महिमामय है।


    25. असीम निर्मलता उसी की है।


    26. वह ऐसा आयोन है जो आयोन प्रदान करता है।


    27. वह [जीवन] है जो जीवन प्रदान करता है।


    28. वह धन्य जन है जो धन्यता प्रदान करता है।


    29. वह ज्ञान है जो ज्ञान प्रदान करता है।


    30. [वह] भलाई है जो भलाई प्रदान करती है।


    31. [वह] दया और छुटकारा है, [जो दया प्रदान करते हैं]।


    32. वह अनुग्रह है जो अनुग्रह प्रदान करता है—


    33. [इसलिए नहीं] कि वह उसका है, बल्कि इसलिए कि वह ऐसी [ज्योति] प्रदान करता है जो माप और समझ से परे है।


    34. [मैं तुमसे] उसके विषय में [कैसे कह सकता हूँ], क्योंकि उसका [आयोन] विनाश से परे, विश्राम में और [मौन में स्थिर, शांत] है; वह [सब कुछ से पहले विद्यमान है, क्योंकि वही] [सभी] आयोनों का अगुआ है, [और] वही अपनी भलाई से उन्हें सामर्थ्य प्रदान करता है?”


    **पाठ-संबंधी टिप्पणियाँ**


    [a] **मोनाड**: परम और अविभाज्य एकत्व के लिए प्रयुक्त पारिभाषिक शब्द।


    [b] **आयोन**: यहाँ ऐसा पारिभाषिक शब्द जिसका अर्थ अनन्त युग, शाश्वत क्षेत्र अथवा उनसे जुड़ी सत्ता हो सकता है; सन्दर्भ इसकी पूरी अस्पष्टता को बनाए रखता है।


    [c] उपलब्ध पाठ में दोहरा निषेध है; उसे हिन्दी में भी जानबूझकर बनाए रखा गया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मोनाड: परम और अविभाज्य एकत्व के लिए प्रयुक्त पारिभाषिक शब्द।'
    reason: अपरिचित तकनीकी पद का संक्षिप्त परिचय।
  - marker: b
    text: 'आयोन: यहाँ ऐसा पारिभाषिक शब्द जिसका अर्थ अनन्त युग, शाश्वत क्षेत्र अथवा उनसे जुड़ी सत्ता हो सकता है; सन्दर्भ इसकी पूरी अस्पष्टता को बनाए रखता है।'
    reason: बहुअर्थी गूढ़ शब्द की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: उपलब्ध पाठ में दोहरा निषेध है; उसे हिन्दी में भी जानबूझकर बनाए रखा गया है।
    reason: पाठक को असामान्य वाक्यरचना को अनुवादकीय भूल समझने से रोकना।
lexical_decisions:
- source_word: monad
  choice: मोनाड
  rationale: यह गूढ़ दार्शनिक पारिभाषिक शब्द है। केवल ‘एकता’ कहने से इसकी विशिष्ट संकल्पना खो सकती थी; इसलिए लिप्यन्तरण रखा और टिप्पणी में अर्थ स्पष्ट किया।
- source_word: the All
  choice: समस्त
  rationale: सृष्टि की समग्रता अथवा समस्त अस्तित्व को सूचित करने वाला संज्ञात्मक प्रयोग बनाए रखने के लिए ‘समस्त’ चुना।
- source_word: indestructibility
  choice: अविनाशिता
  rationale: यह केवल दीर्घजीविता नहीं, विनाश की असम्भवता का अमूर्त गुण व्यक्त करता है।
- source_word: aeon
  choice: आयोन
  rationale: मूल परम्परा में यह युग, शाश्वत क्षेत्र या व्यक्त सत्ता की ओर संकेत कर सकता है। किसी एक अर्थ से अस्पष्टता मिटाने के बजाय लिप्यन्तरण और टिप्पणी दी गई।
- source_word: somatic / non-somatic
  choice: शरीरधारी / अशरीरी
  rationale: विरोधी जोड़ी को सहज आधुनिक हिन्दी में रखा, बिना यह तय किए कि कथन भौतिक देह, रूप या तत्त्वमीमांसीय श्रेणी में से किसको लक्ष्य करता है।
- source_word: temporality
  choice: कालबद्धता
  rationale: ‘समय’ की अपेक्षा यह समय के अधीन या समय द्वारा सीमित होने की अवस्था को अधिक ठीक व्यक्त करता है।
