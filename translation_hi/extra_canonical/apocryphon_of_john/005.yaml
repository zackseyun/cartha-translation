  yaml_path: translation/extra_canonical/apocryphon_of_john/005.yaml
  text: '1. She became the universal womb because she is the one who exists before all of them: the Mother-Father, the Primal Human, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, and the eternal aeon among the unseen ones, even the first one to come forth.


    2. ‹She› asked the unseen, virginal Spirit—that is, Barbelo—to grant her Precognition, and the Spirit agreed.


    3. When he had [agreed], Precognition approached and attended Providence, she who originates from the Idea of the unseen, virginal Spirit.


    4. She praised him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. She asked once more that he grant her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [approached] and attended Idea and Precognition.


    7. She praised the unseen one and Barbelo, the one on whose account they had come into being.


    8. Barbelo also asked that he grant her eternal life, and the unseen Spirit agreed. When he had agreed, Eternal Life approached,


    9. and they [attended] and praised the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. She asked once more that he grant her truth. And [he agreed], and [when he had] agreed,


    11. Truth approached, and they attended and praised the unseen, admirable Spirit and his Barbelo, on whose account they had come into being.


    12. This is the aeonic pentad of the Father, which is the Primal Human, the image of the unseen Spirit.


    13. This is Providence—that is, Barbelo—and Idea, Precognition, Indestructibility, Eternal Life, and Truth.


    14. This is the androgynous aeonic pentad, being the aeonic decad, which is the Father.'
translation:
  language: hi
  text: '1. वह सर्वव्यापी गर्भ बन गई, क्योंकि वही उन सब से पहले अस्तित्व में है—माता-पिता, आदि मानव, पवित्र आत्मा, त्रिपुरुष, त्रिशक्तिमान, त्रिनामधारी उभयलिंगी सत्ता, अदृश्य सत्ताओं के बीच शाश्वत युग-सत्ता, अर्थात सबसे पहले प्रकट होनेवाली।[a]


    2. ‹उसने› अदृश्य, कुँवारे आत्मा—अर्थात बारबेलो—से विनती की कि वह उसे पूर्वज्ञान प्रदान करे; और आत्मा सहमत हुआ।[b]


    3. जब वह [सहमत हो गया], तब पूर्वज्ञान निकट आया और प्रावधान के साथ उपस्थित हुआ—उसके साथ, जो अदृश्य, कुँवारे आत्मा के विचार से उत्पन्न होती है।


    4. उसने उसकी [और] उसकी सिद्ध शक्ति बारबेलो की स्तुति की, क्योंकि वे उसी के कारण अस्तित्व में आए थे।[c]


    5. उसने फिर विनती की कि वह उसे [अविनाशिता] प्रदान करे; और वह सहमत हुआ।


    6. जब वह [सहमत हो गया], तब अविनाशिता [निकट आई] और विचार तथा पूर्वज्ञान के साथ उपस्थित हुई।


    7. उसने अदृश्य सत्ता और बारबेलो की स्तुति की, जिसके कारण वे अस्तित्व में आए थे।


    8. बारबेलो ने यह भी विनती की कि वह उसे अनन्त जीवन प्रदान करे; और अदृश्य आत्मा सहमत हुआ। जब वह सहमत हो गया, तब अनन्त जीवन निकट आया,


    9. और वे [साथ उपस्थित हुए] और अदृश्य [आत्मा] तथा बारबेलो की स्तुति करने लगे, जिनके कारण वे अस्तित्व में आए थे।[d]


    10. उसने फिर विनती की कि वह उसे सत्य प्रदान करे। और [वह सहमत हुआ]; और [जब वह] सहमत हो गया,


    11. तब सत्य निकट आया; और वे साथ उपस्थित हुए और उस अदृश्य, अद्भुत आत्मा तथा उसकी बारबेलो की स्तुति करने लगे, जिनके कारण वे अस्तित्व में आए थे।


    12. यही पिता का युग-संबंधी पंचक है, जो आदि मानव, अर्थात अदृश्य आत्मा का प्रतिरूप है।[e]


    13. यही प्रावधान—अर्थात बारबेलो—और विचार, पूर्वज्ञान, अविनाशिता, अनन्त जीवन तथा सत्य हैं।[f]


    14. यही उभयलिंगी युग-संबंधी पंचक है, जो युग-संबंधी दशक है और जो पिता है।[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘युग-सत्ता’ उस तात्त्विक सत्ता के लिए है जिसे प्रायः यूनानी शब्द ‘ऐयोन’ से व्यक्त किया जाता है। ‘उभयलिंगी’ और स्त्री-पुरुष उपाधियाँ स्रोत की भाषा को सुरक्षित रखती हैं।
    reason: अपरिचित तकनीकी शब्द और लिंग-संबंधी तनाव स्पष्ट करना।
  - marker: b
    text: ‹उसने› कोणीय चिह्न पाठ में पुनर्स्थापित या अनिश्चित शब्द को दर्शाते हैं; वर्ग कोष्ठक क्षतिग्रस्त अथवा पूरित पाठ दर्शाते हैं। ‘बारबेलो’ और ‘अदृश्य आत्मा’ का संबंध इस अंश में पूरी तरह एकरूप नहीं है।
    reason: पाठालोचनात्मक चिह्नों और वास्तविक पहचान-संबंधी अस्पष्टता की सूचना देना।
  - marker: c
    text: ‘वे’ किन सत्ताओं की ओर संकेत करता है, यह पूरी तरह स्पष्ट नहीं है; अनुवाद ने संदर्भ को निश्चित नहीं किया।
    reason: अस्पष्ट सर्वनाम को ईमानदारी से चिह्नित करना।
  - marker: d
    text: ‘जिनके कारण’ का बहुवचन अदृश्य आत्मा और बारबेलो दोनों की ओर संकेत कर सकता है; निकटवर्ती एकवचन वाले कथनों के साथ इसका तनाव बना रहता है।
    reason: कारणता और संख्या की पाठगत भिन्नता सुरक्षित रखना।
  - marker: e
    text: वाक्य से यह पूरी तरह निश्चित नहीं कि ‘आदि मानव’ सीधे पिता है या पिता का यह पंचक; इसलिए पहचान को अधिक स्पष्ट करके नहीं लिखा गया।
    reason: धर्मशास्त्रीय और व्याकरणिक अस्पष्टता संरक्षित करना।
  - marker: f
    text: सूची में छह संज्ञाएँ दिखाई देती हैं, पर ‘प्रावधान—अर्थात बारबेलो’ दोनों को एक ही सत्ता के दो नाम बताता है; इसी आधार पर इसे पंचक कहा गया हो सकता है।
    reason: पंचक की गणना में दिखने वाली कठिनाई समझाना।
  - marker: g
    text: पाठ पंचक को दशक भी कहता है, सम्भवतः उसके उभयलिंगी स्वरूप के कारण; पर स्रोत यहाँ इसकी स्पष्ट गणना नहीं देता।
    reason: बिना निर्णायक व्याख्या थोपे संख्यात्मक तनाव बताना।
lexical_decisions:
- source_word: universal womb
  choice: सर्वव्यापी गर्भ
  rationale: ‘गर्भ’ मूल रूपक को बनाए रखता है; ‘सर्वव्यापी’ universal के व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: Mother-Father
  choice: माता-पिता
  rationale: संयुक्त स्त्री-पुरुष उपाधि को बिना किसी एक लिंग में सीमित किए संरक्षित किया गया है।
- source_word: Primal Man / Primal Human
  choice: आदि मानव
  rationale: मानवता-सूचक अर्थ और आद्य स्थिति दोनों सुरक्षित रहते हैं; ‘आदि पुरुष’ यहाँ अनावश्यक रूप से केवल पुरुष-लिंग का संकेत दे सकता था।
- source_word: triple-male / triple-powerful / triple-named
  choice: त्रिपुरुष / त्रिशक्तिमान / त्रिनामधारी
  rationale: त्रिगुणित उपाधियों की समानांतर, संक्षिप्त और गरिमामय शैली बनाए रखी गई है।
- source_word: androgynous one
  choice: उभयलिंगी सत्ता
  rationale: स्त्री और पुरुष दोनों के लक्षण रखने की धारणा स्पष्ट रहती है; ‘सत्ता’ व्यक्ति/तत्त्व की अस्पष्टता को खुला रखता है।
- source_word: aeon / aeonic
  choice: युग-सत्ता / युग-संबंधी
  rationale: जहाँ aeon एक अस्तित्वमान सत्ता है वहाँ ‘युग-सत्ता’, और विशेषण रूप में ‘युग-संबंधी’ रखा गया है; केवल ‘युग’ कहने से तात्त्विक व्यक्तित्व खो सकता था।
- source_word: Providence
  choice: प्रावधान
  rationale: व्यक्तिवाची अमूर्त सत्ता के रूप में निकट औपचारिक समतुल्य; ‘ईश्वरीय विधान’ जोड़ने से स्रोत से अधिक धर्मशास्त्रीय निर्धारण हो जाता।
- source_word: Idea
  choice: विचार
  rationale: अमूर्त, व्यक्तिकृत तत्त्व के लिए सामान्य और बोधगम्य हिन्दी शब्द।
- source_word: Precognition
  choice: पूर्वज्ञान
  rationale: घटना से पहले के ज्ञान का सीधा और प्रचलित दार्शनिक समतुल्य।
- source_word: Indestructibility
  choice: अविनाशिता
  rationale: अविनाशी होने की अमूर्त अवस्था को व्यक्त करता है और व्यक्तिकरण के अनुकूल है।
- source_word: attended
  choice: के साथ उपस्थित हुआ/हुई
  rationale: अस्पष्ट संबंध को ‘सेवा की’ या ‘अनुसरण किया’ कहकर अधिक निश्चित नहीं बनाया गया।
- source_word: virginal Spirit
  choice: कुँवारा आत्मा
  rationale: संदर्भ में आत्मा के लिए पुल्लिंग सर्वनाम आते हैं; ‘कुँवारा’ virginal की लैंगिक विशेषता को बनाए रखता है, यद्यपि हिन्दी में यह असामान्य धार्मिक उपाधि है।
theological_decisions:
- issue: बारबेलो और अदृश्य आत्मा के बीच पहचान तथा भेद
  choice: पद 2 की ‘अर्थात बारबेलो’ पहचान को ज्यों का त्यों रखा, जबकि बाद के पदों में दोनों को अलग-अलग उल्लिखित किया
  alternative: हर स्थान पर बारबेलो को अदृश्य आत्मा का पूर्ण पर्याय मानकर वाक्य समतल करना
  rationale: 'साक्ष्य में वास्तविक तनाव है: एक ओर समानता-सूचक व्याख्या है, दूसरी ओर दोनों की अलग स्तुति होती है। अनुवाद इसे सुलझाने का प्रयास नहीं करता।'
- issue: स्त्री और पुरुष सर्वनामों का परिवर्तन
  choice: बारबेलो/पूर्ववर्ती स्त्री सत्ता के लिए स्त्रीलिंग और अदृश्य आत्मा के लिए पुल्लिंग रखा
  alternative: हिन्दी में सभी संदर्भों को लिंग-निरपेक्ष ढंग से पुनर्लिखना
  rationale: स्रोत-साक्ष्य का उभयलिंगी और लिंग-परिवर्ती चित्रण धर्मशास्त्रीय रूप से महत्त्वपूर्ण है।
- issue: पंचक में छह नामों की प्रत्यक्ष सूची
  choice: पद 13 की पूरी सूची बिना घटाए रखी
  alternative: बारबेलो और प्रावधान को एक ही सदस्य मानकर सूची को व्याख्यात्मक रूप से पाँच मदों में ढालना
  rationale: ‘प्रावधान—अर्थात बारबेलो’ संभवतः गणना समझाता है, पर पाठ की सतही छह-संज्ञात्मक संरचना को बदलना उचित नहीं।
- issue: पंचक का दशक होना
  choice: पद 14 में पंचक और दशक दोनों कथन संरक्षित किए
  alternative: उभयलिंगी जोड़ों की व्याख्या जोड़कर गणना स्पष्ट करना
  rationale: स्रोत स्पष्टीकरण नहीं देता; सम्भावित स्त्री-पुरुष द्विगुणन को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: पिता, आदि मानव और प्रतिरूप का संबंध
  choice: व्याकरणिक अस्पष्टता सहित निकट अनुवाद रखा
  alternative: ‘पिता ही आदि मानव है’ या ‘पंचक ही आदि मानव है’ को निर्णायक रूप से चुनना
  rationale: ‘which’ का पूर्वपद और पहचान-संबंध अंग्रेज़ी साक्ष्य में पूर्णतः निश्चित नहीं है; हिन्दी में इसे न्यूनतम व्याख्या के साथ रखा गया।
