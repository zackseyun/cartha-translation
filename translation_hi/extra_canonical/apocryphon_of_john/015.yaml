translation:
  language: hi
  text: '1. जब उन्होंने नीचे दृष्टि डाली, तो उन्होंने जान लिया कि उसकी बुद्धि उनकी अपनी बुद्धि से बढ़कर थी। तब उन्होंने शासकों के समूह और सभी स्वर्गदूतों के साथ मिलकर मंत्रणा की।


    2. उन्होंने आग, मिट्टी और पानी लिया, उन्हें चार अग्निमय पवनों के साथ मिलाया, सबको एक साथ गूँधा और बड़ा कोलाहल मचाया। फिर वे उसे मृत्यु की छाया में ले गए, ताकि वे उसे एक बार फिर मिट्टी, पानी, आग और पवन से गढ़ सकें—उससे जिसका उद्गम पदार्थ में है, अर्थात अंधकार का अज्ञान, वासना और उनका झूठा आत्मा।


    3. यह देह के साँचे की वह कब्र है, जिसे लुटेरों ने मनुष्य को पहनाने के लिए इस्तेमाल किया—विस्मृति की जंजीर; और वह नश्वर मनुष्य बन गया।


    4. यही वह पहला था जो नीचे उतरा, और यही पहला विभाजन था। पर प्रकाश-प्रतिबिंब, जो उसके भीतर वास करती थी, उसने उसकी बुद्धि को जगा दिया।


    5. फिर शासक उसे ले गए और स्वर्गोद्यान में रख दिया। उन्होंने उससे कहा, “खा,” जिसका अर्थ था, “आलस्य में रह”; क्योंकि उनका सुख निश्चय ही कड़वा है और उनका सौंदर्य भ्रष्ट है। उनका सुख छल है, उनके वृक्ष ईश्वर-विहीनता हैं, उनका फल ऐसा विष है जिसका कोई उपचार नहीं, और उनकी प्रतिज्ञा नश्वरता है।


    6. उन्होंने अपने जीवन के वृक्ष को स्वर्गोद्यान के बीच में रखा था। अब मैं तुम सबको उनके जीवन का रहस्य सिखाऊँगा—वह षड्यंत्र जो उन्होंने मिलकर रचा था और जो उनके आत्मा की समानता है।


    7. उसकी जड़ कड़वी है और उसकी शाखाएँ नश्वरता हैं; उसकी छाया घृणा है और उसके पत्तों में छल वास करता है। उसका फूल दुष्ट अभिषेक है, उसका फल नश्वरता है, वासना उसका बीज है, और वह अंधकार में अंकुरित होता है।


    8. जो उसका स्वाद चखते हैं, उनका निवास अधोलोक है और अंधकार उनका विश्राम-स्थान है।


    9. किंतु जिससे वह ऊपर अपनी पूर्णता की ओर न देख सके और न अपने नंगेपन की लज्जा को समझ सके, वे उसके सामने बने रहे जिसे वे ‘भले और बुरे के ज्ञान का वृक्ष’ कहते हैं—अर्थात प्रकाश-प्रतिबिंब। पर मैंने ही उन्हें खाने के लिए प्रेरित किया।”[a]


    10. मैंने उद्धारकर्ता से यह भी पूछा, “प्रभु, क्या साँप ने आदम को खाने की सीख नहीं दी थी?”


    11. उद्धारकर्ता मुसकराया और बोला, “साँप ने उन्हें यौन-वासना की बुराई और विनाश में से खाने की सीख दी, ताकि वह उसका लाभ उठा सके।[b]


    12. फिर उसे मालूम था कि आदम उसकी आज्ञा नहीं मान रहा था, क्योंकि प्रकाश-प्रतिबिंब उसके भीतर वास करती थी और उसके कारण उसकी बुद्धि प्रधान शासक की बुद्धि से अधिक यथार्थ थी। इसलिए उसने उस शक्ति को निकाल लेने की इच्छा की जिसे उसने स्वयं आदम को दिया था, और उसने आदम पर एक ‘मूर्छा’ छा जाने दी।”[c]


    13. मैंने उद्धारकर्ता से फिर पूछा, “यह ‘मूर्छा’ क्या है?”


    14. उसने कहा, “यह वह नहीं है जो मूसा ने लिखा, न वह जो तुमने सुना है। उसने अपनी पहली पुस्तक में कहा, ‘उसने उसे सुला दिया’; पर वास्तव में उसने उसकी चेतना को सुला दिया। क्योंकि उसने नबी के द्वारा कहा था, ‘मैं उनके हृदयों को भारी कर दूँगा, ताकि वे ध्यान न दें और न देखें।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 9 का मूल वाक्य अत्यंत कठिन है। ‘वे उसके सामने बने रहे’ और ‘अर्थात प्रकाश-प्रतिबिंब’ का परस्पर संबंध निश्चित नहीं है; कुछ पाठ-समझों में प्रकाश-प्रतिबिंब स्वयं वृक्ष से संबद्ध हो सकती है।
    reason: वाक्यविन्यास और सत्ता-संबंध की वास्तविक अस्पष्टता बताने के लिए।
  - marker: b
    text: ‘उसका लाभ उठा सके’ का सर्वनाम आदम की ओर संकेत करता जान पड़ता है, पर उपलब्ध साक्ष्य में सर्वनाम-संबंध पूरी तरह स्पष्ट नहीं है।
    reason: मूल साक्ष्य में लिंग और वचन के असामंजस्य को दर्ज करने के लिए।
  - marker: c
    text: पद 12 में कई सर्वनाम अस्पष्ट हैं। यहाँ अर्थ-संदर्भ के अनुसार प्रधान शासक को शक्ति वापस निकालने वाला और आदम को अवज्ञाकारी समझा गया है।
    reason: अनुवाद में आवश्यक स्पष्टता लाते हुए वैकल्पिक सर्वनाम-संबंध की संभावना सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: archons
  choice: शासक
  rationale: इस ज्ञानवादी संदर्भ में सत्ता चलाने वाली ब्रह्मांडीय शक्तियों के लिए सहज हिन्दी शब्द; पहली बार बहुवचन संदर्भ से अर्थ स्पष्ट है।
- source_word: intellect
  choice: बुद्धि
  rationale: मानसिक और आध्यात्मिक बोध दोनों को समेटने वाला स्वाभाविक आधुनिक हिन्दी पद।
- source_word: Reflection of Light
  choice: प्रकाश-प्रतिबिंब
  rationale: व्यक्तिरूप स्त्री सत्ता और मूल रूपक दोनों को बनाए रखने के लिए यौगिक रूप चुना गया।
- source_word: matter
  choice: पदार्थ
  rationale: ज्ञानवादी ब्रह्मांड-विज्ञान के भौतिक तत्त्व के लिए मानक दार्शनिक हिन्दी।
- source_word: Hades
  choice: अधोलोक
  rationale: किसी उत्तरकालीन नरक-सिद्धांत को आरोपित किए बिना मृतकों के लोक का व्यापक अर्थ देता है।
- source_word: trance
  choice: मूर्छा
  rationale: साधारण नींद से भिन्न चेतना-दमन की अवस्था बताता है, जबकि अगले वाक्य की व्याख्या के लिए स्थान छोड़ता है।
- source_word: spirit
  choice: आत्मा
  rationale: हिन्दी धार्मिक गद्य में प्रचलित; पाठ में झूठी और शासकों की आत्मिक सत्ता के असामान्य प्रयोग को जस का तस रखता है।
theological_decisions:
- issue: ज्ञान के वृक्ष, प्रकाश-प्रतिबिंब और वक्ता के संबंध का अस्पष्ट वाक्य
  choice: वाक्य की असामान्य पहचान और वक्ता के दावे को यथासंभव अक्षुण्ण रखा
  alternative: प्रकाश-प्रतिबिंब को वृक्ष के सामने खड़ी अलग सत्ता मानकर वाक्य को स्पष्ट करना
  rationale: साक्ष्य में वाक्यविन्यास कठिन और अर्थ संदिग्ध है; अनुवाद में किसी एक व्याख्या को निर्णायक नहीं बनाया गया।
- issue: साँप की भूमिका
  choice: पाठ के अनुसार साँप को यौन-वासना और विनाश की ओर शिक्षा देने वाला बताया
  alternative: साँप को ज्ञान देने वाला मुक्तिदाता मानना
  rationale: इस अंश का कथन मिश्रित तनाव रखता है; व्यापक ज्ञानवादी धारणाओं के आधार पर इसे बदला नहीं गया।
- issue: पद 12 के अस्पष्ट सर्वनाम
  choice: पहले संदर्भ में आदम और बाद में प्रधान शासक को अर्थ-संकेत के आधार पर व्यक्त किया
  alternative: हर स्थान पर केवल ‘वह/उसे’ रखकर पूर्ण व्याकरणिक अस्पष्टता बनाए रखना
  rationale: हिन्दी में पूर्ण सर्वनाम-अस्पष्टता वाक्य को लगभग अगम्य बनाती; फिर भी कर्ता-संबंध की पाठगत अनिश्चितता फुटनोट में दर्ज की गई।
- issue: आदम की नींद की पुनर्व्याख्या
  choice: शारीरिक नींद के बजाय चेतना को सुलाने का पाठगत विरोध स्पष्ट रखा
  alternative: उत्पत्ति-वृत्तांत के साथ सामंजस्य स्थापित करना
