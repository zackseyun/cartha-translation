base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/010.yaml
  text: '1. He grasped and created additional aeons for himself with a shining spark that exists (even) now. He was astounded in the pride within him, and he begot authorities for himself.


    4. The first is named Athoth, whom the generations call [the Reaper].


    5. The second is Harmas, [being the] evil [{eye:1}].


    6. The third is Kalila-Oumbri.


    7. The fourth is Yabel.


    8. The fifth is Adonaiou, who is called Sabaoth.


    9. The sixth is Cain, whom the generations of humanity call the Sun.


    10. The seventh is Abel.


    11. The eighth is Abrisene.


    12. The ninth is Yobel. «11»


    13. The tenth is Armoupieel.


    14. The eleventh is Melcheir-Adonein.


    15. The twelfth is Belias, who is over the depths of Hades.'
translation:
  language: hi
  text: '1. उसने उस चमकती हुई चिनगारी के द्वारा, जो अब भी विद्यमान है, अपने लिए और भी युग-सत्ताएँ रचीं। वह अपने भीतर के घमंड में चकित हुआ और उसने अपने लिए अधिकार-सत्ताओं को जन्म दिया।


    4. पहले का नाम अथोथ है, जिसे पीढ़ियाँ [लवनेवाला] कहती हैं।[a]


    5. दूसरा हरमास है, [जो] बुरी [{आँख:1}] [है]।[b]


    6. तीसरा कलीला-ऊम्ब्री है।


    7. चौथा याबेल है।


    8. पाँचवाँ अदोनाइऊ है, जिसे सबाओथ कहा जाता है।


    9. छठा कैन है, जिसे मनुष्यों की पीढ़ियाँ सूर्य कहती हैं।


    10. सातवाँ हाबिल है।


    11. आठवाँ अब्रीसेने है।


    12. नौवाँ योबेल है।


    13. दसवाँ अरमूपीएल है।


    14. ग्यारहवाँ मेलखेर-अदोनेइन है।


    15. बारहवाँ बेलियास है, जो अधोलोक की गहराइयों पर नियुक्त है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘[लवनेवाला]’ साक्ष्य में पुनर्स्थापित पाठ है; वर्ग कोष्ठक उसी अनिश्चितता को दर्शाते हैं।
    reason: पाठ-समीक्षात्मक पुनर्स्थापन को स्पष्ट करना।
  - marker: b
    text: इस पंक्ति का साक्ष्य खंडित अथवा संपादकीय संकेतों से युक्त है। ‘[{आँख:1}]’ को उपलब्ध आधार के अनुसार ज्यों का त्यों रखा गया है; इसका निश्चित पुनर्निर्माण लंबित है।
    reason: असामान्य अंतःस्थापित पुनर्स्थापन संकेत और स्रोत-समीक्षा की लंबित स्थिति बताना।
  - marker: c
    text: ‘अधोलोक’ यहाँ यूनानी ‘हेडेस’ का अनुवाद है; इसे आवश्यक रूप से अंतिम दंड-स्थान ‘नरक’ नहीं समझना चाहिए।
    reason: अनावश्यक धर्मवैज्ञानिक समानीकरण से बचना।
lexical_decisions:
- source_word: aeons
  choice: युग-सत्ताएँ
  rationale: इस ज्ञानवादी संदर्भ में शब्द केवल कालखंड नहीं, व्यक्त अथवा ब्रह्मांडीय सत्ताओं को सूचित करता है; संयुक्त पद दोनों आयाम बनाए रखता है।
- source_word: authorities
  choice: अधिकार-सत्ताएँ
  rationale: साधारण ‘अधिकारी’ मानवीय पद का आभास देता; यहाँ उत्पन्न ब्रह्मांडीय शासक सत्ताएँ अभिप्रेत हैं।
- source_word: generations
  choice: पीढ़ियाँ
  rationale: साक्ष्य का बहुवचन और कालक्रमिक मानवीय समूहों का भाव सीधे संरक्षित है।
- source_word: the Reaper
  choice: लवनेवाला
  rationale: उपाधि का कटाई करने वाले व्यक्ति वाला अर्थ रखा गया है; कोष्ठक पाठ की पुनर्स्थापित स्थिति दर्शाते हैं।
- source_word: Hades
  choice: अधोलोक
  rationale: ग्रीक पौराणिक-धार्मिक लोक को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और इसे स्वतः ‘नरक’ बनाकर दंड-स्थान की संकीर्ण व्याख्या नहीं थोपता।
- source_word: over
  choice: पर नियुक्त
  rationale: सत्ता अथवा अधीक्षण का संबंध व्यक्त करता है, बिना यह तय किए कि वह स्थानिक रूप से उसके ऊपर है।
theological_decisions:
- issue: ‘aeons’ का सत्तात्मक या कालात्मक अर्थ
  choice: युग-सत्ताएँ
  alternative: युग / ऐओन
  rationale: ज्ञानवादी ब्रह्मांड-विज्ञान में ये उत्पन्न सत्ताएँ हैं, फिर भी मूल पद का ‘युग’ आयाम पूरी तरह मिटाया नहीं गया।
- issue: ‘shining spark’ का स्वरूप
  choice: चमकती हुई चिनगारी
  alternative: ज्योतिर्मय चिनगारी
  rationale: पाठ यह स्पष्ट नहीं करता कि चिनगारी पदार्थ, शक्ति या दिव्य अंश है; अतः कोई अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ी गई।
- issue: Yaltabaoth का अपने घमंड में चकित होना
  choice: वह अपने भीतर के घमंड में चकित हुआ
  alternative: अपने भीतर के अहंकार के कारण वह विस्मित हुआ
  rationale: ‘in’ की अस्पष्टता और गर्व तथा विस्मय के असामान्य संबंध को हल किए बिना संरक्षित किया गया।
- issue: Belias और Hades की गहराइयों का संबंध
  choice: अधोलोक की गहराइयों पर नियुक्त है
  alternative: अधोलोक की गहराइयों के ऊपर है
  rationale: प्रशासनिक अधिपत्य सम्भावित है, पर पदानुक्रम या नैतिक दंड की विस्तृत धारणा नहीं जोड़ी गई।
