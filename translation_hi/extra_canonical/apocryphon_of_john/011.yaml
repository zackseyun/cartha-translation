  revised_text: '**यूहन्ना का गुप्त ग्रंथ — सात राजा**


    1. उसने सात राजा भी नियुक्त किए। उनमें से प्रत्येक सात स्वर्गों के ऊपर के स्वर्गीय नभमंडलों में से एक के अनुरूप था। उसने अथाह गह्वर की गहराई पर पाँच और नियुक्त किए, ताकि वे शासन करें।


    2. उसने अपनी आग भी उनके साथ बाँटी, पर अपनी माता से पाए हुए प्रकाश की शक्ति में से कुछ भी नहीं भेजा, क्योंकि वह अज्ञानमय अंधकार है। जब प्रकाश अंधकार के साथ मिल गया, तो उसने अंधकार को चमका दिया; और जब अंधकार प्रकाश के साथ मिल गया, तो उसने प्रकाश को धुँधला कर दिया। वह न प्रकाश रहा, न अंधकार, बल्कि धूमिल हो गया।


    3. वह निर्बल शासक[a] तीन नाम रखता है। पहला नाम यालताबाओथ, दूसरा सक्लास और तीसरा समाएल है। वह अपने भीतर के घमंड के कारण दुष्ट है, क्योंकि उसने कहा, “मैं परमेश्वर हूँ, और मेरे सिवा कोई देवता नहीं है।” वह अपनी शक्ति और उस स्थान को नहीं जानता जहाँ से उसकी उत्पत्ति हुई।


    4. शासकों ने अपने लिए सात शक्तियाँ भी रचीं, और प्रत्येक शक्ति ने अपने लिए छह स्वर्गदूत रचे। इस प्रकार उनकी संख्या 365 स्वर्गदूत हुई। नामों से संबंधित उनके रूप ये हैं:


    5. पहला ‹है› अथोथ—उसका मुख भेड़ जैसा है; दूसरा एलोआइऊ—उसका मुख गधे जैसा है; तीसरा अस्ताफाइओस—उसका मुख [लकड़बग्घे] जैसा है; चौथा याओ—उसका मुख सात सिरों वाले [ड्रैगन] जैसा है; पाँचवाँ सबाओथ—उसका मुख ड्रैगन जैसा है; छठा अदोनिन—उसका मुख बंदर जैसा है; और सातवाँ सब्बेदे—उसका मुख धधकती आग जैसा है।


    6. ये सप्ताह के सातगुने [पहलू] हैं।[b]


    7. पर यालताबाओथ के मुखों की संख्या बहुत थी—दूसरे सबके मुखों से अधिक—ताकि जब वह सराफों के बीच हो, तो अपनी इच्छा के अनुसार उन सबके सामने कोई भी मुख धारण कर सके।


    8. अपनी आग उनके साथ बाँटने के कारण वह उनका अधिपति बन गया।


