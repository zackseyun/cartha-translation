  text: 'He also established seven kings, each corresponding to the heavenly firmaments above the seven heavens, and five over the depths of the abyss, so that they would rule.


    He also shared his fire with them, but he did not send out any of the power of the light he had obtained from his mother, because he is ignorant darkness. When the light combined with the darkness, it made the darkness shine; and when the darkness combined with the light, it darkened the light. It became neither light nor darkness, but grew gloomy.


    The feeble archon has three names. The first name is Yaltabaoth, the second is Saklas, and the third is Samael. He is wicked in the pride within him, because he said, “I am God, and there is no god other than me.” For he is unaware of his own strength and of the place from which he originated.


    The archons also created seven powers for themselves, and each of the powers created six angels for themselves, so that they numbered 365 angels. These are the bodies that pertain to the names:


    The first ‹is› Athoth—he has the face of a sheep; the second is Eloaiou—he has the face of a donkey; the third is Astaphaios—he has the face of a [hyena]; the fourth is Yao—he has the face of a seven-headed [dragon]; the fifth is Sabaoth—he has the face of a dragon; the sixth is Adonin—he has the face of a monkey; the seventh is Sabbede—he has the face of a glowing fire.


    These are the sevenfold (aspect) of the week.


    Yaltabaoth, however, had a multitude «12» of faces—more than all the others—so that when he was among the seraphs, he was able to put on any face before all of them, as he wished.


    Because he shared his fire with them, he became their overlord.


    Because of the glorious power he possessed through his mother’s light, he called himself God, and he was disobedient to the place from which he had originated.


    He also joined the seven powers within his thought together with the authorities who were with him. When he spoke, it happened, and he named each of the powers, beginning with the highest:


    The first is Goodness, together with the first authority, Athoth; the second is Providence, together with the second authority, Eloaio; the third is Divinity, together with the third authority, Astraphaio; the fourth is Lordship, together with the fourth authority, Yao; the fifth is Kingdom, together with the fifth authority, Sabaoth; the sixth is Jealousy, together with the sixth authority, Adonein; the seventh is Sophia, together with the seventh authority, Sabbateon.


    These also have a firmament corresponding to each heavenly aeon.


    They were given names corresponding to the glory of the heavenly beings, to bring about the [annihilation of the] powers. But power dwelt in the names given to [them by] their originator, while the names given to them in accordance with the glory of the heavenly beings will mean annihilation and feebleness for them.


    In this way, they have two names.


    [Further, after] creating [everything, he organized] them according to the likeness of the first aeons that had come into being, so that he could «13» create them after the likeness of the indestructible ones.


    It was not because he had seen the indestructible beings, but because of the power within him, which he had obtained from his mother, that he generated within himself the likeness of the world. When he saw the creation around him and the host of angels around him, which had issued from him, he declared to them, “I am a jealous God, and there is no God other than me.”


    By declaring this, however, he indicated to the angels attending him that there is another God. For if there were no other, how could he be jealous of another?


    The mother then began “to {move:3} back and forth,” becoming aware of the deficiency as the brightness of her light decreased, and she grew dark because her companion had not agreed together with her.'
translation:
  language: hi
  text: '**यूहन्ना का गुप्त ग्रंथ — सात राजा**


    1. उसने सात राजा भी नियुक्त किए। उनमें से प्रत्येक सात आकाशों के ऊपर के आकाशीय नभमंडलों में से एक के अनुरूप था। उसने अथाह कुंड की गहराई के ऊपर पाँच और नियुक्त किए, ताकि वे शासन करें।


    2. उसने अपनी आग भी उनके साथ बाँटी, पर अपनी माता से पाए हुए प्रकाश की शक्ति में से कुछ भी उन्हें नहीं दिया, क्योंकि वह अज्ञानमय अंधकार है। जब प्रकाश अंधकार के साथ मिल गया, तो उसने अंधकार को चमका दिया; और जब अंधकार प्रकाश के साथ मिल गया, तो उसने प्रकाश को धुँधला कर दिया। वह न प्रकाश रहा, न अंधकार, बल्कि धूमिल हो गया।


    3. वह निर्बल शासक[a] तीन नाम रखता है। पहला नाम यालताबाओथ, दूसरा सक्लास और तीसरा समाएल है। वह अपने भीतर के घमंड के कारण दुष्ट है, क्योंकि उसने कहा, “मैं परमेश्वर हूँ, और मेरे सिवा कोई देवता नहीं है।” वह अपनी शक्ति और उस स्थान को नहीं जानता जहाँ से उसकी उत्पत्ति हुई।


    4. शासकों ने अपने लिए सात शक्तियाँ भी रचीं, और प्रत्येक शक्ति ने अपने लिए छह स्वर्गदूत रचे। इस प्रकार उनकी संख्या 365 स्वर्गदूत हुई। नामों से संबंधित उनके रूप ये हैं:


    5. पहला ‹है› अथोथ—उसका मुख भेड़ जैसा है; दूसरा एलोआइऊ—उसका मुख गधे जैसा है; तीसरा अस्ताफाइओस—उसका मुख [लकड़बग्घे] जैसा है; चौथा याओ—उसका मुख सात सिरों वाले [अजगर] जैसा है; पाँचवाँ सबाओथ—उसका मुख अजगर जैसा है; छठा अदोनिन—उसका मुख बंदर जैसा है; और सातवाँ सब्बेदे—उसका मुख धधकती आग जैसा है।


    6. ये सप्ताह का सातहरा [रूप] हैं।[b]


    7. पर यालताबाओथ के मुखों की संख्या बहुत थी—दूसरे सबके मुखों से अधिक—ताकि जब वह सराफों के बीच हो, तो अपनी इच्छा के अनुसार उन सबके सामने कोई भी मुख धारण कर सके।


    8. अपनी आग उनके साथ बाँटने के कारण वह उनका अधिपति बन गया।


    9. अपनी माता के प्रकाश से मिली महिमामय शक्ति के कारण उसने अपने आपको परमेश्वर कहा, और जिस स्थान से उसकी उत्पत्ति हुई थी, उसकी आज्ञा नहीं मानी।


    10. उसने अपने विचार में सातों शक्तियों को उन सत्ताधारियों के साथ जोड़ दिया जो उसके साथ थे। जब उसने कहा, तो वैसा ही हो गया। फिर उसने सबसे ऊँचे से आरंभ करके प्रत्येक शक्ति का नाम रखा:


    11. पहली है भलाई, पहले सत्ताधारी अथोथ के साथ; दूसरी है पूर्वदृष्टि, दूसरे सत्ताधारी एलोआइओ के साथ; तीसरी है दिव्यता, तीसरे सत्ताधारी अस्त्राफाइओ के साथ; चौथी है प्रभुता, चौथे सत्ताधारी याओ के साथ; पाँचवीं है राज्य, पाँचवें सत्ताधारी सबाओथ के साथ; छठी है ईर्ष्या, छठे सत्ताधारी अदोनेइन के साथ; और सातवीं है सोफिया, सातवें सत्ताधारी सब्बातेओन के साथ।


    12. इनमें से प्रत्येक का एक नभमंडल भी है, जो एक-एक स्वर्गीय युगलोक[c] के अनुरूप है।


    13. उन्हें स्वर्गीय सत्ताओं की महिमा के अनुरूप नाम दिए गए, ताकि शक्तियों का [विनाश] हो। पर उनके उत्पत्तिकर्ता ने जो नाम [उन्हें] दिए थे, उनमें शक्ति निवास करती थी; जबकि स्वर्गीय सत्ताओं की महिमा के अनुरूप दिए गए नाम उनके लिए विनाश और निर्बलता का कारण होंगे।


    14. इस प्रकार उनमें से प्रत्येक के दो नाम हैं।


    15. [फिर, सब कुछ] रचने [के बाद उसने] उन्हें उन प्रथम युगलोकों के प्रतिरूप के अनुसार [व्यवस्थित किया] जो अस्तित्व में आए थे, ताकि वह उन्हें अविनाशी सत्ताओं की समानता में रच सके।


    16. उसने अविनाशी सत्ताओं को देखा था, इसलिए नहीं; बल्कि अपने भीतर की उस शक्ति के कारण, जिसे उसने अपनी माता से पाया था, उसने अपने भीतर संसार का प्रतिरूप उत्पन्न किया। जब उसने अपने चारों ओर की सृष्टि और स्वर्गदूतों की उस सेना को देखा जो उससे निकली थी, तो उसने उनसे कहा, “मैं ईर्ष्यालु परमेश्वर हूँ, और मेरे सिवा कोई परमेश्वर नहीं है।”


    17. पर यह कहकर उसने अपनी सेवा में उपस्थित स्वर्गदूतों को संकेत दिया कि कोई दूसरा परमेश्वर भी है; क्योंकि यदि कोई दूसरा न होता, तो वह किससे ईर्ष्या करता?


    18. तब माता “आगे-पीछे {हिलने:3}” लगी।[d] अपने प्रकाश की चमक घटने पर उसे अपनी कमी का बोध हुआ, और वह अंधकारमय हो गई, क्योंकि उसका सहचर उसके साथ सहमत नहीं हुआ था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शासक’ उस पारिभाषिक शब्द का अनुवाद है जिसे प्रायः ‘आर्खोन’ लिखा जाता है; यहाँ यह एक ब्रह्मांडीय अधीन सत्ता को दर्शाता है।
    reason: पाठ की विशिष्ट ज्ञानवादी शब्दावली से सामान्य पाठक को परिचित कराना।
  - marker: b
    text: ‘सप्ताह का सातहरा रूप’ का आशय अस्पष्ट है; संभवतः सात दिनों या उनसे जुड़ी सात ब्रह्मांडीय सत्ताओं की ओर संकेत है।
    reason: स्रोत की वास्तविक अस्पष्टता को बिना अनुमान से सुलझाए बताना।
  - marker: c
    text: ‘युगलोक’ उस शब्द का अनुवाद है जिसका अर्थ ‘युग’ भी हो सकता है और इस ग्रंथ में एक स्वर्गीय लोक या सत्ता-क्षेत्र भी।
    reason: aeon के कालिक और स्थानिक/सत्तात्मक दोनों अर्थों को सुरक्षित रखना।
  - marker: d
    text: मूल साक्ष्य में यह वाक्यांश और संपादकीय संकेत {हिलने:3} अस्पष्ट हैं; उन्हें अर्थ निश्चित किए बिना सुरक्षित रखा गया है।
    reason: भ्रष्ट या अनिश्चित पाठ को अनुवादक की कल्पना से पूरा न करना।
lexical_decisions:
- source_word: archon
  choice: शासक
  rationale: पाठ में ब्रह्मांडीय अधीन शासक का अर्थ है। सहज हिन्दी के लिए ‘शासक’ रखा गया और पहले प्रयोग पर पादटिप्पणी में पारिभाषिक अर्थ बताया गया।
- source_word: firmament
  choice: नभमंडल
  rationale: ‘आकाशमंडल’ की अपेक्षा संक्षिप्त, गरिमापूर्ण और प्राचीन ब्रह्मांड-विधान के स्तर या मंडल का बोध कराने वाला शब्द।
- source_word: abyss
  choice: अथाह कुंड
  rationale: असीम गहराई और एक विशिष्ट अधोलोक-सदृश क्षेत्र, दोनों का संकेत सुरक्षित रहता है।
- source_word: aeon
  choice: युगलोक
  rationale: यहाँ केवल कालखंड नहीं, एक स्वर्गीय क्षेत्र या सत्ता-क्रम भी अभिप्रेत है; ‘युगलोक’ दोनों आयामों को खुला रखता है।
