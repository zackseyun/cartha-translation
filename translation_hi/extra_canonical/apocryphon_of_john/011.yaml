    10. उसने अपने विचार में सातों शक्तियों को उन सत्ताधारियों के साथ जोड़ दिया जो उसके साथ थे। जब उसने कहा, तो वैसा ही हो गया। फिर उसने सबसे ऊँचे से आरंभ करके प्रत्येक शक्ति का नाम रखा:


    11. पहली है भलाई, पहले सत्ताधारी अथोथ के साथ; दूसरी है पूर्वदृष्टि, दूसरे सत्ताधारी एलोआइओ के साथ; तीसरी है दिव्यता, तीसरे सत्ताधारी अस्त्राफाइओ के साथ; चौथी है प्रभुता, चौथे सत्ताधारी याओ के साथ; पाँचवीं है राज्य, पाँचवें सत्ताधारी सबाओथ के साथ; छठी है ईर्ष्या, छठे सत्ताधारी अदोनेइन के साथ; और सातवीं है सोफिया, सातवें सत्ताधारी सब्बातेओन के साथ।


    12. इनमें से प्रत्येक का एक नभमंडल भी है, जो एक-एक स्वर्गीय युगलोक[c] के अनुरूप है।


    13. उन्हें स्वर्गीय सत्ताओं की महिमा के अनुरूप नाम दिए गए, ताकि शक्तियों का [विनाश] हो। पर उनके उत्पत्तिकर्ता ने जो नाम [उन्हें] दिए थे, उनमें शक्ति निवास करती थी; जबकि स्वर्गीय सत्ताओं की महिमा के अनुरूप दिए गए नाम उनके लिए विनाश और निर्बलता का कारण होंगे।


    14. इस प्रकार उनमें से प्रत्येक के दो नाम हैं।


    15. [फिर,] [सब कुछ रचने के बाद उसने] उन्हें उन प्रथम युगलोकों के प्रतिरूप के अनुसार व्यवस्थित किया जो अस्तित्व में आए थे, ताकि वह उन्हें अविनाशी सत्ताओं की समानता में रच सके।


    16. उसने अविनाशी सत्ताओं को देखा था, इसलिए नहीं; बल्कि अपने भीतर की उस शक्ति के कारण, जिसे उसने अपनी माता से पाया था, उसने अपने भीतर संसार का प्रतिरूप उत्पन्न किया। जब उसने अपने चारों ओर की सृष्टि और स्वर्गदूतों की उस सेना को देखा जो उससे निकली थी, तो उसने उनसे कहा, “मैं ईर्ष्यालु परमेश्वर हूँ, और मेरे सिवा कोई परमेश्वर नहीं है।”


    17. पर यह कहकर उसने अपनी सेवा में उपस्थित स्वर्गदूतों को संकेत दिया कि कोई दूसरा परमेश्वर भी है; क्योंकि यदि कोई दूसरा न होता, तो वह किससे ईर्ष्या करता?


