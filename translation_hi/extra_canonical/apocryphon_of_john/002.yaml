  naturalness: भाषा सामान्यतः सुबोध और गरिमापूर्ण है। ‘दृश्य’ के स्थान पर ‘प्राकट्य’ इस दार्शनिक-दर्शनात्मक प्रसंग में अधिक संगत है और पद 4 में एक ही अभिव्यक्ति के बार-बार आने का संबंध स्पष्ट रखता है।
