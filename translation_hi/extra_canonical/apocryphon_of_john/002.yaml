translation:
  language: hi
  text: '1. उसी क्षण, [जब मैं इन बातों पर मनन कर रहा था], देखो, [आकाश खुल गए और] आकाश के नीचे की [समूची] सृष्टि प्रकाश से चमक उठी, और [संसार] हिल गया।


    2. [मैं डर गया, और देखो, मैंने] उस [प्रकाश के भीतर एक बालक को] अपने पास खड़ा देखा।


    3. जब मैं [उसे देखता रहा, तो वह] एक वृद्ध पुरुष के समान हो गया; फिर उसने [अपना] रूप बदला और एक पुत्र[a] के समान हो गया।


    4. मेरे सामने [अलग-अलग सत्ताएँ नहीं थीं], बल्कि उस [प्रकाश] के भीतर अनेक रूपों वाला एक [दृश्य] था। वे [रूप] एक-दूसरे के बीच से प्रकट होते थे, और उस [दृश्य] के तीन रूप थे।


    5. उसने मुझसे पूछा, “यूहन्ना, यूहन्ना, तुम अचम्भा क्यों करते हो और [डरते] क्यों हो?


    6. क्या तुम सब इस रूप को नहीं पहचानते?


    7. मेरा आशय है, [हिम्मत मत हारो]।


    8. मैं वही हूँ जो सदा [तुम सबके साथ] रहता है।


    9. मैं [पिता] हूँ, मैं माता हूँ, मैं पुत्र हूँ।


    10. मैं निष्कलंक और निर्मल हूँ।


    11. [मैं अब तुम्हें बताने आया हूँ] कि क्या है, [क्या था] और क्या [होगा], ताकि [तुम उन बातों को समझ सको] जो अभी प्रकट नहीं हैं [और जो प्रकट हैं; और ताकि मैं तुम्हें] [सिद्ध मनुष्य के] [अचल वंश] के विषय में बता सकूँ।[b]


    12. [इसलिए अपना] मुख [ऊपर उठाओ, ताकि] जो बातें मैं आज [तुम्हें बताऊँगा, उन्हें तुम ग्रहण कर सको] और [सिद्ध मनुष्य के] [अचल] वंश के अपने साथी आत्मिक जनों तक [उन्हें पहुँचा सको]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में यहाँ “son” के साथ एक टिप्पणी-संकेत है, पर उसकी टिप्पणी उपलब्ध नहीं कराई गई। इसलिए ‘पुत्र’ का पाठ अस्थायी है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अपेक्षित है।
    reason: आधार-साक्ष्य में मौजूद लेकिन अनुपलब्ध पाठालोचनात्मक सूचना को छिपाने के बजाय स्पष्ट करना।
  - marker: b
    text: पद 11–12 का अधिकांश पाठ पांडुलिपि की रिक्तियों से पुनर्निर्मित है। कोष्ठक ऐसे पुनर्स्थापित शब्दों को दिखाते हैं; कॉप्टिक स्रोत-समीक्षा अभी लंबित है।
    reason: खंडित पांडुलिपि और अनुवाद की अस्थायी स्थिति के विषय में पाठक को सावधान करना।
lexical_decisions:
- source_word: appearance
  choice: रूप / दृश्य
  rationale: व्यक्ति द्वारा धारण किए रूप के लिए ‘रूप’ स्वाभाविक है; पूरे प्रकाशमय, बहुरूपी दर्शन के लिए ‘दृश्य’ चुना गया, ताकि एक ही हिंदी शब्द से आशय धुँधला न हो।
- source_word: diverse entity
  choice: अलग-अलग सत्ताएँ
  rationale: पाठ का आशय अनेक स्वतंत्र अस्तित्वों और एक बहुरूपी प्राकट्य के बीच भेद करना है; ‘सत्ताएँ’ इस अस्तित्वगत अर्थ को बनाए रखता है।
- source_word: unmoving race
  choice: अचल वंश
  rationale: ‘अचल’ स्थिरता/अविचलता की अस्पष्टता बनाए रखता है और ‘वंश’ समूह, जाति या आध्यात्मिक कुल के अर्थ को संप्रेषित करता है।
- source_word: Perfect Man
  choice: सिद्ध मनुष्य
  rationale: ‘सिद्ध’ पूर्णता की धार्मिक-दार्शनिक छाया को सहज हिंदी में रखता है; ‘मनुष्य’ को लिंग-विशिष्ट आधुनिक अर्थ तक सीमित नहीं किया गया।
- source_word: companion spirits
  choice: साथी आत्मिक जन
  rationale: अंग्रेज़ी साक्ष्य का वाक्यांश असामान्य और स्रोत-समीक्षा के अधीन है; यह चयन ‘साथी’ और आध्यात्मिक पहचान दोनों को बिना अत्यधिक व्याख्या के रखता है।
- source_word: unpolluted and untainted
  choice: निष्कलंक और निर्मल
  rationale: दो निकटवर्ती विशेषण रखकर मूल की द्विरुक्ति और नैतिक/पवित्रतामूलक अर्थ कायम रखा गया।
theological_decisions:
- issue: पिता, माता और पुत्र के रूप में वक्ता की त्रिविध आत्म-पहचान
  choice: 'तीनों पदों को सीधे और समानांतर रखा गया: ‘मैं [पिता] हूँ, मैं माता हूँ, मैं पुत्र हूँ।’'
  alternative: इसे त्रिएकता अथवा किसी विशिष्ट मत की व्याख्यात्मक भाषा में ढालना
  rationale: पाठ की अपनी असामान्य धार्मिक भाषा और तनाव को बिना सांप्रदायिक व्याख्या के सुरक्षित रखना आवश्यक है।
- issue: एक सत्ता और तीन रूपों का संबंध
  choice: ‘अलग-अलग सत्ताएँ नहीं थीं’ और ‘तीन रूप थे’ दोनों कथनों को साथ रखा गया
  alternative: तीन व्यक्तियों, तीन देवताओं या मात्र भ्रम के रूप में स्पष्ट करना
  rationale: साक्ष्य जानबूझकर एकता और बहुरूपता दोनों व्यक्त करता है; अनुवाद को इस तनाव का समाधान नहीं करना चाहिए।
- issue: ‘अचल वंश’ की पहचान
  choice: समूह का शीर्षक ज्यों का त्यों रखा गया
  alternative: इसे ‘चुने हुए’, ‘कलीसिया’ या किसी ज्ञात धार्मिक समुदाय से पहचानना
  rationale: ऐसी पहचान स्रोत में स्पष्ट नहीं है और बाहरी धर्मशास्त्रीय निष्कर्ष आयात करेगी।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। स्रोत में वर्ग कोष्ठकों से चिह्नित पुनर्निर्माण हिंदी में भी वर्ग कोष्ठकों में रखे गए हैं। पांडुलिपि का बाधक पृष्ठ-संकेत «2» मुख्य पाठ से हटाया गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्राचीन कॉप्टिक पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण विशेषतः खंडित अंश और पद 3 का ‘पुत्र’ अस्थायी माने जाएँ।
