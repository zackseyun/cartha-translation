  revised_text: '**यूहन्ना का गुप्त ग्रंथ — घृणित आत्मा**


    1. फिर भी मैंने पूछा, “प्रभु, घृणित आत्मा कहाँ से उत्पन्न हुई?”


    2. उसने मुझसे कहा, “माता-पिता, जो दया से भरपूर है, हर रूप में पवित्र आत्मा, जो दयालु है और तुम सब पर करुणा करता है—अर्थात् दीप्तिमान पूर्वचिंतन का प्रतिबिंब—उसने सिद्ध वंश के बीज, उसकी बुद्धि और मनुष्य की सनातन ज्योति को उत्पन्न किया।[a]


    3. जब प्रधान शासक को पता चला कि वे ऊँचाई में उससे ऊपर हैं और बुद्धि में उससे बढ़कर हैं, तब उसने उनके उद्देश्य को समझ लेने की इच्छा की। वह नहीं जानता था कि वे बुद्धि में उससे बढ़कर हैं और वह उन्हें समझ नहीं पाएगा।[b]


    4. उसने अपने अधीनस्थ शासकों के साथ—जो उसकी शक्तियाँ हैं—एक षड्यंत्र रचा, और उन्होंने मिलकर सोफिया के साथ व्यभिचार किया। उनसे कटु नियति उत्पन्न हुई—अंतिम, अस्थिर बंधन। उसका स्वभाव डगमगानेवाला है, फिर भी वह उस स्त्री से, जिसके साथ देवताओं ने व्यभिचार किया, तथा स्वर्गदूतों, दुष्टात्माओं और आज तक की सभी पीढ़ियों से अधिक टिकाऊ और शक्तिशाली है। क्योंकि उसी नियति से हर अपराध, अन्याय, निंदा, विस्मृति और अज्ञान का बंधन, हर कठोर आदेश के साथ गंभीर अपराध, और अत्यधिक भय निकले।[c]


    5. इस प्रकार सारी सृष्टि भी अंधी कर दी गई, ताकि वे उस परमेश्वर को न जानें जो उन सबके ऊपर है। विस्मृति के बंधन के कारण उनके पाप छिपे रहे, क्योंकि वे मापों, कालों और क्षणों से बँधे हैं, क्योंकि वह सब पर शासन करनेवाला है।[d]


    6. तब उसे उस सब पर पछतावा हुआ जो उसके कारण घटित हुआ था।


    7. इस बार उसने मानवजाति की उपज पर जलप्रलय लाने का षड्यंत्र रचा। परंतु दीप्तिमान पूर्वचिंतन की महानता ने नूह को सूचना दी। नूह ने मानव-संतानों के सारे वंश को संदेश सुनाया, लेकिन जो उसके लिए पराए थे उन्होंने उसकी बात पर ध्यान नहीं दिया।


    8. बात वैसी नहीं थी जैसी मूसा ने कही, ‘उन्होंने अपने आपको एक जहाज़ में छिपा लिया।’ बल्कि उन्होंने अपने आपको एक स्थान में छिपाया—केवल नूह ने ही नहीं, बल्कि अडिग वंश के और भी बहुत-से लोगों ने।[e]


    9. वे एक स्थान में गए और एक दीप्तिमान बादल के भीतर छिप गए। वह अपने अधिकार से परिचित था, और प्रकाश से संबंध रखनेवाली वह स्त्री उसके साथ थी।[f]


    10. वह उन पर चमकी थी, क्योंकि उसने सारी पृथ्वी को अंधकार से ढक दिया था और अपनी शक्तियों के साथ मिलकर षड्यंत्र रचा था।[g]


    11. उसने अपने स्वर्गदूतों को मनुष्यों की बेटियों के पास भेजा, ताकि वे उनमें से कुछ को अपने लिए ले लें और अपने सुख के लिए संतान उत्पन्न करें; पर पहले वे सफल नहीं हुए।


    12. जब वे सफल नहीं हुए, तो वे फिर इकट्ठे हुए और उन्होंने मिलकर एक षड्यंत्र रचा।


    13. उन्होंने उस आत्मा के समान, जो नीचे उतरी थी, एक घृणित आत्मा बनाई, ताकि उसके द्वारा आत्माओं को अशुद्ध करें। स्वर्गदूतों ने अपना रूप अपने साथियों के रूप जैसा बना लिया और उन्हें अंधकार की उस आत्मा से भर दिया, जिसे उन्होंने उनके लिए बुराई के साथ मिला दिया था।[h]


    14. उन्होंने सोना और चाँदी, यहाँ तक कि ताँबे और लोहे की भेंटें तथा हर प्रकार की धातु से बनी वस्तुएँ दीं। उन्होंने अनेक छल-कपट से अपने पीछे चलनेवाले लोगों को भटकाकर बड़ी विपत्तियों में डाल दिया।


    15. वे किसी सुख का आनंद लिए बिना बूढ़े हो गए।


    16. वे सत्य को पाए बिना और सच्चे परमेश्वर को जाने बिना मर गए। इस प्रकार सारी सृष्टि युगों तक चलनेवाली दासता में पड़ गई, जो संसार की नींव रखे जाने से लेकर अब तक चली आ रही है।


    17. उन्होंने स्त्रियों को भी चुना और अपने ही आत्मिक स्वरूप के अनुसार अंधकार से संतान उत्पन्न की। उन्होंने अपने हृदय बंद कर लिए और घृणित आत्मा की कठोरता से अपने आपको कठोर बना लिया—आज तक।”


    **पादटिप्पणियाँ**


