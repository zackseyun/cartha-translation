  text: '**यूहन्ना का गुप्त ग्रंथ — घृणित आत्मा**


    1. फिर भी मैंने पूछा, “प्रभु, घृणित आत्मा कहाँ से उत्पन्न हुई?”


    2. उसने मुझसे कहा, “माता-पिता, जो दया से भरपूर है, हर रूप में विद्यमान पवित्र आत्मा, जो दयालु है और तुम सब पर करुणा करता है—अर्थात् दीप्तिमान पूर्व-चिंतन का प्रतिबिंब—उसने सिद्ध वंश के बीज, उसकी बुद्धि और मनुष्य की सनातन ज्योति को ऊपर उठाया।[a]


    3. जब प्रधान शासक को पता चला कि वे ऊँचाई में उससे ऊपर और बुद्धि में उससे बढ़कर हैं, तब उसने उनके उद्देश्य को समझ लेने की इच्छा की। वह नहीं जानता था कि वे बुद्धि में उससे बढ़कर हैं और वह उन्हें समझ नहीं पाएगा।[b]


    4. उसने अपने अधीनस्थ शासकों के साथ—जो उसकी शक्तियाँ हैं—एक षड्यंत्र रचा, और उन्होंने मिलकर सोफिया के साथ व्यभिचार किया। उनसे कटु नियति उत्पन्न हुई—अंतिम, अस्थिर बंधन। उसका स्वभाव डगमगानेवाला है, फिर भी वह उस स्त्री से अधिक टिकाऊ और शक्तिशाली है जिसके साथ देवताओं ने व्यभिचार किया, और स्वर्गदूतों, दुष्टात्माओं तथा आज तक की सभी पीढ़ियों से भी। क्योंकि उसी नियति से हर अपराध, अन्याय, निंदा, विस्मृति और अज्ञान का बंधन, हर कठोर आदेश के साथ गंभीर अपराध, और अत्यधिक भय निकले।[c]


    5. इस प्रकार सारी सृष्टि भी अंधी कर दी गई, ताकि वह उस परमेश्वर को न जाने जो सबके ऊपर है। विस्मृति के बंधन के कारण उनके पाप छिपे रहे, क्योंकि वे मापों, कालों और क्षणों से बँधे हैं; कारण यह कि नियति सब पर शासन करती है।[d]


    6. तब उसे उस सब पर पछतावा हुआ जो उसके कारण घटित हुआ था।


    7. इस बार उसने मानवजाति की संतानों पर जलप्रलय लाने का षड्यंत्र रचा। परंतु दीप्तिमान पूर्व-चिंतन की महानता ने नूह को इसकी सूचना दी। नूह ने मानव-संतानों के सारे वंश को संदेश सुनाया, लेकिन जो उसके लिए पराए थे उन्होंने उसकी बात पर ध्यान नहीं दिया।


    8. बात वैसी नहीं थी जैसी मूसा ने कही, ‘उन्होंने अपने आपको एक जहाज़ में छिपा लिया।’ बल्कि उन्होंने अपने आपको एक स्थान में छिपाया—केवल नूह ने ही नहीं, बल्कि अडिग वंश के और भी बहुत-से लोगों ने।[e]


    9. वे एक स्थान में गए और एक दीप्तिमान बादल के भीतर छिप गए। वह अपने अधिकार को जानता था, और प्रकाश से संबंध रखनेवाली वह स्त्री उसके साथ थी।[f]


    10. वह उन पर चमकी थी, क्योंकि उसने सारी पृथ्वी को अंधकार से ढक दिया था और अपनी शक्तियों के साथ मिलकर षड्यंत्र रचा था।[g]


    11. उसने अपने स्वर्गदूतों को मनुष्यों की बेटियों के पास भेजा, ताकि वे उनमें से कुछ को अपने लिए ले लें और अपने सुख के लिए संतान उत्पन्न करें; पर पहले वे सफल नहीं हुए।


    12. जब वे सफल नहीं हुए, तो वे फिर इकट्ठे हुए और उन्होंने मिलकर एक षड्यंत्र रचा।


    13. उन्होंने उस आत्मा के समान, जो नीचे उतरी थी, एक घृणित आत्मा बनाई, ताकि उसके द्वारा आत्माओं को अशुद्ध करें। स्वर्गदूतों ने अपना रूप उन स्त्रियों के साथियों के रूप जैसा बना लिया और उन्हें अंधकार की उस आत्मा से भर दिया, जिसे उन्होंने उनके लिए बुराई के साथ मिला दिया था।[h]


    14. उन्होंने सोना और चाँदी, यहाँ तक कि ताँबे और लोहे की भेंटें तथा हर प्रकार की धातु से बनी वस्तुएँ दीं। उन्होंने अनेक छल-कपट से अपने पीछे चलनेवाले लोगों को भटकाकर बड़ी विपत्तियों में डाल दिया।


    15. वे किसी सुख का आनंद लिए बिना बूढ़े हो गए।


    16. वे सत्य को पाए बिना और सच्चे परमेश्वर को जाने बिना मर गए। इस प्रकार सारी सृष्टि युगों तक चलनेवाली दासता में पड़ गई, जो संसार की नींव रखे जाने से लेकर अब तक चली आ रही है।


    17. उन्होंने स्त्रियों को भी चुना और अपने ही आत्मिक स्वरूप के अनुसार अंधकार से संतान उत्पन्न की। उन्होंने अपने हृदय बंद कर लिए और घृणित आत्मा की कठोरता से अपने आपको कठोर बना लिया—आज तक।”


    **पादटिप्पणियाँ**


    [a] “माता-पिता” और आगे आनेवाले सर्वनामों में लिंग-संबंधी असंगति उपलब्ध साक्ष्य में ही है। “पूर्व-चिंतन” उस विशिष्ट दैवी सत्ता के लिए है जिसे यूनानी परंपरा में *Pronoia* कहा जाता है।


    [b] “उद्देश्य को समझ लेने” का अनुवाद “लक्ष्य को पकड़ लेने” भी हो सकता है; मूल आशय वस्तु को बौद्धिक रूप से समझने और उस पर अधिकार पाने के बीच अस्पष्ट है।


    [c] इस लंबे और कठिन वाक्य में तुलनाओं का सटीक संबंध अनिश्चित है। “सोफिया” का अर्थ “बुद्धि” है, पर यहाँ यह एक नाम है।


    [d] अंतिम उपवाक्य का कर्ता “नियति” समझा गया है; उपलब्ध पाठ में सर्वनाम का संकेत पूर्णतः स्पष्ट नहीं है।


    [e] “अडिग वंश” का अर्थ ऐसा आत्मिक वंश है जिसे हिलाया नहीं जा सकता।


    [f] इस पद में “वह,” “अपने” और “उसके” के संदर्भ अस्पष्ट हैं; अनुवाद ने इस अस्पष्टता को बनाए रखा है।


    [g] यहाँ स्त्रीलिंग “वह” प्रकाश से संबंध रखनेवाली सत्ता को और पुल्लिंग “उसने” प्रधान शासक को सूचित करता प्रतीत होता है।


    [h] “उनके साथियों” से आशय संभवतः उन स्त्रियों के पति या पुरुष साथी हैं; पाठ का संबंध पूरी तरह स्पष्ट नहीं है।'
