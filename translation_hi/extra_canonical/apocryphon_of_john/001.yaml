translation:
  language: hi
  text: '**यूहन्ना का गुप्त ग्रंथ—यूहन्ना और फ़रीसी**


    1. उद्धारकर्ता की शिक्षा, [और] रहस्यों का [प्रकाशन], और मौन में छिपे हुए [वे] वचन, [अर्थात वे वचन जो] उसने अपने शिष्य यूहन्ना को सिखाए।


    2. [फिर एक दिन] ऐसा हुआ कि जब यूहन्ना—[याकूब का भाई]; वे दोनों ज़ब्दी के पुत्र थे—मंदिर गया था, तब अरिमानियोस नाम का एक फ़रीसी [उसके पास आया और] उससे कहा, “तुम्हारा वह गुरु [कहाँ] है, [जिसके] पीछे तुम चलते थे?”


    3. उसने उत्तर दिया, “वह उस [स्थान] को लौट गया है [जहाँ से] वह आया था।”


    4. फ़रीसी ने [उससे कहा, “उस नासरी ने छल से] तुम सबको बहकाया, [तुम्हारे कान झूठ से भर दिए], और [तुम्हारे हृदयों पर मुहर लगाकर तुम्हें] तुम्हारे पूर्वजों की परंपराओं से विमुख कर दिया।”


    5. [जब] मैंने, [यूहन्ना ने], ये बातें सुनीं, तो [मैं मंदिर से मुड़कर पहाड़ों से भरे एक निर्जन स्थान की ओर चला गया]। मैं अपने हृदय में [बहुत विलाप करते हुए पूछने लगा]:


    6. “उद्धारकर्ता [कैसे नियुक्त किया गया], और [उसके पिता] ने उसे [संसार में] क्यों भेजा? [जिसने उसे भेजा, वह उसका] पिता कौन है? और [वह कैसा] युग[a] है [जिसमें हम जाएँगे]?


    7. क्योंकि जब उसने हमसे कहा, ‘[जिस] युग में [तुम जाओगे], वह [अविनाशी] युग है,’ तो उसका क्या अर्थ था?


    8. [पर उसने] हमें यह नहीं बताया कि [वह कैसा है]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “युग” के पीछे का शब्द (आमतौर पर यूनानी *aiōn* से लिया गया कॉप्टिक रूप) समय-अवधि के साथ-साथ किसी पारलौकिक लोक, क्षेत्र या अस्तित्व-व्यवस्था को भी सूचित कर सकता है।
    reason: ‘aeon’ की वैचारिक व्यापकता और पाठ की वास्तविक अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ⲥⲱⲧⲏⲣ / savior (as represented by the witness)
  choice: उद्धारकर्ता
  rationale: यह धार्मिक पद को संप्रदायगत विस्तार दिए बिना स्वाभाविक और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: aeon
  choice: युग
  rationale: यहाँ शब्द किसी साधारण समय-अवधि से अधिक, एक पारलौकिक क्षेत्र या व्यवस्था का संकेत दे सकता है। मुख्य पाठ में पठनीय ‘युग’ रखा गया और अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई।
- source_word: appointed
  choice: नियुक्त किया गया
  rationale: स्रोत-साक्ष्य की निष्क्रिय रचना और प्रश्न की अस्पष्टता सुरक्षित रहती है; ‘अभिषिक्त’ जैसे अधिक व्याख्यात्मक धार्मिक शब्द से बचा गया।
- source_word: dispatched
  choice: भेजा
  rationale: आधुनिक हिन्दी में स्वाभाविक है और प्रेषण का अर्थ बनाए रखता है, बिना मिशन के स्वरूप को अतिरिक्त रूप से परिभाषित किए।
- source_word: sealed off your hearts
  choice: तुम्हारे हृदयों पर मुहर लगाकर
  rationale: मूल रूपक को बनाए रखा गया; इसका अभिप्राय कठोर करना, बंद करना या अगम्य बनाना हो सकता है, इसलिए किसी एक अर्थ में सीमित नहीं किया गया।
- source_word: desert place
  choice: निर्जन स्थान
  rationale: भौगोलिक रेगिस्तान की अपेक्षा एकांत या उजाड़ स्थान का व्यापक अर्थ सुरक्षित करता है।
theological_decisions:
- issue: उद्धारकर्ता की नियुक्ति और पिता द्वारा भेजे जाने का संबंध
  choice: दोनों प्रश्नों को अलग और अनिर्णीत रखा गया
  alternative: नियुक्ति को अभिषेक, सृष्टि या देहधारण के रूप में स्पष्ट करना
  rationale: अंश स्वयं इन प्रश्नों का उत्तर नहीं देता; किसी विशिष्ट मसीही या ज्ञानवादी व्याख्या को आरोपित नहीं किया गया।
- issue: ‘aeon’ का स्वरूप
  choice: मुख्य पाठ में ‘युग’, पादटिप्पणी में ‘लोक/क्षेत्र/व्यवस्था’ की संभावित अर्थ-सीमा
  alternative: ‘अनंत जीवन’, ‘स्वर्गलोक’ या ‘कल्प’
  rationale: ऐसे विकल्प पाठ की वास्तविक वैचारिक अस्पष्टता को समय से परे किसी निश्चित सिद्धांत में बदल सकते थे।
- issue: ‘वह उस स्थान को लौट गया जहाँ से आया था’
  choice: दिशात्मक कथन को ज्यों का त्यों रखा गया
  alternative: इसे स्पष्ट रूप से स्वर्गारोहण या पिता के पास वापसी कहना
  rationale: पाठ स्थान की पहचान नहीं करता, इसलिए उसका धार्मिक अर्थ खुला रखा गया।
- issue: फ़रीसी का आरोप
  choice: आरोप को वक्ता का कथन बनाकर रखा गया
  alternative: उसे कथावाचक की पुष्टि के रूप में प्रस्तुत करना
  rationale: छल, झूठ और पूर्वजों की परंपरा से विमुख करने की बातें पात्र के आरोप हैं, ग्रंथकार की स्वतंत्र पुष्टि नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। वर्ग कोष्ठक पांडुलिपि की क्षति या संपादकीय पुनर्स्थापना दर्शाते हैं और मूल साक्ष्य के अनुरूप सुरक्षित रखे गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष कॉप्टिक स्रोत-समीक्षा अभी लंबित है, इसलिए शब्दगत निष्कर्ष अस्थायी माने जाएँ। नाम ‘अरिमानियोस’ का लिप्यंतरण किया गया है और पारंपरिक बाइबिलीय नामों के हिन्दी रूप ‘यूहन्ना’, ‘याकूब’ और ‘ज़ब्दी’ अपनाए गए हैं।
