    rationale: ‘Because what did he mean, saying to us’ का अर्थ यह पूछना है कि उसने इस कथन से क्या अभिप्राय किया; ‘क्योंकि जब उसने... तो उसका क्या अर्थ था’ वाक्य को शर्त/काल-रचना में बदल देता है और पुनर्स्थापित अंशों की संरचना धुंधली करता है।
