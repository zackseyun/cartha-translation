  naturalness: संशोधित पाठ आधुनिक मानक हिन्दी में सुबोध और गरिमापूर्ण है। जहाँ स्रोत की पुनर्निर्मित, कुछ असहज रचना को सुरक्षित रखना जरूरी है (विशेषकर 6:6–7:7), वहाँ हिन्दी को अनावश्यक रूप से सिद्धांतात्मक या अत्यधिक सहज बनाकर अर्थ नहीं बदला गया है।
  terminology: ‘उद्धारकर्ता’, ‘फ़रीसी’, ‘नासरी’, और ‘युग’ उपयुक्त हैं। ‘युग’ के लिए पादटिप्पणी आवश्यक है, क्योंकि aeon समय-अवधि और पारलौकिक अस्तित्व-क्षेत्र/व्यवस्था दोनों का संकेत कर सकता है। ‘अविनाशी युग’ स्रोत की शब्दावली के निकट है।
  issues:
  - severity: medium
    issue: वर्ग-कोष्ठकों की सीमाएँ कई पदों में स्रोत-साक्ष्य से असंगत हैं।
    rationale: स्रोत में कोष्ठक पांडुलिपि-क्षति अथवा संपादकीय पुनर्स्थापना दर्शाते हैं। 1:1 में ‘[of the] Savior’ और दूसरा ‘[and the] sayings’, 2:2 में केवल ‘[brother]’, तथा 5:5 में ‘I, [John]’ को हिन्दी में अधिक सटीक रूप से चिह्नित करना जरूरी है।
  - severity: medium
