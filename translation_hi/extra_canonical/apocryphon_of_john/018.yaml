translation:
  language: hi
  text: '**यूहन्ना का अपोक्रिफ़ॉन — आत्माओं की नियति**


    1. मैंने उद्धारकर्ता से यह भी पूछा, “प्रभु, तो क्या सभी आत्माओं को सकुशल शुद्ध प्रकाश में पहुँचाया जाएगा?”


    2. उसने मुझे उत्तर दिया, “तुम्हारे मन में गंभीर प्रश्न उठे हैं, क्योंकि इन्हें दूसरों को समझाना कठिन है—सिवाय उनके, जो अचल वंश से हैं।[a]


    3. जिन पर जीवन का आत्मा उतरेगा और जिन्हें वह सामर्थ्य देगा, वे उद्धार पाएँगे और सिद्ध हो जाएँगे। वे महानता के योग्य ठहरेंगे और वहाँ हर बुराई से, यहाँ तक कि बुराई में भाग लेने से भी, शुद्ध किए जाएँगे।


    4. इसलिए, अब से उनका ध्यान केवल अविनाशिता पर रहेगा। उनमें न क्रोध होगा, न डाह, न ईर्ष्या, न वासना और न किसी वस्तु का लालच। उन्हें केवल देह में रहने की दशा कष्ट देगी। वे उसे सहते हुए उस समय की आशा से प्रतीक्षा करेंगे, जब उन्हें ग्रहण करनेवाले उनका स्वागत करेंगे।[b]


    5. ऐसे लोग अविनाशी अनन्त जीवन और चुने जाने के योग्य हैं, क्योंकि वे हर बात का सामना करते और सब कुछ सहते हैं, ताकि दौड़ पूरी करके अनन्त जीवन के उत्तराधिकारी हों।”


    6. मैंने उससे पूछा, “प्रभु, जिन पर सामर्थ्य ‹और› जीवन का आत्मा उतरा था, पर जिन्होंने ये काम नहीं किए, क्या उनकी आत्माएँ [अस्वीकार कर दी जाएँगी]?”[c]


    7. उसने मुझे उत्तर दिया, “यदि आत्मा उन पर उतरा था, तो भी वे उद्धार पाएँगे और सुधर जाएँगे; क्योंकि सामर्थ्य सभी मनुष्यों पर उतरेगा, और उसके बिना कोई टिक नहीं सकता।


    8. पर जन्म लेने के बाद, जब जीवन का आत्मा बढ़ता है और सामर्थ्य आकर उस आत्मा को दृढ़ करता है, तब कोई भी उसे बुरे कामों से भटका नहीं सकेगा।


    9. लेकिन जिन पर झूठा आत्मा उतरता है, उन्हें वह घसीटता और भटका देता है।”


    10. मैंने पूछा, “प्रभु, जब उनकी आत्माएँ अपनी देह से निकल जाएँगी, तो कहाँ जाएँगी?”


    11. वह मुसकराया और मुझसे कहा, “जिस आत्मा में सामर्थ्य उस निकृष्ट आत्मा से अधिक प्रबल हो जाएगा—क्योंकि वह सामर्थ्यवान है और बुराई से भागती है—वह अविनाशी की मध्यस्थता से उद्धार पाएगी और ऊपर युगों के विश्राम में पहुँचाई जाएगी।”[d]


    12. मैंने पूछा, “प्रभु, जो यह नहीं जानते थे कि वे किसके हैं, उनकी आत्माएँ कहाँ रहेंगी?”


    13. उसने मुझसे कहा, “जब उनमें निकृष्ट आत्मा प्रबल हुआ, तो वे भटक गए। वह आत्मा को बोझ से दबाता और बुरे कामों की ओर घसीटता है; वह उसे विस्मृति में गिरा देता है। देह से निकलने के बाद वह आत्मा उन सत्ताओं के हवाले कर दी जाती है, जो शासक के द्वारा उत्पन्न हुई थीं। वे उसे जंजीरों से बाँधकर बन्दीगृह में डाल देते और तब तक अपने नियन्त्रण में रखते हैं, जब तक वह विस्मृति से जागकर ज्ञान प्राप्त नहीं कर लेती। यदि इस प्रकार वह सिद्ध हो जाती है, तो उद्धार पाएगी।”[e]


    14. मैंने पूछा, “प्रभु, आत्मा छोटी होकर अपनी माता की स्वाभाविक अवस्था में या मनुष्य में कैसे लौट सकती है?”[f]


    15. मेरे यह पूछने पर वह आनन्दित हुआ और मुझसे कहा, “सचमुच तुम धन्य हो, क्योंकि तुम यह समझ गए हो कि ऐसी आत्मा को किसी दूसरे के पीछे भेजा जाएगा, जिसमें जीवन का आत्मा वास करता है।[g]


    16. वह उसके द्वारा उद्धार पाएगी।


    17. उसे फिर किसी दूसरी देह में नहीं डाला जाएगा।”


    18. मैंने यह भी पूछा, “प्रभु, जो जान तो गए थे, पर फिर विमुख हो गए, उनकी आत्माएँ कहाँ जाएँगी?”


    19. उसने मुझसे कहा, “उन्हें उस स्थान पर ले जाया जाएगा जहाँ अभाव के दूत जाते हैं—उस स्थान पर जहाँ पश्चात्ताप का कोई अवसर नहीं। उन्हें उस दिन तक रोका जाएगा जब आत्मा की निन्दा करनेवाले यातना पाएँगे; और उन्हें युग-पर्यन्त दण्ड दिया जाएगा।”[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अचल वंश” इस ग्रन्थ का एक विशिष्ट पारिभाषिक पद है; इसका आशय उन लोगों से है जिनका सम्बन्ध अटल दिव्य लोक से माना गया है।
    reason: अपरिचित मिथकीय पद के लिए न्यूनतम पाठकीय सहायता।
  - marker: b
    text: “ग्रहण करनेवाले” सम्भवतः वे स्वर्गीय सत्ताएँ हैं जो आत्मा को ऊपर ग्रहण करती हैं; उनकी ठीक पहचान यहाँ नहीं दी गई है।
    reason: अस्पष्ट पारिभाषिक पद को बिना अति-व्याख्या समझाना।
  - marker: c
    text: ‹और› सम्पादक द्वारा जोड़ा गया शब्द है; [अस्वीकार कर दी जाएँगी] क्षतिग्रस्त या अस्पष्ट पाठ की पुनर्स्थापना है।
    reason: मूल साक्ष्य के सम्पादकीय संकेत सुरक्षित रखना।
  - marker: d
    text: “युग” यहाँ केवल समय-खंड नहीं, दिव्य लोकों या सत्ताओं का भी संकेत हो सकता है।
    reason: aeons की वास्तविक अर्थगत बहुलता सुरक्षित रखना।
  - marker: e
    text: “शासक” उस अधीनस्थ ब्रह्माण्डीय अधिकारी के लिए प्रयुक्त है जिससे अन्य सत्ताएँ उत्पन्न हुई बताई गई हैं।
    reason: archon के तकनीकी आशय का संक्षिप्त स्पष्टीकरण।
  - marker: f
    text: यह प्रश्न उपलब्ध साक्ष्य में कठिन और अस्पष्ट है; “छोटी होकर,” “माता की स्वाभाविक अवस्था,” और “मनुष्य में” के परस्पर सम्बन्ध निश्चित नहीं हैं।
    reason: पाठगत/अर्थगत कठिनाई को ईमानदारी से चिह्नित करना।
  - marker: g
    text: “किसी दूसरे के पीछे भेजा जाएगा” का आशय सम्भवतः ऐसी आत्मा का किसी आत्मिक व्यक्ति के साथ या उसके बाद जुड़ना है; उपलब्ध साक्ष्य निर्णायक नहीं है।
    reason: अस्पष्ट वाक्य को पुनर्जन्म-सिद्धान्त के रूप में अनावश्यक रूप से निश्चित करने से बचना।
  - marker: h
    text: “युग-पर्यन्त” स्रोत के काल-सूचक पद को दर्शाता है; वह अवधि यहाँ और अधिक स्पष्ट नहीं की गई है।
    reason: दण्ड की अवधि पर धार्मिक निष्कर्ष आरोपित न करना।
lexical_decisions:
- source_word: unmoving race
  choice: अचल वंश
  rationale: ग्रन्थ की विशिष्ट पारिभाषिक और मिथकीय भाषा को सामान्यीकृत किए बिना संक्षिप्त, स्वाभाविक हिन्दी में रखा गया।
- source_word: Spirit of life
  choice: जीवन का आत्मा
  rationale: ‘आत्मा’ के व्याकरणिक पुल्लिंग और व्यक्तिक क्रियाकलाप को बनाए रखते हुए पद का औपचारिक साम्य सुरक्षित किया गया।
- source_word: Greatness
  choice: महानता
  rationale: यह सम्भवतः एक विशिष्ट दिव्य सत्ता या क्षेत्र का पद है; इसलिए बड़े अक्षर का हिन्दी में उपलब्ध संकेत न होने पर शब्दशः रूप रखा गया।
- source_word: indestructibility / indestructible one
  choice: अविनाशिता / अविनाशी
  rationale: अमरतत्त्व और विनाश-असम्भवता की अवधारणा को एक ही शब्द-परिवार से व्यक्त किया गया।
- source_word: receivers
  choice: ग्रहण करनेवाले
