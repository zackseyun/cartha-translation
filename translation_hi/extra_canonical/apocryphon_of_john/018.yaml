  revised_text: '**यूहन्ना का अपोक्रिफ़ॉन — आत्माओं की नियति**


    1. मैंने उद्धारकर्ता से यह भी पूछा, “प्रभु, तो क्या सभी आत्माओं को सकुशल शुद्ध प्रकाश में पहुँचाया जाएगा?”


    2. उसने मुझे उत्तर दिया, “तुम्हारे मन में महान बातें उठी हैं, क्योंकि इन्हें दूसरों को समझाना कठिन है—सिवाय उनके, जो अचल वंश से हैं।[a]


    3. जिन पर जीवन का आत्मा उतरेगा और जिन्हें वह सामर्थ्य देगा, वे उद्धार पाएँगे और सिद्ध हो जाएँगे। वे महानता के योग्य होंगे, और वहाँ वे हर बुराई से, और बुराई में सहभागिता से भी, शुद्ध किए जाएँगे।


    4. इसलिए, क्योंकि उन्हें केवल अविनाशिता की ही चिन्ता है, जिस पर वे अब से ध्यान लगाएंगे, और उनमें न क्रोध, न डाह, न ईर्ष्या, न वासना, और न किसी वस्तु का लालच होगा, उन्हें देह में रहने की दशा के सिवा कोई बात परेशान नहीं करेगी। वे उस दशा को सहेंगे और उस समय की उत्सुकता से प्रतीक्षा करेंगे, जब ग्रहण करनेवाले उनका स्वागत करेंगे।[b]


    5. ऐसे लोग, फिर, अविनाशी अनन्त जीवन और चुने जाने के योग्य हैं, क्योंकि वे सब कुछ सहते और सब कुछ सहन करते हैं, ताकि संघर्ष पूरा करें और अनन्त जीवन के उत्तराधिकारी हों।”


    6. मैंने उससे पूछा, “प्रभु, जिन पर सामर्थ्य ‹और› जीवन का आत्मा उतरा था, पर जिन्होंने ये काम नहीं किए, क्या उनकी आत्माएँ [अस्वीकार कर दी जाएँगी]?”[c]


    7. उसने मुझे उत्तर दिया, “यदि आत्मा उन पर उतरा था, तो भी वे उद्धार पाएँगे और सुधर जाएँगे; क्योंकि सामर्थ्य सभी मनुष्यों पर उतरेगा, क्योंकि उसके बिना कोई टिक नहीं सकता।


    8. पर जन्म लेने के बाद, जब जीवन का आत्मा बढ़ता है और सामर्थ्य आकर उस आत्मा को दृढ़ करता है, तब कोई भी उसे बुरे कामों से भटका नहीं सकेगा।


    9. लेकिन जिन पर झूठा आत्मा उतरता है, उन्हें वह घसीटता और भटका देता है।”


    10. मैंने पूछा, “प्रभु, जब उनकी आत्माएँ अपनी देह से निकल जाएँगी, तो वे कहाँ जाएँगी?”


    11. वह मुसकराया और मुझसे कहा, “जिस आत्मा में सामर्थ्य उस निकृष्ट आत्मा से अधिक प्रबल हो जाएगा—क्योंकि वह बलवान है और बुराई से भागती है—वह अविनाशी के हस्तक्षेप से उद्धार पाएगी और ऊपर युगों के विश्राम में पहुँचाई जाएगी।”[d]


    12. मैंने पूछा, “प्रभु, जो यह नहीं जानते थे कि वे किसके हैं, उनकी आत्माएँ कहाँ रहेंगी?”


    13. उसने मुझसे कहा, “जब उनमें निकृष्ट आत्मा प्रबल हुआ, तो वे भटक गए; और वह आत्मा को दबाता और बुरे कामों की ओर घसीटता है, और उसे विस्मृति में गिरा देता है। उसके निकल जाने के बाद वह उन सत्ताओं के हवाले कर दी जाती है, जो शासक के द्वारा उत्पन्न हुई थीं। वे उसे जंजीरों से बाँधते, बन्दीगृह में डालते, और तब तक उसके साथ रहते हैं, जब तक वह विस्मृति से जागकर ज्ञान प्राप्त नहीं कर लेती। यदि इस प्रकार वह सिद्ध हो जाती है, तो उद्धार पाएगी।”[e]


    14. मैंने पूछा, “प्रभु, आत्मा छोटी होकर अपनी माता की स्वाभाविक अवस्था में या मनुष्य में कैसे लौट सकती है?”[f]


    15. मेरे यह पूछने पर वह आनन्दित हुआ और मुझसे कहा, “सचमुच तुम धन्य हो, क्योंकि तुम यह समझ गए हो कि ऐसी आत्मा को दूसरे का स्थान लेने के लिए नियुक्त किया जाएगा, जिसमें जीवन का आत्मा वास करता है।[g]


    16. वह उसके द्वारा उद्धार पाएगी।


    17. उसे फिर किसी दूसरी देह में नहीं डाला जाएगा।”


    18. मैंने यह भी पूछा, “प्रभु, जो जानते तो थे, पर फिर विमुख हो गए, उनकी आत्माएँ कहाँ जाएँगी?”


    19. उसने मुझसे कहा, “उन्हें उस स्थान पर ले जाया जाएगा जहाँ अभाव के दूत जाते हैं—उस स्थान पर जहाँ पश्चात्ताप नहीं है। उन्हें उस दिन तक रोका जाएगा जब आत्मा की निन्दा करनेवाले यातना पाएँगे; और उन्हें युग-पर्यन्त दण्ड दिया जाएगा।”[h]'
