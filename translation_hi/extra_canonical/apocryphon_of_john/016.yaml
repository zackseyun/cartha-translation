base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: hi
  text: 'तब प्रकाश की प्रतिछाया उसके भीतर छिप गई। प्रधान शासक उसे उसकी पसली में से निकालना चाहता था, पर प्रकाश की प्रतिछाया पकड़ से परे है।


    यद्यपि अंधकार ने उसका पीछा किया, फिर भी वह उसे पकड़ न सका। उसने उस मनुष्य में से उसकी शक्ति का एक अंश निकाला और स्त्री के रूप में एक दूसरा साँचा बनाया—उस प्रतिछाया की समानता के अनुसार, जो उसे दिखाई दी थी। फिर मनुष्य की शक्ति में से निकाले गए उस अंश को उसने स्त्री-साँचे के भीतर रख दिया—न कि, जैसा मूसा ने कहा, “उसकी पसली।” तब उसने उस स्त्री को अपने पास देखा।


    उसी क्षण दीप्तिमान प्रतिछाया भी प्रकट हुई। उसने उसके मन पर पड़ा परदा उठा दिया, और अंधकार के नशे के बाद वह फिर सचेत हो गया। उसने अपनी ही छवि के अनुरूप स्वरूप को पहचान लिया और कहा, “यह निश्चय मेरी हड्डियों में की हड्डी और मेरे मांस में का मांस है।


    इस कारण पुरुष अपने पिता और अपनी माता को छोड़ देगा और अपनी पत्नी से जुड़ा रहेगा, और वे दोनों एक देह हो जाएँगे,” क्योंकि उसकी संगिनी उसके पास भेजी जाएगी। वह अपने पिता और अपनी माता को छोड़ देगा—यहाँ तक कि हमारी बहन सोफिया को भी, जो अपनी कमी को सुधारने के लिए निष्कपटता में नीचे उतरी थी। इसी कारण वह “जीवन” कहलायी, जो “जीवितों की माता” है—स्वर्ग के प्रभुत्व की पूर्वदृष्टि और उसे दिखाई देने वाली [प्रतिछाया][a] के द्वारा। उसी के द्वारा उन्होंने पूर्ण ज्ञान का स्वाद चखा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिया गया “प्रतिछाया” उपलब्ध साक्ष्य में संपादकीय पुनर्स्थापन है; पांडुलिपि-पाठ यहाँ अपूर्ण या अनिश्चित है।
    reason: आपूर्ति किए गए अंग्रेज़ी साक्ष्य के वर्गाकार कोष्ठकों को पाठ-पुनर्स्थापन के संकेत के रूप में सुरक्षित रखना।
lexical_decisions:
- source_word: Reflection of Light
  choice: प्रकाश की प्रतिछाया
  rationale: ‘Reflection’ के प्रतिबिंबात्मक अर्थ और स्त्रीलिंग व्यक्तित्व—दोनों को बनाए रखता है; ‘चिंतन’ करने से दृश्य समानता का संबंध धुंधला पड़ता।
- source_word: chief archon
  choice: प्रधान शासक
  rationale: गूढ़ज्ञानवादी तकनीकी पद ‘archon’ का कार्यगत अर्थ देता है, जबकि किसी भारतीय धार्मिक पदावली को आरोपित नहीं करता।
- source_word: mold
  choice: साँचा
  rationale: निर्मित देह के नमूने अथवा ढाँचे की मूर्त छवि को सरल आधुनिक हिन्दी में बनाए रखता है।
- source_word: counterpart of his own image
  choice: अपनी ही छवि के अनुरूप स्वरूप
  rationale: यह न तो पूर्ण समानता को आवश्यकता से अधिक पुष्ट करता है, न ‘सहचरी’ के साथ अनावश्यक रूप से मिला देता है।
- source_word: Providence
  choice: पूर्वदृष्टि
  rationale: व्यक्तित्वयुक्त ब्रह्मांडीय ‘Providence’ के अर्थ को ‘प्रबंध’ तक सीमित किए बिना उसकी पूर्वज्ञानात्मक छाया बनाए रखता है।
- source_word: perfect knowledge
  choice: पूर्ण ज्ञान
  rationale: पाठ के ज्ञान-संबंधी उद्धारात्मक आशय को सहज और संप्रदाय-निरपेक्ष ढंग से व्यक्त करता है।
theological_decisions:
- issue: मूसा के उत्पत्ति-विवरण का प्रतिवाद
  choice: “न कि, जैसा मूसा ने कहा, ‘उसकी पसली’” को स्पष्ट रूप से बनाए रखा
  alternative: इसे केवल उत्पत्ति 2 का सामान्य संकेत मानकर नरम करना
  rationale: यह पाठ जानबूझकर पसली वाले वर्णन को अस्वीकार करता है; उस तनाव को मिटाना अनुचित होता।
- issue: सोफिया का अवतरण और कमी
  choice: ‘अपनी कमी को सुधारने के लिए निष्कपटता में नीचे उतरी’
  alternative: ‘पाप सुधारने’ या ‘पतन’ जैसे अधिक सिद्धांतगत शब्द
  rationale: साक्ष्य ‘innocence’ और ‘deficiency’ कहता है; नैतिक अपराध का अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
- issue: “mother or the living” की संदिग्ध रचना
  choice: “जीवितों की माता”
  alternative: “माता अथवा जीवित”
  rationale: उत्पत्ति 3:20 की प्रतिध्वनि और अंग्रेज़ी साक्ष्य की संभावित पाठगत अस्थिरता को देखते हुए अर्थपूर्ण वाक्यांश चुना गया, पर निश्चित मूल-पाठ समीक्षा लंबित है।
- issue: अंतिम वाक्य का कर्ता और संबंध
  choice: ‘उसी के द्वारा उन्होंने पूर्ण ज्ञान का स्वाद चखा’
  alternative: ‘उसके द्वारा उसने पूर्ण ज्ञान चखा’
  rationale: उपलब्ध साक्ष्य में बहुवचन ‘they’ है; उसके अस्पष्ट संदर्भ को स्पष्ट पहचान देकर नहीं बाँधा गया।
