  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। उत्पत्ति के उद्धरणों में हल्की शास्त्रीय लय रखी गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
