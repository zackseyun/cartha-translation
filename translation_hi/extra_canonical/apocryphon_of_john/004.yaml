  register: आधुनिक, गरिमापूर्ण और पठनीय हिंदी अपनाई गई है। वर्ग कोष्ठक पांडुलिपि की क्षति या संपादकीय पुनर्स्थापन दर्शाते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण कठिन सर्वनाम, तकनीकी शब्द और पुनर्स्थापित अंश सावधानी से रखे गए हैं।
