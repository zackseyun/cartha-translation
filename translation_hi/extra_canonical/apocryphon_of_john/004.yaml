translation:
  language: hi
  text: '1. इसका कारण यह है कि [हम अकथनीय बातों को] नहीं [समझते, और हम] उसे नहीं समझते [जिसे मापा नहीं जा सकता]—सिवाय उसके, जो उससे उत्पन्न हुआ, अर्थात् [पिता]। क्योंकि वही [अकेला] है जिसने हमें इसका [वर्णन किया]। वह अपने चारों ओर के प्रकाश के भीतर स्वयं को निहारता है—यह प्रकाश जीवित जल का सोता है—और वही [हर युग-मंडल] को प्रदान करता है। वह एक ही समय हर दिशा में [आत्मा] के सोते में दृष्टि लगाकर अपनी प्रतिमा [देखता] है।[a]


    2. वही अपनी अभिलाषा अपने [जलमय] प्रकाश में रखता है, [जो उस] [शुद्ध प्रकाशमय] जल के सोते में [निवास करता है] जो उसे घेरे हुए है। तब [उसका विचार, जो संभावना के रूप में था,] साकार हुआ, और वह स्त्री उसके निकट आई—[अर्थात्] वह, जो उसके प्रकाश की [दीप्ति के] भीतर उसके सामने [प्रकट हुई] थी।


    3. यही पहली [शक्ति है, जो] समस्त सृष्टि से पहले [विद्यमान थी] और उसके मन से [निकलकर आई]।[b]


    4. वह [समस्त सृष्टि की पूर्वदृष्टि है]—उसका प्रकाश [उसके प्रकाश के समान चमकता है]—वह [सिद्ध] शक्ति, जो सिद्ध, अदृश्य, कुँवारे आत्मा की प्रतिमा है।[c]


    5. [पहली शक्ति] बारबेलो की महिमा है—युग-मंडलों के भीतर सिद्ध महिमा, प्रकाशन की महिमा।[d]


    6. उसने कुँवारे आत्मा की महिमा की और उसी ने उसकी स्तुति की, क्योंकि उसी के कारण वह निकलकर आई थी।


    7. यही पहला विचार है—उसकी प्रतिमा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: खंड 1 का पाठ अनेक स्थानों पर क्षतिग्रस्त और संपादकीय रूप से पुनर्स्थापित है। सर्वनामों के संदर्भ तथा ‘उससे उत्पन्न हुआ, अर्थात् पिता’ की वाक्य-रचना अनिश्चित है।
    reason: पांडुलिपिगत पुनर्स्थापन और वास्तविक संदर्भगत अस्पष्टता बताना।
  - marker: b
    text: ‘समस्त सृष्टि’ उस अभिव्यक्ति का सहज हिंदी रूप है जिसका अर्थ ‘सब कुछ’, ‘समग्रता’ या संपूर्ण अस्तित्व भी हो सकता है।
    reason: the All की व्यापक तकनीकी अर्थ-सीमा सुरक्षित रखना।
  - marker: c
    text: ‘पूर्वदृष्टि’ के लिए अंतर्निहित शब्द का अर्थ पूर्वचिंतन, पूर्वज्ञान या दैवी व्यवस्था भी हो सकता है। यहाँ वह स्त्रीलिंगी व्यक्त सत्ता के रूप में प्रस्तुत है।
    reason: Providence/Pronoia की अर्थगत और व्यक्तिकृत प्रकृति स्पष्ट करना।
  - marker: d
    text: ‘युग-मंडल’ उस गूढ़ पद का अनुवाद है जो कालखंड के साथ-साथ दिव्य लोक या सत्ता का भी बोध करा सकता है। कुछ साक्ष्यों में इस वाक्य के बीच पांडुलिपि-पृष्ठ संख्या आती है, जिसे पाठ का अंश नहीं माना गया।
    reason: aeon का तकनीकी अर्थ और हटाई गई पृष्ठ-संख्या दर्ज करना।
lexical_decisions:
- source_word: aeon
  choice: युग-मंडल
  rationale: यहाँ शब्द केवल समय-युग नहीं, बल्कि गूढ़ विश्व-व्यवस्था के दिव्य क्षेत्र/सत्ता का संकेत दे सकता है। ‘युग-मंडल’ दोनों आयाम बनाए रखता है।
- source_word: spring
  choice: सोता
  rationale: जीवित या प्रकाशमय जल के उद्गम का ठोस बिंब बनाए रखने के लिए।
- source_word: Providence
  choice: पूर्वदृष्टि
  rationale: स्त्रीलिंगी व्यक्त सत्ता और पहले से विचार/व्यवस्था करने की धारणा को बनाए रखता है; सामान्य ‘प्रबंध’ से इसका वैचारिक संबंध अधिक स्पष्ट है।
- source_word: virginal Spirit
  choice: कुँवारा आत्मा
  rationale: आत्मा के लिए हिंदी में व्याकरणिक पुल्लिंग रूप रखते हुए ‘अकलुषित/अनुत्पन्न’ को व्याख्या के रूप में पाठ में आरोपित नहीं किया गया।
- source_word: the All
  choice: समस्त सृष्टि
  rationale: साधारण पाठक के लिए स्वाभाविक रूप, यद्यपि मूल अवधारणा समस्त अस्तित्व या पूर्णता को भी सूचित कर सकती है।
- source_word: Barbelo
  choice: बारबेलो
  rationale: विशिष्ट नाम का देवनागरी लिप्यंतरण किया गया, अनुवाद नहीं।
theological_decisions:
- issue: पिता से उत्पन्न पुरुष सत्ता की पहचान
  choice: ‘उसके, जो उससे उत्पन्न हुआ, अर्थात् पिता’ की कठिन संरचना को निकटता से रखा गया
  alternative: सर्वनामों को किसी विशिष्ट पुत्र या पिता के पक्ष में स्पष्ट करना
  rationale: प्राप्त साक्ष्य की वाक्य-संरचना अस्पष्ट है; किसी बाद की धर्मवैज्ञानिक पहचान को आरोपित नहीं किया गया।
- issue: दैवी विचार का स्त्रीलिंगी व्यक्तिकरण
  choice: ‘वह स्त्री’, ‘पहली शक्ति’ और ‘पूर्वदृष्टि’ के रूप में व्यक्तिकरण बनाए रखा
  alternative: इसे केवल निराकार ‘विचार’ कहना
  rationale: अंश में स्त्रीलिंगी सर्वनाम और बारबेलो की विशिष्ट व्यक्त सत्ता केंद्रीय हैं।
- issue: Barbelo और पहली शक्ति का संबंध
  choice: पाठ के अनुसार पहली शक्ति को बारबेलो की महिमा कहा
  alternative: बारबेलो को बिना भेद सीधे पहली शक्ति कहना
  rationale: उपलब्ध पाठ की कथन-रीति को सरल करके धर्मवैज्ञानिक समानता घोषित नहीं की गई।
- issue: virginal का अर्थ
  choice: शाब्दिक ‘कुँवारा’
  alternative: ‘अकलुषित’, ‘अनुत्पन्न’ या ‘कौमार्यवान’
  rationale: ये विकल्प संभावित व्याख्याएँ हैं; प्रत्यक्ष स्रोत-भाषा समीक्षा लंबित होने पर अर्थ को निर्णायक रूप से नहीं खोला गया।
