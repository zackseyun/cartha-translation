translation:
  language: hi
  text: '**यूहन्ना का गुप्त ग्रंथ — सत्ताधारी शक्तियाँ आदम की रचना करती हैं**


    1. फिर प्रकाश के द्वारा उन्होंने जल के भीतर उस प्रतिरूप का आकार देखा। तब उसने अपने पास उपस्थित सत्ताधारी शक्तियों से कहा, “आओ, हम परमेश्वर के प्रतिरूप के अनुसार और अपनी समानता के अनुसार एक मनुष्य बनाएँ, ताकि उसका प्रतिरूप हमारे लिए प्रकाश बन जाए।”


    2. फिर उन्होंने अपनी-अपनी शक्तियों के द्वारा, उन्हें सौंपे गए गुणों के अनुसार, उसकी रचना की। प्रत्येक सत्ताधारी शक्ति ने उस प्रतिरूप के आकार के आधार पर—जिसे उसने उसके साइकीक आयाम[a] में देखा था—एक गुण प्रदान किया।


    3. उसने सिद्ध आदि-मनुष्य की समानता के अनुसार एक प्राणी बनाया। तब उन्होंने कहा, “हम इसका नाम आदम रखें, ताकि इसका नाम हमारे लिए प्रकाश की शक्ति बन जाए।” तब वे शक्तियाँ अपना काम करने लगीं:


    4. पहली शक्ति, {भलाई:2}, ने जीवित हड्डी बनाई; और दूसरी, पूर्व-विधान ने जीवित नस बनाई।


    5. तीसरी, ईश्वरत्व ने जीवित मांस बनाया; और चौथी, प्रभुता ने जीवित मज्जा बनाई।


    6. पाँचवीं, राज्य ने जीवित रक्त बनाया।


    7. छठी, ईर्ष्या ने जीवित त्वचा बनाई।


    8. सातवीं, समझ ने जीवित बाल बनाए।


    9. पर स्वर्गदूतों का समुदाय उसकी सेवा में उपस्थित था। उन्होंने सत्ताधारी शक्तियों से जीवन-आत्मा के सात तत्त्व प्राप्त किए, ताकि वे अंगों और धड़ के माप तथा सभी अंगों का एक-दूसरे के साथ ठीक प्रकार से काम करना रच सकें।


    10. पहली शक्ति ने सिर बनाना आरंभ किया। एतेराफाओपे-अब्रोन ने उसका सिर बनाया; मेनिग्गेस्स्त्रोएथ ने मस्तिष्क; अस्तेरेख्मेन ने दाहिनी आँख; थास्पोमोखाम ने बाईं आँख; येरोनुमोस ने दाहिना कान; बिस्सूम ने बायाँ कान; अकिओरेइम ने नाक; बानेन-एफ्रूम ने होंठ; आमेन ने दाँत; इबिकान ने दाढ़ें; बासिलियादेमे ने गलग्रंथियाँ; अख्खा ने कंठललरी[b]; अदाबान ने गरदन; खाआमान ने कशेरुकाएँ; देआर्खो ने गला; तेबार ने दाहिना कंधा; न[..., ने] बायाँ कंधा; म्निआर्खोन ने दाहिनी कोहनी; [...ए ने] बाईं कोहनी; अबिल्रिओन ने दाहिनी बगल; एवान्थेन ने बाईं बगल; क्रिस ने दाहिना हाथ; बेलुआइ ने बायाँ हाथ; त्रेनेउ ने दाहिने हाथ की उँगलियाँ; बालबेल ने बाएँ हाथ की उँगलियाँ; क्रिमान ने हाथों के नाखून; अस्त्रोप्स ने दाहिना वक्ष; बार्रोफ ने बायाँ वक्ष; बाओउम ने दाहिने कंधे का जोड़; अरारिम ने बाएँ कंधे का जोड़; आरेखे ने पेट; फ्थावे ने नाभि; सेनाफिम ने उदर; अराखेथोपी ने दाहिनी पसलियाँ; जाबेदो ने बाईं पसलियाँ; बारिआस ने दाहिना कूल्हा; फ्नूथ ने बायाँ कूल्हा;


    अबेनलेनार्खेइ ने मज्जा; ख्नूमेनिनोरिन ने हड्डियाँ; गेसोले ने आमाशय; अग्रोमाउमा ने हृदय; बानो ने फेफड़े; सोस्त्रापाल ने यकृत; अनेसिमालार ने तिल्ली; थोपिथ्रो ने आँतें; बिब्लो ने गुर्दे; रोएरोर ने नसें; ताफ्रेओ ने शरीर की रीढ़; इपूस्पोबोबा ने शिराएँ; बिनेबोरिन ने धमनियाँ; आआतोइमेनप्सेफेइ—प्रत्येक अंग की साँस इन्हीं के अधीन है; एन्थोल्लेइआ ने सारा मांस; बेदूक ने दाहिना {निचला भाग:6}; अरबेएइ ने बायाँ लिंग; एइलो ने जुड़वाँ अंग; सोर्मा ने जननांग; गोर्मा-काइओख्लाबार ने दाहिनी जाँघ; नेब्रिथ ने बाईं जाँघ; प्सेरेम ने दाहिने पैर के गुर्दे; असाक्लास ने बायाँ गुर्दा; ओर्माओथ ने दाहिना पैर; एमेनून ने बायाँ पैर; क्निक्स ने दाहिनी पिंडली की हड्डी; तूपेलोन ने बाईं पिंडली की हड्डी; अखिएल ने दाहिना घुटना; फ्नेमे ने बायाँ घुटना; फिउथ्रोम ने दाहिना पाँव; बोआबेल ने उसकी उँगलियाँ; त्राखून ने बायाँ पाँव; फिक्ना ने उसकी उँगलियाँ; मिआमाइ ने पैरों के नाखून; लाबेर्निओउम ने [...] बनाया।


