lexical_decisions:
- source_word: ܗܠܝܢ
  choice: ये वही
  rationale: निकटवाची बहुवचन संकेत को स्वाभाविक हिन्दी में व्यक्त करता है और पहले देखे गए जल की ओर पुनः संकेत स्पष्ट करता है।
- source_word: ܩܒ̈ܝܐ
  choice: जल
  rationale: सन्दर्भ में बहुवचन ‘waters’ का सामूहिक, गरिमापूर्ण हिन्दी रूप; ‘पानियाँ’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: ܕܢܘܗܪܐ
  choice: उज्ज्वल
  rationale: ‘प्रकाश’ से जुड़े गुण को संक्षिप्त विशेषण में व्यक्त करता है और उजले/प्रकाशमय जल की छवि बनाए रखता है।
