  text: After these things a time will come when your people will fall into such distress that they will all be in danger of perishing together.
translation:
  language: hi
  text: इन बातों के बाद एक ऐसा समय आएगा, जब तुम्हारे लोग इतने बड़े संकट में पड़ेंगे कि उन सबके एक साथ नष्ट हो जाने का खतरा होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: इन बातों के बाद
  rationale: कालक्रम बताने वाले सीरियाई पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ܐܬܒܨܪܘ
  choice: संकट में पड़ेंगे
  rationale: उपलब्ध पाठ में अभाव, दबाव या दुर्दशा का भाव है; प्रसंग के अनुसार इसे सामान्य पाठक के लिए स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ܒܟܠ ܐܬܪ
  choice: उन सबके एक साथ
  rationale: स्रोत-पृष्ठ अत्यधिक खंडित है; परामर्श-पाठ में सुरक्षित सामूहिक संकट के भाव को हिन्दी में स्पष्ट रखा गया है।
theological_decisions:
- issue: लोगों के संभावित विनाश की निश्चितता
  choice: नष्ट हो जाने का खतरा होगा
  alternative: वे सब एक साथ नष्ट हो जाएँगे
  rationale: वाक्य को निश्चित भविष्यवाणी न बनाकर संकट और संभावित विनाश के रूप में रखा गया है, जिससे स्रोत-परंपरा में निहित तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज है। स्रोत-पृष्ठ खंडित तथा पद-विभाजन अनिश्चित होने के कारण अनावश्यक विशिष्टता से बचते हुए अंग्रेज़ी POB परामर्श-पाठ से पुष्टि की गई है।
