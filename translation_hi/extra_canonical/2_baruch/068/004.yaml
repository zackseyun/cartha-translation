lexical_decisions:
- source_word: ܒܙܒܢܐ ܗܘ
  choice: उस समय
  rationale: पूर्वसर्ग ܒ के साथ ܙܒܢܐ (‘समय’) और संकेतवाचक ܗܘ (‘उस’) किसी निश्चित समय की ओर संकेत करते हैं; इसलिए केवल ‘समय पर’ या ‘समय के साथ’ नहीं।
- source_word: joy (source sense reflected in the controlled verse alignment)
  choice: बहुत आनन्द
  rationale: हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से तीव्र प्रसन्नता व्यक्त करता है तथा अंग्रेज़ी परामर्श-पाठ के अर्थ से मेल खाता है।
theological_decisions:
- issue: समय-सूचक पद का युगान्त-संबंधी संकेत
  choice: उस समय
  alternative: समय आने पर
  rationale: संकेतवाचक पद किसी पहले से उल्लिखित विशिष्ट काल की ओर लौटता है; अनिश्चित या क्रमिक अर्थ देना उचित नहीं।
