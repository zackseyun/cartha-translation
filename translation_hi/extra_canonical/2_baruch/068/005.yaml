  yaml_path: translation/extra_canonical/2_baruch/068/005.yaml
  text: And at that time, after a short interval, Zion will be rebuilt, its offerings restored, and the priests will return to their ministry.
translation:
  language: hi
  text: और उस समय[a], कुछ समय बाद, सिय्योन फिर से बनाया जाएगा, उसकी भेंटें बहाल की जाएँगी, और याजक अपनी सेवा में लौट आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तब”।
    reason: काल-सूचक वाक्यांश का अधिक संक्षिप्त, घटनाक्रम-प्रधान अनुवाद भी सम्भव है।
lexical_decisions:
- source_word: ܒܗܘ ܙܒܢܐ
  choice: उस समय
  rationale: काल-सूचक संकेतवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है; यह केवल घटनाक्रम बताने वाले ‘तब’ से अधिक विशिष्ट है।
- source_word: Zion
  choice: सिय्योन
  rationale: स्थान के पारंपरिक और व्यापक रूप से पहचाने जाने वाले हिन्दी बाइबलीय नाम का प्रयोग किया गया है।
- source_word: offerings
  choice: भेंटें
  rationale: उपासना-संबंधी चढ़ावों के लिए सहज और पर्याप्त रूप से व्यापक शब्द है; स्रोत से अधिक विशिष्ट बलिदान-श्रेणी आरोपित नहीं करता।
- source_word: ministry
  choice: सेवा
  rationale: याजकों के धार्मिक कार्य को स्पष्ट और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सिय्योन के पुनर्निर्माण और उपासना की बहाली का स्वरूप
  choice: भविष्यकालीन कथन को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: इसे किसी विशेष ऐतिहासिक या अंतिम-कालीन पूर्ति से स्पष्ट रूप से जोड़ना
  rationale: पद स्वयं पूर्ति का समय या धार्मिक ढाँचा निश्चित नहीं करता; इसलिए उस तनाव को खुला रखा गया है।
- issue: भेंटों की बहाली
  choice: ‘भेंटें फिर से चढ़ाई जाएँगी’
  alternative: ‘बलिदान फिर से आरम्भ होंगे’
  rationale: ‘भेंटें’ व्यापक है और अनावश्यक रूप से किसी खास बलिदान-पद्धति तक अर्थ सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। ‘फिर बनाया जाएगा’, ‘फिर से चढ़ाई जाएँगी’ और ‘सेवा में लौट आएँगे’ से पुनर्स्थापना का भाव स्वाभाविक रूप में व्यक्त किया गया है।
