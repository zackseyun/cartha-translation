  text: 'And the twelfth bright waters that you saw—this is the word:'
translation:
  language: hi
  text: 1 और जो बारहवाँ उज्ज्वल जल तुमने देखा था—उसका अर्थ यह है:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘वचन यह है।’
    reason: सीरियाई व्याख्या-सूत्र की अधिक शाब्दिक सम्भावना सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: उज्ज्वल जल
  rationale: आवर्ती प्रतीकात्मक बिंब को बनाए रखता है और काले जल के साथ उसका विरोध स्पष्ट करता है।
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: उसका अर्थ यह है
  rationale: इस खंड में जल के दर्शन की व्याख्या आरम्भ करने वाले सामी सूत्र का स्वाभाविक हिन्दी रूप; शाब्दिक ‘यह वचन है’ आधुनिक पाठक के लिए आशय को अस्पष्ट कर सकता है।
theological_decisions:
- issue: व्याख्या-सूत्र का आशय
  choice: ‘उसका अर्थ यह है’ के रूप में दर्शन की आगामी व्याख्या का संकेत
  alternative: ‘वचन यह है’
  rationale: सूत्र यहाँ देखे गए जल का तात्पर्य बताने की भूमिका निभाता है; अनुवाद कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सरल शैली। ‘जल’ को प्रतीकात्मक सामूहिक संज्ञा के रूप में एकवचन रखा गया है। उपलब्ध पृष्ठ-पाठ में अध्यायों का अतिव्यापन है, इसलिए पद की पुनर्स्थापित नियंत्रण-परंपरा और परीक्षित व्याख्या-सूत्र को आधार बनाया गया है।
