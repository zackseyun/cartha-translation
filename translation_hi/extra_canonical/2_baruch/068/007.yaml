translation:
  language: hi
  text: किन्तु इन बातों के बाद बहुत-से राष्ट्र गिरेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: इन बातों के बाद
  rationale: यह कालक्रम सूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ܥܡܡ̈ܐ ܣܓܝ̈ܐܐ
  choice: बहुत-से राष्ट्र
  rationale: ‘राष्ट्र’ सामूहिक राजनीतिक-जातीय इकाइयों के अर्थ को आधुनिक हिन्दी में स्पष्ट रखता है; ‘बहुत-से’ बहुवचन परिमाण को व्यक्त करता है।
- source_word: ܢܦܠܘܢ
  choice: गिर पड़ेंगे
  rationale: ‘गिरना’ के मूल बिंब और उसके संभावित राजनीतिक अथवा विनाशकारी अर्थ की व्यापकता को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: राष्ट्रों के ‘गिरने’ का आशय
  choice: रूपक को ‘गिर पड़ेंगे’ के रूप में खुला रखा गया
  alternative: ‘नष्ट हो जाएँगे’ या ‘पराजित हो जाएँगे’
  rationale: स्रोत का क्रियापद पतन, पराजय या विनाश में से किसी एक अर्थ को अनिवार्य रूप से निश्चित नहीं करता; इसलिए अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘किन्तु’ विरोधसूचक संक्रमण को स्पष्ट करता है और भविष्यकाल भविष्यवाणी की शैली बनाए रखता है।
