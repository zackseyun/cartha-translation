translation:
  language: hi
  text: जातियाँ भी उसका आदर करने आएँगी, पर पहले जितना नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝܢܬܐ
  choice: उसका
  rationale: उपलब्ध अध्याय-पृष्ठ में ‘नगर’ का उल्लेख है, पर पद-सीमा अनिश्चित है; सर्वनाम रखकर पूर्ववर्ती संदर्भ को दोहराने या उससे अधिक स्पष्ट करने से बचा गया है।
- source_word: ܐܝܩܪܐ / ܝܩܪܗ
  choice: आदर
  rationale: सिरियाई शब्द सम्मान, प्रतिष्ठा या महिमा का भाव दे सकता है; इस प्रसंग में राष्ट्रों द्वारा किए जाने वाले व्यवहार के लिए ‘आदर’ स्वाभाविक और व्यापक है।
- source_word: ܡܢ ܩܕܝܡ
  choice: पहले जितना
  rationale: पूर्व अवस्था के साथ मात्रा या पूर्णता की तुलना को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसका’ किसके लिए प्रयुक्त है
  choice: सर्वनाम का संदर्भ खुला रखा गया
  alternative: ‘नगर का’ या किसी अन्य स्पष्ट संज्ञा का प्रयोग
  rationale: प्रदत्त स्रोत अध्याय-स्तरीय और पद-सीमा की दृष्टि से अनिश्चित है; इसलिए संदर्भ को कृत्रिम रूप से निश्चित नहीं किया गया।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी; स्रोत-पाठ की पद-सीमा संबंधी अनिश्चितता के कारण संक्षिप्तता और सर्वनामगत अस्पष्टता बनाए रखी गई है।
