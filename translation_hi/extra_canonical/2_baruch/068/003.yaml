translation:
  language: hi
  text: फिर भी वे बचाए जाएँगे, और उनके शत्रु उनके सामने गिर पड़ेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܦܪܩܘܢ (reconstructed verse wording)
  choice: बचाए जाएँगे
  rationale: उद्धार या संकट से बचाए जाने के निष्क्रिय अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܒܥܠܕܒܒܝܗܘܢ (reconstructed verse wording)
  choice: उनके शत्रु
  rationale: विरोधी या शत्रु के सामान्य सामूहिक अर्थ को स्पष्ट रूप से रखता है।
- source_word: ܢܦܠܘܢ ܩܕܡܝܗܘܢ (reconstructed verse wording)
  choice: उनके सामने गिर पड़ेंगे
  rationale: पराजय सूचित करने वाले स्थानिक मुहावरे को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: ‘बचाए जाएँगे’ का अभिकर्ता
  choice: अभिकर्ता को अव्यक्त रखा गया है
  alternative: परमेश्वर उन्हें बचाएगा
  rationale: निष्क्रिय वाक्य की अंतर्निहित अस्पष्टता को बनाए रखा गया है; पाठ में स्पष्ट न किए गए कर्ता को जोड़ा नहीं गया।
- issue: शत्रुओं के गिरने का अर्थ
  choice: ‘गिर पड़ेंगे’ का रूपक यथावत रखा गया है
  alternative: पराजित हो जाएँगे
  rationale: मूल की सजीव भाषा को सुरक्षित रखा गया है और मृत्यु अथवा केवल सैन्य पराजय में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। उपलब्ध सिरिएक पृष्ठ एक विस्तृत अध्याय-बकेट है और दिए गए अंश में पद-सीमा प्रत्यक्ष नहीं है; इसलिए अध्याय-संदर्भ, संशोधन-इतिहास और प्रमाणित अंग्रेज़ी परामर्श-पाठ के आधार पर 68:3 का पाठ चुना गया है।
