  register: आधुनिक मानक हिन्दी का गंभीर पर सहज प्रश्नात्मक गद्य। ‘घेरे रहेगा’ संकट की व्यापक और लगातार बनी रहने वाली बाध्यता का रूपक सुरक्षित रखता है; अनावश्यक धार्मिक पारिभाषिकता से बचा गया है।
