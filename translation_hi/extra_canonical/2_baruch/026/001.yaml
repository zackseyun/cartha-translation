  yaml_path: translation/extra_canonical/2_baruch/026/001.yaml
  text: And I answered and said, "Will that tribulation that is to come continue a long time, and will this necessity embrace many years?"
translation:
  language: hi
  text: तब मैंने उत्तर देकर कहा, “क्या वह आनेवाला क्लेश[a] बहुत समय तक बना रहेगा, और क्या यह विवशता अनेक वर्षों तक बनी रहेगी?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह क्लेश।”
    reason: पाठ-परंपरा में संकेतवाचक के निकटवाची रूप में अनुवाद की संभावना दर्ज करने के लिए; मुख्य पाठ में सिरियाई के दूरवाची संकेत ‘वह’ को प्राथमिकता दी गई है।
lexical_decisions:
- source_word: ܐܘܠܨܢܐ
  choice: क्लेश / संकट
  rationale: इस शब्द में दबाव, कष्ट और विपत्ति का व्यापक भाव है। पहले प्रयोग में ‘क्लेश’ सर्वनाश-संबंधी गंभीरता रखता है; समानार्थी पुनरावृत्ति को स्वाभाविक हिन्दी में व्यक्त करने के लिए दूसरे वाक्यांश में ‘संकट’ रखा गया है।
- source_word: ܗܘ̇ ܕܐܬܝ̇
  choice: आनेवाला वह
  rationale: दूरवाची संकेतवाचक ܗܘ̇ को ‘वह’ और कृदंत ܕܐܬܝ̇ को ‘आनेवाला’ से व्यक्त किया गया है।
- source_word: ܡܣܘܟ
  choice: लंबे समय तक बना रहेगा
  rationale: संदर्भ में यह क्लेश के लंबे समय तक जारी रहने की अवधि पूछता है; यह हिन्दी में स्वाभाविक रहते हुए मूल आशय को सुरक्षित रखता है।
- source_word: ܡܢܝ ܣܓܝ̈ܐܬܐ
  choice: कई वर्षों तक
  rationale: पाठ के प्रश्न का दूसरा भाग संकट की बहुवर्षीय अवधि बताता है; उपलब्ध पाठ-साक्ष्य और नियंत्रक परंपरा के अनुरूप इसे स्पष्ट, साधारण हिन्दी में रखा गया है।
