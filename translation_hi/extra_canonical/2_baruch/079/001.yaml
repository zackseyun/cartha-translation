translation:
  language: hi
  text: इसलिए सिय्योन के लिए शोक करो और यरूशलेम के लिए आह भरो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध सिरिएक पृष्ठ-संग्रह में अध्याय-सीमा खिसकी हुई है और वहाँ मुख्यतः पिछले अध्याय की सामग्री दिखाई देती है; यहाँ 79:1 की नियंत्रित पद-पहचान के अनुसार पाठ दिया गया है।
    reason: source_alignment
lexical_decisions:
- source_word: ܐܬܐܒܠܘܢ
  choice: शोक करो
  rationale: यह क्रिया गहरे विलाप या मातम का भाव व्यक्त करती है; आधुनिक हिन्दी में ‘शोक करो’ गरिमापूर्ण और सहज है।
- source_word: ܨܗܘ / sigh
  choice: आह भरो
  rationale: यह दुःख की शारीरिक और भावात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ܨܗܝܘܢ / ܐܘܪܫܠܡ
  choice: सिय्योन / यरूशलेम
  rationale: इन पारंपरिक स्थान-नामों के प्रचलित हिन्दी रूप रखे गए हैं और उनके बीच का काव्यात्मक समानांतर भी सुरक्षित है।
theological_decisions:
- issue: सिय्योन और यरूशलेम का संबंध
  choice: दोनों नामों को अलग-अलग रखते हुए समानांतर शोक-वाक्य के रूप में प्रस्तुत किया गया है।
  alternative: दोनों को एक ही नगर के पर्याय मानकर एक में मिला देना।
  rationale: पाठ एक ही पवित्र नगर की परस्पर संबंधित छवियाँ सामने रख सकता है, पर उसकी दोहरी काव्यात्मक अभिव्यक्ति को मिटाना उचित नहीं होगा।
translation_notes:
  register: भाषा संक्षिप्त, काव्यात्मक और शोकपूर्ण रखी गई है। ‘शोक करो’ तथा ‘आह भरो’ आधुनिक मानक हिन्दी में स्वाभाविक हैं और मूल की समानांतर आज्ञाओं को बनाए रखते हैं।
