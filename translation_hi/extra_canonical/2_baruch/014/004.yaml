  text: 'But I will speak before you: What more have those who knew you and did not walk in vanity like the rest of the nations gained?'
translation:
  language: hi
  text: 'पर मैं आपके सामने यह कहूँगा: जिन्होंने आपको जाना और बाकी जातियों की तरह[a] व्यर्थता के मार्ग पर नहीं चले, उन्हें क्या अधिक लाभ हुआ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाकी लोगों की तरह।”
    reason: तुलना का दायरा ‘जातियों’ अथवा अधिक सामान्य ‘बाकी लोगों’ के रूप में समझा जा सकता है; पाठगत अभिव्यक्ति की यह सूक्ष्मता सुरक्षित रखी गई है।
lexical_decisions:
- source_word: ܐܡܠܠ ܩܕܡܝܟ
  choice: मैं आपके सामने यह कहूँगा
  rationale: ‘बोलना/कहना’ और ‘आपके सामने’ का सीधा अर्थ रखते हुए हिन्दी में स्वाभाविक वाक्य बनाया गया है।
- source_word: ܡܢܐ ܝܬܝܪ
  choice: इससे अधिक क्या लाभ हुआ
  rationale: शाब्दिक अर्थ ‘और/अधिक क्या’ है; प्रसंग में निहित ‘लाभ’ को स्पष्ट करना प्रश्न का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܗ̇ܢܘܢ ܕܝܕܥܘ
  choice: जिन्होंने आपको जाना
  rationale: यह केवल जानकारी रखने के बजाय परमेश्वर को पहचानने/जानने का संबंधपरक भाव बनाए रखता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
- source_word: ܒܣܪܝܩܘܬܐ / ܗܒܠܐ
  choice: व्यर्थता के मार्ग पर
  rationale: मूल का ‘व्यर्थता’ संबंधी भाव सुरक्षित रखा गया है; ‘मार्ग पर चलना’ हिन्दी में नैतिक जीवन-चाल का स्वाभाविक रूप है।
- source_word: ܥܡ̈ܡܐ
  choice: जातियों
  rationale: यहाँ तुलना अन्य राष्ट्रों/गैर-इस्राएली जातियों से है; ‘जातियाँ’ बाइबलीय संदर्भ में सामान्य और संक्षिप्त हिन्दी है।
theological_decisions:
- issue: परमेश्वर को संबोधित करने का रूप
  choice: आप/आपके
  alternative: तू/तेरे
  rationale: आधुनिक मानक हिन्दी में आदरपूर्ण और सर्वसुलभ संबोधन चुना गया है; इससे मूल के सीधे संबोधन का अर्थ नहीं बदलता।
- issue: धर्मनिष्ठ लोगों के लाभ पर प्रश्न
  choice: प्रश्न की तनावपूर्ण और खुली प्रकृति बनाए रखी
  alternative: उन्हें कोई लाभ नहीं हुआ—ऐसा घोषणात्मक रूप
  rationale: मूल प्रश्न उठाता है; उसका उत्तर जोड़ना या निराशावादी निष्कर्ष निश्चित कर देना धर्मवैज्ञानिक तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यर्थता के मार्ग पर चलना’ मूल रूपक को बचाते हुए सहज हिन्दी देता है; प्रश्नवाचक संरचना मूल की शिकायत और धर्मवैज्ञानिक तनाव को बनाए रखती है।
