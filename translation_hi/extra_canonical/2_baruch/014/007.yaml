translation:
  language: hi
  text: हे प्रभु, कौन आपके न्याय को जानता है? और कौन आपके मार्ग की गहराई को खोज सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܟ (dīnak)
  choice: आपके न्याय
  rationale: यहाँ शब्द का अर्थ प्रभु का न्याय अथवा न्याय-निर्णय है; संदर्भ में संक्षिप्त और स्वाभाविक रूप से “न्याय” रखा गया है।
- source_word: ܥܘܡܩܐ ܕܐܘܪܚܟ (ʿumqā d-urḥāk)
  choice: आपके मार्ग की गहराई
  rationale: “गहराई” को बनाए रखने से ईश्वरीय मार्ग की अगम्यता का मूल रूपक सुरक्षित रहता है।
- source_word: ܒܥܐ / ܒܨܐ (खोजने/पता लगाने का भाव)
  choice: पता लगा सकता है
  rationale: यह हिंदी में किसी अगम बात की पूरी छानबीन कर जान लेने का स्वाभाविक भाव देता है।
theological_decisions:
- issue: ईश्वर के न्याय और मार्ग की अगम्यता
  choice: दो अलंकारिक प्रश्नों को खुला रखा गया है
  alternative: कोई भी आपके न्याय या मार्ग को नहीं जान सकता
  rationale: मूल पाठ निष्कर्ष को कथन बनाकर नहीं देता, बल्कि प्रश्नों द्वारा मानवीय सीमितता और ईश्वरीय अगम्यता का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सम्मानसूचक “आपके” के साथ प्रार्थनात्मक और गरिमापूर्ण शैली। “मार्ग की गहराई” का मूल रूपक अक्षुण्ण रखा गया है।
