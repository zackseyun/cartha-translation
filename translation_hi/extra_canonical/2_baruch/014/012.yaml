translation:
  language: hi
  text: परन्तु धर्मी अन्त की आशा उचित ही रख सकते हैं, और वे इस निवास से निडर होकर विदा होते हैं, क्योंकि आपके पास उनके कर्मों का एक भंडार खजानों में सुरक्षित रखा हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܕܝ̈ܩܐ (अंग्रेज़ी परामर्श-पाठ से पुनर्निर्मित प्रसंगगत पद)
  choice: धर्मी लोग
  rationale: धार्मिक-नैतिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘धर्मात्मा’ की अपेक्षा सामूहिक संदर्भ में अधिक स्वाभाविक है।
- source_word: ܣܒܪ / ܣܟܝ (आशा करना)
  choice: आशा ... रख सकते हैं
  rationale: भविष्य के अन्त की ओर विश्वासपूर्ण प्रत्याशा का भाव बनाए रखता है।
- source_word: ܫܘܠܡܐ
  choice: अन्त
  rationale: यह पद समाप्ति या परिपूर्णता दोनों का संकेत दे सकता है; मुख्य पाठ में संक्षिप्त और अस्पष्टता-संरक्षक ‘अन्त’ चुना गया है।
- source_word: ܥܘܡܪܐ / ܡܥܡܪܐ (प्रसंगगत)
  choice: निवास
  rationale: सांसारिक जीवन या देह का अर्थ निश्चित किए बिना रहने के वर्तमान स्थान का रूपक सुरक्षित रहता है।
- source_word: ܣܝܡܬܐ / ܓܙ̈ܐ (प्रसंगगत)
  choice: भंडार ... खजानों में सुरक्षित
  rationale: कर्मों के संचित और सुरक्षित होने की दोहरी चित्रात्मकता को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘कर्मों का भंडार’ और प्रतिफल का संबंध
  choice: पाठ के संचित कर्मों वाले रूपक को यथावत रखा गया
  alternative: इसे सीधे ‘स्वर्गीय पुरस्कार’ या ‘उद्धार का पुण्य’ कहना
  rationale: मूल कथन को किसी विशिष्ट पुण्य-सिद्धान्त या उद्धार-व्याख्या में नहीं बदला गया।
- issue: ‘अन्त’ का आशय
  choice: केवल ‘अन्त’
  alternative: ‘जीवन का अन्त’, ‘युग का अन्त’ या ‘अन्तिम न्याय’
  rationale: उपलब्ध स्रोत-साक्ष्य किसी एक आशय को निर्णायक नहीं बनाता; अतः वास्तविक अर्थगत तनाव सुरक्षित रखा गया।
- issue: द्वितीय पुरुष ‘आपके पास’ का संबोधन
  choice: आदरपूर्ण एकवचन ‘आपके पास’
  alternative: स्पष्ट रूप से ‘हे परमेश्वर, आपके पास’
  rationale: अंतर्निहित संबोधन को अनावश्यक रूप से नाम देकर स्पष्ट नहीं किया गया।
