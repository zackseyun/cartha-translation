  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। उपलब्ध सिरिएक पृष्ठांश में लक्षित पद स्पष्ट रूप से पृथक नहीं दिखता और अध्याय-बकेट अनुमानित है; इसलिए अंग्रेज़ी POB को परामर्श-पाठ मानते हुए उसके कथन को सावधानी से प्रस्तुत किया गया है, बिना अतिरिक्त धर्मसैद्धान्तिक विस्तार के।
