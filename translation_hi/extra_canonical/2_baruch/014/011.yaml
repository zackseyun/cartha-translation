  yaml_path: translation/extra_canonical/2_baruch/014/011.yaml
  text: 'For as a breath rises without intention and vanishes, so is the nature of men: they do not go by their own will, and they do not know what will happen to them in the end.'
translation:
  language: hi
  text: 'क्योंकि जैसे एक साँस बिना किसी इरादे के उठती और लुप्त हो जाती है, वैसे ही मनुष्यों का स्वभाव है: वे अपनी इच्छा से नहीं चलते और नहीं जानते कि अंत में उनके साथ क्या होगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܒܠܐ
  choice: साँस
  rationale: यह शब्द साँस, वाष्प या क्षणभंगुर भाप का बिंब दे सकता है। यहाँ उठने और लुप्त हो जाने के संदर्भ में ‘साँस’ मूल रूपक और मनुष्य के क्षणभंगुर जीवन—दोनों को सहज रूप से व्यक्त करती है।
- source_word: ܨܒܝܢܐ / इच्छा-संबंधी पदबंध
  choice: अपनी इच्छा से
  rationale: मनुष्य के मार्ग या गति पर उसके स्वतंत्र नियंत्रण के अभाव को स्पष्ट रखते हुए कथन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܫܘܠܡܐ
  choice: अंत में
  rationale: ‘अंत’ या ‘परिणति’ के अर्थ को बिना यह तय किए सुरक्षित रखता है कि आशय केवल मृत्यु से है या व्यापक अंतिम दशा से।
theological_decisions:
- issue: मानवीय इच्छा और नियंत्रण
  choice: ‘वे अपनी इच्छा से नहीं चलते’—मूल कथन की तीव्रता बनाए रखी गई।
  alternative: ‘उनका जीवन पूरी तरह उनके नियंत्रण में नहीं होता।’
  rationale: वैकल्पिक रूप कथन को नरम और व्याख्यात्मक बना देता। चुना हुआ अनुवाद मानवीय स्वायत्तता के विषय में पाठ के तनाव को बिना किसी संप्रदायगत निष्कर्ष के सुरक्षित रखता है।
- issue: ‘अंत’ का आशय
  choice: ‘अंत में उनके साथ क्या होगा’
  alternative: ‘अंततः उनका भाग्य क्या होगा’
  rationale: ‘भाग्य’ नियतिवाद का अतिरिक्त भाव ला सकता है। चुना हुआ रूप भविष्य की अज्ञात परिणति को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘साँस’ के उठने का काव्यात्मक बिंब जानबूझकर सुरक्षित रखा गया है।
