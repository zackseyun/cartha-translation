translation:
  language: hi
  text: और अब मैं जानता हूँ कि बहुतों ने पाप किया और जीवित रहे, और उन दिनों केवल थोड़े ही लोग बचेंगे, जिनसे ये बातें कही जा सकेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܕܥܬ
  choice: मैं जानता हूँ
  rationale: यह क्रिया ज्ञान या बोध को व्यक्त करती है; इसे विचार करने अथवा कहने के अर्थ में नहीं लिया गया।
- source_word: ܣܓܝܐܝܢ
  choice: बहुतों ने
  rationale: बहुसंख्यक लोगों के लिए स्वाभाविक आधुनिक हिन्दी प्रयोग।
- source_word: ܚܛܘ
  choice: पाप किया
  rationale: नैतिक-धार्मिक अपराध के मूल अर्थ को सीधे बनाए रखता है।
- source_word: ܚܝܘ
  choice: जीवित रहे
  rationale: मूल के संक्षिप्त कथन को बनाए रखता है और यह नहीं बताता कि उनका जीवित रहना दण्ड से बचना था या केवल जीवन जारी रहना।
- source_word: ܡܫܬܚܪܝܢ
  choice: बचेंगे
  rationale: उन समयों में थोड़े लोगों के शेष रह जाने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: ܡܠ̈ܐ
  choice: बातें
  rationale: संदर्भ में बोले जाने वाले वचनों या कथनों के लिए सरल और स्वाभाविक शब्द।
theological_decisions:
- issue: पाप करने वालों का जीवित रहना
  choice: “पाप किया और जीवित रहे” को बिना व्याख्या के रखा गया
  alternative: “पाप करने पर भी जीवित रहे” या “दण्ड से बचे रहे”
  rationale: मूल कथन पाप और जीवन के बीच संबंध को स्पष्ट नहीं करता; व्याख्यात्मक शब्द जोड़ने से न्याय और सहनशीलता के बीच निहित तनाव अनावश्यक रूप से सुलझ जाता।
- issue: अंतिम काल में बचे हुए लोग
  choice: “उन दिनों केवल थोड़े ही लोग बचेंगे”
  alternative: “उन समयों में कुछ लोग शेष रहेंगे”
  rationale: यह संख्या की अल्पता और भविष्यकाल दोनों को स्पष्ट रखता है, बिना बचे हुए लोगों की धार्मिक पहचान निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। वाक्य की दो समानांतर धाराएँ मूल के विरोध—बहुतों ने पाप किया और जीवित रहे, पर भविष्य में थोड़े ही बचेंगे—को बनाए रखती हैं।
