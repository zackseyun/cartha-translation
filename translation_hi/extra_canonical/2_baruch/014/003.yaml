translation:
  language: hi
  text: क्योंकि इसमें क्या लाभ है? या इन बातों से, जिन्हें हम देख रहे हैं, अधिक बुरा क्या है, जिसे देखने की हम इच्छा करते और प्रतीक्षा करते हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “इन बातों से, जिन्हें हम देख रहे हैं, अधिक बुरा क्या है, जिसे देखने की हम इच्छा और आशा करते हैं?”'
    reason: सीरियाई मूल में ‘इच्छा करना’, ‘प्रतीक्षा/आशा करना’ और ‘देखना’ की क्रमिक रचना असामान्य है। अंतिम क्रिया का अर्थ ‘प्रतीक्षा करना’ या ‘आशा/अपेक्षा करना’ हो सकता है।
lexical_decisions:
- source_word: ܝܘܬܪܢܐ (yūtrānā)
  choice: लाभ
  rationale: यह शब्द लाभ, फ़ायदा या उपयोगिता का बोध कराता है; आधुनिक मानक हिन्दी में ‘लाभ’ संक्षिप्त और गरिमापूर्ण है।
- source_word: ܕܒܝܫ (d-bīš)
  choice: उससे बुरा
  rationale: तुलनात्मक रचना ܡܢ ܗܠܝܢ के साथ इसका अर्थ ‘इन बातों से बुरा’ है।
- source_word: ܕܨܒܝܢ ܡܣܟܢܝܢ ܕܢܚܙܘܢ
  choice: कि हम उसे देखने की इच्छा से प्रतीक्षा करें
  rationale: मूल में ‘इच्छा करना’ और ‘प्रतीक्षा/आशा करना’ दोनों क्रियाएँ ‘देखने’ से जुड़ी हैं। हिन्दी में अर्थग्रहण योग्य रहते हुए इस असामान्य क्रिया-श्रृंखला को यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: दुःख के अनुभव और आगे की प्रतीक्षा के बीच वक्तृता-संबंध
  choice: प्रश्न को खुला और व्यथित वक्तृता-प्रश्न बनाए रखा गया
  alternative: इसे निश्चित कथन बनाना कि भविष्य अनिवार्य रूप से अधिक बुरा होगा
  rationale: मूल पाठ लाभ और अधिक बुरी बात देखने की प्रतीक्षा पर प्रश्न उठाता है; वह यहाँ किसी विशिष्ट भविष्यवाणी या धर्मसैद्धांतिक निष्कर्ष को स्पष्ट रूप से स्थापित नहीं करता।
