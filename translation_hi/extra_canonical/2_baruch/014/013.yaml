translation:
  language: hi
  text: इसलिए वे बिना डरे इस संसार से चले जाते हैं, और भरोसे और आनन्द के साथ उस संसार को पाने की प्रतीक्षा करते हैं, जिसकी प्रतिज्ञा तूने उनसे की है…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भरोसा रखते हुए, आनन्द के साथ प्रतीक्षा करते हैं।”
    reason: सिरिएक में भरोसे का पद क्रियाविशेषण की तरह समझा जा सकता है; वैकल्पिक अन्वय को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: ܬܟܝܠܐܝܬ (पाठ में क्रियाविशेषणात्मक रूप)
  choice: भरोसे के साथ
  rationale: सिरिएक भाव भरोसे या निश्चय के साथ प्रतीक्षा करने का है; सहज आधुनिक हिन्दी में क्रियाविशेषणात्मक अर्थ सुरक्षित रखा गया है।
- source_word: ܒܚܕܘܬܐ
  choice: आनन्द के साथ
  rationale: ‘आनन्द’ मूल के हर्षपूर्ण भाव को गरिमापूर्ण और सामान्य हिन्दी में व्यक्त करता है।
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: वर्तमान और प्रतिज्ञात भावी व्यवस्था—दोनों के लिए समान शब्द रखकर मूल का वैचारिक समांतर सुरक्षित किया गया है।
- source_word: ܡܣܟܝܢ
  choice: प्रतीक्षा करते हैं
  rationale: यह अपेक्षापूर्ण बाट जोहने का भाव देता है, पर हिन्दी में अनावश्यक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: प्रतिज्ञात भावी संसार की प्रकृति
  choice: उस संसार को पाने की प्रतीक्षा
  alternative: आनेवाले युग में प्रवेश करने की प्रतीक्षा
  rationale: मूल की ‘संसार/युग’ संबंधी व्यापकता को किसी विशेष अंत-कालीन ढाँचे में सीमित नहीं किया गया।
- issue: ईश्वर के लिए द्वितीय पुरुष संबोधन
  choice: तूने
  alternative: आपने
  rationale: प्रार्थना-संदर्भ में निकट, एकवचन और पारंपरिक बाइबिलीय संबोधन रखा गया है; इससे अनादर अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए सहज, पर प्रार्थनात्मक और गरिमापूर्ण शैली। पद के खंडित स्रोत-संदर्भ के कारण उपलब्ध सिरिएक साक्ष्य और परीक्षित अंग्रेज़ी परामर्श-पाठ दोनों का सावधानी से उपयोग किया गया है।
