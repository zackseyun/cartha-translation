  text: Then I answered and said, “Behold, you have shown me the course of the times, and what is to happen after these things, and you have told me that the retribution which was spoken of by you will come upon the nations.
translation:
  language: hi
  text: तब मैंने उत्तर दिया, “देख, तूने मुझे समयों का क्रम और इन बातों के बाद जो कुछ होनेवाला है, दिखाया है। और तूने मुझे बताया है कि वह प्रतिफल, जिसके विषय में तूने कहा था, जातियों पर आएगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तूने मुझे आने वाले प्रतिफल के विषय में बताया है।”
    reason: वाक्य-संबंध की एक संक्षिप्त वैकल्पिक समझ को दर्ज करता है; मुख्य पाठ अधिक पूर्ण पाठ-साक्ष्य के अनुसार पहले कही गई घोषणा और जातियों पर उसके आने—दोनों को सुरक्षित रखता है।
lexical_decisions:
- source_word: ܐܘܪܚܐ
  choice: क्रम
  rationale: मूल शब्द का सामान्य अर्थ ‘मार्ग’ है, पर यहाँ समयों के व्यवस्थित प्रवाह का आशय है; ‘समयों का क्रम’ इसे सहज और स्पष्ट रूप में व्यक्त करता है।
- source_word: ܦܘܪܥܢܐ
  choice: प्रतिफल
  rationale: यह शब्द किए गए कर्म के न्यायिक प्रत्युत्तर या बदले को सूचित करता है। ‘प्रतिफल’ दण्डात्मक संदर्भ को खुला रखता है और इसे केवल सामान्य परिणाम तक सीमित नहीं करता।
- source_word: ܥܡܡ̈ܐ
  choice: जातियाँ
  rationale: बहुवचन शब्द इस्राएल से बाहर की जातियों अथवा राष्ट्रों को सूचित करता है; ‘जातियाँ’ बाइबलीय संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: प्रतिफल की न्यायिक प्रकृति
  choice: वह प्रतिफल ... जातियों पर आएगा
  alternative: आने वाला दण्ड जातियों पर पड़ेगा
  rationale: ‘प्रतिफल’ मूल के प्रतिदान और न्याय—दोनों पहलुओं को बनाए रखता है, जबकि ‘दण्ड’ अर्थ को कुछ अधिक संकीर्ण कर देता।
- issue: प्रतिफल के विषय में पहले परमेश्वर द्वारा कहा जाना
  choice: जिसके विषय में तूने कहा था
  alternative: जो तेरे द्वारा कहा गया था
  rationale: कर्तृवाच्य हिंदी में अधिक स्वाभाविक है और साथ ही यह बात स्पष्ट रखता है कि इस प्रतिफल की घोषणा परमेश्वर ने पहले ही की थी।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। परमेश्वर को संबोधन में निकट और एकवचन ‘तू’ रखा गया है। ‘देख’ उद्घोषणात्मक ܗܐ के स्वाभाविक हिंदी समकक्ष के रूप में प्रयुक्त है।
