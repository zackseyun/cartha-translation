translation:
  language: hi
  text: जिन्होंने मरे हुओं की व्यर्थता[a] की खोज नहीं की, बल्कि तुझे चाहा और अपने हृदयों को छोटी और बीत जानेवाली बातों की ओर नहीं मोड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, ‘मरे हुओं को नहीं खोजा’; लेकिन सिरियाई पाठ में ‘व्यर्थता’ शब्द उपस्थित है।
    reason: संबंधवाचक वाक्यांश की संभावित वैकल्पिक समझ को दर्ज करते हुए स्रोत के संज्ञा-पद को स्पष्ट करना।
lexical_decisions:
- source_word: ܣܪܝܩܘܬܐ ܕܡܝ̈ܬܐ (sriqutha d-mithe)
  choice: मरे हुओं की व्यर्थता
  rationale: ‘व्यर्थता/खोखलापन’ संज्ञा को बनाए रखता है; केवल ‘मरे हुओं को’ कहना स्रोत के एक अर्थपूर्ण पद को हटा देगा।
- source_word: ܨܒܘ (ṣbaw)
  choice: चाहा
  rationale: ईश्वर की ओर इच्छा और अभिलाषा का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: छोटी और बीत जानेवाली वस्तुओं के लिए प्रयुक्त स्रोत-वाक्यांश
  choice: छोटी और मिट जानेवाली बातों
  rationale: मानवीय जीवन की तुच्छता और अस्थायित्व दोनों को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘मरे हुओं की व्यर्थता’ का आशय
  choice: मुख्य पाठ में संबंधवाचक संरचना को ज्यों का त्यों खुला रखा
  alternative: मरे हुओं को खोजना
  rationale: स्रोत में ‘व्यर्थता’ संज्ञा उपस्थित है; यह वाक्य मृतकों से जुड़ी व्यर्थता, उनके निष्फल मार्ग, या मृत्यु की नश्वर दशा की ओर संकेत कर सकता है। किसी एक धार्मिक व्याख्या को थोपना उचित नहीं।
- issue: ईश्वर को संबोधन
  choice: ‘तुझे’
  alternative: ‘आपको’
  rationale: प्रार्थनात्मक बाइबलीय संबोधन में एकवचन निकटता और स्रोत के प्रत्यक्ष द्वितीय-पुरुष संबोधन को बनाए रखता है; इसमें अनादर का भाव नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक और गरिमापूर्ण शैली। ‘बातों’ का प्रयोग अमूर्त तथा ठोस दोनों प्रकार की तुच्छ, अस्थायी वस्तुओं के लिए स्वाभाविक व्यापकता देता है।
