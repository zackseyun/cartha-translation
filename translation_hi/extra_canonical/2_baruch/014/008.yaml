  text: Or who can learn your judgment, or search out the depth of your way, or calculate the weight of your path, or comprehend your counsel which cannot be grasped?
translation:
  language: hi
  text: या कौन आपके न्याय को जान सकता है, आपके मार्ग की गहराई की थाह ले सकता है, आपके पथ के भार का हिसाब लगा सकता है, या आपकी उस मंशा को समझ सकता है जो समझ से परे है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पद-विभाजनों में अंतिम वाक्यांश—“या आपकी उस मंशा को समझ सकता है जो समझ से परे है?”—अगले पद के आरम्भ में रखा जाता है।
    reason: प्राचीन पाठ की पंक्ति-संरचना और बाद की पद-संख्या के बीच संभावित सीमा-अंतर को स्पष्ट करना।
lexical_decisions:
- source_word: ܡܠܟܟ
  choice: आपके न्याय
  rationale: संदर्भ और नियंत्रक पाठ के अनुसार इसे ईश्वर के ‘न्याय’ के रूप में लिया गया है; ‘फैसला’ की अपेक्षा ‘न्याय’ यहाँ अधिक व्यापक और स्वाभाविक है।
- source_word: ܐܘܪܚܟ
  choice: आपके मार्ग
  rationale: ‘मार्ग’ मूल रूपक को बनाए रखता है और ईश्वर की कार्य-पद्धति या विधान—दोनों अर्थों के लिए खुला रहता है।
- source_word: ܥܘܡܩܐ
  choice: गहराई की थाह
  rationale: ‘गहराई’ के साथ ‘थाह पाना’ आधुनिक हिन्दी में स्वाभाविक है और अगम्यता का भाव सुरक्षित रखता है।
- source_word: ܬܘܩܠܐ
  choice: भार
  rationale: मूल के ठोस ‘वजन/भार’ रूपक को अमूर्त ‘महत्त्व’ में बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: ܬܪܥܝܬܟ
  choice: आपकी सम्मति
  rationale: यह शब्द विचार, अभिप्राय या योजना का संकेत दे सकता है; ‘सम्मति’ इस अर्थ-क्षेत्र और धार्मिक गरिमा को बिना संकीर्ण किए व्यक्त करती है।
- source_word: ܕܠܐ ܡܬܕܪܟܐ
  choice: जो समझ से परे है
  rationale: शाब्दिक ‘जिसे ग्रहण नहीं किया जा सकता’ की अपेक्षा यह सहज हिन्दी है, पर ईश्वरीय सम्मति की अगम्यता को बनाए रखती है।
theological_decisions:
- issue: ईश्वर के मार्ग और सम्मति की अगम्यता
  choice: चारों प्रश्नों को समानांतर अलंकारिक प्रश्नों के रूप में रखा गया है
  alternative: इन्हें यह प्रत्यक्ष कथन बनाना कि कोई मनुष्य ईश्वर को समझ नहीं सकता
  rationale: मूल का प्रश्नात्मक रूप विनम्रता और तनाव दोनों बनाए रखता है तथा उससे अधिक पूर्ण असमर्थता का सिद्धांत नहीं जोड़ता।
- issue: ‘न्याय’ और ‘सम्मति’ का संबंध
  choice: दोनों को अलग अवधारणाओं के रूप में अनूदित किया गया है
  alternative: दोनों को ‘निर्णय’ या ‘योजना’ में मिला देना
  rationale: मूल की क्रमिक समानांतरता और अर्थगत विस्तार को सुरक्षित रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण ‘आप’ का प्रयोग किया गया है। ‘थाह पाना’ और ‘भार नापना’ सहज बोधगम्य हैं, जबकि ‘मार्ग’, ‘पथ’ और ‘सम्मति’ काव्यात्मक तथा धर्मग्रंथोचित गरिमा बनाए रखते हैं।
