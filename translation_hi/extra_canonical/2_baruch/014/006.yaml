translation:
  language: hi
  text: और किनके लिए भले कामों की खोज की गई,[a] और किनके लिए भविष्यद्वक्ता दिए गए?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भलाई के परिश्रम की खोज की गई।”
    reason: ܥܡܠܐ ܕܛܒܬܐ के अधिक शाब्दिक, एकवचन पदबंध को सुरक्षित रखना।
  - marker: b
    text: या “भविष्यद्वक्ता पाए गए” अथवा “उपलब्ध हुए।”
    reason: ܢܫܬܟܚ का मूल अर्थ ‘पाया जाना’ है; प्रसंगगत ‘दिए गए’ के साथ इस अर्थ को भी सुरक्षित रखना।
lexical_decisions:
- source_word: ܥܡܠܐ ܕܛܒܬܐ
  choice: भले कामों
  rationale: शाब्दिक रूप से यह पदबंध ‘भलाई का परिश्रम’ हो सकता है; प्रसंग और सहज हिन्दी में ‘भले कामों’ से आशय स्पष्ट रहता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: ܡܬܒܥܝܢ
  choice: खोज की गई
  rationale: मूल क्रिया में खोजने या चाहने का भाव है। ‘खोज की गई’ प्रश्न की वास्तविक अस्पष्टता को बिना किसी विशेष धार्मिक व्याख्या के बनाए रखती है।
- source_word: ܢܫܬܟܚ ܠܗܘܢ
  choice: दिए गए
  rationale: क्रिया का मूल अर्थ ‘पाए गए’ है, पर इस प्रसंग में ‘उनके लिए उपलब्ध हुए/कराए गए’ का भाव संभव है। ‘दिए गए’ स्वाभाविक और स्पष्ट है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: भले कामों और भविष्यद्वक्ताओं के बीच संबंध
  choice: दो समानांतर प्रश्नों को बिना कर्ता या उद्देश्य जोड़े रखा गया है।
  alternative: इसे इस प्रकार स्पष्ट करना कि लोगों से भले कामों की अपेक्षा की गई और उन्हीं के पास भविष्यद्वक्ता भेजे गए।
  rationale: मूल पाठ संक्षिप्त और कुछ हद तक अस्पष्ट है; अनकहे कर्ता या धर्मशास्त्रीय निष्कर्ष को जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल मानक हिन्दी। दोनों प्रश्नवाचक उपवाक्यों की समानांतर रचना बनाए रखी गई है; स्रोत की असामान्य अभिव्यक्ति को अत्यधिक स्पष्ट करके नहीं बदला गया।
