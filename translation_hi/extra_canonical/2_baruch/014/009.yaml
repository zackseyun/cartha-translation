translation:
  language: hi
  text: या नश्वर मनुष्यों में कौन आपकी बुद्धि के आरम्भ और अन्त को पा सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “का पता लगा सकता है।”
    reason: ܡܫܟܚ का मूल अर्थ ‘पाना’ है, पर इस सन्दर्भ में ‘पता लगाना’ भी सम्भव अनुवाद है।
lexical_decisions:
- source_word: ܡܫܟܚ
  choice: पा सकता है
  rationale: इस क्रिया का मूल अर्थ ‘पाना/खोजना’ है; यहाँ बुद्धि के आरम्भ और अन्त तक पहुँच सकने की क्षमता का प्रश्न है।
- source_word: ܪܫܐ … ܫܘܠܡܐ
  choice: आरम्भ और अन्त
  rationale: यह युग्म बुद्धि की पूरी सीमा—उसके आरम्भ से अन्त तक—को व्यक्त करता है।
- source_word: ܒܢ̈ܝ ܐܢܫܐ
  choice: नश्वर मनुष्यों में
  rationale: सेमिटिक अभिव्यक्ति ‘मनुष्यों की सन्तान’ यहाँ मानवजाति, विशेषकर उसकी सीमितता, को सूचित करती है; आधुनिक हिन्दी में ‘नश्वर मनुष्य’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ܚܟܡܬܟ
  choice: आपकी बुद्धि
  rationale: द्वितीय पुरुष एकवचन के सम्बन्धसूचक रूप और ईश्वर को सम्बोधित प्रार्थनात्मक प्रसंग को सीधे बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय बुद्धि की अगम्यता
  choice: प्रश्न को अलंकारिक प्रश्न के रूप में अक्षुण्ण रखा गया है
  alternative: 'इसे कथन बनाना: ‘कोई मनुष्य आपकी बुद्धि को नहीं समझ सकता’'
  rationale: मूल पाठ मानवीय सीमा पर बल देता है, पर उसे व्यवस्थित धर्मवैज्ञानिक निष्कर्ष में बदलने के बजाय प्रश्नात्मक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ईश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त है; ‘आरम्भ और अन्त’ मूल के व्यापक मेरिज़्म को स्पष्ट रूप से व्यक्त करता है।
