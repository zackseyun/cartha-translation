    ܬܬܢܣܒ ܘܬܫܬܒܩܝܢ.

    ܫܪܝܪܐܝܬ ܓܝܪ ܒܙܒܢܐ

    ܡܬܬܒܪܐ ܒܥܝܢܝ ܚܛܝ̈ܐ.

