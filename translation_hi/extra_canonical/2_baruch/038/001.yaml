  yaml_path: translation/extra_canonical/2_baruch/038/001.yaml
  text: And I prayed and said, “Lord, my Lord, you continually give light to those who are guided in understanding. Your law is life, and your wisdom is uprightness. Therefore show me the interpretation of this vision. For you know that my soul has walked in your law, and from my earliest days I have not been cut off from your wisdom.”
translation:
  language: hi
  text: और मैंने प्रार्थना करके कहा, “हे प्रभु, मेरे प्रभु, आप उन लोगों को निरन्तर प्रकाश देते हैं जो समझ-बूझ में मार्गदर्शन पाते हैं। आपकी व्यवस्था जीवन है, और आपकी बुद्धि सत्यनिष्ठा है। इसलिए मुझे इस दर्शन की व्याख्या दिखाइए। क्योंकि आप जानते हैं कि मेरी आत्मा आपकी व्यवस्था में चलती रही है, और अपने आरम्भिक दिनों से मैं आपकी बुद्धि से अलग नहीं किया गया हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  choice: जो समझ-बूझ के साथ मार्गदर्शन पाते हैं
  rationale: कर्मवाच्य ‘मार्गदर्शन पाते हैं’ सिरियाई में चलाए या संचालित किए जाने का भाव रखता है, जबकि ‘समझ-बूझ’ बौद्धिक और नैतिक विवेक—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܢܡܘܣܟ ܚ̈ܝܐ ܗܘ
  choice: आपकी व्यवस्था जीवन है
  rationale: मूल के प्रबल, सूत्रात्मक समानार्थक विधान को सीधे रखा गया है; इसे केवल ‘जीवन देती है’ बनाकर साधनात्मक अर्थ तक सीमित नहीं किया गया।
- source_word: ܚܟܡܬܟ ܬܪܝܨܘܬܐ ܗܝ
  choice: आपकी बुद्धि सीधाई है
  rationale: ‘सीधाई’ मूल के straightness/uprightness के नैतिक भाव को सुरक्षित रखती है और अधिक तकनीकी या सम्प्रदायगत शब्दावली से बचती है।
- source_word: ܦܘܫܩܗ ܕܚܙܘܐ ܗܢܐ
  choice: इस दर्शन का अर्थ
  rationale: प्रकाशनात्मक दर्शन के संकेतों की व्याख्या अभिप्रेत है; सामान्य पाठक के लिए ‘अर्थ बताइए’ सहज है और ‘व्याख्या’ की मूल धारणा को बनाए रखता है।
- source_word: ܠܐ ܐܬܢܣܝܬ
  choice: मैं ... अलग नहीं किया गया हूँ
  rationale: कर्मवाच्य रूप जुदा किए जाने या विच्छेद का अधिक प्रबल सम्बन्धपरक भाव बचाता है; इसे केवल स्वेच्छा से ‘दूर नहीं हुआ’ नहीं बनाया गया।
theological_decisions:
- issue: व्यवस्था और बुद्धि का परमेश्वर के प्रकाशन से सम्बन्ध
  choice: ‘आपकी व्यवस्था जीवन है, और आपकी बुद्धि सीधाई है’ को समानान्तर, प्रबल स्वीकारोक्ति के रूप में रखा गया है।
  alternative: ‘आपकी व्यवस्था जीवन देती है’ अथवा ‘आपकी बुद्धि धार्मिकता है।’
  rationale: मूल के पहचानसूचक विधानों को बनाए रखने से व्यवस्था और बुद्धि की जीवनदायी तथा नैतिक प्रकृति सुरक्षित रहती है, बिना ‘सीधाई’ को न्यायालयी या बाद की धर्मशास्त्रीय अर्थ-सीमा में बाँधे।
- issue: अन्तिम कथन में सक्रिय निष्ठा या सम्बन्ध-विच्छेद
  choice: ‘मैं आपकी बुद्धि से अलग नहीं किया गया हूँ।’
  alternative: ‘मैं आपकी बुद्धि से दूर नहीं हुआ हूँ।’
  rationale: चुना गया पाठ विच्छेद न होने के प्रबल सम्बन्धपरक भाव और कर्मवाच्य तनाव को बनाए रखता है; वैकल्पिक पाठ इसे केवल वक्ता की स्वैच्छिक निष्ठा बना सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। ‘हे प्रभु, मेरे प्रभु’ विनय और आवृत्ति दोनों को बनाए रखता है। वाक्य सामान्य पाठक के लिए सहज हैं, पर ‘व्यवस्था जीवन है’ और ‘बुद्धि सीधाई है’ जैसे मूल के सघन धर्मवैचारिक कथनों को सरल करके कमजोर नहीं किया गया। उपलब्ध पृष्ठ-पाठ में स्पष्ट OCR/सीमा-विकृति होने के कारण स्थापित सिरियाई पाठ-साक्ष्य और नियंत्रित अध्याय-सन्दर्भ के अनुसार वक्ता, सर्वनाम और प्रार्थना की संरचना ग्रहण की गई है; मशीन-पाठ से निकला विपरीत रूप वास्तविक पाठांतर नहीं माना गया।
