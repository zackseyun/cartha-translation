    text: शाब्दिक रूप से, “अपने आप को ... से देखो”; यह एक सीरियाई मुहावरा है, जिसका अर्थ अलग हो जाना या निकल जाना है।
    reason: lexical_choice
lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ
  choice: उन सभी से जो तुम्हारे समान हैं
  rationale: यह अनुवाद बरूक और यिर्मयाह जैसे लोगों के ठोस, व्यक्तिगत समूह का भाव बनाए रखता है और ܟܠ ‘सभी’ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ
  choice: कि तुम ... से निकल जाओ
  rationale: शाब्दिक रूप से ‘अपने आप को ... से देखो/अपना ध्यान रखो’ वाला यह सीरियाई मुहावरा यहाँ अलग हो जाने या प्रस्थान करने की आज्ञा देता है; ‘निकल जाओ’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: ܡܟܝܠ ܕܝܢ
  choice: पर अब
  rationale: ܕܝܢ के विरोध अथवा संक्रमण और ܡܟܝܠ के कालगत भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
