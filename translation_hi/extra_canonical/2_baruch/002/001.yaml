  text: But now I say to you, and to Jeremiah, and to all those who are like you, that you should depart[a] from this city.
translation:
  language: hi
  text: पर अब मैं तुमसे, यिर्मयाह से, और उन सभी से जो तुम्हारे समान हैं, कहता हूँ कि तुम इस नगर से निकल जाओ[a]।
  philosophy: optimal-equivalence
  footnotes:
