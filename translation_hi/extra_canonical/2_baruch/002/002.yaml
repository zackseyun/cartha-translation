translation:
  language: hi
  text: क्योंकि तेरे काम इस नगर के लिए दृढ़ खंभे के समान हैं, और तेरी प्रार्थना सुदृढ़ दीवार के समान है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒ̈ܕܝܗܘܢ (पांडुलिपि-पाठ/मुद्रित पाठ में अस्पष्ट रूप से प्रतिबिंबित)
  choice: उनके काम
  rationale: सीरियाई वाक्य का आशय तीसरे पुरुष बहुवचन में उन लोगों के कर्मों से है जिन्हें बारूक के समान बताया गया है। यह उपलब्ध अंग्रेज़ी परामर्श-पाठ के दूसरे पुरुष ‘your deeds’ की अपेक्षा मूल-स्रोत के संदर्भ और प्रचलित पाठ से अधिक मेल खाता है।
- source_word: ܥܡܘܕܐ ܫܪܝܪܐ
  choice: दृढ़ खंभा
  rationale: नगर को थामने वाले स्थिर सहारे की उपमा को स्वाभाविक और निकट रूप में व्यक्त करता है।
- source_word: ܨܠܘܬܗܘܢ
  choice: उनकी प्रार्थना
  rationale: रूप सामूहिक/एकवचन ‘प्रार्थना’ का भाव देता है, जबकि संबंधवाचक सर्वनाम उन लोगों के समूह की ओर संकेत करता है।
- source_word: ܫܘܪܐ ܚܣܝܢܐ
  choice: सुदृढ़ दीवार
  rationale: रक्षा देने वाली मजबूत नगर-दीवार का अर्थ रखता है; ‘सुदृढ़’ समानांतर उपमा की गरिमा बनाए रखता है।
theological_decisions:
- issue: कर्म और प्रार्थना को नगर का सहारा और सुरक्षा बताने वाली उपमाएँ
  choice: दोनों उपमाओं को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
  alternative: इन्हें नगर को बचाने या परमेश्वर के न्याय को रोकने की प्रत्यक्ष धार्मिक व्याख्या के रूप में खोलना।
  rationale: मूल पाठ रूपकात्मक कथन करता है; किसी विशेष प्रायश्चित्त, मध्यस्थता या अर्जित पुण्य-सिद्धांत को स्पष्ट रूप से आरोपित नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और रूपक के निकट। ‘खंभा’ सामान्य पाठक के लिए ‘स्तंभ’ से अधिक सहज है, जबकि ‘सुदृढ़ दीवार’ नगर की रक्षात्मक दीवार का भाव बनाए रखती है।
