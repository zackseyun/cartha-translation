  text: And the holy land shall have mercy on its own, and at that time it shall protect its inhabitants.
translation:
  language: hi
  text: और पवित्र भूमि अपने जनों पर दया करेगी, और उस समय वह अपने निवासियों की रक्षा करेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: पवित्र भूमि
  rationale: यह पद भूमि को सजीव कर्ता के रूप में प्रस्तुत करता है; ‘पवित्र भूमि’ इस वाचिक और वाचा-संबंधी अर्थभार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ܬܪܚܡ
  choice: दया करेगी
  rationale: क्रिया सक्रिय करुणा या दया दिखाने का बोध देती है। ‘दया करेगी’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ܕܝܠܗ̇
  choice: अपने जनों पर
  rationale: शाब्दिक अर्थ ‘अपने’ है। हिन्दी में ‘अपने जनों’ भूमि से संबंधित लोगों का आशय स्पष्ट करता है, बिना उनकी पहचान को आवश्यकता से अधिक सीमित किए।
- source_word: ܬܢܛܪ
  choice: रक्षा करेगी
  rationale: यह क्रिया निगरानी करते हुए सुरक्षित रखने का अर्थ देती है; ‘रक्षा करेगी’ आधुनिक हिन्दी में स्वाभाविक और प्रतिज्ञा के भाव के अनुकूल है।
- source_word: ܥܡܘܪ̈ܝܗ̇
  choice: अपने निवासियों की
  rationale: यह भूमि में रहने वालों को सूचित करता है। ‘निवासियों’ मूल संबंध को सीधे और औपचारिक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या भूमि को स्वयं कार्य करने वाले कर्ता के रूप में रखा जाए
  choice: पवित्र भूमि अपने जनों पर दया करेगी और अपने निवासियों की रक्षा करेगी
  alternative: परमेश्वर पवित्र भूमि के द्वारा उसके लोगों पर दया करेगा
  rationale: पद की अपोकैलिप्टिक मानवीकरण-शैली में भूमि ही व्याकरणिक कर्ता है। इसे बनाए रखना उचित है; दैवी कर्तृत्व को स्पष्ट रूप से जोड़ना मूल कथन से आगे जाना होगा।
- issue: ‘अपने’ से अभिप्रेत लोगों को हिन्दी में कैसे व्यक्त किया जाए
  choice: अपने जनों
  alternative: अपनों
  rationale: ‘अपनों’ अधिक बोलचाल का और अस्पष्ट हो सकता है। ‘अपने जनों’ संबंध को स्पष्ट करता है, पर किसी विशिष्ट सामुदायिक या संप्रदायगत पहचान को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण भविष्यकाल। भूमि के स्त्रीलिंग मानवीकरण को ‘करेगी’ और ‘वह’ से सुरक्षित रखा गया है। उपलब्ध पृष्ठांश अध्याय-सीमा पर पिछले अंश से संबंधित और 71:1 से असंरेखित प्रतीत होता है; इसलिए ज्ञात सिरियाई अध्याय-परंपरा तथा नियंत्रित समीक्षा में सुरक्षित 71:1 के पाठ को अपनाया गया है, न कि असंबद्ध पूर्ववर्ती सामग्री को।
