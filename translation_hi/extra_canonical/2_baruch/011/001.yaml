  yaml_path: translation/extra_canonical/2_baruch/011/001.yaml
  text: 'Then I, Baruch, said: “And I said to you, O Babylon: ‘If you had prospered, and Zion had dwelt in her glory, our grief would still have been great that you had been made equal to Zion. But now, behold, the grief is infinite and the lamentation beyond measure, because Babylon has prospered and Zion lies desolate. For who can judge concerning these things, or to whom shall we complain about what has come upon us? O Lord, how have you endured it? Our fathers went to rest without grief, and behold, the righteous sleep quietly in the earth, because they did not know this distress, nor had they heard what has happened to us. Would that you had ears, O earth, and that you had a heart, O dust, so that you might go and announce in Sheol and say to the dead, ‘Blessed are you more than we who live.’”'
translation:
  language: hi
  text: '1 तब मैं, बारूक, बोला: “और मैंने तुझसे कहा, हे बाबुल, ‘यदि तू समृद्ध होती और सिय्योन अपनी महिमा में बसी रहती, तो भी हमारा शोक बड़ा होता, क्योंकि तुझे सिय्योन के बराबर कर दिया गया था।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̇ܪ ܐܢܐ ܕܝܢ ܗ̣ܘ ܐܢܐ ܒܪܘܟ
  choice: तब मैं, बारूक, बोला
  rationale: खंडित पांडुलिपीय पंक्ति में विरोधात्मक/क्रमसूचक संयोजक और वक्ता की आत्म-पहचान सुरक्षित रखी गई है; हिन्दी में स्वाभाविक पुनरुक्ति से बचते हुए कथन का आरम्भ स्पष्ट किया गया है।
- source_word: ܒܒܠ
  choice: हे बाबुल
  rationale: नगर को प्रत्यक्ष संबोधन और स्त्रीलिंग व्यक्तिकरण के रूप में रखा गया है।
- source_word: prosperity language in the Babylon address
  choice: समृद्ध होती
  rationale: यह बाबुल की उन्नति और सिय्योन की स्थिति के बीच का विरोध बनाए रखता है, बिना अतिरिक्त नैतिक अर्थ जोड़े।
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: यह आधुनिक हिन्दी बाइबलीय प्रयोग में प्रचलित लिप्यंतरण है और व्यक्तिकृत नगर का भाव बनाए रखता है।
- source_word: glory/dwelling language for Zion
  choice: अपनी महिमा में बसी रहती
  rationale: निवास और महिमा, दोनों स्रोतगत भावों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बाबुल और सिय्योन की सशर्त तुलना
  choice: यदि बाबुल समृद्ध होती और सिय्योन अपनी महिमा में बसी रहती, तब भी बाबुल का सिय्योन के बराबर किया जाना शोक का कारण होता
  alternative: यदि सिय्योन समृद्ध होती और बाबुल नष्ट हो जाती
  rationale: संबोधन और शर्त को उलटने के बजाय बाबुल को संबोधित मूल अर्थ रखा गया है; इससे पाठ में नगरों की असमान पवित्र हैसियत से उत्पन्न धार्मिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-सुलभ रखी गई है। बाबुल और सिय्योन का स्त्रीलिंग व्यक्तिकरण हिन्दी सर्वनामों और क्रियाओं में बनाए रखा गया है।
