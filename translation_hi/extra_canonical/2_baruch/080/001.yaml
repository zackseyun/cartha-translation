- from: 'जो कुछ होने वाला था, उसे पहले से जानते हुए—कि बाबुल के राजा नबूकदनेस्सर ने इसे अपने मन में ठान लिया था...[a] फिर भी हम जानते थे कि उसके मुँह से निकली कोई आज्ञा व्यर्थ नहीं जाएगी और न उस रीति से भिन्न होगी, जिसे उसने पहले से ठहराया था। क्योंकि जो पहले से निश्चित किया गया था, वह प्रत्यक्ष दिखाया गया। और मुझ पर यह भी प्रकट किया गया कि स्वर्गदूत नगर के विरुद्ध कार्य कर रहे थे। उन्होंने उसकी दीवारें हिला दीं और उन्हें जड़ से उखाड़ दिया; और लोहे के दृढ़ कोनों वाली विशाल दीवार को ढा दिया। पर उस समय उन्होंने पवित्र पात्रों[b] को छिपा दिया, ताकि शत्रु उन्हें न देख सकें।


