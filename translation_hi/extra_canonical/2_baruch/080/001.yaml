  yaml_path: translation/extra_canonical/2_baruch/080/001.yaml
  text: 'Knowing first what was to happen, that Nebuchadnezzar king of Babylon set it in his heart... But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.


    And when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’


    They also bound your brothers and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.'
translation:
  language: hi
  text: 'जो कुछ होने वाला था, उसे पहले से जानते हुए—कि बाबुल के राजा नबूकदनेस्सर ने यह बात अपने मन में ठान ली थी...[a] फिर भी हम जानते थे कि उसके मुँह से निकली कोई आज्ञा व्यर्थ नहीं जाएगी और न उस रीति से भिन्न होगी, जिसे उसने पहले से ठहराया था। क्योंकि जो पहले से निश्चित किया गया था, वह प्रत्यक्ष दिखाया गया। और मुझ पर यह भी प्रकट किया गया कि स्वर्गदूत नगर के विरुद्ध कार्य कर रहे थे। उन्होंने उसकी दीवारें हिला दीं और उन्हें जड़ से उखाड़ दिया; और लोहे के मजबूत कोनों वाली विशाल दीवार को ढा दिया। पर उस समय उन्होंने पवित्र पात्रों[b] को छिपा दिया, ताकि शत्रु उन्हें न देख सकें।


    जब वे ये काम कर चुके, तब उन्होंने टूटी हुई दीवार, लूटा हुआ भवन,[c] जला हुआ मंदिर और पराजित होकर बंदी बनाए जा रहे लोगों को शत्रुओं के हाथ सौंप दिया। यह इसलिए हुआ कि शत्रु घमंड करके यह न कहें, ‘हमने परमप्रधान के भवन को भी घेर लिया और युद्ध में उसे ढा दिया।’


    उन्होंने तुम्हारे भाइयों को भी बाँधा और उन्हें बाबुल ले गए, और वहीं उन्हें बसाया। पर हम और हमारी संतान यहाँ रह गए—बहुत थोड़े और छोटे-से। प्रजा का यही वह दुःख है जिसके विषय में मैंने तुम्हें लिखा था। तुम निश्चय जानते हो कि सिय्योन का अपमान तुम्हारे लिए बहुत भारी रहा है, क्योंकि उसके विषय में तुम्हारा ज्ञान अन्य लोगों से अधिक था; तुम वहाँ सेवा करते थे, जबकि हम सहायता किया करते थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस आरंभिक वाक्य का सिरियाई पाठ खंडित और व्याकरण की दृष्टि से कठिन है; इसलिए यह वाक्य अधूरा-सा जान पड़ता है। कुछ अनुवाद इसे इस प्रकार पूरा करते हैं: “पहले जान लो कि क्या होने वाला था: बाबुल के राजा नबूकदनेस्सर ने नगर पर चढ़ाई करने की बात अपने मन में ठान ली थी।”'
    reason: स्रोत में वास्तविक पाठगत और वाक्यगत अनिश्चितता को बिना चुपचाप पूरा किए सुरक्षित रखना।
  - marker: b
    text: शाब्दिक रूप से संभवतः “अच्छी वस्तुएँ” या “बहुमूल्य वस्तुएँ”; मंदिर के संदर्भ में आशय पवित्र पात्रों से हो सकता है।
    reason: स्रोत-पद का व्यापक शब्दार्थ और संदर्भगत व्याख्या दोनों दिखाना।
  - marker: c
    text: यहाँ सिरियाई पाठ कठिन है; “उजाड़ा हुआ भवन” या “लूटकर खाली किया हुआ भवन” भी संभव है।
    reason: क्षतिग्रस्त अथवा अस्थिर पाठ पर अत्यधिक निश्चितता से बचना।
lexical_decisions:
- source_word: ܡܠܐܟ̈ܐ
  choice: स्वर्गदूत
  rationale: इस प्रकाशनात्मक प्रसंग में नगर की दीवारें गिराने वाले कर्ता अलौकिक हैं; ‘स्वर्गदूत’ सामान्य पाठक के लिए स्पष्ट है और केवल मानवीय दूतों का अर्थ लेने से बचाता है।
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ
  choice: उसकी दीवारें … विशाल दीवार
  rationale: यह चयन नगर की किलेबंदी का सीधा अर्थ देता है और दूसरे प्रयोग में स्रोत के बलवर्धक वर्णन को बनाए रखता है।
- source_word: ܡܐ ܛܒܝ̈ܢ
  choice: पवित्र पात्रों
  rationale: शाब्दिक अर्थ ‘अच्छी/बहुमूल्य वस्तुएँ’ हो सकता है, पर मंदिर के तत्काल संदर्भ में पवित्र पात्र सर्वाधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ܐܫܠܡܘ
  choice: हाथ सौंप दिया
  rationale: क्रिया किसी को दूसरे के अधिकार में दिए जाने का भाव रखती है; यह न्यायिक और कथात्मक दोनों अर्थों को सहज हिन्दी में व्यक्त करती है।
- source_word: ܚܘܪܐ
  choice: लूटा हुआ भवन
  rationale: पाठ कठिन है, पर टूटी दीवार और जले मंदिर की श्रृंखला में लूटे या उजाड़े गए भवन का अर्थ संदर्भानुकूल है; अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: ܡܟܝܟ
  choice: अपमान
  rationale: सिय्योन के नीचा किए जाने और उससे जुड़ी सार्वजनिक लज्जा का भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
