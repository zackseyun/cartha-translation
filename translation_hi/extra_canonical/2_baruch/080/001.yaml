    उन्होंने तुम्हारे भाइयों को भी बाँधा और उन्हें बाबुल ले गए, और वहीं उन्हें बसा दिया। पर हम और हमारी संतान यहाँ रह गए—गिनती में थोड़े और सामर्थ्य में छोटे। लोगों का यही वह दुःख है जिसके विषय में मैंने तुम्हें लिखा था। तुम निश्चय जानते हो कि सिय्योन का अपमान तुम्हारे लिए बहुत भारी रहा है, क्योंकि उसके विषय में तुम्हारा ज्ञान अन्य लोगों से अधिक था; तुम वहाँ सेवा करते थे, जबकि हम सहायता किया करते थे।'
