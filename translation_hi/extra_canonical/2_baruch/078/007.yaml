  language: hi
  text: 7 क्योंकि जिसे तुम खोजते हो, वह दयालु है, और जिससे तुम आशा रखते हो, वह दयालु है। और हम देखेंगे कि वह रक्षा करता है और त्यागता नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܚܣܢܢܐ
  choice: दयालु / कृपालु
  rationale: स्रोत में एक ही विशेषण समानांतर रूप से दोहराया गया है। हिन्दी में ‘दयालु’ और ‘कृपालु’ इस पुनरुक्त समानांतरता के भाव को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करते हैं, बिना अर्थ को केवल सामान्य ‘भला’ तक सीमित किए।
- source_word: ܕܒܥܝܢ ܐܢܬܘܢ ܠܗ
  choice: जिसे तुम खोजते हो
  rationale: ܒܥܐ यहाँ ‘खोजना/चाहना’ व्यक्त करता है; इसलिए ‘आराधना करते हो’ जैसा अधिक व्याख्यात्मक अर्थ नहीं अपनाया गया।
- source_word: ܕܡܣܒܪܝܢ ܐܢܬܘܢ ܒܗ
  choice: जिस पर तुम आशा रखते हो
  rationale: क्रिया भविष्य की ओर उन्मुख भरोसे और अपेक्षा को व्यक्त करती है; ‘आशा रखते हो’ आधुनिक हिन्दी में दोनों पक्षों को बनाए रखता है।
- source_word: ܘܢܚܙܐ
  choice: और हम देखेंगे
  rationale: प्रथम पुरुष बहुवचन को स्पष्ट रूप से सुरक्षित रखा गया है; इसे ‘वह विश्वासयोग्य है’ में बदलना स्रोत-पाठ के व्याकरण को खो देता।
- source_word: ܕܢܛܪ ܠܐ ܕܢܥܙܒ
  choice: कि वह रक्षा करता है और त्यागता नहीं
  rationale: ܢܛܪ और ܥܙܒ के सकारात्मक-नकारात्मक विरोध को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में परमेश्वर की विश्वासयोग्यता को विशेषण के रूप में कहना या समुदाय के भावी अनुभव के रूप में रखना
  choice: और हम देखेंगे कि वह रक्षा करता है और त्यागता नहीं
  alternative: और वह रक्षा करने और न त्यागने में विश्वासयोग्य है
  rationale: सिरियाई ܘܢܚܙܐ स्पष्टतः ‘और हम देखेंगे’ है। चुना हुआ पाठ बरूख और श्रोताओं के संयुक्त साक्ष्य की भावी दृष्टि को बनाए रखता है और पाठ में अनुपस्थित ‘विश्वासयोग्य’ विशेषण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में बहुवचन ‘तुम’, और सरल किंतु गरिमापूर्ण धार्मिक शैली अपनाई गई है। स्रोत की समानांतर रचना और प्रथम पुरुष बहुवचन को सुरक्षित रखा गया है।
