translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और कहावत-जैसी समानांतर संरचना रखी गई है। उपलब्ध सिरियाई पृष्ठांश में लक्षित पद प्रत्यक्षतः दिखाई नहीं देता; इसलिए शब्द-चयन मूल-पाठ की पद-परंपरा और दिए गए लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ के संगम पर आधारित है। अनावश्यक पाद-टिप्पणी नहीं जोड़ी गई, क्योंकि अंग्रेज़ी की पूर्व पाद-टिप्पणी वर्तमान मुख्य पाठ की ही पुनरावृत्ति थी।
