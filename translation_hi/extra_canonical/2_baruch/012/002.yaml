lexical_decisions:
- source_word: 'ܡܛܠ ܕ (reconstructed from the audited verse evidence: meṭṭul d-)'
  choice: क्योंकि
  rationale: कारणसूचक संबंध को स्पष्ट रखता है और इस कथन को पिछले पद के तर्क से जोड़ता है।
- source_word: 'ܫܘܚܢܐ ܕܛܗܪܐ (verse tradition: noonday heat/blaze)'
  choice: दोपहर की तपिश
  rationale: ‘तपिश’ गर्मी और दाह—दोनों भाव स्वाभाविक हिंदी में व्यक्त करती है; ‘दोपहर’ समय-संबंधी विशेषता को सुरक्षित रखता है।
- source_word: ܙܠܝ̈ܩܐ ܕܫܡܫܐ (rays of the sun)
  choice: सूर्य की किरणें
  rationale: स्रोत के ठोस प्राकृतिक बिंब का सीधा और सुबोध रूप।
- source_word: ܡܢܗܪܝܢ (give light/shine)
  choice: प्रकाश देती हैं
  rationale: किरणों के संदर्भ में स्वाभाविक हिंदी है और प्रकाश देने की क्रिया को स्पष्ट व्यक्त करती है।
