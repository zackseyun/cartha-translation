  text: For surely wrath will be aroused against you at its appointed time; for now it is restrained by longsuffering, as by a bridle.
translation:
  language: hi
  text: क्योंकि निश्चय ही नियत समय पर तुम्हारे विरुद्ध क्रोध भड़क उठेगा; अभी तो वह दीर्घ-सहनशीलता के द्वारा, मानो लगाम से, रोका हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ (पद के पाठ का आशय; उद्धृत अंश में आरंभिक पंक्तियाँ अपूर्ण हैं)
  choice: क्रोध
  rationale: ईश्वरीय रोष के अर्थ को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܒܙܒܢܗ
  choice: नियत समय पर
  rationale: समय के पूर्वनिर्धारित अथवा उपयुक्त होने की छाया बनाए रखता है।
- source_word: ܡܓܪܬ ܪܘܚܐ
  choice: धीरज
  rationale: शाब्दिक रूप से ‘आत्मा की दीर्घता’ से दीर्घ-सहनशीलता का भाव आता है; ‘धीरज’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ܐܝܟ ... ܐܚܝܕܐ
  choice: मानो लगाम से रोका हुआ
  rationale: संयमित किए जाने की उपमा और उसके तुलनात्मक स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: क्रोध के भड़कने का कर्ता
  choice: क्रोध भड़क उठेगा
  alternative: क्रोध भड़काया जाएगा
  rationale: स्रोत की संभावित कर्मवाच्य छाया को किसी स्पष्ट कर्ता से नहीं जोड़ता और हिन्दी में स्वाभाविक रहते हुए धार्मिक तनाव बनाए रखता है।
- issue: वर्तमान विलंब का कारण
  choice: धीरज के कारण
  alternative: दीर्घ-सहनशीलता के द्वारा
  rationale: दण्ड के विलंब को केवल निष्क्रिय रुकावट नहीं, धैर्यपूर्ण सहनशीलता से जुड़ा रखता है, बिना यह निर्धारित किए कि धीरज किसका है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए सम्मानपूर्ण और सामान्य ‘तुम्हारे’ रखा गया है। वाक्य गरिमापूर्ण है, पर अनावश्यक रूप से संस्कृतनिष्ठ नहीं।
