translation:
  language: hi
  text: परन्तु मैं जैसा समझता हूँ, वैसा ही बोलूँगा; और हे समृद्ध भूमि, मैं तेरे विरुद्ध बोलूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܟ ܕܡܫܬܡܥ ܐܢܐ
  choice: मैं जैसा समझता हूँ
  rationale: ܡܫܬܡܥ का शाब्दिक संबंध सुनने से है, पर इस चिंतनपूर्ण विलाप में पूरा वाक्यांश स्वाभाविक रूप से ‘जैसा मैं समझता हूँ’ का भाव देता है। इससे अर्थ स्पष्ट रहता है और कथन की आत्मगत सीमा भी बनी रहती है।
- source_word: ܐܪܥܐ ܕܡܨܠܚܐ
  choice: हे समृद्ध होनेवाली भूमि
  rationale: भूमि को सीधे संबोधित करने का काव्यात्मक रूप बनाए रखा गया है। कृदन्तीय अभिव्यक्ति ‘समृद्ध होनेवाली’ वर्तमान दशा अथवा उन्नति की प्रक्रिया—दोनों की गुंजाइश रखती है।
- source_word: ܐܡܠܠ ܥܠܝܟܝ
  choice: मैं तेरे विरुद्ध बोलूँगा
  rationale: ܥܠܝܟܝ यहाँ केवल ‘तेरे विषय में’ नहीं, बल्कि चेतावनी और अभियोग के प्रसंग में प्रतिकूल कथन का भाव रखता है; इसलिए ‘तेरे विरुद्ध’ उपयुक्त है।
theological_decisions:
- issue: समृद्ध भूमि के प्रति कथन का स्वर
  choice: इसे भूमि के विरुद्ध भविष्यसूचक चेतावनी के रूप में रखा गया है।
  alternative: इसे केवल भूमि के विषय में एक तटस्थ कथन मानना।
  rationale: संबोधन और प्रसंग का प्रतिकूल स्वर न्याय की चेतावनी की ओर संकेत करता है, किंतु अनुवाद यह निर्धारित नहीं करता कि ‘भूमि’ से कोई विशेष राज्य, नगर या लोग अभिप्रेत हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे’ से मूल का प्रत्यक्ष संबोधन स्पष्ट होता है। उपलब्ध उद्धृत सिरिएक पृष्ठांश इस पद के बाद के अंश से आरंभ होता है; पद की शब्दावली साथ दिए गए स्रोत-साक्ष्य और नियंत्रित अध्याय-संदर्भ के आधार पर प्रस्तुत की गई है।
