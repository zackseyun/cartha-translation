  text: Do not expect or hope that you will always have prosperity and joy. Do not exalt yourselves too highly, and do not oppress.
translation:
  language: hi
  text: यह आशा मत रखो कि तुम्हारी समृद्धि और आनन्द सदा बने रहेंगे। अपने आपको बहुत ऊँचा मत उठाओ और अत्याचार मत करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए सिरियाई स्रोत-अंश में इस पद के अनुरूप शब्द नहीं मिलते; वह किसी अन्य निकटवर्ती अंश का पाठ प्रतीत होता है। इसलिए यहाँ का अनुवाद जाँचे हुए अंग्रेज़ी परामर्श-पाठ के आधार पर अस्थायी रूप से प्रस्तुत किया गया है।
    reason: स्रोत-अंश और निर्दिष्ट पद के बीच स्पष्ट असंगति को छिपाने के बजाय पाठक के सामने रखना आवश्यक है।
lexical_decisions:
- source_word: prosperity (English audited consultation layer; corresponding Syriac wording is absent from the supplied excerpt)
  choice: समृद्धि
  rationale: यह आधुनिक और सहज हिन्दी में निरन्तर अच्छे हाल और फलने-फूलने की अवस्था व्यक्त करता है।
- source_word: joy (English audited consultation layer; corresponding Syriac wording is absent from the supplied excerpt)
  choice: आनन्द
  rationale: गरिमापूर्ण और सामान्यतः बोधगम्य शब्द, जो बाहरी समृद्धि से अलग हर्ष को बनाए रखता है।
- source_word: exalt yourselves too highly (English audited consultation layer; corresponding Syriac wording is absent from the supplied excerpt)
  choice: अपने आपको बहुत ऊँचा मत उठाओ
  rationale: यह आत्म-उन्नयन और घमण्ड के रूपक को बिना किसी विशेष सम्प्रदायगत अर्थ के बनाए रखता है।
- source_word: oppress (English audited consultation layer; corresponding Syriac wording is absent from the supplied excerpt)
  choice: अत्याचार मत करो
  rationale: यह दूसरों पर अन्यायपूर्ण शक्ति चलाने का स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: सम्बोधित व्यक्तियों की संख्या
  choice: बहुवचन आज्ञार्थक रूप—‘रखो’, ‘उठाओ’, ‘करो’
  alternative: एकवचन सम्बोधन
  rationale: अंग्रेज़ी परामर्श-पाठ और नवीनतम समीक्षा इसे बाबुल के निवासियों के लिए बहुवचन सम्बोधन मानते हैं; हिन्दी का ‘अपने आपको’ स्वयं संख्या-निरपेक्ष है, इसलिए क्रियाएँ बहुवचन स्पष्ट करती हैं।
- issue: समृद्धि और आनन्द की स्थायित्व-धारणा
  choice: ‘सदा बने रहेंगे’
  alternative: ‘तुम्हें सदा मिलते रहेंगे’
  rationale: यह चेतावनी का लक्ष्य—वर्तमान अच्छे हाल को स्थायी मान लेना—स्पष्ट करता है, पर यह नहीं कहता कि समृद्धि या आनन्द अपने आप में दोषपूर्ण हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण शैली। ‘तुम्हारी/रखो/उठाओ/करो’ सामूहिक बहुवचन सम्बोधन के रूप में प्रयुक्त हैं। स्रोत-संगति की पुष्टि होने तक यह प्रकाशन-मसौदा अस्थायी माना जाए।
