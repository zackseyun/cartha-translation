  yaml_path: translation/extra_canonical/2_baruch/034/001.yaml
  text: Then I lifted up my eyes and wept, and I said at that time, “Far be it from me that I should be silent toward you or forget you. But only as far as the house of the tombs of my fathers, in affliction and in the distress of lamentation cry aloud, so that I may not be forgotten before you and afterward. And these things I have declared to you for your remembrance.”
translation:
  language: hi
  text: तब मैंने अपनी आँखें उठाईं और रोया। उस समय मैंने कहा, “यह मुझसे दूर रहे कि मैं तुम्हारे प्रति चुप रहूँ या तुम्हें भूल जाऊँ। पर तुम केवल मेरे पुरखाओं की कब्रों के घर तक, पीड़ा तथा विलाप की व्याकुलता में, ऊँचे स्वर से पुकारो, ताकि तुम्हारे सामने और उसके बाद मुझे भुलाया न जाए। और ये बातें मैंने तुम्हें इसलिए बता दी हैं कि तुम इन्हें स्मरण रखो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के अंतिम खंडों का सिरिएक वाक्य-विन्यास कठिन है। इसका अधिक शाब्दिक अनुवाद हो सकता है: “ताकि तुम्हारे सामने और बाद में मुझे भुलाया न जाए; और ये बातें मैंने तुम्हें तुम्हारे स्मरण के लिए प्रकट की हैं।”'
    reason: स्रोत में ‘तुम्हारे सामने और उसके बाद’ तथा स्मरण से जुड़े अंतिम कथन का संबंध पूरी तरह स्पष्ट नहीं है; पादटिप्पणी वास्तविक वाक्यगत अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: ܚܣ ܠܝ
  choice: यह मुझसे दूर रहे
  rationale: यह सामी मुहावरा दया की विनती नहीं, बल्कि किसी बात के प्रति प्रबल अस्वीकार व्यक्त करता है। हिंदी में यह रूप उसकी गंभीर अलंकारिक शक्ति बनाए रखता है।
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  choice: कि मैं तुम्हारे प्रति चुप रहूँ
  rationale: क्रिया का मूल अर्थ चुप रहना है। ‘तुम्हारे प्रति’ संबंधपरक बल को सुरक्षित रखता है और इसे अनावश्यक रूप से ‘त्यागना’ नहीं बनाता।
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  choice: मेरे पुरखाओं की कब्रों के घर तक
  rationale: स्रोत में दफनाने से जुड़े शब्दों की जानबूझकर दोहरी छवि है। ‘कब्रों का घर’ स्वाभाविक हिंदी की सीमा में उस ठोस और कुछ असामान्य अभिव्यक्ति को बचाता है।
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  choice: पीड़ा तथा विलाप की व्याकुलता में ऊँचे स्वर से पुकारो
  rationale: सिरिएक पीड़ा और विलाप के पदों को एकत्र करके पुकारने की आज्ञा देता है। हिंदी में दोनों भावों को रखा गया है, उन्हें केवल ‘रोओ’ में समेटा नहीं गया।
- source_word: ܥܘܗܕܢܘܢ
  choice: कि तुम इन्हें स्मरण रखो
  rationale: यह पद स्मरण या स्मारक के भाव पर केंद्रित है। संदर्भ में ‘इन्हें स्मरण रखो’ स्पष्ट और स्वाभाविक है, जबकि संभावित वाक्यगत अनिश्चितता पादटिप्पणी में दी गई है।
