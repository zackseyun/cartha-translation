base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/086/001.yaml
  text: So then, when you receive the letter, read it in your assemblies with care. And consider its words more carefully on the days of the weeks, so that you may remember and be set right.
translation:
  language: hi
  text: इसलिए, जब तुम यह पत्र पाओ, तो इसे अपनी सभाओं में ध्यान से पढ़ो। सप्ताहों के दिनों में[a] इसके शब्दों पर और भी अधिक ध्यान दो, ताकि तुम उन्हें स्मरण रखो और सुधारे जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सप्ताहों के दिनों में”; इसका सटीक आशय अनिश्चित है।
    reason: सिरियाई पदबंध असामान्य है और इसे “सप्ताह के दिनों में” अथवा किसी विशेष साप्ताहिक अवसर के संकेत के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  choice: मन लगाकर
  rationale: यह पद शांति, अवकाश और सावधान तत्परता का भाव दे सकता है। सामुदायिक पाठ के संदर्भ में “मन लगाकर” गंभीर और ध्यानपूर्ण पढ़ने का स्वाभाविक हिन्दी रूप है।
- source_word: ܬܬܗܪܘܢ ... ܝܬܝܪܐܝܬ
  choice: और भी अधिक ध्यान देना
  rationale: क्रिया सावधानी से विचार करने या ध्यान देने का भाव रखती है, और ܝܬܝܪܐܝܬ की तुलनात्मक तीव्रता “और भी अधिक” से व्यक्त होती है।
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  choice: सप्ताहों के दिनों में
  rationale: सिरियाई पाठ का शाब्दिक स्वरूप “सप्ताहों के दिनों” की ओर संकेत करता है। पाठ-सीमा की अनिश्चितता के कारण इसे “उपवास के दिनों” जैसे अधिक व्याख्यात्मक रूप में नहीं बदला गया।
- source_word: ܬܬܥܗܕܘܢ
  choice: स्मरण रखो
  rationale: मूल धातु स्मरण करने या मन में बनाए रखने का अर्थ देती है। पत्र की बातों के लिए हिन्दी में “इन्हें स्मरण रखो” स्पष्ट और स्वाभाविक है।
- source_word: ܬܬܪܨܘܢ
  choice: सुधारे जाओ
  rationale: क्रिया के मूल भाव में सीधा किया जाना अथवा सुधार पाना शामिल है। “सुधारे जाओ” उसके नैतिक-सुधारक और कर्मवाच्य भाव को बनाए रखता है।
theological_decisions:
- issue: उपदेश को परिचित भक्तिपरक या उपासना-पद्धति संबंधी भाषा में ढालना
  choice: सामुदायिक पाठ, स्मरण और सुधार पर केंद्रित संयत उपदेश
  alternative: इसे उपवास के दिनों या सामान्य ध्यान-साधना पर केंद्रित स्वतंत्र भावानुवाद बनाना
  rationale: मूल पाठ व्यावहारिक और उपदेशात्मक है। अनिश्चित समय-सूचक पद को किसी विशिष्ट धार्मिक प्रथा से जोड़ना स्रोत से अधिक अर्थ आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक संबोधन वाला रूप। बहुवचन संबोधन के लिए “तुम” रखा गया है; वाक्य विन्यास उपदेशात्मक है, पर अनावश्यक रूप से संस्कृतनिष्ठ या सांप्रदायिक नहीं।
