  text: 'And it happened, when I was praying, speaking the first words of this prayer, that I was disturbed and I trembled; and I was reflecting on the seed of humankind—how many are those who have gone, and how few are those who are kept. And as I was considering these things, I heard a voice that said to me:


    “Son of man, why are you troubled, and why are you alarmed? For before you were created, you were known to me, and before you came forth from your mother’s womb, you were promised to me. And for this reason these things that are to come were shown to you.”


    And I said to him, “Lord, you have shown me the multitude of the times, and what has happened in them; but you have not shown me how long it will be. Therefore I ask that I may hear concerning those who have borne witness for righteousness, what is the reward kept for them.” And a multitude of good things and of evil things that are coming was promised to me, and then I went up to the mountain.


    And it came to pass, after seven days, that I came to that place where there was a spring. And as I was sitting there, I was taken up on the chariot of a cloud—not in the body, and I did not know it. And a mystery was shown to me, and I heard a voice that said to me: “See and know how, in this world, their works and their labors are preserved, of those who have acted well and of those who have acted wickedly.”'
translation:
  language: hi
  text: 'जब मैं प्रार्थना कर रहा था और इस प्रार्थना के आरम्भिक शब्द बोल रहा था, तब मैं व्याकुल हो उठा और काँपने लगा। मैं मानवजाति के वंश के विषय में सोच रहा था—कितने अधिक हैं वे जो चले गए, और कितने थोड़े हैं वे जो सुरक्षित रखे जा रहे हैं। जब मैं इन बातों पर विचार कर रहा था, तब मैंने एक आवाज़ सुनी, जो मुझसे कह रही थी:


    “हे मनुष्य, तू क्यों व्याकुल है और क्यों भयभीत है? तेरे रचे जाने से पहले ही मैं तुझे जानता था, और तेरे अपनी माता के गर्भ से निकलने से पहले ही तुझे मेरे लिए प्रतिज्ञात किया गया था। इसी कारण आने वाली ये बातें तुझे दिखाई गईं।”[a]


    मैंने उससे कहा, “हे प्रभु, तूने मुझे युगों का विस्तार और उनमें घटी घटनाएँ दिखाई हैं, पर तूने मुझे यह नहीं दिखाया कि यह कब से कब तक होगा।[b] इसलिए मैं उन लोगों के विषय में सुनना चाहता हूँ जिन्होंने धार्मिकता के लिए गवाही दी है—उनके लिए कौन-सा प्रतिफल सुरक्षित रखा गया है?” तब मुझे आने वाली बहुत-सी अच्छी और बुरी बातों का वचन दिया गया, और इसके बाद मैं पर्वत पर चढ़ गया।


    सात दिन बाद मैं उस स्थान पर पहुँचा जहाँ एक सोता था। जब मैं वहाँ बैठा था, तब मुझे बादल के रथ पर ऊपर उठा लिया गया[c]—शरीर में नहीं, और मुझे मालूम नहीं था। फिर मुझे एक रहस्य दिखाया गया, और मैंने एक आवाज़ सुनी, जो मुझसे कह रही थी, “देख और जान कि इस संसार में उन लोगों के काम और परिश्रम किस प्रकार सुरक्षित रखे जाते हैं जिन्होंने भलाई की है, और उन लोगों के भी जिन्होंने बुराई की है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “इसी कारण मैंने तुझे आने वाली ये बातें दिखाई हैं।”
    reason: सीरियाई क्रियारूप को निष्क्रिय अथवा कर्तृवाच्य भाव में समझने की गुंजाइश है।
  - marker: b
    text: शाब्दिक रूप से, “किस समय से किस समय तक।”
    reason: मूल मुहावरा समय की आरम्भिक और अंतिम सीमा पूछता है।
  - marker: c
    text: या, “जब मैं वहाँ बादल के रथ पर बैठा था, तब मुझे ऊपर उठा लिया गया।”
    reason: वाक्य-विभाजन के कारण ‘बादल के रथ पर’ को बैठने या ऊपर उठाए जाने—दोनों में से किसी के साथ जोड़ा जा सकता है।
lexical_decisions:
- source_word: ܙܪܥܗ ܕܐܢܫܐ
  choice: मानवजाति का वंश
  rationale: ‘बीज’ का सामूहिक अर्थ भावी संतति या मानव वंश है; हिंदी में ‘वंश’ रूपक का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ܡܬܕܘܕ / ܡܬܪܗܒ
  choice: व्याकुल / भयभीत
  rationale: दोनों क्रियाओं के भेद—भीतरी अशांति और भय—को बनाए रखा गया है।
- source_word: ܬܬܒܪܐ
  choice: रचे जाने
  rationale: क्रिया के ‘बनाए/रचे जाने’ के अर्थ को रखता है और गर्भ में रूप लेने से आगे कोई दार्शनिक निष्कर्ष नहीं जोड़ता।
- source_word: ܝܕܝܥ ܗܘܝܬ ܠܝ / ܐܬܝܕܥܬ ܠܝ
  choice: मैं तुझे जानता था / तू मुझे ज्ञात था
  rationale: दोनों निकटवर्ती अभिव्यक्तियों में ईश्वरीय पूर्वज्ञान का सीधा अर्थ है; दूसरी को ‘प्रतिज्ञा की गई’ कहना स्रोत-क्रिया के अनुकूल नहीं है।
- source_word: ܡܢ ܐܝܕܐ ܥܕܡܐ ܠܐܝܕܐ
  choice: कब से कब तक
  rationale: यह समय की सीमा पूछने वाला मुहावरा है; हिंदी में यही स्वाभाविक और अर्थ-सटीक रूप है।
- source_word: ܬܘܪܨܐ
  choice: धार्मिकता
  rationale: संदर्भ में सच्चे/उचित आचरण के लिए दी गई गवाही अभिप्रेत है; ‘धार्मिकता’ न्यायपरक नैतिक अर्थ को खुला रखता है।
- source_word: ܐܫܬܘܕܝܘ
  choice: प्रतिज्ञा की गईं
  rationale: यहाँ निष्क्रिय रूप प्रतिज्ञा किए जाने का भाव देता है, मात्र सूचना दिए जाने का नहीं।
- source_word: ܡܪܟܒܬܐ ܕܥܢܢܐ
  choice: बादल का एक रथ
  rationale: प्रकाशनात्मक दृश्य के ठोस रथ-बिंब को यथावत रखता है।
- source_word: ܐܬܢܣܒܬ
  choice: ऊपर उठा लिया गया
  rationale: दर्शन में आरोहण व्यक्त करता है, पर स्थायी देहांतरण का अर्थ आरोपित नहीं करता।
- source_word: ܪܐܙܐ
  choice: रहस्य
  rationale: दैवी रूप से प्रकट गुप्त सत्य के प्रकाशनात्मक भाव को बनाए रखता है।
theological_decisions:
- issue: रचे जाने और गर्भ से निकलने से पहले बारूक का परमेश्वर को ज्ञात होना
  choice: इसे व्यक्तिगत ईश्वरीय पूर्वज्ञान के रूप में सीधे व्यक्त किया गया है।
  alternative: इसे किसी विशिष्ट भविष्यद्वक्ताई बुलाहट-सूत्र या पूर्व-अस्तित्व की शिक्षा के रूप में समझना।
  rationale: स्रोत ज्ञान का दावा करता है, पर उसके दार्शनिक या संप्रदायगत निहितार्थ निर्धारित नहीं करता।
- issue: ‘जो चले गए’ और ‘जो सुरक्षित रखे जा रहे हैं’ का विरोध
  choice: भाषा को खुला रखा गया है, ताकि यह मृत्यु और बचे हुए लोगों पर मनन के रूप में पढ़ी जा सके।
  alternative: इसे सीधे बहुतों के नाश और थोड़े लोगों के उद्धार की संख्या-संबंधी शिक्षा बनाना।
  rationale: स्रोत स्वयं उद्धार या दंड की स्पष्ट शब्दावली नहीं देता।
- issue: बारूक का ऊपर उठाया जाना
  choice: देह सहित न होने की स्पष्ट अस्वीकारोक्ति रखते हुए इसे दर्शनात्मक आरोहण के रूप में प्रस्तुत किया गया है।
  alternative: शारीरिक स्वर्गारोहण या केवल स्वप्न घोषित करना।
  rationale: पाठ शरीर को नकारता है, पर अनुभव की सटीक रीति नहीं बताता।
- issue: कामों और परिश्रमों का सुरक्षित रखा जाना
  choice: ‘सुरक्षित रखे जाते हैं’ रखा गया है।
  alternative: उन्हें अभी पुरस्कृत होना या केवल अंतिम न्याय के लिए लिखित अभिलेख में जमा होना।
