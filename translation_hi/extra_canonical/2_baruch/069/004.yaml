translation:
  language: hi
  text: और धर्मियों के समयों का अंत, जो उसके सामने पूरे होने वाले थे, एक ही अटल स्मृति के रूप में उसके सामने स्थिर हैं—उन बातों से अलग जिन्हें वह युग की समाप्ति पर करने वाला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܡܗ ܕܥܠܡܐ
  choice: युग की समाप्ति
  rationale: ܫܘܠܡܐ का अर्थ पूर्णता अथवा अंत और ܥܠܡܐ का अर्थ युग अथवा संसार हो सकता है; इस अंतकालीन संदर्भ में ‘युग की समाप्ति’ मूल अर्थ और साहित्यिक प्रसंग दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܩܿܝܡ ܚܕܐ ܕܘܟܪܢܗܘܢ
  choice: एक स्थिर स्मरण के रूप में विद्यमान हैं
  rationale: इस वाक्यांश में परमेश्वर के सामने घटनाओं का एक संयुक्त, स्थापित स्मरण बने रहने का भाव है; ‘विद्यमान हैं’ स्थायी उपस्थिति को और ‘स्थिर स्मरण’ उसके अटल स्वरूप को व्यक्त करता है।
- source_word: ܙܕܝ̈ܩܐ
  choice: धर्मियों
  rationale: यह धर्मी अथवा न्यायी लोगों के लिए सामान्य प्राचीन धार्मिक पद है; आधुनिक हिन्दी में ‘धर्मियों’ सहज और गरिमापूर्ण है।
theological_decisions:
- issue: परमेश्वर के सामने भावी घटनाओं का स्मरण
  choice: जो उसके सामने पूरे होने वाले थे, एक स्थिर स्मरण के रूप में विद्यमान हैं
  alternative: जिन्हें उसने पहले से निर्धारित किया था
  rationale: मूल पाठ पूर्वनिर्धारण की कोई विशिष्ट दार्शनिक व्याख्या नहीं करता; इसलिए उसे केवल परमेश्वर के सामने भावी घटनाओं की स्थिर उपस्थिति के रूप में रखा गया है।
- issue: ܥܠܡܐ का अर्थ
  choice: युग
  alternative: संसार
  rationale: ‘युग की समाप्ति’ अपोकैलिप्टिक संदर्भ में अधिक उपयुक्त है, पर यह किसी विशिष्ट अंतकालीन प्रणाली को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सरल रखी गई है। वाक्य की भावी-दृष्टि और परमेश्वर के सामने उसके स्थिर स्मरण के बीच का तनाव बिना अतिरिक्त धर्मवैज्ञानिक स्पष्टीकरण के सुरक्षित रखा गया है।
