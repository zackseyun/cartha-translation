translation:
  language: hi
  text: क्योंकि केवल वही जानता है कि क्या होने वाला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܠܚܘܕܘܗܝ
  choice: केवल वही
  rationale: यह रूप कर्ता की अनन्यता पर बल देता है; हिन्दी में ‘केवल वही’ इस जोर को स्वाभाविक रूप से बनाए रखता है।
- source_word: ܝܿܕܥ
  choice: जानता है
  rationale: स्रोत के सामान्य ज्ञानवाचक क्रिया-रूप का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: ܡܕܡ ܕܥܬܝܕ ܠܡܗܘܐ
  choice: क्या होने वाला है
  rationale: भावी घटना के स्रोतगत अर्थ को आधुनिक, सहज हिन्दी में व्यक्त करता है, बिना उसे कठोर नियतिवाद की ओर सीमित किए।
theological_decisions:
- issue: ‘वही’ के संदर्भ की पहचान
  choice: स्रोत की तरह सर्वनाम ‘वही’ रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर’ कहना
  rationale: इस पद में स्रोत सर्वनाम का प्रयोग करता है; संज्ञा जोड़ना संदर्भ की व्याख्या को अनावश्यक रूप से पाठ में समाहित कर देता।
- issue: भावी घटना और पूर्वनियति
  choice: ‘होने वाला है’
  alternative: ‘होना नियत है’
  rationale: ܥܬܝܕ भावी होने का संकेत देता है; ‘नियत है’ अनावश्यक रूप से अधिक कठोर धर्मवैज्ञानिक निष्कर्ष जोड़ सकता है।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी; मूल वाक्य की कारणसूचक रचना तथा कर्ता पर दिए गए बल को सुरक्षित रखा गया है।
