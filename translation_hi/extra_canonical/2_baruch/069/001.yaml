  choice: वे उन सबसे अधिक काले थे जो उनसे पहले आए थे
  rationale: तुलनात्मक भाव और पहले के काले जलों से संबंध दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ܗܢܘܢ ܗܘ
  choice: वे यही हैं…
  rationale: उपलब्ध सिरियाई पाठ में वाक्यांश इसी अधूरे रूप पर रुक जाता है; हिन्दी में उसकी अपूर्णता को दीर्घविराम से दिखाया गया है, बिना छूटा हुआ आशय गढ़े।
