- source_word: ܡ̈ܝܐ ܐܚܪ̈ܢܐ
  choice: अंतिम जल
  rationale: ܐܚܪ̈ܢܐ का अर्थ ‘दूसरे/बाद के’ भी हो सकता है, पर दर्शन में जलों की क्रमिक शृंखला के इस अंतिम चरण में ‘अंतिम’ प्रसंगानुकूल है।
