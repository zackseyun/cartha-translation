translation:
  language: hi
  text: इसलिए घड़ियाँ घड़ियों के साथ नहीं गिनी जातीं, और न समय समयों के साथ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘ̈ܩܢܘܐ
  choice: घड़ियाँ
  rationale: संदर्भ में यह समय की छोटी, गिनी जाने वाली इकाइयों को सूचित करता है; ‘घड़ियाँ’ मूल के बहुवचन और गणना-संबंधी भाषा को बनाए रखता है।
- source_word: ܢܗܝܪܐ
  choice: समय
  rationale: यहाँ दूसरे प्रकार के काल-अवधियों के लिए व्यापक और स्वाभाविक हिन्दी शब्द चुना गया है; पुनरुक्ति मूल वाक्य की तुलना को सुरक्षित रखती है।
- source_word: ܡ̈ܢܝܢ
  choice: गिनी जातीं
  rationale: मूल की गणना करने वाली निष्क्रिय अभिव्यक्ति को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दो समय-संबंधी पदों का क्रम
  choice: पहले ‘घड़ियाँ’, फिर ‘समय’
  alternative: पहले ‘समय’, फिर ‘घड़ियाँ’
  rationale: उपलब्ध सिरियाई पाठ में छोटी समय-इकाई वाला पद पहले और व्यापक काल-सूचक पद बाद में आता है; क्रम बदलने का कोई पर्याप्त भाषिक या धर्मवैचारिक कारण नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल की समानांतर वाक्य-रचना के निकट अनुवाद। ‘समय समयों’ जैसे अस्वाभाविक बहुवचन से बचते हुए पुनरुक्ति द्वारा मूल का बल बनाए रखा गया है।
