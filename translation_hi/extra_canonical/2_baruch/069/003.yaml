translation:
  language: hi
  text: क्योंकि जो बुरी और अच्छी बातें होने वाली हैं, वे उसके सामने एक स्थिर स्मृति के रूप में उपस्थित हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝ̈ܫܬܐ ... ܘ̈ܛܒܬܐ (bīšātā ... w-ṭābātā)
  choice: बुरी और अच्छी बातें
  rationale: दोनों स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त हैं; ‘बातें’ व्यापक है और घटनाओं, कर्मों या परिस्थितियों में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ܥܬܝܕܝܢ ... ܕܢܗܘܘܢ (ʿtīdīn ... d-nehwōn)
  choice: होने वाली हैं
  rationale: यह भावी या नियत अस्तित्व का सामान्य अर्थ देता है और कृदंत तथा भावी क्रिया के मेल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܩܕܡܘܗܝ ܩܿܝܡܢ (qḏāmauhi qāymān)
  choice: उसके सामने ... विद्यमान हैं
  rationale: शाब्दिक ‘खड़ी हैं’ निर्जीव ‘बातों’ के साथ कृत्रिम होता; ‘विद्यमान हैं’ सामने उपस्थित रहने का आशय सुरक्षित रखता है।
- source_word: ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ (ḥdā dukrānhōn šrā)
  choice: एक स्थिर स्मृति के रूप में
  rationale: वाक्यांश की संक्षिप्त और कुछ कठिन संरचना को बनाए रखते हुए ‘एक’, ‘स्मृति’ और स्थिर/दृढ़ होने के भाव को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के सामने भावी बुराइयों और भलाइयों की उपस्थिति
  choice: ‘उसके सामने ... विद्यमान हैं’
  alternative: ‘वह उन्हें पहले से जानता है’
  rationale: वैकल्पिक कथन निहित सर्वज्ञान को व्याख्यात्मक रूप से स्पष्ट कर देता, जबकि स्रोत उपस्थित होने और स्मृति की चित्रात्मक भाषा का उपयोग करता है; इसलिए उस तनाव और रूपक को रखा गया है।
- issue: ‘स्थिर स्मृति’ का कर्ता या विधेय संबंध
  choice: इसे ‘एक स्थिर स्मृति के रूप में’ उपस्थित बताया गया है
  alternative: ‘उनकी स्मृति एक ही और स्थिर है’
  rationale: स्रोत का वाक्य-विन्यास संक्षिप्त और अस्पष्ट है; चुना हुआ रूप English POB की समझ के अनुरूप है, पर पादटिप्पणी में अधिक शाब्दिक संभावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘बातें’ और ‘विद्यमान’ स्रोत की व्यापकता तथा उपस्थिति की छवि को बनाए रखते हैं; सर्वज्ञान जैसी धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ा नहीं गया।
