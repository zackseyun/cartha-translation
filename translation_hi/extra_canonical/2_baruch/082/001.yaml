    फिर कोई संपत्ति उसे खोजनेवालों के लिए मृत्यु की ओर लौटने का कारण नहीं बनेगी। मज़दूरी छीननेवाले फिर असमय मृत्यु उत्पन्न नहीं करेंगे, और वह मृत्यु, जो दुःखों की मज़दूरी है, उठा ली जाएगी। केवल सुख भोगने के लिए आनंद का कोई अवसर फिर न रहेगा। परिवर्तन का क्षेत्र सिद्ध संघर्ष में बदल जाएगा[b], और अधोलोक में पापियों की आवाज़ फिर सुनाई नहीं देगी।


