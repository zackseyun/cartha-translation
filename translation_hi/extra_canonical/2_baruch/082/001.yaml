  text: '**2 बारूक 82:1**


    अभी हम देखते हैं कि अन्यजातियाँ दुष्टता करते हुए भी कितनी समृद्ध हैं, पर उनकी तुलना केवल एक बूँद से की जाती है। हम उनके सामर्थ्य का ज़ोर देखते हैं, पर वे थूक के समान गिने जाएँगे। हम उनकी महानता की महिमा पर विचार करते हैं, यद्यपि वे शक्तिमान की आज्ञाओं का पालन नहीं करते, बल्कि उन्होंने उनका तिरस्कार किया है। हम उनके दिखाई देनेवाले सौन्दर्य पर भी विचार करते हैं, यद्यपि वह विपत्तियों में डगमगाता है; परन्तु पीड़ा से तड़पते शरीर की तरह उनकी खोज की जाएगी। हम उस भरोसे पर विचार करते हैं जिस पर वे निर्भर हैं, यद्यपि वह हमारी आँखों के सामने डगमगा रहा है; पर वे लहर की तरह कुचल दिए जाएँगे। हम केवल उनके बल से मिलनेवाली आशा को देखते हैं, यद्यपि वह उन अच्छी वस्तुओं के कारण फल-फूल रही है जो परमेश्वर ने उन्हें दी हैं; पर वह रख दी जाएगी और उसके लिए विलाप किया जाएगा।


    क्योंकि परमप्रधान अपने ठहराए हुए समयों को शीघ्र ला रहा है और अपनी घड़ियों को निकट कर रहा है। वह अत्याचारियों का न्याय करेगा, और आनेवाले युग की घोषणाएँ निकल पड़ेंगी। उनके सभी पापों की छिपी बातें प्रकट हो जाएँगी, और जो उचित है उसके नम्र विचार फूट निकलेंगे। जो अभी समझते हैं कि वे बच निकलेंगे, वे अपने आपको बचा न सकेंगे; और भोजन की बहुतायत के सहारे कोई अकाल से वाचा न बाँध सकेगा। नम्र लोग समृद्धि पर आशा नहीं रखेंगे; इसके बजाय उनका हृदय उन बातों के कारण आनन्दित होता है जो बनी रहती हैं। वे और भी अधिक आशा रखेंगे, क्योंकि वह भयावह अन्त आ पहुँचा है। वे वर्तमान युग के सुख-विलास की ओर नहीं देखेंगे और केवल इतना जानेंगे कि उन्हें अन्त की ओर ले जाया जा रहा है। पर संसार का समापन उसके शासन की महान सामर्थ्य प्रकट करेगा, जब हर वस्तु भीतर की ओर प्रवेश करेगी[a] और उस दशा में लौट जाएगी जो आरम्भ से उसके लिए ठहराई गई थी। तब यह दिखाई देगा कि जो पाया गया है, उसे मनुष्यों ने स्थापित नहीं किया, बल्कि वह सचमुच अपनी पूर्णता तक पहुँच गया है।


    क्योंकि जो कुछ स्थिर था, या बनाया गया, या संघर्ष में आया और बीत गया, वह यह दिखाता है: बुराई सदा बुराई नहीं रहती और भलाई सदा भलाई नहीं रहती। हर प्रकार का स्वास्थ्य रोग में, हर सामर्थ्य निर्बलता में, हर सौन्दर्य कुरूपता में और जवानी की सारी शोभा बोझिल बुढ़ापे में बदल जाती है। जो भी सौन्दर्य तुमने देखा, वह अन्धकार और सड़न में बदल जाता है; और तुम्हारे द्वारा किया गया हर विनाश शान्ति और सुख में बदल जाता है। दिया गया हर अन्धकार सत्य के प्रकाश में बदल जाता है। हर भटकाव और निर्बलता स्थिरता की नम्रता में बदल जाती है। हर प्रतिशोध और क्रोध विश्राम और सामर्थ्य में बदल जाता है। और जागते हुओं की हर आवाज़ धूल से जन्मे मौन में बदल जाती है।


    फिर कोई सम्पत्ति उसे खोजनेवालों के लिए मृत्यु की ओर लौटने का कारण नहीं बनेगी। मज़दूरी छीननेवाले फिर असमय मृत्यु उत्पन्न नहीं करेंगे, और वह मृत्यु, जो दुःखों की मज़दूरी है, उठा ली जाएगी। केवल सुख भोगने के लिए आनन्द का कोई अवसर फिर न रहेगा। परिवर्तन का क्षेत्र पूरे किए गए संघर्ष में बदल जाएगा[b], और अधोलोक में पापियों की आवाज़ फिर सुनाई नहीं देगी।


    इसलिए जब ये सब बातें घटित होंगी, तो क्या तुम समझते हो कि पृथ्वी के निवासियों से एक ही दिन में उनका लेखा नहीं माँगा जाएगा? यदि उनके अपने प्रकट किए हुए भेद यह दिखाते हैं कि वे जीवित हैं, तो उनका दोष स्वयं उनके भीतर के झूठ को प्रकट करता है। मैंने उसका पूरा माप लिख दिया है, क्योंकि मेरे मरने से पहले ही वे झूठ से उत्पन्न हुए थे। और मैंने कहा कि वे बुराई पर भरोसा रख रहे थे।


