  revised_text: '**2 बारूक 82:1**


    अभी हम देखते हैं कि अन्यजातियाँ दुष्टता करते हुए भी कितनी समृद्ध हैं, पर उनकी तुलना केवल एक बूँद से की जाती है। हम उनके सामर्थ्य का ज़ोर देखते हैं, पर वे थूक के समान गिने जाएँगे। हम उनकी महानता की महिमा पर विचार करते हैं, यद्यपि वे शक्तिमान की आज्ञाओं का पालन नहीं करते, बल्कि उन्होंने उनका तिरस्कार किया है। हम उस दिखाई देनेवाले सौंदर्य पर भी विचार करते हैं, यद्यपि वह विपत्तियों में डगमगाता है; पर उनकी खोज पीड़ा से तड़पते शरीर की तरह की जाएगी। हम उस भरोसे पर विचार करते हैं जिस पर वे निर्भर हैं, यद्यपि वह हमारी आँखों के सामने डगमगा रहा है; पर वे लहर की तरह कुचल दिए जाएँगे। हम केवल उनके बल की आशा को देखते हैं, यद्यपि वह उन अच्छी वस्तुओं के कारण फल-फूल रही है जो परमेश्वर ने उन्हें दी हैं; पर वह रख दी जाएगी और उसके लिए विलाप किया जाएगा।


    क्योंकि परमप्रधान अपने ठहराए हुए समयों को शीघ्र ला रहा है और अपनी घड़ियों को निकट कर रहा है। वह अत्याचारियों का न्याय करेगा, और युग की घोषणाएँ निकल पड़ेंगी। उनके सभी पापों की छिपी बातें प्रकट हो जाएँगी, और जो उचित है उसके नम्र विचार फूट निकलेंगे। जो अभी समझते हैं कि वे बच निकलेंगे, वे अपने आपको बचा न सकेंगे; और भोजन की बहुतायत के सहारे कोई अकाल से वाचा न बाँध सकेगा। नम्र लोग समृद्धि पर आशा नहीं रखेंगे; इसके बजाय उनका हृदय उन बातों के कारण आनंदित होता है जो बनी रहती हैं। वे और भी अधिक आशा रखेंगे, क्योंकि वह भयावह अन्त आ पहुँचा है। वे वर्तमान युग के सुख-विलास की ओर नहीं देखेंगे और केवल इतना जानेंगे कि उन्हें अन्त की ओर ले जाया जा रहा है। पर संसार का समापन उसके शासन की महान सामर्थ्य प्रकट करेगा, जब हर वस्तु भीतर की ओर प्रवेश करेगी[a] और उस दशा में लौट जाएगी जो आरम्भ से उसके लिए ठहराई गई थी। तब यह दिखाई देगा कि जो पाया गया है, उसे मनुष्यों ने स्थापित नहीं किया, बल्कि वह सचमुच अपनी पूर्णता तक पहुँच गया है।


