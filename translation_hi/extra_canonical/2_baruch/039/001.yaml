  text: And he answered and said to me, “But this is the interpretation of the vision that you saw.
translation:
  language: hi
  text: 'तब उसने उत्तर देकर मुझसे कहा, “परन्तु, यह उस दर्शन की व्याख्या है जो तुमने देखा था:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܘܫܩܗ
  choice: अर्थ
  rationale: यह शब्द किसी दर्शन की व्याख्या या अर्थ खोलने को दर्शाता है। आधुनिक हिन्दी में ‘अर्थ’ स्वाभाविक है और आगे आने वाले विवरण का स्पष्ट परिचय देता है।
- source_word: ܚܙܘܐ
  choice: दर्शन
  rationale: संदर्भ एक प्रतीकात्मक, प्रकाशनात्मक दृश्य का है; ‘दर्शन’ इस साहित्यिक और धार्मिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ܒܪܡ
  choice: परन्तु
  rationale: यह विरोध अथवा विषय को निर्णायक ढंग से आगे बढ़ाने वाला अव्यय है। ‘परन्तु’ उसके औपचारिक बल को बनाए रखता है, यद्यपि प्रसंग में इसका अर्थ ‘अब’ या ‘तो’ के निकट भी समझा जा सकता है।
theological_decisions:
- issue: दर्शन की व्याख्या को ऐतिहासिक पहचान से जोड़ना
  choice: पद में केवल दर्शन के ‘अर्थ’ का परिचय दिया गया है; किसी राज्य या ऐतिहासिक साम्राज्य की पहचान नहीं जोड़ी गई।
  alternative: व्याख्यात्मक रूप से आगे वर्णित राज्यों को नाम देना।
  rationale: सिरियाई पाठ इस पद में केवल प्रतीकात्मक दर्शन की व्याख्या आरम्भ करता है। अनुवाद को आगे के प्रकाशनात्मक तनाव को बनाए रखना चाहिए, न कि टिप्पणी को मूल पाठ में मिला देना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आरम्भिक ‘तब’ कथात्मक क्रम को स्वाभाविक बनाता है। अन्त में द्विबिंदु यह दिखाता है कि दर्शन की व्याख्या अगले पदों में जारी रहती है।
