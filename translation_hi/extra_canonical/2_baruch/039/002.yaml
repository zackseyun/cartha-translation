translation:
  language: hi
  text: तुमने जिस विशाल वन को देखा था, जिसके चारों ओर ऊँचे और दुर्गम पहाड़ थे, उसका अर्थ यह है:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “यह बात है।”'
    reason: सिरिएक ܗܕܐ ܗܝ ܡܠܬܐ के शाब्दिक रूप को सुरक्षित रखना, जबकि मुख्य पाठ में प्रसंगानुकूल ‘अर्थ’ दिया गया है।
lexical_decisions:
- source_word: ܥܒܐ
  choice: विशाल वन
  rationale: दर्शन के संदर्भ में यह शब्द घने/बड़े वन को दर्शाता है; ‘विशाल वन’ स्वाभाविक हिन्दी में उसके परिमाण को व्यक्त करता है।
- source_word: ܪ̈ܒܐ ܘܩܫܝܐ
  choice: ऊँचे और दुर्गम पहाड़
  rationale: ܪ̈ܒܐ यहाँ पहाड़ों की विशालता/ऊँचाई और ܩܫܝܐ उनकी कठोर, बीहड़ प्रकृति बताता है; ‘दुर्गम’ आधुनिक हिन्दी में इस दृश्य को संक्षेप में व्यक्त करता है।
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: उसका अर्थ यह है
  rationale: शाब्दिक रूप ‘यह वचन/बात है’ है, पर दर्शन की व्याख्या प्रस्तुत करने वाले प्रसंग में ‘अर्थ’ अभिप्रेत है।
theological_decisions:
- issue: अंतिम वाक्यांश को राज्य के उदय के कथन के रूप में पढ़ना
  choice: ‘उसका अर्थ यह है’ रखा गया
  alternative: ‘यह वह राज्य है जो उन दिनों उठेगा’
  rationale: वैकल्पिक कथन इस पद के सिरिएक पाठ में नहीं है और आगे के पदों की विषयवस्तु को समय से पहले यहाँ ले आता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबंधवाचक वाक्य-विन्यास से वन और उसे घेरे पहाड़ों का संबंध स्पष्ट किया गया है।
