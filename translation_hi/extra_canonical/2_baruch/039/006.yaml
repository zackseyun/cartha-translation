translation:
  language: hi
  text: और उसमें सत्य स्थापित होगा, और अधर्म से कलंकित सब लोग उसकी ओर भागेंगे, जैसे जंगली पशु और रेंगनेवाले जीव वन में भाग जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܬܬܩܝܡ ܒܗ̇ ܫܪܪܐ
  choice: और उसमें सत्य स्थापित होगा
  rationale: प्रस्तुत सिरिएक पाठ में ܬܬܩܝܡ का अर्थ ‘स्थापित होगा’ और ܫܪܪܐ का सामान्य अर्थ ‘सत्य’ है। इसलिए ‘सत्य अपने को छिपाएगा’ इस प्रतिपादन को नहीं अपनाया गया।
- source_word: ܕܡܟܬܡܝܢ ܒܥܘܠܐ
  choice: अधर्म से कलंकित
  rationale: ܡܟܬܡܝܢ कलंकित या दागदार होने और ܥܘܠܐ अधर्म/अन्याय का बोध कराता है।
- source_word: ܘܬܥܪܘܩ ܠܘܬܗ̇
  choice: उसकी ओर भागेंगे
  rationale: ܠܘܬܗ̇ दिशा सूचित करता है—‘उसकी ओर’; स्त्रीलिंग संकेत प्रसंग की ‘राज्य’ संज्ञा की ओर है।
- source_word: ܐܝܟ ܕܥܪܩܝܢ ... ܒܥܒܐ
  choice: जैसे दुष्ट पशु भागकर वन में रेंगते हुए घुस जाते हैं
  rationale: उपमा में पशुओं के भागने और वन में रेंगकर प्रवेश करने की संयुक्त क्रिया को स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: राज्य में सत्य की स्थिति
  choice: सत्य स्थापित होगा
  alternative: सत्य अपने को छिपाएगा / सुरक्षा स्थापित होगी
  rationale: मुद्रित सिरिएक ܘܬܬܩܝܡ ܒܗ̇ ܫܪܪܐ स्पष्टतः सत्य के स्थापित होने का समर्थन करता है; न ‘छिपने’ वाला क्रियापद है, न यहाँ ܫܪܪܐ को ‘सुरक्षा’ करना आवश्यक है।
- issue: अधर्मियों के भागने की दिशा
  choice: राज्य की ओर भागेंगे
  alternative: राज्य से भागेंगे
  rationale: सिरिएक ܠܘܬܗ̇ ‘उसकी ओर’ कहता है। यद्यपि भावार्थ में तनाव उत्पन्न होता है, उसे व्याख्यात्मक रूप से उलटा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘अधर्म’, ‘सत्य’ और ‘स्थापित’ स्रोत के धार्मिक-नैतिक स्वर को बिना सांप्रदायिक विस्तार के सुरक्षित रखते हैं।
