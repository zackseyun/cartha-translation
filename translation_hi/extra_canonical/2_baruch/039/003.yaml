translation:
  language: hi
  text: और वह राज्य, जिसने पहले सिय्योन को नष्ट किया था, नष्ट किया जाएगा और उसके बाद आनेवाले के अधीन किया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: राज्य
  rationale: यहाँ शब्द राजनीतिक सत्ता अथवा साम्राज्य का बोध कराता है; ‘राज्य’ प्रसंगानुकूल और स्वाभाविक हिन्दी है।
- source_word: ܬܚܒܠ / ܚܒܠܬ
  choice: नष्ट कर दिया जाएगा / नष्ट किया था
  rationale: एक ही धातु को दोनों स्थानों पर समान अर्थ देकर राज्य के पूर्व विनाशकारी कार्य और उसके भावी विनाश के बीच मूल का संबंध बनाए रखा गया है।
- source_word: ܬܫܬܥܒܕ
  choice: अधीन कर दिया जाएगा
  rationale: मूल का अर्थ किसी सत्ता के वश या शासनाधीन किए जाने का है; कर्मवाच्य रूप सुरक्षित रखा गया है।
- source_word: ܠܗܘ ܕܐܬܐ ܒܬܪܗ
  choice: उसके बाद आनेवाले
  rationale: यह अभिव्यक्ति उत्तरवर्ती शासक, सत्ता या राज्य की पहचान स्पष्ट किए बिना उसका उल्लेख करती है; अनुवाद उसी अनिर्दिष्टता को बनाए रखता है।
theological_decisions:
- issue: ‘उसके बाद आनेवाले’ की पहचान
  choice: मुख्य पाठ में पहचान को अनिर्दिष्ट रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘उसके बाद आनेवाले राज्य’ या किसी मसीही व्यक्ति के रूप में प्रस्तुत करना।
  rationale: सीरियाई पाठ केवल ‘उसके बाद आनेवाले’ कहता है। निकट प्रसंग उत्तरवर्ती राज्य का संकेत दे सकता है, पर इस पद में संज्ञा स्पष्ट नहीं है; इसलिए किसी विशिष्ट धर्मवैज्ञानिक पहचान को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली रखी गई है। ‘सिय्योन’ पारंपरिक बाइबलीय नाम-रूप है; समान धातु वाले दोनों विनाश-सूचक क्रियारूपों को हिन्दी में भी समान रखा गया है।
