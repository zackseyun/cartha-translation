  yaml_path: translation/extra_canonical/2_baruch/039/007.yaml
  text: And it will happen that, when the time of its completion draws near for it to fall, then the reign of my Messiah will be revealed, which is like the fountain and like the vine.
translation:
  language: hi
  text: और ऐसा होगा कि जब उसके अंत का समय निकट आएगा और वह गिर पड़ेगी, तब मेरे मसीह का शासन[a] प्रकट होगा, जो सोते और दाखलता के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आरंभ” अथवा “प्रधानता।”
    reason: सिरियाई ܪܝܫܝܬܐ में शासन/प्रधानता के साथ आरंभ का अर्थ भी संभव है।
lexical_decisions:
- source_word: ܫܘܠܡܗ̇
  choice: उसके अंत
  rationale: यह शब्द पूर्णता, परिणति या अंत का भाव रखता है; यहाँ राज्य के गिरने के प्रसंग में स्वाभाविक हिन्दी ‘अंत’ है।
- source_word: ܬܦܠ
  choice: वह गिरने वाली होगी
  rationale: स्रोत में राज्य के पतन का स्पष्ट क्रियात्मक संकेत है; इसे छोड़ा नहीं गया। स्त्रीलिंग ‘वह’ का संबंध पूर्ववर्ती ‘राज्य-सत्ता’ से है।
- source_word: ܪܝܫܝܬܗ ܕܡܫܝܚܝ
  choice: मेरे मसीह का शासन
  rationale: ܪܝܫܝܬܐ आरंभ, प्रधानता या शासनाधिकार का भाव दे सकता है। इस राजकीय संदर्भ में ‘शासन’ सबसे स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ܡܒܘܥܐ
  choice: सोता
  rationale: बहते जल के उद्गम या झरने के अर्थ को साधारण, सजीव हिन्दी में व्यक्त करता है।
- source_word: ܓܦܢ
  choice: दाखलता
  rationale: अंगूर की बेल के लिए प्रतिष्ठित और संक्षिप्त बाइबिलीय हिन्दी शब्द।
theological_decisions:
- issue: ‘मेरे मसीह’ से जुड़ी ܪܝܫܝܬܐ की व्याख्या
  choice: शासन
  alternative: आरंभ या प्रधानता
  rationale: राज्यों के क्रम और मसीह के प्रकट होने का प्रसंग ‘शासन’ का समर्थन करता है, पर मूल शब्द की अर्थ-व्याप्ति को पादटिप्पणी में रखा गया है; किसी विशिष्ट मसीही सिद्धांत को आरोपित नहीं किया गया।
- issue: पतन का कर्ता
  choice: पूर्ववर्ती राज्य-सत्ता को ‘वह’ माना गया
  alternative: समय पूरा होने को अवैयक्तिक ढंग से प्रस्तुत करना
  rationale: सिरियाई में ‘गिरने’ की क्रिया स्पष्ट है और संदर्भ में निकटतम विषय राज्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘सोता’ और ‘दाखलता’ प्रतीकात्मक भाषा को संक्षिप्त रखते हैं। मुख्य पाठ में पादटिप्पणी चिह्न [a] उपस्थित है।
