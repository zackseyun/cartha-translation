base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/005.yaml
  text: And after these a fourth kingdom will arise, whose power will be harsher and worse than those that were before it. It will rule for many times like the forests of the plain, and it will hold the times in its grasp and lift itself up more than the cedars of Lebanon.
translation:
  language: hi
  text: इनके बाद एक चौथा राज्य उठेगा, जो उससे पहले के सभी राज्यों से अधिक कठोर और बुरा होगा। वह मैदान के वनों के समान बहुत-से कालों तक शासन करेगा, बहुत-से कालों को देखेगा[a], और लबानोन के देवदारों से भी अधिक ऊँचा उठेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “कालों को देखेगा” है। इसका भाव यह भी हो सकता है कि वह अनेक कालखंडों तक बना रहेगा। कुछ अनुवाद प्रसंग के आधार पर इसे कालों पर अधिकार रखने के अर्थ में लेते हैं।
    reason: सिरियाई क्रिया का प्रत्यक्ष अर्थ बनाए रखते हुए प्रसंगगत व्याख्यात्मक संभावना को नोट में सीमित रखने के लिए।
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: राज्य
  rationale: यहाँ शब्द क्रमशः उठने वाली राजनीतिक सत्ता या साम्राज्य को दर्शाता है; सामान्य हिन्दी में “राज्य” स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ܙܒܢܐ / ܙܒ̈ܢܐ
  choice: बहुत समय / अनेक काल
  rationale: एकवचन और बहुवचन रूपों के अंतर को हिन्दी में बनाए रखा गया है; बहुवचन संभवतः अलग-अलग कालखंडों या युगों की ओर संकेत करता है।
- source_word: ܥܒ̈ܐ ܕܦܩܥܬܐ
  choice: मैदान के वन
  rationale: रूपक को सीधे रखा गया है; यह व्यापक और घने विस्तार का बिंब देता है।
- source_word: ܐܪ̈ܙܐ ܕܠܒܢܢ
  choice: लबानोन के देवदार
  rationale: भौगोलिक नाम और प्रसिद्ध वृक्ष-रूपक दोनों सुरक्षित रखे गए हैं।
- source_word: ܬܬܩܢ
  choice: ऊँचा उठेगा
  rationale: क्रिया में दृढ़ होने, स्थापित होने या अपने को महान बनाने का भाव हो सकता है; देवदारों से तुलना के संदर्भ में “ऊँचा उठेगा” स्वाभाविक है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
theological_decisions:
- issue: चौथे राज्य की ऐतिहासिक पहचान
  choice: राज्य को अनाम रखा गया है
  alternative: किसी विशिष्ट साम्राज्य से इसकी पहचान करना
  rationale: इस पद में राज्य का नाम नहीं दिया गया; अनुवाद को व्याख्यात्मक ऐतिहासिक पहचान थोपनी नहीं चाहिए।
- issue: कालों पर राज्य के संबंध का अर्थ
  choice: “अनेक काल देखेगा”
  alternative: “कालों को अपने वश में रखेगा”
  rationale: सिरियाई पाठ की क्रिया का प्रत्यक्ष अर्थ “देखना” है। अधिक अधिकारसूचक अर्थ संभव है, पर उसे मुख्य पाठ में निश्चित कर देना स्रोत की अस्पष्टता मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। राज्य के लिए पुल्लिंग सर्वनाम और क्रियाएँ प्रयुक्त हैं। रूपकों को व्याख्यात्मक रूप से बदलने के बजाय यथासंभव सुरक्षित रखा गया है।
