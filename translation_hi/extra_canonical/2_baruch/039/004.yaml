  text: And that one too, after a time, will be destroyed, and another will arise, a third; and it too will rule in its time and will be destroyed.
translation:
  language: hi
  text: और वह भी कुछ समय के बाद नष्ट हो जाएगा; फिर एक और, तीसरा राज्य, उठ खड़ा होगा; वह भी अपने समय में शासन करेगा और नष्ट हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܚܒܠ
  choice: नष्ट हो जाएगा
  rationale: क्रिया राज्य के विनाश या पतन को व्यक्त करती है; सरल आधुनिक हिन्दी में ‘नष्ट हो जाएगा’ प्रसंग के अनुकूल है।
- source_word: ܐܚܪܢܐ / ܬܠܝܬܝܐ
  choice: एक और, अर्थात् तीसरा राज्य
  rationale: क्रमिक राज्यों के प्रसंग में निहित ‘राज्य’ को हिन्दी में स्पष्ट किया गया है, जबकि ‘तीसरा’ का क्रम सुरक्षित रखा गया है।
- source_word: ܙܒܢܗ
  choice: अपने समय में
  rationale: राज्य के लिए नियत या उसके अपने शासनकाल का भाव बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ܢܫܬܠܛ
  choice: शासन करेगा
  rationale: अधिकार या प्रभुत्व चलाने के अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्रमिक राज्य की पहचान
  choice: राज्य को केवल ‘तीसरा’ कहा गया है, उसकी ऐतिहासिक पहचान नहीं जोड़ी गई।
  alternative: किसी विशिष्ट साम्राज्य का नाम देना
  rationale: पद स्वयं कोई नाम नहीं देता; अनावश्यक ऐतिहासिक या सांप्रदायिक पहचान थोपने से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी-संबंधी गरिमा बनाए रखते हुए वाक्य सहज और सामान्य पाठकों के लिए स्पष्ट रखा गया है।
