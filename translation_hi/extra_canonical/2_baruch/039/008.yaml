  yaml_path: translation/extra_canonical/2_baruch/039/008.yaml
  text: 'And when it is revealed, it will uproot the multitude of its host. And as for the tall cedar that you saw left from that forest, and the words that the vine spoke with it which you heard—this is the meaning:'
translation:
  language: hi
  text: 'और जब वह प्रकट होगा, तब वह उस राज्य की सेना के जनसमूह को जड़ से उखाड़ देगा। फिर जो ऊँचा देवदार तुमने उस वन में बचा हुआ देखा था, और उस दाखलता ने उससे जो बातें कहीं, जिन्हें तुमने सुना[a]—उनका अर्थ यह है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उस दाखलता ने उससे जो बातें कहीं—जिन्हें तुमने सुना—उनका अर्थ यह है:”
    reason: स्रोत में संबंधवाचक वाक्यांश का जुड़ाव और विराम एक से अधिक ढंग से स्वाभाविक रूप में रखा जा सकता है।
lexical_decisions:
- source_word: ܡܐ ܕܐܬܓܠܝܬ
  choice: जब वह प्रकट होगा
  rationale: क्रिया का रूप प्रसंग में मसीहा के भविष्य में प्रकट होने की ओर संकेत करता है; हिन्दी में स्वाभाविक भविष्यकाल रखा गया है।
- source_word: ܬܥܩܘܪ
  choice: जड़ से उखाड़ देगा
  rationale: मूल क्रिया का ठोस अर्थ ‘उखाड़ना’ है और पिछले वृक्ष-दाखलता रूपक को भी बनाए रखता है।
- source_word: ܗܝܘܬܐ ܕܡܢܗ̇
  choice: उस राज्य की सेना की भीड़
  rationale: ܗܝܘܬܐ को यहाँ शत्रु सत्ता से संबंधित बड़ी सैन्य जनशक्ति/दल के अर्थ में लिया गया है; ‘भीड़’ उसकी बहुलता और ‘सेना’ प्रसंगगत आशय व्यक्त करता है।
- source_word: ܐܪܙܐ ܕܪܡܐ
  choice: ऊँचा देवदार
  rationale: वृक्ष-रूपक और ऊँचाई दोनों को सीधे सुरक्षित रखा गया है।
- source_word: ܓܦܢܐ
  choice: दाखलता
  rationale: स्रोत के vine/grapevine रूपक के लिए प्रचलित और स्पष्ट हिन्दी शब्द।
- source_word: ܗܢܘ ܡܠܬܐ
  choice: उनका अर्थ यह है
  rationale: व्याख्या आरम्भ करने वाले स्पष्ट संक्रमण को बनाए रखा गया है; केवल विराम-चिह्न से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: प्रकट होने वाले कर्ता की पहचान
  choice: ‘वह’ सर्वनाम रखा गया
  alternative: ‘मसीहा’ को स्पष्ट रूप से दोहराना
  rationale: निकटवर्ती प्रसंग कर्ता को मसीहा बताता है, पर इस वाक्य में स्रोत सर्वनामात्मक/अंतर्निहित कर्ता रखता है; इसलिए अनावश्यक स्पष्टता नहीं जोड़ी गई।
- issue: उखाड़ी जाने वाली शक्ति का स्वरूप
  choice: ‘उस राज्य की सेना की भीड़’
  alternative: ‘उसकी विशाल सेना’ या ‘उसमें रहने वालों की भीड़’
  rationale: शब्द की व्याख्या में कुछ अनिश्चितता है; राज्य-संबंध को स्पष्ट रखते हुए सैन्य प्रसंग और बहुलता दोनों व्यक्त किए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वृक्ष और दाखलता के प्रतीकात्मक शब्दों को ठोस रूप में सुरक्षित रखा गया है, तथा अंतिम व्याख्यात्मक संक्रमण को स्पष्ट रूप से अनूदित किया गया है।
