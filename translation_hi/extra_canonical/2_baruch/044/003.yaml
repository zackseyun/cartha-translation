translation:
  language: hi
  text: परन्तु सावधान रहो और बचे हुए लोगों को चेतावनी दो, कहीं ऐसा न हो कि वे परमेश्वर की आज्ञाओं से दूर हट जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܘܗܝ
  choice: उसकी आज्ञाओं
  rationale: इसका सीधा अर्थ ‘उसकी आज्ञाएँ’ है; हिन्दी वाक्य में स्वामी को स्पष्ट करने के लिए ‘परमेश्वर की आज्ञाओं’ कहा गया है।
- source_word: ܐܠܗܐ
  choice: परमेश्वर
  rationale: प्रस्तुत सीरियाई पाठ में सामान्य शब्द ‘अलाहा’ अर्थात ‘परमेश्वर’ है; इसलिए अंग्रेज़ी परामर्श-पाठ के ‘Mighty One’ के बजाय मूल-पाठानुसार ‘परमेश्वर’ चुना गया।
- source_word: ܐܫܬܚܪ
  choice: बचे हुए
  rationale: यह शेष रह जाने या बच रहने का भाव देता है और निर्वासन/विनाश के बाद बचे समुदाय के लिए स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वर के लिए उपाधि
  choice: परमेश्वर
  alternative: सामर्थी
  rationale: उपलब्ध सीरियाई साक्ष्य ܐܠܗܐ (‘परमेश्वर’) पढ़ता है। ‘सामर्थी’ अंग्रेज़ी POB की परामर्श-परंपरा को दर्शाता है, पर इस स्थान पर प्रस्तुत मूल-पाठ का शाब्दिक रूप नहीं है।
- issue: चेतावनी का उद्देश्य
  choice: कहीं ऐसा न हो कि वे ... दूर हट जाएँ
  alternative: ताकि वे ... न छोड़ें
  rationale: यह निषेधात्मक आशंका और समुदाय को आज्ञाओं से विमुख होने से रोकने का भाव स्वाभाविक हिन्दी में बनाए रखता है, बिना उनके वास्तविक त्याग को पूर्वमान लेने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सचेत करते रहो’ निरंतर सामुदायिक चेतावनी का भाव देता है; ‘दूर हट जाएँ’ आज्ञाओं से विमुख होने की आशंका को स्वाभाविक हिन्दी में व्यक्त करता है।
