    ܢܬܦܚܡ ܟܘܠ ܡܕܡ.

    ܐܝܟ ܡܫܘܚܬܐ ܕܐܒܕܐ.

    ܘܐܝܟ ܡܢ̈ܐ ܕܥܒܪܐ.

