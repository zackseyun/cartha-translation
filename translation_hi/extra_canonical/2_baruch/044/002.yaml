  text: But you, do not withdraw from the way of the law, but guard and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: hi
  text: पर तुम व्यवस्था के मार्ग से न हटना, बल्कि बचे हुए लोगों की रखवाली करना और उन्हें चेतावनी देना, कहीं ऐसा न हो कि वे परमशक्तिमान की आज्ञाओं से हट जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ ܕܢܡܘܣܐ
  choice: व्यवस्था का मार्ग
  rationale: ‘मार्ग’ और ‘व्यवस्था’—दोनों बिंबों को बनाए रखते हुए सहज हिन्दी अभिव्यक्ति।
- source_word: ܢܛܪܘ
  choice: रखवाली करना
  rationale: केवल आज्ञापालन नहीं, बल्कि बचे हुए समुदाय की देखभाल और संरक्षण का भाव व्यक्त करता है।
- source_word: ܐܬܪܬܘ
  choice: चेतावनी देना
  rationale: समुदाय को सावधान करने और सही मार्ग पर बनाए रखने के उपदेशात्मक भाव को स्पष्ट करता है।
- source_word: ܚܝܠܬܢܐ
  choice: परमशक्तिमान
  rationale: ईश्वर के लिए प्रयुक्त ‘Mighty One’ की उपाधि को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘व्यवस्था के मार्ग’ और ‘आज्ञाओं’ के बीच संबंध
  choice: दोनों अभिव्यक्तियों को अलग-अलग बनाए रखा गया
  alternative: दोनों को सामान्यतः ‘परमेश्वर की शिक्षा’ कहना
  rationale: मूल पाठ की पुनरुक्ति और नैतिक बल को सुरक्षित रखने के लिए उसके दो विशिष्ट पदों को समतल नहीं किया गया।
- issue: शेष समुदाय के प्रति अगुवों का दायित्व
  choice: ‘रखवाली करना और चेतावनी देना’
  alternative: केवल ‘उनकी देखभाल करना’
  rationale: पाठ में संरक्षण और अनुशासन/सावधानी—दोनों दायित्व उपस्थित हैं; इसलिए दोनों को व्यक्त किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है। वाक्य को गंभीर और उपदेशात्मक रखा गया है, पर भाषा सामान्य पाठकों के लिए सहज है। पूर्व अंग्रेज़ी पाठ में उद्धृत पुराने वैकल्पिक आरंभ को नहीं अपनाया गया, क्योंकि वह इस पद के बजाय आस-पास के पाठ का मिश्रण प्रतीत होता है।
