  yaml_path: translation/extra_canonical/2_baruch/044/001.yaml
  text: And I, Baruch, went from there and came to the people. And I called my firstborn, its inhabitants, and the elders of its great ones, and the lowly from the elders of the people, and I said to them,
translation:
  language: hi
  text: 1 तब मैं, बारूक, वहाँ से गया और लोगों के पास आया। मैंने अपने पहलौठे को, उसके निवासियों को, उसके बड़े लोगों के बुज़ुर्गों को और लोगों के बुज़ुर्गों में से दीन जनों को बुलाया[a] और उनसे कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद की सिरियाई शब्दावली और वाक्य-रचना कठिन है। कुछ पाठ-संशोधनों के अनुसार इस सूची का अनुवाद ‘लोगों के सामर्थी जनों और पुरनियों को’ किया जा सकता है।
    reason: मूल सिरियाई सूची असामान्य और संभवतः पाठगत रूप से दूषित है; वैकल्पिक संशोधित पाठ को मुख्य पाठ में मिलाए बिना पाठक को इसकी जानकारी देना आवश्यक है।
lexical_decisions:
- source_word: ܒܘܟܪܝ
  choice: अपने पहलौठे को
  rationale: इस रूप का सामान्य और सीधा अर्थ ‘मेरा पहलौठा’ है। नागरिक सभा के संदर्भ में इसका आशय किसी प्रमुख व्यक्ति से हो सकता है, फिर भी संदिग्ध पाठ को अनुमान से सरल बनाने के बजाय मूल अर्थ रखा गया है।
- source_word: ܥܡܘܪܝܗ
  choice: उसके निवासियों को
  rationale: मूल पाठ में संबंधसूचक प्रत्यय स्पष्ट है, यद्यपि उसका पूर्वपद सहज नहीं है। ‘उसके निवासियों’ से यह वास्तविक अस्पष्टता बनी रहती है।
- source_word: ܩܫ̈ܝܫܝ
  choice: पुरनियों को
  rationale: यह समुदाय के वरिष्ठ अथवा प्राचीन अगुओं के लिए प्रयुक्त शब्द है। ‘पुरनिये’ बाइबलीय गरिमा और सामुदायिक भूमिका दोनों व्यक्त करता है।
- source_word: ܪ̈ܘܪܒܢܘܗܝ
  choice: उसके बड़े लोगों के
  rationale: शाब्दिक संबंध ‘उसके महान/बड़े जनों’ का है। ‘बड़े लोग’ पद, प्रतिष्ठा या प्रमुखता को बिना किसी विशिष्ट सरकारी पद का अनुमान लगाए व्यक्त करता है।
- source_word: ܡܟܝܟܐ
  choice: दीन जनों को
  rationale: शब्द सामाजिक निम्नता अथवा नम्रता का भाव रखता है। ‘दीन जन’ इस विरोध को पहले उल्लिखित बड़े लोगों के साथ बनाए रखता है।
theological_decisions:
- issue: सभा में बुलाए गए समूहों की पहचान
  choice: दुर्बोध सूची को मूल पाठ के अनुसार बनाए रखा गया
  alternative: ‘लोगों के सामर्थी जनों और पुरनियों’ जैसी सरल या संशोधित सूची
  rationale: प्रदत्त सिरियाई पाठ में ‘निवासी’, ‘बड़े लोगों के पुरनिये’ और ‘दीन जन’ उपस्थित हैं। प्रचलित पाठ-संशोधनों के आधार पर इन्हें हटाना या बदलना वास्तविक पाठगत तनाव को मिटा देता।
- issue: ‘पहलौठे’ का सामाजिक अथवा पारिवारिक अर्थ
  choice: अपने पहलौठे को
  alternative: अपने प्रमुख जन को
  rationale: संदर्भ सामाजिक अर्थ की संभावना देता है, पर शब्द का सामान्य अर्थ ‘पहलौठा’ है। इसलिए मुख्य पाठ में प्रत्यक्ष अर्थ और टिप्पणी में अनिश्चितता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पुरनिये’ सामुदायिक वरिष्ठ अगुओं के लिए बाइबलीय रूप से परिचित है। असहज सर्वनाम-संबंध और सूची को अत्यधिक सहज बनाकर मूल की अनिश्चितता नहीं मिटाई गई।
