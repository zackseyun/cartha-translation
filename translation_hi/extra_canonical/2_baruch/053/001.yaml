  text: 'And when I had said these things, I slept there, and I saw a vision by night. And behold, I saw a cloud ascending from the great sea, and it was full of white and black waters, and there were many colors in those waters, and at its head there appeared the likeness of a great lightning. And I looked, and that cloud passed swiftly in a violent rush and covered the whole earth. And after this, waters began to descend from it upon the earth, and I saw that the appearance of those waters was not one and the same. And after these things again I saw black, and after these things again bright, again black, and again bright. And this happened up to twelve times, but in all of them the black were more than the bright.


    And it came to pass, at the end of the cloud, that black waters, darker than all the former waters, descended, and there was a mingling in them, and wherever those waters descended they produced devastation and destruction. And after these things I saw the lightning that I had seen at the head of the cloud, and it seized the cloud and dragged it down to the earth. And after this I saw, and behold, twelve rivers[a] were ascending from the sea, and they surrounded that lightning and became subject to it, and they rejoiced over that proclamation and praised it. And I awoke because of my fear.'
translation:
  language: hi
  text: 'जब मैं ये बातें कह चुका, तब मैं वहीं सो गया और रात में मैंने एक दर्शन देखा। मैंने देखा कि विशाल समुद्र से एक बादल ऊपर उठ रहा था। वह सफेद और काले जल से भरा था, और उन जलों में अनेक रंग थे। उसके अग्रभाग में बड़ी बिजली जैसी एक आकृति दिखाई दे रही थी। मैंने देखा कि वह बादल प्रचंड वेग से आगे बढ़ा और सारी पृथ्वी पर छा गया। इसके बाद उसमें से जल पृथ्वी पर बरसने लगा। मैंने देखा कि उन जलों का रूप एक-जैसा नहीं था। फिर मैंने काला जल देखा, और उसके बाद उज्ज्वल; फिर काला और फिर उज्ज्वल। ऐसा बारह बार हुआ, पर हर बार काला जल उज्ज्वल जल से अधिक था।


    बादल के अंत में ऐसा हुआ कि काला और अंधकारमय जल उतरा, जो पहले के सभी जल से अधिक गहरा था। उसमें मिश्रण था, और जहाँ कहीं वह जल उतरा, वहाँ उसने तबाही और विनाश किया। इसके बाद मैंने उस बिजली को देखा जिसे मैंने बादल के अग्रभाग में देखा था। उसने बादल को पकड़ लिया और घसीटकर पृथ्वी पर नीचे ले आई। इसके बाद मैंने देखा कि समुद्र से बारह नदियाँ[a] ऊपर उठ रही थीं। उन्होंने उस बिजली को चारों ओर से घेर लिया और उसके अधीन हो गईं; वे उस घोषणा पर आनन्दित हुईं और उसकी स्तुति करने लगीं।[b] तब मैं डर के मारे जाग उठा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बारह ज्योतियाँ’।
    reason: सीरियाई पाठ में ‘नदियाँ’ और ‘ज्योतियाँ’ के रूप अत्यन्त निकट हैं; पाठांतर के रूप में दोनों मिलते हैं।
  - marker: b
    text: या ‘वे उस पर आनन्दित हुईं और उसकी स्तुति करने लगीं।’
    reason: वाक्य में ‘घोषणा’ और उससे जुड़े सर्वनाम का सम्बन्ध अस्पष्ट है।
