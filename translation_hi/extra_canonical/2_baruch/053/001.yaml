- source_word: ܥܢܢܐ
  choice: बादल
  rationale: सामान्य सीरियाई शब्द; दर्शन में समुद्र से उठने, पृथ्वी पर छाने और जल बरसाने वाला बादल अभिप्रेत है।
- source_word: ܩ̈ܝܐ
  choice: जल / जलधाराएँ
  rationale: पाठ में बादल के भीतर और उससे नीचे उतरने वाली वर्षा-सदृश धाराएँ हैं; प्रसंगानुसार ‘जल’ और ‘जलधाराएँ’ स्वाभाविक हैं।
- source_word: ܐܘܟܡܐ / ܢܗܝܪܐ
  choice: काला / उज्ज्वल
  rationale: दर्शन में बार-बार आने वाले स्पष्ट रंग-प्रकाश विरोध को बनाए रखता है।
- source_word: ܒܪܩܐ
  choice: बिजली
  rationale: बड़ी बिजली की आकृति और बाद में सक्रिय प्रतीक—दोनों के लिए सहज और सुसंगत हिन्दी।
- source_word: ܒܪܗܛܐ ܩܫܝܐ
  choice: प्रचंड वेग से तेजी से
  rationale: बादल की गति और बल, दोनों को व्यक्त करता है।
- source_word: ܚܒܠܐ ܘܐܒܕܢܐ
  choice: तबाही और विनाश
  rationale: दो समानार्थी पर भिन्न विनाशकारी परिणामों की युग्मित अभिव्यक्ति सुरक्षित रखता है।
- source_word: ܐܚܕ ... ܘܐܬܚܬ
  choice: पकड़ लिया और घसीटकर ... नीचे ले आई
  rationale: दोनों क्रियाओं के बलपूर्वक पकड़ने और अधोगामी गति के भाव को बनाए रखता है।
- source_word: ܢܗ̈ܪܐ/ܢܘܗ̈ܪܐ
  choice: नदियाँ
  rationale: समुद्र से ऊपर उठने के प्रसंग और नियंत्रण-पाठ के आधार पर ‘नदियाँ’ मुख्य पाठ में है; पाठांतर पादटिप्पणी में दिया गया है।
- source_word: ܟܪܘܙ/ܩܪܘܙܐ
  choice: घोषणा
  rationale: अस्पष्ट संज्ञा को हटाए बिना उसका सामान्य अर्थ व्यक्त करता है।
