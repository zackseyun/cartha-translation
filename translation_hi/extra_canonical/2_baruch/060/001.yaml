  yaml_path: translation/extra_canonical/2_baruch/060/001.yaml
  text: And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.
translation:
  language: hi
  text: और पाँचवाँ काला जल, जिसे तुमने बरसते हुए देखा, वे कर्म हैं जो एमोरियों ने किए, और उनके जादू-टोने के मंत्र जिन्हें उन्होंने चलाया, और उनके रहस्यों की दुष्टता, और उनकी अशुद्धता का मिश्रण।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ / “black waters”
  choice: काला जल
  rationale: हिन्दी में ‘जल’ सामान्यतः द्रव्यवाचक एकवचन के रूप में स्वाभाविक है; ‘पाँचवाँ’ दृष्टि में आने वाले क्रमिक जल-खंड को बनाए रखता है।
- source_word: “Amorites”
  choice: एमोरी
  rationale: प्राचीन जाति के नाम का प्रचलित हिन्दी बाइबलीय रूप चुना गया है।
- source_word: “spells of their enchantments”
  choice: उनके चलाए हुए टोने-मंत्र
  rationale: दोहरावपूर्ण और अस्वाभाविक ‘जादू के जादुई मंत्र’ से बचते हुए जादुई क्रियाओं और मंत्र-प्रयोग—दोनों का भाव रखा गया है।
- source_word: “mysteries”
  choice: गुप्त अनुष्ठान
  rationale: यहाँ केवल बौद्धिक ‘रहस्य’ नहीं, गुप्त और दुष्ट धार्मिक-जादुई आचरण अभिप्रेत प्रतीत होता है।
- source_word: “mingling”
  choice: घालमेल
  rationale: मिश्रण या परस्पर मिलावट का ठोस भाव साधारण आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: दृष्टि के प्रतीक और ऐतिहासिक कर्मों की पहचान
  choice: ‘वह … है’ के द्वारा सीधी पहचान बनाए रखी गई
  alternative: ‘वह … को दर्शाता है’
  rationale: स्रोत की पहचानात्मक वाक्य-रचना को व्याख्यात्मक भाषा में बदलने से बचाया गया है।
- issue: ‘mysteries’ का धार्मिक आशय
  choice: गुप्त अनुष्ठान
  alternative: रहस्य
  rationale: संदर्भ में दुष्टता, टोने-मंत्र और अशुद्धता के साथ इसका संबंध गुप्त आचरण की ओर संकेत करता है; फिर भी किसी विशिष्ट संप्रदाय या पंथ का नाम नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। उपलब्ध सिरिएक अध्याय-बकेट में इस पद की पंक्ति प्रत्यक्षतः दिखाई नहीं देती, इसलिए पद की विषय-वस्तु के लिए लेखापरीक्षित अंग्रेज़ी POB परामर्श-पाठ का सावधानी से उपयोग किया गया; अस्पष्ट स्थानों पर अनावश्यक doctrinal विस्तार नहीं जोड़ा गया।
