  text: But Israel also was defiled with sins in the days of the judges, while they were seeing many signs that were done by him who made them.
translation:
  language: hi
  text: पर न्यायियों के दिनों में इस्राएल भी पापों से अशुद्ध हो गया, जबकि वे उसके किए हुए बहुत-से चिन्ह देख रहे थे, जिसने उन्हें बनाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Israel
  choice: इस्राएल
  rationale: व्यक्ति और वाचा-समुदाय दोनों के लिए प्रचलित बाइबलीय नाम; यहाँ सामूहिक समुदाय अभिप्रेत है।
- source_word: was defiled with sins
  choice: पापों से अशुद्ध हो गया
  rationale: नैतिक और धार्मिक अशुद्धता की छवि को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: in the days of the judges
  choice: न्यायियों के दिनों में
  rationale: ऐतिहासिक काल-सूचक पद और ‘judges’ की पारंपरिक भूमिका-संज्ञा दोनों सुरक्षित रहते हैं।
- source_word: signs
  choice: चिन्ह
  rationale: असाधारण ईश्वरीय कार्यों के संकेतात्मक अर्थ को ‘चमत्कार’ कहकर सीमित नहीं करता।
- source_word: him who made them
  choice: उस जन ... जिसने उन्हें बनाया था
  rationale: रचयिता का संकेत सुरक्षित है और ‘उन्हें’ के संदर्भ की मूल संभावित अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: ‘जिसने उन्हें बनाया था’ में कर्ता की पहचान
  choice: ईश्वर का नाम जोड़ने के बजाय स्रोत की परोक्ष अभिव्यक्ति रखी गई
  alternative: ‘उनके सृष्टिकर्ता परमेश्वर’
  rationale: पर्याय स्पष्ट है, पर स्रोत की शैली और संदर्भगत अस्पष्टता को किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या से नहीं बदला गया।
- issue: इस्राएल की सामूहिक दोषिता
  choice: एकवचन सामूहिक ‘इस्राएल ... अशुद्ध हो गया’
  alternative: ‘इस्राएली ... अशुद्ध हो गए’
  rationale: समुदाय को एक सामूहिक इकाई के रूप में प्रस्तुत करने वाली मूल वाक्य-रचना और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। उपलब्ध सिरिएक अध्याय-बकेट में इस पद की पंक्ति स्पष्ट रूप से पृथक नहीं मिली, इसलिए नियंत्रित अंग्रेज़ी परामर्श-पाठ का सहारा लेते हुए उसकी अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
