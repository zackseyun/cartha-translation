translation:
  language: hi
  text: या आपके मन के विचारों को कौन गिन सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܚܫ̈ܒܬܐ
  choice: विचारों
  rationale: यह बहुवचन संज्ञा ‘विचारों’ के अर्थ में है और प्रसंग में मन के भीतर के विचारों को सूचित करती है।
- source_word: ܪ̈ܥܝܢܝ
  choice: मन के
  rationale: स्रोत पद मन, बुद्धि या मानसिक अभिप्राय का बोध करा सकता है; सहज आधुनिक हिन्दी में ‘मन के विचार’ स्वाभाविक और अर्थसंगत है।
- source_word: ܡܢܝܢ
  choice: गिन सकता है
  rationale: स्रोत में गणना करने का सीधा भाव है; इसलिए ‘बयान कर सकता है’ या ‘वर्णन कर सकता है’ की अपेक्षा ‘गिन सकता है’ चुना गया।
theological_decisions:
- issue: परमेश्वर को संबोधित करने वाला द्वितीय पुरुष सर्वनाम
  choice: आपके
  alternative: तेरे
  rationale: स्रोत का एकवचन संबोधन बनाए रखते हुए आधुनिक मानक हिन्दी में आदर और स्वाभाविकता के लिए ‘आपके’ चुना गया; इससे कथन में कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जुड़ता।
translation_notes:
  register: संक्षिप्त, प्रश्नात्मक और श्रद्धापूर्ण आधुनिक मानक हिन्दी; स्रोत की अलंकारिक अनुत्तरितता को बनाए रखा गया है।
