  yaml_path: translation/extra_canonical/2_baruch/075/007.yaml
  text: But we who live—if we know why we came, and submit ourselves to him who brought us out from Egypt—we shall come again, and we shall remember what has passed, and rejoice over what was.
translation:
  language: hi
  text: पर हम जो जीवित हैं[a]—यदि हम जानते हैं कि हम क्यों आए हैं, और अपने आपको उसके अधीन करते हैं[b] जो हमें मिस्र से बाहर ले आया[c]—तो हम फिर आएँगे, बीती हुई बातों को स्मरण करेंगे और जो कुछ हुआ था, उस पर आनन्दित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हम जो बचे हुए हैं’।
    reason: ‘जीवित’ के स्थान पर शेष बचे रहने का अर्थ भी परंपरागत रूप से समझा गया है।
  - marker: b
    text: या ‘अपने आपको उसके अधीन कर चुके हैं’।
    reason: कृदन्त को पूर्ण हुई अधीनता के रूप में भी व्यक्त किया जा सकता है, यद्यपि वर्तमान अर्थ प्रसंग में अधिक उपयुक्त है।
  - marker: c
    text: या ‘हमें ऊपर ले आया’।
    reason: पूर्ववर्ती अनुवाद-परंपरा में यह विकल्प मिलता है, यद्यपि स्रोत-क्रिया ‘बाहर ले आया’ का अधिक प्रत्यक्ष समर्थन करती है।
lexical_decisions:
- source_word: ܚܢܢ ... ܚܝܝܢ
  choice: हम जो जीवित हैं
  rationale: ܚܝܐ का मूल अर्थ ‘जीना’ है; इसलिए ‘जीवित हैं’ को मुख्य पाठ में रखा गया, जबकि ‘बचे हुए हैं’ को पाठगत अर्थ-संभावना के रूप में पादटिप्पणी में दिया गया।
- source_word: ܡܫܥܒܕܝܢܢ
  choice: अपने आपको उसके अधीन करते हैं
  rationale: कृदन्तीय रूप निरंतर या वर्तमान दशा को व्यक्त करता है और समानांतर ‘हम जानते हैं’ के साथ स्वाभाविक बैठता है; पूर्ण भूतकाल से बचा गया।
- source_word: ܐܦܩܢ
  choice: हमें मिस्र से बाहर ले आया
  rationale: यह क्रिया ‘बाहर निकालना/ले आना’ व्यक्त करती है और निर्गमन के संदर्भ में ‘बाहर ले आया’ सटीक तथा स्वाभाविक है।
- source_word: ܢܬܕܟܪ ... ܕܥܒܪ
  choice: बीती हुई बातों को स्मरण करेंगे
  rationale: भूतकाल में घट चुकी बातों के पुनः स्मरण का अर्थ स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त किया गया।
theological_decisions:
- issue: मिस्र से बाहर लाने वाले की पहचान
  choice: सर्वनाम ‘उसके’ को यथावत रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर’ जोड़ना
  rationale: स्रोत की सर्वनामात्मक अभिव्यक्ति और उसकी अंतर्निहित पहचान को बनाए रखने के लिए ऐसा कोई नाम नहीं जोड़ा गया जो पाठ में प्रत्यक्ष नहीं है।
- issue: ‘फिर आएँगे’ का आशय
  choice: अर्थ को बिना विस्तार दिए ‘फिर आएँगे’ रखा गया
  alternative: इसे पुनरुत्थान, वापसी या किसी विशिष्ट भावी घटना के रूप में स्पष्ट करना
  rationale: वाक्य की वास्तविक व्याख्यात्मक अस्पष्टता सुरक्षित रखी गई और किसी संप्रदायगत अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। वाक्य की शर्तात्मक संरचना और भविष्यकालीन कथन सुरक्षित रखे गए हैं; अनावश्यक धर्मवैज्ञानिक स्पष्टीकरण नहीं जोड़ा गया।
