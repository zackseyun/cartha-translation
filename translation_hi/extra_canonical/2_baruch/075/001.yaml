translation:
  language: hi
  text: तब मैंने उत्तर दिया, “हे प्रभु, आपकी भलाई को कौन समझ सकता है? क्योंकि वह समझ से परे है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “क्योंकि उसे समझा नहीं जा सकता।”
    reason: मूल की अगम्यता व्यक्त करने वाले पद का अधिक प्रत्यक्ष वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ܛܒܬܐ
  choice: आपकी भलाई
  rationale: ‘भलाई’ परमेश्वर के गुण का व्यापक और गरिमापूर्ण अर्थ बनाए रखता है; इसे केवल दयालुता या उदारता तक सीमित नहीं करता।
- source_word: ܡܬܬܚܡܐ / ܠܐ ܡܬܕܪܟܐ
  choice: समझ से परे
  rationale: यह सहज आधुनिक हिन्दी में उस बात को व्यक्त करता है जिसे मनुष्य पूरी तरह ग्रहण या समझ नहीं सकता, और मूल कथन की प्रबलता बनाए रखता है।
- source_word: ܡܪܝܐ
  choice: हे प्रभु
  rationale: सम्बोधन को स्पष्ट रखते हुए प्रार्थनापूर्ण और गरिमामय शैली बनाए रखी गई है।
theological_decisions:
- issue: क्या परमेश्वर की भलाई को केवल कठिनता से समझ में आने वाली या सर्वथा अगम्य बताया जाए
  choice: समझ से परे
  alternative: उसे समझा नहीं जा सकता
  rationale: मुख्य पाठ स्वाभाविक हिन्दी में मानवीय समझ की सीमा पर बल देता है; वैकल्पिक पाठ अधिक निरपेक्ष रूप को सुरक्षित रखता है, बिना किसी विशेष दार्शनिक या सम्प्रदायगत व्याख्या को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, प्रार्थनापूर्ण और गरिमामय शैली। ‘आपकी’ सामान्य पाठक के लिए आदरपूर्ण और स्वाभाविक है।
