  language: hi
  text: या तेरी समझ की थाह कौन पा सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܘܟܠܐ
  choice: समझ
  rationale: यह शब्द समझ, बोध या बुद्धि के अर्थ में आता है; यहाँ परमेश्वर की अगम समझ के लिए सामान्य और स्वाभाविक हिन्दी शब्द चुना गया है।
- source_word: ܡܬܕܪܟܐ / comprehension idiom
  choice: थाह पा सकता है
  rationale: स्रोत में निहित ‘समझ सकना/पकड़ सकना’ का भाव हिन्दी में ‘थाह पाना’ स्वाभाविक ढंग से उस समझ की अगमता व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की समझ की अगमता
  choice: प्रश्नात्मक कथन को यथावत रखा गया है
  alternative: कोई भी तेरी समझ नहीं पा सकता
  rationale: अलंकारिक प्रश्न स्रोत की काव्यात्मकता और मानवीय ज्ञान की सीमा पर उसके बल—दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सरल और श्रद्धापूर्ण हिन्दी; ‘तेरी’ मूल के एकवचन निकट संबोधन को बनाए रखता है, जबकि ‘थाह पाना’ सामान्य पाठक के लिए सहज और गरिमापूर्ण है।
