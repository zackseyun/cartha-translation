lexical_decisions:
- source_word: ܪ̈ܚܡܝܟ (अंग्रेज़ी परामर्श-पाठ और पद-संदर्भ से पुनर्निर्मित)
  choice: तेरी उन करुणाओं
  rationale: ‘करुणाएँ’ ईश्वरीय दया के बहुवचन और उसके विविध प्रकट रूपों को बनाए रखता है; उपलब्ध सीरियाई पृष्ठ-पाठ में पद-विभाजन अस्पष्ट है, इसलिए अंग्रेज़ी POB को केवल नियंत्रित परामर्श के रूप में लिया गया है।
- source_word: ܒܨܐ / समतुल्य ‘खोज निकालना’ क्रिया
  choice: थाह पा सकता है
  rationale: हिन्दी में यह अभिव्यक्ति किसी अथाह बात को पूरी तरह जान लेने या माप लेने का स्वाभाविक भाव देती है।
- source_word: ܕܠܐ ܣܘܦ / समतुल्य ‘बिना अंत’ पदबंध
  choice: जिनका कोई अंत नहीं
  rationale: अनंतता को स्पष्ट, सहज और बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ईश्वर की करुणाओं की अगम्यता
  choice: प्रश्नवाचक रूप और ‘थाह पा सकता है’ को बनाए रखा
  alternative: ‘कोई तेरी अनंत करुणाओं को नहीं समझ सकता’
  rationale: मूल का आलंकारिक प्रश्न और मानवीय खोज की सीमा बनी रहती है; कथन में बदलकर तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक संदर्भ के अनुरूप ईश्वर के लिए आत्मीय किंतु गरिमापूर्ण एकवचन ‘तेरी’। वाक्य संक्षिप्त, स्वाभाविक और सामान्य पाठक के लिए सुबोध है।
