translation:
  language: hi
  text: या जन्म लेने वालों में से कौन इन बातों तक पहुँचने की आशा कर सकता है, सिवाय उसके जिस पर तू दया करे और अनुग्रह करे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝ̈ܠܕܢ / जन्म-संबंधी अभिव्यक्ति
  choice: जन्म लेनेवालों में से
  rationale: मनुष्यों के लिए स्रोत के व्यापक, सामूहिक अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; इसे किसी विशेष वंश या समूह तक सीमित नहीं करता।
- source_word: इन बातों तक आना/पहुँचना
  choice: इन बातों को प्राप्त करने
  rationale: यहाँ गंतव्य भौतिक स्थान नहीं, पहले कही गई प्रतिज्ञात वास्तविकताओं की प्राप्ति है; ‘प्राप्त करना’ हिन्दी में इस आशय को सहजता से व्यक्त करता है।
- source_word: दया करना और अनुग्रह करना
  choice: दया करता और अनुग्रह करता है
  rationale: दो समानांतर ईश्वरीय कृपा-सूचक क्रियाओं का भेद बनाए रखा गया है, उन्हें एक ही पद में नहीं मिलाया गया।
theological_decisions:
- issue: इन बातों की प्राप्ति में मानवीय आशा और ईश्वरीय कृपा का संबंध
  choice: 'प्रश्नात्मक और अपवादसूचक रचना को ज्यों का त्यों रखा गया: ‘सिवाय उसके जिस पर तू…’'
  alternative: इसे स्पष्ट सिद्धांतात्मक कथन बनाना कि केवल चुने हुए लोग ही इन्हें पाएँगे
  rationale: पाठ स्वयं विनम्र प्रश्न के रूप में मानवीय असमर्थता और ईश्वरीय दया पर निर्भरता व्यक्त करता है; उससे आगे कोई चुनाव-संबंधी विशिष्ट मत जोड़ना उचित नहीं।
- issue: ईश्वर को संबोधन
  choice: ‘तू’
  alternative: ‘आप’
  rationale: बाइबिलीय प्रार्थना के सीधे, निकट और गरिमापूर्ण एकवचन संबोधन को बनाए रखने के लिए ‘तू’ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक, विनम्र और गरिमापूर्ण शैली। वाक्य की अलंकारिक प्रश्न-रचना तथा ‘दया’ और ‘अनुग्रह’ का युग्म सुरक्षित रखा गया है।
