  text: For unless, in compassion, you have mercy on human beings, those who are under your right hand cannot come to these things, except those who are called in the excellent number.
translation:
  language: hi
  text: क्योंकि यदि तू करुणा करके मनुष्यों पर दया न करे, तो जो तेरे दाहिने हाथ के अधीन हैं वे इन बातों तक नहीं पहुँच सकते—सिवाय उनके, जो उस उत्तम संख्या में बुलाए गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪ̈ܚܡܐ / compassion-context
  choice: करुणा करके
  rationale: स्रोत-पाठ की करुणामय दया की धारणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; इसे केवल भावुकता या केवल क्षमा तक सीमित नहीं करता।
- source_word: ܒܢܝܢܫ̈ܐ
  choice: मनुष्यों
  rationale: सामूहिक और समावेशी अर्थ को बनाए रखता है।
- source_word: ܬܚܝܬ ܝܡܝܢܟ / under your right hand
  choice: तेरे दाहिने हाथ के अधीन
  rationale: ‘दाहिना हाथ’ की स्रोत-छवि और उसके अधिकार/संरक्षण के भाव दोनों को सुरक्षित रखता है।
- source_word: ܡܢܝܢܐ ... / excellent number
  choice: उस उत्तम संख्या में
  rationale: ‘संख्या’ संबंधी असामान्य परंतु अर्थपूर्ण अभिव्यक्ति को किसी निश्चित धार्मिक समूह के रूप में व्याख्यायित किए बिना बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय दया और चुने/बुलाए गए लोगों के बीच संबंध
  choice: मुख्य कथन और अपवाद—‘सिवाय उनके’—दोनों को यथावत रखा गया
  alternative: अपवाद को दया पाने वालों की व्याख्या मानकर वाक्य को सुगम बनाना
  rationale: मूल की धर्मवैचारिक खींचतान और वाक्यगत अस्पष्टता को किसी संप्रदायगत पूर्वधारणा से हल नहीं किया गया।
- issue: ‘दाहिने हाथ के अधीन’ का आशय
  choice: रूपक को बनाए रखते हुए ‘अधीन’ जोड़ा गया
  alternative: ‘तेरी शक्ति में’ या ‘तेरे चुने हुए लोग’
  rationale: वैकल्पिक रूप मूल बिंब मिटा देते या पहचान को आवश्यकता से अधिक निश्चित कर देते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर को संबोधित एकवचन ‘तू/तेरे’ रखा गया है। स्रोत-पृष्ठ में पाठ-क्रम और OCR अस्पष्ट हैं; इसलिए उपलब्ध सिरिएक साक्ष्य को अंग्रेज़ी POB की नियंत्रित परामर्श-पंक्ति से मिलाकर अनुवाद किया गया है।
