  yaml_path: translation/extra_canonical/2_baruch/075/008.yaml
  text: But if we do not now know why we came, and do not recognize what has been, neither shall the immeasurable be seen, nor shall the preeminence of him who established it from the beginning be made known; and not a few living creatures would be astonished.”
translation:
  language: hi
  text: पर यदि हम अब यह नहीं जानते कि हम किसलिए आए हैं, और जो हो चुका है उसे नहीं पहचानते, तो न असीम दिखाई देगा, न उस की श्रेष्ठता प्रकट होगी जिसने उसे आरम्भ से स्थापित किया है; और कई जीवधारी चकित रह जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܡܬܬܚܡ / immeasurable
  choice: जो अथाह है
  rationale: स्रोत में सीमा या माप से परे होने का भाव है। ‘अथाह’ आधुनिक हिन्दी में सहज है और यह तय नहीं करता कि संकेत किसी वस्तु, योजना या दिव्य रहस्य की ओर है।
- source_word: ܡܚܘܝ ... ܒܥܒ̈ܕܝܘܗܝ / be made known
  choice: प्रकट होगी
  rationale: यह केवल बौद्धिक जानकारी नहीं, बल्कि कार्यों के द्वारा सामने आने का भाव व्यक्त करता है।
- source_word: preeminence
  choice: श्रेष्ठता
  rationale: ‘श्रेष्ठता’ गरिमापूर्ण और सामान्य बोधगम्य है; यह पद, प्रभुत्व या किसी विशिष्ट धर्मवैज्ञानिक उपाधि को अनावश्यक रूप से नहीं जोड़ता।
- source_word: living creatures
  choice: जीवधारी
  rationale: यह व्यापक वर्ग को बनाए रखता है और इसे केवल मनुष्यों तक सीमित नहीं करता।
theological_decisions:
- issue: ‘अथाह’ का संदर्भ
  choice: सर्वनाम के संकेत को अस्पष्ट रखते हुए ‘जो अथाह है’
  alternative: ‘अथाह परमेश्वर’ या ‘उसकी अथाह योजना’
  rationale: उपलब्ध पाठ में संदर्भ निश्चित नहीं है; किसी खास धर्मवैज्ञानिक पहचान को जोड़ना मूल की वास्तविक अस्पष्टता मिटा देता।
- issue: ‘जिसने आरम्भ से उसे स्थापित किया’ में कर्ता और कर्म
  choice: पुल्लिंग कर्ता और अस्पष्ट ‘उसे’ को बनाए रखा
  alternative: स्पष्ट रूप से ‘परमेश्वर ने सृष्टि को स्थापित किया’
  rationale: अंग्रेज़ी परामर्श-पाठ और खंडित सिरिएक साक्ष्य किसी स्पष्ट संज्ञा की माँग नहीं करते; इसलिए अनुमानित संज्ञाएँ नहीं जोड़ी गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को गंभीर और प्रज्ञासाहित्य-सदृश रखा गया है, पर अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। उपलब्ध सिरिएक अध्याय-पृष्ठ खंडित और क्रम-विक्षुब्ध है, इसलिए अंग्रेज़ी POB को परामर्श-स्तर मानते हुए उसके अर्थ की स्रोत-संगत अस्पष्टताओं को सुरक्षित रखा गया है।
