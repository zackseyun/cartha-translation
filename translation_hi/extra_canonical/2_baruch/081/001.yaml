lexical_decisions:
- source_word: ܡܪܝܡܐ
  choice: परमप्रधान
  rationale: यह प्रचलित बाइबलीय-प्रलयात्मक ईश्वरीय उपाधि है और परमेश्वर की सर्वोच्चता को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: ܚܝܠܬܐ
  choice: सामर्थी
  rationale: इसे ‘परमप्रधान’ से अलग ईश्वरीय उपाधि के रूप में रखा गया है, ताकि स्रोत की शब्दगत भिन्नता न मिटे।
- source_word: ܪ̈ܚܡܘܗܝ / ܚܢܢܗ
  choice: उसकी करुणा / उसकी कृपा
  rationale: स्रोत के निकटार्थी किन्तु अलग दोनों शब्दों को एक ही हिन्दी शब्द में मिलाने के बजाय अर्थभेद सहित रखा गया है।
- source_word: ܚܘ̈ܘܝ
  choice: दर्शन
  rationale: प्रलयात्मक संदर्भ और प्रकट किए गए ‘वचन’ के समानांतर यह अर्थ सबसे उपयुक्त है।
- source_word: ܫܘܠܡܐ / completion language
  choice: पूर्णता / पूरा होना
  rationale: यह अन्तकालीन परिणति का भाव बनाए रखता है और इसे केवल कालगत ‘अन्त’ तक सीमित नहीं करता।
- source_word: ܢܘܛܦܬܐ / spittle-comparison
  choice: थूक के समान
  rationale: जानबूझकर प्रयुक्त अपमानजनक और अवमूल्यनकारी बिम्ब को नरम किए बिना स्पष्ट हिन्दी में रखा गया है।
- source_word: ܩܝ̈ܡܘܗܝ / ܦܘܩܕܢܐ
  choice: आज्ञाएँ
  rationale: साधारण पाठक के लिए स्पष्ट रहते हुए यह वाचा-संबंधी बाध्यता का भाव व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय प्रतिशोध
  choice: हमारे सब शत्रुओं से ... प्रतिशोध लेंगे
  alternative: हमारे सब शत्रुओं को न्यायोचित दण्ड देंगे
  rationale: ‘प्रतिशोध’ मूल के कठोर प्रलयात्मक और न्यायिक स्वर को बनाए रखता है; कर्ता परमेश्वर है, इसलिए इसे निजी बदले के रूप में नहीं प्रस्तुत किया गया।
- issue: अन्तकालीन निकटता
  choice: पूर्णता ... निकट है; उसकी दया आ रही है
  alternative: अन्त निकट है / युगों की पूर्णता निकट है
  rationale: पाठ न्याय और दया दोनों को आसन्न बताता है; अनुवाद दोनों के बीच मौजूद धार्मिक तनाव को बनाए रखता है।
- issue: दया के अनुसार छोड़ देना
  choice: अपनी महान कृपा के अनुसार हमें छोड़ दिया
  alternative: अपनी महान कृपा के अनुसार हमें बचा लिया
  rationale: ‘छोड़ दिया’ क्षमा अथवा दण्ड से बख्शे जाने की सम्भावना को खुला रखता है और अधिक व्याख्यात्मक ‘बचा लिया’ को मुख्य पाठ में नहीं लाता।
