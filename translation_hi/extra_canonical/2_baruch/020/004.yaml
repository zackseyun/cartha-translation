  text: Then I will show you the judgment of my might and my ways, which are past searching out.
translation:
  language: hi
  text: तब मैं तुम्हें अपने सामर्थ्य का न्याय और अपने वे मार्ग दिखाऊँगा, जिनकी थाह नहीं पाई जा सकती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ (अंग्रेज़ी परामर्श-पाठ में “judgment”; पद के पुनर्निर्मित आशय के अनुसार)
  choice: न्याय
  rationale: यह चुनाव न्यायिक निर्णय और न्याय करने की क्रिया—दोनों संभावित अर्थों को खुला रखता है; इसे केवल दंड के रूप में सीमित नहीं करता।
- source_word: ܚܝܠܝ / ܓܢܒܪܘܬܝ (अंग्रेज़ी परामर्श-पाठ में “my might”)
  choice: अपने सामर्थ्य
  rationale: ‘सामर्थ्य’ आधुनिक, गरिमापूर्ण और ईश्वरीय शक्ति के लिए स्वाभाविक हिन्दी है; ‘पराक्रम’ की युद्ध-संबंधी छाया से बचता है।
- source_word: ܐܘܪ̈ܚܬܝ (अंग्रेज़ी परामर्श-पाठ में “my ways”)
  choice: अपने वे मार्ग
  rationale: ‘मार्ग’ आचरण, कार्य-विधि और ईश्वरीय शासन की रूपकात्मक व्यापकता बनाए रखता है।
- source_word: ܕܠܐ ܡܬܒܨܝܢ / समतुल्य अभिव्यक्ति (अंग्रेज़ी “past searching out”)
  choice: जिनकी थाह नहीं पाई जा सकती
  rationale: यह खोज या जाँच से परे होने का अर्थ सहज हिन्दी में देता है और पूर्णतः ‘अज्ञेय’ जैसी अधिक दार्शनिक व्याख्या नहीं थोपता।
theological_decisions:
- issue: ‘मेरे सामर्थ्य का न्याय’ का संबंध
  choice: सामर्थ्य को ‘न्याय’ से संबंध रखने दिया गया है
  alternative: ‘अपने सामर्थ्य और न्याय’
  rationale: अंग्रेज़ी परामर्श-पाठ का संबंधवाचक विन्यास ‘judgment of my might’ है; उसे दो स्वतंत्र गुणों में बदलना अर्थ का मौन विस्तार होता।
- issue: ईश्वर के मार्गों की अगमता
  choice: ‘जिनकी थाह नहीं पाई जा सकती’
  alternative: ‘जो पूरी तरह अज्ञेय हैं’
  rationale: पाठ मानव खोज की सीमा बताता है; यह अनिवार्यतः यह नहीं कहता कि मार्गों के विषय में कुछ भी जाना नहीं जा सकता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण वाक्य-विन्यास। उपलब्ध सिरियाई अध्याय-पृष्ठ अत्यंत विकृत/खंडित है और पद 20:4 स्पष्ट रूप से अलग नहीं दिखता, इसलिए अंग्रेज़ी POB को नियंत्रित परामर्श-साक्ष्य मानते हुए उसके अर्थ का सावधान, स्रोत-संगत रूप प्रस्तुत किया गया है।
