  text: And now, hold fast in your heart all that I command you, and seal it in the inner chambers of your mind.
translation:
  language: hi
  text: और अब, जो कुछ मैं तुम्हें आज्ञा देता हूँ, वह सब अपने हृदय में दृढ़ता से थामे रहो और उसे अपने मन के भीतरी कक्षों में मुहरबंद कर लो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܒܐ
  choice: हृदय
  rationale: ‘हृदय’ आंतरिक संकल्प और स्मृति—दोनों का भाव बनाए रखता है और इस प्रसंग के गरिमापूर्ण आदेश के लिए स्वाभाविक है।
- source_word: ܦܩܕ
  choice: आज्ञा देता हूँ
  rationale: यह क्रिया साधारण कथन नहीं, अधिकारपूर्ण निर्देश व्यक्त करती है; इसलिए ‘आज्ञा’ उपयुक्त है।
- source_word: ܐܘܢ̈ܐ
  choice: भीतरी कक्ष
  rationale: स्थान-संबंधी रूपक को सपाट ‘गहराई’ में बदलने के बजाय कक्षों की मूल छवि सुरक्षित रखी गई है।
- source_word: ܚܬܡ
  choice: मुहरबंद कर लो
  rationale: मूल मुहर लगाने की ठोस छवि संरक्षण, स्थायित्व और गोपनीय अंतःस्थापन का भाव देती है।
theological_decisions:
- issue: आदेश को हृदय और मन में सुरक्षित रखने का संबंध
  choice: हृदय में थामना और मन के भीतरी कक्षों में मुहरबंद करना—दो समानांतर किंतु अलग चित्र रखे गए हैं।
  alternative: दोनों को मिलाकर केवल ‘अपने मन में सदा याद रखना’ कहना।
  rationale: रूपकों को मिलाने से मूल की काव्यात्मक तीव्रता और आंतरिक संरक्षण का दोहरा बल घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन संबोधन रखा गया है। भाषा सरल और गरिमापूर्ण है; ‘भीतरी कक्ष’ तथा ‘मुहरबंद’ मूल रूपकों को स्पष्ट रूप से सुरक्षित रखते हैं। उपलब्ध सिरिएक अध्याय-बकेट में पाठ-क्रम और OCR अस्पष्ट है, इसलिए अंग्रेज़ी POB को परामर्श-स्तर के रूप में लेते हुए शब्दार्थ-संगति और संदर्भ के आधार पर सावधान अनुवाद किया गया है।
