translation:
  language: hi
  text: इसलिए अब मैंने सिय्योन को हटा दिया है, ताकि मैं संसार के नियत समय पर उसकी सुधि और अधिक शीघ्रता से लूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܠ ܗܢܐ
  choice: इसलिए
  rationale: यह कारण से निष्कर्ष की ओर ले जाने वाला स्वाभाविक हिन्दी संयोजक है।
- source_word: ܢܣܒܬ
  choice: मैंने ... हटा दिया है
  rationale: मूल क्रिया के ‘ले लेने/हटा लेने’ के अर्थ को बनाए रखता है, पर यह अनावश्यक रूप से स्पष्ट नहीं करता कि सिय्योन का विनाश हुआ, परित्याग हुआ या उसे किसी अन्य अर्थ में ले लिया गया।
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबिलीय लिप्यंतरण।
- source_word: ܐܣܥܘܪ
  choice: मैं ... सुधि लूँ
  rationale: सामी ‘भेंट/निरीक्षण करने’ वाली क्रिया में देखभाल और न्यायिक निरीक्षण दोनों की सम्भावना है; ‘सुधि लेना’ इस तनाव को पूरी तरह एक दिशा में सीमित नहीं करता।
- source_word: ܒܙܒܢܗ
  choice: उसके नियत समय पर
  rationale: समय के ठहराए या उपयुक्त अवसर का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: संसार की परमेश्वरीय ‘भेंट’ का स्वरूप
  choice: संसार की ... सुधि लूँ
  alternative: संसार का न्याय करूँ
  rationale: मूल अभिव्यक्ति निरीक्षण, हस्तक्षेप या न्याय का संकेत दे सकती है; सीधे ‘न्याय’ कहने से वास्तविक अर्थ-व्याप्ति संकुचित हो जाती।
- issue: सिय्योन को ले लिए जाने का आशय
  choice: सिय्योन को हटा दिया है
  alternative: सिय्योन को नष्ट कर दिया है
  rationale: पद स्वयं इस क्रिया को स्पष्ट रूप से ‘नष्ट करना’ नहीं कहता; इसलिए विनाश की व्याख्या पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमामय किंतु सामान्य पाठक के लिए सहज रखा गया है। स्रोत-पृष्ठ की पाठ-स्थिति अस्पष्ट और OCR-विकृत है, इसलिए उपलब्ध सिरिएक साक्ष्य को अंग्रेज़ी POB परामर्श-पाठ से नियंत्रित करते हुए अनावश्यक विशिष्टीकरण से बचा गया है।
