lexical_decisions:
- source_word: ܐܙܠ
  choice: जा
  rationale: एकवचन आज्ञार्थक क्रिया को सीधा और स्वाभाविक रूप दिया गया है।
- source_word: ܩܕܫ ܢܦܫܟ
  choice: अपने आपको पवित्र कर
  rationale: सेमिटिक आत्मवाचक अभिव्यक्ति और धार्मिक शुद्धीकरण/समर्पण—दोनों अर्थ-संकेत सुरक्षित रहते हैं।
- source_word: ܫܒܥܐ ܝܘܡܝܢ
  choice: सात दिन तक
  rationale: निर्धारित अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܠܚܡܐ
  choice: रोटी
  rationale: सामान्य भोजन के मूल शब्द का परिचित और ठोस हिन्दी समतुल्य।
- source_word: ܡܝܐ
  choice: पानी
  rationale: मूल के सामान्य शब्द का सरल आधुनिक हिन्दी रूप।
- source_word: ܥܡ ܐܢܫ
  choice: किसी से
  rationale: अनिश्चित मानव-संदर्भ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘अपने आपको पवित्र कर’ का आशय
  choice: आत्मवाचक धार्मिक तैयारी की भाषा बनाए रखी गई
  alternative: अपने आपको शुद्ध कर
  rationale: ‘पवित्र कर’ मूल की धार्मिक व्यापकता को बनाए रखता है और इसे केवल बाहरी शुद्धि तक सीमित नहीं करता।
- issue: उपवास-संबंधी निषेध
  choice: रोटी और पानी के दोनों स्पष्ट निषेध अलग-अलग रखे गए
  alternative: पूरी तरह उपवास कर
  rationale: संक्षिप्त व्याख्यात्मक शब्द ‘उपवास’ मूल पाठ के ठोस विवरण को समेटकर उसकी विशिष्टता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। आज्ञार्थक एकवचन बनाए रखा गया है। उपलब्ध अध्याय-बकेट का सिरिएक पाठ अत्यधिक अव्यवस्थित/खंडित है और लक्षित पद स्पष्ट रूप से पृथक नहीं दिखता; इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य मानते हुए पद की पारंपरिक सिरिएक शब्दावली के अनुरूप सावधानी से मसौदा बनाया गया है।
