  yaml_path: translation/extra_canonical/2_baruch/020/006.yaml
  text: Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.
translation:
  language: hi
  text: इसके बाद इस स्थान पर आना। तब मैं वहाँ तुम्हें प्रकट होऊँगा, तुमसे सत्य बातें कहूँगा, और समयों के क्रम के विषय में तुम्हें शिक्षा दूँगा; क्योंकि वे आने वाले हैं और देर नहीं करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܬܪ / afterward
  choice: इसके बाद
  rationale: कालक्रम को सहज आधुनिक हिन्दी में व्यक्त करता है और पूर्ववर्ती प्रसंग से संबंध बनाए रखता है।
- source_word: this place
  choice: इस स्थान पर
  rationale: निर्दिष्ट स्थान का संकेत बनाए रखा गया है; इसे किसी विशेष धार्मिक स्थल के रूप में नहीं समझाया गया।
- source_word: appear
  choice: दर्शन दूँगा
  rationale: दैवी प्रकट होने के भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना उसके स्वरूप को अधिक निश्चित किए।
- source_word: true things
  choice: सत्य बातें
  rationale: बहुवचन और कथनों की सत्यता, दोनों को सीधे बनाए रखता है।
- source_word: order of the times
  choice: समयों के क्रम
  rationale: विभिन्न नियत कालखंडों और उनके क्रम का भाव सुरक्षित रखता है; केवल सामान्य ‘समय’ नहीं किया गया।
- source_word: will not delay
  choice: देर नहीं करेंगे
  rationale: कालखंडों को वाक्य का कर्ता बनाए रखने वाली स्रोत-पाठ की अभिव्यक्ति सुरक्षित है।
theological_decisions:
- issue: वक्ता के प्रकट होने की प्रकृति
  choice: ‘दर्शन दूँगा’ कहकर प्रकट होने का भाव रखा गया
  alternative: ‘तुम्हारे सामने प्रकट होऊँगा’
  rationale: हिन्दी धार्मिक-साहित्यिक शैली में यह स्वाभाविक है, पर इससे दर्शन के माध्यम या स्वरूप के बारे में कोई अतिरिक्त दावा नहीं किया जाता।
- issue: ‘समयों’ का आशय
  choice: बहुवचन ‘समयों’ को बनाए रखा
  alternative: ‘युगों’ या ‘अन्त-समय की घटनाओं’
  rationale: पाठ की कालक्रम-संबंधी व्यापकता और अस्पष्टता सुरक्षित रखी गई है; किसी विशिष्ट युग-योजना को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली। उपलब्ध सिरिएक अध्याय-बकेट में पृष्ठ-अतिव्यापन और पाठ-विस्थापन है तथा लक्षित पद स्पष्ट रूप से पृथक नहीं दिखता; इसलिए शब्दांकन को उपलब्ध स्रोत-साक्ष्य के साथ अंग्रेज़ी POB परामर्श-पाठ से नियंत्रित किया गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
