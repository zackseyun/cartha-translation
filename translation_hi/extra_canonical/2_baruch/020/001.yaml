base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/020/001.yaml
  text: Therefore, behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.
translation:
  language: hi
  text: 1 इसलिए, देखो, वे दिन आ रहे हैं जब समय पहले के समयों से अधिक तेज़ी से बीतेंगे, ऋतुएँ बीत चुकी ऋतुओं से अधिक शीघ्र गुजर जाएँगी, और वर्ष वर्तमान वर्षों से अधिक तेज़ी से गुजरेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒ̈ܢܐ
  choice: समय
  rationale: यह बहुवचन कालखंडों या समयों को सूचित करता है; सहज हिन्दी में ‘समय’ सामूहिक अर्थ बनाए रखता है।
- source_word: ܫܢܝ̈ܐ
  choice: वर्ष
  rationale: सिरियाई शब्द का सीधा अर्थ ‘वर्ष’ है और काल की तीव्र गति वाले समानांतर वाक्य-विन्यास को सुरक्षित रखता है।
- source_word: ܡܛܠ ܗܢܐ
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष या परिणाम का संबंध व्यक्त करता है।
theological_decisions:
- issue: काल के तीव्र होने का अर्थ
  choice: समय, ऋतुओं और वर्षों के अधिक तेजी से बीतने की मूल रूपकात्मक भाषा बनाए रखी गई।
  alternative: इसे अंतिम दिनों के छोटा कर दिए जाने की स्पष्ट व्याख्या के रूप में प्रस्तुत करना।
  rationale: मूल कथन काल की गति का चित्र देता है, पर उसके धर्मवैज्ञानिक तंत्र को इस पद में स्पष्ट नहीं करता; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली; ‘देख’ ने भविष्यवाणी-संबंधी ध्यानाकर्षण को संक्षेप में सुरक्षित रखा है। तीन समानांतर काल-सूचक खंडों की लय बनाए रखी गई है।
