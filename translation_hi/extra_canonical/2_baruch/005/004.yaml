lexical_decisions:
- source_word: ܐܢܬ ܕܝܢ
  choice: पर तुम
  rationale: यह विरोधसूचक संबोधन है; आधुनिक हिन्दी में ‘पर तुम’ प्रसंग का मोड़ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܐܙܠ
  choice: जाओ
  rationale: मूल के सीधे आज्ञार्थक क्रियारूप को स्पष्ट और सहज हिन्दी आज्ञा के रूप में रखा गया है।
- source_word: ܡܕܡ ܕܐܡܪܝܢ ܠܟ
  choice: जो कुछ मैंने तुमसे कहा है
  rationale: ‘जो कुछ’ मूल की व्यापकता को बनाए रखता है और पूर्ण कथन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܩܘܝܡ / contextual imperative
  choice: वह करो
  rationale: पांडुलिपीय/OCR पाठ में रूप अस्पष्ट है, पर प्रसंग और नियंत्रक पाठ आज्ञा को ‘करो’ के अर्थ में समर्थित करते हैं।
theological_decisions:
- issue: आज्ञा का दायरा
  choice: ‘जो कुछ’ कहकर आदेश को व्यापक रखा गया
  alternative: किसी विशेष कार्य का नाम जोड़ना
  rationale: मूल इस पद में कार्य को निर्दिष्ट नहीं करता; इसलिए व्याख्यात्मक विवरण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। प्रत्यक्ष संबोधन तथा आज्ञार्थक बल सुरक्षित रखा गया है; कोई सांप्रदायिक या अतिरिक्त व्याख्या नहीं जोड़ी गई।
