translation:
  language: hi
  text: और प्रभु ने मुझसे कहा, “मेरा नाम और मेरी महिमा सदा-सर्वदा बने रहेंगे, पर मेरा न्याय अपने समय पर अपने अधिकार को बनाए रखेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने उचित अधिकार को सुरक्षित रखेगा।”
    reason: मूल वाक्यांश का अर्थ अपने उचित अधिकार या दावे को बनाए रखना अथवा सुरक्षित रखना भी हो सकता है।
lexical_decisions:
- source_word: ܫܡܝ ... ܬܫܒܘܚܬܝ (पांडुलिपि-पाठ का संदर्भ; OCR अस्पष्ट)
  choice: मेरा नाम और मेरी महिमा
  rationale: अंग्रेज़ी परामर्श-पाठ तथा इस पद की प्रमाणित पाठ-परंपरा के अनुरूप; ‘महिमा’ धार्मिक संदर्भ में स्वाभाविक और व्यापक रूप से बोधगम्य है।
- source_word: ܠܥܠܡ ܕܠܥܠܡ
  choice: सदा-सर्वदा
  rationale: शाब्दिक अर्थ ‘युगानुयुग’/‘सदैव’ है; ‘सदा-सर्वदा’ आधुनिक हिंदी में स्वाभाविक, गरिमापूर्ण और स्थायित्व पर बल देने वाला रूप है।
- source_word: ܕܝܢܝ / ܕܝܢ
  choice: मेरा न्याय
  rationale: प्रसंग और प्रमाणित पाठ-परंपरा इसे वक्ता के न्याय के रूप में समझते हैं; हिंदी में ‘न्याय’ निर्णय और न्यायिक क्रिया, दोनों की अर्थ-छाया बनाए रखता है।
- source_word: ܒܙܒܢܗ
  choice: अपने समय पर
  rationale: न्याय के नियत समय को व्यक्त करता है और मूल की कालगत अनिश्चितता को नहीं मिटाता।
- source_word: ܢܛܪ / ܢܣܒ ܙܕܩܗ
  choice: अपना अधिकार कायम रखेगा
  rationale: वाक्यांश में अपने उचित दावे या अधिकार को बनाए रखने/पाने की न्यायिक अर्थ-छाया है। यह हिंदी में अपेक्षाकृत स्वाभाविक रहते हुए मूल की कठिनता को फुटनोट में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के समय और अधिकार का संबंध
  choice: ‘मेरा न्याय अपने समय पर अपना अधिकार कायम रखेगा’
  alternative: ‘मेरा न्याय अपने समय पर अपना उचित फल पाएगा’
  rationale: मुख्य पाठ न्याय को उसके नियत समय में प्रभावी और वैध बताता है, बिना यह तय किए कि वाक्यांश केवल दंड, प्रतिफल या आत्म-प्रतिपादन में से किसका संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण शैली। ‘सदा-सर्वदा’ और ‘अपने समय पर’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ में कठिन न्यायिक रूपक को रखा गया है और वैकल्पिक अर्थ फुटनोट में दिया गया है।
