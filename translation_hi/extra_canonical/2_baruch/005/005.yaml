  yaml_path: translation/extra_canonical/2_baruch/005/005.yaml
  text: And I went and took Jeremiah, Addo, Seraiah, Jabish, Gedaliah, and all the honorable men of the people, and I brought them down to the valley of Kidron, and I told them everything that had been said to me.
translation:
  language: hi
  text: तब मैं गया और यिर्मयाह, अद्दो, सरायाह, याबीश, गदल्याह और प्रजा के सभी प्रतिष्ठित पुरुषों को अपने साथ लिया। मैं उन्हें नीचे किद्रोन की घाटी में ले गया[a] और जो कुछ मुझसे कहा गया था, वह सब उन्हें बता दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें ले आया।”
    reason: परंपरागत वैकल्पिक प्रस्तुति को दर्ज करता है; मुख्य पाठ में उतरने की दिशात्मक सूक्ष्मता सुरक्षित रखी गई है।
lexical_decisions:
- source_word: ܢܚܬ (Aphel; source evidence reflected in the audited reading)
  choice: नीचे … ले गया
  rationale: प्रेरणार्थक रूप उतरने की दिशा सहित ‘नीचे ले जाना’ व्यक्त करता है; किद्रोन की घाटी के भौगोलिक संदर्भ में यह स्वाभाविक और सटीक है।
- source_word: honorable men (audited consultation layer; exact Syriac verse absent from the supplied page bucket)
  choice: प्रतिष्ठित पुरुष
  rationale: यह सामाजिक सम्मान और समुदाय में मान्य स्थान—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܐܡܪ / passive speech formula (as represented by ‘had been said to me’)
  choice: मुझसे कहा गया था
  rationale: कथनकर्ता को स्पष्ट किए बिना मूल की कर्मवाच्य अभिव्यक्ति और उसका निहित तनाव बनाए रखता है।
theological_decisions:
- issue: जिसने बारूक से बातें कहीं, उसकी पहचान
  choice: कर्मवाच्य ‘मुझसे कहा गया था’ रखा गया
  alternative: ‘प्रभु ने मुझसे कहा था’
  rationale: इस पद की अभिव्यक्ति में वक्ता का नाम स्पष्ट रूप से जोड़ना अर्थ का अनावश्यक विस्तार और धार्मिक व्याख्या होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों को देवनागरी में निकट ध्वन्यात्मक रूप दिया गया है। उपलब्ध सिरिएक पृष्ठ-खंड में लक्षित पद स्पष्ट रूप से उपस्थित नहीं था, इसलिए शब्दांकन में लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानीपूर्वक सहारा लिया गया, जबकि ज्ञात सिरिएक क्रिया-सूक्ष्मता ‘नीचे ले गया’ में सुरक्षित रखी गई।
