  yaml_path: translation/extra_canonical/2_baruch/005/001.yaml
  text: And I said, “So then, I have hoped in vain, and in vain was Zion built. For if those who hate us have taken possession of her, what will you do for your great name?”
translation:
  language: hi
  text: तब मैंने कहा, “तो मैंने व्यर्थ ही आशा रखी, और सिय्योन व्यर्थ ही बसाया गया। जिनसे मैं प्रेम करता था और जिन्हें मैं प्रिय मानता था, उन्हें उनके निर्वासन के स्थान के हवाले कर दिया गया; और आपने अपने महान नाम के लिए मेरे साथ क्या किया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: स्थान के पारंपरिक बाइबलीय नाम को रखा गया है; प्रसंग में नगर के ऐतिहासिक और व्यापक धार्मिक अर्थ दोनों बने रहते हैं।
- source_word: ܒܢܝܬ / ܐܬܩܢܬ
  choice: बनाया गया
  rationale: निर्माण/स्थापना के निष्क्रिय भाव को सहज हिन्दी में व्यक्त करता है और सिय्योन की स्थापना के कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ܐܝܠܝܢ ܕܐܚܒܬ
  choice: हमसे घृणा करनेवाले
  rationale: उपलब्ध पाठ-साक्ष्य और संदर्भ में शत्रुओं के लिए प्रयुक्त संबंधवाचक अभिव्यक्ति को अंग्रेज़ी परामर्श-पाठ के अनुरूप स्वाभाविक हिन्दी में रखा गया है; क्षतिग्रस्त/अव्यवस्थित स्रोत-पंक्तियों के कारण इससे अधिक विशिष्ट पहचान नहीं जोड़ी गई।
- source_word: ܫܡܐ … ܪܒܐ
  choice: महान नाम
  rationale: ‘नाम’ की प्रतिष्ठा और सार्वजनिक महिमा से जुड़ी प्राचीन धार्मिक अभिव्यक्ति को शाब्दिक और बोधगम्य रूप में सुरक्षित रखता है।
theological_decisions:
- issue: सिय्योन पर शत्रुओं का अधिकार और परमेश्वर की प्रभुता
  choice: शत्रुओं के अधिकार को शर्तसूचक ‘यदि’ के भीतर रखा गया है।
  alternative: शत्रुओं द्वारा सिय्योन पर अंतिम और निर्विवाद अधिकार स्थापित होना।
  rationale: वक्ता की व्याकुलता वास्तविक ऐतिहासिक संकट को व्यक्त करती है, पर वाक्य स्वयं परमेश्वर की अंतिम प्रभुता का निषेध नहीं करता; आगामी प्रसंग भी शत्रुओं को न्याय के अस्थायी साधन बताता है।
- issue: ‘व्यर्थ’ की पुनरावृत्ति
  choice: आशा और सिय्योन के निर्माण—दोनों के साथ ‘व्यर्थ’ रखा गया है।
  alternative: पुनरावृत्ति हटाकर केवल वक्ता की आशा को व्यर्थ कहना।
  rationale: 'पुनरावृत्ति विलाप की तीव्रता और पाठ का धर्मवैचारिक तनाव बनाए रखती है: वक्ता परमेश्वर की योजना को समझ नहीं पा रहा, पर कथाकार उसकी आशंका को अंतिम सत्य घोषित नहीं करता।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सहज शैली अपनाई गई है। परमेश्वर को संबोधित करते हुए आदरसूचक ‘आप’ रखा गया है। ‘सिय्योन’ को ‘यरूशलेम’ से बदलकर व्याख्यात्मक समानता नहीं बनाई गई, ताकि मूल पद की विशिष्टता बनी रहे।
