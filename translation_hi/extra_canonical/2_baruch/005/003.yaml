  text: And you will see with your eyes that it is not the enemies who overthrow Zion, nor those who burn Jerusalem, but that they are ministers of the Judge for a time.
translation:
  language: hi
  text: और तुम अपनी आँखों से देखोगे कि सिय्योन को उजाड़नेवाले और यरूशलेम को जलानेवाले शत्रु नहीं हैं, बल्कि वे कुछ समय के लिए न्यायी के सेवक हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायी की सेवा में कार्य करनेवाले हैं।”
    reason: ܡܫܡܫܝܢ के सेवक होने और सेवा में कार्य करने—दोनों निकट अर्थों को स्पष्ट करता है, जबकि ܕܝܢܐ का व्यक्ति-वाचक अर्थ सुरक्षित रखता है।
lexical_decisions:
- source_word: ܡܒܕܩܢܐ
  choice: विनाश करनेवाले
  rationale: यह पद सिय्योन के विरुद्ध विध्वंस करनेवालों को सूचित करता है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: ܕܝܢܐ
  choice: न्यायी
  rationale: निश्चित रूप में आए व्यक्ति-वाचक पद को ‘न्यायी’ रखा गया है, ताकि उसे अमूर्त ‘न्याय’ न बना दिया जाए।
- source_word: ܡܫܡܫܝܢ
  choice: सेवा करनेवाले
  rationale: क्रिया का मूल भाव किसी अधिकारी के सेवक अथवा कार्यकारी के रूप में सेवा करना है।
- source_word: ܒܙܒܢܐ
  choice: कुछ समय के लिए
  rationale: वाक्य में सीमित कालावधि का भाव है; यह हिन्दी में सहज रूप से व्यक्त होता है।
theological_decisions:
- issue: यरूशलेम के विनाशकर्ताओं की भूमिका
  choice: उन्हें कुछ समय के लिए ‘न्यायी की सेवा करनेवाले’ कहा गया है
  alternative: ‘न्याय का कार्य करनेवाले’
  rationale: मूल पाठ विनाशकर्ताओं को स्वतंत्र अंतिम कर्ता नहीं, न्यायी के अधीन अस्थायी कार्यकारी बताता है; फिर भी क्रिया में ‘न्याय का कार्य करने’ का अर्थ-संकेत संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वास्तव में’ हिन्दी में ‘नहीं... बल्कि’ के विरोध को स्पष्ट करता है और कोई नया धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
