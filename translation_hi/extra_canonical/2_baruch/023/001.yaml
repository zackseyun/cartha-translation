  yaml_path: translation/extra_canonical/2_baruch/023/001.yaml
  text: And I answered and said, “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near, and is not as far off as it was before.”
translation:
  language: hi
  text: तब मैंने उत्तर दिया, “नहीं, हे प्रभु, मेरे स्वामी।” उसने मुझे उत्तर दिया, “जिसे तुम नहीं जानते, उसके कारण क्यों व्याकुल होते हो? और जिन बातों से तुम अनजान हो, उनके कारण क्यों बेचैन होते हो? जैसे तुम उन लोगों को नहीं भूले जो अब जीवित हैं और जो बीत चुके हैं, वैसे ही मैं उन लोगों को स्मरण रखता हूँ जो आनेवाले हैं। क्योंकि जब आदम ने पाप किया और जन्म लेनेवालों के लिए मृत्यु ठहरा दी गई, तभी जन्म लेनेवालों की कुल संख्या निश्चित कर दी गई और उस संख्या के लिए एक स्थान तैयार किया गया, जहाँ जीवित लोग बसें और मृतक रखे जाएँ। इसलिए जब तक पहले से ठहराई गई वह संख्या पूरी नहीं हो जाती, सृष्टि फिर जीवित नहीं होगी। क्योंकि मेरी आत्मा जीवन देनेवाली है, और शिओल[a] मृतकों को ग्रहण करता है। इसके अतिरिक्त, तुम्हें यह सुनने का अवसर दिया गया है कि इन समयों के बाद क्या होगा। क्योंकि मेरा उद्धार सचमुच निकट आ गया है; अब वह उतना दूर नहीं है जितना पहले था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शिओल: मृतकों का लोक; यहाँ इसका अर्थ केवल कब्र नहीं है।'
    reason: मूल सांस्कृतिक और अपोकैलिप्टिक शब्द को सुरक्षित रखते हुए सामान्य हिन्दी पाठक को संक्षिप्त अर्थ-सहायता देना।
lexical_decisions:
- source_word: ܡܥܝܪ
  choice: व्याकुल
  rationale: यह भावनात्मक अशांति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, पर घबराहट या आतंक का अनावश्यक तीखापन नहीं जोड़ता। समानांतर वाक्य में ‘बेचैन’ रखकर स्रोत की पुनरुक्ति का अर्थपूर्ण अंतर बनाए रखा गया है।
- source_word: ܡܢܝܢܐ
  choice: कुल संख्या
  rationale: यह केवल गिनने की क्रिया नहीं, बल्कि पहले से निश्चित समग्र संख्या की अपोकैलिप्टिक धारणा को स्पष्ट करता है।
- source_word: ܫܝܘܠ
  choice: शिओल
  rationale: लिप्यंतरण से यहूदी अपोकैलिप्टिक संदर्भ का विशिष्ट मृतलोक सुरक्षित रहता है; इसे केवल ‘कब्र’ या सामान्य ‘अधोलोक’ में सीमित नहीं किया गया।
- source_word: ܦܘܪܩܢܐ
  choice: उद्धार
  rationale: यह दैवी बचाव के व्यापक अर्थ को स्वाभाविक और प्रचलित हिन्दी में व्यक्त करता है, बिना इसे केवल राजनीतिक छुटकारे या किसी संकीर्ण सिद्धान्त तक सीमित किए।
- source_word: ܪܘܚܝ
  choice: मेरी आत्मा
  rationale: मूल के दैवी संबंधवाचक रूप को बनाए रखता है और जीवन देने वाली सक्रियता व्यक्त करता है, पर बाद की त्रित्व-संबंधी शब्दावली को पद में नहीं आरोपित करता।
theological_decisions:
- issue: आदम के पाप के समय भावी मनुष्यों के लिए मृत्यु का ठहराया जाना
  choice: “जन्म लेनेवालों के लिए मृत्यु ठहरा दी गई”
  alternative: “आदम के वंशजों को नश्वर बना दिया गया”
  rationale: चुना गया रूप पाठ के सामूहिक और अपोकैलिप्टिक कथन को बनाए रखता है तथा वंशानुगत पाप या नश्वरता के किसी बाद के व्यवस्थित सिद्धान्त को स्पष्टतः आरोपित नहीं करता।
- issue: पहले से निश्चित संख्या पूरी होने पर सृष्टि का फिर जीवित होना
  choice: “सृष्टि फिर जीवित नहीं होगी”
  alternative: “प्राणी फिर जीवित नहीं होगा”
  rationale: ‘सृष्टि’ सामूहिक और विश्वव्यापी विस्तार को खुला रखता है; एकवचन ‘प्राणी’ कथन को केवल किसी व्यक्ति विशेष के पुनर्जीवन तक सीमित कर सकता था।
- issue: दैवी आत्मा की जीवनदायी सक्रियता और शिओल द्वारा मृतकों को ग्रहण करना
  choice: “मेरी आत्मा जीवन देनेवाली है, और शिओल मृतकों को ग्रहण करता है”
  alternative: “मेरी आत्मा जीवितों की रचना करती है, और शिओल मृतकों को रखता है”
  rationale: यह जीवन और मृत्यु के क्षेत्र का विरोध स्पष्ट रखता है, फिर भी ‘रचना’ या ‘पुनःसृष्टि’ जैसी अधिक निश्चित व्याख्या नहीं जोड़ता।
