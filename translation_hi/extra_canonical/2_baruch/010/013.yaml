  text: 'And you, bridegrooms, do not enter;

    and let not the virgins adorn themselves.

    And you, women, do not pray to bear children.'
translation:
  language: hi
  text: 'और हे दूल्हो, प्रवेश न करो;


    कुँवारियाँ अपना श्रृंगार न करें;


    और हे स्त्रियो, संतान जनने के लिए प्रार्थना न करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܬܢ̈ܐ
  choice: दूल्हो
  rationale: संदर्भ में विवाह करने वाले पुरुषों को सीधे संबोधन है; आधुनिक हिन्दी में ‘दूल्हो’ स्वाभाविक और स्पष्ट है।
- source_word: ܒܬܘ̈ܠܬܐ
  choice: कुँवारियाँ
  rationale: यह अविवाहित युवतियों के लिए प्रयुक्त शब्द है; ‘कुँवारियाँ’ अर्थ को सीधे और सामान्य हिन्दी में व्यक्त करता है।
- source_word: ܢܫ̈ܐ
  choice: स्त्रियो
  rationale: सामान्य बहुवचन संबोधन को गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: ܝܠܕ / ܡܘܠܕ
  choice: संतान उत्पन्न करने
  rationale: जन्म देने के भाव को केवल गर्भधारण तक सीमित न करके संतानोत्पत्ति के व्यापक अर्थ में व्यक्त किया गया है।
theological_decisions:
- issue: शोक-विलाप के प्रसंग में विवाह और संतानोत्पत्ति पर निषेध
  choice: आज्ञार्थक निषेध को बिना नरम किए रखा गया है
  alternative: इसे केवल अलंकारिक शोक-भाषा बताकर ‘अब उत्सव मत मनाओ’ जैसे सामान्य कथन में बदलना
  rationale: मूल की तीखी और तनावपूर्ण विलाप-भाषा को बनाए रखना आवश्यक है; अनुवाद उसके आशय को व्याख्यात्मक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तीनों समानांतर निषेधों की काव्यात्मक संरचना सुरक्षित है। ‘प्रवेश न करो’ में मूल की असंपूरित/संदर्भाधीन वस्तु को स्पष्ट करने के लिए ‘विवाह-मंडप’ या ‘विवाह-कक्ष’ नहीं जोड़ा गया।
