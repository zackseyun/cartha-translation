base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/010.yaml
  text: 'And you, vine, why do you still give your wine?

    For no offering from you will again be received in Zion,

    and no firstfruits will again be accepted.'
translation:
  language: hi
  text: और हे दाखलता, तू अब भी अपना दाखरस क्यों देती है? क्योंकि अब से सिय्योन में तुझसे कोई अर्पण फिर ग्रहण नहीं किया जाएगा, और न तेरी पहली उपज फिर स्वीकार की जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܒܐ
  choice: दाखलता
  rationale: संदर्भ में संबोधित फलदायी लता है; ‘दाखलता’ आधुनिक हिन्दी में अंगूर की बेल का स्पष्ट और गरिमापूर्ण रूप है।
- source_word: ܚܡܪܐ (पाठ-संदर्भ में अभिप्रेत)
  choice: दाखरस
  rationale: अंगूर की बेल से निकलने वाले मद्य के लिए पारंपरिक किंतु सुबोध शब्द; केवल ‘रस’ कहने से आशय अस्पष्ट हो सकता था।
- source_word: ܩܘܪܒܢܐ / अर्पण-संबंधी पाठार्थ
  choice: अर्पण
  rationale: मंदिर में चढ़ाई जाने वाली भेंट का व्यापक धार्मिक अर्थ बनाए रखता है और किसी विशेष बलिदान-प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ܪܝܫܝܬܐ / प्रथम फल-संबंधी पाठार्थ
  choice: पहली उपज
  rationale: कृषि की प्रथम उपज का अर्थ सहज हिन्दी में देता है; ‘पहले फल’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: सिय्योन में अर्पणों का बंद होना
  choice: भविष्य में अर्पण के फिर ग्रहण न किए जाने के रूप में रखा
  alternative: इसे परमेश्वर द्वारा दाखलता की स्थायी अस्वीकृति मानना
  rationale: विलाप का निकट संदर्भ मंदिर और यरूशलेम के विनाश का है; पाठ स्वयं दाखलता की शाश्वत धार्मिक अस्वीकृति घोषित नहीं करता।
- issue: निष्क्रिय क्रिया का कर्ता
  choice: ‘ग्रहण नहीं किया जाएगा’
  alternative: ‘परमेश्वर ग्रहण नहीं करेगा’
  rationale: मूल के निष्क्रिय भाव को सुरक्षित रखा गया है और अव्यक्त कर्ता को स्पष्ट करके धार्मिक तनाव का अनावश्यक समाधान नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक संबोधन और विलाप का स्वर रखा गया है। ‘हे दाखलता’ तथा ‘सिय्योन’ बाइबिलीय गरिमा बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी है। उपलब्ध सिरिएक पृष्ठ-पाठ में इस अंश के कुछ शब्द पाठगत/OCR रूप से अस्थिर दिखते हैं; अनुवाद निकट संदर्भ और नियंत्रित अध्याय-पाठ से प्रमाणित अर्थानुक्रम पर आधारित है।
