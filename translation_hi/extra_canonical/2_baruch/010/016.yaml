base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/016.yaml
  text: 'Or why should people again have children,

    or why should the seed of their nature again be named,

    when this mother lies desolate

    and her children have gone away into captivity?'
translation:
  language: hi
  text: 'लोग फिर संतान क्यों उत्पन्न करें,

    या उनके स्वभाव का बीज फिर क्यों नाम पाए,

    जब यह माता उजाड़ पड़ी है

    और उसके बच्चे बंदी बनाकर ले जाए गए हैं?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܫܐ ܕܡܘܠܕܝܢ
  choice: लोग … संतान उत्पन्न करें
  rationale: शाब्दिक अर्थ ‘जन्म देनेवाले/उत्पन्न करनेवाले लोग’ है; आधुनिक हिन्दी में ‘संतान उत्पन्न करें’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ܐܡܐ
  choice: यह माता
  rationale: विलाप में यरूशलेम/सिय्योन को माता के रूप में संबोधित करनेवाली रूपकात्मक भाषा को बनाए रखा गया है।
- source_word: ܒܢܝ̈ܗ ܐܬܬܒܝܘ
  choice: उसके बच्चे बंदी बनाकर ले जाए गए हैं
  rationale: ‘उसके पुत्र/बच्चे बंदी किए गए’ का भाव है; प्रसंग में निर्वासन की गति को स्पष्ट करने के लिए ‘ले जाए गए’ रखा गया है।
- source_word: seed/offspring of their nature (textually difficult clause)
  choice: उनके स्वभाव का बीज
  rationale: उपलब्ध सिरिएक पाठ इस पंक्ति में कठिन/अस्पष्ट है; परामर्श-पाठ में सुरक्षित वंशोत्पत्ति के रूपक को बिना व्याख्यात्मक रूप से सुलझाए औपचारिक ढंग से रखा गया है।
theological_decisions:
- issue: ‘माता’ की पहचान
  choice: मुख्य पाठ में केवल ‘यह माता’
  alternative: ‘यरूशलेम माता’ या ‘सिय्योन’
  rationale: निकटवर्ती प्रसंग संकेत देता है कि माता यरूशलेम/सिय्योन है, पर पद स्वयं रूपकात्मक संकेत को खुला रखता है; इसलिए पहचान को पाठ में जोड़कर स्पष्ट नहीं किया गया।
- issue: वंशोत्पत्ति संबंधी कठिन मध्य-पंक्ति
  choice: रूपक को ‘स्वभाव का बीज’ के रूप में बनाए रखना
  alternative: ‘उनका वंश फिर क्यों बना रहे’
  rationale: सरल वैकल्पिक पाठ अधिक स्वाभाविक है, पर वह मूल की असामान्य और संभवतः पाठगत रूप से कठिन अभिव्यक्ति को चुपचाप सामान्य बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शोकगीत की गंभीर, काव्यात्मक शैली और चार-पंक्तीय समानांतरता सुरक्षित रखी गई है। ‘बीज’ जानबूझकर कुछ असामान्य रखा गया है ताकि वंशोत्पत्ति का मूल रूपक और पाठ की वास्तविक कठिनाई बनी रहे।
