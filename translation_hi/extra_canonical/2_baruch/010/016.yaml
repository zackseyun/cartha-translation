    9 ܘ ܐܬܒܥ ܐܢ ܒܪܘ̣ܗܝ

    ܘܐܬܩܒܠ ܗܘ̣ ܕܐܫܬܡܥ.

    ܀ ܕܟܕ ܠܒܝܫ ܡܢ ܚܛܝ̈ܗ̣ܐ

    ܗܘ̣ ܕܠܐ ܐܬܚܙܝ ܒܥܒܕܘܗܝ

    ܕܡܕܝܢܬܐ ܘܕܢܝ ܡܕ̈ܢܝܗ

    ܘܒܩ̈ܝ. ܘܐܬܒܥܝ ܘܕܩ̈ܝ

    10 .. ܝܡܝܟ ܐܘ ܡ̈ܢܝ ܆܀܆ ܗܘ̣ܘ

    ܡܢ ܒܝܬ ܝܡܝܟ ܝܘܡ̈ܝ.

    ܗܘ̣ ܒܠܥܕ ܦܘ ܨܒܘܬ

    ܕܐܠܗܐ ܘܐܡ̣ܪ ܠܝ. ܐܡ̣

    ܠܒܒܝܠ܂ ܐܢܬ ܕܝܢ ܩܘܡ

    ܗܟܝܠ ܒܚܘܫܒܝܟ ܕܢܗܘܘܢ܂

    ܘܠܐ ܡܚܘܐ ܐܢܐ ܠܟ

    ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ܂

    ܡܕܡ ܕܥܬܝܕ ܕܢܓܕܫ

    ܒܙܒܢܐ ܝܘܡ̈ܝܐ܂

    ܘܐܡܪܬ ܠܐܪܡܝܐ ܐܚܝ

    ܕܦܩܕܢܝ ܡܪܝܐ܂ ܘܗܘ

    ܕܝܢ ܐܙܠ ܥܡ ܥܡܐ܂

    ܐܢܐ ܕܝܢ ܒܪܘܟ ܐܦܩܬ

