  text: 'But as for us who live, woe to us,

    because we have seen the afflictions of Zion

    and what has happened to Jerusalem.'
translation:
  language: hi
  text: 'परन्तु हम जो जीवित हैं—हम पर हाय!

    क्योंकि हमने सिय्योन के क्लेश

    और यरूशलेम पर जो बीता है, उसे देखा है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ
  choice: हम जो जीवित हैं
  rationale: सिरिएक संबंधवाचक पदबंध का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: ܚܙ ܠܢ
  choice: हम पर हाय!
  rationale: पाठ का रूप कुछ असामान्य है, पर प्रसंग और प्रचलित पाठ-साक्ष्य इसे शोकसूचक उद्गार के रूप में समर्थन देते हैं।
- source_word: ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ
  choice: सिय्योन के क्लेश
  rationale: बहुवचन संज्ञा विपत्ति, पीड़ा या क्लेश का भाव देती है; काव्यात्मक विलाप में ‘क्लेश’ सहज है।
- source_word: ܡܕܡ ܕܓܕܫܗ ܠܐܘܪܫܠܡ
  choice: यरूशलेम पर जो बीता है
  rationale: ܓܕܫ का अर्थ ‘घटित होना/बीटना’ है; हिन्दी में ‘पर जो बीता’ नगर पर आई विपत्ति का स्वाभाविक संकेत देता है।
- source_word: ܚ̈ܙܝܢܢ
  choice: हमने ... देखा है
  rationale: सिरिएक रूप वर्तमान/संपूर्ण अनुभव की छाया रख सकता है; विनाश के प्रत्यक्ष साक्षी होने के भाव को हिन्दी पूर्ण पक्ष स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: जीवित बचे लोगों के शोक की तीव्रता
  choice: ‘हम पर हाय!’ को स्पष्ट विलाप के रूप में रखा गया
  alternative: ‘हम अभागे हैं’
  rationale: मूल का उद्गारात्मक स्वर बनाए रखता है और इसे किसी कर्म-सिद्धान्त या विशिष्ट धर्मवैचारिक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विलाप-शैली रखी गई है। पंक्ति-विन्यास मूल की काव्यात्मक समानांतरता को दर्शाता है; किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
