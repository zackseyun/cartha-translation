  text: 'And he went with the people, but I, Baruch, returned and sat before the gates of the temple, and I lifted up this lament over Zion and said:'
translation:
  language: hi
  text: 'और वह लोगों के साथ चला गया। परन्तु मैं, बारूक, लौट आया और मन्दिर के फाटकों के सामने बैठ गया। तब मैंने सिय्योन के लिए यह विलाप किया और कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܙܠ ܥܡ ܥܡܐ
  choice: लोगों के साथ चला गया
  rationale: क्रिया और संबंधसूचक पद का सीधा, स्वाभाविक हिन्दी रूप; ‘लोगों’ सामूहिक ܥܡܐ को व्यक्त करता है।
- source_word: ܝܬܒܬ ܩܕܡ ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ
  choice: मन्दिर के फाटकों के सामने बैठ गया
  rationale: ܬܪ̈ܥܘܗܝ बहुवचन ‘उसके फाटक’ है, जिसका संबंध मन्दिर से है; हिन्दी में स्वाभाविक संबंध-रचना अपनाई गई है।
- source_word: ܐܠܝܬ ܐܠܝܬܐ ܗܕܐ ܥܠ ܨܗܝܘܢ
  choice: मैंने सिय्योन के लिए यह विलाप किया
  rationale: संज्ञा और उसी मूल की क्रिया का अर्थ हिन्दी में सहज ढंग से ‘यह विलाप किया’ द्वारा दिया गया; ܥܠ का शोक-संदर्भगत अर्थ ‘के लिए’ है।
- source_word: ܐܦܩܬ ܐܢܘܢ
  choice: लौट आया
  rationale: प्राप्त पंक्ति का रूप कठिन/संभवतः पाठगत रूप से विकृत है; प्रसंग और नियंत्रक पाठ-परंपरा यहाँ बारूक के लौटने का अर्थ समर्थित करते हैं।
