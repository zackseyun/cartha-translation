translation:
  language: hi
  text: '“धन्य है वह जो जन्मा ही नहीं,

    या वह जो जन्म लेकर मर गया।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܘܒܘܗܝ
  choice: धन्य है
  rationale: यह विस्मयात्मक धन्यता-सूचक पद है; शोकगीत के तीखे विरोधाभास को बनाए रखते हुए ‘धन्य है’ उसका पारंपरिक और स्वाभाविक हिन्दी रूप है।
- source_word: ܕܠܐ ܐܬܝܠܕ
  choice: जो जन्मा ही नहीं
  rationale: निषेध को ‘ही’ से बल देकर अजन्मे रहने का अर्थ स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ܕܐܬܝܠܕ ܘܡܝܬ
  choice: जो जन्म लेकर मर गया
  rationale: दोनों क्रमिक क्रियाओं—जन्म लेने और मरने—को संक्षिप्त, प्रवाही हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अजन्मे या मृत व्यक्ति को ‘धन्य’ कहना
  choice: मूल कथन की शोकपूर्ण और तनावपूर्ण भाषा को यथावत रखा गया है।
  alternative: इसे केवल दुःख की अतिशयोक्ति बताकर नरम करना
  rationale: यह सिय्योन पर विलाप के संदर्भ में एक काव्यात्मक उद्गार है; अनुवाद को इसके धर्मवैचारिक तनाव को समझाकर समाप्त या कम नहीं करना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी; मूल की दो-पंक्तीय विलापात्मक समानता सुरक्षित रखी गई है।
