base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/009.yaml
  text: 'You farmers, do not sow again;

    and you, O earth, why do you still give the fruit of your produce?

    Keep within you the sweetness of your nourishment.'
translation:
  language: hi
  text: 'हे किसानों, फिर बीज मत बोओ;


    और हे धरती, तुम अब भी अपनी उपज का फल क्यों देती हो?


    अपने पोषण की मिठास अपने भीतर रोके रखो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ
  choice: धरती
  rationale: प्रत्यक्ष संबोधन को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: ܦܐܪ̈ܐ
  choice: फल
  rationale: मूल के ‘फल/उपज’ संबंधी बिंब को सुरक्षित रखता है; ‘अपनी उपज का फल’ कृषि-संदर्भ को स्पष्ट करता है।
- source_word: ܚܠܝܡܘܬܐ
  choice: मिठास
  rationale: यहाँ स्वाद, सुखदता या उत्तमता के भाव वाला शब्द है; विलाप के काव्यात्मक संदर्भ में ‘मिठास’ सबसे सीधा रूप है।
- source_word: ܡܙܘ̈ܢܝܟܝ
  choice: अपने पोषण की
  rationale: शब्द भोजन अथवा पोषण-सामग्री को सूचित करता है; ‘पोषण’ धरती की जीवनदायी उपज के व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: धरती को संबोधित करके उसकी उपज रोकने का आह्वान
  choice: इसे शाब्दिक काव्यात्मक संबोधन के रूप में रखा गया
  alternative: इसे परमेश्वर द्वारा भूमि पर लगाए गए शाप के रूप में स्पष्ट करना
  rationale: मूल एक विलापपूर्ण अलंकारिक आदेश देता है और उसके कारण या कर्ता की धर्मवैज्ञानिक व्याख्या नहीं करता; इसलिए तनाव को अनिर्णीत रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुकूल है। ‘हे किसानो’ और ‘हे धरती’ मूल के प्रत्यक्ष संबोधन को रखते हैं; छोटे आदेशात्मक वाक्य सार्वजनिक पाठ में सहज हैं।
