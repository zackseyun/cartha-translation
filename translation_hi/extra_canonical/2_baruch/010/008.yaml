base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/008.yaml
  text: 'I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.'
translation:
  language: hi
  text: 'मैं समुद्र से साइरनों[a] को पुकारूँगा,


    और तुम, लिलिथों[b], मरुभूमि से चली आओ;


    और तुम, दुष्टात्माओं और वनों के अजगरों,


    जाग उठो, शोक के लिए कमर कसो;


    मेरे साथ विलाप छेड़ो,


    और मेरे साथ मातम मनाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'साइरन: प्राचीन परंपराओं में समुद्र से जुड़े रहस्यमय प्राणी।'
    reason: अपरिचित प्राणी-संज्ञा को बिना अतिव्याख्या के संक्षेप में स्पष्ट करना।
  - marker: b
    text: 'लिलिथ: प्राचीन परंपराओं में मरुभूमि से जुड़ी भयावह स्त्री-आकृति या रात्रिचर आत्माएँ।'
    reason: विशिष्ट प्राचीन नाम का संकेत देना, साथ ही उसकी सटीक प्रकृति के विषय में स्रोत की अस्पष्टता बनाए रखना।
lexical_decisions:
- source_word: ܣܝܪ̈ܝܢܘܣ
  choice: साइरन
  rationale: यह यूनानी परंपरा से आया प्राणी-संज्ञक शब्द है। इसे किसी सामान्य जल-जीव में बदलने के बजाय लिप्यंतरित किया गया है, ताकि प्राचीन काव्यात्मक और पौराणिक संकेत बना रहे।
- source_word: ܠܝ̈ܠܝܬܐ
  choice: लिलिथें
  rationale: स्रोत में मरुभूमि से संबद्ध स्त्रीलिंग बहुवचन अलौकिक प्राणियों का नाम है; विशिष्ट पहचान को बचाने के लिए इसका लिप्यंतरण किया गया है। मुख्य पाठ में संबोधन के कारण रूप ‘लिलिथों’ है।
- source_word: ܫܐ̈ܕܐ
  choice: दुष्टात्माएँ
  rationale: यह अलौकिक हानिकारक आत्माओं के लिए प्रचलित शब्द है। ‘दानव’ की अपेक्षा ‘दुष्टात्मा’ आधुनिक हिन्दी पाठक के लिए स्पष्ट है और किसी खास भौतिक आकृति को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: 'English control: dragons; Syriac continuation at page break'
  choice: अजगर
  rationale: पृष्ठ-विच्छेद पर अस्पष्ट प्राणी-संज्ञा के लिए नियंत्रण-पाठ के ‘dragons’ को ध्यान में रखते हुए पारंपरिक और काव्यात्मक हिन्दी ‘अजगर’ चुना गया; इसे आधुनिक काल्पनिक ‘ड्रैगन’ बनाकर अर्थ-क्षेत्र सीमित नहीं किया गया।
- source_word: gird up your loins (control rendering of mourning preparation)
  choice: कमर कसो
  rationale: शाब्दिक शारीरिक बिंब और कार्य के लिए तैयार होने का भाव दोनों स्वाभाविक हिन्दी मुहावरे में सुरक्षित रहते हैं।
theological_decisions:
- issue: साइरन, लिलिथ, दुष्टात्मा और अजगर जैसे प्राणियों की सत्ता या प्रकृति
  choice: उन्हें विलाप में बुलाए गए काव्यात्मक पात्रों के रूप में यथावत रखा गया
  alternative: उन्हें केवल पशु, रूपक अथवा किसी निश्चित दानवी वर्ग के रूप में समझाकर अनुवाद करना
  rationale: पद स्वयं उनकी तत्त्वमीमांसीय स्थिति स्पष्ट नहीं करता। अनुवाद को इस अस्पष्टता को बनाए रखना चाहिए, न कि किसी विशिष्ट दार्शनिक या सांप्रदायिक व्याख्या को आरोपित करना चाहिए।
translation_notes:
  register: भाषा काव्यात्मक, शोकपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। संबोधन के बहुवचन रूप (‘लिलिथों’, ‘दुष्टात्माओ’, ‘अजगरो’) आधुनिक मानक हिन्दी के अनुसार हैं। समानार्थी दिखने वाली अंतिम दो पंक्तियों को अलग रखा गया है, क्योंकि स्रोत का आवर्तन विलाप की तीव्रता बढ़ाता है।
