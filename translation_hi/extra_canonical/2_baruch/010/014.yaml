  text: 'Rather, let the barren rejoice,

    and let those who have no children be glad;

    but let those who have children grieve.'
translation:
  language: hi
  text: 'इसके बजाय बाँझ स्त्रियाँ आनन्द मनाएँ,


    और जिनके कोई बच्चे नहीं हैं वे प्रसन्न हों;


    पर जिनके बच्चे हैं वे शोक करें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܩܪ̈ܬܐ (contextually reconstructed from the Syriac lament sequence)
  choice: बाँझ स्त्रियाँ
  rationale: विलाप के प्रसंग में संतान न जन सकने वाली स्त्रियों का स्पष्ट और स्वाभाविक हिन्दी रूप; अंग्रेज़ी परामर्श-पाठ भी इसी अर्थ की पुष्टि करता है।
- source_word: ܒܢܝ̈ܐ / ܝܠܕ̈ܐ (contextual child terminology)
  choice: सन्तान
  rationale: लिंग-निरपेक्ष सामूहिक अर्थ बनाए रखता है और ‘बच्चे’ की अपेक्षा इस काव्यात्मक विलाप में अधिक गरिमापूर्ण है।
- source_word: ܢܚܕ̈ܝܢ / ܢܪܘܙ̈ܢ (rejoicing language in context)
  choice: आनन्द मनाएँ … प्रसन्न हों
  rationale: समानार्थी क्रियाओं से काव्यात्मक समानांतरता रहती है, पर हिन्दी में अनावश्यक यांत्रिक पुनरावृत्ति नहीं होती।
- source_word: ܢܬܐܒܠ̈ܢ (mourning sense in context)
  choice: शोक करें
  rationale: यरूशलेम के विनाश पर चल रहे विलाप के अनुरूप तीव्र दुःख और मातम का भाव व्यक्त करता है।
theological_decisions:
- issue: बाँझपन और संतान के विषय में उलटी धन्यता-जैसी उक्ति
  choice: विनाश के प्रसंग में कथन की कठोर उलटबाँसी को ज्यों का त्यों रखा गया है।
  alternative: इसे सामान्य शिक्षा मानकर नरम करना कि संतानहीन लोग केवल ‘कम दुःखी’ होंगे।
  rationale: पाठ सामान्यतः बाँझपन को श्रेष्ठ नहीं ठहराता; वह आने वाली विपत्ति की भयावहता व्यक्त करने के लिए सामान्य आनन्द और शोक को उलट देता है। अनुवाद को इस तनाव को समझाकर समाप्त नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक विलाप के अनुरूप संक्षिप्त और गरिमापूर्ण शैली। ‘इसके बजाय’ पिछले कथन से विरोधी संक्रमण दर्शाता है। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
