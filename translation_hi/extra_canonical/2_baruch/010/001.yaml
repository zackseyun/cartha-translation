  text: '1 सात दिन बीतने के बाद ऐसा हुआ कि परमेश्वर का वचन मेरे पास आया और उसने मुझसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ / सात दिनों के बाद का काल-सूचक वाक्यांश
  choice: सात दिन बीतने के बाद
  rationale: घटना के समय-क्रम को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है और स्रोत में दिए सात दिनों को बनाए रखता है।
- source_word: ܨܒܘܬܐ ܕܐܠܗܐ (पाठ-साक्ष्य में ‘परमेश्वर का वचन/बात’)
  choice: परमेश्वर का वचन
  rationale: यह दैवी संदेश के लिए प्रतिष्ठित और सहज हिन्दी अभिव्यक्ति है; ‘वचन’ के व्यक्तिवाची या केवल संदेश होने के प्रश्न को अनावश्यक रूप से तय नहीं करती।
- source_word: ܐܡܪ ܠܝ
  choice: मुझसे कहा
  rationale: सीरियाई दत्तिवाचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘परमेश्वर का वचन’ का स्वरूप
  choice: वाक्यांश को ‘परमेश्वर का वचन’ ही रखा गया है
  alternative: ‘परमेश्वर का संदेश’ या किसी व्यक्तिवाची उपाधि के रूप में विस्तार
  rationale: स्रोत की अभिव्यक्ति को बिना किसी बाद की धर्मशास्त्रीय पहचान आरोपित किए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘ऐसा हुआ कि’ मूल की कथात्मक शैली को बनाए रखता है; दोहराव से बचने के लिए ‘वचन ... आया और उसने ... कहा’ रखा गया है।
