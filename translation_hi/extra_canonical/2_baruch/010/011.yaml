translation:
  language: hi
  text: 'और हे आकाश, अपनी ओस रोक लो,

    और वर्षा के भंडारों को मत खोलो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܝܐ
  choice: आकाश
  rationale: सिरिएक में रूप व्याकरणतः बहुवचन है, पर इसका सामान्य अर्थ सामूहिक रूप से ‘आकाश’ है; हिन्दी में एकवचन अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ܛܠܐ
  choice: ओस
  rationale: यह शब्द आकाश से उतरने वाली ‘ओस’ को सूचित करता है; इसे वर्षा से अलग रखा गया है।
- source_word: ܐܘܨܪ̈ܐ
  choice: भंडारों
  rationale: मूल के बहुवचन ‘कोष/भंडार’ और वर्षा के स्वर्गीय भंडारों की प्राचीन कल्पना को बनाए रखता है।
- source_word: ܡܛܪܐ
  choice: वर्षा
  rationale: सामान्य और स्पष्ट आधुनिक हिन्दी शब्द, जो ‘बारिश’ की अपेक्षा इस काव्यात्मक विलाप के गरिमापूर्ण स्तर के अनुकूल है।
theological_decisions:
- issue: आकाश और वर्षा के भंडारों का मानवीकरण
  choice: सीधे संबोधन और ‘भंडारों’ की छवि को ज्यों का त्यों रखा गया
  alternative: इसे केवल ‘वर्षा न होने दो’ जैसे अमूर्त कथन में बदलना
  rationale: मूल विलाप में सृष्टि को संबोधित किया गया है; रूपक को सरल करके हटाने से काव्यात्मक और धर्मवैचारिक तनाव नष्ट हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘हे आकाश’ प्रत्यक्ष संबोधन को स्पष्ट करता है, जबकि दोनों निषेधात्मक आज्ञाएँ मूल की समानांतर संरचना बनाए रखती हैं।
