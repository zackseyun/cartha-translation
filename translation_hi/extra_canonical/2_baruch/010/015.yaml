translation:
  language: hi
  text: 'भला वे पीड़ा में क्यों जनें


    और कराहते हुए क्यों दफ़न करें?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܡܢܐ ܓܝܪ
  choice: क्योंकि … क्यों
  rationale: कारणसूचक और प्रश्नवाचक बल—‘for why’—दोनों को बनाए रखा गया है।
- source_word: प्रसव-संबंधी क्रिया (पाठ-संदर्भ)
  choice: पीड़ा सहते हुए जनें
  rationale: विलाप के प्रसंग में संतान उत्पन्न करने और उससे जुड़ी वेदना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: दफ़नाने-संबंधी क्रिया (पाठ-संदर्भ)
  choice: दफ़नाएँ
  rationale: जन्म और मृत्यु के तीखे विरोध को स्पष्ट रखता है; ‘गाड़ें’ की अपेक्षा अधिक dignified और सामान्य बाइबलीय हिन्दी है।
- source_word: कराह/विलाप-संबंधी पद (पाठ-संदर्भ)
  choice: कराहते हुए
  rationale: शोक की श्रव्य और भावात्मक तीव्रता को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: जन्म, दुःख और मृत्यु के विषय में अलंकारिक प्रश्न
  choice: प्रश्न को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
  alternative: इसे संतानोत्पत्ति की निरर्थकता पर कोई सामान्य सिद्धान्त बनाकर कहना।
  rationale: यह यरूशलेम के विनाश पर काव्यात्मक विलाप है; पाठ के तनाव को किसी व्यवस्थित धार्मिक निष्कर्ष में नहीं बदला जाना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और विलापात्मक हिन्दी; दो काव्य-पंक्तियों में मूल प्रश्न की संक्षिप्त समानांतर रचना बनाए रखी गई है। उपलब्ध सिरियाई पृष्ठ-खंड में पद-विभाजन अनिश्चित है, इसलिए अंग्रेज़ी POB को नियंत्रित परामर्श-साक्ष्य मानते हुए निकटवर्ती सिरियाई विलाप-संदर्भ के साथ पाठ तैयार किया गया है।
