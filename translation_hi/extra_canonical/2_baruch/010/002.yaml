translation:
  language: hi
  text: “यिर्मयाह से कहो कि वह जाकर निर्वासन में ले जाए जा रहे लोगों के साथ बाबेल तक जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܡܝܐ
  choice: यिर्मयाह
  rationale: व्यक्ति के नाम का प्रचलित आधुनिक हिन्दी बाइबलीय रूप।
- source_word: ܥܡܐ
  choice: लोगों
  rationale: सीरियाई में सामान्यतः ‘लोग/प्रजा’; यहाँ यरूशलेम से निर्वासित किए जा रहे समुदाय का संदर्भ है।
- source_word: captivity / contextual exile language
  choice: निर्वासन में ले जाए जा रहे
  rationale: ‘बँधुआई’ की अपेक्षा आधुनिक पाठक के लिए अधिक स्वाभाविक है और बंदी बनाकर देश से ले जाए जाने का भाव स्पष्ट करता है।
- source_word: Babylon
  choice: बाबेल
  rationale: स्थान के लिए प्रचलित हिन्दी बाइबलीय नाम।
