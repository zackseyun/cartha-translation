translation:
  language: hi
  text: और मैंने अपने भाई यिर्मयाह से वैसा ही कहा जैसा प्रभु ने मुझे आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪܬ ܠܐܪܡܝܐ
  choice: और मैंने यिर्मयाह से ... कहा
  rationale: ܐܡܪ का सामान्य अर्थ ‘कहना’ है और ܠ व्यक्ति को संबोधित करने का संकेत देता है। हिंदी में विभक्त कथन को स्वाभाविक बनाने के लिए कर्मवाचक अंश बीच में रखा गया है।
- source_word: ܐܚܝ
  choice: अपने भाई
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय सहित इस शब्द का सीधा अर्थ ‘मेरा भाई’ है; हिंदी कथन में ‘अपने भाई’ अधिक स्वाभाविक है।
- source_word: ܕܦܩܕܢܝ ܡܪܝܐ
  choice: जिसकी आज्ञा प्रभु ने मुझे दी थी
  rationale: ܦܩܕ का अर्थ ‘आज्ञा देना’ है, -ܢܝ ‘मुझे’ को सूचित करता है, और ܡܪܝܐ को परंपरागत एवं संदर्भानुकूल रूप से ‘प्रभु’ किया गया है। संबंधसूचक ܕ को ‘वह... जिसकी’ से व्यक्त किया गया है।
theological_decisions:
- issue: ܡܪܝܐ का हिंदी रूप
  choice: प्रभु
  alternative: याहवे
  rationale: सिरिएक पाठ में सामान्य सम्मानसूचक/दैवी पद ܡܪܝܐ है, न कि इस स्थान पर स्पष्ट रूप से लिखा हुआ कोई विशिष्ट हिब्रू नाम; इसलिए पाठ से अधिक विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। स्रोत के वाक्य-संबंध को बनाए रखते हुए हिंदी में स्वाभाविक पदक्रम अपनाया गया है।
