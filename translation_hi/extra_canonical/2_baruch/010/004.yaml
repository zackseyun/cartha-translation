    ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ܂

    ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ ܚܙ

    ܠܢ܂ ܕܚ̈ܙܝܢܢ ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ܂

    ܘܡܕܡ ܕܓܕܫܗ ܠܐܘܪܫܠܡ܂

    ܐܩܪܐ ܠܣܝܪ̈ܝܢܘܣ ܡܢ

