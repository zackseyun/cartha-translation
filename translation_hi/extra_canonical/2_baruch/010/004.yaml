    ܕܦܩܕܢܝ ܡܪܝܐ܂ ܘܗܘ

    ܕܝܢ ܐܙܠ ܥܡ ܥܡܐ܂

    ܐܢܐ ܕܝܢ ܒܪܘܟ ܐܦܩܬ

    ܐܢܘܢ܂ ܘܝܬܒܬ ܩܕܡ

    ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ ܘܐܠܝܬ

