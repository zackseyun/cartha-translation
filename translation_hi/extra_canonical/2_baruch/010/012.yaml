base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/012.yaml
  text: 'And you, sun, hold back the light of your rays;

    and you, moon, extinguish the abundance of your light.

    For why should light rise again,

    where the light of Zion has been darkened?'
translation:
  language: hi
  text: 'हे सूर्य, अपनी किरणों का प्रकाश रोक ले;

    और हे चंद्रमा, अपने प्रचुर प्रकाश को बुझा दे।

    क्योंकि जहाँ सिय्योन का प्रकाश अँधेरा कर दिया गया है,

    वहाँ प्रकाश फिर क्यों उदय हो?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܫܐ
  choice: सूर्य
  rationale: यह सीरियाई शब्द स्पष्ट रूप से ‘सूर्य’ को दर्शाता है; संबोधन को हिन्दी में ‘हे सूर्य’ से व्यक्त किया गया है।
- source_word: ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ
  choice: अपनी किरणों का प्रकाश
  rationale: वाक्यांश में प्रकाश और किरणों दोनों की छवि सुरक्षित रखी गई है।
- source_word: ܢܘܗܪܐ
  choice: प्रकाश
  rationale: पूरे पद में प्रकाश-अंधकार के केंद्रीय काव्यात्मक विरोध को एक ही शब्दावली से बनाए रखा गया है।
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: सिय्योन के प्रकाश के अंधकारमय होने की अभिव्यक्ति
  choice: अँधेरा कर दिया गया है
  alternative: अँधेरा हो गया है
  rationale: निष्क्रिय अभिव्यक्ति मूल के तनाव को बनाए रखती है और यह तय नहीं करती कि अंधकार का कर्ता कौन है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुकूल हिन्दी; सूर्य और चंद्रमा को सीधे संबोधन तथा प्रकाश-अंधकार की समानांतर छवियों को सुरक्षित रखा गया है।
