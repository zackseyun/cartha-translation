translation:
  language: hi
  text: परन्तु तुम यहाँ सिय्योन के उजाड़ में ठहरे रहो; इन दिनों के बाद मैं तुम्हें दिखाऊँगा कि अन्तिम समयों में क्या होने वाला है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ
  choice: इन दिनों के बाद
  rationale: सिरिएक काल-वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܓܕܫ
  choice: क्या होने वाला है
  rationale: भावी घटना को दर्शाने वाले सिरिएक पदबंध का सहज अनुवाद।
- source_word: ܒܙܒܢܐ ܝܘܡ̈ܝܐ
  choice: अन्तिम समयों में
  rationale: पाठ के युगान्त-संबंधी काल-संकेत को बनाए रखते हुए अंग्रेज़ी परामर्श-पाठ के ‘latter times’ से भी संगत रखा गया है।
- source_word: desolation of Zion (English audited consultation layer; underlying Syriac passage textually unclear in supplied scan/OCR)
  choice: सिय्योन के उजाड़ में
  rationale: उपलब्ध सिरिएक प्रतिलिपि इस स्थान पर विकृत/अस्पष्ट है; अध्याय-संदर्भ और परीक्षित अंग्रेज़ी परामर्श-पाठ के आधार पर स्थान तथा दशा दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: अन्त-काल संबंधी अभिव्यक्ति
  choice: अन्तिम समयों में
  alternative: बाद के समयों में
  rationale: ‘अन्तिम’ मूल अभिव्यक्ति के युगान्तकारी तनाव को बनाए रखता है, पर किसी विशिष्ट सम्प्रदायगत अन्त-काल-व्यवस्था को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आज्ञार्थक वाक्य में ‘ठहरे रहो’ निरन्तर वहीं बने रहने का भाव देता है; पाठ की भविष्यसूचक गंभीरता सुरक्षित रखी गई है।
