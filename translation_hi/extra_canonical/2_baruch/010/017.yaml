    ܠܒܒܝܠ܂ ܐܢܬ ܕܝܢ ܩܘܡ

    ܗܟܝܠ ܒܚܘܫܒܝܟ ܕܢܗܘܘܢ܂

    ܘܠܐ ܡܚܘܐ ܐܢܐ ܠܟ

