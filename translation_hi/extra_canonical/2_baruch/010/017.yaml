translation:
  language: hi
  text: 'अब से सुंदरता पर गीत मत गाओ,


    और न …[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध सिरियाई पृष्ठांश यहाँ दूसरे निषेध के आरम्भ ("और न …") पर समाप्त हो जाता है। अंग्रेज़ी परामर्श-पाठ इसे “मनोहरता की चर्चा न करो” के रूप में पूरा करता है, पर उपलब्ध प्राथमिक अंश में शेष शब्द सत्यापित नहीं हैं।
    reason: भौतिक रूप से अपूर्ण प्राथमिक स्रोत के कारण लुप्त कर्म को निश्चित हिन्दी मुख्य पाठ में जोड़ने से बचते हुए अंग्रेज़ी audit trail की सूचना पारदर्शी ढंग से दी गई है।
lexical_decisions:
- source_word: ܡܢ ܗܫܐ
  choice: अब से
  rationale: यह समय-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ܠܐ ܗܘܝ ܬܙܡܪܘܢ
  choice: गीत फिर न गाओ
  rationale: ܙܡܪ का मूल अर्थ ‘गाना/गीत गाना’ है; बहुवचन निषेध को सहज हिन्दी में रखा गया है और पुनरावृत्ति का भाव ‘फिर’ से व्यक्त किया गया है।
- source_word: ܥܠ ܫܘܦܪܐ
  choice: सुंदरता के
  rationale: ܫܘܦܪܐ यहाँ ‘सुंदरता/रूप-सौंदर्य’ को सूचित करता है; शोकगीत के काव्यात्मक संदर्भ में ‘सुंदरता के गीत’ स्वाभाविक है।
- source_word: ܘܠܐ ܬܚܬܘܢ
  choice: और मनोहरता की चर्चा न करो
  rationale: उपलब्ध पृष्ठांश इस पद के बीच में कट जाता है; परामर्श-पाठ दूसरे समानांतर निषेध को ‘loveliness’ पर बोलने के रूप में सुरक्षित रखता है। इसलिए अर्थ को सहज हिन्दी में प्रस्तुत किया गया है, किंतु पाठगत अपूर्णता को पादटिप्पणी में स्पष्ट किया गया है।
