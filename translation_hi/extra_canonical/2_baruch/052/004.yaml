  text: And it shall be that, after that appointed day has passed, afterward the forms of those who are condemned will be changed, and also the glory of those who are justified.
translation:
  language: hi
  text: और ऐसा होगा कि उस ठहराए हुए दिन के बीत जाने के बाद, दोषी ठहराए गए लोगों के रूप बदल दिए जाएँगे, और धर्मी ठहराए गए लोगों की महिमा भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘ̈ܬܐ / ܕܡܘܬܐ
  choice: रूप
  rationale: यहाँ शब्द बाहरी आकृति या स्वरूप को सूचित करता है; आधुनिक हिन्दी में ‘रूप’ सहज और पर्याप्त व्यापक है।
- source_word: ܐܙܕܩܘ
  choice: धर्मी ठहराए गए
  rationale: यह न्यायिक निष्क्रिय भाव को बनाए रखता है और केवल नैतिक गुण के रूप में ‘धर्मी’ कहकर अर्थ को सीमित नहीं करता।
- source_word: ܬܫܒܘܚܬܗܘܢ
  choice: उनकी महिमा
  rationale: स्रोत के ‘महिमा/गौरव’ संबंधी अर्थ को धार्मिक और साहित्यिक गरिमा के साथ व्यक्त करता है।
- source_word: ܗܘ ܝܘܡܐ
  choice: वह ठहराया हुआ दिन
  rationale: प्रसंग में संकेत किसी निश्चित, पूर्वनिर्धारित अवसर की ओर है; यह अनुवाद अंग्रेज़ी परामर्श-पाठ के ‘appointed day’ से भी मेल खाता है।
theological_decisions:
- issue: दोषी और धर्मी ठहराने वाले कर्ता की पहचान
  choice: निष्क्रिय वाक्य-विन्यास—‘दोषी ठहराए गए’ और ‘धर्मी ठहराए गए’
  alternative: ‘जिन्हें परमेश्वर ने दोषी/धर्मी ठहराया’
  rationale: स्रोत कर्ता को स्पष्ट रूप से नहीं बताता; इसलिए परमेश्वर को नामित करके निहित अर्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: रूप और महिमा के परिवर्तन का संबंध
  choice: ‘बदल दिए जाएँगे’ को पहले पद में रखकर अंतिम ‘भी’ से महिमा पर उसका समान रूप से लागू होना व्यक्त किया
  alternative: दोनों के लिए अलग-अलग क्रिया दोहराना
  rationale: इससे स्रोत का संक्षिप्त समानांतर विन्यास बना रहता है और यह स्पष्ट होता है कि दोषियों के रूप तथा धर्मी ठहराए गए लोगों की महिमा—दोनों में परिवर्तन होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘ठहराए हुए दिन’, ‘दोषी ठहराए गए’ और ‘धर्मी ठहराए गए’ स्रोत के न्यायिक तथा भावी संदर्भ को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखते हैं।
