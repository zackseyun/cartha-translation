  yaml_path: translation/extra_canonical/2_baruch/052/012.yaml
  text: Wonders will appear to them in their time. For they will see that world which is now invisible to them, and that time which is now hidden from them.
translation:
  language: hi
  text: अपने-अपने समय पर उन्हें अद्भुत बातें दिखाई देंगी। क्योंकि वे उस संसार को देखेंगे, जो अभी उनसे अदृश्य है, और उस समय को, जो अभी उनसे छिपा हुआ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अंतिम वाक्यांश का प्राप्त सिरिएक पाठ कठिन है। उसका शाब्दिक अर्थ लगभग ‘जो उनके लिए सुखद था’ हो सकता है; ‘जो अभी उनसे छिपा हुआ है’ प्रसंग और समानांतर वाक्य-रचना पर आधारित अर्थ है।
    reason: प्राप्त सिरिएक पाठ की वास्तविक कठिनाई को सुरक्षित रखते हुए अंग्रेज़ी POB के प्रसंगानुकूल अर्थ का आधार स्पष्ट करना।
lexical_decisions:
- source_word: ܬܡܝ̈ܗܬܐ
  choice: अद्भुत बातें
  rationale: शब्द का अर्थ विस्मयकारी या अद्भुत वस्तुएँ/घटनाएँ है; यह अनिवार्य रूप से केवल अलौकिक ‘चमत्कारों’ तक सीमित नहीं है।
- source_word: ܢܬܚܙܝܢ ܠܗܘܢ
  choice: उन्हें … दिखाई देंगी
  rationale: एत्पעל रूप का भाव ‘उनके सामने प्रकट होंगी/उन्हें दिखाई देंगी’ है; हिंदी में स्वाभाविक दृश्यात्मक अर्थ रखा गया है।
- source_word: ܒܙܒܢܗܝܢ
  choice: उनका समय आने पर
  rationale: शाब्दिक बहुवचन ‘उनके समयों में’ हिंदी में अस्वाभाविक है; प्रसंगानुसार प्रत्येक के नियत समय का भाव व्यक्त किया गया है।
- source_word: ܗ̇ܘ ܥܠܡܐ ܕܠܐ ܡܬܚܙܐ ܠܗܘܢ
  choice: उस संसार को … जो अभी उन्हें दिखाई नहीं देता
  rationale: ‘वह संसार जो उन्हें दिखाई नहीं देता’ को सहज आधुनिक हिंदी में रखा गया; ‘अभी’ वर्तमान अदृश्यता और भावी दर्शन का प्रसंग स्पष्ट करता है।
- source_word: ܚܙܝܢ
  choice: देखेंगे
  rationale: स्रोत में रूप वर्तमान ‘देखते हैं’ है, पर निकटवर्ती भविष्यकालीन क्रियाओं और युगांतकारी प्रसंग के कारण हिंदी में भविष्यकाल स्वाभाविक है।
theological_decisions:
- issue: ‘उस संसार’ की प्रकृति
  choice: सामान्य अभिव्यक्ति ‘उस संसार’ बनाए रखी
  alternative: इसे सीधे ‘स्वर्ग’ या ‘आने वाला संसार’ कहना
  rationale: स्रोत केवल ‘उस संसार’ कहता है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को अनावश्यक रूप से नहीं जोड़ा गया।
- issue: अंतिम वाक्यांश का पाठ
  choice: प्रसंगानुकूल अर्थ ‘जो अभी उनसे छिपा है’ मुख्य पाठ में रखा
  alternative: प्राप्त सिरिएक का अत्यंत शाब्दिक, किंतु कठिन अर्थ ‘जो उनसे सुखद था’
  rationale: प्राप्त पाठ का अंतिम विशेषण पाठगत रूप से कठिन और संदर्भ में असंगत है; प्राचीन आशय तथा समानांतर वाक्य-रचना ‘अदृश्य संसार/छिपा समय’ की ओर संकेत करती है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। युगांतकारी दृश्य को स्पष्ट रखते हुए स्रोत की पाठगत कठिनाई को दबाया नहीं गया है।
