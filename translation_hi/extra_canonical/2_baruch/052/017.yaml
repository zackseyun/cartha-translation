translation:
  language: hi
  text: तो फिर, लोगों ने किस कारण अपना जीवन खो दिया, और पृथ्वी पर रहनेवालों ने किसके बदले अपने प्राण का विनिमय किया?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܡܢܐ
  choice: किस कारण
  rationale: प्रश्नवाचक पद का यहाँ साधन या कारण—दोनों अर्थ संभव हैं; स्वाभाविक हिन्दी में प्रसंगानुसार ‘किस कारण’ चुना गया है।
- source_word: ܐܘܒܕܘ
  choice: खो दिया
  rationale: क्रिया का मूल भाव नष्ट करने या गँवा देने का है; जीवन के साथ ‘खो दिया’ सहज और अर्थनिष्ठ है।
- source_word: ܚܝܝ̈ܗܘܢ
  choice: अपना जीवन
  rationale: बहुवचन-स्वामित्व वाले ‘उनका जीवन’ को सामान्य मानवीय प्रश्न में स्वाभाविक हिन्दी ‘अपना जीवन’ के रूप में व्यक्त किया गया है।
- source_word: soul (consultation layer; continuation not fully visible in supplied Syriac excerpt)
  choice: अपना प्राण
  rationale: ‘जीवन’ से शब्दगत भेद बनाए रखते हुए व्यक्ति के जीवित प्राण/स्व को व्यक्त करता है; ‘आत्मा’ चुनने से अनावश्यक दार्शनिक विशिष्टीकरण हो सकता था।
theological_decisions:
- issue: ‘जीवन’ और ‘प्राण’ के बीच संबंध
  choice: दो अलग हिन्दी शब्द रखे गए हैं
  alternative: दोनों स्थानों पर ‘जीवन’ अथवा दूसरे स्थान पर ‘आत्मा’
  rationale: वाक्य की समानांतर संरचना में संभावित स्रोत-भेद सुरक्षित रहता है और मनुष्य की प्रकृति के बारे में कोई संप्रदायगत निष्कर्ष आरोपित नहीं होता।
- issue: हानि और विनिमय की नैतिक अभिव्यक्ति
  choice: प्रश्न को खुला रखा गया है
  alternative: किसी विशेष पाप, लाभ या सांसारिक वस्तु को स्पष्ट उत्तर मान लेना
  rationale: पद स्वयं प्रश्न करता है; अनुवाद उसमें ऐसा उत्तर नहीं जोड़ता जो उपलब्ध पाठ में नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रश्नात्मक, गंभीर और सर्वसुलभ शैली। ‘तो फिर’ से ܗܟܝܠ का निष्कर्षसूचक बल व्यक्त किया गया है। उपलब्ध सिरिएक अंश पृष्ठ के अंत में कटता है, इसलिए दूसरे खंड की पुष्टि अंग्रेज़ी POB परामर्श-पाठ से की गई, पर भाषा को उसके संभावित समानांतर ढाँचे के अनुरूप रखा गया है।
