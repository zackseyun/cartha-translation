translation:
  language: hi
  text: परन्तु वे विशेष रूप से विचलित होंगे—जिन्होंने मेरी व्यवस्थाओं को अस्वीकार किया और अपने कान बन्द कर लिए, ताकि वे बुद्धि को न सुनें और समझ को ग्रहण न करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܙܝܥܘܢ
  choice: विचलित होंगे
  rationale: मूल क्रिया का अर्थ हिल उठना, व्याकुल या विचलित होना है; यह ‘लज्जित’ या ‘भ्रमित’ जैसे अधिक विशिष्ट अर्थ को अनावश्यक रूप से नहीं थोपता।
- source_word: ܢܡܘܣܝ̈
  choice: मेरी व्यवस्थाओं
  rationale: सिरियाई रूप प्रथम पुरुष स्वामित्व के साथ बहुवचन है; इसलिए अंग्रेज़ी परामर्श-पाठ के एकवचन ‘the law’ के बजाय मूल का बहुवचन रखा गया है।
- source_word: ܐܣܠܝܘ
  choice: तुच्छ जाना
  rationale: क्रिया में ठुकराने के साथ अवमानना का भाव है; ‘तुच्छ जाना’ दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܚܟܡܬܐ
  choice: बुद्धि की बात
  rationale: शाब्दिक अर्थ ‘बुद्धि’ है; ‘सुनना’ क्रिया के साथ सहज हिन्दी के लिए ‘बुद्धि की बात सुनें’ कहा गया है, बिना आशय बदले।
- source_word: ܣܘܟܠܐ
  choice: समझ
  rationale: यहाँ बोध या समझ ग्रहण करने का अर्थ है; आधुनिक हिन्दी में ‘समझ’ सबसे स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘व्यवस्था’ का एकवचन या बहुवचन
  choice: मेरी व्यवस्थाओं
  alternative: मेरी व्यवस्था
  rationale: मूल सिरियाई पाठ बहुवचन है। इसे किसी एक संहिताबद्ध धार्मिक व्यवस्था तक सीमित न करके वास्तविक व्याकरणिक रूप सुरक्षित रखा गया है।
- issue: दोषियों की भावी दशा का स्वरूप
  choice: विचलित होंगे
  alternative: लज्जित होंगे / घबरा जाएँगे
  rationale: मूल शब्द व्यापक रूप से हिलने या व्याकुल होने को दर्शाता है; अधिक विशिष्ट मनोवैज्ञानिक या दण्डात्मक अर्थ जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की चेतावनीपूर्ण लय बनाए रखने के लिए डैश का प्रयोग हुआ है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
