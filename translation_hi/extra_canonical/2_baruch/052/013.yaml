  naturalness: ‘वह समय फिर उन्हें बूढ़ा नहीं करेगा’ स्वाभाविक है। ‘महिमा का सौंदर्य’ की अपेक्षा ‘महान महिमा का सौंदर्य’ मूल के दोहरे भाव को हिन्दी में अधिक स्पष्ट करता है। ‘खोल दिए जाएँगे’ के बदले ‘फैला दिए जाएँगे’ विस्तारों के लिए अधिक निकट है।
  terminology: ‘परादीस’ को बनाए रखा गया है ताकि ܦܪܕܝܣܐ का विशिष्ट शब्द न खोए। ‘सिंहासन’ और ‘स्वर्गदूत’ स्थापित, समझने योग्य धार्मिक शब्द हैं। ‘अधिकार के अधीन’ हटाकर ‘नियंत्रण में’ किया गया है, क्योंकि यह पाठ में निहित रोके/बाँधे जाने के भाव को बिना अनावश्यक अमूर्तता के व्यक्त करता है।
