base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/013.yaml
  text: And that time will no longer grow old for them. For the expanses of Paradise will be spread out before them, and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the companies of the angels, who are now restrained by my word so that they are not seen, and are kept by command to stand in their places until their appointed coming.
translation:
  language: hi
  text: और वह समय फिर उन्हें बूढ़ा नहीं करेगा। क्योंकि परादीस के विस्तृत क्षेत्र उनके सामने फैला दिए जाएँगे, और सिंहासन के नीचे रहनेवाले जीवित प्राणियों की महान महिमा का सौंदर्य उन्हें दिखाया जाएगा। स्वर्गदूतों के सभी समूह भी उन्हें दिखाए जाएँगे, जो अभी इस प्रकार नियंत्रण में रखे गए हैं कि दिखाई न दें, और जिन्हें आज्ञा से अपने-अपने स्थानों पर खड़े रहने के लिए रखा गया है, जब तक उनके नियत आगमन का समय न आ जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: समय
  rationale: यह सामान्य काल-सूचक संज्ञा है; प्रसंग में आने वाले युग का समय अभिप्रेत है।
- source_word: ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ
  choice: स्वर्ग के विस्तार
  rationale: ܦܠܝ̈ܛܐ में फैले हुए क्षेत्र या विस्तार का भाव है; ‘स्वर्ग के विस्तार’ मूल बिंब को सहज हिन्दी में रखता है।
- source_word: ܫܘܦܪܐ ܕܪܒܘܬܐ
  choice: महिमा का सौंदर्य
  rationale: सौंदर्य और महानता/महिमा, दोनों संज्ञात्मक तत्वों को बनाए रखा गया है।
- source_word: ܚܝ̈ܐ
  choice: जीवित प्राणी
  rationale: बहुवचन रूप यहाँ स्वर्गीय जीवित प्राणियों की ओर संकेत करता है; केवल ‘जीवन’ कहने से दृश्य प्राणियों का आशय दब सकता है।
- source_word: ܫܒܘܥܘܗܝ ܚܒܝ̈ܫܐ ܕܡܠܐܟ̈ܐ
  choice: स्वर्गदूतों के वे समूह
  rationale: पाठ में स्वर्गदूतों के संगठित समुदायों/समूहों का बोध है; हिन्दी में ‘समूह’ स्वाभाविक और गैर-तकनीकी है।
- source_word: ܒܡܫܠܛܘ
  choice: अधिकार के अधीन
  rationale: सिरिएक पाठ सत्ता या नियंत्रण के अधीन रोके जाने का संकेत देता है; अंग्रेज़ी परामर्श-पाठ के ‘my word’ को मूल में स्पष्ट समर्थन न होने के कारण नहीं अपनाया गया।
- source_word: ܦܘܩܕܢܐ
  choice: आज्ञा
  rationale: आदेश/आज्ञा दोनों संभव हैं; दिव्य व्यवस्था के प्रसंग में ‘आज्ञा’ dignified और सामान्य है।
- source_word: ܡܕܝܢܬܗܘܢ
  choice: उनके आने का समय
  rationale: इस पाठ-स्थान का रूप कठिन या संदिग्ध है; अध्यायगत अर्थ और परामर्श-पाठ के आधार पर नियुक्त आगमन का भाव सावधानी से व्यक्त किया गया है।
theological_decisions:
- issue: जीवित प्राणियों और सिंहासन का संबंध
  choice: ‘उसके नीचे रहनेवाले जीवित प्राणी’
  alternative: ‘सिंहासन के नीचे के जीवित प्राणी’
  rationale: दिए गए सिरिएक में ‘सिंहासन’ का स्पष्ट शब्द नहीं है; अतः अंग्रेज़ी परामर्श-पाठ की स्पष्टता को सीधे मूल में नहीं जोड़ा गया। ‘उसके’ का निकटतम संदर्भ स्वर्ग है, यद्यपि वाक्यांश की संरचना कुछ अस्पष्ट रहती है।
- issue: स्वर्गदूतों को रोकने वाला माध्यम
  choice: ‘अधिकार के अधीन रोके गए हैं’
  alternative: ‘मेरे वचन से रोके गए हैं’
  rationale: सिरिएक ܒܡܫܠܛܘ सत्ता/अधिकार के भाव का समर्थन करता है, प्रथम पुरुष ‘मेरे वचन’ का नहीं; इसलिए मूल-साक्ष्य को प्राथमिकता दी गई।
- issue: अंतिम आगमन की पहचान
  choice: ‘उनके आने का समय’
  alternative: ‘उनका नियुक्त आगमन’
  rationale: पाठ कठिन है और आगमन किसका है, यह पूरी तरह स्पष्ट नहीं; हिन्दी में अस्पष्ट बहुवचन संदर्भ बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल के दीर्घ वाक्य को अर्थ-स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। अंग्रेज़ी परामर्श-पाठ से भिन्न स्थानों पर सिरिएक स्रोत को प्राथमिकता दी गई है; किसी पंथ-विशेष की पारिभाषिक व्याख्या नहीं जोड़ी गई।
