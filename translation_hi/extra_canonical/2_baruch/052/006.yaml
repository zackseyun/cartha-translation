  verdict: revise
  source_fidelity: The draft correctly renders the passive sense of ܐܙܕܩܘ as “धर्मी ठहराए गए” and preserves the planting/root image. However, “जिनका जीवन सही मार्ग पर चला” adds “सही” and recasts the source phrase ܫܘܒܠܐ ܒܚܝ̈ܝܗܘܢ more interpretively than warranted. The English POB audit trail understands this phrase as having understanding in life; “समझ-बूझ” expresses that reading without adding a moral qualification.
  naturalness: The revised wording is fluent, dignified modern Hindi. The dash appropriately indicates that this clause continues into the following verse/unit; an ellipsis is unnecessary and can suggest an omission rather than syntactic continuation.
  terminology: “धर्मी ठहराए गए,” “महिमा,” and “बुद्धि की जड़” are suitable and consistent. “समझ-बूझ” is natural Hindi for the audit trail’s “understanding” and avoids importing “सही मार्ग” into the text.
  issues:
  - severity: medium
    issue: The phrase “जिनका जीवन सही मार्ग पर चला” adds a qualifying idea not explicit in the source/audit trail.
    rationale: The supplied English audit trail has “those who had understanding in their life.” Even if ܫܘܒܠܐ can evoke a way or course, “सही” is an unmarked evaluative addition and should not be supplied.
  - severity: low
    issue: The final ellipsis is not needed after the em dash.
    rationale: The verse is syntactically incomplete because it continues into the following material. A single em dash communicates this without implying deleted words.
