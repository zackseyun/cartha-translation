  text: But the glory of those who were justified in their time, and those who had understanding in their life, and those who planted in their heart the root of wisdom—
translation:
  language: hi
  text: परन्तु जो अपने समय में धर्मी ठहराए गए, जिन्होंने अपने जीवन में समझ-बूझ रखी, और जिन्होंने अपने हृदय में बुद्धि की जड़ रोपी—उनकी महिमा
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܘܚܬܗܘܢ (tešbuḥt-hon)
  choice: उनकी महिमा
  rationale: यह शब्द महिमा, गौरव या प्रशंसा का बोध देता है। अगले वाक्य में इसके बारे में आगे कहा जाता है, इसलिए हिन्दी में अपूर्ण वाक्य-संरचना को दीर्घ डैश और त्रिबिंदु से बनाए रखा गया है।
- source_word: ܐܙܕܩܘ (ezdaqw)
  choice: धर्मी ठहराए गए
  rationale: सिरिएक का निष्क्रिय रूप केवल ‘धर्मी थे’ नहीं, बल्कि धर्मी सिद्ध या ठहराए जाने का भाव रखता है; यह अनुवाद उस व्याकरणिक और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- source_word: ܫܘܒܠܐ (šublā)
  choice: सही मार्ग पर चला
  rationale: शब्द का सामान्य अर्थ चाल-चलन, जीवन-पथ या मार्गदर्शन है। प्रसंग में ‘जिनका जीवन सही मार्ग पर चला’ स्वाभाविक हिन्दी है और मूल के जीवन-आचरण संबंधी भाव को बनाए रखता है; इसे ‘समझ’ कहना निकटवर्ती ܣܘܟܠܐ के अर्थ को यहाँ आरोपित कर सकता है।
- source_word: ܢܨܒܘ ... ܥܩܪܐ ܕܚܟܡܬܐ (nṣabw ... ‘eqqārā d-ḥekmtā)
  choice: बुद्धि की जड़ रोपी
  rationale: मूल के रोपने और जड़ के रूपक को सीधे तथा स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ܐܙܕܩܘ में धार्मिकता का स्वरूप
  choice: धर्मी ठहराए गए
  alternative: धर्मी थे / सही सिद्ध हुए
  rationale: निष्क्रिय क्रिया यह खुला छोड़ती है कि उन्हें किसके द्वारा या किस आधार पर धर्मी ठहराया गया। हिन्दी में कर्ता या धर्मसैद्धांतिक प्रक्रिया जोड़कर इस अस्पष्टता को हल नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद मूल में अगले कथन की ओर बढ़ता हुआ अपूर्ण है; इसलिए अन्त में दीर्घ डैश और त्रिबिंदु रखे गए हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
