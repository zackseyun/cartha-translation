  text: while they themselves are reckoned among the heaps of sins, and the evil of their forms wastes away still more. For first they see, and afterward they go away to be tormented.
translation:
  language: hi
  text: जबकि वे स्वयं पापों के ढेर में गिने जाते हैं, और उनके रूपों की बुराई और भी अधिक मिटती जाती है। क्योंकि पहले वे देखते हैं, और उसके बाद यातना भोगने चले जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܘܡܥܐ ܕܚ̈ܛܗܐ
  choice: पापों का ढेर
  rationale: ܓܘܡܥܐ किसी एकत्र राशि या ढेर को दर्शाता है; हिन्दी में यह दुष्टों को पापों के संचय में गिने जाने की कठोर छवि बनाए रखता है।
- source_word: ܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
  choice: अपने रूपों की बुराई
  rationale: शाब्दिक अर्थ ‘रूपों की बुराई’ है। ‘कुरूपता’ अधिक सहज होता, पर वह नैतिक और दृश्य दोनों अर्थों में निहित अस्पष्टता को सीमित कर सकता है।
- source_word: ܢܫܘܚܘܢ
  choice: क्षीण होते जाते हैं
  rationale: क्रिया के बहुवचन कर्ता को बनाए रखते हुए नष्ट या गलते जाने का भाव व्यक्त किया गया है; इसे ‘बुराई’ का एकवचन कर्ता नहीं माना गया।
- source_word: ܢܫܬܢܩܘܢ
  choice: यातना भोगने
  rationale: यह क्रिया यातना या दंड सहने का स्पष्ट भाव रखती है; ‘यातना भोगना’ आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
theological_decisions:
- issue: रूपों की बुराई और क्षीण होने के बीच व्याकरणिक संबंध
  choice: उन लोगों को बहुवचन कर्ता मानकर कहा गया कि वे अपने रूपों की बुराई के कारण क्षीण होते जाते हैं।
  alternative: अंग्रेज़ी परामर्श-पाठ की तरह ‘उनके रूपों की बुराई और भी मिटती जाती है।’
  rationale: सिरिएक में ܒܝܫܬܐ पर लगा ܒـ कारण/माध्यम का अर्थ दे सकता है और ܢܫܘܚܘܢ बहुवचन क्रिया है; इसलिए लोगों को कर्ता मानना मूल व्याकरण से अधिक संगत है।
- issue: ‘पहले वे देखते हैं’ का कर्म
  choice: कर्म को अनिर्दिष्ट रखा गया है।
  alternative: वे धर्मियों की महिमा या अपने दंड को देखते हैं।
  rationale: इस पद में देखने की वस्तु स्पष्ट नहीं कही गई; संदर्भ से कोई विशेष वस्तु जोड़ना व्याख्यात्मक निष्कर्ष होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। सिरिएक की संक्षिप्तता तथा ‘देखते हैं’ के अनिर्दिष्ट कर्म को बनाए रखा गया है।
