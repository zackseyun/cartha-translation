base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/018.yaml
  text: For they chose for themselves this present time, which cannot pass apart from anguish, and they chose for themselves that time whose outcomes are full of groanings and evils; and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they might not come to the honor of which I told you before.
translation:
  language: hi
  text: क्योंकि उन्होंने अपने लिए इस वर्तमान समय को चुना, जो क्लेश के बिना बीत नहीं सकता; और उन्होंने अपने लिए उस समय को चुना, जिसके परिणाम कराहों और बुराइयों से भरे हैं। उन्होंने उस संसार को ठुकरा दिया, जो उसमें आनेवालों को बूढ़ा नहीं करता[a], और महिमा के समय को भी ठुकरा दिया, ताकि वे उस सम्मान को न पाएँ, जिसके विषय में मैंने तुम्हें पहले बताया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसमें आनेवालों के लिए बूढ़ा नहीं होता।”
    reason: क्रिया के सकर्मक अर्थ को मुख्य पाठ में रखा गया है, जबकि पूर्ववर्ती अकर्मक समझ को वैकल्पिक रूप में दर्ज किया गया है।
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: इस प्रसंग में यह वर्तमान या आनेवाले जगत/संसार को सूचित करता है; सामान्य हिन्दी पाठक के लिए ‘संसार’ स्वाभाविक है।
- source_word: ܐܘܠܨܢܐ
  choice: क्लेश
  rationale: शब्द संकट, दबाव और दुःख का भाव रखता है; ‘क्लेश’ गरिमापूर्ण और व्यापक हिन्दी समतुल्य है।
- source_word: ܐܝܩܪܐ
  choice: सम्मान
  rationale: मूल में आदर, प्रतिष्ठा या महिमा का अर्थ संभव है; यहाँ ‘महिमा के समय’ से भेद बनाए रखने के लिए ‘सम्मान’ चुना गया है।
- source_word: ܡܣܐܒ
  choice: बूढ़ा नहीं करता
  rationale: क्रिया का रूप सकर्मक अर्थ देता है—यह संसार उसमें आनेवालों को वृद्ध नहीं बनाता; इसलिए केवल ‘बूढ़ा नहीं होता’ कहना मूल की दिशा खो देगा।
theological_decisions:
- issue: आनेवाले संसार और वृद्धावस्था का संबंध
  choice: ‘जो उसमें आनेवालों को बूढ़ा नहीं करता’
  alternative: ‘जो उसमें आनेवालों के लिए बूढ़ा नहीं होता’
  rationale: स्रोत की सकर्मक क्रिया उस संसार के निवासियों पर प्रभाव न पड़ने की बात कहती है। वैकल्पिक पाठ व्याकरणतः कम संभावित है, पर परंपरागत अनुवाद-अंतर को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘सम्मान’ और ‘महिमा’ का भेद
  choice: ‘महिमा का समय’ और ‘वह सम्मान’
  alternative: दोनों स्थानों पर ‘महिमा’
  rationale: प्रसंग में संबद्ध किंतु अलग अभिव्यक्तियों को एक ही धार्मिक पारिभाषिक शब्द में विलीन न करके मूल का अर्थगत तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास रखा गया है। समानांतर वाक्य-रचना—‘चुना’ और ‘ठुकरा दिया’—मूल के नैतिक विरोध को स्पष्ट करती है। ‘कराहों और बुराइयों’ में बहुवचन भाव सुरक्षित रखा गया है।
