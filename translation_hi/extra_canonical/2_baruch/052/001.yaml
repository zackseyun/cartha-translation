base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/001.yaml
  text: For the earth will then certainly give back the dead whom it now receives in order to preserve them, changing nothing in their form; but as it received them, so it will restore them, and as I delivered them to it, so it will raise them.
translation:
  language: hi
  text: क्योंकि तब पृथ्वी निश्चय ही उन मरे हुओं को लौटा देगी, जिन्हें वह अब सुरक्षित रखने के लिए ग्रहण करती है।[a] वह उनके स्वरूप में कुछ भी परिवर्तन नहीं करेगी; बल्कि जिस प्रकार उसने उन्हें ग्रहण किया था, उसी प्रकार वह उन्हें वापस करेगी, और जिस प्रकार मैंने उन्हें उसके सुपुर्द किया था, उसी प्रकार वह उन्हें उठा खड़ा करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पाठ-समझ के अनुसार: “जिन्हें वह अब जैसे वे हैं, वैसे ही ग्रहण करती है।”'
    reason: उपलब्ध पाठ-परंपरा और पहले के पाठांकन में प्रयोजनवाचक ‘सुरक्षित रखने के लिए’ के स्थान पर ऐसी व्याख्या संभव हुई है; मुख्य पाठ नियंत्रक स्रोत-साक्ष्य का अनुसरण करता है।
lexical_decisions:
- source_word: ܡܦܩܢܗ / ܡܦܩܐ / ܡܩܝܡܐ
  choice: लौटा देगी / वापस करेगी / फिर खड़ा करेगी
  rationale: इन संबद्ध क्रियाओं में पृथ्वी द्वारा मृतकों को बाहर लौटाने, जैसा पाया था वैसा वापस करने, और पुनरुत्थान में खड़ा करने—तीनों भाव हैं। हिंदी में अलग किंतु परस्पर जुड़े पद इस क्रम को सुरक्षित रखते हैं।
- source_word: ܕܬܢܛܪ ܐܢܘܢ
  choice: उन्हें अब सुरक्षित रखने के लिए
  rationale: नियंत्रक पाठ-साक्ष्य में यह प्रयोजनवाचक वाक्यांश पृथ्वी को मृतकों की रखवाली करने वाले भंडार के रूप में प्रस्तुत करता है।
- source_word: ܒܨܘܪܬܗܘܢ
  choice: उनके स्वरूप में
  rationale: ‘स्वरूप’ पहचान और रूप की निरंतरता को व्यक्त करता है, पर शरीर की भौतिक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ܐܫܠܡܬ ܐܢܘܢ ܠܗ̇
  choice: मैंने उन्हें उसके सुपुर्द किया था
  rationale: यह अभिव्यक्ति मृतकों को पृथ्वी को सौंपे जाने का भाव स्वाभाविक और गरिमापूर्ण हिंदी में बनाए रखती है।
theological_decisions:
- issue: वर्तमान मृतक और पुनरुत्थित व्यक्ति के बीच निरंतरता
  choice: पृथ्वी मृतकों को उसी स्वरूप में वापस करती है जिसमें उसने उन्हें ग्रहण किया था, और फिर उन्हें खड़ा करती है।
  alternative: ऐसा पुनरुत्थान जिसमें व्यक्ति के स्वरूप या पहचान की कोई निरंतरता न हो।
  rationale: ग्रहण करने, स्वरूप न बदलने, वापस करने और फिर खड़ा करने की पुनरावृत्ति पहचान की वास्तविक निरंतरता पर बल देती है, पर पुनरुत्थान की यांत्रिकी को परिभाषित नहीं करती।
- issue: ‘फिर खड़ा करेगी’ का पुनरुत्थान-संबंधी बल
  choice: मूल क्रिया के प्रत्यक्ष ‘खड़ा करने’ वाले चित्र को रखा गया है।
  alternative: ‘जिला उठाएगी’ कहकर पुनरुत्थान का अर्थ अधिक स्पष्ट करना।
  rationale: ‘फिर खड़ा करेगी’ पुनरुत्थान का संकेत देता है और साथ ही स्रोत की ठोस रूपकात्मक भाषा को अधिक निकटता से सुरक्षित रखता है।
