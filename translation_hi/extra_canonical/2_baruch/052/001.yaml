  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और वाचनयोग्य रखी गई है। ‘मरे हुए’, ‘स्वरूप’, ‘सुपुर्द’ और ‘फिर खड़ा करेगी’ साधारण पाठक के लिए बोधगम्य रहते हुए अपोकैलिप्टिक और पुनरुत्थान-संबंधी गंभीरता बनाए रखते हैं।
