translation:
  language: hi
  text: तब धर्मी स्वर्गदूतों से भी अधिक उत्कृष्ट रूप में दिखाई देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܬܚܙܝܐ
  choice: फिर ... दिखाई देंगे
  rationale: सिरिएक रूप का मूल भाव ‘दिखाई देना/प्रकट होना’ है। हिन्दी में संदर्भित बहुवचन ‘धर्मी’ के अनुसार वाक्य को स्वाभाविक बनाया गया है।
- source_word: ܒܕܡܘܬܐ
  choice: ऐसे स्वरूप में
  rationale: ܕܡܘܬܐ यहाँ पुनरुत्थान में दिखाई देने वाले रूप या समानता को सूचित करता है; ‘स्वरूप’ इस संदर्भ में सहज और पर्याप्त रूप से व्यापक है।
- source_word: ܝܬܝܪ ܡܢ ܕܡܠܐܟ̈ܐ
  choice: स्वर्गदूतों के स्वरूप से भी अधिक महिमामय
  rationale: शाब्दिक तुलना ‘स्वर्गदूतों से अधिक’ है। पूर्ववर्ती ‘स्वरूप’ को तुलना में स्पष्ट करके हिन्दी की संभावित अस्पष्टता दूर की गई है, जबकि श्रेष्ठता का भाव सुरक्षित रखा गया है।
theological_decisions:
- issue: धर्मियों और स्वर्गदूतों के बीच तुलना का आशय
  choice: तुलना उनके प्रकट स्वरूप की महिमा तक सीमित रखी गई है।
  alternative: धर्मियों की समग्र श्रेष्ठता स्वर्गदूतों से अधिक होगी।
  rationale: सिरिएक पाठ में निकटतम संज्ञा ܕܡܘܬܐ (‘स्वरूप’) है; इसलिए किसी व्यापक पदानुक्रम या स्वभावगत श्रेष्ठता का दावा जोड़ना उचित नहीं।
- issue: वाक्य का व्यक्त कर्ता
  choice: संदर्भ के आधार पर ‘धर्मी’ स्पष्ट रूप से जोड़ा गया है।
  alternative: ‘वह फिर ऐसे स्वरूप में दिखाई देगा...’ या निर्लिप्त रचना।
  rationale: सिरिएक में कर्ता व्याकरण और निकटवर्ती संदर्भ से समझा जाता है; प्रकाशित हिन्दी पद में ‘धर्मी’ जोड़ने से आशय स्पष्ट होता है और अंग्रेज़ी परामर्श-पाठ से भी मेल रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली। ‘उत्कृष्टता’ की अमूर्त अभिव्यक्ति के बजाय स्रोत के ‘दिखाई देने’ और ‘स्वरूप’ संबंधी ठोस बिंब को सुरक्षित रखा गया है।
