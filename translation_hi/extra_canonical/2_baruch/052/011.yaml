translation:
  language: hi
  text: परन्तु जो अपने कामों के द्वारा छुड़ाए गए, और जिनके लिए व्यवस्था आशा थी, समझ प्रत्याशा थी, बुद्धि भरोसा था और शुद्धता मुकुट थी[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पूर्व पाठ-रूप में: “और धीरज सामर्थ्य था।”'
    reason: यह टिप्पणी अंग्रेज़ी POB लेखा-परीक्षण में दर्ज पूर्व पाठ-रूप को सुरक्षित रखती है, पर इसे स्रोत-समर्थित वैकल्पिक अनुवाद के रूप में प्रस्तुत नहीं करती।
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: बचाए गए
  rationale: यह क्रिया छुड़ाए जाने या उद्धार पाने का भाव रखती है; सामान्य पाठक के लिए ‘बचाए गए’ स्वाभाविक और स्पष्ट है।
- source_word: ܒܥ̈ܒܕܝܗܘܢ
  choice: अपने कामों के द्वारा
  rationale: ܥܒܕܐ का सीधा अर्थ काम या कार्य है; वाक्य की धर्मवैचारिक तीक्ष्णता को नरम किए बिना करण का भाव रखा गया है।
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: यहाँ ईश्वरीय विधि के अर्थ में प्रचलित और गरिमापूर्ण हिन्दी बाइबलीय पद चुना गया है।
- source_word: ܣܒܪܐ
  choice: आशा
  rationale: शब्द आशा या अपेक्षा का अर्थ देता है; समानांतर पदों में इसे ‘आशा’ रखना सर्वाधिक स्वाभाविक है।
- source_word: ܣܘܟܠܐ
  choice: समझ
  rationale: बोध या विवेक के लिए सहज आधुनिक हिन्दी।
- source_word: ܚܟܡܬܐ
  choice: बुद्धि
  rationale: ज्ञानपूर्ण विवेक के अर्थ को संक्षिप्त और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: ܕܟܝܘܬܐ / ܟܠܝܠܐ
  choice: शुद्धता / मुकुट
  rationale: प्राप्त संशोधित पाठ-साक्ष्य के अनुसार पद का अर्थ ‘शुद्धता मुकुट’ है; इसे रूपक सहित ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: कामों के द्वारा बचाए जाने का कथन
  choice: ‘अपने कामों के द्वारा बचाए गए’ का सीधा अनुवाद
  alternative: ‘जिनके कामों ने उनकी धार्मिकता प्रमाणित की’
  rationale: स्रोत का कथन धर्मवैचारिक तनाव रखता है; उसे किसी विशेष उद्धार-सिद्धांत के अनुरूप पुनर्व्याख्यायित नहीं किया गया।
- issue: अमूर्त संज्ञाओं की क्रमिक समानता
  choice: व्यवस्था–आशा, समझ–प्रतीक्षा, बुद्धि–भरोसा, शुद्धता–मुकुट
  alternative: सभी संबंधों को क्रियात्मक व्याख्या में बदलना
  rationale: स्रोत की काव्यात्मक और धर्मवैचारिक समानांतर संरचना को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। मूल की संक्षिप्त, संज्ञात्मक समानांतर रचना सुरक्षित है। पद यहाँ अगले वाक्य में आगे बढ़ता प्रतीत होता है, इसलिए अंत में अल्पविराम रखा गया है।
