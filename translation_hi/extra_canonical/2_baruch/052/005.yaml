translation:
  language: hi
  text: क्योंकि जो लोग अब दुष्ट हैं, उनका स्वरूप अभी की अपेक्षा और भी विकृत हो जाएगा, जब वे यातना सहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: उनका रूप
  rationale: यह शब्द यहाँ उनके दिखाई देने वाले रूप या आकृति को सूचित करता है; ‘रूप’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस अर्थ को बनाए रखता है।
- source_word: ܕܗܘܐ ܩܕܡܝܟܝܢ
  choice: जो लोग अब दुष्टता करते हैं
  rationale: प्रसंग उन वर्तमान दुष्ट आचरण करने वालों की बात करता है; क्रियात्मक अनुवाद हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ܒܝܫ ܡܢ ܡܐ ܕܐܝܬܝܗ̇
  choice: अभी से भी अधिक बुरा हो जाएगा
  rationale: तुलनात्मक बल को सुरक्षित रखते हुए वर्तमान अवस्था और भावी बिगड़े हुए रूप के बीच अंतर व्यक्त किया गया है।
- source_word: ܬܫܢܝܩܐ
  choice: यातना
  rationale: यह दंडस्वरूप पीड़ा या torment का सामान्य अर्थ देता है; ‘यातना’ उसके कठोर भाव को संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: भावी यातना की प्रकृति और अवधि
  choice: जब वे यातना सहेंगे
  alternative: जब वे दंड पाएँगे
  rationale: मूल में सामान्य ‘दंड’ की अपेक्षा पीड़ादायक यातना का भाव अधिक प्रबल है, पर उसकी अवधि या ठीक स्वरूप निर्धारित नहीं किया गया; अनुवाद भी उसे अनिर्धारित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी; वाक्य ने मूल के कारणसूचक आरंभ, भावी रूप-परिवर्तन और यातना के समय-संबंध को बनाए रखा है।
