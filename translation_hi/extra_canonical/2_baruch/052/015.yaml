translation:
  language: hi
  text: क्योंकि पहले वाले उन बाद वालों का स्वागत करेंगे जिनकी वे प्रतीक्षा कर रहे थे, और बाद वाले उन लोगों का, जिनके बारे में उन्होंने सुना था कि वे चल बसे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܩܒܠܘܢ
  choice: स्वागत करेंगे
  rationale: क्रिया का मूल अर्थ ‘ग्रहण करना/स्वीकार करना’ है; यहाँ पुनर्मिलन के पारस्परिक संदर्भ में ‘स्वागत करना’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आशय को बनाए रखता है।
- source_word: ܩܕܡܝܐ ... ܐܚܪ̈ܝܐ
  choice: पहले वाले ... बाद वाले
  rationale: समय या क्रम में पहले और बाद में मरने वालों के बीच स्रोत में रखा गया विरोध स्पष्ट रूप से सुरक्षित रहता है।
- source_word: ܡܣܟܝܢ
  choice: प्रतीक्षा कर रहे थे
  rationale: यह चयन स्रोत के प्रतीक्षा करने के भाव को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ܫܡܥܝܢ
  choice: सुना था
  rationale: स्रोत की श्रवण-सूचना को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: मृतकों के भावी पुनर्मिलन का वर्णन
  choice: वाक्य को वर्णनात्मक रूप में रखा गया है और ‘स्वागत करेंगे’ कहा गया है।
  alternative: ‘ग्रहण करेंगे’ या ‘स्वीकार करेंगे’
  rationale: ‘स्वागत करेंगे’ संदर्भगत संबंध को सहज बनाता है, पर पुनरुत्थान की अवस्था, स्थान या प्रक्रिया के बारे में कोई अतिरिक्त सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘संसार से जा चुके थे’ मृत्यु के लिए स्वाभाविक, संयत अभिव्यक्ति है।
