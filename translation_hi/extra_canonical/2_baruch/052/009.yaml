translation:
  language: hi
  text: जब वे देखेंगे कि जिन्हें वे अभी तुच्छ समझते हैं, वे विश्राम पा रहे हैं और स्वर्गदूतों के साथ महिमान्वित हो रहे हैं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܬܢܝܚܝܢ
  choice: विश्राम पा रहे हैं
  rationale: यह क्रिया विश्राम या चैन पाने का भाव देती है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: ܡܫܬܒܚܝܢ
  choice: महिमान्वित हो रहे हैं
  rationale: यह कर्मवाच्य रूप महिमा दिए जाने या महिमा पाने को व्यक्त करता है; ‘महिमान्वित’ धार्मिक संदर्भ में स्पष्ट है, पर किसी विशेष सांप्रदायिक अर्थ को नहीं जोड़ता।
- source_word: ܐܝܠܝܢ ܕܗܫܐ …
  choice: जिन्हें वे अभी तुच्छ समझते हैं
  rationale: प्रसंग और परामर्श-पाठ में वर्तमान समय में नगण्य गिने जाने का भाव है; ‘तुच्छ समझते हैं’ सामान्य हिन्दी में स्वाभाविक रूप से वही सामाजिक अवमानना व्यक्त करता है।
- source_word: ܥܡ …
  choice: स्वर्गदूतों के साथ
  rationale: खंडित पृष्ठ-साक्ष्य का निकटवर्ती संदर्भ स्वर्गदूतों और धर्मियों की महिमा की तुलना करता है; परामर्श-पाठ भी इसी संबंध को स्पष्ट करता है।
theological_decisions:
- issue: धर्मियों का स्वर्गदूतों के साथ महिमान्वित होना
  choice: स्वर्गदूतों के साथ महिमान्वित हो रहे हैं
  alternative: स्वर्गदूतों के समान महिमान्वित हो रहे हैं
  rationale: ‘साथ’ संगति को व्यक्त करता है और मनुष्यों तथा स्वर्गदूतों को एक ही सत्ता ठहराने से बचता है; ‘समान’ स्रोत से अधिक दार्शनिक निष्कर्ष जोड़ सकता था।
- issue: विश्राम की दशा
  choice: विश्राम पा रहे हैं
  alternative: सो रहे हैं
  rationale: यहाँ बल मृत्यु की निद्रा की व्याख्या पर नहीं, भावी प्रतिफल में मिले विश्राम पर है; इसलिए अनावश्यक धर्मवैज्ञानिक निर्धारण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को उसके आगे जारी रहने वाले आश्रित उपवाक्य के रूप में रखा गया है। भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है।
