translation:
  language: hi
  text: क्योंकि वे क्लेश के इस संसार से मुक्त किए गए हैं और उन्होंने संकटों का बोझ उतार दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ (ʾetpaṣṣiw)
  choice: छुड़ा लिए गए हैं
  rationale: सिरिएक का कर्मवाच्य रूप उद्धार या छुटकारा पाए जाने का भाव रखता है; हिन्दी में कर्मवाच्य रखकर मुक्त करने वाले को अनकहा ही रहने दिया गया है।
- source_word: ܥܠܡܐ ܕܐܘܠܨܢܐ (ʿālmā d-ʾulṣānā)
  choice: क्लेश का यह संसार
  rationale: ܐܘܠܨܢܐ दबाव, पीड़ा या क्लेश का बोध कराता है; ‘क्लेश’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ܛܘܥܢܐ ܕܥܩ̈ܬܐ (ṭuʿnā d-ʿāqāṯā)
  choice: संकटों का बोझ
  rationale: मूल में एकवचन ‘बोझ’ के साथ बहुवचन कठिनाइयों/संकटों का संबंध है; हिन्दी वाक्यांश उसी संरचना को सहज रूप में सुरक्षित रखता है।
- source_word: ܐܢܝܚܘ ܡܢܗܘܢ (ʾanīḥw menhon)
  choice: उन्होंने अपने ऊपर से … उतार दिया है
  rationale: शाब्दिक भाव ‘अपने से अलग रख देना/उतार देना’ है; यह हिन्दी में बोझ से छुटकारे का चित्र स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: छुटकारा देने वाले की पहचान
  choice: कर्मवाच्य ‘छुड़ा लिए गए’
  alternative: ‘वे मुक्त हो गए’ या ‘परमेश्वर ने उन्हें छुड़ाया’
  rationale: मूल पाठ कर्ता को स्पष्ट नहीं करता। कर्मवाच्य उस अस्पष्टता को बनाए रखता है और किसी अनुल्लिखित कर्ता को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। समानांतर वाक्यरचना तथा ‘संसार—क्लेश’ और ‘बोझ—संकट’ के मूल बिंब सुरक्षित रखे गए हैं।
