translation:
  language: hi
  text: क्योंकि यह आवश्यक है कि जीवित लोगों को दिखाया जाए कि मरे हुए फिर जीवित हो गए हैं और जो चले गए थे वे लौट आए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܒܥܐ
  choice: आवश्यक है
  rationale: यह सिरिएक के ‘अपेक्षित/ज़रूरी होना’ के भाव को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܠܐܝܠܝܢ ܕܚܝܝܢ
  choice: जीवित लोगों को
  rationale: शाब्दिक अर्थ ‘जो जीवित हैं’ है; हिन्दी में यह रूप अधिक स्वाभाविक है और मृतकों के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ܕܚܝܘ ܡ̈ܝܬܐ
  choice: कि मरे हुए फिर जीवित हो गए हैं
  rationale: क्रिया का अर्थ ‘जी उठे/जीवित हुए’ है; ‘फिर’ पुनर्जीवन का निहित भाव स्पष्ट करता है, बिना उसकी प्रकृति के बारे में अतिरिक्त सिद्धान्त जोड़ने के।
- source_word: ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ ܗܘܘ
  choice: और जो चले गए थे वे लौट आए हैं
  rationale: सिरिएक में शाब्दिक रूप से ‘जो गए थे वे आए’ है; प्रसंगगत वापसी को हिन्दी में ‘लौट आए’ स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मृतकों के जीवित होने की अभिव्यक्ति
  choice: फिर जीवित हो गए हैं
  alternative: जी उठे हैं
  rationale: चुना हुआ रूप पुनर्जीवन को स्पष्ट रखता है, पर किसी विशेष पुनरुत्थान-सिद्धान्त की पारिभाषिक भाषा अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, सार्वजनिक पाठ के योग्य और गरिमापूर्ण रखा गया है। स्रोत के कारणसूचक ‘क्योंकि’ तथा दिखाए जाने की कर्मवाच्य संरचना सुरक्षित रखी गई है।
