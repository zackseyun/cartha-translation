  text: And it shall be, when they recognize one another—those who now know one another—that then the appearance of those who are now condemned will become more dreadful.
translation:
  language: hi
  text: और ऐसा होगा कि जब वे—जो अभी एक-दूसरे को जानते हैं—एक-दूसरे को पहचान लेंगे, तब उन लोगों का रूप और भी भयावह हो जाएगा जो अभी दोषी ठहराए गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܝܕܥܘ ܚܕ ܠܚܕ
  choice: एक-दूसरे को पहचान लेंगे
  rationale: परस्पर पहचानने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; भविष्यकाल व्यापक वाक्य-संदर्भ के अनुरूप है।
- source_word: ܚܙܘܗ
  choice: रूप
  rationale: यहाँ दृश्य रूप या दिखाई देने वाली दशा अभिप्रेत है; ‘रूप’ हिन्दी में संक्षिप्त और सहज है।
- source_word: ܕܡܩܕܡܝܢ ܐܡܝܢ
  choice: जो अभी दोषी ठहराए गए हैं
  rationale: प्रदत्त सिरिएक पाठ की कठिन/संभावित रूप से भ्रष्ट पंक्ति के लिए परामर्श-पाठ में सुरक्षित न्याय-संबंधी अर्थ अपनाया गया है, बिना दोष के प्रकार या कर्ता को बढ़ाकर बताए।
- source_word: ܢܒܛܠ
  choice: और भी भयावह हो जाएगा
  rationale: प्रसंग और परामर्श-पाठ के अनुसार दुष्टों के प्रकट रूप की तीव्र होती भयावहता व्यक्त की गई है; उपलब्ध पाठ-रूप स्वयं कठिन है।
theological_decisions:
- issue: ‘दोषी ठहराए गए’ का कर्ता और आधार
  choice: कर्ता तथा दोष का आधार अनिर्दिष्ट रखा गया
  alternative: ‘जिन्हें परमेश्वर ने दंडित किया है’
  rationale: मूल वाक्य इस स्थान पर परमेश्वर को स्पष्ट कर्ता नहीं बनाता; उसे जोड़ना अनावश्यक धर्मवैचारिक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। अंतःस्थ व्याख्यात्मक खंड को दीर्घ विराम-चिह्नों से अलग रखा गया है ताकि मूल की पुनरुक्ति और जोर सुरक्षित रहे।
