  text: then their splendor will be glorified in transformations, and the form of their faces will be changed into the light of their beauty, so that they may acquire and receive the world that does not die, which is promised to them.
translation:
  language: hi
  text: तब रूपांतरणों में उनका वैभव महिमान्वित होगा, और उनके मुखों का रूप बदलकर उनके सौंदर्य का प्रकाश हो जाएगा,[a] ताकि वे उस संसार को प्राप्त करें और ग्रहण करें जो कभी नहीं मरता और जिसकी प्रतिज्ञा उन्हें दी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी महिमाएँ जाग उठेंगी, और उनके मुखों का रूप उनके सौंदर्य के प्रकाश से चमक उठेगा।”
    reason: अंग्रेज़ी POB audit trail में दर्ज पूर्व/वैकल्पिक rendering को सुरक्षित रखता है; यह मुख्य पाठ के स्थान पर कोई निश्चित पाठालोचनात्मक निर्णय नहीं थोपता।
lexical_decisions:
- source_word: ܫܘܚܠܦ̈ܐ / ܫܘܒ̈ܚܐ
  choice: रूपांतरणों में / महिमा
  rationale: पाठ-परंपरा और उपलब्ध प्रतिलेखन में निकट रूपों के कारण ‘रूपांतरण’ तथा ‘महिमा’ के बीच अंतर दिखाई देता है। मुख्य पाठ संशोधित स्रोत-पाठ के ‘रूपांतरणों में महिमित’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
- source_word: ܨܘܪܬܗܘܢ ܕܐܦܝ̈ܗܘܢ
  choice: उनके मुखों का रूप
  rationale: शाब्दिक अर्थ को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ
  choice: वह संसार जो कभी नहीं मरता
  rationale: ‘अमर संसार’ की अपेक्षा स्रोत की सजीव नकारात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: ܕܢܣܒܘܢ ܘܢܩܒܠܘܢ
  choice: प्राप्त कर सकें और अपना सकें
  rationale: दो समानांतर क्रियाओं को बनाए रखते हुए हिन्दी में उनके ग्रहण और अधिकार, दोनों के भाव को व्यक्त करता है।
theological_decisions:
- issue: पुनरुत्थित धर्मियों के रूपांतरण की प्रकृति
  choice: ‘रूपांतरणों में उनकी महिमा प्रकट होगी’
  alternative: ‘उनकी महिमाएँ जाग उठेंगी’
  rationale: मुख्य पाठ संशोधित स्रोत-पाठ के रूपांतरण और महिमान्वयन को रखता है, पर उपलब्ध सिरिएक प्रतिलेखन में दिखने वाले वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है; किसी विशेष देह-विज्ञान या सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
- issue: न मरने वाले संसार को पाना
  choice: ‘प्राप्त कर सकें और अपना सकें’
  alternative: ‘अधिकार में लें और ग्रहण करें’
  rationale: स्रोत की दो क्रियाओं का तनाव बनाए रखते हुए यह तय नहीं किया गया कि आशय केवल विरासत, प्रवेश या स्वामित्व में से कोई एक है।
