  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘रूपांतरणों में उनकी महिमा प्रकट होगी’ को अत्यधिक शाब्दिक और अस्वाभाविक ‘महिमित की जाएगी’ के स्थान पर चुना गया है। पादटिप्पणी का चिह्न मुख्य पाठ में उपस्थित है।
