lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  choice: उसके आदेशों
  rationale: यह पद अधिकारपूर्ण दैवी आज्ञाओं को सूचित करता है। ‘आदेश’ आधुनिक और स्वाभाविक है तथा उपदेशात्मक बल बनाए रखता है।
- source_word: ܬܐܢܝܚܘܢ
  choice: विश्राम पाओ
  rationale: यह न्याय के प्रसंग में राहत और अंतिम विश्राम—दोनों अर्थ-संकेत सुरक्षित रखता है।
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  choice: स्त्रियों के रोने से
  rationale: मूल की सजीव विलाप-भाषा और संचयी अलंकार को सीधे रूप में रखा गया है।
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  choice: छोटे बच्चों की कोमलता से
  rationale: संज्ञा मनोहरता, भलमनसाहत या स्नेह जगाने वाली बाल-सुलभ कोमलता दर्शा सकती है; ‘कोमलता’ भावनात्मक अपील को स्वाभाविक हिन्दी में रखती है।
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  choice: नवजात बच्चों की निष्कलंकता से
  rationale: ‘शुद्धता’ का नैतिक और भावात्मक आशय ‘निष्कलंकता’ से सहज रूप में व्यक्त होता है।
- source_word: ܐܬܪܐ ܠܬܝܒܘܬܐ (control-backed emendation of rough ܐܪܙܐ)
  choice: पश्चाताप के लिए कोई अवसर
  rationale: प्राप्त पाठ में लिप्यंतरण/OCR कठिन है; नियंत्रक साक्ष्य और न्याय-संदर्भ ‘पश्चाताप के लिए स्थान/अवसर’ का समर्थन करते हैं।
- source_word: ܡܬܬܕܝܢ
  choice: न्याय … होगा
  rationale: क्रिया का सीधा अर्थ ‘न्याय किया जाना’ है; इसे केवल ‘खड़ा होना’ नहीं बनाया गया।
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  choice: पापों से दूषित
  rationale: शाब्दिक बल ‘पापों में बँटे/फँसे’ जैसा हो सकता है, पर प्रसंग में यह पाप से बिगड़ी नैतिक दशा बताता है; ‘दूषित’ इसे स्पष्ट रखता है।
theological_decisions:
- issue: अंतिम न्याय में निष्फल मध्यस्थताओं की लंबी सूची को रखना या संक्षिप्त करना
  choice: प्रार्थना, पूर्वज, भविष्यद्वक्ता, धर्मी, स्त्रियाँ और बच्चों से जुड़े प्रत्येक तत्व को अलग रखा गया।
  alternative: पूरी सूची को ‘तब कोई मध्यस्थता सहायता नहीं करेगी’ कहकर संक्षिप्त करना।
  rationale: मूल सिरिएक की संचयी और कठोर वाक्पटुता अंतिम व्यक्तिगत उत्तरदायित्व पर जोर देती है।
- issue: व्यक्तिगत न्याय की पंक्ति का अर्थ
  choice: ‘हर एक का न्याय केवल उसके अपने ही आधार पर होगा।’
  alternative: ‘हर एक अकेला अपने बल पर खड़ा होगा।’
  rationale: अंतर्निहित क्रिया ‘न्याय किया जाना’ है। ‘अपने ही आधार पर’ अकेले व्यक्तिगत उत्तरदायित्व का भाव व्यक्त करता है, पर संभावित वैकल्पिक रूप फुटनोट में सुरक्षित है।
- issue: अंतिम संरक्षण-वाक्य में आशा का संबंध
  choice: ‘जिनकी आशा उसमें है’
  alternative: ‘जिनमें आशा है’
  rationale: सिरिएक वाक्य आशा रखने वाले लोगों की ओर संकेत करता है; ‘उसमें’ संबंध को स्पष्ट करता है, बिना योग्यता या चुनाव का अतिरिक्त सिद्धांत जोड़े।
- issue: ‘अपने युग के लिए’ को बनाए रखना
  choice: असामान्य लेकिन स्रोत-सन्निकट अभिव्यक्ति को रखा गया।
  alternative: ‘सदा के लिए सुरक्षित रखेगा’ या ‘आने वाले युग के लिए सुरक्षित रखेगा।’
  rationale: मूल की अभिव्यक्ति कुछ अस्पष्ट है; ‘आने वाला’ या ‘सदा’ जोड़ना उस अस्पष्टता को अनावश्यक रूप से हल कर देता।
