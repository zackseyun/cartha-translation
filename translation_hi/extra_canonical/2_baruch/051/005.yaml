base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/005.yaml
  text: 'When therefore they see that those over whom they are now exalted are then exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms.'
translation:
  language: hi
  text: 'इसलिए, जब वे देखेंगे कि जिन लोगों से वे अभी ऊँचे हैं, वे उस समय उनसे भी अधिक उन्नत और महिमान्वित होंगे,[a] तब दोनों समूह बदल जाएँगे: वे लोग स्वर्गदूतों के तेज में रूपांतरित होंगे, पर ये लोग दृश्यों और रूपों को देखकर विस्मय में और भी अधिक क्षीण होते जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वे उन लोगों को देखेंगे जिनसे वे अभी ऊँचे हैं—कि वे उस समय उन्नत होंगे।”
    reason: मूल की उस वैकल्पिक संरचना को दर्शाता है जिसमें ‘देखेंगे’ के बाद उन्हीं लोगों के उन्नत होने का कथन अलग उपवाक्य के रूप में आता है। मुख्य पाठ स्वाभाविक हिन्दी के लिए इसे एक आश्रित उपवाक्य में रखता है।
lexical_decisions:
- source_word: ܢܬܬܥܝܪ / ܫܘܒ̈ܚܐ (chapter context; exaltation/glories)
  choice: ऊँचे उठाए गए और अधिक महिमान्वित किए गए
  rationale: ऊँचाई और महिमा—दोनों अवधारणाओं को अलग रखते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: angelic splendor (verse wording preserved by the audited consultation layer; exact Syriac line is beyond the supplied page cutoff)
  choice: स्वर्गदूतों का तेज
  rationale: ‘तेज’ प्रकाशमान महिमा को संक्षेप और गरिमा के साथ व्यक्त करता है; इसे स्वर्गदूत-सदृश स्वभाव या देवत्व में परिवर्तन नहीं बनाया गया।
- source_word: forms / appearances
  choice: रूप
  rationale: ‘रूप’ दृश्य आकृतियों के अर्थ को खुला रखता है और उनकी पहचान के विषय में अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: waste away
  choice: क्षीण होते जाएँगे
  rationale: क्रमिक ह्रास का भाव देता है, पर यह तय नहीं करता कि वह शारीरिक विनाश है, मानसिक संताप है या दोनों।
theological_decisions:
- issue: धर्मियों का स्वर्गदूतों के तेज में परिवर्तन
  choice: स्वर्गदूतों के तेज में बदलेंगे
  alternative: स्वर्गदूत बन जाएँगे
  rationale: पाठ तेज/महिमा में परिवर्तन कहता है; मनुष्यों के स्वर्गदूत बन जाने का अधिक ठोस धर्मशास्त्रीय दावा नहीं जोड़ा गया।
- issue: दो समूहों के संकेतवाचक सर्वनाम
  choice: ‘वे दूसरे’ धर्मियों के लिए और ‘ये पहले’ अभी ऊँचे लोगों के लिए
  alternative: केवल ‘ये’ और ‘वे’
  rationale: मूल का विरोध बनाए रखते हुए हिन्दी में संदर्भ स्पष्ट किया गया है, ताकि दंड और महिमा उलटे समूहों से न जुड़ें।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप। ‘ये पहले/वे दूसरे’ से दो समूहों का क्रम स्पष्ट किया गया है। उपलब्ध सिरियाई अंश इस पद की ठीक पंक्ति से पहले कट जाता है; इसलिए पद की विशिष्ट शब्दावली के लिए लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानी से उपयोग किया गया, जबकि अध्याय के सिरियाई संदर्भ ने ऊँचाई, महिमा, रूप और परिवर्तन की शब्दावली को नियंत्रित किया।
