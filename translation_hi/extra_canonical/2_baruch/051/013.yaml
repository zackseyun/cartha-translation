  text: For the first will receive the last, those for whom they were waiting; and the last, those of whom they had heard that they had passed away.
translation:
  language: hi
  text: क्योंकि पहले वाले उन बाद वालों को ग्रहण करेंगे जिनकी वे प्रतीक्षा कर रहे थे, और बाद वाले उन पहले वालों को ग्रहण करेंगे, जिनके बारे में उन्होंने सुना था कि वे मर चुके थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܕܡ̈ܝܐ / ܐܚܪ̈ܝܐ (अध्याय के लक्षित वाक्य में निहित विरोधी पद)
  choice: पहलेवाले / बादवाले
  rationale: ये शब्द कालक्रम में पहले और बाद में जीनेवाले लोगों का स्वाभाविक हिन्दी संकेत देते हैं; ‘प्रथम/अंतिम’ पदक्रम या प्रतिष्ठा का अनचाहा अर्थ दे सकते थे।
- source_word: receive
  choice: ग्रहण करेंगे
  rationale: पुनरुत्थान के प्रसंग में मिलने, स्वागत करने या अपने पास पाने की अर्थ-सीमा को खुला रखता है।
- source_word: were waiting
  choice: प्रतीक्षा कर रहे थे
  rationale: दीर्घकालीन आशा और बाट जोहने का भाव स्पष्ट तथा आधुनिक हिन्दी में सहज है।
- source_word: passed away
  choice: संसार से विदा हो चुके हैं
  rationale: मृत्यु का शिष्ट और स्पष्ट संकेत देता है, पर आगे की अवस्था के बारे में पाठ से अधिक कुछ नहीं जोड़ता।
theological_decisions:
- issue: ‘ग्रहण करेंगे’ का आशय
  choice: क्रिया को व्यापक अर्थ में रखा गया
  alternative: ‘स्वागत करेंगे’ या ‘उनसे मिलेंगे’
  rationale: प्रसंग पुनरुत्थान और पीढ़ियों की परस्पर पहचान का है, किंतु क्रिया केवल औपचारिक स्वागत या साधारण भेंट तक सीमित नहीं की गई।
- issue: पहलेवाले और बादवाले कौन हैं
  choice: उन्हें कालक्रमिक समूहों के रूप में अनिर्दिष्ट रखा गया
  alternative: उन्हें विशेष धार्मिक समुदाय, धर्मी जन या निश्चित पीढ़ियाँ कहना
  rationale: पाठ स्वयं इस वाक्य में ऐसी संप्रदायगत या विशिष्ट पहचान नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर वाक्य-विन्यास से पहलेवाले/बादवाले का परस्पर संबंध स्पष्ट किया गया है, और दूसरे खंड में निहित ‘ग्रहण करेंगे’ को हिन्दी में दोहराए बिना स्वाभाविक रूप से समझने योग्य रखा गया है।
