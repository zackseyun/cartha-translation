  source_fidelity: The reciprocal sequence of the earlier and later people, their waiting, and the report that the others had died/passed away is retained. However, “संसार से” adds an image not present in the supplied English audit trail and is less direct than the death reference in this resurrection context.
  naturalness: The draft is clear and dignified. Writing “पहले वाले/बाद वाले” as separate words and repeating the governing verb in the second member makes the balanced reciprocal statement easier to follow in modern Hindi.
  terminology: “ग्रहण करेंगे” is a defensible broad rendering of “receive” and does not over-specify whether the action is welcome, reunion, or reception. “मर चुके थे” is appropriately plain and contextually accurate without importing a doctrinal interpretation.
  issues:
  - severity: low
    issue: “संसार से विदा हो चुके हैं” adds “संसार से” and shifts the tense.
    rationale: The audit trail says “had passed away”; the surrounding context concerns those who had died. “मर चुके थे” conveys this directly, avoids the added ‘world’ imagery, and maintains the prior-past relationship.
  - severity: low
    issue: The second clause leaves “ग्रहण करेंगे” implicit.
    rationale: Ellipsis is possible in Hindi, but explicitly repeating the verb preserves the source’s reciprocal parallelism and prevents a momentary syntactic break.
