base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/016.yaml
  text: For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they should not come to the honor of which I told you before.
translation:
  language: hi
  text: क्योंकि उन्होंने अपने लिए इस समय को चुना, जो पीड़ा के बिना बीत नहीं सकता; और अपने लिए उस समय को चुना, जिसका अन्त विलाप और बुराइयों से भरा है। उन्होंने उस संसार को ठुकरा दिया, जो उसमें आनेवालों को बूढ़ा नहीं करता[a], और महिमा के समय को भी ठुकरा दिया, ताकि वे उस सम्मान तक न पहुँचें, जिसके विषय में मैंने तुम्हें पहले बताया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जिसमें आनेवाले बूढ़े नहीं होते।”'
    reason: सीरियाई की कारक अभिव्यक्ति का अधिक स्वाभाविक हिन्दी वैकल्पिक रूप।
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: युग / संसार
  rationale: संदर्भ के अनुसार एक ही सीरियाई शब्द के कालगत अर्थ के लिए ‘युग’ और जगतगत अर्थ के लिए ‘संसार’ रखा गया है।
- source_word: ܡܣܐܒ
  choice: बूढ़ा नहीं करता
  rationale: 'यह कारक/सकर्मक अर्थ व्यक्त करता है: आनेवालों को वृद्ध कर देना, न कि संसार का स्वयं पुराना होना।'
- source_word: ܐܝܩܪܐ
  choice: सम्मान
  rationale: ‘आदर’ और ‘महिमा’ दोनों संभव हैं, पर निकटवर्ती ‘महिमा के समय’ से अनावश्यक पुनरुक्ति से बचते हुए सामान्य अर्थ ‘सम्मान’ रखा गया है।
theological_decisions:
- issue: आनेवाले संसार का बुढ़ापा रोकना
  choice: जो उसमें आनेवालों को बूढ़ा नहीं करता
  alternative: जो उसमें आनेवालों के लिए पुराना नहीं होता
  rationale: कारक सीरियाई क्रिया का बल संसार के निवासियों पर पड़ने वाले प्रभाव पर है; इसलिए अमरता-संबंधी संकेत को निष्क्रिय अर्थ में नहीं बदला गया।
- issue: अन्तिम परिणाम की अभिव्यक्ति
  choice: इसलिए वे ... नहीं पाएँगे
  alternative: ताकि वे ... न आएँ
  rationale: हिन्दी में परिणाम स्पष्ट और स्वाभाविक बनाया गया है, पर इसे जानबूझकर ठुकराने के फल के रूप में रखा गया है; किसी विशिष्ट दार्शनिक या साम्प्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘चुना’ और ‘ठुकरा दिया’ की समानांतर रचना मूल के नैतिक विरोध को बनाए रखती है।
