  text: And above all, those who come after will be grieved, because they despised my law and stopped their ears so that they would not hear wisdom or receive understanding.
translation:
  language: hi
  text: और सबसे बढ़कर, बाद में आनेवाले लोग शोक करेंगे, क्योंकि उन्होंने मेरी व्यवस्थाओं को तुच्छ जाना और अपने कान बंद कर लिए, ताकि वे न तो बुद्धि की बात सुनें और न समझ ग्रहण करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܬܝܪܐܝܬ
  choice: सबसे बढ़कर
  rationale: यह क्रियाविशेषण अधिकता और विशेष तीव्रता व्यक्त करता है; प्रसंग में भावी शोक की प्रधानता दिखाने के लिए यह स्वाभाविक हिन्दी है।
- source_word: ܢܬܬܙܝܥܘܢ
  choice: शोक करेंगे
  rationale: मूल क्रिया का व्यापक अर्थ विचलित या व्याकुल होना है; दंड और खोई हुई महिमा के प्रसंग में ‘शोक करेंगे’ भाव को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ܢܡܘܣܝ̈
  choice: मेरी व्यवस्थाओं
  rationale: सीरियाई रूप बहुवचन है और परमेश्वर की आज्ञाओं अथवा विधियों को सूचित करता है; इसलिए अंग्रेज़ी परामर्श-पाठ के एकवचन ‘law’ के बजाय स्रोत का बहुवचन रखा गया है।
- source_word: ܚܟܡܬܐ
  choice: बुद्धि की बात
  rationale: ‘बुद्धि’ को सुनने की मूल अभिव्यक्ति हिन्दी में स्वाभाविक बनाने के लिए ‘की बात’ जोड़ा गया है, बिना आशय बदले।
- source_word: ܣܘܟܠܐ
  choice: समझ
  rationale: यह शब्द बोध, अंतर्दृष्टि या समझ को दर्शाता है; साधारण आधुनिक हिन्दी में ‘समझ’ सबसे सुबोध है।
theological_decisions:
- issue: ‘मेरी व्यवस्था’ एकवचन या ‘मेरी व्यवस्थाओं’ बहुवचन
  choice: मेरी व्यवस्थाओं
  alternative: मेरी व्यवस्था
  rationale: प्राथमिक सीरियाई पाठ में संज्ञा बहुवचन रूप में है; इसे किसी विशिष्ट धर्मशास्त्रीय अर्थ में एक समेकित ‘व्यवस्था’ बनाना उचित नहीं होगा।
- issue: कान बंद करने का आशय
  choice: स्वेच्छापूर्वक न सुनने की क्रिया को यथावत रखा
  alternative: वे बुद्धि को समझ नहीं सके
  rationale: मूल पाठ असमर्थता नहीं, बल्कि जानबूझकर कान बंद करने की जवाबदेही व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। वाक्य-संरचना मूल के कारणात्मक और समानांतर ढाँचे को बनाए रखती है। ‘बाद में आनेवाले’ अंग्रेज़ी परामर्श-पाठ और पद के प्रचलित पाठ-साक्ष्य के अनुरूप रखा गया है; उपलब्ध पृष्ठ-पाठ में इस स्थान का रूप पाठगत रूप से कठिन है।
