translation:
  language: hi
  text: क्योंकि जो लोग अब बुराई करते हैं, उनका रूप अभी जैसा है उससे भी बदतर हो जाएगा, ताकि वे यातना सहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: उनका रूप
  rationale: यह शब्द यहाँ बाहरी रूप या आकृति को सूचित करता है; प्रसंग पुनरुत्थान के बाद रूप-परिवर्तन का है।
- source_word: ܒܝܫ
  choice: बदतर
  rationale: तुलनात्मक संरचना ‘अभी जैसा है उससे’ के साथ स्वाभाविक हिन्दी में नकारात्मक परिवर्तन व्यक्त करती है।
- source_word: ܬܫܢܝܩܐ
  choice: यातना
  rationale: मूल शब्द दंडस्वरूप पीड़ा या torment को व्यक्त करता है; ‘यातना’ संक्षिप्त और प्रसंगानुकूल है।
theological_decisions:
- issue: दुष्टों के पुनरुत्थान के बाद स्वरूप और दंड का संबंध
  choice: रूप के बदतर होने और उसके उद्देश्य के रूप में यातना सहने—दोनों कथनों को सीधे रखा गया है।
  alternative: इसे केवल नैतिक पतन या प्रतीकात्मक लज्जा के रूप में समझाकर अनुवाद करना।
  rationale: मूल पाठ शारीरिक/दृश्य ‘रूप’ और ‘यातना’ के बीच तनावपूर्ण संबंध रखता है; अनुवाद उस संबंध को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘रूप’ मूल की ठोस किन्तु कुछ हद तक खुली अर्थ-सीमा को बनाए रखता है।
