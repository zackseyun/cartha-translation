translation:
  language: hi
  text: तब धर्मियों की श्रेष्ठता स्वर्गदूतों से भी अधिक होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܙܕܝܩ̈ܐ (संदर्भगत पुनर्निर्माण: ‘धर्मी’)'
  choice: धर्मी
  rationale: यह इस अंश में अंतिम रूपांतरण और प्रतिफल पानेवाले न्यायी जनों के लिए प्रचलित, सहज और धर्मशास्त्रीय रूप से तटस्थ हिन्दी शब्द है।
- source_word: 'ܝܬܝܪ / ܫܘܒܚܐ (संदर्भगत भाव: ‘बढ़कर श्रेष्ठता/महिमा’)'
  choice: श्रेष्ठता से भी बढ़कर
  rationale: तुलना की तीव्रता को स्वाभाविक हिन्दी में स्पष्ट रखता है और इसे केवल बाहरी चमक या किसी विशिष्ट सिद्धान्त तक सीमित नहीं करता।
- source_word: 'ܥܝܪ̈ܐ / ܡܠܐܟ̈ܐ (संदर्भगत भाव: ‘स्वर्गदूत’)'
  choice: स्वर्गदूत
  rationale: साधारण आधुनिक हिन्दी पाठक के लिए स्पष्ट है और अलौकिक दूतों के आशय को संप्रेषित करता है।
theological_decisions:
- issue: धर्मियों और स्वर्गदूतों के बीच तुलना
  choice: धर्मियों की श्रेष्ठता स्वर्गदूतों की श्रेष्ठता से भी बढ़कर होगी
  alternative: धर्मी स्वर्गदूतों से श्रेष्ठ होंगे
  rationale: चुना हुआ रूप तुलना को गुण या अवस्था की श्रेष्ठता पर बनाए रखता है; यह धर्मियों की सत्ता, पद या स्वभाव के विषय में मूल कथन से आगे कोई निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। उपलब्ध पृष्ठांश पद 12 से पहले कट जाता है, इसलिए शब्दांकन अध्याय-संदर्भ और परीक्षित अंग्रेज़ी परामर्श-पाठ से नियंत्रित रखा गया है।
