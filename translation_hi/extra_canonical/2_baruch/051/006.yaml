translation:
  language: hi
  text: क्योंकि पहले वे देखेंगे, और उसके बाद यातना सहने के लिए चले जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܚܙܘܢ (पाठ-संदर्भ में ‘वे देखेंगे’)
  choice: वे देखेंगे
  rationale: दृष्टि से संबंधित सामान्य भविष्यकाल को सीधा और स्वाभाविक रखा गया है; उसके विषय को अगले खंड के समान ‘वे’ माना गया है।
- source_word: ܢܐܙܠܘܢ / प्रस्थान-सूचक पाठ
  choice: चले जाएँगे
  rationale: अर्थ ‘जाना/प्रस्थान करना’ है; ‘चले जाएँगे’ आधुनिक हिन्दी में स्वाभाविक है और गंतव्य के बारे में अनावश्यक विस्तार नहीं जोड़ता।
- source_word: ܬܫܢܝܩܐ
  choice: यातना
  rationale: यह शब्द पीड़ा या दंडस्वरूप यातना का बोध कराता है; ‘यातना सहने’ से लक्ष्यसूचक निर्माण हिन्दी में स्पष्ट होता है।
theological_decisions:
- issue: दर्शन और यातना का क्रम
  choice: ‘पहले… और उसके बाद…’ के क्रम को अक्षुण्ण रखा गया
  alternative: इसे कारणात्मक या अंतिम न्याय की व्याख्यात्मक भाषा में विस्तृत करना
  rationale: मूल कथन केवल घटनाक्रम बताता है; यह नहीं बताता कि वे किसे या क्या देखते हैं, इसलिए उस अस्पष्टता को नहीं भरा गया।
- issue: यातना की प्रकृति और अवधि
  choice: केवल ‘यातना सहने’ कहा गया
  alternative: ‘अनन्त दंड’ या किसी विशिष्ट परलोक-सिद्धांत का उल्लेख
  rationale: इस पद में यातना की अवधि या सटीक प्रकृति स्पष्ट नहीं की गई है, इसलिए कोई सांप्रदायिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य मूल के संक्षिप्त कालक्रम को बनाए रखता है और ‘वे क्या देखेंगे’ की वास्तविक अस्पष्टता को नहीं सुलझाता।
