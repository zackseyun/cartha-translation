base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/011.yaml
  text: For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their arrival.
translation:
  language: hi
  text: क्योंकि उनके सामने स्वर्गलोक के विस्तार फैलाए जाएँगे; और उन्हें सिंहासन के नीचे के जीवित प्राणियों की महिमा की शोभा तथा स्वर्गदूतों की सारी सेनाएँ दिखाई जाएँगी—वे भी, जिन्हें अभी मेरे वचन ने रोक रखा है कि वे प्रकट न हों, और वे भी, जिन्हें मेरी आज्ञा ने उनके स्थानों पर उनके आगमन तक[a] ठहरा रखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक उनका आगमन न हो जाए।”
    reason: अंतिम वाक्यांश को केवल भौतिक आगमन अथवा उसके नियत समय—दोनों अर्थों में समझा जा सकता है।
lexical_decisions:
- source_word: ܦܬܘܬܐ / underlying Syriac tradition reflected by ‘expanses’
  choice: विस्तार
  rationale: स्वर्गलोक के खुले, विस्तृत क्षेत्रों का बोध कराता है और ‘मैदान’ जैसी अनावश्यक ठोस व्याख्या से बचता है।
- source_word: ܦܪܕܝܣܐ
  choice: स्वर्गलोक
  rationale: आधुनिक हिन्दी पाठक के लिए सहज है और यहाँ भावी धन्य निवास-स्थान के अर्थ को स्पष्ट रखता है।
- source_word: ܚܝ̈ܘܬܐ
  choice: जीवित प्राणी
  rationale: सिंहासन के नीचे के स्वर्गीय प्राणियों के लिए स्रोत की अपेक्षाकृत शाब्दिक अभिव्यक्ति रखी गई है; उन्हें किसी विशिष्ट स्वर्गदूतीय वर्ग के रूप में नहीं पहचाना गया।
- source_word: ܚܝ̈ܠܘܬܐ
  choice: सेनाएँ
  rationale: स्वर्गदूतों के व्यवस्थित समूहों के लिए स्रोत के सैन्य-बिंब को सुरक्षित रखता है।
- source_word: ܡܠܬܝ
  choice: मेरे वचन
  rationale: ‘वचन’ आदेश, कथन या प्रभावी दिव्य घोषणा की संभावित अर्थ-सीमा को खुला रखता है।
- source_word: ܦܘܩܕܢܝ
  choice: मेरी आज्ञा
  rationale: दिव्य आदेश के स्पष्ट अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘जीवित प्राणियों’ की पहचान
  choice: सामान्य वर्णन ‘जीवित प्राणी’ रखा गया
  alternative: करूब या किसी अन्य नामित स्वर्गदूतीय वर्ग के रूप में पहचानना
  rationale: स्रोत उन्हें नाम से किसी विशिष्ट वर्ग में नहीं रखता; इसलिए अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ी गई।
- issue: अंतिम आगमन का कर्ता
  choice: ‘उनके आगमन तक’ की सर्वनामगत अस्पष्टता बनाए रखी गई
  alternative: धर्मियों के आने तक / स्वर्गदूतों के आने तक / नियत समय आने तक
  rationale: संदर्भ संभावित संकेत देता है, पर वाक्यांश का संबंध पूरी तरह निर्विवाद नहीं है; मुख्य पाठ में उसे चुपचाप निश्चित नहीं किया गया।
