  text: But for those who have been saved by their works, and for whom the law was hope, and understanding an expectation, and wisdom a confidence, wonders will appear in their time.
translation:
  language: hi
  text: परन्तु जो अपने कामों के द्वारा उद्धार पाए हैं, और जिनके लिए व्यवस्था आशा, समझ प्रत्याशा और बुद्धि भरोसा थी, उनके समय में अद्भुत बातें प्रकट होंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒ̈ܕܐ / works (consultation-layer reading)
  choice: कामों
  rationale: ‘कामों के द्वारा’ मूल कथन की साधनवाचक तीक्ष्णता और उससे जुड़ा धर्मवैचारिक तनाव बनाए रखता है; इसे व्याख्यात्मक रूप से ‘विश्वास’ या ‘सत्कर्म’ में नहीं बदला गया।
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: इस यहूदी अपोकैलिप्टिक संदर्भ में यह केवल सामान्य कानून नहीं, परमेश्वर की दी हुई व्यवस्था को सूचित करता है।
- source_word: ܣܘܟܠܐ / understanding
  choice: समझ
  rationale: सामान्य पाठक के लिए स्वाभाविक शब्द है और बौद्धिक-बोधात्मक अर्थ को बनाए रखता है।
- source_word: expectation
  choice: प्रत्याशा
  rationale: ‘आशा’ के साथ समानांतर रहते हुए भी उससे अलग भाव बनाए रखता है।
- source_word: wisdom
  choice: बुद्धि
  rationale: ‘समझ’ से भेद रखते हुए ज्ञान और विवेक के स्थायी गुण को व्यक्त करता है।
- source_word: wonders
  choice: अद्भुत बातें
  rationale: संज्ञात्मक बहुवचन को सहज आधुनिक हिन्दी में रखता है, बिना यह तय किए कि ये चिन्ह, घटनाएँ या रूपान्तरण हैं।
theological_decisions:
- issue: कामों के द्वारा उद्धार
  choice: जो अपने कामों के द्वारा उद्धार पाए हैं
  alternative: जो अपने सत्कर्मों के कारण बचाए गए हैं
  rationale: ‘कामों’ और ‘के द्वारा’ को बनाए रखने से पाठ का वास्तविक धर्मवैचारिक तनाव सुरक्षित रहता है; ‘सत्कर्म’ या ‘के कारण’ जोड़ना अर्थ को संप्रदायगत दिशा में अधिक निश्चित कर देता।
- issue: व्यवस्था, समझ और बुद्धि का समानांतर सम्बन्ध
  choice: व्यवस्था आशा, समझ प्रत्याशा और बुद्धि भरोसा थी
  alternative: वे व्यवस्था की आशा, समझ की प्रत्याशा और बुद्धि के भरोसे पर थे
  rationale: मूल के संक्षिप्त नामवाचक समानांतर ढाँचे को बनाए रखा गया है और उसे मनोवैज्ञानिक या साधनवाचक व्याख्या में नहीं बदला गया।
- issue: अद्भुत बातों का कर्ता और स्वरूप
  choice: अद्भुत बातें प्रकट होंगी
  alternative: परमेश्वर उन्हें चमत्कार दिखाएगा
  rationale: कर्ता और अद्भुत बातों का स्वरूप पाठ में स्पष्ट नहीं है; इसलिए परमेश्वर को प्रत्यक्ष कर्ता बनाना या इन्हें केवल चमत्कार कहना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’ से विरोध स्पष्ट होता है; तीन समानांतर पदों की संक्षिप्तता जानबूझकर सुरक्षित है। उपलब्ध सिरियाई अध्याय-पृष्ठ लक्ष्य पद से पहले कटता हुआ प्रतीत होता है, इसलिए पद के शब्दक्रम के लिए परामर्श-पाठ का सावधानी से उपयोग किया गया, जबकि निकटवर्ती सिरियाई प्रसंग में व्यवस्था, समझ और बुद्धि की शब्दावली से नियंत्रण किया गया।
