  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: hi
  text: क्योंकि वे इस दुःखमय संसार से छुड़ा लिए गए हैं और क्लेशों का बोझ उतार चुके हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: सीरियाई शब्द का अर्थ ‘जगत/संसार’ है; यहाँ मनुष्य के वर्तमान दुःखपूर्ण अस्तित्व के क्षेत्र के लिए स्वाभाविक हिन्दी ‘संसार’ चुना गया है।
- source_word: affliction / distresses (verse wording not fully visible in supplied page excerpt)
  choice: दुःखमय / क्लेशों
  rationale: उपलब्ध परामर्श-पाठ में एकवचन ‘affliction’ और बहुवचन ‘distresses’ का भेद है; हिन्दी में ‘दुःखमय संसार’ और ‘क्लेशों का बोझ’ इस अर्थगत भेद को स्वाभाविक ढंग से बनाए रखते हैं।
- source_word: delivered
  choice: छुड़ा लिए गए हैं
  rationale: कर्मवाच्य को बनाए रखा गया है, ताकि छुटकारे के कर्ता को पाठ से बाहर जाकर निश्चित न किया जाए।
- source_word: laid down the burden
  choice: बोझ उतार चुके हैं
  rationale: शाब्दिक चित्र को वर्तमान, सहज हिन्दी में रखा गया है; ‘उतार चुके हैं’ पूर्ण हो चुकी मुक्ति की दशा व्यक्त करता है।
theological_decisions:
- issue: छुटकारा देने वाले की पहचान
  choice: कर्मवाच्य ‘छुड़ा लिए गए हैं’
  alternative: ‘परमेश्वर ने उन्हें छुड़ा लिया है’
  rationale: पद में कर्ता स्पष्ट रूप से नामित नहीं है; इसलिए किसी विशिष्ट कर्ता को जोड़कर अंतर्निहित धार्मिक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। दिए गए सीरियाई अध्याय-अंश में पद 14 का पूरा वाक्य स्पष्ट रूप से दिखाई नहीं देता, इसलिए उपलब्ध मूल-भाषा प्रसंग के साथ परीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानी से उपयोग किया गया है।
