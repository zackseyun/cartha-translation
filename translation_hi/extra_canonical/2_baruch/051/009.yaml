translation:
  language: hi
  text: और वे उस समय को देखेंगे जो अभी उनसे छिपा हुआ है; और समय उन्हें बूढ़ा नहीं करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ / time-expression in the verse tradition
  choice: समय
  rationale: यह सामान्य आधुनिक हिन्दी में स्वाभाविक है और भावी युग तथा काल—दोनों की संभावित अर्थच्छाया को अनावश्यक रूप से सीमित नहीं करता।
- source_word: hidden / concealed-expression in the verse tradition
  choice: उनसे छिपा हुआ
  rationale: 'मूल संबंध को स्पष्ट और सहज हिन्दी में बनाए रखता है: वह समय अभी उनके अनुभव या दृष्टि से परे है।'
- source_word: age / grow old-expression in the verse tradition
  choice: बूढ़ा नहीं करेगा
  rationale: समय को कर्ता बनाए रखने से मूल कथन की सजीवता और अमर जीवन की ओर उसका संकेत सुरक्षित रहता है।
theological_decisions:
- issue: भावी अवस्था को ‘अनन्तकाल’ या किसी विशिष्ट पारलौकिक सिद्धान्त के रूप में स्पष्ट करना
  choice: सिर्फ ‘उस समय’ कहा गया
  alternative: ‘अनन्त युग’ या ‘आने वाला संसार’
  rationale: पद की वास्तविक अभिव्यक्ति को विस्तार देकर किसी विशिष्ट धर्मवैज्ञानिक व्याख्या में नहीं बदला गया।
- issue: समय के प्रभाव के समाप्त होने का अर्थ
  choice: ‘समय उन्हें बूढ़ा नहीं करेगा’
  alternative: ‘वे कभी नहीं मरेंगे’
  rationale: मृत्युहीनता का निष्कर्ष संदर्भ में संभव है, पर पद सीधे वृद्ध होने की प्रक्रिया की बात करता है; इसलिए तनाव और रूपक को ज्यों का त्यों रखा गया।
