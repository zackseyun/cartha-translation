  yaml_path: translation/extra_canonical/2_baruch/051/001.yaml
  text: And it shall be, after that appointed day has passed, that then the form of those who are condemned will be changed, and also the glory of those who are vindicated.
translation:
  language: hi
  text: और ऐसा होगा कि उस ठहराए हुए दिन के बीत जाने के बाद, दोषी ठहराए गए लोगों का रूप बदल जाएगा[a], और जिन्हें सही ठहराया गया है, उनका तेज भी बदल जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब दोषी ठहराए गए लोगों का रूप बाद में बदल जाएगा।”
    reason: सीरियाई वाक्य में काल-सूचक पद के संबंध को दूसरे ढंग से भी समझा जा सकता है।
lexical_decisions:
- source_word: ܨܘܪܬܐ / ܨܘܪܬܗܘܢ
  choice: रूप
  rationale: यह शब्द देहगत आकृति और दृश्य स्वरूप—दोनों अर्थों को समेटता है तथा अध्याय की रूपांतरण-संबंधी भाषा को ठोस बनाए रखता है।
- source_word: ܐܙܕܩܘ
  choice: जिनका पक्ष सही ठहराया गया है
  rationale: यह न्यायिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ‘धर्मी/धर्मसिद्ध ठहराए गए’ जैसे बाद के विशिष्ट धर्मवैज्ञानिक अर्थों को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ܬܫܒܘܚܬܗܘܢ
  choice: उनका तेज
  rationale: इस दर्शनात्मक प्रसंग में शब्द प्रतिष्ठा के साथ प्रकट दीप्ति को भी सूचित करता है; ‘तेज’ साधारण पाठक के लिए स्वाभाविक और रूपांतरण की छवि के अनुकूल है।
- source_word: ܗܘ ܝܘܡܐ
  choice: वह ठहराया हुआ दिन
  rationale: प्रसंग एक निश्चित अंतकालीन दिन की ओर संकेत करता है; ‘ठहराया हुआ’ उसकी नियुक्त प्रकृति को स्पष्ट करता है, बिना किसी अतिरिक्त पहचान को आरोपित किए।
theological_decisions:
- issue: ܐܙܕܩܘ में न्यायिक और धार्मिक अर्थ का संबंध
  choice: जिनका पक्ष सही ठहराया गया है
  alternative: जो धर्मी ठहराए गए हैं
  rationale: चुना हुआ पाठ न्यायिक समर्थन/निर्दोष-सिद्धि का भाव सुरक्षित रखता है, पर इसे किसी बाद की औचित्य-सिद्धि की धर्मवैज्ञानिक प्रणाली से नहीं बाँधता।
- issue: दोषियों और सही ठहराए गए लोगों के अंतकालीन रूपांतरण का संबंध
  choice: दोनों समूहों के विषय में पाठ का समानांतर कथन ज्यों का त्यों रखा गया है
  alternative: केवल धर्मियों के महिमामय रूपांतरण पर बल देना
  rationale: मूल पाठ दोषियों के रूप और सही ठहराए गए लोगों के तेज—दोनों में परिवर्तन का उल्लेख करता है; इस तनाव को समझाकर समाप्त नहीं किया गया।
