translation:
  language: hi
  text: तो फिर मनुष्यों ने किसलिए[a] अपना जीवन गँवा दिया, और पृथ्वी पर रहनेवालों ने किसके बदले अपना प्राण दे दिया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्यों”।
    reason: प्रश्नवाचक अभिव्यक्ति का अर्थ ‘किसलिए’ अथवा अधिक सीधे ‘क्यों’ किया जा सकता है।
lexical_decisions:
- source_word: ܚܝ̈ܐ
  choice: जीवन
  rationale: यहाँ मनुष्यों द्वारा खोई गई ‘life’ के लिए स्वाभाविक और प्रसंगानुकूल हिन्दी शब्द।
- source_word: ܢܦܫܐ
  choice: प्राण
  rationale: सिरियाई पद का अर्थ ‘प्राण/जीवन/आत्मा’ हो सकता है; ‘प्राण’ विनिमय और जीवन-हानि के समानांतर भाव को बनाए रखता है, बिना इसे केवल अमूर्त ‘आत्मा’ तक सीमित किए।
- source_word: ܚܠܦ
  choice: किसके बदले … दे दिया
  rationale: विनिमय के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है और प्रश्न को खुला रखता है।
theological_decisions:
- issue: ‘प्राण’ और ‘जीवन’ के बीच संबंध
  choice: पहले खंड में ‘जीवन’ और दूसरे में ‘प्राण’
  alternative: दोनों खंडों में ‘जीवन’, अथवा दूसरे में ‘आत्मा’
  rationale: अलग स्रोत-पदों और पद्य के समानांतर तनाव को बनाए रखा गया है; ‘आत्मा’ चुनने से अनावश्यक रूप से विशिष्ट दार्शनिक या सांप्रदायिक अर्थ जुड़ सकता था।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; ‘गँवा दिया’ और ‘दे दिया’ से दोनों समानांतर प्रश्न स्वाभाविक बने रहते हैं।
