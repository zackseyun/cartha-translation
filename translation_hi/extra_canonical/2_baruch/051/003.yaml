review_pass:
  verdict: revise
  source_fidelity: The supplied Ceriani Syriac reads ܕܗܘܘ ܐܙܕܩܘ ܒܙܒܢܗܘܢ, literally referring to those who “were justified/vindicated in their time.” It does not contain “by my law” at this point. The draft instead follows the English audit trail’s “by my law,” so it must be corrected to the primary source. The distinct main-clause subject, “their splendor,” is properly retained.
  naturalness: “उनकी महिमा की बात यह है” is understandable but overly explanatory and awkward as a rendering of the hanging topic. A direct Hindi hanging-topic construction is more natural. “उनके गौरव के प्रकाश” also shifts the source’s ‘beauty’ to ‘glory’; ‘उनकी सुंदरता के प्रकाश’ is closer and idiomatic.
  terminology: “धर्मी ठहराए गए” appropriately conveys the judicial/passive sense of ܐܙܕܩܘ without the misleading implication that they were morally sinless. “समझ-बूझ” and “बुद्धि की जड़” preserve the source’s sense and image. “रूप-परिवर्तनों में” preserves the audit trail’s deliberately marked plural expression without specifying the nature of the transformations.
  issues:
  - severity: high
    issue: “मेरी व्यवस्था के द्वारा” is not present in the supplied primary Syriac text.
    rationale: The source has ‘in their time’ (ܒܙܒܢܗܘܢ), whereas ‘my law’ appears to derive from the English audit trail or a divergent textual tradition. Source-first review requires translating the supplied source and not silently importing the audit wording.
  - severity: medium
    issue: “निर्दोष ठहराए गए” overstates the likely judicial sense.
    rationale: ‘निर्दोष’ naturally suggests factual innocence. ‘धर्मी ठहराए गए’ better represents being justified/vindicated while retaining the judicial register.
  - severity: low
    issue: “उनके गौरव के प्रकाश” substitutes ‘glory’ for the source’s ‘beauty.’
    rationale: The phrase ܢܘܗܪܐ ܕܐܝܩܪܗܘܢ refers to the light of their beauty/splendor; ‘सुंदरता’ keeps the lexical distinction from the preceding glory/splendor terms.
  revised_text: परन्तु जिनकी महिमा की बात है—वे जो अपने समय में धर्मी ठहराए गए, जिन्होंने अपने जीवन में समझ-बूझ रखी और अपने हृदय में बुद्धि की जड़ रोपी—तब उनका तेज रूप-परिवर्तनों में महिमामय किया जाएगा, और उनके मुख का स्वरूप उनकी सुंदरता के प्रकाश में बदल दिया जाएगा, ताकि वे उस संसार को प्राप्त करें और ग्रहण करें जो मरता नहीं और जिसकी प्रतिज्ञा उनसे की गई है।
  revised_footnotes: []
  revision_rationale: The revision follows the supplied Syriac’s ‘in their time’ rather than importing ‘by my law’ from the English audit trail. It also retains the Syriac/English syntactic distinction between the initial topic (‘their glory’) and the later grammatical subject (‘their splendor’), while using more idiomatic Hindi. The prior footnote is removed because its alternative depends on the unsupported ‘my law’ wording and no longer has an anchor.
