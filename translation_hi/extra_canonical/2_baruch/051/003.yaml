  yaml_path: translation/extra_canonical/2_baruch/051/003.yaml
  text: But as for the glory of those who have now been vindicated by my law—those who had understanding in their life, and those who planted in their heart the root of wisdom—their splendor will then be glorified in transformations, and the form of their face will be turned into the light of their beauty, so that they may receive the world that does not die, which is promised to them.
translation:
  language: hi
  text: परन्तु जो लोग अब मेरी व्यवस्था के द्वारा निर्दोष ठहराए गए हैं—जिन्होंने अपने जीवन में समझ से काम लिया और अपने हृदय में बुद्धि की जड़ रोपी—उनकी महिमा की बात यह है:[a] तब उनका तेज रूपांतरणों में महिमामय किया जाएगा, और उनके मुख का स्वरूप उनके गौरव के प्रकाश से दीप्त हो उठेगा, ताकि वे उस संसार को पा सकें और ग्रहण कर सकें जो कभी नहीं मरता और जिसकी प्रतिज्ञा उनसे की गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु जो लोग अब मेरी व्यवस्था के द्वारा निर्दोष ठहराए गए हैं—जिन्होंने अपने जीवन में समझ से काम लिया और अपने हृदय में बुद्धि की जड़ रोपी—उनकी महिमा तब रूपांतरणों में महिमामय की जाएगी।”
    reason: सिरिएक वाक्य के आरंभ को लटकते हुए विषय के रूप में पढ़ना अधिक संभावित है, पर उसे सीधे मुख्य उपवाक्य का कर्ता मानकर पढ़ना भी व्याकरणतः संभव समझा गया है।
lexical_decisions:
- source_word: ܐܙܕܩܘ
  choice: निर्दोष ठहराए गए
  rationale: यह न्यायिक निष्पापता/धर्मी ठहराए जाने का भाव व्यक्त करता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित किए।
- source_word: ܢܡܘܣܝ
  choice: मेरी व्यवस्था
  rationale: प्रथम पुरुष संबंधसूचक रूप और ‘कानून/व्यवस्था’ के अर्थ को स्वाभाविक बाइबलीय हिन्दी में रखता है।
- source_word: ܫܘܒܠܐ
  choice: समझ से काम लिया
  rationale: जीवन में समझ-बूझ रखने या उसके अनुसार चलने का व्यावहारिक भाव साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: बुद्धि की जड़
  rationale: मूल रूपक को यथावत रखता है।
- source_word: ܙܝܘܗܘܢ
  choice: उनका तेज
  rationale: लटकते हुए आरंभिक विषय ‘उनकी महिमा’ से अलग मुख्य उपवाक्य के नए कर्ता को स्पष्ट करता है।
- source_word: ܒܫܘܒ̈ܚܐ
  choice: रूपांतरणों में
  rationale: इस प्रसंग में बहुवचन शब्द पुनरुत्थान के रूप-परिवर्तनों की ओर संकेत करता है; असामान्य बहुवचन को अर्थगत तनाव सहित सुरक्षित रखा गया है।
- source_word: ܢܣܒܘܢ ܘܢܩܒܠܘܢ
  choice: पा सकें और ग्रहण कर सकें
  rationale: दोनों समांतर क्रियाओं को अनावश्यक रूप से एक में नहीं मिलाया गया।
- source_word: ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ
  choice: वह संसार जो कभी नहीं मरता
  rationale: ‘अमर संसार’ कहकर रूपक को समतल करने के बजाय स्रोत की सजीव अभिव्यक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: आरंभिक casus pendens और मुख्य उपवाक्य का कर्ता
  choice: ‘उनकी महिमा की बात यह है ... तब उनका तेज’
  alternative: ‘उनकी महिमा ... तब रूपांतरणों में महिमामय होगी’
  rationale: सिरिएक में ‘उनकी महिमा’ आरंभिक विषय है, जबकि मुख्य उपवाक्य में ‘उनका तेज’ नया कर्ता आता है। हिन्दी रचना दोनों को अलग रखती है।
- issue: व्यवस्था द्वारा निर्दोष ठहराया जाना
  choice: पाठ के न्यायिक कथन को सीधे रखा गया
  alternative: इसे नैतिक सुधार, अर्जित उद्धार, या किसी विशिष्ट धर्मसिद्धान्त के रूप में समझाना
  rationale: अनुवाद स्रोत के कथन को रखता है, पर उसके धर्मसैद्धान्तिक तंत्र का निर्णय नहीं करता।
- issue: भावी महिमा और रूपांतरण
  choice: कर्मवाच्य और बहुवचन ‘रूपांतरणों’ को बनाए रखा
  alternative: ‘वे स्वर्गदूत बन जाएँगे’ अथवा किसी निश्चित रूप की व्याख्या
  rationale: यहाँ रूपांतरण का स्वरूप आगे के प्रसंग से जुड़ा है; इस पद में उससे अधिक निश्चितता आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘परन्तु’, ‘व्यवस्था’, ‘बुद्धि की जड़’ और ‘ग्रहण’ जैसे बाइबलीय पदों के साथ वाक्य-संरचना को हिन्दी में स्वाभाविक बनाया गया है।
