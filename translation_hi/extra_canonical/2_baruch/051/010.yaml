base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/010.yaml
  text: For they will dwell in the heights of that world, and they will be made like the angels, and be made equal to the stars; and they will be changed into every form they desire, from beauty into loveliness, and from light into the splendor of glory.
translation:
  language: hi
  text: क्योंकि वे उस संसार के ऊँचे स्थानों में निवास करेंगे। उन्हें स्वर्गदूतों के समान बनाया जाएगा और तारों के बराबर किया जाएगा। वे जिस-जिस रूप की इच्छा करेंगे, उसमें बदल दिए जाएँगे—सुंदरता से मनोहरता में, और प्रकाश से महिमा के तेज में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “heights” (the supplied Syriac excerpt does not preserve the full target verse)'
  choice: ऊँचे स्थानों
  rationale: स्थान-सूचक बहुवचन और ऊर्ध्वता, दोनों को सहज हिन्दी में बनाए रखता है; इसे केवल ‘स्वर्ग’ कहकर अर्थ को संकीर्ण नहीं करता।
- source_word: 'English consultation: “made like the angels”'
  choice: स्वर्गदूतों के समान बनाया जाएगा
  rationale: परिवर्तन के कर्मवाच्य भाव को सुरक्षित रखता है और मनुष्यों को स्वर्गदूत घोषित करने के बजाय समानता व्यक्त करता है।
- source_word: 'English consultation: “made equal to the stars”'
  choice: तारों के बराबर किया जाएगा
  rationale: ‘समान’ और ‘बराबर’ के बीच, यहाँ समान दर्जे या तेज की खुली अर्थ-सीमा बनाए रखने के लिए स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: 'English consultation: “every form they desire”'
  choice: जिस-जिस रूप की इच्छा करेंगे
  rationale: इच्छित रूपों की व्यापकता व्यक्त करता है और परिवर्तन की प्रकृति को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: 'English consultation: “loveliness”'
  choice: मनोहरता
  rationale: ‘सुंदरता’ से अलग, आकर्षक और रमणीय सौंदर्य की बढ़ी हुई अवस्था का संकेत देता है।
- source_word: 'English consultation: “splendor of glory”'
  choice: महिमा का तेज
  rationale: ‘महिमा’ और दीप्ति, दोनों तत्त्वों को संक्षिप्त तथा बाइबिलीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परिवर्तन का कर्ता
  choice: कर्मवाच्य—‘बनाया जाएगा’, ‘किया जाएगा’, ‘बदल दिए जाएँगे’
  alternative: ईश्वर उन्हें बनाएगा/बदलेगा
  rationale: पाठ में निहित कर्ता को स्पष्ट नाम देकर जोड़ने के बजाय दैवी कर्मवाच्य और उसकी अर्थगत खुली जगह को बनाए रखा गया है।
- issue: स्वर्गदूतों और तारों से समानता
  choice: ‘के समान’ और ‘के बराबर’
  alternative: वे स्वर्गदूत और तारे बन जाएँगे
  rationale: पाठ समानता बताता है, तत्त्वगत पहचान नहीं; इसलिए रूपांतरण को किसी विशिष्ट देवदूत-विज्ञान या महिमामय शरीर-सिद्धांत में नहीं बदला गया।
- issue: ‘उस संसार’ की पहचान
  choice: उस संसार
  alternative: आनेवाला संसार/स्वर्ग
  rationale: संदर्भित परलोकिक संसार को किसी अधिक व्याख्यात्मक धर्मशास्त्रीय पद से प्रतिस्थापित नहीं किया गया।
