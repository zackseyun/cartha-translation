translation:
  language: hi
  text: क्योंकि वे उस संसार को देखेंगे, जो अभी उन्हें दिखाई नहीं देता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: यहाँ भावी, अभी अदृश्य जगत का संकेत है; ‘संसार’ सामान्य हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ܚܙܐ / ܡܬܚܙܐ (पद के पुनर्निर्मित दृश्यता-शब्द)
  choice: देखेंगे / दिखाई नहीं देता
  rationale: देखने और अभी दृश्य न होने के बीच मूल विरोध को स्पष्ट तथा सहज हिन्दी में बनाए रखता है।
- source_word: ܗܫܐ
  choice: अभी
  rationale: वर्तमान अवस्था और भावी दर्शन के कालगत विरोध को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: भावी संसार की वर्तमान अदृश्यता
  choice: ‘जो अभी उन्हें दिखाई नहीं देता’
  alternative: ‘जो अभी उनसे छिपा हुआ है’
  rationale: यह अनुवाद संसार के अस्तित्व या स्थान के विषय में अतिरिक्त व्याख्या किए बिना, देखने की भावी क्षमता और वर्तमान अदृश्यता के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में सहज। उपलब्ध अध्याय-पृष्ठ अंश में पद 8 का सटीक सिरिएक वाक्य स्पष्ट रूप से शामिल नहीं दिखता, इसलिए पाठ अंग्रेज़ी POB तथा निकटवर्ती सिरिएक प्रसंग में उपस्थित दर्शन/प्रकटन की शब्दावली के नियंत्रण में तैयार किया गया है।
