  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
translation:
  language: hi
  text: 'और मैंने कहा, “ये बातें किनके लिए और कितने लोगों के लिए होंगी? और उस समय को देखने के योग्य कौन गिना जाएगा?[a]


    परन्तु मैं जो कुछ सोचता हूँ, वह सब आपसे कहूँगा और आपके लोगों में से उन लोगों के विषय में आपसे पूछूँगा जिन्हें मैंने बड़ी संख्या में देखा है। वे आपकी वाचा से अलग हो गए और उन्होंने अपने ऊपर से आपकी व्यवस्था का जुआ उतार फेंका।


    और दूसरे लोगों को भी मैंने देखा, जिन्होंने अपनी व्यर्थता छोड़ दी[b] और आपके पंखों के नीचे शरण लेने के लिए भागे।


    तो इन लोगों का क्या होगा? वह अंतिम समय उन्हें किस प्रकार ग्रहण करेगा?


    या क्या इन लोगों का समय तौला जाएगा, और जिस ओर तराजू झुकेगा, उसी के अनुसार उनका न्याय किया जाएगा?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्तमान सिरियाई पाठ-संग्रह में अध्याय 40 का अंत और अध्याय 42 का आरंभ भी कुछ अंश तक सम्मिलित हैं। इस प्रश्न का अर्थ स्पष्ट है, पर इसकी ठीक सीमा क्मोस्को के पृष्ठ 576 की सहायता से निश्चित की गई है।
    reason: textual_variant
  - marker: b
    text: इस स्थान पर सेरियानी के सिरियाई पाठ की पंक्ति कुछ अनिश्चित है; “अपनी व्यर्थता” का पाठ क्मोस्को के लातीनी सहायक साक्ष्य से समर्थित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ܩܝܡܐ / ܩܝܡ̈ܐ
  choice: आपकी वाचा
  rationale: शब्द में प्रतिज्ञा या प्रतिबद्धता का भाव भी है, पर इस यहूदी प्रलय-साहित्यिक संदर्भ में “वाचा” उसके सामुदायिक और ईश्वर-संबंधी अर्थ को सबसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܢܡܘܣܐ
  choice: आपकी व्यवस्था
  rationale: “व्यवस्था का जुआ” स्थापित धार्मिक रूपक को बनाए रखता है और यहाँ केवल सामान्य शिक्षा की अपेक्षा विधिक तथा वाचागत अर्थ को बेहतर व्यक्त करता है।
- source_word: ܡܘܒܠܐ / locally uncertain phrase
  choice: अपनी व्यर्थता
  rationale: सेरियानी की पंक्ति स्थानीय रूप से अनिश्चित है, पर लातीनी सहायक साक्ष्य vanitatem suam का समर्थन करता है। “व्यर्थता” नैतिक-आध्यात्मिक खोखलेपन को बनाए रखती है और अर्थ को अनावश्यक रूप से किसी विशेष आचरण तक सीमित नहीं करती।
- source_word: ܓܢܦ̈ܐ / phrase preserved by control witness
  choice: आपके पंखों के नीचे शरण लेने के लिए
  rationale: पंखों की मूल सुरक्षात्मक छवि को अक्षुण्ण रखते हुए “शरण लेने” से आधुनिक हिन्दी में भागकर आश्रय पाने का आशय स्वाभाविक बनता है।
- source_word: ܡܬܬܚܒܘ / balance-weighing expression
  choice: तौला जाएगा
  rationale: इसके बाद आने वाली तराजू के झुकने की छवि दिखाती है कि यहाँ सामान्य मूल्यांकन नहीं, बल्कि तौलकर न्याय करने का रूपक है।
theological_decisions:
- issue: वाचा से हटने वालों और लौटकर शरण लेने वालों का परिणाम
  choice: उनके परिणाम को ईश्वर के सामने रखे गए खुले प्रश्न के रूप में रहने दिया गया है।
  alternative: अगले अध्याय के उत्तर से पहले ही उनके विषय में निश्चित दण्ड या उद्धार घोषित करना।
  rationale: बारूक अभी पूछ रहा है कि अन्तिम समय इन दोनों प्रकार के लोगों को कैसे ग्रहण करेगा; इसलिए पाठ की प्रतीक्षा और धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
- issue: “आपके पंखों के नीचे” की छवि का अर्थ
  choice: ईश्वरीय शरण के पंखों वाले प्रत्यक्ष रूपक को बनाए रखा गया है।
  alternative: इसे केवल “आपकी सुरक्षा में” कहकर रूपक को समतल कर देना।
  rationale: यह छवि पश्चात्ताप को केवल नैतिक सुधार नहीं, बल्कि ईश्वर की शरण की ओर भागने के रूप में प्रस्तुत करती है।
- issue: समय को तौले जाने की अस्पष्ट अभिव्यक्ति
  choice: “इन लोगों का समय तौला जाएगा” के असामान्य रूपक को सुरक्षित रखा गया है।
  alternative: इसे स्पष्ट करके “उनके कर्म तौले जाएँगे” या “उनका मूल्यांकन होगा” कहना।
  rationale: मूल और सहायक पाठ समय तथा तराजू की तनावपूर्ण छवि रखते हैं; “कर्म” जोड़ने से पाठ की वास्तविक अस्पष्टता अनावश्यक रूप से सुलझ जाती।
