  text: And behold, suddenly a spirit of strength lifted me up and carried me above the wall of Jerusalem; and I saw four angels standing at the four corners of the city, each one holding a flaming torch in his hands.
translation:
  language: hi
  text: और देखो, अचानक सामर्थ्य की एक आत्मा ने मुझे उठा लिया और मुझे यरूशलेम की दीवार के ऊपर ले गई। मैंने नगर के चारों कोनों पर चार स्वर्गदूतों को खड़ा देखा; उनमें से हर एक अपने हाथों में आग की मशाल[a] लिए हुए था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर एक अपने हाथों में एक मशाल लिए हुए था।’
    reason: अंग्रेज़ी POB audit trail में दर्ज संक्षिप्त वैकल्पिक rendering को सुरक्षित रखता है; मुख्य पाठ स्रोत के ‘आग’ और ‘हाथों में’ संबंधी विवरण को बनाए रखता है।
lexical_decisions:
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: एक सामर्थ्यशाली आत्मा
  rationale: शाब्दिक रूप ‘सामर्थ्य की आत्मा’ है; प्रसंग में यह बारूक को उठाने वाली प्रबल आत्मिक शक्ति को दर्शाता है। सहज हिन्दी में विशेषणात्मक रूप अर्थ को स्पष्ट रखता है।
- source_word: ܫܘܪܐ ܕܐܘܪܫܠܡ
  choice: यरूशलेम की शहरपनाह
  rationale: यह नगर की रक्षात्मक दीवार का संकेत है; ‘शहरपनाह’ आधुनिक हिन्दी में संक्षिप्त और सटीक है।
- source_word: ܐܪܒܥܬܝܗܝܢ ܙܘܝ̈ܬܗ̇ ܕܡܕܝ̣ܢܬܐ
  choice: नगर के चारों कोनों पर
  rationale: स्रोत की स्थान-संबंधी अभिव्यक्ति और चारों दिशाओं में स्थित स्वर्गदूतों की छवि को सीधे सुरक्षित रखता है।
- source_word: ܠܡܦܝܕܐ ܕܢܘܪܐ ... ܒܐܝܕܘܗܝ
  choice: अपने हाथों में एक जलती हुई मशाल
  rationale: ‘आग की मशाल’ और हाथों में धारण किए होने—दोनों स्रोत-विवरणों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘आत्मा’ की पहचान
  choice: एक सामर्थ्यशाली आत्मा
  alternative: सामर्थ्य की आत्मा / पवित्र आत्मा
  rationale: स्रोत इसे स्पष्ट रूप से ‘पवित्र आत्मा’ नहीं कहता; इसलिए किसी विशिष्ट धर्मवैज्ञानिक पहचान को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ से दर्शन-वृत्तांत की आकस्मिकता बनी रहती है; ‘शहरपनाह’ नगर की बाहरी दीवार के अर्थ को स्पष्ट करता है।
