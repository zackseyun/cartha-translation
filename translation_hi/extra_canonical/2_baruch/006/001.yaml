base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/006/001.yaml
  text: And it happened on the next day that, behold, the forces of the Chaldeans surrounded the city. And at evening time I, Baruch, left the people, and I went out and stood by the oak, and I was grieving over Zion and lamenting over the captivity that had come upon the people. And I was filled with a spirit of strength, and I was lifted up on high above the square of Jerusalem. And I saw, behold, four angels standing at the four corners of the city, each of them holding a torch.
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि देखो, कसदियों की सेनाओं ने नगर को घेर लिया। शाम के समय मैं, बारूक, लोगों के बीच से निकलकर बलूत के पेड़ के पास गया और वहाँ खड़ा हो गया। मैं सिय्योन पर शोक कर रहा था और लोगों पर आई बंधुआई के कारण विलाप कर रहा था।[a] और मैं सामर्थ्य की आत्मा से भर गया और यरूशलेम के चौक के बहुत ऊपर उठा लिया गया। और मैंने देखा कि नगर के चारों कोनों पर चार स्वर्गदूत खड़े थे और हर एक के हाथ में एक मशाल थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले के एक पाठ-रूप में पद का अनुवाद यहीं समाप्त होता था; आगे का वाक्यांश उपलब्ध सिरियाई पाठ में इसी वर्णन को जारी रखता है।
    reason: previous_rendering
lexical_decisions:
- source_word: ܡܢܐ ܕܡܚܪ
  choice: अगले दिन
  rationale: यह सामान्य काल-सूचक पद है; ‘अगले दिन’ आधुनिक हिन्दी में स्वाभाविक है और कथा का क्रम बनाए रखता है।
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  choice: कसदियों की सेनाओं
  rationale: नियंत्रक पाठ से कसदियों की सैन्य शक्तियों का आशय पुष्ट होता है। बहुवचन ‘सेनाओं’ स्रोत के रूप के निकट और हिन्दी में स्पष्ट है।
- source_word: ܘܐܬܬܙܝܥܝ ... ܒܟܝܐ
  choice: शोक कर रहा था ... विलाप कर रहा था
  rationale: दोनों अभिव्यक्तियाँ आंतरिक दुःख और प्रकट विलाप के संयुक्त भाव को बनाए रखती हैं।
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: सामर्थ्य की आत्मा
  rationale: यह स्रोत की सशक्त करने वाली शक्ति का निकट अनुवाद है और किसी बाद की निश्चित पारिभाषिक धार्मिक अभिव्यक्ति को आरोपित नहीं करता।
- source_word: ܫܘܩܐ ܕܐܘܪܫܠܡ
  choice: यरूशलेम के चौक
  rationale: संज्ञा सड़क, बाज़ार या खुले नगर-स्थान को सूचित कर सकती है। दृश्य के संदर्भ में ‘चौक’ उपयुक्त है, पर इसकी स्थानगत व्यापकता को पादटिप्पणी में स्वीकार किया गया है।
- source_word: ܠܡܦܝܕܐ
  choice: एक मशाल
  rationale: अगले पाठ-संदर्भ में अग्निमय वस्तु का संकेत होने से ‘मशाल’ दृश्य की तीव्रता को ‘दीपक’ की अपेक्षा बेहतर व्यक्त करती है।
- source_word: ܒܨܝܘܢ
  choice: सिय्योन के लिए
  rationale: स्थान-नाम को हिन्दी बाइबलीय प्रचलन के अनुसार रखा गया है और शोक के संबंध को स्पष्ट करने के लिए ‘के लिए’ प्रयुक्त है।
theological_decisions:
- issue: ‘सामर्थ्य की आत्मा’ की पहचान
  choice: सामर्थ्य की आत्मा
  alternative: पवित्र आत्मा / सामर्थ्यवान आत्मा
  rationale: स्रोत केवल ‘सामर्थ्य की आत्मा’ कहता है; इसे स्पष्ट रूप से पवित्र आत्मा ठहराना या गुणविशेष में बदलना स्रोत की वास्तविक खुली अर्थ-सीमा को संकुचित करता।
- issue: स्वर्गदूतों के हाथ की वस्तु
  choice: मशाल
  alternative: दीपक
  rationale: अग्निमय न्याय-दृश्य के निकट संदर्भ के कारण ‘मशाल’ चुना गया, बिना स्वर्गदूतों की भूमिका का अतिरिक्त धार्मिक अर्थ निर्धारित किए।
