  register: आधुनिक मानक हिन्दी, देवनागरी और सामान्य पाठकों के लिए सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘बारूक’, ‘कसदी’, ‘सिय्योन’ और ‘यरूशलेम’ जैसे नाम प्रचलित हिन्दी बाइबलीय रूपों में रखे गए हैं। स्रोत की पुनरुक्त दृश्यात्मक शैली को अनावश्यक रूप से समतल नहीं किया गया है।
