  text: And not only did they kill the impious who were living, but they also brought the bones of the dead out from the graves and burned them with fire.
translation:
  language: hi
  text: उन्होंने न केवल जीवित दुष्टों को मार डाला, बल्कि मरे हुए लोगों की हड्डियाँ भी कब्रों से निकालकर आग में जला दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܨ̈ܥܨܥܐ
  choice: दुष्टों
  rationale: संदर्भ में यह जीवित अधर्मी या दुष्ट लोगों के लिए प्रयुक्त है; आधुनिक हिन्दी में “दुष्टों” सहज और स्पष्ट है।
- source_word: ܓܪ̈ܡܐ
  choice: हड्डियाँ
  rationale: मृतकों को कब्रों से निकालने और जलाने के प्रसंग में स्रोत का आशय अस्थियों से है; सामान्य पाठक के लिए “हड्डियाँ” स्वाभाविक है।
- source_word: ܒܢܘܪܐ
  choice: आग में
  rationale: जलाने के साधन को हिन्दी में स्वाभाविक रूप से “आग में जला दीं” कहा गया है।
theological_decisions:
- issue: कर्ता की संख्या
  choice: उन्होंने … मार डाला … निकालकर … जला दीं
  alternative: उसने … मार डाला; उन्होंने … निकाला और जलाया
  rationale: उपलब्ध सिरिएक पाठ में इस वाक्य की कार्रवाइयाँ बहुवचन कर्ता से जुड़ी प्रतीत होती हैं; इसलिए पूरे वाक्य में बहुवचन बनाए रखना अधिक संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और वर्णनात्मक रखी गई है। “कब्रों” सामान्य पाठकों के लिए “समाधियों” से अधिक स्वाभाविक है।
