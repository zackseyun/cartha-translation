base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/004.yaml
  text: And the workers of magic he burned with fire; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.
translation:
  language: hi
  text: और उसने जादू-टोना करने वालों को आग में जला दिया। जो झूठे भविष्यद्वक्ता लोगों को भटका रहे थे, उन्हें भी उसने जलने के लिए आग के हवाले कर दिया। और जिन लोगों ने उनके जीते-जी उनकी बात मानी थी, उन्हें उसने जलधारा में फेंक दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जलधारा” का अनुवाद “नाला” या “घाटी” भी हो सकता है।
    reason: सिरिएक ܢܚܠܐ जलधारा, नाला अथवा घाटी के अर्थ में प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: ܥܒܕܐ ܚܘ̈ܒܐ
  choice: जादू-टोना करने वाले
  rationale: स्रोत का पदबंध जादुई क्रियाएँ करने वालों को सूचित करता है; आधुनिक हिन्दी में यह सहज और स्पष्ट अभिव्यक्ति है।
- source_word: ܢܒܝ̈ܐ … ܕܓ̈ܠܐ
  choice: झूठे भविष्यद्वक्ता
  rationale: ‘नबी’ के लिए सामान्य हिन्दी बाइबलीय पद ‘भविष्यद्वक्ता’ रखा गया और झूठेपन का विशेषण स्पष्ट रूप से बनाए रखा गया।
- source_word: ܡܣܒܝܢ … ܠܥܡܡܐ
  choice: लोगों को भटका रहे थे
  rationale: यहाँ प्रेरणार्थक अर्थ लोगों को गलत राह पर ले जाने का है; ‘भटका रहे थे’ स्वाभाविक हिन्दी में वही भाव देता है।
- source_word: ܒܢܚܠܐ
  choice: नाले में
  rationale: सिरिएक शब्द का अर्थ जलधारा, नाला अथवा घाटी हो सकता है; प्रसंग में जलधारा-सूचक ‘नाला’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: दंड देने वाले कर्ता की पहचान
  choice: सर्वनाम ‘उसने’ बनाए रखा
  alternative: कर्ता का नाम जोड़ना
  rationale: इस पद में कर्ता पूर्ववर्ती संदर्भ से समझा जाता है; नाम जोड़ने से स्रोत से अधिक स्पष्टता आयात होती।
- issue: ‘उनके जीते-जी’ का संबंध
  choice: इसे झूठे भविष्यद्वक्ताओं के जीवनकाल से जोड़ा
  alternative: सुनने वाले लोगों के अपने जीवनकाल से जोड़ना
  rationale: सिरिएक सर्वनाम का निकटतम और प्रसंगानुकूल पूर्वपद झूठे भविष्यद्वक्ता हैं; फिर भी हिन्दी वाक्य को स्रोत की संबंधगत संरचना के निकट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत की पुनरुक्त दंडात्मक संरचना बनाए रखते हुए हिन्दी में छोटे वाक्य किए गए हैं। उपलब्ध अंग्रेज़ी पादटिप्पणी में पुरानी प्रतिलिपि-दुहराव त्रुटि थी, इसलिए उसे पाठगत विकल्प नहीं माना गया।
