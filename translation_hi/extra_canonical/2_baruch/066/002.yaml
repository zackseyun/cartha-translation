base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/002.yaml
  text: And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and raised the horn of the holy ones, and exalted the righteous, and honored all who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and wizards from the land.
translation:
  language: hi
  text: और उसने देश को मूर्तियों से शुद्ध किया, अपवित्र किए गए पात्रों को पवित्र किया और वेदी पर भेंटों को फिर से चढ़ाया। उसने पवित्र जनों का सींग ऊँचा किया[a], धर्मियों को प्रतिष्ठित किया और उन सभी का सम्मान किया जो समझ-बूझ में बुद्धिमान थे। उसने याजकों को फिर से उनकी सेवा में लगाया और जादू-टोना करने वालों, शकुन-विचारने वालों और ओझाओं को देश से निकाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सींग ऊँचा किया” सामर्थ्य, सम्मान या विजय बढ़ाने का रूपक है।
    reason: मूल सामी रूपक को मुख्य पाठ में सुरक्षित रखते हुए आधुनिक पाठक के लिए उसका आशय स्पष्ट करना।
lexical_decisions:
- source_word: ܕܚ̈ܠܬܐ / idol terminology (reconstructed from verse context)
  choice: मूर्तियाँ
  rationale: योशिय्याह के सुधारों के प्रसंग में देश से हटाई गई उपासना-वस्तुओं के लिए यह सहज और स्पष्ट हिन्दी है।
- source_word: ܡܐܢ̈ܐ
  choice: पात्र
  rationale: पवित्रस्थान अथवा उपासना में प्रयुक्त पात्रों के लिए प्रचलित बाइबलीय हिन्दी शब्द।
- source_word: ܩܪܢܐ
  choice: सींग
  rationale: मूल रूपक को बनाए रखा गया है; इसे केवल ‘सामर्थ्य’ या ‘प्रतिष्ठा’ कह देने से स्रोत की काव्यात्मक छवि मिट जाती।
- source_word: ܩܕܝ̈ܫܐ
  choice: पवित्र जन
  rationale: व्यक्तियों के समूह को सूचित करने वाले बहुवचन का स्वाभाविक हिन्दी रूप।
- source_word: ܚܪ̈ܫܐ / ܙܟܘܪ̈ܐ / ܝܕܘ̈ܥܐ (occult-practitioner triad)
  choice: जादू-टोना करने वाले, शकुन-विचारने वाले और ओझा
  rationale: तीन अलग प्रकार के निषिद्ध गूढ़-अभ्यासियों का भेद बनाए रखते हुए आधुनिक पाठक के लिए समझने योग्य शब्द चुने गए हैं।
theological_decisions:
- issue: ‘पवित्र जनों का सींग ऊँचा करना’ रूपक
  choice: रूपक को मुख्य पाठ में यथावत रखा
  alternative: पवित्र जनों का सामर्थ्य/सम्मान बढ़ाया
  rationale: स्रोत की प्रतीकात्मक भाषा और उसकी संभावित बहुअर्थता को किसी एक व्याख्या में सीमित नहीं किया गया।
- issue: गूढ़-अभ्यासियों की तीसरी श्रेणी
  choice: ओझा
  alternative: प्रेत-साधक / तांत्रिक / ज्ञानी कहलाने वाले
  rationale: प्रसंग में यह सामान्य ‘पापियों’ का उल्लेख नहीं, बल्कि निषिद्ध गूढ़ साधना करने वालों की विशिष्ट श्रेणी है; ‘ओझा’ आधुनिक हिन्दी में सबसे सुबोध निकटार्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। समानांतर क्रियाओं की लय बनाए रखने के लिए ‘शुद्ध किया’, ‘पवित्र किया’, ‘फिर से स्थापित की’, ‘प्रतिष्ठित किया’ और ‘सम्मान किया’ जैसे रूप प्रयुक्त हुए हैं। स्रोत-पृष्ठ का अंश अध्याय-बकेट है और लक्षित पद की सीमाएँ प्रत्यक्षतः अस्पष्ट हैं; इसलिए उपलब्ध स्रोत-समीक्षा और अंकेक्षित अंग्रेज़ी परामर्श-पाठ के सहारे, बिना सांप्रदायिक विस्तार जोड़े, अनुवाद प्रस्तुत किया गया है।
