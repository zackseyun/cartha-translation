base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/001.yaml
  text: And the tenth bright waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the king (or change source word to ܚܝܠܬܢܐ) with the fullness of his heart and with all his soul.
translation:
  language: hi
  text: और जो दसवाँ उज्ज्वल जल तुमने देखा था—वह यहूदा के राजा योशिय्याह[a] की पीढ़ी की शुद्धता है। उस समय केवल उसी ने अपने हृदय की पूर्णता और अपने सारे प्राण से सामर्थी के अधीन हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान पर उपलब्ध सिरियाई पाठ क्षतिग्रस्त है और उसमें ‘आमोन’ पढ़ा जा सकता है; किन्तु आगे वर्णित सुधारों और ऐतिहासिक क्रम से ‘योशिय्याह’ अभिप्रेत है।
    reason: पाठगत रूप से क्षतिग्रस्त राजकीय नाम और संदर्भ से समर्थित पाठ—दोनों को स्पष्ट रखना।
lexical_decisions:
- source_word: ܒ̈ܬܪ ܒܣܝ̈ܡܐ
  choice: दसवाँ उज्ज्वल जल
  rationale: दृष्टान्त में उज्ज्वल और काले जल का क्रम संरचनात्मक है। उपलब्ध पाठ और अध्याय-संदर्भ के आधार पर इसे दसवें उज्ज्वल जल के रूप में स्पष्ट रखा गया है।
- source_word: ܕܫܘܝܐ
  choice: शुद्धता
  rationale: यह शब्द योशिय्याह के समय के नैतिक और उपासना-संबंधी सुधार को सूचित करता है; ‘शुद्धता’ दोनों पक्षों को समेटती है।
- source_word: ܚܝܠܬܢܐ
  choice: सामर्थी
  rationale: संदर्भ में यह परमेश्वर के लिए आदरसूचक उपाधि है। ‘सामर्थी’ इसके ईश्वरीय और श्रद्धापूर्ण बल को बनाए रखता है।
- source_word: ܡܢ ܡܠܝܘ ܠܒܗ ܘܡܢ ܟܠܗ̇ ܢܦܫܗ
  choice: अपने हृदय की पूरी परिपूर्णता और अपने सारे प्राण से
  rationale: अनुवाद में ‘हृदय की परिपूर्णता’ और ‘सारा प्राण’ के बीच स्रोत की जानबूझकर रखी गई शब्दावली का अंतर सुरक्षित किया गया है।
theological_decisions:
- issue: अध्याय के आरम्भ में क्षतिग्रस्त राजकीय नाम
  choice: योशिय्याह, यहूदा का राजा
  alternative: आमोन, यहूदा का राजा
  rationale: पांडुलिपि-पृष्ठ का पाठ इस स्थान पर अस्थिर है, पर आगे वर्णित व्यापक धार्मिक सुधार, उज्ज्वल जल का संदर्भ और ऐतिहासिक क्रम योशिय्याह का प्रबल समर्थन करते हैं। पाठगत विकल्प को पादटिप्पणी में बनाए रखा गया है।
- issue: परमेश्वर के लिए उपाधि
  choice: सामर्थी
  alternative: शक्तिशाली जन
  rationale: यहाँ साधारण विशेषण नहीं, श्रद्धापूर्ण ईश्वरीय उपाधि अपेक्षित है; ‘सामर्थी’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और कथात्मक शैली रखी गई है। दृष्टान्त की पारिभाषिक अभिव्यक्ति ‘उज्ज्वल जल’ तथा ईश्वरीय उपाधि ‘सामर्थी’ को लगातार उपयोग योग्य रूप में प्रस्तुत किया गया है।
