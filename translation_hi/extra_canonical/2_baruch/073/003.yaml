  source_fidelity: 'The Hindi accurately reflects the Syriac: ܘܬܘܒ conveys the continuing sense of “again/further,” ܠܐ ܢܡܘܬ ܕܠܐ ܒܙܒܢܗ negates dying outside/before one’s appointed time, and the final clause negates the sudden occurrence of an afflicting adversity. It also agrees with the English POB audit trail without overstating the text as abolishing death altogether.'
