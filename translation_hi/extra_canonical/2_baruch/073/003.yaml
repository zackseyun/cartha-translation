  text: And no one will again die before his time, nor will any sudden adversity come to pass.
translation:
  language: hi
  text: फिर कोई अपने समय से पहले नहीं मरेगा, और न कोई विपत्ति अचानक आ पड़ेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܬܘܒ
  choice: फिर
  rationale: यह पद पिछले वर्णन को आगे बढ़ाता है और भावी अवस्था में एक और परिवर्तन जोड़ता है।
- source_word: ܕܠܐ ܒܙܒܢܗ
  choice: अपने समय से पहले
  rationale: शाब्दिक अर्थ ‘अपने समय पर नहीं’ है; इस संदर्भ में आशय असमय मृत्यु से है।
- source_word: ܡܕܡ ܡܥܝܩ
  choice: कोई विपत्ति
  rationale: यह पदबंध किसी कष्टदायक या संकटपूर्ण घटना को सूचित करता है; ‘विपत्ति’ सहज और व्यापक हिन्दी समतुल्य है।
- source_word: ܢܓܕܫ ... ܣܡܡܠܐ
  choice: अचानक आ पड़ेगी
  rationale: ܢܓܕܫ का भाव ‘घटित होना/आ पड़ना’ है और अंतिम क्रियाविशेषण आकस्मिकता व्यक्त करता है; हिन्दी में यह संयोजन स्वाभाविक है।
theological_decisions:
- issue: भावी अवस्था में मृत्यु के कथन का स्वरूप
  choice: ‘अपने समय से पहले नहीं मरेगा’ के रूप में असमय मृत्यु का निषेध रखा गया
  alternative: ‘कोई फिर कभी नहीं मरेगा’
  rationale: स्रोत केवल असमय मृत्यु का निषेध करता है, मृत्यु का पूर्ण उन्मूलन नहीं; इसलिए कथन को अधिक निरपेक्ष नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और भविष्यवाणी-सदृश लय। ‘आ पड़ेगी’ आकस्मिक विपत्ति के भाव को स्वाभाविक रूप से व्यक्त करता है।
