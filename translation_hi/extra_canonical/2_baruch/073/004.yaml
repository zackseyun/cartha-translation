base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073/004.yaml
  text: And judgments, and accusations, and contentions, and retaliations, and bloodshed, and cravings, and envy, and hatred, and everything like these will pass away into condemnation when they are removed.
translation:
  language: hi
  text: और न्याय, अभियोग, झगड़े, प्रतिशोध, रक्तपात, लालसाएँ, ईर्ष्या, घृणा और इन जैसी सभी बातें दण्ड के लिए उठा दी जाएँगी, जब वे हटा दी जाएँगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम सीरियाई पदबंध का शाब्दिक भाव लगभग यह है: “दोष-दण्ड की ओर उठा दी जाएँगी, जब वे हटा दी जाएँगी।” ‘दोष-दण्ड’ और ‘हटा दी जाएँगी’ का ठीक व्याकरणिक संबंध कठिन है।'
    reason: मुख्य पाठ मूल की दोनों क्रियाओं और उनकी अस्पष्टता को यथासंभव रखता है; टिप्पणी कठिन पदबंध का शाब्दिक आधार स्पष्ट करती है।
lexical_decisions:
- source_word: ܕ̈ܝܢܐ
  choice: न्याय-विचार
  rationale: बहुवचन शब्द न्यायिक निर्णयों या न्यायिक कार्रवाइयों को सूचित कर सकता है; इस नकारात्मक सूची में ‘न्याय-विचार’ साधारण ‘न्याय’ की अपेक्षा अधिक स्वाभाविक है और अर्थ को अन्याय तक सीमित नहीं करता।
- source_word: ܡܕ̈ܝܢܝܘܬܐ
  choice: आरोप
  rationale: यह न्यायिक आरोपों अथवा अभियोगों के अर्थ में प्रयुक्त है; आधुनिक हिन्दी में ‘आरोप’ स्पष्ट और सहज है।
- source_word: ܚܪ̈ܝܢܐ
  choice: झगड़े
  rationale: शब्द विवाद या कलह का बोध कराता है; ‘झगड़े’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ܬܒ̈ܥܬܐ
  choice: प्रतिशोध
  rationale: मूल में दावा, पीछा करके बदला लेना या प्रतिकार की मांग का अर्थ संभव है; सूची के संदर्भ में ‘प्रतिशोध’ उपयुक्त है।
- source_word: ܕܡܐ
  choice: रक्तपात
  rationale: शाब्दिक अर्थ ‘लहू’ है, पर यहाँ हिंसक रक्त बहाने का लाक्षणिक अर्थ है।
- source_word: ܪ̈ܓܝܓܬܐ
  choice: वासनाएँ
  rationale: यह तीव्र इच्छाओं या लालसाओं को दर्शाता है; नकारात्मक नैतिक सूची में ‘वासनाएँ’ अर्थानुकूल है, यद्यपि इसे केवल यौन अर्थ तक सीमित नहीं समझना चाहिए।
- source_word: ܚܣܡܐ
  choice: ईर्ष्या
  rationale: शब्द ईर्ष्या या डाह को व्यक्त करता है; ‘ईर्ष्या’ मानक और व्यापक हिन्दी रूप है।
- source_word: ܣܢܐܬܐ
  choice: घृणा
  rationale: मूल का सीधा अर्थ घृणा या बैर है।
- source_word: ܠܚܘܝܒܐ ܢܬ̈ܪܝܡܢ ܟܕ ܢܫ̈ܬܩܠܢ
  choice: दोषी ठहराकर दूर कर दी जाएँगी
  rationale: कठिन अंतिम पदबंध में दोष-दण्ड और हटा दिए जाने, दोनों भाव हैं; हिन्दी में दोनों को स्पष्ट रखते हुए क्रम को सहज बनाया गया है।
theological_decisions:
- issue: अंतिम सूची का दण्ड और निष्कासन से संबंध
  choice: बुराइयों को स्वयं दोषी ठहराकर दूर किया जाना
  alternative: इन बुराइयों के कर्ताओं का दण्डित होकर दूर किया जाना
  rationale: व्याकरणिक रूप से सूची की वस्तुएँ ही क्रियाओं का निकटतम कर्ता हैं। पाठ में व्यक्तियों को जोड़ना अर्थ की अनावश्यक व्याख्या होता।
- issue: ܪ̈ܓܝܓܬܐ का नैतिक दायरा
  choice: ‘वासनाएँ’ को व्यापक हानिकारक लालसाओं के अर्थ में रखना
  alternative: इसे केवल यौन वासनाओं के रूप में समझना
  rationale: मूल शब्द इच्छाओं और लालसाओं का व्यापक क्षेत्र रखता है; किसी एक सांप्रदायिक या नैतिक वर्गीकरण तक सीमित करना उचित नहीं।
