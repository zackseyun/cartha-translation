  text: For these are the things that filled this world with evils, and because of these the life of mankind was greatly troubled.[c]
translation:
  language: hi
  text: क्योंकि इन्हीं बातों ने इस संसार को बुराइयों से भर दिया, और इन्हीं के कारण मानवजाति का जीवन बहुत कष्टमय हो गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: उपलब्ध सिरिएक पृष्ठ पर यह वाक्य आरम्भ होने के तुरंत बाद पाठ कट जाता है; शेष अनुवाद अध्याय-संदर्भ और संरक्षित परामर्श-पाठ के आधार पर दिया गया है।
    reason: प्राथमिक स्रोत-अंश की भौतिक अपूर्णता को पाठक से पारदर्शी रूप से बताना।
lexical_decisions:
- source_word: ܗܢܝܢ ܐܢܝܢ ܓܝܪ
  choice: क्योंकि इन्हीं बातों ने
  rationale: ܓܝܪ कारणसूचक है और स्त्रीलिंग बहुवचन संकेतवाचक पद पूर्ववर्ती बुराइयों की सूची की ओर लौटता है; हिन्दी में संदर्भ को स्वाभाविक बनाने के लिए ‘बातों’ जोड़ा गया है।
- source_word: this world with evils
  choice: इस संसार को बुराइयों से भर दिया
  rationale: उपलब्ध सिरिएक अंश इस स्थान पर कट गया है; परामर्श-पाठ में संरक्षित आशय को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: the life of mankind was greatly troubled
  choice: मानवजाति का जीवन बहुत कष्टमय हो गया
  rationale: ‘मानवजाति’ सामूहिक अर्थ बनाए रखता है और ‘बहुत कष्टमय हो गया’ तीव्र मानवीय विपत्ति को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पूर्ववर्ती दोषों और संसार की बुराई के बीच कारण-संबंध
  choice: इन्हीं के कारण
  alternative: इनके द्वारा
  rationale: कारण-संबंध को स्पष्ट रखा गया है, पर किसी विशिष्ट पाप-सिद्धांत या सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘कष्टमय’ को ‘व्याकुल’ की अपेक्षा चुना गया है, क्योंकि यहाँ पूरे मानवीय जीवन पर पड़े व्यापक दुःख और संकट का भाव है।
