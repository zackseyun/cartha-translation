  yaml_path: translation/extra_canonical/2_baruch/073/002.yaml
  text: And then healing will descend in dew,[b] and anxiety will be quieted, and misery and disease and groanings will flee from the sons of men; and gladness will be in all the earth.
translation:
  language: hi
  text: तब ओस सुखदता के साथ उतरेगी,[a] और चंगाई दिखाई देगी; पीड़ा, बीमारी और कराहें मनुष्यों के बीच से दूर हो जाएँगी, और सारी पृथ्वी पर आनंद होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सुखदता” के लिए सिरिएक शब्द का अर्थ “सुगंध” या “मनोहरता” भी हो सकता है। अगले पदबंध में चंगाई के दिखाई देने की बात अलग से कही गई है।
    reason: ܒܘܣܡܐ की अर्थ-सीमा सुरक्षित रखने और ओस तथा चंगाई के दो अलग कथनों को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ܛܠܐ ܒܒܘܣܡܐ
  choice: चंगाई ओस के साथ उतरेगी
  rationale: पाठ में ‘ओस’ और सुख/आरोग्य से जुड़ी अभिव्यक्ति है। संदर्भ और प्राचीन पाठ-परंपरा के आधार पर इसे सहज हिन्दी में ‘चंगाई ओस के साथ’ रखा गया है, जबकि शाब्दिक अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
- source_word: ܕܘܝܐ ܘܟܘܪܗܢܐ ܘܐܢܚ̈ܬܐ
  choice: दुःख, बीमारी और कराहें
  rationale: तीनों समानांतर संज्ञाओं को सामान्य आधुनिक हिन्दी में अलग-अलग रखा गया है, ताकि मानसिक पीड़ा, रोग और उसकी मुखर अभिव्यक्ति का क्रम बना रहे।
- source_word: ܒܢܝܢܫ̈ܐ
  choice: मनुष्यों के बीच से
  rationale: शाब्दिक अर्थ ‘मनुष्यों की संतान’ है, पर सिरिएक में यह सामान्यतः समस्त मानवजाति के लिए प्रचलित मुहावरा है; ‘मनुष्यों’ अधिक स्वाभाविक हिन्दी है।
- source_word: ܚܕܘܬܐ ܒܟܠܗ̇ ܐܪܥܐ
  choice: सारी पृथ्वी पर आनंद छा जाएगा
  rationale: अस्तित्वसूचक वाक्य को प्राकृतिक हिन्दी में व्यक्त किया गया है; सार्वभौमिक विस्तार ‘सारी पृथ्वी’ से सुरक्षित है।
theological_decisions:
- issue: आरोग्यकारी ओस की छवि
  choice: चंगाई को ओस के साथ उतरते हुए प्रस्तुत किया
  alternative: ‘सुखद ओस उतरेगी’ अथवा ‘आरोग्य की ओस उतरेगी’
  rationale: मुख्य पाठ में आरोग्य और ओस दोनों को बनाए रखा गया है, पर इसे किसी विशिष्ट संस्कार, चमत्कार या सिद्धान्त से नहीं जोड़ा गया। पाठगत अस्पष्टता पाद-टिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘चंगाई’, ‘कराहें’ और ‘आनंद’ सामान्य पाठक के लिए सहज हैं। वाक्य की भविष्यसूचक लय और मूल की समानांतर संरचना बनाए रखी गई है।
