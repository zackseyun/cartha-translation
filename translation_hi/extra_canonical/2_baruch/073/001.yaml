base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073/001.yaml
  text: And it shall be, after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]
translation:
  language: hi
  text: 1. और ऐसा होगा कि जब वह संसार में जो कुछ है, उस सबको नीचा कर चुका होगा और अपने राज्य के सिंहासन पर सदा के लिए शान्ति से विराजमान हो चुका होगा, तब आनन्द प्रकट होगा और विश्राम दिखाई देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘वह’ निकटवर्ती प्रसंग में उल्लिखित मसीह की ओर संकेत करता है।
    reason: सर्वनाम के संदर्भ को स्पष्ट करता है, पर मुख्य पाठ में मसीह का नाम जोड़कर स्रोत की अभिव्यक्ति को अधिक स्पष्ट नहीं बनाता।
lexical_decisions:
- source_word: ܡܟܝܟܐ / underlying clause reflected in the audited reconstruction
  choice: नीचा कर चुका होगा
  rationale: स्रोत की दीन करने अथवा अधीन कर देने की छवि को बनाए रखता है; केवल ‘नष्ट करना’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ܚܕܘܬܐ
  choice: आनन्द
  rationale: भावनात्मक प्रसन्नता और आने वाले कल्याण—दोनों को व्यक्त करने वाला स्वाभाविक, गरिमापूर्ण हिन्दी शब्द।
- source_word: ܢܝܚܐ
  choice: विश्राम
  rationale: शान्ति, राहत और स्थिर विश्रान्ति के अर्थ-क्षेत्र को संक्षेप में सुरक्षित रखता है।
- source_word: ܢܬܚܙܐ
  choice: दिखाई देगा
  rationale: ‘प्रकट होगा’ की पुनरावृत्ति से बचते हुए स्रोत के दृश्य रूप से प्रकट होने के भाव को बनाए रखता है।
theological_decisions:
- issue: ‘वह’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में केवल ‘वह’ रखा गया
  alternative: ‘मसीह’ स्पष्ट रूप से जोड़ना
  rationale: निकटवर्ती प्रसंग मसीह की ओर संकेत करता है, पर इस वाक्य में नाम जोड़ने से निहित कर्ता को व्याख्यात्मक रूप से निश्चित कर दिया जाता; इसलिए स्रोत की संदर्भ-निर्भरता सुरक्षित रखी गई।
- issue: संसार की सब वस्तुओं को ‘नीचा करना’
  choice: नीचा कर चुका होगा
  alternative: अधीन कर चुका होगा / नष्ट कर चुका होगा
  rationale: यह अनुवाद न्याय अथवा प्रभुत्व की सम्भावना खुली रखता है और विनाश का अर्थ पाठ में नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यसूचक और गरिमापूर्ण लहजा। ‘विराजमान हो जाएगा’ राजसिंहासन के प्रसंग में स्वाभाविक है, जबकि ‘शान्ति से’ मूल के शांतिपूर्ण स्थायित्व को व्यक्त करता है।
