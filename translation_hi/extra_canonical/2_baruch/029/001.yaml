  text: And he answered and said to me, “Whatever is destined to happen at that time will happen upon the whole earth; therefore, all who live will experience[a] it.”
translation:
  language: hi
  text: और उसने मुझे उत्तर दिया, “जो कुछ उस समय होने वाला है, वह सारी पृथ्वी पर होगा; इसलिए सभी जीवित लोग उसका अनुभव करेंगे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “महसूस करेंगे” या “बोध करेंगे।”'
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܥܬܝܕ ܠܡܗܘܐ
  choice: होने वाला है
  rationale: यह स्वाभाविक हिन्दी में भावी घटना को व्यक्त करता है और ܥܬܝܕ में निहित तैयारी अथवा नियति का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ܢܪܓܫܘܢ
  choice: अनुभव करेंगे
  rationale: ܪܓܫ का मूल अर्थ ‘महसूस करना/जान पड़ना/बोध होना’ है; इस प्रसंग में घटनाओं से प्रत्यक्ष रूप से प्रभावित होने का व्यापक भाव ‘अनुभव करेंगे’ से स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: ܕܥܬܝܕ में नियति या केवल भविष्य का भाव
  choice: होने वाला है
  alternative: नियत है
  rationale: सीरियाई पद भविष्य अथवा तत्परता का संकेत दे सकता है, पर यहाँ ‘नियत’ कहने से दैवी पूर्वनियोजन का अधिक स्पष्ट धार्मिक दावा जुड़ सकता है; इसलिए मूल की अर्थगत खुली जगह सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथन रखा गया है। सीरियाई की पुनरुक्त उत्तर-सूत्र ‘उत्तर दिया और मुझसे कहा’ को अनावश्यक हिन्दी दोहराव से बचाते हुए ‘मुझे उत्तर दिया’ किया गया है; विषय-संदर्भ के कारण ‘उसने’ रखा गया है।
