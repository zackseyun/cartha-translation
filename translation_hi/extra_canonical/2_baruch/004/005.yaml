translation:
  language: hi
  text: और इसके बाद मैंने रात में अपने सेवक अब्राहम को उसे बलि के टुकड़ों के बीच दिखाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܟܝܢ
  choice: इसके बाद
  rationale: यह स्वाभाविक हिन्दी में घटनाक्रम को व्यक्त करता है और स्रोत के ‘इन बातों के बाद/इसके बाद’ वाले अर्थ को बनाए रखता है।
- source_word: ܚܘܝܬܗ
  choice: उसे ... दिखाया
  rationale: पुल्लिंग कर्म-सर्वनाम का संदर्भ पूर्ववर्ती वर्णित नगर की ओर है; संज्ञा को दोहराने के बजाय स्रोत की सर्वनामात्मक अभिव्यक्ति और संदर्भगत तनाव सुरक्षित रखा गया है।
- source_word: ܠܥܒܕܝ ܐܒܪܗܡ
  choice: अपने सेवक अब्राहम को
  rationale: ܥܒܕܝ का सीधा अर्थ ‘मेरा सेवक’ है; हिन्दी में वक्ता के संबंध को स्वाभाविक रूप से ‘अपने सेवक’ कहा गया है।
- source_word: ܒܠܠܝܐ
  choice: रात में
  rationale: स्रोत के काल-सूचक अर्थ का सीधा और सामान्य हिन्दी रूप।
- source_word: ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ
  choice: बलि के टुकड़ों के बीच
  rationale: यह उत्पत्ति 15 की पृष्ठभूमि से संगत रहते हुए ‘बलि के काटे हुए भागों/टुकड़ों के बीच’ का स्पष्ट, सामान्य और स्रोत-सन्निकट रूप है।
theological_decisions:
- issue: दिखाई गई वस्तु की पहचान
  choice: ‘उसे’ सर्वनाम बनाए रखा गया
  alternative: ‘उस नगर को’
  rationale: निकटवर्ती संदर्भ इसे पूर्वनिर्धारित नगर से जोड़ता है, पर इस पद में स्वयं संज्ञा नहीं दोहराई गई; इसलिए व्याख्यात्मक स्पष्टता के लिए उसे जोड़ना स्रोत की वास्तविक सर्वनामात्मकता को अनावश्यक रूप से निश्चित कर देता।
- issue: अब्राहम की बलि का संकेत
  choice: ‘बलि के टुकड़ों के बीच’
  alternative: ‘बलि किए गए पशुओं के अंगों के बीच’
  rationale: संक्षिप्त रूप स्रोत के शब्द-विन्यास और उत्पत्ति 15 के संकेत को सुरक्षित रखता है, बिना पशुओं या अनुष्ठान के ऐसे विवरण जोड़ने के जो इस पद में स्पष्ट नहीं हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वाक्य-क्रम को हिन्दी में स्वाभाविक बनाया गया है, जबकि स्रोत का सर्वनाम और दर्शन-संबंधी अस्पष्ट संदर्भ सुरक्षित रखा गया है।
