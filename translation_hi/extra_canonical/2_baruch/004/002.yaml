translation:
  language: hi
  text: या क्या तुम सोचते हो कि यह वही नगर है, जिसके विषय में मैंने कहा था, “मैंने तुम्हें अपनी हथेलियों पर अंकित किया है”?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝܢܬܐ
  choice: नगर
  rationale: इस स्त्रीलिंग सीरियाई संज्ञा का स्वाभाविक और गरिमापूर्ण हिन्दी रूप ‘नगर’ है; प्रसंग यरूशलेम का है।
- source_word: ܐܝ̈ܕܝ / ܦܣ̈ܝ ܐܝܕܝ (उद्धरण का आशय)
  choice: अपनी हथेलियों पर
  rationale: यह अभिव्यक्ति यशायाह 49:16 की प्रतिध्वनि है और केवल सामान्य ‘हाथों पर’ की अपेक्षा मूल बिंब को अधिक स्पष्टता से रखती है।
- source_word: ܓܠܦ / ܪܫܡ (उद्धरण का आशय)
  choice: अंकित किया है
  rationale: ‘अंकित’ स्थायी रूप से उकेरने या लिख देने के बिंब को बनाए रखता है, बिना माध्यम को अनावश्यक रूप से निश्चित किए।
- source_word: ܣܒܪ ܐܢܬ (पाठ का आशय)
  choice: क्या तुम सोचते हो
  rationale: प्रश्नात्मक संबोधन का स्वाभाविक आधुनिक हिन्दी रूप, जो वक्ता की चुनौतीपूर्ण ध्वनि को सुरक्षित रखता है।
theological_decisions:
- issue: उद्धरण में ‘तुम्हें’ का संदर्भ
  choice: स्त्रीलिंग नगर को संबोधित ‘तुम्हें’ को यथावत रखा
  alternative: स्पष्ट करके ‘इस नगर को’ या ‘यरूशलेम को’ कहना
  rationale: मूल का व्यक्तिकरण और यशायाह-संबंधी धार्मिक बिंब बनाए रखने के लिए संदर्भ को अनावश्यक रूप से नहीं खोला गया।
- issue: ‘यह वही नगर है’ की पहचान
  choice: वाक्य को प्रश्न के रूप में रखा
  alternative: इसे नकारात्मक कथन बनाना कि यह वह नगर नहीं है
  rationale: यह पद स्वयं शंकापूर्ण/चुनौतीपूर्ण प्रश्न प्रस्तुत करता है; अगले कथन से मिलने वाले उत्तर को इस पद में पहले से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष उद्धरण तथा नगर के व्यक्तिकरण को सुरक्षित रखा गया है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
