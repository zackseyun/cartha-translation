  text: And the Lord said to me, “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.
translation:
  language: hi
  text: 1 तब प्रभु ने मुझसे कहा, “यह नगर कुछ समय के लिए सौंप दिया जाएगा, और लोगों को बंदी बनाकर ले जाया जाएगा; पर संसार को भुलाया नहीं जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܐ
  choice: प्रभु
  rationale: ईश्वर के लिए प्रयुक्त सिरियाई उपाधि का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ܒܙܒܢܐ
  choice: कुछ समय के लिए
  rationale: यहाँ कालगत और अस्थायी सीमा का भाव है; हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ܡܫܬܠܡܐ
  choice: सौंप दिया जाएगा
  rationale: मूल का निष्क्रिय भाव सुरक्षित है; नगर किसके हाथ सौंपा जाएगा, यह अनिर्दिष्ट ही रखा गया है।
- source_word: ܡܬܕܒܪ ܫܒܝܐ
  choice: बंदी बनाकर ले जाए जाएँगे
  rationale: क्रिया में ले जाए जाने और संज्ञा में बंदी अवस्था—दोनों भावों को सहज हिन्दी में रखा गया है।
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: व्यापक अर्थ वाला सामान्य समतुल्य; इसे ‘युग’ या ‘पृथ्वी’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: ܠܐ ܡܬܬܢܫܐ
  choice: भुलाया नहीं जाएगा
  rationale: मूल के निष्क्रिय और भविष्याभिमुख कथन को बनाए रखता है।
theological_decisions:
- issue: ‘संसार को भुलाया नहीं जाएगा’ का अभिप्राय
  choice: कथन को बिना व्याख्यात्मक विस्तार के यथावत रखा गया
  alternative: ‘परमेश्वर संसार को नहीं भूलेगा’ या ‘सृष्टि त्यागी नहीं जाएगी’
  rationale: मूल निष्क्रिय वाक्य में कर्ता और ‘संसार’ का सटीक आशय खुला है; अनुवाद ने इस वास्तविक अस्पष्टता को नहीं सुलझाया।
- issue: नगर के सौंपे जाने का कर्ता या प्राप्तकर्ता
  choice: निष्क्रिय रूप रखा गया
  alternative: ‘मैं इस नगर को शत्रुओं के हाथ सौंप दूँगा’
  rationale: मूल इस वाक्य में न तो कर्ता को स्पष्ट करता है, न प्राप्तकर्ता को; धार्मिक व्याख्या जोड़ने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल के तीन निष्क्रिय कथनों तथा अंतिम विरोधसूचक तनाव को सुरक्षित रखा गया है।
