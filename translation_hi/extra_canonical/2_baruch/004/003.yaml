  yaml_path: translation/extra_canonical/2_baruch/004/003.yaml
  text: For it is not that which is by the hands of men; it is that which will be revealed, which was prepared beforehand from the time I resolved to make Paradise, and I showed it to Adam before he sinned.
translation:
  language: hi
  text: क्योंकि वह मनुष्यों के हाथों की बनाई हुई नहीं है। वह वही है जो प्रकट की जाएगी, जिसे मैंने पहले से तैयार किया था—उसी समय से जब मैंने स्वर्ग-वाटिका बनाने का निश्चय किया था। और आदम के पाप करने से पहले मैंने उसे आदम को दिखाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܕ ܒܢܝܢܫܐ
  choice: मनुष्यों के हाथों की बनाई हुई
  rationale: सिरियाई मुहावरे ‘मनुष्यों के हाथ से/द्वारा’ को स्वाभाविक हिन्दी में रखते हुए मानव-निर्मित होने का भाव स्पष्ट किया गया है।
- source_word: ܡܬܓܠܐ
  choice: प्रकट की जाएगी
  rationale: मूल का भविष्याभिमुख निष्क्रिय भाव सुरक्षित रखा गया है; प्रसंगगत नगर के कारण स्त्रीलिंग प्रयोग हुआ है।
- source_word: ܐܬܟܢ ܡܢܩܕܡ
  choice: पहले से तैयार किया था
  rationale: पूर्व-तैयारी का अर्थ बिना यह निर्धारित किए रखा गया है कि तैयारी का दार्शनिक या भौतिक स्वरूप क्या था।
- source_word: ܦܪܕܝܣܐ
  choice: स्वर्ग-वाटिका
  rationale: ‘परदेस/Paradise’ का अर्थ अदन की वाटिका के प्रसंग में सामान्य पाठक के लिए बोधगम्य और गरिमापूर्ण रूप में दिया गया है।
- source_word: ܚܘܝܬܗ ܠܐܕܡ
  choice: आदम को ... दिखाया था
  rationale: प्रत्यक्ष कर्म-संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है; ‘उसे वह’ नगर की ओर संकेत करता है।
theological_decisions:
- issue: प्रकट होने वाली सत्ता का स्वरूप
  choice: ‘वह वही है जो प्रकट की जाएगी’
  alternative: ‘वही आने वाले समय में प्रकट होगी’
  rationale: मूल के प्रकाशन संबंधी कथन को बनाए रखा गया है और उसे नया सृजन, स्वर्ग से अवतरण, या केवल दर्शन मानकर व्याख्यायित नहीं किया गया।
- issue: पूर्व-अस्तित्व और पूर्व-तैयारी
  choice: ‘जिसे मैंने पहले से तैयार किया था’
  alternative: ‘जो पहले से अस्तित्व में थी’
  rationale: मूल ‘तैयार की गई’ कहता है; इससे आगे बढ़कर उसके अस्तित्व की प्रकृति पर कोई संप्रदायगत निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल शैली। नगर के अप्रकट पूर्वरूप की ओर संकेत होने के कारण स्त्रीलिंग सर्वनाम और क्रिया रखी गई है। वाक्य-विभाजन पठनीयता के लिए किया गया है, जबकि मूल की क्रमिक तर्क-रचना सुरक्षित है।
