translation:
  language: hi
  text: पर जब उसने आज्ञा का उल्लंघन किया, तो वह उससे छीन ली गई, जैसे परादीस भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܕ ܐܫܬܕ ܦܘܩܕܢܐ
  choice: पर जब उसने आज्ञा का उल्लंघन किया
  rationale: ܐܫܬܕ का अर्थ यहाँ आज्ञा को तोड़ना या उसका उल्लंघन करना है; आधुनिक हिन्दी में ‘आज्ञा का उल्लंघन’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ܐܬܢܣܒܬ ܡܢܗ
  choice: वह उससे ले लिया गया
  rationale: मूल में कर्म का स्पष्ट नाम नहीं दोहराया गया है; पुल्लिंग सर्वनाम निकटवर्ती प्रसंग में प्रकट किए गए भावी नगर की ओर संकेत करता है। अनुवाद मूल की इस संदर्भगत अनिर्दिष्टता को बनाए रखता है।
- source_word: ܦܪܕܝܣܐ
  choice: अदन-वाटिका
  rationale: ܦܪܕܝܣܐ का संदर्भ आदम से जुड़ी परमेश्वर की वाटिका है; ‘अदन-वाटिका’ साधारण पाठक के लिए ‘परादीस’ से अधिक स्पष्ट है और केवल सामान्य ‘बगीचा’ से अधिक संदर्भ-सटीक।
theological_decisions:
- issue: आदम से क्या ले लिया गया
  choice: ‘वह’ कहकर मूल की अप्रकट संज्ञा को बनाए रखा गया
  alternative: ‘भावी नगर’ या ‘दर्शन’ को स्पष्ट रूप से जोड़ना
  rationale: सीरियाई वाक्य में वस्तु अंतर्निहित है और उसका आशय पूर्ववर्ती नगर से निकलता है। संज्ञा जोड़ने से वास्तविक पाठगत अस्पष्टता आवश्यकता से अधिक सुलझ जाती।
- issue: परादीस की पहचान
  choice: ‘अदन-वाटिका’
  alternative: ‘परादीस’ या ‘स्वर्ग’
  rationale: यहाँ आदम से छीनी गई सृष्टिगत वाटिका का प्रसंग है; ‘स्वर्ग’ बाद की अवधारणाओं से भ्रम पैदा कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘और उसी तरह’ सीरियाई तुलना की संरचना को स्पष्ट करता है, जबकि मूल में निहित ‘वह’ की संदर्भगत अस्पष्टता सुरक्षित है।
