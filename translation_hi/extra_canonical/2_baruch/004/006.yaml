translation:
  language: hi
  text: और फिर मैंने उसे सीनै पर्वत पर मूसा को भी दिखाया, जब मैंने उसे तम्बू का नमूना और उसके सारे पात्र दिखाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܝܬܗ
  choice: मैंने उसे दिखाया
  rationale: सीरियाई क्रिया का सीधा अर्थ ‘दिखाना’ है; प्रत्यय उस पहले से उल्लिखित नगर की ओर संकेत करता है।
- source_word: ܛܘܪܐ ܕܣܝܢܝ
  choice: सीनै पर्वत
  rationale: स्थान-नाम को आधुनिक मानक हिन्दी के प्रचलित बाइबलीय रूप में रखा गया है।
- source_word: ܕܡܘܬܐ / pattern tradition
  choice: नमूना
  rationale: यह उस प्रतिरूप या आदर्श विन्यास को व्यक्त करता है जो मूसा को पवित्र निवास के लिए दिखाया गया था; ‘नमूना’ सहज है और दृश्य प्रतिरूप का भाव बनाए रखता है।
- source_word: ܡܫܟܢܐ
  choice: पवित्र निवास
  rationale: ‘निवास’ मूल के dwelling/tabernacle भाव को व्यक्त करता है; ‘पवित्र’ से सामान्य आवास के बजाय उपासना-स्थल का संदर्भ स्पष्ट होता है।
- source_word: ܡܐܢ̈ܘܗܝ
  choice: उसके सारे पात्र
  rationale: उपासना-स्थल से संबंधित उपकरणों के लिए हिन्दी बाइबलीय प्रयोग ‘पात्र’ स्वाभाविक है; संबंधवाचक रूप मूल की ओर लौटता है।
theological_decisions:
- issue: ‘उसे’ का संकेत
  choice: सर्वनाम को बनाए रखा गया
  alternative: ‘उस नगर को’ स्पष्ट रूप से लिखना
  rationale: प्रसंग में परमेश्वर उस भावी नगर को दिखाने की बात कर रहे हैं। मूल का सर्वनाम इस संबंध को निहित रखता है, इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- issue: मूसा को दिखाए गए दृश्य और निवास के नमूने का संबंध
  choice: दोनों के लिए समान क्रिया ‘दिखाया’ रखी गई
  alternative: पहले को दर्शन देना और दूसरे को योजना बताना
  rationale: मूल की पुनरावृत्ति दोनों प्रकाशनों के बीच जानबूझकर संबंध बनाती है; अलग-अलग क्रियाएँ उस संबंध को अनावश्यक रूप से व्याख्यायित करतीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की पुनरुक्त संरचना मूल के ‘फिर…भी’ और ‘जब मैंने…दिखाए’ संबंध को सुरक्षित रखती है। उपलब्ध सीरियाई पृष्ठांश पद के आरंभ में ‘और फिर मैंने उसे मूसा को भी दिखाया’ तक प्रत्यक्ष रूप से दिखाई देता है; पद का शेष भाग अध्याय-परंपरा और दिए गए नियंत्रित अंग्रेज़ी परामर्श-पाठ के अनुरूप प्रस्तुत किया गया है।
