  language: en
  yaml_path: translation/extra_canonical/2_baruch/017/001.yaml
  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
translation:
  language: hi
  text: और प्रभु ने उत्तर देकर मुझसे कहा,[a] “परमप्रधान के यहाँ बहुत वर्षों या थोड़े वर्षों का कोई हिसाब नहीं है। आदम को इससे क्या लाभ हुआ कि वह नौ सौ तीस वर्ष जीवित रहा, फिर भी उसने उसे दी गई आज्ञा का उल्लंघन किया? इसलिए उसके लंबे जीवनकाल से उसे कोई लाभ नहीं हुआ; बल्कि उसके इस जीवनकाल ने मृत्यु ला दी और उससे उत्पन्न होनेवालों के वर्ष घटा दिए। और मूसा को क्या कमी हुई कि वह केवल एक सौ बीस वर्ष जीवित रहा? क्योंकि वह अपने रचनेवाले के अधीन रहा, उसने व्यवस्था को याकूब की संतान के निकट पहुँचाया और इस्राएल की प्रजा के लिए एक दीपक जलाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और प्रभु ने मुझसे कहा।”
    reason: कुछ प्रस्तुतीकरणों में ‘उत्तर देकर’ का भाव व्यक्त नहीं किया जाता, यद्यपि मानक सिरियाई पाठ में उत्तर देने की क्रिया उपस्थित है।
lexical_decisions:
- source_word: ܡܢܝܗܝ
  choice: लेखा
  rationale: यह शब्द गिनती या हिसाब का भाव रखता है। ‘लेखा’ वर्षों की संख्या के मूल्यांकन का संकेत देता है और सामान्य हिन्दी में स्वाभाविक है।
- source_word: ܙܒܘ̈ܢܝ / ܫ̈ܢܝܗܝ
  choice: बहुत वर्षों या थोड़े वर्षों
  rationale: पांडुलिपीय पाठ अस्पष्ट है, पर दीर्घ और अल्प जीवनकाल का विरोध स्पष्ट है; इस चुनाव में वही विरोध सुरक्षित रहता है।
- source_word: ܡܘܬܪܐ
  choice: लाभ
  rationale: संदर्भ में प्रश्न यह है कि लंबे जीवन से नैतिक या वास्तविक फायदा क्या हुआ; ‘लाभ’ व्यापारिक अर्थ पर अनावश्यक जोर दिए बिना इस आशय को व्यक्त करता है।
- source_word: ܡܒܣܪܝܢ
  choice: दीपक जलाया
  rationale: निकटवर्ती दीपक की छवि के साथ ‘जलाया’ स्वाभाविक है और प्रकाश तथा मार्गदर्शन का रूपक बनाए रखता है।
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  choice: इस्राएल के लोगों
  rationale: यह सामूहिक राष्ट्रीय संदर्भ को आधुनिक, सहज हिन्दी में व्यक्त करता है, बिना किसी सांप्रदायिक व्याख्या को जोड़े।
theological_decisions:
- issue: जीवनकाल का नैतिक मूल्य
  choice: आज्ञाकारिता से अलग केवल लंबा जीवन कोई लाभ नहीं देता।
  alternative: इसे केवल आदम और मूसा के व्यक्तिगत उदाहरणों के बीच तुलना माना जा सकता है।
  rationale: बहुत और थोड़े वर्षों के लेखे से आरम्भ होकर आदम और मूसा की तुलना एक व्यापक नैतिक तर्क बनाती है, फिर भी अनुवाद इसे अतिरिक्त व्याख्यात्मक कथन के रूप में नहीं जोड़ता।
- issue: मूसा और दीपक की छवि
  choice: व्यवस्था पहुँचाने और दीपक जलाने को साथ रखकर प्रकाशन तथा मार्गदर्शन दोनों भाव सुरक्षित रखे गए हैं।
  alternative: दीपक को केवल मूसा के व्यक्तिगत आदर्श का रूपक माना जा सकता है।
  rationale: स्रोत में व्यवस्था और दीपक की छवियाँ निकट जुड़ी हैं; इसलिए अनुवाद दोनों को बनाए रखता है और उनके सटीक संबंध को सिद्धांतात्मक रूप से सीमित नहीं करता।
- issue: आदम द्वारा मृत्यु लाना
  choice: ‘वह मृत्यु ले आया’ कहकर कथन का कारणात्मक बल रखा गया है।
  alternative: स्पष्ट रूप से ‘उसका उल्लंघन मृत्यु ले आया’ कहना।
  rationale: स्रोत-साक्ष्य में कर्ता-संबंध कुछ तनावपूर्ण है; सर्वनामयुक्त अभिव्यक्ति उस तनाव को पूरी तरह हल किए बिना मूल तर्क को समझने योग्य रखती है।
