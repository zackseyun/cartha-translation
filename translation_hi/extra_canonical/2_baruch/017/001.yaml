  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘परमप्रधान’, ‘आज्ञा’, ‘व्यवस्था’ और ‘दीपक’ जैसी पारंपरिक धार्मिक शब्दावली स्पष्टता और स्रोत की छवियों के लिए रखी गई है। सभी संख्याएँ शब्दों में दी गई हैं और पादटिप्पणी-सूचक मुख्य पाठ में [a] के रूप में उपस्थित है।
