lexical_decisions:
- source_word: ܘܥܢܐ
  choice: और उसने उत्तर दिया
  rationale: सीरियाई कथात्मक उत्तर-सूत्र को सहज और स्पष्ट हिन्दी में रखा गया है; इसमें मूल से अधिक भाव नहीं जोड़ा गया।
- source_word: ܘܐܡܪ ܠܝ
  choice: और मुझसे कहा
  rationale: शाब्दिक घटकों का अर्थ मुख्य वाक्य में स्वाभाविक हिन्दी के अनुरूप ‘मुझे उत्तर दिया’ में समाहित किया गया है, जिससे अनावश्यक पुनरुक्ति से बचते हुए संवाद का आशय बना रहता है।
- source_word: ܡܛܠ ܗܢܐ
  choice: इसी कारण
  rationale: कारणसूचक संबंध को स्पष्ट रखता है और आगे आने वाली व्याख्या की भूमिका बाँधता है।
- source_word: ܒܗܘ ܙܒܢܐ
  choice: उस समय
  rationale: मूल के समयसूचक पदबंध को संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ܐܡܝܪ
  choice: कहा गया था
  rationale: निष्क्रिय रूप मूल की अनिर्दिष्ट वक्ता-संरचना को बनाए रखता है और किसी वक्ता की अनावश्यक पहचान नहीं करता।
theological_decisions:
- issue: आरंभिक कथन में वक्ता की पहचान
  choice: उत्तर को प्रकट संवाद की सीधी निरंतरता के रूप में रखा गया है, पर ‘कहा गया था’ के कर्ता को अनिर्दिष्ट छोड़ा गया है।
  alternative: इसे परमेश्वर की स्पष्ट घोषणा या सामान्य व्याख्यात्मक कथन के रूप में विस्तृत किया जा सकता था।
  rationale: उपलब्ध सीरियाई पाठ केवल उत्तर-सूत्र और व्याख्या का आरंभ देता है; इसलिए अनिश्चितता को बिना धार्मिक विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक-प्रकाशनात्मक शैली। उपलब्ध स्रोत अंश इसी अधूरे वाक्य पर समाप्त होता है, इसलिए अंत में त्रिबिंदु रखा गया है।
