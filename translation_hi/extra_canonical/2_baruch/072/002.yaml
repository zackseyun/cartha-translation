base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/072/002.yaml
  text: 'This is the word: after the signs have come that were told to you before, the nations will be thrown into confusion, and the time of my Messiah will come. He will summon all the nations, and some of them he will keep alive, but others of them he will put to death.'
translation:
  language: hi
  text: 'वचन यह है: जिन चिन्हों के बारे में तुम्हें पहले बताया गया था, उनके प्रकट हो जाने के बाद राष्ट्रों में खलबली मच जाएगी और मेरे मसीह का समय आ जाएगा। वह सभी राष्ट्रों को बुलाएगा; उनमें से कुछ को वह जीवित रखेगा, पर दूसरों को मार डालेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: वचन
  rationale: यह शब्द ‘बात’, ‘कथन’ या ‘वचन’ हो सकता है; भविष्यसूचक घोषणा के औपचारिक आरंभ में ‘वचन’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ܐܬ̈ܘܬܐ
  choice: चिन्ह
  rationale: आने वाली घटनाओं के संकेतों के लिए आधुनिक हिन्दी में ‘चिन्ह’ स्पष्ट है और अलौकिक अर्थ को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: ܡܫܝܚܝ
  choice: मेरे मसीह
  rationale: स्वामित्वसूचक रूप और पारंपरिक मसीही पदवी दोनों को सीधे बनाए रखा गया है; इसे किसी विशेष सम्प्रदायगत व्याख्या से नहीं जोड़ा गया।
- source_word: ܥܡܡ̈ܐ
  choice: राष्ट्र
  rationale: यह बहुवचन जनसमूहों या जातियों को सूचित कर सकता है; इस राजकीय और अंतकालीन प्रसंग में ‘राष्ट्र’ सबसे स्वाभाविक है।
theological_decisions:
- issue: ‘मेरे मसीह का समय’ का अर्थ
  choice: मेरे मसीह का समय आ जाएगा
  alternative: मेरे मसीह का युग आ जाएगा
  rationale: ‘समय’ स्रोत की अभिव्यक्ति को खुला रखता है; ‘युग’ शासनकाल या पूर्ण युग-सिद्धांत को अधिक निश्चित कर सकता था।
- issue: राष्ट्रों में से कुछ का जीवित रखा जाना
  choice: कुछ को वह जीवित रखेगा
  alternative: कुछ को वह छोड़ देगा
  rationale: यह चयन जीवन और मृत्यु के स्पष्ट विरोध को बनाए रखता है, पर ‘बचा लेगा’ कहकर आध्यात्मिक उद्धार का अतिरिक्त अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, भविष्यसूचक और गरिमापूर्ण शैली रखी गई है। ‘खलबली मच जाएगी’ राष्ट्रों की अव्यवस्था को सहज भाषा में व्यक्त करता है; वाक्य-विन्यास स्रोत के क्रम और निर्णायक स्वर को बनाए रखता है।
