translation:
  language: hi
  text: इसलिए ये वे बातें हैं जो उन राष्ट्रों के साथ घटेंगी जिन्हें वह बख्श देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें उसके द्वारा छोड़ दिया जाएगा।”
    reason: सीरियाई क्रिया का शाब्दिक अर्थ ‘छोड़ना’ भी हो सकता है, जबकि प्रसंग में ‘बख्शना’ अभिप्रेत है।
lexical_decisions:
- source_word: ܥܡܡ̈ܐ
  choice: राष्ट्रों
  rationale: यह बहुवचन संज्ञा लोगों के राजनीतिक अथवा जातीय समूहों को सूचित करती है; प्रसंग में ‘राष्ट्र’ स्वाभाविक और सटीक है।
- source_word: ܢܫܬܒܩܘܢ
  choice: बख्श देगा
  rationale: सीरियाई क्रिया का मूल अर्थ ‘छोड़ दिया जाना’ है और इस प्रसंग में विनाश से बचाए जाने का भाव है; ‘बख्श देना’ आधुनिक हिन्दी में दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: ܗܠܝܢ
  choice: ये वे बातें
  rationale: संकेतवाचक बहुवचन को आने वाली घटनाओं की ओर संकेत करते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: राष्ट्रों को बख्शने वाले का अप्रकट कर्ता
  choice: ‘वह’ को बनाए रखा गया है
  alternative: कर्ता की पहचान स्पष्ट रूप से परमेश्वर या मसीह के रूप में करना
  rationale: मूल में कर्ता सर्वनाम से संदर्भित है; उसकी पहचान को पद के भीतर स्पष्ट कर देना मूल की संदर्भगत अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बख्श देगा’ विनाश से बचाए जाने के प्रसंगगत अर्थ को व्यक्त करता है, और पादटिप्पणी मूल क्रिया के अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
