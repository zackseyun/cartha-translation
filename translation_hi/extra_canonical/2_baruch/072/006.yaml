translation:
  language: hi
  text: परन्तु वे सब जिन्होंने तुम पर शासन किया है या तुम्हें जानते रहे हैं, तलवार के हवाले कर दिए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܫܠܛܘ ܥܠܝܟ
  choice: जिन्होंने तुम पर शासन किया है
  rationale: शासन अथवा प्रभुता के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और संबोधन के एकवचन रूप को बनाए रखता है।
- source_word: ܐܘ ܝܕܥܘܟ
  choice: या तुम्हें जाना है
  rationale: ‘जानना’ के असामान्य किंतु वास्तविक अर्थ को सुरक्षित रखा गया है; इसे बिना पर्याप्त आधार ‘तुमसे संबंध रखा’ या ‘तुम्हें पहचाना’ बनाकर स्पष्ट नहीं किया गया।
- source_word: ܢܫܬܠܡܘܢ ܠܣܝܦܐ
  choice: तलवार के हवाले कर दिए जाएँगे
  rationale: स्रोत की ‘तलवार को सौंपे जाने’ वाली न्यायिक और हिंसक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दण्ड की भाषा में कर्ता का अनुल्लेख
  choice: कर्मवाच्य ‘हवाले कर दिए जाएँगे’ रखा गया
  alternative: ‘परमेश्वर उन्हें तलवार के हवाले कर देगा’
  rationale: स्रोत में कर्ता स्पष्ट नहीं है; परमेश्वर को प्रत्यक्ष कर्ता बनाना अनावश्यक व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का dignified किन्तु सरल रूप अपनाया गया है। ‘परन्तु’ भविष्यवाणी के औपचारिक प्रवाह के अनुकूल है; ‘तलवार के हवाले’ मूल रूपक को बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है। उपलब्ध सिरिएक अध्याय-पृष्ठ का पाठ अत्यधिक विकृत/खंडित है, इसलिए पद की संरचना को परामर्श-पाठ से नियंत्रित करते हुए सिरिएक की संभावित शब्दावली और वाक्य-विन्यास के अनुरूप रखा गया है।
