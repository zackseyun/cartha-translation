  text: And this is because they shall be subjected, from among all the nations, to your people.
translation:
  language: hi
  text: और यह इसलिए होगा कि सब राष्ट्रों में से वे तुम्हारी प्रजा के अधीन कर दिए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܡ̈ܐ
  choice: राष्ट्रों
  rationale: बहुवचन का सामान्य अर्थ ‘राष्ट्र/जातियाँ’ है; आधुनिक हिन्दी में ‘राष्ट्रों’ स्पष्ट और स्वाभाविक है।
- source_word: ܥܡ
  choice: प्रजा
  rationale: यहाँ संबोधित व्यक्ति से संबंधित सामूहिक जनसमुदाय अभिप्रेत है; ‘तुम्हारी प्रजा’ हिन्दी में ‘your people’ का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: ܢܫܬܥܒܕܘܢ (अर्थानुमित कर्मवाच्य रूप)
  choice: अधीन कर दिए जाएँगे
  rationale: पराधीन किए जाने के कर्मवाच्य भाव को बनाए रखता है और उसे स्वेच्छापूर्ण आज्ञाकारिता के रूप में नहीं बदलता।
theological_decisions:
- issue: ‘वे’ के संदर्भ की अस्पष्टता
  choice: सर्वनाम ‘वे’ को ही बनाए रखा गया
  alternative: किसी विशिष्ट समूह या राष्ट्र का नाम जोड़ना
  rationale: उपलब्ध पद-साक्ष्य में कर्ता का स्पष्ट नाम नहीं है; अनुवाद में उसकी पहचान निश्चित करना मूल की वास्तविक अस्पष्टता को मिटा देता।
- issue: अधीनता का स्वरूप
  choice: ‘अधीन कर दिए जाएँगे’
  alternative: ‘सेवा करेंगे’ या ‘आज्ञा मानेंगे’
  rationale: कर्मवाच्य अधीनता को सुरक्षित रखा गया है; इसे सेवा अथवा स्वैच्छिक आज्ञाकारिता की विशिष्ट धार्मिक व्याख्या नहीं दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। मूल संदर्भ की सर्वनामगत अस्पष्टता को जानबूझकर सुरक्षित रखा गया है।
