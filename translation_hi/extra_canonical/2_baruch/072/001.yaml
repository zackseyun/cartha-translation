translation:
  language: hi
  text: उज्ज्वल जलों के विषय में भी सुनो, जो इन अंधकारमय जलों के बाद अंत में आने वाले हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: उज्ज्वल जल
  rationale: यह अभिव्यक्ति अंधकारमय जलों के साथ प्रतीकात्मक विरोध बनाए रखती है और केवल पारदर्शिता नहीं, बल्कि प्रकाशमान भाव भी व्यक्त करती है।
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ
  choice: अंधकारमय जल
  rationale: दृष्टान्त में उज्ज्वल जलों के विपरीत अशुभ, अंधकारपूर्ण चरण का बोध कराता है; शाब्दिक रंग-सूचक अनुवाद की अपेक्षा यह प्रतीकात्मक विरोध हिन्दी में अधिक स्वाभाविक है।
- source_word: ܗܠܝܢ
  choice: इन
  rationale: निकटवर्ती संकेतवाचक शब्द ठीक पहले वर्णित अंधकारमय जलों की ओर संकेत करता है।
- source_word: ܒܫܘܠܡܐ / ܒܚܪܬܐ
  choice: अंत में
  rationale: आने वाली श्रृंखला के अंतिम चरण का कालगत अर्थ संक्षेप और स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: उज्ज्वल और अंधकारमय जलों के प्रतीकात्मक विरोध को कैसे रखा जाए
  choice: दोनों को नैतिक या ऐतिहासिक अर्थ देकर स्पष्ट किए बिना प्रतीकात्मक रूप में रखा गया
  alternative: उन्हें सीधे आशीष और विपत्ति के युग कहना
  rationale: इस पद में प्रतीकों की व्याख्या स्वयं नहीं दी गई है; इसलिए उनके धर्मवैचारिक अर्थ को पहले से निश्चित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रवणीय रखी गई है। ‘पर अब … भी सुनो’ पिछले कथन से संक्रमण को दर्शाता है, जबकि ‘इन’ मूल के निकटवर्ती संकेत को सुरक्षित रखता है।
