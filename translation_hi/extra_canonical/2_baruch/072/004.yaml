translation:
  language: hi
  text: हर वह जाति जिसने इस्राएल को नहीं जाना और याकूब के वंश को नहीं रौंदा—वही जीवित रहेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡ / ܥܡܡ̈ܐ
  choice: जाति
  rationale: यहाँ सामूहिक जनसमुदाय या राष्ट्र का भाव है; ‘जाति’ आधुनिक हिन्दी बाइबलीय शैली में इस अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करती है।
- source_word: ܝܣܪܐܝܠ
  choice: इस्राएल
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: ܙܪܥܗ ܕܝܥܩܘܒ
  choice: याकूब का वंश
  rationale: शाब्दिक ‘बीज’ के बजाय यहाँ संतति या वंश का सामूहिक अर्थ अभिप्रेत है।
- source_word: ܕܫ / ܕܫܬ
  choice: रौंदा
  rationale: यह क्रिया पैरों तले कुचलने और दमन करने की सशक्त छवि बनाए रखती है।
- source_word: ܢܚܐ / ܢܚܘܢ
  choice: जीवित रहेगी
  rationale: रूप भविष्य में जीवन या बचकर बने रहने को व्यक्त करता है; ‘जीवित रहेगी’ मूल अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल को ‘जानने’ का अर्थ
  choice: ‘इस्राएल को नहीं जाना’ को यथावत रखा गया
  alternative: ‘इस्राएल से परिचित नहीं थी’ या ‘इस्राएल को नहीं पहचाना’
  rationale: ‘जानना’ परिचय, मान्यता या संबंध—इनमें से एक से अधिक अर्थ दे सकता है; अनुवाद इस वास्तविक अस्पष्टता को नहीं सुलझाता।
- issue: अंतिम क्रिया में जीवन या विनाश से बचाए जाने का भाव
  choice: ‘जीवित रहेगी’
  alternative: ‘बची रहेगी’ या ‘उसे छोड़ दिया जाएगा’
  rationale: यह चयन जीवन के मूल अर्थ को प्रमुख रखता है, जबकि न्याय से बचने की संभावित अंतर्ध्वनि को किसी विशिष्ट धर्मवैचारिक व्याख्या में नहीं बदलता।
- issue: जीवन पाने वाली जातियों की पहचान
  choice: दोनों निषेधात्मक विशेषताओं को संयुक्त शर्त के रूप में रखा गया
  alternative: उन्हें दो अलग समूह मानना
  rationale: 'वाक्य-रचना एक ही सामूहिक कर्ता का वर्णन करती है: उसने न इस्राएल को जाना, न याकूब के वंश को रौंदा।'
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, और गरिमापूर्ण किंतु सहज वाक्य-विन्यास अपनाया गया है। मूल की सामूहिक एकवचन संरचना ‘हर वह जाति … वही जीवित रहेगी’ में सुरक्षित है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
