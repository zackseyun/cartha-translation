base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/035/001.yaml
  text: 'And I, Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and eyelids of water, a fountain of tears.

    For how can I find rest over Zion?

    And how can I weep for Jerusalem?

    For the people whom I nourished

    and who were formerly greater than I in vision

    have been shaken with trembling.”'
translation:
  language: hi
  text: 'और मैं, बारूक, पवित्र फाटक तक गया और दीन होकर बैठ गया। मैं रोया और कहा:


    “हे मेरी आँखों, सोते बन जाओ,


    और मेरी पलकें जल के स्रोत,

    आँसुओं के सोते बन जाएँ।


    क्योंकि सिय्योन के लिए मुझे चैन कैसे मिले?


    और यरूशलेम के लिए मैं कैसे रोऊँ?[a]


    क्योंकि जिन लोगों का मैंने पालन-पोषण किया,


    और जो पहले दर्शन में मुझसे बड़े थे,


    वे भय से विचलित हो गए हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “और मैं शोक के लिए कैसे रोऊँ और उसे पाऊँ?” यहाँ सिरिएक पाठ कठिन है।
    reason: मुख्य पाठ का ‘यरूशलेम’ सिय्योन के साथ संभावित समानांतरता पर आधारित पाठ-सुधार है; उपलब्ध सिरिएक रूप ‘शोक’ से संबंधित एक कठिन पाठ की संभावना भी रखता है।
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  choice: पवित्र फाटक
  rationale: ܬܪܥܐ का सामान्य ठोस अर्थ ‘फाटक’ या ‘द्वार’ है; मंदिर-परिसर की छवि बनाए रखने के लिए व्यापक ‘पवित्र स्थान’ के बजाय ‘पवित्र फाटक’ चुना गया।
- source_word: ܡ̈ܟܝܟܐܝܬ
  choice: दीन होकर
  rationale: यह क्रियाविशेषण दीनता और नम्र अवस्था व्यक्त करता है। ‘दीन होकर’ शोक में बैठने की मुद्रा को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: ܡܒܘ̈ܥܐ
  choice: सोते
  rationale: बहुवचन जल-स्रोत की सजीव काव्यात्मक छवि देता है; ‘सोते’ सहज हिन्दी में इस बिंब को बनाए रखता है।
- source_word: ܐܡܘ̈ܬܐ
  choice: पलकें
  rationale: नियंत्रक पाठ-परंपरा शरीर के अंग का पाठ समर्थित करती है; आँसुओं के प्रसंग में ‘पलकें’ सबसे संभावित और स्वाभाविक अर्थ है।
- source_word: ܐܬܬܢܝܚ
  choice: चैन पाऊँ
  rationale: क्रिया विश्राम, राहत या सांत्वना पाने का भाव रखती है। ‘चैन पाऊँ’ बारूक की अशांत शोकावस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܐܒܠܐ
  choice: यरूशलेम
  rationale: दृश्य सिरिएक पाठ इस स्थान पर अस्थिर या विकृत प्रतीत होता है। सिय्योन के साथ समानांतरता के आधार पर मुख्य पाठ में ‘यरूशलेम’ रखा गया है, पर वैकल्पिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: ܐܢܫܐ ܕܡܬ̇ܪܣܝܢ ܐܢܐ
  choice: जिन लोगों का मैंने पालन-पोषण किया
  rationale: वाक्यांश बारूक द्वारा लोगों के पोषण या देखभाल को व्यक्त करता है; ‘पालन-पोषण किया’ हिन्दी में संबंध और उत्तरदायित्व दोनों रखता है।
theological_decisions:
- issue: 'शोक का विषय: सिय्योन के समानांतर नगर का नाम या ‘शोक’'
  choice: मुख्य पाठ में ‘यरूशलेम’
  alternative: ‘और मैं शोक के लिए कैसे रोऊँ और उसे पाऊँ?’ अथवा इसी प्रकार का कठिन शाब्दिक पाठ
  rationale: उपलब्ध पंक्ति पाठगत रूप से अस्थिर है। सिय्योन–यरूशलेम समानांतरता प्रबल है, किंतु इसे निश्चित मानकर कठिन पाठ को छिपाया नहीं गया; विकल्प पादटिप्पणी में सुरक्षित है।
- issue: लोगों के विषय में ‘दर्शन में मुझसे बड़े’ वाक्यांश
  choice: दर्शन में मुझसे बड़े थे
  alternative: मेरे लिए पहले एक महान दर्शन थे
  rationale: सिरिएक पंक्ति का विभाजन और संबंध कुछ कठिन है। परामर्श-पाठ की समझ को मुख्य पाठ में रखा गया है, बिना ‘दर्शन’ को आध्यात्मिक पद, याजकीय अधिकार या किसी संप्रदायगत श्रेणी में बदलने के।
