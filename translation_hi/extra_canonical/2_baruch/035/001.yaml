  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विलाप-शैली रखी गई है। काव्य-पंक्तियों में स्रोत की पुनरुक्ति और जल-संबंधी बिंब बनाए गए हैं। ‘दीन होकर’, ‘चैन पाऊँ’ और ‘पालन-पोषण’ सामान्य पाठक के लिए सहज हैं, जबकि ‘सिय्योन’ और ‘दर्शन’ जैसे पारंपरिक धार्मिक शब्द आवश्यक अर्थ-सटीकता के लिए सुरक्षित रखे गए हैं।
