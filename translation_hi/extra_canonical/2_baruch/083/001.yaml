  language: hi
  text: क्योंकि परमप्रधान निश्चय ही अपने समयों का आगमन शीघ्र करेगा और अपनी घड़ियों को अवश्य निकट लाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܝܐ
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त सीरियाई उपाधि का अर्थ और गरिमापूर्ण धार्मिक स्वर सुरक्षित रहता है।
- source_word: ܙܒܢܘܗܝ
  choice: अपने समयों
  rationale: बहुवचन और परमप्रधान से उसका संबंध सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से केवल एक ‘नियत समय’ में नहीं बदला गया।
- source_word: ܫܥܘܗܝ
  choice: अपनी घड़ियों
  rationale: ‘समयों’ के समानांतर मूल काल-संबंधी रूपक को बनाए रखता है; ‘अवसरों’ या ‘घटनाओं’ जैसे व्याख्यात्मक विकल्पों से बचता है।
- source_word: ܢܣܪܗܒ / ܢܝܬܐ
  choice: शीघ्र ले आएगा / निकट लाएगा
  rationale: पहली क्रिया की शीघ्रता और दूसरी की आगमन-संबंधी गति को स्वाभाविक हिन्दी में व्यक्त करते हुए काव्यात्मक समानांतरता बनाए रखी गई है।
theological_decisions:
- issue: ईश्वरीय समयों का स्वरूप
  choice: ‘अपने समयों’ और ‘अपनी घड़ियों’ की भाषा को बनाए रखा गया
  alternative: ‘अपने ठहराए हुए न्याय का समय’
  rationale: विस्तृत संदर्भ न्याय की ओर संकेत कर सकता है, पर इस पद में काल-संबंधी अभिव्यक्ति को सीधे न्याय तक सीमित करना मूल की व्यापकता और तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध वाक्य। मूल की दो समानांतर काल-संबंधी अभिव्यक्तियाँ तथा ‘निश्चय ही/अवश्य’ का आश्वस्तकारी बल सुरक्षित रखा गया है। उपलब्ध अध्याय-बकेट की सीमा अनिश्चित और अतिव्यापी है; पद की पहचान नियंत्रक अध्याय परंपरा से की गई है।
