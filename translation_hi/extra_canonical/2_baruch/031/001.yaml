  yaml_path: translation/extra_canonical/2_baruch/031/001.yaml
  text: 'And it happened after these things, that I went to the people and said to them, “Gather to me your elders and your children, and I will speak my words with them."”


    And they all assembled in the valley of Kidron.


    And I asked and said to them,'
translation:
  language: hi
  text: 'इन बातों के बाद ऐसा हुआ कि मैं लोगों के पास गया और उनसे कहा, “मेरे पास अपने बुज़ुर्गों और अपने बच्चों को इकट्ठा कर लाओ, और मैं उनसे अपनी बातें कहूँगा।”[a]


    तब वे सब किद्रोन की घाटी में इकट्ठे हुए।


    और मैंने उनसे पूछा और कहा,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं तुमसे अपनी बातें कहूँगा।”
    reason: अंग्रेज़ी POB audit trail में दर्ज वैकल्पिक संबोधन को संरक्षित रखने के लिए। मुख्य पाठ नियंत्रण-पाठ के ‘उनसे/उनके साथ’ पठन का अनुसरण करता है।
lexical_decisions:
- source_word: ܟܢܫܘ
  choice: इकट्ठा करो
  rationale: आज्ञार्थक क्रिया के सीधे बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ܣܒܝܟܘܢ
  choice: अपने पुरनियों
  rationale: यह समुदाय के बुज़ुर्ग अगुओं को सूचित करता है; ‘पुरनियों’ से सामाजिक भूमिका और पारंपरिक गरिमा दोनों बनी रहती हैं।
- source_word: ܒܢܝ̈ܟܘܢ
  choice: अपने बच्चों
  rationale: स्रोत में स्पष्ट रूप से उपस्थित ‘तुम्हारे बच्चों/पुत्रों’ को समावेशी और सहज हिन्दी में व्यक्त करता है।
- source_word: ܒܚܠܬܐ ܕܩܕܪܘܢ
  choice: किद्रोन की घाटी में
  rationale: स्थान-नाम को प्रचलित रूप में रखते हुए ‘घाटी’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ܒܥܝܬ
  choice: मैंने निवेदन करके
  rationale: क्रिया के माँगने या विनती करने के अर्थ को सुरक्षित रखता है; केवल ‘उत्तर दिया’ कहना स्रोत के अनुरूप नहीं होगा।
theological_decisions:
- issue: वक्ता की ‘अपनी बातें’ और संबोधन का सर्वनाम
  choice: ‘मैं उनसे अपनी बातें कहूँगा’ को मुख्य पाठ में रखा गया
  alternative: ‘मैं तुमसे अपनी बातें कहूँगा’
  rationale: पाठ-नियंत्रित मानक पठन में प्रथम पुरुष संबंधसूचक ‘मेरी/अपनी बातें’ और ‘उनसे’ का समर्थन मिलता है, जबकि दिए गए पृष्ठ की किनारी पाठ-स्थिति अस्थिर है; इसलिए वैकल्पिक संबोधन पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। ‘पुरनियों’ को समुदाय के मान्य बुज़ुर्गों की भूमिका बनाए रखने के लिए चुना गया है। अंतिम वाक्य को अल्पविराम पर खुला रखा गया है, क्योंकि आगे का संबोधन अगले पद में जारी होता है।
