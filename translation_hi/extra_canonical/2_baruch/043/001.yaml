  yaml_path: translation/extra_canonical/2_baruch/043/001.yaml
  text: 'But you, Baruch, fix your heart on what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will not again see the evil things that are now happening.

    Therefore go and command my people, and do not stir them up, because after these things, in the times to come, many days of affection will come. And I will make known to you and speak in your understanding.'
translation:
  language: hi
  text: 'परन्तु हे बारूक, जो कुछ तुमसे कहा गया है उस पर अपना मन स्थिर करो, और जो बातें तुम्हें दिखाई गई हैं उन्हें समझो; क्योंकि तुम्हारे लिए सदा बनी रहने वाली बड़ी सांत्वना है।


    क्योंकि अब से तुम फिर वे बुरी बातें नहीं देखोगे जो इस समय घट रही हैं।


    इसलिए, हे मेरे सेवको, आशा रखो और विचलित न हो। इन बातों के बाद आने वाले समय में प्रिय दिन आएँगे।[a] तब मैं तुम्हें बताऊँगा और तुम्हारी समझ में बातें कहूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य का सिरियाई पाठ कठिन और संभवतः विकृत है। इसका आशय ‘प्रिय/मनभावने दिन आएँगे’ हो सकता है; कुछ शब्दों का पारस्परिक संबंध निश्चित नहीं है।
    reason: पांडुलिपीय/पाठगत अनिश्चितता को छिपाकर अत्यधिक निश्चित अनुवाद देने से बचना।
lexical_decisions:
- source_word: ܒܪܘܫ ܐܬܩܢ ܠܒܟ
  choice: हे बारूक, ... अपना मन स्थिर करो
  rationale: ܐܬܩܢ ܠܒܟ का ठोस हृदय-संबंधी मुहावरा आंतरिक दृढ़ता और तत्परता बताता है। आधुनिक हिन्दी में ‘अपना मन स्थिर करो’ स्वाभाविक है और मूल बिंब को पर्याप्त रूप से बनाए रखता है।
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ ܕܒܠܥܕܡ
  choice: सदा बनी रहने वाली बड़ी सांत्वना
  rationale: ܒܘܝܐܐ सांत्वना या ढाढ़स का भाव देता है, ܣܓܝܐܐ उसकी प्रचुरता/महत्ता, और ܕܒܠܥܕܡ स्थायी अथवा अनंत अवधि। हिन्दी वाक्य इन तीनों पक्षों को बिना अनावश्यक सिद्धान्तीकरण के व्यक्त करता है।
- source_word: ܣܒܪܘ ܠܥܒܕܝ
  choice: हे मेरे सेवको, आशा रखो
  rationale: उपलब्ध सिरियाई पाठ में बहुवचन आज्ञा ܣܒܪܘ और ‘मेरे सेवक’ ܠܥܒܕܝ स्पष्ट हैं। इसलिए इसे परामर्श-परत के ‘जाकर मेरी प्रजा को आज्ञा दो’ के बजाय सीधे स्रोत के अनुसार रखा गया है।
- source_word: ܘܠܐ ܬܬܬܙܝܥܘܢ
  choice: विचलित न हो
  rationale: क्रिया हिलाए जाने, घबराने या विचलित होने का भाव देती है। ‘विचलित न हो’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: ܨܒܘ ܚܒܒܐ ܝܘܡ̈ܬܐ
  choice: प्रिय दिन आएँगे
  rationale: पंक्ति पाठगत रूप से कठिन है, पर ܚܒܒܐ और ܝܘܡ̈ܬܐ में ‘प्रिय/मनभावने दिन’ का भाव दिखाई देता है। क्रियात्मक संबंध को हिन्दी में न्यूनतम रूप से ‘आएँगे’ द्वारा व्यक्त किया गया है और अनिश्चितता को पादटिप्पणी में बताया गया है।
- source_word: ܘܡ̇ܘܕܥ ܐܢܐ ܠܟܘܢ ܘܐܡ̇ܠܠ ܒܡ̈ܕܥܝܟܘܢ
  choice: तब मैं तुम्हें बताऊँगा और तुम्हारी समझ में बातें कहूँगा
  rationale: बहुवचन संबोधन को बनाए रखा गया है। ‘तुम्हारी समझ में’ मूल के असामान्य बौद्धिक/अंतःकरण-संबंधी मुहावरे को अधिक व्याख्यायित किए बिना संरक्षित करता है।
theological_decisions:
- issue: बारूक को मिली सांत्वना की अवधि और स्वरूप
  choice: इसे ‘सदा बनी रहने वाली बड़ी सांत्वना’ कहा गया है।
  alternative: केवल वर्तमान भावनात्मक ढाढ़स, अथवा अधिक विशिष्ट परलोक-सिद्धान्त
  rationale: सिरियाई पद स्थायी सांत्वना की ओर संकेत करता है, पर इस वाक्य में उसके साधन या परलोकगत रूप को स्पष्ट नहीं करता। इसलिए स्थायित्व रखा गया है, पर कोई विशिष्ट तंत्र नहीं जोड़ा गया।
- issue: आज्ञा का संबोधन
  choice: ‘हे मेरे सेवको, आशा रखो’—बहुवचन संबोधन।
  alternative: ‘जाओ और मेरी प्रजा को आज्ञा दो’—बारूक को एकवचन आदेश
  rationale: प्रस्तुत सिरियाई साक्ष्य में ܣܒܪܘ और ܬܬܬܙܝܥܘܢ बहुवचन हैं तथा ܠܥܒܕܝ ‘मेरे सेवको/मेरे सेवकों’ को सूचित करता है। परामर्शात्मक अंग्रेज़ी पाठ इस स्थान पर स्रोत से मेल नहीं खाता।
- issue: आने वाले दिनों का चरित्र
  choice: ‘प्रिय दिन’
  alternative: ‘स्नेह के बहुत-से दिन’ या ‘मनभावने दिन’
  rationale: पाठ कठिन है; अनिश्चित वाक्यविन्यास को किसी निश्चित युगान्तकारी समय-सारिणी में नहीं बदला गया। स्पष्ट शब्द-साक्ष्य के निकट रहते हुए अर्थगत तनाव सुरक्षित रखा गया है।
