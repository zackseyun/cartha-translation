  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यदर्शी शैली। ‘मन स्थिर करो’, ‘सांत्वना’, ‘आशा रखो’ और ‘विचलित न हो’ सामान्य पाठक के लिए सुबोध हैं। स्रोत में जहाँ एकवचन बारूक से संबोधन बहुवचन ‘मेरे सेवको’ में बदलता है, उस वास्तविक व्याकरणिक तनाव को समतल नहीं किया गया।
