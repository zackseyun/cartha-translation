  text: '"Pull down its walls and overturn them to their foundations, lest the enemies boast and say, ''We ourselves have pulled down the wall of Zion, and we have burned the dwelling place of the mighty God.''"'
translation:
  language: hi
  text: “इसकी दीवारें गिरा दो और उन्हें उनकी नींव तक उखाड़ दो, कहीं ऐसा न हो कि शत्रु घमंड करके कहें, ‘हमने ही सिय्योन की दीवार गिराई और सामर्थी परमेश्वर के निवास-स्थान को जला दिया।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܪ̈ܝܗ
  choice: इसकी दीवारें
  rationale: प्रस्तुत पांडुलिपि-पाठ में बहुवचन-चिह्न दिखाई देता है और आदेश के आगे आने वाले सर्वनाम से भी बहुवचन अर्थ स्वाभाविक है; इसलिए अद्यतन परामर्श-पाठ के अनुसार बहुवचन रखा गया।
- source_word: ܥܘܪ̈ܩܘ
  choice: उन्हें नींव तक उलट दो
  rationale: क्रिया दीवारों को जड़ या नींव तक उखाड़ने/उलटने का भाव देती है। ‘उलट दो’ विनाश की तीव्रता बनाए रखते हुए सहज हिन्दी है।
- source_word: ܢܫܬܒܗܪܘܢ
  choice: घमंड करके कहें
  rationale: इसका अर्थ अपने किए पर डींग मारना या गर्व करना है; प्रसंग में ‘घमंड करके कहें’ स्वाभाविक है।
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  choice: सामर्थी परमेश्वर के निवास-स्थान
  rationale: मंदिर को परमेश्वर का निवास-स्थान कहा गया है; उपलब्ध पाठ-साक्ष्य और परामर्श-पाठ के अनुरूप दैवी विशेषण को ‘सामर्थी’ से व्यक्त किया गया।
theological_decisions:
- issue: मंदिर को परमेश्वर का निवास-स्थान कहना
  choice: सामर्थी परमेश्वर के निवास-स्थान
  alternative: सामर्थी परमेश्वर के भवन
  rationale: ‘निवास-स्थान’ मूल अभिव्यक्ति का स्थान-संबंधी अर्थ बनाए रखता है और किसी विशेष सांप्रदायिक मंदिर-विज्ञान को नहीं जोड़ता।
- issue: शत्रुओं की भूमिका और नगर-विनाश
  choice: कहीं ऐसा न हो कि शत्रु घमंड करके कहें
  alternative: ताकि शत्रु घमंड न करें
  rationale: 'उद्देश्यसूचक निषेध को इस प्रकार रखा गया है कि मूल की विडंबना और तनाव बना रहे: विनाश शत्रुओं को उसका श्रेय लेने से रोकने के लिए पहले ही कराया जाता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। अनुवाद केवल 8:2 तक सीमित है; स्रोत-पृष्ठ पर साथ आए 8:1 और 8:3 के अंश शामिल नहीं किए गए। उद्धरण के भीतर शत्रुओं की डींग को स्पष्ट रखने के लिए ‘हमने ही’ प्रयोग किया गया है।
