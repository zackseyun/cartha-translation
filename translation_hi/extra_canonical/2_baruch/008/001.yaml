  revised_text: '**2 बारूक 8:1**


    और मैंने देखा कि वह परमपवित्र स्थान में गया और वहाँ से परदे, एपोद, वेदी, पवित्र आवरण,[a] दोनों पटियाएँ,[b] याजकों के पवित्र वस्त्र, धूपदान,[c] अड़तालीस बहुमूल्य रत्न और पवित्र तंबू के सभी पवित्र पात्र ले गया। फिर उसने ऊँचे स्वर में पृथ्वी से कहा, “हे पृथ्वी, पृथ्वी, पृथ्वी! सामर्थी परमेश्वर का वचन सुन। जो कुछ मैं तुझे सौंपता हूँ, उसे ग्रहण कर और अंतिम समय तक सुरक्षित रख। जब तुझे आज्ञा दी जाए, तब तू इन्हें लौटा देना, ताकि परदेशी इन पर घमण्ड न करें। क्योंकि वह समय निकट आ गया है जब यरूशलेम भी कुछ समय के लिए सौंप दिया जाएगा—जब तक यह न कहा जाए कि उसका पुनःस्थापन फिर सदा के लिए होगा।”'
