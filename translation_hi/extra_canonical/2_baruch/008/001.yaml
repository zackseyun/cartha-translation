  register: आधुनिक मानक हिन्दी में गंभीर किंतु सुबोध धार्मिक शैली रखी गई है। ‘एपोद’ जैसे विशिष्ट उपासना-संबंधी पद को लिप्यंतरित किया गया है; सामान्य वस्तुओं के लिए सहज हिन्दी अपनाई गई है। पृथ्वी के त्रिगुण संबोधन और यरूशलेम के न्याय तथा पुनःस्थापन के बीच मूल तनाव को यथावत रखा गया है।
