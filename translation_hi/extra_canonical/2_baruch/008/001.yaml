  yaml_path: translation/extra_canonical/2_baruch/008/001.yaml
  text: And I saw that he went into the Holy of Holies, and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."
translation:
  language: hi
  text: '**2 बारूक 8:1**


    और मैंने देखा कि वह परमपवित्र स्थान में गया और वहाँ से परदे, एपोद, वेदी, पवित्र आवरण,[a] दोनों पटियाएँ,[b] याजकों के पवित्र वस्त्र, धूपदान,[c] अड़तालीस बहुमूल्य रत्न और पवित्र तंबू के सभी पवित्र पात्र ले गया। फिर उसने ऊँचे स्वर में पृथ्वी से कहा, “हे पृथ्वी, पृथ्वी, पृथ्वी! सामर्थी परमेश्वर का वचन सुन। जो कुछ मैं तुझे सौंपता हूँ, उसे ग्रहण कर और अंतिम समय तक सुरक्षित रख। जब तुझे आज्ञा दी जाए, तब तू इन्हें लौटा देना, ताकि परदेशी इन पर घमण्ड न करें। क्योंकि वह समय निकट आ गया है जब यरूशलेम भी कुछ समय के लिए सौंप दिया जाएगा—जब तक यह न कहा जाए कि उसका पुनःस्थापन फिर सदा के लिए होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वस्तु की ठीक पहचान कुछ अनिश्चित है; संभवतः यह वाचा के संदूक का पवित्र ढक्कन, अर्थात् ‘दया-आसन,’ है।
    reason: सिरिएक शब्द और सूची का पाठ कुछ कठिन है; पादटिप्पणी संभावित पहचान बताती है, पर मुख्य पाठ में निश्चितता आरोपित नहीं करती।
  - marker: b
    text: पाठ कठिन है; आशय संभवतः वाचा की दो पत्थर की पटियाओं से है।
    reason: उपलब्ध पाठ अस्थिर है, यद्यपि सूची का पारंपरिक अर्थ वाचा की पटियाओं का समर्थन करता है।
  - marker: c
    text: इस पवित्र वस्तु की ठीक पहचान अनिश्चित है; इसका अर्थ कोई याजकीय आभूषण भी हो सकता है।
    reason: सिरिएक पद के लिए एक से अधिक पवित्र वस्तुएँ प्रस्तावित हैं, इसलिए वैकल्पिक अर्थ सुरक्षित रखा गया है।
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  choice: परमपवित्र स्थान
  rationale: यह पवित्रस्थान के सबसे भीतरी भाग के लिए प्रचलित सामी अतिशयोक्तिपरक अभिव्यक्ति है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ܦܪ̈ܘܟܬܐ
  choice: परदे
  rationale: शब्द पवित्रस्थान के पर्दों अथवा आवरणों को दर्शाता है; ‘परदे’ सामान्य पाठक के लिए स्पष्ट रहते हुए धार्मिक संदर्भ बनाए रखता है।
- source_word: ܚܘܣܝܐ
  choice: प्रायश्चित्त-आवरण
  rationale: यह संभवतः वाचा के संदूक से जुड़ा पवित्र आवरण है। यह अनुवाद वस्तु के धार्मिक कार्य को व्यक्त करता है, जबकि पादटिप्पणी पाठगत अनिश्चितता बताती है।
- source_word: ܘܬܪ̈ܬܝܢ ܟܘܪ̈ܣܘ
  choice: दोनों पटियाएँ
  rationale: पांडुलिपि-पाठ कठिन है, पर पवित्र वस्तुओं की सूची और परंपरागत समझ वाचा की दो पटियाओं की ओर संकेत करती है।
- source_word: ܦܝܪܡܐ
  choice: धूपदान
  rationale: वर्तमान साक्ष्य में वस्तु की ठीक पहचान अनिश्चित है; संदर्भ में यह एक पवित्र उपासना-वस्तु है और ‘धूपदान’ संभावित अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ܐܪܥܐ ܐܪܥܐ ܐܪܥܐ
  choice: हे पृथ्वी, पृथ्वी, पृथ्वी!
  rationale: तीन बार किया गया संबोधन मूल की गंभीर अलंकारिक शक्ति को सुरक्षित रखता है और पृथ्वी को वस्तुओं की रक्षक के रूप में प्रस्तुत करता है।
- source_word: ܡܠܘܐܐ ... ܕܡܫܟܢܐ
  choice: पवित्र निवास के सभी पवित्र पात्र
  rationale: ‘पवित्र निवास’ तंबू-सदृश धार्मिक निवास का अर्थ देता है और ‘पात्र’ पूजा में प्रयुक्त विविध उपकरणों को समेटता है।
theological_decisions:
- issue: पवित्र वस्तुओं को पृथ्वी में सुरक्षित रखना
  choice: पृथ्वी को वस्तुएँ ग्रहण करके अंतिम समय तक सुरक्षित रखने और आज्ञा मिलने पर लौटाने का आदेश दिया गया है।
  alternative: इसे केवल साधारण दफनाने या छिपाने के रूप में व्यक्त करना।
  rationale: पाठ पृथ्वी को संबोधित सक्रिय आदेश और भविष्य में पुनःस्थापन प्रस्तुत करता है; इसलिए यह दैवी संरक्षण का चित्र है, केवल आकस्मिक हानि का नहीं।
- issue: यरूशलेम का अस्थायी रूप से सौंपा जाना
  choice: विनाश को सीमित अवधि के लिए ‘सौंपे जाने’ और अंततः स्थायी पुनःस्थापन के तनाव सहित रखा गया है।
  alternative: सौंपे जाने को पूर्ण और अंतिम परित्याग के रूप में प्रस्तुत करना।
  rationale: मूल कथन न्याय और भविष्य की पुनःस्थापना दोनों को साथ रखता है; किसी एक पक्ष को दबाना उचित नहीं।
- issue: ‘परदेशियों’ का घमण्ड
  choice: पवित्र वस्तुओं को इस उद्देश्य से सुरक्षित रखा जाता है कि परदेशी उन पर घमण्ड न करें।
  alternative: इसे केवल लूट से बचाने का व्यावहारिक उपाय कहना।
  rationale: पाठ में चिंता केवल वस्तुओं के नष्ट होने की नहीं, बल्कि विदेशी विजेताओं के धार्मिक घमण्ड की भी है।
