lexical_decisions:
- source_word: (उपलब्ध स्रोत-पृष्ठ में 2 बारूक 28:1 का सिरियाई पाठ अनुपस्थित)
  choice: जो समझ रखता है
  rationale: दिए गए अंग्रेज़ी परामर्श-पाठ के “whoever understands” को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; प्रत्यक्ष सिरियाई पद उपलब्ध न होने के कारण किसी विशिष्ट सिरियाई शब्द का दावा नहीं किया गया।
- source_word: (उपलब्ध स्रोत-पृष्ठ में 2 बारूक 28:1 का सिरियाई पाठ अनुपस्थित)
  choice: उस समय बुद्धिमान होगा
  rationale: अंग्रेज़ी परामर्श-पाठ के भावी और काल-सूचक बल को बनाए रखते हुए हिन्दी में सहज शब्दक्रम अपनाया गया है।
theological_decisions:
- issue: क्या ‘समझ’ को किसी विशेष प्रकार की आध्यात्मिक या रहस्योद्घाटन-संबंधी समझ के रूप में स्पष्ट किया जाए
  choice: सामान्य और खुला पदबंध ‘जो समझ रखता है’ रखा गया।
  alternative: ‘जो इन बातों को समझता है’ अथवा ‘जिसे आत्मिक समझ है’
  rationale: उपलब्ध पाठ ऐसी विशिष्टता स्थापित नहीं करता; उसे जोड़ना अर्थ और धर्मवैचारिक बल को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण। दिए गए स्रोत-बकेट में वास्तव में 2 बारूक 27:1-10 का पाठ दिखाई देता है, 28:1 का सिरियाई मूल नहीं; इसलिए मुख्य अनुवाद ऑडिट किए गए अंग्रेज़ी परामर्श-पाठ के आधार पर सावधानी से रखा गया है और अध्याय 27 की सामग्री को पद 28:1 में नहीं मिलाया गया।
