translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “तो यह वचन सुनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  choice: उसने मुझे उत्तर दिया
  rationale: यह सिरिएक कथन-सूत्र उत्तर देने और बारूक को संबोधित करने को सीधे व्यक्त करता है; स्वाभाविक हिन्दी में ‘कहा’ को अलग से दोहराना आवश्यक नहीं है।
- source_word: ܫܡܥ
  choice: सुनो
  rationale: आज्ञार्थक क्रिया का सीधा और सामान्य हिन्दी रूप।
- source_word: ܒܪܡ
  choice: तो
  rationale: यहाँ यह संवाद को आगे बढ़ाने वाला अव्यय है; ‘तो’ आधुनिक हिन्दी में प्रसंगगत संक्रमण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܡܠܬܐ
  choice: यह वचन
  rationale: शब्द का अर्थ ‘बात/वचन’ हो सकता है। आगामी ईश्वरीय कथन की गंभीरता के अनुरूप ‘वचन’ चुना गया, जबकि ‘यह’ हिन्दी में संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: इस पद की सीमा
  choice: केवल उत्तर और ‘यह वचन सुनो’ वाला आरंभिक वाक्य रखा गया है।
  alternative: पुनरुत्थान और न्याय से संबंधित अगले पदों की सामग्री भी इसी पद में जोड़ना।
  rationale: दिए गए सिरिएक पाठ में अध्याय 50:1 का आरंभ ܥܢܐ ܘܐܡܪ ܠܝ ܫܡܥ ܒܪܡ ܡܠܬܐ से होता है; आगे की सामग्री इस स्रोत-पृष्ठ पर उपलब्ध नहीं और पद 1 की निर्धारित सीमा से बाहर है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘यह वचन सुनो’ मूल की संक्षिप्तता और गंभीरता बनाए रखता है।
