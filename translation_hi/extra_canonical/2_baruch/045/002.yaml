  choice: ‘कुछ भी नहीं’ और ‘अत्यन्त महान’ के रूप में मूल विरोध बनाए रखा गया
  alternative: ‘बहुत कम महत्त्व का’ और ‘बहुत महत्त्वपूर्ण’
  rationale: मूल पाठ निरपेक्ष और प्रबल भाषा का प्रयोग करता है; व्याख्यात्मक नरमी उस तनाव को घटा देती।
