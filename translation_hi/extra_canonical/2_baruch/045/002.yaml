  choice: जो अब है
  rationale: वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप; वर्तमान में विद्यमान स्थिति का बोध कराता है।
- source_word: ܠܐ ܗܘܐ ܡܕܡ
  choice: वह कुछ भी नहीं है
  rationale: मूल के प्रबल नकार को सुरक्षित रखता है और भाव को नरम करके केवल ‘महत्त्वहीन’ नहीं बनाता।
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܗܘܐ
  choice: जो होनेवाला है
  rationale: भविष्य में अस्तित्व में आने वाली बात के अर्थ को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
- source_word: ܪܒ ܣܓܝ
  choice: अत्यन्त महान
  rationale: ‘बहुत/अत्यधिक महान’ के तीव्र अर्थ को गरिमापूर्ण हिन्दी में बनाए रखता है।
