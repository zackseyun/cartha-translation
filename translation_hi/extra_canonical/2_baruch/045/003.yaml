  text: क्योंकि जो कुछ नाशवान है और नष्ट हो जाता है, वह कुछ नहीं रह जाता; और जो समय बीत चुका है, वह अब भुला दिया जाता है; इसके बाद उसे स्मरण में खोजा नहीं जाता।
  philosophy: optimal-equivalence
