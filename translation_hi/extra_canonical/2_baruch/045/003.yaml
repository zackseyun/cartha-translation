- source_word: ܡܬܚܒܠ
  choice: नाशवान है
  rationale: यह रूप उस वस्तु को दर्शाता है जो नष्ट या क्षय होने के अधीन है; ‘नाशवान’ हिन्दी में अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ܡܬܛܥܐ
  choice: भुला दिया जाता है
  rationale: सिरिएक का निष्क्रिय भाव सुरक्षित रखते हुए बीते समय के विस्मृत हो जाने का अर्थ व्यक्त किया गया है।
- source_word: ܒܥܘܗܕܢܐ
  choice: स्मृति में
  rationale: शब्द का आशय स्मरण या याद से है; ‘स्मृति में’ अगले क्रियापद ‘खोजा जाता’ के साथ स्रोत की अभिव्यक्ति को बनाए रखता है।
