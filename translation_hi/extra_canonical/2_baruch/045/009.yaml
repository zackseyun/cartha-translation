translation:
  language: hi
  text: वे आनेवाले लोगों के छिपे हुए दुःख की छानबीन करना चाहते हैं; पर उस बात की पड़ताल, जिसके द्वारा बहुत-से लोग धर्मी ठहराए गए, वे नहीं देखेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसके द्वारा बहुत-से लोग निर्दोष सिद्ध हुए।”
    reason: ܐܙܕܕܩܘ का अर्थ ‘धर्मी ठहराए गए’ हो सकता है, अथवा न्यायिक संदर्भ में ‘निर्दोष सिद्ध हुए’।
lexical_decisions:
- source_word: ܥܘܩܢ
  choice: दुःख
  rationale: यह शब्द कष्ट, पीड़ा या संताप का बोध कराता है; प्रसंग में ‘दुःख’ सहज और व्यापक है।
- source_word: ܡܬܒܥܝ
  choice: छानबीन करना
  rationale: मूल में खोजने या जाँचने का भाव है; ‘छानबीन’ उस सक्रिय पूछताछ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܡܬܚܣܟ
  choice: छिपे हुए
  rationale: यहाँ किसी बात के रोके, बचाकर रखे या दृष्टि से ओझल होने का भाव है; अंग्रेज़ी परामर्श-पाठ का ‘hidden’ भी इसी अर्थ की पुष्टि करता है।
- source_word: ܡܒܩܪܐ
  choice: दण्ड-विचार
  rationale: शब्द में निरीक्षण, जाँच या visitation का भाव है; न्याय-संबंधी प्रसंग में ‘दण्ड-विचार’ दैवी जाँच और उसके परिणाम दोनों को संक्षेप में व्यक्त करता है।
- source_word: ܐܙܕܕܩܘ
  choice: धर्मी ठहराए गए
  rationale: एत्पआल रूप का अर्थ धर्मी सिद्ध/ठहराया जाना है; यह निष्क्रियता और न्यायिक रंग दोनों बनाए रखता है।
theological_decisions:
- issue: ܐܙܕܕܩܘ में न्यायिक या नैतिक अर्थ
  choice: धर्मी ठहराए गए
  alternative: निर्दोष सिद्ध हुए / न्याय पाए
  rationale: ‘धर्मी ठहराए गए’ मूल की निष्क्रिय और धर्म-संबंधी भाषा को बिना यह तय किए सुरक्षित रखता है कि कर्ता कौन है या प्रक्रिया ठीक किस प्रकार की है।
- issue: ܡܒܩܪܐ का अर्थ
  choice: दण्ड-विचार
  alternative: जाँच / सुधि लेना / दैवी आगमन
  rationale: पद न्यायपूर्ण निरीक्षण की ओर संकेत करता है; ‘दण्ड-विचार’ को चुना गया है, पर पाठ किसी विशेष अन्तकालीन सिद्धान्त को स्पष्ट रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। वाक्य की विरोधात्मक संरचना और ‘दण्ड-विचार’ तथा ‘धर्मी ठहराए गए’ के बीच का धर्मवैचारिक तनाव सुरक्षित रखा गया है।
