  text: …that belong to corruption and its ways, ways that cannot be searched out, whatever they may be. But if you endure and stand in his fear and do not go astray from his law, the times will be changed in their season for good, and you will see the consolation of Zion.
translation:
  language: hi
  text: 1 …जो विनाश और उसके मार्गों से संबंधित हैं—ऐसे मार्ग, जिनकी थाह नहीं पाई जा सकती, चाहे वे जैसे भी हों।[a] पर यदि तुम धीरज धरो, उसके भय में स्थिर रहो और उसकी व्यवस्था से न भटको, तो समय अपने-अपने नियत अवसर पर भलाई के लिए बदल जाएंगे, और तुम सिय्योन की सांत्वना देखोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “ऐसे मार्ग, जिनकी खोज नहीं की जा सकती, वे चाहे जो भी हों।”'
    reason: ܡܬܒ̈ܩܥܢ खोज, जाँच और समझ की सीमा का संकेत दे सकता है; साथ का सिरिएक मुहावरा ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ शाब्दिक रूप से असामान्य है और ‘वे चाहे जो भी हों’ के रूप में भी दिया जा सकता है।
lexical_decisions:
- source_word: ܕܚܒܠܬܐ
  choice: विनाश
  rationale: यह पद पिछले वाक्य से खंडित रूप में आरंभ होता है। मूल शब्द बिगाड़, नाश या क्षय का भाव रखता है; यहाँ ‘विनाश’ सहज है और आने वाले अविनाशी युग के साथ निहित विरोध बनाए रखता है।
- source_word: ܐܘܪ̈ܚܬܗ ܕܠܐ ܡܬܒ̈ܩܥܢ
  choice: ऐसे मार्ग, जिनकी थाह नहीं पाई जा सकती
  rationale: ܡܬܒܩܥܢ खोजने, जाँचने या पूरी तरह समझ पाने की असमर्थता व्यक्त करता है। ‘थाह नहीं पाई जा सकती’ आधुनिक हिन्दी में इस अगम्यता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ
  choice: चाहे वे जैसे भी हों
  rationale: शाब्दिक रूप से कठिन दोहराव को छोड़े बिना उसके अनिश्चिततासूचक भाव—‘वे जो भी/जैसे भी हों’—को स्पष्ट हिन्दी में रखा गया है।
- source_word: ܬܣܝܒܪܘܢ
  choice: धीरज धरो
  rationale: क्रिया सहने और दृढ़ बने रहने का अर्थ देती है। ‘धीरज धरो’ पीड़ा-सहन और स्थिरता दोनों को संक्षेप में व्यक्त करता है।
- source_word: ܬܩܘܡܘܢ ܒܕܚܠܬܗ
  choice: उसके भय में स्थिर रहो
  rationale: ܩܘܡ का मूल भाव खड़े रहने का है; प्रसंग में यह श्रद्धापूर्ण भय में दृढ़ बने रहने को दर्शाता है।
- source_word: ܢܡܘܣܗ
  choice: उसकी व्यवस्था
  rationale: ܢܡܘܣܐ के लिए ‘व्यवस्था’ धार्मिक-विधिक अर्थ को बनाए रखने वाला परिचित और गरिमापूर्ण हिन्दी पद है।
- source_word: ܡܬܚܠܦܝܢ ܒܥܕܢܗܘܢ ܙܒ̈ܢܐ ܠܛܒܬܐ
  choice: अपने नियत समय पर समय भलाई के लिए बदल जाएंगे
  rationale: मूल में कालों/समयों के अपने अवसर पर बदलने का अपोकैलिप्टिक भाव है। पुनरुक्त ‘समय’ हिन्दी में कुछ औपचारिक है, पर स्रोत की शब्दावली और अवधारणा को सुरक्षित रखता है।
- source_word: ܒܘܝܐܐ ܕܨܝܘܢ
  choice: सिय्योन की सांत्वना
  rationale: ܒܘܝܐܐ सांत्वना या दिलासा है। ‘सिय्योन की सांत्वना’ व्यक्तिगत भावनात्मक राहत तक अर्थ को सीमित किए बिना सामुदायिक और भावी पुनर्स्थापना का स्वर बनाए रखता है।
theological_decisions:
- issue: भविष्य की आशा का सिय्योन-केंद्रित स्वर
  choice: सिय्योन की सांत्वना
  alternative: सिय्योन का दिलासा
  rationale: मूल पाठ आशा को स्पष्ट रूप से सिय्योन से जोड़ता है। ‘सांत्वना’ पुनर्स्थापना के सामुदायिक और युगांतकारी आयाम को बनाए रखती है।
- issue: भलाई के लिए समयों का बदलना
  choice: अपने नियत समय पर समय भलाई के लिए बदल जाएंगे
  alternative: समय आने पर परिस्थितियाँ सुधर जाएंगी
  rationale: स्रोत केवल परिस्थितियों के सामान्य सुधार की बात नहीं करता, बल्कि समयों के बदलने की बात करता है। इसलिए अपोकैलिप्टिक तनाव को साधारण आशावाद में नहीं बदला गया।
- issue: ‘उसके भय’ का संदर्भ
  choice: उसके भय में स्थिर रहो
  alternative: परमेश्वर का भय मानते हुए स्थिर रहो
  rationale: सिरिएक में सर्वनाम है, स्पष्ट संज्ञा नहीं। संदर्भ परमेश्वर की ओर संकेत करता है, फिर भी अनुवाद ने स्रोत की सर्वनामात्मक अभिव्यक्ति को बनाए रखा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। पद का आरंभ स्रोत में पिछले वाक्य की निरंतरता है, इसलिए आरंभिक दीर्घविराम रखा गया है। बहुवचन संबोधन के लिए सामान्य हिन्दी ‘तुम’ प्रयोग हुआ है; आदेशात्मक क्रियाएँ बहुवचन अर्थ रखती हैं।
