base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/004.yaml
  text: For what has passed away into corruption, and what is corrupted falls and is forgotten. But what is to come is what is sought; what has passed from the hand is no longer reckoned.
translation:
  language: hi
  text: क्योंकि जो अस्तित्व में आ चुका है, वह विनाश की ओर चला जाता है[a]; और जो नष्ट होता है, वह विस्मृति में पड़ जाता है और भुला दिया जाता है। पर जो आनेवाला है, उसी की खोज की जाती है; जो हाथ से निकल चुका है, उसकी फिर गिनती नहीं होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विनाश की ओर पार चला जाता है’।
    reason: ܚܠܦ में ‘चला जाना/बीत जाना’ तथा ‘पार जाना’ दोनों भाव संभव हैं। मुख्य पाठ प्रसंगानुकूल सहज हिन्दी देता है और पादटिप्पणी निकटतर वैकल्पिक भाव सुरक्षित रखती है।
lexical_decisions:
- source_word: ܚܠܦ
  choice: बीत गया है
  rationale: क्रिया का मूल भाव बीतने या पार जाने का है। प्रसंग में वर्तमान व्यवस्था के नाश की ओर चले जाने को व्यक्त करने के लिए यह स्वाभाविक हिन्दी है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ܠܡܬܚܒܠܘ
  choice: नाश की ओर
  rationale: यह आत्मवाचक/कर्मवाचक रूप बिगड़ने, नष्ट होने या भ्रष्ट होने का भाव देता है। यहाँ क्षयशील वस्तुओं के अंत की बात है, इसलिए ‘नाश’ स्पष्ट और प्रसंगानुकूल है।
- source_word: ܒܥܘܗܕܢܐ ܢܦܠܐ ܘܡܬܛܥܐ
  choice: स्मृति से मिट जाता और भुला दिया जाता है
  rationale: वाक्यांश स्मरण से गिरने और भुला दिए जाने का संयुक्त भाव रखता है। शाब्दिक ‘स्मृति में गिरता है’ हिन्दी में भ्रामक होता, इसलिए आशय को स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ܡܬܒܥܐ
  choice: खोज की जाती है
  rationale: इस कर्मवाचक रूप में खोजे जाने, चाहे जाने या जिसकी ओर ध्यान लगाया जाए, ऐसा भाव हो सकता है। ‘खोज की जाती है’ स्रोत की सक्रिय प्रत्याशा को बनाए रखता है।
- source_word: ܥܒܪ ܡܢ ܐܝܕܐ
  choice: हाथ से निकल चुका है
  rationale: स्रोत का मुहावरा वस्तु के अधिकार या पहुँच से बाहर हो जाने को दर्शाता है। हिन्दी का यही मुहावरा अर्थ और चित्र दोनों को सुरक्षित रखता है।
- source_word: ܡܬܚܫܒ
  choice: गिनती नहीं होती
  rationale: क्रिया का अर्थ गिनना, मानना या लेखे में लेना हो सकता है। ‘गिनती नहीं होती’ लेखे में न रहने का भाव सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वर्तमान क्षयशील अवस्था और आनेवाली वास्तविकता के बीच संबंध
  choice: ‘जो हो चुका है’ और ‘जो आनेवाला है’ का खुला कालगत विरोध बनाए रखा गया
  alternative: इसे स्पष्ट रूप से वर्तमान संसार और अनन्त जगत के सिद्धान्त के रूप में विस्तार देना
  rationale: स्रोत भविष्य की श्रेष्ठता और बीती हुई क्षयशील वस्तुओं के विस्मरण पर बल देता है, पर इस पद में उनकी सटीक धर्मवैज्ञानिक पहचान नहीं करता। इसलिए अनकहा सिद्धान्त नहीं जोड़ा गया।
- issue: ‘जिसकी खोज की जाती है’ का कर्ता
  choice: कर्मवाचक अभिव्यक्ति रखी गई
  alternative: ‘मनुष्य उसी की खोज करते हैं’ या ‘परमेश्वर उसी को खोजता है’
  rationale: स्रोत कर्ता को निर्दिष्ट नहीं करता; कर्मवाचक हिन्दी उस वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्यरचना द्वारा बीती हुई क्षयशील वस्तुओं और आनेवाली अपेक्षित वास्तविकता का विरोध स्पष्ट किया गया है; स्रोत की कर्मवाचकता और धर्मवैज्ञानिक अनिर्दिष्टता को नहीं बदला गया।
