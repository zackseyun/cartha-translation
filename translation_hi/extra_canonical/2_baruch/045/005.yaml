  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘नियत काल’, ‘व्यवस्थित करेगा’ और ‘जाँच करेगा’ स्रोत की समय-संबंधी तथा न्यायिक भाषा को बिना सांप्रदायिक विस्तार के व्यक्त करते हैं।
