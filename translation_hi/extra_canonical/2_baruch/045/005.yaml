base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/005.yaml
  text: For when the time that does not pass away comes and its season arrives, it sets its deeds in order and examines its sins. Those who belong to it do not add anguish to destruction.
translation:
  language: hi
  text: क्योंकि जब वह समय आएगा जो कभी नहीं बीतेगा, और उसका नियत काल आ पहुँचेगा, तब वह अपने कामों को व्यवस्थित करेगा और अपने पापों की जाँच करेगा।[a] जो उसके हैं, वे विनाश के साथ और पीड़ा नहीं जोड़ते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘समय’ को मानो एक व्यक्ति की तरह अपने कामों को व्यवस्थित करने और अपने पापों की जाँच करने वाला बताया गया है; सिरिएक में यही व्याकरणिक रूप बना रहता है।
    reason: स्रोत के असामान्य मानवीकरण और कर्ता-संबंधी वास्तविक अस्पष्टता को पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ܙܒܢܐ ܕܠܐ ܥܒܪ
  choice: वह समय…जो कभी नहीं बीतेगा
  rationale: पाठ का आशय न बीतने वाले समय से है; भविष्यकालीन प्रसंग को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ܥܕܢܗ
  choice: उसका नियत काल
  rationale: ܥܕܢܐ केवल सामान्य ‘समय’ नहीं, किसी निर्धारित अवसर या ऋतु का भी बोध कराता है; ‘नियत काल’ इस भेद को बनाए रखता है।
- source_word: ܡܫܘܐ ܥܒܕܘܗܝ
  choice: अपने कामों को व्यवस्थित करेगा
  rationale: ܡܫܘܐ में ठीक करने, क्रम में रखने या समुचित रूप देने का भाव है; ‘व्यवस्थित करेगा’ अनावश्यक व्याख्या के बिना यह अर्थ देता है।
- source_word: ܡܒܩܪ ܚܛܗܝܗ
  choice: अपने पापों की जाँच करेगा
  rationale: ܒܩܪ का अर्थ जाँच करना या लेखा लेना है; ‘जाँच’ न्यायिक संकेत को खुला रखती है।
- source_word: ܥܘܩܢܐ ܥܠ ܚܒܠܐ
  choice: विनाश में और पीड़ा
  rationale: यह पदबंध पीड़ा/क्लेश को विनाश या भ्रष्टता के ऊपर जोड़ने का भाव देता है; हिन्दी में ‘विनाश में और पीड़ा जोड़ना’ स्रोत की संक्षिप्तता और तनाव बनाए रखता है।
theological_decisions:
- issue: ‘समय’ को कार्य करने वाले कर्ता के रूप में प्रस्तुत करना
  choice: समय को ही ‘व्यवस्थित करेगा’ और ‘जाँच करेगा’ का व्याकरणिक कर्ता रखा गया है
  alternative: इन क्रियाओं का कर्ता परमेश्वर मानकर स्पष्ट कर देना
  rationale: सिरिएक पाठ में निकटतम कर्ता ‘समय’ है और भाषा मानवीकरण जैसी है। परमेश्वर को स्पष्ट कर्ता बनाना एक सम्भव व्याख्या तो है, पर वह पाठ में निहित अस्पष्टता को समाप्त कर देगा।
- issue: ‘जो उसके हैं’ का संदर्भ
  choice: सर्वनामिक अभिव्यक्ति को यथावत खुला रखा गया है
  alternative: इसे स्पष्टतः उस युग के धर्मी लोग या परमेश्वर के लोग कहना
  rationale: ܕܕܝܠܗ ܐܢܘܢ संबंध तो बताता है, पर समूह की पहचान को स्पष्ट नहीं करता; इसलिए किसी विशेष धार्मिक पहचान को नहीं जोड़ा गया।
