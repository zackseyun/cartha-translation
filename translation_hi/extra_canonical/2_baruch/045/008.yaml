  text: But those who turned themselves toward darkness and received lies, and lost the settledness of hope, and sought out vanities, and did not show mercy, nor keep the path of discipline—
translation:
  language: hi
  text: परन्तु जो अंधकार की ओर मुड़ गए, झूठ को अपना लिया, आशा की स्थिरता खो दी, व्यर्थ बातों की खोज की[a], दया नहीं दिखाई[b], और अनुशासन के मार्ग पर नहीं चले—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “व्यर्थ बातों में लगे रहे।”
    reason: सीरियाई क्रियारूप में मध्यवाची अथवा आत्मवाची अर्थ संभव है; मुख्य पाठ में प्रसंगानुकूल सक्रिय अर्थ रखा गया है।
  - marker: b
    text: या अधिक शाब्दिक रूप में, “दया को नहीं बख्शा।”
    reason: स्रोत-वाक्यांश का शाब्दिक विन्यास अस्पष्ट है; मुख्य पाठ प्रसंगानुकूल अर्थ देता है।
lexical_decisions:
- source_word: ܚܫܘܟܐ
  choice: अंधकार
  rationale: यह शब्द ‘अंधकार’ का द्योतक है; इसे ‘पीड़ा’ या ‘संकट’ कहना स्रोत के अक्षरों और प्रसंग के अनुरूप नहीं है।
- source_word: ܕ̈ܓܠܐ
  choice: झूठ
  rationale: बहुवचन रूप असत्य बातों या झूठों को सूचित करता है; सहज हिन्दी में ‘झूठ’ सामूहिक अर्थ देता है।
- source_word: ܣܝܡܬܐ ܕܣܒܪܐ
  choice: आशा की दृढ़ता
  rationale: ܣܝܡܬܐ में रखे जाने, स्थापित अवस्था या स्थिर आधार का भाव है; ‘दृढ़ता’ हिन्दी में आशा के स्थिर आधार को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ܡܘܣܪ
  choice: अनुशासन
  rationale: यह शिक्षा, सुधार और ताड़ना से जुड़े नैतिक अनुशासन का बोध कराता है; केवल ‘दंड’ अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
theological_decisions:
- issue: अंधकार की ओर मुड़ने का नैतिक-आध्यात्मिक रूपक
  choice: अंधकार की ओर मुँह किया
  alternative: पीड़ा की ओर मुड़े
  rationale: पाठ में ܚܫܘܟܐ ‘अंधकार’ है और यह जानबूझकर अपनाई गई दिशा का रूपक बनाए रखता है।
- issue: व्यर्थ बातों से संबंधित क्रिया का वाच्य
  choice: व्यर्थ बातों के पीछे पड़े
  alternative: व्यर्थ बातों में खोजे गए
  rationale: सीरियाई क्रिया मध्यवाची/आत्मवाची अर्थ दे सकती है; मुख्य पाठ में स्वाभाविक सक्रिय अर्थ रखा गया है, जबकि संभावित निष्क्रिय अर्थ पादटिप्पणी में सुरक्षित है।
- issue: दया से संबंधित नकारात्मक वाक्यांश
  choice: दया नहीं दिखाई
  alternative: दया को नहीं बख्शा
  rationale: मुख्य पाठ नैतिक विफलता को सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक लेकिन अस्पष्ट संभावना पादटिप्पणी में दी गई है।
