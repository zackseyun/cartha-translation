translation:
  language: hi
  text: इसलिए, जो लोग उसे देखना चाहते हैं, वे उस बताए गए समय से सावधान रहें और संकटमय समय के बोझ से पार निकलें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܙܗܪܘܢ
  choice: सावधान रहें
  rationale: यह क्रिया चौकस रहने और अपने आचरण पर ध्यान देने का भाव व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ܚܘܒܐ
  choice: भार
  rationale: इस संदर्भ में यह किसी कठिन दायित्व या बोझ का बिंब है; इसे सीधे ‘भार’ से व्यक्त किया गया है।
- source_word: ܙܒܢܐ ܕܡܥܝܪ
  choice: संकट का समय
  rationale: पाठ कठिन और कुछ हद तक अनिश्चित है; प्रसंग तथा परामर्श-पाठ के आधार पर इसे अशांत या दुःखद समय के रूप में समझते हुए ‘संकट का समय’ चुना गया है।
- source_word: ܢܥܒܪܘܢ
  choice: पार कर जाएँ
  rationale: मूल क्रिया पार होने या पार निकलने का संकेत देती है और कठिन काल से सफलतापूर्वक गुजरने का बिंब बनाए रखती है।
theological_decisions:
- issue: ‘उसे’ का संदर्भ
  choice: सर्वनाम को अनिर्दिष्ट रखा गया है
  alternative: इसे स्पष्ट करके ‘सिय्योन की सांत्वना’ या ‘आनेवाली बात’ कहना
  rationale: इस पद में सर्वनाम का निकट संदर्भ पूरी तरह स्पष्ट नहीं है; किसी एक धार्मिक व्याख्या को पाठ में जोड़ने के बजाय मूल की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की उपदेशात्मक लय तथा भविष्य के संकट से गुजरने का मूल बिंब बनाए रखा गया है।
