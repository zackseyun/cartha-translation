translation:
  language: hi
  text: और यदि कुछ लोग उसके लिए नियत हैं, तो वह उनसे वंचित नहीं रखा जाता; और जो उसमें जीते हैं, उन्हें विनाश की ओर नहीं ले जाया जाता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो उसमें जीते हैं, उनके लिए विनाश की ओर ले जाना नहीं होता।”
    reason: सीरियाई अंतिम वाक्यांश को अधिक अव्यक्तिवाचक ढंग से भी समझा जा सकता है।
lexical_decisions:
- source_word: ܥܬܝܕܝܢ
  choice: ठहराए गए हैं
  rationale: यह शब्द भावी नियति या किसी बात के लिए नियत होने का अर्थ दे सकता है; प्रसंग में व्यक्तियों की नियुक्त नियति को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ܡܬܚܣܟ
  choice: रोका नहीं जाता
  rationale: सीरियाई निष्क्रिय रूप ‘वंचित/रोककर रखा जाना’ का भाव देता है; अस्पष्ट कर्ता को ‘वह’ के रूप में बनाए रखा गया है।
- source_word: ܚ̈ܝܝܢ ܒܗ
  choice: उसमें जीते हैं
  rationale: पूर्वसर्ग सहित पद का सीधा अर्थ रखा गया है और ‘उस’ के संदर्भ को जानबूझकर स्पष्ट नहीं किया गया।
- source_word: ܡܘܒܠܐ ܠܐܒܕܢܐ
  choice: विनाश की ओर नहीं ले जाया जाता
  rationale: ‘ले जाना’ और ‘विनाश’ के मूल अर्थों को रखते हुए हिन्दी में स्वाभाविक निष्क्रिय वाक्य बनाया गया है।
theological_decisions:
- issue: ‘उसके/उसमें’ का संदर्भ
  choice: सर्वनामों की संदर्भगत अस्पष्टता बनाए रखी गई
  alternative: उन्हें किसी विशिष्ट युग, समय या प्रतिफल से स्पष्ट रूप से जोड़ना
  rationale: दिए गए पदांश में संदर्भ प्रत्यक्ष रूप से नामित नहीं है; किसी खास युग या सिद्धान्त को जोड़ना मूल से अधिक व्याख्यात्मक होता।
- issue: अंतिम उपवाक्य का व्याकरण
  choice: व्यक्तिवाचक निष्क्रिय रूप—‘उन्हें ... नहीं ले जाया जाता’
  alternative: अव्यक्तिवाचक रूप—‘विनाश की ओर ले जाना नहीं होता’
  rationale: मुख्य पाठ में पूर्ववर्ती ‘जो उसमें जीते हैं’ को स्वाभाविक हिन्दी वाक्य से जोड़ा गया है, जबकि सीरियाई की अधिक अव्यक्तिवाचक सम्भावना पाद-टिप्पणी में सुरक्षित है।
