base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/040/001.yaml
  text: The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties, and will set before him all the wicked deeds of his hosts.
translation:
  language: hi
  text: उस समय के अंतिम शासक को जीवित छोड़ दिया जाएगा, जब उसकी सेनाओं की भीड़ तलवार से मार डाली जाएगी। फिर उसे बाँधकर सिय्योन पर्वत पर लाया जाएगा। मेरा मसीह उसे उसके सारे अधर्मों के लिए दोषी ठहराएगा और उसकी सेनाओं के सारे दुष्कर्म उसके सामने रखेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܘܬܗ
  choice: उसके सारे अधर्मों
  rationale: यह शब्द केवल राजनीतिक बुराई नहीं, बल्कि परमेश्वर-विरोधी दुष्टता का भी बोध कराता है। ‘अधर्म’ आधुनिक हिन्दी में इस नैतिक और धार्मिक आरोप को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ
  choice: उसकी सेनाओं के सारे दुष्कर्म
  rationale: ‘दुष्कर्म’ मूल में निहित बुरे कामों के ठोस अर्थ को बनाए रखता है, और ‘उसकी सेनाओं’ से सामूहिक दायरा स्पष्ट रहता है।
- source_word: ܛܘܪ ܨܗܝܘܢ
  choice: सिय्योन पर्वत
  rationale: यह हिन्दी में स्थान-नाम का स्वाभाविक और पारंपरिक रूप है तथा मसीही न्याय के दृश्य को स्पष्ट रखता है।
- source_word: ܡܫܝܚܝ
  choice: मेरा मसीह
  rationale: मूल का संबंधसूचक रूप और विशिष्ट अभिषिक्त व्यक्ति—दोनों स्पष्ट रूप से सुरक्षित रखे गए हैं।
- source_word: ܚܝ̈ܠܘܬܗ / host-sense
  choice: उसकी सेनाओं की भीड़
  rationale: ‘सेनाएँ’ सैन्य आशय को व्यक्त करता है और ‘भीड़’ उनकी बहुसंख्या को बनाए रखता है।
theological_decisions:
- issue: अंतिम शासक के न्याय में मसीह की भूमिका
  choice: मसीह व्यक्तिगत न्यायकारी के रूप में शासक का दोष सिद्ध करता है।
  alternative: इसे केवल मसीही युग या किसी अनिर्दिष्ट अभिषिक्त प्रतिनिधि का प्रतीक मानना।
  rationale: पाठ स्पष्टतः ‘मेरा मसीह’ कहता है और उसी को अंतिम शासक के विरुद्ध न्यायिक कार्य करते हुए दिखाता है; इसलिए व्यक्तिगत मसीही भूमिका को अस्पष्ट नहीं किया गया।
- issue: शासक का जीवित छोड़ा जाना और बाद में न्याय
  choice: पहले उसे युद्ध-वध से बचा हुआ दिखाया गया है, फिर बाँधकर मसीह के सामने न्याय के लिए लाया जाता है।
  alternative: ‘जीवित छोड़ दिया जाएगा’ को क्षमा या अंतिम उद्धार का संकेत मानना।
  rationale: कथानक में उसका जीवित बचना दंड से मुक्ति नहीं, बल्कि प्रत्यक्ष न्याय के लिए सुरक्षित रखा जाना है; अनुवाद घटनाक्रम को रखता है पर अतिरिक्त doctrinal निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दोष उस पर सिद्ध करेगा’ न्यायिक भाव को बनाए रखता है, जबकि ‘उसके सामने रखेगा’ आरोपों के सार्वजनिक उद्घाटन को स्वाभाविक हिन्दी में व्यक्त करता है। उपलब्ध स्रोत-पृष्ठ पर पद की शुरुआत सीमा पर है; अतः प्रस्तुत पाठ मूल-स्रोत नियंत्रण और दिए गए परीक्षित परामर्श-पाठ के संगत साक्ष्य पर आधारित है।
