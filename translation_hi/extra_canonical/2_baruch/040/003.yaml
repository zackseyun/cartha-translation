lexical_decisions:
- source_word: ܫܘܠܛܢܗ (reconstructed from the verse’s standard Syriac wording; the supplied page image breaks before the full verse)
  choice: उसका शासन
  rationale: ‘Dominion’ के लिए स्वाभाविक और गरिमापूर्ण हिन्दी; यह सत्ता और शासन—दोनों के भाव को रखता है।
- source_word: ܠܥܠܡ (standard Syriac wording)
  choice: सदा
  rationale: स्थायी अवधि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܥܠܡܐ ܕܚܒܠܐ (standard Syriac wording)
  choice: भ्रष्टता का संसार
  rationale: सम्बन्धवाचक रचना और ‘corruption/decay’ की नैतिक तथा नश्वरता-संबंधी संभावित व्यापकता को बिना एक अर्थ तक सीमित किए सुरक्षित रखता है।
- source_word: ܙܒܢ̈ܐ ... ܐܡܝܪܝܢ (standard Syriac wording)
  choice: पहले बताए गए समय
  rationale: पूर्वोक्त निर्धारित कालों का संकेत स्पष्ट और सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ܢܫܬܡܠܘܢ (standard Syriac wording)
  choice: पूरे न हो जाएँ
  rationale: ‘fulfilled/completed’ के अर्थ को सरल, प्रसंगानुकूल हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शासन की अवधि और युग-अंत के बीच संबंध
  choice: ‘सदा ... जब तक’ की स्रोतगत तनावपूर्ण रचना बनाए रखी गई
  alternative: इसे ‘अनंतकाल तक, अर्थात संसार के अंत के बाद भी’ के रूप में स्पष्ट करना
  rationale: पाठ स्वयं ‘सदा’ और ‘जब तक’ दोनों कहता है; अनुवाद किसी विशिष्ट युगांत-विषयक व्याख्या से इसे नहीं सुलझाता।
- issue: ‘भ्रष्टता के संसार’ का आशय
  choice: नैतिक भ्रष्टता और क्षयशीलता—दोनों के लिए खुला रखा गया
  alternative: केवल ‘नश्वर संसार’ या केवल ‘पापमय संसार’
  rationale: मूल अभिव्यक्ति की अर्थ-व्याप्ति को संकीर्ण न करने के लिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। उपलब्ध स्रोत-पृष्ठ पर 40:3 का पूरा सिरिएक पाठ नहीं आता और अगला पृष्ठ अनुपस्थित है; इसलिए पाठ का निर्धारण अध्याय की मान्य सिरिएक परंपरा तथा दिए गए नियंत्रित अंग्रेज़ी परामर्श-पाठ के अनुरूप किया गया है।
