translation:
  language: hi
  text: इसके बाद वह उसे मार डालेगा और मेरी प्रजा में से बचे हुए लोगों की रक्षा करेगा, जो मेरे चुने हुए स्थान में पाए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܩܛܠܝܘܗܝ
  choice: उसे मार डालेगा
  rationale: क्रिया का सीधा और स्वाभाविक हिन्दी अर्थ रखा गया है; सर्वनाम का संदर्भ पिछले पद के व्यक्ति से जुड़ा रहने दिया गया है।
- source_word: ܫܪܟܐ ܕܥܡܝ
  choice: मेरी प्रजा के शेष लोग
  rationale: ‘शेष’ के सामूहिक अर्थ और ‘मेरी प्रजा’ के संबंध को स्पष्ट, आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: ܐܬܪܐ ܕܓܒܝܬ
  choice: मेरे चुने हुए स्थान
  rationale: चुनाव करने वाले वक्ता और स्थान—दोनों को स्पष्ट रखते हुए वाक्यांश का औपचारिक धार्मिक स्वर बनाए रखा गया है।
theological_decisions:
- issue: ‘मेरे चुने हुए स्थान’ की पहचान
  choice: स्थान की पहचान अनिर्दिष्ट रखी गई
  alternative: इसे सीधे यरूशलेम या सिय्योन कहना
  rationale: पद स्वयं सामान्यतः ‘चुने हुए स्थान’ कहता है; किसी विशिष्ट पहचान को अनुवाद में जोड़ना पाठ से आगे जाना होगा।
- issue: ‘वह’ और ‘उसे’ के संदर्भ
  choice: मूल के सर्वनाम बनाए रखे गए
  alternative: दोनों व्यक्तियों की व्याख्यात्मक पहचान जोड़ना
  rationale: आस-पास के संदर्भ से पहचान ग्रहण की जा सकती है, पर इस पद में नाम जोड़ने से मूल की संदर्भ-निर्भरता मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘प्रजा’ सामूहिक covenantal people के लिए और ‘रक्षा करेगा’ संरक्षण के अर्थ के लिए चुना गया है। कोई व्याख्यात्मक नाम या संप्रदायगत पहचान नहीं जोड़ी गई।
