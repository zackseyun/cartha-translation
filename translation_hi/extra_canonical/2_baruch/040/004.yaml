  text: यह तुम्हारा दर्शन है, और यह उसकी व्याख्या है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܬܟ (ḥezwāṯāḵ)
  choice: तुम्हारा दर्शन
  rationale: द्वितीय पुरुष एकवचन के स्वामित्व-प्रत्यय को स्पष्ट रूप से सुरक्षित रखता है; केवल ‘दर्शन’ कहना स्रोत की इस विशेषता को खो देगा।
- source_word: ܦܘܫܩܗ (puššāqeh)
  choice: उसकी व्याख्या
  rationale: यह शब्द दर्शन के अर्थ खोलने या उसका स्पष्टीकरण देने को व्यक्त करता है; आधुनिक हिन्दी में ‘व्याख्या’ स्वाभाविक और सटीक है।
theological_decisions: []
translation_notes:
  register: सरल, गरिमापूर्ण आधुनिक मानक हिन्दी। प्रत्यक्ष कथन के अंत का उद्धरण-चिह्न बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ की ‘the vision’ वाली वैकल्पिक टिप्पणी नहीं रखी गई, क्योंकि उपलब्ध स्रोत-साक्ष्य ‘तुम्हारा दर्शन’ को स्पष्ट रूप से समर्थित करता है।
