base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/018/001.yaml
  text: And I answered and said, “He who took from the light is able to know it. But the many who exist took from Adam’s darkness, and did not rejoice in the light of Moses.”
translation:
  language: hi
  text: और मैंने उत्तर दिया, “जिसने ज्योति से प्राप्त किया है, वह उसे जान सकता है। परंतु बहुत-से लोगों ने आदम के अंधकार से प्राप्त किया और मूसा की ज्योति में आनंदित नहीं हुए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܒ / ܢܣܒܘ
  choice: पाया / पाया है
  rationale: मूल क्रिया लेने या प्राप्त करने के व्यापक अर्थ को रखती है। ‘पाया’ ज्योति अथवा अन्धकार से कुछ ग्रहण करने की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ܢܘܗܪܐ
  choice: ज्योति
  rationale: यह प्रकाश, प्रकाशन और नैतिक अवस्था की प्रत्यक्ष रूपकात्मक छवि को सुरक्षित रखता है।
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  choice: आदम का अन्धकार
  rationale: व्यक्तिवाचक सम्बन्ध को बनाए रखा गया है; इसे सामान्य ‘मानवीय अन्धकार’ में नहीं बदला गया।
- source_word: 'ܐܬܒܣܡܘ (OCR: ܐܬܒܣܣܘ)'
  choice: आनन्दित नहीं हुए
  rationale: नियंत्रक पाठ-साक्ष्य के अनुसार दृश्य रूप में OCR/मुद्रणगत विकृति है; अपेक्षित क्रिया आनन्दित होने का अर्थ देती है।
- source_word: ܢܘܗܪܐ ܕܡܘܫܐ
  choice: मूसा की ज्योति
  rationale: मूल में मूसा का स्पष्ट व्यक्तिगत उल्लेख है; इसलिए इसे ‘व्यवस्था’ जैसे व्याख्यात्मक प्रतिस्थापन से नहीं बदला गया।
theological_decisions:
- issue: आदम के अन्धकार और मूसा की ज्योति का विरोध
  choice: आदम से सम्बद्ध अन्धकार और मूसा से सम्बद्ध प्रकाशनात्मक ज्योति—दोनों नामित ऐतिहासिक प्रतिनिधियों को स्पष्ट रखा गया है।
  alternative: इसे केवल सामान्य अज्ञान और शिक्षा के विरोध के रूप में प्रस्तुत करना।
  rationale: मूल पाठ स्वयं आदम और मूसा का नाम लेकर नैतिक तथा प्रकाशनात्मक इतिहास का विरोध रचता है; अनुवाद उस तनाव को नहीं मिटाता।
- issue: मूसा की भूमिका
  choice: मूसा से सम्बद्ध ज्योति को बनाए रखा गया है, पर उन्हें ज्योति का स्वतन्त्र स्रोत नहीं कहा गया।
  alternative: ‘मूसा द्वारा दी गई ज्योति’ या केवल मूसा के आदर्श ज्ञान पर बल देना।
  rationale: सम्बन्धवाचक रचना को निकटता से रखा गया है और उससे अधिक धर्मवैज्ञानिक दावा नहीं जोड़ा गया।
- issue: आरम्भिक वाक्य का पुरुष
  choice: 'तीसरे पुरुष में सामान्य कथन: ‘जिसने ज्योति से पाया है’।'
  alternative: 'दूसरे पुरुष में: ‘तू ही है जिसने ज्योति से पाया’।'
  rationale: नवीन पाठ-समीक्षा के अनुसार पृष्ठ का दृश्य पाठ भ्रष्ट है और नियंत्रक साक्ष्य तीसरे पुरुष के सामान्य कथन का समर्थन करता है; प्रसंग में भी बारूक परमेश्वर को ज्योति से पाने वाला नहीं कह रहा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और रूपक-संरक्षक शैली। ‘ज्योति’ और ‘अन्धकार’ का चयन अपोकैलिप्टिक लहजे को बनाए रखता है; वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
