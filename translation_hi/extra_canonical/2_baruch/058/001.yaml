base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/058/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and covering this earth: it is the world which his power made when he planned to make creation. And when the word went out from before him, the beginning of the world stood forth, very small, and it was set in order according to what it was intended to become.


    And the first black waters that you saw descending from the cloud—this is the sin, the transgression that the first Adam committed. For when he sinned, death was stirred up before its time, and mourning was made known, and pains were prepared, and anguish was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in the form that had taken likeness, know that the time will be searched out, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, when he heard from God something of what was to be, reflected on the release of the dead that had been given, and on what had been commanded him by God, he kept considering it and devised five thoughts. For he made himself liable, and through him the angels also were made liable. And at the time when he was created, a vision was shown to him: the bitter life, and the elements with fire. Thus God gathered these beforehand in the likeness of those who were created.'
translation:
  language: hi
  text: '“तुमने जिस बड़े बादल को समुद्र से उठते और इस धरती को ढकते देखा था, उसका अर्थ सुनो। वह संसार है, जिसे उसने अपनी सामर्थ्य से उस समय बनाया, जब उसने सृष्टि की रचना करने का विचार किया। और जब उसके सामने से वचन निकला, तब संसार का आरंभ बहुत छोटा होकर प्रकट हुआ, और उसे वैसा ही व्यवस्थित किया गया जैसा उसे होना था।


    “और जो पहले काले जल तुमने बादल से नीचे उतरते देखे थे, वे पहले आदम के किए हुए पाप और अपराध हैं। क्योंकि जब उसने पाप किया, तब मृत्यु अपने समय से पहले सक्रिय हो गई; शोक प्रकट हुआ, पीड़ाएँ तैयार की गईं, संताप उत्पन्न हुआ, परिश्रम पूरा हुआ, और महानता नीचे गिरने लगी।


    “और उस अंतिम दिन के विषय में, जिसे तुमने उस रूप में देखा था जिसने समानता धारण की थी, यह जान लो: समय की छानबीन की जाएगी, मनुष्यता की माप ली जाएगी, और उसकी सामर्थ्य परखी जाएगी। इसलिए, जब आदम ने परमेश्वर से होनेवाली बातों में से कुछ सुना, तब उसने मरे हुओं की उस मुक्ति को समझा जो दी गई थी, और उस बात पर विचार किया जिसकी आज्ञा उसे परमेश्वर ने दी थी। वह इस पर विचार करता रहा और उसने पाँच विचार किए।[a] क्योंकि उसने अपने-आप को दोष का भागी बनाया, और उसके कारण स्वर्गदूत भी दोष के भागी हुए। जिस समय उसकी सृष्टि हुई, उस समय उसे एक दर्शन दिखाया गया—कड़वा जीवन और आग के साथ मूल तत्त्व। इस प्रकार परमेश्वर ने सृजे हुओं की समानता में इन सबको पहले ही एकत्र कर दिया।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य सिरिएक में कठिन है; या, “वह समझता और विचार करता रहा, और उसने पाँच विचार किए।”
    reason: मूल में ‘समझने’, ‘विचार करने’ और ‘पाँच विचार करने’ के बीच वाक्यगत संबंध अस्पष्ट है।
  - marker: b
    text: “पहले ही” के लिए प्रयुक्त सिरिएक रूप को संभवतः “अदन में” भी समझा जा सकता है।
    reason: ܒܥܕܢ का रूप कालगत अर्थ और ‘अदन’ स्थाननाम—दोनों की संभावना उत्पन्न करता है; मुख्य पाठ कालगत समझ अपनाता है।
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: संसार का आरंभ
  rationale: यह पद संसार के आदिम रूप से सामने आने की ओर संकेत करता है। ‘आरंभ’ सृष्टि-संदर्भ को स्पष्ट रखते हुए संभावित ‘उद्गम/नींव’ के अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: पाप और अपराध
  rationale: दोनों सिरिएक संज्ञाओं को बनाए रखने से नैतिक पाप और सीमा लाँघने वाले अपराध—दोनों का बल व्यक्त होता है।
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: मृत्यु … सक्रिय हो गई
  rationale: क्रिया मृत्यु के केवल अस्तित्व में आने के बजाय उसके गति में आने या कार्यशील होने का भाव देती है।
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: महानता नीचे गिरने लगी
  rationale: यह अनुवाद पतन की दिशात्मक छवि और आदम के अपराध के बाद आई महानता की क्षति, दोनों को सुरक्षित रखता है।
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: मनुष्यता की माप
  rationale: समय की छानबीन और सामर्थ्य की परीक्षा के समानांतर यहाँ मूल्यांकन का ‘माप’ स्वाभाविक है; इसे विधि या नियम नहीं बनाया गया।
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: मरे हुओं की मुक्ति
  rationale: कठिन पदबंध को अपेक्षाकृत शाब्दिक रखा गया है, ताकि इसे निश्चित रूप से पुनरुत्थान या किसी अन्य धर्मवैज्ञानिक धारणा में न बदला जाए।
- source_word: ܡܚܝܒܢܘܗܝ
  choice: दोष का भागी बनाया
  rationale: इसमें न्यायिक उत्तरदायित्व का भाव है; यह केवल आंतरिक दोष-बोध से अधिक प्रबल है।
- source_word: ܐܣܛܘܟܣܐ
  choice: मूल तत्त्व
  rationale: यूनानी मूल का यह शब्द ब्रह्मांड के तत्त्वों की ओर संकेत करता है। ‘मूल तत्त्व’ वर्तमान हिन्दी में स्पष्ट और धर्मवैज्ञानिक रूप से तटस्थ है।
theological_decisions:
- issue: आदम के अपराध और मृत्यु का संबंध
  choice: आदम के प्रथम अपराध को वह निर्णायक घटना बताया गया है जिसने असमय मृत्यु और मानवीय दुःखों को सक्रिय किया।
  alternative: इसे सामान्य मानवीय पतन का केवल वर्णनात्मक कथन माना जा सकता था।
  rationale: सिरिएक पाठ आदम के पाप को मृत्यु, शोक, पीड़ा और परिश्रम से सीधे कारणात्मक ढंग से जोड़ता है; अनुवाद इस अपोकैलिप्टिक तर्क को कमज़ोर नहीं करता।
- issue: ‘मरे हुओं की मुक्ति’ का कठिन पदबंध
  choice: इसे अपेक्षाकृत शाब्दिक और खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘पुनरुत्थान’ या ‘मृत्यु-दंड से छुटकारा’ कहा जा सकता था।
  rationale: पाठ का वाक्य-विन्यास और आशय कठिन है। अधिक स्पष्ट धर्मवैज्ञानिक शब्द जोड़ना स्रोत से अधिक निश्चितता का दावा करता।
- issue: आदम और स्वर्गदूतों की दोष-भागिता
  choice: आदम ने स्वयं को दोष का भागी बनाया और उसके कारण स्वर्गदूत भी दोष के भागी हुए।
  alternative: इसे ‘आदम ने स्वर्गदूतों को दोषी ठहराया’ या केवल आदम की निजी दोषिता कहा जा सकता था।
  rationale: न्यायिक तनाव और स्वर्गदूतों से संबंध को बनाए रखा गया है, पर संबंध की प्रक्रिया को किसी विशिष्ट धार्मिक प्रणाली के अनुसार नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, श्रव्य और सामान्य पाठक के लिए सुलभ शैली रखी गई है। अपोकैलिप्टिक बिंबों को सरल किया गया है, पर उनकी अनोखी भाषा और वास्तविक अस्पष्टताएँ नहीं मिटाई गईं। संबोधन में सम्मानसूचक बहुवचन ‘तुम/जान लो’ का प्रयोग किया गया है।
