  yaml_path: translation/extra_canonical/2_baruch/054/001.yaml
  text: O You who created the earth, hear me—You who established the firmament by the word, and made firm the height of heaven by the spirit[a].
translation:
  language: hi
  text: हे पृथ्वी को रचनेवाले, मेरी सुन—तूने वचन से आकाशमंडल को स्थापित किया और श्वास[a] से आकाश की ऊँचाई को दृढ़ किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सीरियाई शब्द का अर्थ ‘श्वास’ या ‘आत्मा’ हो सकता है; ‘वचन’ के साथ इसकी समानांतरता भजन 33:6 की प्रतिध्वनि है।
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܒܪܐ ܐܪܥܐ
  choice: पृथ्वी को रचनेवाले
  rationale: ܒܪܐ सृष्टि करने या रचने का बोध देता है; सम्बोधन की सीरियाई रचना को स्वाभाविक हिन्दी सम्बोधन में रखा गया है।
- source_word: ܬܩܢܬ ܪܩܝܥܐ
  choice: आकाशमंडल को स्थापित किया
  rationale: ܬܩܢܬ में व्यवस्थित करके स्थिर करने का भाव है, और ܪܩܝܥܐ के लिए ‘आकाशमंडल’ पारंपरिक किंतु आज भी बोधगम्य समतुल्य है।
- source_word: ܒܡܠܬܐ
  choice: वचन से
  rationale: ܡܠܬܐ यहाँ सृजनकारी कथन/वचन को सूचित करता है; करणवाचक ܒ को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: ܒܪܘܚܐ
  choice: श्वास से
  rationale: ܪܘܚܐ का अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकता है। ‘वचन’ के समानांतर और भजन 33:6 की प्रतिध्वनि में ‘श्वास’ अधिक प्रत्यक्ष है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ܘܫܪܪܬ ܪܘܡܐ ܕܫܡܝܐ
  choice: आकाश की ऊँचाई को दृढ़ किया
  rationale: ܫܪܪܬ स्थिर या दृढ़ करने और ܪܘܡܐ ऊँचाई का अर्थ देता है; असामान्य ब्रह्मांडीय बिंब को सामान्यीकृत नहीं किया गया।
theological_decisions:
- issue: ܪܘܚܐ में ‘आत्मा’ और ‘श्वास’ की अस्पष्टता
  choice: मुख्य पाठ में ‘श्वास’
  alternative: ‘आत्मा’
  rationale: ‘वचन’ के साथ काव्यात्मक समानांतरता ‘श्वास’ का समर्थन करती है, पर सीरियाई शब्द दोनों अर्थ वहन कर सकता है; इसलिए वैकल्पिक धार्मिक अर्थ को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। ईश्वर के लिए निकट सम्बोधन ‘तू’ मूल के एकवचन प्रत्यक्ष सम्बोधन और काव्यात्मक लहजे को व्यक्त करता है। केवल 2 बारूक 54:1 का पाठ सम्मिलित है।
