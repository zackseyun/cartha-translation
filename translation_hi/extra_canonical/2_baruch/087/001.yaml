base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/087/001.yaml
  text: and in my prayer. And you also have learned from them the commandments of this letter, and you will be subdued in excellence, the nations for the promise, and you will be loved, and you will be comforted, lest you fall and be tormented.
translation:
  language: hi
  text: और अपनी प्रार्थना में भी। और तुमने भी उनसे इस पत्र की आज्ञाएँ सीख ली हैं। हे जातियो, तुम प्रतिज्ञा के लिए सद्गुण में नम्र किए जाओगे[a]; तुमसे प्रेम किया जाएगा और तुम्हें सांत्वना दी जाएगी, ताकि तुम गिरकर यातना न सहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्यांश का सिरियाई पाठ और उसका वाक्य-विन्यास कठिन है। अधिक शाब्दिक रूप से: “और तुम सद्गुण में नम्र किए जाओगे—जातियाँ, प्रतिज्ञा के लिए।” कुछ पाठ-संशोधनों के आधार पर इसका अर्थ “तुम सद्गुण में दृढ़ किए जाओगे” भी प्रस्तावित किया गया है।'
    reason: प्राप्त पाठ में क्रिया, ‘जातियाँ’ और ‘प्रतिज्ञा के लिए’ के बीच संबंध अस्पष्ट है; मुख्य पाठ में जातियों को संबोधन मानना एक व्याकरणिक संभावना है, निश्चित समाधान नहीं।
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  choice: अपनी प्रार्थना में भी
  rationale: ܒܥܘܬܐ का अर्थ प्रार्थना, विनती या याचना हो सकता है। यहाँ ‘प्रार्थना’ स्वाभाविक और व्यापक है; खंड पिछले वाक्य से जुड़ा हुआ है।
- source_word: ܝܠܦܬܘܢ
  choice: तुमने भी … सीख ली हैं
  rationale: क्रिया का मूल अर्थ सीखना या शिक्षा पाना है। रूप को पूर्ण भूतकाल के रूप में रखा गया है, जबकि समापन का उपदेशात्मक संदर्भ बना रहता है।
- source_word: ܡܢܗܘܢ
  choice: उनसे
  rationale: सर्वनाम का पूर्वपद स्पष्ट नहीं है। ‘उनसे’ स्रोत की अस्पष्टता को बनाए रखता है और उसे चुपचाप ‘इन बातों से’ नहीं बनाता।
- source_word: ܦܘ̈ܩܕܢܐ
  choice: आज्ञाएँ
  rationale: यह शब्द आदेशों या प्रामाणिक उपदेशों को दर्शाता है। ‘आज्ञाएँ’ इसके गंभीर और वाचागत स्वर को सुरक्षित रखता है।
- source_word: ܘܬܬܟܦܘܢ
  choice: नम्र किए जाओगे
  rationale: उपलब्ध सिरियाई पाठ में क्रिया का भाव झुकाए या दबाए जाने का है; इसलिए संदिग्ध संशोधन के आधार पर ‘दृढ़ किए जाओगे’ नहीं अपनाया गया।
- source_word: ܒܡܝܬܪܘܬܐ
  choice: सद्गुण में
  rationale: ܡܝܬܪܘܬܐ श्रेष्ठता, उत्कृष्टता या सद्गुण का बोध करा सकता है। नैतिक उपदेश के संदर्भ में ‘सद्गुण’ सहज है।
- source_word: ܠܡܘܠܟܢܐ
  choice: प्रतिज्ञा के लिए
  rationale: शब्द का अर्थ ‘प्रतिज्ञा’ है, ‘शासन करना’ नहीं। कठिन वाक्य-विन्यास के बावजूद इसका प्रत्यक्ष अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: बारूक द्वारा स्मरण को औपचारिक मध्यस्थता के सिद्धांत के रूप में प्रस्तुत करना
  choice: केवल ‘अपनी प्रार्थना में भी’ कहा गया है
  alternative: इसे स्पष्ट मध्यस्थतापूर्ण प्रार्थना के रूप में विस्तार देना
  rationale: सिरियाई पाठ प्रार्थना का उल्लेख करता है, पर इससे अधिक विकसित धर्मवैज्ञानिक अर्थ जोड़ने का आधार नहीं देता।
- issue: कठिन मध्यवर्ती वाक्यांश को किसी अनुमानित पाठ-संशोधन से सरल बनाना
  choice: प्राप्त सिरियाई के मुख्य शब्दों को रखते हुए जातियों को संबोधन माना गया है और कठिनाई पादटिप्पणी में बताई गई है
  alternative: ‘तुम जातियों पर शासन करने के लिए दृढ़ किए जाओगे’ जैसा अर्थ ग्रहण करना
  rationale: वैकल्पिक अर्थ उपलब्ध शब्दों ܬܬܟܦܘܢ और ܡܘܠܟܢܐ से सीधे सिद्ध नहीं होता तथा ‘शासन’ का भाव पाठ में आयात करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सहज और उपदेशात्मक शैली रखी गई है। आरंभिक खंड पिछले पद से जुड़ा होने के कारण जानबूझकर वाक्यांश के रूप में छोड़ा गया है। निष्क्रिय क्रियाओं ने सिरियाई की भाव-वाच्यता सुरक्षित रखी है; कठिन पाठ को बिना छिपाए पादटिप्पणी में स्पष्ट किया गया है।
