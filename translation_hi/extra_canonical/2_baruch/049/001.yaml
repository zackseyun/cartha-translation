  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
translation:
  language: hi
  text: 'फिर भी, हे पराक्रमी, मैं तुझसे पूछूँगा और सब कुछ के रचयिता से दया माँगूँगा: जो लोग उसके दिनों में जीवित होंगे, वे किस रूप में जीवित होंगे? और उस समय के बाद आनेवालों का वैभव कैसे बना रहेगा?[a] क्या वे तब यही वर्तमान रूप धारण करेंगे? क्या मनुष्यों की वे आकृतियाँ तब बनी रहेंगी और जीवित रूप में स्थिर की जाएँगी?[b] या तू उन चीज़ों को, जो संसार में रही हैं, स्वयं संसार की तरह बदल देगा?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का सिरिएक पाठ कठिन है; अर्थ ‘चमक’ या ‘महिमा’ भी हो सकता है।
    reason: पांडुलिपीय/पाठगत अनिश्चितता को स्पष्ट करना।
  - marker: b
    text: 'अर्थ संभवतः: ‘और क्या वे जीवित रूप में स्थिर की जाएँगी?’ सिरिएक वाक्य-विन्यास संक्षिप्त है और ‘आकृतियों’ तथा ‘जीवन’ के संबंध को एक से अधिक तरह से समझा जा सकता है।'
    reason: अंतिम प्रश्न के कठिन सिरिएक वाक्य-विन्यास और उसके वैकल्पिक संबंधों को स्पष्ट करना।
lexical_decisions:
- source_word: 'ܚܒܝܒܝ / नियंत्रक पाठ: ܚܝܠܬܢܐ'
  choice: हे पराक्रमी
  rationale: प्रस्तुत पृष्ठ-पाठ में अक्षर-पहचान से बना कठिन पाठ ‘मेरे प्रिय’ दिखाई देता है, पर नियंत्रक पाठ और प्रसंग ईश्वर के लिए संबोधन ‘हे पराक्रमी’ का समर्थन करते हैं।
- source_word: ܕܡܘܬܐ
  choice: रूप / आकृतियाँ
  rationale: यहाँ संज्ञा का अर्थ ‘मृत्यु’ नहीं, बल्कि बाहरी रूप या समानता है; अलग वाक्य-संदर्भों में स्वाभाविक हिन्दी के लिए ‘रूप’ और ‘आकृतियाँ’ चुने गए हैं।
- source_word: ܙܥܘܪܬܗ (कठिन पाठ)
  choice: वैभव
  rationale: प्रेषित सिरिएक पाठ इस स्थान पर संदिग्ध है; नियंत्रक परंपरा चमक, महिमा या वैभव के अर्थ का समर्थन करती है। ‘वैभव’ उस अर्थ को रखते हुए अत्यधिक व्याख्या से बचता है।
- source_word: ܡܚܠܦ
  choice: बदल देगा
  rationale: क्रिया परिवर्तन बताती है, पर परिवर्तन की मात्रा या स्वरूप तय नहीं करती; ‘बदलना’ इस खुली संभावना को बनाए रखता है।
- source_word: ܡܩܝܡܝܢ ܚܝ̈ܐ
  choice: जीवित प्राणियों के रूप में स्थापित की जाएँगी
  rationale: वाक्यांश को वर्तमान जीवितों को संभालने वाली आकृतियों के रूप में नहीं, बल्कि उन आकृतियों के जीवन में स्थापित किए जाने के प्रश्न के रूप में लिया गया है।
theological_decisions:
- issue: पुनरुत्थान में वर्तमान मानवीय रूप की निरंतरता अथवा उसका परिवर्तन
  choice: 'बारूक के प्रश्न को खुला रखा गया है: वर्तमान रूप बना भी रह सकता है और बदला भी जा सकता है।'
  alternative: पाठ को या तो पूर्णतः उसी देह की वापसी, या पूर्णतः नए अस्तित्व-रूप की स्पष्ट शिक्षा बनाना।
  rationale: इस पद में प्रश्न उठाया गया है, समाधान नहीं दिया गया; इसलिए देहगत निरंतरता और परिवर्तन के बीच का तनाव सुरक्षित रखा गया है।
- issue: ईश्वर के लिए संबोधन और फिर तीसरे पुरुष का उल्लेख
  choice: ‘तुझसे’ और ‘सब कुछ बनानेवाले से’ का मूल पुरुष-परिवर्तन बनाए रखा गया है।
  alternative: दोनों को एक ही व्याकरणिक पुरुष में समतल कर देना।
  rationale: मूल/परामर्श पाठ में व्यक्ति-संदर्भ का बदलाव है; उसे चुपचाप सुधारने से वास्तविक भाषिक कठिनाई मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। ईश्वर के लिए ‘तू’ मूल के निकट, आत्मीय और गंभीर एकवचन संबोधन के रूप में प्रयुक्त है। लंबे प्रश्नों को छोटे वाक्यों में बाँटा गया है, पर उनकी अपोकैलिप्टिक जिज्ञासा और अनिश्चितता सुरक्षित है।
