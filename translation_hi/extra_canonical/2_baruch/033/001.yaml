base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/033/001.yaml
  text: “Are these the commands that your companion Jeremiah commanded you, saying, ‘Look after this people while I go and comfort the rest of our brothers in Babylon, those who have fallen into captivity’? And now, if you also leave us, it would be better for all of us to die before you than for you to depart from us.”
translation:
  language: hi
  text: “क्या ये वही आदेश हैं जो तुम्हारे साथी यिर्मयाह[a] ने तुम्हें देते हुए कहा था, ‘जब तक मैं बाबेल जाकर हमारे बाकी भाइयों को ढाढ़स बँधाऊँ[b], जो बंदी हो गए हैं, तब तक इस प्रजा की देखभाल करना’? और अब यदि तुम भी हमें छोड़ दोगे, तो तुम्हारे हमसे चले जाने से अच्छा होगा कि हम सब तुम्हारे सामने मर जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यिर्मयाह नबी’।
    reason: परंपरागत वैकल्पिक पहचान को पाठक के लिए सुरक्षित रखा गया है, जबकि मुख्य पाठ उपलब्ध सिरियाई के संबंधपरक शब्द का अनुसरण करता है।
  - marker: b
    text: या ‘समझाऊँ’ अथवा ‘सांत्वना दूँ’।
    reason: सिरियाई क्रिया के अर्थ-क्षेत्र में मनाना, समझाना, आश्वस्त करना और सांत्वना देना शामिल हैं; संदर्भ किसी एक सूक्ष्म अर्थ को पूर्णतः निश्चित नहीं करता।
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܐ
  choice: आदेश
  rationale: यह संज्ञा दिए गए निर्देशों या दायित्वों को दर्शाती है; ‘आदेश’ सरल और स्वाभाविक हिन्दी में उसका बल बनाए रखता है।
- source_word: ܚܒܪܟ
  choice: तुम्हारे साथी
  rationale: यह शब्द बारूक के साथ यिर्मयाह के निकट संबंध को व्यक्त करता है। ‘साथी’ आधुनिक हिन्दी में संबंधपरक अर्थ को सहज रूप से रखता है।
- source_word: ܐܦܝܣ
  choice: ढाढ़स बँधाऊँ
  rationale: इस संदर्भ में क्रिया का अर्थ समझाने, मनाने, आश्वस्त करने या सांत्वना देने के क्षेत्र में है। बंदी भाइयों के प्रसंग में ‘ढाढ़स बँधाऊँ’ स्वाभाविक है और भावनात्मक आश्वासन को व्यक्त करता है।
- source_word: ܐܚ̈ܝ
  choice: अपने बाकी भाइयों
  rationale: रूप का शाब्दिक अर्थ ‘मेरे भाई’ है। यिर्मयाह के उद्धृत कथन को हिन्दी में सहज बनाने के लिए ‘अपने ... भाइयों’ कहा गया है; इससे सामुदायिक और पारिवारिक संबोधन बना रहता है।
- source_word: ܕܢܦܠܘ
  choice: जो बंदी हो गए हैं
  rationale: उपलब्ध पाठ-सीमा कुछ अस्थिर है, पर प्रसंग बाबेल की बंधुआई में पड़े लोगों का है। यह वाक्यांश उस दशा को स्पष्ट रखता है, बिना क्षतिग्रस्त सीमा के बारे में अनावश्यक निश्चितता जताए।
- source_word: ܫܪܘܟ / depart-leave clause
  choice: हमें छोड़ दोगे / हमसे चले जाने
  rationale: अंतिम अपील में केवल स्थान बदलने का नहीं, समुदाय को असहाय छोड़ने का भाव है। हिन्दी में दोनों पद मिलकर भावात्मक बल और स्वाभाविकता बनाए रखते हैं।
