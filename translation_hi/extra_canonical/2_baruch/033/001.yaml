  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण के भीतर यिर्मयाह की वाणी को स्पष्ट रखने के लिए ‘अपने बाकी भाइयों’ प्रयोग किया गया है। ‘ढाढ़स बँधाऊँ’ बोलचाल की सहजता और साहित्यिक गरिमा के बीच संतुलन रखता है।
