  text: And my people will be chastened, and the time will come when they will seek the prosperity of their times.”
translation:
  language: hi
  text: और मेरी प्रजा को अनुशासित किया जाएगा; वह समय आएगा जब वे अपने समयों की समृद्धि खोजेंगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और समय आएगा, और वे अपने समयों की समृद्धि खोजेंगे।”
    reason: सिरियाई पाठ दोनों उपवाक्यों को ‘और’ से जोड़ता है; उनका ठीक कालगत संबंध व्याकरण में स्पष्ट नहीं किया गया है।
lexical_decisions:
- source_word: ܘܡܬܪܕܐ ܥܡܝ
  choice: और मेरी प्रजा को अनुशासित किया जाएगा
  rationale: ܡܬܪܕܐ दंड के साथ सुधार या ताड़ना का भाव रखता है। ‘अनुशासित किया जाएगा’ उस सुधारात्मक भाव को बनाए रखता है और केवल प्रतिशोधात्मक ‘दंडित’ से बचता है।
- source_word: ܡܘܨܠܚܘܬܗܘܢ
  choice: अपनी … समृद्धि
  rationale: यह शब्द सफलता, उन्नति या खुशहाली का अर्थ दे सकता है। ‘समृद्धि’ प्रसंग में स्वाभाविक है, पर सफलता की व्यापक धारणा को पूरी तरह सीमित नहीं करता।
- source_word: ܕܙܒܢܝ̈ܗܘܢ
  choice: अपने समयों की
  rationale: स्रोत में ‘समय’ बहुवचन है। हिंदी में किंचित असामान्य होने पर भी इसे बनाए रखा गया है, क्योंकि इसका आशय उनके युगों, अवसरों या नियत कालों से हो सकता है।
theological_decisions:
- issue: प्रजा की ताड़ना का स्वरूप
  choice: अनुशासित किया जाएगा
  alternative: दंडित किया जाएगा / ताड़ना दी जाएगी
  rationale: स्रोत का क्रियापद कष्टदायक दंड और सुधारात्मक अनुशासन दोनों का संकेत दे सकता है। चुना हुआ रूप इस तनाव को यथासंभव बनाए रखता है और किसी विशेष धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाता।
- issue: समय के आने और खोजने वाले उपवाक्य का संबंध
  choice: वह समय आएगा जब वे…
  alternative: समय आएगा, और वे…
  rationale: सिरियाई में दोनों उपवाक्य ܘ (‘और’) से जुड़े हैं। हिंदी में ‘जब’ उनका संभावित कालगत संबंध सहज रूप से व्यक्त करता है; औपचारिक समन्वय को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी अपनाई गई है। ‘अपने समयों’ का असामान्य बहुवचन स्रोत की संभावित अर्थ-व्याप्ति को सुरक्षित रखने के लिए जानबूझकर रखा गया है।
