base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/002.yaml
  text: “You have seen all that this people has done to me; the evil that these two tribes that remain have done is greater than that of the ten tribes that were taken captive.”
translation:
  language: hi
  text: “तुमने वह सब देखा है जो इस प्रजा ने मेरे विरुद्ध किया है। बची हुई इन दो गोत्रों ने जो बुराई की है, वह बंदी बनाकर ले जाए गए दस गोत्रों की बुराई से भी बढ़कर है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܐ ܗܢܐ
  choice: इस प्रजा
  rationale: ‘इस प्रजा’ सामूहिक समुदाय के अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ܕܥܒܕ ܠܝ
  choice: मेरे विरुद्ध किया है
  rationale: शाब्दिक ‘मेरे साथ/मेरे प्रति किया’ के संदर्भगत प्रतिकूल भाव को स्पष्ट करता है।
- source_word: ܬܪ̈ܬܝܢ ܫܪ̈ܒܢ
  choice: इन दो गोत्रों
  rationale: ܫܪܒܐ यहाँ इस्राएल के जनजातीय विभागों, अर्थात् गोत्रों, का संकेत करता है।
- source_word: ܕܐܫܬܚܪܝ
  choice: बची हुई
  rationale: मूल के ‘जो शेष रह गए’ भाव को संक्षिप्त और सहज हिन्दी में रखता है।
- source_word: ܕܐܫܬܒܝܘ
  choice: बंदी बनाकर ले जाए गए
  rationale: निष्क्रिय क्रिया में बंदी किए जाने और निर्वासन में ले जाए जाने, दोनों का संदर्भगत भाव सुरक्षित रहता है।
- source_word: ܝܬܝܪ ܡܢ
  choice: से भी बढ़कर है
  rationale: संक्षिप्त सिरिएक तुलनात्मक रचना को पूर्ण, स्वाभाविक हिन्दी वाक्य में व्यक्त करता है।
theological_decisions:
- issue: दो बचे हुए गोत्रों की बुराई की दस बंदी गोत्रों से तुलना
  choice: तुलना को नैतिक बुराई की मात्रा/गंभीरता के रूप में स्पष्ट रखा गया
  alternative: इसे केवल उनके कर्मों की संख्या की तुलना मानना
  rationale: संदर्भ में ܒܝ̈ܫܬܐ ‘बुराई’ नैतिक दोष को सूचित करता है; अनुवाद इससे आगे कोई सांप्रदायिक या सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध भाषा। ईश्वरीय संबोधन का उद्धरण बनाए रखा गया है और मूल की तुलनात्मक तीव्रता को स्पष्ट किंतु अनावश्यक व्याख्या के बिना व्यक्त किया गया है।
