translation:
  language: hi
  text: क्योंकि पहले के गोत्रों को उनके राजाओं ने पाप करने के लिए विवश किया था, पर इन दोनों गोत्रों ने स्वयं पाप करना चाहा और अपने राजाओं को पाप करने के लिए विवश किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪ̈ܒܬܐ
  choice: गोत्रों
  rationale: इस प्रसंग में यह इस्राएल के गोत्रों को सूचित करता है; ‘गोत्र’ स्वाभाविक और ऐतिहासिक रूप से उपयुक्त हिन्दी पद है।
- source_word: ܐܬܐܠܨܘ / ܐܠܨܘ
  choice: विवश किया गया / विवश किया
  rationale: दोनों रूप बाहरी दबाव या बाध्यता व्यक्त करते हैं और पद में राजाओं तथा गोत्रों की उलटी भूमिकाओं के विरोध को बनाए रखते हैं।
- source_word: ܚܨܘ
  choice: उकसाया
  rationale: प्रस्तुत सिरिएक पाठ में यह क्रिया अगली क्रिया ‘विवश किया’ के साथ राजाओं पर गोत्रों की कार्रवाई बताती है; ‘उकसाया’ इस अर्थ और क्रमिक तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहले गोत्रों और अंतिम दो गोत्रों की नैतिक जिम्मेदारी का विरोध
  choice: पहले गोत्र राजाओं द्वारा विवश किए गए, जबकि दो गोत्रों ने राजाओं को उकसाया और विवश किया
  alternative: दो गोत्रों ने स्वयं पाप करना चाहा और फिर राजाओं को विवश किया
  rationale: प्रस्तुत सिरिएक वाक्यरचना दोनों क्रियाओं को ‘अपने राजाओं’ की ओर निर्देशित करती है। यह अनुवाद लोगों की अधिक सक्रिय दोषिता को बनाए रखता है, पर पाठ में अलग से न लिखे गए ‘स्वयं पाप करना चाहा’ को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सरल वाक्य-विन्यास। ‘पर’ स्पष्ट विरोध दिखाता है और ‘ऐसे थे जिन्होंने’ सिरिएक के बलाघाती संबंधवाचक ढाँचे को सहज हिन्दी में रखता है।
