base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/001.yaml
  text: In the twenty-fifth year of Jeconiah king of Judah, the word of the Lord came to Baruch son of Neriah, saying, / and He said to him,
translation:
  language: hi
  text: 'यहूदा के राजा यकोन्याह के शासन के पच्चीसवें वर्ष में ऐसा हुआ कि प्रभु का वचन नेरियाह के पुत्र बारूक के पास आया[a] और उससे कहा[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर आया।”
    reason: ܥܠ का अधिक शाब्दिक अर्थ ‘पर’ है, यद्यपि भविष्यद्वाणी-सूत्र में ‘के पास आया’ अधिक स्वाभाविक हिन्दी है।
  - marker: b
    text: या, “यह कहते हुए।”
    reason: यह वैकल्पिक रूप वाक्य को कृदन्तीय ढंग से जोड़ता है और ‘कहा’ के कर्ता को स्पष्ट रूप से निर्धारित करने से बचता है।
lexical_decisions:
- source_word: ܗܘܐ ܒܫܢܬ ܥܣܪܝܢ ܘܚܡܫ
  choice: के शासन के पच्चीसवें वर्ष में ऐसा हुआ
  rationale: ܗܘܐ की कथात्मक भूमिका को स्वाभाविक हिन्दी में रखते हुए वर्ष-सूचना को स्पष्ट किया गया है; ‘शासन के’ से राजकीय वर्ष का आशय सहज रूप से व्यक्त होता है।
- source_word: ܝܘܟܢܝܐ
  choice: यकोन्याह
  rationale: यह Jeconiah नाम का प्रचलित और स्रोत-निकट हिन्दी लिप्यंतरण है।
- source_word: ܗܘܐ ܦܬܓܡܗ ܕܡܪܝܐ ܥܠ
  choice: प्रभु का वचन ... के पास आया
  rationale: यह भविष्यद्वाणी-संबंधी सूत्र का स्वाभाविक आधुनिक हिन्दी रूप है। ܥܠ का शाब्दिक अर्थ ‘पर’ हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ܒܪܘܟ ܒܪ ܢܪܝܐ
  choice: नेरियाह के पुत्र बारूक
  rationale: ܒܪ को स्पष्ट संबंधसूचक हिन्दी ‘के पुत्र’ से व्यक्त किया गया है और व्यक्तिनामों का स्रोत-निकट लिप्यंतरण रखा गया है।
- source_word: ܘܐܡܪ ܠܗ
  choice: और उससे कहा
  rationale: सीरियाई पाठ की समन्वयी रचना और कर्ता की अंतर्निहित अस्पष्टता को अनावश्यक सर्वनाम जोड़कर हल नहीं किया गया है।
theological_decisions:
- issue: ‘और कहा’ का कर्ता—‘प्रभु का वचन’ या ‘प्रभु’
  choice: कर्ता को निहित रखते हुए ‘और उससे कहा’
  alternative: ‘और प्रभु ने उससे कहा’ अथवा ‘यह कहते हुए’
  rationale: सीरियाई क्रिया में कर्ता अलग से दुहराया नहीं गया। हिन्दी में कर्ता को निहित रखने से मूल की व्याकरणिक और धर्मवैचारिक गुंजाइश बनी रहती है।
- issue: दैवी पदवी ܡܪܝܐ का रूप
  choice: प्रभु
  alternative: यहोवा
  rationale: स्रोत में ܡܪܝܐ एक सम्मानसूचक दैवी पदवी है; ‘प्रभु’ उसका सीधा, परिचित और गैर-सांप्रदायिक हिन्दी समतुल्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। नामों को स्रोत-निकट रूप में रखा गया है, और भविष्यद्वाणी-सूत्र को हिन्दी बाइबलीय पाठकों के लिए परिचित भाषा में व्यक्त किया गया है।
