base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/004.yaml
  text: Therefore behold, I am bringing evil upon this city and upon its inhabitants, and it will be removed from before me for a time, and I will scatter this people among the nations, that they may be servants to the nations.
translation:
  language: hi
  text: इसलिए देख, मैं इस नगर और इसके निवासियों पर विपत्ति लाने वाला हूँ। यह नगर कुछ समय के लिए मेरे सामने से हटा दिया जाएगा, और मैं इन लोगों को राष्ट्रों के बीच तितर-बितर कर दूँगा, ताकि वे राष्ट्रों के काम आएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वे राष्ट्रों के लिए बचे रहें।”
    reason: सिरियाई ܢܘܬܪ का रूप ‘काम आना/लाभ पहुँचाना’ अथवा ‘बचा रहना’ समझा जा सकता है।
lexical_decisions:
- source_word: ܒܝܫܬܐ (bīštā)
  choice: विपत्ति
  rationale: इस प्रसंग में यह शब्द नैतिक ‘बुराई’ के बजाय नगर पर आनेवाली दंडात्मक आपदा को सूचित करता है; ‘विपत्ति’ आधुनिक हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܬܬܬܪܝܡ ܡܢ ܩܕܡܝ
  choice: मेरे सामने से हटा दिया जाएगा
  rationale: यह निष्क्रिय क्रिया नगर के परमेश्वर की उपस्थिति से कुछ समय के लिए दूर किए जाने को व्यक्त करती है; स्रोत की स्थानिक छवि बनाए रखी गई है।
- source_word: ܡܒܕܪ
  choice: तितर-बितर कर दूँगा
  rationale: यह क्रिया लोगों को विभिन्न राष्ट्रों के बीच बिखेर देने के अर्थ में है।
- source_word: ܕܠܥܡܡ̈ܐ ܢܘܬܪ
  choice: ताकि वे राष्ट्रों के काम आएँ
  rationale: दिए गए सिरियाई पाठ में मूल ܝܬܪ से बना रूप राष्ट्रों के लिए लाभकारी या उपयोगी होने का भाव दे सकता है। यह प्रस्तुति ‘सेवक हों’ की अपेक्षा उपलब्ध मूल-पाठ के अधिक निकट है और हिन्दी में स्वाभाविक भी है।
theological_decisions:
- issue: परमेश्वर द्वारा ܒܝܫܬܐ लाया जाना
  choice: विपत्ति लाने वाला हूँ
  alternative: बुराई लाने वाला हूँ
  rationale: यहाँ आशय न्यायस्वरूप लाई गई आपदा है, न कि परमेश्वर द्वारा नैतिक बुराई करने का दावा; फिर भी दैवी न्याय की कठोरता को नरम नहीं किया गया।
- issue: अंतिम उद्देश्यवाचक वाक्यांश की अस्पष्टता
  choice: राष्ट्रों के काम आएँ
  alternative: राष्ट्रों के लिए बचे रहें
  rationale: ܢܘܬܪ को लाभ पहुँचाने/काम आने के अर्थ में समझना प्रसंग और क्रियारूप के अनुकूल है, पर ‘बचा रहना’ भी भाषिक रूप से संभव है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देख’ भविष्यद्वाणी की सीधी संबोधन-शैली को बनाए रखता है। ‘राष्ट्र’ ܥܡܡ̈ܐ के लिए चुना गया है, जबकि ‘इन लोगों’ से सामूहिक प्रजा का स्वाभाविक हिन्दी रूप मिलता है।
