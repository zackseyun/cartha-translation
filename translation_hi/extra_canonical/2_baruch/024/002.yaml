  yaml_path: translation/extra_canonical/2_baruch/024/002.yaml
  text: And at that time you will see—and the many who are with you—the forbearance of the Most High that has been through all generations, how he has been patient with all who are born, both those who sin and those who are righteous.
translation:
  language: hi
  text: और उस समय तू और तेरे साथ के बहुत-से लोग परमप्रधान की उस सहनशीलता को देखोगे, जो सभी पीढ़ियों में बनी रही है—कि वह जन्म लेनेवाले सभी लोगों के प्रति धीरज रखता आया है, चाहे वे पाप करते हों या धर्मी हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܘܡܐ / Most High (वचन की नियंत्रित पाठ-परंपरा में निहित पदवी)
  choice: परमप्रधान
  rationale: यह ईश्वर की सर्वोच्चता व्यक्त करने वाली पारंपरिक उपाधि है और आधुनिक हिन्दी में स्पष्ट तथा गरिमापूर्ण है।
- source_word: long-suffering / forbearance (नियंत्रित पाठ में पुनर्निर्मित भाव)
  choice: सहनशीलता … धीरज रखता आया है
  rationale: संज्ञा और क्रियात्मक पुनरुक्ति दोनों को स्वाभाविक हिन्दी में रखते हुए परमप्रधान के दीर्घकालीन संयम का भाव सुरक्षित किया गया है।
- source_word: throughout all generations
  choice: पीढ़ी-दर-पीढ़ी बनी रही है
  rationale: कालगत निरंतरता को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: all who are born
  choice: जन्म लेनेवाले सभी लोग
  rationale: मूल की सार्वभौमिक अभिव्यक्ति को बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के बनाए रखता है।
- source_word: those who sin and those who are righteous
  choice: चाहे वे पापी हों या धर्मी
  rationale: दोनों नैतिक वर्गों के बीच मूल विरोध को संक्षिप्त और स्पष्ट रूप में सुरक्षित रखता है।
theological_decisions:
- issue: परमप्रधान का धीरज पापियों और धर्मियों दोनों के प्रति
  choice: दोनों वर्गों को समान वाक्य-सीमा में रखा गया है
  alternative: केवल पापियों के प्रति धीरज पर बल देना
  rationale: पाठ स्पष्ट रूप से पाप करनेवालों और धर्मियों दोनों को सम्मिलित करता है; इसे केवल पापियों तक सीमित करना मूल की धर्मवैज्ञानिक व्यापकता को बदल देता।
- issue: सहनशीलता की कालगत प्रकृति
  choice: ‘पीढ़ी-दर-पीढ़ी बनी रही है’ और ‘धीरज रखता आया है’
  alternative: इसे केवल भविष्य की सहनशीलता के रूप में प्रस्तुत करना
  rationale: दर्शन भविष्य में होगा, पर देखी जाने वाली दिव्य सहनशीलता सभी पीढ़ियों में चली आई है; दोनों कालगत स्तरों को अलग रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तू’ एकवचन संबोधन को बनाए रखता है, जबकि ‘देखोगे’ में वक्ता के साथ उपस्थित अनेक लोगों का संयुक्त कर्ता स्वाभाविक रूप से व्यक्त होता है। उपलब्ध सिरिएक पृष्ठ-पाठ OCR-क्षत और पद-सीमा की दृष्टि से अनिश्चित है; इसलिए नियंत्रित अध्याय-पाठ और अंग्रेज़ी परामर्श-पर्त के अनुरूप अर्थ ग्रहण करते हुए अनावश्यक विवरण नहीं जोड़ा गया।
