  text: And I answered and said, “But look, Lord, no one knows the number of the things that have passed, nor of the things that are to come.
translation:
  language: hi
  text: और मैंने उत्तर दिया, “परन्तु देखिए, हे प्रभु, जो बीत गए हैं उनकी संख्या, और जो आने वाले हैं उनकी संख्या, किसी को भी ज्ञात नहीं है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में यह स्पष्ट नहीं किया गया है कि यहाँ बीत चुके और आने वाले लोगों, समयों या घटनाओं की बात है।
    reason: सिरिएक में संबंधवाचक रूप का संज्ञात्मक संदर्भ अनिर्दिष्ट है; टिप्पणी पाठक को इस वास्तविक अस्पष्टता से अवगत कराती है।
lexical_decisions:
- source_word: ܐܬܥܢܝܬ ܘܐܡܪܬ
  choice: मैंने उत्तर दिया
  rationale: यह प्रचलित सेमिटिक कथन-सूत्र है; हिन्दी में ‘उत्तर दिया’ स्वाभाविक है और अलग से ‘कहा’ जोड़ना अनावश्यक पुनरुक्ति होता।
- source_word: ܐܠܐ ܗܐ ܡܪܝܐ
  choice: परन्तु देखिए, हे प्रभु
  rationale: ܐܠܐ विरोध या आपत्ति को, ܗܐ ध्यान आकर्षित करने को, और ܡܪܝܐ प्रत्यक्ष संबोधन को व्यक्त करता है।
- source_word: ܡܢܝܢܐ
  choice: लेखा
  rationale: मूल अर्थ ‘संख्या/गिनती’ है; यहाँ ‘लेखा जानना’ आधुनिक हिन्दी में कुल संख्या या परिमाण जानने का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: ܕܐܝܠܝܢ ܕܥܒܪܝܢ ... ܕܐܝܠܝܢ ܕܥܬܝܕܢ
  choice: उनका जो बीत चुके हैं ... उनका जो आनेवाले हैं
  rationale: सिरिएक संबंधवाचक रूप संज्ञा को स्पष्ट नहीं करता। हिन्दी में भी संज्ञा न जोड़कर मूल की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘जो बीत चुके हैं’ और ‘जो आनेवाले हैं’ का आशय व्यक्ति हैं, घटनाएँ हैं, या कालखंड
  choice: संज्ञा को अनिर्दिष्ट रखा गया
  alternative: ‘बीती हुई घटनाओं’ और ‘आनेवाली घटनाओं’ अथवा ‘बीत चुके लोगों’ और ‘आनेवाले लोगों’
  rationale: सिरिएक पाठ में संबंधवाचक सर्वनाम का संदर्भ खुला है। प्रसंग संख्या, पीढ़ियों और भावी घटनाओं—सभी से जुड़ सकता है; किसी एक अर्थ को मुख्य पाठ में निश्चित करना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण प्रत्यक्ष संबोधन और साधारण पाठकों के लिए सहज वाक्य-विन्यास अपनाया गया है। ‘देखिए’ संबोधित प्रभु के प्रति आदरसूचक है; ‘लेखा’ औपचारिकता और सुबोधता के बीच संतुलन रखता है।
