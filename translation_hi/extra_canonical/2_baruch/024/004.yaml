translation:
  language: hi
  text: क्योंकि हमारे साथ जो हुआ है, उसे मैं जानता हूँ; पर हमारे शत्रुओं के साथ क्या होगा, यह मैं नहीं जानता—और न यह कि तू अपनी कृतियों की सुधि कब लेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध सिरियाई पृष्ठ का पाठ इस स्थान पर टूटा हुआ है। दिखाई देने वाले शब्दों का अधिक शाब्दिक अर्थ है, “क्योंकि मुझ पर जो बीता, उसे मैंने देखा; पर जो…।” शेष वाक्य निकटवर्ती पाठ-साक्ष्य और प्रचलित पद-विभाजन के आधार पर दिया गया है।
    reason: प्रदत्त स्रोत-पृष्ठ में पद 24:4 की सीमा पर पाठ अपूर्ण है और उपलब्ध पाठ में प्रथम पुरुष एकवचन का संकेत है, जबकि परामर्श-पाठ में सामुदायिक बहुवचन मिलता है।
lexical_decisions:
- source_word: ܓܕܫܢܝ
  choice: हमारे साथ जो हुआ है
  rationale: मूल क्रिया का अर्थ ‘घटित होना/आ पड़ना’ है। उपलब्ध पांडुलिपि-पाठ में प्रथम पुरुष एकवचन का संकेत दिखता है, जबकि परामर्श-पाठ सामुदायिक ‘हमारे साथ’ पढ़ता है; अध्याय के सामूहिक विलाप-संदर्भ को ध्यान में रखते हुए मुख्य पाठ में बहुवचन रखा गया है और पाठांतर को पादटिप्पणी में बताया गया है।
- source_word: ܚܙܝܬ / ܝܕܥ
  choice: जानता हूँ
  rationale: दृश्य-पाठ में ‘मैंने देखा’ का रूप दिखाई देता है, किंतु वाक्य का ज्ञानात्मक विरोध—जो हो चुका है बनाम जो आगे होगा—हिन्दी में ‘जानता हूँ’ से स्वाभाविक और स्पष्ट बनता है।
- source_word: ܒܥܠܕܒܒܝܢ
  choice: हमारे शत्रुओं
  rationale: विरोधी पक्ष के लिए सीधा और प्रतिष्ठित आधुनिक हिन्दी पद।
- source_word: ܬܣܥܘܪ ܥܒܕܝܟ
  choice: तू अपने किए हुए कामों की सुधि लेगा
  rationale: ‘भेंट/निरीक्षण/हस्तक्षेप करना’ और ‘काम/कृतियाँ’ की अभिव्यक्ति को जानबूझकर व्यापक रखा गया है; ‘दण्ड देगा’ जैसे अधिक निश्चित धार्मिक अर्थ को आरोपित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर द्वारा अपने कार्यों की ‘सुधि लेने’ का आशय
  choice: अपने किए हुए कामों की सुधि कब लेगा
  alternative: अपनी सृष्टि पर कब ध्यान देगा / अपने कामों का निरीक्षण कब करेगा
  rationale: मूल अभिव्यक्ति दैवी ध्यान, हस्तक्षेप या न्यायिक निरीक्षण—इनमें से एक से अधिक भाव धारण कर सकती है। मुख्य पाठ इस तनाव को किसी एक संकीर्ण अर्थ में नहीं बाँधता।
- issue: शत्रुओं के भावी भाग्य की अनिश्चितता
  choice: क्या होगा, यह मैं नहीं जानता
  alternative: उन पर क्या बीतेगी, मैं नहीं जानता
  rationale: वक्ता की सीमित जानकारी को यथावत रखा गया है; भावी न्याय का स्वरूप या समय अनुमान से नहीं जोड़ा गया।
