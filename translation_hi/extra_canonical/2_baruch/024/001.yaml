  yaml_path: translation/extra_canonical/2_baruch/024/001.yaml
  text: For look, days are coming when the books will be opened, in which the sins of all who have sinned are written, and also the storehouses in which the righteousness of all who were righteous in creation is gathered.
translation:
  language: hi
  text: देखो, वे दिन आ रहे हैं जब पुस्तकें खोली जाएँगी, जिनमें उन सभी के पाप लिखे हैं जिन्होंने पाप किया है, और वे भंडार भी, जिनमें सृष्टि में धर्मी रहे सभी लोगों की धार्मिकता संचित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܘܡ̈ܬܐ
  choice: वे दिन
  rationale: बहुवचन ‘दिनों’ को स्वाभाविक हिन्दी में निश्चित भाव के साथ प्रस्तुत किया गया है।
- source_word: ܚܛܝ̈ܐ
  choice: पाप
  rationale: यहाँ संदर्भ लिखित अपराधों/पापों का है; ‘पाप’ धार्मिक और सामान्य दोनों पाठकों के लिए स्पष्ट है।
- source_word: ܙܕܝ̈ܩܐ / ܐܙܕܩܦ
  choice: धर्मी रहे / धार्मिकता
  rationale: स्रोत में धर्मी व्यक्तियों और उनके धर्ममय आचरण के बीच संबंध को बनाए रखने के लिए एक ही शब्द-परिवार का प्रयोग किया गया है।
- source_word: ܓܙ̈ܐ
  choice: भंडार
  rationale: ‘कोषागार’ की अपेक्षा ‘भंडार’ अधिक सहज है और संचित वस्तु के रूपक को सुरक्षित रखता है।
- source_word: ܒ̣ܪܝܬܐ ܕܐܬܒܪܝܬ
  choice: सृष्टि में
  rationale: स्रोत के सृष्टि-संबंधी व्यापक क्षेत्र को बनाए रखा गया है; इसे ‘अपने जीवन में’ जैसे व्याख्यात्मक अर्थ में सीमित नहीं किया गया।
theological_decisions:
- issue: ‘सृष्टि में’ वाक्यांश का संबंध
  choice: इसे धर्मी रहे लोगों से जोड़ा गया है
  alternative: इसे धार्मिकता के संचित होने या सृष्टि के आरंभ से जोड़ना
  rationale: प्राप्त सिरियाई पाठ और परामर्श-पाठ में निकटतम व्याकरणिक संबंध धर्मी व्यक्तियों से है; हिन्दी में भी वही संरचना रखी गई है, बिना अतिरिक्त धर्मशास्त्रीय व्याख्या के।
- issue: भंडारों के खुलने की क्रिया
  choice: ‘खोले जाएँगे’ को दूसरे खंड में स्पष्ट रूप से दोहराया गया है
  alternative: क्रिया को लोप करके केवल ‘और वे भंडार’ कहना
  rationale: स्रोत में क्रिया साझा मानी जा सकती है, पर हिन्दी में उसे दोहराने से समानांतरता और आशय स्पष्ट होता है, कोई नया धर्मशास्त्रीय दावा नहीं जुड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ उद्घोषणात्मक ध्यानाकर्षण को व्यक्त करता है। वाक्य की दो समानांतर छवियाँ—पापों की पुस्तकें और धार्मिकता के भंडार—सुरक्षित रखी गई हैं।
