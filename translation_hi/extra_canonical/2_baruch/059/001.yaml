  yaml_path: translation/extra_canonical/2_baruch/059/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and going forth and covering this earth: it is the world which his power made when he considered making creation. And when the word went out from before him, the structure of the world stood forth, very small, and it was established according to what was sought for it to become.


    And as for the first black waters that you saw descending upon it from the cloud, this is the first sin, the transgression that the first Adam committed. For when he sinned, death was stirred up, though it was not in its time; and mourning was made known, and sorrows were prepared, and pain was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in a form and took on a likeness, know that the time will be examined, and the law of humanity will be measured, and its strength will be tested. Therefore Adam, while he was one who heard from God something of what was to be, considered the release of the dead that had been given, and what had been commanded him from God. He kept considering, and he devised five thoughts. For he made himself liable; he also made the angels liable. And even at that time when he was created, a vision was shown to him: the fierce beasts, and the elements with fire. Thus God gathered in Eden, in the likeness of those who were created.'
translation:
  language: hi
  text: '“सुनो, वह विशाल बादल क्या है जिसे तुमने समुद्र से ऊपर उठते, आगे बढ़ते और इस धरती को ढकते देखा। वह यह संसार है, जिसे उसकी सामर्थ्य ने तब बनाया जब उसने सृष्टि करने का विचार किया। और जब उसके सामने से वचन निकला, तब संसार का ढाँचा बहुत छोटा-सा खड़ा हुआ, और जैसा उसका होना अपेक्षित था, वैसा ही उसे व्यवस्थित किया गया।


    “और जो पहले काले जल तुमने उस बादल से उस पर उतरते देखा, वह पहला पाप है—वह अपराध जो प्रथम आदम ने किया था। क्योंकि जब उसने पाप किया, तब मृत्यु हिल उठी, यद्यपि अभी उसका समय नहीं आया था; शोक प्रकट हुआ, दुख तैयार किए गए, पीड़ा रची गई, कठिन परिश्रम पूरा हुआ, और महानता नीचे गिरने लगी।


    “और अंतिम दिन के विषय में, जिसे एक रूप में दिखाया गया और जिसने एक प्रतिरूप धारण किया, यह जान लो: समय की जाँच की जाएगी, मानवता की व्यवस्था[a] मापी जाएगी और उसकी शक्ति परखी जाएगी। इसलिए आदम ने—जिसने परमेश्वर से होनेवाली कुछ बातें सुनी थीं—मरे हुओं की उस मुक्ति पर, जो दी गई थी, और परमेश्वर की ओर से उसे दी गई आज्ञा पर विचार किया। वह विचार करता रहा और उसने पाँच विचार सोचे। क्योंकि उसने स्वयं को दोष का भागी बनाया और स्वर्गदूतों को भी दोष का भागी बनाया। यहाँ तक कि जिस समय वह रचा गया था, उसी समय उसे एक दर्शन दिखाया गया था—भयंकर पशुओं और आग सहित तत्त्वों का। और इस प्रकार परमेश्वर ने अदन में, सृजे हुओं के सदृश, इकट्ठा किया[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवता का मापदंड।”
    reason: ܢܘܡܫܐ का अर्थ यहाँ व्यवस्था/नियम भी हो सकता है और संदर्भानुसार मूल्यांकन का मापदंड भी।
  - marker: b
    text: अंतिम वाक्य का सिरियाई पाठ कठिन है; किसे इकट्ठा किया गया, यह स्पष्ट नहीं है।
    reason: मूल में ‘इकट्ठा किया’ का व्यक्त कर्म नहीं है और ‘सृजे हुओं के सदृश’ का संबंध भी संक्षिप्त है।
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: संसार का ढाँचा
  rationale: यह पद संसार के खड़े होने, स्थापित रूप या संरचना को सूचित करता है। ‘ढाँचा’ सृष्टि के मूर्त विन्यास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: पहला पाप—वह अपराध
  rationale: दोनों संज्ञाओं को अलग रखकर आदम के मूल पाप पर स्रोत का दोहरा बल सुरक्षित रखा गया है।
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: मृत्यु हिल उठी
  rationale: क्रिया मृत्यु के केवल ज्ञात होने के बजाय उसके सक्रिय या गतिशील हो उठने का बिंब देती है; यह हिन्दी उस रूपक को बनाए रखती है।
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: महानता नीचे गिरने लगी
  rationale: ‘लगी’ आरम्भसूचक पक्ष और ‘नीचे गिरने’ पतन की दिशा—दोनों को सुरक्षित रखता है।
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: मानवता की व्यवस्था
  rationale: ܢܘܡܫܐ का सामान्य अर्थ नियम, विधान या व्यवस्था है। साथ की क्रिया ‘मापी जाएगी’ मूल्यांकन का भाव देती है; वैकल्पिक ‘मापदंड’ को पादटिप्पणी में रखा गया है।
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: मरे हुओं की मुक्ति
  rationale: यह जानबूझकर व्यापक अनुवाद है, जो ‘छुटकारा/रिहाई’ का अर्थ रखता है, पर इसे निश्चित रूप से पुनरुत्थान या पाप-क्षमा नहीं बनाता।
- source_word: ܡܚܝܒܢܘܗܝ
  choice: दोष का भागी बनाया
  rationale: पद के न्यायिक दायित्व के भाव को साधारण आधुनिक हिन्दी में व्यक्त किया गया है, बिना कठिन कथन को नरम किए।
- source_word: ܐܣܛܘܟܣܐ
  choice: तत्त्वों
  rationale: यूनानी मूल का यह शब्द यहाँ विश्व के मूल तत्त्वों के लिए सबसे स्वाभाविक है; ‘तत्त्व’ अनावश्यक व्याख्या से बचता है।
- source_word: ܒܥܕܢ
  choice: अदन में
  rationale: यहाँ व्यंजनात्मक पाठ स्पष्ट रूप से अदन-स्थान की ओर संकेत करता है, न कि ‘पहले से’ या ‘समय पर’ की ओर।
theological_decisions:
- issue: आदम के पाप और मृत्यु का सक्रिय होना
  choice: आदम के पाप से मृत्यु अपने नियत समय से पहले ‘हिल उठी’।
  alternative: इसे केवल मृत्यु के ज्ञात हो जाने या एक अलंकारिक कथन के रूप में प्रस्तुत किया जा सकता था।
  rationale: सिरियाई पाठ पाप और मृत्यु के सक्रिय होने के बीच स्पष्ट कारणात्मक संबंध रखता है; अनुवाद उस बल को बनाए रखता है, पर बाद की किसी व्यवस्थित धर्मशास्त्रीय व्याख्या को नहीं जोड़ता।
- issue: स्वर्गदूतों का दोष का भागी होना
  choice: कठिन कथन को यथावत रखा गया है कि आदम ने स्वर्गदूतों को भी दोष का भागी बनाया।
  alternative: पाठ को संदिग्ध मानकर कथन को केवल आदम तक सीमित किया जा सकता था।
  rationale: प्रेषित सिरियाई पाठ में स्वर्गदूत स्पष्ट रूप से शामिल हैं। अर्थ कठिन होने पर भी उसे चुपचाप हटाना या केवल साक्षी होने तक सीमित करना उचित नहीं है।
- issue: मरे हुओं की मुक्ति
  choice: ‘मरे हुओं की मुक्ति’ रखा गया है।
  alternative: ‘मरे हुओं का पुनरुत्थान’ या ‘मृतकों से संबंधित क्षमा’।
  rationale: स्रोत का शब्द इन अधिक विशिष्ट धर्मशास्त्रीय अर्थों में से किसी एक को निर्णायक नहीं बनाता; व्यापक पद मूल तनाव और संभावना को सुरक्षित रखता है।
- issue: अंतिम वाक्य में अदन और एकत्र करने का अस्पष्ट संबंध
  choice: स्रोत की अपूर्णता को रखते हुए ‘परमेश्वर ने अदन में, सृजे हुओं के सदृश, इकट्ठा किया’ अनूदित किया गया है।
  alternative: अस्पष्ट कर्म को अनुमान से आदम, पशुओं या सभी प्राणियों के रूप में स्पष्ट करना।
  rationale: वाक्य का कर्म प्रेषित पाठ में स्पष्ट नहीं है। किसी एक धर्मशास्त्रीय दृश्य को निश्चित करने के बजाय पादटिप्पणी द्वारा कठिनाई बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक-प्रकाशनात्मक स्वर रखा गया है। लंबे सिरियाई वाक्यों को पठनीय हिन्दी खंडों में बाँटा गया है, पर उनकी पुनरावृत्ति, कारणात्मक क्रम और कठिन धर्मशास्त्रीय कथन सुरक्षित हैं। ‘परमेश्वर’, ‘सृष्टि’, ‘वचन’, ‘अदन’ जैसे व्यापक और गैर-सांप्रदायिक बाइबलीय शब्द प्रयुक्त हुए हैं।
