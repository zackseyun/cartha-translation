    “और अंतिम दिन के विषय में, जो एक रूप में दिखाया गया और जिसने एक समानता धारण की, यह जान लो: समय की जाँच की जाएगी, मानवता की व्यवस्था[a] मापी जाएगी और उसकी शक्ति परखी जाएगी। इसलिए आदम ने—जिसने परमेश्वर से होनेवाली कुछ बातें सुनी थीं—मरे हुओं की उस मुक्ति पर, जो दी गई थी, और परमेश्वर की ओर से उसे दी गई आज्ञा पर विचार किया। वह विचार करता रहा और उसने पाँच विचार किए। क्योंकि उसने स्वयं को दोष का भागी बनाया और स्वर्गदूतों को भी दोष का भागी बनाया। यहाँ तक कि जिस समय वह रचा गया था, उसी समय उसे एक दर्शन दिखाया गया था—भयंकर पशुओं और आग सहित तत्त्वों का। और इस प्रकार परमेश्वर ने अदन में, सृजे हुओं के सदृश, इकट्ठा किया[b]।”'
