base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/009.yaml
  text: And it will happen that anyone who escapes and is delivered from all these aforementioned things—both those who conquered and those who were conquered—will be delivered into the hands of my servant, the Messiah.
translation:
  language: hi
  text: और ऐसा होगा कि जो कोई इन सभी पहले बताई गई बातों से[a] बच निकले और छुड़ाया जाए—चाहे वह विजयी लोगों में से हो या पराजित लोगों में से—उसे मेरे सेवक, मसीह, के हाथों में सौंप दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इन सब बातों से’।
    reason: संक्षिप्त वैकल्पिक पाठ में ‘पहले बताई गई’ का संकेत व्यक्त नहीं होता; मुख्य पाठ स्रोत में उपस्थित पूर्वोक्त बातों के संदर्भ को सुरक्षित रखता है।
lexical_decisions:
- source_word: ܡܫܝܚܐ
  choice: मसीह
  rationale: सीरियाई शब्द का पारंपरिक और अर्थ-सटीक हिन्दी रूप; उपाधि को किसी अतिरिक्त सांप्रदायिक व्याख्या के बिना सुरक्षित रखता है।
- source_word: ܐܝܕ̈ܝܐ
  choice: हाथों में
  rationale: अधिकार या वश में सौंपे जाने का स्रोत-पाठ का रूपक हिन्दी में भी स्वाभाविक और स्पष्ट है।
- source_word: ܐܡܝܪ̈ܢ
  choice: पहले बताई गई
  rationale: ऊपर कही अथवा पूर्वोक्त बातों की ओर संकेत करने वाले संबंधवाची भाव को स्पष्ट रूप से व्यक्त करता है, जिसे केवल ‘इन सब बातों’ में छोड़ देने से अर्थ का एक अंश छूट जाता।
theological_decisions:
- issue: ‘मेरे सेवक’ और ‘मसीह’ का संबंध
  choice: मेरे सेवक, मसीह
  alternative: मेरे मसीही सेवक / सेवक-मसीह
  rationale: दोनों पदों को समान व्यक्ति के लिए प्रयुक्त पदनामों के रूप में रखता है, पर कोई अतिरिक्त मसीह-विषयक सिद्धांत आरोपित नहीं करता।
- issue: विजयी और पराजित लोगों का समावेश
  choice: चाहे वह विजयी लोगों में से हो या पराजित लोगों में से
  alternative: विजय पाने वाले और पराजित हुए लोग
  rationale: दोनों विरोधी समूहों को समान रूप से सम्मिलित रखता है और यह स्पष्ट करता है कि बच निकलने वाला व्यक्ति किसी भी पक्ष से हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘बच निकले और छुड़ाया जाए’ सक्रिय बचाव और प्रदत्त छुटकारे, दोनों भावों को बनाए रखता है; ‘हाथों में सौंप दिया जाएगा’ स्रोत का अधिकार-संबंधी रूपक सुरक्षित रखता है।
