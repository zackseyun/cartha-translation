  text: The wise will be silent and the foolish will speak. Then the thought of men will not be fulfilled, nor the counsel of the strong, nor the hope of those who hope.
translation:
  language: hi
  text: बुद्धिमान मौन रहेंगे और मूर्ख बोलेंगे। तब मनुष्यों की योजना पूरी न होगी, न बलवानों की सलाह पूरी होगी, और न आशा रखने वालों की आशा पूरी होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܚܟܝ̈ܡܐ / English consultation: “the wise”'
  choice: बुद्धिमान
  rationale: व्यक्तियों के एक वर्ग को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: 'ܢܫܬܩܘܢ / English consultation: “will be silent”'
  choice: मौन रहेंगे
  rationale: ‘चुप रहेंगे’ की अपेक्षा कथन के गंभीर, साहित्यिक स्वर के अधिक अनुकूल है।
- source_word: ܣܟܠܐ
  choice: मूर्ख
  rationale: सिरिएक मूल में बौद्धिक/व्यावहारिक मूर्खता का सामान्य पद है; इसे धार्मिक या नैतिक अर्थ में अनावश्यक रूप से नहीं बढ़ाया गया।
- source_word: ܡܚܫܒܬܐ ܕܒܢܝ ܐܢܫܐ
  choice: मनुष्यों की योजना
  rationale: शाब्दिक ‘मनुष्यों का विचार’ के बजाय प्रसंगगत अभिप्राय—सोची हुई योजना—को स्वाभाविक हिन्दी में रखता है।
- source_word: ܬܪܥܝܬܐ
  choice: सम्मति
  rationale: ‘परामर्श/मंत्रणा/संकल्प’ के अर्थ-क्षेत्र को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ܫܒܪ̈ܘܗܝ ܕܐܝܠܝܢ ܕܡܣܒܪܝܢ
  choice: आशा रखनेवालों की आशा
  rationale: मूल की पुनरुक्ति को बनाए रखता है और उसके अलंकारिक बल को नहीं मिटाता।
theological_decisions:
- issue: मानवीय योजनाओं, सम्मति और आशा की विफलता
  choice: तीनों को समानांतर मानवीय अपेक्षाओं के रूप में रखा गया है, बिना कोई अतिरिक्त ईशशास्त्रीय कारण जोड़े।
  alternative: इसे सीधे परमेश्वर के न्याय या पूर्वनियोजन का परिणाम बताना।
  rationale: इस पद में कारण स्पष्ट नहीं किया गया; इसलिए अनुवाद मूल की तनावपूर्ण अनिश्चितता बनाए रखता है।
- issue: ‘आशा’ का आशय
  choice: आशा को सामान्य और अनिर्दिष्ट रखा गया है।
  alternative: इसे उद्धार की आशा, राजनीतिक आशा या दुष्टों की आशा के रूप में निर्दिष्ट करना।
  rationale: मूल पद आशा की वस्तु या आशा रखनेवालों की नैतिक पहचान स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर और सहज साहित्यिक शैली। समानांतर वाक्य-विन्यास तथा ‘आशा रखनेवालों की आशा’ जैसी मूल की पुनरुक्ति सुरक्षित रखी गई है। उपलब्ध सिरिएक अध्याय-पाठ की पृष्ठ-सीमा और पंक्ति-विभाजन में पद का आरम्भ आंशिक रूप से अस्पष्ट है, इसलिए आरम्भिक उपवाक्य के लिए ऑडिट की हुई अंग्रेज़ी परामर्श-परत का सहारा लिया गया है।
