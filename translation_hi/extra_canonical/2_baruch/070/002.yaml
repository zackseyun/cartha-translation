base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/002.yaml
  text: Behold, days are coming when the time of the world has ripened and the harvest of the seed of the evil and the good has come. Then the Mighty One will bring confusion of spirit and consternation of heart upon the earth, its inhabitants, and its rulers.
translation:
  language: hi
  text: देखो, वे दिन आ रहे हैं जब संसार का समय परिपक्व हो जाएगा और बुरे और भले लोगों के बीज[a] की कटनी आ पहुँचेगी। तब परमशक्तिमान पृथ्वी, उसके निवासियों और उसके शासकों पर आत्मा में भ्रम और हृदय में घबराहट लाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘बीज’ एकवचन में सामूहिक अर्थ रखता है; अर्थ ‘बुरे और भले लोगों की संतान’ भी हो सकता है।
    reason: स्रोत के एकवचन रूप और उसके संभावित वंशगत अर्थ को स्पष्ट करता है, बिना उसे मुख्य पाठ में निश्चित किए।
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: यहाँ शब्द वर्तमान विश्व-व्यवस्था अथवा युग के समय को सूचित करता है; ‘संसार’ सामान्य हिन्दी में स्वाभाविक है और वाक्य की कालगत व्यापकता बनाए रखता है।
- source_word: ܙܪܥܐ
  choice: बीज
  rationale: स्रोत का एकवचन सामूहिक रूप बनाए रखा गया है; इसे बहुवचन ‘बीजों’ में बदलने से बुराई और भलाई को बीजों के गुण समझे जाने की संभावना बढ़ती है।
- source_word: ܒܝ̈ܫܐ ... ܛܒ̈ܐ
  choice: बुरे और भले लोगों के
  rationale: ये बहुवचन संज्ञात्मक विशेषण हैं, अर्थात बुरे और भले लोग; इसलिए इन्हें बीज की नैतिक गुणवत्ता के रूप में नहीं प्रस्तुत किया गया।
- source_word: ܚܝܠܬܢܐ
  choice: परमशक्तिमान
  rationale: ईश्वर के लिए प्रयुक्त ‘शक्तिशाली जन’ का स्वाभाविक, गरिमापूर्ण हिन्दी रूप।
- source_word: ܕܘܕܐ ܕܪܘܚܐ
  choice: आत्मा की व्याकुलता
  rationale: आंतरिक अस्थिरता का भाव रखते हुए ‘आत्मा’ संबंधी स्रोत-रूपक सुरक्षित रखा गया।
- source_word: ܬܡܗܐ ܕܠܒܐ
  choice: हृदय की घबराहट
  rationale: हृदय पर छा जाने वाली स्तब्धकारी आशंका का सरल और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘बुरे’ और ‘भले’ का संबंध
  choice: उन्हें लोगों के लिए प्रयुक्त संज्ञात्मक विशेषण मानकर ‘बुरे और भले लोगों के बीज’ किया गया।
  alternative: ‘बुरे और भले बीज’ अथवा ‘उसके बुरे और अच्छे बीज’।
  rationale: सिरिएक में ‘बुरे’ और ‘भले’ बहुवचन संज्ञात्मक रूप हैं और एकवचन ‘बीज’ के संबंधकारक हैं; वैकल्पिक रूप बीजों में निहित नैतिक गुण का अलग अर्थ उत्पन्न करता है।
- issue: ‘बीज’ का आशय
  choice: मुख्य पाठ में रूपक को बिना खोले रखा गया।
  alternative: इसे सीधे ‘संतान’ या ‘वंशज’ कहना।
  rationale: ‘बीज’ फसल और कटनी की उसी छवि का अंग है; ‘संतान’ संभव अर्थ है, पर मुख्य पाठ में उसे निश्चित कर देना मूल की रूपकीय व्यापकता घटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यसूचक शैली रखी गई है। ‘समय पक जाएगा’, ‘बीज’ और ‘कटनी’ के परस्पर जुड़े कृषि-रूपक सुरक्षित हैं; ‘आत्मा’ और ‘हृदय’ की समानांतर रचना भी बनाए रखी गई है।
