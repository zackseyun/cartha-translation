  text: And whoever escapes from the war will die in the earthquake, and whoever escapes from the earthquake will be burned by fire, and whoever escapes from the fire will perish by famine.
translation:
  language: hi
  text: और जो युद्ध से बच निकलेगा, वह भूकंप में मर जाएगा; जो भूकंप से बच निकलेगा, वह आग में जल जाएगा; और जो आग से बच निकलेगा, वह अकाल से नष्ट हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܪܒܐ (युद्ध)
  choice: युद्ध
  rationale: विनाशकारी सशस्त्र संघर्ष के लिए यह आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी शब्द है।
- source_word: ܙܘܥܐ (भूकंप)
  choice: भूकंप
  rationale: प्राकृतिक आपदा का सीधा और सर्वसुलभ हिन्दी समतुल्य।
- source_word: ܢܘܪܐ (आग)
  choice: आग
  rationale: सामान्य पाठक के लिए सहज शब्द; ‘अग्नि’ की अपेक्षा प्रसंग में अधिक स्वाभाविक।
- source_word: ܟܦܢܐ (अकाल/भूख)
  choice: अकाल
  rationale: यहाँ व्यापक विपत्ति और भोजन के अभाव से होने वाली मृत्यु अभिप्रेत है; ‘अकाल’ उस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ܢܫܬܘܙܒ (बच निकलना)
  choice: बच निकलेगा
  rationale: केवल सुरक्षित रहने के बजाय एक विपत्ति से किसी प्रकार निकल जाने का क्रमिक भाव बनाए रखता है।
theological_decisions:
- issue: एक के बाद दूसरी विपत्ति से बचने पर भी अंततः विनाश का कथन
  choice: तीनों खंडों में भविष्यकालीन निश्चितता और समानांतर संरचना बनाए रखी गई
  alternative: इसे सामान्य संभावना के रूप में ‘मर सकता है’ आदि कहना
  rationale: पाठ का उद्देश्य संभाव्यता नहीं, आने वाले न्याय की अनिवार्यता और सर्वग्रासी स्वरूप प्रकट करना है।
translation_notes:
  register: आधुनिक मानक हिन्दी; समानांतर वाक्यरचना और क्रमिक तीव्रता सुरक्षित रखी गई है। भाषा स्पष्ट, गंभीर और सामान्य पाठक के लिए सहज है।
