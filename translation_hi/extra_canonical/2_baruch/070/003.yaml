base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/003.yaml
  text: They will hate one another and provoke one another to fight; the base will rule over the honorable, and the ignoble will be exalted over the illustrious.
translation:
  language: hi
  text: वे एक-दूसरे से बैर रखेंगे और एक-दूसरे को लड़ाई के लिए उकसाएँगे। नीच लोग प्रतिष्ठित लोगों पर शासन करेंगे, और तुच्छ लोग यशस्वी लोगों से ऊपर उठाए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '(English consultation: “hate one another”)'
  choice: एक-दूसरे से बैर रखेंगे
  rationale: परस्पर शत्रुता को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; केवल क्षणिक नापसंदगी का अर्थ नहीं देता।
- source_word: '(English consultation: “provoke one another to fight”)'
  choice: एक-दूसरे को लड़ाई के लिए उकसाएँगे
  rationale: परस्पर संघर्ष भड़काने की क्रिया को स्पष्ट रखता है।
- source_word: '(English consultation: “the base”)'
  choice: नीच लोग
  rationale: नैतिक अथवा सामाजिक हीनता का व्यापक अर्थ बनाए रखता है, बिना किसी विशेष वर्ग को निर्दिष्ट किए।
- source_word: '(English consultation: “the honorable”)'
  choice: प्रतिष्ठित लोग
  rationale: सम्मान प्राप्त लोगों के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: '(English consultation: “the ignoble”)'
  choice: तुच्छ लोग
  rationale: पहले पद के ‘नीच’ के समानार्थी होते हुए भी काव्यात्मक समानांतरता में भेद बनाए रखता है।
- source_word: '(English consultation: “the illustrious”)'
  choice: यशस्वी लोग
  rationale: विशिष्ट प्रतिष्ठा और ख्याति वाले लोगों का अर्थ देता है।
theological_decisions:
- issue: सामाजिक और नैतिक पदों की व्याख्या
  choice: ‘नीच/तुच्छ’ और ‘प्रतिष्ठित/यशस्वी’ जैसे व्यापक पद
  alternative: इन्हें किसी निश्चित धार्मिक, जातीय या राजनीतिक वर्ग के नामों से अनूदित करना
  rationale: उपलब्ध पाठ किसी विशिष्ट समुदाय की पहचान नहीं करता; व्यापक भाषा मूल कथन का तनाव सुरक्षित रखती है।
- issue: अंतिम क्रिया का वाच्य
  choice: ‘ऊपर उठाए जाएँगे’—कर्मवाच्य
  alternative: ‘ऊपर उठेंगे’—कर्तृवाच्य
  rationale: अभिकर्ता को अनिर्दिष्ट रखता है और परामर्श-पाठ के ‘will be exalted’ का औपचारिक पक्ष सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, गंभीर और सर्वसाधारण के लिए बोधगम्य रखा गया है। उपलब्ध सिरिएक अध्याय-बकेट में पद-सीमाएँ अस्पष्ट और पाठ इस पद के अंग्रेज़ी परामर्श-पाठ से प्रत्यक्षतः मेल नहीं खाता; इसलिए अनिश्चित स्रोत-पहचान को छिपाए बिना, प्रस्तुत पद का प्रारूप लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ के अर्थ-संरचनात्मक संकेतों के अनुसार बनाया गया है।
