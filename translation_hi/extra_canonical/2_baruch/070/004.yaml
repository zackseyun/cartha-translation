  yaml_path: translation/extra_canonical/2_baruch/070/004.yaml
  text: Many will be delivered into the hands of the few. Those who were nothing will rule over the strong, the poor will have more than the rich, and the impious will exalt themselves over the brave.
translation:
  language: hi
  text: बहुत-से लोग थोड़े-से लोगों के हाथों में सौंप दिए जाएँगे। जो कुछ नहीं थे[a], वे बलवानों पर शासन करेंगे; निर्धनों के पास धनवानों से अधिक होगा, और अधर्मी अपने आपको वीरों से ऊँचा उठाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनकी कोई हैसियत नहीं थी।”
    reason: ‘जो कुछ नहीं थे’ सामाजिक महत्त्वहीनता या नगण्य समझे जाने का संकेत भी दे सकता है।
lexical_decisions:
- source_word: ܣ̈ܓܝܐܐ / ܒܙܒܘܪ̈ܐ
  choice: बहुत-से लोग / थोड़े-से लोग
  rationale: स्रोत के ‘बहुतों’ और ‘थोड़ों’ के तीखे विरोध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ܕܠܐ ... ܡܕܡ
  choice: जो कुछ नहीं थे
  rationale: शाब्दिक अर्थ ‘जो कुछ भी नहीं थे’ है; चुना हुआ रूप स्रोत की कठोर सामाजिक उलटबाँसी को सुरक्षित रखते हुए हिन्दी में अधिक सहज है।
- source_word: ܥܬܝܪ̈ܐ
  choice: धनवानों
  rationale: ‘निर्धनों’ के विपरीत आर्थिक अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ܪ̈ܫܝܥܐ
  choice: अधर्मी
  rationale: नैतिक और धार्मिक दोनों आयामों को बनाए रखता है; केवल ‘बुरे’ या ‘दुष्ट’ की अपेक्षा स्रोत के भाव के निकट है।
- source_word: ܓܢܒܪ̈ܐ
  choice: वीरों
  rationale: यह शब्द बलशाली अथवा पराक्रमी पुरुषों का संकेत दे सकता है; ‘वीरों’ से ‘बलवानों’ के साथ अनावश्यक पुनरावृत्ति भी टलती है।
theological_decisions:
- issue: ‘अधर्मी’ की पहचान
  choice: किसी विशिष्ट धार्मिक समूह की पहचान किए बिना सामान्य नैतिक-धार्मिक पद ‘अधर्मी’ रखा गया।
  alternative: दुष्ट
  rationale: स्रोत का धार्मिक रंग सुरक्षित रहता है और कोई सांप्रदायिक अर्थ आरोपित नहीं होता।
- issue: निर्धनों के पास किस वस्तु की अधिकता होगी
  choice: ‘निर्धनों के पास धनवानों से अधिक होगा’ कहकर वस्तु को अनिर्दिष्ट रखा गया।
  alternative: निर्धनों के पास धनवानों से अधिक संपत्ति होगी
  rationale: स्रोत कथन को खुला रखता है; ‘संपत्ति’ जोड़ना वास्तविक अस्पष्टता को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और प्रलयदर्शी उलटबाँसी के अनुरूप लय रखी गई है। समानांतर उपवाक्यों और विरोधी युग्मों को स्पष्ट रखा गया है; जहाँ स्रोत वस्तु को अनिर्दिष्ट छोड़ता है, वहाँ हिन्दी ने भी उसे नहीं भरा।
