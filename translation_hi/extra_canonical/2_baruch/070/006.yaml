base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/006.yaml
  text: When those things that were foretold have come to pass, confusion will fall upon all people. Some will fall in war, some will perish in tribulations, and some will be destroyed by their own.
translation:
  language: hi
  text: जब वे बातें घटित हो जाएँगी जिनके विषय में पहले से कहा गया था, तब सब लोगों में भ्रम फैल जाएगा। कुछ युद्ध में मारे जाएँगे, कुछ विपत्तियों में नष्ट हो जाएँगे, और कुछ अपने ही लोगों के हाथों नाश किए जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और कुछ अपने ही लोगों के कारण संकट में पड़ेंगे।”
    reason: अंतिम सीरियाई अभिव्यक्ति विनाश किए जाने अथवा संकट में पड़ने—दोनों अर्थों की अनुमति दे सकती है।
lexical_decisions:
- source_word: ܐܬܝܢ
  choice: घटित हो जाएँगी
  rationale: संदर्भ में पहले कही गई घटनाओं के ‘आने’ का स्वाभाविक हिन्दी रूप; भावी पूर्णता को व्यक्त करता है।
- source_word: ܣ̈ܓܝܐܐ ܒܙܒܘܪ̈ܐ
  choice: कुछ युद्ध में मारे जाएँगे
  rationale: विभिन्न समूहों पर आने वाले विनाश की समानांतर सूची को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ܒܫܪܝܪܐ
  choice: विपत्तियों में
  rationale: यहाँ संकटों/क्लेशों की व्यापक धारणा रखी गई है; किसी विशिष्ट प्रकार की पीड़ा तक अर्थ सीमित नहीं किया गया।
- source_word: ܕ̈ܡܝܟܐ ܐܠܐ ܓܒܪ̈ܐ
  choice: अपने ही लोगों के हाथों
  rationale: सम्बन्धवाचक अभिव्यक्ति को हिन्दी में स्वाभाविक बनाया गया है और निकट समुदाय अथवा स्वजनों द्वारा विनाश का भाव रखा गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में क्रिया का अर्थ
  choice: नाश किए जाएँगे
  alternative: संकट में डाले जाएँगे
  rationale: पाठ का व्यापक प्रसंग विनाश और मृत्यु का है, इसलिए मुख्य पाठ में प्रबल अर्थ चुना गया; फिर भी अपेक्षाकृत हल्का अर्थ पाठ-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। समानांतर ‘कुछ... कुछ... और कुछ...’ संरचना मूल की क्रमिक विपत्तियों को बनाए रखती है।
