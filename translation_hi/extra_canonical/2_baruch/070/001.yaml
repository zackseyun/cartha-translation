lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ܐܚܪ̈ܝܐ
  choice: अन्तिम काले जल
  rationale: प्रलय-दर्शन के प्रतीकात्मक चित्र को ज्यों का त्यों रखता है; इसे सामान्य विपत्ति में नहीं बदलता।
- source_word: ܦܘܫܩܐ
  choice: अर्थ
  rationale: दर्शन के प्रतीकों की व्याख्या के प्रसंग में स्वाभाविक आधुनिक हिन्दी; ‘व्याख्या’ भी सम्भव है।
- source_word: ܗܢܘ ܦܬܓܡܐ
  choice: बात यह है
  rationale: आगे आने वाली व्याख्या का परिचय देने वाले सूत्र को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘अन्तिम काले जलों’ की प्रतीकात्मकता
  choice: प्रतीक को बिना खोले ‘अन्तिम काले जल’ ही रखा गया है।
  alternative: इसे सीधे विश्वव्यापी विपत्ति या अन्त-समय का संकट कहना।
  rationale: इस पद में प्रतीक की व्याख्या अभी आरम्भ होने वाली है; अनुवाद में पहले ही उसका धार्मिक अर्थ निर्धारित कर देना मूल की क्रमिक उद्घाटन-शैली और सम्भावित तनाव को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण। उपलब्ध Ceriani पृष्ठ-अंश में इस पद का पाठ स्पष्ट रूप से सुरक्षित नहीं है; इसलिए दीर्घ नियंत्रण-परम्परा और परीक्षित अंग्रेज़ी परामर्श-पाठ के अनुरूप पुनर्निर्मित वाक्य का अनुवाद किया गया है। ‘काले जलों’ की जानबूझकर की गई पुनरावृत्ति बनाए रखी गई है।
