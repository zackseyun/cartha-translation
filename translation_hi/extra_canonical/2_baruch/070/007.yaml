  yaml_path: translation/extra_canonical/2_baruch/070/007.yaml
  text: and some will be undone by their own. Then the Most High will reveal the peoples whom he prepared beforehand, and they will come and wage war against the rulers who remain at that time.
translation:
  language: hi
  text: और कुछ अपने ही कारण नष्ट हो जाएँगे। तब परमप्रधान उन जातियों को प्रकट करेगा जिन्हें उसने पहले से तैयार किया था; और वे आकर उन शासकों से युद्ध करेंगे जो उस समय शेष रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܡܢܐ
  choice: परमप्रधान
  rationale: यह उपाधि ईश्वर की सर्वोच्चता को व्यक्त करती है और हिन्दी बाइबलीय शैली में स्वाभाविक है।
- source_word: ܥܡܡ̈ܐ
  choice: जातियों
  rationale: बहुवचन शब्द यहाँ लोगों अथवा राष्ट्र-समुदायों को सूचित करता है; ‘जातियाँ’ इस अपोकैलिप्टिक संदर्भ में संक्षिप्त और परिचित पद है।
- source_word: ܓܠܝܘ
  choice: प्रकट करेगा
  rationale: धातु का मूल भाव छिपी हुई वस्तु या सत्ता को प्रकट करना है; इससे अन्त-समय में पहले से रखी गई जातियों के उद्घाटन का भाव सुरक्षित रहता है।
- source_word: ܕܩܕܡ
  choice: पहले से
  rationale: यह पूर्वता का भाव देता है और तैयारी की क्रिया के साथ मिलकर अग्रिम व्यवस्था को व्यक्त करता है।
theological_decisions:
- issue: परमप्रधान द्वारा जातियों को पहले से तैयार करना
  choice: ‘जिन्हें उसने पहले से तैयार किया था’
  alternative: ‘जो पहले से तैयार थीं’
  rationale: कर्ता को परमप्रधान मानना परामर्श-पाठ के अनुरूप है, पर वाक्य को इतना नहीं बढ़ाया गया कि तैयारी की प्रकृति या उद्देश्य पर कोई अतिरिक्त सिद्धान्त आरोपित हो।
- issue: जातियों का प्रकट किया जाना
  choice: ‘प्रकट करेगा’
  alternative: ‘उकसाएगा’ या ‘उठा खड़ा करेगा’
  rationale: सीरियाई क्रिया का प्रत्यक्ष अर्थ प्रकट या उद्घाटित करना है; वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि वास्तविक व्याख्यात्मक संभावना बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने ही लोगों के हाथों’ आरम्भिक वाक्यांश के संबंधसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उस समय तक बचे रहेंगे’ शासकों के शेष रहने का कालगत भाव स्पष्ट करता है।
