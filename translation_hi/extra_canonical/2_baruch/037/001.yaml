  yaml_path: translation/extra_canonical/2_baruch/037/001.yaml
  text: And after these things I saw that the cedar was burning, and the forest that was around it, and the vine was growing, and the plain around it was full of unfading flowers. And I awoke and arose.
translation:
  language: hi
  text: इन बातों के बाद मैंने देखा कि देवदार जल रहा था और उसके चारों ओर का वन भी जल रहा था। दाखलता बढ़ रही थी, और उसके चारों ओर का मैदान कभी न मुरझाने वाले फूलों से भरा था। तब मैं जाग गया और उठ खड़ा हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ
  choice: देवदार
  rationale: यह दर्शन के विशिष्ट और राजसी प्रतीक को बनाए रखता है; सामान्य ‘पेड़’ कहना अर्थ को कमजोर कर देता।
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: इन बातों के बाद
  rationale: यह कथानक के क्रम को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܚܙܝܬ
  choice: मैंने देखा
  rationale: दर्शन का प्रथम-पुरुष वृत्तांत और स्रोत की सरल क्रिया सुरक्षित रहती है।
- source_word: vine (control-backed reading)
  choice: दाखलता
  rationale: दर्शन में देवदार के विपरीत उभरते विशिष्ट प्रतीक को बिना समय से पहले उसकी धर्मवैचारिक पहचान बताए सुरक्षित रखा गया है।
- source_word: unfading flowers (control-backed reading)
  choice: कभी न मुरझाने वाले फूल
  rationale: फूलों के स्थायी, जीवनपूर्ण स्वरूप को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दाखलता को मुख्य पाठ में सीधे मसीहा के रूप में पहचानना
  choice: दर्शन की आकृति को ‘दाखलता’ ही रखा गया है।
  alternative: यहाँ ही उसे ‘मसीहा’ कहना या किसी अन्य प्रकार से उसकी व्याख्या जोड़ना।
  rationale: आकृति की व्याख्या अगले अध्याय में आती है। यहाँ प्रतीकात्मक भाषा बनाए रखने से कथानक का क्रम और दर्शन की अपनी अस्पष्टता सुरक्षित रहती है।
- issue: देवदार और वन के जलने के संबंध को व्यक्त करना
  choice: दोनों के जलने को स्पष्ट किया गया है।
  alternative: वाक्य को इतना संक्षिप्त रखना कि केवल देवदार का जलना निश्चित लगे।
  rationale: नियंत्रण-पाठ के अनुसार आग देवदार और उसके चारों ओर के वन दोनों को घेरे हुए है; हिन्दी में क्रिया दोहराने से संबंध स्वाभाविक और स्पष्ट बनता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक रखी गई है। ‘उठ खड़ा हुआ’ जागने के बाद की शारीरिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है। उपलब्ध पृष्ठांश की सीमा और पाठ-विकृति को देखते हुए पद की स्थापना नियंत्रण-समर्थित अध्याय-पाठ तथा संशोधित पद-पहचान के आधार पर की गई है; पिछले विस्तृत पाठ को इस पद में नहीं जोड़ा गया, क्योंकि वह पूर्ववर्ती पदों से संबंधित है।
