  yaml_path: translation/extra_canonical/2_baruch/074/001.yaml
  text: '1. And it shall be in those days: the reapers will not grow weary, and the builders will not labor; for the works will move forward of themselves with those who do them, in much tranquility.'
translation:
  language: hi
  text: '1. उन दिनों ऐसा होगा: फसल काटने वाले नहीं थकेंगे और निर्माण करने वाले परिश्रम नहीं करेंगे, क्योंकि उनके काम उन्हें करने वालों के साथ बड़ी शांति से अपने-आप आगे बढ़ते जाएँगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'probable Syriac harvesters-reapers term (chapter boundary; control witness: messores)'
  choice: फसल काटनेवाले
  rationale: यह ठोस कृषि-बिंब को बनाए रखता है और सामान्य ‘मज़दूरों’ तक अर्थ का अनावश्यक विस्तार नहीं करता।
- source_word: 'probable Syriac builders term (control witness: aedificantes)'
  choice: निर्माण करनेवाले
  rationale: आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है तथा खेत और निर्माण के समानांतर बिंब को बनाए रखता है।
- source_word: non fatigabuntur ... neque laborabunt (control witness for probable Syriac verbs)
  choice: न थकेंगे ... परिश्रम न करेंगे
  rationale: दोनों क्रियाओं को अलग रखा गया है, ताकि मूल का संतुलित कथन बना रहे।
- source_word: sponte erunt currentia opera (control witness for probable Syriac expression)
  choice: उनके काम अपने-आप ... आगे बढ़ते जाएँगे
  rationale: यह केवल सफलता या आसानी नहीं, बल्कि असाधारण रूप से सहज प्रगति का प्रलयदर्शी बिंब व्यक्त करता है; साथ ही हिन्दी में यांत्रिक अर्थ से बचता है।
- source_word: tranquillitate multa (control witness for probable Syriac expression)
  choice: बड़े चैन से
  rationale: यह अत्यधिक औपचारिक शब्दावली के बिना गहरी शांति, सहजता और विश्राम का वातावरण व्यक्त करता है।
theological_decisions:
- issue: मसीही युग में श्रम के सहज हो जाने की तीव्रता
  choice: काम अपने-आप ... आगे बढ़ते जाएँगे
  alternative: उनका काम आसान होगा / उनका काम सफल होगा
  rationale: नियंत्रक साक्ष्य मात्र आसानी या सफलता से अधिक प्रबल, चमत्कारिक सहजता दिखाता है; इसलिए उस प्रलयदर्शी तनाव को बनाए रखा गया है।
- issue: अंतिम वातावरण-सूचक पद का अर्थ
  choice: बड़े चैन से
  alternative: बड़ी शांति में / गहरे विश्राम में
  rationale: यहाँ केवल कुशल उत्पादन नहीं, बल्कि पुनर्स्थापित व्यवस्था की शांत अवस्था भी अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। उपलब्ध सिरिएक पृष्ठ पर अध्याय-सीमा अस्पष्ट है, इसलिए नियंत्रक पाठ-साक्ष्य का उपयोग सावधानी से किया गया है और अर्थ को किसी विशिष्ट सांप्रदायिक व्याख्या की ओर नहीं मोड़ा गया।
