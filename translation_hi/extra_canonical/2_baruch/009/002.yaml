  text: And we tore our garments and wept and mourned and fasted seven days.
translation:
  language: hi
  text: और हमने अपने वस्त्र फाड़े और सात दिन तक रोते, विलाप करते और उपवास करते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܡܐܢ̈ܐ / clothing expression (reconstructed from verse tradition; supplied consultation text: “garments”)'
  choice: वस्त्र
  rationale: ‘वस्त्र’ आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज है तथा शोक के चिह्न के रूप में कपड़े फाड़ने की प्राचीन प्रथा को स्पष्ट रखता है।
- source_word: wept
  choice: रोते
  rationale: साधारण, स्वाभाविक हिन्दी में वास्तविक रोने की क्रिया को व्यक्त करता है।
- source_word: mourned
  choice: विलाप करते
  rationale: ‘रोते’ से अलग शोक की मुखर अभिव्यक्ति को बनाए रखता है और दोनों क्रियाओं का अंतर मिटाता नहीं।
- source_word: fasted
  choice: उपवास करते
  rationale: धार्मिक शोक के संदर्भ में भोजन से विरत रहने के अर्थ का प्रचलित और तटस्थ हिन्दी रूप है।
theological_decisions:
- issue: सात दिनों की समयावधि किन क्रियाओं पर लागू होती है
  choice: ‘सात दिन तक’ को रोने, विलाप करने और उपवास करने की संयुक्त क्रिया-शृंखला से पहले रखा गया
  alternative: 'इसे केवल अंतिम क्रिया से जोड़ना: ‘...और सात दिन उपवास किया’'
  rationale: वाक्य की स्वाभाविक संरचना पूरी शोक-अवधि को सात दिन की बताने देती है, जबकि मूल की संभावित व्याकरणिक सीमा को किसी संकीर्ण धार्मिक अर्थ में नहीं बाँधती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लगातार ‘और’ मूल कथन की बहुक्रियात्मक शोक-लय को बनाए रखता है। उपलब्ध सिरियाई पृष्ठ-पाठ में पद-विभाजन और OCR अत्यंत अस्पष्ट हैं; इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य मानते हुए पाठ-परंपरा में सुरक्षित पद के आशय का स्वाभाविक हिन्दी रूप दिया गया है।
