base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/009/001.yaml
  text: And I, Baruch, came with Jeremiah, whose heart had been found pure from sins, and who had not been taken in the capture of the city. And we rent our garments, wept, mourned, and fasted seven days.
translation:
  language: hi
  text: और मैं, बारूक, यिर्मयाह के साथ आया[a]। उसका हृदय पापों से शुद्ध पाया गया था, और नगर पर अधिकार किए जाने के समय वह बंदी नहीं बनाया गया था। तब हमने अपने वस्त्र फाड़े, रोए, शोक मनाया और सात दिन तक उपवास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का सिरियाई पाठ कठिन है; संभवतः “लौट आया” या “चला गया”।
    reason: गतिसूचक क्रिया की पाठगत और अर्थगत अनिश्चितता को स्पष्ट करना।
lexical_decisions:
- source_word: ܐܬܒܥ
  choice: आया
  rationale: पाठ का यह स्थान अस्पष्ट और प्रतिलिपिगत रूप से कठिन है। अध्याय के प्रसंग तथा नियंत्रक पाठ-परंपरा के आधार पर सामान्य गतिसूचक अर्थ लिया गया है; ‘आया’ संभावित अर्थों में सबसे कम व्याख्यात्मक है।
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  choice: उसका हृदय पापों से शुद्ध पाया गया था
  rationale: यह यिर्मयाह की नैतिक निर्दोषता को नगर के पतन के प्रसंग में व्यक्त करता है। ‘पापों से शुद्ध’ मूल की तीव्रता बनाए रखता है, पर अनुवाद में पूर्ण निष्पापता की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  choice: नगर पर अधिकार किए जाने के समय
  rationale: यह पद नगर के बलपूर्वक लिए जाने की घटना को दर्शाता है। यह हिंदी प्रयोग सैन्य आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ܐܬܚܙܝ
  choice: पाया गया था
  rationale: यहाँ क्रिया केवल दिखाई देने के बजाय किसी के चरित्र के विषय में किए गए आकलन का बोध देती है।
- source_word: ܘܒܩ̈ܝ
  choice: रोए, शोक मनाया
  rationale: शोक की साथ-साथ आई क्रियाओं को अलग रखा गया है, ताकि विलाप-दृश्य का संचयी भार बना रहे।
theological_decisions:
- issue: यिर्मयाह का ‘पापों से शुद्ध’ कहा जाना
  choice: वाक्य यिर्मयाह को नगर के अपराध और उसके विनाश के संदर्भ में निर्दोष बताता है, जबकि मूल की व्यापक अभिव्यक्ति को यथावत रखता है।
  alternative: इसे यिर्मयाह की हर अर्थ में पूर्ण निष्पापता का कथन समझा जा सकता है; अथवा मुख्यतः अनुष्ठानिक शुद्धता का संकेत माना जा सकता है।
  rationale: निकटवर्ती प्रसंग यरूशलेम के पतन और यिर्मयाह के बंदी न बनाए जाने का है। इसलिए प्रसंगगत नैतिक शुद्धता प्रमुख है, पर अनुवाद मूल में मौजूद धर्मवैज्ञानिक तनाव को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। शोक की चारों क्रियाएँ—वस्त्र फाड़ना, रोना, शोक मनाना और उपवास करना—स्पष्ट रूप से सुरक्षित रखी गई हैं।
