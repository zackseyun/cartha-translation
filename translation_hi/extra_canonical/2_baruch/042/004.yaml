  yaml_path: translation/extra_canonical/2_baruch/042/004.yaml
  text: Those who were formerly under subjection and afterward withdrew and mingled themselves with the seed of the mixed peoples—their former time is reckoned as nothing.
translation:
  language: hi
  text: जो लोग पहले अधीन थे, पर बाद में अलग हो गए और मिश्रित जातियों की संतति के साथ मिल गए—उनका पहले का समय कुछ भी नहीं गिना जाता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܩܕܝܡ
  choice: पहले
  rationale: कालसूचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ܐܬܢܣܒܘ
  choice: अलग हो गए
  rationale: इस प्रसंग में पीछे हटने या पूर्व संबंध से निकल जाने का भाव व्यक्त करता है; अंग्रेज़ी परामर्श-पाठ के “withdrew” से भी इसकी पुष्टि होती है।
- source_word: ܒܡܘ̈ܬܐ
  choice: मिली-जुली जातियों
  rationale: यहाँ बहुवचन रूप मिश्रित जनसमुदायों की ओर संकेत करता है; साधारण पाठक के लिए ‘मिली-जुली जातियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: ܐܬܚܫܒܘ
  choice: गिना जाता
  rationale: लेखा या मूल्यांकन में किसी बात को मानने/गिनने का भाव सुरक्षित रखता है।
- source_word: ܩܕܡܝ
  choice: पिछला
  rationale: उनकी पूर्व अवस्था या बीते समय की ओर संकेत; हिन्दी में ‘पिछला समय’ प्रसंगानुकूल और सहज है।
theological_decisions:
- issue: पूर्व अधीनता के समय का मूल्यांकन
  choice: उनका पिछला समय कुछ भी नहीं गिना जाता
  alternative: उनका पूर्व समय निष्फल माना जाता है
  rationale: स्रोत के कठोर ‘कुछ नहीं’ वाले मूल्यांकन को बनाए रखा गया है और ‘निष्फल’ जैसा व्याख्यात्मक धार्मिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। वाक्य की विरोधात्मक गति दिखाने के लिए ‘पर’ और निष्कर्ष से पहले दीर्घ विराम-चिह्न का प्रयोग किया गया है।
