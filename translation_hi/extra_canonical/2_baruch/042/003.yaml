  text: 'And as for what you said concerning those who drew near and those who withdrew, this is the word:'
translation:
  language: hi
  text: और जो तुमने उन लोगों के विषय में कहा जो निकट आए और जो पीछे हट गए, उसके उत्तर में यह वचन है:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का सिरियाई पाठ कठिन है; शब्दशः इसे ‘जो अलग किए गए’ और ‘जो उठा लिए गए’ के अर्थ में भी समझा जा सकता है।
    reason: मूल सिरियाई साक्ष्य और परंपरागत गति-संबंधी अर्थ के बीच वास्तविक पाठगत/अर्थगत अनिश्चितता को पाठक के सामने रखना।
lexical_decisions:
- source_word: ܐܬܦܪܫܘ / ܐܬܢܣܒܘ
  choice: निकट आए / पीछे हट गए
  rationale: प्राप्त सिरियाई पाठ इस स्थान पर कठिन और संभवतः पाठगत रूप से अस्थिर है। अंग्रेज़ी POB में सुरक्षित गति-संबंधी विरोध को स्वाभाविक हिन्दी में रखा गया है, बिना यह निर्धारित किए कि निकटता या दूरी किस व्यक्ति अथवा वस्तु के संबंध में है।
- source_word: ܗܢܘ ... ܡܠܬܐ (अर्थगत सूत्र)
  choice: उसके उत्तर में यह वचन है
  rationale: सूत्रात्मक कथन को आधुनिक हिन्दी में स्पष्ट किया गया है; ‘वचन’ मूल के औपचारिक, घोषणात्मक भाव को बनाए रखता है।
theological_decisions:
- issue: ‘निकट आने’ और ‘पीछे हटने’ का धार्मिक आशय
  choice: किसके निकट आने या किससे पीछे हटने की बात है, इसे अनिर्दिष्ट रखा गया
  alternative: इसे स्पष्ट रूप से परमेश्वर, वाचा या धर्मी समुदाय के निकट आने और उससे दूर होने के रूप में प्रस्तुत करना
  rationale: पद स्वयं संबंध का लक्ष्य स्पष्ट नहीं करता; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसके उत्तर में’ हिन्दी वाक्य-संबंध को स्पष्ट करता है, जबकि ‘वचन’ प्राचीन घोषणात्मक शैली को बनाए रखता है।
