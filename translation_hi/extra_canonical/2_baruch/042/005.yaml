    ܒܟܠ ܙܒܢ. ܐܘ

    ܠܡܘܢ ܡܬܬܚܒܘ ܡܬܬܚܒܝܢ

    ܠܗܘܢ ܕܗܠܝܢ. ܘܐܝܟ

    ܝܠܕܐ ܡܬܝܠܕ ܗܘܝ

