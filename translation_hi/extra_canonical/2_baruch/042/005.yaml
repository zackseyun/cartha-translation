    ܕܐܒܪܗܡ ܠܡܢܘ ܡܟܡܟܐ

    ܗܘܝ ܕܗܠܝܢ. ܠܐܝܠܝܢ

    ܕܡܣܒܪܝܢ ܗܘܘ ܛܒ̈ܬܐ

    ܕܡܩܕܡܐ ܐܡܝܪܢ.

    ܘܠܐܝܠܝܢ ܕܡܢܗܝܢ ܗܘܘ

