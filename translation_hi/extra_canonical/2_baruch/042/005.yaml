base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/005.yaml
  text: But those who formerly did not know life, and afterward came to know it, and mingled with the seed of the people which has separated itself—their former time is also reckoned as nothing.”
translation:
  language: hi
  text: परन्तु जो पहले जीवन को नहीं जानते थे, फिर बाद में उसे जान गए और उन लोगों के वंश के साथ घुल-मिल गए जिन्होंने अपने आपको अलग कर लिया था—उनका पहले का समय भी कुछ नहीं गिना जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ / life (verse continuation; consultation wording)
  choice: जीवन
  rationale: ‘जीवन’ को केवल सांसारिक अस्तित्व तक सीमित किए बिना उसके नैतिक और युगांत-संबंधी अर्थ की सम्भावना बनाए रखता है।
- source_word: ܙܪܥܐ / seed (consultation wording)
  choice: वंश
  rationale: लोगों के सामुदायिक वंश या संतति के अर्थ में आधुनिक हिन्दी का स्वाभाविक शब्द; शाब्दिक ‘बीज’ यहाँ असहज और भ्रामक होता।
- source_word: separated itself
  choice: अपने आपको अलग कर लिया था
  rationale: समुदाय द्वारा किए गए आत्म-पृथक्करण को व्यक्त करता है और यह अनिर्णीत छोड़ता है कि पृथक्करण नैतिक, धार्मिक या सामाजिक था।
- source_word: former time
  choice: पिछला समय
  rationale: उनके जीवन के ज्ञान से पहले की अवधि को सहज हिन्दी में दर्शाता है।
- source_word: reckoned as nothing
  choice: कुछ नहीं गिना जाएगा
  rationale: लेखा या मूल्यांकन की मूल छवि को बनाए रखते हुए कथन के भावी न्याय-संबंधी स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: ‘जीवन’ का आशय
  choice: ‘जीवन’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘सच्चा जीवन’ या ‘अनन्त जीवन’
  rationale: स्रोत की संक्षिप्तता और अर्थगत तनाव बनाए रखने के लिए कोई विशिष्ट धर्मवैज्ञानिक अर्थ नहीं जोड़ा गया।
- issue: पिछले समय का मूल्यांकन
  choice: ‘कुछ नहीं गिना जाएगा’
  alternative: ‘क्षमा कर दिया जाएगा’ या ‘उनके विरुद्ध नहीं गिना जाएगा’
  rationale: पाठ क्षमा या दोषमुक्ति को स्पष्ट रूप से नहीं कहता; इसलिए लेखांकन की अस्पष्ट भाषा को वैसा ही रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास अपनाया गया है। ‘परन्तु’ विरोध को, ‘जा मिले’ समुदाय में सम्मिलित होने को, और दीर्घ विराम अंतिम न्यायात्मक कथन को स्पष्ट करता है। उपलब्ध सिरिएक पृष्ठांश पद की सीमा पर अपूर्ण है, इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य के रूप में सावधानी से उपयोग किया गया है।
