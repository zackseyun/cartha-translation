    ܐܢܐ. ܘܐܒܥܐ ܡܢܟܝ

    ܐܠܐ ܐܢܬܝ ܕܪܝ ܐܢܐ.

    ܡܛܠ ܕܗܘ ܚܙܐ ܐܢܐ

    ܣܓܝ̈ܐܐ ܡܢ ܥܡܟܝ

    ܕܐܢܚܢܢ ܡܢ ܩܝܡܝܗܘܢ

