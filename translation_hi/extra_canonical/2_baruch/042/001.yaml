translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “मैं तुम्हें ये बातें भी दिखाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ... ܐܡܪ
  choice: उत्तर दिया
  rationale: सिरिएक की उत्तर देने और कहने वाली युग्मित अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में संक्षेपित किया गया है; प्रत्यक्ष कथन होने के कारण ‘कहा’ का भाव स्वतः स्पष्ट है।
- source_word: ܐܦ ܗܠܝܢ
  choice: ये बातें भी
  rationale: ܐܦ के समावेशी बल को ‘भी’ और ܗܠܝܢ के बहुवचन संकेत को ‘ये बातें’ से सुरक्षित रखा गया है।
- source_word: show/reveal sense (control-backed reading)
  choice: दिखाऊँगा
  rationale: अंग्रेज़ी POB के जाँचे हुए पाठ और नियंत्रण-साक्ष्य में सुरक्षित भविष्यकालीन अर्थ को सरल, सीधी हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वक्ता द्वारा आगे का प्रकाशन दिखाने की प्रतिज्ञा
  choice: ‘दिखाऊँगा’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘प्रकट करूँगा’ या ‘समझाऊँगा’
  rationale: ‘दिखाऊँगा’ दर्शनात्मक संदर्भ के अनुकूल है और यह अनावश्यक रूप से तय नहीं करता कि अगला प्रकाशन दृश्य होगा, मौखिक होगा, या दोनों।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। सिरिएक की शाब्दिक ‘उत्तर देकर कहा’ संरचना को हिन्दी की सहज ‘उत्तर दिया’ अभिव्यक्ति में प्रस्तुत किया गया है।
