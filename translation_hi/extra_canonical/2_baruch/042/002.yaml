base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/002.yaml
  text: And as for what you said, ‘For whom and for how many will these things be?’ — for those who have believed, there will be the good things spoken beforehand; but for those who despise them, the opposite of these things.
translation:
  language: hi
  text: और जहाँ तक तुम्हारी इस बात का संबंध है, ‘ये बातें किनके लिए और कितने लोगों के लिए होंगी?’—जिन्होंने विश्वास किया है, उनके लिए वे भली बातें होंगी जिनके विषय में पहले ही कहा गया था; पर जो उन्हें तुच्छ समझते हैं, उनके लिए इन बातों का उलटा होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܣܒܪܝܢ
  choice: विश्वास किया है
  rationale: संदर्भ में यह उन लोगों का वर्णन करता है जो पहले से कही गई भली बातों पर भरोसा रखते हैं; आधुनिक हिन्दी में ‘विश्वास किया है’ स्पष्ट और स्वाभाविक है।
- source_word: ܛܒ̈ܬܐ
  choice: भली बातें
  rationale: बहुवचन और व्यापक अर्थ को बनाए रखता है; इसे केवल ‘आशीषें’ कहने से अर्थ अनावश्यक रूप से संकुचित हो जाता।
- source_word: ܕܡܩܕܡܐ ܐܡܝܪܢ
  choice: जिनके विषय में पहले ही कहा गया था
  rationale: पूर्वकथित प्रतिज्ञाओं या बातों का संकेत बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: ܒܡܘܒܠܐ ܕܗܠܝܢ
  choice: इन बातों का उलटा
  rationale: विश्वास करने वालों के लिए कही गई भली बातों के विपरीत परिणाम को संक्षिप्त रूप में बनाए रखता है।
theological_decisions:
- issue: विश्वास करने वालों और तुच्छ समझने वालों के विपरीत परिणाम
  choice: दोनों समूहों और उनके परिणामों के स्पष्ट विरोध को ज्यों का त्यों रखा गया है।
  alternative: ‘उद्धार पाएँगे’ और ‘दण्ड पाएँगे’ जैसे अधिक स्पष्ट धर्मवैज्ञानिक शब्द जोड़ना।
  rationale: मूल कथन परिणाम को ‘भली बातें’ और ‘उनका उलटा’ कहकर व्यक्त करता है; उसे अधिक विशिष्ट बनाना मूल की संयमित और तनावपूर्ण अभिव्यक्ति को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। प्रश्नोक्ति को प्रत्यक्ष कथन के रूप में और उत्तर को संतुलित विरोधात्मक संरचना में प्रस्तुत किया गया है।
