lexical_decisions:
- source_word: ܥܒ̈ܐ
  choice: वन
  rationale: यह एक बड़े, प्रतीकात्मक वृक्ष-समूह का चित्र है; ‘वन’ दर्शन के व्यापक पैमाने को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ܓܦܢ
  choice: दाखलता
  rationale: ‘दाखलता’ आधुनिक हिन्दी में अंगूर की बेल के बाइबिलीय-प्रतीकात्मक अर्थ को स्पष्ट रखती है, पर प्रतीक की व्याख्या पाठ में नहीं जोड़ती।
- source_word: ܡܒܘܥܐ
  choice: सोता
  rationale: यह स्वयं फूटकर बहने वाले जलस्रोत को दर्शाता है। ‘सोता’ हिन्दी में ‘फव्वारा’ की कृत्रिम संरचना का भ्रम टालता है और आगे बहने तथा लहरों में उमड़ने के वर्णन से मेल खाता है।
- source_word: ܐܪܙܐ
  choice: देवदार
  rationale: यह सीरियाई और बाइबिलीय प्रतीक-जगत में स्थापित विशिष्ट वृक्ष-छवि है; साधारण हिन्दी नाम उसी छवि को बनाए रखता है।
- source_word: ܒܫܠܡܐ
  choice: शांतिपूर्वक / शांति से
  rationale: शांत ढंग से निकलने और बाद में प्रचंड शक्ति दिखाने के बीच का जानबूझकर रखा गया तनाव सुरक्षित रहता है।
- source_word: ܚܙܘܐ
  choice: दर्शन
  rationale: यह स्वप्न में दिखाई गई प्रकाशनात्मक दृश्यावली का उपयुक्त, गरिमापूर्ण और प्रचलित हिन्दी शब्द है।
theological_decisions:
- issue: क्या दाखलता और सोते की बाद की व्याख्या को इसी दर्शन में स्पष्ट कर दिया जाए
  choice: मुख्य पाठ में दोनों प्रतीकों को बिना व्याख्या के रखा गया है।
  alternative: दाखलता या सोते को मसीही उपाधि अथवा अध्याय 39 की व्याख्यात्मक भाषा से पहचान देना।
  rationale: कथानक में प्रतीकों की व्याख्या बाद में आती है। यहाँ उसे जोड़ने से दर्शन और उसकी बाद की व्याख्या के बीच का साहित्यिक तथा धर्मवैचारिक तनाव मिट जाता।
- issue: ‘अपने’ और ‘पराए’ पर देवदार के व्यवहार का नैतिक विरोध
  choice: ‘जो तेरा नहीं था’ और ‘जो तेरा था’ की समानांतर संरचना बनाए रखी गई है।
  alternative: इसे सीधे लूट, प्रजा या संपत्ति के किसी एक ऐतिहासिक अर्थ तक सीमित करना।
  rationale: मूल आरोप व्यापक और कुछ हद तक खुला है; अनूदित पाठ उसे किसी एक राजनीतिक या संपत्ति-संबंधी व्याख्या में सीमित नहीं करता।
- issue: अंतिम समय में लौटकर अधिक यातना पाने का कथन
  choice: कठोर भविष्यकालीन न्याय-वचन को उसी तनाव के साथ रखा गया है।
  alternative: ‘लौटने’ को पुनरुत्थान, पुनर्जन्म या किसी विशेष अंतिम-दशा की स्पष्ट व्याख्या में बदलना।
  rationale: पाठ स्वयं लौटने की प्रकृति नहीं समझाता; इसलिए किसी विशिष्ट सांप्रदायिक अंतकाल-विज्ञान को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, किंतु दर्शन के अनुरूप गरिमापूर्ण रखी गई है। दृश्य की तीव्र पुनरावृत्तियाँ—‘देखो’, ‘गिराकर, नष्ट करके और जड़ से उखाड़कर’—संभव सीमा तक सुरक्षित हैं। ‘दाखलता’, ‘सोता’ और ‘देवदार’ जैसे ठोस शब्द प्रतीकों को स्पष्ट रखते हैं, पर उनकी बाद की व्याख्या को समय से पहले पाठ में नहीं लाते। उपलब्ध सीरियाई पृष्ठ-अंश 36:1 के आरंभ तक ही प्रत्यक्ष रूप से पहुँचता है; शेष लंबी पद-इकाई के लिए प्रदत्त, स्रोत-परीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानी से सहारा लिया गया है।
