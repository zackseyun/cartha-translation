  text: And after Manasseh, Amon arose, and in his own time he thought that the Mighty One would not call these things to account.
translation:
  language: hi
  text: मनश्शे के बाद आमोन आया, और अपने समय में उसने सोचा कि पराक्रमी इन बातों का हिसाब नहीं माँगेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘܐ ܗܘ ܐܡܘܢ
  choice: आमोन उठा
  rationale: शाब्दिक अर्थ ‘आमोन हुआ/था’ है; राजाओं के क्रम के संदर्भ में ‘उठा’ उसके सत्ता में आने को स्वाभाविक रूप से व्यक्त करता है, बिना ‘अधर्म किया’ जैसा अस्रोत अर्थ जोड़े।
- source_word: ܘܡܬܚܫܒ
  choice: वह सोचता था
  rationale: यह क्रिया आमोन की भीतरी धारणा या अनुमान को व्यक्त करती है, किसी सार्वजनिक घोषणा को नहीं।
- source_word: ܒܙܒܢܗ
  choice: अपने समय में
  rationale: यह आमोन के अपने काल पर केंद्रित सामयिक अर्थ को सुरक्षित रखता है।
- source_word: ܚܝܒܘܬܐ
  choice: लेखा नहीं लेगा
  rationale: पाठ की कठिन अवस्था में यह न्यायिक उत्तरदायित्व का भाव बनाए रखता है और ‘दण्ड देगा’ जैसे अधिक संकीर्ण अर्थ को आरोपित नहीं करता।
- source_word: ܗܘ̇
  choice: पराक्रमी
  rationale: अंग्रेज़ी परामर्श-पाठ के ‘the Mighty One’ के अनुरूप यह परमेश्वर के लिए इस ग्रंथ में प्रयुक्त उपाधि को गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय की प्रकृति
  choice: लेखा नहीं लेगा
  alternative: दण्ड नहीं देगा
  rationale: मूल के न्यायिक भाव को रखा गया है, पर यह तय नहीं किया गया कि लेखा लेने का परिणाम केवल दण्ड ही होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली अपनाई गई है। ‘पराक्रमी’ को ईश्वरीय उपाधि के रूप में रखा गया है। पूर्व अंग्रेज़ी पादटिप्पणी ‘आमोन ने अधर्म किया’ सीरियाई पाठ से समर्थित नहीं है, इसलिए उसे शामिल नहीं किया गया।
