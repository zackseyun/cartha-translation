  yaml_path: translation/extra_canonical/2_baruch/065/002.yaml
  text: For he committed much impiety, and he killed the righteous, and he perverted the law, and he shed innocent blood, and he polluted the sanctuary, and he caused the people to sin.
translation:
  language: hi
  text: क्योंकि उसने बहुत अधर्म किया, धर्मियों को मार डाला, व्यवस्था को विकृत किया, निर्दोषों का खून बहाया, पवित्रस्थान को अशुद्ध किया और लोगों से पाप करवाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܘܠܐ / ܪܘܫܥܐ
  choice: अधर्म
  rationale: मनश्शे के व्यापक दुष्कर्म और ईश्वर-विरोधी आचरण को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ܙܕܝ̈ܩܐ
  choice: धर्मियों
  rationale: इसका आशय उन लोगों से है जो धर्मी या निर्दोष माने गए; ‘धर्मियों’ से नैतिक-धार्मिक अर्थ बना रहता है।
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: यह केवल सामान्य कानून नहीं, बल्कि धार्मिक व्यवस्था के अर्थ को भी बनाए रखता है।
- source_word: ܕܡܐ ܙܟܝܐ
  choice: निर्दोषों का खून
  rationale: ‘निर्दोष रक्त’ की अपेक्षा आधुनिक हिन्दी में अधिक सहज है और अन्यायपूर्ण हत्या का आशय स्पष्ट रखता है।
- source_word: ܡܩܕܫܐ
  choice: पवित्रस्थान
  rationale: मंदिर-संबंधी पवित्र स्थल के लिए पारंपरिक किंतु समझने योग्य पद है।
- source_word: ܐܚܛܝ
  choice: लोगों से पाप करवाया
  rationale: 'कारक भाव को स्पष्ट करता है: उसने केवल स्वयं पाप नहीं किया, बल्कि दूसरों को भी पाप में लगाया।'
theological_decisions:
- issue: ‘व्यवस्था को विकृत किया’ का आशय
  choice: न्याय अथवा व्यवस्था में हेरफेर करने के व्यापक भाव को खुला रखा गया है।
  alternative: उसने न्याय को तोड़-मरोड़ दिया
  rationale: उपलब्ध पाठ-साक्ष्य और परामर्श-पाठ के बीच शब्दगत अनिश्चितता को किसी एक संकीर्ण विधिक अर्थ में नहीं बाँधा गया।
- issue: ‘पवित्रस्थान’ की पहचान
  choice: सामान्य धार्मिक पद ‘पवित्रस्थान’ रखा गया है।
  alternative: मंदिर
  rationale: स्रोत के पवित्र क्षेत्र/स्थान संबंधी अर्थ को बनाए रखते हुए किसी अधिक विशिष्ट व्याख्या को अनिवार्य नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गंभीर और कथात्मक है। समानांतर क्रियाओं की शृंखला को बनाए रखा गया है, और अनावश्यक सांप्रदायिक शब्दावली से बचा गया है।
