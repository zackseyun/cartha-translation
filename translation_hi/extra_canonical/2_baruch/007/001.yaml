  yaml_path: translation/extra_canonical/2_baruch/007/001.yaml
  text: And after these things I heard that angel say to those angels who were holding the torches, “Now pull down the supports of its walls and overthrow them, lest the enemies boast and say, ‘We ourselves have cast down the wall of Zion, and we have burned the place of the mighty God.’ And stand there in the place where I had been standing before.”
translation:
  language: hi
  text: इन बातों के बाद मैंने उस स्वर्गदूत को उन स्वर्गदूतों से, जो मशालें पकड़े हुए थे, यह कहते सुना, “अब इसकी दीवारों के सहारों को ढीला कर दो और उन्हें ढहा दो, कहीं ऐसा न हो कि शत्रु घमंड करके कहें, ‘हमने ही सिय्योन की दीवार गिराई और सामर्थी परमेश्वर के स्थान को जला दिया।’ वहाँ खड़े हो जाओ, जहाँ मैं पहले खड़ा था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܥܬܗ (मुद्रित/OCR पाठ ܫܒܩܬܗ के स्थान पर नियंत्रित पाठ)
  choice: मैंने … कहते सुना
  rationale: संदर्भ और नियंत्रित पाठ के अनुसार यहाँ सुनने की क्रिया है। यह आगे आने वाले स्वर्गदूत के कथन का स्वाभाविक परिचय देता है; मुद्रित/OCR रूप को अक्षरशः लेने पर ‘मैंने उसे छोड़ दिया’ अर्थ निकलता है, जो वाक्य-संरचना से मेल नहीं खाता।
- source_word: ܠܡܦܐܕ̈ܐ / ܠܡܦܝܕܐ
  choice: मशालें
  rationale: नगर के दहन के दृश्य में ये आग लिए हुए उपकरण हैं। ‘मशालें’ सामान्य पाठक के लिए स्पष्ट है और दृश्य की प्रलयकारी तीव्रता बनाए रखता है।
- source_word: ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  choice: इसकी दीवारों के सहारे
  rationale: पदबंध दीवार को टिकाए रखने वाले संरचनात्मक भागों या उसकी मजबूती की ओर संकेत करता है। ‘सहारे’ अनावश्यक वास्तुशिल्पीय विशिष्टता जोड़े बिना मूल अर्थ रखता है।
- source_word: ܣܚܦܢܝܗܝ
  choice: गिराई
  rationale: क्रिया बलपूर्वक नीचे गिराने या ध्वस्त करने का भाव देती है। शत्रुओं के दावे में ‘गिराई’ स्वाभाविक और प्रभावशाली हिंदी है।
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  choice: सामर्थी परमेश्वर का स्थान
  rationale: यह पदबंध परमेश्वर की शक्ति और उस पवित्र स्थान की महिमा पर बल देता है। ‘सामर्थी परमेश्वर’ स्रोत की उपाधि को गरिमापूर्ण, परिचित हिंदी में रखता है।
- source_word: ܘܐܬܩܝܡܘ (नियंत्रित पाठ; OCR ܘܐܬܩܝܡܘܬ)
  choice: फिर वहाँ खड़े हो जाओ
  rationale: नियंत्रित पाठ इसे बहुवचन आज्ञार्थक के रूप में पढ़ता है; अतः यह बारूक के बारे में कथन नहीं, मशालें पकड़े स्वर्गदूतों को दी गई आज्ञा है।
theological_decisions:
- issue: यरूशलेम के पतन में कर्तृत्व
  choice: दीवार स्वर्गीय आदेश पर स्वर्गदूतों द्वारा गिराई जाती है, इसलिए शत्रु उसकी विजय का अंतिम श्रेय नहीं ले सकते।
  alternative: विनाश का पूरा कर्तृत्व केवल मानवीय शत्रुओं को देना।
  rationale: कथन में स्वर्गदूतों को दीवार गिराने की स्पष्ट आज्ञा इसी उद्देश्य से दी गई है कि शत्रु घमंड न करें। इस प्रकार विनाश को ऊपर से कार्यान्वित न्याय के रूप में प्रस्तुत किया गया है।
- issue: अंतिम वाक्य का वक्ता और भाव
  choice: ‘खड़े हो जाओ’ को उसी स्वर्गदूत की बहुवचन आज्ञा माना गया है।
  alternative: इसे बारूक का कथन मानना—‘मैं वहाँ खड़ा था/मुझे वहाँ खड़ा किया गया।’
  rationale: नियंत्रित स्रोत-पाठ में बहुवचन आज्ञार्थक रूप और ‘जहाँ मैं पहले खड़ा था’ वाली संबंधवाचक रचना उपयुक्त है। इससे उद्धरण पद के अंत तक चलता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, कथात्मक किंतु गरिमापूर्ण रखी गई है। ‘सिय्योन’, ‘स्वर्गदूत’ और ‘सामर्थी परमेश्वर’ जैसे पद धार्मिक संदर्भ की ऊँचाई बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा है।
