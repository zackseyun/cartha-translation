  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दृश्य की जानबूझकर कठिन अभिव्यक्तियाँ—विशेषतः ‘अन्तिम दिन’, स्वर्गदूतों का दायित्व और अदन में इकट्ठा करने वाला अन्तिम वाक्य—व्याख्यात्मक विस्तार से हल नहीं की गईं।
