    और जो अन्तिम दिन एक रूप में दिखाया गया और जिसने समानता धारण की, उसके विषय में जान लो: समय की जाँच की जाएगी, मानवता का माप लिया जाएगा और उसकी शक्ति परखी जाएगी। इसलिए, क्योंकि आदम ने जीवित रहते हुए परमेश्वर से कुछ ऐसी बात सुनी थी जो होने वाली थी, और उसने समझ लिया था कि मृतकों की रिहाई दी जाएगी, और परमेश्वर ने उसे जो आज्ञा दी थी उसे भी उसने समझा था, इसलिए उसने उस पर विचार किया और पाँच विचार गढ़े। क्योंकि उसने अपने आपको दायित्व के अधीन किया और स्वर्गदूतों को भी दायित्व के अधीन किया। और जब उसकी रचना हुई थी, तब उसे कष्टमय जीवन और अग्नि के साथ मूल तत्त्वों का एक दर्शन भी दिखाया गया था। इस प्रकार परमेश्वर ने अदन में, रची गई वस्तुओं की समानता में, इकट्ठा किया।


