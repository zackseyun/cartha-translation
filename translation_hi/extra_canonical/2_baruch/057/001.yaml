- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: संसार का आरम्भ
  rationale: नियंत्रक पाठ-साक्ष्य आदिम आरम्भ या उद्गम की ओर संकेत करता है; ‘नींव’ कहने से रूपक अनावश्यक रूप से निश्चित हो जाता।
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: अपराध
  rationale: यह आदम के आरम्भिक सीमा-उल्लंघन को सामान्य नैतिक दुर्बलता से अधिक स्पष्ट करता है, जबकि अगले वाक्य में ‘पाप’ क्रिया को स्वाभाविक रूप से रखा गया है।
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: मृत्यु को जगा दिया गया
  rationale: क्रिया मृत्यु के सक्रिय हो उठने या जगाए जाने का भाव देती है; इससे मूल की प्रलय-दर्शी छवि बनी रहती है।
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: महानता नीचे गिरने लगी
  rationale: मूल की नीचे की ओर गति और आदम के बाद आई क्षीणता दोनों सुरक्षित रहते हैं।
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: मानवता का माप
  rationale: समय की जाँच और शक्ति की परीक्षा के समानान्तर न्यायिक-समीक्षात्मक अर्थ में ‘माप’ सर्वाधिक उपयुक्त है।
- source_word: ܡܚܝܒܢܘܗܝ
  choice: दायित्व के अधीन किया
  rationale: यह दोष का अनुभव मात्र नहीं, बल्कि अर्जित न्यायिक दायित्व व्यक्त करता है और अस्पष्ट कथन को नरम नहीं करता।
- source_word: ܐܣܛܘܟܣܐ
  choice: मूल तत्त्व
  rationale: यूनानी ऋणशब्द stoicheia का ब्रह्माण्ड-विषयक अर्थ खुला रखते हुए आधुनिक हिन्दी में बोधगम्य अनुवाद है।
theological_decisions:
- issue: पहले काले पानी और आदम की भूमिका
  choice: आदम के अपराध को असमय मृत्यु और पतित मानवीय दशा को सक्रिय करने वाला आरम्भिक अपराध कहा गया है।
  alternative: इसे केवल सामान्य मानव-पाप के प्रतिनिधि उदाहरण के रूप में प्रस्तुत करना।
  rationale: मूल पाठ आदम के कार्य के बाद ब्रह्माण्डीय और मानवीय परिणामों की विस्तृत सूची देता है।
- issue: आदम और स्वर्गदूतों का दायित्व
  choice: आदम ने अपने आपको और स्वर्गदूतों को भी ‘दायित्व के अधीन किया’।
  alternative: स्वर्गदूतों के कठिन उल्लेख को हटाना या केवल आदम को दोषी कहना।
  rationale: सिरिएक का कथन प्रबल और अस्पष्ट दोनों है; अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है।
- issue: मरे हुओं की मुक्ति
  choice: ‘मरे हुओं को मुक्ति दी जाएगी’ के रूप में भावी निष्क्रिय कथन रखा गया है।
  alternative: इसे किसी विशिष्ट पुनरुत्थान-सिद्धान्त या उद्धार-व्यवस्था के रूप में विस्तृत करना।
  rationale: मूल कथन मुक्ति का उल्लेख करता है, पर उसकी रीति या सीमा स्पष्ट नहीं करता।
