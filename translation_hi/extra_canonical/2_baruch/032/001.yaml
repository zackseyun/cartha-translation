  yaml_path: translation/extra_canonical/2_baruch/032/001.yaml
  text: 'But you, if you prepare your hearts so as to sow in them the fruits of the law, it will protect you in that time when the Mighty One shakes the whole creation.


    For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever.


    Therefore we should not grieve so greatly over the evil that has come now, as over that which is to come.'
translation:
  language: hi
  text: 'पर तुम, यदि अपने हृदयों को व्यवस्था के फल बोने के लिए तैयार करोगे, तो वे[a] उस समय तुम्हारी रक्षा करेंगे, जब पराक्रमी सारी सृष्टि को हिलाएगा।


    [क्योंकि थोड़े ही समय बाद सिय्योन की इमारत हिलाई जाएगी, ताकि उसे फिर से बनाया जाए। फिर भी वही इमारत बनी नहीं रहेगी; बल्कि कुछ समय बाद उसे फिर उखाड़ दिया जाएगा, और वह उस समय तक उजाड़ पड़ी रहेगी। उसके बाद उसका महिमा में नवीकरण होना और सदा के लिए स्थापित होना आवश्यक है।][b]


    इसलिए अब जो विपत्ति आ पड़ी है, उस पर हमें उतना अधिक शोक नहीं करना चाहिए, जितना उस विपत्ति पर जो आने वाली है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “तो वह तुम्हारी रक्षा करेगा,” अर्थात व्यवस्था।
    reason: सक्रिय क्रिया का कर्ता निकटवर्ती बहुवचन ‘फल’ समझा जा सकता है, पर व्यापक एकवचन ‘व्यवस्था’ से उसका संबंध भी संभव है।
  - marker: b
    text: इस कोष्ठकबद्ध खंड की अध्याय/पद-सीमा उपलब्ध सीरियाई पृष्ठ-साक्ष्य में अनिश्चित है; नियंत्रक परंपरा इसे इसी प्रसंग में रखती है।
    reason: स्रोत-बकेट की सीमा अनिश्चित है, इसलिए नियंत्रक साक्ष्य में सुरक्षित पाठ को कोष्ठकों में पारदर्शी रूप से प्रस्तुत किया गया है।
lexical_decisions:
- source_word: ܠܒܘܬܟܘܢ / praeparaveritis corda vestra
  choice: अपने हृदयों को तैयार करो
  rationale: यह नैतिक और भीतरी तैयारी के भाव को सहज आधुनिक हिन्दी में रखता है और ‘हृदय’ की मूल छवि बनाए रखता है।
- source_word: ܦܐܪ̈ܐ ܕܢܡܘܣܐ / seminetis in eis fructus legis
  choice: उनमें व्यवस्था के फल बोओ
  rationale: ‘बोना’ और ‘फल’—दोनों कृषि-रूपकों को सुरक्षित रखा गया है। उपलब्ध सीरियाई प्रमाण में ‘फल’ बहुवचन है; ‘व्यवस्था’ covenantal/legal अर्थ को सामान्य ‘भलाई’ में नहीं बदलती।
- source_word: ܢܓܢ / proteget
  choice: वे तुम्हारी रक्षा करेंगे
  rationale: क्रिया को सक्रिय रखा गया है और निकटतम बहुवचन ‘व्यवस्था के फल’ को कर्ता माना गया है। वाक्य की कर्ता-संबंधी अस्पष्टता फुटनोट में सुरक्षित है।
- source_word: Fortis
  choice: सामर्थी
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि का भार बनाए रखता है और हिन्दी में संक्षिप्त, गरिमापूर्ण तथा स्वाभाविक है।
- source_word: concutiat omnem creaturam
  choice: सारी सृष्टि को हिलाएगा
  rationale: ‘सृष्टि’ ब्रह्मांडीय विस्तार को व्यक्त करती है; ‘हिलाएगा’ प्रलयकारी उथल-पुथल को बिना अनावश्यक अतिशयोक्ति के रखता है।
- source_word: aedificatio Sion
  choice: सिय्योन का निर्माण
  rationale: यह नगर/पवित्र-स्थान की निर्मित अवस्था को खुला रखता है और अर्थ को केवल मंदिर या केवल नगर तक सीमित नहीं करता।
- source_word: renovari in gloria
  choice: महिमा में नवीकरण होना
  rationale: पुनर्स्थापन और महिमामय अवस्था दोनों को अलग-अलग स्पष्ट रखता है।
- source_word: perficietur in perpetuum
  choice: सदा के लिए स्थापित होना
  rationale: स्थायी पूर्णता का आशय स्वाभाविक हिन्दी में व्यक्त होता है, बिना इसे नैतिक ‘सिद्धता’ के रूप में सीमित किए।
- source_word: contristari tantopere
  choice: उतना अधिक शोक नहीं करना चाहिए
  rationale: विलाप के स्वर और तुलनात्मक संरचना दोनों को स्पष्ट और सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: न्याय के प्रसंग में ईश्वरीय उपाधि
  choice: ‘सामर्थी’ को परमेश्वर की उपाधि के रूप में रखा गया है।
  alternative: ‘सर्वशक्तिमान’ या ‘बलवान जन’
  rationale: ‘सर्वशक्तिमान’ मूल से अधिक विशिष्ट दार्शनिक अर्थ जोड़ सकता है, जबकि ‘बलवान जन’ हिन्दी में अस्वाभाविक है। ‘सामर्थी’ उपाधि की गरिमा और संक्षिप्तता बनाए रखता है।
- issue: व्यवस्था के फलों द्वारा रक्षा
  choice: सक्रिय क्रिया के साथ ‘फल’ को निकटतम कर्ता माना गया है।
  alternative: ‘व्यवस्था तुम्हारी रक्षा करेगी’ या ‘तुम्हारी रक्षा की जाएगी’
  rationale: सक्रिय व्याकरण को दबाया नहीं गया है; फिर भी व्यवस्था/फल के बीच संभावित कर्ता-संबंध को फुटनोट में स्पष्ट रखा गया है, ताकि धर्मवैज्ञानिक तनाव कृत्रिम रूप से समाप्त न हो।
- issue: सिय्योन के क्रमिक विनाश, पुनर्निर्माण और अंतिम स्थायित्व वाला खंड
  choice: खंड को मुख्य पाठ में कोष्ठकों के भीतर रखा गया है।
  alternative: खंड को निकाल देना या बिना संकेत के पूर्णतः निश्चित पाठ मानना
  rationale: नियंत्रक परंपरा इस महत्वपूर्ण क्रम को सुरक्षित रखती है, पर दिए गए सीरियाई अध्याय-बकेट की सीमा और पृष्ठ-संबंध अनिश्चित हैं। कोष्ठक पाठ को दबाए बिना उसकी पाठगत अनिश्चितता बताते हैं।
