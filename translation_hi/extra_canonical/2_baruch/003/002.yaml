  text: If I have found grace in your sight, let your mercies quickly take my spirit to yourself, that I may go to my fathers and not see the destruction of my mother.
translation:
  language: hi
  text: यदि मुझे आपकी दृष्टि में अनुग्रह मिला है, तो आपकी करुणा मेरी आत्मा को शीघ्र अपने पास ले जाए, ताकि मैं अपने पूर्वजों के पास चला जाऊँ और अपनी माता[a] का विनाश न देखूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मेरी माता” से आशय यरूशलेम है।
    reason: रूपक आधुनिक पाठक के लिए अस्पष्ट हो सकता है, जबकि निकटवर्ती संदर्भ नगर के विनाश का है।
lexical_decisions:
- source_word: ܛܝܒܘܬܐ
  choice: अनुग्रह
  rationale: यहाँ इसका अर्थ परमेश्वर की दृष्टि में कृपा या स्वीकार्यता पाना है; ‘अनुग्रह’ इस विनती के धार्मिक स्वर और शर्तयुक्त कथन दोनों को बनाए रखता है।
- source_word: ܪ̈ܚܡܝܟ
  choice: आपकी करुणा
  rationale: सिरियाई में बहुवचन ‘आपकी करुणाएँ/दया के कार्य’ है; स्वाभाविक आधुनिक हिन्दी में सामूहिक एकवचन ‘आपकी करुणा’ उसी भाव को गरिमापूर्वक व्यक्त करता है।
- source_word: ܪܘܚܝ
  choice: मेरी आत्मा
  rationale: ‘रूह/आत्मा’ यहाँ जीवन को परमेश्वर द्वारा अपने पास ले लिए जाने की विनती में प्रयुक्त है; ‘आत्मा’ स्रोत की धार्मिक और मानवीय अर्थ-छाया को सुरक्षित रखता है।
- source_word: ܐܒ̈ܗܝ
  choice: मेरे पूर्वजों
  rationale: शाब्दिक अर्थ ‘मेरे पितर/पिता’ है; मृत्यु के बाद पिछली पीढ़ियों के पास जाने के आशय को आधुनिक हिन्दी में ‘पूर्वजों’ अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ܐܡܝ
  choice: मेरी माता
  rationale: यह स्त्रीलिंग नगर यरूशलेम के लिए आत्मीय रूपक है; रूपक को मूल पाठ की तरह अनिर्दिष्ट रखते हुए ‘माता’ रखा गया है।
theological_decisions:
- issue: मृत्यु के लिए की गई विनती
  choice: ‘मेरी आत्मा को शीघ्र अपने पास ले जाए’
  alternative: ‘मुझे शीघ्र मृत्यु दे’
  rationale: स्रोत प्रत्यक्ष रूप से आत्मा को परमेश्वर के पास ले जाने की भाषा बोलता है। प्रत्यक्ष ‘मृत्यु दे’ कहना रूपक और परलोक-संबंधी तनाव को अनावश्यक रूप से सपाट कर देता।
- issue: ‘माता’ की पहचान
  choice: मुख्य पाठ में रूपक ‘मेरी माता’ सुरक्षित रखा
  alternative: मुख्य पाठ में ‘यरूशलेम’ कर देना
  rationale: स्रोत यरूशलेम का नाम न लेकर ‘मेरी माता’ कहता है। पहचान को मुख्य पाठ में बदलना मूल की काव्यात्मक और भावनात्मक शक्ति को घटाता; स्पष्टीकरण केवल पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। वाक्य की आरंभिक शर्त—‘यदि मुझे आपकी दृष्टि में अनुग्रह मिला है’—स्रोत के अनुसार स्पष्ट रूप से सुरक्षित है। ‘करुणा’ को स्वाभाविक हिन्दी के लिए सामूहिक एकवचन में रखा गया है, और ‘माता’ का रूपक मुख्य पाठ में अपरिवर्तित है।
