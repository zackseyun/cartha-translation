lexical_decisions:
- source_word: ܚܕܐ
  choice: एक बात
  rationale: स्त्रीलिंग ‘एक’ यहाँ निहित ‘बात/वचन’ की ओर संकेत करता है; हिन्दी में ‘एक बात’ स्वाभाविक और स्पष्ट है।
- source_word: ܐܡܪ ܐܢܐ
  choice: मैं ... कहता हूँ
  rationale: वर्तमानकालीन प्रत्यक्ष कथन को सरल, गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: ܩܕܡܝܟ
  choice: आपके सामने
  rationale: शाब्दिक अर्थ ‘तेरे सामने’ है; ईश्वर के संबोधन में आधुनिक मानक हिन्दी का आदरसूचक रूप चुना गया है।
- source_word: ܡܪܝܐ
  choice: हे प्रभु
  rationale: प्रत्यक्ष संबोधन को ‘हे’ सहित व्यक्त किया गया है; ‘प्रभु’ प्रचलित और तटस्थ धार्मिक पद है।
