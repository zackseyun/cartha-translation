base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/007.yaml
  text: And that they may see concerning this city, because of the evil of her deeds, that this city is like a bitter widow, and that her humiliation is like sweet spoil?”
translation:
  language: hi
  text: और ताकि तुम इस नगर के विषय में देख सको[a] कि उसके हाथों के बुरे कामों के कारण यह नगर एक दुःखभरी विधवा के समान है, और उसका अपमान मीठी लूट के समान है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस नगर से देख सको।”
    reason: ܡܢ के ‘से’ और प्रसंगगत ‘के विषय में’—दोनों संभावित संबंधों को सुरक्षित रखना।
  - marker: b
    text: 'मूल पाठ की वाक्य-रचना अस्पष्ट है; इसका अनुवाद यह भी हो सकता है: “इस नगर के विषय में देख सको—उसके हाथों के बुरे कामों के कारण—इस नगर को एक दुःखभरी विधवा के समान।”'
    reason: दूसरे ‘इस नगर’ और उसके बाद की उपमा का पहले खंड से व्याकरणिक संबंध निश्चित नहीं है।
lexical_decisions:
- source_word: ܡܢ ܗܕܐ ܡܕܝܢܬܐ
  choice: इस नगर के विषय में
  rationale: ܡܢ का मूल अर्थ ‘से’ है, पर यहाँ नगर की दशा को देखने का भाव है; हिन्दी में ‘के विषय में’ प्रसंगानुकूल और स्वाभाविक है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ܒ̈ܝܫܬܗ̇ ܕܐܝܕܝܗ̇
  choice: उसके हाथों के बुरे कामों
  rationale: ‘उसके हाथों की बुराइयाँ’ के सामी मुहावरे को स्पष्ट किंतु चित्रात्मक रूप में रखा गया है।
- source_word: ܡܪܝܪܐ
  choice: दुःखभरी
  rationale: शाब्दिक ‘कड़वी’ हिन्दी में विधवा के लिए अस्वाभाविक है; यहाँ मरार/कटु दशा का भाव ‘दुःखभरी’ से व्यक्त होता है।
- source_word: ܫܘܕܐ ܚܠܝܬܐ
  choice: मीठी लूट
  rationale: विरोधाभासी मूल बिंब को सरल किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: नगर का स्त्रीलिंग मानवीकरण
  choice: विधवा और स्त्रीलिंग सर्वनामों द्वारा बनाए रखा
  alternative: नगर को केवल निर्जीव स्थान मानकर पुल्लिंग में प्रस्तुत करना
  rationale: मूल पाठ नगर को स्त्रीरूप में चित्रित करता है; यह विलाप और अपमान की छवि के लिए महत्त्वपूर्ण है।
- issue: वाक्य की अनिश्चित संरचना
  choice: ‘कि’ लगाकर दोनों उपमाओं को ‘देख सको’ के अधीन रखा
  alternative: दूसरे ‘इस नगर’ को नई स्वतंत्र उपवाक्य-रचना का आरंभ मानना
  rationale: यह हिन्दी में सर्वाधिक संगत अर्थ देता है, पर स्रोत की वाक्य-संरचनात्मक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘मीठी लूट’ जैसे मूल के तीखे विरोधाभास को जानबूझकर बनाए रखा गया है। अंतिम प्रश्नचिह्न पूर्ववर्ती संवाद में चल रहे प्रश्न को दर्शाता है।
