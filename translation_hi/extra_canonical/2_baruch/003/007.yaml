  source_fidelity: 'The rendering retains the principal Syriac elements: the plural addressees, the ambiguous ܡܢ relation (‘से’/‘के विषय में’) with an appropriate note, the evil of the city’s ‘hands,’ the feminine personification of the city, and the deliberately paradoxical comparison of her humiliation to ‘sweet spoil.’ ‘दुःखभरी विधवा’ communicates the contextual force of ܡܪܝܪܐ without suggesting a temperamentally ‘bitter’ widow.'
  naturalness: The Hindi is clear, modern, and suitably elevated. The sequence ‘कि ... यह नगर ... है, और ... है’ makes the compressed Syriac comparative construction readable while retaining the question form inherited from the surrounding speech.
  terminology: ‘नगर,’ ‘बुरे काम,’ ‘विधवा,’ ‘अपमान,’ and ‘लूट’ are appropriate and consistent. The feminine possessives correctly preserve the city’s personification. ‘मीठी लूट’ rightly preserves the source’s striking oxymoron rather than explaining it away.
