  text: 'For these two things are too much for me: I cannot forsake half of your people, nor can my soul bear to see the destruction of my mother.'
translation:
  language: hi
  text: 'क्योंकि ये दोनों बातें मेरे लिए असहनीय हैं: मैं तेरी आधी प्रजा को छोड़ नहीं सकता[a], और न मेरी आत्मा मेरी माता का विनाश देखने को सह सकती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ सिरिएक पाठ कठिन है; इसे इस प्रकार भी पढ़ा जा सकता है: “मैं बहुतों के साथ, अथवा अपनी सभा के साथ, मर नहीं सकता।”'
    reason: प्राप्त सिरिएक में पाठगत अस्पष्टता है और प्रत्यक्ष शब्दरूप मुख्य पाठ से भिन्न अर्थ की संभावना रखते हैं।
lexical_decisions:
- source_word: ܥܡܐ / ܟܢܘܫܬܝ
  choice: प्रजा / सभा
  rationale: मुख्य पाठ में ईश्वर के लोगों के लिए स्वाभाविक और गरिमापूर्ण ‘प्रजा’ रखा गया है; कठिन वैकल्पिक पाठ में ܟܢܘܫܬܝ का अधिक प्रत्यक्ष अर्थ ‘मेरी सभा’ पादटिप्पणी में सुरक्षित है।
- source_word: ܒܒܝܫܬܗ̇ ܕܐܡܝ
  choice: अपनी माता का विनाश
  rationale: शाब्दिक अर्थ ‘मेरी माता की विपत्ति/बुराई’ है, पर नगर-माता के आसन्न उजाड़ के संदर्भ में ‘विनाश’ आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܡܫܟܚܢܐ ܢܦܫܝ
  choice: मेरी आत्मा … नहीं देख सकती
  rationale: स्रोत की आत्मा-विषयक अभिव्यक्ति को बनाए रखते हुए हिंदी में सहने की असमर्थता का भाव स्वाभाविक वाक्य-विन्यास में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वर की प्रजा से अलग होने अथवा कठिन सिरिएक पाठ में उनके साथ मरने का भाव
  choice: मुख्य पाठ में ‘मैं तेरी आधी प्रजा को छोड़ नहीं सकता’
  alternative: ‘मैं बहुतों के साथ, अथवा अपनी सभा के साथ, मर नहीं सकता’
  rationale: प्राप्त सिरिएक पंक्ति पाठगत रूप से कठिन और संभवतः दूषित है। परामर्श-पाठ का अर्थ मुख्य पाठ में रखा गया है, जबकि सिरिएक के प्रत्यक्ष संभावित पठन को पादटिप्पणी में सुरक्षित रखकर अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनात्मक, गरिमापूर्ण शैली रखी गई है। ईश्वर के लिए निकट और पारंपरिक संबोधन ‘तेरी’ तथा समुदाय के लिए सहज ‘प्रजा’ चुना गया है।
