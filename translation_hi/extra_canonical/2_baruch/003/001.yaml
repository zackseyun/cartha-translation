base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/001.yaml
  text: And I said, “O Lord, my Lord, have I come into the world for this, that I should see the evil of my mother? No, my Lord.
translation:
  language: hi
  text: और मैंने कहा, “हे प्रभु, मेरे प्रभु! क्या मैं इसीलिए संसार में आया हूँ कि अपनी माता की विपत्ति देखूँ?[a] नहीं, मेरे प्रभु!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरी माता” से आशय यरूशलेम या सिय्योन है, जिसे यहाँ माता के रूप में चित्रित किया गया है।
    reason: मूल मातृ-रूपक को मुख्य पाठ में सुरक्षित रखते हुए आधुनिक पाठक के लिए उसका संकेत स्पष्ट करना।
lexical_decisions:
- source_word: ܐܬܝܬ ܠܥܠܡܐ
  choice: मैं संसार में आया हूँ
  rationale: नियंत्रक पाठ-साक्ष्य के अनुसार यह वाक्यांश बारूक के संसार में आने की बात करता है; उपलब्ध पृष्ठ के OCR में आया भ्रामक पाठ इसका आधार नहीं बनाया गया।
- source_word: ܒܝܫܬܗ̇
  choice: उस पर आई विपत्ति
  rationale: सिरिएक शब्द यहाँ माता रूपी यरूशलेम पर आई बुराई अथवा दुर्दशा को दर्शाता है। ‘विपत्ति’ आधुनिक हिन्दी में प्रसंग का भाव स्वाभाविक रूप से व्यक्त करती है और अगले पद के अधिक विशिष्ट ‘विनाश’ को समय से पहले नहीं लाती।
- source_word: ܐܡܝ
  choice: अपनी माता
  rationale: मूल का मातृ-रूपक सुरक्षित रखा गया है; इसे मुख्य पाठ में ‘मेरे नगर’ या ‘सिय्योन’ कह देना काव्यात्मक शोक और आत्मीयता को व्याख्यात्मक ढंग से सीमित कर देता।
- source_word: ܡܪܝܐ ܡܪܝܐ
  choice: हे प्रभु, मेरे प्रभु
  rationale: दोहरी पुकार की प्रार्थनापूर्ण तीव्रता और व्यक्तिगत संबोधन दोनों को स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: ‘मेरी माता’ की पहचान
  choice: मुख्य पाठ में मातृ-रूपक को बनाए रखा गया है; पादटिप्पणी में यरूशलेम/सिय्योन का संकेत दिया गया है।
  alternative: मुख्य पाठ में सीधे ‘मेरे नगर’ या ‘सिय्योन’ लिखना।
  rationale: यहूदी विलाप-परंपरा में नगर का माता के रूप में मानवीकरण अर्थपूर्ण है। मूल रूपक को बनाए रखने से शोक और वाचा-संबंधी आत्मीयता दोनों सुरक्षित रहते हैं।
- issue: बारूक के प्रश्न का आशय
  choice: इसे पीड़ाभरा आलंकारिक प्रश्न रखा गया है, जिसमें वह अपने जीवन के उद्देश्य पर विलाप करता है।
  alternative: इसे इस पद में मृत्यु की स्पष्ट प्रार्थना के रूप में प्रस्तुत करना।
  rationale: मृत्यु की स्पष्ट विनती अगले पद में आती है; इस पद में उसे पहले से जोड़ना पदों की प्रगति को धुंधला कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे प्रभु, मेरे प्रभु!’ विलाप की तीव्रता को बनाए रखता है। ‘विपत्ति’ को ‘विनाश’ पर इसलिए चुना गया है कि इस पद के ܒܝܫܬܗ̇ और अगले पद के अधिक विशिष्ट विनाश-सूचक शब्द में अंतर बना रहे।
