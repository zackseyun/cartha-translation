base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/005.yaml
  text: If indeed you destroy your city and give over your sanctuary for a time and scatter your people among the nations so that they may be no more,
translation:
  language: hi
  text: क्योंकि यदि तू सचमुच अपने नगर को नष्ट कर देगा, अपने पवित्रस्थान को कुछ समय के लिए सौंप देगा, और अपने लोगों को राष्ट्रों के बीच तितर-बितर कर देगा, ताकि वे फिर न रहें,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢ ܓܝܪ
  choice: क्योंकि यदि ... सचमुच
  rationale: ܓܝܪ कारणसूचक है और इस सशर्त कथन पर बल भी देता है; हिन्दी में दोनों पहलुओं को स्वाभाविक ढंग से रखा गया है।
- source_word: ܬܘܒܕ ... ܡܕܝܢܬܟ
  choice: अपने नगर को नष्ट कर देगा
  rationale: ܬܘܒܕ का अर्थ नष्ट करना है और ܡܕܝܢܬܟ स्पष्ट रूप से ‘तेरा/अपना नगर’ है।
- source_word: ܬܫܠܡ
  choice: सौंप देगा
  rationale: क्रिया का आशय किसी दूसरे के अधिकार में दे देना है; किसके हाथ सौंपा जाएगा, यह जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: sanctuary
  choice: पवित्रस्थान
  rationale: उपलब्ध सिरियाई पृष्ठ अगली पंक्ति से पहले कट जाता है; लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ में संरक्षित अर्थ के लिए प्रचलित और व्यापक हिन्दी धार्मिक पद चुना गया।
- source_word: scatter your people among the nations
  choice: अपने लोगों को राष्ट्रों में ... तितर-बितर कर देगा
  rationale: निर्वासन और विभिन्न राष्ट्रों के बीच बिखेर दिए जाने का अर्थ स्पष्ट तथा सहज हिन्दी में व्यक्त होता है।
- source_word: so that they may be no more
  choice: कि उनका अस्तित्व ही मिट जाए
  rationale: शाब्दिक ‘वे फिर न रहें’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और लोगों के सामूहिक रूप से समाप्त हो जाने के आशय को बनाए रखता है।
theological_decisions:
- issue: ईश्वर को संबोधन
  choice: ‘तू’ और एकवचन क्रियारूप
  alternative: ‘आप’ और आदरसूचक बहुवचन
  rationale: प्राचीन प्रार्थना की निकटता और सिरियाई के स्पष्ट एकवचन संबोधन को बनाए रखने के लिए गरिमापूर्ण पारंपरिक ‘तू’ चुना गया; इसका उद्देश्य अनादर व्यक्त करना नहीं है।
- issue: पवित्रस्थान को किसके हाथ सौंपा जाना है
  choice: प्राप्तकर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘शत्रुओं के हाथ सौंप देगा’
  rationale: पाठ में प्राप्तकर्ता स्पष्ट नहीं है; ऐतिहासिक संदर्भ के आधार पर ‘शत्रुओं’ को जोड़ना वास्तविक पाठगत अस्पष्टता को अनावश्यक रूप से सुलझा देता।
- issue: लोगों का ‘न रहना’
  choice: सामूहिक अस्तित्व मिटने की संभावना के रूप में रखा
  alternative: केवल राजनीतिक स्वतंत्रता या राष्ट्रीय पहचान का अंत
  rationale: पाठ स्वयं यह निर्धारित नहीं करता कि बात शारीरिक विनाश, राष्ट्रीय अस्तित्व या दोनों की है; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गंभीर और सहज शैली। पद पिछले वाक्य की निरंतरता है, इसलिए अंत में अल्पविराम रखा गया है। उपलब्ध मूल-पृष्ठ पद के बीच में समाप्त होता है; शेष अंश के लिए लेखापरीक्षित अंग्रेज़ी POB परामर्श-पाठ का सहारा लिया गया है, बिना अतिरिक्त व्याख्यात्मक सामग्री जोड़े।
