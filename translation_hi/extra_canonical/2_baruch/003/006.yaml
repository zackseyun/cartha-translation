  text: Or how will one speak of your praise? Or to whom will what is in your law be explained?
translation:
  language: hi
  text: या तेरी स्तुति के विषय में कोई कैसे बोलेगा? या तेरी व्यवस्था में जो कुछ है, वह किसे समझाया जाएगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܚܬܟ (tešbuḥtāk)
  choice: तेरी स्तुति
  rationale: स्रोत में एकवचन भाव है; ‘स्तुति’ स्वाभाविक हिन्दी में परमेश्वर की प्रशंसा और महिमा के कथन दोनों को व्यक्त करती है।
- source_word: ܢܡܘܣܟ (nāmōsāk)
  choice: तेरी व्यवस्था
  rationale: यहाँ ‘व्यवस्था’ ईश्वरीय विधान/शिक्षा के अर्थ को बनाए रखती है और बाइबिलीय हिन्दी में सहज है।
- source_word: ܢܬܦܫܩ (netpaššaq)
  choice: समझाया जाएगा
  rationale: क्रिया के निष्क्रिय अर्थ—व्याख्या या स्पष्टीकरण दिए जाने—को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: परमेश्वर की स्तुति और व्यवस्था के भावी संप्रेषण पर उठे दो प्रश्न
  choice: दोनों प्रश्नों को अलग और अनिर्णीत रखा गया है
  alternative: इन्हें एक कथन में मिलाकर यह निष्कर्ष देना कि कोई भी स्तुति या व्यवस्था को नहीं जान सकेगा
  rationale: स्रोत अलंकारिक प्रश्न प्रस्तुत करता है, पर उसका निहित निष्कर्ष स्पष्ट शब्दों में नहीं बताता; इसलिए धार्मिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल प्रश्नवाचक शैली। परमेश्वर को संबोधन के लिए निकट और काव्यात्मक ‘तेरी’ रखा गया है, जो आसपास की प्रार्थना-भाषा के अनुकूल है।
