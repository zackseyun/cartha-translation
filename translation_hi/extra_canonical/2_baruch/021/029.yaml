translation:
  language: hi
  text: और क्योंकि संसार कुछ समय के लिए रचा गया है,[a] और उसमें रहनेवाले बहुत कष्ट के साथ जीवित रखे जाते हैं,[b] इसलिए बुराई के विषय में आज्ञा दे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “समय के लिए।”'
    reason: समय-संबंधी वाक्यांश संक्षिप्त है और सीमित अवधि तथा सामान्य ‘समय’—दोनों अर्थ-संभावनाएँ रखता है।
  - marker: b
    text: 'या: “बहुत परिश्रम से जीवित रखे जाते हैं।”'
    reason: मूल अभिव्यक्ति कष्ट सहने अथवा कठिन परिश्रम से निर्वाह किए जाने—दोनों की ओर संकेत कर सकती है।
  - marker: c
    text: 'या: “बुराई को आज्ञा दे।” यह वाक्य अगले पद में आगे बढ़ता हुआ भी समझा जा सकता है।'
    reason: ‘बुराई’ और ‘आज्ञा देना’ का व्याकरणिक संबंध तथा पदांत का विराम पाठ में असहज/अस्पष्ट है।
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: यहाँ सृष्ट जगत का सामान्य अर्थ है; आधुनिक हिन्दी में ‘संसार’ स्वाभाविक और व्यापक है।
- source_word: ܙܒܢܐ
  choice: कुछ समय
  rationale: प्रसंग संसार की सीमित अवधि पर बल देता है; केवल ‘समय’ की अपेक्षा ‘कुछ समय’ हिन्दी में अस्थायित्व अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ܥܡܠܐ / source sense represented by ‘trouble’
  choice: कष्ट
  rationale: यह निर्वाह के साथ जुड़े भारी दुःख या कठिन परिश्रम, दोनों की अर्थ-छाया बनाए रखता है।
- source_word: ܦܩܕ
  choice: आज्ञा दे
  rationale: ईश्वर से की गई प्रार्थना में आदेश देने की क्रिया को सीधे और गरिमापूर्ण रूप में व्यक्त करता है।
- source_word: ܒܝܫܬܐ / source sense represented by ‘evil’
  choice: बुराई
  rationale: नैतिक अनिष्ट और विपत्ति के बीच संभावित व्यापकता को बिना अनावश्यक सिद्धान्तगत संकुचन के बनाए रखता है।
theological_decisions:
- issue: संसार की अवधि
  choice: ‘कुछ समय के लिए’ रचा गया
  alternative: ‘समय के लिए’ रचा गया
  rationale: वाक्य को सृष्टि की अस्थायी अवधि के कथन के रूप में रखा गया है; इसे समय की दार्शनिक उत्पत्ति के कथन में नहीं बदला गया।
- issue: बुराई के विषय में ईश्वरीय आज्ञा
  choice: ‘बुराई के विषय में आज्ञा दे’
  alternative: ‘बुराई को आज्ञा दे’ अथवा ‘बुराई के विरुद्ध आज्ञा दे’
  rationale: स्रोत/पाठ-परंपरा का संबंध अस्पष्ट है; अनुवाद यह निश्चित नहीं करता कि बुराई आज्ञा की प्राप्तकर्ता है या आज्ञा का विषय।
- issue: कष्ट में संभाले जाना
  choice: ‘बहुत कष्ट सहते हुए संभाले जाते हैं’
  alternative: ‘बहुत परिश्रम से जीवित रखे जाते हैं’
  rationale: निष्क्रिय निर्वाह और पीड़ा दोनों को बनाए रखा गया है, बिना यह तय किए कि परिश्रम किसका है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण शैली रखी गई है। पद की संक्षिप्त और कुछ हद तक खंडित वाक्यरचना को पूरी तरह समतल नहीं किया गया; मुख्य पाठ को पठनीय बनाने के लिए ‘इसलिए’ जोड़ा गया है, जबकि वास्तविक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
