translation:
  language: hi
  text: तू अपने संकेत से बिजली को आज्ञा देता है, और जो बातें आनेवाली हैं उन्हें तूने ऐसे देखा है मानो वे बीत चुकी हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܙܐ
  choice: बिजली
  rationale: प्रसंग और अंग्रेज़ी परामर्श-पाठ के अनुसार इसे आकाशीय बिजली के अर्थ में लिया गया है।
- source_word: ܦܩܝܕܐ
  choice: आज्ञा देता है
  rationale: मूल धातु आदेश देने या नियुक्त करने का भाव रखती है; यहाँ बिजली पर परमेश्वर के अधिकार को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ܒܪܘܙܝܟ
  choice: अपने संकेत से
  rationale: रहस्य/संकेत से संबंधित शब्द को इस प्रसंग में क्रिया आरम्भ कराने वाले संकेत के रूप में प्रस्तुत किया गया है।
- source_word: ܕܥܬܝ̈ܕܢ
  choice: जो बातें आनेवाली हैं
  rationale: भविष्य में होने वाली वस्तुओं या घटनाओं का सामान्य, व्यापक अर्थ सुरक्षित है।
- source_word: ܕܥܒܪ̈ܝ
  choice: बीत चुकी हों
  rationale: पाठगत रूप ܥܒܪ ‘बीतना’ से है, न कि ܥܒܕ ‘करना’ से; इससे भविष्य और अतीत का कालगत विरोध सुरक्षित रहता है।
theological_decisions:
- issue: भविष्य की घटनाओं के परमेश्वर द्वारा देखे जाने का ढंग
  choice: ‘ऐसे देखा है मानो वे बीत चुकी हों’
  alternative: ‘उन बातों की तरह देखा है जो बीत चुकी हैं’
  rationale: चयनित रूप परमेश्वर के लिए भविष्य की निश्चित और प्रत्यक्ष जानकारी का काव्यात्मक भाव देता है, पर किसी विशिष्ट दार्शनिक समय-सिद्धान्त को स्पष्ट रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनामय, गरिमापूर्ण और सहज शैली। परमेश्वर के लिए निकट संबोधन ‘तू’ रखा गया है, जो मूल के एकवचन संबोधन और हिन्दी भक्ति-भाषा के अनुरूप है।
