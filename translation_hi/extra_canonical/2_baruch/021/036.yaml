translation:
  language: hi
  text: अधोलोक पर मुहर लगा दी जाएᵃ, ताकि अब से वह मरे हुओं को ग्रहण न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܬܚܬܡ
  choice: मुहर लगा दी जाए
  rationale: यह क्रिया ‘मुहर लगाना/बंद कर देना’ व्यक्त करती है; ‘उभारा जाए’ या ‘हलचल मचाई जाए’ अर्थसंगत नहीं है।
- source_word: ܫܝܘܠ
  choice: अधोलोक
  rationale: मृतकों के लोक के लिए स्वाभाविक और अपेक्षाकृत तटस्थ हिन्दी पद; इसे ‘नरक’ कहने से दंड-स्थान का अतिरिक्त अर्थ जुड़ सकता है।
- source_word: ܬܩܒܠ
  choice: ग्रहण न करे
  rationale: मूल क्रिया का अर्थ ‘पाना/स्वीकार करना’ है; ‘अपने पास रखना’ उससे अधिक अर्थ जोड़ता है।
- source_word: ܡܝ̈ܬܐ
  choice: मरे हुओं को
  rationale: मूल के बहुवचन ‘मृत जन’ को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: Sheol की पहचान
  choice: अधोलोक
  alternative: नरक
  rationale: मूल में मृतकों के लोक का उल्लेख है, अनिवार्य रूप से अंतिम दंड के स्थान का नहीं; इसलिए ‘अधोलोक’ मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: वाक्य प्रार्थनात्मक/आज्ञार्थक भाव में है। भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है।
