translation:
  language: hi
  text: देख, क्योंकि केवल तू ही उन सबको सँभाल सकता है[c][a] जो हैं, जो बीत चुके हैं और जो आनेवाले हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सामने रहनेवालों की विनती को।”
    reason: सिरिएक वाक्यांश को अधिक प्रत्यक्ष रूप से पढ़ने पर ‘विनती’ और ‘तेरे सामने’ का अर्थ निकलता है; मुख्य पाठ परामर्श-पाठ की कालगत समानांतर रचना का अनुसरण करता है।
  - marker: b
    text: या, “और उनकी भी जो बीत चुके हैं और जो आनेवाले हैं।”
    reason: संबंधसूचक रचना को पिछले वाक्यांश से जोड़कर पढ़ने की व्याकरणिक संभावना सुरक्षित रखी गई है।
  - marker: c
    text: या, “वहन करना।”
    reason: सिरिएक क्रिया का अधिक शाब्दिक अर्थ दिया गया है।
lexical_decisions:
- source_word: ܚܘܪ
  choice: देख
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; प्रार्थना में ध्यान आकर्षित करने वाला संबोधन बनाए रखता है।
- source_word: ܒܠܚܘܕܝܟ
  choice: केवल तू ही
  rationale: ईश्वर की अनन्य सामर्थ्य पर दिए गए स्रोत-पाठ के बल को स्पष्ट रखता है।
- source_word: ܬܣܒܪ
  choice: सँभाल सकता है
  rationale: क्रिया में ‘सहना/वहन करना’ का भाव है; यहाँ सभी प्राणियों के संबंध में ‘सँभालना’ आधुनिक हिन्दी में स्वाभाविक है और अस्तित्व को थामे रखने का भाव देता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ܕܩܕܡ̈ܝܟ
  choice: जो अस्तित्व में हैं
  rationale: मुख्य पाठ में प्रमाणित परामर्श-पाठ की कालगत त्रयी—वर्तमान, अतीत और भविष्य—को बनाए रखा गया है; सिरिएक का अधिक सीधा ‘तेरे सामने’ संबंधी पाठांतर पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वर द्वारा सबको ‘सँभालने’ का कथन
  choice: अस्तित्व में रहने वालों, बीत चुके लोगों और आनेवालों—तीनों को समेटने वाली खुली कालगत भाषा
  alternative: इसे केवल जीवित लोगों या उद्धार पाए लोगों तक सीमित करना
  rationale: स्रोत ऐसी कोई संप्रदायगत सीमा नहीं लगाता; अतः कथन को सार्वभौमिक और कालगत रूप में रखा गया है।
- issue: ܬܣܒܪ का अर्थ
  choice: सँभाल
  alternative: वहन कर / सहन कर
  rationale: मुख्य पाठ में प्रसंगानुकूल और स्वाभाविक हिन्दी चुनी गई है, पर क्रिया का अधिक शाब्दिक तनाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सहज शैली। ईश्वर के लिए निकटवाची एकवचन ‘तू’ रखा गया है, क्योंकि यह सीधा प्रार्थना-संबोधन है। मुख्य पाठ में संक्षिप्त कालगत समानांतरता रखी गई है और पाठगत/व्याकरणिक अस्पष्टताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
