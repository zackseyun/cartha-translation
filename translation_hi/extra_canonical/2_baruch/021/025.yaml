translation:
  language: hi
  text: यदि संसार के लिए सुरक्षित रखा हुआ[a] उनमें न होता,[b] तो वे अपनी आशा से सांत्वना पाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “संचय करके रखा हुआ।”'
    reason: मूल पद में भविष्य के लिए रखे या संचित किए जाने—दोनों का भाव संभव है।
  - marker: b
    text: 'या: “यदि उनमें वह न होता जो संसार के लिए सुरक्षित रखा गया है।”'
    reason: कठिन स्रोत-वाक्य की वैकल्पिक, अधिक शाब्दिक हिन्दी संरचना।
lexical_decisions:
- source_word: ܕܒ̣ܥܝܕܐ
  choice: सुरक्षित रखा हुआ
  rationale: सिरिएक पद का आशय किसी ऐसी वस्तु से है जो आगे के लिए रखी या संचित है; यह आधुनिक हिन्दी में स्वाभाविक है और भविष्य के लिए आरक्षित होने का भाव बनाए रखता है।
- source_word: ܣܒܪ
  choice: आशा
  rationale: इस मूल से प्रसंगानुसार आशा या प्रत्याशा का भाव निकलता है; यहाँ सांत्वना के आधार के रूप में ‘आशा’ सबसे स्वाभाविक है।
- source_word: ܒܘܝܐ
  choice: सांत्वना पाते
  rationale: यह चयन दिलासा या सांत्वना मिलने का भाव स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शर्तवाचक वाक्य में ‘संसार के लिए सुरक्षित’ वस्तु का संबंध
  choice: ‘संसार के लिए सुरक्षित रखा हुआ’ को शर्तवाचक उपवाक्य का कर्ता रखा गया है।
  alternative: ‘यदि उनमें वह न होता जो संसार के लिए सुरक्षित रखा गया है।’
  rationale: स्रोत-पाठ के कठिन और कुछ अस्पष्ट वाक्य-विन्यास को किसी विशिष्ट अंतकालीन वस्तु या प्रतिफल के रूप में परिभाषित नहीं किया गया; अंग्रेज़ी परामर्श-पाठ की संरचना भी इसी अनिर्दिष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। मूल की अनिर्दिष्ट वस्तु और शर्तवाचक तनाव को बिना धर्मवैज्ञानिक विस्तार के सुरक्षित रखा गया है।
