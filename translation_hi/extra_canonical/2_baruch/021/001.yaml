base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/021/001.yaml
  text: And I went away from there and sat in the valley of Kidron, in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.
translation:
  language: hi
  text: 1 तब मैं वहाँ से चला गया और किद्रोन की घाटी में, धरती की एक गुफा में बैठ गया। वहाँ मैंने अपने प्राण को पवित्र किया। मैंने रोटी नहीं खाई, फिर भी मुझे भूख नहीं लगी; और मैंने पानी नहीं पिया, फिर भी मुझे प्यास नहीं लगी। जैसा उसने मुझे आज्ञा दी थी, मैं सातवें दिन तक वहीं रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  choice: धरती की एक गुफा
  rationale: यह अनुवाद सिरिएक की ठोस और कुछ हद तक दोहरावपूर्ण भूमिगत छवि को बनाए रखता है; केवल ‘गुफा’ कहने से वह विशेष बल मिट जाता।
- source_word: ܢܦܫܐ
  choice: प्राण
  rationale: उपवास और आत्म-समर्पण के प्रसंग में ‘प्राण’ व्यक्ति के भीतरी जीवन और समूचे अस्तित्व—दोनों का संकेत देता है, जबकि ‘आत्मा’ अनावश्यक रूप से अधिक पारिभाषिक लग सकती है।
- source_word: ܩܕܫ
  choice: पवित्र किया
  rationale: क्रिया के अभिषेक अथवा धार्मिक समर्पण के भाव को सीधे बनाए रखा गया है; इसे केवल ‘तैयार किया’ या ‘शुद्ध किया’ कहकर संकुचित नहीं किया गया।
- source_word: ܥܕܡܐ ܠܝܘܡܐ ܕܫܒܥܐ
  choice: सातवें दिन तक
  rationale: कालगत सीमा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और उपवास की अवधि को सात पूरे दिन मानकर अतिरिक्त व्याख्या नहीं करता।
theological_decisions:
- issue: अपने प्राण को पवित्र करने का अर्थ
  choice: ‘मैंने अपने प्राण को पवित्र किया’ के रूप में धार्मिक समर्पण की भाषा बनाए रखना
  alternative: मैंने अपने आपको शुद्ध किया / उपवास के लिए तैयार किया
  rationale: मूल कथन उपवास की क्रियाओं से अधिक व्यापक धार्मिक समर्पण सूचित कर सकता है। अनुवाद उस संभावना को खुला रखता है और किसी विशिष्ट तपस्या-सिद्धांत को आरोपित नहीं करता।
- issue: भूख और प्यास का अभाव
  choice: इसे कथावाचक का सीधा अनुभव मानकर अनूदित करना
  alternative: इसे स्पष्ट रूप से चमत्कारी ईश्वरीय संरक्षण बताना
  rationale: पाठ भूख और प्यास न लगने की बात कहता है, पर उसका कारण स्पष्ट नहीं करता; इसलिए अनुवाद कारण संबंधी धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘किद्रोन की घाटी’ हिन्दी में स्वाभाविक भौगोलिक पद है। ‘धरती की एक गुफा’ जानबूझकर थोड़ा असामान्य रखा गया है ताकि सिरिएक की ठोस भूमिगत छवि बनी रहे।
