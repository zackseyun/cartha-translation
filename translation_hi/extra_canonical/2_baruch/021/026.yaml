translation:
  language: hi
  text: परन्तु क्योंकि वह धरती और धूल से रचा गया था, इसलिए जो कुछ नष्ट हो जाता है[a], वह वहीं से अपने स्थान पर चला जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो कुछ बीत जाता है’।
    reason: स्रोत की गमन/बीतने वाली अभिव्यक्ति का अधिक शाब्दिक विकल्प; मुख्य पाठ संदर्भगत नश्वरता को व्यक्त करता है।
lexical_decisions:
- source_word: 'ܐܪܥܐ / ܥܦܪܐ (reconstructed from the verse’s source reading: ܡܢ ܐܪܥܐ ܘܡܢ ܥܦܪܐ)'
  choice: धरती और धूल
  rationale: दोनों स्रोत पदों का भेद बनाए रखता है और उत्पत्ति 3:19 की सृष्टि एवं वापसी की पृष्ठभूमि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܐܬܒܪܝ
  choice: रचा गया था
  rationale: पुल्लिंग कर्मवाच्य रूप को सुरक्षित रखता है; इसका कर्ता मनुष्य है, धरती नहीं।
- source_word: ‘whatever passes away’ के पीछे का क्षय/गमन-सूचक सिरिएक पद
  choice: जो कुछ मिट जाता है
  rationale: संदर्भ में नश्वरता और धूल में लौटने का भाव है; केवल ‘बीतता है’ समय के बीतने का अर्थ दे सकता है।
- source_word: ܠܐܬܪܗ (sense represented in the consultation layer)
  choice: अपने ही स्थान को
  rationale: ‘अपने स्थान’ की वापसी को बनाए रखता है; ‘ही’ स्वाभाविक हिन्दी में निज स्थान पर बल देता है।
theological_decisions:
- issue: सृष्टि का कर्ता/विषय
  choice: ‘वह’ अर्थात पूर्वसंदर्भ का मनुष्य धरती और धूल से रचा गया
  alternative: ‘धरती धूल से रची गई’
  rationale: स्रोत का पुल्लिंग क्रियारूप मनुष्य को विषय ठहराता है; स्त्रीलिंग ‘धरती’ को विषय बनाना व्याकरण के विरुद्ध होगा।
- issue: मृत्यु के बाद अपने स्थान में जाने का कथन
  choice: स्रोत की स्थानिक और नश्वरता-संबंधी भाषा को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: इसे स्पष्ट रूप से आत्मा, शरीर, अधोलोक या पुनरुत्थान के बारे में कथन बनाना
  rationale: पद स्वयं ऐसी विशिष्ट धर्मवैज्ञानिक पहचान नहीं करता; अतः अस्पष्टता को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली। ‘परन्तु’, ‘रचा गया’ और ‘अपने ही स्थान’ पाठ को प्रार्थनात्मक-साहित्यिक संदर्भ के अनुकूल रखते हैं। अंग्रेज़ी परामर्श-पाठ की दूसरी वैकल्पिक टिप्पणी (‘धरती धूल से रची गई’) स्रोत के पुल्लिंग क्रियारूप से असंगत होने के कारण शामिल नहीं की गई।
