translation:
  language: hi
  text: तू, जिसने अपने संकेत से वायु को आज्ञा दी है और होनेवाली बातों को उन बातों के समान देखा है जिन्हें तू करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܐܪ / ܠܐܙܐ (पाठ/ओसीआर में अस्पष्ट)
  choice: वायु को
  rationale: वाक्य-संदर्भ और प्राचीन पाठ-परंपरा यहाँ ‘वायु’ को कर्म मानती है; यही अर्थ समानांतर अनुवाद-साक्ष्य से भी पुष्ट होता है।
- source_word: ܒܪܘܙܝܟ
  choice: अपने संकेत से
  rationale: इस पद की पाठ-परंपरा इसे ईश्वरीय संकेत अथवा इशारे द्वारा आदेश देने के अर्थ में समझती है; ‘अपने’ संबंधसूचक प्रत्यय को व्यक्त करता है।
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: होनेवाली बातों को
  rationale: यह भविष्य में घटित होनेवाली वस्तुओं या घटनाओं के लिए स्वाभाविक और अर्थसंगत हिन्दी है।
- source_word: ܐܝܟ ܐܝܠܝܢ ܕܥܒ̣ܕ ܐܢܬ
  choice: मानो तू उन्हें कर ही रहा हो
  rationale: स्रोत में उपस्थित तुलनात्मक उपवाक्य को बनाए रखता है। ‘कर ही रहा हो’ वर्तमान क्रिया की जीवंतता और भावी घटनाओं पर परमेश्वर की प्रत्यक्ष दृष्टि दोनों व्यक्त करता है।
theological_decisions:
- issue: भावी घटनाओं और परमेश्वर के कार्य के बीच संबंध
  choice: होनेवाली बातों को ऐसे देखा मानो तू उन्हें कर ही रहा हो
  alternative: होनेवाली बातों को उन बातों के समान देखा जिन्हें तू करता है
  rationale: स्रोत की तुलना को सुरक्षित रखा गया है, पर इसे यह कहकर कठोर नियतिवाद में नहीं बदला गया कि प्रत्येक भावी घटना सीधे परमेश्वर द्वारा कराई जाती है।
- issue: अंतिम तुलनात्मक उपवाक्य की प्रामाणिकता
  choice: उपवाक्य को मुख्य पाठ में रखा गया
  alternative: ‘और होनेवाली बातों को देखा’ पर पद समाप्त करना
  rationale: दिए गए सिरियाई स्रोत में ܐܝܟ ܐܝܠܝܢ ܕܥܒ̣ܕ ܐܢܬ स्पष्ट रूप से उपस्थित है; इसलिए नवीनतम अंग्रेज़ी संशोधन द्वारा इसे हटाना स्रोत-संगत नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-भाषा। परमेश्वर को निकट संबोधन में ‘तू’ कहा गया है, और वाक्य को सामान्य पाठक के लिए सहज रखते हुए स्रोत की भविष्य-दृष्टि संबंधी तुलना सुरक्षित रखी गई है।
