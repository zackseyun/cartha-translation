translation:
  language: hi
  text: और तू उन लोगों की संख्या जानता है जो गुज़र जाते हैं, और उनकी भी जो बने रहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܝܕܥ ܐܢܬ (w-yādaʿ ant)
  choice: और तू … जानता है
  rationale: संयोजक ‘और’, स्पष्ट द्वितीय-पुरुष कर्ता और वर्तमान अर्थ को बनाए रखा गया है।
- source_word: ܡܢܝܢܐ (menyānā)
  choice: संख्या
  rationale: यह ‘गिनती/संख्या’ का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ܕܥܒܪܝܢ (d-ʿābrīn)
  choice: जो गुज़र जाते हैं
  rationale: मूल क्रिया के ‘गुज़रना/बीतना’ अर्थ को रखा गया है; इसे केवल ‘मर जाना’ बनाकर संभावित व्यापक अर्थ को सीमित नहीं किया गया।
- source_word: ܘܕܡܩܘܝܢ (w-d-maqwin)
  choice: और … जो बने रहते हैं
  rationale: यह पहले समूह के विपरीत टिके या शेष रहने वालों को व्यक्त करता है और मूल विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: गुज़र जाने और बने रहने वालों की पहचान
  choice: दोनों समूहों को सामान्य और अनिर्दिष्ट रखा गया है
  alternative: इन्हें क्रमशः मृत और जीवित लोग कहना
  rationale: मूल पाठ गति/क्षणभंगुरता और बने रहने का विरोध प्रस्तुत करता है, पर यहाँ समूहों की धार्मिक पहचान स्पष्ट नहीं करता; इसलिए अनावश्यक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: प्रार्थना-संदर्भ के अनुरूप परमेश्वर के लिए एकवचन ‘तू’ रखा गया है। भाषा आधुनिक, सहज और गरिमापूर्ण है; समानांतर संरचना को ‘और उनकी भी’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
