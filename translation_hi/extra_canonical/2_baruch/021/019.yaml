  text: Therefore, the one who lives is not gladdened in his life. And I considered the sons of men, and I saw that they were not many and were nothing but the vanity of Adam.
translation:
  language: hi
  text: इसलिए जो जीवित है, वह अपने जीवन में आनन्दित नहीं होता।[a] तब मैंने मनुष्यों की सन्तान पर विचार किया और देखा कि वे बहुत नहीं थे और आदम की व्यर्थता के सिवा कुछ नहीं थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो जीवित है, वह जब तक उसका जीवन बना रहता है, आनन्दित नहीं होता।”
    reason: सिरियाई पदबंध को अवस्थागत (‘अपने जीवन में’) अथवा कालगत (‘जब तक जीवन बना रहता है’) समझा जा सकता है।
lexical_decisions:
- source_word: ܒܚܝܘܗܝ
  choice: अपने जीवन में
  rationale: पूर्वसर्ग सहित इस पद का स्वाभाविक हिन्दी रूप है और यह जीवन के भीतर आनन्दित होने के भाव को बनाए रखता है।
- source_word: ܒ̈ܢܝܢ / sons of men
  choice: मनुष्यों की सन्तान
  rationale: सेमिटिक अभिव्यक्ति के सामूहिक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ܣܪܝܩܘܬܗ ܕܐܕܡ / vanity of Adam
  choice: आदम की व्यर्थता
  rationale: ‘व्यर्थता’ नश्वरता, निष्फलता और खोखलेपन की अर्थ-सीमा को बिना किसी एक व्याख्या तक सीमित किए सुरक्षित रखती है।
- source_word: ܠܐ ... ܐܠܐ / not ... except
  choice: के सिवा कुछ नहीं
  rationale: यह सिरियाई निषेधात्मक मुहावरे का सही अर्थ है; इसे ‘दूसरे’ के रूप में पढ़ना भ्रामक होगा।
theological_decisions:
- issue: ‘आदम की व्यर्थता’ का आशय
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: आदम के कारण आई नश्वरता / आदम की निष्फल दशा
  rationale: पाठ स्वयं यह तय नहीं करता कि संकेत आदम की नश्वरता, पतित दशा या समस्त मानव जीवन की क्षणभंगुरता की ओर है; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गम्भीर प्रार्थनात्मक-ज्ञानसाहित्यिक शैली रखी गई है। ‘आनन्दित’, ‘सन्तान’ और ‘व्यर्थता’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की गरिमा और अस्पष्टता बनाए रखते हैं।
