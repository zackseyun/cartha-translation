translation:
  language: hi
  text: क्योंकि उनमें क्या दिखाई देता है? या कौन-सी आशा दिखाई देती है? या कौन-सा दिखाई देने वाला निवास व्यर्थ नहीं है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visible (English consultation layer; underlying verse wording not securely isolated in the supplied Syriac chapter bucket)
  choice: दिखाई देने वाला / दिखाई देता है
  rationale: तीनों प्रश्नों में दृश्यता की पुनरावृत्ति बनाए रखते हुए सामान्य आधुनिक हिन्दी का प्रयोग किया गया है।
- source_word: dwelling
  choice: निवास
  rationale: यह शब्द रहने के स्थान या ठिकाने—दोनों संभावित अर्थों को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: vanity
  choice: व्यर्थ
  rationale: रूपक को किसी विशिष्ट दार्शनिक या सांप्रदायिक अर्थ में सीमित किए बिना निस्सारता और निष्फलता का भाव देता है।
theological_decisions:
- issue: दृश्य वस्तुओं, आशा और निवास के विषय में अलंकारिक प्रश्न
  choice: तीनों प्रश्नों को खुला और नकारात्मक प्रत्याशा वाला रखा गया है
  alternative: इन्हें स्पष्ट कथनों में बदलना, जैसे ‘कुछ भी स्थायी नहीं है’
  rationale: मूल की प्रश्नात्मकता और अंतर्निहित तनाव को बनाए रखना उचित है; व्याख्यात्मक निष्कर्ष पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उपलब्ध सिरिएक सामग्री अध्याय-स्तरीय पृष्ठ-संग्रह है और उसमें लक्षित पद स्पष्ट रूप से पृथक नहीं हो पाया; इसलिए अंग्रेज़ी POB परामर्श-पाठ की संरचना और पुनरावृत्ति को सावधानी से सुरक्षित रखा गया है।
