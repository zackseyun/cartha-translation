translation:
  language: hi
  text: इसके बाद मैं उस स्थान पर आया जहाँ तूने मुझसे बात की थी,[a] और धरती की गुफा में बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जहाँ तूने वहाँ मुझसे बात की थी।”
    reason: सीरियाई में स्थानवाचक संबंधसूचक पद के साथ ‘वहाँ’ भी आया है; मुख्य पाठ में हिन्दी की अनावश्यक पुनरुक्ति से बचते हुए इसे टिप्पणी में सुरक्षित रखा गया है।
lexical_decisions:
- source_word: ܘܡܢ ܒܬܪܗܝܢ
  choice: इसके बाद
  rationale: यह पद को पिछले प्रसंग से जोड़ता है। स्त्रीलिंग बहुवचन प्रत्यय का स्वाभाविक हिन्दी अर्थ संदर्भानुसार ‘इसके बाद’ है।
- source_word: ܠܐܬܪܐ
  choice: उस स्थान पर
  rationale: निश्चित स्थान का संकेत बनाए रखने के लिए ‘उस स्थान’ चुना गया।
- source_word: ܡܠܠܬ ܥܡܝ
  choice: तूने मुझसे बात की थी
  rationale: शाब्दिक अर्थ ‘मेरे साथ बोला’ है; आधुनिक हिन्दी में ‘मुझसे बात की’ अधिक स्वाभाविक और अर्थनिष्ठ है।
- source_word: ܒܡܥܪܬܐ ܕܐܪܥܐ
  choice: धरती की गुफा में
  rationale: प्राप्त पाठ में अक्षर-पहचान अस्पष्ट है, पर नियंत्रक पाठ और वाक्य-संदर्भ ‘धरती की गुफा’ का समर्थन करते हैं।
