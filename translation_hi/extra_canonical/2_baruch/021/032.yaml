translation:
  language: hi
  text: वे जो है उसे देखते हैं, पर जो होने वाला है उसे नहीं देखते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܢ / ܚܙܝܬ (दृष्टि-संबंधी धातु)
  choice: देखते हैं
  rationale: प्रत्यक्ष देखने या पहचानने का सामान्य अर्थ स्वाभाविक हिन्दी में रखा गया है; अंग्रेज़ी परामर्श-पाठ भी यही अर्थ-संरचना प्रमाणित करता है।
- source_word: होने/विद्यमान होने की विरोधी अभिव्यक्तियाँ
  choice: जो है … जो होने वाला है
  rationale: वर्तमान वास्तविकता और भावी घटना के बीच का संक्षिप्त विरोध बनाए रखा गया है। ‘जो होने वाला है’ साधारण हिन्दी में भविष्यसूचक अर्थ को स्पष्ट करता है, बिना यह तय किए कि वह नियति, भविष्यवाणी या केवल आगामी घटना है।
theological_decisions:
- issue: भविष्य के ज्ञान की प्रकृति
  choice: ‘जो होने वाला है’
  alternative: ‘भविष्य में क्या होगा’
  rationale: चुनी हुई अभिव्यक्ति मूल कथन की संक्षिप्त और कुछ हद तक खुली प्रकृति बनाए रखती है; यह भविष्यज्ञान के किसी विशेष धर्मशास्त्रीय सिद्धांत को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। समानांतर संरचना को स्पष्ट रखने के लिए दूसरे खंड में ‘देखते’ दोहराया गया है। उपलब्ध सिरियाई सामग्री अध्याय-स्तरीय पृष्ठ-बकेट है और पद-सीमा प्रत्यक्ष रूप से सुनिश्चित नहीं है; इसलिए अंग्रेज़ी POB को नियंत्रित परामर्श-साक्ष्य के रूप में लेते हुए कथन की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
