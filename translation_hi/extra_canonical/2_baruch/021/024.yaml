translation:
  language: hi
  text: और यह कैसे प्रकट किया गया, यदि बाद में वे इसे नहीं समझते?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܓܠܝ (अंग्रेज़ी परामर्श-पाठ से संभावित अर्थ; दिए गए पृष्ठांश में पद-सीमा अनिश्चित)
  choice: प्रकट किया गया
  rationale: कर्मवाच्य अर्थ को बनाए रखता है और यह नहीं बताता कि प्रकट करने वाला कौन था।
- source_word: ܡܢ ܒܬܪ / पश्चात्-अर्थक पदबंध
  choice: बाद में
  rationale: कालक्रम को साधारण, आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ܠܐ ... ܡܣܬܟܠܝܢ / न समझने का भाव
  choice: समझते ही नहीं
  rationale: निषेध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ही’ प्रश्न में निहित विरोधाभास पर हल्का बल देता है।
theological_decisions:
- issue: प्रकाशन के कर्ता की पहचान
  choice: कर्मवाच्य ‘प्रकट किया गया’ रखकर कर्ता को अनिर्दिष्ट रखा गया।
  alternative: ‘परमेश्वर ने इसे कैसे प्रकट किया’
  rationale: मूल कथन में यदि कर्ता व्यक्त नहीं है, तो परमेश्वर को स्पष्ट कर्ता बनाना अनावश्यक व्याख्यात्मक जोड़ होगा।
- issue: प्रश्न का तर्कगत तनाव
  choice: ‘यदि’ के साथ वास्तविक प्रश्न के रूप में रखा गया।
  alternative: ‘जब बाद में वे नहीं समझते, तो वह कैसे प्रकट हुआ?’
  rationale: ‘जब’ निष्कर्ष को अधिक निश्चित कर देता; ‘यदि’ मूल की शर्तात्मक अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। उपलब्ध सिरिएक अध्याय-पृष्ठ में पद 24 की सीमा स्पष्ट रूप से पृथक नहीं है, इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य के रूप में लेते हुए उसके कर्मवाच्य, शर्त और प्रश्नात्मक तनाव को सुरक्षित रखा गया है।
