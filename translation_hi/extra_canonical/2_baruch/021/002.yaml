translation:
  language: hi
  text: इसके बाद मैं उस स्थान पर आया, जहाँ तूने मुझसे बात की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪܗܝܢ
  choice: इसके बाद
  rationale: शाब्दिक अर्थ ‘इन बातों/घटनाओं के बाद’ है; हिन्दी में संदर्भ को स्वाभाविक और संक्षिप्त रखने के लिए ‘इसके बाद’ चुना गया।
- source_word: ܐܬܪܐ
  choice: स्थान
  rationale: इसका सामान्य अर्थ ‘जगह/स्थान’ है; प्रार्थनात्मक साहित्य की गरिमा के अनुरूप ‘स्थान’ चुना गया।
- source_word: ܡܠܠܬ ܥܡܝ
  choice: तूने मुझसे बात की थी
  rationale: सीरियाई क्रिया द्वितीय पुरुष एकवचन है और वक्ता परमेश्वर को सीधे संबोधित कर रहा है; इसलिए अंग्रेज़ी परामर्श-पाठ के ‘he’ के बजाय स्रोत-सम्मत ‘तूने’ रखा गया।
theological_decisions:
- issue: वक्ता द्वारा संबोधित व्यक्ति की पहचान और पुरुष
  choice: प्रत्यक्ष संबोधन ‘तूने’
  alternative: ‘उसने’
  rationale: मूल सीरियाई में क्रिया द्वितीय पुरुष एकवचन है। निकटवर्ती प्रार्थना-संदर्भ भी परमेश्वर से प्रत्यक्ष संबोधन दिखाता है; इसलिए तीसरे पुरुष में बदलना स्रोत की वाक्य-रचना और प्रार्थनात्मक स्वर दोनों को खो देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। परमेश्वर के प्रत्यक्ष संबोधन के लिए पारंपरिक एकवचन ‘तू’ रखा गया है। मूल में स्थान-सूचक भाव की पुनरावृत्ति (‘उस स्थान… वहाँ’) हिन्दी में अनावश्यक लगती है, इसलिए उसे एक ही संबंधवाचक वाक्य में स्वाभाविक रूप से व्यक्त किया गया है।
