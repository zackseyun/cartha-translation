translation:
  language: hi
  text: क्योंकि पहले की वे बातें भी जो बीत चुकी हैं, उनके सभी स्वामियों[a] और उनकी स्मृति समेत, तुझसे दूर नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके सभी स्वामी”। संदर्भ में, “उनसे संबंधित सभी लोग” भी समझा जा सकता है।
    reason: सीरियाई ܡܪܝܗܝܢ के शाब्दिक ‘स्वामी/possessors’ अर्थ को सुरक्षित रखते हुए उसका संभावित संदर्भगत आशय स्पष्ट करता है।
lexical_decisions:
- source_word: ܩܕ̈ܡܝܬܐ
  choice: पुरानी बातें
  rationale: यह पद बीती हुई पूर्वकालीन बातों की ओर संकेत करता है; ‘अपराध’ कहना संदर्भ में अनावश्यक अपराध-बोध जोड़ देगा।
- source_word: ܕܫܠܝܢ
  choice: बीती हुई
  rationale: संदर्भ में उन बातों के समाप्त हो जाने या गुजर चुकने का भाव है।
- source_word: ܡܪܝܗܝܢ
  choice: उनसे जुड़े सभी लोग
  rationale: शाब्दिक अर्थ ‘उनके स्वामी/अधिकारी’ है, पर यहाँ पूर्वकालीन बातों से संबंधित व्यक्तियों का भाव है; यह चयन आधुनिक हिन्दी में स्वाभाविक है और ‘अपराधी’ का अनुचित अर्थ नहीं जोड़ता।
- source_word: ܕܘܟܪܢܐ
  choice: उनकी स्मृति
  rationale: मूल के ‘स्मरण/स्मृति’ अर्थ को सीधे बनाए रखता है।
theological_decisions:
- issue: ईश्वर के ज्ञान से अतीत का दूर न होना
  choice: ‘तुझसे दूर नहीं हैं’
  alternative: ‘तेरे ज्ञान से बाहर नहीं हैं’
  rationale: मूल की स्थानात्मक अभिव्यक्ति और उसके काव्यात्मक-धर्मवैचारिक तनाव को बनाए रखा गया है; ‘ज्ञान से बाहर’ अर्थ को अधिक स्पष्ट करके सीमित कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली; ईश्वर के लिए एकवचन आत्मीय संबोधन ‘तुझसे’ रखा गया है।
