translation:
  language: hi
  text: क्योंकि उसके राज्य में मनुष्यों की मृत्यु दिखाई देती है। और वास्तव में ऐसा क्या है[a] जिसका[b] अंत ज्ञात नहीं है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वास्तव में ऐसा क्या अस्तित्व में है”।
    reason: अस्तित्वसूचक अभिव्यक्ति को अधिक प्रत्यक्ष रूप से प्रस्तुत करने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: या, “ऐसा क्या अस्तित्व में है जिसका अंत ज्ञात नहीं है?”
    reason: अस्तित्वसूचक पद और संबंधवाचक उपवाक्य के सीधे जुड़ाव को दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ܡܠܟܘܬܗ
  choice: उसके राज्य में
  rationale: राजत्व/राज्य के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और पुरुषवाचक सर्वनाम की स्रोतगत अनिर्दिष्टता बनाए रखता है।
- source_word: ܒ̈ܢܝ ܐܢܫܐ
  choice: मनुष्यों की संतानों
  rationale: सेमिटिक पदबंध ‘मनुष्यों के पुत्र’ का अर्थ समावेशी और सहज आधुनिक हिन्दी में देता है, बिना उसे केवल पुरुषों तक सीमित किए।
- source_word: ܡܘܬܐ
  choice: मृत्यु
  rationale: स्रोत के अमूर्त संज्ञा-रूप के अनुरूप गरिमापूर्ण और सीधा विकल्प।
- source_word: ܐܝܬ
  choice: है
  rationale: अस्तित्वसूचक प्रश्न को हिन्दी में स्वाभाविक रखते हुए उसके दार्शनिक भार को बनाए रखता है।
- source_word: ܚܪܬܐ
  choice: अंत
  rationale: समापन या अंतिम परिणति की स्रोतगत व्यापकता को संक्षिप्त रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसके राज्य’ में सर्वनाम का संदर्भ
  choice: सर्वनाम को ‘उसके’ ही रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर के राज्य’ कहना
  rationale: इस पद में निहित संदर्भ को नाम जोड़कर धार्मिक रूप से अधिक निश्चित नहीं किया गया।
- issue: अंत के अज्ञात होने का प्रश्न
  choice: प्रश्नात्मक और खुला कथन बनाए रखा गया
  alternative: इसे सार्वभौमिक नश्वरता के स्पष्ट सिद्धांत के रूप में व्याख्यायित करना
  rationale: स्रोत की अलंकारिक तथा दार्शनिक तनातनी को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘मनुष्यों की संतानों’ से सेमिटिक अभिव्यक्ति का अर्थ सामान्य पाठक के लिए स्पष्ट और समावेशी बनाया गया है। प्रश्न की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
