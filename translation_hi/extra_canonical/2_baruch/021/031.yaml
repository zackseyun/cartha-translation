translation:
  language: hi
  text: क्योंकि मनुष्य की आत्मा संसार पर शासन करती है,[a] फिर भी लोग नहीं जानते कि उससे क्या संबंधित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार की भीड़ मनुष्य की आत्मा है।”
    reason: सीरियाई पदबंध की पूर्ववर्ती वैकल्पिक व्याख्या को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ܪܘܚ
  choice: आत्मा
  rationale: यहाँ मनुष्य के अभौतिक, चेतन पक्ष के लिए हिन्दी का स्वाभाविक और गरिमापूर्ण शब्द है।
- source_word: ܡܕܒܪܢܘܬܐ / disputed governing expression
  choice: शासन करती है
  rationale: संदर्भ और पाठ-समीक्षा में निहित शासन/प्रबंध के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; संज्ञात्मक ‘शासक’ की अपेक्षा वाक्य अधिक सहज रहता है।
- source_word: ܥܠܡܐ
  choice: संसार
  rationale: इस प्रसंग में विश्व या मानव-जगत के व्यापक अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मनुष्य की आत्मा और संसार के बीच शासन-संबंध
  choice: ‘मनुष्य की आत्मा संसार पर शासन करती है’—दावे को पाठ के अनुसार बिना व्याख्यात्मक सीमांकन के रखा गया है।
  alternative: ‘मनुष्य की आत्मा संसार की प्रबंधक/शासक है’
  rationale: मूल कथन की प्रबल मानवशास्त्रीय धारणा और उसका तनाव सुरक्षित रखा गया है; इसे परमेश्वर की सार्वभौमिकता से सामंजस्य बैठाने के लिए कमजोर नहीं किया गया।
- issue: वैकल्पिक पाठ/अर्थ
  choice: मुख्य पाठ में शासन का अर्थ, और पादटिप्पणी में ‘संसार की भीड़’ वाला अर्थ
  alternative: मुख्य पाठ में ‘संसार की भीड़ मनुष्य की आत्मा है’
  rationale: उपलब्ध समीक्षा शासन/प्रबंध वाले अर्थ को अधिक संगत मानती है, किंतु पूर्ववर्ती अस्पष्ट पाठ-संभावना को पादटिप्पणी में सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘उससे क्या संबंधित है’ जानबूझकर व्यापक रखा गया है, ताकि मूल कथन की संदर्भगत अस्पष्टता बनी रहे।
