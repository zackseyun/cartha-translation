translation:
  language: hi
  text: समयों का क्रम[a] केवल तू ही जानता है, और तू विचलित नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समयों की शिक्षा” अथवा “समयों का निर्देश।”
    reason: सिरिएक ܝܘܠܦܢܐ का मूल अर्थ ‘शिक्षा/निर्देश’ है, जबकि इस संदर्भ में ‘क्रम/व्यवस्था’ अधिक स्वाभाविक अर्थ हो सकता है।
lexical_decisions:
- source_word: ܝܘܠܦܢܘܗܝ ܕܙܒ̈ܢܐ
  choice: समयों का क्रम
  rationale: ܝܘܠܦܢܐ का सामान्य अर्थ ‘शिक्षा/निर्देश’ है, पर यहाँ ‘समयों’ के साथ यह उनके नियत क्रम या संचालन की ओर संकेत करता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘क्रम’ रखा गया है और शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ܟܕ ܠܐ ܢܬܬܙܝܥ
  choice: और तू विचलित नहीं होता
  rationale: मूल पदबंध का भाव ‘बिना हिले/विचलित हुए’ है। इसे हिन्दी में स्पष्ट स्वतंत्र उपवाक्य के रूप में रखा गया है, ताकि यह ‘जानने’ की रीति के बजाय संबोधित परमेश्वर की अचलता बताए।
- source_word: ܐܢܬ ܒܠܚܘܕܝܟ ܝ̣ܕܥܬ
  choice: केवल तू ही जानता है
  rationale: ܒܠܚܘܕܝܟ की विशिष्टता और द्वितीय पुरुष एकवचन संबोधन दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘समयों’ से संबंधित संज्ञा का अर्थ
  choice: क्रम
  alternative: शिक्षा/निर्देश
  rationale: संदर्भ परमेश्वर द्वारा युगों या समयों की व्यवस्था जानने का है, फिर भी सिरिएक शब्द की सामान्य शिक्षण-संबंधी अर्थछाया वास्तविक है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: ‘विचलित न होना’ किससे संबंधित है
  choice: इसे परमेश्वर की अचलता बताने वाला समन्वित उपवाक्य बनाया गया
  alternative: ‘बिना विचलित हुए जानता है’
  rationale: मूल ܐܢܬ के साथ यह पढ़ना सम्भव और हिन्दी में अधिक स्पष्ट है; क्रियाविशेषणात्मक विकल्प अनावश्यक रूप से इसे जानने की मानसिक प्रक्रिया तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के लिए निकट एकवचन संबोधन ‘तू’ रखा गया है, जो इस प्रार्थना के प्रत्यक्ष संबोधन से मेल खाता है।
