translation:
  language: hi
  text: और जो सुरक्षित रखा गया है, वह उसके लिए बना रहता है जिसे नया बनाया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܡ
  choice: जो / उसके
  rationale: यह अनिश्चित सर्वनाम किसी वस्तु या बात को सामान्य रूप से सूचित करता है; हिन्दी में संदर्भानुकूल सर्वनाम रखा गया है।
- source_word: ܡܬܚܒܠܐ / संदर्भगत विपरीत धारणा
  choice: सुरक्षित रखा गया
  rationale: पांडुलिपि-पाठ इस स्थान पर क्षतिग्रस्त और अस्पष्ट है; उपलब्ध नियंत्रक अनुवाद में व्यक्त ‘preserved’ अर्थ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ܗܘܐ
  choice: बना रहता है
  rationale: क्रिया के अस्तित्व अथवा बने रहने के भाव को वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ܚܕܬ / संदर्भगत नवीनीकरण
  choice: नया किया जाता है
  rationale: नवीनीकरण के कर्मवाच्य भाव को बनाए रखा गया है और कर्ता को स्पष्ट नहीं किया गया।
theological_decisions:
- issue: नया करने वाले कर्ता की पहचान
  choice: कर्मवाच्य—‘नया किया जाता है’
  alternative: ‘जिसे परमेश्वर नया करता है’
  rationale: मूल में कर्ता स्पष्ट नहीं है; परमेश्वर को स्पष्ट कर्ता बनाना पाठ से आगे जाना होता।
- issue: ‘जो’ के संदर्भ की प्रकृति
  choice: सामान्य और अनिर्दिष्ट रखा
  alternative: सृष्टि, संसार या व्यक्ति के रूप में स्पष्ट करना
  rationale: खंडित स्रोत और संक्षिप्त वाक्य किसी एक निश्चित संदर्भ को बाध्य नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। स्रोत-पृष्ठ पर पाठ क्षतिग्रस्त/अस्पष्ट होने के कारण अनावश्यक व्याख्यात्मक विस्तार से बचा गया है।
