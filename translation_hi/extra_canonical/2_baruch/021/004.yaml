translation:
  language: hi
  text: “हाय, मेरे हृदय! वह फटकर शोक का सोता बन गया है[a]; वहीं से मेरी आँखों के आँसू बहते हैं, और रोने से मेरा जी नहीं भरता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह शोक के सोते पर फट गया है।”
    reason: सीरियाई वाक्यरचना में हृदय के ‘शोक का सोता बनकर’ फटने और ‘शोक के सोते पर’ फटने—दोनों प्रकार का संबंध समझा जा सकता है।
lexical_decisions:
- source_word: ܘܝܠܗ ܠܒܒܝ
  choice: हाय मेरे हृदय पर!
  rationale: विलापसूचक पद और ‘मेरे हृदय’ को सीधे, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ܒܡܒܘܥܐ ܕܐܒܠܐ
  choice: शोक का सोता
  rationale: ‘शोक/विलाप’ और ‘सोते’ की मूल रूपकात्मक छवि सुरक्षित रखी गई है; अगली पंक्ति में आँसुओं के बहने से इसका संबंध स्पष्ट होता है।
- source_word: ܘܠܡܒܟܐ ܠܐ ܐܫܒܥ
  choice: रोने से मेरा जी नहीं भरता
  rationale: शाब्दिक अर्थ ‘मैं रोने से तृप्त नहीं होता’ है; हिन्दी मुहावरा भाव और प्रथम पुरुष दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुरूप रखी गई है। ‘सोता’ रूपक को बनाए रखा गया है, और अस्पष्ट पूर्वसर्गीय संबंध को मुख्य पाठ में सहज रूप देकर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित किया गया है।
