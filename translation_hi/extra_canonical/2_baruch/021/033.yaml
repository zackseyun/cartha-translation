translation:
  language: hi
  text: तेरे नाम के लिए उस प्रेम पर [ध्यान दे][a], जो सब बातों से बढ़कर तेरे सामने है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पाठ यहाँ कठिन और कुछ हद तक अस्पष्ट है; कोष्ठकों के शब्द वाक्य के अभिप्रेत निवेदन को स्पष्ट करने के लिए संपादकीय पूर्ति के रूप में दिए गए हैं।
    reason: अंग्रेज़ी परामर्श-पाठ में भी आरंभिक आज्ञार्थक पद संपादकीय पूर्ति के रूप में वर्ग-कोष्ठकों में है, और उपलब्ध सिरियाई संदर्भ-पाठ इस स्थान पर पूर्णतः स्पष्ट नहीं है।
lexical_decisions:
- source_word: ܚܘܪ
  choice: ध्यान दे
  rationale: सिरियाई क्रिया का मूल अर्थ ‘देखना/दृष्टि करना’ है; प्रार्थना के इस संदर्भ में ‘ध्यान दे’ स्वाभाविक हिन्दी में अभिप्रेत निवेदन व्यक्त करता है।
- source_word: ܪܚܡܬܐ ܕܫܡܟ (पाठ का पुनर्निर्मित आशय)
  choice: अपने नाम के प्रति उस प्रेम
  rationale: संबंधसूचक रचना को अस्पष्ट ‘नाम का प्रेम’ कहने के बजाय हिन्दी में स्वाभाविक वस्तुगत अर्थ—परमेश्वर के नाम के प्रति प्रेम—के रूप में रखा गया है।
- source_word: ܩܕܡܝܟ
  choice: तेरे सामने
  rationale: स्थानिक/न्यायिक रूपक ‘तेरे सामने’ को अक्षुण्ण रखा गया है; इसे ‘तेरी दृष्टि में’ कहकर सीमित नहीं किया गया।
- source_word: ܡܢ ܟܠ
  choice: सबसे बढ़कर
  rationale: तुलनात्मक व्यापकता ‘सबसे बढ़कर/सब बातों से ऊपर’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘तेरे नाम के प्रति प्रेम’ किसका प्रेम है
  choice: स्वामी सूचित किए बिना ‘उस प्रेम’ कहना
  alternative: ‘हमारे प्रेम’ या ‘तेरे लोगों के प्रेम’ कहना
  rationale: उपलब्ध पाठ प्रेम के कर्ता को स्पष्ट नहीं करता; किसी समुदाय या व्यक्ति को जोड़ना पाठ से आगे जाना होता।
- issue: ‘तेरे सामने’ का अर्थ
  choice: रूपक को यथावत रखना
  alternative: ‘जिसे तू स्वीकार करता है’ या ‘जो तेरी दृष्टि में है’
  rationale: न्याय, स्मरण अथवा उपस्थिति—इन संभावित अर्थों में से किसी एक को निर्णायक रूप से नहीं चुना गया।
translation_notes:
  register: आधुनिक, सरल और प्रार्थनात्मक हिन्दी; परमेश्वर के लिए पारंपरिक एकवचन संबोधन ‘तेरे’ रखा गया है। संपादकीय पूर्ति वर्ग कोष्ठकों में है और उसका पादटिप्पणी-चिह्न मुख्य पाठ में दिया गया है।
