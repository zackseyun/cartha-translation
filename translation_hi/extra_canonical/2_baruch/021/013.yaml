  text: For if the things that have been are not remembered, the things that stand before you are yours, and the things that are to come are remembered in their times.
translation:
  language: hi
  text: क्योंकि यदि बीती हुई बातें स्मरण नहीं की जातीं, तो जो बातें तेरे सामने उपस्थित हैं[a], वे तेरी हैं; और जो बातें आने वाली हैं, वे अपने-अपने समय पर स्मरण की जाती हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो एक-दूसरे के निकट उपस्थित हैं।”
    reason: एक पुराने पाठ-विभाजन/अनुवाद में निकटता का संबंध परस्पर माना गया है; मुख्य पाठ सिरिएक के द्वितीय पुरुष एकवचन संकेत को प्राथमिकता देता है।
  - marker: b
    text: या, “जो बातें तेरे सामने उपस्थित हैं, वे तेरी हैं और अपने-अपने समय पर स्मरण की जाती हैं।”
    reason: सिरिएक वाक्य में अंतिम समय-संबंधी पदबंध को मध्य खंड से जोड़ने की व्याकरणिक संभावना दर्ज की गई है।
lexical_decisions:
- source_word: ܕܘܟܪܢܐ / ܡܕܟ̣ܪܐ
  choice: स्मरण नहीं की जातीं / स्मरण की जाती हैं
  rationale: स्मरण से जुड़े सिरिएक पदों की पुनरावृत्ति बनाए रखी गई है, ताकि बीती और आनेवाली बातों के बीच का विरोध स्पष्ट रहे।
- source_word: ܗܠܝܢ ܕܩ̈ܡܝ ... ܕܝܠܟ
  choice: जो बातें तेरे सामने उपस्थित हैं, वे तेरी हैं
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय को ‘तेरे’ से स्पष्ट किया गया है; ‘उपस्थित’ वर्तमान में सामने विद्यमान होने का स्वाभाविक हिन्दी रूप है।
- source_word: ܒܙܒܢܘܬܐ
  choice: अपने-अपने समय पर
  rationale: बहुवचन/वितरणात्मक समय-बोध को सहज हिन्दी में व्यक्त करता है और भविष्य की बातों के नियत अवसरों का भाव बनाए रखता है।
theological_decisions:
- issue: भूत, वर्तमान और भविष्य—तीनों खंडों का संबंध परमेश्वर से
  choice: तीनों अलग उपवाक्य बनाए रखे गए और संबोधन में ‘तेरे’ रखा गया
  alternative: वर्तमान और भविष्य के खंडों को एक ही वाक्यांश मानना
  rationale: स्रोत में कालगत तीन भागों का तनाव महत्त्वपूर्ण है; उन्हें मिलाने से अर्थ-संरचना और परमेश्वर के ज्ञान/अधिकार के बीच का सूक्ष्म भेद मिट जाता।
- issue: अंतिम समय-संबंधी वाक्यांश का व्याकरणिक संबंध
  choice: मुख्य पाठ में इसे आनेवाली बातों के स्मरण से जोड़ा गया
  alternative: इसे ‘तेरी हैं’ वाले मध्य खंड से जोड़ना
  rationale: यह पाठ-संरचना तीन समानांतर कालगत खंडों को सबसे स्पष्ट रखती है, पर वैकल्पिक संयोजन को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। प्रार्थना में परमेश्वर को संबोधित करने के कारण सम्मानपूर्ण किंतु निकट संबोधन ‘तेरे’ रखा गया है। अर्धविराम से भूत, वर्तमान और भविष्य के तीन खंड अलग और पठनीय बने रहते हैं।
