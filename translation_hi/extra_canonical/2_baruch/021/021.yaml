translation:
  language: hi
  text: क्योंकि यदि मनुष्यों को केवल यही जीवन दिया गया होता, तो इससे अधिक कड़वा कुछ न होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒ̈ܢܝܐ
  choice: मनुष्यों
  rationale: शाब्दिक रूप से ‘पुत्रों’ का भाव रखने वाला यह रूप प्रसंग में समस्त मानवजाति को सूचित करता है; आधुनिक हिन्दी में ‘मनुष्यों’ स्वाभाविक और समावेशी है।
- source_word: ܚܝܐ
  choice: जीवन
  rationale: सांसारिक मानव-जीवन के अर्थ को सीधे और स्पष्ट रूप में व्यक्त करता है।
- source_word: ܟܒܘܬܐ
  choice: कड़वी
  rationale: पाठ के दुःख और असहनीयता के भाव को बनाए रखते हुए ‘bitterness’ की रूपकात्मक भाषा सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘यही जीवन’ के अकेले होने की शर्त
  choice: केवल यही जीवन दिया गया होता
  alternative: सिर्फ यह जीवन मिलता
  rationale: यह अनुवाद परलोक या भावी जीवन के निहित विरोध को स्पष्ट किए बिना मूल कथन का काल्पनिक शर्तवाचक तनाव बनाए रखता है।
- issue: मानवजाति के लिए स्रोत की पुत्र-संबंधी अभिव्यक्ति
  choice: मनुष्यों
  alternative: मनुष्यों के पुत्रों
  rationale: यहाँ अभिव्यक्ति जातिगत रूप से मानव प्राणियों के लिए है; शाब्दिक हिन्दी अनावश्यक रूप से केवल पुरुष वंशजों का संकेत दे सकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कड़वी’ की रूपकात्मकता को सुरक्षित रखा गया है, और वाक्य की अवास्तविक शर्त को ‘यदि…दिया गया होता’ से व्यक्त किया गया है।
