  text: And let no one who reigns and has become king boast and grow proud through the pride of man.”
translation:
  language: hi
  text: और जो कोई राज्य करता है और राजा बन गया है, वह मनुष्य के घमंड के कारण डींग न मारे और घमंडी न बने।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पाठ-संभावना: “और कोई भी वस्तु जो राज्य करती है और राजा बन गई है, डींग न मारे।”'
    reason: उपलब्ध पाठ और पूर्ववर्ती पाठ-परंपरा में कर्ता को ‘कोई व्यक्ति’ अथवा ‘कोई वस्तु’ समझने की अनिश्चितता है। यह विकल्प केवल पाठगत संभावना दर्ज करता है।
  - marker: b
    text: 'या: “और राज्य करने वाला कोई व्यक्ति डींग न मारे—वही जो राजा बन गया है।”'
    reason: संबंधवाचक उपवाक्यों का वाक्यगत संबंध अनिश्चित है; यह विकल्प दूसरे उपवाक्य को पश्चात् स्पष्टीकरण के रूप में रखता है।
lexical_decisions:
- source_word: ܡܠܟ / ܡܠܟܘ (राजत्व/शासन से संबंधित रूप; उपलब्ध पाठ में संदिग्ध)
  choice: शासन करता और राजा बन गया है
  rationale: अंग्रेज़ी परामर्श-पाठ की दो समानांतर राजकीय अभिव्यक्तियों को स्वाभाविक हिन्दी में अलग रखते हुए उपलब्ध सिरिएक साक्ष्य के राजत्व-संबंधी अर्थ को व्यक्त करता है।
- source_word: मानवीय गर्व को सूचित करने वाला संदिग्ध/क्षतिग्रस्त पद
  choice: मनुष्य के घमंड के कारण
  rationale: ‘मनुष्य के घमंड’ की संबंधात्मक अस्पष्टता को बनाए रखता है—यह मानवीय अहंकार का स्रोत भी हो सकता है और मनुष्य-सुलभ गर्व का प्रकार भी।
- source_word: boast / grow proud के पीछे माने गए सिरिएक भाव
  choice: डींग न मारे और अभिमानी न बने
  rationale: दो निकटवर्ती पर अलग क्रियाओं को बोलचाल से ऊपर, किंतु सामान्य पाठक के लिए स्पष्ट हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: राजा की सत्ता और मानवीय गर्व का संबंध
  choice: वचन को किसी विशेष प्रकार की राजसत्ता की निंदा न बनाकर शासक के आत्मगौरव के विरुद्ध चेतावनी के रूप में रखा गया है।
  alternative: इसे राजत्व स्वयं की निंदा के रूप में पढ़ना।
  rationale: स्रोत-साक्ष्य का केंद्र शासन या राजा बनने की अवस्था में घमंड न करना है; इससे आगे कोई राजनीतिक या सांप्रदायिक निष्कर्ष जोड़ना उचित नहीं।
- issue: कर्ता की पहचान
  choice: ‘जो कोई’
  alternative: ‘कोई वस्तु’ या केवल ‘शासन करने वाला’
  rationale: राजा बनने वाले चेतन व्यक्ति का अर्थ प्रसंगतः अधिक स्वाभाविक है, पर पाठगत अनिश्चितता को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज शैली। ‘शासन करता’ औपचारिक राजकीय भाव देता है, जबकि ‘डींग न मारे’ घमंड के बाहरी प्रदर्शन को स्पष्ट करता है। उद्धरण-समापन चिह्न अंग्रेज़ी परामर्श-पाठ में मिले पूर्ववर्ती भाषण-संदर्भ के अनुरूप रखा गया है।
