translation:
  language: hi
  text: और स्वर्ग की सेनाएँ आत्मा[a] के द्वारा जानती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा का शब्द ‘आत्मा’, ‘सांस’ या ‘वायु’ भी दर्शा सकता है; यहाँ किसी विशिष्ट पहचान को स्पष्ट नहीं किया गया है।
    reason: मूल शब्द की वास्तविक अर्थगत और धर्मसैद्धांतिक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: ܐܘܡܘܗܝ ܕܫܡܝܐ
  choice: स्वर्ग की सेनाएँ
  rationale: यह पदबंध आकाशीय समुदाय या सैन्य-समूह को सूचित करता है; आधुनिक हिन्दी में ‘स्वर्ग की सेनाएँ’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ܝܕܥ
  choice: जानती हैं
  rationale: मूल धातु का सामान्य अर्थ ‘जानना’ है; कर्ता ‘सेनाएँ’ हिन्दी में स्त्रीलिंग बहुवचन है।
- source_word: ܒܪܘܚܐ
  choice: आत्मा के द्वारा
  rationale: पूर्वसर्ग ܒ साधन या माध्यम व्यक्त कर सकता है, और ܪܘܚܐ का अर्थ आत्मा, सांस या वायु हो सकता है। यहाँ ‘आत्मा के द्वारा’ मूल की अस्पष्टता को किसी विशिष्ट धर्मसैद्धांतिक पहचान में बदले बिना बनाए रखता है।
theological_decisions:
- issue: ܪܘܚܐ की पहचान
  choice: आत्मा
  alternative: पवित्र आत्मा
  rationale: मूल पाठ यहाँ आत्मा को स्पष्ट रूप से ‘पवित्र आत्मा’ नहीं कहता। इसलिए किसी बाद की त्रित्व-संबंधी विशिष्टता को आरोपित किए बिना सामान्य पद रखा गया है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। ‘स्वर्ग की सेनाएँ’ पारंपरिक बाइबलीय बिंब को सामान्य पाठक के लिए स्पष्ट रखता है; ‘आत्मा’ को विशेष नाम के रूप में निर्धारित नहीं किया गया है।
