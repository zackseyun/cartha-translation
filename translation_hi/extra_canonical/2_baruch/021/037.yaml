  text: And let the treasuries of the souls restore those who are shut up in them, that there may be a gathering of the sons of men, as you commanded from of old.
translation:
  language: hi
  text: और आत्माओं के भंडारगृह उनमें बंद लोगों को लौटा दें, ताकि मनुष्यों का एकत्रीकरण हो, जैसा तूने पहले से आज्ञा दी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या सम्भवतः: “और उनमें बंद लोग उन्हें मनुष्यों के पास लौटा दें, जैसा तूने पहले से आज्ञा दी थी, और वे सभा में एकत्र हो जाएँ।”'
    reason: कर्ता-कर्म तथा अंतिम एकत्रीकरण-वाक्य के संबंध की पुरानी वैकल्पिक व्याख्या को सुरक्षित रखने के लिए; मुख्य पाठ उपलब्ध सीरियाई वाक्यरचना का अनुसरण करता है।
lexical_decisions:
- source_word: ܐܘܨܪ̈ܐ ܕܢܦܫ̈ܬܐ
  choice: आत्माओं के भंडारगृह
  rationale: ‘भंडारगृह’ मूल के ऐसे सुरक्षित स्थानों का ठोस बिंब बनाए रखता है जहाँ आत्माएँ रोकी गई हैं; इसे व्याख्यात्मक रूप से ‘मृतकों का लोक’ नहीं बनाया गया।
- source_word: ܢܗܦܟܘܢ / restore
  choice: लौटा दें
  rationale: क्रिया के प्रत्यावर्तन/वापसी के भाव को सुरक्षित रखता है और ‘छोड़ दें’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: ܐܝܠܝܢ ܕܚܒܝܫܢ ܒܗܘܢ
  choice: उनमें बन्द लोगों को
  rationale: सम्बन्धवाचक पद का सीधा अर्थ रखा गया है और उसके कर्म-संबंध को मुख्य पाठ में स्पष्ट किया गया है।
- source_word: ܟܢܘܫܝܐ ܕܒܢܝܢܫܐ
  choice: मनुष्यों का एकत्र होना
  rationale: ‘मनुष्य के पुत्रों’ का शब्दशः किन्तु अप्राकृतिक रूप लेने के बजाय सामान्य सामी अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: ܡܢ ܩܕܝܡ
  choice: प्राचीनकाल से
  rationale: आज्ञा के बहुत पहले से दिए होने का कालगत भाव सुरक्षित रहता है।
theological_decisions:
- issue: आत्माओं के भंडारगृहों की पहचान
  choice: रूपक को बिना परिभाषित किए ‘आत्माओं के भंडारगृह’ रखा गया
  alternative: ‘मृतकों का लोक’ या ‘आत्माओं का निवास’
  rationale: मूल पाठ के ब्रह्माण्ड-विषयक बिंब और उसकी अस्पष्टता को किसी विशिष्ट परलोक-सिद्धान्त में नहीं बदला गया।
- issue: वाक्य का कर्ता-कर्म और उद्देश्य-वाक्य
  choice: भंडारगृह कर्ता हैं, उनमें बन्द लोग कर्म हैं, और मनुष्यों का एकत्र होना उद्देश्य है
  alternative: बन्द लोग मनुष्यों को लौटाएँ और सभा में एकत्र हों
  rationale: उपलब्ध सीरियाई वाक्यरचना और संशोधन-साक्ष्य मुख्य पाठ के विन्यास का समर्थन करते हैं; पुरानी सम्भावना पाठांतर के रूप में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ईश्वर के लिए प्रार्थनात्मक एकवचन ‘तूने’ प्रयोग किया गया है। ‘भंडारगृह’ और ‘बन्द’ मूल बिंब को बनाए रखते हैं; वाक्यरचना हिन्दी में स्वाभाविक की गई है।
