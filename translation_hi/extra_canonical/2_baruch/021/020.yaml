translation:
  language: hi
  text: और मैंने देखा कि एक मनुष्य के कारण जीवित लोग अस्तित्व में आए, और जो आने वाले हैं, उनके रहने का स्थान भी अस्तित्व में आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ / जीवित जनों से संबंधित अभिव्यक्ति
  choice: जीवित लोग
  rationale: व्यक्तियों को सूचित करने वाली सामूहिक अभिव्यक्ति को सहज आधुनिक हिन्दी में रखा गया है; इसे अमूर्त ‘जीवन’ नहीं बनाया गया।
- source_word: ܡܥܡܪܐ / निवास-स्थान से संबंधित अभिव्यक्ति
  choice: रहने का स्थान
  rationale: सिर्फ ‘निवास’ की अपेक्षा यह सामान्य पाठक के लिए अधिक स्वाभाविक है और किसी विशिष्ट परलोक-संबंधी अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ / आनेवाले जन
  choice: जो आनेवाले हैं
  rationale: भविष्य में आने वाले लोगों की पहचान को खुला रखा गया है; इसे किसी विशेष धार्मिक समूह तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘एक मनुष्य के कारण’ में कारणता का स्वरूप
  choice: एक मनुष्य के कारण
  alternative: एक मनुष्य के द्वारा
  rationale: ‘के कारण’ मूल कथन की कारण-संबंधी व्यापकता और अंग्रेज़ी परामर्श-पाठ की सावधानी बनाए रखता है; ‘के द्वारा’ साधनात्मक अर्थ को अधिक निश्चित कर देता।
- issue: ‘जो आनेवाले हैं’ के रहने के स्थान की प्रकृति
  choice: रहने का स्थान
  alternative: अनन्त निवास
  rationale: पाठ स्वयं इस स्थान को ‘अनन्त’ नहीं कहता; इसलिए अतिरिक्त परलोकवादी व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अस्तित्व में आए’ सृष्टि या उत्पत्ति के भाव को स्पष्ट करता है, जबकि ‘जीवित लोग’ और ‘जो आनेवाले हैं’ मूल की सामूहिक तथा कालगत भिन्नता को बनाए रखते हैं। उपलब्ध सिरिएक पृष्ठ-पाठ में पद-सीमाएँ और कुछ पंक्तियाँ अस्पष्ट/क्षतिग्रस्त हैं, इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य के रूप में सावधानी से उपयोग किया गया है।
