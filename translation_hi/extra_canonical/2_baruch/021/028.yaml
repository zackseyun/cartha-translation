translation:
  language: hi
  text: और जो अपने समय के लिए सुरक्षित रखा गया है, वह बना रहे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बना रहता है।”
    reason: सीरियाई क्रिया-रूप को कथनात्मक वर्तमान के रूप में भी समझा जा सकता है।
  - marker: b
    text: या, “अपने समयों के लिए।”
    reason: स्वरांकन अथवा रूप-पठन के आधार पर बहुवचन की संभावना दर्ज की गई है।
lexical_decisions:
- source_word: ܡܣܟܝܢ
  choice: सुरक्षित रखा गया है
  rationale: प्रसंग और उपलब्ध पाठ-साक्ष्य के अनुसार यह उस वस्तु की ओर संकेत करता है जिसे नियत समय तक बचाकर या सुरक्षित रखकर रखा गया है।
- source_word: ܒܙܒܢܗ
  choice: अपने समय के लिए
  rationale: प्रत्यय को संरक्षित वस्तु से संबद्ध मानते हुए एकवचन ‘उसका/अपना समय’ व्यक्त किया गया है; हिन्दी में ‘अपने’ अधिक स्वाभाविक है।
- source_word: ܢܩܘܡ
  choice: बना रहे
  rationale: अपूर्ण क्रिया-रूप को प्रार्थनात्मक/कामनात्मक अर्थ में लिया गया है। ‘बना रहे’ निरंतर अस्तित्व या स्थायित्व दोनों को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: क्रिया का कामनात्मक या कथनात्मक बल
  choice: वह बना रहे
  alternative: वह बना रहता है
  rationale: यह अंश बारूक की प्रार्थना के भीतर है और निकटवर्ती याचक क्रियाओं के साथ कामनात्मक अर्थ अधिक संगत है; फिर भी कथनात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘समय’ का वचन
  choice: एकवचन—अपने समय के लिए
  alternative: अपने समयों के लिए
  rationale: सामान्य पाठ-पठन और नियत अवसर की धारणा एकवचन का समर्थन करते हैं, जबकि संभावित बहुवचन पठन पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रार्थनात्मक वाक्य-विन्यास रखा गया है। ‘नियत’ को मुख्य पाठ में नहीं जोड़ा गया, ताकि स्रोत में निहित अर्थ से अधिक स्पष्टता आरोपित न हो।
