translation:
  language: hi
  text: और जो लोग उनके साथ हैं और उन्हीं के समान हैं, उन्हें यह ज्ञात हो जाए कि यही वह समय है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܕܥ / ज्ञात होना
  choice: ज्ञात हो जाए
  rationale: वाक्य के निष्क्रिय/परिणामसूचक भाव को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܙܒܢܐ
  choice: समय
  rationale: मूल शब्द का सामान्य अर्थ ‘समय’ है; प्रसंग से स्पष्ट न होने के कारण ‘नियत समय’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: ‘यह समय’ को अंतकाल या न्याय के नियत समय के रूप में स्पष्ट करना
  choice: यही वह समय है
  alternative: यही वह नियत समय है
  rationale: उपलब्ध पाठ में समय की प्रकृति स्पष्ट नहीं है; इसलिए संभावित युगांत-संबंधी अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। ‘उनके साथ हैं’ और ‘उन्हीं के समान हैं’—दोनों संबंधों को अलग-अलग सुरक्षित रखा गया है।
