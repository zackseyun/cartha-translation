translation:
  language: hi
  text: आप पापी मनुष्य के कारण[b] ही वर्षा और जलप्रलय की आज्ञा देते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहते हैं।”
    reason: मूल क्रिया का अधिक शाब्दिक अर्थ सुरक्षित रखने के लिए।
  - marker: b
    text: या, “के विषय में।”
    reason: संबंधसूचक पद की वैकल्पिक व्याख्या दर्शाने के लिए।
lexical_decisions:
- source_word: ܡܡܠܠ
  choice: आज्ञा देते हैं
  rationale: मूल क्रिया का सामान्य अर्थ ‘बोलना’ है, पर यहाँ जलप्रलय और वर्षा को प्रभावी बनाने वाले परमेश्वर के अधिकारपूर्ण वचन का भाव है; इसलिए स्वाभाविक हिन्दी में ‘आज्ञा देते हैं’ चुना गया।
- source_word: ܛܘܦܢܐ ܡܛܪܐ
  choice: जलप्रलय और वर्षा
  rationale: 'दोनों संज्ञाओं को मूल स्रोत के क्रम में रखा गया है: पहले जलप्रलय, फिर वर्षा।'
- source_word: ܐܢܫܐ ܡܣܟܠܢܐ
  choice: पापी मनुष्य
  rationale: यह पदबंध दोषी या पाप करने वाले मनुष्य को सूचित करता है; ‘पापी मनुष्य’ सरल और प्रसंगानुकूल है।
theological_decisions:
- issue: दैवी वचन और प्राकृतिक घटनाओं का संबंध
  choice: आज्ञा देते हैं
  alternative: कहते हैं
  rationale: अनुवाद परमेश्वर के वचन की प्रभावकारी सत्ता व्यक्त करता है, पर पादटिप्पणी में अधिक शाब्दिक विकल्प सुरक्षित रखा गया है।
- issue: पापी मनुष्य और जलप्रलय/वर्षा के बीच संबंध
  choice: के कारण
  alternative: के विषय में
  rationale: प्रसंग और परामर्श-पाठ कारणसूचक अर्थ का समर्थन करते हैं; फिर भी स्रोत-पूर्वसर्ग की संभावित विषयसूचक व्याख्या पादटिप्पणी में रखी गई है।
- issue: ‘सिवाय’ वाली निषेधात्मक रचना का हिन्दी रूप
  choice: के कारण ही
  alternative: के कारण के सिवाय नहीं
  rationale: ‘ही’ मूल कथन का सीमितार्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और अनावश्यक दोहरे निषेध से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली में परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। वाक्य को सामान्य पाठक के लिए सहज बनाया गया है, जबकि दोनों वास्तविक शाब्दिक विकल्प पादटिप्पणियों में सुरक्षित हैं।
