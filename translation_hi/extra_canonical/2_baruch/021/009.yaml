translation:
  language: hi
  text: जगत के आरम्भ से तू उन वस्तुओं को बुलाता है जो अस्तित्व में नहीं हैं, और वे तेरी आज्ञा मानती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तेरी बात सुनती हैं।”
    reason: सीरियाई क्रिया में ‘सुनने’ और ‘आज्ञा मानने’—दोनों का भाव सम्भव है।
lexical_decisions:
- source_word: ܡܢ ܪܝܫ ܥܠܡܐ
  choice: जगत के आरम्भ से ही
  rationale: स्रोत के कालवाचक पदबंध को स्वाभाविक हिन्दी में आरम्भ में रखा गया है; “ही” उसके बल को सहज रूप से व्यक्त करता है।
- source_word: ܩܪܐ
  choice: बुलाता है
  rationale: क्रिया का मूल अर्थ ‘पुकारना/बुलाना’ है; यहाँ अस्तित्व में न होने वाली वस्तुओं को प्रभावी रूप से बुलाने के सन्दर्भ में ‘बुलाता है’ स्वाभाविक है।
- source_word: ܠܥܡܡܐ ܕ... ܠܐ
  choice: उन वस्तुओं को ... जो अस्तित्व में नहीं हैं
  rationale: उपलब्ध पाठ में वर्तनी/OCR की कठिनाई है, पर अंग्रेज़ी परामर्श-पाठ और वाक्य-सन्दर्भ निर्जीव बहुवचन वस्तुओं की ओर संकेत करते हैं; ‘अभी’ नहीं जोड़ा गया, ताकि भविष्यगत अस्तित्व का अर्थ अनावश्यक रूप से आरोपित न हो।
- source_word: ܡܫܬܡܥܝܢ
  choice: आज्ञा मानती हैं
  rationale: सीरियाई क्रिया का अर्थ ‘सुनना’ और ‘आज्ञा मानना’ दोनों हो सकता है; इस प्रसंग में बुलावे पर प्रभावी प्रत्युत्तर को ‘आज्ञा मानती हैं’ अधिक स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: जो वस्तुएँ अस्तित्व में नहीं हैं, उन्हें परमेश्वर का बुलाना
  choice: कथन को सीधे रूप में रखा गया है
  alternative: ‘जो अभी अस्तित्व में नहीं हैं’ या ‘मानो वे अस्तित्व में हों’
  rationale: स्रोत में ‘अभी’ अथवा तुलना का स्पष्ट आधार नहीं है; इसलिए सृष्टि और परमेश्वर की प्रभुता से जुड़े कथन की वास्तविक धार और तनाव को सुरक्षित रखा गया है।
- issue: ‘सुनना’ बनाम ‘आज्ञा मानना’
  choice: आज्ञा मानती हैं
  alternative: तेरी सुनती हैं
  rationale: मध्य/एत्पएल रूप प्रसंगानुसार आज्ञापालन का भाव दे सकता है; फिर भी शाब्दिक ‘सुनती हैं’ सम्भव है, इसलिए उसे पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ईश्वर को संबोधन में एकवचन ‘तू/तेरी’ रखा गया है, जो प्रार्थना की निकटता और स्रोत के एकवचन संबोधन को दर्शाता है।
