translation:
  language: hi
  text: उनका जो जीवित हैं और उनका जो कुछ भी नहीं हैं। क्योंकि जो जीवन आनन्दित नहीं है, वह जीवन नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: जीवित / जीवन
  rationale: संदर्भ के अनुसार इसी मूल से पहले जीवित लोगों और फिर जीवन की अवस्था को व्यक्त किया गया है।
- source_word: ܠܐ ܐܝܬ
  choice: मानो कुछ भी नहीं हैं
  rationale: अस्तित्वहीनता के प्रबल भाव को स्वाभाविक हिन्दी में रखा गया है; ‘मानो’ कथन को पूर्ण तत्त्वमीमांसात्मक दावा बनाने से बचाता है।
- source_word: ܡܒܣܡܐ
  choice: आनन्द
  rationale: यह प्रसन्नता या सुखद आनन्द का भाव देता है; ‘आनन्द से रहित’ हिन्दी में संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: ‘जो कुछ भी नहीं हैं’ का अस्तित्व-संबंधी अर्थ
  choice: मानो कुछ भी नहीं हैं
  alternative: जिनका अस्तित्व नहीं है
  rationale: पाठ की अलंकारिक तीव्रता बनाए रखते हुए इसे मृतकों या किसी वर्ग के वास्तविक अस्तित्व-निषेध के रूप में अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: आनन्दहीन जीवन को ‘जीवन नहीं’ कहना
  choice: कोई जीवन नहीं है
  alternative: सच्चा जीवन नहीं है
  rationale: ‘सच्चा’ जोड़ने से व्याख्यात्मक समाधान आ जाता; मूल की तीखी और तनावपूर्ण अभिव्यक्ति सीधे रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सुबोध और गरिमापूर्ण। आरम्भिक संबंधसूचक खंड पिछले पद से व्याकरणिक रूप से जुड़ा प्रतीत होता है, इसलिए ‘उन लोगों का… और उनका…’ संरचना सुरक्षित रखी गई है।
