translation:
  language: hi
  text: ताकि मनुष्य का विनाश फिर ऐसा न दिखाई दे, मानो मनुष्य की सृष्टि ही न हुई हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܒܠܐ / ܡܬܚܒܠܘܬܗܘܢ
  choice: विनाश
  rationale: इस धातु-समूह में बिगड़ने, नष्ट होने या विनाश की ओर जाने का भाव है; प्रसंग में मनुष्य के अंतिम नाश के लिए ‘विनाश’ स्वाभाविक और गंभीर शब्द है।
- source_word: ܒܪܝ / ܐܬܒܪܝܘ (सृष्टि-संबंधी धातु)
  choice: सृष्टि हुई
  rationale: सिरिएक में रचे जाने का भाव है; ‘जन्म हुआ’ की अपेक्षा ‘सृष्टि हुई’ ईश्वरीय सृजन के संदर्भ को ठीक रखता है।
- source_word: ܬܘܒ
  choice: फिर
  rationale: पुनरावृत्ति या दोबारा होने का सामान्य अर्थ सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मनुष्य के विनाश और उसकी सृष्टि के बीच तनाव
  choice: 'वाक्य को उद्देश्यसूचक रूप में रखा गया है: विनाश ऐसा न दिखाई दे मानो सृष्टि हुई ही न हो।'
  alternative: विनाश को इस अर्थ में समझाना कि सृष्टि निरर्थक सिद्ध न हो।
  rationale: पाठ की तुलना को बनाए रखा गया है और उसके निहित धर्मवैचारिक निष्कर्ष को व्याख्या बनाकर मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘मनुष्य’ की पुनरावृत्ति जानबूझकर रखी गई है, ताकि सर्वनाम की अस्पष्टता न रहे।
