translation:
  language: hi
  text: महान लेखे में, तेरे पूर्वजों के अपराध तेरे सामने स्मरण में रखे जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܚܘܫܒܐ ܪܒܐ (b-ḥuššābā rabbā)
  choice: तेरे महान लेखे में
  rationale: ܚܘܫܒܐ में विचार, गणना और लेखे का अर्थ-क्षेत्र है। प्रसंग और अंग्रेज़ी परामर्श-पाठ के ‘great reckoning’ को ध्यान में रखते हुए ‘महान लेखा’ न्यायपूर्ण हिसाब का भाव स्वाभाविक रूप से व्यक्त करता है। संबंध को स्पष्ट करने के लिए ‘तेरे’ रखा गया है।
- source_word: ܚܝ̈ܒܘܬܐ (ḥayyābūṯā)
  choice: अपराध
  rationale: यह शब्द दोष, अपराध या दोषारोपण योग्य कर्म का बोध कराता है; ‘अपराध’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ܡܕܟܪܐ (meḏḏaḵrā)
  choice: रखे रहते हैं
  rationale: 'रूप को निष्क्रिय अर्थ में लिया गया है: अपराध कर्ता द्वारा सक्रिय रूप से याद किए जाने के बजाय उसके सामने बने या रखे रहते हैं। यह हाल की स्रोत-आधारित समीक्षा के अनुरूप है।'
theological_decisions:
- issue: ईश्वर के सामने अपराधों की उपस्थिति और स्मरण
  choice: निष्क्रिय अभिव्यक्ति—‘तेरे सामने रखे रहते हैं’
  alternative: ‘तू अपराधों को याद रखता है’
  rationale: सिरिएक क्रियारूप निष्क्रिय अर्थ का समर्थन करता है। इससे ईश्वरीय सर्वज्ञता या न्याय के विषय में पाठ से अधिक स्पष्ट doctrinal निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को संबोधित करने के लिए निकट और प्रार्थनात्मक एकवचन ‘तेरे’ रखा गया है; मूल की पुनरुक्ति ‘तेरे सामने…तेरे सामने’ जानबूझकर सुरक्षित रखी गई है।
