review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses the first occurrence of ܩܕܡ̈ܝܟ: in “ܠܚܝ̈ܒܘܬܐ ܕܩܕܡ̈ܝܟ ܩܕܡ̈ܝܟ,” the first denotes “your predecessors/those before you,” while the second means “before you.” The rendering also adds an unsupported possessive in “तेरे महान लेखे में.” The passive/stative sense of ܡܕܟܪܐ is appropriately retained.'
  naturalness: “रखे रहते हैं” is understandable but somewhat cumbersome. “स्मरण में रखे जाते हैं” is natural formal Hindi and preserves the passive sense without making God the explicit active subject.
  terminology: “अपराध” is suitable for ܚܝ̈ܒܘܬܐ. “महान लेखे” adequately conveys the forensic/reckoning sense of ܚܘܫܒܐ ܪܒܐ. “पूर्वजों” clearly expresses the first ܩܕܡ̈ܝܟ and avoids the draft’s syntactic ambiguity.
  issues:
  - severity: high
    issue: The phrase “जो तेरे सामने हैं” mistranslates the first ܩܕܡ̈ܝܟ.
    rationale: It refers to the addressee’s predecessors, not to people presently standing before the addressee. The immediately following repeated word supplies “before you.”
  - severity: medium
    issue: “तेरे महान लेखे” adds a possessive absent from the source.
    rationale: The source says “in a/the great reckoning,” while the possessive belongs with “your predecessors” and “before you.”
  - severity: low
    issue: The footnote proposes an active ‘याद रखे जाते हैं’ reading and calls ܡܕܟܪܐ ‘याद रखा जाना,’ but it does not resolve the key duplicated-prepositional syntax.
    rationale: A footnote is unnecessary once the main text correctly renders both occurrences of ܩܕܡ̈ܝܟ and retains the passive sense.
  revised_text: महान लेखे में, तेरे पूर्वजों के अपराध तेरे सामने स्मरण में रखे जाते हैं।
