translation:
  language: hi
  text: तेरी महिमा दिखाई दे, और तेरी भलाई की महानता जानी जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܒܚܐ
  choice: महिमा
  rationale: सीरियाई शब्द का सामान्य अर्थ ‘महिमा/गौरव’ है; प्रार्थना के ईश्वर-संबोधन में ‘महिमा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ܛܒܘܬܐ
  choice: भलाई
  rationale: यह चुनाव ईश्वरीय goodness को व्यापक नैतिक और कृपालु अर्थ में रखता है; ‘कृपा’ कहने से अर्थ अनावश्यक रूप से संकरा हो सकता था।
- source_word: ܪܒܘܬܐ
  choice: महानता
  rationale: मूल की greatness को सीधे व्यक्त करता है और ‘भलाई’ की विशालता पर बल बनाए रखता है।
theological_decisions:
- issue: ईश्वर की महिमा और भलाई के प्रकट होने की याचना
  choice: 'दोनों कर्मों को इच्छासूचक निष्क्रिय रूप में रखा गया: ‘दिखाई दे’ और ‘जानी जाए’।'
  alternative: ‘अपनी महिमा दिखा और अपनी महान भलाई प्रकट कर।’
  rationale: निष्क्रिय इच्छासूचक रचना मूल की प्रार्थनात्मक अभिव्यक्ति और इस अस्पष्टता को बनाए रखती है कि इन्हें कौन देखे या जानेगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण प्रार्थना-भाषा। उपलब्ध अध्याय-पृष्ठ का पाठ इस पद के निकट कट जाता है, इसलिए शब्द-क्रम के निर्धारण में सीरियाई अध्याय-साक्ष्य के साथ लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ का उपयोग किया गया है।
