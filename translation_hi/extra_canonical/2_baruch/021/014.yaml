    issue: The phrasing ‘केवल आपके लिए ही यह उचित है कि आप ... पता लगाएँ’ is stylistically stiff.
    rationale: The source’s fittingness construction is better represented in modern Hindi by ‘केवल आपको ही ... करना उचित है.’ This also avoids the slightly awkward combination of ‘केवल,’ ‘के लिए,’ and ‘ही.’
  - severity: low
    issue: ‘मूल का पता लगाएँ’ is less precise than the source-oriented sense of ‘search out the origin.’
    rationale: ‘समूची व्यवस्था के उद्गम की खोज करना’ directly represents both the origin/beginning and the deliberate searching action.
