translation:
  language: hi
  text: और केवल आपको ही समूची व्यवस्था के उद्गम की खोज करना उचित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܠܚܘܕܝܟ
  choice: केवल आपके लिए ही
  rationale: यह एकान्तता और विशेष अधिकार/योग्यता पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܙܕܩܐ
  choice: उचित है
  rationale: यहाँ शब्द नैतिक ‘धर्मी’ होने के बजाय ‘शोभा देना, उचित होना, अधिकार होना’ का भाव देता है।
- source_word: ܕܬܒܥܝܟ
  choice: कि आप ... पता लगाएँ
  rationale: मूल क्रिया खोजने, जाँचने या गहराई से जानने का भाव रखती है; ‘पता लगाएँ’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: ܒܪܝܫܘܬܗ
  choice: मूल
  rationale: शब्द आरम्भ, उद्गम या मूल-सिद्धान्त की ओर संकेत करता है; संक्षिप्त ‘मूल’ इस अर्थ-क्षेत्र को खुला रखता है।
- source_word: ܟܘܠܐ ܕܒ̣ܝܬ
  choice: समूची व्यवस्था
  rationale: पाठ का अंतिम पद पाण्डुलिपीय/OCR स्तर पर कठिन है; प्रसंग और नियंत्रक अनुवाद इसे सृष्ट जगत की समग्र व्यवस्था के रूप में समझते हैं।
theological_decisions:
- issue: परमेश्वर के लिए अनन्य ज्ञान/अधिकार
  choice: केवल आपके लिए ही यह उचित है
  alternative: केवल आप ही योग्य हैं
  rationale: यह परमेश्वर की अनन्यता को सुरक्षित रखता है, पर ‘योग्य’ के द्वारा कोई अतिरिक्त नैतिक या उपासना-संबंधी अर्थ नहीं जोड़ता।
- issue: ‘व्यवस्था’ का आशय
  choice: समूची व्यवस्था
  alternative: सारी सृष्टि
  rationale: ‘सृष्टि’ कहने से पाठ का आशय अनावश्यक रूप से सीमित हो सकता है; ‘व्यवस्था’ विश्व-क्रम, संरचना या समग्र विन्यास की सम्भावना खुली रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर को आदरपूर्ण ‘आप’ से संबोधित किया गया है। आरम्भिक संयोजक ‘और’ सुरक्षित रखा गया है ताकि प्रार्थना की सतत विचार-धारा बनी रहे। वाक्य को गरिमामय किंतु सामान्य पाठक के लिए सहज रखा गया है।
