  verdict: revise
  source_fidelity: The draft preserves the initial conjunction, the exclusivity of ‘to you alone,’ the propriety/fittingness expressed by ܙܕܩܐ, and the action of searching out the origin of the whole order. ‘मूल’ is possible, but ‘उद्गम’ more directly conveys ܒܪܝܫܘܬܗ (‘beginning/origin’) in this context.
  naturalness: ‘केवल आपके लिए ही यह उचित है कि आप …’ is understandable but somewhat calqued and less idiomatic than a Hindi infinitival construction. ‘केवल आपको ही … करना उचित है’ is natural, reverent, and retains the source syntax and emphasis.
  terminology: ‘समूची व्यवस्था’ appropriately follows the English audit trail’s ‘whole order’ and avoids prematurely narrowing the phrase to ‘creation.’ ‘उद्गम’ is preferable to ‘मूल का पता लगाना’ because it states the intended origin/beginning more explicitly without introducing a different conceptual sense.
  issues:
