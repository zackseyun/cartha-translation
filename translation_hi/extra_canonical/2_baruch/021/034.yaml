  text: Therefore from now on show your greatness, and do not overlook what is brought to nothing under the kingdom of death.
translation:
  language: hi
  text: इसलिए अब से अपनी महानता प्रकट कर, और जो मृत्यु के राज्य के अधीन मिटता जा रहा है, उसकी उपेक्षा न कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܒܘܬܟ (reconstructed from the verse’s attested sense)
  choice: अपनी महानता
  rationale: यह ईश्वर की महिमा या सामर्थ्य को प्रकट करने की प्रार्थना है; ‘महानता’ मूल अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: 'ܡܠܟܘܬܐ ܕܡܘܬܐ (attested sense: kingdom of death)'
  choice: मृत्यु का राज्य
  rationale: राजकीय रूपक और मृत्यु के व्यक्तिकृत शासन—दोनों को सुरक्षित रखता है।
- source_word: 'attested sense: brought to nothing / perishing'
  choice: मिटता जा रहा है
  rationale: विनाश की चल रही दशा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और इसे पूर्ण विनाश के रूप में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: 'attested sense: overlook / disregard'
  choice: उपेक्षा न कर
  rationale: प्रार्थना में प्रयुक्त निषेधात्मक आज्ञा का सीधा और गरिमापूर्ण रूप है।
theological_decisions:
- issue: ‘मृत्यु का राज्य’ का अर्थ
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: मृत्यु की शक्ति / अधीनता
  rationale: मूल अभिव्यक्ति मृत्यु को राज्य करने वाली सत्ता के रूप में प्रस्तुत करती है; इसे केवल ‘शक्ति’ कहना उस चित्र को कमजोर कर देता।
- issue: नाश की अवस्था
  choice: ‘मिटता जा रहा है’
  alternative: ‘नष्ट हो चुका है’ या ‘नाशवान है’
  rationale: यह भाषा प्रक्रिया और वर्तमान संकट को खुला रखती है तथा उद्धार की संभावना को पहले से तय नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; ईश्वर से सीधे संबोधन में एकवचन आज्ञार्थक रूप रखा गया है। शैली प्रार्थनात्मक, संक्षिप्त और गरिमापूर्ण है। उपलब्ध सिरियाई अध्याय-पृष्ठ में पद-सीमा अस्पष्ट है, इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य मानते हुए उसके अर्थ की मूल सिरियाई शब्दावली से संगति सावधानीपूर्वक रखी गई है।
