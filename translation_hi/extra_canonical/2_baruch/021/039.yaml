  text: Bring near those who are sought, and let what began in toil rejoice at the arrival of your glory.
translation:
  language: hi
  text: जिनकी खोज की जाती है, उन्हें निकट ले आ, और जो परिश्रम में आरम्भ हुआ वह तेरी महिमा के आगमन पर आनन्दित हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: (Syriac wording for “bring near”; verse text not cleanly isolated in supplied page bucket)
  choice: निकट ले आ
  rationale: आज्ञार्थक भाव और परमेश्वर से एकवचन सम्बोधन को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: (Syriac wording reflected as “those who are sought”)
  choice: जिन्हें खोजा जा रहा है
  rationale: कर्मवाच्य की वास्तविक अस्पष्टता को बनाए रखता है; यह नहीं तय करता कि खोजने वाला कौन है।
- source_word: (Syriac wording reflected as “toil”)
  choice: परिश्रम
  rationale: कठिन श्रम अथवा कष्ट, दोनों की अर्थ-छाया के लिए सहज और गरिमापूर्ण शब्द है।
- source_word: ܫܘܒܚܐ (šubḥā; reflected in the consultation text as “glory”)
  choice: महिमा
  rationale: ईश्वरीय गौरव और प्रकट वैभव के लिए प्रचलित बाइबलीय हिन्दी शब्द।
theological_decisions:
- issue: ‘जो परिश्रम में आरम्भ हुआ’ का कर्ता या आशय
  choice: वाक्य को अनिर्दिष्ट एकवचन रूप में रखा गया
  alternative: इसे किसी समुदाय, कार्य या उद्धार-प्रक्रिया के रूप में स्पष्ट करना
  rationale: स्रोत-साक्ष्य में आशय स्पष्ट रूप से निर्धारित नहीं है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को आरोपित करने से बचा गया।
- issue: ‘तेरी महिमा का आगमन’
  choice: महिमा के आगमन पर
  alternative: तेरे महिमामय आगमन पर
  rationale: ‘महिमा’ को आगमन की विशेषता बनाने के बजाय उसके अपने आगमन की स्रोतगत अभिव्यक्ति और सम्भावित धर्मवैज्ञानिक तनाव को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट सम्बोधन ‘तेरी’ के साथ प्रार्थनात्मक और गरिमापूर्ण शैली। उपलब्ध सिरियाई अध्याय-बकेट में पद 39 स्पष्ट रूप से पृथक नहीं है और पाठ पृष्ठ-सीमा पर अपूर्ण है; इसलिए शब्दांकन स्रोत के दृश्य अंश, सिरियाई प्रयोग और ऑडिटेड अंग्रेज़ी परामर्श-पाठ को मिलाकर सावधानी से तैयार किया गया है।
