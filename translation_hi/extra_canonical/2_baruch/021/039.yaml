review_pass:
  verdict: revise
  source_fidelity: 'The draft follows the audited source sense closely: an imperative to bring near the sought ones, followed by a wish that what began in toil may rejoice at the coming of the addressee''s glory. However, ''खोजा जा रहा है'' introduces a specifically ongoing, present-progressive sense that is not conveyed by the supplied English audit wording (''are sought'').'
  naturalness: The sentence is clear and suitably prayerful. Recasting the first relative clause as habitual/passive ('जिनकी खोज की जाती है') is more idiomatic for the unmarked sense of 'those who are sought' and avoids implying an action currently underway.
  terminology: '''परिश्रम,'' ''महिमा,'' and the singular devotional address ''तेरी'' are appropriate and consistent. ''महिमा के आगमन'' rightly preserves the wording without converting it into ''तेरे महिमामय आगमन.'''
  issues:
  - severity: low
    issue: Present-progressive nuance in 'जिन्हें खोजा जा रहा है'
    rationale: The progressive construction means 'those who are currently being sought.' The consultation text only supports the less temporally marked passive 'those who are sought'; Hindi can retain that ambiguity with 'जिनकी खोज की जाती है.'
