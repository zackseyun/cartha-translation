  text: And afterward my companions left me, and I came to the cedar where he had spoken with me; and I sat there and fasted seven days.
translation:
  language: hi
  text: इसके बाद मेरे साथी मुझे छोड़कर चले गए, और मैं उस देवदार के पास आया जहाँ उसने मुझसे बात की थी। मैं वहीं बैठ गया और सात दिन तक उपवास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܒܪܐ
  choice: मेरे साथी
  rationale: संदर्भ और क्रिया के बहुवचन अर्थ के अनुसार यह बारूक के साथियों को सूचित करता है; आधुनिक हिन्दी में ‘साथी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ܐܪܙܐ
  choice: देवदार
  rationale: सीरियाई शब्द का सामान्य अर्थ cedar है; ‘देवदार’ इसका प्रचलित हिन्दी वृक्ष-नाम है।
- source_word: ܨܡ̇ܬ
  choice: उपवास किया
  rationale: यह क्रिया धार्मिक उपवास करने को व्यक्त करती है; हिन्दी में यही स्पष्ट और प्रचलित समतुल्य है।
theological_decisions:
- issue: बोलने वाले के लिए सीरियाई पाठ में तृतीय पुरुष सर्वनाम
  choice: उसने
  alternative: परमेश्वर ने
  rationale: मूल पाठ बोलने वाले का नाम स्पष्ट नहीं करता; ‘उसने’ वास्तविक सर्वनामिक अस्पष्टता को बनाए रखता है और व्याख्यात्मक पहचान नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। मूल के क्रम को रखते हुए छोटे वाक्यों को स्वाभाविक हिन्दी प्रवाह में संयोजित किया गया है।
