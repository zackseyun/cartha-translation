translation:
  language: hi
  text: जब मैं बाहर निकला और उन्हें विदा किया, तब मैं वहाँ से चला गया और उनसे कहा, “देखो, मैं हेब्रोन में अपने निवास-स्थान जा रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫ̇ܪܝܘ ܐܢܘܢ
  choice: उन्हें विदा कर चुका
  rationale: क्रिया का मूल भाव छोड़ देने या जाने की अनुमति देने का है। सभा के औपचारिक संदर्भ में “विदा करना” स्वाभाविक और सटीक है।
- source_word: ܠܕܝܪܝ ܠܚܒܪܘܢ
  choice: हेब्रोन में अपने निवास को
  rationale: पाठ में स्थाननाम से पहले निवास या ठहरने के स्थान का संज्ञात्मक उल्लेख है; इस अनुवाद में उस विवरण को बनाए रखते हुए गंतव्य का भाव स्पष्ट रखा गया है।
- source_word: ܗܐ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला प्रत्यक्ष उद्गार है; “देखो” आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: ܐ̇ܙܠܬ ܠܝ ܡܢ ܬܡܢ
  choice: मैं वहाँ से चला गया
  rationale: इसमें वक्ता के उस स्थान से प्रस्थान करने का सीधा कथन है; हिन्दी में “चला गया” प्रसंगानुकूल है।
