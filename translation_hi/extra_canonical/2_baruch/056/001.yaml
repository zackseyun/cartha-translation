  text: 'That great cloud which you saw ascending from the sea and going to cover the earth—understand this: it is the ordering of the world which the Mighty One made when he resolved to create it.[1][2] And it came to pass that, when the word went forth from before him, the establishment of the world arose—fair, small—and it was prepared as it was fitting to be.[3]


    And as for the first black waters which you saw descending from that cloud, this is the sin and transgression which the first Adam committed first. For when he transgressed, death was aroused before its time, and mourning became known, and afflictions were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which appeared in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.[4][5]


    Therefore, because Adam—when he heard from God something of what was to be, and understood that the release of the dead had been given, and had been commanded by God—considered, and he thought five thoughts: for he was condemning himself; he was also condemning the angels; and even at the time when he was created in it, there was for him a seen vision, and the fierce living creatures, and the elements with fire.[6][7]


    And thus God gathered in time, in the likeness in which they had been created.'
translation:
  language: hi
  text: 'जो बड़ा बादल तुमने समुद्र से ऊपर उठते और जाकर इस पृथ्वी को ढकते देखा था[a]—समझ लो कि वह जगत की वह व्यवस्था है जिसे सामर्थी ने तब बनाया, जब उसने सृष्टि करने का निश्चय किया।[b] जब उसके सामने से वचन निकला, तब जगत की स्थापना अस्तित्व में आई—सुंदर, छोटी—और उसे वैसा ही व्यवस्थित किया गया जैसा उसका होना उचित था।[c]


    और जो पहले काले जल तुमने उस बादल से नीचे उतरते देखे थे, वे उस पाप और अपराध को दर्शाते हैं जो पहले आदम ने सबसे पहले किया था।[d] क्योंकि जब उसने अपराध किया, तब मृत्यु अपने समय से पहले ही जाग उठी; शोक प्रकट हुआ, क्लेश तैयार हुए, पीड़ाएँ रची गईं, परिश्रम अपनी पूर्णता तक पहुँचा, और महानता घटने लगी।


    और वह अंतिम दिन, जो एक रूप में दिखाई दिया और जिसने एक समानता धारण की—तुम जानोगे कि समय का लेखा माँगा जाएगा, मानवता का स्वरूप मिटा दिया जाएगा और उसकी शक्ति परखी जाएगी।[e]


    इसलिए आदम ने—जब उसने परमेश्वर से होनेवाली बातों में से कुछ सुना, यह समझा कि मरे हुओं के लिए क्षमा दी गई है, और परमेश्वर से आज्ञा पाई—विचार किया और पाँच विचार सोचे।[f] क्योंकि वह अपने आप को दोषी ठहरा रहा था; वह स्वर्गदूतों के सामने भी अपने आप को दोषी ठहरा रहा था। और जिस समय वह उसमें रचा गया था, उसी समय उसे एक प्रत्यक्ष दर्शन मिला था—भयंकर जीवित प्राणियों का और आग के साथ तत्त्वों का।[g]


    और इस प्रकार परमेश्वर ने उचित समय पर उन्हें उसी समानता में इकट्ठा किया जिसमें वे रचे गए थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सेरियानी के पाठ में ‘जाकर ढक लिया’ है; नियंत्रण-पाठ में केवल ‘ढक लिया’ के लिए समानार्थी क्रिया है। अर्थ में कोई वास्तविक अंतर नहीं है।
    reason: textual_variant
  - marker: b
    text: यहाँ सीरियाई पाठ कठिन है। नियंत्रण-पाठ ‘जगत की व्यवस्था/संरचना, जिसे सामर्थी ने बनाया’ का समर्थन करता है; उपलब्ध सेरियानी पाठ का रूप ‘उसने अपना सामर्थ्य किया’ जैसा पढ़ा जा सकता है। अनुवाद नियंत्रण-पाठ के अधिक सुसंगत अर्थ का अनुसरण करता है।
    reason: textual_variant
  - marker: c
    text: ‘सुंदर, छोटी’ संदर्भ में असामान्य पदावली है। संभव है कि यह जगत की आरंभिक, अभी विकसित हो रही अवस्था की ओर संकेत करे; अनुवाद ने इसे शाब्दिक रूप में सुरक्षित रखा है।
    reason: lexical_alternative
  - marker: d
    text: 'इसे इस प्रकार भी अनूदित किया जा सकता है: ‘वह अपराध है जो प्रथम आदम ने किया।’ मूल में ‘पाप’, ‘अपराध’ और ‘पहले’ की पुनरुक्ति बनी हुई है।'
    reason: lexical_alternative
  - marker: e
    text: इस खंड का वाक्य-विन्यास संक्षिप्त और कई स्थानों पर दुर्लभ है। ‘समानता धारण की’ का सटीक संबंध अस्पष्ट है; और ‘मानवता का स्वरूप मिटा दिया जाएगा’ वाले शब्दों को कुछ लोग ‘मानवता का माप नापा जाएगा’ समझते हैं। यहाँ दुर्लभ संज्ञा को ‘स्वरूप’ और क्रिया को ‘मिटाना’ माना गया है।
    reason: lexical_alternative
  - marker: f
    text: 'शाब्दिक रूप से: ‘पाँच विचार सोचे गए।’ इसके बाद आने वाली संक्षिप्त बातों की पाँच-सदस्यीय गणना सीरियाई पाठ में स्पष्ट नहीं है।'
    reason: textual_variant
  - marker: g
    text: ‘प्रत्यक्ष दर्शन … भयंकर जीवित प्राणी … तत्त्व’ वाला क्रम अत्यंत संक्षिप्त है। अनुवाद ने वाक्यों को किसी निश्चित पाँच-विचार योजना में मिलाने या व्यवस्थित करने का प्रयास नहीं किया है।
    reason: textual_variant
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: बादल
  rationale: दृश्य में समुद्र से उठकर पृथ्वी को ढकने वाले आकाशीय बादल का सामान्य और स्पष्ट अर्थ।
- source_word: ܢܘܓܪܗ ܕܥܠܡܐ
  choice: जगत की व्यवस्था
  rationale: नियोजन, संरचना और सुव्यवस्थित रचना का भाव व्यक्त करता है; नियंत्रण-पाठ के आधार पर इसे ‘अवधि’ नहीं समझा गया।
- source_word: ܚܝܠܬܢܐ
  choice: सामर्थी
  rationale: परमेश्वर के लिए प्रयुक्त उपाधि को संज्ञात्मक रूप में रखा गया है, बिना ‘सर्वशक्तिमान’ जैसी अधिक विशिष्ट धर्मवैज्ञानिक भाषा जोड़े।
- source_word: ܡܠܬܐ
  choice: वचन
  rationale: सृष्टि-संबंधी आदेश की अनुगूँज और मूल शब्द की औपचारिक निकटता दोनों बनाए रखता है।
- source_word: ܩܘܝܡܐ
  choice: स्थापना
  rationale: जगत के खड़े किए जाने अथवा स्थापित क्रम को व्यक्त करता है।
- source_word: ܫܦܝܪ ܙܥܘܪ
  choice: सुंदर, छोटी
  rationale: मूल की विस्मयकारी विशेषण-श्रृंखला को समझाकर समतल करने के बजाय ज्यों का त्यों रखा गया है।
- source_word: ܡܝ̈ܐ ܐܘܟܡ̈ܐ
  choice: काले जल
  rationale: दर्शन के प्रतीकात्मक रंग और जल-चित्र दोनों सुरक्षित रहते हैं।
- source_word: ܐܬܬܙܝܥ
  choice: जाग उठी
  rationale: मृत्यु के समय से पहले सक्रिय या आंदोलित हो जाने का सजीव भाव देता है।
- source_word: ܢܘܡܫܐ ... ܬܬܡܫܚ
  choice: मानवता का स्वरूप मिटा दिया जाएगा
  rationale: दुर्लभ संज्ञा को सावधानी से ‘स्वरूप’ और क्रिया को ‘मिटाना’ माना गया है; इसे ‘माप नापा जाएगा’ बनाकर कठिनाई को छिपाया नहीं गया।
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: मरे हुओं के लिए क्षमा
  rationale: निष्क्रिय ‘दी गई’ के साथ यह परमेश्वर द्वारा मृतकों से संबंधित क्षमा का बोध देता है, न कि आदम द्वारा दी गई क्षमा का।
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: भयंकर जीवित प्राणी
  rationale: इसे ‘कड़वा जीवन’ न मानकर उग्र अथवा भयंकर जीवों का संदर्भ माना गया है।
- source_word: ܐܣܛܘܟܣܐ
  choice: तत्त्व
  rationale: यूनानी मूल के शब्द का ब्रह्मांडीय भौतिक तत्त्वों वाला अर्थ संदर्भ और ‘आग के साथ’ से मेल खाता है।
theological_decisions:
- issue: पृथ्वी को ढकने वाले बड़े बादल का संकेत
  choice: सृष्टि के समय सामर्थी द्वारा स्थापित जगत की व्यवस्था
  alternative: किसी साम्राज्य का प्रभुत्व अथवा न्याय का फैलाव
  rationale: व्याख्या सीधे सृष्टि के निश्चय और वचन के निकलने से जुड़ी है।
- issue: आदम के अपराध पर मृत्यु का समय से पहले जागना
  choice: अपराध ने मृत्यु और उससे जुड़े दुःखों को नियत समय से पहले सक्रिय किया
  alternative: केवल आदम की व्यक्तिगत आयु कम होना
  rationale: मूल में मृत्यु के साथ शोक, क्लेश, पीड़ा और परिश्रम की विश्वव्यापी सूची दी गई है।
- issue: अंतिम दिन और मानवता का स्वरूप
  choice: अंतिम लेखे में समय माँगा जाएगा, मानवता का स्वरूप मिटेगा और उसकी शक्ति परखी जाएगी
  alternative: आदम की निजी मृत्यु का दिन अथवा केवल बाद के किसी काले-जल काल का संकेत
  rationale: अंतिम दिन, समय के लेखे और मानवता की शक्ति की परीक्षा का संयोजन अंतिम न्याय की दिशा में संकेत करता है, पर पाठ से अधिक विवरण नहीं जोड़ा गया।
- issue: मरे हुओं के लिए क्षमा
  choice: परमेश्वर द्वारा दी गई, मृतकों से संबंधित क्षमा
  alternative: आदम द्वारा मृतकों को क्षमा देना अथवा केवल आदम को क्षमा मिलना
  rationale: ‘दी गई’ का निष्क्रिय रूप दैवी अनुदान के अनुकूल है; आगे की पुनरुत्थान-व्यवस्था को स्पष्ट रूप से आरोपित नहीं किया गया।
- issue: आदम का स्वर्गदूतों के सामने दोषी होना
  choice: आदम ने अपने को दोषी माना और स्वर्गदूतों के सामने भी दोषी ठहराया
  alternative: आदम ने स्वर्गदूतों को पापी बनाया
  rationale: संक्षिप्त वाक्य में आत्म-दोष की समानांतरता है; स्वर्गदूतों के पतन का सिद्धांत जोड़ना स्रोत से आगे जाता।
- issue: आग के साथ तत्त्व
  choice: ब्रह्मांडीय तत्त्व
  alternative: वर्णमाला के अक्षर अथवा तात्त्विक आत्माएँ
