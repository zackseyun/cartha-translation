translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि वह समय आ पहुँचा है, जिसके विषय में कहा गया था कि वह समयों का समापन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: समय
  rationale: यहाँ शब्द किसी सामान्य क्षण के बजाय निर्धारित अंतकालीन समय को सूचित करता है; ‘समय’ सहज और संदर्भानुकूल है।
- source_word: ܫܘܠܡܗ ܕܙܒܢܐ / completion formula
  choice: समयों की परिपूर्णता
  rationale: यह अभिव्यक्ति स्रोत की अंतकालीन ‘पूर्णता/समापन’ की धारणा को किसी एक व्याख्या तक सीमित किए बिना बनाए रखती है।
- source_word: ܝܕܥ
  choice: जानेंगे
  rationale: आसपास का वर्णन भविष्यकालीन घटनाओं का है; इसलिए हिन्दी में भावी संदर्भ स्पष्ट करने के लिए भविष्यकाल स्वाभाविक है।
theological_decisions:
- issue: ‘समयों की परिपूर्णता’ का अर्थ
  choice: मुख्य पाठ में पारंपरिक रूपक को बनाए रखा गया
  alternative: ‘युगों का अंत’ या ‘निर्धारित समयों की समाप्ति’
  rationale: स्रोत की अभिव्यक्ति पूर्णता, चरमबिंदु और समापन—इन सभी अर्थछायाओं को धारण कर सकती है; केवल ‘अंत’ कहना इस तनाव को संकुचित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘आ पहुँचा है’ निर्धारित समय के उपस्थित हो जाने का भाव देता है, जबकि ‘परिपूर्णता’ स्रोत की धार्मिक और कालगत अर्थछाया बनाए रखती है।
