translation:
  language: hi
  text: क्योंकि वे जानते हैं कि उनकी यातना आ पहुँची है और उनका विनाश आ गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܫܐ / ܫܘܢܩܐ (अर्थ-परंपरा में ‘torment’)
  choice: यातना
  rationale: यह शारीरिक या मानसिक घोर पीड़ा तथा दंड—दोनों की संभावना बनाए रखता है; ‘सज़ा’ कहने से अर्थ अनावश्यक रूप से संकुचित हो जाता।
- source_word: ܐܒܕܢܐ / ܚܒܠܐ (अर्थ-परंपरा में ‘destruction/perdition’)
  choice: विनाश
  rationale: ‘विनाश’ सामान्य आधुनिक हिन्दी में स्पष्ट है और नाश/पतन की व्यापकता को बनाए रखता है।
- source_word: ‘has come / has arrived’ के अनुरूप पूर्णतासूचक क्रियाएँ
  choice: आ पहुँची है / आ गया है
  rationale: दो निकटार्थी स्रोत-क्रियाओं की समानांतरता रखते हुए हिन्दी में अनावश्यक शब्दशः पुनरावृत्ति से बचाया गया है।
theological_decisions:
- issue: यातना और विनाश को केवल अंतिम न्याय की तकनीकी शब्दावली मानना
  choice: पाठ में सामान्य ‘यातना’ और ‘विनाश’ रखा गया
  alternative: ‘नरक की यातना’ और ‘अनन्त विनाश’
  rationale: स्रोत-साक्ष्य इस पद में ऐसी विशिष्ट धार्मिक व्याख्या को स्पष्ट रूप से नहीं जोड़ता; इसलिए तनाव और व्यापक अर्थ को खुला रखा गया है।
- issue: ज्ञानसूचक क्रिया का काल
  choice: ‘वे जानते हैं’
  alternative: ‘वे जानेंगे’
  rationale: दिए गए अंग्रेज़ी परामर्श-पाठ में वर्तमानकाल है और उपलब्ध अध्याय-बकेट में इस पद की सुनिश्चित पृथक सिरिएक पंक्ति स्पष्ट नहीं है; अतः बिना पर्याप्त आधार के काल नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गंभीर और समानांतर वाक्य-विन्यास। उपलब्ध सिरिएक सामग्री अध्याय-स्तरीय, अतिव्यापी और स्थान-निर्धारण की दृष्टि से अनिश्चित है, इसलिए पद की शब्दशः पुनर्रचना के बजाय सुरक्षित अर्थ-साक्ष्य और जाँचे हुए अंग्रेज़ी परामर्श-पाठ का संयमित उपयोग किया गया है।
