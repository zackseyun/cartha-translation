base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030/002.yaml
  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: hi
  text: और उस समय ऐसा होगा कि उन भंडारों को खोल दिया जाएगा, जिनमें धर्मियों के प्राणों की संख्या रखी हुई है[a]। तब वे बाहर निकलेंगे, और प्राणों का विशाल समूह एकमत होकर एक ही सभा में दिखाई देगा। पहले वाले आनन्दित होंगे, और बाद वाले दुःखी नहीं होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राणों की संख्या’ का अर्थ उनकी निश्चित संख्या या उनका पूरा समुदाय हो सकता है।
    reason: मूल अभिव्यक्ति की अर्थगत व्यापकता और संभावित सामूहिक अर्थ को स्पष्ट करना।
  - marker: b
    text: ‘पहले वाले’ और ‘बाद वाले’ किन लोगों को कहते हैं, यह पाठ स्पष्ट नहीं करता।
    reason: कालक्रम-संबंधी वास्तविक अस्पष्टता को बिना किसी विशेष व्याख्या के सुरक्षित रखना।
lexical_decisions:
- source_word: ܐܘܚܪܐ / storehouses (contextually reconstructed)
  choice: भंडार
  rationale: यह परलोक में सुरक्षित रखे गए धर्मियों के प्राणों के लिए प्रयुक्त रूपक को बनाए रखता है और सामान्य हिन्दी में सहज है।
- source_word: ܢܦܫ̈ܬܐ / souls
  choice: प्राण
  rationale: यहाँ देह से अलग सुरक्षित और फिर प्रकट होने वाले व्यक्तियों के जीवन/आत्मिक अस्तित्व का संकेत है; ‘प्राण’ आधुनिक हिन्दी में गरिमापूर्ण है और अत्यधिक दार्शनिक अर्थ आरोपित नहीं करता।
- source_word: number
  choice: गिनती
  rationale: मूल अभिव्यक्ति में धर्मियों के प्राणों की निश्चित संख्या या पूर्ण समुदाय—दोनों की संभावना बनी रहती है; ‘गिनती’ उस ठोस रूपक को सुरक्षित रखती है।
- source_word: one thought/mind
  choice: एक ही मन होकर
  rationale: यह केवल एक स्थान पर एकत्र होने के साथ-साथ उनकी आंतरिक एकता को भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: first … last
  choice: पहले वाले … बाद वाले
  rationale: कालक्रम या क्रम का मूल विरोध सुरक्षित रखा गया है; इसे किसी विशिष्ट पीढ़ी या श्रेणी के रूप में अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: धर्मियों के प्राणों का भंडारों में सुरक्षित होना
  choice: रूपकात्मक कथन को ज्यों का त्यों रखा गया
  alternative: इसे सीधे ‘मृत धर्मी परमेश्वर के पास सुरक्षित हैं’ कहना
  rationale: मूल का ब्रह्मांड-वर्णन और उसका रहस्य बना रहना चाहिए; व्याख्यात्मक सरलीकरण पाठ में नहीं जोड़ा गया।
- issue: ‘पहले’ और ‘बाद वाले’ की पहचान
  choice: पहचान को खुला रखा गया
  alternative: उन्हें प्राचीन और अंतिम पीढ़ियों अथवा पहले और बाद में मरने वालों के रूप में स्पष्ट करना
  rationale: पाठ स्वयं इन समूहों की निश्चित पहचान नहीं बताता, इसलिए धर्मवैज्ञानिक तनाव और अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सहज रखी गई है। ‘भंडार’, ‘प्राण’, ‘सभा’ और ‘एक ही मन’ जैसे शब्द दर्शनात्मक दृश्य को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठकों के लिए स्पष्ट है।
