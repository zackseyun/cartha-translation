  text: And it will happen after these things, when the time of the coming of the Messiah is completed and he returns with glory, then all those who sleep in hope of him will rise.
translation:
  language: hi
  text: 'इन बातों के बाद ऐसा होगा: जब मसीह के आगमन का समय पूरा हो जाएगा और वह महिमा के साथ लौटेगा, तब वे सभी, जो उस पर आशा रखते हुए सो गए हैं, जी उठेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܐܬܝܬܗ ܕܡܫܝܚܐ
  choice: मसीह का आगमन
  rationale: यह पदबंध मसीह के आने या आगमन के समय को सूचित करता है; ‘आगमन’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ܢܬܦܣܩ
  choice: पूरा हो जाएगा
  rationale: क्रिया में पूर्ण होने या समाप्ति तक पहुँचने का भाव है; यहाँ कालावधि के पूरा होने का अर्थ प्रसंगानुकूल है।
- source_word: ܒܬܫܒܘܚܬܐ
  choice: महिमा के साथ
  rationale: महिमा-संबंधी पदबंध को साधन/संगति के खुले भाव में रखा गया है और उसे किसी विशिष्ट धर्मवैज्ञानिक व्याख्या तक सीमित नहीं किया गया।
- source_word: ܕܡܟܝܢ ... ܒܣܒܪܗ
  choice: जो उस पर आशा रखते हुए सो गए हैं
  rationale: ‘सोना’ मृत्यु के लिए प्रयुक्त मूल रूपक को बनाए रखता है, जबकि ‘उस पर आशा रखते हुए’ मसीह पर टिकी आशा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܢܩܘܡܘܢ
  choice: जी उठेंगे
  rationale: संदर्भ में यह साधारण खड़े होने के बजाय मृतकों के पुनरुत्थान को दर्शाता है; ‘जी उठेंगे’ हिन्दी बाइबलीय भाषा में स्पष्ट है।
theological_decisions:
- issue: मसीह के आगमन का समय और उसका महिमा के साथ लौटना
  choice: 'दोनों को एक ही कालगत शर्त में रखा गया है: समय पूरा होगा और वह लौटेगा'
  alternative: ‘आगमन पूरा होने’ को स्वयं मसीह की सेवकाई या शासन की समाप्ति मानना
  rationale: उपलब्ध सिरियाई साक्ष्य और परामर्श-पाठ काल के पूरा होने के बाद महिमामय लौटने का क्रम देते हैं; अनावश्यक रूप से किसी विशिष्ट अंतकालीन व्यवस्था को आरोपित नहीं किया गया।
- issue: ‘सो गए’ लोगों की पहचान
  choice: उन्हें वे सभी कहा गया है जो मसीह पर आशा रखते हुए मरे
  alternative: इसे सभी मृतकों के सार्वभौमिक पुनरुत्थान के रूप में विस्तार देना
  rationale: पद आशा की योग्यता को स्पष्ट रूप से बनाए रखता है; पाठ से आगे बढ़कर अन्य समूहों के विषय में दावा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। ‘सो गए हैं’ के मृत्यु-रूपक और ‘जी उठेंगे’ के पुनरुत्थानार्थ को साथ रखा गया है। स्रोत-पृष्ठ में अध्याय-सीमा और OCR संबंधी विकृतियाँ हैं, इसलिए अनुवाद को पहचाने जा सकने वाले सिरियाई पदबंधों तथा नियंत्रित अध्याय-साक्ष्य से मिलाकर तैयार किया गया है।
