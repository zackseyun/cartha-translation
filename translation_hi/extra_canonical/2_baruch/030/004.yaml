translation:
  language: hi
  text: परन्तु दुष्टों की आत्माएँ, जब वे ये सब बातें देखेंगी, तो और भी अधिक क्षीण हो जाएँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܦܫ̈ܬܐ / ܢܦ̈ܫܐ (reconstructed from the verse tradition)
  choice: प्राण
  rationale: यहाँ आशय मृत्यु के बाद बने रहने वाले व्यक्तियों के प्राणों से है; ‘प्राण’ इस संदर्भ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ܕܪ̈ܫܝܥܐ (reconstructed from the verse tradition)
  choice: दुष्टों के
  rationale: नैतिक अर्थ वाले ‘wicked’ के लिए आधुनिक मानक हिन्दी में सीधा और पारंपरिक समतुल्य।
- source_word: ܢܬܡܣܝ̈ܢ / wasting-away expression (verse tradition)
  choice: क्षीण हो जाएँगे
  rationale: विनाश का अर्थ जोड़े बिना लगातार गलने, दुर्बल पड़ने या मुरझाने का भाव सुरक्षित रखता है।
- source_word: ܝܬܝܪܐܝܬ / comparative expression (verse tradition)
  choice: और भी अधिक
  rationale: दुःख अथवा क्षीणता की बढ़ी हुई मात्रा को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: दुष्टों के प्राणों की मरणोत्तर दशा
  choice: ‘प्राण ... क्षीण हो जाएँगे’
  alternative: ‘आत्माएँ नष्ट हो जाएँगी’
  rationale: पाठ क्षीण होने की बात करता है, पूर्ण अस्तित्व-समाप्ति की नहीं; इसलिए किसी विशिष्ट मरणोत्तर सिद्धान्त को आरोपित नहीं किया गया।
- issue: ‘ये सब बातें’ का संदर्भ
  choice: सर्वनामात्मक संदर्भ को खुला रखा गया
  alternative: पुनरुत्थान और धर्मियों की महिमा को स्पष्ट रूप से जोड़ना
  rationale: पद अपने निकटवर्ती प्रसंग की ओर संकेत करता है; अनुवाद में व्याख्यात्मक विस्तार जोड़ना मूल की संक्षिप्तता और संभावित व्यापक संदर्भ को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। उपलब्ध अध्याय-बकेट में पद-विभाजन और पाठ-क्रम अस्पष्ट है, इसलिए निर्णय सिरियाई पद-परंपरा तथा प्रदत्त परामर्श-पाठ से नियंत्रित पुनर्निर्माण पर आधारित हैं।
