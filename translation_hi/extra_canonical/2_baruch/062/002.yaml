translation:
  language: hi
  text: और वह सारी दुष्टता जो उसके बाद के राजाओं ने अधर्मपूर्वक की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܘܬܐ
  choice: दुष्टता
  rationale: यह नैतिक बुराई या दुष्कर्म का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ܡ̈ܠܟܐ
  choice: राजाओं
  rationale: बहुवचन ‘राजाओं’ मूल के सामूहिक ऐतिहासिक संकेत को बनाए रखता है।
- source_word: ܥܘܠܐ
  choice: अधर्म
  rationale: ‘अधर्म’ अन्याय और धार्मिक-अनैतिक दोष, दोनों अर्थ-छायाओं को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: दुष्टता और अधर्म के बीच संबंध
  choice: ‘अधर्म में ... दुष्टता की’
  alternative: ‘अन्यायपूर्वक ... बुरे काम किए’
  rationale: यह मूल की दो अलग नैतिक संकल्पनाओं को एक-दूसरे में मिलाए बिना बनाए रखता है और किसी विशिष्ट धर्मवैधानिक व्याख्या को नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्यांशात्मक शैली मूल पद के पूर्ववर्ती संदर्भ पर निर्भर होने के स्वरूप को बनाए रखती है।
