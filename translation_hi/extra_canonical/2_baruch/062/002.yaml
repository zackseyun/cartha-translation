  to: और वह सारी दुष्टता जो उसके बाद के राजाओं ने अधर्मपूर्वक की।
  rationale: The revision preserves the verse as a context-dependent fragment while making the totality of the wickedness and the relative relation to the later kings idiomatic in modern standard Hindi. No footnote is needed.
