review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the three essential elements reflected in the source/audit trail: the kings subsequent to the antecedent, their unrighteous manner, and the totality of their wickedness. Its final placement of “वह सब” is an unnecessarily literal calque and weakens the relative-clause structure.'
  naturalness: “और उसके बाद के राजाओं ने अधर्म में जितनी भी दुष्टता की, वह सब” is understandable, but the sentence-final “वह सब” is awkward in modern Hindi. A fronted noun phrase and relative clause are both natural and retain the source's dependent, fragmentary discourse shape.
  terminology: “दुष्टता” suitably renders moral wickedness, and “अधर्मपूर्वक” renders the adverbial sense of acting in unrighteousness more idiomatically than “अधर्म में,” without collapsing wickedness into unrighteousness. “राजाओं” is appropriate for the plural.
  issues:
  - severity: low
    issue: Awkward sentence-final resumptive phrase
    rationale: “वह सब” after the completed clause is less natural Hindi; “वह सारी दुष्टता जो…” expresses the same totality clearly.
  - severity: low
    issue: Non-idiomatic rendering of the adverbial ethical phrase
    rationale: “अधर्म में … की” is possible but stiff. “अधर्मपूर्वक … की” naturally conveys that the kings committed the acts unrighteously.
  revised_text: और वह सारी दुष्टता जो उसके बाद के राजाओं ने अधर्मपूर्वक की।
  revised_footnotes: []
  revision_rationale: The revision preserves the verse as a context-dependent fragment while making the totality of the wickedness and the relative relation to the later kings idiomatic in modern standard Hindi. No footnote is needed.
