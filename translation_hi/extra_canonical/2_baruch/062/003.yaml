translation:
  language: hi
  text: और ईज़ेबेल के काम, और उस समय इस्राएल द्वारा की जानेवाली मूर्तिपूजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܕܝܗ̇
  choice: उसके काम
  rationale: सिरियाई शब्द का सामान्य अर्थ ‘काम’ या ‘कर्म’ है; ‘श्राप’ पाठ-समर्थित अर्थ नहीं है। वाक्य में स्पष्टता के लिए नाम के साथ ‘ईज़ेबेल के काम’ रखा गया है।
- source_word: ܣܓܕܬܐ
  choice: मूर्तिपूजा
  rationale: यहाँ संदर्भ मूर्तियों के आगे दण्डवत या उपासना करने का है; स्वाभाविक हिन्दी में ‘मूर्तिपूजा’ इसका संक्षिप्त और स्पष्ट रूप है।
- source_word: ܐܝܣܪܐܝܠ
  choice: इस्राएल
  rationale: व्यक्ति के बजाय सामूहिक राष्ट्र/प्रजा का नाम होने के कारण प्रचलित बाइबलीय रूप ‘इस्राएल’ रखा गया है।
theological_decisions:
- issue: ईज़ेबेल से संबद्ध शब्द का अर्थ
  choice: काम
  alternative: श्राप
  rationale: उपलब्ध सिरियाई साक्ष्य ‘काम/कर्म’ का समर्थन करता है। ‘श्राप’ चुनने से पाठ में ऐसा धार्मिक अर्थ जुड़ता जो स्रोत में नहीं है।
- issue: मूर्तियों के प्रति इस्राएल की क्रिया
  choice: मूर्तिपूजा
  alternative: मूर्तियों को दण्डवत करना
  rationale: दोनों अर्थ-संगत हैं, पर ‘मूर्तिपूजा’ आधुनिक हिन्दी पाठक के लिए अधिक सहज है और उपासना के धार्मिक आशय को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सहज रूप। मूल पद की सूची-जैसी, पूर्ववर्ती वाक्य पर निर्भर संरचना को बनाए रखने के लिए वाक्य ‘और’ से आरम्भ किया गया है।
