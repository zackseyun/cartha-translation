translation:
  language: hi
  text: और अश्शूर का राजा शल्मनेसेर आया और उन्हें बंदी बनाकर ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܠܡܢܐܣܪ
  choice: शल्मनेसेर
  rationale: राजा के नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: ܡܠܟܐ ܕܐܬܘܪ
  choice: अश्शूर का राजा
  rationale: सामी संबंध-वाक्यांश को स्वाभाविक हिन्दी संबंध-रचना में व्यक्त किया गया है।
- source_word: ܫܒܐ / ܓܠܐ
  choice: बंदी बनाकर ले गया
  rationale: निर्वासन में बंदी करके ले जाने की संयुक्त धारणा को सहज और स्पष्ट हिन्दी में रखा गया है; केवल ‘पकड़ लिया’ कहना अर्थ को अधूरा करता।
theological_decisions: []
translation_notes:
  register: वाक्य को आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट हिन्दी में रखा गया है। उपलब्ध सिरियाई सामग्री अध्याय-पृष्ठों का अतिव्यापी संग्रह है और उसमें लक्षित पद साफ़ अलग नहीं दिखता; इसलिए नाम, पदवी और बंदी बनाकर ले जाने की क्रिया के लिए मूल-सिरियाई परंपरा के अनुरूप रूप रखते हुए अंग्रेज़ी POB को परामर्श-साक्ष्य के रूप में जाँचा गया है।
