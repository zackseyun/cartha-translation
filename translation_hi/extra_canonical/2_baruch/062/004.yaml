translation:
  language: hi
  text: और वर्षा का रुक जाना, तथा वे अकाल जो पड़े—यहाँ तक कि स्त्रियों ने अपने गर्भ का फल खाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܪܐ
  choice: वर्षा
  rationale: यह सामान्य और गरिमापूर्ण आधुनिक हिन्दी में ‘बारिश/वर्षा’ का स्वाभाविक रूप है।
- source_word: ܟܦܢܐ
  choice: अकाल
  rationale: सन्दर्भ में यह भोजन की घोर कमी और भूखमरी की ऐतिहासिक विपत्ति को व्यक्त करता है।
- source_word: ܦܐܪܐ ܕܟܪܣܗܝܢ
  choice: अपने गर्भ का फल
  rationale: मूल की तीखी और शाब्दिक छवि को बनाए रखता है; इसे नरम या व्याख्यात्मक नहीं बनाया गया।
theological_decisions:
- issue: विपत्तियों के कर्ता या दैवी कारण का प्रश्न
  choice: वर्षा रुकने और अकाल पड़ने का वर्णन बिना किसी अतिरिक्त कर्ता के किया गया
  alternative: इसे स्पष्ट रूप से परमेश्वर द्वारा भेजा गया दण्ड कहना
  rationale: इस पद की भाषा घटनाओं को गिनाती है; अनुवाद में ऐसा दैवी कर्तृत्व नहीं जोड़ा गया जो यहाँ प्रत्यक्ष रूप से व्यक्त नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य में सूची-जैसा प्रवाह रखा गया है और अंतिम वीभत्स परिणति को मूल के अनुरूप स्पष्ट, संयत और गरिमापूर्ण ढंग से व्यक्त किया गया है।
