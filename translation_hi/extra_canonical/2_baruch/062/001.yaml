  text: And the seventh black waters that you saw—this is the perversion brought about by the counsel of Jeroboam, who took counsel to make two calves of gold.
translation:
  language: hi
  text: और जो सातवाँ काला जल तुमने देखा था—यह यारोबाम की उस योजना से उत्पन्न विकृति है,[a] जिसके अनुसार उसने सोने के दो बछड़े बनाने का निश्चय किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह विकृति है”; कुछ अनुवाद जल के बहुवचन के अनुसार “ये विकृतियाँ हैं” देते हैं।
    reason: सिरियाई के एकवचन विधेय-संबंध और पूर्ववर्ती बहुवचन ‘जल’ के कारण उत्पन्न अनुवादगत भिन्नता को स्पष्ट करना।
lexical_decisions:
- source_word: ܡ̈ܝܐ ܚܫ̈ܟܐ / ܐܘܟܡ̈ܐ
  choice: काला जल
  rationale: दर्शन में प्रतिकूल और अनुकूल जल की क्रमिक प्रतीकात्मक शृंखला है। ‘काला’ उस तीखे रंग-विरोध को ‘अंधकारमय’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: ܚܒܠܬܐ
  choice: विकृति
  rationale: यह शब्द यारोबाम द्वारा लाई गई धार्मिक और राजनीतिक बिगाड़ को व्यक्त करता है; ‘विकृति’ नैतिक अर्थ को रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ܡܠܟܐ / control-backed counsel wording
  choice: योजना; निश्चय किया
  rationale: मूल में परामर्श/विचार करने की पुनरुक्ति को हिन्दी में अर्थपूर्ण और सहज रूप से व्यक्त करने के लिए ‘योजना’ और ‘निश्चय किया’ चुने गए हैं।
- source_word: ܥܓ̈ܠܐ ܕܕܗܒܐ / control-backed phrase
  choice: सोने के दो बछड़े
  rationale: यारोबाम के बनाए दो स्वर्ण-बछड़ों का ठोस संदर्भ बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘जल’ के बहुवचन और ‘विकृति’ के एकवचन के बीच व्याकरणिक संबंध
  choice: यह ... विकृति है
  alternative: ये ... विकृतियाँ हैं
  rationale: नियंत्रक सिरियाई पाठ में स्त्रीलिंग एकवचन संकेतवाचक और योजक पद विधेय ‘विकृति’ के अनुरूप हैं। इसलिए बहुवचन ‘जल’ के प्रभाव में अर्थ को बहुवचन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रखा गया है। ‘परामर्श किया’ की अस्वाभाविक पुनरुक्ति से बचते हुए मूल का विचार/योजना वाला अर्थ सुरक्षित रखा गया है।
