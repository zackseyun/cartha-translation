  text: But concerning the nations, it would be too much to tell how they continually acted in impiety and wickedness and never showed themselves righteous.
translation:
  language: hi
  text: परन्तु जातियों के विषय में विस्तार से बताना बहुत लंबा हो जाएगा कि वे कैसे निरन्तर अधर्म और दुष्टता करती रहीं और कभी धर्मी दिखाई नहीं दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡ̈ܡܐ
  choice: जातियाँ
  rationale: यह सामूहिक रूप से इस्राएल से बाहर की जातियों को सूचित करता है; आधुनिक हिन्दी में ‘जातियाँ’ प्रसंग के लिए स्वाभाविक और अनावश्यक रूप से व्याख्यात्मक नहीं है।
- source_word: ܥܘܠܐ
  choice: अधर्म
  rationale: यह ईश्वर-विरोधी और अन्यायपूर्ण आचरण का व्यापक नैतिक भाव बनाए रखता है।
- source_word: ܒܝܫܘܬܐ
  choice: दुष्टता
  rationale: ‘अधर्म’ के साथ स्रोत की समानांतर किन्तु अलग नैतिक संज्ञा को सुरक्षित रखता है।
- source_word: ܙܕܝܩܐ / ܙܕܝܩܘܬܐ
  choice: धर्मी सिद्ध होना
  rationale: सिर्फ भीतर की दशा नहीं, आचरण में धार्मिकता प्रकट होने का भाव व्यक्त करता है।
theological_decisions:
- issue: जातियों के विषय में व्यापक नकारात्मक कथन
  choice: स्रोत के सामूहिक और निरन्तर आचरण-संबंधी कथन को यथावत रखा गया
  alternative: कथन को नरम करके केवल कुछ जातियों या कुछ अवसरों तक सीमित करना
  rationale: ऐसी सीमा स्रोत में स्पष्ट नहीं है; अनुवाद को पाठ की कठोरता या तनाव को चुपचाप कम नहीं करना चाहिए।
- issue: ‘धर्मी’ का अर्थ
  choice: ‘कभी धर्मी सिद्ध नहीं हुईं’
  alternative: ‘कभी कोई अच्छा काम नहीं किया’
  rationale: ‘धर्मी’ न्याय/धार्मिकता की मूल अवधारणा को बनाए रखता है और इसे सामान्य नैतिक अच्छाई तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सहज और सार्वजनिक पाठ के अनुकूल शैली। ‘यह बताना बहुत लंबा होगा’ मूल के विस्तार से वर्णन करने की कठिनता/अधिकता को स्वाभाविक हिन्दी में व्यक्त करता है। उपलब्ध सिरिएक अध्याय-बकेट में पृष्ठ-अतिव्यापन और पाठ-विकृति है, इसलिए पद की पहचान में परामर्श-पाठ को नियंत्रण-साक्ष्य के रूप में सावधानी से उपयोग किया गया है।
