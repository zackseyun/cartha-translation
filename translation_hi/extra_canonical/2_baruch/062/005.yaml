translation:
  language: hi
  text: और वह समय भी, जब साढ़े नौ गोत्र अपने बहुत-से पापों के कारण बंदी बनाए गए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साढ़े नौ गोत्रों का वह बंदीवास भी, जो उन पर आया।”
    reason: स्रोत-वाक्य को ‘समय’ के बजाय ‘बंदीवास’ को प्रधान बनाकर भी समझा जा सकता है।
  - marker: b
    text: अधिक शाब्दिक रूप में, “क्योंकि वे बहुत-से पापों में पड़े थे।”
    reason: सामी मुहावरे के अधिक शाब्दिक रूप को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: वह समय
  rationale: यह पद घटनाओं या युगों की सूची का अंश है; इसलिए काल-सूचक अर्थ को स्पष्ट रखा गया है।
- source_word: ܫܒܝܬܐ / ܫܒܝܘܬܐ
  choice: बंदी बनाए गए
  rationale: बंधुआई/निर्वासन के भाव को साधारण आधुनिक हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है।
- source_word: ܬܫܥܐ ܘܦܠܓܘܬ ܫܒܛ̈ܐ
  choice: साढ़े नौ गोत्र
  rationale: इस्राएली जनसमूहों के लिए पारंपरिक और अर्थ-सटीक पदावली रखी गई है।
- source_word: ܚܛܗ̈ܐ ܣܓܝ̈ܐܐ
  choice: बहुत-से पाप
  rationale: बहुवचन और पापों की अधिकता—दोनों को सुरक्षित रखा गया है।
theological_decisions:
- issue: बंधुआई और पापों के बीच कारण-संबंध
  choice: अपने बहुत-से पापों के कारण
  alternative: क्योंकि वे बहुत-से पापों में पड़े थे
  rationale: स्रोत का कारण-संबंध रखा गया है, पर हिन्दी में अस्वाभाविक सामी मुहावरे को सहज बनाया गया है; वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- issue: वाक्य का केंद्र ‘समय’ है या ‘बंधुआई’
  choice: वह समय भी, जब... बंदी बनाए गए
  alternative: साढ़े नौ गोत्रों की वह बंधुआई भी, जो उन पर आई
  rationale: मुख्य पाठ में काल-सूचक संज्ञा को प्रधान रखा गया है, जबकि वाक्य-विन्यास की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘साढ़े नौ गोत्र’ ऐतिहासिक-बाइबलीय संदर्भ को बनाए रखता है, और ‘बंदी बनाए गए’ सामान्य पाठक के लिए ‘बंधुआई में गए’ से अधिक स्वाभाविक है।
