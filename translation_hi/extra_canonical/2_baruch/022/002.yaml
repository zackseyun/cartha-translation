lexical_decisions:
- source_word: ܒܪܘܟ ܒܪܘܟ
  choice: बारूक, बारूक!
  rationale: नाम की पुनरावृत्ति को ज्यों का त्यों रखा गया है; विस्मयादिबोधक चिह्न संबोधन की तीव्रता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: ܠܡܝܟ
  choice: क्यों
  rationale: यह प्रश्नवाचक कारण को पूछता है; आधुनिक हिन्दी में ‘क्यों’ सीधा और स्वाभाविक है।
- source_word: ܡܬܚܘܐ ܐܢܬ
  choice: तुम व्याकुल हो
  rationale: संदर्भ में यह बारूक की मानसिक अशांति या उद्विग्नता को दर्शाता है; ‘व्याकुल’ गरिमापूर्ण और सामान्यतः बोधगम्य है, जबकि भाव की सटीक सीमा को अनावश्यक रूप से नहीं बाँधता।
theological_decisions:
- issue: बारूक की अवस्था का स्वरूप
  choice: व्याकुल
  alternative: दुःखी / परेशान
  rationale: मूल पद मानसिक अशांति को व्यक्त करता है, पर उसके कारण या धार्मिक मूल्यांकन को स्पष्ट नहीं करता। ‘व्याकुल’ इस खुलापन को बनाए रखता है।
