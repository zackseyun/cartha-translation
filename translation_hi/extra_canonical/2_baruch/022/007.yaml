  text: या क्या गर्भवती स्त्री, यदि वह बिना प्रसव-पीड़ा के जन्म दे, यह आशा नहीं करती कि उसके गर्भ में मरा हुआ बच्चा हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܬܬܐ ܕܒܛܢܐ
  choice: गर्भवती स्त्री
  rationale: यह सिरिएक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ܬܠܕ ܕܠܐ ܟܐܒ̈ܐ
  choice: बिना प्रसव-पीड़ा के जन्म दे
  rationale: ܟܐܒ̈ܐ का शाब्दिक अर्थ ‘पीड़ाएँ’ है; प्रसंग जन्म का होने से ‘प्रसव-पीड़ा’ अर्थ स्पष्ट करता है।
- source_word: ܩܛܝܠܐ
  choice: मरा हुआ बच्चा
  rationale: शब्द का मूल भाव ‘मारा हुआ/मृत’ है; गर्भ के संदर्भ में वर्तमान हिन्दी में यह सहज अभिव्यक्ति है, जबकि मृत्यु के कारण को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ܒܥܘܒܗ̇
  choice: उसके गर्भ में
  rationale: यहाँ ‘भीतर/गोद में’ का बिंब गर्भवती स्त्री के संदर्भ में गर्भ को सूचित करता है।
theological_decisions:
- issue: अलंकारिक प्रश्न की अपेक्षित दिशा
  choice: 'प्रश्न को उसी असामान्य और तनावपूर्ण रूप में रखा गया है: पीड़ारहित जन्म और मृत बच्चे की आशा।'
  alternative: इसे अर्थ-सुधार करके जीवित बच्चे की आशा या मृत बच्चे के भय के रूप में लिखना।
  rationale: सिरिएक पाठ की वास्तविक कठिनाई को बिना पांडुलिपीय आधार के हल नहीं किया गया; अंग्रेज़ी परामर्श-पाठ भी इसी अर्थ-संरचना की पुष्टि करता है।
