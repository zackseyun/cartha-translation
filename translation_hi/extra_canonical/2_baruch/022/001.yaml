  text: 'And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:'
translation:
  language: hi
  text: 'इन बातों के बाद ऐसा हुआ कि, देखो, मैंने एक आवाज़ सुनी और मुझ पर स्थिर किया हुआ एक सामर्थ्य देखा। तब ऊपर से एक आवाज़ सुनाई दी और उसने मुझसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܐ (ḥaylā)
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति, बल या सामर्थ्य का अर्थ दे सकता है। यहाँ किसी प्रत्यक्ष हुई दिव्य शक्ति का संकेत है; ‘सामर्थ्य’ मूल की व्यापकता बनाए रखता है।
- source_word: ܕܐܬܩܒܥ ܠܝ (d-ethqbaʿ lī)
  choice: मुझ पर स्थिर हो गया है
  rationale: शाब्दिक भाव ‘मेरे लिए/मुझ पर स्थापित या स्थिर किया गया’ है। प्रसंग में अनुभव बारूक पर आ ठहरने वाली शक्ति का है; यह रूप हिन्दी में स्वाभाविक रहते हुए मूल के निष्क्रिय और स्थायित्वसूचक भाव को सुरक्षित रखता है।
- source_word: ܡܢ ܡܪܘܡܐ (men mrawmā)
  choice: ऊपर से
  rationale: शाब्दिक अर्थ ‘ऊँचाई से’ या ‘ऊर्ध्व स्थान से’ है। ‘ऊपर से’ सहज हिन्दी है और बिना अनावश्यक व्याख्या जोड़े दिशा-संबंधी अर्थ देता है।
theological_decisions:
- issue: देखे गए ‘सामर्थ्य’ की पहचान
  choice: इसे केवल ‘एक सामर्थ्य’ कहा गया है
  alternative: इसे परमेश्वर, स्वर्गदूत या पवित्र आत्मा के रूप में स्पष्ट करना
  rationale: सिरिएक पाठ उस शक्ति की पहचान स्पष्ट नहीं करता; इसलिए धार्मिक पहचान जोड़कर मूल की अस्पष्टता को समाप्त नहीं किया गया।
- issue: ऊपर से आने वाली आवाज़ का वक्ता
  choice: वक्ता को अनाम रखा गया है
  alternative: ‘परमेश्वर की आवाज़’ कहना
  rationale: इस पद में केवल ऊपर से सुनाई देने वाली आवाज़ का उल्लेख है; वक्ता की पहचान अगले कथन या व्यापक प्रसंग पर छोड़ी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘देखो’ का यांत्रिक अनुवाद न करके ‘कि’ के साथ घटनाक्रम को स्वाभाविक बनाया गया है; विस्मयसूचक ध्यान मूल के दृश्य-श्रव्य वर्णन में निहित रहता है।
