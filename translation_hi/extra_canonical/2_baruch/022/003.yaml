  text: Does one who sets out on a road fail to find it? Or can one who sails on the sea find rest unless he reaches the harbor?
translation:
  language: hi
  text: क्या मार्ग पर निकलने वाला उसे नहीं पाता? या समुद्र में यात्रा करने वाला बंदरगाह पहुँचे बिना विश्राम पा सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ
  choice: मार्ग
  rationale: यह ‘रास्ता/मार्ग’ का सामान्य अर्थ देता है और वाक्य की गरिमा बनाए रखता है।
- source_word: ܦܪܫ ܒܝܡܐ
  choice: समुद्र में यात्रा करने वाला
  rationale: मुहावरे का आशय समुद्री यात्रा पर निकलना है; हिन्दी में यह शब्दशः रूप से अधिक स्वाभाविक है।
- source_word: ܠܡܐܢܐ
  choice: बंदरगाह
  rationale: समुद्री यात्रा के गंतव्य और विश्राम-स्थल के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ܢܬܢܝܚ
  choice: विश्राम पा सकता है
  rationale: मूल में निहित विश्राम या चैन पाने के भाव को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: पहले प्रश्न में सर्वनाम ܠܗ का संदर्भ
  choice: ‘उसे’ रखकर संदर्भ की अस्पष्टता सुरक्षित रखी गई
  alternative: ‘अपनी मंज़िल’ या ‘मार्ग का अंत’
  rationale: सिरियाई पाठ स्पष्ट रूप से मंज़िल या अंत नहीं कहता; ऐसी व्याख्या जोड़ना मूल की वास्तविक अस्पष्टता को मिटा देता।
