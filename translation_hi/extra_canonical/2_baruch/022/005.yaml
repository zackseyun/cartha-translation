translation:
  language: hi
  text: या जो कोई भूमि में बीज बोता है—यदि वह फल पाने के बदले कुछ खो दे,[a] तो क्या अकाल उसे फिर नष्ट करता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सिरिएक में ‘खो दे’ का कर्म व्यक्त नहीं है; शाब्दिक रूप से, ‘यदि वह अपने फलों के बदले खो दे’ है। ‘कुछ’ इस लुप्त कर्म को निश्चित किए बिना हिन्दी को स्वाभाविक बनाता है।
    reason: मूल वाक्यांश की व्याकरणिक और अर्थगत अनिश्चितता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ܙܪܥ ܐܪܥܐ
  choice: धरती में बीज बोता है
  rationale: सिरिएक क्रिया ܙܪܥ और संज्ञा ܐܪܥܐ का स्वाभाविक तथा निकट हिन्दी रूप।
- source_word: ܡܘܒܕ
  choice: गँवा दे
  rationale: यह रूप ‘खोना/नष्ट करना’ का अर्थ देता है; हिन्दी में लुप्त कर्म को प्रसंगानुसार ‘अपना बीज’ से स्पष्ट किया गया है।
- source_word: ܚܠܦ ܦܐܪ̈ܘܗܝ
  choice: उसके फल पाने के बदले
  rationale: ܚܠܦ का मूल भाव ‘के बदले’ रखा गया है और प्रत्यय को धरती की उपज/फल से जोड़ा गया है।
- source_word: ܡܚܒܠ ܠܗ ܟܦܢܐ
  choice: अकाल उसे बरबाद नहीं कर देता
  rationale: रूपक के परिणाम और सिरिएक के प्रश्नात्मक बल को सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बीज बोने और फल मिलने के रूपक का आशय
  choice: रूपक को बिना व्याख्यात्मक धार्मिक निष्कर्ष जोड़े ज्यों का त्यों रखा गया है।
  alternative: इसे स्पष्ट रूप से प्रतिफल, उद्धार या न्याय से जोड़ना।
  rationale: इस पद में उपमा का व्यापक तर्क है, पर उसका विशिष्ट धर्मवैज्ञानिक अनुप्रयोग यहाँ सीधे नहीं बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रश्नात्मक, दृष्टांतात्मक और गरिमापूर्ण शैली। ‘धरती’, ‘बीज’, ‘अकाल’ और ‘बरबाद’ सामान्य पाठक के लिए सहज हैं, जबकि मूल की अस्पष्टता पादटिप्पणी में सुरक्षित है।
