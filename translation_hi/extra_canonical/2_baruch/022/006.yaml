  naturalness: ‘दाख की बारी’ और ‘पोषण’ उपयुक्त हैं, पर ‘यदि वह ... फल न पाए’ के बाद ‘आशा नहीं रखता’ वाक्य का तर्क और स्रोत-वाक्यविन्यास दोनों अस्पष्ट हो जाते हैं। संशोधित पाठ सहज और प्रश्नात्मक है।
