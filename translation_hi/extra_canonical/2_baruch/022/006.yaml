translation:
  language: hi
  text: या कोई दाख की बारी लगाए और उसमें से अपने पोषण के लिए फल न ले, तो क्या उसे लगाने वाला उससे फल लेने की आशा नहीं रखता?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܨܒ ܟܪܡܐ
  choice: दाख की बारी लगाता है
  rationale: ܢܨܒ का अर्थ लगाना/रोपना और ܟܪܡܐ का अर्थ दाख की बारी है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: ܦܐܪ̈ܐ
  choice: फल
  rationale: बहुवचन अर्थ को हिन्दी के जातिवाचक ‘फल’ से सहज रूप में व्यक्त किया गया है।
- source_word: ܕܢܬܪܣܐ
  choice: अपने पोषण के लिए
  rationale: क्रिया का भाव पोषित होने या आहार पाने का है; उद्देश्यसूचक रचना को स्पष्ट रखते हुए अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: ܡܣܒܪ
  choice: आशा रखता
  rationale: यहाँ संदर्भ में अपेक्षा/आशा करने का अर्थ उपयुक्त है और दाख की बारी लगाने वाले की भावी फल-प्राप्ति की प्रत्याशा को बनाए रखता है।
theological_decisions:
- issue: दृष्टांतात्मक प्रश्न का बल
  choice: 'इसे नकारात्मक अपेक्षा वाले आलंकारिक प्रश्न के रूप में रखा गया: ‘क्या ... आशा नहीं रखता?’'
  alternative: 'साधारण कथन: ‘उसे लगाने वाला उससे फल पाने की आशा रखता है।’'
  rationale: सिरियाई पाठ की प्रश्नात्मक और तर्कपूर्ण शैली को बनाए रखने से कथन का आलंकारिक बल सुरक्षित रहता है; इसमें कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाख की बारी’ बाइबलीय हिन्दी में परिचित है, जबकि वाक्य-विन्यास को आज की सहज हिन्दी के अनुरूप बनाया गया है।
