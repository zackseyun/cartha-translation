lexical_decisions:
- source_word: ܓܙܐ
  choice: खज़ाना
  rationale: यह शब्द किसी संचित मूल्यवान निधि या treasure को दर्शाता है; ‘खज़ाना’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: ܡܣܬܒܪ
  choice: भरोसा पाता
  rationale: इस रूप में आशा, विश्वास या आश्वस्तता का भाव हो सकता है। संदर्भ में प्राप्त खज़ाने से मिलने वाली स्थिरता को व्यक्त करने के लिए ‘भरोसा पाता’ चुना गया है।
- source_word: ܡܬܬܙܝܥ
  choice: डगमगाए
  rationale: मूल क्रिया हिलाए जाने, विचलित होने या अस्थिर होने का भाव देती है; यहाँ रूपकात्मक मानसिक अस्थिरता के लिए ‘डगमगाए’ उपयुक्त है।
