  register: आधुनिक मानक हिन्दी में गंभीर, प्रलय-संबंधी और बाइबिलीय शैली रखी गई है। वाक्य सामान्य पाठकों के लिए सुबोध हैं; दैवी उपाधि ‘पराक्रमी’ और ‘समय जाग उठेगा’ जैसे स्रोत के विशिष्ट बिंब जानबूझकर बनाए रखे गए हैं।
