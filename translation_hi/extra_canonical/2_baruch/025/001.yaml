- from: 'तब उसने मुझे उत्तर दिया और कहा,[a] “तुम भी उस समय तक सुरक्षित रखे जाओगे—जब तक वह चिन्ह प्रकट न हो जिसे पराक्रमी युग के अंत में पृथ्वी के निवासियों के लिए दिखाएगा। और चिन्ह यह होगा: पृथ्वी के निवासी घबराहट से जकड़ लिए जाएँगे और अनेक कष्टों में पड़ेंगे; फिर वे घोर यातना में पड़ेंगे। जब अपने अत्यधिक संकट के कारण वे मन में कहेंगे, ‘पराक्रमी अब पृथ्वी को स्मरण नहीं करता,’ और वे आशा छोड़ चुके होंगे, तब वह समय जाग उठेगा।”'
  to: 'तब उसने मुझे उत्तर देकर कहा, “तुम भी उस समय तक बचे रहोगे—उस चिन्ह के प्रकट होने तक जिसे पराक्रमी दिनों के अंत में पृथ्वी के निवासियों के लिए प्रकट करेगा। और चिन्ह यह होगा: किंकर्तव्यविमूढ़ता पृथ्वी के निवासियों को जकड़ लेगी, और वे बहुत-से कष्टों में पड़ेंगे; फिर घोर संकट में पड़ेंगे। जब वे अपने अत्यधिक संकट के कारण मन-ही-मन कहेंगे, ‘पराक्रमी अब पृथ्वी को स्मरण नहीं करता,’ और आशा छोड़ देंगे, तब समय जाग उठेगा।”'
