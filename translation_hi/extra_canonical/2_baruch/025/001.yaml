  yaml_path: translation/extra_canonical/2_baruch/025/001.yaml
  text: 'Then he answered me and said, “You too shall be spared until that time, until the sign that the Mighty One will perform for the inhabitants of the earth at the end of the days. And this will be the sign: bewilderment will seize the inhabitants of the earth, and they will fall into many afflictions; then again into great anguish. And when, because of the abundance of their distress, they say in their thoughts, ‘The Mighty One no longer remembers the earth,’ and they have given up hope, then the time will awaken.”'
translation:
  language: hi
  text: 'तब उसने मुझे उत्तर देकर कहा, “तुम भी उस समय तक बचे रहोगे—उस चिन्ह के प्रकट होने तक जिसे पराक्रमी दिनों के अंत में पृथ्वी के निवासियों के लिए प्रकट करेगा। और चिन्ह यह होगा: किंकर्तव्यविमूढ़ता पृथ्वी के निवासियों को जकड़ लेगी, और वे बहुत-से कष्टों में पड़ेंगे; फिर घोर संकट में पड़ेंगे। जब वे अपने अत्यधिक संकट के कारण मन-ही-मन कहेंगे, ‘पराक्रमी अब पृथ्वी को स्मरण नहीं करता,’ और आशा छोड़ देंगे, तब समय जाग उठेगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܩܢܐ
  choice: चिन्ह
  rationale: इस अंत-समय संबंधी प्रसंग में यह शब्द पहचान कराने वाले नियत संकेत का काम करता है; ‘चिन्ह’ सामान्य पाठक के लिए स्पष्ट है, जबकि इसकी ‘नियत व्यवस्था’ वाली संभावित छाया टिप्पणी में स्वीकार की गई है।
- source_word: ܙܘ̈ܥܐ / संदर्भ में निवासियों को जकड़ने वाली दशा
  choice: घबराहट
  rationale: यह केवल साधारण भय नहीं, बल्कि लोगों को अस्थिर और किंकर्तव्यविमूढ़ कर देने वाली दशा है। ‘घबराहट से जकड़ लिए जाएँगे’ उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܐܘܠܨܢܐ
  choice: कष्ट / संकट
  rationale: दोहराव वाले दुःख-संबंधी पदों को प्रसंगानुसार ‘कष्ट’ और ‘संकट’ से व्यक्त किया गया है, ताकि बढ़ती हुई विपत्ति स्पष्ट रहे और हिन्दी बोझिल न हो।
- source_word: ܡܪܝܡܢܐ
  choice: पराक्रमी
  rationale: यह ऊँची दैवी उपाधि है। ‘पराक्रमी’ इसकी गंभीरता बनाए रखता है और अनावश्यक रूप से ‘परमेश्वर’ जोड़कर स्रोत का विस्तार नहीं करता।
- source_word: ܡܬܕܟܪ
  choice: स्मरण करता
  rationale: ‘स्मरण करना’ बाइबिलीय मुहावरे और दैवी ध्यान/परवाह की वाचा-संबंधी अनुगूँज को बनाए रखता है।
- source_word: ܥܪ / जागने का बिंब
  choice: जाग उठेगा
  rationale: नियत समय को मानवीकृत करके अचानक सक्रिय होने के रूप में दिखाने वाला प्रलय-संबंधी सजीव बिंब सुरक्षित रखा गया है।
theological_decisions:
- issue: पृथ्वी के विषय में पराक्रमी के स्मरण न करने की निराशापूर्ण उक्ति
  choice: ‘पराक्रमी अब पृथ्वी को स्मरण नहीं करता’ को वक्ताओं की शिकायत के रूप में यथावत रखा
  alternative: ‘पराक्रमी अब पृथ्वी की परवाह नहीं करता’
  rationale: यह कथन लोगों की चरम निराशा व्यक्त करता है, न कि वर्णनकर्ता द्वारा परमेश्वर के स्वभाव पर दिया गया सिद्धांत। इसे नरम करने से कथानक का तनाव घट जाता।
- issue: अंतिम वाक्य में जागने वाला कर्ता
  choice: ‘वह समय जाग उठेगा’
  alternative: ‘आशा जाग उठेगी’
  rationale: स्वीकृत मुख्य पाठ समय के जागने का असामान्य परंतु सजीव बिंब रखता है। पाठ-साक्ष्य में ‘आशा’ वाला पाठ भी मिलता है और उसे पाद-टिप्पणी में संरक्षित किया गया है।
