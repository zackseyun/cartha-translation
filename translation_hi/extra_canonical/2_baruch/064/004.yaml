translation:
  language: hi
  text: तब परमशक्तिमान की उपस्थिति से क्रोध निकला कि सिय्योन को जड़ से उखाड़ दिया जाए—जैसा तुम्हारे दिनों में भी हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ
  choice: क्रोध
  rationale: यह शब्द रोष अथवा प्रकोप को दर्शाता है; यहाँ न्यायकारी दैवी क्रोध के लिए स्वाभाविक और सीधा हिन्दी शब्द चुना गया है।
- source_word: ܡܢ ܩܕܡ
  choice: के सामने से
  rationale: सिरियाई वाक्यांश का स्थानिक-उद्गम भाव बनाए रखता है और क्रोध के परमशक्तिमान की उपस्थिति से निकलने की चित्रात्मक भाषा को सपाट नहीं करता।
- source_word: ܚܒܠܬܐ
  choice: जड़ से उखाड़ दिया जाए
  rationale: सन्दर्भ में सिय्योन के विनाश/उजाड़े जाने का भाव है; ‘जड़ से उखाड़ना’ उस तीव्रता और नगर के हटाए जाने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܥܠܝܟ
  choice: सिय्योन
  rationale: प्राप्त पाठ में यह रूप संदिग्ध/भ्रष्ट प्रतीत होता है; अध्याय के स्वीकृत पाठ-सन्दर्भ और परामर्श-पाठ के आधार पर अभिप्रेत नाम ‘सिय्योन’ रखा गया है।
- source_word: ܒܝܘ̈ܡܬܟܘܢ
  choice: तुम्हारे दिनों में
  rationale: बहुवचन सम्बोधन और समय-सूचक अभिव्यक्ति को औपचारिक किन्तु सहज हिन्दी में यथावत रखा गया है।
theological_decisions:
- issue: दैवी क्रोध का व्यक्तिकरण
  choice: ‘क्रोध निकला’ की चित्रात्मक भाषा बनाए रखी
  alternative: ‘परमशक्तिमान ने क्रोध में निर्णय किया’
  rationale: मूल पाठ क्रोध को बाहर निकलते हुए चित्रित करता है; इसे सीधे दैवी निर्णय में बदलना मूल की काव्यात्मकता और सम्भावित धर्मवैचारिक तनाव को अनावश्यक रूप से सुलझा देता।
- issue: विनाश में दैवी अभिप्राय और घटना का सम्बन्ध
  choice: ‘कि ... उखाड़ दिया जाए’
  alternative: ‘और सिय्योन उखाड़ दिया गया’
  rationale: उद्देश्य/परिणाम की मूल वाक्य-संरचना को रखा गया है, बिना इस बात पर अतिरिक्त व्याख्या जोड़े कि क्रोध स्वयं कर्ता है या दैवी आदेश का संकेत।
- issue: ‘परमशक्तिमान’ की उपाधि
  choice: परमशक्तिमान
  alternative: सर्वोच्च परमेश्वर
  rationale: यह उपाधि शक्ति पर बल देती है और किसी विशिष्ट सम्प्रदायगत शब्दावली को आरोपित किए बिना परामर्श-पाठ तथा व्यापक प्रसंग के अनुरूप है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की दैवी-क्रोध सम्बन्धी चित्रात्मकता तथा उद्देश्यसूचक तनाव को बनाए रखा गया है। स्रोत-पृष्ठ का OCR/पाठ-विन्यास अत्यन्त विकृत और अध्याय-सीमा अतिव्यापी है; इसलिए निकटस्थ सिरियाई संकेतों को नियंत्रक अध्याय-सन्दर्भ और लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ के साथ सावधानी से पढ़ा गया है।
