translation:
  language: hi
  text: और जो नौवाँ काला जल तुमने देखा था—वह हिजकिय्याह के पुत्र मनश्शे के दिनों में जो सारी दुष्टता थी, वही है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये सारी दुष्टताएँ हैं।”
    reason: सिरिएक वाक्यरचना को बहुवचन-सदृश रूप में भी समझा जा सकता है, यद्यपि एकवचन संकेतवाचक और सामूहिक ‘दुष्टता’ मुख्य अनुवाद का समर्थन करते हैं।
lexical_decisions:
- source_word: ܡ̈ܠܐ ܐܣܝܪܐ / vision-sequence phrase
  choice: नौवाँ काला जल
  rationale: दर्शन में उजले और काले जल की क्रमिक धाराएँ प्रतीक हैं; इसलिए रंग और क्रम-संख्या दोनों को स्पष्ट रखा गया है। हिंदी में सामूहिक प्रतीक के लिए एकवचन ‘जल’ स्वाभाविक है।
- source_word: ܚܒܠܐ
  choice: दुष्टता
  rationale: यहाँ शब्द मनश्शे के समय की नैतिक और धार्मिक बुराई को सूचित करता है, केवल उसके फलस्वरूप हुए विनाश को नहीं।
- source_word: ܟܠܗ
  choice: सारी
  rationale: स्रोत में उपस्थित समग्रता को बनाए रखने के लिए ‘सारी’ जोड़ा गया है; इसे छोड़ा नहीं गया।
- source_word: ܒܝܘܡ̈ܬܐ ܕܡܢܫܐ
  choice: मनश्शे के दिनों में
  rationale: यह सेमिटिक काल-सूचक मुहावरा हिंदी में भी सहज और गरिमापूर्ण है।
- source_word: ܕܡܢܫܐ / contextual patronymic
  choice: हिजकिय्याह के पुत्र मनश्शे
  rationale: व्यक्ति की पहचान को परामर्श-पाठ और अध्याय-संदर्भ के अनुरूप स्पष्ट रखा गया है।
theological_decisions:
- issue: क्या पद मनश्शे की दुष्टता को केवल एक घटना कहता है या उसके युग की समस्त दुष्टता का प्रतीक बताता है
  choice: ‘सारी दुष्टता’ कहकर प्रतीक की समग्रता बनाए रखी गई
  alternative: ‘दुष्टता’ मात्र
  rationale: स्रोत का ܟܠܗ समग्रता व्यक्त करता है; इसे बनाए रखना व्याख्यात्मक तनाव को घटाए बिना पाठ के आरोप की पूरी शक्ति प्रस्तुत करता है।
- issue: एकवचन संकेतवाचक और संभावित बहुवचन-सदृश संरचना
  choice: मुख्य पाठ में ‘वह ... सारी दुष्टता है’
  alternative: ‘ये सारी दुष्टताएँ हैं’
  rationale: एकवचन संकेत और सामूहिक संज्ञा के मेल को प्राथमिकता दी गई है; वैकल्पिक व्याकरणिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल पर गरिमापूर्ण शैली। ‘फैली’ संदर्भगत रूप से युग में व्याप्त बुराई को स्वाभाविक हिंदी में व्यक्त करता है; मूल कथन की समग्रता और प्रतीकात्मकता सुरक्षित रखी गई है।
