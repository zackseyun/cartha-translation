base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/002.yaml
  text: 'For he committed much impiety: he killed the righteous, twisted judgment, shed innocent blood, violated married women by force, overturned altars, abolished their offerings, and drove out the priests so that they could not minister in the sanctuary.'
translation:
  language: hi
  text: 'क्योंकि उसने बहुत अधर्म किया: उसने धर्मियों को मार डाला, न्याय को विकृत किया, निर्दोषों का खून बहाया, विवाहित स्त्रियों के साथ बलात्कार किया, वेदियों को उलट दिया, उन पर चढ़ाई जानेवाली भेंटें बंद कर दीं, और याजकों को निकाल दिया, ताकि वे पवित्रस्थान में सेवा न कर सकें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪ̈ܫܝܥܐ / impiety-context
  choice: अधर्म
  rationale: यह धार्मिक और नैतिक दुष्टता दोनों को व्यक्त करने वाला सहज, गरिमापूर्ण हिन्दी शब्द है।
- source_word: judgment/justice expression
  choice: न्याय को विकृत किया
  rationale: शासन और न्यायिक निर्णय को जानबूझकर बिगाड़ने का भाव बनाए रखता है।
- source_word: innocent blood
  choice: निर्दोषों का खून
  rationale: मूल सेमिटिक अभिव्यक्ति का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: sanctuary
  choice: पवित्रस्थान
  rationale: उपासना के पवित्र स्थल का अर्थ रखता है और किसी विशेष बाद की संस्थागत शब्दावली को आरोपित नहीं करता।
theological_decisions:
- issue: विवाहित स्त्रियों के विरुद्ध हिंसा का स्पष्ट वर्णन
  choice: विवाहित स्त्रियों के साथ बलात्कार किया
  alternative: विवाहित स्त्रियों को बलपूर्वक भ्रष्ट किया
  rationale: हिंसक यौन अपराध को अस्पष्ट या नरम किए बिना आधुनिक पाठक के लिए साफ़ रूप में व्यक्त किया गया है।
- issue: भेंटों को समाप्त करने का कर्ता और संदर्भ
  choice: उन पर चढ़ाई जानेवाली भेंटें बंद कर दीं
  alternative: उनकी भेंटें समाप्त कर दीं
  rationale: ‘उनकी’ के संभावित संदिग्ध संकेत को वेदियों से जोड़ते हुए उपासना-संबंधी क्रिया स्पष्ट की गई है, बिना भेंटों की किसी विशिष्ट श्रेणी का अनुमान लगाए।
