  yaml_path: translation/extra_canonical/2_baruch/064/003.yaml
  text: 'And he made an image with five faces: four looked toward the four winds, and the fifth was on top of the image, as a rival to the zeal of the Mighty One.'
translation:
  language: hi
  text: और उसने पाँच मुखों वाली एक प्रतिमा बनाई। उसके चार मुख चारों पवनों की ओर थे, और पाँचवाँ मुख प्रतिमा के शिखर पर[a] था, मानो वह महाशक्तिमान के उत्साह का प्रतिद्वंद्वी[b] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रतिमा के ऊपर”।
    reason: मूल अभिव्यक्ति स्थान को ‘ऊपर’ या प्रतिमा के सबसे ऊपरी भाग पर होने के रूप में समझी जा सकती है।
  - marker: b
    text: या, “मानो उसके विरोध में हो”।
    reason: ‘प्रतिद्वंद्वी’ का संज्ञात्मक अर्थ प्रमुख है, पर वाक्यांश को विरोध की तुलना के रूप में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ܚܡܫܥܣܪܐ / reconstructed verse wording for ‘five faces’
  choice: पाँच मुखोंवाली
  rationale: प्रतिमा की एक ही संरचना पर पाँच मुख होने का स्वाभाविक और स्पष्ट हिन्दी रूप। उपलब्ध अध्याय-पृष्ठ में पाठ विकृत/खंडित है, इसलिए नियंत्रक अंग्रेज़ी परामर्श-पाठ से पद की संरचना की पुष्टि की गई।
- source_word: ܪ̈ܘܚܐ
  choice: पवनों
  rationale: मूल का ठोस अर्थ ‘हवाएँ/पवन’ सुरक्षित रखता है; ‘दिशाएँ’ कहने से चार पवनों की प्राचीन अभिव्यक्ति मिट जाती।
- source_word: ܠܥܠ ܡܢ ܨܠܡܐ (reconstructed)
  choice: प्रतिमा के शिखर पर
  rationale: पाँचवें मुख की प्रतिमा पर स्थित भौतिक अवस्था स्पष्ट करता है और अलग से ऊपर मँडराने का भ्रामक अर्थ टालता है; ‘ऊपर’ की सम्भावना पादटिप्पणी में रखी गई।
- source_word: ܚܝܠܬܢܐ / divine title represented by ‘Mighty One’
  choice: महाशक्तिमान
  rationale: दैवी उपाधि को सामान्य पाठक के लिए स्वाभाविक, गरिमापूर्ण और किसी विशिष्ट सम्प्रदाय से असंबद्ध रूप में प्रस्तुत करता है।
- source_word: ܛܢܢܐ
  choice: उत्साह
  rationale: ‘zeal’ की तीव्रता और धार्मिक भाव बनाए रखता है; ‘ईर्ष्या’ चुनने पर निहित अर्थ को अनावश्यक रूप से संकीर्ण कर दिया जाता।
- source_word: ܚܪܘܝܐ (reconstructed)
  choice: प्रतिद्वंद्वी
  rationale: संज्ञात्मक अर्थ ‘प्रतिद्वंद्वी/विरोधी’ को सीधे व्यक्त करता है, केवल अमूर्त विरोध नहीं।
theological_decisions:
- issue: प्रतिमा के पाँचवें मुख और परमेश्वर के उत्साह के बीच संबंध
  choice: ‘मानो वह ... का प्रतिद्वंद्वी हो’
  alternative: ‘मानो वह ... के विरोध में हो’
  rationale: यह मूर्तिपूजक चुनौती को व्यक्त करता है, पर ‘मानो’ द्वारा पाठ की तुलनात्मक/आभासी शक्ति सुरक्षित रहती है और वास्तविक दैवी समकक्षता नहीं ठहराई जाती।
- issue: दैवी ‘zeal’ का अर्थ
  choice: उत्साह
  alternative: ईर्ष्या या जलन
  rationale: मूल की सम्भावित व्यापकता बनाए रखने और परमेश्वर के भाव को साधारण मानवीय जलन के रूप में चुपचाप सीमित न करने के लिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल पर गरिमापूर्ण कथात्मक शैली। ‘चारों पवनों’ से प्राचीन विश्व-दिशा संबंधी मुहावरा सुरक्षित रखा गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
