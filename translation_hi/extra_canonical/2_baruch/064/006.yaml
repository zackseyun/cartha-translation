  text: And the impiety of Manasseh grew so great that it removed the glory of the Most High from the sanctuary.
translation:
  language: hi
  text: और मनश्शे का अधर्म इतना बढ़ गया कि उसने पवित्रस्थान से परमप्रधान की महिमा हटा दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि परमप्रधान की महिमा पवित्रस्थान से हटा दी गई।”
    reason: कर्मवाच्य पाठ-रूप घटना पर बल देता है, जबकि मुख्य अनुवाद सीरियाई के सक्रिय व्याकरण को अधिक निकटता से दर्शाता है।
lexical_decisions:
- source_word: ܪܘܫܥܐ / ܪܫܝܥܘܬܐ
  choice: अधर्म
  rationale: यह शब्द ईश्वर-विरोधी दुष्टता और धार्मिक अपवित्रता—दोनों भाव व्यक्त करता है; आधुनिक हिन्दी में ‘अधर्म’ संक्षिप्त और स्वाभाविक है।
- source_word: ܡܢܫܐ
  choice: मनश्शे
  rationale: राजा Manasseh के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ܡܪܝܡܐ
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त ‘Most High’ उपाधि का प्रतिष्ठित और स्पष्ट हिन्दी रूप।
- source_word: ܫܘܒܚܐ / ܐܝܩܪܐ
  choice: महिमा
  rationale: ईश्वरीय glory के लिए स्वाभाविक धार्मिक पद, जो यहाँ दिव्य उपस्थिति और गौरव दोनों का संकेत बनाए रखता है।
- source_word: ܡܩܕܫܐ
  choice: पवित्रस्थान
  rationale: sanctuary का व्यापक अर्थ बनाए रखता है और इसे अनावश्यक रूप से केवल मंदिर-भवन तक सीमित नहीं करता।
theological_decisions:
- issue: मनश्शे के अधर्म और परमप्रधान की महिमा के हटने का व्याकरणिक संबंध
  choice: 'सक्रिय वाक्य: ‘उसने ... महिमा हटा दी’'
  alternative: 'कर्मवाच्य: ‘महिमा ... हटा दी गई’'
  rationale: सीरियाई क्रिया सक्रिय, स्त्रीलिंग एकवचन रूप में है और उसका स्वाभाविक कर्ता ‘अधर्म’ है। इसलिए पाठ मनश्शे के अधर्म को महिमा हटने का सीधा कारण बताता है; कर्मवाच्य विकल्प को टिप्पणी में सुरक्षित रखा गया है।
- issue: ‘महिमा’ को दिव्य उपस्थिति के रूप में स्पष्ट करना
  choice: केवल ‘महिमा’ रखा गया
  alternative: ‘महिमामय उपस्थिति’
  rationale: मूल की धार्मिक बहुअर्थकता बनाए रखने के लिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण धार्मिक गद्य। ‘इतना बढ़ गया कि’ परिणामसूचक संबंध को स्वाभाविक रूप में व्यक्त करता है; ‘उसने’ निकटतम कर्ता ‘अधर्म’ की ओर संकेत करता है।
