  text: Not because he had lived blamelessly, for he was not worthy, but so that from then on he might know by whom he would finally be punished.
translation:
  language: hi
  text: ऐसा इसलिए नहीं हुआ कि उसने निर्दोष जीवन बिताया था—क्योंकि वह इसके योग्य नहीं था—बल्कि इसलिए कि तब से वह जान ले कि अन्ततः उसे कौन दण्ड देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܠܐ ... / source wording reflected in the audited clause
  choice: यह इसलिए नहीं हुआ कि
  rationale: नकारात्मक कारण-वाक्य को स्वाभाविक हिन्दी में स्पष्ट रखा गया है। उपलब्ध सिरियाई अध्याय-पाठ खंडित और पद-सीमा की दृष्टि से अनिश्चित है, इसलिए अंग्रेज़ी POB की लेखापरीक्षित पद-पहचान को परामर्श-साक्ष्य के रूप में लिया गया।
- source_word: blamelessly
  choice: निर्दोष जीवन बिताया था
  rationale: नैतिक निष्कलंकता का भाव व्यक्त करता है, बिना पूर्ण पापरहितता जैसी अतिरिक्त धर्मवैज्ञानिक धारणा जोड़े।
- source_word: worthy
  choice: इसके योग्य
  rationale: योग्यता के आशय को बनाए रखते हुए उसका अनिर्दिष्ट संदर्भ जानबूझकर खुला रखा गया है।
- source_word: finally be punished
  choice: अन्ततः उसे ... दण्ड देगा
  rationale: अन्तिम परिणाम और दण्ड—दोनों भाव संक्षिप्त तथा स्वाभाविक हिन्दी में सुरक्षित हैं।
theological_decisions:
- issue: दण्ड देने वाले की पहचान
  choice: उसे कौन दण्ड देगा
  alternative: परमेश्वर उसे दण्ड देगा
  rationale: मूल अभिव्यक्ति में कर्ता प्रश्नवाचक/अप्रत्यक्ष रूप से अनिर्दिष्ट है; परमेश्वर का नाम जोड़ना वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: ‘निर्दोष’ का धर्मवैज्ञानिक विस्तार
  choice: निर्दोष जीवन बिताया था
  alternative: वह पापरहित था
  rationale: ‘पापरहित’ अधिक निरपेक्ष और सिद्धान्तगत दावा बन सकता है; यहाँ आचरण की निर्दोषता पर केन्द्रित भाषा अधिक संयत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। वाक्य की विरोधात्मक संरचना और ‘कौन’ की वास्तविक अस्पष्टता बनाए रखी गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
