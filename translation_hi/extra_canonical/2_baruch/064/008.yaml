  yaml_path: translation/extra_canonical/2_baruch/064/008.yaml
  text: For although his prayer was heard by the Most High, yet at last, when he was cast into the bronze horse and the bronze horse melted, it became a sign for him for the moment.
translation:
  language: hi
  text: क्योंकि यद्यपि परमप्रधान ने उसकी प्रार्थना सुन ली थी, फिर भी अंत में, जब उसे काँसे के घोड़े में डाल दिया गया और वह घोड़ा पिघल गया, तो वह उस क्षण उसके लिए एक चिन्ह बन गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस घड़ी के विषय में एक चिन्ह।”
    reason: सीरियाई कालवाचक पद का प्राथमिक मुहावरेदार अर्थ ‘उस समय/उस क्षण’ है; अंग्रेज़ी audit trail में दर्ज अधिक शाब्दिक वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
lexical_decisions:
- source_word: ܒܥܘܬܗ
  choice: उसकी प्रार्थना
  rationale: यह शब्द विनती या प्रार्थना को सूचित करता है; प्रसंग में परमप्रधान द्वारा सुनी गई प्रार्थना अभिप्रेत है।
- source_word: ܡܪܝܡܐ
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त सीरियाई उपाधि का स्वाभाविक और पारंपरिक हिन्दी समतुल्य।
- source_word: ܠܫܥܬܐ (पाठ के अपेक्षित मुहावरे का पुनर्निर्माण)
  choice: केवल उस समय का
  rationale: मुहावरे का अर्थ अस्थायी रूप से या उस अवसर भर के लिए है, न कि ‘घड़ी के विषय में’।
theological_decisions:
- issue: प्रार्थना सुने जाने और अंतिम परिणाम के बीच तनाव
  choice: ‘यद्यपि… फिर भी अंत में’ की विरोधात्मक रचना बनाए रखी
  alternative: प्रार्थना सुने जाने को पूर्ण या स्थायी उद्धार के रूप में स्पष्ट करना
  rationale: पाठ अस्थायी चिन्ह और बाद के परिणाम के बीच तनाव रखता है; अनुवाद इसे किसी सिद्धान्तगत निष्कर्ष से नहीं भरता।
- issue: काँसे के घोड़े के पिघलने का अर्थ
  choice: इसे केवल ‘एक चिन्ह’ कहा गया
  alternative: इसे चमत्कारी उद्धार या दैवी स्वीकृति कहना
  rationale: मूल कथन घटना को चिन्ह कहता है; उसके धर्मवैज्ञानिक आशय को अधिक स्पष्ट करना पाठ से आगे जाना होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘काँसा’ सामान्य पाठक के लिए bronze का स्वाभाविक रूप है; वाक्य में मूल का विरोध और अस्थायित्व सुरक्षित रखा गया है।
