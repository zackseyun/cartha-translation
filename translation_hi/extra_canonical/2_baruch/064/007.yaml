translation:
  language: hi
  text: इसलिए उस समय मनश्शे को अधर्मी कहा गया, और अंत में उसका निवास अग्नि में था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܫܐ (पांडुलिपि/OCR में ܡܢܫܪ)
  choice: मनश्शे
  rationale: यह राजा Manasseh का प्रचलित हिन्दी बाइबलीय नाम है; स्रोत-पाठ के नामरूप को पहचानते हुए मानक वर्तनी अपनाई गई है।
- source_word: ܪܫܝܥܐ
  choice: अधर्मी
  rationale: यह शब्द नैतिक और धार्मिक दुष्टता का बोध कराता है; ‘अधर्मी’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ܡܥܡܘܪܗ
  choice: निवास
  rationale: स्रोत का आशय रहने के स्थान या अंतिम ठिकाने से है; ‘निवास’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: ܢܘܪܐ
  choice: अग्नि
  rationale: ‘अग्नि’ स्रोत की ठोस छवि को बनाए रखता है और वाक्य के गंभीर न्याय-संबंधी स्वर के अनुकूल है।
theological_decisions:
- issue: मनश्शे के अंतिम निवास का कथन
  choice: “अंत में उसका निवास अग्नि में हुआ” के रूप में सीधा रखा गया
  alternative: इसे स्पष्ट रूप से ‘नरक’ या ‘अनन्त दण्ड’ कहना
  rationale: स्रोत केवल अग्नि में निवास की छवि देता है; किसी विशिष्ट परलोक-सिद्धान्त को जोड़ना मूल की अपेक्षा अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट अनुवाद। उपलब्ध सिरिएक अध्याय-पाठ OCR-क्षत है, इसलिए पद की संरचना अंग्रेज़ी POB परामर्श-पाठ से जाँची गई, जबकि पहचाने जा सकने वाले सिरिएक शब्दों और मूल की ठोस छवि को प्राथमिकता दी गई।
