translation:
  language: hi
  text: क्योंकि जो भलाई करने में समर्थ है, वह बुराई करने में भी समर्थ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: भलाई/हित करने की सामर्थ्य (प्रस्तुत सिरियाई अध्याय-पाठ में पद-सीमा अस्पष्ट)
  choice: भलाई करने में समर्थ
  rationale: वाक्य के नैतिक विरोध को सहज और संतुलित हिन्दी में व्यक्त करता है; ‘लाभ पहुँचाना’ की तुलना में ‘भलाई करना’ समानांतर पदों के लिए अधिक स्वाभाविक है।
- source_word: बुराई/हानि करने की सामर्थ्य (प्रस्तुत सिरियाई अध्याय-पाठ में पद-सीमा अस्पष्ट)
  choice: बुराई करने में भी समर्थ
  rationale: पहले खंड के साथ शाब्दिक-संरचनात्मक संतुलन रखता है और ‘यातना देना’ जैसा अधिक विशिष्ट अर्थ अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: भलाई और बुराई करने की सामर्थ्य का नैतिक कथन
  choice: कथन को बिना किसी अतिरिक्त कर्ता-परिचय या धर्मवैचारिक व्याख्या के रखा गया है।
  alternative: ‘वह भला भी कर सकता है और यातना भी दे सकता है’
  rationale: मूल कथन में निहित तनाव को बनाए रखते हुए किसी विशिष्ट व्यक्ति, ईश्वर या शासक से इसे स्पष्ट रूप से नहीं जोड़ा गया; उपलब्ध पद-पाठ की अनिश्चितता के कारण व्याख्यात्मक विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। उपलब्ध सिरियाई सामग्री अध्याय-स्तरीय, ओवरलैपयुक्त और पद-विभाजन की दृष्टि से अस्पष्ट है, इसलिए अंग्रेज़ी परामर्श-पाठ के संतुलित विरोध को सावधानी से रखा गया है।
