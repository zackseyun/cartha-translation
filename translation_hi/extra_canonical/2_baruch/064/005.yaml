translation:
  language: hi
  text: और ढाई गोत्रों के विरुद्ध भी यह आदेश निकला कि उन्हें भी बंदी बनाकर ले जाया जाए, जैसा कि तुमने अभी देखा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܪܝܢ ܫܒ̈ܛܝܢ ܘܦܠܓܗ
  choice: ढाई गोत्रों
  rationale: इस वाक्यांश का स्वाभाविक अर्थ ‘दो और आधा गोत्र’ है; हिन्दी बाइबिलीय प्रयोग में ‘ढाई गोत्र’ संक्षिप्त और स्पष्ट है।
- source_word: ܫܒ̈ܝܐ
  choice: बंदी बनाकर ले जाया जाए
  rationale: मूल में निर्वासन के लिए बंदी बनाकर ले जाने का भाव है; केवल ‘बंदी हों’ कहने से गति और निर्वासन का संकेत कम हो जाता।
- source_word: ܐܝܟ ܕܚܙܝܬ ܗܫܐ
  choice: जैसा कि तुमने अभी देखा है
  rationale: मूल के प्रत्यक्ष संबोधन और काल-सूचक ‘अभी’ को सुरक्षित रखा गया है।
theological_decisions:
- issue: आदेश का स्रोत या कर्ता स्पष्ट करना
  choice: कर्ता को अनिर्दिष्ट रखते हुए ‘यह आदेश निकला’
  alternative: ‘परमेश्वर ने आदेश दिया’
  rationale: उपलब्ध मूल वाक्य में आदेश के दिव्य स्रोत को इस पद के भीतर स्पष्ट रूप से नहीं कहा गया; इसलिए धर्मवैचारिक निष्कर्ष जोड़ने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। ‘गोत्र’ और ‘बंदी बनाकर ले जाना’ सामान्य बाइबिलीय शब्दावली के अनुरूप हैं।
