- issue: आठवें भाग के अलौकिक प्राणी और दृश्य
  choice: आत्माओं, प्रेतों और उनके दृश्य-रूपों की अलौकिक भाषा बनाए रखी गई
  alternative: इन्हें केवल मनोवैज्ञानिक भय या सामान्य प्राकृतिक विपत्तियाँ मानना
  rationale: सीरियाई पाठ आत्माओं, प्रेतों और रूपों को स्पष्ट रूप से नाम देता है; इसलिए उन्हें प्राकृतिक या मनोवैज्ञानिक घटनाओं में नहीं बदला गया।
