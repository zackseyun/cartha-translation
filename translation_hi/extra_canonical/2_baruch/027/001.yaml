  yaml_path: translation/extra_canonical/2_baruch/027/001.yaml
  text: 'And I answered and said to him, “After this, that time is divided into twelve parts, and each one of them is known for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending forth of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and of demons of apparitions. In the ninth part: the fall of fire. In the tenth part: plundering and much oppression.”'
translation:
  language: hi
  text: और मैंने उत्तर देकर उससे कहा, “इसके बाद वह समय बारह भागों में विभाजित है, और उनमें से हर एक उस बात से पहचाना जाता है जो उसमें नियत की गई है। पहले भाग में—उथल-पुथल का आरम्भ; दूसरे भाग में—बड़े लोगों का वध; तीसरे भाग में—बहुतों का पतन; चौथे भाग में—तलवार का भेजा जाना; पाँचवें भाग में—अकाल; छठे भाग में—भूकम्प; सातवें भाग में—आतंक और विपत्तियाँ; आठवें भाग में—आत्माओं के आक्रमण और रूपों की दुष्टात्माएँ[a]; नौवें भाग में—आग का गिरना; और दसवें भाग में—लूटपाट और बहुत अत्याचार।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, वाक्य-विन्यास के अनुसार: “आत्माओं और रूपों की दुष्टात्माओं के आक्रमण।” मूल में ‘रूपों’ और ‘दुष्टात्माओं’ का संबंध तो स्पष्ट है, पर ‘आक्रमण’ का दोनों पदों के साथ संबंध कैसे लगाया जाए, यह कुछ अस्पष्ट है।'
    reason: यह पाद-टिप्पणी कठिन सीरियाई संबंध-सूचक संरचना की वास्तविक वाक्य-विन्यासगत अस्पष्टता बनाए रखती है और मुख्य पाठ में संबंध को उलटने से बचाती है।
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  choice: बारह भागों में बाँटा गया है
  rationale: दृश्य पाठ में अंक अस्थिर है, पर क्रमबद्ध भागों और नियंत्रक पाठ-परम्परा से बारह भागों की योजना अधिक विश्वसनीय है।
- source_word: ܡܬܬܝܕܥܐ
  choice: पहचाना जाता है
  rationale: यह नियुक्त विषय के आधार पर प्रत्येक भाग की पहचान बताता है; इससे न तो केवल प्रकटीकरण और न ही गुप्त रखे जाने का अर्थ थोपा जाता है।
- source_word: ܙ̈ܘܥܐ
  choice: उथल-पुथल
  rationale: पहला प्रयोग व्यापक हलचलों का संकेत देता है और बाद में आए स्पष्ट भूकम्प-सूचक पद से भेद बनाए रखता है।
- source_word: ܪ̈ܘܪܒܢܐ
  choice: बड़े लोग
  rationale: पद सामाजिक या राजनीतिक रूप से प्रमुख व्यक्तियों को सूचित कर सकता है; यह चयन उसकी व्यापकता बनाए रखता है।
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  choice: तलवार का भेजा जाना
  rationale: मूल की सक्रिय, भेजे जाने वाली छवि को सामान्य युद्ध में समतल नहीं करता।
- source_word: ܬܗܪ̈ܐ
  choice: आतंक
  rationale: भयानक विस्मय या दहशत के अर्थ को इस विपत्ति-सूची में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܡܚܘ̈ܬܐ
  choice: महामारियाँ
  rationale: सामूहिक विपत्तियों का भाव देता है; मूल में प्रहार, कोड़े या विपत्तियाँ जैसे व्यापक अर्थ भी सम्भव हैं।
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ
  choice: आत्माओं के आक्रमण
  rationale: कठिन पद को दर्शन की शत्रुतापूर्ण अलौकिक गतिविधि के रूप में प्रस्तुत करता है, पर वैकल्पिक संरचना पाद-टिप्पणी में सुरक्षित है।
- source_word: ܫ̈ܐܕܐ
  choice: प्रेत
  rationale: यह स्पष्ट रूप से दुष्ट अलौकिक प्राणियों को सूचित करता है; सामान्य पाठक के लिए 'प्रेत' सहज और पारदर्शी है।
- source_word: ܦܪ̈ܨܘܦܐ
  choice: दृश्य-रूप
  rationale: शाब्दिक अर्थ मुख या रूप हो सकता है; अशुभ दर्शनों के प्रसंग में 'दृश्य-रूप' वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: ܚܛܘܦܝܐ
  choice: लूटपाट
  rationale: हिंसक ढंग से छीनने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܐܢܘܣܝܐ
  choice: अत्याचार
  rationale: बलपूर्वक दबाव और उत्पीड़न का सामाजिक भाव देता है तथा लूटपाट के साथ स्वाभाविक युग्म बनाता है।
