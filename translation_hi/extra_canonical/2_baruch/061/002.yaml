  yaml_path: translation/extra_canonical/2_baruch/061/002.yaml
  text: And at that time there came the building of Zion, and the dedication of the sanctuary, and much blood of the nations who sinned then was shed, and many offerings were offered then at the dedication of the sanctuary.
translation:
  language: hi
  text: और उस समय सिय्योन का निर्माण और पवित्रस्थान का समर्पण हुआ। तब जिन राष्ट्रों ने उसी समय पाप किया था, उनका बहुत-सा रक्त बहाया गया; और पवित्रस्थान के समर्पण के समय बहुत-सी भेंटें चढ़ाई गईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܨܗܝܘܢ (consultation text: Zion)'
  choice: सिय्योन
  rationale: परंपरागत बाइबलीय नाम को आधुनिक मानक हिन्दी में पहचानने योग्य रूप में रखा गया है।
- source_word: ܒܢܝܢܐ / building (consultation evidence)
  choice: निर्माण
  rationale: यह सिय्योन के बनाए जाने की घटना को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ܩܘܕܫܐ / sanctuary (consultation evidence)
  choice: पवित्रस्थान
  rationale: यह किसी सामान्य मंदिर के बजाय पवित्र उपासना-स्थल का अर्थ बनाए रखता है।
- source_word: dedication (consultation evidence)
  choice: समर्पण
  rationale: पवित्रस्थान को औपचारिक रूप से परमेश्वर के लिए अर्पित किए जाने का आशय स्पष्ट करता है।
- source_word: offerings (consultation evidence)
  choice: भेंटें
  rationale: मूल वस्तुओं का प्रकार उपलब्ध स्रोत-अंश में स्पष्ट न होने के कारण अधिक विशिष्ट ‘बलियाँ’ थोपने के बजाय व्यापक शब्द चुना गया है।
theological_decisions:
- issue: राष्ट्रों के रक्तपात और उनके पाप का संबंध
  choice: “जिन राष्ट्रों ने पाप किया था, उनका बहुत-सा रक्त बहाया गया”
  alternative: “पापी राष्ट्रों का बहुत-सा रक्त बहाया गया”
  rationale: सापेक्ष उपवाक्य स्रोत में व्यक्त समयगत संबंध को बनाए रखता है और राष्ट्रों की पहचान को अनावश्यक रूप से स्थायी धार्मिक विशेषण में नहीं बदलता।
- issue: घटनाओं के घटित होने की अभिव्यक्ति
  choice: “निर्माण और ... समर्पण हुआ”
  alternative: “निर्माण और ... समर्पण का समय आया”
  rationale: हिन्दी में स्वाभाविक वाक्य रखते हुए घटनाओं के उस समय घटित होने का अर्थ सुरक्षित रखा गया है; अंग्रेज़ी की अस्वाभाविक ‘there came’ संरचना की नकल नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। समान मूल वाले ‘समर्पण’ को दोनों बार रखा गया है ताकि घटना और उस अवसर के बीच का संबंध स्पष्ट रहे। उपलब्ध सिरिएक अध्याय-बकेट में पद-सीमा प्रत्यक्ष रूप से विश्वसनीय ढंग से पहचानी नहीं जा सकी, इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य के रूप में सावधानी से उपयोग किया गया है और अनावश्यक विशिष्टता से बचा गया है।
