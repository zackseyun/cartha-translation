translation:
  language: hi
  text: और पवित्र पर्व भलाई और बड़े आनन्द के साथ मनाए गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पूरे किए गए’।
    reason: मूल क्रिया का अधिक शाब्दिक अर्थ सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ܫ̈ܪܝܐ
  choice: पर्व
  rationale: संदर्भ में यह पवित्र उत्सवों या पर्वों की ओर संकेत करता है; सामान्य हिन्दी पाठक के लिए ‘पर्व’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ܐܬܬܡܠܝܘ (अर्थगत पुनर्निर्माण)
  choice: मनाए गए
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘पूरे किए गए’ हो सकता है, पर पर्वों के साथ उसका प्रसंगगत अर्थ उनका विधिपूर्वक मनाया जाना है; शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ܒܒܣܝܡܘܬܐ / ܒܛܒܘܬܐ (अर्थगत साक्ष्य)
  choice: भलाई के साथ
  rationale: ‘goodness’ के नैतिक और सकारात्मक भाव को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ܒܚܕܘܬܐ ܣܓܝܐܬܐ (अर्थगत साक्ष्य)
  choice: बड़े आनन्द के साथ
  rationale: बहुतायत के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पर्वों के लिए प्रयुक्त क्रिया का अर्थ
  choice: मनाए गए
  alternative: पूरे किए गए
  rationale: ‘मनाए गए’ हिन्दी में पर्वों के साथ स्वाभाविक प्रयोग है, जबकि ‘पूरे किए गए’ मूल की संभावित शाब्दिकता और पूर्ति-संबंधी तनाव को दर्शाता है; इसलिए वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘पवित्र पर्व’ धार्मिक संदर्भ को स्पष्ट रखता है और ‘बड़े आनन्द’ मूल की प्रबलता को सहज हिन्दी में व्यक्त करता है।
