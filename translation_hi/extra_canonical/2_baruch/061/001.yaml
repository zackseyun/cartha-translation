  text: And the sixth bright waters that you saw—this is the time in which David and Solomon were born.a
translation:
  language: hi
  text: और जो छठा उजला जल तुमने देखा था—यह वह समय है जिसमें दाऊद और सुलैमान जन्मे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक वचन-विसंगति के साथ, “ये वह समय है।”
    reason: स्रोत/अंग्रेज़ी audit trail में निहित बहुवचन संकेतक और एकवचन काल-संज्ञा के तनाव को सुरक्षित रखता है, जबकि मुख्य पाठ में स्वाभाविक हिन्दी रखता है।
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: उजला जल
  rationale: यह पद दर्शन में काले जल के विपरीत शुभ और प्रकाशमान जल का संकेत देता है। ‘उजला’ प्रतीकात्मक विरोध को सहज हिन्दी में बनाए रखता है; सामूहिक अर्थ वाले ‘जल’ से स्रोत के बहुवचन का भाव भी बना रहता है।
- source_word: ܙܒܢܐ
  choice: समय
  rationale: यह शब्द दाऊद और सुलैमान से पहचाने गए ऐतिहासिक काल को सूचित करता है; ‘समय’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से पर्याप्त व्यापक है।
- source_word: ܐܬܝܠܕܘ
  choice: जन्म हुआ था
  rationale: क्रिया के जन्म लेने के सामान्य अर्थ को सरल, स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: दाऊद और सुलैमान के समय को प्रत्यक्ष मसीही राज्य मानना या ऐतिहासिक-प्रतीकात्मक काल मानना
  choice: दाऊद और सुलैमान का ऐतिहासिक काल, जो दर्शन में छठे उजले जल द्वारा दर्शाया गया है
  alternative: इसे सीधे भविष्य के मसीही राज्य का कथन मानना
  rationale: पद स्वयं इस जल की पहचान उस समय से करता है जिसमें दाऊद और सुलैमान का जन्म हुआ। इसलिए अनुवाद ऐतिहासिक संदर्भ को स्पष्ट रखता है और उससे आगे कोई विशिष्ट धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: बहुवचन ‘जल’ और एकवचन ‘समय’ के बीच वचन-संबंध
  choice: स्वाभाविक हिन्दी में ‘यह वह समय है’
  alternative: शाब्दिक वचन-सामंजस्य के साथ ‘ये वह समय हैं’
  rationale: दर्शन का बहुवचन प्रतीक एक ही ऐतिहासिक काल की ओर संकेत करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि स्रोत की वचन-संबंधी असंगति को पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘जो…तुमने देखा था’ दर्शन की पूर्वोक्ति से संबंध बनाए रखता है। दाऊद और सुलैमान के नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
