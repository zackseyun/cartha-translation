base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/061/007.yaml
  text: And the land, because it then received mercy, and because its inhabitants did not sin, was glorified above all lands; and the city Zion then ruled over all lands and regions.
translation:
  language: hi
  text: और उस देश को, क्योंकि उस समय उस पर दया की गई थी और उसके निवासियों ने पाप नहीं किया था, सब देशों से बढ़कर महिमामंडित किया गया; और सिय्योन नगर ने तब सभी देशों और प्रदेशों पर शासन किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी देशों पर शासन किया।”
    reason: भौगोलिक अभिव्यक्ति का संक्षिप्त वैकल्पिक पाठ।
lexical_decisions:
- source_word: ܐܪܥܐ (ʾarʿā)
  choice: देश
  rationale: यहाँ संदर्भ किसी विशिष्ट भूभाग और अन्य भूभागों के साथ उसकी तुलना का है; इसलिए सामान्य ‘धरती’ की अपेक्षा ‘देश’ अधिक स्वाभाविक है।
- source_word: ܪ̈ܚܡܐ / mercy expression
  choice: उस देश पर दया की गई
  rationale: देश को दया मिलने की मूल अलंकारिक अभिव्यक्ति बनाए रखते हुए हिंदी में स्वाभाविक कर्मवाच्य रखा गया है।
- source_word: ܨܗܝܘܢ (Ṣehyōn)
  choice: सिय्योन
  rationale: हिंदी बाइबिलीय परंपरा में प्रचलित और पहचानने योग्य रूप।
- source_word: ܫܠܛܬ ܗܝܕܝܢ (šleṭat haydēn)
  choice: तब ... शासन किया
  rationale: क्रिया के शासन-संबंधी अर्थ और स्पष्ट कालवाचक अव्यय ‘तब’ दोनों को सुरक्षित रखा गया है।
- source_word: lands and regions expression
  choice: सभी देशों और प्रदेशों पर
  rationale: दो भौगोलिक पदों के भेद को हिंदी में बनाए रखा गया है, यद्यपि संक्षिप्त पाठ की संभावना पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: देश को दया मिलने और महिमा दिए जाने का मानवीकरण
  choice: अलंकारिक भाषा को यथावत रखा गया
  alternative: केवल देश के निवासियों को दया और महिमा का पात्र बताना
  rationale: मूल कथन देश और उसके निवासियों को अलग-अलग उल्लेखित करता है; इसे केवल लोगों पर लागू करना पाठ की काव्यात्मक और धर्मवैचारिक तनावशीलता को मिटा देता।
- issue: सिय्योन के शासन का विस्तार
  choice: सभी देशों और प्रदेशों पर
  alternative: सारे देशों पर
  rationale: विस्तृत भौगोलिक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया और संक्षिप्त पाठ को वैकल्पिक रूप में दिया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘तब’ को स्पष्ट रूप से रखा गया है ताकि सिय्योन के शासन का उसी वर्णित समय से संबंध बना रहे। उपलब्ध सिरिएक अध्याय-पृष्ठ खंड में लक्षित पद स्पष्ट रूप से पृथक नहीं है; इसलिए पाठ-निर्णय में दिए गए सिरिएक कालवाचक साक्ष्य और परीक्षित परामर्श-पाठ, दोनों का सावधानी से उपयोग किया गया है।
