translation:
  language: hi
  text: और उसका समय शान्ति का होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܠܡܐ
  choice: शान्ति
  rationale: सीरियाई शब्द यहाँ मसीह के समय की शान्ति और कल्याण को व्यक्त करता है।
- source_word: ܙܒܢܐ ܕܝܠܗ
  choice: उस समय
  rationale: शाब्दिक अर्थ ‘उसका समय’ है; प्रसंग में यह मसीह से संबंधित उस काल की ओर संकेत करता है।
- source_word: ܟܕ ܫܠܡܐ
  choice: और चैन
  rationale: प्रस्तुत पाठ में केवल ‘शान्ति’ स्पष्ट है; अंग्रेज़ी परामर्श-पाठ के ‘tranquility’ का भाव स्वाभाविक हिन्दी में रखने के लिए ‘चैन’ जोड़ा गया है, यद्यपि यह अलग स्पष्ट सीरियाई संज्ञा का प्रतिनिधित्व नहीं करता।
theological_decisions:
- issue: मसीही काल की शान्ति का स्वरूप
  choice: सामान्य ‘शान्ति और चैन’
  alternative: ‘पूर्ण शान्ति’ या किसी विशिष्ट सहस्राब्दी-सम्बन्धी व्याख्या
  rationale: पाठ शान्ति का कथन करता है, पर उसकी अवधि या धार्मिक-वैचारिक व्यवस्था को परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। सीरियाई स्रोत के भावी प्रसंग के कारण ‘होगा’ अपनाया गया है; अंग्रेज़ी परामर्श-पाठ का भूतकाल स्रोत के निकटवर्ती भावी क्रियाप्रवाह से कम संगत प्रतीत होता है।
