translation:
  language: hi
  text: और सभा में बुद्धि सुनी गई, और समुदायों में समझ की समृद्धि का महिमामंडन हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܟܡܬܐ
  choice: बुद्धि
  rationale: ‘बुद्धि’ सीरियाई संज्ञा के अर्थ को सीधे और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: ܥܘܬܪܐ
  choice: समृद्धि
  rationale: यह ‘धन/प्रचुरता’ के रूपक को बनाए रखता है और ‘समझ-बूझ’ के साथ स्वाभाविक हिन्दी देता है।
- source_word: ܣܘܟܠܬܢܘܬܐ
  choice: समझ-बूझ
  rationale: यह बौद्धिक समझ और विवेक के भाव को साधारण आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: assembly / congregations (consultation-layer reconstruction)
  choice: सभा / समुदायों
  rationale: दो सामूहिक पदों का भेद बनाए रखते हुए अनावश्यक सांप्रदायिक अर्थ से बचा गया है।
theological_decisions:
- issue: बुद्धि को व्यक्ति-सदृश या अमूर्त गुण के रूप में पढ़ना
  choice: अमूर्तता बनाए रखते हुए ‘बुद्धि की बात सुनाई दी’
  alternative: ‘बुद्धि ने सभा में अपनी वाणी सुनाई’
  rationale: स्रोत की काव्यात्मक निष्क्रिय रचना को बिना स्पष्ट व्यक्तिकरण थोपे स्वाभाविक हिन्दी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता और निष्क्रिय अभिव्यक्ति सुरक्षित रखी गई है। ‘मंडली’ के संभावित सांप्रदायिक संकेत से बचने के लिए ‘समुदाय’ चुना गया है।
