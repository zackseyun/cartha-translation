    ܐܚܝܕ ܗܘܐ ܠܡܘܫܐ

    ܠܘܬܗ. ܝܘܡܝܢ ܣܓܝ̈ܐܐ

    ܗܘܘ ܣܓܝ̈ܐܐ ܥܡ

    ܕܒܪܐ ܕܝܘܩܦܘܪ ܘܝܘܠܦܢܐ

    ܕܐܒܝܐ ܐܚܝܕ ܕܐܦ ܠܝ.

    ܘܬܘܒ ܚܕ ܕܫܡܘܐܝܠ

    ܕܐܝܟܢ. ܘܡܘܫܚ̈ܬܗ̇.

    ܕܡܬܒܥܝܐ ܒܕܡܘܬܐ

    ܕܥܝܪ ܡܩܕܫܐ ܕܗܘܐ.

    ܐܠܐ ܐܦ ܗܢܝܢ ܚܘܝܬ

    ܗܘܐ ܡܘܫܚ̈ܬܗ̇ ܕܢܘܪܐ.

    ܐܦ ܒܘ̈ܩܘܗܝ ܕܬܗܘܡܐ.

    ܘܡܫܪ̈ܘܝ ܕܪ̈ܘܚܐ. ܘܡܢܝܢܐ

    ܕܢܛ̈ܦܐ ܡܛܪܐ. ܘܐܚܝܕܘܬ

    ܕܪ̈ܘܓܙܐ. ܘܣܓܝܘ̈ܬܐ

    ܕܓܝܓ̈ܠܐ ܪܘܚܐ. ܘܫܪܪܗ

    ܕܕܝܢܐ. ܘܥܘܪܒܐ ܕܚܟܡܬܐ.

    ܘܥܘܬܪܐ ܕܣܘܟܠܬܢܘܬܐ.

