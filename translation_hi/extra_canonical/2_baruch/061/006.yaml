    ܕܐܬܡܟܘ ܒܗ ܒܣܒܪܐ

    ܕܗܢܐ ܢܩܘܡܘܢ. ܘܗܘܐ

    ܣܘܓܐܐ ܕܢܦ̈ܫܬܐ ܕܐܝ

