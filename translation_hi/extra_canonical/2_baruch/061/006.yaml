    ܐܝܠܝܢ ܕܡܩܕܡܝܢ ܢܗܘܘܢ

    ܕܝܐܝܬܝܗܘܢ ܗܢܘܢ ܗܟܝܠ

    ܘܐܬܪܘܪܒܘ ܘܐܬܩܪܒܘ

    ܘܐܙܠܘ ܘܐܬܟܢܫܘ ܘܐܬܚܙܝܘ

    ܘܐܝܠܝܢ ܕܐܬܟܢܫܘ ܘܐܙܠܘ

    ܐܝܟ ܗܢܘܢ. ܘܗܘܘ ܝܬܝܪ

