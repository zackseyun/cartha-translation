  text: And the judgments of the rulers were then seen to be without deceit, and the righteousness of the commandments of the Mighty One was accomplished in truth.
translation:
  language: hi
  text: तब शासकों के न्याय-निर्णय[a] छलरहित दिखाई दिए, और पराक्रमी की आज्ञाओं की धार्मिकता सत्य के साथ पूरी हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शासकों का न्याय-निर्णय छलरहित दिखाई दिया।’
    reason: पूर्ववर्ती एकवचन पाठ-प्रस्तुति को वैकल्पिक रूप में दर्ज किया गया है, यद्यपि उपलब्ध सीरियाई व्याकरण बहुवचन का समर्थन करता है।
lexical_decisions:
- source_word: ܕܝ̈ܢܐ
  choice: न्याय-निर्णय
  rationale: संज्ञा बहुवचन है; ‘न्याय-निर्णय’ शासकों द्वारा दिए गए निर्णयों का भाव स्पष्ट करता है।
- source_word: ܕܒܥ̈ܠܕܒܒܐ
  choice: शासकों के
  rationale: प्राप्त पाठ और परामर्श-पाठ के अनुसार अधिकार रखने वाले शासकों का संदर्भ व्यक्त किया गया है।
- source_word: ܕܐܝ ܕܝܐܝܬܝܗܘܢ
  choice: छलरहित
  rationale: निर्णयों में कपट या धोखे का अभाव संक्षेप और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ܩܫܝܐ
  choice: पराक्रमी
  rationale: ईश्वर के लिए प्रयुक्त सामर्थ्यसूचक उपाधि को किसी विशिष्ट सांप्रदायिक पदावली के बिना सुरक्षित रखा गया है।
- source_word: ܒܩܘܫܬܐ
  choice: सत्य में
  rationale: स्रोत की ‘सत्य में/सच्चाई में’ संरचना को बनाए रखता है और कथन की नैतिक-धार्मिक तीव्रता को कम नहीं करता।
theological_decisions:
- issue: ईश्वर की सामर्थ्यसूचक उपाधि
  choice: पराक्रमी
  alternative: सर्वशक्तिमान
  rationale: ‘पराक्रमी’ स्रोत की उपाधि के अधिक निकट है; ‘सर्वशक्तिमान’ सर्वशक्ति का अधिक निश्चित धर्मवैज्ञानिक दावा जोड़ सकता है।
- issue: आज्ञाओं की धार्मिकता
  choice: आज्ञाओं की धार्मिकता
  alternative: आज्ञाओं का औचित्य
  rationale: ‘धार्मिकता’ स्रोत की नैतिक-धार्मिक धारणा और उसकी कुछ असामान्य अभिव्यक्ति को सुरक्षित रखती है; ‘औचित्य’ अर्थ को केवल वैधता की ओर सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘सत्य में पूरी हुई’ स्रोत की औपचारिक अभिव्यक्ति को बचाता है, जबकि वाक्य-क्रम हिन्दी पाठक के लिए स्वाभाविक रखा गया है।
