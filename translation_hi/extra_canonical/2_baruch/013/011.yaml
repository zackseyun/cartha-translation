  text: But now, you nations and peoples, you are guilty, because at all times you have trodden the earth and dealt with creation without righteousness.
translation:
  language: hi
  text: पर अब, हे जातियो और लोगो, तुम दोषी हो, क्योंकि तुमने हर समय पृथ्वी को रौंदा है और सृष्टि के साथ धार्मिकता के बिना व्यवहार किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̈ܘܬܐ
  choice: जातियो
  rationale: यह बहुवचन संबोधन राजनीतिक-जातीय समुदायों को सूचित करता है; आधुनिक हिन्दी में ‘जातियो’ इसका स्वाभाविक संबोधन है।
- source_word: peoples (English audited layer; Syriac page evidence is textually/segmentally unclear)
  choice: लोगो
  rationale: ‘जातियो और लोगो’ समानांतर सामूहिक संबोधन को सहज हिन्दी में बनाए रखता है।
- source_word: trodden
  choice: रौंदते रहे
  rationale: यह पृथ्वी पर लगातार कठोर और दमनकारी आचरण की सशक्त छवि को सुरक्षित रखता है।
- source_word: without righteousness
  choice: धार्मिकता के बिना
  rationale: ‘अधर्म से’ की अपेक्षा यह अभिव्यक्ति मूल निषेधात्मक संरचना और नैतिक-धार्मिक अर्थक्षेत्र को अधिक स्पष्ट रूप से बनाए रखती है।
theological_decisions:
- issue: मानव समुदायों का सृष्टि के प्रति नैतिक उत्तरदायित्व
  choice: ‘सृष्टि के साथ धार्मिकता के बिना व्यवहार’
  alternative: ‘सृष्टि के साथ अन्याय किया’
  rationale: चुना हुआ पाठ सृष्टि के प्रति आचरण और धार्मिकता की कमी—दोनों को व्यक्त करता है, बिना इसे केवल सामाजिक अन्याय तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। उपलब्ध सिरिएक पृष्ठ-साक्ष्य में पद-सीमा और पाठ-पहचान अस्पष्ट है; इसलिए प्रमाणित अंग्रेज़ी परामर्श-पाठ के अर्थ को सिरिएक के स्पष्ट सामूहिक संबोधन और दोष-निर्णय के अनुरूप सावधानी से प्रस्तुत किया गया है।
