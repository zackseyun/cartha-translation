theological_decisions:
- issue: ताड़ना और पवित्रीकरण के बीच उद्देश्य-संबंध
  choice: ताकि वे पवित्र किए जाएँ
  alternative: जिसके फलस्वरूप वे पवित्र हुए
  rationale: अंग्रेज़ी परामर्श-पाठ उद्देश्य सूचित करता है; ‘ताकि’ उसी तनाव को सुरक्षित रखता है और परिणाम को निश्चित मानकर नहीं चलता।
- issue: कर्म के कर्ता की पहचान
  choice: दोनों क्रियाओं में कर्ता को अनकहा रखा गया
  alternative: परमेश्वर ने उन्हें ताड़ना दी ताकि वह उन्हें पवित्र करे
  rationale: उपलब्ध वाक्य में कर्ता स्पष्ट नहीं है; उसे परमेश्वर के रूप में जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
