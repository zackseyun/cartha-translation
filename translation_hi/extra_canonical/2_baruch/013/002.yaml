translation:
  language: hi
  text: तब ऊपर से एक आवाज़ आई और उसने मुझसे कहा, “बारूक, अपने पैरों पर खड़े हो जाओ और सामर्थी परमेश्वर का वचन सुनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܠܐ ... ܡܢ ܡܪܘܡܐ
  choice: ऊपर से एक आवाज़
  rationale: सिरियाई पदबंध का स्वाभाविक और अर्थ-सटीक हिन्दी रूप; ܡܪܘܡܐ ऊँचाई/ऊपर के क्षेत्र को सूचित करता है।
- source_word: ܩܘܡ ܥܠ ܪ̈ܓܠܝܟ
  choice: अपने पैरों पर खड़े हो जाओ
  rationale: मूल की शारीरिक मुद्रा और आज्ञार्थक बल दोनों सुरक्षित रखता है।
- source_word: ܡܠܬܐ
  choice: वचन
  rationale: यहाँ ईश्वरीय संदेश के अर्थ में गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी; केवल सामान्य ‘बात’ से अधिक उपयुक्त।
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: सामर्थी
  rationale: शाब्दिक रूप से ‘सामर्थी परमेश्वर/सामर्थी जन’; अंग्रेज़ी परामर्श-पाठ के ‘Mighty One’ के अनुरूप इसे दिव्य उपाधि के रूप में रखा गया है, बिना ‘परमेश्वर’ शब्द जोड़कर अभिव्यक्ति को अनावश्यक रूप से स्पष्ट किए।
theological_decisions:
- issue: ܐܠܗܐ ܚܝܠܬܢܐ में दिव्य उपाधि का रूप
  choice: सामर्थी
  alternative: सामर्थी परमेश्वर
  rationale: मूल में ܐܠܗܐ उपस्थित होने के कारण वैकल्पिक रूप संभव है, पर इस पाठ-परंपरा में संयुक्त पद एक स्थापित दिव्य उपाधि की तरह कार्य करता है। ‘सामर्थी’ मूल की उपाधिमूलक संक्षिप्तता और अनुमोदित अंग्रेज़ी परामर्श-पाठ दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। ‘खड़े हो जाओ’ सामान्य पाठक के लिए स्वाभाविक है; ‘वचन’ धार्मिक संदर्भ का भार बनाए रखता है।
