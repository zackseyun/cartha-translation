  text: 'And it happened after these things that I, Baruch, was standing on the bank of the river, and a voice came from the height and said to me:'
translation:
  language: hi
  text: 'इन बातों के बाद ऐसा हुआ कि मैं, बारूक, नदी के किनारे[a] खड़ा था। तब ऊँचाई से एक आवाज़ आई और मुझसे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ परंपराओं में यहाँ “सिय्योन पर्वत पर” है।
    reason: प्राथमिक सिरियाई पाठ के ‘नदी के किनारे’ और अन्य नियंत्रण-परंपरा के स्थान-पाठ के बीच वास्तविक पाठांतर को स्पष्ट, तटस्थ हिन्दी में दर्ज करना।
lexical_decisions:
- source_word: ܨܝܕܐ ܕܢܗܪܐ
  choice: नदी के किनारे
  rationale: प्राथमिक सिरियाई पाठ सीधे नदी के किनारे का स्थान बताता है। यह स्वाभाविक हिन्दी है और ‘नदी की ओर/बगल’ की अपेक्षा प्रसंग को अधिक स्पष्टता से व्यक्त करती है।
- source_word: ܡܢ ܡܪܘܡܐ
  choice: ऊँचाई से
  rationale: सिरियाई अभिव्यक्ति को जानबूझकर ‘स्वर्ग से’ नहीं बनाया गया, ताकि मूल पाठ की स्थानगत व्यापकता और सम्भावित धार्मिक अर्थ दोनों सुरक्षित रहें।
- source_word: ܘܗܘܐ ܩܠܐ ܐܙܐ
  choice: तब ... एक आवाज़ आई
  rationale: शाब्दिक रूप से आवाज़ के आने/निकलने की अभिव्यक्ति है। वर्तमान हिन्दी में ‘एक आवाज़ आई’ सहज है और घटना की गतिशीलता बनाए रखती है।
theological_decisions:
- issue: बारूक के प्रकाशन का स्थान
  choice: प्राथमिक सिरियाई पाठ के अनुसार नदी का किनारा
  alternative: सिय्योन पर्वत
  rationale: सेरियानी का सिरियाई पाठ परियोजना का प्राथमिक साक्ष्य है और उसमें ܨܝܕܐ ܕܢܗܪܐ है। नियंत्रण-परंपरा के भिन्न पाठ को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
- issue: आवाज़ के उद्गम का अर्थ
  choice: ऊँचाई से
  alternative: स्वर्ग से
  rationale: मूल ܡܪܘܡܐ ‘ऊँचाई/ऊर्ध्व स्थान’ कहता है। ‘स्वर्ग’ सम्भव व्याख्या है, पर उसे मुख्य पाठ में निश्चित करना मूल की अभिव्यक्ति को अनावश्यक रूप से संकीर्ण कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए सहज रखी गई है। ‘मैं, बारूक’ से कथावाचक की स्पष्ट आत्म-पहचान बनी रहती है; अंतिम विसर्ग आगामी वाणी की भूमिका दर्शाता है।
