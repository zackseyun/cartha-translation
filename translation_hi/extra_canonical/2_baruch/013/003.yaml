  text: Because you were shaken by what has happened to Zion, therefore you will surely be preserved until the consummation of the times, that you may be a testimony.
translation:
  language: hi
  text: क्योंकि सिय्योन के साथ जो हुआ, उससे तुम विचलित हो उठे हो, इसलिए समयों की पूर्णता तक तुम्हें निश्चय ही सुरक्षित रखा जाएगा, ताकि तुम एक गवाही बनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܬܙܝܥܘ
  choice: विचलित हो उठे हो
  rationale: मूल धातु हिलने या व्याकुल होने का भाव देती है। संदर्भ में यह सिय्योन की दशा पर बारूक की गहरी आंतरिक व्याकुलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: बाइबलीय स्थान-नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: ܫܘܠܡܐ ܕܙܒ̈ܢܐ
  choice: समयों की पूर्णता
  rationale: यह अभिव्यक्ति कालों के निर्धारित समापन या चरम-बिंदु को दर्शाती है। ‘पूर्णता’ मूल की युगान्तीय व्यापकता को बिना अतिरिक्त व्याख्या के बनाए रखती है।
- source_word: ܢܬܢܛܪ / preservation expression
  choice: सुरक्षित रखा जाएगा
  rationale: दैवी कर्म को व्यक्त करने वाले कर्मवाच्य भाव को सुरक्षित रखा गया है; कर्ता को पाठ से अधिक स्पष्ट नहीं किया गया।
- source_word: ܣܗܕܘܬܐ
  choice: एक गवाही
  rationale: ‘साक्षी’ कहने के बजाय संज्ञा ‘गवाही’ चुनी गई है, ताकि व्यक्ति के स्वयं प्रमाण या गवाही बन जाने का मूल भाव बना रहे।
theological_decisions:
- issue: बारूक के सुरक्षित रखे जाने की अवधि
  choice: समयों की पूर्णता तक
  alternative: युग के अन्त तक
  rationale: बहुवचन ‘समयों’ और पूर्णता/समापन की धारणा को बनाए रखा गया है; इसे किसी एक विशिष्ट अन्त-समय सिद्धान्त में सीमित नहीं किया गया।
- issue: अन्तिम उद्देश्य का स्वरूप
  choice: ताकि तुम एक गवाही बनो
  alternative: ताकि तुम साक्षी बनो
  rationale: मूल में व्यक्ति को केवल गवाही देने वाला नहीं, बल्कि स्वयं गवाही के रूप में प्रस्तुत करने की सम्भावना है; इसलिए इस तनाव को नहीं मिटाया गया।
- issue: संरक्षण का कर्ता
  choice: कर्मवाच्य—‘तुम्हें ... सुरक्षित रखा जाएगा’
  alternative: परमेश्वर तुम्हें सुरक्षित रखेगा
  rationale: दैवी कर्ता संदर्भ से समझा जा सकता है, पर मूल अभिव्यक्ति में जितना प्रत्यक्ष है उससे अधिक स्पष्टता नहीं जोड़ी गई।
