  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। वाक्य की कारण–परिणाम–उद्देश्य संरचना सुरक्षित रखी गई है। किसी सम्प्रदाय-विशेष की युगान्त-विषयक शब्दावली नहीं जोड़ी गई।
