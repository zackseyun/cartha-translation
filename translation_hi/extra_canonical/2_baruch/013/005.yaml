  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘कहना’ भावी आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है। वाक्य का अंतिम दीर्घ विराम इस बात को दिखाता है कि कथन अगले पद में जारी है।
