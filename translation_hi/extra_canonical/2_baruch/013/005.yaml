translation:
  language: hi
  text: तुम उनसे और उनके समान लोगों से कहना, “तुमने इस विपत्ति और इस दंड[b] को देखा है, जो अपने नियत समय[c] पर तुम पर और तुम्हारे नगर[a] पर आ पड़ा है—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लोगों”।
    reason: पूर्ववर्ती अनुवाद-परंपरा में संरक्षित वैकल्पिक पाठ।
  - marker: b
    text: या, “आने वाला प्रतिफल”।
    reason: पूर्ववर्ती अनुवाद में पाया जाने वाला वैकल्पिक निरूपण; मुख्य पाठ सिरियाई के एकवचन और पूर्ण घटना का अनुसरण करता है।
  - marker: c
    text: या, “उनके नियत समय पर”।
    reason: पूर्ववर्ती अनुवाद में संरक्षित वैकल्पिक सर्वनाम-संबंध; मुख्य पाठ सिरियाई के एकवचन प्रत्यय का अनुसरण करता है।
lexical_decisions:
- source_word: ܦܘܪܥܢܐ (purʿānā)
  choice: प्रतिफल
  rationale: यह शब्द कर्म के बदले मिलने वाले दंड या प्रतिदान का भाव रखता है। ‘प्रतिफल’ उस न्यायिक अर्थ को बनाए रखता है, जबकि केवल ‘दंड’ कहना अर्थ को कुछ संकरा कर देता।
- source_word: ܡܕܝܢܬܐ (mdīntā)
  choice: नगर
  rationale: सामान्य सिरियाई अर्थ ‘नगर/शहर’ है; इस विनाश-संदर्भ में ‘नगर’ स्वाभाविक और गरिमापूर्ण है। परंपरागत वैकल्पिक पाठ ‘लोग’ को पादटिप्पणी में रखा गया है।
- source_word: ܒܙܒܢܗ (b-zabneh)
  choice: अपने नियत समय पर
  rationale: एकवचन प्रत्यय और समय के नियत होने का भाव व्यक्त करता है; ‘अपने’ का संबंध एकवचन ‘प्रतिफल’ से है।
theological_decisions:
- issue: विपत्ति और प्रतिफल के बीच संबंध
  choice: दोनों संज्ञाओं को साथ रखते हुए प्रतिफल को न्यायिक परिणाम के रूप में व्यक्त किया
  alternative: दोनों को मिलाकर केवल ‘दंड’ कहना
  rationale: स्रोत विपत्ति और प्रतिफल दोनों का उल्लेख करता है; उन्हें मिला देने से कथन का तनाव और विस्तार घट जाता।
- issue: प्रतिफल का वचन और काल
  choice: एकवचन ‘इस प्रतिफल’ और पूर्ण घटना ‘आ पड़ा है’
  alternative: बहुवचन ‘प्रतिफल’ अथवा सामान्य वर्तमान ‘आते हैं’
  rationale: सिरियाई पाठ में संज्ञा और उससे संबद्ध संकेत एकवचन हैं तथा क्रिया पूर्ण घटना की ओर संकेत करती है।
