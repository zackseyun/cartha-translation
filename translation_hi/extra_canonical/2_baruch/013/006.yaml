    text: या, “ताकि उन्हें छोड़ दिया जाए,” अथवा “ताकि वे बचे रहें।”
    reason: सीरियाई ܢܫܬܒܩܘܢ का अर्थ ‘क्षमा किया जाए’ के साथ-साथ ‘छोड़ दिया जाए’ या ‘बचे रहें’ भी हो सकता है।
lexical_decisions:
- source_word: ܐܬܪܕܝܘ
  choice: उन्हें ताड़ना दी गई
  rationale: पूर्ण भूतकाल और सुधारात्मक अनुशासन—दोनों भावों को व्यक्त करता है; ‘अनुशासित किया गया’ आधुनिक हिन्दी में केवल व्यवस्थित या आज्ञाकारी बनाए जाने का अर्थ भी दे सकता है।
- source_word: ܗܝܕܝܢ
  choice: उस समय
  rationale: कालसूचक अर्थ ‘तब/उस समय’ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ܢܫܬܒܩܘܢ
  choice: उन्हें क्षमा किया जाए
  rationale: ताड़ना के प्रसंग में निष्क्रिय क्रिया का सबसे स्वाभाविक अर्थ ‘क्षमा किया जाना’ है, यद्यपि ‘छोड़ दिया जाना’ या ‘बचे रहना’ भी शब्दार्थ की दृष्टि से संभव है।
theological_decisions:
- issue: ताड़ना का उद्देश्य और ܢܫܬܒܩܘܢ का अर्थ
  choice: ताकि उन्हें क्षमा किया जाए
  alternative: ताकि उन्हें छोड़ दिया जाए / वे बचे रहें
  rationale: प्रसंग ताड़ना के बाद क्षमा की ओर संकेत करता है, पर सीरियाई क्रिया में छोड़े जाने अथवा बचे रहने की वास्तविक अर्थ-संभावना है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: क्रिया के कर्ता/प्राप्तकर्ता की पहचान
  choice: सर्वनाम ‘उन्हें’ को अनिर्दिष्ट रखा गया
  alternative: ‘जातियों को’ जोड़ना
  rationale: इस पद में ‘जातियाँ’ स्पष्ट रूप से उपस्थित नहीं हैं; उसे जोड़ने से प्रसंगगत विषय बदल जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘ताड़ना’ सुधारात्मक दंड का भाव देती है; वाक्य में किसी अनुपस्थित समूह या कर्ता को नहीं जोड़ा गया है।
