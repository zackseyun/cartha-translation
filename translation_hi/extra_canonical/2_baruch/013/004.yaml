  text: If the cities that now prosper should ever say, ‘Why has the mighty God brought this retribution upon us?’
translation:
  language: hi
  text: यदि वे नगर, जो अब समृद्ध हो रहे हैं, कभी कहें, “सामर्थी परमेश्वर ने हम पर यह दण्ड क्यों लाया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝ̈ܢܬܐ
  choice: नगर
  rationale: यह सिरियाई बहुवचन ‘नगरों/शहरों’ को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: सामर्थी परमेश्वर
  rationale: ܚܝܠܬܢܐ का अर्थ ‘शक्तिशाली/सामर्थी’ है; ‘सामर्थी’ मूल विशेषण को स्पष्ट रखते हुए धार्मिक हिन्दी में सहज है।
- source_word: ܦܘܪܥܢܐ
  choice: दण्ड
  rationale: इस प्रसंग में शब्द प्रतिदान या बदले के न्यायपूर्ण, प्रतिकूल परिणाम को दर्शाता है; ‘दण्ड’ साधारण पाठक के लिए स्पष्ट है और न्यायिक आशय बनाए रखता है।
theological_decisions:
- issue: नगरों की समृद्धि और उन पर आए दण्ड के बीच तनाव
  choice: प्रश्न को बिना व्याख्यात्मक समाधान के प्रत्यक्ष कथन के रूप में रखा गया है।
  alternative: दण्ड को उनके पापों का परिणाम बताकर कारण स्पष्ट करना।
  rationale: पद स्वयं प्रश्न उठाता है, पर इस वाक्य में उसका धर्मवैचारिक उत्तर नहीं देता; अतः मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘समृद्ध हो रहे हैं’ वर्तमान उन्नति का भाव देता है, जबकि उद्धृत प्रश्न मूल की प्रत्यक्षता बनाए रखता है।
