    ܕܒܝܬ ܡܩܕܫܐ. ܘܫܕܘ

    ܐܢܘܢ ܠܪܘܡܘܗܝ ܕܫܡܝܐ.

    ܘܗܒܘ ܐܢܘܢ ܠܡܪܝܐ.

    ܘܐܡܪܘ܆ ܛܪ ܒܝܬܟ ܐܢܬ.

    ܚܢܢ ܓܝܪ ܗܐ ܐܫܟܚܢ

    ܪ̈ܒܝ ܒ̈ܬܐ ܕܓ̈ܠܐ. ܘܐܬܚܙܝ

    ܒܬܘ̈ܠܬܐ ܕܥ̈ܙܠܢ ܒܘܨܐ.

    ܘܢܚ̈ܬܐ ܥܡ ܕܗܒܐ

    ܕܐܘܦܝܪ. ܐܣܬܪܗܒܝܢ

    ܘܫ̈ܩܠܢ ܡܠܒܘܫܐ ܘܝ̈ܕܒܢ

    ܒܢܘܪܐ. ܕܬܘܒܠܐ ܐܢܘܢ

    ܠܘܬ ܗܘ̇ ܕܒ̣ܥܕ ܐܢܘܢ.

    ܘܝܛܪܘܗܝ ܐܢܬܘܢ ܐܢܘܢ.

    ܠܘܬ ܗܘ̇ ܕܒ̣ܪܐ ܐܢܘܢ.

    ܕܠܐ ܢܫܬܠܛܘܢ ܒܗܘܢ

    11 ܡܒܥܕ̈ܢܘܗܝ. ܐܡ̇ܪ ܐܢܐ

    ܕܝܢ ܗ̣ܘ ܐܢܐ ܒܪܘܟ.

    ܠܡܘܒܠܢܝ ܒܒܟܝܐ. ܠܐܘ ܬܘܒ

    ܐܬܝܬ ܡܕܒܪܐ ܘܐܡ̣ܪܬ

    ܒܡܕܐ ܒܬܫܥ̈ܝܬܗ̇.

    ܟܐܒܐ ܗܘܘ ܠܝ ܪ

    ܠܥܠܡ. ܗܟܢܐ ܕܝܢ ܗܘܐ

    ܡܙܥܙ ܕܠܐ ܡܣܬܝܟ.

    ܘܐܢܫܐ ܕܒܝܬ ܓܘܣܝ

    ܀ ܡܘܫܚܬܐ ܕܐܝܬ ܗܘܐ

    ܡܕܥܝܗܝܢ ܘܐܘܦܢ ܚܕ̈ܕܐ.

    ܡܢܗ ܗܘܘ ܢܝܕ ܟܠ

    ܗܠܝܢ. ܐܘ ܠܡܢܘ ܢܫܟܘܚ

    ܟܠ ܡܕܡ ܕܕ̈ܝܩܢ. ܐܘ

    ܡܢܘ ܐܡܪ ܣܓܝܐܘ

    ܚܟܡܗ ܐܟܡܐ ܕܠܐ

    ܡܐ̈ܙܐ ܘܕ̈ܢܦܐ ܗܘܐ

    ܕܡܢܝܢ ܟܐܢܐ ܟܢܝܫܘ.

    ܠܐ ܓܝܪ ܝܕܥܘܗ̇ ܠܥܡܬܐ

    ܗܘܬ ܘܐܦ ܠܐ ܚܫܒܘܗ

    ܟܠ ܡܕܡ ܕܕ̈ܝܩܢ. ܢܘ̈ܦܝ

    ܒܥܝ ܐܢܫܐ ܕ̈ܢܘ. ܘܐܝܬ

    ܟܦܢܐ ܠܟܠ. ܘܐܝܬ ܗܘܘ

    ܒܚܘܫܒܐ ܘܐܡܪܘ ܠܡܘܬܐ.

    ܛܘܒܝܟܘܢ ܠܟܘܢ ܕܐܝܬ

    .. ܡܠܝܢ ܕܝܠܢ ܕܚܢܢ ܚܝܝܢ܀

    12 ܐܠܐ ܗܘܐ ܐܡܪ ܐܢܐ

    ܐܝܟ ܕܡܫܬܡܥ ܐܢܐ.

    ܘܐܡܠܠ ܠܡܘܒܕܢܗܘܢ ܕܐܒܐ

