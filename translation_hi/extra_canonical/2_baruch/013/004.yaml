    ܡܛܠ ܕܐܬܚܣܡܘ. ܘܗܘܐ

    ܚܕ ܐܬܪܘܬ ܒܡܠܟܐ

    ܘܐܡ̈ܘܬܐ ܚܝܒܝܢ ܐܬܘ'
