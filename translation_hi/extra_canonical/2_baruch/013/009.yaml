    ܕܬܬܒܝܐܘ ܒܬܪܟܢ.

    ܐܢ ܢܬܒܥ ܡܢܟܘܢ

    ܡܕܝ̈ܢܬܐ ܐܝܠܝܢ ܕܡ̈ܠܝܢ

    ܕܠܡܒܢܐ ܐܢܬܝܢ ܒܠܚܘ

    ܐܠܗܐ ܚܝܠܬܢܐ. ܦܘܪܥܢܐ

    ܗܘܐ. ܐܡܪ ܠܗܘܢ ܐܢܐ

