translation:
  language: hi
  text: इसलिए उसने पहले अपने ही पुत्रों तक को नहीं बख्शा, बल्कि उनके पाप करने के कारण उन्हें अपने शत्रुओं के समान पीड़ा दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܚܣ
  choice: नहीं बख्शा
  rationale: यह क्रिया दंड से बचाने या दया करके छोड़ देने का निषेध व्यक्त करती है; ‘नहीं बख्शा’ आधुनिक हिन्दी में अर्थ को स्वाभाविक और सटीक रूप से देता है।
- source_word: ܒܢܘ̈ܗܝ
  choice: अपने ही पुत्रों तक को
  rationale: संबंधसूचक प्रत्यय को ‘अपने’ से और अप्रत्याशित समावेश के बल को ‘ही…तक’ से व्यक्त किया गया है।
- source_word: ܐܝܟ ܒܥܠܕܒܒܘ̈ܗܝ
  choice: अपने शत्रुओं के समान
  rationale: तुलना के साथ स्रोत में निहित संबंधसूचक भाव भी सुरक्षित रखा गया है; इसलिए केवल ‘शत्रुओं के समान’ नहीं कहा गया।
- source_word: ܐܠܨ / ܥܢܝ
  choice: पीड़ा दी
  rationale: संदर्भ में यह दंडात्मक क्लेश पहुँचाने का भाव देता है; ‘पीड़ा दी’ स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
theological_decisions:
- issue: ‘पुत्रों’ और ‘शत्रुओं’ के बीच दैवी न्याय का तनाव
  choice: 'दोनों संबंधों को बिना नरम किए रखा गया: ‘अपने ही पुत्रों… अपने शत्रुओं के समान’।'
  alternative: ‘अपनी प्रजा को भी दंड दिया’ कहकर रूपक का अर्थ स्पष्ट करना।
  rationale: ‘पुत्रों’ को ‘प्रजा’ में बदलना स्रोत की पारिवारिक उपमा और उसके जानबूझकर रखे गए तीखे विरोध को मिटा देता।
- issue: दंड का कारण
  choice: ‘उनके पाप करने के कारण’
  alternative: ‘क्योंकि उन्होंने पाप किया था’
  rationale: दोनों अर्थतः संभव हैं; चुना हुआ रूप वाक्य को संक्षिप्त रखता है और दंड को पाप के परिणाम के रूप में स्पष्ट करता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘पहले’ को आरंभिक क्रियाखंड के पास रखा गया है ताकि कालगत विरोध स्पष्ट रहे। ‘अपने ही पुत्रों तक को’ स्रोत के जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
