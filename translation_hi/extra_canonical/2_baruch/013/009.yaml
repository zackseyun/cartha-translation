    ܗܠܝܢ ܒܡܠܟܝܢ. ܒܙܒܢܘ

    ܕܡܬܝܕܥܐ ܠܐܬܪܘܬ

    ܠܡܡܠܠܘ ܘܡ̇ܚܝܢ ܢܦܫܗܘܢ.

    ܘܐܢ ܠܐܡܕܢ ܒܗܘ̇ ܙܒܢܐ

