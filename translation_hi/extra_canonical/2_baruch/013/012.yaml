    rationale: In biblical Hindi, कृपा can suggest grace or favor. The source-control wording calls for the broader, ordinary sense of kindness.
  - severity: low
    issue: “कृपा को नकारा” is somewhat less idiomatic.
    rationale: Hindi more naturally speaks of rejecting or spurning a person’s kindness; “दयालुता को ठुकराया” retains the force of “denied” in context.
