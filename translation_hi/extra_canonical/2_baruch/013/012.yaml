translation:
  language: hi
  text: क्योंकि मैंने हर समय तुम्हारे साथ भलाई की, पर तुमने हर समय मेरी दयालुता को ठुकराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܛܐܒ / ܛܒܬܐ (अंग्रेज़ी परामर्श-पाठ में “did good”)
  choice: भला किया
  rationale: यह सामान्य आधुनिक हिन्दी में उपकार या हित करने का स्वाभाविक और गरिमापूर्ण भाव देता है। उपलब्ध सिरियाई पृष्ठ-पाठ इस स्थान पर अत्यंत विकृत है, इसलिए रूप का निर्धारण सावधानी से किया गया है।
- source_word: ܛܝܒܘܬܐ (संभावित; अंग्रेज़ी परामर्श-पाठ में “kindness”)
  choice: कृपा
  rationale: यह दयालु अनुग्रह और किए गए उपकार—दोनों के भाव को संक्षेप में रखता है, बिना किसी संप्रदायगत अर्थ को आरोपित किए।
- source_word: ܒܟܠ ܙܒܢ
  choice: हर समय
  rationale: समयगत निरंतरता को सरल, स्पष्ट हिन्दी में व्यक्त करता है और वाक्य के दोनों खंडों की समानांतरता बनाए रखता है।
- source_word: ܟܦܪ / ܠܐ ܝܕܥ (अंग्रेज़ी परामर्श-पाठ में “denied”)
  choice: नकारा
  rationale: कृपा को मानने या स्वीकार करने से इनकार का भाव सुरक्षित रहता है; इसे केवल भूलने या अकृतज्ञ होने तक सीमित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय कृपा और मानवीय अस्वीकार के बीच तनाव
  choice: “मैंने…भला किया” और “तुमने…मेरी कृपा को नकारा” दोनों कथनों को सीधे रखा गया
  alternative: इसे “तुम मेरी कृपा के लिए कृतज्ञ नहीं हुए” कहना
  rationale: “नकारा” मूल कथन की अधिक तीखी जवाबदेही और वास्तविक अस्वीकार को बनाए रखता है; इसे केवल कृतज्ञता की कमी बनाकर हल्का नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। दोहराए गए “हर समय” से स्रोत/परामर्श-पाठ की वक्तृता और समानांतर संरचना सुरक्षित रखी गई है। उपलब्ध सिरियाई पृष्ठ-पाठ में पद-सीमा और OCR गंभीर रूप से अस्पष्ट हैं, इसलिए अंग्रेज़ी POB को नियंत्रित परामर्श-साक्ष्य के रूप में लेते हुए सावधान स्रोत-पुनर्निर्माण अपनाया गया है।
