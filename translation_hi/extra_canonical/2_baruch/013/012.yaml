  verdict: revise
  source_fidelity: The available Syriac page extract is materially discontinuous around the verse boundary, so the English POB audit text is necessary as a control. The draft preserves the twofold temporal emphasis, the divine first-person action, and the contrast between beneficence and its rejection.
  naturalness: The sentence is clear and idiomatic. However, “मेरी कृपा को नकारा” is less natural than an idiom of rejecting or spurning kindness; “दयालुता को ठुकराया” reads more smoothly in modern standard Hindi.
  terminology: “कृपा” can carry a more specialized theological sense of grace than the audit trail’s “kindness” requires. “दयालुता” conveys kindness without adding that potential nuance. “भलाई की” is a natural rendering of “did good.”
  issues:
