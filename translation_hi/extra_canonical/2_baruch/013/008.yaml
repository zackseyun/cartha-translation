translation:
  language: hi
  text: मैं तुमसे कहता हूँ, “तुमने छना हुआ दाखमधु पिया है; तुम उसकी तलछट भी पियोगे, क्योंकि परमप्रधान का न्याय पक्षपात नहीं करता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡܪ ܐܢܐ ܠܟܘܢ
  choice: मैं तुमसे कहता हूँ
  rationale: प्रथम पुरुष वक्ता और बहुवचन संबोधन को स्पष्ट रूप से बनाए रखता है; इसे ‘तुम उनसे कहना’ बनाना वक्ता और श्रोता, दोनों को बदल देगा।
- source_word: ܚܡܪܐ ܡܕܝܠܢܐ
  choice: छना हुआ दाखमधु
  rationale: विशेषण शुद्ध या छाने हुए दाखमधु का बोध कराता है और आगे आने वाली ‘तलछट’ के साथ जानबूझकर रखा गया विरोध बनाए रखता है।
- source_word: ܕܠܡܐ
  choice: तलछट
  rationale: दाखमधु के नीचे बचने वाले गाढ़े अवशेष का स्वाभाविक हिन्दी रूप; न्याय के कड़वे परिणाम का रूपक सुरक्षित रहता है।
- source_word: ܕܝܢܐ ܕܡܪܝܡܐ
  choice: परमप्रधान का न्याय
  rationale: ईश्वर के लिए प्रयुक्त उपाधि और न्यायिक अर्थ, दोनों को सीधे और पारंपरिक किंतु बोधगम्य हिन्दी में रखता है।
- source_word: ܠܐ ܡܣܒ ܒܐܦ̈ܐ
  choice: किसी का पक्ष नहीं करता
  rationale: शाब्दिक मुहावरे ‘चेहरा ग्रहण करना’ का स्वाभाविक हिन्दी अर्थ पक्षपात न करना है।
theological_decisions:
- issue: दिव्य न्याय में निष्पक्षता
  choice: परमप्रधान का न्याय किसी का पक्ष नहीं करता
  alternative: परमप्रधान का न्याय किसी का मुँह नहीं देखता
  rationale: अर्थगत तनाव को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट किया गया है कि राष्ट्र या व्यक्ति विशेष के प्रति पक्षपात नहीं होगा; बोलचाल के मुहावरे से संभावित अस्पष्टता टाली गई है।
- issue: वक्ता और संबोधित समूह
  choice: ईश्वरीय वाणी में प्रथम पुरुष वक्ता बहुवचन समूह से सीधे कहता है
  alternative: बारूक को आदेश दिया जाता है कि वह उनसे कहे
  rationale: प्रस्तुत सिरिएक वाक्य-रचना और उपलब्ध पाठ-समीक्षा प्रथम पुरुष ‘मैं’ तथा बहुवचन ‘तुमसे’ का समर्थन करती है; वैकल्पिक रूप वक्ता-गतिशीलता बदल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबलीय साहित्यिक रजिस्टर बनाए रखता है, जबकि ‘तलछट’ और ‘पक्ष नहीं करता’ रूपक तथा न्याय-विषयक कथन को स्पष्ट रखते हैं।
