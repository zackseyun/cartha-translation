lexical_decisions:
- source_word: ܐܬܡܗܬ
  choice: चकित होना
  rationale: यह मनुष्य के चले जाने और न्याय के सामने स्तब्ध विस्मय को व्यक्त करता है, केवल जिज्ञासा को नहीं।
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: निश्चित, वाचागत व्यवस्था का भाव बनाए रखता है और आधुनिक हिन्दी बाइबलीय प्रयोग में सहज है।
- source_word: ܡܕܥܐ / ܚܟܡܬܐ
  choice: समझ
  rationale: यह नैतिक ज्ञान, शिक्षा और उसके फलस्वरूप बढ़ी हुई उत्तरदायित्वशीलता के बीच संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ܐܝܩܪܐ
  choice: महिमा
  rationale: आनेवाले प्रतिफल की गरिमा और वैभव को व्यक्त करता है; मुकुट के साथ यह स्रोत के प्रतिफल-संबंधी चित्र को बनाए रखता है।
theological_decisions:
- issue: अधिक समझ से न्याय की उत्तरदायित्वशीलता क्यों बढ़ती है
  choice: समझते हुए किया गया उल्लंघन उसी प्राप्त समझ के कारण अधिक उत्तरदायित्व लाता है।
  alternative: ज्ञान केवल पाप को पहचानने योग्य बनाता है, पर उत्तरदायित्व नहीं बढ़ाता।
  rationale: अनुच्छेद का तर्क व्यवस्था और समझ पाने के बाद किए गए उल्लंघन को दण्ड का स्पष्ट आधार बनाता है।
- issue: धर्मियों का वर्तमान संसार और आनेवाली वास्तविकता से संबंध
  choice: वर्तमान संसार उनके लिए क्लेशपूर्ण संघर्ष है, जबकि आनेवाला उनके लिए महिमामय प्रतिफल है।
  alternative: केवल वर्तमान संसार ही अभिप्रेत है।
  rationale: पाठ वर्तमान परिश्रम और भावी मुकुट को जानबूझकर आमने-सामने रखता है; इसलिए दोनों कालगत क्षितिज सुरक्षित रखे गए हैं।
- issue: ‘जो आनेवाला है’ का आशय
  choice: इसे ‘आनेवाला संसार’ कहकर स्पष्ट करने के बजाय स्रोत की अपेक्षाकृत खुली अभिव्यक्ति ‘जो आनेवाला है’ रखी गई है।
  alternative: आनेवाला संसार
  rationale: इससे भावी युग या भावी प्रतिफल—दोनों से जुड़ सकने वाली वास्तविक अस्पष्टता बनी रहती है।
