  text: 'And the Lord answered and said to me:

    “You are right to be astonished at man’s passing, but your judgment about the evils that befall sinners is not right.


    And as for what you said about the righteous who are taken away and the wicked who prosper,

    and as for what you said—that man does not know your judgment—

    because of this, listen now and I will speak to you; pay attention and I will make my words heard.


    Indeed, man would not have understood my judgment if he had not received the Law and if I had not instructed him in understanding.

    But now, because he has transgressed while understanding, he will surely be punished because of that understanding.

    And as for the righteous, concerning whom you said that the world came on their account: what is coming is likewise on their account.

    For to them this world is a struggle and a labor with much trouble, but what is to come is a crown with great glory.”'
translation:
  language: hi
  text: 'और प्रभु ने मुझे उत्तर दिया:


    “मनुष्य के चले जाने पर तुम्हारा चकित होना उचित है; पर पापियों पर आनेवाली विपत्तियों के विषय में तुम्हारा विचार उचित नहीं है।


    और जो तुमने उन धर्मियों के विषय में कहा जो उठा लिए जाते हैं, और उन दुष्टों के विषय में जो फलते-फूलते हैं;


    और जो तुमने कहा कि मनुष्य मेरे न्याय को नहीं जानता—


    इसलिए अब सुनो, और मैं तुमसे कहूँगा; ध्यान दो, और मैं तुम्हें अपने वचन सुनाऊँगा।


    यदि मनुष्य को व्यवस्था न मिली होती और मैंने उसे समझ न दी होती, तो वह मेरे न्याय को न समझ पाता।


    पर अब, क्योंकि उसने समझते हुए भी उल्लंघन किया है, इसलिए उस समझ के कारण उसे निश्चय ही दण्ड मिलेगा।


    और जिन धर्मियों के विषय में तुमने कहा कि संसार उन्हीं के कारण आया है—जो आनेवाला है, वह भी उन्हीं के कारण आएगा।


    क्योंकि उनके लिए यह संसार बहुत क्लेश से भरा संघर्ष और परिश्रम है, पर जो आनेवाला है वह बड़ी महिमा का मुकुट है।”'
