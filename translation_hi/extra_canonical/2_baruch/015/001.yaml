  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रभु’, ‘व्यवस्था’, ‘धर्मी’, ‘उल्लंघन’ और ‘दण्ड’ जैसे परिचित बाइबलीय शब्द प्रयुक्त हैं, पर वाक्य-विन्यास अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया। स्रोत की खुली अभिव्यक्ति ‘जो आनेवाला है’ को बिना संप्रदायगत विस्तार के सुरक्षित रखा गया है।
