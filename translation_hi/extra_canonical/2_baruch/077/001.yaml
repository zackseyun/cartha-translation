  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मैं, बारूक’ मूल के स्पष्ट आत्मपरिचय को बनाए रखता है; ‘सबको’ मूल मुहावरे में निहित संपूर्णता को स्वाभाविक हिन्दी में सामने लाता है।
