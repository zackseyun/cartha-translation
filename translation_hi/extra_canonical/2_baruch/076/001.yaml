  yaml_path: translation/extra_canonical/2_baruch/076/001.yaml
  text: And he answered and said to me, “Because you have prayed that I show you what will happen to you after these things, for this reason I have shown you this vision, that you may see what will happen to you after these things. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going. And this shall be after forty days. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “क्योंकि तूने मुझसे आग्रह किया था कि मैं तुझे दिखाऊँ कि जो हो चुका है, वह कैसे रचा गया, इसलिए तुझे समझ की उत्तम शिक्षा दी गई है[a]—कि इन बातों के बाद जो होनेवाला है, वह कैसा होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस स्थान का सिरियाई पाठ कठिन और संभवतः विकृत है। इसका अर्थ यह भी हो सकता है: “जो हो चुका है और जो रचा गया है, उसके विषय में समझ की उत्तम शिक्षा तुझे दिखाई गई है।”'
    reason: प्रदत्त सिरियाई में शब्द-विभाजन और वाक्य-संबंध अनिश्चित हैं; पादटिप्पणी वास्तविक पाठगत अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: ܐܦܝܣܬ ܠܝ
  choice: तूने मुझसे आग्रह किया था
  rationale: क्रिया में मनाने, अनुरोध करने या आग्रह करने का भाव है। यहाँ ‘आग्रह किया’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: ܐܚܘܝܟ
  choice: मैं तुझे दिखाऊँ
  rationale: यह ܚܘܝ की प्रथम पुरुष एकवचन रूपावली है, जिसका अर्थ किसी को दिखाना या प्रकट करना है।
- source_word: ܝܘܠܦܢܐ ܡܥܠܝܬܐ ܕܡܕܥܐ
  choice: समझ की उत्तम शिक्षा
  rationale: पाठ के संभावित रूप को ‘ज्ञान/समझ की श्रेष्ठ शिक्षा’ के अर्थ में लिया गया है; हिन्दी में यह अभिव्यक्ति अर्थ और गरिमा दोनों बनाए रखती है।
- source_word: ܥܬܝܕ ܠܡܗܘܐ
  choice: जो होनेवाला है
  rationale: यह भविष्य में घटित या अस्तित्व में आनेवाली बात को सूचित करता है; अनावश्यक व्याख्या के बिना भविष्यसूचक बल रखा गया है।
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: इन बातों के बाद
  rationale: यह वाक्यांश कालक्रम को सीधा व्यक्त करता है और मूल की सामान्य अनिश्चितता बनाए रखता है।
theological_decisions:
- issue: यह पद बीती हुई सृष्टि और आगामी घटनाओं के बीच संबंध कैसे व्यक्त करता है
  choice: बीती हुई बात के रचे जाने और आगे होनेवाली बात—दोनों को पाठ की कठिन वाक्य-रचना के अनुसार साथ रखा गया है।
  alternative: इसे केवल आगामी घटनाओं के ‘प्रकाशन’ के रूप में प्रस्तुत करना।
  rationale: प्रदत्त सिरियाई साक्ष्य में ‘जो हो चुका है’ और ‘कैसे रचा गया’ जैसे पद दिखाई देते हैं। केवल भविष्यवाणी के रूप में अनुवाद करना उन शब्दों को हटा देता और परंपरागत पुनर्निर्माण को प्राथमिक पाठ पर थोपता।
