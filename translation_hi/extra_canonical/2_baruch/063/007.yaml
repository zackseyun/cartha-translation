  text: And he went out and destroyed their multitude; the number of the chiefs alone was one hundred and eighty-five thousand, and each one of them had the like number.
translation:
  language: hi
  text: और वह बाहर निकला और उनकी बड़ी भीड़ को नष्ट कर दिया। केवल उनके प्रधानों की संख्या एक लाख पचासी हज़ार थी, और उनमें से प्रत्येक के अधीन उतने ही लोग थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܢܦܩ
  choice: और वह बाहर निकला
  rationale: क्रिया तृतीय पुरुष पुल्लिंग एकवचन है; इसलिए कर्ता ‘वह’ है, ‘मैं’ नहीं।
- source_word: ܐܘܪܒܘ
  choice: नष्ट कर दिया
  rationale: संदर्भ में शत्रु-सेना पर घातक प्रहार का भाव है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ܪ̈ܘܪܒܢܐ / chiefs (consultation layer)
  choice: प्रधानों
  rationale: यह सेना के प्रमुख अथवा अधिकारी जनों को दर्शाता है; ‘प्रधान’ पद की व्यापकता बनाए रखता है।
- source_word: ܒܠܚܘܕ
  choice: ही
  rationale: ‘केवल प्रधानों की संख्या ही’ मूल के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विनाश करने वाले का पुरुष-वचन
  choice: ‘वह’—तृतीय पुरुष
  alternative: ‘मैं’—प्रथम पुरुष
  rationale: प्राप्त सीरियाई क्रियारूप तृतीय पुरुष पुल्लिंग एकवचन का समर्थन करता है; प्रथम पुरुष वाला पुराना पाठ यहाँ उचित नहीं है।
- issue: अंतिम वाक्य में संख्या का संबंध
  choice: हर प्रधान के अधीन उतने ही लोग थे
  alternative: हर एक स्वयं उसी संख्या के बराबर था
  rationale: शाब्दिक संरचना असामान्य है, पर सैन्य प्रसंग में आशय अधीनस्थ जनों की समान संख्या से है; अनावश्यक धार्मिक व्याख्या जोड़े बिना इसे बोधगम्य बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘एक लाख पचासी हज़ार’ भारतीय संख्या-प्रयोग के अनुसार है। अंग्रेज़ी परामर्श-पाठ की प्रथम-पुरुष वाली पूर्ववर्ती वैकल्पिक टिप्पणी नहीं रखी गई, क्योंकि सीरियाई रूप तृतीय पुरुष को स्पष्ट रूप से समर्थन देता है।
