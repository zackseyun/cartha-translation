lexical_decisions:
- source_word: 'ܨܗܝܘܢ (पुनर्निर्मित पद-पाठ: ‘सिय्योन’)'
  choice: सिय्योन
  rationale: पारंपरिक स्थान-नाम को आधुनिक मानक हिन्दी में प्रचलित बाइबलीय रूप में रखा गया है।
- source_word: 'ܐܬܦܨܝܬ (संभावित: ‘बचाई गई’)'
  choice: बचाया गया
  rationale: निष्क्रिय क्रिया का अर्थ और उद्धार का भाव बनाए रखते हुए सिय्योन के हिन्दी व्याकरणिक लिंग के अनुसार रूप चुना गया है।
- source_word: 'ܐܘܪܫܠܡ (पुनर्निर्मित पद-पाठ: ‘यरूशलेम’)'
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: 'ܐܬܦܪܩܬ (संभावित: ‘छुड़ाई गई’)'
  choice: छुड़ाया गया
  rationale: पहली क्रिया की पुनरावृत्ति किए बिना मुक्ति/छुटकारे की निकटवर्ती अर्थ-छाया सुरक्षित रखी गई है।
- source_word: 'ܐܝܣܪܐܝܠ (पुनर्निर्मित पद-पाठ: ‘इस्राएल’)'
  choice: इस्राएल
  rationale: नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: 'ܡܢ ܐܘܠܨܢܐ (संभावित: ‘संकट से’)'
  choice: संकट से
  rationale: व्यक्तिगत मानसिक व्यथा तक अर्थ सीमित न करके बाहरी विपत्ति, दबाव और क्लेश की व्यापकता रखता है।
theological_decisions:
- issue: तीन निष्क्रिय मुक्ति-वाक्यों में कर्ता का उल्लेख नहीं
  choice: निष्क्रिय वाच्य बनाए रखा गया और उद्धारकर्ता का नाम नहीं जोड़ा गया।
  alternative: ‘परमेश्वर ने सिय्योन को बचाया...’
  rationale: पद में निहित दैवी कर्ता संभव है, पर उसे स्पष्ट रूप से जोड़ना मूल की संक्षिप्तता और निहितता को अनावश्यक रूप से हल कर देता।
- issue: सिय्योन, यरूशलेम और इस्राएल का परस्पर संबंध
  choice: तीनों को पाठ के अनुसार अलग-अलग समानांतर पदों में रखा गया।
  alternative: तीनों को एक ही समुदाय के पर्याय मानकर मिला देना
  rationale: काव्यात्मक समानांतरता और संभावित भौगोलिक-सामुदायिक भेद को सुरक्षित रखना आवश्यक है।
