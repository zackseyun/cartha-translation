- issue: ‘सामर्थी’ की पहचान
  choice: दिव्य उपाधि के रूप में ‘सामर्थी’
  alternative: ‘सर्वशक्तिमान परमेश्वर’
  rationale: स्रोत की उपाधि से आगे बढ़कर सर्वशक्तिमत्ता की व्यवस्थित धर्मवैज्ञानिक संकल्पना या स्पष्ट नाम ‘परमेश्वर’ नहीं जोड़ा गया।
- issue: प्रार्थना पर प्रतिक्रिया
  choice: ‘उसकी सुन ली’ और ‘ध्यान दिया’
  alternative: ‘उसकी प्रार्थना स्वीकार कर ली’
  rationale: ‘स्वीकार’ परिणाम को अधिक निश्चित बना देता; चुना हुआ पाठ सुनने और ध्यान देने की स्रोतगत अभिव्यक्तियों को अलग-अलग बनाए रखता है।
