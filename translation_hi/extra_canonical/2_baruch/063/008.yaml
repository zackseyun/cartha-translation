  yaml_path: translation/extra_canonical/2_baruch/063/008.yaml
  text: And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.
translation:
  language: hi
  text: और उस समय मैंने उनके शरीर भीतर से जला दिए, पर उनके वस्त्र और हथियार बाहर से सुरक्षित रखे, ताकि शक्तिमान के और भी बड़े आश्चर्य देखे जाएँ और सारी पृथ्वी पर उसका नाम लिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܘܗܝ / Mighty One (contextual title)
  choice: पराक्रमी
  rationale: यह परमेश्वर के लिए प्रयुक्त सामर्थ्य-सूचक उपाधि को सहज और गरिमापूर्ण हिन्दी में रखता है, बिना किसी अतिरिक्त सांप्रदायिक अर्थ के।
- source_word: from within / outwardly
  choice: भीतर से / बाहर से
  rationale: शरीरों के जलने और वस्त्रों तथा हथियारों के सुरक्षित रहने के बीच मूल विरोध को स्पष्ट रूप से बनाए रखता है।
- source_word: might be spoken
  choice: चर्चा हो
  rationale: नाम के सारी पृथ्वी पर प्रसिद्ध और कथित होने का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: ‘उसके नाम’ का संदर्भ
  choice: सर्वनाम को ‘पराक्रमी’ के संदर्भ में बनाए रखा
  alternative: ‘परमेश्वर के नाम’ कहकर संदर्भ को स्पष्ट करना
  rationale: मूल की सर्वनामगत अभिव्यक्ति और साहित्यिक संबंध को सुरक्षित रखा गया है; उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: वक्ता द्वारा विनाश का प्रथम-पुरुष वर्णन
  choice: ‘मैंने ... जला दिया’ को यथावत रखा
  alternative: निष्क्रिय रूप ‘उनके शरीर जला दिए गए’
  rationale: प्रथम-पुरुष कर्तृत्व कथन का महत्वपूर्ण कथात्मक और धर्मवैचारिक तनाव है, इसलिए उसे धुंधला नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और कथात्मक है। ‘पराक्रमी’ को उपाधि के रूप में रखा गया है और भीतर/बाहर का विरोध स्पष्ट संरक्षित है।
