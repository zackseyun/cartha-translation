lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: पवित्र देश
  rationale: स्थानवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ ‘देश’ भूमि और प्रदेश दोनों का भाव समेटता है।
- source_word: ܚܝܠܬܢܐ
  choice: परमशक्तिमान
  rationale: ईश्वर के लिए प्रयुक्त उपाधि ‘Mighty One’ का dignified और सहज हिन्दी रूप; इसे किसी अधिक विशिष्ट साम्प्रदायिक पद से नहीं जोड़ा गया।
- source_word: ܐܫܬܒܚ
  choice: महिमा हुई
  rationale: 'निष्क्रिय भाव को बनाए रखता है: नाम की महिमा की गई/वह महिमान्वित हुआ, बिना कर्ता को अनावश्यक रूप से निश्चित किए।'
- source_word: ܡܬܡܠܠ
  choice: उसकी चर्चा होने लगी
  rationale: नाम के व्यापक रूप से बोले या वर्णित किए जाने का भाव स्वाभाविक हिन्दी में देता है और वाक्य के परिणामसूचक संबंध को बनाए रखता है।
theological_decisions:
- issue: ‘परमशक्तिमान’ की उपाधि का संदर्भ
  choice: इसे ईश्वर के लिए स्वतंत्र उपाधि के रूप में रखा गया है।
  alternative: ‘सर्वशक्तिमान परमेश्वर’
  rationale: मूल में उपस्थित उपाधि से आगे बढ़कर ‘परमेश्वर’ जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: महिमा करने वाले का कर्ता
  choice: ‘नाम की महिमा हुई’ कहकर कर्ता अनिर्दिष्ट रखा गया है।
  alternative: ‘सब लोगों ने उसके नाम की महिमा की’
  rationale: मूल का निष्क्रिय रूप यह स्पष्ट नहीं करता कि कर्ता केवल पहले बताए गए लोग ही थे; इसलिए उस अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘रहनेवाले’ संदर्भगत निवास को सहज बनाता है, जबकि मूल कथन का अर्थ नहीं बदलता।
