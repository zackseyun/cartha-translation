translation:
  language: hi
  text: और जो आठवाँ उजला जल तुमने देखा था—वह यहूदा के राजा हिजकिय्याह की सत्यनिष्ठा और धर्मनिष्ठा तथा उस पर हुई कृपा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܘܗܪ̈ܐ
  choice: उजला जल
  rationale: दर्शन में उजले और अँधेरे जल का प्रतीकात्मक विरोध है। ‘उजला जल’ इस बिंब को सहज हिन्दी में बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ
  choice: खराई और सीधाई
  rationale: दोनों नैतिक पदों के संयुक्त बल को बनाए रखते हुए यह अभिव्यक्ति आधुनिक, सामान्य और गरिमापूर्ण हिन्दी देती है।
- source_word: ܛܝܒܘܬܐ
  choice: कृपा
  rationale: यहाँ शब्द हिजकिय्याह पर हुए हितकारी ईश्वरीय अनुग्रह को व्यक्त करता है। ‘कृपा’ स्वाभाविक है और किसी संकीर्ण पारिभाषिक अर्थ को आरोपित नहीं करती।
- source_word: ܚܙܩܝܐ
  choice: हिजकिय्याह
  rationale: राजा Hezekiah के नाम का हिन्दी बाइबलीय रूप, जो स्रोत-नाम की पहचान स्पष्ट रखता है।
theological_decisions:
- issue: क्या हिजकिय्याह की प्रशंसा केवल उसके नैतिक चरित्र के रूप में कही जाए या उसके चरित्र और उस पर हुई ईश्वरीय कृपा—दोनों के रूप में
  choice: उसकी खराई और सीधाई तथा उस पर हुई कृपा—दोनों को अलग किंतु संबद्ध तत्वों के रूप में रखा गया है।
  alternative: वचन को केवल हिजकिय्याह की नैतिक उत्कृष्टता अथवा केवल अमूर्त ईश्वरीय भलाई के रूप में प्रस्तुत करना।
  rationale: स्रोत-साक्ष्य नैतिक गुणों और उस पर आने वाले हितकारी अनुग्रह में भेद रखता है; अनुवाद उस तनाव और द्वैत को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक जल-बिंब के अनुरूप रखी गई है। ‘जल’ को हिन्दी में द्रव्यवाचक एकवचन रूप में रखा गया है, यद्यपि सिरिएक अभिव्यक्ति रूपतः बहुवचन है।
