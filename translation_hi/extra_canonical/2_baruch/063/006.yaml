translation:
  language: hi
  text: तब पराक्रमी ने अपने स्वर्गदूत रमीएल को, जो तुमसे बातें करता है, आज्ञा दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܘܗܝ
  choice: पराक्रमी
  rationale: यहाँ यह परमेश्वर के लिए प्रयुक्त सामर्थ्य-सूचक उपाधि है; ‘पराक्रमी’ मूल की उपाधिमूलक संक्षिप्तता बनाए रखता है।
- source_word: ܡܠܐܟܘܗܝ
  choice: अपने स्वर्गदूत
  rationale: मूल में दूत के साथ तृतीय पुरुष संबंधसूचक प्रत्यय है; हिन्दी में कर्ता की ओर लौटते संबंध को स्वाभाविक रूप से ‘अपने’ व्यक्त करता है।
- source_word: Ramiel (textually represented in the clause; OCR in supplied source is corrupt)
  choice: रमीएल
  rationale: व्यक्तिनाम का सरल देवनागरी लिप्यंतरण, अंग्रेज़ी परामर्श-पाठ और पद-संदर्भ से पुष्ट।
- source_word: ܕܡܡܠܠܐ …
  choice: जो तुमसे बातें करता है
  rationale: संबंधवाचक उपवाक्य को वर्तमानकालीन, स्वाभाविक हिन्दी में रखा गया है; यह रमीएल की पहचान बताता है।
- source_word: ܦܩܕ
  choice: आज्ञा दी
  rationale: क्रिया का सामान्य और गरिमापूर्ण हिन्दी समतुल्य, बिना आज्ञा की विषयवस्तु जोड़े।
theological_decisions:
- issue: परमेश्वर की सामर्थ्य-सूचक उपाधि
  choice: पराक्रमी
  alternative: सर्वशक्तिमान
  rationale: ‘सर्वशक्तिमान’ मूल की तुलना में पूर्ण सर्वशक्तिमत्ता का अधिक विशिष्ट धर्मवैज्ञानिक दावा कर सकता है; ‘पराक्रमी’ सामर्थ्य का भाव रखते हुए अतिव्याख्या से बचता है।
- issue: रमीएल का परिचय
  choice: अपने स्वर्गदूत रमीएल को, जो तुमसे बातें करता है
  alternative: बात करनेवाले अपने स्वर्गदूत रमीएल को
  rationale: संबंधवाचक संरचना मूल के परिचयात्मक उपवाक्य को स्पष्ट रखती है और यह अस्पष्ट नहीं करती कि बोलने वाला रमीएल है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। उपलब्ध सिरिएक पृष्ठ का OCR इस स्थान पर विकृत है, इसलिए पद-सीमा और नाम की पहचान अध्याय-संदर्भ तथा ऑडिट किए गए अंग्रेज़ी परामर्श-पाठ से नियंत्रित की गई है।
