  yaml_path: translation/extra_canonical/2_baruch/063/003.yaml
  text: and when Hezekiah the king heard what the king of Assyria was devising—to come, seize him, destroy his people, the two and a half tribes that remained, and even overthrow Zion—then Hezekiah trusted in his works, hoped in his righteousness, and spoke with the Mighty One.
translation:
  language: hi
  text: जब राजा हिजकिय्याह ने सुना कि अश्शूर का राजा यह योजना बना रहा है—वह आकर उसे पकड़े, उसकी प्रजा, अर्थात् बचे हुए ढाई गोत्रों को नष्ट करे, और सिय्योन को भी ढा दे—तब हिजकिय्याह ने अपने कामों पर भरोसा किया, अपनी धार्मिकता पर आशा रखी और सामर्थी परमेश्वर से बात की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ ܡ̇ܠܟܐ
  choice: राजा हिजकिय्याह
  rationale: नाम और राजकीय पद को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ܡ̇ܠܟܐ ܕܐܬܘܪ
  choice: अश्शूर का राजा
  rationale: प्राचीन साम्राज्य के पारंपरिक हिन्दी बाइबलीय नाम ‘अश्शूर’ को अपनाया गया है।
- source_word: ܚܫܒ̣ܐ
  choice: योजना बना रहा है
  rationale: संदर्भ में यह मन में विचार करने से बढ़कर आक्रमण की मंशा और योजना को व्यक्त करता है।
- source_word: ܬܪ̈ܝܗܘܢ ... ܦܠܓܘܬܐ
  choice: ढाई गोत्र
  rationale: इस्राएल की शेष ढाई गोत्रों के ऐतिहासिक संकेत को संक्षिप्त और परिचित रूप में रखा गया है।
- source_word: ܥܒ̈ܕܘܗܝ
  choice: अपने कामों
  rationale: शाब्दिक ‘कर्मों/कामों’ को बनाए रखा गया है; इसे उपलब्धियों या पुण्यों के रूप में व्याख्यायित नहीं किया गया।
- source_word: ܙܕܝܩܘܬܗ
  choice: अपनी धार्मिकता
  rationale: धार्मिक-नैतिक अर्थ और कथन में निहित तनाव को सुरक्षित रखने के लिए ‘धार्मिकता’ चुना गया है।
- source_word: ܚܝܠܬܢܐ
  choice: सामर्थी परमेश्वर
  rationale: दैवी उपाधि का अर्थ सामान्य पाठक के लिए स्पष्ट करते हुए परमेश्वर के सामर्थ्य पर बल रखा गया है।
theological_decisions:
- issue: हिजकिय्याह का अपने कामों और धार्मिकता पर भरोसा
  choice: कथन को बिना प्रशंसा या निंदा जोड़े सीधे रखा गया है।
  alternative: इसे परमेश्वर पर विश्वास के अर्थ में नरम करना, या आत्म-धार्मिकता कहकर निंदात्मक बनाना।
  rationale: मूल कथन में मौजूद धर्मवैचारिक तनाव को अनिर्णीत रखना आवश्यक है।
- issue: दैवी संबोधन ‘Mighty One’
  choice: ‘सामर्थी परमेश्वर’
  alternative: केवल ‘सामर्थी’ या ‘सर्वशक्तिमान’
  rationale: ‘सामर्थी’ उपाधि के मूल भाव को रखता है, जबकि ‘परमेश्वर’ हिन्दी में संदर्भ स्पष्ट करता है; ‘सर्वशक्तिमान’ अधिक विशिष्ट धर्मवैचारिक पद बन सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। लंबे वाक्य की घटनाओं को डैश से व्यवस्थित किया गया है। ‘ढा दे’ सिय्योन के विनाश को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘बात की’ मूल के अपेक्षाकृत सामान्य संवाद-क्रियापद को अनावश्यक रूप से ‘प्रार्थना की’ नहीं बनाता।
