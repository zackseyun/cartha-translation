  text: “Behold, Sennacherib is prepared to destroy us, and he will be exalted and lifted up when he destroys Zion.”
translation:
  language: hi
  text: “देखो, सन्हेरीब हमें नष्ट करने के लिए तैयार है; और जब[a] वह सिय्योन को नष्ट करेगा, तब वह ऊँचा उठाया जाएगा और महान ठहराया जाएगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह सिय्योन को नष्ट करे।”
    reason: संयोजक को शर्तवाचक समझने की वैकल्पिक संभावना को दर्ज करने के लिए।
  - marker: b
    text: 'कुछ पद-विभाजनों के अनुसार आरम्भ हो सकता है: “और उसने कहा, ‘देखो…’”'
    reason: ‘और उसने कहा’ संभवतः पिछले पद के अंत का भाग है; वैकल्पिक पद-विभाजन को बिना मुख्य पाठ में दोहराए सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ܚܙܘܩܐ
  choice: सन्हेरीब
  rationale: इस प्रसंग में यह रूप असीरियाई राजा सन्हेरीब के नाम को सूचित करता है; हिन्दी बाइबलीय परंपरा में प्रचलित रूप अपनाया गया है।
- source_word: ܡܕܐ / ܡܐ ܕـ
  choice: जब
  rationale: यहाँ संयोजक का अर्थ कालवाचक है—‘जब’—न कि अनिवार्य रूप से शर्तवाचक ‘यदि’।
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: स्थान-नाम के लिए हिन्दी पाठकों में परिचित बाइबलीय रूप रखा गया है।
- source_word: ܡܬܬܪܝܡ ... ܪܡܐ
  choice: ऊँचा उठाया और महान किया जाएगा
  rationale: स्रोत के ऊँचा किए जाने संबंधी समानांतर भावों को दो पदों में बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: सिय्योन के विनाश को शर्त या अपेक्षित घटना के रूप में व्यक्त करना
  choice: ‘जब वह सिय्योन को नष्ट करेगा’
  alternative: ‘यदि वह सिय्योन को नष्ट करे’
  rationale: सिरियाई संयोजक का प्राथमिक बल कालवाचक है और सन्हेरीब की आत्मविश्वासी अपेक्षा को व्यक्त करता है; संभावित शर्तवाचक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: सन्हेरीब के ऊँचा किए जाने की वाच्यता
  choice: कर्मवाच्य—‘ऊँचा उठाया और महान किया जाएगा’
  alternative: कर्तृवाच्य—‘वह ऊँचा उठेगा और महान बनेगा’
  rationale: स्रोत के कर्मवाच्य रूप को बनाए रखा गया है, बिना यह स्पष्ट किए कि उसे कौन ऊँचा करेगा; इससे मूल की संभावित विडंबना और अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘नष्ट करने के लिए तैयार’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘ऊँचा उठाया और महान किया जाएगा’ मूल की समानांतर और कर्मवाच्य अभिव्यक्ति को बनाए रखता है।
