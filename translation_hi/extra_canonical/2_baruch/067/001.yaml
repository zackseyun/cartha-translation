translation:
  language: hi
  text: और जो ग्यारहवाँ काला जल तुमने देखा था—यह वही विपत्ति है जो अब सिय्योन पर आ पड़ी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  choice: काला जल
  rationale: दर्शन में बार-बार आने वाले काले और उजले जल के संरचनात्मक प्रतीक को स्पष्ट रखा गया है। हिन्दी में ‘जल’ सामूहिक अर्थ में स्वाभाविक है।
- source_word: ܫܘܚܬܐ
  choice: विपत्ति
  rationale: यह शब्द सिय्योन पर आई घोर दुर्दशा या आपदा को सूचित करता है; ‘विपत्ति’ प्रसंग की गंभीरता को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ܗܕܐ ܗܝ
  choice: यह वही … है
  rationale: एकवचन संकेतवाचक और योजक को बनाए रखते हुए दर्शन के प्रतीक और उसके अर्थ की पहचान स्पष्ट की गई है।
- source_word: ܨܗܝܘܢ
  choice: सिय्योन
  rationale: पारंपरिक स्थान-नाम को आधुनिक हिन्दी बाइबलीय प्रचलन के अनुरूप लिप्यंतरित किया गया है।
theological_decisions:
- issue: सिय्योन की विपत्ति का धर्मवैज्ञानिक अर्थ
  choice: पद केवल दर्शन के ग्यारहवें काले जल की पहचान सिय्योन पर आई वर्तमान विपत्ति से कराता है।
  alternative: इसे परमेश्वर की अंतिम अस्वीकृति या राष्ट्रों पर उसके स्थायी अनुग्रह की घोषणा मानना।
  rationale: इस एक पद में विपत्ति के अंतिम धर्मवैज्ञानिक कारण या परिणाम का निर्णय नहीं दिया गया है; इसलिए व्यापक अध्याय में बनी न्याय और सिय्योन की दुर्दशा की तनावपूर्ण स्थिति को अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आ पड़ी है’ वर्तमान में घट चुकी और अब भी प्रभावी विपत्ति का स्वाभाविक हिन्दी बोध देता है; डैश दर्शन और उसकी व्याख्या के बीच स्पष्ट संक्रमण बनाता है।
