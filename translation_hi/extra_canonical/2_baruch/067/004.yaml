lexical_decisions:
- source_word: ܕܝܢܐ / judgment (source wording recoverable only indirectly from the supplied chapter bucket)
  choice: निर्णय
  rationale: ‘निर्णय’ प्रश्नवाचक वाक्य में स्वाभाविक है और न्यायिक अर्थ बनाए रखता है; साथ लगा ‘न्यायपूर्ण’ धार्मिक-नैतिक उचितता व्यक्त करता है।
- source_word: ܙܕܝܩܐ / righteous
  choice: न्यायपूर्ण
  rationale: यहाँ गुण किसी व्यक्ति का नहीं, निर्णय का है; इसलिए ‘धर्मी’ की अपेक्षा ‘न्यायपूर्ण’ आधुनिक हिन्दी में अधिक स्वाभाविक और सटीक है।
- source_word: ܕܝܠܗ / his
  choice: उसका
  rationale: मूल पुरुषवाचक सर्वनाम का संदर्भ स्पष्ट किए बिना उसकी संभावित संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘उसका’ किसकी ओर संकेत करता है
  choice: सर्वनाम को ‘उसका’ ही रखा गया
  alternative: संदर्भ को ईश्वर या किसी नामित व्यक्ति के रूप में स्पष्ट करना
  rationale: उपलब्ध पद और परामर्श-पाठ संदर्भ को स्पष्ट रूप से निर्धारित नहीं करते; अतः व्याख्यात्मक पहचान नहीं जोड़ी गई।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। उपलब्ध सिरिएक सामग्री अध्याय-पृष्ठों का अव्यवस्थित/अतिव्यापी पाठ है और लक्षित पद का स्पष्ट पृथक्करण नहीं देती; इसलिए अंग्रेज़ी POB को परामर्श-साक्ष्य मानते हुए उसके प्रश्न, सर्वनाम और न्यायिक भाव को सावधानी से सुरक्षित रखा गया है।
