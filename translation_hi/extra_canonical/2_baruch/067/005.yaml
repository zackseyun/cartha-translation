lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: इन बातों के बाद
  rationale: यह वाक्यांश पूर्ववर्ती घटनाओं के बाद की स्थिति को स्पष्ट रूप से दर्शाता है।
- source_word: ܒܡ̈ܢܘܬܐ
  choice: जातियों के बीच तितर-बितर होकर
  rationale: संदर्भ में यह विभिन्न जातियों के बीच बिखराव या प्रवास की अवस्था बताता है; स्वाभाविक हिन्दी के लिए इसे क्रियात्मक रूप में रखा गया है।
- source_word: ܒܚܣܝܪܘ
  choice: लज्जा में
  rationale: यह अभाव, हीनता या अपमान की दशा का संकेत दे सकता है; प्रसंग में सामाजिक अपमान को व्यक्त करने वाला ‘लज्जा’ उपयुक्त है।
- source_word: ܒܟܠ ܐܬܪ
  choice: हर स्थान पर
  rationale: मूल के व्यापक स्थानवाचक भाव को सीधे और सहज हिन्दी में सुरक्षित रखता है।
