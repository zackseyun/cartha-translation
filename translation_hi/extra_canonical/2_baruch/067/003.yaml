translation:
  language: hi
  text: क्या तुम समझते हो कि परमप्रधान इन बातों से प्रसन्न होता है, या इनके कारण उसके नाम की महिमा होती है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: परमप्रधान
  rationale: इस प्रसंग में यह परमेश्वर के लिए प्रयुक्त उपाधि है; ‘परमप्रधान’ सामान्य पाठक के लिए स्वाभाविक और गरिमापूर्ण है तथा अंग्रेज़ी परामर्श-पाठ के अर्थ से मेल खाता है।
- source_word: ܫܡܗ / ܐܝܩܪܗ (पाठ-संदर्भ)
  choice: उसके नाम की महिमा
  rationale: ‘नाम’ व्यक्ति की प्रतिष्ठा और प्रकट सम्मान का प्रतिनिधित्व करता है; हिंदी में यह बाइबिलीय अभिव्यक्ति स्पष्ट रहती है।
- source_word: ܡܫܬܒܚܐ
  choice: महिमा होती है
  rationale: कर्मवाच्य अर्थ को बनाए रखते हुए आधुनिक हिंदी में सहज अभिव्यक्ति दी गई है।
theological_decisions:
- issue: क्या प्रश्न परमेश्वर की स्वीकृति और उसकी महिमा के बीच विकल्प प्रस्तुत करता है?
  choice: दोनों संभावनाओं को ‘या’ से जुड़े एक आलंकारिक प्रश्न के रूप में रखा गया है।
  alternative: इसे दो अलग-अलग प्रश्नों में बाँटना।
  rationale: स्रोत और परामर्श-पाठ की तर्कगत एकता तथा निहित नकारात्मक उत्तर दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और आलंकारिक प्रश्न का स्वर सुरक्षित।
