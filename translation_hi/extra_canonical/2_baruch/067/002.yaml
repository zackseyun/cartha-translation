base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/067/002.yaml
  text: Or do you think there is no grief, even for the angels before the Mighty One, because Zion was handed over in this way, and because, look, the nations boast in their hearts, and they gather before their idols and say, “She who long trampled others is trampled down; she who brought others into subjection has herself been subjected”?
translation:
  language: hi
  text: या क्या तुम सोचते हो कि पराक्रमी के सम्मुख स्वर्गदूतों को भी कोई शोक नहीं है, क्योंकि सिय्योन इस प्रकार सौंप दी गई, और क्योंकि, देखो, जातियाँ अपने मन में घमंड करती हैं और अपनी मूर्तियों के सामने इकट्ठी होकर कहती हैं, “जो बहुत समय तक दूसरों को रौंदती रही, वह स्वयं रौंदी गई है; जो दूसरों को अधीन करती थी, वह स्वयं अधीन कर दी गई है”[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या संभवतः: “और उनकी मूर्तियों के सामने भीड़ कहती है।”'
    reason: संबंधित सीरियाई रूप को सक्रिय क्रिया ‘वे इकट्ठी होती हैं’ या सामूहिक संज्ञा ‘भीड़’ के रूप में पढ़े जाने की सम्भावना दर्ज की गई है; मुख्य पाठ में सक्रिय क्रियात्मक क्रम को प्राथमिकता दी गई है।
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: पराक्रमी
  rationale: ईश्वर के लिए प्रयुक्त सीरियाई उपाधि का अर्थ ‘सामर्थी/पराक्रमी’ है; ‘पराक्रमी’ हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ܡܠܐܟ̈ܐ
  choice: स्वर्गदूतों
  rationale: यहाँ बहुवचन ‘दूतों/स्वर्गदूतों’ का संकेत है; प्रसंग में परमेश्वर के सम्मुख रहने वाले स्वर्गीय दूत अभिप्रेत हैं।
- source_word: ܡܫܬܒܗܪܝܢ
  choice: घमण्ड करती हैं
  rationale: स्रोत का आत्मश्लाघा या डींग मारने का भाव सुरक्षित रखा गया है।
- source_word: ܡܩ̈ܢܫܐ
  choice: इकट्ठी होकर
  rationale: पाठ को सक्रिय कृदन्त ‘वे इकट्ठी होती हैं’ के रूप में समझना समानांतर क्रियात्मक क्रम—घमण्ड करती हैं, इकट्ठी होती हैं, कहती हैं—के अनुकूल है।
- source_word: ܒܒܘܕ̈ܝܗܘܢ
  choice: अपनी मूर्तियों के सामने
  rationale: सन्दर्भ में राष्ट्रों की उपास्य मूर्तियाँ अभिप्रेत हैं; ‘मूर्तियों’ से अर्थ सामान्य पाठक के लिए स्पष्ट रहता है।
- source_word: ܐܫܬܠܡܘܬ
  choice: सौंप दी गई
  rationale: निष्क्रिय रूप में किसी के अधिकार में दे दिए जाने का भाव है; इससे विनाश से अधिक ‘हस्तांतरण/समर्पण’ की स्रोतगत छाया बनी रहती है।
theological_decisions:
- issue: क्या स्वर्गदूत सिय्योन के पतन पर दुःख अनुभव करते हैं?
  choice: 'प्रश्न को अलंकारिक किन्तु अनिर्णीत रूप में रखा गया: ‘क्या तुम समझते हो... कोई दुःख नहीं है?’'
  alternative: सीधे कहना कि स्वर्गदूत अवश्य दुःखी हैं।
  rationale: मूल पाठ प्रश्नात्मक तनाव रखता है; अनुवाद ने स्वर्गदूतों की भावनात्मक क्षमता पर कोई अतिरिक्त सिद्धान्त आरोपित नहीं किया।
- issue: ‘पराक्रमी’ की पहचान
  choice: ईश्वर-सूचक उपाधि के रूप में ‘पराक्रमी’ रखा गया।
  alternative: ‘सर्वशक्तिमान परमेश्वर’ कहना।
  rationale: विस्तृत रूप अर्थ को स्पष्ट करता, पर स्रोत की संक्षिप्त उपाधि में ‘सर्वशक्तिमान’ और ‘परमेश्वर’ जोड़ देता।
- issue: सिय्योन को अधीन किए जाने का कर्ता
  choice: 'निष्क्रिय वाक्य रखा: ‘सौंप दी गई’, ‘अधीन कर दी गई’।'
  alternative: परमेश्वर या जातियों को स्पष्ट कर्ता बनाना।
  rationale: स्रोत कर्ता को प्रत्यक्ष नहीं बताता; निष्क्रियता उस धर्मवैचारिक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सहज शैली। ‘सिय्योन’, ‘स्वर्गदूत’ और ‘पराक्रमी’ जैसे परिचित धार्मिक शब्द रखे गए हैं। राष्ट्रों के स्त्रीलिंग व्याकरणिक रूप के अनुरूप उद्धरण में ‘जो... करती थी/रही’ का प्रयोग हुआ है।
