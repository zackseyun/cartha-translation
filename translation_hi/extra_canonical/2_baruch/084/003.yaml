  text: जब तुम जंगल में बारह गोत्रों के रूप में एक साथ थे, तब वह तुमसे और भी बातें कहता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̇ܪ ܗܘܐ
  choice: कहा करता था
  rationale: सहायक क्रिया के साथ कृदंत अतीत में चलती या बार-बार होने वाली क्रिया को व्यक्त करता है; हिन्दी का ‘कहा करता था’ इस पक्ष को स्वाभाविक रूप से बनाए रखता है।
- source_word: ܐܦ
  choice: और भी
  rationale: यहाँ यह पहले कही गई बातों के अतिरिक्त अन्य बातों की ओर संकेत करता है।
- source_word: ܒܡܕܒܪܐ
  choice: जंगल में
  rationale: यह सामान्य बाइबलीय अर्थ ‘निर्जन प्रदेश/जंगल’ को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ܫ̈ܒ̣ܛܝܟܘܢ (contextual reading reflected in the clause)
  choice: बारहों गोत्र
  rationale: पांडुलिपि-पाठ और वाक्य-संदर्भ इस्राएल के बारह गोत्रों की सामूहिक स्थिति की ओर संकेत करते हैं; ‘बारहों’ समग्रता को स्वाभाविक हिन्दी में प्रकट करता है।
