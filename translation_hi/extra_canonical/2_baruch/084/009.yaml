translation:
  language: hi
  text: इस पत्र और व्यवस्था की परंपराओं को अपने बाद अपनी संतानों को सौंप देना, जैसे तुम्हारे पूर्वजों ने इन्हें तुम्हें सौंपा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ (nāmūsā)
  choice: व्यवस्था
  rationale: यह शब्द धार्मिक नियम/तोरा के अर्थ में आता है; ‘व्यवस्था’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: 'English consultation: “traditions” (the verse wording is not securely isolable in the supplied chapter-bucket Syriac OCR)'
  choice: परंपराओं
  rationale: यह सौंपे गए विधि-संबंधी शिक्षण और विरासत का भाव बनाए रखता है, बिना उसे केवल लिखित नियमों तक सीमित किए।
- source_word: 'English consultation: “hand on”'
  choice: सौंप देना
  rationale: पीढ़ी-दर-पीढ़ी आगे पहुँचाने का भाव स्पष्ट और सहज हिन्दी में व्यक्त होता है।
- source_word: 'English consultation: “fathers”'
  choice: पूर्वजों
  rationale: यहाँ आशय पिछली पीढ़ियों से है; ‘पूर्वज’ हिन्दी में प्राकृतिक है और इसे केवल जैविक पिताओं तक सीमित नहीं करता।
theological_decisions:
- issue: ‘व्यवस्था की परंपराएँ’ का स्वरूप
  choice: बहुवचन ‘परंपराओं’ को बनाए रखा गया
  alternative: ‘व्यवस्था की शिक्षा’ या ‘व्यवस्था का विधान’
  rationale: परामर्श-पाठ में लिखित पत्र के साथ अलग से चली आई परंपराओं का उल्लेख है; इसे एकवचन ‘शिक्षा’ करने से मूल का संभावित बहुवचन और परंपरा-संचरण का तनाव मिट जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘अपने बाद अपनी संतानों को’ पीढ़ीगत उत्तराधिकार को स्पष्ट करता है। उपलब्ध सिरिएक सामग्री पूरे अध्याय का अस्थायी पृष्ठ-समूह और कठिन OCR है; पद 9 की सटीक सिरिएक पंक्ति सुरक्षित रूप से अलग नहीं की जा सकी, इसलिए अंग्रेज़ी POB परामर्श-पाठ को अध्यायगत सिरिएक शब्दावली के नियंत्रण के साथ उपयोग किया गया है।
