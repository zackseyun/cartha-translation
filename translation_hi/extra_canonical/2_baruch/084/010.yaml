base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/010.yaml
  text: And at all times keep asking earnestly, and pray diligently with your whole heart, that the Mighty One may be reconciled to you and may not reckon the multitude of your sins, but remember the uprightness of your fathers.
translation:
  language: hi
  text: और हर समय लगन से माँगते रहो और अपने पूरे मन से प्रार्थना करो, ताकि पराक्रमी तुमसे मेल करे[a] और तुम्हारे पापों की बहुतायत का लेखा न रखे, बल्कि तुम्हारे पूर्वजों की सत्यनिष्ठा को स्मरण करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम पर दया करे।”
    reason: संबंधित सिरिएक अभिव्यक्ति को मेल-मिलाप अथवा दया दिखाने के अर्थ में समझा जा सकता है।
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: पराक्रमी
  rationale: यह ईश्वर के लिए प्रयुक्त उपाधि है; ‘पराक्रमी’ उसके संज्ञात्मक और श्रद्धापूर्ण स्वरूप को बनाए रखता है।
- source_word: ܡܢ ܟܠܗ ܢܦܫܟܘܢ
  choice: अपने पूरे मन से
  rationale: सेमिटिक अभिव्यक्ति में संपूर्ण आंतरिक समर्पण अभिप्रेत है; आधुनिक हिन्दी में ‘पूरे मन से’ स्वाभाविक और स्पष्ट है।
- source_word: ܣ̈ܓܝܐܐ
  choice: बहुतायत
  rationale: पापों की बड़ी संख्या/बहुलता का भाव बनाए रखने के लिए गरिमापूर्ण संज्ञा चुनी गई है।
- source_word: ܬܪܝܨܘܬܐ (sense reflected in the verse tradition)
  choice: खराई
  rationale: पूर्वजों की नैतिक सीधाई और सत्यनिष्ठा को व्यक्त करता है, बिना इसे अधिक विशिष्ट धर्मशास्त्रीय अर्थ देने के।
theological_decisions:
- issue: ईश्वर के अनुकूल होने की क्रिया का अर्थ
  choice: तुमसे मेल कर ले
  alternative: तुम पर दया करे
  rationale: पाठ-परंपरा में संबंध की पुनर्स्थापना अथवा अनुग्रहपूर्ण रुख का भाव संभव है। मुख्य पाठ में ‘मेल कर ले’ रखा गया है और दया वाला संभव अर्थ पादटिप्पणी में सुरक्षित है।
- issue: पूर्वजों की खराई के स्मरण का आशय
  choice: शाब्दिक तनाव को बनाए रखा गया
  alternative: पूर्वजों के पुण्य के कारण क्षमा करना
  rationale: पाठ केवल स्मरण की बात करता है; वह कारणात्मक या अर्जित-पुण्य संबंधी सिद्धांत स्पष्ट नहीं करता, इसलिए ऐसा अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘माँगते रहो’ और ‘प्रार्थना करो’ की समानांतरता तथा ‘पूरे मन से’ का समग्र समर्पण सुरक्षित है।
