  naturalness: ‘आग्रह के साथ माँगते रहो’ और ‘तत्पर होकर प्रार्थना करो’ अर्थगम्य हैं, पर आधुनिक हिन्दी में कुछ भारी और असमानांतर लगते हैं। ‘लगातार गिड़गिड़ाकर माँगते रहो’ अत्यधिक भावात्मक होगा, इसलिए ‘लगन से माँगते रहो’ तथा ‘पूरे मन से प्रार्थना करो’ स्वाभाविक, गरिमापूर्ण और संयमित हैं। ‘सत्यनिष्ठा’ ‘खराई’ की अपेक्षा अधिक सामान्य आधुनिक प्रयोग है।
  terminology: ‘पराक्रमी’ ܚܝܠܬܢܐ के लिए उपयुक्त श्रद्धापूर्ण उपाधि है। ‘पापों की बहुतायत’ स्रोत के बहुवचन/बहुलता के भाव को रखता है। पादटिप्पणी में ‘दया करे’ को वैकल्पिक अर्थ के रूप में रखना उचित है और मुख्य पाठ के ‘मेल करे’ को प्रतिस्थापित नहीं करना चाहिए।
