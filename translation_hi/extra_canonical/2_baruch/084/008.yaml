lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: यहाँ सीरियाई शब्द धार्मिक विधि/तोरा के अर्थ में है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ܨܗܝܘܢ (पाठ-साक्ष्य में अपेक्षित नाम)
  choice: सिय्योन
  rationale: स्थान और उसके धार्मिक-सामुदायिक अर्थ दोनों को खुला रखने के लिए पारंपरिक व्यक्तिनाम-रूप रखा गया है।
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: पवित्र भूमि
  rationale: मूल पदबंध का सीधा और सामान्य हिन्दी रूप।
- source_word: ܩܝܡܐ
  choice: वाचा
  rationale: पूर्वजों से सम्बद्ध धार्मिक covenant के लिए ‘वाचा’ उपयुक्त बाइबलीय शब्द है।
- source_word: ܥܕ̈ܥܕܐ
  choice: पर्वों
  rationale: नियत धार्मिक उत्सवों के अर्थ को स्पष्ट करता है।
- source_word: ܫ̈ܒܐ
  choice: सब्तों
  rationale: मूल के बहुवचन को बनाए रखते हुए साप्ताहिक पवित्र विश्राम-दिवसों का तकनीकी नाम सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘सिय्योन’ और ‘पवित्र भूमि’ का संबंध
  choice: दोनों को अलग-अलग स्मरण की वस्तुओं के रूप में रखा गया
  alternative: ‘सिय्योन की पवित्र भूमि’ जैसा संयुक्त पदबंध
  rationale: परामर्श-पाठ और संभावित सूची-संरचना दो समानांतर पदों का समर्थन करती है; उन्हें जोड़ना मूल की अवधारणात्मक भिन्नता को अनावश्यक रूप से मिटा देता।
- issue: पूर्वजों की वाचा
  choice: ‘अपने पूर्वजों की वाचा’
  alternative: ‘अपने पितरों की वाचा’
  rationale: ‘पूर्वज’ आधुनिक सामान्य हिन्दी में अधिक सहज है और वाचा की सामुदायिक विरासत को बिना किसी अतिरिक्त धर्मवैधानिक व्याख्या के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आदेशात्मक और गरिमापूर्ण शैली रखी गई है। सूची की समानांतर संरचना तथा ‘स्मरण रखो/मत भूलो’ का अलंकारिक संतुलन सुरक्षित है। उपलब्ध अध्याय-पृष्ठ का OCR अस्थिर और पद-सीमा अनुमानित है, इसलिए नियंत्रित अंग्रेज़ी परामर्श-पाठ को सीरियाई अध्याय-साक्ष्य के साथ मिलाकर पढ़ा गया है।
