base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/006.yaml
  text: 'So I also say to you after your suffering: if you listen to these words that have been spoken to you, you will receive from the Mighty One what has been kept ready and stored up for you.'
translation:
  language: hi
  text: 'इसी प्रकार, मैं भी तुमसे कहता हूँ: दुःख सह लेने के बाद, यदि तुम उन बातों को सुनोगे[a] जो तुमसे कही गई हैं, तो सामर्थी की ओर से तुम्हें वह मिलेगा जो तुम्हारे लिए तैयार और सुरक्षित रखा गया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “सुनने” में ध्यान देना और कही हुई बातों को मानना भी शामिल है।
    reason: मूल क्रिया की श्रवण और आज्ञापालन—दोनों अर्थच्छायाएँ सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ܫܡܥ
  choice: सुनोगे
  rationale: मूल सेमिटिक क्रिया का प्राथमिक अर्थ ‘सुनना’ है, पर संदर्भ में इसमें ध्यान देकर मानने का भाव भी शामिल है; मुख्य पाठ में मूल बिंब रखा गया है और पादटिप्पणी में निहित अर्थ स्पष्ट किया गया है।
- source_word: ܚܝܠܬܢܐ
  choice: सामर्थी
  rationale: यह उपाधि परमेश्वर को ‘शक्तिशाली/सामर्थी’ के रूप में संबोधित करती है। ‘सर्वशक्तिमान’ कहने से मूल की अपेक्षा अधिक निश्चित धर्मवैज्ञानिक अर्थ जुड़ सकता था।
- source_word: ܡܥܬܕ / ܢܛܪ (पाठ के आशय के अनुसार)
  choice: तैयार करके सुरक्षित रखा गया है
  rationale: दोनों पूरक विचार—पहले से तैयार होना और भविष्य के लिए संभालकर रखा जाना—स्वाभाविक हिन्दी में सुरक्षित रखे गए हैं।
- source_word: ܚܫ / ܣܒܠ (पाठ के आशय के अनुसार)
  choice: दुःख सह लेने के बाद
  rationale: वाक्य में पूर्व दुःख या क्लेश से गुजरने का भाव है; ‘दुःख सह लेने’ से कालगत और अनुभवगत दोनों पक्ष स्पष्ट होते हैं।
theological_decisions:
- issue: आज्ञाकारिता और प्रतिफल का संबंध
  choice: शर्तसूचक ‘यदि’ और भविष्यसूचक ‘तो’ को यथावत रखा गया है।
  alternative: वाक्य को बिना शर्त प्रतिज्ञा के रूप में प्रस्तुत करना।
  rationale: मूल कथन में सुनने/मानने और सामर्थी से सुरक्षित रखी वस्तु पाने के बीच वास्तविक शर्तात्मक तनाव है; इसे नरम या समाप्त नहीं किया गया।
- issue: परमेश्वर की उपाधि
  choice: ‘सामर्थी’
  alternative: ‘सर्वशक्तिमान’ या ‘परमेश्वर’
  rationale: मूल उपाधि की विशिष्टता बनाए रखते हुए किसी अधिक विकसित या संप्रदायगत पद को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सरल वाक्य-विन्यास रखा गया है। ‘सामर्थी’ कुछ असामान्य होते हुए भी मूल ईश्वरीय उपाधि को सटीकता से बचाता है; शेष भाषा साधारण पाठक के लिए सहज रखी गई है।
