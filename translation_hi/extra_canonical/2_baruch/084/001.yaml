base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/001.yaml
  text: Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.
translation:
  language: hi
  text: देखो, मैं अभी जीवित हूँ और मैंने ये बातें तुम्हें बता दी हैं, क्योंकि मैंने कहा था कि तुम सीखो कि क्या भला है। सामर्थी[a] ने मुझे तुम्हें सिखाने की आज्ञा दी है; और मरने से पहले मैं उसके न्याय के कुछ विधान तुम्हारे सामने रखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सामर्थी’ यहाँ परमेश्वर के लिए प्रयुक्त एक विशेष उपाधि है।
    reason: मूल सीरियाई की विशिष्ट दैवी उपाधि को स्पष्ट करना, बिना उसे सामान्य दैवी नाम से बदलने के।
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: सामर्थी
  rationale: यह परमेश्वर के लिए प्रयुक्त विशिष्ट सीरियाई उपाधि है। ‘सामर्थी’ उसके विशेषणात्मक स्वरूप को बनाए रखता है और इसे सामान्य नाम ‘परमेश्वर’ से नहीं बदलता।
- source_word: ܫܦܝܪ̈ܬܐ
  choice: भली बातें
  rationale: यह नैतिक रूप से अच्छी, उचित या श्रेष्ठ बातों को सूचित करता है। ‘भली बातें’ आधुनिक हिन्दी में सहज है और उपदेशात्मक संदर्भ के अनुकूल है।
- source_word: ܦܘܩ̈ܕܢܐ / ܦܘܩ̈ܕܢܘܗܝ
  choice: विधान
  rationale: यहाँ शब्द न्याय से जुड़ी दैवी आज्ञाओं या नियमों को दर्शाता है। ‘विधान’ कानूनी और वाचागत भाव को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: ܕܝܢܗ / judgment language
  choice: न्याय
  rationale: ‘न्याय’ दैवी निर्णय और न्यायिक व्यवस्था—दोनों संभावित अर्थों को खुला रखता है; इसे केवल दंड के अर्थ में सीमित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर की विशिष्ट उपाधि
  choice: ‘सामर्थी’ को उपाधि के रूप में बनाए रखा गया।
  alternative: ‘परमेश्वर’ या ‘प्रभु’
  rationale: सामान्य दैवी नाम रखने से मूल सीरियाई की विशिष्ट अलंकारिक और धर्मवैचारिक बनावट मिट जाती।
- issue: ‘उसके न्याय के विधान’ का संबंध
  choice: विधानों को उसके न्याय से संबंधित रखा गया है।
  alternative: ‘उसके कुछ न्यायादेश’
  rationale: मूल अभिव्यक्ति न्याय, निर्णय और उससे जुड़े नियमों के बीच कुछ अर्थगत खुलापन रखती है। चुना हुआ रूप इस तनाव को अनावश्यक रूप से किसी एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। वाक्य-संरचना मूल के क्रम को यथासंभव बनाए रखती है, पर हिन्दी में बोझिल शाब्दिकता से बचती है।
