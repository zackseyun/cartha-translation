translation:
  language: hi
  text: क्योंकि यदि वह अपनी अपार दया के अनुसार हमारा न्याय न करे, तो हम सब जो जन्मे हैं, उन पर हाय!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܟ
  choice: के अनुसार
  rationale: यह तुलना अथवा मानक सूचित करता है; यहाँ न्याय के मानक के अर्थ में ‘के अनुसार’ स्वाभाविक और सटीक है।
- source_word: ܣ̈ܓܝܐܐ
  choice: भरपूर
  rationale: बहुतायत के भाव को सरल, आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ܡܒ̈ܩܐ
  choice: दया
  rationale: संदर्भ में परमेश्वर की करुणामय दयाओं का भाव है; हिन्दी में सामूहिक आशय को स्वाभाविक एकवचन ‘दया’ से व्यक्त किया गया है।
- source_word: ܝܥܪ̈ܝܐ
  choice: जन्मे हुए
  rationale: समस्त जन्मे हुए मनुष्यों को समेटने वाली स्रोत की व्यापक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: न्याय और दया का संबंध
  choice: ‘अपनी भरपूर दया के अनुसार हमारा न्याय न करे’
  alternative: ‘अपनी भरपूर दया से अलग होकर हमारा न्याय करे’
  rationale: स्रोत का ܐܝܟ न्याय के मानक को व्यक्त करता है। अनुवाद इस तनाव को बनाए रखता है कि न्याय दया की बहुतायत के अनुसार हो सकता है, बिना इसे किसी विशिष्ट धर्मसैद्धांतिक प्रणाली में ढाले।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को गंभीर, प्रार्थनापूर्ण और चेतावनीपूर्ण स्वर में रखा गया है। ‘हम सब जन्मे हुओं पर हाय’ स्रोत की व्यापक और तीखी अभिव्यक्ति को जानबूझकर बनाए रखता है।
