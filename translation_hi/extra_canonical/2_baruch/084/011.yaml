  source_fidelity: 'The draft correctly renders the Syriac comparative/standard expression (''not according to'') and preserves the conditional force: unless judgment accords with the abundance of divine mercy, woe follows. ‘भरपूर दया’ conveys the intended abundance, though ‘अपार दया’ is more idiomatic in this solemn context.'
