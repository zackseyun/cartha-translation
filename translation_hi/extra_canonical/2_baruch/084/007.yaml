  yaml_path: translation/extra_canonical/2_baruch/084/007.yaml
  text: Let this letter also be a witness between me and you, so that you may remember the commandments of the Mighty One, and so that it may become a vindication for me before him who sent me.
translation:
  language: hi
  text: यह पत्र भी मेरे और तुम्हारे बीच साक्षी हो, ताकि तुम सामर्थी की आज्ञाओं को स्मरण रखो और जिसने मुझे भेजा है उसके सामने यह मेरे पक्ष में प्रमाण ठहरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܐܓܪܬܐ (प्रसंगानुसार पुनर्निर्मित: ‘पत्र’)'
  choice: पत्र
  rationale: पद के पत्र-संदर्भ को आधुनिक और सहज हिन्दी में स्पष्ट रखता है।
- source_word: 'ܣܗܕܐ / ܣܗܕܘܬܐ (प्रसंगानुसार: ‘गवाह/गवाही’)'
  choice: गवाह
  rationale: ‘मेरे और तुम्हारे बीच’ के साथ न्यायिक और स्मारक—दोनों भाव स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: ܚܝܠܬܢܐ (‘सामर्थी’)
  choice: सामर्थी
  rationale: ईश्वर के लिए प्रयुक्त उपाधि को बिना अतिरिक्त व्याख्यात्मक संज्ञा जोड़े सुरक्षित रखता है।
- source_word: ܦܘܩ̈ܕܢܐ (‘आज्ञाएँ’)
  choice: आज्ञाओं
  rationale: वाचा और व्यवस्था के संदर्भ में प्रचलित, स्पष्ट हिन्दी शब्द।
- source_word: ܙܕܝܩܘܬܐ / न्यायिक प्रमाण का भाव (प्रसंगानुसार)
  choice: मेरे पक्ष में प्रमाण
  rationale: आत्मिक नैतिक गुण की अपेक्षा प्रेषक के सामने बारूक के समर्थन या निर्दोषता के न्यायिक भाव को व्यक्त करता है, पर अंतिम निर्णय को पूर्वनिर्धारित नहीं करता।
theological_decisions:
- issue: ‘vindication’ का न्यायिक-धर्मवैज्ञानिक अर्थ
  choice: मेरे पक्ष में प्रमाण ठहरे
  alternative: मुझे धर्मी ठहराए
  rationale: ‘मुझे धर्मी ठहराए’ से पत्र स्वयं धर्मी ठहराने वाला साधन प्रतीत हो सकता है। ‘मेरे पक्ष में प्रमाण’ गवाही और भावी न्याय के संबंध को बनाए रखता है।
- issue: ‘Mighty One’ में ‘परमेश्वर’ जोड़ना
  choice: सामर्थी
  alternative: सामर्थी परमेश्वर
  rationale: मूल उपाधि को उसी रूप में रखकर अनावश्यक स्पष्टता नहीं जोड़ी गई; संदर्भ में इसका ईश्वरीय संकेत बना रहता है।
- issue: ‘जिसने मुझे भेजा’ की पहचान
  choice: जिस व्यक्ति ने मुझे भेजा है
  alternative: परमेश्वर, जिसने मुझे भेजा है
  rationale: मूल की संकेतात्मक अभिव्यक्ति को सुरक्षित रखा गया और भेजने वाले की पहचान अनुवाद में निर्णायक रूप से नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, सार्वजनिक-पाठ योग्य और सामान्य पाठक के लिए सहज। ‘गवाह रहे’ और ‘प्रमाण ठहरे’ से पद की न्यायिक भाषा बनी रहती है, जबकि वाक्यरचना अत्यधिक संस्कृतनिष्ठ नहीं होती।
