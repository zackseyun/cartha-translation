- source_word: ܡܘܫܐ
  choice: मूसा
  rationale: सीरियाई पाठ में मूसा का प्रचलित बाइबलीय नाम।
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: यहाँ ईश्वरीय विधान/तोरा के अर्थ में प्रयुक्त शब्द के लिए स्वाभाविक और प्रतिष्ठित हिन्दी पद।
- source_word: (transgression expression; source text is textually noisy in the supplied page corpus)
  choice: उल्लंघन करना
  rationale: व्यवस्था की सीमा या आज्ञा का अतिक्रमण व्यक्त करता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: (scattering expression)
  choice: तितर-बितर कर दिए जाना
  rationale: निर्वासन और लोगों के बिखराव का सामूहिक भाव बनाए रखता है।
- source_word: (keeping/preserving expression)
  choice: सुरक्षित रखा जाना
  rationale: वाक्य में व्यवस्था के पालन और स्वयं समुदाय के संरक्षण के बीच का शब्दालंकार स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: व्यवस्था के पालन और समुदाय के सुरक्षित रखे जाने का संबंध
  choice: शर्तात्मक कथन को ज्यों का त्यों रखा गया है
  alternative: इसे अनुग्रह या कर्म-सिद्धांत की किसी विशिष्ट व्याख्या के अनुसार स्पष्ट करना
  rationale: पाठ की चेतावनी और प्रतिज्ञा के तनाव को बिना किसी साम्प्रदायिक निष्कर्ष के सुरक्षित रखना उचित है।
- issue: स्वर्ग और पृथ्वी की साक्षी की भूमिका
  choice: “तुम्हारे विरुद्ध साक्षी”
  alternative: “तुम्हारे लिए साक्षी”
  rationale: वाचा-भंग की चेतावनी के न्यायिक संदर्भ और अंग्रेज़ी परामर्श-पाठ के अनुरूप विरोधी साक्ष्य का भाव रखा गया है।
