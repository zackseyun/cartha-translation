base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/002.yaml
  text: Remember how Moses once called heaven and earth as witnesses against you and said, “If you transgress the law, you will be scattered; but if you keep it, you will be kept.”
translation:
  language: hi
  text: याद करो कि मूसा ने पहले स्वर्ग और पृथ्वी को तुम्हारे विरुद्ध साक्षी ठहराकर कहा था, “यदि तुम व्यवस्था का उल्लंघन[a] करोगे, तो तितर-बितर कर दिए जाओगे; पर यदि उसका पालन करोगे, तो सुरक्षित रखे जाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था को तोड़ोगे।”
    reason: मूल भाव को हिन्दी में ‘उल्लंघन करना’ या अधिक सामान्य ‘तोड़ना’—दोनों प्रकार से व्यक्त किया जा सकता है।
