translation:
  language: hi
  text: परन्तु उसकी मृत्यु के बाद तुमने उन्हें अपने से दूर कर दिया; और इसी कारण जो पहले से कहा गया था, वह तुम पर आ पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܡܘܬܗ
  choice: उसकी मृत्यु के बाद
  rationale: स्रोत के काल-संबंधी वाक्यांश को सीधा और स्वाभाविक हिन्दी रूप दिया गया है; संदर्भ में सर्वनाम का संकेत यहोशू की ओर है।
- source_word: ܡܢܟܘܢ
  choice: अपने से दूर
  rationale: अलगाव अथवा त्याग का भाव स्पष्ट करने के लिए हिन्दी का सहज प्रयोग चुना गया है।
- source_word: ܐܡܝܢ
  choice: पहले से कहा गया था
  rationale: संदर्भ में मूसा द्वारा पहले कही गई चेतावनी के पूरा होने का भाव है; इसलिए इसे भविष्यवाणी की तकनीकी शब्दावली से अनावश्यक रूप से नहीं बाँधा गया।
theological_decisions:
- issue: ‘उन्हें’ के पूर्वपद की पहचान
  choice: बहुवचन सर्वनाम ‘उन्हें’ को यथावत रखा गया
  alternative: इसे स्पष्ट करके ‘व्यवस्था की आज्ञाओं’ या ‘उन बातों’ कहना
  rationale: उपलब्ध स्रोत-पाठ में पूर्वपद अस्पष्ट है; किसी विशेष धार्मिक व्याख्या को पाठ में जोड़ने के बजाय मूल की अस्पष्टता सुरक्षित रखी गई है।
- issue: पहले कही गई बात का स्वरूप
  choice: ‘जो पहले से कहा गया था’
  alternative: ‘जो भविष्यवाणी की गई थी’
  rationale: यह रूप मूसा की पूर्व चेतावनी और उसके घटित होने के संबंध को बनाए रखता है, पर मूल से अधिक तकनीकी भविष्यवाणी-संबंधी दावा नहीं करता।
