translation:
  language: hi
  text: और अब, मूसा तुमसे पहले ही कहता था कि यह तुम पर न घटे; पर देखो, यह तुम पर घटित हो चुका है, क्योंकि तुमने व्यवस्था को त्याग दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܘܫܐ
  choice: मूसा
  rationale: व्यक्ति-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: ܡܢ ܩܕܝܡ
  choice: पहले
  rationale: यह पद समयगत पूर्वता व्यक्त करता है; प्रसंग में मूसा की पहले से दी गई चेतावनी अभिप्रेत है।
- source_word: ܢܓܕܫܟܘܢ
  choice: तुम पर घटित होने
  rationale: मूल क्रिया का अर्थ किसी घटना का किसी पर आ पड़ना या घटित होना है; ‘घटित होना’ हिन्दी में अर्थ को स्पष्ट और संयत रखता है।
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: यहाँ शब्द मूसा की व्यवस्था/धर्मशास्त्रीय विधान के लिए प्रयुक्त है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
theological_decisions:
- issue: व्यवस्था त्यागने और विपत्ति घटित होने का संबंध
  choice: “क्योंकि तुमने व्यवस्था को त्याग दिया” द्वारा कारण-संबंध बनाए रखा गया।
  alternative: इसे केवल समयगत क्रम मानकर कारण-सूचक ‘क्योंकि’ हटाया जा सकता था।
  rationale: उपलब्ध पाठ-साक्ष्य और परीक्षित अंग्रेज़ी परत कारण-संबंध प्रस्तुत करते हैं; अनुवाद उसे बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। ‘कहा करता था’ से मूल की पुनरावृत्त/अपूर्ण भूतकालीन अभिव्यक्ति और ‘देखो’ से प्रत्यक्ष आग्रह सुरक्षित रखा गया है।
