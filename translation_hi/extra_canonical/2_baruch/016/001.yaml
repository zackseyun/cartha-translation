base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/016/001.yaml
  text: And I answered and said, "O Lord, my Lord, the years of this age are few and evil, and who can acquire, in so little time, that which is immeasurable?"
translation:
  language: hi
  text: और मैंने उत्तर दिया, “हे प्रभु, मेरे प्रभु, इस युग[a] के वर्ष थोड़े और बुरे हैं। इतने कम समय में कौन उस वस्तु को प्राप्त कर सकता है जो माप से परे है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “इस समय के।”'
    reason: ܙܒܘ̈ܢܝ वर्तमान युग अथवा वर्तमान समय—दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: ܫ̈ܢܝܗܝ
  choice: वर्ष
  rationale: मूल शब्द समय की ठोस अवधि को वर्षों में व्यक्त करता है; इसलिए ‘वर्ष’ को बनाए रखा गया है।
- source_word: ܙܒܘ̈ܢܝ
  choice: इस युग
  rationale: यह पद केवल किसी क्षण का नहीं, वर्तमान नश्वर व्यवस्था का भी संकेत दे सकता है; प्रकाशनात्मक संदर्भ में ‘इस युग’ स्वाभाविक है, जबकि ‘इस समय’ भी संभव है।
- source_word: ܡܫܟܚ
  choice: प्राप्त कर सकता है
  rationale: क्रिया सामर्थ्य और उपलब्धि—दोनों को व्यक्त करती है; प्रश्न मनुष्य की छोटी आयु में लक्ष्य तक पहुँचने की क्षमता के विषय में है।
- source_word: ܡܟܝܠܐ
  choice: इतने थोड़े समय में
  rationale: यहाँ अल्प माप या छोटी निर्धारित अवधि का भाव है, जिसे सहज हिन्दी में समय की संक्षिप्तता के रूप में व्यक्त किया गया है।
- source_word: ܡܫܘܚܬܐ
  choice: जो माप से परे है
  rationale: यह अभिव्यक्ति छोटी मानवीय अवधि और अपरिमेय लक्ष्य के बीच मूल विरोध को सुरक्षित रखती है।
theological_decisions:
- issue: क्या बारूक का प्रश्न परमेश्वर के न्याय को चुनौती देता है, या छोटी मानवीय आयु में अपरिमेय लक्ष्य पाने की कठिनाई पर विलाप करता है?
  choice: इसे मानवीय जीवन की संक्षिप्तता और माप से परे लक्ष्य के बीच तनाव पर विलाप के रूप में रखा गया है।
  alternative: इसे परमेश्वर की अपेक्षा की निष्पक्षता पर सीधी आपत्ति के रूप में पढ़ा जा सकता है।
  rationale: पद का प्रश्नात्मक तनाव सुरक्षित रखा गया है, पर अनुवाद उसमें ऐसा संदेह नहीं जोड़ता जो मूल में स्पष्ट नहीं है; निकटवर्ती संदर्भ जीवन की लंबाई के बजाय आचरण और आज्ञाकारिता पर बल देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘हे प्रभु, मेरे प्रभु’ मूल संबोधन की पुनरुक्ति को बनाए रखता है; ‘माप से परे’ अपरिमेयता को बिना दार्शनिक विस्तार के व्यक्त करता है।
