  - severity: low
    issue: “दुःखमय” narrows the sense of the adjective
    rationale: The source/audit gives “evil”; “दुःखमय” foregrounds suffering rather than the broader negative or morally adverse quality. “बुरे” preserves the wording more directly without overinterpreting it.
