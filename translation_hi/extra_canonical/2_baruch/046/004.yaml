  text: 'And I said to them,

    "I cannot stand against the will of the Mighty One.

    Yet Israel will not lack a wise man,

    nor the seed of Jacob a son of the law.'
translation:
  language: hi
  text: और मैंने उनसे कहा, “मैं सामर्थी के विरुद्ध खड़ा नहीं हो सकता। फिर भी इस्राएल को किसी बुद्धिमान पुरुष की कमी न होगी, और न याकूब के वंश को व्यवस्था के किसी पुत्र[a] की।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “व्यवस्था का पुत्र।” यह एक सेमिटिक रूपक है, जो व्यवस्था से संबद्ध या उसमें शिक्षित व्यक्ति को सूचित करता है।
    reason: मुख्य पाठ में स्रोत का रूपक सुरक्षित रखा गया है; टिप्पणी सामान्य आशय स्पष्ट करती है, बिना इसे किसी निश्चित पद या भूमिका के रूप में निर्धारित किए।
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: सामर्थी
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि है, जिसका मूल भाव ‘शक्तिशाली/पराक्रमी जन’ है। ‘सामर्थी’ उस उपाधि को संक्षिप्त और गरिमापूर्ण रूप में बनाए रखता है।
- source_word: ܚܟܝܡܐ (ḥakkīmā)
  choice: बुद्धिमान पुरुष
  rationale: मूल शब्द किसी बुद्धिमान व्यक्ति को सूचित करता है; संदर्भ में एक भावी पुरुष अगुवे की बात होने के कारण यह रूप स्वाभाविक है।
- source_word: ܒܪ ܢܡܘܣܐ (bar nāmūsā)
  choice: व्यवस्था का पुत्र
  rationale: शाब्दिक सेमिटिक रूपक को सुरक्षित रखा गया है; इसका आशय व्यवस्था से गहरे रूप से जुड़ा और उसके अनुसार शिक्षित व्यक्ति है।
- source_word: ܓܢܣܗ ܕܝܥܩܘܒ (gensēh d-Yaʿqūb)
  choice: याकूब के वंश में
  rationale: ‘याकूब की जाति/वंश’ का स्वाभाविक आधुनिक हिन्दी रूप, समानांतर वाक्य-विन्यास को भी बनाए रखता है।
theological_decisions:
- issue: सामर्थी की इच्छा और मानवीय प्रतिरोध
  choice: “मैं सामर्थी की इच्छा के विरुद्ध खड़ा नहीं हो सकता”
  alternative: “मैं सामर्थी का सामना नहीं कर सकता”
  rationale: अंग्रेज़ी परामर्श-पाठ और वाक्य के प्रसंग के अनुसार यहाँ दैवी इच्छा के प्रतिरोध की असमर्थता व्यक्त होती है; अनावश्यक रूप से दार्शनिक या संप्रदायगत अर्थ नहीं जोड़ा गया।
- issue: ‘व्यवस्था का पुत्र’ की पहचान
  choice: रूपक को मुख्य पाठ में यथावत रखा
  alternative: “व्यवस्था का ज्ञाता” या “व्यवस्था का शिक्षक”
  rationale: मूल अभिव्यक्ति किसी विशिष्ट पद या भूमिका को स्पष्ट रूप से निर्धारित नहीं करती। इसलिए संभावित अर्थ को व्याख्यात्मक अनुवाद द्वारा सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए बोधगम्य शैली। ‘सामर्थी’ और ‘व्यवस्था का पुत्र’ जैसे मूल के विशिष्ट धार्मिक रूपों को सुरक्षित रखा गया है।
