translation:
  language: hi
  text: क्योंकि हम व्यवस्था को फिर कहाँ खोजेंगे, या कौन हमें मृत्यु के घर से जीवन की ओर ले चलेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: यहाँ यूनानी मूल से आए सीरियाई शब्द का आशय धार्मिक ‘व्यवस्था’ अथवा ‘कानून’ है; प्रसंग में ‘व्यवस्था’ स्वाभाविक और परंपरागत रूप से स्पष्ट है।
- source_word: ܡܕܪܟܢ
  choice: भेद करेगा
  rationale: पांडुलिपि-पाठ/प्रतिलिप्यांकन इस स्थान पर कठिन है, पर पद के प्राचीन अनुवाद-साक्ष्य और समानांतर अर्थ के अनुसार मृत्यु और जीवन के बीच अंतर बताने या पहचान कराने का भाव है।
- source_word: ܒܝܬ ܡܘܬܐ ܠܚܝ̈ܐ
  choice: मृत्यु और जीवन के बीच
  rationale: यहाँ ܒܝܬ को ‘घर’ न मानकर ‘बीच’ के अर्थ वाले पाठ के रूप में समझना प्रसंग और प्राचीन पाठ-परंपरा से अधिक संगत है।
theological_decisions:
- issue: व्यवस्था के अभाव में मार्गदर्शन
  choice: प्रश्न को खुला और शोकपूर्ण रखा गया है
  alternative: किसी विशिष्ट भावी शिक्षक, नबी या संस्थागत अधिकारी की ओर संकेत जोड़ना
  rationale: मूल पद किसी उत्तरदाता की पहचान नहीं करता; इसलिए किसी संप्रदायगत निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और प्रश्नात्मक शैली। ‘पूछताछ करेंगे’ मूल के व्यवस्था के विषय में फिर खोजने/जानकारी लेने के भाव को रखता है; दूसरा खंड मृत्यु और जीवन के बीच विवेक कराने की समानांतर धारणा व्यक्त करता है।
