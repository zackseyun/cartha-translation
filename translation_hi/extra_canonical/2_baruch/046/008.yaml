translation:
  language: hi
  text: पर मेरे उठा लिए जाने की बात मैंने न तो उन्हें बताई, न अपने बेटे को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: बात
  rationale: यहाँ इसका अर्थ किसी कथन या विषय से है; आधुनिक हिन्दी में ‘बात’ स्वाभाविक और स्पष्ट है।
- source_word: ܕܡܬܬܣܝܡ ܐܢܐ
  choice: मेरे उठा लिए जाने
  rationale: यह निष्क्रिय अभिव्यक्ति बारूक के आगामी उठा लिए जाने को सूचित करती है। ‘उठा लिए जाने’ से मूल की निष्क्रियता और घटना की कुछ हद तक खुली प्रकृति बनी रहती है।
- source_word: ܠܐ … ܐܦ ܠܐ
  choice: न तो … न
  rationale: मूल के दोहरे निषेध को सहज हिन्दी समांतर रचना में व्यक्त करता है।
- source_word: ܠܒܪܝ
  choice: अपने बेटे को
  rationale: पद की प्रमाणित समझ और निकटवर्ती अंग्रेज़ी परामर्श-पाठ में एकवचन ‘my son’ है; हिन्दी में संबंध स्पष्ट करने के लिए ‘अपने’ जोड़ा गया है।
theological_decisions:
- issue: ‘उठा लिए जाने’ का आशय
  choice: मेरे उठा लिए जाने
  alternative: मेरी मृत्यु / मेरे स्वर्गारोहण
  rationale: मूल घटना को अधिक स्पष्ट रूप से मृत्यु या स्वर्गारोहण नहीं कहता। इसलिए किसी विशेष पारलौकिक व्याख्या को आरोपित किए बिना उसकी अस्पष्टता सुरक्षित रखी गई है।
- issue: कथन का काल
  choice: मैंने … बताई
  alternative: मैं … नहीं बताऊँगा
  rationale: प्रसंग और परामर्श-पाठ इसे बारूक द्वारा अब तक गुप्त रखी गई बात के रूप में लेते हैं; इसलिए पूर्ण भूतकाल चुना गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य संक्षिप्त रखा गया है और मूल के विरोधसूचक ‘पर’ तथा दोहरे निषेध को सुरक्षित रखा गया है।
