translation:
  language: hi
  text: क्योंकि यदि तुम ये बातें करोगे, तो आशा तुम पर ठहरेगी—वे बातें जो पहले तुमसे कही गई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܥܒܪܘܢ ܗܠܝܢ
  choice: ये काम करोगे
  rationale: संदर्भ में यह पहले दिए गए निर्देशों का पालन करने को दर्शाता है; हिन्दी में स्वाभाविक क्रियात्मक रूप रखा गया है।
- source_word: ܢܬܬܢܝܚ ܠܟܘܢ ܣܒܪܐ
  choice: वह आशा तुम्हें विश्राम देगी
  rationale: ܣܒܪܐ को ‘आशा’ और विश्राम-संबंधी क्रिया को सक्रिय, सहज हिन्दी में व्यक्त किया गया है; आशा को मिलने या टिकने के रूप में सपाट करने के बजाय मूल बिंब बचाया गया है।
- source_word: ܗܠܝܢ ܕܩܕܡܘ ܐܡܪܘ ܠܟܘܢ
  choice: वही, जिसके विषय में तुमसे पहले कहा गया था
  rationale: स्रोत का वचन-सामंजस्य कुछ असमतल है; इसे आशा से जोड़ते हुए अनिश्चित कर्ता वाले ‘कहा गया था’ से मूल की अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: आज्ञापालन और आशा का संबंध
  choice: ‘यदि’ वाली शर्त को स्पष्ट रखा गया
  alternative: आशा को बिना शर्त प्रतिज्ञा के रूप में प्रस्तुत करना
  rationale: पद का शर्तात्मक ढाँचा नैतिक प्रत्युत्तर और आशा के बीच तनाव बनाए रखता है; इसमें कोई अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। ‘विश्राम देगी’ मूल के विश्राम-बिंब को बनाए रखता है।
