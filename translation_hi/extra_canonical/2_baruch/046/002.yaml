translation:
  language: hi
  text: 'सचमुच, हम अंधकार में होंगे,

    और जो लोग बचे रह गए हैं, उनके लिए कोई प्रकाश न होगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܪܐܝܬ
  choice: सचमुच
  rationale: यह क्रियाविशेषण कथन की निश्चितता और गंभीरता पर बल देता है।
- source_word: ܚܫܘܟܐ
  choice: अंधकार
  rationale: मूल रूपक को सीधे और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: ܢܘܗܪܐ
  choice: प्रकाश
  rationale: ‘अंधकार’ के साथ मूल पाठ का स्पष्ट विरोध सुरक्षित रहता है।
- source_word: ܥܡܐ ܕܐܫܬܚܪܘ
  choice: जो लोग बचे रह गए हैं
  rationale: ܐܫܬܚܪܘ का आशय विपत्ति के बाद शेष रह जाने वालों से है; हिंदी में बहुवचन संबंधवाचक वाक्यांश स्वाभाविक है।
theological_decisions:
- issue: अंधकार और प्रकाश का रूपक
  choice: रूपक को बिना व्याख्या जोड़े यथावत रखा गया
  alternative: इसे निराशा और मार्गदर्शन के अभाव के रूप में स्पष्ट करना
  rationale: मूल पाठ इस बिंब का अर्थ स्वयं नहीं खोलता; अनुवाद में उसकी काव्यात्मक और धर्मवैचारिक व्यापकता सुरक्षित रहनी चाहिए।
- issue: काल का प्रयोग
  choice: ‘होंगे’ और ‘न होगा’
  alternative: ‘हैं’ और ‘नहीं है’
  rationale: प्राप्त अंग्रेज़ी परामर्श-पाठ और प्रसंग में वक्ताओं की आगामी दशा के कथन को ध्यान में रखते हुए भविष्यकाल चुना गया, यद्यपि सिरिएक रूप का पाठ-साक्ष्य यहाँ कुछ अस्थिर दिखाई देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गंभीर और काव्यात्मक शैली रखी गई है। दोनों पंक्तियों की समानांतर संरचना मूल के अंधकार–प्रकाश विरोध को उभारती है।
