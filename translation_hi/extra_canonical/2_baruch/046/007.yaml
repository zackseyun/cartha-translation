translation:
  language: hi
  text: और तुम उस यातना में नहीं पड़ोगे, जिसके विषय में तुम्हें पहले ही बताया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܝܒܘܬܐ
  choice: यातना
  rationale: इस प्रसंग में यह शब्द दंडजन्य पीड़ा या क्लेश को सूचित करता है; ‘यातना’ अंग्रेज़ी परामर्श-पाठ के ‘torment’ से भी मेल खाता है और वाक्य को स्वाभाविक रखता है।
- source_word: ܕܩܕܡܘ ܐܡܪܘܗ ܠܟܘܢ
  choice: जिसके विषय में तुम्हें पहले ही बताया गया था
  rationale: सीरियाई अभिव्यक्ति का भाव है कि इस यातना की पूर्वसूचना दी जा चुकी थी। कर्मवाच्य हिंदी में स्वाभाविक है और मूल में अनिर्दिष्ट वक्ताओं को अनावश्यक रूप से नहीं पहचानता।
- source_word: ܘܠܐ ܢܦܠ... ܐܢܬܘܢ
  choice: और तुम ... नहीं पड़ोगे
  rationale: नकारात्मक भविष्यसूचक कथन और बहुवचन संबोधन को सीधे तथा स्पष्ट रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: पूर्वकथित यातना का स्वरूप
  choice: यातना को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: इसे अंतिम न्याय, नरक या किसी विशेष ऐतिहासिक दंड के रूप में स्पष्ट करना
  rationale: इस पद में यातना की सटीक पहचान नहीं दी गई है; किसी विशिष्ट धर्मवैज्ञानिक अर्थ को जोड़ना मूल की खुली हुई अर्थ-सीमा को अनुचित रूप से संकुचित करता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल का बहुवचन ‘तुम’ रखा गया है और अनिर्दिष्ट कर्ता को कर्मवाच्य द्वारा सुरक्षित किया गया है।
