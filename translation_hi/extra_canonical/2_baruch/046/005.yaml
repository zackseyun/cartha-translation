translation:
  language: hi
  text: पर अपने हृदयों को तैयार करो, ताकि तुम व्यवस्था को सुनो और समझ को दृढ़ता से थामे रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܒܩ̈ܝܟܘܢ
  choice: अपने हृदयों को
  rationale: स्रोत में ‘हृदय’ आंतरिक इच्छा, विचार और संकल्प का केंद्र है; हिन्दी में मूल बिंब बनाए रखा गया है।
- source_word: ܕܬܫܡܥܘܢ
  choice: बात मानो
  rationale: सामी प्रयोग में ‘सुनना’ यहाँ केवल ध्वनि ग्रहण करना नहीं, बल्कि आज्ञापालन करना भी दर्शाता है; ‘बात मानो’ आधुनिक हिन्दी में दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ܢܡܘܣܐ
  choice: व्यवस्था
  rationale: यह परमेश्वर की दी हुई धार्मिक-नैतिक व्यवस्था के अर्थ में प्रयुक्त है; ‘व्यवस्था’ हिन्दी बाइबिलीय भाषा में प्रचलित और संप्रदाय-निरपेक्ष है।
- source_word: understanding (consultation layer; corresponding Syriac wording is unclear in the supplied OCR)
  choice: समझ
  rationale: अंग्रेज़ी परामर्श-पाठ के अर्थ को संक्षेप और स्वाभाविक हिन्दी में रखा गया है; उपलब्ध सिरिएक प्रतिलिपि इस अंश पर अस्पष्ट/विकृत दिखाई देती है।
theological_decisions:
- issue: व्यवस्था को ‘सुनने’ और उसका ‘पालन करने’ के बीच अर्थ-संबंध
  choice: व्यवस्था की बात मानो
  alternative: व्यवस्था को सुनो
  rationale: ‘बात मानो’ स्रोत के आज्ञापालन-सूचक अर्थ को व्यक्त करता है, बिना ‘सुनने’ की सामी अवधारणा को केवल श्रवण तक सीमित किए।
- issue: ‘हृदय’ को मन या अंतःकरण के रूप में स्पष्ट करना
  choice: हृदय का मूल बिंब बनाए रखा
  alternative: अपने मनों को तैयार करो
  rationale: ‘हृदय’ स्रोत की व्यापक मानवीय अंतःस्थिति को खुला रखता है और किसी संकीर्ण मनोवैज्ञानिक या धर्मवैज्ञानिक व्याख्या को नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। बहुवचन संबोधन बनाए रखा गया है।
