  text: 'And my son and the elders of the people answered and said to me,


    "Has the Mighty One humbled us so greatly as to take you from us so suddenly?'
translation:
  language: hi
  text: '1 तब मेरे बेटे और लोगों के बुज़ुर्गों ने मुझसे कहा,


    “क्या सामर्थी ने हमें इतना नीचा कर दिया है कि वह आपको हमसे इतनी अचानक ले जाए?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܝ
  choice: मेरे बेटे
  rationale: सिरियाई का सीधा संबंधसूचक अर्थ; वक्ता के अपने पुत्र को दर्शाता है।
- source_word: ܣܒ̈ܘܗܝ ܕܥܡܐ
  choice: लोगों के पुरनियों
  rationale: समुदाय के मान्य वृद्ध अगुओं के लिए स्वाभाविक और बाइबिलीय हिन्दी अभिव्यक्ति।
- source_word: ܚܝܠܬܢܐ
  choice: सामर्थी
  rationale: ईश्वर के लिए प्रयुक्त सिरियाई उपाधि का संक्षिप्त, गरिमापूर्ण रूप; अंग्रेज़ी परामर्श-पाठ के ‘Mighty One’ के अनुरूप भी है।
- source_word: ܡܟܟܢ
  choice: दीन कर दिया
  rationale: मूल में नम्र/नीचा किए जाने का भाव है; यहाँ सामुदायिक विपत्ति और अपमान का आशय सुरक्षित रहता है।
- source_word: ܫܠܝ
  choice: अचानक
  rationale: संदर्भ में बारूक को शीघ्र या अकस्मात उनसे ले लिए जाने की आशंका व्यक्त होती है; हिन्दी में ‘अचानक’ प्रश्न की भावात्मक तीव्रता को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: ܚܝܠܬܢܐ को ईश्वर की उपाधि के रूप में प्रस्तुत करना
  choice: सामर्थी
  alternative: सर्वशक्तिमान
  rationale: ‘सर्वशक्तिमान’ मूल से अधिक व्यवस्थित धर्मवैज्ञानिक अर्थ जोड़ सकता है; ‘सामर्थी’ स्रोत की विशिष्ट उपाधि और उसकी अपेक्षाकृत खुली अर्थ-सीमा को सुरक्षित रखता है।
- issue: दीन किए जाने की कर्तृवाच्यता
  choice: क्या सामर्थी ने हमें ... दीन कर दिया है
  alternative: क्या हम सामर्थी द्वारा इतने दीन किए गए हैं
  rationale: सक्रिय वाक्य सामान्य हिन्दी में अधिक स्पष्ट है और प्रश्न में ईश्वर की क्रिया संबंधी मूल तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथन। ‘पुरनियों’ और ‘सामर्थी’ से बाइबिलीय रंग बनाए रखा गया है, पर वाक्य-विन्यास बोलचाल के निकट और स्पष्ट है।
