base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: hi
  text: 'यहाँ यूहन्ना के अनुसार सुसमाचार की भूमिका आरम्भ होती है।


    यूहन्ना का सुसमाचार स्वयं यूहन्ना ने, जब वह अभी शरीर में जीवित था, कलीसियाओं में प्रकट किया और उन्हें सौंपा। हिरापुलिस के पापियास नामक व्यक्ति ने—जो यूहन्ना का प्रिय शिष्य था—अपनी पाँच बहिर्मुखी [पढ़ें: व्याख्यात्मक] पुस्तकों में ऐसा बताया है। और उसने यूहन्ना के बोलकर लिखवाने पर सुसमाचार को ठीक-ठीक लिख लिया।[a]


    नौवीं शताब्दी की एक वैटिकन पांडुलिपि।


    खंड 20


    क्योंकि इनमें सबसे बाद में यूहन्ना ने—जिसका उपनाम “गर्जन का पुत्र” था—जब वह बहुत वृद्ध हो चुका था, उस समय के आसपास जब भयंकर विधर्म उठ खड़े हुए थे, अपने ही शिष्य, हिरापुलिस के सदाचारी पापियास को बोलकर सुसमाचार लिखवाया। ऐसा इरेनियस, यूसेबियस और विश्वसनीय इतिहासकारों की एक परंपरा ने हम तक पहुँचाया है। उसने ऐसा इसलिए किया कि जिन लोगों ने उससे पहले सारी पृथ्वी की जातियों में वचन का प्रचार किया था, उनके कथन में जो कमी रह गई थी, उसे पूरा करे।[b]


    बी. कॉर्डर द्वारा प्रकाशित ‘संत यूहन्ना पर यूनानी पिताओं की शृंखला’।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहिर्मुखी” प्राप्त पाठ का रूप है; संपादक ने इसके स्थान पर “व्याख्यात्मक” पढ़ने का सुझाव दिया है। यह अंश नौवीं शताब्दी की एक वैटिकन पांडुलिपि में सुरक्षित है।
    reason: महत्त्वपूर्ण पाठ-सुधार और साक्षी की अपेक्षाकृत देर की तिथि को पारदर्शी बनाना।
  - marker: b
    text: खंड 20 का यह अंश ‘संत यूहन्ना पर यूनानी पिताओं की शृंखला’ नामक बाद के संकलन से उद्धृत है। इसमें इरेनियस, यूसेबियस और अन्य इतिहासकारों के माध्यम से मिली परंपरा का दावा किया गया है।
    reason: खंड 19 के साथ संलग्न खंड 20 की अलग स्रोत-स्थिति स्पष्ट करना।
lexical_decisions:
- source_word: argument
  choice: भूमिका
  rationale: इस पांडुलिपीय शीर्षक में इसका अर्थ तर्क-वितर्क नहीं, बल्कि सुसमाचार का परिचय अथवा सार-विवरण है।
- source_word: made known and given to the Churches
  choice: कलीसियाओं में प्रकट किया और उन्हें सौंपा
  rationale: दोनों क्रियाओं का भेद सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: while he yet remained in the body
  choice: जब वह अभी शरीर में जीवित था
  rationale: मूल रूपक को बनाए रखते हुए उसका आशय आधुनिक पाठक के लिए स्पष्ट किया गया है।
- source_word: exoteric (read exegetical)
  choice: 'बहिर्मुखी [पढ़ें: व्याख्यात्मक]'
  rationale: प्राप्त पाठ और संपादकीय पाठ-सुधार दोनों को मिटाए बिना सुरक्षित रखा गया है।
- source_word: at the dictation of John
  choice: यूहन्ना के बोलकर लिखवाने पर
  rationale: dictation का सीधा और सहज हिन्दी अर्थ, बिना लेखकत्व संबंधी दावे को बढ़ाए।
- source_word: Son of Thunder
  choice: गर्जन का पुत्र
  rationale: उपनाम का अर्थानुवाद किया गया है और उद्धरण-चिह्नों से उपाधि स्पष्ट की गई है।
- source_word: heresies
  choice: विधर्म
  rationale: प्राचीन मसीही विवाद के संदर्भ में प्रतिष्ठित, संक्षिप्त हिन्दी पारिभाषिक शब्द।
- source_word: the word
  choice: वचन
  rationale: मसीही साहित्य में संदेश/सुसमाचार के लिए प्रचलित शब्द; मूल की संभावित धार्मिक अनुगूँज बनी रहती है।
- source_word: Catena Patrum Graecorum
  choice: यूनानी पिताओं की शृंखला
  rationale: ग्रंथ-स्रोत के लैटिन शीर्षक का अर्थ पाठक के लिए सुलभ हिन्दी में दिया गया है।
theological_decisions:
- issue: पापियास का यूहन्ना का ‘प्रिय शिष्य’ होना
  choice: दावे को साक्षी-पाठ के कथन के रूप में यथावत रखा
  alternative: इसे ऐतिहासिक रूप से प्रमाणित तथ्य की तरह अधिक दृढ़ बनाना या हटाना
  rationale: यह बाद के साक्षी का दावा है; अनुवाद का कार्य उसे सुरक्षित रखना है, ऐतिहासिक विवाद का निर्णय करना नहीं।
- issue: यूहन्ना द्वारा सुसमाचार बोलकर लिखवाने का दावा
  choice: ‘बोलकर लिखवाया’ का सीधा रूप रखा
  alternative: पापियास को सहलेखक, सचिव या केवल प्रतिलिपिकार कहना
  rationale: साक्षी dictation कहता है, पर पापियास की सटीक भूमिका को आगे परिभाषित नहीं करता।
- issue: पूर्व प्रचारकों की ‘कमी’
  choice: उनके कथन में जो कमी रह गई थी
  alternative: उनके सुसमाचारों की त्रुटि या धर्मवैज्ञानिक अपूर्णता कहना
  rationale: पाठ कमी पूरी करने की बात करता है, पर उसकी प्रकृति स्पष्ट नहीं करता; इसलिए तनाव और अस्पष्टता बचाई गई है।
- issue: ‘विधर्म’ का मूल्यांकनात्मक स्वर
  choice: प्राचीन साक्षी का नकारात्मक मूल्यांकन सुरक्षित रखा
  alternative: तटस्थ ‘भिन्न मत’
  rationale: ‘terrible heresies’ को तटस्थ करने से साक्षी का अपना स्वर मिट जाता।
