base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/013.yaml
  text: 'By this he speaks obscurely, referring, I suppose, to Papias of Hierapolis in Asia, who was a bishop at that time and flourished in the days of the holy Evangelist John. For this Papias, in the fourth book of his Dominical Expositions, mentioned foods among the sources of delights in the resurrection.... And Irenaeus of Lyons says the same thing in his fifth book Against Heresies and presents the aforementioned Papias in support of his statements.


    MAXIMUS THE CONFESSOR, Scholia on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
translation:
  language: hi
  text: 'इस कथन के द्वारा वह अस्पष्ट रूप से संकेत करता है—मेरा अनुमान है—एशिया के हियरापुलिस के पापियास की ओर, जो उस समय बिशप था और पवित्र सुसमाचार-लेखक यूहन्ना के दिनों में प्रसिद्ध था। क्योंकि इसी पापियास ने अपनी प्रभु-वचनों की व्याख्याएँ[a] नामक कृति की चौथी पुस्तक में पुनरुत्थान के आनंद के साधनों में भोज्य पदार्थों का भी उल्लेख किया था.... और ल्यों के इरेनियस ने भी विधर्मों के विरुद्ध अपनी पाँचवीं पुस्तक में यही बात कही है और अपने कथनों के समर्थन में उपर्युक्त पापियास को प्रस्तुत किया है।


    — अंगीकारक मैक्सिमस, दियुनुसियुस अरियुपगी की कलीसियाई पदानुक्रम पर टिप्पणियाँ, अध्याय 7।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कृति के इस शीर्षक का अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर अस्थायी रूप से किया गया है; यूनानी/लातीनी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: दिए गए स्रोत में प्राचीन भाषा की प्रत्यक्ष समीक्षा उपलब्ध नहीं है और 'Dominical Expositions' शीर्षक के अनुवाद में पाठ-परंपरा संबंधी अनिश्चितता है।
lexical_decisions:
- source_word: darkly indicating
  choice: अस्पष्ट रूप से संकेत करता है
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में निहित अप्रत्यक्ष और असपष्ट संकेत—दोनों भाव सुरक्षित रखे गए हैं।
- source_word: flourished
  choice: प्रसिद्ध था
  rationale: यहाँ काल-सूचक साहित्यिक अर्थ संभव है; सहज हिन्दी में व्यक्ति की उस काल में सक्रिय प्रतिष्ठा व्यक्त की गई है, बिना उसके जीवनकाल की सटीक सीमा निर्धारित किए।
- source_word: Dominical Expositions
  choice: प्रभु-वचनों की व्याख्याएँ
  rationale: पापियास की प्रचलित कृति-परंपरा और 'Dominical' के प्रभु-संबंधी अर्थ को ध्यान में रखकर अर्थपूर्ण शीर्षक दिया गया है; स्रोत-भाषा समीक्षा लंबित होने के कारण पादटिप्पणी जोड़ी गई है।
- source_word: viands
  choice: भोज्य पदार्थों
  rationale: पुरातन अंग्रेज़ी 'viands' का आशय खाने की वस्तुओं से है; औपचारिक किंतु बोधगम्य हिन्दी चुनी गई है।
- source_word: sources of delights
  choice: आनंद के साधनों
  rationale: असामान्य स्रोत-वाक्यांश को अत्यधिक ठोस अर्थ दिए बिना स्वाभाविक हिन्दी में रखा गया है।
- source_word: Evangelist John
  choice: सुसमाचार-लेखक यूहन्ना
  rationale: '''Evangelist'' की यहाँ लेखक/सुसमाचार-साक्षी संबंधी उपाधि को सामान्य पाठक के लिए स्पष्ट किया गया है।'
- source_word: Schol. in libr. Dionys. Areopag. de eccl. hierarch.
  choice: दियुनुसियुस अरियुपगी की कलीसियाई पदानुक्रम पर टिप्पणियाँ
  rationale: लातीनी ग्रंथ-संदर्भ को हिन्दी में अर्थानुसार प्रस्तुत किया गया है और नामों का पारंपरिक बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: पुनरुत्थान में भोजन संबंधी कथन
  choice: पुनरुत्थान के आनंद के साधनों में भोज्य पदार्थों का भी उल्लेख
  alternative: पुनरुत्थान के आनंद में भोजन का उल्लेख
  rationale: साक्ष्य का कथन ज्यों का त्यों रखा गया है; इससे किसी विशिष्ट सहस्राब्दीवादी या देह-विषयक सिद्धांत का निष्कर्ष अनावश्यक रूप से नहीं जोड़ा गया।
- issue: यूहन्ना के दिनों में पापियास की स्थिति
  choice: यूहन्ना के दिनों में प्रसिद्ध था
  alternative: यूहन्ना का समकालीन था
  rationale: स्रोत-साक्ष्य के 'flourished in the days' से अधिक निश्चित व्यक्तिगत संबंध या पूर्ण समकालिकता नहीं निकाली गई।
- issue: लेखक का अनुमान
  choice: मेरा अनुमान है
  alternative: निश्चय ही
  rationale: '''I suppose'' की अनिश्चितता सुरक्षित रखी गई है, ताकि पापियास की पहचान को लेखक के कथन से अधिक निश्चित न बनाया जाए।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय ऐतिहासिक-धर्मशास्त्रीय शैली अपनाई गई है। दीर्घविराम मूल साक्ष्य में विद्यमान लोप-संकेत के रूप में सुरक्षित है। व्यक्तिनामों में हिन्दी बाइबलीय/कलीसियाई प्रचलन को प्राथमिकता दी गई है। यह मसौदा उपलब्ध अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य पर आधारित अस्थायी अनुवाद है; यूनानी/लातीनी स्रोत-परीक्षण लंबित है।
