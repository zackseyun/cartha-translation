base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: hi
  text: 'परन्तु इस पुस्तक (अर्थात् प्रकाशितवाक्य) की ईश्वरीय प्रेरणा के विषय में—[यहाँ उपलब्ध पाठ अधूरा है][a]—ग्रेगरी (मेरा आशय ‘धर्मविज्ञानी’ से है), किरिल और उनसे भी पुरानी पीढ़ी के लोग, [पपियास?][b], इरेनियस, मेथोदियस और हिप्पोलितुस इसकी प्रामाणिकता की गवाही देते हैं।


    —कैसरिया के अन्द्रियास, प्रकाशितवाक्य की भूमिका'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य में “Apocal” और “mean, the Divine” के बीच का पाठ लुप्त या विकृत है। इसलिए छूटे हुए शब्दों का अनुमान लगाकर अनुवाद नहीं किया गया है। मूल यूनानी/लातीनी स्रोत की समीक्षा लंबित है।
    reason: पाठगत रिक्ति को स्पष्ट रखना और अनुमानित पुनर्निर्माण को मुख्य पाठ में न मिलाना।
  - marker: b
    text: उपलब्ध साक्ष्य में यह नाम विकृत रूप में छपा है; संदर्भ के आधार पर सम्भावित पाठ ‘पपियास’ है, पर मूल-भाषा समीक्षा होने तक इसे प्रश्नचिह्न सहित रखा गया है।
    reason: व्यक्तिनाम की वास्तविक पाठगत अनिश्चितता सुरक्षित रखना।
lexical_decisions:
- source_word: inspiration
  choice: ईश्वरीय प्रेरणा
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में प्रयुक्त धार्मिक अर्थ को आधुनिक, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है; मूल यूनानी/लातीनी पाठ की सीधी समीक्षा अभी लंबित है।
- source_word: Apocalypse
  choice: प्रकाशितवाक्य
  rationale: यहाँ शब्द उस बाइबिल-पुस्तक के नाम के रूप में आया है; ‘प्रकाशितवाक्य’ हिन्दी पाठकों के लिए परिचित और संदर्भानुकूल है।
- source_word: the Divine
  choice: ‘धर्मविज्ञानी’
  rationale: ग्रेगरी की पारंपरिक उपाधि ‘The Theologian’ का आशय व्यक्त करता है; ‘ईश्वरीय’ कहने से व्यक्ति स्वयं दिव्य है, ऐसा भ्रामक अर्थ निकल सकता था।
- source_word: genuineness
  choice: प्रामाणिकता
  rationale: यह चयन पुस्तक के असली अथवा विश्वसनीय होने की गवाही को व्यक्त करता है, बिना यह तय किए कि कथन केवल लेखकत्व, कैननिकता या सत्यता में से किस एक पर केंद्रित है।
- source_word: ANDREAS OF CAESAREA
  choice: कैसरिया के अन्द्रियास
  rationale: व्यक्ति और स्थान के नामों का प्रचलित ध्वन्यात्मक हिन्दी रूप अपनाया गया है।
theological_decisions:
- issue: पुस्तक की प्रेरणा और प्रामाणिकता के बीच संबंध
  choice: 'दोनों पदों को अलग रखा गया: ‘ईश्वरीय प्रेरणा’ और ‘प्रामाणिकता’।'
  alternative: दोनों को मिलाकर ‘ईश्वर-प्रेरित होने की प्रामाणिकता’ कहना।
  rationale: उपलब्ध साक्ष्य आरंभ में inspiration और अंत में genuineness कहता है। इन्हें मिला देने से मूल कथन का तनाव और संभावित अर्थ-भेद मिट जाता।
- issue: Gregory की उपाधि ‘the Divine’
  choice: ‘धर्मविज्ञानी’
  alternative: ‘दिव्य’ या ‘ईश्वरीय ग्रेगरी’
  rationale: यह उपाधि सामान्यतः धर्मविज्ञानी ग्रेगरी की ओर संकेत करती है; चुना हुआ रूप किसी व्यक्ति को स्वभावतः दिव्य ठहराने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण ऐतिहासिक-धार्मिक शैली अपनाई गई है। वाक्य को सहज बनाया गया है, किंतु साक्ष्य की बड़ी रिक्ति और ‘पपियास’ नाम की अनिश्चितता स्पष्ट रूप से सुरक्षित रखी गई है। प्रत्यक्ष यूनानी/लातीनी समीक्षा लंबित होने के कारण यह प्रकाशन-पूर्व अस्थायी, साक्ष्य-आधारित मसौदा है।
