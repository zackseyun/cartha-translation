base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: hi
  text: 'अतः कलीसियाओं के अधिक प्राचीन व्याख्याकारों ने—मेरा आशय दार्शनिक फिलोन से है, जो प्रेरितों के समकालीन थे, और हिरापुलिस के प्रसिद्ध पापियास से, जो सुसमाचार लेखक यूहन्ना के शिष्य थे...और उनके साथियों से—परादीस के विषय में कही गई बातों का आत्मिक अर्थ लगाया और उन्हें मसीह की कलीसिया से संबद्ध माना।[a]


    —सिनाई के अनास्तासियुस, Contempl. Anagog. in Hexaém. vii.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी पाठ है; यूनानी/लातीनी स्रोत की प्रत्यक्ष समीक्षा अभी शेष है। मूल साक्षी में आए त्रिबिंदु (…) को यथावत रखा गया है।
    reason: दिए गए स्रोत-विवरण के अनुसार मूल-भाषा समीक्षा लंबित है और पाठ में विद्यमान रिक्ति/लोप को पाठक के सामने स्पष्ट रखना आवश्यक है।
lexical_decisions:
- source_word: expositors
  choice: व्याख्याकार
  rationale: यह शब्द उन प्राचीन लेखकों की शास्त्रीय कथनों की व्याख्या करनेवाली भूमिका को सहज और सम्मानजनक हिन्दी में व्यक्त करता है।
- source_word: Paradise
  choice: परादीस
  rationale: यहाँ विशिष्ट धर्मवैचारिक अवधारणा का संकेत है; ‘परादीस’ मूल पद की पहचान बनाए रखता है और इसे केवल ‘स्वर्ग’ मानकर अस्पष्टता दूर नहीं करता।
- source_word: spiritually
  choice: आत्मिक अर्थ लगाया
  rationale: साक्षी में वर्णित व्याख्या-पद्धति को व्यक्त करता है; इसे ‘रूपकात्मक’ कहने से अधिक विशिष्ट अर्थ आरोपित हो सकता था।
- source_word: referred them to
  choice: उन्हें ... से संबद्ध माना
  rationale: अंग्रेज़ी साक्षी के संबंध-सूचक अर्थ को बनाए रखते हुए यह निर्णय नहीं करता कि कथनों को प्रत्यक्ष भविष्यवाणी, रूपक या किसी अन्य अर्थ में कलीसिया पर लागू किया गया था।
- source_word: Church of Christ
  choice: मसीह की कलीसिया
  rationale: ऐतिहासिक मसीही संदर्भ में स्वाभाविक हिन्दी पदावली है और किसी आधुनिक संप्रदाय-नाम का संकेत नहीं देती।
theological_decisions:
- issue: परादीस-विषयक कथनों की व्याख्या का स्वरूप
  choice: ‘आत्मिक अर्थ लगाया’ और ‘मसीह की कलीसिया से संबद्ध माना’
  alternative: ‘कलीसिया के रूपक के रूप में समझा’
  rationale: साक्षी आध्यात्मिक व्याख्या और कलीसिया की ओर संदर्भित करने की बात कहता है, पर दोनों के सटीक संबंध को परिभाषित नहीं करता; अनुवाद इस तनाव को खुला रखता है।
- issue: पापियास का ‘यूहन्ना’ से संबंध
  choice: ‘सुसमाचार लेखक यूहन्ना के शिष्य’
  alternative: ‘यूहन्ना के शिष्य’
  rationale: उपलब्ध अंग्रेज़ी साक्षी में स्पष्टतः ‘John the Evangelist’ है; यद्यपि इस ऐतिहासिक पहचान पर चर्चा हो सकती है, अनुवाद साक्षी के दावे को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय ऐतिहासिक-धर्मवैचारिक शैली अपनाई गई है। व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण किया गया है। ग्रंथ-संदर्भ को स्रोत में दिए लैटिन रूप में रखा गया है, क्योंकि उसके सुनिश्चित हिन्दी शीर्षक और स्रोत-भाषाई पाठ की समीक्षा उपलब्ध नहीं है।
