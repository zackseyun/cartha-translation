base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: hi
  text: 'फिर स्तेफानुस हिरापुलिस के बिशप और शहीद पापियास का, और न ही लुगदुनुम के पवित्र बिशप इरेनियस का अनुसरण करता है, जब वे कहते हैं कि स्वर्ग का राज्य कुछ भौतिक भोज्य पदार्थों के उपभोग में निहित होगा।[a]


    — फोतियुस, बिब्लियोथेका 232, स्तेफानुस गोबारुस के विषय में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह अनुवाद सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी पाठ है; यूनानी/लातीनी मूल-स्रोत की प्रत्यक्ष समीक्षा अभी शेष है। साक्षी के मुद्रण-दोषयुक्त नाम-रूपों को मानकीकृत किया गया है: “Irenzeus” को इरेनियस और “Aibliotheca” को बिब्लियोथेका। लुगदुनुम आधुनिक ल्यों है।'
    reason: मूल भाषा की समीक्षा लंबित होने और अंग्रेज़ी साक्षी में स्पष्ट मुद्रण-दोष होने की पाठालोचनात्मक सीमा बताना आवश्यक है।
lexical_decisions:
- source_word: does Stephanus follow
  choice: स्तेफानुस ... का अनुसरण करता है
  rationale: कोष्ठकों में पूरित अंग्रेज़ी क्रिया को स्वाभाविक हिन्दी वाक्य-रचना में स्पष्ट किया गया है, जबकि निषेध का संबंध दोनों व्यक्तियों से बनाए रखा गया है।
- source_word: kingdom of heaven
  choice: स्वर्ग का राज्य
  rationale: यह पारंपरिक और सामान्यतः बोधगम्य हिन्दी पद है तथा साक्षी में उपस्थित धर्मवैचारिक अभिव्यक्ति को बिना विस्तार के सुरक्षित रखता है।
- source_word: certain material foods
  choice: कुछ भौतिक भोज्य पदार्थ
  rationale: ‘material’ का असामान्य किंतु महत्वपूर्ण भेद बनाए रखने के लिए ‘भौतिक’ और foods के लिए गरिमापूर्ण, व्यापक ‘भोज्य पदार्थ’ चुना गया है।
- source_word: consist in enjoyment
  choice: उपभोग में निहित होगा
  rationale: यह केवल खाने की क्रिया नहीं, बल्कि उस कथन की संरचना—राज्य का ऐसे उपभोग में निहित होना—को व्यक्त करता है।
- source_word: Lyons
  choice: लुगदुनुम
  rationale: प्राचीन नगर को उसके ऐतिहासिक नाम से प्रस्तुत किया गया है, आधुनिक पहचान पादटिप्पणी में दी गई है।
theological_decisions:
- issue: भौतिक भोजन और स्वर्ग के राज्य के संबंध का कथन
  choice: कथन को प्रत्यक्ष रूप से रखा गया कि राज्य ‘कुछ भौतिक भोज्य पदार्थों के उपभोग में निहित होगा’
  alternative: इसे सहस्राब्दी-राज्य के भोज, प्रतिफल या रूपक के रूप में स्पष्ट करना
  rationale: उपलब्ध अंग्रेज़ी साक्षी स्वयं कथन की पृष्ठभूमि या अर्थ नहीं खोलती; इसलिए धर्मवैचारिक तनाव और संभावित अस्पष्टता को बिना सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
- issue: फोतियुस द्वारा वर्णित असहमति
  choice: स्तेफानुस द्वारा पापियास और इरेनियस का अनुसरण न करने के रूप में अनूदित
  alternative: इसे फोतियुस की अपनी धर्मवैचारिक अस्वीकृति के रूप में प्रस्तुत करना
  rationale: वाक्य का व्याकरणिक विषय स्तेफानुस है; फोतियुस को स्वयं उस मत का प्रत्यक्ष विरोधी बनाना साक्ष्य से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक-धर्मवैचारिक गद्य रखा गया है। व्यक्तिनामों और ग्रंथनाम का देवनागरी लिप्यंतरण किया गया है; प्राचीन स्थाननाम के साथ आधुनिक पहचान पादटिप्पणी में दी गई है।
