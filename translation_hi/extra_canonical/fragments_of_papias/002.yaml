  text: 'पापियास की पाँच पुस्तकें उपलब्ध हैं, जिनका शीर्षक है प्रभु के वचनों की व्याख्याएँ। इरेनियस भी इनका उल्लेख पापियास की लिखी हुई एकमात्र कृतियों के रूप में इन शब्दों में करता है: “इन बातों की गवाही पापियास—जो यूहन्ना का श्रोता, पोलिकार्प का साथी और प्राचीन काल का एक आदरणीय व्यक्ति था—अपनी चौथी पुस्तक में लिखित रूप से देता है। क्योंकि उसने कुल पाँच पुस्तकें लिखी थीं।” यहाँ तक इरेनियस ने कहा है।


    फिर भी पापियास स्वयं अपने विवेचनों की भूमिका में निश्चय ही यह दावा नहीं करता कि वह पवित्र प्रेरितों का श्रोता और प्रत्यक्षदर्शी था। इसके बजाय, उसकी भाषा से प्रकट होता है कि उसने विश्वास से संबंधित बातें उन लोगों से प्राप्त की थीं जो प्रेरितों के परिचित थे:


    “मैं अपनी व्याख्याओं के साथ उन सभी बातों को भी तुम्हारे लिए स्थान देने में संकोच नहीं करूँगा, जिन्हें मैंने बीते समय में प्राचीनों से सावधानीपूर्वक सीखा और ठीक से स्मरण रखा था; और मैं उनकी सत्यता की पुष्टि करता हूँ। क्योंकि बहुतों के विपरीत, मुझे उन लोगों से प्रसन्नता नहीं होती थी जो बहुत कुछ बोलते हैं, बल्कि उनसे जो सत्य सिखाते हैं; न उनसे जो पराए आदेश सुनाते हैं, बल्कि उनसे जो उन आदेशों को सुनाते हैं जिन्हें प्रभु ने विश्वास के लिए दिया और जो स्वयं सत्य से निकले हैं। और जब भी कोई ऐसा व्यक्ति मेरे पास आता जो प्राचीनों का अनुयायी रह चुका था, तो मैं प्राचीनों के कथनों के विषय में पूछता—अन्द्रियास ने क्या कहा था, या पतरस ने, या फिलिप्पुस ने, या थोमा या याकूब ने, या यूहन्ना या मत्ती ने, या प्रभु के किसी अन्य शिष्य ने; और अरिस्तियोन तथा प्राचीन यूहन्ना, जो प्रभु के शिष्य हैं, क्या कहते हैं। क्योंकि मेरा विचार था कि पुस्तकों की सामग्री से मुझे उतना लाभ नहीं मिल सकता जितना किसी जीवित और विद्यमान वाणी के कथनों से।”


    यहाँ ध्यान देना उचित है कि वह यूहन्ना का नाम दो बार गिनाता है। पहले यूहन्ना का उल्लेख वह पतरस, याकूब, मत्ती और शेष प्रेरितों के साथ करता है—स्पष्टतः उसका अभिप्राय सुसमाचार-लेखक से है। पर दूसरे यूहन्ना का उल्लेख वह कुछ अंतराल के बाद करता है और उसे प्रेरितों की संख्या से बाहर के अन्य लोगों के साथ रखता है; वह उससे पहले अरिस्तियोन का नाम रखता और उसे स्पष्ट रूप से “प्राचीन” कहता है। इस प्रकार वह बिल्कुल स्पष्ट कर देता है कि उन लोगों का कथन सत्य है जो कहते हैं कि एशिया में इस नाम के दो व्यक्ति थे और इफिसुस में दो कब्रें हैं, जिनमें से प्रत्येक आज भी “यूहन्ना की कब्र” कहलाती है। इस बात पर ध्यान देना महत्त्वपूर्ण है; क्योंकि संभवतः दूसरे यूहन्ना ने वह प्रकाशितवाक्य देखा था जो यूहन्ना के नाम से जुड़ा है—यदि कोई यह स्वीकार न करे कि उसे पहले यूहन्ना ने देखा था। जिस पापियास की हम अभी चर्चा कर रहे हैं, वह स्वीकार करता है कि उसने प्रेरितों के वचन उनके अनुयायियों से प्राप्त किए थे; पर वह कहता है कि वह स्वयं अरिस्तियोन और प्राचीन यूहन्ना का श्रोता था। निश्चय ही वह बार-बार उनका नाम लेता है और अपने लेखों
    में उनकी परंपराएँ भी दर्ज करता है। इन बातों के विषय में इतना ही; मुझे आशा है कि इन्हें प्रस्तुत करना व्यर्थ नहीं रहा।


    फिर भी ऊपर दिए गए पापियास के शब्दों में उसके कुछ और अंश जोड़ना उचित है। उनमें वह कुछ अन्य अद्भुत घटनाएँ भी दर्ज करता है, जो परंपरा द्वारा उस तक पहुँची थीं। यह पहले ही कहा जा चुका है कि प्रेरित फिलिप्पुस अपनी बेटियों के साथ हिरापुलिस में रहता था; किंतु यहाँ इस बात पर ध्यान देना चाहिए कि उनका समकालीन पापियास बताता है कि उसने फिलिप्पुस की बेटियों से एक अद्भुत वृत्तांत सुना था। वह बताता है कि उसके समय में एक व्यक्ति मरे हुओं में से जी उठा था। वह यूसतुस के विषय में भी एक और अद्भुत वृत्तांत देता है, जिसका उपनाम बरसब्बा था: उसने घातक विष पी लिया था, फिर भी प्रभु के अनुग्रह से उसे कोई हानि नहीं हुई। इसी यूसतुस के विषय में प्रेरितों के काम की पुस्तक बताती है कि उद्धारकर्ता के स्वर्गारोहण के बाद पवित्र प्रेरितों ने उसे मत्तियाह के साथ सामने खड़ा किया और विश्वासघाती यहूदा के स्थान पर उनकी संख्या पूरी करने के लिए उचित चुनाव हेतु प्रार्थना की। वह अंश लगभग इस प्रकार है: “और उन्होंने दो व्यक्तियों को सामने खड़ा किया—यूसुफ को, जो बरसब्बा कहलाता था और जिसका उपनाम यूसतुस था, और मत्तियाह को; और उन्होंने
    प्रार्थना करके कहा...”


    इसी लेखक ने कुछ और विवरण भी लिखे हैं, जो मौखिक परंपरा से उस तक पहुँचे थे: उद्धारकर्ता के कुछ विचित्र दृष्टांत और उसकी शिक्षाएँ, तथा कुछ अन्य बातें जो कुछ हद तक मिथकीय स्वरूप की हैं। इनमें वह कहता है कि पुनरुत्थान के बाद लगभग दस हजार वर्षों की एक अवधि होगी और मसीह का राज्य इसी पृथ्वी पर भौतिक रूप में स्थापित होगा। मेरा अनुमान है कि प्रेरितों के वृत्तांतों को गलत समझने के कारण उसने ये विचार अपनाए; वह यह नहीं समझ पाया कि उनमें अलंकारों में लिखी हुई बातें प्रेरितों ने रहस्यमय अर्थ में कही थीं।


    क्योंकि उसके अपने कथनों के आधार पर कहा जा सकता है कि उसकी समझ स्पष्टतः बहुत सीमित थी। फिर भी उसी के कारण उसके बाद के इतने सारे कलीसियाई अगुओं ने वैसा ही मत अपना लिया। वे अपने समर्थन में उस व्यक्ति की प्राचीनता का सहारा लेते थे—उदाहरण के लिए इरेनियस और वे अन्य लोग जिन्होंने अपने को समान विचारों वाला घोषित किया। पापियास अपनी कृति में ऊपर उल्लिखित अरिस्तियोन के प्रामाणिक कथन के आधार पर प्रभु के वचनों के अन्य वृत्तांत और प्राचीन यूहन्ना की परंपराएँ भी देता है। जिज्ञासु पाठकों को हम उन्हीं की ओर भेजते हैं। अपने वर्तमान उद्देश्य के लिए हम उसके ऊपर उद्धृत शब्दों में केवल वह परंपरा जोड़ेंगे जो इन्हीं स्रोतों के द्वारा सुसमाचार लिखने वाले मरकुस के विषय में प्रस्तुत की गई है:


    “और प्राचीन ने यह भी कहा: मरकुस पतरस का दुभाषिया बन गया था। उसने जो कुछ स्मरण रखा, उसे ठीक-ठीक लिख दिया, यद्यपि मसीह ने जो कुछ कहा या किया था उसे क्रमबद्ध रूप में दर्ज नहीं किया। क्योंकि उसने न तो प्रभु को सुना था, न उसका अनुसरण किया था; परंतु बाद में, जैसा मैंने कहा, वह पतरस के साथ रहा। पतरस अपने श्रोताओं की आवश्यकताओं के अनुसार शिक्षा देता था, पर उसका उद्देश्य प्रभु के वचनों का क्रमबद्ध विवरण देना नहीं था। इसलिए मरकुस ने कुछ बातों को अपनी स्मृति के अनुसार लिखते समय कोई भूल नहीं की; क्योंकि उसने केवल इस बात की सावधानी रखी कि सुनी हुई किसी बात को छोड़े नहीं और उसमें कोई झूठी बात न लिखे।”


    पापियास ने मरकुस के विषय में यही विवरण दिया है। किंतु मत्ती के विषय में वह यह कथन करता है:


    “इस प्रकार मत्ती ने प्रभु के वचनों को इब्रानी बोली[a] में संकलित किया, और प्रत्येक व्यक्ति ने अपनी क्षमता के अनुसार उनका अर्थ बताया[b]।”


    इसी लेखक ने यूहन्ना के पहले पत्र और उसी प्रकार पतरस के पत्र से भी प्रमाण दिए हैं। उसने एक स्त्री के विषय में एक और वृत्तांत सुनाया है, जिस पर प्रभु के सामने बहुत से पापों का आरोप लगाया गया था; यह वृत्तांत ‘इब्रानियों के अनुसार सुसमाचार’ में मिलता है।[c]'
  philosophy: optimal-equivalence
