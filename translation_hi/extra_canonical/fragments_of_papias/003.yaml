base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/003.yaml
  text: 'And each man went to his own house, but Jesus went to the Mount of Olives. Early in the morning he came again to the temple, [and all the people came to him; and he sat down and taught them]. The scribes and the Pharisees brought a woman caught in adultery, and after placing her in the middle, they said to him, “Teacher, this woman was caught in adultery, in the very act. Now in the law Moses commanded [us] to stone such. What then do you say?” [They said this to test him, so that they might have something with which to accuse him.] But Jesus stooped down and wrote on the ground with his finger. When they continued questioning [him], he straightened up and said [to them], “Let the one among you who is without sin be the first to throw a stone at her.” Again he stooped down and wrote on the ground. When they heard this, they went out one by one, beginning with the oldest. He was left alone, and the woman, where she was, in the middle. Jesus straightened up and said to her, “Woman,
    where are they? Did no one condemn you?” She said, “No one, Lord.” Jesus said, “Neither do I condemn you. Go on your way; from now on, sin no more.”


    PERICOPE ADULTERAE; see Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 sq., 91; Lightfoot, Essays on Supernatural Religion, p. 203 sq.'
translation:
  language: hi
  text: हर एक व्यक्ति अपने घर चला गया, पर यीशु जैतून पहाड़ पर चले गए। भोर को वे फिर मंदिर में आए, [और सब लोग उनके पास आए; तब वे बैठ गए और उन्हें शिक्षा देने लगे]। शास्त्री और फ़रीसी व्यभिचार करते पकड़ी गई एक स्त्री को लाए। उसे बीच में खड़ा करके उन्होंने यीशु से कहा, “गुरु, यह स्त्री व्यभिचार करते हुए, उसी समय पकड़ी गई है। व्यवस्था में मूसा ने [हमें] ऐसी स्त्रियों को पत्थरवाह करने की आज्ञा दी है। तो आप क्या कहते हैं?” [उन्होंने यीशु की परीक्षा लेने के लिए यह कहा, ताकि उन पर दोष लगाने का कोई आधार मिल सके।] लेकिन यीशु झुककर अपनी उँगली से भूमि पर लिखने लगे। जब वे उनसे लगातार पूछते रहे, तो यीशु सीधे खड़े हुए और [उनसे] कहा, “तुममें जो निष्पाप है, वही सबसे पहले इस पर पत्थर फेंके।” फिर वे झुककर भूमि पर लिखने लगे। यह सुनकर वे एक-एक करके बाहर चले गए—बुज़ुर्गों से आरम्भ करके। यीशु अकेले रह गए, और वह स्त्री वहीं बीच में खड़ी रही। यीशु सीधे खड़े हुए और उससे कहा, “स्त्री, वे कहाँ हैं? क्या किसी ने भी तुम्हें दोषी नहीं ठहराया?” उसने कहा, “किसी ने नहीं, प्रभु।” यीशु ने कहा, “मैं भी तुम्हें दोषी नहीं ठहराता।
    जाओ; अब से फिर पाप मत करना।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित एक अंतरिम रूप है; यूनानी/लातीनी स्रोत-साक्ष्यों की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग कोष्ठक साक्षी में पुनर्स्थापित या अनिश्चित माने गए शब्दों और वाक्यों को दिखाते हैं। यह प्रसंग प्राचीन हस्तलिखित साक्ष्यों में अलग-अलग स्थानों पर मिलता है और अनेक आरम्भिक प्रतियों में अनुपस्थित है। संपादकीय संदर्भ: Westcott and Hort, The New Testament in the Original Greek, खंड I, पृ. 241; खंड II, पृ. 82 आगे, 91; Lightfoot, Essays on Supernatural Religion, पृ. 203 आगे।'
    reason: दिए गए स्रोत की अंतरिम प्रकृति, वर्ग कोष्ठकों का अर्थ, प्रसंग की पाठगत स्थिति और साक्षी का मूल संपादकीय संदर्भ पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: scribes
  choice: शास्त्री
  rationale: यह प्रचलित और अर्थ-संगत हिन्दी पद है, जो व्यवस्था के विद्वान व्याख्याताओं को सूचित करता है।
- source_word: taken in adultery
  choice: व्यभिचार करते पकड़ी गई
  rationale: वाक्यांश घटना के समय पकड़े जाने का स्पष्ट अर्थ रखता है और अगले ‘उसी समय’ से स्वाभाविक रूप से जुड़ता है।
- source_word: stone such
  choice: ऐसी स्त्रियों को पत्थरवाह करना
  rationale: ‘पत्थरवाह’ न्यायिक दंड की प्रकृति को संक्षेप में और स्पष्ट रूप से व्यक्त करता है।
- source_word: without sin
  choice: निष्पाप
  rationale: यह मूल कथन की व्यापकता बनाए रखता है; इसे केवल इसी अपराध से निर्दोष होने तक सीमित नहीं करता।
- source_word: condemn
  choice: दोषी ठहराना
  rationale: यह न्यायिक प्रसंग के अनुकूल है और केवल नैतिक आलोचना का अर्थ नहीं देता।
- source_word: Lord
  choice: प्रभु
  rationale: सम्मानसूचक अथवा अधिक गहरे धार्मिक संबोधन—दोनों संभावनाओं को खुला रखता है।
theological_decisions:
- issue: ‘जो निष्पाप है’ की सीमा
  choice: व्यापक ‘निष्पाप’ रखा गया
  alternative: ‘जिसने यह पाप न किया हो’ या ‘जो इस मामले में निर्दोष हो’
  rationale: उपलब्ध साक्ष्य में कथन को किसी विशेष पाप तक सीमित नहीं किया गया; व्यापक धार्मिक और नैतिक तनाव सुरक्षित रखा गया है।
- issue: यीशु का ‘दोषी नहीं ठहराता’ कहना
  choice: न्यायिक भाषा में अनूदित किया गया
  alternative: ‘मैं भी तुम्हारी निंदा नहीं करता’
  rationale: आरोप, व्यवस्था और दंड के प्रसंग में ‘दोषी ठहराना’ अधिक सटीक है, जबकि क्षमा अथवा निर्दोषता की कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: पाठ की अनिश्चितता
  choice: साक्षी में कोष्ठकबद्ध अंशों को मुख्य पाठ में वर्ग कोष्ठकों सहित रखा गया और समूचे अंश की स्थिति पर पादटिप्पणी दी गई
  alternative: कोष्ठक हटाकर निर्बाध पाठ देना या अंश को छोड़ देना
  rationale: इससे उपलब्ध साक्षी की वास्तविक पाठगत अनिश्चितता पाठक से छिपती नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। यीशु के लिए आदरसूचक बहुवचन और अन्य पात्रों के लिए प्रसंगानुकूल रूप रखे गए हैं। पुरातन या अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचते हुए ‘व्यवस्था’, ‘शास्त्री’, ‘फ़रीसी’, ‘निष्पाप’ और ‘प्रभु’ जैसे स्थापित बाइबलीय पद बनाए रखे गए हैं।
