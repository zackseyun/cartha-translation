base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: hi
  text: 'जो लोग परमेश्वर के प्रति निष्कपटता का आचरण करते थे, उन्हें वे “बालक” कहा करते थे। यह बात पापियास भी अपनी पुस्तक प्रभु के वचनों की व्याख्याएँ के पहले खंड में, और अलेक्ज़ान्द्रिया के क्लेमेंट अपनी पुस्तक शिक्षक में दिखाते हैं।[a]


    —माक्सिमुस द कन्फेसर, दियोनिसियुस अरियुपगी के ग्रंथों पर टीकाएँ, कलीसियाई पदानुक्रम के विषय में, अध्याय 2।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; यूनानी/लातीनी स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी शेष है। कृतियों के शीर्षक अर्थसूचक हिन्दी में दिए गए हैं।
    reason: स्रोत-भाषा समीक्षा लंबित होने और शीर्षकों के अनुवाद में संभावित पाठगत अस्पष्टता को पारदर्शी बनाना।
lexical_decisions:
- source_word: guilelessness
  choice: निष्कपटता
  rationale: यह छल-कपट से रहित, सरल और सच्चे मन का भाव स्वाभाविक तथा गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: children
  choice: बालक
  rationale: रूपकात्मक संबोधन को बनाए रखते हुए मूल की सामान्य संज्ञा का सीधा और साहित्यिक अनुवाद है; यहाँ इसे जैविक संतान तक सीमित नहीं किया गया।
- source_word: Expositions of the Lord
  choice: प्रभु के वचनों की व्याख्याएँ
  rationale: पापियास की कृति के प्रचलित आशय को स्पष्ट करता है, पर उपलब्ध अंग्रेज़ी साक्ष्य की शीर्षक-रचना में निहित संभावित अस्पष्टता के कारण इसे पादटिप्पणी से चिह्नित किया गया है।
- source_word: Paedagogue
  choice: शिक्षक
  rationale: क्लेमेंट की कृति के यूनानी शीर्षक का अर्थसूचक हिन्दी रूप है; केवल लिप्यंतरण साधारण पाठक के लिए कम स्पष्ट होता।
- source_word: towards God
  choice: परमेश्वर के प्रति
  rationale: संबंध और अभिमुखता—दोनों को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: “बालक” कहे जाने का आधार
  choice: 'वाक्य को वर्णनात्मक रखा गया है: परमेश्वर के प्रति निष्कपट आचरण करने वालों को “बालक” कहा जाता था।'
  alternative: इसे आत्मिक पुनर्जन्म, बाल-सदृश विश्वास या किसी विशिष्ट कलीसियाई पद की स्पष्ट शिक्षा के रूप में समझाना।
  rationale: खंडित साक्ष्य इतनी विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं देता; अतः उसके रूपक और तनाव को बिना सांप्रदायिक विस्तार के रखा गया है।
- issue: बहुवचन कर्ता “they” की पहचान
  choice: अनिर्दिष्ट “वे” बनाए रखा गया है।
  alternative: “प्राचीन मसीही,” “प्रेरित,” या किसी निश्चित समुदाय का नाम देना।
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य कर्ता की स्पष्ट पहचान नहीं करता, इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। उद्धरण के खंडित और परवर्ती-साक्ष्य स्वरूप को ध्यान में रखते हुए अनिर्दिष्ट सर्वनाम तथा रूपकात्मक “बालक” को नहीं समझाया गया। नंगे पृष्ठ-चिह्न को हटाया गया है और उद्धरण-स्रोत को पृथक अभिलेखीय पंक्ति में रखा गया है।
