    reason: OCR/पाठ-विकृति को अनुवाद समझ लिए जाने से रोकना और काल्पनिक पुनर्निर्माण से बचना।
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: धर्मवेत्ता और प्रेरित यूहन्ना
  rationale: “Divine” को व्यक्ति के दिव्य होने के अर्थ में न लेकर पारंपरिक विद्वत्/धर्मवैज्ञानिक उपाधि के रूप में प्रस्तुत किया गया है; स्रोत-भाषा समीक्षा लंबित होने के कारण फुटनोट में अनिश्चितता स्पष्ट की गई है।
- source_word: his hearers
  choice: उनके शिष्य
  rationale: शाब्दिक “सुननेवाले” आधुनिक हिन्दी में अस्वाभाविक है; प्रसंग में यूहन्ना से प्रत्यक्ष शिक्षा पाने वालों का भाव है।
- source_word: flourished / became distinguished
  choice: प्रसिद्ध थे / प्रसिद्ध हुए
  rationale: ऐतिहासिक जीवनी-संबंधी प्रयोग का सहज हिन्दी रूप चुना गया है, बिना अतिरिक्त उपलब्धि या पद का अर्थ जोड़े।
- source_word: Asia
  choice: एशिया
  rationale: ऐतिहासिक भौगोलिक नाम सुरक्षित रखा गया है; संदर्भ सम्भवतः रोमी प्रांत का है, पर उपलब्ध साक्ष्य से आगे बढ़कर मुख्य पाठ में स्पष्टीकरण नहीं जोड़ा गया।
- source_word: bishop of the diocese
  choice: धर्मप्रांत के बिशप
  rationale: ऐतिहासिक कलीसियाई पद और उसके क्षेत्र को आधुनिक, व्यापक रूप से समझे जाने वाले शब्दों में व्यक्त किया गया है।
theological_decisions:
- issue: यूहन्ना की उपाधि “the Divine”
  choice: धर्मवेत्ता
  alternative: दिव्य यूहन्ना / ईश्वर-विज्ञानी यूहन्ना
  rationale: “दिव्य” यूहन्ना के स्वभाव के विषय में अनचाहा धर्मवैज्ञानिक दावा कर सकता है। “धर्मवेत्ता” उपाधि का कार्यात्मक अर्थ देता है, जबकि फुटनोट स्रोतगत अनिश्चितता बनाए रखता है।
- issue: पपियास और पोलिकार्प का यूहन्ना से संबंध
  choice: उनके शिष्य
  alternative: उनके सुननेवाले
  rationale: “hearers” प्रत्यक्ष शिक्षा ग्रहण करने का संकेत देता है; “शिष्य” स्वाभाविक हिन्दी है, किंतु इससे प्रेरितीय उत्तराधिकार के बारे में कोई विस्तृत सांप्रदायिक दावा नहीं जोड़ा गया।
- issue: खंड II के भ्रष्ट पाठ की पूर्ति
  choice: कोष्ठक में पाठ की भ्रष्टता/अपठनीयता बताना
  alternative: अंग्रेज़ी POB के संकेतों के आधार पर वाक्य की अनुमानित पुनर्रचना
  rationale: अनुमानित पूर्ति से पोलिकार्प की भूमिका या कलीसियाई अधिकार के विषय में ऐसे दावे जुड़ सकते थे जो उपलब्ध साक्ष्य में सुरक्षित नहीं हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली ऐतिहासिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नामों का हिन्दी लिप्यंतरण प्रचलित कलीसियाई रूपों के निकट है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; यूनानी/लातीनी स्रोत की प्रत्यक्ष समीक्षा लंबित है। भ्रष्ट अंश को न तो चुपचाप सुधारा गया है, न अनुमान से पूरा किया गया है।
