base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/001.yaml
  text: 'Irenaeus and others record that John the Divine and Apostle survived until the time of Trajan. After that, Papias of Hierapolis and Polycarp, bishop of Smyrna, his hearers, became well known.


    —Eusebius, Chronicon (Syncellus 655, 14), for Olympiad 220.


    II


    At this time Polycarp flourished in Asia. He was a disciple of the Apostles who [corrupt/illegible text concerning the church in Smyrna and “... ministers of the Lord”]. At the same time Papias, who was also bishop of the diocese of Hierapolis, became distinguished.


    —Eusebius, History of the Church 3.36.1–2.'
translation:
  language: hi
  text: '**पपियास के खंड — खंड 1**


    इरेनियस और अन्य लेखक बताते हैं कि धर्मवेत्ता और प्रेरित यूहन्ना[a] त्राजान के शासनकाल तक जीवित रहे। उसके बाद उनके शिष्य हिरापुलिस के पपियास और स्मुरना के बिशप पोलिकार्प प्रसिद्ध हुए।


    —यूसेबियस, *कालक्रम* (सिंकेल्लुस 655, 14), 220वाँ ओलंपियाड


    **II**


    उस समय एशिया में पोलिकार्प प्रसिद्ध थे। वे प्रेरितों के शिष्य थे, जिन्होंने [यहाँ स्मुरना की कलीसिया और “… प्रभु के सेवकों” से संबंधित पाठ भ्रष्ट अथवा अपठनीय है][b]। उसी समय पपियास भी प्रसिद्ध हुए, जो हिरापुलिस के धर्मप्रांत के बिशप थे।


    —यूसेबियस, *कलीसिया का इतिहास* 3.36.1–2


    [a] “धर्मवेत्ता” उस उपाधि का अनुवाद है जिसे उपलब्ध अंग्रेज़ी साक्ष्य में “the Divine” कहा गया है; मूल यूनानी/लातीनी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।


    [b] उपलब्ध साक्ष्य का यह अंश अत्यंत विकृत है, इसलिए लुप्त कथन का अनुमान लगाकर उसे पूरा नहीं किया गया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “धर्मवेत्ता” उस उपाधि का अनुवाद है जिसे उपलब्ध अंग्रेज़ी साक्ष्य में “the Divine” कहा गया है; मूल यूनानी/लातीनी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: उपाधि के अर्थ और लंबित स्रोत-भाषा समीक्षा को पारदर्शी बनाना।
  - marker: b
