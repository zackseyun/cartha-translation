base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/006.yaml
  text: 'Irenzeus, a disciple of Papias who was a hearer of John the Eva[...], relates.


    —Jerome, To Theodora, Letter 75 (29), chapter 3.'
translation:
  language: hi
  text: 'पपियास का शिष्य इरेनियस, जो यूहन्ना ‘एवा…’ का श्रोता था, बताता है।[a]


    —हिएरोनिमुस, *थियोदोरा के नाम पत्र*, पत्र 75 (29), अध्याय 3'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “John the Eva” के बाद पाठ अधूरा है। इसका अनुमान लगाकर “सुसमाचार लेखक” या कोई दूसरी उपाधि नहीं जोड़ी गई है। इस साक्ष्य के यूनानी/लैटिन स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: खंडित पाठ और स्रोत-समीक्षा की सीमा को पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: Irenzeus
  choice: इरेनियस
  rationale: अंग्रेज़ी साक्ष्य में नाम का रूप त्रुटिपूर्ण/असामान्य है; ऐतिहासिक व्यक्ति के प्रचलित मानकीकृत हिन्दी नाम का प्रयोग किया गया है।
- source_word: disciple
  choice: शिष्य
  rationale: गुरु से शिक्षा और परंपरा ग्रहण करने वाले व्यक्ति के अर्थ को स्वाभाविक तथा औपचारिक हिन्दी में व्यक्त करता है।
- source_word: hearer
  choice: श्रोता
  rationale: उपलब्ध साक्ष्य में दिए प्रत्यक्ष संबंध को बनाए रखता है और उसे अधिक विशिष्ट शिष्यत्व में नहीं बदलता।
- source_word: relates
  choice: बताता है
  rationale: उद्धृत लेखक द्वारा किसी बात का वृत्तांत देने का सहज आधुनिक हिन्दी रूप।
- source_word: John the Eva
  choice: यूहन्ना ‘एवा…’
  rationale: साक्ष्य में अभिव्यक्ति अधूरी है; ‘Eva’ को अनुमान से ‘Evangelist’ आदि पूरा किए बिना लिप्यंतरित और दीर्घविराम से अपूर्णता सूचित की गई है।
theological_decisions:
- issue: ‘John the Eva’ की पहचान और उपाधि
  choice: यूहन्ना ‘एवा…’
  alternative: यूहन्ना सुसमाचार लेखक / यूहन्ना प्रचारक
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य स्वयं इसी स्थान पर कट जाता है और यूनानी/लैटिन मूल की प्रत्यक्ष समीक्षा लंबित है; किसी विशिष्ट यूहन्ना या पूर्ण उपाधि का अनुमान पाठ की वास्तविक अनिश्चितता मिटा देता।
- issue: ‘who was a hearer of John’ का संबंध
  choice: व्याकरणानुसार इरेनियस को यूहन्ना का श्रोता रखा गया
  alternative: पपियास को यूहन्ना का श्रोता मानना
  rationale: प्रस्तुत साक्ष्य का निकटतम व्याकरणिक संबंध ‘Irenaeus’ से है। संभावित ऐतिहासिक या पाठगत कठिनाई को चुपचाप सुधारने के बजाय पादटिप्पणी में स्रोत की अनिश्चितता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण गद्य। ऐतिहासिक नामों के लिए प्रचलित हिन्दी रूप ‘इरेनियस’, ‘यूहन्ना’ और ‘हिएरोनिमुस’ अपनाए गए हैं। उद्धरण की खंडित अवस्था को मुख्य पाठ और पादटिप्पणी दोनों में स्पष्ट रखा गया है।
