review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly makes Irenaeus the hearer of John. In the supplied witness, the relative clause "who was a hearer of John the Eva[...]" modifies Papias ("Papias who was..."), not Irenaeus. The incomplete designation after "Eva" must remain incomplete.
  naturalness: The Hindi is generally concise and dignified, but the current word order creates the same incorrect attachment found in the interpretive note. Recasting the apposition makes Papias's role explicit while retaining the fragmentary wording.
  terminology: इरेनियस, पपियास, and यूहन्ना are suitable standard Hindi forms. "श्रोता" appropriately renders "hearer" without upgrading the relationship to discipleship. "वर्णन करता है" is a natural formal rendering of "relates."
  issues:
  - severity: high
    issue: The main text assigns "यूहन्ना ‘एवा…’ का श्रोता" to Irenaeus.
    rationale: The English witness reads "Irenzeus, a disciple of Papias who was a hearer of John..."; grammatically, "who was a hearer" qualifies Papias. The supplied draft's theological decision explicitly adopts the opposite antecedent, changing the witness's stated relationship.
  - severity: medium
    issue: The explanatory material says that the grammar makes Irenaeus John's hearer.
    rationale: This is contrary to the supplied witness and should not be retained. The footnote should limit itself to the genuinely incomplete designation and pending direct source-language review.
  revised_text: 'इरेनियस, पपियास का शिष्य—जो यूहन्ना ‘एवा…’ का श्रोता था—वर्णन करता है।[a]


    —हिएरोनिमुस, *थियोदोरा को पत्र*, पत्र 75 (29), अध्याय 3'
  revised_footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “John the Eva” के बाद पाठ अधूरा है। इसका अनुमान लगाकर “सुसमाचार लेखक” या कोई दूसरी उपाधि नहीं जोड़ी गई है। इस साक्ष्य के यूनानी/लैटिन स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: खंडित पद को बिना अनुमानित विस्तार के सुरक्षित रखना और स्रोत-समीक्षा की सीमा स्पष्ट करना आवश्यक है।
  revision_rationale: संशोधन पपियास को यूहन्ना ‘एवा…’ का श्रोता ठहराता है, जैसा उपलब्ध अंग्रेज़ी साक्ष्य की व्याकरणिक रचना में है। डैशों के भीतर का संबंधवाचक उपवाक्य हिंदी में भी स्पष्ट रूप से पपियास से जुड़ता है। अधूरे “Eva” को न तो पूरा किया गया है और न किसी विशिष्ट उपाधि अथवा पहचान में बदला गया है।
