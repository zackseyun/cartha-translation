base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/005.yaml
  text: 'Papias, a hearer of John, (and) bishop of Hierapolis in Asia, wrote only five books, which he entitled An Exposition of Discourses of the Lord. Wherein, when he asserts in his preface that he is not following pro-[m]iscuous statements, but has the Apostles as his authorities, he says:


    “I used to inquire what had been said by Andrew, or by [Pe]ter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion [a]nd the Elder John, the disciples of the Lord, were saying. [F]or books to read do not profit me so much as the living [v]oice clearly sounding up to the present day in (the persons of) authors.”


    From which it is clear that in his list of names itself there is one John who is reckoned among the Apostles, and another, the Elder John, whom he enumerates after Aristion. We have mentioned this fact on account of the statement made above, which we have recorded on the authority of very — many, that the two later epistles of John are not (the work) of the Apostle, but of the Elder. This (Papias) is said to have promulgated the Jewish tradition of a Millennium, and he is followed by Irenaeus, Apollinarius, and the others, who say that after the resurrection the Lord will reign in the flesh with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    Further, a false rumour has reached me that the books of Josephus and the writings of Papias and Polycarp have been translated by me; but I have neither leisure nor strength to render such works as these with corresponding elegance into another tongue.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
translation:
  language: hi
  text: '**पपियास के अंश — अंश VII**


    यूहन्ना का श्रोता और एशिया के हिरापोलिस का बिशप पपियास केवल पाँच पुस्तकें लिख गया। उसने उनका शीर्षक *प्रभु के वचनों की व्याख्या* रखा। उनकी भूमिका में वह यह कहते हुए कि वह तरह-तरह की बातों के पीछे नहीं चलता, बल्कि प्रेरितों को अपना प्रामाणिक स्रोत मानता है, लिखता है:


    “मैं पूछा करता था कि अन्द्रियास ने क्या कहा था, या पतरस ने, या फिलिप्पुस ने, या थोमा अथवा याकूब ने, या यूहन्ना अथवा मत्ती ने, या प्रभु के किसी और शिष्य ने; और यह भी कि प्रभु के शिष्य अरिस्तियोन और प्राचीन यूहन्ना क्या कह रहे थे। क्योंकि पढ़ने के लिए उपलब्ध पुस्तकों से मुझे उतना लाभ नहीं होता, जितना उस जीवित वाणी से, जो अपने वक्ताओं में आज तक साफ़ सुनाई देती है।”[a]


    इससे स्पष्ट है कि नामों की उसकी सूची में ही एक यूहन्ना वह है जिसकी गिनती प्रेरितों में होती है, और दूसरा प्राचीन यूहन्ना है, जिसका उल्लेख वह अरिस्तियोन के बाद करता है। हमने इस तथ्य का उल्लेख ऊपर कही गई उस बात के कारण किया है जिसे हमने बहुत-से लोगों के प्रमाण पर दर्ज किया है—कि यूहन्ना की बाद की दो पत्रियाँ प्रेरित की रचनाएँ नहीं, बल्कि उस प्राचीन की रचनाएँ हैं। कहा जाता है कि इसी पपियास ने सहस्राब्दी की यहूदी परंपरा का प्रचार किया था। इरेनियस, अपोलिनारिस और अन्य लोग भी उसके मत का अनुसरण करते हैं; वे कहते हैं कि पुनरुत्थान के बाद प्रभु संतों के साथ देह में राज्य करेगा।[b]


    —हिएरोनिमुस, *प्रसिद्ध व्यक्तियों के विषय में* 18


    **VIII**


    इसके अतिरिक्त, मुझ तक यह झूठी अफ़वाह पहुँची है कि मैंने योसेफुस की पुस्तकों तथा पपियास और पोलिकार्प की रचनाओं का अनुवाद किया है। पर मेरे पास न इतना अवकाश है, न सामर्थ्य, कि ऐसी रचनाओं को उसी के अनुरूप लालित्य के साथ दूसरी भाषा में प्रस्तुत कर सकूँ।


    —हिएरोनिमुस, *लूकिनियुस को पत्र*, पत्र 71 (28), अध्याय 5


    [a] “अपने वक्ताओं में” उपलब्ध अंग्रेज़ी साक्ष्य के “in (the persons of) authors” का अस्थायी अनुवाद है। आशय उन जीवित व्यक्तियों से है जिनके द्वारा वाणी सुनाई देती थी; मूल यूनानी/लातीनी पाठ की प्रत्यक्ष समीक्षा अभी अपेक्षित है।


    [b] “देह में” कथन की सहस्राब्दी-संबंधी भौतिकता को ज्यों का त्यों रखता है; इसे न तो “शारीरिक रूप से” कहकर अधिक कठोर बनाया गया है, न “प्रत्यक्ष रूप से” कहकर नरम।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने वक्ताओं में” उपलब्ध अंग्रेज़ी साक्ष्य के “in (the persons of) authors” का अस्थायी अनुवाद है। आशय उन जीवित व्यक्तियों से है जिनके द्वारा वाणी सुनाई देती थी; मूल यूनानी/लातीनी पाठ की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: आधार-पाठ OCR-क्षतिग्रस्त अंग्रेज़ी साक्ष्य है और इस वाक्यांश की प्रत्यक्ष स्रोत-भाषा जाँच लंबित है।
  - marker: b
    text: “देह में” कथन की सहस्राब्दी-संबंधी भौतिकता को ज्यों का त्यों रखता है; इसे न तो “शारीरिक रूप से” कहकर अधिक कठोर बनाया गया है, न “प्रत्यक्ष रूप से” कहकर नरम।
    reason: धर्मवैज्ञानिक तनाव और मूल कथन की सीमा बनाए रखने के लिए।
lexical_decisions:
- source_word: auditor / hearer
  choice: श्रोता
  rationale: यह शिष्यत्व या प्रत्यक्ष व्यक्तिगत संबंध को आवश्यकता से अधिक निश्चित किए बिना सुनने वाले का मूल अर्थ रखता है।
- source_word: Expositio sermonum Domini / An Exposition of Discourses of the Lord
  choice: प्रभु के वचनों की व्याख्या
  rationale: ‘sermones/discourses’ के लिए स्वाभाविक और गरिमापूर्ण हिन्दी; इसे केवल औपचारिक ‘उपदेशों’ तक सीमित नहीं करता।
- source_word: apostolos habere auctores / has the Apostles as his authorities
  choice: प्रेरितों को अपना प्रामाणिक स्रोत मानता है
  rationale: ‘authorities’ में निहित प्रमाण और स्रोत—दोनों भावों को रखता है, जबकि आधुनिक हिन्दी में कृत्रिम ‘प्राधिकारी’ से बचता है।
- source_word: senior Joannes / the Elder John
  choice: प्राचीन यूहन्ना
  rationale: यह पदनाम और आयु/वरिष्ठता की संभावित अस्पष्टता बनाए रखता है; ‘प्रेस्बिटर’ या कलीसियाई पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: viva vox
  choice: जीवित वाणी
  rationale: प्रसिद्ध मौखिक-साक्ष्य सूत्र का औपचारिक निकट अनुवाद है और लिखित पुस्तकों के साथ विरोध को बनाए रखता है।
- source_word: Millennium
  choice: सहस्राब्दी
  rationale: हज़ार वर्ष की अवधि के लिए प्रचलित, संक्षिप्त धार्मिक-ऐतिहासिक शब्द है।
- source_word: in carne
  choice: देह में
  rationale: लातीनी कथन की भौतिक/देहधारी धारणा को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: corresponding elegance
  choice: उसी के अनुरूप लालित्य
  rationale: मूल रचनाओं के शैलीगत स्तर के अनुरूप दूसरी भाषा में प्रस्तुति का भाव देता है।
theological_decisions:
- issue: दो यूहन्नाओं की पहचान
  choice: पहले को प्रेरितों में गिना गया और दूसरे को ‘प्राचीन यूहन्ना’ कहा गया
  alternative: दोनों को एक ही यूहन्ना मानना, या दूसरे को निश्चित रूप से कलीसियाई ‘प्रेस्बिटर’ कहना
  rationale: साक्ष्य में लेखक का तर्क दो व्यक्तियों का है; अनुवाद इस दावे को प्रस्तुत करता है, पर पदनाम से आगे उनकी पहचान तय नहीं करता।
- issue: यूहन्ना की बाद की दो पत्रियों का लेखकत्व
  choice: साक्ष्य के दावे को ‘प्रेरित’ और ‘उस प्राचीन’ के बीच भेद के रूप में रखा
  alternative: इन पत्रियों को आधुनिक कैनोनिक नाम देकर 2 और 3 यूहन्ना के रूप में स्पष्ट करना
  rationale: मूल कथन ‘बाद की दो पत्रियाँ’ कहता है; आधुनिक पहचान जोड़ना संपादकीय निष्कर्ष होता।
- issue: सहस्राब्दी और देह में राज्य
  choice: ‘सहस्राब्दी की यहूदी परंपरा’ और ‘देह में राज्य करेगा’
  alternative: किसी विशिष्ट आधुनिक सहस्राब्दीवादी प्रणाली की शब्दावली
  rationale: ऐतिहासिक गवाह की भाषा और तनाव को रखा गया है, बिना आधुनिक सांप्रदायिक ढाँचा आरोपित किए।
- issue: Papias के कथन में कालभेद
  choice: पहले शिष्यों के लिए ‘क्या कहा था’ और अरिस्तियोन/प्राचीन यूहन्ना के लिए ‘क्या कह रहे थे’
  alternative: दोनों समूहों के लिए समान भूतकाल
  rationale: उपलब्ध साक्ष्य के had said / were saying भेद को सुरक्षित रखता है, जो जीवित और पूर्ववर्ती स्रोतों के बीच संभावित अंतर दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; ऐतिहासिक-धर्मग्रंथीय किंतु साधारण पाठक के लिए सुबोध शैली। व्यक्तिनामों में प्रचलित हिन्दी मसीही रूप (यूहन्ना, पतरस, मत्ती) और अन्य प्राचीन नामों के निकट लिप्यंतरण अपनाए गए हैं। कोष्ठकीय संपादकीय अनिश्चितता को जहाँ संभव था प्राकृतिक वाक्य में व्यक्त किया गया; स्रोत-भाषा समीक्षा लंबित होने की सीमा फुटनोट में स्पष्ट है।
