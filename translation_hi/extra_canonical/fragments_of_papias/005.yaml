  revised_text: '**पपियास के अंश — अंश VII**


    यूहन्ना का श्रोता और एशिया के हिरापोलिस का बिशप पपियास ने केवल पाँच पुस्तकें लिखीं, जिनका उसने शीर्षक *प्रभु के वचनों की व्याख्या* रखा। उनमें, अपनी भूमिका में वह यह कहते हुए कि वह बिना छाँटी हुई बातों के पीछे नहीं चलता, बल्कि प्रेरितों को अपना प्रामाणिक स्रोत मानता है, कहता है:


    “मैं पूछा करता था कि अन्द्रियास ने क्या कहा था, या पतरस ने, या फिलिप्पुस ने, या थोमा अथवा याकूब ने, या यूहन्ना अथवा मत्ती ने, या प्रभु के किसी और शिष्य ने; और यह भी कि प्रभु के शिष्य अरिस्तियोन और प्राचीन यूहन्ना क्या कह रहे थे। क्योंकि पढ़ने के लिए उपलब्ध पुस्तकों से मुझे उतना लाभ नहीं होता, जितना उस जीवित वाणी से, जो अपने जीवित स्रोतों में आज तक स्पष्ट सुनाई देती है।”[a]


    इससे स्पष्ट है कि नामों की उसकी सूची में ही एक यूहन्ना वह है जिसकी गिनती प्रेरितों में होती है, और दूसरा प्राचीन यूहन्ना है, जिसका उल्लेख वह अरिस्तियोन के बाद करता है। हमने इस तथ्य का उल्लेख ऊपर कही गई उस बात के कारण किया है जिसे हमने बहुत-से लोगों के प्रमाण पर दर्ज किया है—कि यूहन्ना की बाद की दो पत्रियाँ प्रेरित की रचनाएँ नहीं, बल्कि उस प्राचीन की रचनाएँ हैं। कहा जाता है कि इसी पपियास ने सहस्राब्दी की यहूदी परंपरा का प्रचार किया था। इरेनियस, अपोलिनारिस और अन्य लोग भी उसके मत का अनुसरण करते हैं; वे कहते हैं कि पुनरुत्थान के बाद प्रभु संतों के साथ देह में राज्य करेगा।[b]


    —हिएरोनिमुस, *प्रसिद्ध व्यक्तियों के विषय में* 18


    **VIII**


    इसके अतिरिक्त, मुझ तक यह झूठी अफ़वाह पहुँची है कि मैंने योसेफुस की पुस्तकों तथा पपियास और पोलिकार्प की रचनाओं का अनुवाद किया है। पर मेरे पास न इतना अवकाश है, न सामर्थ्य, कि ऐसी रचनाओं को उनके अनुरूप लालित्य के साथ दूसरी भाषा में प्रस्तुत कर सकूँ।


    —हिएरोनिमुस, *लूकिनियुस को पत्र*, पत्र 71 (28), अध्याय 5


    [a] “अपने जीवित स्रोतों में” उपलब्ध अंग्रेज़ी साक्ष्य के “in (the persons of) authors” का अस्थायी अनुवाद है। कोष्ठक और साक्ष्य की पाठगत स्थिति के कारण इसका सटीक आशय—जीवित व्यक्तियों, प्रत्यक्ष साक्षियों, या स्रोतों की ओर संकेत—प्रत्यक्ष मूल यूनानी/लातीनी पाठ की समीक्षा तक अनिश्चित है।


    [b] “देह में” कथन की सहस्राब्दी-संबंधी भौतिकता को ज्यों का त्यों रखता है; इसे न तो “शारीरिक रूप से” कहकर अधिक कठोर बनाया गया है, न “प्रत्यक्ष रूप से” कहकर नरम।'
