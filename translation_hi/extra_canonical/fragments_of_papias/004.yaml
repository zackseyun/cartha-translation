  revised_text: 'पाँचवाँ खंड


    हियरापोलिस के बिशप पापियास, जो धर्मवेत्ता यूहन्ना के शिष्य और पोलिकार्प के साथी थे, ने प्रभु के वचनों पर पाँच पुस्तकें लिखीं। प्रेरितों की सूची देते समय पतरस और यूहन्ना, फिलिप्पुस, थोमा और मत्ती के बाद, उन्होंने प्रभु के शिष्यों में अरिस्तियोन और एक दूसरे यूहन्ना को भी शामिल किया, जिसे उन्होंने “प्राचीन” भी कहा। [वह कहता है] कि कुछ लोगों का विचार है कि यूहन्ना के नाम से प्रचलित दो छोटी और सार्वत्रिक पत्रियों का लेखक यही यूहन्ना है; और वह इसका कारण यह बताता है कि आरंभिक धर्मपिता केवल पहली पत्री को स्वीकार करते हैं। कुछ लोगों ने भूल से प्रकाशितवाक्य को भी उसी का—अर्थात प्राचीन यूहन्ना का—ग्रंथ माना है। सहस्राब्दी के विषय में पापियास भी भूल करता है, और उसी के कारण इरेनियुस भी भूल करता है।


    पापियास अपनी दूसरी पुस्तक में कहता है कि धर्मवेत्ता यूहन्ना और उसके भाई याकूब यहूदियों के हाथों मारे गए। उपर्युक्त पापियास ने फिलिप्पुस की बेटियों के प्रमाण पर बताया कि बरसब्बास, जो यूस्तुस भी कहलाता है, ने अविश्वासियों की चुनौती पर प्रभु के नाम में साँप का विष पी लिया और हर प्रकार की हानि से सुरक्षित रहा। वह और भी कई अद्भुत बातें बताता है, विशेष रूप से मनाइम की माता के विषय में, जिसे मरे हुओं में से जिलाया गया था। और जिन्हें मसीह ने मरे हुओं में से जिलाया था, उनके विषय में [वह कहता है] कि वे सम्राट हद्रियान के समय तक जीवित रहे।


    — साइड का फिलिप्पुस (?) अफिस्ट. क्राइस्ट.¹


    छठा खंड


    दोमितियान के बाद नेरवा ने एक वर्ष राज्य किया। उसने यूहन्ना को द्वीप, अर्थात पतमुस, से वापस बुलाया और उसे इफिसुस में रहने की अनुमति दी। उस समय वह बारह प्रेरितों में अकेला जीवित बचा था और अपना सुसमाचार लिखने के बाद उसे शहीद होने का सम्मान मिला। क्योंकि हियरापोलिस का बिशप पापियास, जिसने उसे अपनी आँखों से देखा था, प्रभु के वचनों की दूसरी पुस्तक में कहता है कि वह यहूदियों के हाथों मारा गया। इस प्रकार उसने अपने भाई के साथ उनके विषय में मसीह की भविष्यवाणी और उनकी अपनी स्वीकृति तथा उसके लिए की गई प्रतिज्ञा स्पष्ट रूप से पूरी की। क्योंकि जब प्रभु ने उनसे कहा, “क्या तुम वह प्याला पी सकते हो जो मैं पीता हूँ?” तो उन्होंने तुरंत हामी भरकर स्वीकार किया। तब उसने कहा, “मेरा प्याला तुम पियोगे, और जिस बपतिस्मे से मेरा बपतिस्मा हो रहा है, उसी से तुम भी बपतिस्मा पाओगे।” और यह उचित ही है, क्योंकि परमेश्वर के लिए झूठ बोलना असंभव है। इसी प्रकार विद्वान ओरिगेन भी मत्ती के सुसमाचार की अपनी व्याख्या में इस बात की पुष्टि करता है कि यूहन्ना शहीद हुआ था; वह कहता है कि उसने यह बात प्रेरितों के उत्तराधिकारियों से
    जानी थी। और सुविज्ञ यूसेबियुस भी अपने कलीसियाई इतिहास में कहता है, “चिट्ठी डालने पर थोमा को पार्थिया मिला, पर यूहन्ना को आसिया मिला; वहीं उसने निवास किया और इफिसुस में उसकी मृत्यु हुई।”


    — जॉर्जियुस हमार्तोलुस, कालक्रम'
