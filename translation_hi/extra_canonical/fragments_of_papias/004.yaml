  text: 'Papias, bishop of Hierapolis, who was a disciple of John the Divine [and] a companion of Polycarp, wrote five books of Oracles of the Lord, [and] when giving a list of the apostles, after Peter and John, Philip and Thoma[s], and Matthew, he included among the disciples of the Lord Aristion [and] a second John, whom also he called “the Elder.” [He says] that some [think] that this John is the author of the two short and catholic epistles, [which] are published in the name of John; and he gives as the reason that the primitive (fathers) only accept the first epistle. Some too have wrong[ly] considered the Apocalypse also to be his—that is, the Elder John’s—[work]. Papias too is in error about the Millennium, and from him Iren[aeus] also [erred].


    Papias in his second book says that John the Divine and James his broth[er] were killed by the Jews. The aforesaid Papias stated on the authority of the daughters of Philip that Barsabas, who is also called Justus, when challenged by the unbelievers drank serpent’s poison in the name of the Lord, and was shielded from all harm. He makes also other marvellous statements, and particularly about the mother of Manaim who was raised from the dead. As for those who were raised from the dead by Christ, [he states] that they survived till the time of Hadrian.


    PHILIPPUS OF SIDE (?) Afist. Christ.


    VI.


    After Domitian Nerva reigned one year, who recalled John from the [i]sland (i.e. Patmos), and allowed him to dwell in Ephesus. He was at that time the sole survivor of the twelve apostles, and after writing his Gospel received the honour of martyrdom. For Papias, bishop of Hierapolis, who was an eye-witness of him, in the second book of the Oracles of the Lord says that he was killed by the Jews, and thereby evidently fulfilled, together with his brother, Christ’s prophecy concerning them, and their own confession and undertaking on His behalf. For when the Lord said to them, “Are ye able to drink of the cup that I drink of?” and they readily assented and agreed, He said, “My cup shall ye drink, and with the baptism that I am [ba]ptized [with] shall ye be baptized.” And reasonably so, for it is impossible for God to lie. So too the learned Origen affirms in his interpretation of S. Matthew’s Gospel that John was martyred, declaring that he had learnt the fact from the successors of the
    apostles. And indeed the well-informed Eusebius also in his Ecclesiastical History says: “Thomas received by lot Parthia, but John [received] Asia, where also he made his residence and died at [E]phesus[?].”


    GEORGIUS HAMARTOLUS, Chronicon.'
translation:
  language: hi
  text: 'पाँचवाँ खंड


    हियरापोलिस के बिशप पापियास, जो धर्मवेत्ता यूहन्ना के शिष्य और पोलिकार्प के साथी थे, ने प्रभु के वचनों पर पाँच पुस्तकें लिखीं। प्रेरितों की सूची देते समय पतरस और यूहन्ना, फिलिप्पुस, थोमा और मत्ती के बाद उन्होंने प्रभु के शिष्यों में अरिस्तियोन और एक दूसरे यूहन्ना को भी रखा, जिसे उन्होंने “प्राचीन” भी कहा। [वह कहता है] कि कुछ लोगों का विचार है कि यूहन्ना के नाम से प्रचलित दो छोटी और सार्वत्रिक पत्रियों का लेखक यही यूहन्ना है; और वह इसका कारण यह बताता है कि आरंभिक धर्मपिता केवल पहली पत्री को स्वीकार करते हैं। कुछ लोगों ने भूल से प्रकाशितवाक्य को भी उसी का—अर्थात प्राचीन यूहन्ना का—ग्रंथ माना है। सहस्राब्दी के विषय में पापियास भी भूल करता है, और उसी के कारण इरेनियुस भी।


    पापियास अपनी दूसरी पुस्तक में कहता है कि धर्मवेत्ता यूहन्ना और उसका भाई याकूब यहूदियों के हाथों मारे गए। उपर्युक्त पापियास ने फिलिप्पुस की बेटियों के प्रमाण पर बताया कि बरसब्बा, जो यूस्तुस भी कहलाता है, ने अविश्वासियों की चुनौती पर प्रभु के नाम में साँप का विष पी लिया और हर प्रकार की हानि से सुरक्षित रहा। वह और भी कई अद्भुत बातें बताता है, विशेष रूप से मनाइम की माता के विषय में, जिसे मरे हुओं में से जिलाया गया था। और जिन्हें मसीह ने मरे हुओं में से जिलाया था, उनके विषय में [वह कहता है] कि वे सम्राट हद्रियान के समय तक जीवित रहे।


    — साइड का फिलिप्पुस (?) इतिहास मसीही


    छठा खंड


    दोमितियान के बाद नेरवा ने एक वर्ष राज्य किया। उसने यूहन्ना को द्वीप, अर्थात पतमुस, से वापस बुलाया और उसे इफिसुस में रहने की अनुमति दी। उस समय वह बारह प्रेरितों में अकेला जीवित बचा था और अपना सुसमाचार लिखने के बाद उसे शहीद होने का सम्मान मिला। क्योंकि हियरापोलिस का बिशप पापियास, जिसने उसे अपनी आँखों से देखा था, प्रभु के वचनों की दूसरी पुस्तक में कहता है कि वह यहूदियों के हाथों मारा गया। इस प्रकार उसने अपने भाई के साथ उनके विषय में मसीह की भविष्यवाणी और उनकी अपनी स्वीकृति तथा उसके लिए किया गया संकल्प स्पष्ट रूप से पूरा किया। क्योंकि जब प्रभु ने उनसे कहा, “क्या तुम वह प्याला पी सकते हो जो मैं पीता हूँ?” तो उन्होंने तुरंत हामी भरकर स्वीकार किया। तब उसने कहा, “मेरा प्याला तुम पियोगे, और जिस बपतिस्मे से मैं बपतिस्मा लेता हूँ, उसी से तुम भी बपतिस्मा लोगे।” और यह उचित ही है, क्योंकि परमेश्वर के लिए झूठ बोलना असंभव है। इसी प्रकार विद्वान ओरिगेन भी मत्ती के सुसमाचार की अपनी व्याख्या में इस बात की पुष्टि करता है कि यूहन्ना शहीद हुआ था; वह कहता है कि उसने यह बात प्रेरितों के उत्तराधिकारियों से जानी
    थी। और सुविज्ञ यूसेबियुस भी अपने कलीसियाई इतिहास में कहता है, “चिट्ठी डालने पर थोमा को पार्थिया मिला, पर यूहन्ना को आसिया मिला; वहीं उसने निवास किया और इफिसुस में उसकी मृत्यु हुई।”


    — जॉर्जियुस हमार्तोलुस, कालक्रम'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Oracles of the Lord
  choice: प्रभु के वचनों
  rationale: ‘Oracles’ का यहाँ अर्थ प्रभु से संबद्ध कथनों/वचनों का संग्रह है; ‘दैववाणी’ आधुनिक पाठक के लिए भ्रामक हो सकता है।
- source_word: John the Divine
  choice: धर्मवेत्ता यूहन्ना
  rationale: उत्तरकालीन उपाधि का अर्थ धर्मशास्त्रीय ज्ञाता/वक्ता है; ‘दिव्य यूहन्ना’ अस्वाभाविक और अर्थभ्रमकारी होता।
- source_word: the Elder
  choice: प्राचीन
  rationale: यूहन्ना की विशिष्ट पारंपरिक उपाधि को गरिमापूर्ण ढंग से रखा गया; इसका अर्थ केवल पदाधिकारी ‘प्राचीन’ भी हो सकता है।
- source_word: catholic Epistles
  choice: सार्वत्रिक पत्रियाँ
  rationale: यहाँ ‘catholic’ का अर्थ सार्वभौमिक/सामान्य प्रसार वाली पत्रियाँ है, किसी आधुनिक संप्रदाय का नाम नहीं।
- source_word: Millennium
  choice: सहस्राब्दी
  rationale: हज़ार वर्ष संबंधी मत के लिए स्थापित और संक्षिप्त हिन्दी पद।
- source_word: received by lot
  choice: चिट्ठी डालने पर ... मिला
  rationale: प्रेरितों के कार्यक्षेत्र के चिट्ठी द्वारा निर्धारित होने का आशय स्पष्ट करता है।
theological_decisions:
- issue: प्रकाशितवाक्य और दो छोटी पत्रियों का लेखक
  choice: वृत्तांत में दिए गए मत को ‘कुछ लोगों का विचार’ और ‘भूल से’ जैसे स्रोतगत दावों के रूप में रखा
  alternative: इन ग्रंथों के लेखक की पहचान निश्चित रूप से घोषित करना
  rationale: खंड स्वयं परस्पर प्राचीन मतों की सूचना देता है; अनुवाद को लेखकत्व-विवाद का स्वतंत्र निर्णय नहीं करना चाहिए।
- issue: सहस्राब्दी पर पापियास और इरेनियुस की कथित भूल
  choice: लेखक का मूल्यांकन सीधे अनूदित किया
  alternative: टिप्पणी को नरम करना या हटाना
  rationale: यह साक्षी के धर्मवैचारिक दृष्टिकोण का अभिन्न भाग है, अनुवादक का अनुमोदन नहीं।
- issue: यूहन्ना की शहादत
  choice: खंड के दावे को ऐतिहासिक वृत्तांत के रूप में रखा, बिना अन्य परंपराओं से सामंजस्य किए
  alternative: इफिसुस में स्वाभाविक मृत्यु की परंपरा के अनुसार संशोधन
  rationale: स्रोत में मौजूद तनाव को सुरक्षित रखना आवश्यक है।
- issue: मसीह द्वारा जिलाए गए लोगों का हद्रियान तक जीवित रहना
  choice: पापियास को आरोपित कथन के रूप में रखा
  alternative: तथ्यात्मक पुष्टि की भाषा
  rationale: अप्रत्यक्ष रिपोर्ट और उसकी सीमित प्रमाणिकता को व्याकरण में बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। उपलब्ध आधार क्षतिग्रस्त/OCR-प्रभावित सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; यूनानी/लातीनी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण स्पष्ट रिक्तियों को अंग्रेज़ी POB की सावधान पुनर्स्थापनाओं के अनुसार अर्थगत रूप से पूरा किया गया है। मूल साक्षी में संलग्न छठा खंड भी शामिल है। किसी पादटिप्पणी का प्रयोग नहीं किया गया, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
