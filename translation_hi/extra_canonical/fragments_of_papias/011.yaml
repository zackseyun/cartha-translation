base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/011.yaml
  text: 'The blessing thus foretold belongs undoubtedly to the times of the Kingdom, when the righteous shall rise from the dead and reign, when too creation, renewed and freed from bondage, shall produce a wealth of food of all kinds from the dew of heaven and from the fatness of the earth; as the elders, who saw John the disciple of the Lord, relate that they had heard from him how the Lord used to teach concerning those times, and to say:


    “The days will come, in which vines shall grow, each having ten thousand shoots, and on each shoot ten thousand branches, and on each branch again ten thousand twigs, and on each twig ten thousand clusters, and on each cluster ten thousand grapes; and each grape, when pressed, shall yield five-and-twenty measures of wine. And when any of the saints shall have taken hold of [o]ne of their clusters, another shall cry, ‘I am a better cluster; take me, bless the Lord through me.’ Likewise also a grain of wheat shall produce ten thousand heads, and every head shall [h]ave ten thousand grains, and every grain ten pounds of fine [fl]our, bright and clean; and the other fruits, seeds, and grass shall produce in similar proportions. And all the animals, using these fruits which are products of the soil, shall become in their [t]urn peaceable and harmonious, obedient to man in all subjection.”


    “[These are the] things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesseth in writing in the fourth of his books, [for there] are five books composed by him.” And he added, saying:


    “But these things are credible to them that believe.”


    And when Judas the traitor did not believe, and asked, “How shall such growths be accomplished by the Lord?” he relates that the Lord said, “They shall see, who shall come to these (times).”


    Irenæus, Haer. v. 33. 3–4.'
translation:
  language: hi
  text: '**पपियास के खंड — खंड 14**


    इस प्रकार पहले से बताई गई आशीष[a] निस्संदेह राज्य के उस समय से संबंधित है, जब धर्मी मरे हुओं में से जी उठेंगे और राज करेंगे। उस समय सृष्टि भी नई की जाएगी और दासता से मुक्त होकर आकाश की ओस और धरती की भरपूर उपज से हर प्रकार की खाद्य-सामग्री बहुतायत में उत्पन्न करेगी। प्रभु के शिष्य यूहन्ना को देखने वाले प्राचीन अगुवों ने बताया कि उन्होंने यूहन्ना से सुना था कि प्रभु उन समयों के विषय में शिक्षा देते हुए कहा करते थे:


    “वे दिन आएँगे जब अंगूर की बेलें उगेंगी। हर बेल में दस हज़ार मुख्य डालियाँ होंगी, हर मुख्य डाली में दस हज़ार शाखाएँ, हर शाखा में दस हज़ार टहनियाँ, हर टहनी में दस हज़ार गुच्छे और हर गुच्छे में दस हज़ार अंगूर होंगे। हर अंगूर को निचोड़ने पर पच्चीस माप[b] दाखरस निकलेगा। जब पवित्र जनों में से कोई किसी गुच्छे को पकड़ेगा, तो दूसरा गुच्छा पुकारकर कहेगा, ‘मैं अधिक अच्छा गुच्छा हूँ; मुझे ले लो और मेरे द्वारा प्रभु को धन्य कहो।’ इसी प्रकार गेहूँ का एक दाना दस हज़ार बालें उत्पन्न करेगा, हर बाल में दस हज़ार दाने होंगे और हर दाने से दस पौंड उज्ज्वल और शुद्ध मैदा निकलेगा। दूसरे फल, बीज और घास भी इसी अनुपात में उपजेंगे। भूमि की इन उपजों को खाने वाले सभी पशु भी शांत और एक-दूसरे के साथ मेल से रहने वाले हो जाएँगे और पूरी अधीनता से मनुष्य की आज्ञा मानेंगे।”


    प्राचीन काल के सम्माननीय व्यक्ति पपियास—जो यूहन्ना के श्रोता और पोलिकार्प के साथी थे—अपनी पाँच पुस्तकों में से चौथी पुस्तक में इन बातों की लिखित गवाही देते हैं।[c] उन्होंने यह भी कहा:


    “जो विश्वास करते हैं, उनके लिए ये बातें विश्वासयोग्य हैं।”


    जब विश्वासघाती यहूदा ने विश्वास नहीं किया और पूछा, “प्रभु ऐसी उपज कैसे उत्पन्न करेंगे?” तब, पपियास के अनुसार, प्रभु ने कहा, “जो लोग उन समयों तक पहुँचेंगे, वे देखेंगे।”


    —इरेनियस, *मत-विरोध*, 5.33.3–4


    [a] “आशीष” उस आशीष की ओर संकेत करती है जिसका उल्लेख इरेनियस ने इस उद्धरण से पहले किया था।


    [b] प्राचीन माप की निश्चित मात्रा इस उपलब्ध अनुवाद-साक्ष्य में नहीं बताई गई है।


    [c] पपियास की इन पाँच पुस्तकों का पूरा पाठ अब उपलब्ध नहीं है; यह अंश इरेनियस की रचना में उद्धृत रूप में सुरक्षित है।'
  philosophy: optimal-equivalence
