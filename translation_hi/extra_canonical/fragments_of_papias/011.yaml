  rationale: मूल साक्ष्य के युगांत-संबंधी अर्थ को बनाए रखते हुए किसी विशिष्ट सहस्राब्दीवादी व्याख्या को पाठ में नहीं जोड़ा गया।
- source_word: fatness of the earth
  choice: धरती की भरपूर उपज
  rationale: शाब्दिक चित्र का कृषि-संबंधी आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: saints
  choice: पवित्र जन
  rationale: यहाँ विश्वासियों के समुदाय के लिए प्रयुक्त धार्मिक पद को सरल और संप्रदाय-निरपेक्ष रूप में रखा गया है।
- source_word: bless the Lord
  choice: प्रभु को धन्य कहो
  rationale: ‘आशीष देना’ से उत्पन्न होने वाली हिन्दी की अस्पष्टता से बचते हुए स्तुति/धन्य कहने का भाव सुरक्षित रखा गया।
- source_word: hearer of John
  choice: यूहन्ना के श्रोता
  rationale: ‘शिष्य’ या प्रत्यक्ष औपचारिक प्रशिक्षण का अतिरिक्त दावा किए बिना उपलब्ध साक्ष्य की अभिव्यक्ति संरक्षित की गई।
- source_word: measures
  choice: माप
  rationale: प्राचीन इकाई की पहचान उपलब्ध अंग्रेज़ी साक्ष्य में निश्चित नहीं है, इसलिए आधुनिक लीटर जैसी मात्रा आरोपित नहीं की गई।
theological_decisions:
- issue: राज्य के समय और पुनरुत्थान का संबंध
  choice: ठोस भविष्यकालीन भाषा को यथावत रखा गया
  alternative: इसे केवल आध्यात्मिक समृद्धि का रूपक बनाना
  rationale: साक्ष्य स्पष्ट रूप से धर्मियों के जी उठने, राज करने और सृष्टि के नवीकरण की बात करता है; अनिर्णीत व्याख्यात्मक प्रश्नों को अनुवाद ने नहीं सुलझाया।
- issue: असाधारण कृषि-समृद्धि का स्वरूप
  choice: वर्णन को प्रत्यक्ष कथन के रूप में अनूदित किया गया
  alternative: संख्याओं को ‘अत्यधिक बहुतायत’ कहकर सामान्य बनाना
  rationale: दस हज़ार और पच्चीस जैसी संख्याएँ परंपरा के कथित शब्दों का अभिन्न अंग हैं और उन्हें बनाए रखना आवश्यक है।
- issue: प्रभु को आरोपित कथन की ऐतिहासिक दूरी
  choice: ‘पपियास के अनुसार’ जोड़कर उद्धरण-श्रृंखला स्पष्ट की गई
  alternative: कथन को बिना मध्यस्थता सीधे यीशु का प्रमाणित वचन प्रस्तुत करना
  rationale: अंश में यह कथन प्राचीन अगुवों से यूहन्ना, फिर पपियास और इरेनियस के माध्यम से पहुँचा है; अनुवाद उस साक्ष्य-श्रृंखला को छिपाता नहीं।
- issue: यहूदा की अविश्वासपूर्ण प्रतिक्रिया
  choice: वर्णन को जैसा प्राप्त है वैसा रखा गया
  alternative: कालक्रम या धर्मशास्त्रीय कठिनाई के कारण इसे नरम करना या हटाना
  rationale: यह अंश की परंपरा का स्पष्ट भाग है; अनुवाद का कार्य उसे सुधारना नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। लम्बे मूल वाक्यों को अर्थ-संबंध सुरक्षित रखते हुए छोटे वाक्यों में बाँटा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी/लातीनी स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है। OCR की स्पष्ट त्रुटियों को अंग्रेज़ी POB के लेखापरीक्षित पाठ के अनुसार सुधारा गया है।
