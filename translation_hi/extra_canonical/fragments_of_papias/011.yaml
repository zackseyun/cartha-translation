  revised_text: '**पपियास के खंड — खंड 14**


    इस प्रकार पहले से बताई गई आशीष[a] निस्संदेह राज्य के उन समयों से संबंधित है, जब धर्मी मरे हुओं में से जी उठेंगे और राज करेंगे; तब नवीकृत और दासता से मुक्त की गई सृष्टि आकाश की ओस और धरती की उर्वरता से हर प्रकार की खाद्य-सामग्री बहुतायत में उत्पन्न करेगी। जैसा कि वे प्राचीन, जिन्होंने प्रभु के शिष्य यूहन्ना को देखा था, बताते हैं कि उन्होंने यूहन्ना से सुना था कि प्रभु उन समयों के विषय में शिक्षा देते हुए कहा करते थे:


    “वे दिन आएँगे जब अंगूर की बेलें उगेंगी; हर बेल में दस हज़ार अंकुर होंगे, और हर अंकुर पर दस हज़ार शाखाएँ, हर शाखा पर फिर दस हज़ार टहनियाँ, हर टहनी पर दस हज़ार गुच्छे, और हर गुच्छे में दस हज़ार अंगूर होंगे। हर अंगूर को निचोड़ने पर पच्चीस माप[b] दाखरस निकलेगा। और जब पवित्र जनों में से कोई उनके किसी गुच्छे को पकड़ेगा, तो दूसरा पुकारकर कहेगा, ‘मैं बेहतर गुच्छा हूँ; मुझे लो, और मेरे द्वारा प्रभु को धन्य कहो।’ इसी प्रकार गेहूँ का एक दाना दस हज़ार बालें उत्पन्न करेगा, हर बाली में दस हज़ार दाने होंगे, और हर दाने से दस पौंड उज्ज्वल और शुद्ध मैदा निकलेगा। दूसरे फल, बीज और घास भी इसी अनुपात में उपजेंगे। और भूमि की उपज खाने वाले सभी पशु शांत और परस्पर मेल से रहने वाले हो जाएँगे, और पूरी अधीनता में मनुष्य की आज्ञा मानेंगे।”


    प्राचीन काल के सम्माननीय व्यक्ति पपियास—जो यूहन्ना के श्रोता और पोलिकार्प के साथी थे—इन बातों की लिखित गवाही अपनी पाँच पुस्तकों में से चौथी पुस्तक में देते हैं।[c] इरेनियस आगे जोड़ते हैं:


    “जो विश्वास करते हैं, उनके लिए ये बातें विश्वासयोग्य हैं।”


