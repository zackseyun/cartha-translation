base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: hi
  text: 'पर पापियास इस प्रकार कहते हैं—मैं उनके शब्द ज्यों के त्यों उद्धृत करता हूँ:


    “उनमें से कुछ को—अर्थात उन स्वर्गदूतों को, जो आरम्भ में पवित्र थे—उसने विश्व की व्यवस्था पर भी अधिकार दिया और उन्हें यह दायित्व सौंपा कि वे अपने अधिकार का ठीक प्रकार से प्रयोग करें।”


    इसके बाद वे कहते हैं:


    “पर ऐसा हुआ कि उनका सुव्यवस्थित दल निष्फल हो गया; क्योंकि वह बड़ा अजगर, वह प्राचीन साँप, जो शैतान और इब्लीस भी कहलाता है, नीचे फेंक दिया गया—हाँ, वह पृथ्वी पर फेंक दिया गया, और उसके साथ उसके स्वर्गदूत भी।”


    कैसरिया के आन्द्रेयास, *प्रकाशितवाक्य पर टीका*, अध्याय 34, उपदेश 12।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह खंड कैसरिया के आन्द्रेयास की *प्रकाशितवाक्य पर टीका* में सुरक्षित है। उपलब्ध मसौदा सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी/लातीनी स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है। मुद्रित साक्ष्य की स्पष्ट OCR-त्रुटियाँ पूरी की गई हैं।
    reason: परोक्ष पाठ-साक्ष्य, लंबित स्रोत-भाषा समीक्षा और संपादकीय पुनर्निर्माण की सीमा को पारदर्शी बनाना।
lexical_decisions:
- source_word: arrangement of the universe
  choice: विश्व की व्यवस्था
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के व्यापक अर्थ को बनाए रखते हुए प्राकृतिक हिन्दी; यह सृष्टि की संरचना अथवा प्रशासन, दोनों की सम्भावना खुली रखता है।
- source_word: dominion
  choice: अधिकार
  rationale: शासन-संबंधी अधिकार को स्पष्ट करता है और अनावश्यक रूप से राजकीय 'प्रभुत्व' का रंग नहीं चढ़ाता।
- source_word: array
  choice: सुव्यवस्थित दल
  rationale: शब्द में निहित क्रमबद्ध समूह अथवा सेना-सदृश विन्यास का भाव रखता है; केवल 'व्यवस्था' कहने से पिछले वाक्य के universe-arrangement से भ्रम होता।
- source_word: came to nought
  choice: निष्फल हो गया
  rationale: विनाश, विफलता या उद्देश्यभंग के बीच उपलब्ध साक्ष्य की अस्पष्टता को कुछ हद तक सुरक्षित रखता है।
- source_word: the devil
  choice: इब्लीस
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में Satan/Devil के भेद को क्रमशः 'शैतान' और 'इब्लीस' से बनाए रखता है।
- source_word: was cast down
  choice: नीचे फेंक दिया गया
  rationale: निष्क्रिय क्रिया और बलपूर्वक पतन, दोनों को संरक्षित करता है; कर्ता को वहाँ स्पष्ट नहीं करता जहाँ साक्ष्य स्पष्ट नहीं करता।
theological_decisions:
- issue: आरम्भ में पवित्र स्वर्गदूतों को विश्व-व्यवस्था पर अधिकार देने वाले का संकेत
  choice: ‘उसने’—सर्वनाम को ही रखा गया
  alternative: ‘परमेश्वर ने’
  rationale: उपलब्ध साक्ष्य में कर्ता केवल He है; स्पष्ट धार्मिक पहचान जोड़ना पाठ से आगे जाना होता।
- issue: स्वर्गदूतों के पतन का स्वरूप
  choice: ‘उनका सुव्यवस्थित दल निष्फल हो गया’
  alternative: ‘उनकी व्यवस्था नष्ट हो गई’ अथवा ‘वे अपने पद से गिर गए’
  rationale: मूल-भाषा समीक्षा लंबित होने के कारण नैतिक पतन, सैन्य पराजय या व्यवस्थित स्थान के नाश में से किसी एक अर्थ को निर्णायक नहीं बनाया गया।
- issue: अजगर और उसके स्वर्गदूतों का पृथ्वी पर फेंका जाना
  choice: प्रकाशितवाक्य-सदृश भाषा को सीधे रखा गया
  alternative: इसे किसी विशेष ऐतिहासिक या ब्रह्माण्डीय घटना के रूप में समझाकर अनूदित करना
  rationale: खंड स्वयं घटना की कालगत या सिद्धान्तगत व्याख्या नहीं देता; अतः तनाव और अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। उद्धरण की प्राचीन शैली को हल्का औपचारिक रखा गया, पर अप्रचलित वाक्य-विन्यास से बचा गया है। ‘पापियास’ और ‘कैसरिया के आन्द्रेयास’ जैसे नाम हिन्दी ध्वन्यात्मक रूप में दिए गए हैं।
