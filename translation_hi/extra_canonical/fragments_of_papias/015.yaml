lexical_decisions:
- source_word: impiety
  choice: दुष्टता
  rationale: यहाँ शब्द यहूदा के घोर अधार्मिक आचरण को सूचित करता है; ‘दुष्टता’ सामान्य पाठक के लिए स्वाभाविक है और किसी विशिष्ट सांप्रदायिक शब्दावली को नहीं थोपता।
- source_word: waggon
  choice: गाड़ी
  rationale: प्राचीन पहिएदार वाहन के सामान्य बोध को बनाए रखते हुए आधुनिक हिन्दी में सहज शब्द चुना गया।
- source_word: oracles of the Lord
  choice: प्रभु के वचन
  rationale: शीर्षक में ‘oracles’ का अर्थ दैवी वचनों या कथनों से है; ‘वचन’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: burst asunder in the midst
  choice: बीच से फट गया
  rationale: शारीरिक घटना का सीधा और सुस्पष्ट चित्रण सुरक्षित रखा गया।
- source_word: disciple of John
  choice: यूहन्ना के शिष्य
  rationale: स्रोत में ‘John’ की पहचान को और विशिष्ट नहीं किया गया है, इसलिए वही अस्पष्टता रखी गई।
theological_decisions:
- issue: मत्ती में यहूदा की फाँसी और प्रेरितों के काम में उसके गिरकर फटने के वृत्तांत का संबंध
  choice: अपोलिनारियुस के सामंजस्यकारी कथन को उसके अपने उद्धृत मत के रूप में ज्यों का त्यों प्रस्तुत किया गया
  alternative: दोनों बाइबलीय वृत्तांतों को संपादकीय रूप से स्वतंत्र या विरोधी बताना
  rationale: खंड स्वयं कहता है कि यहूदा दम घुटने से पहले उतार लिया गया था; अनुवाद को इस प्राचीन व्याख्या की पुष्टि या अस्वीकृति किए बिना उसे सटीक रूप से दर्शाना चाहिए।
- issue: ‘यूहन्ना’ की पहचान
  choice: केवल ‘यूहन्ना’ रखा गया
  alternative: ‘प्रेरित यूहन्ना’ या ‘प्रेस्बिटर यूहन्ना’
  rationale: उपलब्ध साक्षी केवल John कहता है; अधिक विशिष्ट पहचान जोड़ना स्रोत की वास्तविक अस्पष्टता को मिटा देता।
- issue: वर्णित शारीरिक दशा का ऐतिहासिक दर्जा
  choice: ‘कहते हैं’ के माध्यम से परंपरागत/सुनी हुई सूचना का स्तर बनाए रखा
  alternative: वर्णन को निर्विवाद ऐतिहासिक तथ्य के रूप में प्रस्तुत करना
  rationale: स्रोत का ‘They say’ कथन की परंपरागत प्रकृति को चिह्नित करता है और इसे हटाना प्रमाण के स्तर को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज गद्य रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी अनुवाद है, क्योंकि यूनानी/लातीनी स्रोत-पाठ की प्रत्यक्ष समीक्षा लंबित है। उद्धरण-स्तर स्पष्ट किए गए हैं, ग्राफिक विवरण को नरम नहीं किया गया, और अस्पष्ट या क्षतिग्रस्त पाठ को अनुमान से पूरा नहीं किया गया।
