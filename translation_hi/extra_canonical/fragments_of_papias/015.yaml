base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/015.yaml
  text: 'Apollinarius: “Judas did not die by hanging, but lived on, having been cut down before he was suffocated. And the Acts of the Apostles show this, that, falling headlong, he burst asunder in the midst, and all his bowels gushed out. This fact is related more clearly by Papias, the disciple of John, in the fourth (book) of the Exposition of the Oracles of the Lord, as follows:—


    “Judas walked about in this world a terrible example of impiety; _ his flesh swollen to such an extent that, where a waggon [text unclear] pass with ease, he was not able to pass, no, not even the mass of his head merely. They say that his eyelids swelled to such an [lacuna] t that he could not see the light at all, while as for his eyes they were not visible even by a physician looking through an instrument, so far had they sunk from the surface....”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), p. 12 sq., and other sources.'
translation:
  language: hi
  text: 'अपोलिनारियुस: “यहूदा फाँसी लगाने से नहीं मरा, बल्कि दम घुटने से पहले नीचे उतार लिया गया और जीवित रहा। प्रेरितों के काम भी यही दिखाता है कि वह सिर के बल गिरा, बीच से फट गया और उसकी सारी आँतें बाहर निकल पड़ीं। यूहन्ना के शिष्य पपियास ने ‘प्रभु के वचनों की व्याख्या’ की चौथी पुस्तक में इस घटना को और अधिक स्पष्ट रूप से इस प्रकार बताया है:


    “यहूदा इस संसार में दुष्टता का एक भयानक उदाहरण बनकर घूमता रहा। उसका शरीर इतना सूज गया था कि जहाँ से एक गाड़ी [पाठ अस्पष्ट] आसानी से निकल सकती थी, वहाँ से वह नहीं निकल पाता था—यहाँ तक कि केवल उसका सिर भी नहीं। कहते हैं कि उसकी पलकें इतनी [पाठ में रिक्ति] सूज गई थीं कि वह तनिक भी प्रकाश नहीं देख सकता था। उसकी आँखें सतह से इतनी भीतर धँस गई थीं कि किसी उपकरण से देखने पर भी चिकित्सक उन्हें देख नहीं सकता था....”[a]


    —क्रेमर, कैटेना अद आक्टा सांक्टोरुम अपोस्तोलोरुम (1838), पृ. 12 और अगला पृष्ठ, तथा अन्य स्रोतों से संकलित।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह खंड बाद के स्रोत में सुरक्षित है। उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी में इस स्थान पर पाठ अस्पष्ट और अपूर्ण है; इसलिए कोष्ठकों में ‘पाठ अस्पष्ट’ और ‘पाठ में रिक्ति’ दिया गया है। अंतिम बिंदु मूल साक्षी में वर्णन के अधूरे रह जाने को दर्शाते हैं।
