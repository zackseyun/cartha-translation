base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: hi
  text: 'हिएरापोलिस के महान पापियास—उस प्रेरित के शिष्य, जो मसीह की छाती से लगा था—और क्लेमेंट, अलेक्ज़ान्द्रिया-वासियों के पुरोहित पन्तैनुस, तथा महान विद्वान अम्मोनियुस से आरम्भ करके, वे प्राचीन और आरम्भिक व्याख्याकार छः दिनों के समस्त कार्य को मसीह और उसकी कलीसिया से सम्बन्धित समझने में एकमत हैं।[a]


    —सिनै के अनास्तासियुस, *हेक्साएमेरोन पर आलंकारिक मनन*, 1[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है। यूनानी/लातीनी स्रोत की प्रत्यक्ष समीक्षा लंबित है; विशेषकर नामों की सूची, पापियास के शिष्यत्व-संबंध और वाक्य की संरचना की पुनः जाँच आवश्यक है।
    reason: दिए गए स्रोत-विवरण में मूल भाषा की समीक्षा लंबित बताई गई है और अंग्रेज़ी वाक्य की संरचना असहज तथा संभावित रूप से अस्पष्ट है।
  - marker: b
    text: शीर्षक का अर्थानुवाद किया गया है; अंग्रेज़ी साक्ष्य में संक्षिप्त उद्धरण “Contempl. Anagog. in Hexaém. i.” है।
    reason: कृति का संक्षिप्त लातीनीकृत रूप सुरक्षित दर्ज करना और हिन्दी शीर्षक की अस्थायी प्रकृति स्पष्ट करना।
lexical_decisions:
- source_word: Taking their start from
  choice: से आरम्भ करके
  rationale: अंग्रेज़ी साक्ष्य की वंशानुक्रम अथवा व्याख्यात्मक परम्परा के आरम्भ की धारणा को स्वाभाविक हिन्दी में रखता है; वाक्य की संरचनात्मक अस्पष्टता पूरी तरह समाप्त नहीं करता।
- source_word: the Apostle who leaned on Christ’s bosom
  choice: उस प्रेरित के शिष्य, जो मसीह की छाती से लगा था
  rationale: योहन-संबंधी परम्परागत संकेत को नाम देकर स्पष्ट नहीं किया गया, ताकि साक्ष्य की अनाम अभिव्यक्ति बनी रहे।
- source_word: priest of the Alexandrians
  choice: अलेक्ज़ान्द्रिया-वासियों के पुरोहित
  rationale: ‘priest’ के पदनाम को ‘याजक’ या किसी विशिष्ट साम्प्रदायिक पद में ढालने के बजाय ऐतिहासिक रूप से तटस्थ रूप रखा गया।
- source_word: all the work of the six days
  choice: छः दिनों के समस्त कार्य
  rationale: सृष्टि के छह दिनों की ओर संकेत सुरक्षित रखते हुए मूल साक्ष्य की संक्षिप्तता बनाए रखी गई।
- source_word: as referring to
  choice: से सम्बन्धित
  rationale: कोष्ठकीय अंग्रेज़ी पूर्ति की व्याख्यात्मक प्रकृति को कठोर पहचान-समीकरण में बदले बिना अर्थ व्यक्त करता है।
- source_word: Church
  choice: कलीसिया
  rationale: प्राचीन मसीही साहित्य में समुदाय/चर्च के लिए प्रचलित, गरिमापूर्ण और अपेक्षाकृत तटस्थ हिन्दी शब्द।
theological_decisions:
- issue: छः दिनों के कार्य की मसीह और कलीसिया-संबंधी व्याख्या
  choice: “मसीह और उसकी कलीसिया से सम्बन्धित समझने”
  alternative: “मसीह और उसकी कलीसिया का प्रतीक मानने”
  rationale: अंग्रेज़ी साक्ष्य ‘as referring to’ कहता है; ‘प्रतीक’ कहना आलंकारिक पद्धति को अधिक निश्चित कर देता। चयनित रूप व्याख्यात्मक संबंध को बनाए रखता है।
- issue: छाती से लगे प्रेरित की पहचान
  choice: प्रेरित को अनाम रखा गया
  alternative: “प्रेरित योहन”
  rationale: साक्ष्य स्वयं नाम नहीं देता; परम्परागत पहचान को मुख्य पाठ में जोड़ना स्रोत से आगे जाना होता।
- issue: पापियास के शिष्यत्व-संबंध की व्याकरणिक सम्भावना
  choice: अंग्रेज़ी साक्ष्य के निकट, पापियास को उस प्रेरित का शिष्य बताया गया
  alternative: विराम-चिह्न अथवा पुनर्गठन द्वारा संबंध को अनिश्चित छोड़ना
  rationale: उपलब्ध आधार केवल सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है और प्रत्यक्ष यूनानी/लातीनी समीक्षा लंबित है; इसलिए इस संबंध को टिप्पणी सहित अस्थायी रूप में रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और पठनीय रखी गई है। व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है। स्रोत-समीक्षा लंबित होने के कारण पाठ को निर्णायक पुनर्निर्माण के रूप में नहीं, बल्कि सावधान प्रकाशन-मसौदे के रूप में प्रस्तुत किया गया है।
