  revised_text: 'इस प्रकार, जब अव्यवस्था के आदि-पिता ने अपने पुत्र सबाओथ को और उस महिमा को देखा जिसमें वह वास करता था, और जान लिया कि वह अव्यवस्था की हर अधिकार-शक्ति से महान है, तब वह उससे ईर्ष्या करने लगा। क्रोध से भरकर उसने अपनी ही मृत्यु में से मृत्यु को जन्म दिया। मृत्यु को छठे स्वर्ग पर नियुक्त किया गया,[a] क्योंकि सबाओथ को उस स्थान से ऊपर उठा लिया गया था। इस प्रकार अव्यवस्था की छह अधिकार-शक्तियों की संख्या पूरी हुई।


    फिर मृत्यु ने, जो एक उभयलिंगी सत्ता थी, अपने ही स्वभाव के साथ संयोग किया और सात उभयलिंगी संतानों को जन्म दिया। पुरुष संतानों के नाम ये हैं:


    ईर्ष्या,


    क्रोध,


    आँसू,


    कराह,


    पीड़ा,


    रोना,


    कटु विलाप।


    और स्त्री संतानों के नाम ये हैं:


    क्रोध,


    पीड़ा,


    वासना,


    कराह,


    अभिशाप,


    कटुता,


    विवादप्रियता।


    उन्होंने आपस में यौन-संबंध बनाए, और हर एक ने सात संतानों को जन्म दिया। इस प्रकार कुल [] उनचास उभयलिंगी दुष्टात्माएँ हुईं।[b]


    उनके नाम और उनके प्रभाव तुम्हें सुलैमान की पुस्तक में मिलेंगे।


    इनके सम्मुख, सबाओथ के साथ वास करनेवाली ज़ोए ने सात अच्छी उभयलिंगी शक्तियाँ रचीं। पुरुष शक्तियों के नाम ये हैं: ईर्ष्या न करनेवाला, धन्य, आनंदित, सत्यवान, डाह न करनेवाला, प्रिय और विश्वासयोग्य। और स्त्री शक्तियों के नाम ये हैं: शांति, हर्ष, आनंद, धन्यता, सत्य, प्रेम और पिस्तिस।[c] इन्हीं शक्तियों से बहुत-से अच्छे और शुद्ध आत्मिक प्राणी उत्पन्न होते हैं।


    उनके प्रभाव और उनके कार्य तुम्हें ‘बारह के नीचे के स्वर्ग की नियति की संरचनाएँ’ नामक पुस्तक में मिलेंगे।[d]'
