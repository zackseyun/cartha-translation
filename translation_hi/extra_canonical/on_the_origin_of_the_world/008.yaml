translation:
  language: hi
  text: 'इस प्रकार जब अव्यवस्था के आदि-पिता ने अपने पुत्र सबाओथ को और उस महिमा को देखा जिसमें वह वास करता था, और यह जान लिया कि वह अव्यवस्था के हर अधिकारी से महान हो गया है, तो वह उससे ईर्ष्या करने लगा। क्रोध से भरकर उसने अपनी ही मृत्यु में से मृत्यु को जन्म दिया। मृत्यु को छठे स्वर्ग पर नियुक्त किया गया,[a] क्योंकि सबाओथ वहाँ से ऊपर उठा लिया गया था। इस प्रकार अव्यवस्था के छह अधिकारियों की संख्या पूरी हुई।


    फिर मृत्यु ने, जो उभयलिंगी सत्ता थी, अपने ही स्वभाव के साथ संयोग किया और सात उभयलिंगी संतानों को जन्म दिया। पुरुष संतानों के नाम ये हैं:


    ईर्ष्या,


    क्रोध,


    आँसू,


    कराहना,


    पीड़ा,


    रोना,


    कटु विलाप।


    और स्त्री संतानों के नाम ये हैं:


    क्रोध,


    दर्द,


    वासना,


    कराहना,


    श्राप,


    कटुता,


    झगड़ालूपन।


    उन्होंने आपस में यौन-संबंध बनाए, और हर एक ने सात संतानों को जन्म दिया। इस प्रकार कुल [खंडित पाठ] उनचास उभयलिंगी दुष्टात्माएँ हुईं।[b]


    उनके नाम और उनके प्रभाव तुम्हें सुलैमान की पुस्तक में मिलेंगे।


    इनके सामने, सबाओथ के साथ वास करनेवाली ज़ोए ने सात अच्छी उभयलिंगी शक्तियाँ रचीं। पुरुष शक्तियों के नाम ये हैं: ईर्ष्यारहित, धन्य, आनंदित, सत्यवान, डाहरहित, प्रिय और विश्वासयोग्य। और स्त्री शक्तियों के नाम ये हैं: शांति, हर्ष, आनंद, धन्यता, सत्य, प्रेम और पिस्तिस।[c] इन्हीं शक्तियों से बहुत-सी अच्छी और शुद्ध आत्माएँ उत्पन्न होती हैं।


    उनके प्रभाव और उनके कार्य तुम्हें ‘बारह के नीचे के स्वर्ग की नियति की संरचनाएँ’ नामक पुस्तक में मिलेंगे।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: साक्ष्य में इस स्थान पर पांडुलिपि का पृष्ठ-संकेत “[6]” भी आता है; उसे मुख्य पाठ से हटा दिया गया है। ‘क्योंकि’ शब्द संपादकीय पूर्ति के रूप में दिया गया था।
    reason: पृष्ठ-संकेत और पुनर्स्थापित संयोजक के पाठालोचनात्मक स्वरूप को बताना।
  - marker: b
    text: स्रोत-साक्ष्य में ‘उनचास’ से पहले खाली चौकोर कोष्ठक हैं, जो संभवतः पांडुलिपि की क्षति या लुप्त पाठ का संकेत देते हैं।
    reason: मुख्य पाठ में संरक्षित क्षति-संकेत की व्याख्या।
  - marker: c
    text: ‘ज़ोए’ यूनानी में ‘जीवन’ और ‘पिस्तिस’ ‘विश्वास’ का अर्थ दे सकते हैं; यहाँ उन्हें व्यक्तिवाची नाम मानकर लिप्यंतरित किया गया है।
    reason: नाम और अर्थ के बीच की वास्तविक अनिश्चितता बनाए रखना।
  - marker: d
    text: अंतिम ग्रंथ-शीर्षक का स्वरूप अनिश्चित और तकनीकी है; अनुवाद उपलब्ध अंग्रेज़ी साक्ष्य का निकट रूप है।
    reason: प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने और शीर्षक की कठिन संरचना की सूचना।
lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: अव्यवस्था के आदि-पिता
  rationale: ‘Chaos’ के लिए सहज ‘अव्यवस्था’ और पुरुष पात्र के लिए संदर्भानुकूल ‘आदि-पिता’ रखा गया; इससे मिथकीय उपाधि का रूप बना रहता है।
- source_word: Sabaoth
  choice: सबाओथ
  rationale: व्यक्तिनाम का अर्थानुवाद न करके निकट देवनागरी लिप्यंतरण किया गया।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: एक ही सत्ता में पुरुष और स्त्री दोनों लक्षण होने का मूल अर्थ संक्षिप्त और प्रचलित ढंग से व्यक्त होता है।
- source_word: mixed himself together with his (own) nature
  choice: अपने ही स्वभाव के साथ संयोग किया
  rationale: अस्पष्ट मिथकीय अभिव्यक्ति को यौनार्थ से पूरी तरह वंचित किए बिना उसकी मूल अनिश्चितता बचाई गई।
- source_word: Argumentativeness
  choice: झगड़ालूपन
  rationale: अमूर्त नाम के रूप में स्वाभाविक आधुनिक हिंदी और विवादप्रिय स्वभाव का स्पष्ट बोध।
- source_word: Pistis
  choice: पिस्तिस
  rationale: सूची में यह संभवतः व्यक्तिवाची नाम है; इसे केवल ‘विश्वास’ अनूदित करने से पुरुष सूची के ‘विश्वासयोग्य’ तथा स्त्री शक्ति के नाम का भेद धुँधला पड़ सकता था।
- source_word: Structures of the Fate of Heaven Beneath the Twelve
  choice: बारह के नीचे के स्वर्ग की नियति की संरचनाएँ
  rationale: ग्रंथ-शीर्षक की कठिन और संभवतः तकनीकी संरचना को समझाकर बदलने के बजाय औपचारिक रूप में सुरक्षित रखा गया।
theological_decisions:
- issue: मृत्यु को जन्म देनेवाले आदि-पिता की अपनी ‘death’
  choice: अपनी ही मृत्यु में से मृत्यु को जन्म दिया
  alternative: अपने भीतर की मृत्यु से मृत्यु उत्पन्न की
  rationale: पाठ के जानबूझकर विरोधाभासी या मिथकीय वाक्य को किसी धर्मवैज्ञानिक व्याख्या से नहीं सुलझाया गया।
- issue: मृत्यु के सर्वनाम और उसका उभयलिंगी स्वरूप
  choice: संज्ञा ‘मृत्यु’ को दोहराया गया और बाद में उसे उभयलिंगी सत्ता कहा गया
  alternative: हर जगह स्त्रीलिंग या पुल्लिंग सर्वनाम का प्रयोग
  rationale: हिंदी व्याकरण में ‘मृत्यु’ स्त्रीलिंग है, जबकि साक्ष्य में पुरुषवाचक सर्वनाम और उभयलिंगी पहचान दोनों हैं; संज्ञा की पुनरावृत्ति अनावश्यक लिंग-निर्णय घटाती है।
- issue: ज़ोए और पिस्तिस के नाम
  choice: ज़ोए और पिस्तिस के रूप में लिप्यंतरण
  alternative: जीवन और विश्वास के रूप में अर्थानुवाद
  rationale: इस मिथकीय संदर्भ में ये व्यक्तिवाची शक्तियाँ हो सकती हैं; अर्थानुवाद करने पर उनका पात्र-संबंधी स्वरूप खो सकता है।
- issue: अच्छी शक्तियों की संख्या और सूची
  choice: ‘सात’ को रखा और सात-सात नाम प्रस्तुत किए
  alternative: पाठ में संभावित गिनती-विसंगति को सुधारना
  rationale: प्राप्त साक्ष्य में दी संख्या और सूची यहाँ संगत हैं; किसी अन्य पाठ-परंपरा की कल्पित व्यवस्था नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु पठनीय शैली रखी गई है। मिथकीय व्यक्तिनाम लिप्यंतरित किए गए हैं, जबकि गुणों और भावों के नाम अर्थानूदित हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा लंबित होने के कारण पाठालोचनात्मक अनिश्चितताएँ फुटनोट में स्पष्ट की गई हैं।
