  verdict: revise
  source_fidelity: उपलब्ध अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य के प्रति मसौदा समग्रतः निकट है और उसकी पाठ-क्षति तथा संपादकीय पूर्ति को नोटों में चिह्नित करता है। फिर भी ‘authority’ के लिए ‘अधिकारी’ और कुछ सूचीबद्ध गुणों के रूप मूल के व्यक्तिकृत/नामात्मक स्वर को पूरी तरह नहीं निभाते। रिक्त कोष्ठक को ‘[खंडित पाठ]’ से भरना भी साक्ष्य में उपस्थित वास्तविक रिक्तता से अधिक निश्चित है।
  naturalness: भाषा सामान्यतः आधुनिक और पठनीय है। ‘हर अधिकारी से महान’, ‘डाहरहित’, और ‘झगड़ालूपन’ अपेक्षाकृत असहज या अर्थ में ढीले हैं; संशोधन में इन्हें अधिक स्वाभाविक तथा स्रोत के निकट रूपों से बदला गया है।
  terminology: ‘उभयलिंगी’, ‘ज़ोए’, ‘पिस्तिस’, ‘सबाओथ’, और ‘मृत्यु’ की मिथकीय/व्यक्तिकृत प्रस्तुति उपयुक्त है। ‘Chaos’ के लिए ‘अव्यवस्था’ रखा गया है। ‘authority’ को दोनों स्थानों पर ‘अधिकार-शक्ति’ करके संगति तथा मिथकीय सत्ता का बोध सुधारा गया है।
  issues:
  - severity: medium
    issue: पांडुलिपि-क्षति संकेत को मुख्य पाठ में ‘[खंडित पाठ]’ के रूप में भर दिया गया है।
    rationale: साक्ष्य में केवल रिक्त चौकोर कोष्ठक ‘[]’ हैं। ‘खंडित पाठ’ संभावित व्याख्या है, किंतु वह रिक्तता में नए शब्द जोड़ता है; अतः मूल संकेत को ही सुरक्षित रखना चाहिए।
  - severity: medium
    issue: ‘हर अधिकारी’ और ‘छह अधिकारी’ ‘every authority/six authorities’ के लिए असंगत और सीमित अर्थ देते हैं।
    rationale: ‘अधिकारी’ सामान्यतः पदधारी व्यक्ति है, जबकि प्रसंग में ये मिथकीय शासनकारी सत्ताएँ हैं। ‘अधिकार-शक्ति’ अधिक तटस्थ और दोनों स्थानों पर संगत है।
  - severity: low
    issue: ‘डाहरहित’ तथा ‘झगड़ालूपन’ शैलीगत रूप से कम स्वाभाविक हैं।
    rationale: ‘Non-Envying One’ के लिए ‘ईर्ष्या न करनेवाला’ और ‘Argumentativeness’ के लिए ‘विवादप्रियता’ आधुनिक हिंदी में अधिक स्पष्ट हैं।
