base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: hi
  text: 'विश्राम के दिन के बाद, सोफिया ने अपनी बेटी ज़ोए को, जो हव्वा कहलाती है, शिक्षिका बनाकर भेजा, ताकि वह प्राणहीन आदम को खड़ा कर सके और जिन्हें वह जन्म देगा, वे प्रकाश के पात्र बन सकें।


    [जब][a] हव्वा ने अपने पुरुष साथी को मुँह के बल पड़ा देखा, तो उसे उस पर करुणा आई और उसने कहा, “आदम, जीवित हो जा! धरती पर खड़ा हो जा!”


    उसका कथन तुरंत कार्य में पूरा हुआ, क्योंकि आदम खड़ा होकर शीघ्र ही अपनी आँखें खोलने लगा। जब उसने उसे देखा, तो कहा, “तुम ‘जीवितों की माता’ कहलाओगी, क्योंकि तुमने ही मुझे जीवन दिया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “जब” पुनर्स्थापित पाठ के रूप में कोष्ठकों में है और उसके बाद एक रिक्त क्षति-संकेत भी दिया गया है। यहाँ पुनर्स्थापन-संकेत सुरक्षित रखा गया है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित है।
    reason: पांडुलिपि-क्षति अथवा संपादकीय पुनर्स्थापन की अनिश्चितता स्पष्ट करना।
lexical_decisions:
- source_word: Sophia
  choice: सोफिया
  rationale: यह पात्र का यूनानी नाम है; इसे अनूदित करके ‘बुद्धि’ करने से नाम और उसके अर्थ के बीच का भेद मिट सकता था।
- source_word: Zoe
  choice: ज़ोए
  rationale: यूनानी नाम को लिप्यंतरित किया गया है; इसका अर्थ ‘जीवन’ है, पर यहाँ यह पात्र का नाम है।
- source_word: Eve
  choice: हव्वा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और सामान्य पाठकों के लिए परिचित रूप।
- source_word: soulless
  choice: प्राणहीन
  rationale: ‘आत्मारहित’ की संभावित doctrinal संकीर्णता से बचते हुए जीवन-रहित अवस्था व्यक्त करता है; स्रोत-भाषा समीक्षा लंबित है।
- source_word: vessels of light
  choice: प्रकाश के पात्र
  rationale: रूपक को औपचारिक रूप से सुरक्षित रखा गया है, बिना उसका अर्थ विस्तार से तय किए।
- source_word: male companion
  choice: पुरुष साथी
  rationale: साक्ष्य में दिए संबंध को न ‘पति’ बनाया गया है, न केवल ‘पुरुष’; मूल अस्पष्टता बनाए रखी गई है।
- source_word: Mother of the Living
  choice: जीवितों की माता
  rationale: उपाधि के जीवन-संबंधी शब्द-खेल और सामूहिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: आदम की soulless अवस्था
  choice: प्राणहीन आदम
  alternative: आत्मारहित आदम
  rationale: उपलब्ध आधार अंग्रेज़ी साक्ष्य है और कॉप्टिक समीक्षा लंबित है; इसलिए ऐसा रूप चुना गया जो कथा में जीवन देने पर बल रखता है, पर आत्मा के स्वरूप पर कोई संप्रदायगत निष्कर्ष नहीं थोपता।
- issue: हव्वा की भूमिका
  choice: शिक्षिका बनाकर भेजा
  alternative: उपदेशिका के रूप में भेजा
  rationale: ‘teacher’ का सीधा, गरिमापूर्ण अनुवाद है और उसकी भूमिका को धार्मिक पदवी में नहीं बदलता।
- issue: कथन का कार्य में पूरा होना
  choice: उसका कथन तुरंत कार्य में पूरा हुआ
  alternative: उसके शब्द तुरंत सच हो गए
  rationale: साक्ष्य में वचन और क्रिया के संबंध को बनाए रखा गया है, बिना यह निर्धारित किए कि यह आदेश, सृजन-वचन या उपचार था।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। व्यक्तिनाम सोफिया और ज़ोए लिप्यंतरित हैं, जबकि Eve के लिए प्रचलित हिन्दी रूप ‘हव्वा’ रखा गया है। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक स्रोत-भाषा की प्रत्यक्ष समीक्षा अभी लंबित है।
