    The Primal Adam, of Light, is imbued with spirit, and he appeared on the first day. The second Adam is imbued with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created entity of the earth, namely, the man of the Law, and he appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day, and the descendants of the earthly Adam multiplied and filled the earth, and from inside them they made all kinds of technological skills possessed by the Adam imbued with soul. However, all of them dwelt in ignorance.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: hi
  text: 'वह पहले प्रथम शासक से हाबिल के गर्भ से हुई। फिर सात सत्ताओं और उनके स्वर्गदूतों से उसने अन्य संतानें उत्पन्न कीं। यह सब आदिम जनक के पूर्वविचार के अनुसार हुआ, ताकि आदिम माता अपने भीतर हर बीज को धारण कर सके—ऐसा बीज जो विश्व की नियति और उसकी संरचनाओं के साथ मिला और जुड़ा हुआ था। न्याय ने हव्वा के विषय में जो योजना पहले से बनाई थी, वह कार्यान्वित हुई: सत्ताओं के गढ़े हुए रूप प्रकाश को अपने भीतर बंद रखने के स्थान बनेंगे, और प्रकाश उन्हीं के गढ़े हुए रूपों के द्वारा उन्हें दोषी ठहराएगा।[a]


    प्रकाश का आदिम आदम आत्मिक तत्व से युक्त है, और वह पहले दिन प्रकट हुआ। दूसरा आदम प्राणतत्त्व से युक्त है, और वह छठे दिन प्रकट हुआ, जिसे “अफ्रोदिते” कहा जाता है। तीसरा आदम पृथ्वी से रचा गया प्राणी है, अर्थात व्यवस्था का मनुष्य। वह आठवें दिन प्रकट हुआ, जिसे “सूर्य-दिवस” कहा जाता है—निम्न विश्राम-दिवस [के बाद] […]।[b] पृथ्वी के आदम के वंशज बढ़ते गए और उन्होंने पृथ्वी को भर दिया। उन्होंने अपने भीतर से हर प्रकार की तकनीकी कलाएँ उत्पन्न कीं, जो प्राणतत्त्व से युक्त आदम के पास थीं। फिर भी वे सब अज्ञान में रहते थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य के अनुसार यहाँ प्रकाश ही सत्ताओं को दोषी ठहराता है; वाक्य का कर्ता कुछ अस्पष्ट है। कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: सर्वनाम-संदर्भ की वास्तविक अनिश्चितता को पाठक के सामने रखना।
  - marker: b
    text: “[के बाद] […]” उपलब्ध साक्ष्य में पुनर्स्थापन और पाठ-रिक्ति के संकेत हैं; इस स्थान का मूल पाठ अपूर्ण या अनिश्चित है।
    reason: पांडुलिपि-क्षति अथवा संपादकीय पुनर्स्थापन के संकेत सुरक्षित रखना।
lexical_decisions:
- source_word: archon
  choice: शासक
  rationale: ज्ञानवादी संदर्भ में यह विश्व पर शासन करने वाली सत्ता का पदनाम है; सामान्य पाठक के लिए बोधगम्य हिन्दी रखते हुए इसे पारिभाषिक अर्थ में प्रयोग किया गया है।
- source_word: authorities
  choice: सत्ताएँ
  rationale: यहाँ व्यक्तिरूप ब्रह्मांडीय शक्तियाँ अभिप्रेत हैं; “अधिकार” की अपेक्षा “सत्ताएँ” उस अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: forethought
  choice: पूर्वविचार
  rationale: पहले से किए गए दैवी विचार या अभिप्राय का भाव सुरक्षित रहता है, बिना उसे केवल पूर्वज्ञान या पूर्वनियति बना देने के।
- source_word: spirit / soul
  choice: आत्मिक तत्व / प्राणतत्त्व
  rationale: मूल परंपरा में दोनों के बीच जानबूझकर किया गया भेद बनाए रखने के लिए अलग शब्द चुने गए हैं; केवल “आत्मा” दोनों जगह रखने से यह विरोध मिट जाता।
- source_word: Law
  choice: व्यवस्था
  rationale: “व्यवस्था का मनुष्य” विधि या नियामक व्यवस्था से संबंध बनाए रखता है और किसी विशिष्ट सांप्रदायिक अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: technological skills
  choice: तकनीकी कलाएँ
  rationale: शिल्प, निर्माण और व्यावहारिक तकनीक की व्यापक श्रेणी को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: Aphrodite
  choice: अफ्रोदिते
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण रखा गया है; इसे किसी भारतीय देवी-संज्ञा से प्रतिस्थापित नहीं किया गया।
