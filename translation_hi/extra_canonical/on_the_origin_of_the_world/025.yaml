  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: hi
  text: 'अब हम अपने संसार पर विचार करने के लिए आगे बढ़ेंगे, ताकि उसकी संरचना और शासन का वर्णन ठीक-ठीक पूरा कर सकें। तब यह स्पष्ट हो जाएगा कि अदृश्य युग के प्रति वह निष्ठा कैसे पाई गई, जो सृष्टि से लेकर युग की पूर्णता तक प्रकट होती आई है।


    इसलिए अब मैं अमर मनुष्य से संबंधित मुख्य विषयों पर आता हूँ। मैं उससे संबंधित प्राणियों की चर्चा करूँगा और दिखाऊँगा कि वे यहाँ कैसे आए।


    जब [उस आदम के] वंश से, जो [] यहाँ तक कि पदार्थ से बनाया गया था, बहुत-से मनुष्य अस्तित्व में आ गए और संसार पहले ही पूरी तरह आबाद हो चुका था, तब शासक उसके स्वामी थे; अर्थात वे अज्ञान के द्वारा उसे दासता में रखे हुए थे। और ऐसा क्यों था? कारण यह है: अमर पिता जानता है कि युगों और उनके विश्व में सत्य की कमी उत्पन्न हो गई थी। जब उसने विनाश के शासकों को उन्हीं के द्वारा गढ़े गए प्राणियों के माध्यम से निष्फल करना चाहा, तब उसने तुम्हारे प्रतिरूपों को विनाश के संसार में नीचे भेजा—अर्थात निष्कपटता की धन्य छोटी आत्माओं को। ज्ञान उनके लिए अपरिचित नहीं है, क्योंकि समस्त ज्ञान उस एक स्वर्गदूत में निवास करता है जो उनके सामने प्रकट हुआ। पिता के सम्मुख उसमें सामर्थ्य की कमी नहीं है, यहाँ तक कि <वह> उन्हें ज्ञान दे सके। जब वे विनाश के संसार में प्रकट होते हैं, तब वे तुरंत अविनाशिता की संरचना प्रकट करते हैं, जिससे शासकों और उनकी सेनाओं की निंदा होती है।


    इस प्रकार, जब वे धन्य प्राणी सत्ताधारियों द्वारा गढ़े गए रूपों में प्रकट हुए, तो उनसे ईर्ष्या की गई। ईर्ष्या के कारण सत्ताधारियों ने अपने बीज को उनके बीज के साथ मिला दिया, क्योंकि वे उन्हें अशुद्ध करना चाहते थे। पर वे ऐसा करने में असमर्थ रहे।


    फिर, जब वे धन्य प्राणी तेजोमय रूप में प्रकट हुए, तो वे अनेक प्रकार से दिखाई दिए। वे अलग-अलग युगों से उत्पन्न हुए थे और विनाश के गढ़े हुए रूपों के द्वारा दृश्य हुई सभा को अपना ज्ञान प्रकट कर रहे थे। सत्ताधारियों का बीज [उसके साथ] मिला दिए जाने के कारण उसमें हर प्रकार का बीज पाया गया।


    तब उद्धारकर्ता ने उन सबको [(एक के रूप में)] बनाया। उनकी आत्माएँ स्पष्ट रूप से श्रेष्ठ हैं—वे धन्य [], और विविध रीति से चुनी हुई हैं। इसके अतिरिक्त, कई अन्य प्राणी भी हैं जिनका कोई राजा नहीं और जो उन सभी से श्रेष्ठ हैं जो उनसे पहले अस्तित्व में थे।


    इसलिए चार वंश हैं। तीन आठवें स्वर्ग के राजाओं से संबंधित हैं, पर चौथा वंश राजाविहीन और सिद्ध है, और वही उन सबमें सर्वोच्च है। क्योंकि यही वे लोग हैं जो अपने पिता के पवित्र स्थान में प्रवेश करेंगे और विश्राम तथा चैन, अनन्त और अकथनीय महिमा, और असीम आनन्द प्राप्त करेंगे।


    इतना ही नहीं, वे मृत्यु के क्षेत्र के भीतर राजा हैं, क्योंकि वे अमर हैं। वे अव्यवस्था के देवताओं और उनकी सेनाओं की निंदा करेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aeon
  choice: युग
  rationale: यहाँ ‘aeon’ एक ब्रह्माण्डीय क्षेत्र/काल-व्यवस्था का तकनीकी पद है। सहज हिन्दी के लिए ‘युग’ रखा गया है, किंतु प्रसंग में उसका विशिष्ट ब्रह्माण्डीय अर्थ बना रहता है।
- source_word: archons
  choice: शासक
  rationale: यूनानी मूल के पद का कार्यात्मक अर्थ दिया गया है; ये संसार को अज्ञान में बाँधने वाली ब्रह्माण्डीय सत्ताएँ हैं।
- source_word: deathless
  choice: अमर
  rationale: ‘मृत्युरहित’ की तुलना में ‘अमर’ अधिक स्वाभाविक और गरिमापूर्ण है तथा मूल विरोध—मृत्यु के क्षेत्र में अमरता—को सुरक्षित रखता है।
- source_word: perdition
  choice: विनाश
  rationale: यह नाश और पतन के क्षेत्र तथा उससे जुड़े शासकों दोनों के लिए संगत, सहज पद है।
- source_word: authorities
  choice: सत्ताधारी
  rationale: ‘शासक’ से निकट संबंध रखते हुए भी स्रोत में प्रयुक्त अलग पद का भेद बनाए रखता है।
- source_word: indestructibility
  choice: अविनाशिता
  rationale: यह केवल टिकाऊपन नहीं, नष्ट न हो सकने वाली दिव्य अवस्था को व्यक्त करता है।
- source_word: church
  choice: सभा
  rationale: उत्तरकालीन संस्थागत अर्थ से बचते हुए दृश्य समुदाय/एकत्रित देह का अर्थ सुरक्षित रखा गया है।
- source_word: Chaos
  choice: अव्यवस्था
  rationale: ब्रह्माण्डीय ‘Chaos’ के अर्थ को हिन्दी में स्पष्ट करता है; इसे केवल आधुनिक बोलचाल के ‘अराजकता’ तक सीमित नहीं करता।
- source_word: races
  choice: वंश
  rationale: यहाँ मानव नस्लों की आधुनिक धारणा नहीं, आध्यात्मिक उत्पत्ति और वर्गों का संकेत है।
theological_decisions:
- issue: ‘faithfulness to the unseen aeon’ का संबंध
  choice: ‘अदृश्य युग के प्रति ... निष्ठा’
  alternative: ‘अदृश्य युग की विश्वसनीयता’
  rationale: व्याकरण दोनों अर्थों की कुछ गुंजाइश देता है; उपलब्ध साक्ष्य में निष्ठा के लक्ष्य के रूप में अदृश्य युग अधिक स्वाभाविक है, इसलिए संबंध को इसी रूप में रखा गया है।
- issue: एक स्वर्गदूत में समस्त ज्ञान का निवास
  choice: कथन को बिना पहचान निश्चित किए यथावत रखा
  alternative: स्वर्गदूत को उद्धारकर्ता या किसी अन्य नामित सत्ता से पहचानना
  rationale: स्रोत उस स्वर्गदूत की स्पष्ट पहचान नहीं करता; किसी संप्रदायगत पहचान को आरोपित नहीं किया गया।
- issue: ‘seed’ का अर्थ
  choice: ‘बीज’
  alternative: ‘वंश’, ‘संतान’ या ‘वीर्य’
  rationale: पाठ में आध्यात्मिक, वंशगत और संभवतः देहगत अर्थ एक साथ सक्रिय हैं; ‘बीज’ इस बहुअर्थक तनाव को सुरक्षित रखता है।
- issue: राजाविहीन चौथे वंश की श्रेष्ठता
  choice: ‘राजाविहीन और सिद्ध’
  alternative: ‘स्वायत्त’ या ‘ईश्वरविहीन’
  rationale: मूल का आशय सांसारिक/ब्रह्माण्डीय राजा के अधीन न होना है; इसे नास्तिकता या आधुनिक राजनीतिक स्वतंत्रता के रूप में नहीं बदला गया।
- issue: मृत्यु के क्षेत्र में राजत्व
  choice: विरोधाभासी कथन को सीधे सुरक्षित रखा
  alternative: इसे रूपक बताकर स्पष्ट करना
  rationale: अमर प्राणियों का मृत्यु के क्षेत्र में राजा होना पाठ का जानबूझकर रखा गया धर्मवैचारिक तनाव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय गद्य रखा गया है। स्रोत-समीक्षा लंबित होने के कारण उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य को सावधानी से अपनाया गया है। पांडुलिपीय रिक्तियाँ [], पुनर्स्थापन <वह>, और कोष्ठकीय पूर्ति सुरक्षित रखी गई हैं; वाक्य बाधित करने वाली मात्र पृष्ठ-संख्या [16] शामिल नहीं की गई। तकनीकी ज्ञानवादी शब्दावली को जहाँ संभव हो अर्थानुवादित किया गया है, पर अस्पष्ट वंशावली, ‘बीज’, और ब्रह्माण्डीय वर्गों की अनिश्चितता को सरल करके मिटाया नहीं गया।
