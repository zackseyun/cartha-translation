base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: hi
  text: 'जब आदि-जनक ने उस प्रकाश को सुंदरता से चमकते देखा, तो वह चकित रह गया और अत्यन्त लज्जित हुआ। जब वह प्रकाश बाहर निकला, तो उसके भीतर मनुष्य की एक अत्यन्त अद्भुत प्रतिमूर्ति प्रकट हुई। आदि-जनक और उसके साथ रहनेवाली प्रोनोइया के सिवा किसी ने उसे नहीं देखा। फिर भी उसका प्रकाश स्वर्ग की सारी सेनाओं के सामने प्रकट हुआ, और इस कारण वे सब व्याकुल हो गईं।


    तब प्रोनोइया ने उस दूत को देखा और उससे प्रेम करने लगी। पर उसने प्रोनोइया से घृणा की, क्योंकि वह अन्धकार में रहती थी। प्रोनोइया उसे गले लगाना चाहती थी, पर ऐसा न कर सकी। जब वह अपने प्रेम की ज्वाला बुझा न सकी, तो उसने अपना प्रकाश धरती पर उँडेल दिया। उस दिन से वह दूत “प्रकाश का आदम” कहलाया, जिसका अनुवाद है, “रक्त का दीप्तिमान मनुष्य।” और उसके ऊपर धरती फैलाई गई—[a] पवित्र अदामान, जिसका अनुवाद है, “अदम्य की पवित्र भूमि।”


    उस दिन से हर सत्ता ने कुँवारी के रक्त का सम्मान किया है, और कुँवारी के रक्त के कारण धरती शुद्ध हुई। इसके अतिरिक्त, जल पिस्टिस सोफिया की प्रतिमूर्ति के द्वारा शुद्ध हुआ, जो जल के भीतर आदि-जनक को दिखाई दी थी। इसलिए ठीक ही कहा गया है, “वह जल के द्वारा प्रकट हुआ।” क्योंकि वह हर वस्तु को जीवन देता है, [b] पवित्र जल हर वस्तु को शुद्ध करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में यहाँ “[7]” पाण्डुलिपि-पृष्ठ संख्या के रूप में आया है; उसे वाक्य का अंश न मानकर इस टिप्पणी में दर्ज किया गया है। ‘अदामान’ और ‘अदम्य’ के बीच सम्भावित शब्द-क्रीड़ा का ठीक रूप प्रत्यक्ष कॉप्टिक समीक्षा पर निर्भर है।
    reason: पृष्ठ-संकेत को मुख्य वाक्य में बाधा बनने से रोकना और अनिश्चित व्युत्पत्ति को पारदर्शी बनाना।
  - marker: b
    text: उपलब्ध साक्ष्य में यहाँ खाली कोष्ठक हैं, जो सम्भवतः पाठ-हानि या अनिश्चित पुनर्स्थापन का संकेत देते हैं।
    reason: पाण्डुलिपि या साक्ष्य की रिक्ति को चुपचाप भरने के बजाय सुरक्षित रखना।
lexical_decisions:
- source_word: Primal Parent
  choice: आदि-जनक
  rationale: पुरुषवाचक सर्वनाम और आदिम उत्पत्तिकर्ता की भूमिका को बनाए रखते हुए आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण रूप।
- source_word: Pronoia
  choice: प्रोनोइया
  rationale: यह पारिभाषिक व्यक्तिनाम है; इसे केवल ‘पूर्वचिन्तन’ कह देने से इसकी व्यक्तिकृत पहचान और दार्शनिक बहुअर्थकता घट जाती।
- source_word: human likeness
  choice: मनुष्य की प्रतिमूर्ति
  rationale: ‘likeness’ को स्वयं मनुष्य न बनाकर उसकी दृश्य समानता या छवि के रूप में रखा गया है।
- source_word: Adam of Light
  choice: प्रकाश का आदम
  rationale: उपाधि की संरचना और आदम नाम को प्रत्यक्ष रूप से सुरक्षित रखा गया है।
- source_word: the radiant man of blood
  choice: रक्त का दीप्तिमान मनुष्य
  rationale: मूल साक्ष्य में उपस्थित असामान्य व्युत्पत्तिपरक कथन को सहज बनाने के लिए बदला नहीं गया।
- source_word: Adaman / Adamantine
  choice: अदामान / अदम्य
  rationale: व्यक्तिनाम को लिप्यन्तरित किया गया और उससे जुड़े कठोरता/अविनाशिता-सूचक शब्द-सम्बन्ध को ‘अदम्य’ से संकेतित किया गया; यह व्युत्पत्ति स्रोत-भाषा समीक्षा के बाद पुनर्विचार योग्य है।
- source_word: authorities
  choice: सत्ताएँ
  rationale: इस ग्रन्थ की ब्रह्माण्ड-विषयक शक्तियों के लिए सामान्य राजनीतिक ‘अधिकारी’ की अपेक्षा ‘सत्ता’ अधिक उपयुक्त है।
- source_word: Pistis Sophia
  choice: पिस्टिस सोफिया
  rationale: विशिष्ट व्यक्तिनाम और पारिभाषिक अभिव्यक्ति होने के कारण लिप्यन्तरण किया गया।
- source_word: hosts of the heavens
  choice: स्वर्ग की सारी सेनाएँ
  rationale: ब्रह्माण्डीय समूहों के सामूहिक और संगठित स्वरूप को बनाए रखने वाला प्रचलित हिन्दी रूप।
theological_decisions:
- issue: प्रोनोइया और पिस्टिस सोफिया की पहचान
  choice: दोनों को लिप्यन्तरित व्यक्तिनामों के रूप में रखा गया
  alternative: उन्हें क्रमशः ‘पूर्वचिन्तन’ और ‘विश्वास-प्रज्ञा’ के रूप में अनूदित करना
  rationale: अनुवादित अमूर्त संज्ञाएँ पाठ की व्यक्तिकृत ब्रह्माण्डीय पात्र-रचना को अस्पष्ट कर सकती थीं और किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को थोप सकती थीं।
- issue: ‘कुँवारी के रक्त’ का अर्थ
  choice: वाक्यांश को ज्यों का त्यों रखा गया
  alternative: इसे किसी पहचानी हुई धर्मवैज्ञानिक घटना या पात्र से स्पष्टतः जोड़ना
  rationale: दिए गए साक्ष्य में पहचान स्पष्ट नहीं है; उसकी रहस्यमयता और धर्मवैज्ञानिक तनाव को सुरक्षित रखा गया है।
- issue: ‘वह जल के द्वारा प्रकट हुआ’ में कर्ता
  choice: पुल्लिंग एकवचन ‘वह’ के साथ अस्पष्ट संकेत बनाए रखा गया
  alternative: ‘पिस्टिस सोफिया की प्रतिमूर्ति जल के द्वारा प्रकट हुई’ लिखकर कर्ता निश्चित करना
  rationale: अंग्रेज़ी साक्ष्य में कोष्ठकीय क्रिया और सर्वनाम का संकेत अनिश्चित है; बिना कॉप्टिक समीक्षा के कर्ता को निश्चित करना उचित नहीं।
- issue: पवित्र जल का जीवन देना और शुद्ध करना
  choice: सार्वभौमिक दावे को बिना धर्मसिद्धान्तीय सीमांकन के अनूदित किया गया
  alternative: इसे किसी संस्कार, बपतिस्मा या विशिष्ट धार्मिक जल तक सीमित करना
  rationale: पाठ स्वयं ऐसा सीमांकन नहीं करता; सम्प्रदायगत अर्थ आरोपित करने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। वाक्य अपेक्षाकृत स्पष्ट रखे गए हैं, पर ‘रक्त का दीप्तिमान मनुष्य’, ‘उसके ऊपर धरती फैलाई गई’ और जल-संबंधी कथन जैसी स्रोत की वास्तविक असामान्यताएँ सरल व्याख्या से समतल नहीं की गईं। प्रत्यक्ष कॉप्टिक स्रोत-समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-सचेत अनुवाद है।
