  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: hi
  text: 'तब अधिकारियों को यह समाचार मिला कि जिस आकृति को उन्होंने गढ़ा था, वह जीवित हो गई है और उठ खड़ी हुई है; इससे वे बहुत व्याकुल हुए। उन्होंने यह जानने के लिए सात प्रधान स्वर्गदूत भेजे कि क्या हुआ था।


    वे आदम के पास आए। जब उन्होंने हव्वा को उससे बात करते देखा, तो आपस में कहा, “यह तेजस्वी स्त्री किस प्रकार की सत्ता है? क्योंकि यह उस प्रतिरूप के समान है जो प्रकाश के भीतर हमारे सामने प्रकट हुआ था। आओ, हम इसे पकड़ लें और इसमें अपना बीज डालें, ताकि अपवित्र हो जाने पर यह अपने प्रकाश में ऊपर न चढ़ सके। इसके बजाय, जिनको यह जन्म देगी वे हमारे अधीन होंगे। पर हम आदम को न बताएँ, क्योंकि वह हममें से नहीं है। बल्कि हम उसे गहरी नींद में डाल दें और सोते समय उसे यह सिखाएँ कि वह उसकी पसली से उत्पन्न हुई है, ताकि उसकी पत्नी उसकी आज्ञा माने और वह उस पर प्रभुता करे।”


    हव्वा एक शक्ति थी, इसलिए वह उनके निर्णय पर हँसी। उसने उनकी आँखों में धुंध भर दी और चुपके से अपना प्रतिरूप आदम के पास छोड़ दिया।


    वह ज्ञान के वृक्ष में प्रवेश कर वहीं ठहरी रही। उन्होंने उसका पीछा किया, और उसने उन पर प्रकट किया कि वह वृक्ष में प्रवेश करके वृक्ष बन गई है। तब वे अंधी सत्ताएँ बड़े भय में पड़कर भाग गईं।


    बाद में, जब वे अपनी जड़ता से उबर गए, तो आदम के पास आए। इस स्त्री के प्रतिरूप को [] उसके साथ देखकर वे बहुत व्याकुल हुए। उन्होंने समझा कि वही वास्तविक हव्वा है और उतावलेपन में काम किया। वे उसके पास आए, उसे पकड़ लिया और उस पर अपना बीज डाल दिया।


    उन्होंने दुष्टता से ऐसा किया और स्वाभाविक तथा अश्लील उपायों से उसे अपवित्र किया। सबसे पहले उन्होंने उसकी वाणी की मुहर[a] को अपवित्र किया—उस वाणी को, जिसने उनसे कहा था, “तुमसे पहले क्या अस्तित्व में था?” इस प्रकार युग की परिपूर्णता के समय वे उन लोगों को अपवित्र करना चाहते थे जो वाणी के उच्चारण द्वारा यह घोषित कर सकते थे कि वे सच्चे मनुष्य से जन्मे हैं। पर वे भटक गए, क्योंकि वे नहीं जानते थे कि उन्होंने अपने ही शरीर को अपवित्र किया था; अधिकारियों और उनके स्वर्गदूतों ने हर प्रकार से जिसको अपवित्र किया, वह प्रतिरूप ही था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वाणी की मुहर” का आशय अस्पष्ट है। यह संभवतः बोलने की क्षमता, मुख, या वाणी से जुड़ी किसी पवित्र पहचान का रूपक है।
    reason: स्रोत-साक्ष्य की असामान्य अभिव्यक्ति को पाठ में यथावत रखते हुए पाठक को संभावित अर्थ-क्षेत्र बताना आवश्यक है।
lexical_decisions:
- source_word: authorities
  choice: अधिकारी
  rationale: प्रस्तुत साक्ष्य के तकनीकी ब्रह्मांड-विज्ञान संबंधी पद को सरल और सुसंगत रूप में रखा; ‘शासक’ भी संभव है, पर यहाँ अंग्रेज़ी परामर्श-पाठ से निरंतरता रखी गई।
- source_word: shaped form / likeness
  choice: गढ़ी हुई आकृति / प्रतिरूप
  rationale: 'दो संबंधित किंतु अलग धारणाओं को अलग रखा: निर्मित देहाकार के लिए ‘आकृति’ और ईव के छोड़े हुए समान रूप के लिए ‘प्रतिरूप’।'
- source_word: force
  choice: शक्ति
  rationale: सत्ता या सक्रिय दिव्य सामर्थ्य—दोनों अर्थों की गुंजाइश बनाए रखता है।
- source_word: tree of knowledge
  choice: ज्ञान का वृक्ष
  rationale: परिचित बाइबिलीय पदावली, किंतु पाठ के विशिष्ट कथानक को बिना विस्तार के व्यक्त करती है।
- source_word: seal of her voice
  choice: उसकी वाणी की मुहर
  rationale: असामान्य और संभवतः तकनीकी रूपक को व्याख्यात्मक रूप से हल करने के बजाय औपचारिक ढंग से संरक्षित किया।
- source_word: true man
  choice: सच्चा मनुष्य
  rationale: ‘मनुष्य’ के संभावित आदिरूपीय या आध्यात्मिक अर्थ को खुला रखा; ‘पुरुष’ चुनने से अनावश्यक लैंगिक संकुचन होता।
- source_word: consummation (of the age)
  choice: युग की परिपूर्णता
  rationale: अंतकालीन पूर्णता के भाव को रखता है, बिना इसे केवल ‘अंत’ या विनाश के रूप में निश्चित किए।
theological_decisions:
- issue: हव्वा का आदम की पसली से उत्पन्न होना
  choice: इसे अधिकारियों द्वारा नींद में सिखाई जाने वाली बात के रूप में प्रस्तुत किया
  alternative: वर्णनकर्ता द्वारा सत्य ऐतिहासिक कथन के रूप में अनुवाद करना
  rationale: इस ग्रंथ में यह दावा अधिकारियों की योजना और शिक्षा के भीतर आता है; कथावाचक स्वयं इसकी पुष्टि नहीं करता।
- issue: हव्वा की पहचान ‘शक्ति’ के रूप में
  choice: सीधा कथन ‘हव्वा एक शक्ति थी’
  alternative: ‘हव्वा शक्तिशाली थी’
  rationale: विशेष्यात्मक/सत्तात्मक अर्थ को बचाता है; केवल गुणात्मक ‘शक्तिशाली’ पाठ की ब्रह्मांड-विज्ञान संबंधी धार को कम कर देता।
- issue: प्रतिरूप और वास्तविक हव्वा का भेद
  choice: पूरे अनुच्छेद में स्पष्ट भेद बनाए रखा
  alternative: दोनों को केवल ‘हव्वा’ कहना
  rationale: कथानक और अंतिम आत्म-वंचना इसी भेद पर निर्भर हैं।
- issue: अपवित्रीकरण का यौन और प्रतीकात्मक स्वरूप
  choice: पाठ की कठोरता बनाए रखते हुए गैर-सनसनीखेज भाषा
  alternative: घटना को शिष्टोक्ति से अस्पष्ट करना या अधिक चित्रात्मक बनाना
  rationale: मूल साक्ष्य की नैतिक भयावहता तथा ‘वाणी की मुहर’ के प्रतीकात्मक तनाव दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और परामर्श-पाठ पर आधारित है। खाली कोष्ठक [] को पांडुलिपीय क्षति अथवा अनिश्चित पुनर्स्थापन के संकेत के रूप में सुरक्षित रखा गया है; नंगा पृष्ठ-संकेत [13] नहीं रखा गया।
