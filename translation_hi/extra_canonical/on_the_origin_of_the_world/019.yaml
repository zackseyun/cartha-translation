    rationale: अंग्रेज़ी witness का ‘she disclosed to them’ सूचना प्रकट/बताने का अर्थ देता है, न कि ‘उन पर प्रकट करना’।
  - severity: low
    issue: ‘उतावलेपन में काम किया’ मुहावरेदार नहीं है।
    rationale: ‘उतावलेपन से कार्य किया’ मूल के ‘behaved impulsively’ को अधिक स्वाभाविक और औपचारिक हिन्दी में व्यक्त करता है।
  - severity: low
    issue: ‘वह उसकी पसली से उत्पन्न हुई’ में ‘उसकी’ का निर्देश अस्पष्ट हो सकता है।
