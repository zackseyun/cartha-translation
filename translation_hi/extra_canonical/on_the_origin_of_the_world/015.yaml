  revised_text: 'प्रकाश का आदम अराजकता के भीतर पीछे हटने से पहले ही सत्ताधारी शक्तियों ने उसे देख लिया। उन्होंने आदिम जनक का उपहास किया, क्योंकि उसने उनसे झूठ कहा था: “मैं ही परमेश्वर हूँ; मुझसे पहले कोई अस्तित्व में नहीं था।”


    वे उसके पास आए और पूछने लगे, “क्या यह वही ईश्वर नहीं है जिसने हमारा काम बिगाड़ दिया?”


    उसने उत्तर दिया, “हाँ। यदि तुम चाहते हो कि वह हमारा काम बिगाड़ने में असमर्थ हो जाए, तो आओ, हम मिट्टी से एक मनुष्य बनाएँ, जो हमारी सेवा करे। हम उसे अपने शरीर की प्रतिमा के अनुसार और इस प्राणी की समानता [a] के अनुसार बनाएँ, ताकि जब वह अपनी समानता को देखे, तो उससे प्रेम करने लगे। वह हमारा काम फिर नहीं बिगाड़ेगा। इसके बजाय, जो प्रकाश से जन्म लेते हैं, उन्हें हम इस पूरे युग भर के लिए अपने सेवक बनाएँगे।”


    यह सब पिस्तिस की पूर्वचिंता के अनुसार हुआ, ताकि मनुष्य उसकी समानता में प्रकट हो और उनके गढ़े हुए रूप के कारण उनकी निंदा करे। उनका गढ़ा हुआ रूप प्रकाश को अपने भीतर घेरे रखने का स्थान बन गया।


    इसके बाद सत्ताधारी शक्तियों ने मनुष्य को बनाने के लिए आवश्यक ज्ञान प्राप्त किया। सबाओथ के साथ रहनेवाली सोफिया ज़ोए ने पहले ही देख लिया था कि वे क्या करनेवाले हैं। उसने उनके निर्णय का उपहास किया, क्योंकि वे अंधे हैं। अपने ही हित के विरुद्ध जाकर, उन्होंने अज्ञान में उसे बनाया, और वे नहीं समझे कि वे क्या करने जा रहे थे।


    वह उनसे पहले आगे बढ़ी और उसने सबसे पहले अपना मनुष्य बनाया। उसने ऐसा इसलिए किया कि वह उनके गढ़े हुए रूप को बता सके कि उनसे घृणा कैसे करनी है और इस प्रकार उनसे कैसे बच निकलना है।


    शिक्षक इस प्रकार उत्पन्न हुआ: जब सोफिया ने प्रकाश की एक बूँद को नीचे उतरने दिया, तो वह जल पर बह निकली और तुरंत एक उभयलिंगी मनुष्य प्रकट हुआ। उसने पहले उस बूँद को स्त्री-देह के रूप में ढाला। फिर उस देह का उपयोग करके उसने उसे उस माता की समानता में ढाला, जो पहले प्रकट हुई थी, और बारह महीनों में उसे पूर्ण किया।


    एक उभयलिंगी मनुष्य उत्पन्न हुआ, जिसे यूनानी लोग “हर्माफ्रोदितेस” कहते हैं और जिसकी माता को इब्रानी लोग “ज़ोए की हव्वा” कहते हैं, अर्थात जीवन की शिक्षिका। उसकी संतान वह रची हुई सत्ता है जो स्वामी है। बाद में सत्ताधारी शक्तियों ने [b] उसे “पशु” कहा, ताकि वह उन रची हुई सत्ताओं को भटका सके जिन्होंने आकार दिया था। “पशु” का अर्थ “शिक्षक” है, क्योंकि वह सभी प्राणियों में सबसे चतुर पाया गया।'
