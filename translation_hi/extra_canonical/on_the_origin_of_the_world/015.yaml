translation:
  language: hi
  text: 'प्रकाश का आदम अराजकता के भीतर पीछे हट पाता, उससे पहले ही सत्ताधारी शक्तियों ने उसे देख लिया। उन्होंने आदिम जनक का उपहास किया, क्योंकि उसने उनसे झूठ कहा था: “मैं ही परमेश्वर हूँ; मुझसे पहले कोई अस्तित्व में नहीं था।”


    वे उसके पास आए और पूछने लगे, “क्या यह वही देवता नहीं है जिसने हमारा काम बिगाड़ दिया?”


    उसने उत्तर दिया, “हाँ। यदि तुम चाहते हो कि वह फिर हमारा काम न बिगाड़ सके, तो आओ, हम मिट्टी से एक मनुष्य बनाएँ, जो हमारी सेवा करे। हम उसे अपने शरीर की प्रतिमा के अनुसार और इस प्राणी की समानता [a] के अनुसार बनाएँ, ताकि जब वह अपनी समानता को देखे, तो उससे प्रेम करने लगे। तब वह हमारा काम फिर नहीं बिगाड़ेगा। इसके बजाय, जो लोग प्रकाश से जन्म लेते हैं, उनसे हम इस पूरे युग भर अपनी सेवा करवाएँगे।”


    यह सब पिस्तिस की पूर्व-योजना के अनुसार हुआ, ताकि मनुष्य उसकी समानता में प्रकट हो, और उन सत्ताधारी शक्तियों के गढ़े हुए रूप के कारण उनकी निंदा करे। उनका गढ़ा हुआ रूप प्रकाश को अपने भीतर बंद रखने का स्थान बन गया।


    इसके बाद उन सत्ताधारी शक्तियों ने मनुष्य को बनाने के लिए आवश्यक ज्ञान प्राप्त किया। सबाओथ के साथ रहनेवाली सोफिया ज़ोए पहले ही जान गई थी कि वे क्या करनेवाले हैं। उसने उनके निर्णय का उपहास किया, क्योंकि वे अंधे हैं। उन्होंने अनजाने में अपने ही हित के विरुद्ध जाकर उसे बनाया; वे समझ नहीं पाए कि वे क्या करने जा रहे थे।


    सोफिया उनसे पहले ही आगे बढ़ी और उसने सबसे पहले अपना मनुष्य बनाया। उसने ऐसा इसलिए किया कि वह उनके गढ़े हुए रूप को बता सके कि उनसे घृणा कैसे करनी है और इस प्रकार उनसे कैसे बच निकलना है।


    उस शिक्षक की उत्पत्ति इस प्रकार हुई: जब सोफिया ने प्रकाश की एक बूँद नीचे उतरने दी, तो वह पानी पर बह गई और तुरंत एक उभयलिंगी मनुष्य प्रकट हुआ। उसने पहले उस बूँद को स्त्री-देह का रूप दिया। फिर उसी देह का उपयोग करके उसने उसे उस माता की समानता में गढ़ा जो पहले प्रकट हुई थी, और बारह महीनों में उसे पूर्ण किया।


    इस प्रकार एक उभयलिंगी मनुष्य उत्पन्न हुआ, जिसे यूनानी लोग “हर्माफ्रोदितेस” कहते हैं। उसकी माता को इब्रानी लोग “ज़ोए की हव्वा” कहते हैं, अर्थात जीवन की शिक्षिका। उसकी संतान वह रचा हुआ प्राणी है जो स्वामी है। बाद में सत्ताधारी शक्तियों ने [b] उसे “पशु” कहा, ताकि वह उन रचे हुए प्राणियों को भटका सके जिन्होंने आकार दिया था। “पशु” का अर्थ “शिक्षक” है, क्योंकि वह सभी प्राणियों में सबसे चतुर पाया गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध पांडुलिपि-साक्ष्य में पाठ का अंश लुप्त या अनिश्चित है।
    reason: मूल साक्षी में दिए गए रिक्त वर्ग-कोष्ठक को प्रकाशनयोग्य पाद-टिप्पणी संकेत के रूप में सुरक्षित रखना।
  - marker: b
    text: इस स्थान पर भी पांडुलिपि-साक्ष्य में कुछ पाठ लुप्त या अनिश्चित है। अंतिम वाक्यों की व्याकरणिक संरचना भी अस्पष्ट है।
    reason: दूसरे पाठ-अंतराल और उससे जुड़ी अर्थगत अनिश्चितता को छिपने से रोकना।
lexical_decisions:
- source_word: authorities
  choice: सत्ताधारी शक्तियाँ
  rationale: यह केवल मानवीय अधिकारियों की नहीं, कथानक की ब्रह्मांडीय शासक शक्तियों की ओर संकेत करता है; बहुवचन और तकनीकी अर्थ दोनों सुरक्षित रहते हैं।
- source_word: Chaos
  choice: अराजकता
  rationale: ब्रह्मांडीय क्षेत्र के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे किसी अन्य धार्मिक संकल्पना से मिलाए।
- source_word: Primal Parent
  choice: आदिम जनक
  rationale: मूल/प्रथम अभिभावक का भाव रखता है और अनावश्यक रूप से मातृ या पितृ पहचान निश्चित नहीं करता।
- source_word: aeon
  choice: युग
  rationale: यहाँ समयावधि का अर्थ प्रमुख है; ‘युग’ सामान्य पाठक के लिए सुबोध है, यद्यपि पारिभाषिक अर्थ पूरी तरह समाप्त नहीं किया गया।
- source_word: androgynous human
  choice: उभयलिंगी मनुष्य
  rationale: पाठ में स्त्री और पुरुष दोनों लक्षणों वाले मानव का आशय स्पष्ट और सम्मानजनक आधुनिक हिन्दी में देता है।
- source_word: Hermaphrodites
  choice: हर्माफ्रोदितेस
  rationale: इसे यूनानी नाम के रूप में लिप्यंतरित किया गया है, क्योंकि पाठ स्वयं इसे यूनानी नाम बताता है।
- source_word: the Beast
  choice: पशु
  rationale: उद्धरण-चिह्नों सहित नामात्मक प्रयोग सुरक्षित रखा गया है; इसे बाद की किसी विशिष्ट प्रतीक-व्याख्या से नहीं जोड़ा गया।
- source_word: the Teacher
  choice: शिक्षक
  rationale: अंतिम व्युत्पत्तिपरक कथन में प्रयुक्त पद को पूर्ववर्ती ‘teacher’ के साथ एकरूप रखा गया है।
theological_decisions:
- issue: आदिम जनक का ईश्वरत्व का दावा
  choice: 'दावे को प्रत्यक्ष कथन के रूप में रखा गया: “मैं ही परमेश्वर हूँ”'
  alternative: वक्ता को कथावाचक की ओर से वास्तविक सर्वोच्च परमेश्वर घोषित करना
  rationale: मूल कथानक इस कथन को झूठ कहता है; अनुवाद ने दावे और कथावाचक के मूल्यांकन के बीच का तनाव सुरक्षित रखा है।
- issue: ‘उसकी समानता’ का संदर्भ
  choice: सर्वनाम को अस्पष्ट ही रखा गया
  alternative: इसे स्पष्ट रूप से प्रकाश के आदम, पिस्तिस या किसी अन्य पात्र की समानता कहना
  rationale: उपलब्ध साक्ष्य में पूर्वपद निश्चित नहीं है; व्याख्यात्मक समाधान पाठ पर आरोपित नहीं किया गया।
- issue: सोफिया ज़ोए और सबाओथ के नाम
  choice: नामों का लिप्यंतरण किया गया
  alternative: नामों का धर्मशास्त्रीय अर्थानुवाद करना
  rationale: ये कथानक के विशिष्ट पात्र हैं; लिप्यंतरण संप्रदायगत या व्याख्यात्मक पहचान थोपने से बचाता है।
- issue: अंतिम अनुच्छेद की अस्पष्ट कर्ता-कर्म संरचना
  choice: ‘उन रचे हुए प्राणियों को… जिन्होंने आकार दिया था’ के रूप में संरचना को निकटता से सुरक्षित रखा गया
  alternative: किसने किसे रचा या भटकाया, इसे अनुमान से स्पष्ट करना
  rationale: अंग्रेज़ी साक्षी स्वयं इस वाक्य को अस्पष्ट बताता है और प्रत्यक्ष कॉप्टिक समीक्षा लंबित है; इसलिए इसे सामंजस्यपूर्ण बनाकर अर्थ निश्चित नहीं किया गया।
- issue: ‘जो स्वामी है’
  choice: संबंधवाचक कथन को बिना अतिरिक्त पहचान के रखा गया
  alternative: ‘स्वामी’ को किसी ज्ञात देवता, मसीह या शासक से स्पष्ट रूप से जोड़ना
  rationale: पाठ यहाँ पहचान स्पष्ट नहीं करता; अतिरिक्त धर्मशास्त्रीय निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। गूढ़ ब्रह्मांडीय नामों को लिप्यंतरित किया गया और आवश्यक अवधारणाओं को स्वाभाविक हिन्दी में रखा गया। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी स्रोत-सन्निकट अनुवाद है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
