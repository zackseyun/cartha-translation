  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/004.yaml
  text: 'Seven androgynous beings appeared in Chaos. They have both masculine and feminine names:


    The feminine name is Pronoia, Sambathas, which means “week,”

    and his son is named Yao, whose feminine name is Rulership.

    Sabaoth, whose feminine name is Divinity.

    Adonaios, whose feminine name is Kingship.

    Elaios, whose feminine name is Jealousy.

    Oraios, whose feminine name is Wealth,

    and Astaphaios, whose [feminine] name [] is Sophia.


    These are the seven powers belonging to the seven heavens of Chaos. They were born as androgynous beings, corresponding to the deathless structure that existed before them, in accordance with the desire of Pistis—namely, that the likeness of what had existed from the beginning would rule until the end.


    You will discover the power exerted by these names, as well as the power of the male beings, in the (book) The Archangelic (Nature) of the Prophet Moses, and the power of the names of the female beings in the First Book of Noraia.


    Now the Primal Parent Yaldabaoth, since he possessed great authorities, created heavens for each of his offspring by speaking them into being. He made them good as dwelling places, and in each heaven he created great glories, each seven times as excellent: thrones, palaces, temples, chariots, and virginal spirits, (all the way) up to an unseen one, along with their glories. Each one possessed these in its own heaven: mighty hosts of gods, lords, angels, and archangels, countless myriads, so that they might serve.


    You will find the account of these events precisely described in the First Narration of Oraia.


    And they were completed, from this heaven up to the sixth heaven, which belongs to Sophia.


    This heaven and earth were attacked by the mischief-maker who lived beneath them all, and the six heavens trembled violently, because the hosts of Chaos knew who had attacked the heaven located beneath them. When Pistis became aware of the fracture caused by the mischief-maker, she sent out her spirit, bound him, and cast him down into Tartaros.


    [From that day], the heaven, together with [] its earth, has been established through Sophia, the daughter of Yaldabaoth, who dwells beneath them all.'
translation:
  language: hi
  text: 'अराजकता में सात उभयलिंगी सत्ताएँ प्रकट हुईं। उनके पुरुषवाची नाम भी हैं और स्त्रीवाची नाम भी:


    स्त्रीवाची नाम है प्रोनोइया—साम्बाथास, जिसका अर्थ है “सप्ताह”;

    और उसके पुत्र का नाम याओ है, जिसका स्त्रीवाची नाम प्रभुता है।

    साबाओथ, जिसका स्त्रीवाची नाम देवत्व है।

    अदोनाइओस, जिसका स्त्रीवाची नाम राजत्व है।

    एलाइओस, जिसका स्त्रीवाची नाम ईर्ष्या है।

    ओराइओस, जिसका स्त्रीवाची नाम धन-संपदा है;

    और अस्ताफाइओस, जिसका [स्त्रीवाची] नाम […] सोफिया है।[a]


    ये अराजकता के सात आकाशों से संबंधित सात शक्तियाँ हैं। वे उभयलिंगी सत्ताओं के रूप में उत्पन्न हुईं और उस अमर संरचना के अनुरूप थीं जो उनसे पहले विद्यमान थी। यह पिस्तिस की इच्छा के अनुसार हुआ, अर्थात जो आरंभ से विद्यमान था उसकी प्रतिरूपता अंत तक शासन करे।


    इन नामों की सामर्थ्य और पुरुष सत्ताओं की शक्ति का वर्णन तुम्हें ‘भविष्यद्वक्ता मूसा का प्रधान-दूतीय स्वरूप’ नामक ग्रंथ में मिलेगा, और स्त्री सत्ताओं के नामों की सामर्थ्य का वर्णन ‘नोराइया की पहली पुस्तक’ में।[b]


    अब आदि-जनक याल्दाबाओथ ने, क्योंकि उसके पास बड़े-बड़े अधिकार थे, अपने प्रत्येक वंशज के लिए वचन बोलकर आकाशों की रचना की। उसने उन्हें निवास-स्थानों के रूप में उत्तम बनाया। प्रत्येक आकाश में उसने महान महिमाएँ रचीं, जो सात गुना उत्कृष्ट थीं: सिंहासन, राजमहल, मंदिर, रथ और अक्षत आत्माएँ—एक अदृश्य सत्ता तक—और उनकी महिमाएँ। प्रत्येक के अपने-अपने आकाश में ये सब थे: देवताओं, प्रभुओं, स्वर्गदूतों और प्रधान स्वर्गदूतों की शक्तिशाली सेनाएँ—अनगिनत दस-दस हजार—ताकि वे सेवा करें।[c]


    इन घटनाओं का ठीक-ठीक वर्णन तुम्हें ‘ओराइया का पहला वृत्तांत’ में मिलेगा।


    और वे इस आकाश से लेकर छठे आकाश तक पूरे किए गए; छठा आकाश सोफिया का है।


    सबके नीचे रहने वाले उपद्रवी ने इस आकाश और पृथ्वी पर आक्रमण किया, और छहों आकाश बुरी तरह काँप उठे, क्योंकि अराजकता की सेनाएँ जानती थीं कि नीचे स्थित आकाश पर किसने आक्रमण किया था। जब पिस्तिस को उपद्रवी के कारण पड़ी दरार का पता चला, तो उसने अपनी आत्मा भेजी, उसे बाँध दिया और नीचे तारतारोस में फेंक दिया।


    [उस दिन से], आकाश अपनी […] पृथ्वी समेत, याल्दाबाओथ की पुत्री सोफिया के द्वारा स्थिर किया गया है; वही सोफिया जो उन सबके नीचे रहती है।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नाम-सूची का आरंभ और अस्ताफाइओस से जुड़ा वाक्य पांडुलिपि-साक्ष्य में कठिन तथा आंशिक रूप से अपूर्ण है। […] लुप्त पाठ को दर्शाता है।
    reason: वास्तविक पाठगत lacuna और व्याकरणिक अनिश्चितता को प्रकट करना।
  - marker: b
    text: यहाँ उल्लिखित ग्रंथों के शीर्षक अनिश्चित पुनर्निर्माण पर आधारित हैं; वर्तमान रूप में वे स्वतंत्र रूप से सुरक्षित ज्ञात नहीं हैं।
    reason: कोष्ठकयुक्त अंग्रेज़ी पुनर्निर्माण को बिना सूचना के निश्चित शीर्षक न बनाना।
  - marker: c
    text: ‘एक अदृश्य सत्ता तक’ वाला वाक्यांश संदर्भ में अस्पष्ट है; यह संभवतः श्रेणी की चरम सीमा बताता है।
    reason: दुर्बोध स्रोत-वाक्य को कृत्रिम रूप से स्पष्ट न करना।
  - marker: d
    text: '[…] उस स्थान पर लुप्त या अस्पष्ट पाठ को दर्शाता है। ‘[उस दिन से]’ भी संपादकीय पूर्ति है।'
    reason: अंतिम अनुच्छेद की दोनों पाठगत पूर्तियों को स्पष्ट करना।
lexical_decisions:
- source_word: androgynous
  choice: उभयलिंगी
  rationale: पाठ में एक ही सत्ता के पुरुषवाची और स्त्रीवाची नाम होने का स्पष्ट विचार है; ‘उभयलिंगी’ इसे संक्षेप और गरिमा से व्यक्त करता है।
- source_word: Chaos
  choice: अराजकता
  rationale: इसे व्यक्तिनाम-जैसी ब्रह्मांडीय सत्ता के रूप में रखते हुए प्रचलित हिन्दी अर्थ दिया गया है।
- source_word: powers / forces
  choice: शक्तियाँ
  rationale: ब्रह्मांडीय प्रभाव और सत्ता, दोनों अर्थों को खुला रखता है।
- source_word: verbal articulation
  choice: वचन बोलकर
  rationale: सृष्टि को वाणी से अस्तित्व में लाने का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: virginal spirits
  choice: अक्षत आत्माएँ
  rationale: ‘कुँवारी आत्माएँ’ की संभावित लैंगिक संकीर्णता से बचते हुए अविकल/अनछुए होने का भाव रखा गया है।
- source_word: myriads without number
  choice: अनगिनत दस-दस हजार
  rationale: प्राचीन संख्यात्मक मुहावरे की विशालता और मूल इकाई दोनों को व्यक्त करता है।
- source_word: Tartaros
  choice: तारतारोस
  rationale: विशिष्ट पौराणिक अधोलोक का नाम होने के कारण अर्थानुवाद के बजाय लिप्यंतरण किया गया है।
- source_word: mischief-maker
  choice: उपद्रवी
  rationale: चरित्र की विघटनकारी भूमिका बताता है, पर उसकी पहचान या नैतिक प्रकृति को पाठ से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: पिस्तिस और सोफिया जैसे नामों का अनुवाद
  choice: व्यक्तिनामों को लिप्यंतरित किया गया
  alternative: ‘विश्वास’ और ‘बुद्धि’ के रूप में अर्थानुवाद
  rationale: इस ज्ञानवादी ब्रह्मांड-वर्णन में ये व्यक्त सत्ताओं के नाम हैं; अर्थानुवाद से सामान्य अमूर्त गुण समझे जाने का जोखिम है।
- issue: याल्दाबाओथ के ‘great authorities’
  choice: ‘बड़े-बड़े अधिकार’
  alternative: ‘महान सत्ताएँ’ या ‘महान अधिकार-शक्तियाँ’
  rationale: यह अस्पष्टता सुरक्षित रखता है कि आशय उसके अपने अधिकार से है या उसके अधीन ब्रह्मांडीय सत्ताओं से।
- issue: आरंभिक नाम-सूची का व्याकरणिक असंतुलन
  choice: वाक्य-क्रम और संबंधों को यथासंभव जस का तस रखा गया
  alternative: प्रोनोइया/साम्बाथास को स्पष्ट रूप से किसी एक सत्ता से जोड़कर सूची को नियमित करना
  rationale: साक्ष्य में सूची का आरंभ कठिन और संभवतः अपूर्ण है; अनिश्चित संबंध को चुपचाप सुलझाना उचित नहीं।
- issue: ‘likeness’ का स्वरूप
  choice: ‘प्रतिरूपता’
  alternative: ‘समानता’ या ‘प्रतिरूप’
  rationale: यह किसी पूर्ववर्ती अमर संरचना से अनुरूपता का दार्शनिक भाव रखता है, बिना उसे पूर्णतः समान सत्ता घोषित किए।
- issue: अंतिम वाक्य में सोफिया की भूमिका
  choice: ‘सोफिया के द्वारा स्थिर किया गया है’
  alternative: ‘सोफिया के कारण अपने को स्थापित किया है’
  rationale: माध्यम/कारण की अस्पष्टता को बहुत अधिक व्याख्यायित किए बिना सामान्य कारक रूप रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण कथात्मक शैली में रखी गई है। ब्रह्मांडीय व्यक्तिनाम लिप्यंतरित हैं; सामान्य पदों का अर्थानुवाद किया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है और प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है, इसलिए कठिन स्थानों पर अनिश्चितता को फुटनोट और कोष्ठकों में सुरक्षित रखा गया है।
