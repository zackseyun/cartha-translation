  revised_text: 'अराजकता में सात उभयलिंगी सत्ताएँ प्रकट हुईं। उनके पुरुषवाची नाम भी हैं और स्त्रीवाची नाम भी:


    स्त्रीवाची नाम प्रोनोइया है—साम्बाथास, जिसका अर्थ है “सप्ताह”;


    और उसके पुत्र का नाम याओ है, जिसका स्त्रीवाची नाम प्रभुत्व है।


    साबाओथ, जिसका स्त्रीवाची नाम देवत्व है।


    अदोनाइओस, जिसका स्त्रीवाची नाम राजत्व है।


    एलाइओस, जिसका स्त्रीवाची नाम ईर्ष्या है।


    ओराइओस, जिसका स्त्रीवाची नाम धन-संपदा है;


    और अस्ताफाइओस, जिसका [स्त्रीवाची] नाम […] सोफिया है।[a]


    ये अराजकता के सात आकाशों से संबंधित सात शक्तियाँ हैं। वे उभयलिंगी सत्ताओं के रूप में उत्पन्न हुईं, उस अमर संरचना के अनुरूप जो उनसे पहले विद्यमान थी, पिस्तिस की इच्छा के अनुसार—अर्थात, जो आरंभ से विद्यमान था उसकी प्रतिरूपता अंत तक शासन करे।


    तुम इन नामों की प्रभावकारी शक्ति, साथ ही पुरुष सत्ताओं की शक्ति, भविष्यद्वक्ता मूसा की (पुस्तक) ‘प्रधान-स्वर्गदूतीय (प्रकृति)’ में जानोगे; और स्त्री सत्ताओं के नामों की शक्ति ‘नोराइया की पहली पुस्तक’ में।[b]


    अब आदि-जनक याल्दाबाओथ ने, क्योंकि उसके पास महान अधिकार-शक्तियाँ थीं, अपने प्रत्येक वंशज के लिए वचन बोलकर आकाशों की रचना की। उसने उन्हें निवास-स्थलों के रूप में अच्छा बनाया, और प्रत्येक आकाश में महान महिमाएँ रचीं, जो सात गुना उत्कृष्ट थीं: सिंहासन, राजमहल, मंदिर, रथ और कौमार्ययुक्त आत्माएँ—एक अदृश्य सत्ता तक—तथा उनकी महिमाएँ। हर एक के अपने आकाश में ये सब थे: देवताओं, प्रभुओं, स्वर्गदूतों और प्रधान स्वर्गदूतों की शक्तिशाली सेनाएँ, असंख्य दस-दस हज़ार, ताकि वे सेवा करें।[c]


    इन घटनाओं का ठीक-ठीक वर्णन तुम्हें ‘ओराइया का पहला वृत्तांत’ में मिलेगा।


    और वे इस आकाश से लेकर छठे आकाश तक पूरे हुए, जो सोफिया का है।


    सबके नीचे रहने वाले उपद्रवी ने इस आकाश और पृथ्वी पर आक्रमण किया, और छहों आकाश बुरी तरह काँप उठे, क्योंकि अराजकता की सेनाएँ जानती थीं कि नीचे स्थित आकाश पर किसने आक्रमण किया था। जब पिस्तिस को उपद्रवी के कारण पड़ी दरार का पता चला, तो उसने अपनी आत्मा भेजी, उसे बाँध दिया और नीचे तारतारोस में फेंक दिया।


    [उस दिन से], आकाश अपनी […] पृथ्वी समेत, याल्दाबाओथ की पुत्री सोफिया के माध्यम से स्थिर हो गया है; वही सोफिया जो उन सबके नीचे रहती है।[d]'
