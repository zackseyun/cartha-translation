base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/014.yaml
  text: '[] As she desired, Sophia, who lived in the lower heaven, received authority from Pistis. She formed great shining bodies and every star, and she placed them in the sky to shine on the earth and to determine signs of time, seasons, years, months, days, nights, minutes, and so on. In this way, the whole expanse of the sky was adorned.


    Now, when Adam of Light desired to enter his light, namely, the eighth heaven, he could not do so because of the poverty that had mingled with his light. Then he created an immense aeon for himself. Within that aeon he created six aeons and their adornments, six in number, which were seven times greater than the heavens of Chaos and their adornments.


    Now all these aeons and their adornments exist within the infinity that lies between the eighth heaven and the Chaos beneath it. They are counted together with the universe that belongs to poverty.


    If you wish to learn their structure, you will find it written in the Seventh World of the Prophet Hieralias.'
translation:
  language: hi
  text: '[] जैसा वह चाहती थी, निचले स्वर्ग में रहनेवाली सोफिया ने पिस्तिस से अधिकार पाया। उसने विशाल चमकते हुए पिंड और प्रत्येक तारा बनाया और उन्हें आकाश में रख दिया, ताकि वे पृथ्वी पर प्रकाश दें और समय के चिह्न, ऋतुएँ, वर्ष, महीने, दिन, रातें, मिनट और इसी प्रकार की अन्य अवधियाँ निर्धारित करें। इस प्रकार आकाश का पूरा विस्तार सुशोभित हो गया।


    जब ज्योति के आदम के मन में अपनी ज्योति में, अर्थात आठवें स्वर्ग में, प्रवेश करने की इच्छा हुई, तो वह ऐसा नहीं कर सका, क्योंकि निर्धनता उसकी ज्योति के साथ मिल गई थी। तब उसने अपने लिए एक विशाल आयोन[a] की रचना की। उस आयोन के भीतर उसने छह आयोन और उनकी छह सजावटें बनाईं। वे अराजकता के स्वर्गों और उनकी सजावटों से सात गुना श्रेष्ठ थीं।


    ये सभी आयोन और उनकी सजावटें उस अनंत विस्तार के भीतर विद्यमान हैं, जो आठवें स्वर्ग और उसके नीचे की अराजकता के बीच है। इन्हें निर्धनता से संबंधित विश्व के साथ गिना जाता है।


    यदि तुम उनकी संरचना जानना चाहते हो, तो वह तुम्हें भविष्यवक्ता हिएरालियास के ‘सातवें विश्व’ में लिखी हुई मिलेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आयोन’ एक पारिभाषिक शब्द है। संदर्भ के अनुसार इसका अर्थ दीर्घ युग, अलौकिक सत्ता या ब्रह्मांडीय लोक हो सकता है।
