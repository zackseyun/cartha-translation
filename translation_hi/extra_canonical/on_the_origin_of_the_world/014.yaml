lexical_decisions:
- source_word: Sophia
  choice: सोफिया
  rationale: नाम का लिप्यंतरण किया गया है; इसे केवल ‘बुद्धि’ करने से इस पात्र का विशिष्ट नाम अस्पष्ट हो जाता।
- source_word: Pistis
  choice: पिस्तिस
  rationale: विशिष्ट सत्ता/पात्र के नाम को लिप्यंतरित रखा गया; ‘विश्वास’ अनुवाद करने से व्यक्तिवाचक अर्थ खो सकता है।
- source_word: aeon
  choice: आयोन
  rationale: इस ज्ञानवादी ब्रह्मांड-वर्णन में शब्द सत्ता, लोक और दीर्घ काल—एकाधिक अर्थ रख सकता है; लिप्यंतरण इस अस्पष्टता को सुरक्षित रखता है।
- source_word: poverty
  choice: निर्धनता
  rationale: स्रोत की अमूर्त किंतु संभवतः व्यक्तिरूप शक्ति को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: Chaos
  choice: अराजकता
  rationale: ब्रह्मांडीय क्षेत्र का अर्थ व्यक्त करने के लिए अर्थानुवाद किया गया, जबकि संदर्भ में इसकी विशिष्ट संज्ञा-सदृश भूमिका बनी रहती है।
- source_word: adornments
  choice: सजावटें
  rationale: मूल साक्ष्य की बार-बार आनेवाली ठोस संज्ञा को बनाए रखा गया; इसे ‘व्यवस्थाएँ’ या ‘महिमाएँ’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: Adam of Light
  choice: ज्योति के आदम
  rationale: संबंधसूचक मूल अभिव्यक्ति को सुरक्षित रखा गया; ‘ज्योतिर्मय आदम’ कहने से गुण और संबंध के बीच की अस्पष्टता समाप्त हो जाती।
theological_decisions:
- issue: सोफिया और पिस्तिस की पहचान
  choice: दोनों को व्यक्तिवाचक नामों के रूप में लिप्यंतरित किया गया।
  alternative: ‘बुद्धि’ और ‘विश्वास’ के रूप में अनुवाद।
  rationale: पाठ में वे कार्य करनेवाली विशिष्ट सत्ताएँ हैं; सामान्य गुणों के रूप में अनुवाद धार्मिक-ब्रह्मांडीय कथानक बदल देता।
- issue: ‘उसकी ज्योति’ और आठवें स्वर्ग का संबंध
  choice: ‘अपनी ज्योति में, अर्थात आठवें स्वर्ग में’ रखा गया।
  alternative: आठवें स्वर्ग को केवल ज्योति का स्थान या स्वामित्व मानना।
  rationale: साक्ष्य का ‘namely’ दोनों को समानाधिकरण में रखता है; अनुवाद ने उसी तनाव को बनाए रखा।
- issue: निर्धनता का स्वरूप
  choice: ‘निर्धनता’ को अमूर्त संज्ञा के रूप में रखा गया।
  alternative: इसे किसी नामित दुष्ट सत्ता या भौतिक अभाव के रूप में स्पष्ट करना।
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य इसकी सत्ता-संबंधी स्थिति निश्चित नहीं करता।
- issue: छह सजावटों की संख्या
  choice: ‘छह आयोन और उनकी छह सजावटें’ किया गया।
  alternative: प्रत्येक आयोन की अनेक सजावटें या कुल छह वस्तुएँ समझना।
  rationale: अंग्रेज़ी साक्ष्य में संख्या-विन्यास कुछ असहज है; यह रूप सबसे सीधा अर्थ देता है, पर अतिरिक्त प्रणाली नहीं गढ़ता।
- issue: seven times superior
  choice: ‘सात गुना श्रेष्ठ’
  alternative: ‘सात स्तर ऊपर’ या ‘सात गुना बड़े’।
  rationale: ‘श्रेष्ठ’ तुलनात्मक मूल्य/पद को बनाए रखता है और आकार का अनावश्यक दावा नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी अपनाई गई है। आरंभिक [] को उपलब्ध साक्ष्य में पाठ-क्षति अथवा पुनर्स्थापन के संकेत के रूप में यथावत रखा गया है। प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित होने के कारण मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; नामों और ज्ञानवादी पारिभाषिक शब्दों में अनावश्यक धर्मसांप्रदायिक व्याख्या से बचा गया है।
