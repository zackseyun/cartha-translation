  - marker: a
    text: यहाँ पांडुलिपि क्षतिग्रस्त है। “और माता” पुनर्स्थापित पाठ है; इसके बाद भी एक रिक्ति है, इसलिए मूल वाक्य का कुछ अंश लुप्त हो सकता है।
    reason: स्रोत में [and mother] के बाद lacuna संकेतित है; मुख्य पाठ में उसकी अनिश्चितता दिखाना आवश्यक है।
  - marker: b
    text: “सामने” के बाद पांडुलिपि में एक रिक्ति है; कुछ शब्द लुप्त हो सकते हैं।
    reason: महल और सिंहासन के संबंध वाले वाक्य में मौजूद पाठ-क्षति संरक्षित करनी है।
lexical_decisions:
- source_word: Pistis / Pistis Sophia
  choice: पिस्तिस / पिस्तिस सोफिया
  rationale: व्यक्तिनामों को अर्थानुवाद किए बिना ध्वन्यात्मक रूप में रखा गया है, क्योंकि इस ग्रंथ में वे विशिष्ट पात्र हैं।
- source_word: Sabaoth / Yaldabaoth / Zoe
  choice: सबाओत / यल्दाबाओत / ज़ोए
  rationale: कॉप्टिक-यूनानी परंपरा के नामों का पठनीय देवनागरी लिप्यंतरण किया गया है।
- source_word: Chaos
  choice: अव्यवस्था
  rationale: इसे केवल आधुनिक वैज्ञानिक ‘कैओस’ न मानकर एक व्यक्त/ब्रह्मांडीय क्षेत्र की संज्ञा के रूप में समझने योग्य अर्थानुवाद दिया गया है।
- source_word: deathless man
  choice: अविनाशी मनुष्य
  rationale: ‘अमर’ भी संभव है, पर ‘अविनाशी’ स्रोत के deathless भाव और इस ग्रंथ की विशिष्ट मानव-आकृति संबंधी भाषा को अधिक औपचारिक रूप से रखता है।
- source_word: authorities
  choice: अधिकारी
  rationale: यहाँ ब्रह्मांडीय शासक सत्ताओं का संकेत है; ‘अधिकार’ से भेद बनाए रखने के लिए व्यक्तिवाचक बहुवचन चुना गया है।
- source_word: repentance
  choice: मन-फिराव
  rationale: यह शब्द दिशा और निष्ठा के परिवर्तन को व्यक्त करता है तथा किसी विशिष्ट सांप्रदायिक शब्दावली को आरोपित नहीं करता।
- source_word: Cherubin / Seraphin
  choice: केरूबिन / सेराफिन
  rationale: साक्ष्य में आए विशिष्ट बहुवचन-सदृश नामरूपों को सामान्यीकृत ‘करूब/सराफ’ में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: Lord of Hosts
  choice: सेनाओं का प्रभु
  rationale: उपाधि के सैन्य/स्वर्गीय अर्थ को स्पष्ट रखते हुए स्रोत की पारंपरिक प्रतिध्वनि संरक्षित की गई है।
theological_decisions:
- issue: सबाओत का अपनी माता और पिता की निंदा करना
  choice: क्षतिग्रस्त पाठ को कोष्ठक और पादटिप्पणी सहित जस का तस संकेतित किया
  alternative: केवल पिता की निंदा लिखना या माता को निश्चित रूप से शामिल करना
  rationale: पांडुलिपीय रिक्ति के कारण संबंध और वाक्य-विन्यास अनिश्चित हैं; इसे चुपचाप निश्चित करना उचित नहीं।
- issue: पिस्तिस सोफिया द्वारा प्रकाश देना ‘पिता की निंदा’ के रूप में
  choice: ‘निंदा के चिह्न के रूप में’ रखा
  alternative: पिता को दंड देने के लिए या पिता के विरुद्ध हथियार के रूप में
  rationale: स्रोत में कार्य का ठीक तात्त्विक संबंध अस्पष्ट है; अधिक व्याख्यात्मक अर्थ आरोपित नहीं किया गया।
- issue: बारह देवताओं के सापेक्ष सबाओत का स्थान
  choice: ‘ऊपर निवास करे’
  alternative: उन पर शासन करे
  rationale: स्रोत का dwell over स्थानिक और पदानुक्रमिक दोनों अर्थ दे सकता है; अनुवाद ने शासन को अनिवार्य बनाकर तनाव हल नहीं किया।
- issue: बहत्तर आकृतियों की गणना
  choice: चौंसठ आकृतियों, सात प्रधान स्वर्गदूतों और सबाओत को मिलाकर निहित बहत्तर की संरचना बनाए रखी
  alternative: गणना को संपादकीय रूप से सुधारना या समझाना
  rationale: स्रोत की विचित्र गणना को बदलना नहीं चाहिए; पाठ स्वयं ‘वह आठवाँ है’ कहता है।
- issue: दैवी/ब्रह्मांडीय पदों की बहुलता
  choice: ‘देवता’, ‘अधिकारी’, ‘प्रधान स्वर्गदूत’ जैसे भिन्न पद बनाए रखे
  alternative: सभी को स्वर्गदूत या दुष्टात्माएँ कहना
  rationale: ग्रंथ की अपनी ब्रह्मांड-रचना और तात्त्विक तनाव को किसी बाद की संप्रदायगत प्रणाली में समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। मूल कॉप्टिक की प्रत्यक्ष समीक्षा अभी लंबित है; इसलिए यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर स्रोत-सचेत रूप से आधारित है। पांडुलिपीय अनिश्चितताओं को पादटिप्पणियों में स्पष्ट किया गया है और अनावश्यक सांप्रदायिक शब्दावली से बचा गया है।
