  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/006.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, heard the voice of Pistis, he sang praises to her. At Pistis’s command, he denounced his father [and mother] [], and he praised her because she had taught them about the deathless man and his light. Then Pistis Sophia pointed her finger and poured some of the light from her own light onto him, as a denunciation of his father. When Sabaoth was illuminated, he received great authority over all the hosts of Chaos. From that day on, he has been called “Lord of Hosts.”


    He despised his father, the Darkness, and his mother, the Abyss. He hated his sister, the thought of the Primal Parent, who had moved back and forth over the waters. Because of his light, all the authorities of Chaos became jealous of him. When they grew troubled, they waged a great war in the seven heavens.


    When Pistis Sophia witnessed the war, she sent seven archangels from her light to Sabaoth. They carried him up to the seventh heaven and stood before him as attendants. She also sent him three additional archangels and established for him the kingdom that is over everyone, so that he could dwell above the twelve gods of Chaos.


    Now, when Sabaoth had received the dwelling place of rest as a reward for his repentance, Pistis also gave him her daughter Zoe, together with great authority, so that she could teach him about everything that exists in the eighth heaven. Because he possessed authority, before anything else he built a palace for himself. It is immense and magnificent, seven times larger than all those that exist in the seven heavens. In front of [] his palace, he created an immense throne that stood on a four-faced chariot called “Cherubin.”


    The Cherubin have eight shapes on each of the four corners: forms of lions, calves, humans, and eagles, so that all the forms total sixty-four. Seven archangels stand in front of it. He [4] is the eighth, and he possesses authority. All the forms total seventy-two. In addition, the seventy-two gods derived their shape from this chariot so that they could rule over the seventy-two languages of the nations. At that throne he also created serpent-like angels called “Seraphin,” who always glorify him.'
translation:
  language: hi
  text: 'जब यल्दाबाओत के पुत्र सबाओत ने पिस्तिस की आवाज़ सुनी, तो उसने उसकी स्तुति गाई। पिस्तिस की आज्ञा पर उसने अपने पिता [और माता] [a] की निंदा की, और उसकी स्तुति की, क्योंकि उसने उन्हें अविनाशी मनुष्य और उसके प्रकाश के विषय में सिखाया था। तब पिस्तिस सोफिया ने अपनी उँगली से संकेत किया और अपने ही प्रकाश में से कुछ प्रकाश उस पर उँडेल दिया—उसके पिता की निंदा के रूप में। जब सबाओत प्रकाशमान हो गया, तो उसे अव्यवस्था की सारी सेनाओं के विरुद्ध बड़ा अधिकार मिला। उस दिन से वह “सेनाओं का प्रभु” कहलाता है।



    उसने अपने पिता, अंधकार, और अपनी माता, अथाह गहराई, को तुच्छ जाना। उसने अपनी बहन—आदि-जनक का विचार, जो जल के ऊपर इधर-उधर घूमता रहा था—से घृणा की। उसके प्रकाश के कारण अव्यवस्था के सभी अधिकारी उससे ईर्ष्या करने लगे। व्याकुल होकर उन्होंने सातों स्वर्गों में एक बड़ा युद्ध छेड़ दिया।



    जब पिस्तिस सोफिया ने वह युद्ध देखा, तो उसने अपने प्रकाश में से सात प्रधान स्वर्गदूत सबाओत के पास भेजे। वे उसे उठाकर सातवें स्वर्ग में ले गए और सेवकों के रूप में उसके सामने खड़े हो गए। उसने उसके पास तीन और प्रधान स्वर्गदूत भी भेजे और उसके लिए वह राज्य स्थापित किया जो सबके ऊपर है, ताकि वह अव्यवस्था के बारह देवताओं के ऊपर निवास करे।



    जब सबाओत ने अपने मन-फिराव के प्रतिफल के रूप में विश्राम का निवास-स्थान पा लिया, तब पिस्तिस ने बड़े अधिकार के साथ अपनी पुत्री ज़ोए भी उसे दी, ताकि वह उसे आठवें स्वर्ग में विद्यमान हर वस्तु के विषय में सिखाए। अधिकार प्राप्त होने के कारण उसने सबसे पहले अपने लिए एक महल बनाया। वह अत्यंत विशाल और भव्य है—सातों स्वर्गों में स्थित सभी महलों से सात गुना बड़ा। अपने महल के सामने [b] उसने एक अत्यंत विशाल सिंहासन बनाया, जो चार मुखों वाले एक रथ पर स्थित था; उस रथ का नाम “केरूबिन” है।



    केरूबिन के चारों कोनों में से प्रत्येक पर आठ आकृतियाँ हैं—सिंहों, बछड़ों, मनुष्यों और उकाबों की आकृतियाँ—इस प्रकार सभी आकृतियों की कुल संख्या चौंसठ है। उसके सामने सात प्रधान स्वर्गदूत खड़े हैं। वह स्वयं आठवाँ है और अधिकार रखता है। सभी आकृतियों की कुल संख्या बहत्तर है। इसके अतिरिक्त, बहत्तर देवताओं ने इसी रथ से अपनी आकृति पाई, ताकि वे राष्ट्रों की बहत्तर भाषाओं पर शासन करें। उस सिंहासन के पास उसने सर्प जैसे स्वर्गदूत भी बनाए, जिन्हें “सेराफिन” कहा जाता है और जो सदा उसकी महिमा करते हैं।'
