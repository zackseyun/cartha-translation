translation:
  language: hi
  text: 'इसके बाद न्याय ने परादीस की सृष्टि की। वह सुंदर था और चंद्रमा तथा सूर्य की कक्षाओं से परे, आनंद-देश के भीतर, पूर्व में पत्थरों के बीच स्थित था। सुंदर और संतोष देनेवाले वृक्षों के बीच अभिलाषा वास करती है। और परमेश्वर की इच्छा के अनुसार अनंत जीवन का वृक्ष परादीस के उत्तर में प्रकट हुआ, ताकि उन पवित्र जनों की आत्माएँ अमर हो सकें, जो युग की पूर्णता के समय तुच्छ आकारोंवाले रूपों से बाहर निकलेंगी।


    जीवन के वृक्ष का रंग सूर्य के समान है, और उसकी डालियाँ मनोहर हैं। उसके पत्ते सरो के पत्तों के समान हैं। उसका फल सफेद अंगूरों के गुच्छे के समान है। उसकी ऊँचाई स्वर्ग तक पहुँचती है। उसके पास ज्ञान का वृक्ष है, जिसमें परमेश्वर का सामर्थ्य है। उसकी महिमा पूर्ण प्रकाश में चमकते चंद्रमा के समान है, और उसकी डालियाँ मनोहर हैं। उसके पत्ते अंजीर के पत्तों के समान हैं। उसका फल अच्छे और संतोष देनेवाले खजूर के समान है। यह वृक्ष परादीस के उत्तर में है, ताकि वह आत्माओं को दुष्टात्माओं की सुस्ती से झकझोरकर जगा सके, और वे जीवन के वृक्ष के निकट जाकर उसका फल खाएँ और इस प्रकार शासक शक्तियों और उनके स्वर्गदूतों का खंडन करें।


    पवित्र शास्त्र में इस वृक्ष के प्रभाव का विस्तार से वर्णन है:[a] “तू ज्ञान का वह वृक्ष है जो परादीस में है, जिसका फल पहले मनुष्य ने खाया और जिसने उसकी बुद्धि खोल दी। तब उसने अपनी स्त्री-संगी से प्रेम किया और अन्य परायी प्रतिमाओं का खंडन किया—यहाँ तक कि उन्हें तुच्छ जाना।”[b]


    इसके बाद जैतून का वृक्ष अंकुरित हुआ, ताकि वह धार्मिकता के उन राजाओं और महायाजकों को पवित्र करे जो अंतिम दिनों में प्रकट होनेवाले थे; क्योंकि जैतून का वृक्ष प्रथम आदम के प्रकाश में से प्रकट हुआ था, जिससे उन्हें वह अभिषेक मिल सके जो उन्हें प्राप्त होना था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह उद्धरण किस ज्ञात शास्त्रीय ग्रंथ से लिया गया है, यह निश्चित नहीं है।
    reason: पाठ इसे ‘पवित्र शास्त्र’ कहता है, पर उद्धरण की पहचान अस्पष्ट है।
  - marker: b
    text: अंग्रेज़ी साक्ष्य में इस स्थान पर रिक्त कोष्ठक थे, जो संभवतः पाठ-हानि या अनिश्चित पुनर्स्थापन का संकेत हैं; उपलब्ध वाक्य के अर्थ को बिना पूर्ति के प्रस्तुत किया गया है।
    reason: पांडुलिपीय अनिश्चितता को पाठक के सामने प्रकट रखना आवश्यक है।
lexical_decisions:
- source_word: Justice
  choice: न्याय
  rationale: मूल साक्ष्य में इसे सृष्टि करनेवाली व्यक्तिवाचक सत्ता की तरह प्रस्तुत किया गया है; शाब्दिक अर्थ और व्यक्तिकरण दोनों बनाए रखे गए हैं।
- source_word: Paradise
  choice: परादीस
  rationale: विशिष्ट ब्रह्मांडीय स्थान के लिए परिचित धार्मिक पारिभाषिक शब्द चुना गया, ताकि इसे सामान्य ‘उद्यान’ न समझा जाए।
- source_word: Land of Delight
  choice: आनंद-देश
  rationale: स्थाननाम-सदृश प्रयोग को बनाए रखते हुए सहज हिंदी रूप दिया गया है।
- source_word: desire
  choice: अभिलाषा
  rationale: वाक्य की रहस्यमय और संभवतः व्यक्तिकृत अस्पष्टता को किसी विशिष्ट कामना के रूप में सीमित किए बिना रखा गया है।
- source_word: lowly shaped forms
  choice: तुच्छ आकारोंवाले रूप
  rationale: असामान्य स्रोत-वाक्यांश को सहज बनाते हुए उसकी अवमाननापूर्ण और देहात्मक अस्पष्टता सुरक्षित रखी गई है।
- source_word: tree of knowledge
  choice: ज्ञान का वृक्ष
  rationale: पारंपरिक और अर्थतः सीधा रूप।
- source_word: authorities
  choice: शासक शक्तियाँ
  rationale: सिर्फ सांसारिक अधिकारियों का भ्रम टालते हुए इस ग्रंथ की ब्रह्मांडीय सत्ताओं का भाव व्यक्त किया गया है।
- source_word: anointing
  choice: अभिषेक
  rationale: राजाओं और महायाजकों के संदर्भ में स्वाभाविक धार्मिक-पारिभाषिक शब्द।
theological_decisions:
- issue: ‘न्याय’ का व्यक्तिकरण
  choice: ‘न्याय ने ... सृष्टि की’
  alternative: ‘न्याय नामक सत्ता ने ... बनाया’
  rationale: स्रोत स्वयं सत्ता की प्रकृति नहीं समझाता; अतिरिक्त व्याख्या जोड़े बिना व्यक्तिकृत व्याकरण रखा गया है।
- issue: वृक्ष द्वारा आत्माओं को जगाना
  choice: वृक्ष को वाक्य का कर्ता बनाए रखा
  alternative: वृक्ष का फल या ज्ञान आत्माओं को जगाता है
  rationale: स्रोत की असामान्य धर्मवैचारिक अभिव्यक्ति को तर्कसंगत बनाकर बदला नहीं गया।
- issue: शासक शक्तियों और उनके स्वर्गदूतों का खंडन
  choice: ‘खंडन करें’
  alternative: ‘त्याग दें’ या ‘धता बताएँ’
  rationale: denounce की सार्वजनिक अस्वीकृति/निंदा का भाव रखा गया, पर अधिक बोलचाल या संप्रदायगत शब्दावली से बचा गया।
- issue: प्रथम आदम का प्रकाश
  choice: ‘प्रथम आदम के प्रकाश में से’
  alternative: ‘प्रथम आदम से निकले प्रकाश में से’
  rationale: स्रोत की संबंधगत अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
- issue: जैतून के वृक्ष से मिलनेवाला अभिषेक
  choice: उद्देश्य और भावी प्राप्ति दोनों को बनाए रखा
  alternative: जैतून के तेल को स्पष्ट रूप से अभिषेक का साधन कहना
  rationale: ‘तेल’ स्रोत में प्रत्यक्ष नहीं है; इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। लंबे वाक्यों को अर्थखंडों में बाँटा गया है, पर रहस्यमय ब्रह्मांड-वर्णन और वास्तविक अस्पष्टताएँ सुरक्षित रखी गई हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण मसौदा अनंतिम है। मूल के नंगे पृष्ठ-संकेत [11] और [12] मुख्य पाठ में नहीं रखे गए; वास्तविक पाठालोचनात्मक टिप्पणियों के लिए [a] और [b] लगाए गए हैं।
