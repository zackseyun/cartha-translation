  revised_text: 'तब आदि-पिता ने अपने साथ रहनेवालों के सामने मनुष्य के विषय में अपना मत प्रकट किया। तब उनमें से हर एक ने अपना वीर्य पृथ्वी की नाभि के केंद्र में डाल दिया।


    उस दिन से सात शासकों ने मिलकर मनुष्य को उसके शरीर समेत अपने शरीर के समान गढ़ा; फिर भी उसका प्रतिरूप उस मनुष्य के समान था जो उन्हें दिखाई दिया था। उसे एक-एक अंग करके गढ़ा गया, और उनके प्रधान ने मस्तिष्क और स्नायु-तंत्र बनाया।


    इसके बाद वह उस व्यक्ति के समान दिखाई दिया जो उससे पहले विद्यमान था। वह [] जीवात्मा वाला मनुष्य बन गया और उसका नाम आदम रखा गया, अर्थात् “पिता,” उस व्यक्ति के नाम के अनुसार जो उससे पहले विद्यमान था। जब उन्होंने आदम को पूरा गढ़ लिया, तो उसने उसे निर्जीव पात्र की तरह छोड़ दिया, क्योंकि उसका रूप गर्भपात हुए भ्रूण जैसा था और उसके भीतर आत्मा नहीं थी।[a]


    जब प्रधान शासक को पिस्तिस की बात याद आई, तो वह डर गया कि कहीं सच्चा मनुष्य उसके गढ़े हुए रूप में प्रवेश करके उसका स्वामी न बन जाए। इसीलिए वह चालीस दिनों तक अपने गढ़े हुए रूप से दूर रहा; वह रूप तब जीवात्मा-विहीन था। वह पीछे हट गया और उसे छोड़ दिया।


    चालीसवें दिन सोफिया ज़ोए ने आदम में अपनी श्वास भेजी, जो जीवात्मा-विहीन था। वह भूमि पर हिलने-डुलने लगा, पर सीधा खड़ा नहीं हो सका।


    फिर जब सातों शासक आए, तो उसे देखकर बहुत घबरा गए। वे उसके पास आए और उसे पकड़ लिया। उसने उसके भीतर की श्वास से कहा, “तुम कौन हो? और यहाँ कहाँ से आई हो?”[b]


