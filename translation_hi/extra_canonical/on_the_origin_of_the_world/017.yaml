  text: 'Then the Primal Parent gave those who dwelt with him an opinion regarding the man. Each one of them then cast his sperm into the center of the navel of the earth.


    From that day, the seven archons fashioned man together with his body to resemble their own body, yet his likeness resembled the man who had appeared to them. His shaping occurred one part at a time, and their leader formed the brain as well as the nervous system.


    Afterward, he appeared like the one who had existed prior to him. He became [] a man possessing a soul, and he was called Adam, that is, “Father,” in accord with the name of the one who had existed prior to him. When they had completed Adam, he forsook him like a lifeless vessel, since he had taken on form like an abortion, without a spirit inside him.


    When the chief archon recalled the speech of Pistis, he feared that the true man might enter into his shaped form and become its lord. This is why he departed from his shaped form for forty days; it then lacked a soul. He retreated and forsook it.


    On the fortieth day, Sophia Zoe sent her breath into Adam, who was without soul. He began to move on the ground, and he was unable to stand erect.


    Next, when the seven archons arrived, they saw him and became deeply troubled. They approached him and seized him, and he spoke to the breath inside him: “Who are you? And from where did you come to here?”


    It answered and said: “I have come from the force of the man in order to ruin your work.” Upon hearing this, they glorified him, because he granted them respite from the fear and the apprehension in which they found themselves.


    They then called that day “Rest,” because they had rested from work. When they saw that Adam was able to stand erect, they rejoiced, and they took him and placed him inside Paradise, and they retreated up to their heavens.'
translation:
  language: hi
  text: 'तब आदि-पिता ने अपने साथ रहनेवालों को मनुष्य के विषय में अपना विचार बताया। तब उनमें से हर एक ने अपना वीर्य पृथ्वी की नाभि के केंद्र में डाल दिया।


    उस दिन से सात शासकों ने मिलकर मनुष्य और उसके शरीर को अपने शरीर के समान गढ़ा; फिर भी उसका स्वरूप उस मनुष्य के समान था जो उन्हें दिखाई दिया था। उसे एक-एक अंग करके गढ़ा गया, और उनके प्रधान ने मस्तिष्क और स्नायु-तंत्र बनाया।


    इसके बाद वह उस पहले से विद्यमान मनुष्य के समान दिखाई दिया। वह [] प्राणयुक्त मनुष्य बन गया और उसका नाम आदम रखा गया, अर्थात् “पिता,” उस मनुष्य के नाम के अनुसार जो उससे पहले विद्यमान था। जब उन्होंने आदम को पूरा गढ़ लिया, तो उसने उसे निर्जीव पात्र की तरह छोड़ दिया, क्योंकि वह गर्भपात से निकले भ्रूण जैसा आकार तो पा चुका था, पर उसके भीतर आत्मा नहीं थी।[a]


    जब प्रधान शासक को पिस्तिस की बात याद आई, तो वह डर गया कि कहीं सच्चा मनुष्य उसके गढ़े हुए रूप में प्रवेश करके उसका स्वामी न बन जाए। इसीलिए वह चालीस दिनों तक अपने गढ़े हुए रूप से दूर रहा; वह रूप तब प्राणहीन था। वह पीछे हट गया और उसे छोड़ दिया।


    चालीसवें दिन सोफिया ज़ोए ने आदम में अपनी श्वास भेजी, जो प्राणहीन था। वह भूमि पर हिलने-डुलने लगा, पर सीधा खड़ा नहीं हो सका।


    फिर जब सातों शासक आए, तो उसे देखकर बहुत घबरा गए। वे उसके पास आए और उसे पकड़ लिया। प्रधान शासक ने उसके भीतर की श्वास से कहा, “तुम कौन हो? और यहाँ कहाँ से आई हो?”[b]


    उसने उत्तर दिया, “मैं मनुष्य की शक्ति से तुम्हारे काम को नष्ट करने आई हूँ।” यह सुनकर उन्होंने उसका महिमामंडन किया, क्योंकि उसने उन्हें उस भय और आशंका से राहत दी जिसमें वे पड़े थे।[c]


    तब उन्होंने उस दिन का नाम “विश्राम” रखा, क्योंकि उन्होंने अपने काम से विश्राम पाया था। जब उन्होंने देखा कि आदम सीधा खड़ा हो सकता है, तो वे आनन्दित हुए। उन्होंने उसे ले जाकर स्वर्गोद्यान के भीतर रख दिया और स्वयं ऊपर अपने-अपने आकाशों में लौट गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “गर्भपात से निकले भ्रूण” का चित्र अधूरे, निष्प्राण रूप को दर्शाता है। “प्राण” और “आत्मा” स्रोत में अलग पदों का प्रतिनिधित्व करते हैं।
    reason: कठोर उपमा और soul/spirit के अनुवाद-भेद को स्पष्ट करना।
  - marker: b
    text: उपलब्ध पाठ में बोलनेवाले का संदर्भ व्याकरणतः कुछ अस्पष्ट है; प्रसंग के आधार पर इसे प्रधान शासक माना गया है।
    reason: सर्वनाम की वास्तविक अस्पष्टता को दर्ज करना।
  - marker: c
    text: “उसका” किसे सूचित करता है—आदम, भीतर की श्वास, या किसी अन्य निकट संदर्भ को—यह निश्चित नहीं है।
    reason: महिमामंडन के कर्म-संदर्भ की अनिश्चितता सुरक्षित रखना।
lexical_decisions:
- source_word: Primal Parent
  choice: आदि-पिता
  rationale: यह पद मूल आद्य जनक की धारणा को संक्षिप्त और गरिमापूर्ण हिन्दी में रखता है; लिंग-निरपेक्ष ‘आदि-जनक’ सम्भव है, पर आगे ‘उसने/अपने’ का पुल्लिंग संदर्भ और ‘Father’ की व्याख्या ‘आदि-पिता’ का समर्थन करती है।
- source_word: archons
  choice: शासक
  rationale: विशिष्ट ग्नॉस्टिक पद का अर्थ सामान्य पाठक तक पहुँचाने के लिए ‘शासक’ चुना गया; पहली बार संख्या सहित प्रयोग से उनका विशिष्ट समूह स्पष्ट रहता है।
- source_word: sperm
  choice: वीर्य
  rationale: स्रोत की शारीरिक और सृष्टि-संबंधी भाषा को शिष्टोक्ति से नरम किए बिना सीधा रखा गया है।
- source_word: likeness
  choice: स्वरूप
  rationale: ‘समानता’ की अपेक्षा मनुष्य के दृश्य प्रतिरूप का अर्थ स्वाभाविक ढंग से देता है, जबकि ‘समान’ तुलना को बनाए रखता है।
- source_word: nervous system
  choice: स्नायु-तंत्र
  rationale: आधुनिक मानक हिन्दी का स्पष्ट शारीरिक पद।
- source_word: soul / without soul
  choice: प्राणयुक्त / प्राणहीन
  rationale: इस अनुच्छेद में soul और breath के निकट संबंध को ध्यान में रखकर जीवित करनेवाले प्राण का भाव रखा गया है; ‘आत्मा’ को spirit के लिए सुरक्षित रखा गया है।
- source_word: spirit
  choice: आत्मा
  rationale: soul से भेद बनाए रखने और भीतर अनुपस्थित आध्यात्मिक तत्व को व्यक्त करने के लिए।
- source_word: breath
  choice: श्वास
  rationale: सोफिया ज़ोए द्वारा भेजे गए सजीवकारी तत्व की मूर्त ‘breath’ भाषा को बनाए रखता है और इसे स्वतः ‘आत्मा’ नहीं बनाता।
- source_word: Paradise
  choice: स्वर्गोद्यान
  rationale: केवल ‘स्वर्ग’ कहने से स्थान का उद्यान-संबंधी अर्थ खो सकता था; ‘स्वर्गोद्यान’ स्पष्ट और परिचित है।
theological_decisions:
- issue: आदम के नमूने के रूप में पूर्ववर्ती ‘मनुष्य’ की पहचान
  choice: ‘उस पहले से विद्यमान मनुष्य’ और ‘सच्चा मनुष्य’ को अलग वर्णनात्मक पदों के रूप में रखा गया
  alternative: दोनों को किसी निश्चित स्वर्गीय आदम या नामित सत्ता के रूप में पहचानना
  rationale: स्रोत स्वयं इस अंश में पूर्ण पहचान स्पष्ट नहीं करता; अतः ग्नॉस्टिक ब्रह्मांड-विज्ञान की वास्तविक अस्पष्टता सुरक्षित रखी गई।
- issue: soul, spirit और breath का संबंध
  choice: क्रमशः ‘प्राण’, ‘आत्मा’ और ‘श्वास’ द्वारा भेद रखा गया
  alternative: तीनों को ‘आत्मा’ कहना
  rationale: एकरूप अनुवाद से कथा का तनाव मिट जाता कि गढ़ा हुआ शरीर पहले प्राणहीन/आत्मारहित है और बाद में श्वास उसमें भेजी जाती है।
- issue: शासकों द्वारा श्वास/उसका महिमामंडन
  choice: ‘उन्होंने उसका महिमामंडन किया’ में सर्वनाम की संदिग्धता बनाए रखी
  alternative: स्पष्ट करना कि उन्होंने आदम, श्वास, या प्रधान शासक की महिमा की
  rationale: उपलब्ध साक्ष्य में सर्वनाम का निश्चित संदर्भ स्पष्ट नहीं है; अनुवाद ने किसी धर्मवैज्ञानिक समाधान को आरोपित नहीं किया।
- issue: ‘Rest’ और सृष्टि-विश्राम का संकेत
  choice: नाम को “विश्राम” रखा और कारणवाचक पुनरुक्ति बनाए रखी
  alternative: इसे सीधे ‘सब्त’ कहना
  rationale: ‘सब्त’ कहने से यहूदी संस्थागत अर्थ स्रोत से अधिक स्पष्ट रूप से आरोपित हो सकता था; ‘विश्राम’ शब्द-खेल को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ग्नॉस्टिक तकनीकी नाम ‘पिस्तिस’ और ‘सोफिया ज़ोए’ लिप्यंतरित किए गए हैं। स्रोत-भाषा समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है। पांडुलिपीय रिक्ति/अनिश्चित पुनर्स्थापन को मूल की तरह [] से बनाए रखा गया है।
