base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: hi
  text: 'जल में पिस्तिस की प्रतिरूप-छवि देखकर आदिम जनक बहुत शोकित हुआ। विशेषकर जब उसने उसकी आवाज़ सुनी, जो उस पहली आवाज़ जैसी थी जिसने जल में से उसे पुकारा था, तो वह कराह उठा। उसे समझ में आ गया कि उसी ने उसे नाम दिया था। वह अपने पाप के कारण लज्जित हुआ। जब उसे सचमुच पता चला कि उससे पहले एक मृत्युहीन ज्योतिर्मय मनुष्य अस्तित्व में था, तो वह बहुत व्याकुल हो गया; क्योंकि वह पहले ही सभी देवताओं और उनके स्वर्गदूतों के सामने घोषणा कर चुका था, “मैं ही वह हूँ जो परमेश्वर है। मेरे सिवा और कुछ भी अस्तित्व में नहीं है।” उसने यह इस डर से कहा था कि कहीं उन्हें पता न चल जाए कि उससे पहले कोई और अस्तित्व में था और वे उस पर दोष न लगाएँ।


    फिर भी, विवेक से रहित होने के कारण वह दोष लगाए जाने की संभावना पर हँसा और उतावलेपन से काम लिया। उसने कहा, “यदि [पाठ लुप्त][a] मुझसे पहले कुछ अस्तित्व में था, तो वह सामने आए, ताकि हम उसकी ज्योति देखें।” और तत्काल—देखो!—ऊपर आठवें स्वर्ग में से ज्योति प्रकट हुई और पृथ्वी के सभी आकाशों से होकर गुज़री।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध पाठ में रिक्ति या क्षति का संकेत है; लुप्त शब्दों को निश्चित रूप से पुनर्स्थापित नहीं किया जा सकता।
    reason: अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य के खाली कोष्ठक को पारदर्शी रूप से दर्शाने और अनुमानित पाठ न जोड़ने के लिए।
lexical_decisions:
- source_word: Pistis
  choice: पिस्तिस
  rationale: यहाँ यह एक विशिष्ट सत्ता का नाम है; ‘विश्वास’ अनुवाद करने से व्यक्तिवाचक संदर्भ धुँधला पड़ सकता था।
- source_word: Primal Parent
  choice: आदिम जनक
  rationale: मूल साक्ष्य में लिंग पूरी तरह स्पष्ट नहीं है; ‘जनक’ गरिमामय और स्वाभाविक है, यद्यपि हिन्दी व्याकरण में पुल्लिंग रूप आवश्यक हुआ।
- source_word: likeness
  choice: प्रतिरूप-छवि
  rationale: ‘समानता’ की अपेक्षा जल में दिखाई देने वाले रूप या प्रतिबिंब का भाव अधिक स्पष्ट करता है, जबकि उसकी सटीक प्रकृति को निर्णीत नहीं करता।
- source_word: deathless man of light
  choice: मृत्युहीन ज्योतिर्मय मनुष्य
  rationale: ‘deathless’ और ‘of light’ दोनों तत्त्व सुरक्षित रखे गए हैं; ‘अमर’ से संभव दार्शनिक अर्थ-संकोच टाला गया है।
- source_word: denounce
  choice: दोष लगाएँ
  rationale: यह सार्वजनिक आरोप या निंदा, दोनों की संभावना खुली रखता है और प्रसंग में स्वाभाविक है।
- source_word: eighth heaven
  choice: आठवाँ स्वर्ग
  rationale: ग्रंथ की स्तरित ब्रह्मांड-कल्पना को बिना व्याख्यात्मक विस्तार के औपचारिक रूप से सुरक्षित रखता है।
- source_word: all the heavens of the earth
  choice: पृथ्वी के सभी आकाश
  rationale: असामान्य ब्रह्मांड-वर्णन को सहज बनाकर मिटाने के बजाय उसकी मूल संरचना बनाए रखी गई है।
theological_decisions:
- issue: आदिम जनक का ईश्वर होने का दावा
  choice: “मैं ही वह हूँ जो परमेश्वर है। मेरे सिवा और कुछ भी अस्तित्व में नहीं है।”
  alternative: “मैं परमेश्वर हूँ और मेरे अतिरिक्त कोई नहीं है।”
  rationale: स्रोत की दोहरी घोषणा और उसके निरपेक्ष अस्तित्व-दावे को बनाए रखा गया है; इसे बाइबिल के किसी परिचित सूत्र में समतल नहीं किया गया।
- issue: उससे पहले विद्यमान ज्योतिर्मय मनुष्य की प्रकृति
  choice: “एक मृत्युहीन ज्योतिर्मय मनुष्य”
  alternative: “अमर प्रकाश-मानव”
  rationale: इस सत्ता की पहचान या धर्मवैज्ञानिक स्थिति को नाम देकर तय नहीं किया गया; स्रोत की रहस्यमय अभिव्यक्ति सुरक्षित है।
- issue: प्रकट होने वाली ज्योति और ज्योतिर्मय मनुष्य का संबंध
  choice: दोनों को अलग वर्णन के रूप में रखा गया
  alternative: प्रकट ज्योति को उसी मनुष्य का प्रत्यक्ष प्राकट्य कहना
  rationale: अंश संबंध का संकेत दे सकता है, पर उसे स्पष्टतः समान नहीं ठहराता; इसलिए अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, कथात्मक शैली रखी गई है। वाक्यों को पठनीय बनाया गया है, पर ग्नॉस्टिक ब्रह्मांड-वर्णन, असामान्य ईश्वर-दावा और पाठगत रिक्ति को सरल बनाकर हटाया नहीं गया। उपलब्ध आधार कॉप्टिक मूल की प्रत्यक्ष समीक्षा नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; अतः यह स्रोत-भाषा समीक्षा लंबित रहते हुए सावधानीपूर्वक तैयार किया गया प्रारूप है।
