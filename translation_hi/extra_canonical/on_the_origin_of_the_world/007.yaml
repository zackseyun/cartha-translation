    The place he sits is on a throne of light <in a> large cloud covering him, and no one dwelt with him inside the cloud except Sophia, <the daughter of> Pistis, who taught him concerning all the entities that exist inside the eighth heaven, in order to be able to create the likenesses of those entities, so that his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now, Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day, right has been called “justice,” and left has been called “evil.” On account of this, all of them obtained an aeon in the assembly of justice, and evil stands over [5] every created entity.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/007.yaml
  text: 'After this, he created an assembly of angels—countless thousands and tens of thousands—which looked like the assembly in the eighth heaven. He also created a firstborn called “Israel,” that is, “the Man Who Sees God,” and another being called “Jesus Christ.” This being looks like the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne, glorifying him. The seven virgins stand before her, holding thirty harps, lyres, and [] trumpets and glorifying him. All the angelic hosts glorify him and praise him.


    The place where he sits is a throne of light <in a> great cloud that covers him. No one lived with him inside the cloud except Sophia, <the daughter of> Pistis. She taught him about all the beings that exist within the eighth heaven so that he could create likenesses of them and his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day on, the right has been called “justice,” and the left has been called “evil.” Because of this, all of them received an aeon in the assembly of justice, and evil stands over every created being [5].'
translation:
  language: hi
  text: 'इसके बाद उसने स्वर्गदूतों की एक सभा बनाई—हज़ारों पर हज़ार और दस हज़ारों पर दस हज़ार—जो आठवें स्वर्ग की सभा के समान दिखाई देती थी। उसने एक पहलौठे को भी बनाया, जिसका नाम “इस्राएल,” अर्थात् “वह मनुष्य जो परमेश्वर को देखता है,” रखा गया; और एक दूसरे अस्तित्व को, जिसका नाम “यीशु मसीह” था। वह उस उद्धारकर्ता के समान दिखाई देता है जो ऊपर आठवें स्वर्ग में रहता है और उसके दाहिने हाथ एक पवित्र सिंहासन पर बैठता है। उसके बाएँ हाथ पवित्र आत्मा की कुँवारी सिंहासन पर बैठी उसकी महिमा करती है। उसके सामने सात कुँवारियाँ खड़ी हैं; वे तीस वीणाएँ, सारंगियाँ और [a] तुरहियाँ थामे हुए उसकी महिमा करती हैं। स्वर्गदूतों की सारी सेनाएँ उसकी महिमा करती और उसकी स्तुति करती हैं।


    जिस स्थान पर वह बैठता है, वहाँ प्रकाश का एक सिंहासन है, <एक> विशाल बादल में, जो उसे ढके हुए है। उस बादल के भीतर पिस्तिस <की पुत्री> सोफिया को छोड़ उसके साथ कोई नहीं रहता था। उसने उसे आठवें स्वर्ग के भीतर विद्यमान सभी अस्तित्वों के विषय में शिक्षा दी, ताकि वह उनकी प्रतिकृतियाँ बना सके और उसका राज्य अराजकता के स्वर्गों और उनकी सेनाओं के अंत तक बना रहे।


    फिर पिस्तिस सोफिया ने उसे अंधकार से अलग किया और अपने दाहिने बुलाया, और आदि-जनक को अपने बाएँ रखा। उस दिन से दाहिना “न्याय” और बायाँ “बुराई” कहलाया। इसी कारण उन सबको न्याय की सभा में एक युग मिला, और बुराई हर सृजित अस्तित्व पर अधिकार रखती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: साक्ष्य में इस स्थान पर शब्द लुप्त है; इसलिए रिक्ति को चिह्नित किया गया है।
    reason: मूल गवाह के वर्गाकार कोष्ठकों में दर्शाए गए पाठ-अभाव को पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: assembly
  choice: सभा
  rationale: ‘सभा’ स्वर्गीय समुदाय और संगठित समवेत समूह—दोनों अर्थों को सहज रूप से व्यक्त करता है।
- source_word: myriads
  choice: दस हज़ारों पर दस हज़ार
  rationale: प्राचीन अतिशयोक्तिपूर्ण गणना और असंख्य विशाल समूह का बोध बनाए रखने के लिए।
- source_word: eighth heaven
  choice: आठवाँ स्वर्ग
  rationale: पाठ की विशिष्ट ब्रह्मांड-रचना को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: entity/entities
  choice: अस्तित्व/अस्तित्वों
  rationale: ‘प्राणी’ कहने से चेतन जीव का अर्थ अनावश्यक रूप से निश्चित हो जाता; ‘अस्तित्व’ व्यापक और तटस्थ है।
- source_word: firstborn
  choice: पहलौठा
  rationale: जन्म-क्रम और संभावित धार्मिक अर्थच्छाया दोनों को सुरक्षित रखने वाला परिचित बाइबलीय शब्द।
- source_word: Virgin of the holy Spirit
  choice: पवित्र आत्मा की कुँवारी
  rationale: संबंधसूचक मूल अभिव्यक्ति की अस्पष्टता को बनाए रखा गया है; इसे ‘कुँवारी पवित्र आत्मा’ बनाकर समानाधिकरण निश्चित नहीं किया गया।
- source_word: harps, lyres
  choice: वीणाएँ, सारंगियाँ
  rationale: दो अलग तार-वाद्यों का भेद बनाए रखने के लिए दो परिचित भारतीय शब्द चुने गए, यद्यपि प्राचीन वाद्यों से उनका मेल अनुमानित है।
- source_word: Chaos
  choice: अराजकता
  rationale: ब्रह्मांडीय क्षेत्र/सत्ता के रूप में प्रयुक्त शब्द का अर्थ व्यक्त करता है; विशिष्ट नाम होने का संकेत प्रसंग से मिलता है।
- source_word: aeon
  choice: युग
  rationale: यहाँ अर्थ अनिश्चित है—कालखंड अथवा ब्रह्मांडीय क्षेत्र; ‘युग’ पाठ की कालगत अर्थच्छाया को रखता है और अत्यधिक तकनीकी लिप्यंतरण से बचता है।
- source_word: Primal Parent
  choice: आदि-जनक
  rationale: मूल पूर्वज अथवा आदि-माता-पिता की संकल्पना को बिना लिंग को आवश्यकता से अधिक निश्चित किए यथासंभव संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ‘यीशु मसीह’ और ऊपर के उद्धारकर्ता का संबंध
  choice: यीशु मसीह कहलाने वाले अस्तित्व को ऊपर के उद्धारकर्ता के ‘समान’ बताया गया
  alternative: दोनों को एक ही सत्ता के रूप में प्रस्तुत करना
  rationale: साक्ष्य likeness/looks like का भेद रखता है; पहचान को एक कर देना पाठ की ब्रह्मांडीय और धार्मिक तनाव को मिटा देता।
- issue: दाहिने और बाएँ का नैतिक नामकरण
  choice: दाहिना ‘न्याय’ और बायाँ ‘बुराई’ कहलाया
  alternative: दाहिने को धार्मिकता और बाएँ को दुष्टता कहना
  rationale: स्थानसूचक प्रतीकों और अमूर्त नैतिक श्रेणियों के बीच मूल पाठ का सीधा संबंध सुरक्षित रखा गया है।
- issue: अंतिम वाक्य में बुराई का संबंध
  choice: ‘हर सृजित अस्तित्व पर अधिकार रखती है’
  alternative: ‘हर सृजित अस्तित्व के ऊपर खड़ी है’
  rationale: stands over का स्वाभाविक हिन्दी अर्थ प्रभुत्व/अधिकार है, पर इसे पूर्ण स्वामित्व या सृष्टिकर्तृत्व के रूप में नहीं बढ़ाया गया।
- issue: सोफिया का परिचय
  choice: ‘पिस्तिस <की पुत्री> सोफिया’
  alternative: कोणीय कोष्ठक हटाकर संबंध को निर्विवाद बनाना
  rationale: साक्ष्य में संपादकीय पूर्ति को कोणीय कोष्ठकों सहित सुरक्षित रखना आवश्यक है।
- issue: राज्य की अवधि
  choice: अराजकता के स्वर्गों और उनकी सेनाओं के ‘अंत तक’
  alternative: अंतिम न्याय या विनाश के रूप में व्याख्या करना
  rationale: consummation का आशय समापन है; किसी विशिष्ट धर्मसैद्धांतिक अंतिम घटना को आयात नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। पिस्तिस और सोफिया जैसे विशिष्ट नाम लिप्यंतरित हैं। कोणीय कोष्ठक संपादकीय पूर्तियों को सुरक्षित रखते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी गवाह है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। पांडुलिपि का पृष्ठ-संकेत [5] मुख्य पाठ में नहीं रखा गया, क्योंकि वह वाक्य का अंग नहीं है।
