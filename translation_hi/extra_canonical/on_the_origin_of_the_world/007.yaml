id: ORIGW.007
reference: On the Origin of the World — Sabaoth Creates Angels, Israel, and Jesus Christ
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'After this, he created an assembly of angels, countless thousands and myriads, which looked like the assembly in the eighth heaven, and a firstborn called “Israel,” that is, “the Man Who Sees God,” and another entity called “Jesus Christ,” who looks like the savior who dwells above in the eighth heaven, and who sits at his right (hand) on a holy throne, and at his left (hand), there the Virgin of the holy Spirit sits on a throne, even glorifying him, and the seven virgins stand in front of her, holding thirty harps, and lyres, and [] trumpets, glorifying him, and all of the angel hosts glorify him, and they praise him.


    The place he sits is on a throne of light <in a> large cloud covering him, and no one dwelt with him inside the cloud except Sophia, <the daughter of> Pistis, who taught him concerning all the entities that exist inside the eighth heaven, in order to be able to create the likenesses of those entities, so that his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now, Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day, right has been called “justice,” and left has been called “evil.” On account of this, all of them obtained an aeon in the assembly of justice, and evil stands over [5] every created entity.'
