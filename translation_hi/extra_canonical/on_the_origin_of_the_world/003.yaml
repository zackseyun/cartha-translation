base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: hi
  text: 'जब आर्खोन ने अपना आकार देखा—फिर भी उसे अपने सिवा कोई दिखाई नहीं दिया, क्योंकि जल और अंधकार से परे वह कुछ नहीं देख सकता था—तो उसने कल्पना की कि केवल वही अस्तित्व में है। उसका […] वचन के उच्चारण के द्वारा पूरा हुआ; वह [] जल के ऊपर इधर-उधर गतिशील आत्मा के रूप में प्रकट हुआ। जब वह आत्मा प्रकट हो गया, तब आर्खोन ने जलीय पदार्थ को अलग किया, और सूखे भाग को एक दूसरी जगह अलग कर दिया गया। पदार्थ से उसने अपने लिए एक निवास-स्थान बनाया और उसका नाम “स्वर्ग” रखा। पदार्थ से आर्खोन ने एक पाँव रखने की चौकी भी बनाई और उसका नाम “पृथ्वी” रखा।


    तब आर्खोन के मन में एक विचार आया, जो उसके स्वभाव के अनुरूप था, और वचन के उच्चारण के द्वारा उसने एक उभयलिंगी प्राणी की सृष्टि की। उसने अपना मुँह खोला और उसके लिए गुटरगूँ जैसी ध्वनि निकाली। जब उसकी आँखें खुलीं, तो उसने अपने पिता की ओर देखा और उससे “ईईई!” की ध्वनि की। तब उसके पिता ने उसका नाम “ईईई-आ-ओ” रखा।[a]


    फिर उसने दूसरे पुत्र की सृष्टि की और उसके लिए गुटरगूँ जैसी ध्वनि निकाली। जब उसने अपनी आँखें खोलीं, तो अपने पिता से “एह!” की ध्वनि की। उसके पिता ने उसका नाम “एलोआई” रखा।


    फिर उसने तीसरे पुत्र की सृष्टि की और उसके लिए गुटरगूँ जैसी ध्वनि निकाली। जब उसने अपनी आँखें खोलीं, तो अपने पिता से “अस्स्स!” की ध्वनि की। उसके पिता ने उसका नाम “अस्ताफायोस” रखा।


    ये तीनों अपने पिता के पुत्र हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: साक्ष्य-पाठ में यहाँ “[1]” संदर्भ-चिह्न है, पर उसकी टिप्पणी उपलब्ध सामग्री में नहीं दी गई है। नाम और उससे पहले की ध्वनि को यथासंभव ध्वन्यात्मक रूप में रखा गया है।
    reason: मूल गवाह के संदर्भ-चिह्न को बिना काल्पनिक टिप्पणी जोड़े सुरक्षित रखने और पाठक को उसकी स्थिति बताने के लिए।
lexical_decisions:
- source_word: archon
  choice: आर्खोन
  rationale: यह इस ग्रंथ की विशिष्ट शासक-सत्ता के लिए प्रयुक्त तकनीकी पद है; केवल “शासक” कहने से इसका साहित्यिक और ब्रह्मांड-विषयक संकेत कम हो सकता था। इसलिए लिप्यंतरण रखा गया।
- source_word: verbal articulation
  choice: वचन का उच्चारण
  rationale: वाणी द्वारा स्पष्ट ध्वनि या कथन किए जाने का भाव सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई।
- source_word: spirit
  choice: आत्मा
  rationale: स्रोत-साक्ष्य में निहित आत्मिक सत्ता का सामान्य और धर्मशास्त्रीय रूप से अनिर्णायक हिन्दी समतुल्य।
- source_word: aqueous substance
  choice: जलीय पदार्थ
  rationale: “जल” मात्र कहने के बजाय पदार्थात्मक अर्थ को बनाए रखा गया।
- source_word: matter
  choice: पदार्थ
  rationale: सृष्टि के लिए प्रयुक्त मूल द्रव्य का दार्शनिक भाव सुरक्षित रखा गया।
- source_word: footstool
  choice: पाँव रखने की चौकी
  rationale: सामान्य पाठक के लिए स्पष्ट, जबकि अधीनस्थ स्थान की छवि भी बनी रहती है।
- source_word: androgyne
  choice: उभयलिंगी प्राणी
  rationale: स्त्री और पुरुष दोनों लिंगी विशेषताओं वाले सृजित अस्तित्व को स्पष्ट करता है, बिना उसे किसी आधुनिक पहचान-श्रेणी में सीमित किए।
- source_word: cooing sound
  choice: गुटरगूँ जैसी ध्वनि
  rationale: मूल उपमा के पक्षी-सदृश कोमल स्वर को समझने योग्य हिन्दी में व्यक्त किया गया।
theological_decisions:
- issue: आर्खोन का यह मानना कि केवल वही अस्तित्व में है
  choice: दावे को उसकी कल्पना के रूप में रखा गया
  alternative: इसे वस्तुगत सत्य के कथन के रूप में प्रस्तुत करना
  rationale: पाठ स्वयं उसकी सीमित दृष्टि और भ्रांत निष्कर्ष के बीच तनाव रखता है; अनुवाद ने उसे हल नहीं किया।
- issue: जल के ऊपर गतिशील आत्मा और सृष्टि-वर्णन की संभावित शास्त्रीय प्रतिध्वनि
  choice: छवियों को निकट रूप में सुरक्षित रखा, पर कोई व्याख्यात्मक पहचान नहीं जोड़ी
  alternative: इसे सीधे किसी बाइबिलीय आत्मा या सृष्टिकर्ता से समान ठहराना
  rationale: साहित्यिक प्रतिध्वनि संभव है, पर supplied witness उस पहचान को स्पष्ट नहीं करता।
- issue: पुत्रों के नाम और उनकी ध्वनियों का संबंध
  choice: ध्वनियों तथा नामों को लिप्यंतरित किया
  alternative: नामों का अर्थानुवाद या धर्मशास्त्रीय सामान्यीकरण
  rationale: कथानक में ध्वन्यात्मक नामकरण महत्त्वपूर्ण है; अर्थानुवाद संभावित संबंध को मिटा देता।
