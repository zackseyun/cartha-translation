base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: hi
  text: '**यल्दाबाओथ का अपराध**


    जब आकाश अपने-अपने गणों और अपनी समूची शासन-व्यवस्था के साथ स्थापित हो गए, तब आदि-जनक घमंड से भर गया। स्वर्गदूतों के पूरे गण ने उसकी आराधना की, और सभी देवताओं तथा उनके स्वर्गदूतों ने उसकी स्तुति और आराधना की। इससे वह फूल उठा और बार-बार उनके सामने डींग मारते हुए कहने लगा, “मैं अपने आप में पूर्ण हूँ।”


    उसने कहा, “मैं ही ईश्वर हूँ, और मेरे अतिरिक्त और कुछ भी अस्तित्व में नहीं है।” यह कहकर उसने वाणी से बोलने वाले सभी अमर जनों के विरुद्ध अपराध किया, और उन्होंने इस बात के लिए उस पर दोष लगाया।


    जब पिस्तिस[a] ने प्रधान शासक की अधार्मिकता देखी, तो वह क्रोधित हो उठी। अदृश्य रहते हुए उसने कहा, “सामाएल[b], तुम भूल में हो”—अर्थात्, “अंधा ईश्वर।” “ज्योति का एक अमर मनुष्य है, जो तुमसे पहले अस्तित्व में था। वह तुम्हारी गढ़ी हुई आकृतियों के बीच प्रकट होगा। वह तिरस्कारपूर्वक तुम्हें वैसे ही रौंदेगा, जैसे कुम्हार के पात्र को रौंदा जाता है। तब तुम, जो तुम्हारे हैं उनके साथ, नीचे अपनी माता, अथाह गर्त, में जा गिरोगे। क्योंकि जब तुम्हारे सारे काम पूरे हो जाएँगे, तब सत्य के द्वारा उजागर किया गया समूचा अभाव[c] मिटा दिया जाएगा। उसका अस्तित्व समाप्त हो जाएगा, और वह ऐसा हो जाएगा मानो कभी था ही नहीं।”


    यह कहकर पिस्तिस ने जल में अपनी महानता का प्रतिरूप प्रकट किया। ऐसा करने के बाद वह फिर ऊपर अपने प्रकाश में लौट गई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पिस्तिस” यूनानी मूल का नाम है, जिसका सामान्य अर्थ “विश्वास” या “निष्ठा” हो सकता है; यहाँ इसे एक पात्र के नाम के रूप में रखा गया है।
    reason: नाम और उसके संभावित शाब्दिक अर्थ, दोनों से पाठक को अवगत कराना।
  - marker: b
    text: पाठ स्वयं “सामाएल” का अर्थ “अंधा ईश्वर” बताता है।
    reason: पाठ में दी गई नाम-व्याख्या को स्पष्ट रूप से चिह्नित करना।
  - marker: c
    text: “अभाव” यहाँ संभवतः एक व्यापक ब्रह्मांडीय अपूर्णता या न्यून अवस्था का संकेत है; इसका सटीक तकनीकी आशय प्राचीन भाषा के प्रत्यक्ष परीक्षण के बाद और स्पष्ट हो सकता है।
    reason: धर्मवैज्ञानिक तकनीकी पद की अनिश्चितता और स्रोत-समीक्षा की सीमा सुरक्षित रखना।
lexical_decisions:
- source_word: Primal Parent
  choice: आदि-जनक
  rationale: यह पद मूल आदि-सत्तात्मक अभिभावक की धारणा को संक्षिप्त और गरिमापूर्ण ढंग से रखता है; ‘पिता’ कहकर लिंग या संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: hosts
  choice: गण
  rationale: खगोलीय समुदायों के अर्थ में स्वाभाविक हिंदी शब्द; हर स्थान पर सैन्य ‘सेना’ का भाव थोपने से बचाता है।
- source_word: chief archon
  choice: प्रधान शासक
  rationale: ‘आर्कोन’ के शासकीय अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, जबकि इसे सर्वोच्च परमेश्वर का पद नहीं बनाता।
- source_word: deathless ones who use verbal articulation
  choice: वाणी से बोलने वाले सभी अमर जन
  rationale: असामान्य स्रोत-वाक्य की दोनों बातों—अमरता और शब्दबद्ध वाणी—को बिना सरलीकरण के बनाए रखता है।
- source_word: Pistis
  choice: पिस्तिस
  rationale: इसे पात्र के व्यक्तिनाम के रूप में लिप्यंतरित किया गया है; केवल ‘विश्वास’ अनुवाद करने से कथात्मक पहचान धुंधली हो सकती थी।
- source_word: forms you have shaped
  choice: तुम्हारी गढ़ी हुई आकृतियाँ
  rationale: रचना और रूप, दोनों अर्थों को बनाए रखता है तथा यह निश्चित नहीं करता कि संकेत शरीरों, प्राणियों या किसी अन्य निर्मित रूप की ओर है।
- source_word: Abyss
  choice: अथाह गर्त
  rationale: व्यक्तिवाची ब्रह्मांडीय क्षेत्र के रूप में गंभीरता और गहराई का भाव रखता है।
- source_word: deficiency
  choice: अभाव
  rationale: ज्ञानवादी संदर्भ में तकनीकी वैचारिक तनाव बनाए रखने वाला शब्द है; इसे नैतिक ‘पाप’ या सामान्य ‘कमी’ में सीमित नहीं करता।
theological_decisions:
- issue: ‘I am the one who is God’ में देवत्व का दावा
  choice: “परमेश्वर मैं ही हूँ”
  alternative: “ईश्वर मैं ही हूँ”
  rationale: वक्ता के अनन्य सर्वोच्चता-दावे को स्पष्ट रखता है, पर कथावाचक की स्वीकृति के रूप में प्रस्तुत नहीं करता।
- issue: ‘self-sufficient’ का आशय
  choice: “मैं अपने आप में पूर्ण हूँ”
  alternative: “मैं आत्मनिर्भर हूँ”
  rationale: ब्रह्मांडीय सत्ता के पूर्णतः स्वपर्याप्त होने के दावे को व्यक्त करता है; आधुनिक आर्थिक अर्थ वाली ‘आत्मनिर्भरता’ से बचता है।
- issue: deathless man of light
  choice: “ज्योति का एक अमर मनुष्य”
  alternative: “एक अमर ज्योतिर्मय मनुष्य”
  rationale: ‘ज्योति का’ संबंध-सूचक संरचना को बनाए रखता है और इस पात्र को किसी विशिष्ट बाद की धर्मवैज्ञानिक पहचान से नहीं जोड़ता।
- issue: अभाव के अंत का कथन
  choice: “मिटा दिया जाएगा… मानो कभी था ही नहीं”
  alternative: “नष्ट कर दिया जाएगा”
  rationale: स्रोत के निष्क्रिय और अस्तित्वगत कथन को सुरक्षित रखता है; यह नहीं बताता कि कर्ता कौन है या प्रक्रिया किस प्रकार होगी।
- issue: Pistis की अदृश्यता
  choice: “अदृश्य रहते हुए उसने कहा”
  alternative: “वह, जो अदृश्य थी, बोली”
  rationale: अदृश्यता को कथन के समय की अवस्था के रूप में रखता है और उसे अनिवार्य शाश्वत गुण नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण कथात्मक शैली। नामों को देवनागरी में लिप्यंतरित किया गया है और अपरिचित ज्ञानवादी पदों को जहाँ संभव हो अर्थपूर्ण हिंदी में दिया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक पांडुलिपि-पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण विवादित सूक्ष्मताओं को निर्णायक रूप से नहीं सुलझाया गया।
