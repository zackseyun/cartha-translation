base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: hi
  text: 'आदि की साइकी[a] ने एरोस[b] से प्रेम किया, जो उसके साथ रहता था। उसने अपना रक्त उस पर और धरती पर उँडेल दिया। उस रक्त से पहला गुलाब धरती में से फूटा; वह काँटेदार झाड़ी में से निकला और उस प्रकाश के लिए आनंद का स्रोत बना, जो उस झाड़ी के भीतर से प्रकट होने वाला था।


    इसके बाद धरती से अनेक प्रकार के सुंदर और सुगंधित फूल फूट निकले। वे प्रोनोइया[c] की कुँवारी पुत्रियों में से प्रत्येक से उत्पन्न हुए; जब वे एरोस से प्रेम करने लगीं, तो उन्होंने अपना रक्त उस पर और धरती पर उँडेल दिया।


    इनके बाद धरती से अनेक प्रकार के सभी पौधे फूट निकले। वे अपने भीतर शासक शक्तियों[d] और उनके स्वर्गदूतों का बीज लिए हुए थे।


    इनके बाद शासक शक्तियों ने जल में से अनेक प्रकार के जीव-जंतु बनाए, जिनमें रेंगने वाले जीव और पक्षी भी थे। वे अपने भीतर शासक शक्तियों और उनके स्वर्गदूतों का बीज लिए हुए थे।


    परंतु इन सब से पहले, जब वह[e] पहले दिन प्रकट हुआ, तो वह लगभग दो दिन धरती पर ठहरा। फिर वह स्वर्ग में स्थित निचली प्रोनोइया से विदा हुआ और अपने प्रकाश की ओर ऊपर चढ़ गया। उसी क्षण अंधकार ने पूरे जगत को ढक लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: साइकी यूनानी नाम है; इसका संबंध ‘आत्मा’ या ‘जीवन’ के अर्थ से है, पर यहाँ इसे एक व्यक्तिकृत सत्ता के नाम के रूप में रखा गया है।
    reason: नाम और उसके संभावित सामान्य अर्थ दोनों से पाठक को अवगत कराना।
  - marker: b
    text: एरोस यूनानी नाम है, जिसका संबंध प्रेम या कामना से है; यहाँ वह एक व्यक्तिकृत सत्ता है।
    reason: साधारण ‘प्रेम’ और पात्र के नाम के बीच भेद स्पष्ट करना।
  - marker: c
    text: प्रोनोइया यूनानी मूल का नाम है, जिसका अर्थ ‘पूर्वविचार’ या ‘पूर्व-व्यवस्था’ हो सकता है; यहाँ नाम का लिप्यंतरण रखा गया है।
    reason: अर्थ-संकेत देना, पर किसी एक धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में थोपने से बचना।
  - marker: d
    text: ‘शासक शक्तियाँ’ उन ब्रह्मांडीय सत्ताओं के लिए है जिन्हें इस रचना में सृष्टि और शासन से जोड़ा गया है।
    reason: ‘authorities’ के आधुनिक प्रशासनिक अर्थ से भ्रम रोकना।
  - marker: e
    text: यहाँ ‘वह’ किसके लिए आया है, उपलब्ध पाठ में स्पष्ट नहीं है।
    reason: मूल साक्षी की वास्तविक सर्वनामगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: Psyche
  choice: साइकी
  rationale: ग्रीक व्यक्तिनाम/दैवी सत्ता का लिप्यंतरण रखा गया है; इसे केवल ‘आत्मा’ करने से नाम और सामान्य संज्ञा के बीच का भेद मिट सकता था।
- source_word: Eros
  choice: एरोस
  rationale: ग्रीक व्यक्तिनाम का प्रचलित ध्वन्यात्मक रूप रखा गया है; ‘प्रेम’ अनुवाद करने से उसका व्यक्तिकृत स्वरूप अस्पष्ट हो जाता।
- source_word: Pronoia
  choice: प्रोनोइया
  rationale: विशिष्ट ब्रह्मांड-विज्ञान संबंधी नाम को लिप्यंतरित किया गया है; ‘पूर्वज्ञान’ या ‘विधान’ चुनना संभावित अर्थ को अनावश्यक रूप से निश्चित करता।
- source_word: authorities
  choice: शासक शक्तियाँ
  rationale: केवल ‘अधिकारी’ आधुनिक प्रशासनिक अर्थ देता; ‘शासक शक्तियाँ’ यहाँ की ब्रह्मांडीय सत्ताओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: cosmos
  choice: जगत
  rationale: ‘जगत’ व्यापक सृष्टि-व्यवस्था का सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: reptiles
  choice: रेंगने वाले जीव
  rationale: यह व्यापक श्रेणी को व्यक्त करता है और इसे आधुनिक जैविक वर्ग ‘सरीसृप’ तक सीमित नहीं करता।
theological_decisions:
- issue: अंतिम अनुच्छेद में ‘he’ का संदर्भ
  choice: ‘वह’ को अस्पष्ट रखा गया
  alternative: उसे एरोस या किसी अन्य पूर्ववर्ती सत्ता के रूप में स्पष्ट करना
  rationale: उपलब्ध साक्षी में सर्वनाम का संदर्भ अनिश्चित है; किसी पात्र का नाम जोड़ना पाठ की वास्तविक अस्पष्टता को मिटा देता।
- issue: प्रोनोइया की पहचान
  choice: नाम को बिना व्याख्यात्मक अनुवाद के रखा गया
  alternative: ‘पूर्वविचार’, ‘ईश्वरीय विधान’ या ‘दूरदर्शिता’
  rationale: इन विकल्पों में से कोई एक चुनना इस विशिष्ट सत्ता की धार्मिक पहचान को पहले से निर्धारित कर देता।
- issue: ‘बीज’ का स्वरूप
  choice: रूपक को यथावत रखा गया
  alternative: वंश, सार या शक्ति के रूप में व्याख्या करना
  rationale: पाठ स्वयं ‘बीज’ कहता है और उसके जैविक, आध्यात्मिक या सत्ता-संबंधी आशय को स्पष्ट नहीं करता।
