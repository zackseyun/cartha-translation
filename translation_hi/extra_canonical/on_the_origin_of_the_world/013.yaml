  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। वाक्यों को पठनीय बनाने के लिए कुछ लंबे अंग्रेज़ी वाक्य विभाजित किए गए हैं, किंतु घटनाक्रम और पुनरावृत्ति सुरक्षित हैं। चूँकि प्रत्यक्ष कॉप्टिक समीक्षा लंबित है, मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; इसलिए विशिष्ट नामों और संदिग्ध सर्वनाम को सावधानी से जस का तस रखा गया है।
