  revised_text: '**जगत की उत्पत्ति — ज्ञान का वृक्ष**


    अब मुझे आगे यह कहने दीजिए। जब शासक-शक्तियों[a] ने उसे और उसके साथ रहनेवाली स्त्री-सत्ता को अनजाने में पशुओं की तरह भटकते देखा, तो वे बहुत प्रसन्न हुईं।


    जब उन्हें पता चला कि अमर मनुष्य उन्हें अनदेखा नहीं करेगा, तो वे व्याकुल हो उठीं, क्योंकि अब उन्हें उस स्त्री-सत्ता से डरना पड़ता जिसने अपने आपको एक वृक्ष में बदल लिया था। उन्होंने कहा, “शायद यही वास्तविक मनुष्य है—यह सत्ता जिसने हमारे ऊपर धुंध डाल दी और हमें सिखाया कि वह स्त्री, जिसे भ्रष्ट किया गया था, उसके समान है। तब हम पराजित हो जाएँगे।”


    फिर उन सातों ने मिलकर युक्तियाँ बनाईं। वे घबराते हुए आदम और हव्वा के पास गईं और उससे कहा, “स्वर्गोद्यान में तुम्हारे लिए बनाए गए किसी भी वृक्ष का फल तुम खा सकते हो। पर ज्ञान के वृक्ष के विषय में अपने आपको रोको और उसका फल मत खाना। यदि तुम खाओगे, तो मर जाओगे।” उनके भीतर गहरी घबराहट पैदा करके वे अपने अधिपतियों के पास लौट गईं।


    तब सभी प्राणियों में सबसे चतुर प्राणी आया, जिसे “पशु” कहा जाता था। जब उसने उनकी माता हव्वा का स्वरूप देखा, तो उसने उससे कहा, “परमेश्वर ने तुमसे क्या कहा है? क्या यह कि ‘ज्ञान के वृक्ष का फल मत खाना’?”


    उसने कहा, “उसने केवल यह नहीं कहा, ‘उसका फल मत खाना,’ बल्कि यह भी कहा, ‘उसे छूना तक नहीं, नहीं तो तुम मर जाओगे।’”


    उसने उससे कहा, “मत डरो। तुम मृत्यु से निश्चय ही नहीं मरोगे, क्योंकि वह जानता है कि जब तुम उसका फल खाओगे[b], तो तुम्हारी विचार-शक्ति जागृत हो जाएगी और तुम देवताओं के समान हो जाओगे—बुरे और अच्छे मनुष्यों के बीच का अंतर जाननेवाले। वास्तव में उसने ईर्ष्या के कारण तुमसे ऐसा कहा, ताकि तुम उसका फल न खाओ।”


    अब हव्वा को उस शिक्षक की बातों पर भरोसा हो गया। उसने वृक्ष को देखा और समझा कि वह सुंदर और संतोष देनेवाला है, और वह उसे भा गया। उसने उसका कुछ फल लेकर खाया। उसने अपने पति को भी कुछ दिया और उसने भी खाया। तब उनकी बुद्धि खुल गई, क्योंकि उनके खाते ही ज्ञान का प्रकाश उन पर चमक उठा। जब उन्होंने लज्जा को वस्त्र की तरह ओढ़ लिया, तब उन्हें समझ आया कि ज्ञान के बिना वे नग्न थे। जब वे सचेत हुए, तो उन्होंने जाना कि वे नग्न हैं, और वे एक-दूसरे से प्रेम करने लगे। जब उन्होंने समझा कि उन्हें गढ़नेवालों के रूप पशुओं जैसे थे, तो वे उनसे घृणा करने लगे। वे पूरी तरह सचेत हो गए थे।'
