  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/021.yaml
  text: 'Allow me to say next that, once the archons had seen him and the female being who lived with him unknowingly going astray like beasts, they were extremely happy.


    When they learned that the deathless man would not ignore them, they became upset, because they would instead have to fear the female being who had turned herself into a tree. They said, “Perhaps this is the real man, this being who cast a mist over us and taught us that she who had been defiled resembles him. Then we will be defeated.”


    Then all seven devised schemes together. They nervously approached Adam and Eve and said to him, “You may eat the fruit of any of the trees created for you in Paradise. But concerning the tree of knowledge, restrain yourself and do not eat from it. If you eat, you will die.” After causing deep anxiety within them, they withdrew to their authorities.


    Then the cleverest of all creatures approached, the one called “Beast.” When he saw the likeness of their mother Eve, he said to her, “What did God say to you? Was it, ‘Do not eat from the tree of knowledge’?”


    She said, “He not only said, ‘Do not eat from it,’ but also, ‘Do not touch it, or you will die.’”


    He said to her, “Do not be afraid. With death you will not die, because he knows that when you eat [] from it, your reasoning will become sober, and you will become like gods, knowing the difference between evil and good humans. In fact, he said this to you out of jealousy, to keep you from eating from it.”


    Eve now had confidence in the teacher’s words. She looked at the tree and recognized that it was beautiful and satisfying, and she desired it. She took some of its fruit and ate it. She also gave some to her husband, and he ate it as well. Then their minds were opened, because when they ate, the light of knowledge shone upon them. When they clothed themselves with embarrassment, they realized that they were naked without knowledge. When they became sober, they realized that they were naked, and they fell in love with each other. When they realized that those who had shaped them had the forms of beasts, they hated them. They had become acutely aware.'
translation:
  language: hi
  text: '**जगत की उत्पत्ति — ज्ञान का वृक्ष**


    अब मुझे आगे यह कहने दीजिए। जब शासक-शक्तियों[a] ने उसे और उसके साथ रहनेवाली स्त्री-सत्ता को अनजाने में पशुओं की तरह भटकते देखा, तो वे बहुत प्रसन्न हुईं।


    जब उन्हें पता चला कि अमर मनुष्य उनकी उपेक्षा नहीं करेगा, तो वे व्याकुल हो उठीं, क्योंकि अब उन्हें उस स्त्री-सत्ता से डरना पड़ता जिसने अपने आपको एक वृक्ष में बदल लिया था। उन्होंने कहा, “शायद यही वास्तविक मनुष्य है—यह सत्ता जिसने हमारे ऊपर धुंध डाल दी और हमें सिखाया कि वह स्त्री, जिसे भ्रष्ट किया गया था, उसके समान है। तब हम पराजित हो जाएँगे।”


    फिर उन सातों ने मिलकर षड्यंत्र रचे। वे घबराई हुई आदम और हव्वा के पास गईं और उससे कहा, “स्वर्गोद्यान में तुम्हारे लिए बनाए गए किसी भी वृक्ष का फल तुम खा सकते हो। पर ज्ञान के वृक्ष के विषय में अपने आपको रोको और उसका फल मत खाना। यदि तुम खाओगे, तो मर जाओगे।” उनके भीतर गहरी घबराहट पैदा करके वे अपने अधिपतियों के पास लौट गईं।


    तब सभी प्राणियों में सबसे चतुर प्राणी उनके पास आया, जिसे “पशु” कहा जाता था। जब उसने उनकी माता हव्वा का स्वरूप देखा, तो उससे कहा, “परमेश्वर ने तुमसे क्या कहा है? क्या यह कि ‘ज्ञान के वृक्ष का फल मत खाना’?”


    उसने कहा, “उसने केवल यह नहीं कहा, ‘उसका फल मत खाना,’ बल्कि यह भी कहा, ‘उसे छूना तक नहीं, नहीं तो तुम मर जाओगे।’”


    उसने उससे कहा, “मत डरो। तुम मृत्यु से निश्चय ही नहीं मरोगे, क्योंकि वह जानता है कि जब तुम उसका फल खाओगे[b], तो तुम्हारी बुद्धि सचेत हो जाएगी और तुम देवताओं के समान हो जाओगे—बुरे और अच्छे मनुष्यों के बीच का अंतर जाननेवाले। वास्तव में उसने ईर्ष्या के कारण तुमसे ऐसा कहा, ताकि तुम उसका फल न खाओ।”


    अब हव्वा को उस शिक्षक की बातों पर भरोसा हो गया। उसने वृक्ष को देखा और समझा कि वह सुंदर और संतोष देनेवाला है, और वह उसे भा गया। उसने उसका कुछ फल लेकर खाया। उसने अपने पति को भी कुछ दिया और उसने भी खाया। तब उनकी बुद्धि खुल गई, क्योंकि उनके खाते ही ज्ञान का प्रकाश उन पर चमक उठा। जब उन्होंने लज्जा को वस्त्र की तरह ओढ़ लिया, तब उन्हें समझ आया कि ज्ञान के बिना वे नग्न थे। जब वे सचेत हुए, तो उन्होंने जाना कि वे नग्न हैं, और वे एक-दूसरे से प्रेम करने लगे। जब उन्होंने समझा कि उन्हें गढ़नेवालों के रूप पशुओं जैसे थे, तो वे उनसे घृणा करने लगे। वे पूरी तरह सचेत हो गए थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शासक-शक्तियाँ” उस यूनानी-मूल पद का अनुवाद है जिसे प्रायः “आर्खोन” कहा जाता है। इस ग्रंथ में ये संसार पर अधिकार रखनेवाली अलौकिक सत्ताएँ हैं।
    reason: अपरिचित तकनीकी पद और उसकी कथानकगत भूमिका स्पष्ट करना।
  - marker: b
    text: इस स्थान पर पांडुलिपि-साक्ष्य में रिक्ति या अनिश्चित पाठ है; उपलब्ध साक्ष्य यह निश्चित नहीं करता कि यहाँ कोई अतिरिक्त शब्द था या नहीं।
    reason: स्रोत में दिए गए खाली कोष्ठकों द्वारा सूचित पाठगत अंतराल को दर्ज करना।
lexical_decisions:
- source_word: archons
  choice: शासक-शक्तियाँ
  rationale: यह पद केवल सामान्य मानवीय शासकों के लिए नहीं, बल्कि इस ग्रंथ की विश्व-रचना संबंधी अलौकिक सत्ताओं के लिए है; ‘शासक-शक्तियाँ’ अर्थ और विशिष्टता दोनों बनाए रखता है।
- source_word: deathless man
  choice: अमर मनुष्य
  rationale: ‘मृत्युरहित’ की अपेक्षा यह स्वाभाविक हिन्दी है और पात्र की पारलौकिक पहचान को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: female being
  choice: स्त्री-सत्ता
  rationale: मूल साक्ष्य में यह केवल सामान्य ‘स्त्री’ नहीं, एक विशिष्ट सत्ता है; यह अनुवाद उस भेद को बनाए रखता है।
- source_word: Beast
  choice: “पशु”
  rationale: नाम या उपाधि के रूप में प्रयुक्त शब्द को उद्धरण-चिह्नों में रखकर उसकी सामान्य संज्ञा और विशेष संबोधन की दोहरी भूमिका बचाई गई है।
- source_word: reasoning / mind
  choice: बुद्धि
  rationale: संदर्भ में विचार-शक्ति और अंतर्बोध दोनों निहित हैं; ‘बुद्धि’ आधुनिक हिन्दी में दोनों अनुच्छेदों में स्वाभाविक संबंध बनाती है।
- source_word: became sober
  choice: सचेत हुए
  rationale: यहाँ शाब्दिक मद्यत्याग नहीं, अज्ञान या भ्रम से जागने का भाव है; ‘सचेत’ उस रूपक को स्पष्ट किंतु संयत ढंग से व्यक्त करता है।
- source_word: Paradise
  choice: स्वर्गोद्यान
  rationale: यह ‘स्वर्ग’ और ‘उद्यान’ दोनों भावों को रखता है तथा उत्पत्ति-कथा से संबंध सहज बनाता है।
theological_decisions:
- issue: ‘वास्तविक मनुष्य’ की पहचान
  choice: वाक्य को ‘शायद यही वास्तविक मनुष्य है’ के रूप में अनिश्चित रखा गया है।
  alternative: इसे आदम, स्त्री-सत्ता या किसी स्वर्गीय आदिम मनुष्य के रूप में स्पष्ट करना।
  rationale: साक्ष्य का सर्वनाम-संबंध और पहचान तनावपूर्ण तथा अस्पष्ट है; किसी एक धार्मिक व्याख्या को आरोपित नहीं किया गया।
- issue: सर्प के स्थान पर ‘पशु’
  choice: पाठ के विशिष्ट नाम “पशु” को बनाए रखा गया है।
  alternative: उत्पत्ति 3 के प्रभाव में इसे ‘सर्प’ करना।
  rationale: उपलब्ध साक्ष्य इस पात्र को ‘Beast’ कहता है; प्रचलित बाइबिल कथा के आधार पर इसे बदलना स्रोत से आगे जाना होता।
- issue: ज्ञान के फल का प्रभाव
  choice: ज्ञान को प्रकाश और सचेतता के रूप में प्रस्तुत करने वाली पाठ की सकारात्मक भाषा सुरक्षित रखी गई है।
  alternative: फल खाने को केवल पतन, पाप या अवज्ञा की भाषा में समझाना।
  rationale: इस ग्रंथ की अपनी धार्मिक दृष्टि और मानक उत्पत्ति-कथा से उसका तनाव बिना सामंजस्य बैठाए संरक्षित रहना चाहिए।
- issue: ‘परमेश्वर’ का संदर्भ
  choice: संवाद में स्रोत-साक्ष्य के अनुसार ‘परमेश्वर’ रखा गया है।
  alternative: उसे ‘शासक’, ‘प्रधान शासक’ या किसी विशिष्ट सत्ता से बदलना।
  rationale: कथानक भिन्न पहचान सुझा सकता है, पर उद्धृत प्रश्न में ‘God’ है; अनुवाद ने संभावित विरोधाभास को हल नहीं किया।
- issue: ‘बुरे और अच्छे मनुष्यों’ का ज्ञान
  choice: असामान्य वाक्यांश को ‘बुरे और अच्छे मनुष्यों के बीच का अंतर’ के रूप में रखा गया है।
  alternative: परिचित बाइबिल पदबंध ‘भले और बुरे का ज्ञान’ करना।
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में ‘humans’ उपस्थित है; उसे हटाने से स्रोत की विशिष्ट या संभवतः भ्रष्ट पाठ-परंपरा छिप जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। स्रोत-भाषा की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है। असामान्य सर्वनाम-संबंधों, ब्रह्मांड-विज्ञान संबंधी पदों और ज्ञान के धर्मवैचारिक मूल्यांकन को बिना सांप्रदायिक सामंजस्य के यथासंभव सुरक्षित रखा गया है।
