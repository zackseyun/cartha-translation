base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: hi
  text: 'आइए, हम उन अधिपतियों की ओर फिर लौटें जिनकी चर्चा हमने पहले की थी, ताकि हम उनके विषय में स्पष्टीकरण दे सकें।


    जब उन सात अधिपतियों को उनके आकाशों से नीचे पृथ्वी पर फेंक दिया गया, तो उन्होंने अपनी सेवा के लिए बहुत-से दुष्ट आत्मिक दूत रचे। इन दूतों ने मानवजाति को अनेक प्रकार की भटकन, जादू-टोना, औषधियाँ,[a] मूर्तिपूजा, रक्तपात, वेदियाँ, मंदिर, बलिदान और पृथ्वी के सब दुष्ट आत्माओं के लिए अर्घ चढ़ाना सिखाया। वे भाग्य के साथ मिलकर काम करते थे; यह भाग्य अन्याय और न्याय के देवताओं की सहमति से अस्तित्व में आया था। इस प्रकार, संसार अस्तित्व में आने के बाद भटक गया और लगातार उलझन में पड़ा रहा, क्योंकि सृष्टि के आरंभ से युग की समाप्ति तक पृथ्वी के सभी मनुष्य दुष्ट आत्माओं की उपासना करते रहे—धार्मिकता के दूत और अधार्मिकता के मनुष्य, दोनों।[b]


    इस प्रकार संसार उलझन, अज्ञान और जड़ता में अस्तित्व में आया। सच्चे मनुष्य के प्रकट होने तक वे सभी भटक चुके थे।


    इस विषय में इतना ही पर्याप्त हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “औषधियाँ” से आशय जादुई मिश्रण, नशीले पेय या विषैले घोल भी हो सकते हैं।
    reason: अंग्रेज़ी साक्षी का potions अर्थ की इस सीमा में अस्पष्ट है और कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी शेष है।
  - marker: b
    text: “धार्मिकता के दूत और अधार्मिकता के मनुष्य, दोनों” का पिछले वाक्य से ठीक व्याकरणिक संबंध अस्पष्ट है; इसका अर्थ यह भी हो सकता है कि लेखक यहाँ दो समूहों के बीच विरोध दिखा रहा है।
    reason: प्रदत्त साक्षी और उसके अनुवादकीय नोट में इस खंड की व्याकरणिक अस्पष्टता स्पष्ट रूप से स्वीकार की गई है।
lexical_decisions:
- source_word: archons
  choice: अधिपति
  rationale: यह पद शासक या प्रभुत्व रखने वाली ब्रह्मांडीय सत्ताओं का संकेत देता है। ‘अधिपति’ आधुनिक हिन्दी में बोधगम्य रहते हुए विशेष पारिभाषिक अर्थ को सुरक्षित रखता है।
- source_word: demonic angels
  choice: दुष्ट आत्मिक दूत
  rationale: ‘दूत’ angel की मूल कार्यगत धारणा रखता है, जबकि ‘दुष्ट आत्मिक’ इन प्राणियों के demonic स्वरूप को स्पष्ट करता है; ‘दानवी स्वर्गदूत’ जैसी परस्पर टकराती और सांप्रदायिक रूप से भारित अभिव्यक्ति से बचा गया है।
- source_word: potions
  choice: औषधियाँ
  rationale: साक्षी में यह शब्द जादुई या नशीले मिश्रणों की ओर भी संकेत कर सकता है। मुख्य पाठ में सामान्य अर्थ रखा गया है और पादटिप्पणी में अस्पष्टता बताई गई है।
- source_word: libations
  choice: अर्घ चढ़ाना
  rationale: देवताओं या आत्मिक सत्ताओं के लिए पेय उँडेलकर चढ़ाने की अनुष्ठानिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: fate
  choice: भाग्य
  rationale: यहाँ भाग्य को मानवीकृत ब्रह्मांडीय सत्ता के रूप में प्रस्तुत किया गया है। हिन्दी में ‘भाग्य’ उस अर्थ को स्वाभाविक रूप से वहन करता है।
- source_word: stupor
  choice: जड़ता
  rationale: संदर्भ में अचेतनता, सुन्नता या आध्यात्मिक संवेदनहीनता का भाव है; ‘जड़ता’ गरिमापूर्ण और सहज विकल्प है।
- source_word: true man
  choice: सच्चा मनुष्य
  rationale: मूल दावे की उपाधिसदृश किंतु अनिर्दिष्ट प्रकृति को रखा गया है; किसी विशिष्ट धार्मिक पहचान को अनकहे रूप में नहीं जोड़ा गया।
theological_decisions:
- issue: ‘धार्मिकता के दूत और अधार्मिकता के मनुष्य’ वाले अंतिम विरोधी पदबंध का संबंध
  choice: इसे पृथ्वी पर दुष्ट आत्माओं की उपासना करने वालों के साथ व्याकरणिक रूप से जोड़ा गया, पर पादटिप्पणी द्वारा अनिश्चितता सुरक्षित रखी गई।
  alternative: इसे दुष्ट आत्माओं की दो श्रेणियाँ, या पिछले पूरे कथन पर अलग टिप्पणी मानना।
  rationale: उपलब्ध अंग्रेज़ी साक्षी स्वयं इस खंड को व्याकरणिक रूप से अस्पष्ट बताता है; इसलिए पाठ को चुपचाप सिद्धांतगत रूप से सुसंगत बनाने के बजाय कठिनता दर्शाना उचित है।
- issue: भाग्य का व्यक्तिकरण
  choice: ‘यह भाग्य ... अस्तित्व में आया था’ द्वारा भाग्य को कथा की एक सत्ता के रूप में रखा गया।
  alternative: भाग्य को केवल अमूर्त नियति या घटनाओं का परिणाम मानना।
  rationale: साक्षी का सापेक्षवाचक ‘who’ और उत्पत्ति का कथन स्पष्ट रूप से व्यक्तिकरण की ओर संकेत करता है।
- issue: ‘सच्चा मनुष्य’ की पहचान
  choice: उपाधि को बिना अतिरिक्त पहचान के अनूदित किया गया।
  alternative: इसे स्पष्टतः किसी नामित उद्धारकर्ता या ऐतिहासिक व्यक्ति से जोड़ना।
  rationale: इस अंश में पहचान स्पष्ट नहीं की गई है; अनुवाद को उससे आगे नहीं जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण विवादित स्थानों पर निश्चितता का अतिकथन नहीं किया गया। ‘अधिपति’ जैसे पद संदर्भगत विशिष्टता रखते हैं, जबकि वाक्यरचना को अत्यधिक संस्कृतनिष्ठ होने से बचाया गया है।
