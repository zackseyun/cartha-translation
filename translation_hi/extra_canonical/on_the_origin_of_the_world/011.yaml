  revised_text: 'एक उभयलिंगी अस्तित्व के रूप में एरोस उस आदि-रक्त से प्रकट हुआ। उसका पुरुष तत्त्व हिमिरेरिस[a] है, जो प्रकाश से निकली आग है। उसके साथ निवास करने वाला उसका स्त्री तत्त्व—रक्त से बनी एक आत्मा—प्रोनोइया[b] के तत्त्व से उत्पन्न होता है। वह रूप में अत्यंत सुंदर है और उसका आकर्षण कैओस[c] में रचे गए सभी अस्तित्वों के आकर्षण से बढ़कर है।


