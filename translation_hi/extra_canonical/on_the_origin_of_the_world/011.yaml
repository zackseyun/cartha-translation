base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/011.yaml
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  language: hi
  text: 'एक उभयलिंगी अस्तित्व के रूप में एरोस उस आदि-रक्त से प्रकट हुआ। उसका पुरुष तत्त्व हिमिरेरिस[a] है, जो प्रकाश से निकली आग है। उसका स्त्री तत्त्व, जो उसके साथ वास करता है, रक्त से बनी एक आत्मा है और प्रोनोइया[b] के तत्त्व से उत्पन्न होता है। वह रूप में अत्यंत सुंदर है और उसका आकर्षण कैओस[c] में रचे गए सभी अस्तित्वों के आकर्षण से बढ़कर है।


    तब सभी देवता और उनके स्वर्गदूत एरोस को देखकर उससे प्रेम करने लगे। उसने उन सबके भीतर अपने आपको प्रकट करके उन्हें प्रज्वलित कर दिया। जैसे एक दीपक से अनेक दीपक जलाए जाते हैं और उन सबमें वही एक प्रकाश होता है, फिर भी पहला दीपक घटता नहीं, वैसे ही एरोस ने कैओस में रचे गए सभी अस्तित्वों के भीतर अपने आपको फैला दिया, फिर भी वह घटा नहीं। जैसे एरोस प्रकाश और अंधकार के मध्य प्रकट हुआ, और जैसे एरोस का यौन-मिलन स्वर्गदूतों और मानवजाति के मध्य संपन्न हुआ, वैसे ही धरती से आदि-सुख खिल उठा। धरती के बाद स्त्री आई; स्त्री के बाद विवाह; विवाह के बाद जन्म; और जन्म के बाद क्षय।


    एरोस के बाद धरती पर बहाए गए उस रक्त से अंगूर की बेल फूट निकली। इसी कारण जो लोग उसका रस पीते हैं, उनमें यौन-मिलन की इच्छा उत्पन्न होती है।


    अंगूर की बेल के बाद धरती से अंजीर और अनार के पेड़ फूट निकले। उनके साथ शेष सभी प्रकार के पेड़ भी निकले, जिनके बीज अधिकारियों[d] और उनके स्वर्गदूतों के [] बीज से थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हिमिरेरिस’ एक दुर्लभ नाम है; यहाँ उपलब्ध साक्ष्य के आधार पर इसका अर्थ निश्चित नहीं है।
    reason: अपरिचित तकनीकी व्यक्तिनाम की अनिश्चितता बताने के लिए।
  - marker: b
    text: ‘प्रोनोइया’ यूनानी मूल का नाम/तकनीकी पद है, जिसका संबंध ‘पूर्वविचार’ या ‘पूर्व-व्यवस्था’ से हो सकता है; यहाँ इसे व्यक्तिकृत नाम मानकर लिप्यंतरित किया गया है।
    reason: एकल हिन्दी धार्मिक अर्थ थोपे बिना संभावित अर्थक्षेत्र बताने के लिए।
  - marker: c
    text: ‘कैओस’ यहाँ केवल अव्यवस्था नहीं, बल्कि इस रचना के ब्रह्मांड-वर्णन में एक आद्य क्षेत्र या अवस्था का नाम है।
    reason: सामान्य आधुनिक अर्थ और तकनीकी ब्रह्मांडीय प्रयोग में भेद स्पष्ट करने के लिए।
  - marker: d
    text: ‘अधिकारी’ से आशय इस रचना की ब्रह्मांडीय सत्ताओं से है; इसका अनुवाद ‘शासक’ भी किया जा सकता है।
    reason: तकनीकी सत्ता-पद और उसके वैकल्पिक अनुवाद को चिह्नित करने के लिए।
lexical_decisions:
- source_word: androgynous entity
  choice: उभयलिंगी अस्तित्व
  rationale: पाठ के पुरुष और स्त्री दोनों तत्त्वों को औपचारिक किंतु सुबोध ढंग से बनाए रखता है; इसे आधुनिक लैंगिक पहचान की किसी संकीर्ण श्रेणी में नहीं बाँधता।
- source_word: Eros
  choice: एरोस
  rationale: यूनानी व्यक्तिनाम का लिप्यंतरण किया गया है; इसे केवल ‘काम’ या ‘प्रेम’ कहने से पात्र और अवधारणा के बीच का भेद मिट जाता।
- source_word: Himireris
  choice: हिमिरेरिस
  rationale: दुर्लभ नाम का ध्वन्यात्मक लिप्यंतरण; अर्थ अनिश्चित होने के कारण अनुवाद नहीं किया गया।
- source_word: Pronoia
  choice: प्रोनोइया
  rationale: इस ब्रह्मांड-वर्णन में तकनीकी/व्यक्तिकृत संज्ञा है; ‘पूर्वज्ञान’ या ‘दैवी विधान’ चुनना अर्थ को समय से पहले निश्चित कर देता।
- source_word: Chaos
  choice: कैओस
  rationale: विशिष्ट आद्य ब्रह्मांडीय क्षेत्र के नाम के रूप में लिप्यंतरण; सामान्य ‘अराजकता’ अर्थ देने से सृष्टितत्त्व संबंधी आशय कमजोर पड़ता।
- source_word: authorities
  choice: अधिकारी
  rationale: स्रोत की ब्रह्मांडीय सत्ताओं के लिए अपेक्षाकृत औपचारिक और तटस्थ शब्द; ‘शासक’ भी संभव है, पर वह शासन-क्रिया पर अधिक बल देता।
- source_word: decline
  choice: क्षय
  rationale: जन्म के बाद होने वाली गिरावट, जर्जरता या नाश की व्यापकता को बनाए रखता है।
- source_word: sexual union
  choice: यौन-मिलन
  rationale: स्पष्ट, आधुनिक और गरिमापूर्ण अभिव्यक्ति; पाठ की देहधर्मी स्पष्टता को न तो छिपाती है, न अशिष्ट बनाती है।
theological_decisions:
- issue: एरोस के पुरुष और स्त्री तत्त्वों का संबंध
  choice: दोनों को ‘तत्त्व’ कहा गया और सहवास करने वाले स्त्री तत्त्व को अलग आत्मा के रूप में रखा गया
  alternative: एरोस को सीधे ‘पुरुष और स्त्री दोनों’ कहना
  rationale: साक्ष्य में आंतरिक तत्त्वों और उनके संबंध की जटिलता है; सरल समानीकरण उस तनाव को मिटा देता।
- issue: दीपक के रूपक में एरोस का फैलना और न घटना
  choice: ‘अपने आपको फैला दिया, फिर भी वह घटा नहीं’
  alternative: इसे सृष्टि, उत्सर्जन या अवतार की किसी निश्चित धार्मिक संकल्पना से समझाना
  rationale: पाठ की अपनी उपमा को बनाए रखा गया है और उस पर बाद की धर्मवैचारिक प्रणाली नहीं थोपी गई।
- issue: ‘at the center of the angels and humanity’ की अस्पष्टता
  choice: ‘स्वर्गदूतों और मानवजाति के मध्य’
  alternative: ‘स्वर्गदूतों तथा मनुष्यों के बीच पारस्परिक रूप से’ या ‘उनके केंद्र में’
  rationale: अंग्रेज़ी साक्ष्य स्थान या मध्यस्थता के बारे में अस्पष्ट है; हिन्दी में ‘मध्य’ उस अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
- issue: पेड़ों के बीज संबंधी अंतिम खंड में पाठ-रिक्ति
  choice: '[] को उसी स्थान पर सुरक्षित रखा गया'
  alternative: अनुमान से कोई लुप्त शब्द भरना या वाक्य को सहज बनाने के लिए रिक्ति हटाना
  rationale: पांडुलिपीय अभाव वास्तविक है; उसे भरने से अप्रमाणित अर्थ बन जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय गद्य अपनाया गया है। दुर्लभ ब्रह्मांडीय नामों को देवनागरी में लिप्यंतरित कर पादटिप्पणियों में समझाया गया है। स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; पांडुलिपि की पृष्ठ-संख्याएँ हटाई गई हैं, जबकि वास्तविक रिक्ति-संकेत [] सुरक्षित है।
