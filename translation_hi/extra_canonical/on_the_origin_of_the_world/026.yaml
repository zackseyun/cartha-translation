  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। तकनीकी ब्रह्मांड-विज्ञान संबंधी पदों ‘लोगोस’ और ‘आर्खोन’ को अर्थ-संकुचन से बचाने के लिए लिप्यंतरित किया गया है और पादटिप्पणियों में समझाया गया है। चूँकि प्रत्यक्ष कॉप्टिक समीक्षा लंबित है, यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अनंतिम स्रोत-सचेत अनुवाद है।
