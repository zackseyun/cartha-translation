  witness_license: Public domain witness
  english_witness: 'The all-superior Logos was dispatched solely for this reason: that he could announce the unknown. He said, “Nothing that is hidden is not revealed, and what is unknown will be known,” and these were dispatched to make known what is hidden, even the seven authorities of Chaos as well as their impiety, and in this way they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: hi
  text: 'सर्वोपरि लोगोस[a] को केवल इसी कारण भेजा गया था कि वह उस बात की घोषणा कर सके जो अज्ञात थी। उसने कहा, “ऐसा कुछ भी छिपा नहीं है जो प्रकट न किया जाए, और जो अज्ञात है वह जाना जाएगा।” और इन्हें[b] इसलिए भेजा गया कि जो छिपा है उसे प्रकट करें—अराजकता की सात सत्ताओं और उनकी भक्ति-विहीनता को भी। इस प्रकार उन्हें मृत्यु-दंड सुनाया गया।


    जब सभी सिद्ध जन[c] उन रूपों में प्रकट हुए जिन्हें आर्खोनों[d] ने गढ़ा था, और जब उन्होंने अतुलनीय सत्य प्रकट किया, तब उन्होंने देवताओं की सारी बुद्धि को लज्जित कर दिया। उनका भाग्य निंदा के योग्य पाया गया, और उनका सैन्य-दल मुरझा गया। उनका प्रभुत्व मिट गया। उनकी पूर्व-योजना[e], उनकी महिमा समेत, निष्फल हो गई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लोगोस’ यूनानी मूल का पद है, जिसका अर्थ संदर्भ के अनुसार ‘वचन’, ‘विवेक’ या दैवी अभिव्यक्ति हो सकता है। यहाँ इसे विशिष्ट उपाधि के रूप में रखा गया है।
    reason: तकनीकी पद की अर्थ-व्याप्ति और अनिश्चित पहचान बताने के लिए।
  - marker: b
    text: ‘इन्हें’ किसके लिए कहा गया है, उपलब्ध साक्ष्य में स्पष्ट नहीं है।
    reason: मूल साक्ष्य के अस्पष्ट बहुवचन संदर्भ को सुरक्षित रखने के लिए।
  - marker: c
    text: ‘सिद्ध जन’ का शाब्दिक भाव ‘पूर्ण जन’ है।
    reason: सहज हिंदी चयन के पीछे का मूल अर्थ दिखाने के लिए।
  - marker: d
    text: ‘आर्खोन’ इस ग्रंथ में ब्रह्मांडीय शासक सत्ताओं के लिए प्रयुक्त पद है।
    reason: अपरिचित तकनीकी शब्द स्पष्ट करने के लिए।
  - marker: e
    text: ‘पूर्व-योजना’ का अर्थ ‘पूर्व-विचार’ भी हो सकता है।
    reason: forethought की संभावित अर्थ-छाया सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Logos
  choice: लोगोस
  rationale: विशिष्ट ब्रह्मांड-विज्ञान संबंधी उपाधि को केवल ‘वचन’ कहकर उसकी संभावित व्यापक अर्थ-छाया सीमित न करने के लिए लिप्यंतरित रूप रखा गया है।
- source_word: Chaos
  choice: अराजकता
  rationale: यहाँ Chaos एक विशिष्ट आदिम क्षेत्र अथवा सत्ता-व्यवस्था का नाम हो सकता है; इसलिए भावार्थ स्पष्ट रखते हुए इसे विशिष्ट नाम की तरह प्रस्तुत किया गया है।
- source_word: authorities
  choice: सत्ताएँ
  rationale: ‘अधिकारी’ व्यक्तिगत पदाधिकारियों का संकेत देता; ‘सत्ताएँ’ ब्रह्मांडीय शासक शक्तियों के अर्थ को बेहतर व्यक्त करता है।
- source_word: impiety
  choice: भक्ति-विहीनता
  rationale: ‘अधर्म’ संभावित रूप से व्यापक नैतिक अर्थ जोड़ता है; यह चयन देव-विरोधी या श्रद्धाहीन दशा को अपेक्षाकृत निकटता से रखता है।
- source_word: archons
  choice: आर्खोन
  rationale: ग्रंथ की विशिष्ट ब्रह्मांडीय शासक-सत्ताओं के लिए तकनीकी पद को लिप्यंतरित किया गया है, ताकि इसे सामान्य सांसारिक शासकों तक सीमित न किया जाए।
- source_word: perfect ones
  choice: सिद्ध जन
  rationale: ‘पूर्ण लोग’ हिंदी में अस्वाभाविक है; ‘सिद्ध जन’ आध्यात्मिक परिपक्वता/पूर्णता का अर्थ सहज रूप में देता है, बिना उन्हें दोषरहित घोषित किए।
- source_word: forethought
  choice: पूर्व-योजना
  rationale: संदर्भ में शासक सत्ताओं की योजना या पूर्व-विचार अभिप्रेत प्रतीत होता है; ‘पूर्वज्ञान’ अधिक प्रबल धर्मवैज्ञानिक दावा जोड़ सकता था।
theological_decisions:
- issue: “these were sent” का अस्पष्ट बहुवचन संदर्भ
  choice: “इन्हें ... भेजा गया” के रूप में अस्पष्टता सुरक्षित रखी गई
  alternative: इसे ‘सिद्ध जन’, ‘दूत’, या लोगोस से स्पष्ट रूप से जोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में सर्वनाम का पूर्वपद स्पष्ट नहीं है; किसी एक पहचान को निश्चित करना पाठ से आगे जाना होता।
- issue: लोगोस की पहचान
  choice: उपाधि को ‘लोगोस’ रखा गया
  alternative: ‘वचन’, ‘मसीह’, या ‘दैवी बुद्धि’
  rationale: अंश स्वयं लोगोस की किसी विशिष्ट परंपरागत धर्मवैज्ञानिक पहचान को स्पष्ट नहीं करता।
- issue: सात सत्ताओं को मृत्यु-दंड
  choice: “उन्हें मृत्यु-दंड सुनाया गया”
  alternative: ‘इससे वे मरने के लिए दोषी ठहरे’
  rationale: न्यायिक स्वर बनाए रखा गया, पर ‘उन्हें’ का संभावित संदर्भ पाठानुसार पूरी तरह निर्णीत नहीं किया गया।
- issue: देवताओं की बुद्धि का अपमान
  choice: “लज्जित कर दिया”
  alternative: ‘झूठा सिद्ध कर दिया’ या ‘पराजित कर दिया’
  rationale: स्रोत-साक्ष्य humiliation का भाव देता है; वैचारिक खंडन या युद्धगत पराजय का अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
