    उसने कहा, “जिस स्त्री को तुमने मुझे दिया, उसी ने मुझे दिया, और मैंने खाया।”


    तब उन्होंने स्त्री से कहा: [b] “तुमने यह क्या किया?”


    उसने उत्तर दिया, “शिक्षक ने मुझे उकसाया, और मैंने खाया।”


    तब आर्खोन शिक्षक के पास गए। उसके कारण उनकी आँखों पर धुंध छा गई और वे उसके विरुद्ध कुछ भी न कर सके। असहाय होने के कारण उन्होंने उसे शाप दिया।


    इसके बाद वे स्त्री के पास गए और उसे तथा उसके वंशजों को शाप दिया।


    स्त्री के बाद उन्होंने आदम को शाप दिया और उसके कारण धरती और उपज को भी। उन्होंने अपनी बनाई हुई हर वस्तु को शाप दिया। उनके पास कोई आशीष नहीं है। बुराई से भलाई उत्पन्न नहीं हो सकती।


    उस दिन से सत्ताओं को सचमुच यह बोध हो गया कि उनसे अधिक शक्तिशाली कोई है।


    वे केवल इतना जानते थे कि उनकी आज्ञाएँ नहीं मानी गई थीं। केवल अमर मनुष्य के कारण संसार में भयंकर ईर्ष्या आ गई।


    जब आर्खोन समझ गए कि उनके आदम ने एक भिन्न प्रकार का ज्ञान प्राप्त कर लिया है, तो उन्होंने उसकी परीक्षा लेनी चाही। उन्होंने सभी पालतू पशुओं, धरती के जंगली जानवरों और आकाश के पक्षियों को इकट्ठा किया और आदम के सामने लाए, ताकि जानें कि वह उन्हें क्या नाम देगा। उन्हें देखकर उसने उन प्राणियों के नाम रखे।


    वे व्याकुल हो गए, क्योंकि आदम हर परीक्षा से बच निकलता था। उन्होंने इकट्ठे होकर षड्यंत्र रचे और कहा, “देखो, आदम हममें से एक के समान हो गया है, क्योंकि वह प्रकाश और अंधकार के बीच का भेद जानता है। संभव है कि अब भी उसे धोखा दिया जा सके, जैसा ज्ञान के पेड़ के संबंध में हुआ था। कहीं ऐसा न हो कि वह जीवन के पेड़ के पास भी जाए, उसका फल खाए, अमर हो जाए और स्वामी बन जाए। तब वह हमसे और हमारी सारी महिमा से घृणा करेगा और हमें तुच्छ समझेगा। फिर वह हमारे साथ हमारे समूचे विश्व को भी दोषी ठहराएगा। आओ, हम उसे [c] वाटिका से निकालकर नीचे उसी धरती पर भेज दें जिससे उसे लिया गया था, ताकि अब से वह हमारी क्षमता से परे की कोई बात न जान सके।” इस प्रकार उन्होंने आदम को उसकी पत्नी समेत वाटिका से निकाल दिया। पर उनका यह काम भी उनके लिए पर्याप्त नहीं था; इसके बजाय वे भयभीत हो गए।


    वे (वाटिका में प्रवेश करके) जीवन के पेड़ के पास गए और उसके चारों ओर विशाल तथा डरावने प्राणी खड़े कर दिए—आग के समान जीवित प्राणी, जिन्हें “करूब” कहा जाता है। उन्होंने उनके बीच आग की एक तलवार रख दी, जो निरंतर डरावने ढंग से घूमती रहती थी, ताकि धरती का कोई भी प्राणी कभी उस स्थान में प्रवेश न कर सके।


    आदम से ईर्ष्या करने के कारण आर्खोन उनकी आयु घटाना चाहते थे। पर वे ऐसा नहीं कर सके, क्योंकि आरंभ से निर्धारित नियति के अनुसार, ज्योतिर्मय पिंडों की परिक्रमा के अनुरूप, प्रत्येक को एक हज़ार वर्ष की आयु दी गई थी। फिर भी, यद्यपि आर्खोन यह काम पूरा नहीं कर सके, बुराई करने वालों में से प्रत्येक ने दस वर्ष घटा दिए, और पूरी आयु नौ सौ तीस वर्ष रह गई। ये वर्ष दुःख, दुर्बलता और दुर्भावनापूर्ण उथल-पुथल में बीतते हैं। उस दिन से युग की पूर्णता तक जीवन ऐसा ही रहा है।'
