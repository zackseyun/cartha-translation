  text: 'When the archons realized that (Adam and Eve) had broken their commandments (to them), they came into Paradise and approached Adam and Eve with an earthquake and great threats, to see the result of the help they had received. Adam and Eve shook violently and hid beneath the trees in Paradise. The archons did not know where they were and said, “Adam, where are you?”


    He said, “Here I am. I hid because I was afraid of you and was embarrassed.” In their ignorance, they said to him, “Who told you about the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said, “The woman you gave me—she gave it to me, and I ate.”


    Then they said to the woman: [] “What have you done?”


    She answered, “The teacher incited me, and I ate.”


    Then the archons approached the teacher. Because of him, their eyes grew foggy, and they were unable to do anything against him. Since they were powerless, they cursed him.


    After this, they approached the woman and cursed her and her descendants.


    After the woman, they cursed Adam and, because of him, the land and the crops as well. They cursed everything they had created. They possess no blessing. Good cannot result from evil.


    From that day on, the authorities truly realized that there was something more powerful than they were.


    They knew only that their commandments had not been obeyed. Tremendous jealousy entered the world solely because of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to test him. They gathered every tame animal, the wild beasts of the earth, and the birds of heaven, and brought them before Adam to learn what he would call them. When he saw them, he gave names to their creatures.


    They became disturbed because Adam recovered from every test. They gathered together and devised schemes, saying, “Look at Adam! He has become like one of us, because he knows the difference between light and darkness. Perhaps now he will be deceived, as happened with the tree of knowledge, and will even approach the tree of life, eat from it, become deathless, and become lord. Then he will loathe and despise us and all our glory. He will condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from which he was taken, so that from now on he will be unable to know anything beyond what we are capable of.” In this way, they banished Adam from Paradise together with his wife. But this act they committed was not enough for them. Instead, they became afraid.


    They entered (Paradise, approaching) the tree of life and enclosed it with large, fearsome beings—fiery living creatures called “Cherubin.” They placed a flaming sword among them, fearsomely and continuously turning, to prevent any earthly being from ever entering that place.


    Because the archons became jealous of Adam, they wanted to shorten their lifespans. They were unable to do so because of fate, which had been established from the beginning, for each one had been assigned a lifespan of 1,000 years in accordance with the orbit of the radiant bodies. Nevertheless, although the archons were unable to accomplish this, each of the perpetrators of evil subtracted ten years, and the full lifespan came to 930 years. These years pass in suffering, weakness, and malevolent disruption. This is how life has been from that day until the consummation of the age.'
translation:
  language: hi
  text: '## संसार की उत्पत्ति के विषय में — आर्खोन हव्वा, आदम और सारी सृष्टि को शाप देते हैं


    जब आर्खोन[a] समझ गए कि आदम और हव्वा ने उनकी आज्ञाएँ तोड़ दी हैं, तब वे भूकंप और बड़ी-बड़ी धमकियों के साथ अदन-वाटिका में आए और आदम तथा हव्वा के पास पहुँचे, ताकि उन्हें जो सहायता मिली थी उसका परिणाम देख सकें। आदम और हव्वा बुरी तरह काँपने लगे और वाटिका के पेड़ों के नीचे छिप गए। आर्खोन नहीं जानते थे कि वे कहाँ हैं, इसलिए उन्होंने कहा, “आदम, तुम कहाँ हो?”


    उसने कहा, “मैं यहाँ हूँ। मैं तुमसे डर गया था और लज्जित था, इसलिए छिप गया।” तब उन्होंने अपनी अज्ञानता में उससे कहा, “किसने तुम्हें उस लज्जा के बारे में बताया जिसे तुमने वस्त्र की तरह पहन लिया है? क्या तुमने उस पेड़ का फल खाया है?”


    उसने कहा, “जिस स्त्री को तुमने मुझे दिया, उसी ने मुझे दिया, और मैंने खाया।”


    तब उन्होंने स्त्री से कहा: [b] “तुमने यह क्या किया?”


    उसने उत्तर दिया, “शिक्षक ने मुझे उकसाया, और मैंने खाया।”


    तब आर्खोन शिक्षक के पास गए। उसके कारण उनकी आँखों पर धुंध छा गई और वे उसके विरुद्ध कुछ भी न कर सके। असहाय होने के कारण उन्होंने उसे शाप दिया।


    इसके बाद वे स्त्री के पास गए और उसे तथा उसके वंशजों को शाप दिया।


    स्त्री के बाद उन्होंने आदम को शाप दिया और उसके कारण धरती और उपज को भी। उन्होंने अपनी बनाई हुई हर वस्तु को शाप दिया। उनके पास कोई आशीष नहीं है। बुराई से भलाई उत्पन्न नहीं हो सकती।


    उस दिन से सत्ताओं को सचमुच यह बोध हो गया कि उनसे अधिक शक्तिशाली कोई है।


    वे केवल इतना जानते थे कि उनकी आज्ञाएँ नहीं मानी गई थीं। केवल अमर मनुष्य के कारण संसार में भयंकर ईर्ष्या आ गई।


    जब आर्खोन समझ गए कि उनके आदम ने एक भिन्न प्रकार का ज्ञान प्राप्त कर लिया है, तो उन्होंने उसकी परीक्षा लेनी चाही। उन्होंने सभी पालतू पशुओं, धरती के जंगली जानवरों और आकाश के पक्षियों को इकट्ठा किया और आदम के सामने लाए, ताकि जानें कि वह उन्हें क्या नाम देगा। उन्हें देखकर उसने उनकी बनाई हुई प्रजातियों को नाम दिए।


    वे व्याकुल हो गए, क्योंकि आदम हर परीक्षा से उबर आता था। उन्होंने इकट्ठे होकर षड्यंत्र रचे और कहा, “देखो, आदम हममें से एक के समान हो गया है, क्योंकि वह प्रकाश और अंधकार के बीच का भेद जानता है। संभव है कि अब भी उसे धोखा दिया जा सके, जैसा ज्ञान के पेड़ के संबंध में हुआ था। कहीं ऐसा न हो कि वह जीवन के पेड़ के पास भी जाए, उसका फल खाए, अमर हो जाए और स्वामी बन जाए। तब वह हमसे और हमारी सारी महिमा से घृणा करेगा और हमें तुच्छ समझेगा। फिर वह हमारे साथ हमारे समूचे विश्व को भी दोषी ठहराएगा। आओ, हम उसे वाटिका से निकालकर [c] नीचे उसी धरती पर भेज दें जिससे उसे लिया गया था, ताकि अब से वह हमारी क्षमता से परे की कोई बात न जान सके।” इस प्रकार उन्होंने आदम को उसकी पत्नी समेत वाटिका से निकाल दिया। पर उनका यह काम भी उनके लिए पर्याप्त नहीं था; इसके बजाय वे भयभीत हो गए।


    वे वाटिका में जीवन के पेड़ के पास गए और उसके चारों ओर विशाल तथा डरावने प्राणी खड़े कर दिए—आग के समान जीवित प्राणी, जिन्हें “करूब” कहा जाता है। उन्होंने उनके बीच आग की एक तलवार रख दी, जो निरंतर डरावने ढंग से घूमती रहती थी, ताकि धरती का कोई भी प्राणी कभी उस स्थान में प्रवेश न कर सके।


    आदम से ईर्ष्या करने के कारण आर्खोन मनुष्यों की आयु घटाना चाहते थे। पर वे ऐसा नहीं कर सके, क्योंकि आरंभ से निर्धारित नियति के अनुसार, ज्योतिर्मय पिंडों की परिक्रमा के अनुरूप, प्रत्येक को एक हज़ार वर्ष की आयु दी गई थी। फिर भी, यद्यपि आर्खोन यह काम पूरा नहीं कर सके, बुराई करने वालों में से प्रत्येक ने दस वर्ष घटा दिए, और पूरी आयु नौ सौ तीस वर्ष रह गई। ये वर्ष दुःख, दुर्बलता और दुर्भावनापूर्ण उथल-पुथल में बीतते हैं। उस दिन से युग की पूर्णता तक जीवन ऐसा ही रहा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आर्खोन” यूनानी मूल का शब्द है, जिसका अर्थ “शासक” या “सत्ताधारी” है। इस ग्रंथ में यह संसार पर शासन करने वाली विशिष्ट शक्तियों के लिए प्रयुक्त तकनीकी नाम है।
    reason: अपरिचित किंतु महत्त्वपूर्ण ब्रह्मांड-विषयक संज्ञा को स्पष्ट करना।
  - marker: b
    text: उपलब्ध पाठ-साक्ष्य में यहाँ कुछ अंश लुप्त होने का संकेत है।
    reason: साक्ष्य में दिए गए रिक्त-अंश चिह्न को पाठकीय पादटिप्पणी में सुरक्षित रखना।
  - marker: c
    text: उपलब्ध पाठ-साक्ष्य में यहाँ भी कुछ अंश लुप्त होने का संकेत है।
    reason: दूसरे रिक्त-अंश चिह्न को बिना अनुमान से भरने के सुरक्षित रखना।
lexical_decisions:
- source_word: archons
  choice: आर्खोन
  rationale: यह इस ग्रंथ की विशिष्ट ब्रह्मांड-विषयक संज्ञा है। केवल ‘शासक’ कहने से इसका तकनीकी अर्थ खो सकता था; इसलिए लिप्यंतरण के साथ पहली बार पादटिप्पणी दी गई है।
- source_word: Paradise
  choice: अदन-वाटिका / वाटिका
  rationale: आरंभिक उल्लेख में सामान्य हिन्दी बाइबलीय पहचान स्पष्ट की गई है; बाद में सहजता के लिए ‘वाटिका’ रखा गया है।
- source_word: teacher
  choice: शिक्षक
  rationale: स्रोत की जानबूझकर प्रयुक्त पदवी को ‘सर्प’ बनाकर व्याख्यायित नहीं किया गया, जिससे कथानक की धार्मिक अस्पष्टता बनी रहे।
- source_word: deathless
  choice: अमर
  rationale: ‘मृत्युरहित’ की तुलना में अधिक स्वाभाविक हिन्दी है और आशय को ठीक रखती है।
- source_word: radiant bodies
  choice: ज्योतिर्मय पिंड
  rationale: यह खगोलीय पिंडों की ओर संकेत करता है, पर स्रोत से अधिक विशिष्ट होकर ‘ग्रह’ या ‘तारे’ नहीं कहता।
- source_word: consummation of the age
  choice: युग की पूर्णता
  rationale: अंतकालीन अभिव्यक्ति की धार्मिक व्यापकता बनाए रखता है; इसे किसी विशेष सांप्रदायिक शब्दावली में सीमित नहीं करता।
- source_word: Cherubin
  choice: करूब
  rationale: हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला रूप है; स्रोत के असामान्य बहुवचन को हिन्दी में स्वाभाविक सामूहिक रूप दिया गया है।
theological_decisions:
- issue: आज्ञा-उल्लंघन के बाद मिली ‘सहायता’ की पहचान
  choice: ‘उन्हें जो सहायता मिली थी’
  alternative: ‘शिक्षक ने जो सहायता की थी’
  rationale: प्रस्तुत साक्ष्य सहायता देने वाले को इस वाक्य में स्पष्ट नहीं करता; अनिर्दिष्टता सुरक्षित रखी गई है।
- issue: शिक्षक की पहचान
  choice: ‘शिक्षक’
  alternative: ‘सर्प’ या ‘उद्धारकर्ता’
  rationale: स्रोत की पदवी को बिना व्याख्यात्मक विस्तार के रखा गया है, ताकि किसी नामित धार्मिक व्याख्या को पाठ में न जोड़ा जाए।
- issue: ‘उनके आदम’ का संबंध
  choice: ‘उनके आदम’
  alternative: ‘आदम’
