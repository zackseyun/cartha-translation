  revised_text: '## सोफिया का प्रस्फुटन और सेनाएँ


    जब अमर सत्ताओं का स्वाभाविक स्वरूप अनंतता से विकसित होकर पूर्ण हो चुका था, तब पिस्टिस से एक प्रतिरूप प्रस्फुटित हुआ, जिसे सोफिया कहा जाता है। उसने अपनी इच्छा का प्रयोग किया और आदि-ज्योति के समान एक सृजित सत्ता बन गई। तुरंत उसकी इच्छा आकाश के प्रतिरूप में प्रकट हुई, जिसका आकार अबोधगम्य था और जो अमर सत्ताओं तथा उनके बाद अस्तित्व में आई सत्ताओं के बीच था, [...] के सदृश था।[a] उसने एक परदे का काम किया, जिसने मानवता को ऊपर की सत्ताओं से अलग कर दिया।


    अब सत्य के आयोन[b] की कोई बाहरी छाया नहीं है, क्योंकि अनंत ज्योति उसके भीतर सर्वत्र वास करती है। फिर भी उसका बाहरी भाग एक छाया है, जिसका नाम “अंधकार” है। उसमें से एक सेना प्रकट हुई, जिसने अंधकार के ऊपर शासन किया। उनके बाद अस्तित्व में आई सेनाओं ने उस छाया को “अनंत अराजकता” कहा। उसी में से हर प्रकार की दिव्य सत्ता ऊपर की ओर फूटी [...] और उसके साथ वह पूरा स्थान भी; इसका एक और परिणाम यह था कि छाया पहली [] सृजित सत्ता के बाद आई।[a] वह पहले बताई गई पिस्टिस से निकलकर अथाह गर्त के <भीतर> प्रकट हुई।[c]


    फिर छाया ने जान लिया कि उससे अधिक शक्तिशाली कोई सत्ता अस्तित्व में है और वह ईर्ष्यालु हो गई। अपनी ही इच्छा से गर्भवती होकर उसने तुरंत डाह को जन्म दिया। उस दिन से सभी आयोनों और उनके लोकों में प्रचलित डाह का नियम प्रत्यक्ष है। यह डाह भीतर से पूरी तरह आत्मा-रहित एक गर्भपातित भ्रूण निकला। वह एक विशाल जलराशि के भीतर छाया के रूप में अस्तित्व में आया। फिर छाया से उत्पन्न पित्त को अराजकता के एक भाग में धकेल दिया गया।


    उस दिन से एक जलराशि प्रत्यक्ष है। उसमें जो कुछ नीचे डूबा, वह अराजकता में दिखाई देते हुए बह निकला। जैसे किसी स्त्री के बच्चा जनते समय उसके भीतर इकट्ठा हुआ सारा द्रव्य बह निकलता है, वैसे ही पदार्थ एक छाया में से अस्तित्व में आया और उससे दूर धकेल दिया गया, फिर भी वह अराजकता से बाहर नहीं निकला।


    ## याल्दाबाओथ का प्रकट होना


    इसके बजाय पदार्थ अराजकता के भीतर, उसके एक भाग में बना रहा। इन घटनाओं के बाद पिस्टिस आई और अराजकता के उस पदार्थ के ऊपर प्रकट हुई, जो गर्भपातित भ्रूण के समान बाहर फेंका गया था, क्योंकि उसमें कोई आत्मा वास नहीं करती थी; वह पूरी तरह अनंत अंधकार और अथाह जल था। जब पिस्टिस ने अपनी त्रुटि से निकला परिणाम देखा, तो वह व्याकुल हो गई। उसकी व्याकुलता एक भयावह सृजित सत्ता के रूप में प्रकट हुई, जो अराजकता में उसकी ओर लपकी। वह उसकी ओर मुड़ी और अथाह गर्त में—जो सभी आकाशों के नीचे [] स्थित है—उसके मुख में फूँक मारी।[a] पिस्टिस सोफिया ने चाहा कि आत्मारहित सत्ता को एक प्रतिरूप में ढाला जाए और वह पदार्थ तथा उसकी सभी सेनाओं पर शासन करे। तब पहली बार जल में से सिंह के समान दिखाई देने वाला एक उभयलिंगी शासक[d] प्रकट हुआ। उसके भीतर बड़ा अधिकार था, पर वह नहीं जानता था कि वह कहाँ से अस्तित्व में आया है।


    जब पिस्टिस सोफिया ने उसे गहरे जल में इधर-उधर घूमते देखा, तो उसने उससे कहा, “बालक, इधर पार आ,” जो याल्दा-बाओथ के समान है।[e] उस दिन से स्पष्ट वाणी का नियम प्रकट हुआ और देवताओं, स्वर्गदूतों तथा मानवता तक फैल गया। स्पष्ट वाणी के फलस्वरूप जो अस्तित्व में आया था, उसे देवताओं, स्वर्गदूतों और मानवता ने पूर्ण किया।


    अब शासक याल्ताबाओथ पिस्टिस की शक्ति से अनजान था। उसने उसका मुख नहीं देखा, बल्कि जल में उस प्रतिरूप को देखा जो उससे बात कर रहा था। उसी वाणी के कारण उसने अपना नाम “याल्द<बा>ओथ” रखा।[c] किंतु सिद्ध जन उसे “अरियाएल” कहते हैं, क्योंकि वह सिंह के समान दिखाई देता था।


    जब उसने पदार्थ पर अधिकार पा लिया, तब पिस्टिस सोफिया ऊपर अपने प्रकाश में हट गई।'
