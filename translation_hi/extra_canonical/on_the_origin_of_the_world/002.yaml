  footnotes:
  - marker: a
    text: वर्ग कोष्ठकों में दी गई खाली जगहें और [...] उपलब्ध पाठ में टूटन या लुप्त अंश का संकेत हैं; इसलिए वाक्य कहीं-कहीं अपूर्ण है।
    reason: पांडुलिपि-संबंधी अनिश्चितता को पाठक के सामने स्पष्ट रखना।
  - marker: b
    text: “आयोन” इस ग्रंथ में किसी कालखंड के साथ-साथ एक शाश्वत लोक या दिव्य सत्ता का भी संकेत दे सकता है; यहाँ अर्थ जानबूझकर खुला रखा गया है।
    reason: तकनीकी शब्द की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: कोणीय कोष्ठक < > संपादकीय रूप से पुनःस्थापित अक्षर या शब्द दिखाते हैं।
    reason: स्रोत-साक्ष्य की संपादकीय बहाली को अनुवाद का निश्चित पाठ न दिखाना।
  - marker: d
    text: “शासक” उस पद का अनुवाद है जिसे प्रायः यूनानी रूप “आर्खोन” कहा जाता है—अर्थात अधिकार रखने वाली ब्रह्मांडीय सत्ता।
    reason: तकनीकी संज्ञा को सामान्य पाठक के लिए स्पष्ट करना।
  - marker: e
    text: “याल्दा-बाओथ” नाम की यह व्याख्या इसी ग्रंथ का कथन है। आगे पाठ में इस नाम की वर्तनी याल्ताबाओथ और याल्द<बा>ओथ रूपों में भी मिलती है।
    reason: नाम की पाठगत विविधता और आंतरिक व्युत्पत्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: Sophia
  choice: सोफिया
  rationale: नाम को लिप्यंतरित रखा गया है; इसे ‘बुद्धि’ अनूदित करने से व्यक्तिवाचक और संकल्पनात्मक अर्थों का तनाव मिट जाता।
- source_word: Pistis
  choice: पिस्टिस
  rationale: व्यक्तिवाचक नाम के रूप में लिप्यंतरण किया गया; ‘विश्वास’ करने से पाठ संभावित रूप से अधिक व्याख्यात्मक हो जाता।
- source_word: aeon
  choice: आयोन
  rationale: इस गूढ़ ब्रह्मांड-विज्ञान के तकनीकी शब्द को लिप्यंतरित रखा गया और पाद-टिप्पणी में इसकी अर्थ-सीमा बताई गई।
- source_word: Chaos
  choice: अस्तव्यस्तता
  rationale: सामान्य अर्थ को आधुनिक हिंदी में व्यक्त किया गया, पर बड़े अक्षर वाले नाम-सदृश प्रयोग को उद्धरण और प्रसंग से सुरक्षित रखा गया।
- source_word: archon
  choice: शासक
  rationale: मूल पद का केंद्रीय अर्थ अधिकार रखने वाली शासक सत्ता है; सांप्रदायिक पारिभाषिकता से बचने के लिए सहज हिंदी चुनी गई।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: सत्ता में स्त्री और पुरुष दोनों लक्षण होने के कथन को बिना नरम किए औपचारिक और बोधगम्य रूप में रखा गया।
- source_word: spirit
  choice: आत्मा
  rationale: स्रोत-साक्ष्य में जीवदायी/आत्मिक तत्त्व की अस्पष्टता को बनाए रखते हुए प्रचलित धार्मिक हिंदी पद चुना गया।
- source_word: matter
  choice: पदार्थ
  rationale: ब्रह्मांडीय द्रव्य के दार्शनिक अर्थ के लिए ‘पदार्थ’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: articulate speech
  choice: स्पष्ट वाणी
