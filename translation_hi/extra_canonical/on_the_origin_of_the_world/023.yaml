base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/023.yaml
  text: 'So, when Sophia Zoe saw the archons of darkness placing a curse on her companions, she became furious. Leaving the first heaven with full power, she pursued those archons, drove them out of [their] heavens, and threw them down into the world of transgression, making them dwell there as wicked demons on the earth.


    [She sent out a bird], [] which would spend its thousand years in Paradise in their world—a living creature endowed with soul, called the “phoenix.” It kills itself and comes back to life in order to bear witness to the judgment (decreed) against them, because they mistreated Adam and his race, even to the consummation of the age.


    There are three kinds of men, along with their descendants, until the consummation of the world: those endowed with spirit, those endowed with soul, and the earthly. Similarly, there are three phoenixes <inside> Paradise: the first is deathless, and the second lives for 1,000 years. Concerning the third, it is written in the sacred Scripture that it is consumed. Similarly, there are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, so also does the water hydri in Egypt symbolize those who descend into the baptism of a true man.


    The two bulls in Egypt have a symbolic meaning, [14] namely, the sun and the moon. This is a symbol of Sabaoth, because Sophia obtained the universe from the day she fashioned the sun and the moon, placing a seal on her heaven until the age ends.


    The worm born from the phoenix also symbolizes a human being, concerning whom it is written, “The just man will blossom like a phoenix,” [15] and the phoenix first appears alive, then dies and rises again, serving as a symbol of what will happen at the consummation of the age.


    These powerful symbols appeared only in Egypt and nowhere else, to indicate [] that it resembles the Paradise of God.'
translation:
  language: hi
  text: 'इसलिए जब सोफिया ज़ोए ने देखा कि अंधकार के शासक उसके साथियों को शाप दे रहे हैं, तो वह क्रोध से भर उठी। वह पूर्ण सामर्थ्य के साथ पहले स्वर्ग से बाहर निकली, उन शासकों का पीछा किया, उन्हें [उनके] स्वर्गों से निकाल दिया और नीचे अपराध के संसार में फेंक दिया, ताकि वे पृथ्वी पर दुष्ट दुष्टात्माओं के रूप में रहें।


    [उसने एक पक्षी भेजा], [a] जो उनके संसार में अपने हज़ार वर्ष परादीस में बिताता—प्राण से युक्त एक जीव, जिसे “फ़ीनिक्स” कहा जाता है। वह स्वयं को मार डालता है और फिर अपने आपको जीवित कर लेता है, ताकि उनके विरुद्ध ठहराए गए न्याय की गवाही दे; क्योंकि उन्होंने आदम और उसके वंश के साथ दुर्व्यवहार किया था—युग की पूर्णता तक।


    संसार की पूर्णता तक मनुष्य तीन प्रकार के हैं, और उनके वंशज भी: आत्मा से युक्त, प्राण से युक्त और पार्थिव। इसी प्रकार परादीस <के भीतर> तीन फ़ीनिक्स हैं: पहला मृत्युहीन है और दूसरा एक हज़ार वर्ष जीवित रहता है। तीसरे के विषय में पवित्र शास्त्र में लिखा है कि वह भस्म हो जाता है। इसी प्रकार बपतिस्मे भी तीन हैं: पहला आत्मिक, दूसरा आग से और तीसरा पानी से।


    ठीक जैसे फ़ीनिक्स स्वर्गदूतों का प्रतीक है, वैसे ही मिस्र का जल-हाइड्री[b] उन लोगों का प्रतीक है जो एक सच्चे मनुष्य के बपतिस्मे में उतरते हैं।


    मिस्र के दोनों बैलों का एक प्रतीकात्मक अर्थ है,[c] अर्थात सूर्य और चंद्रमा। यह सबाओथ का प्रतीक है, क्योंकि जिस दिन सोफिया ने सूर्य और चंद्रमा को गढ़ा, उस दिन से उसने समस्त विश्व को प्राप्त किया और युग के अंत तक के लिए अपने स्वर्ग पर मुहर लगा दी।


    फ़ीनिक्स से उत्पन्न होने वाला कीड़ा भी मनुष्य का प्रतीक है, जिसके विषय में लिखा है, “धर्मी मनुष्य फ़ीनिक्स के समान फूलेगा।”[d] फ़ीनिक्स पहले जीवित दिखाई देता है, फिर मरता है और दोबारा जी उठता है; इस प्रकार वह युग की पूर्णता पर होने वाली घटना का प्रतीक बनता है।


    ये सामर्थी प्रतीक केवल मिस्र में प्रकट हुए, और कहीं नहीं, यह दिखाने के लिए [e] कि वह परमेश्वर के परादीस के समान है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि में पाठ लुप्त या अस्पष्ट है; कोष्ठक में दिया वाक्यांश संपादकीय पुनर्निर्माण है।
    reason: मूल साक्षी में ‘[She dispatched a bird], []’ के रूप में रिक्ति और पुनर्निर्माण चिह्नित हैं।
  - marker: b
    text: “जल-हाइड्री” का ठीक आशय अनिश्चित है; उपलब्ध साक्षी का पद बिना व्याख्यात्मक पहचान के रखा गया है।
    reason: स्रोत-भाषा की समीक्षा लंबित है और अंग्रेज़ी साक्षी स्वयं ‘water hydri’ को अनिर्वचनीय रूप में रखता है।
  - marker: c
    text: कुछ संस्करणों में यहाँ टिप्पणी-संख्या 14 दी जाती है; उसकी सामग्री उपलब्ध स्रोत-सामग्री में नहीं दी गई।
    reason: प्रदान किए गए साक्षी का [14] मुख्य वाक्य का पाठ नहीं, पूर्व प्रकाशन का टिप्पणी-संकेत प्रतीत होता है।
  - marker: d
    text: कुछ संस्करणों में यहाँ टिप्पणी-संख्या 15 दी जाती है; उद्धरण की शब्दावली फ़ीनिक्स और खजूर के वृक्ष के बीच प्राचीन शब्द-संबंध पर आधारित हो सकती है।
    reason: प्रदान किए गए साक्षी का [15] टिप्पणी-संकेत है; हिन्दी में असामान्य ‘फ़ीनिक्स के समान फूलेगा’ को बिना सुधार के समझाने की आवश्यकता है।
  - marker: e
    text: इस स्थान पर पांडुलिपि में कुछ पाठ लुप्त या अस्पष्ट है।
    reason: साक्षी में ‘to indicate [] that’ के बीच स्पष्ट रिक्ति चिह्न है।
lexical_decisions:
- source_word: Sophia Zoe
  choice: सोफिया ज़ोए
  rationale: व्यक्तिनाम को लिप्यंतरित किया गया; इसके अर्थ ‘बुद्धि-जीवन’ को अनुवाद बनाकर पहचान को अस्पष्ट नहीं किया।
- source_word: archons
  choice: शासक
  rationale: ग्नोस्टिक पारिभाषिक अर्थ को बनाए रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य शब्द चुना।
- source_word: plenary power
  choice: पूर्ण सामर्थ्य
  rationale: समग्र अधिकार/शक्ति का भाव रखता है और प्रसंग में स्वाभाविक है।
- source_word: world of transgression
  choice: अपराध का संसार
  rationale: नैतिक उल्लंघन का अर्थ रखा; इसे किसी विशिष्ट धर्मसैद्धांतिक ‘पतन’ से नहीं बदला।
- source_word: soul / spirit
  choice: प्राण / आत्मा
  rationale: पाठ में दोनों श्रेणियों के जानबूझकर किए गए भेद को हिन्दी में अलग शब्दों से सुरक्षित रखा।
- source_word: earthly
  choice: पार्थिव
  rationale: ‘पृथ्वी से संबंधित/बना हुआ’ श्रेणीगत अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: phoenix
  choice: फ़ीनिक्स
  rationale: पौराणिक प्राणी का प्रचलित लिप्यंतरण; आगे का वर्णन उसका आशय स्पष्ट करता है।
- source_word: Paradise
  choice: परादीस
  rationale: विशिष्ट ब्रह्मांडीय स्थान के रूप में पारिभाषिक रंग बनाए रखने के लिए लिप्यंतरण अपनाया।
- source_word: water hydri
  choice: जल-हाइड्री
  rationale: स्रोत-साक्ष्य में पद अनिश्चित है; अनुमानित प्राणी या वस्तु का नाम आरोपित नहीं किया गया।
- source_word: baptism
  choice: बपतिस्मा
  rationale: आधुनिक हिन्दी मसीही लेखन का व्यापक, संप्रदाय-निरपेक्ष पारिभाषिक रूप।
- source_word: Sabaoth
  choice: सबाओथ
  rationale: इस ग्रंथ में व्यक्तिसंज्ञा के रूप में प्रयुक्त नाम का लिप्यंतरण किया।
- source_word: consummation of the age
  choice: युग की पूर्णता
  rationale: सिर्फ ‘अंत’ कहने के बजाय पूर्ण होने/चरम तक पहुँचने की अर्थच्छाया बचाई।
theological_decisions:
- issue: मानवता की त्रिविध श्रेणियाँ
  choice: ‘आत्मा से युक्त, प्राण से युक्त और पार्थिव’
  alternative: ‘आध्यात्मिक, मानसिक और भौतिक मनुष्य’
  rationale: पाठ के आत्मा/प्राण संबंधी वास्तविक भेद को संरक्षित किया और बाद की दार्शनिक शब्दावली आरोपित नहीं की।
- issue: फ़ीनिक्स का पुनर्जीवन
  choice: ‘फिर अपने आपको जीवित कर लेता है’
  alternative: ‘पुनर्जीवित होता है’
  rationale: साक्षी-पाठ में क्रिया के आत्मवाचक बल को रखा, बिना इसे परमेश्वर द्वारा पुनरुत्थान के रूप में धर्मसैद्धांतिक ढंग से हल किए।
- issue: ‘एक सच्चे मनुष्य का बपतिस्मा’
  choice: संबंधवाचक अस्पष्टता ज्यों की त्यों रखी
  alternative: ‘सच्चे मनुष्य द्वारा दिया गया बपतिस्मा’
  rationale: वाक्यांश यह स्पष्ट नहीं करता कि मनुष्य बपतिस्मे का कर्ता है, स्वामी है या उसका स्वरूप; इसलिए व्याख्यात्मक विस्तार नहीं किया।
- issue: सोफिया और विश्व
  choice: ‘उसने समस्त विश्व को प्राप्त किया’
  alternative: ‘उसे विश्व पर अधिकार मिला’
  rationale: ‘obtaining’ की अस्पष्टता को बचाया; अधिकार, सृजन या उत्तराधिकार में से किसी एक को निर्णायक नहीं बनाया।
- issue: मिस्र और परमेश्वर का परादीस
  choice: ‘वह ... के समान है’
  alternative: ‘मिस्र ... के समान है’
  rationale: संदर्भ से मिस्र संभावित पूर्वपद है, पर स्रोत में सर्वनाम है; मुख्य पाठ में सर्वनाम रखकर अस्पष्टता संरक्षित की।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। वर्गीकरण और ब्रह्मांड-विज्ञान के पारिभाषिक भेद सुरक्षित हैं। वर्ग कोष्ठक पांडुलिपीय या संपादकीय अनिश्चितता, और कोणीय कोष्ठक संपादकीय पूर्ति दर्शाते हैं। उपलब्ध आधार प्रत्यक्ष कॉप्टिक समीक्षा नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; इसलिए अनिश्चित पदों को अनुमान से स्पष्ट नहीं किया गया।
