  revised_text: 'इसलिए जब सोफिया ज़ोए ने देखा कि अंधकार के शासक उसके साथियों को शाप दे रहे हैं, तो वह क्रोध से भर उठी। वह पूर्ण सामर्थ्य के साथ पहले स्वर्ग से बाहर निकली, उन शासकों का पीछा किया, उन्हें [उनके] स्वर्गों से निकाल दिया और नीचे अपराध के संसार में फेंक दिया, ताकि वे पृथ्वी पर दुष्ट दानवों के रूप में रहें।


    [उसने एक पक्षी भेजा], [] जो उनके संसार में अपने हज़ार वर्ष परादीस में बिताता—प्राण से युक्त एक जीव, जिसे “फ़ीनिक्स” कहा जाता है। वह स्वयं को मार डालता है और स्वयं को फिर जीवित कर लेता है, ताकि उनके विरुद्ध ठहराए गए न्याय की गवाही दे; क्योंकि उन्होंने आदम और उसके वंश के साथ दुर्व्यवहार किया था—युग की पूर्णता तक।


    संसार की पूर्णता तक मनुष्य तीन प्रकार के हैं, और उनके वंशज भी: आत्मा से युक्त, प्राण से युक्त और पार्थिव। इसी प्रकार परादीस <के भीतर> तीन फ़ीनिक्स हैं: पहला मृत्युहीन है और दूसरा एक हज़ार वर्ष जीवित रहता है। तीसरे के विषय में पवित्र शास्त्र में लिखा है कि वह भस्म हो जाता है। इसी प्रकार बपतिस्मे भी तीन हैं: पहला आत्मिक, दूसरा आग से और तीसरा पानी से।


    ठीक जैसे फ़ीनिक्स स्वर्गदूतों का प्रतीक है, वैसे ही मिस्र का जल-हाइड्री उन लोगों का प्रतीक है जो एक सच्चे मनुष्य के बपतिस्मे में उतरते हैं।


    मिस्र के दोनों बैलों का एक प्रतीकात्मक अर्थ है, [14] अर्थात सूर्य और चंद्रमा। यह सबाओथ का प्रतीक है, क्योंकि जिस दिन सोफिया ने सूर्य और चंद्रमा को गढ़ा, उस दिन से उसने समस्त विश्व को प्राप्त किया और युग के अंत तक के लिए अपने स्वर्ग पर मुहर लगा दी।


    फ़ीनिक्स से उत्पन्न होने वाला कीड़ा भी मनुष्य का प्रतीक है, जिसके विषय में लिखा है, “धर्मी मनुष्य फ़ीनिक्स के समान फूलेगा।” [15] फ़ीनिक्स पहले जीवित दिखाई देता है, फिर मरता है और दोबारा जी उठता है; इस प्रकार वह युग की पूर्णता पर होने वाली घटना का प्रतीक बनता है।


    ये सामर्थी प्रतीक केवल मिस्र में प्रकट हुए, और कहीं नहीं, यह दिखाने के लिए [] कि वह परमेश्वर के परादीस के समान है।'
