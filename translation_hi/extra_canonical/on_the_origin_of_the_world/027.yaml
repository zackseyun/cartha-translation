  revised_text: 'युग की परिपूर्णता से पहले, समूचा स्थान भारी मेघगर्जन से काँप उठेगा। तब शासक अपनी (निकट आती) [] मृत्यु के [भय] से शोकाकुल होंगे। स्वर्गदूत उनकी मानवता के लिए विलाप करेंगे, दुष्टात्माएँ अपने-अपने समयों के लिए रोएँगी, और उनकी मानवता अपनी (निकट आती) मृत्यु पर कराहेगी और चीखेगी।[a]


    तब वह युग आरम्भ होगा और वे व्याकुल हो उठेंगे। उनके राजा अग्निमय तलवार से मतवाले हो जाएँगे और एक-दूसरे के विरुद्ध युद्ध करेंगे; रक्तपात से पृथ्वी मतवाली हो जाएगी, और उन युद्धों के कारण समुद्रों में हलचल मच जाएगी। तब सूर्य अन्धकारमय हो जाएगा और चन्द्रमा अपना प्रकाश ढक लेगा। आकाश के तारे अपनी कक्षाओं में चलना बन्द कर देंगे। तब उस विशाल सेना में से प्रचण्ड गर्जना फूटेगी, जो अराजकता की हर सेना के ऊपर है और जहाँ स्त्री का आकाश-मण्डल स्थित है।


    पहली सृष्टि को उत्पन्न कर चुकने के बाद, वह विवेक की ज्ञानमय अग्नि अलग रख देगी और विवेकहीन क्रोध को वस्त्र के समान पहन लेगी।


    इसके बाद वह अराजकता के उन देवताओं का पीछा करेगी, जिन्हें उसने आदि-जनक के साथ मिलकर रचा था। वह उन्हें अथाह गर्त में धकेल देगी। उनकी बुराई के कारण उनका सर्वनाश होगा, क्योंकि वे ज्वालामुखियों के समान हो जाएँगे और एक-दूसरे को निगलते रहेंगे, जब तक कि आदि-जनक की शक्ति से उनका विनाश न हो जाए।


    उनका विनाश करने के बाद, वह अपने ही विरुद्ध हो जाएगा और अपने आपको भी मिटा डालेगा, यहाँ तक कि उसका अस्तित्व नहीं रहेगा। उनके आकाश एक-दूसरे पर गिर पड़ेंगे और उनकी सेनाएँ आग में भस्म हो जाएँगी। उनके ऐयोन भी उलट दिए जाएँगे। उसका आकाश नीचे गिरकर दो टुकड़ों में टूट जाएगा। उसके [तारे . . .] पृथ्वी पर गिरेंगे, [और पृथ्वी उन्हें सह न सकेगी]। वे अथाह गर्त में गिरेंगे और अथाह गर्त भी उलट दिया जाएगा। प्रकाश अन्धकार पर [विजय पाएगा] और उसे मिटा डालेगा। वह ऐसा हो जाएगा मानो [] कभी अस्तित्व में ही न था। अन्धकार का मूल विलीन हो जाएगा और अपूर्णता जड़ से उखाड़कर अन्धकार में फेंक दी जाएगी। प्रकाश ऊपर अपने मूल की ओर लौट जाएगा। तब अजन्मे की महिमा प्रकट होगी और हर ऐयोन को भर देगी—जब भविष्यवाणियाँ और राजाओं के लेख प्रकट होंगे और उन लोगों के द्वारा पूरे किए जाएँगे जो ‘सिद्ध’ कहलाते हैं।[b]


    किन्तु जो अजन्मे पिता में सिद्ध नहीं हुए हैं, वे अपने-अपने ऐयोन में और अमर जनों के राज्यों में अपनी महिमा पाएँगे; पर वे कभी राजाविहीन ऐयोन में प्रवेश नहीं करेंगे, क्योंकि प्रत्येक को उसी स्थान पर जाना है जहाँ से वह आया था। हर व्यक्ति अपने कर्मों और अपने ज्ञान के द्वारा अपना-अपना स्वभाव प्रकट करेगा।'
