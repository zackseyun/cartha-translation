translation:
  language: hi
  text: 'युग की परिपूर्णता से पहले, वह समूचा स्थान प्रचण्ड गर्जन से काँप उठेगा। तब शासक अपनी निकट आती [...] मृत्यु के [भय] से शोकाकुल होंगे। स्वर्गदूत उनकी मानवता के लिए विलाप करेंगे, दुष्टात्माएँ अपने नियत कालों पर रोएँगी, और उनकी मानवता अपनी निकट आती मृत्यु पर कराहेगी और चीखेगी।[a]


    तब वह युग आरम्भ होगा और वे व्याकुल हो उठेंगे। उनके राजा अग्निमय तलवार से मतवाले हो जाएँगे और एक-दूसरे के विरुद्ध युद्ध करेंगे; रक्तपात से पृथ्वी मतवाली हो जाएगी, और उन युद्धों के कारण समुद्रों में हलचल मच जाएगी। तब सूर्य अन्धकारमय हो जाएगा और चन्द्रमा अपना प्रकाश ढक लेगा। आकाश के तारे अपनी कक्षाओं में चलना बन्द कर देंगे। तब अव्यवस्था की हर सेना के ऊपर स्थित एक विशाल सेना में से प्रचण्ड गर्जन निकलेगा—वहीं स्त्री का आकाश-मण्डल स्थित है।


    पहली सृष्टि को उत्पन्न कर चुकने के बाद, वह विवेक की ज्ञानमय अग्नि उतार देगी और विवेकहीन क्रोध को वस्त्र के समान पहन लेगी।


    इसके बाद वह अव्यवस्था के उन देवताओं का पीछा करेगी, जिन्हें उसने आदि-जनक के साथ मिलकर रचा था। वह उन्हें अथाह गर्त में धकेल देगी। उनकी बुराई के कारण उनका सर्वनाश होगा, क्योंकि वे ज्वालामुखियों के समान हो जाएँगे और एक-दूसरे को निगलते रहेंगे, जब तक कि आदि-जनक की शक्ति से उनका विनाश न हो जाए।


    उनका विनाश करने के बाद, वह अपने ही विरुद्ध हो जाएगा और अपने आपको भी मिटा डालेगा, यहाँ तक कि उसका अस्तित्व नहीं रहेगा। उनके आकाश एक-दूसरे पर गिर पड़ेंगे और उनकी सेनाएँ आग में भस्म हो जाएँगी। उनके ऐयोन भी उलट दिए जाएँगे। उसका आकाश नीचे गिरकर दो टुकड़ों में टूट जाएगा। उसके [तारे ...] पृथ्वी पर गिरेंगे, [और पृथ्वी उन्हें सह न सकेगी]। वे अथाह गर्त में गिरेंगे और अथाह गर्त भी उलट दिया जाएगा। प्रकाश अन्धकार पर [विजय पाएगा] और उसे मिटा डालेगा। वह ऐसा हो जाएगा मानो [...] कभी अस्तित्व में ही न था। अन्धकार का मूल विलीन हो जाएगा और अपूर्णता जड़ से उखाड़कर अन्धकार में फेंक दी जाएगी। प्रकाश ऊपर अपने मूल की ओर लौट जाएगा। तब अजन्मे की महिमा प्रकट होगी और हर ऐयोन को भर देगी—जब भविष्यवाणियाँ और राजाओं के लेख प्रकट होंगे और उन लोगों के द्वारा पूरे किए जाएँगे जो ‘सिद्ध’ कहलाते हैं।[b]


    किन्तु जो अजन्मे पिता में सिद्ध नहीं हुए हैं, वे अपने-अपने ऐयोन में और अमर जनों के राज्यों में अपनी महिमा पाएँगे; पर वे कभी राजाविहीन ऐयोन में प्रवेश नहीं करेंगे, क्योंकि प्रत्येक को उसी स्थान पर जाना है जहाँ से वह आया था। हर व्यक्ति अपने कर्मों और अपने ज्ञान के द्वारा अपना स्वभाव प्रकट करेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अनुच्छेद में कोष्ठक सम्भावित पुनर्स्थापन और [...] पाण्डुलिपि की क्षति अथवा अपठनीय अंश को दर्शाते हैं। ‘उनकी मानवता’ का सटीक संदर्भ अनिश्चित है।
    reason: पाठगत क्षति और सर्वनामगत अस्पष्टता को प्रकाशित पाठ में पारदर्शी बनाना।
  - marker: b
    text: ‘ऐयोन’ यहाँ केवल समय-युग नहीं, बल्कि ज्ञानवादी ब्रह्माण्ड-कल्पना का एक विशिष्ट लोक, क्षेत्र या दैवी व्यवस्था भी हो सकता है। कोष्ठक पाण्डुलिपि में पुनर्स्थापित पाठ को दर्शाते हैं।
    reason: तकनीकी शब्द के अर्थ-क्षेत्र और पुनर्स्थापन संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: archons
  choice: शासक
  rationale: ज्ञानवादी संदर्भ के तकनीकी अर्थ को बनाए रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य शब्द; इसे सांसारिक राजाओं तक सीमित नहीं किया गया।
- source_word: aeon / age
  choice: युग; तकनीकी प्रसंगों में ऐयोन
  rationale: समय-समाप्ति वाले सामान्य अर्थ में ‘युग’, पर लोक/दैवी सत्ता अथवा विशिष्ट ब्रह्माण्डीय क्षेत्र के ज्ञानवादी तकनीकी अर्थ में ‘ऐयोन’, ताकि दो अर्थ कृत्रिम रूप से एक न हो जाएँ।
- source_word: Chaos
  choice: अव्यवस्था
  rationale: मूल ब्रह्माण्डीय क्षेत्र का अर्थ व्यक्त करता है; बड़े अक्षर से सूचित व्यक्तिवाची तकनीकी प्रयोग हिन्दी में प्रसंग से स्पष्ट रखा गया।
- source_word: Abyss
  choice: अथाह गर्त
  rationale: गहन, अधोलौकिक क्षेत्र का चित्र स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: Primal Parent
  choice: आदि-जनक
  rationale: मूल में निहित आद्य अभिभावक/जनक की धारणा और लिंगगत संभावित व्यापकता को यथासम्भव खुला रखता है।
- source_word: unbegotten one / unbegotten Father
  choice: अजन्मा; अजन्मा पिता
  rationale: अनुत्पन्न होने की दार्शनिक-धार्मिक धारणा को बिना किसी सम्प्रदायगत व्याख्या के सीधे व्यक्त करता है।
- source_word: perfect
  choice: सिद्ध
  rationale: आध्यात्मिक पूर्णता के तकनीकी भाव को संक्षिप्त और प्रतिष्ठित हिन्दी में रखता है।
- source_word: kingless aeon
  choice: राजाविहीन ऐयोन
  rationale: असामान्य मूल अभिव्यक्ति को व्याख्यात्मक रूप से बदलने के बजाय सुरक्षित रखा गया।
theological_decisions:
- issue: ‘उनकी मानवता’ का संदर्भ
  choice: असामान्य और अस्पष्ट संबंध को यथावत रखा
  alternative: ‘मनुष्यों’ या ‘मानवजाति’ के लिए सामान्यीकृत करना
  rationale: उपलब्ध साक्ष्य में सर्वनाम-संबंध अनिश्चित है; उसे चुपचाप स्पष्ट करना मूल की ज्ञानवादी मानवतत्त्व-संबंधी सम्भावना मिटा देता।
- issue: स्त्री की पहचान
  choice: केवल ‘वह’ और ‘स्त्री’ रखा
  alternative: किसी विशिष्ट ज्ञानवादी पात्र का नाम जोड़ना
  rationale: इस अंश में पहचान नाम से नहीं दी गई; बाहरी व्याख्या आयात नहीं की गई।
- issue: आदि-जनक के लिए बाद का पुल्लिंग सर्वनाम
  choice: ‘वह अपने ही विरुद्ध हो जाएगा’ रखा
  alternative: कर्त्ता को स्त्री मानकर अनुवाद करना या नाम जोड़ना
  rationale: अंग्रेज़ी साक्ष्य में she से he का वास्तविक परिवर्तन है; सम्भावित पाठगत अथवा संदर्भगत तनाव को सुरक्षित रखा गया।
- issue: ‘सिद्ध’ लोगों द्वारा भविष्यवाणियों की पूर्ति
  choice: कर्ता-संबंध को मूल की तरह खुला रखा
  alternative: ईश्वर द्वारा पूर्ति या केवल लेखों के प्रकाशन के रूप में स्पष्ट करना
  rationale: उपलब्ध वाक्यरचना ‘सिद्ध’ कहलाने वालों को पूर्ति से जोड़ती है; इसे धर्मशास्त्रीय सुविधा के लिए नहीं बदला गया।
- issue: राजाविहीन ऐयोन
  choice: शाब्दिक तकनीकी रूप बनाए रखा
  alternative: ‘परम लोक’, ‘ईश्वर का राज्य’ या अन्य सम्प्रदायगत समानार्थक
  rationale: ऐसे विकल्प मूल की विशिष्ट ब्रह्माण्ड-रचना को किसी परिचित धर्मशास्त्रीय ढाँचे में विलीन कर देते।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रलय-दर्शी लय रखी गई है। स्रोत-भाषा की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है। पाण्डुलिपि-पृष्ठ संख्या [17] हटाई गई, जबकि पाठ-क्षति और सम्पादकीय पुनर्स्थापन के संकेत सुरक्षित रखे गए। तकनीकी ज्ञानवादी शब्दावली को जहाँ आवश्यक था वहाँ लिप्यन्तरित ‘ऐयोन’ से अलग किया गया, पर अनावश्यक विदेशीपन से बचा गया।
