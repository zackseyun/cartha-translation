id: ORIGW.001
reference: On the Origin of the World — Introduction
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: '[] Given that everyone, (both) cosmic gods and humans, says that nothing existed before Chaos, in contrast to them, I will prove all of them to be in error, because they are ignorant of the origin of Chaos and of its root as well. The proof is here:


    When it comes to the topic of Chaos, how it pleases [] all people to claim that it is a type of darkness, when it actually originates from a shadow called by the name “Darkness,” and the shadow originates from a created entity that has existed from the beginning. Furthermore, it clearly existed before Chaos came to be, and the latter came to exist subsequent to the former created entity.


    Consequently, let us occupy ourselves with the realities of the case, and in addition to this, with the first created entity, out of which Chaos was propelled, and thus will the truth be clearly proven.'
