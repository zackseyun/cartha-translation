translation:
  language: hi
  text: '**जगत की उत्पत्ति के विषय में — भूमिका**


    [a] चूँकि सभी लोग—जगत के देवता और मनुष्य दोनों—कहते हैं कि कैओस से पहले कुछ भी अस्तित्व में नहीं था, इसलिए मैं उनके विपरीत यह प्रमाणित करूँगा कि वे सब भूल में हैं; क्योंकि वे कैओस की उत्पत्ति और उसकी जड़, दोनों से अनजान हैं। इसका प्रमाण यह है:


    कैओस के विषय में [b] सभी लोग यह दावा करना पसंद करते हैं कि वह एक प्रकार का अंधकार है। पर वास्तव में वह उस छाया से उत्पन्न हुआ जिसे “अंधकार” कहा जाता है, और वह छाया एक ऐसी सृजित सत्ता से उत्पन्न हुई जो आरंभ से अस्तित्व में रही है। स्पष्ट है कि वह सत्ता कैओस के अस्तित्व में आने से पहले विद्यमान थी, और कैओस उस पहली सृजित सत्ता के बाद अस्तित्व में आया।


    इसलिए आओ, हम इस विषय की वास्तविकताओं पर विचार करें, और साथ ही उस पहली सृजित सत्ता पर भी, जिसमें से कैओस को बाहर धकेला गया। इस प्रकार सत्य स्पष्ट रूप से प्रमाणित हो जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध पांडुलिपि-साक्ष्य में आरंभिक पाठ लुप्त या अनिश्चित है।
    reason: आपूर्ति किए गए साक्ष्य के आरंभ में रिक्त वर्ग-कोष्ठक पांडुलिपि की क्षति या संभावित पुनर्स्थापन का संकेत देते हैं।
  - marker: b
    text: इस स्थान पर उपलब्ध पांडुलिपि-साक्ष्य में कुछ पाठ लुप्त या अनिश्चित है।
    reason: आपूर्ति किए गए साक्ष्य में यहाँ रिक्त वर्ग-कोष्ठक हैं; अनिश्चित सामग्री का अनुमान लगाकर उसे मुख्य पाठ में नहीं जोड़ा गया।
lexical_decisions:
- source_word: Chaos
  choice: कैओस
  rationale: यहाँ यह सामान्य ‘अव्यवस्था’ नहीं, बल्कि सृष्टि-विषयक एक विशिष्ट आदिम सत्ता या अवस्था का नाम है; लिप्यंतरण उस विशिष्ट अर्थ और पाठ की दार्शनिक शब्दावली को सुरक्षित रखता है।
- source_word: cosmic gods
  choice: जगत के देवता
  rationale: ‘Cosmic’ के ब्रह्मांड-संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इन देवताओं की प्रकृति या पद के विषय में अतिरिक्त व्याख्या जोड़े।
- source_word: root
  choice: जड़
  rationale: मूल साक्ष्य में निहित उद्गम, आधार या कारण की रूपकात्मक अस्पष्टता को बनाए रखता है।
- source_word: created entity
  choice: सृजित सत्ता
  rationale: ‘Entity’ को किसी निश्चित व्यक्ति, प्राणी या पदार्थ के रूप में सीमित किए बिना उसके अस्तित्वगत अर्थ को सुरक्षित रखता है।
- source_word: was propelled
  choice: बाहर निकला
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की गतिशील छवि को बनाए रखता है; केवल ‘उत्पन्न हुआ’ कहने से इस बिंब का लोप हो जाता।
- source_word: realities of the case
  choice: इस विषय की वास्तविकताएँ
  rationale: शाब्दिक आशय और तर्कपूर्ण शैली को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: कैओस से पहले एक सृजित सत्ता का अस्तित्व
  choice: पाठ के कथन को उसी क्रम में रखा गया कि पहली सृजित सत्ता कैओस से पहले विद्यमान थी।
  alternative: इसे परमेश्वर, बुद्धि, प्रकाश या किसी अन्य नामित सत्ता के रूप में पहचानना।
  rationale: इस अंश में उस सत्ता की पहचान स्पष्ट नहीं की गई है; किसी विशिष्ट धार्मिक पहचान को जोड़ना पाठ की वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: ‘अंधकार’ नाम की छाया और कैओस का संबंध
  choice: कैओस को “अंधकार” कही जाने वाली छाया से उत्पन्न बताया गया।
  alternative: कैओस और अंधकार को एक ही वस्तु मानना।
  rationale: पाठ स्पष्ट रूप से प्रचलित धारणा का खंडन करते हुए दोनों में भेद करता है; अनुवाद ने इस तनाव को सुरक्षित रखा है।
- issue: आरंभ से अस्तित्व में रही ‘सृजित’ सत्ता
  choice: ‘सृजित’ और ‘आरंभ से अस्तित्व में रही’ दोनों कथनों को साथ रखा गया।
  alternative: संभावित विरोधाभास दूर करने के लिए ‘सृजित’ हटाना या ‘आरंभ से’ का अर्थ बदलना।
  rationale: पाठ का धर्मवैचारिक तनाव जानबूझकर अनसुलझा रखा गया है, क्योंकि उपलब्ध साक्ष्य दोनों बातें कहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम अनुवाद है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है। इसलिए शब्द-क्रम की अपेक्षा आशय और तर्क-संबंधों को प्राथमिकता दी गई है, जबकि पांडुलिपीय रिक्तियाँ और प्रमुख दार्शनिक अस्पष्टताएँ सुरक्षित रखी गई हैं।
