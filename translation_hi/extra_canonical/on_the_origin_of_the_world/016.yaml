base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: hi
  text: 'हव्वा पहली कुँवारी है—वही जिसने पति के बिना अपनी पहली संतान को जन्म दिया। उसने स्वयं ही अपनी दाई का काम किया; इसी कारण माना जाता है कि उसने कहा:


    मैं वही हूँ जो अपनी माता का अंश हूँ,

    और मैं ही माता हूँ।

    मैं ही पत्नी हूँ;

    मैं ही कुँवारी हूँ।

    मैं ही गर्भवती हूँ;

    मैं ही दाई हूँ।

    मैं ही प्रसव-पीड़ा को कम करती हूँ।

    मेरे पति ने ही मुझे जन्म दिया,

    और मैं ही उसकी माता हूँ,

    और वही मेरा पिता और मेरा प्रभु है।

    वही मेरा बल है।

    वह जो कुछ चाहता है, उसे तर्कसंगत ढंग से कहता है।[a]

    मैं अस्तित्व में आने की राह पर हूँ,

    यद्यपि मैं पहले ही एक पुरुष को प्रभु के रूप में जन्म दे चुकी हूँ।[b]


    अब ये बातें सबाओत और उसके मसीह की इच्छा से उन आत्माओं पर प्रकट की गईं जिन्हें सत्ताधारियों के गढ़े हुए रूपों में प्रवेश करना था। उनके विषय में पवित्र वाणी ने कहा, “बहुगुणित होओ और फलो-फूलो; सभी सृजित प्राणियों पर शासन करो।” वे ही थीं जिन्हें उनकी नियति के अनुसार आदि-जनक ने बंदी बना लिया; और इस प्रकार वे गढ़े हुए रूपों की कारागारों में <…> युग की पूर्णता तक बंद कर दी गईं।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तर्कसंगत ढंग से” का आधार उपलब्ध अंग्रेज़ी साक्ष्य का “with reason” है; इसका आशय ‘विवेकपूर्वक’ या ‘कारण सहित’ भी हो सकता है। कॉप्टिक स्रोत की सीधी समीक्षा अभी अपेक्षित है।
    reason: उपलब्ध मध्यस्थ साक्ष्य में अर्थगत अस्पष्टता है।
  - marker: b
    text: “एक पुरुष को प्रभु के रूप में” वाक्यांश जानबूझकर असामान्य है; इसका अर्थ ‘एक पुरुष, जो प्रभु है’ भी समझा जा सकता है।
    reason: काव्य-पंक्ति की व्याकरणिक और धर्मवैचारिक अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: <…> पांडुलिपि के क्षतिग्रस्त या लुप्त अंश का संकेत है।
    reason: पाठगत रिक्ति को प्रकाशन में स्पष्ट रूप से सुरक्षित रखना।
lexical_decisions:
- source_word: virgin
  choice: कुँवारी
  rationale: आधुनिक, सहज और गरिमापूर्ण हिन्दी; यहाँ शारीरिक/वैवाहिक अवस्था का विरोधाभासी काव्यात्मक कथन सुरक्षित रहता है।
- source_word: midwife
  choice: दाई
  rationale: सामान्य पाठक के लिए स्पष्ट और स्वाभाविक शब्द, जो प्रसव में सहायता करने वाली स्त्री को ठीक व्यक्त करता है।
- source_word: authorities
  choice: सत्ताधारी
  rationale: इस ब्रह्मांड-विज्ञान में शासनकारी अलौकिक शक्तियों का संकेत देता है; केवल मानवीय ‘अधिकारी’ समझे जाने से बचाता है।
- source_word: shaped forms
  choice: गढ़े हुए रूप
  rationale: रूपों के निर्मित और देह-सदृश पात्र होने की धारणा को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: Primal Parent
  choice: आदि-जनक
  rationale: आदिम अभिभावक/जनक की धारणा को संक्षिप्त रूप में रखता है और लिंग-संबंधी अस्पष्टता को यथासंभव सीमित करता है।
- source_word: consummation of the age
  choice: युग की पूर्णता
  rationale: अंतकालीन अर्थ को बनाए रखता है, पर इसे केवल ‘संसार का अंत’ कहकर संकुचित नहीं करता।
theological_decisions:
- issue: हव्वा के पति, पिता, पुत्र और प्रभु से जुड़े विरोधाभासी संबंध
  choice: संबंधों को मूल कथन के अनुसार ज्यों का त्यों रखा गया
  alternative: इन संबंधों को प्रतीकात्मक पात्रों की पहचान बताकर स्पष्ट करना
  rationale: पाठ जानबूझकर रहस्यात्मक और विरोधाभासी है; व्याख्यात्मक पहचान जोड़ना किसी विशेष मत को आरोपित करता।
- issue: Sabaoth and his Christ
  choice: “सबाओत और उसके मसीह”
  alternative: “सबाओत और मसीह” अथवा “सबाओत और उसका अभिषिक्त”
  rationale: संबंधवाचक सर्वनाम स्रोत-साक्ष्य में मौजूद धार्मिक संबंध को सुरक्षित रखता है; ‘मसीह’ हिन्दी धार्मिक प्रयोग में परिचित है।
- issue: souls entering the authorities’ shaped forms
  choice: आत्माओं का सत्ताधारियों के गढ़े हुए रूपों में प्रवेश
  alternative: मानवीय शरीरों में प्रवेश की स्पष्ट व्याख्या
  rationale: पाठ स्वयं ‘रूप’ कहता है; उन्हें सीधे मानव शरीर कहना वास्तविक अस्पष्टता को अनावश्यक रूप से हल कर देता।
- issue: captivity according to destinies
  choice: “उनकी नियति के अनुसार”
  alternative: “भाग्य के विधान से”
  rationale: बहुवचन और नियत हिस्सों/नियति की संभावित धारणा सुरक्षित रखी गई है, बिना कठोर नियतिवादी सिद्धांत आरोपित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। काव्यांश की पुनरावृत्ति और विरोधाभासी आत्म-परिचय संरक्षित हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-संगत अनुवाद है; कॉप्टिक पांडुलिपि-साक्ष्य की प्रत्यक्ष समीक्षा लंबित है।
