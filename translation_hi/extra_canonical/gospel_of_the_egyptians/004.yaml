translation:
  language: hi
  text: 'उन्होंने [एक] सामर्थ्य के लिए विनती की। जीवित मौन से एक मौन प्रकट हुआ—अर्थात युगों में [महिमाएँ] और अविनाशिताएँ, [… युग], [… में] जोड़े गए असंख्य समूह, तीन पुरुष, [वे तीन] पुरुष संतानें। [पुरुष] वंशों ने [समस्त परिपूर्णता] की वाणी के सामर्थ्य से महान दोक्सोमेदोन [युग को] भर दिया।


    तब महान मसीह के त्रि-पुरुष [बालक] ने—जिसका अभिषेक [महान] अदृश्य आत्मा ने किया था और जिसका सामर्थ्य [आइनोन कहलाता था]—महान अदृश्य आत्मा, [उसकी] पुरुष-कुमारी योएल, मौन के मौन की निस्तब्धता, और महानता […] के सामने [स्तुति] अर्पित की।


    [कोडेक्स III के पृष्ठ 45–48 लुप्त हैं; इनके अनुरूप अंश कोडेक्स IV के पृष्ठ 55–60 पर है।][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोडेक्स III के पृष्ठ 45–48 लुप्त हैं; इस अंतराल के अनुरूप पाठ कोडेक्स IV के पृष्ठ 55–60 पर मिलता है। प्रस्तुत मसौदा सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: पांडुलिपि-अंतराल और मसौदे के सीमित स्रोताधार को स्पष्ट करना।
lexical_decisions:
- source_word: power
  choice: सामर्थ्य
  rationale: यहाँ सत्ता, आध्यात्मिक शक्ति या प्रभाव—इनमें से अर्थ निश्चित नहीं है; ‘सामर्थ्य’ इस व्यापकता को बनाए रखता है।
- source_word: Silence / silence
  choice: मौन / निस्तब्धता
  rationale: व्यक्तिवाचक या तकनीकी ‘Silence’ के लिए ‘मौन’ रखा गया; जटिल वाक्यांश में अलग स्तर को पठनीय बनाने के लिए ‘निस्तब्धता’ प्रयुक्त है, बिना उसकी रहस्यमय पुनरुक्ति मिटाए।
- source_word: aeons
  choice: युग
  rationale: ज्ञानवादी संदर्भ में यह कालखंड और दिव्य सत्ता/लोक दोनों का संकेत दे सकता है; ‘युग’ परिचित है, पर मूल की अस्पष्टता पूरी तरह समाप्त नहीं करता।
- source_word: indestructibilities
  choice: अविनाशिताएँ
  rationale: असामान्य अमूर्त बहुवचन को सामान्य बनाकर मिटाने के बजाय स्रोत की पारिभाषिक विचित्रता सुरक्षित रखी गई।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: संभावित तकनीकी अर्थ वाले ‘Pleroma’ की धारणा को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: triple-male
  choice: त्रि-पुरुष
  rationale: दुर्लभ तकनीकी विशेषण को व्याख्यात्मक रूप से हल किए बिना संक्षिप्त और औपचारिक रूप में रखा गया।
- source_word: male virgin
  choice: पुरुष-कुमारी
  rationale: जानबूझकर विरोधाभासी उपाधि को धर्मवैचारिक रूप से सामान्य नहीं किया गया।
- source_word: Doxomedon / Ainon / Yoel
  choice: दोक्सोमेदोन / आइनोन / योएल
  rationale: अज्ञात या पारिभाषिक नामों का अर्थानुवाद करने के बजाय देवनागरी लिप्यंतरण किया गया।
theological_decisions:
- issue: ‘living Silence’ और ‘Silence of silent Silence’ का स्वरूप
  choice: व्यक्तित्वयुक्त/पारिभाषिक भाषा को ‘जीवित मौन’ और ‘मौन के मौन की निस्तब्धता’ के रूप में बनाए रखा
