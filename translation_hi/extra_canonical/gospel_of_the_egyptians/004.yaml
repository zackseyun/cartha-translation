  rationale: खंडित साक्ष्य इन पदों की सटीक सत्ता-संबंधी भूमिका निर्धारित नहीं करता।
- issue: ‘aeon’ का अर्थ
  choice: ‘युग’
  alternative: ‘दैवी लोक’, ‘सनातन सत्ता’ या केवल लिप्यंतरण ‘एओन’
  rationale: स्रोत में काल, क्षेत्र और व्यक्तित्वयुक्त सत्ता के अर्थों का तनाव संभव है; चुना हुआ पद अपेक्षाकृत खुला रहता है।
- issue: ‘male virgin’ की विरोधाभासी उपाधि
  choice: ‘पुरुष-कुमारी’
  alternative: ‘कुँवारा पुरुष’, ‘पौरुषमयी कुमारी’ या धर्मवैचारिक व्याख्या
  rationale: मूल उपाधि के लिंग-संबंधी विरोधाभास और रहस्यवादी तनाव को सुरक्षित रखना आवश्यक है।
- issue: महान मसीह और त्रि-पुरुष बालक का संबंध
  choice: ‘महान मसीह के त्रि-पुरुष बालक’
  alternative: बालक को स्वयं महान मसीह के समान मानना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य संबंधसूचक रचना देता है; पहचान को उससे आगे निश्चित नहीं किया गया।
