translation:
  language: hi
  text: '[] महान अदृश्य [आत्मा] की [पवित्र] पुस्तक,


    उस पिता की, जिसका नाम बोला नहीं जा सकता,

    जो [परिपूर्णता की] ऊँचाइयों से उत्पन्न हुआ],

    प्रकाश के युगों से निकला प्रकाश का प्रकाश,

    दूरदर्शिता के [मौन का] प्रकाश

    और मौन का पिता,

    वचन और सत्य का [प्रकाश],

    [] [अविनाशी तत्त्वों] का प्रकाश,

    अनन्त प्रकाश,

    उस अगोचर, अचिह्नित,

    अजर, अकथनीय पिता के

    प्रकाश-युगों से निकली [वह] दीप्ति,

    युगों का युग,[a]

    स्वयं उत्पन्न, स्वयं को उत्पन्न करने वाला, स्वयं को अस्तित्व में लाने वाला,

    पराया,

    वह युग,

    सत्य, अलेथोस।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “युग” उस प्राचीन पारिभाषिक शब्द का अनुवाद है जिसका अर्थ कालखंड, दिव्य लोक या व्यक्तिवाची सनातन सत्ता भी हो सकता है।
    reason: स्रोत-पद की वास्तविक अर्थगत और धर्मवैज्ञानिक अस्पष्टता स्पष्ट करने के लिए।
  - marker: b
    text: “अलेथोस” यूनानी रूप का लिप्यंतरण है; यहाँ यह नाम, उद्घोष या “सत्य/सचमुच” से जुड़ा शब्द हो सकता है।
    reason: रहस्यमय पद को अनावश्यक रूप से एक ही अर्थ में निश्चित करने से बचने के लिए।
lexical_decisions:
- source_word: sacred
  choice: पवित्र
  rationale: धार्मिक गरिमा बनाए रखने वाला स्वाभाविक आधुनिक हिन्दी पद; पाठ में पुनर्स्थापन-संकेत के कारण कोष्ठक सुरक्षित रखा गया है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: इस ज्ञानवादी पारिभाषिक धारणा का अर्थ बिना किसी संप्रदायगत व्याख्या के निकटता से व्यक्त करता है।
- source_word: aeon
  choice: युग
  rationale: कालखंड और दिव्य सत्ता—दोनों संभावित अर्थों की अस्पष्टता कुछ हद तक बनाए रखता है; पहली उपस्थिति पर पादटिप्पणी दी गई है।
- source_word: Providence
  choice: दूरदर्शिता
  rationale: दैवी पूर्व-व्यवस्था का अर्थ आरोपित किए बिना विचारपूर्वक देखभाल या पूर्वचिन्तन का व्यापक भाव रखता है।
- source_word: Speech
  choice: वचन
  rationale: साधारण 'वाणी' की अपेक्षा इस ब्रह्माण्डीय, व्यक्तिवाची संदर्भ की गरिमा और संभावित पारिभाषिक अर्थ को बेहतर रखता है।
- source_word: indestructibilities
  choice: अविनाशी तत्त्वों
  rationale: अमूर्त बहुवचन को हिन्दी में बोधगम्य बनाते हुए उन अविनाशी वास्तविकताओं या सत्ताओं का संकेत सुरक्षित रखता है।
- source_word: alien
  choice: पराया
  rationale: मूल की चौंकाने वाली पृथकता को 'अलौकिक' या 'अपरिचित' कहकर व्याख्यायित करने के बजाय खुला रखता है।
- source_word: ALĒTHŌS
  choice: अलेथोस
  rationale: रहस्यमय नाम या ध्वन्यात्मक पद के रूप में लिप्यंतरण किया गया है; इसे केवल 'सचमुच' मानकर अर्थ निश्चित नहीं किया गया।
theological_decisions:
- issue: पिता के उत्पन्न होने का कथन
  choice: जो ... उत्पन्न हुआ
  alternative: जिसने ... उत्पन्न किया
  rationale: उपलब्ध साक्षी का व्याकरण पिता को उत्पन्न हुआ बताता है; धर्मवैज्ञानिक कठिनाई को सुधारकर हटाया नहीं गया।
- issue: aeon की प्रकृति
  choice: युग
  alternative: दैवी लोक / सनातन सत्ता
  rationale: पाठ में यह काल, लोक या व्यक्तिवाची सत्ता हो सकता है; हिन्दी में अपेक्षाकृत खुला पद चुना गया और पादटिप्पणी में अस्पष्टता बताई गई।
- issue: alien का अभिप्राय
  choice: पराया
  alternative: परात्पर
  rationale: इसे स्वतः ईश्वर की श्रेष्ठ पारलौकिकता में बदलना पाठ से अधिक निश्चित व्याख्या होती; मूल की दूरी और अपरिचय को सुरक्षित रखा गया।
- issue: TRUTH और ALĒTHŌS का संबंध
  choice: सत्य, अलेथोस
  alternative: सत्य, सचमुच
  rationale: दोनों को समानार्थी सामान्य शब्द मानने के बजाय बड़े अक्षरों में दिए गए विशिष्ट पदों की क्रमिकता और संभावित नामात्मक प्रयोग बनाए रखे गए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी अपनाई गई है। खंडित आरम्भ, वर्ग-कोष्ठक और लोप-चिह्न उपलब्ध अंग्रेज़ी साक्षी में पांडुलिपि-क्षति तथा संपादकीय पुनर्स्थापन को दर्शाते हैं, इसलिए उन्हें यथासंभव सुरक्षित रखा गया है। यह मसौदा सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी अनुवाद है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है।
