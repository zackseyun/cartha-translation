translation:
  language: hi
  text: 'तब सब कुछ काँप उठा, और अविनाशी जन भी थरथराने लगे। फिर वे तीन पुत्र ऊपर से उन अजन्मे और स्वयं-उत्पन्न जनों के पास, और उन जनों के पास उतरे जो उत्पन्न वस्तु में उत्पन्न हुए थे। तब महानता प्रकट हुई—महान मसीह की संपूर्ण महानता।


    उसने उनके चारों ओर के चार युगों[a] के भीतर महिमामय सिंहासनों की असंख्य लाखों कतारें स्थापित कीं, और शक्तियों, महिमाओं [] तथा अविनाशी सत्ताओं की भी असंख्य लाखों कतारें स्थापित कीं। वे इसी प्रकार आगे बढ़े। और महान, जीवित, स्वयं-उत्पन्न जन—सत्य के परमेश्वर—के चार प्रकाशों के भीतर अविनाशी आत्मिक सभा बढ़ती गई। वह सभा एक स्वर और एकमत होकर, कभी न रुकनेवाले मुख से स्तुति, गान और गुणगान करती थी:


    पिता का,


    और माता का,


    और पुत्र का,


    और उनकी संपूर्ण परिपूर्णता[b] का, जैसा मैंने पहले कहा था।


    असंख्य जनों को धारण करनेवाली पाँच मुहरों को,


    युगों पर अधिकार रखनेवाले शासकों को,


    और अगुओं की महिमा उठानेवालों को


    आज्ञा दी गई कि वे योग्य जनों के सामने प्रकट हों।


    आमीन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “युग” उन विशाल कालखंडों के साथ-साथ दिव्य लोकों या सत्तात्मक क्षेत्रों का भी संकेत दे सकता है, जिन्हें प्रायः यूनानी शब्द ‘ऐओन’ से व्यक्त किया जाता है।
    reason: शब्द का ब्रह्मांड-विज्ञान संबंधी विशेष अर्थ साधारण हिन्दी ‘युग’ से पूरी तरह स्पष्ट नहीं होता।
  - marker: b
    text: “परिपूर्णता” संभवतः समस्त दिव्य पूर्णता या दिव्य सत्ताओं की पूर्ण समष्टि के लिए प्रयुक्त विशिष्ट पद है।
    reason: मूल अवधारणा का तकनीकी धार्मिक अर्थ हो सकता है; उसे केवल सामान्य ‘पूर्णता’ समझना सीमित होगा।
lexical_decisions:
- source_word: indestructible ones / indestructibilities
  choice: अविनाशी जन / अविनाशी सत्ताएँ
  rationale: व्यक्तिवाचक और अमूर्त/सत्तात्मक प्रयोगों का भेद बनाए रखते हुए मूल की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: self-begotten / self-generated
  choice: स्वयं-उत्पन्न
  rationale: रहस्यमय उत्पत्ति-संबंधी पद को व्याख्यात्मक सिद्धांत में बदले बिना सहज हिन्दी में रखा गया है।
- source_word: Greatness
  choice: महानता
  rationale: मूल के व्यक्तिवाची अमूर्त पद और उसके बलाघात को बनाए रखा गया है।
- source_word: aeons
  choice: युग
  rationale: सामान्य पाठक के लिए बोधगम्य निकटतम शब्द चुना गया; यहाँ यह विशिष्ट दिव्य लोकों या व्यवस्थाओं का संकेत दे सकता है, इसलिए पादटिप्पणी जोड़ी गई है।
- source_word: church
  choice: सभा
  rationale: प्राचीन आध्यात्मिक समुदाय के अर्थ को आधुनिक संस्थागत ‘कलीसिया’ तक सीमित किए बिना व्यक्त करता है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: विशिष्ट ब्रह्मांड-विज्ञान संबंधी अर्थ की संभावना रखते हुए शब्द का अमूर्त और संभवतः व्यक्तिवाची स्वरूप बचाया गया है।
- source_word: archons
  choice: अधिकार रखनेवाले शासक
  rationale: विशिष्ट पारलौकिक शासक-सत्ताओं का कार्यात्मक अर्थ स्पष्ट किया गया है, बिना उन्हें किसी बाद की दानव-श्रेणी से समान ठहराए।
- source_word: seals
  choice: मुहरें
  rationale: दीक्षा, संरक्षण या अधिकार जैसे संभावित अर्थों में से किसी एक को निर्णायक बनाए बिना मूल प्रतीक रखा गया है।
theological_decisions:
- issue: पिता, माता और पुत्र की त्रयी
  choice: तीनों पदों को समानांतर और प्रत्यक्ष रूप में रखा गया
  alternative: ‘माता’ को रूपक या किसी अन्य सत्ता की व्याख्या के रूप में प्रस्तुत करना
  rationale: पाठ स्वयं पिता, माता और पुत्र कहता है; अनुवाद में इस धार्मिक तनाव को किसी संप्रदायगत ढाँचे से हल नहीं किया गया।
- issue: ‘स्वयं-उत्पन्न’ जन की पहचान
  choice: ‘महान, जीवित, स्वयं-उत्पन्न जन—सत्य के परमेश्वर’
  alternative: इसे मसीह या किसी विशिष्ट नामित सत्ता से स्पष्टतः समान ठहराना
  rationale: वाक्य की उपाधियों को सुरक्षित रखा गया और अस्पष्ट पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: स्तुति करनेवाले का व्याकरणिक संदर्भ
  choice: ‘वह सभा ... स्तुति ... करती थी’
  alternative: ‘सत्य का परमेश्वर ... स्तुति करता था’
  rationale: अंग्रेज़ी साक्ष्य में संबंधवाचक वाक्य अस्पष्ट है; निकटवर्ती ‘सभा’ और सामूहिक ‘एक स्वर’ के आधार पर सभा को कर्ता माना गया, पर यह स्रोत-भाषा समीक्षा के बाद पुनर्विचार योग्य है।
- issue: पाँच मुहरों का व्यक्तिकरण
  choice: उन्हें आज्ञा पाने और प्रकट होनेवाली सत्ताओं के रूप में व्याकरणतः बनाए रखा
  alternative: मुहरों को केवल संस्कार या चिह्न मानकर वाक्य का पुनर्गठन
  rationale: पाठ की रहस्यमय और व्यक्तिकृत अभिव्यक्ति को यथावत रहने दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। उपलब्ध आधार प्रत्यक्ष कॉप्टिक पाठ नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए मसौदा अस्थायी है और कॉप्टिक स्रोत-भाषा समीक्षा अपेक्षित है। पांडुलिपि के रिक्त/क्षतिग्रस्त अंश को मूल साक्ष्य के अनुसार [] से सुरक्षित रखा गया है। ‘असंख्य लाखों कतारें’ मूल के अतिशयोक्तिपूर्ण बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है।
