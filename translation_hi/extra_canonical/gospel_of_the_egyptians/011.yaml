  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: hi
  text: 'उसने पिता की इच्छा और प्रसन्नता से अपनी पूर्णता और अपनी सामर्थ्य प्राप्त की। इसी प्रसन्नता के द्वारा वह महान सेत के महान और सामर्थी मनुष्यों के उस महान, अविनाशी और अचल वंश से प्रसन्न हुआ, ताकि वह उसे उत्पन्न किए गए आयोनों[a] के भीतर बो सके और उसके द्वारा जो कमी थी, वह पूरी हो जाए। क्योंकि वह रात की प्रतिमा होकर ऊपर से नीचे संसार में उतरी थी। जब वह प्रकट हुई, तब उसने इस आयोन के अधिपति[b] के वंश और उससे उत्पन्न हुए <अधिकारियों> के लिए विनती की—अर्थात नष्ट होने वाले, दुष्टात्माओं को जन्म देने वाले देवता के दूषित (वंश) के लिए—और उसने आदम तथा महान सेत के उस वंश […] के लिए भी विनती की, जो सूर्य के समान है।


    तब महान स्वर्गदूत होर्मोस आया, ताकि इस आयोन की दूषित बुआई की कुमारियों के द्वारा, उस पवित्र पात्र के भीतर महान सेत के वंश को तैयार करे, जिसे पवित्र आत्मा के द्वारा वचन[c] ने उत्पन्न किया था।


    तब महान सेत अपने वंश के साथ आया, और वह उत्पन्न किए गए आयोनों के भीतर बोया गया। उनकी संख्या “सदोम” के संख्यात्मक मान[d] के अनुरूप थी। कुछ लोग कहते हैं कि सदोम वह स्थान है जहाँ महान सेत चराता है, अर्थात गमोरा। पर दूसरे कहते हैं कि महान सेत ने अपना लगाया हुआ पौधा गमोरा से निकालकर दूसरी जगह रोपा और उसका नाम सदोम रखा।


    यही वह वंश है जो एदोक्ला के द्वारा प्रकट हुआ, क्योंकि उसने बोलकर सत्य और धार्मिकता को जन्म दिया। वह अनन्त जीवन के वंश का आरम्भ है—उस जीवन का जो उन लोगों के लिए है जो अपने निर्गमन[e] के ज्ञान के कारण अन्त तक दृढ़ रहेंगे। यही वह महान, अविनाशी वंश है जो तीन […] लोकों से होकर संसार में आया है। जलप्रलय आयोन की पूर्ण समाप्ति[f] के प्रतिरूप के रूप में घटित हुआ, पर इस वंश के कारण उसे संसार में भेजा जाएगा।


    एक महाअग्नि पृथ्वी को आ घेरेगी, और अनुग्रह उस वंश के लोगों के लिए होगा जो भविष्यद्वक्ताओं और उन पहरेदारों के द्वारा (अस्तित्व में आया), जो उस वंश के जीवन की रखवाली करते हैं। इस वंश के कारण अकाल और महामारियाँ आएँगी; ये बातें महान, अविनाशी वंश के कारण ही घटित होंगी। इसी वंश के कारण परीक्षाएँ आएँगी, यहाँ तक कि झूठे भविष्यद्वक्ताओं का छल भी।


    तब महान सेत ने शैतान के काम को देखा—उसके अनेक भेष, अविनाशी और अचल वंश के विरुद्ध उसके षड्यंत्र, उसकी शक्तियों और उसके स्वर्गदूतों के द्वारा किए गए उत्पीड़न, और उनकी वह भूल (जिसके कारण) उन्होंने अपने ही विरुद्ध काम किया।


    तब महान सेत ने स्तुति अर्पित की:


    महान, अनाम, कुँवारी आत्मा को,


    और पुरुष […] कुँवारी बारबेलोन को,


    और त्रि-पुरुष बालक तेलमाएल तेलमाएल हेली हेली माखार माखार सेत को,


    और जीवित सामर्थ्य, अलेथेस अलेथोस को,


    और पुरुष-कुँवारी यूएल को,


    और वैभव के रक्षक, उसकी महिमा के मुकुट एसेफेक को,


    और महान डोक्सोमेदोन आयोन को,


    और उसके भीतर के सिंहासनों को,


    और उन्हें चारों ओर से घेरे हुई शक्तियों को,


    और समूची परिपूर्णता[g] को, जैसा मैं पहले कह चुका हूँ।


    और उसने अपने वंश के लिए पहरेदारों की विनती की।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आयोन’ इस ग्रंथ में काल-युग, दिव्य लोक या उनसे जुड़ी सत्ता का संकेत दे सकता है।
    reason: तकनीकी और अर्थतः बहुस्तरीय पद को स्पष्ट करना।
  - marker: b
    text: ‘अधिपति’ उस तकनीकी पद का अनुवाद है जिसे प्रायः ‘आर्कोन’ कहा जाता है—इस संसार या आयोन से जुड़ी एक शासक सत्ता।
    reason: ग्रंथ की विशिष्ट ब्रह्मांडीय पदावली बताना।
  - marker: c
    text: यहाँ ‘वचन’ व्यक्तिवाचक दैवी पद ‘लोगोस’ के लिए है।
    reason: सामान्य बोले गए शब्द और दैवी पद में भेद स्पष्ट करना।
  - marker: d
    text: अक्षरों को संख्यात्मक मान देने की प्राचीन पद्धति की ओर संकेत है; उपलब्ध पाठ इस गणना को नहीं समझाता।
    reason: आधुनिक पाठक के लिए दुर्बोध सांस्कृतिक संकेत समझाना।
  - marker: e
    text: ‘निर्गमन’ से आशय किसी मूल दैवी स्रोत से निकलकर प्रकट होने से हो सकता है।
    reason: तकनीकी उत्पत्ति-संबंधी धारणा की संभावित सीमा बताना।
  - marker: f
    text: ‘पूर्ण समाप्ति’ आयोन के अंत या परिपूर्ण निष्पत्ति—दोनों का संकेत दे सकती है।
    reason: consummation की वास्तविक अर्थगत अस्पष्टता बनाए रखना।
  - marker: g
    text: ‘परिपूर्णता’ यहाँ समस्त दैवी पूर्णता या दैवी लोक-व्यवस्था के लिए प्रयुक्त तकनीकी पद है, जिसे ‘प्लेरोमा’ भी कहा जाता है।
    reason: सामान्य गुण और तकनीकी ब्रह्मांडीय पद में भेद करना।
lexical_decisions:
- source_word: aeon
  choice: आयोन
  rationale: यह इस ग्रंथ का विशिष्ट ब्रह्मांड-विज्ञान संबंधी तकनीकी शब्द है; केवल ‘युग’ कहने से स्थान, सत्ता और काल—इनमें निहित अस्पष्टता घट जाती।
- source_word: race / seed
  choice: वंश
  rationale: संदर्भ में सामुदायिक वंश और बोए जाने वाले बीज, दोनों अर्थ परस्पर जुड़े हैं। जहाँ वास्तविक बुआई की छवि प्रमुख है वहाँ भी ‘वंश’ रखा गया ताकि अनुच्छेद की शब्दगत कड़ी बनी रहे।
- source_word: archon
  choice: अधिपति
  rationale: शासकीय सत्ता का अर्थ व्यक्त करता है और पाठ की विशिष्ट दैवी-सत्तात्मक व्यवस्था को किसी आधुनिक पदनाम में सीमित नहीं करता।
- source_word: Logos
  choice: वचन
  rationale: व्यक्तिवाचक दैवी पद के रूप में हिन्दी बाइबलीय परंपरा में समझने योग्य है; इसे छोटे अक्षर के सामान्य ‘शब्द’ के अर्थ में समतल नहीं किया गया।
- source_word: emanation
  choice: निर्गमन
  rationale: किसी स्रोत से निकलकर प्रकट होने की धारणा को दर्शाता है; ‘सृष्टि’ नहीं चुना गया क्योंकि वह स्रोत की विशिष्ट उत्पत्ति-कल्पना को बदल देता।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: मूल तकनीकी धारणा का अर्थ-सन्निकट और पठनीय रूप; इसे सामान्य पूर्णता समझे जाने से बचाने के लिए पादटिप्पणी दी गई।
- source_word: watchers
  choice: पहरेदार
  rationale: वंश के जीवन की निगरानी और रक्षा करने वाली सत्ताओं का सक्रिय अर्थ बनाए रखता है।
theological_decisions:
- issue: पिता की ‘प्रसन्नता’ का कर्ता और माध्यम
  choice: ‘इसी प्रसन्नता के द्वारा वह ... प्रसन्न हुआ’
  alternative: वाक्य को सरल करके केवल ‘पिता उस वंश से प्रसन्न था’ कहना
  rationale: साक्ष्य में pleasure की पुनरावृत्ति और माध्यमात्मक संबंध है; शैलीगत कठिनाई के बावजूद उस धार्मिक-विचारात्मक तनाव को रखा गया।
- issue: दूषित वंश के लिए विनती
  choice: विनती को अधिपति, अधिकारियों और दूषित वंश से स्पष्ट रूप से जोड़ा
  alternative: विनती को केवल आदम और सेत के वंश तक सीमित करना
  rationale: साक्ष्य का व्याकरण आश्चर्यजनक रूप से दोनों समूहों को विनती का विषय बनाता है; इसे सिद्धांतगत कारण से नहीं बदला गया।
- issue: जलप्रलय और भावी भेजे जाने वाली वस्तु का संदर्भ
  choice: ‘उसे’ रखकर संदर्भ की अस्पष्टता बनाए रखी
  alternative: स्पष्ट रूप से ‘जलप्रलय’ या ‘पूर्ण समाप्ति’ कहना
  rationale: उपलब्ध साक्ष्य में सर्वनाम का आशय अनिश्चित है; अनुवाद ने किसी एक व्याख्या को निर्णायक नहीं बनाया।
- issue: पुरुष-कुँवारी पद
