  revised_text: 'उसने पिता की इच्छा और प्रसन्नता से अपनी पूर्णता और अपनी सामर्थ्य प्राप्त की। इसी प्रसन्नता के द्वारा वह महान सेत के महान और सामर्थी मनुष्यों के उस महान, अविनाशी और अचल वंश से प्रसन्न हुआ, ताकि वह उसे उत्पन्न किए गए आयोनों[a] के भीतर बो सके और उसके द्वारा जो कमी थी, वह पूरी हो जाए। क्योंकि वह रात की प्रतिमा होकर ऊपर से नीचे संसार में उतरी थी। जब वह प्रकट हुई, तब उसने इस आयोन के अधिपति[b] के बीज और उससे उत्पन्न हुए <अधिकारियों> के लिए विनती की—अर्थात नष्ट होने वाले, दुष्टात्माओं को जन्म देने वाले देवता के दूषित (बीज) के लिए—और उसने आदम तथा महान सेत के उस बीज […] के लिए भी विनती की, जो सूर्य के समान है।



    तब महान स्वर्गदूत होर्मोस आया, ताकि इस आयोन की दूषित बुआई की कुमारियों के द्वारा, उस पवित्र पात्र के भीतर महान सेत के बीज को तैयार करे, जिसे पवित्र आत्मा के द्वारा वचन[c] ने उत्पन्न किया था।



    तब महान सेत अपने बीज के साथ आया, और वह उत्पन्न किए गए आयोनों के भीतर बोया गया। उनकी संख्या “सदोम” के संख्यात्मक मान[d] के अनुरूप थी। कुछ लोग कहते हैं कि सदोम वह स्थान है जहाँ महान सेत चरता है, अर्थात गमोरा। पर दूसरे कहते हैं कि महान सेत ने अपना लगाया हुआ पौधा गमोरा से निकालकर दूसरी जगह रोपा और उसका नाम सदोम रखा।



    यही वह वंश है जो एदोक्ला के द्वारा प्रकट हुआ, क्योंकि उसने बोलकर सत्य और न्याय को जन्म दिया। वह अनन्त जीवन के बीज का आरम्भ है—उस जीवन का जो उन लोगों के लिए है जो अपने उद्भव[e] के ज्ञान के कारण अन्त तक दृढ़ रहेंगे। यही वह महान, अविनाशी वंश है जो तीन […] लोकों से होकर संसार में आया है। जलप्रलय आयोन की पूर्ण समाप्ति[f] के प्रतिरूप के रूप में घटित हुआ, पर इस वंश के कारण उसे संसार में भेजा जाएगा।



    एक प्रचंड आग पृथ्वी को आ घेरेगी, और अनुग्रह उस वंश के लोगों के लिए होगा जो भविष्यद्वक्ताओं और उन पहरेदारों के द्वारा (अस्तित्व में आया), जो उस वंश के जीवन की रखवाली करते हैं। इस वंश के कारण अकाल और महामारियाँ आएँगी; ये बातें महान, अविनाशी वंश के कारण ही घटित होंगी। इसी वंश के कारण परीक्षाएँ आएँगी, यहाँ तक कि झूठे भविष्यद्वक्ताओं का छल भी।



