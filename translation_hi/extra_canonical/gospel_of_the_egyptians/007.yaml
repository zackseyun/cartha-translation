translation:
  language: hi
  text: 'उनके सहचर स्वयं-उत्पन्न परमेश्वर के अष्टक को पूरा करने के लिए प्रकट हुए:


    पहली ज्योति हार्मोज़ेल की—अनुग्रह;

    दूसरी ज्योति ओरोयाएल की—प्रत्यक्ष-बोध;

    तीसरी ज्योति दाविथे की—समझ;

    चौथी ज्योति एलेलेथ की—विवेकशीलता।


    यह स्वयं-उत्पन्न परमेश्वर का पहला अष्टक है। पिता ने सिर हिलाकर अपनी स्वीकृति दी, और ज्योतियों की सारी परिपूर्णता प्रसन्न हुई।


    फिर सेवक प्रकट हुए:


    पहला, महान गमलिएल—पहली महान ज्योति हार्मोज़ेल का;

    महान गब्रिएल—दूसरी महान ज्योति ओरोयाएल का;

    महान सामलो[b]—महान ज्योति दाविथे का;

    और महान अब्रासाक्स—[…] [महान ज्योति] एलेलेथ का।[c]


    फिर पिता की प्रसन्न इच्छा के अनुसार उनके सहचर प्रकट हुए:


    पहले महान गमलिएल की—स्मृति;

    दूसरे महान गब्रिएल का—प्रेम;

    तीसरे महान साम्बलो[b] की—शांति;

    चौथे महान अब्रासाक्स का—अनन्त जीवन।


    इस प्रकार पाँचों अष्टक पूरे हुए—कुल चालीस—एक ऐसी सामर्थ्य के रूप में, जिसका वर्णन नहीं किया जा सकता।


    तब महान स्वयं-उत्पन्न लोगोस और चारों ज्योतियों की परिपूर्णता की वाणी ने इनकी स्तुति की:


    महान अदृश्य, अनाम कुँवारे आत्मा की,

    अर्थात नर-कुँवारी की;

    महान डोक्सोमेदोन युग की;

    उनके भीतर के सिंहासनों की;

    उनके चारों ओर की सामर्थ्यों की;

    महिमाओं, प्रभुताओं और सामर्थ्यों की;

    <और> तीन बार नर बालक की;

    नर-कुँवारी यूएल की;

    और एसेफेक की—जो […] वैभव का रक्षक और [बालक] का बालक है—[c]

    और [उसकी] महिमा के मुकुट की;

    सारी परिपूर्णता की;

    वहाँ निवास करने वाली सभी महिमाओं की;

    अनन्त परिपूर्णताओं की;

    और अनाम युगों की;


    ताकि वे अविनाशी वंश के साथ पिता को—जो चौथा है—नाम दें, और पिता के बीज को महान सेत का बीज कहें।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: दिए गए स्रोत की सीमा और पाठ-समीक्षा की वर्तमान स्थिति पारदर्शी बनाना।
  - marker: b
    text: उपलब्ध साक्ष्य में नाम पहले ‘सामलो’ और बाद में ‘साम्बलो’ रूप में मिलता है; दोनों रूप सुरक्षित रखे गए हैं।
    reason: साक्ष्य में उपस्थित नामांतर को चुपचाप एकरूप न करना।
  - marker: c
    text: '[…] पांडुलिपि में रिक्त या अपठनीय अंश को, और [कोष्ठक] संपादकीय पुनःस्थापन को दर्शाते हैं।'
    reason: पांडुलिपीय क्षति और आधुनिक पुनःस्थापन के बीच अंतर स्पष्ट करना।
lexical_decisions:
- source_word: Ogdoad
  choice: अष्टक
  rationale: आठ सदस्यों वाले समूह का अर्थ संक्षेप और स्पष्ट रूप से व्यक्त करता है; अपरिचित यूनानी रूप को अनावश्यक रूप से नहीं थोपता।
- source_word: self-generated
  choice: स्वयं-उत्पन्न
  rationale: पाठ की विशिष्ट ब्रह्माण्ड-विज्ञान संबंधी अभिव्यक्ति को बिना उसकी प्रकृति समझाकर तय किए औपचारिक रूप से सुरक्षित रखता है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: यहाँ साधारण ‘भरपूरी’ के बजाय एक तकनीकी ब्रह्माण्ड-विज्ञान संबंधी समष्टि का संकेत है; ‘परिपूर्णता’ गरिमापूर्ण और अर्थ-संगत है।
- source_word: Perception
  choice: प्रत्यक्ष-बोध
  rationale: इसे ‘समझ’ से अलग रखता है और ग्रहण अथवा अनुभूति की संज्ञानात्मक धारणा व्यक्त करता है।
- source_word: Discretion
  choice: विवेकशीलता
  rationale: निर्णय-विवेक के गुण को व्यक्त करता है, बिना इसे केवल गोपनीयता के आधुनिक अर्थ तक सीमित किए।
- source_word: Logos
  choice: लोगोस
  rationale: अगले पद ‘वाणी’ से इसका औपचारिक भेद बनाए रखने और तकनीकी उपाधि को सुरक्षित रखने के लिए लिप्यंतरण अपनाया गया है।
- source_word: aeon
  choice: युग
  rationale: दिग्दर्शित पाठ में सत्ता और काल-क्षेत्र दोनों का संभावित तनाव है; सहज हिन्दी शब्द चुना गया है, पर इसे केवल सामान्य समयावधि बनाकर नहीं समझाया गया।
- source_word: triple-male child
  choice: तीन बार नर बालक
  rationale: असामान्य उपाधि की विचित्रता को सहज धार्मिक पद में विलीन करने के बजाय यथासंभव औपचारिक रूप से बनाए रखता है।
theological_decisions:
- issue: ‘virginal Spirit’, ‘male virgin’, और ‘triple-male child’ जैसी विरोधाभासी उपाधियाँ
  choice: कुँवारा आत्मा, नर-कुँवारी, और तीन बार नर बालक
  alternative: इन उपाधियों को व्याख्यात्मक रूप से लिंगातीत या प्रतीकात्मक कहना
  rationale: मूल साक्ष्य का धर्मवैचारिक तनाव और असामान्य लिंग-भाषा सुरक्षित रखी गई है; कोई सम्प्रदायगत समाधान नहीं जोड़ा गया।
- issue: पिता को ‘चौथा’ कहना
  choice: पिता को—जो चौथा है—नाम दें
  alternative: चौथे पिता को नाम दें
  rationale: व्याकरणिक संबंध अस्पष्ट है; विराम-चिह्न द्वारा उपलब्ध पाठ का संबंध दिखाया गया है, पर ‘चौथा’ को स्थायी उपाधि बनाकर निर्णीत नहीं किया गया।
- issue: Father's seed और great Seth's seed की पहचान
  choice: पिता के बीज को महान सेत का बीज कहें
  alternative: दोनों को व्याख्यात्मक रूप से एक विशिष्ट समुदाय या वंश सिद्ध करना
  rationale: पाठ में की गई नामकरण-संबंधी पहचान को रखा गया है, लेकिन उसके धर्मवैचारिक आशय को अतिरिक्त रूप से परिभाषित नहीं किया गया।
- issue: God के लिए हिन्दी संबोधन
  choice: परमेश्वर
  alternative: ईश्वर या देवता
  rationale: आधुनिक हिन्दी में गरिमापूर्ण और सामान्यतः सुबोध है; यहाँ इससे किसी विशिष्ट सम्प्रदाय का सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। सूचियों की अनुष्ठानिक लय सुरक्षित रखी गई है। तकनीकी नामों को देवनागरी में लिप्यंतरित किया गया है; ‘अष्टक’, ‘परिपूर्णता’ और ‘लोगोस’ जैसे पदों में स्रोत की विशिष्ट ब्रह्माण्ड-विज्ञान संबंधी भाषा को अत्यधिक सरल नहीं किया गया। कोणीय और वर्ग कोष्ठकों के पाठ-समीक्षात्मक संकेत यथावत रखे गए हैं।
