translation:
  language: hi
  text: 'महान लोगोस, स्वयं-उत्पन्न परमेश्वर, और अविनाशी मनुष्य अदामास ने स्तुति अर्पित की। उन्होंने स्वयं-उत्पन्न के लिए सामर्थ्य और सनातन शक्ति की याचना की, ताकि चार युगों[a] की पूर्णता हो और उनके द्वारा [] […] महान ज्योति के उन पवित्र मनुष्यों के अदृश्य पिता की महिमा और सामर्थ्य प्रकट हों, जो संसार में—रात की प्रतिमा में—प्रवेश करेंगे।[b]


    अविनाशी मनुष्य अदामास ने उनसे याचना की कि उससे एक पुत्र उत्पन्न हो, ताकि वह अचल, अविनाशी वंश का पिता बने; ताकि उस वंश के द्वारा मौन और वाणी प्रकट हों, और उसी के द्वारा मृत युग अपने आपको उठाए, जिससे वह विलीन हो जाए। और इस प्रकार ऊपर से महान ज्योति की शक्ति, अर्थात् प्रकटीकरण, निकली। उसने चार महान ज्योतियों को जन्म दिया:


    हारमोज़ेल,


    ओरोइएल,


    दाविथे,


    एलेलेथ,


    और महान अविनाशी सेत को, जो अविनाशी मनुष्य अदामास का पुत्र है। इस प्रकार गुप्त रहस्यों में विद्यमान पूर्ण सप्तक[c] पूरा हुआ। [] जब वह [महिमा] [प्राप्त करती है], तब वह ग्यारह अष्टक[d] बन जाती है; और पिता ने सिर हिलाकर अपनी स्वीकृति दी। ज्योतियों की समूची परिपूर्णता[e] आनन्दित हुई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “युगों” के पीछे का पारिभाषिक शब्द ऐसी दिव्य सत्ता, क्षेत्र अथवा लोक को भी सूचित कर सकता है जिसे प्रायः “ऐयोन” कहा जाता है।
    reason: aeon की वास्तविक अर्थ-व्याप्ति और ब्रह्मांडीय तकनीकी प्रयोग को सुरक्षित रखना।
  - marker: b
    text: इस वाक्य में पांडुलिपि का पाठ क्षतिग्रस्त है; “रात की प्रतिमा” का ठीक-ठीक संबंध अनिश्चित है। [] और […] लुप्त अथवा अपठनीय पाठ के संकेत हैं।
    reason: पांडुलिपि-क्षति और वाक्यगत अस्पष्टता को स्पष्ट करना।
  - marker: c
    text: “सप्तक” का अर्थ सात का पूर्ण समूह है।
    reason: तकनीकी गणनात्मक पद Hebdomad को सामान्य पाठक के लिए स्पष्ट करना।
  - marker: d
    text: “अष्टक” का अर्थ आठ का समूह है। इस स्थान पर पाठ क्षतिग्रस्त और आंशिक रूप से पुनर्स्थापित है; ग्यारह अष्टकों का आशय स्पष्ट नहीं है।
    reason: Ogdoads तथा पुनर्स्थापित पाठ की अनिश्चितता बताना।
  - marker: e
    text: “परिपूर्णता” यहाँ समस्त दिव्य ज्योतियों के पूर्ण समुदाय के लिए एक पारिभाषिक पद हो सकता है।
    reason: Fullness के संभावित तकनीकी अर्थ को बिना सिद्धांतगत विस्तार के इंगित करना।
lexical_decisions:
- source_word: Logos
  choice: लोगोस
  rationale: यहाँ पारिभाषिक ब्रह्मांड-विज्ञान संबंधी उपाधि है; ‘वचन’ करने से यूहन्नाई अर्थ अनावश्यक रूप से आरोपित हो सकता है, इसलिए लिप्यंतरण रखा गया।
- source_word: self-generated
  choice: स्वयं-उत्पन्न
  rationale: किसी बाहरी जनक के बिना स्वयं से उत्पन्न होने के मूल भाव को संक्षेप और औपचारिकता से सुरक्षित रखता है।
- source_word: aeon
  choice: युग
  rationale: सामान्य हिंदी में बोधगम्य निकटतम पद; यहाँ विशिष्ट दिव्य/ब्रह्मांडीय सत्ता या लोक का अर्थ भी संभव है, जिसे पादटिप्पणी में खुला रखा गया है।
- source_word: Manifestation
  choice: प्रकटीकरण
  rationale: स्त्रीलिंग सत्ता के नाम/उपाधि के रूप में अर्थ को बनाए रखते हुए अनावश्यक व्याख्या से बचता है।
- source_word: Hebdomad
  choice: सप्तक
  rationale: सात के पूर्ण समूह की तकनीकी संज्ञा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: Ogdoads
  choice: अष्टक
  rationale: आठ-आठ के समूहों की तकनीकी गणनात्मक संज्ञा को सुरक्षित रखता है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: ग्नॉस्टिक पारिभाषिक अर्थ की संभावना रखते हुए शब्द के मूल अर्थ को व्यक्त करता है; किसी विशेष तंत्रगत व्याख्या को नहीं जोड़ता।
- source_word: Adamas / Seth / Harmozel / Oroiael / Davithe / Eleleth
  choice: अदामास / सेत / हारमोज़ेल / ओरोइएल / दाविथे / एलेलेथ
  rationale: व्यक्तिनामों और दिव्य सत्ताओं के नामों को ध्वन्यात्मक रूप से देवनागरी में रखा गया है।
theological_decisions:
- issue: ‘चार युगों’ की सत्ता-संबंधी प्रकृति
  choice: मुख्य पाठ में ‘युग’ और पादटिप्पणी में ‘दिव्य सत्ता अथवा लोक’ की संभावना
  alternative: सीधे ‘चार दिव्य लोक’ या ‘चार ऐयोन’
  rationale: स्रोत-साक्ष्य के पारिभाषिक और कालगत दोनों आयामों को बिना निश्चित किए सुरक्षित रखता है।
- issue: ‘the image of the night’ का वाक्यगत संबंध
  choice: ‘संसार में—रात की प्रतिमा में—प्रवेश करेंगे’
  alternative: ‘जो संसार में प्रवेश करेंगे, अर्थात् रात की प्रतिमा’ या ‘महान ज्योति…रात की प्रतिमा’
  rationale: क्षतिग्रस्त संदर्भ के कारण संबंध अस्पष्ट है; विराम-चिह्न और पादटिप्पणी इस अनिश्चितता को प्रकट रखते हैं।
- issue: मृत युग का उठना और विलीन होना
  choice: विरोधाभासी क्रम को ज्यों का त्यों रखा
  alternative: ‘जी उठे और मृत्यु को मिटा दे’ जैसी सामंजस्यकारी व्याख्या
  rationale: पाठ की वास्तविक धार्मिक/ब्रह्मांडीय तनावपूर्ण भाषा को चुपचाप हल नहीं किया गया।
- issue: स्त्रीलिंग ‘Manifestation’
  choice: ‘प्रकटीकरण’ को व्यक्तिवाची उपाधि मानकर ‘उसने’ प्रयुक्त
  alternative: निर्जीव नपुंसक भाव या किसी नामित देवी की व्याख्या
  rationale: साक्ष्य में स्त्रीलिंग सर्वनाम और जन्म देने की क्रिया है, पर उससे आगे पहचान निर्धारित नहीं की गई।
- issue: ग्यारह अष्टकों की गणना
  choice: असामान्य संख्या-विधान को यथावत रखा
  alternative: गणना को समझाने या सुधारने का प्रयास
  rationale: पांडुलिपि-क्षति और गूढ़ गणना के कारण अस्पष्टता वास्तविक है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमामय और पठनीय रखी गई है। गूढ़ पारिभाषिक नामों में लोगोस को लिप्यंतरित किया गया, जबकि aeon, Hebdomad, Ogdoads और Fullness के लिए हिंदी अर्थ-पद देकर पादटिप्पणियों में उनका तकनीकी आयाम बताया गया है। उपलब्ध आधार प्रत्यक्ष कॉप्टिक समीक्षा नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; इसलिए क्षतिग्रस्त और पुनर्स्थापित अंशों को कोष्ठकों सहित सुरक्षित रखा गया है।
