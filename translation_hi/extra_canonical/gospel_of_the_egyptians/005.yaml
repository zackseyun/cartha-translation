translation:
  language: hi
  text: '[] [. . .उस] स्थान [से प्रकट हुआ] महान ज्योति का बादल—जीवित सामर्थ्य, पवित्र और अविनाशी जनों की माता, महान सामर्थ्य मिरोथोए—और उसने उसे जन्म दिया, जिसका नाम मैं तीन बार उच्चारण करके लेता हूँ:


    येन

    येन

    एआ

    एआ

    एआ,


    क्योंकि यही वह अदामास है, दीप्तिमान ज्योति, जो मनुष्य, आदिम मनुष्य, से उत्पन्न होता है; उसी के द्वारा और उसी के लिए सब कुछ अस्तित्व में आया, और उसके बिना कुछ भी अस्तित्व में नहीं आया। अज्ञेय, अगम्य पिता प्रकट हुआ और अभाव को मिटाने के लिए ऊपर से नीचे उतरा।


    तब महान लोगोस[a], स्वयं-उत्पन्न परमेश्वर, और अविनाशी मनुष्य अदामास एक-दूसरे में मिल गए। मनुष्य का एक लोगोस अस्तित्व में आया, पर मनुष्य वचन के उच्चारण द्वारा अस्तित्व में आया। उसने इनकी स्तुति की:


    महान अदृश्य, अगम्य, कुँवारी आत्मा,


    और नर-कुँवारी,


    और त्रि-नर बालक,


    [] और नर-[कुँवारी] यूएल,


    और वैभव के रक्षक एसेफेक,


    बालक के बालक,


    और उसके गौरव के मुकुट,


    महान डोक्सोमेडोन युग[b],


    और उसके भीतर के सिंहासनों,


    और उसके चारों ओर की सामर्थ्यों,


    महिमाओं,


    और अविनाशी सत्ताओं,


    और उनकी समस्त परिपूर्णता[c], जिसका उल्लेख मैं पहले कर चुका हूँ,


    और वायु की पृथ्वी, परमेश्वर को ग्रहण करनेवाली,


    जहाँ महान ज्योति के पवित्र मनुष्य एक प्रतिरूप प्राप्त करते हैं,


    मौन, जीवित निस्तब्धता के पिता के मनुष्य,


    पिता और उनकी समस्त परिपूर्णता, जैसा कि मैं पहले उल्लेख कर चुका हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लोगोस’ यूनानी मूल का तकनीकी शब्द है; इसका अर्थ ‘वचन’, ‘विवेक’ या व्यक्तिकृत दैवी सत्ता हो सकता है।
    reason: शब्द के अर्थ और व्यक्तिकृत उपयोग की वास्तविक बहुअर्थकता बताना।
  - marker: b
    text: यहाँ ‘युग’ उस दैवी लोक, सत्ता या अनंत काल के लिए प्रयुक्त तकनीकी शब्द का अनुवाद है जिसे प्रायः ‘एओन’ कहा जाता है।
    reason: सामान्य हिन्दी शब्द के पीछे उपस्थित प्राचीन ब्रह्मांड-विज्ञान संबंधी अर्थ स्पष्ट करना।
  - marker: c
    text: ‘परिपूर्णता’ संभवतः दैवी सत्ताओं या दैवी जगत की समग्रता के लिए प्रयुक्त तकनीकी पद है।
    reason: ‘Fullness’ के विशेष पारिभाषिक अर्थ को बिना निर्णायक व्याख्या के संकेत करना।
lexical_decisions:
- source_word: Logos
  choice: लोगोस
  rationale: यहाँ यह तकनीकी दैवी सत्ता या उद्भव का नाम है; केवल ‘वचन’ करने से इसकी व्यक्तिकृत और ब्रह्मांड-विज्ञान संबंधी भूमिका समय से पहले निश्चित हो सकती थी। बाद के ‘act of speech’ को ‘वचन के उच्चारण’ से अलग रखा गया है।
- source_word: Adamas
  choice: अदामास
  rationale: व्यक्तिनाम को लिप्यंतरित किया गया है; इसे ‘आदम’ बनाने से अन्य धार्मिक पाठों के पात्र के साथ अनावश्यक समानीकरण होता।
- source_word: aeon
  choice: युग
  rationale: सामान्य पाठक के लिए स्वाभाविक हिन्दी रूप चुना गया, पर पादटिप्पणी में इसके तकनीकी अर्थ की सूचना दी गई है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: मूल परंपरा के समष्टिगत दैवी अर्थ को यथासंभव खुला रखते हुए शाब्दिक संज्ञा-रूप रखा गया है।
- source_word: deficiency
  choice: अभाव
  rationale: ‘दोष’ या ‘पाप’ से बचकर ब्रह्मांड-विज्ञान में कमी अथवा न्यूनता की अस्पष्टता सुरक्षित रखी गई है।
- source_word: indestructibilities
  choice: अविनाशी सत्ताएँ
  rationale: अमूर्त बहुवचन को हिन्दी में समझने योग्य बनाया गया, किंतु इन्हें स्वर्गदूत या कोई विशिष्ट वर्ग नहीं ठहराया गया।
- source_word: Mirothoe / Youel / Esephech / Doxomedon
  choice: मिरोथोए / यूएल / एसेफेक / डोक्सोमेडोन
  rationale: अज्ञात या तकनीकी व्यक्तिनामों को अर्थानुवाद के बजाय ध्वन्यात्मक रूप में रखा गया है।
theological_decisions:
- issue: ‘through whom and for whom’ में अदामास की भूमिका
  choice: ‘उसी के द्वारा और उसी के लिए’
  alternative: ‘जिसके कारण और जिसकी खातिर’
  rationale: साधन और लक्ष्य दोनों का तनाव सुरक्षित रखा गया है; इसे सृष्टिकर्ता की किसी व्यवस्थित धर्मवैज्ञानिक धारणा में नहीं बदला गया।
- issue: पिता का ‘proceeded’ होना
  choice: ‘प्रकट हुआ’
  alternative: ‘निकल आया’ या ‘उद्भूत हुआ’
  rationale: हिन्दी में पिता की उत्पत्ति का अनपेक्षित संकेत देने से बचते हुए प्रस्थान/प्रकटन की अस्पष्टता रखी गई है।
- issue: male virgin
  choice: ‘नर-कुँवारी’
  alternative: ‘पुरुष-कुँवारा’
  rationale: पाठ के जानबूझकर विरोधाभासी लैंगिक शीर्षक को सहज बनाकर समाप्त नहीं किया गया।
- issue: ‘silent living Silence’
  choice: ‘मौन, जीवित निस्तब्धता’
  alternative: ‘मौन जीवित मौनता’
  rationale: मौन और निस्तब्धता के दोहरे, व्यक्तिकृत प्रयोग को पठनीय हिन्दी में बनाए रखा गया है।
- issue: ‘image’ की प्रकृति
  choice: ‘प्रतिरूप’
  alternative: ‘स्वरूप’ या ‘छवि’
  rationale: यह निश्चित नहीं किया गया कि आशय भौतिक आकृति, दैवी समानता या आध्यात्मिक रूप से है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी अपनाई गई है। उपलब्ध आधार कॉप्टिक मूल की प्रत्यक्ष समीक्षा नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; इसलिए अनुवाद अनंतिम और स्रोत-समीक्षा लंबित है। खंडित पाठ के वर्ग कोष्ठक और बिंदु सुरक्षित रखे गए हैं। पांडुलिपि का मात्र पृष्ठ-संकेत [10] वाक्य से हटाया गया है। स्तुति-सूची की असामान्य व्याकरणिक संरचना और दैवी उपाधियों की लैंगिक तथा ब्रह्मांड-विज्ञान संबंधी तनातनी को सामान्यीकृत नहीं किया गया।
