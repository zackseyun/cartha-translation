review_pass:
  verdict: revise
  source_fidelity: अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य के विरुद्ध मसौदा अधिकांशतः निकट है और क्षतिग्रस्त पाठ के वर्ग-कोष्ठक तथा स्वर-क्रम को सुरक्षित रखता है। फिर भी ‘proceeded’ को ‘प्रकट हुआ’ कहना ‘मौन से निकला/उद्भूत हुआ’ की उद्गम-सूचक भाषा को कमजोर करता है। सबसे महत्वपूर्ण, ‘one being the speech’ को ‘वाणी एक है’ करने से वाक्य का संबंध बदल जाता है। ‘whose [] name [is]’ में रिक्त क्षति-संकेत और पुनर्स्थापित ‘[है]’ भी यथावत होने चाहिए। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने से यह समीक्षा दिए गए अंग्रेज़ी साक्ष्य तक सीमित है।
  naturalness: ‘शोभायात्रा में आगे आया’ गरिमापूर्ण और समझने योग्य है। ‘कुँवारे ... आत्मा’ आधुनिक मानक हिन्दी में व्याकरणतः और अर्थतः असहज है; ‘कुमारी आत्मा’ मूल के virginal विशेषण को अधिक स्वाभाविक ढंग से रखता है। ‘अनाम’ के बदले ‘अनामनीय’ उस नाम के उच्चारण/नामकरण-असमर्थ होने का आशय बेहतर देता है।
  terminology: ‘ऐयोन’, ‘मौन’, ‘[त्रि-]पुरुष बालक’, और ‘पुरुष-कुमारी’ जैसे तकनीकी अथवा जानबूझकर विरोधाभासी पद उचित रूप से संरक्षित हैं। ‘अविनाशी सत्ताएँ’ व्याख्यात्मक किंतु सुरक्षित है, क्योंकि बहुवचन को व्यक्तीकृत सत्ता के रूप में पढ़ना निश्चित नहीं; ‘अविनाशिताएँ’ हिन्दी में अप्राकृतिक होगा।
  issues:
  - severity: medium
    issue: ‘proceeded from Silence’ का ‘मौन से प्रकट हुआ’ अनुवाद
    rationale: ‘Proceeded’ यहाँ प्राकट्य के बजाय उद्गम अथवा निर्गमन का संकेत देता है। ‘मौन से निकला’ इसे अधिक निकटता से रखता है और ‘मौन’ के व्यक्तीकृत सिद्धांत होने की संभावना खुली रखता है।
  - severity: high
    issue: ‘one being the speech’ को ‘वाणी एक है’ करना
    rationale: स्रोत में ‘one’ का आशय ‘एक [सत्ता], जो वाणी है’ है; मसौदा इसे ‘वाणी एक है’ नामक स्वतंत्र दार्शनिक कथन बना देता है।
  - severity: medium
    issue: ‘whose [] name [is]’ के क्षति और पुनर्स्थापना संकेतों का परिवर्तन
    rationale: ‘उसका [...] नाम ... है’ में रिक्त क्षति का स्थान और स्रोत का पुनर्स्थापित [is] दोनों बदल जाते हैं। ‘जिसका [] नाम एक [अदृश्य] चिह्न में [है]’ संकेतों को अधिक ठीक रखता है।
  - severity: low
