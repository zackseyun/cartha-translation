translation:
  language: hi
  text: 'डोमेडोन डॉक्सोमेडोन शोभायात्रा में आगे आया—ऐयनों का ऐयोन[a]—और उसके भीतर सिंहासन था; उसके [चारों ओर] शक्तियाँ, महिमाएँ और [अविनाशी सत्ताएँ थीं। महान] ज्योति का पिता, [जो मौन से प्र]कट हुआ, वही [महान] डॉक्सोमेडोन ऐयोन है। उसमें [त्रि-]पुरुष बालक विश्राम करता है, और उसके [गौरव] का सिंहासन [उसके भीतर] स्थापित किया गया था। [वही सिंहासन है] जिस पर उसका अप्रकटनीय नाम [एक पटिया पर अंकित है]। [...] वाणी एक है—समस्त जगत की [ज्योति का पिता]। वह [मौन से प्र]कट हुआ और मौन के भीतर विश्राम करता है; उसका [...] नाम एक [अदृश्य] चिह्न में है।


    एक छिपा हुआ, [अदृश्य] रहस्य शोभायात्रा में आगे आया:[b]


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A।


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō,


    और इसी प्रकार तीनों शक्तियों ने [महान], अदृश्य, अनाम, कुँवारे और अकथनीय आत्मा तथा [उसकी] पुरुष-कुमारी की स्तुति की।


    [a] “ऐयोन” इस गूढ़ रचना का पारिभाषिक शब्द है; यहाँ इसका अर्थ केवल समय का “युग” नहीं, बल्कि एक शाश्वत लोक या दिव्य सत्ता भी हो सकता है।


    [b] इन स्वर-समूहों को अर्थानुवाद किए बिना साक्ष्य के रूप में रखा गया है; कोष्ठक क्षतिग्रस्त पाठ की संपादकीय पूर्ति दर्शाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऐयोन” इस गूढ़ रचना का पारिभाषिक शब्द है; यहाँ इसका अर्थ केवल समय का “युग” नहीं, बल्कि एक शाश्वत लोक या दिव्य सत्ता भी हो सकता है।
    reason: पारिभाषिक ग्रीक-व्युत्पन्न शब्द की वास्तविक अर्थ-बहुलता स्पष्ट करना।
  - marker: b
    text: इन स्वर-समूहों को अर्थानुवाद किए बिना साक्ष्य के रूप में रखा गया है; कोष्ठक क्षतिग्रस्त पाठ की संपादकीय पूर्ति दर्शाते हैं।
    reason: रहस्यात्मक ध्वनि-क्रम और पाठ-संपादन के संकेतों को अनुवाद समझे जाने से रोकना।
lexical_decisions:
- source_word: aeon
  choice: ऐयोन
  rationale: सिर्फ “युग” कहने से इस गूढ़ पारिभाषिक शब्द में निहित काल, लोक और दिव्य सत्ता के संयुक्त अर्थ सीमित हो जाते; इसलिए लिप्यंतरण रखकर पादटिप्पणी दी गई।
- source_word: came in procession
  choice: शोभायात्रा में आगे आया
  rationale: अनुष्ठानिक और क्रमबद्ध प्रकट होने की छवि को बनाए रखता है; केवल “प्रकट हुआ” मूल रूपक को मिटा देता।
- source_word: indestructibilities
  choice: अविनाशी सत्ताएँ
  rationale: अंग्रेज़ी साक्ष्य का अमूर्त बहुवचन संभवतः व्यक्तीकृत दिव्य शक्तियों को सूचित करता है; “सत्ताएँ” जोड़ने से हिन्दी स्वाभाविक रहती है, पर अस्तित्वगत आशय सुरक्षित रहता है।
- source_word: Silence
  choice: मौन
  rationale: विशिष्ट दिव्य सिद्धांत या सत्ता की संभावना को बनाए रखने के लिए प्रसंग में इसे सामान्य ध्वनि-अभाव के बजाय गरिमापूर्ण पारिभाषिक संज्ञा की तरह रखा गया।
- source_word: triple-male child
  choice: '[त्रि-]पुरुष बालक'
  rationale: पाठ की पुनर्स्थापना और असामान्य लिंग-संबंधी पदावली दोनों सुरक्षित रखी गईं; इसे किसी परिचित धर्मशास्त्रीय उपाधि में नहीं बदला गया।
- source_word: male virgin
  choice: पुरुष-कुमारी
  rationale: मूल की जानबूझकर विरोधाभासी लिंग-भाषा को सहज बनाकर समाप्त नहीं किया गया।
- source_word: undisclosable name
  choice: अप्रकटनीय नाम
  rationale: ऐसा नाम जिसे प्रकट या उद्घाटित नहीं किया जा सकता—इस अर्थ को “अज्ञात” से अधिक सटीक रूप से रखता है।
theological_decisions:
- issue: डॉक्सोमेडोन की पहचान और महान ज्योति के पिता से उसका संबंध
  choice: “वही ... डॉक्सोमेडोन ऐयोन है” के रूप में साक्ष्य की पहचान-सूचक रचना रखी गई
  alternative: दोनों को अलग-अलग सत्ताएँ मानकर वाक्य विभाजित करना
  rationale: उपलब्ध साक्ष्य पहचान का संकेत देता है, पर खंडित पाठ के कारण आगे कोई व्यवस्थित तात्त्विक निष्कर्ष नहीं जोड़ा गया।
- issue: कुँवारा आत्मा और पुरुष-कुमारी की लिंगगत भाषा
  choice: विरोधाभासी पदों को प्रत्यक्ष रूप से सुरक्षित रखा गया
  alternative: “शुद्ध आत्मा” और “पवित्र सहचर” जैसे व्याख्यात्मक, लिंग-निरपेक्ष पद
  rationale: ऐसा सरलीकरण पाठ की वास्तविक धर्मवैचारिक तनातनी और विशिष्ट प्रतीकवाद को मिटा देता।
- issue: मौन का स्वरूप
  choice: “मौन” को संभावित व्यक्तीकृत दिव्य सिद्धांत के रूप में खुला रखा गया
  alternative: इसे केवल शांत अवस्था या ईश्वर की चुप्पी बताना
  rationale: मूल साक्ष्य अस्पष्ट है; किसी एक तात्त्विक व्याख्या को आरोपित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय किंतु गूढ़ता-संरक्षक शैली। नामों और तकनीकी “ऐयोन” का लिप्यंतरण किया गया है। वर्ग कोष्ठक उपलब्ध साक्ष्य की क्षति अथवा संपादकीय पुनर्स्थापना दिखाते हैं; नग्न पांडुलिपि-पृष्ठ संख्याएँ हटाई गई हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है।
