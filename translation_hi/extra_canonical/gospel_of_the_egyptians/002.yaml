translation:
  language: hi
  text: '**मिस्रियों का सुसमाचार — तीन शक्तियाँ**


    उससे तीन शक्तियाँ निकलीं—पिता, माता और पुत्र—जीवित मौन से, जो अविनाशी पिता से निकला था। ये अज्ञात पिता के मौन [से] निकलीं, [और] उस स्थान से डोमेडोन डॉक्सोमेडोन, [आयनों का] आयन, और उनकी अलग-अलग शक्तियों का [प्रकाश] [नि]कला। इसी प्रकार पुत्र चौथे स्थान पर [नि]कला, माता [पाँचवें और पिता] छठे स्थान पर।[a]


    वह [किसी की दृष्टि में नहीं आया] और उसकी घोषणा भी नहीं हुई थी। [वही है] जिसका समस्त [शक्तियों], महिमाओं और [अविनाशिताओं] के बीच कोई संकेत नहीं है।


    उस स्थान से तीन शक्तियाँ निकलीं, […] वे तीन अष्टक, जिन्हें [पिता] मौन में, पूर्व-विधान के साथ, अपनी गोद से [उत्पन्न करता है]—अर्थात पिता, माता और पुत्र।


    <पहला> अष्टक, जिसके कारण त्रि-पुरुष बालक निकला, यह है:


    विचार,


    और लोगोस,


    और अविनाशिता,


    और अनन्त [जीवन],


    इच्छा,


    मन,


    पूर्वज्ञान,


    उभयलिंगी पिता।


    दूसरी अष्टक-शक्ति:


    माता,


    कुँवारी बारबेलोन,


    एपितितिओख[…]आइ,


    मेमेनेआइमेन, [जो] स्वर्ग की देखरेख करती है,


    कार्ब[…],


    व्याख्या से परे शक्ति,


    अकथनीय माता।


    [वह] स्वयं-[उत्पन्न …] है। वह निकल आई। [उसने] निस्तब्ध [मौन के] पिता के साथ सहमति की।


    तीसरी अष्टक-[शक्ति]:


    [निस्तब्ध मौन] का पुत्र,


    और निस्तब्ध मौन का मुकुट,


    [और] पिता की महिमा,


    और […] [माता] का सद्गुण।


    [वह] अपनी गोद से महान प्रकाश की सात शक्तियाँ उत्पन्न करता है; वे सात वाणियाँ हैं, और उनकी पूर्णता वाणी है।


    यही वे तीन [शक्तियाँ], वे तीन अष्टक हैं, जिन्हें पिता ने अपने पूर्व-विधान के द्वारा अपनी गोद से [उत्पन्न किया]। उसने उन्हें उसी स्थान में उत्पन्न किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्ग कोष्ठक अनुवाद-साक्ष्य में पुनर्स्थापित या अनुमानित पाठ दिखाते हैं; […] पांडुलिपि की रिक्ति या अपठनीय अंश दिखाता है; कोणीय कोष्ठक < > संपादकीय सुधार को सूचित करते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: पांडुलिपि की क्षतियों, संपादकीय पूर्तियों और इस प्रारूप के अस्थायी स्रोताधार को पाठक के सामने स्पष्ट रखना।
lexical_decisions:
- source_word: Silence
  choice: मौन
  rationale: मूल की व्यक्तिवाचक और रहस्यवादी संकल्पना को बनाए रखते हुए सहज, गरिमापूर्ण हिन्दी शब्द चुना गया; जहाँ silent विशेषण है वहाँ संदर्भानुसार ‘निस्तब्ध’ रखा गया।
- source_word: aeon
  choice: आयन
  rationale: ज्ञानवादी संदर्भ में यह केवल सामान्य ‘युग’ नहीं, एक पारलौकिक सत्ता भी हो सकता है; इसलिए धर्मवैचारिक अर्थ को समय-अवधि तक सीमित न करने हेतु लिप्यंतरण किया गया।
- source_word: Ogdoad
  choice: अष्टक
  rationale: आठ सत्ताओं के समूह का अर्थ हिन्दी में स्पष्ट करने वाला संक्षिप्त शब्द है, जबकि तकनीकी सामूहिक अर्थ सुरक्षित रहता है।
- source_word: Logos
  choice: लोगोस
  rationale: ‘वचन’, ‘तर्क’ या ‘बुद्धि’ में से किसी एक अर्थ को निर्णायक रूप से थोपने से बचने के लिए तकनीकी पद का लिप्यंतरण रखा गया।
- source_word: Providence
  choice: पूर्व-विधान
  rationale: व्यक्तिरूप में प्रयुक्त नियोजन/व्यवस्था की धारणा व्यक्त करता है और सूची में आए अलग पद ‘पूर्वज्ञान’ से भेद बनाए रखता है।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: पुल्लिंग और स्त्रीलिंग दोनों गुण धारण करने के मूल अर्थ को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: triple-male child
  choice: त्रि-पुरुष बालक
  rationale: दुर्बोध तकनीकी अभिव्यक्ति को किसी विकसित धर्मवैचारिक व्याख्या में बदलने के बजाय उसकी असामान्यता और अस्पष्टता सुरक्षित रखी गई।
- source_word: voices / speech
  choice: वाणियाँ / वाणी
  rationale: बहुवचन शक्तियों और उनकी एकवचन पूर्णता के बीच मूल शब्द-सम्बन्ध को हिन्दी में सुनाई देने योग्य रखा गया।
theological_decisions:
- issue: पिता, माता और पुत्र का संबंध
  choice: तीनों को ‘शक्तियाँ’ कहते हुए मूल की निकास-भाषा बनाए रखी गई
  alternative: इन्हें त्रिएकता या अलग देवताओं के रूप में स्पष्ट करना
  rationale: पाठ स्वयं संबंध की व्यवस्थित व्याख्या नहीं करता; किसी परवर्ती साम्प्रदायिक ढाँचे को आरोपित नहीं किया गया।
- issue: आयन का धर्मवैचारिक स्वरूप
  choice: ‘आयन’ का लिप्यंतरण
  alternative: ‘युग’, ‘सनातन सत्ता’ या ‘लोक’
  rationale: मूल पद में काल और पारलौकिक सत्ता दोनों की सम्भावना रह सकती है; लिप्यंतरण उस तनाव को खुला रखता है।
- issue: मौन का व्यक्तिकरण
  choice: ‘मौन’ को शीर्षक-सदृश संकल्पना की तरह बनाए रखा
  alternative: इसे केवल ‘चुप्पी’ या क्रियाविशेषण बनाना
  rationale: पाठ में मौन से सत्ताएँ निकलती हैं और उसका पुत्र तथा मुकुट कहा जाता है, इसलिए व्यक्तिरूप संकेत सुरक्षित रखा गया।
- issue: लिंग-संबंधी रहस्यवादी पदावली
  choice: ‘उभयलिंगी पिता’ और ‘त्रि-पुरुष बालक’ का निकट रूप
  alternative: प्रतीकात्मक अर्थ की व्याख्या जोड़ना
  rationale: खंड स्वयं इन पदों की व्याख्या नहीं करता; अनिश्चित धर्मवैचारिक अर्थ को निर्णायक नहीं बनाया गया।
- issue: virtue of the Mother
  choice: ‘माता का सद्गुण’
  alternative: ‘माता की शक्ति’ या ‘माता की उत्कृष्टता’
  rationale: निकटतम नैतिक/गुणात्मक अर्थ रखा गया, यद्यपि खंडित संदर्भ में ‘शक्ति’ की सम्भावना भी हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु पठनीय रूप अपनाया गया है। तकनीकी ज्ञानवादी नाम और अनिश्चित संकल्पनाएँ प्रायः लिप्यंतरित या निकट रूप में रखी गई हैं। मूल साक्ष्य के कोष्ठक, रिक्तियाँ और असामान्य क्रम सुरक्षित हैं; नंगे पृष्ठ-संकेत [3] और [4] वाक्य से हटाए गए हैं। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण यह प्रकाशन-पूर्व अस्थायी स्रोत-आधारित प्रारूप है।
