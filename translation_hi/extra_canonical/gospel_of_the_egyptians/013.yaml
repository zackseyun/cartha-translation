translation:
  language: hi
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA,


    ALĒTHŌS ALĒTHŌS,


    हे Yesseus Mazareus Yessedekeus,


    हे जीवित जल,


    हे संतान की संतान,


    हे महिमामय नाम,


    ALĒTHŌS ALĒTHŌS,


    हे सनातन अस्तित्वमान,


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A}[a],


    ALĒTHES ALĒTHŌS


    ĒI AAAA ŌŌŌŌ,


    हे ऐयोनों को निहारनेवाले अस्तित्वमान,


    ALĒTHES ALĒTHŌS,


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ,


    जो सदा-सर्वदा सनातन है,


    ALĒTHES ALĒTHŌS,


    IĒA AIŌ, हृदय के भीतर, जो विद्यमान है—


    UAEI EISAEI EIOEI EIOSEI!


    तुम्हारा यह महान नाम मेरे भीतर वास करता है,


    हे स्वतः-उत्पन्न सिद्ध जन!


    तुम, जो मुझसे बाहर नहीं हो,


    मैं तुम्हें देखता हूँ,


    हे तुम, जो सबके लिए अदृश्य हो;


    क्योंकि दूसरी भाषा में तुम्हें कौन ग्रहण कर सकता है?


    [a] क्योंकि मैंने तुम्हें जान लिया है,


    अब मैं उस अपरिवर्तनीय के साथ एक हो गया हूँ।


    मैंने ज्योति का कवच धारण कर लिया है।


    मैं ज्योति बन गया हूँ,


    क्योंकि अनुग्रह की उत्कृष्ट सुंदरता के लिए माता उस स्थान में थी।


    इसलिए मैंने अपने जुड़े हुए हाथ फैला दिए हैं।


    मैं ज्योति की संपदा के घेरे के भीतर,


    अपनी गोद में, आकार पाया हूँ;


    वही अनेक ज्योति-जन्मों का स्वरूप उत्पन्न करती है,


    जहाँ कोई अभियोग नहीं पहुँचता।


    ALĒTHŌS,


    मैं—मैं तुम्हारी महिमा की घोषणा करूँगा,[c]


    क्योंकि मैंने तुम्हें ग्रहण कर लिया है,


    SOU IĒS IDE AEIŌ AEIE OIS,


    हे ऐयोन, ऐयोन, हे मौन के परमेश्वर!


    मैं पूर्ण रूप से तुम्हारा आदर करता हूँ।


    हे पुत्र, तुम मेरे विश्राम का स्थान हो,


    ĒS ĒS O E,


    निराकारों के बीच निराकार,


    उस मनुष्य को उठाते हुए, जिसके भीतर तुम मुझे शुद्ध करोगे,


    ताकि मैं तुम्हारे अविनाशी नाम के अनुसार


    तुम्हारे जीवन में प्रवेश करूँ।


    इसलिए जीवन की धूप मेरे भीतर वास करती है।


    मैंने उसे सभी आर्खोनों के साँचे के अनुसार जल में मिला दिया है,


    ताकि मैं पवित्र जनों की कुशलता में तुम्हारे साथ जीवित रहूँ—


    तुम, जो सदा विद्यमान हो।[d]


    ALĒTHŌS ALĒTHŌS।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल साक्ष्य में अंतिम A घुँघराले कोष्ठकों में है: AAAA{A}; यह पाठगत अनिश्चितता या संपादकीय संकेत हो सकता है।'
    reason: स्रोत में संरक्षित संपादकीय चिह्न को स्पष्ट करना।
  - marker: c
    text: उपलब्ध साक्ष्य में ‘I shall I proclaim’ है। हिंदी में उसकी पुनरुक्ति को ‘मैं—मैं’ के रूप में बनाए रखा गया है; पाठ संभवतः विकृत है।
    reason: साक्ष्य की व्याकरणिक असामान्यता को चुपचाप सुधारने से बचना।
  - marker: d
    text: इस स्थान पर भी पांडुलिपि में रिक्ति या अनुपलब्ध पाठ का संकेत है।
    reason: अंग्रेज़ी साक्ष्य के दूसरे खाली कोष्ठक को सुरक्षित रखना।
lexical_decisions:
- source_word: ALĒTHŌS / ALĒTHES
  choice: ALĒTHŌS / ALĒTHES
  rationale: इन आवर्ती यूनानी रूपों को अनुवादित न करके और उनकी भिन्न वर्तनी बनाए रखकर स्तोत्र की ध्वन्यात्मक तथा अनुष्ठानिक विशेषता सुरक्षित रखी गई है।
- source_word: aeons
  choice: ऐयोन
  rationale: यहाँ शब्द संभवतः ज्ञानवादी ब्रह्मांड-विज्ञान का तकनीकी पद है; केवल ‘युग’ करने से सत्तात्मक अर्थ मिट सकता था।
- source_word: Being
  choice: अस्तित्वमान
  rationale: व्यक्तिगत संबोधन और अस्तित्व-संबंधी अर्थ दोनों बनाए रखने के लिए ‘सत्ता’ की अपेक्षा यह रूप चुना गया।
- source_word: self-generated Perfect One
  choice: स्वतः-उत्पन्न सिद्ध जन
  rationale: ‘स्वयंभू’ संभावित भारतीय धार्मिक अर्थ जोड़ सकता था; चुना हुआ पद मूल की उत्पत्ति और पूर्णता दोनों को अधिक स्पष्ट रखता है।
- source_word: archons
  choice: आर्खोन
  rationale: विशिष्ट ब्रह्मांडीय शासक-सत्ताओं के तकनीकी नाम को सामान्य ‘शासक’ बनाकर अर्थ सीमित नहीं किया गया।
- source_word: the Man
  choice: उस मनुष्य
  rationale: साक्ष्य में निहित विशेष/आदिरूपात्मक संकेत को ‘आदम’ या ‘आदिम मनुष्य’ कहकर सिद्धांतगत रूप से नहीं बाँधा गया।
- source_word: incense of life
  choice: जीवन की धूप
  rationale: बपतिस्मा-संबंधी अनुष्ठानिक बिंब को ठोस रूप में बनाए रखा गया है।
theological_decisions:
- issue: वक्ता का अपरिवर्तनीय सत्ता के साथ संबंध
  choice: ‘उस अपरिवर्तनीय के साथ एक हो गया हूँ’
  alternative: ‘उस अपरिवर्तनीय में विलीन हो गया हूँ’
  rationale: ‘merged with’ की निकटता रखी गई, पर ‘विलीन’ से उत्पन्न पूर्ण सत्ता-लोप का अतिरिक्त दार्शनिक निष्कर्ष नहीं जोड़ा गया।
- issue: माता और ‘स्थान’ की पहचान
  choice: ‘माता उस स्थान में थी’
  alternative: माता या स्थान को किसी विशिष्ट ईश्वरीय सत्ता के रूप में समझाकर नाम देना
  rationale: पाठ की रहस्यमय और तकनीकी अस्पष्टता सुरक्षित रखी गई है।
- issue: ‘ज्योति बन गया हूँ’
  choice: प्रत्यक्ष कथन ज्यों का त्यों रखा
  alternative: ‘ज्योति से भर गया हूँ’
  rationale: कम प्रबल विकल्प से पाठ का रूपांतरण/पहचान-संबंधी तनाव मिट जाता; इसलिए मूल दावे को नरम नहीं किया गया।
- issue: मौन के परमेश्वर
  choice: प्रत्यक्ष संबोधन बनाए रखा
  alternative: ‘मौनमय परमेश्वर’
  rationale: ‘God of Silence’ में संबंधवाचक अस्पष्टता है; उसे गुणसूचक विशेषण में नहीं बदला गया।
- issue: बपतिस्माई जल और आर्खोन
  choice: ‘सभी आर्खोनों के साँचे के अनुसार जल में मिला दिया’
  alternative: इस क्रिया को रूढ़िवादी बपतिस्मा-विधि के अनुसार स्पष्ट करना
  rationale: असामान्य अनुष्ठानिक कथन को किसी बाद की संप्रदायगत रीति के अनुरूप नहीं ढाला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिंदी अपनाई गई है, पर रहस्यात्मक नाम, स्वर-क्रम और ALĒTHŌS/ALĒTHES जैसे अनुष्ठानिक उच्चारण रोमन लिपि में यथावत रखे गए हैं। पंक्ति-विन्यास स्तोत्रात्मक पाठ के निकट रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-आधारित प्रस्तुति है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है। मुख्य पाठ में [b] का संकेत पहले पांडुलिपीय रिक्त स्थान पर अभिप्रेत है।
