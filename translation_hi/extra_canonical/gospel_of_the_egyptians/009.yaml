base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/009.yaml
  text: 'Then the great Seth, son of the indestructible Man, Adamas, offered praise to:


    the great unseen, unnamable, unutterable, virginal Spirit,

    even the <male virgin>,

    <and the triple-male child>,

    <and the male> virgin Youel,

    and Esephech, keeper of splendor,

    and the crown of his glory, the child of the child,

    [] and the great Doxomedon aeons,

    and the Fullness, as I mentioned previously,


    and he petitioned on behalf of his seed.


    Then the great power of great light, Plesithea, came forth from that place:


    the mother of the angels,

    the mother of lights,

    the glorious mother,

    the four-breasted virgin,

    bearing the fruit from Gomorrah as a spring, and from Sodom,

    being the fruit of the spring of Gomorrah dwelling inside her.


    She came forth through the great Seth.


    Then the great Seth rejoiced because of the gift bestowed on him by the indestructible child. He drew his seed from the four-breasted virgin and deposited it with him inside the fourth aeon, inside the third great light, Davithe.'
translation:
  language: hi
  text: 'तब महान सेत ने—जो अविनाशी मनुष्य आदामास का पुत्र था—स्तुति अर्पित की:


    महान अदृश्य, अनाम, अकथनीय, कौमार्यपूर्ण आत्मा की,

    अर्थात् <पुरुष-कुमारी> की,

    <और त्रि-पुरुष बालक> की,

    <और पुरुष> कुमारी यूएल की,

    और वैभव के रक्षक एसेफेक की,

    और उसकी महिमा के मुकुट, बालक के बालक की,

    [पाठ लुप्त][a] और महान डोक्सोमेडोन युगों की,

    और परिपूर्णता की, जैसा मैं पहले उल्लेख कर चुका हूँ।


    और उसने अपने वंश की ओर से विनती की।


    तब उस स्थान से महान ज्योति की महान शक्ति, प्लेसिथेया, प्रकट हुई:


    स्वर्गदूतों की माता,

    ज्योतियों की माता,

    महिमामयी माता,

    चार स्तनों वाली कुमारी,

    जो अमोरा से, मानो किसी सोते से, और सदोम से फल धारण किए हुए थी,

    और अमोरा के उस सोते का फल उसके भीतर निवास करता था।[b]


    वह महान सेत के द्वारा प्रकट हुई।


    तब महान सेत उस वरदान के कारण आनन्दित हुआ जो अविनाशी बालक ने उसे दिया था। उसने चार स्तनों वाली कुमारी से अपना वंश निकाला और उसे अपने साथ चौथे युग में, तीसरी महान ज्योति दाविथे के भीतर रख दिया।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध साक्ष्य में पाठ लुप्त या अपठनीय है।
    reason: मुख्य पाठ के [] संकेत को पाठक के लिए स्पष्ट करना आवश्यक है।
  - marker: b
    text: इस वाक्य का पाठ और वाक्य-संबंध कठिन है; ‘अमोरा से, मानो किसी सोते से’ और ‘सदोम से’ का फल के साथ ठीक संबंध अनिश्चित है।
    reason: स्रोत-समीक्षा लंबित होने और अंग्रेज़ी साक्ष्य की असहज संरचना के कारण वास्तविक अस्पष्टता दर्ज की गई।
  - marker: c
    text: यहाँ ‘वंश’ का मूल पद ‘बीज’ या ‘वीर्य’ का अर्थ भी दे सकता है; वाक्य की रहस्यमय उत्पत्ति-भाषा जानबूझकर अनिर्णीत रखी गई है।
    reason: महत्त्वपूर्ण शाब्दिक और धर्मवैचारिक बहुअर्थता को उजागर करना।
lexical_decisions:
- source_word: indestructible Man
  choice: अविनाशी मनुष्य
  rationale: मूल साक्ष्य की उपाधि-सदृश भाषा और ‘Man’ की व्यापक मानवीय संज्ञा को बिना दार्शनिक विस्तार के सुरक्षित रखता है।
- source_word: virginal Spirit
  choice: कौमार्यपूर्ण आत्मा
  rationale: ‘कुमारी आत्मा’ की संभावित व्यक्तिवाचक संकीर्णता से बचते हुए virginal गुण को व्यक्त करता है।
- source_word: aeon(s)
  choice: युग
  rationale: गूढ़ ब्रह्मांड-विज्ञान में काल तथा दिव्य क्षेत्र/सत्ता की वास्तविक अस्पष्टता बनी रहती है; केवल ‘लोक’ कहकर अर्थ सीमित नहीं किया गया।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: तकनीकी धार्मिक अवधारणा की संज्ञात्मकता बनाए रखने के लिए इसे विशिष्ट पद के रूप में रखा गया।
- source_word: seed
  choice: वंश
  rationale: पहली दो घटनाओं में वंशज-समुदाय का आशय स्वाभाविक है; अंतिम वाक्य की रहस्यमय उत्पत्ति-भाषा में भी यही पद रखकर पाठ की पुनरावृत्ति और अर्थगत तनाव सुरक्षित रखा गया।
- source_word: splendor
  choice: वैभव
  rationale: प्रकाशमय गौरव और भव्यता दोनों का संकेत देता है तथा ‘glory’ के लिए प्रयुक्त ‘महिमा’ से भेद रखता है।
- source_word: came/proceeded forth
  choice: प्रकट हुई
  rationale: दैवी निर्गमन के भाव को सहज आधुनिक हिन्दी में देता है, बिना किसी निश्चित तात्त्विक सिद्धान्त को आरोपित किए।
theological_decisions:
- issue: लिंग-विरोधी रहस्यमय उपाधियाँ
  choice: <पुरुष-कुमारी>, <त्रि-पुरुष बालक>, और <पुरुष> कुमारी
  alternative: व्याख्यात्मक रूप से ‘पुरुष और कुमारी दोनों’ अथवा ‘तीन पुरुषत्वों वाला बालक’
  rationale: साक्ष्य में कोणीय कोष्ठकों और असामान्य लिंग-संयोजनों को ज्यों का त्यों रखते हुए वास्तविक रहस्य और पाठगत अनिश्चितता को नहीं सुलझाया गया।
- issue: ‘seed’ का अर्थ
  choice: सभी प्रसंगों में ‘वंश’
  alternative: अंतिम प्रसंग में ‘बीज’ या ‘वीर्य’
  rationale: यहाँ वंश, आध्यात्मिक संतति और उत्पत्तिमूलक पदार्थ के बीच तनाव है। एक ही हिन्दी पद पुनरावृत्ति को बचाता है; फुटनोट वैकल्पिक अर्थ बताता है।
- issue: ‘through the great Seth’ में माध्यम/मार्ग
  choice: महान सेत के द्वारा
  alternative: महान सेत के माध्यम से / महान सेत में से होकर
  rationale: ‘के द्वारा’ माध्यम का भाव रखता है, पर प्रकट होने की भौतिक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- issue: चार स्तनों वाली कुमारी और सदोम-अमोरा का चित्रण
  choice: चित्रण को शाब्दिक और अव्याख्यायित रखा
  alternative: इसे प्रतीकात्मक उर्वरता या उद्धार-रूपक के रूप में स्पष्ट करना
  rationale: पाठ स्वयं प्रतीकों की व्याख्या नहीं करता; किसी सम्प्रदायगत या निजी धार्मिक अर्थ को जोड़ा नहीं गया।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में गरिमामय, पाठयोग्य शैली अपनाई गई है। नामों का देवनागरी लिप्यंतरण अंग्रेज़ी साक्ष्य के आधार पर है: आदामास, यूएल, एसेफेक, डोक्सोमेडोन, प्लेसिथेया और दाविथे। काव्यात्मक/स्तुतिपरक सूची-विन्यास सुरक्षित रखा गया है। यह अंतरिम मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।'
