  issues:
  - severity: high
    issue: ‘seed’ का अंतिम अनुवाद ‘वंश’ किया गया है।
    rationale: ‘उसने ... अपना वंश निकाला’ न तो स्वाभाविक हिन्दी है न ‘extracted his seed’ के शारीरिक/उत्पत्तिमूलक चित्रण को बचाता है। एक ही स्रोत-पद की तीनों आवृत्तियों में ‘बीज’ रखना अधिक निष्ठावान है।
  - severity: medium
    issue: Gomorrah को ‘अमोरा’ लिखा गया है।
    rationale: उपलब्ध अंग्रेज़ी साक्ष्य में नाम ‘Gomorrah’ है; आधुनिक हिन्दी लिप्यंतरण ‘गोमोर्रा’ अधिक सटीक है।
  - severity: low
    issue: ‘बालक के बालक’ का ‘crown of his glory’ से संबंध पर्याप्त स्पष्ट नहीं है।
    rationale: स्रोत में यह समीपस्थ पदानुक्रम/अप्पोज़िशन है; हिन्दी में ‘जो बालक का बालक है’ जोड़ने से बिना व्याख्यात्मक विस्तार के संबंध स्पष्ट होता है।
