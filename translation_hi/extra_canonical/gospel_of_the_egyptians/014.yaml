- issue: अंतिम सूची का व्याकरणिक संबंध
  choice: ‘के लिए भी’ जोड़कर उसे प्रकट होने के उद्देश्य से जोड़ा गया, पर पाठ-विच्छेद स्पष्ट रखा गया।
  alternative: सूची को स्वतंत्र स्तुतिपरक संबोधन मानना
  rationale: उपलब्ध साक्ष्य का वाक्य-विन्यास कठिन और संभवतः क्षतिग्रस्त है; अनुवाद पठनीय है, पर निश्चित धर्मसैद्धान्तिक पुनर्निर्माण नहीं करता।
- issue: ‘एकलौता पुत्र’
  choice: एकलौता पुत्र
  alternative: अद्वितीय पुत्र / एकमात्र जन्मा पुत्र
  rationale: संबंधित प्राचीन धार्मिक पद का परिचित हिन्दी रूप रखा गया, किंतु इसे किसी विशिष्ट मत-सूत्र से समझाने का प्रयास नहीं किया गया।
