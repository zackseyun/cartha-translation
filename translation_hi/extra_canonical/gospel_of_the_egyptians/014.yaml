    you have [cleansed me inside him]

    with your life,

    [in accord with your] indestructible [name].

    [Therefore], with him [is incense of life]

    that has mingled with baptismal [water] of [every] archon,

    [so that I might] live together with you in the [well-being of the holy ones],

    O eternal one [who exists],

    TRUTH TRULY.


    [The great Seth] wrote [this book], and deposited it on [a] high [mountain] where [the sun rises] not, nor [. . .], and [since the days of the] prophets [and . . . and the] apostles, [. . .] come forth [. . . and their] ear [has not heard] it.


    The great Seth wrote [this] [] [book] with letters [. . .]. He deposited [it . . .].'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/014.yaml
  text: 'This is the book that the great Seth wrote and deposited high in the mountains, where the sun has not risen, nor is that (even) possible. Since the days of the prophets, apostles, and preachers, its name has not arisen in their hearts in the least, nor is that (even) possible, and their ear has not heard it.


    The great Seth wrote this book with letters in 130 years. He deposited it on the mountain called Charaxio, with the intention that, at the end of the times and eras, in agreement with the desire of the self-generated God and the complete Fullness, and by the gift of the inscrutable, ungraspable, fatherly will, it might come to light and appear for this sacred, indestructible generation of the great Savior and for those who dwell with them in love, and the great, unseen, eternal Spirit and his only-begotten Son, and eternal light, [] also its great, indestructible companion, and indestructible Sophia, and Barbelon, and the complete Fullness, in eternity. Amen.


    Also restore the omitted witness markers in their respective locations: “the mystery] of [mysteries]. [7] They [appeared . . . who oversees . . .] and the aeons, TRUTH TRULY [8] [. . .], and TRUTH TRULY, [eternal] aeons”; “[. . .] AIA[. . .]THAŌTHŌSTH[. . .], [9]”; and “[. . .] TRUTH, [16]”.'
translation:
  language: hi
  text: '## मिस्रियों का सुसमाचार — उपसंहार


    यह वह पुस्तक है जिसे महान सेत ने लिखा और पर्वतों की ऊँचाइयों पर सुरक्षित रख दिया, जहाँ सूर्य कभी उदित नहीं हुआ और न ऐसा होना संभव है। भविष्यवक्ताओं, प्रेरितों और प्रचारकों के दिनों से इसका नाम उनके हृदयों में तनिक भी नहीं उठा और न ऐसा होना संभव है; उनके कान ने भी इसे नहीं सुना।


    महान सेत ने इस पुस्तक को एक सौ तीस वर्षों में अक्षरों में लिखा।[a] उसने इसे खराक्सियो नामक पर्वत पर इस उद्देश्य से रख दिया कि समयों और युगों के अंत में, स्वयं-उत्पन्न परमेश्वर और संपूर्ण परिपूर्णता की इच्छा के अनुसार, तथा अगम्य, पकड़ से परे, पितृवत इच्छा के वरदान से, यह प्रकाश में आए और महान उद्धारकर्ता की इस पवित्र, अविनाशी पीढ़ी तथा प्रेम में उनके साथ रहनेवालों के लिए प्रकट हो—और महान, अदृश्य, सनातन आत्मा, उसके एकलौते पुत्र और सनातन ज्योति के लिए भी; [] साथ ही उसकी महान, अविनाशी संगिनी, अविनाशी सोफिया, बारबेलोन और संपूर्ण परिपूर्णता के लिए, अनंतकाल तक।[b] आमेन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध पाठ का वाक्यांश शाब्दिक रूप से ‘अक्षरों में, 130 वर्षों में’ है। इसका सटीक आशय अनिश्चित है; सम्भव है कि संख्या या वाक्य-विन्यास पाठ-परंपरा में बिगड़ा हो।
    reason: असामान्य कालावधि और वाक्य-विन्यास की वास्तविक पाठगत कठिनाई को छिपाने से बचना।
  - marker: b
    text: यहाँ पाण्डुलिपि में रिक्तता/पाठ-हानि है, जिसे [] से दिखाया गया है। इसके कारण ‘सनातन ज्योति’ के बाद आनेवाली सूची का ठीक व्याकरणिक संबंध निश्चित नहीं है।
    reason: क्षतिग्रस्त स्रोत और अंतिम सूची की वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: Seth
  choice: सेत
  rationale: बाइबिलीय नाम के प्रचलित आधुनिक हिन्दी रूप को अपनाया गया; इसे अंग्रेज़ी उच्चारणानुसार ‘सेथ’ नहीं किया गया।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: यहाँ तकनीकी ब्रह्माण्ड-विज्ञान संबंधी संज्ञा है; ‘पूर्णता’ की तुलना में ‘परिपूर्णता’ इसके सामूहिक और दार्शनिक आशय को अधिक स्पष्ट रखती है।
- source_word: self-generated God
  choice: स्वयं-उत्पन्न परमेश्वर
  rationale: पाठ की विशिष्ट उत्पत्ति-संबंधी भाषा को किसी प्रचलित धर्मसैद्धान्तिक पद में समाहित किए बिना औपचारिक रूप से सुरक्षित रखा गया।
- source_word: inscrutable, ungraspable
  choice: अगम्य, पकड़ से परे
  rationale: दो अलग विशेषणों का तनाव बनाए रखते हुए पहला अधिक साहित्यिक और दूसरा साधारण पाठक के लिए स्पष्ट रखा गया।
- source_word: fatherly will
  choice: पितृवत इच्छा
  rationale: ‘पिता की इच्छा’ कहने से संभावित संबंध-सूचक अर्थ अनावश्यक रूप से निश्चित हो जाता; विशेषणात्मक अस्पष्टता सुरक्षित रखी गई।
- source_word: generation
  choice: पीढ़ी
  rationale: जाति, वंश और आध्यात्मिक समुदाय के बीच स्रोत की संभावित अर्थ-व्याप्ति को अपेक्षाकृत खुला रखने वाला सहज हिन्दी पद।
- source_word: Sophia
  choice: सोफिया
  rationale: इस गूढ़ज्ञानवादी संदर्भ में यह व्यक्तिवाची तकनीकी नाम है; केवल ‘बुद्धि’ अनुवाद करने से उसका व्यक्तित्व और पारिभाषिक स्वरूप धुँधला पड़ता।
- source_word: Barbelon
  choice: बारबेलोन
  rationale: पाण्डुलिपि-परंपरा में प्रयुक्त विशिष्ट नाम का लिप्यंतरण किया गया, उसे किसी अन्य परिचित नाम से नहीं मिलाया गया।
- source_word: Charaxio
  choice: खराक्सियो
  rationale: अनिश्चित प्राचीन स्थान-नाम को ध्वन्यात्मक रूप से लिप्यंतरित किया गया।
