source:
  text: 'This is the book the great Seth wrote and deposited high in the mountains where the sun has not risen, nor is that (even) possible, and since the days of the prophets, and apostles, and preachers, the name has not in the least arisen in their hearts, nor is that (even) possible, and their ear has not heard it.


    The great Seth wrote this book with letters in 130 years. He deposited it on the mountain called Charaxio, with the plan that at the end of the times and eras, in agreement with the wish of the self-generated God and the complete Fullness, with the gift of the inscrutable, ungraspable, fatherly will, it may come to light and appear for this sacred, indestructible generation of the great Savior and for those who dwell with them in love, and the great, unseen, eternal Spirit and his only-begotten Son, and light eternal, [] also its great, indestructible companion, and indestructible Sophia, and Barbelon, and the complete Fullness, in eternity. Amen.


    The gospel of <the> Egyptians, the God-written, sacred secret book.


    Grace, understanding, perception, and discretion for him who copied it, Eugnostos the beloved in the Spirit – Gongessos is my name in the flesh – and my companion lights in indestructibility.


    Jesus Christ, Son of God, Savior, ICHTHYS.

    God-written, the sacred book of the great unseen Spirit. Amen.


