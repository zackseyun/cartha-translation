translation:
  language: hi
  text: 'तब महान युगों में से चार सौ आकाशीय स्वर्गदूत निकले। उनके साथ महान एरोसिएल और महान सेलमेकेल थे। वे सत्य और न्याय के समय और क्षण से लेकर उस युग और उसके शासकों के अंत तक महान अविनाशी वंश, उसके फल और महान सेत के महान जनों की रखवाली करने के लिए आए थे। उन शासकों को महान न्यायियों ने मृत्यु-दंड दिया था।


    तब चार ज्योतियों ने स्वयं-उत्पन्न की इच्छा से महान सेत को भेजा। यह [] और समस्त परिपूर्णता, महान अदृश्य आत्मा की <देेन>[a] और प्रसन्नता, पाँच मुहरों और समस्त परिपूर्णता के द्वारा हुआ।


    उसने उन तीन आगमनों[b] को पार किया जिनका उल्लेख मैं पहले कर चुका हूँ—जलप्रलय, अग्नि-विनाश और शासकों, शक्तियों तथा अधिकारियों का दंडादेश—ताकि वह जो भटक गई थी, संसार के मेल-मिलाप और वचन से उत्पन्न शरीर द्वारा दिए जाने वाले बपतिस्मे के माध्यम से बचाई जाए। महान सेत ने उस शरीर को कुँवारी के द्वारा गुप्त रूप से अपने लिए तैयार किया था, ताकि पवित्र जन पवित्र आत्मा से अदृश्य गुप्त चिह्नों के द्वारा जन्म लें—संसार का संसार से मेल कराने के द्वारा, संसार और तेरह युगों के देवता का त्याग करने के द्वारा, और उन पवित्र, अकथनीय, अविनाशी जनों के आसनों के द्वारा जो पिता की गोद और महान ज्योति में हैं। वह ज्योति उसकी पूर्वदृष्टि के साथ पहले से विद्यमान थी और उसने उसी के द्वारा उस पवित्र बपतिस्मे की स्थापना की जो स्वर्ग से भी श्रेष्ठ है। यह वचन से उत्पन्न उस अविनाशी [] अर्थात जीवित जन, यीशु, के द्वारा हुआ। महान सेत ने उसी को धारण किया, और उसी के द्वारा उसने तेरह युगों की शक्तियों को क्रूस पर जड़ दिया और उन्हें दृढ़ किया जो उत्पन्न किए जाते और हटा दिए जाते हैं।[c]


    उसने उन्हें इस सत्य के ज्ञान का कवच पहनाया और अविनाशिता की अजेय सामर्थ्य दी। उनके सामने ये प्रकट हुए:


    महान सेवक येसेउस मजारेउस येसेदेकेउस, जीवित जल;


    और महान प्रधान—महान याकूब,


    थियोपेम्पतोस और इसावेल;


    और सत्य के सोते की देखरेख करने वाले—मिखेउस, मिखार और म्नेसीनूस;


    और जीवितों के बपतिस्मे की देखरेख करने वाला;


    और शुद्ध करने वाले;


    और सेसेंगेनफारांगेस;


    और जल के द्वारों की देखरेख करने वाले—मिखेउस और मिखार;


    और ऊँचे पर्वत की देखरेख करने वाले—सेलदाओ और एलाइनोस;


    और महान वंश को ग्रहण करने वाले;


    महान सेत के अविनाशी वीर पुरुष;


    चार ज्योतियों के सेवक—महान गमलिएल, महान गब्रिएल, महान साम्बलो और महान [] अब्रासाक्स;


    और सूर्योदय की देखरेख करने वाले—ओलसेस, हुप्नेउस और ह्यूरुमाइओस;


    और अनन्त जीवन के विश्राम में प्रवेश-द्वार पर नियुक्त शासक—मिक्सान्थेर और मिखानोर;


    और चुने हुए प्राणों के पहरेदार—अक्रामास और स्त्रेम्पूखोस;


    और महान सामर्थ्य—हेली हेली माखार माखार सेत;


    और महान, अदृश्य, अनाम, अवर्णनीय कुँवारी आत्मा, और मौन;


    और महान ज्योति हार्मोजेल;


    जीवित स्वयं-उत्पन्न का स्थान, सत्य का परमेश्वर, और <वह> जो उसके साथ रहता है—


    अविनाशी मनुष्य आदामास;


    दूसरा, ओरोइएल—महान सेत का स्थान;


    और यीशु, जिसके पास जीवन है और जिसने आकर व्यवस्था में जो कुछ है उसे क्रूस पर चढ़ाया;


    तीसरा, दाविथे—महान सेत के पुत्रों का स्थान;


    चौथा, एलेलेथ—विश्राम कर रहे पुत्रों के प्राणों का स्थान;


    पाँचवाँ, योएल, जो उसके नाम पर नियुक्त है जिसे उस पवित्र बपतिस्मे से बपतिस्मा देने के लिए ठहराया जाएगा जो अविनाशी स्वर्ग से भी श्रेष्ठ है।


    पर अब से, [] अविनाशी मनुष्य पोइमाएल के द्वारा, और विनती के योग्य जनों तथा बपतिस्मे के सोते पर पाँच मुहरों से जुड़े त्यागों[d] के द्वारा, जब उन्हें इनके विषय में शिक्षा दी जाएगी तब वे उन्हें ग्रहण करने वालों को पहचानेंगे, और वे भी उन्हें पहचानेंगे; और वे मृत्यु का तनिक भी स्वाद नहीं चखेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोणीय कोष्ठक में दिया गया ‘देेन’ पाठ-संपादक द्वारा अनुमानित पूर्ति है; पांडुलिपि में यहाँ पाठ अपूर्ण है।
    reason: पुनर्स्थापित पाठ को प्रत्यक्ष पांडुलिपि-पाठ से अलग दिखाना।
  - marker: b
    text: ‘आगमन’ के लिए प्रयुक्त पद का अर्थ ‘उपस्थिति’ या ‘प्रकट होना’ भी हो सकता है। यहाँ यह जलप्रलय, अग्नि-विनाश और न्याय के तीन प्रसंगों को सूचित करता है।
    reason: मूल तकनीकी पद की अर्थगत असामान्यता और अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: ‘उत्पन्न किए जाते और हटा दिए जाते हैं’ कठिन और संभवतः क्षतिग्रस्त वाक्यांश है; किन लोगों की ओर संकेत है, यह स्पष्ट नहीं।
    reason: स्रोत की वास्तविक अस्पष्टता को चिह्नित करना।
  - marker: d
    text: अंतिम वाक्य का वाक्य-विन्यास खंडित है। ‘विनती के योग्य जन’ और ‘त्यागों’ का ‘के द्वारा’ से ठीक संबंध अनिश्चित है।
    reason: पांडुलिपीय रिक्ति और अस्थिर वाक्य-संबंध को स्वीकार करना।
lexical_decisions:
- source_word: aeons
  choice: युग
  rationale: गूढ़ विश्व-रचना में काल और अधिलौकिक क्षेत्र दोनों का संकेत बना रहता है; सामान्य पाठक के लिए ‘युग’ स्वाभाविक है, जबकि प्रसंग इसका तकनीकी अर्थ स्पष्ट करता है।
- source_word: archons
  choice: शासक
  rationale: मूल गूढ़ पद के सत्ताधारी अर्थ को संप्रदायगत व्याख्या के बिना व्यक्त करता है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: प्लेरोमा-संबंधी तकनीकी अवधारणा का अर्थपरक, किंतु असमाधानकारी अनुवाद।
- source_word: Logos
  choice: वचन
  rationale: व्यक्तिगत और सृजनात्मक धार्मिक अर्थ बनाए रखते हुए हिन्दी बाइबलीय भाषा में सुबोध रूप।
- source_word: parousias
  choice: आगमन
  rationale: ‘उपस्थिति/आगमन’ की मूल अर्थ-सीमा को रखता है; यहाँ तीन ऐतिहासिक-विनाशकारी प्रकटियों के लिए प्रयुक्त असामान्य अर्थ को टिप्पणी में बताया गया है।
- source_word: indestructible
  choice: अविनाशी
  rationale: व्यक्तियों, वंश, स्वर्ग और अवस्था के लिए बार-बार आने वाले प्रमुख धार्मिक विशेषण को एकरूप रखा गया है।
- source_word: receivers
  choice: ग्रहण करने वाले
  rationale: अनुष्ठानिक या स्वर्गीय पदाधिकारियों की सटीक पहचान अनिश्चित है; इसलिए अर्थ को अधिक विशिष्ट नहीं बनाया गया।
