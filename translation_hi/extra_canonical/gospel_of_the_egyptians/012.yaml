id: GEGYP.012
reference: Gospel of the Egyptians — The Three Descents of Seth
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'Then from the great aeons came forth four hundred ethereal angels, in whose company was the great Aerosiel and the great Selmechel, to watch over the great indestructible race, its fruit, and the great men of the great Seth, from the time and the moment of Truth and Justice, until the consummation of the aeon and its archons, whom the great judges sentenced to death.


    Then the great Seth was dispatched by the four lights, by the will of the self-generated one, [] and the entire Fullness, through <the gift> and the pleasure of the great unseen Spirit, and the five seals, and the entire Fullness.


    He traversed the three parousias I mentioned previously: the deluge, and the conflagration, and the sentencing of the archons, and the powers, and the authorities, in order that she who had strayed would be saved by means of the reconciling of the world, and the baptism by a body begotten by the Logos, which the great Seth secretly made ready for himself through the virgin, in order that the holy ones would be begotten by the holy Spirit through unseen secret symbols, through the reconciling of world with world, through the renunciation of the world and the god of the thirteen aeons, and the sessions of the holy, unspeakable, indestructible ones, in the lap and great light of the Father, which pre-existed with his Providence, and which instituted through her the sacred baptism that excels the heaven, through the indestructible one [] begotten by the Logos, even the living one, Jesus, even he whom the great Seth donned, and through him he nailed the powers of the thirteen aeons, and confirmed
    those who are produced and removed. [14]


    He equipped them with an armor of knowledge of this truth, in an invincible strength of indestructibility. There appeared to them:


    the great attendant Yesseus Mazareus Yessedekeus, the living water,

    and the great chiefs, Jacob the great,

    and Theopemptos, and Isavel,

    and those who oversee the spring of truth, Micheus, and Michar, and Mnesinous,

    and he who oversees the baptism for the living,

    and those who cleanse,

    and Sesengenpharanges,

    and those who oversee the gates to the waters, Micheus and Michar,

    and those who oversee the high mountain, Seldao and Elainos,

    and the receivers of the great race;

    the indestructible mighty men <of> the great Seth;

    the ministers of the four lights, the great Gamaliel, the great Gabriel, the great Samblo, and the great [] Abrasax,

    and those who oversee the rising of the sun, Olses, and Hupneus, and Heurumaious,

    and those placed over the entrance into the repose of eternal life, the rulers Mixanther and Michanor,

    and the watchers of elect souls, Akramas and Strempouchos,

    and the great power Heli Heli Machar Machar Seth,

    and the great, unseen, unnamable, unutterable virgin Spirit, and Silence,

    and the great light Harmozel;

    the place of the living self-generated one, the God of truth, and <he> who accompanies him,

    the indestructible Man, Adamas;

    the second, Oroiael, the place of the great Seth;

    and Jesus, who possesses life, and who came and crucified what is in the Law;

    the third, Davithe, the place of the sons of the great Seth;

    the fourth, Eleleth, the place of the souls of the reposing sons;

    the fifth, Yoel, who is placed over his name who will be appointed to baptize with the sacred baptism that exceeds the indestructible heaven.


    From now on, however, [] through the indestructible Man Poimael, and those deserving of supplication, the renunciations of the five seals at the baptism-spring, they will know their receivers when they are instructed concerning them, and they will be known by them, and they shall not in the least taste death.'
