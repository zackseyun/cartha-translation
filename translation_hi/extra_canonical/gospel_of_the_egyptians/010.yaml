  text: 'Five thousand years later, the great light Eleleth said, “Let there be a ruler over Chaos and Hades,” and a cloud appeared [] [named] the hylic Sophia [. . .].


    [She] looked out over the regions [of Chaos]. Her face resembled [. . .] in her form [. . .] blood, and [the great] angel Gamaliel said [to the great Gabriel], the minister of [the great light] Oroiael. He [said, “Let an] angel come forth [to] rule over Chaos [and Hades].”


    Then the cloud [complied and produced] two monads, each [possessing] light. [. . . the throne] she had established in the cloud [above].


    Then Sakla, the great [angel, saw] the great demon [who accompanied him, Nebr]uel, and [together] they became a procreating spirit of the earth. [They begot] ministering angels.


    Sakla [said] to the great [demon] Nebruel, “Let [the] twelve aeons come into being in [the . . .] aeon, worlds [. . .].”


    [. . .] the great angel [Sakla] said, by the will of the self-generated one, [] “There shall [be] the [. . .] numbering seven [. . .],” and he said to the [great angels], “Go, and [let each] of you rule over his (own) [world].”


    Each [of these] twelve [angels] came [forth]:


    [The first] angel is Ath[oth]. [He is the one] whom [the great] generations of humans call [. . .].

    [The] second is Harmas, [who] is [fire-eye].

    The third [is Galila].

    [The] fourth is Yobel.

    [The fifth is] Adonaios, who is [called] Sabaoth.


    The sixth [is Cain, whom] the [great generations of] humans call the sun.

    The [seventh is Abel].

    The eighth is Akiressina.

    The [ninth is Yubel].

    The tenth is Harm[oupiael].

    [The] eleventh is Arch[ir-Adonin].

    The twelfth [is Belias].


    [These are] the ones stationed over Hades [and Chaos], and after the foundation [of the world], Sakla said to his [angels], “I, even I, am a [jealous] God, and apart from me nothing has [come into being,” because he] [] relied on his (own) substance. [13]


    Then a voice came from on high, saying, “The Man exists, and the Son of the Man.”


    The first mold was formed because of the descent of the image above, which reflects its voice on high—the image that peered out through the peering out of the image above. Repentance came into being because of this.'
translation:
  language: hi
  text: 'पाँच हज़ार वर्ष बाद महान ज्योति एलेलेथ ने कहा, “अव्यवस्था और अधोलोक पर एक शासक हो,” और एक बादल प्रकट हुआ […] [जिसका नाम] भौतिक सोफिया[a] [था…]।


    [उसने अव्यवस्था के] भागों पर दृष्टि डाली। उसका मुख […] के समान था; उसकी आकृति में […] रक्त […], और [महान] स्वर्गदूत गमलीएल ने [महान ज्योति] ओरोइएल के सेवक [महान जिब्राईल से] कहा। उसने [कहा, “एक] स्वर्गदूत प्रकट हो, [जो] अव्यवस्था [और अधोलोक] पर शासन करे।”


    तब बादल ने [आज्ञा मानकर] दो मोनाड[b] उत्पन्न किए, जिनमें से प्रत्येक के पास [ज्योति] थी। […वह सिंहासन] जो उसने [ऊपर] बादल में स्थापित किया था।


    तब महान [स्वर्गदूत] सक्ला ने अपने [साथ रहनेवाले] महान दुष्टात्मा [नेब्रू]एल को [देखा], और [दोनों] मिलकर पृथ्वी की एक संतान उत्पन्न करनेवाली आत्मा बने। [उन्होंने] सेवा करनेवाले स्वर्गदूतों को [जन्म दिया]।


    सक्ला ने महान [दुष्टात्मा] नेब्रूएल से [कहा], “[उस …] युग में [वे] बारह युग[c] अस्तित्व में आएँ—लोक […].”


    […] महान स्वर्गदूत [सक्ला] ने स्वयं-उत्पन्न जन की इच्छा से […] कहा, “[…] सात की गिनती […] [होगी],” और उसने [महान स्वर्गदूतों] से कहा, “जाओ, और [तुममें से प्रत्येक] अपने [लोक] पर शासन करे।”


    [इन] बारह [स्वर्गदूतों] में से प्रत्येक [प्रकट हुआ]:


    [पहला] स्वर्गदूत अथो[थ] है। [यह वही है] जिसे मनुष्यों की [महान] पीढ़ियाँ […] कहती हैं।


    [दूसरा] हारमास है, [जो] [अग्नि-नेत्र] है।


    तीसरा [गलीला है]।


    [चौथा योबेल] है।


    [पाँचवाँ] अदोनाइओस है, जो [सबाओथ कहलाता] है।


    छठा [कैन है, जिसे] मनुष्यों की [महान पीढ़ियाँ] सूर्य कहती हैं।


    [सातवाँ हाबिल है]।


    आठवाँ अकिरिस्सीना है।


    [नौवाँ यूबेल है]।


    दसवाँ हारम[ूपिऐल] है।


    [ग्यारहवाँ आर्किर-अदोनिन] है।


    बारहवाँ [बेलियास है]।


    [ये वही हैं] जिन्हें अधोलोक [और अव्यवस्था] पर नियुक्त किया गया है। [संसार] की नींव डाले जाने के बाद सक्ला ने अपने [स्वर्गदूतों] से कहा, “मैं, हाँ मैं ही, [ईर्ष्यालु] परमेश्वर हूँ, और मेरे सिवा कुछ भी [अस्तित्व में नहीं आया है,” क्योंकि वह] […] अपने ही तत्त्व पर निर्भर था।


    तब ऊपर से एक वाणी आई, “मनुष्य[d] विद्यमान है, और मनुष्य का पुत्र भी।”


    पहला साँचा इसलिए बनाया गया कि ऊपर की प्रतिमा नीचे उतरी थी—वह प्रतिमा जो ऊपर अपनी वाणी का प्रतिबिंब प्रकट करती है, जिसने ऊपर की प्रतिमा के झाँकने के द्वारा बाहर झाँका था। इसी कारण पश्चात्ताप अस्तित्व में आया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भौतिक सोफिया’ का अर्थ लगभग ‘पदार्थ से संबंधित सोफिया’ है; ‘सोफिया’ यूनानी में ‘बुद्धि’ का शब्द भी है और यहाँ एक नाम की तरह प्रयुक्त है।
    reason: अपरिचित तकनीकी नाम और उसके शब्दार्थ को स्पष्ट करना।
  - marker: b
    text: ‘मोनाड’ दार्शनिक शब्द है, जिसका मूल अर्थ ‘एकक’ या अविभाज्य इकाई हो सकता है; यहाँ दो ब्रह्मांडीय सत्ताओं का संकेत है।
    reason: लिप्यंतरित तकनीकी पद की न्यूनतम व्याख्या देना।
  - marker: c
    text: यहाँ ‘युग’ उन ब्रह्मांडीय कालों, लोकों या सत्ताओं का संकेत दे सकता है जिन्हें प्रायः ‘ऐऑन’ कहा जाता है।
    reason: स्रोत पद की वास्तविक अर्थगत बहुलता सुरक्षित रखना।
  - marker: d
    text: यहाँ ‘मनुष्य’ संभवतः साधारण मानव के बजाय किसी आदिरूप या स्वर्गीय ‘मनुष्य’ की उपाधि है; पाठ उसकी पहचान स्पष्ट नहीं करता।
    reason: पूँजीकृत अंग्रेज़ी साक्ष्य के संकेत को बिना अति-व्याख्या के पाठक तक पहुँचाना।
lexical_decisions:
- source_word: Chaos
  choice: अव्यवस्था
  rationale: यहाँ यह साधारण अस्त-व्यस्तता नहीं, बल्कि एक नामित ब्रह्मांडीय क्षेत्र है; फिर भी सहज हिन्दी के लिए अर्थानुवाद रखा गया है।
- source_word: Hades
  choice: अधोलोक
  rationale: यूनानी पौराणिक और ब्रह्मांडीय लोक का संकेत बनाए रखते हुए इसे ‘नरक’ नहीं कहा गया, ताकि बाद की दंड-संबंधी धारणाएँ न थोपी जाएँ।
- source_word: hylic Sophia
  choice: भौतिक सोफिया
  rationale: ‘hylic’ का अर्थ पदार्थ-संबंधी है; ‘सोफिया’ को व्यक्तिनाम की तरह लिप्यंतरित किया गया है।
- source_word: monads
  choice: मोनाड
  rationale: विशिष्ट दार्शनिक-ब्रह्मांडीय तकनीकी पद का सीधा सामान्यीकरण अर्थ को अनुचित रूप से निश्चित कर देता; इसलिए लिप्यंतरण और पादटिप्पणी दी गई है।
- source_word: aeons
  choice: युग
  rationale: पाठ में यह कालखंड और व्यक्त/ब्रह्मांडीय सत्ता दोनों का संकेत दे सकता है; ‘युग’ उस बहुअर्थता को कुछ हद तक सुरक्षित रखता है।
- source_word: self-generated one
  choice: स्वयं-उत्पन्न जन
  rationale: इसे किसी परिचित धार्मिक उपाधि में बदलने के बजाय स्रोत की विशिष्ट उपाधि का औपचारिक अर्थ रखा गया है।
- source_word: substance
  choice: तत्त्व
  rationale: ‘पदार्थ’ से केवल भौतिक द्रव्य का अर्थ निकल सकता था; ‘तत्त्व’ सत्ता या अंतर्निहित सार की गुंजाइश रखता है।
- source_word: mold
  choice: साँचा
  rationale: रचना के प्रतिरूप या ढाँचे का ठोस रूपक सुरक्षित रखा गया है।
- source_word: repentance
  choice: पश्चात्ताप
  rationale: साक्ष्य में उपलब्ध धार्मिक-नैतिक संज्ञा का सीधा अर्थ रखा गया है, यद्यपि प्रसंग में यह व्यक्त सत्ता भी हो सकती है।
theological_decisions:
- issue: सक्ला का ‘ईर्ष्यालु परमेश्वर’ होने का दावा
  choice: दावे को उसी पात्र की वाणी के रूप में रखा गया और ‘परमेश्वर’ का प्रयोग किया गया।
  alternative: इसे सच्चे परमेश्वर के विषय में कथन मानना या ‘देवता’ कहना।
  rationale: पाठ स्वयं सक्ला के दावे और ऊपर से आनेवाली वाणी के बीच तनाव रखता है; अनुवाद ने उस दावे की सत्यता का निर्णय नहीं किया।
- issue: “The Man” की पहचान
  choice: ‘मनुष्य’ रखा और पादटिप्पणी में संभावित आदिरूप/स्वर्गीय अर्थ बताया।
  alternative: ‘आदि-मनुष्य’, ‘स्वर्गीय मनुष्य’ या किसी विशिष्ट मसीही पहचान को पाठ में जोड़ना।
  rationale: मूल अभिव्यक्ति की पहचान अस्पष्ट है; अतिरिक्त धर्मवैज्ञानिक निष्कर्ष आरोपित नहीं किया गया।
- issue: युगों का स्वरूप
  choice: ‘युग’ रखा।
  alternative: ‘अनंत काल’, ‘लोक’ या ‘दैवी सत्ताएँ’।
  rationale: इस ब्रह्मांड-वर्णन में aeon काल, क्षेत्र या व्यक्त सत्ता हो सकता है; संदर्भ की बहुअर्थता बनाए रखी गई।
- issue: पश्चात्ताप का अस्तित्व में आना
  choice: ‘पश्चात्ताप अस्तित्व में आया’ कहा गया।
  alternative: इसे केवल मनोभाव मानकर ‘उन्होंने पश्चात्ताप किया’ कहना।
  rationale: संज्ञा के सत्तारूप या व्यक्तिरूप होने की संभावना को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु पठनीय शैली अपनाई गई है। व्यक्तिनामों को ध्वन्यात्मक रूप से देवनागरी में रखा गया है। कोष्ठक पांडुलिपि की संपादकीय पुनर्स्थापनाओं को और […] अपूर्ण अथवा नष्ट अंशों को दर्शाते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण यह प्रकाशन-मसौदा अस्थायी स्रोत-समीक्षित रूप माना जाए।
