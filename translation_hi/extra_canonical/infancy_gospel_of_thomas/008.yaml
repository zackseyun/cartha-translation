base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: hi
  text: '(1) बालक यीशु हँसा और बोला, “अब बाँझ स्त्रियाँ फलवती हों, अंधे देखें, और जो मन से मूर्ख हैं वे समझें कि मैं ऊपर से यहाँ हूँ, ताकि नीचे वालों को छुड़ाऊँ और उन्हें ऊपर बुलाऊँ, ठीक वैसे ही जैसे मुझे तुम्हारे पास भेजने वाले ने मुझे आज्ञा दी है।”


    (2) और तुरन्त वे सभी बचाए गए जो उसके शाप के अधीन पड़ गए थे। तब से किसी ने उसे उकसाने का साहस नहीं किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: barren
  choice: बाँझ
  rationale: यह संतान उत्पन्न न कर सकने की अवस्था को सीधे और स्वाभाविक ढंग से व्यक्त करता है; रूपक की खुली प्रकृति बनाए रखता है।
- source_word: bear fruit
  choice: फलवती हो
  rationale: मूल के फल धारण करने वाले बिंब को बनाए रखते हुए बाँझपन के संदर्भ में स्वाभाविक हिन्दी देता है।
- source_word: foolish in heart
  choice: जिनके हृदय मूर्ख हैं
  rationale: प्राचीन हृदय-केंद्रित अभिव्यक्ति को सामान्य 'मूर्ख लोग' में समतल किए बिना संरक्षित करता है।
- source_word: from above
  choice: ऊपर से
  rationale: स्थानिक तथा संभावित दिव्य दोनों अर्थों की अस्पष्टता बनाए रखता है।
- source_word: deliver
  choice: छुड़ाऊँ
  rationale: मुक्त करने या संकट से बचाने का अर्थ देता है, जबकि उद्धार-विषयक अर्थ की संभावना को बंद नहीं करता।
- source_word: call them up
  choice: उन्हें ऊपर बुलाऊँ
  rationale: ऊपर बुलाने की स्थानिक छवि और उसके संभावित धार्मिक संकेत को ज्यों का त्यों रखता है।
- source_word: curse
  choice: शाप
  rationale: कथा में यीशु द्वारा पहले बोले गए हानिकारक दंड-वचनों के लिए सटीक और प्रतिष्ठित शब्द।
- source_word: saved
  choice: बचा लिए गए
  rationale: शाप के प्रभाव से तत्काल छुटकारे का कथात्मक अर्थ स्पष्ट करता है, पर व्यापक उद्धारार्थ को पूरी तरह नकारता नहीं।
- source_word: provoke
  choice: उकसाने
  rationale: विरोध या क्रोध दिलाने की कार्रवाई को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘ऊपर’ और ‘नीचे’ का अर्थ
  choice: शाब्दिक स्थानिक भाषा ‘ऊपर से’ और ‘नीचे वालों’ को बनाए रखा
  alternative: इन्हें स्पष्ट रूप से ‘स्वर्ग से’ और ‘पृथ्वी पर रहने वालों’ के रूप में व्याख्यायित करना
  rationale: उपलब्ध साक्ष्य में यह भाषा स्थानिक होने के साथ धार्मिक अर्थ भी रख सकती है; स्पष्ट व्याख्या मूल की बहुअर्थकता घटा देती।
- issue: शाप के अधीन लोगों का ‘बचाया जाना’
  choice: ‘बचा लिए गए’
  alternative: ‘उद्धार पा गए’ या ‘चंगे हो गए’
  rationale: ‘बचा लिए गए’ तत्काल शाप-मुक्ति के प्रसंग के अनुकूल है और अंतिम उद्धार अथवा केवल शारीरिक चंगाई का अतिरिक्त दावा नहीं करता।
- issue: यीशु के भेजे जाने का कथन
  choice: ‘मुझे तुम्हारे पास भेजने वाले’
  alternative: भेजने वाले की पहचान ‘परमेश्वर’ या ‘पिता’ के रूप में स्पष्ट करना
  rationale: पाठ स्वयं भेजने वाले का नाम नहीं देता; अनाम संदर्भ को बनाए रखना पाठगत संयम है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। बालक के लिए ‘बोला’ स्वाभाविक रखा गया है, जबकि वचन की गंभीरता बनी रहती है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी स्रोत-समीक्षा अभी लंबित होने के कारण अनावश्यक सूक्ष्म पाठगत दावे नहीं किए गए।
