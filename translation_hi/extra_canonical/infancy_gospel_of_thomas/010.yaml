translation:
  language: hi
  text: 'हागियोस साबा 259 पांडुलिपि में यह अंश अध्याय 16 के बाद आता है।[a]


    (1) फिर एक युवक लकड़ी को बराबर टुकड़ों में चीर रहा था। कुल्हाड़ी से उसके पैर का तलवा कट गया; बहुत खून बहा और वह मर गया।[b]


    (2) वहाँ हलचल मच गई और यीशु दौड़कर पहुँचा। वह भीड़ को चीरता हुआ आगे बढ़ा, उसने घायल पैर को पकड़ लिया और वह तुरन्त ठीक हो गया। फिर उसने युवक से कहा, “जा, अपनी लकड़ी चीर।”


    (3) यह देखकर भीड़ चकित रह गई और कहने लगी, “उसने बहुत-से प्राणों को मृत्यु से बचाया है और वह अपने जीवन के सारे दिनों में बचाता रहेगा।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हागियोस साबा 259 में इस प्रसंग का क्रम अन्य पाठ-परंपराओं से भिन्न है; वहाँ यह अध्याय 16 के बाद मिलता है।
    reason: पांडुलिपिगत स्थानांतर को पाठक के लिए सुरक्षित रखना आवश्यक है।
  - marker: b
    text: प्रत्यक्ष यूनानी स्रोत-पाठ की समीक्षा अभी लंबित है। उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी के अनुसार युवक के पैर का तलवा कट गया, उसका खून बह गया और वह मर गया।
    reason: मसौदे की स्रोत-सीमा और घटना के असामान्य संक्षिप्त वर्णन को पारदर्शी बनाना।
  - marker: c
    text: 'यहाँ ‘प्राणों’ का आशय प्रसंगतः लोगों के जीवन से है। अंतिम वाक्य को इस प्रकार भी समझा जा सकता है: ‘वह जीवन भर बचाता रहेगा।’'
    reason: ‘souls’ और अंतिम भविष्यकालीन वाक्य की अर्थगत गुंजाइश बनाए रखना।
lexical_decisions:
- source_word: splitting wood into equal parts
  choice: लकड़ी को बराबर टुकड़ों में चीर रहा था
  rationale: साक्षी के अर्थ और क्रिया की व्यावहारिक छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: split the bottom of his foot
  choice: कुल्हाड़ी से उसके पैर का तलवा कट गया
  rationale: शाब्दिक ‘तलवा चीर दिया’ हिन्दी में कृत्रिम है; प्रसंग से औजार का लगना निहित है, इसलिए घटना को स्पष्ट और सहज रूप दिया गया है।
- source_word: forcing his way through the crowd
  choice: भीड़ को चीरता हुआ आगे बढ़ा
  rationale: भीड़ के बीच बलपूर्वक रास्ता बनाने का भाव संक्षिप्त और मुहावरेदार ढंग से व्यक्त होता है।
- source_word: souls
  choice: प्राणों
  rationale: यहाँ मृत्यु से लोगों के जीवन बचाने का संदर्भ है; ‘आत्माओं’ से अनावश्यक रूप से केवल आध्यात्मिक उद्धार का अर्थ निकल सकता है।
- source_word: saved / will continue to save
  choice: बचाया है / बचाता रहेगा
  rationale: यूनानी समीक्षा लंबित होने के कारण उपलब्ध साक्षी में वर्तमान परिणाम और भविष्य की निरंतरता को सुरक्षित रखा गया है।
theological_decisions:
- issue: मृत युवक का पुनर्जीवन बनाम केवल घाव का चंगा होना
  choice: ‘वह मर गया’ को स्पष्ट रखा और बाद में ‘पैर...ठीक हो गया’ कहा
  alternative: स्पष्ट रूप से कहना कि यीशु ने उसे मृतकों में से जिलाया
  rationale: उपलब्ध साक्षी मृत्यु बताती है, पर चमत्कार का वर्णन सीधे पैर के ठीक होने के रूप में करती है। पाठ की इस तनावपूर्ण संक्षिप्तता को व्याख्या से नहीं भरा गया।
- issue: ‘souls’ का अर्थ
  choice: प्राणों
  alternative: आत्माओं
  rationale: इस कथा में शारीरिक मृत्यु से बचाने का अर्थ प्रमुख है; फिर भी ‘प्राण’ व्यक्ति के जीवन का गरिमापूर्ण और व्यापक संकेत देता है।
- issue: भीड़ की भविष्यवाणी-सदृश उक्ति
  choice: ‘वह अपने जीवन के सारे दिनों में बचाता रहेगा’
  alternative: ‘वह जीवन भर सबको बचाता रहेगा’
  rationale: ‘all’ का संबंध ‘days’ से भी हो सकता है; ‘सबको’ जोड़ने से सार्वभौमिक उद्धार का ऐसा दावा बन सकता है जो उपलब्ध अंग्रेज़ी साक्षी में निश्चित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वर्णन में सरल कथा-लय है; चमत्कार के बारे में उपलब्ध साक्षी से अधिक धर्मवैचारिक विवरण नहीं जोड़ा गया। यह मसौदा अंग्रेज़ी सार्वजनिक-डोमेन साक्षी पर आधारित है, क्योंकि प्रत्यक्ष यूनानी समीक्षा लंबित है।
