translation:
  language: hi
  text: '(1) तब यूसुफ ने यीशु से कहा, “तुम ऐसी बातें क्यों कहते हो, जिनके कारण वे दुःख उठाते हैं और हमसे घृणा करते हैं?”


    बालक ने यूसुफ से कहा, “जब तुम बुद्धिमानी की बातें जानते हो, तो तुम इस बात से अनजान नहीं हो कि वे कहाँ से आईं; [a]वे पाँच वर्ष के बालक के विषय में कही गई थीं।[b] और वे फिर नहीं उठेंगे, और इन्हें अपना दंड मिलेगा।”[c]


    और उसी क्षण उस पर आरोप लगानेवाले अंधे हो गए।


    (2) तब यूसुफ ने उसका—अर्थात यीशु का—कान पकड़कर जोर से खींचा।


    (3) यीशु ने उससे कहा, “तुम्हारे लिए इतना ही काफी है कि तुम मुझे खोजो और पा लो; इससे आगे, स्वाभाविक अज्ञान अपने ऊपर लेकर मुझे मारो नहीं।[d] तुमने मुझे स्पष्ट रूप से नहीं देखा कि मैं तुम्हारा क्यों हूँ।[e] देखो! मैं तुम्हारे सामने वश में रहा हूँ।”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वे कहाँ से आईं” में “वे” का संकेत सम्भवतः बुद्धिमानी की बातों की ओर है, पर उपलब्ध साक्ष्य में सर्वनाम अस्पष्ट है।
    reason: सर्वनामगत अस्पष्टता सुरक्षित रखना।
  - marker: b
    text: “वे पाँच वर्ष के बालक के विषय में कही गई थीं” पाठगत रूप से कठिन वाक्य है। प्रत्यक्ष यूनानी समीक्षा लंबित है।
    reason: कठिन और सम्भवतः भ्रष्ट/परिवर्ती पाठ की सूचना देना।
  - marker: c
    text: “वे” और “इन्हें” किन अलग-अलग व्यक्तियों या समूहों की ओर संकेत करते हैं, यह स्पष्ट नहीं है। “फिर नहीं उठेंगे” का अर्थ स्वस्थ होकर उठना या फिर जीवित होना भी हो सकता है।
    reason: सर्वनाम और क्रिया की वास्तविक अस्पष्टता बनाए रखना।
  - marker: d
    text: “स्वाभाविक अज्ञान अपने ऊपर लेकर” उपलब्ध गवाही के अत्यन्त कठिन शब्दों का निकट अनुवाद है; इसका सटीक आशय अनिश्चित है।
    reason: अस्पष्ट वाक्य को व्याख्या द्वारा निश्चित करने से बचना।
  - marker: e
    text: “तुमने मुझे स्पष्ट रूप से नहीं देखा कि मैं तुम्हारा क्यों हूँ” का वाक्य-विन्यास कठिन है और यूसुफ के साथ संबंध का सटीक आशय अनिश्चित है।
    reason: धर्मवैचारिक तनाव और पाठगत कठिनाई सुरक्षित रखना।
  - marker: f
    text: “वश में रहा हूँ” का अर्थ “अधीन रहा हूँ,” “अपने को संयमित रखा है,” या “दबा दिया गया हूँ” भी हो सकता है।
    reason: अंतिम क्रिया के अर्थ-विकल्प बताना।
lexical_decisions:
- source_word: wise words
  choice: बुद्धिमानी की बातें
  rationale: अर्थ को सामान्य आधुनिक हिन्दी में रखा गया है; उपलब्ध साक्ष्य के अभाव में इसे किसी तकनीकी दार्शनिक पद के रूप में नहीं बाँधा गया।
- source_word: raised
  choice: फिर नहीं उठेंगे
  rationale: मूल गवाही में उठने का आशय अस्पष्ट है—यह स्वस्थ होकर उठने, जीवित होने या पुनर्जीवन का संकेत हो सकता है—इसलिए व्यापक अभिव्यक्ति रखी गई।
- source_word: scourge
  choice: मारो
  rationale: यूसुफ द्वारा कान खींचने के प्रसंग में शारीरिक दंड का स्वाभाविक अर्थ देता है, जबकि असामान्य वाक्य-विन्यास को फुटनोट में स्वीकार किया गया है।
- source_word: subdued
  choice: वश में रहा हूँ
  rationale: अधीनता/संयम की अस्पष्टता बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: “वे फिर नहीं उठेंगे” का आशय
  choice: शाब्दिक रूप से व्यापक “फिर नहीं उठेंगे”
  alternative: “वे फिर जीवित नहीं होंगे” अथवा “वे स्वस्थ होकर नहीं उठेंगे”
  rationale: प्रत्यक्ष यूनानी समीक्षा लंबित है और उपलब्ध अंग्रेज़ी साक्ष्य दोनों अर्थों को निर्णायक रूप से अलग नहीं करता।
- issue: 'यीशु का यूसुफ से संबंध: “मैं तुम्हारा क्यों हूँ”'
  choice: संबंधसूचक कठिन कथन को यथासंभव अक्षुण्ण रखा
  alternative: “क्या तुम नहीं जानते कि मैं तुम्हारा हूँ?”
  rationale: पाठ की धर्मवैचारिक और व्याकरणिक कठिनाई को सहज बनाकर चुपचाप हल नहीं किया गया।
- issue: यीशु की अंतिम घोषणा
  choice: “मैं तुम्हारे सामने वश में रहा हूँ”
  alternative: “मैंने तुम्हारे सामने अपने को नम्र किया है”
  rationale: यह कथन आज्ञाकारिता, संयम या अधीन किए जाने की ओर संकेत कर सकता है; अनिश्चितता बनाए रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। जहाँ अंग्रेज़ी सार्वजनिक-डोमेन गवाही स्वयं कठिन या अस्पष्ट है, वहाँ मुख्य पाठ को अत्यधिक सहज नहीं बनाया गया और संक्षिप्त पाठगत टिप्पणियाँ दी गई हैं। प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण यह प्रकाशन-पूर्व अस्थायी मसौदा है।
