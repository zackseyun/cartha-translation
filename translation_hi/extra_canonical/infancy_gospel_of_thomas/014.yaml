base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: hi
  text: '(1) यूसुफ़ ने यीशु की बुद्धि और समझ देखी। वह नहीं चाहता था कि यीशु अक्षरों से अनजान रहे, इसलिए उसने उसे एक दूसरे शिक्षक को सौंप दिया।


    शिक्षक ने यीशु के लिए वर्णमाला लिखी और कहा, “अल्फ़ा बोलो।”


    (2) बालक ने कहा, “पहले आप मुझे बताइए कि बीटा क्या है, तब मैं आपको बताऊँगा कि अल्फ़ा क्या है।”


    शिक्षक चिढ़ गया और उसने यीशु को मारा। यीशु ने उसे शाप दिया, और शिक्षक गिर पड़ा और मर गया।


    (3) बालक अपने माता-पिता के पास घर चला गया। यूसुफ़ ने यीशु की माँ को बुलाकर आदेश दिया कि वह उसे घर से बाहर न निकलने दे, ताकि जो लोग उसे उकसाएँ, वे मर न जाएँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; यूनानी पांडुलिपि-परंपरा से सीधी जाँच अभी अपेक्षित है।
    reason: दिए गए स्रोत-विवरण के अनुसार प्रत्यक्ष यूनानी समीक्षा लंबित है; पाठकीय पारदर्शिता आवश्यक है।
lexical_decisions:
- source_word: letters
  choice: अक्षरों
  rationale: यहाँ आशय पढ़ना-लिखना सीखने के मूल अक्षरों से है; ‘अक्षर-ज्ञान’ की अपेक्षा ‘अक्षरों से अनजान’ स्रोत की अभिव्यक्ति के अधिक निकट है।
- source_word: alphabet
  choice: वर्णमाला
  rationale: शिक्षक द्वारा लिखे गए अक्षर-क्रम के लिए आधुनिक मानक हिन्दी का स्वाभाविक शब्द।
- source_word: alpha / beta
  choice: अल्फ़ा / बीटा
  rationale: यूनानी अक्षरों के नामों को लिप्यंतरित किया गया है, क्योंकि संवाद का तर्क इन्हीं विशिष्ट अक्षरों पर निर्भर है।
- source_word: cursed
  choice: शाप दिया
  rationale: कथा की कठोर और अलौकिक अर्थ-छाया को बिना नरम किए व्यक्त करता है।
- source_word: provoke
  choice: उकसाएँ
  rationale: यह जान-बूझकर क्रोधित या प्रतिक्रिया के लिए प्रेरित करने का भाव रखता है और मूल साक्ष्य की व्यापकता बनाए रखता है।
theological_decisions:
- issue: यीशु के शाप और शिक्षक की मृत्यु के बीच संबंध
  choice: 'दोनों घटनाओं को क्रम से रखा गया: ‘शाप दिया, और ... मर गया’'
  alternative: शाप के कारण शिक्षक मर गया
  rationale: स्रोत क्रमिक संबंध स्पष्ट करता है, पर प्रत्यक्ष कारणसूचक पद नहीं देता; इसलिए कारण को अतिरिक्त रूप से नहीं जोड़ा गया।
- issue: अंतिम उद्देश्य-वाक्य की अनिश्चितता
  choice: ‘ताकि ... वे मर न जाएँ’
  alternative: ‘कहीं ... मर न जाएँ’ अथवा निश्चित परिणाम ‘वे मरेंगे नहीं’
  rationale: यह यूसुफ़ की रोकथाम-संबंधी मंशा या आशंका को व्यक्त करता है और मृत्यु को अनिवार्य सिद्धांत के रूप में नहीं ठहराता।
- issue: यीशु को घर में रोकने का आदेश
  choice: कथन को बिना नैतिक या सिद्धान्तगत व्याख्या के सीधा रखा गया
  alternative: यूसुफ़ ने दूसरों की रक्षा के लिए ऐसा किया
  rationale: उद्देश्य पाठ में संकेतित है, पर अतिरिक्त धर्मवैचारिक स्पष्टीकरण स्रोत से आगे जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथा-शैली। ‘आप’ का प्रयोग बालक द्वारा शिक्षक को संबोधन में स्वाभाविक सम्मान दिखाता है। नाम ‘यूसुफ़’ और यूनानी अक्षर ‘अल्फ़ा/बीटा’ प्रचलित हिन्दी लिप्यंतरण में दिए गए हैं।
