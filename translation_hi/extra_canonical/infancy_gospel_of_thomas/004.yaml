translation:
  language: hi
  text: '(1) वहाँ से वह अपने पिता यूसुफ़ के साथ जा रहा था। तभी दौड़ते हुए किसी व्यक्ति ने उसके कंधे पर टक्कर मार दी। यीशु ने उससे कहा, “अपने अगुए के कारण तू शापित हो!”[a]


    और वह तुरन्त मर गया।


    जिन लोगों ने देखा कि वह तुरन्त मर गया है, वे पुकार उठे, “यह बालक कहाँ से जन्मा है कि इसका कहा काम बन जाता है?”


    (2) जब मरे हुए बालक के माता-पिता ने देखा कि क्या हुआ था, तो उन्होंने उसके पिता यूसुफ़ को दोष देते हुए कहा, “तुम्हें यह बालक जहाँ कहीं से भी मिला हो, तुम हमारे साथ इस गाँव में नहीं रह सकते। यदि तुम यहाँ रहना चाहते हो, तो इसे आशीष देना सिखाओ, शाप देना नहीं, क्योंकि हमारा बालक हमसे छीन लिया गया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने अगुए के कारण”—यह वाक्यांश उपलब्ध अंग्रेज़ी साक्ष्य में भी असामान्य और अर्थ की दृष्टि से अनिश्चित है। यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण इसे यथासंभव निकट रूप में रखा गया है।
    reason: पाठ की वास्तविक अस्पष्टता बताने और अनुमानित अर्थ को मुख्य पाठ में थोपने से बचने के लिए।
lexical_decisions:
- source_word: leader (Greek source-language review pending)
  choice: अगुआ
  rationale: आपूर्ति किए गए अंग्रेज़ी साक्ष्य की असामान्य अभिव्यक्ति को बिना सामंजस्य बैठाए बनाए रखा गया है। ‘अगुआ’ सामान्य पाठक के लिए बोधगम्य है और ‘नेता’ की अपेक्षा प्राचीन कथात्मक संदर्भ में अधिक स्वाभाविक है।
- source_word: his word becomes deed
  choice: इसका कहा काम बन जाता है
  rationale: वचन के तत्काल घटित हो जाने का आशय स्वाभाविक हिन्दी में रखा गया है, बिना यह व्याख्या जोड़े कि ऐसा किस शक्ति या अधिकार से होता है।
- source_word: has been taken away from us
  choice: हमसे छीन लिया गया है
  rationale: माता-पिता के शोक और आरोप की तीव्रता को सुरक्षित रखता है; केवल तटस्थ ‘मर गया’ कहकर भाव को कम नहीं करता।
theological_decisions:
- issue: यीशु के शाप और बालक की तत्काल मृत्यु के बीच संबंध
  choice: घटनाओं को मूल क्रम में निकट रखकर प्रस्तुत किया गया, पर कोई अतिरिक्त कारणात्मक व्याख्या नहीं जोड़ी गई।
  alternative: स्पष्ट रूप से कहना कि यीशु ने बालक को मार डाला।
  rationale: साक्ष्य शाप के बाद तत्काल मृत्यु बताता है, लेकिन अनुवाद को पाठ से अधिक स्पष्ट धार्मिक या नैतिक निष्कर्ष नहीं जोड़ना चाहिए।
- issue: ‘because of your leader’ की कठिन अभिव्यक्ति
  choice: ‘अपने अगुए के कारण’ के रूप में संरक्षित।
  alternative: इसे अर्थानुमान से ‘अपनी धृष्टता के कारण’ या किसी अन्य सहज वाक्यांश में बदलना।
  rationale: स्रोत-भाषा की समीक्षा लंबित है और अंग्रेज़ी साक्ष्य स्वयं इस वाक्यांश को असामान्य मानता है; अतः वास्तविक अस्पष्टता को मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल कथात्मक शैली। संबोधन में शाप के लिए ‘तू’ और ग्रामीणों के यूसुफ़ से संवाद में ‘तुम’ रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है।
