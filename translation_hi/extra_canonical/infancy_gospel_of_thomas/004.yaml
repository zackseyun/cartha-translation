review_pass:
  verdict: revise
  source_fidelity: The draft follows the supplied English witness closely and appropriately retains the difficult phrase “because of your leader” without harmonization. However, “इसका कहा काम बन जाता है” can suggest that tasks get accomplished, rather than that what the child says comes to pass; a more direct Hindi rendering is needed.
  naturalness: The narration is generally fluent and suitably restrained. “मरे हुए बालक के माता-पिता” is understandable but less natural than “जिस बालक की मृत्यु हुई थी उसके माता-पिता.” The revised wording also improves the crowd’s rhetorical question.
  terminology: “यूसुफ़,” “यीशु,” “आशीष,” “शाप,” and “अगुआ” are appropriate for modern standard Hindi and the narrative register. The footnote properly signals the unresolved, unusual wording.
  issues:
  - severity: medium
    issue: “इसका कहा काम बन जाता है” is semantically imprecise.
    rationale: The witness says that his word becomes deed—that is, what he says comes to pass. The idiom “काम बन जाता है” more naturally refers to a task or objective being successfully accomplished and can obscure the stated relationship between speech and outcome.
  - severity: low
    issue: “मरे हुए बालक के माता-पिता” is stylistically stiff.
    rationale: The source refers to the parents of the child who died. A relative clause is more idiomatic Hindi while preserving the same reference.
