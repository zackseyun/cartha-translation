base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/002.yaml
  text: '(1) The child Jesus was five years old. After it rained, he was playing at the ford of a flowing stream. He stirred up the muddy water, gathered it into pools, and made it clean and excellent, commanding it by his word alone—and not by any action.


    (2) Then he took soft clay from the mud and shaped twelve sparrows from it. But it was the Sabbath when he did these things, and many children were with him.


    (3) A certain Jew saw the child Jesus doing these things with the other children. He went to Joseph, Jesus’ father, and slandered the child Jesus, saying, “He made clay on the Sabbath, which is not permitted, and shaped twelve sparrows.”


    (4) Joseph went and rebuked Jesus, saying, “Why are you doing these things on the Sabbath?”


    But Jesus clapped his hands and, with a shout in front of everyone, commanded the birds, saying, “Go, take flight like living beings!” The sparrows took flight and went away, squawking.


    (5) When the Pharisee saw this, he was amazed and reported it to all his friends.'
translation:
  language: hi
  text: '(1) बालक यीशु पाँच वर्ष का था। वर्षा के बाद वह बहती हुई धारा के घाट पर खेल रहा था। उसने गंदले पानी को हिलाकर छोटे-छोटे कुंडों में इकट्ठा किया और केवल अपने वचन से—बिना कोई काम किए—उसे स्वच्छ और उत्तम बना दिया।[a]


    (2) फिर उसने कीचड़ में से नरम मिट्टी लेकर उसकी बारह गौरैयाँ बनाईं। पर जिस दिन उसने ये काम किए, वह सब्त का दिन था, और उसके साथ बहुत-से बच्चे थे।


    (3) किसी यहूदी ने बालक यीशु को दूसरे बच्चों के साथ ये काम करते देखा। वह उसके पिता यूसुफ के पास गया और बालक यीशु पर दोष लगाते हुए बोला, “इसने सब्त के दिन मिट्टी गूँधी, जिसकी अनुमति नहीं है, और बारह गौरैयाँ बनाईं।”


    (4) तब यूसुफ ने जाकर यीशु को डाँटा और कहा, “तुम सब्त के दिन ये काम क्यों कर रहे हो?”


    पर यीशु ने सबके सामने हाथ बजाए और ऊँची आवाज़ में पक्षियों को आज्ञा दी, “जाओ, जीवित प्राणियों की तरह उड़ जाओ!” तब गौरैयाँ उड़ गईं और चहचहाती हुई दूर चली गईं।


    (5) यह देखकर वह फ़रीसी[a] चकित रह गया और उसने अपने सभी मित्रों को इसके बारे में बताया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त साक्ष्य में पद 3 का व्यक्ति “किसी यहूदी” कहलाता है, पर पद 5 में उसी संदर्भ में “फ़रीसी” कहा गया है। इस परिवर्तन को पाठ में सुरक्षित रखा गया है।
    reason: साक्ष्य के भीतर पदनाम की वास्तविक असंगति/परिवर्तन को पाठक के सामने रखना।
lexical_decisions:
- source_word: ford
  choice: घाट
  rationale: बहती धारा के उस उथले, पार किए जा सकने वाले स्थान के लिए सहज हिन्दी; ‘उथला पार’ की अपेक्षा कथात्मक भाषा में अधिक स्वाभाविक।
- source_word: dirty waters / muddy water
  choice: गंदला पानी
  rationale: वर्षा के बाद धारा के मटमैले जल का सामान्य और स्पष्ट वर्णन।
- source_word: pools
  choice: छोटे-छोटे कुंड
  rationale: बालक द्वारा जल को अलग-अलग जमा करने का दृश्य व्यक्त करता है; बड़े प्राकृतिक तालाब का अर्थ नहीं देता।
- source_word: ordering them by word alone
  choice: केवल अपने वचन से ... बना दिया
  rationale: वचन मात्र से प्रभाव उत्पन्न होने की बात सुरक्षित रखता है, जबकि हिन्दी में निर्जीव जल को ‘आज्ञा देना’ कुछ कृत्रिम लगता।
- source_word: soft clay
  choice: नरम मिट्टी
  rationale: सुगम आधुनिक हिन्दी; आकार देने योग्य चिकनी मिट्टी का आशय संदर्भ से स्पष्ट है।
- source_word: Sabbath
  choice: सब्त का दिन
  rationale: ऐतिहासिक यहूदी विश्राम-दिन का पारंपरिक और समझने योग्य रूप।
- source_word: slandered
  choice: दोष लगाते हुए
  rationale: सूचना देने वाले के आरोपात्मक और निंदात्मक रुख को व्यक्त करता है, बिना कानूनी अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: squawking
  choice: चहचहाती हुई
  rationale: गौरैयों की श्रव्य उड़ान को स्वाभाविक हिन्दी में व्यक्त करता है; अंग्रेज़ी शब्द के कठोर ध्वनि-संकेत को अतिरंजित नहीं करता।
theological_decisions:
- issue: जल को केवल वचन से स्वच्छ करने और ‘काम’ से न करने का विरोध
  choice: “केवल अपने वचन से—बिना कोई काम किए—उसे स्वच्छ और उत्तम बना दिया”
  alternative: “केवल वचन से उसे आज्ञा दी, कर्म से नहीं”
  rationale: चमत्कारिक वचन और शारीरिक क्रिया के बीच स्रोत-साक्ष्य का तनाव बनाए रखा गया है; इसे सृष्टि-विषयक किसी विशिष्ट सिद्धांत के रूप में नहीं समझाया गया।
- issue: ‘किसी यहूदी’ से पद 5 में ‘वह फ़रीसी’ का परिवर्तन
  choice: दोनों अलग पदनाम ज्यों के त्यों रखे गए और फुटनोट जोड़ा गया
  alternative: दोनों स्थानों पर ‘फ़रीसी’ या दोनों पर ‘यहूदी’
  rationale: प्राप्त साक्ष्य की असंगति को चुपचाप समतल नहीं किया गया।
- issue: सब्त के दिन मिट्टी बनाने की मनाही
  choice: “जिसकी अनुमति नहीं है”
  alternative: “जो व्यवस्था के विरुद्ध है”
  rationale: वक्ता के आरोप को कथन के रूप में सुरक्षित रखा गया है, पर किसी खास रब्बी या सांप्रदायिक व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: मिट्टी की गौरैयों का जीवित होकर उड़ना
  choice: “जीवित प्राणियों की तरह उड़ जाओ!”
  alternative: “जी उठो और उड़ जाओ!”
  rationale: स्रोत का उपमा-सदृश वाक्य रखा गया है; पाठ जितना कहता है उससे आगे बढ़कर पुनर्जीवन की स्पष्ट धार्मिक श्रेणी नहीं थोपी गई।
