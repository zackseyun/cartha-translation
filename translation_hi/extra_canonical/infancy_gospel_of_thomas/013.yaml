lexical_decisions:
- source_word: carpenter
  choice: बढ़ई
  rationale: सामान्य आधुनिक हिन्दी में काष्ठकारी करने वाले व्यक्ति के लिए स्वाभाविक और स्पष्ट शब्द।
- source_word: ploughs and yokes
  choice: हल और जुए
  rationale: कृषि-उपकरणों के अर्थ को सीधे और संक्षिप्त रूप में व्यक्त करता है; बहुवचन का भाव संदर्भ से स्पष्ट है।
- source_word: bed
  choice: पलंग
  rationale: लकड़ी से बनाए या बड़ा किए जाने वाले शय्या-साज के लिए ‘बिस्तर’ की अपेक्षा अधिक ठोस और प्रसंगानुकूल शब्द।
- source_word: beams / boards
  choice: शहतीरें / तख्ते
  rationale: गवाह-पाठ स्वयं पहले beam और बाद में board कहता है; हिन्दी में इस शब्दांतर को बनाए रखा गया है, क्योंकि स्रोत-भाषा की प्रत्यक्ष समीक्षा अभी शेष है।
- source_word: stretched it
  choice: खींचा
  rationale: चमत्कारिक क्रिया को बिना अतिरिक्त व्याख्या के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Blessed am I
  choice: मैं धन्य हूँ
  rationale: धार्मिक भाव और कथन की गरिमा को बनाए रखने वाला प्रचलित हिन्दी प्रयोग।
theological_decisions:
- issue: बालक यीशु द्वारा तख्ते को चमत्कारिक ढंग से बढ़ाना
  choice: घटना को सीधे कथित रूप में प्रस्तुत किया गया
  alternative: इसे रूपक, भ्रम या सामान्य कारीगरी के रूप में समझाना
  rationale: पाठ चमत्कार का वर्णन करता है; अनुवाद को उसका धर्मवैचारिक अर्थ न घटाना चाहिए, न बढ़ाना चाहिए।
- issue: “परमेश्वर ने मुझे यह बालक दिया” में संबंध का स्वरूप
  choice: ‘दिया’ का सामान्य और खुला अर्थ सुरक्षित रखा गया
  alternative: दत्तक ग्रहण, जैविक पितृत्व या किसी विशिष्ट मसीह-विज्ञान की स्पष्ट व्याख्या जोड़ना
  rationale: मूल कथन संबंध की धर्मवैचारिक प्रकृति को परिभाषित नहीं करता; इसलिए अस्पष्टता को सुरक्षित रखना उचित है।
- issue: यूसुफ के लिए father का संबोधन
  choice: ‘पिता’
  alternative: ‘पालक पिता’
  rationale: गवाह-पाठ ‘father’ कहता है। ‘पालक’ जोड़ना ऐसी व्याख्या होगी जो इस अंश में प्रत्यक्ष रूप से नहीं दी गई।
