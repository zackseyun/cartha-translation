    (1) जक्कई नाम का एक शिक्षक वहाँ खड़ा था। उसने यीशु को अपने पिता यूसुफ से ये बातें कहते सुना और वह बहुत चकित हुआ।


    (2) उसने यूसुफ से कहा, “भाई, आओ, इसे मेरे पास भेज दो, ताकि इसे अक्षर सिखाए जाएँ और यह सब ज्ञान जाने। यह अपने हमउम्र लोगों से प्रेम करना, वृद्धावस्था का आदर करना और बड़े-बुज़ुर्गों का सम्मान करना सीखे, ताकि इसके मन में बच्चों के प्रति लगाव पैदा हो और यह आगे चलकर उन्हें भी सिखाए।”


    (3) लेकिन यूसुफ ने शिक्षक से कहा, “इस बालक को कौन वश में रखकर सिखा सकता है? भाई, इसे मामूली बालक मत समझना।”


    शिक्षक ने कहा, “भाई, इसे मुझे सौंप दो और इसकी चिंता मत करो।”


    (4) बालक यीशु ने उनकी ओर देखा और शिक्षक से कहा, “शिक्षक होना तुम्हारे स्वभाव में है, फिर भी जिस नाम से तुम बुलाए जाते हो, उससे तुम अपरिचित हो; क्योंकि मेरे देहधारी जन्म की श्रेष्ठता के कारण मैं तुम्हारे बाहर भी हूँ और तुम्हारे भीतर भी। पर तुम, जो व्यवस्था के ज्ञाता हो, व्यवस्था को नहीं जानते।”[a]


    फिर उसने यूसुफ से कहा, “जब तुम जन्मे थे, तब मैं विद्यमान था और तुम्हारे पास खड़ा था, ताकि तुम पिता के रूप में मुझसे ऐसी शिक्षा पाओ जिसे न कोई दूसरा जानता है, न सिखा सकता है। और तुम उद्धार का नाम धारण करोगे।”[b]


    (5) यहूदी पुकार उठे और उससे कहने लगे, “अरे, कैसा नया और अविश्वसनीय आश्चर्य! यह बालक शायद पाँच वर्ष का है, फिर भी कैसी बातें कहता है! ऐसी बातें हमने कभी नहीं सुनीं। न व्यवस्था के किसी ज्ञाता ने, न किसी फ़रीसी ने इस बालक की तरह कहा है।”


    (6) बालक ने उन्हें उत्तर दिया, “तुम चकित क्यों होते हो? बल्कि, जो बातें मैंने तुमसे कही हैं उन पर विश्वास क्यों नहीं करते? सच यह है कि मैं, जो इस संसार से पहले सृजा गया था, ठीक-ठीक तुम्हारे जन्म का समय, और तुम्हारे पिताओं तथा उनके पिताओं का भी, जानता हूँ।”[c]


    (7) यह सुनकर सभी लोग निरुत्तर हो गए और उससे आगे कुछ न कह सके। पर वह उनके पास गया, उछलता-कूदता रहा और बोला, “मैं तुम्हारे साथ खेल रहा था, क्योंकि मैं जानता हूँ कि तुम्हारी समझ छोटी है और तुम छोटी-छोटी बातों पर चकित होते हो।”


    (8) जब बालक के उत्साह देने से वे कुछ आश्वस्त दिखाई दिए, तब शिक्षक ने उसके पिता से कहा, “आओ, इसे पाठशाला में ले आओ। मैं इसे अक्षर सिखाऊँगा।”


    यूसुफ ने उसका हाथ पकड़ा और उसे पाठशाला में ले गया। शिक्षक उसे पुचकारते हुए भीतर ले गया। जक्कई ने उसके लिए वर्णमाला लिखी और एक ही अक्षर को बार-बार बोलकर उसे सिखाने लगा, पर बालक ने उसे कोई उत्तर नहीं दिया।


