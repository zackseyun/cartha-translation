  text: '(1) A teacher named Zacchaeus was standing there. He heard Jesus saying these things to his father Joseph, and he was greatly amazed.


    (2) He said to Joseph, “Come, brother, give him to me so that he may be taught letters, know all knowledge, learn to love those his own age, honor old age, and respect elders, so that he may develop a yearning for children and teach them in return.”


    (3) But Joseph said to the teacher, “Who can control this child and teach him? Do not think of him as a small person, brother.”


    But the teacher said, “Give him to me, brother, and do not let him concern you.”


    (4) The child Jesus looked at them and addressed the teacher: “Being a teacher comes naturally to you, but you are a stranger to the name by which you are called, because I am outside you and within you on account of the nobility of my birth in the flesh. But you, a lawyer, do not know the law.”


    Then he said to Joseph, “When you were born, I already existed, standing beside you, so that you, as a father, might be taught by me a teaching that no one else knows or can teach. And you will bear the name of salvation.”


    (5) The Jews cried out and said to him, “Oh, what a new and incredible wonder! The child is perhaps five years old, and oh, what words he speaks! We have never known such words. No one—neither a lawyer nor a Pharisee—has spoken like this child.”


    (6) The child answered them, “Why are you amazed? Or rather, why do you not believe the things I have told you? The truth is that I, who was created before this world, know precisely when you were born, as well as your fathers and their fathers.”


    (7) All the people who heard this were speechless and could no longer speak to him. But he went up to them, skipped around, and said, “I was playing with you because I know that you are small-minded and amazed by small things.”


    (8) When they seemed comforted by the child’s encouragement, the teacher said to his father, “Come, bring him into the school. I will teach him letters.”


    Joseph took his hand and led him into the school. The teacher flattered him and brought him into the school. Zacchaeus wrote out the alphabet for him and began to teach him, repeating the same letter frequently. But the child did not answer him.


    The teacher became irritated and struck him on the head.


    The child became irritated and said to him, “I want to teach you rather than be taught by you, since I know the letters you are teaching more precisely. To me, these things are like a noisy gong or a clanging cymbal that produces neither the sound, nor the glory, nor the power of understanding.”


    (9) When the child’s anger had ceased, he recited all the letters by himself, from alpha to omega, with great skill. Looking directly at the teacher, he said, “If you do not know the nature of the alpha, how can you teach someone else the beta? Hypocrite! If you know, first teach me the alpha, and then I will trust you to speak about the beta.” Then he began to teach the teacher about the first element, and the teacher could say nothing to him.


    (10) While many people listened, he said to the teacher, “Listen, Teacher, and understand the arrangement of the first element. Notice how it has sharp lines and a middle stroke, which you see pointing, standing with its legs apart, coming together, going out, dragging behind, lifting up, dancing around, <…>, in triple rhythm, two-cornered, of the same form, of the same thickness, of the same family, raised, balanced, isometric, and of equal proportions. These are the lines of the alpha.”'
translation:
  language: hi
  text: '**शैशवकालीन थोमा का सुसमाचार — अध्याय 6: पहला शिक्षक, जक्कई**


    (1) जक्कई नाम का एक शिक्षक वहाँ खड़ा था। उसने यीशु को अपने पिता यूसुफ से ये बातें कहते सुना और वह बहुत चकित हुआ।


    (2) उसने यूसुफ से कहा, “भाई, आओ, इसे मेरे पास भेज दो, ताकि इसे अक्षर सिखाए जाएँ और यह सब ज्ञान जाने। यह अपने हमउम्र लोगों से प्रेम करना, वृद्धावस्था का आदर करना और बड़े-बुज़ुर्गों का सम्मान करना सीखे, ताकि इसके मन में बच्चों के प्रति लगाव पैदा हो और यह आगे चलकर उन्हें भी सिखाए।”


    (3) लेकिन यूसुफ ने शिक्षक से कहा, “इस बालक को कौन वश में रखकर सिखा सकता है? भाई, इसे कोई छोटा-मोटा व्यक्ति मत समझना।”


    शिक्षक ने कहा, “भाई, इसे मुझे सौंप दो और इसकी चिंता मत करो।”


    (4) बालक यीशु ने उनकी ओर देखा और शिक्षक से कहा, “शिक्षक होना तुम्हारे स्वभाव में है, फिर भी जिस नाम से तुम बुलाए जाते हो, उससे तुम अपरिचित हो; क्योंकि शरीर में मेरे जन्म की श्रेष्ठता के कारण मैं तुम्हारे बाहर भी हूँ और तुम्हारे भीतर भी। पर तुम, जो व्यवस्था के ज्ञाता हो, व्यवस्था को नहीं जानते।”[a]


    फिर उसने यूसुफ से कहा, “जब तुम जन्मे थे, तब मैं विद्यमान था और तुम्हारे पास खड़ा था, ताकि पिता होते हुए भी तुम मुझसे ऐसी शिक्षा पाओ जिसे न कोई दूसरा जानता है, न सिखा सकता है। और तुम उद्धार का नाम धारण करोगे।”[b]


    (5) यहूदी पुकार उठे और उससे कहने लगे, “अरे, कैसा नया और अविश्वसनीय आश्चर्य! यह बालक शायद पाँच वर्ष का है, फिर भी कैसी बातें कहता है! ऐसी बातें हमने कभी नहीं सुनीं। न व्यवस्था के किसी ज्ञाता ने, न किसी फ़रीसी ने इस बालक की तरह कहा है।”


    (6) बालक ने उन्हें उत्तर दिया, “तुम चकित क्यों होते हो? बल्कि, जो बातें मैंने तुमसे कही हैं उन पर विश्वास क्यों नहीं करते? सच यह है कि मैं, जो इस संसार से पहले सृजा गया था, ठीक-ठीक जानता हूँ कि तुम कब जन्मे थे, और तुम्हारे पिता तथा उनके पिता कब जन्मे थे।”[c]


    (7) यह सुनकर सभी लोग निरुत्तर हो गए और उससे आगे कुछ न कह सके। पर वह उनके पास गया, उछलता-कूदता रहा और बोला, “मैं तुम्हारे साथ खेल रहा था, क्योंकि मैं जानता हूँ कि तुम्हारी समझ छोटी है और तुम छोटी-छोटी बातों पर चकित होते हो।”


    (8) जब बालक के उत्साह देने से वे कुछ आश्वस्त दिखाई दिए, तब शिक्षक ने उसके पिता से कहा, “आओ, इसे पाठशाला में ले आओ। मैं इसे अक्षर सिखाऊँगा।”


    यूसुफ ने उसका हाथ पकड़ा और उसे पाठशाला में ले गया। शिक्षक उसे पुचकारते हुए भीतर ले गया। जक्कई ने उसके लिए वर्णमाला लिखी और एक ही अक्षर को बार-बार बोलकर उसे सिखाने लगा, पर बालक ने उसे कोई उत्तर नहीं दिया।


    तब शिक्षक झुँझला गया और उसने बालक के सिर पर मारा।


    बालक भी क्रोधित हुआ और उससे बोला, “तुमसे शिक्षा पाने के बजाय मैं तुम्हें सिखाना चाहता हूँ, क्योंकि जिन अक्षरों को तुम सिखा रहे हो, उन्हें मैं तुमसे अधिक ठीक-ठीक जानता हूँ। मेरे लिए ये बातें ऐसे झनझनाते घड़ियाल या खनखनाती झाँझ के समान हैं, जो न स्वर, न महिमा और न समझ की सामर्थ्य प्रकट करते हैं।”[d]


    (9) जब बालक का क्रोध शांत हुआ, तो उसने अल्फ़ा से ओमेगा तक सारे अक्षर अपने-आप बड़ी कुशलता से सुना दिए। फिर शिक्षक की आँखों में सीधे देखते हुए उसने कहा, “यदि तुम अल्फ़ा का स्वरूप ही नहीं जानते, तो किसी दूसरे को बीटा कैसे सिखा सकते हो? कपटी! यदि जानते हो, तो पहले मुझे अल्फ़ा सिखाओ; तब मैं भरोसा करूँगा कि तुम बीटा के विषय में भी बता सकते हो।” फिर वह शिक्षक को पहले अक्षर के विषय में सिखाने लगा, और शिक्षक उसे कोई उत्तर न दे सका।


    (10) बहुत-से लोग सुन रहे थे। उसने शिक्षक से कहा, “गुरुजी, सुनो और पहले अक्षर की बनावट समझो। ध्यान दो कि इसमें नुकीली रेखाएँ और बीच की एक रेखा है। तुम इन्हें संकेत करते, पैर फैलाकर खड़े होते, एक-दूसरे से मिलते, बाहर जाते, पीछे घिसटते, ऊपर उठते, चारों ओर नाचते, <…>, तीन ताल में चलते, दो कोनों वाले, एक ही आकार और एक ही मोटाई के, एक ही कुल के, ऊपर उठे हुए, संतुलित, समान माप के और बराबर अनुपात वाले देखते हो। ये अल्फ़ा की रेखाएँ हैं।”[e]


    **पादटिप्पणियाँ**


    [a] “मैं तुम्हारे बाहर भी हूँ और तुम्हारे भीतर भी” तथा “शरीर में मेरे जन्म की श्रेष्ठता” का आशय स्रोत-साक्ष्य में अस्पष्ट है; इसलिए इसे व्याख्यात्मक रूप से सरल नहीं किया गया है।


    [b] “तुम उद्धार का नाम धारण करोगे” एक कठिन और संभवतः नाम-संबंधी कथन है। इसका आशय स्पष्ट करने के लिए किसी विशेष धार्मिक व्याख्या को पाठ में नहीं जोड़ा गया है।


    [c] उपलब्ध साक्ष्य में “सृजा गया था” है। यद्यपि यह कथन धर्मवैज्ञानिक तनाव उत्पन्न कर सकता है, इसे “विद्यमान था” या “जन्मा था” में नहीं बदला गया है।


    [d] घड़ियाल और झाँझ की उपमा का वाक्य-विन्यास कठिन है। अनुवाद उस अस्पष्टता को बनाए रखता है कि वे ठीक किस प्रकार “स्वर, महिमा और समझ की सामर्थ्य” प्रकट नहीं करते।


    [e] <…> उपलब्ध पांडुलिपि-पाठ में क्षतिग्रस्त या लुप्त अंश को दर्शाता है। अल्फ़ा की रेखाओं का वर्णन अत्यंत कठिन है और संभवतः अक्षर के आकार अथवा लेखन-क्रिया से संबंधित तकनीकी शब्दों की सूची है।'
  philosophy: optimal-equivalence
