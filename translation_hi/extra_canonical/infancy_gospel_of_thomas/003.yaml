base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: hi
  text: '(1) महायाजक हन्ना के पुत्र ने उससे, अर्थात यीशु से, कहा, “तुम सब्त के दिन ऐसा काम क्यों कर रहे हो?” फिर उसने बेंत की एक टहनी लेकर उन छोटे तालों को बिगाड़ दिया, यीशु का इकट्ठा किया हुआ पानी बहा दिया और उनके जमावों को सुखा दिया।[a]


    (2) जो हुआ था उसे देखकर यीशु ने उससे कहा, “तेरे फल की कोई जड़ न होगी, और तेरी कोंपल प्रचंड हवा में झुलसी हुई डाल के समान सूख जाएगी!”[b]


    (3) और वह बालक उसी क्षण सूख गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनके जमावों” का आशय उपलब्ध साक्ष्य में अस्पष्ट है; संभवतः पानी या उससे बने छोटे तालों के जमाव अभिप्रेत हैं।
    reason: अस्पष्ट मूल अभिव्यक्ति को बनाए रखते हुए पाठक को संभावित संदर्भ बताना।
  - marker: b
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “होगी” के अनुरूप शब्द कोष्ठक में है; प्रत्यक्ष यूनानी पाठ की समीक्षा अभी लंबित है।
    reason: स्रोत-आधार की पाठगत और प्रक्रियागत अनिश्चितता को पारदर्शी बनाना।
lexical_decisions:
- source_word: Annas
  choice: हन्ना
  rationale: नाम के प्रचलित बाइबलीय हिन्दी रूप का प्रयोग किया गया है; यह यूनानी परंपरा के नाम Ἄννας के अनुरूप है।
- source_word: Sabbath
  choice: सब्त
  rationale: धार्मिक-सांस्कृतिक पद को संक्षिप्त और प्रचलित हिन्दी रूप में रखा गया है।
- source_word: willow twig
  choice: बेंत की एक टहनी
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के ‘willow twig’ का सहज हिन्दी रूप; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण अधिक वनस्पति-विशिष्ट दावा नहीं किया गया।
- source_word: pools
  choice: छोटे ताल
  rationale: संदर्भ में बच्चों द्वारा बनाए गए पानी के छोटे कुंड अभिप्रेत प्रतीत होते हैं; ‘छोटे ताल’ साधारण पाठक के लिए स्वाभाविक है।
- source_word: their gatherings
  choice: उनके जमावों
  rationale: साक्ष्य की अस्पष्टता बनाए रखने के लिए इसे स्पष्ट रूप से ‘पानी के जमाव’ या ‘ताल’ नहीं किया गया।
- source_word: fruit / root / shoot
  choice: फल / जड़ / कोंपल
  rationale: मूल कथन की वनस्पति-आधारित शब्द-छवि और आंतरिक समानांतरता को सुरक्षित रखा गया है।
- source_word: withered away
  choice: सूख गया
  rationale: वनस्पति-रूपक और बालक पर उसके भयावह अनुप्रयोग, दोनों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: यीशु के कथन को श्राप, भविष्यवाणी या परिणाम-वचन के रूप में समझना
  choice: सीधे कथन के रूप में अनूदित; ‘श्राप दिया’ नहीं जोड़ा गया
  alternative: यीशु ने उसे श्राप दिया
  rationale: शीर्षक की व्याख्या को पाठ में आयात किए बिना उपलब्ध साक्ष्य की वाणी और उसके तत्काल परिणाम को जस का तस रखा गया है।
- issue: भविष्यकालीन या इच्छासूचक बल
  choice: ‘न होगी’ और ‘सूख जाएगी’
  alternative: ‘न हो’ और ‘सूख जाए’
  rationale: अंग्रेज़ी साक्ष्य में भविष्यसूचक रूप है, यद्यपि ‘will have’ कोष्ठक में होने से पाठगत अनिश्चितता है; इसलिए अनुवाद में भविष्यकाल रखा और पादटिप्पणी में अनिश्चितता बताई गई।
- issue: बालक का अंतिम परिणाम
  choice: ‘सूख गया’
  alternative: ‘मर गया’
  rationale: पाठ मृत्यु को स्पष्ट रूप से नहीं कहता; वनस्पति-संबंधी क्रिया की कठोर और अस्पष्ट छवि को संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्वर अपनाया गया है। वाक्य छोटे रखे गए हैं, जबकि ‘फल—जड़—कोंपल—डाल—सूखना’ की विस्तृत रूपक-श्रृंखला सुरक्षित रखी गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण अस्पष्ट स्थलों पर संयम रखा गया है।
