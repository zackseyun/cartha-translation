translation:
  language: hi
  text: '(1) इन बातों के बाद, यूसुफ के पड़ोस में एक शिशु बीमार था और मर गया। उसकी माँ बहुत रोई।


    जब यीशु ने सुना कि वहाँ बहुत शोक और हलचल मची है, तो वह तुरंत दौड़ पड़ा। उसने बच्चे को मरा हुआ पाया, उसकी छाती को छुआ और कहा, “शिशु, मैं तुमसे कहता हूँ, मत मरो, बल्कि जीवित रहो और अपनी माँ के साथ रहो।”


    शिशु ने तुरंत आँखें उठाकर देखा और हँस पड़ा। यीशु ने उसकी माँ से कहा, “अपने बच्चे को लीजिए, उसे दूध पिलाइए और मुझे याद रखिए।”


    (2) वहाँ खड़ी भीड़ अचंभित हो गई और कहने लगी, “सच तो यह है कि यह बालक कोई देवता या स्वर्गदूत है, क्योंकि इसका हर वचन कार्य बन जाता है!”[a]


    फिर यीशु वहाँ से चला गया और बच्चों के साथ खेलने लगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह भीड़ का कथन है, वर्णनकर्ता की ओर से यीशु के स्वरूप की औपचारिक घोषणा नहीं। उपलब्ध अंग्रेज़ी साक्ष्य में ‘कोई देवता या स्वर्गदूत’ अनिश्चित और वैकल्पिक रूप में है।
    reason: कथन की वक्ता-स्थिति और धार्मिक अनिश्चितता स्पष्ट रहती है, क्योंकि प्रत्यक्ष यूनानी पाठ की समीक्षा अभी लंबित है।
lexical_decisions:
- source_word: baby
  choice: शिशु / बच्चा
  rationale: प्रत्यक्ष संबोधन में ‘शिशु’ मूल की आयु-सूचना को बनाए रखता है; वर्णन और मातृ-संबंधित वाक्यों में ‘बच्चा’ अधिक स्वाभाविक आधुनिक हिन्दी है।
- source_word: great grief and commotion
  choice: बहुत शोक और हलचल
  rationale: दोनों अलग भावों—गहरा दुःख और आसपास की व्याकुल गतिविधि—को बिना मिलाए व्यक्त करता है।
- source_word: touched his chest
  choice: उसकी छाती को छुआ
  rationale: शारीरिक क्रिया को सरल और औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: looked up
  choice: आँखें उठाकर देखा
  rationale: ‘ऊपर देखा’ की संभावित स्थानिक अस्पष्टता से बचते हुए अंग्रेज़ी साक्ष्य की क्रिया का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: becomes a deed
  choice: कार्य बन जाता है
  rationale: वचन के प्रभावी घटना या कर्म में परिणत होने की असामान्य किन्तु अर्थपूर्ण अभिव्यक्ति को संरक्षित करता है।
theological_decisions:
- issue: भीड़ द्वारा यीशु को ‘a god or an angel’ कहना
  choice: कोई देवता या स्वर्गदूत
  alternative: परमेश्वर या स्वर्गदूत
  rationale: अनिश्चित पद और भीड़ के अनुमानात्मक कथन को बनाए रखा गया है; ‘परमेश्वर’ कहने से कथन अधिक निश्चित और सिद्धान्तगत हो जाता।
- issue: मृत शिशु को संबोधित आज्ञा
  choice: मत मर; जीवित रह
  alternative: मर मत, बल्कि जी और अपनी माँ के पास रह
  rationale: साक्ष्य के विरोधात्मक तनाव—न मरना, बल्कि जीवित रहना—को संक्षिप्त और गरिमापूर्ण हिन्दी में रखा गया है।
- issue: ‘remember me’ का आशय
  choice: मुझे याद रखना
  alternative: मेरा स्मरण करना
  rationale: मूल कथन की अस्पष्टता को बनाए रखा गया है; इसे कृतज्ञता, उपासना या साक्षी देने जैसे किसी एक धार्मिक अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण कथात्मक शैली। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी पांडुलिपि-परीक्षण लंबित होने के कारण शब्दगत निष्कर्ष सावधानीपूर्वक और अस्थायी हैं।
