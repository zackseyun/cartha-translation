  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: hi
  text: '(1) कुछ दिनों के बाद एक और शिक्षक ने यीशु के पिता यूसुफ से फिर कहा, “आओ, भाई, इसे पाठशाला में मेरे पास भेज दो, ताकि मैं प्यार से समझा-बुझाकर इसे अक्षर सिखा सकूँ।”


    यूसुफ ने उससे कहा, “यदि तुममें साहस है, भाई, तो इसे कुशल-मंगल के साथ ले जाओ।”[a]


    शिक्षक बहुत डर और चिंता के साथ बालक का हाथ पकड़कर उसे ले गया। बालक खुशी से गया।


    (2) पाठशाला में प्रवेश करके यीशु ने पाठ रखने की चौकी पर एक पुस्तक पड़ी देखी। उसने उसे उठा लिया, पर उसमें लिखी बातें नहीं पढ़ीं, क्योंकि वे परमेश्वर की व्यवस्था से नहीं थीं। इसके बजाय उसने अपना मुँह खोला और ऐसे प्रभावशाली वचन कहे कि सामने बैठा शिक्षक बड़े आनंद से उसकी बातें सुनता रहा और उसे और बोलने के लिए प्रोत्साहित करने लगा। वहाँ खड़ी भीड़ उसके पवित्र वचनों पर चकित थी।


    (3) यूसुफ तुरंत पाठशाला की ओर दौड़ा, क्योंकि उसे आशंका थी कि यह शिक्षक भी अब अनुभवहीन नहीं रहा और उसने कष्ट उठाया है।[b] पर शिक्षक ने यूसुफ से कहा, “भाई, तुम यह जान लो कि मैंने तुम्हारे बालक को शिष्य के रूप में अवश्य लिया था, पर वह अनुग्रह और बुद्धि से परिपूर्ण है। इसलिए, भाई, इसे कुशल-मंगल के साथ अपने घर ले जाओ।”[a]


    (4) यीशु ने शिक्षक से कहा, “क्योंकि तुमने ठीक कहा और ठीक गवाही दी है, इसलिए जो गिराया गया था, वह भी तुम्हारे कारण बचाया जाएगा।”[c] उसी क्षण वह शिक्षक भी बच गया। तब यूसुफ बालक को लेकर अपने घर चला गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कुशल-मंगल के साथ” मूल गवाह की एक असामान्य अभिव्यक्ति का अनुवाद है; इसका आशय “सकुशल” भी हो सकता है।
    reason: अटपटी स्रोत-अभिव्यक्ति और उसकी अर्थगत अनिश्चितता बताने के लिए।
  - marker: b
    text: इस वाक्य का पाठ और अर्थ कठिन है। सम्भवतः यूसुफ को पिछले शिक्षकों की तरह इस शिक्षक के भी कष्ट पाने की आशंका थी।
    reason: ‘अब अनुभवहीन नहीं रहा और उसने कष्ट उठाया है’ की अस्पष्टता को बिना चुपचाप सुधारने के चिह्नित करने के लिए।
  - marker: c
    text: “जो गिराया गया था” किसकी ओर संकेत करता है, यह यहाँ स्पष्ट नहीं है। “बचाया जाएगा” का अर्थ बहाल किया जाना, चंगा होना या उद्धार पाना हो सकता है।
    reason: सन्दर्भगत और धर्मवैचारिक बहुअर्थकता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: with flattery
  choice: प्यार से समझा-बुझाकर
  rationale: शाब्दिक ‘चापलूसी से’ आधुनिक हिन्दी में छलपूर्ण अर्थ देता है; यहाँ शिक्षक की कोमल मनुहार द्वारा पढ़ाने की मंशा अधिक स्वाभाविक रूप में व्यक्त की गई है।
- source_word: letters
  choice: अक्षर
  rationale: प्रारम्भिक पढ़ाई और वर्ण-ज्ञान दोनों की सम्भावना बनाए रखता है।
- source_word: with salvation
  choice: कुशल-मंगल के साथ
  rationale: असामान्य सूत्र को पूर्णतः सामान्यीकृत किए बिना सुरक्षित और सकुशल ले जाने का भाव देता है; पुनरावृत्ति दोनों स्थानों पर सुरक्षित रखी गई है।
- source_word: God’s law
  choice: परमेश्वर की व्यवस्था
  rationale: धार्मिक ‘व्यवस्था’ का अर्थ बनाए रखता है और इसे केवल सामान्य कानून नहीं बनाता।
- source_word: holy words
  choice: पवित्र वचन
  rationale: उच्च धार्मिक शैली और कथानक में वचनों की पवित्रता दोनों बनाए रखता है।
- source_word: the one struck down
  choice: जो गिराया गया था
  rationale: निष्क्रिय और अस्पष्ट अभिव्यक्ति को बनाए रखा गया है; व्यक्ति की पहचान या घटना को अनुमान से स्पष्ट नहीं किया गया।
- source_word: was saved
  choice: बच गया
  rationale: मूल की सम्भावित शारीरिक पुनर्स्थापना और धार्मिक उद्धार के बीच तनाव को हिन्दी में खुला रखता है।
theological_decisions:
- issue: ‘saved’ का अर्थ
  choice: बच गया / बचाया जाएगा
  alternative: चंगा हो गया / उद्धार पाया
  rationale: कथा में इसका संकेत शारीरिक बहाली की ओर हो सकता है, पर उद्धार का धार्मिक अर्थ भी सम्भव है; ‘बचना’ दोनों को खुला रखता है।
- issue: ‘the one struck down’ की पहचान
  choice: जो गिराया गया था
  alternative: जिसे यीशु ने गिराया था / मरा हुआ व्यक्ति
  rationale: उपलब्ध साक्ष्य व्यक्ति या दशा को स्पष्ट नहीं करता; कथात्मक सम्बन्ध को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- issue: पुस्तक और परमेश्वर की व्यवस्था का सम्बन्ध
  choice: ‘उसमें लिखी बातें…परमेश्वर की व्यवस्था से नहीं थीं’
  alternative: ‘वह पुस्तक व्यवस्था की पुस्तक नहीं थी’
  rationale: प्राप्त गवाह की वाक्य-रचना का अनुसरण करते हुए यह निर्णय नहीं किया गया कि पुस्तक का प्रकार क्या था।
