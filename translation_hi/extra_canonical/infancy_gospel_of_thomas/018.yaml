base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: hi
  text: '(1) कुछ समय बाद, एक भवन बनाया जा रहा था। वहाँ बड़ा कोलाहल मचा, और यीशु उठकर वहाँ गया।


    एक मनुष्य को मरा हुआ पड़ा देखकर यीशु ने उसका हाथ पकड़ा और कहा, “हे मनुष्य, मैं तुझसे कहता हूँ, उठ और अपना काम कर।” वह मनुष्य तुरंत उठ खड़ा हुआ और उसने यीशु की आराधना की।


    (2) यह देखकर भीड़ चकित रह गई और कहने लगी, “यह बालक स्वर्ग से आया है, क्योंकि इसने बहुत-से प्राणों को मृत्यु से बचाया है, और यह अपने जीवन के सभी दिनों में बचाता रहेगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद यूनानी पांडुलिपि-परंपरा के एक सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; मूल यूनानी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: दिए गए स्रोत की सीमा और पाठ-समीक्षा की वर्तमान स्थिति को पारदर्शी बनाना आवश्यक है।
lexical_decisions:
- source_word: building
  choice: भवन
  rationale: निर्माणाधीन संरचना के लिए स्वाभाविक और व्यापक आधुनिक हिन्दी शब्द।
- source_word: great commotion
  choice: बड़ा कोलाहल मचा
  rationale: घटनास्थल पर उठी तीव्र हलचल और शोर, दोनों का भाव व्यक्त करता है।
- source_word: seized/took his hand
  choice: उसका हाथ पकड़ा
  rationale: हिन्दी में स्वाभाविक है और अंग्रेज़ी साक्ष्य के क्रियात्मक बल को पर्याप्त रूप से बनाए रखता है।
- source_word: worshipped
  choice: आराधना की
  rationale: धार्मिक श्रद्धा या उपासना का प्रबल अर्थ सुरक्षित रखता है; इसे केवल सम्मान या प्रणाम मानकर हल्का नहीं किया गया।
- source_word: souls
  choice: प्राणों
  rationale: यहाँ मृत्यु से बचाए जाने वाले जीवित व्यक्तियों/जीवनों के अर्थ में स्वाभाविक है और ‘आत्माओं’ से उत्पन्न संभावित अमूर्त या परलोकगत अर्थ से बचाता है।
- source_word: save
  choice: बचाया / बचाता रहेगा
  rationale: मृत्यु से उद्धार या प्राणरक्षा के निकट संदर्भ को स्पष्ट रखता है, जबकि कथन की व्यापक प्रतिध्वनि को बंद नहीं करता।
theological_decisions:
- issue: बालक की स्वर्गीय उत्पत्ति का कथन
  choice: “यह बालक स्वर्ग से आया है”
  alternative: “यह बालक स्वर्ग का है”
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के ‘is from heaven’ को सीधा रखता है और कथन को किसी विकसित सिद्धान्तगत सूत्र में नहीं बदलता।
- issue: आराधना का पात्र
  choice: “उसने यीशु की आराधना की”
  alternative: “उसने उसकी आराधना की”
  rationale: हिन्दी में सर्वनाम-संदेह दूर करने के लिए नाम दोहराया गया है; क्रिया का धार्मिक बल सुरक्षित है।
- issue: बहुत-से प्राणों को मृत्यु से बचाना
  choice: भीड़ के दावे को बिना व्याख्यात्मक सीमांकन के रखा गया
  alternative: इसे केवल शारीरिक पुनर्जीवन या आत्मिक उद्धार के रूप में स्पष्ट करना
  rationale: पाठ में शारीरिक मृत्यु का तत्काल संदर्भ है, पर कथन व्यापक भी सुनाई देता है; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। कथा में संक्षिप्त वाक्य और प्रत्यक्ष संवाद रखा गया है। ‘तुझसे’ संवाद की प्राचीन-धार्मिक गरिमा बनाए रखता है, जबकि शेष भाषा वर्तमान और स्वाभाविक है।
