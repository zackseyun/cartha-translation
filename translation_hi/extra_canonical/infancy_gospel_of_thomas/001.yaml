lexical_decisions:
- source_word: Thomas the Israelite
  choice: इस्राएली थोमा
  rationale: नाम और सामुदायिक पहचान दोनों को सीधे और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: Gentile brothers (and sisters)
  choice: गैर-यहूदी समुदायों के सभी भाइयों और बहनों
  rationale: ‘Gentile’ का अर्थ यहूदी जाति/समुदाय से बाहर के लोगों से है; ‘भाइयों और बहनों’ द्वारा साक्षी में स्पष्ट समावेशी भाव सुरक्षित रखा गया है।
- source_word: our Lord Jesus Christ
  choice: हमारे प्रभु यीशु मसीह
  rationale: प्रचलित और गरिमापूर्ण हिन्दी मसीही पदावली, बिना अतिरिक्त व्याख्या के।
- source_word: village of Nazareth
  choice: नासरत गाँव
  rationale: स्थान और उसके ग्रामीण स्वरूप दोनों को स्पष्ट रखा गया है।
- source_word: our region of Bethlehem
  choice: हमारे बेतलेहेम प्रदेश
  rationale: ‘region’ को ‘प्रदेश’ से व्यक्त किया गया है; इससे पाठ का असामान्य भौगोलिक कथन बदले बिना बना रहता है।
- source_word: This is the beginning
  choice: आरम्भ इस प्रकार है
  rationale: आगामी कथा की भूमिका के रूप में स्वाभाविक हिन्दी अभिव्यक्ति।
theological_decisions:
- issue: ‘Gentile brothers (and sisters)’ में संबोधित समूह की पहचान
  choice: गैर-यहूदी समुदायों के सभी भाइयों और बहनों
  alternative: अन्यजाति भाइयों और बहनों
  rationale: ‘गैर-यहूदी’ सामान्य आधुनिक पाठक के लिए अधिक स्पष्ट है और किसी विशिष्ट धार्मिक पारिभाषिक अर्थ को अनावश्यक रूप से नहीं थोपता।
- issue: बेतलेहेम और नासरत से संबंधित वाक्य-विन्यास
  choice: नासरत में किए कामों को बेतलेहेम प्रदेश में जन्म के बाद की घटनाएँ बताया गया
  alternative: वाक्य को भौगोलिक कठिनाई दूर करने हेतु पुनर्गठित करना
  rationale: साक्षी में उपस्थित संभावित भौगोलिक तनाव को संशोधन द्वारा हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण प्रस्तावना। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण यह अनुवाद अस्थायी और स्रोत-समीक्षा के अधीन है।
