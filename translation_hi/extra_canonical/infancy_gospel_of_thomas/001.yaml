  text: 'मैं, इस्राएली थोमा, ने यह आवश्यक समझा कि गैर-यहूदी समुदायों के सभी भाइयों और बहनों को वे सब काम बताऊँ जो हमारे प्रभु यीशु मसीह ने नासरत गाँव में किए—हमारे बेतलेहेम प्रदेश में उनके जन्म लेने के बाद। आरम्भ इस प्रकार है:'
