translation:
  language: hi
  text: '## अध्याय 16: यीशु ने साँप के काटे याकूब को चंगा किया


    **(1)** याकूब उपवन में लकड़ियाँ इकट्ठी करके बाँधने गया, ताकि वे रोटी बना सकें। यीशु भी उसके साथ गया। जब वे लकड़ियाँ इकट्ठी कर रहे थे, तब एक भयानक साँप ने याकूब के हाथ पर काट लिया।


    **(2)** याकूब भूमि पर पड़ा था और मरने पर था। बालक यीशु दौड़कर उसके पास गया और काटे हुए स्थान पर फूँक मारी। उसी क्षण वह घाव ठीक हो गया, वह जीव नष्ट हो गया, और याकूब बच गया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हागियोस साबा 259 पांडुलिपि में अध्याय 17 और 18 नहीं हैं। इसलिए वे दोनों अध्याय बाद की यूनानी पांडुलिपियों पर आधारित हैं। इस अध्याय का प्रत्यक्ष यूनानी स्रोत-पाठ परीक्षण अभी लंबित है; वर्तमान अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर तैयार किया गया है।
    reason: पांडुलिपि-परंपरा और वर्तमान अनुवाद के अस्थायी स्रोताधार को पाठक के सामने पारदर्शी रखना।
lexical_decisions:
- source_word: James
  choice: याकूब
  rationale: यह यूनानी नाम Ἰάκωβος का प्रचलित हिन्दी बाइबिलीय रूप है और पात्र की पहचान को स्पष्ट रखता है।
- source_word: grove
  choice: उपवन
  rationale: यह पेड़ों वाले स्थान का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; उपलब्ध अंग्रेज़ी साक्ष्य से अधिक विशिष्ट भू-दृश्य निर्धारित नहीं किया गया।
- source_word: tie up sticks
  choice: लकड़ियाँ इकट्ठी करके बाँधने
  rationale: वाक्य में लकड़ियों को बटोरने और गट्ठर के रूप में बाँधने, दोनों भाव सुरक्षित रखे गए हैं।
- source_word: make bread
  choice: रोटी बना सकें
  rationale: साक्ष्य की सीधी अभिव्यक्ति रखी गई है; लकड़ियों का उपयोग आग जलाकर रोटी पकाने के लिए था—यह अर्थ सम्भावित है, पर उसे मुख्य पाठ में स्पष्ट जोड़कर मूल से अधिक नहीं कहा गया।
- source_word: terrible snake
  choice: भयानक साँप
  rationale: खतरे और भयावहता, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: blew on the bite
  choice: काटे हुए स्थान पर फूँक मारी
  rationale: क्रिया और उसके लक्ष्य को ठोस रूप में रखा गया है, बिना किसी अतिरिक्त अनुष्ठानिक या चिकित्सकीय अर्थ के।
- source_word: the beast was destroyed
  choice: वह जीव नष्ट हो गया
  rationale: ‘beast’ को उसके निकटवर्ती संदर्भ से जोड़ा गया, पर ‘साँप मर गया’ कहकर अंग्रेज़ी साक्ष्य के ‘destroyed’ को अनावश्यक रूप से संकुचित नहीं किया गया।
- source_word: was saved
  choice: बच गया
  rationale: यहाँ प्रसंग आसन्न शारीरिक मृत्यु से बचने का है; ‘उद्धार पाया’ अनावश्यक धार्मिक विशिष्टता ला सकता था।
theological_decisions:
- issue: यीशु की चंगाई की क्रिया का स्वरूप
  choice: यीशु की फूँक के तुरंत बाद घाव ठीक होने का क्रम जस का तस रखा गया।
  alternative: इसे प्रार्थना, जादुई क्रिया, या किसी विशेष संस्कार के रूप में समझाना।
  rationale: उपलब्ध साक्ष्य केवल क्रिया और तत्काल परिणाम बताता है; उसकी धार्मिक या क्रियात्मक व्याख्या जोड़ना पाठ की सीमा से बाहर होगा।
- issue: ‘याकूब बच गया’ का अर्थ
  choice: शारीरिक संकट से बचने वाली सामान्य अभिव्यक्ति चुनी गई।
  alternative: ‘याकूब ने उद्धार पाया।’
  rationale: प्रसंग साँप के काटने से मृत्यु के खतरे का है; व्यापक मोक्ष-सिद्धान्त का संकेत मूल साक्ष्य में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। छोटे और सीधे वाक्य बाल्यकालीन आख्यान की गति बनाए रखते हैं। ‘बालक यीशु’, ‘याकूब’, और ‘उसी क्षण’ जैसे रूप सामान्य पाठक के लिए स्पष्ट हैं, जबकि किसी संप्रदायगत व्याख्या से बचा गया है।
