base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: hi
  text: '(1) बोआई के समय यूसुफ ने बीज बोया, और बालक यीशु ने एक माप गेहूँ बोया।


    (2) उसके पिता ने सौ बड़े माप फसल काटी। उसने गरीबों और अनाथों को उदारता से दिया। परन्तु यूसुफ ने यीशु के बीज में से लिया था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम वाक्य का शाब्दिक आशय अस्पष्ट है। इसका अर्थ यह भी हो सकता है कि यूसुफ ने यीशु के बोए हुए बीज से उत्पन्न फसल में से लिया। उपलब्ध पाठ अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: अंग्रेज़ी साक्ष्य की असामान्य अभिव्यक्ति और लंबित यूनानी समीक्षा के कारण पाठ की वास्तविक अस्पष्टता बताना आवश्यक है।
lexical_decisions:
- source_word: one measure of wheat
  choice: एक माप गेहूँ
  rationale: प्राचीन माप की अनिश्चित इकाई को किसी आधुनिक निश्चित परिमाण में बदले बिना सामान्य और सुबोध रूप में रखा गया है।
- source_word: a hundred great measures
  choice: सौ बड़े माप
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में आए परिमाण और ‘बड़े’ के बल को बनाए रखा गया है; मूल यूनानी की समीक्षा लंबित होने के कारण किसी विशिष्ट माप-इकाई का अनुमान नहीं लगाया गया।
- source_word: graciously
  choice: उदारता से
  rationale: दान देने के ढंग को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना कोई अतिरिक्त धार्मिक अर्थ जोड़े।
- source_word: the child Jesus
  choice: बालक यीशु
  rationale: चरित्र की बाल्यावस्था और नाम—दोनों को संक्षिप्त, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘his father’ के लिए संबंधसूचक भाषा
  choice: उसके पिता
  alternative: यूसुफ
  rationale: साक्ष्य में आए संबंधसूचक कथन को बनाए रखा गया है और उसे किसी बाद की धर्मवैचारिक व्याख्या से न तो बदला गया है, न स्पष्ट किया गया है।
- issue: अंतिम वाक्य में यीशु के बीज और फसल का संबंध
  choice: परन्तु यूसुफ ने यीशु के बीज में से लिया था
  alternative: यूसुफ को यह सारी उपज यीशु के बोए बीज से मिली थी
  rationale: वैकल्पिक रूप कारण और सम्पूर्ण उपज के स्रोत को आवश्यकता से अधिक स्पष्ट कर देता। उपलब्ध साक्ष्य की असामान्य और संभवतः अर्थगत रूप से खुली अभिव्यक्ति को यथासंभव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल कथात्मक शैली और गरिमापूर्ण शब्दावली अपनाई गई है। ‘बोआई’, ‘फसल काटी’ और ‘उदारता से दिया’ सामान्य पाठकों के लिए सहज हैं। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
