  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/019.yaml
  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, according to custom. But as they were returning, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) Assuming that he was with the traveling company, they went a day’s journey and looked for him among their relatives whom they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple, sitting among the teachers, listening to them and questioning them. Those who heard him were amazed at how he questioned the elders and explained the main points of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, what have you done to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and the Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “Blessed are you, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom of praise and glory of virtue.”


    (5) Jesus got up and followed his mother from there, and he was obedient to his parents. She treasured all these things, pondering them in her heart.


    Jesus advanced in wisdom, maturity, and grace before God and humans. To whom be the [glory …].'
translation:
  language: hi
  text: '(1) जब यीशु बारह वर्ष का था, तब उसके माता-पिता प्रथा के अनुसार फसह के पर्व के लिए यरूशलेम गए। पर जब वे लौट रहे थे, तो यीशु यरूशलेम में ही रह गया, और उसके माता-पिता को इसका पता नहीं था।


    (2) यह समझकर कि वह यात्रियों के दल में होगा, वे एक दिन की यात्रा करके अपने परिचित संबंधियों के बीच उसे ढूँढ़ने लगे। जब वह नहीं मिला, तो वे उसे खोजते हुए यरूशलेम लौट आए।


    तीन दिन बाद उन्होंने उसे मंदिर में शिक्षकों के बीच बैठे, उनकी बातें सुनते और उनसे प्रश्न करते पाया। उसकी बातें सुननेवाले इस बात पर चकित थे कि वह किस प्रकार बुज़ुर्गों से प्रश्न करता और व्यवस्था की मुख्य बातों तथा भविष्यद्वक्ताओं की पहेलियों और दृष्टांतों का अर्थ समझाता था।


    (3) उसकी माता ने उससे कहा, “बेटे, तुमने हमारे साथ ऐसा क्यों किया? देखो, तुम्हें ढूँढ़ते-ढूँढ़ते हम पीड़ा और शोक में थे।”


    यीशु ने कहा, “आप मुझे क्यों ढूँढ़ रहे थे? क्या आप नहीं जानते थे कि मेरा अपने पिता के स्थान में होना आवश्यक है?”[a]


    (4) शास्त्रियों और फरीसियों ने मरियम से पूछा, “क्या तुम इस बालक की माता हो?”


    उसने कहा, “हाँ, मैं हूँ।”


    उन्होंने उससे कहा, “तुम धन्य हो, क्योंकि प्रभु परमेश्वर ने तुम्हारे गर्भ के फल को आशीष दी है। ऐसी प्रशंसा की बुद्धि और सद्गुण की महिमा हमने कभी नहीं देखी।”[b]


    (5) यीशु उठा और वहाँ से अपनी माता के पीछे चला गया, और अपने माता-पिता का आज्ञाकारी रहा। उसकी माता ने इन सभी बातों को अपने हृदय में सँजोकर उन पर मनन किया।


    यीशु बुद्धि, परिपक्वता और अनुग्रह में परमेश्वर और मनुष्यों के सामने बढ़ता गया। जिसकी [महिमा …] हो।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने पिता के स्थान में” का अर्थ “अपने पिता के घर में” भी समझा जा सकता है; उपलब्ध साक्ष्य में अभिव्यक्ति की अस्पष्टता बनी हुई है।
    reason: स्थान, घर और कार्य से जुड़ी संभावित व्याख्याओं में किसी एक को चुपचाप निर्णायक बनाने से बचना।
  - marker: b
    text: “प्रशंसा की बुद्धि और सद्गुण की महिमा” उपलब्ध साक्ष्य में असामान्य और कुछ अस्पष्ट अभिव्यक्ति है।
    reason: कठिन वाक्यांश को अपेक्षाकृत निकट हिन्दी में रखते हुए उसकी पाठगत असामान्यता बताना।
  - marker: c
    text: अंतिम शब्द कोष्ठकों और त्रिबिंदु में इसलिए हैं कि उपलब्ध पाठ यहाँ अपूर्ण या पुनर्स्थापित प्रतीत होता है।
    reason: पांडुलिपि-संबंधी अनिश्चितता के संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: Passover
  choice: फसह
  rationale: यह हिन्दी बाइबलीय प्रयोग में प्रचलित और सामान्य पाठकों के लिए पहचाना जानेवाला नाम है।
- source_word: traveling company
  choice: यात्रियों का दल
  rationale: सामूहिक यात्रा के आशय को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक तकनीकी शब्द के।
- source_word: law
  choice: व्यवस्था
  rationale: संदर्भ में मूसा की व्यवस्था का पारंपरिक बाइबलीय अर्थ बनाए रखता है।
- source_word: riddles and parables
  choice: पहेलियाँ और दृष्टांत
  rationale: दो भिन्न साहित्यिक रूपों को अलग-अलग रखते हुए स्रोत-साक्ष्य की सूची संरक्षित करता है।
- source_word: in the place of my Father
  choice: अपने पिता के स्थान में
  rationale: ‘स्थान’ की अस्पष्टता को बनाए रखा गया है; इसे केवल ‘मंदिर’ या ‘काम’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: maturity
  choice: परिपक्वता
  rationale: स्रोत-साक्ष्य के व्यापक विकास-संबंधी अर्थ को बनाए रखता है; इसे केवल शारीरिक ‘कद’ नहीं बनाया गया।
- source_word: grace
  choice: अनुग्रह
  rationale: ईश्वरीय कृपा और अनुकूलता के धार्मिक अर्थ को सुरक्षित रखने वाला प्रचलित हिन्दी पद है।
theological_decisions:
- issue: यीशु का ‘मेरे पिता के स्थान’ में होना
  choice: मेरा अपने पिता के स्थान में होना आवश्यक है
  alternative: मुझे अपने पिता के घर में होना चाहिए / मुझे अपने पिता के काम में लगे रहना चाहिए
  rationale: दिए गए साक्ष्य में स्थान-संबंधी अभिव्यक्ति है। ‘घर’ या ‘काम’ चुनना अस्पष्टता को एक विशेष धर्मवैज्ञानिक अर्थ में तय कर देता।
- issue: यीशु का माता-पिता के प्रति संबंध
  choice: अपने माता-पिता के अधीन रहा
  alternative: अपने माता-पिता का आज्ञाकारी रहा
  rationale: ‘अधीन रहा’ संबंध और निरंतर व्यवहार दोनों को व्यक्त करता है तथा पुत्रत्व और आज्ञाकारिता के बीच पाठ का तनाव बनाए रखता है।
- issue: अंतिम स्तुतिवाक्य का कर्ता
  choice: उसी की [महिमा …] हो
  alternative: जिसकी [महिमा …] हो / [महिमा …] हो
  rationale: हिन्दी वाक्य को पठनीय बनाया गया है, पर कोष्ठक और त्रिबिंदु के द्वारा अपूर्ण या पुनर्स्थापित पाठ का संकेत सुरक्षित है; सर्वनाम का संदर्भ पाठ में स्वाभाविक रूप से यीशु की ओर जाता है, यद्यपि साक्ष्य अपूर्ण है।
