  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। कथा में स्वाभाविक वाक्य-प्रवाह रखा गया है और ‘फसह’, ‘व्यवस्था’, ‘दृष्टांत’, ‘अनुग्रह’ जैसे स्थापित धार्मिक पद बनाए गए हैं। मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है।
