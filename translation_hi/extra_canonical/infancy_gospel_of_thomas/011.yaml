    (2) But Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. And Mary saw what sign Jesus had done. She kissed him, saying, “Lord, my God, bless our child,” because they were afraid lest someone bewitch him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: hi
  text: '(1) बालक यीशु लगभग सात वर्ष का था। उसकी माता मरियम ने उसे पानी भर लाने के लिए भेजा। पर हौज़ के पास बहुत भीड़ थी, और घड़ा किसी की टक्कर लगने से टूट गया।


    (2) तब यीशु ने अपनी ओढ़ी हुई चादर फैलाई, उसमें पानी भरा और उसे अपनी माता के पास ले गया। मरियम ने यीशु का किया हुआ यह चिह्न देखा। उसने उसे चूमा और कहा, “हे प्रभु, मेरे परमेश्वर, हमारे बालक को आशीष दे,” क्योंकि उन्हें डर था कि कहीं कोई उस पर जादू न कर दे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर अस्थायी रूप से तैयार किया गया है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी बाकी है।
    reason: प्रस्तुत स्रोत-सामग्री स्वयं बताती है कि यूनानी मूल की समीक्षा लंबित है; इसलिए पाठगत निश्चितता की सीमा पाठक के सामने स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: water cistern
  choice: हौज़
  rationale: सार्वजनिक जल-संग्रह स्थान के लिए सरल और स्वाभाविक हिन्दी; केवल सामान्य कुएँ का अर्थ आरोपित नहीं करता।
- source_word: cloak
  choice: चादर
  rationale: पहने या ओढ़े हुए बाहरी वस्त्र का सामान्य, सहज बोध देता है और पानी थामने के चमत्कार को स्पष्ट रखता है।
- source_word: sign
  choice: चिह्न
  rationale: असाधारण कार्य के धार्मिक संकेतार्थ को बनाए रखता है; इसे केवल ‘चमत्कार’ कहकर व्याख्यात्मक रूप से सीमित नहीं करता।
- source_word: bewitch
  choice: जादू कर दे
  rationale: हानि पहुँचाने वाले जादुई प्रभाव के भय को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: was struck
  choice: किसी की टक्कर लगने से
  rationale: अंग्रेज़ी साक्ष्य के कर्मवाच्य को स्वाभाविक हिन्दी में रखा गया है, जबकि कर्ता की अनिश्चितता सुरक्षित है।
theological_decisions:
- issue: मरियम की प्रार्थना में ‘Lord, my God’ का संबोधन
  choice: “हे प्रभु, मेरे परमेश्वर, हमारे बालक को आशीष दे”
  alternative: इसे यीशु को संबोधित मानकर विराम-चिह्न या शब्दावली बदलना
  rationale: साक्ष्य में संबोधन और उसके लक्ष्य से जुड़ी संभावित अस्पष्टता को बिना सांप्रदायिक व्याख्या के यथासंभव बनाए रखा गया है।
- issue: असाधारण कार्य का वर्णन
  choice: चिह्न
  alternative: चमत्कार
  rationale: ‘चिह्न’ मूल धार्मिक-साहित्यिक तनाव को बनाए रखता है और घटना की व्याख्या पहले से तय नहीं करता।
- issue: जादू किए जाने का भय
  choice: कथानक के दावे के रूप में यथावत रखा
  alternative: इसे अंधविश्वास बताकर समझाना या नरम करना
  rationale: पाठ पात्रों के भय का वर्णन करता है; अनुवाद उसे अनुमोदित या खारिज नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। छोटे वाक्यों और सामान्य शब्दावली का प्रयोग किया गया है। ‘माता’, ‘प्रभु’, ‘परमेश्वर’, ‘आशीष’ और ‘चिह्न’ जैसे शब्द धार्मिक प्रसंग की गरिमा बनाए रखते हैं, जबकि भाषा साधारण पाठक के लिए बोधगम्य रहती है।
