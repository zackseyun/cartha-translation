review_pass:
  verdict: revise
  source_fidelity: The draft closely follows the supplied English witness and preserves the narrative sequence, the water-bearing sign, the plural fear of bewitchment, and the ambiguity of Mary's invocation. However, “किसी की टक्कर लगने से” adds a specific cause and agent not stated by “was struck.”
  naturalness: The Hindi is generally clear, modern, and appropriately dignified. “घड़े पर चोट लगी और वह टूट गया” is more natural while retaining the source's unspecified agency. “जो चादर उसने ओढ़ रखी थी” is also slightly more idiomatic than “अपनी ओढ़ी हुई चादर.”
  terminology: “हौज़,” “चादर,” “चिह्न,” “परमेश्वर,” and “आशीष” fit the register and preserve the intended sense. “जादू न कर दे” is a natural rendering of “bewitch,” without either endorsing or dismissing the characters' fear.
  issues:
  - severity: medium
    issue: An unwarranted cause is supplied for the broken pitcher.
    rationale: “किसी की टक्कर लगने से” specifies that a person collided with the pitcher. The supplied witness only says that it “was struck and broke,” leaving both the agent and exact mechanism unstated.
