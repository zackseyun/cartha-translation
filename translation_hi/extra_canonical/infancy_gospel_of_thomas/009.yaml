  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वाक्य छोटे और मौखिक पठन के अनुकूल रखे गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और ऑडिटेड अंग्रेज़ी POB पर आधारित अस्थायी अनुवाद है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी आवश्यक है।
