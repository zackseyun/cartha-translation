  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/009.yaml
  text: '(1) Again, after many days, Jesus was playing with other children on a certain roof of an upstairs room. One of the children fell and died. When the other children saw this, they went into their houses and left Jesus alone.


    (2) The parents of the child who had died came and accused Jesus, saying, “You pushed our child down!”


    But Jesus said, “I didn’t push him down.”


    (3) They were raging and shouting. Jesus came down from the roof, stood beside the body, and cried out in a loud voice, saying, “Zeno, Zeno”—because this was his name—“rise and say whether I pushed you down.”


    He rose and said, “No, sir.”


    When they saw this, they were amazed.


    Again Jesus said to him, “Fall asleep!”


    The child’s parents praised God and worshiped the child Jesus.'
translation:
  language: hi
  text: '(1) फिर, बहुत दिनों के बाद, यीशु कुछ और बच्चों के साथ एक ऊपरी कमरे की छत पर खेल रहा था। तभी बच्चों में से एक नीचे गिर पड़ा और मर गया। यह देखकर बाकी बच्चे अपने-अपने घर चले गए और यीशु को अकेला छोड़ गए।


    (2) तब मरे हुए बच्चे के माता-पिता आए और यीशु पर आरोप लगाते हुए बोले, “तुमने हमारे बच्चे को नीचे धक्का दिया!”


    पर यीशु ने कहा, “मैंने उसे नीचे नहीं धकेला।”


    (3) वे क्रोध से भरे हुए चिल्ला रहे थे। यीशु छत से नीचे उतरा, शव के पास खड़ा हुआ और ऊँची आवाज़ में पुकारकर बोला, “ज़ेनो, ज़ेनो”—क्योंकि उसका यही नाम था—“उठो और बताओ कि क्या मैंने तुम्हें नीचे धकेला था।”


    वह उठ बैठा और बोला, “नहीं, स्वामी।”[a]


    यह देखकर वे चकित रह गए।


    फिर यीशु ने उससे कहा, “सो जाओ!”[b]


    तब बच्चे के माता-पिता ने परमेश्वर की स्तुति की और बालक यीशु को दण्डवत किया।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्वामी” का अनुवाद आदरपूर्ण संबोधन के रूप में किया गया है; यूनानी पाठ की प्रत्यक्ष समीक्षा के बाद “प्रभु” या कोई अन्य रूप भी संभव हो सकता है।
    reason: उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है और स्रोत-भाषा समीक्षा लंबित है।
  - marker: b
    text: “सो जाओ” यहाँ फिर से मृत्यु में लौटने का संकेत देता प्रतीत होता है, पर पाठ स्वयं मृत्यु का सीधा शब्द नहीं कहता।
    reason: रूपक की वास्तविक अस्पष्टता को स्पष्ट करना, बिना मुख्य पाठ में उसका अर्थ निश्चित किए।
  - marker: c
    text: “दण्डवत किया” के पीछे ऐसी क्रिया हो सकती है जिसका अर्थ प्रणाम करना या उपासना करना—दोनों हो सकता है; यूनानी स्रोत की समीक्षा लंबित है।
    reason: धर्मवैचारिक तनाव और स्रोतगत अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: roof of an upstairs room
  choice: एक ऊपरी कमरे की छत
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की स्थान-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए छत और ऊपरी कमरे—दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: body
  choice: शव
  rationale: कथा में बच्चे की मृत्यु स्पष्ट रूप से कही गई है; इसलिए 'शरीर' की तुलना में 'शव' प्रसंग को अधिक ठीक और संक्षेप में व्यक्त करता है।
- source_word: sir
  choice: स्वामी
  rationale: संबोधन आदरपूर्ण है, पर उपलब्ध अंग्रेज़ी साक्ष्य से कोई विशिष्ट ईश्वरीय उपाधि निश्चित नहीं होती। 'स्वामी' आदर और संभावित व्यापक अर्थ—दोनों को बनाए रखता है।
- source_word: Fall asleep
  choice: सो जाओ
  rationale: मृत्यु के लिए प्रयुक्त रूपक को सीधे 'मर जाओ' बनाकर उसकी साहित्यिक और धार्मिक अस्पष्टता समाप्त नहीं की गई।
- source_word: worshipped
  choice: दण्डवत किया
  rationale: यह शारीरिक प्रणाम और उपासना—दोनों अर्थों की संभावना को खुला रखता है और प्रसंग के धर्मवैचारिक तनाव को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: पुनर्जीवित बच्चे का यीशु के लिए संबोधन
  choice: स्वामी
  alternative: महोदय / प्रभु
  rationale: उपलब्ध आधार केवल अंग्रेज़ी साक्ष्य है और यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है। इसलिए ऐसा शब्द चुना गया जो सम्मान व्यक्त करे, पर संबोधन को निश्चित रूप से ईश्वरीय घोषणा न बना दे।
- issue: यीशु के अंतिम आदेश का मृत्यु से संबंध
  choice: “सो जाओ!”
  alternative: “फिर मर जाओ!”
  rationale: मूल साक्ष्य का रूपक जानबूझकर सुरक्षित रखा गया है; उसे स्पष्ट मृत्यु-वर्णन में बदलना पाठ की संभावित अर्थ-परत को मिटा देता।
- issue: बालक यीशु के प्रति माता-पिता की क्रिया
  choice: दण्डवत किया
  alternative: आराधना की
  rationale: '''दण्डवत किया'' से शारीरिक प्रणाम, श्रद्धा और संभव उपासना का तनाव बना रहता है; स्रोत-भाषा समीक्षा के बिना इसे संकीर्ण धर्मवैचारिक अर्थ में निश्चित करना उचित नहीं।'
