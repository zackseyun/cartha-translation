translation:
  language: hi
  text: '(1) जब शिक्षक ने यीशु को पहले अक्षर के विषय में ऐसी उत्तम समझ और ऐसी व्याख्या करते सुना, तो वह उसकी शिक्षा और उसके उत्तर से चकरा गया। शिक्षक ने कहा, “हाय मुझ पर! हाय मुझ पर! मैं चकरा गया हूँ और बड़ा दुखी हूँ। इस बालक को अपने हाथ में लेकर मैंने स्वयं को लज्जित किया है।


    (2) “भाई, इसे मेरे पास से ले जाओ, क्योंकि मैं न तो इसकी दृष्टि सह सकता हूँ, न इसके वचन की स्पष्टता। यह बालक सचमुच इस पृथ्वी का नहीं है। यह तो आग को भी वश में कर सकता है! शायद यह बालक संसार की सृष्टि से पहले से अस्तित्व में था। किस गर्भ ने इसे धारण किया? कैसी माँ ने इसे पाला? मैं नहीं जानता। हाय मुझ पर, भाई! यह मुझे स्तब्ध कर देता है। मेरी बुद्धि इसके साथ नहीं चल सकती। मुझसे अपने ही विषय में भारी भूल हुई—मैं तीन गुना अभागा हूँ! मैंने सोचा था कि मुझे एक शिष्य मिलेगा, पर अब पाया गया है कि मेरा ही एक शिक्षक है।


    (3) “मित्रो, मैं अपनी लज्जा के बारे में सोचता हूँ: मैं बूढ़ा होकर भी एक बालक से हार गया हूँ। इस बालक के कारण मुझे निकाल दिया जाना और मर जाना चाहिए, या इस गाँव से भाग जाना चाहिए। अब मैं सब लोगों के बीच मुँह दिखाने योग्य नहीं रहा, विशेषकर उनके सामने जिन्होंने देखा कि मैं एक बहुत छोटे बालक से हार गया। पर पहले अक्षर की रेखाओं के विषय में मैं किसी से क्या कहूँ या क्या बताऊँ? सच तो यह है, मित्रो, कि मैं नहीं जानता, क्योंकि मैं न आरंभ समझता हूँ, न अंत!


    (4) “इसलिए, भाई यूसुफ, इसे सकुशल अपने घर ले जाओ, क्योंकि यह बालक कोई महान सत्ता है—चाहे कोई देवता हो या स्वर्गदूत, या मैं इसे और जो कुछ भी कहूँ—मैं नहीं जानता।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है। यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है; विशेषकर पद 1 के “उत्तम समझ” और “पहले अक्षर की रेखाएँ” जैसे वाक्यांश पुनः जाँचे जाने चाहिए।
    reason: प्रदान किए गए स्रोत में स्पष्ट है कि यूनानी स्रोत-भाषा की समीक्षा लंबित है; पाठीय निश्चितता की सीमा पाठक को बताना आवश्यक है।
lexical_decisions:
- source_word: good familiarity
  choice: उत्तम समझ
  rationale: अंग्रेज़ी साक्ष्य की असहज अभिव्यक्ति को सहज हिन्दी में रखा गया है; आशय अक्षर के विषय में यीशु की गहरी परिचितता या समझ है। यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित है।
- source_word: lines of the first letter / first element
  choice: पहले अक्षर की रेखाएँ
  rationale: पिछले प्रसंग के वर्ण-अध्यापन और अक्षर की आकृति, रेखाओं या अंगों की चर्चा को बनाए रखता है; ‘तत्त्व’ कहने से अनचाहा दार्शनिक अर्थ आ सकता था।
- source_word: clarity of his word
  choice: इसके वचन की स्पष्टता
  rationale: कथन की साफ़गोई और प्रभाव दोनों को औपचारिक किंतु स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: tame fire
  choice: आग को भी वश में कर सकता है
  rationale: अलौकिक दावे की तीव्रता को बिना नरम किए सुरक्षित रखता है।
- source_word: a great thing
  choice: कोई महान सत्ता
  rationale: ‘महान वस्तु’ हिन्दी में अनुपयुक्त और अमानवीय सुनाई देती; ‘सत्ता’ असाधारण अस्तित्व का भाव देता है, जबकि आगे की अनिश्चित पहचान खुली रहती है।
- source_word: with salvation
  choice: सकुशल
  rationale: मुहावरे का स्वाभाविक प्रसंगगत अर्थ सुरक्षित करता है—बालक को सुरक्षित घर ले जाना—बिना यहाँ अतिरिक्त उद्धारशास्त्रीय अर्थ आरोपित किए।
theological_decisions:
- issue: बालक का सृष्टि से पहले अस्तित्व
  choice: “शायद ... सृष्टि से पहले से अस्तित्व में था” को शिक्षक की अटकल के रूप में रखा
  alternative: इसे यीशु के पूर्व-अस्तित्व की निश्चित कथनात्मक घोषणा बनाना
  rationale: मूल साक्ष्य में ‘perhaps’ अनिश्चितता दर्शाता है; कथावाचक नहीं, भयभीत शिक्षक अनुमान लगा रहा है।
- issue: “whether a god or an angel” में पहचान की अनिश्चितता
  choice: “चाहे कोई देवता हो या स्वर्गदूत ... मैं नहीं जानता”
  alternative: “परमेश्वर” लिखकर निश्चित ईश्वरीय पहचान देना
  rationale: अनिश्चित विकल्पों और वक्ता की अज्ञान-स्वीकृति को सुरक्षित रखा गया है; ‘a god’ का अनिश्चित रूप ‘कोई देवता’ से व्यक्त होता है।
- issue: “not of this earth” का स्वरूप
  choice: “इस पृथ्वी का नहीं है”
  alternative: इसे स्पष्ट रूप से स्वर्ग से आया हुआ कहना
  rationale: पाठ का अलौकिक संकेत बनाए रखते हुए उसकी अस्पष्टता से आगे नहीं बढ़ा गया।
