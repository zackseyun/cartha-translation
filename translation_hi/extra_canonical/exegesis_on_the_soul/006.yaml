base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/006.yaml
  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: hi
  text: 'इसी के अनुसार कवि के यहाँ लिखा है:


    ओडीसियस उस द्वीप पर दुख सहता और शोक करता बैठा था,

    और कैलिप्सो की बातों और उसके मोहक आकर्षणों से अपना मुँह फेरता था,

    इस लालसा में कि वह फिर अपना गाँव और वहाँ से उठता हुआ धुआँ देखे।

    और यदि उसे स्वर्ग से [सहायता न मिली होती],

    तो [वह अपने गाँव लौट नहीं सकता था]। (होमर, ओडिसी 1.48–1.59)[a]


    फिर [हेलेन भी] कहती है:


    मेरे भीतर मेरा मन बदल गया;

    [] मैं अपने घर लौटना चाहती हूँ। (होमर, ओडिसी 4.260–261)[b]


    क्योंकि उसने विलाप करते हुए कहा:


    अफ़्रोदिती ही थी जिसने मुझे बहकाया

    और मुझे मेरे गाँव से दूर ले गई।

    मैंने अपनी बेटी को छोड़ दिया,

    और अपने पति को भी, जो भला, बुद्धिमान और सुंदर है। (होमर, ओडिसी 4.261–4.264)


    क्योंकि जब आत्मा अफ़्रोदिती के विश्वासघात के कारण अपने सिद्ध पति को छोड़ देती है—उस अफ़्रोदिती के कारण, जो यहाँ जनन-क्रिया से अस्तित्व में आती है—तब आत्मा को हानि पहुँचती है। पर यदि वह विलाप करती और मन फिराती है, तो उसे उसके घर लौटा दिया जाएगा।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: होमर-संबंधी पंक्ति-संदर्भ उपलब्ध साक्ष्य में जिस रूप में दिए गए हैं, उसी रूप में रखे गए हैं।
    reason: उद्धरण-संदर्भों की स्वतंत्र मूल-भाषायी जाँच अभी लंबित है।
  - marker: b
    text: वर्ग कोष्ठक पाठ की क्षति या संपादकीय पूर्ति के संकेत हैं; खाली [] को जानबूझकर यथावत रखा गया है।
    reason: पांडुलिपीय अनिश्चितता और पुनर्स्थापन-संकेतों को पाठक के सामने सुरक्षित रखना।
  - marker: c
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; कॉप्टिक मूल से सीधी समीक्षा अभी लंबित है।
    reason: ड्राफ्ट के स्रोत-आधार और उसकी सीमा को पारदर्शी बनाना।
lexical_decisions:
- source_word: village
  choice: गाँव
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में बार-बार आए ठोस स्थान-सूचक अर्थ को सरल आधुनिक हिन्दी में सुरक्षित रखा गया है; इसे अनुमानतः ‘स्वदेश’ या ‘नगर’ नहीं बनाया गया।
- source_word: Heaven
  choice: स्वर्ग
  rationale: दैवी सहायता के ऊर्ध्वलोक-सूचक भाव को बनाए रखा गया है और किसी विशिष्ट देवता का नाम नहीं जोड़ा गया।
- source_word: charms
  choice: मोहक आकर्षण
  rationale: यह चुनाव कैलिप्सो के लुभावने प्रभाव को व्यक्त करता है, पर अनिवार्यतः जादुई ‘मंत्र’ का अर्थ आरोपित नहीं करता।
- source_word: perfect husband
  choice: सिद्ध पति
  rationale: ‘सिद्ध’ पूर्णता या परिपक्वता का भाव रखता है और पाठ के आध्यात्मिक रूपक की गरिमा बनाए रखता है।
- source_word: repents
  choice: मन फिराती है
  rationale: यह आधुनिक, सुबोध हिन्दी में दिशा-परिवर्तन और पश्चात्ताप दोनों का संकेत देता है, बिना किसी संप्रदायगत पारिभाषिकता के।
- source_word: act of begetting
  choice: जनन-क्रिया
  rationale: मूल साक्ष्य की दार्शनिक-जैविक अभिव्यक्ति को जानबूझकर स्पष्ट किए बिना संक्षिप्त रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: अफ़्रोदिती और जनन के बीच संबंध
  choice: ‘जो यहाँ जनन-क्रिया से अस्तित्व में आती है’ को सीधे बनाए रखा गया
  alternative: इसे कामवासना, देह या भौतिक संसार की स्पष्ट व्याख्या मान लेना
  rationale: वाक्य दार्शनिक और धर्मवैचारिक रूप से अस्पष्ट है; अनुवाद ने उसकी व्याख्या को किसी एक तंत्र में सीमित नहीं किया।
- issue: आत्मा की घर-वापसी
  choice: निष्क्रिय रूप ‘उसे उसके घर लौटा दिया जाएगा’
  alternative: ‘वह अपने आप घर लौटेगी’ या स्पष्टतः ‘परमेश्वर उसे लौटाएगा’
  rationale: उपलब्ध साक्ष्य कर्ता को व्यक्त नहीं करता; निष्क्रिय रूप दैवी कर्तृत्व की संभावना बचाता है, पर उसे स्पष्टतः जोड़ता नहीं।
- issue: ‘सिद्ध पति’ की पहचान
  choice: पहचान अनिर्दिष्ट रखी गई
  alternative: उसे मसीह, परमेश्वर या किसी अन्य विशिष्ट सत्ता के रूप में नामित करना
  rationale: इस अंश में पति की स्पष्ट पहचान नहीं दी गई; इसलिए रूपक के धर्मवैचारिक तनाव को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण गद्य और काव्य-पंक्तियों का रूप रखा गया है। आत्मा के लिए स्त्रीलिंग सर्वनाम बनाए गए हैं, जिससे पति और घर-वापसी का मूल रूपक स्पष्ट रहता है। विदेशी नामों को प्रचलित ध्वन्यात्मक देवनागरी में लिखा गया है। पांडुलिपीय कोष्ठक, खाली क्षति-संकेत और दिए गए होमरिक संदर्भ सुरक्षित रखे गए हैं। कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण यह प्रकाशन-पूर्व अस्थायी मसौदा है।
