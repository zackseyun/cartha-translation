  text: 'And so it is right to pray to the Father and call on him with our whole soul, sighing not outwardly with our lips, but with the inward spirit that comes from the depths. We must repent of the former life we lived, confess our sins, recognize the empty lie in which we lived and our hollow zealotry, wail because of the darkness and the wave that engulfed us, and weep for ourselves so that he may have compassion on us, hating ourselves because of what we are now.


    The Savior said again:


    “Blessed are those who mourn, for they will be shown pity.

    Blessed are those who are hungry, for they will be filled.” (Matthew 5:4,6; Luke 6:21)


    He also said, “If someone does not hate his soul, he cannot follow me.” (Luke 14:26)


    This is because repentance is the beginning of salvation. And so, “Before Christ appeared, John came, preaching the baptism of repentance.” (Acts 13:24)


    Repentance takes place in pain and sorrow. The Father, however, is good and loves humanity. He listens to the soul that calls on him and sends it the light of salvation. Therefore, through the Spirit he said to the prophet:


    Say to the children of my people:

    “[If] your sins reach [from earth to] heaven,

    and if they are [red] as scarlet,

    and blacker than sackcloth,

    [and if] [] you return to me with your whole soul,

    and say to me, ‘My Father!’

    I will listen to you as a holy people.” (1 Clement 8:3)


    Yet another passage says, “Thus says the Lord, the Holy One of Israel: ‘If you return and weep, then you will be saved, and you will know where you were when you put your hope in what is empty.’” (Isaiah 30:15)


    And in another passage he said:


    Jerusalem wept greatly, saying, “Have pity on me.” He will be gracious to you at the sound of your weeping. When he saw, he answered you. The Lord will give you bread of adversity and water of affliction. From now on, those who lie to you will no longer approach you. Your eyes will see those who lie to you. (Isaiah 30:19-20)


    And so it is right to pray to God both night and day, stretching out our hands to him like those sailing in the middle of the sea. They pray to God with their whole heart and without duplicity, because those who pray with duplicity only lie to themselves. Indeed, so that he may know who deserves salvation, God examines the inward parts and searches the depths of the heart. For no one who is still in love with the place of lies deserves salvation.'
translation:
  language: hi
  text: 'इसलिए उचित है कि हम पिता से प्रार्थना करें और अपने पूरे प्राण से उसे पुकारें। हमारी आह केवल होंठों से बाहर ही न निकले, बल्कि उस भीतरी आत्मा से उठे जो गहराई से आती है। हम अपने पिछले जीवन के लिए मन फिराएँ, अपने पापों को मान लें, उस खोखले झूठ को समझें जिसमें हम जीते रहे और उस व्यर्थ कट्टरता को भी पहचानें; उस अंधकार और उस लहर के कारण विलाप करें जिसने हमें डुबो लिया; और अपने लिए रोएँ, ताकि वह हम पर दया करे—हम अभी जो हैं, उसके कारण अपने आप से घृणा करें।


    उद्धारकर्ता ने फिर कहा:


    “धन्य हैं वे जो शोक करते हैं,

    क्योंकि उन पर दया की जाएगी।


    धन्य हैं वे जो भूखे हैं,

    क्योंकि वे तृप्त किए जाएँगे।” (मत्ती 5:4, 6; लूका 6:21)


    उसने यह भी कहा, “यदि कोई अपने प्राण से घृणा नहीं करता, तो वह मेरे पीछे नहीं चल सकता।”[a] (लूका 14:26)


    क्योंकि उद्धार का आरंभ मन फिराना है। इसीलिए, “मसीह के प्रकट होने से पहले यूहन्ना आया और मन फिराव के बपतिस्मे का प्रचार किया।” (प्रेरितों के काम 13:24)


    मन फिराना पीड़ा और शोक में होता है। परंतु पिता भला है और मनुष्यों से प्रेम करता है। जो प्राण उसे पुकारता है, उसकी वह सुनता है और उसके पास उद्धार का प्रकाश भेजता है। इसलिए उसने आत्मा के द्वारा भविष्यवक्ता से कहा:


    मेरी प्रजा की संतानों से कहो:


    “[यदि] तुम्हारे पाप [पृथ्वी से] आकाश तक पहुँच जाएँ,

    और यदि वे सिंदूरी [लाल] हों,

    और टाट से भी अधिक काले हों,

    [और यदि] [ ] तुम अपने पूरे प्राण से मेरी ओर लौटो,

    और मुझसे कहो, ‘मेरे पिता!’

    तो मैं पवित्र प्रजा के समान तुम्हारी सुनूँगा।”[b] (1 क्लेमेंट 8:3)


    एक और वचन में कहा गया है, “इस्राएल का पवित्र जन, प्रभु, यों कहता है: ‘यदि तुम लौटो और रोओ, तो बचाए जाओगे; और तुम जानोगे कि जब तुमने व्यर्थ वस्तु पर आशा रखी थी, तब तुम कहाँ थे।’” (यशायाह 30:15)


    और एक अन्य वचन में उसने कहा:


    यरूशलेम बहुत रोया और कहने लगा, “मुझ पर दया कर।” तुम्हारे रोने की आवाज़ सुनकर वह तुम पर अनुग्रह करेगा। जब उसने देखा, तो उसने तुम्हें उत्तर दिया। प्रभु तुम्हें विपत्ति की रोटी और क्लेश का पानी देगा। अब से जो तुमसे झूठ बोलते हैं, वे फिर तुम्हारे निकट नहीं आएँगे। तुम्हारी आँखें उन लोगों को देखेंगी जो तुमसे झूठ बोलते हैं।[c] (यशायाह 30:19–20)


    इसलिए उचित है कि हम रात-दिन परमेश्वर से प्रार्थना करें और उसकी ओर अपने हाथ फैलाएँ, जैसे समुद्र के बीच नाव चलानेवाले करते हैं। वे बिना किसी कपट के पूरे हृदय से परमेश्वर से प्रार्थना करते हैं, क्योंकि जो कपट से प्रार्थना करते हैं, वे केवल अपने आप से झूठ बोलते हैं। वास्तव में, यह जानने के लिए कि उद्धार के योग्य कौन है, परमेश्वर मनुष्य के भीतर की जाँच करता और हृदय की गहराइयों को परखता है। क्योंकि जो अब भी झूठ के स्थान से प्रेम करता है, वह उद्धार के योग्य नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘प्राण से घृणा’ मूल कथन की कठोर भाषा है। इसका आशय आत्म-हानि का निर्देश बताना आवश्यक नहीं; यह शिष्यत्व में अपने वर्तमान जीवन और स्वार्थ से निर्णायक विरक्ति को व्यक्त कर सकता है।
    reason: आधुनिक पाठक के लिए संभावित हानिकारक गलत समझ को रोकते हुए मूल तनाव बनाए रखना।
  - marker: b
    text: वर्ग कोष्ठक उपलब्ध साक्ष्य में टूटे हुए अथवा संपादकीय रूप से पुनर्स्थापित शब्दों को दर्शाते हैं। इस उद्धरण का रूप 1 क्लेमेंट 8:3 से संबंधित है और प्रचलित बाइबिल पाठों से शब्दशः मेल नहीं खाता।
    reason: पांडुलिपीय अनिश्चितता और उद्धरण-परंपरा को पारदर्शी बनाना।
  - marker: c
    text: यशायाह 30:19–20 का यह रूप प्रचलित हिब्रू-आधारित अनुवादों से काफी भिन्न है। ‘जो तुमसे झूठ बोलते हैं’ पाठ की दी हुई उद्धरण-परंपरा को सुरक्षित रखता है।
    reason: पाठांतर को बिना चुपचाप मानकीकृत किए पाठक को सचेत करना।
lexical_decisions:
- source_word: soul
  choice: प्राण
  rationale: यहाँ ‘soul’ व्यक्ति के भीतरी जीवन अथवा स्वयं को सूचित करता है। ‘प्राण’ ने ‘आत्मा’ से भेद बनाए रखा, क्योंकि निकटवर्ती पाठ में inward spirit और Spirit भी आते हैं।
- source_word: inward spirit / Spirit
  choice: भीतरी आत्मा / आत्मा
  rationale: 'छोटे और बड़े अर्थगत प्रयोग का भेद संदर्भ से रखा गया: पहले मनुष्य की भीतर से उठती आत्मा, बाद में परमेश्वर का आत्मा के द्वारा बोलना।'
- source_word: repentance / repenting
  choice: मन फिराना / मन फिराव
  rationale: यह केवल पछतावा नहीं, जीवन की दिशा बदलकर परमेश्वर की ओर लौटना दर्शाता है; सामान्य हिंदी में भी बोधगम्य है।
- source_word: vacuous lie / what is empty
  choice: खोखला झूठ / व्यर्थ वस्तु
  rationale: अलग संदर्भों में मूल रूपकों को यथासंभव बनाए रखते हुए अस्वाभाविक शाब्दिकता से बचा गया।
- source_word: hollow zealotry
  choice: व्यर्थ कट्टरता
  rationale: उत्साह के नकारात्मक, खोखले और अतिवादी भाव को स्पष्ट करता है, बिना किसी विशेष संप्रदाय का संकेत दिए।
- source_word: pitied / compassion
  choice: दया की जाएगी / दया करे
  rationale: दोनों स्थानों में करुणा और कृपालु प्रतिक्रिया का स्वाभाविक हिंदी रूप।
- source_word: duplicity
  choice: कपट
  rationale: दोहरा मन अथवा असच्ची धार्मिकता का संक्षिप्त और प्रतिष्ठित हिंदी पद।
- source_word: place of lies
  choice: झूठ का स्थान
  rationale: लेखक की स्थान-संबंधी रहस्यमय छवि को व्याख्यात्मक रूप से मिटाया नहीं गया।
theological_decisions:
- issue: ‘अपने प्राण से घृणा’ का अर्थ
  choice: कठोर कथन को मुख्य पाठ में ज्यों का त्यों रखा
  alternative: ‘अपने जीवन को मुझसे कम प्रिय न माने’ जैसे व्याख्यात्मक रूप में नरम करना
  rationale: पाठ की वास्तविक धार्मिक और नैतिक तीक्ष्णता तथा लूका 14:26 की प्रतिध्वनि को सुरक्षित रखना आवश्यक है।
- issue: उद्धार के योग्य होना और परमेश्वर की जाँच
  choice: ‘उद्धार के योग्य’ बनाए रखा
  alternative: ‘किसे उद्धार देना है’
  rationale: वैकल्पिक रूप कृपा और चयन के संबंध को अनावश्यक रूप से सुलझा देता; साक्ष्य का merit/deserving भाव संरक्षित किया गया।
- issue: उद्धार का आरंभ
  choice: ‘उद्धार का आरंभ मन फिराना है’
  alternative: मन फिराव को उद्धार का परिणाम बताना
  rationale: लेखक का स्पष्ट क्रम बिना किसी बाद की संप्रदायगत व्यवस्था के रखा गया।
- issue: पिता मनुष्यों से प्रेम करता है
  choice: प्रत्यक्ष रूप ‘मनुष्यों से प्रेम करता है’
  alternative: ‘दयालु है’ में समेटना
  rationale: मानव-प्रेम संबंधी स्वतंत्र कथन को सुरक्षित रखा गया।
- issue: आत्मा के द्वारा भविष्यवक्ता से कहना
  choice: कर्ता पिता/परमेश्वर को संदर्भानुसार अस्पष्ट रहने दिया
  alternative: स्पष्ट रूप से ‘पिता ने पवित्र आत्मा के द्वारा’ कहना
  rationale: स्रोत में जितनी स्पष्टता है उससे अधिक त्रिएक संबंधी विशिष्टीकरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। प्रत्यक्ष उद्धरणों में काव्यात्मक पंक्ति-विन्यास रखा गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण अनिश्चित और पुनर्स्थापित अंशों को वर्ग कोष्ठकों सहित सुरक्षित रखा गया है। ‘प्राण’ और ‘आत्मा’ का भेद जानबूझकर रखा गया है।
