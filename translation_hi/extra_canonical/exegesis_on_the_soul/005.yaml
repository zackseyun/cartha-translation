    एक और वचन में कहा गया है, “प्रभु, इस्राएल का पवित्र जन, यों कहता है: ‘यदि तुम लौटो और रोओ, तो बचाए जाओगे; और तुम जानोगे कि जब तुमने व्यर्थ वस्तु पर आशा रखी थी, तब तुम कहाँ थे।’” (यशायाह 30:15)



