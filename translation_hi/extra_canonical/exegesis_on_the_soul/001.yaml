  footnotes:
  - marker: a
    text: आरम्भ में रिक्त कोष्ठक पांडुलिपि की क्षति या लुप्त पाठ का संकेत देते हैं; यहाँ उसे चिह्न द्वारा सुरक्षित रखा गया है।
    reason: साक्ष्य में आरम्भिक [] को दृश्य रूप से ज्यों का त्यों रखने के बजाय पठनीय फुटनोट संकेत में दर्ज किया गया।
  - marker: b
    text: इस वाक्य में कोष्ठक पांडुलिपि के क्षतिग्रस्त या संपादकीय रूप से पुनर्स्थापित पाठ को दर्शाते हैं। मूल साक्ष्य में “खो दिया” के पास एक अतिरिक्त रिक्त क्षति-संकेत भी है।
    reason: '[violated], [lost] और आंतरिक रिक्त [] की पाठगत अनिश्चितता बताना आवश्यक है।'
  - marker: c
    text: यहाँ साक्ष्य में एक रिक्त कोष्ठक है, जो अनिर्धारित लुप्त पाठ का संकेत है।
    reason: कुमारी-कक्ष से पहले की पांडुलिपीय क्षति को सुरक्षित रखना।
lexical_decisions:
- source_word: soul
  choice: आत्मा
  rationale: आधुनिक मानक हिन्दी में प्रचलित और यहाँ स्त्रीलिंग रूपक को स्वाभाविक रूप से बनाए रखने वाला शब्द।
- source_word: sages
  choice: मनीषियों
  rationale: प्राचीन ज्ञानियों के लिए गरिमापूर्ण, संप्रदाय-निरपेक्ष शब्द।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: स्त्री और पुरुष दोनों रूप-लक्षण समेटने की साक्ष्यगत धारणा को बिना व्याख्यात्मक विस्तार के रखता है।
- source_word: robbers
  choice: लुटेरों
  rationale: हिंसक छीनने और शोषण का रूपक सुरक्षित रहता है।
- source_word: prostitution
  choice: वेश्यावृत्ति
  rationale: मूल साक्ष्य की कठोर यौन और नैतिक उपमा को नरम किए बिना स्पष्ट करता है।
- source_word: exalted Father
  choice: परम पिता
  rationale: ऊँचे/महान पद को स्वाभाविक धार्मिक हिन्दी में व्यक्त करता है, बिना किसी विशेष संप्रदायगत उपाधि के।
- source_word: maiden’s quarters
  choice: कुमारी-कक्ष
  rationale: कुमारी के निजी निवास-कक्ष की प्राचीन छवि को संक्षिप्त रूप में बनाए रखता है।
theological_decisions:
- issue: आत्मा का स्त्री और उभयलिंगी दोनों रूपों में वर्णन
  choice: दोनों कथनों को साथ-साथ यथावत रखा गया
  alternative: उभयलिंगी को केवल प्रतीकात्मक या अलैंगिक समझाकर अनुवाद करना
  rationale: पाठ के भीतर विद्यमान तनाव को किसी बाद की धर्मवैज्ञानिक प्रणाली से हल नहीं किया गया।
- issue: देह में गिरना
  choice: “एक देह में गिरी”
  alternative: “देह धारण की” या “जन्म लिया”
  rationale: ‘गिरने’ की नकारात्मक गति और इस अंश के पतन-विषय को सुरक्षित रखा गया।
- issue: पिता की दया और आत्मा की योग्यता
  choice: “दया प्रदान करने योग्य समझेगा”
  alternative: दया को पूर्णतः बिना शर्त घोषित करना
  rationale: साक्ष्य के क्रम और उसकी योग्यता-संबंधी भाषा को धर्मसिद्धान्त के आधार पर पुनर्गठित नहीं किया गया।
- issue: पश्चात्ताप और पिता को लेखा देना
  choice: क्षतिग्रस्त पुनर्स्थापन को कोष्ठकों में “लेखा दूँगी” रखा गया
  alternative: “प्रार्थना करूँगी” या “अपने पाप मानूँगी”
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की अनिश्चित पुनर्स्थापना को सुरक्षित रखा गया; कॉप्टिक समीक्षा लंबित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यौन हिंसा तथा वेश्यावृत्ति की तीखी रूपकात्मक भाषा को शिष्टोक्ति से ढका नहीं गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग कोष्ठक संपादकीय पुनर्स्थापन दर्शाते हैं, जबकि रिक्त क्षतियों को फुटनोट संकेतों से दर्ज किया गया है।
