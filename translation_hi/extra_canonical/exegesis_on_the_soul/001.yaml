translation:
  language: hi
  text: '[a] बहुत पहले मनीषियों ने आत्मा को स्त्रीलिंग नाम दिया था। वास्तव में उसका स्वभाव भी स्त्री का है। उसका गर्भ भी है।


    जब तक वह पिता के साथ एकांत में रहती थी, वह कुँवारी थी और उसका रूप उभयलिंगी था। पर जब वह एक देह में गिरी और इस जीवन में प्रवेश किया, तब वह बहुत-से लुटेरों के हाथ पड़ गई। वे क्रूर प्राणी उसे एक-दूसरे के हाथ सौंपते रहे और उसका [बलात्कार किया]। कुछ ने बलपूर्वक उसका उपभोग किया, और दूसरों ने उपहार देकर उसे बहकाया। संक्षेप में, उन्होंने उसे अशुद्ध किया और उसने अपना [कुँवारापन खो दिया] [b]।


    अपनी देह में उसने वेश्यावृत्ति की और बिना किसी भेद के अपने आपको सबके हवाले कर दिया। जिसे भी वह आलिंगन करने को तैयार होती, उसी को अपना पति समझती थी। जब उसने अपने आपको उन क्रूर और विश्वासघाती व्यभिचारियों के हाथ सौंप दिया कि वे उसका दुरुपयोग करें, तब वह गहराई से कराहने लगी और उसने पश्चात्ताप किया।


    फिर भी, जब उसने उन व्यभिचारियों से मुँह मोड़ा, तो वह दूसरों के पास दौड़ी गई। उन्होंने उसे विवश किया कि वह उनके साथ रहे और उनके बिस्तर पर उनकी सेवा करे, मानो वे उसके स्वामी हों। लज्जा के कारण वह फिर उन्हें छोड़ने का साहस न कर सकी। वे भी बहुत समय तक उसे छलते रहे। वे अपने आपको निष्ठावान और सच्चे पति बताते थे, मानो वे उसका बहुत आदर करते हों। और इस सबके बाद वे उसे त्यागकर चले गए।


    तब वह असहाय, निर्धन और उजड़ी हुई विधवा बन गई। उसके संकट के समय उसके लिए भोजन का एक कौर भी नहीं बचा था। उनसे उसे केवल संभोग से आई अशुद्धता ही मिली। और उन व्यभिचारियों से उत्पन्न उसकी संतानें गूँगी, अंधी, रोगी और निर्बुद्धि हैं।


    पर जब परम पिता उसके पास आया और उसने उस पर दृष्टि की, और उसे अपनी पीड़ाओं और लज्जा में कराहते तथा अपनी की हुई वेश्यावृत्ति पर पश्चात्ताप करते देखा, और जब वह सहायता पाने के लिए उसका नाम पुकारने लगी, तब उसने [कराहते हुए] पूरे मन से कहा, “हे मेरे पिता, मुझे बचा। मुझ पर दृष्टि कर, क्योंकि मैं तुझे [लेखा दूँगी]। मैंने अपना घर छोड़ दिया और [c] अपनी कुमारी-कक्ष से भाग निकली। मुझे फिर से अपने पास लौटा ले।”


    जब वह उसे इस दशा में देखेगा, तब वह उसे अपनी दया प्रदान करने योग्य समझेगा, क्योंकि अपना घर छोड़ देने के कारण उस पर बहुत-से दुःख आ पड़े हैं।'
