review_pass:
  verdict: revise
  source_fidelity: 'The conditional relationship in the Israel sentence, the rescue from Egypt and the house of bondage, the Psalm quotation, and the concluding assurance are substantially retained. A few renderings can more closely preserve the English witness: the two objects in the line about tears should both be governed by ‘every night,’ and the title should represent ‘on the Soul,’ not suggest that the soul itself is the interpreter.'
  naturalness: The draft is generally clear and appropriately dignified. ‘मेरे रोने की पुकार’ is somewhat awkward, and ‘धीरजवन्त’ is less natural in modern standard Hindi. Combining the bed/couch line also produces a more fluent poetic line without losing its parallel objects.
  terminology: ‘परमेश्वर,’ ‘प्रभु,’ ‘दासता,’ and ‘मन फिराएँ’ are suitable and do not impose a denominational interpretation. ‘धीरज रखनेवाला और करुणा से भरपूर’ communicates ‘patient and richly merciful’ naturally. ‘आत्मा पर व्याख्या’ is a more accurate Hindi title for ‘The Exegesis on the Soul.’
  issues:
  - severity: medium
    issue: The Psalm line distributes ‘every night’ only over the first object and turns the second into an independent line.
    rationale: The witness says that both ‘my bed’ and ‘my couch’ are flooded with tears every night. A combined Hindi line keeps both objects under the same temporal phrase.
  - severity: low
    issue: ‘मेरे रोने की पुकार’ is idiomatically strained.
    rationale: ‘मेरे विलाप की पुकार’ more naturally conveys ‘the cry of my weeping’ while retaining the poetic emphasis.
  - severity: low
    issue: ‘धीरजवन्त’ is not the most natural modern-standard Hindi expression for ‘patient.’
    rationale: ‘धीरज रखनेवाला’ is clear, contemporary, and preserves the attribute without interpretive expansion.
  - severity: medium
    issue: The title ‘आत्मा की व्याख्या’ can imply that the soul provides the exegesis.
    rationale: The English title denotes an exegesis concerning the soul; ‘आत्मा पर व्याख्या’ better preserves that relation.
