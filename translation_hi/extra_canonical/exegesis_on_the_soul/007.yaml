translation:
  language: hi
  text: 'यदि इस्राएल ने परमेश्वर के सामने कराहकर अपनी दासता के अत्याचार के कारण विलाप न किया होता, तो निश्चय ही आरम्भ में उसकी सुधि न ली जाती और उसे मिस्र देश से, दासता के घर से, छुड़ाया न जाता।[a]


    फिर भजनों में लिखा है:


    मैं अपने कराहने से बहुत थक गया हूँ।

    हर रात मैं अपने आँसुओं से अपना बिछौना भिगो दूँगा,

    अपनी खाट आँसुओं से तर कर दूँगा।

    मैं अपने सब शत्रुओं के बीच बूढ़ा हो गया हूँ।

    हे सब कुकर्म करनेवालो, मुझसे दूर हो जाओ,

    क्योंकि देखो, प्रभु ने मेरे रोने की पुकार सुन ली है,

    और प्रभु ने मेरी प्रार्थना स्वीकार कर ली है। (भजन 6:6–9)[b]


    यदि हम मन फिराएँ, तो परमेश्वर निश्चय ही हमारी सुनेगा—वही जो धीरजवन्त और करुणा से भरपूर है। उसकी महिमा युगानुयुग होती रहे। आमीन!


    आत्मा की व्याख्या'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: दिए गए स्रोत-विवरण के अनुसार प्राचीन भाषा के मूल से जाँच अभी नहीं हुई है, इसलिए पाठ की आधार-सीमा पारदर्शी करना आवश्यक है।
  - marker: b
    text: भजन-संदर्भ और पद-विभाजन उद्धृत साक्ष्य के अनुसार दिए गए हैं; शब्दावली किसी एक प्रचलित हिन्दी बाइबल अनुवाद से नहीं ली गई है।
    reason: उद्धरण की पाठ-परंपरा और आधुनिक बाइबल संस्करणों के बीच संभावित अंतर को स्पष्ट करना।
lexical_decisions:
- source_word: visited
  choice: सुधि ली जाती
  rationale: यहाँ ‘visit’ का अर्थ केवल मिलने आना नहीं, बल्कि संकट में ध्यान देकर उद्धारकारी हस्तक्षेप करना है; ‘सुधि लेना’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: house of bondage
  choice: दासता का घर
  rationale: निर्गमन-परंपरा की स्थिर रूपकात्मक भाषा को बनाए रखने के लिए अपेक्षाकृत औपचारिक अनुवाद चुना गया।
- source_word: repent
  choice: मन फिराएँ
  rationale: यह पश्चात्ताप के साथ दिशा और आचरण के परिवर्तन का भाव देता है, बिना किसी विशेष सांप्रदायिक शब्दावली को आरोपित किए।
- source_word: patient
  choice: धीरजवन्त
  rationale: परमेश्वर के सहनशील और विलम्ब से क्रोध करनेवाले स्वभाव को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: richly merciful
  choice: करुणा से भरपूर
  rationale: प्रचुर दया के अर्थ को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: Exegesis
  choice: व्याख्या
  rationale: रचना के शीर्षक में विवेचनात्मक अर्थ को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक रखा गया।
theological_decisions:
- issue: इस्राएल की कराह और परमेश्वर के उद्धारकारी हस्तक्षेप के बीच संबंध
  choice: 'शर्तात्मक कथन को यथावत रखा गया: यदि इस्राएल न कराहता, तो उसकी सुधि न ली जाती।'
  alternative: कथन को नरम करके केवल यह कहना कि परमेश्वर ने उसकी कराह सुनी और उसे छुड़ाया।
  rationale: साक्ष्य-पाठ का प्रबल कारणात्मक और शर्तात्मक बल theological tension सहित सुरक्षित रखना आवश्यक है।
- issue: पश्चात्ताप पर परमेश्वर का सुनना
  choice: ‘निश्चय ही हमारी सुनेगा’
  alternative: ‘हमारी सुन सकता है’ या ‘हम पर दया करेगा’
  rationale: मूल साक्ष्य में व्यक्त आश्वासन को कमज़ोर नहीं किया गया, और ‘सुनना’ की प्रार्थनात्मक भाषा बनाए रखी गई।
- issue: भजन के उद्धरण में काल और काव्यात्मक भाषा
  choice: साक्ष्य में आए मिश्रित पूर्ण/भविष्य काल को यथासंभव सुरक्षित रखा गया।
  alternative: पूरे उद्धरण को किसी प्रचलित हिन्दी बाइबल संस्करण के अनुसार एकरूप करना।
  rationale: उपलब्ध सार्वजनिक-डोमेन साक्ष्य को आधार बनाया गया है; किसी बाद के सांप्रदायिक या अनुवाद-विशिष्ट पाठ को चुपचाप प्रतिस्थापित नहीं किया गया।
