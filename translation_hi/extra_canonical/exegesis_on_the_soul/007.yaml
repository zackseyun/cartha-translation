  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। वेबसाइट की नेविगेशन सामग्री, संपर्क विवरण और संबद्ध-विक्रय सूचना को मूल रचना का भाग न होने के कारण शामिल नहीं किया गया।
