  revised_text: '**पवित्रशास्त्र के अनुसार आत्मा का वेश्याचार**[a]


    अब आत्मा के वेश्याचार के विषय में पवित्र आत्मा अनेक स्थानों पर भविष्यवाणी करता है। वह भविष्यवक्ता यिर्मयाह के द्वारा कहता है:


    “यदि कोई पति अपनी पत्नी को तलाक दे दे और वह जाकर किसी दूसरे पुरुष की हो जाए, तो क्या वह फिर उसके पास लौट सकती है? क्या उस स्त्री ने अपने आपको पूरी तरह अशुद्ध नहीं कर लिया? ‘तूने बहुत-से चरवाहों के साथ वेश्याचार किया, और फिर मेरे पास लौट आई,’ प्रभु ने कहा। ‘ध्यान से देख कि तूने कहाँ-कहाँ वेश्याचार किया। क्या तू सड़कों पर बैठकर अपने वेश्याचार और दुष्टता से देश को अशुद्ध नहीं कर रही थी? तूने बहुत-से चरवाहों को अपने लिए ठोकर का कारण बनाया। तू हर किसी के साथ निर्लज्ज रही। तूने मुझे न अपने संबंधी के रूप में पुकारा, न पिता के रूप में, न अपने कुँवारेपन के रक्षक के रूप में।’” (यिर्मयाह 3:1–4)


    फिर भविष्यवक्ता होशे में लिखा है:


    “आओ, अपनी माँ पर अभियोग लगाओ, क्योंकि वह मेरी पत्नी नहीं रहेगी और मैं उसका पति नहीं रहूँगा। मैं उसके वेश्याचार को अपने सामने से और उसके व्यभिचार को उसकी छातियों के बीच से दूर कर दूँगा। मैं उसे वैसा ही नंगा कर दूँगा जैसी वह अपने जन्म के दिन थी; मैं उसे उजाड़ बना दूँगा, जलहीन भूमि के समान कर दूँगा, और उसे [निःसंतानता में तरसने दूँगा]।[b] मैं उसके बच्चों पर दया नहीं करूँगा, क्योंकि वे वेश्याचार से जन्मे बच्चे हैं। उनकी माँ ने वेश्याचार किया और [अपने बच्चों के प्रति लज्जाजनक व्यवहार किया]। [पाठ लुप्त है।][c] क्योंकि उसने कहा, ‘मैं अपने प्रेमियों के पीछे वेश्याचार करने जाऊँगी। उन्होंने मुझे मेरी रोटी और पानी, मेरे वस्त्र और कपड़े, मेरी दाखमधु और तेल, और मेरी आवश्यकता की हर वस्तु दी।’ इसलिए देखो, मैं उन्हें इस तरह बंद कर दूँगा कि वह अपने प्रेमियों के पीछे न दौड़ सके। जब वह उन्हें खोजेगी, पर पाएगी नहीं, तब कहेगी, ‘मैं अपने पहले पति के पास लौट जाऊँगी, क्योंकि तब मेरी दशा अब से अच्छी थी।’” (होशे 2:2–7)


    फिर वह यहेजकेल में कहता है:


    “‘इतनी सारी दुष्टता के बाद,’ प्रभु ने कहा, ‘तूने एक वेश्यालय बनाया और सड़कों पर अपने सौंदर्य के लिए एक स्थान बनाया। तूने हर सड़क पर वेश्यालय बनाए, अपना सौंदर्य बरबाद किया, हर गली में अपनी टाँगें फैलाईं और अपने वेश्याचार के काम बढ़ाती गई। तूने मिस्र के पुत्रों—अपने पड़ोसियों, देह में बड़े पुरुषों—के साथ वेश्याचार किया।’” (यहेजकेल 16:23–26)


    तो “मिस्र के पुत्रों—देह में बड़े पुरुषों” का अर्थ देह का राज्य, इंद्रियों से अनुभव होने वाला जगत और सांसारिक काम-काज छोड़कर और क्या है? ये यहाँ आत्मा को अशुद्ध करते हैं, क्योंकि वह इन्हीं से रोटी, दाखमधु, तेल, वस्त्र और देह से जुड़ी दूसरी निर्बुद्ध बाहरी वस्तुएँ प्राप्त करती है—वे वस्तुएँ जिन्हें वह अपने लिए आवश्यक समझती है।


    इस वेश्याचार के विषय में उद्धारकर्ता के प्रेरितों ने दृढ़ता से कहा, “इससे अपने आपको बचाए रखो; इससे अपने आपको शुद्ध करो।” यह केवल शारीरिक वेश्याचार पर ही नहीं, बल्कि विशेष रूप से आत्मा के वेश्याचार पर लागू होता है। इसी कारण प्रेरित परमेश्वर की [कलीसियाओं को][d] लिखते हैं, ताकि [इस प्रकार का वेश्याचार] हमारे बीच न हो।


    फिर भी, सबसे कठिन [समस्या] आत्मा के वेश्याचार [] की है।[e] शारीरिक वेश्याचार भी उसी से उत्पन्न होता है। इसलिए पौलुस ने कुरिन्थियों को लिखते हुए कहा, “मैंने अपनी पत्री में तुम्हें लिखा था, ‘वेश्याचारियों की संगति न करना’—इसका अर्थ इस संसार के वेश्याचारियों, लोभियों, लुटेरों या मूर्तिपूजकों से बिल्कुल नहीं है, क्योंकि तब तो तुम्हें संसार से ही बाहर निकल जाना पड़ता।” (1 कुरिन्थियों 5:9–10) यहाँ वह आत्मिक अर्थ में बोल रहा है: “क्योंकि हमारा संघर्ष मांस और लहू से नहीं,” जैसा उसने कहा, “बल्कि इस अंधकार के विश्व-शासकों और दुष्टता की आत्माओं से है।” (इफिसियों 6:12)


    क्योंकि जब तक आत्मा हर ओर भटकती रहती है, मिलने वाले हर एक के साथ यौन-संबंध बनाती और अपने आपको अशुद्ध करती रहती है, तब तक वह वही भोगती है जिसकी वह अधिकारी है।'
