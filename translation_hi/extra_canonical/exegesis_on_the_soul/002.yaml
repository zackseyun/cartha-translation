  text: 'Now, concerning the prostitution of the soul, the Holy Spirit prophesies in many places, saying through the prophet Jeremiah:


    “If a husband divorces his wife, and she goes and takes another man, can she return to him again? Has that woman not completely defiled herself? ‘And you prostituted yourself to many shepherds, and you returned to me,’ said the Lord. ‘Look carefully and see where you prostituted yourself. Were you not sitting in the streets, polluting the land with your prostitution and wickedness? And you took many shepherds as a stumbling block for yourself. You were shameless with everyone. You did not call on me as a relative, or as a father, or as the guardian of your virginity.’” (Jeremiah 3:1–4)


    Again, it is written in the prophet Hosea:


    “Come, bring charges against your mother, for she will not be a wife to me, and I will not be a husband to her. I will remove her prostitution from before me, and I will remove her adultery from between her breasts. I will strip her naked as on the day she was born, and I will make her a wilderness, like a land without water, and I will make her [yearn in childlessness]. I will not have compassion on her children, for they are children of prostitution, because their mother prostituted herself and [acted shamefully toward her children]. [] For she said, ‘I will prostitute myself to my lovers. They gave me my bread and my water, my clothing and my garments, my wine and my oil, and everything I needed.’ Therefore, look: I will close them in so that she cannot run after her lovers. When she seeks them but does not find them, she will say, ‘I will return to my former husband; I was better off then than I am now.’” (Hosea 2:2–7)


    Again, he says in Ezekiel:


    “‘After much wickedness,’ said the Lord, ‘you built a brothel and made a place for your beauty in the streets. You built brothels on every street, squandered your beauty, spread your legs in every alley, and multiplied your acts of prostitution. You prostituted yourself to the sons of Egypt, your neighbors, men great in flesh.’” (Ezekiel 16:23–26)


    What, then, does “the sons of Egypt, men great in flesh” mean, except the kingdom of the flesh, the perceptible realm, and earthly affairs? These defile the soul here, as she obtains from them bread, as well as wine, oil, garments, and other senseless external things surrounding the body—things she believes are necessary for her.


    Concerning this prostitution, however, the Savior’s apostles insisted, “Guard yourselves from it; purify yourselves from it.” This applies not only to bodily prostitution, but especially to the prostitution of the soul. For this reason, the apostles write [to the churches] of God, so that [this kind (of prostitution)] might not happen among us.


    Nevertheless, the most difficult [challenge] concerns the prostitution [] of the soul. Bodily prostitution also originates from it. Therefore Paul, writing to the Corinthians, said, “I wrote to you in the letter, ‘Do not associate with prostitutes’—not at all referring to the prostitutes of this world, or the greedy, or robbers, or idolaters, because then you would need to leave the world.” (1 Corinthians 5:9–10) In this case he is speaking spiritually: “For our struggle is not against flesh and blood,” as he said, “but against the world rulers of this darkness and the spirits of wickedness.” (Ephesians 6:12)


    For as long as the soul continues running everywhere, having sex with everyone she meets and defiling herself, she suffers what she deserves.'
translation:
  language: hi
  text: '**पवित्रशास्त्र के अनुसार आत्मा का वेश्याचार**[a]


    अब आत्मा के वेश्याचार के विषय में पवित्र आत्मा अनेक स्थानों पर भविष्यवाणी करता है। वह भविष्यवक्ता यिर्मयाह के द्वारा कहता है:


    “यदि कोई पति अपनी पत्नी को तलाक दे दे और वह जाकर किसी दूसरे पुरुष की हो जाए, तो क्या वह फिर उसके पास लौट सकती है? क्या उस स्त्री ने अपने आपको पूरी तरह अशुद्ध नहीं कर लिया? ‘तूने बहुत-से चरवाहों के साथ वेश्याचार किया, और फिर मेरे पास लौट आई,’ प्रभु ने कहा। ‘ध्यान से देख कि तूने कहाँ-कहाँ वेश्याचार किया। क्या तू सड़कों पर बैठकर अपने वेश्याचार और दुष्टता से देश को अशुद्ध नहीं कर रही थी? तूने बहुत-से चरवाहों को अपने लिए ठोकर का कारण बनाया। तू हर किसी के साथ निर्लज्ज रही। तूने मुझे न अपने संबंधी के रूप में पुकारा, न पिता के रूप में, न अपने कुँवारेपन के रक्षक के रूप में।’” (यिर्मयाह 3:1–4)


    फिर भविष्यवक्ता होशे में लिखा है:


    “आओ, अपनी माँ पर अभियोग लगाओ, क्योंकि वह मेरी पत्नी नहीं रहेगी और मैं उसका पति नहीं रहूँगा। मैं उसके वेश्याचार को अपने सामने से और उसके व्यभिचार को उसकी छातियों के बीच से दूर कर दूँगा। मैं उसे वैसा ही नंगा कर दूँगा जैसी वह अपने जन्म के दिन थी; मैं उसे उजाड़ बना दूँगा, जलहीन भूमि के समान कर दूँगा, और मैं उसे [संतानहीनता में तड़पाऊँगा]।[b] मैं उसके बच्चों पर दया नहीं करूँगा, क्योंकि वे वेश्याचार से जन्मे बच्चे हैं। उनकी माँ ने वेश्याचार किया और [अपने बच्चों के प्रति लज्जाजनक व्यवहार किया]। [पाठ लुप्त है।][c] क्योंकि उसने कहा, ‘मैं अपने प्रेमियों के पीछे वेश्याचार करने जाऊँगी। उन्होंने मुझे मेरी रोटी और पानी, मेरे वस्त्र और कपड़े, मेरी दाखमधु और तेल, और मेरी आवश्यकता की हर वस्तु दी।’ इसलिए देखो, मैं उसका मार्ग इस तरह बंद कर दूँगा कि वह अपने प्रेमियों के पीछे न दौड़ सके। जब वह उन्हें खोजेगी, पर पाएगी नहीं, तब कहेगी, ‘मैं अपने पहले पति के पास लौट जाऊँगी, क्योंकि तब मेरी दशा अब से अच्छी थी।’” (होशे 2:2–7)


    फिर वह यहेजकेल में कहता है:


    “‘इतनी सारी दुष्टता के बाद,’ प्रभु ने कहा, ‘तूने एक वेश्यालय बनाया और सड़कों पर अपने सौंदर्य के प्रदर्शन के लिए स्थान तैयार किया। तूने हर सड़क पर वेश्यालय बनाए, अपना सौंदर्य बरबाद किया, हर गली में अपनी टाँगें फैलाईं और अपने वेश्याचार के काम बढ़ाती गई। तूने मिस्र के पुत्रों—अपने पड़ोसियों, भारी-भरकम देह वाले पुरुषों—के साथ वेश्याचार किया।’” (यहेजकेल 16:23–26)


    तो “मिस्र के पुत्रों—भारी-भरकम देह वाले पुरुषों” का अर्थ देह का राज्य, इंद्रियों से अनुभव होने वाला जगत और सांसारिक काम-काज छोड़कर और क्या है? ये यहाँ आत्मा को अशुद्ध करते हैं, क्योंकि वह इन्हीं से रोटी, दाखमधु, तेल, वस्त्र और देह से जुड़ी दूसरी निर्बुद्ध बाहरी वस्तुएँ प्राप्त करती है—वे वस्तुएँ जिन्हें वह अपने लिए आवश्यक समझती है।


    इस वेश्याचार के विषय में उद्धारकर्ता के प्रेरितों ने दृढ़ता से कहा, “इससे अपने आपको बचाए रखो; इससे अपने आपको शुद्ध करो।” यह केवल शारीरिक वेश्याचार पर ही नहीं, बल्कि विशेष रूप से आत्मा के वेश्याचार पर लागू होता है। इसी कारण प्रेरित परमेश्वर की [कलीसियाओं को][d] लिखते हैं, ताकि [इस प्रकार का वेश्याचार] हमारे बीच न हो।


    फिर भी सबसे कठिन [संघर्ष] आत्मा के वेश्याचार [से संबंधित है]।[e] शारीरिक वेश्याचार भी उसी से उत्पन्न होता है। इसलिए पौलुस ने कुरिन्थियों को लिखते हुए कहा, “मैंने अपनी पत्री में तुम्हें लिखा था, ‘वेश्याचारियों की संगति न करना।’ मेरा अर्थ इस संसार के वेश्याचारियों, लोभियों, लुटेरों या मूर्तिपूजकों से बिलकुल अलग रहना नहीं था, क्योंकि तब तो तुम्हें संसार से ही बाहर निकल जाना पड़ता।” (1 कुरिन्थियों 5:9–10) यहाँ वह आत्मिक अर्थ में बोल रहा है: “क्योंकि हमारा संघर्ष मांस और लहू से नहीं,” जैसा उसने कहा, “बल्कि इस अंधकार के विश्व-शासकों और दुष्टता की आत्मिक शक्तियों से है।” (इफिसियों 6:12)


    क्योंकि जब तक आत्मा हर ओर भटकती रहती है, मिलने वाले हर एक के साथ यौन-संबंध बनाती और अपने आपको अशुद्ध करती रहती है, तब तक वह वही दुःख भोगती है जिसकी वह अधिकारी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम पाठ है; कॉप्टिक पांडुलिपि से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: दिए गए स्रोत-विवरण की पाठालोचनात्मक सीमा को पाठक के सामने स्पष्ट करना आवश्यक है।
  - marker: b
    text: कोष्ठकों के भीतर के शब्द क्षतिग्रस्त या अस्पष्ट पांडुलिपि-पाठ की संपादकीय पुनर्स्थापना दर्शाते हैं; यहाँ अर्थ अनिश्चित है।
    reason: ‘yearn in childlessness’ निश्चित पाठ नहीं है और उसकी असहजता को चुपचाप सामान्य नहीं किया जाना चाहिए।
  - marker: c
    text: इस स्थान पर पांडुलिपि का कुछ पाठ उपलब्ध नहीं है।
    reason: अंग्रेज़ी साक्ष्य के खाली कोष्ठकों को अदृश्य छोड़ने के बजाय वास्तविक पाठ-लोप स्पष्ट किया गया है।
  - marker: d
    text: “कलीसियाओं को” संपादकीय रूप से पुनर्स्थापित पाठ है।
    reason: स्रोत साक्ष्य में यह पद कोष्ठकों में है और उसकी अनिश्चितता बनाए रखनी है।
  - marker: e
    text: इस वाक्य के कुछ शब्द क्षतिग्रस्त पाठ के आधार पर संपादकीय रूप से पूरे किए गए हैं।
    reason: ‘challenge’ तथा उसके बाद का संबंधसूचक अंश साक्ष्य में अनिश्चित/लुप्त है; प्रवाह के लिए पूर्ति की गई, पर उसे निश्चित नहीं माना गया।
lexical_decisions:
- source_word: prostitution / harlotry
  choice: वेश्याचार
  rationale: यह शब्द देहगत यौन-अर्थ और आत्मा के रूपकात्मक विश्वासघात—दोनों को बनाए रखता है। केवल ‘व्यभिचार’ कहने से मूल पाठ में बार-बार आने वाला prostitution/harlotry का अधिक स्पष्ट बिंब मंद पड़ जाता।
- source_word: soul
  choice: आत्मा
  rationale: भारतीय धार्मिक संदर्भ में सामान्य और गरिमापूर्ण शब्द; हिन्दी व्याकरण में स्त्रीलिंग होने के कारण मूल पाठ में आत्मा के स्त्री-रूपक को स्वाभाविक रूप से बनाए रखता है।
- source_word: perceptible realm
  choice: इंद्रियों से अनुभव होने वाला जगत
  rationale: ‘संवेद्य क्षेत्र’ की अपेक्षा साधारण पाठक के लिए स्पष्ट, जबकि दार्शनिक अर्थ सुरक्षित है।
- source_word: men great of flesh
  choice: भारी-भरकम देह वाले पुरुष
  rationale: असामान्य स्रोत-वाक्यांश की देहगत तीव्रता और संभावित द्व्यर्थता को किसी एक व्याख्या में सीमित किए बिना रखा गया है।
