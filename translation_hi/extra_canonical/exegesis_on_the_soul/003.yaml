lexical_decisions:
- source_word: womb
  choice: गर्भ
  rationale: रूपक और देहगत अर्थ दोनों को बनाए रखने के लिए सरल, प्रचलित शब्द; संदर्भ में यह गर्भाशय/प्रजनन-स्थान के अर्थ में है।
- source_word: outward kingdom
  choice: बाहरी राज्य
  rationale: रहस्यमय प्रतीकात्मक पद को व्याख्यात्मक रूप से सीमित किए बिना औपचारिक निकटता से रखा गया है।
- source_word: good character
  choice: उत्तम चरित्र
  rationale: नैतिक गुण या मूल दशा—दोनों की सम्भावना खुली रखता है।
- source_word: baptized / baptism
  choice: बपतिस्मा दिया जाता है / बपतिस्मा
  rationale: धार्मिक क्रिया के स्थापित हिन्दी रूप का प्रयोग किया गया है; इसे केवल स्नान या प्रतीकात्मक शुद्धि में सीमित नहीं किया गया।
- source_word: firstborn
  choice: पहलौठा
  rationale: जन्म-क्रम और सम्भावित धार्मिक पदवी दोनों को संरक्षित करने वाला पारंपरिक, बोधगम्य रूप।
- source_word: bridal chamber
  choice: विवाह-कक्ष
  rationale: पाठ की विवाह-संबंधी और सम्भावित अनुष्ठानिक प्रतिध्वनि बनाए रखते हुए स्वाभाविक हिन्दी।
- source_word: prostitution
  choice: वेश्यावृत्ति
  rationale: मूल की कठोर यौन-नैतिक भाषा को नरम किए बिना स्पष्ट रूप में प्रस्तुत करता है।
- source_word: adulterers
  choice: व्यभिचारी
  rationale: विवाहगत बेवफाई के अर्थ को बचाता है और इसे सामान्य यौन अनैतिकता मात्र नहीं बनाता।
theological_decisions:
- issue: आत्मा का स्त्रीलिंग व्यक्तित्व
  choice: आत्मा के लिए स्त्रीलिंग सर्वनाम और दुल्हन की छवि बनाए रखी गई
  alternative: लिंग-निरपेक्ष या पुल्लिंग व्याकरण
  rationale: अनुच्छेद का गर्भ, स्त्री, दुल्हन और दूल्हे पर आधारित विस्तृत रूपक स्त्रीलिंग व्यक्तित्व पर निर्भर है।
- issue: गर्भ का भीतर लौटना
  choice: रूपक को यथावत रखा गया
  alternative: इसे केवल नैतिक अन्तर्मुखता या आध्यात्मिक परिवर्तन के रूप में समझाकर अनुवाद करना
  rationale: पाठ की शारीरिक और ब्रह्माण्डीय भाषा में वास्तविक तनाव है; अनुवाद किसी एक सिद्धान्तगत अर्थ को आरोपित नहीं करता।
- issue: बपतिस्मा और शुद्धीकरण का सम्बन्ध
  choice: “यही उसका बपतिस्मा है” को प्रत्यक्ष रखा गया
  alternative: इसे मात्र बपतिस्मा का रूपक कहना
  rationale: पाठ स्वयं दोनों की पहचान कराता है; अनुवाद को इसकी धार्मिक शक्ति कम नहीं करनी चाहिए।
- issue: स्वर्ग से भेजा गया भाई और पहलौठा
  choice: पहचान को अनिर्दिष्ट रखा गया
  alternative: उसे स्पष्टतः मसीह, उद्धारकर्ता या किसी अन्य नाम से पहचानना
  rationale: इस अंश में नाम नहीं दिया गया; निजी या सांप्रदायिक पहचान जोड़ना अनुचित होगा।
- issue: पिता की इच्छा से पहले की क्षति
  choice: खंडित पाठ “[. . .]” सहित अधूरा रखा गया
  alternative: सन्दर्भ के आधार पर वाक्य पूरा करना
  rationale: पाण्डुलिपीय रिक्ति वास्तविक अर्थगत अनिश्चितता पैदा करती है, जिसे अनुमान से नहीं भरा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर स्पष्ट शैली अपनाई गई है। यौन और शारीरिक भाषा को मूल की स्पष्टता के अनुरूप रखा गया है, पर अनावश्यक अशिष्टता से बचा गया है। तकनीकी धार्मिक पदों में ‘बपतिस्मा’, ‘पहलौठा’ और ‘विवाह-कक्ष’ का प्रयोग किया गया है।
