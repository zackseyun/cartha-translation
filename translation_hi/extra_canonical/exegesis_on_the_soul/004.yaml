translation:
  language: hi
  text: 'क्योंकि वह विवाह दैहिक विवाह जैसा नहीं है। जो लोग एक-दूसरे के साथ शारीरिक संबंध बनाते हैं, वे उस प्रकार के संबंध से संतुष्ट हो जाते हैं। फिर वे शारीरिक वासना की परेशानी को मानो कोई बोझ समझकर पीछे छोड़ देते और एक-दूसरे से [मुँह फेर लेते] हैं। पर यह विवाह [भिन्न है]। जब वे [एक-दूसरे से] जुड़ते हैं, तो एक जीवन हो जाते हैं।


    [a] इसी कारण नबी ने पहले पुरुष और पहली स्त्री के विषय में कहा, “वे एक देह हो जाएँगे।” (उत्पत्ति 2:24)


    क्योंकि आरंभ में, जब वे पिता के साथ रहते थे, वे एक-दूसरे से जुड़े हुए थे—उस समय से पहले जब स्त्री ने उस पुरुष को, जो उसका भाई है, भटका दिया। इस विवाह ने उन्हें फिर से मिला दिया है, और आत्मा अपने सच्चे प्रिय, अपने मूल स्वामी से एक हो गई है; जैसा लिखा है, “क्योंकि स्त्री का स्वामी उसका पति है।” (उत्पत्ति 3:16; इफिसियों 5:23)


    तब वह धीरे-धीरे उसे पहचानने लगी और फिर आनंदित हुई। वह उसकी उपस्थिति में रोई, क्योंकि उसे विधवा होने की अपनी पिछली लज्जा याद आ गई थी। उसने अपने आपको और भी सँवारा, ताकि वह उसके साथ रहकर प्रसन्न हो।


    और नबी ने भजनों में कहा:


    “हे मेरी बेटी, सुन, देख और कान लगा;

    अपने लोगों और अपने पिता के घर को भूल जा।

    तब राजा तेरी सुंदरता की अभिलाषा करेगा,

    क्योंकि वही तेरा प्रभु है।” (भजन 45:10–11)


    क्योंकि वह उसे आज्ञा देता है कि वह अपने लोगों और अपने व्यभिचारियों की भीड़ से—जिनके बीच वह पहले रहती थी—अपनी दृष्टि फेर ले; केवल अपने राजा, अपने सच्चे प्रभु के प्रति समर्पित हो; और अपने सांसारिक पिता का घर भूल जाए, जहाँ उसकी दशा अत्यंत दयनीय थी। इसके बदले वह अपने उस पिता को स्मरण करे जो स्वर्ग में है।


    इसी के अनुसार अब्राहम से भी कहा गया था, “अपने देश, अपने कुटुंब और अपने पिता के घर से निकल जा।” (उत्पत्ति 12:1)


    इस प्रकार, जब आत्मा ने अपने तेज में फिर से [अपने आपको सँवार लिया], तब उसने अपने प्रिय की आराधना [करनी चाही], और [उसने भी] उससे प्रेम किया। जब वह उससे एक हुई, तो उसे उससे जीवन देनेवाली आत्मा का बीज [प्राप्त हुआ]। उसके द्वारा वह धर्मी संतानों को जन्म देती और उनका पालन-पोषण करती है, क्योंकि यही जन्म का महान और सिद्ध चमत्कार है। इस प्रकार यह विवाह पिता की इच्छा से पूरा होता है।


    यह उचित है कि आत्मा अपने आपको नया जन्म दे और फिर वही बन जाए जो वह पहले थी। तब आत्मा अपनी इच्छा से आगे बढ़ती है और अपने नवीकरण के लिए पिता से दिव्य स्वभाव पाती है, ताकि वह उस स्थान पर फिर पहुँच सके जहाँ वह आरंभ में थी:


    यही मरे हुओं में से पुनरुत्थान है।

    यही दासता से छुटकारा है।

    यही स्वर्ग की ओर ऊपर चढ़ने की यात्रा है।

    यही पिता की ओर आरोहण का मार्ग है।


    इसलिए नबी ने कहा:


    “हे मेरी आत्मा, प्रभु की स्तुति कर,

    और जो कुछ मेरे भीतर है, वह उसके पवित्र नाम की स्तुति करे।

    हे मेरी आत्मा, परमेश्वर की स्तुति कर,

    जो तेरे सभी अधर्म क्षमा करता है,

    जो तेरे सभी रोग चंगा करता है,

    जो तेरे जीवन को मृत्यु से छुड़ाता है,

    जो तुझे करुणा का मुकुट पहनाता है,

    जो तेरी अभिलाषा को उत्तम वस्तुओं से तृप्त करता है।

    तेरी जवानी उकाब की तरह नई हो जाएगी।” (भजन 103:1–5)


    फिर से जवान होने के बाद वह ऊपर चढ़ेगी और पिता तथा अपने उस भाई की स्तुति करेगी जिसने उसे बचाया। इस प्रकार नया जन्म पाने के द्वारा आत्मा बचाई जाती है। यह न तो सूत्रों को दोहराने से होता है, न विद्वतापूर्ण निपुणता से और न पुस्तकों से शिक्षा पाने से। बल्कि यह [आत्मा] के अनुग्रह से होता है; यह करुणामय [परमेश्वर] का वरदान है। इस स्वर्गीय वास्तविकता का मार्ग यही है।


    इसलिए उद्धारकर्ता पुकारकर कहता है: [b] “कोई मेरे पास नहीं आ सकता, जब तक मेरा पिता उसे खींचकर मेरे पास न लाए; और मैं उसे अंतिम दिन जिला उठाऊँगा।” (यूहन्ना 6:44)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि/साक्षी में आरंभ पर रिक्त या क्षतिग्रस्त अंश का संकेत है; उपलब्ध पाठ सीधे “इसी कारण” से आगे बढ़ता है।
    reason: मूल में दिए गए खाली वर्ग कोष्ठक को अर्थहीन दृश्य चिह्न के रूप में छोड़ने के बजाय पांडुलिपीय अभाव के रूप में दर्ज करना।
  - marker: b
    text: उद्धरण से ठीक पहले पांडुलिपि/साक्षी में एक रिक्त या क्षतिग्रस्त अंश का संकेत है।
    reason: मूल के दूसरे खाली वर्ग कोष्ठक का पारदर्शी संरक्षण।
lexical_decisions:
- source_word: carnal marriage
  choice: दैहिक विवाह
  rationale: ‘दैहिक’ शारीरिक/कामप्रधान विरोध को गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: one life
  choice: एक जीवन
  rationale: साक्षी के विशिष्ट रूपक को ‘एक प्राण’ या ‘एक व्यक्ति’ बनाकर व्याख्यायित नहीं किया गया।
- source_word: master
  choice: स्वामी
  rationale: वैवाहिक और आध्यात्मिक दोनों संदर्भों में मूल के अधिकार-संबंधी अर्थ को सुरक्षित रखता है।
- source_word: brother
  choice: भाई
  rationale: आत्मा के उद्धारकर्ता/प्रिय को ‘भाई’ कहने वाली असहज लेकिन वास्तविक धर्मवैचारिक भाषा को यथावत रखा गया।
- source_word: divine nature
  choice: दिव्य स्वभाव
  rationale: ईश्वरत्व में विलय जैसी अतिरिक्त व्याख्या से बचते हुए गुण/प्रकृति की अस्पष्टता बनाए रखी गई।
- source_word: regenerates herself
  choice: अपने आपको नया जन्म दे
  rationale: मध्यवाची/आत्मवाची अभिव्यक्ति को सुरक्षित रखा गया; इसे केवल निष्क्रिय ‘नया जन्म पाती है’ नहीं बनाया।
- source_word: life-giving spirit
  choice: जीवन देनेवाली आत्मा
  rationale: ‘spirit’ की व्यक्तिगत या अवैयक्तिक पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: आत्मा और प्रिय का विवाह
  choice: विवाह और एकता की रूपक-भाषा प्रत्यक्ष रखी गई
  alternative: इसे केवल ‘आध्यात्मिक संगति’ कहना
  rationale: मूल साक्षी दैहिक विवाह और इस विवाह के बीच स्पष्ट तनाव स्थापित करता है; उसे नरम करना उचित नहीं।
- issue: स्त्री द्वारा अपने भाई पुरुष को भटकाना
  choice: ‘उस पुरुष को, जो उसका भाई है’
  alternative: इसे आदम-हव्वा के सामान्य संबंध के अनुरूप बदलना
  rationale: साक्षी की असामान्य नातेदारी-भाषा को संप्रदायगत सामंजस्य के लिए नहीं बदला गया।
- issue: आत्मा का स्वयं को नया जन्म देना और पिता से दिव्य स्वभाव पाना
  choice: दोनों अभिकरणों को साथ बनाए रखा
  alternative: पुनर्जन्म को केवल परमेश्वर का एकतरफा कार्य बताना
  rationale: पाठ मानवीय इच्छा और पिता के वरदान दोनों को तनाव में रखता है।
- issue: Spirit और God की पुनर्स्थापना
