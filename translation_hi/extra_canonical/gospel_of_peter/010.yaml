base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: hi
  text: '(38) जब उन सैनिकों ने यह देखा, तो उन्होंने सूबेदार और पुरनियों को जगा दिया, क्योंकि वे भी वहीं पहरा दे रहे थे। (39) जब सैनिक उन्हें बता रहे थे कि उन्होंने क्या देखा था, तभी उन्होंने फिर तीन पुरुषों को कब्र से बाहर आते देखा। उनमें से दो तीसरे को सहारा दे रहे थे, और एक क्रूस उनके पीछे-पीछे आ रहा था। (40) उन दोनों के सिर स्वर्ग तक पहुँच रहे थे, पर जिसे वे ले जा रहे थे उसका सिर स्वर्गों से भी परे पहुँच रहा था।


    (41) और उन्होंने स्वर्गों से एक आवाज़ सुनी, जो कह रही थी, “क्या तुमने सोए हुओं को घोषणा कर दी है?”[a]


    (42) और क्रूस की ओर से उत्तर सुनाई दिया, “हाँ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सोए हुए” मृतकों के लिए रूपक हो सकता है। पाठ यह स्पष्ट नहीं करता कि घोषणा का विषय क्या था।
    reason: मूल अभिव्यक्ति की वास्तविक अस्पष्टता और उसके संभावित धार्मिक अर्थ को पाठक के लिए दृश्यमान रखना।
lexical_decisions:
- source_word: centurion
  choice: सूबेदार
  rationale: रोमी सैन्य पद के लिए प्रचलित और सामान्य पाठकों को समझ आने वाला हिन्दी बाइबलीय पद; यह सौ सैनिकों से संबद्ध अधिकारी का संकेत देता है।
- source_word: elders
  choice: पुरनियों
  rationale: धार्मिक-सामुदायिक अगुओं के अर्थ को बनाए रखने वाला परिचित बाइबलीय शब्द।
- source_word: tomb
  choice: कब्र
  rationale: आधुनिक सामान्य हिन्दी में स्वाभाविक और स्पष्ट शब्द।
- source_word: supporting
  choice: सहारा दे रहे थे
  rationale: दृश्य की अस्पष्टता बनाए रखता है—वे उसे थामे या चलने में सहारा दे रहे हैं—बिना कोई अतिरिक्त कारण बताए।
- source_word: heaven / the heavens
  choice: स्वर्ग / स्वर्गों
  rationale: प्रदान किए गए साक्ष्य में एकवचन और बहुवचन के जानबूझकर रखे गए भेद को हिन्दी में सुरक्षित रखा गया है।
- source_word: those who sleep
  choice: सोए हुओं
  rationale: मृतकों के लिए प्रयुक्त रूपक को सीधे 'मरे हुओं' में बदलने के बजाय मूल चित्रात्मकता और संभावित धार्मिक अर्थ बनाए रखे गए हैं।
- source_word: cross
  choice: क्रूस
  rationale: आरंभिक मसीही साहित्य के संदर्भ में मानक और प्रतिष्ठित हिन्दी पद।
theological_decisions:
- issue: सोए हुओं को की गई घोषणा का आशय
  choice: “क्या तुमने सोए हुओं को घोषणा कर दी है?”
  alternative: “क्या तुमने मृतकों को सुसमाचार सुना दिया है?”
  rationale: पाठ न तो स्पष्ट रूप से 'मृतक' कहता है, न घोषणा की विषयवस्तु को 'सुसमाचार' बताता है; इसलिए रूपक और धार्मिक तनाव दोनों सुरक्षित रखे गए हैं।
- issue: क्रूस का उत्तर देना
  choice: “क्रूस की ओर से उत्तर सुनाई दिया”
  alternative: “क्रूस ने उत्तर दिया”
  rationale: साक्ष्य के निष्क्रिय वाक्य-विन्यास को बनाए रखते हुए यह नहीं तय किया गया कि क्रूस स्वयं बोलता है या उत्तर उसकी दिशा से आता है।
- issue: आकाशीय कद का वर्णन
  choice: सिरों का स्वर्ग तक और स्वर्गों से परे पहुँचना
  alternative: इसे प्रतीकात्मक महिमा के रूप में व्याख्यायित करना
  rationale: असाधारण दृश्य को बिना रूपकात्मक या सिद्धान्तगत व्याख्या जोड़े प्रत्यक्ष कथन के रूप में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यह प्रारूप उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि की प्रत्यक्ष समीक्षा अभी लंबित है। पद-संख्या और ‘स्वर्ग/स्वर्गों’ का भेद सुरक्षित रखा गया है।
