base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: hi
  text: '(10) वे दो अपराधियों को लाए और उनके बीच प्रभु को क्रूस पर चढ़ाया; पर वह ऐसे मौन रहा, मानो उसे कोई पीड़ा न हो। (11) जब उन्होंने क्रूस खड़ा किया, तो उस पर लिखा, “यह इस्राएल का राजा है।” (12) उसके वस्त्र उसके सामने रखकर उन्होंने उन्हें आपस में बाँट लिया और उनके लिए चिट्ठियाँ डालीं।


    (13) पर उन अपराधियों में से एक ने उन्हें फटकारते हुए कहा, “हमने जो अपराध किया है, उसके कारण हम इस तरह दुःख भोग रहे हैं; पर इसने, जो मानवजाति का उद्धारकर्ता बना, तुम्हारा क्या बिगाड़ा है?”


    (14) वे उस पर क्रोधित हो गए। उन्होंने आदेश दिया कि टाँगें न तोड़ी जाएँ,[a] ताकि वह यातना सहते हुए मर जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह स्पष्ट नहीं है कि किनकी टाँगें न तोड़ने का आदेश दिया गया था।
    reason: स्रोत में संबंध अस्पष्ट है और कथानक में एक से अधिक संभावित व्यक्ति हैं।
lexical_decisions:
- source_word: wrongdoers
  choice: अपराधी
  rationale: यह सामान्य, स्वाभाविक और नैतिक-कानूनी अर्थ वाला शब्द है; यह अपराध की विशिष्ट प्रकृति को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: the Lord
  choice: प्रभु
  rationale: कथात्मक संदर्भ में पारंपरिक और गरिमापूर्ण संबोधन को सुरक्षित रखता है।
- source_word: silent as if having no pain
  choice: ऐसे मौन रहा, मानो उसे कोई पीड़ा न हो
  rationale: मूल तुलना को बनाए रखते हुए यह दावा नहीं करता कि वास्तव में कोई पीड़ा थी ही नहीं।
- source_word: Savior of humanity
  choice: मानवजाति का उद्धारकर्ता
  rationale: सार्वभौमिक मानवीय दायरे और उद्धार-संबंधी उपाधि, दोनों को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: die tortured
  choice: यातना सहते हुए मर जाए
  rationale: उद्देश्यसूचक वाक्य और पीड़ादायक मृत्यु का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु की पीड़ा का वर्णन
  choice: “मानो उसे कोई पीड़ा न हो”
  alternative: “जैसे उसे दर्द महसूस ही नहीं हो रहा था”
  rationale: तुलनात्मक ‘मानो’ मूल कथन की प्रतीयमानता और संभावित धार्मिक तनाव को बचाता है; यह पीड़ा के वास्तविक अभाव को सिद्ध तथ्य नहीं बनाता।
- issue: मानवजाति का उद्धारकर्ता ‘बना’
  choice: “जो मानवजाति का उद्धारकर्ता बना”
  alternative: “जो मानवजाति का उद्धारकर्ता है”
  rationale: स्रोत-साक्ष्य में दिए गए ‘having become’ को समतल करके स्थिर उपाधि में नहीं बदला गया, जिससे पाठ की असामान्य कालगत अभिव्यक्ति सुरक्षित रहती है।
- issue: किनकी टाँगें न तोड़ने का आदेश था
  choice: कर्ता अथवा संबंध स्पष्ट किए बिना “टाँगें न तोड़ी जाएँ”
  alternative: “उसकी टाँगें न तोड़ी जाएँ”
  rationale: उपलब्ध साक्ष्य में संदर्भ अस्पष्ट है; अनुवाद किसी एक व्यक्ति को मनमाने ढंग से निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है। वाक्य 14 में मूल अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
