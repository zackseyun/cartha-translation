  english_witness: '(28) And the scribes, the Pharisees, and the elders gathered together with one another, having heard that all the people were grumbling, beating their chests, and saying, "If at his death these greatest signs have happened, see how just he was!"


    (29) The elders were afraid, and went to Pilate, begging him and saying, (30) "Give us soldiers, that we may guard his grave for three days, lest his disciples come and steal him, and the people think that he rose from the dead, and do us wrong."


    (31) And Pilate gave them Petronius the centurion, with soldiers to guard the tomb. And elders and scribes went with them to the grave. (32) And having rolled a great stone to the centurion and the soldiers, all who were there placed it at the door of the grave. (33) And they put seven seals on it, and having pitched a tent there, they kept watch.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: hi
  text: '(28) शास्त्री, फरीसी और पुरनिए आपस में इकट्ठे हुए। उन्होंने सुना था कि सभी लोग कुड़कुड़ा रहे थे, अपनी छाती पीट रहे थे और कह रहे थे, “यदि उसकी मृत्यु के समय ऐसे महानतम चिन्ह हुए हैं, तो देखो, वह कितना धर्मी था!”


    (29) पुरनिए डर गए और पिलातुस के पास जाकर उससे विनती करने लगे। उन्होंने कहा, (30) “हमें सैनिक दे दीजिए, ताकि हम तीन दिन तक उसकी कब्र की रखवाली कर सकें। कहीं ऐसा न हो कि उसके चेले आकर उसे चुरा ले जाएँ और लोग समझें कि वह मरे हुओं में से जी उठा है, और हमारे साथ बुरा करें।”


    (31) तब पिलातुस ने कब्र की रखवाली के लिए उन्हें सूबेदार पेत्रोनियुस और उसके साथ सैनिक दिए। पुरनिए और शास्त्री भी उनके साथ कब्र पर गए। (32) वहाँ उपस्थित सभी लोगों ने एक बड़ा पत्थर लुढ़काकर सूबेदार और सैनिकों के पास पहुँचाया और उसे कब्र के द्वार पर लगा दिया।[a] (33) उन्होंने उस पर सात मुहरें लगाईं, वहीं एक तंबू खड़ा किया और पहरा देते रहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य का वाक्य-विन्यास असामान्य है और शाब्दिक रूप से पत्थर को “सूबेदार और सैनिकों के पास” लुढ़काने की बात कहता है। यहाँ उस क्रम को बनाए रखते हुए स्वाभाविक हिंदी दी गई है। यूनानी मूल-पाठ की प्रत्यक्ष समीक्षा अभी बाकी है।
    reason: आधार-साक्ष्य की असामान्य और संभवतः संदिग्ध संरचना को छिपाने के बजाय पाठक के सामने रखना।
lexical_decisions:
- source_word: scribes
  choice: शास्त्री
  rationale: दूसरे मंदिर-कालीन यहूदी धार्मिक और विधिक लेखन-विशेषज्ञों के लिए प्रचलित, सहज बाइबलीय पद।
- source_word: elders
  choice: पुरनिए
  rationale: समुदाय के मान्य वरिष्ठ अगुओं का अर्थ रखने वाला पारंपरिक किंतु समझने योग्य शब्द; केवल आयु का संकेत देने वाले ‘बुज़ुर्ग’ से अधिक संस्थागत अर्थ व्यक्त करता है।
- source_word: grumbling
  choice: कुड़कुड़ा रहे थे
  rationale: असंतोष या व्यथा में धीमे स्वर से शिकायत करने की क्रिया को स्वाभाविक हिंदी में रखता है।
- source_word: just
  choice: धर्मी
  rationale: नैतिक निर्दोषता और धार्मिक न्यायपरायणता दोनों की संभावित छाया बनाए रखता है; केवल ‘निर्दोष’ कहकर अर्थ को सीमित नहीं करता।
- source_word: grave / tomb
  choice: कब्र
  rationale: दफनाने के स्थान के लिए आधुनिक पाठक को सहज शब्द; प्रसंग में शिलाखंड से बंद कब्र का बोध बना रहता है।
- source_word: centurion
  choice: सूबेदार
  rationale: रोमी सैन्य अधिकारी की लगभग सौ सैनिकों पर कमान को पाठक-सुलभ पारंपरिक समतुल्य से व्यक्त करता है; व्यक्ति का नाम पेत्रोनियुस यथावत रखा गया है।
- source_word: rose from the dead
  choice: मरे हुओं में से जी उठा है
  rationale: पुनरुत्थान के दावे को स्पष्ट करता है और मूल की धार्मिक अभिव्यक्ति बनाए रखता है।
- source_word: seven seals
  choice: सात मुहरें
  rationale: सुरक्षा और छेड़छाड़ का पता लगाने के लिए लगाई गई आधिकारिक मुहरों का सीधा अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के लिए ‘just’ का आशय
  choice: धर्मी
  alternative: निर्दोष
  rationale: ‘धर्मी’ नैतिक और धार्मिक दोनों आयामों को खुला रखता है और कथन को केवल कानूनी निर्दोषता तक सीमित नहीं करता।
- issue: लोगों की संभावित धारणा कि वह जी उठा
  choice: इसे पात्रों की आशंका के रूप में प्रस्तुत किया गया है
  alternative: कथावाचक की ओर से पुनरुत्थान की प्रत्यक्ष पुष्टि
  rationale: इस वाक्य में बोलने वाले पुरनिए हैं; अनुवाद उनके भय को कथावाचक के स्वतंत्र धर्मवैज्ञानिक दावे में नहीं बदलता।
- issue: महान चिन्हों और धार्मिकता का संबंध
  choice: शर्तसूचक ‘यदि…तो देखो’ संरचना सुरक्षित रखी गई
  alternative: चिन्हों को उसकी धार्मिकता का निर्विवाद प्रमाण बताना
  rationale: उद्धृत जनसमूह की तर्कपूर्ण विस्मय-अभिव्यक्ति और उसकी वास्तविक वाक्यगत अनिश्चितता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सहज शैली अपनाई गई है। पद-संख्या सुरक्षित रखी गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण विशेषतः पद 32 की संरचना को सावधानी से और पादटिप्पणी सहित प्रस्तुत किया गया है।
