review_pass:
  verdict: revise
  source_fidelity: मसौदा अधिकांशतः दिए गए अंग्रेज़ी गवाह के अनुरूप है, पर “अब वह हमारे अधिकार में है” में ‘अब’ जोड़ा गया है, जो गवाह में नहीं है। “मुँह” के स्थान पर ‘चेहरा’ आवश्यक है, और “ऐसा ही सम्मान” की अपेक्षा ‘इसी सम्मान के साथ’ ‘With this honor’ को अधिक निकटता से व्यक्त करता है। ‘बैठाकर’ तथा ‘बैंगनी वस्त्र पहनाया’ भी चल सकते हैं, किंतु गवाह की चल रही क्रियाओं को ‘बैठाया’ और ‘पहना रहे थे’ से अधिक साफ़ रखा गया है। प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण यह समीक्षा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी गवाह के प्रति सीमित है।
