  revised_text: 'और उसने उनके अख़मीरी रोटी के पर्व के पहले दिन से पहले ही उसे लोगों के हवाले कर दिया। (6) प्रभु को पकड़ने वाले उसे धकेलते हुए दौड़े जा रहे थे और कह रहे थे, “आओ, परमेश्वर के पुत्र को घसीटें; हम उस पर अधिकार रखते हैं!”


