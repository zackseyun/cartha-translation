  terminology: ‘प्रभु’, ‘परमेश्वर का पुत्र’, ‘अख़मीरी रोटी का पर्व’, ‘बैंगनी वस्त्र’, ‘न्यायासन’, और ‘काँटों का मुकुट’ उपयुक्त और सुसंगत हैं। ‘हम उसका अधिकार रखते हैं’ के बजाय ‘हम उस पर अधिकार रखते हैं’ हिन्दी में स्वाभाविक है और स्रोत के ‘having authority over him’ को बिना अतिरिक्त कालगत अर्थ के रखता है।
