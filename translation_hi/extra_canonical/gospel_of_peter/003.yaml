  yaml_path: translation/extra_canonical/gospel_of_peter/003.yaml
  text: 'And he handed him over to the people before the first day of their festival of the Unleavened Bread. (6) And those having taken the Lord were running, pushing him, and saying, “Let’s drag the Son of God, having authority over him!”


    (7) And they were clothing him with purple, and sat him on the seat of judgment, saying, “Judge justly, king of Israel!” (8) And one of them brought a thorn crown and placed it on the Lord’s head.


    (9) And other bystanders were spitting in his face, and others slapped his cheeks. Others were piercing him with a reed, and some were scourging him, saying, “With this honor, let’s honor the Son of God!”'
translation:
  language: hi
  text: 'और उसने उनके अख़मीरी रोटी के पर्व के पहले दिन से पूर्व ही उसे लोगों के हवाले कर दिया। (6) तब वे प्रभु को पकड़कर धक्के देते हुए दौड़े जा रहे थे और कह रहे थे, “आओ, परमेश्वर के पुत्र को घसीटें—अब वह हमारे अधिकार में है!”


    (7) उन्होंने उसे बैंगनी वस्त्र पहनाया और न्याय-आसन पर बैठाकर कहा, “हे इस्राएल के राजा, न्यायपूर्वक न्याय कर!” (8) उनमें से एक काँटों का मुकुट लाया और उसे प्रभु के सिर पर रख दिया।


    (9) वहाँ खड़े कुछ लोग उसके मुँह पर थूक रहे थे और दूसरे उसके गालों पर थप्पड़ मार रहे थे। कुछ सरकंडे से उसे कोंच रहे थे और कुछ उसे कोड़े मारते हुए कह रहे थे, “आओ, परमेश्वर के पुत्र का ऐसा ही सम्मान करें!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Unleavened Bread
  choice: अख़मीरी रोटी का पर्व
  rationale: साधारण आधुनिक हिन्दी में पर्व का आशय स्पष्ट करता है और रोटी में खमीर न होने का अर्थ बनाए रखता है।
- source_word: the Lord
  choice: प्रभु
  rationale: प्रारंभिक मसीही कथात्मक संदर्भ में स्वाभाविक और प्रतिष्ठित संबोधन।
- source_word: purple
  choice: बैंगनी वस्त्र
  rationale: रंग-सूचक मूल अर्थ को बनाए रखते हुए हिन्दी में वस्त्र पहनाने की क्रिया स्वाभाविक बनाता है।
- source_word: seat of judgment
  choice: न्याय-आसन
  rationale: न्याय करने के आधिकारिक आसन का संक्षिप्त, पारदर्शी अनुवाद।
- source_word: reed
  choice: सरकंडा
  rationale: प्रहार या कोंचने के लिए प्रयुक्त खोखले डंठल का सामान्य हिन्दी नाम।
- source_word: scourging
  choice: कोड़े मारना
  rationale: शारीरिक दंड की क्रिया को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: having authority over him
  choice: अब वह हमारे अधिकार में है
  alternative: हमें उस पर अधिकार मिला है
  rationale: उपहास करने वालों के अस्थायी नियंत्रण का भाव रखता है, बिना किसी स्थायी या परम धार्मिक अधिकार का दावा जोड़े।
- issue: Judge justly, king of Israel!
  choice: हे इस्राएल के राजा, न्यायपूर्वक न्याय कर!
  alternative: इस्राएल के राजा, ठीक न्याय कर!
  rationale: व्यंग्यात्मक राजकीय और न्यायिक संबोधन को सुरक्षित रखता है; कथाकार की ओर से दावे की पुष्टि नहीं करता।
- issue: With this honor, let’s honor the Son of God!
  choice: आओ, परमेश्वर के पुत्र का ऐसा ही सम्मान करें!
  alternative: परमेश्वर के पुत्र को यह सम्मान दें!
  rationale: क्रूर व्यंग्य और ‘सम्मान’ शब्द की विडंबना को जानबूझकर बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली। पद-संख्याएँ गवाह के अनुसार रखी गई हैं। उपलब्ध सामग्री स्वयं सार्वजनिक-डोमेन अंग्रेज़ी गवाह है और यूनानी स्रोत की समीक्षा लंबित है; इसलिए यह मसौदा अस्थायी, स्रोत-समीक्षा-योग्य अनुवाद है। अंग्रेज़ी के ‘running, pushing him’ को दृश्य की गति बनाए रखने के लिए ‘धक्के देते हुए दौड़े जा रहे थे’ और ‘piercing ... with a reed’ को अनिश्चित हिंसक क्रिया के रूप में ‘सरकंडे से ... कोंच रहे थे’ किया गया है।
