  text: (58) Now it was the last day of Unleavened Bread, and many people were leaving and returning to their homes because the festival was over. (59) But we, the Lord’s twelve disciples, were weeping and grieving, and each of us returned home, grieving because of what had happened. (60) But I, Simon Peter, and my brother Andrew took our nets and went to the sea. Levi, the son of Alphaeus, was with us, whom the Lord . . .
translation:
  language: hi
  text: (58) अब अख़मीरी रोटी के पर्व का अंतिम दिन था। पर्व समाप्त हो चुका था, इसलिए बहुत-से लोग वहाँ से निकलकर अपने घर लौट रहे थे। (59) पर हम, प्रभु के बारह चेले, रोते और शोक करते रहे; और जो कुछ हुआ था उसके कारण दुखी होकर हममें से हर एक अपने घर लौट गया। (60) पर मैं, शमौन पतरस, और मेरा भाई अन्द्रियास अपने जाल लेकर समुद्र की ओर चले गए। हलफई का पुत्र लेवी भी हमारे साथ था, जिसे प्रभु ने…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध पांडुलिपि का पाठ अधूरा समाप्त हो जाता है। यह अनुवाद सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; यूनानी मूल-पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: पाठ के वास्तविक अपूर्ण अंत और वर्तमान स्रोत-सीमा को पारदर्शी बनाना।
lexical_decisions:
- source_word: Unleavened Bread
  choice: अख़मीरी रोटी का पर्व
  rationale: यहूदी पर्व का आशय स्पष्ट करने के लिए ‘पर्व’ जोड़ा गया और सामान्य आधुनिक हिन्दी में बिना खमीर की रोटी के लिए संक्षिप्त, प्रचलित पद चुना गया।
- source_word: disciples
  choice: चेले
  rationale: साधारण आधुनिक पाठकों के लिए सहज और पारंपरिक बाइबलीय संबोधन; गुरु-शिष्य संबंध का भाव बनाए रखता है।
- source_word: sea
  choice: समुद्र
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के सामान्य पद को बिना किसी विशिष्ट जलाशय की पहचान जोड़े सुरक्षित रखा गया।
- source_word: grieving
  choice: शोक करते / दुखी होकर
  rationale: दोहराव का अर्थ बनाए रखते हुए स्वाभाविक हिन्दी के लिए संदर्भानुसार दो निकटवर्ती अभिव्यक्तियाँ प्रयुक्त की गईं।
theological_decisions:
- issue: ‘प्रभु के बारह चेले’ की सामूहिक पहचान
  choice: पाठ के अनुसार ‘हम, प्रभु के बारह चेले’ रखा गया
  alternative: ऐतिहासिक या सामंजस्यकारी कारणों से संख्या अथवा समूह की व्याख्या बदलना
  rationale: साक्ष्य में उपस्थित तनाव को बिना अन्य सुसमाचारों से समरूप किए ज्यों का त्यों सुरक्षित रखा गया।
- issue: अधूरे अंतिम संबंधवाचक वाक्य का अर्थ
  choice: ‘जिसे प्रभु ने…’ के रूप में अधूरा रखा गया
  alternative: अनुमान से कोई क्रिया या बुलाहट पूरी करना
  rationale: पांडुलिपि का अंत अपूर्ण है; पाठ से परे जाकर अर्थ पूरा करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथात्मक प्रवाह के लिए वाक्य-विन्यास स्वाभाविक हिन्दी में ढाला गया है, जबकि संख्या, नाम, शोक की पुनरावृत्ति और पांडुलिपि का अपूर्ण अंत सुरक्षित रखे गए हैं।
