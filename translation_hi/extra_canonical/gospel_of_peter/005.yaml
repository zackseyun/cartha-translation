  naturalness: ‘खट्टी दाखमधु’ और ‘पित्त’ गरिमापूर्ण कथात्मक रजिस्टर में स्वीकार्य हैं। ‘उनके लिए लिखा है’ के बजाय ‘लिखा है’ अधिक स्वाभाविक है और उपलब्ध साक्ष्य के असामान्य वाक्य-विन्यास पर अनावश्यक व्याख्या नहीं थोपता।
