base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: hi
  text: '(15) दोपहर का समय था, और सारे यहूदिया पर अँधेरा छाया हुआ था। वे घबरा गए और व्याकुल थे कि कहीं उसके जीवित रहते ही सूर्य अस्त न हो जाए। उनके लिए लिखा है, “जो मार डाला गया हो, उस पर सूर्य अस्त न हो।” (16) उनमें से एक ने कहा, “उसे खट्टी दाखमधु में पित्त मिलाकर पीने को दो।” उन्होंने उसे मिलाया और पीने को दिया। (17) उन्होंने सब कुछ पूरा किया और अपने सिर पर पापों का ढेर लगा लिया। (18) बहुत-से लोग यह समझकर कि रात हो गई है, दीये लिए इधर-उधर घूम रहे थे, और कुछ गिर पड़े।


    (19) प्रभु ने पुकारकर कहा, “मेरी सामर्थ्य, हे सामर्थ्य, तूने मुझे छोड़ दिया!” जब उसने यह कहा, तो वह ऊपर उठा ली गई।[a] (20) उसी घड़ी यरूशलेम के मंदिर का परदा फटकर दो भाग हो गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह ऊपर उठा ली गई।” इसका संकेत संभवतः अभी कही गई “सामर्थ्य” की ओर है, पर संदर्भ निश्चित नहीं है।
    reason: मूल कथन के कर्ता का संदर्भ अस्पष्ट है और इसका धर्मवैज्ञानिक अर्थ महत्त्वपूर्ण हो सकता है।
lexical_decisions:
- source_word: darkness held fast over all Judea
  choice: सारे यहूदिया पर अँधेरा छाया हुआ था
  rationale: मुहावरेदार आधुनिक हिन्दी में अँधेरे के पूरे प्रदेश पर बने रहने का भाव व्यक्त करता है।
- source_word: bile with sour wine
  choice: खट्टी दाखमधु में पित्त
  rationale: दोनों पदार्थों को अलग रखते हुए मिश्रण का अर्थ स्पष्ट किया गया है; ‘दाखमधु’ प्राचीन पेय के लिए गरिमापूर्ण और सहज शब्द है।
- source_word: My Power, the Power
  choice: मेरी सामर्थ्य, हे सामर्थ्य
  rationale: असामान्य संबोधन और उसकी पुनरावृत्ति को सामान्य क्रूस-वचन में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: veil of the temple
  choice: मंदिर का परदा
  rationale: सामान्य पाठक के लिए स्वाभाविक शब्दावली है और मंदिर के आंतरिक परदे का संकेत बनाए रखती है।
theological_decisions:
- issue: ‘it was taken up’ में सर्वनाम का संदर्भ
  choice: ‘वह ऊपर उठा ली गई’—निकटतम स्त्रीलिंग संज्ञा ‘सामर्थ्य’ से संभावित संबंध रखते हुए अस्पष्टता को टिप्पणी सहित सुरक्षित रखा
  alternative: ‘उसका प्राण उठा लिया गया’ अथवा ‘उसे ऊपर उठा लिया गया’
  rationale: साक्ष्य यह स्पष्ट नहीं करता कि ऊपर क्या उठाया गया; ‘प्राण’ जोड़ना या इसे सीधे प्रभु पर लागू करना व्याख्यात्मक निर्णय होता।
- issue: ‘My Power, the Power’ की पहचान
  choice: इसे सीधे परमेश्वर, आत्मा या किसी अन्य धर्मवैज्ञानिक सत्ता के रूप में नहीं पहचाना गया
  alternative: ‘मेरे परमेश्वर, मेरे परमेश्वर’ जैसे समानांतर सुसमाचारों के शब्द
  rationale: इस रचना की विशिष्ट शब्दावली और धर्मवैज्ञानिक तनाव को बनाए रखना आवश्यक है।
- issue: ‘fulfilled all things’ का आशय
  choice: ‘उन्होंने सब कुछ पूरा किया’
  alternative: ‘उन्होंने सभी भविष्यवाणियाँ पूरी कीं’
  rationale: मूल वाक्य में भविष्यवाणियों का स्पष्ट उल्लेख नहीं है, इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
