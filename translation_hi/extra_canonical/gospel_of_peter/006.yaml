  source_fidelity: पद 21, 22 और 24 मूलतः अंग्रेज़ी साक्ष्य के प्रति निष्ठावान हैं। पद 23 में मसौदे का मुख्य पाठ ‘उसने’ को यूसुफ़ और ‘उनके’ को प्रभु के लिए समझता है, जो कथानकानुकूल है; पर पादटिप्पणी में दिया वैकल्पिक अर्थ (‘यहूदियों ने यूसुफ़ के...’) एकवचन सर्वनाम के कारण अंग्रेज़ी साक्ष्य से समर्थित नहीं है। ‘linen’ के लिए ‘मलमल’ अत्यधिक विशिष्ट है; साक्ष्य केवल सन/लिनन का वस्त्र कहता है।
  naturalness: ‘दिन का नौवाँ पहर’ आधुनिक हिन्दी में नौवें घंटे का सही समतुल्य नहीं है, क्योंकि ‘पहर’ सामान्यतः लगभग तीन घंटे की अवधि है। ‘नौवाँ घंटा’ अधिक सटीक और सहज है। ‘सन के कपड़े’ तथा ‘कफ़न के कपड़े’ जैसे शब्दों में से ‘सन के कपड़े’ सामग्री को सुरक्षित रखता है और स्वाभाविक है।
  terminology: ‘प्रभु’, ‘यूसुफ़’, ‘यहूदी’, ‘कब्र’, और स्थान-नाम ‘यूसुफ़ का बाग़’ उपयुक्त हैं। आदरसूचक ‘उन्हें/उनका’ निरंतर और स्वाभाविक है।
