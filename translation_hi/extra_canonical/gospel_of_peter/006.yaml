base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: hi
  text: '(21) तब उन्होंने प्रभु के हाथों से कीलें निकालीं और उन्हें धरती पर लिटा दिया। सारी धरती काँप उठी, और बड़ा भय छा गया।


    (22) तब सूर्य चमका, और पता चला कि दिन का नौवाँ पहर था।[a] (23) यहूदी आनन्दित हुए और उन्होंने यूसुफ़ को उनका शरीर दफ़नाने के लिए दे दिया, क्योंकि उसने उनके किए हुए सभी भले काम देखे थे।[b] (24) प्रभु को ले जाकर यूसुफ़ ने उन्हें धोया, मलमल के कपड़े में लपेटा और अपनी ही कब्र में ले गया, जो “यूसुफ़ का बाग़” कहलाती थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात लगभग दोपहर तीन बजे।
    reason: प्राचीन यहूदी-रोमी दिन-गणना से अपरिचित पाठकों के लिए समय स्पष्ट करना।
  - marker: b
    text: इस वाक्य के सर्वनाम अस्पष्ट हैं; इसका अर्थ यह भी हो सकता है कि यहूदियों ने यूसुफ़ के किए हुए सभी भले काम देखे थे। उपलब्ध आधार-पाठ अंग्रेज़ी अनुवाद-साक्ष्य है; यूनानी स्रोत की सीधी समीक्षा अभी बाकी है।
    reason: साक्ष्य में मौजूद व्याकरणिक अस्पष्टता और वर्तमान पाठाधार की सीमा को ईमानदारी से सुरक्षित रखना।
lexical_decisions:
- source_word: the ninth hour
  choice: दिन का नौवाँ पहर
  rationale: प्राचीन समय-सूचक अभिव्यक्ति को बनाए रखते हुए ‘दिन का’ जोड़ने से आधुनिक हिन्दी पाठक के लिए अर्थ स्पष्ट होता है।
- source_word: linen
  choice: मलमल का कपड़ा
  rationale: दफ़न-संस्कार में प्रयुक्त महीन सन के वस्त्र का स्वाभाविक हिन्दी संकेत; केवल ‘कपड़ा’ से सामग्री का भाव खो जाता।
- source_word: tomb
  choice: कब्र
  rationale: शव रखने के स्थान के लिए सामान्य, आधुनिक और सहज हिन्दी शब्द।
- source_word: Joseph's Garden
  choice: यूसुफ़ का बाग़
  rationale: स्थान के पारंपरिक नाम का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: पद 23 में सर्वनामों का संदर्भ
  choice: ‘उसने उनके किए हुए सभी भले काम देखे थे’
  alternative: ‘उन्होंने उसके किए हुए सभी भले काम देखे थे’ अथवा स्पष्ट नाम जोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में सर्वनाम संदिग्ध हैं। मुख्य पाठ निकटतम संभावित वाचन देता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: यीशु के लिए आदरसूचक सर्वनाम
  choice: ‘उन्हें/उनका’
  alternative: ‘उसे/उसका’
  rationale: आधुनिक dignified हिन्दी में ‘प्रभु’ के संदर्भ में आदरसूचक बहुवचन स्वाभाविक है; इससे पाठ में कोई अतिरिक्त सिद्धान्त नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘धरती’ की पुनरावृत्ति मूल साक्ष्य के ‘earth’ संबंध को बनाए रखती है। यह मसौदा उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित है; अख़मीम यूनानी पांडुलिपि की प्रत्यक्ष समीक्षा लंबित होने के कारण पद 23 विशेष रूप से अस्थायी है।
