    rationale: ‘यहूदियों ने यूसुफ़ के किए हुए...’ अंग्रेज़ी साक्ष्य के एकवचन ‘he’ को बहुवचन कर्ता में बदलता है। अस्पष्टता का उल्लेख किया जा सकता है, पर ऐसा असमर्थित वैकल्पिक पाठ नहीं देना चाहिए।
