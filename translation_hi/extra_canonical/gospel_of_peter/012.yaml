base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: hi
  text: '(50) प्रभु के दिन भोर होते ही, प्रभु की शिष्या मरियम मगदलीनी अपने साथ अपनी सहेलियों को लेकर चली। यहूदियों के भय से—क्योंकि वे क्रोध से भरे हुए थे—वह प्रभु की कब्र पर वह नहीं कर पाई थी जो स्त्रियाँ अपने मृत प्रियजनों के लिए रीति के अनुसार करती हैं।[a]


    (51) वह अपनी सहेलियों के साथ उस कब्र पर गई जहाँ उसे रखा गया था। (52) वे इस डर में थीं कि कहीं यहूदी उन्हें देख न लें। वे आपस में कह रही थीं, “जिस दिन उसे क्रूस पर चढ़ाया गया था, उस दिन हम रो और विलाप नहीं कर पाईं; शायद अब उसकी कब्र पर ऐसा कर सकें। (53) लेकिन कब्र के द्वार पर रखा हुआ पत्थर हमारे लिए कौन लुढ़काएगा, ताकि हम भीतर जाकर उसके पास बैठें और जो करना हमारा कर्तव्य है वह करें? (54) पत्थर बहुत बड़ा है, और हमें डर है कि कहीं कोई हमें देख न ले। यदि हम भीतर न जा सकें, तो कम-से-कम जो कुछ हम उसकी याद में लाई हैं उसे द्वार पर रख देंगी, और अपने घर लौटने तक रोती और विलाप करती रहेंगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर अस्थायी रूप से तैयार किया गया है; अख़मीम कोडेक्स के यूनानी पाठ से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: दिए गए स्रोत-विवरण के अनुसार प्राचीन यूनानी पाठ की प्रत्यक्ष जाँच लंबित है; पाठक को आधार और सीमा स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: the Lord’s day
  choice: प्रभु का दिन
  rationale: यह पदवी का सीधा और स्वाभाविक हिन्दी रूप है; इसे बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: grave
  choice: कब्र
  rationale: सामान्य आधुनिक हिन्दी में सहज और प्रसंगानुकूल शब्द; पूरे अंश में एकरूपता रखी गई है।
- source_word: friends
  choice: सहेलियाँ
  rationale: मरियम के साथ गई स्त्रियों के लिए स्वाभाविक हिन्दी अभिव्यक्ति; अंग्रेज़ी साक्ष्य में व्यक्त निकट संगति को बनाए रखती है।
- source_word: do our duties
  choice: जो करना हमारा कर्तव्य है वह करें
  rationale: अंत्येष्टि-संबंधी क्रियाओं का संकेत बनाए रखते हुए ऐसी विशिष्ट विधि नहीं जोड़ी गई जो उपलब्ध साक्ष्य में नहीं है।
- source_word: in memory of him
  choice: उसकी याद में
  rationale: सहज आधुनिक हिन्दी, जो स्मरणार्थ लाई वस्तुओं के आशय को बिना उनका स्वरूप निर्धारित किए व्यक्त करती है।
theological_decisions:
- issue: ‘यहूदियों’ के भय और क्रोध का वर्णन
  choice: पाठ के ऐतिहासिक कथन को यथावत रखा गया, पर उसे सभी यहूदियों के बारे में सार्वकालिक निर्णय के रूप में विस्तृत नहीं किया गया।
  alternative: ‘यहूदी अगुवों’ कहना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य केवल ‘the Jews’ कहता है; ‘अगुवों’ जोड़ना अस्पष्टता को अनुचित रूप से हल कर देता।
- issue: कब्र पर स्त्रियों द्वारा किए जाने वाले कार्य
  choice: सामान्य शब्दों में ‘रीति के अनुसार’ और ‘कर्तव्य’ रखा गया।
  alternative: शव का अभिषेक करना या सुगंध-द्रव्य लगाना
  rationale: इस अंश में उपलब्ध साक्ष्य कोई विशिष्ट क्रिया नहीं बताता; समानांतर परंपराओं से विवरण आयात नहीं किया गया।
- issue: ‘प्रभु का दिन’ की पहचान
  choice: ‘प्रभु का दिन’ का औपचारिक रूप रखा गया।
  alternative: ‘रविवार’
  rationale: ‘रविवार’ संभावित संदर्भ स्पष्ट करता, पर स्रोत की धार्मिक पदवी और उसकी अर्थ-छाया को संकुचित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। वाक्यों को हिन्दी के स्वाभाविक क्रम में रखा गया है, पर स्रोत की पुनरुक्ति, भय, शोक और अनिश्चितता को बनाए रखा गया है।
