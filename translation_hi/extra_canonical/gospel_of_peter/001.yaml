base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: hi
  text: (1) पर यहूदियों में से किसी ने भी अपने हाथ नहीं धोए—न हेरोदेस ने, न उसके न्यायाधीशों में से किसी ने। जब वे हाथ धोना नहीं चाहते थे, तो पिलातुस उठ खड़ा हुआ। (2) तब राजा हेरोदेस ने प्रभु को लाए जाने की आज्ञा दी और उनसे कहा, “जो कुछ मैंने तुम्हें उसके साथ करने की आज्ञा दी है, वही करो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर तैयार किया गया अस्थायी पाठ है; अख़मीम कोडेक्स के यूनानी पाठ की प्रत्यक्ष समीक्षा अभी बाकी है।
    reason: प्रदान किए गए स्रोत-विवरण के अनुसार प्राचीन-भाषा की समीक्षा लंबित है; पाठक को अनुवाद की साक्ष्यगत स्थिति स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: washed the hands
  choice: अपने हाथ धोए
  rationale: वर्णित औपचारिक क्रिया को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है; पाठ उसके अर्थ की व्याख्या नहीं करता।
- source_word: judges
  choice: न्यायाधीशों
  rationale: न्यायिक भूमिका को सीधे व्यक्त करता है और उपलब्ध साक्ष्य के औपचारिक स्वर को बनाए रखता है।
- source_word: stood up
  choice: उठ खड़ा हुआ
  rationale: शारीरिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसके उद्देश्य का अनुमान लगाए।
- source_word: the Lord
  choice: प्रभु
  rationale: मूल उपाधि का पारंपरिक, व्यापक और संप्रदाय-निरपेक्ष हिन्दी समतुल्य।
- source_word: to be brought
  choice: लाए जाने
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के कर्मवाच्य भाव को बनाए रखता है और गंतव्य को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: हाथ धोने की क्रिया का निहितार्थ
  choice: क्रिया को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे निर्दोषता की घोषणा या दोष से मुक्ति के रूप में स्पष्ट करना
  rationale: इस अंश में केवल हाथ न धोने की बात कही गई है; प्रतीकात्मक अर्थ को पाठ में जोड़ना वास्तविक कथात्मक तनाव को समय से पहले सुलझा देता।
- issue: ‘प्रभु’ की पहचान
  choice: उपाधि ‘प्रभु’ को यथावत रखा गया
  alternative: नाम ‘यीशु’ जोड़ना
  rationale: उपलब्ध साक्ष्य यहाँ उपाधि का प्रयोग करता है; नाम जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: हेरोदेस की आज्ञा का स्वरूप
  choice: ‘जो कुछ मैंने…आज्ञा दी है’ के सामान्य कथन को बनाए रखा गया
  alternative: दंड या क्रूस पर चढ़ाने की विशिष्ट आज्ञा बताना
  rationale: इस इकाई में कार्य का स्वरूप स्पष्ट नहीं किया गया है, इसलिए उसे अनुमान से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। व्यक्तिनामों के लिए प्रचलित हिन्दी बाइबिलीय रूप ‘हेरोदेस’ और ‘पिलातुस’ प्रयुक्त हुए हैं। वाक्य-संरचना मूल की क्रमिक गति को बनाए रखते हुए सामान्य पाठक के लिए स्वाभाविक बनाई गई है।
