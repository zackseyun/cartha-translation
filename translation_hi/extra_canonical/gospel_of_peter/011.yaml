base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: hi
  text: '(43) तब उन लोगों ने आपस में तय किया कि वे जाकर पीलातुस को इन बातों की सूचना दें। (44) जब वे अभी इस पर विचार ही कर रहे थे, तो फिर आकाश खुलते दिखाई दिए, और एक व्यक्ति नीचे उतरा और कब्र में चला गया। (45) यह देखकर सूबेदार के साथ के लोग उस कब्र को, जिसकी वे रखवाली कर रहे थे, छोड़कर रात ही में जल्दी से पीलातुस के पास गए। वे बहुत व्याकुल थे और उन्होंने जो कुछ देखा था, वह सब बताते हुए कहा, “सचमुच वह परमेश्वर का पुत्र था!”


    (46) पीलातुस ने उत्तर दिया, “मैं परमेश्वर के पुत्र के खून से निर्दोष हूँ, और यह बात हमारे लिए स्पष्ट है।”


    (47) तब वहाँ आए सभी लोग उससे विनती करने और आग्रह करने लगे कि वह सूबेदार और सैनिकों को आदेश दे कि उन्होंने जो देखा था, उसके बारे में कुछ न कहें। (48) उन्होंने कहा, “हमारे लिए यह अच्छा है कि हम परमेश्वर के सामने किसी बड़े पाप के दोषी ठहरें, बजाय इसके कि यहूदी लोगों के हाथों में पड़ें और पत्थरों से मार डाले जाएँ।” (49) इसलिए पीलातुस ने सूबेदार और सैनिकों को आदेश दिया कि वे कुछ न कहें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the heavens
  choice: आकाश
  rationale: हिन्दी में स्वाभाविक सामूहिक अर्थ देते हुए दृश्य के अलौकिक स्वर को बनाए रखता है; अंग्रेज़ी बहुवचन को कृत्रिम ‘आकाशों’ से नहीं बाँधा गया।
- source_word: a certain man
  choice: एक व्यक्ति
  rationale: व्यक्ति की पहचान को अनिश्चित ही रखा गया है; उसे स्वर्गदूत या कोई अन्य विशिष्ट सत्ता मानकर व्याख्या नहीं की गई।
- source_word: grave / tomb
  choice: कब्र
  rationale: सभी पदों में एक सहज और व्यापक रूप से समझा जाने वाला शब्द रखा गया है।
- source_word: centurion
  choice: सूबेदार
  rationale: रोमी सैन्य अधिकारी के लिए प्रचलित और सामान्य हिन्दी बाइबलीय पद चुना गया है।
- source_word: clean of the blood
  choice: खून से निर्दोष
  rationale: रक्त-दोष की मुहावरेदार धारणा को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: Jewish people
  choice: यहूदी लोग
  rationale: प्रदत्त साक्ष्य के सामूहिक संदर्भ को ज्यों का त्यों रखा गया है, बिना उसे सभी कालों और स्थानों के यहूदियों पर धर्मवैचारिक आरोप में विस्तृत किए।
theological_decisions:
- issue: ‘परमेश्वर का पुत्र’ की स्वीकारोक्ति
  choice: “सचमुच वह परमेश्वर का पुत्र था!”
  alternative: “सचमुच यह परमेश्वर का पुत्र था!”
  rationale: कथित व्यक्ति की ओर संकेत को स्वाभाविक हिन्दी में रखा गया है और कथन की उच्च मसीही उपाधि को कमज़ोर या विस्तृत नहीं किया गया।
- issue: पीलातुस का निर्दोष होने का दावा
  choice: वक्ता के दावे के रूप में सीधा उद्धरण
  alternative: कथावाचक द्वारा पीलातुस को निर्दोष घोषित करना
  rationale: पाठ केवल पीलातुस का कथन प्रस्तुत करता है; अनुवाद इसे कथावाचक की पुष्टि नहीं बनाता।
- issue: उतरने वाले व्यक्ति की पहचान
  choice: “एक व्यक्ति”
  alternative: “एक स्वर्गदूत”
  rationale: उपलब्ध साक्ष्य पहचान स्पष्ट नहीं करता, इसलिए संभावित धर्मवैचारिक पहचान थोपी नहीं गई।
- issue: यहूदी लोगों का उल्लेख
  choice: ऐतिहासिक कथन के भीतर “यहूदी लोग”
  alternative: “यहूदी अधिकारी” या “भीड़”
  rationale: प्रदत्त अंग्रेज़ी साक्ष्य को संकुचित करके अधिक विशिष्ट समूह नहीं बनाया गया; साथ ही पाठ से बाहर कोई सामूहिक दोषारोपण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। वाक्य संख्या सुरक्षित रखी गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है।
