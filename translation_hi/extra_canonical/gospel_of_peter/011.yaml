  naturalness: The register is clear, modern, and suitably dignified. “आकाश खुलते दिखाई दिए” is less natural because “आकाश” is singular in ordinary Hindi while “दिखाई दिए” is plural. “आकाश फिर खुलता हुआ दिखाई दिया” is idiomatic and maintains the reported visual phenomenon.
  terminology: “पीलातुस,” “सूबेदार,” “कब्र,” and “परमेश्वर का पुत्र” are appropriate and consistently used. “यहूदी लोग” faithfully reflects the supplied witness’s collective expression without adding commentary or broadening the statement beyond the narrative.
