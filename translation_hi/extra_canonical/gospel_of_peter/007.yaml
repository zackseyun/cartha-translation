  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: hi
  text: 'तब यहूदी, पुरनिए और याजक, यह जानकर कि उन्होंने अपने ही साथ कितना बड़ा अन्याय किया था, शोक करने लगे और कहने लगे, “हाय, हमारे पाप! यरूशलेम का न्याय और अंत निकट है!”


    पर मैं और मेरे साथी दुखी थे; मन से घायल होकर हम छिपे हुए थे, क्योंकि वे हमें अपराधियों और मंदिर जलाने की इच्छा रखनेवालों के रूप में ढूँढ़ रहे थे। इन सब बातों के ऊपर, हम उपवास करते, बैठे रहते, शोक मनाते और सब्त तक रात-दिन रोते रहे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Jews
  choice: यहूदी
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का सीधा और स्वाभाविक सामुदायिक पद; इसे अधिक संकीर्ण किसी दल के रूप में नहीं बदला गया।
- source_word: elders
  choice: पुरनिए
  rationale: धार्मिक-सामुदायिक नेतृत्व के पद को व्यक्त करने वाला प्रचलित बाइबलीय हिन्दी शब्द।
- source_word: priests
  choice: याजक
  rationale: मंदिर-संबंधी पद के लिए सटीक और प्रतिष्ठित हिन्दी शब्द।
- source_word: wrong they had done to themselves
  choice: उन्होंने अपने ही साथ कितना बड़ा अन्याय किया था
  rationale: साक्ष्य में उपस्थित आत्म-लक्षित हानि/अन्याय को बनाए रखा गया; इसे केवल सामान्य अपराधबोध नहीं बनाया।
- source_word: judgment
  choice: न्याय
  rationale: दोषनिर्णय और दैवी न्याय—दोनों संभावित अर्थों को खुला रखता है।
- source_word: being wounded in mind
  choice: मन में गहरी चोट खाए हुए
  rationale: मानसिक-भावनात्मक आघात की रूपकात्मक तीव्रता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: wrongdoers
  choice: अपराधी
  rationale: आरोपित कुकर्मी होने का सामान्य अर्थ संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: Sabbath
  choice: सब्त
  rationale: यहूदी विश्राम-दिन के ऐतिहासिक-धार्मिक नाम को सुरक्षित रखा गया।
theological_decisions:
- issue: यरूशलेम के ‘न्याय और अंत’ का संबंध
  choice: “यरूशलेम का न्याय और अंत”
  alternative: “यरूशलेम पर न्याय और उसका अंत”
  rationale: उपलब्ध साक्ष्य की संक्षिप्त और तनावपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के रखा गया।
- issue: मंदिर जलाने की मंशा का आरोप
  choice: “कह रहे थे कि हम मंदिर को जलाना चाहते हैं”
  alternative: “मंदिर जलाने के इच्छुक होने के कारण”
  rationale: इसे कथावाचक की वास्तविक मंशा के बजाय खोजनेवालों का आरोप स्पष्ट किया गया, जबकि मूल सूचना सुरक्षित रही।
- issue: यहूदियों के उल्लेख का दायरा
  choice: “यहूदी, पुरनिए और याजक”
  alternative: “यहूदी अगुवे, अर्थात् पुरनिए और याजक”
  rationale: उपलब्ध साक्ष्य तीन समन्वित समूह प्रस्तुत करता है; उन्हें एक ही नेतृत्व-वर्ग में मिलाकर वास्तविक अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। प्रत्यक्ष यूनानी स्रोत की समीक्षा लंबित होने के कारण मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कोई अप्रमाणित पाठांतर या पादटिप्पणी नहीं जोड़ी गई। पद-संख्याएँ निर्देशानुसार नहीं रखी गईं।
