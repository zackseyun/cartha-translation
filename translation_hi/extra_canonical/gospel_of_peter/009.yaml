base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: hi
  text: (34) जब सब्त की सुबह हुई, तो यरूशलेम और आसपास के देहात से लोगों की एक भीड़ उस कब्र को देखने गई जिस पर मुहर लगाई गई थी। (35) लेकिन रात में, प्रभु के दिन का उजाला होने से पहले, जब सैनिक दो-दो की टोली में पहरा दे रहे थे, तब आकाश में एक बड़ी आवाज़ सुनाई दी। (36) उन्होंने आकाशों को खुलते देखा, और वहाँ से दो पुरुष बड़ी ज्योति से चमकते हुए उतरे और कब्र के पास आए। (37) द्वार पर रखा गया पत्थर अपने-आप लुढ़ककर कुछ हट गया। कब्र खुल गई, और वे दोनों युवक भीतर चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sabbath
  choice: सब्त
  rationale: यहूदी विश्राम-दिवस के ऐतिहासिक-सांस्कृतिक अर्थ को बनाए रखने के लिए प्रचलित बाइबलीय रूप चुना गया।
- source_word: grave / tomb
  choice: कब्र
  rationale: सामान्य आधुनिक हिन्दी में सहज और प्रसंगानुकूल शब्द; पूरे अंश में एकरूप रखा गया।
- source_word: Lord's day
  choice: प्रभु का दिन
  rationale: पाठ की आरंभिक मसीही पदावली को बिना व्याख्यात्मक विस्तार के यथासंभव सीधे रखा गया।
- source_word: heavens
  choice: आकाशों
  rationale: बहुवचन की पाठगत विशेषता को सुरक्षित रखा गया, भले ही हिन्दी में एकवचन अधिक स्वाभाविक होता।
- source_word: much radiance
  choice: बड़ी ज्योति से चमकते हुए
  rationale: प्रकाश की तीव्रता और दोनों पुरुषों के दीप्त रूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: made way in part
  choice: कुछ हट गया
  rationale: पत्थर के केवल आंशिक रूप से हटने की असामान्य किंतु स्पष्ट पाठगत सूचना को बरकरार रखता है।
theological_decisions:
- issue: दो पुरुषों का स्वरूप
  choice: दो पुरुष
  alternative: दो स्वर्गदूत
  rationale: पाठ उन्हें पुरुष कहता है; उनकी ज्योति और स्वर्ग से उतरने के आधार पर उन्हें स्पष्टतः स्वर्गदूत कहना व्याख्यात्मक निष्कर्ष होता।
- issue: Lord's day की पहचान
  choice: प्रभु का दिन
  alternative: रविवार
  rationale: मूल पद की धार्मिक और संभावित कालगत व्यापकता बनाए रखने के लिए उसे सीधे रखा गया; ‘रविवार’ अर्थ को अधिक निश्चित कर देता।
- issue: आकाश में आवाज़ का स्थान
  choice: आकाश में एक बड़ी आवाज़
  alternative: आकाश से एक ऊँची आवाज़
  rationale: उपलब्ध साक्षी ‘in heaven’ कहता है, इसलिए आवाज़ के स्रोत को ‘से’ द्वारा अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण अनावश्यक सूक्ष्म दावे और पाठ-संशोधन नहीं किए गए। पद-संख्याएँ सुरक्षित रखी गई हैं।
