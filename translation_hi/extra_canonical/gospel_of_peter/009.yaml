  naturalness: भाषा सामान्यतः आधुनिक और कथात्मक है। ‘बड़ी ज्योति से चमकते हुए’ बोधगम्य है, किंतु ‘बहुत तेजस्विता लिए हुए’ अधिक सहज और मूल के ‘having much radiance’ के निकट है। ‘एक बड़ी आवाज़ सुनाई दी’ में सुनने की क्रिया जोड़ती है; ‘एक बड़ी आवाज़ हुई’ अधिक संयत है।
