source:
  text: (34) Now when the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went that they might see the grave that had been sealed. (35) But during the night before the Lord's day dawned, while the soldiers were watching two by two as guards, there was a great voice in heaven. (36) And they saw the heavens being opened, and two men descended from there, having much radiance, and they approached the tomb. (37) But that stone which had been placed at the door rolled away by itself, and made way in part, and the tomb was opened, and both the young men went in.
