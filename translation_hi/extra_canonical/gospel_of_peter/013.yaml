review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the supplied English witness and appropriately retains the young man's unidentified status and the ambiguity of the final destination. However, it adds ‘भीतर’ where the witness simply says that they saw the young man there, and renders the rhetorically negative ‘Not that one who was crucified?’ as a positive question (‘क्या उसे...?’), which can reverse the force of the utterance.
  naturalness: The Hindi is generally clear, modern, and suitably dignified. A small recasting of the tomb scene and of the negative rhetorical question yields more natural phrasing while remaining closer to the witness.
  terminology: ‘कब्र,’ ‘युवक,’ ‘क्रूस पर चढ़ाया गया,’ and ‘जी उठा’ are suitable. ‘जी उठा’ idiomatically conveys resurrection in this context without identifying the young man or specifying the destination.
  issues:
  - severity: medium
    issue: The negative rhetorical question is not preserved.
    rationale: The witness reads, ‘Not that one who was crucified?’ The draft’s ‘क्या उसे, जिसे क्रूस पर चढ़ाया गया था?’ is a positive question and may imply that he is the person being sought. ‘उसको नहीं जिसे...?’ retains the witness’s negative form.
  - severity: low
    issue: ‘भीतर’ is an unsupported specification.
    rationale: The witness says they bent down and saw a young man ‘there’; it does not explicitly state ‘inside.’ The setting makes this plausible, but it is safer not to add it.
