base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/013.yaml
  text: '(55) They went and found that the tomb had been opened. When they came near, they bent down and saw a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) “Why did you come? Whom are you looking for? Not that one who was crucified? He arose and went away. But if you do not believe, bend down and see where he was lying, that he is not there, because he arose and went to where he came from.”


    (57) Then the women were afraid and fled.'
translation:
  language: hi
  text: '(55) वे गईं और उन्होंने पाया कि कब्र खुली हुई थी। पास आकर उन्होंने झुककर भीतर देखा। वहाँ कब्र के बीच में एक युवक बैठा था। वह सुंदर था और लंबा, चमकता हुआ वस्त्र पहने था। उसने उनसे कहा, (56) “तुम क्यों आई हो? किसे ढूँढ़ रही हो? क्या उसे, जिसे क्रूस पर चढ़ाया गया था? वह जी उठा और चला गया। पर यदि तुम्हें विश्वास नहीं, तो झुककर वह स्थान देख लो जहाँ वह पड़ा था। वह यहाँ नहीं है, क्योंकि वह जी उठा और वहाँ चला गया जहाँ से वह आया था।”


    (57) तब वे स्त्रियाँ डर गईं और भाग गईं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tomb
  choice: कब्र
  rationale: आधुनिक मानक हिन्दी में दफनाने की जगह के लिए सहज और व्यापक रूप से समझा जाने वाला शब्द।
- source_word: young man
  choice: युवक
  rationale: पाठ उसे युवक कहता है; उसे स्वर्गदूत कहकर पहचानना पाठ से अधिक व्याख्या जोड़ देता।
- source_word: arose
  choice: जी उठा
  rationale: मृत्यु के प्रसंग में पुनर्जीवन का स्वाभाविक हिन्दी रूप, केवल उठ खड़े होने की अस्पष्टता से बचते हुए कथन का आशय रखता है।
- source_word: long, shining robe
  choice: लंबा, चमकता हुआ वस्त्र
  rationale: वस्त्र की लंबाई और चमक, दोनों वर्णनात्मक तत्व सुरक्षित रखे गए हैं।
- source_word: where he came from
  choice: जहाँ से वह आया था
  rationale: मूल कथन की रहस्यमयता और संभावित धर्मवैज्ञानिक तनाव को बिना विस्तार या पहचान जोड़े सुरक्षित रखा गया है।
theological_decisions:
- issue: कब्र में बैठे युवक की पहचान
  choice: युवक
  alternative: स्वर्गदूत
  rationale: उपलब्ध साक्ष्य में स्पष्ट पहचान ‘युवक’ की है; ‘स्वर्गदूत’ कहना व्याख्यात्मक निष्कर्ष होता।
- issue: ‘वह जी उठा और चला गया’ की पुनरावृत्ति
  choice: दोनों बार कथन को बनाए रखा
  alternative: दूसरी बार संक्षिप्त करना
  rationale: पुनरावृत्ति साक्ष्य का हिस्सा है और पुनरुत्थान तथा प्रस्थान पर दिए गए बल को व्यक्त करती है।
- issue: ‘जहाँ से वह आया था’ का संकेत
  choice: संकेत को अनिर्दिष्ट रखा
  alternative: ‘स्वर्ग’ या ‘पिता के पास’ कहना
  rationale: साक्ष्य गंतव्य स्पष्ट नहीं करता; किसी विशिष्ट धर्मवैज्ञानिक अर्थ को जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; प्राचीन यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। स्त्रीलिंग बहुवचन ‘गईं/आई हो/ढूँढ़ रही हो’ पद 57 में स्पष्ट ‘स्त्रियाँ’ के आधार पर संदर्भानुकूल रखा गया है।
