    (5) And Herod said, "Brother Pilate, even if someone hadn''t asked for him, we would''ve buried him, since also Sabbath is beginning, because it''s written in the Law, ''The sun shouldn''t set on one who''s been killed.''"'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: hi
  text: '(3) यूसुफ वहाँ खड़ा था; वह पिलातुस और प्रभु का मित्र था। जब उसने देखा कि वे प्रभु को क्रूस पर चढ़ाने वाले हैं, तो वह पिलातुस के पास गया और उसने दफ़नाने के लिए प्रभु का शव माँगा। (4) तब पिलातुस ने हेरोदेस के पास संदेश भेजकर उससे शव माँगा।


    (5) हेरोदेस ने कहा, “भाई पिलातुस, यदि किसी ने उसे न भी माँगा होता, तो भी हम उसे दफ़ना देते, क्योंकि सब्त आरम्भ होने वाला है। व्यवस्था में लिखा है, ‘जो मार डाला गया हो, उस पर सूर्य अस्त न हो।’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन व्यवस्थाविवरण 21:22–23 की ओर संकेत करता है। उपलब्ध पाठ-साक्षी में उद्धरण का रूप प्रचलित पुराना नियम पाठ से कुछ भिन्न है।
    reason: अंतरपाठीय संकेत बताना उपयोगी है, पर मुख्य पाठ में उद्धरण को मानक बाइबलीय रूप के अनुसार बदलना मूल साक्षी की भिन्नता मिटा देता।
lexical_decisions:
- source_word: the body of the Lord / the body
  choice: प्रभु का शव / शव
  rationale: दफ़नाने और मृत्यु के संदर्भ में ‘शव’ स्वाभाविक और स्पष्ट हिन्दी है; दूसरे उल्लेख में अनावश्यक पुनरावृत्ति से बचते हुए अर्थ बनाए रखा गया है।
- source_word: Sabbath
  choice: सब्त
  rationale: यह यहूदी विश्राम-दिन का प्रचलित बाइबलीय नाम है और प्रसंग की ऐतिहासिक-सांस्कृतिक विशिष्टता बनाए रखता है।
- source_word: Law
  choice: व्यवस्था
  rationale: यहाँ आशय मूसा की व्यवस्था/धर्मशास्त्र से है; ‘व्यवस्था’ हिन्दी बाइबल की परिचित और प्रसंगानुकूल संज्ञा है।
- source_word: Brother Pilate
  choice: भाई पिलातुस
  rationale: सम्बोधन की असामान्य आत्मीयता को हटाए या उसका अर्थ समझाकर सीमित किए बिना औपचारिक रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: यूसुफ को पिलातुस और प्रभु दोनों का मित्र बताना
  choice: “वह पिलातुस और प्रभु का मित्र था”
  alternative: “वह पिलातुस का मित्र और प्रभु का अनुयायी था”
  rationale: उपलब्ध साक्षी में दोनों के साथ ‘friend’ का संबंध है; ‘अनुयायी’ कहना अर्थ की व्याख्यात्मक संकीर्णता होती।
- issue: व्यवस्था के उद्धरण में मृत व्यक्ति की स्थिति
  choice: “जो मार डाला गया हो”
  alternative: “जो पेड़ पर लटकाया गया हो” अथवा “जिसे फाँसी दी गई हो”
  rationale: प्रस्तुत साक्षी ‘one who has been killed’ कहता है। व्यवस्थाविवरण 21:22–23 की मानक भाषा को यहाँ आयात करके इस ग्रंथ के उद्धरण-रूप को चुपचाप बदलना उचित नहीं है।
- issue: दफ़नाने वाले ‘हम’ का संदर्भ
  choice: “हम उसे दफ़ना देते”
  alternative: “मैं उसे दफ़ना देता”
  rationale: बहुवचन को उसी रूप में रखा गया है; यह हेरोदेस के दल, अधिकारियों या सामूहिक कर्तृत्व का संकेत हो सकता है, पर पाठ इसे स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; यूनानी मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण शब्दावली और वाक्य-संबंधों को अंतिम न माना जाए।
