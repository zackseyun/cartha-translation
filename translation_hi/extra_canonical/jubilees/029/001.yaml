  text: And it came to pass, after Rachel had borne Joseph, that Laban went to shear his sheep, for he was a three days' journey away from him.
translation:
  language: hi
  text: राहेल ने यूसुफ को जन्म दिया, उसके बाद ऐसा हुआ कि लाबान अपनी भेड़ों की ऊन कतरने चला गया, क्योंकि वह उससे[a] तीन दिन की यात्रा दूर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में यहाँ शाब्दिक रूप से “वह उससे” है; इन सर्वनामों के पूर्वपद इस पद में स्पष्ट नहीं हैं। संदर्भ में सामान्यतः इन्हें लाबान और याकूब से संबंधित समझा जाता है।
    reason: स्रोत-पाठ की वास्तविक सर्वनाम-संबंधी अस्पष्टता को पाठक के सामने रखना।
lexical_decisions:
- source_word: ይቅርጽ፡ አባግዒሁ
  choice: अपनी भेड़ों की ऊन कतरने
  rationale: गीज़ क्रिया और कर्म का स्वाभाविक हिन्दी रूप; आशय भेड़ों को कतरना अर्थात उनकी ऊन उतारना है।
- source_word: ምሕዋረ፡ ሠሉስ፡ ዕለት
  choice: तीन दिन की यात्रा दूर
  rationale: शाब्दिक अर्थ ‘तीन दिन की यात्रा’ है; यह हिन्दी में यात्रा से मापी गई दूरी को सहज ढंग से व्यक्त करता है।
- source_word: ወኮነ፡ እምዘ
  choice: के बाद ऐसा हुआ कि
  rationale: कथात्मक संक्रमण और काल-संबंध दोनों को आधुनिक, गरिमापूर्ण हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य के सर्वनामों के पूर्वपद
  choice: मुख्य पाठ में ‘वह उससे’ रखकर अस्पष्टता सुरक्षित रखी गई
  alternative: ‘लाबान याकूब से’ जैसे स्पष्ट नाम देना
  rationale: गीज़ पाठ में दोनों पुरुषवाचक सर्वनाम हैं और उनके पूर्वपद इस पद में स्पष्ट नहीं किए गए; नाम जोड़ना पाठ की वास्तविक अस्पष्टता को चुपचाप सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। ‘ऊन कतरने’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘तीन दिन की यात्रा दूर’ प्राचीन दूरी-मापन को बनाए रखता है।
