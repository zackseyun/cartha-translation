  yaml_path: translation/extra_canonical/jubilees/029/005.yaml
  text: the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the seventh year of the fourth week[5], Jacob set out for Gilead in the first month, on the twenty-first; and Laban pursued after him, and he overtook Jacob on the mountain of Gilead in the third month, on the thirteenth.
translation:
  language: hi
  text: गिलाद का देश। याकूब ने लाबान से अपने मन की बात छिपाई और उसे कुछ नहीं बताया। चौथे सप्ताह के सातवें वर्ष में[a], याकूब पहले महीने के इक्कीसवें दिन गिलाद के लिए चल पड़ा। लाबान ने उसका पीछा किया और तीसरे महीने के तेरहवें दिन गिलाद पर्वत पर याकूब को जा पकड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का कालक्रम कठिन है, क्योंकि प्रस्थान, पीछा और जा पकड़े जाने की घटनाएँ अलग-अलग महीनों से जुड़ी हैं। यहाँ दी गई तिथियों को किसी अन्य विवरण से मिलाने के लिए बदला नहीं गया है।
    reason: segmentation_note
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ፡
  choice: याकूब ने ... अपने मन की बात छिपाई
  rationale: स्रोत में शाब्दिक रूप से याकूब द्वारा अपना ‘हृदय’ छिपाने की अभिव्यक्ति है। आधुनिक हिन्दी में ‘अपने मन की बात छिपाई’ उसी रूपक और आशय को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ፡
  choice: याकूब ... गिलाद के लिए चल पड़ा
  rationale: क्रिया लौटने या दिशा लेकर निकलने का भाव दे सकती है; प्रसंग में यात्रा आरम्भ करने का तटस्थ और स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: ወደገኖ፡ ላባ፡ ድኅሬሁ፡
  choice: लाबान ने उसका पीछा किया
  rationale: गीज़ पाठ में पीछा करने का कथन है; उत्पत्ति की समानांतर कथा से ‘सुना और’ जोड़कर सामंजस्य नहीं किया गया।
- source_word: ወረከቦ፡ ለያዕቆብ፡
  choice: याकूब को जा पकड़ा
  rationale: क्रिया का मूल अर्थ ‘पाना/जा मिलना/पकड़ लेना’ है; पीछा करने के प्रसंग में ‘जा पकड़ा’ सहज और सटीक है।
theological_decisions:
- issue: पीछा और पकड़े जाने की तिथियों के बीच कालक्रमगत कठिनाई
  choice: पहले महीने की इक्कीसवीं और तीसरे महीने की तेरहवीं—दोनों तिथियाँ स्रोत के अनुसार रखी गईं
  alternative: उत्पत्ति की कथा या अनुमानित यात्रा-अवधि के अनुसार तिथियों का सामंजस्य करना
  rationale: पाठ की वास्तविक कालक्रमगत कठिनाई को छिपाने के बजाय उसे सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। आरम्भ का ‘गिलाद देश’ पिछले पद से जुड़ा वाक्यांश है, इसलिए उसकी खंडित संरचना सुरक्षित रखी गई है। तिथियाँ शब्दों में दी गई हैं और स्रोत के काल-विभाजन ‘चौथे सप्ताह के सातवें वर्ष’ को यथावत रखा गया है।
