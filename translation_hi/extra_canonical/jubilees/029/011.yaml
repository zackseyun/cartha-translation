  text: their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon[11]. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people to this day that has completed all their sins, and they no longer exist.
translation:
  language: hi
  text: उनके राज्य कर्नैम, अश्तारोत, एद्रेई, मिसूर और बेओन[a] थे। प्रभु ने उनके बुरे कामों के कारण उनका विनाश कर दिया, क्योंकि वे अत्यन्त अधर्मी थे। उसने उनके स्थान पर एमोरियों को बसाया—एक दुष्ट और पापी जाति। आज तक कोई ऐसी जाति नहीं हुई जिसने उनके सारे पाप पूरे किए हों; और अब उनका अस्तित्व नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रफाइयों के क्षेत्र की इस सूची में आए कई स्थान-नामों का इथियोपिक पाठ-परम्परा में रूप निश्चित करना कठिन है; यहाँ उनके लिप्यंतरण सावधानीपूर्वक किए गए हैं।
    reason: textual_variant
lexical_decisions:
- source_word: መንግሥቶሙ
  choice: उनके राज्य
  rationale: बहुवचन प्रत्यय सहित संज्ञा को उसके स्पष्ट बहुवचन अर्थ में रखा गया है।
- source_word: ጸዋጋን
  choice: अधर्मी
  rationale: यह शब्द नियम-विरोधी अथवा विधिहीन आचरण का बोध कराता है; सहज आधुनिक हिन्दी में ‘अधर्मी’ उस नैतिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: አሞሬዎነ
  choice: एमोरियों
  rationale: जाति-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: जिसने उनके सारे पाप पूरे किए हों
  rationale: ‘पापों को पूरा करना’ स्रोत की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति है; इसे ‘पाप की चरम सीमा’ कहकर व्याख्यायित नहीं किया गया।
- source_word: ወአልቦሙ
  choice: और अब उनका अस्तित्व नहीं है
  rationale: शाब्दिक ‘और वे नहीं हैं’ को स्वाभाविक हिन्दी में अस्तित्व के कथन के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘उनके सारे पाप पूरे करना’ का आशय
  choice: स्रोत की अभिव्यक्ति को लगभग अक्षुण्ण रखा गया
  alternative: ‘उनके पापों की पूरी सीमा तक पहुँचना’
  rationale: वैकल्पिक रूप किसी निश्चित दैवी माप अथवा सीमा की धारणा को पाठ में अधिक स्पष्टता से जोड़ देता; स्रोत की वास्तविक अस्पष्टता और तनाव को बनाए रखना उचित है।
- issue: अन्तिम बहुवचन सर्वनाम का संदर्भ
  choice: पूर्ववर्णित नष्ट लोगों के अब अस्तित्व में न रहने का कथन
  alternative: निकटवर्ती ‘कोई जाति’ से जोड़कर वाक्य को अपूर्ण अथवा सामान्य कथन मानना
  rationale: अनुच्छेद का प्रवाह आरम्भ में वर्णित जातियों के विनाश की ओर लौटता है; फिर भी हिन्दी में जाति का नाम दोहराकर संदर्भ को आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्थान-नामों को हिन्दी ध्वन्यात्मक रूप में प्रस्तुत किया गया है। मुख्य पाठ में फुटनोट चिह्न [a] स्थान-नामों की सूची के तुरन्त बाद रखा गया है।
