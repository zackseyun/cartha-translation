  text: And he journeyed on the next morning to the land of Gilead. And Jacob crossed the Jabbok in the ninth month, on the eleventh of it, and on this day Esau his brother came to him, and they were reconciled.
translation:
  language: hi
  text: अगली सुबह वह गिलाद देश की ओर चल पड़ा। याकूब ने नौवें महीने की ग्यारहवीं तारीख को[a] यब्बोक पार किया। उसी दिन उसका भाई एसाव उसके पास आया, और दोनों में मेल हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'संख्यात्मक पाठ कुछ विकृत है। एक अन्य पाठानुसार: “दसवें सप्ताह के पहले वर्ष में।”'
    reason: मूल पाठ की कठिनता और परंपरागत वैकल्पिक पाठ को पारदर्शी रूप से दर्ज करना।
lexical_decisions:
- source_word: ምድረ፡ ጽባሕ
  choice: अगली सुबह
  rationale: समय-सूचक अभिव्यक्ति का स्वाभाविक आधुनिक हिन्दी रूप; प्रसंग में अगले दिन की सुबह अभिप्रेत है।
- source_word: ተመይጠ፡ ምድረ፡ ገለአድ
  choice: गिलाद देश की ओर चल पड़ा
  rationale: गमन और गंतव्य दोनों को सहज हिन्दी में व्यक्त करता है; ‘गिलाद’ पारंपरिक स्थान-नाम है।
- source_word: ትዐደወ፡ ኢያቦክሃ
  choice: यब्बोक पार किया
  rationale: क्रिया नदी/घाटी को पार करने का अर्थ देती है; ‘यब्बोक’ नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: በታስዕ፡ ወርኅ፡ … ፲ሡሩ፡ ወአሚሩ
  choice: नौवें महीने की ग्यारहवीं तारीख को
  rationale: विकृत प्रतीत होने वाले संख्यात्मक पाठ को नवीन स्रोत-समीक्षा के अनुसार महीने के ग्यारहवें दिन के रूप में प्रस्तुत किया गया है।
- source_word: ወተኂነኖ
  choice: दोनों में मेल हो गया
  rationale: परस्पर सुलह या मेल-मिलाप का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
