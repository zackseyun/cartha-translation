  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। कालक्रम को स्पष्ट करने के लिए ‘तारीख’ का प्रयोग किया गया है, और कठिन संख्यात्मक पाठ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
