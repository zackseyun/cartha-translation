  text: For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should return to his father's house; and he said to him, “Go to every place, wherever you go.””
translation:
  language: hi
  text: क्योंकि उसने उन्हें वह सब बताया जो उसने स्वप्न में देखा था, और वह सब भी जो उससे कहा गया था—कि वह अपने पिता के घर लौट जाए। और उसने उससे कहा, “हर जगह जा, और जहाँ कहीं भी जाए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम वाक्य उपलब्ध गीज़ पाठ में इसी प्रकार कुछ असंपूर्ण-सा है। कुछ पुनर्निर्माण यहाँ “और मैं तेरे साथ रहूँगा” मानते हैं।
    reason: पाठगत कठिनाई और प्रचलित पुनर्निर्माण को स्पष्ट करना, बिना उसे मुख्य पाठ में मिलाए।
lexical_decisions:
- source_word: ይግባእ
  choice: लौट जाए
  rationale: गीज़ क्रिया ገብአ का यहाँ अर्थ ‘लौटना’ है; याकूब के अपने पिता के घर वापस जाने के प्रसंग से भी यही अर्थ पुष्ट होता है।
- source_word: ቤተ፡ አቡሁ
  choice: अपने पिता के घर
  rationale: संबंधवाचक प्रत्यय और प्रसंग को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሖውር፡ ውስተ፡ ኵሉ፡ መካን
  choice: हर जगह जा
  rationale: गमनसूचक आज्ञा और ‘हर स्थान’ के व्यापक अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ወአይ፡ ተሐውር
  choice: और जहाँ कहीं तू जाए
  rationale: उपलब्ध गीज़ पाठ के शब्दों को उसके कुछ असंपूर्ण/पुनरुक्त रूप सहित सुरक्षित रखा गया है; उत्पत्ति 31:3 से कोई अनुपस्थित वाक्यांश नहीं जोड़ा गया।
theological_decisions:
- issue: प्रत्यक्ष कथन के अंतिम खंड की पाठगत कठिनाई
  choice: उपलब्ध गीज़ पाठ के अनुसार “और जहाँ कहीं तू जाए” रखा गया
  alternative: “और मैं तेरे साथ रहूँगा” जोड़ना
  rationale: वैकल्पिक वाक्यांश बाइबिलीय समानांतर या आलोचनात्मक पुनर्निर्माण पर निर्भर है और वर्तमान गीज़ पाठ में नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। “तू” एकवचन प्राचीन प्रत्यक्ष आज्ञा के निकट है और यहाँ अनादर सूचित करने के लिए नहीं है। स्रोत की अंतिम पंक्ति की पुनरुक्ति/अपूर्णता को चुपचाप सुधारा नहीं गया।
