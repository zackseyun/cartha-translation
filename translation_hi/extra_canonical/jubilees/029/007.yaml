  text: by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain.
translation:
  language: hi
  text: रात को लाबान को याकूब के विषय में बताया गया। उन्हीं दिनों के पंद्रहवें दिन याकूब ने लाबान और उसके साथ आए सभी लोगों के लिए भोज दिया। उस दिन याकूब ने लाबान से शपथ खाई, और लाबान ने भी याकूब से, कि उनमें से कोई भी बुरे इरादे से उस पर्वत पर एक-दूसरे के पास न जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሌሊተ
  choice: रात को
  rationale: समय-सूचक गीइज़ पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ግዝአ
  choice: भोज
  rationale: संदर्भ में याकूब द्वारा लाबान और उसके साथियों के लिए आयोजित सामूहिक भोजन/दावत का बोध कराता है।
- source_word: መሐለ
  choice: शपथ खाई
  rationale: परस्पर गंभीर प्रतिज्ञा करने के अर्थ को आधुनिक मानक हिन्दी में स्पष्ट करता है।
- source_word: በእኩይ
  choice: बुरे इरादे से
  rationale: केवल किसी बुरी घटना के बजाय दूसरे को हानि पहुँचाने के उद्देश्य का भाव व्यक्त करता है।
- source_word: ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ
  choice: उनमें से कोई भी ... दूसरे की ओर ... पार नहीं करेगा
  rationale: पारस्परिक निषेध और सीमा पार कर दूसरे की ओर जाने—दोनों तत्वों को बनाए रखता है।
theological_decisions:
- issue: याकूब और लाबान की शपथ का पारस्परिक स्वरूप
  choice: दोनों ने एक-दूसरे से शपथ खाई
  alternative: दोनों ने केवल एक साझा सामान्य प्रतिज्ञा की
  rationale: मूल पाठ पहले याकूब का लाबान से और फिर लाबान का याकूब से शपथ खाना स्पष्ट रूप से दोहराता है; अनुवाद उसी पारस्परिकता को सुरक्षित रखता है।
- issue: सीमा पार करने की मनाही का स्वरूप
  choice: मनाही को ‘बुरे इरादे से’ सीमित रखा गया
  alternative: किसी भी कारण से पर्वत पार करने की पूर्ण मनाही
  rationale: गीइज़ በእኩይ निषेध को हानिकारक उद्देश्य से जोड़ता है; इसे पूर्ण और निरपेक्ष आवागमन-प्रतिबंध नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक खंड स्रोत में पूर्ववर्ती वाक्य से जुड़ा हुआ है; हिन्दी में कर्ता स्पष्ट न होने के कारण कर्मवाच्य ‘बताया गया’ रखा गया है। अंतिम संक्षिप्त पद ‘पर्वत पर/पर्वत को पार’ की वाक्यगत अस्पष्टता रख सकता है; संदर्भ और ‘पार करने’ की क्रिया के आधार पर इसे सीमा के रूप में ‘उस पर्वत को पार’ किया गया है।
