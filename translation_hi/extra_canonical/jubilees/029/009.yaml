  yaml_path: translation/extra_canonical/jubilees/029/009.yaml
  text: “The Heap of Witness,” according to this heap. But formerly they used to call the land of Gilead the land of the Rephaim[9], for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.
translation:
  language: hi
  text: “साक्षी का ढेर,” इस ढेर के अनुसार।[a] पहले वे गिलाद देश को रफाएल का देश कहा करते थे,[b] क्योंकि वह रफाइयों का देश था। वहीं रफाई जन्मे थे—ऐसे विशालकाय लोग जिनका कद दस हाथ, नौ हाथ, आठ हाथ, और यहाँ तक कि सात हाथ था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पांडुलिपि में अक्षरशः: “साक्षी का उत्सव,” इस उत्सव के अनुसार। यहाँ “ढेर” व्यापक रूप से स्वीकृत पाठ-संशोधन है, जो गिलाद से जुड़ी “साक्षी के ढेर” की व्युत्पत्ति के अनुकूल है।'
    reason: textual_variant
  - marker: b
    text: गीइज़ पाठ में यहाँ “रफाएल” रूप है, जबकि अगले वाक्य में स्पष्ट रूप से “रफाई” (रफाइम) है। यह पाठगत भेद संभवतः पुराने स्थान-नाम को रफाइयों से जोड़ता है; इसलिए दोनों रूप अनुवाद में अलग रखे गए हैं।
    reason: textual_variant
  - marker: c
    text: एक हाथ (क्यूबिट) लगभग 45 सेंटीमीटर माना जाता है; अतः सात से दस हाथ करीब 3.2 से 4.5 मीटर होते हैं।
    reason: measurement
lexical_decisions:
- source_word: ፍሥሐተ ... ፍሥሐት
  choice: ढेर ... ढेर
  rationale: पांडुलिपि में शब्द का सामान्य अर्थ ‘आनन्द/उत्सव’ है, पर यहाँ उसे व्यापक रूप से मान्य लिपिकीय विकृति मानकर ‘ढेर’ का पाठ ग्रहण किया गया है; यही गिलाद/गल-एद से जुड़े ‘साक्षी के ढेर’ वाले स्थान-नाम की व्युत्पत्ति और प्रसंग को सार्थक बनाता है। शाब्दिक पांडुलिपि-पाठ पादटिप्पणी में सुरक्षित है।
- source_word: ምድረ፡ ራፋኤል / ምድረ፡ ረፋኤም
  choice: रफाइयों का देश
  rationale: पहला रूप अक्षरशः ‘रफाएल’ जैसा है, जबकि अगला वाक्य स्पष्ट रूप से रफाई लोगों (Rephaim) की भूमि कहता है। प्रसंग और समानांतर रूपों के आधार पर जाति-सूचक नाम ‘रफाई’ अपनाया गया, और पाठगत कठिनाई पादटिप्पणी में बताई गई।
- source_word: ረዐይት
  choice: दैत्याकार लोग
  rationale: शब्द को असाधारण विशाल कद वाले लोगों के अर्थ में लिया गया है; आगे दी गई सात से दस हाथ की ऊँचाई इस अर्थ को स्पष्ट करती है।
- source_word: በአመት
  choice: हाथ
  rationale: यह प्राचीन लंबाई-माप ‘क्यूबिट’ है; हिन्दी बाइबलीय प्रयोग में सहज ‘हाथ’ रखा गया और अनुमानित आधुनिक माप पादटिप्पणी में दिया गया।
theological_decisions:
- issue: रफाइयों की पहचान
  choice: उन्हें पाठ में प्राचीन विशालकाय लोगों के रूप में ही प्रस्तुत किया गया है
  alternative: उन्हें किसी विशिष्ट अलौकिक वर्ग या केवल साधारण जातीय समूह के रूप में निश्चित करना
  rationale: स्रोत उनका नाम, जन्मस्थान और असाधारण कद बताता है, पर उनकी प्रकृति पर कोई विस्तृत सिद्धान्त नहीं देता; इसलिए अनावश्यक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रफाई’ नाम को लिप्यंतरित किया गया है और ‘दैत्याकार’ केवल उनके बताए गए असाधारण कद को व्यक्त करता है। आरम्भिक पाठ-संशोधन को मुख्य पाठ में अपनाते हुए वास्तविक पांडुलिपि-पाठ पादटिप्पणी में स्पष्ट रखा गया है।
