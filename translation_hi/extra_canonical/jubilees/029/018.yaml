base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/029/018.yaml
  text: And he dwelt there apart from Esau his son. For in the days when Jacob went to Mesopotamia, Esau took for himself Mahalath, the daughter of Ishmael, as a wife, and he gathered together all his father's livestock and his wives, and he went up and dwelt on Mount Seir, and he left Isaac his father at the Well of the Oath.
translation:
  language: hi
  text: और वह अपने पुत्र एसाव से अलग वहीं रहने लगा।[a] क्योंकि जिन दिनों याकूब मेसोपोटामिया गया था, उन दिनों एसाव ने इश्माएल की बेटी महलत को अपने लिए पत्नी के रूप में लिया। फिर उसने अपने पिता के सारे पशुधन और अपनी पत्नियों को इकट्ठा किया, और ऊपर जाकर सेईर पर्वत पर रहने लगा। उसने अपने पिता इसहाक को शपथ के कुएँ के पास छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ रहने लगा।”
    reason: गीइज़ ህየ का अर्थ ‘वहाँ’ या संदर्भानुसार ‘वहीं’ हो सकता है।
lexical_decisions:
- source_word: ኀደረ
  choice: रहने लगा
  rationale: यह क्रिया ठहरने या निवास करने का भाव देती है; प्रसंग में स्थायी निवास की ओर बढ़ने के कारण स्वाभाविक हिन्दी रूप चुना गया।
- source_word: መስጴጦምያ
  choice: मेसोपोटामिया
  rationale: स्थाननाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: መርዔተ፡ አቡሁ
  choice: अपने पिता के सारे पशुधन
  rationale: संज्ञा पशुओं/पालित पशुओं के सामूहिक अर्थ में है; ‘पशुधन’ भेड़-बकरियों तक अर्थ को सीमित नहीं करता।
- source_word: ደብረ፡ ሴር
  choice: सेईर पर्वत
  rationale: शाब्दिक रूप से ‘सेईर का पर्वत’; हिन्दी बाइबलीय स्थाननाम के अनुरूप।
- source_word: ዐዘቅተ፡ መሐላ
  choice: शपथ का कुआँ
  rationale: पूर्ण पद खंड-विभाजन में छूट गया है, पर उपलब्ध पाठ-समीक्षा के अनुसार पद का अंतिम स्थानसूचक नाम यही है; अर्थ को अनूदित कर मुख्य पाठ में रखा गया।
theological_decisions:
- issue: पहले वाक्य में कर्ता और स्थान का संदर्भ
  choice: कर्ता को सर्वनाम ‘वह’ और स्थान को ‘वहीं’ रखते हुए अस्पष्टता बनाए रखी
  alternative: कर्ता का नाम या निश्चित स्थान जोड़ना
  rationale: दिए गए पद में कर्ता पूर्वसंदर्भ पर निर्भर है; नाम जोड़ने से मूल की संदर्भगत अस्पष्टता अनावश्यक रूप से समाप्त हो जाती।
- issue: अंतिम स्थाननाम का पुनर्स्थापन
  choice: ‘शपथ के कुएँ के पास’
  alternative: ‘वहीं’
  rationale: प्रदत्त गीइज़ अंश अंतिम ውስተ (‘में/पर’) पर कट गया है; पाठ-समीक्षा में पूर्ण पद का अंत ‘शपथ का कुआँ’ बताया गया है। केवल ‘वहीं’ कहना मूल स्थाननाम को खो देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। संबंधों और स्थाननामों को स्पष्ट रखा गया है, पर मूल में निहित कर्ता-संदर्भ की अस्पष्टता को नहीं मिटाया गया।
