  text: Abraham his father, on the mountain of Hebron. And there Jacob kept sending to his father and to his mother, from time to time, everything they needed; and they blessed Jacob with all their heart and with all their soul.
translation:
  language: hi
  text: हेब्रोन पर्वत पर, उसके पिता अब्राहम के पास। और वहाँ याकूब समय-समय पर अपने पिता और अपनी माता को उनकी हर आवश्यक वस्तु भेजता रहा; और उन्होंने अपने पूरे हृदय और पूरे प्राण से याकूब को आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'ህየ
  choice: और वहाँ से
  rationale: यह स्थानवाचक पद पूर्वोक्त हेब्रोन पर्वत से क्रिया का संबंध बनाए रखता है; हिन्दी में भेजने की क्रिया के साथ ‘वहाँ से’ स्वाभाविक है।
- source_word: እምጊዜ፡ በበ፡ ጊዜ
  choice: समय-समय पर
  rationale: पुनरावृत्त अंतराल पर होने वाली क्रिया का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: ኵሎ፡ ትካዞሙ
  choice: उनकी आवश्यकता की हर वस्तु
  rationale: संदर्भ में माता-पिता के निर्वाह हेतु आवश्यक सामग्री का बोध देता है और परामर्श-पाठ के ‘everything they needed’ के अनुरूप है।
- source_word: በኵሉ፡ ልቦሙ፡ ወበኵሉ፡ ነፍሶሙ
  choice: अपने सारे हृदय और अपने सारे प्राण से
  rationale: मूल के दोहरे, पूर्ण समर्पणसूचक वाक्यांश को औपचारिक गरिमा सहित बनाए रखता है।
