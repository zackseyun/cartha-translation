translation:
  language: hi
  text: वसंत, वर्षा, शीत ऋतु का मध्य और ग्रीष्म अब्राहम की मीनार में थे। क्योंकि इसहाक शपथ के कुएँ से लौट आया था और अपने पिता अब्राहम की मीनार में चढ़ गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማኅፈደ / ማኅፈድ
  choice: मीनार
  rationale: गीज़ शब्द का अर्थ यहाँ ‘मीनार’ है; इसी पद में आए दोनों प्रयोगों का एकसमान अनुवाद किया गया है।
- source_word: ዐዘቅተ፡ መሐላ
  choice: शपथ का कुआँ
  rationale: स्थान-सूचक पदबंध का अर्थानुसार अनुवाद किया गया है, नाम को अनावश्यक रूप से आधुनिक भौगोलिक नाम में नहीं बदला गया।
- source_word: ዐርገ
  choice: ऊपर चढ़ गया
  rationale: क्रिया में ऊपर जाने या चढ़ने का भाव है; मीनार के संदर्भ में इसे स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: ጸዳይ፡ ወዝናም፡ ወማእከለ፡ ክረምት፡ ወሐጋይ
  choice: वसंत, वर्षा, शीत ऋतु का मध्य और ग्रीष्म
  rationale: मूल पाठ की असामान्य ऋतु-सूची को स्पष्ट करने या पुनर्व्यवस्थित करने के बजाय यथासंभव सीधे रूप में सुरक्षित रखा गया है।
