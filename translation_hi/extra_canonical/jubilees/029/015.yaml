lexical_decisions:
- source_word: አመ፡ አቅራቦት
  choice: शरद ऋतु के समय
  rationale: यह ऋतु-सूचक पदबंध है और पिछले पद की ऋतुओं की सूची को पूरा करता है; इसे ‘तब वह लाया’ समझना धातु-साम्य के कारण हुई भ्रांति होगी।
- source_word: ወይፌኑ
  choice: और उसने ... भेजा
  rationale: क्रिया का अर्थ ‘भेजना’ है; भूतकालीन कथन के रूप में स्वाभाविक हिन्दी दी गई है।
- source_word: እምኵሉ፡ ጥሪቱ
  choice: अपनी सारी संपत्ति में से
  rationale: पदबंध का वितरणात्मक भाव सुरक्षित रखा गया है—उसने अपनी संपत्ति का सब कुछ नहीं, बल्कि उसमें से उपहार भेजे।
- source_word: ልብሰ
  choice: वस्त्र
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में कपड़े या वस्त्र को दर्शाता है।
- source_word: ወሲሲተ፡ ሥጋ
  choice: भोजन के लिए मांस
  rationale: ሲሲተ ‘भोजन/खाद्य-सामग्री’ और ሥጋ ‘मांस’ है। हिन्दी में इनके संबंध को स्वाभाविक ढंग से व्यक्त किया गया है, बिना ‘पहली उपज’ का अर्थ जोड़े।
