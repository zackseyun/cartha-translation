- source_word: ገለአድ
  choice: गिलाद
  rationale: यह स्थान-नाम पद के आरम्भ में पिछले संदर्भ से जुड़ा हुआ अंश है; प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: ፍሥሐተ
