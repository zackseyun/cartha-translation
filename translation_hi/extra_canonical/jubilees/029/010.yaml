lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: उनका निवास
  rationale: शब्द निवास-स्थान या रहने के क्षेत्र को दर्शाता है; यहाँ भौगोलिक विस्तार के संदर्भ में ‘उनका निवास’ स्वाभाविक है।
- source_word: ምድረ ውሉደ አሞን
  choice: अम्मोनियों के देश
  rationale: शाब्दिक अर्थ ‘अम्मोन की संतानों का देश’ है; आधुनिक हिन्दी में प्रचलित जातिनाम ‘अम्मोनी’ उसी आशय को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: እስከ ደብረ ሔርሞን
  choice: हेर्मोन पर्वत तक
  rationale: እስከ सीमा ‘तक’ और ደብር पर्वत को दर्शाता है; स्थाननाम को ‘हेर्मोन’ रूप में लिप्यंतरित किया गया है।
- source_word: ወቤተ
  choice: और घर का
  rationale: ወ- का अर्थ ‘और’ है तथा ቤተ संबंधसूचक/construct रूप है, ‘घर का’। उपलब्ध स्रोत इसी स्थान पर खंडित है, इसलिए इसे ‘बेतेल’ मानकर पूरा नहीं किया गया।
