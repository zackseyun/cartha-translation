  text: And the Lord did not allow him to devise harm against Jacob, because he had appeared to him in a dream.
translation:
  language: hi
  text: और प्रभु ने उसे याकूब के विरुद्ध हानि की योजना बनाने नहीं दी, क्योंकि वह उसे स्वप्न में दिखाई दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢኀደጎ
  choice: उसे ... नहीं दी
  rationale: निषेध के साथ यह क्रिया किसी को कुछ करने की अनुमति न देने का भाव व्यक्त करती है।
- source_word: ይሕስም
  choice: हानि की योजना बनाने
  rationale: यहाँ क्रिया याकूब के विरुद्ध बुरा या हानिकारक इरादा गढ़ने का भाव रखती है; ‘हानि की योजना बनाने’ से आशय स्वाभाविक हिन्दी में स्पष्ट रहता है।
- source_word: አስተረአዮ
  choice: वह उसे ... दिखाई दिया था
  rationale: स्वप्न में प्रकट होने की क्रिया को कारणसूचक उपवाक्य में पूर्वघटित घटना के रूप में व्यक्त किया गया है।
- source_word: በሕልም
  choice: स्वप्न में
  rationale: मूल का सीधा और गरिमापूर्ण हिन्दी समतुल्य।
theological_decisions:
- issue: कारणसूचक उपवाक्य में कर्ता की पहचान
  choice: ‘वह’ को प्रभु के संदर्भ में रखा गया
  alternative: ‘वह’ किसी अन्य पुरुष के संदर्भ में समझा जा सकता है
  rationale: निकटतम स्पष्ट कर्ता ‘प्रभु’ है और प्रसंग प्रभु के स्वप्न में प्रकट होने का संकेत देता है; फिर भी मूल के सर्वनाम को नाम से बदलकर अस्पष्टता पूरी तरह समाप्त नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और स्रोत की वाक्य-संरचना के निकट है। ‘प्रभु’ और ‘स्वप्न’ पाठ के धार्मिक-साहित्यिक रजिस्टर के अनुरूप हैं।
