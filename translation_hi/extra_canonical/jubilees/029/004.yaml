  yaml_path: translation/extra_canonical/jubilees/029/004.yaml
  text: And Jacob blessed the God of Isaac his father, and the God of Abraham, the father of his father; and he arose and set his wives and his children on animals, and took all his possessions, and crossed the River and arrived.
translation:
  language: hi
  text: और याकूब ने अपने पिता इसहाक के परमेश्वर को और अपने पिता के पिता, अब्राहम के परमेश्वर को धन्य कहा। फिर वह उठा, अपनी पत्नियों और बच्चों को पशुओं पर बैठाया, अपनी सारी सम्पत्ति ली, नदी पार की और पहुँच गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: धन्य कहा
  rationale: गीज़ क्रिया का अर्थ आशीष देना/धन्य कहना है; परमेश्वर इसके कर्म हैं, इसलिए आधुनिक हिन्दी में ‘परमेश्वर को धन्य कहा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ጸዐ (पाठ में अपूर्ण; अपेक्षित ጸዐነ)
  choice: पशुओं पर बैठाया
  rationale: यह परिवार को भारवाहक या सवारी के पशुओं पर चढ़ाने का भाव देता है; संदर्भ में ‘बैठाया’ सहज हिन्दी है और इसे अगले ነሥአ से अलग रखता है।
- source_word: ጥሪተ
  choice: सम्पत्ति
  rationale: यह चल-अचल सामान/अर्जित धन के सामूहिक अर्थ को व्यक्त करता है; ‘सारी सम्पत्ति’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ፈለገ
  choice: नदी
  rationale: यहाँ संज्ञा नदी/जलधारा को सूचित करती है; सन्दर्भानुसार निश्चित नदी अभिप्रेत है, पर उसका नाम स्रोत में नहीं दिया गया।
- source_word: ወበጽሐ
  choice: और पहुँच गया
  rationale: क्रिया पहुँचने को व्यक्त करती है, पर गन्तव्य इस पद में अनुक्त है; हिन्दी में भी इस खुलेपन को बनाए रखा गया है।
theological_decisions:
- issue: याकूब द्वारा परमेश्वर को आशीष देना
  choice: परमेश्वर को धन्य कहा
  alternative: परमेश्वर की स्तुति की
  rationale: स्रोत की ‘आशीष देना’ वाली शब्दावली को बनाए रखा गया है; ‘स्तुति की’ अर्थ को सहज बनाती, पर मूल रूपक को बदल देती।
- issue: इसहाक और अब्राहम के परमेश्वर का उल्लेख
  choice: अपने पिता इसहाक के परमेश्वर और अपने पिता के पिता अब्राहम के परमेश्वर
  alternative: अपने पिता इसहाक और अपने दादा अब्राहम के परमेश्वर
  rationale: दो समानान्तर सम्बन्धवाचक पदों को सुरक्षित रखा गया है और उन्हें एक संयुक्त ‘परमेश्वर’ पद में समेटकर मूल की पुनरुक्ति नहीं हटाई गई।
- issue: अनुक्त गन्तव्य
  choice: पहुँच गया
  alternative: वहाँ पहुँच गया
  rationale: मूल में गन्तव्य व्यक्त नहीं है; ‘वहाँ’ जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। वाक्य-क्रम को हिन्दी के अनुरूप किया गया है, जबकि परिवार को पशुओं पर बैठाने और सम्पत्ति लेने वाली दो अलग क्रियाएँ स्पष्ट रखी गई हैं। ‘पत्नियों’ बहुवचन और गन्तव्य की अस्पष्टता स्रोत के अनुसार सुरक्षित हैं।
