  text: And Jacob saw that Laban had gone to shear his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come with him to the land of Canaan.
translation:
  language: hi
  text: और याकूब ने देखा कि लाबान अपनी भेड़ों का ऊन कतरने गया था। तब याकूब ने लिआ और राहेल को बुलाया और उन्हें समझाकर कहा[a] कि वे उसके साथ कनान देश चलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके हृदयों से बात की।”
    reason: मूल गीइज़ में हृदय/मन का स्पष्ट उल्लेख है। यह सामी मुहावरा आत्मीयता से अथवा मनाने के उद्देश्य से बोलने का भाव दे सकता है; मुख्य पाठ में इसका स्वाभाविक हिन्दी रूप दिया गया है।
lexical_decisions:
- source_word: ይቅርጽ፡ አባግዒሁ
  choice: अपनी भेड़ों का ऊन कतरने
  rationale: क्रिया और कर्म का स्वाभाविक हिन्दी रूप; आशय भेड़ों की ऊन कतरना है।
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: उनके मन से बात की
  rationale: मूल का शाब्दिक और भावात्मक मुहावरा ‘उनके हृदय/मन में बात की’ आत्मीय अथवा समझाने वाली बातचीत का संकेत देता है; ‘मन से बात की’ आधुनिक हिन्दी में इस विशेषता को बनाए रखता है।
- source_word: ከመ፡ ይምጽኣ፡ ምስ ሌሁ
  choice: कि वे उसके साथ ... चलें
  rationale: उद्देश्यवाचक आशय को स्वाभाविक हिन्दी में व्यक्त करता है और कनान की ओर साथ जाने की बात स्पष्ट रखता है।
- source_word: ምድረ፡ ከናአን
  choice: कनान देश
  rationale: ‘कनान की भूमि’ का प्रचलित, सहज और गरिमापूर्ण हिन्दी रूप।
