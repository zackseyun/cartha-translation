  text: And he went from him to the land of Seir, but Jacob dwelt in tents. And in the first year of the fifth week in this jubilee, he crossed the Jordan and dwelt beyond the Jordan, and he pastured his sheep from the Sea of Heaps[14] as far as Beth-shan and as far as Dothan and as far as
translation:
  language: hi
  text: और वह उसके पास से सेईर देश चला गया, और याकूब तंबुओं में रहता था। इस जुबली के पाँचवें सप्ताह के पहले वर्ष में उसने यरदन पार किया और यरदन के उस पार रहा। वह अपनी भेड़ों को ढेरों के समुद्र[a] से बेत-शान तक, दोतान तक, और ... तक चराता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ढेरों का समुद्र’ इथियोपिक पाठ में एक अनिश्चित स्थान-नाम है; इसके पीछे कोई दूसरा मूल स्थान-नाम हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድረ፡ ሴኢር
  choice: सेईर देश
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है; ምድረ का अर्थ ‘देश/भूमि’ है।
- source_word: ኀደረ፡ በምጽላላት
  choice: तंबुओं में रहने लगा
  rationale: क्रिया ኀደረ निवास करने को और ምጽላላት बहुवचन आश्रयों/तंबुओं को सूचित करता है; सहज हिन्दी में आरंभिक भाव संदर्भानुकूल है।
- source_word: አ፻ቤሊዉ
  choice: जुबली
  rationale: कालगणना के तकनीकी पद को पुस्तक के नाम और साहित्यिक संदर्भ के अनुरूप लिप्यंतरित किया गया है।
- source_word: ዐደወ፡ ዮርዳኖስ
  choice: यरदन पार किया
  rationale: ዐደወ का सामान्य अर्थ पार करना है और यरदन इसका कर्म है।
- source_word: ማዕዶተ፡ ዮርዳኖስ
  choice: यरदन के उस पार
  rationale: यह पारवर्ती भूभाग को दर्शाता है; ‘उस पार’ स्वाभाविक हिन्दी है और दिशा की संदर्भगत सापेक्षता बनाए रखता है।
- source_word: አባግዒሁ
  choice: अपनी भेड़-बकरियाँ
  rationale: यह पशुधन, विशेषतः छोटे पालतू झुंड, को सूचित करता है; हिन्दी में ‘भेड़-बकरियाँ’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ባሕረ፡ ፌሐሐት
  choice: ढेरों का समुद्र
  rationale: इथियोपिक पद का शाब्दिक अर्थ इसी दिशा में जाता है, पर स्थान-नाम संदिग्ध है; इसलिए अनुवाद के साथ पादटिप्पणी दी गई है।
- source_word: ቤተስን / ዶታኤም
  choice: बेत-शान / दोतान
  rationale: दोनों स्थान-नामों के परिचित हिन्दी बाइबलीय रूप अपनाए गए हैं।
theological_decisions:
- issue: पहले वाक्य के कर्ता की पहचान
  choice: ‘वह’ सर्वनाम रखा गया
  alternative: संदर्भ से ‘एसाव’ नाम जोड़ना
  rationale: इस पद के उपलब्ध गीइज़ पाठ में कर्ता स्पष्ट नाम से नहीं आया है; नाम जोड़ने के बजाय स्रोत की संदर्भ-निर्भरता सुरक्षित रखी गई है।
- issue: पद का अपूर्ण अंतिम वाक्यांश
  choice: ‘और आगे... तक’ के रूप में अपूर्णता दिखाई गई
  alternative: अगले पद से कोई स्थान-नाम लेकर वाक्य पूरा करना
  rationale: प्रदत्त स्रोत ወእስከ (‘और ... तक’) पर समाप्त होता है। लुप्त सामग्री का अनुमान लगाकर जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। कालगणना की तकनीकी संरचना को स्पष्ट रखा गया है, स्थान-नामों के प्रचलित हिन्दी रूप लिए गए हैं, और स्रोत की अंतिम अपूर्णता को बिना मनमाने पूरण के दर्शाया गया है।
