  text: and drink[16], and milk, and butter, and bread of milk, and from the instruction of all. And for his mother Rebekah, a fourth of the year, in the middle of their times of the months, and between plowing and reaping, and in the middle.
translation:
  language: hi
  text: और पीने की वस्तुएँ, दूध, तेल, दूध से बनी रोटी[a], और घाटी के खजूर। और उसकी माता रिबका के लिए, वर्ष का एक चौथाई—महीनों के उनके नियत समयों के बीच, और जुताई और कटाई के बीच, और बीच में…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘दूध की रोटी’ है। इसका आशय किसी दुग्ध-निर्मित खाद्य, सम्भवतः पनीर, से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध गीज़ पाठांश यहीं अधूरे वाक्य के बीच समाप्त होता है।
    reason: textual_fragment
lexical_decisions:
- source_word: ወስቴ
  choice: और पेय
  rationale: शब्द पेय अथवा पीने की वस्तु को सूचित करता है; खंड के आरंभ में आए संयोजक को भी बनाए रखा गया है।
- source_word: ወኅብስተ፡ ሐሊብ
  choice: दूध की रोटी
  rationale: शाब्दिक संरचना को रखा गया है, क्योंकि आशय कोई दुग्ध-निर्मित खाद्य, संभवतः पनीर, हो सकता है पर निश्चित नहीं है।
- source_word: ወእምነ፡ ትመርት፡ ቍላ
  choice: और हर प्रकार की उपज
  rationale: ትመርት को यहाँ उत्पादन/उपज और ቍላ को ‘सब/हर प्रकार’ समझना संदर्भानुकूल है; ‘निर्देश’ अर्थ यहाँ खाद्य-सूची में असंगत है।
- source_word: ርብዕ፡ ለዓመት
  choice: वर्ष का एक चौथाई भाग
  rationale: समय की चौथाई अवधि का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ለአውራኅ
  choice: महीनों के
  rationale: गीज़ पद का अर्थ ‘महीनों के’ है, ‘मार्गों के’ नहीं।
- source_word: ማእከለ፡ ሐፅኒ፡ ወለ'ዐጺድ
  choice: जुताई और कटाई के बीच
  rationale: द्विपदी संरचना ‘के बीच ... और ...’ है; पहला पद जुताई और दूसरा कटाई/फसल काटने को सूचित करता है।
