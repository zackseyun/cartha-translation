  text: life upon the earth.[12] And Jacob sent Laban away,, and he went into Mesopotamia, the land of the east; and Jacob returned to the land of Gilead. And he crossed the Jabbok in the ninth month, on the eleventh; and on that day Esau his brother came to him, and he was reconciled with him,
translation:
  language: hi
  text: पृथ्वी पर उनका जीवन फिर नहीं रहा।[a] तब याकूब ने लाबान को विदा किया, और वह मेसोपोटामिया, अर्थात् पूरब के देश, को चला गया। याकूब गिलाद देश लौट आया। नौवें महीने की ग्यारहवीं तारीख को उसने यब्बोक नदी पार की। उसी दिन उसका भाई एसाव उसके पास आया, और एसाव का याकूब के साथ मेल हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्यांश का अर्थ यह भी हो सकता है: “पृथ्वी पर उनके लिए जीवन का कोई अंश शेष नहीं रहा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ፈነወ
  choice: विदा किया
  rationale: क्रिया का आशय किसी को जाने देना या रवाना करना है; प्रसंग में ‘विदा किया’ स्वाभाविक और गरिमापूर्ण हिंदी है।
- source_word: ያዕቆብ
  choice: याकूब
  rationale: हिंदी बाइबलीय परंपरा में प्रचलित नामरूप।
- source_word: ላባሃ
  choice: लाबान
  rationale: हिंदी बाइबलीय परंपरा में प्रचलित नामरूप; यहाँ कर्म के रूप में प्रयुक्त है।
- source_word: ሜስጶ
  choice: मेसोपोटामिया
  rationale: पांडुलिपि-पंक्ति में आरंभ हुए स्थाननाम को उपलब्ध पाठ-साक्ष्य और परामर्श-पाठ के अनुसार पूरा किया गया है।
- source_word: life upon the earth
  choice: पृथ्वी पर उनका जीवन फिर नहीं रहा
  rationale: खंडित आरंभ को परामर्श-पाठ में संरक्षित अर्थ के अनुसार सुबोध हिंदी में रखा गया है, बिना वैकल्पिक ‘जीवन का कोई अंश शेष न रहा’ अर्थ को मुख्य पाठ में आरोपित किए।
- source_word: Jabbok
  choice: यब्बोक नदी
  rationale: आधुनिक पाठक के लिए भौगोलिक संदर्भ स्पष्ट करने हेतु प्रचलित नाम के साथ ‘नदी’ जोड़ा गया है।
- source_word: was reconciled with him
  choice: दोनों में मेल हो गया
  rationale: पारस्परिक मेल-मिलाप का भाव स्वाभाविक हिंदी में व्यक्त करता है और कर्तृत्व को अनावश्यक रूप से किसी एक भाई तक सीमित नहीं करता।
theological_decisions:
- issue: आरंभिक खंड में जीवन के समाप्त होने की अभिव्यक्ति
  choice: पृथ्वी पर उनका जीवन फिर नहीं रहा
  alternative: पृथ्वी पर उनके लिए जीवन का कोई अंश शेष नहीं रहा
  rationale: मुख्य पाठ सामान्य मृत्यु/जीवन-समाप्ति का अर्थ बनाए रखता है; अधिक प्रबल ‘कोई अंश शेष नहीं’ पाठ को पादटिप्पणी में सुरक्षित किया गया है।
- issue: याकूब और एसाव के मेल-मिलाप की पारस्परिकता
  choice: दोनों में मेल हो गया
  alternative: एसाव का उसके साथ मेल हो गया
  rationale: स्रोत की अभिव्यक्ति को किसी एक पक्ष की धार्मिक या नैतिक पहल के रूप में अधिक स्पष्ट किए बिना पारस्परिक परिणाम के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पूरब का देश’, ‘ग्यारहवीं तारीख’ और ‘दोनों में मेल हो गया’ जैसे रूप सामान्य पाठकों के लिए स्पष्ट हैं। आरंभिक वाक्य पूर्ववर्ती प्रसंग से जुड़ा हुआ खंड है; उपलब्ध परामर्श-साक्ष्य के आधार पर उसका अर्थपूर्ण हिंदी रूप दिया गया है।
