base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/002.yaml
  text: And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth of everything that had come with him, from people to cattle, from gold to all possessions; and he brought it and gave a tenth of everything.
translation:
  language: hi
  text: याकूब इस महीने के चौदहवें दिन भोर में उठा, और जो कुछ उसके साथ आया था—मनुष्यों से लेकर पशुओं तक, और सोने से लेकर सारी संपत्ति तक—उस सब में से उसने दसवाँ भाग दिया; फिर वह उसे ले आया और उस सब में से दसवाँ भाग दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጌሰ፡ ያዕቆብ፡ በነግህ
  choice: याकूब भोर को उठा
  rationale: क्रिया और काल-सूचक पद का स्वाभाविक तथा गरिमापूर्ण हिन्दी रूप; सुबह बहुत जल्दी उठने का भाव सुरक्षित है।
- source_word: ዐሡሩ፡ ወረቡዑ፡ ለዝ፡ ወርኅ
  choice: इस महीने के चौदहवें दिन
  rationale: क्रमवाचक दिन और महीने के संबंध को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ወዐሠረ፡ እምኵሉ
  choice: उस सब का दसवाँ भाग दिया
  rationale: मूल क्रिया का दशमांश देने का भाव सीधे व्यक्त किया गया है; अपेक्षाकृत अपरिचित 'दशमांश चढ़ाया' से बचकर सामान्य पाठक के लिए स्पष्टता रखी गई है।
- source_word: እምሰብእ፡ እስከ፡ እንስሳ
  choice: मनुष्यों से लेकर पशुओं तक
  rationale: मूल की समावेशी सीमा को बिना नरम किए सुरक्षित रखता है।
- source_word: እምወርቅ፡ እስከ፡ ኵሉ፡ ንዋይ
  choice: सोने से लेकर सारी संपत्ति तक
  rationale: ንዋይ के व्यापक अर्थ को यहाँ चल संपदा/वस्तुओं तक सीमित किए बिना स्वाभाविक हिन्दी 'संपत्ति' से व्यक्त किया गया है।
- source_word: ወአብአ
  choice: वह उसे ले आया
  rationale: यह causative रूप 'अंदर लाना/ले आना' दर्शाता है; इसलिए पुराने विकल्प 'उसने लिया' को अस्वीकार किया गया है।
theological_decisions:
- issue: क्या मनुष्यों को भी दिए गए दसवें भाग में शामिल समझा जाए
  choice: मूल की स्पष्ट सीमा-संरचना 'मनुष्यों से लेकर पशुओं तक' को ज्यों का त्यों रखा
  alternative: इसे केवल याकूब के घराने की गणना या समर्पण के रूप में व्याख्यायित करना
  rationale: पद स्वयं इस कार्य की विधि या मनुष्यों के साथ किए गए व्यवहार को स्पष्ट नहीं करता; किसी विशिष्ट धार्मिक प्रथा को थोपना उचित नहीं।
- issue: दसवाँ भाग किसे दिया गया
  choice: प्राप्तकर्ता को इस पद में अनिर्दिष्ट रखा
  alternative: स्पष्ट रूप से 'परमेश्वर को' जोड़ना
  rationale: आरंभ का 'ለእግዚአብሔር' संभवतः पिछले वाक्य का अंतिम अंश है, और दिए गए पद-विभाजन तथा अंग्रेज़ी परामर्श-पाठ में इसे पद 2 की मुख्य बात नहीं माना गया; अतः पाठ में प्राप्तकर्ता नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण कथात्मक शैली। समानांतर संरचना और मूल की पुनरावृत्ति सुरक्षित रखी गई है। 'दसवाँ भाग दिया' सामान्य पाठकों के लिए 'दशमांश दिया' से अधिक पारदर्शी है।
