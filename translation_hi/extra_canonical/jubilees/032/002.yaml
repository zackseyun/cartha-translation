- from: और इस महीने के चौदहवें दिन याकूब भोर को उठा। जो कुछ उसके साथ आया था—मनुष्यों से लेकर पशुओं तक और सोने से लेकर सारी संपत्ति तक—उसने उस सब का दसवाँ भाग दिया; वह उसे ले आया और उसने हर वस्तु का दसवाँ भाग दिया।
  to: याकूब इस महीने के चौदहवें दिन भोर में उठा, और जो कुछ उसके साथ आया था—मनुष्यों से लेकर पशुओं तक, और सोने से लेकर सारी संपत्ति तक—उस सब में से उसने दसवाँ भाग दिया; फिर वह उसे ले आया और उस सब में से दसवाँ भाग दिया।
