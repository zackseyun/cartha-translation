base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/018.yaml
  text: Blessed be everyone who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and be spoken of throughout all the earth and regions. Then nations will fear before your face.
translation:
  language: hi
  text: जो कोई तुझे आशीष देता है, वह धन्य हो; और जितने लोग तुझे शाप देते हैं, वे शापित हों। और उसने यहूदा से कहा, “प्रभु तुझे सामर्थ्य और शक्ति दे, ताकि तू उन सबको पैरों तले रौंदे जो तुझसे बैर रखते हैं। तू और तेरे पुत्रों में से कोई एक, याकूब के पुत्रों पर शासक हो। तेरा नाम और तेरे पुत्रों का नाम निकले और सारी पृथ्वी और देशों में सुनाया जाए[a]। तब जातियाँ तेरे सामने भयभीत होंगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “देशों” के स्थान पर “प्रदेशों” या “नगरों” का अनुवाद भी संभव है; संबंधित गीइज़ शब्द इन अर्थ-क्षेत्रों में प्रयुक्त हो सकता है।
    reason: मूल संज्ञा की शब्दार्थगत व्यापकता को दर्शाना।
  - marker: b
    text: 'शाब्दिक अर्थ: “तेरे मुख के आगे।”'
    reason: मुख्य पाठ में दिए स्वाभाविक हिन्दी मुहावरे के पीछे का स्रोत-चित्र सुरक्षित रखना।
lexical_decisions:
- source_word: ቡሩክ
  choice: धन्य हो
  rationale: यह आशीर्वाद-सूत्र का विधिलिंग अर्थ व्यक्त करता है। निकटवर्ती संदर्भ और परामर्श-पाठ के आधार पर निहित आशय ‘जो कोई तुझे आशीष देता है’ स्पष्ट किया गया है।
- source_word: እግዚአ ብሔር
  choice: प्रभु
  rationale: यह गीइज़ में परमेश्वर के लिए प्रचलित पद है; आधुनिक हिन्दी में ‘प्रभु’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ኃይለ ወጽንዐ
  choice: सामर्थ्य और शक्ति
  rationale: दोनों समांतर संज्ञाओं के बल और दृढ़ क्षमता के अर्थ को अलग-अलग रखते हुए सहज हिन्दी दी गई है।
- source_word: ትኪዶሙ
  choice: पैरों तले रौंदे
  rationale: क्रिया के शत्रुओं पर चलने/उन्हें रौंदने के प्रबल चित्रात्मक अर्थ को बनाए रखता है।
- source_word: መኰንነ
  choice: शासक
  rationale: पद शासक, अधिकारी या न्यायी का अर्थ दे सकता है; इस राजकीय आशीर्वाद में ‘शासक’ सर्वाधिक उपयुक्त है।
- source_word: ዘየሐውር ወዘያንበቡ
  choice: निकले और ... सुनाया जाए
  rationale: पहली क्रिया नाम के फैलने/जाने और दूसरी उसके पढ़े या घोषित किए जाने को दर्शाती है; हिन्दी में नाम की ख्याति के संदर्भ में यह युग्म स्वाभाविक है।
- source_word: አህጉር
  choice: देशों
  rationale: बहुवचन पद देशों, प्रदेशों या नगरों को सूचित कर सकता है; पृथ्वी के साथ समानांतर प्रयोग में ‘देशों’ को मुख्य पाठ में चुना गया है।
- source_word: እምቅድመ ገጽከ
  choice: तेरे सामने
  rationale: शाब्दिक ‘तेरे मुख के आगे’ का स्वाभाविक हिन्दी मुहावरा है।
theological_decisions:
- issue: यहूदा और उसके एक वंशज का शासन
  choice: ‘तू और तेरे वंशजों में से एक’ को यथावत रखा गया
  alternative: इसे किसी विशिष्ट भावी मसीही व्यक्ति के रूप में पहचानना
  rationale: स्रोत एक वंशज का उल्लेख करता है, पर उसका नाम या धर्मवैज्ञानिक परिचय नहीं देता; अनुवाद ने इस खुलापन को सुरक्षित रखा है।
- issue: जातियों का भय
  choice: ‘तेरे सामने भय खाएँगी’
  alternative: ‘तेरे कारण आतंकित होंगी’
  rationale: स्रोत का मुख/उपस्थिति-संबंधी मुहावरा रखा गया है और भय के स्वरूप पर अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। संबोधन की एकवचन आत्मीय/प्राचीन शैली (‘तू/तेरे’) आशीर्वाद-वचन की प्रत्यक्षता और पूरे अनुच्छेद की संगति के लिए रखी गई है। उद्धरण को इस पद के अंत में बंद नहीं किया गया, क्योंकि वक्ता का कथन अगले पद में जारी रहता है।
