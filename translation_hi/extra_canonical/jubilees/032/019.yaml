  yaml_path: translation/extra_canonical/jubilees/032/019.yaml
  text: all the children of men. And I will give to your seed all the earth that is under heaven, and they will rule over all the nations as they desire; and after this they will draw the whole earth to themselves and inherit it.
translation:
  language: hi
  text: मनुष्यों की सारी सन्तान। और मैं तेरे वंश को आकाश के नीचे की सारी पृथ्वी दूँगा। वे अपनी इच्छा के अनुसार सभी जातियों पर शासन करेंगे; और इसके बाद वे सारी पृथ्वी को अपने पास समेट लेंगे[a] और उसे विरासत के रूप में प्राप्त करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सारी पृथ्वी को इकट्ठा करेंगे।’
    reason: मूल क्रिया का अर्थ ‘इकट्ठा करना’, ‘एकत्र करना’ या सन्दर्भानुसार ‘अपने पास समेटना’ हो सकता है।
lexical_decisions:
- source_word: ዘርእከ
  choice: तेरे वंश
  rationale: यह शब्द ‘बीज’ और ‘वंश’ दोनों अर्थ रखता है; यहाँ भावी सन्तानों के सामूहिक अर्थ में ‘वंश’ स्वाभाविक और सटीक है।
- source_word: ይኴንኑ
  choice: शासन करेंगे
  rationale: सन्दर्भ में यह राष्ट्रों पर अधिकार या प्रभुत्व रखने को व्यक्त करता है; ‘शासन करेंगे’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ያስተጋብኡ
  choice: अपने पास समेट लेंगे
  rationale: प्रेरणार्थक क्रिया में इकट्ठा करने या अपनी ओर एकत्र करने का भाव है। सन्दर्भ में ‘अपने पास समेट लेंगे’ पृथ्वी पर अधिकार को संगठित करने की बारीकी व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ይወርስዋ
  choice: उसे विरासत में पाएँगे
  rationale: क्रिया का मूल अर्थ उत्तराधिकार में पाना है; यह अनुवाद उस विरासत-संबंधी भाव को बनाए रखता है।
theological_decisions:
- issue: वंश के सार्वभौमिक शासन का स्वरूप
  choice: सभी जातियों पर शासन करेंगे
  alternative: सभी जातियों के बीच शासन करेंगे
  rationale: मूल पद में प्रभुत्व का लक्ष्य ‘सभी जातियाँ’ हैं; ‘पर’ अधिकार के सम्बन्ध को अधिक स्वाभाविक ढंग से व्यक्त करता है, बिना इस शासन की धार्मिक या ऐतिहासिक पहचान तय किए।
- issue: सारी पृथ्वी को एकत्र करने का आशय
  choice: अपने पास समेट लेंगे
  alternative: सारी पृथ्वी को इकट्ठा करेंगे
  rationale: मूल क्रिया की अर्थ-सीमा को सन्दर्भानुकूल ढंग से प्रस्तुत किया गया है, पर उसकी सम्भव अधिक शाब्दिक व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। एकवचन सम्बोधन के लिए ‘तेरे’ का प्रयोग प्राचीन वाचिक प्रसंग के अनुरूप है। आरम्भिक खण्ड पिछले वाक्य की निरन्तरता है, इसलिए उसे स्रोत के अनुसार वाक्यांश के रूप में रहने दिया गया है।
