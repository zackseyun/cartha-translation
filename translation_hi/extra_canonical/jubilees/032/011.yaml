base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/011.yaml
  text: Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD destroyed them for their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed all their sins, and they are no more.
translation:
  language: hi
  text: उनके राज्य कर्नाइम, अश्तारोत, एद्रेई, मिसूर और बेओन थे। प्रभु ने उनके बुरे कामों के कारण उनका नाश कर दिया, क्योंकि वे अत्यन्त दुष्ट थे। उसने उनके स्थान पर एमोरियों को बसाया, जो बुरे और पापी थे। आज कोई ऐसा जनसमूह नहीं है जिसने उनके सारे पाप पूरे किए हों, और वे अब नहीं रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕጐሎሙ
  choice: उनका नाश कर दिया
  rationale: गीज़ क्रिया का अर्थ ‘नष्ट करना/बरबाद करना’ है; ‘न्याय किया’ की अपेक्षा यह स्रोत के अधिक निकट है।
- source_word: ጸዋጋን፡ ጥቀ
  choice: अत्यन्त दुष्ट
  rationale: तीव्रता को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አኅደረ፡ አሞሬዎነ
  choice: एमोरियों को बसाया
  rationale: कारक क्रिया और बहुवचन जातिनाम दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: जिसने उनके सारे पाप पूरे किए हों
  rationale: ‘सारे’ मूल ኵሎ को स्पष्ट रखता है और ‘पापों को पूरा करना’ की असामान्य किंतु स्रोतगत अभिव्यक्ति को अनावश्यक व्याख्या के बिना बनाए रखता है।
- source_word: ወአልቦሙ
  choice: और अब वे रहे नहीं
  rationale: खंड के अंतिम संक्षिप्त अस्तित्व-निषेध को स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय उपाधि እግዚአብሔር
  choice: प्रभु
  alternative: यहोवा
  rationale: गीज़ पाठ में सामान्य ईश्वरीय उपाधि है, प्रत्यक्ष रूप से दिव्य नाम नहीं; इसलिए ‘प्रभु’ स्रोत-रूप को अधिक ठीक रखता है।
- issue: अंतिम वाक्य में सर्वनामों का संदर्भ
  choice: ‘उनके’ और ‘वे’ को बिना स्पष्ट किए बनाए रखा
  alternative: उन्हें पूर्ववर्ती एमोरियों या नष्ट किए गए लोगों में से किसी एक से स्पष्टतः जोड़ना
  rationale: स्रोत में संदर्भ तनावपूर्ण/अस्पष्ट है; किसी एक समूह को निश्चित करना व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण गद्य। स्थान-नामों का देवनागरी लिप्यंतरण किया गया है। स्रोत की असामान्य ‘पाप पूरे करना’ अभिव्यक्ति और अंतिम सर्वनामगत अस्पष्टता को जानबूझकर सुरक्षित रखा गया है।
