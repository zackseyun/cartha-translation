base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/016.yaml
  text: The LORD will put it in their mouths, that they may bless all the seed of the beloved. Your mother called you Levi, and in truth she called you so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours, and you and your sons shall eat, and for all.
translation:
  language: hi
  text: परमेश्वर यह बात उनके मुँह में डालेगा, ताकि वे प्रिय के समस्त वंश को आशीष दें। तुम्हारी माता ने तुम्हारा नाम लेवी रखा; और सचमुच उसने तुम्हें यह नाम इसलिए दिया कि तुम परमेश्वर से जुड़े रहो और याकूब के सभी पुत्रों के सहभागी बनो। परमेश्वर की मेज़ तुम्हारी हो, और तुम और तुम्हारे पुत्र उसमें से खाओ—और सबके लिए भी…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त गीइज़ पाठ यहाँ ‘और सबके लिए’ जैसे अधूरे वाक्यांश पर समाप्त होता है; आगे के लुप्त शब्दों का अर्थ निश्चित नहीं है।
    reason: स्रोत-पाठ की अपूर्णता और वास्तविक अनिश्चितता को स्पष्ट करना।
lexical_decisions:
- source_word: አብሔር
  choice: परमेश्वर
  rationale: यहाँ ईश्वर के लिए प्रयुक्त पद का सीधा और स्वाभाविक हिन्दी रूप; उपलब्ध गीइज़ पाठ में इस स्थान पर विशिष्ट वाचा-नाम स्पष्ट नहीं है, इसलिए ‘यहोवा’ नहीं चुना गया।
- source_word: ኵሎ፡ ዘርአ፡ ለፍቅር
  choice: उस प्रिय जन के समस्त वंश
  rationale: ‘बीज’ के सामूहिक वंशार्थ को आधुनिक हिन्दी में ‘वंश’ से व्यक्त किया और ‘प्रिय’ को संज्ञात्मक अर्थ में बनाए रखा।
- source_word: ሌዊሃ … አጸቁ
  choice: लेवी … जुड़े रहो
  rationale: लेवी के नाम और ‘जुड़ने’ के बीच निहित शब्द-क्रीड़ा को हिन्दी में यथासंभव सुरक्षित रखा गया।
- source_word: ሱታፌ
  choice: सहभागी
  rationale: यह शब्द साथी, साझेदार या सहभागी का भाव रखता है; ‘सहभागी’ संबंध और साझेदारी दोनों को संक्षेप में व्यक्त करता है।
- source_word: ማእዳ፡ ለከ፡ ትኩን
  choice: उसकी मेज़ तुम्हारी हो
  rationale: वाक्य को ‘तुम्हारी मेज़ पर खाएँ’ में मिलाने के बजाय स्रोत की पृथक आशीर्वादात्मक उपवाक्य-रचना बनाए रखी गई।
theological_decisions:
- issue: ईश्वर-संबंधी नाम का अनुवाद
  choice: परमेश्वर
  alternative: प्रभु / यहोवा
  rationale: इस पद के आरंभ में उपलब्ध रूप አብሔር है, जबकि आगे እግዚአብሔር आता है। दोनों को बिना पर्याप्त आधार अलग-अलग दैवी पहचानों में बाँटने या वाचा-नाम जोड़ने के बजाय सामान्य, गरिमापूर्ण ‘परमेश्वर’ रखा गया।
- issue: लेवी के नाम का उद्देश्य
  choice: परमेश्वर से जुड़े रहो
  alternative: परमेश्वर के निकट आओ
  rationale: यह चयन लेवी के नाम से जुड़ी ‘जुड़ना’ वाली व्युत्पत्तिपरक प्रतिध्वनि को सुरक्षित रखता है; केवल ‘निकट आना’ उस शब्द-क्रीड़ा को कमजोर कर देता।
- issue: अंतिम अपूर्ण वाक्यांश
  choice: और सबके लिए भी…
  alternative: अर्थ पूरा करने के लिए कोई अनुमानित वस्तु या क्रिया जोड़ना
  rationale: प्राप्त स्रोत इसी अधूरे वाक्यांश पर समाप्त होता है। धर्मवैचारिक या कथात्मक अनुमान से रिक्ति भरने के बजाय अपूर्णता स्पष्ट रूप से बनाए रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘मुँह में डालना’, ‘नाम रखना’, ‘जुड़े रहना’ और ‘मेज़ तुम्हारी हो’ जैसे बिंब स्रोत के निकट रखे गए हैं। अंतिम खंड की अपूर्णता को दीर्घविराम और पादटिप्पणी से दिखाया गया है; कोई अनुमानित पूर्ति नहीं की गई।
