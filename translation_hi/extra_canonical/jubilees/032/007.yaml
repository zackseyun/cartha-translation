  yaml_path: translation/extra_canonical/jubilees/032/007.yaml
  text: 'Therefore thus it is ordained in Israel concerning the defilement of an Israelite virgin: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman'
translation:
  language: hi
  text: 'इसलिए इस्राएल में इस्राएली कुँवारी के अपवित्र किए जाने के विषय में[a] यह ठहराया गया है: यदि इस्राएल में कोई पुरुष अपनी बेटी, या अपनी बहन तक को, जातियों के वंश में से किसी पुरुष को देना चाहे, तो वह निश्चय ही मार डाला जाए; लोग उसे पत्थरों से मार डालें, क्योंकि उसने इस्राएल में लज्जा का काम किया है; और वह स्त्री भी—[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपवित्र की गई इस्राएली कुँवारी के विषय में।”
    reason: गीज़ पदबंध को ‘अपवित्र किए जाने’ की संज्ञात्मक अभिव्यक्ति या ‘अपवित्र की गई’ विशेषणात्मक अभिव्यक्ति—दोनों प्रकार से समझा जा सकता है।
  - marker: b
    text: उपलब्ध स्रोत-पाठ में वाक्य यहाँ अधूरा रह जाता है।
    reason: पद का अंतिम पदबंध केवल ‘और वह स्त्री भी’ कहता है; अनुवाद में अनुमान से वाक्य पूरा नहीं किया गया।
lexical_decisions:
- source_word: በአርኵሰ፡ ድንግል፡ እስራኤላዊት
  choice: इस्राएली कुँवारी के अपवित्र किए जाने के विषय में
  rationale: यह पदबंध ‘अपवित्रता/अपवित्र किए जाने’, ‘कुँवारी’ और ‘इस्राएली’—तीनों तत्वों को स्पष्ट रखता है तथा हिंदी में स्वाभाविक रूप देता है।
- source_word: እምዘርአ፡ አሕዛብ
  choice: जातियों के वंश के
  rationale: ‘जातियों के वंश से’ के स्रोत-सापेक्ष रूप को बनाए रखा गया है; इसे अधिक व्याख्यात्मक ‘गैर-इस्राएली’ बनाकर अर्थ को सीमित नहीं किया गया।
- source_word: ሞተ፡ ለይሙት
  choice: निश्चय मार डाला जाए
  rationale: मृत्यु की निश्चितता व्यक्त करने वाली स्रोत-भाषा की पुनरुक्तिपूर्ण शक्ति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ወበእብን፡ ይውግሮዎ
  choice: लोग उसे पत्थरों से मार डालें
  rationale: पत्थर मारकर मृत्युदण्ड देने का आशय स्पष्ट और सामान्य आधुनिक हिंदी में प्रस्तुत किया गया है।
- source_word: ኀፍረተ
  choice: लज्जा का काम
  rationale: शर्म, अपमान और सामाजिक कलंक के अर्थक्षेत्र को बनाए रखता है, बिना किसी अतिरिक्त कानूनी या धार्मिक व्याख्या के।
theological_decisions:
- issue: ‘जातियों के वंश’ की पहचान
  choice: जातियों के वंश के किसी पुरुष
  alternative: किसी गैर-इस्राएली पुरुष
  rationale: स्रोत का वंश/जातियों वाला रूप व्यापक और कुछ हद तक खुला है; अधिक व्याख्यात्मक विकल्प को मुख्य पाठ में नहीं अपनाया गया।
- issue: खंड के अंत में अधूरा वाक्य
  choice: ‘और वह स्त्री भी—’ के रूप में अपूर्णता बनाए रखी
  alternative: अगले पद से दण्ड की बात जोड़कर वाक्य पूरा करना
  rationale: दिए गए स्रोत-पाठ का अंत ወለብእሲትሂ (‘और स्त्री भी’) पर होता है। अनुदित पद में ऐसा कथन नहीं जोड़ा गया जो इस अंश में उपस्थित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिंदी अपनाई गई है। कानूनी गंभीरता को बनाए रखते हुए अत्यधिक पुरातन शब्दावली से बचा गया है। ‘कुँवारी’, ‘अपवित्र’, ‘निश्चय मार डाला जाए’ और ‘पत्थरों से मार डालें’ स्रोत के अर्थ तथा बल को संतुलित रूप से व्यक्त करते हैं।
