  text: in joy. And Jacob arranged his two sons[23], one on his right hand and one on his left, and it was counted to him as righteousness. And Jacob told everything to his father in the night, how the LORD had dealt with him in great mercy and how he had prospered all his way and protected him from all evil. And Isaac blessed the God of his father Abraham, who had not withheld mercy and righteousness from the son of his servant Isaac. And in the morning Jacob told his father Isaac the prayer that he had prayed to the LORD, and the vision that he had seen, and how he had built an altar, and all that was prepared for sacrifice to offer before the LORD according to how he had prayed, and how he had come to carry him on a donkey. And Isaac said to Jacob, "My son, I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred and sixty-five years old today. I am no longer able to travel; set your mother on a beast and let her go with
    you. And I know, my son, that you came on my account, and this day is blessed, on which you have seen me alive and I also have seen you, my son. Prosper and perform the prayer that you have prayed, and do not delay your prayer, for it is sought out, and now quickly do it, and may he who has done everything grant success to the prayer for which you have prayed." And he said to Rebekah, "Go with Jacob your son." And Rebekah went with Jacob her son, and Deborah was with her, and they came to Bethel. And Jacob remembered the prayer with which his father had blessed him, and his two sons, Levi and Judah, and he rejoiced and blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be raised for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them." And he stayed that night in Bethel, and Levi dreamed
    that they had appointed and ordained him priest of the Most High God, him and his sons forever. And he awoke from his sleep and blessed the LORD. And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth from everything that had come with him, from people to cattle, from gold to all possessions, and he took and tithed from everything. And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons, and Levi came up in the LORD’s portion, and his father clothed him with priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar as sacrifices from the cattle fourteen oxen and eighteen rams and forty-nine sheep and seven lambs and twenty-one kids.
translation:
  language: hi
  text: 'आनन्द में। याकूब ने अपने दोनों पुत्रों[a] को इस प्रकार खड़ा किया—एक को अपने दाहिने और दूसरे को अपने बाएँ—और यह उसके लिए धार्मिकता गिना गया। रात में याकूब ने अपने पिता को सब कुछ बताया: यहोवा ने उस पर कितनी बड़ी दया की थी, कैसे उसने उसके सारे मार्ग को सफल बनाया था और उसे हर बुराई से बचाया था। तब इसहाक ने अपने पिता अब्राहम के परमेश्वर को धन्य कहा, जिसने अपने सेवक इसहाक के पुत्र से दया और धार्मिकता नहीं रोकी थी।


    सुबह याकूब ने अपने पिता इसहाक को उस प्रार्थना के विषय में बताया जो उसने यहोवा से की थी, उस दर्शन के विषय में जो उसने देखा था, और यह भी कि उसने कैसे एक वेदी बनाई थी और अपनी प्रार्थना के अनुसार यहोवा के सामने बलि चढ़ाने के लिए सब कुछ तैयार किया था। उसने यह भी बताया कि वह इसहाक को गधे पर बैठाकर ले जाने के लिए कैसे आया था। इसहाक ने याकूब से कहा, “मेरे पुत्र, मैं तुम्हारे साथ नहीं आ सकता, क्योंकि मैं बूढ़ा हो गया हूँ और यात्रा सह नहीं सकता। मेरे पुत्र, शान्ति से जाओ। आज मैं एक सौ पैंसठ वर्ष का हूँ। अब मैं यात्रा नहीं कर सकता। अपनी माता को किसी पशु पर बैठा देना और उसे अपने साथ ले जाना।


    “मेरे पुत्र, मैं जानता हूँ कि तुम मेरे कारण आए हो। यह दिन धन्य है, क्योंकि इस दिन तुमने मुझे जीवित देखा और मैंने भी तुम्हें देखा, मेरे पुत्र। फलो-फूलो, और जो प्रार्थना तुमने की है उसे पूरा करो। उसे पूरा करने में देर मत करो, क्योंकि उस प्रार्थना की खोज-खबर ली जाती है। अब उसे शीघ्र पूरा करो। जिसने सब कुछ किया है, वह तुम्हारी प्रार्थना सफल करे।”


    फिर इसहाक ने रिबका से कहा, “अपने पुत्र याकूब के साथ जाओ।” तब रिबका अपने पुत्र याकूब के साथ गई और दबोरा भी उसके साथ थी। वे बेतेल पहुँचे। याकूब ने उस प्रार्थना को स्मरण किया जिसके द्वारा उसके पिता ने उसे और उसके दोनों पुत्रों, लेवी और यहूदा को आशीष दी थी। वह आनन्दित हुआ और उसने अपने पूर्वजों अब्राहम और इसहाक के परमेश्वर को धन्य कहा। उसने कहा, “अब मैं जान गया हूँ कि मेरे लिए और मेरी सन्तान के लिए भी सबके परमेश्वर के सामने अनन्त आशा है। इन दोनों के विषय में ऐसा ही ठहराया गया है, और जिस प्रकार इसहाक ने उन्हें आशीष दी, उसी के अनुसार स्वर्गीय पट्टिकाओं पर उनके लिए एक अनन्त साक्षी अंकित किया जाएगा।”


    उस रात वह बेतेल में ठहरा। लेवी ने स्वप्न में देखा कि उसे और उसके पुत्रों को सदा के लिए परमप्रधान परमेश्वर का याजक नियुक्त किया गया है। वह नींद से जागा और उसने यहोवा को धन्य कहा।


    इस महीने के चौदहवें दिन याकूब भोर को उठा। जो कुछ उसके साथ आया था—मनुष्यों से लेकर पशुओं तक, सोने से लेकर सारी सम्पत्ति तक—उसने उसमें से दसवाँ भाग अलग किया; उसने हर वस्तु का दशमांश दिया। उन्हीं दिनों राहेल बिन्यामीन से गर्भवती हुई। याकूब ने अपने पुत्रों की गिनती की, और लेवी यहोवा के भाग में आया। उसके पिता ने उसे याजकीय वस्त्र पहनाए और उसके हाथ भर दिए।[b]


    इस महीने के पन्द्रहवें दिन उसने वेदी पर बलि के रूप में पशुओं में से चौदह बैल, अठारह मेढ़े, उनचास भेड़ें, सात मेम्ने और इक्कीस बकरी के बच्चे चढ़ाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त स्रोत-पंक्ति यहाँ अध्याय के आरम्भ की सामग्री को दोहराती है और आगे राहेल के प्रसव-वृत्तान्त की ओर बढ़ती है। अनुवाद इस दोहराए गए अंश को संप्रेषित पाठ का भाग मानता है।
    reason: segmentation_note
  - marker: b
    text: “हाथ भरना” किसी व्यक्ति को याजकीय सेवा में प्रतिष्ठित करने का प्राचीन मुहावरा है।
    reason: cultural_idiom
