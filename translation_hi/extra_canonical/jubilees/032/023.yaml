- from: 'आनन्द में। याकूब ने अपने दोनों पुत्रों[a] को इस प्रकार खड़ा किया—एक को अपने दाहिने और दूसरे को अपने बाएँ—और यह उसके लिए धार्मिकता गिना गया। रात में याकूब ने अपने पिता को सब कुछ बताया: यहोवा ने उस पर कितनी बड़ी दया की थी, कैसे उसने उसके सारे मार्ग को सफल बनाया था और उसे हर बुराई से बचाया था। तब इसहाक ने अपने पिता अब्राहम के परमेश्वर को धन्य कहा, जिसने अपने सेवक इसहाक के पुत्र से दया और धार्मिकता नहीं रोकी थी।


    सुबह याकूब ने अपने पिता इसहाक को उस प्रार्थना के विषय में बताया जो उसने यहोवा से की थी, उस दर्शन के विषय में जो उसने देखा था, और यह भी कि उसने कैसे एक वेदी बनाई थी और अपनी प्रार्थना के अनुसार यहोवा के सामने बलि चढ़ाने के लिए सब कुछ तैयार किया था। उसने यह भी बताया कि वह इसहाक को गधे पर बैठाकर ले जाने के लिए कैसे आया था। इसहाक ने याकूब से कहा, “मेरे पुत्र, मैं तुम्हारे साथ नहीं आ सकता, क्योंकि मैं बूढ़ा हो गया हूँ और यात्रा सह नहीं सकता। मेरे पुत्र, शान्ति से जाओ। आज मैं एक सौ पैंसठ वर्ष का हूँ। अब मैं यात्रा नहीं कर सकता। अपनी माता को किसी पशु पर बैठा देना और उसे अपने साथ ले जाना।


    “मेरे पुत्र, मैं जानता हूँ कि तुम मेरे कारण आए हो। यह दिन धन्य है, क्योंकि इस दिन तुमने मुझे जीवित देखा और मैंने भी तुम्हें देखा, मेरे पुत्र। फलो-फूलो और जिस प्रार्थना को तुमने किया है, उसके अनुसार कार्य करो। उसे पूरा करने में देर मत करो, क्योंकि उस प्रार्थना की खोज-खबर ली जाती है। अब उसे शीघ्र पूरा करो। जिसने सब कुछ किया है, वह तुम्हारी प्रार्थना की हर बात को सफल करे।”


    फिर इसहाक ने रिबका से कहा, “अपने पुत्र याकूब के साथ जाओ।” तब रिबका अपने पुत्र याकूब के साथ गई और दबोरा भी उसके साथ थी। वे बेतेल पहुँचे। याकूब ने उस आशीषमय प्रार्थना को स्मरण किया जिसके द्वारा उसके पिता ने उसे और उसके दोनों पुत्रों, लेवी और यहूदा को आशीष दी थी। वह आनन्दित हुआ और उसने अपने पूर्वजों अब्राहम और इसहाक के परमेश्वर को धन्य कहा। उसने कहा, “अब मैं जान गया हूँ कि मेरे लिए और मेरी सन्तान के लिए भी सबके परमेश्वर के सामने अनन्त आशा है। इन दोनों के विषय में ऐसा ही ठहराया गया है, और जिस प्रकार इसहाक ने उन्हें आशीष दी, उसी के अनुसार स्वर्गीय पट्टिकाओं पर उनके लिए यह बात अनन्त साक्षी के रूप में दर्ज की जाएगी।”


    उस रात वह बेतेल में ठहरा। लेवी ने स्वप्न में देखा कि उसे और उसके पुत्रों को सदा के लिए परमप्रधान परमेश्वर का याजक नियुक्त और अभिषिक्त किया गया है। वह नींद से जागा और उसने यहोवा को धन्य कहा।


    इस महीने के चौदहवें दिन याकूब भोर को उठा। जो कुछ उसके साथ आया था—मनुष्यों से लेकर पशुओं तक, सोने से लेकर सारी सम्पत्ति तक—उसने उसमें से दसवाँ भाग अलग किया; उसने हर वस्तु का दशमांश दिया। उन्हीं दिनों राहेल के गर्भ में बिन्यामीन आया। याकूब ने अपने पुत्रों की गिनती की, और लेवी यहोवा के भाग में आया। उसके पिता ने उसे याजकीय वस्त्र पहनाए और उसके हाथ भर दिए।[b]


    इस महीने के पन्द्रहवें दिन उसने वेदी पर बलि के रूप में पशुओं में से चौदह बैल, अठारह मेढ़े, उनचास भेड़ें, सात मेम्ने और इक्कीस बकरी के बच्चे चढ़ाए।'
