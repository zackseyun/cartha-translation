base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/015.yaml
  text: the daughters of the nations. And if there is any from his daughters whom he gives to a man from any of the nations, for it is plague upon plague, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.
translation:
  language: hi
  text: जातियों की बेटियाँ। और यदि वह अपनी बेटियों में से किसी को किसी भी जाति के पुरुष को दे, तो यह विपत्ति पर विपत्ति और शाप पर शाप है। यदि वह ऐसा करे और उन लोगों से अपनी आँखें मूँद ले जो अशुद्ध काम करते हैं, जो प्रभु के पवित्रस्थान को अशुद्ध करते हैं, और जो उसके पवित्र नाम को अपवित्र करते हैं, तो यह सारी विपत्ति और शाप आ पड़ेगा; और सारी अशुद्धता और अपवित्रीकरण के कारण पूरी प्रजा का एक साथ न्याय किया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋልደ፡ አሕዛብ
  choice: जातियों की बेटियाँ
  rationale: स्रोत में बिना किसी अतिरिक्त पूर्वसर्ग के शाब्दिक रूप से ‘जातियों की बेटियाँ’ है; आरंभिक वाक्यांश की खंडात्मकता भी सुरक्षित रखी गई है।
- source_word: እምአዋልዲሁ
  choice: अपनी बेटियों में से
  rationale: प्रत्यय तृतीय पुरुष पुल्लिंग एकवचन है—‘उसकी बेटियों में से’; हिन्दी में समान कर्ता के साथ ‘अपनी’ अधिक स्वाभाविक और ठीक है।
- source_word: መቅሠፍት
  choice: विपत्ति
  rationale: यह शब्द महामारी, प्रहार या दैवी दंडसूचक विपत्ति का अर्थ दे सकता है; संदर्भ में व्यापक ‘विपत्ति’ स्वाभाविक है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ተዐወረ፡ አዕይንቲሁ
  choice: अपनी आँखें मूँद ले
  rationale: स्रोत का भाव अपनी आँखों को अंधा कर लेने, अर्थात जानबूझकर अनदेखा करने का है; हिन्दी मुहावरा उसी नैतिक आशय को स्पष्ट रखता है।
- source_word: መቅደሶ፡ ለእግዚአብሔር
  choice: प्रभु के पवित्रस्थान
  rationale: ‘पवित्रस्थान’ उपासना-स्थल की पवित्रता को दर्शाता है और እግዚአብሔር को यहाँ परंपरागत रूप से ‘प्रभु’ प्रस्तुत किया गया है।
- source_word: ይትኬነን
  choice: न्याय किया जाएगा
  rationale: क्रिया न्यायिक दोषनिर्णय या दंडादेश का संकेत देती है; ‘न्याय किया जाएगा’ उस दायरे को बनाए रखता है।
- source_word: ርኵስ፡ ወግማኔዝ
  choice: अशुद्धता और अपवित्रीकरण
  rationale: पहला शब्द नैतिक/अनुष्ठानिक अशुद्धता और दूसरा पवित्र वस्तु या नाम के अपमान को व्यक्त करता है।
theological_decisions:
- issue: सामूहिक न्याय का कथन
  choice: पूरी प्रजा का एक साथ न्याय किया जाएगा
  alternative: हर व्यक्ति का न्याय किया जाएगा
  rationale: स्रोत में ‘सारी प्रजा’ और ‘एक साथ’ दोनों का स्पष्ट सामूहिक बल है; इसे व्यक्तिगत न्याय में बदलना मूल के तनाव को मिटा देता।
- issue: विपत्ति और शाप का कर्ता/लक्ष्य
  choice: यह सारी विपत्ति और शाप आ पड़ेगा
  alternative: विपत्ति पर विपत्ति उस पर पड़ेगी
  rationale: स्रोत पहले ‘यह विपत्ति पर विपत्ति है’ कहता है और बाद में उसके आने की बात करता है; ‘उस पर’ जोड़ना स्रोत से अधिक निश्चितता लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। समानांतर पदबंध—‘विपत्ति पर विपत्ति’, ‘शाप पर शाप’—स्रोत की चेतावनीपूर्ण लय बनाए रखते हैं। आरंभ का ‘जातियों की बेटियाँ’ पूर्ववर्ती प्रसंग से जुड़ा खंड है, इसलिए उसे स्वतंत्र पूर्ण वाक्य बनाकर अर्थ नहीं जोड़ा गया।
