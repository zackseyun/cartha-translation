  yaml_path: translation/extra_canonical/jubilees/032/001.yaml
  text: And Judah saw and rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."
translation:
  language: hi
  text: यहूदा ने देखा और आनन्दित हुआ[a]। उसने अपने पूर्वजों अब्राहम और इसहाक के परमेश्वर को धन्य कहा। उसने कहा, “अब मैं जान गया हूँ कि सबके परमेश्वर की उपस्थिति में मेरे लिए और मेरी सन्तानों के लिए भी अनन्त आशा है। उन दोनों के विषय में ऐसा ही ठहराया गया है, और इसहाक ने जिस प्रकार उन्हें आशीष दी थी, उसी के अनुसार उनके लिए स्वर्गीय पट्टिकाओं पर अनन्तकाल की गवाही अंकित की जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यहूदा आनन्दित हुआ।”
    reason: दिए गए गीइज़ पाठ में इस स्थान पर सम्भावित लिप्यन्तरण/OCR-दोष है; संशोधित पाठ-परम्परा ‘यहूदा ने देखा और आनन्दित हुआ’ का समर्थन करती है, जबकि पूर्व पाठ में ‘देखा’ नहीं था।
lexical_decisions:
- source_word: ተስፋ፡ ዘለዓለም
  choice: अनन्त आशा
  rationale: यह मूल के ‘आशा’ और ‘अनन्त’ दोनों तत्वों को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: አምላከ፡ ኵሉ
  choice: सबके परमेश्वर
  rationale: मूल अभिव्यक्ति ‘God of all’ की व्यापकता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ስምዕ፡ ዘለዓለም
  choice: अनन्तकाल की गवाही
  rationale: ‘गवाही/साक्ष्य’ के अर्थ को बनाए रखते हुए स्थायी अवधि को स्पष्ट करता है।
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाएँ
  rationale: यूबिलीज़ की विशिष्ट लिखित स्वर्गीय अभिलेख-कल्पना को ठोस बहुवचन संज्ञा के रूप में सुरक्षित रखता है।
- source_word: ብየ፡ ... ወለውሉድየሂ
  choice: मेरे लिए और मेरी सन्तानों के लिए भी
  rationale: वक्ता और उसकी भावी सन्तान—दोनों से आशा का सम्बन्ध स्पष्ट रखते हुए ‘भी’ की समावेशी शक्ति व्यक्त करता है।
theological_decisions:
- issue: ‘अनन्त आशा’ का स्वरूप
  choice: अनन्त आशा
  alternative: अनन्त उद्धार की आशा
  rationale: मूल केवल ‘आशा’ कहता है; ‘उद्धार’ जोड़ना पाठ की धार्मिक अर्थ-सीमा को अनावश्यक रूप से संकीर्ण करता।
- issue: स्वर्गीय पट्टिकाओं पर अभिलेखन
  choice: यह ... अंकित किया जाएगा
  alternative: वे ... ऊपर उठाए जाएँगे
  rationale: अंग्रेज़ी परामर्श-पाठ और पद के प्रसंग के अनुसार इसे स्थायी गवाही के अभिलेखन के रूप में रखा गया है; सर्वनाम का सन्दर्भ ‘ऐसा ठहराया जाना’ है, व्यक्तियों का आरोहण नहीं।
- issue: ‘उन दोनों’ की पहचान
  choice: उन दोनों
  alternative: दोनों पुत्रों
  rationale: मूल स्पष्ट नाम नहीं देता; इसलिए वास्तविक संदर्भगत अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘धन्य कहा’, ‘ठहराया गया’, और ‘अंकित किया जाएगा’ जैसे पद बाइबलीय भाव बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ भाषा से बचते हैं।
