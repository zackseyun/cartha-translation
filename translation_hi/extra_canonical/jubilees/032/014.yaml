base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
translation:
  language: hi
  text: और तेरी सन्तान भी सभी युगों तक ऐसी ही बनी रहे। प्रभु तुझे और तेरे वंश को अपनी महिमा के लिए हृदय की महानता दे; और वह समस्त प्राणियों में से तुझे और तेरे वंश को अपने निकट लाए, ताकि वे[a] उसके पवित्रस्थान में उसके सम्मुख रहने वाले स्वर्गदूतों और पवित्र जनों के समान सेवा करें। तेरी सन्तान की सन्तति भी उन्हीं के समान महिमा और महानता वाली हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ताकि तू सेवा करे’।
    reason: अंग्रेज़ी audit trail में दर्ज वैकल्पिक rendering को दर्शाता है; मुख्य पाठ गीइज़ तृतीय-पुरुष बहुवचन क्रिया के अनुसार ‘वे’ रखता है।
lexical_decisions:
- source_word: ውሉደከ
  choice: तेरी सन्तान
  rationale: शब्द का अर्थ ‘तेरे बच्चे/तेरी सन्तान’ है; हिन्दी में सामूहिक और स्वाभाविक रूप चुना गया है।
- source_word: በኵሉ፡ ዓለማት
  choice: पीढ़ी-दर-पीढ़ी
  rationale: शाब्दिक अर्थ ‘सभी युगों में’ है; प्रसंग में वंश की निरन्तरता व्यक्त करने के लिए यह सहज हिन्दी है।
- source_word: ዐበየ፡ ልበየ
  choice: विशाल हृदय
  rationale: ‘हृदय की महानता’ के मूल बिंब को रखते हुए अधिक स्वाभाविक हिन्दी अभिव्यक्ति चुनी गई है; इसे केवल साहस या बुद्धि तक सीमित नहीं किया गया।
- source_word: እምኵሉ፡ ዘሥጋ
  choice: समस्त मानवजाति में से
  rationale: शाब्दिक ‘समस्त देहधारियों में से’ यहाँ मनुष्यों के समुदाय का संकेत देता है।
- source_word: መላእክተ፡ ገጽ
  choice: मुख-सन्निधि के स्वर्गदूत
  rationale: ‘मुख/उपस्थिति के दूत’ पदवी के स्रोत-बिंब को बनाए रखते हुए ‘सन्निधि’ से उसका आशय स्पष्ट किया गया है।
- source_word: ይትአዘዙ
  choice: सेवा करें
  rationale: तीसरे पुरुष बहुवचन क्रिया को बनाए रखा गया है; पवित्रस्थान के प्रसंग में इसका आशय नियुक्त/आज्ञापालक धार्मिक सेवा करना है।
- source_word: ዘርኦሙ፡ ለውሉደከ
  choice: तेरी सन्तान का वंश
  rationale: वाक्यांश को स्वाभाविक हिन्दी में संबंधवाची अर्थ के साथ प्रस्तुत किया गया है, अंग्रेज़ी परामर्श-पाठ के अनुरूप परन्तु गीइज़ रूपों को ध्यान में रखते हुए।
theological_decisions:
- issue: पवित्रस्थान में सेवा करने वाली क्रिया का कर्ता
  choice: ‘वे ... सेवा करें’—अर्थात् निकट लाई गई सन्तान/वंश
  alternative: ‘तू ... सेवा करे’
  rationale: गीइज़ ይትአዘዙ तीसरे पुरुष बहुवचन है; इसलिए कर्ता को दूसरे पुरुष एकवचन बनाना व्याकरणिक भेद को मिटा देता।
- issue: ‘angels of the presence’ की पदवी
  choice: मुख-सन्निधि के स्वर्गदूत
  alternative: उपस्थिति के स्वर्गदूत
  rationale: ‘मुख’ का मूल रूपक और दिव्य सन्निधि का धार्मिक आशय दोनों सुरक्षित रखे गए हैं, बिना किसी विशिष्ट सम्प्रदायगत देवदूत-विज्ञान को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, प्रार्थनात्मक शैली रखी गई है। ‘तेरी/तुझे’ का प्रयोग निकटवर्ती एकवचन संबोधन और प्राचीन आशीर्वचन की ध्वनि को बनाए रखता है। मूल की तीसरे पुरुष बहुवचन क्रिया स्पष्ट रूप से ‘वे’ के साथ अनूदित है।
