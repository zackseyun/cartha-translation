base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/013.yaml
  text: Let us not give our daughter to a man who has a foreskin, for that is a reproach to us. And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.
translation:
  language: hi
  text: हम अपनी बेटी ऐसे पुरुष को न दें जिसका खतना न हुआ हो,[a] क्योंकि यह हमारे लिए कलंक है। और यह इस्राएल के लिए भी कलंक है—उन लोगों के लिए जो अपनी बेटियाँ देते हैं और उनके लिए जो अन्यजातियों की बेटियों को विवाह में लेते हैं—क्योंकि यह अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जिसकी अग्रत्वचा हो।”'
    reason: स्रोत की ठोस शारीरिक अभिव्यक्ति को बताने और मुख्य पाठ में सहज आधुनिक हिन्दी बनाए रखने के लिए।
lexical_decisions:
- source_word: ዘቦ፡ ቍልፈተ፡
  choice: जिसका खतना न हुआ हो
  rationale: मूल अभिव्यक्ति का शाब्दिक अर्थ ‘जिसकी अग्रत्वचा है’ है; आधुनिक हिन्दी में इसका स्वाभाविक और स्पष्ट समतुल्य ‘जिसका खतना न हुआ हो’ है।
- source_word: ጽእለት፡
  choice: अपमान की बात
  rationale: यह शब्द सामाजिक निंदा, लज्जा या कलंक का भाव रखता है; ‘अपमान की बात’ प्रसंग में सहज है और भाव को अनावश्यक रूप से तीव्र नहीं करता।
- source_word: እምአዋልደ፡ አሕዛብ፡
  choice: अन्यजातियों की बेटियों में से
  rationale: यह ‘राष्ट्रों/जातियों की बेटियों में से’ का धार्मिक-सामुदायिक अर्थ सुरक्षित रखता है और केवल आधुनिक राष्ट्रीयता का भाव नहीं देता।
- source_word: ርኩስ፡
  choice: अशुद्ध
  rationale: यह स्रोत के धार्मिक तथा नैतिक अशुद्धता-संबंधी अर्थ को खुला रखता है; ‘अपवित्र’ की तुलना में ‘अशुद्ध’ मूल के अधिक निकट है।
theological_decisions:
- issue: ‘लेने’ का वैवाहिक अर्थ
  choice: विवाह करते हैं
  alternative: लेते हैं
  rationale: बेटियों को ‘लेना’ इस प्रसंग में विवाह-संबंध बनाना है। हिन्दी में केवल ‘लेते हैं’ अस्पष्ट और अस्वाभाविक होता, इसलिए आशय स्पष्ट किया गया है।
- issue: अंतिम ‘यह अशुद्ध है’ का संदर्भ
  choice: सर्वनाम ‘यह’ को बनाए रखा गया
  alternative: ऐसा विवाह अशुद्ध है
  rationale: मूल पाठ स्पष्ट रूप से यह निर्धारित नहीं करता कि अशुद्धता केवल विवाह पर, अन्यजातियों की बेटियों पर, या पूरे व्यवहार पर लागू है; ‘यह’ उस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। समानांतर वाक्य-विन्यास और स्रोत की अंतिम अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
