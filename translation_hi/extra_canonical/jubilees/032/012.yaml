  text: यह निर्धारित किया गया है[a], और इस वर्ष से आनेवाले वर्ष तक इसका कुछ भी बचाकर नहीं रखा जाता। क्योंकि उसी वर्ष बीज खाया जाता है—उस वर्ष के बीज को इकट्ठा करने के दिनों तक—और दाखरस उस समय तक जब…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने पाठानुवाद में यह वाक्य इस प्रकार दिया गया था: “यह घट गया था, और इस सत्ताईसवें वर्ष से आनेवाले वर्ष तक उसके लिए केवल छब्बीस वर्ष ही शेष रहे। क्योंकि उसी वर्ष बीज खाया जाता है—अट्ठाईसवें वर्ष की कटनी के दिनों तक—और दाखमधु उस वर्ष तक जब…” किंतु 26, 27 और 28 इथियोपियाई अंक चार्ल्स के मुद्रित संस्करण की पादटिप्पणी-सूचक संख्याएँ हैं, मूल पाठ का भाग नहीं।'
    reason: previous_rendering
lexical_decisions:
- source_word: ተኀርየ
  choice: यह ठहराया गया है
  rationale: क्रिया का अर्थ ‘चुना/निर्धारित/ठहराया गया’ है; यहाँ प्रसंगानुकूल निष्क्रिय भाव रखा गया है।
- source_word: ወአልቦ፡ ለአትርፎ፡ እምኔሁ
  choice: और इसे … के लिए बचाकर नहीं रखा जा सकता
  rationale: वाक्यांश किसी वस्तु को अगले वर्ष तक शेष या संचित रखने के निषेध/असंभवता को व्यक्त करता है।
- source_word: ዘርእ
  choice: बीज
  rationale: मूल शब्द का सीधा अर्थ ‘बीज’ है; कृषि-उपज का आशय होते हुए भी मूल की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: መዋዕለ፡ ሐፊረ፡ ዘርእ
  choice: बीज को इकट्ठा करने के दिन
  rationale: ‘दिनों’ और ‘एकत्र करने’ के मूल बिंब को बनाए रखा गया है; इसे व्याख्यात्मक रूप से केवल ‘कटनी’ नहीं बनाया गया।
- source_word: ወወይን
  choice: और दाखमधु
  rationale: यहाँ ወይን का आशय अंगूर से बनी मदिरा है; आधुनिक, गरिमापूर्ण और स्पष्ट हिन्दी के लिए ‘दाखमधु’ चुना गया।
- source_word: አመ
  choice: उस समय तक जब
  rationale: अंश के अंत में पद समयसूचक अधूरे उपवाक्य का आरंभ करता है; स्रोत की अपूर्णता को यथावत रखा गया है।
