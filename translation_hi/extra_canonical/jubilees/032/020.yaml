base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/020.yaml
  text: And through you the salvation of Israel will be found. And on the day you sit on the throne of the glory of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you, and also those who curse you, shall be destroyed and cut off.
translation:
  language: hi
  text: और तेरे द्वारा इस्राएल का उद्धार पाया जाएगा। और जिस दिन तू अपनी धार्मिकता की महिमा के सिंहासन पर बैठेगा,[a] उस दिन प्रिय के पुत्रों की सारी सन्तान के लिए बड़ी शांति होगी।[b] जो कोई तुझे आशीष देगा, वह आशीष पाएगा; और वे सभी जो तुझसे घृणा करते और तुझे सताते हैं, और वे भी जो तुझे शाप देते हैं, नष्ट किए जाएँगे और काट डाले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उस दिन तू अपनी धार्मिकता की महिमा के सिंहासन पर विराजमान रहेगा। बड़ी शांति होगी।”
    reason: मूल कालवाचक रचना को निवास/विराजमान रहने और स्वतंत्र वाक्य-विभाजन के रूप में भी समझा जा सकता है।
  - marker: b
    text: 'शाब्दिक रूप के अधिक निकट: “प्रिय के पुत्रों के सारे वंश के लिए।” कुछ पाठक इसे “उसके प्रिय पुत्रों के सारे वंश के लिए” भी समझ सकते हैं।'
    reason: गीज़ की प्रत्याशित सर्वनामयुक्त रचना और ‘प्रिय’ के संज्ञात्मक अथवा विशेषणात्मक अर्थ की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: इस्राएल का उद्धार
  rationale: ‘መድኃኒት’ को उसके व्यापक उद्धार/मुक्ति-संबंधी अर्थ में रखा गया है; प्रसंग से परे किसी विशेष धार्मिक अर्थ को नहीं जोड़ा गया।
- source_word: ትትረከብ
  choice: पाया जाएगा
  rationale: स्रोत के निष्क्रिय भाव को बनाए रखता है और उद्धार के कर्ता को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: መንበረ፡ ክብር፡ ጽድቅከ
  choice: अपनी धार्मिकता की महिमा का सिंहासन
  rationale: ‘सिंहासन—महिमा—तेरी धार्मिकता’ की संज्ञा-शृंखला को निकटता से सुरक्षित रखा गया है, यद्यपि संबंध की व्याख्या में कुछ अस्पष्टता बनी रहती है।
- source_word: ዐቢየ፡ ሰላም
  choice: बड़ी शान्ति
  rationale: विशेषण और संज्ञा का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: प्रिय जन के पुत्रों का सारा वंश
  rationale: गीज़ की प्रत्याशित सर्वनामयुक्त रचना को ‘प्रिय जन के पुत्र’ के रूप में समझा गया है, न कि ‘उसके प्रिय पुत्र’; ‘प्रिय जन’ को संज्ञात्मक पद के रूप में सुरक्षित रखा गया है।
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: नष्ट कर दिए जाएँगे और मिट जाएँगे
  rationale: दोनों समानान्तर विनाशकारी क्रियाओं का भेद बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: ‘प्रिय’ का व्याकरणिक और उपाधिपरक अर्थ
  choice: प्रिय जन के पुत्र
  alternative: उसके प्रिय पुत्र
  rationale: स्रोत की रचना ‘उसके-पुत्र, प्रिय के’ में ‘प्रिय’ का संज्ञात्मक उपयोग अधिक सम्भावित है; इसलिए संभावित उपाधि को विशेषण में बदलकर अर्थ तय नहीं किया गया।
- issue: सिंहासन पर बैठने और शान्ति के बीच कालगत संबंध
  choice: एक ही कालवाचक वाक्य में कारण/परिणाम जैसा निकट संबंध बनाए रखा
  alternative: 'दो स्वतंत्र वाक्य: ‘उस दिन तू... रहेगा। बड़ी शान्ति होगी।’'
  rationale: ‘जिस दिन... उस दिन...’ स्रोत की कालवाचक संरचना को स्पष्ट करता है और दोनों कथनों को अलग नहीं करता।
- issue: उद्धार का कर्ता
  choice: निष्क्रिय वाक्य ‘पाया जाएगा’
  alternative: तू इस्राएल का उद्धार लाएगा
  rationale: स्रोत में उद्धार के पाए जाने की निष्क्रिय अभिव्यक्ति है; सक्रिय रूप किसी कर्तृत्व-संबंधी निष्कर्ष को अनावश्यक रूप से जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठकों के लिए सुबोध। एकवचन निकट संबोधन के लिए ‘तू/तेरे/तुझे’ रखा गया है, क्योंकि वचन आशीर्वादात्मक प्रत्यक्ष संबोधन है। ‘धार्मिकता’, ‘महिमा’, ‘सिंहासन’ और ‘आशीष’ जैसे परिचित बाइबिलीय पद गरिमा तथा स्रोत-समीपता बनाए रखते हैं।
