base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/025.yaml
  text: And Rachel died there and was buried in the land of Ephrath, that is, Bethlehem. And Jacob built a pillar over Rachel’s grave on the road, above her tomb.
translation:
  language: hi
  text: और वहीं राहेल की मृत्यु हो गई, और उसे एप्राता की भूमि में, अर्थात् बैतलहम में, दफ़नाया गया। और याकूब ने राहेल की कब्र के ऊपर, मार्ग पर, उसकी कब्र के ऊपर एक स्मारक-स्तंभ खड़ा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ ፡ ኤፍራታ
  choice: एप्राता देश
  rationale: गीज़ पदबंध का स्वाभाविक और निकट अर्थ; स्थान-नाम को लिप्यंतरित रखा गया है।
- source_word: ቤተ ፡ ልሔም
  choice: बैतलहम
  rationale: परंपरागत और आधुनिक हिन्दी में पहचाना जाने वाला बाइबलीय स्थान-नाम।
- source_word: ሐውልተ
  choice: स्मारक-स्तंभ
  rationale: शब्द कब्र के ऊपर खड़े किए गए स्मृति-चिह्न या स्तंभ को सूचित करता है; केवल ‘पत्थर’ से अधिक सटीक।
- source_word: ፍኖት
  choice: मार्ग
  rationale: स्रोत के ‘रास्ता/मार्ग’ अर्थ को गरिमापूर्ण, सहज हिन्दी में रखा गया है।
- source_word: መቃብር / መቃብሪሃ
  choice: कब्र / समाधि
  rationale: स्रोत की पुनरुक्ति को हिन्दी में अर्थपूर्ण रखते हुए दोनों निकटार्थी शब्दों से व्यक्त किया गया है।
