translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। नामकरण में माता और पिता के अलग-अलग नामों को बिना किसी व्याख्यात्मक सामंजस्य के यथावत रखा गया है। तिथि-वाक्य को हिन्दी में स्वाभाविक क्रम दिया गया है, जबकि जुबली-सप्ताह-वर्ष की मूल कालगणना सुरक्षित है।
