base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/024.yaml
  text: And he came to the land of Ephrath, and he stayed there. And Rachel gave birth in the night to a son, and she called his name Son of My Sorrow, because she suffered while giving birth; but his father called his name Benjamin, on the eleventh of the eighth month, in the first year of the sixth week of this jubilee.
translation:
  language: hi
  text: और वह एप्रात की भूमि में आया और वहीं ठहरा। रात में राहेल ने एक पुत्र को जन्म दिया। उसने उसका नाम “मेरे दुःख का पुत्र” रखा, क्योंकि प्रसव के समय उसे पीड़ा हुई थी; पर उसके पिता ने उसका नाम बिन्यामीन रखा। यह इस जुबली के छठे सप्ताह के पहले वर्ष के आठवें महीने की ग्यारहवीं तारीख को हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ ፡ ከብራታን
  choice: एप्रात की भूमि
  rationale: स्थाननाम को परामर्श-पाठ और जुबली की पुस्तक की कथात्मक परंपरा के अनुरूप देवनागरी में लिप्यंतरित किया गया है; ‘भूमि’ मूल के ምድረ को व्यक्त करता है।
- source_word: ወልደ ፡ ሕማምየ
  choice: मेरे दुःख का पुत्र
  rationale: नाम का अर्थसूचक रूप मूल के ‘मेरी पीड़ा/दुःख का पुत्र’ को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ዐጸበታ ፡ ሶበ ፡ ትወልድ
  choice: प्रसव के समय उसे बहुत पीड़ा हुई थी
  rationale: मूल में प्रसव के दौरान उस पर आए कष्ट को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ብንያም
  choice: बिन्यामीन
  rationale: परंपरागत और व्यापक रूप से पहचाना जाने वाला हिन्दी बाइबलीय लिप्यंतरण चुना गया है।
- source_word: አመ ፡ ዐሡሩ ፡ ወአሚሩ ፡ ለወርኀ ፡ ሳምን
  choice: आठवें महीने की ग्यारहवीं तारीख को
  rationale: गीज़ की क्रमसूचक तिथि ‘दस और एक’ को आधुनिक हिन्दी की स्वाभाविक तिथि-अभिव्यक्ति में प्रस्तुत किया गया है।
