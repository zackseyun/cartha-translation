base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/009.yaml
  text: This is a testimony of joy like this joy. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits.
translation:
  language: hi
  text: यह आनन्द की ऐसी साक्षी है, जो इस आनन्द के समान है।[a] पहले लोग गिलाद देश को रफाईम का देश कहा करते थे, क्योंकि वह रफाईम का देश है। वहाँ रफाईम पैदा हुए थे—महाकाय लोग, जिनकी ऊँचाई दस हाथ, नौ हाथ, आठ हाथ, और सात हाथ तक थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “यह इस आनन्द के समान आनन्द की साक्षी है।”'
    reason: गीज़ पदबंध संक्षिप्त और व्याकरणतः कठिन है; दोनों बार आए शब्द ‘आनन्द’ और बीच का ‘साक्षी’ सुरक्षित रखते हुए संबंध के इस वैकल्पिक विन्यास की संभावना बनी रहती है।
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዕ፡ ከመዝ፡ ፍሥሐተ
  choice: यह आनन्द की साक्षी है—ऐसे ही आनन्द की
  rationale: दो बार आए ፍሥሐተ को ‘आनन्द’ और ስምዕ को ‘साक्षी’ के रूप में रखा गया है। वाक्य-विन्यास की कठिनता और पुनरुक्ति को मिटाने के बजाय स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: ምድረ፡ ገለአድ
  choice: गिलाद देश
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: ረፋኤም / ራፋኤም
  choice: रफाईम
  rationale: इस प्राचीन जाति-नाम को सामान्य संज्ञा बनाकर अनुवाद करने के बजाय लिप्यंतरित किया गया है।
- source_word: ረዐይት
  choice: दैत्य
  rationale: संदर्भ में यह असाधारण रूप से विशालकाय प्राणियों/मनुष्यों को सूचित करता है; आधुनिक पाठक के लिए ‘दैत्य’ संक्षिप्त और स्पष्ट है।
- source_word: በአመት
  choice: हाथ
  rationale: यहाँ माप की प्राचीन इकाई cubit अभिप्रेत है; हिन्दी बाइबल-परंपरा का सुबोध रूप ‘हाथ’ रखा गया है।
- source_word: ዐሥር ... ትስዕ ... ስምን ... ስብዕ
  choice: दस ... नौ ... आठ ... सात
  rationale: स्रोत की संख्या-श्रृंखला को पूर्ण रखा गया है; उपलब्ध प्रतिलिपि में पहली संख्या OCR से विकृत है, पर पांडुलिपि-पाठ और क्रम ‘दस’ का समर्थन करते हैं।
theological_decisions:
- issue: रफाईम की पहचान
  choice: जाति-नाम ‘रफाईम’ तथा वर्णन ‘दैत्य’ दोनों बनाए रखे गए
  alternative: रफाईम को सीधे ‘दैत्य’ या ‘महाकाय लोग’ कहना
  rationale: पाठ पहले विशिष्ट जाति-नाम देता है और फिर उसके सदस्यों का वर्णन करता है; दोनों को मिलाने से ऐतिहासिक और साहित्यिक भेद मिट जाता।
- issue: आरंभिक कथन का संबंध
  choice: ‘आनन्द की साक्षी’ और ‘ऐसे ही आनन्द’ की पुनरुक्ति रखी गई
  alternative: ‘यह विधान सदा के लिए साक्षी है’
  rationale: वैकल्पिक रूप स्रोत में उपस्थित आनन्द-संबंधी शब्दों को हटा देता और ‘विधान’ तथा ‘सदा’ जैसी असमर्थित धारणाएँ जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कहा करते थे’, ‘पैदा हुए थे’ और ‘सात हाथ तक’ सहज हिन्दी हैं, जबकि प्राचीन नाम और माप पाठ के ऐतिहासिक स्वर को बनाए रखते हैं।
