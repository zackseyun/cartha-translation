base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/017.yaml
  text: 'every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were given into the hand of the two sons of Jacob, and they killed them in agony, and it was reckoned to them as righteousness, and it was written down for them as righteousness."'
translation:
  language: hi
  text: 'इस्राएल में हर पुरुष और स्त्री, जो उसके पवित्रस्थान को अशुद्ध करता है। इसी कारण मैंने तुम्हें आज्ञा दी है: “यह गवाही इस्राएल को सुनाओ[a]—देखो, शकेम और उसके पुत्रों के साथ क्या हुआ; कैसे वे याकूब के दोनों पुत्रों के हाथ में दे दिए गए, और उन्होंने उन्हें पीड़ा में मार डाला। यह उनके लिए धार्मिकता गिनी गई और उनके लिए धार्मिकता के रूप में लिखी गई।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इस गवाही को इस्राएल के ऊपर सुनवाओ।”'
    reason: मूल में ‘सुनना’ की कारक क्रिया और ‘गवाही’ संज्ञा का संयोजन है; मुख्य पाठ स्वाभाविक हिंदी देता है और टिप्पणी मूल संरचना दिखाती है।
lexical_decisions:
- source_word: ዘያረኵስ፡ መቅደሶ
  choice: जो उसके पवित्रस्थान को अशुद्ध करता है
  rationale: क्रिया ያረኵስ का अर्थ अशुद्ध/अपवित्र करना है; प्रत्यययुक्त መቅደሶ को जानबूझकर ‘उसके पवित्रस्थान’ रखा गया है ताकि संदर्भगत सर्वनाम को अनावश्यक रूप से स्पष्ट न किया जाए।
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  choice: यह गवाही … सुनाओ
  rationale: कारक क्रिया ‘सुनवाना/सुनाना’ और संज्ञा ‘गवाही’ दोनों का बल बचता है; ‘रिपोर्ट’ कानूनी-वाचाई अर्थभार को कम कर देती।
- source_word: ውስተ፡ እዴ፡ ክልኤሆሙ፡ ደቂቀ፡ ያዕቆብ
  choice: याकूब के दोनों पुत्रों के हाथ में
  rationale: मूल के एकवचन ‘हाथ’ वाले सामी मुहावरे और ‘दोनों पुत्रों’ को निकटता से सुरक्षित रखा गया है।
- source_word: በፃዕር
  choice: पीड़ा में
  rationale: ፃዕር का अर्थ पीड़ा, कष्ट या यातना है; इसे ‘तलवार से’ करना मूल शब्द के अर्थ के विपरीत होगा।
- source_word: ወኮነቶሙ፡ ጽድቀ፡ ወተጽሕፎሙ፡ ለጽድቅ
  choice: यह उनके लिए धार्मिकता गिनी गई और उनके लिए धार्मिकता के रूप में लिखी गई
  rationale: धार्मिकता के दोहरे कथन को बनाए रखते हुए हिंदी में लेखांकन-सदृश भाव स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: शकेमियों की हत्या का धार्मिकता के रूप में मूल्यांकन
  choice: मूल का सकारात्मक मूल्यांकन बिना नरमी या व्याख्यात्मक बचाव के रखा गया
  alternative: इसे केवल पात्रों की मान्यता बताना या नैतिक टिप्पणी जोड़ना
  rationale: पाठ स्वयं कहता है कि यह उनके लिए धार्मिकता हुई और लिखी गई; अनुवाद को इस कठिन धार्मिक तनाव को न मिटाना चाहिए, न उससे आगे बढ़कर सिद्धांत बनाना चाहिए।
- issue: ‘उसके पवित्रस्थान’ में सर्वनाम का संदर्भ
  choice: सर्वनाम की अस्पष्टता सुरक्षित रखी गई
  alternative: ‘परमेश्वर के पवित्रस्थान’ या ‘अपने पवित्रस्थान’
  rationale: मूल प्रत्यय सर्वनाम देता है, पर इस पदांश में उसका संदर्भ स्पष्ट नाम से नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली अपनाई गई है। ‘पवित्रस्थान’, ‘गवाही’ और ‘धार्मिकता’ जैसे शब्द मूल के धार्मिक और न्यायिक स्वर को बनाए रखते हैं; कठिन नैतिक कथन को व्याख्यात्मक रूप से हल्का नहीं किया गया।
