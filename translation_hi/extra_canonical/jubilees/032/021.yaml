  text: And he went up into heaven[21]. And he saw in a vision of the night, and behold, an angel was descending from heaven, and in his hands were tablets, and he gave them to Jacob, and he read them and learned everything written in them that would happen to him and to his children through all the ages. And he showed him everything written on the tablets and said to him, "Do not build this place, and do not make it an eternal sanctuary, and do not dwell here, for this is not the place. Go to the house of Abraham your father, and dwell with Isaac your father until the day of your father's death. For in Egypt you will die in peace, and in this land you will be buried in honor in the tomb of your fathers, with Abraham and Isaac. Do not fear, for as you have seen and read, so shall everything be. And you also, write down everything as you have seen and read." And Jacob said, "Lord, how shall I remember everything that I have read and seen?" And he said to him, "I will make you remember everything."
    And he went up from him, and he awoke from his sleep and remembered everything that he had read and seen, and he wrote down all the matters that he had read and seen[21]. And there he celebrated one additional day, and he observed it according to all that they sacrifice in former days, and he called its name Addition, because that day had been added, and they had formerly called them a feast. And thus he showed that it should be so, and it is written on the heavenly tablets concerning this, that it was revealed to him that he should observe it and add it to the seven days of the feast. And its name was called Addition, because it is added to the feast days according to the number of the days of the year. And on the night of the thirteenth of this month Deborah, Rebekah's nurse, died, and they buried her below the city, under the oak by the river, and they called the name of that place Deborah's River, and the oak, the Oak of the Mourning of Deborah. And Rebekah went and entered her house
    to Isaac her father, and Jacob sent by her hand rams and sheep, that she might bring them to his father's house. And he said to her, "Let us go to every place, and do not travel with you." And Jacob blessed the God of Isaac his father and the God of Abraham, the father of his father, and he arose and loaded his wives and his children and took all his possessions and crossed the river and arrived.
translation:
  language: hi
  text: 'और वह स्वर्ग को चढ़ गया। तब याकूब ने रात के दर्शन में देखा कि एक स्वर्गदूत स्वर्ग से उतर रहा है और उसके हाथों में पट्टिकाएँ हैं। उसने वे पट्टिकाएँ याकूब को दीं। याकूब ने उन्हें पढ़ा और उनमें लिखी हर बात जान ली—वह सब जो युग-युग में उसके और उसके वंशजों के साथ होनेवाला था। स्वर्गदूत ने उसे पट्टिकाओं पर लिखी हर बात दिखाई और उससे कहा, “इस स्थान पर निर्माण मत करना, इसे सदा का पवित्रस्थान मत बनाना, और यहाँ निवास मत करना, क्योंकि यह वह स्थान नहीं है। अपने पिता अब्राहम के घर जा और अपने पिता इसहाक के साथ उस दिन तक रह, जिस दिन तेरे पिता की मृत्यु होगी। क्योंकि तू मिस्र में शांति से मरेगा, और इस देश में आदर के साथ अपने पुरखों की कब्र में, अब्राहम और इसहाक के साथ, दफनाया जाएगा। मत डर; क्योंकि जैसा तूने देखा और पढ़ा है, वैसा ही सब होगा। और तू भी वह सब लिख ले जो तूने देखा और पढ़ा है।”


    याकूब ने कहा, “प्रभु, जो कुछ मैंने पढ़ा और देखा है, वह सब मैं कैसे स्मरण रखूँगा?” उसने उससे कहा, “मैं तुझे सब कुछ स्मरण करा दूँगा।” फिर वह उसके पास से स्वर्ग को चढ़ गया। याकूब नींद से जागा और उसने जो कुछ पढ़ा और देखा था, वह सब उसे स्मरण रहा। उसने वे सारी बातें लिख लीं जो उसने पढ़ी और देखी थीं।


    वहाँ उसने एक अतिरिक्त दिन मनाया और उसमें वैसे ही बलि चढ़ाई जैसे पहले के दिनों में चढ़ाई जाती थी। उसने उसका नाम “वृद्धि” रखा, क्योंकि वह दिन जोड़ दिया गया था; और पहले वे उन्हें पर्व कहते थे।[a] इस प्रकार उसने दिखाया कि ऐसा ही होना चाहिए। इस विषय में स्वर्गीय पट्टिकाओं पर लिखा है कि उस पर यह प्रकट किया गया था कि वह इसे माने और उसे पर्व के सात दिनों में जोड़ दे। उसका नाम “वृद्धि” रखा गया, क्योंकि वर्ष के दिनों की गिनती के अनुसार वह पर्व के दिनों में जोड़ा जाता है।


    इसी महीने की तेरहवीं रात को रिबका की धाय दबोरा मर गई। उन्होंने उसे नगर के नीचे, नदी के किनारे बलूत के वृक्ष के नीचे दफनाया। उन्होंने उस स्थान का नाम “दबोरा की नदी” और उस बलूत के वृक्ष का नाम “दबोरा के शोक का बलूत” रखा।[b]


    रिबका लौटकर इसहाक, उसके पिता, के पास अपने घर में गई। याकूब ने उसके हाथ मेढ़े और भेड़ें भेजीं, कि वह अपने पिता के घर जाए।[c] और उसने उससे कहा, “हम हर स्थान को चलें, और तू मेरे साथ न चल।”[c] तब याकूब ने अपने पिता इसहाक के परमेश्वर और अपने पिता के पिता अब्राहम के परमेश्वर की स्तुति की। फिर वह उठा, अपनी पत्नियों और बच्चों को सवारी पर बिठाया, अपनी सारी संपत्ति ली, नदी पार की और पहुँच गया।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वृद्धि” उस नाम का अर्थानुवाद है जिसका आशय किसी जोड़ी गई वस्तु या परिशिष्ट से है। यहाँ यह पर्व के सात दिनों में जोड़े गए एक अतिरिक्त दिन को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: स्थान और वृक्ष के नामों का पाठ कठिन है। “दबोरा के शोक का बलूत” उस पांडुलिपीय रूप को दर्शाता है जिसमें “शोक” का शब्द संभवतः भ्रष्ट रूप में सुरक्षित है।
    reason: textual_variant
  - marker: c
    text: रिबका की गतिविधियों, ‘अपने पिता के घर’ के संदर्भ, और याकूब के कथन से जुड़े ये उपवाक्य मूल में वाक्य-विन्यास की दृष्टि से कठिन हैं। अनुवाद कर्ता और संबंधों को निश्चित करने के बजाय पाठ के व्यापक क्रम को बनाए रखता है।
    reason: textual_difficulty
  - marker: d
    text: उपलब्ध अंश यहाँ केवल “और पहुँच गया” कहकर समाप्त होता है; गंतव्य इस उद्धृत पाठ में नहीं दिया गया।
    reason: incomplete_clause
lexical_decisions:
- source_word: ተውሳክ
  choice: वृद्धि
  rationale: यह शब्द किसी जोड़ी गई या बढ़ाई गई वस्तु को सूचित करता है; प्रसंग में सात दिनों में जोड़े गए अतिरिक्त पर्व-दिन का नाम है।
- source_word: ይሠውዑ
  choice: बलि चढ़ाई जाती थीं
  rationale: मूल क्रिया विशेष रूप से बलिदान चढ़ाने को व्यक्त करती है, केवल सामान्य रीति या कार्य करने को नहीं।
- source_word: ነፃኒታ
  choice: स्वतंत्र की गई दासी
  rationale: गीज़ शब्द का सामान्य अर्थ ‘मुक्त/स्वतंत्र स्त्री’ है; इसे परंपरागत ‘धाय’ से बदलना स्रोत के स्पष्ट शब्द को दबा देता।
- source_word: ኀሐ (cf. ኀዘነ)
  choice: शोक
  rationale: पांडुलिपीय रूप संभवतः ‘शोक’ के लिए भ्रष्ट पाठ है और स्थलनाम की व्याख्या में यही अर्थ उपयुक्त है।
- source_word: አብርሃም፡ አቡከ
  choice: अपने पिता अब्राहम
  rationale: मूल पाठ सीधे ‘अब्राहम, तेरा पिता’ कहता है; ‘तेरे पिता का पिता’ जोड़ना यहाँ उचित नहीं।
theological_decisions:
- issue: अब्राहम को याकूब का ‘पिता’ कहना
  choice: अपने पिता अब्राहम
  alternative: अपने पितामह अब्राहम
