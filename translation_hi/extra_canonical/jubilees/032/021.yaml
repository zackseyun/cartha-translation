- from: 'और वह स्वर्ग पर चढ़ गया। तब याकूब ने रात के दर्शन में देखा कि एक स्वर्गदूत स्वर्ग से उतर रहा है। उसके हाथों में पट्टिकाएँ थीं। उसने वे याकूब को दीं, और याकूब ने उन्हें पढ़कर वह सब जान लिया जो उन पर लिखा था—वह सब जो युग-युग में उसके और उसकी संतान के साथ होनेवाला था। स्वर्गदूत ने उसे पट्टिकाओं पर लिखी हर बात दिखाई और उससे कहा, “इस स्थान को मत बनाना, इसे सदा का पवित्रस्थान मत बनाना और यहाँ निवास मत करना, क्योंकि यह वह स्थान नहीं है। अपने पिता अब्राहम के घर जा और अपने पिता इसहाक के साथ उस दिन तक रह, जिस दिन तेरे पिता की मृत्यु होगी। तू मिस्र में शांति से मरेगा, और इस देश में आदर के साथ अपने पुरखों की कब्र में अब्राहम और इसहाक के साथ दफनाया जाएगा। मत डर; क्योंकि जैसा तूने देखा और पढ़ा है, वैसा ही सब होगा। तू भी वह सब लिख ले जो तूने देखा और पढ़ा है।”


    याकूब ने कहा, “प्रभु, जो कुछ मैंने पढ़ा और देखा है, वह सब मैं कैसे स्मरण रखूँगा?” उसने उससे कहा, “मैं तुझे सब कुछ स्मरण करा दूँगा।” फिर वह उसके पास से ऊपर चला गया। याकूब नींद से जागा और उसने जो कुछ पढ़ा और देखा था, वह सब उसे स्मरण रहा। उसने वे सारी बातें लिख लीं जो उसने पढ़ी और देखी थीं।


    वहाँ उसने एक और दिन भी मनाया। उस दिन उसने उन सभी बलियों के अनुसार बलि चढ़ाई जो पहले दिनों में चढ़ाई जाती थीं। उसने उस दिन का नाम “वृद्धि” रखा, क्योंकि वह दिन जोड़ दिया गया था; और पहले दिनों को उसने “पर्व” कहा था।[a] इस प्रकार उसे दिखाया गया कि ऐसा ही होना चाहिए। इस विषय में स्वर्गीय पट्टिकाओं पर लिखा है कि उस पर यह प्रकट किया गया था कि वह उस दिन को माने और उसे पर्व के सात दिनों में जोड़ दे। उसका नाम “वृद्धि” रखा गया, क्योंकि वर्ष के दिनों की गिनती के अनुसार वह पर्व के दिनों में जोड़ा जाता है।


    इसी महीने की तेरहवीं रात को रिबका की स्वतंत्र की गई दासी दबोरा मर गई।[b] उन्होंने उसे नगर के नीचे, नदी के पास बांज वृक्ष के तले दफनाया। उन्होंने उस स्थान का नाम “दबोरा की नदी” और उस बांज वृक्ष का नाम “दबोरा के शोक का बांज” रखा।[c]


    रिबका लौटकर अपने घर, याकूब के पिता इसहाक के पास चली गई। याकूब ने उसके हाथ मेढ़े और भेड़ें भेजीं और उससे कहा कि वह उसके पिता के घर लौटे। उसने उससे कहा, “मैं हर स्थान पर जाऊँगी; जहाँ कहीं तू जाएगा, मैं तेरे साथ जाऊँगी।”[d] तब याकूब ने अपने पिता इसहाक के परमेश्वर और अपने पिता के पिता अब्राहम के परमेश्वर को धन्य कहा। फिर वह उठा, उसने अपनी पत्नियों और बच्चों को सवार कराया, अपनी सारी संपत्ति ली, नदी पार की और पहुँच गया।[e]'
