  text: from the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not allow him to harm Jacob, for he appeared to him in a dream at night and Laban told Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain,
translation:
  language: hi
  text: गिलाद देश से। याकूब ने अपने मन की बात[a] लाबान से छिपाई और उसे कुछ नहीं बताया। चौथे सप्ताह के सातवें वर्ष में, पहले महीने के इक्कीसवें दिन, याकूब गिलाद की ओर मुड़ा। लाबान ने उसका पीछा किया और तीसरे महीने के तेरहवें दिन गिलाद पर्वत पर याकूब को जा पकड़ा। परन्तु प्रभु ने उसे याकूब को हानि पहुँचाने नहीं दिया, क्योंकि प्रभु ने रात को स्वप्न में उसे दर्शन दिया; और लाबान ने यह बात याकूब को बताई। उन्हीं दिनों के पंद्रहवें दिन याकूब ने लाबान और उसके साथ आए सभी लोगों के लिए भोज दिया। उस दिन याकूब ने लाबान को शपथ दी और लाबान ने भी याकूब को शपथ दी कि दोनों में से कोई भी बुरे इरादे से पर्वत पर दूसरे की ओर पार न जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपना हृदय।”
    reason: मूल रूपक को दर्ज रखते हुए मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी दी गई है।
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ
  choice: याकूब ने अपने मन की बात ... छिपाए रखी
  rationale: शाब्दिक अर्थ ‘याकूब ने अपना हृदय छिपाया’ है। आधुनिक हिन्दी में ‘मन की बात छिपाना’ मूल रूपक और आशय दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: याकूब गिलाद की ओर मुड़ा
  rationale: दिशासूचक रूप गिलाद की ओर गति बताता है; ‘गिलाद से चला गया’ स्रोत के विपरीत होगा।
- source_word: በቅዳሜ፡ ወርኅ፡ አመ፡ ዐሥራሁ፡ ወአሚሩ
  choice: पहले महीने के इक्कीसवें दिन
  rationale: पदबंध महीने और दिनांक को सूचित करता है; इसे ‘महीने के पहले दिन, दसवें वर्ष में’ समझना व्याकरणतः अनुचित है।
- source_word: ወነገሮ፡ ላባ፡ ለያዕቆብ
  choice: लाबान ने यह बात याकूब को बताई
  rationale: क्रिया का कर्ता लाबान और अप्रत्यक्ष कर्म याकूब है। ‘यह बात’ हिन्दी में पूर्ववर्ती स्वप्न-दर्शन से स्वाभाविक संबंध बनाता है।
- source_word: በእኩይ
  choice: हानि पहुँचाने के इरादे से
  rationale: मूल का अर्थ ‘बुराई के साथ/बुरे उद्देश्य से’ है; हिन्दी में यह प्रसंगानुकूल और स्पष्ट रूप है।
theological_decisions:
- issue: स्वप्न में दर्शन देने वाले की पहचान
  choice: प्रभु ने ... उसे दर्शन दिया था
  alternative: वह उसे स्वप्न में दिखाई दिया था
  rationale: पूर्ववर्ती स्पष्ट कर्ता प्रभु है और सर्वनाम का संदर्भ लाबान है। नाम दोहराने से हिन्दी में संदर्भ स्पष्ट होता है, बिना कथन में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: लाबान द्वारा याकूब को बताई गई बात
  choice: लाबान ने यह बात याकूब को बताई
  alternative: प्रभु ने लाबान से याकूब के विषय में कहा
  rationale: गीज़ वाक्य में लाबान स्पष्ट कर्ता है। उत्पत्ति 31 के समानांतर वृत्तांत के आधार पर कर्ता बदलना स्रोत का सामंजस्यकारी पुनर्लेखन होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कालगणना को स्रोत के अनुसार ‘चौथे सप्ताह के सातवें वर्ष’, ‘पहले महीने के इक्कीसवें दिन’ और ‘तीसरे महीने के तेरहवें दिन’ कहा गया है। आरंभ और अंत स्रोत में बड़े वाक्य के खंड हैं; हिन्दी में आरंभिक खंड को यथावत रखा गया है, जबकि अंतिम निषेध-वाक्य को उपलब्ध पाठ की सीमा के भीतर पठनीय बनाया गया है।
