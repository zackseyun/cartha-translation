base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/010.yaml
  text: Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man be rooted out who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.
translation:
  language: hi
  text: जो कोई अपवित्र करे, वह निश्चय ही मार डाला जाए, और उसे पत्थरों से मार डाला जाए। इस व्यवस्था के लिए दिनों की कोई सीमा नहीं है; न क्षमा है, न किसी प्रकार का प्रायश्चित्त—सिवाय इसके कि वह मनुष्य जड़ से मिटा दिया जाए[a], जिसने समस्त इस्राएल के बीच अपनी बेटी को अपवित्र किया है। क्योंकि उसने अपने वंश में से किसी को मोलेक को दे दिया है और उसे अपवित्र करके दुष्टता की है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पुराने अनुवादों में: “वे उस मनुष्य को जड़ से मिटा दें”; गीज़ क्रिया का रूप कर्मवाच्य एकवचन समझा जा सकता है।'
    reason: पूर्व सक्रिय-बहुवचन पाठांतर को दर्ज करते हुए स्रोत-व्याकरण पर आधारित मुख्य पाठ को स्पष्ट करना।
  - marker: b
    text: “उसे” का संकेत स्पष्ट नहीं है। गीज़ में प्रत्यय पुल्लिंग एकवचन है, इसलिए यह व्याकरण की दृष्टि से “बेटी” की ओर सीधे संकेत नहीं करता; आशय उसके वंश या प्रसंग में निहित किसी अन्य वस्तु से भी हो सकता है।
    reason: अंतिम सर्वनाम की वास्तविक पाठगत और संदर्भगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: ዘያረኵስ
  choice: जो कोई अपवित्र करे
  rationale: क्रिया के सामान्य, अनिर्दिष्ट कर्ता को बनाए रखते हुए ‘अपवित्र करना’ धार्मिक और नैतिक दोनों अर्थों को खुला रखता है।
- source_word: ወበእብን፡ ይትወገር
  choice: पत्थरों से उसका पथराव किया जाए
  rationale: मूल के कर्मवाच्य और पत्थरों द्वारा दंड के स्पष्ट अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዐቅመ፡ መዋዕለ
  choice: दिनों की कोई सीमा
  rationale: मूल की समय-संबंधी अभिव्यक्ति को उसके कुछ असामान्यपन सहित सुरक्षित रखता है; इसे केवल ‘सदा’ कहकर व्याख्यात्मक रूप से समतल नहीं किया गया।
- source_word: ይሤረው
  choice: जड़ से मिटा दिया जाए
  rationale: तृतीय पुरुष एकवचन कर्मवाच्य रूप और पूर्ण निष्कासन के चित्रात्मक भाव को बनाए रखता है।
- source_word: ወለተ
  choice: अपनी बेटी
  rationale: प्रसंग और उपलब्ध पाठ-साक्ष्य के अनुसार पुत्री का उल्लेख है; हिन्दी में संबंध स्पष्ट करने के लिए ‘अपनी’ प्रयुक्त है।
- source_word: ሞሎክ
  choice: मोलेक
  rationale: व्यक्तिनाम/देवता के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: በአርኵሶ
  choice: उसे अपवित्र करके
  rationale: हिन्दी सर्वनाम मूल में आए पुल्लिंग एकवचन प्रत्यय की संदर्भगत अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
theological_decisions:
- issue: क्षमा और प्रायश्चित्त के निषेध तथा अपराधी के उन्मूलन का संबंध
  choice: ‘न क्षमा है, न किसी प्रकार का प्रायश्चित्त—सिवाय इसके कि वह मनुष्य जड़ से मिटा दिया जाए’
  alternative: ‘जब तक उस मनुष्य को जड़ से न मिटाया जाए, तब तक क्षमा या प्रायश्चित्त नहीं’
  rationale: मूल और परामर्श-पाठ की अपवादात्मक संरचना को बनाए रखा गया है; वैकल्पिक रूप उन्मूलन को प्रायश्चित्त की पूर्वशर्त बनाकर संबंध को अधिक निश्चित कर देता।
- issue: अंतिम सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उसे’ रखकर संदर्भ खुला रखा
  alternative: ‘अपनी बेटी को अपवित्र करके’ या ‘अपने वंश को अपवित्र करके’
  rationale: गीज़ रूप में पुल्लिंग एकवचन प्रत्यय है, जबकि निकटवर्ती ‘बेटी’ स्त्रीलिंग है; अतः किसी एक संदर्भ को निश्चित करना स्रोत की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर विधिक-धार्मिक शैली रखते हुए सामान्य पाठक के लिए सुबोध रखी गई है। ‘पथराव’, ‘व्यवस्था’, ‘प्रायश्चित्त’ और ‘जड़ से मिटा दिया जाए’ जैसे पद मूल की दंड-विधि और धार्मिक स्वर को सँभालते हैं।
