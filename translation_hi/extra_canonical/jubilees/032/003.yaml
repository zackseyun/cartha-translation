base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/003.yaml
  text: And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons starting from him, and Levi came up in the portion of the LORD, and his father clothed him.
translation:
  language: hi
  text: और उन दिनों राहेल बिन्यामीन को गर्भ में धारण करने लगी। तब याकूब ने उसी से आरम्भ करके अपने पुत्रों को गिना; और लेवी प्रभु के भाग में आया, और उसके पिता ने उसे वस्त्र पहनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፀንሰት፡ ይእቲ፡ ራሔል፡ ብንያምሃ
  choice: राहेल बिन्यामीन से गर्भवती हुई
  rationale: मूल गीइज़ की गर्भधारण-संबंधी अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में रखा गया है; ‘बिन्यामीन’ गर्भस्थ पुत्र को सूचित करता है।
- source_word: እምኔሁ
  choice: उसी से आरम्भ करके
  rationale: इस पद के गणना-क्रम में संकेत बिन्यामीन की ओर है; इस सूक्ष्म विवरण को हटाने के बजाय स्वाभाविक हिन्दी में स्पष्ट रखा गया है।
- source_word: በመክፈሊተ፡ እግዚአብሔር
  choice: यहोवा के भाग में
  rationale: ‘भाग/हिस्सा’ के अर्थ को औपचारिक और सहज हिन्दी में व्यक्त किया गया है तथा दिव्य नाम को ‘यहोवा’ से दर्शाया गया है।
- source_word: አልበሱ፡ አቡሁ
  choice: उसके पिता ने उसे वस्त्र पहनाए
  rationale: मूल क्रिया के ठोस अर्थ को बनाए रखा गया है; वस्त्र के प्रकार या धार्मिक अर्थ को पाठ से बाहर जाकर निर्दिष्ट नहीं किया गया।
theological_decisions:
- issue: लेवी का यहोवा के भाग में आना
  choice: शाब्दिक धर्मवैधानिक भाषा ‘यहोवा के भाग में आया’ बनाए रखी
  alternative: ‘यहोवा के लिए चुना गया’
  rationale: वैकल्पिक रूप अर्थ की व्याख्या कर देता और ‘भाग’ तथा गणना के बीच मूल पाठ के संबंध को कम कर देता।
- issue: गणना का आरम्भ-बिंदु
  choice: ‘उसी से आरम्भ करके’ द्वारा बिन्यामीन से गणना आरम्भ होना व्यक्त किया
  alternative: केवल ‘याकूब ने अपने पुत्रों को गिना’
  rationale: እምኔሁ को छोड़ने से कथानक की गणितीय और धार्मिक संगति—लेवी का भाग में आना—धुंधली हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल कथात्मक रूप अपनाया गया है। ‘उसी’ का निकटतम संदर्भ बिन्यामीन है। वाक्य को दो भागों में बाँटकर गणना और उसके परिणाम को स्पष्ट किया गया है, पर मूल की अर्थगत कड़ियाँ सुरक्षित हैं।
