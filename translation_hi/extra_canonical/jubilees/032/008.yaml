  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: hi
  text: वे उसे आग में जला दें, क्योंकि उसने अपने पिता के घराने के नाम को अपवित्र किया है; और वह इस्राएल में से जड़ से मिटा दी जाए। और पृथ्वी की पीढ़ियों के सारे दिनों तक इस्राएल के बीच कोई व्यभिचार या अशुद्धता न पाई जाए, क्योंकि इस्राएल यहोवा के लिए पवित्र है। और जो कोई उसे अशुद्ध करे, वह निश्चय ही मार डाला जाए; वे उसे पत्थरों से मार डालें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: वे उसे आग में जला दें
  rationale: क्रिया में स्त्रीलिंग कर्म स्पष्ट है; इसलिए ‘उसे’ रखा गया है। विधिक आदेश का भाव व्यक्त करने के लिए ‘जला दें’ स्वाभाविक है।
- source_word: አርኰሰት
  choice: अशुद्ध किया है
  rationale: मूल क्रिया अपवित्र या दूषित करने का भाव देती है; ‘नाम’ के साथ आधुनिक हिन्दी में ‘अशुद्ध किया’ औपचारिक अर्थ को सुरक्षित रखता है।
- source_word: ትሠረው፡ እምእስራኤል
  choice: इस्राएल में से जड़ से मिटा दी जाए
  rationale: मूल में उखाड़े या जड़ से निकाले जाने की प्रबल छवि है, जिसे केवल ‘निकाल दी जाए’ से कमजोर न करके सुरक्षित रखा गया है।
- source_word: ዘማ
  choice: व्यभिचार
  rationale: यह यौन अनैतिकता/अवैध यौन संबंध का अर्थ देता है; यहाँ विधिक और गंभीर प्रसंग में ‘व्यभिचार’ उपयुक्त है।
- source_word: ወርኵስ
  choice: या अशुद्धता
  rationale: समन्वयक को प्रसंगानुसार ‘या’ से व्यक्त किया गया है; संज्ञा धार्मिक-नैतिक अशुद्धता की व्यापकता बनाए रखती है।
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: इस्राएल यहोवा के लिए पवित्र है
  rationale: समर्पण/संबंध सूचक संरचना को ‘के लिए’ से व्यक्त किया गया है और दिव्य नाम को हिन्दी बाइबलीय प्रचलन के अनुसार ‘यहोवा’ रखा गया है।
- source_word: ሞተ፡ ለይሙት
  choice: निश्चय ही मार डाला जाए
  rationale: संजात क्रिया की जोरदार मृत्युदंड-सूचक अभिव्यक्ति को हिन्दी में ‘निश्चय ही’ के द्वारा सुरक्षित किया गया है।
- source_word: በእብን፡ ይውግርዎ
  choice: वे उसे पत्थरों से मारें
  rationale: मूल में पत्थर मारकर दंड देने का आदेश है; हिन्दी में बहुवचन ‘पत्थरों से’ स्रोत और पारंपरिक विधिक अभिव्यक्ति दोनों के निकट है।
theological_decisions:
- issue: ‘उसे अशुद्ध करे’ में सर्वनाम का संदर्भ
  choice: सर्वनाम ‘उसे’ को बनाए रखा गया
  alternative: ‘इस्राएल को अशुद्ध करे’ या ‘पवित्रता को भंग करे’
  rationale: मूल में पुल्लिंग कर्म-सर्वनाम है, जिसका संदर्भ निकटवर्ती ‘इस्राएल’ है। स्पष्ट संज्ञा जोड़ने से अर्थ खुलता, पर मूल की सर्वनामगत बनावट और हल्की संदर्भगत अस्पष्टता मिट जाती।
- issue: इस्राएल की पवित्रता का स्वरूप
  choice: ‘यहोवा के लिए पवित्र’
  alternative: ‘यहोवा का पवित्र जन’
  rationale: मूल सीधे इस्राएल को पवित्र बताता है और परमेश्वर से उसका संबंध व्यक्त करता है; ‘जन’ जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गंभीर और विधिक-बाइबलीय शैली में है। वाक्यरचना को पठनीय रखा गया है, पर दंड-विधान की कठोरता, ‘जड़ से मिटाने’ की छवि और ‘पृथ्वी की पीढ़ियों के सभी दिनों’ जैसी स्रोत-विशिष्ट अभिव्यक्ति को नरम या सामान्यीकृत नहीं किया गया।
