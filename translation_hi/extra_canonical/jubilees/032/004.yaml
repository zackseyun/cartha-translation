base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/004.yaml
  text: He put on priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids,
translation:
  language: hi
  text: उसने याजकीय वस्त्र पहने और अपने हाथ भर लिए।[a] इस महीने के पंद्रहवें दिन वह पशुधन में से चौदह बैल, अट्ठाईस मेढ़े, उनचास भेड़ें, सात मेमने और इक्कीस बकरी के बच्चे वेदी तक लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने हाथ भर लिए” याजकीय सेवा के लिए प्रतिष्ठित या अधिकृत करने का मुहावरा हो सकता है।
    reason: मूल के पारिभाषिक मुहावरे को सुरक्षित रखते हुए आधुनिक पाठक को उसका संभावित आशय बताना।
lexical_decisions:
- source_word: አልባሰ፡ ክህነት
  choice: उसे याजकीय वस्त्र पहनाए
  rationale: አልባሰ सकर्मक रूप है, जिसका अर्थ ‘उसने उसे पहनाया’ है; ክህነት यहाँ पुरोहिताई/याजकीय परिधान के संदर्भ में है। प्रसंगानुसार स्वाभाविक हिन्दी में ‘याजकीय वस्त्र’ रखा गया।
- source_word: ወመልአ፡ እደዊሁ
  choice: और उसके हाथ भर दिए
  rationale: मूल के ‘उसके हाथ भर दिए’ मुहावरे को बनाए रखा गया है, क्योंकि यह याजकीय प्रतिष्ठापन अथवा सेवा के लिए अधिकार प्रदान करने से जुड़ा पारिभाषिक वाक्यांश हो सकता है; मुख्य पाठ में इसका अर्थ संकीर्ण नहीं किया गया।
- source_word: አብአ፡ ውስተ፡ ምሥዋዕ
  choice: वेदी के पास लाया
  rationale: क्रिया ‘लाया’ और वेदी की दिशा/स्थान को सहज हिन्दी में व्यक्त करता है; ‘बलि के रूप में’ जैसे मूल में अनुपस्थित व्याख्यात्मक शब्द नहीं जोड़े गए।
- source_word: እምአልህምት
  choice: पशुधन में से
  rationale: यह पशुओं/मवेशियों के व्यापक वर्ग का संकेत करता है; आगे बैल, मेढ़े, भेड़ें, मेमने और बकरी के बच्चे सूचीबद्ध हैं।
- source_word: አስዋረ
  choice: बैल
  rationale: नर गोवंश के लिए सामान्य और स्पष्ट आधुनिक हिन्दी शब्द।
- source_word: አብሓኩ
  choice: मेढ़े
  rationale: वयस्क नर भेड़ों के लिए सटीक हिन्दी शब्द।
- source_word: መሓስዐ፡ ጠሊ
  choice: बकरी के बच्चे
  rationale: छोटे बकरों/बकरियों के लिए सामान्यतः समझ आने वाला पद; केवल ‘बच्चे’ कहने से पशु-जाति अस्पष्ट रहती।
theological_decisions:
- issue: ‘हाथ भरना’ मुहावरे का याजकीय अर्थ
  choice: मुख्य पाठ में शाब्दिक मुहावरा ‘उसके हाथ भर दिए’ बनाए रखा
  alternative: ‘उसे याजक के रूप में प्रतिष्ठित किया’ या ‘उसे याजकीय अधिकार दिया’
  rationale: मूल अभिव्यक्ति में विधिक/याजकीय संकेत है, पर किसी एक व्याख्या को स्पष्ट रूप से चुनना मूल की संभावित अर्थ-व्याप्ति को सीमित कर देता। इसलिए अर्थ-सूचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल के सकर्मक ‘पहनाया’ को अंग्रेज़ी परामर्श-पाठ के ‘उसने पहना’ पर प्राथमिकता दी गई है। पशुओं की सूची और संख्याएँ यथावत रखी गई हैं; मूल में न होने के कारण ‘बलि के रूप में’ नहीं जोड़ा गया।
