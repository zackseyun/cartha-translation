translation:
  language: hi
  text: उनके लिए यह ठहराया गया है[a] कि वे ऐसा करें और मित्रों के रूप में लिखे जाएँ। पर यदि वे उल्लंघन करें और उसके सभी मार्गों में अशुद्धता से चलें, तो वे स्वर्गीय पट्टिकाओं पर विरोधियों के रूप में लिखे जाएँगे; वे जीवन की पुस्तक से मिटा दिए जाएँगे और नाश होनेवालों की पुस्तक में, और उनके साथ जो…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उनके लिए यह ठहराया।”
    reason: आरंभिक क्रिया को निरपेक्ष कर्मवाच्य या निहित कर्ता वाले सक्रिय कथन के रूप में समझने की संभावना को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: አዕርክተ
  choice: मित्रों के रूप में
  rationale: यह ‘मित्र’ का बहुवचन रूप है और आगे आने वाले ‘विरोधियों’ के साथ जानबूझकर किया गया विरोध स्पष्ट रखता है।
- source_word: ጸላእተ
  choice: विरोधियों के रूप में
  rationale: यह ‘मित्रों’ के विपरीत शत्रुतापूर्ण स्थिति को व्यक्त करता है; ‘शत्रु’ भी संभव है, पर ‘विरोधी’ यहाँ अभिलेखीय न्याय-भाषा में स्वाभाविक है।
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं पर
  rationale: शाब्दिक चित्र और जुबिलीज़ की स्वर्गीय अभिलेख-परंपरा को सुरक्षित रखता है।
- source_word: መጽሐፈ፡ ሕይወት
  choice: जीवन की पुस्तक
  rationale: मूल रूपक का सीधा और प्रचलित हिन्दी रूप।
- source_word: እለ፡ ይትሐጐሉ
  choice: नाश होनेवालों
  rationale: भावी विनाश/लोप की ओर संकेत करने वाले रूप को बिना अतिरिक्त धर्मशास्त्रीय व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: मित्रों और विरोधियों के रूप में स्वर्गीय अभिलेख में लिखा जाना
  choice: दोनों पदों को समानांतर रूप में रखा गया है
  alternative: पहले पद को ‘विधान के रूप में दर्ज करें’ समझना
  rationale: गीज़ पाठ में አዕርክተ ‘मित्रों’ को सूचित करता है और अगले वाक्य के ጸላእተ ‘विरोधियों’ के साथ स्पष्ट वैचारिक विरोध बनाता है।
- issue: खंडित अंतिम वाक्यांश
  choice: ‘और उनके साथ जो…’ पर अपूर्णता बनाए रखी गई है
  alternative: अगले पद के आधार पर वाक्य पूरा करना
  rationale: दिया गया मूल-पाठ इसी बिंदु पर अधूरा समाप्त होता है; अनुमान से पूर्ति करना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-सापेक्ष शैली अपनाई गई है। ‘लिखे जाएँ’ को बार-बार रखकर मित्रों, विरोधियों और पुस्तकों में नाम दर्ज होने की मूल अभिलेखीय पुनरावृत्ति सुरक्षित रखी गई है। अंतिम दीर्घविराम स्रोत-अंश की अपूर्णता दर्शाता है।
