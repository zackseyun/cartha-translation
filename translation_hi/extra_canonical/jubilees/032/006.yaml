base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/006.yaml
  text: from the prayer that he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed it, he burned frankincense upon it in the fire, and for the sacrifice of deliverance he offered two oxen and four rams and four sheep and four he-goats and four yearling sheep.
translation:
  language: hi
  text: उस प्रार्थना से, जो उसने इस आशय से की थी कि वह उनके बलिदानों और उनकी पेय-भेंटों के साथ दशमांश दे। जब आग ने उसे भस्म कर दिया, तब उसने आग में उसके ऊपर लोबान जलाया; और उद्धार के बलिदान के लिए उसने दो बैल, चार मेढ़े, चार भेड़ें, चार बकरे और चार एक-वर्षीय भेड़ें चढ़ाईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የዐሥር
  choice: दशमांश चढ़ाए
  rationale: क्रिया का अर्थ दसवाँ भाग देना है; बलिदान-संदर्भ में ‘चढ़ाए’ स्वाभाविक है और धार्मिक क्रिया को स्पष्ट करता है।
- source_word: ጥዓሕቶሙ
  choice: उनके अर्घों
  rationale: बहुवचन स्वामित्व-प्रत्यय को बनाए रखते हुए पेय-भेंट के लिए आधुनिक, संक्षिप्त धार्मिक शब्द चुना गया है।
- source_word: የዐጥን፡ ስኂነ
  choice: लोबान जलाया
  rationale: यह धूप के रूप में लोबान जलाने की क्रिया बताता है; स्रोत में उपस्थित और पूर्व पाठ में छूटी हुई बात को स्पष्ट रूप से रखा गया है।
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: उद्धार का बलिदान
  rationale: መድኃኒት में बचाव, मुक्ति या उद्धार का भाव है; ‘उद्धार’ धार्मिक अर्थ और मूल की व्यापकता दोनों बनाए रखता है।
- source_word: አባግዐ፡ ዘዘ፡ ዓመት
  choice: एक-एक वर्ष की चार भेड़ें
  rationale: आयु-सूचक पद को स्पष्ट हिंदी में रखा गया है और संख्या ‘चार’ को स्रोत के अनुसार सुरक्षित रखा गया है।
theological_decisions:
- issue: መሥዋዕተ፡ መድኃኒት का बलिदानी नाम
  choice: उद्धार का बलिदान
  alternative: मुक्ति का बलिदान / कुशल-मंगल का बलिदान
  rationale: स्रोत का शब्द बचाव या उद्धार का अर्थ देता है। किसी विशिष्ट बाद की बलिदान-श्रेणी या संप्रदायगत व्याख्या को आरोपित किए बिना निकटतम सामान्य धार्मिक अभिव्यक्ति चुनी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, किंतु प्राचीन बलिदानी प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘उनके’ का बहुवचन स्रोत के प्रत्यय के अनुसार दोनों पदों में सुरक्षित है। स्रोत-पाठ में स्पष्ट चार बकरों को ही रखा गया है; संस्करण के पादटिप्पणी-सूचक अंक को पशुओं की संख्या नहीं माना गया। ‘उसे’ का अनिश्चित पूर्वसंदर्भ स्रोत की तरह अनिर्दिष्ट रहने दिया गया है।
