  yaml_path: translation/extra_canonical/jubilees/039/010.yaml
  text: And the Egyptian saw Joseph’s garment and the broken door-bar, and he heard the account of his wife, and he put Joseph into the prison-house, into the place where the king’s prisoners were confined. And he was there.
translation:
  language: hi
  text: और उस मिस्री ने यूसुफ का वस्त्र और दरवाज़े की टूटी हुई अर्गला देखी, और अपनी पत्नी की बात सुनी। तब उसने यूसुफ को बंदीगृह में, उस स्थान पर डाल दिया जहाँ राजा के बंदी रखे जाते थे। और वह वहीं रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጐብጻዊ
  choice: उस मिस्री
  rationale: स्रोत का निश्चित विशेषण/संज्ञा-रूप ‘the Egyptian’ है; प्रसंग के व्यक्ति को बिना नाम जोड़े इसी रूप में रखा गया।
- source_word: ልብሶ
  choice: वस्त्र
  rationale: ‘उसका/यूसुफ का वस्त्र’ के अर्थ में सामान्य और गरिमापूर्ण हिन्दी शब्द चुना गया; स्रोत में एकवचन है।
- source_word: ማዕጾ፡ ስቡረ
  choice: टूटी हुई द्वार की अर्गला
  rationale: पदबंध टूटे हुए door-bar/बन्द करने वाले अवरोध को सूचित करता है; ‘अर्गला’ द्वार की आड़ी रोक का सटीक हिन्दी शब्द है।
- source_word: ነገረ፡ ብእሲቱ
  choice: अपनी पत्नी की बात
  rationale: ‘उसकी पत्नी का कथन/वृत्तांत’ को स्वाभाविक हिन्दी में व्यक्त किया गया, बिना यह निर्धारित किए कि कथन सत्य था।
- source_word: ቤተ፡ ሞቅሕ
  choice: बंदीगृह
  rationale: शाब्दिक रूप से कैद/बंधन का घर; आधुनिक हिन्दी में ‘बंदीगृह’ स्पष्ट और गरिमापूर्ण है।
- source_word: ሙቁሓን፡ እለ፡ ሞቅሑ፡ ንጉሥ
  choice: राजा के बंदी रखे जाते थे
  rationale: स्रोत में राजा से संबद्ध बंदियों के निरुद्ध रहने का स्थान है; निष्क्रिय हिन्दी रचना अर्थ को सहज रूप से सुरक्षित रखती है।
- source_word: ወሀሎ
  choice: और वह वहीं रहा
  rationale: स्रोत केवल ‘और वह वहाँ था/रहा’ कहता है। ‘वहीं रहा’ हिन्दी में स्वाभाविक है और अंत में ‘बंदीगृह में’ जैसी अतिरिक्त सामग्री नहीं जोड़ता।
