translation:
  language: hi
  text: बंदीगृह में, रक्षकों के प्रधान के घर में, उसी बंदीगृह में जहाँ यूसुफ बंदी था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞቅሕ
  choice: बंदीगृह
  rationale: यहाँ यह शब्द कारावास के स्थान को सूचित करता है; स्रोत में इसकी पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: ሊቀ፡ ዐቀብተ
  choice: रक्षकों का प्रधान
  rationale: ሊቀ ‘प्रधान’ और ዐቀብተ ‘रक्षक/पहरेदार’ का सामान्य, पदनाम-सदृश अनुवाद है; किसी अधिक विशिष्ट पदवी को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: እኁዝ
  choice: बंदी था
  rationale: शाब्दिक अर्थ ‘पकड़ा हुआ/रखा हुआ’ है; बंदीगृह के प्रसंग में ‘बंदी था’ स्वाभाविक और अर्थनिष्ठ है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्रोत की ‘बंदीगृह’ वाली पुनरावृत्ति सुरक्षित रखी गई है, जबकि अंतिम स्थानवाचक ህየ को हिन्दी में अलग से ‘वहाँ’ कहकर दोहराना अस्वाभाविक होने के कारण ‘जहाँ’ की संरचना में समाहित किया गया है। आरम्भिक खंड स्रोत और परामर्श-पाठ की तरह वाक्यांशात्मक है; डैश उसके अगले स्पष्टीकरण को स्पष्ट करता है।
