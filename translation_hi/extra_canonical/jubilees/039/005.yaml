- source_word: አመጠወ፡ ነፍሶ
  choice: उसने अपने प्राण की रक्षा की
  rationale: गीज़ का आत्मा/प्राण और स्वयं को बचाए रखने का रूपक सुरक्षित रखा गया है; केवल ‘अपने को रोका’ कहने से मूल बिंब मिट जाता।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: पितृकालीन कथा में दैवी नाम के रूप में हिन्दी बाइबलीय प्रयोग अपनाया गया है।
- source_word: ይዜሙ
  choice: व्यभिचार करे
  rationale: विवाहित स्त्री के साथ निषिद्ध यौन-संबंध के संदर्भ में ‘व्यभिचार’ आधुनिक हिन्दी में अधिक सटीक है।
- source_word: ብእሲት፡ እንተ፡ ባቲ፡ ምት
  choice: विवाहित स्त्री
  rationale: मूल का आशय ‘ऐसी स्त्री जिसका पति है’ है; इसे संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ኵነኔ፡ ሞት
  choice: मृत्यु-दण्ड
  rationale: मूल में मृत्यु का न्याय/दोषादेश है; ‘मृत्यु-दण्ड’ न्यायिक आशय स्पष्ट करता है।
- source_word: መጻሕፍት፡ ዘለዓለም
  choice: अनन्त पुस्तकें
  rationale: स्वर्गीय स्थायी अभिलेखों का मूल बहुवचन और कालातीत भाव सुरक्षित रखा गया है।
- source_word: በኵሉ
  choice: सदा के लिए
  rationale: अंतिम क्रियाविशेषण का निरंतर/सर्वकालिक भाव व्यक्त किया गया है; यहाँ ‘यहोवा के सामने’ नहीं जोड़ा गया।
theological_decisions:
- issue: यूसुफ के इनकार का आधार
  choice: याकूब द्वारा अब्राहम की बातों में से सुनाई गई शिक्षा
  alternative: केवल यूसुफ की व्यक्तिगत नैतिक संवेदना
  rationale: मूल पाठ स्पष्टतः पितृपुरुषों से संप्रेषित शिक्षा को स्मरण करने की बात कहता है।
- issue: निषेधात्मक कथन की शक्ति
  choice: ‘कोई पुरुष ... व्यभिचार न करे’
  alternative: ‘कोई पुरुष ... व्यभिचार नहीं करता’
  rationale: गीज़ की शाब्दिक अस्तित्ववाचक रचना इस प्रसंग में नियमात्मक निषेध का कार्य करती है।
- issue: स्वर्गीय न्याय और अभिलेख
  choice: मृत्यु-दण्ड पहले से ठहराया गया है और पाप अनन्त पुस्तकों में लिखा जाता है
  alternative: इसे केवल सांसारिक दण्ड या रूपक मानना
  rationale: मूल की स्वर्गीय न्याय-व्यवस्था और पुस्तकों की भाषा को बिना व्याख्यात्मक न्यूनीकरण के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। ‘प्राण की रक्षा’, ‘परमप्रधान परमेश्वर’ और ‘अनन्त पुस्तकें’ जैसे मूल बिंब सुरक्षित रखे गए हैं; अनावश्यक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
