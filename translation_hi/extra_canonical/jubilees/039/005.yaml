  yaml_path: translation/extra_canonical/jubilees/039/005.yaml
  text: to lie with her. But he guarded his soul and remembered the LORD and the words that Jacob his father used to recite from the words of Abraham[a], that no man should commit fornication with a woman who has a husband, for the judgment of death has been ordained for him in heaven before the Most High God, and the sin is recorded against him in the eternal books continually.
translation:
  language: hi
  text: 'कि वह उसके साथ सोए। परन्तु उसने अपने प्राण की रक्षा की और यहोवा को स्मरण किया। उसने उन बातों को भी स्मरण किया जिन्हें उसका पिता याकूब अब्राहम की बातों में से दोहराया करता था[a]: कोई पुरुष किसी विवाहित स्त्री के साथ व्यभिचार न करे, क्योंकि उसके लिए स्वर्ग में परमप्रधान परमेश्वर के सामने मृत्यु-दण्ड ठहराया गया है, और उसका पाप निरन्तर अनन्त पुस्तकों में उसके विरुद्ध दर्ज होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: याकूब द्वारा अब्राहम से प्राप्त बातें दोहराए जाने का यह उल्लेख जुबलीज़ की विशिष्ट विस्तारात्मक शैली को दर्शाता है। इससे यूसुफ का इनकार केवल उसकी निजी नैतिक भावना पर नहीं, बल्कि पितृपुरुषों से मिली शिक्षा पर आधारित दिखाया गया है।
    reason: cross_reference
