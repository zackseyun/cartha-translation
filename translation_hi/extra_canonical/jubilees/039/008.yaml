lexical_decisions:
- source_word: አይስክብ፡ ምስሌሃ
  choice: वह उसके साथ नहीं सोएगा
  rationale: शाब्दिक अर्थ ‘उसके साथ न लेटना/सोना’ है; प्रसंग में यौन आशय स्पष्ट है, जिसे स्वाभाविक हिंदी में ‘साथ सोना’ व्यक्त करता है।
- source_word: ጠየቀተ፡ ቅድመ፡ እግዚአ
  choice: उसने उसके स्वामी के सामने उस पर दोष लगाया
  rationale: क्रिया आरोप या शिकायत करने का भाव देती है; ‘दोष लगाया’ सामान्य पाठक के लिए स्पष्ट है और ‘स्वामी के सामने’ स्रोत की संरचना बनाए रखता है।
- source_word: ገብርከ፡ ዕብራዊ
  choice: तेरा इब्रानी दास
  rationale: ገብር ‘सेवक/दास’ हो सकता है; गृह-दास के प्रसंग और आरोप की तिरस्कारपूर्ण भाषा में ‘दास’ अधिक सटीक है।
- source_word: ዘታፈቅር
  choice: जिससे तू प्रेम करता है
  rationale: स्रोत के संबद्ध उपवाक्य और प्रेम करने की क्रिया को सीधे सुरक्षित रखा गया है।
- source_word: ይትዐገላኒ
  choice: मुझे विवश करना चाहता था
  rationale: रूप इच्छा/प्रयास और बलपूर्वक बाध्य करने का आरोप व्यक्त करता है; इससे स्रोत का आशय सुरक्षित रहता है, जबकि अधिक विशिष्ट यौन हिंसा को मुख्य पाठ में अनावश्यक रूप से आरोपित नहीं किया जाता।
- source_word: ወኮነ፡ ሶበ
  choice: और ऐसा हुआ कि जब…
  rationale: स्रोत इसी अधूरे कालवाचक उपवाक्य पर रुकता है; अनुवाद भी वाक्य को पूरा किए बिना यह सीमा बनाए रखता है।
theological_decisions:
- issue: स्त्री के आरोप की प्रकृति
  choice: ‘मुझे विवश करना चाहता था’ के रूप में आरोप प्रस्तुत किया
  alternative: ‘मुझ पर हमला करना चाहता था’ अथवा ‘मेरा उपहास करना चाहता था’
  rationale: विस्तृत शब्दार्थ को पादटिप्पणी में रखा गया है; साथ सोने वाला अगला वाक्यांश आरोप को यौन प्रसंग देता है, पर मुख्य क्रिया को अत्यधिक विशिष्ट बनाना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी अपनाई गई है। संबोधन ‘तेरा/तू’ स्रोत की प्रत्यक्ष और आरोपात्मक वाणी को बनाए रखता है। पद के अंत का अधूरापन जानबूझकर सुरक्षित रखा गया है।
