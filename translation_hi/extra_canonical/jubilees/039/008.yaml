  text: और उस स्त्री ने देखा कि वह उसके साथ नहीं सोएगा, और उसने उसके स्वामी के सामने उस पर आरोप लगाया और कहा, “तेरा इब्रानी दास, जिससे तू प्रेम करता है, मुझे अपने साथ सोने के लिए विवश करना चाहता था[a]; और ऐसा हुआ कि जब…”
