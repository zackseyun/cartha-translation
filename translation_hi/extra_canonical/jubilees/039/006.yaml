translation:
  language: hi
  text: दिनों तक परमेश्वर के सामने।[a] यूसुफ ने यह बात याद रखी और उसके साथ सोने से इनकार कर दिया। वह एक वर्ष और फिर दूसरे वर्ष तक उससे आग्रह करती रही, पर उसने उसकी बात सुनने से इनकार कर दिया। और उसने पूछताछ की…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए गीइज़ पाठ का आरम्भ पिछले वाक्य के अंतिम शब्दों जैसा है; इसलिए हिन्दी में भी यह आरम्भ खंडित है।
    reason: verse_segmentation
  - marker: b
    text: दिए गए गीइज़ पाठ में अंतिम क्रिया का अर्थ ‘पूछा/पूछताछ की’, ‘जाँचा’ या ‘निश्चित किया’ हो सकता है, लेकिन उसका कर्म और आगे का वाक्य यहाँ नहीं दिया गया है।
    reason: source_ambiguity_and_segmentation
lexical_decisions:
- source_word: ተዘከረ
  choice: याद रखी
  rationale: क्रिया का अर्थ स्मरण करना है; प्रसंग में पहले कही गई बात को मन में बनाए रखना अभिप्रेत है।
- source_word: ይስክብ፡ ምስሌሃ
  choice: उसके साथ सोने
  rationale: शाब्दिक अर्थ ‘उसके साथ लेटना/सोना’ है और यहाँ यौन संबंध का संकेत जानबूझकर अप्रत्यक्ष रूप में रखा गया है।
- source_word: አስተብቍዐቶ
  choice: उससे आग्रह करती रही
  rationale: यह लगातार विनती या दबाव डालने का भाव देता है; स्त्रीलिंग कर्ता प्रसंग और प्रत्यय से स्पष्ट है।
- source_word: አበየ፡ ሰሚዐ
  choice: उसकी बात सुनने से इनकार कर दिया
  rationale: ‘सुनने से मना किया’ का स्वाभाविक हिन्दी रूप, जिसमें उसकी असहमति स्पष्ट रहती है।
- source_word: አጠየቀ
  choice: पूछताछ की
  rationale: क्रिया पूछने, जाँचने या निश्चित करने का अर्थ दे सकती है। यहाँ वाक्य स्रोत में अधूरा है, इसलिए अनिर्दिष्ट कर्म नहीं जोड़ा गया।
theological_decisions:
- issue: यूसुफ के इनकार का आधार
  choice: ‘यह बात याद रखी’ कहकर स्रोत की सामान्य अभिव्यक्ति बनाए रखी
  alternative: पितृ-उपदेश, व्यभिचार या स्वर्गीय दण्ड का स्पष्ट उल्लेख जोड़ना
  rationale: ये बातें व्यापक प्रसंग में हो सकती हैं, पर दिए गए पदांश में स्पष्ट रूप से उपस्थित नहीं हैं; अतः इन्हें आयात नहीं किया गया।
- issue: स्रोत में ወአፈቀደ और अंग्रेज़ी परामर्श-पाठ के ‘refused’ के बीच तनाव
  choice: प्रसंग तथा परामर्श-पाठ के अनुसार ‘इनकार कर दिया’
  alternative: ‘उसने उसके साथ सोना चाहा’
  rationale: सकारात्मक ‘चाहा’ तत्काल प्रसंग और अगले स्पष्ट इनकार से टकराता है तथा संभवतः स्रोत-पाठ/प्रतिलिपि में नकार-चिह्न के लोप को दर्शाता है। पाठगत तनाव को टिप्पणी में स्वीकार किया गया है, पर अर्थ-संगति के कारण मुख्य पाठ में इनकार रखा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। स्रोत में आरम्भ और अन्त दोनों ओर पद-विभाजन की समस्या है; इसे अनुमानित सामग्री जोड़कर छिपाने के बजाय मुख्य पाठ के विराम और पादटिप्पणियों में स्पष्ट किया गया है।
