  yaml_path: translation/extra_canonical/jubilees/039/003.yaml
  text: in the house of the Egyptian because of Joseph. And everything that he did, the LORD made to prosper. And the Egyptian left everything in Joseph’s hand, because he saw that the LORD was with him, and everything that he did the LORD made to prosper.
translation:
  language: hi
  text: मिस्री के घर में, यूसुफ के कारण।[a] और यूसुफ जो कुछ करता था, यहोवा उसे सफल करता था। मिस्री ने सब कुछ यूसुफ के हाथ में छोड़ दिया, क्योंकि उसने देखा कि यहोवा यूसुफ के साथ है; और यूसुफ जो कुछ करता था, यहोवा उसे सफल करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह आरंभिक वाक्यांश पिछले पद के वाक्य को आगे बढ़ाता जान पड़ता है। इसे इस प्रकार भी जोड़ा जा सकता है: “मिस्री के घर में यूसुफ के कारण, और यूसुफ जो कुछ करता था, यहोवा उसे सफल करता था।”'
    reason: स्रोत-पाठ का आरंभ एक पूर्वसर्गीय वाक्यांश से होता है, इसलिए पद-विभाजन और विराम-चिह्न अस्पष्ट हैं।
lexical_decisions:
- source_word: ግብጻዊ
  choice: मिस्री
  rationale: यह जाति-सूचक संज्ञा है; आधुनिक हिन्दी में ‘मिस्री’ संक्षिप्त और स्वाभाविक है।
- source_word: ይሴርሖ
  choice: उसे सफल करता था
  rationale: क्रिया का अर्थ किसी काम को सफल या समृद्ध करना है। प्रसंग में ‘उसे सफल करता था’ स्वाभाविक है और कर्ता के कार्यों पर परमेश्वर की कृपा को व्यक्त करता है।
- source_word: ኀደገ፡ ... በእዴሁ
  choice: उसके हाथ में छोड़ दिया
  rationale: स्रोत के ‘छोड़ देना’ और ‘हाथ में’ दोनों बिंब सुरक्षित रखे गए हैं; इससे अधिकार और प्रबंध सौंपने का भाव स्पष्ट होता है।
- source_word: ምስሌሁ
  choice: उसके साथ
  rationale: यह स्रोत की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: ईश्वरीय नाम እግዚአብሔር का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: इस यहूदी शास्त्रीय प्रसंग और परामर्श-पाठ में बड़े अक्षरों वाले LORD के पीछे समझे गए दिव्य नाम को हिन्दी में स्पष्ट रूप से ‘यहोवा’ रखा गया है; इससे सामान्य मानवीय उपाधि ‘प्रभु’ से भेद बना रहता है।
- issue: समृद्धि के कारण का कथन
  choice: यहोवा उसे सफल करता था
  alternative: वह यहोवा के कारण सफल होता था
  rationale: स्रोत में यहोवा व्याकरणिक कर्ता है; अनुवाद उसी प्रत्यक्ष ईश्वरीय क्रिया को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत की पुनरुक्ति—यहोवा द्वारा यूसुफ के कार्यों को सफल करना—जानबूझकर सुरक्षित रखी गई है। आरंभिक खंड की वाक्यगत अपूर्णता को मुख्य पाठ और पादटिप्पणी दोनों में ईमानदारी से दर्शाया गया है।
