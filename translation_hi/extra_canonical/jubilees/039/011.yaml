  text: There in the prison, the LORD gave Joseph favor and mercy before the chief of the keepers of the prison-house[a], because he saw that the LORD was with him, and everything
translation:
  language: hi
  text: वहाँ बंदीगृह में यहोवा ने यूसुफ को बंदीगृह के पहरेदारों के प्रधान[a] की दृष्टि में कृपा और दया प्रदान की, क्योंकि उसने देखा कि यहोवा उसके साथ था, और सब कुछ
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त पदवी में वही ‘पहरा देना/रखवाली करना’ वाला मूल शब्द है जो पहले आया है; पर बंदीगृह के प्रसंग में इसका अर्थ पोतीपर के घरेलू पदाधिकारी के बजाय बंदीगृह के अधिकारी से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ህየ፡ ውስተ፡ ሞቅሕ
  choice: वहाँ बंदीगृह में
  rationale: आरंभिक स्थान-सूचक वाक्यांश को स्पष्ट रूप से रखा गया है; ሞቅሕ को प्रसंगानुसार ‘बंदीगृह’ कहा गया है।
- source_word: ሞገሰ፡ ... ወምሕረተ
  choice: कृपा और दया
  rationale: दोनों अलग संज्ञाओं को बनाए रखते हुए स्वाभाविक हिन्दी क्रम अपनाया गया है।
- source_word: ሊቀ፡ ዐቀብተ፡ ቤተ፡ ሞቅሕ
  choice: बंदीगृह के पहरेदारों के प्रधान
  rationale: ሊቀ को ‘प्रधान’, ዐቀብተ को ‘पहरेदारों’ और ቤተ ሞቅሕ को ‘बंदीगृह’ के रूप में औपचारिक किंतु सुबोध ढंग से प्रस्तुत किया गया है।
- source_word: በቅድሜሁ
  choice: की दृष्टि में
  rationale: शाब्दिक ‘उसके सामने’ के मुहावरेदार अर्थ—किसी अधिकारी की निगाह में अनुग्रह पाना—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እስመ፡ ርእየ
  choice: क्योंकि उसने देखा
  rationale: पुल्लिंग एकवचन कर्ता को स्रोत की तरह अनिर्दिष्ट रखा गया है; निकटतम प्रसंग में यह अधिकारी की ओर संकेत करता है।
- source_word: ወኵሎ
  choice: और सब कुछ
  rationale: प्रदत्त गीइज़ पाठ यहीं अपूर्ण रूप से समाप्त होता है; अनुवाद में पूरक क्रिया या अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: दैवी नाम እግዚአብሔር का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत दैवी नाम को हिन्दी बाइबलीय परंपरा में पहचाने जाने वाले ‘यहोवा’ से व्यक्त किया गया है, बिना पद में कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
- issue: अंतिम अपूर्ण पदबंध
  choice: ‘और सब कुछ’ पर पद को अपूर्ण ही समाप्त करना
  alternative: अगले पद से अनुमानित क्रिया या कर्म जोड़ना
  rationale: प्रदत्त मूल-पाठ भी ወኵሎ (‘और सब कुछ’) पर रुकता है; वास्तविक पाठगत अपूर्णता को चुपचाप पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘कृपा और दया’, ‘की दृष्टि में’ तथा ‘पहरेदारों के प्रधान’ बाइबलीय अर्थ को सुरक्षित रखते हुए सामान्य पाठक के लिए बोधगम्य हैं। स्रोत की अंतिम अपूर्णता जानबूझकर यथावत रखी गई है।
