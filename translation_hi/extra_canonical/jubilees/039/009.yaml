  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। कथन स्त्री वक्ता का है, फिर भी हिन्दी भूतकाल में ‘मैंने ... पुकारा/पकड़ा’ रूप लिंग-निरपेक्ष रहता है। समन्वय को स्पष्ट करने के लिए पहले वाक्य के बाद वाक्य-विभाजन किया गया है; घटनाक्रम और स्रोत की पुनरावृत्त संयोजकता सुरक्षित है।
