  yaml_path: translation/extra_canonical/jubilees/039/009.yaml
  text: I raised my voice, and he ran and left his garment in my hand when I seized him, and he broke the door.”
translation:
  language: hi
  text: मैंने ऊँची आवाज़ में पुकारा, और वह भाग गया। जब मैंने उसे पकड़ा, तो वह अपना वस्त्र मेरे हाथ में छोड़ गया और उसने द्वार[a] तोड़ दिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘द्वार की अर्गला’।
    reason: गीज़ ማዕጾ का सामान्य अर्थ ‘द्वार’ है, पर संदर्भ में द्वार बंद करने वाली अर्गला या साँकल भी अभिप्रेत हो सकती है।
lexical_decisions:
- source_word: አልዐልኩ፡ ቃለየ
  choice: मैंने ऊँची आवाज़ में पुकारा
  rationale: शाब्दिक अर्थ ‘मैंने अपनी आवाज़ उठाई’ है; आधुनिक हिन्दी में प्रसंगानुकूल और स्वाभाविक अभिव्यक्ति ‘ऊँची आवाज़ में पुकारा’ है।
- source_word: ጐየ
  choice: वह भाग गया
  rationale: क्रिया तीव्र गति से भागने या दौड़कर निकल जाने को व्यक्त करती है; आरोपात्मक कथन के प्रवाह में ‘भाग गया’ सहज है।
- source_word: ኀደገ፡ ልብሶ፡ ውስተ፡ እዴየ
  choice: अपना वस्त्र मेरे हाथ में छोड़ गया
  rationale: स्रोत की क्रिया, वस्त्र और ‘मेरे हाथ में’ संबंध को सीधे सुरक्षित रखता है।
- source_word: በጊዜ፡ አንተ፡ አኀዝክዎ
  choice: जब मैंने उसे पकड़ा
  rationale: पाठ का अभिप्राय समयवाचक उपवाक्य है। አንተ पाठगत रूप से कठिन या असामान्य है, पर उपलब्ध वाक्य-संबंध और परंपरागत पाठ-साक्ष्य प्रथम पुरुष ‘मैंने उसे पकड़ा’ का समर्थन करते हैं।
- source_word: ማዕጾ
  choice: द्वार
  rationale: गीज़ संज्ञा का प्राथमिक और मानक अर्थ ‘द्वार’ है; ‘अर्गला’ या ‘द्वार की साँकल’ संभव अर्थ-छाया है, इसलिए उसे पादटिप्पणी में रखा गया है।
