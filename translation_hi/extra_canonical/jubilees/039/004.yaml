translation:
  language: hi
  text: और यूसुफ रूप में सुंदर और देखने में बहुत मनोहर था। उसके स्वामी की पत्नी ने आँखें उठाकर यूसुफ को देखा, उससे प्रेम किया और उससे विनती की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠናይ፡ ራእዮ፡ ወላህይ፡ ራእዮ፡ ጥቀ
  choice: रूप में सुन्दर और देखने में बहुत मनोहर
  rationale: दो समानांतर रूप-वर्णनों को बनाए रखा गया है और ጥቀ की तीव्रता को ‘बहुत’ से व्यक्त किया गया है।
- source_word: አንሥአት፡ አዕይንቲሃ
  choice: आँखें उठाकर
  rationale: स्रोत की देहगत अभिव्यक्ति को स्वाभाविक हिन्दी में यथासंभव औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: አፍቀረቶ
  choice: उससे प्रेम करने लगी
  rationale: मूल क्रिया का सीधा अर्थ ‘प्रेम करना’ है; प्रसंग के आधार पर इसे केवल ‘लालसा करना’ बनाकर संकुचित नहीं किया गया।
- source_word: አስተብቍዐቶ
  choice: उससे विनती की
  rationale: क्रिया में आग्रह/याचना का भाव है; वाक्य इस पद पर अपूर्ण आग्रह के साथ समाप्त होता है, जैसा उपलब्ध स्रोत में है।
