  yaml_path: translation/extra_canonical/jubilees/039/002.yaml
  text: For Pharaoh, the chief of the guards. And he appointed Joseph over all his house, and the blessing of the LORD came to be.
translation:
  language: hi
  text: फ़िरौन के लिए—अंगरक्षकों का प्रधान।[a] उसने यूसुफ को अपने पूरे घराने पर नियुक्त किया, और प्रभु की आशीष हुई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का आरंभ स्रोत-पाठ में एक अधूरे पदबंध के रूप में है; इसका संबंध पिछले वाक्य से हो सकता है।
    reason: खंडित गीइज़ वाक्य-रचना को पाठक के लिए स्पष्ट करना, बिना मुख्य पाठ में अनुमानित शब्द जोड़ने के।
  - marker: b
    text: स्रोत-पाठ यहाँ यह नहीं बताता कि आशीष किस पर हुई; कुछ विस्तृत रूपों में प्रसंग के आधार पर अतिरिक्त शब्द मिलते हैं।
    reason: अंतिम उपवाक्य की स्रोतगत संक्षिप्तता और वास्तविक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: ሊቀ፡ ዐቀብት
  choice: अंगरक्षकों का प्रधान
  rationale: ‘प्रधान/मुखिया’ और ‘रक्षकों’ के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; पदनाम को अनावश्यक रूप से किसी अधिक विशिष्ट सैन्य पद में नहीं बदलता।
- source_word: ሤሞ
  choice: नियुक्त किया
  rationale: किसी को अधिकारपूर्ण पद पर ठहराने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዲበ፡ ኵሉ፡ ቤቱ
  choice: अपने पूरे घराने पर
  rationale: शाब्दिक ‘उसके सारे घर के ऊपर’ का आशय घरेलू संपत्ति और व्यवस्था पर अधिकार है; ‘घराना’ इस व्यापक अर्थ को हिन्दी में बनाए रखता है।
- source_word: በረከተ፡ እግዚአብሔር
  choice: प्रभु की आशीष
  rationale: निर्माण-संबंध को यथावत रखता है और እግዚአብሔር के लिए प्रतिष्ठित, संप्रदाय-निरपेक्ष बाइबलीय पद ‘प्रभु’ अपनाता है।
theological_decisions:
- issue: आशीष किस पर या किस कारण से हुई
  choice: और प्रभु की आशीष हुई
  alternative: और यूसुफ के कारण उस मिस्री के घर पर प्रभु की आशीष हुई
  rationale: दिए गए गीइज़ पाठ में आशीष के प्राप्तकर्ता या उसके कारण का उल्लेख नहीं है। व्यापक प्रसंग से उसे जोड़ना संभव है, पर इस पद में वह सामग्री जोड़ना स्रोत की वास्तविक अपूर्णता/संक्षिप्तता को मिटा देगा।
- issue: आरंभिक पदबंध की खंडित वाक्य-रचना
  choice: फ़िरौन के अंगरक्षकों का प्रधान।
  alternative: वह फ़िरौन के अंगरक्षकों का प्रधान था।
  rationale: स्रोत में स्पष्ट कर्ता और संयोजक क्रिया नहीं हैं; इसलिए ‘वह’ और ‘था’ जोड़कर अस्पष्टता को चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय रजिस्टर रखा गया है। दोनों असामान्य खंडों को सहज बनाने के लिए स्रोत में अनुपस्थित विवरण नहीं जोड़े गए; आवश्यक स्पष्टीकरण पादटिप्पणियों में दिया गया है।
