  text: And both of them dreamed a dream[a], the chief cupbearer and the chief baker, and they told Joseph.
translation:
  language: hi
  text: प्रधान प्याला परोसनेवाले और प्रधान रोटी बनानेवाले—दोनों ने एक-एक सपना देखा और यूसुफ को अपना-अपना सपना बताया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में यूसुफ की ओर संकेत करनेवाला सर्वनामिक कर्म-प्रत्यय और फिर उसका नाम—दोनों आए हैं; इसका स्वाभाविक अर्थ है, “उन्होंने यूसुफ को बताया।”
    reason: segmentation_note
lexical_decisions:
- source_word: ሊቀ፡ መዛርት
  choice: प्रधान प्याला परोसनेवाला
  rationale: यह पद राजकीय प्याला परोसनेवालों के मुखिया को दर्शाता है। यह आधुनिक हिन्दी में स्वाभाविक है और केवल ‘पिलानेवाला’ कहने से उत्पन्न अस्पष्टता से बचता है।
- source_word: ሊቀ፡ ሐበዝት
  choice: प्रधान रोटी बनानेवाला
  rationale: ሐበዝት रोटी बनानेवालों या नानबाइयों को दर्शाता है। ‘रोटी बनानेवाला’ सामान्य आधुनिक पाठक के लिए स्पष्ट है और ‘रसोइया’ जैसे अधिक व्यापक अर्थ से बचता है।
- source_word: ሐለሙ፡ ክልኤሆሙ፡ ሕልመ
  choice: दोनों ने एक-एक सपना देखा
  rationale: मूल में ‘दोनों’ के साथ ‘सपना’ एकवचन में है। हिन्दी में ‘एक-एक’ उस वितरणात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है कि दोनों व्यक्तियों ने सपना देखा, बिना यह संकेत दिए कि दोनों ने एक ही सपना देखा।
- source_word: ወነገርዎ፡ ለዮሴፍ
  choice: और यूसुफ को अपना-अपना सपना बताया
  rationale: क्रिया का आशय सपनों का वर्णन यूसुफ से करना है। हिन्दी में व्यक्त कर्म और बताई गई बात को स्पष्ट करने के लिए ‘यूसुफ को ... सपना बताया’ स्वाभाविक है।
