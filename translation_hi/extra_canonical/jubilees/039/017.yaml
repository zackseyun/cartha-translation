base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/017.yaml
  text: 'And as he interpreted for them, so it happened to them: Pharaoh restored the chief cupbearer to his service, but the baker he killed, just as Joseph had interpreted for them. But the chief cupbearer forgot Joseph in the prison-house, although he had told him what would happen[a], and he did not remember to make it known to Pharaoh what Joseph had told him, for he forgot.[b]'
translation:
  language: hi
  text: 'और जैसा यूसुफ ने उन दोनों के लिए अर्थ बताया था, वैसा ही उनके साथ हुआ: फ़िरौन ने प्रधान पिलानेवाले को फिर उसकी सेवा में लगा दिया, पर पकानेवाले को मरवा डाला—ठीक जैसा यूसुफ ने उनके लिए अर्थ बताया था। लेकिन प्रधान पिलानेवाला बंदीगृह में पड़े यूसुफ को भूल गया, यद्यपि यूसुफ ने उसे बता दिया था कि क्या होनेवाला है।[a] उसे फ़िरौन को वह बात बताना याद न रहा जो यूसुफ ने उससे कही थी, क्योंकि वह भूल गया था।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यद्यपि वह जानता था कि क्या होनेवाला है।” गीज़ क्रिया कारक है—अर्थात यूसुफ ने प्रधान पिलानेवाले को यह बात बताई थी, न कि केवल प्रधान पिलानेवाला उसे जानता था।
    reason: source_clarification
  - marker: b
    text: संप्रेषित इथियोपिक पाठ में अंतिम वाक्य कुछ असहज है। आशय संभवतः यह है कि प्रधान पिलानेवाला यूसुफ को भूल गया और यूसुफ की सच्ची सिद्ध हुई व्याख्या फ़िरौन को नहीं बताई।
    reason: textual_variant
lexical_decisions:
- source_word: ፈከረ
  choice: अर्थ बताया
  rationale: संदर्भ में यह स्वप्न का अर्थ बताने या व्याख्या करने को सूचित करता है; सहज हिंदी में ‘अर्थ बताया’ स्पष्ट और स्वाभाविक है।
- source_word: ሊቀ፡ መዘርት
  choice: प्रधान पिलानेवाला
  rationale: यह राजकीय पान-पात्र की सेवा के मुखिया का पद है; ‘प्रधान पिलानेवाला’ सामान्य पाठक के लिए समझने योग्य है और पद की प्रधानता भी बनाए रखता है।
- source_word: ሐባዚስ
  choice: पकानेवाला
  rationale: शब्द रोटी या भोजन तैयार करने वाले राजकीय कर्मचारी की ओर संकेत करता है; ‘पकानेवाला’ स्रोत के पदनाम को सरल आधुनिक हिंदी में व्यक्त करता है।
- source_word: ቤተ፡ ሞቅሕ
  choice: बंदीगृह
  rationale: शाब्दिक अर्थ कैद या बंधन का घर है; ‘बंदीगृह’ गरिमापूर्ण और सहज हिंदी समतुल्य है।
- source_word: አይድዖ
  choice: उसे बता दिया था
  rationale: यह कारक रूप है और ‘जानता था’ नहीं, बल्कि ‘उसने उसे ज्ञात कराया/बता दिया’ का भाव देता है। संदर्भ में कर्ता यूसुफ और कर्म प्रधान पिलानेवाला समझे गए हैं।
- source_word: ኢተዘከረ
  choice: सुधि नहीं ली
  rationale: मूल में स्मरण न करने का भाव है; अगले ‘क्योंकि वह भूल गया था’ के साथ अनावश्यक कठोर पुनरावृत्ति से बचते हुए स्मरण और कार्यवाही दोनों का आशय व्यक्त होता है।
theological_decisions:
- issue: यूसुफ और प्रधान पिलानेवाले से जुड़े सर्वनामों की पहचान
  choice: ‘यूसुफ ने उसे बता दिया था’
  alternative: ‘यद्यपि वह जानता था कि क्या होनेवाला है’
  rationale: गीज़ क्रिया का कारक बल किसी को बताने/ज्ञात कराने का है। संदर्भ यूसुफ को बताने वाला और प्रधान पिलानेवाले को सुनने वाला मानने का समर्थन करता है; फिर भी पांडुलिपिगत वाक्य-विन्यास की कठिनाई को पादटिप्पणी में स्वीकार किया गया है।
- issue: अंतिम वाक्य की पुनरुक्ति
  choice: ‘सुधि नहीं ली ... क्योंकि वह भूल गया था’ के रूप में पुनरुक्ति बनाए रखी
  alternative: एक ही बार कहना कि उसने फ़िरौन को नहीं बताया
  rationale: मूल पाठ में स्मरण न करने और भूल जाने की पुनरावृत्ति है। इसे पूरी तरह हटाना संप्रेषित पाठ की बलाघातपूर्ण, किंचित असहज शैली को समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। ‘फ़िरौन’, ‘बंदीगृह’ और पदनामों से प्राचीन दरबारी संदर्भ बना रहता है। मूल की अंतिम पुनरुक्ति को हल्का स्वाभाविक बनाते हुए सुरक्षित रखा गया है।
