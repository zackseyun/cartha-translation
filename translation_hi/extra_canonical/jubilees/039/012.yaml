  yaml_path: translation/extra_canonical/jubilees/039/012.yaml
  text: Whatever he did, the LORD made to prosper. And he left everything in his hand, and the chief keeper of the prison knew nothing that was with him, because Joseph did everything and the LORD brought it to completion.
translation:
  language: hi
  text: यूसुफ जो कुछ करता था, प्रभु उसे सफल बनाता था। उसने सब कुछ उसके हाथ में छोड़ दिया था, और बन्दीगृह का प्रधान रखवाला उसके पास जो कुछ था, उसके विषय में कुछ नहीं जानता था, क्योंकि यूसुफ सब कुछ करता था और प्रभु उसे पूर्णता तक पहुँचाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሴርሖ
  choice: उसे सफल बनाता था
  rationale: क्रिया का अर्थ किसी कार्य को फलने-फूलने या सफल होने देना है; आधुनिक हिन्दी में यह सहज और प्रसंगानुकूल है।
- source_word: ኀደገ፡ ኵሎ፡ በእዴሁ
  choice: उसने सब कुछ उसके हाथ में छोड़ दिया था
  rationale: ‘हाथ में’ अधिकार और प्रबन्ध सौंपने का स्रोत-पाठ का रूपक बनाए रखता है।
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  choice: बन्दीगृह का प्रधान रखवाला
  rationale: पद का अर्थ कैदियों अथवा बन्दीगृह के रखवालों के प्रधान से है; यह अनावश्यक प्रशासनिक विशिष्टता जोड़े बिना पदानुक्रम बताता है।
- source_word: ይፈጽም
  choice: उसे पूरा करता था
  rationale: मूल क्रिया ‘पूरा करना/सिद्धि तक पहुँचाना’ है। इसे केवल ‘सफल करता था’ कहने पर पहले वाक्य की अलग क्रिया के साथ भेद मिट जाता।
theological_decisions:
- issue: ईश्वरीय नाम እግዚአብሔር का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: उपलब्ध गीइज़ पाठ में सामान्य पद እግዚአብሔር है। ‘प्रभु’ उसका सीधा और गरिमापूर्ण हिन्दी रूप है; केवल सम्भावित इब्रानी आधार के कारण ‘यहोवा’ को पाठ में पुनर्स्थापित नहीं किया गया।
- issue: यूसुफ के कार्य और प्रभु की भूमिका के बीच सम्बन्ध
  choice: यूसुफ सब कुछ करता था और प्रभु उसे पूरा करता था
  alternative: यूसुफ के हर काम को प्रभु सफल करता था
  rationale: मूल पाठ मानवीय कार्य और ईश्वरीय पूर्णता को दो समन्वित कथनों में रखता है; अनुवाद ने इस तनाव और भेद को बनाए रखा है।
translation_notes:
  register: भाषा आधुनिक, मानक और गरिमापूर्ण हिन्दी है। ‘बन्दीगृह’ तथा ‘प्रधान रखवाला’ सामान्य पाठक के लिए स्पष्ट हैं। सर्वनामों की स्रोत-पाठीय संरचना को यथासम्भव बनाए रखा गया है; प्रसंग से ‘उसने’ प्रधान रखवाले और ‘उसके हाथ’ यूसुफ की ओर संकेत करते हैं।
