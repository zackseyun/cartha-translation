  choice: बन्दीगृह के पहरेदारों का प्रधान
  rationale: यह पदबंध कारागार की रखवाली करने वालों के अधिकारी को दर्शाता है; आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए पदानुक्रम भी सुरक्षित किया गया है।
