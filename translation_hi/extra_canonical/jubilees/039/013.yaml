  yaml_path: translation/extra_canonical/jubilees/039/013.yaml
  text: And he remained there two years. And in those days Pharaoh king of Egypt was angry with his two eunuchs, with the chief cupbearer and with the chief baker, and he put them into prison.
translation:
  language: hi
  text: और वह वहाँ दो वर्ष रहा। उन दिनों मिस्र का राजा फ़िरौन अपने दोनों खोजा दरबारियों—मुख्य पेय परोसनेवाले और मुख्य रोटी बनानेवाले—से क्रोधित हुआ और उसने उन्हें बंदीगृह में डाल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካልአ፡ ዓመተ
  choice: दो वर्ष
  rationale: गीज़ पदबंध अवधि को सूचित करता है; स्वाभाविक हिन्दी में इसे सीधे ‘दो वर्ष’ कहा गया है।
- source_word: ክልኤቱ፡ ሕፁዋኒሁ
  choice: अपने दोनों दरबारियों
  rationale: शब्द का अर्थ अधिकारी/दरबारी या नपुंसक हो सकता है। आगे दिए गए पदों के कारण यहाँ उनकी राजकीय सेवा प्रमुख है; ‘नपुंसकों’ कहने से अनावश्यक शारीरिक अर्थ निश्चित हो जाता।
- source_word: ሊቀ፡ መዛርት
  choice: प्रधान पिलानेवाले
  rationale: यह फ़िरौन को पेय परोसने वाले वरिष्ठ अधिकारी का पद है; सरल हिन्दी रखते हुए पद की प्रधानता बचाई गई है।
- source_word: ሊቀ፡ ሐበዝት
  choice: प्रधान रोटी बनानेवाले
  rationale: शाब्दिक पद ‘रोटी बनानेवालों का प्रधान’ है; आधुनिक पाठक के लिए संक्षिप्त और स्पष्ट रूप चुना गया।
- source_word: ውስተ፡
  choice: बंदीगृह में
  rationale: प्राप्त गीज़ अंश ‘में’ पर रुकता है, पर वाक्य और संदर्भ में अपेक्षित गंतव्य बंदीगृह है; अंग्रेज़ी परामर्श-पाठ भी इसी पाठगत पूर्ति को दर्शाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दरबारी’ से स्रोत शब्द की प्रशासनिक भूमिका व्यक्त होती है, जबकि संभावित शारीरिक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
