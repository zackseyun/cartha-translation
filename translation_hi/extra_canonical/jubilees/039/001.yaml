base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/001.yaml
  text: And Jacob dwelt in the land of his father’s sojourning, in the land of Canaan. These are the generations of Jacob. And Joseph, being seventeen years old, was brought down into Egypt, and Potiphar, an officer of Pharaoh, chief of the guards, bought him.
translation:
  language: hi
  text: और याकूब अपने पिता के प्रवास की भूमि में, अर्थात कनान देश में, रहता था। याकूब की वंशावली यह है। यूसुफ सत्रह वर्ष का था, जब उसे मिस्र ले जाया गया; और फ़िरौन के एक अधिकारी[a] तथा अंगरक्षकों के प्रधान पोतीपर ने उसे मोल ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्रोत का शब्द शाब्दिक रूप से “नपुंसक” भी हो सकता है, पर प्राचीन राजदरबार में यह किसी उच्च अधिकारी की पदवी के रूप में भी प्रयुक्त होता था।
    reason: मूल पद की शाब्दिक और पदवीगत, दोनों संभावनाएँ सुरक्षित रहती हैं।
lexical_decisions:
- source_word: ምድረ፡ ፍልሰተ፡ አቡሁ
  choice: अपने पिता के परदेश-निवास की भूमि
  rationale: ‘ፍልሰት’ अस्थायी अथवा प्रवासी निवास का भाव रखता है; ‘परदेश-निवास’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ትዝምደ፡ ያዕቆብ
  choice: याकूब की वंशावली
  rationale: यह पद वंश, पीढ़ियों या पारिवारिक वृत्तांत का संकेत दे सकता है; इस सूत्र-वाक्य के लिए ‘वंशावली’ संक्षिप्त और परिचित हिन्दी है।
- source_word: አውረድዎ፡ ውስተ፡ ግብጽ
  choice: उसे मिस्र ले जाया गया
  rationale: मूल में नीचे ले जाने का दिशात्मक भाव है; हिन्दी में मिस्र ले जाए जाने का निष्क्रिय रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ተሣየጦ
  choice: उसे मोल ले लिया
  rationale: क्रिया खरीदने का भाव देती है; ‘मोल ले लिया’ दास के रूप में खरीदे जाने की ऐतिहासिक स्थिति को स्पष्ट रखता है।
- source_word: ኅፅዉ
  choice: अधिकारी
  rationale: यह शब्द शाब्दिक रूप से ‘नपुंसक’ कह सकता है, पर राजदरबार के पदाधिकारी के लिए उपाधि के रूप में भी प्रयुक्त होता है; मुख्य पाठ में प्रसंगानुकूल पदनाम रखा गया है और शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: याकूब की ‘generations’ का आशय
  choice: वंशावली
  alternative: याकूब का वृत्तांत / याकूब की पीढ़ियाँ
  rationale: सूत्र-वाक्य वंश और उससे जुड़े पारिवारिक वृत्तांत दोनों की ओर संकेत कर सकता है। ‘वंशावली’ पारंपरिक संरचना को बनाए रखती है, यद्यपि इसे केवल नामों की सूची तक सीमित नहीं समझना चाहिए।
- issue: पोतीपर के पद का वर्णन
  choice: फ़िरौन के एक अधिकारी
  alternative: फ़िरौन का एक नपुंसक
  rationale: स्रोत-पद में शारीरिक स्थिति और राजकीय पदवी, दोनों की संभावना है। प्रसंग में पदवी अधिक स्वाभाविक है; दूसरी संभावना को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘परदेश-निवास’, ‘वंशावली’ और ‘मोल ले लिया’ जैसे पद मूल की औपचारिकता को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
