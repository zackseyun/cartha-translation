  choice: दरवाज़े की अड़चन
  rationale: संदर्भ में दरवाज़ा रोकने या बंद रखने वाली वस्तु अभिप्रेत है; ‘अड़चन’ आधुनिक पाठक के लिए समझने योग्य रहते हुए वस्तु की ठीक बनावट निर्धारित नहीं करती।
- source_word: ወርእየት
