translation:
  language: hi
  text: और उसने घर में उसे पकड़ लिया, ताकि उसे अपने साथ सोने के लिए विवश करे।[a] उसने घर के दरवाज़े बंद कर दिए और उसे पकड़ लिया; पर वह अपना वस्त्र उसके हाथ में छोड़कर दरवाज़े की सांकल तोड़कर उसके सामने से बाहर भाग गया। और उसने देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल पाठ में घटनाएँ बहुत सघन रूप से कही गई हैं: वह दरवाज़े बंद करती है, उसे पकड़ती है, वह अपना वस्त्र छोड़ता है, दरवाज़े की सांकल तोड़ता है और भाग जाता है। इथियोपिक पाठ के वाक्य-विभाजन के कारण घटनाओं का ठीक क्रम संक्षिप्त रूप में व्यक्त हुआ हो सकता है।'
    reason: segmentation_note
