  text: from year to year. And in the days when the house is built in the name of the LORD in the land of their inheritance, there they shall go and slaughter the Passover in the evening, at sunset,
translation:
  language: hi
  text: वर्ष-दर-वर्ष। और उन दिनों में, जब उनकी विरासत की भूमि में प्रभु के नाम का भवन बनाया जाएगा, तब वे वहाँ जाकर संध्या को, सूर्यास्त के समय, फसह-बलि का वध करेंगे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሔር፡ እምዓመት፡ በዓመት
  choice: वर्ष-दर-वर्ष
  rationale: खंड के आरंभ में पिछले वाक्य से जुड़ी आवृत्ति की अभिव्यक्ति है; संक्षिप्त और स्वाभाविक हिन्दी इसे ठीक प्रकार व्यक्त करती है।
- source_word: ቤት
  choice: भवन
  rationale: संदर्भ प्रभु के नाम पर निर्मित पवित्र भवन का है; ‘भवन’ मूल के सामान्य ‘घर/भवन’ अर्थ को बनाए रखते हुए मंदिर का आशय अनावश्यक रूप से पाठ में नहीं जोड़ता।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ पद का परंपरागत अर्थ ‘प्रभु’ है; यह धार्मिक संदर्भ में स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: የሐሩ፡ ወይጥብሑ
  choice: वे वहाँ जाकर … वध करेंगे
  rationale: मूल में गति का क्रियापद ‘वे जाएँगे’ और उसके बाद ‘वे वध करेंगे’ दोनों स्पष्ट हैं; ‘जाकर … वध करेंगे’ हिन्दी में दोनों को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: ጳስካ
  choice: फसह-बलि
  rationale: यहाँ क्रिया ‘वध करना’ है, इसलिए ‘फसह-बलि’ पर्व के साथ बलि किए जाने वाले पशु/बलिदान का आशय स्पष्ट करती है, बिना केवल उत्सव के वध की अस्वाभाविक धारणा उत्पन्न किए।
- source_word: ምሴተ፡ እንዘ፡ የዐርብ፡ ፀሐይ
  choice: संध्या को, सूर्यास्त के समय
  rationale: मूल में संध्या और सूर्य के अस्त होने—दोनों समय-सूचक तत्व हैं; हिन्दी में यह रूप दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘भवन’ की पहचान
  choice: भवन
  alternative: मंदिर
  rationale: संदर्भ मंदिर की ओर संकेत करता है, पर मूल शब्द सामान्य ‘घर/भवन’ है; अनुवाद ने निहित पहचान को स्पष्ट धार्मिक पद में बदलने के बजाय मूल की शब्दगत व्यापकता रखी है।
- issue: गति के क्रियापद की उपस्थिति
  choice: वे वहाँ जाकर … वध करेंगे
  alternative: वे वहाँ … वध करेंगे
  rationale: गीज़ የሐሩ स्पष्ट रूप से ‘वे जाएँगे’ कहता है; इसे हटाना मूल के एक स्वतंत्र अर्थ-तत्व को खो देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबिलीय गद्य। वाक्यांश पिछले पद से चलता हुआ प्रतीत होता है, इसलिए आरंभ और अंत का विराम स्रोत-खंड की निरंतरता के अनुसार रखा गया है।
