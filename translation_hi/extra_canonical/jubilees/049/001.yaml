  yaml_path: translation/extra_canonical/jubilees/049/001.yaml
  text: 'Remember the command that the LORD commanded you concerning the Passover: that you should observe it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.'
translation:
  language: hi
  text: 'फसह के विषय में उस आज्ञा को स्मरण रखो जो प्रभु ने तुम्हें दी है: उसका उसके नियत समय पर, पहले महीने के चौदहवें दिन, पालन करो; उसे साँझ होने से पहले वध करो, और वे उसे खाएँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፋሲካ
  choice: फसह
  rationale: यह पास्का/Passover पर्व का प्रचलित और सटीक हिन्दी बाइबलीय नाम है।
- source_word: ትግበር
  choice: मनाओ
  rationale: शाब्दिक अर्थ ‘करो’ है, पर पर्व के संबंध में आधुनिक हिन्दी में ‘मनाओ’ स्वाभाविक है और विधिपूर्वक पालन का भाव बनाए रखता है।
- source_word: በጊዜሁ
  choice: उसके नियत समय पर
  rationale: संदर्भ पर्व के निर्धारित अनुष्ठानिक समय का है; ‘नियत’ इस आशय को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: ትጥብቍ
  choice: उसका बलिदान करो
  rationale: यहाँ फसह के पशु को वध करने की अनुष्ठानिक क्रिया अभिप्रेत है; केवल ‘मारो’ की अपेक्षा ‘बलिदान करो’ संदर्भानुकूल है।
- source_word: ይብልዕዎ
  choice: वे उसे खाएँ
  rationale: स्रोत में कर्ता तीसरे पुरुष बहुवचन है, जबकि पहले के आदेश दूसरे पुरुष एकवचन में हैं; इस बदलाव को ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम/उपाधि እግዚአብሔር का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: गीज़ पाठ में सामान्य ईश्वरीय उपाधि है, स्पष्ट रूप से टेट्राग्राम का लिप्यंतरण नहीं; इसलिए ‘प्रभु’ स्रोत के रूप के अधिक निकट है।
- issue: दूसरे पुरुष से तीसरे पुरुष बहुवचन में कर्ता-परिवर्तन
  choice: ‘तुम ... बलिदान करो, और वे ... खाएँ’
  alternative: ‘तुम ... बलिदान करो और खाओ’
  rationale: स्रोत पाठ के व्याकरणिक तनाव और संभावित सामुदायिक संकेत को सामान्य बनाकर मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘स्मरण रखो’, ‘नियत समय’, और ‘बलिदान करो’ औपचारिकता तथा अनुष्ठानिक संदर्भ के बीच संतुलन रखते हैं।
