lexical_decisions:
- source_word: በሣልስቲ፡ ለዕለት
  choice: दिन के तीसरे भाग में
  rationale: स्रोत की समय-संबंधी अभिव्यक्ति को उसके क्रमसूचक रूप सहित सीधे और स्वाभाविक हिंदी में रखा गया है।
- source_word: ምካይዳ፡ ለምሥዋዕ
  choice: वेदी के आधार पर
  rationale: यहाँ पद वेदी के निचले आधार या तल की ओर संकेत करता है; ‘दहलीज़’ वेदी के संदर्भ में कम सटीक है।
- source_word: ሥብሖ
  choice: उसकी चरबी
  rationale: बलिदानी पशु की चढ़ाई जाने वाली चरबी के लिए प्रचलित और संदर्भानुकूल शब्द।
- source_word: ዐጸደ፡ ቤት
  choice: भवन के आँगन में
  rationale: शाब्दिक रूप से ‘घर/भवन का आँगन’; स्रोत अपने आप यह स्पष्ट नहीं करता कि भवन मंदिर है, इसलिए केवल ‘भवन’ रखा गया है।
