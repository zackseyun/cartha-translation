translation:
  language: hi
  text: दिन के तीसरे भाग में। वे उसका लहू वेदी के आधार तक ले जाएँ, उसकी चरबी वेदी पर जो आग जल रही है, उस पर रखें, और उसका मांस आग में भूनकर भवन के आँगन में खाएँ।
