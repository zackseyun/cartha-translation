  yaml_path: translation/extra_canonical/jubilees/049/022.yaml
  text: And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and concerning the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing.
translation:
  language: hi
  text: और तू, हे मूसा, इस्राएलियों को आज्ञा दे कि वे फ़सह की विधि का पालन करें, जैसा तुझे आज्ञा दी गई है। उन्हें वर्ष-दर-वर्ष और दिन-प्रतिदिन, और अख़मीरी रोटी के पर्व के विषय में बताना कि वे सात दिन तक अख़मीरी रोटी खाएँ, उसका पर्व मनाएँ, और आनन्द के उन सात दिनों में दिन-प्रतिदिन उसका चढ़ावा चढ़ाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ጳስካ
  choice: फ़सह की विधि
  rationale: ‘ሥርዐት’ व्यवस्था/विधि और ‘ጳስካ’ पास्का अर्थात फ़सह को दर्शाता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘फ़सह’ स्पष्ट और परिचित है।
- source_word: በዓለ፡ ፍአት
  choice: अख़मीरी रोटी का पर्व
  rationale: पदबंध उस पर्व को सूचित करता है जिसमें बिना खमीर की रोटी खाई जाती है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘रोटी’ व्यक्त किया गया है।
- source_word: ቍርባኖ
  choice: उसका चढ़ावा
  rationale: यह अर्पित भेंट/बलि के सामान्य धार्मिक अर्थ वाला शब्द है; ‘चढ़ावा’ मूल की व्यापकता को बनाए रखता है।
- source_word: ፍሥሓ
  choice: आनन्द
  rationale: इसका अर्थ आनन्द, हर्ष या उल्लास है, ‘पर्व’ नहीं; इसलिए अंतिम वाक्यांश में मूल का आनन्द-संबंधी अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: फ़सह की आज्ञा का बाध्यकारी स्वर
  choice: ‘आज्ञा दे कि वे ... पालन करें’
  alternative: ‘उन्हें फ़सह मनाने को कह’
  rationale: मूल के आज्ञा और निर्धारित विधि—दोनों तत्व बनाए गए हैं, बिना बाद की किसी सम्प्रदायगत व्याख्या को जोड़ने के।
- issue: प्रतिदिन चढ़ाए जाने वाले अर्पण का स्वरूप
  choice: सामान्य शब्द ‘चढ़ावा’
  alternative: ‘बलिदान’
  rationale: मूल शब्द को किसी विशिष्ट प्रकार के बलिदान तक सीमित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत-पाठ के आरम्भिक शब्द ‘उसका नाम उसमें...’ पिछले पद का अवशिष्ट अंश प्रतीत होते हैं और उपलब्ध पद-विभाजन तथा परामर्श-पाठ के अनुसार 49:22 में शामिल नहीं किए गए। ‘वर्ष-प्रतिवर्ष और दिन-प्रतिदिन’ की असामान्य पुनरुक्ति मूल के कालगत बल को सुरक्षित रखने के लिए ज्यों की त्यों रखी गई है।
