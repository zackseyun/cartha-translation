  yaml_path: translation/extra_canonical/jubilees/049/018.yaml
  text: Thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land that they are to possess, in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD.
translation:
  language: hi
  text: इस प्रकार लिखा और ठहराया गया है कि वे उसे यहोवा के पवित्रस्थान में खाएँ। और जब इस्राएल की संतानें उस कनान देश में प्रवेश करें जिसे वे अपने अधिकार में लेने वाली हैं, तब वे देश के बीच, अपनी जनजातियों में से किसी एक के क्षेत्र में, यहोवा का तंबू स्थापित करें, जब तक कि देश में यहोवा का पवित्रस्थान न बन जाए। तब वे आकर यहोवा के तंबू के मध्य फसह मनाएँ और उसका वध यहोवा के सामने करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: लिखा और ठहराया गया है
  rationale: दोनों निष्क्रिय क्रियाओं के लिखित विधान और निर्धारित व्यवस्था वाले समानांतर भाव को सुरक्षित रखता है।
- source_word: ቤተ፡ መቅደሱ
  choice: पवित्रस्थान
  rationale: शाब्दिक रूप से पवित्रस्थान/मंदिर-गृह; आगे तंबू से इसके भेद को बनाए रखने के लिए सामान्य और गरिमापूर्ण बाइबलीय शब्द चुना गया।
- source_word: ውሉደ፡ እስራኤል
  choice: इस्राएल की संतान
  rationale: मूल के ‘इस्राएल के पुत्रों/संतानों’ को समावेशी और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ይእኅዙ
  choice: अपने अधिकार में लेने वाले हैं
  rationale: भूमि को पकड़ने, ग्रहण करने अथवा अधिकार में लेने के भाव को प्रसंगानुकूल व्यक्त करता है।
- source_word: ደብተራ፡ እግዚአብሔር
  choice: यहोवा का तंबू
  rationale: चलायमान पवित्र तंबू का संकेत है; इसे स्थायी पवित्रस्थान से अलग रखा गया है।
- source_word: አሐዱ፡ እምነ፡ ሠራዊቶሙ
  choice: अपनी किसी एक गोत्र-भूमि में
  rationale: पाठ का शाब्दिक रूप ‘उनके दलों/सेनाओं में से एक’ हो सकता है, पर साक्ष्य-परंपरा और स्थल-संदर्भ इसे इस्राएल के किसी एक जनजातीय क्षेत्र के अर्थ में समझाते हैं; ‘गोत्र-भूमि’ हिन्दी में स्थानगत अर्थ स्पष्ट करता है।
- source_word: ጳስካ
  choice: फसह
  rationale: पास्का/Passover के लिए प्रचलित हिन्दी बाइबलीय नाम।
- source_word: ይጠብኅዎ
  choice: उसे ... बलि करें
  rationale: क्रिया का मूल अर्थ वध करना है; फसह के धार्मिक प्रसंग में ‘बलि करें’ वध और अनुष्ठान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: तंबू और पवित्रस्थान का संबंध
  choice: ‘यहोवा का तंबू’ और ‘यहोवा का पवित्रस्थान’ अलग पदों के रूप में रखे गए
  alternative: दोनों को ‘मंदिर’ या दोनों को ‘पवित्रस्थान’ कहना
  rationale: मूल पाठ चलायमान तंबू को उस भावी निर्मित पवित्रस्थान से अलग करता है; इस ऐतिहासिक और धार्मिक तनाव को समतल नहीं किया गया।
- issue: फसह के पशु के वध की धार्मिक प्रकृति
  choice: ‘उसे यहोवा के सामने बलि करें’
  alternative: ‘उसे यहोवा के सामने काटें’
  rationale: प्रसंग अनुष्ठानिक है, इसलिए ‘बलि करें’ उपयुक्त है; फिर भी ‘उसे’ रखकर फसह-वस्तु के मूल संदर्भ को नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की विधिक-धार्मिक लय और अस्थायी तंबू से स्थायी पवित्रस्थान तक की कालगत संरचना सुरक्षित है।
