  text: at its appointed time, in every respect according to its command. And it shall not be lawful to eat it outside the sanctuary of the LORD, but before the sanctuary of the LORD, and all the people of the assembly
translation:
  language: hi
  text: उसके नियत समय पर, हर बात में उसकी आज्ञा के अनुसार। और उसे यहोवा के पवित्रस्थान के बाहर खाना वैध नहीं होगा, बल्कि यहोवा के पवित्रस्थान के सामने; और सभा के सभी लोग[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वाक्य यहाँ अगले पद में जारी रहता है।
    reason: पद-विभाजन के कारण अंतिम पदबंध स्वतंत्र हिन्दी वाक्य की तरह अधूरा दिखाई देता है; टिप्पणी मूल की अंतर-पदीय रचना स्पष्ट करती है।
lexical_decisions:
- source_word: በጊዜሁ
  choice: उसके ठहराए हुए समय पर
  rationale: प्रसंग में पर्व के नियत समय का बोध है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: በከመ፡ ትእዛዙ
  choice: उसकी आज्ञा के अनुसार
  rationale: मूल के आदेश/आज्ञा संबंधी पद को सीधे और गरिमापूर्ण ढंग से रखा गया है।
- source_word: ኢይከውን፡ ለበሊያቶ
  choice: उसे ... खाना उचित न होगा
  rationale: गीज़ की निषेधात्मक अभिव्यक्ति को विधिसम्मत निषेध के रूप में व्यक्त करता है, बिना अत्यधिक कानूनी शब्दावली के।
- source_word: በአንጻረ
  choice: के सामने
  rationale: स्थान-संबंधी अर्थ ‘सामने/सम्मुख’ है; ‘विपरीत’ यहाँ अनावश्यक भ्रम उत्पन्न कर सकता है।
- source_word: ኵሉ፡ ሕዝበ፡ ማኅበ[ር]
  choice: सभा के सभी लोग
  rationale: ሕዝበ को छोड़े बिना ‘assembly के people’ का अर्थ सुरक्षित रखा गया है; यह वाक्यांश अगले पद में आगे बढ़ने वाले कर्ता का आरंभ है।
theological_decisions:
- issue: पवित्रस्थान के बाहर खाने का निषेध
  choice: उसे यहोवा के पवित्रस्थान के बाहर खाना उचित न होगा
  alternative: उसे यहोवा के पवित्रस्थान के बाहर खाना वैध न होगा
  rationale: अर्थ में धार्मिक-विधिक निषेध बना रहता है, जबकि ‘उचित न होगा’ सामान्य आधुनिक हिन्दी में अधिक सहज है।
- issue: पद के अंत का अधूरा वाक्य-विन्यास
  choice: और सभा के सभी लोग
  alternative: सभा के सभी लोगों के साथ
  rationale: मूल का ‘और’ तथा ‘लोग’ सुरक्षित रखना आवश्यक है, क्योंकि यह वाक्यांश अगले पद के कर्ता का आरंभ प्रतीत होता है; इसे ‘के साथ’ करना मूल की अंतर-पदीय रचना को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘यहोवा’ और ‘पवित्रस्थान’ से धार्मिक संदर्भ स्पष्ट रखा गया है। अंतिम पदबंध को जानबूझकर पूर्ण वाक्य में नहीं बदला गया, क्योंकि वह अगले पद से व्याकरणिक रूप से जुड़ता है।
