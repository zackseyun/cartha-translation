revisions:
- from: जो प्रभु के नाम में पवित्र ठहराया गया है। वे अपने नगरों में या किसी भी स्थान पर फसह नहीं मना सकेंगे, सिवाय प्रभु के तम्बू के सामने, या उसके भवन के सामने जहाँ वह निवास करता है।
  to: जो प्रभु के नाम से पवित्र किया गया है। वे अपने नगरों में या किसी भी स्थान पर फसह का पालन नहीं कर सकेंगे, बल्कि केवल प्रभु के तंबू के सामने, अथवा उसके भवन के सामनेᵃ, जहाँ वह निवास करता है।
  rationale: 'The revision preserves the source’s incomplete opening clause and its stated alternatives: Passover is not to be observed in their cities or elsewhere, but only before the LORD’s tent or, otherwise, before his dwelling-house. It improves Hindi idiom, uses the standard spelling ‘तंबू,’ and supplies a narrowly framed textual-audit note for the alternative final coordination.'
