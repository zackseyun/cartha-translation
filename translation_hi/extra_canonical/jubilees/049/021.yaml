  text: that has been sanctified in the name of the LORD. And they shall not be able to observe the Passover in their cities, nor in any place except before the tent of the LORD, or before his house where he dwells.
translation:
  language: hi
  text: जो प्रभु के नाम से पवित्र किया गया है। वे अपने नगरों में या किसी भी स्थान पर फसह का पालन नहीं कर सकेंगे, बल्कि केवल प्रभु के तंबू के सामने, अथवा उसके भवन के सामनेᵃ, जहाँ वह निवास करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘተቀደሰ፡ በስመ፡ እግዚአብሔር
  choice: जो प्रभु के नाम में पवित्र ठहराया गया है
  rationale: सम्बन्धवाचक संरचना और कर्मवाच्य अर्थ को बनाए रखा गया; በስመ का निकट रूप ‘के नाम में’ है।
- source_word: ገቢረ፡ ጳስካ
  choice: फसह मनाना
  rationale: शाब्दिक ‘फसह करना’ के बजाय हिन्दी में पर्व के पालन के लिए स्वाभाविक अभिव्यक्ति चुनी गई।
- source_word: በአህጉሪሆሙ
  choice: अपने नगरों में
  rationale: बहुवचन और स्वत्व दोनों सुरक्षित रखे गए।
- source_word: በቅድመ፡ ደብተራ፡ እግዚአብሔር
  choice: प्रभु के तम्बू के सामने
  rationale: ደብተራ को उपासना-तम्बू के अर्थ में ‘तम्बू’ और በቅድመ को ‘के सामने’ अनूदित किया गया।
- source_word: ኀበ፡ ኀደረ
  choice: जहाँ वह निवास करता है
  rationale: स्थानवाचक उपवाक्य और ईश्वर के निवास करने के प्रत्यक्ष कथन को बिना ‘नाम’ जोड़ने के सुरक्षित रखा गया।
theological_decisions:
- issue: तम्बू और भवन के बीच सम्बन्ध
  choice: या उसके भवन के सामने
  alternative: और उसके भवन के सामने
  rationale: ወአመ፡ አኮ का मुहावरेदार अर्थ ‘और यदि नहीं/अन्यथा’, अर्थात विकल्पसूचक ‘या’ है; इससे पाठ में दिए दो वैकल्पिक पवित्र स्थलों का तनाव बना रहता है।
- issue: अंतिम उपवाक्य का कर्ता
  choice: जहाँ वह निवास करता है
  alternative: जहाँ उसका नाम निवास करता है
  rationale: स्रोत में ‘नाम’ अंतिम उपवाक्य में नहीं है; इसलिए उसे धर्मशास्त्रीय सामंजस्य हेतु नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज धार्मिक गद्य। ‘प्रभु’ और ‘फसह’ प्रचलित बाइबलीय शब्द हैं। आरम्भिक सम्बन्धवाचक अंश पूर्ववर्ती पद से जुड़ा हुआ प्रतीत होता है, इसलिए उसकी खंडात्मक प्रकृति को स्रोत के अनुरूप बनाए रखा गया है।
