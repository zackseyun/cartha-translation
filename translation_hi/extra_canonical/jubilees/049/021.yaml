review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the fragmentary opening, the passive sense of sanctification, the prohibition on observing Passover locally, and the alternative expressed by Geʽez wa-'ama 'ako ('or/otherwise'). The final clause properly refers to God himself dwelling there, not to his name. A small revision improves the rendering of 'in the name of' and the idiom for observing Passover.
  naturalness: ‘प्रभु के नाम में पवित्र ठहराया गया’ is understandable but less idiomatic than ‘प्रभु के नाम से पवित्र किया गया.’ ‘फसह का पालन’ is clear, formal modern Hindi for ritual observance, and ‘केवल ... के सामने’ avoids the somewhat heavy construction ‘सिवाय ... के सामने.’
  terminology: ‘प्रभु,’ ‘फसह,’ and ‘तंबू’ are appropriate established biblical terms. ‘भवन’ suitably renders ‘house’ without prematurely specifying a later technical designation.
  issues:
  - severity: low
    issue: The phrase ‘प्रभु के नाम में पवित्र ठहराया गया’ is slightly literal and unnatural in Hindi.
    rationale: For the source expression meaning ‘sanctified in/by the name of the LORD,’ ‘प्रभु के नाम से पवित्र किया गया’ is more natural while retaining the intended relation to the divine name.
  - severity: low
    issue: The audit-trail alternative for the final coordination is not represented in Hindi footnotes.
    rationale: The main text should retain ‘अथवा,’ since the source idiom supports an alternative. A brief note records the prior ‘और’ rendering without displacing the source-preferred reading.
  revised_text: जो प्रभु के नाम से पवित्र किया गया है। वे अपने नगरों में या किसी भी स्थान पर फसह का पालन नहीं कर सकेंगे, बल्कि केवल प्रभु के तंबू के सामने, अथवा उसके भवन के सामनेᵃ, जहाँ वह निवास करता है।
  revised_footnotes:
  - marker: ᵃ
    text: या, “और उसके भवन के सामने।”
    reason: Geʽez ‘और यदि नहीं/अन्यथा’ here functions idiomatically as an alternative (‘अथवा’); the note records the alternative coordination reflected in an earlier rendering.
  revision_rationale: 'The revision preserves the source’s incomplete opening clause and its stated alternatives: Passover is not to be observed in their cities or elsewhere, but only before the LORD’s tent or, otherwise, before his dwelling-house. It improves Hindi idiom, uses the standard spelling ‘तंबू,’ and supplies a narrowly framed textual-audit note for the alternative final coordination.'
