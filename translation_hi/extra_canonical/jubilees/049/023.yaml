  text: before the LORD, upon the altar of your God. For you observed this feast in haste when you came out from Egypt until you entered the wilderness of Shur, because at the shore of the sea you completed it.
translation:
  language: hi
  text: प्रभु के सामने, अपने परमेश्वर की वेदी पर। क्योंकि जब तुम मिस्र से निकले थे, तब से लेकर शूर के निर्जन प्रदेश में प्रवेश करने तक तुमने यह पर्व जल्दबाज़ी में मनाया, क्योंकि समुद्र के किनारे तुमने इसे पूरा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यह पद परमेश्वर के विशिष्ट नाम के लिए प्रयुक्त पारंपरिक गीइज़ पद है; हिन्दी बाइबल की परिचित शैली में ‘यहोवा’ स्पष्ट और स्वाभाविक है।
- source_word: በዓለ
  choice: पर्व
  rationale: यह शब्द धार्मिक उत्सव या पर्व को दर्शाता है; प्रसंग में फसह के पालन की बात है।
- source_word: በውልዋሌ
  choice: शीघ्रता से
  rationale: मूल में जल्दबाज़ी अथवा उतावली का भाव है; ‘शीघ्रता से’ उस भाव को dignified और सहज हिन्दी में रखता है।
- source_word: ገዳመ፡ ሱር
  choice: शूर का निर्जन प्रदेश
  rationale: ገዳም निर्जन अथवा मरुस्थलीय भूभाग को सूचित करता है; ‘निर्जन प्रदेश’ आधुनिक पाठक के लिए ‘जंगल’ से अधिक भौगोलिक रूप से स्पष्ट है।
- source_word: ሰበጥክምዋ
  choice: तुमने इसे पूरा किया
  rationale: क्रिया यहाँ पर्व के पालन को समाप्त या पूर्ण करने का भाव देती है; स्रोत की अभिव्यक्ति को बिना अतिरिक्त व्याख्या के बनाए रखा गया है।
theological_decisions:
- issue: दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: गीइज़ እግዚአብሔር सामान्यतः ‘प्रभु’ भी हो सकता है, पर इस सूत्रात्मक वाचा-संबंधी प्रसंग में हिन्दी बाइबल की परिचित परंपरा के अनुरूप ‘यहोवा’ चुना गया; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
- issue: समुद्र के किनारे पर्व को ‘पूरा करने’ का आशय
  choice: शाब्दिक तनाव को बनाए रखते हुए ‘पूरा किया’
  alternative: ‘उसका पालन समाप्त किया’ या ऐतिहासिक घटना की व्याख्या जोड़ना
  rationale: स्रोत संक्षेप में पूर्ण करने की बात कहता है और उसका सटीक अनुष्ठानिक आशय स्पष्ट नहीं करता; अतः अस्पष्टता को व्याख्यात्मक विस्तार से नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य की निरंतरता में आरम्भ होता है, इसलिए आरम्भिक खंड की अपूर्ण-वाक्य संरचना सुरक्षित रखी गई है।
