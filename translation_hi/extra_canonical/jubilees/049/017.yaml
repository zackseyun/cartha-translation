  text: All of Israel shall observe it at its appointed time. And every man who comes on that day shall eat it in the house of the sanctuary of your God before the LORD, from twenty years old and upward, because
translation:
  language: hi
  text: सारा इस्राएल इसे उसके नियत समय पर मनाए। और उस दिन आने वाला हर पुरुष, जो बीस वर्ष का या उससे अधिक आयु का हो, तुम्हारे परमेश्वर के पवित्रस्थान के भवन में, यहोवा के सामने, इसे खाए, क्योंकि…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त मूल पाठ इस पद के अंत में ‘क्योंकि’ पर रुक जाता है; कारण आगे जारी होता है।
    reason: पाठ के अधूरे वाक्य को पाठक के लिए स्पष्ट करते हुए स्रोत की पद-सीमा सुरक्षित रखना।
lexical_decisions:
- source_word: እስራኤል
  choice: सारा इस्राएल
  rationale: सामूहिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पूरे इस्राएल की ओर संकेत बनाए रखता है।
- source_word: ይገበርዎ
  choice: इसे … मनाए
  rationale: शाब्दिक अर्थ ‘इसे करे’ है; पर्व/विधि के प्रसंग में ‘मनाए’ अधिक स्वाभाविक है और पालन का भाव देता है।
- source_word: በጊዜሁ
  choice: इसके ठहराए हुए समय पर
  rationale: निर्धारित समय का प्रसंगगत अर्थ स्पष्ट करता है, बिना समय को किसी विशेष तिथि के रूप में सीमित किए।
- source_word: ኵሉ ሰብእ
  choice: हर पुरुष
  rationale: स्रोत का पुरुष-वाचक पद बनाए रखा गया है; इसे व्यापक ‘हर व्यक्ति’ बनाकर संभावित आयु-लिंग संबंधी विधान को धुंधला नहीं किया गया।
- source_word: በቤተ መቅደሱ
  choice: पवित्रस्थान के भवन में
  rationale: ‘घर/भवन’ और ‘पवित्रस्थान’ दोनों तत्वों को बनाए रखता है; केवल ‘पवित्रस्थान में’ कहने से स्रोत की संयुक्त अभिव्यक्ति संक्षिप्त हो जाती।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: इस विशिष्ट ईश्वरीय नाम को सामान्य उपाधि ‘प्रभु’ से अलग रखते हुए प्रचलित हिन्दी बाइबलीय रूप में दिया गया है।
- source_word: ዘእም፳ዓመት ወላዕለ
  choice: बीस वर्ष की आयु से लेकर उससे अधिक आयु वाले
  rationale: ‘बीस वर्ष से और ऊपर’ का स्वाभाविक तथा स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: आयु-सीमा किस क्रिया या समूह पर लागू होती है
  choice: वाक्य में इसे खाने वाले ‘हर पुरुष’ के साथ निकट रखा गया
  alternative: इसे पूरे इस्राएल द्वारा पर्व मनाने की पहली आज्ञा से जोड़ना
  rationale: स्रोत में आयु-वाक्यांश खाने की आज्ञा के बाद आता है; विरामचिह्न संभावित संबंध दिखाता है, पर अतिरिक्त धर्मवैधानिक व्याख्या नहीं जोड़ता।
- issue: अंतिम कारणसूचक पद का अधूरापन
  choice: ‘क्योंकि…’ के रूप में खुला छोड़ा गया
  alternative: अगले पद से अनुमानित कारण जोड़कर वाक्य पूरा करना
  rationale: प्रदत्त स्रोत इसी कारणसूचक शब्द पर समाप्त होता है; अनुमान से कथन पूरा करना स्रोत की साहित्यिक सीमा और तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। ‘मनाए’, ‘पवित्रस्थान’ और ‘यहोवा के सामने’ जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य को सहज बनाने के लिए आयु-सीमा को डैशों के बीच रखा गया है।
