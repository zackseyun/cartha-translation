  language: hi
  text: 'रात में, पंद्रहवें दिन की संध्या को, सूर्यास्त से। क्योंकि इसी रात पर्व का आरम्भ हुआ और आनन्द का आरम्भ हुआ। तुम मिस्र में रहते हुए फसह का मांस खा रहे थे, जबकि मस्तेमा की सारी शक्तियाँ मिस्र देश के सब पहलौठों को मार डालने के लिए भेजी गई थीं—फ़िरौन के पहलौठे से लेकर चक्कीघर में रहनेवाली बंदिनी दासी के पहलौठे तक, और पशुओं के पहलौठों को भी।


    यहोवा ने उन्हें यह चिह्न दिया था: जिस-जिस घर के द्वार के खम्भों पर वे एक वर्ष के मेमने का लहू देखें, उस घर में मार डालने के लिए प्रवेश न करें, बल्कि उसके आगे से निकल जाएँ, ताकि घर के भीतर के सभी लोग बच जाएँ, क्योंकि उसके द्वार के खम्भों पर लहू का चिह्न था। यहोवा की शक्तियों ने ठीक वैसा ही किया जैसा यहोवा ने उन्हें आज्ञा दी थी। वे इस्राएल की सभी सन्तानों के आगे से निकल गईं, और उन्हें नाश करने के लिए उन पर कोई विपत्ति नहीं आई; पशुओं से लेकर मनुष्यों तक, यहाँ तक कि कुत्तों तक, किसी का भी प्राण नहीं गया।


    मिस्र में विपत्ति बहुत बड़ी थी। मिस्र में ऐसा कोई घर नहीं था जहाँ कोई मरा न हो और जहाँ रोना और विलाप न हो रहा हो। परन्तु समस्त इस्राएल फसह का मांस खा रहा था, दाखमधु पी रहा था, और अपने पूर्वजों के परमेश्वर यहोवा की स्तुति, बड़ाई और धन्यवाद कर रहा था। वे मिस्र के जुए और दुष्ट दासता से निकलने के लिए तैयार थे।


    तुम भी अपने जीवन भर इस दिन को स्मरण रखना। अपने जीवन के सभी दिनों में, वर्ष-प्रतिवर्ष, हर वर्ष एक बार, उसके नियत दिन पर, उसकी पूरी व्यवस्था के अनुसार इसे मनाना। उस दिन को किसी दूसरे दिन या उस महीने को किसी दूसरे महीने में न खिसकाना। क्योंकि यह सदा की विधि है। स्वर्गीय पट्टियों पर इस्राएल की सभी सन्तानों के लिए यह लिखी और ठहराई गई है कि वे अपनी सभी पीढ़ियों में हर वर्ष, वर्ष में एक बार, उसके नियत दिन पर इसे मनाएँ। इसके दिनों का कोई अन्त नहीं, क्योंकि यह सदा के लिए ठहराई गई विधि है।


    जो मनुष्य शुद्ध होकर उसके नियत दिन पर इसे मनाने, यहोवा के सामने स्वीकारयोग्य भेंट चढ़ाने और पर्व के दिन यहोवा के सामने खाने-पीने के लिए आए, वह ऐसा करे। परन्तु जो मनुष्य शुद्ध और निकट होते हुए भी यहोवा की भेंट उसके नियत समय पर नहीं चढ़ाता, वह काट दिया जाएगा; वह मनुष्य अपने पाप का भार उठाएगा।


    इसलिए इस्राएल की सन्तानें पहले महीने के चौदहवें दिन, दोनों संध्याओं के बीच, उसके नियत समय पर फसह मनाएँ। दिन के मध्य से रात के तीसरे भाग तक[a] इसे मनाएँ; क्योंकि दिन के दो भाग उजाले को दिए गए हैं और तीसरा भाग संध्या का है। यही वह समय है जिसमें यहोवा ने तुम्हें संध्या के मध्य फसह मनाने की आज्ञा दी है।


    उसका वध उजाले के किसी समय न किया जाए, केवल संध्या के समय ही किया जाए। वे उसे संध्या के समय से रात के तीसरे भाग तक खाएँ। रात के तीसरे भाग के बाद उसके मांस में से जो कुछ बच जाए, उसे आग में जला दें। वे उसे कच्चा न खाएँ और न पानी में उबालकर खाएँ, बल्कि आग में भूनकर खाएँ। उसके सिर, भीतरी अंगों और पैरों समेत उसे आग में भूनें। उसकी एक भी हड्डी न तोड़ें, क्योंकि इस्राएल की सन्तानों को उसकी कोई हड्डी नहीं तोड़नी है।


    इसी कारण यहोवा ने इस्राएल की सन्तानों को आज्ञा दी कि वे फसह को उसके नियत समय पर मनाएँ और उसकी कोई हड्डी न तोड़ें। क्योंकि यह पर्व का दिन और आज्ञा से ठहराया हुआ दिन है। वे इसे एक दिन से दूसरे दिन या एक महीने से दूसरे महीने में न खिसकाएँ, बल्कि पर्व के नियत दिन पर ही मनाएँ।


