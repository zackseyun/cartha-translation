  text: But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.
translation:
  language: hi
  text: परन्तु तू, मेरे पुत्र याकूब, परमप्रधान परमेश्वर तेरी सहायता करे; और स्वर्ग का परमेश्वर तुझे आशीष दे और तुझे उनकी अशुद्धता और उनकी सारी भूल से दूर करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልዑል
  choice: परमप्रधान
  rationale: यह उपाधि ‘सर्वोच्च/परमप्रधान’ का भाव रखती है और हिन्दी के गरिमापूर्ण बाइबलीय प्रयोग में स्वाभाविक है।
- source_word: ይርዳእከ
  choice: तेरी सहायता करे
  rationale: गीज़ क्रिया के प्रार्थनात्मक/कामनार्थक भाव को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይባርከ
  choice: तुझे आशीष दे
  rationale: मूल के आशीर्वाद देने के कामनार्थक भाव को सुरक्षित रखता है।
- source_word: ወያግኅሥከ
  choice: और तुझे … से अलग रखे
  rationale: संदर्भ में किसी को अशुद्धता और भटकन से हटाने अथवा दूर रखने का भाव है; ‘अलग रखे’ सहज हिन्दी में दोनों पहलुओं को समेटता है।
- source_word: ርእዮሙ
  choice: उनकी अशुद्धता
  rationale: प्राप्त पाठ और परामर्श-अनुवाद के अनुसार नैतिक/अनुष्ठानिक अशुद्धता का अर्थ लिया गया है।
- source_word: ስሕተቶሙ
  choice: उनकी सारी भटकन
  rationale: यह शब्द भूल, त्रुटि या पथभ्रष्टता का भाव दे सकता है; ‘भटकन’ नैतिक-धार्मिक संदर्भ में अर्थ की व्यापकता बनाए रखता है।
theological_decisions:
- issue: ‘परमप्रधान परमेश्वर’ और ‘स्वर्ग का परमेश्वर’ का संबंध
  choice: दोनों उपाधियों को मूल के समान समानांतर रखा गया
  alternative: दोनों को एक ही संयुक्त उपाधि में मिला देना
  rationale: मूल पाठ की दोहरी ईश्वरीय संबोधन-रचना और उसका काव्यात्मक बल सुरक्षित रहना चाहिए।
- issue: अशुद्धता और भटकन से मुक्ति का स्वरूप
  choice: ‘अलग रखे’
  alternative: ‘दूर कर दे’ या ‘निकाल ले’
  rationale: यह चयन व्यक्ति को उनसे दूर किए जाने और आगे उनसे बचाए रखे जाने—दोनों संभावित अर्थों को बिना अनावश्यक सिद्धान्तीकरण के खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली अपनाई गई है। ‘परन्तु हे मेरे पुत्र याकूब’ संबोधन मूल की आत्मीयता और औपचारिक आशीर्वचन दोनों को बनाए रखता है।
