base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/015.yaml
  text: May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your offspring for all generations and forever.
translation:
  language: hi
  text: परमप्रधान परमेश्वर तुम्हें वे सभी आशीषें दें, जिनसे उन्होंने मुझे आशीष दी और जिनसे उन्होंने नूह और आदम को आशीष दी। वे तुम्हारी संतान के पवित्र सिर पर सभी पीढ़ियों तक[a] और सदा के लिए बनी रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर पीढ़ी से अगली पीढ़ी तक’।
    reason: पीढ़ी-संबंधी मूल पदावली का वैकल्पिक मुहावरेदार अर्थ दिखाता है, जबकि मुख्य पाठ में ‘सभी’ का स्पष्ट भाव सुरक्षित है।
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: परमप्रधान परमेश्वर
  rationale: ईश्वर के लिए प्रयुक्त पदवी का अर्थ और गरिमामय बाइबलीय शैली दोनों सुरक्षित रहते हैं।
- source_word: በረከታተ
  choice: आशीषें
  rationale: बहुवचन रूप और धार्मिक संदर्भ में वरदान/कल्याण का भाव स्पष्ट करता है।
- source_word: ዘርእከ
  choice: तुम्हारी संतान
  rationale: मूल का सामूहिक वंशगत अर्थ व्यक्त करता है; ‘बीज’ की अत्यधिक शाब्दिक और अप्राकृतिक अभिव्यक्ति से बचता है।
- source_word: ድማኅ፡ ቅዱስ
  choice: पवित्र सिर
  rationale: मूल के ठोस रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ለኵሉ፡ ትውልደ፡ ትውልድ
  choice: सभी पीढ़ियों तक
  rationale: ‘सभी’ के स्पष्ट परिमाण को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ወእስከ፡ ለዓለም
  choice: और सदा के लिए
  rationale: स्थायी, अनंत कालगत विस्तार को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आशीष देने वाले के लिए सर्वनाम
  choice: उन्होंने
  alternative: उसने
  rationale: आधुनिक मानक हिन्दी में परमेश्वर के प्रति आदरसूचक प्रयोग स्वाभाविक है और मूल के अर्थ में कोई संप्रदायगत तत्व नहीं जोड़ता।
- issue: आशीषों का संतान के ‘पवित्र सिर’ पर ठहरना
  choice: मूल रूपक को यथावत रखा गया
  alternative: आशीषें तुम्हारी पवित्र संतान पर बनी रहें
  rationale: ‘सिर’ हटाने से मूल की देहात्मक और संभवतः प्रतिनिधिक छवि लुप्त हो जाती; इसलिए अस्पष्टता और धार्मिक तनाव सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास मूल की दो आशीर्वादात्मक कामनाओं को बनाए रखता है; ‘संतान के पवित्र सिर’ जैसी विशिष्ट छवि को सरल बनाकर मिटाया नहीं गया।
