base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/010.yaml
  text: My God, may your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.
translation:
  language: hi
  text: हे मेरे परमेश्वर, तेरी करुणा और तेरी शान्ति तेरे सेवक पर और उसके पुत्रों की संतति पर बनी रहे, ताकि वे तेरे लिए चुनी हुई प्रजा और पृथ्वी की सब जातियों में से एक विरासत हों—अब से पृथ्वी की पीढ़ियों के सारे दिनों तक, युगानुयुग।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላኪየ
  choice: हे मेरे परमेश्वर
  rationale: यह संबोधन स्पष्ट रूप से ‘मेरे परमेश्वर’ है; ‘हे’ हिन्दी में प्रार्थनात्मक संबोधन को स्वाभाविक बनाता है।
- source_word: ሣህልከ
  choice: तेरी करुणा
  rationale: यहाँ दया/अनुग्रह के अर्थक्षेत्र वाला शब्द है; ‘करुणा’ प्रार्थना के गरिमापूर्ण और सुबोध भाव को रखता है।
- source_word: ዘርአ፡ ውሉዱ
  choice: उसके पुत्रों के वंश
  rationale: मूल की ‘उसके पुत्रों का बीज/वंश’ संरचना को प्राकृतिक हिन्दी में रखा गया है।
- source_word: ሕዝበ፡ ኅሩየ
  choice: चुने हुए लोग
  rationale: सामूहिक ‘चुनी हुई प्रजा/लोग’ का अर्थ है; आधुनिक सामान्य हिन्दी के लिए ‘लोग’ अधिक सहज है।
- source_word: ወርስተ
  choice: तेरी विरासत
  rationale: स्रोत में विरासत/उत्तराधिकार-भाग का भाव है; निहित संबंध को हिन्दी में स्पष्ट करने के लिए ‘तेरी’ जोड़ा गया है।
- source_word: ለኵሉ፡ ዓለማት
  choice: युगानुयुग
  rationale: शाब्दिक ‘सब युगों के लिए’ का स्वाभाविक, गरिमापूर्ण हिन्दी समतुल्य।
theological_decisions:
- issue: चुने हुए समुदाय और विरासत का संबंध
  choice: ‘वे तेरे लिए चुने हुए लोग ... तेरी विरासत हों’
  alternative: ‘वह तेरे लिए एक चुनी हुई प्रजा और विरासत हो’
  rationale: ‘वंश’ सामूहिक है; बहुवचन ‘वे’ सामान्य हिन्दी में उसके मानवीय समुदाय-संदर्भ को स्पष्ट करता है, जबकि चुनाव और विरासत दोनों को उसी समुदाय से संबद्ध रखता है।
- issue: जातियों के बीच से चुनाव
  choice: ‘पृथ्वी की सब जातियों में से’
  alternative: ‘पृथ्वी की सब जातियों से बढ़कर’
  rationale: मूल का पूर्वसर्ग अलग किए जाने/बीच में से लिए जाने का भाव देता है; श्रेष्ठता का भाव जोड़ना स्रोत से आगे जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण शैली रखी गई है। ईश्वर के लिए एकवचन आत्मीय ‘तेरा’ रूप मूल के द्वितीय पुरुष एकवचन के अनुरूप है। वाक्य की दीर्घकालिक समापन-लय को डैश और ‘युगानुयुग’ द्वारा स्वाभाविक बनाया गया है।
