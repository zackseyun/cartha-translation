  yaml_path: translation/extra_canonical/jubilees/022/023.yaml
  text: For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes, on the day of judgment.
translation:
  language: hi
  text: क्योंकि हाम के अपराध के कारण कनान भटक गया, और उसका सारा वंश पृथ्वी पर से मिटा दिया जाएगा; न्याय के दिन उसके वंश में कोई अवशेष न रहेगा, न कोई बच निकलेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ
  choice: अपराध
  rationale: यह शब्द दोष, अपराध या उल्लंघन का भाव देता है; यहाँ ‘अपराध’ सहज और संदर्भानुकूल है।
- source_word: ስሕተ
  choice: भटक गया
  rationale: क्रिया भूल करने, चूकने या मार्ग से भटकने का अर्थ दे सकती है; स्रोत की संभावित नैतिक अस्पष्टता बनाए रखने के लिए ‘भटक गया’ चुना गया।
- source_word: ዘርአ
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर वंशजों के सामूहिक अर्थ में आधुनिक हिन्दी का स्वाभाविक शब्द ‘वंश’ है।
- source_word: ይደመሰስ
  choice: मिटा दिया जाएगा
  rationale: विनाश या पूर्णतः मिटाए जाने का भाव व्यक्त करता है और निष्क्रिय भविष्यकाल को सुरक्षित रखता है।
- source_word: ደይን
  choice: न्याय
  rationale: न्याय अथवा न्यायिक निर्णय का अर्थ; अंतिम वाक्यांश में ‘न्याय का दिन’ का स्वाभाविक हिन्दी रूप प्रयुक्त है।
theological_decisions:
- issue: हाम के अपराध और कनान के भटकने का संबंध
  choice: ‘हाम के अपराध के कारण कनान भटक गया’ के रूप में सीधा कारण-संबंध रखा गया।
  alternative: वाक्य को इस प्रकार समझना कि कनान का भटकना स्वयं हाम के अपराध का विवरण है।
  rationale: गीज़ पाठ और परामर्श-पाठ दोनों अलग संज्ञा और क्रिया के साथ कारण-संबंध प्रस्तुत करते हैं; इसे बिना व्याख्यात्मक समानीकरण के बनाए रखा गया।
- issue: अंतिम विनाश की व्यापकता
  choice: ‘कोई अवशेष न बचेगा, न कोई उससे बच निकलेगा’ द्वारा पूर्णता का कथन सुरक्षित रखा गया।
  alternative: इसे केवल सामान्य राष्ट्रीय पराजय या सीमित ऐतिहासिक विनाश के रूप में नरम करना।
  rationale: स्रोत स्पष्ट रूप से अवशेष और बच निकलने वाले दोनों का निषेध करता है तथा इसे न्याय के दिन से जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘पर से’ के प्रयोग से पृथ्वी से पूर्णतः मिटाए जाने का भाव स्वाभाविक रूप में व्यक्त किया गया है।
