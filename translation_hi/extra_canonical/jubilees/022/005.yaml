  yaml_path: translation/extra_canonical/jubilees/022/005.yaml
  text: And he brought a peace offering and made a great feast of rejoicing before Ishmael his brother. And Rebekah made fresh cakes from new grain and gave them to Jacob her son[5], so that he might bring them to Abraham, his father, from the firstfruits of the land, that he might eat and bless the Creator of all before he died.
translation:
  language: hi
  text: और उसने मेलबलि लाई और अपने भाई इश्माएल के सामने बड़ा आनंद-भोज आयोजित किया। रिबका ने नए अनाज से ताज़े पकवान बनाए और उन्हें अपने पुत्र याकूब को दिया, ताकि वह उन्हें भूमि की पहली उपज के रूप में अपने पिता अब्राहम[a] के पास ले जाए, जिससे अब्राहम उन्हें खाए और मरने से पहले सबके सृष्टिकर्ता को धन्य कहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में शाब्दिक रूप से “अपने पिता अब्राहम” है; वंशावली के अनुसार अब्राहम याकूब के दादा थे। यहाँ “पिता” शब्द पूर्वज के अर्थ में भी हो सकता है।
    reason: kinship_ambiguity
lexical_decisions:
- source_word: መድኃኒተ
  choice: मेलबलि
  rationale: प्रसंग में यह बलिदान/भेंट के अर्थ में है; उपलब्ध पाठ-साक्ष्य और परामर्श-पाठ के अनुसार इसे शांति या मेल की बलि के रूप में व्यक्त किया गया है।
- source_word: ፍሥሓ
  choice: आनंद
  rationale: यह हर्ष या उल्लास को सूचित करता है; ‘बड़े आनंद का भोज’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उत्सवी भाव बनाए रखता है।
- source_word: ጻፍንተ ሐዳሰ እምስርናይ ኅዲስ
  choice: नए अनाज से ताज़ी रोटियाँ
  rationale: शब्दसमूह नई उपज/नए अनाज से बने ताज़े पके खाद्य को दर्शाता है; ‘रोटियाँ’ साधारण हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ቀዳሚ ፍሬ ምድር
  choice: भूमि की पहली उपज
  rationale: यह भूमि के प्रथम फल या प्रथम उपज का सीधा अर्थ सुरक्षित रखता है और किसी विशिष्ट पर्व की पहचान पाठ में नहीं जोड़ता।
- source_word: ይባርከ
  choice: धन्य कहे
  rationale: सृष्टिकर्ता को संबोधित क्रिया के लिए ‘धन्य कहे’ उपासना और स्तुति का भाव स्पष्ट करती है; ‘आशीर्वाद दे’ की संभावित आधुनिक भ्रांति से बचाती है।
theological_decisions:
- issue: अब्राहम के लिए አቡሁ का संबंध-सूचक अर्थ
  choice: अपने पिता अब्राहम
  alternative: अपने दादा अब्राहम
  rationale: मूल पाठ शाब्दिक रूप से ‘उसका/अपने पिता’ कहता है। यद्यपि वंशावली में अब्राहम याकूब के दादा हैं, प्राचीन धार्मिक भाषा में ‘पिता’ पूर्वज के लिए भी प्रयुक्त हो सकता है। मुख्य पाठ मूल की अभिव्यक्ति रखता है और फुटनोट जैविक संबंध स्पष्ट करता है।
- issue: प्रथम उपज और सप्ताहों के पर्व का संबंध
  choice: केवल ‘भूमि की पहली उपज’
  alternative: इसे सप्ताहों के पर्व का भोज बताना
  rationale: इस पद के उपलब्ध गीइज़ पाठ में पर्व का स्पष्ट नाम नहीं है; इसलिए संभावित पर्व-पहचान को मुख्य पाठ या टिप्पणी में निश्चित तथ्य के रूप में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। लंबे मूल वाक्य को अर्थ-संबंध सुरक्षित रखते हुए स्वाभाविक हिन्दी में व्यवस्थित किया गया है। ‘सबके सृष्टिकर्ता’ मूल की व्यापक उपाधि को बिना सांप्रदायिक विस्तार के बनाए रखता है।
