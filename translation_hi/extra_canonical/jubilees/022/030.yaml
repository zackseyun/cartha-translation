  yaml_path: translation/extra_canonical/jubilees/022/030.yaml
  text: And he blessed Jacob and said[30], “My son, in whom with all my heart and all my affection I rejoice, may Your grace and Your mercy rest upon him and upon his seed always.”
translation:
  language: hi
  text: उसने याकूब को आशीर्वाद दिया और कहा, “हे मेरे पुत्र, जिसमें मैं अपने पूरे हृदय और सारे स्नेह से आनन्दित होता हूँ, तेरा अनुग्रह और तेरी दया उस पर और उसके वंश पर सदा बनी रहें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल पाठ में संबोधन असहज ढंग से दूसरे पुरुष (“तेरा अनुग्रह”) से तीसरे पुरुष (“उस पर”) में बदल जाता है। यह परमेश्वर की ओर मुड़कर किया गया संबोधन हो सकता है: “आपका अनुग्रह और आपकी दया उस पर … बनी रहें।” कुछ पुराने अनुवाद इस व्याकरणिक तनाव को सहज बनाकर “मेरा अनुग्रह और मेरी दया” करते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: ምሕረትየ
  choice: मेरा सारा स्नेह
  rationale: यहाँ प्रथम-पुरुष प्रत्यय वक्ता के स्नेह/ममता को व्यक्त करता है; प्रसंग में ‘स्नेह’ आधुनिक हिन्दी में स्वाभाविक है और बाद में आने वाली ‘दया’ से अनावश्यक शब्दगत टकराव से बचाता है।
- source_word: ሣህለከ፡ ወምሕረትከ
  choice: तेरा अनुग्रह और तेरी दया
  rationale: दोनों शब्दों पर द्वितीय-पुरुष एकवचन पुल्लिंग प्रत्यय -ከ है; इसलिए स्रोत के असहज व्यक्ति-परिवर्तन को ‘मेरा’ करके सुधारा नहीं गया।
- source_word: ዘርኡ
  choice: उसके वंश
  rationale: ‘बीज’ के वंशगत अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ኵሎ፡ መዋዕለ
  choice: सदा
  rationale: शाब्दिक अर्थ ‘सभी दिन’ है; ‘सदा’ उसी कालगत व्यापकता को सहज हिन्दी में देता है।
theological_decisions:
- issue: ‘तेरा अनुग्रह’ में संबोधित व्यक्ति की पहचान
  choice: द्वितीय पुरुष ‘तेरा’ को मुख्य पाठ में बनाए रखा
  alternative: इसे परमेश्वर से प्रार्थना मानकर ‘आपका अनुग्रह’, अथवा व्याकरण सहज करने के लिए ‘मेरा अनुग्रह’
  rationale: गीज़ पाठ में द्वितीय-पुरुष प्रत्यय स्पष्ट है, पर वाक्य तुरंत तीसरे पुरुष ‘उस पर’ में चला जाता है। मुख्य पाठ इस तनाव को सुरक्षित रखता है और पादटिप्पणी संभावित प्रार्थनात्मक संबोधन बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आनन्दित होता हूँ’ आशीर्वचन की औपचारिकता बनाए रखता है। स्रोत में मौजूद व्यक्ति-परिवर्तन को मुख्य पाठ में जानबूझकर सामान्यीकृत नहीं किया गया।
