  yaml_path: translation/extra_canonical/jubilees/022/026.yaml
  text: This house I have built for myself[26], to put my name upon it on the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, because you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”
translation:
  language: hi
  text: “यह घर मैंने अपने लिए बनाया है[a], ताकि मैं पृथ्वी पर इस पर अपना नाम स्थापित करूँ। यह तुझे और तेरे वंश को सदा के लिए दिया गया है, और यह ‘अब्राहम का घर’ कहलाएगा। यह तुझे और तेरे वंश को सदा के लिए दिया गया है, क्योंकि तू मेरा घर बनाएगा और परमेश्वर के सामने मेरा नाम सदा के लिए स्थापित करेगा। तेरा वंश और तेरा नाम पृथ्वी की सभी पीढ़ियों में बना रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यह घर मैंने अपने लिए बनाया है’ किसी उपासना-स्थल की ओर संकेत कर सकता है; पर आगे आने वाला ‘अब्राहम का घर’ वंश या घराने का अर्थ भी जगाता है। संभवतः यह दोहरा अर्थ जानबूझकर रखा गया है।
    reason: अर्थगत अस्पष्टता और ‘घर’ के शब्द-संबंध को स्पष्ट करना
lexical_decisions:
- source_word: ቤተ
  choice: घर
  rationale: यह शब्द भवन, उपासना-स्थल और वंशगत ‘घर’—तीनों अर्थ दे सकता है। एक ही हिन्दी शब्द रखने से ‘यह घर’, ‘अब्राहम का घर’ और ‘मेरा घर’ के बीच का जानबूझकर बनाया गया संबंध तथा अर्थगत तनाव सुरक्षित रहता है।
- source_word: ዘርእ
  choice: वंश
  rationale: यहाँ सामूहिक भाव में संतान/उत्तरवर्ती पीढ़ियों का संकेत है; ‘वंश’ सहज हिन्दी में इस दीर्घकालीन प्रतिज्ञा को व्यक्त करता है।
- source_word: ይቀውም / ታቀውም
  choice: बना रहेगा / कायम करेगा
  rationale: एक ही मूल के अकर्मक और सकर्मक प्रयोगों को स्वाभाविक हिन्दी में अलग ढंग से व्यक्त किया गया है, जबकि स्थायित्व और प्रतिष्ठापन का साझा भाव सुरक्षित है।
- source_word: ቅድመ፡ አምላክ
  choice: परमेश्वर के सामने
  rationale: मूल के स्थान-संबंधी वाक्यांश का सीधा और धार्मिक रूप से तटस्थ अनुवाद।
theological_decisions:
- issue: ‘घर’ का उपासना-स्थल अथवा वंशगत घराना होना
  choice: मुख्य पाठ में हर स्थान पर ‘घर’ रखा गया
  alternative: ‘उपासना-स्थल’, ‘मंदिर’ या ‘घराना’ द्वारा अलग-अलग अर्थ निश्चित करना
  rationale: संदर्भ दोनों अर्थों की प्रतिध्वनि उत्पन्न करता है; किसी एक को निश्चित कर देने से मूल की वास्तविक अस्पष्टता और शब्द-संबंध मिट जाता।
- issue: अंतिम निर्माण और नाम स्थापित करने वाली क्रियाओं का काल
  choice: भविष्यकाल—‘तू ... बनाएगा’ और ‘कायम करेगा’
  alternative: पूर्ण भूतकाल—‘तूने ... बनाया और कायम किया है’
  rationale: समीक्षित गीइज़ पाठ में क्रियाएँ अपूर्ण/भावी रूप में हैं और कथानक में याकूब के भावी कार्य की ओर संकेत करती हैं।
- issue: दूषित पाठांश ወጎሳመይ का अर्थ
  choice: समीक्षित पाठ ወተሰምየ के आधार पर ‘और यह ... कहलाएगा’
  alternative: ‘और मेरी प्रजा, अब्राहम का घर’
  rationale: उपलब्ध पाठ में यह स्थान प्रतिलिपि/OCR-दोषग्रस्त है; संस्करण-समीक्षा और वाक्य-संरचना ‘वह कहलाएगा’ वाले पाठ का समर्थन करती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। संबोधन में एकवचन ‘तू/तेरा’ रखा गया है, क्योंकि वचन सीधे एक कुलपिता से है और यह शैली प्राचीन आशीर्वाद के स्वर को बनाए रखती है। दोहराए गए दान-वाक्य को मूल की संरचना के अनुसार ज्यों का त्यों दोहराया गया है।
