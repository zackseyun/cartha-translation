  text: And now I thank you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, advanced and complete in days, and all my days have been peace.
translation:
  language: hi
  text: और अब, हे मेरे परमेश्वर, मैं तेरा धन्यवाद करता हूँ, क्योंकि तूने मुझे यह दिन दिखाया है। देख, मैं एक सौ पचहत्तर वर्ष का हूँ—आयु में बहुत आगे बढ़ चुका और मेरे दिन पूरे हो चुके हैं; और मेरे सारे दिन शान्ति में बीते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትኃነይ፡ ለከ
  choice: मैं तेरा धन्यवाद करता हूँ
  rationale: क्रिया और द्वितीय पुरुष संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रार्थना के निकट संबोधन के कारण एकवचन ‘तेरा/तू’ रखा गया है।
- source_word: አርአይከኒ፡ ዛተ፡ ዕለተ
  choice: तूने मुझे यह दिन दिखाया है
  rationale: स्रोत की ‘दिखाना’ संबंधी ठोस अभिव्यक्ति को बिना ‘जीने देना’ जैसे अर्थ-विस्तार के सुरक्षित रखा गया है।
- source_word: ወልደ፡ ፻ወ፸ወ፭ ክረምት
  choice: मैं एक सौ पचहत्तर वर्ष का हूँ
  rationale: आयु बताने वाली स्रोत-अभिव्यक्ति का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕል
  choice: आयु में बहुत आगे बढ़ चुका और मेरे दिन पूरे हो चुके हैं
  rationale: ‘आगे बढ़ा/वृद्ध’ और ‘दिनों में पूर्ण’ की समानांतर धारणाओं को अर्थपूर्ण हिन्दी में बनाए रखता है तथा ‘वर्ष का हूँ—बूढ़ा’ जैसी पुनरुक्ति से बचता है।
- source_word: ወኵሉ፡ መዋዕልየ፡ ኮናኒ፡ ሰላመ
  choice: मेरे सारे दिन शान्ति में बीते हैं
  rationale: शाब्दिक ‘मेरे सारे दिन मेरे लिए शान्ति हुए’ को सहज हिन्दी में व्यक्त करते हुए जीवनभर की शान्ति का अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘यह दिन दिखाया’ का आशय
  choice: ठोस रूपक ‘यह दिन दिखाया’ बनाए रखा
  alternative: ‘मुझे इस दिन तक जीवित रखा’
  rationale: वैकल्पिक रूप सम्भावित आशय स्पष्ट करता, पर स्रोत में निहित देखने/दिखाने की छवि को व्याख्यात्मक ढंग से बदल देता।
- issue: ‘दिन पूरे’ का अर्थ
  choice: जीवन के दिन पूरे होने की स्रोत-अभिव्यक्ति सुरक्षित रखी
  alternative: ‘पूर्ण आयु पा चुका हूँ’ या ‘मृत्यु के निकट हूँ’
  rationale: स्रोत की सम्भावित पूर्ण आयु तथा जीवन-समाप्ति की तनावपूर्ण अस्पष्टता को किसी एक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्वर अपनाया गया है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तू/तेरा’ प्रयुक्त है। वाक्य को सामान्य पाठक के लिए स्वाभाविक बनाया गया है, पर ‘यह दिन दिखाया’ और ‘दिन पूरे’ जैसी स्रोतगत छवियाँ सुरक्षित हैं।
