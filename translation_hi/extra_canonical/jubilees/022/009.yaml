  yaml_path: translation/extra_canonical/jubilees/022/009.yaml
  text: The sword of the adversary has not overcome me in all that you have given me and my children all the days of my life until this day.
translation:
  language: hi
  text: शत्रु की तलवार ने उस सब में मुझ पर विजय नहीं पाई जो तूने मुझे और मेरी सन्तान को दिया है—मेरे जीवन के सारे दिनों में, आज के दिन तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ጸላኢ
  choice: शत्रु की तलवार
  rationale: संज्ञा-सम्बन्ध को सीधे और स्वाभाविक हिन्दी में रखा गया है; ‘तलवार’ हिंसक आक्रमण या युद्ध के साधन की मूल छवि बनाए रखती है।
- source_word: ኢሞአኒ
  choice: ने मुझ पर विजय नहीं पाई
  rationale: नकार सहित क्रिया का आशय ‘मुझे परास्त नहीं किया’ है; यह रूप अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है और हिन्दी में सहज है।
- source_word: በኵሉ፡ ዘወሀብከኒ፡ ወለውሉድየ
  choice: उस सब में ... जो तूने मुझे और मेरी सन्तान को दिया है
  rationale: ‘सब/समस्त’ और देने की क्रिया का दायरा सुरक्षित रखा गया है। एकवचन सामूहिक ‘सन्तान’ मूल के वंशजों/बच्चों के भाव को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: मेरे जीवन के सारे दिनों में, आज के दिन तक
  rationale: कालावधि की पूर्णता और वर्तमान दिन तक पहुँचने वाला बल दोनों बनाए रखे गए हैं।
theological_decisions:
- issue: ‘शत्रु’ की पहचान
  choice: सामान्य ‘शत्रु’ रखा गया
  alternative: ‘विरोधी’ या इसे शैतान के विशेष नाम/पद के रूप में लिखना
  rationale: मूल पद स्वयं शत्रु या विरोधी का अर्थ देता है, पर यहाँ उसकी पहचान स्पष्ट नहीं करता; इसलिए किसी विशिष्ट अलौकिक सत्ता का अर्थ आरोपित नहीं किया गया।
- issue: ईश्वरीय सम्बोधन का रूप
  choice: ‘तूने’
  alternative: ‘आपने’
  rationale: परमेश्वर से प्रत्यक्ष, एकवचन सम्बोधन को पारम्परिक किन्तु आज भी बोधगम्य हिन्दी बाइबिलीय शैली में रखा गया है; यह अनादर नहीं, निकट प्रत्यक्ष सम्बोधन दर्शाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की लम्बी मूल संरचना को डैश और अल्पविराम से स्पष्ट किया गया है, बिना उसकी कालगत या अर्थगत परतों को घटाए।
