base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/007.yaml
  text: And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the produce of the earth, and gave it to the children of men to eat and drink and bless their Creator.
translation:
  language: hi
  text: और उसने खाया-पिया और परमप्रधान परमेश्वर को धन्य कहा, जिसने आकाश और पृथ्वी की सृष्टि की, जिसने पृथ्वी की सारी उपज बनाई और उसे मनुष्यों की सन्तानों को दिया कि वे खाएँ-पिएँ और अपने सृष्टिकर्ता को धन्य कहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ / ይባርኩ
  choice: धन्य कहा / धन्य कहें
  rationale: गीज़ क्रिया ‘आशीष देना/धन्य कहना’ व्यक्त करती है। परमेश्वर के प्रति प्रयुक्त होने पर ‘धन्य कहना’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है और मनुष्य द्वारा परमेश्वर को वरदान देने का भ्रम टालता है।
- source_word: ልዑል
  choice: परमप्रधान
  rationale: ‘Most High’ के लिए प्रचलित, गरिमामय और स्रोत-संगत उपाधि।
- source_word: ስብሐ፡ ምድር
  choice: पृथ्वी की सारी उपज
  rationale: शाब्दिक रूप में ‘पृथ्वी की समृद्धि/पुष्टता’ का भाव हो सकता है; भोजन और पेय के प्रसंग में ‘उपज’ स्वाभाविक हिन्दी है और आशय को संकुचित किए बिना कृषि-फलन दर्शाती है।
- source_word: ውሉደ፡ ሰብእ
  choice: मनुष्यों की सन्तानें
  rationale: ‘मानव की सन्तान’ के सामूहिक स्रोत-वाक्यांश को औपचारिक किंतु सुबोध हिन्दी में सुरक्षित रखा गया है।
- source_word: ፈጣሪሆሙ
  choice: अपने सृष्टिकर्ता
  rationale: प्रत्ययगत बहुवचन संबंध (‘उनका सृष्टिकर्ता’) को हिन्दी में कर्ता-सापेक्ष ‘अपने’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: मनुष्य द्वारा परमेश्वर को आशीष देने की भाषा
  choice: परमेश्वर को ‘धन्य कहना’
  alternative: परमेश्वर की स्तुति करना / परमेश्वर को आशीष देना
  rationale: स्रोत की ‘बरक’ संबंधी क्रिया को बनाए रखते हुए ‘धन्य कहना’ आराधनात्मक अर्थ स्पष्ट करता है; इसे केवल ‘स्तुति’ कर देने से स्रोत की विशिष्ट शब्दावली लुप्त होती, जबकि ‘आशीष देना’ आधुनिक पाठक को भ्रमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय शास्त्रीय लय के साथ। समन्वित क्रियाओं में ‘खाया-पिया’ और ‘खाएँ-पिएँ’ स्वाभाविक प्रवाह देते हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
