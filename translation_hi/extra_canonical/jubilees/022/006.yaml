translation:
  language: hi
  text: और इसहाक ने भी याकूब के हाथों अब्राहम के लिए धन्यवाद-बलि का सबसे उत्तम भाग भेजा, ताकि अब्राहम खाए और पीए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእዴ ያዕቆብ
  choice: याकूब के हाथ
  rationale: गीज़ की प्रेषण-संबंधी अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप; इसका अर्थ याकूब के माध्यम से भेजना है।
- source_word: ዘይሤኒ
  choice: सबसे उत्तम भाग
  rationale: यह पद श्रेष्ठ या उत्तम अंश का बोध कराता है; हिन्दी में बलि के संदर्भ में ‘भाग’ जोड़ने से आशय स्पष्ट और स्वाभाविक रहता है।
- source_word: መሥዋዕተ ዘመድኃኒት
  choice: धन्यवाद-बलि
  rationale: इस बलि-संज्ञा का आशय धन्यवाद या कृतज्ञता से संबंधित अर्पण है; ‘धन्यवाद-बलि’ संक्षिप्त और धार्मिक संदर्भ के अनुकूल है।
- source_word: ወይብላዕኒ ወይስተይኒ
  choice: ताकि वह खाए और पिए
  rationale: उद्देश्यसूचक क्रियाओं का सीधा, सहज और अर्थनिष्ठ अनुवाद।
theological_decisions:
- issue: बलि के प्रकार की पहचान
  choice: धन्यवाद-बलि
  alternative: उद्धार की बलि / शांति-बलि
  rationale: स्रोत पदबंध और परामर्श-पाठ धन्यवाद से जुड़ी बलि का समर्थन करते हैं; अधिक विशिष्ट पंथगत या व्यवस्था-संबंधी वर्गीकरण आरोपित नहीं किया गया।
