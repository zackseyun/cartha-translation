  yaml_path: translation/extra_canonical/jubilees/022/031.yaml
  text: And do not forsake him, and do not leave him, from now and unto the days of eternity. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him for a people of your inheritance. And bless him with all your blessings from now and for all the days forever, and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”
translation:
  language: hi
  text: और अब से अनन्तकाल के दिनों तक तू उसे न त्याग और न छोड़। तेरी आँखें उस पर और उसके वंश पर खुली रहें,[a] ताकि तू उसकी रक्षा करे, उसे आशीष दे और उसे अपनी विरासत की प्रजा के लिए पवित्र ठहराए। तू अपनी सभी आशीषों से उसे अब से अनन्तकाल के सभी दिनों तक आशीष दे,[b] और पृथ्वी की सभी पीढ़ियों में अपनी पूरी इच्छा के अनुसार उसके और उसके वंश के साथ अपनी वाचा और अपनी दया को नया कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी आँखें उसके ऊपर और उसके वंश के ऊपर खुली रहें।”
    reason: मूल में स्थानसूचक अभिव्यक्ति है, जिसे हिन्दी में ‘पर’ या अधिक शाब्दिक ‘ऊपर’ कहा जा सकता है।
  - marker: b
    text: या, “अब से सदा-सर्वदा तक।”
    reason: मुख्य पाठ मूल के ‘अनन्तकाल के सभी दिनों’ को औपचारिक रूप से रखता है; यह उसका स्वाभाविक हिन्दी रूप है।
lexical_decisions:
- source_word: አትኅድጎ፡ ወአትትሐየዮ
  choice: उसे न त्यागना और न छोड़ना
  rationale: दो निकटार्थी निषेधों को अलग-अलग हिन्दी क्रियाओं से रखा गया है; इससे मूल की पुनरुक्ति और प्रार्थनात्मक बल बना रहता है।
- source_word: ክሡታተ፡ ላዕሌሁ፡ ወላዕለ፡ ዘርኡ
  choice: उस पर और उसके वंश पर खुली रहें
  rationale: ‘खुली’ और स्थानसूचक ‘पर’ मूल बिंब को सुरक्षित रखते हैं; हिन्दी में इसका आशय सतर्क, कृपालु दृष्टि से समझा जा सकता है।
- source_word: መዋዕለ፡ ዘለዓለም
  choice: अनन्तकाल के दिनों तक
  rationale: ‘दिनों’ को हटाकर केवल ‘सदा’ कहने के बजाय स्रोत की स्पष्ट काल-संज्ञा को बनाए रखा गया है।
- source_word: ኪዳነከ፡ ወሣህለከ
  choice: अपनी वाचा और अपनी दया
  rationale: ኪዳን के लिए बाइबलीय और व्यापक रूप से समझा जाने वाला ‘वाचा’ तथा ሣህል के लिए संबंधपरक कृपा दर्शाने वाला ‘दया’ चुना गया है।
- source_word: በኵሉ፡ ፈቃድከ
  choice: अपनी पूरी इच्छा के अनुसार
  rationale: शाब्दिक ‘तेरी सारी इच्छा’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और संपूर्णता का भाव बनाए रखता है।
theological_decisions:
- issue: उसे पवित्र ठहराने और विरासत की प्रजा के बीच संबंध
  choice: उसे अपनी विरासत की प्रजा के रूप में पवित्र ठहराए
  alternative: अपनी विरासत की प्रजा के लिए उसे पवित्र ठहराए
  rationale: संदर्भ में व्यक्ति और उसका वंश सामूहिक प्रजा के रूप में देखे जाते हैं। ‘के रूप में’ इस अर्थ को सुबोध बनाता है, जबकि स्रोत का ‘के लिए’ वाला अधिक औपचारिक संबंध पादटिप्पणी में सुरक्षित है।
- issue: वाचा और दया को ‘नया करना’
  choice: अपनी वाचा और अपनी दया को नया करता रहे
  alternative: अपनी वाचा को नया करे और उस पर फिर दया करे
  rationale: स्रोत दोनों संज्ञाओं को ‘नया कर’ क्रिया के साथ रखता है। असामान्य धार्मिक तनाव को व्याख्यात्मक रूप से विभाजित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए निकट एकवचन ‘तू’ प्रयुक्त है, क्योंकि पूरा वाक्य सीधा निवेदन है। ‘वंश’, ‘विरासत’, ‘पवित्र ठहराना’ और ‘वाचा’ जैसे बाइबलीय शब्द सामान्य पाठक के लिए पर्याप्त रूप से परिचित हैं।
