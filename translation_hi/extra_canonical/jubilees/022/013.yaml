  yaml_path: translation/extra_canonical/jubilees/022/013.yaml
  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
translation:
  language: hi
  text: और वह पास आया और उसने उसे चूमा। फिर उसने कहा, “मेरा पुत्र याकूब और उसके सब पुत्र परमप्रधान प्रभु के द्वारा युगानुयुग धन्य हों। प्रभु तुझे धर्मी वंश दे, और वह तेरी संतान में से कुछ को सारी पृथ्वी के बीच में पवित्र करे।[a] जातियाँ तेरी सेवा करें, और सभी जातियाँ तेरे वंश के सामने दण्डवत् करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और तेरी संतान में से पवित्र करे।” यहाँ “में से” का अर्थ सम्भवतः संतान के कुछ लोगों को चुनकर पवित्र करना है।'
    reason: गीज़ पाठ में ‘कुछ को’ स्पष्ट शब्दों में नहीं है; यह እም (‘में से’) के अंशवाचक प्रयोग से समझा गया है।
lexical_decisions:
- source_word: ቡሩክ
  choice: धन्य हों
  rationale: आशीर्वादसूचक कथन को स्वाभाविक हिन्दी में इच्छासूचक बहुवचन के रूप में रखा गया है, क्योंकि याकूब के साथ उसके सब पुत्र भी संबोधित समूह में हैं।
- source_word: ለኵሉ፡ ዓለማት
  choice: युगानुयुग
  rationale: शाब्दिक अर्थ ‘सभी युगों के लिए’ है; ‘युगानुयुग’ आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: ዘርአ፡ ጽድቅ
  choice: धर्मी वंश
  rationale: संज्ञा-सम्बन्ध ‘धार्मिकता का वंश’ को स्रोत के आशय के अनुरूप सहज विशेषणात्मक हिन्दी में व्यक्त किया गया है।
- source_word: ይቀድስ
  choice: पवित्र करे
  rationale: गीज़ क्रिया सक्रिय रूप में है; इसलिए इसे आत्मवाचक ‘अपने आपको पवित्र करे’ नहीं बनाया गया।
- source_word: ይትቀነዩ፡ ለከ
  choice: तेरी सेवा करें
  rationale: क्रिया अधीन होकर सेवा करने का भाव देती है; इच्छासूचक रूप प्रसंग के आशीर्वचन के अनुकूल है।
- source_word: ይስግዱ
  choice: दण्डवत् करें
  rationale: यह झुककर प्रणाम या अधीनता प्रकट करने की शारीरिक क्रिया को दर्शाता है; ‘दण्डवत् करना’ उस भाव को स्पष्ट रखता है।
theological_decisions:
- issue: पवित्र किए जाने वाले लोगों की पहचान
  choice: तेरी संतान में से कुछ को पवित्र करे
  alternative: तेरी संतान में से पवित्र करे / तेरी संतान में से वह अपने आपको पवित्र करे
  rationale: እም उपसर्ग का यहाँ अंशवाचक अर्थ सम्भावित है, जबकि ይቀድስ सक्रिय क्रिया है। हिन्दी में अनकहा कर्म अस्पष्ट रहता, इसलिए ‘कुछ को’ जोड़ा गया; आत्मवाचक विकल्प क्रियारूप से समर्थित नहीं है।
- issue: आशीर्वाद का कर्ता
  choice: परमप्रधान प्रभु के द्वारा ... धन्य हों
  alternative: परमप्रधान प्रभु के लिए ... धन्य हों
  rationale: स्रोत का ለ सम्बन्ध या साधन के रूप में समझा जा सकता है। आशीर्वचन के प्रसंग और परामर्श-पाठ के अनुसार प्रभु को आशीर्वाद देने वाला मानते हुए ‘के द्वारा’ चुना गया, बिना किसी सम्प्रदायगत निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘युगानुयुग’, ‘दण्डवत्’ और ‘पवित्र’ जैसे परिचित बाइबलीय शब्द गरिमा बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी और स्पष्ट है।
