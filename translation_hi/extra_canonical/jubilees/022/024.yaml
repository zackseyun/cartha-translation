base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/024.yaml
  text: And for all who worship idols and for the profane[24], there is no hope in the land of the living; for they will go down to Sheol, and they will go to the place of judgment, and they will have no memorial upon the earth. As the sons of Sodom were removed from the earth, so all who worship idols will be removed.
translation:
  language: hi
  text: और उन सबके लिए जो मूर्तियों की उपासना करते हैं, और घृणित लोगों[a] के लिए जीवितों की भूमि में कोई आशा नहीं है; क्योंकि वे शीओल[b] में उतरेंगे और न्याय के स्थान पर जाएंगे, और पृथ्वी पर उनका कोई स्मरण नहीं रहेगा। जिस प्रकार सदोम के पुत्र पृथ्वी से हटा दिए गए, उसी प्रकार वे सभी जो मूर्तियों की उपासना करते हैं, हटा दिए जाएंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तिरस्कृत लोग।” मूल शब्द का अर्थ घृणा या तिरस्कार के पात्र लोग है; यह सीधे-सीधे अनुष्ठानिक अशुद्धता का सामान्य शब्द नहीं है।
    reason: lexical_ambiguity
  - marker: b
    text: “शीओल” को “नरक” या “कब्र” कहने के बजाय मूल नाम के रूप में रखा गया है, क्योंकि पाठ शीओल में उतरने और “न्याय के स्थान” पर जाने का अलग-अलग उल्लेख करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ጽሉአን (ṣəluʾān)
  choice: घृणित लोग
  rationale: यह शब्द ጸልአ (‘घृणा करना’) से संबंधित है और ‘घृणित/तिरस्कृत’ का भाव देता है; इसे ‘अशुद्ध’ कहना गीइज़ के सामान्य शुद्धि-अशुद्धि संबंधी शब्द से अनावश्यक रूप से मिला देता।
- source_word: ሲኦል (Siʾol)
  choice: शीओल
  rationale: मूल स्थान-नाम को लिप्यंतरित रखा गया है, क्योंकि अगला पदबंध ‘न्याय का स्थान’ इससे अलग है; ‘नरक’ या ‘कब्र’ अनुवाद करने से यह भेद मिट सकता है।
- source_word: ተንሥኡ / ይትነሥኡ
  choice: उखाड़ फेंके गए / उखाड़ फेंके जाएंगे
  rationale: दोनों समान मूल से बने रूपों की पुनरावृत्ति बनाए रखते हुए धरती पर से पूर्णतः हटा दिए जाने का प्रबल भाव व्यक्त किया गया है।
- source_word: ዝክረ
  choice: स्मरण
  rationale: यह ‘याद’ या ‘स्मारक/नामो-निशान’ की अर्थ-सीमा रख सकता है; ‘स्मरण’ हिन्दी में इस व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
theological_decisions:
- issue: शीओल और न्याय के स्थान का संबंध
  choice: 'दोनों को अलग-अलग पदबंधों के रूप में रखा गया: ‘शीओल में उतरेंगे’ और ‘न्याय के स्थान में जाएंगे’।'
  alternative: शीओल को ही नरक या न्याय का स्थान मानकर एक संयुक्त अभिव्यक्ति देना।
  rationale: मूल पाठ दो क्रमिक कथन करता है; अनुवाद उनके सटीक संबंध को निर्धारित नहीं करता।
- issue: निष्कासन के कर्ता की पहचान
  choice: 'निष्क्रिय वाच्य रखा गया: ‘उखाड़ फेंके गए/जाएंगे’।'
  alternative: ‘परमेश्वर उन्हें उखाड़ फेंकेगा’।
  rationale: मूल में कर्ता स्पष्ट नहीं है; परमेश्वर को प्रत्यक्ष कर्ता बनाना अनुवाद में अतिरिक्त व्याख्या जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘जीवितों की धरती’, ‘शीओल’ और ‘न्याय का स्थान’ जैसे पारंपरिक धार्मिक पदबंध सुरक्षित हैं। समान स्रोत-क्रिया की पुनरावृत्ति दिखाने के लिए अंतिम दोनों खंडों में ‘उखाड़ फेंके’ दोहराया गया है।
