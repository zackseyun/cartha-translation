review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two distinct destinations—descent to Sheol and going to the place of judgment—and does not supply an unstated agent for the removal. It also retains the source's repeated removal verb. However, “उखाड़ फेंके” is stronger and more concrete than the source and English audit trail's “removed,” and should be softened.
  naturalness: The Hindi is generally clear and suitably formal. “जीवितों की भूमि,” “न्याय के स्थान पर,” and “हटा दिए गए” are more idiomatic and precise in this context than “जीवितों की धरती,” “न्याय के स्थान में,” and “उखाड़ फेंके गए.”
  terminology: “शीओल” is appropriately retained. “घृणित लोग” is defensible for ጽሉአን and, with the footnote, avoids falsely equating the term with ritual uncleanness. “स्मरण” suitably preserves the source term's range of remembrance/memorial.
  issues:
  - severity: medium
    issue: “उखाड़ फेंके गए/जाएंगे” overstates the removal imagery.
    rationale: The repeated Ge'ez verb and the English audit trail indicate removal/taking away. “उखाड़ फेंकना” adds a vivid uprooting-and-casting-away sense not required by the source.
  - severity: low
    issue: A few locative expressions are less natural in Hindi.
    rationale: “न्याय के स्थान पर जाएंगे” is idiomatic for movement to a destination, and “जीवितों की भूमि” is the conventional, natural rendering of “land of the living.”
