  text: And in those days Ishmael came to see his father, and the two of them came together; and Isaac slaughtered a sacrifice as a thank offering and offered it on the altar that his father had made in Hebron.
translation:
  language: hi
  text: उन दिनों इश्माएल अपने पिता से मिलने आया, और वे दोनों[a] साथ आए। इसहाक ने धन्यवाद-बलि के रूप में एक पशु का वध किया और उसे उस वेदी पर चढ़ाया, जिसे उसके पिता ने हेब्रोन में बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में केवल ‘वे दोनों’ है; दोनों व्यक्तियों की पहचान स्पष्ट नहीं की गई है।
    reason: स्रोत में मौजूद संदर्भगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ይርአይ፡ አባሁ
  choice: अपने पिता से मिलने
  rationale: शाब्दिक अर्थ ‘अपने पिता को देखने’ है; आधुनिक हिन्दी में भेंट के आशय को स्वाभाविक रूप से व्यक्त करने के लिए ‘मिलने’ चुना गया।
- source_word: መሥዋዕተ፡ ለጽንሓሕ
  choice: धन्यवाद-बलि के रूप में एक पशु
  rationale: पद बलि और धन्यवाद के उद्देश्य/स्वरूप को जोड़ता है। हिन्दी में ‘बलि का वध’ अस्वाभाविक है, इसलिए बलि में निहित पशु को स्पष्ट कर स्वाभाविक अभिव्यक्ति दी गई।
- source_word: አዕረገ፡ ዲበ፡ ምሥዋዕ
  choice: उसे ... वेदी पर चढ़ाया
  rationale: क्रिया का आशय बलि को वेदी पर अर्पित/चढ़ाना है; ‘चढ़ाया’ सामान्य धार्मिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘वे दोनों’ की पहचान
  choice: मुख्य पाठ में व्यक्तियों की पहचान स्पष्ट नहीं की गई
  alternative: ‘इश्माएल और इसहाक’ अथवा ‘इश्माएल और उसका पिता’
  rationale: गीज़ पाठ केवल ‘वे दोनों’ कहता है। किसी निश्चित जोड़ी का नाम जोड़ना स्रोत की वास्तविक संदर्भगत अस्पष्टता को अनुचित रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘धन्यवाद-बलि’ धार्मिक आशय को सामान्य पाठक के लिए संक्षेप में स्पष्ट करता है।
