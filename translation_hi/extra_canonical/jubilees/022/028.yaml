  yaml_path: translation/extra_canonical/jubilees/022/028.yaml
  text: And both of them lay down together on one bed[28], and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his compassion and his heart rejoiced over him.
translation:
  language: hi
  text: और वे दोनों एक ही बिछौने पर साथ लेट गए। याकूब अपने दादा अब्राहम की गोद में सोया। अब्राहम ने उसे सात बार चूमा, और उसकी करुणा और उसका हृदय याकूब को लेकर आनन्दित हुए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम खंड कठिन है। ‘याकूब को लेकर’ मूल के उस संबंध को व्यक्त करता है जिसका शाब्दिक अर्थ ‘उस पर/उसके विषय में’ भी हो सकता है।
    reason: मूल के कठिन अंतिम संबंधवाचक पद को स्पष्ट करना और पादटिप्पणी को उसी खंड पर रखना।
lexical_decisions:
- source_word: ዐራት፡ አሐቲ
  choice: एक ही बिछौने
  rationale: शाब्दिक अर्थ ‘एक बिछौना’ है; आधुनिक हिन्दी में ‘एक ही बिछौने पर’ दोनों के साथ लेटने का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ውስተ፡ ሕፅነ
  choice: गोद में
  rationale: यह पद छाती, अंक या गोद का बोध करा सकता है; स्नेह और निकटता के इस प्रसंग में ‘गोद में’ सहज तथा उपयुक्त है।
- source_word: አቡ፡ አቡሁ
  choice: दादा
  rationale: शाब्दिक रूप ‘उसके पिता का पिता’ है, जिसका स्वाभाविक हिन्दी संबंध-सूचक शब्द ‘दादा’ है।
- source_word: ምሕረቱ
  choice: उसकी करुणा
  rationale: मूल शब्द दया/करुणा का अर्थ रखता है; ‘करुणा’ मूल की अलग संज्ञा और भावात्मक गहराई को बनाए रखता है।
- source_word: ወትሤሖ
  choice: आनन्दित हुए
  rationale: पाठ में आनन्दित होने या हर्षित होने की क्रिया है; इसे केवल ‘उस पर थे’ कहना मूल क्रिया को हटा देता।
- source_word: ላዕሌሁ
  choice: याकूब के कारण
  rationale: यह संबंध ‘उस पर/उसके विषय में/उसके कारण’ हो सकता है। हिन्दी में ‘याकूब के कारण आनन्दित हुए’ अभिप्रेत भाव को स्पष्ट करता है और सर्वनाम-संदेह से बचाता है।
