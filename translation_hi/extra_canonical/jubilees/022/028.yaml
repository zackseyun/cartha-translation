  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य। ‘दादा’ को शाब्दिक ‘उसके पिता के पिता’ के स्थान पर चुना गया है। अंतिम वाक्य की कुछ असामान्य संरचना—‘उसकी करुणा और उसका हृदय … आनन्दित हुए’—मूल में दोनों संज्ञाओं को कर्ता बनाए रखने और पाठ की भावात्मक तीव्रता को न मिटाने के लिए संरक्षित है।
