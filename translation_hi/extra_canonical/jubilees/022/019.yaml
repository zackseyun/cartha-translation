  text: They sacrifice their sacrifices to the dead, and they worship demons, and they eat in the graves[19], and all their works are vanity and emptiness.
translation:
  language: hi
  text: वे अपने ही बलिदान मरे हुओं के लिए बलि चढ़ाते हैं, दुष्टात्माओं की पूजा करते हैं, और कब्रों में खाते हैं[a]; और उनके सभी काम व्यर्थ और रिक्त हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कब्रों में खाते हैं” से संभवतः अंत्येष्टि-संबंधी भोज या मृतात्माओं से संपर्क की धार्मिक प्रथा का संकेत मिलता है।
    reason: cultural_note
lexical_decisions:
- source_word: መሥዋዕቶሙ፡ ... ይዘብሑ
  choice: अपने बलिदान ... चढ़ाते हैं
  rationale: संज्ञा और क्रिया की स्रोत-पुनरुक्ति को यथासंभव रखते हुए स्वाभाविक हिन्दी धार्मिक अभिव्यक्ति दी गई है।
- source_word: ለአብድነት
  choice: मरे हुओं के लिए
  rationale: प्रसंग और प्रमाणित अंग्रेज़ी परामर्श-पाठ के अनुसार मृतकों को लक्ष्य/लाभार्थी बताता है; ‘के लिए’ मूल संबंध की संभावित व्यापकता बनाए रखता है।
- source_word: አጋንንት
  choice: दुष्टात्माओं
  rationale: यह बहुवचन अलौकिक दुष्ट सत्ताओं के लिए सामान्य, स्पष्ट और आधुनिक हिन्दी शब्द है।
- source_word: ይሰግዱ
  choice: दण्डवत् करते हैं
  rationale: उपासना-सूचक झुकने/प्रणाम करने की क्रिया को धार्मिक प्रसंग में स्वाभाविक रूप से व्यक्त करता है।
- source_word: በውስተ፡ መቃብራት
  choice: कब्रों में
  rationale: स्थानवाचक पद का निकट औपचारिक अनुवाद है; इसे ‘कब्रों पर’ बनाकर व्याख्यात्मक समाधान नहीं किया गया।
- source_word: ከንቱ፡ ወበከ
  choice: व्यर्थ और खोखले
  rationale: दो समन्वित निष्फलता/रिक्तता-सूचक पदों को अलग रखते हुए सहज हिन्दी युग्म चुना गया है।
theological_decisions:
- issue: मृतकों के लिए बलिदान का संबंध
  choice: मरे हुओं के लिए
  alternative: मरे हुओं को
  rationale: ‘के लिए’ लक्ष्य, लाभार्थी या संबद्धता की अस्पष्टता को ‘को’ की अपेक्षा बेहतर बनाए रखता है।
- issue: कब्रों में खाने की प्रथा
  choice: मुख्य पाठ में केवल ‘कब्रों में खाते हैं’; संभावित सांस्कृतिक अर्थ पादटिप्पणी में
  alternative: मुख्य पाठ में ‘कब्रों में पंथीय/मृतात्मा-संपर्क के भोज करते हैं’
  rationale: मूल कथन संक्षिप्त है; अंत्येष्टि अथवा मृतात्मा-संपर्क संबंधी अर्थ संभावित है, निश्चित नहीं, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली। ‘दण्डवत्’ धार्मिक उपासना का भाव देता है; ‘कब्रों में’ मूल की स्थानवाचक अभिव्यक्ति को जानबूझकर अक्षुण्ण रखता है।
