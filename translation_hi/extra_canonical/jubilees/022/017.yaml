  yaml_path: translation/extra_canonical/jubilees/022/017.yaml
  text: And may he renew his covenant with you, that you may be for him a people for an inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.
translation:
  language: hi
  text: और वह तुम्हारे साथ अपनी वाचा को नवीकृत करे, ताकि तुम सब युगों तक उसके लिए विरासत स्वरूप प्रजा बनो, और वह सत्य और धार्मिकता में पृथ्वी के सारे दिनों तक तुम्हारा और तुम्हारे वंश का परमेश्वर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐድስ፡ ኪዳኖ
  choice: अपनी वाचा को नया करे
  rationale: क्रिया ‘नया करना/नवीकृत करना’ और ‘वाचा’ के औपचारिक अर्थ को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ሕዝበ፡ ለርስት
  choice: निज भाग की प्रजा
  rationale: ‘विरासत/अधिकार के लिए प्रजा’ का आशय परमेश्वर की अपनी विशेष प्रजा से है; ‘निज भाग’ इस संबंध को स्पष्ट करते हुए विरासत की मूल छवि बनाए रखता है।
- source_word: ለኵሉ፡ ዓለማት
  choice: सब युगों तक
  rationale: यहाँ बहुवचन पद कालगत ‘सभी युगों’ का अर्थ देता है, न कि अनिवार्यतः अनेक संसारों का।
- source_word: ለከ፡ ወለዘርእከ
  choice: तुम्हारा और तुम्हारे वंश का
  rationale: एकवचन संबोधन तथा ‘बीज/संतति’ को हिन्दी की स्वाभाविक वंशगत अभिव्यक्ति में रखा गया है।
- source_word: በሀልወ፡ ወዘበጽድቅ
  choice: सत्य और धार्मिकता से
  rationale: दोनों नैतिक-धार्मिक संज्ञाओं को अलग रखते हुए उनके संयुक्त रीति/क्षेत्रगत भाव को संरक्षित किया गया है।
- source_word: በኵሉ፡ መዋዕለ፡ ምድር
  choice: पृथ्वी के सारे दिनों में
  rationale: स्रोत की विशिष्ट कालगत छवि का निकट और बोधगम्य अनुवाद है।
theological_decisions:
- issue: प्रजा का ‘विरासत’ होना
  choice: उसके लिए निज भाग की प्रजा
  alternative: उसके लिए विरासत की प्रजा
  rationale: यह वाक्य प्रजा को परमेश्वर के अपने भाग/अधिकार के रूप में प्रस्तुत करता है; अधिक अस्पष्ट हिन्दी ‘विरासत की प्रजा’ की तुलना में चुना हुआ रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना किसी सम्प्रदायगत व्याख्या के।
- issue: परमेश्वर होने का आशीर्वादात्मक विधान
  choice: परमेश्वर बना रहे
  alternative: परमेश्वर हो
  rationale: संदर्भ वाचा के नवीकरण और निरंतर संबंध का है; ‘बना रहे’ उस कालगत निरंतरता को व्यक्त करता है और इसे परमेश्वर के अस्तित्व के आरम्भ के रूप में पढ़े जाने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, आशीर्वादात्मक वाक्य-विन्यास अपनाया गया है। ‘वाचा’, ‘प्रजा’, ‘वंश’, ‘सत्य’ और ‘धार्मिकता’ जैसे परिचित धर्मग्रंथीय शब्द बनाए रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
