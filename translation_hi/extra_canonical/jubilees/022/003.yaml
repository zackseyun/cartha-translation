  text: For Isaac had many possessions in Beer-sheba, and Isaac would go and look at his possessions and return to his father.
translation:
  language: hi
  text: क्योंकि बेर्शेबा में इसहाक के पास बहुत संपत्ति थी। वह वहाँ जाता, अपनी संपत्ति को देखता और अपने पिता के पास लौट आता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक पुराने अनुवाद में है, “वह गया, उसने भोज तैयार किया और उसे अपने पिता के पास ले आया।”
    reason: पूर्व प्रचलित वैकल्पिक अनुवाद को दर्ज किया गया है। उपलब्ध गीइज़ पाठ के अनुसार मुख्य पाठ में इसहाक के अपनी संपत्ति को देखने और पिता के पास लौटने का अर्थ रखा गया है।
lexical_decisions:
- source_word: ጥሪቱ / ጥሪተ
  choice: उसकी संपत्ति / अपनी संपत्ति
  rationale: यह शब्द धन-संपत्ति या माल-मवेशी के अर्थ में है। हिंदी में व्यापक शब्द ‘संपत्ति’ मूल अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በቤርሳቤ
  choice: बेर्शेबा में
  rationale: स्थान-नाम का प्रचलित हिंदी बाइबलीय रूप रखा गया है।
- source_word: የሐውር … ይዋሑ … ይገብእ
  choice: जाता … देखभाल करने … लौट आता था
  rationale: अपूर्ण क्रिया-रूप भूतकाल की बार-बार होने वाली क्रिया बताते हैं। मध्य क्रिया का आशय संपत्ति को देखने/उसकी निगरानी करने से है; प्रसंगानुसार ‘देखभाल करने’ स्वाभाविक हिंदी है।
- source_word: ኀበ አቡሁ
  choice: अपने पिता के पास
  rationale: शाब्दिक संबंध ‘उसके पिता के पास’ है; कर्ता इसहाक होने के कारण हिंदी में ‘अपने पिता के पास’ स्वाभाविक और स्पष्ट है।
