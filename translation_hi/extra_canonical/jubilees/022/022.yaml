base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/022.yaml
  text: Take heed, my son Jacob, that you do not take a wife from any of the seed of the daughters of Canaan, for all his seed is to be uprooted from the earth.
translation:
  language: hi
  text: मेरे पुत्र याकूब, सावधान रहना कि कनान की बेटियों के वंश की किसी स्त्री से विवाह न करना, क्योंकि उसका सारा वंश पृथ्वी पर से उखाड़ दिया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसका सारा वंश पृथ्वी पर से नाश के लिए है।”
    reason: अंग्रेज़ी POB audit trail में दिए गए वैकल्पिक पाठ ‘is for destruction from the earth’ को दर्शाता है; मुख्य पाठ में मूल की ‘उखाड़ने’ वाली उपमा बनी रहती है।
lexical_decisions:
- source_word: ተዐቀብ
  choice: सावधान रहना
  rationale: आज्ञार्थक भाव में सतर्क रहने की चेतावनी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አትንግእ፡ ብእሲተ
  choice: किसी स्त्री को पत्नी न बनाना
  rationale: स्रोत का आशय विवाह के लिए स्त्री ग्रहण करना है; यह हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: ዘርአ፡ አዋልደ፡ ከናአን
  choice: कनान की बेटियों के वंश
  rationale: ‘बीज/सन्तान’ के सामूहिक वंशगत अर्थ को बनाए रखता है और अनावश्यक रूप से किसी विशेष जातीय व्याख्या को नहीं जोड़ता।
- source_word: ለሥራዊ፡ እምድር
  choice: पृथ्वी पर से उखाड़ दिया जाएगा
  rationale: ሥራዊ में निहित उखाड़ने/समूल हटाने की कृषि-उपमा और እምድር ‘पृथ्वी पर से’ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसका सारा वंश’ में सर्वनाम का संदर्भ
  choice: उसका सारा वंश
  alternative: उनका सारा वंश / कनान का सारा वंश
  rationale: स्रोत में एकवचन संबंधसूचक रूप है, जिसका निकटतम संदर्भ कनान है। एकवचन बनाए रखने से मूल की संरचना और संभावित संदर्भगत तनाव सुरक्षित रहता है।
- issue: उन्मूलन के कथन का काल और अनिवार्यता
  choice: उखाड़ दिया जाएगा
  alternative: उखाड़े जाने के लिए है / नष्ट किया जाएगा
  rationale: यह भावी निष्क्रिय कथन हिन्दी में स्वाभाविक है और ‘उखाड़ने’ की मूल उपमा को बनाए रखता है; फिर भी स्रोत की पदरचना का अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पारिवारिक संबोधन और चेतावनी का गंभीर स्वर सुरक्षित है; ‘उखाड़ दिया जाएगा’ मूल कृषि-उपमा को बनाए रखता है।
