  yaml_path: translation/extra_canonical/jubilees/022/029.yaml
  text: And he blessed him with all his heart and said, “The Most High God, the God of all and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and that I might establish a holy seed—may the Most High be blessed forever.”
translation:
  language: hi
  text: और उसने उसे पूरे मन से आशीर्वाद दिया और कहा, “परमप्रधान परमेश्वर, सबका परमेश्वर और सबका सृष्टिकर्ता, जो मुझे कसदियों के ऊर नगर से निकाल लाया, ताकि वह मुझे यह देश सदा की संपत्ति के रूप में दे और मैं एक पवित्र वंश स्थापित करूँ—परमप्रधान सदा धन्य हो!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: परमप्रधान परमेश्वर
  rationale: यह प्रचलित, गरिमापूर्ण हिन्दी उपाधि है और ‘Most High God’ का स्वाभाविक रूप देती है।
- source_word: ኡር፡ ዘከለዳውያን
  choice: कसदियों का ऊर नगर
  rationale: स्थान-नाम ‘ऊर’ को बनाए रखते हुए ‘नगर’ जोड़ने से आधुनिक पाठक इसे स्थान के रूप में सहजता से पहचानता है।
- source_word: ምድረ፡ አርስ፡ ለዓለም
  choice: यह देश सदा की संपत्ति के रूप में
  rationale: वाक्यांश में भूमि के स्थायी अधिकार/धरोहर का भाव है; ‘संपत्ति’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: አቅም፡ ዘርአ፡ ቅዱሰ
  choice: मैं एक पवित्र वंश स्थापित करूँ
  rationale: क्रिया प्रथम पुरुष एकवचन अधीनार्थक है, इसलिए कर्ता अब्राहम को स्पष्ट रखते हुए ‘मैं … करूँ’ कहा गया है; ‘वंश’ यहाँ seed की सामूहिक वंशावली-संबंधी धारणा व्यक्त करता है।
- source_word: ይትባረክ፡ ልዑል፡ ለዓለም
  choice: परमप्रधान सदा धन्य हो
  rationale: स्रोत में ‘परमप्रधान’ उपाधि दोबारा स्पष्ट रूप से आती है; उसे सर्वनाम से नहीं बदला गया।
theological_decisions:
- issue: ‘पवित्र वंश’ स्थापित करने वाले का कर्ता
  choice: ‘मैं … स्थापित करूँ’ द्वारा अब्राहम को कर्ता रखा गया
  alternative: ‘और एक पवित्र वंश स्थापित करने के लिए’, जिससे परमेश्वर कर्ता समझा जा सकता है
  rationale: गीज़ क्रिया አቅም प्रथम पुरुष एकवचन रूप है; अनुवाद में इस व्याकरणिक कर्ता-परिवर्तन को बनाए रखना आवश्यक है।
- issue: अंतिम आशीर्वचन में उपाधि
  choice: ‘परमप्रधान’ को दोहराया गया
  alternative: ‘वह सदा धन्य हो’
  rationale: स्रोत अंतिम उपवाक्य में ልዑል को स्पष्ट रूप से दोहराता है, इसलिए सर्वनाम उस बलाघात को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल का लंबा आशीर्वचनात्मक वाक्य और अंतिम कामनार्थक उद्घोष सुरक्षित हैं। ‘उसने उसे’ के संदर्भगत सर्वनाम मूल की तरह ही रखे गए हैं, ताकि पद से बाहर की पहचान अनावश्यक रूप से न जोड़ी जाए।
