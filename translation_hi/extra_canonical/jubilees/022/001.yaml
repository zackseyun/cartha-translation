base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/001.yaml
  text: And it came to pass in the first week[1], in the forty-fourth jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath to celebrate the Feast of Weeks, this feast of the firstfruits of the harvest, with Abraham their father.
translation:
  language: hi
  text: और चौवालीसवीं जुबली के पहले सात-वर्षीय सप्ताह के दूसरे वर्ष में—उसी वर्ष जिसमें अब्राहम की मृत्यु हुई—ऐसा हुआ कि इसहाक और इश्माएल अपने पिता अब्राहम के साथ सप्ताहों का पर्व, अर्थात कटनी की पहली उपज का यह पर्व, मनाने के लिए शपथ के कुएँ से आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जुबली ग्रंथ घटनाओं का समय जुबलियों और सात-सात वर्षों के ‘सप्ताहों’ के अनुसार बताता है। मूल गीज़ पाठ यहाँ ‘चौवालीसवीं’ जुबली कहता है।
    reason: cross_reference
lexical_decisions:
- source_word: ሱባዔ
  choice: सात-वर्षीय सप्ताह
  rationale: यहाँ शब्द कालगणना की सात वर्षों की इकाई को सूचित करता है; केवल ‘सप्ताह’ कहने से आधुनिक पाठक इसे सात दिन समझ सकता है।
- source_word: አርብዓ፡ ወአርባዕቱ፡ ኢዮቤልዉ
  choice: चौवालीसवाँ जुबली-वर्ष
  rationale: गीज़ में संख्या स्पष्ट रूप से ‘चालीस और चार’ है; इसलिए अंग्रेज़ी परंपरा में कहीं मिलने वाले ‘बयालीसवें’ पाठ को नहीं अपनाया गया।
- source_word: ዐዘቅተ፡ መሐላ
  choice: शपथ का कुआँ
  rationale: मूल पदबंध का अर्थ ‘शपथ का कुआँ’ है; स्थान-नाम को अर्थ सहित प्रस्तुत करने से स्रोत की शब्द-छवि बनी रहती है।
- source_word: በዓለ፡ ሱባዔያት
  choice: सप्ताहों का पर्व
  rationale: यह स्थापित पर्वनाम ‘Feast of Weeks’ का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: ዘቀዳሚ፡ ማእረር
  choice: कटनी की पहली उपज
  rationale: पदबंध कटनी के आरंभिक फल/उपज की धार्मिक भेंट की ओर संकेत करता है; ‘पहला पर्व’ कहना इस आशय को खो देता है।
theological_decisions:
- issue: सप्ताहों के पर्व और पहली उपज के बीच संबंध
  choice: 'दूसरे पदबंध को उसी पर्व का स्पष्टीकरण माना गया: ‘अर्थात कटनी की पहली उपज का यह पर्व’।'
  alternative: दो अलग पर्वों अथवा ‘कटनी के पहले पर्व’ के रूप में पढ़ना।
  rationale: ዛተ (‘यह’) और पहली उपज से संबंधित पदबंध सप्ताहों के पर्व का पुनर्वर्णन करते हैं; इससे कृषि-पर्व का संकेत सुरक्षित रहता है, बिना अतिरिक्त धर्मशास्त्रीय विस्तार जोड़े।
- issue: अब्राहम के साथ पर्व मनाने का संबंध
  choice: ‘अपने पिता अब्राहम के पास आए, ताकि उसके साथ ... मनाएँ’।
  alternative: केवल ‘अब्राहम के यहाँ पर्व मनाने आए’।
  rationale: मूल में गति का लक्ष्य अब्राहम है और प्रसंग सहभागिता भी बताता है; चुना हुआ रूप दोनों संबंधों को स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कालगणना की तकनीकी संरचना को सरल करके हटाया नहीं गया; ‘सात-वर्षीय सप्ताह’ से उसका आशय स्पष्ट किया गया है। पर्वनाम को ‘सप्ताहों का पर्व’ और firstfruits को ‘कटनी की पहली उपज’ कहा गया है।
