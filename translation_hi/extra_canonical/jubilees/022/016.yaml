base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/016.yaml
  text: And may he cleanse you from all uncleanness and impurity, so that he may forgive all your transgressions and your sins of ignorance[16]. And may he strengthen you and bless you, and may you inherit the whole earth.
translation:
  language: hi
  text: और वह तुम्हें हर प्रकार की अशुद्धता और अपवित्रता से शुद्ध करे, ताकि वह तुम्हारे सारे अपराध और अनजाने में किए गए पाप[a] क्षमा करे। वह तुम्हें सामर्थ्य दे और आशीष दे, और तुम सारी पृथ्वी के उत्तराधिकारी बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अनजाने में किए गए पाप’ वाला गीइज़ वाक्यांश पाठ और अर्थ—दोनों की दृष्टि से कठिन है। संभवतः यहाँ जानबूझकर किए गए अपराधों और पूरी जानकारी के बिना हुई भूलों के बीच भेद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኵሰት፡ ወርኩስ
  choice: अशुद्धता और अपवित्रता
  rationale: स्रोत में निकटार्थी दो पद अलग-अलग रखे गए हैं; हिन्दी में भी दोनों को बनाए रखकर उसकी पुनरुक्तिपूर्ण तीव्रता सुरक्षित की गई है।
- source_word: ያስተስሪ
  choice: क्षमा करे
  rationale: संदर्भ में अपराधों और पापों के निवारण का भाव है; परामर्श-पाठ के अनुरूप सामान्य और स्पष्ट हिन्दी चुनी गई है।
- source_word: አበሳከ
  choice: तुम्हारे सारे अपराध
  rationale: यह पद दोष अथवा उल्लंघन का बोध कराता है; ‘अपराध’ अगले कठिन पद से इसका भेद बनाए रखता है।
- source_word: ዘበአያእምሮ፡ ጌገይከ
  choice: अनजाने में किए गए पाप
  rationale: कठिन गीइज़ वाक्यांश में अज्ञान या पूर्ण जानकारी के अभाव में हुई भूल का संकेत है; व्याख्या को मुख्य पाठ में अत्यधिक निश्चित किए बिना स्वाभाविक हिन्दी दी गई है।
- source_word: ያኃይለከ
  choice: तुम्हें सामर्थ्य दे
  rationale: क्रिया के बलवान या समर्थ करने के अर्थ को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ትረስ፡ ኵላ፡ ምድረ
  choice: तुम सारी पृथ्वी के उत्तराधिकारी बनो
  rationale: उत्तराधिकार में पाने की धारणा को सुरक्षित रखा गया है; इसे केवल ‘अधिकार करना’ नहीं बनाया गया।
theological_decisions:
- issue: क्षमा करने वाली क्रिया का कर्ता
  choice: ‘वह’ अर्थात परमेश्वर अपराधों और पापों को क्षमा करे
  alternative: ‘तुम’ अपने अपराधों का प्रायश्चित करो अथवा उनसे शुद्ध हो जाओ
  rationale: गीइज़ क्रियारूप और वाक्यरचना कठिन हैं, किन्तु निकटवर्ती आशीषों में एक ही दैवी कर्ता शुद्ध करता, सामर्थ्य देता और आशीष देता है; इसलिए परामर्श-पाठ का अर्थ रखा गया, जबकि कठिन पाप-वाक्यांश को पादटिप्पणी में स्वीकार किया गया है।
- issue: पृथ्वी का उत्तराधिकार
  choice: ‘सारी पृथ्वी के उत्तराधिकारी बनो’
  alternative: ‘सारे देश के उत्तराधिकारी बनो’
  rationale: ምድር का अर्थ पृथ्वी या भूमि दोनों हो सकता है। व्यापक परिमाणसूचक ‘सारी’ और परामर्श-पाठ के आधार पर ‘पृथ्वी’ चुना गया, बिना उत्तराधिकार के स्वरूप की अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: आशीर्वादात्मक शैली को ‘करे’, ‘दे’ और ‘बनो’ से बनाए रखा गया है। भाषा आधुनिक मानक हिन्दी की है, पर वाक्य की धार्मिक गरिमा और स्रोत की समानांतर संरचना सुरक्षित रखी गई है।
