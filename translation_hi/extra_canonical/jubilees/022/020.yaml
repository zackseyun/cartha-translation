  text: They have no heart to understand, and their eyes do not see what they have made, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord and my deliverer.’ And they have no heart.
translation:
  language: hi
  text: उनमें समझने की बुद्धि नहीं है, और उनकी आँखें यह नहीं देखतीं कि उन्होंने क्या बनाया है और यह भी नहीं देखतीं कि वे कैसे भटक जाते हैं, जब वे लकड़ी से कहते हैं, ‘तू मेरा ईश्वर है,’ और पत्थर से, ‘तू मेरा स्वामी है और तू मेरा छुड़ाने वाला है।’ उनमें बुद्धि नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ
  choice: समझने वाला मन
  rationale: गीज़ ‘हृदय’ विचार और समझ के आंतरिक केंद्र को दर्शाता है। आधुनिक हिन्दी में ‘समझने वाला मन’ मूल बिंब और आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ሐልዮ
  choice: समझने
  rationale: इस प्रसंग में शब्द का अर्थ विचार करने और विवेकपूर्वक समझने से है; ‘समझने’ साधारण पाठक के लिए स्पष्ट है।
- source_word: ገብሮሙ
  choice: उन्होंने क्या बनाया है
  rationale: क्रिया उनके अपने हाथों बनाई हुई मूर्तियों की ओर संकेत करती है; यह अनुवाद कर्म को अमूर्त ‘कामों’ के बजाय ठोस निर्माण के रूप में रखता है।
- source_word: ይስኅቱ
  choice: भटक जाते हैं
  rationale: शब्द भूल करने, मार्ग से चूकने या भटकने का भाव रखता है; मूर्तिपूजा के प्रसंग में ‘भटक जाते हैं’ इस दायरे को बनाए रखता है।
- source_word: አምላኪየ
  choice: मेरा ईश्वर
  rationale: मूल का सीधा संबोधन ‘मेरा ईश्वर’ है। मूर्ति का प्रसंग इस दावे की विडंबना स्वयं स्पष्ट करता है।
- source_word: መባሕሕየ
  choice: मुझे छुड़ाने वाला
  rationale: यह मुक्त या बचाने वाले व्यक्ति का भाव देता है; ‘मुझे छुड़ाने वाला’ आधुनिक हिन्दी में स्पष्ट है और किसी विशेष पारिभाषिक धार्मिक अर्थ को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: मूर्ति को ‘ईश्वर’ कहने का संबोधन
  choice: ‘तू मेरा ईश्वर है’ को सीधे संबोधन के रूप में रखा गया
  alternative: ‘तू मेरा देवता है’
  rationale: मूल में सामान्य ‘ईश्वर/देव’ पद है। ‘ईश्वर’ वक्ताओं के दावे को बिना नरम किए व्यक्त करता है, जबकि प्रसंग उसकी असत्यता को स्पष्ट करता है।
- issue: अंतिम वाक्य में ‘मन/हृदय’ की पुनरावृत्ति
  choice: ‘उनके पास समझने वाला मन नहीं है’ दोहराया गया
  alternative: ‘उनमें कोई समझ नहीं है’
  rationale: परामर्श-पाठ के अनुसार यह आरंभिक कथन की जानबूझकर पुनरावृत्ति है; इसे बनाए रखने से पद की आवरणात्मक संरचना और नैतिक जोर सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लकड़ी’ और ‘पत्थर’ के सीधे संबोधन में एकवचन ‘तू’ मूल की निकटता और निर्जीव मूर्ति को संबोधित करने की विडंबना बनाए रखता है।
