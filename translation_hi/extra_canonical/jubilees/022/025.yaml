base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/025.yaml
  text: Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will keep you from corruption, and he will deliver you from every path of error.
translation:
  language: hi
  text: मत डर, मेरे पुत्र याकूब, और घबरा मत, अब्राहम के पुत्र। परमप्रधान परमेश्वर तुझे भ्रष्टता[a] से बचाएगा, और भूल के हर मार्ग से वह तेरा छुटकारा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विनाश” या “बिगाड़।”
    reason: गीज़ ሙስና में भ्रष्टता, बिगाड़, क्षय या विनाश की अर्थ-छाया हो सकती है।
lexical_decisions:
- source_word: አትፍራህ / አትደንግፅ
  choice: मत डर / घबरा मत
  rationale: दोनों निषेधों का अंतर रखते हुए स्वाभाविक आधुनिक हिन्दी में भय और व्याकुलता व्यक्त की गई है।
- source_word: ሙስና
  choice: भ्रष्टता
  rationale: शब्द नैतिक या सामान्य बिगाड़/क्षय का बोध करा सकता है; ‘भ्रष्टता’ मूल के व्यापक अर्थ के निकट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ፍኖተ፡ ስሕተት
  choice: भूल का मार्ग
  rationale: शाब्दिक संरचना ‘त्रुटि/भूल का मार्ग’ बनाए रखी गई है; यह केवल जानबूझकर किए पाप तक अर्थ को सीमित नहीं करती।
- source_word: ይዕቀብከ
  choice: तुझे ... से बचाएगा
  rationale: रक्षा करने और सुरक्षित रखने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: ይባልሕከ
  choice: तेरा छुटकारा करेगा
  rationale: दूसरे स्वतंत्र क्रियापद को बनाए रखते हुए मुक्ति/बचाव का भाव व्यक्त किया गया है।
theological_decisions:
- issue: दो दैवी क्रियाओं और उनके पूरकों का संबंध
  choice: ‘भ्रष्टता से बचाएगा’ और ‘भूल के हर मार्ग से ... छुटकारा करेगा’ को दो समानांतर खंडों के रूप में रखा गया है।
  alternative: दोनों ‘से’ पदबंधों को पहले क्रियापद के साथ जोड़कर अंत में केवल ‘वह तेरा छुटकारा करेगा’ रखना।
  rationale: गीज़ वाक्य-विन्यास में प्रत्येक पदबंध के साथ अलग क्रिया आती है; समानांतर हिन्दी संरचना इसी संबंध को स्पष्ट रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन की आत्मीयता और एकवचन निकटता बनाए रखने के लिए ‘तू/तेरा’ रूप प्रयुक्त है; पद्य की समानांतर संरचना सुरक्षित रखी गई है।
