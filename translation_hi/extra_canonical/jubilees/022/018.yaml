  yaml_path: translation/extra_canonical/jubilees/022/018.yaml
  text: And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
translation:
  language: hi
  text: और तू, मेरे बेटे याकूब, मेरी बात याद रख और अपने पिता अब्राहम की आज्ञाओं का पालन कर। अन्यजातियों से अपने को अलग रख; न उनके साथ भोजन कर, न उनके कामों के अनुसार चल, और न उनका साथी बन; क्योंकि उनके काम अशुद्ध हैं, और उनके सभी मार्ग अपवित्रता, घृणास्पदता और अशुद्धता हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለየ
  choice: मेरी बात
  rationale: मूल में ‘वचन/बात’ एकवचन है; आधुनिक हिन्दी में ‘मेरी बात याद रख’ स्वाभाविक रहते हुए उसका वचनात्मक बल बनाए रखता है।
- source_word: አሕዛብ
  choice: अन्यजातियाँ
  rationale: यह शब्द इस प्रसंग में इस्राएल से बाहर की जातियों/राष्ट्रों को सूचित करता है; ‘अन्यजातियाँ’ सामान्य बाइबलीय हिन्दी में इस भेद को स्पष्ट रखता है।
- source_word: ወኢትብላዕ፡ ምስሌሆሙ
  choice: न उनके साथ भोजन कर
  rationale: मूल का सीधा अर्थ साथ खाना है; इसे केवल सामान्य मेल-जोल के रूप में विस्तृत नहीं किया गया।
- source_word: ቢጸ
  choice: साथी
  rationale: यह मित्र या सहचर का भाव देता है; ‘साथी’ संबंध की निकटता को सरल, तटस्थ हिन्दी में व्यक्त करता है।
- source_word: ርኩስ
  choice: अशुद्ध
  rationale: यह नैतिक और विधिक दोनों प्रकार की अशुद्धता का अर्थ दे सकता है; ‘अशुद्ध’ उस व्यापकता को बनाए रखता है।
- source_word: ጐግኒ፡ ወምናኔ፡ ወስቆራር
  choice: अपवित्रता, घृणितता और अशुद्धता
  rationale: तीन नकारात्मक संज्ञाओं की संचयी सूची को बनाए रखा गया है; हिन्दी पर्याय मूल की तीव्र नैतिक-धार्मिक निंदा को व्यक्त करते हैं।
theological_decisions:
- issue: अन्यजातियों से अलगाव की आज्ञा
  choice: आज्ञा को प्रसंगानुसार सीधे रूप में रखा गया है
  alternative: इसे केवल उनके बुरे कर्मों से रूपकात्मक अलगाव कहना
  rationale: मूल पाठ व्यक्तियों/जातियों से अलग होने, उनके साथ न खाने, उनके कर्म न करने और उनका साथी न बनने—इन सभी को अलग-अलग कहता है; अनुवाद ने इस तनाव को नरम या पुनर्व्याख्यायित नहीं किया।
- issue: ‘अशुद्ध’ का स्वरूप
  choice: नैतिक अथवा विधिक अर्थ को अनिर्णीत रखा गया है
  alternative: इसे केवल नैतिक बुराई या केवल अनुष्ठानिक अशुद्धता कहना
  rationale: मूल शब्दावली दोनों अर्थ-क्षेत्रों को छू सकती है, इसलिए हिन्दी में व्यापक शब्द चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। संबोधन में ‘तू’ पिता द्वारा पुत्र को दिए गए निकट और गंभीर निर्देश के अनुरूप है; वाक्य की आज्ञात्मक लय और अंतिम त्रिस्तरीय निंदा सुरक्षित रखी गई है।
