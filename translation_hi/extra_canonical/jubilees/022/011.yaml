  yaml_path: translation/extra_canonical/jubilees/022/011.yaml
  text: And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people of inheritance according to his will all the days.”
translation:
  language: hi
  text: और उसने याकूब को बुलाकर कहा, “मेरे पुत्र याकूब, सबका परमेश्वर तुझे आशीष दे और उसके सामने धार्मिकता करने और उसकी इच्छा पूरी करने के लिए तुझे सामर्थ्य दे। वह तुझे और तेरे वंश को चुन ले, ताकि तुम उसकी इच्छा के अनुसार सदा उसके लिए विरासत की प्रजा बनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ኵሉ
  choice: सबका परमेश्वर
  rationale: गीज़ पदबंध का सीधा और स्वाभाविक हिन्दी रूप; परमेश्वर की सार्वभौमिकता सुरक्षित रहती है।
- source_word: ገቢረ፡ ጽድቅ፡ ወፈቃዱ
  choice: धार्मिकता तथा उसकी इच्छा के काम ... करने
  rationale: ‘करना/कार्य करना’, ‘धार्मिकता’ और ‘उसकी इच्छा’—तीनों मूल तत्त्वों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ዘርእከ
  choice: तेरे वंश
  rationale: सामूहिक ‘बीज/संतति’ के अर्थ में आधुनिक हिन्दी का स्पष्ट और गरिमापूर्ण रूप।
- source_word: ሕዝበ፡ ዘርስት
  choice: उसके निज भाग की प्रजा
  rationale: ‘विरासत/उत्तराधिकार की प्रजा’ का शाब्दिक हिन्दी रूप अस्पष्ट और अस्वाभाविक होता; ‘निज भाग’ चुने हुए स्वामित्व और विरासत-संबंधी अर्थ को व्यक्त करता है।
- source_word: በኵሉ፡ መዋዕለ
  choice: सदा
  rationale: शाब्दिक ‘सभी दिनों’ का स्वाभाविक हिन्दी समतुल्य, जिसमें निरंतरता का भाव बना रहता है।
theological_decisions:
- issue: ‘inheritance’ संबंधी पदबंध में परमेश्वर और प्रजा का संबंध
  choice: उसके निज भाग की प्रजा
  alternative: विरासत की प्रजा
  rationale: यह रूप प्रजा को परमेश्वर का चुना हुआ भाग बताता है, पर विरासत किससे या कैसे मिलती है जैसी अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: एकवचन याकूब और सामूहिक वंश के बाद सर्वनाम
  choice: ताकि तुम ... प्रजा बने रहो
  alternative: ताकि तू ... प्रजा बने
  rationale: ‘तुझे और तेरे वंश को’ दोनों को सम्मिलित करने के लिए बहुवचन भाव रखा गया है; इससे सामूहिक प्रजा बनने का आशय स्पष्ट होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आशीर्वचन का कामनार्थक स्वर ‘दे’ और ‘चुन ले’ से रखा गया है। ‘उसके सामने’ को मूल के अनुरूप सुरक्षित रखा गया है।
