base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/014.yaml
  text: Be strong before men[14], and while you rule among all the seed of Seth, then your ways and the ways of your sons will be justified, so that they may become a holy people.
translation:
  language: hi
  text: लोगों के सामने बलवान बनो; और जब तुम शेत के समस्त वंश के बीच शासन करोगे[a], तब तुम्हारे मार्ग और तुम्हारे पुत्रों के मार्ग न्यायोचित ठहरेंगे, ताकि वे एक पवित्र प्रजा बनें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश कठिन है। गीइज़ पाठ में स्पष्ट रूप से “शेत का वंश” है; याकूब के संबंध में इसका अर्थ शेत के वंश के बीच ऊँचा किया जाना, अथवा मनुष्यों के बीच प्रधान होना भी हो सकता है।
    reason: segmentation_note
lexical_decisions:
- source_word: ኩን፡ ኃያለ
  choice: सामर्थी बनो
  rationale: आज्ञार्थक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप; इसमें केवल शारीरिक बल नहीं, सामर्थ्य और दृढ़ता का व्यापक भाव बना रहता है।
- source_word: በቅድመ፡ ሰብእ
  choice: मनुष्यों के सामने
  rationale: पूर्वसर्ग और सामूहिक संज्ञा का निकट, सहज अनुवाद।
- source_word: ትሜብል
  choice: शासन करोगे
  rationale: अंग्रेज़ी परामर्श-पाठ के अनुरूप राजकीय या श्रेष्ठ स्थिति का भाव व्यक्त करता है, पर कठिन गीइज़ पद के वैकल्पिक 'ऊँचे किए जाने' के अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ኵሉ፡ ዘርአ፡ ሴት
  choice: शेत के समस्त वंश
  rationale: गीइज़ में स्पष्ट रूप से उल्लिखित 'शेत के बीज/वंश' को बनाए रखा गया है; 'वंश' आधुनिक हिन्दी में स्वाभाविक सामूहिक अर्थ देता है।
- source_word: ፍናዊከ፡ ወፍናዊ፡ ውሉድከ
  choice: तुम्हारे मार्ग और तुम्हारे पुत्रों के मार्ग
  rationale: दोनों रूपों की बहुवचनता को नवीनतम स्रोत-समीक्षा के अनुसार सुरक्षित रखा गया है।
- source_word: ይጸድቃ
  choice: धर्मी ठहरेंगे
  rationale: धार्मिक-न्यायिक अर्थ और निष्क्रिय/स्थिति-परिवर्तन की छाया बनाए रखता है; केवल 'सही होंगे' कहने से मूल की धार्मिक गहनता घटती।
- source_word: ሕዝብ፡ ቅዱስ
  choice: एक पवित्र प्रजा
  rationale: सामूहिक और वाचा-संबंधी अर्थ के लिए 'प्रजा' उपयुक्त है; 'लोग' की अपेक्षा यह एक गठित समुदाय का भाव अधिक स्पष्ट करता है।
theological_decisions:
- issue: मार्गों के धर्मी ठहरने का अर्थ
  choice: धर्मी ठहरेंगे
  alternative: सही सिद्ध होंगे / धर्ममय होंगे
  rationale: मूल क्रिया धार्मिकता और न्यायोचित ठहराए जाने, दोनों की छाया रख सकती है। चुना हुआ रूप इस तनाव को पूरी तरह किसी एक व्यवस्थित धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
- issue: पवित्र प्रजा बनने का संबंध
  choice: ताकि वे एक पवित्र प्रजा बनें
  alternative: और इस प्रकार एक पवित्र प्रजा बने
  rationale: बहुवचन 'वे' निकटतम मानवीय समूह—पुत्रों/वंशजों—की ओर संकेत करने देता है, जबकि उद्देश्यसूचक संबंध को बनाए रखता है; इसे मार्गों के साथ कृत्रिम रूप से नहीं जोड़ा गया।
- issue: शेत के वंश के बीच याकूब की स्थिति
  choice: शासन करोगे
  alternative: ऊँचे किए जाओगे / महान ठहरोगे
  rationale: पाठ कठिन है। मुख्य पाठ में परामर्श-अनुवाद का शासन-संबंधी अर्थ रखा गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है, ताकि अस्पष्टता छिपे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। 'शेत', 'धर्मी ठहरेंगे' और 'पवित्र प्रजा' जैसे पद स्रोत की धार्मिक और वंशावली-संबंधी भाषा को बनाए रखते हैं।
