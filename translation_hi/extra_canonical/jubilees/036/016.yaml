translation:
  language: hi
  text: और जन्मसिद्ध अधिकार के विषय में मेरा मन आनन्दित हुआ है, क्योंकि तुमने उसके संबंध में हिंसा नहीं की। प्रभु तुम्हें आशीष दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃን
  choice: पहलौठे का अधिकार
  rationale: प्रसंग में यह ज्येष्ठ पुत्र को मिलने वाले जन्मसिद्ध अधिकार को सूचित करता है; आधुनिक हिन्दी में यह पद अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ፁገ
  choice: हिंसा
  rationale: यहाँ अधिकार के कारण या उसके संबंध में बल अथवा हिंसक कृत्य करने का भाव है; इसलिए स्रोत की नैतिक तीव्रता बनाए रखने हेतु ‘हिंसा’ चुना गया है।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ पद का सामान्य अर्थ ‘प्रभु’ है; स्रोत में ‘परमप्रधान’ जैसा कोई अतिरिक्त विशेषण नहीं है।
theological_decisions:
- issue: निषेधात्मक क्रिया का कर्ता
  choice: तुमने ... हिंसा नहीं की
  alternative: उसके कारण कोई हिंसा नहीं की गई
  rationale: ኢትግበር द्वितीय पुरुष एकवचन सक्रिय रूप है, इसलिए संबोधित व्यक्ति को ही कर्ता रखा गया है; निष्क्रिय अनुवाद व्याकरणिक सूचना को मिटा देता।
- issue: अंतिम आशीर्वाद में कर्म
  choice: प्रभु तुम्हें आशीष दे
  alternative: प्रभु आशीष दे
  rationale: स्रोत का वाक्य संक्षिप्त है, पर प्रत्यक्ष संबोधन और प्रसंग से ‘तुम्हें’ स्वाभाविक रूप से निहित है; इसे पाठ में देने से हिन्दी पूर्ण और स्पष्ट रहती है, जबकि पादटिप्पणी स्रोत की संक्षिप्तता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और शास्त्रीय प्रसंग के अनुकूल रूप रखा गया है। ‘मेरा मन आनन्दित हुआ है’ स्रोत के हृदयगत हर्ष को स्वाभाविक हिन्दी में व्यक्त करता है; अनावश्यक धर्मसांप्रदायिक शब्दावली से बचा गया है।
