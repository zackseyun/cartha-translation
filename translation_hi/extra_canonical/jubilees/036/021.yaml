  text: उसने अपने जन्म के दिनों को विभाजित किया। और पैंतालीसवीं जुबली के दूसरे सप्ताह के चौथे वर्ष में उसकी पत्नी लिआ की मृत्यु हो गई। उसने उसे अपनी माता रिबका के निकट, दोहरी गुफा में दफ़नाया।[a]
