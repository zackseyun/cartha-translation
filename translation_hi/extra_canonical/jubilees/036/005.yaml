base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/005.yaml
  text: And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.
translation:
  language: hi
  text: और मूर्तियों के विषय में मैं तुम्हें आज्ञा देता और आग्रह करता हूँ कि तुम उन्हें तुच्छ जानो, उन्हें अस्वीकार करो और उनसे प्रेम न करो; क्योंकि जो उनकी उपासना करते हैं और उनके आगे दण्डवत् होते हैं, उनके लिए वे भ्रांति से भरी हुई हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጣዖት
  choice: मूर्तियाँ
  rationale: गीज़ शब्द का आशय उपासना के लिए प्रयुक्त प्रतिमाओं या idols से है; आधुनिक हिन्दी में ‘मूर्तियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: አአዝዘክሙ፡ ወእጌሥጸክሙ
  choice: मैं तुम्हें आज्ञा देता और समझाता हूँ
  rationale: दोनों क्रियाओं—आदेश देने और गंभीरता से प्रेरित/चेतावनी देने—का भेद बनाए रखा गया है।
- source_word: ትመንንምዎሙ፡ ወተጸረርዎሙ
  choice: तुम उन्हें तुच्छ जानो, उनका विरोध करो
  rationale: पहली क्रिया अवमानना/त्याग और दूसरी प्रतिरोध या विरोध व्यक्त करती है; दोनों समानांतर भाव सुरक्षित रखे गए हैं।
- source_word: ስሕተት፡ ምሉአን
  choice: पूरी तरह भटकावे से भरी
  rationale: शाब्दिक ‘त्रुटि से पूर्ण’ की अपेक्षा यह हिन्दी में स्वाभाविक है और धार्मिक भ्रम/पथभ्रष्टता का स्रोतगत अर्थ रखता है।
- source_word: ያመልኩዎሙ፡ ... ይሰግዱ፡ ሎሙ
  choice: उनकी उपासना करते और उनके आगे दण्डवत् होते हैं
  rationale: उपासना और शारीरिक रूप से झुकने की अलग-अलग क्रियाएँ स्पष्ट रखी गई हैं।
theological_decisions:
- issue: मूर्तियों को ‘भटकावे से भरी’ कहने का संबंध
  choice: ‘उनके लिए’ बनाए रखा गया
  alternative: ‘वे उन लोगों को पूरी तरह भटका देती हैं’
  rationale: स्रोत की संबंधसूचक रचना और उसकी कुछ हद तक असामान्य अभिव्यक्ति को कारणात्मक व्याख्या में बदले बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दण्डवत्’ उपासना-संदर्भ में परिचित शब्द है और मूल में निहित झुकने की शारीरिक क्रिया को व्यक्त करता है।
