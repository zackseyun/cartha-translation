  yaml_path: translation/extra_canonical/jubilees/036/009.yaml
  text: But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.
translation:
  language: hi
  text: पर यदि तुममें से कोई अपने भाई के विरुद्ध बुराई की योजना बनाए, तो अब से जान लो कि जो कोई अपने भाई के विरुद्ध बुराई की योजना बनाएगा, वह उसके भाई के हाथ में पड़ जाएगा[a], जीवितों की भूमि से काट डाला जाएगा, और उसका वंश आकाश के नीचे से मिटा दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके हाथ में।” सर्वनाम का संदर्भ व्याकरण की दृष्टि से अस्पष्ट हो सकता है; प्रसंग में संभवतः उस भाई का हाथ अभिप्रेत है जिसके विरुद्ध बुराई की योजना बनाई गई है।
    reason: मूल गीइज़ सर्वनाम के संभावित संदर्भ को सुरक्षित रखना, जबकि मुख्य पाठ में प्रसंगानुकूल अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: ዘኀሠሠ / ዘየኀሥሥ
  choice: बुराई की योजना बनाए
  rationale: मूल क्रिया में खोजने, चाहने या किसी के विरुद्ध बुरा इरादा रखने का भाव है; प्रसंग में यह जानबूझकर भाई का अहित रचने को व्यक्त करता है।
- source_word: ውስተ፡ እዴሁ፡ ይወድቅ
  choice: अपने भाई के हाथ में पड़ जाएगा
  rationale: ‘हाथ में पड़ना’ किसी के वश या अधिकार में आने का स्वाभाविक हिन्दी मुहावरा है। प्रसंग निकटतम अर्थ के रूप में पीड़ित भाई की ओर संकेत करता है, जबकि सर्वनाम की शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ይሤር
  choice: मिटा दिया जाएगा
  rationale: यहाँ क्रिया जीवितों की भूमि से उखाड़े या काटे जाने, अर्थात वहाँ से पूर्णतः हटा दिए जाने का भाव देती है।
- source_word: ዘርኡ
  choice: उसका वंश
  rationale: ‘बीज’ का वंशगत अर्थ अभिप्रेत है; आधुनिक हिन्दी में ‘वंश’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: ይትሐጐል
  choice: लुप्त हो जाएगा
  rationale: क्रिया के नष्ट होने, मिट जाने या गायब हो जाने के अर्थ को वंश के संदर्भ में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘उसके हाथ’ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘अपने भाई के हाथ में’
  alternative: ‘अपने ही हाथ में’ या अधिक शाब्दिक ‘उसके हाथ में’
  rationale: वक्ता का तात्पर्य सबसे स्वाभाविक रूप से यह है कि भाई का अहित चाहने वाला उसी भाई के वश में पड़ेगा। फिर भी गीइज़ सर्वनाम स्वयं स्पष्ट रूप से प्रतिवर्ती नहीं है, इसलिए शाब्दिक अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर वचन की चेतावनीपूर्ण और गरिमामय लय बनाए रखी गई है। ‘जीवितों की भूमि’ तथा ‘आकाश के नीचे’ जैसे मूल बिंब औपचारिक धार्मिक शैली और स्रोत-संगति के लिए सुरक्षित रखे गए हैं।
