review_pass:
  verdict: revise
  source_fidelity: The specific spatial term is correctly rendered as “बाईं ओर.” However, the draft collapses the source’s contrast between “all her sons” and “his sons” by using the same unqualified Hindi possessive twice. The revised wording retains the two distinct groups without adding doctrinal interpretation.
  naturalness: “उसके पिता की माता सारा” is understandable but awkward in modern standard Hindi. “उसकी पितामही सारा” is concise, natural, and exact. “दुःखी था” is acceptable, though “शोक कर रहा था” more directly conveys the mourning context.
  terminology: “कब्र,” “शोक मनाने,” and “सांत्वना देने” are appropriate modern, dignified terms. “लेआ” is used as a standard Hindi transliteration of Leah.
  issues:
  - severity: medium
    issue: The two possessive references in “उसके सभी पुत्र और उसके पुत्र” are indistinguishable in Hindi.
    rationale: The source/audit trail distinguishes her sons from his sons. The Hindi should preserve that distinction, while retaining the passage’s otherwise compressed context.
  - severity: low
    issue: “उसके पिता की माता” is an overly literal and awkward kinship expression.
    rationale: “उसकी पितामही” expresses “his father’s mother” naturally and precisely in standard Hindi.
