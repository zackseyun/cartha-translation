  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी रखी गई है। स्रोत के खंडात्मक आरंभ को बनाए रखा गया है, क्योंकि पद पिछले वाक्य से जुड़ता है। ‘उसके सभी पुत्र और उसके पुत्र’ का स्रोतगत सर्वनाम-अंतर अस्पष्ट लग सकता है, फिर भी उसे व्याख्यात्मक नाम जोड़कर हल नहीं किया गया।
