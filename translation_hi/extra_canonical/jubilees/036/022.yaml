  yaml_path: translation/extra_canonical/jubilees/036/022.yaml
  text: to the left of the grave of Sarah, his father’s mother. And all her sons and his sons came to mourn Leah his wife with him and to comfort him for her, because he was grieving for her.
translation:
  language: hi
  text: उसकी पितामही सारा की कब्र के बाईं ओर। और लेआ के सभी पुत्र और उसके पति के पुत्र उसके साथ उसकी पत्नी लेआ के लिए शोक मनाने और उसके कारण उसे सांत्वना देने आए, क्योंकि वह उसके लिए शोक कर रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በፀጋመ
  choice: बाईं ओर
  rationale: गीज़ ፀጋም स्थान की विशिष्ट बाईं दिशा बताता है; इसलिए सामान्य ‘किनारे’ की अपेक्षा ‘बाईं ओर’ अधिक सटीक है।
- source_word: ይብክይዋ
  choice: के लिए शोक मनाने
  rationale: प्रसंग में यह क्रिया मृत लिआ के लिए रोने और मातम करने को व्यक्त करती है; स्वाभाविक हिन्दी में ‘शोक मनाने’ उपयुक्त है।
- source_word: ይናዝዝዎ
  choice: उसे सांत्वना देने
  rationale: यह शोकग्रस्त व्यक्ति को ढाढ़स बँधाने का भाव देता है; ‘सांत्वना देना’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ይሳቀዮ
  choice: दुःखी था
  rationale: क्रिया पीड़ा या शोक सहने का भाव रखती है; इस शोक-संदर्भ में ‘दुःखी था’ सहज है।
