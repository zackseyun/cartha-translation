base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/007.yaml
  text: And now I make you swear by a great oath, for there is no oath greater than it, by the glorious and honorable and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you may be those who fear him and those who worship him.
translation:
  language: hi
  text: और अब मैं तुम्हें एक बड़ी शपथ दिलाता हूँ—क्योंकि इससे बड़ी कोई शपथ नहीं है—उसके महिमामय, आदरणीय, महान, भव्य, अद्भुत और सामर्थी नाम की, जिसने आकाशों और पृथ्वी को और सब वस्तुओं को एक साथ[a] बनाया, ताकि तुम उससे डरनेवाले और उसकी आराधना करनेवाले बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी सृष्टि को।”
    reason: ወኵሎ፡ ኅቡረ का शाब्दिक अर्थ ‘सब [वस्तुओं] को एक साथ’ है, जबकि प्रसंग में इसे सामूहिक रूप से ‘सारी सृष्टि’ भी समझा जा सकता है।
lexical_decisions:
- source_word: አምሕለክሙ፡ በመሐላ፡ ዐቢይ
  choice: मैं तुम्हें एक बड़ी शपथ दिलाता हूँ
  rationale: प्रेरणार्थक क्रिया और ‘बड़ी शपथ’ की स्रोत-संरचना को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ስቡሕ፡ ወክቡር፡ ወዐቢይ፡ ወስፉሕ፡ ወመንክር፡ ወኀያል
  choice: महिमामय, आदरणीय, महान, भव्य, अद्भुत और सामर्थी
  rationale: नाम के लिए प्रयुक्त सभी छह विशेषणों को उसी क्रम में रखा गया है; ስፉሕ के विस्तार/वैभव-बोध को प्रसंगानुकूल ‘भव्य’ से व्यक्त किया गया है।
- source_word: ሰማያተ፡ ወምድረ
  choice: आकाशों और पृथ्वी को
  rationale: ሰማያተ के बहुवचन और ምድረ के एकवचन को सुरक्षित रखा गया है।
- source_word: ወኵሎ፡ ኅቡረ
  choice: और सब वस्तुओं को एक साथ
  rationale: ኵሎ के समग्र अर्थ और ኅቡረ की ‘एक साथ/मिलाकर’ शक्ति को स्पष्ट रूप से सुरक्षित रखा गया है; इसे केवल ‘सारी सृष्टि’ कहकर संक्षिप्त नहीं किया गया।
- source_word: ከመ፡ ትኩኑ
  choice: ताकि तुम ... बनो
  rationale: उद्देश्यसूचक ከመ और संभाव्य/आज्ञार्थक भाव को भविष्यवाणी की तरह निश्चित किए बिना व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वर के नाम पर दिलाई गई शपथ में विशेषणों की पूरी शृंखला
  choice: सभी छह विशेषणों को स्पष्ट रूप से बनाए रखा गया
  alternative: विशेषणों को घटाकर केवल ‘महान और महिमामय नाम’ कहना
  rationale: स्रोत की स्तुतिपरक तीव्रता और धर्मवैचारिक वजन को संक्षिप्त करके कम नहीं किया गया।
- issue: ‘डरना’ और ‘आराधना करना’ का संबंध
  choice: दोनों को अलग किंतु समानांतर पदों के रूप में रखा गया
  alternative: ‘श्रद्धापूर्वक आराधना करना’ में दोनों को मिला देना
  rationale: स्रोत में दो अलग सहभागी पद हैं; अनुवाद उनकी संभावित अर्थगत भिन्नता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। लंबे शपथ-वाक्य को डैशों से व्यवस्थित किया गया है, पर स्रोत का क्रम और संचयी अलंकार सुरक्षित है।
