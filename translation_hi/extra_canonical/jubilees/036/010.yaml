  yaml_path: translation/extra_canonical/jubilees/036/010.yaml
  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
translation:
  language: hi
  text: और उपद्रव, शाप, प्रचंड क्रोध और कोप के दिन, धधकती और भस्म कर देनेवाली आग से—जैसे उसने सदोम को जला दिया था—वैसे ही वह उसकी भूमि, उसके नगर और उसकी हर वस्तु को जला देगा। वह मनुष्यों की संतानों की अनुशासन-पुस्तक से मिटा दिया जाएगा[a] और जीवन की पुस्तक में नहीं चढ़ाया जाएगा, बल्कि वह उसमें जाएगा जो विनाश के लिए ठहराया गया है। वह अनन्त शाप में चला जाएगा, ताकि उनका न्याय सब दिनों तक धिक्कार, शाप, कोप, यातना, प्रचंड क्रोध, महामारियों और अनन्त रोग के साथ नवीकृत होता रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्यों की संतानों की अनुशासन-पुस्तक’ वाला वाक्यांश पाठ की दृष्टि से कठिन है। गीज़ पाठ इसे ‘जीवन की पुस्तक’ से अलग बताता हुआ प्रतीत होता है, पर पहली पुस्तक का ठीक आशय अनिश्चित है।
    reason: textual_variant
  - marker: b
    text: प्रचलित मुद्रित पाठ में यहाँ एक दूषित शब्द-रूप है। पाठ-समीक्षा के आधार पर वाक्य का अर्थ ‘उनका न्याय ... नवीकृत होता रहे’ लिया गया है। अंतिम पंक्ति में निकटार्थी शाप और दण्ड-सूचक शब्दों का संचय मूल की चेतावनीपूर्ण शैली के अनुसार सुरक्षित रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ሁከት
  choice: उपद्रव
  rationale: यह शब्द अशांति, हलचल या उत्पात का भाव देता है; ‘उपद्रव’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ቍጥዓ / መዓት
  choice: प्रचंड क्रोध / कोप
  rationale: पास-पास आए दोनों क्रोध-सूचक शब्दों का संचय बनाए रखने के लिए दो अलग किन्तु निकटार्थी हिन्दी शब्द चुने गए हैं।
- source_word: ተግሣጽ
  choice: अनुशासन
  rationale: शब्द में ताड़ना, चेतावनी और सुधारात्मक शिक्षा का क्षेत्र है; संदिग्ध पुस्तक-नाम में किसी एक संकीर्ण अर्थ को थोपे बिना ‘अनुशासन’ उपयुक्त है।
- source_word: ዘይትሐጐል
  choice: जो विनाश के लिए ठहराया गया है
  rationale: यह विनाश या नष्ट होने के लिए नियत वस्तु/लेख का संकेत देता है; मूल की अनिश्चित संज्ञा को स्पष्ट पुस्तक-नाम में नहीं बदला गया।
- source_word: መርገም ዘለዓለም
  choice: अनन्त शाप
  rationale: मूल के स्थायी और न्यायिक अभिशाप के भाव को सीधे बनाए रखता है।
- source_word: ትትሔደስ
  choice: नया होता रहे
  rationale: पुनर्नवीकरण की अपूर्ण/निरन्तर क्रिया को व्यक्त करता है और नवीन पाठ-समीक्षा के अनुसार छूटा हुआ भाव पुनः स्थापित करता है।
theological_decisions:
- issue: ‘अनुशासन-पुस्तक’ और ‘जीवन की पुस्तक’ का संबंध
  choice: दो अलग अभिलेखों के रूप में अनुवाद किया गया
  alternative: पहली अभिव्यक्ति को जीवन की पुस्तक का ही वर्णन मानना
  rationale: गीज़ पाठ दोनों के बीच स्पष्ट संयोजन और विरोध रखता है; उनकी धर्मशास्त्रीय पहचान को एक कर देना मूल की कठिनाई मिटा देता।
- issue: विनाश के लिए ठहराई गई वस्तु की पहचान
  choice: ‘उसमें जो विनाश के लिए ठहराया गया है’
  alternative: ‘विनाश की पुस्तक’
  rationale: मूल में दूसरी जगह ‘पुस्तक’ शब्द स्पष्ट रूप से दोहराया नहीं गया; इसलिए काल्पनिक निश्चित पुस्तक-नाम नहीं बनाया गया।
- issue: अंतिम न्याय का वचन और वचन-संख्या
  choice: ‘उनका न्याय ... नया होता रहे’
  alternative: ‘वे उसे धिक्कारते रहें’
  rationale: पाठ-समीक्षा से प्राप्त रूप ‘उनका न्याय’ और ‘नया होते हुए’ का समर्थन करता है; बहुवचन को एकवचन बनाकर तनाव नहीं मिटाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर न्याय, शाप और पुस्तकों की गंभीर छवि के अनुरूप गरिमापूर्ण शैली रखी गई है। लंबे मूल वाक्य को पठनीय बनाने के लिए वाक्य-विभाजन किया गया, जबकि समानार्थी दण्ड-सूचक शब्दों की आवृत्ति और अलंकारिक तीव्रता बनाए रखी गई है।
