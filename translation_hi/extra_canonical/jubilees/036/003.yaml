  to: 'और मेरे पुत्रों, मैं तुम्हें यह आज्ञा देता हूँ: पृथ्वी पर धार्मिकता और खराई के काम करो, ताकि यहोवा उन सब बातों को तुम पर पूरा करे जिन्हें करने की बात यहोवा ने अब्राहम और उसके वंश के लिए कही थी।'
