base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/003.yaml
  text: 'And this I command you, my sons: do righteousness and uprightness on the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.'
translation:
  language: hi
  text: 'और मेरे पुत्रों, मैं तुम्हें यह आज्ञा देता हूँ: पृथ्वी पर धार्मिकता और खराई के काम करो, ताकि यहोवा उन सब बातों को तुम पर पूरा करे जिन्हें करने की बात यहोवा ने अब्राहम और उसके वंश के लिए कही थी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ
  choice: धार्मिकता
  rationale: गीज़ शब्द न्यायपूर्ण और धर्मसम्मत आचरण को व्यक्त करता है; ‘धार्मिकता’ इस नैतिक अर्थ को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ወርትዐ
  choice: खराई
  rationale: यह शब्द सीधेपन, सत्यनिष्ठा और उचित आचरण का भाव देता है; ‘खराई’ ‘धार्मिकता’ के साथ उसके समानांतर किंतु अलग अर्थ को सुरक्षित रखता है।
- source_word: ዘርኡ
  choice: उसके वंश
  rationale: ‘वंश’ सामूहिक संतति के अर्थ को बनाए रखता है और कृत्रिम रूप से किसी एक वंशज तक अर्थ को सीमित नहीं करता।
- source_word: ያምጽእ ... ላዕሌክሙ
  choice: तुम पर पूरा करे
  rationale: शाब्दिक रूप से ‘तुम पर लाए’ है, पर प्रतिज्ञात बातों के संदर्भ में हिंदी में ‘तुम पर पूरा करे’ परिणाम और संबंध दोनों को अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: अब्राहम और उसके वंश से कही गई बातों का आशय
  choice: सामान्य और सामूहिक ‘उसके वंश’ रखा गया
  alternative: ‘उसकी संतान’ या किसी विशिष्ट उत्तराधिकारी की ओर संकेत
  rationale: मूल ዘርኡ सामूहिक या एकवचन-सामूहिक अर्थ रख सकता है; पद स्वयं किसी विशिष्ट मसीही या वंशगत व्याख्या को स्पष्ट नहीं करता।
- issue: ईश्वरीय प्रतिज्ञा और आज्ञापालन का संबंध
  choice: उद्देश्यसूचक ‘ताकि’ बनाए रखा गया
  alternative: आज्ञापालन को केवल प्रतिज्ञा का प्रमाण या परिणाम बताना
  rationale: मूल पाठ धार्मिक और खरे आचरण को उस उद्देश्य से जोड़ता है कि प्रभु कही हुई बातें उन पर लाए; इस तनाव को बिना व्यवस्थित धर्मवैज्ञानिक व्याख्या जोड़े सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, प्रत्यक्ष पितृ-संबोधन रखा गया है। ‘पुत्रो’ संबोधन-बहुवचन है। दिव्य नाम को प्रचलित हिंदी बाइबिलीय रूप ‘यहोवा’ से व्यक्त किया गया है।
