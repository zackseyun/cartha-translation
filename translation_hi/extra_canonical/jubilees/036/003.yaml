review_pass:
  verdict: revise
  source_fidelity: Draft incorrectly renders the final clause as what the LORD said to Abraham and his seed. The Geʽez construction, supported by the English audit trail, means what the LORD said he would do for Abraham and for his seed. The revised wording restores this essential directional sense. The purpose/result relationship and the collective sense of “seed” are retained.
  naturalness: The revised Hindi is modern, formal, and natural. “मेरे पुत्रों” is the standard modern vocative spelling, and “के लिए करने की बात कही थी” clearly expresses the promised action without adding interpretation.
  terminology: “धार्मिकता,” “खराई,” “यहोवा,” and “वंश” suitably preserve the moral, divine-name, and collective-descendant terminology of the source. No doctrinal specification is introduced.
  issues:
  - severity: high
    issue: The final clause says that the LORD spoke “to Abraham and his seed.”
    rationale: The source says that the LORD said he would do these things for Abraham and for his seed; changing “for” to “to” materially alters the referent and sense of the promise.
  - severity: low
    issue: Vocative plural is written “पुत्रो.”
    rationale: Modern standard Hindi normally writes the plural vocative as “पुत्रों.”
  revised_text: 'और मेरे पुत्रों, मैं तुम्हें यह आज्ञा देता हूँ: पृथ्वी पर धार्मिकता और खराई के काम करो, ताकि यहोवा उन सब बातों को तुम पर पूरा करे जिन्हें करने की बात यहोवा ने अब्राहम और उसके वंश के लिए कही थी।'
  revised_footnotes: []
  revision_rationale: 'The revision corrects the directional meaning in the final clause: the LORD’s stated action is for Abraham and his seed, not speech addressed to them. It also standardizes the Hindi vocative spelling while retaining the draft’s register, vocabulary, and purpose clause.'
