base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/012.yaml
  text: And he divided all the possessions that he had between them on that day, and he gave the greater share to the man who was born first, and the tower[12] and all that was around it, and all that Abraham had acquired at the Well of the Oath.
translation:
  language: hi
  text: 'और उस दिन उसने अपनी सारी संपत्ति उनके बीच बाँट दी। जो पुरुष पहले जन्मा था, उसे उसने बड़ा भाग दिया: मीनार[a], उसके चारों ओर जो कुछ था, और वह सब जो अब्राहम ने शपथ के कुएँ के पास अर्जित किया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मीनार’ शायद इसहाक को मिली संपत्ति में सम्मिलित किसी विशेष संरचना को दर्शाती है। मूल पाठ में विरासत की यह सूची बहुत संक्षिप्त है, और इस शब्द या वाक्य-विन्यास का अर्थ कुछ अनिश्चित हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ጥሪተ
  choice: संपत्ति
  rationale: यह स्पष्ट रूप से माल-मिल्कियत या धन-संपदा का सूचक संज्ञा है; इसलिए केवल ‘जो कुछ उसके पास था’ कहने के बजाय इसे प्रत्यक्ष रखा गया है।
- source_word: ዕበየ
  choice: बड़ा भाग
  rationale: संदर्भ में विभाजित संपत्ति के अपेक्षाकृत बड़े हिस्से का भाव है; सहज आधुनिक हिन्दी में ‘बड़ा भाग’ उपयुक्त है।
- source_word: ለብእሲ፡ ዘውእቱ፡ ቀደመ፡ ተወልደ
  choice: जो पुरुष पहले जन्मा था
  rationale: मूल में आए स्पष्ट ‘पुरुष’ और जन्म-क्रम, दोनों को बनाए रखा गया है।
- source_word: ማኅፈደ
  choice: मीनार
  rationale: शब्द का अर्थ यहाँ संभवतः किसी संपदा की मीनार अथवा दुर्गनुमा संरचना है; पाठ की अनिश्चितता को पादटिप्पणी में बताया गया है।
- source_word: ዐዘቅተ፡ መሐላ
  choice: शपथ का कुआँ
  rationale: स्थाननाम के घटकों का अर्थ-सापेक्ष अनुवाद किया गया है, जो बेर्शेबा से संबंधित पारंपरिक अभिव्यक्ति को दर्शाता है।
theological_decisions:
- issue: पहले जन्मे पुरुष को बड़े भाग का दिया जाना
  choice: कथन को संपत्ति-विभाजन के सीधे वर्णन के रूप में रखा गया है
  alternative: इसे विधिवत ‘ज्येष्ठाधिकार’ या दुगुने हिस्से की धार्मिक-कानूनी संज्ञा देना
  rationale: मूल केवल बड़े भाग और पहले जन्मे पुरुष की बात करता है; बाद की कानूनी या सांप्रदायिक अवधारणाएँ आरोपित नहीं की गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। लंबी समन्वित मूल-वाक्य रचना को पठनीयता के लिए दो वाक्यों में बाँटा गया है; डैश के बाद बड़े भाग में सम्मिलित संपदा का विवरण दिया गया है।
