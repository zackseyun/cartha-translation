  text: there was peace among them. And they went out from him and rested that day and slept. And Isaac slept on his bed five years[18], rejoicing, and he slept the eternal sleep and died at the age of one hundred and eighty years. He completed twenty-five weeks and five years. And his two sons buried him.
translation:
  language: hi
  text: उनके बीच शान्ति थी। वे उसके पास से निकल गए और उस दिन विश्राम किया और सो गए। इसहाक उस दिन आनन्दित होकर अपने बिस्तर पर सोया। फिर वह अनन्त नींद सो गया और एक सौ अस्सी वर्ष की आयु में मर गया[a]। उसने पच्चीस सप्ताह और पाँच वर्ष पूरे किए। उसके दोनों पुत्रों ने उसे दफ़नाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘पच्चीस सप्ताह’ का अर्थ वर्षों के पच्चीस सप्ताह, अर्थात् 175 वर्ष है; इनमें पाँच वर्ष जोड़ने पर कुल आयु 180 वर्ष होती है।
    reason: कैलेंडरी अभिव्यक्ति स्पष्ट करने और उसे ठीक पहले दिए गए आयु-विवरण से जोड़ने के लिए।
lexical_decisions:
- source_word: ዐርዮ
  choice: शान्ति
  rationale: यह शब्द मेल और शांतिपूर्ण संबंध की स्थिति को व्यक्त करता है; प्रसंग में सरल और स्वाभाविक हिन्दी ‘शान्ति’ उपयुक्त है।
- source_word: ዕለት
  choice: दिन
  rationale: स्रोत में दिन का स्पष्ट उल्लेख है; दूसरी बार आए संकेतवाचक रूप को ‘उसी दिन’ किया गया है।
- source_word: ንዋመ፡ ዘለዓለም
  choice: सदा की नींद
  rationale: स्रोत के स्थायी/अनन्त निद्रा वाले रूपक को बनाए रखता है और अगला वाक्यांश ‘मर गया’ उसके अर्थ को स्पष्ट करता है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल का कैलेंडरी शब्द ज्यों का त्यों रखा गया है; यहाँ इसका आशय वर्षों के सात-सात के समूहों से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ክልኤሆሙ፡ ውሉዱ
  choice: उसके दोनों पुत्रों
  rationale: मूल केवल ‘उसके दोनों पुत्र’ कहता है; पुत्रों के नाम जोड़ना स्रोत से परे होता।
theological_decisions:
- issue: ‘सदा की नींद’ और मृत्यु का संबंध
  choice: रूपक और उसके बाद मृत्यु—दोनों को अलग-अलग बनाए रखा गया
  alternative: इसे केवल ‘वह मर गया’ के रूप में समेट देना
  rationale: स्रोत निद्रा के रूपक और ‘मर गया’ दोनों को रखता है; अनुवाद किसी विशिष्ट परलोक-सिद्धान्त के अनुसार उनमें से एक को हटाता या समझाता नहीं है।
- issue: आयु और सप्ताहों का कैलेंडरी सारांश
  choice: एक सौ अस्सी वर्ष और पच्चीस सप्ताह तथा पाँच वर्ष—दोनों कथनों को स्रोत के क्रम में रखा गया
  alternative: ‘अर्थात्’ जोड़कर दोनों को एक ही कथन में मिला देना
  rationale: मूल में आयु का कथन और उसके बाद पूरा किए गए सप्ताहों व वर्षों का कथन अलग हैं; पादटिप्पणी उनकी गणितीय संगति बताती है, पर मुख्य पाठ की वाक्यरचना नहीं बदलती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘विश्राम करके सो गए’ मूल में आए दोनों क्रमिक क्रियापदों को बनाए रखता है। ‘उसी दिन’ स्रोत के संकेतवाचक काल-वाक्यांश का स्वाभाविक हिन्दी रूप है।
