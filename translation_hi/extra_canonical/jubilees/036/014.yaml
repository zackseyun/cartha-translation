  text: And Esau said, “I sold it to Jacob, and I gave the birthright to Jacob; let it be given to him, and I have no word to say about it, for it is his."”
translation:
  language: hi
  text: तब एसाव ने कहा, “मैंने उसे याकूब को बेच दिया और पहिलौठे का अधिकार याकूब को दे दिया। वह उसी को दिया जाए। इस विषय में मेरे पास कहने को कुछ नहीं है, क्योंकि वह उसी का है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤጥኩ፡ ሎቱ፡ ለያዕቆብ
  choice: मैंने उसे याकूब को बेच दिया
  rationale: क्रिया के निहित कर्म को हिन्दी में स्वाभाविकता के लिए ‘उसे’ से व्यक्त किया गया है; संदर्भ में यह पहिलौठे के अधिकार की ओर संकेत करता है।
- source_word: ልህቃነ
  choice: पहिलौठे का अधिकार
  rationale: यह शब्द ज्येष्ठ पुत्र को मिलने वाले विशेष अधिकार या जन्मसिद्ध अधिकार को सूचित करता है; आधुनिक हिन्दी में ‘पहिलौठे का अधिकार’ स्पष्ट और बाइबिलीय संदर्भ के अनुरूप है।
- source_word: ወይትወሀብ፡ ሎቱ
  choice: वह उसी को दिया जाए
  rationale: गीज़ के कर्मवाच्य और आज्ञार्थक/अनुमतिसूचक भाव को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ወአልቦየ፡ ቃለ፡ ዘእብል፡ በእንቲአሁ
  choice: इस विषय में मेरे पास कहने को कुछ नहीं है
  rationale: पूर्ण स्रोत-पाठ में आए ‘इसके विषय में कहने के लिए मेरे पास कोई वचन नहीं’ के भाव को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: እስመ፡ ዚአሁ፡ ውእቱ
  choice: क्योंकि वह उसी का है
  rationale: मूल के कारणसूचक वाक्य और स्वामित्व पर दिए गए बल को सीधे रूप में सुरक्षित रखा गया है।
