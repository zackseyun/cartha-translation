  text: the man who does righteousness, him and his seed forever.” And he finished commanding them and blessing them, and they ate and drank together before him and rejoiced,
translation:
  language: hi
  text: जो मनुष्य धार्मिकता के काम करता है, उसे और उसके वंश को सदा तक।” और उसने उन्हें आज्ञा देना और आशीष देना समाप्त किया, और उन्होंने उसके सामने मिलकर खाया-पिया और आनंद मनाया, क्योंकि[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद स्रोत-पाठ में “क्योंकि” पर समाप्त होता है; कारण बताने वाला वाक्य अगले पद में जारी है।
    reason: अध्याय-विभाजन के कारण उत्पन्न अधूरे वाक्य को ईमानदारी से दिखाना और स्रोत के እስመ (‘क्योंकि’) को न हटाना।
lexical_decisions:
- source_word: ብእሲ
  choice: मनुष्य
  rationale: यहाँ सामान्य पुरुषवाचक संज्ञा है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण रूप।
- source_word: ዘይገብር፡ ጽድቀ
  choice: जो धार्मिकता के काम करता है
  rationale: क्रिया ‘करना’ और संज्ञा ‘धार्मिकता/धर्ममय आचरण’ दोनों को बनाए रखता है; केवल ‘धर्मी है’ कहने से कर्म का भाव मिट जाता।
- source_word: ኪያሁ፡ ወዘርኦ
  choice: उसे और उसके वंश को
  rationale: प्रत्यक्ष कर्म तथा ‘बीज/सन्तान’ के वंशगत अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እንዘ፡ ይኤዝዞሙ፡ ወእንዘ፡ ይባርኮሙ
  choice: उन्हें आज्ञा और आशीष देकर
  rationale: दोनों समकालिक क्रियाओं को हिन्दी के कृदन्तीय ढाँचे में संक्षेप और स्वाभाविक रूप से रखा गया है।
- source_word: ኅቡረ
  choice: मिलकर
  rationale: साथ होने और सामूहिक सहभागिता का अर्थ सहज हिन्दी में देता है।
- source_word: ተፈሥሑ
  choice: आनन्द मनाया
  rationale: सामूहिक हर्ष के सक्रिय भाव को आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: धार्मिकता और आशीष का संबंध
  choice: ‘जो मनुष्य धार्मिकता के काम करता है, उसे और उसके वंश को सदा तक’—वाक्य को उसके शर्तात्मक/प्रतिफलात्मक तनाव सहित रखा गया है।
  alternative: इसे अनुग्रह, वाचा या उद्धार की किसी विशिष्ट धर्मसैद्धान्तिक व्याख्या के अनुसार विस्तार देना।
  rationale: स्रोत जितना कहता है उतना ही रखा गया है; किसी सम्प्रदायगत निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। स्रोत-पाठ पद के अंत में कारणसूचक ‘क्योंकि’ से आगे बढ़ता है, इसलिए उसे मुख्य पाठ में रखकर फुटनोट द्वारा स्पष्ट किया गया है।
