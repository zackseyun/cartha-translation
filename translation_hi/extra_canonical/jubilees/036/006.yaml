base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/006.yaml
  text: Remember, my sons, the LORD, the God of Abraham your father; and how I also worshipped him and served him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted throughout all generations forever.
translation:
  language: hi
  text: हे मेरे पुत्रों, यहोवा को स्मरण रखो, जो तुम्हारे पिता अब्राहम का परमेश्वर है; और यह भी कि मैंने धार्मिकता और आनंद के साथ उसकी उपासना और सेवा की, ताकि वह तुम्हें बढ़ाए, तुम्हारे वंश को आकाश के तारों के समान असंख्य करे, और तुम्हें भूमि में धार्मिकता के एक पौधे के रूप में रोपे, जो सभी पीढ़ियों तक सदा के लिए उखाड़ा न जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከርዎ
  choice: स्मरण रखो
  rationale: आज्ञार्थक बहुवचन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ለእግዚአብሔር
  choice: यहोवा
  rationale: इस पद में ईश्वर के विशिष्ट नाम/उपाधि को हिन्दी बाइबलीय परंपरा के परिचित रूप में प्रस्तुत किया गया है।
- source_word: አምላክየ ... ወተቀነዩኩ፡ ሎቱ
  choice: मैंने ... उसकी उपासना और सेवा की
  rationale: प्राप्त पाठ के कठिन አምላክየ को समीक्षात्मक रूप से አምለክዎ (‘मैंने उसकी उपासना की’) के भ्रष्ट पाठ के रूप में समझा गया है; ተቀነዩኩ को अलग क्रिया ‘सेवा की’ के रूप में सुरक्षित रखा गया है।
- source_word: ዘበጽድቅ፡ ወበፍሥሓ
  choice: धार्मिकता और आनन्द के साथ
  rationale: दोनों रीति-सूचक पदों को समानांतर रूप में रखा गया है।
- source_word: ዘርአክሙ
  choice: तुम्हारे वंश
  rationale: ‘बीज’ के वंशगत अर्थ को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: ተክለ፡ ጽድቅ
  choice: धार्मिकता के ... पौधे
  rationale: स्रोत के रोपण-रूपक को बनाए रखते हुए स्वाभाविक हिन्दी पदबंध चुना गया है।
- source_word: ዘኢይሤረዉ
  choice: उखाड़ा न जाए
  rationale: पौधे के रूपक के अनुरूप निष्क्रिय निषेध को अक्षुण्ण रखता है।
- source_word: ለኵሉ፡ ትውልድ፡ ዘለዓለም
  choice: सदा-सर्वदा, पीढ़ी-दर-पीढ़ी
  rationale: सभी पीढ़ियों और अनन्त स्थायित्व—दोनों बलों को सहज हिन्दी में सुरक्षित करता है।
theological_decisions:
- issue: कठिन पाठ አምላክየ का अर्थ
  choice: ‘मैंने उसकी उपासना ... की’ मानकर अनुवाद
  alternative: ‘वह मेरा परमेश्वर था’ अथवा केवल ‘मैं उसकी सेवा में समर्पित रहा’
  rationale: संदर्भ, सम्भावित लिपिकीय भ्रष्टता और प्राचीन पाठ की समीक्षात्मक समझ के आधार पर ‘मैंने उसकी उपासना की’ अधिक संगत है; साथ ही अगली क्रिया ‘सेवा की’ को छोड़ा नहीं गया।
- issue: वृद्धि और रोपण का कर्ता
  choice: परमेश्वर को कर्ता रखा गया
  alternative: निष्क्रिय या सामान्य आशीष-वाक्य
  rationale: स्रोत के क्रियात्मक अनुक्रम में उसी के बढ़ाने, वंश को बहुगुणित करने और रोपने का आशय स्पष्ट है।
- issue: ‘धार्मिकता का पौधा’ रूपक
  choice: सामूहिक संबोधन ‘तुम्हें’ के साथ एकवचन रूपक बनाए रखा
  alternative: ‘धार्मिकता के पौधों’ के रूप में बहुवचन
  rationale: स्रोत सामूहिक संतति को एक पौधे के रूप में प्रस्तुत करता है; इसे व्याख्यात्मक बहुवचन में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण बाइबलीय शैली। ‘हे मेरे पुत्रो’, ‘यहोवा’, ‘वंश’ और रोपण-रूपक सामान्य पाठक के लिए बोधगम्य रखते हुए स्रोत की औपचारिकता बनाए रखते हैं।
