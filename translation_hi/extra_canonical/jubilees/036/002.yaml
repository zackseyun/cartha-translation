  yaml_path: translation/extra_canonical/jubilees/036/002.yaml
  text: And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb that I dug for myself there, bury me.
translation:
  language: hi
  text: और मुझे मेरे पिता अब्राहम के पास, हित्ती एप्रोन के खेत में स्थित दोहरी गुफा में दफनाना, जिसे अब्राहम ने दफ़नाने के स्थान के लिए मोल लिया था। वहाँ जिस कब्र को मैंने अपने लिए खोदा है, उसी में मुझे दफनाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅሩበ
  choice: के पास
  rationale: यह स्थान-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ‘निकट’ की अपेक्षा वसीयतनुमा कथन में अधिक सहज है।
- source_word: ባዐት፡ ዘካዕበት
  choice: दोहरी गुफा
  rationale: शाब्दिक रूप से ‘दोगुनी/दोहरी गुफा’; पारंपरिक स्थलनाम का अनुमान लगाए बिना स्रोत की अभिव्यक्ति बनाए रखी गई है।
- source_word: ኤፍሮን፡ ኬጥያዊ
  choice: हित्ती एप्रोन
  rationale: व्यक्तिनाम और जातीय पहचान दोनों को स्रोत के अनुसार रखा गया है।
- source_word: ዘአጥረየ
  choice: मोल लिया था
  rationale: संपत्ति अर्जित करने के प्रसंग में ‘खरीदा/अधिग्रहित किया’ का अर्थ है; ‘मोल लिया’ सामान्य और प्रसंगानुकूल हिन्दी है।
- source_word: መቃብር
  choice: कब्रिस्तान / कब्र
  rationale: पहले प्रयोग में दफनाने के स्थान और दूसरे में विशिष्ट खोदी हुई कब्र का संदर्भ है; हिन्दी में प्रसंगानुसार अलग शब्द चुने गए हैं।
- source_word: ዘከረይኩ
  choice: जिसे मैंने ... खोदा है
  rationale: कब्र तैयार करने की ठोस क्रिया को स्रोत के निकट रखते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और वसीयतनुमा शैली रखी गई है। ‘दोहरी गुफा’ स्रोत की वास्तविक अभिव्यक्ति को सुरक्षित रखती है; इसे किसी पारंपरिक स्थलनाम से प्रतिस्थापित नहीं किया गया।
