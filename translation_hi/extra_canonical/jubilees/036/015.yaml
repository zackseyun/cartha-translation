translation:
  language: hi
  text: और इसहाक ने कहा, “हे मेरे पुत्रों, आज तुम पर और तुम्हारे वंश पर आशीष बनी रहे, क्योंकि तुमने मुझे विश्राम दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከተ
  choice: आशीष
  rationale: स्रोत का अर्थ ‘आशीष’ है; यह आधुनिक हिन्दी में स्वाभाविक और धार्मिक संदर्भ के लिए उपयुक्त है।
- source_word: አውሉድየ
  choice: हे मेरे पुत्रो
  rationale: संबोधन और बहुवचन दोनों को स्पष्ट रखते हुए स्रोत के ‘मेरे पुत्रों’ का स्वाभाविक हिन्दी रूप।
- source_word: ዘርእክሙ
  choice: तुम्हारे वंश
  rationale: ‘बीज/संतान’ के सामूहिक वंशगत अर्थ को ‘वंश’ सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: አዕረፍክሙኒ
  choice: तुमने मुझे विश्राम दिया है
  rationale: कारक अर्थ और पूर्ण हुई क्रिया को निकटता से सुरक्षित रखता है; प्रसंगगत अर्थ को अधिक विशिष्ट बनाकर नहीं बताता।
theological_decisions:
- issue: आशीष का व्याकरणिक रूप
  choice: आशीष बनी रहे
  alternative: आशीष ठहरे
  rationale: स्रोत में आशीष के उन पर विश्राम/ठहरने की छवि है; ‘बनी रहे’ आधुनिक हिन्दी में स्वाभाविक है और स्थायी उपस्थिति का भाव बचाता है।
- issue: ‘वंश’ का विस्तार
  choice: तुम्हारे वंश
  alternative: तुम्हारी संतानों
  rationale: ‘वंश’ सामूहिक और भावी पीढ़ियों तक खुला अर्थ रखता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु सामान्य पाठक के लिए सहज। संबोधन में ‘हे’ मूल की प्रत्यक्ष वाणी और आशीर्वचन की गंभीरता को बनाए रखता है।
