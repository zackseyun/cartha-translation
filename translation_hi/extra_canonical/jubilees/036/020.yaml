base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/020.yaml
  text: But Jacob dwelt on Mount Hebron, in the tower of the land of the sojourning of Abraham his father, and he worshiped the LORD with all his heart and according to the commandments as they were revealed,
translation:
  language: hi
  text: पर याकूब हेब्रोन पर्वत पर, उस मीनार[a] में रहा जो उसके पिता अब्राहम के प्रवास की भूमि में थी; और उसने अपने पूरे मन से तथा प्रकट की गई आज्ञाओं के अनुसार प्रभु की उपासना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “गढ़” अथवा “बाड़ा।” इस गीज़ शब्द का सटीक अर्थ अनिश्चित है।
    reason: दुर्लभ शब्द ማኅደድ के अर्थ को लेकर शब्दार्थगत अनिश्चितता है; मुख्य पाठ परंपरागत ‘मीनार’ को रखता है।
lexical_decisions:
- source_word: ኀደረ
  choice: रहा
  rationale: यह क्रिया निवास करने या ठहरने का भाव देती है; प्रसंग में स्थायी निवास के लिए सहज हिन्दी ‘रहा’ उपयुक्त है।
- source_word: ደብረ ኬብሮን
  choice: हेब्रोन पर्वत
  rationale: ደብር का मूल अर्थ ‘पर्वत’ है और ኬብሮን स्थान-नाम ‘हेब्रोन’ है।
- source_word: ማኅደድ
  choice: मीनार
  rationale: इस दुर्लभ स्थानवाचक संज्ञा के लिए परंपरागत अर्थ ‘tower’ को ‘मीनार’ से व्यक्त किया गया है; इसकी शब्दार्थगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ምድረ ፍልሰተ
  choice: प्रवास की भूमि
  rationale: दोनों घटकों—‘भूमि’ और ‘प्रवास/परदेश में निवास’—को स्पष्ट रूप से बनाए रखता है।
- source_word: አምላከ ለእግዚአብሔር
  choice: प्रभु की उपासना की
  rationale: क्रिया का धार्मिक आराधना-संबंधी अर्थ स्वाभाविक हिन्दी में व्यक्त होता है; እግዚአብሔር के लिए यहाँ ‘प्रभु’ रखा गया है।
- source_word: በኵሉ ልቡ
  choice: अपने पूरे मन से
  rationale: शाब्दिक भाव ‘अपने सारे हृदय से’ है; आधुनिक हिन्दी में ‘पूरे मन से’ वही समग्र निष्ठा सहजता से बताता है।
- source_word: ትእዛዛት ዘያስተርኢ
  choice: प्रकट की गई आज्ञाएँ
  rationale: बहुवचन ‘आज्ञाओं’ और प्रकट/प्रकाशित किए जाने के भाव, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम እግዚአብሔር का निरूपण
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: गीज़ पद सामान्यतः ‘प्रभु’ के अर्थ में है और यहाँ टेट्राग्राम का प्रत्यक्ष भाषिक रूप नहीं है; इसलिए किसी विशिष्ट नाम को आयात किए बिना ‘प्रभु’ चुना गया।
- issue: आज्ञाओं के प्रकट होने का कर्ता
  choice: निष्क्रिय वाक्यांश ‘प्रकट की गई’
  alternative: ‘जैसा परमेश्वर ने उन्हें प्रकट किया था’
  rationale: स्रोत में कर्ता स्पष्ट नहीं है; निष्क्रिय रचना उस वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रवास की भूमि’ मूल में उपस्थित ‘भूमि’ को नहीं छोड़ता। स्रोत-पाठ के उपलब्ध अंश को हिन्दी में पूर्ण वाक्य के रूप में विराम दिया गया है।
