  to: मेरे पुत्रो, मैं तुमसे उस न्याय के अनुसार यह घोषणा करता हूँ और गवाही देता हूँ कि वह उस मनुष्य पर आएगा जो अपने भाई के विरुद्ध बुराई करना चाहता है।
  rationale: This is a limited stylistic-syntactic revision. It preserves the source-supported ‘उस न्याय के अनुसार’ rather than recasting judgment as the direct object of the verbs, and it retains the forensic force of ‘गवाही देता हूँ.’ No footnote is needed because the supplied audit-trail notes record prior English renderings rather than a remaining textual ambiguity requiring a Hindi note.
