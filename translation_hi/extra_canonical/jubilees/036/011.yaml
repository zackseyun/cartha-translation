  text: I declare and testify to you, my sons, according to the judgment that will come upon the man who desires to do evil against his brother.
translation:
  language: hi
  text: मेरे पुत्रो, मैं तुमसे उस न्याय के अनुसार यह घोषणा करता हूँ और गवाही देता हूँ कि वह उस मनुष्य पर आएगा जो अपने भाई के विरुद्ध बुराई करना चाहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነግር
  choice: घोषणा करता
  rationale: यह क्रिया कहने या घोषित करने का भाव रखती है; प्रसंग में गंभीर सार्वजनिक कथन के लिए ‘घोषणा करता’ स्वाभाविक और गरिमापूर्ण है।
- source_word: አስምዕ
  choice: गवाही देता हूँ
  rationale: कारक रूप में ‘सुनाना’ संभव है, पर युग्मित क्रिया और न्याय-संबंधी प्रसंग में इसका साक्ष्यात्मक अर्थ ‘गवाही देना’ अधिक उपयुक्त है।
- source_word: በከመ፡ ኵነኔ
  choice: उस न्याय के अनुसार
  rationale: በከመ की तुलनात्मक/अनुरूपतामूलक शक्ति को बनाए रखते हुए यह रूप बताता है कि कथन आने वाले न्याय के अनुरूप है; इसे केवल ‘उस न्याय को’ नहीं बनाया गया।
- source_word: ሕሡመ
  choice: बुराई
  rationale: शब्द नैतिक बुराई या दुष्कर्म को व्यक्त करता है; ‘हानि’ की अपेक्षा ‘बुराई’ स्रोत के नैतिक भार को बेहतर बनाए रखती है।
- source_word: ዘይፈቅድ፡ ይግበር
  choice: जो ... करना चाहता है
  rationale: इच्छा/संकल्प और करने की आश्रित क्रिया को आधुनिक हिन्दी में स्पष्ट तथा सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: न्याय से वाक्य का संबंध
  choice: ‘उस न्याय के अनुसार’ को मुख्य पाठ में रखा
  alternative: ‘उस न्याय की घोषणा करता हूँ’
  rationale: स्रोत में በከመ उपस्थित है, इसलिए न्याय को केवल प्रत्यक्ष कर्म बनाना व्याकरणिक संबंध को बदल देता।
- issue: भाई के विरुद्ध बुराई की नैतिक गंभीरता
  choice: ‘बुराई करना’
  alternative: ‘हानि पहुँचाना’
  rationale: स्रोत का शब्द केवल परिणामस्वरूप हानि नहीं, बल्कि नैतिक रूप से बुरे आचरण को भी सामने रखता है; अतः व्यापक तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘मेरे पुत्रो’ संबोधन को आरंभ में रखकर हिन्दी वाक्य को स्वाभाविक बनाया गया है, जबकि घोषणा, गवाही और आने वाले न्याय की गंभीरता सुरक्षित रखी गई है।
