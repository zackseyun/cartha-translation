review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the paired speech/witness verbs, the 'according to the judgment' construction (בከመ፡ ኵነኔ), the future judgment upon the man, and the moral force of 'do evil' rather than merely 'harm.' The revised wording makes the relationship of the declaration to the coming judgment clearer without removing the source's 'according to' element.
  naturalness: '‘मैं तुमसे उस न्याय के अनुसार घोषणा करता और गवाही देता हूँ’ is syntactically awkward in modern Hindi: ‘घोषणा करता’ is left without a clear content, and the coordination is less idiomatic. Introducing ‘यह’ and a following कि-clause gives both verbs a natural, explicit scope.'
  terminology: ‘न्याय,’ ‘गवाही देता हूँ,’ and ‘बुराई’ are appropriate formal-modern Hindi renderings. ‘पुत्रो’ is retained as a dignified plural address.
  issues:
  - severity: medium
    issue: The Hindi declaration lacks an explicit propositional complement.
    rationale: The source and English audit present a declaration/testimony concerning the judgment that will come. In Hindi, supplying ‘यह ... कि’ makes the assertion intelligible and idiomatic while preserving that content.
  revised_text: मेरे पुत्रो, मैं तुमसे उस न्याय के अनुसार यह घोषणा करता हूँ और गवाही देता हूँ कि वह उस मनुष्य पर आएगा जो अपने भाई के विरुद्ध बुराई करना चाहता है।
