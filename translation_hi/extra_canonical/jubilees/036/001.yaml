  yaml_path: translation/extra_canonical/jubilees/036/001.yaml
  text: And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.”
translation:
  language: hi
  text: और इस सप्ताह के छठे वर्ष में इसहाक ने अपने दोनों पुत्रों, एसाव और याकूब को बुलाया। वे उसके पास आए, और उसने उनसे कहा, “मेरे पुत्रों, मैं अपने पूर्वजों के मार्ग पर उस अनन्त घर की ओर जा रहा हूँ, जहाँ मेरे पूर्वज हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝሱባዔ
  choice: इस सप्ताह
  rationale: यह जुबली-वर्षगणना के अंतर्गत उल्लिखित विशिष्ट सात-वर्षीय सप्ताह को सूचित करता है; इसलिए निश्चित अर्थ बनाए रखा गया।
- source_word: ፍኖተ፡ አበውየ
  choice: अपने पूर्वजों के मार्ग पर
  rationale: स्रोत के रूपक ‘मेरे पितरों का मार्ग’ को स्वाभाविक हिन्दी में सुरक्षित रखा; ‘पूर्वज’ यहाँ दिवंगत पितरों के व्यापक अर्थ को स्पष्ट करता है।
- source_word: ቤት፡ ዘለዓለም
  choice: अनन्त घर
  rationale: गीज़ पदबंध का सीधा रूपक रखा गया और इसे कब्र, परलोक या स्वर्ग कहकर धर्मवैचारिक रूप से सीमित नहीं किया।
theological_decisions:
- issue: ‘अनन्त घर’ का आशय
  choice: रूपक को ज्यों का त्यों ‘अनन्त घर’ रखा गया
  alternative: ‘कब्र’, ‘परलोक’ या ‘स्वर्ग’
  rationale: स्रोत स्वयं स्थान की प्रकृति को स्पष्ट नहीं करता; अधिक विशिष्ट शब्द वास्तविक अस्पष्टता को अनुचित रूप से सुलझा देते।
- issue: ‘पूर्वजों के मार्ग पर जाना’ में मृत्यु-संकेत
  choice: मृत्यु का संकेत रूपक के भीतर ही रहने दिया गया
  alternative: ‘मैं मरने वाला हूँ’
  rationale: स्पष्ट व्याख्या के बजाय स्रोत की गरिमापूर्ण, अप्रत्यक्ष अभिव्यक्ति संरक्षित की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। प्रत्यक्ष कथन और स्रोत के दोनों मृत्यु-संबंधी रूपक सुरक्षित रखे गए हैं।
