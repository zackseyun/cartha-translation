base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/004.yaml
  text: And be, my sons, loving among yourselves, loving your brothers as a man who loves his own life, and each seeking for his brother what is good for him; and act together on the earth, and let them love one another as themselves.
translation:
  language: hi
  text: और, हे मेरे पुत्रों, आपस में प्रेम करते रहो; अपने भाइयों से ऐसा प्रेम करो जैसा मनुष्य अपने प्राण से करता है[a]। हर एक अपने भाई के लिए वही खोजे जो उसके लिए भला हो। पृथ्वी पर मिलकर काम करो, और वे एक-दूसरे से अपने समान प्रेम करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा मनुष्य अपनी आत्मा से प्रेम करता है।”
    reason: गीज़ ነፍሶ का अर्थ ‘उसका प्राण/जीवन’, ‘उसकी आत्मा’ या ‘स्वयं’ हो सकता है।
lexical_decisions:
- source_word: ውሉድየ
  choice: हे मेरे पुत्रो
  rationale: संबोधन और पारिवारिक संबंध दोनों को स्पष्ट तथा गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: ታፈቅሩ፡ አኅዊክሙ
  choice: अपने भाइयों से ... प्रेम करो
  rationale: गीज़ में क्रिया और संबंधवाचक रूप द्वितीय पुरुष बहुवचन हैं; इसलिए सीधे संबोधन को बनाए रखा गया है, न कि इसे ‘हर एक अपने भाई से’ में बदला गया है।
- source_word: ነፍሶ
  choice: अपने प्राण
  rationale: यह शब्द प्राण, जीवन, आत्मा अथवा स्वयं के अर्थक्षेत्र में आता है। यहाँ अपने जीवन के प्रति सहज प्रेम का भाव होने से ‘प्राण’ चुना गया, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: የኀሥሥ ... በዘ፡ ይሤኒ፡ ሎቱ
  choice: वही खोजे जो उसके लिए भला हो
  rationale: भाई के हित की सक्रिय खोज को व्यक्त करता है और स्रोत की सामान्य, वितरणात्मक उक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: በገቢረ፡ ኅቡረ
  choice: मिलकर काम करो
  rationale: शाब्दिक ‘एक साथ करने’ को सहज हिन्दी में सहयोगपूर्वक कार्य करने के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘प्राण/आत्मा/स्वयं’ का अर्थ
  choice: मुख्य पाठ में ‘प्राण’, अंतिम तुलना में स्वाभाविक हिन्दी ‘अपने समान’
  alternative: ‘आत्मा’ अथवा दोनों स्थानों पर ‘अपने प्राणों के समान’
  rationale: मुख्य तुलना में जीवन के प्रति प्रेम का भाव स्पष्ट है; अंतिम वाक्य में ‘अपने समान’ हिन्दी में उसी आत्म-संबंधी तुलना को स्वाभाविक ढंग से व्यक्त करता है। ‘आत्मा’ को पादटिप्पणी में सुरक्षित रखा गया है, बिना किसी विशिष्ट धर्मसैद्धांतिक अर्थ को थोपे।
- issue: अंतिम क्रिया का पुरुष-वचन
  choice: सीधे संबोधन के प्रवाह में ‘प्रेम करो’
  alternative: अधिक रूपात्मक रूप से ‘वे एक-दूसरे से ... प्रेम करें’
  rationale: गीज़ में अंतिम क्रिया तृतीय पुरुष बहुवचन इच्छार्थक रूप रखती है, पर निकटवर्ती संबोधन और आदेशों के संदर्भ में हिन्दी का सीधा बहुवचन आदेश आशय को अधिक स्पष्ट और स्वाभाविक रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। ‘प्रेम से रहो’, ‘भला’ और ‘मिलकर काम करो’ सामान्य पाठकों के लिए सहज हैं, जबकि संबोधन ‘हे मेरे पुत्रो’ प्राचीन वसीयतनुमा प्रसंग की गरिमा बनाए रखता है।
