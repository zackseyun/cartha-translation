base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/008.yaml
  text: And let each one love his brothers with mercy and righteousness, and let no man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.
translation:
  language: hi
  text: और हर एक अपने भाइयों से करुणा और धार्मिकता के साथ प्रेम करे, और अब से सदा तक, तुम्हारे जीवन के सारे दिनों में, कोई भी अपने भाई का बुरा न चाहे, ताकि तुम अपने सब कामों में सफल हो और नष्ट न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐዱ፡ አሐዱ
  choice: हर एक
  rationale: दोहराया हुआ गीइज़ रूप वितरणात्मक अर्थ देता है—प्रत्येक व्यक्ति।
- source_word: እኅዋሁ
  choice: अपने भाइयों से
  rationale: स्रोत में यह बहुवचन है; इसलिए बाद में आए एकवचन እኁሁ से इसका भेद सुरक्षित रखा गया है।
- source_word: በምሕረት፡ ወበጽድቅ
  choice: करुणा और धार्मिकता के साथ
  rationale: दोनों नैतिक गुणों को समानांतर रखा गया है; 'धार्मिकता' ጽድቅ के धार्मिक-नैतिक विस्तार को बनाए रखती है।
- source_word: ወኢይፈቅድ፡ ብእሲ፡ እኩየ
  choice: कोई भी ... बुरा न चाहे
  rationale: शाब्दिक आशय 'मनुष्य बुराई की इच्छा न करे' है; आधुनिक हिन्दी में यह स्वाभाविक और अर्थ-सटीक निषेध है।
- source_word: ከመ፡ ትሠርሑ፡ በኵሉ፡ ምግባሪክሙ
  choice: ताकि तुम अपने सब कामों में सफल हो
  rationale: क्रिया का प्रसंगगत भाव कार्यों में उन्नति या सफलता का है; परामर्श-पाठ के 'prosper' से भी इसकी पुष्टि होती है।
- source_word: ወኢትትሐጐሉ
  choice: और नष्ट न हो
  rationale: निष्क्रिय बहुवचन क्रिया के विनाश/बरबादी के तीव्र परिणाम को सीधे व्यक्त करता है।
theological_decisions:
- issue: ጽድቅ का अनुवाद
  choice: धार्मिकता
  alternative: न्याय / सच्चाई
  rationale: यहाँ करुणा के साथ एक नैतिक आचरण-गुण है। 'धार्मिकता' शब्द न्याय, सत्यनिष्ठा और उचित आचरण की व्यापकता को बिना संकुचित किए रखता है।
- issue: अंतिम परिणाम-वाक्य का बल
  choice: सफल हो और नष्ट न हो
  alternative: फलो-फूलो और असफल न हो
  rationale: स्रोत में सकारात्मक उन्नति और तीव्र नकारात्मक विनाश का विरोध है; अनुवाद उसी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आज्ञार्थक-उपदेशात्मक और गरिमापूर्ण शैली। बहुवचन 'भाइयों' और बाद के एकवचन 'भाई' का स्रोतगत अंतर जानबूझकर सुरक्षित रखा गया है।
