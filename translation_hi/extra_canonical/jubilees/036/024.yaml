  text: And he remembered all her deeds that she had done in her life, and he mourned for her greatly, because he loved her with all his heart and with all his soul.
translation:
  language: hi
  text: और उसने उसके उन सब कामों को याद किया, जो उसने अपने जीवन में किए थे, और उसके लिए बहुत शोक किया, क्योंकि वह उससे अपने पूरे हृदय और अपने पूरे प्राण से प्रेम करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይዜከር
  choice: याद किया
  rationale: क्रिया का सामान्य और स्वाभाविक हिन्दी अर्थ; प्रसंग में बीते जीवन के कामों का स्मरण व्यक्त करता है।
- source_word: ምግባራቲሃ
  choice: उसके सभी कामों
  rationale: स्त्रीलिंग संबंधसूचक रूप को स्पष्ट रखते हुए ‘deeds’ के लिए सहज आधुनिक हिन्दी चुनी गई।
- source_word: ይላሕዋ ጥቀ
  choice: उसके लिए बहुत शोक मनाया
  rationale: तीव्र शोक को स्वाभाविक हिन्दी में व्यक्त करता है और शोक के विषय को स्पष्ट रखता है।
- source_word: በኵሉ ልቡ ወበኵሉ ነፍሱ
  choice: अपने पूरे हृदय और अपने पूरे प्राण से
  rationale: मूल की समानांतर रचना और समग्र प्रेम की अभिव्यक्ति को निकटता से सुरक्षित रखता है।
