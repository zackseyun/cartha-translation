  revision_rationale: The revision resolves avoidable pronoun ambiguity, improves the idiomatic rendering of the paired moral terms, and standardizes modern Hindi orthography. It retains the source's causal structure, the statement that she honored Jacob, and the final abstract-noun formulation (‘in her’).
