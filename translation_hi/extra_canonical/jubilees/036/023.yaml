- from: क्योंकि उसकी बहन राहेल की मृत्यु के बाद वह उससे अत्यन्त प्रेम करता था, क्योंकि वह अपने सभी मार्गों में सिद्ध और खरी थी और याकूब का आदर करती थी। जितने दिन वह उसके साथ जीवित रही, उसने उसके मुँह से कोई कठोर बात नहीं सुनी, क्योंकि उसमें नम्रता, शान्ति, खराई और आदर था।[a]
