base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/023.yaml
  text: For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because gentleness and peace and uprightness and honor were in her.
translation:
  language: hi
  text: क्योंकि राहेल, जो उसकी बहन थी, की मृत्यु के बाद याकूब उससे बहुत प्रेम करता था; क्योंकि वह अपने सारे व्यवहार में निर्दोष और सीधी थी और याकूब का सम्मान करती थी। जब तक वह याकूब के साथ जीवित रही, याकूब ने उसके मुँह से कभी कोई कठोर बात नहीं सुनी, क्योंकि उसमें नम्रता, शांति, खराई और सम्मान था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नम्र, शांतिप्रिय, खरी और सम्माननीय थी।”
    reason: अंतिम चार अमूर्त गुणों को चरित्र-वर्णन करने वाले विशेषणों के रूप में समझना संभव है।
lexical_decisions:
- source_word: ያፈቅራ፡ ፈድፋደ፡ ጥቀ
  choice: अत्यन्त प्रेम करता था
  rationale: क्रिया और दोहरे तीव्रतासूचक प्रयोग से व्यक्त बहुत गहरे प्रेम को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ፍጽምት፡ ወሬትዕት
  choice: सिद्ध और खरी
  rationale: स्त्रीलिंग विशेषणों के अर्थ क्रमशः पूर्ण/निर्दोष और सीधा/खरा हैं; यह जोड़ी नैतिक गुण का भाव रखते हुए स्रोत की समानांतर रचना बचाती है।
- source_word: ቃለ፡ ድሩከ
  choice: कोई कठोर बात
  rationale: शाब्दिक रूप से कठोर या कड़ा वचन; आधुनिक हिन्दी में यह सहज और अर्थनिष्ठ है।
- source_word: የውህት፡ ወሰላመ፡ ወርትዕ፡ ወክብራ፡ ባቲ
  choice: उसमें नम्रता, शान्ति, खराई और आदर था
  rationale: स्रोत में अमूर्त संज्ञाएँ और ‘उसमें’ का प्रयोग है; संज्ञात्मक संरचना को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: चरित्र-गुणों को अमूर्त संज्ञा या विशेषण के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘नम्रता, शान्ति, खराई और आदर’ जैसी अमूर्त संज्ञाएँ
  alternative: ‘वह नम्र, शान्तिप्रिय, खरी और आदरणीय थी’
  rationale: गीज़ पाठ में अमूर्त संज्ञाएँ ባቲ (‘उसमें’) के साथ आती हैं। मुख्य पाठ उसी व्याकरणिक और धर्मवैचारिक तनाव को सुरक्षित रखता है; विशेषणात्मक समझ पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सहज रूप। ‘खरी’ नैतिक सीधाई को व्यक्त करती है और ‘आदर’ स्रोत की अमूर्त संज्ञा-संरचना को बनाए रखता है।
