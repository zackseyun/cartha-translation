lexical_decisions:
- source_word: ዘንተ
  choice: यह
  rationale: निकट संकेतवाचक शब्द को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: እሁብ
  choice: मैं ... देता हूँ
  rationale: प्रथम पुरुष एकवचन क्रिया का वर्तमानकालीन, सीधा हिन्दी रूप।
- source_word: ዕበየ
  choice: बड़ा हिस्सा
  rationale: संदर्भ में यह दूसरे की तुलना में अधिक या बड़ा भाग सूचित करता है; ‘बड़ा हिस्सा’ सामान्य हिन्दी में स्पष्ट है।
- source_word: ለብእሲ
  choice: उस पुरुष को
  rationale: ለ उपसर्ग के प्राप्तिकर्ता भाव और ብእሲ के स्पष्ट पुरुषवाचक अर्थ दोनों को सुरक्षित रखा गया है।
- source_word: ቀደመ፡ ተወልደ
  choice: जो पहले जन्मा था
  rationale: जन्म-क्रम को व्यक्त करने वाली सापेक्ष संरचना को स्वाभाविक हिन्दी में रखा गया है।
