  yaml_path: translation/extra_canonical/jubilees/015/033.yaml
  text: And now I am telling you that the children of Israel will not keep this ordinance, and they will not circumcise their sons according to all the law; for they will leave some of the flesh of their circumcision in the circumcision of their sons, and all the sons of Belial will leave their sons uncircumcised as they were born.
translation:
  language: hi
  text: और अब मैं तुम्हें बताता हूँ कि इस्राएल के लोग इस विधि के विषय में विश्वासघात करेंगे[a] और पूरी व्यवस्था के अनुसार अपने पुत्रों का खतना नहीं करेंगे; क्योंकि वे अपने पुत्रों के खतने में खतना किए जाने वाले मांस का कुछ भाग छोड़ देंगे। और बेलियाल के सभी पुत्र अपने पुत्रों को बिना खतना किए उसी अवस्था में छोड़ देंगे, जिसमें वे जन्मे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस विधि में झूठ करेंगे।” इसका भाव इस विधि के संबंध में असत्य या विश्वासघात करना, अथवा उसका ठीक पालन न करना है।
    reason: मूल क्रिया के ‘झूठ/असत्य’ संबंधी अर्थ को सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक हिंदी दी गई है।
lexical_decisions:
- source_word: ሥርዐት
  choice: विधि
  rationale: यहाँ शब्द किसी स्थापित धार्मिक विधान या नियम को दर्शाता है; ‘विधि’ आधुनिक हिंदी में स्वाभाविक और संदर्भानुकूल है।
- source_word: ይሐስዉ
  choice: सच्ची नहीं रहेगी
  rationale: मूल क्रिया का आधारभूत अर्थ झूठ बोलना या असत्य ठहरना है। इस विधान के संदर्भ में ‘सच्ची नहीं रहेगी’ उस भाव को बनाए रखते हुए हिंदी में स्वाभाविक है; केवल ‘पालन नहीं करेगी’ कहने से मूल का सत्य/असत्य संबंधी रंग खो जाता।
- source_word: ኵሉ፡ ሕግ
  choice: पूरी व्यवस्था
  rationale: मूल में संकेतवाचक ‘यह’ नहीं है; इसलिए ‘इस पूरी व्यवस्था’ के बजाय ‘पूरी व्यवस्था’ रखा गया है।
- source_word: ክስበት
  choice: खतना
  rationale: यह पुरुष-खतने के लिए प्रयुक्त स्पष्ट शब्द है और हिंदी पाठकों में प्रचलित है।
- source_word: ቤልአር
  choice: बेलियाल
  rationale: नाम/उपाधि का लिप्यंतरण किया गया है; इसे व्याख्यात्मक रूप से ‘दुष्ट’ करने पर मूल की विशिष्ट संज्ञा मिट जाती।
theological_decisions:
- issue: ‘बेलियाल की संतान’ की पहचान
  choice: बेलियाल की सारी संतान
  alternative: सभी दुष्ट लोग
  rationale: मूल की विशिष्ट अभिव्यक्ति को बिना किसी संप्रदायगत या व्यक्तिविशेष संबंधी व्याख्या के सुरक्षित रखा गया है।
- issue: खतने की अपूर्णता का वर्णन
  choice: खतने के मांस का कुछ भाग छोड़ देंगी
  alternative: अपने पुत्रों का अधूरा खतना करेंगी
  rationale: अधिक संक्षिप्त विकल्प अर्थ स्पष्ट करता, पर मूल के शारीरिक और विधिक विवरण को कम कर देता; इसलिए अपेक्षाकृत औपचारिक अभिव्यक्ति रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सामूहिक ‘इस्राएल की संतान’ के साथ एकवचन स्त्रीलिंग क्रियाएँ हिंदी के व्याकरणानुसार प्रयुक्त हुई हैं। मूल में ‘अपने पुत्रों के खतने में’ उपस्थित वाक्यांश को स्पष्ट रूप से शामिल किया गया है; उसे छोड़ा नहीं गया।
