  text: For Ishmael and his sons and his brothers and Esau, the Lord did not bring near to himself, and he did not choose them, though they are the children of Abraham, because he knew them; and he chose Israel to be his people.
translation:
  language: hi
  text: इश्माएल, उसके पुत्रों, उसके भाइयों और एसाव को प्रभु ने अपने निकट नहीं लाया और न उन्हें चुना, क्योंकि वे अब्राहम की संतान हैं और वह उन्हें जानता था; पर उसने इस्राएल को अपनी प्रजा होने के लिए चुना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक रूप से, विराम और संबंध इस प्रकार समझे जा सकते हैं: ‘...अब्राहम की संतान हैं; पर वह उन्हें जानता था, और उसने इस्राएल को चुना।’ मूल गीइज़ में ‘क्योंकि/क्योंकि कि’ के अर्थ वाला पद दो बार आता है; वाक्य-विभाजन अनिश्चित है।'
    reason: मूल की कठिन, विवादित वाक्य-संरचना और अंग्रेज़ी audit trail में दर्ज वैकल्पिक संबंध को सुरक्षित रखता है, बिना किसी धर्मवैज्ञानिक व्याख्या को निश्चित किए।
lexical_decisions:
- source_word: ኢያቅረቦ፡ ኀቤሁ
  choice: अपने निकट नहीं किया
  rationale: मूल की निकट लाने की संबंधपरक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ወኢኀረየ፡ ቦሙ
  choice: और न उनमें से किसी को चुना
  rationale: ‘उनमें नहीं चुना’ के आशय को स्पष्ट, सहज हिन्दी में व्यक्त करता है और समूह में से चुनाव का भाव सुरक्षित रखता है।
- source_word: አእመሮሙ
  choice: वह उन्हें जानता था
  rationale: ‘जानना’ मूल क्रिया के व्यापक और संभवतः पूर्वज्ञानसूचक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ሕዝበ
  choice: प्रजा
  rationale: परमेश्वर से संबंधित चुने हुए समुदाय के लिए dignified और सामान्य बाइबलीय हिन्दी।
theological_decisions:
- issue: अब्राहम की संतान होने और न चुने जाने के बीच संबंध
  choice: ‘यद्यपि वे अब्राहम की संतान हैं’ को अंतःस्थ वाक्यांश बनाया
  alternative: दोनों እስመ को सपाट रूप से ‘क्योंकि’ कहना
  rationale: पहला እስመ सामान्यतः कारणसूचक है, पर इस वाक्य में लगातार दोनों को ‘क्योंकि’ कहना हिन्दी में असंगत कारण-श्रृंखला बनाता है। ‘यद्यपि’ वंशगत स्थिति और चुनाव के बीच मूल तनाव को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना दिखाती है।
- issue: ‘वह उन्हें जानता था’ का धर्मवैज्ञानिक आशय
  choice: सिर्फ ‘जानता था’ रखा
  alternative: ‘उनके स्वभाव/कामों को पहले से जानता था’
  rationale: मूल पाठ ज्ञान की वस्तु या स्वरूप स्पष्ट नहीं करता; अतः पूर्वज्ञान, अनुमोदन या चरित्र-ज्ञान में से किसी एक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। लंबे मूल वाक्य का प्रवाह डैश और अर्धविराम से स्पष्ट किया गया है।
