base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/002.yaml
  text: 'And he offered a new sacrifice on the altar, the firstfruits of the produce, to the Lord: a bull and a goat and a sheep on the altar as a pleasing aroma to the Lord; and their grain offering and their drink offering he offered on the altar with incense.'
translation:
  language: hi
  text: 'और उसने वेदी पर प्रभु के लिए उपज के पहले फलों का एक नया बलिदान चढ़ाया: एक बैल, एक बकरा और एक भेड़। उसने इन्हें वेदी पर प्रभु के लिए सुखद सुगंध के रूप में चढ़ाया, और उनकी अन्न-भेंटें और पेय-भेंटें भी धूप के साथ वेदी पर चढ़ाईं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕተ፡ ሐዲስ
  choice: नई बलि
  rationale: शाब्दिक अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में रखा गया है।
- source_word: ቀዳሜ፡ እክል
  choice: उपज का पहला फल
  rationale: पदबंध उपज की प्रथम उपज/पहले फल की ओर संकेत करता है; हिन्दी में अर्थ स्पष्ट रखते हुए वचन की कृत्रिम निश्चितता से बचाया गया है।
- source_word: ላህመ፡ ወበሐኮ፡ ወበግዐ
  choice: एक बैल, एक बकरा और एक भेड़
  rationale: पशु-सूची को स्रोत के अनुसार रखा गया है; በሐኮ को 'बकरा' माना गया है, न कि 'मेढ़ा'। अंतिम पद का सामान्य अर्थ 'भेड़' रखा गया है।
- source_word: ጽንሓሐ፡ ለእግዚአብሔር
  choice: यहोवा के लिए सुखदायक सुगंध
  rationale: यह वाक्यांश सुगंध/सुवास का भाव देता है; इसे गलत ढंग से 'होमबलि' नहीं बनाया गया।
- source_word: ሞጻሕቶሙ
  choice: उनके साथ ... अर्घ
  rationale: बलियों से संबद्ध पेय-भेंट के लिए प्रचलित बाइबलीय हिन्दी 'अर्घ' चुना गया है।
- source_word: ስኂን
  choice: धूप
  rationale: स्रोत का अर्थ व्यापक रूप से सुगंधित धूप है; विशेष रूप से 'लोबान' कहना अनावश्यक रूप से संकीर्ण होता।
theological_decisions:
- issue: सुगंध-वाक्यांश का बलिदानी अर्थ
  choice: सुखदायक सुगंध के रूप में
  alternative: होमबलि के रूप में
  rationale: स्रोत सुगंध का उल्लेख करता है; बलि के प्रकार को 'होमबलि' निश्चित करना मूल की सीमा से आगे जाता।
- issue: दिव्य नाम
  choice: यहोवा
  alternative: प्रभु
  rationale: Ꭵግዚአብሔር के लिए आधुनिक हिन्दी बाइबल पाठकों में परिचित व्यक्तिगत ईश-नाम का प्रयोग किया गया है, जबकि कोई संप्रदायगत व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज बाइबलीय शैली। सूची और अनुष्ठानिक पदों को स्पष्ट करने के लिए वाक्य-विभाजन किया गया है। किसी फुटनोट की आवश्यकता नहीं मानी गई, क्योंकि उपलब्ध स्रोत-साक्ष्य में 'बकरा' पाठ पर्याप्त रूप से समर्थित है।
