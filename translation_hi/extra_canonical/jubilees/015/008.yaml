base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/008.yaml
  text: And I will make you very great, and I will make you into nations, and kings shall come out from you. And I will establish my covenant between me and you and between your seed after you throughout their generations, as an everlasting ordinance, so that I may be God to you and to your seed after you.
translation:
  language: hi
  text: और मैं तुम्हें बहुत महान बनाऊँगा; मैं तुमसे अनेक जातियाँ उत्पन्न करूँगा, और तुमसे राजा निकलेंगे। मैं अपने और तुम्हारे बीच, और तुम्हारे बाद तुम्हारे वंश के बीच, उनकी पीढ़ियों तक अपनी वाचा को सदा की विधि के रूप में स्थापित करूँगा, ताकि मैं तुम्हारा और तुम्हारे बाद तुम्हारे वंश का परमेश्वर होऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕዛብ
  choice: अनेक जातियाँ
  rationale: यह बहुवचन संज्ञा ‘जातियों/राष्ट्रों’ को व्यक्त करती है; प्रसंग में अब्राहम से अनेक जनसमुदायों की उत्पत्ति अभिप्रेत है।
- source_word: ኪዳንየ
  choice: अपनी वाचा
  rationale: ኪዳን संबंध-बद्ध प्रतिज्ञा या covenant का पारंपरिक और अर्थ-सटीक हिन्दी रूप ‘वाचा’ है।
- source_word: ሥርዓት፡ ዘለዓለም
  choice: सदा की विधि
  rationale: ሥርዓት व्यवस्था, विधान या नियत विधि का बोध देता है और ዘለዓለም उसकी स्थायी अवधि को सूचित करता है।
- source_word: ዘርእከ
  choice: तुम्हारा वंश
  rationale: सामूहिक ‘seed/offspring’ के लिए आधुनिक हिन्दी में ‘वंश’ स्वाभाविक है और सामूहिक अर्थ को सुरक्षित रखता है।
- source_word: አምላከ
  choice: परमेश्वर
  rationale: यहाँ पद संबंधसूचक रूप में ‘तुम्हारा परमेश्वर’ है; ‘परमेश्वर’ dignified और सामान्य बाइबिलीय हिन्दी है।
theological_decisions:
- issue: वाचा को देने या स्थापित करने की क्रिया
  choice: अपनी वाचा को ... स्थापित करूँगा
  alternative: अपनी वाचा दूँगा
  rationale: गीज़ पाठ में ‘दूँगा’ का रूप है, पर वाचा के संबंध में इसका कार्यात्मक अर्थ उसे कायम/स्थापित करना है; हिन्दी में ‘वाचा स्थापित करना’ अधिक स्वाभाविक है और अर्थ को बदले बिना संबंध की स्थापना व्यक्त करता है।
- issue: ईश्वर होने के उद्देश्य/परिणाम का रूप
  choice: ताकि मैं ... परमेश्वर रहूँ
  alternative: कि मैं ... परमेश्वर होऊँ
  rationale: स्रोत का उद्देश्यसूचक वाक्यांश सुरक्षित रखा गया है; ‘रहूँ’ सतत वाचागत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तुम’ एकवचन संबोधन के रूप में अब्राहम के लिए प्रयुक्त है। समानांतर वाक्यरचना और ‘तुम्हारे बाद तुम्हारे वंश’ की पुनरावृत्ति स्रोत की वाचागत भाषा को बनाए रखती है।
