  language: hi
  text: 'तब प्रभु ने अब्राहम से कहा, “जहाँ तक तुम्हारी बात है, तुम मेरी वाचा का पालन करना—तुम और तुम्हारे बाद तुम्हारा वंश। तुम अपने बीच के हर पुरुष का खतना करना; तुम अपनी खलड़ियों के मांस का खतना करना, और यह मेरे और तुम्हारे बीच सदा के विधान का चिह्न होगा। तुम्हारे बीच आठ दिन के प्रत्येक लड़के का खतना किया जाए—चाहे वह घर में जन्मा हो या परदेशियों की किसी भी संतान में से सोना देकर[a] खरीदा गया हो, जो तुम्हारे वंश का नहीं है। तुम्हारे घर में जन्मे का खतना अवश्य किया जाए, और सोना देकर खरीदे गए का भी खतना किया जाए। इस प्रकार मेरी वाचा तुम्हारे शरीर में सदा के विधान के रूप में होगी। पर जिस खतनारहित पुरुष की खलड़ी का मांस आठवें दिन खतना न किया गया हो, वह प्राणी अपने कुटुंब में से मिटा दिया जाए, क्योंकि उसने मेरी वाचा तोड़ी है।”


    फिर प्रभु ने अब्राहम से कहा, “तुम्हारी पत्नी सारै की बात यह है: अब तुम उसका नाम सारै न पुकारना, क्योंकि उसका नाम सारा है। मैं उसे आशीष दूँगा और उससे तुम्हें एक पुत्र दूँगा। मैं उस पुत्र को आशीष दूँगा; वह एक जाति बनेगा, और जातियों के राजा उससे निकलेंगे।”


    तब अब्राहम मुँह के बल गिर पड़ा और आनन्दित हुआ। उसने अपने मन में कहा, “क्या सौ वर्ष के पुरुष से पुत्र जन्मेगा? और क्या नब्बे वर्ष की सारा बच्चे को जन्म देगी?” अब्राहम ने प्रभु से कहा, “काश, इश्माएल ही आपके सामने जीवित रहे!”


    प्रभु ने कहा, “हाँ, और सारा तुम्हारे लिए एक पुत्र को जन्म देगी। तुम उसका नाम इसहाक रखना। मैं उसके साथ अपनी वाचा स्थापित करूँगा—सदा की वाचा, और उसके बाद उसके वंश के साथ भी। इश्माएल के विषय में भी मैंने तुम्हारी सुन ली है। देखो, मैं उसे आशीष दूँगा, फलवन्त करूँगा और अत्यन्त बढ़ाऊँगा। वह बारह प्रधानों का पिता होगा, और मैं उससे एक बड़ी जाति बनाऊँगा। पर अपनी वाचा मैं इसहाक के साथ स्थापित करूँगा, जिसे सारा अगले वर्ष इसी समय तुम्हारे लिए जन्म देगी।”


    जब वह अब्राहम से बात कर चुका, तब प्रभु उसके पास से ऊपर चला गया। अब्राहम ने वैसा ही किया जैसा प्रभु ने उससे कहा था। उसने अपने पुत्र इश्माएल को, अपने घर में जन्मे सभी लोगों को और सोना देकर खरीदे गए सभी लोगों को—अपने घर के हर पुरुष को—लिया और उनकी खलड़ी के मांस का खतना किया। उसी दिन अब्राहम का और उसके घर के सभी पुरुषों का खतना हुआ। उसके घर में जन्मे सभी लोगों का और परदेशियों की संतानों में से सोना देकर खरीदे गए सभी लोगों का उसके साथ खतना हुआ।


    यह सब पीढ़ियों के लिए सदा की विधि है। आठ दिनों में न तो देर की जाए, न एक दिन भी छोड़ा जाए, क्योंकि यह सदा का विधान है, जो स्वर्गीय पट्टिकाओं पर ठहराया और लिखा गया है। जो कोई जन्म ले और जिसकी खलड़ी के मांस का खतना आठवें दिन न किया जाए, वह उस वाचा की संतानों में से नहीं है जो प्रभु ने अब्राहम के साथ बाँधी थी; वह विनाश की संतानों में से है। उस पर ऐसा कोई चिह्न नहीं है कि वह प्रभु का है। वह विनाश के लिए, पृथ्वी पर से नष्ट किए जाने और पृथ्वी पर से जड़ समेत उखाड़े जाने के लिए है, क्योंकि उसने प्रभु हमारे परमेश्वर की वाचा तोड़ी है।”'
  philosophy: optimal-equivalence
