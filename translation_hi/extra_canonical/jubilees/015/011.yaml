lexical_decisions:
- source_word: ኪዳን (kidān)
  choice: वाचा
  rationale: यह संबंध-बाँधने वाली covenant की संकल्पना को स्वाभाविक और प्रतिष्ठित हिन्दी बाइबलीय शब्दावली में व्यक्त करता है।
- source_word: ወርቅ (warq)
  choice: सोना
  rationale: गीज़ का प्रत्यक्ष अर्थ ‘सोना’ है; उत्पत्ति के इब्रानी पाठ के ‘चाँदी’ को यहाँ आयात नहीं किया गया। प्रसंग में यह भुगतान या धन का भी द्योतक हो सकता है, इसलिए पादटिप्पणी दी गई है।
