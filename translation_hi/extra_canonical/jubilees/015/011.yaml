    प्रभु ने कहा, “हाँ, और सारा तुम्हारे लिए एक पुत्र को जन्म देगी। तुम उसका नाम इसहाक रखना। मैं उसके साथ अपनी वाचा स्थापित करूँगा—सदा की वाचा, और उसके बाद उसके वंश के साथ भी। इश्माएल के विषय में भी मैंने तुम्हारी सुन ली है। देखो, मैं उसे आशीष दूँगा, फलवन्त करूँगा और अत्यन्त बढ़ाऊँगा। वह बारह प्रधानों का पिता होगा, और मैं उससे एक बड़ी जाति बनाऊँगा। पर अपनी वाचा मैं इसहाक के साथ स्थापित करूँगा, जिसे सारा अगले वर्ष इसी समय तुम्हारे लिए जन्म देगी।”


    जब वह अब्राहम से बात कर चुका, तब प्रभु उसके पास से ऊपर चला गया। अब्राहम ने वैसा ही किया जैसा प्रभु ने उससे कहा था। उसने अपने पुत्र इश्माएल को, अपने घर में जन्मे सभी लोगों को और सोना देकर खरीदे गए सभी लोगों को—अपने घर के हर पुरुष को—लिया और उनकी खलड़ी के मांस का खतना किया। उसी दिन अब्राहम का और उसके घर के सभी पुरुषों का खतना हुआ। उसके घर में जन्मे सभी लोगों का और परदेशियों की संतानों में से सोना देकर खरीदे गए सभी लोगों का उसके साथ खतना हुआ।


