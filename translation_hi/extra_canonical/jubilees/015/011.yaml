    परमेश्वर ने कहा, “हाँ, और सारा तुम्हारे लिए एक पुत्र को जन्म देगी। तुम उसका नाम इसहाक रखना। मैं उसके साथ अपनी वाचा स्थापित करूँगा—उसके और उसके बाद उसके वंश के साथ सदा की वाचा। इश्माएल के विषय में भी मैंने तुम्हारी सुन ली है। देखो, मैं उसे आशीष दूँगा, फलवन्त करूँगा और अत्यन्त बढ़ाऊँगा। वह बारह प्रधानों का पिता होगा, और मैं उससे एक बड़ी जाति बनाऊँगा। पर अपनी वाचा मैं इसहाक के साथ स्थापित करूँगा, जिसे सारा अगले वर्ष इसी समय तुम्हारे लिए जन्म देगी।”


