  revised_text: 'तब प्रभु ने अब्राहम से कहा, “जहाँ तक तुम्हारी बात है, तुम मेरी वाचा का पालन करना—तुम और तुम्हारे बाद तुम्हारा वंश। तुम अपने बीच के हर पुरुष का खतना करना; तुम अपनी खलड़ियों के मांस का खतना करना, और यह मेरे और तुम्हारे बीच सदा के विधान का चिह्न होगा। तुम्हारे बीच आठ दिन के प्रत्येक लड़के का खतना किया जाए—चाहे वह घर में जन्मा हो या परदेशियों की किसी भी संतान में से सोना देकर[a] खरीदा गया हो, जो तुम्हारे वंश का नहीं है। तुम्हारे घर में जन्मे का खतना अवश्य किया जाए, और सोना देकर खरीदे गए का भी खतना किया जाए। इस प्रकार मेरी वाचा तुम्हारे शरीर में सदा के विधान के रूप में होगी। पर जिस खतनारहित पुरुष की खलड़ी का मांस आठवें दिन खतना न किया गया हो, वह प्राणी अपने कुटुंब में से मिटा दिया जाए, क्योंकि उसने मेरी वाचा तोड़ी है।”


    फिर प्रभु ने अब्राहम से कहा, “तुम्हारी पत्नी सारै की बात यह है: अब तुम उसका नाम सारै न पुकारना, क्योंकि उसका नाम सारा है। मैं उसे आशीष दूँगा और उससे तुम्हें एक पुत्र दूँगा। मैं उस पुत्र को आशीष दूँगा; वह एक जाति बनेगा, और जातियों के राजा उससे निकलेंगे।”


