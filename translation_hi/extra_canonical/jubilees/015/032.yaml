base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/032.yaml
  text: But over Israel he did not hand over or entrust any angel or spirit, for he alone is their ruler, and he will guard them and require them from the hand of his angels and from the hand of his spirits and from the hand of all his authorities, so that he may guard them and bless them, and that they may be his and he may be theirs from now and forever.
translation:
  language: hi
  text: पर इस्राएल को उसने किसी स्वर्गदूत या आत्मा के हाथ में न तो सौंपा और न उसके भरोसे किया[a]; क्योंकि केवल वही उनका शासक है। वह उनकी रक्षा करेगा और अपने स्वर्गदूतों के हाथ से, अपनी आत्माओं के हाथ से और अपने सभी अधिकारियों के हाथ से उनके विषय में हिसाब माँगेगा[b], ताकि वह उनकी रक्षा करे और उन्हें आशीष दे, और वे उसके हों और वह उनका हो—अब से सदा तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के ऊपर किसी स्वर्गदूत या आत्मा को नियुक्त नहीं किया।”
    reason: मूल की दो क्रियाएँ ‘सौंपने’ और ‘भरोसे पर देने’ का भाव रखती हैं; प्रसंग में नियुक्ति का अर्थ भी संभव है।
  - marker: b
    text: या, “उन्हें उनके हाथ से वापस माँगेगा”; मूल क्रिया का अर्थ “खोजना,” “माँगना,” या “तलब करना” हो सकता है।
    reason: क्रिया और ‘हाथ से’ मुहावरे में पुनः प्राप्ति तथा उत्तरदायित्व माँगने, दोनों की छाया है।
lexical_decisions:
- source_word: ኢያሰለመ፡ ወአመነሂ
  choice: न तो अधिकार सौंपा, न उनकी देखरेख का भरोसा दिया
  rationale: दोनों गीइज़ क्रियाओं—सौंपने और भरोसे पर देने—को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक किया गया है।
- source_word: መኰንኖሙ
  choice: उनका शासक
  rationale: शासन और अधिकार के भाव को स्पष्ट, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: የዐቅቦሙ / ይዕቀቦሙ
  choice: उनकी रक्षा करेगा / उनकी रक्षा करे
  rationale: एक ही स्रोत-क्रिया की पुनरावृत्ति को हिन्दी में भी समान शब्द से बनाए रखा गया है।
- source_word: ይትኀሠሦሙ፡ እምእዴ
  choice: के हाथ से उनका हिसाब माँगेगा
  rationale: क्रिया में खोजने, माँगने या वापस तलब करने की अर्थ-सीमा है; ‘हाथ से हिसाब माँगना’ उत्तरदायित्व की प्रसंगगत धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኵሉ፡ ትእዛዝያኒሁ
  choice: अपने सभी अधिकारियों
  rationale: अधीनस्थ अधिकार रखने वाली सत्ताओं का भाव देता है और अस्पष्ट रूप से ‘शक्तियाँ’ कहने से बचता है।
- source_word: ይኩንዎ፡ ሎቱ፡ ወውእቱ፡ ይኩኖሙ፡ ሎሙ
  choice: वे उसके हों और वह उनका हो
  rationale: परस्पर संबंध के वाचाई स्वरूप और स्रोत की संतुलित समानांतरता को बनाए रखता है।
theological_decisions:
- issue: इस्राएल और स्वर्गदूतीय शासन का संबंध
  choice: किसी स्वर्गदूत या आत्मा को न तो अधिकार सौंपा, न उनकी देखरेख का भरोसा दिया
  alternative: किसी स्वर्गदूत या आत्मा को नियुक्त नहीं किया
  rationale: स्रोत में दो क्रियाएँ हैं और वे केवल नियुक्ति नहीं, बल्कि सौंपने तथा भरोसे पर देने की धारणा प्रकट करती हैं; यह अनुवाद उस तनाव को बिना किसी पंथगत व्याख्या के बनाए रखता है।
- issue: स्वर्गदूतों और आत्माओं से उत्तरदायित्व माँगना
  choice: उनके हाथ से उनका हिसाब माँगेगा
  alternative: उनको उनके हाथ से खोजेगा / उनसे उन्हें वापस माँगेगा
  rationale: स्रोत की अर्थगत अस्पष्टता में खोज, माँग और जवाबदेही सम्मिलित हैं। मुख्य पाठ में प्रसंगानुकूल जवाबदेही रखी गई है और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण लेकिन सामान्य पाठक के लिए सुबोध रूप। स्रोत की पुनरावृत्ति, परस्पर ‘उसके हों/वह उनका हो’ संरचना और स्वर्गदूतीय अधिकार संबंधी अस्पष्टता को बनाए रखा गया है।
