  text: For the command has been ordained as a covenant, that they should keep it forever among all the children of Israel.
translation:
  language: hi
  text: क्योंकि यह आज्ञा वाचा के रूप में ठहराई गई है, ताकि इस्राएल की सारी सन्तान इसका सदा पालन करती रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዝ
  choice: आज्ञा
  rationale: यह शब्द आदेश या आज्ञा को दर्शाता है; प्रसंग में धार्मिक विधान के लिए ‘आज्ञा’ स्वाभाविक और सटीक है।
- source_word: ተሠርዐ
  choice: ठहराई गई है
  rationale: मूल निष्प्रयोज्य क्रिया में स्थापित, नियत या विधिवत निर्धारित किए जाने का भाव है; ‘ठहराई गई है’ उस औपचारिकता को बनाए रखता है।
- source_word: ለኪዳን
  choice: वाचा के रूप में
  rationale: ‘वाचा के लिए/रूप में’ का संबंध आज्ञा की वाचागत स्थापना से है; हिन्दी में यह पदबंध अर्थ को स्पष्ट रखते हुए अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ይዕቀብዎ
  choice: इसे ... मानती रहे
  rationale: मूल क्रिया का अर्थ रखना, सुरक्षित रखना या पालन करना हो सकता है। आज्ञा के साथ ‘मानना’ आधुनिक हिन्दी में स्वाभाविक है और निरन्तर पालन का आशय देता है।
- source_word: ለዓለም
  choice: सदा
  rationale: यह कालगत रूप से सदैव या युगभर का भाव व्यक्त करता है; ‘सदा’ संक्षिप्त और स्वाभाविक है।
- source_word: ኵሎሙ፡ ደቂቀ፡ እስራኤል
  choice: इस्राएल की सारी सन्तान
  rationale: शाब्दिक ‘इस्राएल के सभी पुत्रों/बच्चों’ के लिए यह प्रतिष्ठित, सामूहिक और लिंग-समावेशी हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: आज्ञा और वाचा का संबंध
  choice: ‘आज्ञा वाचा के रूप में ठहराई गई है’
  alternative: ‘आज्ञा वाचा के लिए ठहराई गई है’
  rationale: मूल में संबंधसूचक रूप दोनों अर्थों की सम्भावना रखता है। ‘के रूप में’ अंग्रेज़ी परामर्श-पाठ के अनुरूप है और आज्ञा की वाचागत हैसियत को व्यक्त करता है, बिना किसी सम्प्रदायगत व्याख्या के।
- issue: अनन्तकालीन पालन का दायरा
  choice: ‘इस्राएल की सारी सन्तान इसे सदा मानती रहे’
  alternative: ‘वे इसे इस्राएल की सारी सन्तान के बीच सदा मानें’
  rationale: गीज़ वाक्य-विन्यास में अंतिम पदबंध को कर्तृ-दायरे या समुदाय के बीच पालन—दोनों तरह समझा जा सकता है। चुना गया पाठ अंग्रेज़ी परामर्श-पाठ की सामुदायिक व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘वाचा’ जैसे बाइबलीय पारिभाषिक शब्द को बनाए रखा गया है; वाक्य को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
