  yaml_path: translation/extra_canonical/jubilees/015/005.yaml
  text: And Abram fell on his face, and God spoke with him and said, “Behold, my covenant is with you, and you shall become the father of many nations.”
translation:
  language: hi
  text: और अब्राम मुँह के बल गिर पड़ा, और परमेश्वर ने उससे बात की और कहा, “देखो, मेरी वाचा तेरे साथ है, और तू बहुत-सी जातियों का पिता बनेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወድቀ፡ አብራም፡ በገጹ፡
  choice: और अब्राम मुँह के बल गिर पड़ा
  rationale: गीज़ वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप; यह दण्डवत् मुद्रा को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ተናገሮ፡ እግዚአብሔር፡
  choice: परमेश्वर ने उससे कहा
  rationale: क्रिया के साथ लगा सर्वनाम अब्राम की ओर संकेत करता है। ‘बात की’ की अपेक्षा ‘कहा’ आधुनिक हिन्दी में अगले कथन का अधिक स्वाभाविक परिचय है।
- source_word: ናሁ፡
  choice: देख
  rationale: ध्यान आकर्षित करने वाले उद्गार का संक्षिप्त, प्रतिष्ठित और प्रचलित बाइबलीय हिन्दी समतुल्य।
- source_word: ሥርዓትየ፡
  choice: मेरी वाचा
  rationale: इस प्रसंग में शब्द अब्राम के साथ स्थापित ईश्वरीय बन्धन/व्यवस्था को सूचित करता है; ‘वाचा’ उत्पत्ति 17 की पृष्ठभूमि और आशय को ठीक व्यक्त करती है, जबकि केवल ‘विधान’ यहाँ अत्यधिक सामान्य होगा।
- source_word: አበ፡ ለብዙኃን፡ አሕዛብ፡
  choice: बहुत-सी जातियों का पिता
  rationale: ‘जातियाँ’ यहाँ अनेक peoples/nations को दर्शाता है; ‘बहुत-सी’ आधुनिक हिन्दी में स्वाभाविक है और बहुलता बनाए रखता है।
theological_decisions:
- issue: ሥርዓትየ का प्रसंगानुसार अर्थ
  choice: मेरी वाचा
  alternative: मेरा विधान / मेरी व्यवस्था
  rationale: शब्द का सामान्य अर्थ व्यवस्था या विधान हो सकता है, पर अब्राम से परमेश्वर के औपचारिक सम्बन्ध और उत्पत्ति 17 के निकट समानांतर के कारण ‘वाचा’ प्रसंग में अधिक सटीक है।
- issue: ईश्वरीय प्रतिज्ञा में भविष्यकाल
  choice: तू ... पिता बनेगा
  alternative: तू ... पिता होगा
  rationale: गीज़ ወትከውን बनने/होने की भविष्यवाची प्रतिज्ञा देता है। ‘बनेगा’ स्थिति में परिवर्तन का भाव स्पष्ट करता है और स्रोत के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। सर्वनाम ‘तू/तेरे’ निकट और प्रत्यक्ष एकवचन सम्बोधन को सुरक्षित रखते हैं; अनावश्यक संस्कृतनिष्ठता से बचा गया है।
