  naturalness: The proposed revision remains fluent modern standard Hindi. “मुँह के बल गिर पड़ा,” “मेरी वाचा,” and “बहुत-सी जातियों का पिता बनेगा” are natural and suitably dignified. “देखो” is a more idiomatic direct imperative here than the clipped “देख.”
  terminology: “वाचा” is appropriate in this covenantal context and coheres with the English POB audit trail's contextual decision for “covenant.” “परमेश्वर,” “अब्राम,” and “जातियाँ” are consistently and appropriately rendered.
