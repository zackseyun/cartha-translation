base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/034.yaml
  text: And there will be great wrath from the Lord against the children of Israel, because they have forsaken his covenant and turned aside from his word and provoked and blasphemed, in that they do not perform the ordinance of this law; for they have made themselves like the nations, for uprooting and destruction from the earth. And there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned for all the sin of this eternal error.
translation:
  language: hi
  text: और इस्राएल की सन्तान पर प्रभु की ओर से बड़ा क्रोध आएगा, क्योंकि उन्होंने उसकी वाचा को त्याग दिया है, उसके वचन से फिर गए हैं, उसे क्रोधित किया है और उसकी निन्दा की है; क्योंकि वे इस व्यवस्था की विधि का पालन नहीं करते। उन्होंने अपने आप को अन्य जातियों के समान बना लिया है, उखाड़े जाने और पृथ्वी से नष्ट किए जाने के लिए। फिर उनके लिए न क्षमा होगी, न माफ़ी, ताकि इस अनन्त भटकाव के हर पाप के लिए उन्हें क्षमा और माफ़ी मिले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस सारे अनन्त भटकाव के पाप के लिए।”
    reason: अन्तिम गीज़ वाक्यांश में ‘सारे’ का व्याकरणिक सम्बन्ध ‘पाप’ से है या पूरे ‘भटकाव’ से, इसे अलग ढंग से समझा जा सकता है; मुख्य पाठ ኃጢአት (‘पाप’) को स्पष्ट रूप से सुरक्षित रखता है।
lexical_decisions:
- source_word: መዓት
  choice: बड़ा क्रोध
  rationale: यह दैवी रोष और आनेवाले न्याय, दोनों का भाव व्यक्त करता है; ዐቢይ के बल को ‘बड़ा’ से रखा गया है।
- source_word: ኪዳኖ
  choice: उसकी वाचा
  rationale: ‘वाचा’ धार्मिक-साहित्यिक हिन्दी में covenant का स्थापित और सटीक रूप है।
- source_word: ሥርዐተ፡ ለዝ፡ ሕግ
  choice: इस व्यवस्था की विधि
  rationale: ሥርዐት के नियत विधान/विधि और ሕግ के व्यवस्था/कानून—दोनों पदों को अलग रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ገብሩ፡ ነፍሳቲሆሙ፡ ከመ፡ አሕዛብ
  choice: उन्होंने अपने आप को अन्य जातियों के समान बना लिया है
  rationale: ‘अपने प्राणों’ का शब्दशः रूप हिन्दी में अस्वाभाविक होता; यहाँ आत्म-समानता का आशय ‘अपने आप को’ से स्पष्ट है। አሕዛብ को प्रसंगानुसार ‘अन्य जातियाँ’ कहा गया है।
- source_word: ለስስሎ፡ ወለተሠርዎ፡ እምድር
  choice: पृथ्वी पर से उखाड़े और मिटा दिए जाएँगे
  rationale: दो समानान्तर विनाशकारी क्रियाओं को पृथ्वी से निष्कासन और पूर्ण उन्मूलन की प्रबल छवि के साथ रखा गया है।
- source_word: ኅድገተ፡ ወስርየተ
  choice: क्षमा ... अपराधों की माफ़ी
  rationale: मूल के दो निकटार्थी क्षमा-पदों को हिन्दी में भी दो अभिव्यक्तियों द्वारा बनाए रखा गया है, यद्यपि पूर्ण अर्थभेद निश्चित नहीं है।
- source_word: ስሕተት፡ ዛቲ፡ ዘለዓለም
  choice: इस सदा बने रहनेवाले भटकाव
  rationale: ስሕተት का अर्थ भूल, त्रुटि या भटकाव हो सकता है; नैतिक-वाचागत प्रसंग में ‘भटकाव’ स्वाभाविक है। ዘለዓለም की स्थायी/अनन्त अवधि को ‘सदा बने रहनेवाले’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्षमा के निषेध की अवधि और व्यापकता
  choice: ‘तब उनके लिए न तो क्षमा होगी ... कि ... सारे पाप उन्हें क्षमा किए ... जाएँ’
  alternative: इसे बिना किसी कालगत या वाक्यगत तनाव के ‘उन्हें कभी कोई पाप क्षमा नहीं होगा’ कहना
  rationale: मूल में क्षमा और माफ़ी के दो पद तथा उद्देश्य/परिणाम सूचक रचना है। अनुवाद दण्ड-वचन की कठोरता बनाए रखता है, पर उससे आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: ‘अनन्त’ विशेषण का सम्बन्ध
  choice: इसे ‘भटकाव’ से जोड़ा गया
  alternative: इसे पूरे पाप या दण्ड की अनन्तता का विशेषण मानना
  rationale: गीज़ पदक्रम में ዛቲ፡ ዘለዓለም निकटवर्ती ስሕተት से सम्बद्ध है; फिर भी वाक्यांश की संरचना कुछ कठिन है, इसलिए वैकल्पिक पठन पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘वाचा’ और ‘व्यवस्था’ जैसे परिचित धार्मिक पद बनाए गए हैं, जबकि कठिन गीज़ वाक्यरचना को सहज हिन्दी वाक्यों में विभाजित किया गया है। सभी सर्वनाम मूल के अनुसार एकवचन परमेश्वर और बहुवचन इस्राएलियों से सम्बद्ध हैं।
