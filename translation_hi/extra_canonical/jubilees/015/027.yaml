  text: For all the angels of the presence and all the angels of holiness—thus was their creation from the day of their creation—and before the angels of the presence and the angels of holiness he sanctified Israel, that they might be with him and with his holy angels.
translation:
  language: hi
  text: क्योंकि उपस्थिति के सभी स्वर्गदूतों और पवित्रता के सभी स्वर्गदूतों की रचना उनके बनाए जाने के दिन से ऐसी ही थी;[a] और उपस्थिति के स्वर्गदूतों और पवित्रता के स्वर्गदूतों के सामने[b] उसने इस्राएल को पवित्र ठहराया, ताकि वे उसके और उसके पवित्र स्वर्गदूतों के साथ रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उन्हें उनके बनाए जाने के दिन से ऐसा ही रचा।”
    reason: गीज़ में मूल पद संज्ञात्मक है—शाब्दिक रूप से “उनकी रचना ऐसी थी”—पर इसे क्रियात्मक अर्थ में भी समझा जा सकता है।
  - marker: b
    text: या, “के सम्मुख”; अथवा, “के आमने-सामने।”
    reason: मूल शब्द स्थानिक रूप से सामने, सम्मुख या आमने-सामने होने का भाव दे सकता है; यहाँ इसका आशय विरोध होना आवश्यक नहीं है।
lexical_decisions:
- source_word: መላእክተ፡ ገጽ
  choice: उपस्थिति के स्वर्गदूत
  rationale: शाब्दिक अर्थ ‘मुख के स्वर्गदूत’ है, पर यह पदबंध परमेश्वर की उपस्थिति में रहने वाले स्वर्गदूतों के लिए प्रयुक्त उपाधि है; ‘उपस्थिति के स्वर्गदूत’ अर्थ और पारिभाषिक स्वरूप दोनों को बनाए रखता है।
- source_word: መላእክተ፡ ቅዳሴ
  choice: पवित्रता के स्वर्गदूत
  rationale: स्रोत के संज्ञात्मक पदबंध को बनाए रखा गया है; इसे केवल ‘पवित्र स्वर्गदूत’ करने से दोनों स्वर्गदूतीय समूहों के समानांतर नामों का रूप धुंधला पड़ सकता था।
- source_word: ፍጥረቶሙ
  choice: उनकी रचना
  rationale: गीज़ में यहाँ क्रिया नहीं, ‘रचना/सृष्टि/स्वभाव’ अर्थ वाला संज्ञात्मक रूप है। ‘रचना’ स्रोत की व्याकरणिक बनावट को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: አንጻሮሙ
  choice: के सामने
  rationale: इसका मूल स्थानिक अर्थ ‘सामने/सम्मुख/विपरीत’ हो सकता है। प्रसंग में ‘के सामने’ स्वाभाविक है और जानबूझकर विरोध का अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: इस्राएल के पवित्रीकरण का स्वर्गदूतों से संबंध
  choice: ‘उसने इस्राएल को पवित्र ठहराया’ और ‘ताकि वे उसके और उसके पवित्र स्वर्गदूतों के साथ रहें’
  alternative: इस्राएल को स्वर्गदूतों के समान या उन्हीं की श्रेणी में बनाया गया
  rationale: स्रोत साथ रहने और पवित्र ठहराए जाने की बात करता है, पर समान सत्ता, प्रकृति या श्रेणी का स्पष्ट दावा नहीं करता; इसलिए अतिरिक्त दार्शनिक निष्कर्ष नहीं जोड़ा गया।
- issue: ‘उनकी रचना ऐसी ही थी’ का अभिप्राय
  choice: संज्ञात्मक और कुछ हद तक अस्पष्ट कथन बनाए रखा
  alternative: ‘उसने उन्हें ऐसा ही रचा’ या ‘उनका स्वभाव ऐसा ही था’
  rationale: स्रोत ፍጥረቶሙ संज्ञा का प्रयोग करता है, जो रचना और स्वभाव दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘रचना’ रखा गया और संभावित क्रियात्मक अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। ‘उपस्थिति के स्वर्गदूत’ और ‘पवित्रता के स्वर्गदूत’ समानांतर पारिभाषिक पदों के रूप में सुरक्षित हैं। लंबे गीज़ वाक्य की संरचना को अर्धविराम से स्पष्ट किया गया है, बिना उसकी तर्कगत एकता तोड़े।
