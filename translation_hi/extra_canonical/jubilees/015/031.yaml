  yaml_path: translation/extra_canonical/jubilees/015/031.yaml
  text: And he sanctified him and gathered him from all the children of men; for there are many nations and many peoples, and all are his, and over all he appointed spirits to lead them astray from following him.
translation:
  language: hi
  text: और उसने उसे पवित्र ठहराया और सब मनुष्यों में से उसे इकट्ठा कर लिया; क्योंकि बहुत-से राष्ट्र और बहुत-से लोग हैं, और वे सब उसी के हैं। उन सब पर उसने आत्माओं को नियुक्त किया, ताकि वे उन्हें उसके पीछे चलने से[a] भटका दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘उसके पीछे से’।'
    reason: गीइज़ እምድኅሬሁ के शाब्दिक रूप को दर्शाते हुए पाठ में उसके मुहावरेदार, स्वाभाविक अर्थ को बनाए रखता है।
lexical_decisions:
- source_word: ቀደሶ
  choice: पवित्र ठहराया
  rationale: क्रिया के धार्मिक अर्थ को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አስተጋብኦ
  choice: अपने लिए अलग किया
  rationale: मूल क्रिया में समेटने/इकट्ठा करने का भाव है; प्रसंग में मानवजाति के बीच से विशेष रूप से चुनकर अपने पास करने का आशय स्पष्ट करने के लिए यह स्वाभाविक हिन्दी है।
- source_word: አሕዛብ ... ሕዝብ
  choice: राष्ट्र ... लोग
  rationale: दो निकटार्थक सामूहिक संज्ञाओं के भेद और मूल की पुनरुक्ति को बनाए रखता है।
- source_word: አሰለመ
  choice: नियुक्त किया
  rationale: किसी के ऊपर अधिकार अथवा कार्य सौंपने का अर्थ यहाँ उपयुक्त रूप से व्यक्त होता है।
- source_word: መናፍስተ
  choice: आत्माओं
  rationale: बहुवचन आध्यात्मिक सत्ताओं के लिए सीधा और परंपरागत हिन्दी समतुल्य।
- source_word: ያስሕትዎሙ
  choice: भटका दें
  rationale: कारक क्रिया का अर्थ—उन्हें मार्ग से च्युत कराना—स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: እምድኅሬሁ
  choice: उसके पीछे चलने से
  rationale: शाब्दिक अर्थ 'उसके पीछे से' है, पर सेमिटिक प्रयोग में अनुसरण का भाव है; यह चयन उसी अर्थ को सहज हिन्दी में रखता है।
theological_decisions:
- issue: भटकाने वाली आत्माओं की नियुक्ति में परमेश्वर की भूमिका
  choice: ‘उसने आत्माओं को नियुक्त किया’ का प्रत्यक्ष कथन बनाए रखा
  alternative: दैवी अनुमति अथवा निष्क्रिय सहमति के रूप में नरम करना
  rationale: मूल पाठ सक्रिय नियुक्ति का कथन करता है; उसके धार्मिक तनाव को व्याख्यात्मक ढंग से कम नहीं किया गया।
- issue: ‘वे सब उसी के हैं’ में स्वामित्व का विस्तार
  choice: इसे सभी राष्ट्रों और लोगों पर लागू रखा
  alternative: इसे केवल चुने गए व्यक्ति से जोड़ना
  rationale: बहुवचन संदर्भ और वाक्य-संरचना सार्वभौमिक स्वामित्व की ओर संकेत करते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। अर्धविराम और पूर्णविराम से मूल के लंबे वाक्य को पठनीय बनाया गया है। सर्वनामों की मूल अस्पष्टता को अनावश्यक नाम जोड़कर नहीं सुलझाया गया।
