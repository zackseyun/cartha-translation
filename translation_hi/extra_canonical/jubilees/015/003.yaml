translation:
  language: hi
  text: और प्रभु अब्राम को दिखाई दिया और उससे कहा, “मैं परमेश्वर शद्दाई हूँ; मेरे सामने ऐसा आचरण कर जो मुझे भाता है, और निर्दोष बना रह।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ में प्रयुक्त सामान्य दिव्य उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
- source_word: አምላክ፡ ሰዳይ
  choice: सर्वशक्तिमान परमेश्वर
  rationale: ‘शद्दाई’ दिव्य नाम/उपाधि है; मुख्य पाठ में इसका अर्थ-सुगम पारंपरिक हिन्दी रूप रखा गया है और ध्वन्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: አሥምር፡ ቅድሜየ
  choice: मेरे सामने वही कर जो मुझे भाता है
  rationale: क्रिया का अर्थ ‘प्रसन्न करना/भाने योग्य आचरण करना’ है, ‘चलना’ नहीं; यह रूप गीज़ स्रोत को उत्पत्ति के इब्रानी पाठ से मिलाने से बचता और हिन्दी में स्वाभाविक रहता है।
- source_word: ኩን፡ ፍጹመ
  choice: निर्दोष बना रह
  rationale: ፍጹመ पूर्णता, अखंडता या निष्कलंकता का भाव देता है; प्रसंग में नैतिक अखंडता के लिए ‘निर्दोष’ सहज है।
theological_decisions:
- issue: दिव्य उपाधि ሰዳይ का प्रस्तुतीकरण
  choice: मुख्य पाठ में ‘सर्वशक्तिमान परमेश्वर’, पादटिप्पणी में ‘एल शद्दाई’
  alternative: केवल ‘परमेश्वर शद्दाई’
  rationale: अर्थ सामान्य पाठक के लिए स्पष्ट रहता है, जबकि स्रोत की विशिष्ट उपाधि पादटिप्पणी में सुरक्षित है।
- issue: አሥምር को उत्पत्ति 17:1 के इब्रानी ‘चल’ से समन्वित करना
  choice: ‘वही कर जो मुझे भाता है’
  alternative: ‘मेरे सामने चल’
  rationale: गीज़ क्रिया प्रसन्न करने या भाने योग्य होने का निर्देश देती है; ‘चल’ कहना बाहरी इब्रानी समानांतर को स्रोत पर आरोपित करेगा।
- issue: ፍጹመ में पूर्णता और निर्दोषता का तनाव
  choice: ‘निर्दोष बना रह’
  alternative: ‘सिद्ध बन’
  rationale: ‘सिद्ध’ हिन्दी में निरपेक्ष पापहीनता का अनावश्यक अर्थ दे सकता है; ‘निर्दोष’ covenantal integrity का भाव अधिक स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। आज्ञाओं में एकवचन निकट संबोधन रखा गया है। ‘मेरे सामने वही कर जो मुझे भाता है’ को जानबूझकर ‘मेरे सामने चल’ नहीं किया गया, क्योंकि गीज़ स्रोत में प्रसन्न करने का अर्थ है।
