  text: And I will establish my covenant between me and you, and I will multiply you greatly.
translation:
  language: hi
  text: और मैं अपने और तुम्हारे बीच अपनी वाचा स्थापित करूँगा और तुम्हें बहुत अधिक बढ़ाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ
  choice: स्थापित करूँगा
  rationale: इस क्रिया का मूल अर्थ ‘दूँगा’ है, पर वाचा के संदर्भ में हिन्दी में ‘वाचा स्थापित करना’ स्वाभाविक और आशय-संगत है।
- source_word: ኪዳንየ
  choice: अपनी वाचा
  rationale: ‘वाचा’ ኪዳን के गंभीर धार्मिक और संबंधपरक अर्थ को सुरक्षित रखती है।
- source_word: አአብቀከ፡ ጥቀ
  choice: तुम्हें बहुत अधिक बढ़ाऊँगा
  rationale: यह अभिव्यक्ति अत्यधिक वृद्धि का आशय सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: वाचा देने या स्थापित करने की अभिव्यक्ति
  choice: अपनी वाचा स्थापित करूँगा
  alternative: अपनी वाचा दूँगा
  rationale: शाब्दिक ‘दूँगा’ संभव है, किंतु यहाँ वाचा-संबंध को प्रभावी रूप से कायम करने का भाव है; ‘स्थापित’ इस संदर्भ में स्पष्ट है और कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘मेरे और तुम्हारे बीच’ की अपेक्षा ‘अपने और तुम्हारे बीच’ हिन्दी में अधिक स्वाभाविक है और प्रथम पुरुष संबंध को यथावत रखता है।
