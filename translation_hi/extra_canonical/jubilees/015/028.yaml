  yaml_path: translation/extra_canonical/jubilees/015/028.yaml
  text: And you, command the children of Israel, and let them keep the sign of the covenant throughout their generations as an everlasting ordinance, and they shall not be uprooted from the land.
translation:
  language: hi
  text: और तुम इस्राएलियों को आज्ञा दो कि वे पीढ़ी-दर-पीढ़ी वाचा के चिन्ह का पालन सदा के विधान के रूप में करें, और वे देश से उखाड़े नहीं जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: और तुम भी
  rationale: संयोजक, द्वितीय पुरुष सर्वनाम और बलसूचक अव्यय—तीनों को दर्शाता है; स्रोत में ‘अब’ नहीं है।
- source_word: ለውሉደ፡ እስራኤል
  choice: इस्राएल की सन्तान
  rationale: शाब्दिक अर्थ को बनाए रखते हुए हिन्दी बाइबिलीय प्रयोग में स्वाभाविक सामूहिक अभिव्यक्ति है।
- source_word: ትእምርተ፡ ኪዳን
  choice: वाचा के चिन्ह
  rationale: ‘चिन्ह’ और ‘वाचा’ दोनों स्रोत-पदों का सीधा और धर्मशास्त्रीय रूप से निरपेक्ष प्रतिनिधित्व करते हैं।
- source_word: ለትውልዶሙ
  choice: पीढ़ी-दर-पीढ़ी
  rationale: ‘उनकी पीढ़ियों के लिए/भर’ का स्वाभाविक आधुनिक हिन्दी रूप, जिसमें निरन्तर वंशानुगत पालन का भाव रहता है।
- source_word: ለሥርዐት፡ ዘለዓለም
  choice: सदा की विधि के रूप में
  rationale: स्थायी नियम या विधान के अर्थ को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ወኢይሠረዉ፡ እምነ፡ ምድር
  choice: और वे देश से उखाड़े नहीं जाएँगे
  rationale: निषेधात्मक निष्क्रिय क्रिया और भूमि/देश से हटाए जाने की सशक्त रूपकात्मक छवि को सुरक्षित रखता है।
theological_decisions:
- issue: अन्तिम प्रतिज्ञा और आज्ञापालन के बीच सम्बन्ध
  choice: दोनों उपवाक्यों को ‘और’ से जोड़ा गया
  alternative: ‘तब’ लगाकर स्पष्ट शर्त-परिणाम सम्बन्ध बनाना
  rationale: स्रोत में संयोजक ‘और’ है; ‘तब’ जोड़ने से निहित धर्मशास्त्रीय सम्बन्ध आवश्यकता से अधिक स्पष्ट और शर्तबद्ध हो जाता।
- issue: वाचा का निर्देश
  choice: ‘वाचा’ कहा गया, ‘इस वाचा’ नहीं
  alternative: ‘इस वाचा’
  rationale: स्रोत में संकेतवाचक विशेषण नहीं है, इसलिए अनावश्यक विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘सन्तान’, ‘वाचा’, ‘चिन्ह’ और ‘विधि’ परिचित बाइबिलीय शब्दावली हैं; वाक्य-संरचना स्रोत के समन्वयी प्रवाह को बनाए रखती है।
