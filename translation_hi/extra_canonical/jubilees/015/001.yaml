  text: In the fifth year of the fourth week of this jubilee, in the third month, in the middle of the month, Abram celebrated the festival of the firstfruits of the wheat harvest.
translation:
  language: hi
  text: इस जुबली के चौथे सप्ताह के पाँचवें वर्ष में, तीसरे महीने के मध्य में, अब्राम ने गेहूँ की फसल की पहली उपज का पर्व मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልዉን
  choice: जयन्ती-चक्र
  rationale: यह कालगणना के ‘जुबली’ कालखंड को दर्शाता है; ‘चक्र’ जोड़ने से आधुनिक हिन्दी पाठक के लिए इसका कालक्रमिक अर्थ स्पष्ट होता है।
- source_word: በመንፈቀ፡ ወርኀ
  choice: महीने के मध्य में
  rationale: गीज़ पदबंध का सीधा अर्थ महीने के आधे या मध्य का समय है; यह रूप अनावश्यक रूप से किसी निश्चित तारीख का अनुमान नहीं लगाता।
- source_word: ቀዳሜ፡ ማእረር
  choice: कटनी की पहली उपज
  rationale: यह कटनी के आरम्भिक फल/उपज के पर्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ስርናይ
  choice: गेहूँ
  rationale: गीज़ शब्द विशेष रूप से गेहूँ को सूचित करता है, सामान्य अनाज को नहीं।
