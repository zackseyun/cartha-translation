- from: “और मैं तुझे और तेरे बाद तेरे वंश को वह देश दूँगा जहाँ तू परदेशी होकर रहा है—कनान देश—कि वह सदा के लिए उनकी संपत्ति हो; और मैं उनका परमेश्वर होऊँगा।”
  to: “और मैं तुझे और तेरे बाद तेरे वंश को वह देश, जहाँ तू परदेशी होकर रहा है, अर्थात् कनान देश, सदा के लिए उनकी संपत्ति के रूप में दूँगा; और मैं उनका परमेश्वर होऊँगा।”
