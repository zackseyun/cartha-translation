  yaml_path: translation/extra_canonical/jubilees/015/010.yaml
  text: And I will give to you and to your seed after you the land where you have resided as a foreigner, the land of Canaan, for an everlasting possession, and I will be their God.”
translation:
  language: hi
  text: “और मैं तुझे और तेरे बाद तेरे वंश को वह देश, जहाँ तू परदेशी होकर रहा है, अर्थात् कनान देश, सदा के लिए उनकी संपत्ति के रूप में दूँगा; और मैं उनका परमेश्वर होऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእ
  choice: वंश
  rationale: यहाँ शब्द सामूहिक भाव में अब्राहम के बाद आने वाली संतति को दर्शाता है; आधुनिक हिन्दी में ‘वंश’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ፈለስከ
  choice: तू परदेशी होकर रहा है
  rationale: क्रिया का आशय किसी देश में प्रवासी अथवा परदेशी के रूप में निवास करना है; इस अनुवाद में निवास और परदेशीपन दोनों सुरक्षित हैं।
- source_word: ዘትኳን
  choice: संपत्ति
  rationale: वचन में देश के स्थायी अधिकार/अधिग्रहण का भाव है; ‘संपत्ति’ सामान्य पाठक के लिए स्पष्ट है और केवल अस्थायी निवास का अर्थ नहीं देती।
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: गीज़ पदबंध दीर्घस्थायी अथवा अनंत काल का भाव देता है; ‘सदा के लिए’ उस कालगत दावे को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: አምላከ
  choice: परमेश्वर
  rationale: वाचा-संबंधी कथन ‘मैं उनका परमेश्वर होऊँगा’ के लिए हिन्दी बाइबलीय प्रयोग में यह गरिमापूर्ण और सहज पद है।
theological_decisions:
- issue: भूमि के वचन की स्थायित्व-भाषा
  choice: ‘सदा के लिए उनकी संपत्ति’
  alternative: ‘अनंतकाल की निज भूमि’
  rationale: मूल के स्थायी अधिकार के दावे को यथावत रखा गया है, पर उसके कालगत या धर्मवैज्ञानिक विस्तार को व्याख्या द्वारा सीमित नहीं किया गया।
- issue: सर्वनाम का एकवचन से बहुवचन में परिवर्तन
  choice: ‘तुझे ... तेरे वंश को ... उनकी ... उनका’
  alternative: बहुवचन को एकवचन बनाकर ‘उसकी ... उसका’
  rationale: मूल पाठ में अब्राहम को संबोधन एकवचन है, जबकि अंतिम अधिकार और परमेश्वर-संबंध के सर्वनाम बहुवचन हैं; इस तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘तुझे/तेरे’ एकवचन संबोधन मूल के व्याकरण को बनाए रखते हैं; विराम-चिह्न कनान देश को पहले उल्लिखित देश की स्पष्ट पहचान के रूप में प्रस्तुत करते हैं।
