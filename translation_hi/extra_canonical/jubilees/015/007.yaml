  text: And your name shall no longer be called Abram, but from now and forever your name shall be Abraham, for I have made you the father of many nations.
translation:
  language: hi
  text: और तुम्हारा नाम अब्राम नहीं पुकारा जाएगा, बल्कि अब से सदा के लिए तुम्हारा नाम अब्राहम होगा, क्योंकि मैंने तुम्हें बहुत-सी जातियों का पिता ठहराया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይጼዋዕ
  choice: नहीं पुकारा जाएगा
  rationale: गीज़ के निषेधयुक्त कर्मवाच्य ‘न पुकारा जाए/जाएगा’ को निकटता से व्यक्त करता है।
- source_word: አምይእዜ፡ ወእስከ፡ ለዓለም
  choice: अब से सदा के लिए
  rationale: समय-सूचक पदों ‘अब से’ और ‘युग तक/सदा’ दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: አበ፡ ብዙኃን፡ አሕዛብ
  choice: बहुत-सी जातियों का पिता
  rationale: ‘अनेक/बहुत-से लोगों अथवा राष्ट्रों का पिता’ के अर्थ को बाइबलीय और सामान्य हिन्दी में व्यक्त करता है; ‘जातियाँ’ यहाँ जनसमूहों/राष्ट्रों के अर्थ में है।
- source_word: ሤምኩከ
  choice: मैंने तुम्हें ... ठहराया है
  rationale: पूर्ण क्रिया के अर्थ को बनाए रखते हुए हिन्दी में नियुक्ति/स्थापना का भाव स्पष्ट करता है।
theological_decisions:
- issue: अब्राहम को बहुत-सी जातियों का पिता बनाने का कथन
  choice: मैंने तुम्हें ... ठहराया है
  alternative: मैं तुम्हें ... बनाऊँगा
  rationale: स्रोत में पूर्ण क्रियारूप है; अतः भविष्यकाल करके प्रतिज्ञा की कालगत दृढ़ता को बदलने के बजाय पूर्ण भाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सहज बाइबलीय शैली। नामों के प्रचलित रूप ‘अब्राम’ और ‘अब्राहम’ रखे गए हैं; किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
