translation:
  language: hi
  text: अशुद्ध वस्तुओं की ओर, या तराशी हुई प्रतिमाओं के पीछे, या ढली हुई प्रतिमाओं के पीछे। और किसी भी प्रकार का लहू मत खाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለርኩሳን
  choice: अशुद्ध वस्तुओं के लिए
  rationale: ርኩሳን का बहुवचन अर्थ ‘अशुद्ध वस्तुएँ/चीज़ें’ है; उपसर्ग ለ- के संबंधसूचक भाव को ‘के लिए’ से व्यक्त किया गया है।
- source_word: ለገሊፎ
  choice: खुदी हुई प्रतिमाओं
  rationale: ገሊፎ तराशी या खोदकर बनाई गई आकृतियों को सूचित करता है; ‘खुदी हुई प्रतिमाएँ’ साधारण और सटीक हिन्दी है।
- source_word: ለስብክ
  choice: ढली हुई प्रतिमाओं
  rationale: यह धातु आदि को ढालकर बनाई गई आकृतियों का संकेत देता है; इसलिए ‘ढली हुई प्रतिमाएँ’ चुना गया है।
- source_word: ወኢትብልዑ፡ ወኢምዝተኒ
  choice: और किसी भी प्रकार का लहू मत खाना
  rationale: निषेधात्मक क्रिया को सीधे आदेश के रूप में रखा गया है और अंतिम अनिश्चित/समग्र बल को ‘किसी भी प्रकार का’ से व्यक्त किया गया है।
theological_decisions:
- issue: प्रतिमाओं से संबंधित वाक्यांशों का संबंध
  choice: ‘पीछे’ को बनाए रखा गया
  alternative: ‘के लिए’ अथवा ‘को’
  rationale: प्राप्त गीइज़ पाठ में ድኅሬሆሙ का स्थानिक/अनुगामी भाव है और परामर्श-पाठ भी ‘after’ देता है; इसे किसी विशिष्ट मूर्तिपूजा-विधि के रूप में समझाकर तनाव मिटाना उचित नहीं था।
- issue: लहू के निषेध का विस्तार
  choice: ‘किसी भी प्रकार का लहू’
  alternative: केवल ‘लहू’
  rationale: अंतिम पद निषेध को व्यापक बनाता है; इसलिए पूर्ण निषेध का बल स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आज्ञार्थक और गरिमापूर्ण शैली रखी गई है। स्रोत-अंश स्वयं पिछले कथन से जुड़ा हुआ प्रतीत होता है, इसलिए आरंभिक वाक्यांश की अपूर्ण संरचना को अनुमान से पूरा नहीं किया गया।
