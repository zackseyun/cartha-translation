translation:
  language: hi
  text: और अपने हाथ और पैर धोओ। न तुम पर, न तुम्हारे वस्त्रों पर कोई खून दिखाई दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትሐፀብ
  choice: धोना
  rationale: गीज़ क्रिया का अर्थ ‘धोना’ है; प्रसंग में निर्देशात्मक रूप को स्वाभाविक हिन्दी में अनन्त क्रियारूप से व्यक्त किया गया है।
- source_word: እደዊከ፡ ወእገሪከ
  choice: अपने हाथ-पाँव
  rationale: शाब्दिक अर्थ ‘अपने हाथ और अपने पैर’ है; ‘हाथ-पाँव’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक युग्म है।
- source_word: ደም
  choice: खून
  rationale: ‘रक्त’ की अपेक्षा ‘खून’ आम आधुनिक हिन्दी में अधिक सहज है और मूल अर्थ को ठीक बनाए रखता है।
- source_word: አልባሲክሙ
  choice: तुम्हारे वस्त्रों
  rationale: मूल के बहुवचन ‘वस्त्र/कपड़े’ को गरिमापूर्ण और स्पष्ट हिन्दी में ‘वस्त्रों’ कहा गया है।
theological_decisions:
- issue: खून दिखाई देने की मनाही का विस्तार
  choice: तुम पर या तुम्हारे वस्त्रों पर
  alternative: तुम्हारे वस्त्रों के भीतर/बीच में
  rationale: गीज़ वाक्यरचना और अंग्रेज़ी परामर्श-पाठ निषेध को व्यक्ति तथा वस्त्र, दोनों पर लागू समझते हैं; इसे अनुष्ठानिक अर्थ से आगे किसी विशिष्ट धर्मसैद्धान्तिक निष्कर्ष में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन संबोधन के कारण ‘अपने’ और ‘तुम पर’ प्रयुक्त हैं; वस्त्रों के साथ मूल में बहुवचन-संबंधी रूप होने पर भी हिन्दी में संबोधित व्यक्ति के लिए स्वाभाविक ‘तुम्हारे’ रखा गया है।
