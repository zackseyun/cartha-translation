review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the purpose clause as positive ('to take care/observe to do') rather than reversing it into avoidance of idols. It also appropriately leaves the infinitive's object to be supplied by the following verse. 'उसके सभी मार्गों' reflects the source and the English audit trail.
  naturalness: '''ताकि मैं करने का ध्यान रखूँ'' is not idiomatic Hindi: ''ध्यान रखना'' normally requires a clearer object or construction. ''ताकि मैं करने में सावधान रहूँ'' is a natural, suitably formal rendering while retaining the deliberately incomplete, verse-spanning syntax.'
  terminology: '''मूर्तियों,'' ''मेरी आत्मा,'' and ''सीधाई से चलना'' are accurate and appropriate for modern dignified Hindi. Changing ''पर'' to ''में'' in connection with ''मार्गों में चलना'' is more idiomatic Hindi without changing the metaphor.'
  issues:
  - severity: medium
    issue: Final purpose clause is grammatically awkward in Hindi.
    rationale: '''करने का ध्यान रखूँ'' leaves the construction strained, even with a footnote. The source does leave the object for the next verse, but Hindi can preserve that open syntax more naturally with ''करने में सावधान रहूँ.'''
  - severity: low
    issue: Locative expression for walking in paths is less idiomatic.
    rationale: Hindi conventionally says 'मार्गों में चलना' rather than 'मार्गों पर चलना' for this moral metaphor.
  revised_text: और उसके सभी मार्गों में सीधाई से चलना। मेरी आत्मा ने मूर्तियों से घृणा की, ताकि मैं करने में सावधान रहूँ।[a]
