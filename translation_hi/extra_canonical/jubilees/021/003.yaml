  yaml_path: translation/extra_canonical/jubilees/021/003.yaml
  text: and to walk uprightly in all his paths. My soul hated idols, that I might observe to do
translation:
  language: hi
  text: और उसके सभी मार्गों में सीधाई से चलना। मेरी आत्मा ने मूर्तियों से घृणा की, ताकि मैं करने में सावधान रहूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ताकि मैं करने के लिए सावधान रहूँ”; क्या करना है, यह अगले पद में बताया गया है।
    reason: पद-विभाजन के कारण अंतिम वाक्यांश हिन्दी में अधूरा लग सकता है। टिप्पणी स्पष्ट करती है कि क्रिया का कर्म अगले पद में आता है और यह नकारात्मक अर्थ (“उन्हें करने से बचूँ”) नहीं देता।
lexical_decisions:
- source_word: አርትዕ፡ ሐዊረ
  choice: सीधाई से चलना
  rationale: यह पदबंध नैतिक रूप से ठीक अथवा खरे ढंग से चलने का भाव देता है; ‘सीधाई से’ मूल रूपक को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: በኵሉ፡ ፍናዊሁ
  choice: उसके सभी मार्गों पर
  rationale: ‘सभी’ मूल के समग्र भाव को और ‘मार्गों पर’ आचरण के रूपक को सुरक्षित रखता है।
- source_word: ጣዖተ
  choice: मूर्तियों
  rationale: यहाँ बहुवचन में उपासना की मूर्तियों का संकेत है; आधुनिक हिन्दी में ‘मूर्तियाँ’ स्पष्ट और सामान्य शब्द है।
- source_word: ጸልአት፡ ነፍስየ
  choice: मेरी आत्मा ने … से घृणा की
  rationale: मूल की कर्ता-संरचना और ‘मेरी आत्मा’ की प्रबल, अंतरंग अभिव्यक्ति को बनाए रखा गया है।
- source_word: ከመ፡ እትዐቀብ፡ ለገቢረ
  choice: ताकि मैं करने का ध्यान रखूँ
  rationale: यह उद्देश्य और सावधानीपूर्वक पालन करने का भाव देता है। ‘करने’ का कर्म अगले पद में आता है, इसलिए इस पद में उसे जोड़कर अर्थ को उलटा या पूरा नहीं किया गया।
theological_decisions:
- issue: अंतिम क्रिया के अनकहे कर्म का अर्थ
  choice: इस पद को ‘ताकि मैं करने का ध्यान रखूँ’ के रूप में खुला रखा गया
  alternative: ‘ताकि मैं उन्हें करने से अपने को बचाऊँ’
  rationale: मूल में ‘करने के लिए/करने का ध्यान रखना’ है; ‘उन्हें करने से बचना’ मूर्तियों को क्रिया का कर्म मानकर अर्थ को उलट देता है। वास्तविक कर्म अगले पद में आता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी अपनाई गई है। मूल के पद-विभाजन तथा अगले पद तक जारी रहने वाली वाक्य-रचना को कृत्रिम रूप से पूरा नहीं किया गया।
