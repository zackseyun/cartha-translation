  yaml_path: translation/extra_canonical/jubilees/021/012.yaml
  text: 'your offerings before the Lord. And take care with the wood of the offering, that you do not bring wood for the altar in addition to these: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar.'
translation:
  language: hi
  text: 'अपने चढ़ावे प्रभु के सामने चढ़ाना। और बलि के लिए लकड़ी के विषय में सावधान रहना; इनके अतिरिक्त वेदी के लिए कोई और लकड़ी न लाना: सरू, फ़र, बादाम, चीड़, रालदार चीड़, देवदार, जुनिपर, क्लेमाटिस, जैतून, मर्टल, तेजपात और देवदार।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पूर्ववर्ती अनुवाद में यह वाक्य इस प्रकार दिया गया था: “और बलि की लकड़ी के विषय में सावधान रहना, कि इनमें से कोई लकड़ी बलि के लिए न लाना: अंगूर की बेल, अंजीर, मर्टल, तेजपात, सरू, देवदार, जुनिपर, खजूर, बादाम, जैतून, गंधरस, बे-वृक्ष और ऐश-वृक्ष।”'
    reason: यह उपलब्ध स्रोत-पाठ का प्रमाणित वैकल्पिक पाठ नहीं, बल्कि पूर्ववर्ती अनुवाद-रूप है। इसे उस रूप में चिह्नित करने से पाठ-भेद और अनुवाद-भेद में अंतर बना रहता है।
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: अपने चढ़ावे
  rationale: यह प्रत्यययुक्त रूप ‘तुम्हारा चढ़ावा/बलिदान’ दर्शाता है; प्रसंगानुसार हिन्दी में बहुवचन सामूहिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: यह पारंपरिक गीइज़ ईश्वरीय संबोधन है; यहाँ अंग्रेज़ी परामर्श-पाठ के ‘Lord’ के अनुरूप, किसी विशिष्ट नाम को आरोपित किए बिना ‘प्रभु’ रखा गया है।
- source_word: ዕፀወ፡ መሥዋዕት
  choice: बलि की लकड़ी
  rationale: शाब्दिक अर्थ ‘बलिदान/चढ़ावे की लकड़ी’ है; ‘बलि की लकड़ी’ संक्षिप्त और स्वाभाविक है।
- source_word: ምሥዋዕ
  choice: वेदी
  rationale: इस निकटवर्ती किंतु भिन्न रूप को चढ़ावे के बजाय वेदी के अर्थ में लिया गया है, जिससे መሥዋዕት के साथ अनुचित विलय नहीं होता।
- source_word: ዲበ፡ ዝንቱ
  choice: इन लकड़ियों के अलावा
  rationale: वाक्य के निषेध को सूची तक सीमित करने के बजाय अनुमत सूची से बाहर की लकड़ी न लाने की आज्ञा के रूप में व्यक्त करता है; स्रोत-समीक्षा में पहचानी गई उलटी व्याख्या से बचता है।
- source_word: ቍጲርሳን፡ ወጰፍሪን፡ ወስጋድ፡ ወስጥርቢሎን፡ ወጱጦን፡ ወቂድርን፡ ወሱራት፡ ወታናክ፡ ወዕፀ፡ ዘይት፡ ምርስኔ፡ ወደፍን፡ ወቄዳር
  choice: सरू, फर, बादाम, चीड़, रालदार चीड़, देवदार, जुनिपर, क्लेमाटिस, जैतून, मर्टल, तेजपात और देवदार
  rationale: पादप-नामों की पहचान में अंतर्निहित अनिश्चितता रखते हुए समीक्षित स्रोत-पठन का अनुसरण किया गया है। अंतिम और पहले आए ‘देवदार’ को समान कर देने के बजाय सूची की पुनरावृत्ति ज्यों की त्यों रखी गई है।
theological_decisions:
- issue: क्या सूचीबद्ध लकड़ियाँ निषिद्ध हैं या केवल वही अनुमत हैं
  choice: सूची के अलावा कोई अन्य लकड़ी वेदी के लिए न लाई जाए
  alternative: सूचीबद्ध लकड़ियाँ बलि के लिए न लाई जाएँ
  rationale: गीइज़ ዲበ፡ ዝንቱ और नवीन स्रोत-समीक्षा इस प्रतिबंध को अनुमत सूची से बाहर की लकड़ी पर लागू मानते हैं। वास्तविक पाठ-परंपरागत अनिश्चितता को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: መሥዋዕት और ምሥዋዕ का भेद
  choice: पहले को ‘बलि’ और दूसरे को ‘वेदी’
  alternative: दोनों को ‘चढ़ावा/बलि’
  rationale: दो अलग रूपों के अर्थगत भेद को बनाए रखना स्रोत के अधिक निकट है और आज्ञा को समझने योग्य बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आज्ञार्थक रूप अपनाया गया है। दुर्लभ पादप-नामों के लिए जहाँ सर्वमान्य हिन्दी नाम नहीं है वहाँ प्रचलित लिप्यंतरण रखा गया है। आरंभिक खंड संभवतः पिछले वाक्य से जुड़ा है, इसलिए ‘चढ़ाना’ को निहित क्रिया के रूप में स्पष्ट किया गया है।
