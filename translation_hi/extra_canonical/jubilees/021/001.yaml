  yaml_path: translation/extra_canonical/jubilees/021/001.yaml
  text: And in the sixth year of the seventh week of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and I am full of my days.”
translation:
  language: hi
  text: इस जुबली के सातवें सप्ताह के छठे वर्ष में अब्राहम ने अपने पुत्र इसहाक को बुलाया और उसे आज्ञा दी और कहा, “मैं बूढ़ा हो गया हूँ। मैं अपनी मृत्यु का दिन नहीं जानता, और मैं अपने दिनों से तृप्त हो चुका हूँ[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे दिन पूरे हो चुके हैं।”
    reason: मूल मुहावरे को दिनों से तृप्त होने अथवा जीवन के दिन पूरे होने—दोनों प्रकार से समझा जा सकता है।
lexical_decisions:
- source_word: አዘዞ
  choice: उसे आज्ञा देते हुए
  rationale: मूल क्रिया में आदेश देने या दृढ़ निर्देश देने का भाव है; यह प्रयोग उस अर्थ को बनाए रखते हुए हिन्दी में अगले पदों से जुड़ने योग्य है।
- source_word: ረሳዕኩ
  choice: मैं बूढ़ा हो गया हूँ
  rationale: यह अब्राहम की वृद्धावस्था का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: ጸገብኩ፡ መዋዕልየ
  choice: मैं अपने दिनों से तृप्त हो चुका हूँ
  rationale: प्रथम पुरुष एकवचन क्रिया और ‘दिनों से परिपूर्ण/तृप्त’ होने के सामी बाइबलीय मुहावरे को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: जीवन के दिनों की पूर्णता दर्शाने वाला अंतिम मुहावरा
  choice: मैं अपने दिनों से तृप्त हो चुका हूँ
  alternative: मेरे दिन पूरे हो चुके हैं
  rationale: चुना हुआ पाठ मूल की प्रथम पुरुष एकवचन व्याकरण और तृप्ति/परिपूर्णता के रूपक दोनों को बनाए रखता है; अधिक प्रचलित वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘जुबली’ और ‘सप्ताह’ ग्रंथ की कालगणना के तकनीकी पदों के रूप में बनाए गए हैं; अनावश्यक रूप से ‘वर्षों का सप्ताह’ नहीं जोड़ा गया।
