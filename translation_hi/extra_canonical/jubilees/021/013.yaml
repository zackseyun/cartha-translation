  yaml_path: translation/extra_canonical/jubilees/021/013.yaml
  text: '[called] arsatna and besem[13]; but from among these woods place under the sacrifice upon the altar those proven in appearance. And do not place any split or dark wood, but hard and clean wood, without blemish, sound and freshly grown; and do not place old wood[13], because its fragrance has gone out.'
translation:
  language: hi
  text: '[जिनके नाम] अरसातना और बेसेम हैं।[a] इन लकड़ियों में से केवल वही लकड़ियाँ वेदी पर बलिदान के नीचे रखो जो देखने में परखी हुई हों। कोई फटी या काली लकड़ी न रखो, बल्कि कठोर और स्वच्छ लकड़ी रखो—निर्दोष, सही-सलामत और नई उगी हुई। पुरानी लकड़ी न रखो,[a] क्योंकि उसकी सुगंध जा चुकी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अरसातना” और “बेसेम” कठिन तथा संभवतः विकृत, उधार लिए हुए, या क्षेत्रीय वृक्ष-नाम हैं; उनकी ठीक-ठीक पहचान अनिश्चित है। यह वाक्यांश पाठ की दृष्टि से भी कुछ कठिन है। फिर भी बड़े प्रसंग का आशय स्पष्ट है कि वेदी की आग के लिए केवल अच्छी, सही-सलामत और सुगंधित लकड़ी चुनी जाए।
    reason: lexical_alternative; textual_variant
