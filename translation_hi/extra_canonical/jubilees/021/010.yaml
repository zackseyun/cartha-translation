  text: and with its drink offering, for a pleasing aroma, a grain offering to the Lord. And eat its flesh on that day and on the second day, and do not let the sun go down on it on the second day until it is eaten, and do not leave any of it for the third day, because it is not acceptable, because it is a profane thing, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the book of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.
translation:
  language: hi
  text: और उसके पेय-बलि के साथ, यहोवा के लिए मनभावनी सुगंध हेतु अन्नबलि चढ़ाना। उसका मांस उसी दिन और दूसरे दिन खाना; और दूसरे दिन, जब तक उसे खा न लिया जाए, तब तक उस पर सूर्यास्त न होने देना। उसमें से कुछ भी तीसरे दिन के लिए न छोड़ना, क्योंकि वह स्वीकार्य नहीं है; क्योंकि वह अपवित्र वस्तु है और उसे खाया नहीं जाना चाहिए। जो कोई उसे खाएगा, वह अपना पाप उठाएगा। क्योंकि मैंने ऐसा ही अपने प्राचीन पूर्वजों की पुस्तक में, और हनोक के वचनों में, और नूह के वचनों में लिखा हुआ पाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞጻሕቱ
  choice: उसके अर्घ
  rationale: यह बलि के साथ चढ़ाए जाने वाले पेय-अर्पण को दर्शाता है; ‘अर्घ’ संक्षिप्त, प्रतिष्ठित और धार्मिक संदर्भ में बोधगम्य है।
- source_word: ኅብስተ፡ ጽንሓሕ
  choice: अन्नबलि
  rationale: यह पद पेय-अर्पण से अलग अनाज अथवा रोटी के अर्पण का उल्लेख करता है; इसलिए दोनों अर्पण सुरक्षित रखे गए हैं।
- source_word: መዓዛ፡ ሠናይ
  choice: मनभावनी सुगंध
  rationale: शाब्दिक अर्थ ‘अच्छी/सुखद सुगंध’ है; यह बलिदानी स्वीकृति का पारंपरिक भाव स्वाभाविक हिन्दी में रखता है।
- source_word: እኩይ፡ ኅሩየ
  choice: अपवित्र वस्तु
  rationale: संदर्भ में तीसरे दिन बचा हुआ बलि-मांस धार्मिक उपयोग के लिए अयोग्य और दूषित है; ‘अपवित्र’ इस अनुष्ठानिक भाव को ‘बुरी चुनी हुई वस्तु’ जैसे अस्वाभाविक अक्षरार्थ से बेहतर व्यक्त करता है।
- source_word: ኃጢአተ፡ ሎሙ፡ ይነሥኡ
  choice: अपने पाप का दोष उठाएगा
  rationale: ‘पाप उठाना’ के दायित्व और दंडनीय दोष दोनों भावों को स्पष्ट रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: መጽሐፈ፡ አበዊየ፡ ቀደምት
  choice: अपने प्राचीन पूर्वजों की पुस्तक
  rationale: स्रोत में ‘पुस्तक’ एकवचन है और पूर्वजों के लिए बहुवचन संबंध है; दोनों व्याकरणिक विशेषताएँ सुरक्षित हैं।
theological_decisions:
- issue: दूसरे दिन सूर्यास्त से पहले बलि-मांस खाने की समय-सीमा
  choice: दूसरे दिन जब तक वह खा न लिया जाए, तब तक उस पर सूर्य अस्त न होने देना
  alternative: दूसरे दिन उस पर सूर्य अस्त न होने देना
  rationale: स्रोत की कुछ कठिन वाक्यरचना को पूरी तरह समतल किए बिना खाने की समाप्ति और सूर्यास्त की सीमा, दोनों को बनाए रखा गया है।
- issue: तीसरे दिन बचे मांस की धार्मिक स्थिति
  choice: वह स्वीकारयोग्य नहीं है; वह अपवित्र वस्तु है
  alternative: वह बुरी चुनी हुई वस्तु है
  rationale: वाक्य को नैतिक बुराई के बजाय बलिदानी-अनुष्ठानिक अयोग्यता के रूप में प्रस्तुत किया गया है, पर स्रोत के दोहरे कारण-विधान को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण धार्मिक गद्य। बलिदानी शब्दावली में ‘अर्घ’ और ‘अन्नबलि’ से स्रोत में उल्लिखित दोनों अलग अर्पण स्पष्ट किए गए हैं। लंबे गीइज़ वाक्य को पठनीय हिन्दी वाक्यों में बाँटा गया है, पर क्रम, निषेध और कारणात्मक संबंध सुरक्षित रखे गए हैं।
