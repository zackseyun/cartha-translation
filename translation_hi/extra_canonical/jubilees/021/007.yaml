translation:
  language: hi
  text: जंगली पशुओं, पालतू पशुओं और आकाश में उड़ने वाले हर पक्षी का लहू। और यदि तुम स्वीकार्य मेल-बलि चढ़ाने के लिए किसी पशु का वध करो,[a] तो उसका वध करना और उसका लहू वेदी पर उंडेलना।[b] अपनी भेंट की सारी चरबी[c] वेदी पर चढ़ाना; और तेल में मिला हुआ मैदा तथा उसके साथ की पेय-भेंट भी—यह सब एक साथ वेदी पर सुखद सुगंध की भेंट के रूप में उसके सामने चढ़ाना—[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वीकार्य’ का अर्थ ‘ग्रहणयोग्य’ या ‘जिसे स्वीकार किया जाए’ भी हो सकता है।
    reason: मूल पद की ग्राह्यता-संबंधी अर्थ-छाया स्पष्ट करना।
  - marker: b
    text: 'मूल में सक्रिय आदेश है: ‘और उसका लहू उंडेलना’; इसका अर्थ ‘ताकि उसका लहू उंडेला जाए’ नहीं है।'
    reason: स्रोत की क्रियावाच्यता और संबोधित कर्ता को स्पष्ट करना।
  - marker: c
    text: शाब्दिक रूप से, ‘तुम्हारी भेंट की सारी चरबी’।
    reason: मूल के द्वितीय पुरुष एकवचन संबंधसूचक रूप को दर्ज करना।
  - marker: d
    text: उपलब्ध स्रोत में यह पद ‘सामने’ पर समाप्त होता है और वाक्य अगले पद में जारी रहता है।
    reason: अध्याय-विभाजन के कारण अधूरे वाक्य और अनूदित अंश की सीमा को पारदर्शी बनाना।
lexical_decisions:
- source_word: አርዌ / እንስሳ
  choice: जंगली पशु / पालतू पशु
  rationale: दो अलग पशु-वर्गों को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखा गया है; दूसरा पद सामान्य ‘पशु’ भी हो सकता है, पर पहले के साथ विरोध में यहाँ पालतू पशु अभिप्रेत है।
- source_word: ሰላም
  choice: मेल-बलि
  rationale: बलिदानी संदर्भ में यह शांति अथवा सहभागिता की बलि का पारिभाषिक पद है; ‘मेल-बलि’ संक्षिप्त और सामान्य पाठक के लिए बोधगम्य है।
- source_word: ዘይሰጠው
  choice: ग्रहणयोग्य
  rationale: पद का अर्थ स्वीकार किया जाने वाला या स्वीकार्य है; इसे ‘धन्यवाद’ नहीं बनाया गया, क्योंकि स्रोत में उसका आधार नहीं है।
- source_word: ጽንሑክ
  choice: अपनी भेंट
  rationale: द्वितीय पुरुष एकवचन के संबंधसूचक प्रत्यय को ‘अपनी’ से सुरक्षित रखा गया है।
- source_word: ስንዳሌ ልውሰ በቅብዕ
  choice: तेल में मिला हुआ मैदा
  rationale: अनाज की महीन भेंट और उसके तेल में मिलाए जाने को सहज हिन्दी में व्यक्त करता है।
- source_word: ሞጻሕቱ
  choice: उसके साथ की पेय-भेंट
  rationale: बलिदान के साथ चढ़ाई जाने वाली तरल भेंट के लिए स्पष्ट, गैर-सांप्रदायिक शब्दावली।
- source_word: መዐዛ ሠናይ
  choice: सुखद सुगंध
  rationale: स्रोत के ‘अच्छी/मनभावनी गंध’ को गरिमापूर्ण और परिचित बलिदानी भाषा में व्यक्त करता है।
theological_decisions:
- issue: ዘይሰጠው का बलिदानी अर्थ
  choice: ग्रहणयोग्य मेल-बलि
  alternative: धन्यवाद की मेल-बलि
  rationale: गीज़ पद स्वीकृति या ग्राह्यता बताता है, धन्यवाद नहीं; इसलिए ऐसी धार्मिक श्रेणी नहीं जोड़ी गई जिसका स्रोत में संकेत नहीं है।
- issue: लहू उंडेलने वाली क्रिया का कर्ता और वाच्य
  choice: तुम ... उसका लहू ... उंडेलना
  alternative: ताकि उसका लहू उंडेला जाए
  rationale: स्रोत में संबोधित व्यक्ति के लिए सक्रिय निर्देश है; निष्क्रिय परिणामवाचक रूप उस व्याकरणिक बल को कम कर देता।
- issue: अंतिम ‘उसके’ का संदर्भ
  choice: उसके सामने
  alternative: परमेश्वर के सामने
  rationale: प्रदत्त स्रोत अंश केवल ‘सामने’ पर समाप्त होता है; संभावित अगले पद से ‘परमेश्वर’ जोड़कर अधूरे स्रोत को चुपचाप पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल बलिदानी शब्दावली अपनाई गई है। पद पिछले वाक्य के बीच से आरम्भ होता और अगले पद में जारी रहता है; आरम्भिक खंड तथा अंतिम डैश से उस संरचना को बिना अनुमान से पूरा किए सुरक्षित रखा गया है। आदेशों के लिए ‘करना/चढ़ाना’ शैली संबोधन की निरंतरता बनाए रखती है।
