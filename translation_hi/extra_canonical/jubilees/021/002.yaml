  yaml_path: translation/extra_canonical/jubilees/021/002.yaml
  text: And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, seeking with all my heart to do his will.
translation:
  language: hi
  text: और देखो, मैं एक सौ पचहत्तर वर्ष का हूँ, और अपने जीवन के सभी दिनों में मैं प्रभु को स्मरण करता रहा हूँ और पूरे मन से उसकी इच्छा पूरी करने का प्रयत्न करता रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ
  choice: और देख
  rationale: सूचनात्मक बल और प्रत्यक्ष संबोधन को संक्षिप्त, बाइबिलीय किंतु सुबोध हिंदी में बनाए रखता है।
- source_word: ወልደ፡ ምእት፡ ወሰብዓ፡ ወኃምስቱ፡ ዓመት
  choice: मैं एक सौ पचहत्तर वर्ष का हूँ
  rationale: आयु-सूचक गीइज़ वाक्यांश का आधुनिक हिंदी में स्वाभाविक रूप।
- source_word: እዜከር፡ ለእግዚአብሔር
  choice: प्रभु को स्मरण करता रहा हूँ
  rationale: क्रिया के मूल अर्थ ‘स्मरण करना’ को बनाए रखता है; इसे केवल ‘ध्यान रखना’ जैसे अधिक व्याख्यात्मक अर्थ में नहीं बदलता।
- source_word: አኀሥሥ
  choice: प्रयत्न करता रहा हूँ
  rationale: मूल में खोजने/लगन से चाहने का भाव है; उद्देश्यसूचक अगले पद के साथ हिंदी में यह रूप निरंतर, सक्रिय अभिलाषा व्यक्त करता है।
- source_word: በኵሉ፡ ልብየ
  choice: पूरे मन से
  rationale: शाब्दिक ‘अपने सारे हृदय से’ के अर्थ को सामान्य आधुनिक हिंदी के मुहावरे में व्यक्त करता है।
- source_word: እግበር፡ ፈቃደቲሁ
  choice: उसकी इच्छा पूरी करने
  rationale: ‘उसकी इच्छा करना’ का स्वाभाविक हिंदी समतुल्य; आज्ञाकारिता का आशय सुरक्षित रहता है।
theological_decisions:
- issue: प्रभु-स्मरण और उसकी इच्छा पूरी करने के बीच संबंध
  choice: दोनों को जुड़े हुए किंतु अलग क्रियात्मक भावों के रूप में रखा गया
  alternative: दूसरे भाव को पहले की व्याख्या बनाना—‘प्रभु को इस प्रकार स्मरण किया कि...’
  rationale: मूल पाठ स्मरण करने और पूरे हृदय से इच्छा पूरी करने का प्रयत्न करने, दोनों को साथ रखता है; इनके संबंध को अधिक निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘और देख’ से मूल उद्घोष का बल रखा गया है। कोई पादटिप्पणी आवश्यक नहीं।
