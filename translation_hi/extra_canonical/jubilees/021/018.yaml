  text: Take care, my son, concerning blood; take great care to cover it in the earth. And do not eat it at all.
translation:
  language: hi
  text: हे मेरे पुत्र, लहू के विषय में सावधान रहना; उसे भूमि में ढकने का बहुत ध्यान रखना। और उसे बिलकुल मत खाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐቀብ
  choice: सावधान रहना / ध्यान रखना
  rationale: दोनों आवृत्तियों में सावधानी बरतने की आज्ञा है; हिंदी में प्रसंगानुसार स्वाभाविक भिन्न अभिव्यक्तियाँ रखी गई हैं।
- source_word: ደም
  choice: लहू
  rationale: बलिदान और आहार-विधि के प्रसंग के अनुकूल, dignified तथा सामान्य बाइबिलीय हिंदी शब्द।
- source_word: ጥቀ
  choice: बहुत
  rationale: यह क्रियाविशेषण दूसरी आज्ञा की तीव्रता व्यक्त करता है; इसे छोड़ा नहीं गया।
- source_word: ደፍኖ፡ ውስተ፡ ምድር
  choice: उसे भूमि में ढकने
  rationale: मूल में 'भूमि में' है; 'धूल से' जोड़ना स्रोत से समर्थित नहीं है।
- source_word: እንከ
  choice: बिलकुल
  rationale: निषेध की बलवत्ता को व्यक्त करता है—'तनिक भी/कदापि नहीं'।
theological_decisions:
- issue: लहू खाने के निषेध की तीव्रता
  choice: उसे बिलकुल मत खाना
  alternative: उसे मत खाना
  rationale: मूल के अंतिम बलवर्धक अव्यय को बनाए रखा गया है, बिना निषेध का कोई अतिरिक्त धार्मिक विस्तार किए।
translation_notes:
  register: आधुनिक मानक हिंदी; पितृसुलभ संबोधन और विधिसंबंधी गंभीरता बनाए रखते हुए वाक्य को साधारण पाठक के लिए स्वाभाविक रखा गया है।
