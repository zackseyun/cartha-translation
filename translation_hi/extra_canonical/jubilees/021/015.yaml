  yaml_path: translation/extra_canonical/jubilees/021/015.yaml
  text: Keep this command and do it[15], my son, so that you may walk rightly in all your deeds. And at all times be pure in your body, and wash yourself with water before you go up to offer on the altar; and wash your hands and your feet before you approach the altar; and when you have finished offering, return.
translation:
  language: hi
  text: इस आज्ञा को मान और इसका पालन कर[15], मेरे पुत्र, ताकि तू अपने सभी कामों में सही रीति से चले। हर समय अपने शरीर में शुद्ध रह; और वेदी पर भेंट चढ़ाने के लिए ऊपर जाने से पहले पानी से स्नान कर। वेदी के पास जाने से पहले अपने हाथ-पाँव धो; और जब तू भेंट चढ़ा ले, तो लौट आ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: स्रोत-पाठ की पंक्तियों में अध्याय के पद-क्रमांक 15 से 17 पर चला जाता है। दी गई गीʽज़ खंड-विभाजन में पद 16 की कोई अलग पंक्ति नहीं है, इसलिए उसका अलग हिन्दी पद नहीं दिया गया है।
    reason: segmentation_note
lexical_decisions:
- source_word: ዑቅ፡ ዛተእዛዘ፡ ወገብራ
  choice: इस आज्ञा को मान और इसका पालन कर
  rationale: आज्ञा को सुरक्षित रखने/मानने और उसे करने—दोनों क्रियाओं को स्वाभाविक हिन्दी में अलग-अलग बनाए रखा गया है।
- source_word: ታርትዕ፡ በኵሉ፡ ግብርከ
  choice: तू अपने सब कामों में सीधी चाल चले
  rationale: मूल में निहित ठीक या सीधा आचरण व्यक्त करता है और केवल सफलता का अर्थ नहीं देता।
- source_word: ኩን፡ ንጹሐ፡ በሥጋከ
  choice: अपने शरीर में शुद्ध रह
  rationale: देह-संबंधी अनुष्ठानिक शुद्धता का निर्देश सुरक्षित रखा गया है।
- source_word: ትሐፀብ፡ በማይ
  choice: पानी से स्नान कर
  rationale: यहाँ पूरे शरीर की धुलाई का संकेत है; आगे हाथ-पाँव धोने का निर्देश अलग से आता है।
- source_word: ለአዕርጎ፡ ውስተ፡ ምሥዋዕ
  choice: वेदी पर भेंट चढ़ाने के लिए ऊपर जाने
  rationale: चढ़ाने और ऊपर जाने की गति—दोनों को हिन्दी में स्पष्ट रखा गया है।
- source_word: ግባእ
  choice: लौट आ
  rationale: क्रिया का अर्थ वापस लौटना है, न कि भीतर जाना।
theological_decisions:
- issue: शुद्धता का स्वरूप
  choice: देह की शुद्धता और जल से स्नान को प्रत्यक्ष अनुष्ठानिक निर्देश के रूप में रखा
  alternative: इसे नैतिक या आत्मिक पवित्रता के रूप में विस्तार देना
  rationale: मूल पाठ शरीर, पानी, हाथ और पाँव का ठोस उल्लेख करता है; अतः किसी अतिरिक्त आध्यात्मिक अर्थ को आरोपित नहीं किया गया।
- issue: वेदी की क्रिया
  choice: भेंट चढ़ाना
  alternative: बलिदान करना
  rationale: मूल अभिव्यक्ति चढ़ाई जाने वाली वस्तु का प्रकार निश्चित नहीं करती; इसलिए व्यापक और स्वाभाविक पद चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और प्रत्यक्ष संबोधन रखा गया है। पिता द्वारा पुत्र को दिए गए एकवचन निर्देशों के लिए ‘तू’ का प्रयोग निकट संबंध और मूल की आज्ञार्थक शैली को व्यक्त करता है।
