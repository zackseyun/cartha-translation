review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the paired imperatives to keep and do the command, bodily purity, washing with water before ascending to offer at the altar, washing hands and feet before approaching it, and the final command to return. “लौट आ” correctly reflects the final Geʽez imperative as return rather than enter. A minor adjustment makes the ‘walk rightly in all your deeds’ expression idiomatic without changing its ethical sense.
  naturalness: “सीधी चाल चले” can suggest literal walking in contemporary Hindi and is less natural with “अपने सब कामों में.” “अपने सभी कामों में सही रीति से चले” retains the metaphorical-ethical force in clear modern Hindi. “भेंट चढ़ा चुके” is also best recast as a completed action directly governed by the imperative sequence.
  terminology: “वेदी,” “भेंट चढ़ाना,” “शुद्ध,” and “हाथ-पाँव धो” are suitable, neutral, and appropriately formal. “भेंट” preserves the source’s lack of a more specific sacrificial designation.
  issues:
  - severity: low
    issue: ‘सीधी चाल चले’ is potentially literal and stylistically awkward in this context.
    rationale: The source concerns upright/right conduct in all deeds, not physical gait. ‘सही रीति से चले’ communicates this naturally while preserving the metaphor.
  - severity: low
    issue: The segmentation footnote anchor from the English audit trail is absent.
    rationale: Retaining the anchor and its note documents the source-row numbering irregularity without affecting the translated meaning.
