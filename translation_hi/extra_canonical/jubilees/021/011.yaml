  text: And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of them.
translation:
  language: hi
  text: और अपने सभी अर्पणों पर नमक डालना, और उनमें से किसी में भी वाचा के नमक की कमी न होने देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: अपने हर बलिदान
  rationale: यह शब्द संबोधित व्यक्ति के बलिदान/चढ़ावे को सूचित करता है। प्रसंग में अनुष्ठानिक अर्पण के लिए ‘बलिदान’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ትደይ፡ ፄወ
  choice: नमक डालना
  rationale: क्रिया और संज्ञा का सीधा आशय बलिदान पर नमक रखने या डालने का है; आधुनिक हिन्दी में ‘नमक डालना’ सहज है।
- source_word: ፄወ፡ ኪዳን
  choice: वाचा का नमक
  rationale: शाब्दिक संबंध ‘salt of covenant’ को बनाए रखा गया है; इसे व्याख्यात्मक रूप से किसी विशेष धार्मिक सिद्धांत में नहीं बदला गया।
- source_word: ወኢይደሪዕ
  choice: कमी न होने देना
  rationale: 'निषेधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है: वाचा का नमक किसी अर्पण से अनुपस्थित न रहे।'
theological_decisions:
- issue: ‘वाचा के नमक’ का अर्थ
  choice: वाचा का नमक
  alternative: वाचा का चिन्ह ठहरने वाला नमक
  rationale: मूल की संक्षिप्त और संभावित रूप से बहुअर्थी अभिव्यक्ति सुरक्षित रखी गई है; उसका प्रतीकात्मक अर्थ पाठ में जोड़कर निश्चित नहीं किया गया।
- issue: መሥዋዕት का अनुवाद
  choice: बलिदान
  alternative: भेंट
  rationale: शब्द बलिदान अथवा अर्पण दोनों अर्थ दे सकता है। इस अनुष्ठानिक संदर्भ में ‘बलिदान’ मूल के बलिदान-संबंधी बल को अधिक स्पष्टता से रखता है, जबकि व्यापकता ‘हर’ से बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, निर्देशात्मक और गरिमापूर्ण शैली। मूल के आज्ञार्थक स्वर तथा ‘वाचा के नमक’ की धार्मिक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
