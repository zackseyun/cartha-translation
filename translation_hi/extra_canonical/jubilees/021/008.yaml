  yaml_path: translation/extra_canonical/jubilees/021/008.yaml
  text: 'the Lord. And the fat of the sacrifice of deliverance you shall place on the fire that is on the altar: the fat that is on the entrails, and all the fat that is on the inward parts, and the two kidneys, and all'
translation:
  language: hi
  text: प्रभु। और उद्धार-बलि की चरबी को वेदी पर जो आग है, उस पर रखना—अंतड़ियों पर की चरबी, भीतरी अंगों पर की सारी चरबी, दोनों गुर्दे, और सारी[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वाक्य अगले पद में पूरा होता है।
    reason: यह पद गीज़ पाठ में ወኵሎ (‘सारी/सब’) पर समाप्त होता है; अगला पद बताता है कि यह किसकी सारी चरबी है।
lexical_decisions:
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: उद्धार-बलि
  rationale: መድኃኒት का मूल भाव उद्धार या छुटकारा है; यज्ञ-संबंधी पदबंध को संक्षिप्त और स्वाभाविक हिंदी में रखा गया है।
- source_word: ስብሐ
  choice: चरबी
  rationale: बलि के पशु की चढ़ाई जाने वाली वसा के लिए सामान्य और सटीक हिंदी शब्द।
- source_word: ከርሥ
  choice: अंतड़ियाँ
  rationale: यहाँ बलि-विधान के शारीरिक संदर्भ में उदर के अंदर के अंग, विशेषतः अंतड़ियाँ, अभिप्रेत हैं।
- source_word: ንዋየ፡ ውስት
  choice: भीतरी अंग
  rationale: शाब्दिक रूप से भीतर की वस्तुओं के अर्थ को प्राकृतिक हिंदी शारीरिक पदावली में व्यक्त करता है।
- source_word: ወክሊአ፡ ኵልያት
  choice: दोनों गुर्दे
  rationale: द्विवचनात्मक संख्या और गुर्दों के स्पष्ट उल्लेख को सुरक्षित रखता है।
- source_word: ወኵሎ
  choice: और सारी
  rationale: ኵሎ का अर्थ ‘सारा/सब’ है; पाठ यहाँ अगले पद में जारी होने वाले वाक्यांश के बीच कटता है, इसलिए इसे ‘दोनों’ बनाकर कृत्रिम रूप से पूरा नहीं किया गया।
theological_decisions:
- issue: መሥዋዕተ፡ መድኃኒት का बलि-नाम
  choice: उद्धार-बलि
  alternative: शांति-बलि
  rationale: गीज़ पाठ में መድኃኒት उद्धार/छुटकारे की धारणा व्यक्त करता है। ‘शांति-बलि’ किसी संभावित इब्रानी पृष्ठभूमि की व्याख्या को सीधे पाठ में आयात कर सकती है।
- issue: खंडित अंतिम वाक्यांश
  choice: ‘और सारी’ पर पाठ को खुला रखा गया
  alternative: ‘वे दोनों’ कहकर वाक्य पूरा करना
  rationale: स्रोत का ወኵሎ ‘सारा/सब’ है और पद-विभाजन वाक्य के बीच आता है। अर्थ को सुगम बनाने के लिए स्रोत की अपूर्णता मिटाना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। आरंभ का ‘प्रभु।’ पिछले पद से जुड़ा हुआ खंड है और अंतिम पदांश भी अगले पद में जारी रहता है; दोनों सीमाओं को स्रोत के अनुसार सुरक्षित रखा गया है।
