translation:
  language: hi
  text: उसकी वाचा। और तू भी, मेरे पुत्र, उसकी आज्ञा, उसकी विधि और उसके न्याय का पालन कर, और उनके पीछे मत चल।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का आरम्भ संभवतः पिछले पद के अंतिम शब्द “उसकी वाचा” से होता है, और अंतिम वाक्य भी आगे के पाठ से कटा हुआ जान पड़ता है; इसलिए “उनके” का संदर्भ यहाँ स्पष्ट नहीं है।
    reason: verse_segmentation_and_referent_ambiguity
lexical_decisions:
- source_word: ኪዳኖ
  choice: उसकी वाचा
  rationale: यह पद के आरम्भ में उपस्थित एकवचन, तृतीय पुरुष संबंधसूचक रूप है; संभवतः पिछले पद का अंतिम अंश है, फिर भी उपलब्ध स्रोत-खंड में होने के कारण इसका अनुवाद रखा गया है।
- source_word: ትእዛዞ
  choice: उसकी आज्ञा
  rationale: स्रोत रूप एकवचन और संबंधसूचक है; इसलिए बहुवचन नहीं किया गया।
- source_word: ሥርዐቶ
  choice: उसकी विधि
  rationale: एकवचन संबंधसूचक संज्ञा को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है और ‘आज्ञा’ से उसका भेद बनाए रखता है।
- source_word: ኵነኔሁ
  choice: उसके न्याय-विधान
  rationale: एकवचन संबंधसूचक रूप है; ‘न्याय-विधान’ न्याय अथवा निर्णय के विधिक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ዕቀብ
  choice: पालन करना
  rationale: मूल ‘रखना/सुरक्षित रखना’ का आज्ञापालन-संबंधी अर्थ आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ወኢትሖር፡ ድኅሬሆሙ
  choice: और उनके पीछे मत चलना
  rationale: मूल की निषेधात्मक आज्ञा और बहुवचन सर्वनाम को यथासंभव सीधे रखा गया है; इस खंड में सर्वनाम का स्पष्ट पूर्वपद नहीं है।
theological_decisions:
- issue: ‘उनके’ का संदर्भ
  choice: अस्पष्ट बहुवचन सर्वनाम ‘उनके’ को बनाए रखा गया
  alternative: इसे ‘मूर्तियों के पीछे’ या आज्ञा-विधि-न्याय के संदर्भ में स्पष्ट करना
  rationale: दिए गए गीइज़ खंड में सर्वनाम बहुवचन है, पर उसका पूर्वपद इस पद-खंड में नहीं मिलता। संभावित कटे हुए अगले पाठ या व्यापक संदर्भ के आधार पर अर्थ को चुपचाप निश्चित करना उचित नहीं।
- issue: विधिक पदों की संख्या
  choice: आज्ञा, विधि और न्याय-विधान—तीनों एकवचन
  alternative: आज्ञाएँ, विधियाँ और निर्णय
  rationale: प्रत्येक गीइज़ रूप रूपात्मक रूप से एकवचन है; धार्मिक शैली के प्रचलित बहुवचन के कारण स्रोत-साक्ष्य को बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। पिता के पुत्र से सीधे संबोधन को ‘हे मेरे पुत्र, तू’ द्वारा रखा गया है। स्रोत की एकवचन विधिक शब्दावली और अंतिम बहुवचन सर्वनाम की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
