  text: blood at all, because it is the life; and do not eat any blood. And do not accept a gift concerning any human blood, lest it be shed with impunity, without judgment; for it is the blood that is shed which pollutes the earth, and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it.
translation:
  language: hi
  text: किसी भी प्रकार का खून मत खाना, क्योंकि खून ही जीवन है। किसी मनुष्य का खून बहाए जाने के मामले में कोई भेंट स्वीकार न करना, ऐसा न हो कि वह खून दण्ड से बचे रहकर और बिना न्याय के बहाया जाए।[a] क्योंकि बहाया गया खून पृथ्वी को अशुद्ध करता है, और पृथ्वी मनुष्य के खून से तब तक शुद्ध नहीं हो सकती, जब तक उस व्यक्ति का खून न बहाया जाए जिसने वह खून बहाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसा न हो कि वह खून व्यर्थ, बिना न्याय के बहाया जाए।”
    reason: गीज़ በከ में ‘व्यर्थ/निरर्थक रूप से’ और प्रसंगतः ‘दण्ड से बचे रहकर’ की अर्थ-छाया संभव है। पुराने अनुवाद का ‘तुमसे वसूल किया जाए’ अर्थ यहाँ प्रयुक्त क्रिया के अनुकूल नहीं है।
lexical_decisions:
- source_word: ደመ / ደም
  choice: खून
  rationale: यहाँ शब्द जीवन, हत्या और भूमि की अशुद्धि के ठोस संदर्भ में है; सामान्य पाठक के लिए ‘खून’ स्वाभाविक और स्पष्ट है।
- source_word: ነፍስ
  choice: जीवन
  rationale: यद्यपि मूल शब्द का अर्थ ‘प्राण/जीव’ भी हो सकता है, खून संबंधी निषेध में आशय जीवन से है।
- source_word: ሕልያነ
  choice: भेंट
  rationale: प्रसंग में यह किसी मनुष्य के खून के मामले को प्रभावित करने के लिए स्वीकार की जाने वाली भेंट है; मूल की अपेक्षाकृत सामान्य संज्ञा को रखते हुए ‘रिश्वत’ की व्याख्या सीधे मुख्य पाठ में नहीं जोड़ी गई।
- source_word: በከ
  choice: दण्ड दिए बिना
  rationale: यहाँ भाव ‘व्यर्थ/निरर्थक रूप से’ अथवा ‘दण्ड से बचे रहकर’ है; न्याय के अभाव वाले अगले पद के साथ ‘दण्ड दिए बिना’ प्रसंगानुकूल है।
- source_word: ኵነኔ
  choice: न्याय
  rationale: शब्द न्यायिक निर्णय अथवा दण्डादेश को सूचित करता है; ‘न्याय’ हिन्दी में दोनों आयामों के लिए पर्याप्त व्यापक है।
- source_word: ያንጥኦ
  choice: अशुद्ध करता है
  rationale: भूमि पर बहाया गया मानव-खून उसे दूषित/अपवित्र करता है; ‘अशुद्ध’ आगे आने वाले ‘शुद्ध’ के साथ मूल का विरोध स्पष्ट रखता है।
theological_decisions:
- issue: खून और जीवन का संबंध
  choice: ‘खून ही जीवन है’
  alternative: ‘खून में प्राण है’
  rationale: मूल में सीधा विधेय-संबंध है; चुना हुआ रूप उसकी संक्षिप्तता और बल बनाए रखता है, बिना अतिरिक्त व्याख्या जोड़े।
- issue: बहाए गए मानव-खून से पृथ्वी की शुद्धि
  choice: ‘जब तक उसे बहाने वाले का खून न बहाया जाए’
  alternative: ‘सिवाय उस व्यक्ति के खून से जिसने उसे बहाया’
  rationale: मुख्य पाठ मूल के प्रतिशोधात्मक न्याय-विधान को स्पष्ट रखता है, पर उससे आगे कोई सांप्रदायिक या प्रायश्चित्त-संबंधी अर्थ नहीं जोड़ता।
- issue: በከ का अर्थ
  choice: ‘दण्ड दिए बिना’
  alternative: ‘व्यर्थ’
  rationale: स्रोत-समीक्षा के अनुसार इसे ‘तुमसे वसूल किया जाए’ समझना उचित नहीं; फिर भी ‘व्यर्थ’ और ‘दण्ड से बचे रहकर’ की अर्थ-छाया को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी आज्ञात्मक शैली रखी गई है। पद आरम्भ में पूर्ववर्ती वाक्य का खंड हो सकता है, पर उपलब्ध इकाई को हिन्दी में पूर्ण और पठनीय वाक्य बनाया गया है। ‘भेंट’ मूल की शब्दावली को बचाती है, जबकि संदर्भ से उसका अनुचित न्यायिक प्रभाव स्पष्ट होता है।
