base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/004.yaml
  text: the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandments and those who despise his covenant.
translation:
  language: hi
  text: जिसने मुझे बनाया है, उसकी इच्छा। क्योंकि वही जीवित परमेश्वर है; वही पवित्र, विश्वासयोग्य और सबसे बढ़कर धर्मी है। वह न किसी के साथ पक्षपात करता है, न रिश्वत लेता है।[a] क्योंकि वह धर्मी परमेश्वर है और उन सभी का न्याय करता है जो उसकी आज्ञाओं का उल्लंघन करते हैं और जो उसकी वाचा को तुच्छ जानते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुख ग्रहण करना और उपहार ग्रहण करना”; अर्थात पक्षपात करना और रिश्वत लेना।
    reason: गीज़ के दो समानांतर, पर अलग, न्यायिक वाक्यांशों की शब्दगत छवि बताने के लिए।
  - marker: b
    text: कुछ व्याख्याओं में अंतिम पदों को “जो उसकी आज्ञाओं और उसकी वाचा का उल्लंघन करते हैं” समझा जा सकता है; यहाँ पाठ में दिखाई देने वाली दूसरी क्रिया का अर्थ “तुच्छ जानना” रखा गया है।
    reason: वाक्यरचना की संभावित अस्पष्टता बताते हुए स्रोत में उपस्थित दूसरे क्रियापद को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ነሢአ፡ ገጽ
  choice: पक्षपात
  rationale: शाब्दिक रूप से ‘मुख ग्रहण करना’; न्याय के प्रसंग में इसका स्वाभाविक हिन्दी अर्थ पक्षपात करना है।
- source_word: ነሢአ፡ ሕልያን
  choice: घूस लेना
  rationale: यह पद पहले वाक्यांश से अलग होकर उपहार/रिश्वत स्वीकार करने को बताता है; न्यायिक संदर्भ में ‘घूस’ आशय को स्पष्ट और स्वाभाविक रखता है।
- source_word: ምእመን
  choice: विश्वासयोग्य
  rationale: ईश्वर की विश्वसनीयता और निष्ठा व्यक्त करने वाला सहज आधुनिक हिन्दी पद।
- source_word: ገባሬ፡ ኵነኔ
  choice: न्याय करता है
  rationale: अर्थतः न्याय-दण्ड को कार्यान्वित करने वाला; हिन्दी में ‘न्याय करता है’ dignified और सुबोध है।
- source_word: ይሜንኑ
  choice: तुच्छ जानते हैं
  rationale: दूसरे समूह की अलग क्रिया ‘तिरस्कार/अवहेलना करना’ को बनाए रखता है और इसे ‘उल्लंघन’ में नहीं मिलाता।
theological_decisions:
- issue: ईश्वर की धार्मिकता की तुलनात्मक अभिव्यक्ति
  choice: सबसे बढ़कर धर्मी
  alternative: सबसे अधिक धर्मी / सबके ऊपर धर्मी
  rationale: እምኵሉ की तुलनात्मक या सर्वोच्चता-सूचक शक्ति को बिना किसी अतिरिक्त सिद्धान्तगत व्याख्या के सुरक्षित रखा गया है।
- issue: अंतिम खंड में दो समूह और दो क्रियाएँ
  choice: जो उसकी आज्ञाओं का उल्लंघन करते हैं और जो उसकी वाचा को तुच्छ जानते हैं
  alternative: जो उसकी आज्ञाओं और उसकी वाचा का उल्लंघन करते हैं
  rationale: गीज़ पाठ दो अलग क्रियात्मक समूह प्रस्तुत करता है; दूसरे समूह की ‘तुच्छ जानना’ क्रिया को विलीन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट धार्मिक गद्य। ‘परमेश्वर’, ‘धर्मी’, ‘वाचा’ और ‘आज्ञा’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; साथ ही वाक्य सामान्य पाठक के लिए सहज बनाया गया है। आरम्भ स्रोत के खंडित वाक्यांश के अनुरूप रखा गया है, क्योंकि यह पिछले पद से जुड़ता है।
