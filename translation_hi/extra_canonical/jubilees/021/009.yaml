base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/009.yaml
  text: The fat that is on them, and that which is on the entrails, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering.
translation:
  language: hi
  text: उन पर की चर्बी, अंतड़ियों पर की चर्बी, और गुर्दों के साथ कलेजा भी तू निकाल लेना[a]। यह सब उसकी भेंट[b] के साथ प्रभु के सामने सुहावनी और स्वीकारयोग्य सुगंध के रूप में चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खा लेना।” बलिदान-विधि के प्रसंग और अगले वाक्य में इन्हीं भागों को चढ़ाने के आदेश के कारण यहाँ “निकाल लेना” समझा गया है।
    reason: मूल गीज़ क्रिया के प्रत्यक्ष अर्थ और प्रसंगानुकूल अनुवाद के बीच की वास्तविक कठिनाई को बिना असमर्थित वैकल्पिक शाब्दिक अर्थ जोड़े सुरक्षित रखना।
  - marker: b
    text: या, “उसकी बलि”; मूल में विशेष रूप से “अन्नबलि” नहीं कहा गया है।
    reason: मूल शब्द की व्यापक अर्थ-सीमा स्पष्ट करना और अनावश्यक विशिष्टीकरण से बचना।
lexical_decisions:
- source_word: መናቅፅ
  choice: अंतड़ियाँ
  rationale: यह शब्द आंतरिक अंगों या अंतड़ियों को सूचित करता है और बलिदान-संबंधी प्रसंग में यही स्वाभाविक अर्थ है; ‘कटि’ की अपेक्षा यह मूल के अधिक निकट है।
- source_word: ትብልእ
  choice: निकाल लेना
  rationale: शब्द का सामान्य शाब्दिक अर्थ ‘खा लेना/भस्म कर देना’ है, पर अगले वाक्य में इन्हीं भागों को चढ़ाने का आदेश होने के कारण यहाँ बलिदान की तैयारी के प्रसंगानुकूल अर्थ लिया गया है; मूल की कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: መሥዋዕቱ
  choice: उसकी भेंट
  rationale: गीज़ शब्द सामान्यतः बलि या भेंट को दर्शाता है; इसमें विशेष रूप से ‘अन्नबलि’ का अर्थ निहित नहीं है, इसलिए अधिक व्यापक शब्द चुना गया है।
- source_word: ለመዐዛ፡ ሠናይ
  choice: सुहावनी और स्वीकारयोग्य सुगंध के रूप में
  rationale: यह बलिदान से उठने वाली अच्छी/मनभावन सुगंध का मुहावरा है; ‘स्वीकारयोग्य’ अगले संबंधवाचक पद और प्रभु के सामने स्वीकृति के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बलिदान के साथ दी जाने वाली वस्तु की प्रकृति
  choice: भेंट
  alternative: अन्नबलि
  rationale: मूल गीज़ में सामान्य बलि/भेंट का शब्द है, अन्नबलि का विशिष्ट पद नहीं; इसलिए संप्रदायगत या प्रसंग से आयातित विशिष्टता से बचा गया है।
- issue: कठिन क्रिया ትብልእ का अर्थ
  choice: मुख्य पाठ में ‘निकाल लेना’, पादटिप्पणी में शाब्दिक अर्थ
  alternative: खा लेना
  rationale: ‘खा लेना’ और तुरंत बाद ‘यह सब चढ़ाना’ के बीच स्पष्ट तनाव है। मुख्य पाठ बलिदान-विधि के संगत अर्थ को देता है, जबकि पादटिप्पणी मूल पाठ की वास्तविक कठिनाई को छिपने नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज बलिदान-विधि की भाषा रखी गई है। एकवचन आदेश के लिए ‘तू’ मूल के सीधे पितृसत्तात्मक संबोधन को बनाए रखता है। ‘कलेजा’ सामान्य पाठक के लिए ‘यकृत’ से अधिक सहज है, जबकि अर्थ स्पष्ट बना रहता है।
