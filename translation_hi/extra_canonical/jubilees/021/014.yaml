translation:
  language: hi
  text: उसकी सुगंध, क्योंकि अब उस पर पहले जैसी सुगंध नहीं रही। इन लकड़ियों के अतिरिक्त कोई और लकड़ी न रखना, क्योंकि उसकी सुगंध विशिष्ट है, और उसकी सुगंध की महक स्वर्ग में ऊपर उठती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዐዛሁ
  choice: उसकी सुगंध
  rationale: प्रत्यययुक्त संज्ञा में व्यक्त संबंधवाचक अर्थ को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप दिया गया है।
- source_word: ዕፀው
  choice: लकड़ियाँ
  rationale: इस बलिदान-संबंधी प्रसंग में बहुवचन का आशय वे निर्दिष्ट प्रकार की लकड़ियाँ हैं जिन्हें वेदी पर रखा जाना है।
- source_word: ፍሉጥ
  choice: विशिष्ट
  rationale: शब्द का अर्थ ‘पहचाना हुआ/अलग पहचाने जाने योग्य’ हो सकता है; ‘विशिष्ट’ इस अर्थगत दायरे को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ፄና፡ መዐዛሁ
  choice: उसकी सुगंध की महक
  rationale: मूल के ‘सुगंध की गंध/महक’ जैसे दोहरे पद को पूरी तरह लुप्त न करते हुए हिन्दी में पठनीय रखा गया है।
- source_word: ውስተ፡ ሰማይ
  choice: स्वर्ग तक
  rationale: ऊपर उठने की क्रिया के साथ गंतव्य का स्वाभाविक हिन्दी प्रयोग; ‘आकाश में’ भी संभव है, पर धार्मिक बलिदान-संदर्भ में ‘स्वर्ग’ उपयुक्त है।
theological_decisions:
- issue: सुगंध के स्वर्ग तक ऊपर उठने का वर्णन
  choice: प्रत्यक्ष कथन के रूप में बनाए रखा
  alternative: इसे परमेश्वर द्वारा बलिदान स्वीकार किए जाने की व्याख्या के रूप में प्रस्तुत करना
  rationale: मूल केवल सुगंध के ऊपर उठने की बात कहता है; उसके धार्मिक निहितार्थ को अनूदित पाठ में स्पष्ट करके जोड़ना उचित नहीं।
- issue: ፍሉጥ का अर्थ
  choice: विशिष्ट
  alternative: जानी-पहचानी
  rationale: दोनों अर्थ संभव हैं; ‘विशिष्ट’ सुगंध के अन्य सुगंधों से अलग पहचाने जाने का भाव देता है और अंग्रेज़ी परामर्श-पाठ के निर्णय से भी मेल खाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, निर्देशात्मक शैली रखी गई है। पद पिछले वाक्य से जुड़े खंड से आरम्भ होता प्रतीत होता है, इसलिए आरम्भिक खंड की अपूर्ण-संबद्ध संरचना को मनमाने ढंग से पूर्ण वाक्य बनाकर नहीं बदला गया।
