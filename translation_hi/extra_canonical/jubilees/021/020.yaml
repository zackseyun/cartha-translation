    जो पृथ्वी की सभी पीढ़ियों में सारी पृथ्वी पर फैलेगा। मेरा और तुम्हारा नाम आकाश के नीचे सदा भुलाया न जाएगा। मेरे पुत्र, शान्ति से जाओ। परमप्रधान परमेश्वर—मेरा परमेश्वर और तुम्हारा परमेश्वर—अपनी इच्छा पूरी करने के लिए तुम्हें दृढ़ करे; और तुम्हारे सारे वंश तथा तुम्हारे वंश के बचे हुओं को अनन्त पीढ़ियों तक हर धर्ममय आशीष से आशीष दे, ताकि तुम सारी पृथ्वी के लिए आशीष बनो।” तब वह आनन्दित होकर उसके सामने से चला गया।'
