base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/020.yaml
  text: And do not accept a bribe or a present for human blood; blood for blood is to be rendered before the Lord, the Most High God. And it will be a good protection for you, so that you may be kept from every evil and so that he may save you from every death. For I see, my son, all the works of the children of men, that all their sin and evil and all their deeds are uncleanness and abomination and defilement, and there is no righteousness with them. Take care not to walk in their ways and not to tread in their paths, and do not sin a sin leading to death before the Most High God, lest he hide his face from you and give you into the hand of your enemies and root you out from the earth, and your seed from under heaven, and destroy your name and your seed from all the earth. Turn away from all their deeds and from all their uncleanness, and keep the charge of the Most High God, and do his will and be upright in everything. And he will bless you in all your deeds, and he will raise up from
    you a plant of righteousness in all the earth throughout all generations of the earth. And my name and your name will not be forgotten under heaven forever. Go, my son, in peace. May the Most High God, my God and your God, strengthen you to do his will; and may he bless all your seed and the remnant of your seed for everlasting generations with every righteous blessing, so that you may become a blessing on all the earth.” And he went out from before him rejoicing.
translation:
  language: hi
  text: 'मानव-रक्त के मामले में रिश्वत या भेंट स्वीकार न करना; रक्त के बदले रक्त प्रभु, परमप्रधान परमेश्वर के सामने चुकाया जाए। यह तुम्हारे लिए अच्छी सुरक्षा होगी, जिससे तुम हर बुराई से बचे रहो और वह तुम्हें हर मृत्यु से बचाए। क्योंकि, मेरे पुत्र, मैं मनुष्यों की संतान के सारे काम देखता हूँ: उनका सारा पाप और उनकी सारी बुराई, और उनके सभी काम अशुद्धता, घृणितता और मलिनता हैं; उनमें धार्मिकता नहीं है। सावधान रहना कि तुम उनके मार्गों पर न चलो और उनकी पगडंडियों पर कदम न रखो। परमप्रधान परमेश्वर के सामने ऐसा पाप न करना जो मृत्यु की ओर ले जाता है, कहीं ऐसा न हो कि वह अपना मुख तुमसे छिपा ले, तुम्हें तुम्हारे शत्रुओं[a] के हाथ में कर दे, तुम्हें पृथ्वी पर से और तुम्हारे वंश को आकाश के नीचे से जड़ समेत उखाड़ दे, और सारी पृथ्वी पर से तुम्हारा नाम और तुम्हारा वंश मिटा दे। उनके सभी कामों और उनकी सारी अशुद्धता से अलग हो जाओ; परमप्रधान परमेश्वर की आज्ञा का पालन करो, उसकी इच्छा पूरी करो और हर बात में खरे रहो। तब वह तुम्हारे सभी कामों में तुम्हें आशीष देगा और सारी पृथ्वी में, पृथ्वी की सभी पीढ़ियों के लिए,
    तुमसे धार्मिकता का एक पौधा उत्पन्न करेगा। मेरा और तुम्हारा नाम आकाश के नीचे सदा भुलाया न जाएगा। मेरे पुत्र, शान्ति से जाओ। परमप्रधान परमेश्वर—मेरा परमेश्वर और तुम्हारा परमेश्वर—अपनी इच्छा पूरी करने के लिए तुम्हें दृढ़ करे; और तुम्हारे सारे वंश तथा तुम्हारे वंश के बचे हुओं को अनन्त पीढ़ियों तक हर धर्ममय आशीष से आशीष दे, ताकि तुम सारी पृथ्वी के लिए आशीष बनो।” तब वह आनन्दित होकर उसके सामने से चला गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे शत्रुओं” वाला पाठ कठिन है; पांडुलिपि-परम्परा में इसे “तुम्हारे अपराध” से संबंधित रूप में भी समझा गया है। प्रसंग न्याय और शत्रुओं के हाथ में सौंपे जाने की चेतावनी का समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ሕልያነ፡ ወአምኃ
  choice: रिश्वत या भेंट
  rationale: दोनों गीइज़ संज्ञाओं को न्याय-विकृति से जुड़ी ‘रिश्वत’ और व्यापक ‘भेंट’ के रूप में रखा; ‘पक्षपात’ अर्थ स्रोत में नहीं है।
- source_word: ደመ፡ በደም፡ ከመ፡ ትሠጠው
  choice: खून के बदले खून ... चुकाया जाए
  rationale: प्रतिदान/दण्ड की सूत्रात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा, बिना उसके न्यायशास्त्रीय अर्थ को आवश्यकता से अधिक परिभाषित किए।
- source_word: ዑቃቤሁ፡ ሠናይ
  choice: अच्छी रक्षा
  rationale: ዑቃቤ का अर्थ संरक्षण/रक्षा है, ‘स्मरण’ नहीं।
- source_word: አጓለ፡ እመሕያው
  choice: मनुष्यों की संतान
  rationale: मानवजाति के लिए स्रोत की वंशगत अभिव्यक्ति को औपचारिक किंतु बोधगम्य हिन्दी में सुरक्षित रखा।
- source_word: ተክለ፡ ጽድቅ
  choice: धार्मिकता का एक पौधा
  rationale: ‘plant of righteousness’ रूपक को जीवित रखा; इसे सीधे किसी व्यक्ति, वंश या मसीही पदवी के रूप में व्याख्यायित नहीं किया।
- source_word: ዑቃቤ፡ ዘአምላክ፡ ልዑል
  choice: परमप्रधान परमेश्वर की आज्ञा
  rationale: यहाँ ‘charge/keeping’ का आशय सौंपे गए दायित्व अथवा आदेश के पालन से है; प्राकृतिक हिन्दी के लिए ‘आज्ञा का पालन’ चुना।
theological_decisions:
- issue: ‘खून के बदले खून’ का स्वरूप
  choice: सूत्र को प्रत्यक्ष रखा और ‘चुकाया जाए’ कहा
  alternative: इसे स्पष्टतः मृत्युदण्ड या मानवीय प्रतिशोध कहना
  rationale: स्रोत दैवी न्याय के सामने रक्त के प्रतिदान की बात करता है, पर कार्यान्वयन की संस्था स्पष्ट नहीं करता।
- issue: ‘मृत्यु की ओर ले जाने वाला पाप’
  choice: ऐसा पाप ... जो मृत्यु की ओर ले जाता है
  alternative: ‘मृत्युदायी पाप’ को किसी निश्चित धर्मसैद्धान्तिक श्रेणी के रूप में प्रस्तुत करना
  rationale: स्रोत की गंभीर चेतावनी और सम्भावित धर्मवैचारिक तनाव सुरक्षित रखा, पर बाद की सम्प्रदायगत परिभाषा नहीं थोपी।
- issue: ‘धार्मिकता का पौधा’
  choice: रूपक को अनिर्धारित रखा
  alternative: इसे किसी विशिष्ट मसीही व्यक्तित्व या केवल धार्मिक वंश से पहचानना
  rationale: पाठ स्वयं रूपक की पहचान को पूर्णतः स्पष्ट नहीं करता।
- issue: नाम का न भुलाया जाना
  choice: ‘भुलाया न जाएगा’
  alternative: ‘स्मारक सदा रहेगा’
  rationale: नाम और वंश की स्थायी स्मृति का सीधा अर्थ रखा, उसे अमरत्व की स्पष्ट शिक्षा नहीं बनाया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पारिवारिक उपदेश की शैली। ‘परमप्रधान परमेश्वर’, ‘धार्मिकता’, ‘वंश’ और ‘अशुद्धता’ जैसे बाइबिलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए सहज रखा गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
