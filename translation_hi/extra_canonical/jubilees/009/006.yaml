lexical_decisions:
- source_word: መክፈልት
  choice: भाग
  rationale: भूमि-विभाजन के प्रसंग में यह किसी को मिले हिस्से या क्षेत्र को दर्शाता है; ‘भाग’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ደስያት
  choice: द्वीप
  rationale: यह द्वीपों अथवा समुद्री भूभागों के लिए प्रयुक्त शब्द है; बहुवचन अर्थ को ‘सभी द्वीप’ से व्यक्त किया गया है।
- source_word: ሉድ
  choice: लूद
  rationale: प्राचीन व्यक्ति/क्षेत्र के नाम Lud का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
