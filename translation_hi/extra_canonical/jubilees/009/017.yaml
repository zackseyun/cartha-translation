base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/017.yaml
  text: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men because of the righteousness in which he was perfect, except for Enoch. For Enoch's role was created as a testimony to the generations of the world, so that he might recount all the deeds to the generations.
translation:
  language: hi
  text: नूह पृथ्वी पर उन्नीस जुबिलियों, दो सप्ताहों और पाँच वर्ष तक जीवित रहा। अपनी उस धार्मिकता के कारण, जिसमें वह सिद्ध था, वह हनोक को छोड़ मनुष्यों में किसी से भी अधिक समय तक जीवित रहा। क्योंकि हनोक को संसार की पीढ़ियों के लिए गवाह बनने को नियुक्त किया गया था, ताकि वह पीढ़ियों को सभी कर्मों का वर्णन करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: जुबिलियों
  rationale: यह मूल पाठ की काल-गणना की तकनीकी इकाई है; इसे सामान्य ‘वर्ष-समूह’ बनाकर इसकी विशिष्टता मिटाना उचित नहीं।
- source_word: ሱባዔ
  choice: सप्ताहों
  rationale: यहाँ सात वर्षों के काल-समूह का संकेत है। ‘सप्ताह’ मूल की पारंपरिक गणना-भाषा को बनाए रखता है।
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: यह नैतिक और धार्मिक अर्थ वाला सामान्य बाइबलीय पद है; ‘नेकी’ की अपेक्षा प्रसंग की गरिमा और स्रोत का अर्थ बेहतर रखता है।
- source_word: ፍጹመ
  choice: सिद्ध
  rationale: मूल में पूर्णता/परिपूर्णता का भाव है। ‘सिद्ध’ इस दावे की शक्ति को घटाए बिना स्वाभाविक हिन्दी देता है।
- source_word: ተፈጥሮተ
  choice: भूमिका
  rationale: इस कठिन पद का शाब्दिक अर्थ सृष्टि/स्वभाव की ओर जा सकता है, पर वाक्य में हनोक के नियुक्त कार्य या पद का भाव अधिक संगत है; ‘भूमिका’ हिन्दी में इसे स्पष्ट किंतु गैर-सांप्रदायिक रूप से व्यक्त करती है।
- source_word: ስምዕ
  choice: गवाही
  rationale: मूल का अर्थ साक्ष्य या गवाही है; ‘गवाही’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ይንገር
  choice: विवरण दे
  rationale: क्रिया कहने, सुनाने या घोषित करने का भाव रखती है। कर्मों के संदर्भ में ‘विवरण दे’ सहज है और कथन की व्यापकता बनाए रखता है।
theological_decisions:
- issue: हनोक को छोड़ नूह की अद्वितीय दीर्घायु और धार्मिक सिद्धता
  choice: ‘हनोक को छोड़’ को धार्मिकता से संबंधित उपवाक्य के बाद रखते हुए दीर्घायु के तुलनात्मक दावे से जोड़ा गया
  alternative: इसे इस अर्थ में पढ़ना कि हनोक भी उसी प्रकार ‘सिद्ध’ था
  rationale: मूल वाक्य-विन्यास में कुछ तनाव है, पर कुल आयु 950 वर्ष होने और हनोक के पृथ्वी से उठा लिए जाने की परंपरा के कारण अपवाद मुख्यतः पृथ्वी पर दीर्घ जीवन के दावे को सीमित करता प्रतीत होता है। अनुवाद धार्मिकता के कथन को भी अक्षुण्ण रखता है।
- issue: हनोक की ‘सृष्टि/प्रकृति/भूमिका’
  choice: ‘हनोक की भूमिका ... ठहराई गई थी’
  alternative: ‘हनोक का स्वभाव ... बनाया गया था’ या ‘हनोक का पद नियुक्त किया गया था’
  rationale: स्रोत-पद कठिन है और पाठ हनोक के गवाही देने वाले कार्य पर केंद्रित है। ‘भूमिका’ अनावश्यक तत्त्वमीमांसीय निष्कर्ष से बचते हुए कार्यात्मक अर्थ देता है।
- issue: सभी कर्मों का लक्ष्य-समूह
  choice: ‘हर पीढ़ी को सभी कर्मों का विवरण दे’
  alternative: ‘पीढ़ियों के सभी कर्मों का वर्णन करे’
  rationale: मूल में पीढ़ियों को संबोधन/लाभार्थी मानने की संभावना है; निकटवर्ती ‘संसार की पीढ़ियों के लिए गवाही’ इस पाठ को समर्थन देता है, यद्यपि दूसरी संरचना भी व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। ‘जुबिली’ और ‘सप्ताह’ जैसी मूल काल-गणना इकाइयाँ सुरक्षित रखी गई हैं। पद्य का आरंभ स्पष्टता के लिए ‘नूह’ से किया गया है, क्योंकि 950 वर्षों की गणना और प्रसंग उसी की ओर संकेत करते हैं। दिए गए अंग्रेज़ी फुटनोट को शामिल नहीं किया गया, क्योंकि वह पिछले, असंगत बाबेल-वर्णन से संबंधित है और इस स्रोत-पाठ का पाठांतर नहीं है।
