  text: And Noah slept with his fathers[14], and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.
translation:
  language: hi
  text: इन सबकी सीमाएँ नूह के पुत्रों के लिए थीं। और उसने जो कुछ लिखा था, वह सब अपने पुत्र शेम को दे दिया, क्योंकि वह उससे बहुत प्रेम करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩያን
  choice: सीमाएँ
  rationale: संदर्भ में यह नूह के पुत्रों के भू-भागों की निर्धारित सीमाओं या विभाजनों को सूचित करता है; सहज हिन्दी में ‘सीमाएँ’ उपयुक्त है।
- source_word: ኵሎ፡ ዘጸሐፈ
  choice: जो कुछ लिखा था, वह सब
  rationale: मूल के ‘वह सब जो उसने लिखा’ को स्वाभाविक हिन्दी क्रम में रखते हुए पूर्णता का भाव सुरक्षित रखा गया है।
- source_word: ለሴም፡ ወልዱ
  choice: अपने पुत्र शेम को
  rationale: संबंध और अप्रत्यक्ष कर्म दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዘይፈህቅ
  choice: क्योंकि वह उससे बहुत प्रेम करता था
  rationale: क्रिया का कारणसूचक और प्रबल स्नेह का भाव व्यक्त किया गया है; सर्वनाम का संदर्भ नूह से शेम की ओर है।
