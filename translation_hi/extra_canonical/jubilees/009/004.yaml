  verdict: revise
  source_fidelity: The draft correctly conveys that this is Ham's allotted land and preserves the enduring, transgenerational scope. However, “अपनी सभी पीढ़ियों में सदा तक” is not idiomatic Hindi for descendants across successive generations, and the phrasing can more clearly retain the source's deliberate repetition of permanence.
  naturalness: The opening is clear and appropriately formal. The final temporal phrase is awkward and somewhat redundant in an un-Hindi way; “पीढ़ी-दर-पीढ़ी सदा-सदा के लिए” is natural while retaining the emphatic repetition.
  terminology: “हाम,” “भूमि,” “भाग,” and “अधिकार में रखें” are suitable. “अधिकार में रखें” expresses possession/occupation without limiting the sense to mere residence.
  issues:
  - severity: medium
    issue: The phrase “अपनी सभी पीढ़ियों में सदा तक” is unnatural and does not clearly mean successive descendant generations.
    rationale: The source/audit trail specifies possession for Ham and his sons throughout their generations, forever. Hindi idiom is better expressed by “पीढ़ी-दर-पीढ़ी,” while “सदा-सदा के लिए” preserves the intentional emphatic reiteration.
  revised_text: और यह वह भूमि है जो हाम के हिस्से में निकली—वह भाग जिसे वह स्वयं और उसके पुत्र पीढ़ी-दर-पीढ़ी सदा-सदा के लिए अपने अधिकार में रखें।
