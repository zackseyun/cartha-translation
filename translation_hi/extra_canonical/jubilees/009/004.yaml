  yaml_path: translation/extra_canonical/jubilees/009/004.yaml
  text: And this is the land that came out for Ham, as the portion which he was to occupy forever, for himself and for his sons throughout their generations forever.
translation:
  language: hi
  text: और यह वह भूमि है जो हाम के हिस्से में निकली—वह भाग जिसे वह स्वयं और उसके पुत्र पीढ़ी-दर-पीढ़ी सदा-सदा के लिए अपने अधिकार में रखें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፅአ / came out
  choice: हिस्से में निकली
  rationale: भूमि-विभाजन में भाग निकलने की मूल छवि को रखते हुए आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: መክፈልት / portion
  choice: भाग
  rationale: विभाजित भूमि में प्राप्त अंश के लिए सरल और स्वाभाविक हिन्दी शब्द।
- source_word: occupy / possess
  choice: अधिकार रखें
  rationale: यहाँ केवल निवास नहीं, पीढ़ियों तक भूमि पर अधिकार और अधिपत्य का भाव है।
- source_word: Ham
  choice: हाम
  rationale: नाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: forever … throughout their generations forever
  choice: सदा के लिए, अपनी सभी पीढ़ियों में सदा तक
  rationale: मूल में अनन्तकाल के भाव की पुनरावृत्ति को हटाए बिना हिन्दी में यथासंभव सहज रखा गया है।
theological_decisions:
- issue: भूमि पर स्थायी अधिकार की भाषा
  choice: अधिकार रखें
  alternative: उसमें बसे रहें
  rationale: वचन केवल निवास की बात नहीं करता, बल्कि हाम और उसके पुत्रों को पीढ़ी-दर-पीढ़ी मिले स्थायी भूभाग की बात करता है; इसलिए व्यापक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है। मूल की ‘हिस्से में निकलने’ वाली विभाजन-छवि तथा ‘सदा’ की जानबूझकर की गई पुनरावृत्ति सुरक्षित रखी गई है।
