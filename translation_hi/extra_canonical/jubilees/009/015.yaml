translation:
  language: hi
  text: क्योंकि वह उसे अपने सभी पुत्रों से अधिक प्रेम करता था। और नूह अपने पुरखाओं के साथ सो गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने पुरखाओं के साथ सो गया’ मृत्यु के लिए प्रयुक्त एक पारंपरिक मुहावरा है।
    reason: आधुनिक पाठक के लिए मृत्यु-संबंधी मुहावरे का आशय स्पष्ट करना, जबकि मुख्य पाठ में स्रोत की अभिव्यक्ति सुरक्षित रहे।
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: कारण बताने वाले गीइज़ संयोजक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ኪያሁ
  choice: उसे
  rationale: स्रोत में पुरुषवाचक कर्म-सर्वनाम है; उसका नाम इस पद में नहीं दिया गया, इसलिए अस्पष्टता सुरक्षित रखी गई।
- source_word: ያፈቅር
  choice: प्रेम करता था
  rationale: अपूर्ण/भूतकालीन संदर्भ में निरंतर भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ፈድፋደ እምኵሉ ውሉዱ
  choice: अपने सभी पुत्रों से अधिक
  rationale: तुलनात्मक अर्थ और 'उसके सभी पुत्र' का संबंध स्पष्ट, किंतु बिना अतिरिक्त पहचान जोड़े, व्यक्त किया गया।
- source_word: ወኖመ ኖኅ ምስለ አበዊሁ
  choice: और नूह अपने पुरखाओं के साथ सो गया
  rationale: मृत्यु के लिए प्रयुक्त पारंपरिक सामी मुहावरे को औपचारिक रूप से सुरक्षित रखा गया; 'पुरखाओं' आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ‘अपने पुरखाओं के साथ सो गया’ मृत्यु-संबंधी मुहावरा
  choice: मुहावरे को मुख्य पाठ में यथावत रखा
  alternative: और नूह मर गया और अपने पुरखाओं में जा मिला
  rationale: स्रोत केवल शारीरिक मृत्यु का सपाट कथन नहीं करता, बल्कि पारंपरिक निद्रा-मुहावरा रखता है; उसका रूप और संभावित धार्मिक तनाव सुरक्षित रखना उचित है।
- issue: प्रेम के पात्र की पहचान
  choice: ‘उसे’
  alternative: ‘अरपक्षद को’
  rationale: मूल पद में नाम नहीं, केवल सर्वनाम है; संदर्भ से प्राप्त नाम को पाठ में जोड़ना स्रोत की वास्तविक सर्वनामगत अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘पुत्रों’ और ‘पुरखाओं’ से कथात्मक-बाइबिलीय स्वर बना रहता है, पर भाषा अत्यधिक संस्कृतनिष्ठ नहीं होती।
