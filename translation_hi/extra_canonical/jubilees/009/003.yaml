translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी। अंग्रेज़ी के अस्पष्ट सर्वनाम ‘it’ को भौगोलिक प्रसंग के अनुसार ‘यह सीमा’ किया गया है, बिना संबंधित भूभाग की पहचान को और निश्चित किए।
