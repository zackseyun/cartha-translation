  yaml_path: translation/extra_canonical/jubilees/009/003.yaml
  text: And it goes forth toward the north to the limits of Gadir, and it goes forth to the coast of the waters of the great sea, until it approaches the river Gihon; and it goes along the south of the waters of Gihon to the bank of this river.
translation:
  language: hi
  text: और यह सीमा उत्तर की ओर गादीर की सीमाओं तक जाती है। फिर वह महासागर के जल के तट तक जाती है, और गीहोन नदी के पास पहुँचती है; और गीहोन के जल के दक्षिण की ओर इस नदी के किनारे तक जाती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पूर्ववर्ती अनुवाद में अंतिम भाग इस प्रकार था: “बड़े जल तक, जब तक वह गीहोन नदी के पास न पहुँचे; और गीहोन नदी इस देश के बीच से होकर बहती है।”'
    reason: पूर्ववर्ती rendering को अभिलेखित करता है; उपलब्ध गीइज़ पाठ ‘महासागर के जल’ और ‘गीहोन के जल के दक्षिण की ओर इस नदी के किनारे तक’ का समर्थन करता है।
lexical_decisions:
- source_word: ባሕረ፡ ዐቢይ (bāḥr ʿabiy)
  choice: महासागर
  rationale: शाब्दिक अर्थ ‘बड़ा समुद्र’ है; आधुनिक हिन्दी में ‘महासागर’ वही भौगोलिक अर्थ स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ጋድር / Gadir
  choice: गादीर
  rationale: स्थान-नाम का ध्वन्यात्मक लिप्यंतरण किया गया है; इसकी पहचान को किसी आधुनिक स्थान से निश्चित नहीं किया गया।
- source_word: ጌዮን / Gihon
  choice: गीहोन
  rationale: नदी के पारंपरिक नाम को हिन्दी देवनागरी में ध्वन्यात्मक रूप से रखा गया है।
- source_word: ደንገጉ / bank
  choice: किनारे
  rationale: भौगोलिक सीमा के संदर्भ में नदी के तट या किनारे का स्पष्ट, सामान्य हिन्दी रूप।
