  yaml_path: translation/extra_canonical/jubilees/009/002.yaml
  text: And it extends to all the mountains of fire, and it extends toward the west to the sea of Atel, and it extends westward until it reaches the sea of Mauk, that sea into which everything that descends is not destroyed.
translation:
  language: hi
  text: और वह आग के सभी पहाड़ों तक फैला है, और पश्चिम की ओर अतेल के सागर तक फैला है; और पश्चिम की ओर फैलते हुए माऊक के सागर तक पहुँचता है—उस सागर में जो कुछ उतरता है, वह नष्ट नहीं होता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जिसमें वह सब उतरता है जो नष्ट नहीं होता।”
    reason: संबंधवाचक उपवाक्य को जोड़ने की एक वैकल्पिक व्याख्या दर्ज की गई है, यद्यपि मुख्य पाठ गीइज़ वाक्य-विन्यास के अधिक संभावित अर्थ को प्रस्तुत करता है।
lexical_decisions:
- source_word: ባሕር
  choice: सागर
  rationale: भौगोलिक सीमा के वर्णन में ‘सागर’ स्वाभाविक और गरिमापूर्ण है तथा मूल के ‘समुद्र/सागर’ अर्थ को ठीक रखता है।
- source_word: Atel
  choice: अतेल
  rationale: अज्ञात अथवा प्राचीन भौगोलिक नाम को अर्थानुवाद करने के बजाय ध्वन्यात्मक रूप में रखा गया है।
- source_word: Mauk
  choice: माऊक
  rationale: प्राचीन सागर-नाम को पहचान योग्य ध्वन्यात्मक रूप में रखा गया है; इसे किसी आधुनिक जलाशय से अनिश्चित रूप से नहीं जोड़ा गया।
- source_word: ʾi-yəmassən
  choice: नष्ट नहीं होती
  rationale: निषेध सहित क्रिया का अर्थ ‘नष्ट/विनष्ट नहीं होती’ है; वाक्य में इसका कर्ता सागर में उतरनेवाली प्रत्येक वस्तु है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, कथात्मक और गरिमापूर्ण शैली अपनाई गई है। दिशाओं और सीमाओं की पुनरावृत्ति मूल भौगोलिक वर्णन के अनुरूप रखी गई है; प्राचीन स्थान-नामों की पहचान अनुमान से नहीं की गई।
