  text: And he said[10], "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And he told one of us that we should teach Noah all their remedies, for
translation:
  language: hi
  text: और उसने कहा[a], “उनमें से दसवाँ भाग उसके सामने बना रहे, और नौ भाग न्याय के स्थान में उतर जाएँ।” फिर उसने हममें से एक से कहा कि हम नूह को उनके सभी उपचार सिखाएँ,[b] क्योंकि—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनमें से दसवाँ भाग बना रहे’—यह वाक्य जलप्रलय के बाद भी दुष्ट आत्माओं की गतिविधि जारी रहने के विषय में इस अध्याय की विशिष्ट व्याख्या को सुरक्षित रखता है।
    reason: cross_reference
  - marker: b
    text: 'पुराना अनुवाद: ‘और हममें से एक ने कहा कि हम नूह को उनके सभी उपचार सिखाएँ।’ गीज़ में अधिक स्वाभाविक अर्थ है कि उसने हममें से एक से यह कहा।'
    reason: previous_rendering
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: न्याय का स्थान
  rationale: शाब्दिक अर्थ ‘न्याय का स्थान’ है; इससे दंड अथवा अधोलोक जैसी अधिक विशिष्ट व्याख्या आरोपित नहीं होती।
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ
  choice: फिर उसने हममें से एक से कहा
  rationale: ለ उपसर्ग ‘से/को’ के कारण ‘हममें से एक’ वाक्य का कर्ता नहीं, बल्कि कथन का अप्रत्यक्ष कर्म है।
- source_word: ንምሀር፡ ለኖኅ
  choice: कि हम नूह को … सिखाएँ
  rationale: प्रथम पुरुष बहुवचन क्रिया का भाव और नूह को संबोधित शिक्षण, दोनों सुरक्षित रखे गए हैं।
- source_word: ኵሎ፡ ፈውሶሙ
  choice: उनके सभी उपचार
  rationale: ፈውስ उपचार/चिकित्सा का बोध देता है; ‘नुस्खे’ की अपेक्षा ‘उपचार’ व्यापक और स्वाभाविक है।
theological_decisions:
- issue: जलप्रलय के बाद दुष्ट आत्माओं की निरंतर गतिविधि
  choice: ‘दसवाँ भाग … बना रहे’ को यथावत रखा
  alternative: इसे सामान्य रूप से कुछ आत्माओं के बच रहने के रूप में समझाकर कहना
  rationale: यह इस अध्याय की विशिष्ट व्याख्या है; अनुवाद इसे न तो कम करता है, न किसी व्यवस्थित दानव-विज्ञान से विस्तार देता है।
- issue: ‘उसके’ का संदर्भ
  choice: सर्वनाम को अस्पष्ट ही रखा
  alternative: नाम जोड़कर संदर्भ स्पष्ट करना
  rationale: इस अंश में सर्वनाम का संदर्भ पूर्ववर्ती प्रसंग पर निर्भर है; नाम जोड़ना व्याख्यात्मक निर्णय होता।
- issue: शिक्षा देने वाले का कर्ता
  choice: कहने वाले ने ‘हममें से एक से’ कहा कि ‘हम’ नूह को सिखाएँ
  alternative: ‘हममें से एक ने कहा कि हम नूह को सिखाएँ’
  rationale: गीज़ के ለ उपसर्ग से ‘हममें से एक’ अप्रत्यक्ष कर्म बनता है; फिर भी पुराने पाठांतर को टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। आदेशसूचक वाक्यों में ‘बना रहे’ और ‘उतर जाएँ’ मूल की विधिलिंग संरचना को व्यक्त करते हैं। पद ‘क्योंकि’ पर अधूरा समाप्त होता है, इसलिए आगे जारी रहने का संकेत देने हेतु दीर्घ डैश रखा गया है।
