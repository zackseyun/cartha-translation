base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/009.yaml
  text: And the prince of spirits, Mastema, came and said, "Lord, Creator, leave some of them to me, and let them listen to my voice and do everything that I tell them; for if none of them is left to me, I will not be able to exercise the authority of my will among the children of men, because they are for corrupting and leading astray before my judgment, for great is the evil of the sons of men."
translation:
  language: hi
  text: और आत्माओं का प्रधान, मस्तेमा,[a] आया और बोला, “हे प्रभु, हे सृष्टिकर्ता, उनमें से कुछ को मेरे लिए छोड़ दे। वे मेरी बात सुनें और जो कुछ मैं उनसे कहूँ, वह सब करें; क्योंकि यदि उनमें से कोई भी मेरे लिए न छोड़ा गया, तो मैं मनुष्यों की सन्तानों के बीच अपनी इच्छा के अधिकार का प्रयोग नहीं कर सकूँगा। वे मेरे न्याय से पहले मनुष्यों की सन्तानों को भ्रष्ट करने और भटकाने के लिए हैं, क्योंकि मनुष्यों की सन्तानों की बुराई बहुत बड़ी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीइज़ पदबंध का शाब्दिक अर्थ “आत्माओं का दूत [या स्वर्गदूत], मस्तेमा” भी हो सकता है; प्रसंग के आधार पर इसे “आत्माओं का प्रधान, मस्तेमा” अनूदित किया गया है। एक वैकल्पिक अनुवाद है: “और प्रधान मस्तेमा आया और बोला।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: आत्माओं का प्रधान, मस्तेमा
  rationale: पदबंध का अर्थ आत्माओं से संबंधित एक शासकीय/प्रधान सत्ता और उसके नाम मस्तेमा को व्यक्त करता है। ‘प्रधान’ प्रसंग में विरोधी आत्मिक अधिकारी की भूमिका को स्वाभाविक हिन्दी में रखता है, जबकि पादटिप्पणी ‘दूत’ की शाब्दिक संभावना सुरक्षित करती है।
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: उनमें से कुछ को मेरे लिए छोड़ दे
  rationale: क्रिया का भाव शेष रहने या बचाकर छोड़ने का है; ‘कुछ’ अगले वाक्य के ‘कोई भी नहीं’ से निहित और संदर्भ-संगत है।
- source_word: ስልጣነ፡ ፈቃድየ
  choice: अपनी इच्छा का अधिकार
  rationale: ስልጣን अधिकार/सत्ता और ፈቃድ इच्छा को दर्शाते हैं; असामान्य संबंध को सरल करके मिटाने के बजाय हिन्दी में यथासंभव सुरक्षित रखा गया है।
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: भ्रष्ट करने और भटकाने के लिए
  rationale: दोनों प्रयोजनात्मक क्रियाओं का क्रम और अलग-अलग अर्थ बनाए रखे गए हैं।
- source_word: ቅድመ፡ ኵነኔየ
  choice: मेरे न्याय से पहले
  rationale: शाब्दिक कालगत अर्थ को रखा गया है; इसे ‘जब तक मेरा न्याय न आए’ जैसी व्याख्यात्मक भाषा में नहीं बदला गया।
theological_decisions:
- issue: मस्तेमा की पहचान और उपाधि
  choice: नाम ‘मस्तेमा’ के साथ ‘आत्माओं का प्रधान’
  alternative: ‘आत्माओं का दूत मस्तेमा’ या केवल ‘प्रधान मस्तेमा’
  rationale: स्रोत में आत्माओं का उल्लेख स्पष्ट है और इसे छोड़ना महत्वपूर्ण सूक्ष्मता खो देगा। ‘प्रधान’ इस विरोधी आत्मिक अधिकारी की प्रसंगगत भूमिका व्यक्त करता है, पर पादटिप्पणी शाब्दिक विकल्प देती है।
- issue: ‘मेरे न्याय’ का वक्ता और अर्थ
  choice: मस्तेमा के प्रत्यक्ष कथन के रूप में ‘मेरे न्याय से पहले’
  alternative: ‘तेरे न्याय से पहले’ या ‘अन्तिम न्याय तक’
  rationale: प्राप्त गीइज़ पाठ प्रथम पुरुष संबंधसूचक रूप देता है। कठिन धार्मिक तनाव को किसी परिचित न्यायशास्त्रीय धारणा के अनुसार चुपचाप नहीं बदला गया।
- issue: दुष्ट आत्माओं का उद्देश्य
  choice: ‘वे ... भ्रष्ट करने और भटकाने के लिए हैं’
  alternative: इसे परमेश्वर द्वारा नियुक्त उद्देश्य या केवल उनकी प्रवृत्ति के रूप में स्पष्ट करना
  rationale: मूल कथन का कर्ता और प्रयोजन कुछ तनावपूर्ण हैं; अनुवाद ने मस्तेमा के दावे को ज्यों का त्यों रखा और अतिरिक्त धार्मिक कारण नहीं जोड़ा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष वचन रखा गया है। ‘सन्तानों’ और ‘सृष्टिकर्ता’ जैसे परिचित धार्मिक शब्द सामान्य पाठक के लिए बोधगम्य हैं। स्रोत की असामान्य अभिव्यक्ति ‘अपनी इच्छा का अधिकार’ तथा ‘मेरे न्याय से पहले’ को अत्यधिक व्याख्यात्मक बनाए बिना सुरक्षित रखा गया है।
