  text: And for Tubal there came out a fifth portion in the midst of the tongue that approaches toward the portion of Lud, as far as the other tongue, into the region beyond the other tongue.
translation:
  language: hi
  text: और तूबल के लिए पाँचवाँ भाग निकला—उस भू-जिह्वा[a] के मध्य में, जो लूद के भाग की ओर बढ़ती है, दूसरी भू-जिह्वा तक, और दूसरी भू-जिह्वा के पार के प्रदेश में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘जिह्वा’; यहाँ जीभ के आकार में फैले किसी भूभाग के लिए प्रयुक्त भौगोलिक अभिव्यक्ति है।
    reason: मूल भौगोलिक पद अस्पष्ट है; टिप्पणी उसके शाब्दिक बिंब को स्पष्ट करती है, पर उसे किसी निश्चित स्थलरूप के रूप में नहीं पहचानती।
lexical_decisions:
- source_word: ወለቱቤልሂ
  choice: और तूबल के लिए
  rationale: शब्दरूप स्पष्ट रूप से ‘तूबल के लिए भी/और तूबल के लिए’ है; आरंभ में आया ‘लूद’ पिछले कथन का अंतिम अंश है, इस आवंटन का पात्र नहीं।
- source_word: መክፈልት፡ ኃምስ
  choice: पाँचवाँ भाग
  rationale: भूमि-विभाजन के संदर्भ में क्रमसूचक अर्थ और आवंटित हिस्से की धारणा दोनों बनाए रखता है।
- source_word: ልሳን
  choice: भू-जिह्वा
  rationale: मूल का शाब्दिक बिंब ‘जिह्वा’ है और संदर्भ भौगोलिक है। ‘भू-जिह्वा’ इस अस्पष्ट प्राचीन भूगोल को किसी निश्चित आधुनिक स्थलरूप में बदले बिना समझने योग्य बनाता है।
- source_word: ትቀርብ፡ መንገለ
  choice: की ओर बढ़ती है
  rationale: दिशात्मक निकटता को स्वाभाविक हिन्दी में व्यक्त करता है और भूभाग के फैलाव का भाव बनाए रखता है।
- source_word: ማዕዶተ
  choice: पार के प्रदेश
  rationale: इसका अर्थ केवल ‘के भीतर’ नहीं, बल्कि ‘उस पार/परे’ है; इसलिए संशोधित स्रोत-पाठ के स्थानिक अर्थ को स्पष्ट रखा गया है।
