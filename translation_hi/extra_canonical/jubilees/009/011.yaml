  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी रखी गई है। मूल के अस्पष्ट प्राचीन भूगोल को सुरक्षित रखते हुए विराम-चिह्नों से सीमा-वर्णन स्पष्ट किया गया है।
