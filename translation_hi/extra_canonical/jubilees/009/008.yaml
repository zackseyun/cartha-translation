  language: en
  yaml_path: translation/extra_canonical/jubilees/009/008.yaml
  text: And the angel of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me from among them, I will not be able to exercise the authority of my will over the children of men, for these are for corrupting and leading astray before my judgment, for great is the wickedness of the children of men.”
translation:
  language: hi
  text: और आत्माओं का दूत मस्तेमा आया और उसने कहा, “हे प्रभु, हे सृष्टिकर्ता, उनमें से कुछ को मेरे सामने रहने दे। वे मेरी बात सुनें और जो कुछ मैं उनसे कहूँ, वह सब करें; क्योंकि यदि उनमें से कुछ मेरे लिए न छोड़े जाएँ, तो मैं मनुष्यों की संतानों पर अपनी इच्छा के अनुसार अधिकार का प्रयोग नहीं कर सकूँगा। क्योंकि ये मेरे न्याय से पहले मनुष्यों की संतानों को भ्रष्ट करने और भटकाने के लिए हैं, क्योंकि मनुष्यों की संतानों की दुष्टता बहुत बड़ी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: आत्माओं का दूत मस्तेमा
  rationale: मूल गीइज़ में መስተማ एक स्पष्ट व्यक्तिनाम है; इसलिए इसे छोड़ा नहीं गया और ‘आत्माओं का दूत’ के साथ apposition में रखा गया।
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: उनमें से कुछ को मेरे सामने रहने दे
  rationale: ‘बचा/रहने देना’ और ‘मेरे सामने’—दोनों मूल अर्थों को रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: अपनी इच्छा का अधिकार ... चला सकूँगा
  rationale: सत्ता/अधिकार के प्रयोग और वक्ता की इच्छा—दोनों तत्वों को सुरक्षित रखा गया है।
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: भ्रष्ट करने और भटकाने
  rationale: दो समानांतर क्रियाओं—हानि/भ्रष्टता उत्पन्न करना और मार्ग से भटकाना—का भेद बनाए रखा गया है।
- source_word: ቅደመ፡ ኵነኔየ
  choice: मेरे न्याय से पहले
  rationale: वक्ता से जुड़े प्रथम पुरुष और ‘न्याय/दण्डादेश’ की कठिन अभिव्यक्ति को व्याख्यात्मक रूप से हल किए बिना संरक्षित किया गया है।
- source_word: ውሉደ፡ ሰብእ
  choice: मनुष्यों की संतान
  rationale: मूल के ‘मनुष्य की संतान/मानव-संतान’ रूपक को सामान्य ‘लोगों’ में समतल नहीं किया गया।
theological_decisions:
- issue: मस्तेमा की पहचान
  choice: मस्तेमा को ‘आत्माओं का दूत’ कहा गया है।
  alternative: ‘बची हुई आत्माओं का दूत’ या नाम को छोड़ देना।
  rationale: गीइज़ पाठ में መስተማ स्पष्ट रूप से नाम के रूप में उपस्थित है; ‘बची हुई’ इस पदबंध में नहीं है।
- issue: ‘मेरे न्याय’ का वक्ता
  choice: प्रथम पुरुष ‘मेरे न्याय’ बनाए रखा गया।
  alternative: इसे ‘तेरे न्याय’ या ‘तेरे न्याय के दिन’ करना।
  rationale: मूल ኵነኔየ प्रथम पुरुष संबंधसूचक है। कठिन धार्मिक आशय को मौन रूप से बदलना उचित नहीं।
- issue: दुष्ट आत्माओं की भूमिका
  choice: ‘भ्रष्ट करने और भटकाने के लिए’ उद्देश्य-वाक्य ज्यों का त्यों रखा गया।
  alternative: इसे केवल अनुमति, परीक्षा या दण्ड के रूप में समझाकर अनुवाद करना।
  rationale: मूल पाठ उद्देश्य को कठोर और प्रत्यक्ष ढंग से व्यक्त करता है; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। ‘हे प्रभु, हे सृष्टिकर्ता’ संबोधन की गंभीरता बनाए रखता है। मूल की धर्मवैज्ञानिक असुविधा और ‘मेरे न्याय’ की अस्पष्टता को व्याख्या द्वारा दूर नहीं किया गया।
