  text: And it extends until it approaches west of Fara, and it returns toward Aferag, and it extends eastward toward the waters of the Sea of Me'at.
translation:
  language: hi
  text: और वह फ़ारा के पश्चिम के पास पहुँचता है; फिर अफ़ेराग की ओर लौटता है और पूर्व की ओर मेआत सागर के जल तक फैलता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Fara
  choice: फ़ारा
  rationale: स्थान-नाम को अर्थानुवाद करने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: Aferag
  choice: अफ़ेराग
  rationale: अस्पष्ट प्राचीन स्थान-नाम की पहचान पर अनुमान लगाए बिना उसका लिप्यंतरण किया गया है।
- source_word: ባሕረ፡ ሜአት / Sea of Me'at
  choice: मेआत सागर
  rationale: नामित जलराशि को ‘मेआत सागर’ के रूप में लिप्यंतरित किया गया है; ‘जल’ को अलग रखते हुए सीमा-वर्णन की संरचना सुरक्षित रखी गई है।
- source_word: extends
  choice: आगे बढ़ते हुए…फैलता है
  rationale: सीमा-रेखा की गति और विस्तार को स्वाभाविक हिन्दी में व्यक्त करने के लिए प्रसंगानुसार दो निकटवर्ती क्रियापद चुने गए हैं।
- source_word: returns toward
  choice: की ओर मुड़ता है
  rationale: सीमा-वर्णन में भौतिक वापसी की अपेक्षा दिशा बदलने का भाव अधिक स्वाभाविक रूप से व्यक्त होता है।
