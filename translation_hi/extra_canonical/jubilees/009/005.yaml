- source_word: መክፈልት / portion
  choice: भाग
  rationale: भूमि-विभाजन के संदर्भ में सरल और स्वाभाविक हिन्दी; चिट्ठी से मिले भूभाग का भाव प्रसंग से स्पष्ट रहता है।
- source_word: came out
