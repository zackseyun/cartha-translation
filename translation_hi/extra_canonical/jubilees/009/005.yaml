  text: और येपेत के हिस्से में तीसरा भाग आया—तीना नदी के पार, उसके जल के निकलने के स्थान के उत्तर की ओर; और वह उत्तर-पूर्व दिशा में गोग के पूरे क्षेत्र तक और उसके पूर्व के सारे देश तक फैला हुआ है।
