- source_word: river Tina
  choice: तीना नदी
  rationale: प्राचीन भौगोलिक नाम का लिप्यंतरण किया गया है; इसकी पहचान अनिश्चित होने के कारण किसी आधुनिक नदी से नहीं जोड़ा गया।
- source_word: northeastward
  choice: उत्तर-पूर्व दिशा में
  rationale: सीमा या भूभाग के विस्तार की दिशा को आधुनिक, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: Gog
  choice: गोग
  rationale: व्यक्तिवाचक भौगोलिक नाम का पारंपरिक ध्वन्यात्मक रूप रखा गया है।
