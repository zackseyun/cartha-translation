base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/013.yaml
  text: And we told Noah along with their deceptions, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book concerning every kind of healing, and the spirits were restrained.
translation:
  language: hi
  text: और हमने नूह को उनकी छलनाओं समेत [यह] बताया, ताकि पृथ्वी के पौधों से उनका उपचार हो सके। नूह ने हर प्रकार के उपचार के विषय में वह सब कुछ एक पुस्तक में लिख लिया जो हमने उसे सिखाया था, और आत्माओं[b] को रोक दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: संदर्भ के अनुसार, ‘दुष्ट आत्माओं’।
    reason: मूल पाठ में केवल ‘आत्माएँ’ है, यद्यपि व्यापक प्रसंग में ये आत्माएँ हानिकारक या दुष्ट समझी जा सकती हैं।
lexical_decisions:
- source_word: አስሕተትሙ
  choice: उनके छल-कपट
  rationale: यह शब्द भटकाने, धोखे या त्रुटियों का बोध करा सकता है। प्रसंग में आत्माओं की छलपूर्ण गतिविधियाँ अभिप्रेत हैं; इसलिए ‘छल-कपट’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ዕፀወ፡ ምድር
  choice: पृथ्वी के पौधे
  rationale: शाब्दिक अर्थ ‘पृथ्वी की वनस्पतियाँ/पौधे’ है। ‘पौधे’ सामान्य पाठक के लिए स्पष्ट है और औषधीय उपयोग का अनावश्यक विस्तार नहीं जोड़ता।
- source_word: ትዝምደ፡ ፈውሳት
  choice: हर प्रकार की चिकित्सा के विषय में
  rationale: पदबंध विभिन्न उपचारों या चंगाइयों से संबंधित विषय-वस्तु बताता है। यह रूप पुस्तक में लिखी चिकित्सा-संबंधी शिक्षा को सहज हिन्दी में व्यक्त करता है।
- source_word: መናፍስት
  choice: आत्माओं
  rationale: मूल में केवल ‘आत्माएँ’ है; प्रसंग उन्हें दुष्ट मान सकता है, पर मूल में अनुपस्थित विशेषण को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ወተዐጸዉ
  choice: रोक दिया गया
  rationale: निष्क्रिय क्रिया का भाव रोकने, सीमित करने या निरुद्ध करने का है। ‘रोक दिया गया’ सरल और अर्थ-संगत है।
theological_decisions:
- issue: आत्माओं का नैतिक स्वरूप
  choice: मुख्य पाठ में केवल ‘आत्माओं’
  alternative: ‘दुष्ट आत्माओं’
  rationale: संदर्भ में उनके दुष्ट होने का संकेत है, किंतु गीइज़ पद में विशेषण ‘दुष्ट’ नहीं है; अतः उसे पाठ में जोड़ने के बजाय पादटिप्पणी में संदर्भगत विकल्प बताया गया।
- issue: उपचार पाने वालों की पहचान
  choice: ‘उनका उपचार हो सके’ द्वारा सर्वनामगत अस्पष्टता बनाए रखी
  alternative: नूह या उसके पुत्रों को स्पष्ट कर्ता बनाना
  rationale: मूल क्रियारूप और उपलब्ध वाक्य-संदर्भ उपचार से जुड़े व्यक्तियों की पहचान पूरी तरह स्पष्ट नहीं करते; किसी निश्चित समूह को जोड़ना व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘भी बता दिए’ मूल के ‘साथ/सहित’ भाव और पूर्ववर्ती कथन से उसके संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। निष्क्रिय वाक्य-विन्यास और उपचार पाने वालों की अस्पष्ट पहचान को जानबूझकर सुरक्षित रखा गया है।
