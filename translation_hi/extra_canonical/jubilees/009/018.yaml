  language: en
  yaml_path: translation/extra_canonical/jubilees/009/018.yaml
  text: And in the thirty-third jubilee[18], in the first year of the second week, Peleg took for himself a wife whose name was Lomna, the daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land.”
translation:
  language: hi
  text: और तैंतीसवें जुबली-वर्षचक्र में, दूसरे सप्ताह के पहले वर्ष में, पेलेग ने लोम्ना नाम की एक स्त्री से विवाह किया, जो शिनार की बेटी थी। इस सप्ताह के चौथे वर्ष में लोम्ना ने उसके एक पुत्र को जन्म दिया। पेलेग ने उसका नाम रऊ रखा, क्योंकि उसने कहा, “देखो, मनुष्यों की संतान उस दुष्ट योजना में पड़कर दुष्ट हो गई है कि वे अपने लिए भूमि में एक नगर और एक मीनार बनाएँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: जुबली-वर्षचक्र
  rationale: यहाँ शब्द कालगणना की उनचास वर्ष की इकाई को दर्शाता है; केवल ‘जुबली’ की अपेक्षा ‘वर्षचक्र’ जोड़ने से आधुनिक हिन्दी पाठक के लिए अर्थ स्पष्ट होता है।
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: एक स्त्री से विवाह किया
  rationale: शाब्दिक अर्थ ‘अपने लिए एक स्त्री ली’ है; विवाह-संदर्भ को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ራገው
  choice: रऊ
  rationale: नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है।
- source_word: ሀገረ፡ ወማኅፈደ
  choice: एक नगर और एक मीनार
  rationale: पहला शब्द ‘नगर’ और दूसरा इस बाबेल-वृत्तांत में ऊँची निर्मित संरचना, अर्थात ‘मीनार’, को सूचित करता है।
- source_word: ውስተ፡ ምድረ
  choice: पृथ्वी पर
  rationale: गीज़ पदबंध व्यापक रूप से ‘धरती/भूमि पर’ हो सकता है; यहाँ अनिश्चित किसी खास देश का संकेत न देकर व्यापक अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: मनुष्यों के दुष्ट होने और उनकी योजना के बीच संबंध
  choice: अपनी बुरी योजना के कारण दुष्ट हो गई है
  alternative: बुरी सम्मति में दुष्ट हो गई है
  rationale: स्रोत दुष्टता को नगर और मीनार बनाने की योजना से जोड़ता है। अनुवाद नैतिक निर्णय को बनाए रखता है, पर उसके पीछे कोई अतिरिक्त सिद्धान्त या प्रेरणा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कालगणना के तकनीकी ढाँचे को ‘जुबली-वर्षचक्र’ और ‘सप्ताह’ से सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ की फुटनोट मीनार के मापों से संबंधित है, जो इस पद के उपलब्ध गीज़ पाठ में नहीं हैं; इसलिए असंगत फुटनोट और उसका चिह्न शामिल नहीं किए गए।
