base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/001.yaml
  text: And for the south there came out his portion[1], for Shem, as far as it approaches the middle of the sea. And for Madai there came out a portion, that he should possess from the west of his two brothers, as far as the islands and as far as their borders.
translation:
  language: hi
  text: और उसका भीतरी भाग[a] दक्षिण की ओर था, जहाँ तक वह समुद्र के मध्य के निकट पहुँचता है। और मादै के लिए एक भाग निकला, ताकि वह अपने दोनों भाइयों के पश्चिम से[b] लेकर द्वीपों और उनकी सीमाओं तक अधिकार में ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध पाठ इस भूमि-विभाजन के वर्णन के बीच से आरम्भ होता जान पड़ता है; इसलिए ‘उसका’ किसके लिए है, यह इस अंश में स्पष्ट नहीं है। कुछ पुनर्निर्मित प्रस्तुतियाँ यहाँ शेम का नाम जोड़ती हैं।
    reason: segmentation_note
  - marker: b
    text: 'इस वाक्यांश की बनावट कठिन है। इसका अनुवाद यह भी हो सकता है: ‘पश्चिम से अपने दोनों भाइयों की ओर’।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ውሳጥያቲሁ
  choice: उसका भीतरी भाग
  rationale: इस रूप का अर्थ ‘उसका भीतर/भीतरी भाग’ है। उपलब्ध अंश में इसका पूर्वपद नहीं है, इसलिए अनुवाद में कोई नाम जोड़कर संदर्भ को कृत्रिम रूप से स्पष्ट नहीं किया गया।
- source_word: መክፈልት
  choice: एक भाग
  rationale: भूमि-विभाजन के प्रसंग में ‘भाग/हिस्सा’ स्वाभाविक है; ‘चिट्ठी’ स्रोत शब्द का प्राथमिक अर्थ नहीं है।
- source_word: የአኅዝ
  choice: अधिकार करे
  rationale: क्रिया में पकड़ने, ग्रहण करने या अपने अधिकार में लेने का भाव है। भूमि के आवंटन के संदर्भ में ‘अधिकार करे’ उपयुक्त है और अनावश्यक हिंसक अर्थ नहीं जोड़ता।
- source_word: ለክአኢሆሙ፡ አኅዊሁ
  choice: अपने दोनों भाइयों के
  rationale: ክአኢ संख्या ‘दो’ को दर्शाता है; इसलिए केवल ‘भाइयों’ नहीं, बल्कि ‘दोनों भाइयों’ का स्पष्ट अनुवाद किया गया।
- source_word: ደስያት፡ ወእስከ፡ ጽነፊሆን
  choice: द्वीपों और उनकी सीमाओं तक
  rationale: भौगोलिक विस्तार के दोनों अंतिम बिंदुओं—द्वीप और उनकी सीमाएँ/छोर—को बनाए रखा गया है।
