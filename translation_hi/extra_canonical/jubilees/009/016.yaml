  - marker: b
    text: या, “अपने जीवन में 950 वर्ष पूरे किए।”
    reason: गीज़ በሕይወቱ में በ- का अधिक शाब्दिक अनुवाद ‘में’ है।
lexical_decisions:
- source_word: ውስተ፡ ሉባር፡ ደብር
  choice: लूबार पर्वत पर
  rationale: ደብር का अर्थ ‘पर्वत’ है और लूबार उसका नाम है। ውስተ का मूल स्थानवाचक अर्थ ‘में/के भीतर’ है, पर पर्वत पर दफ़नाए जाने के संदर्भ में स्वाभाविक हिन्दी ‘पर’ है; शाब्दिक संरचना पादटिप्पणी में रखी गई है।
- source_word: በምድረ፡ አራራት
  choice: अरारात देश में
  rationale: ምድር यहाँ भूभाग/देश को सूचित करता है; ‘अरारात देश’ आधुनिक हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ
  choice: 950 वर्ष पूरे किए
  rationale: ፈጸመ का कर्तृवाच्य अर्थ ‘पूरा किया’ है; यह रूप स्रोत की व्याकरणिक संरचना को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: በሕይወቱ
  choice: अपने जीवन के
  rationale: उपसर्ग በ- का शाब्दिक अर्थ ‘में’ हो सकता है, किंतु आयु की अवधि के साथ हिन्दी में ‘अपने जीवन के 950 वर्ष’ अधिक स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
