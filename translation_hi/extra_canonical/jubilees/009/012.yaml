  text: The third tongue. And for Mesek came forth the sixth portion, all the region beyond the third tongue.
translation:
  language: hi
  text: तीसरी जीभ। और मेशेक के लिए छठा भाग निकला—तीसरी जीभ के पार का पूरा प्रदेश।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “तीसरी जीभ का पूरा प्रदेश।”
    reason: ማዕዶት का अर्थ ‘पार/दूसरी ओर का क्षेत्र’ हो सकता है, पर परंपरागत पाठ इसे अधिक सामान्य संबंधसूचक अर्थ में भी प्रस्तुत करता है।
lexical_decisions:
- source_word: ልሳን፡ ሣልስት
  choice: तीसरी जीभ
  rationale: ልሳን का मूल अर्थ ‘जीभ’ है और यहाँ यह संभवतः किसी भू-आकृति या भौगोलिक क्षेत्र का नामसूचक वर्णन है। अस्पष्टता बनाए रखने के लिए इसे सामान्य ‘भाषा’ नहीं किया गया।
- source_word: ለሞስክ
  choice: मेशेक के लिए
  rationale: व्यक्तिनाम ሞስክ को प्रचलित बाइबलीय हिन्दी रूप ‘मेशेक’ में लिप्यंतरित किया गया; उपसर्ग ለ को ‘के लिए’ से व्यक्त किया गया।
- source_word: ወፅአ፡ መክፈልት፡ ሳድስ
  choice: छठा भाग निकला
  rationale: क्रिया ወፅአ के ‘निकलना/प्राप्त होना’ और መክፈልት के आवंटित ‘भाग’ के भाव को औपचारिक रूप से सुरक्षित रखा गया।
- source_word: ኵሉ፡ ማዕዶተ፡ ልሳን፡ ዘሣልስት
  choice: तीसरी जीभ के पार का पूरा प्रदेश
  rationale: ማዕዶት में ‘पार, दूसरी ओर, पार का क्षेत्र’ का भौगोलिक भाव है; इसलिए ‘पार का पूरा प्रदेश’ चुना गया, जबकि संबंधसूचक वैकल्पिक पाठ पादटिप्पणी में रखा गया।
