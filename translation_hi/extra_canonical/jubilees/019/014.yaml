lexical_decisions:
- source_word: ጸጕር
  choice: रोएँदार
  rationale: यह खंड पिछले वर्णन से जुड़ा विशेषण है; ‘रोएँदार’ देह पर घने बाल होने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ኀደረ፡ ውስተ፡ ምጽላላት
  choice: तंबुओं में रहता था
  rationale: क्रिया का निवास-संबंधी अर्थ और बहुवचन ‘तंबुओं’ दोनों सुरक्षित रखे गए हैं।
- source_word: ወሬዛ
  choice: युवक
  rationale: दोनों भाइयों के बढ़कर युवा होने का संकेत देता है; हिंदी में प्रसंगानुकूल बहुवचन ‘वे युवक’ रखा गया है।
- source_word: መጽሐፈ
  choice: लिखना
  rationale: संज्ञा ‘लेखन/लिपि’ को ‘सीखा’ के साथ सहज हिंदी क्रियात्मक रूप में व्यक्त किया गया है।
- source_word: ብእሲ፡ ሐቃላዊ
  choice: मैदानों में रहनेवाला
  rationale: शाब्दिक ‘मैदान का मनुष्य’ का स्वाभाविक हिंदी रूप, बिना उसे किसान या किसी अन्य विशिष्ट पेशे के रूप में सीमित किए।
- source_word: ነዓዊ
  choice: शिकारी
  rationale: शिकार करनेवाले व्यक्ति का सीधा और प्रचलित हिंदी पद।
- source_word: ተምህረ፡ ፀብአ
  choice: युद्ध-कला सीखी
  rationale: युद्ध को केवल एक घटना नहीं, सीखी हुई युद्धविद्या या युद्ध-कौशल के रूप में व्यक्त करता है।
