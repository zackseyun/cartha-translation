translation:
  language: hi
  text: और वह रोएँदार था। याकूब तंबुओं में रहता था। और लड़के बड़े हुए, और याकूब ने लिखना सीखा; पर एसाव ने नहीं सीखा, क्योंकि वह मैदानों में रहनेवाला शिकारी था, और उसने युद्ध-कला सीखी।
