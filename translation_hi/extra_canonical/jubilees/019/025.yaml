  text: and Adam. And they shall be to establish heaven and to strengthen the earth and to renew all.
translation:
  language: hi
  text: और आदम। और वे आकाश को स्थापित करने, पृथ्वी को दृढ़ करने और सब कुछ नया करने के लिए होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሳርረ፡ ሰማይ
  choice: आकाश को स्थापित करने
  rationale: क्रिया-मूल s-r-r का भाव ‘स्थापित करना/नींव दृढ़ करना’ है; उद्देश्यसूचक ለ- को हिंदी में ‘करने के लिए’ से व्यक्त किया गया है।
- source_word: ወለአጽንዖ፡ ምድር
  choice: पृथ्वी को दृढ़ करने
  rationale: मूल पद पृथ्वी को मजबूत या दृढ़ करने का भाव देता है; समानांतर उद्देश्यसूचक रचना बनाए रखी गई है।
- source_word: ወለኀድሶ፡ ኵሉ
  choice: और सब कुछ नया करने
  rationale: ‘नवीकृत करना’ की अपेक्षा ‘नया करना’ सामान्य आधुनिक हिंदी में स्वाभाविक है और मूल के व्यापक ‘सब/सब कुछ’ को खुला रखता है।
- source_word: ይኩኑ
  choice: वे ... होंगे
  rationale: बहुवचन अस्तित्वसूचक/भविष्य रूप को सीधे रखा गया है; यद्यपि हिंदी में यह वाक्य कुछ असामान्य है, इससे स्रोत की कथन-रचना और उसका तनाव सुरक्षित रहता है।
theological_decisions:
- issue: ‘वे’ किसके लिए और किस प्रकार साधन होंगे
  choice: शाब्दिक रूप से ‘वे ... के लिए होंगे’ रखा गया
  alternative: ‘वे आकाश को स्थापित करेंगे...’ या ‘वे ... में सहायक होंगे’
  rationale: स्रोत में ‘होना’ और उद्देश्यसूचक infinitive हैं; उसे सीधे कर्तृवाचक कार्य या सहायक भूमिका में बदलना व्याख्यात्मक होता।
- issue: ‘सब’ का दायरा
  choice: ‘सब कुछ’
  alternative: ‘सारी सृष्टि’
  rationale: मूल ኵሉ व्यापक है, पर स्पष्ट रूप से ‘सृष्टि’ नहीं कहता; अतः उसके संदर्भगत और धर्मवैचारिक खुलेपन को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, स्रोत-सन्निकट अनुवाद। आरंभिक ‘और आदम।’ पिछले वाक्य से जुड़े स्रोत-खंड की अपूर्णता को बिना अनुमानित शब्द जोड़कर सुरक्षित रखता है।
