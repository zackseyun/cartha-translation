  text: और छठे सप्ताह के दूसरे वर्ष में रिबका ने इसहाक के दो पुत्रों, याकूब और एसाव, को जन्म दिया। याकूब चिकना और सीधा-सच्चा था, पर एसाव उग्र[a] और मैदानों में रहनेवाला मनुष्य था।
