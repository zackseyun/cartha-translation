lexical_decisions:
- source_word: ልሙጽ
  choice: चिकना
  rationale: मूल विशेषण का सीधा अर्थ ‘चिकना/रोमहीन’ है। ‘चिकना’ ने देह-संबंधी वर्णन को संक्षेप में बनाए रखा और उत्पत्ति की समानांतर कथा से अतिरिक्त शब्द नहीं जोड़े।
- source_word: ሬትዕ
  choice: सीधा-सच्चा
  rationale: यह शब्द सीधेपन और खराई का भाव देता है। आधुनिक हिन्दी में ‘सीधा-सच्चा’ स्वाभाविक है और केवल शारीरिक सीधेपन का भ्रम नहीं पैदा करता।
- source_word: ድሩክ
  choice: उग्र
  rationale: इसका अर्थ ‘उग्र, कठोर, प्रचंड’ के क्षेत्र में है; इसका अर्थ ‘रोमदार’ नहीं है। ‘उग्र’ व्यक्ति के स्वभाव का स्पष्ट और स्वाभाविक वर्णन है।
- source_word: ሐቃላዊ
  choice: मैदानों में रहनेवाला
  rationale: मूल संयुक्त रूप ‘मैदान/खुले प्रदेश का मनुष्य’ को व्यक्त करता है। यह हिन्दी में उसके खुले मैदानों से जुड़े जीवन का स्वाभाविक वर्णन करता है।
theological_decisions:
- issue: याकूब और एसाव के चरित्र-वर्णन को उत्पत्ति की समानांतर कथा से मिलाना
  choice: गीज़ पाठ के विशिष्ट शब्दों ‘चिकना और सीधा-सच्चा’ तथा ‘उग्र’ को बनाए रखा गया।
  alternative: एसाव को ‘रोमदार’ कहना या याकूब को ‘शांत’ कहना।
  rationale: समानांतर बाइबिलीय कथा से सामंजस्य बैठाने के बजाय उपलब्ध मूल पाठ का अनुवाद किया गया है; विशेषकर ድሩክ का अर्थ ‘रोमदार’ नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। कालगणना की जुबिली-पद्धति को ‘छठे सप्ताह के दूसरे वर्ष’ के रूप में औपचारिक रूप से सुरक्षित रखा गया है।
