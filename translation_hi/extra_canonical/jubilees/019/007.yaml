  yaml_path: translation/extra_canonical/jubilees/019/007.yaml
  text: 'And he bowed down to them again, and after this he buried his dead in the double cave. And all the days of Sarah’s life were one hundred and twenty-seven years: two jubilees and four weeks of years.'
translation:
  language: hi
  text: और उसने उनके सामने फिर से झुककर प्रणाम किया। इसके बाद उसने अपने मृतक को दोहरी गुफा में दफ़नाया। सारा के जीवन के कुल दिन एक सौ सत्ताईस वर्ष थे—दो जुबली और वर्षों के चार सप्ताह।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यदि एक जुबली 49 वर्ष और वर्षों का एक सप्ताह 7 वर्ष माना जाए, तो दो जुबली और चार सप्ताह कुल 126 वर्ष होते हैं; स्रोत फिर भी सारा की आयु 127 वर्ष बताता है।
    reason: स्रोत में उपस्थित वास्तविक संख्यात्मक तनाव को बिना सुधारे पाठक के सामने रखना।
lexical_decisions:
- source_word: ካዕበ
  choice: फिर से
  rationale: यह क्रिया की पुनरावृत्ति स्पष्ट करता है; स्रोत में ‘दूसरी बार/फिर’ का भाव उपस्थित है।
- source_word: ሰገደ
  choice: झुककर प्रणाम किया
  rationale: सिर्फ ‘झुका’ की अपेक्षा यह सम्मान प्रकट करने वाली शारीरिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ቤድኖ
  choice: अपनी मृत पत्नी को
  rationale: शाब्दिक अर्थ ‘अपने मृतक/मृत शरीर को’ है; प्रसंग में मृतका सारा है, इसलिए आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक रूप चुना गया।
- source_word: ባዓት ዘካዕበት
  choice: दोहरी गुफा
  rationale: स्रोत की ‘दोगुनी/दोहरी गुफा’ अभिव्यक्ति को संरक्षित करता है; इसे बिना आधार किसी विशेष स्थान-नाम में नहीं बदला गया।
- source_word: ክልኤ ኢዮቤልዉ ወአርባዕቱ ሱባዔ
  choice: दो जुबली और वर्षों के चार सप्ताह
  rationale: जुबली तथा सात-वर्षीय सप्ताहों में दी गई काल-गणना को स्रोत के अनुरूप बनाए रखता है।
theological_decisions:
- issue: सारा की आयु और उसके बाद दी गई जुबली-सप्ताह गणना में संख्यात्मक तनाव
  choice: मुख्य पाठ में दोनों कथनों को यथावत रखना और टिप्पणी में तनाव बताना
  alternative: गणना को 127 वर्ष के अनुरूप बनाने के लिए किसी संख्या में संशोधन करना
  rationale: स्रोत स्वयं 127 वर्ष तथा दो जुबली और चार सप्ताह देता है; अनुवाद को इस तनाव का मौन समाधान नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जुबली’ पारिभाषिक काल-इकाई के रूप में रखा गया है और ‘वर्षों के चार सप्ताह’ उसके सात-वर्षीय अर्थ को स्पष्ट करता है।
