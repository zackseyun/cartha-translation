- from: अर्थात् हेब्रोन को—चाँदी के चार सौ टुकड़ों में। उन्होंने उससे आग्रह करके कहा, “हम इसे तुम्हें बिना दाम दे देंगे,” पर उसने इसे उनके हाथ से बिना दाम नहीं लिया, क्योंकि उसने उस स्थान का पूरा दाम चाँदी में दिया।
  to: अर्थात्, हेब्रोन—चाँदी के चार सौ टुकड़ों के बदले। उन्होंने उससे आग्रह करके कहा, “हम इसे तुम्हें बिना दाम दे देंगे,” पर उसने इसे उनके हाथ से बिना दाम नहीं लिया, क्योंकि उसने उस स्थान के लिए चाँदी में पूरा दाम चुकाया।
  rationale: The revision corrects the Hindi syntax of the opening elliptical price clause and improves the payment idiom. It retains both occurrences of 'बिना दाम,' as required by the repeated Geʽez term and reflected in the English audit trail. No footnote is needed in the Hindi text because the adopted reading is translated directly and no unresolved ambiguity is introduced.
