  text: that is, Hebron—for four hundred pieces of silver. And they urged him, saying, “We will give it to you for nothing,” but he did not take it from their hands for nothing, because he gave the full price in silver for the place.
translation:
  language: hi
  text: अर्थात्, हेब्रोन—चाँदी के चार सौ टुकड़ों के बदले। उन्होंने उससे आग्रह करके कहा, “हम इसे तुम्हें बिना दाम दे देंगे,” पर उसने इसे उनके हाथ से बिना दाम नहीं लिया, क्योंकि उसने उस स्थान के लिए चाँदी में पूरा दाम चुकाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኬብሮን
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: በአርባዕቱ ምእት ብሩር
  choice: चाँदी के चार सौ टुकड़ों में
  rationale: मूल में संख्या और चाँदी स्पष्ट हैं, पर सिक्के की विशिष्ट इकाई नहीं दी गई; इसलिए अनावश्यक रूप से ‘शेकेल’ नहीं जोड़ा गया।
- source_word: በከ
  choice: बिना दाम
  rationale: यह शब्द दोनों स्थानों पर निःशुल्क दिए या लिए जाने का भाव रखता है; इसकी पुनरावृत्ति अनुवाद में भी सुरक्षित रखी गई।
- source_word: ሤጦ ... ብሩረ ፍጹመ
  choice: पूरा दाम चाँदी में दिया
  rationale: पूर्ण भुगतान का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया।
theological_decisions:
- issue: भूमि को उपहार के रूप में लेने से इनकार
  choice: ‘बिना दाम’ की दोनों आवृत्तियाँ रखी गईं
  alternative: दूसरी आवृत्ति हटाकर केवल ‘उसने उनके हाथ से नहीं लिया’
  rationale: गीज़ पाठ में በከ दो बार आता है; दोनों को रखना अब्राहम द्वारा पूरा मूल्य चुकाने पर दिए गए बल को सुरक्षित रखता है।
