lexical_decisions:
- source_word: ብርሃናት
  choice: ज्योतियाँ
  rationale: बहुवचन संज्ञा का अर्थ आकाशीय प्रकाशों या प्रकाशमान पिंडों से है; ‘ज्योतियाँ’ मूल की व्यापकता बनाए रखता है।
- source_word: ምጽናዓት
  choice: आकाशमण्डल
  rationale: यह उस विस्तृत आकाशीय संरचना को सूचित करता है जिसके ऊपर ज्योतियाँ कही गई हैं; ‘आकाशमण्डल’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी है।
- source_word: በቅድመ፡ አዕይንቲሃ
  choice: के सामने
  rationale: शाब्दिक अर्थ ‘उसकी आँखों के सामने’ है; प्रसंग में स्वाभाविक हिन्दी ‘के सामने’ वही प्रत्यक्ष उपस्थिति व्यक्त करती है।
- source_word: እሙ
  choice: उसकी माता
  rationale: यह याकूब से संबद्ध ‘उसकी माता’ है और रिबका के संबंध को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: आकाशीय ‘ज्योतियों’ की पहचान
  choice: ज्योतियाँ
  alternative: तारे / प्रकाशमान पिंड
  rationale: मूल पद किसी खास प्रकार के खगोलीय पिंड तक अर्थ को सीमित नहीं करता; इसलिए व्यापक शब्द रखा गया है।
- issue: आकाशमण्डल की ब्रह्माण्ड-रचना
  choice: मूल के स्थानिक कथन ‘ऊपर’ को बनाए रखा
  alternative: आकाश में
  rationale: ‘आकाश में’ कहने से मूल की ‘आकाशमण्डल के ऊपर’ वाली प्राचीन ब्रह्माण्डीय अभिव्यक्ति बदल जाती।
