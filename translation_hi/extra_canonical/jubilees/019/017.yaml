  text: than Esau. And he said to her, “My daughter, keep my son Jacob, for he will be in my place on the earth, and for a blessing in the midst of the sons of men, and for all the seed of Shem.”
translation:
  language: hi
  text: एसाव से अधिक। फिर उसने उससे कहा, “मेरी बेटी, मेरे पुत्र याकूब की रक्षा करना, क्योंकि वह पृथ्वी पर मेरा स्थान लेगा और मनुष्यों के बीच तथा शेम के सारे वंश के लिए आशीष होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቀቢ
  choice: रक्षा करना
  rationale: आज्ञार्थक क्रिया का अर्थ ‘रखना/सँभालना/सुरक्षित रखना’ है; प्रसंग में ‘रक्षा करना’ स्वाभाविक और स्पष्ट है।
- source_word: ህየንቴየ
  choice: मेरा स्थान लेगा
  rationale: शाब्दिक भाव ‘मेरे स्थान पर’ है; आधुनिक हिन्दी में उत्तराधिकार अथवा प्रतिनिधित्व का आशय स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ለበረከት
  choice: आशीष होगा
  rationale: स्रोत में ‘आशीष के लिए’ का प्रयोजनात्मक पद है; हिन्दी में विधेय रूप अर्थ और वाक्य-प्रवाह दोनों सुरक्षित रखता है।
- source_word: ውሉደ፡ ሰብእ
  choice: मनुष्यों के बीच
  rationale: शाब्दिक ‘मनुष्यों की सन्तानों के बीच’ एक सामी मुहावरा है; यहाँ सामान्य मानव समुदाय अभिप्रेत है।
- source_word: ለኵሉ፡ ዘርኡ ሴም
  choice: शेम के सारे वंश के लिए
  rationale: स्रोत में ‘शेम के समस्त बीज/वंश के लिए’ है; ‘वंश’ आधुनिक हिन्दी में सामूहिक वंशजों को स्पष्ट करता है।
theological_decisions:
- issue: याकूब का अब्राहम का स्थान लेना
  choice: मेरा स्थान लेगा
  alternative: मेरे बदले होगा
  rationale: स्रोत के स्थानापन्न भाव को बनाए रखा गया है, पर यह नहीं बताया गया कि वह भूमिका उत्तराधिकार, प्रतिनिधित्व या किसी अन्य विशिष्ट धार्मिक अर्थ में है।
- issue: शेम के वंश के लिए याकूब की भूमिका
  choice: आशीष होगा
  alternative: महिमा होगा
  rationale: गीज़ स्रोत में ‘आशीष’ उपस्थित है, जबकि अंतिम पद में ‘महिमा’ के लिए कोई शब्द नहीं है; इसलिए बाद की या पूर्व अंग्रेज़ी परंपरा से ‘महिमा’ नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरम्भिक “एसाव से अधिक” पिछले पद से जुड़ा हुआ तुलनात्मक खंड है, इसलिए उसकी खंडात्मकता स्रोत के अनुरूप सुरक्षित रखी गई है।
