lexical_decisions:
- source_word: መዋዕለ፡ ሕይወታ
  choice: जीवन के दिन
  rationale: गीज़ पदबंध का निकट और स्वाभाविक हिन्दी रूप; सारा की जीवन-अवधि का संकेत सुरक्षित रखता है।
- source_word: ዝመከራ፡ ዓሥር
  choice: दसवीं परीक्षा
  rationale: पाठ में स्त्रीलिंग क्रमवाचक के साथ ‘परीक्षा/आजमाइश’ का भाव है; आधुनिक हिन्दी में ‘परीक्षा’ स्पष्ट और गरिमापूर्ण है।
- source_word: በዘተመከረ
  choice: जिसके द्वारा अब्राहम परखा गया
  rationale: निष्क्रिय क्रिया और साधनसूचक संबंध को सुरक्षित रखता है; ‘अब्राहम’ अंग्रेज़ी परामर्श-पाठ और प्रसंग से स्पष्ट किया गया है।
theological_decisions:
- issue: अब्राहम की परीक्षा की गणना
  choice: ‘दसवीं परीक्षा’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे अंतिम या सर्वोच्च परीक्षा कहना
  rationale: मूल केवल क्रम-संख्या बताता है; धार्मिक परंपरा से अतिरिक्त मूल्यांकन जोड़ना उचित नहीं।
