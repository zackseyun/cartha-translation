base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/009.yaml
  text: In this, Abraham was found faithful, patient in spirit. And he did not speak a word concerning the promise of the land, which the LORD had said he would give to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and he was recorded as a friend of the LORD on the heavenly tablets.
translation:
  language: hi
  text: इसमें अब्राहम विश्वासयोग्य और आत्मा में धैर्यवान पाया गया।[a] उसने उस देश की प्रतिज्ञा के विषय में एक शब्द भी नहीं कहा, जिसे यहोवा ने कहा था कि वह उसे और उसके बाद उसके वंश को देगा; फिर भी उसने वहीं अपने मृतक को दफ़नाने के लिए एक स्थान माँगा। वह विश्वासयोग्य पाया गया था; इसलिए स्वर्गीय पट्टिकाओं पर उसे यहोवा के मित्र के रूप में दर्ज किया गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अब्राहम विश्वासयोग्य पाया गया।”
    reason: आरंभिक ቦቱ को पिछले प्रसंग से जोड़कर पढ़ने या वाक्य-संयोजन का भाग मानने की वैकल्पिक संभावना को सुरक्षित रखता है।
  - marker: b
    text: या, “और उसके लिए यह लिख दिया गया कि वह मित्र है।”
    reason: अभिलेखन वाले अंतिम वाक्यांश की पूर्व प्रचलित वैकल्पिक संरचना को पूर्ण और स्पष्ट हिंदी में दर्ज करता है।
lexical_decisions:
- source_word: ቦቱ
  choice: इस बात में
  rationale: यह पद पिछले प्रसंग की परीक्षा की ओर संकेत करता है; इसलिए आरंभिक संदर्भसूचक पद को स्पष्ट रूप से रखा गया है।
- source_word: ምእመነ
  choice: विश्वासयोग्य
  rationale: यहाँ अर्थ केवल विश्वास रखने वाला नहीं, बल्कि परीक्षा में निष्ठावान सिद्ध होना है।
- source_word: ዕጉሠ፡ መንፈስ
  choice: आत्मा में धीरजवान
  rationale: मूल की आत्मिक मनोदशा और सहनशीलता दोनों को बनाए रखने वाला औपचारिक किंतु स्वाभाविक रूप।
- source_word: ንባብ፡ ዘበምድር
  choice: देश की प्रतिज्ञा
  rationale: संदर्भ में यह उस दैवी वचन को सूचित करता है जिसमें देश देने की बात कही गई है; 'प्रतिज्ञा' हिंदी में आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ዘርኡ
  choice: उसके वंश
  rationale: सामूहिक उत्तराधिकारियों के अर्थ में प्रयुक्त 'बीज' का स्वाभाविक आधुनिक हिंदी समतुल्य।
- source_word: ቤድኖ
  choice: अपने मृतक
  rationale: मूल के संबंधसूचक और मृत्यु-संदर्भ को बनाए रखा गया है, बिना संदर्भ से सारा का नाम जोड़ने के।
- source_word: ተጽሕፈ
  choice: दर्ज किया गया
  rationale: पुल्लिंग एकवचन निष्क्रिय क्रिया अब्राहम को कर्ता-विषय मानती है; इसलिए 'उसे ... दर्ज किया गया' व्याकरण और अभिप्राय दोनों व्यक्त करता है।
- source_word: ዐርከ
  choice: मित्र
  rationale: मूल का सीधा और प्रचलित हिंदी समतुल्य।
theological_decisions:
- issue: भूमि संबंधी वचन का स्वरूप
  choice: देश की प्रतिज्ञा
  alternative: देश के विषय में कथन
  rationale: तत्काल अगला उपवाक्य यहोवा के देने के वचन को स्पष्ट करता है; 'प्रतिज्ञा' इसी संबंध को व्यक्त करती है, कोई अतिरिक्त संप्रदायगत अर्थ नहीं जोड़ती।
- issue: अब्राहम का मित्र के रूप में अभिलेखन
  choice: उसे यहोवा के मित्र के रूप में दर्ज किया गया
  alternative: उसके लिए मित्र के रूप में लिखा गया
  rationale: मूल क्रिया के पुल्लिंग एकवचन रूप और संशोधित परामर्श-पाठ के अनुसार अब्राहम स्वयं अभिलेखित व्यक्ति है; वैकल्पिक संरचना की अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: स्वर्गीय पट्टिकाएँ
  choice: स्वर्गीय पट्टिकाओं पर
  alternative: स्वर्ग की पट्टिकाओं पर
  rationale: यह ग्रंथ का विशिष्ट अभिलेख-संबंधी पद है; 'स्वर्गीय पट्टिकाएँ' अर्थ को संक्षिप्त और गरिमापूर्ण ढंग से रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और पाठयोग्य शैली अपनाई गई है। 'यहोवा', 'विश्वासयोग्य', 'वंश' और 'स्वर्गीय पट्टिकाएँ' जैसे पद स्रोत की धार्मिक एवं साहित्यिक बनावट बनाए रखते हैं। स्रोत-पंक्ति के अंत में उपलब्ध पाठ संक्षिप्त प्रतीत होता है; स्वर्गीय पट्टिकाओं और यहोवा के मित्र वाला पूर्ण आशय प्रमाणित परामर्श-पाठ के सहारे रखा गया है।
