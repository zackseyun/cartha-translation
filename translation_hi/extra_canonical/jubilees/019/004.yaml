  text: And he was patient in spirit[4], and he spoke with the sons of Heth.
translation:
  language: hi
  text: और उसने मन में धीरज रखा[a] और हेत के पुत्रों से बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आत्मा में धीरज रखा।”
    reason: मूल पदबंध की संरचना और ‘मन/आत्मा’ की अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ትዕግሥተ፡ መንፈስ
  choice: मन में धीरज रखा
  rationale: इस पदबंध का शाब्दिक अर्थ ‘आत्मा/मन का धीरज’ है। सहज आधुनिक हिन्दी में ‘मन में धीरज रखा’ व्यक्ति के भीतरी संयम और सहनशीलता—दोनों को व्यक्त करता है।
- source_word: sons of Heth (English consultation layer; underlying ethnic designation)
  choice: हेत के पुत्रों
  rationale: वंशगत समूह के पारंपरिक रूप को सुरक्षित रखा गया है; इसे केवल ‘हित्ती लोगों’ कहने से मूल की ‘पुत्रों’ वाली अभिव्यक्ति लुप्त हो जाती।
theological_decisions:
- issue: ‘spirit’ को ‘आत्मा’ या ‘मन’ के रूप में व्यक्त करना
  choice: मन में
  alternative: आत्मा में
  rationale: यहाँ अभिप्राय अब्राहम की आंतरिक मनोदशा और धैर्य से है, न कि पवित्र आत्मा या मनुष्य की आत्मा के विषय में कोई तकनीकी धर्मवैज्ञानिक कथन। ‘मन में’ हिन्दी में स्वाभाविक है और अनावश्यक धर्मवैज्ञानिक अर्थारोपण से बचता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य में मूल के समन्वयी ढाँचे को रखा गया है और ‘हेत के पुत्रों’ द्वारा प्राचीन वंशगत संबोधन सुरक्षित है। अंग्रेज़ी परामर्श-पाठ की टिप्पणी भूमि के समाचार और पद 9 से संबंधित है, इसलिए इस पद से असंबद्ध होने के कारण उसे नहीं अपनाया गया।
