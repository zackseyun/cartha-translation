  text: For a blessing on the earth from now and throughout all the generations of the earth. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all of them.
translation:
  language: hi
  text: वह अब से लेकर पृथ्वी की सारी पीढ़ियों तक पृथ्वी पर आशीष हो। तेरे हाथ दृढ़ हों, और तेरा हृदय तेरे पुत्र याकूब के कारण आनन्दित हो, क्योंकि मैंने उसी से उन सब से कहीं बढ़कर प्रेम किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበረከት፡ ዲበ፡ ምድር
  choice: पृथ्वी पर आशीष का कारण
  rationale: लामेड-सदृश उद्देश्य/परिणामसूचक रचना और ‘पृथ्वी पर आशीष’ के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; आरम्भिक खंड पिछले संदर्भ से जुड़ा प्रतीत होता है, इसलिए ‘कि वह’ जोड़ा गया है।
- source_word: እምይእዜ፡ ወእስከ፡ ኵሉ፡ ትውልደ፡ ምድር
  choice: अब से और पृथ्वी की सभी पीढ़ियों तक
  rationale: कालगत विस्तार ‘अब से’ और ‘सभी पीढ़ियों तक’ को बनाए रखता है तथा ‘पृथ्वी’ की पुनरावृत्ति को भी सुरक्षित रखता है।
- source_word: ይጽንዓ፡ እደዊኪ
  choice: तेरे हाथ दृढ़ हों
  rationale: क्रिया के बलवान/दृढ़ होने के मूल अर्थ और आशीर्वचनात्मक विधिलिंग को निकटता से रखता है।
- source_word: ትትፈሣሕ፡ ልብኪ
  choice: तेरा हृदय ... आनन्दित हो
  rationale: हृदय के हर्षित होने की मूल अभिव्यक्ति को औपचारिक किंतु सहज हिन्दी में सुरक्षित रखता है।
- source_word: ኪያሁ፡ አፍቀርኩ፡ ፈድፋደ፡ እምኵሎሙ
  choice: मैंने उन सब से कहीं बढ़कर उसी से प्रेम किया है
  rationale: बलसूचक स्वतंत्र सर्वनाम को ‘उसी’ और तीव्र तुलनात्मक भाव को ‘कहीं बढ़कर’ से व्यक्त करता है; अंतिम बहुवचन तुलना ‘उन सब’ स्पष्ट रखी गई है।
theological_decisions:
- issue: याकूब के प्रति विशेष प्रेम
  choice: मैंने उन सब से कहीं बढ़कर उसी से प्रेम किया है
  alternative: मैंने उसे उन सब से अधिक चाहा है
  rationale: पाठ के स्पष्ट तुलनात्मक और चयनात्मक प्रेम को बिना नरम किए रखा गया है; ‘प्रेम’ मूल क्रिया का उपयुक्त सामान्य धार्मिक-अधार्मिक अर्थ देता है।
- issue: आरम्भिक अपूर्ण उद्देश्यसूचक खंड
  choice: कि वह ... आशीष का कारण हो
  alternative: पृथ्वी पर आशीष के लिए
  rationale: पद का आरम्भ पिछले वाक्य पर निर्भर दिखता है। हिन्दी में अर्थपूर्ण वाक्य बनाने के लिए न्यूनतम पूर्ति की गई है, पर किसी विशिष्ट कर्ता की पहचान नाम लेकर निर्धारित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट/पारंपरिक संबोधन ‘तेरा/तेरे’ के साथ; भाषा गरिमामय पर सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आनन्दित’ और ‘दृढ़’ शास्त्रीय गरिमा बनाए रखते हुए आज भी बोधगम्य हैं।
