  yaml_path: translation/extra_canonical/jubilees/019/027.yaml
  text: and he kissed him and blessed him and said, “Jacob, my beloved son, whom my soul loves, may God from above the firmament bless you and give you all the blessings with which he blessed Adam and Enoch and Noah and Shem; and whatever he has spoken to me and whatever he said he would give me, may it rest upon you and upon your seed forever, according to the days of heaven above the earth. And may the spirits of Mastema not come upon you or upon your seed, to turn you away from following the LORD, who is your God from now and forever. And may the Lord God be a father to you, and you be his firstborn son, and to the people always. Go, my son, in peace.” And the two of them went out together from Abraham. And Rebekah loved Jacob with all her heart and with all her soul, much more than Esau, but Isaac loved Esau much more than Jacob.
translation:
  language: hi
  text: और उसने उसे चूमा और आशीर्वाद देकर कहा, “हे मेरे प्रिय पुत्र याकूब, जिससे मेरा प्राण प्रेम करता है, आकाश-मंडल के ऊपर से परमेश्वर[b] तुम्हें आशीष दे और तुम्हें वे सभी आशीषें प्रदान करे जिन आशीषों से उसने आदम, हनोक, नूह और शेम[a] को आशीष दी थी। उसने मुझसे जो कुछ कहा है और जो कुछ उसने कहा कि वह मुझे देगा, वह सब तुम्हारे और तुम्हारे वंश के ऊपर सदा के लिए ठहरा रहे—जब तक पृथ्वी के ऊपर आकाश बना रहे। मस्तेमा की आत्माएँ तुम पर या तुम्हारे वंश पर न आएँ, ताकि वे तुम्हें प्रभु के, जो तुम्हारे परमेश्वर हैं, पीछे चलने से दूर न करें[d], अब से लेकर सदा तक। प्रभु परमेश्वर तुम्हारे पिता हों[c], और तुम उनके पहलौठे पुत्र रहो—और सदा सब लोगों के लिए भी। हे मेरे पुत्र, शान्ति से जाओ।” तब वे दोनों अब्राहम के पास से साथ-साथ बाहर निकले। रिबका याकूब से अपने सारे मन और सारे प्राण से प्रेम करती थी—एसाव से कहीं अधिक; पर इसहाक एसाव से याकूब की अपेक्षा कहीं अधिक प्रेम करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आदम, हनोक और नूह को आशीष दी थी; और उसने मुझसे जो कुछ...”
    reason: यहाँ एक वैकल्पिक पाठ/वाक्य-विभाजन में शेम का नाम नहीं आता।
  - marker: b
    text: या, “परमप्रधान परमेश्वर।”
    reason: मूल के ब्रह्माण्ड-संबंधी वाक्यांश का प्रचलित भावानुवाद।
  - marker: c
    text: या, “प्रभु तुम्हारे पिता हों।”
    reason: संक्षिप्त पूर्ववर्ती अनुवाद-विकल्प, यद्यपि मूल में ‘परमेश्वर’ भी उपस्थित है।
  - marker: d
    text: या, “तुम्हें प्रभु से दूर न करें।”
    reason: मूल के ‘प्रभु के पीछे से’ रूपक का अधिक संक्षिप्त भावानुवाद।
lexical_decisions:
- source_word: አምላክ፡ እመልዕልተ፡ ምጽናዓት
  choice: आकाश-मंडल के ऊपर से परमेश्वर
  rationale: मूल के विशिष्ट ब्रह्माण्ड-वर्णन, अर्थात् ‘आकाश-मंडल के ऊपर से परमेश्वर’, को सुरक्षित रखा गया है; इसे केवल ‘परमप्रधान परमेश्वर’ बनाकर सामान्यीकृत नहीं किया गया।
- source_word: መናፍስተ፡ መስቴማ
  choice: मस्तेमा की आत्माएँ
  rationale: व्यक्तिवाचक नाम मस्तेमा का लिप्यंतरण किया गया और बहुवचन ‘आत्माएँ’ बनाए रखा गया।
- source_word: እምድኅረ፡ እግዚአብሔር
  choice: प्रभु के पीछे चलने से दूर
  rationale: मूल का स्थानिक रूपक ‘प्रभु के पीछे/पीछे चलना’ सुरक्षित रखा गया, जो निष्ठापूर्वक अनुसरण करने का भाव देता है।
- source_word: ያጥጋእ፡ ላዕሌከ
  choice: तुम्हारे ... ऊपर ... ठहरा रहे
  rationale: आशीष के किसी पर टिकने या ठहरने की मूल छवि को स्वाभाविक हिन्दी में बनाए रखा गया।
- source_word: በከመ፡ መዋዕለ፡ ሰማይ፡ ዲበ፡ ምድር
  choice: जब तक पृथ्वी के ऊपर आकाश बना रहे
  rationale: शाब्दिक ‘पृथ्वी के ऊपर आकाश के दिनों के अनुसार’ का दीर्घकालिक अर्थ आधुनिक हिन्दी में स्पष्ट किया गया, बिना ‘सदा’ की समानांतर धारणा खोए।
theological_decisions:
- issue: ईश्वर के नाम/उपाधि का रूप
  choice: प्रभु परमेश्वर
  alternative: केवल ‘प्रभु’
  rationale: मूल में እግዚአብሔር፡ አምላከ दोनों पद हैं, इसलिए दोनों को रखा गया।
- issue: प्रभु से विमुख करने का स्वरूप
  choice: प्रभु के पीछे चलने से दूर करना
  alternative: प्रभु से दूर करना
  rationale: मूल का अनुसरण-संबंधी रूपक बनाए रखने से निष्ठा और दिशा—दोनों अर्थ खुले रहते हैं।
- issue: ‘लोगों के लिए’ वाले अपूर्ण/तनावपूर्ण वाक्यांश का अर्थ
  choice: तुम उनके पहलौठे पुत्र और सदा लोगों के लिए बने रहो
  alternative: तुम उनके पहलौठे पुत्र और सदा लोगों के पिता बने रहो
  rationale: मूल वाक्यांश में ‘लोगों के लिए’ के साथ अपेक्षित संज्ञा स्पष्ट नहीं है। ‘पिता’ जोड़ने से पाठ की अस्पष्टता अनावश्यक रूप से समाप्त हो जाती; इसलिए वाक्य को यथासंभव खुला रखा गया।
- issue: शेम का उल्लेख
  choice: मुख्य पाठ में शेम
  alternative: शेम के बिना पाठ
  rationale: प्रस्तुत गीइज़ पाठ में शेम का नाम पढ़ा जाता है, पर पूर्ववर्ती पाठ-परंपरा में इसके बिना विभाजन/पाठ का विकल्प दर्ज है; इसलिए मुख्य पाठ में नाम रखा और विकल्प पादटिप्पणी में दिया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। आशीर्वाद की काव्यात्मक पुनरावृत्ति और प्राचीन ब्रह्माण्ड-वर्णन बनाए रखे गए हैं। ‘शान्ति’, ‘आकाश-मंडल’, ‘पहलौठा’ और ‘वंश’ जैसे परिचित बाइबिलीय शब्द प्रसंगानुकूल रखे गए, पर वाक्य-विन्यास को अनावश्यक रूप से पुरातन नहीं बनाया गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
