  text: 'for Hagar had died before Sarah. And she bore him six sons: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah, in two weeks of years.'
translation:
  language: hi
  text: 'क्योंकि हाजिरा की मृत्यु सारा से पहले हो चुकी थी। और केतूरा ने उसके लिए छह पुत्रों को जन्म दिया: जिम्रान, योक्षान, मदान, मिद्यान, यिशबाक और शूह—वर्षों के दो सप्ताहों में।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात दो सात-वर्षीय अवधियों में, कुल चौदह वर्षों में।
    reason: ‘वर्षों के दो सप्ताह’ जुबलीज़ की विशिष्ट कालगणना को बनाए रखता है; टिप्पणी उसका संख्यात्मक अर्थ स्पष्ट करती है।
lexical_decisions:
- source_word: አጋር
  choice: हाजिरा
  rationale: यह अब्राहम की पत्नी हागर का प्रचलित हिन्दी बाइबलीय नाम है।
- source_word: ውሉደ፡ ስድስተ
  choice: छह पुत्रों
  rationale: गीज़ पदबंध का अर्थ छह नर-संतान/पुत्र है; प्रसंग में सूचीबद्ध सभी नाम पुत्रों के हैं।
- source_word: ዝንበርሃ፡ ወያክስንሃ፡ ወማዳይሃ፡ ወማዳንሃ፡ ወኢየዘቦቅሃ፡ ወሱሂያሃ
  choice: जिम्रान, योक्षान, मदान, मिद्यान, यिशबाक और शूह
  rationale: व्यक्तिनामों को उनके प्रचलित हिन्दी बाइबलीय रूपों के निकट रखा गया है, जो उत्पत्ति 25:2 की समान सूची से भी पहचाने जाते हैं।
- source_word: በክልኤ፡ ሱባዔ፡ ዓመት
  choice: वर्षों के दो सप्ताहों के दौरान
  rationale: शाब्दिक काल-इकाई ‘दो सप्ताह-वर्ष’ अर्थात दो सात-वर्षीय अवधियाँ है; जुबलीज़ की कालगणना को बनाए रखने के लिए इसे सामान्य ‘चौदह वर्ष’ से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ‘उसने उसके लिए’ में स्त्री और पुरुष सर्वनामों का संदर्भ
  choice: ‘उसने उसके लिए छह पुत्रों को जन्म दिया’
  alternative: ‘उस स्त्री ने अब्राहम के लिए छह पुत्रों को जन्म दिया’
  rationale: मूल के सर्वनामात्मक ढाँचे को बनाए रखा गया है और बिना आधार स्त्री की पहचान स्पष्ट नहीं की गई; निकटवर्ती प्रसंग से संदर्भ समझा जा सकता है।
- issue: दो सप्ताह-वर्षों की अवधि
  choice: विशिष्ट कालगणनात्मक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखना
  alternative: ‘चौदह वर्षों में’
  rationale: जुबलीज़ की धार्मिक-कालगणनात्मक शैली अर्थपूर्ण है; केवल कुल वर्षों में बदलने से उसका साहित्यिक ढाँचा मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। वाक्य-संबंध के लिए ‘क्योंकि’ रखा गया है। व्यक्तिनाम प्रचलित हिन्दी बाइबलीय वर्तनी के अनुसार हैं।
