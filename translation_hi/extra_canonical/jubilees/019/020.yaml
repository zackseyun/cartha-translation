  yaml_path: translation/extra_canonical/jubilees/019/020.yaml
  text: He loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.
translation:
  language: hi
  text: वह एसाव से, याकूब से अधिक प्रेम करता है[a], पर मैं याकूब के प्रति तुम्हारा धार्मिक स्नेह देखता हूँ। तुम आगे भी उस पर कृपा करती रहना और प्रेम से अपनी दृष्टि उस पर बनाए रखना, क्योंकि अब से लेकर धरती की सभी पीढ़ियों तक वह धरती पर एक आशीष होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वह एसाव से प्रेम करता है।’
    reason: गीज़ पाठ की आलोचनात्मक/पूर्ववर्ती वैकल्पिक व्याख्या में याकूब के साथ तुलना को छोड़ा जा सकता है।
lexical_decisions:
- source_word: ያፈቅሮ፡ ለዔሳው፡ እም፡ ያዕቆብ
  choice: वह याकूब से बढ़कर एसाव से प्रेम करता है
  rationale: गीज़ क्रिया में निहित तृतीय पुरुष पुल्लिंग कर्ता को हिन्दी में स्पष्ट किया गया है; እም को तुलनात्मक अर्थ में लेकर ‘से बढ़कर’ कहा गया है।
- source_word: መፍቀሪተ፡ ጽድቅ
  choice: धर्ममय प्रेम
  rationale: ‘प्रेम/स्नेह’ और ‘धार्मिकता/न्यायोचितता’ दोनों अर्थ-तत्त्वों को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: አሡንዮ፡ ላዕሌሁ
  choice: उस पर कृपा करती रहना
  rationale: स्त्रीलिंग संबोधन और निरंतर दयालु व्यवहार के आग्रह को स्पष्ट करता है।
- source_word: ወይኩና፡ አዕይንትኪ፡ ላዕሌሁ፡ ለፍቅር
  choice: प्रेम से अपनी आँखें उस पर लगाए रखना
  rationale: आँखें उस पर होने की मूल छवि को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: ይከውን
  choice: वह … होगा
  rationale: भविष्यसूचक कथन को बिना अतिरिक्त कारणात्मक या मसीही व्याख्या जोड़े सीधा रखा गया है।
theological_decisions:
- issue: याकूब के भविष्य की आशीष का स्वरूप
  choice: धरती पर एक आशीष होगा
  alternative: धरती के लिए आशीष का कारण होगा
  rationale: मूल के संक्षिप्त भविष्यसूचक रूप और उसकी खुली हुई धर्मवैचारिक व्यापकता को बनाए रखने के लिए व्याख्यात्मक विस्तार से बचा गया है।
- issue: ‘धर्ममय प्रेम’ का आशय
  choice: नैतिक/धार्मिक विशेषण को प्रेम के साथ बनाए रखा
  alternative: याकूब के प्रति तुम्हारा उचित पक्षपात
  rationale: पक्षपात जैसी नकारात्मक या संप्रदायगत व्याख्या आरोपित किए बिना प्रेम और धार्मिकता के बीच मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; रिबका को संबोधित स्त्रीलिंग क्रियाएँ रखी गई हैं। शैली गरिमामय किंतु सामान्य पाठक के लिए सहज है, और ‘आँखें उस पर लगाए रखना’ जैसी मूल रूपकात्मक भाषा सुरक्षित रखी गई है।
