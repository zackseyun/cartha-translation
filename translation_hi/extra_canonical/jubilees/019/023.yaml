  yaml_path: translation/extra_canonical/jubilees/019/023.yaml
  text: If a man can count the sand of the earth, then his seed also will be counted. And all the blessings with which he blessed me
translation:
  language: hi
  text: यदि कोई मनुष्य पृथ्वी की रेत को गिन सके, तो उसका वंश भी गिना जा सकेगा। और वे सभी आशीषें, जिनसे उसने मुझे आशीष दी थी[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्रसंगानुसार, “यहोवा ने मुझे आशीष दी थी”; मूल पाठ में कर्ता केवल “उसने” है।
    reason: मूल Ge'ez में आशीष देने वाले का नाम स्पष्ट नहीं है; पूर्ववर्ती व्याख्यात्मक पाठांतर को बिना मुख्य पाठ में आरोपित किए दर्ज करना।
lexical_decisions:
- source_word: ኈልቆ፡ ኖላ፡ ምድር
  choice: पृथ्वी की रेत को गिन सके
  rationale: पाठ में पृथ्वी की रेत की गणना की असंभवता के द्वारा वंश की अगणनीयता व्यक्त की गई है; हिन्दी में यह स्वाभाविक और स्रोत-संगत है।
- source_word: ዘርኡሂ
  choice: उसका वंश भी
  rationale: ዘር का अर्थ प्रसंग में बीज से आगे बढ़कर संतान/वंश है; प्रत्यय तीसरे पुरुष एकवचन का है और ሂ ‘भी’ का भाव देता है।
- source_word: ይትኌለቍ
  choice: गिना जा सकेगा
  rationale: Ge'ez रूप निष्क्रिय/मध्य अर्थ ‘गिना जाएगा’ देता है; शर्तीय हिन्दी वाक्य में ‘गिना जा सकेगा’ तुलनात्मक असंभवता को स्पष्ट और स्वाभाविक रखता है।
- source_word: በረከት
  choice: आशीषें
  rationale: धार्मिक प्रसंग में ‘आशीष’ आधुनिक मानक हिन्दी का परिचित और गरिमापूर्ण समतुल्य है।
- source_word: ባረከኒ
  choice: उसने मुझे आशीष दी थी
  rationale: क्रिया में स्पष्ट संज्ञात्मक कर्ता नहीं है; इसलिए ‘यहोवा’ जोड़ने के बजाय स्रोत का तीसरे पुरुष कर्ता सुरक्षित रखा गया है।
theological_decisions:
- issue: आशीष देने वाले की पहचान
  choice: उसने मुझे आशीष दी थी
  alternative: यहोवा ने मुझे आशीष दी थी
  rationale: स्रोत-पाठ ባረከኒ में ‘उसने मुझे आशीष दी’ है; ‘यहोवा’ को स्पष्ट कर्ता बनाना पाठ में अनुपस्थित पहचान जोड़ देगा।
- issue: खंडित पद का वाक्यांत
  choice: अंत में दीर्घ विराम-चिह्न, क्योंकि विचार आगे जारी है
  alternative: पूर्ण विराम लगाकर स्वतंत्र वाक्य बनाना
  rationale: प्रदत्त स्रोत ‘और वे सभी आशीषें…’ पर अपूर्ण है; विचार को कृत्रिम रूप से पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘रेत’, ‘वंश’ और ‘आशीष’ जैसे सामान्य शब्द रखे गए हैं। स्रोत का अंतिम वाक्यांश अपूर्ण होने के कारण हिन्दी में भी उसकी निरंतरता सुरक्षित रखी गई है।
