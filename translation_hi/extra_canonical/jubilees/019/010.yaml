- source_word: ወለተ፡ ባቱኤል ... እኅተ፡ ላባ
  choice: बतूएल की बेटी और लाबान की बहन
  rationale: मूल में दिए गए दोनों पारिवारिक संबंध स्पष्ट रूप से सुरक्षित रखे गए हैं।
- source_word: ወወለተ፡ ለባቱኤል
  choice: हाँ, वह बतूएल की बेटी थी
  rationale: मूल की पुनरुक्त वंशावली-सूचना को हटाने के बजाय हिन्दी में बलसूचक ढंग से बनाए रखा गया है।
- source_word: ወባቱኤል፡ ወልደ፡ ሜልካ
  choice: और बतूएल ... मिल्का का पुत्र था
  rationale: मूल बतूएल को मिल्का का पुत्र बताता है; इसे अधिक परिचित वंशावली के अनुसार बदलकर ‘पोता’ या अन्य संबंध नहीं किया गया।
