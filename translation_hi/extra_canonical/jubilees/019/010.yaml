  choice: उसने अपने पुत्र इसहाक के लिए एक पत्नी ली
  rationale: ‘लेना’ और ‘के लिए’ दोनों को रखते हुए मूल की विवाह-संबंधी अभिव्यक्ति का सीधा, स्वाभाविक हिन्दी रूप दिया गया है।
