  text: And in the fourth year of it he took a wife for Isaac his son, and her name was Rebekah, daughter of Bethuel, the son of Nahor, Abraham’s brother, the sister of Laban, and the daughter of Bethuel; and Bethuel was the son of Milcah, the wife of Nahor, Abraham’s brother.
translation:
  language: hi
  text: और उसके चौथे वर्ष में उसने अपने पुत्र इसहाक के लिए एक पत्नी ली। उसका नाम रिबका था। वह अब्राहम के भाई नाहोर के पुत्र बतूएल की बेटी और लाबान की बहन थी; और वह बतूएल की बेटी थी। और बतूएल, अब्राहम के भाई नाहोर की पत्नी मिल्का का पुत्र था।
  philosophy: optimal-equivalence
