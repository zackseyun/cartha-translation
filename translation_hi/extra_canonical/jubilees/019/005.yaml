  yaml_path: translation/extra_canonical/jubilees/019/005.yaml
  text: He spoke with the sons of Heth so that they might give him a place in which to bury his dead. And the LORD gave him favor before all who saw him[5], and he entreated courteously of the sons of Heth, and they gave him the land of the double cave, which is opposite Mamre—
translation:
  language: hi
  text: उसने हेत के पुत्रों से बात की कि वे उसे अपने मृतक को दफ़नाने के लिए एक स्थान दें। और प्रभु ने उसे देखने वाले सब लोगों की दृष्टि में उसे कृपा दी। उसने हेत के पुत्रों से नम्रतापूर्वक विनती की, और उन्होंने उसे उस दोहरी गुफा की भूमि दे दी जो मम्रे के सामने है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ኬጥ
  choice: हेत के पुत्र
  rationale: शाब्दिक रूप से ‘हेत की संतान/पुत्र’; यह उत्पत्ति की इसी भूमि-क्रय परंपरा से जुड़ा पारंपरिक जातिनाम बनाए रखता है।
- source_word: ቤድኖ
  choice: अपनी मृत देह
  rationale: संज्ञा का अर्थ मृत शरीर है; केवल ‘अपने मृतक’ की अपेक्षा यह स्रोत के शारीरिक संकेत को अधिक स्पष्टता से रखता है।
- source_word: ሞገሰ
  choice: कृपा
  rationale: यह अनुग्रह अथवा अनुकूल स्वीकृति का भाव देता है; ‘कृपा’ इस प्रसंग में स्वाभाविक और धर्मवैज्ञानिक रूप से अनावश्यक रूप से संकीर्ण नहीं है।
- source_word: በየውሀት
  choice: नम्रतापूर्वक
  rationale: मूल में कोमलता, विनम्रता या सौम्यता का भाव है; निवेदन के ढंग को वर्तमान हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ምድረ፡ ባዓት፡ ዘካዕበት
  choice: उस दोहरी गुफा की भूमि
  rationale: स्रोत में भूमि, गुफा और ‘दोहरी’ का वर्णन है; अस्पष्ट स्थाननाम मान लेने के बजाय मूल का वर्णनात्मक रूप सुरक्षित रखा गया है।
- source_word: ዘአንጻረ፡ መምብሬም
  choice: जो मम्रे के सामने है
  rationale: स्थान-संबंधी वाक्यांश को सीधे रखा गया है; ‘सामने’ में ‘विपरीत दिशा में/के निकट सामने’ की मूल स्थानिक व्यापकता बनी रहती है।
theological_decisions:
- issue: प्रभु द्वारा लोगों की दृष्टि में कृपा दिया जाना
  choice: ‘प्रभु ने ... उस पर कृपा की’
  alternative: ‘प्रभु ने उसे ... अनुग्रह दिलाया’
  rationale: मूल की क्रिया ‘उसे कृपा दी’ के निकट रहते हुए हिन्दी में सहज वाक्य बनाया गया है; इससे ईश्वरीय कृपा और मानवीय अनुकूलता के संबंध को अतिरिक्त व्याख्या से नहीं बाँधा गया।
- issue: दफ़नाए जाने वाले व्यक्ति की पहचान
  choice: ‘अपनी मृत देह’
  alternative: ‘अपने मृतक को’
  rationale: स्रोत में सर्वनाम-संबंध प्रसंग पर निर्भर है और मृत शरीर का शब्द आया है; अनुवाद मृत व्यक्ति का नाम या संबंध जोड़कर अस्पष्टता को नहीं सुलझाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। आरंभिक कर्ता को प्रसंगानुसार सर्वनाम में रखा गया है। स्रोत अंश अगले वाक्य में जारी होता प्रतीत होता है, इसलिए अंतिम दीर्घ विराम-चिह्न (—) सुरक्षित रखा गया है। परामर्श-पाठ की [5] टिप्पणी इस पद से असंबद्ध और बाद के पदों की सामग्री पर थी, इसलिए उसे सम्मिलित नहीं किया गया।
