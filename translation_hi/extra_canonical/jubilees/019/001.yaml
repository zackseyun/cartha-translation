base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/001.yaml
  text: And in the first year of the first week in the fifty-eighth jubilee[1], Abraham returned and dwelt opposite Hebron—that is, Kiriath-arba—for another week of years.
translation:
  language: hi
  text: और अट्ठावनवीं जुबली[a] के पहले सप्ताह के पहले वर्ष में अब्राहम लौट आया और हेब्रोन के सामने—अर्थात् किर्यत-अर्बा में—वर्षों के एक और सप्ताह तक रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'स्रोत-पंक्तियों में अध्याय की पद-संख्या कुछ अनियमित है: पद 16 के रूप में चिह्नित सामग्री नहीं मिलती, और अंतिम लंबी आशीष को पद 27 कहा गया है। इस अनुवाद में अध्याय को नए सिरे से क्रमांकित करने के बजाय दी गई पद-संख्या ही रखी गई है।'
    reason: segmentation_note
lexical_decisions:
- source_word: ፶ወ፰
  choice: अट्ठावनवीं
  rationale: गीज़ अंक ፶ወ፰ का सीधा मान 50+8, अर्थात् 58 है; इसलिए उपलब्ध स्रोत-पाठ के अनुसार ‘अट्ठावनवीं’ रखा गया।
- source_word: እዮቤልዉ
  choice: जुबली
  rationale: पुस्तक की विशिष्ट कालगणनात्मक इकाई को सामान्य ‘उत्सव’ या ‘पचास वर्ष’ में बदलने के बजाय पारिभाषिक रूप में सुरक्षित रखा गया।
- source_word: አንጻረ
  choice: के सामने
  rationale: यह शब्द ‘सामने’, ‘सम्मुख’ या ‘की ओर मुख किए’ का स्थानिक संबंध व्यक्त करता है; केवल ‘के पास’ कहना इसकी विशिष्टता खो देता।
- source_word: ቀርያታርቦቅ
  choice: किर्यत-अर्बा
  rationale: स्थान-नाम को उसके प्रचलित बाइबिलीय हिन्दी रूप में लिप्यंतरित किया गया।
- source_word: ሱባዔ፡ ዓመት
  choice: वर्षों का सप्ताह
  rationale: शाब्दिक कालगणनात्मक पद ‘वर्षों का सप्ताह’ पुस्तक के ढाँचे में अर्थपूर्ण है; इसे केवल ‘सात वर्ष’ करने से मूल पारिभाषिक अभिव्यक्ति मिट जाती।
theological_decisions:
- issue: जुबली की संख्या
  choice: अट्ठावनवीं
  alternative: अड़तालीसवीं या अन्य पाठ-परंपराओं की संख्या
  rationale: प्रस्तुत गीज़ स्रोत में स्पष्ट रूप से ፶ወ፰ है। दूसरी पाठ-परंपराओं के आधार पर इसे चुपचाप संशोधित नहीं किया गया।
- issue: कालगणनात्मक अभिव्यक्ति ሱባዔ፡ ዓመት
  choice: वर्षों के एक और सप्ताह तक
  alternative: और सात वर्ष तक
  rationale: जुबली ग्रंथ की सप्ताह-आधारित कालगणना और उससे जुड़ा वैचारिक तनाव सुरक्षित रखने के लिए मूल रूपक बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘जुबली’ और ‘वर्षों का सप्ताह’ जैसे ग्रंथ-विशिष्ट कालगणनात्मक पदों को सरल व्याख्या से प्रतिस्थापित नहीं किया गया; स्थानिक አንጻረ को स्पष्ट रूप से ‘के सामने’ अनूदित किया गया है।
