- source_word: ዝእዮቤልው
  choice: इस जयंती के
  rationale: गीज़ पद जयंती-चक्र को सूचित करता है; ‘जयंती’ यहाँ कालगणना की पारिभाषिक इकाई के रूप में रखा गया है।
- source_word: ተፈጸመ፡ መዋዕለ፡ ሕይወታ፡ ሳራ
  choice: सारा के जीवन के दिन पूरे हुए
  rationale: मूल की सामी मुहावरेदार संरचना को स्वाभाविक किंतु निकट हिन्दी में सुरक्षित रखा गया है।
- source_word: በኬብሮን
  choice: हेब्रोन में
  rationale: यह स्पष्ट स्थान-नाम है; गीज़ पाठ के अनुरूप सामान्य हिन्दी लिप्यंतरण अपनाया गया है।
