  text: And in the first year of the third week of this jubilee[2], the days of Sarah’s life were completed, and she died in Hebron.
translation:
  language: hi
  text: और इस जुबली-चक्र के तीसरे सप्ताह के पहले वर्ष में सारा के जीवन के दिन पूरे हुए, और वह हेब्रोन में मर गई।
