  text: क्योंकि मैं जानता हूँ कि प्रभु उसे अपने लिए एक प्रजा के रूप में चुनेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእምር
  choice: मैं जानती हूँ
  rationale: क्रिया प्रथम पुरुष एकवचन है; प्रसंग में वक्ता स्त्री होने के कारण आधुनिक हिन्दी में स्त्रीलिंग रूप स्वाभाविक है।
- source_word: ያኀሪ
  choice: चुनेंगे
  rationale: गीज़ क्रिया चयन करने के अर्थ में है और भावी कथन को व्यक्त करती है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यहाँ परमेश्वर के विशिष्ट नाम को हिन्दी बाइबलीय परंपरा में प्रचलित रूप से प्रस्तुत किया गया है।
- source_word: ሎቱ ለሕዝብ
  choice: अपने लिए एक प्रजा के रूप में
  rationale: शाब्दिक संबंध ‘अपने लिए—एक प्रजा’ को स्वाभाविक हिन्दी में रखते हुए व्यक्ति के सामुदायिक/वंशगत चयन की मूल अभिव्यक्ति को सुरक्षित करता है।
theological_decisions:
- issue: एक व्यक्ति को ‘प्रजा’ के रूप में चुनना
  choice: उसे अपने लिए एक प्रजा के रूप में चुनेंगे
  alternative: उसके वंश को अपनी प्रजा होने के लिए चुनेंगे
  rationale: मूल पाठ ‘उसे’ और ‘प्रजा’ के बीच मौजूद अर्थगत तनाव को रखता है; ‘वंश’ जोड़कर निहितार्थ को स्पष्ट करना मूल की अस्पष्टता को अनावश्यक रूप से हल कर देता।
