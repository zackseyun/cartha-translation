  yaml_path: translation/extra_canonical/jubilees/019/024.yaml
  text: May God be mine and my seed's, Jacob's and his seed's, forever. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth—shall be blessed.
translation:
  language: hi
  text: परमेश्वर सदा के लिए मेरा और मेरे वंश का, तथा याकूब और उसके वंश का हो।[a] और उसके वंश में मेरा नाम और मेरे पूर्वजों—शेम, नूह, हनोक, महललेल, एनोश और शेत—का नाम आशीषित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “और मेरा वंश सदा के लिए याकूब और उसके वंश का हो।”
    reason: संक्षिप्त गीइज़ वाक्य-संरचना के एक वैकल्पिक, पहले प्रचलित विश्लेषण को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: እግዚአብሔር
  choice: परमेश्वर
  rationale: यह पद के आरंभ में स्पष्ट कर्ता है; इसे छोड़ना अर्थ को बदल देता।
- source_word: ይኩን
  choice: हो
  rationale: इच्छासूचक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ኵሎ፡ መዋዕለ
  choice: सदा के लिए
  rationale: पूरे काल/सभी दिनों के मुहावरे का सहज और स्थायी-अर्थ वाला हिन्दी रूप।
- source_word: ይትባረክ
  choice: आशीष पाए
  rationale: कर्मवाच्य/मध्यवाच्य भाव को दर्शाता है और दूसरे वाक्य के विधेय को स्पष्ट रखता है।
- source_word: አበዊየ
  choice: मेरे पूर्वजों
  rationale: वंशावली में अनेक पुरखों की सूची के संदर्भ में शाब्दिक ‘मेरे पिताओं’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक।
theological_decisions:
- issue: पहले वाक्य में परमेश्वर और संबंधसूचक पदों का व्याकरणिक संबंध
  choice: ‘परमेश्वर ... मेरा और मेरे वंश का, तथा याकूब और उसके वंश का हो’
  alternative: ‘मेरा वंश याकूब और उसके वंश का हो’
  rationale: मूल पाठ में እግዚአብሔር आरंभिक कर्ता और ይኩን इच्छासूचक क्रिया है; फिर भी सर्वनाम-रूपों की संक्षिप्त संरचना के कारण पूर्व प्रचलित दूसरा विश्लेषण पादटिप्पणी में रखा गया है।
- issue: ‘उसके वंश में’ किसका संकेत है
  choice: सर्वनाम को ‘उसके’ ही रखा
  alternative: स्पष्ट रूप से ‘याकूब के वंश में’
  rationale: मूल की सर्वनामिक अभिव्यक्ति और उसकी संभावित संदर्भगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वंशावली के नामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
