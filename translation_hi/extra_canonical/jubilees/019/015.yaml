  text: And all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and commanded her concerning Jacob, because he knew that she loved Jacob much more.
translation:
  language: hi
  text: और उसके सारे काम उग्र थे। अब्राहम याकूब से प्रेम करता था, पर इसहाक एसाव से प्रेम करता था। अब्राहम ने एसाव के कामों को देखा और जान गया कि याकूब ही से उसका नाम और वंश कहलाएगा। तब उसने रिबका को बुलाया और उसे याकूब के विषय में आज्ञा दी, क्योंकि वह जानता था कि रिबका याकूब से कहीं अधिक प्रेम करती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድሩክ
  choice: उग्र
  rationale: यह शब्द एसाव के समस्त आचरण के कठोर, प्रचंड या हिंसक स्वभाव को व्यक्त करता है; ‘उग्र’ मूल की व्यापकता बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: ያፈቅሮ / ታፈቅሮ
  choice: प्रेम करता था / प्रेम करती थी
  rationale: मूल क्रिया स्नेह या प्रेम को सूचित करती है; पारिवारिक संदर्भ में ‘प्रेम’ स्पष्ट और गरिमापूर्ण है।
- source_word: ይጼዋዕ
  choice: कहलाएगा
  rationale: निष्क्रिय भाव ‘बुलाया/कहलाया जाएगा’ को सुरक्षित रखता है और नाम तथा वंश की निरंतरता के कथन को अनावश्यक रूप से नहीं खोलता।
- source_word: ዘርእ
  choice: वंश
  rationale: इस संदर्भ में यह मात्र जैविक ‘बीज’ नहीं, बल्कि भावी संतति और वंश-परंपरा को सूचित करता है।
- source_word: ፈድፋደ
  choice: कहीं अधिक
  rationale: तीव्र तुलनात्मक बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘याकूब में उसका नाम और वंश कहलाएगा’ का अर्थ
  choice: मूल के असामान्य निष्क्रिय और स्थानीय वाक्य-विन्यास को निकटता से रखा गया
  alternative: ‘उसका नाम और वंश याकूब के द्वारा आगे चलेगा’
  rationale: वैकल्पिक रूप अर्थ की एक व्याख्या निश्चित कर देता; प्रस्तुत अनुवाद मूल की वास्तविक अस्पष्टता और वंशगत-धार्मिक तनाव को बनाए रखता है।
- issue: अब्राहम द्वारा रिबका को दी गई आज्ञा की विषयवस्तु
  choice: ‘याकूब के विषय में उसे आज्ञा दी’
  alternative: आज्ञा की अनिर्दिष्ट सामग्री को अनुमान से पूरा करना
  rationale: इस पद में आज्ञा का ठीक आशय नहीं बताया गया है, इसलिए कोई अतिरिक्त निर्देश नहीं जोड़ा गया।
- issue: रिबका का याकूब से ‘अधिक’ प्रेम
  choice: ‘याकूब से कहीं अधिक प्रेम करती थी’
  alternative: तुलना का लक्ष्य जोड़ना, जैसे ‘एसाव से अधिक’
  rationale: मूल में तुलना का दूसरा पक्ष स्पष्ट नहीं है; उसे जोड़ना व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। नामों के प्रचलित हिन्दी बाइबलीय रूप—अब्राहम, इसहाक, एसाव, याकूब और रिबका—अपनाए गए हैं। मूल की पुनरुक्त संयोजक शैली को अधिकांशतः बनाए रखा गया है, पर हिन्दी प्रवाह के लिए एक स्थान पर ‘तब’ प्रयुक्त है।
