  yaml_path: translation/extra_canonical/jubilees/019/011.yaml
  text: And Abraham took for himself a third wife, and her name was Keturah, from among the daughters of the servants of his household.
translation:
  language: hi
  text: और अब्राहम ने अपने लिए तीसरी पत्नी ली। उसका नाम कतूरा था, और वह अब्राहम के घर के सेवकों की बेटियों में से थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ፡ ሣልስተ
  choice: तीसरी पत्नी
  rationale: स्रोत के क्रमवाचक पद और ‘पत्नी’ के अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኬጡራ
  choice: कतूरा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: እምነ፡ አዋልደ፡ ልደ፡ ቤቱ
  choice: उसके घर के सेवकों की बेटियों में से
  rationale: वंश/समूह-सूचक ‘बेटियों में से’ और घर से संबद्ध सेवकों—दोनों संबंधों को स्पष्ट रखते हुए स्रोत की संरचना के निकट है।
theological_decisions:
- issue: कतूरा का अब्राहम की ‘तीसरी पत्नी’ होना
  choice: तीसरी पत्नी
  alternative: एक और पत्नी
  rationale: स्रोत स्पष्ट रूप से क्रमवाचक ‘तीसरी’ कहता है; इसे नरम या अस्पष्ट नहीं किया गया।
- issue: कतूरा की सामाजिक/पारिवारिक पृष्ठभूमि
  choice: उसके घर के सेवकों की बेटियों में से थी
  alternative: उसकी घरेलू सेविका थी
  rationale: स्रोत उसे स्वयं सेविका कहने के बजाय घर के सेवकों की बेटियों के समूह से जोड़ता है; उस भेद को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-समीप वाक्य-विन्यास। ‘अपने लिए’ स्रोत के आत्मवाचक भाव को बनाए रखता है; दूसरे वाक्य में सर्वनाम-संदर्भ स्पष्ट किया गया है।
