  yaml_path: translation/extra_canonical/jubilees/019/003.yaml
  text: And Abraham went to weep for her and to bury her, and we tested him to see if his spirit was patient, and he did not become violent in the speech of his mouth.
translation:
  language: hi
  text: और अब्राहम उसके लिए रोने और उसे दफ़नाने गया। तब हमने यह देखने के लिए उसकी परीक्षा ली कि उसका मन धीरज धरता है या नहीं; और वह अपने मुख से बोलते समय उग्र नहीं हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दिए गए गीइज़ पाठ में इस स्थान पर एक विकृत और अंत में अधूरा पाठ दिखाई देता है। प्रमाणित पाठ-पठन और प्रसंग के आधार पर अर्थ है: “हमने उसकी परीक्षा ली कि उसका मन धीरज धरता है या नहीं,” और आगे उसके मुख से बोलते समय उग्र न होने का वर्णन है।'
    reason: textual_note
lexical_decisions:
- source_word: ይብክያ
  choice: उसके लिए रोने
  rationale: क्रिया का सीधा अर्थ रोना या विलाप करना है; प्रसंग में शोक व्यक्त करने का भाव स्वाभाविक रूप से उपस्थित है।
- source_word: ይቅበራ
  choice: उसे दफ़नाने
  rationale: स्त्रीलिंग कर्म-सूचक रूप सारा की ओर संकेत करता है और दफ़नाने की क्रिया को स्पष्ट करता है।
- source_word: ወመከርኖ (प्रमाणित पाठ-पठन)
  choice: तब हमने उसकी परीक्षा ली
  rationale: यह पाठ अब्राहम की परीक्षा के प्रसंग और वाक्य की संरचना से मेल खाता है; दिए गए स्रोत-पाठ का ወናዝከሮ रूप पाठ-दोष माना गया है।
- source_word: መንፈሱ
  choice: उसका मन
  rationale: मूल शब्द का शाब्दिक अर्थ ‘उसकी आत्मा/उसका प्राण’ है, पर यहाँ आंतरिक स्वभाव और धैर्य की दशा अभिप्रेत है; आधुनिक हिन्दी में ‘मन’ सहज और अर्थ-संगत है।
- source_word: ይትነገሥ
  choice: धीरज धरता है
  rationale: प्रसंग में परीक्षा का विषय शोक के समय अब्राहम का संयम और धैर्य है।
theological_decisions:
- issue: सारा की मृत्यु को अब्राहम की परीक्षा के रूप में प्रस्तुत करना
  choice: ‘हमने ... उसकी परीक्षा ली’ को स्पष्ट रूप से रखा गया
  alternative: वाक्य को केवल अब्राहम के संयम के वर्णन के रूप में पढ़ना
  rationale: प्रमाणित पाठ-पठन और व्यापक प्रसंग परीक्षा को स्पष्ट करते हैं; इसे हटाने से कथावाचक का धार्मिक आशय खो जाता।
- issue: ‘आत्मा’ बनाम ‘मन’
  choice: मुख्य पाठ में ‘मन’
  alternative: ‘उसकी आत्मा धीरज धरे’
  rationale: ‘मन’ यहाँ आंतरिक वृत्ति का स्वाभाविक हिन्दी रूप है और किसी विशिष्ट आत्मा-संबंधी सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘अपने मुँह की बातों में’ मूल की अभिव्यक्ति को बचाता है, जबकि ‘उग्र नहीं हुआ’ उसे सामान्य पाठक के लिए स्वाभाविक बनाता है।
