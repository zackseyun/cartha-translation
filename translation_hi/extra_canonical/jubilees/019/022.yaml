translation:
  language: hi
  text: मेरे पुत्रों! वह सदा के लिए आशीषित हो, और उसका वंश ऐसा हो जो सारी पृथ्वी को भर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉድየ
  choice: मेरे पुत्रो
  rationale: यह संबोधन बहुवचन है; प्रसंग और परामर्श-पाठ के अनुरूप ‘पुत्र’ चुना गया है।
- source_word: እስከ ለዓለም
  choice: सदा के लिए
  rationale: यह कालगत अभिव्यक्ति स्थायी अथवा अनंत अवधि को दर्शाती है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: ዘርኡ
  choice: उसका वंश
  rationale: ‘बीज’ इसका शाब्दिक अर्थ हो सकता है, पर यहाँ संतति अथवा वंश का सामूहिक अर्थ अभिप्रेत है।
- source_word: ዘይመልእ ኵላ ምድረ
  choice: जो सारी पृथ्वी को भर दे
  rationale: स्रोत की संबंधवाचक रचना और कामनासूचक क्रियाभाव को हिन्दी में स्पष्ट एवं स्वाभाविक रूप से रखा गया है।
theological_decisions:
- issue: ‘वंश’ का पृथ्वी को भरना
  choice: ऐसा हो जो सारी पृथ्वी को भर दे
  alternative: सारी पृथ्वी में फैल जाए
  rationale: ‘भरना’ स्रोत की क्रिया के अधिक निकट है और उसके व्यापक आशय को किसी विशेष धार्मिक व्याख्या द्वारा सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। आशीर्वचन के कामनासूचक भाव को ‘हो’ और ‘भर दे’ से व्यक्त किया गया है। उपलब्ध स्रोत के अंत में आया ‘እመ’ वाक्यगत रूप से अगले खंड का आरंभ प्रतीत होता है, इसलिए इस पद के पाठ में शामिल नहीं किया गया।
