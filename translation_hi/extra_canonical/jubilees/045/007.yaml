translation:
  language: hi
  text: और यूसुफ ने अपने पिता, अपने भाइयों और उनके सारे पशुधन का भी सात वर्षों के अकाल के दौरान उनकी आवश्यकता के अनुसार भरण-पोषण किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሴሰዮሙ
  choice: भरण-पोषण किया
  rationale: यह क्रिया भोजन देकर संभालने या जीविका चलाने का भाव देती है और यहाँ पिता, भाइयों तथा पशुधन—तीनों पर लागू होती है।
- source_word: ጥሪቶሙ
  choice: उनके सारे पशुधन
  rationale: इस प्रसंग में शब्द का ठोस अर्थ मवेशी या पशुधन है; इसे सामान्य ‘उनकी सारी संपत्ति’ कहना अत्यधिक अस्पष्ट होगा।
- source_word: በከመ፡ የአክሎሙ
  choice: उनकी आवश्यकता के अनुसार
  rationale: स्रोत का भाव है कि यूसुफ ने उन्हें उतना दिया जितना उनके लिए पर्याप्त था; आधुनिक हिन्दी में यह संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: ለሰብዐቱ፡ ዓመታት፡ ዐባር
  choice: सात वर्षों के अकाल के दौरान
  rationale: यह अवधि और परिस्थिति दोनों को स्पष्ट रूप से व्यक्त करता है।
