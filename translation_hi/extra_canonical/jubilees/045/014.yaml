  text: And before he died, Israel blessed his sons and told them everything that would happen to them in the land of Egypt and he made known to them what would come upon them in later days.
translation:
  language: hi
  text: और मरने से पहले इस्राएल ने अपने पुत्रों को आशीर्वाद दिया। उसने उन्हें वह सब बताया जो मिस्र देश में उनके साथ होने वाला था, और उन्हें यह भी प्रकट किया कि बाद के दिनों में उन पर क्या आने वाला था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮሙ
  choice: आशीर्वाद दिया
  rationale: क्रिया का स्वाभाविक और स्थापित हिन्दी रूप; बहुवचन कर्म ‘अपने पुत्रों’ से स्पष्ट है।
- source_word: እስራኤል
  choice: इस्राएल
  rationale: यहाँ याकूब के व्यक्तिगत नाम के रूप में प्रयुक्त है, इसलिए नाम को यथावत रखा गया है।
- source_word: ምድረ ግብጽ
  choice: मिस्र देश
  rationale: शाब्दिक अर्थ ‘मिस्र की भूमि/देश’; आधुनिक हिन्दी में ‘मिस्र देश’ सहज और स्पष्ट है।
- source_word: በደኃሪ መዋዕል
  choice: बाद के दिनों में
  rationale: कालगत और संभावित भविष्यसूचक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ይመጽእ ላዕሌሆሙ
  choice: उन पर क्या आने वाला था
  rationale: ‘उन पर आना’ स्रोत की अभिव्यक्ति और उसके गंभीर भविष्यसूचक स्वर को बनाए रखता है।
- source_word: አይድዖሙ (emended reading of final እይድያሙ)
  choice: उन्हें यह भी प्रकट किया
  rationale: प्राप्त पाठ के अंतिम रूप को प्रमाणित प्रतिलिपि-दोष मानने वाली समीक्षात्मक समझ के अनुसार ‘उसने उन्हें ज्ञात कराया’ का अर्थ पुनर्स्थापित करता है; ‘प्रकट किया’ हिन्दी में प्रसंगानुकूल है।
theological_decisions:
- issue: ‘बाद के दिनों’ का भविष्यसूचक दायरा
  choice: बाद के दिनों में
  alternative: अन्तिम दिनों में
  rationale: स्रोत का वाक्यांश दूरवर्ती भविष्य को सूचित कर सकता है, पर अनिवार्य रूप से अन्तकाल संबंधी तकनीकी अर्थ नहीं देता; इसलिए व्यापक अभिव्यक्ति रखी गई है।
- issue: भविष्य की घटनाओं की प्रकृति
  choice: उन पर क्या आने वाला था
  alternative: उनके साथ क्या घटित होगा
  rationale: स्रोत के ‘उन पर आएगा’ रूपक को बनाए रखा गया है और घटनाओं को दैवी दण्ड, भाग्य या किसी विशेष सिद्धान्त के रूप में नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। लंबे मूल वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘पुत्रों’ और ‘आशीर्वाद’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; अनावश्यक संस्कृतनिष्ठता से बचा गया है।
