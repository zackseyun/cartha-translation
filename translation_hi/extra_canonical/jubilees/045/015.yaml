  text: And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah[15] in the land of Canaan, near Abraham his father.
translation:
  language: hi
  text: उसने उन्हें आशीर्वाद दिया और यूसुफ को देश में दोहरा भाग दिया। फिर वह अपने पुरखाओं के साथ सो गया और कनान देश में मकपेला की गुफा[a] में, अपने पिता अब्राहम के पास, दफ़नाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘दोहरी गुफा’। यह वही पैतृक कब्रगाह है जो अन्यत्र मकपेला के नाम से जानी जाती है।
    reason: शाब्दिक अर्थ और स्थान-नाम के संबंध को स्पष्ट करना।
lexical_decisions:
- source_word: ክልኤተ፡ መክፈሊተ
  choice: दोहरा भाग
  rationale: इस पदबंध का शाब्दिक अर्थ ‘दो भाग’ है; ‘दोहरा भाग’ स्वाभाविक हिन्दी में विरासत के विशेष हिस्से का भाव बनाए रखता है।
- source_word: ወኖመ፡ ምስለ፡ አበዊሁ
  choice: अपने पुरखाओं के साथ सो गया
  rationale: मृत्यु के लिए प्रयुक्त स्रोत का पारंपरिक रूपक सुरक्षित रखा गया है; ‘पुरखाओं’ से बहुवचन और वंशगत संदर्भ स्पष्ट होता है।
- source_word: በዐት፡ ዘካዕበት
  choice: मकपेला की गुफा
  rationale: गीज़ पदबंध का शाब्दिक अर्थ ‘दोहरी गुफा’ है, पर यह पूर्वजों की प्रसिद्ध कब्रगाह मकपेला को सूचित करता है; पाठ में परिचित स्थान-नाम और पादटिप्पणी में शाब्दिक अर्थ दिया गया है।
- source_word: ቅሩበ
  choice: के पास
  rationale: स्थानिक निकटता व्यक्त करने वाले स्रोत शब्द का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: अब्राहम को ‘उसका पिता’ कहना
  choice: अपने पिता अब्राहम
  alternative: अपने पूर्वज अब्राहम
  rationale: स्रोत स्पष्टतः ‘अब्राहम, उसका पिता’ कहता है। वंशगत ‘पिता’ को ‘पूर्वज’ बनाकर निहित संबंध स्पष्ट करना संभव था, पर मूल की अभिव्यक्ति और उसकी संभावित वंशावलीगत व्यापकता सुरक्षित रखी गई है।
- issue: मृत्यु के लिए निद्रा-रूपक
  choice: अपने पुरखाओं के साथ सो गया
  alternative: मर गया
  rationale: ‘सो गया’ स्रोत में वास्तविक रूपक है; इसे केवल ‘मर गया’ कर देने से मूल की धार्मिक-साहित्यिक भाषा मिट जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। बाइबलीय मृत्यु-रूपक ‘पुरखाओं के साथ सो गया’ को बनाए रखा गया है; ‘दफ़नाया गया’ वर्तमान मानक वर्तनी में है।
