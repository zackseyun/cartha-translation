translation:
  language: hi
  text: चौथे महीने में,[a] बयालीसवीं[b] जुबली के तीसरे सप्ताह के दूसरे वर्ष में, यूसुफ उसका स्वागत करने आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में यहाँ केवल ‘चौथे’ है। पद-विभाजन के कारण जिस ‘महीने’ का यह विशेषण है, वह पिछले पद में आता है। पहले इसे ‘चौथे वर्ष में’ भी प्रस्तुत किया गया था, पर उसके तुरंत बाद ‘दूसरे वर्ष में’ आने के कारण वह अर्थ उपयुक्त नहीं है।
    reason: previous_rendering
  - marker: b
    text: गीइज़ पाठ में अक्षरशः ‘बयालीसवीं’ (፵ወ፪) है, यद्यपि जुबली ग्रंथ के आंतरिक कालक्रम के अनुसार यहाँ पैंतालीसवीं जुबली अपेक्षित है।
    reason: textual_variant
lexical_decisions:
- source_word: ራብዕ
  choice: चौथे महीने में
  rationale: शब्द का शाब्दिक अर्थ ‘चौथा’ है; पद-विभाजन के कारण इसका संज्ञा-पद पिछले पद में रह गया है। प्रसंग के अनुसार यहाँ ‘महीना’ पूरा किया गया है, न कि ‘वर्ष’, क्योंकि आगे उसी वाक्य में ‘दूसरे वर्ष’ आता है।
- source_word: እዮቤልው
  choice: जुबली
  rationale: यह कालगणना की तकनीकी इकाई है; प्रचलित लिप्यंतरण अर्थ को किसी अतिरिक्त व्याख्या से बाँधे बिना सुरक्षित रखता है।
- source_word: ይትቀበል
  choice: उसे लेने
  rationale: क्रिया में किसी को ग्रहण करने/लेने के लिए आने का भाव है। ‘स्वागत करने’ भी संभव है, पर वह प्रसंग में अधिक भावात्मक अर्थ जोड़ सकता है।
theological_decisions:
- issue: जुबली की संख्या और आंतरिक कालक्रम का विरोध
  choice: मूल गीइज़ पाठ के अनुसार ‘बयालीसवीं’ रखा गया
  alternative: आंतरिक कालक्रम के अनुसार ‘पैंतालीसवीं’ करना
  rationale: प्रत्यक्ष पाठ-साक्ष्य ፵ወ፪ अर्थात ‘बयालीसवीं’ पढ़ता है; कालक्रमगत कठिनाई को पाठ में चुपचाप सुधारने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। आरंभिक वाक्यांश मूल पद-विभाजन में पिछले पद से जुड़ा है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘महीने में’ जोड़ा गया और इसकी सूचना पादटिप्पणी में दी गई। ‘और’ को मूल के ወ के अनुरूप रखा गया है।
