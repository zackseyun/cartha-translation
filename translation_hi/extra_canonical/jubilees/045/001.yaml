  text: And Israel entered the land of Egypt, into the land of Goshen, at the new moon of the fourth month.
translation:
  language: hi
  text: और इस्राएल चौथे महीने के नए चाँद के दिन मिस्र देश के गोशेन प्रदेश में प्रवेश किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቦአ
  choice: और … आया
  rationale: गीज़ क्रिया का अर्थ ‘प्रवेश किया/आया’ है। हिंदी में स्थान के साथ ‘में आया’ स्वाभाविक है और यात्रा के आगमन को स्पष्ट रखता है।
- source_word: እስራኤል
  choice: इस्राएल
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय रूप; यहाँ याकूब/इस्राएल को एकवचन कर्ता के रूप में सुरक्षित रखा गया है।
- source_word: ብሔረ፡ ግብጽ
  choice: मिस्र देश
  rationale: ‘मिस्र की भूमि/देश’ के भौगोलिक अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ምድረ፡ ጌሤም
  choice: गोशेन प्रदेश
  rationale: मिस्र के भीतर स्थित विशिष्ट भूभाग को दर्शाने के लिए ‘प्रदेश’ चुना गया है, जिससे दोहरे ‘देश’ की असहज पुनरावृत्ति बचती है।
- source_word: አመ፡ ሠርቀ፡ ወርኅ
  choice: चौथे महीने की अमावस्या के दिन
  rationale: प्रस्तुत पाठ और परामर्श-पाठ के काल-संकेत को आधुनिक, सामान्य हिंदी में व्यक्त किया गया है; ‘अमावस्या’ नए चंद्र-मास के आरंभ का स्वाभाविक पद है।
theological_decisions:
- issue: ‘इस्राएल’ का आशय व्यक्ति है या समुदाय
  choice: एकवचन ‘आया’
  alternative: बहुवचन ‘आए’
  rationale: स्रोत में नाम के साथ क्रिया एकवचन है; इसलिए याकूब/इस्राएल को व्याकरणिक कर्ता मानते हुए अस्पष्टता को सामुदायिक बहुवचन से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मिस्र के व्यापक भूभाग और उसके भीतर गोशेन के संबंध को दो क्रमिक स्थान-सूचकों द्वारा संरक्षित किया गया है।
