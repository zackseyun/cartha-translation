base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/013.yaml
  text: And Joseph made it a statute for the land of Egypt to this day. And Israel lived in the land of Egypt seventeen years, and all the days that he lived were three jubilees, one hundred and forty-seven years. And he died in the fourth year of the fifth week of the forty-fifth jubilee.
translation:
  language: hi
  text: और यूसुफ ने इसे मिस्र देश के लिए आज के दिन तक एक विधि ठहराई। और इस्राएल मिस्र देश में सत्रह वर्ष जीवित रहा; और उसके जीवन के कुल दिन तीन जुबली, अर्थात् एक सौ सैंतालीस वर्ष हुए। और वह पैंतालीसवीं जुबली के पाँचवें सप्ताह के चौथे वर्ष में मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ
  choice: विधि
  rationale: यह शब्द स्थापित नियम, व्यवस्था या विधान का बोध कराता है; आधुनिक हिन्दी में ‘विधि’ संक्षिप्त, औपचारिक और स्वाभाविक है।
- source_word: እስራኤል
  choice: इस्राएल
  rationale: यहाँ नाम याकूब के लिए प्रयुक्त है; स्रोत की नामावली और उसकी संभावित साहित्यिक प्रतिध्वनि को बनाए रखा गया है।
- source_word: እዮቤሌውስ
  choice: जुबली
  rationale: पुस्तक की कालगणना की तकनीकी इकाई को स्पष्ट रखने के लिए प्रचलित लिप्यंतरण चुना गया है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: सात वर्षों की कालगणनात्मक इकाई के लिए स्रोत के शाब्दिक रूप ‘सप्ताह’ को रखा गया है; संदर्भ इसे साधारण सात दिनों से अलग करता है।
theological_decisions:
- issue: इस्राएल की आयु में ‘तीन जुबली’ और ‘एक सौ सैंतालीस वर्ष’ का संबंध
  choice: ‘तीन जुबली, अर्थात् एक सौ सैंतालीस वर्ष’
  alternative: ‘तीन जुबली और एक सौ सैंतालीस वर्ष’
  rationale: 147 वर्ष ठीक तीन 49-वर्षीय जुबलियों के बराबर हैं; हिन्दी में ‘अर्थात्’ समानार्थक गणना को स्पष्ट करता है और आयु को जोड़कर 294 वर्ष समझे जाने से बचाता है।
- issue: जुबली और सप्ताह की कालगणना
  choice: क्रमसूचक संरचना को यथावत रखा
  alternative: आधुनिक ईसा-पूर्व तिथि में रूपांतरण
  rationale: स्रोत की विशिष्ट कालगणना को बनाए रखा गया है और किसी बाहरी कालक्रम या व्याख्यात्मक गणना को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में dignified और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-संरचना में स्रोत के आवर्ती ‘और’ को बनाए रखा गया है, जबकि विराम-चिह्न हिन्दी में पठनीयता के अनुसार लगाए गए हैं।
