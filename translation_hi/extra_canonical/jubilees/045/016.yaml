  yaml_path: translation/extra_canonical/jubilees/045/016.yaml
  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
translation:
  language: hi
  text: उस कब्र में, जिसे उसने अपने लिए हेब्रोन की भूमि में दोहरी गुफा में खोदा था। और उसने अपनी सारी पुस्तकें और अपने पुरखाओं की पुस्तकें अपने पुत्र लेवी को दे दीं, ताकि वह उन्हें सुरक्षित रखे और उनका नवीकरण करे[a]—आज के दिन तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नवीकरण करे” का अर्थ पुस्तकों को फिर से लिखकर उनकी प्रतियाँ बनाना, उन्हें पुनःस्थापित करना, या उन्हें नए रूप में अगली पीढ़ियों तक पहुँचाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መቃብር
  choice: कब्र
  rationale: यह शब्द दफनाने के स्थान या कब्र को सूचित करता है; आधुनिक हिन्दी में ‘कब्र’ सहज और स्पष्ट है।
- source_word: በዐት፡ ዘካዕበት
  choice: दोहरी गुफा
  rationale: गीज़ पदबंध का शाब्दिक अर्थ ‘दुगुनी/दोहरी गुफा’ है। स्रोत में इसे व्यक्तिवाचक नाम मानना आवश्यक नहीं, इसलिए वर्णनात्मक रूप बनाए रखा गया है।
- source_word: መጻሕፍቲሁ፡ ወመጻሕፍተ፡ አበዊሁ
  choice: अपनी सारी पुस्तकें और अपने पुरखाओं की पुस्तकें
  rationale: दोनों पुस्तक-समूहों का भेद स्पष्ट रखा गया है; አበዊሁ को वंशगत पूर्वजों के अर्थ में ‘पुरखाओं’ से व्यक्त किया गया है।
- source_word: ይዕቀቦን
  choice: उन्हें सुरक्षित रखे
  rationale: क्रिया में रक्षा, संभालकर रखने और संरक्षण का भाव है।
- source_word: ያሐድሶን
  choice: उनका नवीकरण करता रहे
  rationale: मूल क्रिया ‘नया करना/फिर नया बनाना’ का अर्थ देती है। पुस्तकों के संदर्भ में इसका आशय पुनर्लेखन, पुनर्स्थापन या नई प्रतियां तैयार करके आगे पहुंचाना हो सकता है; हिन्दी में मूल रूपक और उसकी अस्पष्टता रखी गई है।
- source_word: ለውሉዱ
  choice: अपनी संतानों के लिए
  rationale: शाब्दिक ‘उसके बच्चों’ यहाँ लेवी की आगामी पीढ़ियों को भी समेट सकता है; ‘संतानों’ से यह वंशगत विस्तार स्वाभाविक रूप से व्यक्त होता है।
