  text: And the years of famine were completed[9], and Joseph gave the people who were in the land seed and provisions, so that they might sow the land in the eighth year, because the river had overflowed over all the land of Egypt.
translation:
  language: hi
  text: और अकाल के वर्ष पूरे हुए, और यूसुफ ने देश में रहने वाले लोगों को बीज और रसद दी, ताकि वे आठवें वर्ष में भूमि में बो सकें, क्योंकि नदी मिस्र की सारी भूमि पर उमड़ आई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመታት፡ ዐባር
  choice: अकाल के वर्ष
  rationale: यह पदबंध अकाल की अवधि को दर्शाता है; सरल और स्वाभाविक हिन्दी में अर्थ स्पष्ट रखा गया है।
- source_word: ለአሕዛብ፡ ዘውስተ፡ ምድረ
  choice: देश में रहनेवाले लोगों को
  rationale: यहाँ አሕዛብ का आशय राष्ट्रों के बजाय भूमि के निवासी लोगों से है; संबंधवाचक पदबंध को स्पष्ट रूप से प्रस्तुत किया गया है।
- source_word: ዘርአ፡ ወሲሳተ
  choice: बीज और रसद
  rationale: ዘርአ का सीधा अर्थ ‘बीज’ है और ሲሳተ जीवन-निर्वाह की सामग्री या प्रावधान को दर्शाता है; ‘रसद’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በሳምን፡ ዓመት
  choice: आठवें वर्ष में
  rationale: गीज़ ሳምን का अर्थ ‘आठवाँ’ है; यह सात वर्ष के अकाल के बाद की काल-संगति से भी मेल खाता है।
- source_word: መልአ፡ ፈለግ፡ ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: नदी पूरे मिस्र देश पर उमड़ आई थी
  rationale: शाब्दिक रूप से नदी के समस्त मिस्र भूमि पर भर आने का चित्र है; ‘उमड़ आई’ बाढ़ या अतिप्रवाह की स्वाभाविक हिन्दी अभिव्यक्ति है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘आठवें वर्ष’ मूल गीज़ पाठ के अनुसार रखा गया है; यहाँ पाठ-संदेह बताने वाली पादटिप्पणी आवश्यक नहीं है।
