base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/005.yaml
  text: And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.
translation:
  language: hi
  text: और यूसुफ़ और उसके भाइयों ने अपने पिता के सामने रोटी खाई और दाखमधु पिया। याकूब अत्यन्त आनन्दित हुआ, क्योंकि उसने यूसुफ़ को अपने भाइयों के साथ खाते और याकूब के सामने पीते देखा। तब उसने सबके सृष्टिकर्ता को धन्य कहा, जिसने उसकी रक्षा की थी और उसके बारहों पुत्रों को उसके लिए सुरक्षित रखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: रोटी
  rationale: गीज़ शब्द का सामान्य अर्थ रोटी/भोजन है; प्रसंग में भोज का ठोस उल्लेख बनाए रखने के लिए ‘रोटी’ चुना गया।
- source_word: ወይነ
  choice: दाखमधु
  rationale: यह अंगूरी मदिरा को सूचित करता है; ‘दाखमधु’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ተፈሥሐ ... ፍሥሓ ዐቢየ ጥቀ
  choice: अत्यन्त आनन्दित हुआ
  rationale: मूल में क्रिया और उसी धातु की संज्ञा द्वारा प्रबल आनन्द व्यक्त है; हिन्दी में स्वाभाविक तीव्रता के साथ अर्थ सुरक्षित रखा गया।
- source_word: ፈጣሪ ኵሉ
  choice: सबके सृष्टिकर्ता
  rationale: शाब्दिक अर्थ ‘समस्त का सृष्टिकर्ता’ है; चुना हुआ रूप सहज हिन्दी में सार्वभौमिक अर्थ बनाए रखता है।
- source_word: ዐቀቦ ወዐቀበ ሎቱ
  choice: उसकी रक्षा की थी और ... उसके लिए सुरक्षित रखा था
  rationale: मूल की दो समान क्रियाओं और उनके अलग कर्म—याकूब तथा उसके पुत्र—का भेद बनाए रखा गया।
theological_decisions:
- issue: सृष्टिकर्ता को आशीष देने की अभिव्यक्ति
  choice: सबके सृष्टिकर्ता को धन्य कहा
  alternative: सबके सृष्टिकर्ता को आशीष दी
  rationale: सेमिटिक धार्मिक प्रयोग में मनुष्य द्वारा परमेश्वर को ‘bless’ करने का आशय उसकी स्तुति करना या उसे धन्य कहना है; हिन्दी में ‘धन्य कहा’ इस अर्थ को बिना यह संकेत दिए रखता है कि मनुष्य परमेश्वर को कोई वरदान देता है।
- issue: बारह पुत्रों के संरक्षण का सम्बन्ध
  choice: उसके बारहों पुत्रों को उसके लिए सुरक्षित रखा था
  alternative: उसके लिए उसके बारह पुत्रों की रक्षा की थी
  rationale: ‘उसके लिए’ को बनाए रखा गया है, क्योंकि मूल पाठ केवल पुत्रों के जीवित रहने पर नहीं, पिता के लिए उनके सुरक्षित रखे जाने पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘यूसुफ़’, ‘याकूब’, ‘दाखमधु’ और ‘सृष्टिकर्ता’ जैसे प्रचलित बाइबलीय रूप रखे गए हैं। मूल की पुनरुक्ति को जहाँ हिन्दी में बोझिल होती, वहाँ अर्थगत तीव्रता में व्यक्त किया गया है।
