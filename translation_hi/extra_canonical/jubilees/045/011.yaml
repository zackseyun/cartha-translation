- source_word: እዮቤሌው
  choice: जुबली
  rationale: यह विशिष्ट कालगणनात्मक पद है; आधुनिक हिन्दी में पहचाने जाने योग्य लिप्यंतरण अपनाया गया है।
- source_word: ዘአርብዓ …
