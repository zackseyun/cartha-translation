  choice: मूलतः प्रमाणित संख्या ‘पैंतालीसवीं’ को मुख्य पाठ में रखा गया और कठिनाई को पादटिप्पणी में बताया गया।
  alternative: सामंजस्य स्थापित करने के लिए ‘चवालीसवीं’ लिखना।
  rationale: पाठ की वास्तविक कठिनाई और तनाव को बिना चुपचाप सुलझाए सुरक्षित रखना स्रोत-निष्ठ है।
