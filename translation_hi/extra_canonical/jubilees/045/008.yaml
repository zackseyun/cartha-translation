  yaml_path: translation/extra_canonical/jubilees/045/008.yaml
  text: And the land of Egypt suffered because of the famine, and Joseph acquired all the land of Egypt for Pharaoh in exchange for grain, and he acquired the people, their livestock, and everything for Pharaoh.
translation:
  language: hi
  text: अकाल के कारण मिस्र देश कष्ट में पड़ा। यूसुफ ने अनाज के बदले मिस्र की सारी भूमि फ़िरौन के लिए मोल ले ली; और उसने लोगों को, उनके पशुओं को और सब कुछ फ़िरौन के लिए प्राप्त कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐመተ
  choice: कष्ट में पड़ा
  rationale: यह क्रिया अकाल के कारण देश के पीड़ित होने या संकट झेलने का भाव देती है; सहज आधुनिक हिन्दी में इसे सक्रिय मानवीकरण के साथ रखा गया है।
- source_word: እምቅድመ፡ ገጸ፡ ዐባር
  choice: अकाल के कारण
  rationale: शाब्दिक रूप से ‘अकाल के सामने/कारण’ जैसा मुहावरा है; हिन्दी में कारणसूचक स्वाभाविक अर्थ प्रस्तुत किया गया है।
- source_word: አስተጋብአ
  choice: मोल ले ली
  rationale: भूमि को अनाज के बदले फ़िरौन के लिए इकट्ठा करने अथवा अर्जित करने का भाव है; लेन-देन के संदर्भ में ‘मोल ले ली’ स्वाभाविक और स्पष्ट है।
- source_word: በእክል
  choice: अनाज के बदले
  rationale: करण अथवा विनिमय सूचक पद को प्रसंगानुसार विनिमय के रूप में व्यक्त किया गया है।
- source_word: ሰብአኒ
  choice: लोगों ... भी
  rationale: ሰብእ का अर्थ ‘लोग’ है और प्रत्यय ኒ समावेश/योग का भाव देता है; इसलिए ‘लोगों ... भी’ रखा गया, न कि ‘उनके लोग’।
- source_word: አጥሪየ
  choice: प्राप्त कर लिया
  rationale: यह सक्रिय क्रिया है जिसका कर्ता यूसुफ है और अर्थ अर्जित/प्राप्त करना है; इसे ‘संपत्ति’ संज्ञा या ‘हो गए’ जैसी निष्क्रिय रचना नहीं माना गया।
theological_decisions:
- issue: लोगों को फ़िरौन के लिए प्राप्त करने की सामाजिक-कानूनी प्रकृति
  choice: प्राप्त कर लिया
  alternative: दास बना लिया / अपने अधीन कर लिया
  rationale: मूल क्रिया अर्जन का कथन करती है, पर यहाँ उसकी सटीक कानूनी स्थिति स्पष्ट नहीं करती। इसलिए अनुवाद दासत्व या किसी विशेष अधीनता को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य-विन्यास में मूल की क्रमिक रचना सुरक्षित रखी गई है और यूसुफ की सक्रिय भूमिका स्पष्ट की गई है।
