  text: '...his father Jacob in the land of Goshen, and he embraced his father''s neck and wept. And Israel said to Joseph, "Now let me die, since I have seen you; and now may the LORD, the God of Israel, the God of Abraham and the God of Isaac, be blessed—he who has shown mercy and compassion."'
translation:
  language: hi
  text: …गोशेन देश में अपने पिता याकूब के पास आया;[a] और उसने अपने पिता को गले लगाया और रोया। तब इस्राएल ने यूसुफ से कहा, “अब मैं मर सकता हूँ, क्योंकि मैंने तुझे देख लिया है। और अब इस्राएल के परमेश्वर, अब्राहम के परमेश्वर और इसहाक के परमेश्वर, प्रभु धन्य हों—जिन्होंने दया और करुणा दिखाई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद का उपलब्ध पाठ बीच वाक्य से आरम्भ होता है; ‘आया’ पूर्ववर्ती प्रसंग से पूरा किया गया है।
    reason: chapter_split
lexical_decisions:
- source_word: ሐቀፈ፡ ክሳደ፡ አቡሁ
  choice: अपने पिता को गले लगाया
  rationale: शाब्दिक रूप से ‘अपने पिता की गर्दन को आलिंगन किया’; स्वाभाविक आधुनिक हिन्दी में ‘गले लगाया’ वही भाव और क्रिया स्पष्ट करता है।
- source_word: እሙት፡ ይእዜሰ
  choice: अब मैं मर सकता हूँ
  rationale: वाक्य का भाव यह है कि पुत्र को जीवित देखने के बाद इस्राएल अब संतोष से मर सकता है; यह हिन्दी में सहज है और मृत्यु की इच्छा को अनावश्यक रूप से आदेशात्मक नहीं बनाता।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यह गीइज़ पद यहाँ इस्राएल के परमेश्वर के विशिष्ट ईश्वरीय नाम/उपाधि के रूप में आता है; ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और परिचित है।
- source_word: ምሕረተ፡ ወሣህሎ
  choice: दया और करुणा
  rationale: दोनों निकटार्थक संज्ञाओं का युग्म बनाए रखा गया है, ताकि स्रोत का बल और भावात्मक विस्तार सुरक्षित रहे।
- source_word: ዘአክአለ፡ ምሕረተ፡ ወሣህሎ
  choice: जिन्होंने दया और करुणा दिखाई है
  rationale: संदर्भ में ईश्वर द्वारा प्रदर्शित अनुग्रह का भाव है; हिन्दी में यह स्वाभाविक है और ‘दया को रोक न रखना’ जैसे अप्रत्यक्ष विस्तार से बचता है।
theological_decisions:
- issue: ईश्वर के लिए आशीर्वाद-वचन
  choice: यहोवा धन्य हों
  alternative: यहोवा की स्तुति हो
  rationale: स्रोत के निष्क्रिय/इच्छार्थक ‘धन्य हों’ रूप को बनाए रखा गया है; इसे केवल ‘स्तुति हो’ बनाना अर्थ को कुछ अधिक व्याख्यात्मक कर देता।
- issue: दया और करुणा का कर्ता
  choice: ईश्वर ने दया और करुणा दिखाई
  alternative: ईश्वर ने दया और करुणा नहीं रोकी
  rationale: स्रोत को सकारात्मक कथन के रूप में रखना अधिक सीधा है और उसमें निषेध का ऐसा तत्व नहीं जोड़ता जो स्पष्ट रूप से उपस्थित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। सम्बोधन में ‘तुझे’ रखा गया है, क्योंकि यह पिता-पुत्र के आत्मीय संबंध के अनुकूल है। आरम्भिक दीर्घविराम और पाद-टिप्पणी पाठ के खंडित आरम्भ को स्पष्ट करते हैं।
