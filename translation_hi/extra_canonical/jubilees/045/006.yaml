base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/006.yaml
  text: And Joseph gave his father and his brothers a possession, so that they might dwell in the land of Goshen, and in Rameses and all its territory, which he ruled before Pharaoh. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.
translation:
  language: hi
  text: और यूसुफ ने अपने पिता और अपने भाइयों को गोशेन की भूमि में, रामेसेस में और उसके पूरे क्षेत्र में रहने के लिए एक भू-संपत्ति दी—उस क्षेत्र पर वह फ़िरौन के समक्ष शासन करता था। और इस्राएल और उसके पुत्र मिस्र की भूमि के सबसे अच्छे भाग, गोशेन की भूमि में बस गए। जब इस्राएल मिस्र में आया, तब वह एक सौ तीस वर्ष का था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀብተ
  choice: एक संपत्ति
  rationale: यहाँ संज्ञा का अर्थ दिया गया स्थायी भू-भाग या अधिकार है; ‘संपत्ति’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ይኅደሩ / ኀደረ
  choice: रहने के लिए / बस गए
  rationale: पहला रूप निवास के उद्देश्य को और दूसरा स्थायी रूप से बसने को व्यक्त करता है; संदर्भानुसार हिन्दी में भिन्न किंतु संबद्ध रूप चुने गए हैं।
- source_word: ይኴንን
  choice: शासन करता था
  rationale: क्रिया का अर्थ शासन या प्रशासन करना है; इसे ‘स्वीकृत था’ कहना मूल क्रिया के अर्थ को खो देगा।
- source_word: ምሥናይሃ
  choice: सबसे अच्छे भाग
  rationale: यह मिस्र की भूमि की श्रेष्ठता/उत्तमता बताता है और गोशेन के समानाधिकरण में स्वाभाविक बैठता है।
theological_decisions:
- issue: फ़िरौन से संबंधित उपवाक्य में कर्ता और संबंध
  choice: ‘जिस पर वह फ़िरौन के सामने शासन करता था’—‘वह’ से यूसुफ और ‘जिस पर’ से समूचे क्षेत्र का संकेत
  alternative: ‘जैसा फ़िरौन के सामने स्वीकृत हुआ था’
  rationale: गीज़ क्रिया ይኴንን सक्रिय रूप में शासन करने का अर्थ देती है। ‘फ़िरौन के सामने’ पदबंध को बनाए रखा गया है, क्योंकि यह राजकीय उपस्थिति/अधीनता का भाव दे सकता है; इसे केवल ‘फ़िरौन की ओर से स्वीकृत’ बनाना मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज गद्य। प्राचीन स्थान-नामों के प्रचलित हिन्दी रूप ‘गोशेन’, ‘रामेसेस’ और ‘मिस्र’ रखे गए हैं। मूल की पुनरुक्ति और वाक्य-क्रम को यथासंभव सुरक्षित रखते हुए हिन्दी प्रवाह के लिए सीमित पुनर्संयोजन किया गया है।
