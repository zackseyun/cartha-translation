  text: And Joseph took for the king a fifth of everything that was produced, and four parts he left to them for food and for seed.
translation:
  language: hi
  text: और यूसुफ ने जो कुछ उपजा था, उसका पाँचवाँ भाग राजा के लिए ले लिया, और चार भाग उसने उनके पास भोजन और बीज के लिए छोड़ दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ
  choice: ले लिया
  rationale: क्रिया का मूल अर्थ ‘लेना’ है; राजकीय अंश वसूल करने के प्रसंग में ‘ले लिया’ स्वाभाविक और स्रोत के निकट है।
- source_word: እምኵሉ፡ ዘፈረየ
  choice: जो कुछ उपजा था, उसका
  rationale: समस्त उत्पन्न उपज का बोध कराता है और यह स्पष्ट रखता है कि पाँचवाँ भाग पूरी उपज में से था।
- source_word: ኃምስቶ
  choice: पाँचवाँ भाग
  rationale: यह उपज के पाँच अंशों में से एक, अर्थात राजकीय हिस्से, को व्यक्त करता है।
- source_word: ራብዕተ፡ እደ
  choice: चार भाग
  rationale: शाब्दिक रूप से शेष चार हिस्सों को दर्शाता है और पाँचवें भाग के साथ संख्यात्मक समानांतरता बनाए रखता है।
- source_word: ለሲሲት፡ ወለዘርእ
  choice: भोजन और बीज के लिए
  rationale: उपज के दो प्रयोजन—खाने और अगली बोआई—को सहज आधुनिक हिन्दी में व्यक्त करता है।
