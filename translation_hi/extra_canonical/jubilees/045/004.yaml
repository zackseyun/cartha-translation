  text: from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. Blessed be the LORD my God forever and ever, and blessed be his name."
translation:
  language: hi
  text: उसके सेवक याकूब की ओर से। “मेरे लिए यह बड़ी बात है कि मैं अभी जीवित हूँ और तुम्हारा मुख देख लिया है, क्योंकि जो दर्शन मैंने बेतेल में देखा था, वह सचमुच सत्य सिद्ध हुआ। यहोवा, मेरा परमेश्वर, युगानुयुग धन्य हो, और उसका नाम धन्य हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምገብሩ፡ ያዕቆብ
  choice: उसके सेवक याकूब की ओर से
  rationale: खंडित आरंभ को उसके स्वाभाविक संबंधसूचक अर्थ में रखा गया है; यह वाक्य पिछले संदर्भ से जुड़ता है।
- source_word: ዐቢይ፡ ሊተ
  choice: मेरे लिए यह बहुत बड़ी बात है
  rationale: शाब्दिक ‘मेरे लिए बड़ा’ को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘርኢኩ፡ ገጸከ
  choice: मैंने ... तुम्हारा मुख देख लिया
  rationale: ‘मुख’ स्रोत के ‘चेहरे/मुख’ का औपचारिक किंतु सामान्य बाइबिलीय हिन्दी रूप है; ‘देख लिया’ घटना की पूर्णता दर्शाता है।
- source_word: ራእይ፡ ዘርኢኩ፡ በቤቴል
  choice: जो दर्शन मैंने बेतेल में देखा था
  rationale: ‘दर्शन’ दृश्य/प्रकाशना के अर्थ को बनाए रखता है और स्थाननाम का प्रचलित हिन्दी लिप्यंतरण अपनाता है।
- source_word: ይትባረክ፡ እግዚአብሔር፡ አምላኪየ
  choice: मेरा परमेश्वर यहोवा ... धन्य हो
  rationale: आशीर्वचन की स्रोत-रचना को बनाए रखते हुए እግዚአብሔር को हिन्दी बाइबिलों में परिचित ‘यहोवा’ से व्यक्त किया गया है।
- source_word: ለዓለመ፡ ዓለም
  choice: युगानुयुग
  rationale: अनंत काल की पारंपरिक पुनरुक्ति को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में देता है।
theological_decisions:
- issue: बेतेल के दर्शन की पुष्टि का स्वरूप
  choice: वह सचमुच पूरा हुआ
  alternative: वह सचमुच स्थापित हुआ
  rationale: स्रोत का አማን፡ ሀለወ शाब्दिक रूप से ‘सत्य/निश्चय ही अस्तित्व में था’ जैसा है। संदर्भ में दर्शन के सत्य सिद्ध होने या पूरा होने का भाव है; ‘पूरा हुआ’ प्रतिज्ञा की परिणति बताता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या के।
- issue: अंतिम आशीर्वचन
  choice: मेरा परमेश्वर यहोवा युगानुयुग धन्य हो
  alternative: यहोवा मेरा परमेश्वर सदा-सर्वदा आशीषित हो
  rationale: ‘धन्य हो’ उपासना और स्तुति का सामान्य हिन्दी रूप है तथा इसे मनुष्य द्वारा परमेश्वर को आशीष देने के संकीर्ण अर्थ में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आरंभ का वाक्यांश स्रोत और पूर्ववर्ती संदर्भ से जुड़ा हुआ खंड है, इसलिए उसकी खंडात्मक प्रकृति सुरक्षित रखी गई है। प्रत्यक्ष कथन के लिए हिन्दी उद्धरण-चिह्न लगाए गए हैं। स्रोत-पंक्ति अंत में ‘और धन्य’ पर कटती है; परामर्श-पाठ और अध्याय-विभाजन-साक्ष्य के अनुसार ‘उसका नाम भी धन्य हो’ से वाक्य पूरा किया गया है।
