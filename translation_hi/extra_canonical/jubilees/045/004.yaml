- from: उसके सेवक याकूब की ओर से। “मेरे लिए यह बहुत बड़ी बात है कि मैंने जीवित रहते हुए तुम्हारा मुख देख लिया, क्योंकि जो दर्शन मैंने बेतेल में देखा था, वह सचमुच पूरा हुआ। मेरा परमेश्वर यहोवा युगानुयुग धन्य हो, और उसका नाम भी धन्य हो।”
  to: उसके सेवक याकूब की ओर से। “मेरे लिए यह बड़ी बात है कि मैं अभी जीवित हूँ और तुम्हारा मुख देख लिया है, क्योंकि जो दर्शन मैंने बेतेल में देखा था, वह सचमुच सत्य सिद्ध हुआ। यहोवा, मेरा परमेश्वर, युगानुयुग धन्य हो, और उसका नाम धन्य हो।”
  rationale: The revision tightens equivalence to the source while retaining the established contextual completion of the final blessing. It avoids making the Bethel vision explicitly a prediction that ‘came to pass,’ preserves the source's modest degree of emphasis, and smooths the first-person Hindi expression of being still alive.
