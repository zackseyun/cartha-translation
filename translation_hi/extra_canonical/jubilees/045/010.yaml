  yaml_path: translation/extra_canonical/jubilees/045/010.yaml
  text: For during the seven years of famine it had not overflowed and had not watered the land, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.
translation:
  language: hi
  text: क्योंकि अकाल के सात वर्षों के दौरान नदी न तो उमड़ी थी और न उसने भूमि को सींचा था; उसने केवल नदी के किनारों के पास के कुछ स्थानों को ही सींचा था। पर अब वह उमड़ पड़ी, और मिस्र ने उस वर्ष भूमि में बीज बोया और बहुत-सा अनाज इकट्ठा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐባር
  choice: नदी उमड़ी
  rationale: संदर्भ में कर्ता नील नदी है और क्रिया उसके जल के चढ़ने अथवा तटों से फैलने को व्यक्त करती है; ‘उमड़ी’ हिन्दी में दोनों पहलुओं को स्वाभाविक रूप से समेटती है।
- source_word: ኢሰቀየ
  choice: उसने भूमि को सींचा नहीं था
  rationale: क्रिया ሰቀየ का अर्थ पानी देना या सिंचाई करना है; नवीनतम स्रोत-समीक्षा भी इसी अर्थ की पुष्टि करती है।
- source_word: ውሑዳት፡ መካን
  choice: केवल कुछ स्थानों को छोड़कर
  rationale: अपवाद की सीमितता को स्पष्ट और सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ኀበ፡ ድንጋጌ፡ ፈለግ
  choice: नदी के किनारों के पास
  rationale: यह पद नदी की सीमा, तट अथवा किनारे के निकट के स्थानों को सूचित करता है।
- source_word: ወዘርኡ፡ ግብጽ፡ ምድረ
  choice: तब मिस्रियों ने भूमि में बीज बोया
  rationale: ‘मिस्र’ सामूहिक रूप से उसके निवासियों के लिए प्रयुक्त है; हिन्दी में ‘मिस्रियों’ कहना आशय को स्वाभाविक बनाता है।
- source_word: ወአረሩ፡ ብዙኀ፡ ሥርናየ
  choice: बहुत अधिक अनाज बटोरा
  rationale: फसल काटने और उपज एकत्र करने के भाव को सामान्य पाठक के लिए ‘अनाज बटोरा’ से व्यक्त किया गया है।
