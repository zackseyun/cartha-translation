translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। नदी का नाम मूल पद में प्रत्यक्ष नहीं है, इसलिए मुख्य पाठ में सामान्य ‘नदी’ रखा गया है। अपवाद-वाक्य और घटनाक्रम को स्पष्ट करने के लिए विरामचिह्नों का प्रयोग किया गया है।
