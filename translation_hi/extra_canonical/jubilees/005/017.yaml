  yaml_path: translation/extra_canonical/jubilees/005/017.yaml
  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: hi
  text: 'और इस्राएल की संतानों के विषय में यह लिखा और ठहराया गया है: यदि वे धार्मिकता से उसकी ओर फिरें, तो वह उनके सारे अपराध क्षमा कर देगा और उनके सभी पाप माफ़ कर देगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: इस्राएल की संतानें
  rationale: शाब्दिक अर्थ ‘इस्राएल की संतानें/पुत्र’ है; समूचे समुदाय को समावेशी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: लिखा और ठहराया गया है
  rationale: दोनों निष्क्रिय क्रियाओं—लिखे जाने और विधिवत निर्धारित किए जाने—का भेद बनाए रखता है।
- source_word: ተመይጡ፡ ኀቤሁ
  choice: उसकी ओर फिरें
  rationale: पश्चात्ताप का अर्थ न जोड़ते हुए दिशा-परिवर्तन और परमेश्वर की ओर लौटने की मूल छवि सुरक्षित रखता है।
- source_word: በጽድቅ
  choice: धार्मिकता से
  rationale: ጽድቅ के धार्मिक-नैतिक अर्थ को बनाए रखता है और रीति या मनोभाव के अर्थ में प्रयुक्त अव्ययी पद को स्वाभाविक हिन्दी देता है।
- source_word: አበሳሆሙ
  choice: उनके सारे अपराध
  rationale: अपराध/दोष का भाव व्यक्त करता है और अगले पद ‘पाप’ से शब्दगत भेद बनाए रखता है।
- source_word: ኀጢአቶሙ
  choice: उनके सभी पाप
  rationale: स्रोत के सामान्य धार्मिक शब्द ‘पाप’ का सीधा और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: क्षमा की शर्त का स्वरूप
  choice: यदि वे धार्मिकता से उसकी ओर फिरें
  alternative: यदि वे सच्चे मन से पश्चात्ताप करके उसके पास लौटें
  rationale: स्रोत में ‘फिरना’ और ‘धार्मिकता’ है; ‘सच्चे मन’ तथा स्पष्ट ‘पश्चात्ताप’ जोड़ना निहितार्थ को व्याख्यात्मक ढंग से सीमित कर देता।
- issue: दो क्षमासूचक क्रियाओं का संबंध
  choice: क्षमा कर देगा … माफ़ कर देगा
  alternative: छोड़ देगा … प्रायश्चित करेगा
  rationale: स्रोत की समानांतर क्रियाओं को सहज हिन्दी में अलग अभिव्यक्तियों से रखा गया है, बिना किसी विशिष्ट प्रायश्चित-सिद्धांत को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सरल। स्रोत की विधिक घोषणा, शर्तसूचक वाक्य और ‘अपराध/पाप’ की समानांतरता सुरक्षित रखी गई है।
