translation:
  language: hi
  text: सबके विषय में वह न्याय करेगा—बड़े का उसके बड़प्पन के अनुसार, छोटे का उसके छोटेपन के अनुसार, और हर एक का उसके मार्ग के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዐቢይ / ዐበየ
  choice: बड़े / बड़प्पन
  rationale: मूल में एक ही शब्द-मूल से बनी संज्ञा और गुण की पुनरुक्ति को हिन्दी में यथासंभव बनाए रखा गया है।
- source_word: ለንኡስ / ንእሰ
  choice: छोटे / छोटेपन
  rationale: मूल की समांतर रचना को सुरक्षित रखते हुए पद, सामर्थ्य या महत्त्व की न्यूनता को अनिर्दिष्ट छोड़ा गया है।
- source_word: ፍኖቱ
  choice: चालचलन
  rationale: शाब्दिक अर्थ ‘उसका मार्ग’ है, पर न्याय के संदर्भ में यह व्यक्ति के जीवन-व्यवहार को सूचित करता है; ‘चालचलन’ आधुनिक हिन्दी में यही भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ይኴንኖ
  choice: न्याय करेगा
  rationale: क्रिया का अर्थ न्याय करना या निर्णय देना है; भविष्यकालीन अर्थ स्पष्ट रखा गया है।
theological_decisions:
- issue: न्याय का अनुपात
  choice: ‘उसके ... के अनुसार’ की तीनfold समांतरता बनाए रखी
  alternative: इसे प्रतिफल या दंड की मात्रा के रूप में स्पष्ट करना
  rationale: मूल पाठ न्याय के मानदंड को बताता है, पर परिणाम या दंड की प्रकृति स्पष्ट नहीं करता; इसलिए उस तनाव को नहीं सुलझाया गया।
- issue: ‘मार्ग’ का नैतिक आशय
  choice: चालचलन
  alternative: मार्ग
  rationale: संदर्भ में व्यक्ति की जीवन-पद्धति अभिप्रेत है, फिर भी इसे किसी विशेष कर्म-सिद्धांत या सांप्रदायिक व्याख्या से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की संतुलित त्रिखंडी संरचना और ‘बड़े/बड़प्पन’, ‘छोटे/छोटेपन’ की शब्दगत पुनरावृत्ति सुरक्षित है।
