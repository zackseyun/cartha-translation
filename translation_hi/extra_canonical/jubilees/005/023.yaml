  yaml_path: translation/extra_canonical/jubilees/005/023.yaml
  text: And he entered it in its sixth year[a], in the second month, on the new moon of the second month, until the sixteenth; and he entered, he and all that we brought to him, into the ark, and the Lord shut it from outside on the seventeenth evening.
translation:
  language: hi
  text: और उसके छठे वर्ष में,[a] दूसरे महीने में, दूसरे महीने के नवचंद्र से सोलहवें दिन तक, वह जहाज़ में प्रवेश किया। फिर वह उन सबके साथ, जिन्हें हम उसके पास लाए थे, जहाज़ में प्रवेश किया; और सत्रहवें दिन की संध्या को प्रभु ने उसे बाहर से बंद कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद की तिथि-रेखा कठिन है। “दूसरे महीने के नवचंद्र से सोलहवें दिन तक” सम्भवतः जहाज़ में प्रवेश की अवधि बताता है, जिसके बाद सत्रहवें दिन की संध्या को प्रभु ने उसे बाहर से बंद किया।
    reason: segmentation_note
lexical_decisions:
- source_word: በሳድስ፡ ሎቱ
  choice: उसके छठे वर्ष में
  rationale: गीज़ में በሳድስ का अर्थ ‘छठे’ है। इसे ‘छः सौवें’ करके उत्पत्ति की कालगणना से नहीं मिलाया गया; संबंधवाचक ‘उसके’ मूल की संक्षिप्तता और संभावित अस्पष्टता को बनाए रखता है।
- source_word: በሠርቅ
  choice: नवचंद्र से
  rationale: यह जुबलीज़ की कालगणना का विशिष्ट पद है; ‘पहले दिन’ की अपेक्षा ‘नवचंद्र’ स्रोत के शब्द और उसके calendrical भाव को अधिक सीधे सुरक्षित रखता है।
- source_word: ታቦት
  choice: जहाज़
  rationale: जलप्रलय के प्रसंग में आधुनिक हिन्दी पाठक के लिए यह उस बड़े जलयान का स्वाभाविक और स्पष्ट नाम है, जबकि संदूक-जैसी व्युत्पत्तिगत छवि को अनावश्यक रूप से प्रमुख नहीं करता।
- source_word: ዐጸዎ ... እንተ፡ አፍአሁ
  choice: उसे बाहर से बन्द कर दिया
  rationale: मूल में प्रभु द्वारा बाहर की ओर से बन्द किए जाने का भाव है; हिन्दी में इसे सरल और स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ‘छठे वर्ष’ को नूह की आयु के ‘छः सौवें वर्ष’ से मिलाने की सम्भावना
  choice: छठे वर्ष
  alternative: छः सौवें वर्ष
  rationale: प्रत्यक्ष गीज़ पाठ ‘छठे’ कहता है और यह जुबलीज़ की अपनी कालक्रम-पद्धति के अनुरूप है; उत्पत्ति के समानान्तर पाठ के आधार पर संशोधन करना स्रोत में बाहरी सामंजस्य आरोपित करता।
- issue: जहाज़ में प्रवेश और प्रभु द्वारा बन्द किए जाने की तिथि-रेखा
  choice: मूल के ‘नवचंद्र से सोलहवें दिन तक’ और ‘सत्रहवें दिन की संध्या’—दोनों को बनाए रखा
  alternative: प्रवेश को केवल सोलहवें दिन या केवल सत्रहवें दिन पर निश्चित करना
  rationale: वाक्य-विभाजन और तिथियों का आपसी संबंध कठिन है; अनुवाद ने किसी एक व्याख्या को अंतिम मानकर मूल का तनाव समाप्त नहीं किया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल में ‘प्रवेश किया’ की पुनरावृत्ति को अर्थ-संबंध स्पष्ट करने के लिए दो वाक्यों में रखा गया है, पर घटनाक्रम और प्रथम-पुरुष बहुवचन ‘हम’ को सुरक्षित रखा गया है।
