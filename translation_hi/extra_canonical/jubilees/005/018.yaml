  text: It has been written and ordained that mercy will be shown to all who turn from all their error[a], once each year.
translation:
  language: hi
  text: यह लिखा और ठहराया गया है कि उन सब पर दया दिखाई जाएगी जो अपनी सारी भूलों से मुड़ जाते हैं—हर वर्ष एक बार।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हर वर्ष एक बार” वाक्यांश जुबिलीज़ की उस पंचांग-संबंधी धार्मिक धारणा की ओर संकेत कर सकता है जिसमें प्रायश्चित या दया हर वर्ष नियमित रूप से होती है। इसलिए इसे सामान्य अर्थ में बदलने के बजाय स्पष्ट रूप में रखा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  choice: लिख दिया गया और ठहराया गया है
  rationale: 'दोनों स्रोत क्रियाओं के निष्क्रिय और विधिक भाव को बनाए रखता है: बात लिखित भी है और निर्धारित भी।'
- source_word: ይትመሐር፡
  choice: दया की जाएगी
  rationale: स्रोत के निष्क्रिय रूप को सुरक्षित रखता है और दया करने वाले कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: እለ፡ ተመይጡ፡ እምኵሉ፡ ጌጋዮሙ፡
  choice: जो अपनी सारी भूलों से फिरते हैं
  rationale: ‘फिरना’ पश्चात्तापपूर्ण दिशा-परिवर्तन का भाव देता है, जबकि ‘भूलों’ स्रोत के त्रुटि/अपराध संबंधी शब्द को किसी एक संकीर्ण धर्मशास्त्रीय अर्थ तक सीमित नहीं करता।
- source_word: ምዕረ፡ ለለ፡ ዓመት።
  choice: हर वर्ष एक बार
  rationale: वार्षिक आवृत्ति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा पंचांग-संबंधी संकेत को सामान्यीकृत नहीं करता।
theological_decisions:
- issue: दया करने वाले का कर्ता
  choice: निष्क्रिय वाक्य ‘दया की जाएगी’
  alternative: ‘वह दया करेगा’
  rationale: स्रोत में क्रिया निष्क्रिय है; इसलिए परमेश्वर को निहित कर्ता मानकर स्पष्ट जोड़ना आवश्यक नहीं।
- issue: वार्षिक दया का अर्थ
  choice: ‘हर वर्ष एक बार’ को मुख्य पाठ में स्पष्ट रखा
  alternative: ‘समय-समय पर’ अथवा वाक्यांश का लोप
  rationale: यह शब्दावली ग्रंथ की वार्षिक प्रायश्चित या दया संबंधी पंचांग-धर्मविज्ञान की ओर संकेत कर सकती है; अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य है। ‘ठहराया गया’ विधिक/दैवी निर्धारण का भाव देता है, और स्रोत की निष्क्रिय रचना तथा धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
