  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की क्रमिक पुनरुक्ति—जल का चढ़ना, जहाज़ का उठना, फिर तैरना—सुरक्षित रखी गई है।
