  text: And the waters rose upon the earth fifteen cubits; the waters rose high above all the high mountains, and the ark was lifted up from the earth and floated on the surface of the waters.
translation:
  language: hi
  text: और जल पृथ्वी पर पंद्रह हाथ तक बढ़ गया। जल सभी ऊँचे पहाड़ों से भी बहुत ऊपर चढ़ गया, और जहाज़ पृथ्वी से ऊपर उठकर जल की सतह पर तैरता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐሠርት፡ ወኃምስተ፡ በእመት
  choice: पंद्रह हाथ
  rationale: गीज़ पदबंध का अर्थ ‘पंद्रह हाथ/क्यूबिट’ है; आधुनिक हिन्दी में माप की प्राचीन इकाई को सहज रूप में रखा गया है।
- source_word: ታቦት
  choice: जहाज़
  rationale: यहाँ नूह के जलपोत का संकेत है। ‘जहाज़’ सामान्य आधुनिक पाठक के लिए स्वाभाविक है और वस्तु के कार्य को स्पष्ट करता है।
- source_word: ተንሰፈ
  choice: तैरने लगा
  rationale: क्रिया जल पर बहने अथवा तैरने का भाव देती है; प्रसंग में ‘तैरने लगा’ स्वाभाविक हिन्दी है।
- source_word: ገጸ፡ ማያት
  choice: जल की सतह
  rationale: शाब्दिक अर्थ ‘जल का मुख’ है; हिन्दी में उसका स्वाभाविक समतुल्य ‘जल की सतह’ है।
