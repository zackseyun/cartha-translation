  text: And concerning their sons, a word went out from before his face that they should be struck down with the sword and removed from under heaven.
translation:
  language: hi
  text: और उनके पुत्रों के विषय में उसके सम्मुख से यह वचन निकला कि वे तलवार से मार गिराए जाएँ और आकाश के नीचे से हटा दिए जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዲበ፡ ውሉዶሙ
  choice: और उनके पुत्रों के विषय में
  rationale: सम्बन्धसूचक वाक्यांश को स्वाभाविक आधुनिक हिन्दी में रखा गया है; ‘पुत्रों’ से मूल का पुरुष-संतान संकेत बना रहता है।
- source_word: ወፅአ፡ ቃል፡ እምቅድመ፡ ገጹ
  choice: उसके सम्मुख से यह वचन निकला
  rationale: ‘वचन निकला’ मूल की औपचारिक आज्ञात्मक घोषणा को सुरक्षित रखता है, और ‘उसके सम्मुख से’ शाब्दिक रूपक को अनावश्यक रूप से व्याख्यायित नहीं करता।
- source_word: ይምሐጾሙ፡ በሰይፍ
  choice: वे तलवार से मार गिराए जाएँ
  rationale: क्रिया maḥaṣa का प्रहार/मारने का बल और तलवार की विशिष्ट छवि दोनों सुरक्षित हैं; ‘मिटा दिए जाएँ’ की अपेक्षा यह स्रोत के अधिक निकट है।
- source_word: ወያሰስሎሙ፡ እምታሕተ፡ ሰማይ
  choice: और आकाश के नीचे से हटा दिए जाएँ
  rationale: asasala के ‘हटाने’ के अर्थ को बनाए रखता है और ‘नष्ट किए जाएँ’ जैसी अधिक व्याख्यात्मक तीव्रता नहीं जोड़ता।
theological_decisions:
- issue: आदेश देने वाले का अप्रकट कर्ता
  choice: ‘उसके सम्मुख से’ में सर्वनाम को यथावत रखा
  alternative: ‘परमेश्वर के सम्मुख से’
  rationale: इस पद में नाम स्पष्टतः नहीं है; संदर्भगत पहचान को पाठ में जोड़ने के बजाय मूल की सर्वनामिक अभिव्यक्ति और उसकी सम्भावित अस्पष्टता सुरक्षित रखी गई है।
- issue: दूसरी क्रिया का विनाशार्थक अर्थ
  choice: ‘हटा दिए जाएँ’
  alternative: ‘नष्ट कर दिए जाएँ’
  rationale: यह पृथ्वी/आकाश के नीचे से निष्कासन या उन्मूलन—दोनों की अर्थ-छाया को खुला रखता है और किसी विशेष धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वचन निकला’ तथा ‘उसके सम्मुख से’ जैसे औपचारिक पद मूल की न्यायिक/राजकीय घोषणा की शैली बनाए रखते हैं, जबकि निष्क्रिय क्रियाएँ मूल आदेश की संरचना को व्यक्त करती हैं।
