  text: And all this was ordained and written on the heavenly tablets, and there is no injustice; and all who depart from the path that was ordained for them to walk in—
translation:
  language: hi
  text: और यह सब निर्धारित किया गया और स्वर्ग की पट्टिकाओं पर लिखा गया; और कोई अन्याय नहीं है। और वे सभी जो उस मार्ग से हट जाते हैं, जिसे उनके लिए निर्धारित किया गया था कि वे उस पर चलें—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርዐ (śarʿa)
  choice: निर्धारित किया गया / निर्धारित किया गया था
  rationale: मूल में इसी क्रिया की पुनरावृत्ति है; दोनों स्थानों पर एक ही हिन्दी क्रिया रखकर उस पुनरावृत्ति को सुरक्षित किया गया है। निष्क्रिय हिन्दी रचना उस निहित कर्ता को अनावश्यक रूप से स्पष्ट नहीं करती जिसे गीइज़ पाठ नाम से नहीं बताता।
- source_word: ጽላተ፡ ሰማይ (ṣallāta samāy)
  choice: स्वर्ग की पट्टिकाएँ
  rationale: यह स्वर्गीय अभिलेख-पट्टों के ठोस रूपक को बनाए रखता है और सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ዐመፃ (ʿamaṣā)
  choice: अन्याय
  rationale: यह शब्द अन्याय, अधर्म या दुष्टता का भाव दे सकता है; इस प्रसंग में न्याय-संबंधी कथन के लिए ‘अन्याय’ सबसे सीधा और व्यापक विकल्प है।
- source_word: ተዐደዉ፡ እምፍኖተ (taʿaddaw ʾem-fənota)
  choice: मार्ग से हट जाते हैं
  rationale: क्रिया मार्ग को पार करने, उससे विचलित होने या उसका उल्लंघन करने का भाव रखती है; ‘मार्ग से हटना’ रूपक और नैतिक अर्थ दोनों को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘कोई अन्याय नहीं है’ का अगले उपवाक्य से संबंध
  choice: 'इसे स्वतंत्र कथन के रूप में रखा गया: ‘और इसमें कोई अन्याय नहीं है। और वे सभी…’'
  alternative: ‘और उन सभी के लिए कोई अन्याय नहीं है जो मार्ग से हट जाते हैं…’
  rationale: मूल में अगले खंड की शुरुआत ወኵሎሙ (‘और वे सभी’) से होती है। इसे ‘के लिए’ बनाना संयोजक को गलत ढंग से पुनर्व्याख्यायित करेगा और यह अर्थ उत्पन्न कर सकता है कि मार्ग से हटने वालों के विषय में कोई अन्याय नहीं है।
- issue: पद के अंत में अधूरा वाक्य
  choice: अंत में दीर्घ डैश रखा गया
  alternative: पूर्ण विराम लगाकर वाक्य को यहीं समाप्त करना
  rationale: गीइज़ पाठ का विचार अगले पद में पूरा होता है; डैश पद-सीमा को रखते हुए पाठक को संकेत देता है कि वाक्य आगे जारी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘पट्टिकाओं’ और ‘निर्धारित’ जैसे शब्द मूल की औपचारिक अभिलेखीय भाषा को बनाए रखते हैं। वाक्य का अंतिम अपूर्णपन जानबूझकर सुरक्षित रखा गया है, क्योंकि विचार अगले पद में पूरा होता है।
