  terminology: ‘पक्षपात’ and ‘रिश्वत स्वीकार करना’ appropriately express the judicial sense without importing doctrinal interpretation. ‘धर्मी न्यायाधीश’ preserves both the moral qualifier and the judicial office more naturally than ‘धर्मी न्यायी.’
