  yaml_path: translation/extra_canonical/jubilees/005/016.yaml
  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
translation:
  language: hi
  text: और वह न तो पक्षपात करता है, न रिश्वत स्वीकार करता है। जब वह कहता है कि वह हर एक का न्याय करेगा, तब यदि कोई पृथ्वी की सारी वस्तुएँ भी उसे दे दे, तो भी वह न पक्षपात करेगा, न रिश्वत स्वीकार करेगा और न उसके हाथ से कुछ लेगा, क्योंकि वह धर्मी न्यायाधीश है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይነሥእ፡ ገጸ
  choice: पक्षपात करता है
  rationale: शाब्दिक रूप से ‘मुख ग्रहण करना’; न्यायिक प्रसंग में इसका स्वाभाविक हिन्दी अर्थ पक्षपात करना है।
- source_word: ይነሥእ፡ ሕሊና
  choice: रिश्वत स्वीकार करता है
  rationale: यहाँ समानांतर न्यायिक भाषा और किसी के द्वारा पृथ्वी की सारी वस्तुएँ देने की कल्पना अनुचित भेंट या रिश्वत का संकेत करती है; ‘रिश्वत’ आधुनिक हिन्दी में आशय स्पष्ट करती है।
- source_word: ይገበር፡ ዘንተ፡ ለለ፻፻
  choice: हर एक का न्याय करेगा
  rationale: क्रिया का सामान्य अर्थ ‘करना’ है, पर निकटवर्ती न्यायिक प्रसंग में प्रत्येक के विषय में घोषित दंडात्मक न्याय को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ኢይትሜጠው፡ እምእዴሁ
  choice: न उसके हाथ से कुछ लेगा
  rationale: Ge'ez वाक्यांश का अर्थ किसी के हाथ से कुछ लेना या स्वीकार करना है; कर्म निहित है, इसलिए हिन्दी में ‘कुछ’ जोड़ा गया है।
- source_word: መኰንን፡ ጽድቅ
  choice: धर्मी न्यायी
  rationale: संज्ञा-सम्बन्धी Ge'ez पदबंध को संक्षिप्त, प्रतिष्ठित और धर्मशास्त्रीय रूप से तटस्थ हिन्दी में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय न्याय की निष्पक्षता और रिश्वत से अप्रभावितता
  choice: वह न पक्षपात करता है, न रिश्वत स्वीकार करता है
  alternative: वह किसी का मुख नहीं ग्रहण करता और कोई भेंट नहीं लेता
  rationale: चुना हुआ रूप मूल के न्यायिक मुहावरे का अर्थ आधुनिक पाठक के लिए स्पष्ट करता है, बिना किसी सम्प्रदायगत व्याख्या को जोड़े।
- issue: न्याय की निश्चित घोषणा
  choice: जब वह कहता है कि वह हर एक का न्याय करेगा
  alternative: यदि वह कहे कि वह हर एक के साथ ऐसा करेगा
  rationale: प्रसंग घोषित न्याय की निश्चितता पर बल देता है; ‘जब’ हिन्दी में इसे स्वाभाविक रूप से रखता है, जबकि प्रत्येक व्यक्ति पर लागू होने का भाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण न्यायिक-धार्मिक रजिस्टर अपनाया गया है। ‘पक्षपात’, ‘रिश्वत’ और ‘धर्मी न्यायी’ सामान्य पाठकों के लिए स्पष्ट हैं। स्रोत में निहित कर्म को ‘कुछ’ से व्यक्त किया गया है; कोई पूर्ववर्ती, स्रोत-विरुद्ध वैकल्पिक अर्थ पादटिप्पणी में नहीं रखा गया।
