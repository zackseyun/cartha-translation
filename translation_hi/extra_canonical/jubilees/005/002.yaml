  yaml_path: translation/extra_canonical/jubilees/005/002.yaml
  text: And lawlessness increased on the earth, and all flesh corrupted its way, from men to cattle, and to beasts, and to birds, and to everything that moves on the earth. All of them corrupted their ways and their ordinances, and they began to devour one another; and lawlessness increased on the earth, and every imagination of the thoughts of all the children of men was thus evil all the days.
translation:
  language: hi
  text: और पृथ्वी पर अधर्म बढ़ गया, और मनुष्य से लेकर पालतू पशुओं, जंगली पशुओं, पक्षियों और पृथ्वी पर चलने-फिरने वाले हर प्राणी तक, सबने अपना मार्ग बिगाड़ लिया। उन सबने अपने-अपने मार्ग और अपनी व्यवस्थाएँ बिगाड़ लीं, और वे एक-दूसरे को खाने लगे। पृथ्वी पर अधर्म बढ़ गया, और सब मनुष्यों के मन में बनने वाली हर कल्पना सदा बुरी ही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: अधर्म
  rationale: यह शब्द व्यवस्था-विरोध, दुष्टता और अन्याय का व्यापक भाव रखता है; ‘अधर्म’ आधुनिक हिन्दी में इस नैतिक और सामाजिक विस्तार को संक्षेप में व्यक्त करता है।
- source_word: ኵሉ ዘሥጋ
  choice: सभी प्राणियों
  rationale: शाब्दिक अर्थ ‘सारा मांस’ है, पर प्रसंग में मनुष्य और विभिन्न पशु-पक्षी सम्मिलित जीवधारी अभिप्रेत हैं; स्वाभाविक हिन्दी के लिए ‘सभी प्राणियों’ चुना गया।
- source_word: ፍኖተ
  choice: मार्ग
  rationale: नैतिक आचरण या जीवन-रीति के रूपक को बनाए रखने के लिए स्रोत का निकट और परिचित हिन्दी समतुल्य।
- source_word: ሥርዐቶሙ
  choice: अपनी व्यवस्था
  rationale: इसमें नियत क्रम, विधान या स्वभावगत व्यवस्था का भाव हो सकता है; ‘व्यवस्था’ इस व्यापकता को बनाए रखता है।
- source_word: ይትበልዑ በበይናቲሆሙ
  choice: वे एक-दूसरे को खाने लगे
  rationale: पारस्परिक भक्षण के स्रोत-अर्थ को बिना रूपक बनाकर प्रत्यक्ष रूप से रखा गया है।
- source_word: ኵሉ ሕሊና አእምሮ
  choice: मन के विचारों की हर कल्पना
  rationale: दो निकट मानसिक संज्ञाओं की संयुक्त अभिव्यक्ति को सुरक्षित रखते हुए स्वाभाविक हिन्दी वाक्यांश चुना गया।
- source_word: ኵሉ መዋዕለ
  choice: हर समय
  rationale: शाब्दिक ‘सारे दिन’ निरंतरता का मुहावरा है; आधुनिक हिन्दी में ‘हर समय’ वही भाव स्पष्ट करता है।
theological_decisions:
- issue: ‘सभी प्राणियों ने अपना मार्ग बिगाड़ लिया’ में पशु-जगत की नैतिक या सृष्टिगत भ्रष्टता
  choice: स्रोत के व्यापक कथन को यथावत रखा गया
  alternative: इसे केवल मनुष्यों के पाप के कारण प्रकृति पर पड़े प्रभाव के रूप में स्पष्ट करना
  rationale: पाठ स्वयं मनुष्य, पशु, जंगली जीव, पक्षी और चलने वाले प्राणियों को कर्ता बनाता है; किसी विशेष धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया गया।
- issue: ‘व्यवस्था’ का आशय
  choice: अर्थ को व्यापक और अनिर्धारित रखा गया
  alternative: ‘स्वभाव’, ‘नियम’ या ‘सृष्टि-क्रम’
  rationale: गीज़ शब्द विधान, क्रम या निर्धारित रीति की ओर संकेत कर सकता है; किसी एक व्याख्या से अस्पष्टता समाप्त करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सूची की लय तथा उत्पत्ति-वृत्तांत से जुड़ी ‘मार्ग बिगाड़ना’ और ‘मन के विचारों की हर कल्पना’ जैसी स्रोत-प्रतिध्वनियाँ सुरक्षित रखी गई हैं।
