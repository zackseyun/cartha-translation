  yaml_path: translation/extra_canonical/jubilees/005/019.yaml
  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
translation:
  language: hi
  text: परन्तु उन सब पर, जिन्होंने जलप्रलय से पहले[a] अपने आचरण और अपनी योजनाओं को भ्रष्ट कर लिया था, कृपादृष्टि नहीं की गई—केवल नूह पर की गई। उसके पुत्रों के हित में[b] उस पर कृपादृष्टि की गई; क्योंकि उसके कारण उन्हें जलप्रलय के जल से बचाया गया। उसका हृदय अपने सभी मार्गों में धर्मी था, जैसा उसके लिए आज्ञा दी गई थी; और जो कुछ उसके लिए ठहराया गया था, उसमें से वह किसी बात से नहीं हटा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जलप्रलय से पहले’ एक कठिन वाक्यांश का अर्थानुसार अनुवाद है, जिसमें ‘जलप्रलय के जल’ का उल्लेख निहित है। आशय यह है कि उस पीढ़ी में नूह को छोड़ किसी और पर कृपादृष्टि नहीं की गई।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके पुत्रों के कारण’।
    reason: lexical_alternative
lexical_decisions:
- source_word: አማሰኑ፡ ፍኖዊሆሙ፡ ወምክርሙ
  choice: अपने चालचलन और अपनी योजनाओं को भ्रष्ट कर लिया था
  rationale: ‘मार्गों’ का शाब्दिक रूपक बचाते हुए ‘चालचलन’ आधुनिक हिन्दी में नैतिक आचरण को स्वाभाविक ढंग से व्यक्त करता है; ‘योजनाएँ’ ምክር के विचार/परामर्श/योजना-संबंधी अर्थ को रखता है।
- source_word: ተነሥአ፡ ገጸ
  choice: कृपादृष्टि की गई
  rationale: मुख उठाए जाने अथवा अनुकूल मुख किए जाने की सामी अभिव्यक्ति को प्रसंगानुकूल ‘कृपादृष्टि’ से व्यक्त किया गया, बिना इसे पक्षपात के नकारात्मक अर्थ में बदलने के।
- source_word: በእንተ፡ ውሉዱ
  choice: उसके पुत्रों के हित में
  rationale: यहाँ संबंध पुत्रों को कृपा का कारण बताने के बजाय उनके पक्ष में/उनके हितार्थ नूह पर हुई कृपादृष्टि का है; अगली उपवाक्य में उनका नूह के कारण बचना इसकी पुष्टि करता है।
- source_word: ጻድቅ፡ ይእቲ፡ ልቡ
  choice: उसका हृदय ... धर्मी था
  rationale: स्रोत की हृदय-केंद्रित नैतिक भाषा और ‘धर्मी’ की धार्मिक-नैतिक धारणा दोनों सुरक्षित रखी गईं।
- source_word: ኢተዐደወ
  choice: वह किसी बात से नहीं हटा
  rationale: निर्धारित बातों का उल्लंघन न करने अथवा उनसे न भटकने का अर्थ सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नूह और उसके पुत्रों के उद्धार के बीच कारण-संबंध
  choice: पुत्रों के हित में नूह पर कृपादृष्टि हुई, और वे नूह के कारण बचाए गए
  alternative: नूह पर उसके पुत्रों के कारण कृपा हुई
  rationale: 'दोनों निकटवर्ती በእንተ-वाक्यांशों की दिशा अलग रखी गई है: पहला पुत्रों के हित की ओर, दूसरा नूह को उनके उद्धार का आधार बताता है। इससे स्रोत का तनाव और संबंध सुरक्षित रहता है।'
- issue: नूह की धार्मिकता और आज्ञापालन
  choice: हृदय की धार्मिकता को उसके समस्त चालचलन, आज्ञा और ठहराई गई बातों के पालन से जोड़ा गया
  alternative: नूह को पूर्णतः निष्पाप घोषित करना
  rationale: पाठ उसके इस प्रसंगगत धर्मी चालचलन और न हटने की बात करता है; इससे व्यापक निष्पापता का सिद्धांत निकालना स्रोत से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘परन्तु’, ‘कृपादृष्टि’, ‘धर्मी’ और ‘ठहराया गया’ पाठ की प्राचीन धार्मिक गरिमा रखते हैं; वाक्य-विन्यास को हिन्दी की स्वाभाविक पठनीयता के लिए नियंत्रित किया गया है।
