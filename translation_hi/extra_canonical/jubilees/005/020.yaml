  yaml_path: translation/extra_canonical/jubilees/005/020.yaml
  text: And the Lord said that He would destroy everything that is on the dry land, from man to cattle, to beasts, and to the birds of heaven, and to whatever moves on the earth.
translation:
  language: hi
  text: और प्रभु ने कहा कि वह सूखी भूमि पर जो कुछ है, उस सबको नष्ट कर देगा[a]—मनुष्य से लेकर पालतू पशुओं तक, जंगली जानवरों तक, आकाश के पक्षियों तक और पृथ्वी पर चलने-फिरनेवाले हर जीव तक।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पूर्ववर्ती अनुवाद-रूप: “सूखी भूमि पर जो कुछ है, वह सब नष्ट हो जाए—मनुष्य से लेकर पालतू पशुओं, जंगली जानवरों, आकाश के पक्षियों और धरती पर चलने-फिरनेवाले हर जीव तक।”'
    reason: पूर्व प्रचलित प्रत्यक्ष और निष्क्रिय अनुवाद-प्रस्तुति को दर्ज करना, यद्यपि मूल क्रियारूप सक्रिय परोक्ष कथन का अधिक समर्थन करता है।
  - marker: b
    text: 'शाब्दिक क्रम में: “मनुष्य से पशु तक, जंगली जानवरों तक, आकाश के पक्षियों तक और पृथ्वी पर चलने-फिरनेवाले तक।”'
    reason: मूल में बार-बार आए ‘तक’ वाले श्रेणीक्रम को दिखाना; हिन्दी मुख्य पाठ में स्वाभाविकता के लिए अंतिम पद में ‘हर जीव’ स्पष्ट किया गया है।
lexical_decisions:
- source_word: የብስ
  choice: सूखी भूमि
  rationale: यह शब्द जल के विपरीत स्थल या शुष्क भूमि को सूचित करता है; ‘सूखी भूमि’ मूल भेद को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: እንስሳ
  choice: पालतू पशु
  rationale: यहाँ अगली श्रेणी አራዊት (‘जंगली जानवर’) से भेद बनाए रखने के लिए घरेलू या पालतू पशुओं का अर्थ उपयुक्त है।
- source_word: አራዊት
  choice: जंगली जानवर
  rationale: यह እንስሳ से अलग वन्य पशुओं की श्रेणी को व्यक्त करता है।
- source_word: አዕዋፈ ሰማይ
  choice: आकाश के पक्षी
  rationale: मूल अभिव्यक्ति का निकट और हिन्दी में बोधगम्य रूप।
- source_word: ዘይትሐወስ ውስተ ምድር
  choice: धरती पर चलने-फिरनेवाला हर जीव
  rationale: क्रिया व्यापक रूप से गति करने या इधर-उधर चलने का भाव देती है; इसे केवल ‘रेंगनेवाले’ जीवों तक सीमित नहीं किया गया।
theological_decisions:
- issue: प्रत्यक्ष या परोक्ष कथन
  choice: 'परोक्ष कथन: ‘प्रभु ने कहा कि वह ... नष्ट कर देगा’'
  alternative: 'प्रत्यक्ष निष्क्रिय कथन: ‘सूखी भूमि पर जो कुछ है, वह सब नष्ट हो जाए’'
  rationale: ይደመስስ तीसरे पुरुष का सक्रिय क्रियारूप है और ኵሎ उसका कर्म है; इसलिए मुख्य पाठ में प्रभु को नाश करनेवाले कर्ता के रूप में रखकर परोक्ष कथन प्रस्तुत किया गया है। पुराने प्रत्यक्ष-परोक्ष विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नष्ट कर देगा’ मूल की सक्रिय वाच्यता बनाए रखता है। श्रेणियों का अंतर स्पष्ट करने के लिए ‘पालतू पशु’ और ‘जंगली जानवर’ चुने गए हैं; अंतिम व्यापक अभिव्यक्ति को अनावश्यक रूप से केवल रेंगनेवाले जीवों तक सीमित नहीं किया गया।
