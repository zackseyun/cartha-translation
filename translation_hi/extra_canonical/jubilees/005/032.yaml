  text: और उसी महीने के सत्ताईसवें दिन उसने जहाज़ का द्वार खोला और उसमें से जंगली पशुओं, पालतू पशुओं, पक्षियों और हर चलने-फिरने वाले जीव को बाहर भेज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታቦት
  choice: जहाज़
  rationale: यहाँ नूह की जलप्रलय वाली बड़ी नाव अभिप्रेत है; आधुनिक हिन्दी में ‘जहाज़’ सहज और प्रसंगानुकूल है।
- source_word: አራዊት
  choice: जंगली पशु
  rationale: यह शब्द अगले पद ‘እንስሳ’ से भिन्न वन्य पशुओं की श्रेणी बताता है।
- source_word: እንስሳ
  choice: पालतू पशु
  rationale: ‘አራዊት’ के साथ श्रेणीगत विरोध बनाए रखने के लिए इसे घरेलू या पालतू पशुओं के रूप में व्यक्त किया गया है।
- source_word: አዕዋፍ
  choice: पक्षी
  rationale: यह सामान्य और स्वाभाविक हिन्दी शब्द स्रोत की पक्षी-श्रेणी को ठीक व्यक्त करता है।
- source_word: ዘይትነወስ
  choice: हर रेंगने-चलने वाला जीव
  rationale: मूल का व्यापक अर्थ ‘जो गति करता है’ है; हिन्दी में यह रूप भूमि पर चलने या रेंगने वाले जीवों का आशय स्पष्ट करता है और केवल सरीसृपों तक सीमित नहीं करता।
