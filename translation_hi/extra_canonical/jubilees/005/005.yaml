lexical_decisions:
- source_word: ባሕቲቱ
  choice: केवल
  rationale: यह नूह के अकेले होने पर दिए गए बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ረከበ፡ ሞገሰ
  choice: अनुग्रह पाया
  rationale: क्रिया और संज्ञा का यह संयोजन कृपा अथवा स्वीकार्यता प्राप्त होने का अर्थ देता है; ‘अनुग्रह पाया’ मूल अभिव्यक्ति के निकट और हिन्दी बाइबिलीय शैली में सुबोध है।
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለእግዚአብሔር
  choice: प्रभु की दृष्टि में
  rationale: शाब्दिक ‘प्रभु की आँखों के सामने’ का स्वाभाविक हिन्दी समतुल्य है और ईश्वरीय स्वीकृति का भाव सुरक्षित रखता है।
theological_decisions:
- issue: नूह के विशिष्ट रूप से अनुग्रह पाने का कथन
  choice: केवल नूह ने ... अनुग्रह पाया
  alternative: नूह अकेले ने ... कृपा पाई
  rationale: मूल में नूह पर विशेष बल है; अनुवाद यह बल बनाए रखता है, पर इससे अनुग्रह के कारण या स्वरूप के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
