base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/001.yaml
  text: And it came to pass, when the children of men began to multiply on the face of the earth, and daughters were born to them, that in a certain year of this jubilee the angels of God saw them, that they were beautiful to look upon; and they took wives for themselves from all whom they chose, and they bore children for them, and these were the giants.
translation:
  language: hi
  text: और ऐसा हुआ कि जब मनुष्यों की सन्तानें पृथ्वी पर बढ़ने लगीं और उनके यहाँ बेटियाँ जन्मीं, तब इस जुबली के किसी एक वर्ष में परमेश्वर के स्वर्गदूतों ने उन्हें देखा कि वे देखने में सुन्दर थीं। इसलिए उन्होंने उन सभी में से, जिन्हें उन्होंने चुना, अपने लिए पत्नियाँ ले लीं। उन स्त्रियों ने उनके लिए सन्तानें जन्मीं, और वे विशालकाय लोग थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: मनुष्यों की सन्तान
  rationale: यह गीइज़ पदबंध मानवजाति के वंशजों/मनुष्यों के बच्चों के लिए प्रयुक्त पारंपरिक अभिव्यक्ति है; हिन्दी में अर्थ स्पष्ट रखते हुए इसकी सामूहिकता बचाई गई है।
- source_word: መላእክተ፡ እግዚአብሔር
  choice: परमेश्वर के स्वर्गदूत
  rationale: मूल का सीधा अर्थ ‘परमेश्वर के दूत/स्वर्गदूत’ है। प्रसंग में अलौकिक प्राणियों का संकेत स्पष्ट करने के लिए ‘स्वर्गदूत’ स्वाभाविक हिन्दी विकल्प है।
- source_word: ኢዮቤልው
  choice: जुबली
  rationale: पुस्तक की कालगणना से जुड़े तकनीकी पद को परिचित लिप्यंतरण में रखा गया है; इसे सामान्य ‘जयन्ती’ कहने से उत्सव का आधुनिक अर्थ आ सकता था।
- source_word: ረዐይት
  choice: दैत्य
  rationale: यहाँ पद असाधारण विशाल प्राणियों/giants को सूचित करता है; आधुनिक हिन्दी में ‘दैत्य’ सबसे सहज और प्रसंगानुकूल चयन है।
theological_decisions:
- issue: ‘परमेश्वर के स्वर्गदूतों’ का कर्ता होना
  choice: स्वर्गदूतों को ही देखने, चुनने और पत्नियाँ लेने वाला कर्ता बनाए रखा गया
  alternative: इसे ‘परमेश्वर के पुत्रों’ या मनुष्य-वंश के किसी समूह के रूप में समझाना
  rationale: प्राप्त गीइज़ पाठ स्पष्ट रूप से መላእክተ፡ እግዚአብሔር (‘परमेश्वर के स्वर्गदूत’) पढ़ता है; अनुवाद में किसी वैकल्पिक व्याख्यात्मक परंपरा को आरोपित नहीं किया गया।
- issue: अन्तिम सर्वनाम का संदर्भ
  choice: दैत्य उन स्त्रियों से जन्मी सन्तानें थीं
  alternative: दैत्य स्वर्गदूत स्वयं थे
  rationale: निकटतम वाक्य-रचना और परामर्श-पाठ अंतिम कथन को जन्मी हुई सन्तानों से जोड़ते हैं; हिन्दी में संदर्भ को स्वाभाविक रूप से स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। लम्बे मूल वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया, पर घटनाक्रम और कारण-संबंध सुरक्षित हैं। ‘उनके यहाँ बेटियाँ जन्मीं’ स्वाभाविक हिन्दी है, जबकि ‘उन सभी में से, जिन्हें उन्होंने चुना’ मूल की चयन-विषयक व्यापकता को बनाए रखता है।
