lexical_decisions:
- source_word: በሠርቀ፡ ወርኀ፡
  choice: महीने के आरम्भ में
  rationale: शाब्दिक रूप से यह चाँद/महीने के उदय की ओर संकेत करता है और नए महीने के आरम्भ का कालबोध देता है। आधुनिक हिन्दी में यह स्वाभाविक है तथा अनावश्यक रूप से अमावस्या का निश्चित खगोलीय अर्थ आरोपित नहीं करता।
- source_word: አርእስተ፡ አድባር፡
  choice: पहाड़ों की चोटियाँ
  rationale: ‘पहाड़ों के सिर’ के स्रोत-रूपक का स्वाभाविक हिन्दी समतुल्य।
- source_word: አስተርአየ
  choice: दिखाई दीं
  rationale: प्रकट होने अथवा दृष्टिगोचर होने का सरल, प्रसंगानुकूल अनुवाद।
- source_word: ምድር
  choice: धरती
  rationale: यहाँ जल घटने पर भूमि के दिखाई देने का व्यापक अर्थ सुरक्षित रहता है।
