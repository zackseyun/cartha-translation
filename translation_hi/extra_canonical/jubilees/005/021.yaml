  text: And he commanded Noah to make for himself an ark, so that he might be saved from the waters of the Flood.
translation:
  language: hi
  text: और उसने नूह को आज्ञा दी कि वह अपने लिए एक जहाज़ बनाए, ताकि वह जलप्रलय के पानी से बच जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዘዞ
  choice: आज्ञा दी
  rationale: गीज़ क्रिया आदेश देने का स्पष्ट भाव व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: ታቦተ
  choice: जहाज़
  rationale: यहाँ शब्द नूह के जलप्रलय-वाले बड़े जलयान को दर्शाता है। ‘जहाज़’ साधारण पाठक के लिए स्पष्ट है और ‘सन्दूक’ से उत्पन्न संभावित भ्रम से बचाता है।
- source_word: ማየ፡ አይኅ
  choice: जलप्रलय का पानी
  rationale: मूल पदबंध में ‘प्रलय/बाढ़ का पानी’ है; यह चयन घटना की विशिष्टता और पानी से बचाए जाने—दोनों को स्पष्ट रखता है।
- source_word: ይድኀኖ
  choice: बच जाए
  rationale: क्रिया का अर्थ बचना या सुरक्षित किया जाना हो सकता है। हिन्दी का यह रूप प्रसंग में स्वाभाविक है और उद्धार की अनावश्यक रूप से संकीर्ण धर्मवैज्ञानिक व्याख्या नहीं थोपता।
theological_decisions:
- issue: आज्ञा देने वाले कर्ता की पहचान
  choice: सर्वनाम ‘उसने’ को बनाए रखा
  alternative: ‘परमेश्वर ने’
  rationale: दिए गए गीज़ पाठ में कर्ता सर्वनाम से व्यक्त है। संदर्भ कर्ता की पहचान स्पष्ट कर सकता है, पर इस पद में नाम जोड़ना मूल से अधिक स्पष्टता थोपता।
- issue: बचने की वाच्यता
  choice: ‘वह ... बच जाए’
  alternative: ‘उसे ... बचाया जाए’
  rationale: मूल क्रिया उद्धार/बचाव का भाव देती है और रूपगत रूप से उसका बचना व्यक्त करती है। हिन्दी में ‘बच जाए’ उद्देश्यवाचक संरचना के साथ सहज है तथा बचाव के अंतिम कर्ता पर अतिरिक्त दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखा गया है। मूल की उद्देश्यवाचक संरचना तथा सर्वनामगत अस्पष्टता सुरक्षित रखी गई है।
