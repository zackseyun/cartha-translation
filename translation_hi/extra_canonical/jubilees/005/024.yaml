base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/024.yaml
  text: And the Lord opened seven floodgates of heaven and the openings of the fountains of the great deep[a], seven openings in all, and the floodgates poured down water from heaven for forty days and forty nights.
translation:
  language: hi
  text: और प्रभु ने आकाश के सात जल-द्वार खोले और महान गहराई के सोतों के सात खुलाव भी खोले[a]। उन जल-द्वारों से चालीस दिन और चालीस रात तक आकाश से पानी बरसता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ में “सात मुंह, गिनती के अनुसार” है। यहाँ “खुलाव” उस शाब्दिक बिंब को स्वाभाविक हिन्दी में व्यक्त करता है; यह महान गहराई के सोतों के सात खुलावों को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: आकाश के जल-द्वार
  rationale: यह शब्द आकाश से जल छोड़े जाने वाले द्वारों या कपाटों का बिंब देता है। ‘जल-द्वार’ उस प्राचीन ब्रह्मांडीय चित्र को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: विशाल गहरे जल के सोतों के मुहाने
  rationale: ‘सोतों’ से जल-स्रोत का अर्थ और ‘मुहाने’ से मूल पाठ का मुख/खुलाव वाला ठोस बिंब सुरक्षित रहता है; ‘विशाल गहरा जल’ प्राचीन गहन जलराशि को किसी आधुनिक भूवैज्ञानिक धारणा में सीमित नहीं करता।
- source_word: በሰብዑ፡ አፈወ፡ በኍልቍ
  choice: गिनती में सात मुहाने
  rationale: यह गीइज़ की संख्यात्मक अभिव्यक्ति और ‘मुंह/मुहाने’ के बिंब को सीधे बनाए रखता है, बजाय इसे केवल सामान्य बाढ़-वर्णन बना देने के।
- source_word: ይውርዱ፡ ማየ፡ እምሰማይ
  choice: आकाश से पानी बरसता रहा
  rationale: मूल में जल के ऊपर से नीचे आने का भाव है। हिन्दी में ‘बरसता रहा’ चालीस दिन और रात की निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: प्राचीन ब्रह्मांडीय भाषा को ऐतिहासिक मौसम-वर्णन में समतल करना
  choice: आकाश के जल-द्वार और गहरे जल के सोतों के मुहाने—दोनों बिंब सुरक्षित रखे गए
  alternative: इसे केवल ‘बहुत तेज वर्षा हुई और भूमिगत जल फूट पड़ा’ कहना
  rationale: मूल पाठ की संरचित ब्रह्मांडीय कल्पना पाठ का वास्तविक अंग है; अनुवाद को उसकी आधुनिक वैज्ञानिक व्याख्या या निराकरण नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जल-द्वार’, ‘सोतों’ और ‘मुहाने’ जैसे शब्द मूल के ठोस बिंबों को बचाते हैं; वाक्य-रचना को पठनीय बनाने के लिए दूसरे खंड को अलग वाक्य बनाया गया है।
