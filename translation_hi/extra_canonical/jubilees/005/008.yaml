  yaml_path: translation/extra_canonical/jubilees/005/008.yaml
  text: And he said, “My spirit shall not abide upon man forever, for they too are flesh; and their days shall be one hundred and twenty years.”
translation:
  language: hi
  text: और उसने कहा, “मेरी आत्मा मनुष्य पर सदा ठहरी न रहेगी,[a] क्योंकि वे भी मांस हैं; और उनके दिन एक सौ बीस वर्ष होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आत्मा मनुष्य के भीतर सदा ठहरी न रहेगी।” मूल पाठ में सामान्य अर्थ “पर” है।
    reason: स्थानवाचक वाक्यांश के वैकल्पिक अर्थ की जानकारी देते हुए गीज़ के प्राथमिक अर्थ को मुख्य पाठ में सुरक्षित रखना।
lexical_decisions:
- source_word: መንፈስየ (manfasəya)
  choice: मेरा आत्मा
  rationale: प्रथम पुरुष संबंधसूचक रूप को निकटता से रखा गया; ईश्वर की आत्मा के लिए हिन्दी बाइबलीय प्रयोग के अनुरूप पुल्लिंग रूप अपनाया गया।
- source_word: ይነብር (yənabbər)
  choice: बना न रहेगा
  rationale: क्रिया के रहने/ठहरे रहने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዲበ (diba)
  choice: पर
  rationale: गीज़ का स्पष्ट स्थानवाचक अर्थ ‘ऊपर/पर’ सुरक्षित रखा गया; इसे उत्पत्ति के प्रचलित पाठ से मिलाने के लिए ‘में’ नहीं किया गया।
- source_word: ሰብእ (sabəʾ)
  choice: मनुष्य
  rationale: यहाँ जातिगत/समष्टिगत मानवता का एकवचन अर्थ है।
- source_word: እሙንቱኒ (ʾəmuntu-ni)
  choice: वे भी
  rationale: सर्वनाम के साथ लगे -ኒ का ‘भी’ अर्थ स्पष्ट रूप से रखा गया।
- source_word: ሥጋ (śəga)
  choice: मांस
  rationale: शारीरिक, नश्वर मानवीय दशा का ठोस स्रोत-रूप बनाए रखा गया; व्याख्यात्मक ‘नश्वर’ से प्रतिस्थापित नहीं किया।
- source_word: ምእት ወዕሥራ ዓመት
  choice: एक सौ बीस वर्ष
  rationale: संख्या को सीधे और प्रचलित हिन्दी रूप में प्रस्तुत किया गया।
theological_decisions:
- issue: आत्मा का मनुष्य के संबंध में स्थान
  choice: मनुष्य पर
  alternative: मनुष्य में
  rationale: स्रोत में ዲበ का मूल अर्थ ‘पर/ऊपर’ है। ‘में’ अधिक परिचित उत्पत्ति-पाठ से सामंजस्य बैठाता, पर गीज़ की विशिष्ट शब्दावली खो देता।
- issue: ‘एक सौ बीस वर्ष’ का आशय
  choice: उनके दिन एक सौ बीस वर्ष होंगे
  alternative: उनकी आयु एक सौ बीस वर्ष होगी / जलप्रलय तक एक सौ बीस वर्ष रहेंगे
  rationale: स्रोत की संरचना और उसकी संभावित अर्थगत अस्पष्टता सुरक्षित रखी गई—यह मानव आयु की सीमा है या न्याय से पहले की अवधि, इसे मुख्य पाठ में निर्णीत नहीं किया गया।
- issue: मनुष्यों के मांस होने में समावेशी बल
  choice: वे भी मांस हैं
  alternative: वे मांस हैं
  rationale: स्रोत के -ኒ अव्यय का ‘भी’ अर्थ बनाए रखा गया, बिना यह स्पष्ट किए कि तुलना किससे है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली रखी गई है। ‘मेरा आत्मा’ और ‘मांस’ जैसे पद स्रोत की धर्मवैचारिक भाषा को बिना व्याख्यात्मक विस्तार के बनाए रखते हैं; वाक्य की प्राचीन उद्घोषणात्मक लय भी संरक्षित है।
