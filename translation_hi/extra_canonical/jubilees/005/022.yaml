    rationale: ‘जैसी उसे आज्ञा मिली थी’ is a looser paraphrase and shifts the construction. ‘जैसा उसे आज्ञा दी गई थी’ preserves the intended passive alternative more closely.
  revised_text: और नूह ने जहाज़ को हर प्रकार से वैसा ही बनाया, जैसा उसने उसे आज्ञा दी थी,[a] छब्बीसवीं जुबली के पाँचवें सप्ताह के पाँचवें वर्ष में।
