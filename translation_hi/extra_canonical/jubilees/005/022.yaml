base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/022.yaml
  text: And Noah made the ark in every respect as He commanded him, in the twenty-sixth jubilee of years, in the fifth week, in the fifth year.
translation:
  language: hi
  text: और नूह ने जहाज़ को हर प्रकार से वैसा ही बनाया, जैसा उसने उसे आज्ञा दी थी,[a] छब्बीसवीं जुबली के पाँचवें सप्ताह के पाँचवें वर्ष में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, जैसा उसे आज्ञा दी गई थी।
    reason: सक्रिय गीज़ वाक्य के लिए अंग्रेज़ी लेखा-पथ में दर्ज भाववाच्य वैकल्पिक अर्थ को स्वाभाविक हिन्दी में दर्शाने के लिए।
lexical_decisions:
- source_word: ታቦተ
  choice: जहाज़
  rationale: यहाँ शब्द नूह द्वारा बनाए गए जलपोत/सन्दूक के लिए है; आधुनिक हिन्दी में ‘जहाज़’ प्रसंग को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: በኵሉ
  choice: हर बात में
  rationale: शाब्दिक अर्थ ‘सब में/हर प्रकार से’ है; यह निर्माण में आज्ञा के पूर्ण अनुपालन को सहज हिन्दी में दर्शाता है।
- source_word: በዕሥራ ወስድስቱ ኢዮቤልው ዓመታት
  choice: वर्षों की छब्बीसवीं जुबली में
  rationale: स्रोत की संख्या बीस और छह, अर्थात छब्बीस, को बनाए रखा गया है; ‘जुबली’ ग्रन्थ की कालगणना का पारिभाषिक पद है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: जुबली की कालगणना में यह सात वर्षों के समूह का पारिभाषिक पद है; ‘सप्ताह’ उस संरचना को बनाए रखता है।
theological_decisions:
- issue: አዘዞ में कर्ता और कर्म
  choice: जैसा उसने उसे आज्ञा दी थी
  alternative: जैसी उसे आज्ञा मिली थी
  rationale: गीज़ क्रिया सक्रिय है और उसमें पुरुष कर्म-प्रत्यय है—‘उसने उसे आज्ञा दी’। निकटवर्ती उद्धरण में कर्ता का नाम नहीं है, इसलिए हिन्दी में सर्वनाम रखकर स्रोत की अंतर्निहित ईश-संदर्भता तथा व्याकरणिक अस्पष्टता दोनों सुरक्षित रखी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। जुबली-कालगणना की पारिभाषिक भाषा सुरक्षित रखी गई है; ‘पाँचवें सप्ताह के पाँचवें वर्ष’ से पदानुक्रम स्पष्ट होता है।
