  terminology: ‘जहाज़’ is a clear modern Hindi term for Noah’s vessel in this context. ‘जुबली’ and ‘सप्ताह’ appropriately retain the work’s technical calendrical terminology. The footnote should phrase the passive alternative idiomatically.
