  text: And he said, “I will destroy man and all flesh upon the face of the earth, which I created.”
translation:
  language: hi
  text: और उसने कहा, “मैं मनुष्य को और पृथ्वी की सतह पर रहने वाले सभी देहधारियों को, जिन्हें मैंने रचा है, नष्ट कर दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አይመሰለ
  choice: मैं ... नष्ट कर दूँगा
  rationale: संदर्भ और प्रमाणित पाठ के अनुसार यह विनाश की प्रथम-पुरुष घोषणा है; आधुनिक हिन्दी में भविष्यकाल को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ሰብእ
  choice: मनुष्य
  rationale: सामूहिक अर्थ में मानवजाति को सूचित करने वाला एकवचन रखा गया है।
- source_word: ኵሉ ዘሥጋ
  choice: सभी देहधारी
  rationale: शाब्दिक अर्थ ‘सब जो देह है/सारा शरीरधारी जगत’ को प्राकृतिक हिन्दी में व्यक्त करता है और इसे केवल मनुष्यों तक सीमित नहीं करता।
- source_word: በመልዕልተ ገጸ ምድር
  choice: पृथ्वी के मुख पर के
  rationale: गीज़ उपसर्ग በ ‘पर’ का अर्थ देता है; ‘पृथ्वी के मुख पर से’ कहना स्रोत में अनुपस्थित अपादानार्थ जोड़ देता।
- source_word: ዘፈጠርኩ
  choice: जिन्हें मैंने रचा है
  rationale: सृष्ट वस्तुओं की ओर लौटते संबंधवाचक उपवाक्य को बनाए रखा गया है; ‘रचा’ dignified और सामान्य हिन्दी है।
theological_decisions:
- issue: ‘सारा शरीर’ का आशय
  choice: सभी देहधारी
  alternative: सारा शरीर / समस्त प्राणी
  rationale: यह पद मनुष्य से आगे जीवधारी सृष्टि को समेटता है; ‘सभी देहधारी’ मूल की देह-संबंधी अभिव्यक्ति और उसके व्यापक आशय दोनों को बनाए रखता है।
- issue: विनाश का स्थान अथवा वहाँ से हटाया जाना
  choice: पृथ्वी के मुख पर के ... नष्ट कर दूँगा
  alternative: पृथ्वी के मुख पर से ... मिटा दूँगा
  rationale: मूल में ‘पर’ है, ‘पर से’ नहीं। इसलिए उत्पत्ति 6:7 जैसे समानांतर पाठ से अपादानार्थ आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘पृथ्वी के मुख’ जैसी बाइबिलीय छवि को सुरक्षित रखा गया है, जबकि वाक्य-विन्यास हिन्दी पाठक के लिए स्वाभाविक बनाया गया है।
