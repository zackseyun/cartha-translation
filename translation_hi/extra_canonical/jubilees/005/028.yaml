translation:
  language: hi
  text: और जहाज़ आगे बढ़ा और अरारात के पहाड़ों में से एक, लूबार की चोटी पर आकर ठहर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታቦት
  choice: जहाज़
  rationale: यहाँ शब्द नूह के जलप्रलय वाले बड़े जलयान को सूचित करता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘जहाज़’ स्वाभाविक और स्पष्ट है।
- source_word: ወሖረት
  choice: बहता हुआ
  rationale: मूल क्रिया का सामान्य अर्थ ‘गया/आगे बढ़ा’ है; जलप्रलय के प्रसंग में जहाज़ की जल पर गति को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘बहता हुआ’ चुना गया है, बिना किसी विशेष दिशा को जोड़ने के।
- source_word: ወአዕረፈት
  choice: आकर टिक गया
  rationale: यह क्रिया गति के समाप्त होने और स्थिर हो जाने का भाव देती है; ‘टिक गया’ इस प्रसंग में सहज हिन्दी है।
- source_word: ዲበ፡ ርእሰ
  choice: की चोटी पर
  rationale: शाब्दिक अर्थ ‘के सिर/शीर्ष पर’ है; पर्वत के संदर्भ में ‘चोटी पर’ स्वाभाविक समतुल्य है।
- source_word: ሉባር
  choice: लूबार
  rationale: स्थान-नाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: አሐዱ፡ እምአድባረ፡ አራራት
  choice: अरारात के पहाड़ों में से एक
  rationale: मूल की बहुवचन संरचना और ‘उनमें से एक’ के संबंध को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
