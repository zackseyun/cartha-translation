base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/014.yaml
  text: And if they do not walk in it[a], judgment is written for every creature and for every kind. And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the deep or in the place of darkness—all their judgments are ordained and written and engraved.
translation:
  language: hi
  text: और यदि वे उसमें न चलें, तो हर प्राणी और हर प्रकार के लिए न्याय-निर्णय लिखा है। और स्वर्ग में, पृथ्वी पर, प्रकाश में, अंधकार में, शिओल में, अथाह गहराई में, या अंधकार के स्थान में ऐसी कोई वस्तु नहीं है जिसके लिए न्याय-निर्णय ठहराए, लिखे और अंकित न किए गए हों।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वर्ग, पृथ्वी, प्रकाश, अंधकार, शिओल, अथाह गहराई और अंधकार के स्थान का यह क्रम समूची सृष्टि को समेटने वाली प्राचीन ब्रह्मांडीय भाषा है। ‘शिओल’ मृतकों के लोक का पारंपरिक नाम है।
    reason: cultural_note
  - marker: b
    text: अंतिम पंक्ति के प्राप्त पाठ में कठिनाई है। इसे ‘सब कुछ ठहराया, लिखा और अंकित है’ भी समझा गया है; यहाँ संभावित पाठ ‘उनके न्याय-निर्णय’ के अनुसार अनुवाद किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ባቲ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन संकेत को अनावश्यक रूप से किसी निश्चित पूर्ववर्ती संज्ञा से नहीं बाँधा गया; इससे मूल का संदर्भगत संकेत और उसकी संभावित अस्पष्टता बनी रहती है।
- source_word: ትዝምድ
  choice: कुल
  rationale: यह वंश, संबंध-समूह या प्रकार का बोध करा सकता है। ‘कुल’ आधुनिक हिन्दी में सामूहिक वंशगत अर्थ देता है और ‘जाति’ के आधुनिक सामाजिक अर्थ से बचता है।
- source_word: ሲኦል
  choice: शिओल
  rationale: मृतकों के लोक के मूल सांस्कृतिक नाम को सामान्य ‘नरक’ से बदलना धर्मवैचारिक अर्थ आरोपित कर सकता था; इसलिए लिप्यंतरण रखा गया।
- source_word: ቀላይ
  choice: अथाह गहराई
  rationale: यह गहरे अथवा अगाध जल-क्षेत्र/गहराई का संकेत देता है; ‘अथाह गहराई’ व्यापक ब्रह्मांडीय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሥሩዕ፡ ወጽሑፍ፡ ወቅሩጽ
  choice: ठहराए, लिखे और अंकित
  rationale: तीनों क्रियात्मक विशेषणों को बनाए रखकर निर्धारित न्याय और स्थायी अभिलेख की त्रिस्तरीय छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: शिओल की पहचान
  choice: ‘शिओल’ को लिप्यंतरित किया गया
  alternative: ‘अधोलोक’ या ‘नरक’
  rationale: ‘नरक’ दंड-स्थान का अधिक विशिष्ट अर्थ जोड़ सकता है, जबकि स्रोत मृतकों के लोक का पारंपरिक नाम देता है।
- issue: अंतिम उपवाक्य में न्याय का कर्ता/संबंध
  choice: ‘जिसके सभी न्याय-निर्णय ... न किए गए हों’
  alternative: ‘सब कुछ ठहराया, लिखा और अंकित है’
  rationale: प्राप्त पाठ के संदिग्ध रूप ዘነኒሆሙ के पीछे ‘उनके न्याय-निर्णय’ का पाठ संभावित है; संशोधित अर्थ न्यायिक केंद्र को बनाए रखता है, पर टिप्पणी में पाठगत कठिनाई स्वीकार की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। न्यायिक शब्दावली तथा ‘ठहराए, लिखे और अंकित’ की अभिलेखीय पुनरुक्ति जानबूझकर सुरक्षित है। ब्रह्मांडीय सूची को संक्षिप्त नहीं किया गया।
