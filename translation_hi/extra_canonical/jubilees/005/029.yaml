base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/029.yaml
  text: And in the fourth month the fountains of the great deep were closed[a], and the floodgates of heaven were restrained; and at the beginning of the seventh month all the mouths of the depths of the earth were opened, and the waters began to descend into the lower deep.
translation:
  language: hi
  text: और चौथे महीने में महान गहराई के सोते बन्द कर दिए गए[a], और आकाश के जल-द्वार रोक दिए गए। फिर सातवें महीने के आरम्भ में धरती की गहराइयों के सभी मुहाने खोल दिए गए, और जल निचली गहराई में उतरने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह क्रम विरोधाभासी लग सकता है: महान गहराई के सोते ‘बन्द’ किए जाते हैं, फिर धरती की गहराइयों के मुहाने ‘खोले’ जाते हैं ताकि जल निचली गहराई में उतर सके। अनुवाद इस प्राचीन ब्रह्मांडीय क्रम को सामंजस्य बैठाकर बदलने के बजाय ज्यों का त्यों रखता है।'
    reason: textual_variant
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: विशाल अथाह जल की धाराओं के सोते
  rationale: ‘महान गहराई/अथाह जल’ की ब्रह्मांड-कल्पना और जल-स्रोतों का भाव स्पष्ट रखने के लिए।
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: आकाश के जल-द्वार
  rationale: आकाश से जल आने वाले द्वारों की प्राचीन ब्रह्मांडीय छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: በሠርቀ፡ ወርኀ፡ ሳብዕ
  choice: सातवें महीने के आरम्भ में
  rationale: समय-सूचक पद को अनावश्यक रूप से ‘नए चाँद’ के रूप में विशिष्ट किए बिना उसके आरम्भ-बोध को व्यक्त करता है।
- source_word: አፈወ፡ መዓምቅተ፡ ምድር
  choice: धरती की गहराइयों के सभी मुहाने
  rationale: ‘मुख/मुहाने’ और भूमिगत गहराइयों की स्थानिक छवि दोनों को सुरक्षित रखता है।
- source_word: ቀላይ፡ ታሕቲት
  choice: नीचे का अथाह जल
  rationale: निचली गहराई अथवा अधोलोक-जैसे जल-क्षेत्र की प्राचीन ब्रह्मांडीय धारणा को बिना आधुनिक व्याख्या थोपे व्यक्त करता है।
theological_decisions:
- issue: सोते बन्द होने और धरती की गहराइयों के मुहाने खुलने का प्रत्यक्ष तनाव
  choice: दोनों क्रियाओं को ज्यों का त्यों रखा गया
  alternative: वाक्य को इस प्रकार सामंजस्य देना कि वही मार्ग पहले बन्द और फिर निकासी के लिए खुला बताया जाए
  rationale: स्रोत का क्रम ब्रह्मांडीय दृष्टि से तनावपूर्ण है; अनुवाद इसे चुपचाप सुलझाता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अथाह जल’, ‘जल-द्वार’ और ‘मुहाने’ से प्राचीन ब्रह्मांडीय चित्र सुरक्षित रखा गया है।
