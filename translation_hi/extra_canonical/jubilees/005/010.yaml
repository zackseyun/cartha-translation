  yaml_path: translation/extra_canonical/jubilees/005/010.yaml
  text: And their fathers were watching, and after this they were bound in the depths of the earth forever, until the day of the great judgment, for judgment upon all who corrupted their ways and their deeds before the Lord.
translation:
  language: hi
  text: और उनके पिता देखते रहे, और इसके बाद उन्हें पृथ्वी की गहराइयों में सदा के लिए बाँध दिया गया, उस महान न्याय के दिन तक—उस न्याय के लिए जो उन सब पर होगा जिन्होंने प्रभु के सामने अपने मार्गों और अपने कामों को भ्रष्ट किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኔጽሩ
  choice: देखते रहे
  rationale: क्रिया के देखने या निगाह रखने के सामान्य अर्थ को बनाए रखा गया है; प्रसंग के आधार पर कोई अधिक विशिष्ट अर्थ नहीं थोपा गया।
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: पृथ्वी की गहराइयों में
  rationale: स्थान-संबंधी गीइज़ पदबंध का स्वाभाविक और निकट हिंदी रूप।
- source_word: ተአስሩ
  choice: बाँध दिए गए
  rationale: मूल के कर्मवाच्य को बनाए रखा गया है और बाँधने वाले कर्ता को स्पष्ट नहीं किया गया।
- source_word: እስከ፡ ለዓለም
  choice: सदा के लिए
  rationale: कालगत स्थायित्व के मूल भाव को व्यक्त करता है, जबकि आगे आने वाली 'दिन तक' की तनावपूर्ण अभिव्यक्ति भी ज्यों की त्यों बनी रहती है।
- source_word: አማሰኑ
  choice: भ्रष्ट किया
  rationale: अपने मार्गों और कामों को बिगाड़ने या दूषित करने के नैतिक अर्थ को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: ቅድመ፡ እግዚአብሔር
  choice: प्रभु के सामने
  rationale: מूल के स्थानिक/नैतिक 'प्रभु के सम्मुख' भाव का आधुनिक, गरिमापूर्ण हिंदी रूप।
theological_decisions:
- issue: न्याय का संबंध किनसे और किस प्रकार है
  choice: उन सब पर न्याय के लिए
  alternative: उन सबके न्याय के लिए
  rationale: गीइज़ में ዲበ का सामान्य दिशात्मक अर्थ 'पर/विरुद्ध' है, इसलिए न्याय के उनके ऊपर आने का भाव मुख्य पाठ में रखा गया; संबंधसूचक वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- issue: '''सदा के लिए'' और ''महान न्याय के दिन तक'' के बीच कालगत तनाव'
  choice: दोनों अभिव्यक्तियाँ साथ रखी गईं
  alternative: '''महान न्याय के दिन तक'' को केवल व्याख्यात्मक सीमा मानकर ''सदा के लिए'' हटाना'
  rationale: मूल में दोनों उपस्थित हैं; कथित विरोध को अनुवाद में चुपचाप हल करना उचित नहीं होगा।
- issue: बाँधने वाले कर्ता की पहचान
  choice: कर्मवाच्य रखा गया
  alternative: परमेश्वर ने उन्हें बाँध दिया
  rationale: मूल पाठ यहाँ कर्ता का स्पष्ट नाम नहीं देता, इसलिए कोई धर्मवैचारिक पहचान नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। 'पिता', 'प्रभु', 'मार्ग' और 'काम' जैसे शब्द मूल की संक्षिप्तता तथा धार्मिक रजिस्टर को बनाए रखते हैं।
