lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ
  choice: गहरे जल के सोते
  rationale: यह पदबंध गहराई अथवा अथाह जल के स्रोतों को सूचित करता है। ‘गहरे जल’ सामान्य पाठक के लिए स्वाभाविक है और प्राचीन जल-कल्पना को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ያዐርጉ፡ ማያተ
  choice: पानी उगलते रहे
  rationale: क्रिया में पानी को ऊपर भेजने या चढ़ाने का भाव है। ‘उगलते रहे’ स्रोतों से लगातार ऊपर निकलते जल की सजीव और स्वाभाविक अभिव्यक्ति है।
- source_word: ኵሉ፡ ዓለም
  choice: सारा संसार
  rationale: मूल अभिव्यक्ति का व्यापक अर्थ सुरक्षित रखा गया है; इसे केवल ‘धरती’ तक सीमित नहीं किया गया।
- source_word: መልአ ... ማየ
  choice: पानी से भर न गया
  rationale: मूल के ‘जल से भर गया’ भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: जलप्रलय के विस्तार का वर्णन
  choice: सारा संसार
  alternative: सारी धरती
  rationale: गीज़ पाठ के ኵሉ፡ ዓለም का व्यापक शब्दांकन बनाए रखा गया है, बिना उसके भौगोलिक या ब्रह्मांडीय विस्तार की अलग से व्याख्या किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। वाक्य की निरंतर क्रिया दिखाने के लिए ‘उगलते रहे’ और अंतिम सीमा बताने के लिए ‘जब तक कि’ प्रयोग किया गया है।
