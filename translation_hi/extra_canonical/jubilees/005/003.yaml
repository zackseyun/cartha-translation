  text: And the Lord saw the earth, and behold, it was ruined, and all flesh had corrupted its order, and all who were on the earth had done evil before his eyes.
translation:
  language: hi
  text: और प्रभु ने पृथ्वी को देखा, और देखो, वह उजड़ चुकी थी। सभी देहधारियों ने अपनी व्यवस्था भ्रष्ट कर दी थी, और पृथ्वी पर रहनेवाले सभी ने उसकी आँखों के सामने बुराई की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሰነት
  choice: उजड़ चुकी थी
  rationale: यह रूप पृथ्वी की बिगड़ी और नष्ट दशा को व्यक्त करता है; आधुनिक हिन्दी में ‘भ्रष्ट हो चुकी थी’ की तुलना में पृथ्वी के लिए अधिक स्वाभाविक है।
- source_word: ኵሉ፡ ዘሤጋ
  choice: सभी देहधारियों
  rationale: शाब्दिक अर्थ ‘सारा शरीर/समस्त देह’ है। ‘सभी देहधारी’ मनुष्यों तथा अन्य जीवों को समेटने वाली स्रोत की व्यापकता बनाए रखता है।
- source_word: ሥርዓታ
  choice: अपनी व्यवस्था
  rationale: Geʿez शब्द का अर्थ क्रम, व्यवस्था, नियम या विधान है। ‘व्यवस्था’ स्रोत की सृष्टिगत और नैतिक क्रम की धारणा को बनाए रखता है; इसे ‘मार्ग’ नहीं बनाया गया।
- source_word: አእከየ
  choice: बुराई की थी
  rationale: क्रिया का सामान्य नैतिक अर्थ ‘बुरा करना’ है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: ቅድመ፡ አዕይንቲሁ
  choice: उसकी आँखों के सामने
  rationale: स्रोत के ठोस मुहावरे ‘उसकी आँखों के सामने’ को सुरक्षित रखा गया है, बजाय केवल ‘उसकी दृष्टि में’ कहने के।
theological_decisions:
- issue: ሥርዓታ का अर्थ
  choice: व्यवस्था
  alternative: मार्ग
  rationale: मूल शब्द ‘क्रम/व्यवस्था/विधान’ को सूचित करता है और सृष्टि की सुव्यवस्था भंग होने का तनाव बनाए रखता है। ‘मार्ग’ इस विशिष्ट अर्थ को सामान्य नैतिक आचरण तक सीमित कर सकता है।
- issue: ‘सभी देहधारियों’ का दायरा
  choice: इसे व्यापक और अनिर्धारित रखा गया
  alternative: सभी मनुष्यों
  rationale: मूल ‘समस्त देह’ कहता है; केवल मनुष्यों तक सीमित करना स्रोत से अधिक स्पष्ट निर्णय होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, बाइबिल-संगत किंतु सामान्य पाठक के लिए सुबोध शैली। ‘देखो’ मूल के विस्मय-सूचक संकेत को और ‘उसकी आँखों के सामने’ मूल की सजीव अभिव्यक्ति को बनाए रखते हैं।
