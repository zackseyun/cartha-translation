base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/012.yaml
  text: And he made for all his works a new and righteous nature[a], so that they should not sin in all their nature forever, but should all be righteous, each according to its kind, all the days.
translation:
  language: hi
  text: और उसने अपने सब कार्यों के लिए एक नई और धर्मी प्रकृति[a] बनाई, ताकि वे अपनी सारी प्रकृति में सदा पाप न करें, बल्कि वे सब अपने-अपने प्रकार के अनुसार सभी दिनों तक धर्मी रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह उपवाक्य पाठ और अर्थ, दोनों की दृष्टि से कठिन है। अनुवाद इसे एक सामान्य कथन में सरल बना देने के बजाय, सृष्टि की नई और धर्मी प्रकृति तथा अपने-अपने प्रकार के अनुसार होने के भाव को सुरक्षित रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: ፍጥረተ፡ ሐዳሰ፡ ወጻድቅተ
  choice: एक नया और धर्ममय स्वभाव
  rationale: यह कठिन पदबंध किसी नई और धार्मिक/सही सृष्टिगत प्रकृति या व्यवस्था की ओर संकेत करता है। ‘स्वभाव’ प्रसंग में पाप न करने की क्षमता और आचरण, दोनों से स्वाभाविक रूप से जुड़ता है।
- source_word: እይረብቡ
  choice: पाप न करें
  rationale: क्रिया का आशय पाप या अपराध करने से है; नकारात्मक प्रयोजन-वाक्य को सहज हिन्दी में रखा गया है।
- source_word: በበ፡ ትዝምዳ
  choice: अपने-अपने प्रकार के अनुसार
  rationale: पुनरुक्त वितरणात्मक रूप प्रत्येक वर्ग या जाति के अनुरूप होने का भाव देता है; ‘अपने-अपने’ उसी वितरणात्मक बल को व्यक्त करता है।
- source_word: ኵሉ፡ መዋዕለ
  choice: हर समय
  rationale: शाब्दिक रूप से ‘सभी दिन’; हिन्दी में निरंतरता का स्वाभाविक भाव ‘हर समय’ से व्यक्त होता है, जबकि पहले आए ‘सदा तक’ की अनावश्यक पुनरावृत्ति नहीं होती।
theological_decisions:
- issue: नई धार्मिक प्रकृति और नैतिक निष्पापता का संबंध
  choice: पाठ की सृष्टिगत और नैतिक दोनों परतों को ‘नया और धर्ममय स्वभाव’ तथा ‘पाप न करें’ में बनाए रखा गया है।
  alternative: इसे केवल ‘नई धार्मिक व्यवस्था’ या केवल व्यक्तिगत हृदय-परिवर्तन के रूप में स्पष्ट करना।
  rationale: गीज़ पदबंध पाठगत और अर्थगत रूप से कठिन है; किसी विशिष्ट धर्मवैज्ञानिक सिद्धांत के अनुसार उसका दायरा सीमित करना उचित नहीं।
- issue: ‘अपने-अपने प्रकार के अनुसार’ का आशय
  choice: सृष्टि के प्रकारों के अनुसार धर्मी बने रहने का अस्पष्ट लेकिन वास्तविक संबंध सुरक्षित रखा गया है।
  alternative: इसे मनुष्यों के अलग-अलग पद, जाति या योग्यता के अनुसार धार्मिकता कहना।
  rationale: मूल अभिव्यक्ति वर्ग/प्रकार की ओर संकेत करती है और अधिक विशिष्ट व्याख्या पाठ में नहीं दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। ‘धर्ममय’ को ‘धार्मिक’ की अपेक्षा चुना गया, क्योंकि यहाँ किसी धार्मिक पहचान से अधिक धर्मी/सही गुण का भाव है। मुख्य पाठ में पादटिप्पणी-चिह्न [a] सम्मिलित है।
