base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/006.yaml
  text: And against his angels whom he had sent to the earth he was exceedingly angry[a], so as to strip them of all their dominion; and he told us to bind them in the depths of the earth, and behold, they are bound within them and separated.
translation:
  language: hi
  text: और वह अपने उन स्वर्गदूतों पर, जिन्हें उसने पृथ्वी पर भेजा था, अत्यन्त क्रोधित हुआ,[a] ताकि उनसे उनके सारे अधिकार छीन ले। फिर उसने हमसे कहा कि हम उन्हें पृथ्वी की गहराइयों में बाँध दें। और देखो, वे उन्हीं गहराइयों के भीतर बँधे हुए और अलग किए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसने हमसे कहा’ में प्रथम पुरुष बहुवचन जुबिलीज़ के उस प्रकाशनात्मक कथात्मक ढाँचे को दर्शाता है, जिसमें स्वर्गदूतीय मध्यस्थ परमेश्वर के कार्यों का वर्णन करता है। सम्भवतः यहाँ अपराधी स्वर्गदूतों को पृथ्वी की अधोभूमि की गहराइयों में बाँधे जाने की बात है।
    reason: cross_reference
lexical_decisions:
- source_word: ተምዐ፡ ፈድፋደ
  choice: अत्यन्त क्रोध किया
  rationale: क्रिया और तीव्रतासूचक पद को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ይሠርዎሙ፡ እምኵሉ፡ ሥልጣኖሙ
  choice: उनसे उनका सारा अधिकार छीन ले
  rationale: स्रोत का भाव उनके समस्त प्रभुत्व या अधिकार से वंचित किए जाने का है; ‘छीन ले’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: पृथ्वी की गहराइयों
  rationale: बहुवचन और अधोलौकिक स्थान—दोनों को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ማእከሎሙ
  choice: उन्हीं गहराइयों के भीतर
  rationale: सर्वनाम का संभावित पूर्वपद पृथ्वी की ‘गहराइयाँ’ है; यह हिन्दी में ‘उनके बीच’ से अधिक स्वाभाविक भौतिक स्थान-सूचक अभिव्यक्ति है।
- source_word: ብሕትዋን
  choice: अलग रखे गए
  rationale: पृथक्करण की परिणामी अवस्था को व्यक्त करता है और केवल ‘अलग’ की अपेक्षा वाक्य में अधिक स्वाभाविक है।
theological_decisions:
- issue: प्रथम पुरुष बहुवचन ‘उसने हमसे कहा’
  choice: ‘हमसे’ को यथावत रखा
  alternative: 'अज्ञात कर्मवाच्य: ‘उन्हें बाँधने की आज्ञा दी’'
  rationale: स्रोत का प्रथम पुरुष बहुवचन जुबिलीज़ के स्वर्गदूतीय कथावाचक ढाँचे का वास्तविक अंग है; उसे हटाने से कथन का दृष्टिकोण बदल जाता।
- issue: अपराधी स्वर्गदूतों का स्थान
  choice: ‘पृथ्वी की गहराइयों’
  alternative: ‘अधोलोक’ या ‘पाताल’
  rationale: स्रोत भौगोलिक रूपक को बनाए रखता है; अधिक धर्मशास्त्रीय रूप से निश्चित शब्द जोड़ना उचित नहीं।
- issue: अन्तिम पृथक्करण का अर्थ
  choice: ‘अलग रखे गए हैं’
  alternative: ‘एकान्त में रखे गए हैं’
  rationale: स्रोत में पृथक्करण है, पर उसका उद्देश्य या स्वरूप पूर्णतः स्पष्ट नहीं; अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय पर सामान्य पाठक के लिए सुबोध। ‘स्वर्गदूत’, ‘अधिकार’ और ‘गहराइयाँ’ जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं। स्रोत की वाक्य-श्रृंखला को पठनीय बनाने के लिए हिन्दी में वाक्य विभाजन किया गया है।
