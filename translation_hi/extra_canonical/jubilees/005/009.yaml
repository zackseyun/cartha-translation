  text: And he sent a sword among them so that each might kill his fellow, and they began to kill one another until they all fell by the sword and were wiped out from the earth.
translation:
  language: hi
  text: और उसने उनके बीच तलवार भेजी, ताकि हर एक अपने साथी को मार डाले। तब वे एक-दूसरे को मारने लगे, यहाँ तक कि वे सब तलवार से मारे गए और पृथ्वी पर से मिटा दिए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ
  choice: तलवार
  rationale: गीज़ पद में शब्द अनिश्चित रूप में है; इसलिए ‘अपनी तलवार’ के बजाय ‘तलवार’ रखा गया है।
- source_word: ማእከሎሙ
  choice: उनके बीच
  rationale: स्थान और समुदाय के भीतर विनाशकारी संघर्ष—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ቢጹ
  choice: अपने साथी
  rationale: यहाँ आशय प्रत्येक व्यक्ति द्वारा अपने सहचर या सजातीय को मारने से है; ‘साथी’ आधुनिक और सहज है।
- source_word: ተደምሰሱ
  choice: मिटा दिए गए
  rationale: पूर्ण विनाश के कर्मवाच्य भाव को बनाए रखता है।
theological_decisions:
- issue: तलवार का स्वामित्व
  choice: ‘तलवार’—बिना ‘अपनी’ जोड़े
  alternative: ‘अपनी तलवार’
  rationale: मूल गीज़ पाठ तलवार को कर्ता की संपत्ति बताने वाला स्पष्ट सर्वनाम नहीं देता; अतः अनावश्यक धार्मिक व्याख्या नहीं जोड़ी गई।
- issue: दैवी कर्ता का अप्रत्यक्ष उल्लेख
  choice: ‘उसने’ को यथावत रखा
  alternative: कर्ता का नाम स्पष्ट करना
  rationale: पद के निकटवर्ती संदर्भ पर निर्भर सर्वनाम की अस्पष्टता को मूल के अनुसार सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘एक-दूसरे’ परस्पर हत्या का स्वाभाविक रूप है, जबकि पहले खंड में ‘हर एक अपने साथी को’ मूल की व्यक्तिगत संरचना को सुरक्षित रखता है।
