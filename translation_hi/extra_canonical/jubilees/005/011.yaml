  text: And he destroyed all from their places, and not one of them remained whom he had not judged according to all their wickedness.
translation:
  language: hi
  text: और उसने सबको उनके स्थानों से मिटा दिया; उनमें से एक भी ऐसा न बचा, जिसका न्याय उसने उसकी सारी दुष्टता के अनुसार न किया हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደምሰሰ
  choice: और उसने ... मिटा दिया
  rationale: क्रिया विनाश अथवा पूरी तरह नष्ट कर देने का भाव व्यक्त करती है; ‘मिटा दिया’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: ኵሉ እመካኖሙ
  choice: सबको उनके स्थानों से
  rationale: स्रोत के ‘सब’ और ‘उनके स्थानों से’ को बिना किसी अतिरिक्त व्याख्या के प्रत्यक्ष रूप में रखा गया है।
- source_word: ወኢተርፈ አሐዱ እምኔሆሙ
  choice: उनमें से एक भी ऐसा न बचा
  rationale: नकारात्मक सार्वभौमिक कथन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘአኰነነ
  choice: जिसका न्याय उसने ... किया हो
  rationale: न्यायिक अर्थ को बनाए रखा गया है; इसे केवल ‘दण्ड दिया’ नहीं बनाया गया, ताकि न्याय और दण्ड के बीच स्रोत की संभावित व्यापकता सुरक्षित रहे।
- source_word: በኵሉ እኪዮሙ
  choice: उनकी सारी दुष्टता के अनुसार
  rationale: ‘के अनुसार’ स्रोत के अनुरूप न्याय और उनकी समस्त बुराई के संबंध को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय और विनाश का संबंध
  choice: ‘जिसका न्याय उसने उनकी सारी दुष्टता के अनुसार न किया हो’
  alternative: ‘जिसे उसने उसकी सारी दुष्टता का दण्ड न दिया हो’
  rationale: ‘न्याय किया’ स्रोत की न्यायिक शब्दावली को अधिक निकटता से सुरक्षित रखता है और दण्ड को ही उसका एकमात्र अर्थ मानकर तनाव का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। स्रोत की निषेधात्मक संबंधवाचक संरचना को स्वाभाविक हिन्दी में बनाए रखा गया है।
