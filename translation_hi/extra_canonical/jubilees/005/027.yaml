lexical_decisions:
- source_word: ማያት
  choice: जल
  rationale: गीज़ का बहुवचन रूप संदर्भ में सामूहिक अर्थ रखता है; हिन्दी में ‘जल’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ይቀውም
  choice: ठहरा रहा
  rationale: क्रिया का अर्थ खड़े रहने, बने रहने या ठहरे रहने का है; अवधि के संदर्भ में ‘ठहरा रहा’ स्वाभाविक रूप से निरंतर स्थिति व्यक्त करता है।
- source_word: ዲበ፡ ገጸ፡ ምድር
  choice: पृथ्वी की सतह पर
  rationale: शाब्दिक अर्थ ‘पृथ्वी के मुख पर’ है; आधुनिक हिन्दी में ‘पृथ्वी की सतह पर’ वही स्थानिक अर्थ स्पष्टता से देता है।
- source_word: ኃምስተ፡ አውራኀ፡ ምእተ፡ ወኃምሳ፡ ዕለተ
  choice: पाँच महीने—एक सौ पचास दिन—तक
  rationale: दोनों काल-अभिव्यक्तियों को समान अवधि के दो निरूपण मानते हुए सुरक्षित रखा गया है; ‘तक’ हिन्दी में अवधि को स्पष्ट करता है।
