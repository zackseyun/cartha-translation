    ይብል፡ ዝ"ያናዝዘኒ፡" *እምሐዘንየ፡ ወ"እምኵሉ፡ ግብርየ፡" ወእም"ድርየ፡" እንተ፡ ረገመ፡" እግዚአብሔር። ወበፍጻሜሁ፡ ለዓሥር፡ ወታስዕ፡ 29 ኢዮቤልው፡ በሱባዔ፡ ሳብዕ፡ በሳድስ፡ ዓመት፡ ሞተ፡ አዳም፡ ወቀበርዎ፡ ኵሎሙ፡ ደቂቁ፡ ውስተ፡

