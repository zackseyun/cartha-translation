translation:
  language: hi
  text: और वह परमेश्वर के स्वर्गदूतों के साथ छह जुबली-काल तक अब भी रहा। उन्होंने उसे वह सब दिखाया जो पृथ्वी पर और आकाशों में है, और सूर्य का प्रभुत्व भी; और उसने सब कुछ लिख लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሀሎ፡ እንከ፡ ምስለ
  choice: और वह ... के साथ ... तक रहा
  rationale: क्रिया और काल-सूचक प्रसंग को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘तब/अब भी’ का भाव गीइज़ कण እንከ में संभव है, पर मुख्य कथन अवधि तक साथ रहने पर केंद्रित है।
- source_word: መላእክት፡ አምላክ
  choice: परमेश्वर के स्वर्गदूतों
  rationale: शाब्दिक अर्थ ‘परमेश्वर के दूत’; इस स्वर्गीय संदर्भ में ‘स्वर्गदूत’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: छह जुबली-कालों तक
  rationale: यह छह साधारण वर्षों का नहीं, छह जुबली अवधियों का संकेत है; ‘कालों’ अवधि का अर्थ स्पष्ट करता है और मूल कालगणना बचाता है।
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: सूर्य का शासन
  rationale: ሥልጣን अधिकार, प्रभुत्व या शासन को दर्शाता है। ‘शासन’ खगोलीय व्यवस्था पर सूर्य के नियत अधिकार को व्यक्त करता है, बिना उसे आधुनिक वैज्ञानिक शब्दावली में बदलने के।
- source_word: ወጸሐፈ፡ ኵሎ
  choice: और उसने सब कुछ लिख लिया
  rationale: मूल के संक्षिप्त समापन को सहज आधुनिक हिन्दी में उसी व्यापकता के साथ रखा गया है।
theological_decisions:
- issue: परमेश्वर के स्वर्गदूतों द्वारा हनोक को ज्ञान दिखाया जाना
  choice: कथन को सीधे ऐतिहासिक-वर्णनात्मक रूप में रखा गया
  alternative: इसे दर्शन, प्रकाशन या शिक्षा के रूप में स्पष्ट करना
  rationale: मूल केवल ‘उन्होंने उसे दिखाया’ कहता है; ज्ञान मिलने की विधि को अधिक विशिष्ट बनाना मूल की अस्पष्टता को अनावश्यक रूप से सुलझाता।
- issue: सूर्य के ‘शासन’ का आशय
  choice: ‘सूर्य का शासन’
  alternative: ‘सूर्य की गति/नियम’
  rationale: मूल शब्द ‘अधिकार/प्रभुत्व/शासन’ है। इसे केवल गति या खगोलीय नियम कहना अर्थ को संकुचित करता और प्राचीन ब्रह्मांड-दृष्टि की भाषिक धार को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जुबली-काल’ जैसी पुस्तक-विशिष्ट कालगणना को अनूदित-अनुकूलित रूप में बनाए रखा गया है, जबकि ‘आकाशों’ का बहुवचन मूल ሰማያት के अनुरूप है।
