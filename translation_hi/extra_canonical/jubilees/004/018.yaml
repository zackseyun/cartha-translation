base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/018.yaml
  text: And at the end of the nineteenth jubilee, in the seventh week, in its sixth year, Adam died, and all his sons buried him in the land of his creation; and he was the first to be buried in the earth.
translation:
  language: hi
  text: वह पहला व्यक्ति था जिसने एक गवाही लिखी और पृथ्वी की पीढ़ियों के बीच मनुष्यों की संतानों को गवाही दी। उसने जुबिलियों के सप्ताहों का वर्णन किया, वर्षों के दिनों को ज्ञात कराया और महीनों को व्यवस्थित किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸሐፈ፡ ስምዐ
  choice: एक साक्ष्य लिखा
  rationale: क्रिया ‘लिखना’ और संज्ञा ‘साक्ष्य/गवाही’ को सीधे बनाए रखता है; प्रसंग लिखित अभिलेख का है।
- source_word: ወአስምዐ
  choice: साक्ष्य दिया
  rationale: संज्ञा ስምዐ के साथ धातुगत संबंध बनाए रखते हुए हिंदी में स्वाभाविक अभिव्यक्ति।
- source_word: ለደቂቀ፡ እጓለ፡ እመሕያው
  choice: मनुष्यों को
  rationale: शाब्दिक ‘मनुष्य की संतानों’ का वर्तमान हिंदी में स्वाभाविक सामूहिक रूप।
- source_word: ውስተ፡ ትዝምደ፡ ምድር
  choice: पृथ्वी की पीढ़ियों के बीच
  rationale: पीढ़ी/वंश और पृथ्वी—दोनों स्रोत-तत्वों को सुरक्षित रखता है।
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: जुबिलियों के सप्ताहों
  rationale: जुबिली की कालगणना में सात-सात वर्षों के ‘सप्ताहों’ का तकनीकी अर्थ बनाए रखता है।
- source_word: ነገረ
  choice: वर्णन किया
  rationale: बताने या सुनाने की क्रिया को प्रसंगानुकूल ढंग से व्यक्त करता है।
- source_word: መዋዕለ፡ ዓመታት፡ አይድዐ
  choice: वर्षों के दिनों को बताया
  rationale: स्रोत की ‘वर्षों के दिन’ संरचना को बनाए रखते हुए ज्ञान कराने का अर्थ देता है।
- source_word: አውራኅ፡ ሰርዐ
  choice: महीनों को क्रमबद्ध किया
  rationale: महीनों को व्यवस्थित/नियत करने की मूल क्रिया का स्पष्ट और तटस्थ अनुवाद।
theological_decisions:
- issue: ‘साक्ष्य’ की प्रकृति
  choice: साक्ष्य
  alternative: गवाही
  rationale: यहाँ लिखित दस्तावेज़ का संकेत है; ‘साक्ष्य’ लिखित और प्रमाणात्मक दोनों आयामों को खुला रखता है।
- issue: महीनों को व्यवस्थित करने का आशय
  choice: क्रमबद्ध किया
  alternative: नियत किया
  rationale: पाठ यह स्पष्ट नहीं करता कि उसने महीनों की सृष्टि, स्थापना या केवल गणनात्मक व्यवस्था की; ‘क्रमबद्ध किया’ उस तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। स्रोत के कालगणनात्मक पदों और समानांतर क्रियाओं को संरक्षित किया गया है। पद में व्यक्त कर्ता का नाम नहीं है, इसलिए ‘वह’ रखा गया है; प्रसंग से यह हनोक है।
