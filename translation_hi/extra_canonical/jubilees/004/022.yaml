base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/022.yaml
  text: And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against them all.
translation:
  language: hi
  text: और उसने उन पहरेदारों के विरुद्ध गवाही दी, जिन्होंने मनुष्यों की बेटियों के साथ पाप किया था; क्योंकि वे मनुष्यों की बेटियों से मिलन करने लगे थे, ताकि अपने आपको अशुद्ध करें। हनोक ने उन सबके विरुद्ध गवाही दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰትጉሃን
  choice: पहरेदारों
  rationale: यह ‘Watchers’ के लिए प्रयुक्त पारंपरिक पद है; सामान्य पाठक के लिए अर्थपूर्ण रहते हुए इस समूह की विशिष्ट पहचान बनाए रखता है।
- source_word: አበሱ
  choice: पाप किया था
  rationale: क्रिया का नैतिक अर्थ सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ይደመሩ
  choice: मिलकर
  rationale: मूल में जुड़ने या संयोग करने का भाव है; प्रसंग में ‘साथ मिलकर’ स्वाभाविक है और अनावश्यक रूप से अधिक विशिष्ट यौन शब्दावली नहीं जोड़ता।
- source_word: ይርኩሱ
  choice: अपने आपको अशुद्ध करने
  rationale: मूल के अशुद्ध या अपवित्र होने के भाव को सुरक्षित रखता है और नैतिक-विधिक तनाव को किसी एक संकीर्ण अर्थ में सीमित नहीं करता।
- source_word: አስምዐ ... ላዕለ
  choice: के विरुद्ध गवाही दी
  rationale: यहाँ गवाही आरोपात्मक है; ‘के विरुद्ध’ प्रसंग और पूर्वसर्ग का उपयुक्त हिन्दी रूप है।
theological_decisions:
- issue: ‘पहरेदारों’ की पहचान
  choice: विशिष्ट समूह-संज्ञा के रूप में ‘पहरेदारों’ रखा
  alternative: स्वर्गदूतों
  rationale: मूल पाठ उन्हें सीधे ‘स्वर्गदूत’ नहीं कहता; अधिक व्यापक पहचान जोड़ने से बचते हुए पारंपरिक पद सुरक्षित रखा गया।
- issue: मनुष्यों की बेटियों के साथ संबंध की प्रकृति
  choice: ‘साथ मिलकर अपने आपको अशुद्ध करने’
  alternative: ‘यौन संबंध बनाकर अशुद्ध होने’
  rationale: मूल में मिलना और अशुद्ध होना स्पष्ट है, पर अनुवाद में उससे अधिक स्पष्ट यौन शब्दावली जोड़ना वास्तविक अभिव्यक्ति की गुंजाइश को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए स्पष्ट। वाक्य-विन्यास को सहज बनाया गया है, जबकि मूल की पुनरुक्ति—हनोक द्वारा उन सबके विरुद्ध गवाही—को बलाघात के रूप में बनाए रखा गया है।
