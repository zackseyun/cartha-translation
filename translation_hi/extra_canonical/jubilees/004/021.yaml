base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/021.yaml
  text: And he was still with the angels of God for six jubilees of years[21], and they showed him everything that is on the earth and in the heavens, the dominion of the sun, and he wrote down everything.
translation:
  language: hi
  text: मतूशेलह। और वह वर्षों की छह जुबिली अवधियों[a] तक परमेश्वर के स्वर्गदूतों के साथ रहा। उन्होंने उसे वह सब दिखाया जो पृथ्वी पर और आकाशों में है, और सूर्य का प्रभुत्व भी; और उसने सब कुछ लिख लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक जुबिली सात-सात वर्षों के सात चक्रों, अर्थात उनचास वर्षों की अवधि है।
    reason: प्राचीन काल-गणना से अपरिचित आधुनिक पाठक के लिए पद में प्रयुक्त समय-इकाई स्पष्ट करना।
lexical_decisions:
- source_word: ማቱሳላ
  choice: मतूशेलह
  rationale: नाम को स्रोत में उसकी स्वतंत्र उपस्थिति सहित रखा गया है; यह संभवतः पिछले वाक्य का अंतिम शब्द है, पर दिए गए पद-पाठ का हिस्सा है।
- source_word: መላእክት አምላክ
  choice: परमेश्वर के स्वर्गदूत
  rationale: शाब्दिक संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ስድስተ ዘኢዮቤልውሳት ዓመታት
  choice: वर्षों की छह जुबिली अवधियाँ
  rationale: मूल की काल-गणना को बनाए रखते हुए ‘जुबिली’ को केवल सामान्य उत्सव समझे जाने से बचाने के लिए ‘अवधियाँ’ जोड़ा गया है।
- source_word: ሥልጣነ ለፀሐይ
  choice: सूर्य का प्रभुत्व
  rationale: ሥልጣን के अधिकार, शासन या प्रभाव-क्षेत्र संबंधी अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ወጸሐፈ ኵሎ
  choice: और उसने सब कुछ लिख लिया
  rationale: क्रिया और उसके व्यापक कर्म को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्वर्गदूतों की पहचान
  choice: परमेश्वर के स्वर्गदूत
  alternative: ईश्वरदूत / दिव्य प्राणी
  rationale: स्रोत स्पष्ट रूप से ‘परमेश्वर के स्वर्गदूत’ कहता है; अधिक सामान्य शब्द मूल संबंध को धुंधला कर देते।
- issue: ‘सूर्य के प्रभुत्व’ का आशय
  choice: वाक्यांश को व्याख्या के बिना बनाए रखा
  alternative: सूर्य की गति / सूर्य का नियत मार्ग
  rationale: मूल ‘प्रभुत्व/अधिकार’ कहता है; इसे खगोलीय गति या नियम के रूप में निश्चित करना स्रोत की संभावित व्यापकता को संकुचित करता।
- issue: आरंभिक ‘मतूशेलह’ का वाक्यगत संबंध
  choice: उसे स्वतंत्र खंड के रूप में रखा
  alternative: उसे अगले वाक्य का कर्ता बनाना
  rationale: दिए गए गीइज़ पाठ में नाम के बाद पूर्ण विराम है और अगले वाक्य का कर्ता सर्वनाम है; नाम को कर्ता बनाना पाठ की विराम-संरचना से आगे जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्रोत की कुछ असामान्य अभिव्यक्तियाँ—विशेषकर ‘वर्षों की छह जुबिली अवधियाँ’ और ‘सूर्य का प्रभुत्व’—अर्थगत तनाव और प्राचीन वैचारिक संसार को सुरक्षित रखने के लिए जानबूझकर बनाए रखी गई हैं। उपलब्ध अंग्रेज़ी परत की असंबद्ध पादटिप्पणी को शामिल नहीं किया गया, क्योंकि वह इस पद या गीइज़ पाठ से संबंधित नहीं है।
