base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/019.yaml
  text: And he recounted the sabbaths of years, as we made known to him. And he saw what was and what will be in a vision of his sleep, how it will happen to the children of men in their generations until the day of judgment. He saw and understood everything, and wrote his testimony, and placed the testimony on earth...
translation:
  language: hi
  text: और उसने वर्षों के सब्तों का वर्णन किया, जैसा हमने उसे बताया था। और उसने अपनी नींद के दर्शन में वह देखा जो था और जो होने वाला था—मनुष्यों की संतानों के साथ उनकी पीढ़ियों में न्याय के दिन तक क्या-क्या होगा। उसने सब कुछ देखा और समझा; फिर उसने अपनी गवाही लिखी और उस गवाही को पृथ्वी पर रख दिया…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰንበታት፡ ዓመታት
  choice: वर्षों के शब्बतों
  rationale: स्रोत के ‘sabbaths of years’ को औपचारिक रूप से सुरक्षित रखा गया है; ‘विश्राम-वर्ष’ कहने से संभावित गणनात्मक/कालखंडीय अर्थ संकरा हो सकता था।
- source_word: ነገረ
  choice: वर्णन किया
  rationale: क्रिया का अर्थ बताना, सुनाना या विवरण देना हो सकता है; यहाँ कालखंडों के लेखे/विवरण के संदर्भ में स्वाभाविक हिन्दी चुनी गई।
- source_word: በራእየ፡ ንዋሙ
  choice: निद्रा के दर्शन में
  rationale: ‘उसकी नींद के दर्शन’ का आशय सुरक्षित रखते हुए सहज आधुनिक हिन्दी प्रयोग किया गया।
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: मनुष्यों की संतानों
  rationale: स्रोत की वंशगत अभिव्यक्ति को बनाए रखा गया; केवल ‘मनुष्यों’ कहने से उसकी रूपक-संरचना खो जाती।
- source_word: ዕለተ፡ ደይን
  choice: न्याय के दिन
  rationale: प्रचलित और स्रोत-संगत धार्मिक पदावली।
- source_word: ስምዖ
  choice: गवाही
  rationale: यहाँ लिखित साक्ष्य/वृत्तांत के अर्थ को खुला रखता है और स्रोत में पुनरावृत्ति को बनाए रखता है।
theological_decisions:
- issue: दर्शन में भूत और भविष्य का ज्ञान
  choice: ‘जो हो चुका था और जो होने वाला था’
  alternative: ‘जो था और जो होगा’
  rationale: कालगत व्यापकता को स्पष्ट किन्तु अनावश्यक व्याख्या के बिना व्यक्त किया गया।
- issue: न्याय के दिन तक मानव पीढ़ियों की घटनाएँ
  choice: भविष्यसूचक कथन को सीधे सुरक्षित रखा
  alternative: इसे केवल इतिहास के सामान्य पूर्वज्ञान के रूप में समझाना
  rationale: स्रोत की प्रलय-संबंधी/भविष्यसूचक धारणा को किसी सम्प्रदायगत व्याख्या से सीमित नहीं किया गया।
- issue: पृथ्वी पर गवाही रखने का अर्थ
  choice: ‘उस गवाही को पृथ्वी पर रख दिया’
  alternative: ‘मानवजाति के लिए सुरक्षित कर दिया’
  rationale: स्रोत की ठोस किन्तु कुछ अस्पष्ट अभिव्यक्ति को व्याख्यात्मक विस्तार के बिना संरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। स्रोत की पुनरावृत्ति (‘गवाही’) और भविष्यसूचक तनाव सुरक्षित हैं। उपलब्ध गीइज़ पाठ अंत में आगे जारी होता प्रतीत होता है, इसलिए प्रदत्त अंश के अनुरूप दीर्घविराम रखा गया है। अंग्रेज़ी परत में दिया पिछला-पाठ वाला पादटिप्पणी-विकल्प इस पद का स्रोत-पाठ नहीं है, इसलिए शामिल नहीं किया गया।
