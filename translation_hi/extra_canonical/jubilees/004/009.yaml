translation:
  language: hi
  text: '**यूबिलीज़ 4:9**


    सातवीं जुबली के तीसरे वर्ष-सप्ताह में एनोश ने अपनी बहन नोआम को पत्नी के रूप में ग्रहण किया। पाँचवें वर्ष-सप्ताह के तीसरे वर्ष में नोआम ने एनोश के लिए एक पुत्र को जन्म दिया, और उसने उसका नाम केनान रखा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वर्ष-सप्ताह’ सात वर्षों की अवधि है। यहाँ पाँचवाँ वर्ष-सप्ताह भी सातवीं जुबली के भीतर है।
    reason: यूबिलीज़ की विशिष्ट कालगणना को सामान्य पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ሱባዔ
  choice: वर्ष-सप्ताह
  rationale: यहाँ शब्द सात वर्षों की काल-इकाई को दर्शाता है, न कि सात दिनों के सामान्य सप्ताह को; इसलिए कालक्रम स्पष्ट रखने के लिए ‘वर्ष-सप्ताह’ चुना गया।
- source_word: ነሥአ ... ብእሲተ
  choice: पत्नी बनाया
  rationale: गीज़ की विवाह-संबंधी अभिव्यक्ति का स्वाभाविक और सटीक हिन्दी रूप, शाब्दिक ‘अपने लिए स्त्री लिया’ की अपेक्षा अधिक स्पष्ट है।
- source_word: ሄኖስ
  choice: एनोश
  rationale: उत्पत्ति की वंशावली में प्रचलित नाम-रूप के अनुरूप लिप्यंतरण।
- source_word: ኖአም
  choice: नोआम
  rationale: गीज़ नाम का निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: ቃይናን
  choice: केनान
  rationale: उत्पत्ति की वंशावली में प्रचलित आधुनिक हिन्दी नाम-रूप को अपनाया गया।
theological_decisions:
- issue: निकट संबंधी से विवाह का वर्णन
  choice: ‘अपनी बहन नोआम को पत्नी बनाया’ को बिना नरमी या व्याख्यात्मक जोड़ के रखा गया
  alternative: ‘नोआम से विवाह किया’ कहकर बहन के संबंध को छोड़ देना
  rationale: मूल पाठ स्पष्ट रूप से उसे उसकी बहन कहता है; अनुवाद ऐतिहासिक कथन को न तो छिपाता है, न उसका धार्मिक या नैतिक औचित्य प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा कथात्मक रूप रखा गया है। पिछले अंग्रेज़ी मसौदे की पद-संरेखण त्रुटि को सुधारते हुए वास्तविक 4:9—एनोश, नोआम और केनान का विवरण—अनूदित किया गया है।
