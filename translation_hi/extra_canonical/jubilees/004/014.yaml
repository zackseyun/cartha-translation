  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Danel, his father’s brother’s daughter; and in the sixth year of this week she bore him a son, and he called his name Methuselah.
translation:
  language: hi
  text: बारहवीं जुबली के सातवें सप्ताह में उसने अपने लिए एक पत्नी ली। उसका नाम एदनी था। वह दानेल की बेटी और उसके पिता की बहन की बेटी थी।[a] उसी सप्ताह के छठे वर्ष में एदनी ने उसके लिए एक पुत्र को जन्म दिया, और उसने उसका नाम मतूशेलह रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में शाब्दिक रूप से “उसके पिता की बहन की बेटी” है। अंग्रेज़ी POB audit trail में “उसके पिता के भाई की बेटी” पढ़ाई जाती है। चूँकि वाक्य में एदनी को दानेल की बेटी भी कहा गया है, रिश्ते का सटीक आशय पाठगत रूप से कठिन है।
    reason: गीइज़ पाठ की ‘बहन’ वाली पढ़ाई को मुख्य पाठ में सुरक्षित रखते हुए अंग्रेज़ी audit trail की भिन्न पढ़ाई और वाक्य की आंतरिक कठिनाई को स्पष्ट करना।
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: जुबली
  rationale: कालगणना की तकनीकी इकाई को स्पष्ट और संक्षिप्त रूप में रखा गया है; इसका अर्थ उनचास वर्षों का जुबली-काल है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: यहाँ सात वर्षों की काल-इकाई अभिप्रेत है; मूल की ‘सात’ आधारित अभिव्यक्ति और पुस्तक की कालगणना को बनाए रखने के लिए ‘सप्ताह’ रखा गया है।
- source_word: እድኒ
  choice: एदनी
  rationale: व्यक्तिनाम का गीइज़ रूपानुसार देवनागरी लिप्यंतरण।
- source_word: ማቱሳላ
  choice: मतूशेलह
  rationale: परंपरागत बाइबलीय नाम से पहचान बनाए रखते हुए स्रोत-नाम का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: एदनी के रिश्ते का वर्णन
  choice: मुख्य पाठ में गीइज़ के शाब्दिक अर्थ ‘उसके पिता की बहन की बेटी’ को रखा गया
  alternative: अंग्रेज़ी परामर्श-पाठ के अनुसार ‘उसके पिता के भाई की बेटी’
  rationale: उपलब्ध गीइज़ में እኅተ (‘बहन’) है, इसलिए स्रोत-पाठ को प्राथमिकता दी गई और पाठगत असंगति को टिप्पणी में स्पष्ट किया गया; संबंध को चुपचाप सामान्यीकृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कालगणना की पुस्तक-विशिष्ट शब्दावली ‘जुबली’ और ‘सप्ताह’ के रूप में सुरक्षित है; छोटे वाक्यों से जटिल वंश-संबंधी सूचना स्पष्ट की गई है।
