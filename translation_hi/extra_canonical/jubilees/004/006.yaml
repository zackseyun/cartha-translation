translation:
  language: hi
  text: और इसी कारण जब हम अपने प्रभु परमेश्वर के सामने आते हैं, तब हम सारे पापों को प्रकट करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናየድዕ
  choice: हम … प्रकट करते हैं
  rationale: मूल क्रिया का अर्थ ‘ज्ञात कराना/घोषित करना’ है। पापों के संदर्भ में ‘प्रकट करते हैं’ स्वाभाविक है और कथन को केवल निजी ‘स्वीकारोक्ति’ तक सीमित नहीं करता।
- source_word: መጻእነ ቅድመ
  choice: जब हम … के सामने आते हैं
  rationale: आने की क्रिया और ‘के सामने’ स्थान-संबंध दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: እግዚአብሔር አምላክነ
  choice: अपने प्रभु परमेश्वर
  rationale: यहाँ ईश्वर के लिए उपाधि है, विशिष्ट दिव्य नाम नहीं; इसलिए ‘यहोवा’ के बजाय ‘प्रभु’ रखा गया। प्रथम पुरुष बहुवचन संबंध को ‘अपने’ से व्यक्त किया गया।
- source_word: ኵሎ ኀጢአተ
  choice: सारे पापों को
  rationale: समष्टिवाचक ‘सब/सारे’ और ‘पाप’ के कर्मरूप को सीधा बनाए रखा गया है।
theological_decisions:
- issue: पाप प्रकट करने की प्रकृति
  choice: प्रकट करते हैं
  alternative: अंगीकार करते हैं
  rationale: ‘अंगीकार’ धार्मिक व्यवहार की अधिक विशिष्ट व्याख्या दे सकता है, जबकि स्रोत की क्रिया व्यापक रूप से ज्ञात कराने या घोषित करने का अर्थ रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। स्रोतांश की वाक्यगत संरचना को पूर्ण हिन्दी वाक्य के रूप में प्रस्तुत किया गया है, बिना किसी सांप्रदायिक शब्दावली को जोड़े।
