- source_word: ይግበሩ (yəgbaru)
  choice: आचरण करें
  rationale: मूल क्रिया का अर्थ ‘करें/अमल में लाएँ’ है। न्याय और खराई के साथ ‘आचरण करें’ आधुनिक हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በዲበ፡ ምድር (badiba mədr)
