base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/016.yaml
  text: And they did justice and uprightness upon the earth. And in the tenth jubilee[16], in the first week, Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, the daughter of his father's sister, as his wife, in the fourth year of this week; and she bore him a son in the fifth week, in the fourth year.
translation:
  language: hi
  text: और उन्होंने पृथ्वी पर न्याय और सीधाई से काम किया। दसवें जुबली-वर्षचक्र के पहले सप्ताह के चौथे वर्ष में यारेद ने अपने लिए बारका नाम की स्त्री को पत्नी के रूप में ग्रहण किया। वह रासूयाल की बेटी और यारेद के पिता की बहन की बेटी थी। इस सप्ताह के पाँचवें सप्ताह के चौथे वर्ष में उसने उसके लिए एक पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍትሐ፡ ወርተዐ
  choice: न्याय और खराई
  rationale: दो समानांतर नैतिक संज्ञाओं के भेद को बनाए रखते हुए आधुनिक और गरिमापूर्ण हिन्दी दी गई है; पहला न्याय और दूसरा सीधेपन/सत्यनिष्ठा का भाव रखता है।
- source_word: ኢዮቤልዉ
  choice: जुबली-वर्षचक्र
  rationale: पुस्तक की कालगणना में यह उनचास वर्षों के चक्र का तकनीकी पद है; केवल ‘जुबली’ की अपेक्षा यह हिन्दी पाठक के लिए अर्थ अधिक स्पष्ट करता है।
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: अपने लिए ... स्त्री को पत्नी बनाया
  rationale: गीज़ मुहावरे का स्वाभाविक हिन्दी रूप, जिसका आशय विवाह करना है।
- source_word: ወለተ፡ እኅተ፡ አቡሁ
  choice: उसके पिता की बहन की बेटी
  rationale: स्रोत में दिए रिश्ते को ठीक उसी क्रम में स्पष्ट रखा गया है; इसका आशय उसकी फुफेरी बहन है, पर रिश्ते की मूल अभिव्यक्ति अधिक पारदर्शी है।
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: उसने उसके लिए एक पुत्र को जन्म दिया
  rationale: लिंग और अप्रत्यक्ष संबंध सहित स्रोत की संरचना को सहज हिन्दी में सुरक्षित रखा गया है।
