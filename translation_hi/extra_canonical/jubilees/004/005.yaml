base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/005.yaml
  text: 'And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and not reported, let him be cursed in the same way.'
translation:
  language: hi
  text: 'और इसी कारण स्वर्गीय पट्टिकाओं पर लिखा है: “शापित हो वह जो दुर्भावना से अपने पड़ोसी पर प्रहार करता है”; और जो देखें और सुनें, वे सब कहें, “ऐसा ही हो”; और जिस मनुष्य ने देखा है और सूचना नहीं दीᵃ, वह उसी प्रकार शापित हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: शाब्दिक अर्थ ‘स्वर्ग की पट्टिकाएँ’ है; ‘स्वर्गीय पट्टिकाएँ’ हिन्दी में स्वाभाविक रहते हुए जुबिली ग्रंथ की अभिलेखीय धारणा को बनाए रखता है।
- source_word: ዘይዘብጥ፡ ካልአ
  choice: जो अपने पड़ोसी पर प्रहार करता है
  rationale: ይዘብጥ का अर्थ मारना/प्रहार करना है और ካልአ मूलतः ‘दूसरे’ को सूचित करता है; प्रसंगानुसार ‘पड़ोसी’ सामाजिक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በእኩይ
  choice: दुर्भावना से
  rationale: यह बुराई अथवा दुष्ट आशय का भाव देता है; ‘दुर्भावना से’ जानबूझकर किए गए अनिष्ट को स्पष्ट करता है, बिना हत्या का अर्थ अनावश्यक रूप से जोड़ने के।
- source_word: ይኩን
  choice: ऐसा ही हो
  rationale: सहमति या अभिपुष्टि के सूत्र को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ወኢነገረ
  choice: इसकी सूचना न दे
  rationale: पाठ-समीक्षा और प्रसंग के अनुसार अपेक्षित निषेधात्मक पाठ ‘और न बताया’ है; हिन्दी में ‘सूचना न दे’ साक्षी द्वारा घटना की रिपोर्ट न करने का आशय स्पष्ट करता है।
theological_decisions:
- issue: साक्षी के शाप का आधार
  choice: देखकर भी सूचना न देने वाले को शापित कहा गया है
  alternative: देखने और सूचना देने वाले को शापित कहा जाए
  rationale: दिए गए गीइज़ पाठ में संभवतः OCR के कारण निषेधचिह्न लुप्त है; प्रसंग, विधिक तर्क और प्रमाणित पाठ-परंपरा निषेधात्मक अर्थ का समर्थन करते हैं।
- issue: ‘उसी के समान’ का संदर्भ
  choice: अपराधी के समान शापित
  alternative: केवल सामान्य रूप से शापित
  rationale: ከማሁ तुलनात्मक अर्थ ‘उसके समान’ रखता है; अनुवाद जानबूझकर तुलना को बनाए रखता है और उसके धर्मवैज्ञानिक परिणामों को नहीं समझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। विधिक-घोषणात्मक लय और उद्धृत शाप-वचन सुरक्षित रखे गए हैं। कोई पादटिप्पणी नहीं दी गई, क्योंकि संशोधित निषेधात्मक पाठ मुख्य अनुवाद में स्पष्ट रूप से अपनाया गया है।
