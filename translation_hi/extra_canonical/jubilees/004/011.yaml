  text: पृथ्वी पर जन्मे लोगों में वह पहला था जिसने लेखन-कला, शिक्षा और बुद्धि का ज्ञान प्राप्त किया, और आकाश के चिह्नों को उनके महीनों के क्रम के अनुसार एक पुस्तक में लिखा, ताकि मानव-संतान वर्षों के निर्धारित समयों को उनके हर महीने के क्रम के अनुसार जान सकें।
