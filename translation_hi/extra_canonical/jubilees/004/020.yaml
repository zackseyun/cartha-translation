  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Daniel, the daughter of his father's sister; and in the sixth year of this week she bore him a son, and he called his name
translation:
  language: hi
  text: और बारहवें जुबली-चक्र में, उसके सातवें सप्ताह में, उसने अपने लिए एक पत्नी ली। उसका नाम एदनी था; वह दानिएल की बेटी और उसके पिता की बहन की बेटी थी। इसी सप्ताह के छठे वर्ष में एदनी ने उसके लिए एक पुत्र को जन्म दिया, और उसने उसका नाम रखा—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध पाठ में वाक्य यहीं अधूरा समाप्त होता है; पुत्र का नाम अगले पद में आता है।
    reason: स्रोत-पाठ की वास्तविक अपूर्ण वाक्य-सीमा को स्पष्ट करना और अनुवाद में नाम जोड़ने से बचना।
lexical_decisions:
