- source_word: ሱባዔ
  choice: सप्ताह
  rationale: शाब्दिक अर्थ ‘सात का समूह’ है और यहाँ जुबली के भीतर सात वर्षों की इकाई है। परंपरागत ‘सप्ताह’ रखा गया है, जबकि संदर्भ इसे वर्ष-सप्ताह बनाता है।
- source_word: እድኒ
  choice: एदनी
  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
- source_word: ወለተ፡ እኅተ፡ አቡሁ
  choice: उसके पिता की बहन की बेटी
  rationale: गीज़ की वंश-संबंधी अभिव्यक्ति को बिना ‘फुफेरी बहन’ जोड़कर संबंध का अर्थ तय किए निकट रूप में रखा गया है।
- source_word: ወጸውዐ፡ ስሞ
  choice: उसने उसका नाम रखा
  rationale: नाम पुकारने/रखने की सामान्य सामी अभिव्यक्ति का स्वाभाविक हिन्दी रूप।
