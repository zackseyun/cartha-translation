  text: And therefore the Lord rebuked Cain because of Abel[4], because he had killed him; and he made him a fugitive on the earth because of the blood of his brother, and he cursed him on the earth.
translation:
  language: hi
  text: इसलिए प्रभु ने कैन को हाबिल के कारण[a] डाँटा, क्योंकि उसने उसे मार डाला था। उसने कैन को उसके भाई के खून के कारण पृथ्वी पर भटकने वाला बना दिया और पृथ्वी पर उसे शाप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 4 कार्यरत गीज़ पाठ में अलग क्रमांकित पंक्ति के रूप में सुरक्षित नहीं है। इसका आशय आरंभिक दोहराव और पद 5 में जारी वाक्य से मिलता है।
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ उपाधि का सीधा और स्वाभाविक हिन्दी रूप; इसे इब्रानी चतुरक्षरीय नाम की विशिष्ट मुद्रण-परंपरा से नहीं जोड़ा गया।
- source_word: ዘለፎ
  choice: डाँटा
  rationale: यहाँ क्रिया फटकारने या ताड़ना देने का भाव रखती है; साधारण पाठक के लिए ‘डाँटा’ स्पष्ट और स्वाभाविक है।
- source_word: ገብረ ... ደበ ምድር
  choice: पृथ्वी पर भटकनेवाला बना दिया
  rationale: खंडित पद-विभाजन और निकटवर्ती प्रसंग से कैन को पृथ्वी पर भगोड़ा/भटकनेवाला बनाए जाने का अर्थ मिलता है; ‘भटकनेवाला’ प्राकृतिक हिन्दी है और अनावश्यक कानूनी अर्थ नहीं जोड़ता।
- source_word: ደመ እኁሁ
  choice: उसके भाई का खून
  rationale: शाब्दिक संबंध को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: ረገሞ
  choice: उसे शाप दिया
  rationale: स्रोत की स्पष्ट शाप-संबंधी क्रिया का सीधा अनुवाद।
theological_decisions:
- issue: प्रभु की उपाधि
  choice: प्रभु
  alternative: यहोवा / सर्वनाम-संकेतित ‘यहोवा’
  rationale: गीज़ እግዚአብሔር स्वयं इब्रानी परमेश्वर-नाम की विशिष्ट वर्तनी नहीं है; इसलिए संप्रदायगत या पांडुलिपि से परे पहचान आरोपित नहीं की गई।
- issue: कैन की स्थिति
  choice: भटकनेवाला
  alternative: भगोड़ा
  rationale: निकटवर्ती उत्पत्ति-परंपरा दोनों भावों का संकेत दे सकती है। हिन्दी में ‘भटकनेवाला’ दंड की अस्थिरता को व्यक्त करता है, जबकि अपराध-विधिक अर्थ को अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। लंबे गीज़ वाक्य को स्पष्टता के लिए दो हिन्दी वाक्यों में बाँटा गया है। ‘पृथ्वी’ और ‘खून’ जैसे सामान्य शब्द चुने गए हैं; स्रोत की पुनरुक्ति और कारण-संबंध को यथासंभव सुरक्षित रखा गया है।
