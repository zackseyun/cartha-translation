  text: वह सबसे पहले एक साक्ष्य[a] लिखने वाला था; उसने पृथ्वी की पीढ़ियों में मनुष्यों की संतानों को गवाही दी, जुबलियों के सप्ताहों का वर्णन किया, वर्षों के दिनों को ज्ञात कराया और महीनों को क्रम में रखा।
  philosophy: optimal-equivalence
  footnotes:
