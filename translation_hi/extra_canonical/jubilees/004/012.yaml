lexical_decisions:
- source_word: ስምዐ
  choice: साक्ष्य
  rationale: यह शब्द ‘गवाही/साक्ष्य’ के अर्थ-क्षेत्र में आता है। यहाँ लिखी हुई गवाही अभिप्रेत है, पर ‘अभिलेख’ का भाव भी सम्भव है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: मनुष्यों की संतानों
  rationale: गीज़ की वंशसूचक अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप, जो मानवजाति की आगामी पीढ़ियों का भाव बनाए रखता है।
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: जयन्तियों के सप्ताहों
  rationale: कालगणना की तकनीकी संरचना को व्याख्यात्मक विस्तार किए बिना सुरक्षित रखा गया है।
- source_word: አውራኅ፡ ሰርዐ
  choice: महीनों को क्रम से ठहराया
  rationale: क्रिया में व्यवस्थित करने या क्रम निर्धारित करने का भाव है; यह अनुवाद उसी औपचारिक कालगणनात्मक अर्थ को रखता है।
