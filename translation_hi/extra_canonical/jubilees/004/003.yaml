translation:
  language: hi
  text: और उसने उसे मैदान में मार डाला। उसका लहू भूमि से स्वर्ग तक पुकार उठा और उसके विषय में शिकायत करने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በገዳም
  choice: मैदान में
  rationale: यह पद हत्या के स्थान को खुले मैदान या खेत के रूप में बताता है; आधुनिक हिन्दी में ‘मैदान में’ स्वाभाविक और स्रोत-संगत है।
- source_word: ጸርኀ፡ ደሙ
  choice: उसका लहू ... पुकार उठा
  rationale: क्रिया रक्त की व्यक्तिकृत पुकार व्यक्त करती है। ‘लहू’ बाइबलीय गरिमा बनाए रखता है और ‘पुकार उठा’ उस तीव्रता को स्वाभाविक हिन्दी में देता है।
- source_word: እምድር፡ ውስተ፡ ሰማይ
  choice: भूमि से स्वर्ग तक
  rationale: स्रोत की दिशात्मक अभिव्यक्ति को सीधे सुरक्षित रखा गया है।
- source_word: ይስኪ፡ በእንተ
  choice: उसके विरुद्ध शिकायत करने लगा
  rationale: यह पदबंध शिकायत या अभियोग की धारणा रखता है। प्रसंग में मारे गए व्यक्ति का रक्त हत्यारे के विरुद्ध बोलता है; ‘शिकायत करने लगा’ प्राकृतिक हिन्दी है और अभियोगात्मक भाव भी बनाए रखता है।
theological_decisions:
- issue: रक्त की पुकार का व्यक्तिकरण
  choice: रक्त को पुकारते और शिकायत करते हुए ही प्रस्तुत किया गया
  alternative: इसे केवल परमेश्वर द्वारा हत्या का संज्ञान लेने के रूप में व्याख्यायित करना
  rationale: स्रोत स्वयं रक्त को कर्ता बनाता है; व्याख्यात्मक विस्तार जोड़ना उसके काव्यात्मक और न्यायिक तनाव को घटा देता।
- issue: शिकायत का लक्ष्य
  choice: ‘उसके विरुद्ध’
  alternative: ‘उसके कारण’ या ‘उसके विषय में’
  rationale: पूर्वसर्गीय पदबंध कुछ व्यापकता रख सकता है, पर हत्या के प्रसंग में अभियोग हत्यारे के विरुद्ध है। यह चयन अर्थ को स्पष्ट करता है, बिना कोई सम्प्रदायगत व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो वाक्यों का प्रयोग हिन्दी में घटनाक्रम और रक्त की पुकार को स्पष्ट बनाता है। ‘लहू’ तथा ‘स्वर्ग’ बाइबलीय शैली बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल है।
