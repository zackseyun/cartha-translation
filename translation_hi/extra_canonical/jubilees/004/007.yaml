  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। वंशावलियों और कालगणना की पुनरावृत्ति जानबूझकर सुरक्षित है। व्यक्तिनामों के परिचित हिन्दी बाइबलीय रूप जहाँ उपलब्ध थे वहाँ उनका प्रयोग किया गया, और कम परिचित नामों का देवनागरी लिप्यन्तरण किया गया। आरम्भ और अन्त स्रोत की तरह बड़े वाक्य के खण्ड हैं।
