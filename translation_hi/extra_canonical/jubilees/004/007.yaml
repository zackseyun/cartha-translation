  text: that are committed in heaven and on earth, and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks[7] of years. And in the fourth year of the fifth week they became joyful, and Adam again knew his wife, and she bore him a son, and he called his name Seth; for he said, “the Lord has raised up for me another seed on the earth in place of Abel, because Cain killed him.” And in the sixth week he fathered his daughter Azura. And Cain took Awan his sister as a wife, and she bore him Enoch at the end of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city and named it after his son Enoch. And Adam knew Eve his wife, and she bore nine more sons. And in the fifth week of the fifth jubilee Seth took Azura his sister as a wife, and in the fourth year she bore him Enos. He was the first to call on the name of the Lord on the earth. And in the seventh jubilee, in the
    third week, Enos took Noam his sister as a wife, and she bore him a son in the third year of the fifth week, and he called his name Kenan. And at the end of the eighth jubilee Kenan took Mualeleth his sister as a wife, and she bore him a son in the ninth jubilee, in the first week, in the third year of that week, and they called his name Mahalalel. And in the second week of the tenth jubilee Mahalalel took Dinah, the daughter of Barakiel, his father's brother's daughter, as a wife, and she bore him a son in the third week, in its sixth year, and they called his name Jared. For in his days the angels of the Lord descended to the earth, those who are called the Watchers, so that they might instruct the children of men,
translation:
  language: hi
  text: जो स्वर्ग और पृथ्वी पर, उजाले और अँधेरे में तथा हर स्थान पर किए जाते हैं। आदम और उसकी पत्नी ने हाबिल के लिए चार वर्ष-सप्ताहों[a] तक शोक मनाया। पाँचवें सप्ताह के चौथे वर्ष में वे फिर आनन्दित हुए। आदम ने फिर अपनी पत्नी के साथ सहवास किया, और उसने एक पुत्र को जन्म दिया। उसने उसका नाम शेत रखा, क्योंकि उसने कहा, “प्रभु ने मेरे लिए पृथ्वी पर हाबिल के स्थान में एक और वंश खड़ा किया है, क्योंकि कैन ने उसे मार डाला था।” छठे सप्ताह में आदम ने अपनी बेटी अज़ूरा को उत्पन्न किया। कैन ने अपनी बहन अवान को पत्नी बनाया, और उसने चौथे जुबली-वर्ष के अन्त में हनोक को जन्म दिया। पाँचवें जुबली-वर्ष के पहले सप्ताह के पहले वर्ष में पृथ्वी पर घर बनाए गए। कैन ने एक नगर बनाया और उसका नाम अपने पुत्र हनोक के नाम पर रखा। आदम ने अपनी पत्नी हव्वा के साथ सहवास किया, और उसने नौ और संतानों को जन्म दिया। पाँचवें जुबली-वर्ष के पाँचवें सप्ताह में शेत ने अपनी बहन अज़ूरा को पत्नी बनाया, और चौथे वर्ष में उसने एनोश को जन्म दिया। पृथ्वी पर सबसे पहले उसी ने प्रभु का नाम पुकारा। सातवें जुबली-वर्ष के तीसरे सप्ताह में एनोश ने अपनी
    बहन नोआम को पत्नी बनाया। उसने पाँचवें सप्ताह के तीसरे वर्ष में एक पुत्र को जन्म दिया, और उसने उसका नाम केनान रखा। आठवें जुबली-वर्ष के अन्त में केनान ने अपनी बहन मुआलेलेत को पत्नी बनाया। नौवें जुबली-वर्ष के पहले सप्ताह के तीसरे वर्ष में उसने एक पुत्र को जन्म दिया, और उन्होंने उसका नाम महललेल रखा। दसवें जुबली-वर्ष के दूसरे सप्ताह में महललेल ने बरकीएल की बेटी दीना को, अर्थात् अपने पिता के भाई की बेटी को, पत्नी बनाया। तीसरे सप्ताह के छठे वर्ष में उसने एक पुत्र को जन्म दिया, और उन्होंने उसका नाम येरेद रखा। क्योंकि उसके दिनों में प्रभु के वे स्वर्गदूत, जिन्हें “प्रहरी” कहा जाता है, मनुष्यों की संतानों को शिक्षा देने के लिए पृथ्वी पर उतरे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ और इस अध्याय में आगे “सप्ताह” प्रायः सात वर्षों की अवधि है। ग्रन्थ की कालगणना में एक जुबली-वर्ष सात ऐसे सप्ताहों, अर्थात उनचास वर्षों, का होता है।
    reason: ‘वर्ष-सप्ताहों’ के पारिभाषिक कालगणनात्मक अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: ሱባዔ
  choice: वर्ष-सप्ताह / सप्ताह
  rationale: यह ग्रन्थ की सात वर्षों वाली कालगणना को सूचित करता है। पहली बार ‘वर्ष-सप्ताह’ और आगे संक्षेप में ‘सप्ताह’ रखने से अर्थ और प्रवाह दोनों बने रहते हैं।
- source_word: ኢዮቤልው
  choice: जुबली-वर्ष
  rationale: विशिष्ट कालगणनात्मक इकाई को सामान्य ‘जयन्ती’ न बनाकर पारिभाषिक रूप में रखा गया है।
- source_word: አእመራ
  choice: सहवास किया
  rationale: मूल का शाब्दिक अर्थ ‘जाना’ है, पर यहाँ दाम्पत्य यौन-संबंध का संकेत है; आधुनिक हिन्दी में स्पष्ट और मर्यादित अभिव्यक्ति चुनी गई।
- source_word: ዘርአ
  choice: वंश
  rationale: शाब्दिक ‘बीज’ हिन्दी में इस कथन में अस्वाभाविक होता; ‘वंश’ प्रजनन और उत्तराधिकारी दोनों भाव सुरक्षित रखता है।
- source_word: ትጉሃነ
  choice: प्रहरी
  rationale: यह उन स्वर्गदूतों की उपाधि है जिन्हें जागते रहनेवाले या Watchers कहा जाता है; ‘प्रहरी’ संक्षिप्त और परिचित हिन्दी पद है।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ पद यहाँ परमेश्वर के लिए सामान्य उपाधि है, प्रत्यक्ष रूप से यहोवा नाम का रूप नहीं; इसलिए ‘प्रभु’ चुना गया।
- source_word: ደቂቀ
  choice: संतानें
  rationale: स्रोत का पद सामान्यतः बच्चों/संतानों के लिए है; इसलिए अंग्रेज़ी परामर्श-पाठ के अधिक विशिष्ट ‘sons’ की अपेक्षा लिंग-निरपेक्ष स्रोतार्थ रखा गया।
theological_decisions:
- issue: ‘प्रभु का नाम पुकारना’ का अर्थ
  choice: मुहावरे को यथावत रखा गया
  alternative: ‘प्रभु की आराधना करना’
  rationale: मूल अभिव्यक्ति पुकारने और उपासना दोनों की ओर संकेत कर सकती है; अनुवाद ने इस सम्भावित द्वयर्थता को नहीं सुलझाया।
- issue: प्रहरियों का उद्देश्य
  choice: ‘मनुष्यों की संतानों को शिक्षा देने के लिए’
  alternative: उनकी शिक्षा को आरम्भ से ही दुष्ट या निषिद्ध घोषित करना
  rationale: इस अंश में उद्देश्य केवल शिक्षा देना बताया गया है; बाद की परम्परा के नैतिक निष्कर्ष यहाँ आरोपित नहीं किए गए।
- issue: ‘वंश खड़ा किया’ में दैवी कार्य
  choice: प्रभु को कर्ता रखते हुए मूल रूपक का भाव बचाया
  alternative: ‘प्रभु ने मुझे दूसरा पुत्र दिया’
  rationale: वैकल्पिक रूप अधिक सहज है, पर स्रोत के ‘उठाया/खड़ा किया’ और ‘बीज/वंश’ के संयोजन को अधिक स्पष्ट रूप से सीमित कर देता।
