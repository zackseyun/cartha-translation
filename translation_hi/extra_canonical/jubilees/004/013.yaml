base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/013.yaml
  text: And in the eleventh jubilee, Jared took for himself a wife whose name was Baraka, the daughter of Rasuyal,[a] a daughter of his father's brother, in the fourth week of this jubilee. And she bore him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch.
translation:
  language: hi
  text: और ग्यारहवें जुबली-वर्षचक्र में, इसी जुबली-वर्षचक्र के चौथे सप्ताह में, येरेद ने बारका नाम की स्त्री से विवाह किया। वह रासूयाल[a] की बेटी थी, जो येरेद के पिता के भाई की बेटी थी। पाँचवें सप्ताह में, जुबली-वर्षचक्र के चौथे वर्ष में, उसने येरेद के लिए एक पुत्र को जन्म दिया, और उसने उसका नाम हनोक रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रासूयाल (ራሱያል) नाम को कुछ पुराने संस्करणों में ‘रासूजाल’ भी लिखा गया है।
    reason: lexical_choice
lexical_decisions:
- source_word: ኢዮቤል
  choice: जुबली-वर्षचक्र
  rationale: यह पद 49 वर्षों के जुबली कालखंड और उसके भीतर के सात-वर्षीय सप्ताहों की गणना करता है। केवल ‘जुबली’ सामान्य पाठक के लिए अस्पष्ट हो सकता है, इसलिए पहली ही अभिव्यक्ति में ‘वर्षचक्र’ जोड़कर कालगत अर्थ स्पष्ट किया गया है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल शब्द सात की इकाई को दर्शाता है; इस कालक्रम में वह सात वर्षों का सप्ताह है। पाठ की पारंपरिक गणना और शब्दावली बनाए रखने के लिए ‘सप्ताह’ रखा गया है।
- source_word: ራሱያል
  choice: रासूयाल
  rationale: गीज़ अक्षरों का सीधा देवनागरी लिप्यंतरण है; पुराने संस्करणों में मिलने वाले जकारयुक्त रूप से बचा गया है।
- source_word: ሄኖክሃ
  choice: हनोक
  rationale: नाम का प्रचलित आधुनिक हिन्दी बाइबलीय रूप चुना गया है, जो पात्र की पहचान सहज रखता है।
- source_word: ነሥአ ... ብእሲተ
  choice: स्त्री को अपनी पत्नी बनाया
  rationale: शाब्दिक भाव ‘अपने लिए स्त्री ग्रहण की’ है; आधुनिक हिन्दी में वैवाहिक अर्थ स्वाभाविक और स्पष्ट करने के लिए यह वाक्यांश चुना गया है।
theological_decisions:
- issue: पाँचवें सप्ताह और चौथे वर्ष का संबंध
  choice: ‘पाँचवें सप्ताह के चौथे वर्ष में’
  alternative: ‘पाँचवें सप्ताह में, जुबली-वर्षचक्र के चौथे वर्ष में’
  rationale: जुबली-वर्षचक्र के पाँचवें सप्ताह और पूरे चक्र के चौथे वर्ष को एक साथ रखना कालक्रम की दृष्टि से असंगत होगा। प्रसंगगत गणना के अनुसार चौथा वर्ष पाँचवें सप्ताह के भीतर समझना सबसे संगत है, यद्यपि गीज़ की संक्षिप्त रचना पूर्णतः स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वंश-संबंध को ‘उसके पिता के भाई की बेटी’ के रूप में स्पष्ट रखा गया है, उसे केवल ‘चचेरी बहन’ कहकर संक्षिप्त नहीं किया गया।
