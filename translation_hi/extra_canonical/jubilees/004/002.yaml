base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/002.yaml
  text: And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but Cain’s sacrifice was not accepted.
translation:
  language: hi
  text: और पाँचवें सप्ताह में उसने उसके लिए एक बेटी, आवान, को जन्म दिया। और तीसरी जुबली के पहले वर्ष में कैन ने हाबिल को मार डाला, क्योंकि हाबिल की भेंट स्वीकार की गई थी, पर कैन का बलिदान स्वीकार नहीं किया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋን
  choice: आवान
  rationale: व्यक्तिनाम का गीइज़ रूप ध्यान में रखते हुए देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया।
- source_word: ኢዮቤሌው
  choice: जुबली
  rationale: काल-गणना की इकाई के लिए हिन्दी में समझ में आने वाला प्रचलित बाइबिलीय रूप रखा गया।
- source_word: ቍርባኖ
  choice: भेंट
  rationale: यहाँ स्वीकार किए जाने वाली अर्पित वस्तु का सामान्य अर्थ है; इसलिए सहज और व्यापक हिन्दी शब्द चुना गया।
- source_word: መሥዋዕቶ
  choice: बलिदान
  rationale: दूसरे अर्पण-संज्ञक शब्द से स्रोत में उपस्थित शब्दगत भेद बनाए रखने के लिए ‘बलिदान’ चुना गया।
- source_word: ቀተሎ
  choice: मार डाला
  rationale: क्रिया के प्रत्यक्ष और परिणामसूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: हाबिल की भेंट और कैन के बलिदान के स्वीकार या अस्वीकार होने का कारणात्मक संबंध
  choice: ‘क्योंकि’ के साथ स्रोत का स्पष्ट कारणात्मक कथन बनाए रखा गया।
  alternative: इसे केवल घटनाओं के क्रम के रूप में प्रस्तुत करना
  rationale: गीइज़ እስመ कारण बताता है; अनुवाद को इस कथन को न कमजोर करना चाहिए, न इसमें कोई अतिरिक्त धार्मिक व्याख्या जोड़नी चाहिए।
- issue: अंतिम उपवाक्य में अस्वीकार किए गए बलिदान का स्वामी
  choice: ‘कैन का बलिदान’ स्पष्ट रूप से कहा गया।
  alternative: ‘उसका बलिदान’
  rationale: स्रोत में कैन का नाम स्पष्ट है; नाम दोहराने से हिन्दी में संभावित सर्वनाम-संदिग्धता दूर होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्वर रखा गया है। ‘उसने उसके लिए उसकी बेटी’ स्रोत के संबंध-सूचकों को यथासंभव बनाए रखता है, यद्यपि पूर्ववर्ती प्रसंग के बिना सर्वनामों की पहचान स्पष्ट नहीं होती। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
