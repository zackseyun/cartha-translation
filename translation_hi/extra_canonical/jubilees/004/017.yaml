  yaml_path: translation/extra_canonical/jubilees/004/017.yaml
  text: …year of the jubilee, and he called his name Enoch. He was the first among the children of men born on the earth who learned writing and knowledge and wisdom, and who wrote down the signs of heaven according to the order of their months in a book, so that they might know…
translation:
  language: hi
  text: …जुबली के वर्ष में, और उसने उसका नाम हनोक रखा। वह पृथ्वी पर जन्मे मनुष्यों में पहला था जिसने लेखन-कला, ज्ञान और बुद्धि सीखी, और जिसने आकाश के चिह्नों को उनके महीनों के क्रम के अनुसार एक पुस्तक में लिख दिया, ताकि वे जान सकें…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤል
  choice: जुबली
  rationale: यह ग्रंथ का प्रमुख कालगणना-संबंधी पारिभाषिक शब्द है; हिन्दी में पहचाने जाने योग्य रूप रखा गया है।
- source_word: ሄኖክ
  choice: हनोक
  rationale: बाइबिलीय नाम का प्रचलित हिन्दी रूप।
- source_word: መጽሐፈ ወትምህርተ ወጥበበ
  choice: लिखना, ज्ञान और बुद्धि
  rationale: तीनों समन्वित अवधारणाओं को अलग रखते हुए सहज आधुनिक हिन्दी में व्यक्त किया गया है; पहले शब्द को प्रसंगानुसार लेखन-कौशल के रूप में समझा गया है।
- source_word: ተአምረ ሰማይ
  choice: आकाश के चिह्न
  rationale: मूल के व्यापक अर्थ को सुरक्षित रखा गया है; इसे केवल तारों, राशियों या शकुनों तक सीमित नहीं किया गया।
- source_word: ሥርዐተ አውራኅሆሙ
  choice: उनके महीनों के क्रम के अनुसार
  rationale: सर्वनाम और कालगणना-संबंधी ‘क्रम’ को यथासंभव सीधे ढंग से सुरक्षित रखा गया है।
