  text: 'And these are the sons of Shem: Elam and Asshur and Arpachshad—this one was born two years after the flood—and Lud and Aram.'
translation:
  language: hi
  text: 'और शेम के पुत्र ये थे: एलाम, अश्शूर, अर्पक्षद—वह जलप्रलय के दो वर्ष बाद जन्मा था—लूद और अराम।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: शेम के पुत्र
  rationale: बहुवचन संबंधवाचक पद का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: ዝንቱ ትውልደ
  choice: वह … जन्मा था
  rationale: संकेतवाचक सर्वनाम और क्रिया विशेष रूप से निकटतम पूर्ववर्ती अर्पक्षद की ओर संकेत करते हैं; इसका अर्थ ‘यह पीढ़ी जन्मी’ नहीं है।
- source_word: ክልኤ ዓም እምድኅረ አይኅ
  choice: जलप्रलय के दो वर्ष बाद
  rationale: काल-संबंध को सीधे और आधुनिक हिन्दी में व्यक्त करता है; አይኅ के लिए प्रसंगानुकूल ‘जलप्रलय’ चुना गया है।
- source_word: ኤላም፡ ወአሱር፡ ወአርፋክስድ … ወሉድ፡ ወአራም
  choice: एलाम, अश्शूर, अर्पक्षद … लूद और अराम
  rationale: नामों के परिचित हिन्दी बाइबलीय लिप्यंतरण अपनाए गए हैं और मूल सूची का क्रम सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘यह/वह’ का संदर्भ
  choice: इसे अर्पक्षद के जन्म का कथन माना गया है।
  alternative: ‘यह पीढ़ी जन्मी थी।’
  rationale: गीज़ ዝንቱ एकवचन संकेतवाचक है और ትውልደ क्रियात्मक रूप ‘जन्मा था’ है; निकटतम एकवचन पूर्वपद अर्पक्षद है। यह उत्पत्ति 11:10 के काल-संकेत से भी मेल खाता है, पर निर्णय मुख्यतः गीज़ व्याकरण पर आधारित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। अर्पक्षद से संबंधित बीच के स्पष्टीकरण को डैशों में रखा गया है ताकि मूल सूची और उसका संदर्भ दोनों स्पष्ट रहें।
