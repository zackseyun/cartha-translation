base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/021.yaml
  text: And uncleanness and all lawlessness. For because of these three things the flood came upon the earth[a], because of the fornication by which the Watchers committed fornication contrary to the command of their ordinances, going after the daughters of men, and they took for themselves wives from all whom they chose, and they made the beginning of uncleanness.
translation:
  language: hi
  text: 'और अशुद्धता तथा हर प्रकार का अधर्म। क्योंकि इन्हीं तीन बातों के कारण पृथ्वी पर जलप्रलय आया: पहरेदारों ने मनुष्यों की बेटियों के पीछे जाकर उस आज्ञा के विरुद्ध व्यभिचार किया जो मैंने उन्हें दी थी[a]। उन्होंने उन सब में से जिन्हें उन्होंने चुना, अपने लिए पत्नियाँ ले लीं और अशुद्धता की शुरुआत की।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्यांश का अनुवाद यह भी हो सकता है: “पहरेदारों ने मनुष्यों की बेटियों के पीछे जाकर उस आज्ञा का उल्लंघन किया जो मैंने उन्हें दी थी।”'
    reason: source_ambiguity
lexical_decisions:
- source_word: ርኵስ
  choice: अशुद्धता
  rationale: यह शब्द नैतिक और धार्मिक अपवित्रता दोनों का भाव रखता है; ‘अशुद्धता’ उस व्यापकता को बनाए रखता है।
- source_word: ዐመፃ
  choice: अधर्म
  rationale: स्रोत में व्यवस्था-विरोध और अपराध का व्यापक भाव है; ‘हर प्रकार का अधर्म’ स्वाभाविक हिन्दी में उसे व्यक्त करता है।
- source_word: አይኅ
  choice: जलप्रलय
  rationale: संदर्भ में नूह के समय का महाप्रलय अभिप्रेत है; ‘जलप्रलय’ साधारण पाठक के लिए स्पष्ट और स्थापित शब्द है।
- source_word: ትጉሃን
  choice: पहरेदार
  rationale: यह एनोकीय परंपरा के ‘Watchers’ के लिए प्रयुक्त पद है; ‘पहरेदार’ उसकी उपाधि-सदृश प्रकृति को बनाए रखता है, बिना पाठ में अतिरिक्त पहचान जोड़ने के।
- source_word: ዝሙት
  choice: व्यभिचार
  rationale: यहाँ मनुष्यों की बेटियों के साथ निषिद्ध यौन संबंध का प्रसंग है; ‘व्यभिचार’ स्रोत के नैतिक और यौन दोनों बल को संक्षेप में व्यक्त करता है।
- source_word: አንስተ
  choice: स्त्रियाँ
  rationale: स्रोत का सामान्य शब्द ‘women/wives’ के अर्थ-क्षेत्र में है; ‘अपने लिए स्त्रियाँ ले लीं’ चुनाव और ग्रहण करने की क्रिया को अनावश्यक वैवाहिक वैधता दिए बिना रखता है।
theological_decisions:
- issue: पहरेदारों की पहचान
  choice: मुख्य पाठ में केवल ‘पहरेदार’
  alternative: ‘पहरेदार स्वर्गदूत’
  rationale: इस पद में स्रोत उन्हें स्वर्गदूत कहकर स्पष्ट नहीं करता; अतिरिक्त पहचान जोड़ने के बजाय पारंपरिक उपाधि को ही रखा गया है।
- issue: उनकी आज्ञा/नियमों से संबंधित वाक्यांश
  choice: ‘उनके लिए ठहराई गई आज्ञा के विरुद्ध’
  alternative: ‘अपने नियमों की आज्ञा का उल्लंघन करके’
  rationale: गीज़ वाक्यांश का संबंध और वाक्य-विन्यास कठिन है। चुना गया पाठ निषेध का भाव रखता है, पर यह दावा नहीं करता कि आज्ञा उन्हीं की बनाई हुई थी।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य अपनाया गया है। आरम्भ का खंडित वाक्य पिछले पद की सूची से जुड़ा प्रतीत होता है, इसलिए उसकी खंडित संरचना को मिटाया नहीं गया। कारण-सूचक क्रम और ‘अशुद्धता’ की पुनरावृत्ति स्रोत के अनुसार सुरक्षित रखी गई है।
