  text: which they shed in the midst of the earth. He destroyed everything, and I and you, my children, and all that entered with us into the ark were left. And behold, I see before me your deeds, that you are not walking in righteousness; for you have begun to walk in the paths of corruption, and you are separating, each one from his neighbor, and you will fight one with another, and you will not be united.
translation:
  language: hi
  text: 'जिसे उन्होंने पृथ्वी के बीचोंबीच बहाया था।[a] उसने सब कुछ नष्ट कर दिया, और मैं, तुम—मेरे बच्चों—और वे सभी जो हमारे साथ जहाज़ में आए थे, बचे रहे। और देखो, मैं तुम्हारे कामों को अपने सामने देख रहा हूँ: तुम धार्मिकता से नहीं चल रहे हो, क्योंकि तुम भ्रष्टता के मार्गों पर चलने लगे हो; तुममें से हर एक अपने पड़ोसी से अलग हो रहा है,[b] तुम एक-दूसरे से लड़ोगे और एकजुट नहीं रहोगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसने पृथ्वी के मध्य भाग को नष्ट कर दिया।”
    reason: आरम्भिक शब्दों के पुराने वैकल्पिक विभाजन और अर्थ को दर्ज करता है, यद्यपि मुख्य पाठ पिछले पद के ‘लहू’ को पूर्वपद मानता है।
  - marker: b
    text: या, “तुममें से हर एक अपने पड़ोसी के पीछे चलेगा।”
    reason: पूर्व प्रचलित पाठांतर/व्याख्या को दर्ज करता है; मुख्य पाठ गीइज़ क्रिया के ‘अलग होना’ और पूर्वसर्ग के ‘से’ अर्थ को प्राथमिकता देता है।
lexical_decisions:
- source_word: ዘከዐዉ
  choice: जिसे उन्होंने ... बहाया था
  rationale: क्रिया ‘उँडेलना/बहाना’ का भाव देती है और पिछले पद के ‘लहू’ को इसका स्वाभाविक पूर्वपद मानती है।
- source_word: ማእከለ ምድር
  choice: पृथ्वी के बीच में
  rationale: इसे विनाश की कर्म-वस्तु नहीं, लहू बहाए जाने के स्थान के रूप में लिया गया है।
- source_word: ደምሰሰ ኵሎ
  choice: उसने सब कुछ नष्ट कर दिया
  rationale: ኵሎ ‘सब कुछ’ को स्पष्ट रखा गया है; निहित कर्ता को संदर्भानुसार एकवचन ‘उसने’ से व्यक्त किया गया है।
- source_word: ታቦት
  choice: जहाज़
  rationale: जलप्रलय के संदर्भ में आधुनिक हिन्दी पाठक के लिए स्वाभाविक और तुरंत समझ में आने वाला शब्द।
- source_word: በጽድቅ
  choice: धार्मिकता से
  rationale: मूल के नैतिक-धार्मिक अर्थ को बिना किसी सम्प्रदायगत विस्तार के बनाए रखता है।
- source_word: ፍኖተ ሙስና
  choice: भ्रष्टता के मार्गों
  rationale: ‘मार्ग’ रूपक और नैतिक पतन, दोनों को सुरक्षित रखता है।
- source_word: ትትፋለጡ ... እም ቢጹ
  choice: हर एक अपने साथी से अलग हो रहा है
  rationale: पारस्परिक अलगाव/विभाजन और እም के ‘से’ अर्थ को व्यक्त करता है; ‘पीछे जाना’ अर्थ नहीं अपनाया गया।
- source_word: ኅቡረ
  choice: एकजुट
  rationale: साथ रहने अथवा संयुक्त होने की स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विनाश करने वाले का निहित कर्ता
  choice: उसने सब कुछ नष्ट कर दिया
  alternative: उसने/उसने ही (अर्थात परमेश्वर ने) सब कुछ नष्ट कर दिया
  rationale: मूल में कर्ता नाम से नहीं दिया गया; इसलिए अनुवाद में ‘परमेश्वर’ जोड़कर निहित संदर्भ को व्याख्यात्मक रूप से निश्चित नहीं किया गया।
- issue: धार्मिकता में चलने का रूपक
  choice: धार्मिकता से नहीं चल रहे हो
  alternative: धार्मिक जीवन नहीं जी रहे हो
  rationale: मूल का ‘चलना’ रूपक और उसकी नैतिक-धार्मिक तनातनी बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘देखो’, ‘मार्ग’, ‘धार्मिकता’ और ‘भ्रष्टता’ जैसे बाइबलीय रूपकों को रखा गया है, जबकि वाक्यरचना को स्वाभाविक हिन्दी बनाया गया है।
