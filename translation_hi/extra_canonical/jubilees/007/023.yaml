  text: and a man his neighbor. And everyone sold himself to do injustice and to shed much blood.
translation:
  language: hi
  text: और मनुष्य अपने पड़ोसी को।[a] हर एक ने अन्याय करने और बहुत रक्त बहाने के लिए अपने आपको बेच दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ में यह खंड शाब्दिक रूप से ‘और मनुष्य अपने पड़ोसी को’ है; इसकी क्रिया पूर्ववर्ती प्रसंग से समझी जाती है।
    reason: स्रोत-पाठ के व्याकरणिक रूप से अपूर्ण और संदर्भ-निर्भर खंड को स्पष्ट करना।
lexical_decisions:
- source_word: ቢጾ (bēṣo)
  choice: अपने पड़ोसी को
  rationale: यह शब्द साथी, संगी या पड़ोसी को सूचित कर सकता है; यहाँ परस्पर मानवीय संबंध और कर्म के लक्ष्य को व्यक्त करने के लिए ‘पड़ोसी’ चुना गया है।
- source_word: ተሰይጠ (tasayyəṭa)
  choice: अपने आपको बेच दिया
  rationale: स्रोत के ‘बेचा गया/अपने को बेच दिया’ रूपक को बनाए रखता है और बुराई के प्रति स्वेच्छापूर्वक समर्पण का भाव व्यक्त करता है।
- source_word: ዐመፃ (ʿamaṣā)
  choice: अन्याय
  rationale: शब्द में अन्याय, अत्याचार और हिंसक दुष्टता का अर्थ-क्षेत्र है; ‘अन्याय’ व्यापक और प्रसंगानुकूल विकल्प है।
- source_word: ይክዐው፡ ደመ፡ ብዙኀ (yəkʿaw dama bəzuḫa)
  choice: बहुत रक्त बहाने
  rationale: स्रोत के ‘बहुत रक्त उँडेलना’ मुहावरे को स्वाभाविक हिन्दी में ‘बहुत रक्त बहाना’ कहा गया है।
theological_decisions:
- issue: बुराई के प्रति मनुष्य के समर्पण का स्वरूप
  choice: ‘अपने आपको बेच दिया’ रूपक को यथावत रखा गया
  alternative: ‘पूरी तरह लग गया’ या ‘वश में हो गया’
  rationale: स्रोत-पाठ का रूपक नैतिक उत्तरदायित्व और आत्मसमर्पण के बीच तनाव बनाए रखता है; उसे व्याख्यात्मक ढंग से सरल नहीं किया गया।
- issue: आरंभिक खंड का अपूर्ण व्याकरण
  choice: खंड को स्रोत की तरह अपूर्ण रखा गया और पादटिप्पणी दी गई
  alternative: पिछले प्रसंग से क्रिया जोड़कर ‘मनुष्य ने अपने पड़ोसी के साथ भी ऐसा किया’
  rationale: उपलब्ध गीइज़ पाठ में स्पष्ट क्रिया नहीं है; कोई क्रिया जोड़ना वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। पहले खंड की असामान्य अपूर्णता स्रोत की वास्तविक स्थिति के कारण सुरक्षित रखी गई है; दूसरे वाक्य में स्रोत का तीखा नैतिक रूपक स्वाभाविक हिन्दी में बनाए रखा गया है।
