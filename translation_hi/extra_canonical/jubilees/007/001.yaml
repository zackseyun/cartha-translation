base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/001.yaml
  text: And in the seventh week, in its first year, in this jubilee, Noah planted a vine on the mountain on which the ark had come to rest, whose name was Lubar, one of the mountains of Ararat; and in the fourth year it produced fruit.
translation:
  language: hi
  text: और इस जुबली के सातवें सप्ताह के पहले वर्ष में नूह ने उस पर्वत पर अंगूर की एक बेल लगाई, जिस पर जहाज़ आकर ठहरा था। उस पर्वत का नाम लूबार था और वह अरारात के पर्वतों में से एक था। चौथे वर्ष में उस बेल पर फल लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይነ
  choice: अंगूर की एक बेल
  rationale: गीज़ शब्द यहाँ दाखलता/अंगूर की बेल को सूचित करता है; आधुनिक हिन्दी में अर्थ स्पष्ट रखने के लिए यह स्वाभाविक पद चुना गया।
- source_word: ታቦት
  choice: जहाज़
  rationale: संदर्भ नूह के जलप्रलय वाले बड़े जलयान का है। ‘जहाज़’ सामान्य पाठक के लिए सहज है और यहाँ ‘सन्दूक’ की संभावित भ्रामक छवि से बचाता है।
- source_word: ደብር / አድባረ
  choice: पर्वत / पर्वतों
  rationale: एकवचन और बहुवचन के स्रोतगत भेद को हिन्दी में बनाए रखा गया है।
- source_word: ሉባር
  choice: लूबार
  rationale: स्थान-नाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: ገብረ፡ ፍሬ
  choice: उस बेल पर फल लगे
  rationale: शाब्दिक अर्थ ‘फल उत्पन्न किया’ है; हिन्दी में बेल के लिए ‘फल लगे’ अधिक स्वाभाविक है और फलधारण का आशय सुरक्षित रखता है।
