  text: 'And Ham knew that his father had cursed his youngest son, and it displeased him that he had cursed his son; and he separated from his father, he and his sons with him: Cush and Mizraim and Put and Canaan.'
translation:
  language: hi
  text: 'और हाम को मालूम हुआ कि उसके पिता ने उसके सबसे छोटे बेटे को शाप दिया था। अपने बेटे को शाप दिए जाने से वह अप्रसन्न हुआ और अपने पिता से अलग हो गया—वह और उसके साथ उसके बेटे: कूश, मिस्रैम, पूत और कनान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእመረ፡ ካም
  choice: हाम को मालूम हुआ
  rationale: गीज़ क्रिया ‘जानना/मालूम होना’ को प्रसंग के अनुरूप सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ወልዱ፡ ዘይንእስ
  choice: उसके सबसे छोटे बेटे
  rationale: शाब्दिक अर्थ ‘उसका छोटा/सबसे छोटा पुत्र’ है; यहाँ नूह के पुत्र कनान का संकेत है, पर नाम जोड़कर अस्पष्टता को पाठ में नहीं सुलझाया गया।
- source_word: ወሐሎሙ፡ ኮነ፡ ሎቱ
  choice: वह अप्रसन्न हुआ
  rationale: इस कठिन अभिव्यक्ति का प्रसंगगत अर्थ असंतोष या अप्रसन्नता है; इसे स्वाभाविक हिन्दी में संक्षेप से रखा गया है।
- source_word: ወተፈልጠ፡ እምአቡሁ
  choice: अपने पिता से अलग हो गया
  rationale: मूल में अलग होने या पृथक हो जाने का भाव है।
- source_word: ኵስ፡ ወመሰጠሬም፡ ወፉድ፡ ወከናአን
  choice: कूश, मिस्रैम, पूत और कनान
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
theological_decisions:
- issue: शाप किसे दिया गया
  choice: ‘उसके सबसे छोटे बेटे’ की मूल अभिव्यक्ति बनाए रखी गई
  alternative: स्पष्ट रूप से ‘हाम के सबसे छोटे बेटे कनान’ कहना
  rationale: मूल पाठ संबंध-सूचक भाषा का प्रयोग करता है; कनान की पहचान प्रसंग से होती है, इसलिए अनुवाद ने उसे व्याख्यात्मक रूप से पाठ में नहीं जोड़ा।
