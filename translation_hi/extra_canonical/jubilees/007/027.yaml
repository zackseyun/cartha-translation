lexical_decisions:
- source_word: አጋንንት
  choice: दुष्टात्माएँ
  rationale: यहाँ शब्द हानिकारक अलौकिक शक्तियों को सूचित करता है; आधुनिक हिन्दी में ‘दुष्टात्माएँ’ साधारण पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: ሲኦል
  choice: अधोलोक
  rationale: मूल के मृतकों के लोक को किसी बाद की विशिष्ट नरक-धारणा से समान ठहराए बिना व्यक्त करता है।
- source_word: ነፍስ
  choice: प्राण
  rationale: रक्त और जीवन के संबंध वाले प्रसंग में ‘प्राण’ हिन्दी में व्यक्ति के जीवन को व्यक्त करता है और मूल की अर्थ-व्याप्ति बनाए रखता है।
- source_word: ፍትሐ፡ ወጽድቀ
  choice: न्याय और धार्मिकता
  rationale: दोनों समांतर नैतिक संज्ञाओं का भेद बनाए रखा गया है।
- source_word: ቀዳሜ፡ ፍሬ
  choice: पहली उपज
  rationale: कृषि और अर्पण के प्रसंग में प्रथम फल/उपज का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: रक्त और प्राण का संबंध
  choice: ‘प्राण को मांस समेत मत खाओ’ और ‘तुम्हारे प्राण का रक्त’
  alternative: ‘जीवन समेत मांस मत खाओ’
  rationale: मूल में रक्त, प्राण और उत्तरदायित्व के बीच जानबूझकर रखा गया संबंध सुरक्षित है; इसे किसी व्यवस्थित सिद्धान्त में नहीं बदला गया।
- issue: रक्तपात से दूषित पृथ्वी की शुद्धि
  choice: केवल रक्त बहानेवाले के रक्त से पृथ्वी के शुद्ध होने का कथन ज्यों का त्यों रखा
  alternative: इसे सामान्य दण्ड या प्रायश्चित्त के रूप में समझाकर नरम करना
  rationale: मूल का कठोर नैतिक और न्यायिक तनाव बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है।
- issue: ሲኦል की पहचान
  choice: अधोलोक
  alternative: नरक
  rationale: ‘नरक’ दण्ड के बाद के अधिक निश्चित धार्मिक अर्थ ला सकता है; ‘अधोलोक’ मूल की अपेक्षाकृत व्यापक मृतलोक-संज्ञा को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूल स्रोत में उपलब्ध पूरा अंश अनूदित किया गया है, भले ही अंग्रेज़ी परामर्श-पाठ कृषि-वृक्षों के उल्लेख पर समाप्त हो जाता है। कोष्ठक ‘[प्रेम करो]’ आरम्भिक अपूर्ण/कठिन वाक्य में पूरित अर्थ को स्पष्ट रूप से चिह्नित करता है।
