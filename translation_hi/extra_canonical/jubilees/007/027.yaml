- from: 'मेरे बच्चो, एक-दूसरे से [प्रेम करो]। क्योंकि मैं देख रहा हूँ—देखो, दुष्टात्माओं ने तुम्हारे और तुम्हारे बच्चों के विरुद्ध पाप करना आरम्भ कर दिया है। अब मुझे तुम्हारे विषय में यह भय है कि मेरी मृत्यु के बाद तुम पृथ्वी पर मनुष्यों का रक्त बहाओगे और स्वयं भी पृथ्वी के मुख पर से मिटा दिए जाओगे। क्योंकि जो कोई मनुष्य का रक्त बहाता है[a][b], और जो कोई किसी भी प्राणी का रक्त खाता है, वे सब पृथ्वी पर से मिटा दिए जाएँगे। जो मनुष्य रक्त खाता है या पृथ्वी पर मनुष्य का रक्त बहाता है, उसमें से कोई भी नहीं बचेगा; आकाश के नीचे न उसका वंश रहेगा, न कोई संतान। वे अधोलोक में जाएँगे, न्याय के स्थान में उतरेंगे और हिंसक मृत्यु के द्वारा वे सब अथाह गहराई के अन्धकार में प्रवेश करेंगे।


    जितने दिनों में तुम किसी जंगली पशु, पालतू पशु या पृथ्वी पर रेंगनेवाले किसी जीव को काटो, उसके रक्त में से कुछ भी तुम्हारे ऊपर दिखाई न दे। पृथ्वी के मुख पर बहाए गए रक्त को मिट्टी से ढककर अपने प्राणों के लिए भला काम करो। उन लोगों के समान न बनो जो रक्त समेत खाते हैं। दृढ़ रहो कि तुम्हारे सामने रक्त न खाया जाए; रक्त को ढक दो। क्योंकि मुझे यही आज्ञा दी गई है कि मैं तुम्हें, तुम्हारे बच्चों को और सब प्राणियों को इसकी गवाही दूँ। प्राण को मांस समेत मत खाओ, कहीं ऐसा न हो कि तुम्हारे प्राण का रक्त पृथ्वी पर उसे बहानेवाले किसी भी प्राणी के हाथ से माँगा जाए। क्योंकि पृथ्वी अपने ऊपर बहाए गए रक्त से शुद्ध नहीं होगी; जिसने रक्त बहाया है, केवल उसी के रक्त से पृथ्वी अपनी सब पीढ़ियों में शुद्ध होगी।


    अब, मेरे बच्चो, सुनो। न्याय और धार्मिकता के काम करो, जिससे तुम सारी पृथ्वी के मुख पर धार्मिकता में दृढ़ता से स्थापित हो सको और मेरी महिमा मेरे परमेश्वर के सामने ऊँची की जाए, जिसने मुझे जलप्रलय के पानी से बचाया। अब जाओ, अपने लिए नगर बनाओ और उनमें पृथ्वी के हर प्रकार के पौधे तथा फल देनेवाले हर प्रकार के वृक्ष लगाओ। तीन वर्ष तक उनका फल न तोड़ा जाए और न खाया जाए। चौथे वर्ष उनका फल इकट्ठा किया जाए, और उसकी पहली उपज उस परमप्रधान प्रभु के सामने चढ़ाई जाए जिसने आकाश, पृथ्वी और सब कुछ बनाया है। दाखमधु और तेल की पहली उपज प्रभु की वेदी पर ग्रहणयोग्य भेंट के रूप में चढ़ाई जाए, और जो शेष रहे उसे प्रभु के भवन के सेवक खाएँ।'
