base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/027.yaml
  text: 'My children, [love] one another. For I see, and behold, the demons have begun to sin against you and against your children, and now I fear for you, that after my death you will shed the blood of men on the earth, and you yourselves will be destroyed from the face of the earth. For everyone who sheds the blood of man[a], and everyone who eats the blood of any flesh, will all be destroyed from the earth. And no man who eats blood, or who sheds the blood of man on the earth, will be left; neither seed nor descendants will remain to him under heaven. For into Sheol they will go, and into the place of judgment they will descend, and into the darkness of the deep they will all enter by a violent death. Let no blood appear upon you from all the blood there is in all the days in which you slaughter any beast or cattle or whatever creeps on the earth; and do a good work for your souls by covering with earth that which has been poured out on the face of the earth. And do not be like one who
    eats with the blood, but be strong not to eat blood before you; cover the blood, for thus I have been commanded to testify to you and to your children, together with all flesh. And do not eat the life with the flesh, so that your blood, which is your life, may not be required from the hand of any flesh that sheds it on the earth. For the earth will not be cleansed from the blood that has been poured out upon it, except by the blood of the one who poured it out will the earth be cleansed throughout all its generations. And now, my children, listen: do justice and righteousness, so that you may be planted in righteousness over the face of the whole earth, and your glory may be lifted up before my God, who saved me from the waters of the flood. And behold, go and build for yourselves cities, and plant in them every plant that is on the earth, and every fruit-bearing tree.'
translation:
  language: hi
  text: 'मेरे बच्चो, एक-दूसरे से [प्रेम करो]। क्योंकि मैं देखता हूँ—देखो, दुष्टात्माओं ने तुम्हारे और तुम्हारे बच्चों के विरुद्ध पाप करना आरम्भ कर दिया है। अब मुझे तुम्हारे विषय में यह भय है कि मेरी मृत्यु के बाद तुम पृथ्वी पर मनुष्यों का रक्त बहाओगे और तुम स्वयं पृथ्वी के मुख पर से मिटा दिए जाओगे। क्योंकि जो कोई मनुष्य का रक्त बहाता है[a][b], और जो कोई किसी भी प्राणी का रक्त खाता है, वे सब पृथ्वी पर से मिटा दिए जाएँगे। जो मनुष्य रक्त खाता है या पृथ्वी पर मनुष्य का रक्त बहाता है, उसमें से कोई भी नहीं बचेगा; आकाश के नीचे न उसका वंश रहेगा, न उसकी संतान। वे अधोलोक में जाएँगे, न्याय के स्थान में उतरेंगे, और वे सब हिंसक मृत्यु के द्वारा अथाह गहराई के अन्धकार में प्रवेश करेंगे।


    जिन दिनों में तुम किसी जंगली पशु, पालतू पशु, या पृथ्वी पर रेंगनेवाले किसी जीव को वध करो, उन दिनों किसी रक्त का दाग तुम पर दिखाई न दे। पृथ्वी के मुख पर बहाए गए रक्त को मिट्टी से ढककर अपने प्राणों के लिए भला काम करो। उन लोगों के समान न बनो जो रक्त समेत खाते हैं; सावधान रहो कि तुम रक्त न खाओ। रक्त को ढक दो, क्योंकि मुझे यही आज्ञा दी गई है कि मैं तुम्हें, तुम्हारे बच्चों को और सब प्राणियों के विषय में इसकी गवाही दूँ। प्राण को मांस समेत मत खाओ, कहीं ऐसा न हो कि तुम्हारे प्राण का रक्त पृथ्वी पर उसे बहानेवाले किसी भी प्राणी के हाथ से माँगा जाए। क्योंकि पृथ्वी अपने ऊपर बहाए गए रक्त से शुद्ध नहीं होगी; जिस व्यक्ति ने रक्त बहाया है, केवल उसी के रक्त से पृथ्वी अपनी सारी पीढ़ियों में शुद्ध होगी।


    अब, मेरे बच्चो, सुनो। न्याय और धार्मिकता के काम करो, जिससे तुम सारी पृथ्वी के मुख पर धार्मिकता में दृढ़ता से स्थापित हो सको और तुम्हारी महिमा मेरे परमेश्वर के सामने ऊँची की जाए, जिसने मुझे जलप्रलय के पानी से बचाया। अब जाओ, अपने लिए नगर बनाओ और उनमें पृथ्वी के हर प्रकार के पौधे तथा फल देनेवाले हर प्रकार के वृक्ष लगाओ। तीन वर्ष तक उनका फल न तोड़ा जाए और न खाया जाए। चौथे वर्ष उनका फल खाया जाए, और उसकी पहली उपज उस परमप्रधान प्रभु के सामने चढ़ाई जाए, जिसने आकाश, पृथ्वी और सब कुछ बनाया है। दाखमधु और तेल की पहली उपज प्रभु की बलि-वेदी पर ग्रहणयोग्य भेंट के रूप में चढ़ाई जाए, और जो शेष रहे उसे प्रभु के भवन में खाया जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सुरक्षित पंक्ति-विन्यास में रक्त, हत्या और कृषि की पहली उपज से संबंधित यह लम्बा निर्देश एक ही विस्तृत पद में समेटा गया है, यद्यपि अधिक पूर्ण संस्करणों में यह सम्भवतः कई पदों में विभाजित था।
