translation:
  language: hi
  text: क्योंकि इसी प्रकार तुम्हारे पिता के पिता हनोक ने अपने पुत्र मतूशेलह को आज्ञा दी; फिर मतूशेलह ने अपने पुत्र लामेक को आज्ञा दी, और लामेक ने मुझे वे सब बातें करने की आज्ञा दी जिनकी आज्ञा उसके पूर्वजों ने उसे दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዘዘ
  choice: आज्ञा दी
  rationale: यह क्रिया आदेश देने का अर्थ रखती है और पद में चली आ रही निर्देश-परंपरा को स्पष्ट करती है।
- source_word: አበዊሁ
  choice: उसके पूर्वजों
  rationale: बहुवचन पद का स्वाभाविक हिन्दी रूप; यहाँ वंश की पिछली पीढ़ियों से मिले आदेश अभिप्रेत हैं।
- source_word: ኵሎ፡ ዘአዘዝዎ
  choice: वे सब बातें … जिनकी आज्ञा … दी थी
  rationale: स्रोत के ‘वह सब जिसकी उन्होंने उसे आज्ञा दी’ को सहज और अर्थनिष्ठ हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: हनोक, मतूशेलह और ‘तुम्हारे पिता’ के बीच वंश-संबंध की कठिन वाक्य-रचना
  choice: ‘तुम्हारे पिता के पिता हनोक ने अपने पुत्र मतूशेलह को’
  alternative: ‘तुम्हारे पिता मतूशेलह के पिता हनोक ने’
  rationale: मतूशेलह को स्पष्ट रूप से ‘अपने पुत्र’ और आज्ञा के प्राप्तकर्ता के रूप में बनाए रखा गया है; वैकल्पिक रूप मतूशेलह को ‘तुम्हारे पिता’ के साथ जोड़कर स्रोत की कठिनता को चुपचाप सुलझा देता और उपलब्ध संशोधन-निर्णय के विपरीत होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। वंशगत आदेश-श्रृंखला दिखाने के लिए ‘आज्ञा दी’ की पुनरावृत्ति जानबूझकर रखी गई है।
