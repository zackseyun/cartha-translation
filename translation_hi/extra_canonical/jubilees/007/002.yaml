base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/002.yaml
  text: And he kept its fruit, and gathered it in that year, in the seventh month. And he made wine from it, and put it into a vessel, and kept it until the fifth year, until the first day.
translation:
  language: hi
  text: और उसने उसका फल सँभालकर रखा और उसी वर्ष सातवें महीने में उसे इकट्ठा किया। फिर उसने उससे दाखमधु बनाया, उसे एक पात्र में रखा, और पाँचवें वर्ष तक—पहले दिन तक[a]—उसे सँभालकर रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में केवल “पहले दिन तक” है। “पहले महीने” का उल्लेख अगले पद में आरम्भ होता है।
    reason: पद-सीमा को स्पष्ट करना और उस पुराने पाठांतर से बचाना जिसमें अगले पद के शब्द इस पद में जोड़ दिए गए थे।
lexical_decisions:
- source_word: ዐቀበ / ዐቀቦ
  choice: सँभालकर रखा
  rationale: यह क्रिया फल और बाद में पात्र में रखे दाखमधु को सुरक्षित रखने का भाव देती है; ‘पहरा दिया’ की अपेक्षा यह प्रसंगानुकूल और स्वाभाविक है।
- source_word: ቀሰሞ
  choice: इकट्ठा किया
  rationale: फल की कटाई या संग्रह के अर्थ को सामान्य, स्पष्ट हिन्दी में व्यक्त करता है, बिना स्रोत से अधिक विशिष्टता जोड़ने के।
- source_word: ወይነ
  choice: दाखमधु
  rationale: अंगूर से बने मद्य के लिए गरिमापूर्ण और बाइबिलीय हिन्दी शब्द, जो केवल सामान्य ‘मदिरा’ की अपेक्षा स्रोत के अर्थ को अधिक ठीक से रखता है।
- source_word: ንዋይ
  choice: पात्र
  rationale: स्रोत में सामान्य अर्थ वाला एक पात्र या बरतन है; उसके प्रकार या सामग्री का अनुमान नहीं लगाया गया।
- source_word: ዕለት ቀዳሚት
  choice: पहले दिन
  rationale: पद की दी हुई गीइज़ सीमा में केवल ‘पहले दिन’ है; ‘पहले महीने का’ जोड़ना अगले पद के शब्दों को इस पद में ले आएगा।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। दोहराई गई क्रिया ‘सँभालकर रखा’ स्रोत की पुनरावृत्ति को बनाए रखती है। अंतिम काल-वाक्यांश की असामान्य रचना को डैशों और पादटिप्पणी द्वारा स्पष्ट किया गया है, पर स्रोत में न होने वाला ‘पहले महीने का’ मुख्य पाठ में नहीं जोड़ा गया।
