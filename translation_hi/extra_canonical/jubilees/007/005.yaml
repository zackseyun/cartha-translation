  text: And he caused all their flesh to ascend on the altar, and he placed all their offering mixed with oil upon it, and afterward he poured wine into the fire that was on the altar, and put incense on the altar, and caused a pleasing fragrance to ascend, acceptable before the LORD his God.
translation:
  language: hi
  text: और उसने उनका सारा मांस वेदी पर चढ़ाया और उनकी सारी तेल-मिली भेंट वेदी पर रखी। इसके बाद उसने वेदी पर की आग में दाखमधु उंडेला और वेदी पर धूप रखी। इस प्रकार उसने सुखद सुगंध ऊपर उठाई, जो यहोवा, उसके परमेश्वर के सामने स्वीकार्य थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ (ʾaʿrega)
  choice: चढ़ाया / ऊपर उठाई
  rationale: मूल का कारक अर्थ ‘ऊपर चढ़ाना/उठाना’ है। मांस के संबंध में ‘वेदी पर चढ़ाया’ स्वाभाविक बलिदानी भाषा है, जबकि सुगंध के लिए ‘ऊपर उठाई’ मूल बिंब को बनाए रखता है।
- source_word: መሥዋዕቶሙ (maśwāʿtomu)
  choice: उनकी सारी भेंट
  rationale: यह बलिदानी चढ़ावे के लिए प्रयुक्त शब्द है। ‘भेंट’ यहाँ सहज है और किसी विशेष प्रकार के बलिदान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ወይነ (wayna)
  choice: दाखमधु
  rationale: मूल में अंगूरी मदिरा है; ‘दाखमधु’ आधुनिक धार्मिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: ስኂነ (səḥina)
  choice: धूप
  rationale: मूल सुगंधित धूप-द्रव्य का सामान्य संकेत देता है; ‘लोबान’ कहना पदार्थ को मूल से अधिक विशिष्ट बना देता।
- source_word: መዐዛ፡ ሠናየ (maʿāzā śannāya)
  choice: मनभावनी सुगंध
  rationale: शाब्दिक अर्थ ‘अच्छी/सुखद सुगंध’ है; यह चयन बलिदानी संदर्भ में स्वाभाविक रहते हुए सकारात्मक मूल्य को व्यक्त करता है।
- source_word: እግዚአብሔር፡ አምላኩ (ʾƎgziʾabəḥer ʾamlāku)
  choice: उसके परमेश्वर यहोवा
  rationale: यह पदबंध ‘प्रभु, उसका परमेश्वर’ का भाव देता है। ‘यहोवा’ व्यक्तिगत ईश-नाम की पारंपरिक हिंदी पहचान बनाए रखता है और संबंधसूचक ‘उसके परमेश्वर’ को भी सुरक्षित रखता है।
theological_decisions:
- issue: बलिदान की सुगंध का परमेश्वर के सामने स्वीकार्य होना
  choice: ‘जो उसके परमेश्वर यहोवा के सामने स्वीकार्य थी’
  alternative: ‘जिससे उसका परमेश्वर यहोवा प्रसन्न हुआ’
  rationale: मूल का रूप ‘जो सामने प्रसन्न/स्वीकार्य करती है’ जैसा है। ‘स्वीकार्य थी’ बलिदानी स्वीकृति को व्यक्त करता है, पर परमेश्वर की भावावस्था को मूल से अधिक निश्चित नहीं करता।
- issue: मांस को ऊपर चढ़ाने की कारक क्रिया
  choice: ‘वेदी पर चढ़ाया’
  alternative: ‘वेदी पर जला दिया’
  rationale: मूल स्पष्ट रूप से ‘ऊपर चढ़ाया’ कहता है। दहन संदर्भ से निहित हो सकता है, किंतु ‘जला दिया’ मूल की अभिव्यक्ति को अनावश्यक रूप से स्पष्ट कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है। ‘धूप’ को सामान्य रखा गया है, और ‘दाखमधु’ बलिदानी संदर्भ में अंगूरी मदिरा को स्पष्ट करता है।
