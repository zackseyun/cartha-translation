  text: And Noah awoke from his wine and knew everything that his youngest son had done to him, and he cursed his son and said, “Cursed be Canaan; a lowly servant[a] shall he be to his brothers.”
translation:
  language: hi
  text: नूह दाखमधु का नशा उतरने पर जागा और जान गया कि उसके छोटे बेटे ने उसके साथ क्या किया था। तब उसने अपने बेटे को शाप दिया और कहा, “कनान शापित हो! वह अपने भाइयों का दासता का दास बने।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነቅሀ፡ ኖኅ፡ እምወይኑ
  choice: नूह दाखमधु के नशे से जागा
  rationale: वाक्यांश का आशय नूह का दाखमधु से उत्पन्न अवस्था के बाद जागना है; ‘दाखमधु’ स्रोत के ወይን को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ወልዱ፡ ዘይንእስ
  choice: उसके छोटे बेटे
  rationale: ዘይንእስ आयु अथवा पारिवारिक क्रम में छोटे पुत्र को सूचित करता है। हिन्दी में ‘छोटे बेटे’ स्रोत की संभावित ‘younger/youngest’ अस्पष्टता को ‘सबसे छोटा’ कहकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: ቅኑየ፡ ገብር
  choice: एक दीन दास
  rationale: गीज़ पदबंध अधीन और नीची सेवक-दशा पर बल देता है। ‘दीन दास’ अर्थ को संक्षेप में रखता है, जबकि परिचित उत्पत्ति-वाक्यांश ‘दासों का दास’ को बिना पर्याप्त आधार के आरोपित नहीं करता।
- source_word: ለአኃዊሁ
  choice: अपने भाइयों का
  rationale: स्रोत का बहुवचन संबंधसूचक रूप सीधे ‘उसके भाइयों का/के लिए’ है; हिन्दी उद्धरण में ‘अपने भाइयों का’ स्वाभाविक है।
theological_decisions:
- issue: शाप देने वाले वाक्य में ‘अपने बेटे’ और नामित कनान के बीच तनाव
  choice: ‘उसने अपने बेटे को शाप दिया’ के बाद सीधे ‘कनान शापित हो’ रखा गया
  alternative: ‘उसने कनान को शाप दिया’
  rationale: स्रोत पहले नूह द्वारा ‘अपने पुत्र’ को शाप देने की बात कहता है और फिर शाप में कनान का नाम लेता है। इस असंगति अथवा तनाव को व्याख्यात्मक रूप से समतल नहीं किया गया।
- issue: कनान की अधीनता का स्वरूप
  choice: ‘दीन दास’
  alternative: ‘दासों का दास’
  rationale: अधिक परिचित बाइबिलीय सूत्र को आयात करने के बजाय उपलब्ध इथियोपिक पाठ की विशिष्ट शब्दावली सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘दाखमधु’, ‘शापित’ और ‘दीन दास’ पाठ के प्राचीन धार्मिक परिवेश को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
