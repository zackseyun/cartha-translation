lexical_decisions:
- source_word: ባረኮ
  choice: आशीर्वाद दिया
  rationale: गीज़ क्रिया का स्वाभाविक और औपचारिक हिन्दी समतुल्य।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: इस प्रसंग में ईश्वर के विशिष्ट नाम को दर्शाता है; अंग्रेज़ी परामर्श-पाठ का LORD भी इसी ओर संकेत करता है।
- source_word: ገብር
  choice: सेवक
  rationale: शब्द का अर्थ सेवक या दास दोनों हो सकता है; मुख्य पाठ में सहज 'सेवक' रखा और अधिक कठोर विकल्प पादटिप्पणी में दिया।
