- issue: ‘उसका’ का संदर्भ
  choice: उसका
  alternative: शेम का
  rationale: मूल में सर्वनाम की संदर्भगत अस्पष्टता—यहोवा या शेम—को स्पष्ट करके समाप्त नहीं किया गया।
- issue: कनान की अधीनस्थ स्थिति
  choice: सेवक
  alternative: दास
  rationale: मूल शब्द अधीन सेवा से लेकर दासत्व तक का अर्थ दे सकता है; मुख्य पाठ और पादटिप्पणी दोनों मिलकर अर्थ-सीमा सुरक्षित रखते हैं।
