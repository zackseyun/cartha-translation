  yaml_path: translation/extra_canonical/jubilees/007/025.yaml
  text: The thoughts and desires of man imagine what is vain and evil continually, and the Lord destroyed everything from the face of the earth because of the evil of their deeds and because of blood.
translation:
  language: hi
  text: मनुष्य के विचार और इच्छाएँ निरन्तर व्यर्थता और बुराई की कल्पना करते हैं; और प्रभु ने उनके बुरे कामों और रक्त के कारण धरती के ऊपर से सब कुछ मिटा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ፡
  choice: मनुष्य के मन के विचार और उसकी इच्छाएँ
  rationale: ‘ሕሊና’ को प्रसंगानुसार मन के विचार और ‘ፈቃድ’ को इच्छाएँ कहा गया है; दोनों को बनाए रखने से स्रोत की संयुक्त अभिव्यक्ति सुरक्षित रहती है।
- source_word: ይኄሊ፡ ከንተ፡ ወእኩየ፡
  choice: व्यर्थ और बुरी बातों की कल्पना करती हैं
  rationale: क्रिया ‘ይኄሊ’ के सोचने/कल्पना करने के सक्रिय अर्थ को रखा गया है और ‘ከንተ’ तथा ‘እኩየ’—व्यर्थ और बुरा—दोनों को स्पष्ट किया गया है।
- source_word: በኵሉ፡ መዋዕል።
  choice: निरन्तर
  rationale: शाब्दिक ‘सब दिनों’ का स्वाभाविक हिन्दी समतुल्य, जो लगातार बने रहने का भाव देता है।
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እም ... ገጸ፡ ምድር፡
  choice: और प्रभु ने ... धरती के ऊपर से सब कुछ मिटा दिया
  rationale: ‘ደምሰሰ’ के नष्ट/मिटा देने के अर्थ और ‘पृथ्वी के मुख से’ की सेमिटिक अभिव्यक्ति को सहज आधुनिक हिन्दी में प्रस्तुत किया गया है। स्रोत में अंक-सदृश पाठ ‘፳፰’ संभवतः पाठगत/मुद्रणगत व्यवधान है और अर्थ-रचना में शामिल नहीं किया गया।
- source_word: በእንተ፡ እኩይ፡ ምግባሮሙ፡ ወበእንተ፡ ደም፡
  choice: उनके बुरे कामों और बहाए गए खून के कारण
  rationale: ‘उनके’ बहुवचन को सुरक्षित रखा गया है। केवल ‘खून’ की अपेक्षा ‘बहाए गए खून’ हिन्दी में रक्तपातजन्य दोष का आशय स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: मानवीय विचारों और इच्छाओं की नैतिक दशा
  choice: वे निरन्तर व्यर्थ और बुरी बातों की कल्पना करती हैं
  alternative: वे निरन्तर बुरी हैं
  rationale: स्रोत में सक्रिय क्रिया ‘सोचना/कल्पना करना’ तथा ‘व्यर्थ’ और ‘बुरा’ दोनों पद हैं; इसलिए इसे केवल अस्तित्वसूचक ‘बुरी हैं’ में समतल नहीं किया गया।
- issue: ‘खून’ का आशय
  choice: बहाया गया खून
  alternative: खून
  rationale: यह विनाश के कारण के रूप में आता है और रक्तपात का संकेत देता है; फिर भी किसी विशेष हत्यात्मक घटना या विकसित धर्मशास्त्रीय अर्थ को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘धरती के ऊपर से’ स्वाभाविक रखा गया है; ‘पृथ्वी के मुख पर से’ अधिक शाब्दिक किंतु कम सहज होता।
