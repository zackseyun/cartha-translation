  - severity: medium
    issue: ‘नई दाखमधु’ mistranslates ‘first wine.’
    rationale: ‘First’ denotes firstfruits/first produce, not newly made wine; ‘नई’ introduces a meaning absent from the source.
  - severity: low
    issue: Footnote a presents the source-near rendering as a mere alternative while the main text adopts a narrowed interpretation.
    rationale: Once the main text is corrected to the broader wording, the footnote is no longer needed.
