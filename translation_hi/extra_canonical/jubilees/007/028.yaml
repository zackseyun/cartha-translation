  yaml_path: translation/extra_canonical/jubilees/007/028.yaml
  text: For three years the fruit of everything that is eaten shall not be gathered; and in the fourth year its fruit shall be gathered, and the firstfruits acceptable before the LORD Most High, who created heaven and earth and everything, shall be offered up. Let them offer in abundance the first wine and oil as firstfruits on the altar of the LORD, who receives it; and what is left over let the servants of the house of the LORD eat before the altar that receives it.
translation:
  language: hi
  text: तीन वर्षों तक जो कुछ खाया जाता है, उसका फल इकट्ठा न किया जाए। चौथे वर्ष उसका फल इकट्ठा किया जाए, और स्वर्ग, पृथ्वी और सब कुछ के सृष्टिकर्ता, परमप्रधान प्रभु के सम्मुख स्वीकार्य पहले फल चढ़ाए जाएँ। वे पहले फल के रूप में पहला दाखरस और तेल बहुतायत से प्रभु की स्वीकार्य वेदी पर चढ़ाएँ; और जो बच रहे, उसे प्रभु के भवन के सेवक उस स्वीकार्य वेदी के सामने खाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሬሁ ... እምኵሉ፡ ዘይትበላዕ
  choice: खाने योग्य हर पेड़ का फल
  rationale: गीज़ में प्रत्यययुक्त ‘उसका फल’ के बाद संबंधसूचक पद आता है; आशय खाने के लिए उगाई गई हर फलदायी वस्तु का फल है। निकटवर्ती संदर्भ पेड़ों और रोपणों का है, इसलिए स्वाभाविक हिन्दी में ‘हर पेड़’ स्पष्ट किया गया।
- source_word: ቀዳሜ፡ ፍሬ
  choice: पहले फल
  rationale: कृषि उपज के आरंभिक अंश को दर्शाने वाला सरल और स्रोत-समीपी पद चुना गया; ‘पहली उपज’ भी संभव है।
- source_word: እግዚአብሔር፡ ልዑል
  choice: परमप्रधान प्रभु
  rationale: दोनों उपाधियों—प्रभु और परमप्रधान—को बनाए रखा गया है।
- source_word: በጥሉ
  choice: भरपूर मात्रा में
  rationale: प्रसंग में दाखमधु और तेल की प्रथम उपज उदार/प्रचुर मात्रा में चढ़ाने का भाव है; दुर्बोध शाब्दिकता से बचते हुए अर्थ रखा गया।
- source_word: ምሥዋዕ፡ ... ይትወከፍ
  choice: ग्रहण की जाने वाली वेदी
  rationale: स्रोत में वेदी के साथ स्वीकार/ग्रहण किए जाने का कर्मवाच्य भाव है; इसे परमेश्वर द्वारा ग्रहण की जाने वाली भेंट/वेदी की अस्पष्टता को पूरी तरह मिटाए बिना रखा गया।
theological_decisions:
- issue: ‘ग्रहण की जाने वाली’ का संबंध वेदी से है या उस पर चढ़ाई भेंट से
  choice: मुख्य पाठ में स्रोत की व्याकरणिक निकटता के अनुसार इसे ‘वेदी’ से जोड़ा गया
  alternative: ‘उस वेदी पर, जहाँ प्रभु उसे ग्रहण करते हैं’
  rationale: गीज़ का संबंधवाचक रूप निकटवर्ती ‘वेदी’ के साथ आता है, यद्यपि अर्थ की दृष्टि से ग्रहण की जाने वाली वस्तु भेंट भी समझी जा सकती है; किसी विशेष बलिदान-सिद्धांत को आरोपित नहीं किया गया।
- issue: उपज संबंधी आदेश का दायरा
  choice: ‘खाने योग्य हर पेड़’
  alternative: ‘खाई जाने वाली हर वस्तु’
  rationale: तत्काल संदर्भ भूमि पर लगाए गए फलदायी पेड़ों का है; फिर भी स्रोत का पद अधिक व्यापक रूप से ‘जो कुछ खाया जाता है’ कहा जा सकता है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सामान्य पाठक के लिए सहज। कृषि और उपासना-संबंधी पदों में स्रोत की औपचारिकता रखी गई है; अनावश्यक संस्कृतनिष्ठ शब्दावली से बचा गया।
