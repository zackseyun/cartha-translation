base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/008.yaml
  text: And Ham saw Noah his father naked[a], and he went out and told his two brothers outside. And Shem took a garment, and he and Japheth laid the garment on their shoulders.
translation:
  language: hi
  text: और हाम ने अपने पिता नूह को नंगा देखा। वह बाहर गया और वहाँ अपने दोनों भाइयों को बताया। तब शेम ने एक वस्त्र लिया, और उसने और यापेत ने उस वस्त्र को अपने कंधों पर रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्रोत-पाठ में पदों का विभाजन कुछ असामान्य है। इस पद में शेम और यापेत द्वारा वस्त्र कंधों पर रखने तक का वर्णन है; पीछे की ओर चलकर पिता को ढकने का आगे का वर्णन अगले पद में आता है।
    reason: segmentation_note
lexical_decisions:
- source_word: ዕራቆ
  choice: नंगा
  rationale: यह रूप नूह की निर्वस्त्र अवस्था को सीधे व्यक्त करता है; प्रसंग में इसे व्याख्यात्मक रूप से ‘लज्जाजनक दशा’ नहीं बनाया गया।
- source_word: በአፍአ
  choice: बाहर मौजूद
  rationale: गीज़ में ‘बाहर’ का स्थान-सूचक भाव है। हिंदी में इसकी पुनरावृत्ति को स्वाभाविक रखते हुए स्पष्ट किया गया कि दोनों भाई बाहर थे।
- source_word: ልብሰ
  choice: वस्त्र
  rationale: स्रोत का सामान्य अर्थ ‘कपड़ा/वस्त्र’ है; गरिमापूर्ण कथात्मक शैली के लिए ‘वस्त्र’ चुना गया।
- source_word: መታክፍቲሆሙ
  choice: अपने कंधों
  rationale: बहुवचन रूप दोनों भाइयों के कंधों को दर्शाता है; हिंदी में स्वाभाविक सामूहिक अभिव्यक्ति अपनाई गई।
theological_decisions:
- issue: हाम के देखने और बताने की प्रकृति
  choice: केवल स्रोत में वर्णित क्रियाएँ—देखना और भाइयों को बताना—रखी गईं
  alternative: हाम की नीयत, उपहास या किसी यौन अपराध का संकेत जोड़ना
  rationale: इस पद का गीज़ पाठ ऐसी व्याख्याएँ स्पष्ट नहीं करता; इसलिए वास्तविक कथात्मक अस्पष्टता को बनाए रखा गया।
- issue: अगले पद की ढकने वाली क्रिया का समावेश
  choice: अनुवाद को कंधों पर वस्त्र रखने तक सीमित रखा गया
  alternative: पीछे चलकर पिता को ढकने और मुख फेरने का विवरण इसी पद में जोड़ना
  rationale: प्रदत्त गीज़ स्रोत में इस पद का पाठ वस्त्र कंधों पर रखने पर समाप्त होता है; आगे की सामग्री को यहाँ मिलाना पद-विभाजन को बिगाड़ेगा।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। नामों के लिए ‘हाम’, ‘नूह’, ‘शेम’ और ‘येपेत’ रूप अपनाए गए हैं। वाक्य-विन्यास को हिंदी में स्वाभाविक बनाया गया है, पर स्रोत की क्रियाओं और पद-सीमा को सुरक्षित रखा गया है।
