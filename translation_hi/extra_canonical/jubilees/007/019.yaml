  text: These are the sons of Noah. And in the twenty-eighth jubilee Noah began to command the ordinances and the commandments to his sons' sons, and all the judgments that he knew; and he testified to his sons that they should do righteousness, and that they should cover the shame of their flesh, and that they should bless their Creator, and honor father and mother, and each one love his neighbor, and guard themselves from fornication and uncleanness and all injustice.
translation:
  language: hi
  text: ये नूह के पुत्रों के वंशज थे। अट्ठाईसवें जुबली-वर्ष में नूह ने अपने पोतों को विधियाँ, आज्ञाएँ और वे सभी न्याय-विधियाँ, जिनका उसे ज्ञान था, सिखाना आरम्भ किया। उसने अपने पुत्रों को साक्षी देकर समझाया कि वे धार्मिकता पर चलें, अपने शरीर की नग्नता ढकें, अपने सृष्टिकर्ता को धन्य कहें, पिता और माता का आदर करें, हर एक अपने पड़ोसी से प्रेम करे, और व्यभिचार, अशुद्धता और हर प्रकार के अन्याय से अपने आपको बचाए रखें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዛተ
  choice: विधियाँ और आज्ञाएँ
  rationale: दो समानांतर विधिक शब्दों का भेद बनाए रखते हुए आधुनिक और बोधगम्य हिन्दी दी गई है।
- source_word: ፍትሐ
  choice: न्याय की ... बातें
  rationale: यहाँ शब्द नूह को ज्ञात न्याय-विषयक नियमों या निर्णयों की समष्टि बताता है; हिन्दी में कृत्रिम कानूनी भाषा से बचते हुए अर्थ सुरक्षित रखा गया है।
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: अपने शरीर की नग्नता
  rationale: शाब्दिक रूप से ‘शरीर/देह की लज्जा’ का भाव है; प्रसंग में नग्नता ढकने का आशय स्पष्ट है।
- source_word: ቢጾ
  choice: पड़ोसी
  rationale: शब्द साथी या निकटवर्ती व्यक्ति को सूचित करता है; प्रेम की नैतिक आज्ञा के प्रसंग में ‘पड़ोसी’ स्वाभाविक और व्यापक है।
- source_word: ዝሙት፡ ወርኵስ፡ ወእምኵሉ፡ ዐመፃ
  choice: व्यभिचार, अशुद्धता और हर प्रकार के अन्याय
  rationale: तीनों नैतिक श्रेणियों—यौन अनैतिकता, अपवित्रता और व्यापक दुष्कर्म/अन्याय—को अलग-अलग बनाए रखा गया है।
theological_decisions:
- issue: धार्मिकता और नैतिक आचरण का संबंध
  choice: ‘धार्मिकता के काम करें’
  alternative: ‘धर्मी बनें’
  rationale: स्रोत का क्रियात्मक रूप आचरण पर बल देता है; अनुवाद किसी विशेष सिद्धान्तगत अर्थ को आरोपित नहीं करता।
- issue: सृष्टिकर्ता को धन्य कहना
  choice: ‘अपने सृष्टिकर्ता को धन्य कहें’
  alternative: ‘अपने सृष्टिकर्ता की स्तुति करें’
  rationale: ‘धन्य कहना’ स्रोत की आशीर्वचनात्मक भाषा को अधिक निकटता से रखता है, जबकि ‘स्तुति’ अर्थ को कुछ संकुचित कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘जुबली-वर्ष’ को प्राचीन कालगणना के तकनीकी पद के रूप में रखा गया है।
