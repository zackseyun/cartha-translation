  to: ये नूह के पुत्रों के वंशज थे। अट्ठाईसवें जुबली-वर्ष में नूह ने अपने पोतों को विधियाँ, आज्ञाएँ और वे सभी न्याय-विधियाँ, जिनका उसे ज्ञान था, सिखाना आरम्भ किया। उसने अपने पुत्रों को साक्षी देकर समझाया कि वे धार्मिकता पर चलें, अपने शरीर की नग्नता ढकें, अपने सृष्टिकर्ता को धन्य कहें, पिता और माता का आदर करें, हर एक अपने पड़ोसी से प्रेम करे, और व्यभिचार, अशुद्धता और हर प्रकार के अन्याय से अपने आपको बचाए रखें।
  rationale: संशोधन स्रोत के ‘पुत्रों के वंशज’ और नूह के साक्ष्यात्मक उपदेश को अधिक निकटता से प्रस्तुत करता है, बिना किसी व्याख्यात्मक या सम्प्रदायगत अर्थ को जोड़े। सूची की नैतिक और विधिक शब्दावली भी अधिक समांतर और स्वाभाविक की गई है।
