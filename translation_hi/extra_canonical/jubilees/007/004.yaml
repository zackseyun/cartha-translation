  yaml_path: translation/extra_canonical/jubilees/007/004.yaml
  text: And he prepared the kid first, and put some of its blood on the flesh that was on the altar which he had made; and all its fat he offered up on the altar where he had made the burnt offering, and the ox and the ram and the sheep.
translation:
  language: hi
  text: उसने पहले बकरी के बच्चे को तैयार किया और उसके लहू में से कुछ उस मांस पर लगाया जो उसकी बनाई हुई वेदी पर था। फिर उसने उसकी सारी चरबी उस वेदी पर चढ़ाई जहाँ उसने होमबलि चढ़ाई थी, और बैल, मेढ़े और भेड़ों की [चरबी] भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሕስአ
  choice: बकरी के बच्चे
  rationale: यहाँ बलि के लिए प्रयुक्त छोटे बकरे या बकरी के बच्चे का बोध है; आधुनिक हिन्दी में यह स्पष्ट और सहज है।
- source_word: ደሙ
  choice: उसके लहू
  rationale: बलिदान-संबंधी प्रसंग में ‘लहू’ गरिमापूर्ण और पारंपरिक होते हुए भी सामान्य पाठक के लिए बोधगम्य है।
- source_word: ስብሖ
  choice: उसकी सारी चरबी
  rationale: प्रत्यय को बलि-पशु से संबंधित मानते हुए स्वामित्व स्पष्ट किया गया है; बलिदान के संदर्भ में ‘चरबी’ उपयुक्त शब्द है।
- source_word: አዕረገ
  choice: चढ़ाई
  rationale: मूल क्रिया का शाब्दिक भाव ‘ऊपर चढ़ाना’ है और यहाँ उसका बलिदान-संबंधी अर्थ है; ‘चढ़ाई’ दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ምሥዋዕ
  choice: वेदी
  rationale: संदर्भ में यह बलिदान चढ़ाने के स्थान या वेदी को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘वेदी’ सटीक और परिचित है।
- source_word: ጽንሓሐ
  choice: होमबलि
  rationale: यह उस बलि को सूचित करता है जिसे वेदी पर जलाकर चढ़ाया जाता है; ‘होमबलि’ संक्षिप्त और स्थापित हिन्दी पद है।
theological_decisions:
- issue: चरबी चढ़ाने वाली क्रिया का अनुवाद
  choice: चढ़ाई
  alternative: ऊपर उठाया / धुआँ बनाकर ऊपर पहुँचाया
  rationale: मूल की आरोहण-संबंधी छवि को पूरी तरह मिटाए बिना बलिदान की क्रिया को स्वाभाविक हिन्दी में व्यक्त किया गया है; धुएँ का उल्लेख मूल से अधिक विशिष्ट होता।
- issue: अंतिम पशु-सूची का वाक्यगत संबंध
  choice: बैल, मेढ़े और भेड़ों को होमबलि के पशुओं के रूप में जोड़ा
  alternative: चरबी के साथ अलग से चढ़ाई गई वस्तुओं की सूची
  rationale: वाक्य-संरचना और परामर्श-पाठ के अनुसार सूची निकटवर्ती होमबलि को स्पष्ट करती है; इससे किसी अतिरिक्त धार्मिक निष्कर्ष को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तैयार किया’ मूल की संभावित व्यापकता को बनाए रखता है और बिना स्पष्ट आधार के ‘वध किया’ नहीं जोड़ता। पशुओं की अंतिम सूची को हिन्दी में संबंधसूचक रूप देकर वाक्य स्वाभाविक बनाया गया है।
