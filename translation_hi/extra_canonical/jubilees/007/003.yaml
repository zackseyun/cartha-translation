base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/003.yaml
  text: 'On the new moon of the first month, he made a feast on that day with rejoicing, and he made a burnt offering to the LORD: one young bull, one ram, seven yearling sheep, and one male goat, so that he might make atonement for himself and for his sons.'
translation:
  language: hi
  text: 'पहले महीने के नवचंद्र के दिन उसने उस दिन आनन्द के साथ एक भोज किया,[a] और यहोवा के लिए होमबलि चढ़ाई: एक जवान बैल, एक मेढ़ा, एक वर्ष के सात मेमने,[b] और एक बकरा, ताकि वह अपने और अपने पुत्रों के लिए प्रायश्चित करे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उस दिन उसने आनन्द के साथ एक भोज किया।”
    reason: आरम्भिक काल-सूचक पदबंध और ‘उस दिन’ के वाक्य-विन्यास का वैकल्पिक प्रस्तुतीकरण सुरक्षित रखता है।
  - marker: b
    text: या, “सात भेड़ें।”
    reason: पशु-संज्ञा के अधिक सामान्य अनुवाद की संभावना दर्शाता है; मुख्य पाठ मूल में दी गई एक वर्ष की आयु को बनाए रखता है।
lexical_decisions:
- source_word: ሠርቀ፡ ወርኀ፡ ቀዳሚት
  choice: पहले महीने की अमावस्या
  rationale: यह पदबंध पहले महीने के नवचंद्र को सूचित करता है; आधुनिक हिन्दी में तिथि-सूचक स्वाभाविक अभिव्यक्ति के रूप में ‘अमावस्या’ चुना गया।
- source_word: ጽንሓሐ
  choice: होमबलि
  rationale: संदर्भ में पूरी तरह अर्पित अग्निबलि अभिप्रेत है; हिन्दी बाइबलीय शब्दावली में ‘होमबलि’ सटीक और परिचित है।
- source_word: ዋ፡ እምአልህምቱ፡ አሐደ
  choice: एक बछड़ा
  rationale: स्रोत एक युवा गौवंशीय नर बलिपशु का संकेत देता है; ‘बछड़ा’ साधारण हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: አባግዐ፡ ዘዘ፡ ዓመት፡ ሰብዐተ
  choice: एक-एक वर्ष के सात मेमने
  rationale: संख्या सात और प्रत्येक पशु की एक वर्ष की आयु—दोनों विवरण सुरक्षित रखे गए हैं।
- source_word: መሐስአ፡ ጢለ፡ አሐደ
  choice: एक बकरा
  rationale: स्रोत बकरी जाति के एक नर पशु को दर्शाता है; ‘बकरा’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: प्रायश्चित का कर्ता और लाभार्थी
  choice: ताकि वह अपने और अपने पुत्रों के लिए प्रायश्चित करे
  alternative: ताकि उसके और उसके पुत्रों के लिए प्रायश्चित हो
  rationale: स्रोत की क्रियात्मक रचना में वही व्यक्ति अनुष्ठान करता है; सक्रिय रूप इस व्याकरणिक संबंध को बनाए रखता है, बिना प्रायश्चित के धर्मशास्त्रीय तंत्र की अतिरिक्त व्याख्या किए।
- issue: ईश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: गीज़ ‘እግዚአብሔር’ का प्रयोग करता है; यहाँ उपलब्ध परामर्श-पाठ के LORD और हिन्दी बाइबलीय परंपरा के अनुरूप ‘यहोवा’ रखा गया, जबकि कोई अतिरिक्त संप्रदायगत अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सरल, गरिमापूर्ण और बलिदान-संबंधी पारंपरिक शब्दावली के अनुरूप रखी गई है। आरम्भिक पंचांगीय सूचना तथा भेड़ों की आयु जैसे स्रोत-विवरण स्पष्ट रूप से सुरक्षित हैं।
