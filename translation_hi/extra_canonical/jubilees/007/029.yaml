  text: And in the fifth year make the release[a], so that you may release it in righteousness and uprightness, and you will be righteous, and all your planting will prosper.
translation:
  language: hi
  text: और पाँचवें वर्ष में छूट देने की व्यवस्था करो[a], ताकि तुम उसे न्याय और सत्यनिष्ठा के साथ छोड़ दो। तब तुम धर्मी होगे और तुम्हारी सारी खेती फलती-फूलती रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पाँचवें वर्ष के विषय में यह आज्ञा कठिन है। मूल शब्द का अर्थ ‘छोड़ना’, ‘जाने देना’ या ‘छूट देना’ हो सकता है। संभवतः यह पिछले पदों में बताई गई पहली उपज की व्यवस्था से जुड़ी कोई कृषि-प्रथा है।
    reason: alternative_reading
lexical_decisions:
- source_word: ኅድገተ (ḫədgata)
  choice: छोड़ देने का विधान
  rationale: मूल शब्द का अर्थ छोड़ना, जाने देना या छूट देना है। प्रसंग कृषि-विषयक है, पर ठीक-ठीक प्रथा अस्पष्ट है; इसलिए ‘भूमि को विश्राम’ जैसे अधिक निश्चित अर्थ से बचा गया है।
- source_word: በጽድቅ፡ ወበርኅብ
  choice: धार्मिकता और खराई से
  rationale: दो समानांतर नैतिक गुणों को अलग रखा गया है; ‘खराई’ दूसरे पद की सीधाई/सच्चाई का स्वाभाविक हिन्दी रूप है।
- source_word: ወይጸድቁ
  choice: तब तुम धर्मी ठहरोगे
  rationale: यह लोगों के विषय में स्वतंत्र उपवाक्य है; इसे अगले पौधारोपण-विषयक उपवाक्य में नहीं मिलाया गया।
- source_word: ወይረኅብ፡ ኵሉ፡ ተክልክሙ
  choice: और तुम्हारा सारा रोपण फलेगा-फूलेगा
  rationale: कृषि-संदर्भ में समृद्ध होने या फलने के भाव को सहज हिन्दी में व्यक्त करता है, जबकि ‘तुम्हारा सारा रोपण’ मूल की संरचना बनाए रखता है।
theological_decisions:
- issue: पाँचवें वर्ष की आज्ञा की पहचान
  choice: अस्पष्ट ‘छोड़ देने का विधान’
  alternative: भूमि को विश्राम देना / उपज त्याग देना
  rationale: मूल पाठ किसी प्रकार की छूट या छोड़ने की क्रिया बताता है, लेकिन उसका सटीक कृषि-विधान निश्चित नहीं करता; इसलिए किसी बाद की विशिष्ट धार्मिक व्यवस्था को पाठ में आरोपित नहीं किया गया।
- issue: धार्मिकता का कर्ता
  choice: ‘तुम धर्मी ठहरोगे’ को स्वतंत्र कथन रखा
  alternative: ‘तुम्हारा सारा रोपण धर्मी और समृद्ध होगा’
  rationale: गीज़ पाठ में लोगों के धर्मी होने और रोपण के समृद्ध होने के दो अलग उपवाक्य हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘छोड़ देने का विधान’ जानबूझकर कुछ खुला रखा गया है, क्योंकि मूल कृषि-प्रथा निश्चित नहीं है।
