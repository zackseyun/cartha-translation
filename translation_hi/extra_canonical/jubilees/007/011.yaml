  yaml_path: translation/extra_canonical/jubilees/007/011.yaml
  text: May God enlarge Japheth, and may God dwell in the dwellings of Shem; and let Canaan be his servant.”
translation:
  language: hi
  text: परमेश्वर यापेत को विस्तार दे, और परमेश्वर शेम के निवासों में वास करे; और कनान उसका सेवक हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसका” किसके लिए है—शेम, यापेत या परमेश्वर—यह मूल पाठ में स्पष्ट नहीं है।
    reason: अंतिम एकवचन संबंधवाचक प्रत्यय का पूर्वपद स्रोत-पाठ में निर्दिष्ट नहीं है; हिंदी मुख्य पाठ में यह अस्पष्टता बनाए रखी गई है।
lexical_decisions:
- source_word: እግዚአብሔር (ʾEgziʾabḥēr)
  choice: परमेश्वर
  rationale: यहाँ स्रोत में ईश्वर के लिए सामान्य उपाधि है, यHWH का विशिष्ट नाम नहीं; इसलिए ‘यहोवा’ या ‘प्रभु’ नहीं चुना गया।
- source_word: ያስፋሕ (yāsfaḥ)
  choice: फैलाए
  rationale: क्रिया का मूल अर्थ ‘विस्तृत करना/फैलाना’ है और यह येपेत के नाम से जुड़े शब्द-साम्य को यथासंभव बनाए रखता है।
- source_word: ማኅደሪ (maḥdari)
  choice: निवासों
  rationale: स्रोत में रहने के स्थानों का बहुवचन भाव है; ‘निवासों’ स्वाभाविक और पर्याप्त रूप से औपचारिक है।
- source_word: ገብሮ (gabro)
  choice: सेवक
  rationale: शब्द अधीन होकर सेवा करने वाले व्यक्ति को दर्शाता है। ‘सेवक’ स्रोत की अधीनता को रखता है, जबकि हिंदी में अनावश्यक रूप से आधुनिक दास-व्यवस्था की विशिष्ट ध्वनि नहीं जोड़ता।
theological_decisions:
- issue: शेम के निवासों में वास करने वाला कर्ता
  choice: ‘परमेश्वर’ को स्पष्ट कर्ता बनाए रखा
  alternative: सर्वनाम के द्वारा येपेत को कर्ता मानना
  rationale: गीज़ पाठ दूसरी उपवाक्य में እግዚአብሔር (‘परमेश्वर’) को स्पष्ट रूप से दोहराता है।
- issue: ‘उसका’ का पूर्वपद
  choice: मुख्य पाठ में अस्पष्ट सर्वनाम ‘उसका’ रखा
  alternative: ‘शेम का’, ‘येपेत का’ या ‘परमेश्वर का’ स्पष्ट करना
  rationale: स्रोत का एकवचन प्रत्यय पूर्वपद को स्पष्ट नहीं करता; किसी एक व्याख्या को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण आशीर्वचन-शैली रखी गई है। ‘फैलाए’ नाम-संबंधी शब्द-साम्य और विस्तार के भाव को बनाए रखता है; ‘निवासों में वास करे’ स्रोत की पुनरुक्ति-सदृश गंभीरता को स्वाभाविक हिंदी में व्यक्त करता है।
