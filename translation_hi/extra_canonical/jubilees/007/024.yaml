  text: And the earth was filled with violence. And after this they sinned against the beasts and birds and everything that moves and everything that walks upon the earth, and much blood was shed upon the earth, and all—
translation:
  language: hi
  text: और पृथ्वी हिंसा से भर गई। इसके बाद उन्होंने पशुओं[a], पक्षियों और पृथ्वी पर रेंगने वाले और चलने वाले सभी प्राणियों के विरुद्ध पाप किया। पृथ्वी पर बहुत लहू बहाया गया, और सब—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक अनुवाद: “उन्होंने पशुओं के साथ अपने ही विरुद्ध पाप किया।”'
    reason: अंग्रेज़ी POB लेखा-पथ में दर्ज पूर्ववर्ती वैकल्पिक व्याख्या को सुरक्षित रखता है, जबकि मुख्य पाठ गीइज़ वाक्य-विन्यास और निकटवर्ती रक्तपात-संदर्भ के अनुरूप “पशुओं के विरुद्ध” रखता है।
lexical_decisions:
- source_word: ዐመፃ
  choice: हिंसा
  rationale: यह शब्द हिंसा, अत्याचार और विधि-विरुद्ध आचरण का भाव रखता है; इस प्रसंग में रक्तपात से इसका निकट संबंध है।
- source_word: አበሱ፡ ሎሙ፡ በአራዊት
  choice: उन्होंने पशुओं के विरुद्ध पाप किया
  rationale: ‘ሎሙ’ को आगे आने वाले पशुओं और पक्षियों की ओर संकेत करने वाला पूर्वसूचक सर्वनाम तथा ‘በ-’ को प्रभावित पक्ष दर्शाने वाला माना गया है। इससे पशुओं के विरुद्ध किए गए पाप का अर्थ निकलता है।
- source_word: ዘይትሐወስ፡ ወዘያንሶሱ
  choice: रेंगने और चलनेवाले
  rationale: दोनों क्रियात्मक पदों का भेद बनाए रखते हुए उन्हें सहज आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: ትክዐወ፡ ደም፡ ብዙኅ
  choice: बहुत लहू बहाया गया
  rationale: मूल के निष्क्रिय रक्तपात-वर्णन को सुरक्षित रखा गया है; ‘लहू’ इस गंभीर प्राचीन आख्यान के लिए स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: पशुओं के संबंध में किए गए पाप का स्वरूप
  choice: ‘पशुओं के विरुद्ध पाप किया’
  alternative: ‘पशुओं के साथ अपने विरुद्ध पाप किया’
  rationale: गीज़ व्याकरण और तत्कालीन रक्तपात-संदर्भ पशुओं को पाप से पीड़ित पक्ष मानने का अधिक मजबूत आधार देते हैं। वैकल्पिक पाठ को पादटिप्पणी में रखा गया है ताकि परंपरागत अनिश्चितता छिपे नहीं।
- issue: पद का अपूर्ण अंत
  choice: ‘और सब—’ के साथ वाक्य अधूरा छोड़ा गया
  alternative: अगले पद से अर्थ लेकर वाक्य पूरा करना
  rationale: प्रदत्त मूल-पाठ ‘ወኵሉ’ (‘और सब’) पर रुक जाता है। अनुदत्त सामग्री जोड़कर कथन पूरा करना स्रोत-साक्ष्य से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और आख्यानपरक शैली रखी गई है। ‘पृथ्वी’, ‘हिंसा’ और ‘लहू’ जैसे शब्द मूल की गंभीरता बनाए रखते हैं। स्रोत के अपूर्ण अंत को दीर्घ डैश से स्पष्ट किया गया है।
