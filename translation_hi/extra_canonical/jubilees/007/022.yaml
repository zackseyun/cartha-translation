base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/022.yaml
  text: And they fathered the children of the Naphidim, and all of them were unlike one another, and they devoured one another; and the giants killed the Naphil, and the Naphil killed the Elyo, and the Elyo mankind.
translation:
  language: hi
  text: और उन्होंने नाफ़िदीम की संतान उत्पन्न की। वे सब एक-दूसरे से भिन्न थे और एक-दूसरे को खा गए। दैत्यों ने नाफ़िल को मार डाला, नाफ़िल ने एलयो को, और एलयो ने मनुष्यों को।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाफ़िदीम’, ‘नाफ़िल’ और ‘एलयो’ मूल पाठ में अलग-अलग पद हैं। उनकी ठीक पहचान और आपसी संबंध अनिश्चित हैं; इसलिए यहाँ उनका लिप्यंतरण किया गया है।
    reason: अपरिचित वर्ग-संज्ञाओं के बीच स्रोत में मौजूद भेद को स्पष्ट करना और उन्हें एक ही समूह मान लेने से बचाना।
lexical_decisions:
- source_word: ናፊዲም (nāfidim)
  choice: नाफ़िदीम
  rationale: इसे ध्वन्यात्मक रूप से रखा गया है, क्योंकि यह आगे आने वाले ናፊል से अलग नाम अथवा वर्ग-संज्ञा है; दोनों को ‘नेफिलीम’ कहना स्रोत का भेद मिटा देता।
- source_word: ኢይትማሰሉ
  choice: एक-दूसरे से भिन्न थे
  rationale: शाब्दिक अर्थ ‘एक-दूसरे के समान नहीं थे’ है; आधुनिक हिन्दी में यही अर्थ स्वाभाविक और स्पष्ट रूप से व्यक्त होता है।
- source_word: ወይበልዕ፡ አሐዱ፡ አሐዱ፡ ካልኦ
  choice: एक-दूसरे को खा गए
  rationale: परस्पर भक्षण के स्रोत-अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ይርባሕ
  choice: दैत्यों
  rationale: इस कठिन पद को उपलब्ध पाठ-परंपरा और समीक्षित परामर्श-पाठ के अनुसार ‘giants’ समझा गया है; इसे किसी अगले विशिष्ट नाम के साथ नहीं मिलाया गया।
- source_word: ናፊል (nāfil)
  choice: नाफ़ील
  rationale: नाफ़िदीम से भिन्न स्रोत-रूप को अलग लिप्यंतरण देकर पाठ की विशिष्ट श्रेणीबद्धता और अस्पष्टता बचाई गई है।
- source_word: ኤልዮ (ʾelyo)
  choice: एलयो
  rationale: अर्थ अनिश्चित होने के कारण इसे व्याख्यात्मक अनुवाद देने के बजाय नाम/वर्ग-संज्ञा के रूप में लिप्यंतरित किया गया है।
- source_word: አንሰ፡ አመሕያው
  choice: मनुष्यों को
  rationale: अंतिम लक्ष्य मानवजाति/मनुष्यों को सूचित करता है; हिन्दी में बहुवचन ‘मनुष्यों’ से संक्षिप्त मूल वाक्य-क्रम बना रहता है।
theological_decisions:
- issue: नाफ़िदीम, नाफ़ील और एलयो की पहचान
  choice: तीनों स्रोत-पदों को अलग रखा गया; नाफ़िदीम और नाफ़ील का एक ही बाइबलीय नाम में विलय नहीं किया गया।
  alternative: इन सभी को ‘नेफिलीम’ अथवा सामान्य रूप से ‘दैत्य’ कहना।
  rationale: स्रोत अलग रूपों का प्रयोग करता है और उनका सटीक संबंध अनिश्चित है। अलग लिप्यंतरण वास्तविक पाठगत तनाव को सुरक्षित रखता है तथा किसी बाहरी दैत्य-वर्गीकरण को आरोपित नहीं करता।
- issue: हत्या-श्रृंखला में वर्ग-संज्ञाओं का वचन
  choice: नाफ़ील और एलयो को स्रोत की तरह एकवचन वर्ग-संज्ञा के रूप में रखा गया।
  alternative: उन्हें स्पष्ट बहुवचन ‘नाफ़ीलों’ और ‘एलयो लोगों’ में बदलना।
  rationale: मूल में रूप संक्षिप्त और संभवतः सामूहिक है; हिन्दी का एकवचन उसी अस्पष्टता को अधिक निकटता से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। हत्या की क्रमिक शृंखला में बार-बार आने वाली क्रिया को हिन्दी में लोप करके वाक्य को सहज बनाया गया है, जबकि अर्थ और स्रोत की संक्षिप्तता सुरक्षित हैं।
