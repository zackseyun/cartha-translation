base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/031.yaml
  text: 'And I also command you, my sons, according to the command that Enoch gave to his son in the first jubilees, while he was still alive in the seventh generation: he commanded and testified to his son and to his sons'' sons until the day of his death.'
translation:
  language: hi
  text: और मेरे पुत्रो, मैं भी तुम्हें उस आज्ञा के अनुसार आदेश देता हूँ जो हनोक ने आरम्भिक जुबिलियों में अपने पुत्र को दी थी। वह सातवीं पीढ़ी में जीवित रहते हुए अपने पुत्र और उसके पुत्रों को अपनी मृत्यु के दिन तक आदेश देता और गवाही देता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኤዝዘክሙ (ʾəʾezzəzakəmmu)
  choice: मैं भी तुम्हें ... आदेश देता हूँ
  rationale: क्रिया के आज्ञा देने वाले स्पष्ट अर्थ और प्रथम पुरुष वक्ता को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: በቅድሜ፡ ኢዮቤልውሳት
  choice: आरम्भिक जुबिलियों में
  rationale: मूल में बहुवचन रूप है; अंग्रेज़ी परामर्श-पाठ के ‘first jubilees’ की तरह इसे एक अकेले ‘पहले जुबिली’ में नहीं बदला गया।
- source_word: ውስተ፡ ትዝምዱ፡ ሳባስ
  choice: अपनी पीढ़ी में सातवें पुरुष के रूप में
  rationale: वाक्यांश का आशय हनोक की वंशगत स्थिति से है; केवल ‘सातवीं पीढ़ी में’ कहने की अपेक्षा यह हिन्दी में अधिक स्पष्ट है, फिर भी मूल का पीढ़ी-संबंध बना रहता है।
- source_word: ወአስምዐ
  choice: दृढ़ता से समझाता रहा
  rationale: धातु में साक्षी देने, प्रमाणित करने या गंभीरता से चेताने का भाव है; पारिवारिक उपदेश के प्रसंग में यह चयन स्वाभाविक है और केवल सूचना देने से अधिक गंभीरता व्यक्त करता है।
- source_word: እስከ፡ አመ፡ ዕለተ፡ ሞቱ
  choice: अपनी मृत्यु के दिन तक
  rationale: मूल की समय-सीमा को सीधे और औपचारिक ढंग से व्यक्त करता है।
theological_decisions:
- issue: हनोक के आदेश और साक्ष्य/उपदेश का स्वरूप
  choice: आदेश दिए और दृढ़ता से समझाता रहा
  alternative: आज्ञा दी और गवाही देता रहा
  rationale: ‘गवाही’ सम्भव शाब्दिक विकल्प है, पर हिन्दी में यह बिना बताए न्यायिक या धार्मिक तकनीकी अर्थ ग्रहण कर सकता है। चुना हुआ रूप मूल की गंभीर पुष्टि और चेतावनी का भाव रखता है, बिना किसी सम्प्रदायगत अर्थ को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज पारिवारिक-उपदेशात्मक स्वर रखा गया है। ‘मेरे पुत्रो’ में सम्बोधन और ‘जुबिली’ की ग्रंथ-संबंधी पारिभाषिकता सुरक्षित है। स्रोत की लम्बी संरचना को स्पष्टता के लिए दो वाक्यों में बाँटा गया है।
