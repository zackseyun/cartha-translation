  yaml_path: translation/extra_canonical/jubilees/007/006.yaml
  text: And he rejoiced and drank some of this wine, he and his sons with joy. And it became evening, and he went into his tent, and being drunk he lay down and slept, and he was uncovered inside his tent while he slept.
translation:
  language: hi
  text: और वह आनन्दित हुआ, और उसने और उसके पुत्रों ने आनन्द से इस दाखमधु में से पिया। फिर साँझ हुई, और वह अपने तम्बू में गया। वह नशे में लेट गया और सो गया; और सोते समय वह अपने तम्बू के भीतर उघड़ा हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈሥሐ / በፍሥሓ
  choice: आनन्दित हुआ / आनन्दित हुए
  rationale: मूल में हर्ष और आनन्द का भाव दो बार आता है; हिन्दी में स्वाभाविक रहते हुए इस पुनरावृत्ति को बनाए रखा गया है।
- source_word: ወይነ
  choice: दाखमधु
  rationale: यह अंगूर से बने मदिरा-पेय को सूचित करता है; ‘दाखमधु’ गरिमापूर्ण और सटीक हिन्दी विकल्प है।
- source_word: ሰቀላሁ
  choice: अपने तम्बू
  rationale: यह नूह के निजी तम्बू या निवास-तम्बू को दर्शाता है; संदर्भ के अनुरूप सरल रूप चुना गया है।
- source_word: ስኩሩ
  choice: नशे में
  rationale: मूल शब्द मद्यपान से उत्पन्न मतवालेपन को स्पष्ट करता है; आधुनिक हिन्दी में ‘नशे में’ स्वाभाविक है।
- source_word: ተከሥተ
  choice: उघड़ा हुआ था
  rationale: मूल निष्क्रिय/स्थिति-सूचक अभिव्यक्ति शरीर के अनावृत होने को बताती है; ‘उघड़ा’ घटना को अनावश्यक रूप से किसी कर्ता से नहीं जोड़ता।
theological_decisions:
- issue: नूह के उघड़े होने की कर्तृवाच्यता
  choice: वह ... उघड़ा हुआ था
  alternative: उसने अपने आपको उघाड़ लिया था
  rationale: मूल पाठ अवस्था या निष्क्रिय भाव व्यक्त करता है और यह निश्चित नहीं करता कि उसने जानबूझकर स्वयं को उघाड़ा; इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। मूल की घटनाक्रमात्मक पुनरावृत्ति और आनन्द के दोहरे उल्लेख को बनाए रखते हुए वाक्य-विन्यास को सहज बनाया गया है।
