base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/018.yaml
  text: The sons of Japheth were Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras.
translation:
  language: hi
  text: 'और शेम के पुत्र ये थे: एलाम, अश्शूर, अर्पक्षद—जो जलप्रलय के दो वर्ष बाद उत्पन्न हुआ था—लूद और अराम।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: शेम के पुत्र
  rationale: गीज़ पदबंध का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: አይኅ
  choice: जलप्रलय
  rationale: संदर्भ में नूह के प्रलय को सूचित करता है; केवल ‘बाढ़’ की अपेक्षा ‘जलप्रलय’ अधिक स्पष्ट है।
- source_word: ትውልደ፡ ክልኤ፡ ዓም፡ እምድኅረ፡ አይኅ
  choice: जो जलप्रलय के दो वर्ष बाद उत्पन्न हुआ था
  rationale: अर्पक्षद के विषय में दिए गए काल-सूचक कथन को स्रोत के क्रम और आशय के अनुसार रखा गया है।
