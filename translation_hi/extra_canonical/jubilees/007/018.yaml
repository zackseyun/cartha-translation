translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। स्रोत-पाठ के पद-विभाजन का अनुसरण करते हुए यह पद शेम के पुत्रों को देता है, न कि अगले पद में आने वाले येपेत के पुत्रों को। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
