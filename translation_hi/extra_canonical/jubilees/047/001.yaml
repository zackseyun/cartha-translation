base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/001.yaml
  text: And in the seventh week, in the seventh year, in the forty-seventh jubilee, your father came from the land of Canaan, and you were born in the fourth week, in the sixth year, in the forty-eighth jubilee.
translation:
  language: hi
  text: और सैंतालीसवीं जुबली के सातवें सप्ताह[a] के सातवें वर्ष में तुम्हारे पिता कनान देश से आए, और अड़तालीसवीं जुबली के चौथे सप्ताह के छठे वर्ष में तुम पैदा हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सप्ताह’ सात वर्षों का कालखंड है, सात दिनों का सप्ताह नहीं।
    reason: जुबिलीज़ की विशिष्ट कालगणना में ‘सप्ताह’ का तकनीकी अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: यहाँ यह सामान्य सात-दिन का सप्ताह नहीं, बल्कि सात वर्षों का कालखंड है; ‘सप्ताह’ जुबिलीज़ की कालगणना का पारंपरिक और प्रसंगानुकूल पद है।
- source_word: ኢዮቤልዉ
  choice: जुबली-वर्ष
  rationale: पाठ की विशिष्ट कालगणना को बनाए रखते हुए आधुनिक हिन्दी पाठक के लिए इसे केवल लिप्यंतरण ‘जुबली’ से कुछ अधिक स्पष्ट बनाया गया है।
- source_word: መጽአ
  choice: आए
  rationale: गीज़ क्रिया का सीधा अर्थ ‘आया’ है; ‘लौटे’ जैसी अतिरिक्त धारणा पाठ में स्पष्ट नहीं है।
- source_word: ተወለድከ
  choice: तुम ... पैदा हुए
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन के स्वाभाविक आधुनिक हिन्दी रूप में जन्म का कथन।
theological_decisions:
- issue: जुबिलीज़ की कालगणना में इकाइयों का संबंध
  choice: ‘सातवें सप्ताह के सातवें वर्ष में’ और ‘चौथे सप्ताह के छठे वर्ष में’
  alternative: ‘सातवें वर्ष के सातवें सप्ताह में’ अथवा अल्पविरामों से अलग समानांतर इकाइयाँ
  rationale: स्रोत में वर्ष, सात-वर्षीय ‘सप्ताह’ के भीतर आता है। हिन्दी में संबंधकारक प्रयोग इस पदानुक्रम को स्वाभाविक और असंदिग्ध ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। कालगणना को स्पष्ट करने के लिए वाक्यक्रम में पहले जुबली-वर्ष, फिर उसके भीतर सप्ताह और वर्ष रखा गया है; स्रोत की सभी काल-सूचनाएँ सुरक्षित हैं।
