  yaml_path: translation/extra_canonical/jubilees/047/006.yaml
  text: '...to bring you, and he brought you to her. And she took you out of the basket and had compassion on you. And your sister said to her, “Shall I go and call for you one of the Hebrew women, who will rear him and nurse him?”'
translation:
  language: hi
  text: …कि वह तुम्हें लाए; और वह तुम्हें उसके पास ले आया। उसने तुम्हें टोकरी में से निकाला और तुम पर दया की। तब तुम्हारी बहन ने उससे कहा, “क्या मैं जाकर तुम्हारे लिए इब्रानी स्त्रियों में से किसी एक को बुला लाऊँ, जो इसे पाले और इसे दूध पिलाए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤፍቅ
  choice: टोकरी
  rationale: यह मूसा को रखे गए पात्र/टोकरी को सूचित करता है; आधुनिक हिन्दी में ‘टोकरी’ सहज और प्रसंगानुकूल है।
- source_word: መሐረተከ
  choice: तुम पर दया की
  rationale: क्रिया करुणा या दया दिखाने का भाव व्यक्त करती है और द्वितीय पुरुष कर्म को बनाए रखती है।
- source_word: ዕብራዊያት
  choice: इब्रानी स्त्रियों
  rationale: जातीय पहचान के लिए मानक बाइबलीय हिन्दी रूप।
- source_word: ታሐፅኖ
  choice: इसे पाले
  rationale: पहली क्रिया बच्चे के पालन-पोषण/बड़ा करने को व्यक्त करती है; अगली क्रिया से इसका भेद बनाए रखा गया है।
- source_word: ታጠብዎ
  choice: इसे दूध पिलाए
  rationale: यह बच्चे को स्तनपान कराने की क्रिया है, ‘धोने’ की नहीं; स्वाभाविक हिन्दी में ‘दूध पिलाए’ उपयुक्त है।
theological_decisions:
- issue: दो अंतिम क्रियाओं का संबंध
  choice: ‘पाले और इसे दूध पिलाए’ के रूप में दोनों क्रियाएँ अलग रखी गईं
  alternative: केवल ‘दूध पिलाए’
  rationale: गीज़ पाठ में पालन-पोषण और स्तनपान को सूचित करने वाली दो क्रियाएँ हैं; किसी एक को हटाना स्रोत की अर्थ-सामग्री घटा देता।
- issue: आरंभिक पुरुषवाचक कर्ता
  choice: ‘वह’ को अनिर्दिष्ट रखा गया
  alternative: किसी विशिष्ट पात्र का नाम जोड़ना
  rationale: दिए गए पदांश में कर्ता सर्वनाम से व्यक्त है; पूर्वप्रसंग के बिना नाम जोड़ना मूल की अपेक्षा अधिक स्पष्टता आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। पद आरंभ से अपूर्ण वाक्यांश है, इसलिए स्रोत और परामर्श-पाठ के अनुरूप आरंभ में दीर्घविराम रखा गया है। प्रत्यक्ष कथन में स्त्री-संबोधित ‘तुम्हारे लिए’ प्रयोग हुआ है; शिशु के लिए स्वाभाविक ‘इसे’ रखा गया है।
