  yaml_path: translation/extra_canonical/jubilees/047/005.yaml
  text: And in those days Tarmut[a], the daughter of Pharaoh, went out to bathe in the river, and she heard your voice crying, and she told her maidens to bring you out.
translation:
  language: hi
  text: और उन दिनों फ़िरौन की बेटी तारमुत[a] नदी में स्नान करने निकली। उसने तुम्हारी आवाज़ सुनी, जब तुम रो रहे थे, और अपनी दासियों से कहा कि वे तुम्हें बाहर निकालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जुबिलीज़ में फ़िरौन की बेटी का नाम तारमुत दिया गया है; यूसुफ़ुस के ग्रंथ ‘यहूदी पुरावशेष’ 2.224 में इसके अनुरूप नाम थेरमूथिस मिलता है।
    reason: historical_context
lexical_decisions:
- source_word: ታርሙት
  choice: तारमुत
  rationale: गीज़ नाम का सीधा और स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: ለአዕጋሪቲሃ
  choice: अपनी दासियों से
  rationale: यह स्त्रीलिंग परिचारिकाओं के समूह को दर्शाता है; ‘दासियाँ’ प्रसंग के सामाजिक संबंध को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ያውፅኣከ
  choice: वे तुम्हें बाहर निकालें
  rationale: क्रिया का मूल अर्थ ‘बाहर निकालना’ है; द्वितीय पुरुष कर्म को ‘तुम्हें’ से बनाए रखा गया है।
- source_word: እንዘ፡ ትበኪ
  choice: तुम्हारे रोने की आवाज़
  rationale: गीज़ की आश्रित क्रियात्मक रचना (‘जब/जबकि तुम रो रहे थे’) को स्वाभाविक हिन्दी में मुख्य संज्ञा ‘आवाज़’ के साथ जोड़ा गया है।
