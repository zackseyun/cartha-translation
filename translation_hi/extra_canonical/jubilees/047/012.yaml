  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। एकवचन संबोधन की निकटता तथा आरोप की तीक्ष्णता बनाए रखने के लिए ‘तू/तेरा’ रूप रखा गया है। आरंभिक ‘तेरा भाई’ मूल स्रोत में पिछले वाक्य से जुड़ा खंड है; पद-सीमा का सम्मान करते हुए इसे स्वतंत्र खंड के रूप में सुरक्षित रखा गया है।
