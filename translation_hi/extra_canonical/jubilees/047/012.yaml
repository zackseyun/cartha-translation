  yaml_path: translation/extra_canonical/jubilees/047/012.yaml
  text: Your brother. And he became angry and was indignant and said[12], “Who appointed you a ruler and a judge over us? Do you intend to kill me as you killed the Egyptian yesterday?” And you feared and fled because of this matter.
translation:
  language: hi
  text: तेरा भाई। तब वह क्रोधित हुआ और रोष से भर गया। उसने कहा, “किसने तुझे हम पर शासक और न्यायाधीश नियुक्त किया है? क्या तू मुझे मार डालना चाहता है, जैसे तूने कल उस मिस्री को मार डाला था?” तब तू डर गया और इस बात के कारण भाग गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተምዐዐ፡ ወተቈጥዐ
  choice: क्रोधित हुआ और रोष से भर गया
  rationale: दोनों समानार्थी क्रियाओं की तीव्रता और पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखा गया है; दूसरी क्रिया को ‘झगड़ा किया’ नहीं बनाया गया, क्योंकि उसका अर्थ रोष या प्रचंड क्रोध है।
- source_word: መልአከ፡ ወመኰንነ
  choice: शासक और न्यायी
  rationale: यह युग्म शासन करने वाले और न्याय करने वाले पदों को अलग-अलग बनाए रखता है। ‘न्यायी’ आधुनिक पाठक के लिए बोधगम्य है और न्यायाधिकार का भाव देता है।
- source_word: ትፈቅድ
  choice: चाहता है
  rationale: मूल क्रिया इच्छा या अभिप्राय व्यक्त कर सकती है। प्रश्न में ‘मार डालना चाहता है’ स्वाभाविक हिन्दी है और इरादे के भाव को सुरक्षित रखता है।
- source_word: እምቅድመ፡ ዝንቱ፡ ነገር
  choice: इस बात के कारण
  rationale: वाक्यांश को भय और पलायन के कारण के रूप में समझते हुए सहज हिन्दी में प्रस्तुत किया गया है।
