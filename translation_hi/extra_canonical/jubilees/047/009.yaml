base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/009.yaml
  text: And wages were paid, and she nursed you. And after this, when you had grown up, they brought you to Pharaoh’s daughter, and you became her son. And your father Amram taught you writing, and when you had completed three weeks of years, he brought you into the court.
translation:
  language: hi
  text: और मजदूरी दी गई, और उसने तुम्हें दूध पिलाकर पाला। इसके बाद, जब तुम बड़े हो गए, तो वे तुम्हें फिरौन की बेटी के पास ले गए, और तुम उसके बेटे बन गए। तुम्हारे पिता अम्राम ने तुम्हें लिखना सिखाया; और जब तुम वर्षों के तीन सप्ताह[a] पूरे कर चुके, तब वह तुम्हें दरबार में ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् इक्कीस वर्ष; एक ‘वर्ष-सप्ताह’ सात वर्षों का होता है।
    reason: जुबिलीज़ की कालगणना के तकनीकी पद को सामान्य पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ዐስበ
  choice: मजदूरी दी गई
  rationale: क्रिया का संदर्भ निर्गमन 2:9 के अनुरूप पालन-पोषण के लिए मजदूरी दिए जाने का है; निष्क्रिय हिंदी रूप मूल में कर्ता की अनिर्दिष्टता बनाए रखता है।
- source_word: ሐፀነተከ
  choice: उसने तुम्हें दूध पिलाकर पाला
  rationale: स्त्रीलिंग क्रिया केवल संरक्षण नहीं, धाय के रूप में पालन-पोषण का भाव देती है।
- source_word: ልሂቀከ
  choice: जब तुम बड़े हो गए
  rationale: यह मूसा के बढ़ने या बड़ा होने को व्यक्त करता है।
- source_word: ወሰዱከ
  choice: वे तुम्हें ... ले गए
  rationale: बहुवचन कर्ता को सुरक्षित रखा गया है; यहाँ बहन का उल्लेख मूल पाठ में नहीं है।
- source_word: መሀረከ ... መጽሐፈ
  choice: तुम्हें लिखना सिखाया
  rationale: शाब्दिक अर्थ ‘लेखन/लिखना सिखाया’ है; अनावश्यक रूप से ‘पढ़ना’ नहीं जोड़ा गया।
- source_word: ሠለስተ፡ ሱባዔ
  choice: वर्षों के तीन सप्ताह
  rationale: जुबिलीज़ की कालगणना के तकनीकी ‘सप्ताह’ को बनाए रखा गया है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ዐጸደ
  choice: राजमहल का आँगन
  rationale: शब्द घिरे हुए प्रांगण या दरबार-आँगन को दर्शा सकता है; फिरौन के प्रसंग में यह स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: फिरौन की बेटी के साथ मूसा का संबंध
  choice: तुम उसके बेटे बन गए
  alternative: उसने तुम्हें अपना बेटा बना लिया
  rationale: मूल का परिणामसूचक दत्तक-पुत्र संबंध सीधे रखा गया है, बिना कानूनी प्रक्रिया का अतिरिक्त विवरण जोड़े।
- issue: आरंभिक क्रियाओं का कर्ता
  choice: मजदूरी के लिए निष्क्रिय रूप और पालन के लिए स्त्रीलिंग ‘उसने’
  alternative: उसने मजदूरी दी और तुम्हें पाला
  rationale: मूल में मजदूरी देने वाला स्पष्ट नहीं है, जबकि पालन-पोषण की क्रिया स्त्रीलिंग है; अनुवाद इस अंतर को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फिरौन’, ‘अम्राम’ और ‘राजमहल का आँगन’ सामान्य पाठक के लिए परिचित रूप हैं। कालगणना की विशिष्ट अभिव्यक्ति को सरल बनाने के बजाय मूल रूप में रखकर पादटिप्पणी में समझाया गया है।
