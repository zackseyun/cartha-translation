- source_word: ታርሙት
  choice: तारमूत
  rationale: व्यक्तिनाम का गीइज़ रूप ध्वन्यात्मक रूप से सुरक्षित रखा गया है।
- source_word: ወስተ፡ ፈርዖን
  choice: फ़िरौन की बेटी
  rationale: संदर्भ और समानांतर परंपरा के अनुसार यह पदबंध तारमूत की पहचान फ़िरौन की बेटी के रूप में कराता है; स्रोत-पाठ की वर्तनी/पाठगत कठिनाई के बीच अंग्रेज़ी परामर्श-पाठ भी इसी अर्थ की पुष्टि करता है।
- source_word: ትትሐፀብ
  choice: स्नान करने
  rationale: क्रिया का स्वाभाविक आधुनिक हिन्दी अर्थ।
- source_word: ዕብራዊያቲሃ
  choice: अपनी इब्रानी दासियों से
  rationale: स्त्रीलिंग बहुवचन संबोधन को सुरक्षित रखा गया है; स्वत्वसूचक प्रत्यय को ‘अपनी’ से व्यक्त किया गया है।
