base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/010.yaml
  text: And you were in the court of the king for three weeks of years until the day when you went out from the court of the king and saw an Egyptian striking your fellow countryman, one of your brothers.
translation:
  language: hi
  text: और तुम राजा के दरबार में वर्षों के तीन सप्ताह तक रहे, उस दिन तक जब तुम राजा के दरबार से बाहर निकले और तुमने एक मिस्री को तुम्हारे एक भाई को, जो तुम्हारे अपने लोगों में से था, मारते देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐጸድ፡ መንግሥት
  choice: राजा का राजमहल
  rationale: शाब्दिक अर्थ ‘राजा का प्रांगण/दरबार’ हो सकता है; प्रसंग में राजकीय निवास और दरबार के व्यापक आशय को स्वाभाविक हिन्दी में ‘राजमहल’ व्यक्त करता है।
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመተ
  choice: तीन वर्ष-सप्ताह
  rationale: मूल में वर्षों की तीन सातक इकाइयाँ हैं, अर्थात इक्कीस वर्ष। ‘वर्ष-सप्ताह’ जुबिलीज़ की कालगणना को स्पष्ट संख्या में समतल किए बिना सुरक्षित रखता है।
- source_word: ይዘብጦ
  choice: मारते
  rationale: क्रिया प्रहार करने या पीटने का बोध देती है; यहाँ सतत दृश्य के लिए ‘मारते देखा’ स्वाभाविक है और यह हत्या का अर्थ नहीं जोड़ता।
- source_word: ለካልእከ፡ ዘእምነ
  choice: अपने ही लोगों में से एक—अपने भाइयों में से एक—को
  rationale: उपलब्ध गीइज़ पाठ के अंतिम पदबंध और अंग्रेज़ी परामर्श-पाठ में ‘सहदेशवासी/भाइयों में से एक’ का भाव है। हिन्दी में दोनों संबंधों को बनाए रखा गया है, यद्यपि अभिव्यक्ति को स्वाभाविक बनाया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और कथात्मक है। ‘तीन वर्ष-सप्ताह’ को ‘इक्कीस वर्ष’ में नहीं बदला गया, ताकि ग्रंथ की विशिष्ट कालगणना बनी रहे। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
