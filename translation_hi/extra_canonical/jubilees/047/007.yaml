  text: And she said to her, “Go.” And she went and called your mother Jochebed, and she gave her wages, and she nursed you.
translation:
  language: hi
  text: फ़िरौन की बेटी ने उससे कहा, “जाओ।” तब वह गई और तुम्हारी माँ योकेबेद को बुला लाई। फ़िरौन की बेटी ने उसे मजदूरी दी, और योकेबेद ने तुम्हें दूध पिलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑሪ
  choice: जा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप को सहज और प्रत्यक्ष हिन्दी में रखा गया है।
- source_word: ለእምከ፡ ለአዮካቤድ
  choice: तुम्हारी माँ योकेबेद
  rationale: मूसा को किए गए द्वितीय पुरुष संबोधन और माँ के नाम—दोनों को स्पष्ट रखते हुए स्वाभाविक हिन्दी पदक्रम अपनाया गया है।
- source_word: ዐስበ
  choice: मजदूरी
  rationale: यहाँ शिशु को दूध पिलाने के बदले दिए गए पारिश्रमिक का अर्थ है; ‘मजदूरी’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ወሐፀነተከ
  choice: और उसने तुम्हें दूध पिलाया
  rationale: संदर्भ में धातु का आशय बच्चे को धात्री के रूप में दूध पिलाना/पालना है; निकटवर्ती कथानक के अनुरूप विशिष्ट अर्थ चुना गया है।
