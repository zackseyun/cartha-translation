base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/011.yaml
  text: And you killed him and hid him in the sand. And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking?”
translation:
  language: hi
  text: और तूने उसे मार डाला और रेत में छिपा दिया। फिर दूसरे दिन तूने इस्राएलियों में से दो को आपस में लड़ते पाया, और जो अन्याय कर रहा था उससे कहा, “तू क्यों मार रहा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቀተልኮ፡ ወኀባእኮ፡ ውስተ፡ ኆፃ
  choice: और तूने उसे मार डाला और रेत में छिपा दिया
  rationale: क्रियाओं के द्वितीय पुरुष एकवचन रूप और ‘रेत में’ स्थान-सूचक पद को सीधे रखा गया है; हिन्दी में पहले ‘उसे’ का अर्थ दूसरी क्रिया में स्वाभाविक रूप से समझ में आता है।
- source_word: ወበሳኒታ፡ ዕለት
  choice: फिर दूसरे दिन
  rationale: ‘दूसरे दिन’ स्रोत का सीधा अर्थ है; ‘फिर’ कथानक का स्वाभाविक संबंध व्यक्त करता है।
- source_word: ፪እንዘ፡ ይትበአሱ፡ እምውሉደ፡ እስራኤል
  choice: इस्राएलियों में से दो को आपस में लड़ते
  rationale: ‘इस्राएल की संतान में से दो’ का आधुनिक और सहज हिन्दी रूप ‘इस्राएलियों में से दो’ है; पारस्परिक क्रिया को ‘आपस में लड़ते’ से व्यक्त किया गया है।
- source_word: ዘይትአገሎ
  choice: जो अन्याय कर रहा था
  rationale: यह उस व्यक्ति को चिह्नित करता है जो दोषपूर्ण या अन्यायी ढंग से व्यवहार कर रहा था; ‘अन्याय कर रहा था’ नैतिक आशय को बिना अतिरिक्त पहचान जोड़े सुरक्षित रखता है।
- source_word: ለምንት፡ ትዘብጥ
  choice: तू क्यों मार रहा है?
  rationale: स्रोत में प्रहार का कोई स्पष्ट कर्म नहीं है, इसलिए ‘अपने साथी को’ नहीं जोड़ा गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। संबोधन के लिए ‘तू’ रखा गया है, क्योंकि स्रोत में द्वितीय पुरुष एकवचन है और निकटवर्ती बाइबिलीय प्रत्यक्ष संबोधन में यह स्वाभाविक है। आरम्भ का ‘ውሉደ፡ እስራኤል’ पिछले पद का खंड प्रतीत होता है; उसे इस पद में दोहराया नहीं गया, जबकि बाद वाला पूर्ण वाक्यांश अनूदित है।
