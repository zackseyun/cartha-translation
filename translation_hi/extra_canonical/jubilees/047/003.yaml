  text: And they continued casting them in for seven months[3], until the day when you were born. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.
translation:
  language: hi
  text: वे सात महीने तक उन्हें फेंकते रहे—उस दिन तक, जब तुम जन्मे। तुम्हारी माँ ने तुम्हें तीन महीने तक छिपाए रखा, और तुम्हारे कारण उन्हें उसके बारे में पता चल गया। तब उसने तुम्हारे लिए एक टोकरी बनाई, उस पर राल और डामर पोता, और उसे नदी के किनारे सरकंडों के बीच रख दिया। उसने तुम्हें सात दिनों तक उसी में रखा। तुम्हारी माँ रात को आकर तुम्हें दूध पिलाती थी, और दिन में तुम्हारी बहन मरियम तुम्हारी रखवाली करती थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम खंड में मरियम के दिन में बच्चे की रखवाली करने की बात है। कुछ प्राचीन व्याख्याएँ इसे पक्षियों या नदी-तट के अन्य खतरों से रक्षा के रूप में समझती हैं, पर उपलब्ध गीइज़ पाठ में पक्षियों का स्पष्ट उल्लेख नहीं है।
    reason: segmentation_note
lexical_decisions:
- source_word: ይገድፉ
  choice: उन्हें फेंकते रहे
  rationale: क्रिया के निरंतर चलने वाले भाव को रखा गया है; कर्म का स्पष्ट नाम मूल पद में नहीं है, इसलिए ‘उन्हें’ रखा गया।
- source_word: ሤፍተ
  choice: टोकरी
  rationale: यह शिशु को रखने योग्य बुनी हुई टोकरी या पात्र का सामान्य अर्थ देता है और आधुनिक हिन्दी में सहज है।
- source_word: ፒሳ፡ ወአስፋልጠ
  choice: राल और डामर
  rationale: दो अलग जलरोधी पदार्थों का भेद बनाए रखते हुए सामान्य हिन्दी शब्द चुने गए हैं।
- source_word: ሣዕር፡ ኀበ፡ ድንጋገ፡ ፈለግ
  choice: नदी के किनारे सरकंडों के बीच
  rationale: नदी-तट की वनस्पति और स्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ታጠብወከ
  choice: तुम्हें दूध पिलाती थी
  rationale: मातृ-स्तनपान के क्रियार्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ትዐቅበከ
  choice: तुम्हारी रक्षा करती थी
  rationale: रखवाली और सुरक्षा—दोनों निहित भावों को वर्तमान हिन्दी में सहज रूप देता है।
theological_decisions:
- issue: मूसा की माता का पता चलने वाला वाक्य
  choice: तुम्हारे कारण उन्हें उसके बारे में पता चल गया
  alternative: उन्होंने तुम्हारे कारण उस पर निगाह रखी
  rationale: मूल की अस्पष्टता को किसी निश्चित गिरफ्तारी, शिकायत या खोज की घटना में नहीं बदला गया।
- issue: मरियम की पहचान
  choice: तुम्हारी बहन मरियम
  alternative: मरियम
  rationale: निकटवर्ती कथा-संदर्भ में पहचान स्पष्ट है; यह पाठक के लिए संबंध बताता है, पर कोई संप्रदायगत अर्थ नहीं जोड़ता।
- issue: दिन में मरियम द्वारा रक्षा
  choice: पक्षियों से तुम्हारी रक्षा करती थी
  alternative: तुम्हारी रखवाली करती थी
  rationale: परामर्श-पाठ में सुरक्षित प्राचीन पाठ-विभाजन को मुख्य पाठ में रखा गया, जबकि इसकी पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। मूसा को संबोधित दूसरे पुरुष के रूप को बनाए रखा गया है। अनावश्यक धार्मिक पारिभाषिक शब्दावली से बचते हुए मूल के समय-सूचक विवरण और कथा की तनावपूर्ण अस्पष्टता सुरक्षित रखी गई है।
