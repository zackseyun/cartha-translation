  yaml_path: translation/extra_canonical/jubilees/047/002.yaml
  text: That was a time of affliction upon the children of Israel, and Pharaoh, king of Egypt, commanded concerning them that they should throw all their children, every male that was born, into the river.
translation:
  language: hi
  text: वह इस्राएल की संतानों पर क्लेश का समय था। मिस्र के राजा फ़िरौन ने उनके विषय में आज्ञा दी कि वे उनकी सारी संतान में से हर जन्मे हुए नर को नदी में फेंक दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ምንዳቤ
  choice: दुःख के दिनों का समय
  rationale: स्रोत में ‘दिन/काल’ और ‘कष्ट-दुःख’ दोनों भाव हैं; यह अभिव्यक्ति उन्हें स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: ውሉደ፡ እስራኤል
  choice: इस्राएल की संतानें
  rationale: वंशजों/लोगों के सामूहिक अर्थ को आधुनिक, गरिमापूर्ण और बाइबिलीय हिन्दी में व्यक्त करता है।
- source_word: ንጉሠ፡ ግብጽ፡ ፈርዖን
  choice: मिस्र के राजा फ़िरौन
  rationale: स्रोत का पदक्रम और दोनों उपाधियाँ स्पष्ट रूप से सुरक्षित रखी गई हैं।
- source_word: ውሉዶሙ፡ ኵሎ
  choice: अपने सभी बच्चों में से
  rationale: स्रोत का व्यापक ‘उनके सभी बच्चे’ पहले रखा गया है, जिसके बाद अगला पदबंध लक्षित वर्ग को नर शिशुओं तक सीमित करता है।
- source_word: ኵሎ፡ ርሰ፡ ዘተወልደ
  choice: जन्म लेने वाले हर नर शिशु
  rationale: ‘हर नर जो जन्मा’ का अर्थ स्पष्ट करता है, बिना इसे सामान्यतः सभी बच्चों पर लागू किए।
- source_word: ፈለግ
  choice: नदी
  rationale: यहाँ निर्गमन-परंपरा के संदर्भ में नदी, अर्थात नील, अभिप्रेत है; स्रोत स्वयं नाम नहीं देता, इसलिए नाम नहीं जोड़ा गया।
theological_decisions:
- issue: फ़िरौन की आज्ञा का लक्ष्य
  choice: व्यापक ‘सभी बच्चों’ की भाषा को रखते हुए ‘हर नर शिशु’ से उसका दायरा स्पष्ट किया
  alternative: ‘अपने सभी पुत्रों को’
  rationale: स्रोत पहले बच्चों/संतानों के लिए व्यापक संज्ञा और फिर हर जन्मे नर के लिए विशिष्ट पदबंध देता है; अनुवाद दोनों स्तरों को बनाए रखता है।
- issue: नदी की पहचान
  choice: ‘नदी’
  alternative: ‘नील नदी’
  rationale: संदर्भ नील की ओर संकेत करता है, पर स्रोत में नदी का नाम स्पष्ट रूप से नहीं है; इसलिए निहित पहचान को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबिलीय शैली। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है और स्रोत की व्यापक ‘बच्चों’ तथा विशिष्ट ‘नर शिशु’ वाली संरचना सुरक्षित रखी गई है।
