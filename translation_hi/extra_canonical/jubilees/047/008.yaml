translation:
  language: hi
  text: और उसने उससे कहा, “जा।” और वह गई और उसने तुम्हारी माँ योकेबेद को बुलाया और तुम्हें उसे दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑሪ
  choice: जा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለእምከ
  choice: तुम्हारी माँ
  rationale: मूल पाठ में द्वितीय पुरुष एकवचन संबंधसूचक रूप है; संबोधित व्यक्ति के साथ सीधा संबंध बनाए रखा गया है।
- source_word: ለአዮካቤድ
  choice: योकेबेद
  rationale: व्यक्तिनाम Jochebed का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ወወሀበታ
  choice: और तुम्हें उसे सौंप दिया
  rationale: क्रिया का मूल अर्थ ‘देना’ है; शिशु को उसकी माँ की देखभाल में देने के प्रसंग में ‘सौंप दिया’ स्वाभाविक है और संबंधसूचक सर्वनामों को स्पष्ट रखता है।
