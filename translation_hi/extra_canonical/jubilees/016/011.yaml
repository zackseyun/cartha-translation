  text: and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.
translation:
  language: hi
  text: और वह कादेश और शूर के बीच, गरार के पहाड़ी प्रदेश में रहने लगा। फिर पाँचवें महीने के मध्य में वह वहाँ से चला गया और शपथ के कुएँ के पास रहने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደረ
  choice: रहने लगा
  rationale: गीज़ क्रिया के ‘ठहरना/निवास करना’ अर्थ को प्रसंग के अनुसार स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ማእከለ
  choice: के बीच
  rationale: कादेश और शूर के मध्य स्थित निवास-स्थान का स्थानिक संबंध स्पष्ट रखता है।
- source_word: አደባረ ጌራሮን
  choice: गरार के पहाड़ी प्रदेश में
  rationale: बहुवचनात्मक स्थल-संज्ञा के अर्थ को केवल एक पहाड़ तक सीमित किए बिना सहज हिन्दी में प्रस्तुत करता है।
- source_word: በመንፈቀ ወርኅ ኃምስ
  choice: पाँचवें महीने के मध्य में
  rationale: समय-सूचक वाक्यांश का निकट और स्पष्ट अनुवाद है।
- source_word: Well of the Oath
  choice: शपथ के कुएँ के पास
  rationale: स्थलनाम के अर्थ को अनूदित रूप में सुरक्षित रखता है और ‘बेर्शेबा’ जैसी व्याख्यात्मक पहचान को मुख्य पाठ में नहीं जोड़ता।
