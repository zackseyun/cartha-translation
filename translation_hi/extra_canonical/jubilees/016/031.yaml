base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/031.yaml
  text: And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches seven times; and in the morning he praised and gave thanks to his God for everything with joy.
translation:
  language: hi
  text: और अब्राहम ने खजूर की डालियाँ और सुन्दर वृक्षों के फल लिए। वह प्रतिदिन उन डालियों के साथ वेदी की सात बार परिक्रमा करता था; और प्रातः वह आनन्द के साथ अपने परमेश्वर की स्तुति करता और सब बातों के लिए उसका धन्यवाद करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ፀበርት
  choice: खजूर की डालियाँ
  rationale: यह पदबंध खजूर की शाखाओं/डालियों को सूचित करता है; आधुनिक हिन्दी में ‘खजूर की डालियाँ’ सहज और स्पष्ट है।
- source_word: ፍሬ፡ ዕፀ፡ ሠናይ
  choice: सुन्दर वृक्षों के फल
  rationale: स्रोत की संज्ञात्मक रचना को निकटता से रखते हुए ‘सुन्दर/भले वृक्षों के फल’ का अर्थ व्यक्त किया गया है; ‘सुन्दर’ अंग्रेज़ी परामर्श-पाठ से भी संगत है।
- source_word: የዐውድ፡ ምሥዋዐ
  choice: वेदी की ... परिक्रमा करता था
  rationale: क्रिया का मूल भाव वेदी के चारों ओर घूमना है; धार्मिक-सांस्कृतिक हिन्दी में ‘परिक्रमा करना’ स्वाभाविक है, बिना किसी अतिरिक्त सिद्धान्तगत अर्थ के।
- source_word: በአዕፁቅ፡ ስብዕ
  choice: उन डालियों के साथ ... सात बार
  rationale: स्रोत में साधन/साथ का भाव और सात की संख्या है। कोष्ठकित ‘प्रतिदिन’ को सात बार के बाद दोहराया नहीं गया, क्योंकि वाक्य में दैनिकता पहले ही स्पष्ट है और पाठगत स्थिति अनिश्चित है।
- source_word: ይሴብሕ፡ ወይጌኒ
  choice: स्तुति करता और ... धन्यवाद करता था
  rationale: दो समन्वित क्रियाओं—प्रशंसा और कृतज्ञता व्यक्त करने—को अलग-अलग सुरक्षित रखा गया है।
- source_word: ኵሉ፡ ዘበፍሥሓ
  choice: सब बातों के लिए ... आनन्द के साथ
  rationale: ‘सब/सब कुछ’ और आनन्दपूर्वक किए जाने, दोनों अर्थों को स्वाभाविक हिन्दी क्रम में रखा गया है।
theological_decisions:
- issue: ‘अपने परमेश्वर’ का संबंध
  choice: अपने परमेश्वर की स्तुति ... उसका धन्यवाद
  alternative: परमेश्वर की स्तुति ... परमेश्वर को धन्यवाद
  rationale: स्रोत में अधिकारसूचक रूप ‘उसका/अपने परमेश्वर’ विद्यमान है; इसे बनाए रखने से अब्राहम और परमेश्वर के व्यक्तिगत संबंध का पाठगत भाव सुरक्षित रहता है, बिना उसे सिद्धान्तगत रूप से विस्तार दिए।
- issue: ‘सब’ का आशय
  choice: सब बातों के लिए
  alternative: सब कुछ के लिए
  rationale: स्रोत का ‘सब’ व्यापक है। हिन्दी में ‘सब बातों के लिए’ कृतज्ञता के प्रसंग में स्वाभाविक है और दायरे को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। दो लंबे समन्वित खंडों को पठनीयता के लिए दो वाक्यों में बाँटा गया है। स्रोत के पुनरावृत्त दैनिक भाव को अनावश्यक रूप से दोहराया नहीं गया।
