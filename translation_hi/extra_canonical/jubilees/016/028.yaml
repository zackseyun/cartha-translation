base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/028.yaml
  text: And both of them had very great joy. And he built there an altar to the Lord, who had blessed him and who had made him rejoice in the land of his sojourning. And he made a feast of joy in this month for seven days.
translation:
  language: hi
  text: और उन दोनों को बहुत ही बड़ा आनंद हुआ। तब उसने वहाँ प्रभु के लिए एक वेदी बनाई, जिसने उसे आशीष दी थी और उसके परदेश-निवास की भूमि में उसे आनंदित किया था। और उसने इस महीने सात दिनों तक आनंद का पर्व मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆሙ
  choice: उन दोनों को
  rationale: द्विवचन-सदृश अर्थ ‘दोनों’ को स्पष्ट रूप से बनाए रखता है।
- source_word: ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: बहुत ही बड़ा आनंद
  rationale: ‘आनंद’ के साथ तीव्रता और महानता—दोनों बलों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ምሥዋዐ
  choice: वेदी
  rationale: बलिदान चढ़ाने के धार्मिक स्थान के लिए प्रचलित और उपयुक्त बाइबलीय हिन्दी शब्द।
- source_word: በምድረ፡ ፍልሰቱ
  choice: उसके परदेश-निवास की भूमि में
  rationale: अस्थायी प्रवास/परदेश में रहने का भाव सुरक्षित रखता है, बिना इसे स्थायी स्वदेश मान लेने के।
- source_word: በዓለ፡ ፍሥሓ
  choice: आनंद का पर्व
  rationale: ‘पर्व/उत्सव’ और ‘आनंद’ दोनों अर्थघटकों को बनाए रखता है।
- source_word: ሰቡዐ፡ መዋዕለ
  choice: सात दिनों तक
  rationale: अवधि को स्वाभाविक हिन्दी में ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: आशीष देने और आनंदित करने वाले का कर्ता
  choice: प्रभु को दोनों क्रियाओं का कर्ता रखा गया
  alternative: दूसरे संबंधवाचक खंड का कर्ता अस्पष्ट छोड़ना
  rationale: स्रोत-पाठ में दोनों संबंधवाचक रूप उसी पूर्वगामी ‘प्रभु’ की ओर स्वाभाविक रूप से संकेत करते हैं।
- issue: प्रवास की भूमि का स्वरूप
  choice: परदेश-निवास
  alternative: तीर्थयात्रा की भूमि / निवास की भूमि
  rationale: यह चयन अस्थायी अथवा विदेशी निवास का भाव देता है और अनावश्यक धार्मिक ‘तीर्थयात्रा’ का अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘प्रभु’, ‘वेदी’, ‘आशीष’ और ‘पर्व’ जैसे परिचित बाइबलीय पदों का उपयोग किया गया है; स्रोत में उपस्थित पुनरुक्ति और धार्मिक तनाव को नहीं हटाया गया।
