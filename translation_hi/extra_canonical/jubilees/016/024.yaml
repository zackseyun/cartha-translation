  yaml_path: translation/extra_canonical/jubilees/016/024.yaml
  text: 'And morning and evening he burned fragrant incense: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus, seven of these; he offered all of them mixed together, pure.'
translation:
  language: hi
  text: और वह सुबह और शाम सुगंधित धूप जलाता था—लोबान, गल्बानुम, स्तक्ते, जटामांसी, गंधबोल, कैसिया और कुठ; इन सातों को वह एक साथ मिलाकर शुद्ध रूप में चढ़ाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የዐጥን፡ እፈወ
  choice: सुगंधित धूप जलाता था
  rationale: क्रिया ዐጠነ धूप अथवा सुगंधित पदार्थ जलाने को और እፈወ सुगंध को व्यक्त करता है; संयुक्त हिंदी पदबंध अर्थ और धार्मिक संदर्भ दोनों को स्वाभाविक रूप से रखता है।
- source_word: ስኂነ
  choice: लोबान
  rationale: सूची के संदर्भ में यह frankincense के लिए प्रयुक्त सुगंधित राल का नाम है; ‘लोबान’ आधुनिक हिंदी में प्रचलित रूप है।
- source_word: ቅንአተ
  choice: गंधरस
  rationale: यह galbanum नामक सुगंधित गोंद-राल को सूचित करता है; ‘गंधरस’ अपेक्षाकृत बोधगम्य हिंदी नाम है।
- source_word: ማየ፡ ልብን
  choice: सुगंधित राल
  rationale: शाब्दिक संरचना ‘लबन का द्रव’ है और परंपरागत समतुल्य stacte है; वनस्पति की ठीक पहचान अनिश्चित होने से सामान्य किंतु अर्थपूर्ण पद चुना गया।
- source_word: ናርድስ
  choice: जटामांसी
  rationale: यह यूनानी-मूलक nardos, अर्थात nard/spikenard, का रूप है; हिंदी का परिचित वनस्पति-नाम चुना गया।
- source_word: ከርቤ
  choice: गंधबोल
  rationale: यह myrrh है; ‘गंधबोल’ उसका मानक हिंदी नाम है और ‘गंधरस’ से भेद बनाए रखता है।
- source_word: ሰንበልተ
  choice: दालचीनी
  rationale: सुगंध-द्रव्यों की इस सूची और उपलब्ध पाठ-साक्ष्य में इसे cassia समझना सर्वोत्तम है; साधारण पाठक के लिए निकट और प्रचलित हिंदी नाम ‘दालचीनी’ लिया गया।
- source_word: ኵስተ
  choice: कुठ
  rationale: यह costus नामक सुगंधित जड़ है; ‘कुठ’ उसका प्रचलित हिंदी वनस्पति-नाम है।
- source_word: ያቀርብ
  choice: चढ़ाता था
  rationale: क्रिया का मूल अर्थ सामने लाना/अर्पित करना है; अनुष्ठानिक संदर्भ में ‘चढ़ाता था’ स्वाभाविक और सटीक है।
theological_decisions:
- issue: धूप जलाने और अर्पित करने का संबंध
  choice: पहले ‘धूप जलाता था’ और अंत में ‘चढ़ाता था’
  alternative: पूरे वाक्य को केवल ‘जलाकर चढ़ाता था’ कहना
  rationale: स्रोत में धूप जलाने और सामग्री अर्पित करने की अभिव्यक्तियाँ दोनों उपस्थित हैं; दोनों को बनाए रखने से अनुष्ठान का विवरण बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी अपनाई गई है। दुर्लभ सुगंध-द्रव्यों के लिए जहाँ संभव था वहाँ प्रचलित हिंदी वनस्पति-नाम दिए गए हैं। सूची का स्रोत-क्रम—दालचीनी के बाद कुठ—ज्यों का त्यों रखा गया है।
