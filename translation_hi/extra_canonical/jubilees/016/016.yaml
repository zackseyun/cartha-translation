  yaml_path: translation/extra_canonical/jubilees/016/016.yaml
  text: And we returned in the seventh month and found Sarah pregnant before us, and we blessed the Lord, and we announced to him all the things which he had spoken concerning him, that he would surely do them.
translation:
  language: hi
  text: और सातवें महीने में हम लौटे और हमने सारा को अपने सामने गर्भवती पाया। हमने अब्राहम को आशीष दी और उसे वह सब बताया जो उसके विषय में ठहराया गया था—कि वह तब तक नहीं मरेगा, जब तक वह छह पुत्र उत्पन्न न करे और मरने से पहले उन्हें न देख ले; और उसका नाम और वंश इसहाक के द्वारा कहलाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और इसहाक में उसके लिए नाम और वंश कहलाएगा।”'
    reason: गीज़ पूर्वसर्ग का अर्थ ‘इसहाक में’ या स्वाभाविक हिन्दी में ‘इसहाक के द्वारा’ हो सकता है; पादटिप्पणी मूल अभिव्यक्ति को सुरक्षित रखती है।
lexical_decisions:
- source_word: ወተመየጥነ
  choice: हम लौटे
  rationale: क्रिया प्रथम पुरुष बहुवचन में है और स्वर्गदूत-वक्ताओं की वापसी को व्यक्त करती है।
- source_word: ወረከብናሃ፡ ለሳራ፡ ፀንሰተ፡ ቅድሜነ
  choice: हमने सारा को अपने सामने गर्भवती पाया
  rationale: मूल के ‘पाया’, ‘गर्भवती’ और ‘हमारे सामने’—तीनों तत्वों को बिना अनावश्यक व्याख्या के रखा गया है।
- source_word: ወባረክናሁ
  choice: हमने उसे आशीष दी
  rationale: मूल में कर्म पुरुषवाचक एकवचन है, जिसका निकट प्रसंग में संकेत अब्राहम की ओर है; इसलिए इसे ‘प्रभु को धन्य कहा’ नहीं बनाया गया।
- source_word: ዘተአዘዘ፡ ሎቱ
  choice: जो उसके विषय में ठहराया गया था
  rationale: निष्क्रिय रूप आदेश, विधान या पूर्वनिर्धारण का भाव दे सकता है; ‘ठहराया गया’ इस व्यापकता को बनाए रखता है।
- source_word: ስድስተ፡ ውሉደ
  choice: छह और पुत्र
  rationale: प्रसंग और प्राचीन पाठ-परंपरा अब्राहम से आगे उत्पन्न होने वाले छह पुत्रों की ओर संकेत करती है; ‘और’ पूर्ववर्ती इसहाक से अतिरिक्त संख्या स्पष्ट करता है।
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: उसका नाम और वंश इसहाक के द्वारा ही कहलाएगा
  rationale: ‘इसहाक में/के द्वारा’, ‘नाम’, ‘वंश’ और ‘कहलाना’ की मूल छवि सुरक्षित रखी गई है; ‘ही’ चुने हुए वंश की विशिष्ट दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आशीष पाने वाले का परिचय
  choice: ‘हमने उसे आशीष दी’—अर्थात प्रसंगतः अब्राहम
  alternative: ‘हमने प्रभु को धन्य कहा’
  rationale: गीज़ पाठ में पुरुषवाचक कर्म-प्रत्यय है और कथन अब्राहम को सूचना देने की ओर बढ़ता है। ‘प्रभु’ जोड़ना मूल में उपस्थित नहीं है और पिछले अंग्रेज़ी रूप की त्रुटि दोहराएगा।
- issue: अब्राहम के जीवन और भावी पुत्रों संबंधी घोषणा
  choice: छह और पुत्र होने और मृत्यु से पहले उन्हें देखने वाला पूरा कथन शामिल किया गया
  alternative: केवल ‘जो कहा था उसे अवश्य पूरा करेगा’ जैसा संक्षिप्त सामान्य कथन
  rationale: प्रदत्त गीज़ स्रोत में छह पुत्रों और उन्हें देखने का विशिष्ट कथन स्पष्ट है; इसे हटाने से पद का पर्याप्त अंश लुप्त हो जाता है।
- issue: इसहाक के द्वारा नाम और वंश कहलाना
  choice: विशिष्ट वंशगत प्रतिज्ञा को यथावत रखा
  alternative: सामान्यतः परमेश्वर के वचन की पूर्ति कहना
  rationale: मूल इसहाक का स्पष्ट उल्लेख करता है और प्रतिज्ञा की विशिष्टता को सामान्य कथन में विलीन नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। लंबे गीज़ वाक्य को पठनीय बनाने के लिए पूर्णविराम और डैश का प्रयोग किया गया, पर उसके सभी प्रमुख कथन सुरक्षित हैं। सर्वनामों को अनावश्यक रूप से ‘परमेश्वर’ या ‘अब्राहम’ बनाकर मूल की व्याकरणिक संरचना नहीं बदली गई।
