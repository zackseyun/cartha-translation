  yaml_path: translation/extra_canonical/jubilees/016/004.yaml
  text: and his name, Isaac, was written on the heavenly tablets. And when we returned to her at the appointed time, she conceived and bore a son.
translation:
  language: hi
  text: और उसका नाम, इसहाक, स्वर्गीय पट्टिकाओं पर लिखा गया। और जब हम नियत समय पर उसके पास लौटे, तब उसने गर्भधारण किया और एक पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽሑፍ፡ ስሙ
  choice: उसका नाम ... लिखा गया
  rationale: ጽሑፍ निष्पन्न कर्मवाच्य अर्थ ‘लिखा गया’ देता है और ስሙ का स्पष्ट अर्थ ‘उसका नाम’ है।
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं पर
  rationale: शाब्दिक संरचना ‘आकाश/स्वर्ग की पट्टिकाएँ’ है; ‘स्वर्गीय पट्टिकाएँ’ हिन्दी में स्वाभाविक रहते हुए इस पारलौकिक अभिलेख की धारणा बनाए रखता है।
- source_word: ገባእነ
  choice: हम ... लौटे
  rationale: क्रिया का यहाँ उपयुक्त अर्थ ‘हम लौटे’ है, केवल ‘हम आए’ नहीं।
- source_word: በጊዜ፡ ሰዓት
  choice: नियत समय पर
  rationale: समय-सूचक पदबंध उस पहले से ठहराए या नियुक्त अवसर को व्यक्त करता है जब आगमन होना था।
- source_word: ይስሐቅ
  choice: इसहाक
  rationale: 'नाम को ስሙ के साथ समानाधिकरण में रखा गया है: ‘उसका नाम, इसहाक’।'
theological_decisions:
- issue: स्वर्गीय पट्टिकाओं पर इसहाक के नाम का लेखन
  choice: कथन को सीधे ‘स्वर्गीय पट्टिकाओं पर लिखा गया’ के रूप में रखा
  alternative: इसे रूपक, भविष्यवाणी या पूर्वनियति के किसी विशेष सिद्धान्त के रूप में समझाकर अनुवाद करना
  rationale: स्रोत केवल नाम के लिखे होने का कथन करता है; वह इसके धर्मवैज्ञानिक तंत्र की व्याख्या नहीं करता।
- issue: ‘हम’ की पहचान
  choice: स्रोत का प्रथम पुरुष बहुवचन यथावत रखा
  alternative: ‘स्वर्गदूत’ या ‘हम स्वर्गदूत’ जोड़ना
  rationale: इस पद में वक्ताओं की पहचान स्पष्ट संज्ञा से नहीं दी गई; संदर्भगत निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल कथात्मक शैली। ‘पट्टिकाओं’ ने अभिलेख के भौतिक रूपक को सुरक्षित रखा है; ‘नियत समय’ सामान्य पाठक के लिए स्वाभाविक है और नियुक्त अवसर का भाव देता है।
