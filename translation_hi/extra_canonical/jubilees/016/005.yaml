base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/005.yaml
  text: She conceived a son. And in this month the Lord executed judgment on Sodom and Gomorrah and Admah [or 'and Dom'] and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, just as I have now declared to you all their deeds, that they are utterly wicked and sinful.
translation:
  language: hi
  text: उसने एक पुत्र को गर्भ में धारण किया। इसी महीने प्रभु ने सदोम, गमोरा, दोम[a] और यरदन के पूरे क्षेत्र का न्याय किया। उसने उन्हें आग और गंधक से जला दिया और उन्हें आज तक के लिए नष्ट कर दिया। जैसा कि मैंने अभी तुम्हें उनके सारे काम बताए हैं, वे अत्यंत दुष्ट और पापी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ पाठ में यहाँ ‘दोम’ है; इसे संभवतः ‘अदमा’ समझा गया है।
    reason: नगर-नाम के प्रत्यक्ष पाठ और उसकी संभावित पहचान, दोनों को बिना निश्चितता थोपे सुरक्षित रखना।
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: उसने एक पुत्र को गर्भ में धारण किया
  rationale: स्त्रीलिंग क्रिया और ‘पुत्र’ के कर्म को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; स्रोत में जन्म देने की नहीं, गर्भधारण की बात है।
- source_word: ገብረ፡ እግዚአብሔር
  choice: प्रभु ने ... न्याय किया
  rationale: शाब्दिक ‘प्रभु ने किया’ को अगले पद के विनाशकारी न्याय के संदर्भ में अर्थपूर्ण हिन्दी दी गई है, जैसा पाठ की न्याय-सूचक संरचना और परामर्श-पाठ संकेत करते हैं।
- source_word: ወለዶም
  choice: अदमा[a]
  rationale: पांडुलिपीय रूप ‘दोम’ संभवतः नगर-नाम का भ्रष्ट पाठ है; विनष्ट मैदान-नगरों के संदर्भ में ‘अदमा’ सबसे संभावित है, पर वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: አደያመ፡ ዮርዳኖስ
  choice: यरदन के पूरे क्षेत्र
  rationale: क्षेत्र/परिवेश का स्वाभाविक भौगोलिक अर्थ देता है और ‘सभी’ की व्यापकता बनाए रखता है।
- source_word: በእሳት፡ ወበተይ
  choice: आग और गंधक से
  rationale: दूसरा पदार्थ विनाश-वर्णन में गंधक के अर्थ में समझा गया है; यह स्रोत-संदर्भ के अनुरूप सामान्य हिन्दी पद है।
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: आज तक वे उजड़े पड़े हैं
  rationale: स्रोत के ‘इस दिन तक’ को हिन्दी में कालगत परिणाम के साथ स्वाभाविक बनाया गया है; विनाश के स्थायी प्रभाव को व्यक्त करता है।
- source_word: በከመ፡ ናሁ፡ አይዳዐኩ፡ ኵሎ፡ ምግባሮሙ
  choice: जैसा मैंने अभी तुम्हें उनके सारे कामों के विषय में बताया है
  rationale: ‘अब/देखो’, प्रथम पुरुष ‘मैंने बताया’, संबोधित ‘तुम्हें’, और ‘उनके सारे काम’—सभी मूल घटकों को बनाए रखता है।
- source_word: ፀዋጋን፡ ወኃጥኣን፡ ጥቀ
  choice: अत्यंत दुष्ट और पापी
  rationale: तीव्रतासूचक अंतिम पद को ‘अत्यंत’ से और नैतिक युग्म को सामान्य, गरिमापूर्ण हिन्दी से व्यक्त किया गया है।
theological_decisions:
- issue: विनाश को न्याय के रूप में व्यक्त करना
  choice: प्रभु ने ... न्याय किया
  alternative: प्रभु ने ... के साथ वह किया
  rationale: वाक्य का आशय दैवी दंड है; स्पष्ट हिन्दी अनुवाद संदर्भगत अर्थ बताता है, बिना किसी संप्रदायगत व्याख्या को जोड़े।
- issue: नगर-नाम ዶም की पहचान
  choice: मुख्य पाठ में ‘अदमा’, पादटिप्पणी में ‘दोम’
  alternative: मुख्य पाठ में केवल ‘दोम’ अथवा ‘सोअर’
  rationale: ‘सोअर’ स्रोत से असमर्थित है और कथा में बचाया गया था। ‘अदमा’ प्रबल ऐतिहासिक-संदर्भगत पुनर्निर्माण है, किंतु पाठ की अनिश्चितता स्पष्ट रूप से संरक्षित है।
- issue: अंतिम उपवाक्य का संबंध
  choice: बताए गए कर्म इस निष्कर्ष को प्रकट करते हैं कि वे अत्यंत दुष्ट और पापी थे
  alternative: ‘उनके सब कामों के अनुसार, क्योंकि वे...’
  rationale: स्रोत में ‘मैंने अभी तुम्हें बताया’ क्रिया स्पष्ट है; उसे छोड़ना उचित नहीं। हिन्दी में डैश के बाद ‘कि’ से उसके कथ्य को जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज पर गरिमापूर्ण कथात्मक शैली। ‘गर्भ में धारण किया’, ‘न्याय किया’, ‘उजड़े पड़े हैं’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं। दैवी न्याय और नैतिक दोष की तीव्रता बनाए रखी गई है, जबकि संदिग्ध नगर-नाम को पादटिप्पणी में ईमानदारी से दर्ज किया गया है।
