base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/001.yaml
  text: 'She conceived a son. And and we returned to Sarah in the seventh month and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and would see them before he died, and that in Isaac a name and seed would be called for him.'
translation:
  language: hi
  text: 'उसने एक पुत्र गर्भ में धारण किया। फिर सातवें महीने में हम लौटे और पाया कि सारा को हमारे आने से पहले गर्भ ठहर चुका था। हमने उस पुरुष को[a] आशीष दी और उसे वह सब बताया जिसकी आज्ञा उसके विषय में दी गई थी: वह तब तक नहीं मरेगा, जब तक वह छह पुत्र उत्पन्न न कर ले और मरने से पहले उन्हें देख न ले; और इसहाक में उसके लिए नाम और वंश कहलाएगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में यहाँ पुल्लिंग सर्वनाम है, पर उस व्यक्ति का नाम इस पद में नहीं दिया गया है; प्रसंग में वह संभवतः अब्राहम है।
    reason: पुल्लिंग संदर्भ को स्पष्ट करता है, बिना नाम को मुख्य पाठ में आरोपित किए।
  - marker: b
    text: 'अर्थ संभवतः यह भी है: ‘इसहाक के द्वारा उसका नाम और वंश कायम रहेगा।’'
    reason: ‘इसहाक में’ और ‘कहलाएगा’ वाले मुहावरे का स्वाभाविक हिन्दी अर्थ बताता है, बिना उसे मुख्य पाठ में निर्णायक रूप से स्थापित किए।
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: उसने एक पुत्र को गर्भ में धारण किया
  rationale: गीज़ पदबंध का सीधा अर्थ ‘उसने एक पुत्र को गर्भ में धारण किया’ है; इसे सूचना देने संबंधी उस पुराने पाठ से नहीं बदला गया जिसका मूल में आधार नहीं है।
- source_word: በወርኅ፡ ሳብዕ
  choice: सातवें महीने में
  rationale: मूल के क्रम और आशय के अनुसार समय-सूचक पद को लौटने की क्रिया से जोड़ा गया है, गर्भधारण से नहीं।
- source_word: ቅድሜነ
  choice: हमारे सामने
  rationale: शाब्दिक ‘हमारे आगे/सामने’ को बनाए रखा गया है, क्योंकि प्रसंग में इसका सटीक संबंध कुछ असामान्य और संभावित रूप से अस्पष्ट है।
- source_word: ስድስተ፡ ውሉደ
  choice: छह पुत्र
  rationale: ‘छह संतान/पुत्र’ में पुल्लिंग रूप के अनुसार ‘छह पुत्र’ चुना गया है।
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት
  choice: और वह मरने से पहले उन्हें देख न ले
  rationale: ‘उन्हें’ का निहित कर्म पिछले ‘छह पुत्र’ हैं; इसहाक को ‘देखने’ का कर्म बनाना मूल वाक्य-विन्यास के विरुद्ध होगा।
- source_word: ይጼዋዕ
  choice: कहलाएगा
  rationale: मूल क्रिया ‘पुकारा/कहलाया जाना’ को सुरक्षित रखा गया है; केवल ‘नाम दिया जाएगा’ कहना इस पारंपरिक वंश-संबंधी मुहावरे को संकुचित कर देता।
theological_decisions:
- issue: आशीष और आज्ञा पाने वाले पुरुष की पहचान
  choice: मुख्य पाठ में ‘उसे/उसके’ रखकर संदर्भगत पहचान को स्पष्ट रूप से आरोपित नहीं किया गया
  alternative: हर स्थान पर ‘अब्राहम’ लिखना
  rationale: गीज़ में पुरुषवाचक सर्वनाम है, पर इस पद में व्यक्ति का नाम नहीं आता। निकटवर्ती कथा से अब्राहम संभावित है, फिर भी अनुवाद में नाम जोड़ना मूल की अंतर्निहितता को मिटा देता।
- issue: इसहाक में नाम और वंश का कहलाया जाना
  choice: ‘इसहाक में उसके लिए नाम और वंश कहलाएगा’
  alternative: ‘इसहाक के द्वारा उसका नाम और वंश कायम रहेगा’
  rationale: चुना हुआ रूप मूल के ‘में’ और ‘कहलाया जाएगा’ को बचाता है तथा वंश-प्रतिज्ञा की भाषा को किसी विशेष सांप्रदायिक व्याख्या में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल के असामान्य ‘हमारे सामने’ तथा सर्वनामगत अस्पष्टता को चुपचाप सुधारा नहीं गया। ‘गर्भ में धारण किया’, ‘आशीष’, ‘आज्ञा’ और ‘वंश’ जैसे परिचित बाइबिलीय शब्दों का प्रयोग किया गया है, पर अत्यधिक पुरातन शैली से बचा गया है।
