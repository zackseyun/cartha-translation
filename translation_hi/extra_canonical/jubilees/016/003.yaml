  source_fidelity: 'The Hindi accurately preserves the two coordinated statements of the Geʽez: Sarah’s fear, her denial of having laughed in connection with the word, and the first-person-plural speakers’ disclosure of her son’s name as previously ordained. It appropriately retains the identity of “we” and the agent of the ordaining unstated.'
