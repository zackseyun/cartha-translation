  text: And she was afraid and denied that she had laughed because of the word. And we told her the name of her son, as it had been ordained.
translation:
  language: hi
  text: और वह डर गई और उसने इस बात से इनकार किया कि वह उस वचन के कारण हँसी थी। और हमने उसे उसके पुत्र का नाम बताया, जैसा ठहराया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርት
  choice: डर गई
  rationale: स्त्रीलिंग कर्ता के अनुरूप भय की सीधी और स्वाभाविक अभिव्यक्ति।
- source_word: ሐሰወት
  choice: इनकार किया
  rationale: संदर्भ में अपने हँसने को नकारने का अर्थ है; आधुनिक हिन्दी में ‘इनकार किया’ स्पष्ट और स्वाभाविक है।
- source_word: ቃል
  choice: वचन
  rationale: मूल शब्द ‘बात/वचन’ दोनों अर्थ दे सकता है; दैवी घोषणा के प्रसंग में ‘वचन’ उपयुक्त है, जबकि ‘के कारण’ मूल संबंध को खुला रखता है।
- source_word: ነገርናሃ
  choice: हमने उसे ... बताया
  rationale: बहुवचन वक्ता और स्त्रीलिंग संबोधित व्यक्ति को स्पष्ट रखते हुए क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: ሥሩዕ
  choice: ठहराया गया था
  rationale: पूर्वनियुक्त या निर्धारित किए जाने का भाव बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रहता है।
theological_decisions:
- issue: ‘हम’ वक्ता की पहचान
  choice: हमने
  alternative: स्वर्गदूतों ने / परमेश्वर ने
  rationale: मूल का प्रथम पुरुष बहुवचन जस का तस रखा गया है; वक्ताओं की पहचान को व्याख्यात्मक रूप से निश्चित नहीं किया गया।
- issue: पुत्र के नाम का पूर्वनिर्धारण
  choice: जैसा ठहराया गया था
  alternative: जैसा आदेश दिया गया था
  rationale: निष्क्रिय रूप मूल की अस्पष्टता बनाए रखता है कि किसने नाम ठहराया, और अनावश्यक रूप से आदेश का भाव नहीं जोड़ता।
