  text: From there he moved and dwelt by the Well of the Oath. And in the middle of the sixth month the Lord visited Sarah
translation:
  language: hi
  text: वहाँ से जाकर वह शपथ के कुएँ के पास रहने लगा। छठे महीने के मध्य में प्रभु ने सारा की सुधि ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: वहाँ से जाकर
  rationale: इसका मूल अर्थ ‘वहाँ से’ है; हिन्दी में अगले निवास-स्थान की ओर बढ़ने का भाव स्वाभाविक रूप से व्यक्त करने के लिए ‘जाकर’ जोड़ा गया है, बिना किसी अलग यात्रा-विवरण को आरोपित किए।
- source_word: ዐዘቅት፡ መሐላ
  choice: शपथ का कुआँ
  rationale: दोनों शब्द क्रमशः ‘कुआँ’ और ‘शपथ’ का अर्थ देते हैं। यह स्थाननाम के अर्थ को स्पष्ट रखता है और ‘मम्रे का बांज’ वाली असमर्थित पुरानी व्याख्या से बचता है।
- source_word: ሐወጻ
  choice: सुधि ली
  rationale: ईश्वर के किसी व्यक्ति की ओर ध्यान देने और उसके पक्ष में कार्य करने की बाइबलीय अभिव्यक्ति को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: यह ईश्वर के लिए प्रयुक्त मानक गरिमापूर्ण हिन्दी संबोधन है।
theological_decisions:
- issue: प्रभु द्वारा सारा से संबंधित क्रिया का अर्थ
  choice: सारा की सुधि ली
  alternative: सारा से भेंट की
  rationale: ‘सुधि ली’ केवल शारीरिक भेंट का संकेत देने के बजाय दैवी ध्यान और हस्तक्षेप की व्यापक बाइबलीय धारणा को बनाए रखता है, पर उसके ढंग को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज और गरिमापूर्ण रखी गई है। स्थानसूचक पद को उसके शाब्दिक अर्थ ‘शपथ का कुआँ’ के रूप में प्रस्तुत किया गया है।
