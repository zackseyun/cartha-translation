  source_fidelity: 'The draft conveys both clauses of the Ge''ez: departure/location at the Well of the Oath and the Lord''s visitation of Sarah. “वहाँ से जाकर” appropriately represents the movement implicit in “from there … dwelt,” and “शपथ के कुएँ के पास” accurately renders the locative sense of the place-name expression.'
