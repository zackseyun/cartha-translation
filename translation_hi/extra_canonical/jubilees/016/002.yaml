  text: And Sarah laughed because she heard that we had spoken this word with Abraham, and we reproved her.
translation:
  language: hi
  text: और सारा हँसी, क्योंकि उसने सुना कि हमने अब्राहम से यह बात कही थी; और हमने उसे डाँटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወስሐቀት፡ ሳራ
  choice: और सारा हँसी
  rationale: क्रिया स्त्रीलिंग एकवचन है और सारा इसका स्पष्ट कर्ता है; सरल भूतकाल मूल कथन की सीधी शैली को बनाए रखता है।
- source_word: እስመ፡ ሰምዐት
  choice: क्योंकि उसने सुना
  rationale: እስመ यहाँ कारणसूचक ‘क्योंकि’ है, केवल कालसूचक ‘जब’ नहीं; स्त्रीलिंग क्रिया का संदर्भ सारा से है।
- source_word: ተናገርነ፡ ዘንተ፡ ቃለ፡ ምስለ፡ አብርሃም
  choice: हमने अब्राहम से यह बात कही थी
  rationale: ‘हमने’ मूल के प्रथम पुरुष बहुवचन को सुरक्षित रखता है; ምስለ का प्रसंगानुकूल स्वाभाविक हिंदी रूप ‘से’ है, और ‘कही थी’ सुनने से पूर्व हुए कथन को स्पष्ट करता है।
- source_word: ወዘለፍናሃ፡
  choice: और हमने उसे डाँटा
  rationale: क्रिया सुधारात्मक फटकार या उलाहने का भाव रखती है; ‘डाँटा’ सामान्य आधुनिक हिंदी में इसे स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘हम’ बोलने वालों की पहचान
  choice: प्रथम पुरुष बहुवचन ‘हमने’ को ज्यों का त्यों रखा गया
  alternative: ‘स्वर्गदूतों ने’ या किसी एक वक्ता का नाम देकर स्पष्ट करना
  rationale: पद स्वयं वक्ताओं की पहचान स्पष्ट नहीं करता; किसी विशिष्ट पहचान को जोड़ना मूल की कथात्मक और धर्मवैचारिक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘फटकार लगाई’ की तुलना में ‘डाँटा’ अधिक संक्षिप्त और सामान्य है, जबकि मूल का सुधारात्मक भाव बना रहता है।
