base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/006.yaml
  text: and they defiled themselves and committed fornication in their flesh and did uncleanness on the earth. And thus the Lord will execute judgment on the places where they have acted according to the uncleanness of Sodom, just as he judged Sodom.
translation:
  language: hi
  text: और उन्होंने अपने आपको अशुद्ध किया, अपनी देह में व्यभिचार किया, और पृथ्वी पर अशुद्ध काम किए। और इसी प्रकार प्रभु उन स्थानों का न्याय करेगा जहाँ उन्होंने सदोम की अशुद्धता के अनुसार आचरण किया है, जैसा उसने सदोम का न्याय किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትራኩሱ / ርኵሰ / ርኵሶሙ
  choice: अशुद्ध किया / अशुद्धता
  rationale: गीज़ मूल में एक ही अशुद्धता-संबंधी शब्द-परिवार की पुनरावृत्ति है; हिन्दी में ‘अशुद्ध’ और ‘अशुद्धता’ इसे स्पष्ट और स्वाभाविक रूप से बनाए रखते हैं।
- source_word: ይዜምዉ
  choice: व्यभिचार किया
  rationale: यह क्रिया यौन अनैतिकता अथवा व्यभिचार का बोध कराती है; ‘व्यभिचार किया’ वर्तमान हिन्दी में गरिमापूर्ण और स्रोत के पर्याप्त निकट है।
- source_word: በሥጋሆሙ
  choice: अपने शरीर में
  rationale: मूल के शाब्दिक स्थानवाचक रूप को बनाए रखा गया है; इसे ‘अपने शरीरों में’ कहना हिन्दी में अस्वाभाविक होता।
- source_word: ኵነኔ
  choice: न्याय करेगा
  rationale: संदर्भ में दंडात्मक न्याय निहित है, पर ‘न्याय’ मूल की न्याय-विषयक व्यापकता को ‘दंड’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: በመካናት
  choice: उन स्थानों का
  rationale: बहुवचन ‘स्थानों’ को सुरक्षित रखा गया है और हिन्दी वाक्य-विन्यास के अनुसार संबंध सूचक रूप दिया गया है।
theological_decisions:
- issue: सदोम की अशुद्धता और उसके समान आचरण पर ईश्वरीय न्याय
  choice: ‘सदोम की अशुद्धता के अनुसार आचरण किया है’
  alternative: ‘सदोम जैसा अशुद्ध काम किया है’
  rationale: चुना हुआ रूप मूल में सदोम की अशुद्धता को मानदंड या प्रतिरूप बनाने वाले संबंध को सुरक्षित रखता है और अपराध की प्रकृति को अतिरिक्त व्याख्या से सीमित नहीं करता।
- issue: प्रभु के न्याय का काल
  choice: पहले खंड में भविष्यकाल और सदोम के संबंध में भूतकाल
  alternative: दोनों को सामान्य वर्तमानकाल में रखना
  rationale: मूल और परामर्श-पाठ भावी न्याय को सदोम पर हो चुके न्याय से तुलना करते हैं; इस कालगत तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली। स्रोत की पुनरावृत्ति और न्याय-विषयक भाषा को यथासंभव रखा गया है; अनावश्यक व्याख्यात्मक विस्तार से बचा गया है।
