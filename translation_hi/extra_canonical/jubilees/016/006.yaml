review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the sequence of self-defilement, sexual wrongdoing ‘in their flesh,’ uncleanness on the earth, and the Lord’s future judgment of the relevant places in comparison with Sodom’s past judgment. The plural subject in the second sentence should remain linked to the preceding ‘they’; adding ‘लोगों’ is not required by the source.
  naturalness: ‘अशुद्धता के काम किए’ is somewhat redundant in modern Hindi. ‘अशुद्ध काम किए’ is more idiomatic while retaining the source’s broad expression for doing uncleanness. Replacing the supplied ‘लोगों ने’ with ‘उन्होंने’ is leaner and preserves the source’s continuing subject.
  terminology: ‘अशुद्ध,’ ‘व्यभिचार,’ ‘देह,’ ‘न्याय,’ and ‘सदोम’ are suitable, dignified modern Hindi biblical terms. ‘व्यभिचार’ is retained as the established broad biblical rendering here without adding a more specific interpretation.
  issues:
  - severity: low
    issue: Unnecessary supplied noun ‘लोगों’ in the relative clause.
    rationale: The source continues with a plural verbal subject; ‘उन्होंने’ preserves this without introducing an explicit noun not present in the text.
  - severity: low
    issue: ‘अशुद्धता के काम किए’ is stylistically heavy.
    rationale: ‘अशुद्ध काम किए’ is natural modern Hindi and communicates the same general, non-specific wrongdoing without narrowing the source expression.
  revised_text: और उन्होंने अपने आपको अशुद्ध किया, अपनी देह में व्यभिचार किया, और पृथ्वी पर अशुद्ध काम किए। और इसी प्रकार प्रभु उन स्थानों का न्याय करेगा जहाँ उन्होंने सदोम की अशुद्धता के अनुसार आचरण किया है, जैसा उसने सदोम का न्याय किया था।
