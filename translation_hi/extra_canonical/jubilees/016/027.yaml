translation:
  language: hi
  text: और उसने आशीर्वाद दिया और वह आनन्दित हुआ; और उसने इस पर्व का नाम “प्रभु का पर्व—आनन्द”[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु का पर्व, आनन्द।”
    reason: स्रोत में “आनन्द” अंत में समानाधिकरण के रूप में आता है; विराम-चिह्न और नाम-संबंध कुछ हद तक अस्पष्ट हैं।
lexical_decisions:
- source_word: ወባረከ
  choice: और उसने आशीष दी
  rationale: क्रिया के कर्म का स्रोत-पाठ में स्पष्ट उल्लेख नहीं है; हिन्दी में भी उसे अनिर्दिष्ट रखा गया है।
- source_word: ወተፈሥሐ
  choice: और आनन्द मनाया
  rationale: यह चयन हर्षित होने अथवा आनन्द करने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በዓል
  choice: पर्व
  rationale: धार्मिक उत्सव के लिए आधुनिक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला शब्द।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ के सामान्य ईश्वरीय संबोधन का स्थापित और संप्रदाय-निरपेक्ष हिन्दी प्रतिरूप।
- source_word: ፍሥሓ
  choice: आनन्द
  rationale: अंतिम संज्ञा को पर्व के नाम से जुड़े समानाधिकरणात्मक पद के रूप में रखा गया है, न कि क्रियाविशेषण के रूप में।
theological_decisions:
- issue: अंतिम ‘ፍሥሓ’ का ‘प्रभु का पर्व’ से संबंध
  choice: “प्रभु का पर्व—आनन्द”
  alternative: “प्रभु का पर्व, जो आनन्द का पर्व है”
  rationale: स्रोत में अंतिम संज्ञा संक्षिप्त और समानाधिकरणात्मक है। डैश हिन्दी में इस तनाव और नाम-सदृश संरचना को बनाए रखता है, जबकि विस्तृत वैकल्पिक रूप स्रोत से अधिक व्याख्या जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। आरंभिक ኵሎ (‘सब/पूरा’) को शामिल नहीं किया गया, क्योंकि उपलब्ध पद-विभाजन और परामर्श-पाठ के अनुसार वह पिछले वाक्य का अंतिम शब्द है।
