  yaml_path: translation/extra_canonical/jubilees/016/025.yaml
  text: And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.
translation:
  language: hi
  text: और उसने यह पर्व सात दिन तक मनाया। वह और उसके घर के सभी लोग अपने पूरे हृदय और पूरे प्राण से आनन्द मनाते रहे। उसके साथ न कोई परदेशी था, न कोई ऐसा व्यक्ति जिसका खतना न हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓለ
  choice: पर्व
  rationale: यह शब्द धार्मिक उत्सव या पर्व को दर्शाता है; प्रसंग में ‘पर्व’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ሰቡዐ፡ መዋዕለ
  choice: सात दिन तक
  rationale: अवधि को आधुनिक हिन्दी में स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ
  choice: अपने पूरे हृदय और पूरे प्राण से
  rationale: मूल के समानांतर पदों और सम्पूर्ण अंतःकरण से आनन्दित होने के भाव को बनाए रखता है।
- source_word: እለ፡ ውስተ፡ ቤቱ
  choice: उसके घर के सभी लोग
  rationale: शाब्दिक ‘जो उसके घर में थे’ का स्वाभाविक हिन्दी रूप, जिसमें घराने के सम्मिलित लोगों का अर्थ सुरक्षित है।
- source_word: foreign/uncircumcised continuation reflected in audited consultation text
  choice: परदेशी… ऐसा व्यक्ति जिसका खतना न हुआ था
  rationale: दिए गए गीइज़ अंश का अंतिम वाक्य अपूर्ण है; परामर्श-पाठ में संरक्षित दोनों निषेधों को स्पष्ट, गैर-सांप्रदायिक हिन्दी में रखा गया है।
theological_decisions:
- issue: ‘पूरे हृदय’ और ‘पूरे प्राण’ का संबंध
  choice: दोनों अभिव्यक्तियों को अलग-अलग बनाए रखा
  alternative: ‘पूरे मन से’ जैसे एक संयुक्त मुहावरे में समेटना
  rationale: मूल की द्विपदी अभिव्यक्ति और उसके धार्मिक-मानवीय तनाव को बिना संकुचित किए सुरक्षित रखा गया है।
- issue: खतना-रहित व्यक्ति का वर्णन
  choice: जिसका खतना न हुआ था
  alternative: अखतनित/खतनारहित
  rationale: अर्थ को ठीक रखते हुए सामान्य आधुनिक पाठक के लिए अधिक स्पष्ट और स्वाभाविक भाषा चुनी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हैं। ‘आनन्द’ तथा ‘प्राण’ धार्मिक साहित्य की परिचित गरिमा रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल है। उपलब्ध गीइज़ उद्धरण ‘और वहाँ कोई नहीं था’ पर कट जाता है; अंतिम दो पद audited English consultation layer के आधार पर प्रस्तुत किए गए हैं।
