base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/020.yaml
  text: And he built there an altar to Yahweh, who delivered him and made him rejoice in the land of his sojourning, and he made a festival of joy in this month for seven days, near the altar which he had built at the Well of the Oath.
translation:
  language: hi
  text: और उसने वहाँ यहोवा के लिए एक वेदी बनाई, जिसने उसे छुड़ाया था और जिस देश में वह परदेशी के रूप में रह रहा था वहाँ उसे आनन्द दिया था। फिर उसने इसी महीने उस वेदी के पास, जिसे उसने शपथ के कुएँ पर बनाया था, सात दिन तक आनन्द का पर्व मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሥዋዐ
  choice: वेदी
  rationale: बलि चढ़ाने के लिए निर्मित altar का स्वाभाविक और स्थापित हिन्दी प्रतिशब्द।
- source_word: ለእግዚአብሔር
  choice: यहोवा के लिए
  rationale: यहाँ ईश्वर के विशिष्ट नाम का संकेत है; हिन्दी बाइबलीय प्रयोग में प्रचलित ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ में विलीन नहीं करता।
- source_word: ዘአድኀኖ
  choice: जिसने उसे बचाया था
  rationale: स्रोत के उद्धार/बचाव संबंधी क्रियार्थ को स्पष्ट तथा सहज हिन्दी में व्यक्त करता है।
- source_word: ዘአስተፈሥሖ
  choice: उसे आनन्दित किया था
  rationale: कारणवाचक भाव ‘आनन्दित करना’ को बनाए रखता है, न कि केवल उसके स्वयं आनन्द मनाने का अर्थ देता है।
- source_word: በብሔረ ፡ ፈላስነቱ
  choice: उसके परदेश-निवास के देश में
  rationale: ፈላስነቱ के अस्थायी निवासी अथवा प्रवासी के रूप में रहने के भाव को ‘निर्वासन’ की अपेक्षा तटस्थ रूप से सुरक्षित रखता है।
- source_word: ገብረ ፡ በዓለ ፡ ትፍሥሕት
  choice: आनन्द का पर्व मनाया
  rationale: शाब्दिक ‘आनन्द का पर्व किया’ के आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በዐዘቅተ ፡ መሐላ
  choice: शपथ के कुएँ पर
  rationale: गीज़ पदबंध का प्रत्यक्ष अर्थ देता है और बेर्शेबा नाम में निहित अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: विशिष्ट ईश्वरीय नाम को सामान्य उपाधि में बदलने से बचाया गया है; किसी सांप्रदायिक व्याख्या को जोड़े बिना हिन्दी में परिचित रूप अपनाया गया है।
- issue: परदेश में निवास की प्रकृति
  choice: परदेश-निवास
  alternative: निर्वासन
  rationale: स्रोत अस्थायी निवासी/प्रवासी की स्थिति व्यक्त कर सकता है; ‘निर्वासन’ अनिवार्य निष्कासन का अधिक कठोर अर्थ जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। लंबे स्रोत-वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया, जबकि क्रियाओं का क्रम और सभी विवरण सुरक्षित हैं। ‘इसी महीने’ स्रोत के संकेतवाचक बल को व्यक्त करता है।
