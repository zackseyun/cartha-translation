translation:
  language: hi
  text: उसने उसे नाश कर दिया। और उस व्यक्ति ने और उसकी बेटियों ने भी धरती पर ऐसा पाप किया, जैसा धरती पर पहले कभी नहीं हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገፍታአ
  choice: उसने उसे उलट दिया
  rationale: यह क्रिया पिछले प्रसंग में नगर के विनाश को समेटती है; स्त्रीलिंग कर्म-प्रत्यय को हिन्दी में संदर्भानुसार सामान्य ‘उसे’ रखा गया है।
- source_word: ገብረ ... ኀጢአተ
  choice: पाप किया
  rationale: शाब्दिक अर्थ ‘पाप करना’ है और आधुनिक हिन्दी में यही स्वाभाविक तथा स्पष्ट प्रयोग है।
- source_word: ውእቱኒ፡ ወአዋልዲሁኒ
  choice: उसने और उसकी बेटियों ने भी
  rationale: ‘वह भी और उसकी बेटियाँ भी’ के संयुक्त बल को सहज हिन्दी में रखा गया है, बिना किसी सहभागी को गौण किए।
- source_word: ዲበ፡ ምድር
  choice: धरती पर
  rationale: पूर्वसर्ग और संज्ञा का सीधा, स्वाभाविक हिन्दी समतुल्य।
- source_word: ዘአኮ፡ ዲበ፡ ምድር
  choice: जैसा धरती पर पहले कभी नहीं हुआ था
  rationale: अस्तित्व-निषेध वाले सापेक्ष वाक्य को हिन्दी में मुहावरेदार ढंग से व्यक्त करता है; ‘पहले कभी’ अभिप्रेत पूर्व-अस्तित्व को स्पष्ट करता है।
theological_decisions:
- issue: आरम्भिक क्रिया का कर्ता और कर्म
  choice: ‘उसने उसे उलट दिया’—सर्वनाम बनाए रखे गए
  alternative: ‘परमेश्वर ने सदोम को उलट दिया’
  rationale: मूल पाठ में नाम स्पष्ट नहीं हैं और वे पिछले संदर्भ से समझे जाते हैं; अनुवाद में उन्हें जोड़ना वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से समाप्त करता।
- issue: लूत और उसकी बेटियों के पाप में सहभागिता
  choice: ‘उसने और उसकी बेटियों ने भी ... पाप किया’
  alternative: ‘उसने भी पाप किया, और उसकी बेटियों ने भी’
  rationale: दोनों पक्षों की संयुक्त सहभागिता मूल के समन्वय के अनुरूप है और हिन्दी में अधिक सहज है; यह दोष के स्वरूप या अनुपात पर अतिरिक्त धर्मवैचारिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘उलट दिया’ बाइबलीय विनाश-चित्र को बनाए रखता है; वाक्य में मूल के सर्वनाम और संदर्भगत तनाव सुरक्षित हैं।
