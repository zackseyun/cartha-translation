- from: यह उनकी पीढ़ी-पीढ़ी के लिए, वर्ष-प्रतिवर्ष मानी जाने वाली सदा की विधि है। इसके दिनों की कोई अंतिम सीमा नहीं है, क्योंकि यह इस्राएल के लिए सदा के लिए ठहराई गई है कि वे इसे मनाएँ, छप्परों में रहें, अपने सिरों पर मुकुट पहनें और पत्तेदार डालियाँ तथा विलो की टहनियाँ लें।
  to: यह उनकी पीढ़ियों के लिए, वर्ष दर वर्ष, सदा का विधान है। और इसके लिए दिनों की कोई सीमा नहीं है, क्योंकि यह इस्राएल के लिए सदा के लिए ठहराया गया है कि वे इसे मनाएँ, छप्परों में रहें, अपने सिरों पर मुकुट पहनें, और पत्तेदार डालियाँ तथा विलो की डालियाँ लें।
