base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/030.yaml
  text: It is an everlasting statute throughout their generations, year by year. And there is no limit of days for this, for it is ordained forever for Israel, that they should celebrate it and dwell in booths and wear crowns on their heads and take leafy branches and willows.
translation:
  language: hi
  text: यह उनकी पीढ़ियों के लिए, वर्ष दर वर्ष, सदा का विधान है। और इसके लिए दिनों की कोई सीमा नहीं है, क्योंकि यह इस्राएल के लिए सदा के लिए ठहराया गया है कि वे इसे मनाएँ, छप्परों में रहें, अपने सिरों पर मुकुट पहनें, और पत्तेदार डालियाँ तथा विलो की डालियाँ लें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገ፡ ዘለዓለም
  choice: सदा की विधि
  rationale: यह पदबंध स्थायी और बाध्यकारी विधान को व्यक्त करता है; ‘विधि’ आधुनिक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: በኵሉ፡ ዓመት፡ ወዓመት
  choice: वर्ष-प्रतिवर्ष
  rationale: मूल में वार्षिक पुनरावृत्ति पर बल है; यह हिन्दी में उसका स्वाभाविक संक्षिप्त रूप है।
- source_word: ይግበርዎ
  choice: इसे मनाएँ
  rationale: शाब्दिक अर्थ ‘इसे करें’ है, पर पर्व-विधान के प्रसंग में ‘मनाएँ’ अभिप्रेत क्रिया को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ምጽላል
  choice: छप्परों
  rationale: शब्द पर्व के समय रहने के अस्थायी आश्रयों या booths को दर्शाता है; ‘छप्पर’ साधारण पाठक के लिए स्पष्ट है।
- source_word: አክሊላተ
  choice: मुकुट
  rationale: मूल शब्द सीधे ‘मुकुटों’ को दर्शाता है; रूपक या किसी विशेष धार्मिक व्याख्या को जोड़े बिना इसे बनाए रखा गया है।
- source_word: ዐጽቀ፡ ቈጽል
  choice: पत्तेदार डालियाँ
  rationale: संयुक्त अभिव्यक्ति पत्तों वाली शाखाओं या डालियों को दर्शाती है।
- source_word: ውኩሓ
  choice: विलो की टहनियाँ
  rationale: गीज़ शब्द का अर्थ ‘willows’ है। ‘नाले से’ मूल में नहीं है, इसलिए उसे नहीं जोड़ा गया; हिन्दी में वृक्ष की पहचान स्पष्ट करने के लिए ‘विलो की टहनियाँ’ कहा गया है।
theological_decisions:
- issue: विधान की स्थायी अवधि
  choice: ‘सदा की विधि’ और ‘दिनों की कोई अंतिम सीमा नहीं’ दोनों कथनों को स्पष्ट रूप से रखा गया
  alternative: इसे केवल ‘स्थायी वार्षिक पर्व’ कहकर संक्षिप्त करना
  rationale: मूल पाठ स्थायित्व को दो अलग कथनों में दोहराता है; उस धार्मिक बल और तनाव को घटाया नहीं गया।
- issue: इस्राएल पर विधान का ठहराया जाना
  choice: ‘इस्राएल के लिए सदा के लिए ठहराई गई है’
  alternative: ‘इस्राएल को सदा पालन करना चाहिए’
  rationale: मूल का निष्क्रिय ‘ठहराया गया’ रूप सुरक्षित रखा गया, ताकि विधान देने वाले को अनावश्यक रूप से स्पष्ट न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठकों के लिए सहज किंतु गरिमापूर्ण। वाक्य में मूल की विधिक और स्थायित्व-सूचक पुनरुक्ति सुरक्षित रखी गई है। ‘विलो’ अपेक्षाकृत परिचित आधुनिक वृक्षनाम है; ‘नाले से’ जैसी लैव्यव्यवस्था 23:40 से आने वाली सामग्री नहीं जोड़ी गई।
