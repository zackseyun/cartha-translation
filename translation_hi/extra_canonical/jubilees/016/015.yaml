  text: the covenant that is established forever. And in the sixth year of the fourth week we came to Abraham at the Well of the Oath, and we appeared to him as we had told Sarah that we would return to her and she would conceive a son.
translation:
  language: hi
  text: वह वाचा, जो सदा के लिए स्थापित की गई है। चौथे सप्ताह के छठे वर्ष में हम शपथ के कुएँ[a] पर अब्राहम के पास आए, और हम उसे दिखाई दिए, जैसा हमने सारा से कहा था कि हम उसके पास लौटेंगे और वह एक पुत्र को गर्भ धारण करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात बेर्शेबा; इस नाम का संबंध “शपथ का कुआँ” से है।
    reason: मूल गीइज़ स्थाननाम का अर्थगत रूप देता है; पादटिप्पणी परिचित स्थाननाम की पहचान कराती है।
lexical_decisions:
- source_word: ኪዳን
  choice: वाचा
  rationale: यह शब्द औपचारिक और बाध्यकारी covenant को व्यक्त करता है तथा हिन्दी बाइबलीय भाषा में सहज रूप से समझा जाता है।
- source_word: ተሠርዐት
  choice: स्थापित की गई है
  rationale: यह निष्क्रिय क्रिया किसी व्यवस्था या वाचा के ठहराए अथवा स्थापित किए जाने का भाव देती है; यहाँ सरल और स्वाभाविक हिन्दी चुनी गई है।
- source_word: ዐዘቅተ፡ መሐላ
  choice: शपथ का कुआँ
  rationale: मूल पदबंध का अर्थगत अनुवाद किया गया है; यह बेर्शेबा नाम के अर्थ को भी सुरक्षित रखता है।
- source_word: ወአስተርአይናሁ
  choice: हम उसे दिखाई दिए
  rationale: मूल का प्रथम पुरुष बहुवचन और अब्राहम को दृश्य रूप में प्रकट होने का भाव बनाए रखा गया है।
- source_word: ንገብአ፡ ኀቤሃ
  choice: हम उसके पास लौटेंगे
  rationale: क्रिया का लौटने का अर्थ और सारा की ओर संकेत करने वाला स्त्रीलिंग सर्वनाम दोनों स्पष्ट रखे गए हैं।
theological_decisions:
- issue: सदा के लिए स्थापित वाचा की प्रकृति
  choice: वह वाचा, जो सदा के लिए स्थापित की गई है
  alternative: वह वाचा, जो सदा के लिए ठहराई गई है
  rationale: मूल वाचा की स्थायी स्थापना बताता है, पर यह नहीं बताता कि उस स्थायित्व को किसी विशिष्ट सम्प्रदायगत ढाँचे में कैसे समझा जाए।
- issue: प्रकट होने वाले बहुवचन वक्ता
  choice: हम उसे दिखाई दिए
  alternative: हमने अपने आपको उस पर प्रकट किया
  rationale: मूल का बहुवचन ज्यों का त्यों रखा गया है और वक्ताओं की पहचान को पाठ से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली रखी गई है। कालगणना के तकनीकी पद “चौथे सप्ताह के छठे वर्ष” को शाब्दिक रूप में सुरक्षित रखा गया है। आरम्भिक वाक्य पिछले प्रसंग से जुड़ा हुआ अंश है, इसलिए उसकी खंडात्मक प्रकृति को अनावश्यक व्याख्या से नहीं भरा गया।
