review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Isaac’s exclusive status, his exclusion from the nations, the ‘portion of the Most High’ imagery, and the deliberately unfinished final clause. The expression for all his seed, however, should more clearly reflect the source’s lot/portion idiom and its completed action.
  naturalness: The Hindi is generally clear and suitably formal. ‘परमेश्वर के हिस्से में आया है’ is understandable but sounds like a present-result statement and weakens the lot imagery; ‘परमेश्वर के भाग में पड़ गया था’ is more idiomatic in this context and better reflects the completed action.
  terminology: ‘परमप्रधान,’ ‘पवित्र वंश,’ ‘निज प्रजा,’ and ‘राज्य’ are appropriate and consistent with a dignified modern Hindi biblical register. The distinction between ‘परमप्रधान’ and ‘परमेश्वर’ should remain, as in the source.
  issues:
  - severity: medium
    issue: ‘उसका सारा वंश परमेश्वर के हिस्से में आया है’ does not adequately convey the completed lot/portion formulation.
    rationale: The source wording underlying this clause denotes falling/being assigned by lot to God. ‘आया है’ is less precise both aspectually and imagistically. ‘परमेश्वर के भाग में पड़ गया था’ preserves the allotment language without adding interpretation.
  revised_text: और केवल इसहाक ही पवित्र वंश होगा[a] और वह जातियों में नहीं गिना जाएगा, क्योंकि वह परमप्रधान का भाग होगा। उसका सारा वंश परमेश्वर के भाग में पड़ गया था, ताकि वह सब लोगों में से प्रभु की निज प्रजा बने और एक राज्य बने।
