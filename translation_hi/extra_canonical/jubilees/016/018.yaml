base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/018.yaml
  text: And Isaac alone would become a holy seed, and he would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom
translation:
  language: hi
  text: और केवल इसहाक ही पवित्र वंश होगा[a] और वह जातियों में नहीं गिना जाएगा, क्योंकि वह परमप्रधान का भाग होगा। उसका सारा वंश परमेश्वर के भाग में पड़ गया था, ताकि वह सब लोगों में से प्रभु की निज प्रजा बने और एक राज्य बने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इसहाक एक पवित्र वंश होगा।”
    reason: አሐዱ का अर्थ ‘एक’ भी हो सकता है, यद्यपि प्रसंग में ‘केवल’ का विशिष्टतासूचक अर्थ अधिक उपयुक्त है।
lexical_decisions:
- source_word: ይስሐቅኒ፡ አሐዱ
  choice: केवल इसहाक ही
  rationale: አሐዱ के एकत्व और विशिष्टता के बल को व्यक्त करता है; प्रसंग में अब्राहम की अन्य संतानों के विपरीत इसहाक पर विशेष बल है।
- source_word: ዘርእ፡ ቅዱስ
  choice: पवित्र वंश
  rationale: शाब्दिक अर्थ और सामूहिक वंशावली-संबंधी भाव दोनों सुरक्षित रखता है।
- source_word: ኢይትኌለቍ፡ ወውስተ፡ አሕዛብ
  choice: जातियों में नहीं गिना जाएगा
  rationale: गणना या श्रेणी में रखे जाने के स्रोत-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: መክፈልተ፡ ልዑል
  choice: परमप्रधान का भाग
  rationale: ‘भाग/हिस्सा’ की वाचा-संबंधी छवि को व्याख्यात्मक विस्तार दिए बिना बनाए रखता है।
- source_word: ወረደ፡ ኵሉ፡ ዘርኡ
  choice: उसका सारा वंश परमेश्वर के हिस्से में आया है
  rationale: लॉट द्वारा किसी के हिस्से में आने की छवि को हिन्दी में स्पष्ट करता है; स्रोत का पूर्णतासूचक ‘सारा’ भी सुरक्षित है।
- source_word: ሕዝበ፡ ትርሲት
  choice: निज प्रजा
  rationale: अधिकार अथवा संपत्ति के लिए अलग की गई प्रजा का अर्थ संक्षेप और गरिमा के साथ देता है।
- source_word: መንግሥተ
  choice: एक राज्य
  rationale: खंड के अंत में स्रोत-पाठ भी अपूर्ण वाक्य पर रुकता है; इसलिए आगे की सामग्री नहीं जोड़ी गई।
theological_decisions:
- issue: इसहाक की विशिष्टता
  choice: केवल इसहाक ही
  alternative: इसहाक एक पवित्र वंश होगा
  rationale: አሐዱ को छोड़ना इस पद की विशिष्टता को कम कर देता; ‘केवल…ही’ उसके स्पष्ट बल को सुरक्षित रखता है।
- issue: चयन/हिस्से की भाषा
  choice: परमप्रधान का भाग; परमेश्वर के हिस्से में आया
  alternative: परमप्रधान की विरासत; परमेश्वर ने चुन लिया
  rationale: स्रोत की भाग और चिट्ठी/हिस्से की छवि को बनाए रखा गया है और उसे सामान्य ‘चुनाव’ की धर्मवैज्ञानिक शब्दावली में नहीं बदला गया।
- issue: अंतिम वाक्य की अपूर्णता
  choice: और एक राज्य बने।
  alternative: और याजकों का राज्य बने।
  rationale: दिए गए गीइज़ स्रोत में पद इसी संज्ञा पर समाप्त होता है; संभावित अगले पद या समानांतर परंपरा से शब्द जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘परमप्रधान’, ‘पवित्र वंश’, ‘निज प्रजा’ और ‘राज्य’ जैसे बाइबलीय पद रखे गए हैं; अनावश्यक संस्कृतनिष्ठता और सांप्रदायिक व्याख्या से बचा गया है।
