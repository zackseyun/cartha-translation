  text: a priesthood and a holy people. And he went on his way, and he rejoiced and blessed the Creator of all because we had told him.
translation:
  language: hi
  text: एक याजक-वर्ग और एक पवित्र प्रजा। फिर वह अपने मार्ग पर चला गया। हमने उसे जो बताया था, उसके कारण वह आनन्दित हुआ और उसने सबके सृष्टिकर्ता को धन्य कहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो कुछ हमने उसे बताया था, उसके लिए उसने प्रभु को धन्य कहा।”
    reason: यह पूर्ववर्ती पाठ-समझ को सुरक्षित रखता है, जिसमें ईश्वरीय उपाधि ‘प्रभु’ है और ‘जो कुछ हमने उसे बताया था’ स्तुति के कारण/विषय के रूप में जुड़ता है।
lexical_decisions:
- source_word: ክህነት
  choice: याजक-वर्ग
  rationale: यह सामूहिक भाव वाला संज्ञा-रूप है; इसलिए केवल बहुवचन ‘याजक’ के बजाय ‘याजक-वर्ग’ चुना गया।
- source_word: ሕዝበ ቅዱሰ
  choice: पवित्र प्रजा
  rationale: ‘प्रजा’ सामूहिक जनसमुदाय का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ፍኖተ
  choice: अपने मार्ग पर
  rationale: संदर्भ में किसी वास्तविक यात्रा या प्रस्थान को व्यक्त करने वाला सहज हिन्दी मुहावरा।
- source_word: ባሬ ኵሉ
  choice: सबके सृष्टिकर्ता
  rationale: परामर्श-पाठ में स्वीकृत विशिष्ट ईश्वरीय उपाधि ‘Creator of all’ को सुरक्षित रखा गया है; ‘सबके’ का संबंध सृष्टिकर्ता से रखा गया है, अगले उपवाक्य से नहीं।
- source_word: ዘነገርናሁ
  choice: हमने उसे जो बताया था, उसके कारण
  rationale: उपवाक्य को यहाँ कारणसूचक समझा गया है, यद्यपि संबंध का दूसरा पाठ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: ተፈሥሐ
  choice: आनन्दित हुआ
  rationale: क्रिया के उल्लास/आनन्द के सामान्य अर्थ को सरल आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय उपाधि
  choice: सबके सृष्टिकर्ता
  alternative: प्रभु
  rationale: विशिष्ट सृष्टिकर्ता-उपाधि को सामान्य ‘प्रभु’ में बदलने से अर्थ-सूक्ष्मता मिट जाती; फिर भी पूर्ववर्ती वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
- issue: अंतिम उपवाक्य का वाक्यगत संबंध
  choice: बताने को आनन्द और स्तुति का कारण माना गया
  alternative: ‘जो कुछ हमने उसे बताया था’ को ‘धन्य कहा’ के साथ विषयगत रूप से जोड़ना
  rationale: स्रोत की संरचना एक से अधिक ढंग से समझी जा सकती है; मुख्य पाठ कारणसूचक व्याख्या अपनाता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक धार्मिक शब्दावली। मुख्य पाठ में छोटे वाक्य रखे गए हैं ताकि खंडित आरंभ और आगे की क्रियाओं का संबंध स्पष्ट रहे।
