lexical_decisions:
- source_word: ምሥዋዕ
  choice: वेदी
  rationale: यह बलि चढ़ाने की वेदी के लिए सामान्य और स्पष्ट हिन्दी शब्द है।
- source_word: ዐዘቅተ፡ መሐላ
  choice: शपथ का कुआँ
  rationale: मूल पदबंध का अर्थगत रूप बनाए रखता है; यह स्थाननाम बेरशेबा से जुड़ी शब्द-क्रीड़ा को भी अनावश्यक रूप से मिटाता नहीं।
- source_word: ምጽላላተ
  choice: झोंपड़ियाँ
  rationale: बहुवचन अस्थायी छायादार आश्रयों या बूथों को दर्शाता है; सामान्य हिन्दी में 'झोंपड़ियाँ' प्रसंग के लिए सुबोध है।
- source_word: አግብርቲሁ
  choice: अपने सेवकों
  rationale: स्वामित्वसूचक प्रत्यय और बहुवचन संज्ञा दोनों को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: पर्व-संबंधी अतिरिक्त वाक्यांश
  choice: केवल उपलब्ध गीइज़ पाठ का अनुवाद किया गया है
  alternative: पिछले पद से 'उसने सात दिन आनन्द का पर्व मनाया' जोड़ना अथवा बाद की पांडुलिपीय सामग्री जोड़ना
  rationale: दिए गए मूल-पाठ में ये शब्द नहीं हैं; पद-संरेखण की समस्या को अनुवाद में चुपचाप पूरा करना स्रोत से बाहर की सामग्री जोड़ देता।
- issue: मूल पाठ का वाक्य-खंड से आरम्भ होना
  choice: आरम्भिक पदबंध को यथावत एक वाक्य-खंड के रूप में रखा गया
  alternative: पिछले पद की क्रिया जोड़कर इसे पूर्ण वाक्य बनाना
  rationale: उपलब्ध गीइज़ अंश पूर्ववर्ती कथन से जुड़ा हुआ प्रतीत होता है। कृत्रिम क्रिया जोड़ने के बजाय वास्तविक पाठ-संरेखण का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। स्रोत का आरम्भिक अपूर्ण वाक्य जानबूझकर सुरक्षित रखा गया है; अनिश्चित पद-संरेखण को अनुमान से नहीं भरा गया।
