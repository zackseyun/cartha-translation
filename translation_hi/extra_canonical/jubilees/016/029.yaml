base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/029.yaml
  text: Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths for seven days with joy in the seventh month, acceptable before the Lord.
translation:
  language: hi
  text: इसलिए स्वर्गीय पट्टिकाओं पर इस्राएल के विषय में यह ठहराया गया है कि वे सातवें महीने में सात दिन तक आनन्द के साथ झोंपड़ियों का पर्व मनाएँ, जो प्रभु के सामने ग्रहणयोग्य हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: बहुवचन ‘पट्टिकाओं’ और स्वर्ग-संबंधी विशेषण को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: በዓለ፡ መጸለት
  choice: झोंपड़ियों का पर्व
  rationale: यह इस्राएली Feast of Booths का प्रचलित, अर्थ-स्पष्ट हिन्दी नाम है; ‘መጸለት’ अस्थायी आश्रयों/झोंपड़ियों की ओर संकेत करता है।
- source_word: በፍሥሓ
  choice: आनन्द के साथ
  rationale: स्रोत के उल्लास और आनन्द के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘይትወከፍ
  choice: जो ... ग्रहणयोग्य हो
  rationale: स्वीकृत या प्रसन्नतापूर्वक ग्रहण किए जाने के भाव को बचाते हुए वाक्य को पर्व के साथ जोड़ा गया है।
- source_word: በቅድመ፡ እግዚአብሔር
  choice: प्रभु के सामने
  rationale: दैवी उपस्थिति के स्थानिक/न्यायिक भाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: ग्रहणयोग्यता का व्याकरणिक संबंध
  choice: ‘जो प्रभु के सामने ग्रहणयोग्य हो’ को पर्व-पालन से संबद्ध रखा
  alternative: इस्राएलियों को स्वयं प्रभु के सामने ग्रहणयोग्य कहना
  rationale: स्रोत का संबंध कुछ संक्षिप्त और संभावित रूप से अस्पष्ट है; निकटतम पूर्ववर्ती पर्व-पालन से जोड़ना अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है और अनावश्यक धर्मवैज्ञानिक निष्कर्ष से बचता है।
- issue: स्वर्गीय पट्टिकाओं पर विधान
  choice: ‘यह ठहराया गया है’
  alternative: ‘यह लिखा गया है’
  rationale: ተሠርዐ में नियत/व्यवस्थित किए जाने का भाव प्रमुख है; केवल लेखन का भाव देना विधानात्मक बल को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘झोंपड़ियों का पर्व’ सांस्कृतिक पद को स्पष्ट रखता है और ‘स्वर्गीय पट्टिकाएँ’ ग्रंथ की विशिष्ट कल्पना को संरक्षित करता है।
