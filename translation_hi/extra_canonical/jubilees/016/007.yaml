  yaml_path: translation/extra_canonical/jubilees/016/007.yaml
  text: But Lot we saved, because God remembered Abraham and brought him out from the midst of the overthrow.
translation:
  language: hi
  text: परन्तु हमने लूत को बचा लिया, क्योंकि परमेश्वर ने अब्राहम को स्मरण किया और लूत को विनाश के बीच से निकाल लाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናድኅኖ
  choice: हमने ... बचा लिया
  rationale: गीज़ का प्रथम पुरुष बहुवचन रूप स्पष्ट रूप से उद्धार या बचाने की क्रिया व्यक्त करता है; ‘बचा लिया’ स्वाभाविक हिन्दी में सफलतापूर्वक बचा निकालने का भाव देता है।
- source_word: ተዘከሮ
  choice: स्मरण किया
  rationale: यह स्रोत की स्मरण करने वाली क्रिया को औपचारिक और बाइबलीय गरिमा के साथ रखता है, बिना इसे केवल मानसिक याद या कृपापूर्ण हस्तक्षेप के रूप में सीमित किए।
- source_word: አውፅኦ
  choice: उसे ... निकाल लाया
  rationale: क्रिया का अर्थ बाहर निकालना है; हिन्दी में ‘उसे’ का संकेत लूत की ओर है और वाक्य को स्पष्ट बनाता है।
- source_word: እማእከለ
  choice: के बीच से
  rationale: यह ‘मध्य में से’ के स्थानिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: लूत के बचाव और अब्राहम के स्मरण के बीच कारण-संबंध
  choice: क्योंकि
  alternative: इसलिए कि / जब
  rationale: स्रोत का እስመ कारण बताता है; ‘क्योंकि’ इस संबंध को स्पष्ट रखता है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
- issue: ‘परमेश्वर ने अब्राहम को स्मरण किया’ का अर्थ
  choice: शाब्दिक धार्मिक तनाव बनाए रखा
  alternative: परमेश्वर ने अब्राहम की प्रार्थना/वाचा को याद किया
  rationale: स्रोत केवल अब्राहम को स्मरण करने की बात कहता है; प्रार्थना या वाचा जोड़ना व्याख्यात्मक विस्तार होता।
- issue: ‘निकाल लाया’ का कर्म
  choice: ‘उसे’ जोड़कर लूत को स्पष्ट किया
  alternative: कर्म को अनुक्त छोड़ना
  rationale: स्रोत के क्रियारूप में पुरुषवाचक एकवचन कर्म निहित है; हिन्दी में सर्वनाम देना स्वाभाविक और अर्थानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली। ‘परन्तु’, ‘स्मरण किया’ और ‘विनाश’ औपचारिकता बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
