base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/013.yaml
  text: And he did to Sarah as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham; on the feast of the firstfruits of the harvest, he was born.
translation:
  language: hi
  text: और उसने सारा के लिए वैसा ही किया जैसा उसने कहा था। वह गर्भवती हुई और उसने तीसरे महीने में, महीने के मध्य में, उस समय एक पुत्र को जन्म दिया जिसके बारे में प्रभु ने अब्राहम से कहा था; कटनी की पहली उपज के पर्व पर वह जन्मा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ላቲ
  choice: उसने सारा के लिए ... किया
  rationale: गीज़ पदबंध का निकट और स्वाभाविक हिन्दी रूप; आरम्भ में उल्लिखित सारा को स्पष्ट रखा गया है।
- source_word: በመንፈቀ፡ ወርኅ
  choice: महीने के मध्य में
  rationale: समय-सूचक पदबंध का सीधा अर्थ सुरक्षित रखता है।
- source_word: በበዓለ፡ ቀዳሜ፡ ማእረር
  choice: कटनी की पहली उपज के पर्व पर
  rationale: पर्व और कटनी की प्रथम उपज—दोनों अर्थ-घटकों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ተወልደ
  choice: वह जन्मा
  rationale: मूल में इसहाक का नाम नहीं, बल्कि पुल्लिंग एकवचन क्रिया है; निकटवर्ती ‘पुत्र’ से संदर्भ स्पष्ट है।
theological_decisions:
- issue: जन्मे हुए पुत्र की पहचान
  choice: ‘वह जन्मा’ रखा गया, नाम नहीं जोड़ा गया
  alternative: ‘इसहाक जन्मा’
  rationale: संदर्भ इसहाक की पहचान कराता है, पर इस पद के गीज़ पाठ में नाम स्पष्टतः नहीं है; इसलिए मूल की अभिव्यक्ति और उसकी निहितता सुरक्षित रखी गई।
- issue: ‘प्रभु ने कहा था’ का विषय
  choice: ‘जिसके विषय में प्रभु ने अब्राहम से कहा था’
  alternative: ‘जिस समय के बारे में प्रभु ने अब्राहम से कहा था’
  rationale: सम्बन्धवाचक अभिव्यक्ति मूल में कुछ संक्षिप्त है; हिन्दी में इसे ‘समय’ से जोड़ा गया है, बिना कथन की विषयवस्तु को अनावश्यक रूप से निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-विन्यास में मूल की कालानुक्रमिक गति और पर्व-संबंधी सूचना सुरक्षित रखी गई है।
