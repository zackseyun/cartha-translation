  text: at this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he offered, day by day, on the altar to the Lord two oxen, two rams, seven sheep, one male goat for a sin offering,
translation:
  language: hi
  text: इस पर्व के समय[a] वह पृथ्वी पर झोंपड़ियों का पर्व मनाने वाला पहला व्यक्ति था। इन सात दिनों में उसने प्रतिदिन वेदी पर प्रभु को दो बैल, दो मेढ़े, सात भेड़ें और पापबलि के लिए एक बकरा चढ़ाया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस पर्व के लिए।”
    reason: मूल पूर्वसर्ग समय (‘के समय/में’) अथवा संबंध/उद्देश्य (‘के लिए’) का भाव दे सकता है।
  - marker: b
    text: या, “प्रतिदिन वेदी पर ले आया।”
    reason: मूल क्रिया का शाब्दिक अर्थ ‘निकट लाना/प्रस्तुत करना’ है, जबकि बलिदानी संदर्भ में ‘चढ़ाना’ अपेक्षित अर्थ है।
lexical_decisions:
- source_word: በዛቲ፡ በዓል
  choice: इस पर्व के समय
  rationale: पूर्वसर्ग በ यहाँ समय-संबंधी अर्थ ‘के समय/में’ देता है; यह पद संभवतः पिछले वाक्य की बात को आगे बढ़ाता है।
- source_word: በዓለ፡ መጻላት
  choice: झोंपड़ियों का पर्व
  rationale: መጻላት अस्थायी छायादार आश्रयों/झोंपड़ियों को सूचित करता है; आधुनिक हिन्दी में यह नाम स्पष्ट और स्वाभाविक है।
- source_word: ያቀርብ
  choice: चढ़ाया
  rationale: मूल क्रिया का आधारभूत अर्थ ‘निकट लाना/प्रस्तुत करना’ है, पर बलिदानी और वेदी-संबंधी प्रसंग में हिन्दी का स्वाभाविक समतुल्य ‘चढ़ाना’ है।
- source_word: መሐስአ፡ ጠሊ፡ አሐደ
  choice: एक बकरा
  rationale: पशु नर बकरी है; ‘बकरा’ आधुनिक हिन्दी में लिंग को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: በእንተ
  choice: के लिए
  rationale: खंड के अंत में आया पद अगले भाव, ‘पापबलि’, से जुड़ता है; उपलब्ध पाठ और प्रामाणिक परामर्श-पाठ के आधार पर उद्देश्यसूचक रूप रखा गया है।
theological_decisions:
- issue: दैवी नाम እግዚአብሔር का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: इस साहित्यिक और बलिदानी संदर्भ में व्यक्तिगत ईश्वरीय नाम को स्पष्ट रखने के लिए ‘यहोवा’ चुना गया; ‘प्रभु’ भी शाब्दिक परंपरा में संभव है, पर वह नाम और उपाधि का भेद कम स्पष्ट करता है।
- issue: ያቀርብ को बलिदानी तकनीकी शब्द मानना
  choice: चढ़ाया
  alternative: ले आया/प्रस्तुत किया
  rationale: वेदी और पशुबलियों की सूची यह स्पष्ट करती है कि क्रिया बलिदान अर्पित करने के अर्थ में प्रयुक्त है; इससे कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज धार्मिक गद्य। ‘झोंपड़ियों का पर्व’, ‘वेदी’ और ‘पापबलि’ जैसे स्थापित किन्तु सामान्य पाठक के लिए बोधगम्य पद रखे गए हैं। पद स्रोत में अधूरे वाक्य पर समाप्त होता है, इसलिए अंत में अल्पविराम सुरक्षित रखा गया है।
