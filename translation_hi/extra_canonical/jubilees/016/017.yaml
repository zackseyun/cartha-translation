  text: And we blessed him and told him everything that had been decreed concerning him, that he would not die until he had begotten six more sons and seen them before he died; but in Isaac his name and seed would be called.
translation:
  language: hi
  text: 'और हमने उसे आशीर्वाद दिया और उसे वह सब बताया जो उसके विषय में ठहराया गया था: वह तब तक नहीं मरेगा, जब तक वह छह और पुत्र उत्पन्न न कर ले और मरने से पहले उन्हें देख न ले; पर इसहाक के माध्यम से उसका नाम और वंश कहलाएगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረክናሁ
  choice: हमने उसे आशीष दी
  rationale: क्रिया का सीधा और स्वाभाविक हिन्दी रूप; कथावाचक बहुवचन को सुरक्षित रखता है।
- source_word: ኵሎ፡ ዘተአዘዘ፡ ሎቱ
  choice: वह सब जो उसके विषय में ठहराया गया था
  rationale: आदेश/निर्धारण के भाव को निष्क्रिय रूप में रखता है और यह नहीं तय करता कि प्रत्यक्ष कर्ता कौन था।
- source_word: ስድስተ፡ ውሉደ
  choice: छह और पुत्र
  rationale: संदर्भ में अब्राहम से आगे उत्पन्न होने वाले छह पुत्र अभिप्रेत हैं; 'और' कथ्य के भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት
  choice: और मरने से पहले उन्हें देख न ले
  rationale: देखने का निहित कर्म ठीक पहले उल्लिखित छह पुत्र हैं; 'इसहाक के पुत्र' जैसी असमर्थित स्पष्टता नहीं जोड़ी गई।
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: पर इसहाक में उसका नाम और वंश कहलाएगा
  rationale: स्रोत की असामान्य पर धर्मवैचारिक रूप से महत्वपूर्ण अभिव्यक्ति को बिना अर्थ संकुचित किए निकटता से रखा गया है।
theological_decisions:
- issue: इसहाक में नाम और वंश के कहलाने का आशय
  choice: पर इसहाक में उसका नाम और वंश कहलाएगा
  alternative: पर उसका नाम और वंश इसहाक के द्वारा आगे चलेगा
  rationale: वैकल्पिक रूप अर्थ की व्याख्या कर देता है, जबकि स्रोत का 'में ... कहलाएगा' संबंध और बुलाए जाने—दोनों की संभावित अर्थछायाएँ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। वाक्य की भविष्यवाणीय गंभीरता और स्रोत की धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
