id: JUB.16.17
reference: Jubilees 16:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: charles_1895
  language: Geez
  text: '1. ፀንሰት፡* ወልደ።* ወተመየጥነ፡ በወርኅ፡ ሳብዕ፡ ወረከብናሃ፡ ለሳራ፡ ፀንሰተ፡* ቅድሜነ፡ ወባ ረክናሁ፡* ወዜነውናሁ፡* *ኵሎ፡ ዘተአዘዘ፡* ሎቱ፡ ከመ፡ ኢይመውት፡ *እስከ፡ ይወልድ፡ ፮ዲ፡* ስድስተ፡ ውሉደ፡ ወይሬኢ፡* ዘእንበለ፡ ይመት፡ ወበይስሐቅ፡* ይጼዋዕ፡ ሎቱ፡* ስም፡ ወዘርአ።*

    2. ወስሐቀት፡ ሳራ፡ እስመ፡ ሰምዐት፡ ከመ፡ ተናገርነ፡ ዘንተ፡ ቃለ፡ ምስለ፡ አብርሃም፡ ወዘለፍናሃ፡

    3. ወፈርት፡ ወሐሰወት፡ ከመ፡ ስሐቀት፡ በእንተ፡ ቃል። ወነገርናሃ፡ ስሞ፡ ለወልዳ፡ በከመ፡ ሥሩዕ፡

    4. ወጽሑፍ፡ ስሙ፡ ውስተ፡ ጽላተ፡ ሰማይ፡ ይስሐቅ። ወአመ፡ ገባእነ፡ ኀቤሃ፡ በጊዜ፡ ሰዓት፡ ወይእቲ፡

    5. ፀንሰት፡ ወልደ። ወበዝ፡ ወርኅ፡ ገብረ፡ እግዚአብሔር፡ ዘነኒሆሙ፡ ለሰዶም፡ ወለገሞራ፡ *ወለዶም፡ ወለኵሉ፡ አደያመ፡* ዮርዳኖስ፡ ወአውዐዮሙ፡ በእሳት፡ ወበተይ፡ ወአጥፍኦሙ፡* እስከ፡ ዛቲ፡* ዕለት፡ በከመ፡ ናሁ፡ አይዳዐኩ፡ ኵሎ፡* ምግባሮሙ፡ ከመ፡ ፀዋጋን፡ ወኃጥኣን፡ ጥቀ፡

    6. ወይትራኩሱ፡ ወይዜምዉ፡* በሥጋሆሙ፡ ወይገብሩ፡ ርኵሰ፡ በዲበ፡ ምድር። ወከማሁ፡ ይገብር፡ እግዚአብሔር፡ ኵነኔ፡ በመካናት፡ *በዋእደ፡ ገብሩ፡* በከመ፡ ርኵሶሙ፡ ለሰዶም፡ ከመ፡ ኰነና፡*

    7. ለሰዶም፡* ወለሎጥ፡ ናድኅኖ፡ እስመ፡ ተዘከሮ፡ እግዚአብሔር፡ ለአብርሃም፡ ወአውፅኦ፡ እማእከለ፡

    8. ገፍታአ። ወገብረ፡ ውእቱኒ፡ ወአዋልዲሁኒ፡ ኀጢአተ፡ ዲበ፡* ምድር፡ ዘአኮ፡ ዲበ፡ ምድር፡*

    9. እመዋዕለ፡ አዳም፡ እስከ፡ አሜሁ፡ እስመ፡ በከበ፡ ብእሲ፡ ምስለ፡ አዋልዲሁ።* ወናሁ፡ ተአዘዘ፡ ወተቈረጸ፡* ላዕለ፡ ኵሉ፡* ዘርአ፡ *ውስተ፡ ጽላተ፡ ሰማይ፡* ከመ፡ ያአትትሙ፡ ወከመ፡ ይሠርዎሙ፡ ወከመ፡ ይገበር፡ *ኵነኔሆሙ፡ በከመ፡* ኵነኔ፡ ሰዶም፡ ወከመ፡ ኢያትርፍ፡ ሎቱ፡* ኵሎ፡ ዘርአ፡ ውስተ፡*

    10. ምድር፡ ዘሰብአ፡ በዕለት፡ ይደን። ወበዝንቱ፡ ወርኅ፡ ፯ዐዘ፡ አብርሃም፡ እምነ፡ ኬብሮን፡ ወሖረ፡

    11. ወኀደረ፡ ማእከለ፡ ቃዴስ፡ ወሱር፡ ውስተ፡ አደባረ፡* ጌራሮን። ወበመንፈቀ፡ ወርኅ፡ ኃምስ፡ ፯ዐዘ፡

    12. እምህየ፡ ወኀደረ፡ ኀበ፡ ዐዘቅት፡ መሐላ። ወበመንፈቀ፡ ወርኅ፡ ሳድስ፡ ሐወጻ፡* እግዚአብሔር፡

    13. ለሳራ፡ ወገብረ፡ ላቲ፡ በከመ፡ ይቤ። ወፀንሰት፡ ወወለደት፡ ወልደ፡ በወርኅ፡ ሣልስ፡ ወበመንፈቀ፡ ወርኅ፡ በመዋዕለ፡ ዘይቤሎ፡ እግዚአብሔር፡* ለአብርሃም፡ በበዓለ፡ ቀዳሜ፡* ማእረር፡ ተወልደ፡

    14. ይስሐቅ። ወከበቦ፡ አብርሃም፡ ለወልዱ፡* *እመ፡ ሳምንት፡* ውእቱ፡ ቀዳሚ፡ ተከበበ፡ በከመ፡

    15. *ኪዳን፡ እንተ፡* ተሠርዐት፡ ለዓለም። ወበዓመት፡ ሳድስ፡ ዘሱባዔ፡ ራብዕ፡ ወጻእነ፡ ኀበ፡ አብርሃም፡ ኀበ፡ ዐዘቅተ፡ መሐላ፡ ወአስተርአይናሁ፡ በከመ፡ ንቤላ፡ ለሳራ፡ ከመ፡ ንገብአ፡* ኀቤሃ፡ ወይእቲኒ፡*

    18. ይስሐቅኒ፡ አሐዱ፡ ይከውን፡ ለዘርእ፡ ቅዱስ፡ ወውስተ፡ አሕዛብኒ፡'' ኢይትኌለቍ፡'' እስመ፡ ለመክፈልተ፡ ልዑል፡ ይከውን፡ ወውስተ፡ ዘይመልከ፡'' አምላክ፡ ወረደ፡ ኵሉ፡ ዘርኡ፡ ከመ፡ ይኩን፡ ለእግዚአብሔር፡ *ሕዝበ፡ ትርሲት፡'' እምኵሉ፡ ሕዝብ፡'' ወከመ፡ ይኩን፡ መንግሥተ፡

    19. ዘክህነት፡'' ወሕዝበ፡ ቅዱሰ። ወሖረ፡ ፍኖተ፡ ወከዐወ፡ ናላ፡ ለባሬ፡ ኵሉ፡ ዘነገርናሁ፡'' ወተፈሥሐ፡

    21. በቅሩበ፡ ምሥዋዕ፡ *ዘሐነጸ፡ ኀበ፡''° *ዐዘቅተ፡ መሐላ።'''' ወሐነጸ፡ ምጽላላተ፡ ሎቱ፡ ወለአግብርቲሁ፡

    22. በዛቲ፡ በዓል፡ ወውእቱ፡ መቅድመ፡ ገብረ፡ በዓለ፡ መጻላት፡''፪ በዲበ፡ ምድር። ወበዝ፡ ሰቡዕ፡ መዋዕል፡ ሀሎ፡ ያቀርብ፡ ኵሎ፡ ዕለተ፡ በበ፡ ዕለት፡ ውስተ፡ *ምሥዋዐ፡ ጽንሓሕ፡''፫ ለእግዚአብሔር፡ አልህምተ፡ ክልኤተ፡ ወአብሐኩ፡''፬ ክልኤተ፡ ወአባግዐ፡ ሰብዐተ፡ መሐስአ፡ ጠሊ፡ አሐደ፡ በእንተ፡

    23. ኀጢአት፡ ከመ፡ ያስተስሪ፡ ቦቱ፡ በእንቲአሁ፡ ወበእንተ፡ ዘርኡ። ወለመሥዋዕተ፡ መድኀኒት፡ አብሐኩ፡ ሰብዐተ፡ ወመሐስአ፡ ሰብዐተ፡ ወአባግዐ፡ ሰብዐተ፡ ወደቤላት፡ ሰብዐተ፡ ወመሥዋዕቶሙኒ፡ ወቍጻጼቶሙኒ፡ ወስቡሖ፡''፭ ሥብሖሙ፡ የዐጥን፡''፮ በዲበ፡ ምሥዋዕ፡ ጽንሓሐ፡ *ኅሩየ፡ ለእግዚአ

    24. ብሔር፡''፯ ለመዐዛ፡ ሠናይ። ወበጽባሕ፡ ወሰርክኒ፡''፰ የዐጥን፡ እፈወ፡''፱ ስኂነ፡ ወቅንአተ፡ ወማየ፡ ልብን፡ ወናርድስ፡ ወከርቤ፡ ወሰንበልተ፡ ወኵስተ፡''° ሰብዐቲሆሙ፡ ዘንተ፡ ኵሉ፡'''' ያቀርብ፡

    25. ውእቱ፡ ዐሩየ፡ ትዐፅዮ፡''፪ ድሙረ፡ ንጹሐ። ወገብረ፡ ዘንተ፡ በዓለ፡''፫ ሰቡዐ፡ መዋዕለ፡ እንዘ፡ ይትፌሣሕ፡ በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ፡ ውእቱ፡ ወኵሎሙ፡ እለ፡ ውስተ፡''፬ ቤቱ፡ ወአልቦ፡

    26. መነኒ፡ ነኪረ፡ ምስሌሁ፡''፭ ወኵሉ፡ ዘአኮ፡ ክሱበ። ወባረኮ፡ ለፈጣሪሁ፡ ዘፈጠሮ፡ በትዝምዱ፡''፮ እስመ፡''፯ በሥምረቱ፡''፰ ፈጠሮ፡''፱ እስመ፡ አእመረ፡ ወጠየቀ፡ ከመ፡ እምኔሁ፡ ይከውን፡ ተከለ፡ ጽድቅ፡ ለትውልድ፡ ዘለዓለም፡ ወእምኔሁ፡ ዘርእ፡ ቅዱስ፡ ከመ፡ ይኩን፡''፳ ከማሁ፡ ለዘገብረ፡

    27. ኵሎ። ወባረከ፡''፩ ወተፈሥሐ፡ *ወጸውዐ፡ ስማ፡''፪ ለዛቲ፡ በዓል፡ በዓለ፡ እግዚአብሔር፡''፫ ፍሥሓ፡

    28. ክልኤሆሙ፡ ፍሥሓ፡ ዐቢየ፡ ጥቀ። ወሐነጸ፡ በህየ፡ ምሥዋዐ፡ ለእግዚአብሔር፡ ዘባረኮ፡ ወለዘ *ያስተፈሥሖ፡'' በምድረ፡ ፍልሰቱ፡'' ወገብረ፡ በዓለ፡ ፍሥሓ፡ በዝ፡ ወርኅ፡ ሰቡዐ፡ መዋዕለ፡

    29. በእንተዝ፡ ተሠርዐ፡ ውስተ፡ ጽላተ፡ ሰማይ፡ ላዕለ፡ እስራኤል፡ ከመ፡ ይኩኑ፡ ገበርያኮ፡ በዓለ፡ መጸለት፡ ሰቡዐ፡ መዋዕለ፡ በፍሥሓ፡ በወርኅ፡ ሳብዕ፡ ዘይትወከፍ፡ በቅድመ፡ እግዚአብሔር፡

    30. ሕገ፡ ዘለዓለም፡ በትውልዶሙ፡ በኵሉ፡ ዓመት፡ ወዓመት። ወአልቦ፡ ለዝንቱ፡ ወሰነ፡ መዋዕል፡ እስመ፡ ለዓለም፡ ውእቱ፡ ሥሩዕ፡ ላዕለ፡ እስራኤል፡ ከመ፡ ይግበርዎ፡ ወይነበሩ፡ ውስተ፡ ምጽላል፡ ወከመ፡ ይንበሩ፡ አክሊላተ፡ ውስተ፡ ርእሶሙ፡ ወከመ፡ ይንሥኡ፡ ዐጽቀ፡ ቈጽል፡ ውኩሓ፡

