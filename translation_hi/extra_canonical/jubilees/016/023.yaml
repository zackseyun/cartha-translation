  yaml_path: translation/extra_canonical/jubilees/016/023.yaml
  text: to make atonement for sin by it, for himself and for his seed. And for a sacrifice of well-being, seven rams, seven kids, seven sheep, and seven male goats, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.
translation:
  language: hi
  text: उसके द्वारा अपने और अपने वंश के लिए पाप का प्रायश्चित करने के लिए। और मेलबलि के रूप में सात मेढ़े, सात बकरी के बच्चे, सात भेड़ें और सात बकरे, साथ ही उनकी अन्नबलियाँ और पेयबलियाँ। उसने उनकी सारी चरबी वेदी पर जलाई—यहोवा के लिए सुखद सुगंध देनेवाली उत्तम भेंट के रूप में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀጢአት፡ ከመ፡ ያስተስሪ፡ ቦቱ
  choice: उसके द्वारा पाप का प्रायश्चित करने के लिए
  rationale: ‘पाप’ को प्रायश्चित का विषय और ቦቱ को साधनवाचक ‘उसके द्वारा’ रखते हुए गीइज़ वाक्य-विन्यास की अस्पष्ट पूर्वसंदर्भता सुरक्षित रखी गई है।
- source_word: መሥዋዕተ፡ መድኀኒት
  choice: मेलबलि
  rationale: यह बलि-श्रेणी शांति/कल्याण से संबंधित है; हिन्दी बाइबलीय प्रयोग में ‘मेलबलि’ संक्षिप्त और सहज है।
- source_word: አብሐኩ
  choice: मेढ़े
  rationale: स्रोत-समीक्षा के अनुसार यह मेढ़ों का बहुवचन है, न कि बैलों का।
- source_word: መሐስአ
  choice: बकरी के बच्चे
  rationale: इस संदर्भ में ‘kids’ का स्वाभाविक हिन्दी रूप; ‘बछड़े’ की संभावित व्यापकता से बकरी-वर्ग का आशय अधिक स्पष्ट है।
- source_word: አባግዐ
  choice: भेड़ें
  rationale: सामूहिक पशु-संज्ञा को सामान्य हिन्दी बहुवचन में रखा गया है।
- source_word: ደቤላት
  choice: बकरे
  rationale: नर बकरों को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: መሥዋዕቶሙኒ፡ ወቍጻጼቶሙኒ
  choice: उनके अन्नबलि और अर्घ
  rationale: बलियों के साथ दी जाने वाली grain offerings और drink offerings के मानक धार्मिक अर्थ को संक्षेप में व्यक्त किया गया है।
- source_word: ጽንሓሐ፡ ኅሩየ፡ ለእግዚአ
  choice: यहोवा के लिए चुनी हुई भेंट
  rationale: ‘choice offering to the Lord’ का निकट और गरिमापूर्ण रूप; ईश-नाम के लिए प्रचलित हिन्दी बाइबलीय ‘यहोवा’ अपनाया गया है।
theological_decisions:
- issue: प्रायश्चित का संबंध पाप, व्यक्ति और वंश से
  choice: ‘उसके द्वारा पाप का प्रायश्चित करने के लिए—अपने और अपने वंश के लिए’
  alternative: ‘पाप के लिए, अपने और अपने वंश का प्रायश्चित करने के लिए’
  rationale: स्रोत में ‘पाप’ क्रिया का विषय/लक्ष्य है और ቦቱ (‘उसके द्वारा’) भी उपस्थित है; चुना हुआ रूप इस संबंध को बिना सिद्धान्तगत पुनर्व्याख्या के बनाए रखता है।
- issue: መሥዋዕተ መድኀኒት का बलिदानी अर्थ
  choice: मेलबलि
  alternative: कल्याण-बलि / शांति-बलि
  rationale: ‘मेलबलि’ आधुनिक हिन्दी पाठकों के लिए बाइबलीय रूप से परिचित है और बलि को केवल निजी स्वास्थ्य या उद्धार की भेंट समझने से बचाता है।
- issue: सुखद सुगंध की भाषा
  choice: सुखद सुगंध के लिए
  alternative: मनभावनी सुगंध के रूप में
  rationale: ईश्वर के प्रति स्वीकार्य बलि की पारंपरिक रूपकात्मक भाषा को बरकरार रखा गया है, उसे शाब्दिक दैहिक आवश्यकता की तरह नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज धार्मिक शैली। पशु-सूची में स्रोत-समीक्षा के अनुसार मेढ़े, बकरी के बच्चे, भेड़ें और बकरे रखे गए हैं। उपलब्ध गीइज़ अंश वाक्य के बीच से आरम्भ होता है, इसलिए ‘उसके द्वारा’ का पूर्वसंदर्भ जानबूझकर अनिर्दिष्ट रखा गया है।
