base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/026.yaml
  text: And he blessed his Creator, who had created him in his generation, because He had created him according to His good pleasure; for he knew and perceived that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might be like Him who made all things.
translation:
  language: hi
  text: और उसने अपने सृष्टिकर्ता को धन्य कहा, जिसने उसकी पीढ़ी में उसे रचा था, क्योंकि उसने उसे अपनी प्रसन्न इच्छा के अनुसार रचा था। वह जानता और समझता था कि उससे सदा की पीढ़ियों के लिए धार्मिकता का एक पौधा निकलेगा, और उससे एक पवित्र वंश निकलेगा, ताकि वह उसके समान हो जिसने सब कुछ बनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትዝምዱ፡
  choice: उसकी पीढ़ी में
  rationale: मूल पद के पीढ़ी/समकालीन अवस्था-संबंधी भाव को निकटता से रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: በሥምረቱ፡
  choice: अपनी प्रसन्न इच्छा के अनुसार
  rationale: यह अभिव्यक्ति इच्छा और प्रसन्नता, दोनों के भाव को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: ወጠየቀ፡
  choice: और उसने समझ लिया था
  rationale: አእመረ ('जान गया') के साथ आए इस समानांतर क्रियापद के स्पष्ट बोध/निश्चय के भाव को व्यक्त करता है।
- source_word: ተከለ፡ ጽድቅ፡
  choice: धार्मिकता का एक पौधा
  rationale: मूल के वनस्पति-रूपक को सुरक्षित रखते हुए उसके नैतिक-धार्मिक अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ዘርእ፡ ቅዱስ፡
  choice: एक पवित्र वंश
  rationale: זרע-सदृश 'बीज/संतान' की सामूहिक वंशगत धारणा के लिए आधुनिक हिन्दी में 'वंश' अधिक स्वाभाविक है।
- source_word: ኵሎ።
  choice: सब कुछ
  rationale: स्रोत के अंतिम शब्द का समावेश करता है; इसे छोड़ना पाठगत रूप से अनुचित होगा।
theological_decisions:
- issue: पवित्र वंश के सृष्टिकर्ता के समान होने का कथन
  choice: ताकि वह उसके समान हो जिसने सब कुछ बनाया
  alternative: ताकि वह उस सबके समान हो जिसे उसने बनाया
  rationale: वाक्यरचना में 'उसके समान' का निकटतम और पारंपरिक संदर्भ 'जिसने सब कुछ बनाया' है; फिर भी हिन्दी में पद की संक्षिप्तता और मूल का तनाव बनाए रखा गया है, बिना समानता का स्वरूप समझाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'धार्मिकता का पौधा' जैसे मूल रूपक को सरल व्याख्या से प्रतिस्थापित नहीं किया गया। सर्वनामों को देववाचक सम्मानसूचक बड़े अक्षरों से अलग चिह्नित नहीं किया गया, क्योंकि देवनागरी में यह स्वाभाविक परंपरा नहीं है।
