  text: And Abraham circumcised his son on the eighth day; he was the first to be circumcised according to the ordinance ordained forever.
translation:
  language: hi
  text: और अब्राहम ने अपने पुत्र इसहाक का आठवें दिन खतना किया। इसहाक वह पहला व्यक्ति था जिसका खतना उस विधि के अनुसार किया गया था, जो सदा के लिए निर्धारित की गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከበቦ / ተከበበ
  choice: खतना किया / खतना पाने वाला
  rationale: क्रिया के कर्तृवाच्य और कर्मवाच्य रूपों को क्रमशः स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: እመ ሳምንት
  choice: आठवें दिन
  rationale: यह आठ दिन की आयु नहीं, जन्म के बाद आठवें दिन किए जाने वाले खतने का प्रचलित काल-सूचक रूप है।
- source_word: በከመ
  choice: के अनुसार
  rationale: यह पद रीति या मानक के अनुरूप होने का भाव देता है और आगे आने वाले ‘विधि’ संबंधी खंड से जुड़ता है।
- source_word: ሥርዓት
  choice: विधि
  rationale: ‘व्यवस्था’, ‘नियम’ और ‘विधान’ संभव हैं; यहाँ स्थापित धार्मिक आदेश के लिए ‘विधि’ स्पष्ट और सहज है।
- source_word: ለዘለዓለም
  choice: सदा के लिए
  rationale: स्थायी अवधि के अर्थ को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पहला’ होने का आशय
  choice: वह ... खतना पाने वाला पहला व्यक्ति था
  alternative: वह इस प्रकार खतना पाने वाला पहला व्यक्ति था
  rationale: पाठ के कथन को यथावत रखा गया है; इसका आशय यह समझकर नहीं बदला गया कि वह हर अर्थ में इतिहास का पहला खतना पाया हुआ व्यक्ति था। संदर्भतः यह निर्धारित आठवें दिन और स्थायी विधि के अनुसार खतने की ओर संकेत करता है।
- issue: स्थायी आदेश का वर्णन
  choice: जो सदा के लिए ठहराई गई थी
  alternative: जो सदा के लिए निर्धारित की गई थी
  rationale: स्रोत के निष्क्रिय क्रियारूप और स्थायित्व को बनाए रखा गया है, बिना उसकी बाद की धार्मिक प्रयोज्यता पर कोई सांप्रदायिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। ‘अपने पुत्र’ स्रोत के संबंधसूचक पद का अनुसरण करता है; आरंभ में उपलब्ध ‘इसहाक’ संभवतः पिछले वाक्य का अंतिम शब्द है, इसलिए अंग्रेज़ी परामर्श-पाठ और वाक्य-संरचना के अनुसार इसे इस पद में नाम के रूप में नहीं दोहराया गया। उपलब्ध अंश के कटे हुए अंत को पूर्ण आलोचनात्मक पाठ में प्रमाणित ‘सदा के लिए ठहराई गई विधि’ वाले खंड के आधार पर पूरा किया गया है।
