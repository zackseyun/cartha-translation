base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/009.yaml
  text: from the days of Adam until that time, because a man lay with his daughters. And behold, it was commanded and decreed concerning all his seed on the heavenly tablets, that he should remove them and uproot them, and that their judgment be executed like the judgment of Sodom, and that he should leave no seed of his on the earth on the day of condemnation.
translation:
  language: hi
  text: आदम के दिनों से लेकर उस समय तक[b], क्योंकि एक पुरुष अपनी बेटियों के साथ सोया था। और देखो, स्वर्गीय पट्टिकाओं पर उसके सारे वंश के विषय में आज्ञा दी गई और निर्णय ठहराया गया कि वह उन्हें मिटा दे और जड़ से उखाड़ दे, कि उनका न्याय सदोम के न्याय के समान किया जाए, और दण्ड के दिन वह पृथ्वी पर उसका कोई वंश न छोड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘वह’ का कर्ता नाम से नहीं बताया गया है; संबंधित क्रियाएँ पुल्लिंग एकवचन हैं।
    reason: कर्ता की वास्तविक व्याकरणिक अस्पष्टता को बनाए रखना।
  - marker: b
    text: शाब्दिक रूप से ‘उसके समय तक’ भी संभव है।
    reason: प्रत्यययुक्त कालवाचक पद के अधिक शाब्दिक विकल्प को दर्ज करना।
lexical_decisions:
- source_word: አሜሁ
  choice: उस समय
  rationale: यहाँ यह प्रत्यययुक्त रूप स्वाभाविक रूप से ‘तब/उस समय’ का कालवाचक अर्थ देता है; ‘उसके समय’ अत्यधिक शाब्दिक और अस्पष्ट होगा।
- source_word: ተአዘዘ፡ ወተቈረጸ
  choice: आज्ञा दी गई और निर्णय ठहराया गया
  rationale: दोनों निष्क्रिय क्रियाओं और उनके आदेशात्मक-न्यायिक युग्म को अलग-अलग बनाए रखता है।
- source_word: ያአትትሙ፡ ወ...ይሠርዎሙ
  choice: वह उन्हें मिटा दे और जड़ से उखाड़ दे
  rationale: मूल की दोनों पुल्लिंग एकवचन क्रियाओं तथा विनाश और समूल उच्छेद के क्रम को सुरक्षित रखता है।
- source_word: ይገበር፡ ኵነኔሆሙ
  choice: उनका न्याय ... किया जाए
  rationale: मूल की निष्क्रिय रचना को बनाए रखता है, न कि सक्रिय ‘वह उनका न्याय करे’।
- source_word: ኢያትርፍ፡ ሎቱ፡ ኵሎ፡ ዘርአ
  choice: वह ... उसका कोई वंश न छोड़े
  rationale: मूल की पुल्लिंग एकवचन सक्रिय क्रिया और पूर्ण निषेध दोनों को व्यक्त करता है।
theological_decisions:
- issue: उच्छेद करने वाली एकवचन क्रियाओं का कर्ता
  choice: मुख्य पाठ में केवल ‘वह’ रखा गया
  alternative: कर्ता को स्पष्ट रूप से ‘परमेश्वर’ कहना
  rationale: मूल में कर्ता नाम से व्यक्त नहीं है। एकवचन क्रियारूप सुरक्षित रखते हुए किसी निहित कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: सदोम के न्याय से तुलना
  choice: ‘उनका न्याय सदोम के न्याय के समान किया जाए’
  alternative: ‘वह उनका न्याय सदोम के समान करे’
  rationale: यह मूल की निष्क्रिय व्याकरणिक रचना और न्यायिक समानता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और न्यायिक लहजा रखा गया है। ‘स्वर्गीय पट्टिकाएँ’, ‘निर्णय ठहराया गया’, और ‘जड़ से उखाड़ दे’ स्रोत के प्रमुख बिंबों तथा व्याकरणिक भेदों को स्पष्ट रखते हैं।
