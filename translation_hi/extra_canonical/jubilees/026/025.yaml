translation:
  language: hi
  text: सदा के लिए। जो तुझे शाप दे, वह शापित हो, और जो तुझे आशीर्वाद दे, वह धन्य हो।” और ऐसा हुआ कि जब इसहाक अपने पुत्र याकूब को आशीर्वाद दे चुका था, और याकूब अपने पिता इसहाक के पास से निकल गया था, तब वह छिप गया;[a]
  philosophy: optimal-equivalence
  footnotes:
