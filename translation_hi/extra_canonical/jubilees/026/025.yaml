lexical_decisions:
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: गीज़ पदबंध की कालगत व्यापकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पिछले वाक्य से जुड़े खंड की प्रकृति बनाए रखता है।
- source_word: ዘይረግመከ፡ ርጉም
  choice: जो तुझे शाप दे, वह शापित हो
  rationale: मूल के शाप देने वाले और शापित होने के समानांतर शब्द-विन्यास तथा आशीर्वाद वाले अगले खंड से उसका संतुलन सुरक्षित रखता है।
- source_word: ዘይባርከከ፡ ቡሩክ
  choice: जो तुझे आशीर्वाद दे, वह आशीष पाए
  rationale: मूल के आशीर्वाद देने और धन्य होने के संबंध को सहज हिन्दी में रखता है; ‘आशीष पाए’ यहाँ परिणामसूचक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: አኅለቀ፡ እንዘ፡ ይባርኮ
  choice: आशीर्वाद दे चुका
  rationale: इसहाक द्वारा आशीर्वाद देने की क्रिया पूर्ण हो जाने का अर्थ संक्षिप्त और स्वाभाविक हिन्दी में देता है।
- source_word: ወፅአ
  choice: बाहर निकल गया
  rationale: गीज़ क्रिया के प्रत्यक्ष गति-अर्थ को बनाए रखता है।
theological_decisions:
- issue: शाप और आशीर्वाद के वचनों का व्याकरणिक बल
  choice: ‘वह शापित हो’ और ‘वह आशीष पाए’
  alternative: ‘वह शापित होगा’ और ‘वह धन्य होगा’
  rationale: मूल के संक्षिप्त विधेय रूप भविष्यवाणी और आशीर्वचन दोनों का रंग रख सकते हैं; हिन्दी में यह चयन आशीर्वचन-सदृश बल को सुरक्षित रखते हुए किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं बनाता।
- issue: खंड-अंत में याकूब के छिपने का विवरण
  choice: मुख्य पाठ में रखा गया और पाठगत टिप्पणी दी गई
  alternative: उपलब्ध उद्धृत गीज़ अंश के दृश्य अंत पर वाक्य अधूरा छोड़ देना
  rationale: प्रदत्त उद्धरण के अंतिम संपादकीय संकेत से पाठ के आगे जारी रहने का संकेत मिलता है, और संलग्न पाठ-इतिहास इस वाक्यांश को चार्ल्स तथा अन्य प्रमाण में पुष्ट बताता है; इसलिए इसे हटाना उपलब्ध स्रोत-साक्ष्य को अपूर्ण रूप से प्रस्तुत करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। संबोधन में ‘तुझे’ रखा गया है, क्योंकि यह एकवचन आशीर्वचन के निकट और स्वाभाविक है। बाइबिलीय नामों के प्रचलित हिन्दी रूप ‘इसहाक’ और ‘याकूब’ प्रयुक्त हुए हैं।
