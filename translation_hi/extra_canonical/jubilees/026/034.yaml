  text: shall be your dwelling[34], and from the dew of heaven above. And by your sword you shall live, and you shall serve your brother; and it shall be that when you rebel and remove the yoke from your neck, then you will commit a complete sin unto death,
translation:
  language: hi
  text: तेरा निवास होगा[a], और ऊपर के आकाश की ओस से। तू अपनी तलवार के बल पर जीवित रहेगा और अपने भाई की सेवा करेगा। पर जब तू विद्रोह करेगा[b] और अपनी गर्दन से जुआ उतार देगा, तब तू मृत्यु तक पूरा पाप करेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद का आरंभ वाक्य की दृष्टि से अधूरा प्रतीत होता है। यह पाठ उत्पत्ति 27:39–40 के समानांतर है, पर गीज़ रूप में उल्लेखनीय कठिनाइयाँ और अतिरिक्त कथन हैं।
    reason: textual_variant
  - marker: b
    text: इस क्रिया का अर्थ ‘तू बड़ा/बलवान हो जाएगा’ भी हो सकता है; यहाँ प्रसंग के अनुसार ‘विद्रोह करेगा’ लिया गया है।
    reason: lexical_ambiguity
  - marker: c
    text: 'शाब्दिक रूप से: ‘तब तू मृत्यु तक पूरा पाप करेगा।’ इसका अनुवाद ‘मृत्यु की ओर ले जाने वाला पूर्ण पाप करेगा’ भी किया जा सकता है।'
    reason: translation_ambiguity
lexical_decisions:
- source_word: ንብረትከ
  choice: तेरा निवास
  rationale: यह शब्द निवास, रहने की जगह या संपत्ति का अर्थ दे सकता है; अधूरे आरंभिक वाक्यांश में ‘निवास’ निकटतम और स्वाभाविक विकल्प है।
- source_word: በመጥባኅትከ፡ ትሐዩ
  choice: तू अपनी तलवार के बल पर जीवित रहेगा
  rationale: करणवाचक रूप को स्वाभाविक हिन्दी ‘के बल पर’ से व्यक्त किया गया है, जबकि तलवार द्वारा जीवन-निर्वाह का कठोर भाव बनाए रखा गया है।
- source_word: አበይከ
  choice: जब तू विद्रोह करेगा
  rationale: क्रिया द्वितीय पुरुष एकवचन है और यहाँ विरोध या जुए को अस्वीकार करने का भाव देती है; इसे ‘पिता’ से जोड़ना स्रोत-समर्थित नहीं है।
- source_word: አስሰልከ፡ አርዑተ
  choice: जुआ उतार देगा
  rationale: क्रिया और कर्म दोनों को द्वितीय पुरुष के कार्य के रूप में रखा गया है; स्रोत में ‘उसका जुआ’ नहीं, केवल ‘जुआ’ है।
- source_word: አበሳ፡ ኵሎ
  choice: पूरा पाप
  rationale: एकवचन ‘पाप’ के साथ ‘समूचा/पूरा’ विशेषण है; ‘सभी पाप’ कहने से प्रत्येक प्रकार के पाप का अलग अर्थ निकलता।
- source_word: ለሞት
  choice: मृत्यु तक
  rationale: शाब्दिक दिशात्मक/परिणामसूचक संबंध को संक्षेप में रखा गया है और ‘मृत्यु लाने वाला पाप’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचा गया है।
theological_decisions:
- issue: पाप और मृत्यु के बीच संबंध
  choice: ‘मृत्यु तक पूरा पाप’ के रूप में कठिन वाक्यांश को बनाए रखा गया
  alternative: ‘मृत्यु की ओर ले जाने वाला पूर्ण पाप’ या ‘मृत्यु का भागी होगा’
  rationale: स्रोत का संबंध संक्षिप्त और अर्थगत रूप से तनावपूर्ण है; अनुवाद ने इसका कोई विशिष्ट धर्मवैज्ञानिक अर्थ तय नहीं किया।
- issue: उत्पत्ति 27:40 के समानांतर पाठ से सामंजस्य
  choice: गीज़ के विस्तृत और कठिन पाठ का अनुवाद किया गया
  alternative: उत्पत्ति के परिचित पाठ के अनुसार वाक्य को सरल या सामान्य बनाना
  rationale: दिए गए मूल-पाठ में विद्रोह, जुआ हटाने और मृत्यु तक पूरे पाप का स्पष्ट विस्तार है; उसे समानांतर बाइबिल पाठ के अनुरूप बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और सामान्य पाठक के लिए समझने योग्य रूप। संबोधन की एकवचन निकटता और प्राचीन आशीर्वचन का लहजा बनाए रखने के लिए ‘तू/तेरा’ प्रयुक्त है। स्रोत का खंडित आरंभ और अंतिम कठिन वाक्यांश अनावश्यक रूप से सुगम नहीं किए गए।
