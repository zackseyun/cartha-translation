  text: And he smelled the fragrant smell of his garments and blessed him and said, “Look, the smell of my son is like the smell of a field.”
translation:
  language: hi
  text: और उसने उसके वस्त्रों की सुगंध सूँघी, उसे आशीर्वाद दिया और कहा, “देखो, मेरे पुत्र की सुगंध मैदान की सुगंध के समान है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጼና፡ መዐዛ፡ አልባሲሁ
  choice: उसके वस्त्रों की सुगंध
  rationale: मूल में ‘गंध/सुगंध’ का संयुक्त प्रयोग है; आधुनिक हिन्दी में ‘वस्त्रों की सुगंध’ दोनों शब्दों का आशय स्वाभाविक ढंग से व्यक्त करता है और መዐዛ की सुखद सुगंध की बारीकी बनाए रखता है।
- source_word: ገዳም
  choice: मैदान
  rationale: यहाँ खुली भूमि या मैदान का बोध है; निकटवर्ती उत्पत्ति 27:27 की पृष्ठभूमि के अनुरूप ‘मैदान’ सहज और संदर्भ-संगत है।
- source_word: ናሁ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार को सीधे और प्रचलित हिन्दी रूप में रखा गया है।
