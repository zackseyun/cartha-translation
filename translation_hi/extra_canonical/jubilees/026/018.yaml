  text: And Isaac did not recognize him, because his hands were hairy like his brother Esau’s hands, so he blessed him.
translation:
  language: hi
  text: और इसहाक ने उसे नहीं पहचाना, क्योंकि उसके हाथ उसके भाई एसाव के हाथों की तरह रोएँदार थे; इसलिए उसने उसे आशीर्वाद दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वह उसे आशीर्वाद दे।”
    reason: गीइज़ ከመ के साथ आए क्रियारूप को परिणाम के बजाय उद्देश्यसूचक भी समझा जा सकता है।
lexical_decisions:
- source_word: ኢያእመረ
  choice: नहीं पहचाना
  rationale: नकार के साथ क्रिया का अर्थ यहाँ किसी की पहचान न कर पाना है; आधुनिक हिन्दी में ‘नहीं पहचाना’ स्वाभाविक और सटीक है।
- source_word: ጸጓር
  choice: रोएँदार
  rationale: शब्द बालों या रोओं से भरे होने का भाव देता है। ‘रोएँदार’ मनुष्य के हाथों के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: ይባርኮ
  choice: उसने उसे आशीर्वाद दिया
  rationale: कथा-क्रम और ከመ के परिणामी प्रयोग के अनुसार इसे घटित परिणाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ከመ + ይባርኮ का परिणाम अथवा उद्देश्य
  choice: इसलिए उसने उसे आशीर्वाद दिया
  alternative: ताकि वह उसे आशीर्वाद दे
  rationale: इस प्रसंग में वाक्य इसहाक के न पहचानने के फलस्वरूप दिए गए आशीर्वाद को बताता है। फिर भी गीइज़ रचना उद्देश्य के रूप में भी समझी जा सकती है, इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘इसलिए’ कारण से परिणाम की कड़ी स्पष्ट करता है, जबकि स्रोत की वास्तविक व्याकरणिक अस्पष्टता पाद-टिप्पणी में दी गई है।
