lexical_decisions:
- source_word: ወይቤ፡ ያዕቆብ፡
  choice: तब याकूब ने कहा
  rationale: गीज़ कथात्मक संयोजन और कथन-क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; ‘तब’ प्रसंगगत प्रवाह देता है।
- source_word: ዘ
  choice: क्योंकि
  rationale: यहाँ संबंधसूचक रूप उत्तर का कारण प्रस्तुत करता है; उपलब्ध प्रसंग और परामर्श-पाठ के अनुसार ‘क्योंकि’ उपयुक्त है।
- source_word: አርጐዐኒ፡
  choice: उसे मेरे सामने ले आया
  rationale: क्रिया के कारक/लाने के भाव को सरल, प्रत्यक्ष हिन्दी में रखा गया है; निहित कर्म को हिन्दी में ‘उसे’ से स्पष्ट किया गया है।
- source_word: አምላክከ፡
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय को ‘तुम्हारा’ और ईश्वर-संज्ञा को गरिमापूर्ण सामान्य हिन्दी ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: ቅድሜየ።
  choice: मेरे सामने
  rationale: स्थानिक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी समतुल्य है।
