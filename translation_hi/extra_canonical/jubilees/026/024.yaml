base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/024.yaml
  text: Let nations and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which God blessed me and blessed Abraham my father—let it be for you and for your seed.
translation:
  language: hi
  text: जातियाँ और लोग तेरे आगे झुकें। तू अपने भाइयों का स्वामी हो, और तेरी माता के पुत्र तेरे आगे झुकें। और वह सारी आशीष जो परमेश्वर ने मुझे और मेरे पिता अब्राहम को दी, तुझे और तेरे वंश को मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕዛብ
  choice: राष्ट्र
  rationale: पद के आरम्भ में उपस्थित बहुवचन संज्ञा का अनुवाद किया गया है। पूर्ववर्ती पद से जुड़े वाक्य-विन्यास के कारण इसका निहित क्रियापद ‘सेवा करें’ समझना पद 23–24 के प्रवाह और उत्पत्ति 27:29 की पृष्ठभूमि के अनुकूल है।
- source_word: ሕዝብ
  choice: जनसमूह
  rationale: አሕዛብ से भेद बनाए रखते हुए सामूहिक ‘लोग/जन’ का स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: ኩን፡ እግዚአ
  choice: स्वामी हो
  rationale: आज्ञार्थक/कामनार्थक आशीर्वचन की शक्ति को बनाए रखते हुए ‘be lord’ का सीधा और गरिमापूर्ण रूप।
- source_word: አኀዊከ
  choice: अपने भाइयों
  rationale: रिश्ते के बहुवचन रूप का सीधा अनुवाद।
- source_word: ውሉደ፡ እምከ
  choice: तेरी माता के पुत्र
  rationale: स्रोत की अधिक विशिष्ट रिश्तेदारी-अभिव्यक्ति को ‘भाइयों’ में समतल नहीं किया गया।
- source_word: እግዚአብሔር
  choice: परमेश्वर
  rationale: इस प्रसंग में ईश्वर-संज्ञा का स्वाभाविक हिन्दी रूप; अंग्रेज़ी परामर्श-पाठ के ‘God’ के अनुरूप, अनावश्यक रूप से वाचा-नाम नहीं आरोपित किया गया।
- source_word: ዘርእከ
  choice: तेरे वंश
  rationale: सामूहिक उत्तराधिकारियों को सूचित करने वाले ‘seed’ का हिन्दी में स्वाभाविक किंतु अर्थ-संरक्षक रूप।
theological_decisions:
- issue: आरम्भिक አሕዛብ का वाक्यगत संबंध
  choice: ‘राष्ट्र तेरी सेवा करें’ के रूप में पिछले पद से निहित क्रिया ग्रहण की गई
  alternative: ‘राष्ट्र और जनसमूह तेरे आगे झुकें’
  rationale: उपलब्ध गीइज़ पाठ में አሕዛብ के तुरंत बाद ‘और वे झुकें’ आता है, किंतु पाठ-विभाजन के कारण ‘राष्ट्र’ संभवतः पिछले पद की ‘सेवा करें’ क्रिया का कर्ता है। इससे स्रोत का कोई शब्द नहीं छूटता और दो निकटवर्ती संज्ञाओं को अस्वाभाविक रूप से एक ही क्रिया के अंतर्गत नहीं जोड़ा जाता।
- issue: आशीर्वचन की विधि
  choice: कामनार्थक रूप—‘करें’, ‘हो’, ‘झुकें’, ‘मिले’
  alternative: भविष्यवाचक कथन
  rationale: प्रसंग इसहाक के आशीर्वचन का है; गीइज़ क्रियारूप इच्छा/आदेश की शक्ति रखते हैं, इसलिए हिन्दी में कामनार्थक शैली सुरक्षित रखी गई।
- issue: वंश की सामूहिकता
  choice: एकवचन सामूहिक ‘वंश’
  alternative: ‘सन्तान’ या ‘वंशजों’
  rationale: यह रूप एक व्यक्ति और सामूहिक उत्तराधिकारियों के बीच स्रोत की संभावित अर्थ-व्याप्ति को यथासंभव खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आशीर्वचन-शैली अपनाई गई है। संबोधन के लिए ‘तू/तेरी/तुझे’ रखा गया है, जो पारिवारिक पितृ-आशीर्वाद में आत्मीय और स्रोत के एकवचन रूप के अनुरूप है। आरम्भ में पद-विभाजन से उत्पन्न कठिनाई को मुख्य पाठ में प्रवाहपूर्ण ढंग से सँभाला गया है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
