  text: “My son, I have grown old, and now my eyes are too dim to see, and I do not know the day of my death.”
translation:
  language: hi
  text: “मेरे बेटे, मैं बूढ़ा हो गया हूँ। अब मेरी आँखों से साफ़ दिखाई नहीं देता, और मैं नहीं जानता कि मेरी मृत्यु का दिन कब आएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: मेरे बेटे
  rationale: प्रत्यक्ष संबोधन और प्रथम पुरुष संबंधवाचक प्रत्यय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ረሳዕኩ
  choice: मैं बूढ़ा हो गया हूँ
  rationale: वृद्ध हो जाने की पूर्ण अवस्था को वर्तमान परिणाम सहित व्यक्त करता है।
- source_word: አዕይንትየ፡ ከፍአ፡ ለርእይ
  choice: मेरी आँखों से साफ़ दिखाई नहीं देता
  rationale: शाब्दिक रूप से आँखों का देखने के लिए खराब होना अभिप्रेत है; हिन्दी में यह मुहावरेदार ढंग से दृष्टि के धुँधले पड़ने को बताता है।
- source_word: ዕለተ፡ ሞትየ
  choice: मेरी मृत्यु का दिन
  rationale: स्रोत की संज्ञात्मक संरचना को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
theological_decisions:
- issue: मृत्यु के दिन का अज्ञान
  choice: मैं नहीं जानता कि मेरी मृत्यु का दिन कब आएगा
  alternative: मैं अपनी मृत्यु का दिन नहीं जानता
  rationale: दोनों अर्थतः संभव हैं; चुना गया रूप सामान्य हिन्दी में अधिक स्वाभाविक है और मृत्यु के समय के अज्ञात होने का भाव स्पष्ट करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज प्रत्यक्ष वाणी। स्रोत में ‘और उसने कहा’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
