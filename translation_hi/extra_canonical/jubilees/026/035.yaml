  text: and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Now let the days of mourning for my father come near, and I will kill Jacob my brother.”
translation:
  language: hi
  text: “और तुम्हारा वंश आकाश के नीचे से उखाड़ दिया जाएगा।” उस आशीष के कारण, जो उसके पिता ने उसे दी थी, एसाव याकूब से घृणा करता था। उसने अपने मन में कहा, “अब मेरे पिता के शोक के दिन निकट आ जाएँ[a], और मैं अपने भाई याकूब को मार डालूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब मेरे पिता के शोक के दिन निकट हैं।”
    reason: गीज़ क्रियारूप को इच्छार्थक कथन अथवा निकटता की घोषणा—दोनों रूपों में समझा जा सकता है।
lexical_decisions:
- source_word: ይሢሮ
  choice: उखाड़ दिया जाएगा
  rationale: क्रिया का आशय जड़ से हटाए या मिटाए जाने का है; यह रूप वंश के पूर्ण उन्मूलन की प्रबल छवि बनाए रखता है।
- source_word: ይትሜአክ
  choice: घृणा करने लगा
  rationale: एसाव की याकूब के प्रति तीव्र शत्रुता को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ይእዜኒ
  choice: अब
  rationale: स्रोत में उपस्थित कालसूचक बल को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ይብጻሕ
  choice: निकट आ जाएँ
  rationale: क्रिया के ‘निकट आने/पहुँचने’ और संभावित इच्छार्थक भाव को सुरक्षित रखता है; वैकल्पिक विधेयात्मक अर्थ फुटनोट में दिया गया है।
- source_word: እቀትሎ
  choice: मैं ... मार डालूँगा
  rationale: हत्या के स्पष्ट संकल्प को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: पिता के शोक के दिनों के निकट आने वाले कथन का व्याकरणिक भाव
  choice: 'इच्छार्थक: “निकट आ जाएँ”'
  alternative: 'विधेयात्मक: “निकट हैं”'
  rationale: गीज़ क्रियारूप को इच्छार्थक अथवा निकट भविष्य की घोषणा के रूप में समझा जा सकता है। मुख्य पाठ अंग्रेज़ी परामर्श-पाठ के ‘let ... come near’ को दर्शाता है, जबकि वास्तविक अस्पष्टता फुटनोट में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने मन में कहा’ स्रोत के आंतरिक संकल्प को बनाए रखता है; पारिवारिक संबोधन और हिंसक आशय को न तो विस्तृत किया गया है, न नरम।
