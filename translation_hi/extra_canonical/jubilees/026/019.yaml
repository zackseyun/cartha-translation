translation:
  language: hi
  text: उसने कहा, “क्या तू सचमुच मेरा पुत्र एसाव है?” उसने कहा, “मैं आपका पुत्र हूँ।” तब उसने कहा, “इसे मेरे पास ले आ, और मैं खाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንተኑ
  choice: क्या तू ही
  rationale: प्रश्नवाचक बल को ‘ही’ के द्वारा व्यक्त किया गया है; इसहाक का अपने सामने उपस्थित व्यक्ति की पहचान सुनिश्चित करना आशय है।
- source_word: ወልድየ፡ ዔሳው
  choice: मेरा पुत्र एसाव
  rationale: स्रोत की संबंध-सूचक रचना और व्यक्तिनाम को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: አቅርብ፡ ሊተ
  choice: उसे मेरे पास ले आ
  rationale: क्रिया में निकट लाने का भाव है; ‘उसे’ प्रसंग में भोजन की ओर संकेत करता है, यद्यपि इस पद में संज्ञा दोहराई नहीं गई।
- source_word: ወእብላዕ
  choice: और मैं खाऊँगा
  rationale: स्रोत के सरल संयोजन और प्रथम पुरुष क्रिया को यथासंभव निकट रखा गया है।
theological_decisions:
- issue: याकूब के उत्तर में पहचान का दावा
  choice: मैं आपका पुत्र हूँ
  alternative: मैं आपका पुत्र एसाव हूँ
  rationale: इस पद के स्रोत-पाठ में उत्तर केवल ‘मैं आपका पुत्र हूँ’ है; ‘एसाव’ जोड़ने से छल को अधिक स्पष्ट किया जाता, पर वह इस पंक्ति में अनुल्लिखित सामग्री होती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। इसहाक द्वारा पुत्र को संबोधित करने में ‘तू’ रखा गया है, जबकि पुत्र का उत्तर ‘आपका’ के साथ आदरसूचक है; इससे पारिवारिक संबंध और सामाजिक संबोधन स्वाभाविक रहते हैं।
