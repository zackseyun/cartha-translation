  text: with grain and wine and oil I have sustained him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”
translation:
  language: hi
  text: “अनाज, दाखमधु और तेल देकर मैंने उसे सहारा दिया है। अब हे मेरे बेटे, मैं तुम्हारे लिए क्या कर सकता हूँ?” तब एसाव ने अपने पिता इसहाक से कहा, “हे पिता, क्या आपके पास केवल एक ही आशीष है? हे पिता, मुझे भी आशीष दीजिए!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጽናዕክዎ
  choice: मैंने उसे सहारा दिया है
  rationale: मूल क्रिया में दृढ़ करने या समर्थ बनाने का भाव है। अनाज, दाखमधु और तेल के संदर्भ में ‘सहारा दिया है’ आज की स्वाभाविक हिन्दी में भरण-पोषण और स्थिरता देने—दोनों भावों को व्यक्त करता है।
- source_word: በረከት
  choice: आशीष
  rationale: यह पितृ-आशीर्वाद के लिए प्रचलित, गरिमापूर्ण और व्यापक रूप से बोधगम्य हिन्दी शब्द है।
- source_word: ቅብዕ
  choice: तेल
  rationale: संदर्भ में यह कृषि-उपज के रूप में तेल को सूचित करता है; बिना आधार इसे विशेष रूप से जैतून का तेल कहना मूल से अधिक निश्चित होता।
theological_decisions:
- issue: इसहाक के प्रश्न में अपनी असमर्थता की सीमा
  choice: मैं तुम्हारे लिए क्या कर सकता हूँ?
  alternative: मैं तुम्हारे लिए कुछ नहीं कर सकता
  rationale: मूल प्रश्नात्मक और खुला है; इसे पूर्ण असमर्थता के कथन में बदलने से निहित तनाव अनावश्यक रूप से समाप्त हो जाता।
- issue: एसाव के प्रश्न में आशीष की संख्या
  choice: क्या आपके पास केवल एक ही आशीष है?
  alternative: क्या आपकी आशीष बस एक ही है?
  rationale: यह अनुनयपूर्ण प्रश्न को बनाए रखता है और यह तय नहीं करता कि आशीष वस्तुतः अविभाज्य थी या इसहाक के अधिकार में केवल एक आशीष बची थी।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। पिता को संबोधन में आदरसूचक ‘आप’ और ‘दीजिए’ प्रयुक्त हैं; एसाव की व्याकुल पुनरुक्ति को दोनों बार ‘हे पिता’ रखकर सुरक्षित किया गया है।
