  text: And she gave the cooked dish and the bread that she had made into the hand of Jacob her son.
translation:
  language: hi
  text: और उसने पकाया हुआ व्यंजन और अपनी बनाई हुई रोटी अपने पुत्र याकूब के हाथ में दे दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትብሲሰ
  choice: पकाया हुआ व्यंजन
  rationale: यह शब्द तैयार या पकाए गए भोजन को सूचित करता है; प्रसंग के अनुरूप ‘व्यंजन’ स्वाभाविक है और भोजन के प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ኅብስተ
  choice: रोटी
  rationale: गीज़ शब्द का सामान्य अर्थ रोटी है; आधुनिक हिन्दी में यही सहज और सटीक रूप है।
- source_word: ውስተ፡ እዴ
  choice: हाथ में
  rationale: मूल की स्थानवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में सीधे बनाए रखा गया है।
- source_word: ወልዳ
  choice: अपने पुत्र
  rationale: स्त्रीलिंग संबंधसूचक रूप बताता है कि याकूब उसका पुत्र है; हिन्दी में ‘अपने पुत्र’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
