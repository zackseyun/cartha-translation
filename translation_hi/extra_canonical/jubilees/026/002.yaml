  yaml_path: translation/extra_canonical/jubilees/026/002.yaml
  text: And now take your hunting gear, your quiver and your bow, and go out to the field and hunt and catch game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”
translation:
  language: hi
  text: और अब अपने शिकार के हथियार—अपना तरकश और अपना धनुष—ले, मैदान में जा, और मेरे लिए शिकार कर और उसे पकड़ ला, मेरे बेटे। फिर मेरे लिए वैसा भोजन तैयार कर जैसा मेरी आत्मा को प्रिय है, और उसे मेरे पास ले आ, ताकि मैं खाऊँ और मरने से पहले मेरी आत्मा तुझे आशीर्वाद दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንዋየ፡ ነፃዊከ
  choice: अपने शिकार के हथियार
  rationale: यह पद शिकार के उपकरणों के लिए है; आगे तरकश और धनुष उन्हें स्पष्ट करते हैं।
- source_word: ምትኃደከ፡ ወቀስትከ
  choice: अपना तरकश और अपना धनुष
  rationale: दोनों वस्तुओं को अलग-अलग और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ወነዐው፡ ... ወአንዝ
  choice: शिकार करके उसे पकड़ ला
  rationale: गीज़ के दो अलग क्रियापदों—शिकार करना और पकड़ना/लेना—का भेद सुरक्षित रखा गया है।
- source_word: ነፍስየ
  choice: मेरा मन
  rationale: शाब्दिक अर्थ 'मेरी आत्मा/मेरा प्राण' है, पर भोजन की इच्छा और आशीर्वाद देने वाले व्यक्ति के संदर्भ में आधुनिक हिन्दी का 'मेरा मन' स्वाभाविक है और दोनों पुनरावृत्तियों को एकरूप रखता है।
- source_word: መብልዐ
  choice: भोजन
  rationale: सामान्य और गरिमापूर्ण हिन्दी; तैयार किए जाने वाले खाद्य पदार्थ का अर्थ देता है।
theological_decisions:
- issue: ነፍስየ के दो प्रयोग
  choice: दोनों स्थानों पर 'मेरा मन'
  alternative: '''मेरी आत्मा'' अथवा पहले ''मेरा मन'' और बाद में ''मेरी आत्मा'''
  rationale: स्रोत दोनों जगह वही शब्द दोहराता है। हिन्दी में एकरूपता उस साहित्यिक संबंध को बचाती है, जबकि 'मन' इच्छा और व्यक्तिगत आशीर्वाद दोनों के प्रसंग में सहज है; यहाँ आत्मा की प्रकृति पर कोई सिद्धान्त आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन आत्मीय आज्ञार्थक रूप ('ले', 'जा', 'ला') के साथ, क्योंकि पिता अपने पुत्र से सीधे बोल रहा है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है; स्रोत के दोनों शिकार-संबंधी क्रियापद स्पष्ट रूप से सुरक्षित हैं।
