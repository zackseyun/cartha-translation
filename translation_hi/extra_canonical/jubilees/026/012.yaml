  text: And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”
translation:
  language: hi
  text: और याकूब अपने पिता के पास गया और बोला, “मैं आपका पुत्र हूँ। जैसा आपने मुझसे कहा था, मैंने वैसा ही किया है। उठिए, बैठिए और जिसका मैंने शिकार किया है, उसमें से खाइए, पिताजी, ताकि आपका प्राण मुझे आशीर्वाद दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአ
  choice: भीतर गया
  rationale: क्रिया में किसी के पास अंदर प्रवेश करने का भाव है; प्रसंग में याकूब का अपने पिता के कक्ष में जाना अभिप्रेत है।
- source_word: አሰገርኩ
  choice: मेरे शिकार
  rationale: रूप का आशय शिकार करके लाए गए भोजन से है। संक्षिप्त ‘मेरे शिकार’ मूल की अभिव्यक्ति और प्रसंग दोनों को बनाए रखता है।
- source_word: ነፍስከ
  choice: आपका प्राण
  rationale: मूल में ‘तुम्हारा प्राण/जीव’ है। ‘प्राण’ आशीर्वाद देने वाले व्यक्ति के अंतरतम अस्तित्व को व्यक्त करता है और मूल की ठोस शब्दावली को सुरक्षित रखता है।
theological_decisions:
- issue: ‘आपका प्राण मुझे आशीर्वाद दे’ का अर्थ
  choice: मूल की व्यक्तिवाचक अभिव्यक्ति को ज्यों का त्यों बनाए रखा गया
  alternative: ‘आप मुझे हृदय से आशीर्वाद दें’
  rationale: भावार्थ में बदलने से मूल की मानवशास्त्रीय भाषा और संभावित अर्थ-तनाव मिट जाता; इसलिए ‘प्राण’ को स्पष्ट किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक पिता-पुत्र संवाद रखा गया है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है; मूल की क्रमिक आज्ञाएँ ‘उठिए, बैठिए और… खाइए’ सुरक्षित हैं।
