  text: And he said, “Have you not reserved a blessing for me, father?” And Isaac answered and said to Esau, “Look, I have made him lord over you, and I have given all his brothers to him as servants; and with abundance.”
translation:
  language: hi
  text: उसने कहा, “हे पिता, क्या आपने मेरे लिए कोई आशीष बचाकर नहीं रखी?” तब इसहाक ने उत्तर देकर एसाव से कहा, “देख, मैंने उसे तेरा स्वामी ठहराया है और उसके सभी भाइयों को उसका सेवक बना दिया है; और बहुतायत के साथ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल पाठ का अंतिम पदांश अधूरा प्रतीत होता है; शाब्दिक रूप से: “और बहुतायत के साथ।”'
    reason: पाठ में अंतिम पूर्वसर्गीय पदांश के बाद अपेक्षित पूरक या कर्म नहीं दिया गया है।
lexical_decisions:
- source_word: በረከተ
  choice: कोई आशीष
  rationale: यहाँ रूप अनिश्चित अर्थ देता है; इसलिए ‘कोई आशीष’ स्वाभाविक और शाब्दिक रूप से उपयुक्त है।
- source_word: እግዚአ
  choice: स्वामी
  rationale: संज्ञा का अर्थ प्रभु/स्वामी है; मानवीय प्रभुत्व के इस प्रसंग में ‘स्वामी’ उपयुक्त है।
- source_word: አግብርተ
  choice: सेवक
  rationale: यह दासों/सेवकों को सूचित करता है; आधुनिक सामान्य पाठक के लिए ‘सेवक’ सहज है, जबकि अधीनता का भाव वाक्य में बना रहता है।
- source_word: ብዝኀ
  choice: बहुतायत
  rationale: मूल में प्रचुरता/बहुतायत का अर्थ है, पर उपलब्ध पदांश अपूर्ण प्रतीत होता है; इसलिए कोई अनुपस्थित कर्म नहीं जोड़ा गया।
theological_decisions:
- issue: याकूब पर एसाव और उसके भाइयों के अधीन किए जाने की भाषा
  choice: ‘मैंने उसे तेरा स्वामी ठहराया है और उसके सब भाइयों को उसके सेवक होने के लिए उसे सौंप दिया है’
  alternative: इसे केवल प्रतिष्ठा या आशीष की सामान्य श्रेष्ठता के रूप में नरम करना
  rationale: मूल की प्रभुत्व और सेवा संबंधी स्पष्ट भाषा तथा उसकी धर्मवैचारिक कठोरता को बनाए रखा गया है।
- issue: अंतिम अपूर्ण पदांश
  choice: ‘और बहुतायत के साथ’ को अपूर्ण ही रखा
  alternative: उत्पत्ति 27:37 या संदर्भ के आधार पर अन्न अथवा दाखमधु जैसे शब्द जोड़ना
  rationale: दिए गए गीइज़ पाठ में पूरक वस्तु उपस्थित नहीं है; अतः पाठगत तनाव को अनुमान से पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। पिता को संबोधन में आदरसूचक ‘आप’ रखा गया है, जबकि इसहाक द्वारा पुत्र से कथन में प्रसंगानुकूल ‘तू/तेरा’ रूप प्रयुक्त है।
