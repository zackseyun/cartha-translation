  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल कथात्मक शैली रखी गई है। गीइज़ पाठ में खालों से पहले ‘से’ अर्थ वाला पूर्वसर्ग नहीं माना गया; इसलिए पुराने वैकल्पिक पाठ ‘खालों में से’ को न मुख्य पाठ में रखा गया है, न पादटिप्पणी में।
