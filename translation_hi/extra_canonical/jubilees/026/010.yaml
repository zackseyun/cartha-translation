  text: And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and the skins of the young kids she put on his hands and on the bare part of his neck.
translation:
  language: hi
  text: और रिबका ने अपने बड़े बेटे एसाव के मनभावने वस्त्र, जो उसके पास घर में थे, लेकर अपने छोटे बेटे याकूब को पहना दिए। फिर उसने बकरी के बच्चों की खालें उसके हाथों और उसकी गर्दन के खुले भाग पर लगा दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ... ዘይትፈተው
  choice: मनभावने वस्त्र
  rationale: वस्त्रों के लिए प्रयुक्त विशेषण प्रिय, पसंदीदा या मनभावना होने का भाव देता है; स्वाभाविक हिन्दी में ‘मनभावने’ इस अर्थ को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: ዘይሌህቅ / ዘይንእስ
  choice: बड़ा / छोटा
  rationale: एसाव और याकूब के पारिवारिक संबंध को आधुनिक, सहज हिन्दी में क्रमशः बड़े और छोटे बेटे के रूप में व्यक्त किया गया है।
- source_word: መሓስአ፡ ጠሊ
  choice: बकरी के बच्चों की खालें
  rationale: पदसमूह युवा बकरों/बकरी के बच्चों की खालों को सूचित करता है; हिन्दी में लिंग-विशिष्टता आरोपित किए बिना ‘बकरी के बच्चों’ स्वाभाविक है।
- source_word: ዕርቃነ፡ ክሳዱ
  choice: उसकी गर्दन का खुला भाग
  rationale: शाब्दिक भाव गर्दन की नंगी या अनावृत सतह है; ‘खुला भाग’ प्रसंग में प्राकृतिक और स्पष्ट है।
