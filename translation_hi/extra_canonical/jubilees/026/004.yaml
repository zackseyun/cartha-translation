  text: And Esau went to the open country to hunt, and to catch, and to bring it to his father.
translation:
  language: hi
  text: और एसाव खुले मैदान में शिकार करने, उसे पकड़ने और अपने पिता के पास लाने गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገዳመ
  choice: खुले मैदान में
  rationale: यह शब्द बाहर के खुले प्रदेश या वन्य क्षेत्र का संकेत देता है; प्रसंग में शिकार के लिए गए स्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ያሥግር
  choice: शिकार करने
  rationale: क्रिया का आशय आखेट करना है; हिन्दी में सामान्य और स्पष्ट अभिव्यक्ति।
- source_word: የአንዝ
  choice: उसे पकड़ने
  rationale: यहाँ क्रिया का अर्थ पकड़ना या धर लेना है, न कि केवल ढूँढ़ना; 'उसे' से शिकार का संदर्भ स्पष्ट रहता है।
- source_word: ያምጽእ
  choice: लाने
  rationale: मूल की उद्देश्यसूचक क्रिया-श्रृंखला को बनाए रखते हुए पिता के पास शिकार लाने का अर्थ देता है।
