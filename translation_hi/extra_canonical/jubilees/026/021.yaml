lexical_decisions:
- source_word: ወይን
  choice: दाखमधु
  rationale: गीज़ शब्द का अर्थ अंगूर से बनी मदिरा है। ‘दाखमधु’ आधुनिक हिन्दी में अपेक्षाकृत सुबोध और गरिमापूर्ण है तथा पद के आरम्भ में पिछले वाक्य से चले आ रहे कर्म के रूप को बनाए रखता है।
- source_word: ቅረበኒ
  choice: मेरे पास आ
  rationale: संदर्भ में निकट आने की आज्ञा है; प्राकृतिक हिन्दी में ‘मेरे पास आ’ इसका सीधा और स्पष्ट रूप है।
- source_word: ስዐመኒ / ስዐሞ
  choice: मुझे चूम / उन्हें चूमा
  rationale: मूल क्रिया चूमने को व्यक्त करती है। संवाद में ‘मुझे’ और वर्णन में पिता के प्रति आदरसूचक ‘उन्हें’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: ወልድየ
  choice: मेरे बेटे
  rationale: शाब्दिक अर्थ ‘मेरे पुत्र’ है; ‘मेरे बेटे’ पारिवारिक संबोधन में अधिक स्वाभाविक आधुनिक हिन्दी है।
