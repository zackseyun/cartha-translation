  choice: पास आ
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ወእግስስከ
  choice: तुझे छूकर जानूँ
  rationale: गीज़ क्रिया का आशय स्पर्श करके पहचानना या परखना है; केवल ‘छूऊँ’ कहने की अपेक्षा प्रसंगगत उद्देश्य भी स्वाभाविक हिन्दी में व्यक्त होता है।
