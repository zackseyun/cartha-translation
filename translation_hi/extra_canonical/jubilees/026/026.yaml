  text: And Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father arise and eat from my game, so that your soul may bless me.”
translation:
  language: hi
  text: और उसका भाई एसाव शिकार से लौट आया। उसने भी भोजन तैयार किया और उसे अपने पिता के पास लाकर कहा, “मेरे पिता उठें और मेरे शिकार का मांस खाएँ, ताकि आपका प्राण मुझे आशीर्वाद दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምነዓዊሁ
  choice: अपने शिकार से
  rationale: स्रोत पद शिकार से लौटने का भाव देता है; हिन्दी में स्वाभाविक अभिव्यक्ति के लिए ‘शिकार से लौट आया’ किया गया।
- source_word: መብልዐ
  choice: भोजन
  rationale: यहाँ पिता के लिए तैयार किए गए खाने का सामान्य अर्थ है; अतः सहज और व्यापक हिन्दी शब्द चुना गया।
- source_word: እመሥገርትየ
  choice: मेरे शिकार का मांस
  rationale: संदर्भ में स्वयं पकड़े गए जंगली पशु से तैयार भोजन अभिप्रेत है; केवल ‘शिकार’ खाने की अपेक्षा यह हिन्दी में अधिक स्पष्ट और स्वाभाविक है।
- source_word: ነፍስከ
  choice: आपका प्राण
  rationale: स्रोत के ‘तुम्हारा प्राण/जीव’ को बनाए रखा गया है, न कि उसे केवल ‘आप’ में समतल किया गया, ताकि प्राचीन अभिव्यक्ति और उसका संभावित अर्थगत तनाव सुरक्षित रहे।
theological_decisions:
- issue: आशीर्वाद देने वाला कर्ता ‘आपका प्राण’
  choice: ताकि आपका प्राण मुझे आशीर्वाद दे
  alternative: ताकि आप मुझे आशीर्वाद दें
  rationale: स्रोत में ‘तुम्हारा प्राण’ स्पष्ट कर्ता है। इसे बनाए रखने से मनुष्य के प्राण और व्यक्ति के बीच स्रोत की अभिव्यक्ति को बिना व्याख्यात्मक सरलीकरण के प्रस्तुत किया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक संबोधन रखा गया है। वाक्य dignified किंतु सामान्य पाठक के लिए सहज है; प्रत्यक्ष कथन में प्राचीन तृतीय-पुरुष विनम्र आज्ञार्थ ‘मेरे पिता उठें’ सुरक्षित रखा गया है।
