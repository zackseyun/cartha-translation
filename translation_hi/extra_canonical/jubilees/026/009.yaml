  yaml_path: translation/extra_canonical/jubilees/026/009.yaml
  text: And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young goats and brought them to his mother, and his mother prepared them as food, such as he loved.
translation:
  language: hi
  text: और याकूब ने अपनी माता रिबका की बात मानी। वह गया और बकरी के दो अच्छे, मोटे बच्चे लेकर अपनी माता के पास आया। उसकी माता ने उनसे वैसा भोजन तैयार किया जैसा वह पसंद करता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जैसा वह पसंद करता था।” मूल पाठ में “वह” का कर्ता नाम से व्यक्त नहीं है; प्रसंगानुसार इसका संकेत संभवतः इसहाक की ओर है।'
    reason: मूल पाठ में अंतिम क्रिया का पुल्लिंग एकवचन कर्ता निहित है, पर उसका नाम नहीं दिया गया है।
lexical_decisions:
- source_word: ሰምዐ፡ ... ቃለ
  choice: की बात मानी
  rationale: शाब्दिक अर्थ ‘वाणी सुनी’ है, पर इस प्रसंग में यह निर्देश मानने और उसके अनुसार कार्य करने को व्यक्त करता है।
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ
  choice: बकरियों के दो ... बच्चे
  rationale: गीज़ पदबंध दो छोटे बकरों/बकरी के बच्चों को सूचित करता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: ሠናያነ፡ ወስቡሓነ
  choice: अच्छे और मोटे
  rationale: दोनों विशेषणों को अलग रखते हुए चयनित पशुओं की गुणवत्ता और पुष्टता व्यक्त की गई है।
- source_word: መብልዐ
  choice: भोजन
  rationale: यह सामान्यतः खाने या भोजन के लिए प्रयुक्त शब्द है; हिन्दी में ‘भोजन’ गरिमापूर्ण और स्वाभाविक है।
- source_word: ዘከመ፡ ያፈቅር
  choice: जैसा उसके पिता को प्रिय था
  rationale: मूल में कर्ता केवल क्रिया के पुल्लिंग एकवचन रूप से निहित है। प्रसंग में इसका संकेत इसहाक की ओर है, इसलिए मुख्य पाठ में संबंध स्पष्ट किया गया और अस्पष्टता को पादटिप्पणी में दर्ज किया गया है।
theological_decisions:
- issue: ‘जैसा वह प्रेम करता था’ में निहित कर्ता
  choice: जैसा उसके पिता को प्रिय था
  alternative: जैसा वह पसंद करता था
  rationale: गीज़ में कर्ता का नाम नहीं दोहराया गया है। कथा-प्रसंग इसहाक को अभिप्रेत बताता है, लेकिन मूल की व्याकरणिक अंतर्निहितता को पादटिप्पणी में सुरक्षित रखा गया है; इससे कोई अतिरिक्त धार्मिक व्याख्या आरोपित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘की बात मानी’ आज्ञापालन का प्रसंगगत अर्थ देता है; ‘बकरियों के बच्चे’ सामान्य पाठक के लिए स्पष्ट है।
