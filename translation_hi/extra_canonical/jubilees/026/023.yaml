  yaml_path: translation/extra_canonical/jubilees/026/023.yaml
  text: full, which the LORD has blessed. And may the LORD give you—and multiply you—from the dew of heaven and from the dew of the earth[23], and abundance of grain and oil may he multiply for you. Let them serve you,
translation:
  language: hi
  text: भरा हुआ, जिसे यहोवा ने आशीष दी है। और यहोवा तुझे दे—और तुझे बढ़ाए—आकाश की ओस से और पृथ्वी की ओस से[a]; और वह तेरे लिए अनाज और तेल की बहुतायत बढ़ाए। वे तेरी सेवा करें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पृथ्वी की ओस’ पदबंध असामान्य है; उत्पत्ति के समानांतर पद के कारण कुछ पाठक यहाँ ‘पृथ्वी की उपजाऊ भूमि’ की अपेक्षा कर सकते हैं। अनुवाद सामंजस्य बैठाने के बजाय यहाँ गीज़ पाठ का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ምሉእ
  choice: भरा हुआ
  rationale: इसका सीधा अर्थ ‘भरा हुआ’ है और यह पिछले पद में आए खेत का वर्णन आगे जारी रखता है; ‘आशीष से भरा’ जोड़ना स्रोत से परे होता।
- source_word: እምጠለ፡ ሰማይ፡ ወእምጠለ፡ ምድር
  choice: आकाश की ओस से और पृथ्वी की ओस से
  rationale: गीज़ पाठ दोनों स्थानों पर ‘ओस’ कहता है। उत्पत्ति के समानांतर पद के आधार पर दूसरे पदबंध को ‘पृथ्वी की उपजाऊ भूमि’ नहीं बनाया गया।
- source_word: ወብዝኀ፡ ስርናይ፡ ወቅብእ
  choice: अनाज और तेल की बहुतायत
  rationale: ስርናይ को सामान्य और सहज ‘अनाज’ तथा ቅብእ को प्रसंगानुसार ‘तेल’ किया गया है।
- source_word: ይትቀነዩ፡ ለከ
  choice: वे तेरी सेवा करें
  rationale: गीज़ में कर्ता स्पष्ट नहीं है; इसलिए उत्पत्ति के समानांतर पाठ से ‘जातियाँ’ या ‘लोग’ नहीं जोड़ा गया।
theological_decisions:
- issue: उत्पत्ति 27:28–29 के समानांतर पाठ से सामंजस्य
  choice: गीज़ की विशिष्ट शब्दावली और अनिर्दिष्ट कर्ता सुरक्षित रखे गए
  alternative: ‘पृथ्वी की उपजाऊ भूमि’ और ‘जातियाँ तेरी सेवा करें’
  rationale: यह अनुवाद उपलब्ध गीज़ पाठ का अनुसरण करता है और प्रसिद्ध समानांतर पाठ के आधार पर उसे चुपचाप नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। एकवचन संबोधन के लिए आशीर्वचन की साहित्यिक शैली के अनुरूप ‘तुझे/तेरे’ का प्रयोग हुआ है। पद पिछले वाक्य से आरम्भ और अगले वाक्य में समाप्त होता है, इसलिए आरम्भिक खंड और अंतिम अल्पविराम बनाए गए हैं।
