  language: hi
  text: और इसहाक ने अपने बेटे से कहा, “तुझे यह इतनी जल्दी कैसे मिल गया, मेरे बेटे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይስሐቅ
  choice: इसहाक
  rationale: व्यक्ति के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ለወልዱ
  choice: अपने बेटे से
  rationale: स्रोत में संबंधसूचक रूप ‘उसके बेटे से’ है; हिन्दी में कर्ता इसहाक के संदर्भ में ‘अपने बेटे से’ स्वाभाविक और स्पष्ट है।
- source_word: ምንተ ከመዝ
  choice: कैसे
  rationale: प्रश्नवाचक अभिव्यक्ति घटना के इतनी शीघ्र घटने का कारण/ढंग पूछती है; आधुनिक हिन्दी में ‘कैसे’ इसे सहज रूप से व्यक्त करता है।
- source_word: አፍጠንከ
  choice: इतनी जल्दी
  rationale: क्रिया-रूप में निहित शीघ्रता को प्रसंगानुकूल हिन्दी क्रियाविशेषण के रूप में व्यक्त किया गया है।
- source_word: ረኪበ
  choice: मिल गया
  rationale: मूल अर्थ ‘पाना/खोजना’ है; शिकार हाथ लगने के प्रसंग में ‘तुझे यह ... मिल गया’ स्वाभाविक है और अंग्रेज़ी परामर्श-पाठ के आशय से भी मेल खाता है।
- source_word: ወልድየ
  choice: मेरे बेटे
  rationale: प्रत्यक्ष संबोधन का स्नेहपूर्ण और अर्थनिष्ठ हिन्दी रूप।
