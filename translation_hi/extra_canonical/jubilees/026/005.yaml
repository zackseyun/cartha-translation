base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/005.yaml
  text: And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me, and bring it to me, that I may eat and bless you before the LORD before I die.’”
translation:
  language: hi
  text: तब रिबका ने अपने पुत्र याकूब को बुलाकर उससे कहा, “देख, मैंने तेरे पिता इसहाक को तेरे भाई एसाव से यह कहते सुना है, ‘मेरे लिए शिकार कर, मेरे लिए भोजन तैयार कर और उसे मेरे पास ले आ, ताकि मैं खाऊँ और मरने से पहले यहोवा के सामने तुझे आशीर्वाद दूँ।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሰግር
  choice: शिकार कर
  rationale: यह क्रिया शिकार करने या शिकार पकड़ने का अर्थ देती है; इसे ‘ले आ’ कहना उचित नहीं, क्योंकि आगे ወአብእ अलग से ‘ले आ’ व्यक्त करता है।
- source_word: መብልዐ
  choice: भोजन
  rationale: सामान्य और स्वाभाविक हिन्दी में तैयार करके खाने की वस्तु के लिए ‘भोजन’ उपयुक्त है।
- source_word: በቅድመ፡ እግዚአብሔር
  choice: यहोवा के सामने
  rationale: स्रोत की स्थान-संबंधी अभिव्यक्ति को सीधे बनाए रखता है और आशीर्वाद को परमेश्वर की उपस्थिति में दिए जाने के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: आशीर्वाद और यहोवा के सामने होने का संबंध
  choice: ‘यहोवा के सामने तुझे आशीर्वाद दूँ’
  alternative: ‘यहोवा की ओर से तुझे आशीर्वाद दूँ’
  rationale: स्रोत में ‘सामने’ का भाव है, न कि स्पष्टतः ‘की ओर से’; इसलिए प्रतिनिधिक अधिकार का अतिरिक्त अर्थ नहीं जोड़ा गया।
- issue: खाने और आशीर्वाद देने की क्रियाओं का भाव
  choice: ‘ताकि मैं खाऊँ और ... आशीर्वाद दूँ’
  alternative: ‘मैं खाऊँगा और ... आशीर्वाद दूँगा’
  rationale: संदर्भ में शिकार लाने का उद्देश्य व्यक्त होता है; हिन्दी में ‘ताकि’ इस आशय को स्वाभाविक रूप से व्यक्त करता है, बिना आशीर्वाद को निरपेक्ष भविष्यवाणी बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; पारिवारिक प्रत्यक्ष कथन में स्रोत के एकवचन आत्मीय संबोधन के अनुरूप ‘तेरे/तुझे’ रखा गया है। भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
