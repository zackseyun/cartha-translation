  text: And Isaac his father said to him, “Who are you?” And he said to him, “I am your firstborn, Esau your son; I have done it.”
translation:
  language: hi
  text: तब उसके पिता इसहाक ने उससे पूछा, “तू कौन है?” उसने उससे कहा, “मैं तेरा पहलौठा पुत्र एसाव हूँ; मैंने वैसा ही किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኑ፡ አንተ
  choice: तू कौन है?
  rationale: प्रत्यक्ष प्रश्न को सहज आधुनिक हिन्दी में रखा गया है; पिता-पुत्र प्रसंग में ‘तू’ स्वाभाविक है।
- source_word: በኵርከ፡ ዔሳው፡ ወልድከ
  choice: तेरा पहलौठा पुत्र एसाव
  rationale: ‘तेरा पहलौठा’ और ‘तेरा पुत्र’ दोनों संबंधों को स्पष्ट रखते हुए हिन्दी में स्वाभाविक पदक्रम अपनाया गया है।
- source_word: ገበርኩ
  choice: मैंने वैसा ही किया है
  rationale: गीज़ क्रिया का मूल अर्थ ‘मैंने किया’ है; निहित कर्म को पूर्व प्रसंग की आज्ञा/कार्य की ओर संकेत करने वाले ‘वैसा ही’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
