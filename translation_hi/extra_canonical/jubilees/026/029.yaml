  text: Blessed shall he be, and all his seed forever.” And it happened, when Esau heard the words of his father Isaac,
translation:
  language: hi
  text: “वह धन्य हो, और उसका समस्त वंश सदा तक धन्य रहे।” और ऐसा हुआ कि जब एसाव ने अपने पिता इसहाक की बातें सुनीं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቡሩከ፡ ይኩን፡
  choice: वह धन्य हो
  rationale: आशीर्वचन की भावी/कामनात्मक शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ወኵሉ፡ ዘርኡ፡
  choice: और उसका समस्त वंश ... धन्य रहे
  rationale: ዘር का सामूहिक अर्थ यहाँ ‘वंश’ है; हिन्दी में विधेय को दोहराने से आशय स्पष्ट और वाक्य स्वाभाविक रहता है।
- source_word: እስከ፡ ለዓለም።
  choice: सदा तक
  rationale: स्थायी कालावधि के स्रोतार्थ को संक्षिप्त, प्रचलित बाइबलीय हिन्दी में सुरक्षित रखता है।
- source_word: ወኮነ፡ ሶበ፡
  choice: और ऐसा हुआ कि जब
  rationale: घटनात्मक कथासूत्र और कालवाचक संबंध, दोनों को बनाए रखता है।
- source_word: ነገረ፡ አቡሁ፡ ይስሐቅ፡
  choice: अपने पिता इसहाक की बातें
  rationale: ነገረ के बहुवचन/सामूहिक ‘बातें/वचन’ अर्थ को सहज आधुनिक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: आशीर्वाद की व्याकरणिक शक्ति
  choice: ‘वह धन्य हो ... धन्य रहे’ के रूप में कामनात्मक आशीर्वचन
  alternative: ‘वह धन्य होगा’ जैसा निश्चित भविष्यवचन
  rationale: स्रोत का रूप आशीर्वचन और भावी परिणाम, दोनों का तनाव रख सकता है; हिन्दी में कामनात्मक रूप इसे बिना अनावश्यक सिद्धान्तगत निर्धारण के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
