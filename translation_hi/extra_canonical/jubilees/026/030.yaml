  text: 'he cried out with a very great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”'
translation:
  language: hi
  text: 'तब उसने बहुत ज़ोर से और कड़वाहट भरी चीख मारी और अपने पिता से कहा, “मेरे पिता, मुझे भी आशीर्वाद दीजिए!” उसके पिता ने उससे कहा, “तुम्हारा भाई छल से आया और तुम्हारे आशीर्वादों को ले गया।” तब उसने कहा, “अब मुझे समझ आया कि वह याकूब क्यों कहलाता है: उसने मुझे इन दो बार पछाड़ दिया है![a] पहले उसने मेरा ज्येष्ठाधिकार ले लिया, और अब उसने मेरा आशीर्वाद ले लिया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याकूब” नाम यहाँ एड़ी पकड़ने और किसी को पीछे करके उसका स्थान ले लेने के भाव से जोड़ा गया है।
    reason: याकूब के नाम और ‘पछाड़ दिया’ के बीच की शब्द-क्रीड़ा हिन्दी में सीधे पूरी तरह व्यक्त नहीं होती।
lexical_decisions:
- source_word: በቃል፡ ዐቢይ፡ ወመሪር፡ ጥቀ
  choice: बहुत ऊँचे और अत्यन्त कड़वे स्वर में
  rationale: शाब्दिक रूप से ‘बहुत बड़े और कड़वे स्वर से’; हिन्दी में रोने-चिल्लाने की तीव्रता और कटु पीड़ा दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በሕብል
  choice: छल से
  rationale: कपट या धोखे के अर्थ को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: በረከታቲከ
  choice: तुम्हारे आशीर्वाद
  rationale: स्रोत में यह रूप बहुवचन है; इसलिए बाद के एकवचन ‘मेरा आशीर्वाद’ से इसका कृत्रिम सामंजस्य नहीं किया गया।
- source_word: አዐቀጸኒ
  choice: मुझे … पछाड़ दिया
  rationale: क्रिया में किसी को एड़ी पकड़कर पीछे करने अथवा उसका स्थान हथिया लेने का भाव है; ‘पछाड़ दिया’ प्रसंग में स्वाभाविक है और नाम याकूब से जुड़ी शब्द-क्रीड़ा को टिप्पणी में सुरक्षित रखता है।
- source_word: ልደተየ
  choice: मेरा पहलौठे का अधिकार
  rationale: प्रसंग में यह सामान्य जन्म नहीं, पहले जन्मे पुत्र का विशेष अधिकार है।
theological_decisions:
- issue: आशीर्वाद का वचन—बहुवचन और एकवचन
  choice: पहले ‘तुम्हारे आशीर्वाद’ और बाद में ‘मेरा आशीर्वाद’
  alternative: दोनों स्थानों पर एकवचन ‘आशीर्वाद’
  rationale: गीज़ स्रोत पहले स्थान पर बहुवचन और बाद में एकवचन रखता है; अनुवाद उसी अंतर को बनाए रखता है।
- issue: याकूब के नाम की व्याख्या
  choice: नाम और ‘पछाड़ देने’ के बीच संबंध को मुख्य पाठ तथा पादटिप्पणी में बनाए रखना
  alternative: इसे केवल ‘उसने मुझे धोखा दिया’ कहना
  rationale: स्रोत में नाम से जुड़ी शब्द-क्रीड़ा महत्त्वपूर्ण है; केवल नैतिक अर्थ ‘धोखा’ चुनने से उसका चित्रात्मक और व्युत्पत्तिपरक तनाव मिट जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में पुत्र का आदरसूचक संबोधन बनाए रखने के लिए ‘दीजिए’ प्रयुक्त हुआ है। स्रोत के पहले बहुवचन ‘आशीर्वाद’ और बाद के एकवचन को यथावत अलग रखा गया है।
