translation:
  language: hi
  text: “जैसा आपने मुझे आज्ञा दी थी।” तब इसहाक बहुत ज़ोर से काँप उठा और बोला, “तो फिर यह कौन है, जिसने शिकार किया, शिकार को पकड़ा, और मेरे पास लाया? तुम्हारे आने से पहले मैंने उसमें से सब कुछ खाया और उसे आशीर्वाद दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድማመ፡ ዐቢየ፡ ጥቀ
  choice: बहुत ही थरथर काँपने लगा
  rationale: मूल में ‘काँपना’ संज्ञा और क्रिया की पुनरुक्ति के साथ उसकी अत्यधिक तीव्रता व्यक्त की गई है; हिंदी में ‘थरथर काँपना’ उस जोर को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ዝንቱ
  choice: यह कौन है
  rationale: संकेतवाचक ‘यह’ को बनाए रखा गया है; इसे केवल ‘कौन था’ बनाना मूल के वर्तमान संकेत को कम कर देता।
- source_word: ዘነዐወ፡ ወአሥገረ
  choice: जिसने शिकार किया और उसे पकड़ा
  rationale: मूल में दो अलग क्रियाएँ हैं—शिकार करना और पकड़ना/फँसाना—इसलिए दोनों क्रियाओं को रखा गया है, ताकि उत्पत्ति 27:33 की अपेक्षाकृत संक्षिप्त अभिव्यक्ति से अनावश्यक सामंजस्य न किया जाए।
- source_word: ወበላዕኩ፡ እምኵሉ
  choice: मैंने उसमें से सब कुछ खाया
  rationale: मूल का अर्थ ‘मैंने सब में से/सब कुछ खाया’ है; यह हिंदी रूप स्वाभाविक है और भोजन के संदर्भ को स्पष्ट किए बिना अर्थ बनाए रखता है।
- source_word: ወባረክዎ
  choice: और उसे आशीर्वाद दिया
  rationale: मूल में पूर्ण क्रिया ‘मैंने उसे आशीर्वाद दिया’ है; इसे भविष्यसूचक या स्थायी आशीष के कथन में नहीं बदला गया।
theological_decisions:
- issue: इसहाक के आशीर्वाद के अंतिम शब्दों का स्वरूप
  choice: और उसे आशीर्वाद दिया?
  alternative: और वह आशीषित रहेगा
  rationale: यहाँ गीइज़ पाठ स्पष्ट रूप से इसहाक द्वारा किए गए कार्य का उल्लेख करता है, न कि आशीष के भविष्य में बने रहने की अलग घोषणा का। इसलिए उत्पत्ति 27:33 के अन्य पाठरूप से सामंजस्य नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। आरंभ पिछले वाक्य की सीधी वाणी की निरंतरता है। इसहाक की तीव्र प्रतिक्रिया को ‘बहुत ही थरथर काँपने लगा’ से और उसके विस्मित प्रश्न को सीधे वाक्य-विन्यास से व्यक्त किया गया है।
