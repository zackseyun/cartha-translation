  text: And Rebekah his mother said to him, “Let your curse be on me, my son; only listen to my voice.”
translation:
  language: hi
  text: और उसकी माँ रिबका ने उससे कहा, “तेरा शाप मुझ पर आए, मेरे बेटे; बस मेरी बात सुन।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላዕሌየ፡ መርገምከ
  choice: तेरा शाप मुझ पर आए
  rationale: मूल में ‘तेरा शाप’ और ‘मुझ पर’ का संबंध सीधे रखा गया है। हिंदी में ‘आए’ जोड़ने से इच्छासूचक/स्वीकारात्मक कथन स्वाभाविक बनता है, बिना उसके आशय को अधिक स्पष्ट किए।
- source_word: ወልድየ
  choice: मेरे बेटे
  rationale: शाब्दिक अर्थ ‘मेरे पुत्र’ है; ‘मेरे बेटे’ आधुनिक हिंदी में माँ के संबोधन के लिए अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ዳእሙ
  choice: बस
  rationale: यहाँ प्रतिबंधात्मक बल ‘केवल/बस’ है; संवाद में ‘बस’ सहज और स्पष्ट है।
- source_word: ስማዕ፡ ቃልየ
  choice: मेरी बात सुन
  rationale: शाब्दिक ‘मेरी वाणी सुन’ को आधुनिक हिंदी की स्वाभाविक आज्ञार्थक अभिव्यक्ति में प्रस्तुत किया गया है।
theological_decisions:
- issue: माँ द्वारा शाप अपने ऊपर लेने का कथन
  choice: तेरा शाप मुझ पर आए
  alternative: तेरा शाप मुझ पर हो
  rationale: ‘आए’ संभावित शाप को अपने ऊपर स्वीकार करने की मूल अभिव्यक्ति को बनाए रखता है और इसे किसी विशिष्ट धर्मवैज्ञानिक व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी; पारिवारिक संवाद के अनुरूप सहज, किंतु गरिमापूर्ण शैली। ‘रिबका’ नाम का प्रचलित हिंदी बाइबलीय रूप रखा गया है।
