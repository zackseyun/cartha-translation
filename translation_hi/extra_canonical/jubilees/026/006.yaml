base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/006.yaml
  text: 'And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”'
translation:
  language: hi
  text: '“और अब, मेरे बेटे, मेरी बात सुन और जो आज्ञा मैं तुझे देती हूँ, उसे मान: अपने झुंड में जा और वहाँ से बकरी के दो अच्छे बच्चे मेरे लिए ले आ। मैं उनसे तेरे पिता के लिए उनकी पसंद का भोजन तैयार करूँगी। फिर तू उसे अपने पिता के पास ले जाना; वे खाएँगे और अपनी मृत्यु से पहले प्रभु के सामने तुझे आशीर्वाद देंगे, और तू आशीष पाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃልየ፡ ዘአነ፡ እኤዝዘከ
  choice: मेरी बात सुन और जो आज्ञा मैं तुझे देती हूँ उसे मान
  rationale: शाब्दिक रूप से ‘मेरी वाणी सुन, जो मैं तुझे आज्ञा देती हूँ’; स्वाभाविक हिन्दी में सुनने के साथ आज्ञापालन का आशय स्पष्ट किया गया है। स्त्री वक्ता रिबका के अनुसार ‘देती हूँ’ रखा गया है।
- source_word: ውስተ፡ መርዔትከ
  choice: अपने झुंड के पास
  rationale: ‘तेरे झुंड में/के पास’ के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ
  choice: बकरियों के दो अच्छे बच्चे
  rationale: मूल पदसमूह दो अच्छे छोटे बकरों/बकरी के बच्चों को सूचित करता है; ‘बकरियों के बच्चे’ आयु-संबंधी अर्थ को बनाए रखता और हिन्दी में स्वाभाविक है।
- source_word: መብልዐ፡ ለአቡከ፡ ዘከመ፡ ያፈቅር
  choice: तेरे पिता के लिए उनकी पसंद का भोजन
  rationale: ‘जैसा वह प्रेम/पसंद करता है’ को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ቅድመ፡ እግዚአብሔር
  choice: प्रभु के सामने
  rationale: मूल के दैवी नाम-सूचक पद को सम्मानसूचक ‘प्रभु’ से प्रस्तुत किया गया है; ‘के सामने’ स्थानिक/साक्ष्यगत अस्पष्टता बनाए रखता है।
- source_word: ወትኩን፡ ቡሩከ
  choice: और तू आशीष पाएगा
  rationale: शाब्दिक ‘और तू आशीषित होगा’ की अपेक्षा वर्तमान हिन्दी में अधिक सहज, जबकि निष्क्रिय परिणाम का भाव सुरक्षित है।
theological_decisions:
- issue: आशीर्वाद और प्रभु के सामने होने का संबंध
  choice: वह ... प्रभु के सामने तुझे आशीर्वाद दें
  alternative: प्रभु के समक्ष वह तुझे आशीर्वाद देंगे
  rationale: मूल वाक्यक्रम और यह संभावना सुरक्षित रखी गई है कि पितृ-आशीर्वाद परमेश्वर की उपस्थिति/साक्ष्य में दिया जाता है; अतिरिक्त धार्मिक व्याख्या नहीं जोड़ी गई।
- issue: मृत्यु से पहले आशीर्वाद का कर्ता
  choice: अपनी मृत्यु से पहले ... तुझे आशीर्वाद दें
  alternative: तेरे मरने से पहले ...
  rationale: क्रियाओं की कर्ता-श्रृंखला पिता की ओर संकेत करती है; इसलिए मृत्यु पिता की समझी गई, जैसा निकटवर्ती आख्यान-संदर्भ भी बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। माता-पुत्र संवाद के अनुरूप ‘तू/तेरे/तुझे’ रखा गया है। आज्ञाओं में स्वाभाविक हिन्दी प्रयोग किया गया है और कथन की भविष्यसूचक निश्चितता को बनाए रखा गया है।
