  yaml_path: translation/extra_canonical/jubilees/026/007.yaml
  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
translation:
  language: hi
  text: और याकूब ने अपनी माँ रिबका से कहा, “माँ, क्या मेरे पास उस भोजन की कोई कमी होगी जो मेरे पिता खाते हैं और जो उन्हें भाता है?[a] परन्तु माँ, मुझे डर है कि वे मेरी आवाज़ पहचान लेंगे और मुझे छूना चाहेंगे। तुम जानती हो कि मेरी त्वचा चिकनी है, जबकि मेरा भाई एसाव बालों वाला है। तब मैं उन्हें ऐसा लगूँगा जैसे मैं उनका उपहास कर रहा हूँ, और मैं ऐसा काम करूँगा जिसकी उन्होंने मुझे आज्ञा नहीं दी। वे मुझ पर क्रोधित होंगे, और मैं अपने ऊपर आशीष नहीं, बल्कि शाप ले आऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक वाक्य पाठ और अर्थ की दृष्टि से कठिन है। इसमें सम्भवतः उस भोजन की कमी या अभाव का भाव है जिसे इसहाक खाते और पसन्द करते हैं।
    reason: segmentation_note
lexical_decisions:
- source_word: ኢይምሕክ
  choice: क्या ... मेरे पास कुछ कम न होगा
  rationale: इस कठिन मुहावरे को अभाव या कमी के भाव में लिया गया है; प्रश्नवाचक रूप मूल की अनिश्चितता और याकूब के तर्क को बनाए रखता है।
- source_word: ወያሠምሮ
  choice: और जो उन्हें भाता है
  rationale: क्रिया का अर्थ ‘भाना/प्रसन्न करना’ है, न कि ‘पहचानना’ या ‘परखना’।
- source_word: ይለቡ፡ ቃልየ
  choice: मेरी आवाज़ पहचान लेगा
  rationale: संदर्भ में पिता द्वारा याकूब की आवाज़ पहचान लिए जाने का भय व्यक्त है।
- source_word: ይፍቅድ፡ ይገሥሠኒ
  choice: मुझे छूना चाहेगा
  rationale: 'दोनों क्रियाओं के कर्ता पिता हैं: वह इच्छा करेगा और याकूब को छुएगा।'
- source_word: ልሙጽ ... ጸጓር
  choice: मेरी त्वचा चिकनी है ... रोएँदार है
  rationale: विरोध याकूब की चिकनी त्वचा और एसाव के शरीर पर घने रोओं के बीच है; हिन्दी में इसे स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: ዘያስተአኪ
  choice: उसका उपहास करनेवाले
  rationale: मूल में उपहास या छलपूर्वक मज़ाक उड़ाने जैसा दिखाई देने का भाव है; इसे किसी विशिष्ट धार्मिक व्याख्या से नहीं जोड़ा गया।
theological_decisions:
- issue: याकूब के भय में निषेधात्मक संरचना
  choice: वह मेरी आवाज़ पहचान लेगा और मुझे छूना चाहेगा
  alternative: वह मेरी आवाज़ न पहचानेगा और मुझे छूने न देगा
  rationale: भय व्यक्त करनेवाली क्रिया के बाद मूल की ‘कि कहीं न’ संरचना आशंकित सकारात्मक घटना बताती है। वैकल्पिक शाब्दिक निषेध प्रसंग का अर्थ उलट देता।
- issue: अनधिकृत काम और परिणाम
  choice: ऐसा काम करूँगा जिसकी उसने मुझे आज्ञा नहीं दी ... आशीष नहीं, बल्कि शाप
  alternative: इसे सामान्यतः केवल ‘छल करूँगा’ कहना
  rationale: मूल के ‘जिसकी उसने आज्ञा नहीं दी’ वाले असामान्य लेकिन अर्थपूर्ण कथन और आशीष-शाप के स्पष्ट तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथन रखा गया है। पारिवारिक सम्बोधन में ‘माँ’ और ‘तू’ प्रसंगानुकूल हैं; पिता के लिए मूल के एकवचन को ‘वह’ से बनाए रखा गया है। ‘चिकनी त्वचा’ और ‘रोएँदार’ सामान्य पाठक के लिए देहगत विरोध को स्पष्ट करते हैं।
