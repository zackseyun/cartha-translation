  text: “The voice is Jacob’s voice[17], but the hands are Esau’s hands.” And he did not recognize him, because it was a turning from heaven to remove his spirit,
translation:
  language: hi
  text: “आवाज़ तो याकूब की आवाज़ है,[a] पर हाथ एसाव के हाथ हैं।” और उसने उसे नहीं पहचाना, क्योंकि उसकी आत्मा को हटा देने के लिए स्वर्ग की ओर से यह फेर हुआ था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अध्याय में पद 17–21 के आसपास स्रोत-पंक्तियों का पद-विभाजन असमान है। पहचान और आशीर्वाद के क्रम को गीइज़ पाठ के सबसे सुसंगत क्रम में प्रस्तुत किया गया है।
    reason: segmentation_note
  - marker: b
    text: ‘आत्मा’ के लिए गीइज़ शब्द का अर्थ संदर्भ के अनुसार मन, चेतना, या अंतःशक्ति भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ቃል፡ ቃለ፡ ያዕቆብ
  choice: आवाज़ तो याकूब की आवाज़ है
  rationale: दोहराव और पहचान-वाक्य की संरचना को स्वाभाविक आधुनिक हिन्दी में बनाए रखा गया है।
- source_word: እደው፡ እደወ፡ ዔሳው
  choice: हाथ एसाव के हाथ हैं
  rationale: मूल की समानांतर रचना और बहुवचन अर्थ सुरक्षित हैं।
- source_word: ወኢያእመረ
  choice: फिर भी उसने उसे नहीं पहचाना
  rationale: क्रिया का सामान्य अर्थ ‘जानना/पहचानना’ है; प्रसंग में पहचानना अधिक सटीक है। ‘फिर भी’ पिछले विरोधाभासी संकेतों से स्वाभाविक संबंध जोड़ता है।
- source_word: ሚጠት፡ ውእቱ፡ እምሰማይ
  choice: स्वर्ग की ओर से यह फेर हुआ था
  rationale: ሚጠት के संज्ञात्मक भाव ‘फेर/मोड़’ और እምሰማይ के स्रोतार्थ ‘स्वर्ग की ओर से’ को सुरक्षित रखा गया है।
- source_word: ለአሕልፎ፡ መንፈሱ
  choice: उसकी समझ को हटा देने के लिए
  rationale: መንፈስ का मूल अर्थ ‘आत्मा/प्राण/मन’ हो सकता है, किंतु पहचान के प्रसंग में मानसिक ग्रहण-शक्ति अभिप्रेत प्रतीत होती है; ‘समझ’ हिन्दी में मृत्यु या आत्मा-हरण का अनचाहा अर्थ आने से बचाती है, जबकि कारणात्मक infinitive को ‘हटा देने के लिए’ से रखा गया है।
theological_decisions:
- issue: इसहाक के न पहचानने में स्वर्ग की भूमिका
  choice: स्वर्ग की ओर से यह फेर हुआ था
  alternative: यह स्वर्ग से आया हुआ फेर था
  rationale: पाठ दैवी स्रोत का संकेत देता है, पर यह स्पष्ट नहीं करता कि कर्ता सीधे परमेश्वर है या स्वर्गीय व्यवस्था; इसलिए ‘परमेश्वर ने’ जोड़कर अस्पष्टता नहीं मिटाई गई।
- issue: መንፈሱ का अर्थ
  choice: उसकी समझ
  alternative: उसकी आत्मा / उसका मन
  rationale: शाब्दिक ‘आत्मा’ हिन्दी में प्राण ले लेने का अर्थ जगा सकती है, जो पहचान-विफलता के प्रसंग से मेल नहीं खाता। ‘समझ’ प्रसंगगत आशय देता है, पर मूल शब्द की अर्थ-सीमा को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फेर’ संज्ञात्मक मूल को बचाता है; अंतिम वाक्यांश की कठिनता को पूरी तरह समतल किए बिना हिन्दी में अर्थगम्य बनाया गया है।
