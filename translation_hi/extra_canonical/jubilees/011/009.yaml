  text: He told this matter to his two brothers[9], and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.
translation:
  language: hi
  text: उसने यह बात अपने दोनों भाइयों को बताई। वे उस पर क्रोधित हुए और चुप रहे। चालीसवीं जुबली में, दूसरे सप्ताह के सातवें वर्ष में, अब्राम ने अपने लिए एक पत्नी ली। उसका नाम सारै था; वह अब्राम के पिता की बेटी थी[a] और अब्राम की पत्नी बनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अब्राम के पिता की बेटी’ वाक्यांश को उपलब्ध पाठ के अनुसार ही रखा गया है; उत्पत्ति की पुस्तक से इसका सामंजस्य बैठाने के लिए इसे बदला नहीं गया। यह पाठगत समस्या अथवा इस परंपरा में संबंध बताने की भिन्न अभिव्यक्ति हो सकती है।
    reason: textual_variant
lexical_decisions:
- source_word: አሐዊሁ
  choice: उसके दोनों भाइयों
  rationale: रूप बहुवचन ‘उसके भाई’ है और ክልኤ स्पष्ट रूप से ‘दो’ बताता है।
- source_word: ወአርመሙ
  choice: और चुप रहे
  rationale: क्रिया तृतीय पुरुष बहुवचन है; इसलिए कर्ता दोनों भाई हैं, अब्राम नहीं।
- source_word: አዮቤልዉ
  choice: जुबली-वर्ष
  rationale: कालगणना की तकनीकी इकाई को पहचाने योग्य रूप में रखा गया है; ‘वर्ष’ जोड़ने से सामान्य हिन्दी पाठक के लिए अभिव्यक्ति स्पष्ट होती है।
- source_word: ሶራ
  choice: सारै
  rationale: यहाँ नाम का रूप सारै से संबद्ध है; हिन्दी बाइबलीय नाम-परंपरा के अनुरूप ‘सारै’ चुना गया है।
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: अपने लिए एक पत्नी ली
  rationale: स्रोत की मुहावरेदार रचना का स्वाभाविक किंतु निकट हिन्दी रूप।
theological_decisions:
- issue: सारै को ‘उसके पिता की बेटी’ कहना
  choice: कथन को पाठ में यथाप्राप्त रखा गया
  alternative: उत्पत्ति की वंशावली से सामंजस्य बैठाने के लिए इसे बदलना या अधिक विशिष्ट संबंध बताना
  rationale: पाठगत या संबंध-सूचक कठिनाई को किसी दूसरी परंपरा के आधार पर चुपचाप हल नहीं किया गया।
- issue: चुप रहने वालों की पहचान
  choice: बहुवचन क्रिया के अनुसार दोनों भाइयों को कर्ता माना गया
  alternative: ‘वह चुप रहा,’ जिसका कर्ता अब्राम होता
  rationale: गीज़ क्रिया ወአርመሙ तृतीय पुरुष बहुवचन है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। कालगणना की मूल संरचना—चालीसवाँ जुबली-वर्ष, दूसरा सप्ताह, सातवाँ वर्ष—सुरक्षित है; कठिन संबंध-सूचक कथन को व्याख्यात्मक रूप से नहीं बदला गया।
