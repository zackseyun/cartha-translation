  yaml_path: translation/extra_canonical/jubilees/011/016.yaml
  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
translation:
  language: hi
  text: दो वर्ष-सप्तकों तक।[a] फिर छठे वर्ष-सप्तक के पाँचवें वर्ष में, सातवें महीने के आरम्भ में अब्राम रात भर बैठा रहा और संध्या से भोर तक तारों का निरीक्षण करता रहा, ताकि वह जान सके कि उस वर्ष वर्षाएँ कैसी होंगी। वह वहाँ अकेला बैठा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘वर्षों के दो सप्ताह’, अर्थात सात-सात वर्षों की दो अवधियाँ। जुबलीज़ में समय की गणना प्रायः ऐसी सात-वर्षीय इकाइयों में की जाती है।
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት
  choice: दो वर्ष-सप्तकों तक
  rationale: शाब्दिक अर्थ ‘वर्षों के दो सप्ताह’ है; ‘वर्ष-सप्तक’ सात वर्षों की योजनाबद्ध काल-इकाई को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: सातवें महीने के आरम्भ पर
  rationale: ሠርቀ का मूल भाव उदय या आरम्भ है; यहाँ चंद्र-मास के शुरू होने का संदर्भ है, इसलिए अस्पष्ट खगोलीय विवरण जोड़े बिना ‘आरम्भ’ चुना गया।
- source_word: ያበይነ፡ ከዋክብተ
  choice: तारों का निरीक्षण करता रहा
  rationale: क्रिया का आशय तारों को ध्यान से देखकर परखना या भेद करना है; आधुनिक हिन्दी में ‘निरीक्षण’ इस उद्देश्यपूर्ण अवलोकन को सहजता से व्यक्त करता है।
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: वर्ष में वर्षा कैसी होगी
  rationale: शाब्दिक संरचना ‘वर्ष का कार्य/स्वरूप वर्षाओं के विषय में क्या होगा’ है; हिन्दी में यह चयन अर्थ को स्वाभाविक रूप से रखता है और वर्षा की मात्रा या शुभ-अशुभ फल जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ሀሎ፡ ውእቱ፡ ባሕቲቱ፡ ይነብር
  choice: वह वहाँ अकेला बैठा था
  rationale: मूल में उसके अकेले होने और बैठे/ठहरे रहने पर बल है; इसे अलग वाक्य में रखकर वही बल सुरक्षित किया गया है।
theological_decisions:
- issue: तारों के निरीक्षण को ज्योतिषीय भविष्यवाणी के रूप में प्रस्तुत करना
  choice: तटस्थ रूप से ‘तारों का निरीक्षण’ और वर्षा जानने का उद्देश्य रखा गया
  alternative: ‘ज्योतिष के द्वारा वर्षा की भविष्यवाणी करना’
  rationale: मूल पाठ तारों को देखने और वर्षा के संबंध में वर्ष का स्वरूप जानने की बात करता है, पर किसी विशिष्ट धार्मिक या ज्योतिषीय पद्धति का नाम नहीं देता; इसलिए न समर्थन जोड़ा गया, न निंदा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरम्भिक खंड पिछले पद से व्याकरणिक रूप से जुड़ा हुआ प्रतीत होता है; स्रोत के पद-विभाजन को बनाए रखने के लिए उसे यहाँ स्वतंत्र वाक्यांश के रूप में रखा गया है।
