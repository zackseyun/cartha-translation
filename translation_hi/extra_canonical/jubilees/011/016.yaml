review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the schematic opening phrase, the sixth heptad's fifth year, Abram's solitary observation of the stars from evening to dawn, and the purpose of determining the year's rainy character. A small revision makes the temporal phrase and the all-night duration more idiomatic and explicit in Hindi.
  naturalness: ‘सातवें महीने के आरम्भ पर’ is less natural than ‘सातवें महीने के आरम्भ में.’ Rendering the night-long vigil as ‘रात भर बैठा रहा’ reads naturally while retaining the stated span from evening to dawn.
  terminology: ‘वर्ष-सप्तक’ is an appropriate compact rendering of the text's schematic seven-year ‘week.’ ‘अब्राम’ correctly follows the source form, and the neutral wording for star observation does not add a doctrinal interpretation.
  issues:
  - severity: low
    issue: Awkward temporal postposition
    rationale: Modern standard Hindi normally uses ‘आरम्भ में,’ rather than ‘आरम्भ पर,’ for this temporal setting.
  - severity: low
    issue: The all-night aspect is only implicit in the first clause
    rationale: Although ‘संध्या से भोर तक’ supplies the duration, ‘रात भर बैठा रहा’ more directly conveys the source/English sense that Abram remained awake through the night.
  revised_text: दो वर्ष-सप्तकों तक।[a] फिर छठे वर्ष-सप्तक के पाँचवें वर्ष में, सातवें महीने के आरम्भ में अब्राम रात भर बैठा रहा और संध्या से भोर तक तारों का निरीक्षण करता रहा, ताकि वह जान सके कि उस वर्ष वर्षाएँ कैसी होंगी। वह वहाँ अकेला बैठा था।
