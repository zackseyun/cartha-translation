lexical_decisions:
- source_word: ስሞ፡ ሎጥ
  choice: उसका नाम लूत था
  rationale: नामसूचक गीइज़ वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; ‘था’ हिन्दी वाक्य के लिए आवश्यक संयोजक है।
- source_word: ወናኮር፡ እኁሁ
  choice: और उसके भाई नाहोर
  rationale: स्रोत में संबंधवाचक सर्वनाम का पूर्वपद स्पष्ट रूप से दोहराया नहीं गया है, इसलिए हिन्दी में भी ‘उसके’ रखकर वही संदर्भगत निर्भरता बनाए रखी गई है।
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: ने अपने लिए एक पत्नी ली
  rationale: शाब्दिक अर्थ ‘अपने लिए स्त्री/पत्नी ली’ है; विवाह-संदर्भ में ‘पत्नी’ स्वाभाविक और सटीक हिन्दी है।
- source_word: ወበዓመት፡ ዘስሳ፡ ዘሕይወቱ
  choice: उसके जीवन के साठवें वर्ष में
  rationale: स्रोत केवल ‘उसके जीवन’ कहता है और व्यक्ति का नाम नहीं जोड़ता; अनुवाद उसी सर्वनामात्मक रूप को बनाए रखता है।
theological_decisions:
- issue: अंतिम वाक्यांश में ‘उसके’ का संदर्भ
  choice: उसके जीवन के साठवें वर्ष में
  alternative: अब्राम के जीवन के साठवें वर्ष में
  rationale: गीइज़ पाठ में यहाँ अब्राम का नाम नहीं है। किसी विशिष्ट व्यक्ति का नाम जोड़ने से स्रोत की वास्तविक संदर्भगत अस्पष्टता अनावश्यक रूप से समाप्त हो जाती।
