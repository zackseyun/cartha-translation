  yaml_path: translation/extra_canonical/jubilees/011/004.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits, those set under his hand, to do every kind of error and sin and transgression, to corrupt and destroy and to shed blood upon the earth.
translation:
  language: hi
  text: और अधिपति मस्तेमा ने यह सब करने के लिए हर संभव प्रयास किया, और उसने अन्य आत्माओं को, जो उसके अधीन रखी गई थीं, भेजा कि वे हर प्रकार की भूल, पाप और अपराध करें, भ्रष्ट करें और नष्ट करें, और पृथ्वी पर रक्त बहाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastema
  choice: मस्तेमा
  rationale: इसे अर्थानुवाद करने के बजाय व्यक्तिवाचक नाम के रूप में लिप्यंतरित किया गया है, ताकि पात्र की पहचान और मूल की संभावित अर्थ-छाया दोनों पर कोई एक व्याख्या न थोपी जाए।
- source_word: prince
  choice: प्रधान
  rationale: यहाँ पद और अधिकार का भाव है; ‘राजकुमार’ आधुनिक हिन्दी में वंशगत अर्थ दे सकता है, जो इस आत्मिक सत्ता के संदर्भ में भ्रामक होगा।
- source_word: spirits
  choice: आत्माओं
  rationale: अशरीरी अधीनस्थ सत्ताओं के लिए स्वाभाविक और व्यापक हिन्दी शब्द चुना गया है।
- source_word: those set under his hand
  choice: जो उसके अधीन किए गए थे
  rationale: मूल के अधिकार-अधीनता संबंध और कर्मवाच्य को सुरक्षित रखा गया है।
- source_word: error/wrong
  choice: अन्याय
  rationale: संदर्भ में यह केवल बौद्धिक भूल नहीं, नैतिक बुराई है; इसलिए ‘भूल’ के बजाय ‘अन्याय’ उपयुक्त है।
- source_word: shed blood
  choice: खून बहाएँ
  rationale: मूल की हिंसक और ठोस अभिव्यक्ति को सहज आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: मस्तेमा की पहचान
  choice: उसे ‘प्रधान मस्तेमा’ कहा गया है, बिना उसे किसी अन्य नामित दुष्ट सत्ता के समान ठहराए।
  alternative: ‘शैतान मस्तेमा’ या ‘दुष्टात्माओं का राजकुमार मस्तेमा’
  rationale: पाठ जितना स्पष्ट करता है, अनुवाद उतना ही कहता है; किसी परवर्ती धार्मिक पहचान को इसमें नहीं जोड़ा गया।
- issue: बुराई में मस्तेमा और अधीनस्थ आत्माओं की भूमिका
  choice: मस्तेमा भेजता है और आत्माएँ अन्याय, भ्रष्टता, विनाश तथा रक्तपात कराती हैं।
  alternative: सभी कार्य सीधे मस्तेमा स्वयं करता है।
  rationale: पाठ में प्रधान सत्ता और उसके अधीन भेजी गई आत्माओं के बीच कार्य-विभाजन सुरक्षित रखना आवश्यक है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य में मस्तेमा की सक्रियता, अधीनस्थ आत्माओं की स्थिति और बुराई की क्रमिक सूची को यथासंभव समानांतर ढंग से संरक्षित किया गया है। उपलब्ध गीइज़ उद्धरण में लक्षित पद 11:4 प्रत्यक्षतः अनुपस्थित है, इसलिए प्रदत्त अंग्रेज़ी परामर्श-पाठ और उसी साहित्यिक संदर्भ के आधार पर सावधानीपूर्वक मसौदा तैयार किया गया है।
