revisions:
- from: और प्रधान मस्तेमा ने यह सब कराने के लिए पूरा ज़ोर लगाया। उसने दूसरे आत्माओं को—जो उसके अधीन किए गए थे—भेजा, ताकि वे हर प्रकार का अन्याय, पाप और अपराध कराएँ, लोगों को भ्रष्ट करें और नष्ट करें, और पृथ्वी पर खून बहाएँ।
  to: और अधिपति मस्तेमा ने यह सब करने के लिए हर संभव प्रयास किया, और उसने अन्य आत्माओं को, जो उसके अधीन रखी गई थीं, भेजा कि वे हर प्रकार की भूल, पाप और अपराध करें, भ्रष्ट करें और नष्ट करें, और पृथ्वी पर रक्त बहाएँ।
  rationale: 'संशोधन अंग्रेज़ी POB audit trail की कार्य-रचना और शब्दार्थ के अधिक निकट है: मस्तेमा प्रयास करता और आत्माओं को भेजता है; वे स्वयं भूल, पाप, अपराध, भ्रष्टता, विनाश और रक्तपात करती हैं। नाम को लिप्यंतरित रखा गया है और किसी परवर्ती धार्मिक पहचान को नहीं जोड़ा गया।'
