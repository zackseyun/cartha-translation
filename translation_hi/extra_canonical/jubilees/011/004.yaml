review_pass:
  verdict: revise
  source_fidelity: लक्षित पद का गीइज़ पाठ दिए गए स्रोत-अंश में प्रत्यक्ष उपलब्ध नहीं है; इसलिए समीक्षा प्रदत्त अंग्रेज़ी POB audit trail के विरुद्ध की गई है। मसौदा मस्तेमा, उसकी अधीनस्थ आत्माओं, तथा उनके भेजे जाने और विनाशकारी कार्यों की मूल संरचना को सामान्यतः सुरक्षित रखता है। किंतु ‘error’ के लिए ‘अन्याय’ बहुत विशिष्ट नैतिक अर्थ जोड़ता है; ‘भूल’ अधिक निकट और अस्पष्टता-संरक्षक है।
  naturalness: ‘दूसरे आत्माओं’ व्याकरणतः अशुद्ध है; ‘दूसरी आत्माओं’ अथवा अधिक स्वाभाविक रूप में ‘अन्य आत्माओं’ अपेक्षित है। ‘पूरा ज़ोर लगाया’ बोलचाल का है और यहाँ ‘हर संभव प्रयास किया’ अधिक स्वाभाविक तथा गरिमापूर्ण है। समानांतर क्रियाओं के लिए ‘करें’ स्रोत के अधिक निकट है, न कि प्रेरणार्थक ‘कराएँ’।
  terminology: ‘प्रधान’ संभव है, पर किसी अधीनस्थ आत्मिक सत्ता के पद के लिए ‘अधिपति’ अधिक स्पष्ट और स्वाभाविक है, बिना ‘राजकुमार’ की वंशगत छाया जोड़े। ‘मस्तेमा’ का लिप्यंतरण उचित है। ‘आत्माएँ’ और ‘रक्त बहाएँ’ उपयुक्त हैं।
  issues:
  - severity: medium
    issue: ‘error’ का अनुवाद ‘अन्याय’ किया गया है।
    rationale: ‘अन्याय’ न्याय-अन्याय की विशिष्ट श्रेणी है, जबकि अंग्रेज़ी audit trail का ‘error’ अधिक व्यापक है। ‘भूल’ मूल की अस्पष्टता बनाए रखती है।
  - severity: medium
    issue: ‘दूसरे आत्माओं’ में लिंग-सहमति त्रुटिपूर्ण है।
    rationale: ‘आत्माओं’ के साथ ‘अन्य’ प्रयोग अधिक स्वाभाविक है।
  - severity: medium
    issue: ‘कराएँ’ अधीनस्थ आत्माओं को दूसरों से ये काम करवाने वाला बनाता है।
    rationale: प्रदत्त पाठ में आत्माओं को स्वयं हर प्रकार की बुराई करने के लिए भेजा गया है; साधारण क्रिया ‘करें’ कार्यकर्ता को सही रखती है।
  - severity: low
