translation:
  language: hi
  text: —उन्हें बनाने वालों के लिए, और उनकी उपासना करने वालों के लिए हृदय का भटकाव।[a] उनकी उपासना मत करना।” उसके पिता ने उससे कहा, “मेरे बेटे, मैं भी यह जानता हूँ; पर उन लोगों के लिए मैं क्या कर सकता हूँ, जिन्होंने मुझे अपने अधीन कर लिया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्यांश का गीइज़ पाठ कठिन है और संभवतः यह पिछले वचन से जुड़ा हुआ है। इसका अर्थ यह भी समझा जा सकता है: “उन्हें बनाने वालों और उनकी उपासना करने वालों के हृदय भटक जाते हैं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወከሕተት፡ ልብ
  choice: और … मन का भटकाव
  rationale: यह पदबंध शाब्दिक रूप से ‘और मन का भटकना/भटकाव’ के निकट है। स्रोत-पाठ की कठिन, खंडित रचना को किसी निश्चित कारणात्मक कथन में बदले बिना सुरक्षित रखा गया है।
- source_word: አታምልክዎሙ
  choice: उनकी उपासना मत करना
  rationale: निषेधात्मक आज्ञा को सहज आधुनिक हिन्दी में व्यक्त किया गया; बहुवचन कर्म ‘उनकी’ मूर्तियों/देवताओं की ओर संकेत करता है।
- source_word: እትአዘዝ
  choice: मुझे अपने अधीन कर लिया है
  rationale: क्रिया का अर्थ आज्ञापालन करना या अधीन होना है; इसलिए ‘भटका दिया’ जैसे असमर्थित अर्थ से बचा गया है।
theological_decisions:
- issue: मूर्तियों के प्रभाव से संबंधित आरंभिक उपवाक्य की अस्पष्टता
  choice: खंडित समानांतर रचना को मुख्य पाठ में बनाए रखा
  alternative: ‘वे उन्हें बनानेवालों और उनकी उपासना करनेवालों के मन को भटका देती हैं’
  rationale: वैकल्पिक रूप अधिक सहज है, पर वह दोनों समूहों पर एक ही विधेय लागू करके गीइज़ पाठ की वास्तविक व्याकरणिक कठिनाई को अनावश्यक रूप से सुलझा देता है।
- issue: पिता की लोगों से संबद्ध स्थिति
  choice: ‘जिन्होंने मुझे अपने अधीन कर लिया है’
  alternative: ‘जिन्होंने मुझे अपने सामने भटका दिया है’
  rationale: स्रोत की क्रिया अधीनता/आज्ञापालन व्यक्त करती है, नैतिक या मानसिक भटकाव नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभ में दीर्घ डैश यह दिखाता है कि वचन पिछले कथन को आगे बढ़ाता है; स्रोत की कठिनता को कृत्रिम रूप से पूर्ण वाक्य बनाकर नहीं छिपाया गया।
