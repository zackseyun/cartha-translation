  yaml_path: translation/extra_canonical/jubilees/011/010.yaml
  text: And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called his name Ur.
translation:
  language: hi
  text: और उसके भाई आरेन ने तीसरे सप्ताह के तीसरे वर्ष में अपने लिए एक पत्नी ली। उसने इसी सप्ताह के सातवें वर्ष में उसके लिए एक पुत्र को जन्म दिया, और आरेन ने उसका नाम ऊर रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध स्रोत-अंश यहाँ केवल “और उसने पुकारा” पर समाप्त होता है; “उसका नाम ऊर” अगले संलग्न पाठ से लेकर वाक्य पूरा किया गया है।
    reason: यांत्रिक पद-विभाजन के कारण नाम और क्रिया का कर्म दिए गए स्रोत-अंश से कट गए हैं; मानक पद-विभाजन और नवीनतम पाठ-समीक्षा के अनुसार उन्हें यहाँ जोड़ा गया है।
lexical_decisions:
- source_word: አሬን
  choice: आरेन
  rationale: नाम का स्रोत-पाठानुसार सीधा देवनागरी लिप्यंतरण; इसे बिना पर्याप्त आधार के अधिक परिचित बाइबिलीय नाम से नहीं बदला गया।
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: अपने लिए एक पत्नी ली
  rationale: गीज़ मुहावरे का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: በዓመት፡ ሣልስ፡ ዘሱባዔ፡ ሣልስ
  choice: तीसरे सप्ताह के तीसरे वर्ष में
  rationale: कालगणना के दोनों क्रमसूचकों को स्रोत के अनुसार स्पष्ट रखा गया।
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: उसने ... उसके लिए एक पुत्र को जन्म दिया
  rationale: स्त्रीलिंग कर्ता और पुरुष के लिए पुत्र उत्पन्न होने की स्रोत-संरचना को हिन्दी में सुरक्षित रखा गया।
- source_word: ወጸውዐ
  choice: और उसने उसका नाम ... रखा
  rationale: शाब्दिक अर्थ ‘और उसने पुकारा’ है; नामकरण के प्रसंग में हिन्दी का स्वाभाविक प्रयोग ‘नाम रखा’ है।
