base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/005.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits—those placed under his hand—to do all manner of wrong and sin and all manner of transgression, to corrupt and destroy, and to shed blood on the earth.
translation:
  language: hi
  text: और राजकुमार मस्तेमा ने यह सब करने में अपना पूरा जोर लगा दिया। उसने अपने अधीन रखी गई दूसरी आत्माओं को भेजा, ताकि वे हर प्रकार का अन्याय, पाप और अपराध करें, लोगों को भ्रष्ट करें और उनका नाश करें, और पृथ्वी पर खून बहाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Prince Mastema
  choice: राजकुमार मस्तेमा
  rationale: व्यक्तिगत दुष्ट सत्ता की उपाधि और नाम को सीधे तथा संप्रदाय-निरपेक्ष रूप में रखा गया है।
- source_word: exerted himself
  choice: अपना पूरा जोर लगा दिया
  rationale: मूल अभिव्यक्ति में निहित सक्रिय और प्रबल प्रयास को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: spirits—those placed under his hand
  choice: अपने अधीन रखी गई दूसरी आत्माओं
  rationale: ‘हाथ के नीचे’ के शाब्दिक मुहावरे का आशय अधिकार या अधीनता है; हिन्दी में इसे स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: wrong and sin and ... transgression
  choice: अन्याय, पाप और अपराध
  rationale: तीन अलग नैतिक श्रेणियों और मूल की संचयी लय को बनाए रखता है।
- source_word: shed blood
  choice: खून बहाएँ
  rationale: हिंसा और हत्या के अर्थ वाला सहज हिन्दी मुहावरा है।
theological_decisions:
- issue: मस्तेमा की वैयक्तिकता
  choice: पुल्लिंग एकवचन व्यक्तिगत कर्ता के रूप में अनुवाद
  alternative: अवैयक्तिक बुराई या ‘वह वस्तु’ के रूप में अनुवाद
  rationale: प्रसंग में मस्तेमा आदेश देने और आत्माओं को भेजने वाला व्यक्तिगत पात्र है।
- issue: अधीनस्थ आत्माओं की भूमिका
  choice: मस्तेमा द्वारा भेजी गई सक्रिय कारक आत्माएँ
  alternative: मस्तेमा के कार्य का केवल प्रतीकात्मक वर्णन
  rationale: पाठ आत्माओं को उसके अधिकार में रखे गए और विशिष्ट दुष्कर्मों के लिए भेजे गए कर्ताओं के रूप में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। उपलब्ध गीत्ज़ अंश में लक्षित पद का पाठ प्रत्यक्ष रूप से उपस्थित नहीं था, इसलिए संशोधित और परीक्षित अंग्रेज़ी परामर्श-पाठ में संरक्षित पद-सामग्री के अनुसार अनुवाद किया गया है; अप्रासंगिक पुराने पादलेख नहीं अपनाए गए।
