    rationale: ‘Prince’ यहाँ अधीनस्थ आत्माओं वाले दुष्ट शासकीय/प्रधान पद का सूचक है, न कि आवश्यकतः राजपरिवार के पुत्र का। ‘अधिपति’ अधिक स्वाभाविक और तटस्थ है।
  revised_text: और अधिपति मस्तेमा ने यह सब करने में अपना पूरा जोर लगा दिया। उसने अपने अधीन रखी गई दूसरी आत्माओं को भेजा, ताकि वे हर प्रकार का अन्याय, पाप और अपराध करें, भ्रष्ट करें और नाश करें, और पृथ्वी पर खून बहाएँ।
