  naturalness: भाषा आधुनिक, प्रवाहपूर्ण और गरिमापूर्ण है। अनिर्दिष्ट कर्म हटाने पर वाक्य अधिक निष्ठावान रहते हुए स्वाभाविक बना रहता है।
  terminology: ‘मस्तेमा’ नाम यथावत उचित है। ‘राजकुमार’ आधुनिक हिन्दी में राजवंशीय पुत्र का अनपेक्षित संकेत दे सकता है; ‘अधिपति मस्तेमा’ यहाँ पदवी और अधीनस्थ आत्माओं पर उसके अधिकार को अधिक सटीकता से व्यक्त करता है। ‘आत्माएँ’ और ‘खून बहाना’ संदर्भानुकूल हैं।
