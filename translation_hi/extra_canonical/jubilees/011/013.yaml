lexical_decisions:
- source_word: ተንሥኡ
  choice: उठे
  rationale: क्रिया का सीधा अर्थ ‘उठना’ है और रात में कार्रवाई आरम्भ करने के प्रसंग में स्वाभाविक है।
- source_word: ፈቀዱ
  choice: चाहा
  rationale: यहाँ इच्छा या अभिप्राय व्यक्त होता है; ‘चाहा’ स्रोत के आशय को सरल और सटीक रखता है।
- source_word: ያድኅኑ
  choice: बचाना
  rationale: देवताओं को आग से निकालकर सुरक्षित करने का भाव है।
- source_word: አማልክቲሆሙ
  choice: अपने देवताओं
  rationale: बहुवचन और तृतीय पुरुष संबंधसूचक प्रत्यय, दोनों को स्पष्ट रूप से दर्शाता है।
- source_word: ሰረረ
  choice: झपटकर आगे बढ़ा
  rationale: क्रिया में तेजी से लपकने, उछलने या दौड़ पड़ने का भाव है; केवल ‘दौड़ा’ की अपेक्षा यह आकस्मिक और तीव्र गति बेहतर व्यक्त करता है।
- source_word: አራን
  choice: हारान
  rationale: अब्राम के भाई के लिए प्रचलित हिन्दी बाइबलीय नामरूप अपनाया गया है।
