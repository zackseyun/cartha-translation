  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: hi
  text: अपने पिता तेरह से पहले। और उन्होंने उसे कसदियों के ऊर में दफना दिया। फिर तेरह अपने पुत्रों समेत कसदियों के ऊर से लबानोन देश और कनान देश में जाने के लिए निकल पड़ा। वह हारान देश में बस गया, और अब्राम अपने पिता तेरह के साथ हारान में रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀበርዎ
  choice: उसे दफ़ना दिया
  rationale: क्रिया के तृतीय पुरुष बहुवचन कर्ता और एकवचन कर्म को स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ኡር፡ ዘከለዳዊያን
  choice: कसदियों का ऊर
  rationale: स्थाननाम और उससे जुड़े जातिवाचक संबंध को प्रचलित बाइबलीय हिन्दी रूप में रखा गया है।
- source_word: ከመ፡ ይምጽኡ
  choice: की ओर चला
  rationale: गमन के उद्देश्य/दिशा को सहज हिन्दी में व्यक्त करता है, बिना यह संकेत दिए कि वे दोनों गंतव्यों तक पहुँच गए थे।
- source_word: ኀደረ
  choice: बस गया / रहा
  rationale: एक ही मूल क्रिया को प्रसंगानुसार तेरह के स्थायी ठहरने के लिए ‘बस गया’ और अब्राम के साथ रहने के लिए ‘रहा’ अनूदित किया गया है।
- source_word: ሊባኖስ
  choice: लबानोन
  rationale: मूल स्थाननाम के निकट और हिन्दी बाइबलीय परंपरा में पहचाने जाने योग्य रूप।
- source_word: ካራን
  choice: हारान
  rationale: मूल पाठ के स्थाननाम का प्रचलित हिन्दी बाइबलीय रूप।
