  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभ का अपूर्ण वाक्यांश मूल पद-विभाजन के कारण ज्यों का त्यों संरक्षित है; उसे पिछले पद की जानकारी जोड़कर कृत्रिम रूप से पूरा नहीं किया गया।
