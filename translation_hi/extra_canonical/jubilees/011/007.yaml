  text: And if I tell them the truth, they will kill me, for their souls are attached to them.
translation:
  language: hi
  text: और यदि मैं उनसे सच कहूँ, तो वे मुझे मार डालेंगे, क्योंकि उनके प्राण उनसे जुड़े हुए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ
  choice: सच
  rationale: यहाँ प्रसंग में कही जाने वाली सत्य बात का अर्थ है; आधुनिक हिन्दी में ‘सच’ स्वाभाविक और स्पष्ट है।
- source_word: ይቀትሉኒ
  choice: वे मुझे मार डालेंगे
  rationale: क्रिया के घातक आशय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ነፍሶሙ
  choice: उनके प्राण
  rationale: मूल के ‘प्राण/जीवन/आत्मा’ संबंधी शब्द को अधिक ठोस अर्थ में सीमित किए बिना उसका गम्भीर भाव बनाए रखता है।
- source_word: ተለውት ... ኀቤሆሙ
  choice: उनसे जुड़े हुए हैं
  rationale: लगाव या आसक्ति के संबंध को व्यक्त करता है, पर उपासना का ऐसा भाव नहीं जोड़ता जो इस पंक्ति में स्पष्ट रूप से नहीं कहा गया।
theological_decisions:
- issue: अंतिम वाक्यांश में मूर्तिपूजा का निहितार्थ
  choice: केवल ‘उनसे जुड़े हुए हैं’ कहा गया
  alternative: ‘उनकी उपासना करने के लिए उनसे चिपके हैं’
  rationale: मूल पंक्ति लगाव बताती है, पर उपासना का उद्देश्य स्पष्ट रूप से नहीं कहती; इसलिए व्याख्यात्मक विस्तार से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मूल के संक्षिप्त कारणसूचक ढाँचे के निकट रखी गई है। ‘प्राण’ मूल की अर्थगत व्यापकता और धार्मिक-साहित्यिक गरिमा को बनाए रखता है।
