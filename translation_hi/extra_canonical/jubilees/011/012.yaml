  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। स्रोत-पाठ के आरम्भ का ‘अब्राम’ पिछले पद के विभाजन से आया अवशेष माना गया है, इसलिए उसका अनावश्यक दोहराव नहीं किया गया। जलाने की क्रिया की पुनरावृत्ति स्रोत के अनुरूप रखी गई है।
