  text: In that fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no person knew it.
translation:
  language: hi
  text: उस चौथे सप्ताह के चौथे वर्ष में, अब्राम रात को उठा और उसने मूर्तियों का घर जला दिया। उसने घर के भीतर की हर वस्तु जला दी, और किसी व्यक्ति को इसका पता नहीं चला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤተ፡ ጣዖታት
  choice: मूर्तियों का घर
  rationale: यह स्रोत के ‘मूर्तियों के घर/भवन’ का सीधा और स्वाभाविक हिन्दी रूप है; प्रसंग से आगे किसी विशिष्ट प्रकार के मंदिर का अर्थ आरोपित नहीं किया गया।
- source_word: አውዐየ
  choice: जला दिया
  rationale: क्रिया आग लगाकर भस्म करने या जलाने का बोध देती है; हिन्दी में पूर्ण घटना के लिए ‘जला दिया’ स्वाभाविक है।
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: किसी व्यक्ति को इसका पता नहीं चला
  rationale: शाब्दिक भाव ‘कोई व्यक्ति नहीं था जो जानता था’ है; चुना हुआ रूप गुप्त रूप से किए गए कार्य के प्रसंग में स्वाभाविक हिन्दी रखते हुए अज्ञान का अर्थ सुरक्षित रखता है।
