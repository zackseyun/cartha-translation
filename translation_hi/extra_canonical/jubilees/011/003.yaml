base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/003.yaml
  text: And in the days of Serug there arose wars and all the sons of men turned to making graven images and carved images and unclean things, and evil spirits were helping them and leading them astray, so that they might commit transgression and uncleanness.
translation:
  language: hi
  text: और सरूग[a] के दिनों में युद्ध छिड़ गए। सभी मनुष्य खुदी हुई मूर्तियाँ, नक्काशीदार प्रतिमाएँ और अशुद्ध वस्तुएँ बनाने लगे। दुष्ट आत्माएँ उनकी सहायता करतीं और उन्हें भटकाती थीं, ताकि वे अपराध और अशुद्धता करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेरोह’।
    reason: नाम का एक वैकल्पिक पाठ/लिप्यंतरण सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Serug / ሴሮኅ (साक्ष्य में नाम का रूप)
  choice: सरूग
  rationale: उत्पत्ति 11 की वंशावली में प्रचलित बाइबलीय नाम से संगति रखते हुए मानक रूप अपनाया गया; पांडुलिपीय/लिप्यंतरणगत वैकल्पिक रूप को पादटिप्पणी में रखा गया।
- source_word: sons of men
  choice: मनुष्यों के सभी पुत्र
  rationale: सामूहिक अर्थ को बनाए रखते हुए स्रोत की पारिवारिक-मानववंशीय अभिव्यक्ति को अत्यधिक सामान्यीकृत नहीं किया गया।
- source_word: graven images and carved images
  choice: खुदी हुई मूर्तियाँ, नक्काशीदार प्रतिमाएँ
  rationale: निकटार्थक दोनों पदों का भेद और स्रोत की पुनरुक्ति सुरक्षित रखी गई।
- source_word: evil spirits
  choice: दुष्ट आत्माएँ
  rationale: अलौकिक कर्ताओं को आधुनिक और स्पष्ट हिन्दी में व्यक्त करता है, बिना उनकी प्रकृति की अतिरिक्त व्याख्या किए।
- source_word: transgression and uncleanness
  choice: अपराध और अशुद्धता
  rationale: नैतिक/धार्मिक सीमा-उल्लंघन और अशुद्धता—दोनों अलग अवधारणाएँ बनाए रखी गईं।
theological_decisions:
- issue: मनुष्यों के पाप में दुष्ट आत्माओं की भूमिका
  choice: “सहायता करतीं और उन्हें भटकाती थीं”
  alternative: दुष्ट आत्माएँ उनसे पाप करवाती थीं
  rationale: स्रोत में मानवीय कर्म और आत्मिक बहकावे के बीच तनाव को बनाए रखा गया; दुष्ट आत्माओं को मनुष्यों की इच्छा का पूर्ण नियंत्रक नहीं बनाया गया।
- issue: उद्देश्यवाचक कथन
  choice: “ताकि वे अपराध और अशुद्धता करें”
  alternative: जिसके परिणामस्वरूप उन्होंने अपराध और अशुद्धता की
  rationale: उपलब्ध पाठ में व्यक्त उद्देश्य/परिणाम की दिशा को स्पष्ट रूप से उद्देश्यवाचक रखा गया, उसे केवल अनपेक्षित परिणाम में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। छोटे वाक्यों से सामान्य पाठक के लिए स्पष्टता बढ़ाई गई, जबकि मूर्तियों के दो निकटार्थक पद, दुष्ट आत्माओं की सक्रिय भूमिका और अपराध-अशुद्धता का द्विपद सुरक्षित रखा गया है।
