  yaml_path: translation/extra_canonical/jubilees/011/001.yaml
  text: In the thirty-fifth jubilee[1], in the third week, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.
translation:
  language: hi
  text: पैंतीसवें जुबली-चक्र[a] के तीसरे सप्ताह के पहले वर्ष में रऊ ने अपने लिए एक पत्नी ली। उसका नाम ओरा था; वह ऊर की बेटी और केसेद की पोती थी। उसने रऊ के लिए एक पुत्र को जन्म दिया, और इसी जुबली-चक्र के इसी सप्ताह के सातवें वर्ष में रऊ ने उसका नाम सेरोह रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में ‘पैंतीसवाँ’ है, अथवा इसी संख्या का कुछ विकृत पाठ; यह पुस्तक के आंतरिक कालक्रम के अनुरूप है।
    reason: textual_correction
lexical_decisions:
- source_word: እዮቤልው
  choice: जुबली-चक्र
  rationale: यह शब्द पचास-वर्षीय कालखंड को सूचित करता है। केवल ‘जुबली’ की तुलना में ‘जुबली-चक्र’ सामान्य हिन्दी पाठक को कालगणना का अर्थ अधिक स्पष्ट करता है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: शाब्दिक अर्थ ‘सात का समूह/सप्ताह’ है; जुबली की कालगणना में यह सात वर्षों का खंड है, पर मूल की संक्षिप्त अभिव्यक्ति बनाए रखने के लिए मुख्य पाठ में ‘सप्ताह’ रखा गया है।
- source_word: ራግው
  choice: रऊ
  rationale: वंशावली के इस नाम का मानक बाइबिलीय हिन्दी रूप अपनाया गया है।
- source_word: ኦራ
  choice: ओरा
  rationale: गीज़ नाम का सीधा और स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: ኡር
  choice: ऊर
  rationale: व्यक्तिनाम को नगर ‘ऊर’ के प्रचलित हिन्दी रूप के अनुरूप लिप्यंतरित किया गया है; यहाँ संदर्भ व्यक्ति का है।
- source_word: ኬሴድ
  choice: केसेद
  rationale: गीज़ व्यंजन-स्वर क्रम के निकट पारदर्शी लिप्यंतरण।
- source_word: ሴሮኅ
  choice: सेरोह
  rationale: अंतिम गीज़ अक्षर के कंठ्य/श्वासयुक्त मूल्य को दर्शाने और स्रोत-रूप की पहचान बनाए रखने वाला लिप्यंतरण।
