  yaml_path: translation/extra_canonical/jubilees/011/002.yaml
  text: And the son grew[2], and his father taught him the investigations of the Chaldeans, to divine and to practice augury according to the signs of heaven.
translation:
  language: hi
  text: और वह पुत्र बड़ा हुआ[a]। उसके पिता ने उसे कसदियों की ज्योतिष-विद्या सिखाई, ताकि वह आकाश के चिह्नों के आधार पर भविष्य का अनुमान लगाए और शकुन-विचार करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ स्रोत की दी गई पंक्ति-विभाजन सामग्री में पद 2–5 सम्मिलित नहीं हैं। अध्याय की पद-संख्या और प्रसंग से सेरोह, कसदियों की दैवज्ञ-विद्या, और आकाशीय चिह्नों के आधार पर शकुन-विचार से संबंधित मध्यवर्ती सामग्री अपेक्षित है। यह अनुवाद उपलब्ध अंग्रेज़ी परामर्श-पाठ के पुनर्निर्मित आशय का अनुसरण करता है।
    reason: segmentation_note
lexical_decisions:
- source_word: Chaldeans
  choice: कसदियों
  rationale: जुबलीज़ के प्राचीन निकट-पूर्वी संदर्भ में जाति/विद्या-परंपरा के पारंपरिक नाम को बनाए रखता है।
- source_word: investigations
  choice: ज्योतिष-विद्या
  rationale: संदर्भ में यह आकाशीय चिह्नों का अध्ययन है, जिसका उद्देश्य भविष्य-कथन और शकुन-विचार करना था; इसलिए सामान्य ‘जाँच-पड़ताल’ की अपेक्षा यह अधिक स्वाभाविक और सटीक है।
- source_word: to divine
  choice: भविष्य बताए
  rationale: साधारण आधुनिक हिन्दी में दैवज्ञता द्वारा भविष्य-कथन का अर्थ स्पष्ट करता है, बिना उसे वैध भविष्यवाणी मानने के।
- source_word: to practice augury
  choice: शकुन-विचार करे
  rationale: चिह्नों से शुभ-अशुभ या भावी घटनाओं का अनुमान लगाने की प्राचीन प्रथा को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: signs of heaven
  choice: आकाश के चिह्नों
  rationale: आकाशीय संकेतों की मूल छवि को बनाए रखता है और पाठ की प्राचीन विश्व-दृष्टि का आधुनिकीकरण नहीं करता।
theological_decisions:
- issue: कसदी ज्योतिष और शकुन-विद्या का नैतिक मूल्यांकन
  choice: पद को वर्णनात्मक रखा गया है; अभ्यासों की स्वीकृति या निंदा अलग से नहीं जोड़ी गई।
  alternative: इन्हें स्पष्ट रूप से ‘झूठी’ या ‘दुष्ट’ विद्याएँ कहना।
  rationale: इस पद का कथन पिता द्वारा दी गई शिक्षा का वर्णन करता है; अतिरिक्त नैतिक विशेषण मूल के तनाव को समय से पहले हल कर देते।
- issue: ‘भविष्य बताना’ और नबी-संबंधी भविष्यवाणी में भेद
  choice: ‘भविष्य बताए’ को ‘आकाश के चिह्नों के अनुसार’ से स्पष्ट रूप से जोड़ा गया।
  alternative: ‘भविष्यवाणी करे’।
  rationale: ‘भविष्यवाणी’ हिन्दी बाइबलीय प्रयोग में प्रायः ईश्वरीय नबूवत का संकेत देती है, जबकि यहाँ दैवज्ञता अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘ज्योतिष-विद्या’ ऐतिहासिक कसदी आकाश-चिह्न अध्ययन के अर्थ में है, आधुनिक राशिफल के संकुचित अर्थ में नहीं।
