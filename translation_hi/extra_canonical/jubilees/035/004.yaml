  text: 'that is in my heart: that all my days I think good for all. And why should I not do this thing?'
translation:
  language: hi
  text: मेरे मन में यही है कि मैं जीवन भर सबका भला सोचूँ। फिर मैं यह काम क्यों न करूँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने पाठ में इसके आगे यह भी है: “कि मैं अपने पिता और अपने भाई का आदर करूँ।” यह वाक्यांश यहाँ दिए गए गीइज़ स्रोत-पाठ में नहीं है।'
    reason: previous_rendering
lexical_decisions:
- source_word: ውስተ፡ ልብየ
  choice: मेरे मन में
  rationale: शाब्दिक अर्थ ‘मेरे हृदय में’ है; आधुनिक हिन्दी में विचार या अभिप्राय के लिए ‘मेरे मन में’ अधिक स्वाभाविक है।
- source_word: ኵሎ፡ መዋዕለ
  choice: जीवन भर
  rationale: शाब्दिक ‘अपने सभी दिनों में’ को सहज और अर्थनिष्ठ हिन्दी में व्यक्त करता है।
- source_word: እሐሊ፡ ሠናየ፡ ለኵሉ
  choice: मैं सबका भला सोचूँ
  rationale: क्रिया ‘सोचना/विचार करना’, ‘भला’, और ‘सबके लिए’—इन तीनों स्रोत-तत्त्वों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: አፎ፡ ኢይገብር፡ ዘንተ፡ ነገረ
  choice: फिर मैं यह काम क्यों न करूँ?
  rationale: नकारात्मक आलंकारिक प्रश्न को आधुनिक हिन्दी के स्वाभाविक रूप में रखा गया है; ‘ነገረ’ यहाँ ‘बात/कार्य’ के अर्थ में है।
theological_decisions:
- issue: पिता और भाई का आदर करने वाली पंक्ति
  choice: मुख्य पाठ में शामिल नहीं की गई
  alternative: ‘कि मैं अपने पिता और अपने भाई का आदर करूँ’ जोड़ना
  rationale: यह वाक्यांश उपलब्ध गीइज़ स्रोत-पंक्ति में नहीं है। स्रोत से बाहर की सामग्री जोड़ने के बजाय पुराने विस्तृत पाठ को केवल पाठांतर-संबंधी टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हृदय’ के स्थान पर प्रसंगानुकूल ‘मन’, और ‘मेरे सभी दिनों में’ के स्थान पर स्वाभाविक ‘जीवन भर’ चुना गया है। आलंकारिक प्रश्न की खुली प्रेरक शक्ति बनाए रखी गई है।
