  yaml_path: translation/extra_canonical/jubilees/035/026.yaml
  text: Bury me near Abraham my father in the double cave in the field of Ephron the Hittite, which Abraham acquired as a burial place there in the land of Canaan. In the tomb which I dug for myself there, bury me.
translation:
  language: hi
  text: मुझे मेरे पिता अब्राहम के पास, हित्ती एप्रोन के खेत की दोहरी गुफा में दफनाना, जिसे अब्राहम ने कनान देश में दफ़नाने के स्थान के रूप में प्राप्त किया था। वहाँ जो कब्र मैंने अपने लिए खोदी है, उसी में मुझे दफनाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባዐት፡ ዘካዕበት
  choice: दोहरी गुफा
  rationale: शाब्दिक रूप से यह पदबंध ‘दूसरी/दोहरी गुफा’ कहा जा सकता है। प्रसंग और प्रचलित पहचान के अनुसार ‘दोहरी गुफा’ मुख्य पाठ में स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ኤፍሮን፡ ኬጥያዊ
  choice: हित्ती एप्रोन
  rationale: व्यक्तिनाम और जातिनाम को आधुनिक हिन्दी बाइबलीय शैली में स्पष्ट और संक्षिप्त रूप से रखा गया है।
- source_word: ዘአጥረየ፡ አብርሃም
  choice: जिसे अब्राहम ने … प्राप्त किया था
  rationale: क्रिया में किसी स्थान को अपने अधिकार में लेने या अर्जित करने का भाव है; ‘प्राप्त किया’ खरीद की विधि को अनावश्यक रूप से अधिक स्पष्ट किए बिना इस अर्थ को रखता है।
- source_word: መቃብር
  choice: कब्रिस्तान / कब्र
  rationale: पहले प्रयोग में दफनाने के स्थान का सामान्य अर्थ है, इसलिए ‘कब्रिस्तान’; दूसरे में खोदी गई विशिष्ट समाधि है, इसलिए ‘कब्र’।
