translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आदेशात्मक स्वर को ‘दफनाना’ से स्वाभाविक हिन्दी में व्यक्त किया गया है; अंतिम वाक्य की पुनरुक्ति मूल की जोरदार अभिव्यक्ति को बनाए रखती है।
