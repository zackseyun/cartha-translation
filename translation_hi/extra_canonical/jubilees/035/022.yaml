  text: और मैं तुमसे शपथ खाकर कहता हूँ कि मैं उससे प्रेम करूँगा और अपने जीवन भर उसका बुरा नहीं, बल्कि केवल उसका भला चाहूँगा।” और उसने इन सब बातों के विषय में उसे शपथपूर्वक यह वचन दिया।
  philosophy: optimal-equivalence
