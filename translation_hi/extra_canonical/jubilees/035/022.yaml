- source_word: እምሕል
  choice: मैं शपथ खाता हूँ
  rationale: स्रोत का प्रत्यक्ष, वर्तमानकालिक शपथ-वचन आधुनिक हिन्दी में इसी स्वाभाविक और गरिमापूर्ण रूप में व्यक्त होता है।
- source_word: አፈቅር
  choice: मैं उससे प्रेम करूँगा
  rationale: शपथ के भावी, जीवनपर्यन्त पालन को हिन्दी में भविष्यकाल से स्पष्ट किया गया है; कर्मवाचक सर्वनाम स्रोत की तरह बनाए रखा गया है।
- source_word: ኢይትኄሠሥ፡ ሎቱ፡ እኩየ
  choice: उसका बुरा नहीं ... चाहूँगा
  rationale: शाब्दिक भाव ‘उसके लिए बुराई न खोजना’ है; हिन्दी में ‘उसका बुरा चाहना’ उसी आशय का स्वाभाविक प्रयोग है और इसे सक्रिय हानि करने तक सीमित नहीं करता।
- source_word: ዘእንበለ፡ ሠናይ
  choice: केवल भला
  rationale: बुराई के निषेध और भलाई की विशिष्टता के स्रोतगत विरोध को संक्षिप्त रूप में सुरक्षित रखा गया है।
- source_word: ወመሐለ፡ ላቲ
  choice: तब उसने ... उससे शपथ खाई
  rationale: वक्ता के शपथ लेने की कथात्मक पुष्टि को स्पष्ट रखते हुए स्त्रीलिंग सम्बोधन का स्वाभाविक हिन्दी सर्वनाम दिया गया है।
