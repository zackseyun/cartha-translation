lexical_decisions:
- source_word: እገብር፡ ኵሎ፡ ዘትስእሊ
  choice: तुम मुझसे जो कुछ माँगोगी, वह सब मैं करूँगा
  rationale: मूल के ‘जो कुछ तुम माँगो’ और ‘सब करूँगा’ दोनों भावों को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ኢየአቢ፡ ስእለተኪ
  choice: तुम्हारी विनती अस्वीकार नहीं करूँगा
  rationale: क्रिया का भाव अनुरोध को न ठुकराने या नकारने का है; ‘अस्वीकार’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: ታብአኒ
  choice: मुझे ले जाकर
  rationale: संदर्भ शव को उठाकर दफ़नाने के लिए ले जाने का है; हिन्दी में केवल ‘उठाना’ की अपेक्षा ‘ले जाकर’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ቅሩበ፡ ሳራ
  choice: सारा के पास
  rationale: स्थान-संबंधी ‘निकट’ को सरल आधुनिक हिन्दी में ‘के पास’ कहा गया है।
- source_word: ትትፋቀሩ ... በበይናቲክሙ
  choice: एक-दूसरे से प्रेम करना
  rationale: पारस्परिक प्रेम की आज्ञा को हिन्दी के सहज पारस्परिक रूप में व्यक्त किया गया है।
