  text: उसने कहा, “तुम मुझसे जो कुछ माँगोगी, वह सब मैं करूँगा और तुम्हारी विनती अस्वीकार नहीं करूँगा।” तब उसने उससे कहा, “मैं तुमसे यह माँगती हूँ कि जिस दिन मैं मरूँ, उस दिन तुम मुझे ले जाकर अपने पिता की माता सारा के पास दफ़नाना, और तुम और याकूब एक-दूसरे से प्रेम करना,
