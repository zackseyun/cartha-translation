  yaml_path: translation/extra_canonical/jubilees/035/002.yaml
  text: And Jacob said to her, "I will do all that you have commanded me, for this matter will be an honor and greatness to me, and righteousness before God, that I should honor them."
translation:
  language: hi
  text: और याकूब ने उससे कहा, “जो कुछ करने की तूने मुझे आज्ञा दी है, वह सब मैं करूँगा; क्योंकि यह बात मेरे लिए सम्मान और महिमा, और परमेश्वर के सामने धार्मिकता होगी कि मैं उनका आदर करूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘአዘዝክኒ
  choice: जो कुछ तूने मुझे आज्ञा दी है
  rationale: क्रिया के स्त्रीलिंग एकवचन संबोधन और प्रथम पुरुष एकवचन कर्म-प्रत्यय को स्पष्ट रखते हुए रिबका से याकूब के सीधे संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ክብረ ፡ ወዕበየ
  choice: सम्मान और प्रतिष्ठा
  rationale: दोनों निकटार्थक संज्ञाओं को अलग बनाए रखता है; यहाँ ዕበየ का आशय शारीरिक आकार नहीं, बल्कि महत्ता अथवा प्रतिष्ठा है।
- source_word: ወጽድቀ ፡ ቅድመ ፡ እግዚአብሔር
  choice: और परमेश्वर के सामने धार्मिकता
  rationale: ‘परमेश्वर के सामने’ वाले न्यायपरक संबंध और धार्मिकता की संज्ञात्मक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ከመ ፡ አክብሮሙ
  choice: उनका आदर करना
  rationale: बहुवचन कर्म ‘उनका’ को बनाए रखता है और आशयगत क्रियार्थ को स्वाभाविक हिन्दी में वाक्य के विषय के रूप में रखता है।
theological_decisions:
- issue: परमेश्वर के सामने ‘धार्मिकता’ का स्वरूप
  choice: ‘धार्मिकता’ संज्ञा को यथावत रखा गया
  alternative: ‘सही काम’ या ‘धर्म का काम’
  rationale: स्रोत में प्रयुक्त ጽድቅ के नैतिक-धार्मिक भार को कम नहीं किया गया और इसे किसी विशिष्ट सम्प्रदायगत धार्मिकता-सिद्धांत के रूप में भी नहीं समझाया गया।
- issue: ‘उनका’ का संदर्भ
  choice: बहुवचन सर्वनाम को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: पिछले पद के आधार पर संदर्भित व्यक्तियों के नाम जोड़ना
  rationale: इस पद में स्वयं नाम नहीं दिए गए हैं; पद-सीमा का सम्मान करते हुए स्रोत की संदर्भ-निर्भरता और संभावित अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। माता से पुत्र के संबोधन में ‘तूने’ मूल के स्त्रीलिंग एकवचन प्रत्यक्ष संबोधन को स्वाभाविक पारिवारिक हिन्दी में दर्शाता है। केवल जुबिलीज़ 35:2 की सामग्री रखी गई है; पिछले पद की सामग्री नहीं जोड़ी गई।
