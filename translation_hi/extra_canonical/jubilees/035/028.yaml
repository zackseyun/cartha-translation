base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/028.yaml
  text: And love one another, my sons, among yourselves, each loving his brother as a man loves his own life, and let a man seek—”
translation:
  language: hi
  text: “और, मेरे पुत्रों, तुम आपस में एक-दूसरे से प्रेम रखो; हर एक अपने भाई से वैसा प्रेम करे, जैसा मनुष्य अपने आप से प्रेम करता है; और हर मनुष्य खोजे—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታፈቅሩ / ያፈቅር
  choice: प्रेम रखना / प्रेम करे
  rationale: प्रेम के लिए प्रयुक्त गीइज़ क्रिया का सीधा और स्वाभाविक हिन्दी रूप; पहले बहुवचन उपदेश और फिर प्रत्येक व्यक्ति पर केंद्रित एकवचन को बनाए रखा गया है।
- source_word: ነፍሶ
  choice: अपने प्राण
  rationale: शब्द का अर्थ ‘उसका प्राण/जीवन/स्वयं’ हो सकता है। ‘अपने प्राण’ मूल की जीवन-केंद्रित अभिव्यक्ति और उसकी अर्थ-व्याप्ति को बनाए रखता है।
- source_word: ይኀሥሥ
  choice: खोजे
  rationale: क्रिया के ‘ढूँढ़ना/खोजना/चाहना’ अर्थों में ‘खोजे’ सबसे सीधा है; अगले पद में आने वाले कर्म को यहाँ पहले से नहीं जोड़ा गया।
- source_word: ብእሲ
  choice: हर मनुष्य
  rationale: यह संज्ञा कर्ता है, कर्म नहीं। सामान्य उपदेशात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘हर मनुष्य’ चुना गया।
theological_decisions:
- issue: अपने भाई से प्रेम की तुलना अपने प्राण से प्रेम करने से
  choice: तुलना को मूल रूप में खुला रखा गया
  alternative: ‘अपने समान’ या ‘अपने जीवन जितना’
  rationale: ‘अपने प्राण’ मूल ነፍሶ के अधिक निकट है और इसे किसी अधिक परिचित धार्मिक सूत्र में बदलने से बचता है।
- issue: अंतिम अधूरा वाक्यांश
  choice: ‘और हर मनुष्य खोजे—’ पर वाक्य खुला छोड़ा गया
  alternative: अगले पद का संभावित कर्म जोड़कर वाक्य पूरा करना
