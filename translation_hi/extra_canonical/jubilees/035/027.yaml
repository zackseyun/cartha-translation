base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/027.yaml
  text: 'And I command you, my sons: do righteousness and uprightness on the earth, so that Yahweh may bring upon you all that Yahweh said he would do for Abraham and for his seed.'
translation:
  language: hi
  text: 'और मैं तुम्हें आज्ञा देता हूँ, मेरे पुत्रों: पृथ्वी पर धार्मिकता और सीधाई का आचरण करो, ताकि याहवे तुम पर वह सब ले आए जिसके विषय में उसने कहा था कि वह उसे अब्राहम और उसके वंश के लिए करेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ (ṣədq)
  choice: धार्मिकता
  rationale: यह नैतिक और वाचा-संबंधी सही आचरण को व्यक्त करता है और स्रोत के अमूर्त संज्ञा-रूप को बनाए रखता है।
- source_word: ርትዐ (rətʿ)
  choice: खराई
  rationale: यह सीधेपन, निष्कपटता और ठीक आचरण के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: እግዚአብሔር (ʾƎgziʾabəḥer)
  choice: याहवे
  rationale: इस प्रसंग में यह इस्राएल के परमेश्वर के व्यक्तिगत नाम का प्रतिनिधित्व करता है; POB की नाम-नीति और परामर्श-पाठ के अनुरूप 'याहवे' रखा गया है।
- source_word: ዘርኡ (zarʾu)
  choice: उसके वंश
  rationale: स्रोत का शब्द संतान अथवा सामूहिक वंश दोनों को सूचित कर सकता है; 'वंश' इस व्यापकता को सुरक्षित रखता है।
- source_word: ያምጽእ (yāmṣəʾ)
  choice: पूरा करे
  rationale: शाब्दिक अर्थ 'ले आए/पहुँचाए' है, पर प्रतिज्ञात बातों के संदर्भ में हिन्दी में 'पूरा करे' आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: अब्राहम और उसके वंश के लिए कही गई बातों का स्वरूप
  choice: वह सब पूरा करे जिसे करने की बात उसने अब्राहम और उसके वंश से कही थी
  alternative: वह सब तुम पर ले आए जो याहवे ने अब्राहम और उसके वंश के विषय में कहा था
  rationale: स्रोत में 'ले आए' और 'वचन/बात' की भाषा है, पर लक्ष्य प्रतिज्ञा की पूर्ति है। चुना हुआ रूप वाचा की बात को बनाए रखता है, बिना उसकी विषयवस्तु या शर्तों को अतिरिक्त रूप से परिभाषित किए।
- issue: धार्मिक आचरण और प्रतिज्ञा के बीच संबंध
