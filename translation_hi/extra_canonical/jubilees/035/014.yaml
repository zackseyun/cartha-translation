  text: And now my heart is troubled because of all his deeds, and neither he nor his seed will be saved, for they are those who will be destroyed from the earth and those who will be uprooted from under heaven, because he has forsaken the God of Abraham and gone after his wives and after
translation:
  language: hi
  text: और अब उसके सभी कामों के कारण मेरा हृदय व्याकुल है। न तो वह, न उसका वंश बचाया जाएगा, क्योंकि वे ही हैं जो पृथ्वी पर से नष्ट किए जाएँगे और आकाश के नीचे से उखाड़ दिए जाएँगे, क्योंकि उसने अब्राहम के परमेश्वर को त्याग दिया है और अपनी पत्नियों के पीछे चला गया है और—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीज़ स्रोत-अंश यहाँ वाक्य के बीच में समाप्त होता है।
    reason: दिए गए मूल-पाठ की अपूर्ण अंतिम पदावली को पाठक के लिए स्पष्ट करना और अनुमान से वाक्य पूरा करने से बचना।
lexical_decisions:
- source_word: ይትሀወክ
  choice: व्याकुल है
  rationale: यह क्रिया मन के अशांत या उद्विग्न होने को व्यक्त करती है; आधुनिक हिन्दी में ‘हृदय व्याकुल है’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ሊድኅን
  choice: बचाया जाएगा
  rationale: मूल क्रिया निष्क्रिय रूप में बचाए जाने या उद्धार पाने का भाव देती है। ‘बचाया जाएगा’ व्यापक अर्थ बनाए रखता है और अनावश्यक रूप से विशिष्ट धार्मिक पारिभाषिकता नहीं जोड़ता।
- source_word: ይትሐጐሉ
  choice: नष्ट किए जाएँगे
  rationale: गीज़ क्रिया यहाँ विनाश या मिट जाने का भाव देती है और इसका संबंध ‘पृथ्वी पर से’ से है; नवीनतम स्रोत-समीक्षा के अनुसार इसे ‘उखाड़े जाएँगे’ से नहीं बदला गया।
- source_word: ይሤረዉ
  choice: उखाड़ दिए जाएँगे
  rationale: क्रिया जड़ से उखाड़ने या हटा देने का चित्र देती है और मूल में ‘आकाश के नीचे से’ के साथ जुड़ी है।
- source_word: ኀደገ
  choice: त्याग दिया है
  rationale: संदर्भ में छोड़ देने या परित्याग करने का भाव है; ‘त्याग दिया’ निष्ठा से विमुख होने की गंभीरता व्यक्त करता है।
- source_word: ሖረ፡ ድኅረ
  choice: के पीछे ... गया है
  rationale: शाब्दिक अर्थ ‘पीछे गया’ है, जो किसी के प्रभाव या उपासना का अनुसरण करने की संभावित अर्थ-छाया को बिना अधिक व्याख्या के बनाए रखता है। वाक्य के उपलब्ध अंश में क्रिया का हिन्दी रूप ‘पीछे’ के साथ स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ‘बचाया जाएगा’ में उद्धार का आशय
  choice: सामान्य निष्क्रिय अभिव्यक्ति ‘बचाया जाएगा’
  alternative: ‘उद्धार पाएगा’
  rationale: मूल में बचाए जाने का अर्थ है, पर इस प्रसंग में लौकिक विनाश और अंतिम उद्धार के बीच तनाव को निश्चित रूप से हल नहीं किया गया; सामान्य अभिव्यक्ति दोनों संभावनाएँ खुली रखती है।
- issue: अब्राहम के परमेश्वर को त्यागने के बाद पत्नियों के पीछे जाना
  choice: मूल के संबंध को ज्यों का त्यों रखा गया
  alternative: इसे स्पष्ट रूप से मूर्तिपूजा या धर्मत्याग कहना
  rationale: ऐसी व्याख्या संदर्भ में संभव है, पर उपलब्ध गीज़ अंश केवल त्यागने और पीछे जाने की भाषा देता है; इसलिए कोई अतिरिक्त सांप्रदायिक या व्याख्यात्मक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथन रखा गया है। विनाश और उखाड़े जाने वाली दोनों समानांतर पंक्तियों का क्रम गीज़ मूल के अनुसार रखा गया है। अंतिम अपूर्ण पदावली को दीर्घ विराम और पाद-टिप्पणी से दर्शाया गया है।
