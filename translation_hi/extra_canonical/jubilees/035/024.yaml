base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/024.yaml
  text: And they ate and drank, she and her sons, that night; and she died in that night, in the third year of the seventh week of the forty-first jubilee. And her two sons, Esau and Jacob, buried her in the double cave near Sarah, the mother of their father.
translation:
  language: hi
  text: उस रात वह और उसके पुत्रों ने खाया-पिया, और उसी रात वह मर गई। यह इकतालीसवीं जुबली के सातवें सप्ताह का तीसरा वर्ष था।[a] उसके दोनों पुत्रों, एसाव और याकूब, ने उसे उनके पिता की माता सारा के पास की दोहरी गुफा में दफ़नाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सप्ताह’ सात वर्षों का एक काल-चक्र है; वाक्य रिबका की आयु नहीं, बल्कि उसकी मृत्यु की तिथि बताता है।
    reason: ‘सप्ताह’ की प्राचीन कालगणनात्मक अर्थवत्ता स्पष्ट करता है और गलत आयु-व्याख्या से बचाता है।
lexical_decisions:
- source_word: አዮቤልዉ
  choice: जुबली
  rationale: यह स्रोत के उनचास-वर्षीय कालखंड का पारिभाषिक नाम है; इसे सामान्य ‘उत्सव-वर्ष’ में बदलने से कालगणना अस्पष्ट हो जाती।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल शब्द सात की इकाई दर्शाता है; आयु की इस गणना में इसका अर्थ सात वर्ष है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ባዐት፡ እንተ፡ ክልኤ
  choice: दोहरी गुफा
  rationale: गीज़ पाठ का औपचारिक अर्थ सुरक्षित रखा गया है; यह मकपेला की पारंपरिक पहचान की ओर संकेत करता है, पर स्रोत में यहाँ स्थान-नाम स्पष्ट रूप से नहीं है।
- source_word: ቀሩበ፡ ሳራ
  choice: सारा के पास
  rationale: दफ़नाने के प्रसंग में ‘पास’ स्वाभाविक हिन्दी है और स्रोत की स्थानिक निकटता को बनाए रखता है।
theological_decisions:
- issue: रिबका की मृत्यु के समय की कालगणना
  choice: 'इसे उसकी आयु के रूप में अनूदित किया गया: तीन जुबली, एक सप्ताह और एक वर्ष'
  alternative: इसे इकतालीसवीं जुबली के सातवें सप्ताह के तीसरे वर्ष की तिथि मानना
