  text: And she called Jacob before Esau’s eyes and instructed him according to the words that she had spoken with Esau. And he said, “I will do your pleasure. Trust me that no evil may come out from me or from my children against Esau, and I will not be first in anything except in love.”
translation:
  language: hi
  text: तब रिबका ने एसाव के सामने याकूब को बुलाया और उसे वही निर्देश दिया जो उसने एसाव से कहा था। याकूब ने कहा, “मैं आपकी इच्छा पूरी करूँगा। मेरा विश्वास कीजिए कि मेरी ओर से या मेरे बच्चों की ओर से एसाव के विरुद्ध कोई बुराई नहीं होगी, और प्रेम को छोड़ मैं किसी भी बात में आगे नहीं होऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለዔሳው
  choice: एसाव के सामने
  rationale: शाब्दिक अर्थ ‘एसाव की आँखों के सामने’ है; आधुनिक हिन्दी में ‘एसाव के सामने’ वही प्रत्यक्ष उपस्थिति स्वाभाविक रूप से व्यक्त करता है।
- source_word: እገብር፡ ሥምረተኪ
  choice: मैं आपकी इच्छा पूरी करूँगा
  rationale: ሥምረት यहाँ इच्छा/प्रसन्नता को दर्शाता है; वाक्य का आशय रिबका के अनुरोध को मानना है।
- source_word: ተሐበይኒ
  choice: मुझ पर भरोसा रखिए
  rationale: प्रासंगिक क्रिया विश्वास या भरोसा करने का आग्रह व्यक्त करती है; इसे ‘मुझे छिपाइए’ समझना स्रोत-संगत नहीं है।
- source_word: ኢይወፅእ፡ እምኔየ፡ ወእምውሉድየ፡ እኩይ፡ ላዕለ፡ ዔሳው
  choice: मेरी ओर से या मेरे बच्चों की ओर से एसाव के विरुद्ध कोई बुराई नहीं होगी
  rationale: ‘निकलना’ का स्रोत-रूप हिन्दी में मुहावरेदार ढंग से ‘ओर से ... होना’ किया गया है, जबकि भावी अहित का निषेध सुरक्षित है।
- source_word: ወኢይቀድም፡ ምንተኒ፡ ዘእንበለ፡ ተፋቅሮ
  choice: और प्रेम को छोड़ मैं किसी भी बात में आगे नहीं होऊँगा
  rationale: प्रथम-पुरुष भाव और ‘आगे/प्रथम होना’ दोनों को बनाए रखा गया है; केवल प्रेम में आगे रहने का अपवाद भी स्पष्ट है।
