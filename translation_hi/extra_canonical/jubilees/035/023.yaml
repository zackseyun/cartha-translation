  choice: प्रतिज्ञा को एसाव के विरुद्ध अहित न करने और केवल प्रेम में आगे रहने की व्यक्तिगत प्रतिबद्धता के रूप में रखा गया है।
  alternative: इसे दोनों भाइयों पर लागू सामान्य कथन—‘हमारे बीच प्रेम के सिवा कुछ आगे न आए’—के रूप में पढ़ना।
  rationale: स्रोत में प्रथम-पुरुष क्रियारूप याकूब के अपने आचरण पर बल देता है; इसलिए पारस्परिक सामंजस्य का भाव जोड़कर व्याकरणिक व्यक्ति को बदलना उचित नहीं।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी अपनाई गई है। पारिवारिक संवाद में रिबका के लिए आदरसूचक ‘आप’ रखा गया है। ‘प्रेम को छोड़ ... आगे नहीं होऊँगा’ स्रोत की असामान्य किंतु अर्थपूर्ण तुलना को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखता है।
