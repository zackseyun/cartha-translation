  text: He will kill him after your death. And you know all that he has done from the day his brother Jacob went to Haran until this day, how with all his heart he has forsaken us and has done
translation:
  language: hi
  text: वह तुम्हारी मृत्यु के बाद उसे मार डालेगा। और तुम वह सब जानते हो जो उसने उस दिन से, जब उसका भाई याकूब हारान गया था, आज तक किया है—कि किस प्रकार उसने अपने पूरे मन से हमें त्याग दिया है और किया है…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቅትሎ
  choice: उसे मार डालेगा
  rationale: क्रिया का भाव भावी काल में ‘वह उसे मारेगा’ है; ‘मार डालेगा’ लक्ष्य भाषा में स्पष्ट और स्वाभाविक है।
- source_word: ኵሎ፡ መጠነ፡ ገብረ
  choice: वह सब … जो उसने … किया है
  rationale: शाब्दिक ‘उसके किए का पूरा परिमाण’ के बजाय इस मुहावरे का स्वाभाविक हिन्दी अर्थ दिया गया है, बिना कर्ता को याकूब मानने की पिछली त्रुटि दोहराए।
- source_word: ኀደገነ
  choice: हमें त्याग दिया
  rationale: यह केवल भौतिक रूप से छोड़ने के बजाय संबंध-विच्छेद या परित्याग का भाव व्यक्त करता है।
- source_word: በኵሉ፡ ልቡ
  choice: अपने पूरे मन से
  rationale: मूल के ‘अपने सारे हृदय से’ का आधुनिक, सहज हिन्दी समतुल्य, जो पूर्ण अभिप्राय का भाव बनाए रखता है।
- source_word: ካራን
  choice: हारान
  rationale: बाइबिल में प्रचलित स्थान-नाम का हिन्दी रूप।
theological_decisions:
- issue: अंतिम अधूरा वाक्यांश
  choice: ‘और किया है…’ के रूप में अधूरापन बनाए रखा
  alternative: अगले पद से आशय लेकर वाक्य पूरा करना
  rationale: प्रदत्त मूल पाठ ወገብረ (‘और उसने किया’) पर समाप्त होता है; अनुवाद में अगले पद की सामग्री जोड़कर अर्थ को चुपचाप पूरा नहीं किया गया।
- issue: सर्वनामों के पूर्ववर्ती पात्र
  choice: मूल के सर्वनाम बनाए रखे और केवल स्पष्ट नाम ‘उसका भाई याकूब’ दिया
  alternative: संदर्भ के आधार पर सभी सर्वनामों की जगह पात्रों के नाम रखना
  rationale: मूल पाठ में कर्ता और कर्म सर्वनाम रूप में हैं; अनावश्यक नाम जोड़ने से वास्तविक संदर्भगत अस्पष्टता मिट जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद स्वयं अधूरे संयोजक वाक्यांश पर समाप्त होता है, इसलिए दीर्घविराम से उसके आगे जारी रहने का संकेत दिया गया है।
