  text: And Isaac said to her, “I also know and see Jacob’s conduct toward us, that with all his heart he honors us. I loved Esau before Jacob from the time he was born first, but now I love Jacob more than Esau, because he has made his deeds very evil, and there is no righteousness in him, for all his ways are injustice and violence, and there is no righteousness around him.”
translation:
  language: hi
  text: और इसहाक ने उससे कहा, “मैं भी हमारे प्रति याकूब के व्यवहार को जानता और देखता हूँ कि वह अपने पूरे मन से हमारा आदर करता है। मैं याकूब से अधिक एसाव से प्रेम करता था, क्योंकि वह पहले जन्मा था; पर अब मैं एसाव से अधिक याकूब से प्रेम करता हूँ, क्योंकि एसाव ने अपने कामों को अत्यन्त बुरा बना लिया है,[a] और उसमें कोई धार्मिकता नहीं है। उसके सभी मार्ग अन्याय और हिंसा हैं, और उसके चारों ओर कहीं भी धार्मिकता नहीं है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसके काम बहुत बुरे हो गए हैं।”
    reason: गीज़ वाक्यांश की सक्रिय अभिव्यक्ति और परिणामसूचक मुहावरे के बीच सम्भव हिन्दी रूपांतर।
  - marker: b
    text: अर्थात, उसके चारों ओर कहीं भी धार्मिकता नहीं है; इसे “उसमें धार्मिकता बिलकुल नहीं है” भी समझा जा सकता है।
    reason: አውዶ का शाब्दिक स्थानवाचक अर्थ ‘आस-पास’ है, पर यहाँ यह सर्वथा-अभाव पर बल भी दे सकता है।
lexical_decisions:
- source_word: ግብረ፡ ያዕቆብ፡ ዘምስሌነ
  choice: हमारे प्रति याकूब का व्यवहार
  rationale: ‘कार्य/आचरण’ और ‘हमारे साथ/हमारे प्रति’ के संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በኵሉ፡ ልቡ፡ ውእቱ፡ ያከብረነ
  choice: वह अपने पूरे मन से हमारा आदर करता है
  rationale: स्रोत के ‘अपने सारे हृदय से’ और बहुवचन ‘हमारा आदर करता है’ को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: አብዝኀ፡ አእክዮ፡ ምግባሪሁ
  choice: उसने अपने कामों को अत्यन्त बुरा बना लिया है
  rationale: አብዝኀ को तुलनात्मक ‘अधिक बुरा’ न मानकर तीव्रतासूचक रूप में, तथा वाक्यांश की सक्रिय क्रियात्मकता को बनाए रखता है।
- source_word: ዐመፃ፡ ወግፍዕ
  choice: अन्याय और हिंसा
  rationale: दोनों नैतिक पदों का भेद बनाए रखने वाला सीधा और प्रतिष्ठित हिन्दी रूप।
- source_word: አውዶ
  choice: उसके आस-पास कहीं भी
  rationale: अंतिम पद के स्थानवाचक ‘चारों ओर/आस-पास’ भाव और उसके मुहावरेदार सर्वथा-अभाव दोनों को व्यक्त करता है।
theological_decisions:
- issue: ‘धार्मिकता’ का दोहराव
  choice: दोनों बार ‘धार्मिकता’ रखा गया, जबकि अंतिम कथन में አውዶ का ‘आस-पास कहीं भी’ भाव जोड़ा गया।
  alternative: अंतिम वाक्य को पहले कथन के समान केवल ‘उसमें कोई धार्मिकता नहीं है’ करना।
  rationale: स्रोत जानबूझकर कथन दोहराता है और अंतिम बार अतिरिक्त አውዶ जोड़ता है; समानता के लिए उस भेद को मिटाना उचित नहीं।
- issue: एसाव के कर्मों की बुराई का स्वरूप
  choice: ‘अत्यन्त बुरा बना लिया है’
  alternative: ‘उसके काम अधिक बुरे हैं’
  rationale: वाक्यांश को याकूब से स्पष्ट तुलनात्मक नैतिक निर्णय बनाने के बजाय तीव्रता और सक्रिय परिणति के रूप में पढ़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। पारिवारिक संबोधन में ‘हमारा आदर’ रखा गया है। नैतिक पदावली के लिए ‘धार्मिकता’, ‘अन्याय’ और ‘हिंसा’ का प्रयोग किया गया है; स्रोत की पुनरुक्ति और अंतिम स्थानवाचक सूक्ष्मता सुरक्षित है।
