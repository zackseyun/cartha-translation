  text: And in the sixth year of this week Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.
translation:
  language: hi
  text: और इस सप्ताह[a] के छठे वर्ष में इसहाक ने अपने दोनों पुत्रों, एसाव और याकूब, को बुलाया। वे उसके पास आए, और उसने उनसे कहा, “मेरे पुत्रों, मैं अपने पूर्वजों के मार्ग पर उस अनन्त घर की ओर जा रहा हूँ, जहाँ मेरे पूर्वज हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस सप्ताह’।
    reason: कालसूचक पद का संकेत संदर्भानुसार ‘इस’ या ‘उस’ के रूप में व्यक्त किया जा सकता है; मुख्य पाठ में ग्रंथ की तात्कालिक कालक्रम-शैली के अनुरूप ‘इस सप्ताह’ रखा गया है।
lexical_decisions:
- source_word: ውስተ፡ ፍኖተ፡ አበውየ
  choice: अपने पूर्वजों की राह पर
  rationale: मूल का शाब्दिक भाव ‘मेरे पूर्वजों के मार्ग में’ है; यह मृत्यु और पूर्वजों के पास जाने के लिए प्रयुक्त गरिमापूर्ण रूपक है।
- source_word: ውስተ፡ ቤት፡ ዘለዓለም
  choice: उस अनन्त घर को
  rationale: ‘अनन्त घर’ मूल के ‘शाश्वत/अनन्त घर’ को सीधे बनाए रखता है और मृत्यु के बाद की अवस्था के रूपक को किसी विशिष्ट धर्मवैज्ञानिक व्याख्या से नहीं बाँधता।
- source_word: አበውየ
  choice: मेरे पूर्वज
  rationale: बहुवचन का अर्थ ‘मेरे पिता/पूर्वज’ है; आधुनिक हिन्दी में वंशगत संदर्भ के लिए ‘पूर्वज’ अधिक स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: ‘अनन्त घर’ की पहचान
  choice: रूपक को ‘अनन्त घर’ के रूप में यथावत रखा गया
  alternative: इसे ‘परलोक’, ‘स्वर्ग’ या ‘मृतकों का निवास’ कहना
  rationale: मूल स्थान की सटीक धर्मवैज्ञानिक पहचान नहीं करता; इसलिए उसकी अस्पष्टता और तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कालक्रम-सूत्र को स्पष्ट रखा गया है, और संबोधन ‘मेरे पुत्रो’ मूल के आत्मीय बहुवचन को दर्शाता है।
