base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/021.yaml
  text: And I myself ask you that you admonish Jacob concerning me and concerning my children, for I know that he will surely reign over me and over my children, because on the day my father blessed him he made him high and me low.
translation:
  language: hi
  text: और मैं तुझसे यह भी विनती करता हूँ कि तू याकूब को मेरे और मेरे बच्चों के विषय में[a] समझा दे, क्योंकि मैं जानता हूँ कि वह निश्चय ही मुझ पर और मेरे बच्चों पर राज करेगा; क्योंकि जिस दिन मेरे पिता ने उसे आशीर्वाद दिया, उस दिन उन्होंने उसे ऊँचा और मुझे नीचा ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी ओर से और मेरे बच्चों की ओर से’।
    reason: गीज़ पूर्वसर्ग በእንቲአ/በእንተ का अर्थ यहाँ ‘के विषय में’ अथवा ‘की ओर से’ हो सकता है; मुख्य पाठ प्रसंगानुकूल अर्थ देता है और टिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
lexical_decisions:
- source_word: ትገሥጽዮ (təgaśṣəyo)
  choice: समझाए
  rationale: क्रिया में समझाने, चेताने या अनुशासित करने का भाव है। इस पारिवारिक निवेदन में ‘समझाए’ स्वाभाविक है और अनावश्यक कठोरता नहीं जोड़ता।
- source_word: ነጊሠ፡ ይነግሥ (nagśa yənaggəś)
  choice: निश्चय ही … राज करेगा
  rationale: सजातीय क्रिया-रचना की बलवत्ता को आधुनिक हिन्दी में ‘निश्चय ही’ से व्यक्त किया गया है।
- source_word: ልዑለ … ትሑተ (lə‘ula … təḥuta)
  choice: ऊँचा … नीचा ठहराया
  rationale: मूल के स्थान/पद-संबंधी विरोध को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: याकूब के भावी प्रभुत्व की निश्चितता
  choice: ‘निश्चय ही … राज करेगा’
  alternative: ‘राज करेगा’
  rationale: मूल की दोहरावयुक्त रचना भविष्यवाणी की प्रबल निश्चितता व्यक्त करती है; अनुवाद इसे बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
- issue: आशीर्वाद और ऊँचे-नीचे किए जाने का संबंध
  choice: पिता को व्याकरणिक कर्ता बनाए रखा गया
  alternative: आशीर्वाद ने उसे ऊँचा और मुझे नीचा किया
