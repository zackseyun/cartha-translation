  text: their uncleanness and after their error, he and his children. And you tell me to make him swear that he will not kill Jacob his brother. Even if he swears, he will not keep his oath, nor will he do anything but evil. And if he desires to kill Jacob his brother, he will be given into Jacob’s hand, and he will not escape from his hand, for he will fall into his hand.
translation:
  language: hi
  text: उनकी अशुद्धता में और उनके भटकाव के बाद—वह और उसके पुत्र।[a] और तुम मुझसे कहती हो कि मैं उससे यह शपथ लूँ कि वह अपने भाई याकूब को न मारे। यदि वह शपथ खाए भी, तो वह अपनी शपथ नहीं निभाएगा और बुराई के सिवा कुछ नहीं करेगा। और यदि वह अपने भाई याकूब को मारना चाहे, तो वह याकूब के हाथ में सौंप दिया जाएगा और उसके हाथ से नहीं बच पाएगा, क्योंकि वह उसके हाथ में पड़ जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद पिछले वाक्य के बीच से आरम्भ होता है; इसलिए आरम्भिक शब्द मूल पाठ में भी वाक्यांश के रूप में आते हैं।
    reason: पद-विभाजन के कारण आरम्भिक खंड हिन्दी में भी अपूर्ण प्रतीत हो सकता है; टिप्पणी पाठ में कोई छूटा हुआ क्रियापद जोड़ने से बचाती है।
lexical_decisions:
- source_word: ርኵሶን
  choice: उनकी अशुद्धता
  rationale: बहुवचन संबंधसूचक रूप को बनाए रखते हुए धार्मिक और नैतिक दोनों अर्थों को खुला रखने वाला स्वाभाविक हिन्दी पद चुना गया।
- source_word: ስሕተቶን
  choice: उनके भटकाव
  rationale: यह शब्द भूल, चूक या मार्ग से भटकने का भाव दे सकता है; ‘भटकाव’ मूल की नैतिक अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: እምሕሱ
  choice: मैं उससे ... शपथ खिलाऊँ
  rationale: 'प्रेरणार्थक भाव है: वक्ता स्वयं शपथ नहीं खाता, बल्कि एसाव से शपथ लेने को कहता है।'
- source_word: ኢይሄሱ፡ በመሐላሁ
  choice: अपनी शपथ नहीं निभाएगा
  rationale: मुहावरेदार आधुनिक हिन्दी में शपथ के प्रति निष्ठावान न रहने का स्पष्ट अर्थ व्यक्त होता है।
- source_word: ዘእንበለ፡ እኩይ
  choice: बुराई के सिवा कुछ नहीं
  rationale: नकारात्मक अपवाद-रचना को सुरक्षित रखता है और केवल ‘भलाई नहीं करेगा’ से अधिक सटीक है।
- source_word: ውስተ፡ እዴ፡ ያዕቆብ፡ ይትወሀብ
  choice: याकूब के हाथ में सौंप दिया जाएगा
  rationale: मूल के निष्क्रिय रूप और ‘हाथ’ के अधिकार/वश में दिए जाने वाले बिंब दोनों को बनाए रखा गया।
theological_decisions:
- issue: एसाव के भावी आचरण के विषय में कथन की निश्चितता
  choice: ‘नहीं निभाएगा’, ‘नहीं करेगा’ और ‘सौंप दिया जाएगा’ जैसे निश्चित भविष्यकाल रखे गए
  alternative: इन्हें संभावना या शर्तसूचक कथनों के रूप में नरम करना
  rationale: स्रोत वक्ता के कथन को दृढ़ भविष्यवाणी/पूर्वानुमान के रूप में प्रस्तुत करता है; अनुवाद ने यह तय नहीं किया कि इसका कारण दैवी विधान है या मानवीय चरित्र।
- issue: ‘याकूब के हाथ’ का अर्थ
  choice: मूल रूपक को शाब्दिक रूप से बनाए रखा
  alternative: ‘याकूब के वश में’ या ‘याकूब द्वारा पराजित’
  rationale: ‘हाथ’ अधिकार, पकड़ या विजय—कई अर्थ दे सकता है; किसी एक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वक्ता द्वारा स्त्री को संबोधित करने के कारण ‘कहती हो’ प्रयुक्त हुआ है। मूल की पुनरुक्ति—‘हाथ में सौंपा जाना’, ‘हाथ से न बचना’, ‘हाथ में पड़ना’—जानबूझकर सुरक्षित रखी गई है।
