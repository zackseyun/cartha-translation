  text: उसने कहा, “आपने मुझसे जो कुछ बताया है, वह सब मैं करूँगा। आपकी मृत्यु के दिन मैं आपको मेरे पिता की माता सारा के पास दफ़नाऊँगा, जैसा आपने चाहा है, ताकि उनकी हड्डियाँ आपकी हड्डियों के पास रहें।”
