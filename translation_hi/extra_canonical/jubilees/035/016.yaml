  text: And you, do not fear for Jacob, for Jacob’s guardian is great and mighty and honored, and more praised than Esau’s guardian.” And Rebekah sent and called Esau, and he came to her. And she said to him, “My son, I ask one request from you; say that you will do it, my son.”
translation:
  language: hi
  text: और तू याकूब के विषय में मत डर, क्योंकि याकूब का रक्षक महान, सामर्थी और आदरणीय है, और एसाव के रक्षक से अधिक प्रशंसित है।” तब रिबका ने एसाव को भेज बुलाया। वह उसके पास आया, और उसने उससे कहा, “मेरे बेटे, मैं तुझसे एक विनती करती हूँ; मुझसे कह कि तू इसे करेगा, मेरे बेटे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቃቢሁ
  choice: उसका रक्षक
  rationale: शाब्दिक अर्थ ‘उसकी रखवाली करने वाला’ है; ‘रक्षक’ सहज और सटीक हिन्दी है तथा रक्षक की पहचान को अनिर्धारित रखता है।
- source_word: ዐቢይ፡ ወኃያል፡ ወክቡር
  choice: महान, सामर्थी और आदरणीय
  rationale: तीनों समन्वित विशेषणों को अलग-अलग सुरक्षित रखा गया है।
- source_word: ወአኩት፡ እምዐቃቢሁ፡ ለዔሳው
  choice: और एसाव के रक्षक से अधिक प्रशंसित है
  rationale: तुलनात्मक पदबंध को याकूब के रक्षक का वर्णन माना गया है; ‘प्रशंसित’ स्रोत के प्रशंसा-संबंधी शब्द का प्रतिनिधित्व करता है, न कि ‘अधिक सामर्थी’।
- source_word: ወለአኮት፡ ርብቃ፡ ወጸውዐተ፡ ለዔሳው
  choice: तब रिबका ने संदेश भेजकर एसाव को बुलवाया
  rationale: दोनों क्रियाओं—भेजना और बुलाना—को स्वाभाविक हिन्दी में संयुक्त रूप से व्यक्त किया गया है।
- source_word: ስእለት፡ ብየ
  choice: मैं तुझसे एक विनती करती हूँ
  rationale: विनती/अनुरोध के भाव और एकवचन को सहज संवादात्मक हिन्दी में रखा गया है।
theological_decisions:
