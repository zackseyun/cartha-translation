  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘तुम भी’ से አንተኒ का समावेशी बल रखा गया है। अंतिम उपवाक्य को दीर्घ विराम से जोड़ा गया है ताकि मूल में बाहरी कर्म और हृदय की भीतरी दशा के बाद आने वाली प्रेम की व्याख्या स्पष्ट रहे।
