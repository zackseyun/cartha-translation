  text: And you, my son, know from the day you were born until this day, all my deeds and all that is in my heart, that I love your father exceedingly.
translation:
  language: hi
  text: और मेरे बेटे, तुम भी अपने जन्म के दिन से आज तक मेरे सारे काम और मेरे मन की हर बात जानते हो—यह कि मैं तुम्हारे पिता से बहुत प्रेम करती हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: मेरे बेटे
  rationale: यह संबोधन आधुनिक मानक हिन्दी में स्वाभाविक और आत्मीय है तथा मूल के ‘मेरे पुत्र/बेटे’ का अर्थ स्पष्ट रखता है।
- source_word: ምግባርየ
  choice: मेरे सारे काम
  rationale: गीज़ शब्द में कर्म, कार्य और आचरण का अर्थ-क्षेत्र है। ‘काम’ यहाँ दिखाई देने वाले जीवन-व्यवहार को सहज हिन्दी में व्यक्त करता है और भीतर की बात के साथ मूल का विरोध-संतुलन बनाए रखता है।
- source_word: ዘውስተ ልብየ
  choice: मेरे मन की हर बात
  rationale: शाब्दिक अर्थ ‘जो मेरे हृदय के भीतर है’ है। हिन्दी में ‘मन की हर बात’ आंतरिक भाव और अभिप्राय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: አፈቅሮ
  choice: प्रेम करती हूँ
  rationale: वक्ता रिबका स्त्री है; हिन्दी में लिंग-संगति आवश्यक है। ‘प्रेम’ मूल के गहरे स्नेह को गरिमापूर्ण और स्पष्ट रूप में व्यक्त करता है।
- source_word: ጥቀ
  choice: बहुत
  rationale: यह तीव्रतासूचक क्रियाविशेषण ‘बहुत/अत्यन्त’ के अर्थ में है। ‘बहुत प्रेम करती हूँ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की तीव्रता बनाए रखता है।
