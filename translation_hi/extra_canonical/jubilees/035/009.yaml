translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज संवाद-शैली अपनाई गई है। रिबका का इसहाक के प्रति सम्मान ‘आप’ और ‘दिलाइए’ से व्यक्त हुआ है। स्रोत के अंत की अपूर्णता को दीर्घविराम और पादटिप्पणी द्वारा सुरक्षित रखा गया है। आरंभिक ሞትኪ को पूर्ववर्ती वाक्य/पद का अंतिम शब्द मानकर इस पद के मुख्य अनुवाद में नहीं लिया गया, जैसा दिए गए पद-विभाजन और परामर्श-पाठ से भी संकेत मिलता है।
