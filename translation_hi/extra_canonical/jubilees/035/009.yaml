  text: 'And she went in to Isaac and said to him, “I ask one request of you: make Esau swear that he will not devise evil against Jacob and will not pursue him in hostility, for you know Esau’s mind, that he has been cruel from his youth, and there is no goodness in him, for he desires'
translation:
  language: hi
  text: 'तब वह इसहाक के पास गई और उससे बोली, “मैं आपसे एक विनती करती हूँ: एसाव को शपथ दिलाइए कि वह याकूब के विरुद्ध बुराई की योजना नहीं बनाएगा और शत्रुता से उसका पीछा नहीं करेगा, क्योंकि आप एसाव का मन जानते हैं—वह बचपन ही से क्रूर रहा है और उसमें कोई भलाई नहीं है, क्योंकि वह चाहता है…[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिया गया गीइज़ स्रोत-अंश यहाँ वाक्य के बीच में समाप्त होता है; इसलिए ‘वह क्या चाहता है’ इस पद में स्पष्ट नहीं किया गया है।
    reason: स्रोत की अपूर्णता और वास्तविक अनिश्चितता को पाठक के सामने रखना, बिना अगले पद या किसी व्याख्या से रिक्त स्थान भरने के।
lexical_decisions:
- source_word: አሐተ፡ ስእለተ፡ አስተበቍዕ፡ በኀቤከ
  choice: मैं आपसे एक विनती करती हूँ
  rationale: शाब्दिक अर्थ ‘मैं आपसे एक निवेदन माँगती हूँ’ है; हिन्दी में स्वाभाविक और सम्मानपूर्ण स्त्री-वक्ता की अभिव्यक्ति चुनी गई।
- source_word: እምሕሱ፡ ለዔሳው
  choice: एसाव को शपथ दिलाइए
  rationale: 'प्रेरणार्थक भाव को स्पष्ट करता है: इसहाक स्वयं शपथ नहीं खाता, बल्कि एसाव से शपथ लेने को कहा जाता है।'
- source_word: ኢያሕስም፡ ላዕለ፡ ያዕቆብ
  choice: वह याकूब के विरुद्ध बुराई की योजना नहीं बनाएगा
  rationale: क्रिया को केवल ‘घृणा करना’ न बनाकर याकूब के विरुद्ध हानि या बुराई सोचने/रचने के अर्थ में प्रस्तुत किया गया है।
- source_word: ወኢይስድዶ፡ በጸልኢ
  choice: और शत्रुता से उसका पीछा नहीं करेगा
  rationale: पीछा करने की क्रिया और शत्रुतापूर्ण भाव, दोनों को बनाए रखा गया है।
- source_word: ታአምር፡ ሕሊናሁ፡ ለዔሳው
  choice: आप एसाव का मन जानते हैं
  rationale: ሕሊና मन, अंतःवृत्ति या विचार का बोध दे सकता है; ‘मन’ मूल की व्यापकता को बनाए रखता है।
- source_word: ጸዋን፡ ውእቱ፡ እምንእሱ
  choice: वह बचपन ही से क्रूर रहा है
  rationale: एसाव के युवावस्था/बाल्यकाल से चले आ रहे कठोर और निर्दयी स्वभाव को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ወአልቦ፡ ላዕሌሁ፡ ኂሩተ
  choice: और उसमें कोई भलाई नहीं है
  rationale: व्यक्ति में भलाई के अभाव का मूल कथन बिना नरम किए सुरक्षित रखा गया है।
- source_word: እስመ፡ ይፈቅድ
  choice: क्योंकि वह चाहता है…
  rationale: दिए गए स्रोत-अंश का वाक्य यहीं अपूर्ण समाप्त होता है; अनुवाद में उसका अनिर्दिष्ट कर्म नहीं जोड़ा गया।
