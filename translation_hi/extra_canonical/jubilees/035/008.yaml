  yaml_path: translation/extra_canonical/jubilees/035/008.yaml
  text: and her teeth were strong, and no sickness at all had come upon her in all the days of her life. And Jacob said to her, “Blessed am I, mother, if my days draw near to the days of your life, and if my strength remains upon me like this, according to your strength. You will not die, for you speak with me in vain concerning your death.”
translation:
  language: hi
  text: और उसके दाँत मज़बूत थे, और उसके जीवन के सारे दिनों में उसे कोई बीमारी नहीं हुई थी। तब याकूब ने उससे कहा, “माँ, मैं धन्य हूँ यदि मेरे दिन आपके जीवन के दिनों के निकट आ जाएँ और मेरी शक्ति इसी प्रकार मुझमें बनी रहे, जैसी आपकी शक्ति है। आप नहीं मरेंगी[a], क्योंकि आप अपनी मृत्यु के विषय में मुझसे व्यर्थ ही कहती हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मत मरिए।”
    reason: गीइज़ क्रियारूप को कुछ पाठन निषेधात्मक आज्ञा के रूप में समझ सकते हैं; मुख्य पाठ में प्रसंग और रूपविज्ञान के आधार पर भविष्यत्-सूचक अर्थ रखा गया है।
lexical_decisions:
- source_word: አስናኒሃኒ፡ ጽኑዕ
  choice: उसके दाँत भी मज़बूत थे
  rationale: दाँतों की सुदृढ़ अवस्था को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; ኒ के समावेशी भाव को ‘भी’ से रखा गया है।
- source_word: ሕማም፡ ኢበከፋ
  choice: उसे कोई बीमारी नहीं हुई थी
  rationale: शाब्दिक ‘उस पर बीमारी नहीं आई’ की अपेक्षा यह हिन्दी में स्वाभाविक है और बीमारी के उसके जीवन में न आने का अर्थ बनाए रखता है।
- source_word: ቀርበ፡ መዋዕልየ፡ ለመዋዕለ፡ ሕይወትኪ
  choice: मेरे दिन आपके जीवन के दिनों के निकट पहुँचें
  rationale: स्रोत के ‘मेरे दिन’ और ‘आपके जीवन के दिन’ को संक्षिप्त करके केवल ‘आयु’ नहीं बनाया गया, ताकि मूल रूपक और संभावित अर्थ-तनाव सुरक्षित रहें।
- source_word: ይሄስ፡ ኀይለየ፡ ላዕሌየ
  choice: मेरी शक्ति इसी प्रकार मुझमें बनी रहे
  rationale: क्रिया के बने रहने/ठहरे रहने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: በጸው፡ ትትናገሪ
  choice: आप ... व्यर्थ ही कहती हैं
  rationale: ‘व्यर्थ’ कथन के निष्फल अथवा निराधार होने का भाव देता है, बिना इसे केवल लापरवाही से बोलना मान लेने के।
theological_decisions:
- issue: አትመውቲ का वाच्यार्थ
  choice: आप नहीं मरेंगी
  alternative: मत मरिए
  rationale: 'उपलब्ध गीइज़ रूप को यहाँ नकारात्मक अपूर्ण/भविष्यत् सूचक मानना प्रसंग के अनुकूल है: याकूब रिबका की असाधारण शक्ति देखकर आश्वासन देता है। फिर भी परंपरागत निषेधात्मक समझ को पादटिप्पणी में सुरक्षित रखा गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। याकूब अपनी माता को ‘आप’ कहता है, जिससे पारिवारिक आदर स्वाभाविक रूप से व्यक्त होता है। स्रोत की पुनरुक्ति और जीवन-दिनों की छवि को जहाँ अर्थपूर्ण है वहाँ बनाए रखा गया है।
