  yaml_path: translation/extra_canonical/jubilees/035/011.yaml
  text: He has dealt wickedly with us; he has gathered your flocks, and he has plundered all your possessions from before your face. And while we ask and request from him what is ours, he acts like a man who has mercy on us.
translation:
  language: hi
  text: उसने हमारे साथ बुरा व्यवहार किया है; उसने तुम्हारे झुंडों को इकट्ठा कर लिया और तुम्हारी सारी संपत्ति तुम्हारे सामने से लूट ली। और जब हम उससे वह माँगते और उसके लिए विनती करते हैं जो हमारा है, तब वह ऐसा व्यवहार करता है मानो वह हम पर दया कर रहा हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስሌነ፡ እኩየ፡ መሪዕቶከ
  choice: उसने हमारे साथ बुरा व्यवहार किया है
  rationale: वाक्यांश में हमारे प्रति बुराई से व्यवहार करने का भाव है; स्वाभाविक हिन्दी में कर्ता को पिछले प्रसंग के पुरुष के रूप में व्यक्त किया गया है।
- source_word: አስተጋብአ፡ ወኵሎ፡ ጥሪትከ፡ ሄደ
  choice: उसने तुम्हारे झुंडों को इकट्ठा कर लिया और तुम्हारी सारी संपत्ति ... लूट ली
  rationale: አስተጋብአ का अर्थ इकट्ठा करना है, जबकि शास्त्रीय गीइज़ ሄደ यहाँ सकर्मक रूप में लूटना या बलपूर्वक ले लेना दर्शाता है; इसे आधुनिक अम्हारी के ‘जाना’ अर्थ में नहीं लिया गया।
- source_word: እምቅድመ፡ ገጽከ
  choice: तुम्हारी आँखों के सामने
  rationale: शाब्दिक अर्थ ‘तुम्हारे मुख के सामने से’ है; हिन्दी में प्रत्यक्ष उपस्थिति और बेबसी का भाव ‘आँखों के सामने’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: ዘእምዚአነ፡ ውእቱ
  choice: अपनी ही वस्तुएँ लौटाने
  rationale: मूल का भाव ‘जो हमारा है’ है। प्रसंग में छीनी गई संपत्ति माँगी जा रही है, इसलिए ‘अपनी ही वस्तुएँ लौटाने’ अर्थ को स्पष्ट और सहज बनाता है, बिना स्वामित्व के बल को खोए।
- source_word: ይሬሲ፡ ከመ፡ ዘብእሲ፡ ዘይምሕረነ
  choice: वह ऐसा व्यवहार करता है मानो वह हम पर दया कर रहा हो
  rationale: तुलनात्मक ከመ को ‘मानो’ से व्यक्त किया गया है, जिससे उसके दयालु होने के दावे और वास्तविक आचरण के बीच मूल की विडंबना बनी रहती है।
theological_decisions:
- issue: कथित दया और वास्तविक उत्पीड़न के बीच तनाव
  choice: ‘मानो वह हम पर दया कर रहा हो’
  alternative: ‘वह हम पर दया करनेवाले मनुष्य जैसा बनता है’
  rationale: चुना हुआ रूप उस व्यक्ति को वास्तव में दयालु घोषित नहीं करता, बल्कि मूल पाठ की विडंबनापूर्ण तुलना और नैतिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और कथात्मक। ‘विनती और प्रार्थना’ मूल के दो निकटार्थक आग्रहसूचक क्रियापदों को बनाए रखता है। किसी सांप्रदायिक या निजी व्याख्या को नहीं जोड़ा गया है।
