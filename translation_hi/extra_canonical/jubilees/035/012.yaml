base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/012.yaml
  text: And he is bitter against you because you blessed Jacob, your perfect and upright son; for there is no evil at all in him, but only goodness. And from the time he came from Haran until this day he has not deprived us of anything, for everything comes to us in its time every day, and he rejoices with all his heart whenever we receive from his hand, and he blesses us. He has not separated himself from us from the time he came from Haran until this day, and he dwells with us continually in the house while honoring us.”
translation:
  language: hi
  text: और वह तुमसे इसलिए कड़वाहट रखता है कि तुमने अपने निष्कलंक और सीधे-सच्चे पुत्र याकूब को आशीर्वाद दिया है। उसमें कोई बुराई नहीं, केवल भलाई ही है। जब से वह हारान से आया है, तब से आज तक उसने हमें किसी भी चीज़ से वंचित नहीं रखा; क्योंकि हर दिन सब कुछ हमें अपने समय पर मिलता है। जब भी हम उसके हाथ से पाते हैं, वह पूरे मन से आनन्दित होता है और हमें आशीर्वाद देता है। जब से वह हारान से आया है, तब से आज तक वह हमसे अलग नहीं हुआ, बल्कि सदा हमारे साथ घर में रहता और हमारा आदर करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርር፡ ላዕሌከ
  choice: तुमसे ... कड़वाहट रखता है
  rationale: क्रिया और पूर्वसर्ग विरोधपूर्ण कटुता को व्यक्त करते हैं; आधुनिक हिन्दी में यह शाब्दिक और स्वाभाविक दोनों है।
- source_word: ፍጹማዊ፡ ወፈትዐ
  choice: सिद्ध और खरा
  rationale: पहला पद पूर्णता/निर्दोषता और दूसरा सीधाई या खराई का बोध देता है; दोनों विशेषणों को अलग रखा गया है।
- source_word: ኢያሕፀፀ፡ ብነ፡ ወእምንትኒ
  choice: उसने हमें किसी चीज़ की कमी नहीं होने दी
  rationale: स्रोत का आशय किसी वस्तु से वंचित न करने या कोई कमी न छोड़ने का है; यह हिन्दी में सहज रूप से व्यक्त किया गया है।
- source_word: ንነሥእ፡ እምእዴሁ
  choice: हम उसके हाथ से कुछ पाते हैं
  rationale: मूल में हाथ से लेने/पाने की अभिव्यक्ति है; 'पाते हैं' प्रसंग में स्वाभाविक है और याकूब की उदारता स्पष्ट करता है।
- source_word: ዘልፈ፡ ውስተ፡ ቤት
  choice: सदा हमारे साथ घर में
  rationale: निरंतरता और घर में साथ रहने—दोनों अर्थ-तत्त्वों को बनाए रखा गया है।
theological_decisions:
- issue: याकूब के चरित्र का पूर्णता-संबंधी वर्णन
  choice: सिद्ध और खरा
  alternative: निर्दोष और सीधा-सच्चा
  rationale: स्रोत के दोनों प्रशंसात्मक विशेषण सुरक्षित रखे गए हैं, पर उन्हें पापहीनता पर कोई अतिरिक्त सैद्धांतिक दावा बनाने के लिए विस्तृत नहीं किया गया।
- issue: ‘उसमें कोई बुराई नहीं’ की निरपेक्ष भाषा
  choice: मूल की निरपेक्ष प्रशंसा को यथावत रखा
  alternative: उसने हमारे साथ कोई बुराई नहीं की
  rationale: वाक्य की वास्तविक तीव्रता को प्रसंगगत व्याख्या द्वारा सीमित करना स्रोत में निहित तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पारिवारिक संबोधन का एकवचन ‘तुम’ प्रसंगानुकूल है। लंबे गीइज़ वाक्य को पठनीय हिन्दी वाक्यों में विभाजित किया गया है, जबकि कारण, समय और निरंतरता के संबंध सुरक्षित हैं।
