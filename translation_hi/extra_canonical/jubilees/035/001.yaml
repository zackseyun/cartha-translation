  yaml_path: translation/extra_canonical/jubilees/035/001.yaml
  text: And in the first year of the first week, in the forty-fifth jubilee, Rebekah called Jacob her son and instructed him concerning his father and concerning his brother, that he should honor them all the days of his life.
translation:
  language: hi
  text: और पैंतालीसवीं जुबली के पहले सप्ताह के पहले वर्ष में, रिबका ने अपने पुत्र याकूब को बुलाया और उसे उसके पिता और उसके भाई के विषय में यह निर्देश दिया कि वह जीवन भर उन दोनों का आदर करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመት፡ ዘሱባዔ፡ ቀዳማይ
  choice: पहले सप्ताह के पहले वर्ष में
  rationale: गीज़ पदबंध की काल-गणना को स्पष्ट और स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: ኢዮቤልው
  choice: जुबली
  rationale: जुबली-वर्षों पर आधारित इस ग्रंथ की विशिष्ट काल-इकाई के लिए प्रचलित लिप्यंतरण रखा गया है।
- source_word: ጸውዐቶ፡ ርብቃ፡ ለያዕቆብ፡ ወልዳ
  choice: रिबका ने अपने पुत्र याकूब को बुलाया
  rationale: व्यक्ति-नामों और पारिवारिक संबंध को स्रोत के अनुसार सीधे तथा सहज हिन्दी में रखा गया है।
- source_word: ወአዘዘቶ
  choice: उसे ... यह निर्देश दिया
  rationale: क्रिया में आदेश अथवा गंभीर निर्देश का भाव है; प्रसंग में 'निर्देश दिया' स्वाभाविक और पर्याप्त दृढ़ है।
- source_word: በእንተ፡ አቡሁ፡ ወበእንተ፡ እኁሁ
  choice: उसके पिता और उसके भाई के विषय में
  rationale: दोनों संबंधों को समानांतर रूप से सुरक्षित रखा गया है।
- source_word: ከመ፡ ያክብሮሙ፡ ኵሎ
  choice: कि वह जीवन भर उन दोनों का आदर करे
  rationale: बहुवचन कर्म को 'उन दोनों' से स्पष्ट किया गया है; अंतिम ኵሎ को उपलब्ध पाठ-साक्ष्य और परामर्श-पाठ के अनुरूप जीवन की समग्र अवधि के अर्थ में व्यक्त किया गया है।
theological_decisions:
- issue: पिता और भाई दोनों के प्रति आदर की आज्ञा
  choice: उन दोनों का आदर करे
  alternative: उनका सम्मान करे
  rationale: '''आदर'' पारिवारिक कर्तव्य का स्वाभाविक भाव देता है और पाठ से आगे कोई धार्मिक या सांप्रदायिक अर्थ नहीं जोड़ता।'
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। स्रोत की जुबली-सप्ताह कालगणना और पारिवारिक निर्देश की समानांतर संरचना सुरक्षित रखी गई है।
