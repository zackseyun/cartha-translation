  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। पद एक बड़े वाक्य के बीच समाप्त होता प्रतीत होता है, इसलिए अंत में अल्पविराम रखा गया है। स्रोत की पुनरुक्ति और यह तनाव कि माता मृत्यु की बात कहती है पर अभी बलवान और सक्रिय है, बनाए रखा गया है।
