  text: And behold, I have completed all the days of my life that I was to live.” And Jacob laughed because of the words of his mother, because his mother had told him that she would die, yet she remained opposite him, and her strength was upon her, and she had not grown weak in strength, for she went in and went out and saw,
translation:
  language: hi
  text: “और देख, जितने दिन मुझे जीवित रहना था, वे सब मैं पूरे कर चुकी हूँ।” और याकूब अपनी माता की बातों के कारण हँसा, क्योंकि उसकी माता ने उससे कहा था कि वह मर जाएगी; फिर भी वह उसके सामने ही थी, उसमें अब भी बल बना हुआ था, और उसका बल घटा नहीं था, क्योंकि वह भीतर जाती, बाहर आती और देखती थी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: जितने दिन मुझे जीवित रहना था, वे सब मैं पूरे कर चुकी हूँ
  rationale: ‘अपने जीवन के सभी दिन पूरे करना’ स्रोत की अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है; वक्ता स्त्री है, इसलिए ‘कर चुकी हूँ’ चुना गया।
- source_word: ወበሐቀ፡ ያዕቆብ፡ በእንተ፡ ነገረ፡ እሙ
  choice: तब याकूब अपनी माता की बातों के कारण हँसा
  rationale: कारणसूचक पद को ‘के कारण’ से व्यक्त किया गया है; ‘बातों पर हँसा’ उपहास का अनावश्यक भाव जोड़ सकता था।
- source_word: ትነብር፡ አንጻሪሁ
  choice: वह उसके सामने बनी हुई थी
  rationale: क्रिया का मूल भाव रहना/विद्यमान होना है और አንጻሪሁ का अर्थ उसके सामने है; ‘बैठी थी’ जैसा अधिक विशिष्ट आसन नहीं जोड़ा गया।
- source_word: ወኀይላ፡ ላዕሌሃ
  choice: उसमें अब भी बल था
  rationale: शाब्दिक ‘उसका बल उस पर था’ हिन्दी में अस्वाभाविक है; चुना गया रूप उसकी वर्तमान शारीरिक सामर्थ्य का अर्थ सुरक्षित रखता है।
- source_word: ትበውእ፡ ወትወፅእ፡ ወትሬኢ
  choice: वह आती-जाती और देखती थी
  rationale: तीनों समानांतर क्रियाओं को रखा गया है। हिन्दी में क्रम ‘आती-जाती’ स्वाभाविक है, यद्यपि स्रोत में भीतर जाना और बाहर आना है।
