  yaml_path: translation/extra_canonical/jubilees/035/006.yaml
  text: 'And she said to him, “My son, all my days I have not seen in you any deed of crookedness, but only uprightness. Yet I will tell you the truth, my son: I shall die in this year, and I shall not live beyond this year, for I saw in a dream the day of my death, that I would not live beyond one hundred and fifty-five years.”'
translation:
  language: hi
  text: '“और मैं उससे विनती करूँगी, और वह मुझ पर कृपा करेगा।” उसने उससे कहा, “मेरे बेटे, अपने जीवन-भर मैंने तुममें कोई कुटिल कार्य नहीं देखा, बल्कि केवल सीधापन देखा है। फिर भी, मेरे बेटे, मैं तुम्हें सच बताती हूँ: मैं इसी वर्ष मर जाऊँगी और इस वर्ष को जीवित रहते पार नहीं करूँगी, क्योंकि मैंने स्वप्न में अपनी मृत्यु का दिन देखा है—कि मैं एक सौ पचपन वर्ष से अधिक जीवित नहीं रहूँगी।”'
  philosophy: optimal-equivalence
