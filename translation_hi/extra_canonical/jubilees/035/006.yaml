  rationale: ‘सीधापन/सही आचरण’ के नैतिक प्रतिपक्ष को स्वाभाविक हिन्दी में व्यक्त करता है और ‘टेढ़ा काम’ के साथ रूपकीय विरोध बनाए रखता है।
- source_word: ኢይትዐደው፡ ዛተ፡ ዓመተ፡ በሕይወትየ
  choice: इस वर्ष के आगे जीवित नहीं रहूँगी
  rationale: शाब्दिक रूप से वर्ष को जीवन में पार न करने का भाव है; हिन्दी में इसका स्वाभाविक अर्थ इसी प्रकार व्यक्त होता है।
- source_word: እምእት፡ ወኃምሳ፡ ወኀምስ
  choice: एक सौ पचपन वर्ष से अधिक
  rationale: मूल संख्या 155 है और प्रसंग में उस आयु-सीमा के आगे जीवित न रहने की बात है।
