  rationale: मूल में नैतिक टेढ़ेपन से युक्त कर्म का ठोस रूपक है; ‘टेढ़ा काम’ उस रूपक और नैतिक अर्थ दोनों को बनाए रखता है।
- source_word: ርቱዐ
