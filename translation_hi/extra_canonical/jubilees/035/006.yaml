  register: आधुनिक मानक हिन्दी में पारिवारिक संबोधन और भविष्यवाणी-सदृश गंभीरता बनाए रखी गई है। मूल स्रोत का आरंभिक वाक्य अंग्रेज़ी POB में अनुपस्थित है, पर गीइज़ पाठ में स्पष्ट होने के कारण अनुवाद में शामिल किया गया है। ‘टेढ़ा काम’ और ‘खराई’ के माध्यम से मूल का नैतिक और रूपकीय विरोध सुरक्षित रखा गया है।
