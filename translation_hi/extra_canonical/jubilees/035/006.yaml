  choice: मैं उससे विनती करूँगी
  rationale: आरंभिक गीइज़ वाक्यांश को निवेदन/याचना के अर्थ में लिया गया है; इसे अंग्रेज़ी परामर्श-पाठ में छूट जाने पर भी मूल स्रोत के अनुसार रखा गया है।
- source_word: ሣህለ
  choice: कृपा
  rationale: यह दया अथवा अनुग्रह का भाव व्यक्त करता है; सामान्य और गरिमापूर्ण हिन्दी के लिए ‘कृपा’ चुना गया।
- source_word: ግብረ፡ ጠዋየ
