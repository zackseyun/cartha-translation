translation:
  language: hi
  text: जिसकी आज्ञा तूने मुझे दी थी कि मैं अपने पिता और अपने भाई का आदर करूँ। मुझे बता, माँ, तूने मुझमें कौन-सी कुटिलता देखी है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አክብር
  choice: आदर करूँ
  rationale: यह क्रिया सम्मान देने या आदर करने का भाव व्यक्त करती है; आधुनिक हिन्दी में ‘आदर करना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: አበየ
  choice: अपने पिता
  rationale: रूप का सीधा अर्थ ‘मेरे पिता’ है; हिन्दी आश्रित वाक्य में वक्ता के संदर्भ को स्वाभाविक ढंग से ‘अपने पिता’ कहा गया है।
- source_word: ወእኅየየ
  choice: और अपने भाई
  rationale: गीज़ पाठ स्पष्टतः ‘और मेरे भाई’ कहता है, ‘मेरी माता’ नहीं; इसलिए परिचित ‘पिता और माता’ सूत्र को आयात नहीं किया गया।
- source_word: ጥውየተ
  choice: कुटिलता
  rationale: शब्द टेढ़ेपन अथवा नैतिक विकृति का संकेत देता है; ‘कुटिलता’ इस रूपक और नैतिक तनाव दोनों को बनाए रखता है।
theological_decisions:
- issue: पिता के साथ उल्लिखित संबंध
  choice: भाई
  alternative: माता
  rationale: मूल गीज़ ወእኅየየ का अर्थ ‘और मेरा भाई’ है। ‘माता’ पूर्ववर्ती पाठ-परंपरा या परिचित आज्ञा के प्रभाव से आया विकल्प है, पर यहाँ स्रोत-पाठ उसका समर्थन नहीं करता।
translation_notes:
  register: वक्ता स्त्री से प्रत्यक्ष और आत्मीय संबोधन कर रहा है, इसलिए ‘तू/तूने’ रखा गया है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है; वाक्यांश की स्रोतगत अपूर्ण आरंभिक संरचना को ‘जिसकी आज्ञा…’ से सुरक्षित रखा गया है।
