  yaml_path: translation/extra_canonical/jubilees/035/020.yaml
  text: And Jacob my brother—I love him more than all flesh, and I have no brother in all the earth except him alone. And this is no great thing for me, that I should love him, for he is my brother, and together we were sown in your womb, and together we came out from your belly. And if I do not love my brother, whom shall I love?
translation:
  language: hi
  text: और मेरा भाई याकूब—मैं उससे सब मनुष्यों से बढ़कर प्रेम करता हूँ, और सारी पृथ्वी पर उसके सिवा मेरा कोई भाई नहीं है। इसमें मेरे लिए कोई बड़ी बात नहीं कि मैं उससे प्रेम करूँ, क्योंकि वह मेरा भाई है; हम दोनों एक साथ तेरे गर्भ में बोए गए और एक साथ तेरे उदर से निकले। यदि मैं अपने भाई से प्रेम न करूँ, तो किससे प्रेम करूँ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምኵሉ፡ ዘሥጋ
  choice: सब देहधारियों से बढ़कर
  rationale: शाब्दिक अर्थ ‘समस्त देह/मांस से बढ़कर’ है। ‘सब देहधारियों’ से मूल की व्यापकता और देह-संबंधी अभिव्यक्ति बनी रहती है, जबकि हिन्दी में आशय समझ में आता है।
- source_word: ተዘራእነ
  choice: हम ... बोए गए
  rationale: क्रिया का मूल बिंब ‘बोए जाना’ है; गर्भधारण के इस असामान्य रूपक को सहजतर अर्थ से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: እምኅንብርትኪ
  choice: तेरी कोख से
  rationale: यह मातृ-उदर/नाभि-प्रदेश से निकलने की जन्म-संबंधी अभिव्यक्ति है; आधुनिक हिन्दी में ‘कोख’ प्रसंगानुकूल, स्वाभाविक और गरिमापूर्ण है।
- source_word: መነ፡ አፈቅር
  choice: तो फिर किससे प्रेम करूँ?
  rationale: मूल का प्रश्नात्मक बल और आत्मीय तर्क दोनों स्पष्ट रखने के लिए ‘फिर’ जोड़ा गया है।
