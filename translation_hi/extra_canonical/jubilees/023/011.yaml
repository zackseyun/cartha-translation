base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/011.yaml
  text: For Abraham was perfect in all his deeds with the LORD, and he was pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he grew old because of evil, and he was full of days.
translation:
  language: hi
  text: क्योंकि अब्राहम प्रभु के साथ अपने सभी कामों में सिद्ध था[a], और अपने जीवन भर वह धार्मिकता में स्वीकार्य था। देखो, उसने अपने जीवन में चार जुबली-काल भी पूरे नहीं किए थे कि वह बुराई के कारण बूढ़ा हो गया[b] और अपने दिनों से तृप्त हुआ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘प्रभु के साथ’; इसका अनुवाद कभी-कभी ‘प्रभु के सामने’ भी किया जाता है, पर यहाँ प्रयुक्त पूर्वसर्ग का सामान्य अर्थ ‘के साथ’ है।
    reason: मूल पूर्वसर्ग और वैकल्पिक पारंपरिक अनुवाद को स्पष्ट करना।
  - marker: b
    text: 'शाब्दिक रूप में: ‘बुराई के मुख के सामने’; यह मुहावरा यहाँ ‘बुराई के कारण’ के अर्थ में समझा गया है।'
    reason: मूल स्थानात्मक छवि और प्रसंगानुसार कारणार्थ—दोनों को सुरक्षित रखना।
  - marker: c
    text: ‘अपने दिनों से तृप्त हुआ’ लंबी और भरपूर आयु का बाइबिलीय मुहावरा है; तुलना करें, ‘उसके दिन पूरे हुए’।
    reason: शाब्दिक मुहावरे का अर्थ बताना और प्रचलित वैकल्पिक अभिव्यक्ति दर्ज करना।
lexical_decisions:
- source_word: ፍጹም (fəṣṣum)
  choice: सिद्ध
  rationale: यह शब्द पूर्णता या निर्दोषता का भाव रखता है। ‘सिद्ध’ मूल के नैतिक मूल्यांकन को बनाए रखता है और प्रसंग में अब्राहम के सभी कामों से जुड़ता है।
- source_word: ምስለ (məsla)
  choice: के साथ
  rationale: इस पूर्वसर्ग का सीधा अर्थ ‘के साथ’ है; इसलिए इसे ‘के सामने’ नहीं किया गया।
- source_word: ይሠምር (yəśämmər)
  choice: प्रसन्न करता रहा
  rationale: क्रिया प्रसन्न करने या अनुग्रह पाने का भाव दे सकती है। यहाँ निकटतम संदर्भ में प्रभु को निहित कर्म मानकर स्वाभाविक हिन्दी दी गई है, जबकि निरंतरता ‘करता रहा’ से व्यक्त होती है।
- source_word: ኢዮቤልውሳተ (ʾiyobelusata)
  choice: जुबली
  rationale: यह उनचास-वर्षीय जुबली-कालों का तकनीकी नाम है; परिचित लिप्यंतरण मूल ग्रंथ की कालगणना को सुरक्षित रखता है।
- source_word: ቅድመ፡ ገጸ፡ እኩይ (qədma gaṣa ʾəkuy)
  choice: बुराई के कारण
  rationale: शाब्दिक रूप ‘बुराई के मुख/उपस्थित‍ि के सामने’ है, पर यह गीइज़ मुहावरा कारण भी व्यक्त करता है। अध्याय में बुराई के कारण आयु घटने का संदर्भ होने से कारणार्थ मुख्य पाठ में अधिक उपयुक्त है।
- source_word: ጸገበ፡ መዋዕሊሁ (ṣagaba mawāʿə-lihu)
  choice: अपने दिनों से तृप्त हुआ
  rationale: शाब्दिक बाइबिलीय मुहावरे में अब्राहम ही कर्ता है और वह अपने दिनों से ‘भर गया/तृप्त हुआ’; इसे ‘उसके दिन पूरे हुए’ करने से कर्ता और मुहावरे की छवि बदल जाती।
theological_decisions:
- issue: अब्राहम की सिद्धता का स्वरूप
  choice: ‘अपने सभी कामों में सिद्ध’
  alternative: ‘पापरहित था’
  rationale: मूल पाठ अब्राहम के समस्त कामों का सकारात्मक मूल्यांकन करता है, पर सार्वभौमिक पापरहितता का व्यवस्थित धर्मवैज्ञानिक दावा स्पष्ट रूप से नहीं करता; इसलिए ऐसा विस्तार नहीं जोड़ा गया।
- issue: धार्मिकता में किसे प्रसन्न किया गया
  choice: ‘प्रभु को प्रसन्न करता रहा’
  alternative: ‘धार्मिकता में प्रसन्न था’
  rationale: क्रिया का अर्थ कुछ हद तक खुला है, लेकिन ‘प्रभु के साथ’ वाला निकट संदर्भ प्रभु को निहित कर्म समझने का समर्थन करता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
- issue: बुराई और वृद्धावस्था का संबंध
  choice: कारणार्थ—‘बुराई के कारण’
  alternative: स्थानात्मक—‘बुराई की उपस्थिति में’
  rationale: मूल मुहावरे का शाब्दिक स्थानात्मक रूप संभव है, किंतु अध्याय का तर्क बुराई को घटती आयु का कारण बताता है। वास्तविक शाब्दिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सिद्ध’, ‘धार्मिकता’ और ‘अपने दिनों से तृप्त’ जैसे बाइबिलीय पद मूल की औपचारिक और मुहावरेदार शैली बनाए रखते हैं; ‘जुबली’ को तकनीकी कालगणना के रूप में अपरिवर्तित रखा गया है।
