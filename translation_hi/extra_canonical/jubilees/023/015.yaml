review_pass:
  verdict: revise
  source_fidelity: 'The two clauses are correctly distinguished: the generation sins ‘on the earth,’ and its deeds are then identified by the full ensuing list. A small revision better preserves the final source noun as ‘abomination’ rather than prematurely rendering it as ‘deeds/acts,’ since ገብርሙ explicitly supplies ‘their deeds’ for the whole list.'
  naturalness: The draft is clear and idiomatic modern Hindi. Using ‘घृणितता’ as the final abstract noun makes the coordinated list more balanced and avoids the slightly redundant combination of ‘घृणित काम’ followed by ‘कर्म हैं.’
  terminology: ‘दुष्ट पीढ़ी,’ ‘पाप करती है,’ ‘अशुद्धता,’ ‘व्यभिचार,’ and ‘अपवित्रता’ are appropriate, dignified, and non-sectarian choices. ‘घृणितता’ closely conveys the final term while retaining its distinction from ገብርሙ (‘their deeds’).
  issues:
  - severity: low
    issue: The final list item is rendered ‘घृणित काम.’
    rationale: The source distinguishes the final vice/abomination term (ሳቀራር) from the following ገብርሙ, ‘their deeds.’ Rendering the former as ‘काम’ partly duplicates the function of the latter. An abstract noun retains the source structure more precisely.
  revised_text: और यह सब उस दुष्ट पीढ़ी पर आएगा जो पृथ्वी पर पाप करती है; अशुद्धता, व्यभिचार, अपवित्रता और घृणितता उस पीढ़ी के कर्म हैं।
  revised_footnotes: []
