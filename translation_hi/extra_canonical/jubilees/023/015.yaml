  yaml_path: translation/extra_canonical/jubilees/023/015.yaml
  text: And all this will come upon an evil generation which sins on the earth; their deeds are uncleanness and fornication and impurity and abomination.
translation:
  language: hi
  text: और यह सब उस दुष्ट पीढ़ी पर आएगा जो पृथ्वी पर पाप करती है; अशुद्धता, व्यभिचार, अपवित्रता और घृणितता उस पीढ़ी के कर्म हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመጽእ
  choice: आएगा
  rationale: आने या आ पड़ने के मूल भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ትኤብስ
  choice: पाप करती है
  rationale: क्रिया का अर्थ ‘पाप करना/अपराध करना’ है; इसे ‘पृथ्वी को अशुद्ध करती है’ कहना मूल व्याकरण और अर्थ को मिला देगा।
- source_word: በምድር
  choice: पृथ्वी पर
  rationale: उपसर्ग सहित पद स्थानसूचक है—‘पृथ्वी पर’—न कि ‘पृथ्वी को’।
- source_word: ርኵስ
  choice: अशुद्धता
  rationale: नैतिक या धार्मिक अशुचिता का सामान्य और स्पष्ट हिन्दी पर्याय।
- source_word: ዝሙት
  choice: व्यभिचार
  rationale: यौन अनैतिकता/व्यभिचार के स्रोतार्थ को गरिमापूर्ण और परिचित बाइबलीय हिन्दी में रखता है।
- source_word: ገማኔ
  choice: अपवित्रता
  rationale: सूची में पहले आए ‘अशुद्धता’ से शब्दगत भेद रखते हुए impurity/pollution का निकट अर्थ देता है।
- source_word: ሳቀራር
  choice: घृणित काम
  rationale: ‘घृणितता/घिनौने आचरण’ का स्वाभाविक हिन्दी रूप; इसे कर्मों की सूची के अंतिम घटक के रूप में रखा गया है।
- source_word: ገብርሙ
  choice: उस पीढ़ी के कर्म हैं
  rationale: शाब्दिक ‘उनके कर्म’ का आशय स्पष्ट करता है और इस पद को पूरी दोष-सूची से जोड़ता है, केवल अंतिम शब्द से नहीं।
theological_decisions:
- issue: पाप और पृथ्वी के बीच व्याकरणिक संबंध
  choice: जो पृथ्वी पर पाप करती है
  alternative: जो पृथ्वी को अशुद्ध करती है
  rationale: स्रोत की क्रिया ‘पाप करती है’ और በምድር स्थानसूचक ‘पृथ्वी पर’ है; वैकल्पिक रूप दो अलग उपवाक्यों को मिला देता है।
- issue: दोषों की सूची और ‘कर्म’ का संबंध
  choice: पूरी सूची को उस पीढ़ी के कर्म बताया गया
  alternative: केवल अंतिम पद को ‘घृणित काम’ मानना और शेष को साधनसूचक बनाना
  rationale: ገብርሙ (‘उनके कर्म’) सूची के विधेय के रूप में पढ़ा जाता है और सभी दोषों पर लागू होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और गैर-सांप्रदायिक रूप। समानार्थी स्रोत-पदों का अंतर ‘अशुद्धता’ और ‘अपवित्रता’ से बनाए रखा गया है; अर्धविराम दोनों मूल उपवाक्यों को स्पष्ट रूप से अलग करता है।
