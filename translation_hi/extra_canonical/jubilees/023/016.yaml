base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/016.yaml
  text: Then they will say, “The days of the former ones were many, up to a thousand years, and good; but behold, the days of our life, when a man has lived long, are seventy years, and if he is strong, eighty years, and they are evil, and there is no peace in the days of this evil generation.”
translation:
  language: hi
  text: तब वे कहेंगे, “पहले के लोगों के दिन बहुत थे—एक हज़ार वर्ष तक—और अच्छे थे। पर देखो, हमारे जीवन के दिन, जब कोई मनुष्य लंबी आयु पाता है, सत्तर वर्ष होते हैं, और यदि वह बलवान हो तो अस्सी वर्ष; और वे बुरे हैं, और इस बुरी पीढ़ी के दिनों में शांति नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለቀደምት
  choice: पहले के लोगों के
  rationale: यह पद पूर्वकालीन मनुष्यों की ओर संकेत करता है; हिन्दी में यह स्वाभाविक है और अस्पष्ट सामूहिक संदर्भ को बनाए रखता है।
- source_word: መዋዕሊሆሙ
  choice: उनके दिन
  rationale: शाब्दिक ‘उनके दिन’ आयु अथवा जीवनकाल के अर्थ को संदर्भ से प्रकट होने देता है।
- source_word: ሠናይ
  choice: अच्छे
  rationale: मूल विशेषण का सीधा और सामान्य हिन्दी प्रतिरूप।
- source_word: አመ፡ አብዝኀ፡ ሰብእ፡ ሐይወ
  choice: जब कोई मनुष्य लंबी आयु पाता है
  rationale: वाक्यांश दीर्घ जीवन की अधिकतम सामान्य अवधि का भाव देता है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: ኀየለ
  choice: बलवान हो
  rationale: मूल में शक्ति/सामर्थ्य का भाव है; ‘बलवान’ उसे बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: እኩይ / እኪት
  choice: बुरे / बुरी
  rationale: दोनों रूप नैतिक या दुःखपूर्ण ‘बुराई’ का व्यापक भाव रखते हैं; अनुवाद उस संभावित तनाव को सीमित नहीं करता।
- source_word: ሰላመ
  choice: शांति
  rationale: सामान्य और व्यापक समतुल्य, जो कुशलता तथा संघर्षहीनता दोनों अर्थों को समेट सकता है।
theological_decisions:
- issue: सत्तर और अस्सी वर्षों का कथन
  choice: इसे इस पीढ़ी के लोगों द्वारा अपने जीवनकाल का वर्णन मानकर अनूदित किया गया है।
  alternative: इसे सभी मनुष्यों के लिए परमेश्वर द्वारा निर्धारित सार्वभौमिक आयु-सीमा के रूप में व्यक्त करना।
  rationale: मूल पाठ कथन को ‘वे कहेंगे’ के अंतर्गत रखता है और सार्वभौमिक धार्मिक नियम स्पष्टतः घोषित नहीं करता।
- issue: जीवन के दिनों को ‘बुरा’ कहना
  choice: ‘वे बुरे हैं’ द्वारा मूल मूल्यांकन को खुला रखा गया है।
  alternative: ‘वे दुःख से भरे हैं’ कहकर इसे केवल कष्ट के अर्थ में सीमित करना।
  rationale: मूल शब्द नैतिक बुराई और विपत्ति/दुःख दोनों की छाया रख सकता है; व्यापक हिन्दी ‘बुरे’ अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-अनुकूल शैली। दीर्घ वाक्य की भविष्यवाणी-सदृश लय बनाए रखते हुए विराम-चिह्नों से पठनीयता बढ़ाई गई है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
