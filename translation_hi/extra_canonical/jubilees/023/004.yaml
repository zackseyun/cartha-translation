  text: And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.
translation:
  language: hi
  text: वह उनकी गोद से उठा, दौड़ा, और अपनी माँ रिबका को यह बात बताई। रिबका रात में इसहाक के पास गई और उसे यह बात बताई। तब वे साथ-साथ चले; याकूब भी उनके साथ था, और उसके हाथ में एक मशाल थी। वहाँ जाकर उन्होंने अब्राहम को मृत पड़ा पाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሕፅኑ
  choice: उनकी गोद से
  rationale: मूल पद का अर्थ शाब्दिक रूप से ‘उसकी छाती/गोद से’ है। पिछले पद के प्रसंग में याकूब अब्राहम की गोद में सोया था; इसलिए ‘बिस्तर से’ की अपेक्षा ‘गोद से’ कथानक-संबंध और मूल अर्थ दोनों को सुरक्षित रखता है।
- source_word: ማኅቶት
  choice: एक मशाल
  rationale: गीज़ संज्ञा एकवचन है; इसलिए इसे बहुवचन ‘मशालें’ नहीं किया गया।
- source_word: በድኖ
  choice: मृत
  rationale: यहाँ शब्द अब्राहम की मृत्यु की दशा बताता है; सहज आधुनिक हिन्दी में ‘मृत पड़ा’ मूल आशय को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: मशाल पकड़े व्यक्ति की पहचान
  choice: ‘उसके हाथ में’ रखकर निकटतम पूर्वपद याकूब की ओर स्वाभाविक संकेत
  alternative: ‘याकूब के हाथ में’ कहकर पहचान स्पष्ट करना
  rationale: मूल में पुल्लिंग एकवचन सर्वनाम है, पर व्यक्ति का नाम दोबारा नहीं दिया गया। हिन्दी में सर्वनाम बनाए रखने से स्रोत की अभिव्यक्ति और उसकी सीमित संदर्भगत अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। क्रमिक ‘और’ की अधिकता घटाकर हिन्दी का स्वाभाविक प्रवाह बनाया गया, जबकि घटनाओं का मूल क्रम यथावत है। ‘उनकी गोद’ आदरसूचक हिन्दी है और प्रसंग में अब्राहम की ओर संकेत करती है।
