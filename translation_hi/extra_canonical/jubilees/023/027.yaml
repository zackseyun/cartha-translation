  text: And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.
translation:
  language: hi
  text: और बच्चों के सिर सफेद बालों से भर जाएँगे, और तीन सप्ताह का बच्चा सौ वर्ष के मनुष्य के समान बूढ़ा दिखाई देगा; और दुःख और क्लेश से उनकी कद-काठी नष्ट हो जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስተ፡ ደቂቅ
  choice: बच्चों के सिर
  rationale: शाब्दिक अर्थ को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: በሲበት
  choice: पके बालों से
  rationale: यह वृद्धावस्था के कारण बाल सफेद होने का संकेत देता है; ‘पके बाल’ स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: ሕፃን፡ ወልደ፡ ሠለስት፡ ሱባዔ
  choice: तीन सप्ताह का बच्चा
  rationale: ሠለስት ሱባዔ का सीधा अर्थ ‘तीन सप्ताह’ है।
- source_word: ልሂቅ
  choice: बूढ़ा
  rationale: यह आयु में वृद्ध या वृद्ध दिखाई देने वाले व्यक्ति का बोध कराता है।
- source_word: ቍመቶሙ
  choice: उनका डील-डौल
  rationale: शरीर की कद-काठी या शारीरिक गठन का आशय सुरक्षित रखता है; केवल ‘कद’ कहने से अर्थ संकुचित हो सकता था।
- source_word: በምንዳቤ፡ ወበፃዕር
  choice: दुःख और क्लेश से
  rationale: दोनों निकटार्थक पदों को अलग रखते हुए पीड़ा और कठिन संकट की तीव्रता व्यक्त की गई है।
