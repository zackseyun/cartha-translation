base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/029.yaml
  text: And the days will begin to grow many and increase among the children of men, generation by generation and day by day, until their days draw near to one thousand years and to many years beyond many days. And there will be no old man, nor one who is not satisfied with his days; for all of them will be like children and youths. And all their days they will complete in peace and joy, and they will live, and there will be no Satan and no evil destroyer, for all their days will be days of blessing and healing.
translation:
  language: hi
  text: और मनुष्यों की सन्तानों के बीच दिन पीढ़ी-दर-पीढ़ी और दिन-प्रतिदिन बढ़ने और बहुत होने लगेंगे, यहाँ तक कि उनकी आयु एक हज़ार वर्ष के निकट पहुँच जाएगी, और बहुत दिनों से बढ़कर बहुत वर्षों तक होगी। तब न कोई बूढ़ा होगा, न कोई ऐसा जो अपने दिनों से तृप्त न हो; क्योंकि वे सब बालकों और युवाओं के समान होंगे। वे अपने सारे दिन शान्ति और आनन्द में बिताएँगे और जीवित रहेंगे। न कोई शैतान होगा, न कोई दुष्ट विनाशक; क्योंकि उनके सभी दिन आशीष और चंगाई के दिन होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕል
  choice: आयु / दिन
  rationale: गीज़ शब्द का मूल अर्थ ‘दिन’ है, पर इस प्रसंग में जीवनकाल भी अभिप्रेत है। जहाँ बढ़ती जीवन-अवधि की बात है वहाँ ‘आयु’, और जहाँ दिनों की गुणात्मक अवस्था है वहाँ ‘दिन’ रखा गया।
- source_word: ውሉደ፡ ሰብእ
  choice: मनुष्यों की सन्तानें
  rationale: शाब्दिक अर्थ ‘मनुष्य की सन्तान’ है; सामूहिक और पीढ़ीगत संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይጸግብ፡ መዋዕሊሆሙ
  choice: अपनी आयु से तृप्त हो
  rationale: ‘अपने दिनों से तृप्त’ सेमिटिक मुहावरा है, जिसका आशय पूर्ण जीवन से संतुष्ट होना है; ‘आयु से तृप्त’ मूल बिंब को भी बचाता है।
- source_word: ሰይጣነ
  choice: शैतान
  rationale: यहाँ व्यक्तिवाचक/पारंपरिक पद को सीधे रखा गया है, बिना इसे केवल सामान्य विरोधी के रूप में समझाए।
- source_word: እኩየ፡ ዘያማስን
  choice: विनाश करने वाला कोई दुष्ट
  rationale: ‘दुष्ट’ और विनाशकारी क्रिया, दोनों तत्व सुरक्षित रखे गए हैं; इससे यह अनिर्णीत रहता है कि संकेत किसी व्यक्ति, सत्ता या सामान्य दुष्ट कर्ता की ओर है।
- source_word: ፈውስ
  choice: चंगाई
  rationale: शब्द उपचार, स्वस्थता या आरोग्य का भाव रखता है; ‘चंगाई’ आशीष के समानांतर धार्मिक-काव्यात्मक और सामान्यतः बोधगम्य है।
theological_decisions:
- issue: ‘शैतान’ की पहचान
  choice: ‘शैतान’ को स्पष्ट रूप से रखा गया
  alternative: ‘विरोधी’ या ‘अभियोक्ता’
  rationale: स्रोत-पाठ में प्रचलित रूप ሰይጣነ है; किसी विशेष दानव-विज्ञान को जोड़े बिना पारंपरिक संज्ञा सुरक्षित रखना उचित है।
- issue: ‘दुष्ट विनाशक’ का व्यक्तित्व
  choice: ‘विनाश करने वाला कोई दुष्ट’
  alternative: ‘दुष्ट विनाशक’ अथवा ‘बुराई जो नाश करे’
  rationale: स्रोत की व्याकरणिक संरचना दुष्ट कर्ता का संकेत देती है, पर उसकी सटीक पहचान नहीं बताती; इसलिए अनिश्चितता बनाए रखी गई।
- issue: एक हज़ार वर्षों के बाद की अवधि
  choice: ‘बहुत दिनों से भी आगे बहुत वर्षों तक’
  alternative: केवल ‘और उससे भी बहुत अधिक’
  rationale: स्रोत की कठिन और पुनरुक्त अभिव्यक्ति को पूरी तरह सहज बनाकर उसकी अस्पष्टता मिटाने के बजाय उसका काव्यात्मक तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, भविष्यवाणी-सदृश गद्य। मूल की पुनरावृत्ति और दीर्घायु संबंधी आश्चर्यपूर्ण भाषा को यथासंभव बनाए रखते हुए हिन्दी वाक्य-विन्यास स्वाभाविक रखा गया है। ‘सन्तानें’, ‘शान्ति’, ‘आनन्द’, ‘आशीष’ और ‘चंगाई’ सामान्य धार्मिक साहित्य में परिचित हैं, पर किसी विशिष्ट सम्प्रदाय की शब्दावली नहीं जोड़ी गई।
