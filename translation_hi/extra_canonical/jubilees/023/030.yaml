  text: And then the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies; and the righteous will see and give thanks and rejoice forever and ever with joy.
translation:
  language: hi
  text: तब प्रभु अपने सेवकों को चंगा करेगा, और वे उठ खड़े होंगे और महान शांति देखेंगे, और अपने शत्रुओं को खदेड़ देंगे; और धर्मी देखेंगे, धन्यवाद देंगे और आनंद के साथ युगानुयुग हर्षित होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ का यह सामान्य ईश्वरीय संबोधन है; इसे स्वाभाविक और गरिमापूर्ण हिन्दी में ‘प्रभु’ रखा गया है, बिना स्रोत से अधिक विशिष्ट नाम आरोपित किए।
- source_word: ይፈውሶ
  choice: चंगा करेगा
  rationale: क्रिया उपचार और पुनर्स्थापन का बोध देती है; ‘चंगा करेगा’ धार्मिक साहित्य में परिचित होने के साथ आधुनिक हिन्दी में भी स्पष्ट है।
- source_word: ሰላመ፡ ዐቢየ
  choice: बड़ी शांति
  rationale: विशेषण ‘महान/बड़ी’ और संज्ञा ‘शांति’ दोनों को सीधे बनाए रखा गया है।
- source_word: ይሰድዱ
  choice: खदेड़ देंगे
  rationale: यह केवल पराजित करने के बजाय शत्रुओं को दूर भगाने या निकालने की सक्रिय धारणा व्यक्त करता है।
- source_word: ጻድቃን
  choice: धर्मी
  rationale: नैतिक-धार्मिक अर्थ वाले बहुवचन को हिन्दी के सामूहिक बहुवचन ‘धर्मी’ से व्यक्त किया गया है।
- source_word: ያአኵቱ
  choice: धन्यवाद देंगे
  rationale: क्रिया प्रशंसा अथवा धन्यवाद व्यक्त करने की ओर संकेत कर सकती है; संदर्भ और परामर्श-पाठ के अनुरूप ‘धन्यवाद देंगे’ चुना गया है।
- source_word: እስከ፡ ለዓለመ፡ ዓለም
  choice: युगानुयुग
  rationale: अनंत काल तक बने रहने की गीज़ अभिव्यक्ति का संक्षिप्त, प्रतिष्ठित और सहज हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय संबोधन की विशिष्टता
  choice: प्रभु
  alternative: यहोवा
  rationale: स्रोत-पाठ में ईश्वर के लिए उपाधि है, स्पष्ट रूप से कोई निजी नाम नहीं; इसलिए ‘यहोवा’ जोड़ना स्रोत से अधिक विशिष्टता लाता।
- issue: अंतिम खंड में ‘धर्मी देखेंगे’ का कर्म
  choice: धर्मी यह देखकर धन्यवाद देंगे
  alternative: धर्मी देखेंगे और धन्यवाद देंगे
  rationale: मूल में ‘देखेंगे’ का कर्म स्पष्ट नहीं है। हिन्दी में ‘यह देखकर’ पूर्ववर्ती उद्धार और शांति की ओर स्वाभाविक संकेत करता है, पर किसी संकीर्ण धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। वाक्य की समानांतर क्रियाएँ और अंतिम आनंदपूर्ण उत्कर्ष सुरक्षित हैं; अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘युगानुयुग’ जैसे स्थापित धार्मिक पद का प्रयोग किया गया है।
