  yaml_path: translation/extra_canonical/jubilees/023/021.yaml
  text: And they will rise up with bow and with swords and with slaughter, to turn them back to the way; and they will not turn back until much blood is poured out on the earth, these by those.
translation:
  language: hi
  text: और वे धनुष, तलवारों और मार-काट के साथ उठ खड़े होंगे, ताकि उन्हें फिर मार्ग पर मोड़ दें; और वे तब तक पीछे नहीं हटेंगे, जब तक धरती पर बहुत-सा लहू न बहाया जाए—इन लोगों का लहू उन लोगों के द्वारा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቀውሙ
  choice: उठ खड़े होंगे
  rationale: क्रिया के खड़े होने/उठ खड़े होने के भाव को संघर्ष के प्रसंग में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በቀስት፡ ወበአስይፍት፡ ወበቅትል
  choice: धनुष, तलवारें और मार-काट लेकर
  rationale: साधनसूचक पूर्वसर्ग और क्रम को बनाए रखते हुए आधुनिक हिन्दी में सहज रूप दिया गया है; एकवचन 'धनुष' सामूहिक अर्थ में है और 'तलवारें' स्रोत के बहुवचन को दर्शाता है।
- source_word: ከመ፡ ይሚጥዎሙ፡ ውስተ፡ ፍኖት
  choice: ताकि उन्हें फिर मार्ग पर मोड़ दें
  rationale: ውስተ का दिशात्मक अर्थ 'में/की ओर' है, इसलिए लक्ष्य मार्ग से हटाना नहीं, मार्ग की ओर वापस मोड़ना है। 'फिर' वापसी का प्रसंगगत भाव स्पष्ट करता है।
- source_word: ወኢይትመየጡ
  choice: और वे ... पीछे नहीं हटेंगे
  rationale: युद्ध-संदर्भ में लौटने या मुड़ने की क्रिया का स्वाभाविक हिन्दी अर्थ 'पीछे हटना' है।
- source_word: ይትከዐው፡ ደም፡ ብዙኅ፡ ዲበ፡ ምድር
  choice: धरती पर बहुत-सा लहू न बहा दिया जाए
  rationale: रक्त उंडेले जाने की निष्क्रिय छवि को गरिमापूर्ण और सुबोध हिन्दी में सुरक्षित रखता है।
- source_word: እሉ፡ በእሉ
  choice: इनका उनके हाथों और उनका इनके हाथों
  rationale: संक्षिप्त पारस्परिक वाक्यांश की कठोरता और दोनों पक्षों द्वारा एक-दूसरे का रक्त बहाए जाने का भाव बनाए रखता है।
theological_decisions:
- issue: मार्ग की दिशा
  choice: उन्हें फिर मार्ग पर मोड़ दें
  alternative: उन्हें मार्ग से हटा दें
  rationale: गीज़ ውስተ दिशात्मक रूप से 'में/की ओर' का समर्थन करता है, 'से' का नहीं; इसलिए वापसी का लक्ष्य मार्ग है।
- issue: अंतिम पारस्परिक वाक्यांश
  choice: इनका उनके हाथों और उनका इनके हाथों
  alternative: वे एक-दूसरे का लहू बहाएँ
  rationale: व्याख्यात्मक सहजता के बजाय स्रोत के असामान्य, तनावपूर्ण 'ये उन द्वारा' भाव को यथासंभव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक-भविष्यवाणी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध स्वर। स्रोत की हिंसक छवियों और अंतिम पारस्परिक वाक्यांश की संक्षिप्तता को अनावश्यक रूप से नरम या धर्मसैद्धांतिक रूप से स्पष्ट नहीं किया गया।
