  text: In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be no one who will be saved.
translation:
  language: hi
  text: उन दिनों वे चिल्लाएँगे, पुकारेंगे और प्रार्थना करेंगे कि पापी जातियों के हाथ से बचाए जाएँ, पर कोई भी नहीं बचेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጸርሑ፡ ወይጼውዑ፡ ወይጼልዩ
  choice: वे चिल्लाएँगे, पुकारेंगे और प्रार्थना करेंगे
  rationale: 'तीनों समन्वित क्रियाओं का क्रम और अलग-अलग भाव सुरक्षित रखा गया है: ऊँचे स्वर में रोना/चिल्लाना, पुकारना, और प्रार्थना करना।'
- source_word: እምእደ፡ ኃጥአን፡ አሕዛብ
  choice: पापी जातियों के हाथ से
  rationale: ‘हाथ से’ मूल के मुहावरे को बनाए रखता है और दमनकारी शक्ति या अधिकार से छुटकारे का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है। ‘जातियाँ’ አሕዛብ के बहुवचन को सुरक्षित रखता है।
- source_word: ወአልቦ፡ ዘይድኅን
  choice: पर कोई भी नहीं बचेगा
  rationale: ይድኅን मूल G-stem का अकर्मक अर्थ ‘बचना/उद्धार पाना’ देता है; इसे कारक ‘बचाने वाला’ नहीं बनाया गया है। संक्षिप्त हिन्दी मूल कथन की पूर्ण निषेधात्मक शक्ति बनाए रखती है।
theological_decisions:
- issue: अंतिम खंड में उद्धार पाने वाला है या उद्धार करने वाला
  choice: कोई भी नहीं बचेगा
  alternative: बचाने वाला कोई नहीं होगा
  rationale: मूल ይድኅን अकर्मक G-stem है, इसलिए कर्ता वह है जो बचता या उद्धार पाता है; कारक अर्थ के लिए भिन्न रूप अपेक्षित होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘चिल्लाएँगे, पुकारेंगे और प्रार्थना करेंगे’ मूल की त्रिक संरचना बनाए रखता है; ‘बचाए जाएँ’ और ‘नहीं बचेगा’ के द्वारा प्रार्थना की आशा तथा अंतिम निषेध के तनाव को बिना नरम किए प्रस्तुत किया गया है।
