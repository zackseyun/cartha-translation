  text: And they will contend, these with those, and the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and festival and month and Sabbath and Jubilee and all that is appointed.
translation:
  language: hi
  text: और वे विवाद करेंगे—ये उन लोगों से, जवान बूढ़ों से और बूढ़े जवानों से, निर्धन धनवानों से, दीन जन बड़े लोगों से, और जरूरतमंद शासक से—व्यवस्था और वाचा के विषय में; क्योंकि वे आज्ञा, वाचा, पर्व, माह, सब्त, जुबली और जो कुछ ठहराया गया है, वह सब भूल गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትባአሱ
  choice: झगड़ेंगे
  rationale: क्रिया पारस्परिक विरोध या विवाद को व्यक्त करती है; सामान्य आधुनिक हिन्दी में ‘झगड़ेंगे’ इस तीव्रता को स्वाभाविक रूप से पहुँचाता है।
- source_word: ወረዘት
  choice: जवान
  rationale: यह युवाओं के वर्ग को सूचित करता है और इसके सामने ‘बूढ़े’ का विरोध रखा गया है।
- source_word: ሊቃናት
  choice: बूढ़े
  rationale: संदर्भ में युवाओं के विपरीत आयु-वर्ग अभिप्रेत है; ‘बूढ़े’ सरल और स्पष्ट हिन्दी है।
- source_word: ነዳይ
  choice: निर्धन
  rationale: धनवान के साथ सामाजिक-आर्थिक विरोध को व्यक्त करता है।
- source_word: ባዕል
  choice: धनवान
  rationale: ‘निर्धन’ के विपरीत संपन्न व्यक्ति का अर्थ संदर्भ में उपयुक्त है।
- source_word: ትሑት
  choice: दीन
  rationale: सामाजिक रूप से नीचे या विनम्र व्यक्ति का भाव बनाए रखता है।
- source_word: ዐቢይ
  choice: बड़े लोगों
  rationale: शाब्दिक ‘बड़ा’ यहाँ प्रतिष्ठा या सामाजिक हैसियत सूचित कर सकता है; बहुवचन संबंध के अनुसार स्वाभाविक हिन्दी दी गई है।
- source_word: ምስኪን
  choice: जरूरतमंद
  rationale: अभावग्रस्त या असहाय व्यक्ति का व्यापक अर्थ देता है और पूर्ववर्ती ‘निर्धन’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: መኰንን
  choice: शासक
  rationale: अधिकारी, प्रधान या शासनकर्ता के अर्थ-क्षेत्र में संदर्भानुकूल सामान्य पद।
- source_word: ሕግ
  choice: व्यवस्था
  rationale: यहाँ धार्मिक-विधिक ‘कानून’ के लिए बाइबिलीय हिन्दी का परिचित, किंतु समझने योग्य पद है।
- source_word: ኪዳን
  choice: वाचा
  rationale: ईश्वर और समुदाय से संबद्ध covenant की विशिष्ट धार्मिक अवधारणा को सुरक्षित रखता है।
- source_word: በዓል
  choice: पर्व
  rationale: निर्धारित पवित्र उत्सव-दिवस के लिए संक्षिप्त और प्रतिष्ठित हिन्दी पद।
- source_word: ሰንበት
  choice: सब्त
  rationale: विशिष्ट पवित्र विश्राम-दिवस का पारंपरिक नाम बनाए रखता है।
- source_word: እዮቤሌወ
  choice: जुबली
  rationale: जुबली-वर्ष की विशिष्ट संस्था का प्रचलित लिप्यंतरण।
- source_word: ኵሎ፡ ዘ ኴነ
  choice: जो कुछ ठहराया गया है, वह सब
  rationale: शाब्दिक रूप में ‘जो कुछ हुआ/था’ संभव है, पर सूची के संदर्भ में नियत पवित्र समयों और विधानों की समष्टि अभिप्रेत प्रतीत होती है; वाक्य में स्रोत की व्यापकता रखी गई है।
theological_decisions:
- issue: व्यवस्था और वाचा के विषय में विवाद की प्रकृति
  choice: अर्थ को खुला रखते हुए ‘व्यवस्था और वाचा के विषय में’
  alternative: ‘व्यवस्था और वाचा के विरुद्ध’ या ‘व्यवस्था और वाचा के कारण’
  rationale: गीज़ का በእንተ संबंध, कारण या विषय का भाव दे सकता है। संदर्भ और परामर्श-पाठ के अनुरूप विषयवाचक अनुवाद चुना गया, बिना विवाद का पक्ष निर्धारित किए।
- issue: अंतिम पदबंध का नियत-विधान संबंधी अर्थ
  choice: ‘जो कुछ ठहराया गया है’
  alternative: ‘जो कुछ हुआ है’
  rationale: सूची में आज्ञा, वाचा और पवित्र काल आते हैं, इसलिए नियत या स्थापित बातों का अर्थ संदर्भतः सुसंगत है; फिर भी किसी अतिरिक्त धार्मिक सूची को पाठ में नहीं जोड़ा गया।
- issue: सब्त और जुबली की संज्ञात्मक स्थिति
  choice: विशिष्ट पवित्र कालों के नाम के रूप में ‘सब्त’ और ‘जुबली’
  alternative: सामान्य संज्ञाओं की तरह ‘विश्राम-दिन’ और ‘मुक्ति-वर्ष’
  rationale: मूल पाठ विशिष्ट संस्थागत समयों को सूचीबद्ध करता है; नामों का संरक्षण उनके ऐतिहासिक-धार्मिक संकेत को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की क्रमिक विरोधी जोड़ियों और पुनरावृत्त संरचना को हिन्दी में डैश तथा समानांतर पदों द्वारा सुरक्षित किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
