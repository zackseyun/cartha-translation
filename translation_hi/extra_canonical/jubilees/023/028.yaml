  text: And in those days the children will begin to search the law, and to seek the commandments, and to return to the way of righteousness.
translation:
  language: hi
  text: और उन दिनों बालक व्यवस्था की खोज करने, आज्ञाओं को ढूँढ़ने और धार्मिकता के मार्ग पर लौटने लगेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቅ
  choice: बालक
  rationale: गीज़ बहुवचन का मूल अर्थ ‘बच्चे/संतान’ है; प्रसंग में उभरती युवा पीढ़ी के लिए ‘बालक’ स्वाभाविक और संक्षिप्त है।
- source_word: ሕገገ
  choice: व्यवस्था
  rationale: यहाँ आशय विधि या धार्मिक विधान से है; ‘व्यवस्था’ बाइबलीय हिन्दी में परिचित है और केवल किसी एक नियम तक अर्थ को सीमित नहीं करती।
- source_word: ትእዛዝ
  choice: आज्ञाओं
  rationale: मूल शब्द आदेशों/आज्ञाओं को सूचित करता है; बहुवचन भाव को हिन्दी में स्पष्ट रखा गया है।
- source_word: ፍኖተ፡ ጽድቅ
  choice: धार्मिकता के मार्ग
  rationale: शाब्दिक संरचना ‘धार्मिकता/न्याय का मार्ग’ है; ‘धार्मिकता’ नैतिक और वाचा-संबंधी अर्थ-विस्तार को बनाए रखती है।
theological_decisions:
- issue: व्यवस्था और आज्ञाओं के बीच संबंध
  choice: दोनों पदों को अलग रखा गया है
  alternative: दोनों को मिलाकर ‘परमेश्वर के नियम’ कहना
  rationale: मूल पाठ दो समानांतर अभिव्यक्तियाँ रखता है; उन्हें समेटने से उसका बल और संरचना घट जाती।
- issue: ጽድቅ का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: दोनों अर्थ संभव हैं, पर ‘मार्ग’ के साथ यहाँ ‘धार्मिकता’ व्यापक नैतिक जीवन-पथ को अधिक स्वाभाविक ढंग से व्यक्त करती है; पाठ में किसी संप्रदायगत अर्थ को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। तीन समांतर क्रियाओं—खोज करने, ढूँढ़ने और लौटने—को मूल की प्रगति के अनुसार बनाए रखा गया है।
