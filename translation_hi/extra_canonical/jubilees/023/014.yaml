base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/014.yaml
  text: 'For blow upon blow, and wound upon wound, and distress upon distress, and evil report upon evil report, and sickness upon sickness, and every evil like these, one with another: disease and collapse and frost and hail and snow and fever and chills and stupor and famine and death and sword and captivity and every affliction and sickness.'
translation:
  language: hi
  text: 'क्योंकि चोट पर चोट, घाव पर घाव, संकट पर संकट, बुरी खबर पर बुरी खबर, और बीमारी पर बीमारी; और इसी प्रकार की हर बुराई एक-दूसरी के साथ: रोग, पतन, पाला, ओले, बर्फ़, बुखार, ठिठुरन, स्तब्धता, अकाल, मृत्यु, तलवार, बंदी बनाया जाना, और हर विपत्ति और बीमारी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት
  choice: चोट / विपत्ति
  rationale: आरंभिक आवृत्ति में ‘चोट’ प्रसंग के ठोस आघात को व्यक्त करती है, जबकि अंतिम समाहार में व्यापक अर्थ के लिए ‘विपत्ति’ स्वाभाविक है।
- source_word: ምንዳቤ
  choice: संकट
  rationale: दुःख, क्लेश या संकट के अर्थ-क्षेत्र को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: ስምዐት እኩይ
  choice: बुरी खबर
  rationale: शाब्दिक रूप से ‘बुरा समाचार/सुनाई’; ‘बुरी खबर’ सहज हिन्दी है और स्रोत की पुनरावृत्ति बनाए रखती है।
- source_word: ዝንቱ ምስለ ዝንቱ
  choice: एक के साथ दूसरी
  rationale: स्रोत की ‘यह इसके साथ’ जैसी संचयी अभिव्यक्ति को स्पष्ट रखते हुए विपत्तियों के साथ-साथ आने का भाव देता है।
- source_word: ጕፍጥአት
  choice: गिर पड़ना
  rationale: पतन या ढहने के मूल भाव को अनावश्यक चिकित्सकीय विशिष्टता दिए बिना सुरक्षित रखता है।
- source_word: ስክሕካሕ
  choice: ठिठुरन
  rationale: ठंड से कंपकंपी या chills के संभावित अर्थ को प्राकृतिक हिन्दी में व्यक्त करता है।
- source_word: ሰምዛዝ
  choice: स्तब्धता
  rationale: सुन्नता, जड़ता या stupor के कठिन पद के लिए अपेक्षाकृत व्यापक हिन्दी विकल्प है।
- source_word: ዐባር
  choice: अकाल
  rationale: सूची के आपदा-संदर्भ में famine का अर्थ सबसे उपयुक्त है।
- source_word: መጥባሕት
  choice: तलवार
  rationale: वध या तलवार के आघात को हिन्दी बाइबलीय शैली में संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ፂዋዌ
  choice: बंदी बनाया जाना
  rationale: कैद या captivity के भाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
