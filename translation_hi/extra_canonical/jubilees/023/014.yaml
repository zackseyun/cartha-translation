  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। स्रोत की क्रमिक पुनरावृत्ति और विपत्तियों की पूरी सूची सुरक्षित रखी गई है; कठिन शब्दों को अत्यधिक निश्चित या संप्रदायगत अर्थ नहीं दिया गया।
