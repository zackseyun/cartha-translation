- source_word: ወወድቀ
  choice: और ... गिर पड़ा
  rationale: क्रिया का सामान्य और सीधा अर्थ रखा गया है; प्रसंग में यह शोक और स्नेह से पिता के ऊपर झुक पड़ने का भाव देता है।
- source_word: ውስተ፡ ገጹ፡ አቡሁ
  choice: अपने पिता के मुख पर
  rationale: गीज़ पदबंध की शारीरिक छवि को जानबूझकर बनाए रखा गया है; इसे अधिक स्वाभाविक पर कम सटीक ‘पिता से लिपट गया’ में नहीं बदला गया।
- source_word: ወበከየ
  choice: रोया
  rationale: स्रोत की सरल भूतकालीन क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: ወሰዐሞ
  choice: और उसे चूमा
  rationale: स्रोत में कर्म का संकेत पिता की ओर है; हिन्दी में स्पष्टता के लिए ‘उसे’ जोड़ा गया है।
