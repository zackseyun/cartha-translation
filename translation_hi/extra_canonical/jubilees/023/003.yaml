  yaml_path: translation/extra_canonical/jubilees/023/003.yaml
  text: And Jacob awoke from his sleep, and behold, Abraham had grown cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died.
translation:
  language: hi
  text: तब याकूब नींद से जागा, और देखो, अब्राहम ओले के समान ठंडा हो गया था। उसने कहा, “पिताजी! पिताजी!” पर कोई बोलने वाला न था; तब वह समझ गया कि अब्राहम मर चुका है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነቅሀ፡ ... እምንዋሙ፡
  choice: नींद से जागा
  rationale: गीज़ वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ናሁ፡
  choice: और देखो
  rationale: कथात्मक आकस्मिकता और याकूब को दिखाई पड़ी स्थिति पर बल बनाए रखता है।
- source_word: ቈረ፡ ... ከመ፡ ባረድ፡
  choice: ओले के समान ठंडा हो गया था
  rationale: ቈረ ठंडा हो जाने की अवस्था बताता है और ባረድ का मूल अर्थ ‘ओला’ है; उपमा को हटाए बिना हिन्दी में स्वाभाविक रूप दिया गया है।
- source_word: አባ፡ አባ፡
  choice: पिताजी! पिताजी!
  rationale: पुकार की आत्मीयता और व्याकुलता को आधुनिक सम्मानपूर्ण हिन्दी में व्यक्त करता है।
- source_word: አልቦ፡ ዘነበበ፡
  choice: कोई उत्तर नहीं मिला
  rationale: शाब्दिक अर्थ ‘कोई बोलनेवाला नहीं था’ है; प्रसंग में इसका स्वाभाविक अर्थ पुकार का उत्तर न मिलना है।
- source_word: አእመረ፡ ከመ፡ ሞተ።
  choice: वह समझ गया कि अब्राहम मर चुका है
  rationale: मृत्यु पहले घट चुकी थी और याकूब ने अब उसे पहचान लिया; हिन्दी में संदर्भ को स्पष्ट रखने के लिए नाम दोहराया गया है।
theological_decisions:
- issue: मृत्यु की अवस्था का वर्णन
  choice: मर चुका है
  alternative: मर गया है
  rationale: स्रोत याकूब द्वारा पहले ही घट चुकी मृत्यु को जान लेने की बात करता है; पूर्ण अवस्था का हिन्दी रूप प्रसंगानुकूल है और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। स्रोत में उपस्थित ‘ओले के समान’ उपमा को संरक्षित किया गया है; ‘बर्फ के समान’ अधिक परिचित होता, पर ባረድ के विशिष्ट अर्थ को धुंधला कर देता।
