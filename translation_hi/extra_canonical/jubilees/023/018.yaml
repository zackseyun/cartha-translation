  naturalness: ‘हर मुँह पाप की बातें करता है’ समझ में आता है, पर ‘हर मुँह पाप बोलता है’ स्रोत के अधिक निकट और अधिक संक्षिप्त है। ‘अशुद्ध और घिनौने हैं’ में ‘काम’ के साथ विशेषण-समन्वय संभव है, किंतु ‘अशुद्धता और घृणितता हैं’ स्रोत की अमूर्त संज्ञाओं की सूची को बेहतर रखता है।
  terminology: ‘अशुद्धता’ ርኵስ के लिए संगत है। ስቈራር के प्रबल निंदात्मक भाव के लिए ‘घृणितता’ औपचारिक और सटीक है। ግማኔ के लिए ‘अपवित्रता’ और ርኵስ के लिए ‘अशुद्धता’ भेद बनाए रखते हैं। ሙስና के लिए मुख्य पाठ ‘विनाश’ तथा पादटिप्पणी में ‘भ्रष्टता’ स्रोत की अर्थ-सीमा को सुरक्षित रखते हैं।
