base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/018.yaml
  text: For all of them have acted wickedly, and every mouth speaks sin, and all their works are uncleanness and abomination, and all their ways are defilement and uncleanness and destruction.
translation:
  language: hi
  text: क्योंकि उन सबने दुष्टता की है, और हर मुँह पाप बोलता है, और उनके सारे काम अशुद्धता और घृणितता हैं, और उनके सारे मार्ग अपवित्रता, अशुद्धता और विनाश[a] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भ्रष्टता’।
    reason: गीज़ ሙስና में भ्रष्टता/बिगाड़ तथा विनाश, दोनों अर्थ-छायाएँ संभव हैं; मुख्य पाठ में प्रसंगानुकूल ‘विनाश’ रखा गया है।
lexical_decisions:
- source_word: ዐበሳ
  choice: पाप
  rationale: यह शब्द अपराध, दोष या पाप का अर्थ दे सकता है; यहाँ मुँह से बोले जाने वाले नैतिक अपराध के लिए ‘पाप’ सहज और सीधा है।
- source_word: ስቈራር
  choice: घिनौने
  rationale: स्रोत शब्द घृणा या जुगुप्सा उत्पन्न करने वाली वस्तु का प्रबल भाव रखता है; ‘घिनौने’ आधुनिक हिन्दी में स्वाभाविक रूप से यही बल व्यक्त करता है।
- source_word: ግማኔ
  choice: दूषण
  rationale: यहाँ मार्गों के नैतिक अपवित्रीकरण या मलिनता को व्यक्त करने के लिए ‘दूषण’ चुना गया है, जिससे अगले ‘अशुद्धता’ के साथ स्रोत की संचयी सूची बनी रहती है।
- source_word: ሙስና
  choice: भ्रष्टता
  rationale: इसका मूल भाव बिगाड़, क्षय या भ्रष्टता है; ‘भ्रष्टता’ नैतिक संदर्भ को बनाए रखती है, जबकि विनाश इसका संभावित परिणामसूचक अर्थ है।
theological_decisions:
- issue: ዐበሳ को ‘अपराध’, ‘दोष’ या ‘पाप’ कहना
  choice: पाप
  alternative: अपराध
  rationale: पद का व्यापक नैतिक आरोप और प्रत्येक मुँह से उसके बोले जाने का कथन ‘पाप’ को उपयुक्त बनाता है; अनुवाद किसी विशिष्ट विधिक या सांप्रदायिक अर्थ को आरोपित नहीं करता।
- issue: अंतिम ሙስና का अर्थ
  choice: भ्रष्टता
  alternative: विनाश
  rationale: स्रोत में भ्रष्ट होने और नष्ट होने, दोनों से जुड़ी अर्थ-छाया संभव है। मुख्य पाठ में अधिक प्रत्यक्ष नैतिक अर्थ रखा गया और परिणामसूचक अर्थ पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। स्रोत की बार-बार आने वाली ‘सब/हर’ संरचना और नैतिक दोषों की संचयी लय को बनाए रखते हुए हिन्दी की स्वाभाविकता के लिए ‘से भरे हैं’ जोड़ा गया है।
