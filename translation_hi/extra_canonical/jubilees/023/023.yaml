  text: And a great punishment will come upon the works of that generation from the LORD, and he will give them over to slaughter and judgment and captivity and plundering and destruction.
translation:
  language: hi
  text: और उस पीढ़ी के कामों पर प्रभु की ओर से बड़ा दंड आएगा; और वह उन्हें वध, न्याय, बंदी बनाए जाने, लूट और विनाश के हवाले कर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት፡ ዐቢይ
  choice: बड़ा दंड
  rationale: यह पद आने वाले कठोर दैवी दंड को व्यक्त करता है; ‘बड़ा दंड’ अर्थ और गंभीरता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ግብረ
  choice: कामों
  rationale: शब्द का मूल अर्थ ‘काम/कृत्य’ है। ‘कामों’ सामान्य पाठक के लिए सहज है और पीढ़ी के सामूहिक आचरण को दर्शाता है।
- source_word: እምኀበ፡ እግዚአብሔር
  choice: प्रभु की ओर से
  rationale: स्रोत का संबंधबोधक पद दंड के प्रभु की ओर से आने को स्पष्ट करता है।
- source_word: መጥባሕት
  choice: वध
  rationale: यहाँ तलवार के साधन की अपेक्षा मार डाले जाने या संहार का भाव अधिक प्रत्यक्ष है; इसलिए ‘वध’ चुना गया।
- source_word: ኵነኔ
  choice: न्याय
  rationale: शब्द न्यायिक निर्णय या दंडादेश का भाव रखता है; ‘न्याय’ स्रोत की संक्षिप्तता और संभावित व्यापकता बनाए रखता है।
- source_word: ፂዋዌ
  choice: बंधुआई
  rationale: यह बंदी बनाए जाने और निर्वासन-सदृश दशा को व्यक्त करता है; ‘बंधुआई’ बाइबलीय प्रसंग में स्पष्ट और प्रतिष्ठित हिन्दी है।
- source_word: ሀደድ
  choice: लूट
  rationale: यह लूटे या छीने जाने के भाव को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: ብልዐት
  choice: विनाश
  rationale: शाब्दिक रूप से भक्षण/खा जाने का बिंब हो सकता है, पर इस दंड-सूची में परिणामतः पूर्ण नाश का भाव है; ‘विनाश’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
theological_decisions:
- issue: दंड का दैवी स्रोत
  choice: ‘प्रभु की ओर से’ को स्पष्ट रखा गया
  alternative: केवल ‘प्रभु का बड़ा दंड’
  rationale: स्रोत में ‘की ओर से’ का संबंध स्पष्ट है; अनुवाद न तो दैवी अभिकरण को कम करता है, न उसके स्वरूप पर अतिरिक्त व्याख्या जोड़ता है।
- issue: ኵነኔ का अर्थ
  choice: न्याय
  alternative: दंडादेश / दोषारोपण
  rationale: ‘न्याय’ मूल शब्द की न्यायिक और दंडात्मक दोनों संभावनाओं को अपेक्षाकृत खुला रखता है और theological tension को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। स्रोत की क्रमिक दंड-सूची और भविष्यकाल को सुरक्षित रखा गया है।
