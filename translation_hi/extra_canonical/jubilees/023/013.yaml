  yaml_path: translation/extra_canonical/jubilees/023/013.yaml
  text: And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; but most of his days are pain and labor and distress, and there is no peace.
translation:
  language: hi
  text: और उन दिनों में, यदि कोई मनुष्य डेढ़ जुबली तक जीवित रहता है, तो उसके विषय में लोग कहेंगे, “वह बहुत जी चुका है”; पर उसके अधिकतर दिन पीड़ा, परिश्रम और संताप से भरे रहते हैं, और शांति नहीं होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልወ፡ ወመንፈቀ፡ ዓመታት
  choice: डेढ़ जुबली वर्ष
  rationale: मूल में जुबली और उसके आधे की कालावधि है। विशिष्ट कालगणना को सामान्य वर्षों में बदलने के बजाय ‘जुबली’ को बनाए रखा गया है।
- source_word: አብዝኀ፡ ሐይወ
  choice: वह बहुत जी चुका है
  rationale: यह किसी व्यक्ति की आयु लंबी माने जाने का स्वाभाविक आधुनिक हिन्दी कथन है और मूल के ‘जीवन बढ़ाया/बहुत जिया’ भाव को व्यक्त करता है।
- source_word: ሕማም
  choice: पीड़ा
  rationale: यह शब्द रोग, दुःख या पीड़ा का अर्थ दे सकता है; प्रसंग में मानव जीवन के व्यापक कष्ट के लिए ‘पीड़ा’ उपयुक्त है और अर्थ को केवल बीमारी तक सीमित नहीं करता।
- source_word: ስራሕ
  choice: परिश्रम
  rationale: मूल के काम या श्रम के भाव को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: ምንዳቤ
  choice: संताप
  rationale: दुःख, विपत्ति या व्याकुलता के भाव को ‘संताप’ संक्षेप में व्यक्त करता है और ‘पीड़ा’ से अर्थगत भेद भी रखता है।
- source_word: አልቦ፡ ሰላመ
  choice: शांति नहीं होती
  rationale: मूल के सीधे निषेध ‘शांति नहीं है’ को काल-संदर्भ के अनुरूप स्वाभाविक हिन्दी में रखा गया है।
