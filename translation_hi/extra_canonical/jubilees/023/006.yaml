  yaml_path: translation/extra_canonical/jubilees/023/006.yaml
  text: And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept for Abraham his father, he and all the house of Abraham, and they wept with great weeping.
translation:
  language: hi
  text: और अब्राहम के घर में एक आवाज़ सुनाई दी। तब उसका पुत्र इश्माएल उठा और अपने पिता अब्राहम के पास गया। उसने अपने पिता अब्राहम के लिए रोया, और वह तथा अब्राहम के सारे घराने ने बहुत विलाप किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃል
  choice: आवाज़
  rationale: मूल शब्द का सामान्य अर्थ ‘आवाज़/ध्वनि’ है। प्रसंग में आगे वर्णित विलाप के कारण ‘रोने की आवाज़’ स्वाभाविक है, जबकि केवल ‘आवाज़’ हिंदी में अस्पष्ट रहती।
- source_word: ቤት / ቤተ
  choice: घर / घराना
  rationale: पहले प्रयोग में स्थान (‘अब्राहम के घर में’) और दूसरे में सामूहिक परिवार-परिजन (‘अब्राहम के घराने के सभी लोग’) अभिप्रेत हैं।
- source_word: ወበከየ ... ለአብርሃም
  choice: अब्राहम के लिए रोया
  rationale: क्रिया और संबंधसूचक रूप शोक में किसी के लिए रोने को व्यक्त करते हैं; हिंदी में ‘के लिए रोया’ मूल संबंध को बनाए रखता है।
- source_word: ብካየ፡ ዐቢየ
  choice: फूट-फूटकर रोए
  rationale: शाब्दिक ‘बड़ा रोना रोए’ के बजाय यह आधुनिक हिंदी में तीव्र सामूहिक विलाप का स्वाभाविक और गरिमापूर्ण निरूपण है।
