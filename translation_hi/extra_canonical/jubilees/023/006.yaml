review_pass:
  verdict: revise
  source_fidelity: Draft introduces ‘रोने की’ before ‘आवाज़,’ whereas the Ge'ez ቃል and the English audit trail state only that a sound/voice was heard. The immediate context may make mourning likely, but the verse itself does not qualify the sound; Hindi should retain that ambiguity. The remaining sequence—hearing, Ishmael’s rising and going to Abraham, and the household’s mourning—is retained.
  naturalness: The prose is generally clear and dignified. Recasting the final coordinated clause avoids the slightly awkward semicolon construction while preserving the source’s emphatic inclusion of Ishmael and Abraham’s entire household.
  terminology: ‘अब्राहम,’ ‘इश्माएल,’ ‘पिता,’ and ‘घराना’ are appropriate. ‘बहुत विलाप किया’ naturally renders the intensive ‘great weeping’ without adding theological interpretation.
  issues:
  - severity: medium
    issue: ‘रोने की आवाज़’ narrows an unqualified ‘sound/voice.’
    rationale: The source says that a ቃል (‘sound/voice’) was heard, not explicitly a sound of crying. Although the subsequent mourning supplies context, the translation should not make the initial sound more specific than the text does.
  - severity: low
    issue: The final clause’s coordination is slightly awkward in Hindi.
    rationale: ‘वह और ... सभी लोग फूट-फूटकर रोए’ is understandable, but separating Ishmael’s individual weeping from the collective great mourning gives a smoother modern Hindi rendering and reflects the source’s singular followed by plural verbs.
  revised_text: और अब्राहम के घर में एक आवाज़ सुनाई दी। तब उसका पुत्र इश्माएल उठा और अपने पिता अब्राहम के पास गया। उसने अपने पिता अब्राहम के लिए रोया, और वह तथा अब्राहम के सारे घराने ने बहुत विलाप किया।
