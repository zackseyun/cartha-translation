  yaml_path: translation/extra_canonical/jubilees/023/008.yaml
  text: And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of weeping for Abraham were completed.
translation:
  language: hi
  text: और उसके घराने के सब पुरुषों ने उसके लिए चालीस दिन तक विलाप किया। इसहाक और इश्माएल ने, उनके सभी पुत्रों ने, और कतूरा के सभी पुत्रों ने भी अपने-अपने स्थानों पर विलाप किया; और अब्राहम के लिए विलाप के दिन पूरे हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በከይዎ
  choice: उसके लिए ... विलाप किया
  rationale: क्रिया शोक में रोने या विलाप करने को व्यक्त करती है; प्रत्यय का आशय अब्राहम के लिए शोक करना है।
- source_word: አርብዓ፡ መዋዕለ
  choice: चालीस दिन तक
  rationale: अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኵሎሙ፡ ሰብአ፡ ቤቱ
  choice: उसके घराने के सब पुरुषों
  rationale: ሰብአ को यहाँ सामान्य 'लोग' के बजाय पुरुषवाचक रूप में रखा गया है, जैसा स्रोत और प्रसंग संकेत करते हैं।
- source_word: በመካኖሙ
  choice: अपने-अपने स्थानों पर
  rationale: बहुवचन स्वत्व सहित 'उनके स्थानों में' का स्वाभाविक हिन्दी रूप, जो अलग-अलग स्थानों का संकेत सुरक्षित रखता है।
- source_word: መዋዕለ፡ ብካዩ፡ አብርሃም
  choice: अब्राहम के लिए विलाप के दिन
  rationale: यह स्पष्ट करता है कि विलाप अब्राहम के लिए किया गया था, न कि अब्राहम स्वयं विलाप कर रहा था।
