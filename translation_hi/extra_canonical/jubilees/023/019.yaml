base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/019.yaml
  text: Behold, the earth will be destroyed because of all their deeds, and there will be no grain, no wine, and no oil, because all their deeds are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.
translation:
  language: hi
  text: देखो, उनके सभी कामों के कारण पृथ्वी नष्ट हो जाएगी। न दाखलता का बीज होगा, न तेल; क्योंकि उनके सभी काम बेवफाई से भरे हैं[a]। और मनुष्यों की सन्तान के कारण वे सब एक साथ नष्ट हो जाएँगे—जंगली पशु, पालतू पशु, पक्षी और समुद्र की सारी मछलियाँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द में बेवफाई, विश्वासघात या इनकार का भाव हो सकता है।
    reason: गीइज़ नैतिक विशेषण का अर्थ-क्षेत्र व्यापक है; मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
lexical_decisions:
- source_word: ዘርእ፡ ወይን፡
  choice: अनाज ... दाखमधु
  rationale: दो कृषि-उत्पादों को अलग-अलग समझना गीइज़ पद-विन्यास और प्रसंग के अनुकूल है। ‘अनाज’ साधारण पाठक के लिए ‘बीज’ से अधिक स्वाभाविक है, और ‘दाखमधु’ दाख से बने पेय को स्पष्ट करता है।
- source_word: ቅብዐ
  choice: तेल
  rationale: यहाँ कृषि-उपज की सूची में अभिषेक या लेप के बजाय तेल, सम्भवतः जैतून का तेल, अभिप्रेत है; मूल में वृक्ष-विशेष स्पष्ट न होने से केवल ‘तेल’ रखा गया है।
- source_word: ይትሐጐሉ
  choice: नष्ट हो जाएँगे
  rationale: क्रिया विनाश या मिट जाने का भाव देती है और पृथ्वी तथा जीव-जगत पर आने वाले साझा परिणाम को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: አራዊት፡ ወእንስሳ
  choice: जंगली पशु, पालतू पशु
  rationale: दो पशु-श्रेणियों के भेद को बनाए रखा गया है; केवल ‘पशु’ कहने से मूल की जोड़ी खो जाती।
- source_word: ውሉደ፡ ሰብእ
  choice: मनुष्यों की सन्तान
  rationale: मूल के ‘मनुष्यों के पुत्र/वंशज’ भाव को सामूहिक और गरिमापूर्ण हिन्दी में रखा गया है।
theological_decisions:
- issue: ካሕደ፡ ምግባሪሆሙ का नैतिक अर्थ
  choice: उनके सभी काम विश्वासघात के हैं
  alternative: उनके सभी काम झूठे हैं / उन्होंने अपने सभी कामों से इनकार किया
  rationale: ካሕደ में इनकार, बेवफाई या विश्वासघात का अर्थ सम्भव है। प्रसंग के नैतिक आरोप को बनाए रखते हुए ‘विश्वासघात’ चुना गया है, लेकिन किसी खास धार्मिक मत के अनुसार इसे ‘धर्मत्याग’ नहीं बनाया गया। अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: सृष्टि का विनाश और मानवीय उत्तरदायित्व
  choice: मनुष्यों की सन्तान के कारण
  alternative: मनुष्यों की सन्तान के सामने / उनसे पहले
  rationale: सन्दर्भ और स्रोत-पाठ का कारणसूचक प्रयोग मानव कर्मों को जीव-जगत के विनाश का कारण बताता है; इसे नरम या अस्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथन रखा गया है। ‘देखो’ से भविष्यवाणी की चेतावनी का स्वर बना रहता है। कृषि-उपज और जीव-श्रेणियों की सूची को स्पष्ट, लयात्मक रूप दिया गया है; ‘दाखमधु’ धार्मिक-साहित्यिक प्रसंग में सटीक रहते हुए सामान्य पाठक के लिए बोधगम्य है।
