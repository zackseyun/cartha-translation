translation:
  language: hi
  text: इस सब के दौरान, याकूब अब्राहम की गोद में लेटा हुआ था, और उसे यह पता नहीं था कि अब्राहम, उसके पिता के पिता, की मृत्यु हो गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዝ፡ ኵሉ
  choice: इस सब के दौरान
  rationale: यह पदबंध घट रही समस्त घटनाओं के बीच उसी अवधि को सूचित करता है; हिंदी में यह स्वाभाविक ढंग से कालगत अर्थ व्यक्त करता है।
- source_word: ይስክብ፡ ውስተ፡ ሕፅኑ
  choice: उसकी गोद में लेटा रहा
  rationale: मूल का शाब्दिक बिंब ‘उसकी गोद/वक्ष में लेटना’ है। आधुनिक हिंदी में ‘गोद में’ इस निकट शारीरिक स्थिति को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: ወኢያእመረ
  choice: और उसे पता नहीं था
  rationale: मूल के ‘उसने नहीं जाना’ को प्रसंगानुकूल, सहज आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: አቡ፡ አቡሁ
  choice: उसके पिता के पिता
  rationale: मूल की वंश-संबंधी पुनरुक्त संरचना को सुरक्षित रखा गया है; केवल ‘दादा’ कहने से अधिक स्पष्ट रूप से स्रोत-रूप प्रतिबिंबित होता है।
