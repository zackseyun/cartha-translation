base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/024.yaml
  text: And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.
translation:
  language: hi
  text: और वह उनके विरुद्ध राष्ट्रों के पापियों को उकसाएगा, जिनमें उनके लिए न दया है, न करुणा; वे न बूढ़े का पक्ष लेंगे, न जवान का—किसी का भी नहीं। क्योंकि वे दुष्ट और बलवान हैं, और मनुष्यों की सारी संतानों से बढ़कर बुराई करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያነቅህ
  choice: उकसाएगा
  rationale: क्रिया में किसी को दूसरों के विरुद्ध जगा देने या भड़का देने का भाव है; प्रसंग में ‘उकसाएगा’ स्वाभाविक और स्पष्ट है।
- source_word: ኃጥአኒሆሙ፡ ለአሕዛብ
  choice: अन्यजातियों के पापियों
  rationale: निर्माण को निकटता से रखते हुए ‘राष्ट्रों/जातियों के पापी’ का अर्थ व्यक्त किया गया; बाइबलीय संदर्भ में ‘अन्यजातियाँ’ सुबोध है।
- source_word: ምሕረተ፡ ወሣህለ
  choice: दया ... करुणा
  rationale: दो निकटार्थक संज्ञाओं के युग्म को अलग-अलग हिन्दी शब्दों से सुरक्षित रखा गया है।
- source_word: ለገጸ፡ መኑሂ፡ ኢያደልዉ
  choice: किसी पर भी—कृपा करेंगे
  rationale: चेहरे/व्यक्ति का पक्ष मानने या अनुग्रह दिखाने की अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: አሰልሂቅ፡ ወሬዛ
  choice: बूढ़े ... जवान
  rationale: आयु के दोनों सिरों को सूचित करने वाले युग्म के रूप में अनूदित किया गया।
- source_word: ውሉደ፡ ሰብእ
  choice: मनुष्यों की सब संतानों
  rationale: शाब्दिक ‘मनुष्य की संतानें’ को गरिमापूर्ण बाइबलीय हिन्दी में रखा गया है।
theological_decisions:
- issue: कर्ता की पहचान
  choice: वह
  alternative: परमेश्वर
  rationale: स्रोत पाठ में कर्ता सर्वनाम से व्यक्त है; पद के भीतर उसकी पहचान स्पष्ट करके अंतर्निहित धार्मिक व्याख्या नहीं जोड़ी गई।
- issue: राष्ट्रों और पापियों का संबंध
  choice: अन्यजातियों के पापियों
  alternative: पापी अन्यजातियों
  rationale: स्रोत का संबंधवाचक ढाँचा यह नहीं कहता कि सभी अन्यजाति पापी हैं; चुना हुआ रूप उस भेद को बनाए रखता है।
- issue: अंतिम तुलना का अर्थ
  choice: मनुष्यों की सब संतानों से बढ़कर बुराई करते हैं
  alternative: सब मनुष्यों से अधिक बुरे हैं
  rationale: स्रोत में बुराई करने की क्रियात्मक धारणा है; इसे केवल चरित्र-वर्णन में बदलने से बचाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। समानांतर वाक्य-विन्यास और ‘न...न...’ संरचना से स्रोत की तीव्रता बनाए रखी गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
