base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/010.yaml
  text: For the days of the former ones were nineteen jubilees for their lives; but after the Flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, except Abraham.
translation:
  language: hi
  text: क्योंकि पूर्वकाल के लोगों की आयु उन्नीस जुबलियों की थी; पर जलप्रलय के बाद उनकी आयु उन्नीस जुबलियों से कम होने लगी। वे शीघ्र बूढ़े होने लगे, और अनेक कष्टों तथा अपने मार्गों की बुराई के कारण उनके जीवन के दिन कम होने लगे—अब्राहम को छोड़कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ቀደምት
  choice: पहले के लोगों की आयु के दिन
  rationale: शाब्दिक ‘पूर्वजनों के दिन’ के आशय को स्पष्ट करते हुए जीवन-अवधि का संदर्भ बनाए रखा गया है।
- source_word: ዐሠርቱ፡ ወተስዓቱ፡ ኢዮቤልውሳት
  choice: उन्नीस जुबली
  rationale: विशिष्ट काल-इकाई ‘जुबली’ को लिप्यंतरित किया गया है; इसे सामान्य ‘वर्ष’ में बदलने से मूल गणना नष्ट हो जाती।
- source_word: እምድኅረ፡ አይኅ
  choice: जलप्रलय के बाद
  rationale: ‘Flood’ से अभिप्रेत विशिष्ट प्राचीन प्रलय को स्वाभाविक और परिचित हिन्दी पद में व्यक्त किया गया है।
- source_word: ይኅትጉ
  choice: घटने लगी
  rationale: क्रिया जीवन-अवधि के क्रमिक ह्रास को सूचित करती है; हिन्दी में कर्ता को ‘आयु’ बनाकर अर्थ स्पष्ट किया गया है।
- source_word: ወበረሲአ፡ ፍጡነ
  choice: वे शीघ्र बूढ़े होने लगे
  rationale: मूल के तीव्र वृद्धावस्था-प्राप्ति के भाव को सीधे और सहज ढंग से रखा गया है।
- source_word: በእከየ፡ ፍናዊሆሙ
  choice: अपने चालचलन की बुराई के कारण
  rationale: ‘उनके मार्गों की बुराई’ का स्वाभाविक हिन्दी अर्थ ‘चालचलन’ है, जो नैतिक व्यवहार को व्यक्त करता है।
- source_word: ዘእንበለ፡ አብርሃም
  choice: केवल अब्राहम इसका अपवाद था
  rationale: अपवादसूचक वाक्यांश को स्पष्ट किया गया है, बिना यह निर्धारित किए कि अपवाद पूर्ववर्ती कारण, ह्रास, अथवा पूरे कथन के किस अंश पर लागू है।
theological_decisions:
- issue: अब्राहम को अपवाद बताने वाले अंतिम वाक्यांश का दायरा
  choice: केवल अब्राहम इसका अपवाद था
  alternative: अब्राहम को छोड़कर
  rationale: मूल में अपवाद का सटीक दायरा व्याकरणतः खुला रह सकता है। ‘इसका अपवाद’ उसी अस्पष्टता को पर्याप्त रूप से बनाए रखता है और किसी विशेष धार्मिक व्याख्या को आरोपित नहीं करता।
- issue: आयु घटने का नैतिक और दुःख-संबंधी कारण
  choice: अनेक कष्टों तथा अपने चालचलन की बुराई के कारण
  alternative: बहुत रोग और उनके मार्गों की दुष्टता के कारण
  rationale: मूल के व्यापक दुःख/व्याधि और नैतिक बुराई—दोनों कारणों को अलग-अलग बनाए रखा गया है; इन्हें केवल दैवी दंड के रूप में व्याख्यायित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘जुबली’ को पारिभाषिक काल-इकाई के रूप में रखा गया है। वाक्य-विन्यास को पठनीय बनाने के लिए एक लंबे मूल वाक्य को दो वाक्यों में बाँटा गया, जबकि कारणात्मक और अपवादात्मक संबंध सुरक्षित रखे गए हैं।
