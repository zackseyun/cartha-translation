base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
translation:
  language: hi
  text: और जो लोग बच निकले हैं, वे अपनी बुराई से धार्मिकता के मार्ग की ओर नहीं मुड़ेंगे, क्योंकि वे सब छल और धन के लिए उठ खड़े होंगे, और हर एक अपने पड़ोसी की सारी संपत्ति छीन लेगा। वे अपने लिए बड़ा नाम बनाएँगे, पर न सच्चाई में और न धार्मिकता में। वे अपनी अशुद्धता और अपनी मलिनता की भ्रष्टता से परमपवित्र स्थान को अपवित्र करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍኖተ፡ ጽድቅ
  choice: धार्मिकता का मार्ग
  rationale: ‘मार्ग’ और ‘धार्मिकता’ दोनों स्रोत के ठोस रूपक और नैतिक अर्थ को स्वाभाविक हिन्दी में बनाए रखते हैं।
- source_word: ብዕል
  choice: धन
  rationale: गीज़ शब्द संपत्ति/धन का बोध कराता है; इस संदर्भ में ‘धन’ छल से लाभ पाने की प्रवृत्ति को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: አሐዱ፡ ኵሎ፡ ዘቢጹ
  choice: हर एक अपने पड़ोसी की सारी संपत्ति
  rationale: खंड का आशय प्रत्येक व्यक्ति द्वारा अपने निकटवर्ती की समस्त वस्तु-संपत्ति हथियाने से है; ‘पड़ोसी’ संबंधपरक अर्थ को सुरक्षित रखता है।
- source_word: ቅድስተ፡ ቅዱሳን
  choice: परमपवित्र स्थान
  rationale: यह ‘पवित्रों का पवित्र’ अर्थात सर्वोच्च पवित्र स्थान का रूढ़ धार्मिक पद है; आधुनिक हिन्दी में ‘परमपवित्र स्थान’ अधिक बोधगम्य है।
- source_word: ሙስና
  choice: भ्रष्ट आचरण
  rationale: शब्द भ्रष्टता/बिगाड़ का अर्थ देता है; ‘भ्रष्ट आचरण’ नैतिक और क्रियात्मक आयाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पवित्रों का पवित्र’ का संदर्भ
  choice: परमपवित्र स्थान
  alternative: परमपवित्र वस्तु
  rationale: मंदिर-संबंधी रूढ़ प्रयोग की संभावना प्रबल है, पर किसी विशिष्ट ऐतिहासिक मंदिर की पहचान पाठ में नहीं जोड़ी गई।
- issue: ‘बड़ा नाम’ पाने का नैतिक मूल्यांकन
  choice: वे अपने लिए बड़ा नाम करेंगे, पर न सच्चाई से और न धार्मिकता से
  alternative: वे महान कहलाएँगे
  rationale: स्रोत की विडंबना और सत्य/धार्मिकता से स्पष्ट निषेध को यथावत रखा गया है; इसे केवल प्रतिष्ठा या आत्मप्रचार में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। समानांतर वाक्य-विन्यास—‘न सच्चाई से और न धार्मिकता से’—को स्रोत की अलंकारिक दृढ़ता बनाए रखने के लिए रखा गया है।
