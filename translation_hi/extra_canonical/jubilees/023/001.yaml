  text: And he placed Jacob's two fingers upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.
translation:
  language: hi
  text: और उसने याकूब की दोनों उँगलियाँ याकूब की आँखों पर रखीं, और देवों के परमेश्वर को धन्य कहा। फिर उसने अपना मुख ढक लिया, अपने पैर फैला दिए और अनन्तकाल की नींद सो गया; और वह अपने पुरखाओं के पास इकट्ठा किया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆን፡ አጻብዐ፡ ያዕቆብ
  choice: याकूब की दोनों उँगलियाँ
  rationale: गीज़ पदबंध का स्वाभाविक हिन्दी रूप; संबंधसूचक रचना और द्विवचन-सदृश संख्या दोनों सुरक्षित हैं।
- source_word: አምላክ፡ አማልክት
  choice: देवों के परमेश्वर
  rationale: शाब्दिक उपाधि ‘God of gods’ को बनाए रखता है और पद की ऊँची धार्मिक शैली के अनुरूप है।
- source_word: ባረኮ
  choice: धन्य कहा
  rationale: परमेश्वर के प्रति प्रयुक्त ‘आशीष देना/धन्य कहना’ के अर्थ को हिन्दी में बिना इस संकेत के व्यक्त करता है कि मनुष्य परमेश्वर को कोई वरदान देता है।
- source_word: ሰፍሐ፡ እገሪሁ
  choice: अपने पैर सीधे किए
  rationale: मूल के ‘पैर फैलाए’ का मृत्यु-शय्या के प्रसंग में स्वाभाविक हिन्दी रूप।
- source_word: ኖመ፡ ንዋመ፡ ዘለዓለም
  choice: अनन्तकाल की नींद सो गया
  rationale: मूल की ‘सोना/नींद’ पुनरुक्ति और मृत्यु के रूपक को यथासंभव सुरक्षित रखता है।
- source_word: ተጋብአ፡ ኀበ፡ አበዊሁ
  choice: अपने पुरखाओं में जा मिला
  rationale: पितरों के साथ एकत्र किए जाने की प्राचीन मृत्यु-संबंधी अभिव्यक्ति का स्वाभाविक तथा अर्थनिष्ठ हिन्दी रूप।
theological_decisions:
- issue: ‘अनन्तकाल की नींद’ का आशय
  choice: मृत्यु के मूल रूपक को ज्यों का त्यों रखा गया
  alternative: ‘सदा के लिए मर गया’
  rationale: मूल पाठ नींद की छवि का प्रयोग करता है; उसे स्पष्टार्थक बनाकर किसी विशेष परलोक-दृष्टि में बदलना उचित नहीं।
- issue: ‘देवों के परमेश्वर’ की उपाधि
  choice: बहुवचन ‘देवों’ को सुरक्षित रखा गया
  alternative: ‘सर्वोच्च परमेश्वर’
  rationale: मूल की संरचना और उसका संभावित धार्मिक तनाव बनाए रखना अनुवाद का दायित्व है; व्याख्यात्मक समानार्थी मूल को समतल कर देता।
- issue: ‘पुरखाओं में जा मिला’
  choice: परंपरागत सामूहिक अभिव्यक्ति रखी गई
  alternative: ‘उसे उसके पुरखाओं के पास दफनाया गया’
  rationale: मूल में दफनाने का स्पष्ट उल्लेख नहीं है, इसलिए उसे जोड़ना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। वाक्य को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया, पर घटनाक्रम और संयोजक प्रवाह सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
