base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/017.yaml
  text: And in that generation children will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.
translation:
  language: hi
  text: और उस पीढ़ी में बच्चे[a] अपने पिताओं और बुज़ुर्गों को उनके पाप, अन्याय, उनके मुँह की बातों और उनके किए हुए बड़े-बड़े बुरे कामों के कारण धिक्कारेंगे; और इसलिए भी कि उन्होंने उस वाचा को त्याग दिया है जिसे प्रभु ने उनके और अपने बीच स्थापित किया था, ताकि वे उसकी सभी आज्ञाओं, विधियों और उसकी पूरी व्यवस्था को मानें और उन पर चलें, और दाएँ या बाएँ न मुड़ें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पुत्र’।
    reason: गीज़ ደቂቅ का अर्थ व्यापक रूप से ‘बच्चे/सन्तान’ और अधिक संकीर्ण रूप से ‘पुत्र’ हो सकता है।
lexical_decisions:
- source_word: ደቂቅ
  choice: बच्चे
  rationale: यह शब्द ‘सन्तान/बच्चे’ और प्रसंगानुसार ‘पुत्र’ दोनों अर्थ दे सकता है। यहाँ पिताओं और बुज़ुर्गों के साथ व्यापक और स्वाभाविक विरोध के कारण ‘बच्चे’ चुना गया है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ይዘልፉ
  choice: धिक्कारेंगे
  rationale: क्रिया में निन्दा, उलाहना या तिरस्कारपूर्वक दोष लगाने का भाव है। ‘धिक्कारेंगे’ इस तीव्रता को संक्षेप में व्यक्त करता है।
- source_word: ዐመፃ
  choice: अन्याय
  rationale: शब्द विद्रोह, अधर्म या अन्याय का अर्थ दे सकता है। इस पाप-सूची में ‘अन्याय’ सहज है और अर्थ को किसी विशेष प्रकार के विद्रोह तक सीमित नहीं करता।
- source_word: ሥርዐተ
  choice: विधान / विधियों
  rationale: पहली उपस्थिति उस समग्र ईश्वरीय विधान को सूचित करती है जिसे प्रभु ने ठहराया; बाद की बहुवचन-सूची में ‘विधियों’ अधिक स्वाभाविक है।
- source_word: ሕገ
  choice: व्यवस्था
  rationale: ईश्वरीय law के लिए प्रतिष्ठित, स्पष्ट हिन्दी पद, जो आज्ञाओं और विधियों से सम्बद्ध किंतु पृथक श्रेणी को बनाए रखता है।
theological_decisions:
- issue: प्रभु द्वारा ‘उनके और अपने बीच’ विधान ठहराना
  choice: जिसे प्रभु ने उनके और अपने बीच ठहराया था
  alternative: जो वाचा प्रभु ने उनके साथ बाँधी थी
  rationale: गीज़ पाठ में ‘विधान/व्यवस्था’ का पद है और ‘बीच’ की पारस्परिक संरचना स्पष्ट है। ‘वाचा’ धार्मिक रूप से संभव व्याख्या है, पर स्रोत के प्रत्यक्ष शब्द को बदल देती; इसलिए मूल तनाव और संरचना सुरक्षित रखी गई है।
- issue: आज्ञाओं, विधियों और पूरी व्यवस्था का पालन
  choice: मानें और उनका पालन करें
  alternative: सुरक्षित रखें और करें
  rationale: स्रोत की दो क्रियाओं—रखना/मानना और करना—को स्वाभाविक आधुनिक हिन्दी में अलग-अलग बनाए रखा गया है, बिना आज्ञापालन की संयुक्त धारणा को सपाट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। लम्बे गीӠ वाक्य को अर्धविराम से व्यवस्थित किया गया है; कारणसूचक पुनरावृत्ति और आज्ञा–विधि–व्यवस्था की त्रयी को यथासंभव सुरक्षित रखा गया है।
