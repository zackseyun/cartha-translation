  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
translation:
  language: hi
  text: और वे इस्राएल में हिंसा करेंगे और याकूब के विरुद्ध पाप करेंगेᵃ; पृथ्वी पर बहुत-सा लहू बहाया जाएगा, और न कोई बटोरने वाला होगा, न कोई दफ़नाने वाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀከከ
  choice: हिंसा
  rationale: यह शब्द उत्पीड़न, अत्याचार या हिंसक अनर्थ का भाव रखता है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘हिंसा’ चुना गया।
- source_word: ዲበ፡ ያዕቆብ፡ ዐበሳ
  choice: याकूब के विरुद्ध पाप
  rationale: ዲበ का मूल स्थानगत अर्थ ‘पर/ऊपर’ है, पर पाप के साथ यहाँ लक्ष्य या विरोध का भाव स्वाभाविक है; इससे पहले आए ውስተ (‘में’) के साथ भेद भी सुरक्षित रहता है।
- source_word: ይትከዐው፡ ደም
  choice: लहू बहाया जाएगा
  rationale: रक्तपात के प्रसंग में निष्क्रिय क्रिया का यह स्वाभाविक और गंभीर हिन्दी रूप है।
- source_word: ያስተጋብእ
  choice: बटोरनेवाला
  rationale: क्रिया का अर्थ इकट्ठा करना या समेटना है; बहाए गए लहू के संदर्भ में ‘बटोरना’ मूल की ठोस और विकट छवि बनाए रखता है।
theological_decisions:
- issue: ‘इस्राएल’ और ‘याकूब’ के साथ प्रयुक्त भिन्न संबंधबोधक शब्द
  choice: ‘इस्राएल में’ और ‘याकूब के विरुद्ध’
  alternative: दोनों स्थानों पर ‘में’
  rationale: गीज़ पाठ में क्रमशः ውስተ और ዲበ हैं। भिन्न हिन्दी प्रयोग मूल का अर्थगत अंतर बचाता है और बिना आधार दोनों पदों को समान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, गरिमापूर्ण और सहज शैली रखी गई है। ‘लहू’ और ‘दफ़नानेवाला’ जैसे परिचित बाइबिलीय शब्दों का प्रयोग किया गया है, जबकि वाक्यरचना अनावश्यक रूप से पुरातन नहीं बनाई गई।
