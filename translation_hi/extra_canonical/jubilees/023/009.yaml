translation:
  language: hi
  text: और वह तीन जुबिलियों और वर्षों के चार सप्ताहों तक, अर्थात् एक सौ पचहत्तर वर्ष तक, जीवित रहा; और उसने अपने जीवन के दिन पूरे किए—वह वृद्ध और दिनों से परिपूर्ण था।
