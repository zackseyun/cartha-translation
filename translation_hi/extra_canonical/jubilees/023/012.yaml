base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/012.yaml
  text: And all the generations that will arise from now until the day of the great judgment will grow old quickly before they complete two jubilees, and their knowledge will depart from them, from their spirit,, and all their knowledge will vanish.
translation:
  language: hi
  text: और अब से लेकर महान न्याय के दिन तक जितनी भी पीढ़ियाँ उठेंगी, वे दो जुबली पूरी करने से पहले ही शीघ्र बूढ़ी हो जाएँगी। उनकी समझ उनकी आत्मा से अलग हो जाएगी, और उनका सारा ज्ञान लुप्त हो जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम उपवाक्य Geʽez संस्करण में कोष्ठकों में है: “और उनका सारा ज्ञान लुप्त हो जाएगा।”'
    reason: मुद्रित मूल-पाठ में अंतिम उपवाक्य कोष्ठकित है, इसलिए उसकी पाठगत स्थिति पाठक को बताना आवश्यक है।
lexical_decisions:
- source_word: ኵሉ፡ ትውልድ
  choice: जितनी भी पीढ़ियाँ
  rationale: सामूहिक व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዕለተ፡ ደይን፡ ዐባይ
  choice: महान न्याय का दिन
  rationale: शब्दक्रम को स्वाभाविक हिन्दी में रखते हुए ‘महान’, ‘न्याय’ और ‘दिन’—तीनों अर्थ सुरक्षित हैं।
- source_word: ይረሰኡ፡ ፍጡነ
  choice: शीघ्र बूढ़ी हो जाएँगी
  rationale: क्रिया के वृद्ध होने और क्रियाविशेषण के शीघ्रता-बोध को सीधे व्यक्त करता है।
- source_word: ክልኤ፡ ኢዮቤልወ
  choice: दो जुबली
  rationale: ग्रंथ की कालगणना के तकनीकी पद ‘jubilee’ को लिप्यंतरित रखा गया है; इसे अनुमानतः वर्षों में बदलना उचित नहीं।
- source_word: አእምሮቶሙ
  choice: उनकी समझ / उनका सारा ज्ञान
  rationale: एक ही मूल पद के संदर्भगत अर्थ-क्षेत्र में समझ और ज्ञान दोनों आते हैं; निकटवर्ती पुनरुक्ति को हिन्दी में अर्थपूर्ण और पठनीय रखा गया है।
- source_word: እመንፈሶሙ
  choice: उनकी आत्मा से
  rationale: स्रोत में उपस्थित ‘उनकी आत्मा/प्राण से’ को छोड़ा नहीं गया; ‘आत्मा’ यहाँ मनुष्य की आंतरिक चेतना का स्वाभाविक हिन्दी पद है।
theological_decisions:
- issue: ‘महान न्याय का दिन’ का स्वरूप
  choice: वाक्य को भविष्य के न्याय-दिन के सामान्य कथन के रूप में रखा गया
  alternative: इसे किसी विशिष्ट संप्रदायगत अंतिम-न्याय सिद्धांत की पारिभाषिक भाषा में विस्तार देना
  rationale: स्रोत जितना कहता है उतना ही रखा गया है; कालक्रम या न्याय की प्रकृति के बारे में अतिरिक्त मत आरोपित नहीं किया गया।
- issue: मनुष्य के भीतरी तत्व के लिए መንፈስ का अनुवाद
  choice: आत्मा
  alternative: मन या प्राण
  rationale: ‘आत्मा’ सामान्य धार्मिक हिन्दी में ‘spirit’ का निकट और गरिमापूर्ण पद है, पर इससे आत्मा की प्रकृति पर कोई विस्तृत सिद्धांत निष्कर्षित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘उठेंगी’ पीढ़ियों के प्रकट होने का शास्त्रीय भाव बनाए रखता है। असामान्य मध्य उपवाक्य को अत्यधिक सहज बनाकर स्रोत का ‘उनकी आत्मा से’ मिटाया नहीं गया।
