  yaml_path: translation/extra_canonical/jubilees/031/014.yaml
  text: and your children throughout all the ages. And may the Lord give to you and to your seed great understanding for glory. And may he bring you and your seed near to him from among all flesh, to minister in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your children be for glory and greatness
translation:
  language: hi
  text: और तेरी सन्तान सभी युगों में। प्रभु तुझे और तेरे वंश को महिमा के लिए महान समझ[a] प्रदान करे। वह सभी देहधारियों में से तुझे और तेरे वंश को अपने निकट लाए, ताकि तू और तेरा वंश उसके पवित्रस्थान में उसकी उपस्थिति के स्वर्गदूतों और पवित्र जनों के समान सेवा करें। जैसे वे हैं, वैसे ही तेरी सन्तान की सन्तति महिमा और महानता के लिए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हृदय की महानता।”
    reason: ልባዌ का प्रमुख अर्थ ‘समझ/बुद्धि’ है, पर ‘हृदय’ से इसकी व्युत्पत्ति के कारण अधिक शाब्दिक अर्थ की सम्भावना उल्लेखनीय है।
lexical_decisions:
- source_word: ውሉድ (wəlud)
  choice: सन्तान
  rationale: यह शब्द वंशजों अथवा बच्चों को सामूहिक रूप से दर्शाता है; प्रसंग में लिंग-विशेष से बचते हुए ‘सन्तान’ स्वाभाविक और सटीक है।
- source_word: ዘርእ (zarʾ)
  choice: वंश
  rationale: ‘बीज’ इसका शाब्दिक अर्थ हो सकता है, पर मानव वंशजों के लिए आधुनिक हिन्दी में ‘वंश’ अधिक स्वाभाविक है और वंशगत अर्थ बनाए रखता है।
- source_word: ዐባየ፡ ልባዌ (ʿabāya ləbbāwe)
  choice: महान समझ
  rationale: ልባዌ व्युत्पत्तिगत रूप से ‘हृदय’ से जुड़ा होने पर भी समझ, बुद्धि या विवेक का द्योतक संज्ञा-रूप है; इसलिए मुख्य पाठ में ‘महान समझ’ रखा गया है और अधिक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- source_word: ዘሥጋ (za-śəga)
  choice: मानवजाति
  rationale: शाब्दिक अर्थ ‘समस्त देहधारियों में से’ है; यहाँ मनुष्यों के समुदाय में से चुने और निकट लाए जाने का भाव है, जिसे ‘समस्त मानवजाति में से’ स्पष्ट रूप से व्यक्त करता है।
- source_word: ይትአለክ (yətʾallak)
  choice: सेवा करो
  rationale: पवित्रस्थान के प्रसंग में यह सामान्य सहायता नहीं, धार्मिक/पवित्र सेवा को सूचित करता है; ‘सेवा करो’ हिन्दी में स्वाभाविक रहते हुए यह अर्थ वहन करता है।
- source_word: መላእክተ፡ ገጽ (malāʾəkta gaṣ)
  choice: उपस्थिति के स्वर्गदूत
  rationale: शाब्दिक संरचना ‘मुख/सम्मुखता के स्वर्गदूत’ है और यह परमेश्वर की उपस्थिति में रहने वाले स्वर्गदूतों के लिए पारिभाषिक अभिव्यक्ति है।
theological_decisions:
- issue: ‘उपस्थिति के स्वर्गदूत’ और ‘पवित्र जन’ का परस्पर सम्बन्ध
  choice: दोनों पदों को अलग-अलग समानान्तर समूहों के रूप में रहने दिया गया है।
  alternative: दोनों को एक ही स्वर्गदूतीय वर्ग मानकर संयुक्त रूप में अनुवाद करना।
  rationale: मूल पाठ दोनों को ‘और’ से जोड़ता है, पर यह स्पष्ट नहीं करता कि वे एक ही वर्ग हैं या दो; अनुवाद इस अस्पष्टता को नहीं सुलझाता।
- issue: निकट लाए जाने का कर्ता
  choice: ‘वह’ से प्रभु को कर्ता रखा गया है।
  alternative: 'निष्क्रिय रचना: ‘तू और तेरा वंश निकट लाए जाओ’।'
  rationale: मूल के क्रियारूप में परमेश्वर कर्ता है; इसे स्पष्ट रखना आशीर्वचन की निरन्तरता और अर्थ दोनों को सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आशीर्वचन के अनुरूप रखी गई है। ‘पवित्रस्थान’, ‘वंश’ और ‘उपस्थिति के स्वर्गदूत’ जैसे पद धार्मिक प्रसंग की औपचारिकता बनाए रखते हैं, जबकि वाक्यरचना सामान्य हिन्दी पाठक के लिए सुबोध है।
