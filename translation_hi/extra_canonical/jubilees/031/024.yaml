  yaml_path: translation/extra_canonical/jubilees/031/024.yaml
  text: 'And it was reckoned to him as righteousness. And Jacob told his father during the night everything: how the Lord had shown him great mercy, and how he had made all his ways prosper and had protected him from everything.'
translation:
  language: hi
  text: और यह उसके लिए धार्मिकता के रूप में गिना गया।[a] रात में याकूब ने अपने पिता को सब कुछ बताया—कि प्रभु ने उस पर बड़ी दया दिखाई थी,[b] उसके सभी मार्गों को सफल किया था और उसे सब कुछ से बचाए रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और धार्मिकता उसके पास आ गई।” प्रस्तुत गीज़ पाठ में क्रिया का यही शाब्दिक अर्थ बनता है; संभव है कि यह “गिना गया” अर्थ वाली मिलती-जुलती क्रिया की पाठ अथवा OCR त्रुटि हो।
    reason: प्रस्तुत गीज़ रूप और संपादकीय रूप से पुनर्स्थापित ‘गिना गया’ वाले पाठ, दोनों को पारदर्शी रूप से सुरक्षित रखना।
  - marker: b
    text: या, अधिक शाब्दिक रूप में, “वह सब जो प्रभु ने उसके साथ किया था—वह बड़ी दया।”
    reason: गीज़ वाक्य-संरचना की संभावित अधिक शाब्दिक व्याख्या दिखाना।
lexical_decisions:
- source_word: ጽድቀ
  choice: धार्मिकता
  rationale: यह शब्द धार्मिकता अथवा सही ठहराए जाने से संबंधित बाइबिलीय संकल्पना व्यक्त करता है; यहाँ प्रचलित और सुस्पष्ट शब्द ‘धार्मिकता’ उपयुक्त है।
- source_word: እግዚአ ብሔር
  choice: प्रभु
  rationale: गीज़ में यह परमेश्वर के लिए प्रयुक्त सामान्य पदवी है; ‘प्रभु’ उसके रूप और बाइबिलीय गरिमा को बनाए रखता है।
- source_word: ሣህለ፡ ዐቢየ
  choice: बड़ी दया
  rationale: शाब्दिक रूप से ‘महान दया’; आधुनिक हिन्दी में ‘उस पर बड़ी दया की’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ሠርሖ፡ ኵሎ፡ ፍኖቲሁ
  choice: उसके सभी मार्गों को सफल किया
  rationale: वाक्यांश का आशय उसके सारे मार्गों अथवा प्रयत्नों को फलवंत और सफल करने से है; हिन्दी में यह संरचना स्पष्ट है।
- source_word: ተማኅፀኖ፡ እምኵሉ
  choice: उसे सब कुछ से बचाए रखा
  rationale: मूल में ‘सब/सब कुछ से उसकी रक्षा की’ है और ‘बुराई’ जैसा अनुल्लिखित तत्व जोड़ना उचित नहीं; ‘बचाए रखा’ हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: आरंभिक क्रिया का पाठ और धार्मिकता गिने जाने का बाइबिलीय मुहावरा
  choice: यह उसके लिए धार्मिकता गिना गया
  alternative: धार्मिकता उसके पास आ गई
  rationale: प्रस्तुत पाठ में ወተኀለፈ (‘पार हुआ/आ गया’) दिखाई देता है, पर संपादकीय समीक्षा इसे ወተኈለቈ (‘गिना गया’) की OCR त्रुटि मानती है; उत्पत्ति 15:6 जैसे स्थापित मुहावरे और परीक्षित परामर्श-पाठ के आधार पर ‘गिना गया’ मुख्य पाठ में रखा गया है, जबकि वास्तविक पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: प्रभु की दया से संबंधित वाक्य-संरचना
  choice: कि प्रभु ने उस पर बड़ी दया की थी
  alternative: वह सब जो प्रभु ने उसके साथ किया था—वह बड़ी दया
  rationale: मुख्य पाठ ኵሎ ... ዘከመ की ‘सब कुछ—कि/कैसे’ संरचना को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक, किंतु कठिन, संबंध को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘धार्मिकता’, ‘प्रभु’ और ‘मार्ग’ जैसे बाइबिलीय पद बनाए गए हैं; जहाँ मूल की शाब्दिक संरचना हिन्दी में कठिन पड़ती है, वहाँ मुख्य पाठ को स्वाभाविक बनाया गया और वास्तविक विकल्प पादटिप्पणियों में रखा गया है।
