  text: May your table be full, and may your food not fail for all ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And the one who blesses you,
translation:
  language: hi
  text: तेरी मेज़ भरी रहे, और तेरा भोजन युग-युग तक कम न पड़े। जो तुझसे घृणा करते हैं, वे सब तेरे सामने गिर पड़ें; तेरे सभी विरोधी जड़ से उखाड़े जाएँ और नष्ट हो जाएँ। और जो तुझे आशीष देता है,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वाक्य अगले पद में पूरा होता है। कुछ अनुवाद यहाँ अर्थ पूरा करके देते हैं: “और आशीषित हो वह जो तुझे आशीष देता है।”'
    reason: पद-सीमा के कारण स्रोत में वाक्यांश अपूर्ण है और पूर्ववर्ती प्रस्तुति एक संभावित पूर्ण अर्थ बताती है।
lexical_decisions:
- source_word: ማዕድከ
  choice: तेरी मेज़
  rationale: शब्द का मूल अर्थ ‘तेरी मेज़’ है; आशीर्वाद के प्रसंग में यह भोजन और समृद्धि का संकेत भी देता है।
- source_word: ምልእተ
  choice: भरी रहे
  rationale: स्त्रीलिंग ‘मेज़’ के अनुरूप पूर्णता की कामना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እክልከ
  choice: तेरा भोजन
  rationale: यहाँ अनाज/खाद्य-सामग्री के व्यापक अर्थ को ‘भोजन’ सहज और समावेशी रूप में देता है।
- source_word: ለኵሉ ዓለማት
  choice: युग-युग तक
  rationale: शाब्दिक ‘सभी युगों के लिए’ का स्वाभाविक, गरिमापूर्ण हिन्दी रूप।
- source_word: ዐርከ
  choice: तेरे सभी विरोधी
  rationale: प्रसंग में शत्रु या प्रतिपक्षी का बोध है; ‘विरोधी’ अनावश्यक अर्थ-विस्तार से बचता है।
- source_word: ይሠረዉ
  choice: जड़ से उखाड़े जाएँ
  rationale: क्रिया के मूलोच्छेदन के बिंब को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ወዘይባርከከ
  choice: और जो तुझे आशीष देता है
  rationale: गीज़ पाठ में यह केवल कर्ता-पद है; इसका विधेय अगले पद में आता है, इसलिए वाक्यांश को जानबूझकर अधूरा रखा गया है।
theological_decisions:
- issue: पद के अंत में आशीष देने वाले व्यक्ति से जुड़ा अपूर्ण वाक्यांश
  choice: ‘और जो तुझे आशीष देता है,’ के रूप में पद-सीमा बनाए रखी
  alternative: ‘और जो तुझे आशीष देता है, वह आशीष पाए’ या ‘और आशीषित हो वह जो तुझे आशीष देता है’
  rationale: स्रोत-पाठ में इस पद के अंत तक केवल ‘जो तुझे आशीष देता है’ आता है; विधेय अगले पद में है। उसे यहाँ जोड़ना पद 31:18 की सामग्री को समय से पहले आयात करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय एकवचन ‘तू/तेरा’ रखा गया है, क्योंकि यह प्रत्यक्ष पितृसत्तात्मक आशीर्वचन है। शैली गरिमापूर्ण पर सामान्य पाठकों के लिए सहज है; समानांतर काव्यात्मक संरचना और स्रोत की पद-सीमा सुरक्षित रखी गई है।
