  text: Bethel. And Jacob remembered the prayer with which his father had blessed Levi and Judah, and he rejoiced and blessed the God of his fathers Abraham and Isaac. And he said, “Now I know that I have an everlasting hope, and my children also, before the God of all.” And thus it was ordained concerning the two of them, and it was recorded for them as an everlasting, righteous testimony on the heavenly tablets, just as Isaac blessed them.
translation:
  language: hi
  text: और यहूदा को; तब वह आनन्दित हुआ और उसने अपने पूर्वजों—अब्राहम और इसहाक—के परमेश्वर को धन्य कहा। उसने कहा, “अब मैं जान गया हूँ कि सर्वेश्वर के सामने मेरे लिए और मेरी सन्तानों के लिए भी सदा की आशा है।” इन दोनों के विषय में ऐसा ही ठहराया गया, और इसहाक ने जिस प्रकार उन्हें आशीष दी थी, उसी प्रकार उनके लिए स्वर्गीय पट्टिकाओं पर सदा का धार्मिकता का साक्ष्य अंकित किया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अन्तिम वाक्य का अर्थ यह भी हो सकता है: “इन दोनों के विषय में ऐसा ही ठहराया गया, और उनके लिए स्वर्गीय पट्टिकाओं पर सदा का धार्मिकता का साक्ष्य चढ़ाया गया।”'
    reason: प्रदत्त Ge'ez पाठ में अभिलेखन से जुड़ी क्रिया का रूप कठिन है और उसका शाब्दिक अर्थ ‘ऊपर चढ़ना/चढ़ाना’ हो सकता है; प्रसंग उसे स्वर्गीय पट्टिकाओं पर दर्ज किए जाने के अर्थ में समझने का समर्थन करता है।
lexical_decisions:
- source_word: ተስፋ፡ ዘለዓለም
  choice: सदा की आशा
  rationale: ‘आशा’ और उसके स्थायी/अनन्त स्वरूप दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አምላከ፡ ኵሉ
  choice: सर्वेश्वर
  rationale: शाब्दिक अर्थ ‘सबका परमेश्वर’ है; ‘सर्वेश्वर’ संक्षिप्त, स्वाभाविक और गैर-सांप्रदायिक है।
- source_word: ስምዕ፡ ዘለዓለም
  choice: सदा का … साक्ष्य
  rationale: ‘साक्ष्य/गवाही’ के अर्थ और अनन्त अवधि को सुरक्षित रखता है।
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाएँ
  rationale: स्वर्ग से सम्बद्ध लिखित पट्टिकाओं की पुस्तकगत छवि को बनाए रखता है।
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: स्रोत में उपस्थित righteousness/justice की संज्ञात्मक धारणा को छोड़े बिना ‘धार्मिकता का साक्ष्य’ के रूप में रखा गया है।
theological_decisions:
- issue: आशा का लाभार्थी
  choice: मेरे लिए और मेरी सन्तानों के लिए भी
  alternative: मुझमें और मेरी सन्तानों में
  rationale: Ge'ez में आशा के साथ वक्ता और उसकी सन्तान दोनों जुड़े हैं; हिन्दी में लाभार्थी अर्थ अधिक स्वाभाविक है और वंशगत प्रतिज्ञा को अनावश्यक रूप से परिभाषित नहीं करता।
- issue: स्वर्गीय पट्टिकाओं पर अभिलेखन
  choice: साक्ष्य अंकित किया गया
  alternative: वे अंकित किए गए / उनके लिए साक्ष्य चढ़ेगा
  rationale: सन्दर्भ में एकवचन ‘साक्ष्य’ या ठहराई गई व्यवस्था को अभिलेखित मानना अधिक सुसंगत है; व्यक्तियों को स्वयं लिखे जाने का अर्थ नहीं थोपा गया।
- issue: ‘धार्मिकता’ का सम्बन्ध
  choice: सदा का धार्मिकता का साक्ष्य
  alternative: सदा का धर्मी साक्ष्य
  rationale: संज्ञात्मक ‘धार्मिकता/न्याय’ को बनाए रखने से स्रोत की सम्भावित संरचनात्मक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध धार्मिक गद्य। प्रदत्त स्रोत-पंक्ति आरम्भ में पिछले वाक्य का खण्ड ‘और यहूदा को’ रखती है; उसे बिना गढ़ी हुई पूर्ति के सुरक्षित रखा गया है। ‘पूर्वजों—अब्राहम और इसहाक—’ से सम्बन्ध स्पष्ट किया गया है।
