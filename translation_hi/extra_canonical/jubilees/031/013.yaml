  text: 'and his left hand on Judah, and he turned toward Levi first and began to bless him, and said to him: “May the God of all, the Lord of all the ages, bless you'
translation:
  language: hi
  text: और अपना बायाँ हाथ यहूदा पर रखा।[a] फिर वह पहले लेवी की ओर मुड़ा और उसे आशीष देने लगा, और उससे कहा, “सबका परमेश्वर, जो सभी युगों का प्रभु है, तुझे आशीष दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यहूदा को अपने बाएँ हाथ से।”
    reason: स्रोत में क्रिया लुप्त है और पद-विभाजन के कारण वैकल्पिक, अधिक शाब्दिक विन्यास सम्भव है; मुख्य पाठ पिछले पद की जारी क्रिया को स्पष्ट करता है।
lexical_decisions:
- source_word: ወይሁዳን፡ በፀጋማዊ፡ እዴሁ፡
  choice: और अपना बायाँ हाथ यहूदा पर रखा
  rationale: यहूदा कर्म है और यह वाक्यांश पिछले पद में आरम्भ हुई हाथ रखने की क्रिया को पूरा करता है; हिन्दी में अर्थ स्पष्ट करने के लिए लुप्त क्रिया ‘रखा’ दोहराई गई है।
- source_word: ቀዲሙ፡
  choice: पहले
  rationale: लेवी को प्राथमिकता दिए जाने का अर्थ सुरक्षित रहता है, बिना ‘आशीष’ के साथ अनावश्यक पुनरावृत्ति किए।
- source_word: ይባርከ፡
  choice: आशीष दे
  rationale: यह आशीर्वचन की कामनार्थक क्रिया है; आधुनिक धार्मिक हिन्दी में स्वाभाविक रूप।
- source_word: አምላከ፡ ኵሉ፡
  choice: सबका परमेश्वर
  rationale: स्रोत के व्यापक संबंधवाचक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
- source_word: እግዚአ፡ ኵሉ፡ ዓለማት፡
  choice: सभी युगों का प्रभु
  rationale: ዓለማት का कालगत बहुवचन ‘युगों’ से व्यक्त होता है; इसे ‘संसारों’ बनाकर अर्थ सीमित नहीं किया गया।
theological_decisions:
- issue: ‘सबका परमेश्वर’ और ‘सभी युगों का प्रभु’ का संबंध
  choice: 'दोनों उपाधियों को एक ही कर्ता के लिए रखा गया: ‘सबका परमेश्वर, जो सभी युगों का प्रभु है’'
  alternative: ‘सबका परमेश्वर और सभी युगों का प्रभु’
  rationale: स्रोत का दूसरा पदबंध पहले का वर्णन करता प्रतीत होता है; ‘जो’ हिन्दी में संबंध स्पष्ट करता है, जबकि दोनों उपाधियों की अलग पहचान बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सरल शैली। ‘तुझे’ एकवचन संबोधन को बनाए रखता है और प्राचीन आशीर्वचन के प्रसंग में स्वाभाविक है।
