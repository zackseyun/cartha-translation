base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/026.yaml
  text: And in the morning Jacob told his father Isaac the prayer that he had prayed to the Lord[26], and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord.
translation:
  language: hi
  text: और सुबह याकूब ने अपने पिता इसहाक को उस प्रार्थना के बारे में बताया जो उसने प्रभु से की थी[a], और उस दर्शन के बारे में जो उसने देखा था, तथा यह कि उसने किस प्रकार एक वेदी बनाई थी और प्रभु के सामने बलि चढ़ाने के लिए सब कुछ तैयार था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में यहाँ प्रार्थना-संबंधी शब्द हैं। फिर भी निकट प्रसंग में बेतेल, वेदी, बलि और विलंब न करने की चेतावनी के कारण संभव है कि यहाँ मन्नत या मनौती अभिप्रेत हो।
    reason: alternative_reading
lexical_decisions:
- source_word: ጸሎተ፡ ዘጸለየ
  choice: उस प्रार्थना के बारे में...जो उसने...की थी
  rationale: मूल गीइज़ में संज्ञा और संबंधित क्रिया दोनों प्रार्थना के शब्द-परिवार से हैं; हिन्दी में स्वाभाविक रहते हुए इस पुनरुक्त अर्थ को सुरक्षित रखा गया है।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: ईश्वर के लिए प्रयुक्त पारंपरिक उपाधि का dignified और सामान्य हिन्दी समतुल्य।
- source_word: ሬአየ፡ ዘርእየ
  choice: उस दर्शन के बारे में...जो उसने देखा था
  rationale: दृष्टि/दर्शन देखने की मूल अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ምሥዋዐ
  choice: वेदी
  rationale: संदर्भ में निर्मित की जाने वाली altar के लिए मानक हिन्दी बाइबलीय शब्द।
- source_word: መሥዋዕት
  choice: बलि
  rationale: चढ़ाए जाने वाले sacrifice के लिए सरल, प्रचलित और संदर्भानुकूल शब्द।
- source_word: ድልው
  choice: तैयार था
  rationale: सभी आवश्यक वस्तुओं के प्रस्तुत अथवा तैयार होने का भाव व्यक्त करता है।
theological_decisions:
- issue: ጸሎተ/ዘጸለየ का अर्थ प्रार्थना है या मन्नत
  choice: मुख्य पाठ में “प्रार्थना”
  alternative: “मन्नत” या “मनौती”
  rationale: उपलब्ध गीइज़ पाठ प्रत्यक्ष रूप से प्रार्थना-संबंधी शब्दावली प्रयोग करता है। निकट संदर्भ मन्नत की ओर संकेत कर सकता है, इसलिए उस संभावना को पाठ में प्रतिस्थापित करने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। मूल की सूचीबद्ध वाक्य-रचना को हिन्दी में स्वाभाविक बनाने के लिए “के बारे में” और “यह भी कि” का प्रयोग किया गया है।
