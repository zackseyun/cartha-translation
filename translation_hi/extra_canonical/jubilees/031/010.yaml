  register: भाषा आधुनिक, गरिमापूर्ण और संवादोचित रखी गई है। ‘पुत्र’ मूल के निकट है; ‘बेटे’ की तुलना में यह ग्रंथीय शैली के अधिक अनुकूल है। अंग्रेज़ी परामर्श-पाठ का ‘Now’ हिन्दी में ‘अब’ के रूप में रखा गया है, जिससे पहचान की इस क्षण हुई पुष्टि स्वाभाविक रूप से व्यक्त होती है।
