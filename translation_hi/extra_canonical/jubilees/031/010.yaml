  text: For they resemble you.” And he told him that they were indeed his sons. And he said, “Now I see that they are truly your sons.”
translation:
  language: hi
  text: “क्योंकि वे तुमसे मिलते-जुलते हैं।” तब उसने उसे बताया कि वे सचमुच उसके पुत्र हैं। उसने कहा, “अब मैं देखता हूँ कि वे सचमुच तुम्हारे पुत्र हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስሉከ
  choice: वे तुमसे मिलते-जुलते हैं
  rationale: क्रिया का अर्थ ‘तुम्हारे समान दिखाई देना’ है; सहज आधुनिक हिन्दी में ‘तुमसे मिलते-जुलते’ पारिवारिक समानता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በአማን
  choice: सचमुच
  rationale: यह पुष्टि और निश्चय व्यक्त करता है; ‘सचमुच’ संवाद के प्रवाह में स्वाभाविक है।
- source_word: ውሉዱ
  choice: उसके पुत्र
  rationale: गीज़ रूप में तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय है, इसलिए कथावाचक वाक्य में ‘उसके पुत्र’ रखा गया है।
- source_word: ውሉድከ
  choice: तुम्हारे पुत्र
  rationale: संदर्भ और प्रमाणित पाठ-समीक्षा के अनुसार संबोधन याकूब से है और अर्थ ‘तुम्हारे पुत्र’ है; ‘पोते’ संबंध की दृष्टि से संभव व्याख्या है, पर मूल शब्द का प्रत्यक्ष अर्थ नहीं।
