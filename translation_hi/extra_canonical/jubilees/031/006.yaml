  text: And he came to his father Isaac and to his mother Rebekah. And Rebekah came out from the chamber to the door of the chamber to kiss Jacob and embrace him, for her spirit had revived when...
translation:
  language: hi
  text: वह अपने पिता इसहाक और अपनी माता रिबका के पास आया। रिबका कक्ष से निकलकर कक्ष के द्वार पर आई, ताकि वह याकूब को चूमे और उसे गले लगाए, क्योंकि उसकी आत्मा फिर से जीवित हो उठी थी जब…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ पाठ इस पद में ‘जब’ पर अधूरा समाप्त होता है; वाक्य का आशय अगले कथन में पूरा होता है।
    reason: पांडुलिपीय/पद-विभाजन के कारण बची हुई अपूर्ण वाक्य-संरचना को स्पष्ट करना, बिना मूल की अस्पष्टता मिटाए।
lexical_decisions:
- source_word: ማኅፈድ
  choice: कक्ष
  rationale: यह शब्द स्रोत में दो बार आया है; दोनों स्थानों पर एक ही हिंदी शब्द रखकर मूल की पुनरावृत्ति सुरक्षित रखी गई है। ‘कक्ष’ भीतर के निजी कमरे या chamber के अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: አንቀጸ
  choice: द्वार
  rationale: घरेलू कक्ष के संदर्भ में ‘द्वार’ उपयुक्त है और अनावश्यक रूप से बड़े प्रवेश-द्वार या फाटक का संकेत नहीं देता।
- source_word: ትስዐሞ
  choice: चूमे
  rationale: उद्देश्यसूचक संरचना ከመ के साथ क्रिया को ‘ताकि…चूमे’ के रूप में रखा गया है।
- source_word: ትሕቀፎ
  choice: उसे गले लगाए
  rationale: यह आलिंगन करने की क्रिया का सहज आधुनिक हिंदी रूप है।
- source_word: መንፈሳ
  choice: उसकी आत्मा
  rationale: ‘आत्मा’ मूल के spirit-संबंधी अर्थ को बनाए रखती है; इसे केवल ‘मन’ या ‘हिम्मत’ बनाकर अर्थ को सीमित नहीं किया गया।
- source_word: ሐይወ
  choice: फिर जी उठी थी
  rationale: क्रिया में पुनर्जीवन या चेतना लौटने का भाव है; यह रूप मूल की सजीव अभिव्यक्ति को सुरक्षित रखता है।
- source_word: በጊዜ
  choice: जब…
  rationale: यहाँ पद अगले कथन से जुड़ने वाला कालवाचक संयोजक है। उपलब्ध स्रोत-पाठ इसी स्थान पर कटता है, इसलिए वाक्य को कृत्रिम रूप से पूरा नहीं किया गया।
