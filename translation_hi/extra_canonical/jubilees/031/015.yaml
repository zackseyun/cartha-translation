  yaml_path: translation/extra_canonical/jubilees/031/015.yaml
  text: and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness[15], and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be in their mouths
translation:
  language: hi
  text: और पवित्रता। वह उन्हें सभी युगों भर महान करे। वे याकूब के पुत्रों के सभी वंशजों के लिए प्रधान, न्यायाधीश और अगुए होंगे। वे न्यायपूर्वक प्रभु का वचन सुनाएँगे और उसके सभी न्याय न्यायपूर्वक करेंगे। वे याकूब को उसके मार्ग और इस्राएल को उसकी राहें[a] बताएँगे। प्रभु की आशीष उनके मुख में होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इस्राएल को उसकी राहें’ वाला खंड पाठ की दृष्टि से कठिन है; कुछ व्याख्याकार यहाँ अधिक प्रबल अर्थ, जैसे ‘इस्राएल के लिए उसकी विधियाँ’ या ‘उसका अनुशासन’, समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ውስተ፡ ኵሉ፡ ዓለማት
  choice: सभी युगों में
  rationale: शाब्दिक अर्थ ‘सभी युगों/कालों में’ है; यह समयगत व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: መኳንንተ፡ ወመሳፍንተ፡ ወመላእክተ
  choice: प्रधान, न्यायी और अगुए
  rationale: तीन अलग नेतृत्वकारी पदों की श्रृंखला को सुरक्षित रखा गया है। अंतिम शब्द सामान्यतः ‘दूत’ भी हो सकता है, पर इस मानवीय वंश और नेतृत्व के संदर्भ में ‘अगुए’ उपयुक्त है; ‘स्वर्गदूत’ कहना अर्थ को अनुचित रूप से निश्चित कर देता।
- source_word: ቃሎ፡ ለእግዚአብሔር
  choice: प्रभु का वचन
  rationale: यह पदबंध ईश्वर के कथन या संदेश को दर्शाता है; ‘वचन’ गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है।
- source_word: በጽድቅ
  choice: धार्मिकता से
  rationale: न्यायोचित और धर्मसंगत रीति—दोनों भावों को समेटता है और दोनों आवृत्तियों में स्रोत की पुनरुक्ति बनाए रखता है।
- source_word: ፍኖቶ
  choice: मार्ग … राहें
  rationale: मार्ग/पथ संबंधी अर्थ को रखा गया है, जबकि हिन्दी में अत्यधिक कठोर पुनरावृत्ति से बचने के लिए समानार्थी शब्द प्रयुक्त हुए हैं।
- source_word: በረከተ፡ ለእግዚ
  choice: प्रभु की आशीष
  rationale: उपलब्ध स्रोत का अंतिम अंश कटा हुआ है, पर पद का परामर्श-पाठ इसे ‘प्रभु की आशीष’ के रूप में पूरा करता है।
theological_decisions:
- issue: अंतिम पदवी መላእክተ का अर्थ
  choice: अगुए
  alternative: दूत / स्वर्गदूत
  rationale: संदर्भ याकूब के पुत्रों के वंश में अधिकार रखने वालों का है। ‘स्वर्गदूत’ एक विशिष्ट अलौकिक अर्थ आरोपित कर सकता है; ‘अगुए’ परामर्श-पाठ के ‘chiefs’ और प्रसंग के अनुरूप है।
- issue: कठिन खंड में इस्राएल के लिए ‘राहें’
  choice: उसकी राहें
  alternative: उसकी विधियाँ / उसका अनुशासन
  rationale: पाठगत कठिनाई को मुख्य पाठ में सहज मार्ग-संबंधी अर्थ से प्रस्तुत किया गया है और अधिक प्रबल वैकल्पिक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘उसके सभी निर्णयों का न्याय’ की पुनरुक्ति
  choice: पुनरुक्ति बनाए रखी
  alternative: उसके सभी नियमों को धार्मिकता से लागू करेंगे
  rationale: स्रोत में न्याय/निर्णय की जानबूझकर निकट पुनरावृत्ति है; उसे व्याख्यात्मक ढंग से समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। आरंभिक ‘और पवित्रता’ को खंडित वाक्य के रूप में ही रखा गया है, क्योंकि यह पूर्ववर्ती पद से चली आ रही अभिव्यक्ति है; अनुमान लगाकर उसे पूर्ण वाक्य नहीं बनाया गया।
