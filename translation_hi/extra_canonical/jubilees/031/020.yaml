base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/020.yaml
  text: and in you shall the salvation of Israel be found. And on the day you sit on the throne of the glory of your righteousness[20], there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed.
translation:
  language: hi
  text: और तुझमें इस्राएल का उद्धार पाया जाएगा। जिस दिन तू अपनी धार्मिकता की महिमा के सिंहासन पर बैठेगा,[a] उस दिन प्रिय जन के पुत्रों के समस्त वंशजों के लिए बड़ी शांति होगी। जो तुझे आशीर्वाद देता है, वह धन्य हो; परन्तु वे सभी जो तुझसे घृणा करते और तुझे सताते हैं, और जो तुझे शाप देते हैं, जड़ से उखाड़े और नष्ट किए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वाक्यांश का अधिक शाब्दिक रूप है, “तेरी धार्मिकता की महिमा के सिंहासन पर”; इसे “तेरी धार्मिकता के महिमामय सिंहासन पर” भी समझा जा सकता है।
    reason: segmentation_note
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: इस्राएल का उद्धार
  rationale: ‘उद्धार/मुक्ति’ के अर्थ को स्वाभाविक और धर्मग्रंथीय हिन्दी में व्यक्त करता है, बिना यह तय किए कि आशय राजनीतिक छुटकारे का है या व्यापक उद्धार का।
- source_word: ክብር
  choice: महिमा
  rationale: यहाँ ‘सम्मान’ भी संभव है, पर सिंहासन के प्रसंग में ‘महिमा’ अधिक स्वाभाविक है और स्रोत की गरिमा बनाए रखता है।
- source_word: ጽድቅከ
  choice: तेरी धार्मिकता
  rationale: द्वितीय पुरुष संबंधसूचक रूप को स्पष्ट रखते हुए धार्मिकता/न्यायपरायणता के मूल भाव को सुरक्षित रखा गया है।
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: प्रिय जन के पुत्रों के समस्त वंशजों
  rationale: ‘वंश/संतान’, ‘पुत्रों’ और ‘प्रिय’—तीनों घटकों को बनाए रखता है; ለፍቅር को ‘सदा’ नहीं माना गया।
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: जड़ से उखाड़े और नष्ट किए जाएँगे
  rationale: पहली क्रिया के मूलोच्छेदन और दूसरी के विनाश/लोप—दोनों समानांतर भावों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रिय जन’ की पहचान
  choice: पहचान को अनिर्दिष्ट रखा गया
  alternative: इसे किसी विशिष्ट कुलपति, इस्राएल, या परमेश्वर के प्रिय समुदाय से स्पष्ट रूप से जोड़ना
  rationale: स्रोत-पंक्ति स्वयं संज्ञा का स्पष्ट संदर्भ नहीं देती; किसी एक धर्मवैचारिक पहचान को थोपना उचित नहीं।
- issue: ‘उद्धार’ का स्वरूप
  choice: व्यापक ‘उद्धार’ शब्द रखा गया
  alternative: राजनीतिक मुक्ति या आत्मिक उद्धार के रूप में विशेषीकृत करना
  rationale: स्रोत दोनों प्रकार की व्याख्या की संभावना खुली रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज धर्मग्रंथीय शैली अपनाई गई है। संबोधन की एकवचन निकट/गंभीर शैली के लिए ‘तू/तुझे/तेरी’ रखा गया है। स्रोत के ‘जिस दिन’ को छोड़ा नहीं गया और घनी सिंहासन-संबंधी रचना की वास्तविक अस्पष्टता फुटनोट में सुरक्षित रखी गई है।
