  yaml_path: translation/extra_canonical/jubilees/031/029.yaml
  text: in that you have seen me alive, and I also have seen you, my son. Prosper and fulfill the vow that you have vowed, and do not delay your vow, for you will be called to account concerning the vow, and now hasten to perform it.
translation:
  language: hi
  text: क्योंकि[a] तूने मुझे जीवित देखा है और मैंने भी तुझे देखा है, मेरे बेटे। फलता-फूलता रह और जो मन्नत तूने मानी है, उसे पूरा कर। अपनी मन्नत पूरी करने में देर न कर, क्योंकि उस मन्नत के विषय में तुझसे हिसाब माँगा जाएगा। अब उसे पूरा करने में शीघ्रता कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक पद का अनुवाद ‘इस कारण कि’ भी हो सकता है; मूल में ‘दिन’ शब्द नहीं है।
    reason: गीज़ संबंधसूचक अभिव्यक्ति यहाँ अमूर्त कारण या परिस्थिति बताती है। संदर्भ में किसी ‘दिन’ का उल्लेख नहीं है।
lexical_decisions:
- source_word: እንተ፡ ባቲ፡
  choice: इस बात में कि
  rationale: यह संबंधसूचक पद यहाँ किसी स्पष्ट ‘दिन’ का उल्लेख नहीं करता; इसलिए अमूर्त संबंध को बनाए रखते हुए इसे ‘इस बात में कि’ दिया गया है।
- source_word: ተስፋሕ፡
  choice: तू फलता-फूलता रह
  rationale: क्रिया समृद्ध, विस्तृत या उन्नत होने का भाव देती है; हिंदी में आशीषात्मक-आज्ञार्थक स्वर स्वाभाविक रूप से रखा गया है।
- source_word: ጸሎተ፡ / ጸሎተከ፡
  choice: मन्नत / अपनी मन्नत
  rationale: शब्द का सामान्य अर्थ ‘प्रार्थना’ है, पर इस प्रसंग में उसे पूरा करने, देर न करने और उसके लिए लेखा माँगे जाने की भाषा प्रतिज्ञात्मक मन्नत की ओर संकेत करती है।
- source_word: ትትኀሠሥ፡
  choice: तुझसे लेखा लिया जाएगा
  rationale: मूल का भाव खोजे या पूछे जाने का है; मन्नत के संदर्भ में उत्तरदायित्व का स्वाभाविक हिंदी रूप ‘लेखा लिया जाएगा’ है।
- source_word: ጕጕአ፡ ትግበራ፡
  choice: उसे पूरा करने में शीघ्रता कर
  rationale: मूल के ‘शीघ्र कर, उसे कर’ भाव को अनावश्यक पुनरुक्ति के बिना स्पष्ट हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: ጸሎት को ‘प्रार्थना’ या ‘मन्नत’ के रूप में समझना
  choice: मन्नत
  alternative: प्रार्थना
  rationale: निकटवर्ती क्रियाएँ—मानना, पूरा करना, विलंब न करना और लेखा लिया जाना—यहाँ साधारण प्रार्थना के बजाय ईश्वर से की गई मन्नत का अर्थ समर्थित करती हैं।
- issue: उत्तरदायित्व की भाषा
  choice: तुझसे लेखा लिया जाएगा
  alternative: उस मन्नत के विषय में तुझे खोजा जाएगा
  rationale: वैकल्पिक शब्दशः रूप हिंदी में अर्थ अस्पष्ट करता है; चुना हुआ रूप दायित्व को व्यक्त करता है, पर यह नहीं बताता कि लेखा कौन लेगा।
translation_notes:
  register: आधुनिक मानक हिंदी में आत्मीय एकवचन ‘तू’ रखा गया है, क्योंकि पिता अपने पुत्र को संबोधित कर रहा है। शैली गरिमामय पर सरल है; ‘मन्नत मानना’ और ‘मन्नत पूरी करना’ सामान्य हिंदी प्रयोग हैं।
