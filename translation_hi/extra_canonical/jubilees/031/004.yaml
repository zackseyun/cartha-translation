lexical_decisions:
- source_word: ውስተ፡ መሥዋዕቱ
  choice: उसके बलिदान के समय
  rationale: ውስተ का मूल स्थानगत अर्थ ‘में/पर’ है; इस खंडित वाक्य के संदर्भ में स्वाभाविक हिन्दी में अवसर या उपस्थिति का भाव ‘के समय’ से व्यक्त होता है, बिना बलिदान की प्रकृति तय किए।
- source_word: እሙሂ፡ ርብቃ
  choice: उसकी माता रिबका के पास भी
  rationale: እሙ ‘उसकी माता’, -ሂ ‘भी’, और नाम ርብቃ को मानक हिन्दी रूप ‘रिबका’ में रखा गया है; पूर्वसर्गीय संबंध को खंड के प्रवाह के अनुसार ‘के पास’ से व्यक्त किया गया है।
- source_word: ይምጻእ
  choice: आए
  rationale: आज्ञार्थक/इच्छार्थक रूप को हिन्दी के स्वाभाविक विधिलिंग ‘आए’ से व्यक्त किया गया है।
- source_word: ወልድየ፡ ያዕቆብ
  choice: मेरा पुत्र याकूब
  rationale: संबंधसूचक प्रथम पुरुष को ‘मेरा’ और नाम को प्रचलित हिन्दी बाइबलीय रूप ‘याकूब’ में प्रस्तुत किया गया है।
