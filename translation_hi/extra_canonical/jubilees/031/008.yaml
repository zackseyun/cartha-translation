lexical_decisions:
- source_word: ጽርሕ
  choice: कक्ष
  rationale: यह शब्द उस भीतरी कमरे या कक्ष को दर्शाता है जहाँ इसहाक लेटा था; ‘कक्ष’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ደቂቁ
  choice: उसके दोनों बेटे
  rationale: मूल में संबंधवाचक सर्वनाम है और संदर्भ में याकूब के साथ आए उसके दो पुत्र अभिप्रेत हैं; ‘बेटे’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: እዴ፡ አቡሁ
  choice: अपने पिता का हाथ थामा
  rationale: वाक्यांश को प्रसंगानुकूल क्रिया के साथ व्यक्त किया गया है; इससे पिता का हाथ पकड़ने/थामने का भाव आता है, बिना अनावश्यक रूप से ‘फैलाने’ का अर्थ आरोपित किए।
- source_word: ወደነነ፡ ሰዐሞ
  choice: झुककर उसे चूमा
  rationale: दोनों क्रमिक क्रियाओं—झुकने और चूमने—को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ወተሰቅለ
  choice: तब इसहाक उससे लिपट गया
  rationale: क्रिया का भाव किसी पर झुकने, टिकने या उससे लिपट जाने का है। उपलब्ध पाठ अगली संबंधसूचक इकाई पर कट जाता है, इसलिए हिन्दी में अपूर्णता को डैश से दिखाया गया है।
theological_decisions:
- issue: अंतिम वाक्य का अपूर्ण होना
  choice: ‘तब इसहाक उससे लिपट गया—’ के रूप में पाठ को खुला छोड़ा गया
  alternative: बाद की पांडुलिपि/पूर्ण पाठ के आधार पर ‘याकूब की गर्दन से लिपट गया’ जोड़ना
  rationale: दिए गए गीइज़ स्रोत का अंत ውስተ (‘में/पर’) पर कट गया है। अप्रदत्त शब्दों को जोड़ना स्रोत से आगे जाकर पाठ पूरा करना होता।
- issue: ‘उसके दोनों बेटे’ में सर्वनाम का संदर्भ
  choice: मूल की सर्वनामगत संरचना बनाए रखी गई
  alternative: स्पष्ट रूप से ‘याकूब के दोनों बेटे’ कहना
  rationale: संदर्भ याकूब की ओर संकेत करता है, पर मूल में नाम दोहराया नहीं गया; अनावश्यक स्पष्टता जोड़ने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। संबंधों के लिए ‘पिता’ और ‘बेटे’ जैसे सामान्य शब्द रखे गए हैं। स्रोत के कटे हुए अंत को पूरा नहीं किया गया, बल्कि डैश द्वारा उसकी अपूर्णता दिखाई गई है। आरंभिक በዲበ፡ ምድር። (‘पृथ्वी पर’) व्याकरणतः पिछले वाक्य का अवशेष प्रतीत होता है और अंग्रेज़ी परामर्श-पाठ में भी इस पद का भाग नहीं माना गया, इसलिए इसे मुख्य अनुवाद में शामिल नहीं किया गया।
