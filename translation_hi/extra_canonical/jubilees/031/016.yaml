base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/016.yaml
  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
translation:
  language: hi
  text: कि वे प्रिय जन के समस्त वंश को आशीष दें। तेरी माता ने तेरा नाम लेवी रखा, और सचमुच उसने तेरा यही नाम रखा।[a] तू प्रभु से जुड़ जाएगा और याकूब के सभी पुत्रों का सहभागी होगा। उसकी मेज़ तेरी हो; तू और तेरे पुत्र उसमें से खाएँ। और तेरी मेज़ सब पीढ़ियों के लिए भरपूर रहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लेवी” नाम और अगले वाक्य के “जुड़ जाएगा” में एक शब्द-संबंध है।
    reason: नाम और ‘जुड़ने’ के बीच स्रोत में निहित शब्द-क्रीड़ा हिन्दी पाठक के लिए स्पष्ट करना।
  - marker: b
    text: कुछ संक्षिप्त पाठ-साक्ष्यों में अंतिम शब्द केवल “सबके लिए” तक मिलते हैं; पूर्ण पाठ में “सब पीढ़ियों के लिए” है।
    reason: प्रेषित स्रोत-अंश के कटे हुए अंत और प्रमाणित पूर्ण पाठ के बीच अंतर दर्ज करना।
lexical_decisions:
- source_word: ዘርአ፡ ለፍቅር
  choice: प्रिय जन का समस्त वंश
  rationale: ‘वंश/संतान’ के सामूहिक अर्थ और ‘प्रिय’ के एकवचन संबंध को बनाए रखता है।
- source_word: እምከ፡ ስመከ፡ ሌዊን
  choice: तेरी माता ने तेरा नाम लेवी रखा
  rationale: እምከ (‘तेरी माता’) को कर्ता के रूप में स्पष्ट रखता है और पूर्ववर्ती अंग्रेज़ी संशोधन में हुई चूक से बचता है।
- source_word: በአማን
  choice: सचमुच
  rationale: यहाँ क्रियाविशेषण की पुष्टि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘उचित रूप से’ जैसा अतिरिक्त मूल्यांकन जोड़े।
- source_word: አጸቶ
  choice: जुड़ जाएगा
  rationale: लेवी नाम से जुड़े ‘जुड़ने’ के शब्द-संबंध को सम्भव सीमा तक सुरक्षित रखता है।
- source_word: ሱታፌ
  choice: सहभागी
  rationale: साथ, भागीदारी और सहभागिता के अर्थ को धार्मिक पदानुक्रम की अतिरिक्त धारणा के बिना व्यक्त करता है।
- source_word: ማእዳ
  choice: मेज़
  rationale: भोजन और संगति—दोनों के ठोस बिंब को बनाए रखता है।
theological_decisions:
- issue: प्रभु से लेवी का ‘जुड़ना’
  choice: तू प्रभु से जुड़ जाएगा
  alternative: तू प्रभु का याजक होगा
  rationale: स्रोत में ‘जुड़ने’ की भाषा है; विशिष्ट याजकीय पद को स्पष्टतः जोड़ना व्याख्यात्मक विस्तार होता।
- issue: ‘उसकी मेज़’ का संकेत
  choice: उसकी मेज़ तेरी हो
  alternative: प्रभु की मेज़ तेरी हो
  rationale: सर्वनाम की स्रोतगत संरचना और उसके संभावित संकेत को खुला रखा गया है; प्रभु को स्पष्ट संज्ञा बनाकर अस्पष्टता नहीं मिटाई गई।
- issue: अंतिम आशीष की अवधि
  choice: सब पीढ़ियों के लिए
  alternative: सबके लिए
  rationale: पूर्ण पद-पाठ में उपलब्ध ‘पीढ़ियों’ को शामिल किया गया है; दिए गए उद्धरण का अंतिम भाग कट जाने के कारण इसे हटाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और प्रत्यक्ष संबोधन रखा गया है। प्राचीन आशीर्वचन का स्वर बनाए रखने के लिए ‘तेरी/तू’ और विध्यर्थक ‘हो’ का प्रयोग किया गया है।
