translation:
  language: hi
  text: और महीने के नए चाँद के दिन[a] याकूब ने अपने घराने के सब लोगों से कहा, “अपने को शुद्ध करो और अपने वस्त्र बदलो। फिर हम उठकर बेतेल चलें, जहाँ मैंने उस दिन उससे प्रार्थना की थी जब मैं अपने भाई एसाव के सामने से भागा था। वह मेरे साथ रहा और मुझे सकुशल इस देश में वापस ले आया। और दूर कर दो[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात महीने के पहले दिन।
    reason: गीज़ पदबंध ‘महीने के नए चाँद’ को सूचित करता है और कैलेंडरी अर्थ में महीने के पहले दिन का द्योतक है।
  - marker: b
    text: वाक्य अगले पद में पूरा होता है।
    reason: पद-विभाजन आज्ञा को उसके कर्म से अलग करता है; उद्धरण और व्याकरणिक प्रवाह बनाए रखने के लिए।
lexical_decisions:
- source_word: በሠርቀ፡ ወርኅ፡
  choice: महीने की अमावस्या के दिन
  rationale: गीज़ पदबंध महीने के आरम्भ अथवा नवचंद्र के दिन को सूचित करता है, न कि ‘पहले महीने’ को। ‘अमावस्या’ आधुनिक हिन्दी में सहज है, यद्यपि ‘नवचंद्र’ इसका अधिक शाब्दिक विकल्प है।
- source_word: ንጽሑ፡
  choice: अपने आप को शुद्ध करो
  rationale: बहुवचन आज्ञार्थक क्रिया को अनुष्ठानिक और नैतिक अर्थ की गुंजाइश रखते हुए प्रस्तुत किया गया है।
- source_word: ንዕርግ፡ ቤቴል፡
  choice: बेतेल चलें
  rationale: ‘ऊपर चढ़ें’ स्रोत का शाब्दिक रूप है; हिन्दी में गंतव्य की ओर जाने के लिए ‘चलें’ अधिक स्वाभाविक है और अभिप्रेत गति सुरक्षित रखता है।
- source_word: እምገጸ፡ ዔሳው፡
  choice: एसाव के सामने से
  rationale: ‘मुख/उपस्थिति के सामने से’ का औपचारिक अनुरूप रखा गया है; इसे केवल ‘एसाव से’ बनाकर स्रोत की अभिव्यक्ति नहीं मिटाई गई।
- source_word: ወሜጠኒ፡
  choice: मुझे ... वापस ले आया
  rationale: क्रिया लौटाने या वापस लाने का भाव देती है, इसलिए केवल ‘ले आया’ से अधिक स्पष्ट अनुवाद चुना गया।
- source_word: ወአስስሉ፡
  choice: और दूर कर दो
  rationale: यह बहुवचन आज्ञार्थक है और याकूब के कथन को अगले पद में जारी रखता है; इसका कर्म अगले पद में आता है।
theological_decisions:
- issue: याकूब की प्रार्थना और परमेश्वर की संगति के लिए सर्वनाम
  choice: ‘उससे’ और ‘वह’
  alternative: स्पष्ट रूप से ‘परमेश्वर से’ और ‘परमेश्वर’
  rationale: स्रोत में सर्वनाम हैं। अनुवाद ने पूर्ववर्ती संदर्भ को स्पष्ट नाम से भरकर व्याख्यात्मक विस्तार नहीं किया।
- issue: शुद्ध होने की प्रकृति
  choice: ‘अपने आप को शुद्ध करो’
  alternative: ‘अपने को पवित्र करो’ या किसी विशिष्ट धार्मिक विधि का उल्लेख
  rationale: स्रोत विशिष्ट रीति नहीं बताता; इसलिए धार्मिक अर्थ को सुरक्षित रखते हुए अनिर्दिष्टता बनाए रखी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘घराने’, ‘शुद्ध करो’ और ‘सकुशल’ जैसे शब्द बाइबलीय वातावरण रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं। अंतिम उद्धरण जानबूझकर बंद नहीं किया गया, क्योंकि याकूब की आज्ञा अगले पद में जारी है।
