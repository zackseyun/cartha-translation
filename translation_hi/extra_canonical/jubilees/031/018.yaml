  text: and cursed be every people that curses you.” And to Judah he said, “May the Lord give you strength and power, so that you may tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go about and travel through all the earth and its regions. Then nations shall fear before your face,”
translation:
  language: hi
  text: “और हर वह जनजाति जो तुझे शाप दे, शापित हो।” फिर उसने यहूदा से कहा, “प्रभु तुझे बल और सामर्थ्य दे, ताकि तू उन सबको पैरों तले रौंदे जो तुझसे बैर रखते हैं। याकूब के पुत्रों पर तू शासक हो, और तेरे पुत्रों में से एक भी। तेरा नाम और तेरे पुत्रों के नाम सारी पृथ्वी और उसके प्रदेशों में फैलते-फिरते रहें। तब जातियाँ तेरे सामने डरेंगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ
  choice: जाति
  rationale: यहाँ किसी संगठित जनसमुदाय का बोध है; ‘जाति’ आधुनिक बाइबलीय हिन्दी में प्रसंगानुकूल है, जबकि इसे केवल आधुनिक राष्ट्र-राज्य के अर्थ में सीमित नहीं करता।
- source_word: ኀይለ፡ ወጽንዐ
  choice: बल और सामर्थ्य
  rationale: दोनों निकटार्थक संज्ञाओं की युग्मात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है; दूसरा पद दृढ़ता/शक्ति का भाव रखता है।
- source_word: ትኪዶሙ
  choice: पैरों तले रौंदे
  rationale: मूल क्रिया शत्रुओं पर चलने या उन्हें कुचलने की प्रबल विजय-छवि देती है; केवल ‘हरा दे’ उस चित्रात्मकता को कम कर देता।
- source_word: ዘየሐውር፡ ወዘያንሶሱ
  choice: घूमता-फिरता रहे
  rationale: दो समानांतर गति-सूचक क्रियाओं—जाने/चलने और इधर-उधर घूमने—को सहज हिन्दी युग्म से व्यक्त किया गया है।
- source_word: አሕዛብ
  choice: जाति-जाति के लोग
  rationale: बहुवचन जनजातियों/अन्यजातियों का व्यापक अर्थ देता है और किसी विशेष आधुनिक राजनीतिक अर्थ को आरोपित नहीं करता।
theological_decisions:
- issue: यहूदा और उसके वंशज में से एक का शासन
  choice: “तू और तेरे वंशजों में से एक”
  alternative: “तू और तेरा एक पुत्र”
  rationale: मूल का पद शाब्दिक रूप से ‘तेरी संतान में से एक’ है। ‘वंशज’ संभावित दूरवर्ती उत्तराधिकारी की गुंजाइश बनाए रखता है और किसी विशिष्ट मसीही पहचान को अनकहे रूप में निश्चित नहीं करता।
- issue: भय का वाक्यांश
  choice: “तेरे सामने भय खाएँगे”
  alternative: “तेरे मुख के सामने डरेंगे”
  rationale: मूल के ‘तेरे मुख के सामने/तेरी उपस्थिति से’ भाव को स्वाभाविक हिन्दी में रखा गया है, बिना यह तय किए कि भय केवल व्यक्तिगत उपस्थिति से है या शासन-प्रताप से।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। दूसरे पुरुष एकवचन के लिए ‘तू/तुझे/तेरे’ का प्रयोग प्राचीन पितृसत्तात्मक आशीर्वाद की निकट और गंभीर शैली बनाए रखता है। स्रोत-पंक्ति के आरम्भ का ቡሩክ (‘धन्य’) संभवतः पिछले वाक्य/पद की समाप्ति है; उपलब्ध अंग्रेज़ी परामर्श-पाठ और वाक्य-संरचना के अनुसार इस पद का पाठ ‘और जो कोई जाति…’ से आरम्भ किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
