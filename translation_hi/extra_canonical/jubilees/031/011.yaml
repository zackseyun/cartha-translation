lexical_decisions:
- source_word: አማን
  choice: सचमुच
  rationale: यह कथन की सत्यता और दृढ़ पुष्टि व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ውሉድየ
  choice: मेरे बच्चे
  rationale: प्रत्यय सहित संज्ञा का अर्थ ‘मेरे बच्चे/संतान’ है; प्रसंग में बहुवचन ‘बच्चे’ सहज है।
- source_word: ቀርቡ ኀቤሁ
  choice: वे उसके पास आए
  rationale: स्रोत के निकट आने की क्रिया और पुरुषवाचक संबंध को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ተመይጠ
  choice: उसने मुड़कर
  rationale: क्रिया के मूल भाव ‘मुड़ना/फिरना’ को बनाए रखता है, बिना उसे अनावश्यक रूप से व्याख्यायित किए।
- source_word: ሰዐሞሙ
  choice: उन्हें चूमा
  rationale: बहुवचन कर्म के साथ चूमने की क्रिया का सीधा अनुवाद है।
- source_word: ሐቀፎሙ
  choice: गले लगाया
  rationale: आलिंगन करने की क्रिया के लिए आधुनिक मानक हिन्दी का स्वाभाविक प्रयोग है।
