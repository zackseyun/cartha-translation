  text: with you. And I know, my son, that it was for my sake you came, and this day shall be blessed.
translation:
  language: hi
  text: तेरे साथ। और मैं जानता हूँ, मेरे बेटे, कि तू मेरी खातिर आया है, और यह दिन धन्य होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስሌከ
  choice: तेरे साथ
  rationale: यह पुल्लिंग एकवचन संबोधन वाला वाक्यांश है; पद पिछले वाक्य से जुड़े इसी खंड के साथ आरम्भ होता है।
- source_word: በእንቲአየ
  choice: मेरी खातिर
  rationale: मूल का अर्थ ‘मेरे कारण/मेरे निमित्त’ है; ‘मेरी खातिर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रयोजन और व्यक्तिगत कारण, दोनों को व्यक्त करता है।
- source_word: ትኩን፡ ቡርክት
  choice: धन्य होगा
  rationale: स्त्रीलिंग ‘यह दिन’ के विषय में प्रयुक्त आशीष-सूचक विधेय को स्वाभाविक हिन्दी भविष्यकाल में व्यक्त किया गया है।
theological_decisions:
- issue: दिन के धन्य होने का कथन
  choice: यह दिन धन्य होगा
  alternative: यह दिन धन्य हो
  rationale: क्रियारूप को केवल कामना बनाकर सीमित नहीं किया गया; स्रोत और प्रसंगानुकूल भविष्यसूचक कथन को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज है। पिता द्वारा पुत्र को किए गए एकवचन आत्मीय संबोधन के लिए ‘तू/तेरे’ रखा गया है। आरम्भिक ‘तेरे साथ’ पिछले पद से जुड़े अपूर्ण वाक्यांश की संरचना को जानबूझकर सुरक्षित रखता है।
