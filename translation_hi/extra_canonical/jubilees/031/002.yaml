  text: the foreign gods that are among you.' And they gave him the foreign gods, and what was in their ears and what was on their necks, and the idols that Rachel had stolen from Laban her brother. And she gave them all to Jacob, and he burned them, and crushed them, and destroyed them, and hid them under the oak that was in the land of Shechem.
translation:
  language: hi
  text: “वे पराए देवता जो तुम्हारे बीच हैं।” तब उन्होंने वे पराए देवता उसे दे दिए, और जो कुछ उनके कानों में और उनकी गर्दनों पर था, और वे मूर्तियाँ भी जिन्हें राहेल ने अपने भाई लाबान से चुराया था। उसने वह सब याकूब को दे दिया। तब याकूब ने उन्हें जला दिया, कुचल दिया, नष्ट कर दिया, और शकेम की भूमि में स्थित बलूत[a] के पेड़ के नीचे छिपा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वृक्ष के इस शब्द का अनुवाद “तारपीन वृक्ष” भी किया जा सकता है; गीज़ शब्द से वृक्ष की सटीक जाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አማልክተ፡ ነኪር
  choice: पराए देवता
  rationale: यह पदबंध ऐसे देवताओं को दर्शाता है जो याकूब के घराने के अपने परमेश्वर से भिन्न हैं; ‘पराए देवता’ स्रोत का धार्मिक और संबंधपरक भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ዘውስተ፡ እዘኒሆሙ / ዘውስተ፡ ክሳውዲሆሙ
  choice: जो कुछ उनके कानों में और उनके गलों में था
  rationale: शरीर-अंगों के साथ प्रयुक्त स्थानवाचक अभिव्यक्ति को जानबूझकर व्यापक रखा गया है; स्रोत स्वयं वस्तुओं को स्पष्ट रूप से आभूषण नहीं कहता।
- source_word: ጣዖተ
  choice: मूर्तियाँ
  rationale: यहाँ राहेल द्वारा लाबान से चुराई गई उपासना-वस्तुओं के लिए सामान्य और स्पष्ट हिन्दी शब्द उपयुक्त है।
- source_word: ወአውዕዮ፡ ወፀተሞ፡ ወአማስኖ
  choice: जला दिया, कुचल दिया, नष्ट कर दिया
  rationale: स्रोत में आए तीनों क्रमिक क्रियापदों को बिना किसी को छोड़े अलग-अलग रखा गया है।
- source_word: ድርዋስ
  choice: बलूत का पेड़
  rationale: वृक्ष की सटीक जाति अनिश्चित है; मुख्य पाठ में प्रचलित ‘बलूत’ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: ምድረ፡ ሰቂሞን
  choice: शकेम की भूमि
  rationale: स्थान-नाम को प्रचलित बाइबिलीय हिन्दी रूप ‘शकेम’ में लिप्यंतरित किया गया है।
theological_decisions:
- issue: पद के आरम्भ में पिछले कथन का समापन
  choice: 'आरम्भिक शब्दों को सीधे उद्धरण के अंत के रूप में रखा गया: “वे पराए देवता जो तुम्हारे बीच हैं।”'
  alternative: इसे कथावाचक का स्वतंत्र वाक्य मानना या ‘उनके बीच थे’ करना
  rationale: द्वितीय पुरुष बहुवचन रूप ‘तुम्हारे बीच’ पिछले पद में याकूब के आदेश को जारी रखता है; इसके बाद अलग क्रिया से लोगों द्वारा वस्तुएँ उसे देने की घटना शुरू होती है।
- issue: कानों और गलों की वस्तुओं की प्रकृति
  choice: वस्तुओं को सामान्य रूप से ‘जो कुछ ... था’ कहा गया
  alternative: उन्हें निश्चित रूप से ‘कुंडल और हार’ या ताबीज कहना
  rationale: स्रोत स्थान बताता है, पर वस्तुओं की प्रकृति या धार्मिक भूमिका को स्पष्ट नहीं करता; अतः व्याख्यात्मक निश्चितता नहीं जोड़ी गई।
- issue: विनाश की क्रियाओं का क्रम
  choice: जलाना, कुचलना और नष्ट करना—तीनों रखा गया
  alternative: ‘कुचल दिया और छिपा दिया’ जैसा संक्षिप्त पाठ
  rationale: गीज़ पाठ में तीन स्पष्ट विनाशकारी क्रियाएँ हैं; किसी एक को हटाने से स्रोत का विवरण घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। वाक्य-क्रम कथा की गति के अनुरूप है और स्रोत की पुनरुक्ति तथा तीनों विनाशकारी क्रियाओं को सुरक्षित रखा गया है।
