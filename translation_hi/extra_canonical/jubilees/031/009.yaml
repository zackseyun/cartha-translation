  text: He embraced the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?”
translation:
  language: hi
  text: वह अपने पुत्र याकूब की गर्दन से लिपट गया और उसकी गर्दन पर रोया। तब इसहाक की आँखों का धुँधलापन दूर हो गया, और उसने याकूब के दोनों पुत्रों, लेवी और यहूदा, को देखा और कहा, “मेरे पुत्र, क्या ये तुम्हारे पुत्र हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክሳደ፡ ያዕቆብ፡ ወልዱ፡ ወበከየ፡ ዲበ፡ ክሳዱ
  choice: अपने पुत्र याकूब को गले लगाया और उसकी गर्दन पर सिर रखकर रोया
  rationale: स्रोत में ‘याकूब की गर्दन’ और ‘उसकी गर्दन पर रोया’ का शाब्दिक चित्र है; स्वाभाविक हिन्दी में गले लगाने और गर्दन पर सिर रखकर रोने से वही दृश्य व्यक्त होता है। आरंभिक क्रिया प्रसंग से निहित है।
- source_word: ጽላሌ
  choice: धुँधलापन
  rationale: यह आँखों पर छाए धुँधलेपन या दृष्टि-बाधा को सूचित करता है; ‘धुँधलापन’ सामान्य और प्रसंगानुकूल हिन्दी है।
- source_word: ክልኤሆሙ፡ ውሉደ፡ ለያዕቆብ
  choice: याकूब के दोनों पुत्रों
  rationale: द्विवचन-सदृश संख्या-सूचना और पुत्र-संबंध दोनों स्पष्ट रखे गए हैं।
- source_word: ውሉድከሁ፡ እሉ፡ ወልድየ
  choice: मेरे पुत्र, क्या ये तुम्हारे बेटे हैं?
  rationale: प्रश्न का स्वाभाविक हिन्दी क्रम अपनाया गया है और अंतिम संबोधन ‘मेरे पुत्र’ को सुरक्षित रखा गया है।
