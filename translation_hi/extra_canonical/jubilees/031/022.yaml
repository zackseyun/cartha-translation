  yaml_path: translation/extra_canonical/jubilees/031/022.yaml
  text: He had seen the sons of Jacob his son truly. And he went out from between his feet and fell down and bowed to him. And he blessed them and rested there near Isaac his father that night[22], and they ate and drank.
translation:
  language: hi
  text: उसने अपने पुत्र याकूब के पुत्रों को सचमुच देखा था। फिर वह उसके पैरों के बीच से निकलकर[a] गिर पड़ा और उसे दण्डवत् प्रणाम किया। उसने उन्हें आशीर्वाद दिया और उस रात अपने पिता इसहाक के पास वहीं ठहरा; और उन्होंने खाया-पिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके पैरों के बीच से निकलकर” स्रोत की एक कठिन और अस्पष्ट अभिव्यक्ति है। सम्भवतः इसका अर्थ है कि याकूब इसहाक के बिलकुल पास से पीछे हटा और फिर झुककर उसे दण्डवत् प्रणाम किया।
    reason: segmentation_note
lexical_decisions:
- source_word: ዘበጽድቅ
  choice: सचमुच
  rationale: यहाँ यह पदबंध क्रियाविशेषण रूप में ‘सत्य ही/वास्तव में’ का भाव देता है; ‘धार्मिकता में’ इस प्रसंग में अस्वाभाविक और अस्पष्ट होगा।
- source_word: ወወፅአ፡ እማእከለ፡ እገሪሁ
  choice: फिर वह उसके पैरों के बीच से निकलकर
  rationale: स्रोत की असामान्य स्थान-सूचक अभिव्यक्ति को अर्थगत अनिश्चितता सहित निकटता से रखा गया है; सर्वनाम का संदर्भ प्रसंगानुसार इसहाक है।
- source_word: ወሰገደ፡ ሎቱ
  choice: और उसे दण्डवत् किया
  rationale: ወሰገደ भूमि पर झुककर सम्मान प्रकट करने का संकेत देता है; ‘दण्डवत् किया’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: ወአዕረፈ፡ ህየ
  choice: वहीं ठहरा
  rationale: शाब्दिक ‘विश्राम किया’ के बजाय रात बिताने के प्रसंग में ‘ठहरा’ स्वाभाविक हिन्दी है।
- source_word: ወበልዑ፡ ወሰትዩ
  choice: और उन्होंने खाया-पिया
  rationale: दो समन्वित क्रियाओं का सहज हिन्दी मुहावरे में पूर्ण और संक्षिप्त प्रतिनिधित्व।
theological_decisions:
- issue: ዘበጽድቅ का अर्थ
  choice: सचमुच
  alternative: धार्मिकता में
  rationale: यहाँ पदबंध को याकूब के पुत्रों का नैतिक विशेषण बनाने के बजाय देखने की क्रिया पर बल देने वाला क्रियाविशेषण माना गया है; वैकल्पिक शाब्दिक अर्थ को आरोपित नहीं किया गया।
- issue: दण्डवत् किए जाने वाले व्यक्ति की पहचान
  choice: सर्वनाम ‘उसे’ को बनाए रखा
  alternative: स्पष्ट रूप से ‘इसहाक को’
  rationale: स्रोत सर्वनाम का प्रयोग करता है। हिन्दी में भी सर्वनाम रखकर मूल की संदर्भगत संरचना और संभावित तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। स्रोत की कठिन अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखकर उसकी सम्भावित व्याख्या पादटिप्पणी में दी गई है; ‘with joy’ जैसा स्रोत-बाह्य भाव नहीं जोड़ा गया।
