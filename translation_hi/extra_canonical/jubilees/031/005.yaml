  text: and let me see him before I die.” And Jacob went to his father Isaac and to his mother Rebekah, to the house of his father Abraham. And he took with him two of his sons, Levi and Judah.
translation:
  language: hi
  text: और मरने से पहले मैं उसे देख लूँ।” तब याकूब अपने पिता इसहाक और अपनी माता रिबका के पास, अपने पिता अब्राहम के घर गया। वह अपने दो पुत्रों, लेवी और यहूदा, को अपने साथ ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእርአዮ፡ ዘእንበለ፡ እሙት
  choice: और मरने से पहले मैं उसे देख लूँ
  rationale: गीज़ वाक्यांश का आशय किसी व्यक्ति को वक्ता की मृत्यु से पहले देखने की इच्छा है; हिंदी में स्वाभाविक इच्छासूचक रूप रखा गया है।
- source_word: ኀበ፡ አቡሁ፡ ይስሐቅ፡ ወኀበ፡ እሙ፡ ርብቃ
  choice: अपने पिता इसहाक और अपनी माता रिबका के पास
  rationale: दोहराए गए ኀበ (‘के पास/की ओर’) को सहज हिंदी समन्वय में व्यक्त किया गया है।
- source_word: ውስተ፡ ቤቱ፡ ለአቡሁ፡ አብርሃም
  choice: अपने पिता अब्राहम के घर
  rationale: शाब्दिक संबंध ‘उसके पिता अब्राहम का घर’ है; ‘पिता’ यहाँ पूर्वज के व्यापक अर्थ में हो सकता है, इसलिए मूल संबंध को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: ወክልኤተ፡ እምውሉዱ፡ ነሥአ፡ ምስሌሁ፡ ሌዊሃ፡ ወይሁዳሃ
  choice: वह अपने दो पुत्रों, लेवी और यहूदा, को अपने साथ ले गया
  rationale: गीज़ की संख्या, संबंध और साथ ले जाने की क्रिया को स्पष्ट तथा प्राकृतिक आधुनिक हिंदी में रखा गया है।
theological_decisions:
- issue: अब्राहम के लिए प्रयुक्त ‘पिता’ का संबंध
  choice: अपने पिता अब्राहम
  alternative: अपने पूर्वज अब्राहम
  rationale: मूल पाठ ‘पिता’ कहता है। ‘पूर्वज’ वंशगत अर्थ स्पष्ट करता, पर मूल की पारिवारिक पदावली को संकरा कर देता; अतः genuine ambiguity सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। आरंभिक उद्धरण पिछले पद से जारी प्रत्यक्ष कथन है, इसलिए अंत का उद्धरण-चिह्न रखा गया है।
