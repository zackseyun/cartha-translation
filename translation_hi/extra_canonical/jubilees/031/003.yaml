  text: And he went up on the new moon of the seventh month, to Bethel. And he built an altar in the place where he had lodged, and he set up there a pillar, and he sent to his father Isaac that he should come to him.
translation:
  language: hi
  text: और वह सातवें महीने के नए चाँद के दिन[a] बेतेल को चढ़कर गया। जिस स्थान पर उसने रात बिताई थी, वहाँ उसने एक वेदी बनाई और वहीं एक स्तंभ खड़ा किया। फिर उसने अपने पिता इसहाक के पास संदेश भेजा कि वे उसके पास आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सातवें महीने के पहले दिन’।
    reason: ‘नए चाँद’ प्राचीन मास के आरम्भ, अर्थात पहले दिन, को सूचित कर सकता है।
lexical_decisions:
- source_word: ሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: सातवें महीने के नए चाँद के दिन
  rationale: यह पदबंध सातवें महीने के चाँद के उदय अथवा नए चाँद को सूचित करता है, जो महीने के पहले दिन का संकेत है; मूल में ‘वर्ष’ का कोई शब्द नहीं है।
- source_word: ኖመ
  choice: रात बिताई थी
  rationale: क्रिया का अर्थ किसी स्थान पर रात ठहरना या रात बिताना है; यह आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ሐውልተ
  choice: स्तंभ
  rationale: यह खड़े किए गए स्मारकीय पत्थर या स्तंभ को दर्शाता है; ‘स्तंभ’ मूल की व्यापकता बनाए रखता है।
- source_word: ፈነወ፡ ኀበ፡ አቡሁ፡ ይስሐቅ
  choice: अपने पिता इसहाक के पास संदेश भेजा
  rationale: मूल में ‘भेजा’ के साथ गंतव्य इसहाक है; हिन्दी में अभिप्रेत संदेश या बुलावा स्पष्ट करने के लिए ‘संदेश’ जोड़ा गया है।
