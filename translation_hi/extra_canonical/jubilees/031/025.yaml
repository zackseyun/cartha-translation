  yaml_path: translation/extra_canonical/jubilees/031/025.yaml
  text: And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.
translation:
  language: hi
  text: और इसहाक ने अपने पिता अब्राहम के परमेश्वर को धन्य कहा, जिसने अपने सेवक इसहाक के पुत्र से अपनी करुणा और धार्मिकता नहीं रोकी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባረኮ
  choice: और ... को धन्य कहा
  rationale: क्रिया का अर्थ आशीष देना/धन्य कहना है; मनुष्य द्वारा परमेश्वर के संबंध में प्रयुक्त होने पर ‘धन्य कहा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ምሕረተ
  choice: करुणा
  rationale: यह दया, कृपा अथवा करुणा को व्यक्त करता है; ‘करुणा’ आधुनिक हिन्दी में सहज है और स्रोत के व्यापक भाव को बनाए रखता है।
- source_word: ጽድቀ
  choice: धार्मिकता
  rationale: यह धर्मपरायणता, न्याय या धार्मिकता के अर्थ-क्षेत्र में है; ‘धार्मिकता’ स्रोत की धर्मवैचारिक गहराई को बिना सीमित किए सुरक्षित रखता है।
- source_word: እምወልደ፡ ገብሩ፡ ይስሐቅ
  choice: अपने सेवक इसहाक के पुत्र से
  rationale: 'स्रोत की संबंधसूचक रचना को निकटता से प्रस्तुत करता है: पुत्र, सेवक इसहाक का है; ‘अपने’ परमेश्वर से सेवक के संबंध को स्पष्ट करता है।'
theological_decisions:
- issue: परमेश्वर से करुणा और धार्मिकता न रोकने का कथन
  choice: ‘अपनी करुणा और धार्मिकता नहीं रोकी थी’
  alternative: ‘अपनी दया और न्याय से वंचित नहीं किया था’
  rationale: चुना हुआ रूप स्रोत के दो संज्ञात्मक गुणों और ‘रोकना’ की नकारात्मक अभिव्यक्ति को बनाए रखता है; वैकल्पिक रूप व्याख्यात्मक होकर ‘धार्मिकता’ को केवल न्याय तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-सन्निकट शैली। वाक्य की संबंध-श्रृंखला जानबूझकर सुरक्षित रखी गई है; किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
