translation:
  language: hi
  text: और सभी राष्ट्र काँप उठेंगे, और सभी लोग काँप उठेंगे। तुझमें याकूब के लिए सहायता होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሀወኩ
  choice: काँप उठेंगे
  rationale: क्रिया राष्ट्रों और लोगों के हिलने, विचलित होने या काँपने का भाव देती है; प्रसंग में स्वाभाविक और गरिमापूर्ण हिन्दी के लिए ‘काँप उठेंगे’ चुना गया।
- source_word: አሕዛብ
  choice: राष्ट्र
  rationale: बहुवचन पद को राजनीतिक-जातीय समुदायों के व्यापक अर्थ में ‘राष्ट्र’ से व्यक्त किया गया।
- source_word: ሕዝብ
  choice: लोग
  rationale: सामूहिक जनसमुदाय को सहज आधुनिक हिन्दी में व्यक्त करते हुए मूल में ‘राष्ट्र’ से अलग शब्द होने का भेद बनाए रखा गया।
- source_word: ብከ
  choice: तुझमें
  rationale: द्वितीय पुरुष एकवचन के साथ पूर्वसर्ग का निकट, अस्पष्टता-संरक्षक रूप; इसे ‘तेरे द्वारा’ बनाकर साधनार्थ को निश्चित नहीं किया गया।
- source_word: ረድኤተ
  choice: सहायता
  rationale: मदद, सहारा या सहायता के अर्थ वाले पद के लिए सामान्य, गरिमापूर्ण शब्द चुना गया।
theological_decisions:
- issue: ‘तुझमें’ का संबंध और अभिप्राय
  choice: तुझमें याकूब के लिए सहायता होगी
  alternative: तेरे द्वारा याकूब को सहायता मिलेगी
  rationale: स्रोत का पूर्वसर्ग अंतर्निहितता, संबंध या माध्यम के भाव की गुंजाइश रखता है। ‘तुझमें’ मूल संरचना और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य में मूल की समानांतर पुनरावृत्ति रखी गई है। संबोधन के लिए गरिमापूर्ण बाइबिलीय ‘तुझमें’ प्रयुक्त है, जबकि शेष भाषा सरल और वर्तमान है।
