  yaml_path: translation/extra_canonical/jubilees/031/007.yaml
  text: She heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing.”
translation:
  language: hi
  text: उसने सुना, “देख, तेरा पुत्र याकूब आ गया है।” तब उसने उसे चूमा। उसने उसके दोनों पुत्रों को देखा और उन्हें पहचान लिया। उसने उससे पूछा, “मेरे बेटे, क्या ये तेरे पुत्र हैं?” फिर उसने उन्हें गले लगाया, उन्हें चूमा और यह कहते हुए उन्हें आशीर्वाद दिया, “तुममें अब्राहम का वंश आदर पाए, और तुम आशीष बनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽሐ
  choice: आ गया है
  rationale: क्रिया के ‘पहुँचना/आना’ अर्थ को प्रसंगानुकूल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አእመረትሙ
  choice: उन्हें पहचान लिया
  rationale: यहाँ देखने के बाद व्यक्तियों को जानने या पहचानने का भाव है; ‘पहचान लिया’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ዘርአ፡ አብርሃም
  choice: अब्राहम का वंश
  rationale: ‘अब्राहम का बीज’ के वंशगत अर्थ को हिन्दी की स्वाभाविक बाइबलीय अभिव्यक्ति में सुरक्षित रखता है।
- source_word: ይክበር
  choice: आदर पाए
  rationale: मूल के सम्मानित या महिमान्वित होने के भाव को बिना अतिरिक्त धर्मवैचारिक अर्थ जोड़े व्यक्त करता है।
- source_word: ብክሙ ... ትከውኑ
  choice: तुममें ... तुम ... बनो
  rationale: गीज़ के बहुवचन संबोधन को रखा गया है; आशीर्वचन अब याकूब के दोनों पुत्रों को संबोधित है।
theological_decisions:
- issue: आशीर्वचन में संबोधित व्यक्ति
  choice: अंतिम वाक्य में दोनों पुत्रों के लिए बहुवचन ‘तुम’
  alternative: याकूब के लिए एकवचन ‘तू’
  rationale: मूल में ብክሙ और ትከውኑ बहुवचन रूप हैं और निकटतम संदर्भ वे दोनों पुत्र हैं जिन्हें वह गले लगाकर आशीर्वाद देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पारिवारिक निकटता दिखाने के लिए ‘तेरा/मेरे बेटे’ और आशीर्वचन में स्रोत-सम्मत बहुवचन ‘तुम’ का प्रयोग किया गया है।
