- source_word: እምድር
  choice: पृथ्वी पर से
  rationale: पूर्वसर्ग እም (‘से’) और ምድር (‘पृथ्वी/भूमि’) का स्वाभाविक हिन्दी रूप; यह अंश पिछले वाक्य से जुड़ा है।
- source_word: ይኩኑ፡ ርጉማነ
  choice: शापित हो जाएँ
  rationale: बहुवचन आज्ञार्थक/कामनार्थक भाव और ‘शापित’ के अर्थ को बनाए रखता है।
- source_word: ተመይጠ
  choice: मुड़ा
  rationale: क्रिया के लौटने अथवा मुड़ने के भाव को प्रसंग में संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ሰዐሞ፡ ዳግመ
  choice: उसे दोबारा चूमा
  rationale: ዳግመ का पुनरावृत्ति-बोध स्पष्ट रखा गया है।
- source_word: ሐቀፎ
  choice: गले लगाया
  rationale: आलिंगन करने की क्रिया का सामान्य आधुनिक हिन्दी रूप।
- source_word: ተፈሥሐ፡ ዐቢየ
  choice: बहुत आनन्दित हुआ
  rationale: क्रिया और तीव्रतासूचक पद को dignified, सहज हिन्दी में व्यक्त करता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: कारणसूचक संयोजक को रखा गया है; पद अगले वचन में पूरा होता है।
