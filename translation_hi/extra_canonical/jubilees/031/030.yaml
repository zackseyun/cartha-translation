  text: And may he prosper all that you do, all for which you have prayed in prayer.” And he said to Rebekah, “Go with Jacob your son.” And Rebekah went with Jacob her son, and Deborah with her, and they came to
translation:
  language: hi
  text: और वह तुम्हारे हर काम को, और हर उस बात को भी जिसके लिए तुमने प्रार्थना की है, सफल करे।” फिर उसने रिबका से कहा, “अपने पुत्र याकूब के साथ जाओ।”[a] तब रिबका अपने पुत्र याकूब के साथ गई, और दबोरा भी उसके साथ गई; और वे पहुँचे—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने अनुवाद में: “याकूब के साथ जाओ।” इसके बाद: “तब वह उठी और गई।”'
    reason: पूर्व प्रचलित पाठ-रूप को दर्ज करता है; वर्तमान मुख्य पाठ स्रोत में ‘अपने पुत्र’ और स्पष्ट कर्ता ‘रिबका’ को मानता है।
lexical_decisions:
- source_word: ወይሥመር
  choice: और वह ... सफल करे
  rationale: क्रिया की कामना/आशीर्वादात्मक शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘገብረ፡ ኵሎ
  choice: तुम्हारे हर ... काम को
  rationale: स्रोत के ‘जो कुछ तुम करते हो/तुम्हारा समस्त कार्य’ के व्यापक अर्थ को सहज हिन्दी में रखता है।
- source_word: ለዘጸለይከ፡ ጸሎተ
  choice: जिसके लिए तुमने प्रार्थना की है
  rationale: सजातीय क्रिया-संज्ञा की गीइज़ अभिव्यक्ति को अनावश्यक हिन्दी पुनरुक्ति के बिना प्रार्थना के अर्थ में प्रस्तुत करता है; ‘मन्नत’ का असमर्थित अर्थ नहीं जोड़ता।
- source_word: 'ወልድኪ (प्रदत्त पाठ में OCR: ወአድኪ)'
  choice: अपने पुत्र
  rationale: संदर्भ और संशोधित पाठ-पहचान के अनुसार रिबका से संबोधित द्वितीय-पुरुष स्त्रीलिंग ‘तुम्हारा पुत्र’ को व्यक्त करता है।
- source_word: ወበጽሑ፡ ውስተ
  choice: और वे पहुँचे—
  rationale: स्रोत इस पद में ‘और वे ... तक पहुँचे’ पर अपूर्ण रूप से समाप्त होता है; डैश अगले पद में जारी वाक्य का संकेत देता है और गंतव्य नहीं गढ़ता।
theological_decisions:
- issue: आशीर्वाद में कर्ता का अस्पष्ट संकेत
  choice: ‘वह’ रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर’ जोड़ना
  rationale: स्रोत में कर्ता सर्वनाम/क्रिया में निहित है; ‘परमेश्वर’ अर्थतः संभव है, पर इस अंश में नाम जोड़ना स्रोत की अस्पष्टता को अनावश्यक रूप से सुलझा देता।
- issue: प्रार्थना बनाम मन्नत
  choice: ‘प्रार्थना की है’
  alternative: ‘मन्नत मानी है’
  rationale: स्रोत का मूल शब्द प्रार्थना से संबंधित है, मन्नत से नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य के अंत की स्रोतगत अपूर्णता को डैश द्वारा सुरक्षित रखा गया है।
