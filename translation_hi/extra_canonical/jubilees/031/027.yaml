  text: he had prayed, and when he came, he might set him on a donkey. And Isaac said to Jacob his son, “I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to travel. Set your mother on a beast and let her go."”
translation:
  language: hi
  text: उसने प्रार्थना की थी, और जब वह आए, तो उसे गधे पर बिठा सके।[a] तब इसहाक ने अपने पुत्र याकूब से कहा, “मैं तेरे साथ नहीं आ सकता, क्योंकि मैं बूढ़ा हो गया हूँ और यात्रा की कठिनाई सह नहीं सकता। मेरे पुत्र, शान्ति से जा, क्योंकि आज मैं एक सौ पैंसठ वर्ष का हूँ। अब मैं यात्रा नहीं कर सकता। अपनी माँ को सवारी के पशु पर बिठा और चला जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “उसने प्रार्थना की थी कि जब वह आए, तो उसे गधे पर बिठा सके।”
    reason: आरम्भिक वाक्य पिछले पद से जुड़ा हुआ है। संयोजक तथा अपूर्ण/सम्भावनार्थक क्रियारूप के कारण इसे स्वतंत्र जुड़े हुए कथन या ‘कि’ से आरम्भ होने वाले आशय-वाक्य, दोनों रूपों में समझा जा सकता है।
lexical_decisions:
- source_word: ጸለየ
  choice: उसने प्रार्थना की थी
  rationale: क्रिया का अर्थ ‘प्रार्थना करना’ है; पूर्ववर्ती प्रसंग से जुड़े पूर्ण कार्य को स्वाभाविक हिन्दी में पूर्णभूत रूप दिया गया है।
- source_word: አድግ
  choice: गधा
  rationale: यहाँ सामान्य ‘पशु’ के बजाय विशेष रूप से गधे का संकेत है।
- source_word: ተዐግሦ፡ በፍኖት
  choice: यात्रा की कठिनाई सह
  rationale: शाब्दिक अर्थ ‘मार्ग में सहना/धैर्य रखना’ है; प्रसंग में वृद्ध इसहाक की यात्रा सह पाने की क्षमता अभिप्रेत है।
- source_word: በሰላም
  choice: शान्ति से
  rationale: मूल का परिचित विदाई-सूत्र सुरक्षित रखा गया है।
- source_word: ነጊደ
  choice: यात्रा करना
  rationale: यह क्रिया चलने या यात्रा करने को व्यक्त करती है; प्रसंगानुकूल व्यापक अर्थ चुना गया है।
- source_word: ጻዐና፡ ለአምካ፡ ወትሖር
  choice: अपनी माँ को किसी सवारी के पशु पर बिठा और चला जा
  rationale: मूल में याकूब की माँ का स्पष्ट उल्लेख और याकूब को दिया गया आदेश है। सवारी का पशु क्रिया में निहित है; अंतिम क्रिया को द्वितीय पुरुष पुल्लिंग आदेश के रूप में रखा गया है।
