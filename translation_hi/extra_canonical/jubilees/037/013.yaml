base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/013.yaml
  text: He went in front to lead them to Jacob his brother. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob all his days.
translation:
  language: hi
  text: वह उनके आगे-आगे चला, ताकि उन्हें अपने भाई याकूब के पास ले जाए। तब उसे वह सारी बुराई याद आई, जो उसके मन में अपने भाई याकूब के विरुद्ध छिपी हुई थी। पर उसे वह शपथ याद न रही, जो उसने अपने पिता और अपनी माता से खाई थी कि वह जीवन भर याकूब का बुरा करने की कोशिश नहीं करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሖር፡ ቅድመ፡ ይምርሖሙ
  choice: वह उनके आगे-आगे चला, ताकि उन्हें ... ले जाए
  rationale: क्रियाओं के अग्रगमन और मार्ग दिखाने, दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኵሎ፡ እኩየ
  choice: वह सारी बुराई
  rationale: स्रोत के ‘समस्त बुराई’ के व्यापक अर्थ को बनाए रखता है।
- source_word: ኅብእተ፡ ... ውስተ፡ ልቡ
  choice: जो उसके मन में ... छिपी हुई थी
  rationale: हृदय के भीतर छिपी बुराई की स्रोत-छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ኢይትኃሠሥ፡ ኵሎ፡ እኩየ
  choice: बुरा करने की कोशिश नहीं करेगा
  rationale: शाब्दिक ‘किसी बुराई को नहीं खोजेगा’ हिन्दी में अस्वाभाविक है; यह चयन किसी के विरुद्ध बुराई साधने या करने का आशय स्पष्ट करता है, बिना परिणाम को निश्चित बताए।
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: जीवन भर
  rationale: ‘उसके सभी दिनों’ का स्वाभाविक और अर्थ-सटीक हिन्दी रूप।
theological_decisions:
- issue: मन में छिपी बुराई का स्मरण और शपथ का विस्मरण
  choice: दोनों विरोधी क्रियाओं को स्पष्ट रूप से बनाए रखा गया है
  alternative: दूसरे कथन को जानबूझकर शपथ तोड़ने के रूप में प्रस्तुत करना
  rationale: स्रोत स्मरण और स्मरण न रहने का तनाव रखता है; वह स्पष्ट रूप से यह नहीं कहता कि उसने सचेत रूप से शपथ त्याग दी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। ‘अपने भाई याकूब’ का प्रयोग कर्ता से संबंध स्पष्ट करता है, जबकि अंतिम उल्लेख में स्रोत के अनुसार केवल ‘याकूब’ रखा गया है।
