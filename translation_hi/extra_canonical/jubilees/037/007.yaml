lexical_decisions:
- source_word: ኢትሖሩ
  choice: मत जाओ
  rationale: निषेधात्मक बहुवचन आज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ኢትግበሩ፡ ምስሌሁ፡ ፀብአ
  choice: उससे युद्ध मत करो
  rationale: शाब्दिक भाव ‘उसके साथ युद्ध न करो’ है; विरोधी के विरुद्ध युद्ध के अर्थ में आधुनिक हिन्दी में ‘उससे युद्ध मत करो’ अधिक स्वाभाविक है।
- source_word: ከመ፡ ኢትደቁ
  choice: कहीं ऐसा न हो कि तुम मारे जाओ
  rationale: यह उद्देश्य/आशंका-सूचक निषेध है। ደቀ के संदर्भगत अर्थ को युद्ध में ‘गिर पड़ना’ अर्थात मारा जाना समझते हुए स्पष्ट, स्वाभाविक हिन्दी दी गई है।
