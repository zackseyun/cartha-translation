base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/002.yaml
  text: Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they contended with their father, saying, "Why, did he give the rights of the firstborn to Jacob, who is younger, while you are the elder, and leave you aside?"
translation:
  language: hi
  text: इसहाक ने पहलौठे का अधिकार अपने छोटे बेटे याकूब को दे दिया था, और वे अत्यन्त क्रोधित हुए। वे अपने पिता से विवाद करने लगे और बोले, “जबकि आप ही बड़े थे, तब उसने पहलौठे का अधिकार छोटे याकूब को क्यों दिया और आपको अलग क्यों कर दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: पहलौठे का अधिकार
  rationale: यहाँ संज्ञा उस विशेषाधिकार या ज्येष्ठाधिकार को दर्शाती है जो याकूब को दिया गया; आधुनिक हिन्दी में यह वाक्यांश स्पष्ट और स्वाभाविक है।
- source_word: ዘይንእስ
  choice: छोटे
  rationale: याकूब की आयु अथवा जन्मक्रम में कनिष्ठता व्यक्त करता है।
- source_word: ተምዑ፡ ፈድፋደ
  choice: अत्यन्त क्रोधित हुए
  rationale: क्रोध की तीव्रता को स्रोत के बलाघात सहित स्वाभाविक हिन्दी में रखता है।
- source_word: ተጋአዙ
  choice: विवाद करने लगे
  rationale: पिता के साथ तीखी प्रतिवादपूर्ण भिड़ंत को दर्शाता है, बिना शारीरिक संघर्ष का अनावश्यक अर्थ जोड़े।
- source_word: ዘትልህቅ
  choice: बड़े थे
  rationale: संदर्भ में एसाव की याकूब से ज्येष्ठता अभिप्रेत है; यह ‘उपस्थित थे’ नहीं है।
theological_decisions:
- issue: पहलौठेपन की वस्तु का स्वरूप
  choice: ‘पहलौठे का अधिकार’
  alternative: ‘ज्येष्ठाधिकार’ या ‘पहलौठे की आशीष’
  rationale: स्रोत का पद अधिकार/विशेषाधिकार की ओर संकेत करता है; केवल ‘आशीष’ कहना अर्थ को संकीर्ण करता, जबकि ‘ज्येष्ठाधिकार’ सामान्य पाठक के लिए अपेक्षाकृत कठिन है।
- issue: उद्धरण में कर्ता और संबोधित व्यक्ति
  choice: ‘उसने’ से इसहाक और ‘आपको’ से एसाव
  alternative: एसाव के पुत्र स्वयं को छोड़े जाने की शिकायत कर रहे हैं
  rationale: कथा-संदर्भ और गीइज़ वाक्यांश እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ፡ के अनुसार पुत्र अपने पिता एसाव से इसहाक के निर्णय के विषय में बोलते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पारिवारिक संबोधन में सम्मानसूचक ‘आप’ रखा गया है। स्रोत में उपलब्ध अंश के आधार पर अर्थ स्पष्ट होने के कारण कोई पादटिप्पणी नहीं जोड़ी गई।
