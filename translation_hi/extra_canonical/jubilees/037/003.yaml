base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/003.yaml
  text: '"Jacob is younger; to Jacob your father gave the birthright, and you he abandoned." And Esau said to them, "For I sold my birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, so that he might eat and bless me, Jacob came by craftiness and brought my father food and drink, and my father blessed him and set me under his hand. And now our father has made us swear, me and him, that we will not seek evil, each against his brother."'
translation:
  language: hi
  text: “याकूब छोटा है। तुम्हारे पिता ने ज्येष्ठाधिकार याकूब को दे दिया और तुम्हें छोड़ दिया।” तब एसाव ने उनसे कहा,[a] “क्योंकि मैंने मसूर की थोड़ी-सी दाल के बदले अपना ज्येष्ठाधिकार याकूब को बेच दिया था। और जिस दिन मेरे पिता ने मुझे शिकार करने और उनके लिए शिकार का मांस लाने भेजा, ताकि वे खाएँ और मुझे आशीर्वाद दें, उस दिन याकूब ने चालाकी से आकर मेरे पिता के लिए भोजन और पेय प्रस्तुत किया। मेरे पिता ने उसे आशीर्वाद दिया और मुझे उसके हाथ के अधीन कर दिया। और अब तुम्हारे पिता ने मुझसे और उससे शपथ ली है कि हममें से कोई अपने भाई का बुरा न चाहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब एसाव ने उनसे कहा, ‘मैंने…’”
    reason: वाक्य-संबंध को कारणसूचक ‘क्योंकि’ के साथ या उसके बिना प्रस्तुत करने की पाठगत/अनुवादगत संभावना बताने के लिए।
lexical_decisions:
- source_word: ልህቃነ
  choice: ज्येष्ठाधिकार
  rationale: यहाँ प्रसंग जन्मसिद्ध वरिष्ठ अधिकार का है; ‘ज्येष्ठाधिकार’ आधुनिक हिन्दी में अर्थ को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ኅዳጥ፡ ጸብሐ፡ ብርስን
  choice: मसूर की थोड़ी-सी दाल
  rationale: मूल में अल्प मात्रा और मसूर के पकवान दोनों का भाव है; हिन्दी में ‘दाल’ सहज है और अनावश्यक रूप से किसी विशिष्ट व्यंजन का अनुमान नहीं लगाती।
- source_word: በተጠብቦት
  choice: चालाकी से
  rationale: शब्द में कौशल/चतुराई का भाव है, पर इस प्रसंग में वह छलपूर्ण युक्ति की ओर संकेत करता है; ‘चालाकी’ दोनों रंगों को बनाए रखता है।
- source_word: ታሕተ፡ እዴሁ
  choice: उसके हाथ के अधीन
  rationale: मूल के ‘उसके हाथ के नीचे’ रूपक को हिन्दी में समझ आने योग्य रखते हुए अधीनता का अर्थ सुरक्षित किया गया है।
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: बुरा न चाहे
  rationale: शाब्दिक ‘बुराई न खोजें/न सोचें’ की अपेक्षा यह स्वाभाविक हिन्दी है और परस्पर दुर्भाव या हानि की मंशा को व्यक्त करती है।
theological_decisions:
- issue: इसहाक के आशीर्वाद से याकूब और एसाव के संबंध का वर्णन
  choice: ‘मुझे उसके हाथ के अधीन कर दिया’
  alternative: ‘उसे मुझ पर प्रभु ठहराया’
  rationale: मूल के हाथ-वाले रूपक और अधीनता को रखा गया है, बिना राजकीय या किसी विशिष्ट धर्मवैज्ञानिक पदवी को जोड़ने के।
- issue: भाइयों के बीच शपथ की सीमा
  choice: ‘हममें से कोई अपने भाई का बुरा न चाहे’
  alternative: ‘हम एक-दूसरे को हानि न पहुँचाएँ’
  rationale: मूल केवल बाहरी हानि से अधिक व्यापक बुरी मंशा/चेष्टा का संकेत दे सकता है; इसलिए अर्थ को केवल हिंसक कार्य तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, कथात्मक और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन स्पष्ट हैं; ‘ज्येष्ठाधिकार’, ‘आशीर्वाद’ और ‘शपथ’ जैसे स्थापित शब्द रखे गए हैं, जबकि कठिन शाब्दिक वाक्यांशों को सहज हिन्दी में व्यक्त किया गया है।
