  choice: चार हजार
  rationale: गीज़ अंक-पाठ आरंभिक दल के लिए 4000 देता है; बाद की ፬፻ ‘चार सौ’ से इसका अंतर जानबूझकर सुरक्षित रखा गया है।
- source_word: ተደባብ
  choice: परकोटा
  rationale: यह बुर्ज की ऊपरी रक्षात्मक संरचना/battlements को सूचित करता है; ‘परकोटा’ सामान्य पाठक के लिए पर्याप्त स्पष्ट है।
- source_word: ጸጋዊ፡ ወመሓሪ
  choice: कृपालु और दयालु
  rationale: दोनों गुणों को अलग रखते हुए स्वाभाविक हिंदी में समानांतर विशेषण दिए गए हैं।
