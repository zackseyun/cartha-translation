  language: hi
  text: 'इस सब के दौरान याकूब नहीं जानता था कि वे उसे मार डालने के लिए उसके विरुद्ध आ रहे हैं। वह अपनी पत्नी लिआ के लिए शोक मना रहा था, तभी वे चार हजार पुरुषों—योद्धाओं और चुने हुए लड़ाकों—के साथ बुर्ज के पास आ पहुँचे।[a] उन्होंने उसके पास प्रतिष्ठित पुरुषों को यह कहने भेजा, “देख, तेरा भाई चार सौ पुरुषों के साथ तुझसे युद्ध करने के लिए तेरे विरुद्ध आया है। वे तलवार बाँधे हुए हैं और ढालें तथा युद्ध के हथियार उठाए हुए हैं।” क्योंकि वे एसाव से अधिक याकूब से प्रेम करते थे; उन्होंने उसे बताया कि याकूब एसाव से अधिक कृपालु और दयालु मनुष्य था।


    जब वे बुर्ज के पास पहुँचे, तब याकूब घबरा गया। उसने बुर्ज के फाटक बंद कर दिए, परकोटे पर खड़ा हो गया और अपने भाई एसाव से बोला, “तू मेरी उस पत्नी के विषय में, जो मर गई है, मुझे सांत्वना देने आया है—क्या ही अच्छी सांत्वना है! क्या यही वह शपथ है जो तूने अपने पिता और अपनी माता से खाई थी? फिर, उनके मरने से पहले ही तूने अपनी शपथ तोड़ दी है;[b] और जिस घड़ी तूने अपने पिता से शपथ खाई, उसी घड़ी तू दोषी ठहरा।”


    तब एसाव ने उसे उत्तर दिया, “न मनुष्यों की संतानों के लिए और न पृथ्वी के पशुओं के लिए कोई सच्ची शपथ होती है, जिसे खाकर वे सदा तक निभाएँ। अगले ही दिन वे एक-दूसरे के विरुद्ध बुरी चालें चलते हैं, ताकि हर एक अपने शत्रु और बैरी को मार डाले। तू मुझसे और मेरी संतानों से सदा बैर रखता है; तेरे साथ भाईचारा निभाना संभव नहीं।


    “मेरी यह बात सुन, जो मैं तुझसे कहता हूँ: यदि जंगली सूअर अपनी खाल बदल ले और उसके कड़े बाल ऊन के समान कोमल हो जाएँ, या उसके सिर पर हिरन अथवा भेड़ के सींगों जैसे सींग निकल आएँ, तभी मैं तेरे साथ भाईचारा निभाऊँगा। यदि अपनी माता से अलग हो चुके स्तन फिर लौटकर दूध पीने लगें, तभी मैं भाई बनकर तुझसे मेल करूँगा। यदि भेड़िए मेमनों के साथ शांति करें, उन्हें न खाएँ और न सताएँ, और उनके मन उनके प्रति भले हो जाएँ, तभी मेरे मन में तेरे प्रति शांति होगी। यदि सिंह बैल का मित्र बन जाए, उसके साथ एक ही जुए में जोता जाए, उसके साथ हल चलाए और उससे शांति रखे, तभी मैं तुझसे शांति करूँगा। और जब कौआ राज़ा-पक्षी के समान सफेद हो जाए,[c] तब मैं जानूँगा कि मैंने तुझसे प्रेम किया है, और मैं तुझसे शांति करूँगा। तेरा नाश हो, तेरी संतानों का भी नाश हो, और तुझे शांति न मिले!”


    जब याकूब ने देखा कि एसाव के मन में उसके प्रति बुराई है और वह अपनी सारी जान से उसे मार डालना चाहता है, और वह उस जंगली सूअर के समान क्रोध से झपटता हुआ आ रहा है जो उस भाले पर टूट पड़ता है जो उसे बेधकर मार डालता है, फिर भी उससे पीछे नहीं हटता, तब याकूब ने अपने लोगों और सेवकों से कहा कि वे उस पर और उसके सभी साथियों पर आक्रमण करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीज़ पाठ यहाँ ‘चार हजार’ कहता है, जबकि इसी पद में दूत बाद में ‘चार सौ’ पुरुषों की सूचना देते हैं। दोनों संख्याएँ स्रोत के अनुसार सुरक्षित रखी गई हैं।
    reason: textual_variant
  - marker: b
    text: 'अर्थ यह भी हो सकता है: “फिर, उनके मरने से पहले ही—तूने अपनी शपथ तोड़ दी है।” मूल वाक्य-विन्यास संक्षिप्त और कुछ कठिन है।'
    reason: ambiguity
  - marker: c
    text: ‘राज़ा’ गीज़ में आए एक अनिश्चित पक्षी-नाम का लिप्यंतरण है। संभवतः किसी विशेष रूप से सफेद पक्षी का संकेत है, पर उसकी ठीक प्रजाति ज्ञात नहीं।
    reason: lexical_alternative
