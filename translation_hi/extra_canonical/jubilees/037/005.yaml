lexical_decisions:
- source_word: በተፋቅሮ፡ ወበሰላም
  choice: प्रेम और शान्ति से
  rationale: दोनों अमूर्त संज्ञाओं को सहज हिन्दी में रखा गया है और सह-अस्तित्व की भावभूमि सुरक्षित है।
- source_word: ብእሲ፡ ምስለ፡ እኁሁ
  choice: हर मनुष्य अपने भाई के साथ
  rationale: शाब्दिक अर्थ ‘मनुष्य अपने भाई के साथ’ है; ‘हर’ हिन्दी में इस सामान्य पारस्परिक कथन को स्पष्ट करता है।
- source_word: ወኢናማስን፡ ፍኖዊነ
  choice: और अपने मार्गों को भ्रष्ट न करें
  rationale: क्रिया नष्ट/बिगाड़ने या भ्रष्ट करने का प्रबल भाव रखती है और संज्ञा बहुवचन ‘हमारे मार्ग’ है; इसलिए केवल ‘परेशान करना’ अपर्याप्त है।
- source_word: ኢንሰምዐከ
  choice: हम तुम्हारी बात नहीं मानेंगे
  rationale: सुनने की क्रिया यहाँ आज्ञा या परामर्श मानने के अर्थ में प्रयुक्त है; यह हिन्दी मुहावरा दोनों भाव रखता है।
- source_word: ሖውር፡ ላዕሌሁ
  choice: उसके विरुद्ध चढ़ाई कर
  rationale: ‘उस पर/उसके विरुद्ध ऊपर जा’ युद्ध-संदर्भ में आक्रमण या चढ़ाई का संकेत देता है।
- source_word: ወናሐጕሎ፡ ውሉዱ
  choice: और उसके पुत्रों का नाश कर दें
  rationale: क्रिया विनाश का अर्थ देती है और ‘उसके पुत्र’ कर्म हैं; सामूहिक प्रस्ताव को हिन्दी में स्वाभाविक बनाया गया है।
