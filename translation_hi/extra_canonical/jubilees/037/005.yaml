  text: और हम प्रेम और शान्ति से रहें—हर मनुष्य अपने भाई के साथ—और अपने मार्गों को भ्रष्ट न करें।” पर उन्होंने उससे कहा, “हम तुम्हारी बात नहीं मानेंगे कि उसके साथ शान्ति करें, क्योंकि हमारा बल उसके बल से अधिक है, और हम उससे अधिक बलवान हैं। उसके विरुद्ध चढ़ाई कर, और हम उसे मार डालें और उसके पुत्रों का नाश कर दें। पर यदि तू नहीं जाएगा—
