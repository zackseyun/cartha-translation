  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पद पिछले वाक्य के बीच से आरंभ होता प्रतीत होता है; इसलिए अंग्रेज़ी परामर्श-पाठ में निहित संबंध को हिन्दी में ‘यदि तुम हमारे साथ नहीं दोगे’ के रूप में स्पष्ट किया गया है। स्थान-नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
