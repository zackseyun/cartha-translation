base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/006.yaml
  text: 'with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us choose for ourselves select men, eager for battle, and let us go against him and fight with him and uproot him from the land before he grows strong."'
translation:
  language: hi
  text: '“...हमारे साथ, हम तुम्हें भी हानि पहुँचाएँगे। अब हमारी बात सुनो: आओ, हम अराम, पलिश्तिया, मोआब और अम्मोन में संदेश भेजें, और अपने लिए चुनिंदा, युद्ध के लिए उत्सुक पुरुष चुनें। फिर हम उसके विरुद्ध जाएँ, उससे लड़ें और उसके बलवान होने से पहले उसे भूमि से जड़ से उखाड़ दें।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሐስም
  choice: हम हानि पहुँचाएँगे
  rationale: क्रिया को उसके संदर्भगत शत्रुतापूर्ण अर्थ में रखा गया है; वाक्य का आरंभ पिछले कथन से जुड़ा हुआ है, इसलिए हिन्दी में शर्त स्पष्ट करके स्वाभाविक प्रवाह दिया गया है।
- source_word: ወንፈኑ
  choice: हम ... के पास संदेश भेजें
  rationale: मूल क्रिया ‘भेजना’ है; गंतव्यों की सूची और सहयोग जुटाने के प्रसंग में निहित संदेश/दूत को स्पष्ट करना स्वाभाविक हिन्दी देता है।
- source_word: ወንኅረይ
  choice: हम ... चयन करें
  rationale: यह चयन करने की क्रिया को सीधे व्यक्त करता है।
- source_word: ኅሩያነ፡ ሰብአ
  choice: चुने हुए पुरुष
  rationale: विशेष रूप से छाँटे गए योद्धाओं का अर्थ सुरक्षित रखा गया है।
- source_word: እለ፡ ይዳበጉ፡ ውስተ፡ ቀትል
  choice: युद्ध को उत्सुक
  rationale: युद्ध में जाने की तत्परता या उत्सुकता को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ወንሖር፡ ላዕሌሁ
  choice: हम उस पर चढ़ाई करें
  rationale: शाब्दिक ‘उसके विरुद्ध जाएँ’ को सैन्य प्रसंग के अनुरूप मुहावरेदार हिन्दी दी गई है।
- source_word: ወንሠርዎ፡ እምድር
  choice: उसे देश से जड़ से उखाड़ दें
  rationale: ሠረወ के उन्मूलन/जड़ से हटाने के सशक्त रूपक को सुरक्षित रखता है।
- source_word: እንበለ፡ የአዝዝ
  choice: उसके शक्तिशाली होने से पहले
  rationale: प्रसंग में विरोधी के बलवान या प्रभुत्वशाली हो जाने से पहले कार्रवाई करने का भाव है।
