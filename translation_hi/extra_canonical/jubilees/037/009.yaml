lexical_decisions:
- source_word: ታበውአ፡ ክሳደከ፡ ታሕተ፡ አርዑቱ
  choice: अपनी गर्दन उसके जुए के नीचे झुका दे
  rationale: मूल के गर्दन झुकाने और जुए के नीचे आने वाले रूपक को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: ኢንሰምዕ፡ ንሕነሰ፡ ዘንተ፡ ነገረ
  choice: हम यह बात नहीं मानेंगे
  rationale: शाब्दिक अर्थ ‘हम यह बात/वचन नहीं सुनेंगे’ है; प्रसंग में ‘सुनना’ आज्ञा मानने या स्वीकार करने का भाव रखता है, जिसे सामान्य हिन्दी में ‘नहीं मानेंगे’ व्यक्त करता है।
- source_word: ወፈነዉ
  choice: संदेश भेजा
  rationale: क्रिया ‘भेजना’ है; अराम और अदूराम के पास सहायता माँगने के प्रसंग में हिन्दी में अपेक्षित कर्म ‘संदेश’ को स्पष्टतः जोड़ा गया है, बिना व्यक्तियों को भेजे जाने का अर्थ देने के।
- source_word: ዐርከ፡ አቡሆሙ
  choice: अपने पिता के मित्र
  rationale: मूल संबंधवाचक वाक्यांश का सीधा और स्पष्ट रूप।
- source_word: ተዐሰቡ
  choice: भाड़े पर लिया
  rationale: क्रिया में मजदूरी देकर नियुक्त करने का भाव है; सैन्य प्रसंग में ‘भाड़े पर लिया’ सटीक और स्वाभाविक है।
- source_word: ፲፻ መስተባእሳነ
  choice: एक हज़ार योद्धाओं
  rationale: संख्या और युद्धरत पुरुषों का अर्थ रखा गया है; ‘अनुभवी’ या ‘चुने हुए’ जैसी असमर्थित विशेषताएँ नहीं जोड़ी गईं।
