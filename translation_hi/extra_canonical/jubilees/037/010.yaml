base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/010.yaml
  text: And there came to them from Moab and from the sons of Ammon one thousand chosen men who were hired; and from Philistia one thousand chosen men fit for war; and from Edom and from the Horites one thousand chosen men trained for battle; and from the Kittim strong men fit for war.
translation:
  language: hi
  text: और मोआब और अम्मोनियों में से एक हज़ार चुने हुए भाड़े के सैनिक उनके पास आए; और पलिश्तिया से युद्ध के योग्य एक हज़ार चुने हुए पुरुष; और एदोम और होरियों में से युद्ध के लिए प्रशिक्षित एक हज़ार चुने हुए पुरुष; और कित्तियों में से बलवान पुरुष आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐሰቡ
  choice: भाड़े के सैनिक
  rationale: क्रिया का आशय भाड़े पर रखे या मज़दूरी पर नियुक्त किए गए लोगों से है; प्रसंग सैन्य है, इसलिए यह स्वाभाविक और स्पष्ट अनुवाद है।
- source_word: ኅሩያነ
  choice: चुने हुए
  rationale: शब्द चयनित अथवा विशिष्ट रूप से चुने गए पुरुषों को सूचित करता है।
- source_word: መስተቃትላነ
  choice: युद्ध के योग्य
  rationale: युद्ध करने में समर्थ या युद्ध के लिए उपयुक्त होने का भाव रखता है; इसे केवल 'योद्धा' कहने से योग्यता का पक्ष दब जाता।
- source_word: መስተባእሳነ
  choice: युद्ध के लिए प्रशिक्षित
  rationale: यह लड़ाई में दक्ष या तैयार पुरुषों का भाव देता है; अंग्रेज़ी परामर्श-पाठ के अनुरूप किंतु स्रोत के युद्ध-संबंधी अर्थ को बनाए रखता है।
- source_word: ዕደወ
  choice: बलवान योद्धा
  rationale: कित्तियों के दल के लिए शक्ति/सामर्थ्य का संकेत है; खंडित पद-संरचना में सैन्य संदर्भ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ኬጢዎን
  choice: कित्तियों
  rationale: पारंपरिक जाति-नाम का हिन्दी लिप्यंतरण, बहुवचन संबंधकारक रूप में।
