  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सुबोध सैन्य-वर्णन। स्रोत की सूचीबद्ध, अर्ध-समांतर संरचना को अर्धविरामों से बनाए रखा गया है। अंतिम खंड में स्रोत-पाठ संक्षिप्त/खंडित प्रतीत होता है; अंग्रेज़ी परामर्श-पाठ के विस्तृत 'fit for war' को बिना स्वतंत्र गीइज़ समर्थन के नहीं जोड़ा गया।
