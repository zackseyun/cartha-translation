  text: Yet now our father has made us swear, me and him, that we should not seek evil, each against his brother,
translation:
  language: hi
  text: और अब हमारे पिता ने मुझे और उसे शपथ दिलाई है[a] कि हम एक-दूसरे के विरुद्ध बुराई न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे—मुझे और उसे—शपथ दिलाई है।”
    reason: कुछ पाठ-व्याख्याएँ क्रिया के कर्म को एकवचन मानती हैं, जबकि बहुवचन पाठ अधिक समर्थित है।
lexical_decisions:
- source_word: መሐላ / እምሐለኩ
  choice: शपथ ली है
  rationale: शपथ दिलाने अथवा शपथ से बाँधने के कारक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: बुरा न चाहे
  rationale: मूल में किसी के विरुद्ध बुराई खोजने, सोचने या चाहने का व्यापक भाव है; यह चयन उस अस्पष्टता को किसी विशेष हिंसक कार्य तक सीमित नहीं करता।
- source_word: አሐዱ፡ ላዕለ፡ እኁሁ
  choice: हममें से कोई अपने भाई का
  rationale: ‘एक अपने भाई के विरुद्ध’ की पारस्परिक संरचना को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: शपथ लेने वालों की संख्या
  choice: हम दोनों से—मुझसे और उससे—
  alternative: मुझसे—मुझसे और उससे—
  rationale: क्रिया का प्रथम पुरुष बहुवचन कर्मरूप और उसके बाद आए स्वतंत्र सर्वनाम ‘मुझसे और उससे’ दो व्यक्तियों को शपथ दिलाए जाने का समर्थन करते हैं।
- issue: पिता का संबंध
  choice: हमारे पिता
  alternative: तुम्हारे पिता
  rationale: वक्तव्य के प्रसंग में शपथ दिलाने वाला इसहाक है और शपथ लेने वाले एसाव तथा याकूब हैं; अतः संबंधसूचक को प्रसंग और प्रमाणित पाठ-संशोधन के अनुसार ‘हमारे पिता’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक और गरिमापूर्ण शैली। ‘हम दोनों से—मुझसे और उससे—’ मूल की स्पष्टकारी पुनरुक्ति को बनाए रखता है, जबकि ‘बुरा न चाहे’ नैतिक आशय को किसी संकीर्ण अर्थ में नहीं बाँधता।
