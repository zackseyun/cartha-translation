  text: And that they should circumcise their sons according to the covenant that was established with them[a], and that they should not turn aside from this, neither to the right nor to the left, from any path that the LORD commanded; and that we should keep ourselves from all fornication and uncleanness, and that we should put away from among us every act of fornication and uncleanness. And if a woman among you commits harlotry, or even a daughter, burn her with fire, and let them not commit fornication after their eyes and after their heart, and let them not take wives for themselves from the daughters of Canaan, for the seed of Canaan will be uprooted from the land. And he told them of the judgment of the Watchers[a],
translation:
  language: hi
  text: और कि वे अपने पुत्रों का खतना उस वाचा के अनुसार करें जो उनके साथ बाँधी गई थी[a]; और कि वे इससे न हटें, और प्रभु के आज्ञा दिए किसी भी मार्ग से न दाहिनी ओर हटें, न बाईं ओर। और कि हम हर प्रकार के व्यभिचार और अशुद्धता से अपने आपको बचाए रखें, और अपने बीच से हर प्रकार का व्यभिचार और अशुद्धता दूर कर दें। और यदि तुम्हारे बीच कोई स्त्री, या कोई बेटी भी, व्यभिचार करे, तो उसे आग में जला देना[b]। और वे अपनी आँखों और अपने हृदय के पीछे चलकर व्यभिचार न करें; और वे कनान की बेटियों में से अपने लिए पत्नियाँ न लें, क्योंकि कनान का वंश उस देश में से जड़ समेत उखाड़ दिया जाएगा। और उसने उन्हें पहरेदारों के न्याय के विषय में बताया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल साक्ष्य में यह वाक्यांश संक्षिप्त है। ‘वाचा के अनुसार अपने पुत्रों का खतना करें’ का अर्थ अब्राहाम से बाँधी गई वाचा के प्रसंग से स्पष्ट होता है।
    reason: lexical_alternative
  - marker: b
    text: यह आज्ञा कठोर विधिक भाषा में है; गीज़ पाठ स्पष्ट रूप से आग में जलाने की बात कहता है।
    reason: cultural_note
  - marker: c
    text: ‘पहरेदार’ एनोखी परंपरा में उन विद्रोही स्वर्गीय प्राणियों को कहा गया है जिनका न्याय हुआ था।
    reason: cross_reference
lexical_decisions:
- source_word: ይክስቡ፡ ውሉዶሙ
  choice: अपने पुत्रों का खतना ... करें
  rationale: पाठ का वाक्य-विन्यास संक्षिप्त है, पर क्रिया और वाचा-सूत्र का प्रसंग पुत्रों के खतने की ओर संकेत करता है; इसे पादटिप्पणी सहित स्पष्ट रखा गया है।
- source_word: ዝሙት / ዘመወት / ይዘምዋ
  choice: व्यभिचार / व्यभिचार करे / व्यभिचार न करें
  rationale: एक ही शब्द-मूल की जानबूझकर की गई पुनरावृत्ति को हिन्दी में बनाए रखा गया है और उसे सामान्य ‘भटकना’ नहीं बनाया गया।
- source_word: ይሤረዉ፡ ዘርአ፡ ከናአን
  choice: कनान का वंश ... जड़ समेत उखाड़ दिया जाएगा
  rationale: क्रिया उखाड़े जाने का बिंब देती है और ‘वंश/बीज’ के साथ यह कृषि-संबंधी रूपक स्वाभाविक भी है।
- source_word: ረዓይት
  choice: पहरेदारों
  rationale: यह शब्द एनोखी परंपरा में विद्रोही स्वर्गीय प्राणियों के लिए प्रयुक्त विशिष्ट पद ‘Watchers’ को दर्शाता है; सहज हिन्दी के लिए ‘पहरेदार’ चुना गया है।
theological_decisions:
- issue: वाचा और खतने के बीच संबंध
  choice: वाचा के अनुसार पुत्रों का खतना
  alternative: वाचा में अपने पुत्रों को सम्मिलित करना
  rationale: मूल साक्ष्य संक्षिप्त होते हुए भी अब्राहामी वाचा-सूत्र और संबंधित क्रिया खतने का समर्थन करते हैं; फिर भी पाठगत संक्षिप्तता पादटिप्पणी में बताई गई है।
- issue: स्त्री या बेटी को आग में जलाने की आज्ञा
  choice: कठोर विधिक कथन को स्पष्ट रूप से बनाए रखा
  alternative: दंड देना या नष्ट करना जैसे नरम सामान्यीकरण
  rationale: गीज़ पाठ आग में जलाने के विषय में स्पष्ट है; अनुवाद ने न तो इसे नरम किया और न आधुनिक नैतिक अनुमोदन जोड़ा।
- issue: पहरेदारों का दंड
  choice: ‘पहरेदारों’ को विशिष्ट स्वर्गीय प्राणियों के रूप में पादटिप्पणी से समझाया
  alternative: साधारण मानवीय रखवालों का दंड
  rationale: एनोखी साहित्यिक संदर्भ में यह विद्रोही स्वर्गीय प्राणियों के लिए पारिभाषिक पद है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाचा, व्यभिचार और अशुद्धता जैसे प्रचलित बाइबलीय पद बनाए गए हैं। स्रोत में तीसरे पुरुष से पहले पुरुष बहुवचन (‘हम’) की ओर जो बदलाव है, उसे समतल नहीं किया गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रमशः [a], [b], [c] के रूप में उपस्थित हैं।
