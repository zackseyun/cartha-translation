  text: the God of heaven, and cling to all his commandments, and do not walk after their idols and after their uncleanness. And do not make for yourselves gods of cast metal or carved images, for they are emptiness, and there is no spirit in them; for they are the work of hands, and all who trust in them trust in nothing. Do not serve them, and do not bow down to them. But serve the God
translation:
  language: hi
  text: स्वर्ग के परमेश्वर से जुड़े रहो और उसकी सभी आज्ञाओं का दृढ़ता से पालन करो; उनकी मूर्तियों और उनकी अशुद्धता के पीछे मत चलो। अपने लिए ढली हुई धातु के देवता या गढ़ी हुई मूर्तियाँ मत बनाओ, क्योंकि वे व्यर्थ हैं और उनमें कोई आत्मा[a] नहीं है। वे हाथों की कारीगरी हैं, और जो कोई उन पर भरोसा करता है, वह किसी भी वास्तविक वस्तु पर भरोसा नहीं करता। उनकी उपासना मत करो और उनके आगे दण्डवत् मत करो। बल्कि परमेश्वर की उपासना करो—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्राण अथवा श्वास।
    reason: गीइज़ መንፈስ का अर्थ ‘आत्मा,’ ‘प्राण,’ या ‘श्वास’ हो सकता है; निर्जीव प्रतिमाओं के संदर्भ में यह अर्थ-छाया खुली रखी गई है।
lexical_decisions:
- source_word: ትጸመዱ
  choice: लिपटे रहो
  rationale: मूल क्रिया के दृढ़तापूर्वक जुड़े रहने के भाव को बनाए रखते हुए आज्ञाओं के प्रति अटल निष्ठा व्यक्त करता है।
- source_word: ርኵሶሙ
  choice: उनकी अशुद्धता
  rationale: स्रोत के धार्मिक और नैतिक अशुद्धता-सूचक अमूर्त पद को किसी एक विशिष्ट प्रकार की मलिनता तक सीमित नहीं करता।
- source_word: አማልክተ፡ ሰብክ
  choice: ढली हुई धातु के देवता
  rationale: धातु ढालकर बनाए गए देव-प्रतिरूपों का स्पष्ट और स्वाभाविक हिन्दी वर्णन है।
- source_word: ግልፈዋተ
  choice: खुदी हुई मूरतें
  rationale: काटकर या खोदकर बनाए गए प्रतिरूप का अर्थ रखता है और निकटवर्ती ढली धातु के देवताओं से भेद स्पष्ट करता है।
- source_word: ከንቱ
  choice: व्यर्थ
  rationale: मूल के खोखलेपन, निष्फलता और वास्तविक सामर्थ्य के अभाव को संक्षेप में व्यक्त करता है।
- source_word: መንፈስ
  choice: आत्मा
  rationale: मूल पद के आत्मा, प्राण या श्वास-संबंधी अर्थ-विस्तार को औपचारिक रूप से सुरक्षित रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: ይትዌከሉ
  choice: भरोसा रखता है
  rationale: मूर्तियों पर आश्रित होने और उनसे सुरक्षा की अपेक्षा रखने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ታምልክዎሙ / አምልኩ
  choice: उपासना मत करो / उपासना करो
  rationale: नकारात्मक और सकारात्मक आदेश में एक ही उपासना-संबंधी क्रिया का विरोध बनाए रखता है।
theological_decisions:
- issue: मूरतों में መንፈስ का अभाव
  choice: उनमें कोई आत्मा नहीं है
  alternative: उनमें कोई प्राण/श्वास नहीं है
  rationale: ‘आत्मा’ स्रोत के व्यापक धार्मिक अर्थ को बचाता है, जबकि पादटिप्पणी पाठक को जीवित श्वास या प्राण का संभावित अर्थ भी बताती है।
- issue: मूर्तियों पर भरोसा करने का परिणाम
  choice: वह शून्य पर भरोसा रखता है
  alternative: वह किसी चीज़ पर भरोसा नहीं रखता
  rationale: ‘शून्य’ मूर्तियों की असारता को प्रत्यक्ष रखता है और कथन को केवल भरोसे की मनोवैज्ञानिक अनुपस्थिति के रूप में नहीं समझाता।
- issue: पद की खंडित आरम्भ और समाप्ति
  choice: आरम्भ में पूरक क्रिया नहीं जोड़ी और अंत में दीर्घ विराम लगाया
  alternative: संदर्भ अनुमान से आरम्भ या अंत पूरा करना
  rationale: दिए गए गीइज़ पाठ का आरम्भ पूर्ववर्ती वाक्य पर निर्भर है और अंत अगली इकाई में जारी है; अनुदित पाठ में अनुमानित शब्द जोड़ने से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। आज्ञार्थक वाक्यों में ‘मत’ का प्रयोग किया गया है। ‘दण्डवत्’ धार्मिक संदर्भ में सहज और संक्षिप्त है। स्रोतांश दोनों ओर वाक्य के बीच में कटा हुआ है, इसलिए आरम्भ में अनुपस्थित क्रिया नहीं जोड़ी गई और अंत में दीर्घ विराम से निरंतरता दिखाई गई है।
