  text: evening[a], and bow down to him, and continually seek his face at all times, and do uprightness and righteousness before him, so that he may direct you and give you mercy, and send down for you the rain of morning and evening, and bless all the work that you do on the earth, and bless your grain
translation:
  language: hi
  text: परमप्रधान की आराधना करो और उसके सामने झुको। निरन्तर, हर समय उसके दर्शन की अभिलाषा रखो, और उसके सामने सत्यनिष्ठा और धार्मिकता के काम करो, ताकि वह तुम्हें सीधा करे, तुम पर दया करे, तुम्हारे लिए सवेरे और साँझ की वर्षा[a] बरसाए, पृथ्वी पर किए हुए तुम्हारे हर काम को आशीष दे और तुम्हारे अनाज को भी आशीष दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सवेरे और साँझ की वर्षा’ से आशय उचित समय पर होने वाली कृषि-वर्षा हो सकता है; इसकी तुलना ‘पहली और पिछली वर्षा’ जैसे परिचित पदबंध से की जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ልዑለ
  choice: परमप्रधान
  rationale: यह पद परमेश्वर के लिए प्रयुक्त ‘ऊँचा/सर्वोच्च’ शीर्षक है। उपलब्ध गीइज़ अंश वाक्य के बीच से आरम्भ होता प्रतीत होता है; हिन्दी में अगले आराधना-संबंधी आदेश के साथ इसे स्वाभाविक रूप दिया गया है।
- source_word: ወትስፈዉ፡ ገጸ፡ ዚአሁ
  choice: उसके दर्शन की अभिलाषा रखो
  rationale: शाब्दिक चित्र ‘उसके मुख की आशा/प्रतीक्षा करो’ है। ‘दर्शन की अभिलाषा’ उस उपस्थिति-केंद्रित अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है, बिना इसे केवल सहायता माँगने तक सीमित किए।
- source_word: ርትዐ፡ ወጽድቀ
  choice: खराई और धार्मिकता
  rationale: दो समांतर नैतिक संज्ञाओं—सीधापन/सत्यनिष्ठा और धार्मिकता/न्याय—का भेद बनाए रखा गया है।
- source_word: ያርትዕ፡ ርእስክሙ
  choice: तुम्हें सीधा मार्ग दिखाए
  rationale: ርእስክሙ का शाब्दिक अर्थ ‘तुम्हारे सिर/तुम स्वयं’ है और यहाँ आत्मवाचक अर्थ देता है; क्रिया का आशय सीधा करने या सही दिशा देने का है। हिन्दी वाक्यांश व्यक्ति को निर्देशित करने का भाव व्यक्त करता है, न कि स्रोत में किसी स्वतंत्र ‘पथ’ संज्ञा का दावा।
- source_word: ዝናመ፡ ነግሀ፡ ወሰርከ
  choice: सवेरे और साँझ की वर्षा
  rationale: मूल के काल-सूचक युग्म ‘सवेरा और साँझ’ को बनाए रखा गया है; यह समय पर मिलने वाली कृषि-वर्षा का मुहावरा हो सकता है।
- source_word: እክልከ
  choice: तुम्हारे अनाज
  rationale: यह सामान्य अन्न/धान्य के लिए प्रयुक्त शब्द है; ‘अनाज’ आधुनिक हिन्दी में व्यापक और सहज है।
theological_decisions:
- issue: ‘उसके मुख की आशा करना’ का अर्थ
  choice: उसके दर्शन की अभिलाषा रखो
  alternative: उसका मुख खोजो
  rationale: मूल में दिव्य मुख/उपस्थिति का चित्र सुरक्षित रहना चाहिए। चुना हुआ रूप सामान्य पाठक के लिए स्पष्ट है और इसे किसी विशिष्ट सम्प्रदायगत अनुभव के रूप में परिभाषित नहीं करता।
- issue: परमेश्वर द्वारा व्यक्ति को सीधा करना या निर्देश देना
  choice: वह तुम्हें सीधा मार्ग दिखाए
  alternative: वह तुम्हें सीधा करे
  rationale: दोनों अर्थ क्रिया के दायरे में सम्भव हैं। चुना हुआ रूप नैतिक निर्देशन व्यक्त करता है, जबकि शब्दार्थ-संबंधी टिप्पणी स्पष्ट करती है कि मूल में ‘मार्ग’ की पृथक संज्ञा नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आदेशवाचक बहुवचन ‘करो’ का प्रयोग पूरे पद में सुसंगत है। उपलब्ध गीइज़ पाठ का आरम्भ सम्भवतः पिछले वाक्यांश से जुड़ा है; इसलिए आरम्भ को हिन्दी में पूर्ण और पठनीय आदेश के रूप में प्रस्तुत किया गया है।
