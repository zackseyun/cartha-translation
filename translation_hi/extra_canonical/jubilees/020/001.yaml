  yaml_path: translation/extra_canonical/jubilees/020/001.yaml
  text: And in the forty-second jubilee[a], in the first year of the seventh week, Abraham called Ishmael and his twelve sons, and Isaac and his two sons, and the six sons of Keturah and their children. And he commanded them to keep the way of the LORD, to do righteousness, and that each should love his brother, and that he should thus be among all people, walking together to practice justice and righteousness on the earth.
translation:
  language: hi
  text: और बयालीसवें जयन्ती-चक्र में, सातवें सप्ताह के पहले वर्ष में, अब्राहम ने इश्माएल और उसके बारह पुत्रों को, इसहाक और उसके दोनों पुत्रों को, तथा कतूरा के छह पुत्रों और उनकी सन्तानों को बुलाया। उसने उन्हें आज्ञा दी कि वे प्रभु के मार्ग पर चलें, धार्मिकता के काम करें और हर एक अपने भाई से प्रेम करे; और हर एक सब लोगों के बीच इस प्रकार जीवन बिताए, और वे पृथ्वी पर न्याय और धार्मिकता करते हुए एक साथ चलें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ में अंतिम उपवाक्य की वाक्य-रचना सघन और कुछ अस्पष्ट है। आशय संभवतः यह है कि अब्राहम ने हर व्यक्ति को सब लोगों के बीच पारस्परिक प्रेम रखते हुए ऐसा सार्वजनिक जीवन जीने को कहा जो पृथ्वी पर न्याय और धार्मिकता से पहचाना जाए।
    reason: segmentation_note
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: जयन्ती-चक्र
  rationale: यह ‘jubilee’ की कालगणनात्मक इकाई है, केवल उत्सव नहीं; ‘चक्र’ जोड़ने से आधुनिक हिन्दी पाठक को अवधि का अर्थ स्पष्ट होता है।
- source_word: ፍኖተ፡ እግዚአብሔር
  choice: प्रभु के मार्ग
  rationale: स्रोत के ‘प्रभु का मार्ग’ रूपक को बनाए रखते हुए स्वाभाविक हिन्दी प्रयोग चुना गया है।
- source_word: ጽድቀ
  choice: धार्मिकता
  rationale: यह नैतिक रूप से सही आचरण का व्यापक अर्थ रखता है; अंतिम पदबंध में न्याय के साथ इसका भेद भी बना रहता है।
- source_word: ቢጾ
  choice: भाई
  rationale: शब्द का अर्थ साथी/सहचर भी हो सकता है, पर पारिवारिक संबोधन के इस प्रसंग और पारस्परिक प्रेम की आज्ञा में ‘भाई’ स्वाभाविक है।
- source_word: ይሖሩ
  choice: चलें
  rationale: स्रोत के ‘चलने’ वाले आचरण-सूचक रूपक को छोड़ा नहीं गया है।
- source_word: ፍትሕ
  choice: न्याय
  rationale: ጽድቅ से अलग न्यायपूर्ण व्यवहार की धारणा को व्यक्त करता है।
theological_decisions:
- issue: ‘प्रभु के मार्ग’ और ‘चलने’ के नैतिक रूपक
  choice: दोनों रूपकों को प्रत्यक्ष रूप से बनाए रखा गया
  alternative: ‘प्रभु की इच्छा के अनुसार जीवन बिताएँ’ और ‘आचरण करें’
  rationale: स्रोत की बाइबलीय भाषा और उसके आचरण-संबंधी तनाव को आधुनिक हिन्दी में समझने योग्य रखते हुए संरक्षित किया गया है।
- issue: एकवचन ‘हर एक’ से बहुवचन ‘वे’ की ओर व्याकरणिक बदलाव
  choice: ‘हर एक ... जीवन बिताए, ताकि वे ... चलें’
  alternative: संपूर्ण खंड को बहुवचन में समतल करना
  rationale: गीज़ पाठ पहले व्यक्ति-विशेष के लिए एकवचन ይኩን और फिर सामूहिक बहुवचन ይሖሩ का प्रयोग करता है; अनुवाद में यह परिवर्तन बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। ‘जयन्ती-चक्र’ कालगणना को स्पष्ट करता है; नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। अंतिम खंड की स्रोतगत अस्पष्टता को मुख्य पाठ में सहज रूप दिया गया है और पादटिप्पणी में बताया गया है।
