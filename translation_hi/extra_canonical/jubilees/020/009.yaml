  yaml_path: translation/extra_canonical/jubilees/020/009.yaml
  text: to Isaac his son. And Ishmael and his sons and the sons of Keturah and their children went together and settled from Paran as far as the entrance to Babylon, in all the land that faces eastward.
translation:
  language: hi
  text: अपने पुत्र इसहाक को। और इश्माएल, उसके पुत्र, कतूरा के पुत्र और उनके बच्चे—ये सब एक साथ गए और पारान[a] से लेकर बाबेल के प्रवेश तक, पूर्व की ओर मुख किए हुए पूरे देश में बस गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में इस स्थान-नाम का रूप ‘फारमोन’ के निकट है; इसे सामान्यतः पारान से पहचाना जाता है।
    reason: मूल पाठ के स्थान-नाम और पारंपरिक पहचान के बीच का पाठगत अंतर पाठक के लिए सुरक्षित रखना।
lexical_decisions:
- source_word: እምፋርሞን
  choice: पारान[a] से
  rationale: यह स्थान-नाम गीज़ पाठ में ‘फारमोन’ के निकट रूप में है; संदर्भ और प्रचलित पाठ-परंपरा इसे पारान से पहचानती है। पाठगत रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ምብዋአ፡ ባቢሎን
  choice: बाबेल के प्रवेश-मार्ग तक
  rationale: शाब्दिक अर्थ ‘बाबेल के प्रवेश तक’ है। ‘प्रवेश-मार्ग’ हिन्दी में भौगोलिक सीमा या पहुँचने के रास्ते का स्वाभाविक बोध देता है, बिना इसे नगर-द्वार तक सीमित किए।
- source_word: ገጸ፡ ጽባሕ
  choice: पूर्व की ओर मुख किए हुए
  rationale: शाब्दिक चित्र ‘भोर/सूर्योदय की ओर मुख’ का है, जो दिशार्थ में पूर्व को सूचित करता है; हिन्दी में मूल रूपक का कुछ अंश रखते हुए दिशा स्पष्ट की गई है।
- source_word: ኅቡረ
  choice: सब एक साथ
  rationale: इस क्रियाविशेषण का अर्थ सामूहिक रूप से या साथ मिलकर है; वंश-समूहों की संयुक्त गति को स्पष्ट करता है।
- source_word: ኀደሩ
  choice: बस गए
  rationale: संदर्भ में इसका अर्थ किसी क्षेत्र में निवास करना या टिकना है; ‘बस गए’ आधुनिक हिन्दी में स्थायी निवास का स्वाभाविक संकेत देता है।
