  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। आरंभ का वाक्यांश पिछले पद से जुड़ा हुआ खंड है, इसलिए उसे स्रोत के अनुसार स्वतंत्र रूप से पूरा किए बिना बनाए रखा गया है। ‘बाबेल’ नाम पुराने नियम के भौगोलिक-सांस्कृतिक संदर्भ के अनुरूप चुना गया है।
