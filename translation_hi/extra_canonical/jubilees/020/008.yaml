  yaml_path: translation/extra_canonical/jubilees/020/008.yaml
  text: and they will bless your children in my name, so that they may be blessed as I am. And he gave gifts to Ishmael and to his sons and to the sons of Keturah, and he sent them away from Isaac his son; but he gave everything to him
translation:
  language: hi
  text: और वे मेरे नाम से तुम्हारी संतानों को आशीर्वाद देंगे, ताकि वे मेरी तरह धन्य हों। फिर उसने इश्माएल, उसके पुत्रों और कतूरा के पुत्रों को भेंटें दीं और उन्हें अपने पुत्र इसहाक से दूर भेज दिया; पर उसने सब कुछ उसे[a] दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में “उसे” है; इसका संकेत सम्भवतः इसहाक की ओर है, जिसका उल्लेख अगले पद में फिर आता है।
    reason: मूल गीइज़ में पुल्लिंग एकवचन कर्म-सूचक प्रत्यय मौजूद है, पर इस पद के भीतर उसका अभिप्रेत व्यक्ति स्पष्ट रूप से दोबारा नहीं बताया गया।
lexical_decisions:
- source_word: ይባርኩ / ቡሩካነ
  choice: आशीर्वाद देंगे / आशीषित हों
  rationale: क्रिया और उससे संबंधित विशेषण के आशीर्वाद-संबंधी अर्थ को स्पष्ट रखते हुए स्वाभाविक आधुनिक हिन्दी दी गई है।
- source_word: ሀብተ
  choice: भेंटें
  rationale: यहाँ सन्तानों को विदा करते समय दी गई संपत्ति अथवा उपहार का भाव है; बहुवचन 'भेंटें' प्रसंग के अनुकूल और सहज है।
- source_word: ፈነዎሙ
  choice: उन्हें ... दूर भेज दिया
  rationale: मूल क्रिया में भेज देने का भाव है, और እምይስሐቅ से इसहाक से अलग अथवा दूर किए जाने का संबंध व्यक्त होता है।
- source_word: ወኵሎ፡ ወሀቦ
  choice: पर उसने सब कुछ उसे दे दिया
  rationale: ወሀቦ में तृतीय पुरुष पुल्लिंग एकवचन कर्म-सूचक प्रत्यय है, इसलिए 'उसे' को बनाए रखा गया है; वाक्य का आकस्मिक पद-विभाजन भी पूरी तरह समतल नहीं किया गया।
