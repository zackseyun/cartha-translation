  yaml_path: translation/extra_canonical/jubilees/020/003.yaml
  text: 'and the judgment of Sodom, how they were judged because of their wickedness, and because of fornication and uncleanness and corruption among themselves: by fornication they died. And you also, guard yourselves from all fornication and uncleanness and from every defilement of sin, so that you may not make your name a curse, and all your life a reproach, and all your sons to destruction by the sword, and you become accursed like Sodom, and all your remnant like the sons of Gomorrah. I testify to you, my children: love him'
translation:
  language: hi
  text: 'और सदोम का न्याय—कि उनकी दुष्टता और उनके बीच के व्यभिचार, अशुद्धता और भ्रष्टता के कारण उनका न्याय कैसे हुआ; व्यभिचार के कारण वे मर गए। तुम भी हर प्रकार के व्यभिचार और अशुद्धता से, और पाप की हर मलिनता से अपने को बचाए रखो, ताकि तुम अपने नाम को शाप का विषय, अपने पूरे जीवन को निंदा का विषय, और अपने सभी पुत्रों को तलवार से विनाश के लिए न सौंप दो;[b] और तुम सदोम के समान शापित न हो जाओ, और तुम में से बचे हुए सब लोग गमोरा के पुत्रों के समान न हो जाएँ। मैं तुम्हें गवाही देता हूँ, मेरे बच्चो: उससे प्रेम करो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक अनुवाद: “मेरी सुनो, मेरे बच्चो, और प्रेम करो।” गीज़ पाठ का व्याकरण अधिक स्वाभाविक रूप से “मैं तुम्हें गवाही देता हूँ … उससे प्रेम करो” का समर्थन करता है।'
    reason: पूर्ववर्ती वैकल्पिक अनुवाद को दर्ज करता है, पर उसे पाठांतर नहीं कहता; मुख्य पाठ में गीज़ की घोषणात्मक क्रिया और तृतीय पुरुष पुल्लिंग एकवचन कर्म को बनाए रखता है।
  - marker: b
    text: 'अथवा, अर्थ को स्वतंत्र उपवाक्य के रूप में लेकर: “और तुम्हारे सभी पुत्र तलवार से नष्ट हो जाएँ।”'
    reason: वाक्य-संबंध की वैकल्पिक व्याख्या को दर्ज करता है, यद्यपि मुख्य पाठ मूल की समानांतर रचना को अधिक निकटता से दर्शाता है।
lexical_decisions:
- source_word: ኵነኔሆሙ
  choice: उनके न्याय
  rationale: संज्ञात्मक रूप और आगे आने वाले ‘उनका न्याय कैसे हुआ’ के साथ स्रोत की पुनरुक्ति को बनाए रखता है।
- source_word: ዝሙት
  choice: व्यभिचार
  rationale: यौन अनैतिकता के अर्थ वाला गरिमापूर्ण और सामान्य हिन्दी शब्द; पूरे पद में एकरूपता रखी गई है।
- source_word: ርኵስ
  choice: अशुद्धता
  rationale: नैतिक और धार्मिक अशुद्धता—दोनों संभावित भावों को बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
- source_word: ሙስና
  choice: भ्रष्टता / विनाश
  rationale: पहली उपस्थिति में सामाजिक-नैतिक ‘भ्रष्टता’ उपयुक्त है; दूसरी में ‘तलवार’ के साथ परिणामसूचक ‘विनाश’ अधिक स्वाभाविक है।
- source_word: ፃማነ ኀጢአት
  choice: पाप की हर मलिनता
  rationale: पाप से उत्पन्न दाग या दूषण के स्रोत-भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: አሰምዕ
  choice: मैं तुम्हारे सामने साक्षी देता हूँ
  rationale: प्रथम पुरुष एकवचन घोषणात्मक क्रिया को दर्शाता है; इसे आज्ञार्थक ‘मेरी सुनो’ नहीं बनाया गया।
- source_word: አፍቅርዎ
  choice: उससे प्रेम करो
  rationale: क्रिया में निहित तृतीय पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय को बनाए रखता है; इसका संदर्भ अगले पद में स्पष्ट होता है।
theological_decisions:
- issue: सदोम के दोषों का स्वरूप
  choice: दुष्टता, व्यभिचार, अशुद्धता और भ्रष्टता—स्रोत में दिए सभी दोषों को समान रूप से रखा गया
  alternative: किसी एक यौन पाप को सदोम के न्याय का एकमात्र कारण बताना
  rationale: स्रोत कई कारणों की सूची देता है; अनुवाद किसी संप्रदायगत निष्कर्ष के लिए सूची को संकुचित नहीं करता।
- issue: अंतिम ‘उससे’ का संदर्भ
  choice: सर्वनाम को अस्पष्ट रहने दिया गया
  alternative: इसी पद में ‘परमेश्वर से प्रेम करो’ जोड़ना
  rationale: मूल पद में केवल पुल्लिंग एकवचन कर्म-प्रत्यय है और स्पष्ट संज्ञा अगले पद में आती है; पद-सीमा के भीतर अतिरिक्त पहचान नहीं जोड़ी गई।
- issue: पुत्रों के विनाश का वाक्य-संबंध
  choice: ‘सौंप दो’ के अधीन समानांतर कर्म के रूप में अनूदित
  alternative: 'स्वतंत्र कथन: ‘तुम्हारे सभी पुत्र तलवार से नष्ट हो जाएँ’'
  rationale: गीज़ में ‘विनाश के लिए’ पहले के ‘शाप का विषय’ और ‘निंदा का विषय’ के समानांतर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘अपने आपको बचाए रखो’ सामान्य पाठक के लिए सहज है, जबकि ‘शाप का विषय’ और ‘निंदा का विषय’ मूल की समानांतर संरचना बनाए रखते हैं। पद आरंभ और अंत दोनों ओर प्रसंग से जुड़े हुए हैं; इसलिए आरंभिक संयोजक और अंतिम अस्पष्ट सर्वनाम को नहीं हटाया गया।
