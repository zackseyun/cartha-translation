translation:
  language: hi
  text: तेरे झुंड। और तुम पृथ्वी पर आशीष बनोगे, और पृथ्वी की सभी जातियाँ तुम्हें चाहेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዒከ
  choice: तेरी भेड़-बकरियाँ
  rationale: गीज़ पद का अर्थ ‘तेरे झुंड/भेड़ें’ है और यह पिछले वाक्य से जुड़ा हुआ खंड है। हिंदी में ‘भेड़-बकरियाँ’ पशुधन के झुंड को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ትከውኑ፡ በበረከት
  choice: तू ... आशीष ठहरेगा
  rationale: शाब्दिक भाव ‘तू आशीष में/के रूप में होगा’ है। ‘आशीष ठहरेगा’ अर्थ को बनाए रखते हुए गरिमापूर्ण और स्वाभाविक हिंदी देता है।
- source_word: ይፈትዉክሙ
  choice: तुझे चाहेंगी
  rationale: क्रिया प्रेम करने, चाहने या अभिलाषा रखने का भाव देती है। यहाँ स्रोत की सकारात्मक किंतु कुछ खुली अर्थ-सीमा को ‘चाहेंगी’ सुरक्षित रखता है।
- source_word: ኵሎሙ፡ አሕዛበ፡ ምድር
  choice: पृथ्वी की सब जातियाँ
  rationale: यह वाक्यांश सभी सांसारिक peoples/nations को दर्शाता है; बाइबलीय हिंदी में ‘सब जातियाँ’ स्पष्ट और परिचित है।
theological_decisions:
- issue: जातियों द्वारा संबोधित व्यक्ति को चाहने का आशय
  choice: तुझे चाहेंगी
  alternative: तुझसे प्रेम करेंगी / तेरी अभिलाषा करेंगी
  rationale: स्रोत-क्रिया के प्रेम, इच्छा और अनुकूल चाह के संभावित अर्थों को किसी विशेष मसीही या वाचागत व्याख्या में सीमित किए बिना रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, एकवचन आत्मीय संबोधन ‘तू/तेरी/तुझे’ के साथ; शैली गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। आरंभिक खंड पिछले पद/वाक्य की निरंतरता है, इसलिए उसे स्रोत के समान अपूर्ण वाक्यांश के रूप में रखा गया है।
