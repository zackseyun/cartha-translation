  text: and womb, and may He bless the seed of your body and the seed of your land, and the herds of your cattle and the flocks of
translation:
  language: hi
  text: और गर्भ को,[a] और वह तुम्हारी देह की संतान और तुम्हारी भूमि की उपज को, तुम्हारे मवेशियों के झुंडों और ... के रेवड़ों को[b] आशीष दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह अंश पिछले वाक्य से जारी है; शाब्दिक रूप से: ‘और गर्भ को’।'
    reason: दिया गया स्रोत-अंश वाक्य के बीच से आरंभ होता है, इसलिए हिन्दी में भी आरंभ अधूरा प्रतीत होता है।
  - marker: b
    text: उपलब्ध स्रोत-पाठ यहाँ ‘और ... के रेवड़ों को’ पर अधूरा समाप्त होता है।
    reason: दिया गया गीइज़ अंश अगले संबंधवाचक संज्ञा से पहले कट गया है; अनुमान लगाकर उसे पूरा नहीं किया गया।
lexical_decisions:
- source_word: ዘርአ (zar'a)
  choice: संतान / उपज
  rationale: एक ही गीइज़ शब्द का मूल अर्थ ‘बीज’ है, पर देह के संदर्भ में यह संतान और भूमि के संदर्भ में उपज को सूचित करता है। संदर्भानुसार दो स्वाभाविक हिन्दी शब्द चुने गए हैं।
- source_word: ከርሥከ (karśika)
  choice: तुम्हारी देह
  rationale: शब्द का अर्थ पेट, गर्भ या शरीर हो सकता है। ‘देह की संतान’ आधुनिक हिन्दी में स्वाभाविक है और वंशोत्पत्ति का आशय बनाए रखता है।
- source_word: መራዕየ (marā'eya)
  choice: झुंडों / रेवड़ों
  rationale: यह चरने वाले पशुओं के समूहों के लिए प्रयुक्त पशुपालकीय शब्द है; इसलिए सामान्य ‘संतान’ की अपेक्षा ‘झुंड’ और ‘रेवड़’ अधिक सटीक हैं।
- source_word: አልህምቲከ (alhamtika)
  choice: तुम्हारे पशुधन
  rationale: यह घरेलू पशुओं या मवेशियों को सूचित करता है। ‘पशुधन’ व्यापक, स्वाभाविक और ग्रामीण-पशुपालकीय संदर्भ के अनुकूल है।
theological_decisions:
- issue: आशीष देने वाले कर्ता का उल्लेख
  choice: ‘वह’ रखा गया
  alternative: ईश्वर का नाम जोड़ना
  rationale: क्रिया का कर्ता पुल्लिंग एकवचन में निहित है, किंतु दिए गए अंश में नाम स्पष्ट नहीं है। इसलिए संदर्भगत सर्वनाम रखा गया और कोई नाम आयात नहीं किया गया।
- issue: आरंभिक ‘और गर्भ को’ का संबंध
  choice: इसे पिछले उपवाक्य का शेष अंश मानकर अलग रखा गया
  alternative: ‘और वह तुम्हारे गर्भ को आशीष दे’
  rationale: गीइज़ में ‘गर्भ’ के बाद अलग क्रिया ‘और वह आशीष दे’ आती है; अतः ‘गर्भ’ को उस क्रिया का कर्म बना देना वाक्य-संरचना बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत के आरंभ और अंत की अपूर्णता को सुधारा नहीं गया, बल्कि विरामचिह्नों और पादटिप्पणियों से स्पष्ट किया गया है।
