  yaml_path: translation/extra_canonical/jubilees/044/006.yaml
  text: I will go down with you, and I will surely bring you up again. And in this land you will be buried, and Joseph will place his hands on your eyes. Do not fear; go down into Egypt.”
translation:
  language: hi
  text: “मैं तुम्हारे साथ नीचे जाऊँगा और तुम्हें फिर ऊपर ले आऊँगा। इसी देश में तुम्हें दफनाया जाएगा, और यूसुफ तुम्हारी आँखों पर अपने हाथों को रखेगा[a]। मत डरो; मिस्र उतर जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अन्य पाठ-परंपराओं में “अपना हाथ”।
    reason: गीज़ में ‘हाथ’ बहुवचन है, जबकि उत्पत्ति 46:4 की एक अन्य प्राचीन पाठ-परंपरा में एकवचन मिलता है।
lexical_decisions:
- source_word: እወርድ፡ ምስሌከ
  choice: मैं तुम्हारे साथ नीचे जाऊँगा
  rationale: क्रिया के दिशात्मक अर्थ और साथ होने की प्रतिज्ञा—दोनों को सीधे बनाए रखा गया है।
- source_word: አወጽአከ
  choice: तुम्हें फिर ऊपर ले आऊँगा
  rationale: मूल क्रिया का अर्थ ‘बाहर/ऊपर ले आना’ है; प्रसंग में मिस्र से वापस ले आने का आशय है, पर उसे अधिक स्पष्ट करके धार्मिक तनाव को समाप्त नहीं किया गया।
- source_word: ትትቀበር
  choice: तुम्हें दफनाया जाएगा
  rationale: मूल निष्क्रिय क्रिया ‘दफनाया जाना’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
