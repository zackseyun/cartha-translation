  text: 'And the sons of Dan: Hushim[23], Samon, Asudi, Iaka, and Solomon—five.'
translation:
  language: hi
  text: 'और दान के पुत्र थे: हूशीम[a], सामोन, आसूदी, ईयाक और सोलोमोन—छः[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति की अधिक परिचित वंशावली में दान का केवल एक पुत्र हूशीम बताया गया है। जुबिलीज़ यहाँ कई पुत्रों वाली विस्तृत परंपरा प्रस्तुत करती है; आगे कहा गया है कि उनमें से अधिकांश मिस्र में उसी वर्ष मर गए।
    reason: cross_reference
  - marker: b
    text: मूल गीइज़ पाठ में “छः” है, यद्यपि यहाँ केवल पाँच नाम गिनाए गए हैं। कुछ अनुवाद इस संख्या को “पाँच” कर देते हैं।
    reason: textual_difficulty
lexical_decisions:
- source_word: ወውሉደ፡ ዳን
  choice: और दान के पुत्र थे
  rationale: वंशावली की स्वाभाविक हिन्दी शैली में संबंध स्पष्ट किया गया है; स्रोत का संयोजक और संबंधवाचक रूप सुरक्षित है।
- source_word: ሑሲም፡ ወሳሞን፡ ወአሱዲ፡ ወኢያክ፡ ወስሎሞን
  choice: हूशीम, सामोन, आसूदी, ईयाक और सोलोमोन
  rationale: नामों का लिप्यंतरण उपलब्ध गीइज़ रूपों के निकट रखा गया है, बिना उन्हें उत्पत्ति की अधिक परिचित नामावली के अनुरूप बनाने के।
