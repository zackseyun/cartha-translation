  text: And Jacob remembered the dream that he had seen at Bethel, and he was afraid to go down into Egypt.
translation:
  language: hi
  text: और याकूब ने उस स्वप्न को याद किया जो उसने बेतेल में देखा था, और वह मिस्र उतर जाने से डर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከረ
  choice: याद किया
  rationale: गीज़ क्रिया का अर्थ स्मरण करना है; आधुनिक हिन्दी में ‘याद किया’ स्वाभाविक और स्पष्ट है।
- source_word: ሕልመ
  choice: स्वप्न
  rationale: मूल के ‘स्वप्न’ अर्थ को गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: ቤቴል
  choice: बेतेल
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ፈርሀ
  choice: डर गया
  rationale: मूल में भय की सीधी अभिव्यक्ति है; यह हिन्दी में स्वाभाविक रूप से उसी भाव को रखता है।
- source_word: ፈደ ውስተ ግብጽ
  choice: मिस्र जाने
  rationale: संदर्भ में मिस्र की ओर प्रस्थान का भाव है। हिन्दी में ‘जाने’ स्वाभाविक है; ‘नीचे जाने’ जैसी स्रोत-भाषायी दिशात्मक अभिव्यक्ति अनावश्यक रूप से आरोपित नहीं की गई।
theological_decisions:
- issue: बेतेल के स्वप्न और मिस्र जाने के भय के बीच संबंध
  choice: दोनों कथनों को केवल ‘और’ से जोड़ा गया
  alternative: स्वप्न को भय का स्पष्ट कारण बताना
  rationale: मूल पाठ कारण-सूचक संबंध स्पष्ट नहीं करता; इसलिए उसकी कथात्मक और धर्मवैचारिक अस्पष्टता बनाए रखी गई।
