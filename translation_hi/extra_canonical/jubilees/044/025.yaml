  text: 'And these are the names of the sons of Naphtali: Jahziel, Guni, Jezer, Shallum, and Iv[25].'
translation:
  language: hi
  text: 'और नप्ताली के पुत्रों के नाम ये थे: यहसीएल, गूनी, येसेर, शल्लूम और इव[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नप्ताली की इस सूची का अंतिम नाम गीज़ पंक्ति में अनिश्चित है और संभवतः किसी नाम का संक्षिप्त या विकृत रूप है।
    reason: textual_variant
lexical_decisions:
- source_word: ኢያሲኤል
  choice: यहसीएल
  rationale: गीज़ नाम का ऐसा देवनागरी लिप्यंतरण चुना गया है जो संबंधित सामी नाम-रूप को पहचानने योग्य रखता है।
- source_word: ጉኒ
  choice: गूनी
  rationale: मूल नाम का सीधा और स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: አስለር
  choice: येसेर
  rationale: गीज़ पंक्ति का रूप पाठगत रूप से अस्थिर प्रतीत होता है; समान वंशावली में प्रचलित नाम-रूप के निकट रहते हुए इसे 'येसेर' दिया गया है।
- source_word: ስሎም
  choice: शल्लूम
  rationale: यह रूप संबंधित सामी नाम शल्लूम का गीज़ प्रतिबिंब समझा गया है।
- source_word: አው
  choice: ईव
  rationale: अंतिम नाम का गीज़ पाठ अनिश्चित है; उसे किसी अधिक परिचित नाम में सुधारने के बजाय एक सावधान लिप्यंतरण दिया गया है।
