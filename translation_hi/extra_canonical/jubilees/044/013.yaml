  yaml_path: translation/extra_canonical/jubilees/044/013.yaml
  text: 'Issachar and his sons; and these are the names of his sons: Tola, Puvah, Iashub, and Shimron—four.'
translation:
  language: hi
  text: 'इस्साकार और उसके पुत्र; उसके पुत्रों के नाम ये थे: तोला, पूवा, याशूब और शिम्रोन—कुल चार।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሳኮር
  choice: इस्साकार
  rationale: याकूब के पुत्र के लिए हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: ተላ
  choice: तोला
  rationale: नाम का मानक हिन्दी लिप्यंतरण; गीइज़ रूप के निकट और संबंधित वंशावली परंपरा से संगत।
- source_word: ፉአ
  choice: पूवा
  rationale: गीइज़ नाम-रूप का सहज हिन्दी लिप्यंतरण।
- source_word: ኢያሱብ
  choice: याशूब
  rationale: नाम में विद्यमान प्रारंभिक ध्वनि और शूब-तत्व को बनाए रखने वाला हिन्दी रूप।
- source_word: ሳመርም
  choice: शिम्रोन
  rationale: संबंधित प्राचीन वंशावली में पहचाने जाने वाले नाम का प्रचलित हिन्दी रूप; गीइज़ पाठ में ध्वन्यात्मक रूपांतर है।
- source_word: ፬
  choice: कुल चार
  rationale: सूची के अंत की गणना को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
