  text: 'Levi and his sons; and these are the names of his sons: Gershon[11], Kohath, and Merari—three.'
translation:
  language: hi
  text: 'लेवी और उसके पुत्र; और उसके पुत्रों के नाम ये हैं: गेर्शोन, कहात और मरारी—तीन।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़ पाठ में इस पंक्ति का अंक गड़बड़ प्रतीत होता है: यहाँ लेवी के तीन पुत्रों के नाम दिए गए हैं, यद्यपि एक पांडुलिपि-परंपरा में कुल संख्या भ्रष्ट हो सकती है।'
    reason: textual_variant
lexical_decisions:
- source_word: ሌዊ፡ ወውሉዱ
  choice: लेवी और उसके पुत्र
  rationale: गीज़ पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ጌድሶን
  choice: गेर्शोन
  rationale: नाम का रूप समानांतर बाइबिलीय वंशावली और प्रचलित हिन्दी लिप्यंतरण के अनुसार रखा गया है; गीज़ पाठ में ध्वन्यात्मक/पाठगत रूपांतर है।
- source_word: ቀዓት
  choice: कहात
  rationale: लेवी के पुत्र के नाम का प्रचलित हिन्दी बाइबिलीय रूप।
- source_word: ሜራሪ
  choice: मरारी
  rationale: मूल नाम के निकट और हिन्दी बाइबिलीय परंपरा में सुबोध रूप।
