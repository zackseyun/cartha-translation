base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/027.yaml
  text: And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons[27], all of them seventy-five.
translation:
  language: hi
  text: और याकूब के जितने जन मिस्र में आए, वे सत्तर थे। ये उसके बेटे और उसके बेटों के बेटे थे—कुल मिलाकर पचहत्तर जन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस अध्याय की गणना जानबूझकर की गई है, पर सीधी नहीं है: यहाँ मिस्र में आनेवालों की संख्या पहले सत्तर और फिर वंशजों सहित पचहत्तर बताई गई है। आगे कहा गया है कि पाँच जन मिस्र में मर गए थे, जबकि यूसुफ और उसके दो बेटे उस मृत्यु-विवरण में शामिल नहीं हैं।'
    reason: स्रोत में सुरक्षित सत्तर और पचहत्तर की गणना के संबंध को स्पष्ट करने वाला प्रसंग-संदर्भ।
lexical_decisions:
- source_word: መንፈስ
  choice: जन
  rationale: इस गणना-सूची में शब्द व्यक्तियों की संख्या बताता है। शाब्दिक ‘आत्मा/प्राण’ की अपेक्षा ‘जन’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक गणना का अर्थ सुरक्षित रखता है।
- source_word: ውሉደ፡ ውሉዱ
  choice: उसके बेटों के बेटे
  rationale: स्रोत की वंश-संबंधी अभिव्यक्ति को ‘पोते’ में संक्षिप्त करने के बजाय औपचारिक रूप से स्पष्ट रखा गया है।
- source_word: ሰብዓ፡ ወኃምስቱ
