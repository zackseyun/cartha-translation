  yaml_path: translation/extra_canonical/jubilees/044/007.yaml
  text: And his sons and the sons of his sons rose up, and they loaded their father and their possessions on wagons. And Israel set out from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt.
translation:
  language: hi
  text: और उसके बेटे और पोते उठे, और उन्होंने अपने पिता और अपना सामान गाड़ियों पर लाद दिया। फिर इस तीसरे महीने की सोलहवीं तारीख को इस्राएल शपथ के कुएँ से चल पड़ा और मिस्र देश गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉዱ ወውሉደ ውሉዱ
  choice: उसके बेटे और पोते
  rationale: शाब्दिक रूप से ‘उसके बेटे और उसके बेटों के बेटे’; आधुनिक हिन्दी में ‘पोते’ वही अर्थ स्वाभाविक और स्पष्ट रूप से देता है।
- source_word: ንዋዮሙ
  choice: अपनी सम्पत्ति
  rationale: यह शब्द उनके माल-असबाब या स्वामित्व की वस्तुओं को सूचित करता है; ‘सम्पत्ति’ व्यापक अर्थ बनाए रखता है।
- source_word: ሰረገላት
  choice: गाड़ियों
  rationale: मूल में पहिएदार वाहनों का बहुवचन है; बैलों जैसे किसी अनुल्लिखित विवरण को जोड़े बिना ‘गाड़ियों’ उपयुक्त है।
- source_word: ዐዘቅተ መሐላ
  choice: शपथ का कुआँ
