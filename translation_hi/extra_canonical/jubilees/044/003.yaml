  text: And while he was considering sending to Joseph that he should come to him[3], and not going down himself, he remained there seven days, to see in a vision whether he should stay or whether he should go down. And he celebrated the feast of the harvest of the firstfruits of the old grain, for in all the land of Canaan there was not a handful of any seed in the land, because the famine was upon all the beasts and the livestock and the birds and also upon men.
translation:
  language: hi
  text: और जब वह यह सोच रहा था कि यूसुफ को संदेश भेजे कि वह उसके पास आए[b], और स्वयं नीचे न जाए, तब वह वहाँ सात दिन ठहरा, यह देखने के लिए कि उसे दर्शन में वहीं ठहरना चाहिए या नीचे जाना चाहिए। और उसने पुराने अनाज की पहली उपज की कटनी का पर्व मनाया[a], क्योंकि कनान के पूरे देश में भूमि में किसी भी बीज की एक मुट्ठी भी नहीं थी; अकाल सब जंगली पशुओं, पालतू पशुओं, पक्षियों और मनुष्यों पर भी छाया हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पुराने अनाज की पहली उपज की कटनी का पर्व।” पाठ में ‘कटनी’ और ‘पहली उपज’ दोनों का उल्लेख है।
    reason: textual_clarity
  - marker: b
    text: इस पद का प्रेषित गीज़ पाठ कठिन है। आशय संभवतः यह है कि याकूब ने पुष्टि देने वाले दर्शन के लिए सात दिन प्रतीक्षा की और अकाल के कारण नई उपज न होने पर पुराने अनाज से पहली उपज की कटनी का पर्व मनाया।
    reason: textual_variant
lexical_decisions:
- source_word: ይሔሊ
  choice: यह सोच रहा था
  rationale: क्रिया विचार करने या मन में योजना बनाने का भाव देती है; सहज आधुनिक हिन्दी में इसे इसी रूप में रखा गया।
- source_word: ይልአክ፡ ለዮሴፍ
  choice: यूसुफ को संदेश भेजे
  rationale: मूल में यूसुफ के पास भेजने का भाव है; हिन्दी में संदेश भेजना आशय स्पष्ट करता है, बिना यह जोड़े कि कोई विशिष्ट दूत भेजा गया था।
- source_word: ይወርድ
  choice: नीचे जाना
  rationale: मिस्र की ओर जाने के लिए प्रयुक्त दिशात्मक क्रिया का पारंपरिक और स्रोत-संगत भाव सुरक्षित रखा गया।
- source_word: ራእየ
  choice: दर्शन
  rationale: यह स्वप्न मात्र नहीं, दैवी या दृष्टिगत दर्शन को सूचित कर सकता है; अतः व्यापक शब्द चुना गया।
- source_word: በዓለ፡ ማእረረ፡ ቀዳሚ፡ ፍሬ
  choice: पहली उपज की कटनी का पर्व
  rationale: वाक्यांश में पर्व, कटनी और पहली उपज—तीनों तत्व हैं; हिन्दी में स्वाभाविक क्रम रखते हुए सभी को व्यक्त किया गया।
- source_word: ሥርናይ፡ ብሉይ
  choice: पुराना अनाज
  rationale: अकाल के प्रसंग में पिछले भंडार का अनाज अभिप्रेत है; स्रोत के विशेषण को स्पष्ट रूप से बनाए रखा गया।
- source_word: ዐባር
  choice: अकाल
  rationale: गीज़ शब्द का अर्थ अकाल है; इसे छोड़े बिना अंतिम खंड का कर्ता बनाया गया।
- source_word: አራዊት፡ ለእንስሳ፡ ወለአዕዋፍ፡ ወለሰብእ
  choice: जंगली पशुओं, पालतू पशुओं, पक्षियों और मनुष्यों
  rationale: जीवों की स्रोत-सूची और जंगली/पालतू पशुओं का भेद सुरक्षित रखा गया।
theological_decisions:
- issue: सात दिन प्रतीक्षा करने और दर्शन पाने के बीच संबंध
  choice: वह सात दिन ठहरा, ताकि दर्शन में निर्णय का संकेत देखे
  alternative: उसने सात दिनों के भीतर वास्तव में कोई दर्शन देखा
  rationale: स्रोत उद्देश्य या अपेक्षा व्यक्त करता है, दर्शन की प्राप्ति की स्पष्ट घोषणा नहीं; इसलिए परिणाम को निश्चित नहीं किया गया।
- issue: याकूब का यूसुफ को बुलाना या स्वयं मिस्र जाना
  choice: दोनों संभावनाओं को खुला रखा गया
  alternative: याकूब ने पहले ही नीचे न जाने का निश्चय कर लिया था
  rationale: पाठ में विचार-विमर्श और दर्शन द्वारा पुष्टि की प्रतीक्षा का तनाव है; उसे निर्णीत रूप नहीं दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘नीचे जाना’, ‘दर्शन’, ‘पहली उपज’ और ‘अकाल’ जैसे स्रोत-संगत पद बनाए रखे गए हैं। कठिन अंतिम खंड को अर्थपूर्ण हिन्दी में प्रस्तुत किया गया है, और उसकी पाठगत अनिश्चितता पादटिप्पणी में बताई गई है।
