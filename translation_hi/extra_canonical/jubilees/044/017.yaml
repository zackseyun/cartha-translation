  text: 'And the sons of Asher: Imnah, Ishvah, Beriah, and Serah, their sister—four. All the persons were sixteen, and all the persons of Leah were forty-nine.'
translation:
  language: hi
  text: 'और आशेर की संतानें: इम्ना, यिशूआ, यिशूई,[a] बेरीआ और उनकी बहन सेरह—कुल पाँच। ये सब मिलाकर सोलह व्यक्ति थे, और लिआ के कुल व्यक्ति उनचास थे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यिशूई नाम गीइज़ पाठ में कोष्ठक में है। इसे पाठ में न गिनने पर सूची ‘कुल चार’ होगी, जैसा अंग्रेज़ी POB परामर्श-पाठ में है।
    reason: कोष्ठकस्थ पाठ-रूप और संख्या-भेद को स्पष्ट करता है, बिना किसी एक पाठ-परंपरा को निर्णायक रूप से प्राथमिक ठहराए।
  - marker: b
    text: शाब्दिक रूप से, “और लिआ के सब उनचास हुए”; संदर्भ में यह लिआ से संबंधित गिने गए सभी व्यक्तियों की कुल संख्या है।
    reason: संक्षिप्त गीइज़ गणना-वाक्य और ‘व्यक्ति’ की समानांतर शब्दावली को स्पष्ट करता है।
lexical_decisions:
- source_word: ውሉደ
  choice: संतानें
  rationale: यहाँ वंश-सूची में पुत्रों के साथ बहन सेरह भी गिनी गई है; इसलिए केवल ‘पुत्र’ कहने के बजाय समावेशी ‘संतानें’ अधिक स्वाभाविक और सटीक है।
