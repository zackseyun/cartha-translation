  text: 'And Israel set out from Add a footnote: "Ge''ez reads *Haran*, a likely scribal error for *Hebron*.", from his house, on the new moon of the third month, and he went by the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month.'
translation:
  language: hi
  text: और इस्राएल तीसरे महीने के नए चाँद के दिन हारान[a] से—अपने घर से—चला। वह शपथ के कुएँ के मार्ग से गया, और इसी महीने के सातवें दिन उसने अपने पिता इसहाक के परमेश्वर को बलिदान चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में “हारान” है; सम्भवतः यह “हेब्रोन” के स्थान पर लिपिकीय भूल है।
    reason: मुख्य पाठ में प्रमाणित गीज़ पठन सुरक्षित रखते हुए भौगोलिक और कथात्मक प्रसंग से सम्भावित मूल स्थान-नाम की जानकारी देना।
lexical_decisions:
- source_word: ተንሥአ
  choice: चल पड़ा
  rationale: इस क्रिया का मूल अर्थ ‘उठना’ है, पर यात्रा के प्रसंग में यह प्रस्थान करने को व्यक्त करती है; इसलिए स्वाभाविक हिन्दी में ‘चल पड़ा’ चुना गया।
- source_word: ካራን
  choice: हारान[a]
  rationale: उपलब्ध गीज़ पाठ का प्रत्यक्ष रूप ‘हारान’ है। प्रसंग ‘हेब्रोन’ की ओर संकेत करता है, पर पाठ को चुपचाप संशोधित करने के बजाय मूल पठन मुख्य पाठ में और सम्भावित नकल-भूल टिप्पणी में रखी गई है।
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  choice: तीसरे महीने के नवचंद्र के दिन
  rationale: ሠርቀ ወርኅ महीने के उदय, अर्थात नवचंद्र/महीने के आरम्भ, को दर्शाता है। ‘नवचंद्र के दिन’ प्राचीन काल-गणना का संकेत बनाए रखता है।
- source_word: ፍኖተ፡ ዐዘቅተ፡ መሐላ
  choice: शपथ के कुएँ के मार्ग
  rationale: पदबंध का शाब्दिक अर्थ ‘शपथ के कुएँ का मार्ग’ है और यह बेर्शेबा की ओर संकेत करता है। स्थान-नाम से बदलने के बजाय स्रोत की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ሦዐ፡ መሥዋዕተ
  choice: बलि चढ़ाई
  rationale: संज्ञा और क्रिया के स्रोतगत दोहराव को स्वाभाविक आधुनिक हिन्दी में प्रचलित धार्मिक अभिव्यक्ति ‘बलि चढ़ाई’ से व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर का इसहाक से संबंध
  choice: अपने पिता इसहाक के परमेश्वर को
  alternative: अपने पिता के परमेश्वर, इसहाक के परमेश्वर को
  rationale: गीज़ पाठ ‘अपने पिता इसहाक के परमेश्वर’ का सीधा संबंध प्रस्तुत करता है। चुना हुआ रूप इसी संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है, बिना अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्राचीन काल-सूचक ‘नवचंद्र’ तथा स्रोत की स्थल-संज्ञा ‘शपथ का कुआँ’ सुरक्षित हैं; वाक्य-विन्यास हिन्दी की स्वाभाविक पठनीयता के अनुसार विभाजित किया गया है।
