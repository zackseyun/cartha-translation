  yaml_path: translation/extra_canonical/jubilees/044/022.yaml
  text: 'And the sons of Bilhah, Rachel’s servant woman, whom she bore to Jacob: Dan and Naphtali.'
translation:
  language: hi
  text: बिल्हा, जो याकूब की पत्नी राहेल की दासी थी और जिसने याकूब के लिए दान और नप्ताली को जन्म दिया था, के पुत्र दान और नप्ताली थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላእከታ
  choice: दासी
  rationale: यह शब्द अधीनस्थ स्त्री-सेविका की स्थिति बताता है। आधुनिक हिन्दी में ‘दासी’ स्वामित्व और सामाजिक अधीनता का भाव बनाए रखता है, जबकि अत्यधिक व्याख्यात्मक शब्दावली से बचता है।
- source_word: ብእሲቱ፡ ለያዕቆብ
  choice: याकूब की पत्नी राहेल
  rationale: यह संबंधसूचक पद राहेल को याकूब की पत्नी के रूप में पहचानता है; हिन्दी में स्वाभाविक स्पष्टता के लिए इसे नाम के साथ रखा गया है।
- source_word: ዘወለደት፡ ለያዕቆብ
  choice: जिसने याकूब के लिए उन्हें जन्म दिया
  rationale: गीज़ की संबंधवाचक रचना और ‘याकूब के लिए’ का भाव सीधे सुरक्षित रखा गया है; ‘उन्हें’ से दोनों पुत्रों का संदर्भ स्पष्ट होता है।
- source_word: ዳን፡ ወንፍታሌም
  choice: दान और नप्ताली
  rationale: बाइबलीय नामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
