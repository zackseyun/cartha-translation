translation:
  language: hi
  text: और सोलहवें दिन प्रभु उसके सामने प्रकट हुए और उससे कहा, “याकूब, याकूब।” उसने कहा, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ 'ዐሡሩ፡ ወስዱሱ፡
  choice: सोलहवें दिन
  rationale: गीज़ पदबंध का अर्थ ‘सोलहवें (दिन) को’ है; हिन्दी में प्रसंगगत ‘दिन’ जोड़ने से तिथि स्वाभाविक और स्पष्ट होती है।
- source_word: አስተርአዮ፡ እግዚአብሔር
  choice: प्रभु ने उसे दर्शन दिया
  rationale: क्रिया ईश्वरीय प्रकट होने या दिखाई देने को व्यक्त करती है; ‘दर्शन दिया’ आधुनिक धार्मिक हिन्दी में स्वाभाविक है और घटना की दृश्य प्रकृति बनाए रखता है।
- source_word: ነየ፡ አነ፡
  choice: मैं यहाँ हूँ
  rationale: यह बुलावे के प्रति तत्पर उपस्थिति बताने वाला उत्तर है; शब्दशः ‘देख, मैं’ के बजाय हिन्दी का स्वाभाविक समतुल्य चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम እግዚአብሔር का निरूपण
  choice: प्रभु
  alternative: परमेश्वर
  rationale: यहाँ स्रोत का सामान्य प्रभु-संबोधन है; ‘प्रभु’ उसका सीधा, प्रतिष्ठित और संप्रदाय-निरपेक्ष हिन्दी रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोहरे संबोधन को विस्मयादिबोधक चिह्नों से जीवंत किया गया है, पर स्रोत में निहित अर्थ से आगे कोई भाव नहीं जोड़ा गया।
