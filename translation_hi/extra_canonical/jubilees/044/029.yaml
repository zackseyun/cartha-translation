translation:
  language: hi
  text: और आसूदी, इयाक और सुलैमान—ये छह थे। जिस वर्ष वे मिस्र में आए, उसी वर्ष वे मर गए; और दान के लिए शेष रह गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “और दान रह गया।” मूल पाठ का अंतिम वाक्यांश अधूरा प्रतीत होता है और अगले पद में जारी हो सकता है।
    reason: गीइज़ वाक्यांश ወተርፈ፡ ለዳን፡ में दान दत्तिवाचक रूप में है; फिर भी प्रसंग के आधार पर ‘दान रह गया’ का पाठ संभव माना गया है।
lexical_decisions:
