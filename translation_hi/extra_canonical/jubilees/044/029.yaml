  choice: और आसूदी, इयाक और सुलैमान
  rationale: व्यक्तिनामों को गीइज़ पाठ के उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: ሲድስቱ
  choice: ये छः थे
  rationale: संख्या को नामों से संबद्ध रखते हुए संक्षिप्त गीइज़ वाक्य की संरचना और संभावित पूर्ववर्ती सूची-संदर्भ को बनाए रखा गया है।
- source_word: ወሞቱ፡ በዓመተ፡ ቦኡ፡ በግብጽ፡
  choice: जिस वर्ष वे मिस्र में आए, उसी वर्ष वे मर गए
  rationale: काल-संबंध को स्वाभाविक आधुनिक हिन्दी में स्पष्ट किया गया है, बिना अतिरिक्त कारण या परिस्थिति जोड़े।
- source_word: ወተርፈ፡ ለዳን፡
  choice: और दान के लिए रह गया
  rationale: ለዳን के दत्तिवाचक अर्थ ‘दान के लिए/दान को’ को सुरक्षित रखा गया है; दान को क्रिया का कर्ता बनाकर अस्पष्टता को चुपचाप हल नहीं किया गया।
theological_decisions:
- issue: अंतिम खंड में कर्ता और दान की व्याकरणिक भूमिका
  choice: ‘दान के लिए रह गया’ के रूप में अधूरापन और अस्पष्टता बनाए रखी
  alternative: ‘और दान बचा रहा’
  rationale: गीइज़ ለ- दत्तिवाचक/हितवाचक चिह्न है, इसलिए दान को स्पष्ट कर्ता मानना व्याकरण की एक संभावित लेकिन अनिश्चित व्याख्या होगी। यह खंड संभवतः अगले पद में पूरा होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। अंतिम खंड की असामान्य हिन्दी जानबूझकर स्रोत-पाठ की व्याकरणिक अस्पष्टता और संभावित पद-विभाजन को सुरक्षित रखती है।
