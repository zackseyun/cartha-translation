base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/019.yaml
  text: 'And sons were born to Joseph in Egypt before his father came into Egypt, whom Asenath, the daughter of Potiphar, priest of Heliopolis, bore to him: Manasseh and Ephraim—two.'
translation:
  language: hi
  text: 'और यूसुफ के पिता के मिस्र आने से पहले, मिस्र में यूसुफ के पुत्र जन्मे, जिन्हें हेलियोपोलिस के याजक पोतीफेरा की बेटी आसनत ने जन्म दिया: मनश्शे और एप्रैम—दो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኤልዮጶሊስ
  choice: ओन
  rationale: गीज़ में यूनानी नगर-नाम ‘हेलियोपोलिस’ है; आधुनिक हिन्दी पाठक और उत्पत्ति 46:20 की परिचित बाइबलीय परंपरा को ध्यान में रखते हुए उसके सामी नाम ‘ओन’ को मुख्य पाठ में रखा गया, जबकि स्रोत-रूप को पादटिप्पणी में सुरक्षित किया गया।
- source_word: ካህን
  choice: याजक
  rationale: यह धार्मिक पद के लिए स्वाभाविक और प्रतिष्ठित आधुनिक हिन्दी शब्द है; ‘पुरोहित’ भी संभव है, पर बाइबलीय संदर्भ में ‘याजक’ अधिक सुसंगत है।
- source_word: ዘእንበለ፡ ይባእ፡ አቡሁ፡ ውስተ፡ ግብፅ
  choice: यूसुफ के पिता के मिस्र आने से पहले
  rationale: शाब्दिक काल-संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; पिता से आशय याकूब है, पर स्रोत की अभिव्यक्ति ‘उसका पिता’ को बनाए रखा गया है।
