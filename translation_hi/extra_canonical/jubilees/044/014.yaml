  text: 'Zebulun and his sons; and these are the names of his sons: Sered, Elon, and Jahleel—three.'
translation:
  language: hi
  text: 'जबूलून और उसके बेटे; और उसके बेटों के नाम ये हैं: सेरेद, एलोन और यहलेल—तीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘብሎን
  choice: जबूलून
  rationale: व्यक्ति के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ውሉዱ
  choice: उसके बेटे
  rationale: गीज़ पद का स्वाभाविक और सटीक हिन्दी रूप; वंश-सूची का संबंध स्पष्ट रखता है।
- source_word: ሰሌር
  choice: सेरेद
  rationale: नाम को संबंधित प्राचीन वंश-सूची और अंग्रेज़ी परामर्श-पाठ के अनुरूप प्रस्तुत किया गया है; गीज़ रूप में पाठांतर/लिप्यंतरण की संभावना है।
- source_word: ኤሎን
  choice: एलोन
  rationale: नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: ኢያሌአል
  choice: यहलेल
  rationale: नाम का प्रचलित बाइबलीय रूप, जो गीज़ ध्वन्यात्मक रूप के निकट है।
- source_word: ፫
  choice: तीन
  rationale: सूची के अंत में दी गई कुल संख्या को शब्द रूप में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। अर्धविराम और दीर्घ डैश मूल की सूचीबद्ध संरचना तथा अंतिम गणना को स्पष्ट करते हैं।
