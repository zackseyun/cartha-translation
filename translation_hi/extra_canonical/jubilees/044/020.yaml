  text: 'And the sons of Benjamin: Bela, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, and Ard—ten.'
translation:
  language: hi
  text: 'और बिन्यामीन के पुत्र ये थे: बेला, बेकेर, अशबेल, गेरा, नामान, एही, रोश, मुप्पीम, हुप्पीम और अर्द—ग्यारह[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में यहाँ ‘ग्यारह’ है, यद्यपि सूची में दस नाम हैं। कुछ अनुवाद नामों की गिनती के अनुसार ‘दस’ देते हैं।
    reason: मूल पाठ की संख्या और सूची में उपस्थित नामों की संख्या के बीच की वास्तविक पाठगत असंगति बताना।
