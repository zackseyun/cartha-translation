  text: 'And these are the names of the sons of Jacob who went into Egypt with Jacob their father: Reuben, the firstborn of Israel; and these are the names of his sons: Enoch, Pallu, Hezron, and Carmi—four.'
translation:
  language: hi
  text: 'और याकूब के पुत्रों के नाम ये हैं, जो अपने पिता याकूब के साथ मिस्र गए: इस्राएल का पहलौठा रूबेन; और उसके पुत्रों के नाम ये हैं—हनोक, पल्लू, हेस्रोन और कर्मी—कुल चार।'
  philosophy: optimal-equivalence
