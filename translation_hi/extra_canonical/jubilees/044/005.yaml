  text: And he said to him, “I am the God of your fathers, the God of Abraham and Isaac. Do not fear; go down into Egypt, for there I will make you into a great nation.”
translation:
  language: hi
  text: और उसने उससे कहा, “मैं तेरे पूर्वजों का परमेश्वर, अब्राहम और इसहाक का परमेश्वर हूँ। मत डर; मिस्र में उतर जा, क्योंकि वहाँ मैं तुझसे एक महान राष्ट्र बनाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አቡከ
  choice: तुम्हारे पूर्वजों
  rationale: प्राप्त गीइज़ पाठ का आशय बहुवचन ‘तुम्हारे पितरों/पूर्वजों’ है और आगे अब्राहम तथा इसहाक दोनों का उल्लेख इसे स्पष्ट करता है। आधुनिक हिंदी में ‘पूर्वजों’ स्वाभाविक और स्पष्ट है।
- source_word: ኢትፍራህ
  choice: मत डर
  rationale: निषेधात्मक आज्ञा का सीधा, स्वाभाविक हिंदी रूप।
- source_word: ወሪደ፡ ግብጽ
  choice: मिस्र को उतर जा
  rationale: भौगोलिक और पारंपरिक दिशात्मक क्रिया ‘नीचे उतरना’ को बनाए रखा गया है; ‘को’ आधुनिक हिंदी में गंतव्य को स्पष्ट करता है।
- source_word: ዐቢይ፡ ሕዝብ
  choice: एक बड़ी जाति
  rationale: ‘महान/बड़ा जनसमूह या राष्ट्र’ के अर्थ में यहाँ वंश से बनने वाली सामूहिक जाति अभिप्रेत है; ‘बड़ी जाति’ बाइबिलीय संदर्भ में सहज है।
