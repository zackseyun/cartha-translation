  text: 'And the sons of Zilpah[16], Leah’s maidservant, whom she bore to Jacob: Gad and Asher. And these are the names of their sons who came with him into Egypt. The sons of Gad: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, and Areli—seven.'
translation:
  language: hi
  text: 'और जिल्पा के पुत्र—जिल्पा लिया की दासी थी और उसने याकूब के लिए गाद और आशेर को जन्म दिया था—ये थे। उसके पुत्रों के नाम, जो उसके साथ मिस्र गए, ये हैं: गाद के पुत्र सिफ्योन, हाग्गी, शूनी, एस्बोन, एरी, अरोदी और अरेली[a]—कुल सात।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त गीज़ पंक्ति-विभाजन में गाद के पुत्रों की सूची का एक अंश अस्पष्ट है। यहाँ गीज़ पाठ और उत्पत्ति की समानांतर वंशावली में सुरक्षित सबसे सम्भावित क्रम के अनुसार “अरेली” रखा गया है।
    reason: segmentation_note
