  yaml_path: translation/extra_canonical/jubilees/044/008.yaml
  text: And Israel sent Judah before him to his son Joseph, so that he might examine the land of Goshen, because there Joseph had told his brothers to come and dwell, so that they might be near him. And it was the best of the land of Egypt, and near to him, for all of them and for their livestock.
translation:
  language: hi
  text: और इस्राएल ने अपने आगे यहूदा को अपने पुत्र यूसुफ के पास भेजा, ताकि वह गोशेन देश का निरीक्षण[a] करे; क्योंकि यूसुफ ने वहीं अपने भाइयों से आकर बसने को कहा था, जिससे वे उसके निकट रहें। वह मिस्र देश का सबसे अच्छा भाग[b] था और उन सबके तथा उनके पशुओं के लिए यूसुफ के निकट था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तैयार करे’।
    reason: गीज़ क्रिया को इस संदर्भ में भूमि की जाँच/निरीक्षण या आगे की व्यवस्था करने के अर्थ में समझा जा सकता है।
  - marker: b
    text: या ‘वह मिस्र देश में अच्छी थी’।
    reason: गीज़ वाक्यांश का अधिक शाब्दिक पाठ ‘अच्छी’ है, जबकि संदर्भगत और मुहावरेदार अर्थ ‘सबसे अच्छा भाग’ हो सकता है।
lexical_decisions:
- source_word: ያስተዳሉ
  choice: निरीक्षण करे
  rationale: संदर्भ में यह क्रिया गोशेन प्रदेश को पहले से जाकर देखने-जाँचने का भाव देती है; ‘तैयार करे’ भी संभव है, पर स्रोत-समीक्षा के अनुसार ‘निरीक्षण’ प्राथमिक अर्थ को बेहतर व्यक्त करता है।
