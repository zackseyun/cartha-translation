base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/010.yaml
  text: 'Simeon and his sons. These are the names of his sons: Jemuel, Jamin, Ohad, Jachin, Zohar, and Saul, the son of a Canaanite woman—six.'
translation:
  language: hi
  text: 'शिमोन और उसके पुत्र। उसके पुत्रों के नाम ये थे: यमूएल, यामीन, ओहद, याकीन, सोहर[a] और शाऊल, जो एक कनानी स्त्री का पुत्र था—कुल छह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में इस नाम का रूप “सार” है।
    reason: मुख्य पाठ के पारंपरिक नाम-रूप और प्रत्यक्ष गीइज़ पाठ के बीच का वास्तविक पाठगत अंतर पारदर्शी रूप से दिखाना।
lexical_decisions:
- source_word: ስምዖን
  choice: शिमोन
  rationale: इस परिचित बाइबलीय नाम का मानक हिन्दी रूप चुना गया है।
- source_word: ኢያሙኤል፡ ወእያሜን፡ ወአዎት፡ ወአያኪም
  choice: यमूएल, यामीन, ओहद, याकीन
  rationale: गीइज़ नाम-रूपों की ध्वनि और हिन्दी में प्रचलित बाइबलीय वर्तनी, दोनों को ध्यान में रखकर स्वाभाविक देवनागरी रूप दिए गए हैं।
- source_word: ሳአር
  choice: सोहर[a]
  rationale: वंशावली में पहचाने जाने वाले पारंपरिक नाम-रूप को मुख्य पाठ में रखा गया है, जबकि गीइज़ पाठ के प्रत्यक्ष रूप ‘सार’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: ሳውል
