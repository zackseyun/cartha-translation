  text: 'These are the sons of Jacob and their sons, whom Leah bore to Jacob in Mesopotamia: six, and Dinah their sister, one. And all the persons of Leah’s sons and their sons who came with Jacob their father into Egypt were thirty-three; and with Jacob their father among them, they were thirty-four.'
translation:
  language: hi
  text: 'ये याकूब के बेटे और उनके बेटे हैं, जिन्हें लिआ ने मेसोपोटामिया में याकूब के लिए जन्म दिया था: छह बेटे और उनकी एक बहन, दीना। लिआ के बेटों और उनके बेटों में से जितने लोग अपने पिता याकूब के साथ मिस्र गए, वे तैंतीस थे; और उनके बीच उनके पिता याकूब को मिलाकर वे चौंतीस हुए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ያዕቆብ፡ ወውሉዶሙ
  choice: याकूब के बेटे और उनके बेटे
  rationale: वंशावली की दो पीढ़ियों को स्पष्ट रखते हुए स्रोत की पुनरावृत्ति संरक्षित की गई है।
- source_word: ነፍስ
  choice: लोग
  rationale: वंशावली की गणना में गीइज़ शब्द का अर्थ व्यक्ति/जन है; आधुनिक हिन्दी में ‘प्राण’ की अपेक्षा ‘लोग’ स्वाभाविक और स्पष्ट है।
- source_word: መስጴጦምያ
  choice: मेसोपोटामिया
  rationale: स्थाननाम का प्रचलित आधुनिक हिन्दी रूप अपनाया गया है।
- source_word: እኅቶሙ
  choice: उनकी ... बहन
  rationale: 'सर्वनाम का बहुवचन संबंध बनाए रखा गया है: दीना उन छह भाइयों की बहन है।'
