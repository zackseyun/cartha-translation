base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/028.yaml
  text: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob, whom she bore to Jacob: Dan and Naphtali. And these are the names of their children who came with them into Egypt: the sons of Dan: Hushim and Samon.'
translation:
  language: hi
  text: '[और ये याकूब की पत्नी राहेल की दासी बिल्हा के पुत्रों के नाम हैं, जिन्हें उसने याकूब के लिए जन्म दिया: दान और नप्ताली।][a] और उनके उन बच्चों के नाम ये हैं जो उनके साथ मिस्र आए: दान के पुत्र—हूशीम और सामोन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिए शब्द इस पद के खंडित आरंभ को निकटवर्ती वंशावली-संदर्भ के आधार पर पुनर्स्थापित करते हैं; उपलब्ध गीज़ अंश सीधे “राहेल...” से आरंभ होता है।
    reason: source_segmentation
lexical_decisions:
- source_word: ዘወለደት
  choice: उसने ... जन्म दिया
  rationale: स्त्रीलिंग कर्तृवाच्य क्रिया को बनाए रखा गया है; इसका कर्ता संदर्भ से पुनर्स्थापित ‘बिल्हा’ है, राहेल नहीं।
- source_word: እለ፡ ቦኡ፡ ምስሌሆሙ፡ ውስተ፡ ግብጽ
  choice: जो ... उनके साथ मिस्र आए
  rationale: गीज़ के संबंधवाचक वाक्यांश और ‘उनके साथ’ के बहुवचन संबंध को सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: ሑሲም
  choice: हूशीम
  rationale: व्यक्तिनाम का स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: ሳሞን
  choice: सामोन
  rationale: गीज़ पाठ में दिए गए व्यक्तिनाम का प्रत्यक्ष देवनागरी लिप्यंतरण।
theological_decisions:
- issue: दान और नप्ताली की माता की पहचान
  choice: खंडित आरंभ को पुनर्स्थापित करके बिल्हा को स्त्रीलिंग क्रिया का कर्ता माना गया
  alternative: वाक्य को कर्मवाच्य बनाकर दान और नप्ताली को राहेल से उत्पन्न बताना
  rationale: उपलब्ध गीज़ अंश का आरंभ खंड-विभाजन में छूट गया है, पर ዘወለደት स्त्रीलिंग कर्तृवाच्य है और निकटवर्ती वंशावली-संदर्भ बिल्हा को कर्ता ठहराता है। इससे राहेल को जैविक माता बताने की त्रुटि से बचा जाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वंशावली की सूचीगत शैली बनाए रखने के लिए दूसरे वाक्य में दीर्घ विराम का प्रयोग किया गया है।
