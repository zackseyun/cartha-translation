translation:
  language: hi
  text: और याकूब गया और मिग्दल-एदेर के दक्षिण में डेरा डाला। फिर वह अपने पिता के पास गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረ
  choice: और ... गया / फिर ... गया
  rationale: गीज़ क्रिया का सीधा अर्थ ‘गया’ है। दूसरी घटना के क्रम को स्वाभाविक हिन्दी में व्यक्त करने के लिए दूसरे प्रयोग में ‘फिर’ रखा गया है।
- source_word: ወኀደረ
  choice: और ... डेरा डाला
  rationale: इस प्रसंग में ठहरने या रात बिताने की क्रिया को यात्रा-वर्णन की स्वाभाविक हिन्दी ‘डेरा डाला’ से व्यक्त किया गया है।
- source_word: መንገለ ፡ ደቡብ
  choice: के दक्षिण में
  rationale: दिशासूचक पद का अर्थ ‘दक्षिण की ओर/दक्षिण में’ है; स्थान-संबंध के इस वाक्य में ‘के दक्षिण में’ स्पष्ट और स्वाभाविक है।
- source_word: መግደላደራፋፍ
  choice: मिग्दल-एदेर
  rationale: स्थान-नाम का अनुवाद करने के बजाय परिचित बाइबलीय रूप में लिप्यंतरण किया गया है।
- source_word: ኀበ ፡ አቡሁ
  choice: अपने पिता के पास
  rationale: पूर्वसर्ग और संबंधसूचक रूप का सीधा अर्थ सुरक्षित रखा गया है।
