translation:
  language: hi
  text: इसहाक—वह और उसकी पत्नी लिआ—नौवें महीने के नए चाँद के दिन। और रूबेन ने बिल्हा को देखा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቁ ፡ ለወርኀ ፡ ፱
  choice: नौवें महीने की अमावस्या के दिन
  rationale: गीज़ पदबंध महीने के आरम्भ अथवा नवचंद्र को सूचित करता है; सामान्य आधुनिक हिन्दी में बोधगम्य और यहूदी मासारम्भ के निकटतम पद ‘अमावस्या’ है।
- source_word: ሮቤን
  choice: रूबेन
  rationale: बाइबलीय व्यक्तिगत नाम का प्रचलित हिन्दी रूप।
- source_word: ባላንን
  choice: बिल्हा को
  rationale: यह बिल्हा नाम का कर्मरूप है; हिन्दी में कर्मचिह्न ‘को’ लगाया गया है।
- source_word: ብእሲቱ
  choice: उसकी पत्नी
  rationale: शाब्दिक अर्थ ‘उसकी स्त्री/पत्नी’; वर्तमान सन्दर्भ में स्वाभाविक और सम्मानजनक हिन्दी ‘उसकी पत्नी’ है।
theological_decisions:
- issue: खंड में ‘इसहाक—वह और उसकी पत्नी लिआ’ का असामान्य संबंध
  choice: मूल पाठ की वाक्यगत अपूर्णता और संबंधगत तनाव को बनाए रखा गया
  alternative: लिआ को याकूब की पत्नी बताकर अथवा कोई छूटा हुआ क्रियापद जोड़कर पाठ को सुधारा जा सकता था
  rationale: दिए गए गीज़ स्रोत में इसी स्थान पर इसहाक और लिआ आते हैं; उपलब्ध खंड से किसी कथित लोप या पाठ-सुधार को निश्चित करना सम्भव नहीं, इसलिए अनुवाद ने उसे चुपचाप ठीक नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सरल और गरिमापूर्ण रखी गई है। डैश मूल खंड की असामान्य, सम्भवतः पिछले वाक्य से जुड़ी संरचना को बिना अतिरिक्त सामग्री जोड़े स्पष्ट करते हैं। अंतिम अल्पविराम इसलिए रखा गया है कि स्रोत और अंग्रेज़ी परामर्श-पाठ दोनों यहीं अधूरा वाक्य छोड़ते हैं।
