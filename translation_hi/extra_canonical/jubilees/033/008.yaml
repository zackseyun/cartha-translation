translation:
  language: hi
  text: और याकूब रूबेन पर बहुत क्रोधित हुआ, क्योंकि वह बिल्हा के साथ सोया था; क्योंकि उसने अपने पिता का आवरण[a] खोल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘आवरण’ या ‘वस्त्र’। ‘पिता का आवरण खोलना’ पिता की स्त्री के साथ संबंध बनाकर उसके अधिकार का उल्लंघन करने का मुहावरेदार संकेत है।
    reason: मूल शब्द के वस्त्र-संबंधी अर्थ को स्पष्ट करने और मुहावरे के संकेत को बताए बिना ‘पलंग’ अर्थ आरोपित किए सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ተምዐ ፡ ጥቀ
  choice: बहुत क्रोधित हुआ
  rationale: क्रोध की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሰከበ ፡ ምስለ
  choice: के साथ सोया था
  rationale: मूल क्रिया का सीधा लैंगिक मुहावरा बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ክዳነ
  choice: ओढ़ना
  rationale: गीज़ शब्द का अर्थ आवरण या वस्त्र है, न कि पलंग। ‘ओढ़ना’ पिता से संबंधित उस आवरण-वाले मुहावरे और व्यवस्थाविवरण-सदृश अंतर्पाठ को हिन्दी में यथासंभव सुरक्षित रखता है।
- source_word: ከሠተ
  choice: उघाड़ दिया था
  rationale: मूल के ‘खोलना/अनावृत करना’ भाव को इस मुहावरे के लिए स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ‘पिता का ओढ़ना उघाड़ना’ मुहावरे का अर्थ
  choice: मुहावरे को मुख्य पाठ में बनाए रखा और टिप्पणी में उसके लैंगिक उल्लंघन-संबंधी संकेत को स्पष्ट किया
  alternative: अर्थ खोलकर ‘उसने अपने पिता के वैवाहिक अधिकार का उल्लंघन किया’ लिखना
  rationale: मूल की ठोस भाषा, अंतर्पाठ और कुछ व्याख्यात्मक तनाव को सुरक्षित रखना बेहतर है; स्पष्ट व्याख्या मुख्य पाठ में थोपना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल में ‘क्योंकि’ की पुनरावृत्ति है; उसे बनाए रखा गया है ताकि दूसरे उपवाक्य की व्याख्यात्मक और मुहावरेदार शक्ति न मिटे।
