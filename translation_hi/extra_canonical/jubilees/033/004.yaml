  text: in her house. And he lay with her, and she awoke and saw him, and behold, Reuben was lying with her in the bed. And she uncovered the edge of her covering and seized him and cried out, and she recognized that it was Reuben.
translation:
  language: hi
  text: उसके घर में। फिर वह उसके साथ सोया। वह जाग उठी और उसने उसे देखा—रूबेन उसके साथ बिस्तर पर लेटा हुआ था। तब उसने अपने ओढ़ने का किनारा हटाया, उसे पकड़ लिया और चिल्लाई; और उसने पहचान लिया कि वह रूबेन था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰከበ ፡ ምስሌሃ
  choice: फिर वह उसके साथ सोया
  rationale: मूल अभिव्यक्ति का अर्थ शाब्दिक रूप से ‘उसके साथ लेटा/सोया’ है और संदर्भ में यौन आशय रखता है। हिंदी का यह रूप मूल की मर्यादित अभिव्यक्ति और निहितार्थ, दोनों बनाए रखता है।
- source_word: ወርእየቶ
  choice: और उसने उसे देखा
  rationale: क्रिया में तीसरे पुरुष एकवचन पुल्लिंग कर्म-प्रत्यय है; इसलिए ‘उसे’ को स्पष्ट रखा गया है।
- source_word: ውስተ ፡ ምስካብ
  choice: बिस्तर पर
  rationale: यह स्थानसूचक पद शय्या या बिस्तर के भीतर/पर होने को बताता है; स्वाभाविक आधुनिक हिंदी में ‘बिस्तर पर’ उपयुक्त है।
- source_word: ወከሠተት ፡ ክንፋ
  choice: उसने अपने ओढ़ने का किनारा हटाया
  rationale: ‘पंख/किनारा खोलना’ रूपकात्मक वाक्यांश है; संदर्भ में ओढ़ने या ढकने वाले वस्त्र का किनारा हटाना अभिप्रेत है।
- source_word: ወአእመረቶ
  choice: उसने पहचान लिया
  rationale: यहाँ क्रिया केवल सामान्य ज्ञान नहीं, सामने उपस्थित व्यक्ति की पहचान करने का भाव देती है।
theological_decisions:
- issue: ‘उसके साथ सोया’ में यौन आशय को कितना स्पष्ट किया जाए
  choice: मूल की मर्यादित और कुछ हद तक परोक्ष अभिव्यक्ति बनाए रखी गई
  alternative: ‘उससे सहवास किया’
  rationale: स्रोत का वाक्यांश ‘साथ लेटना/सोना’ कहता है। अधिक स्पष्ट विकल्प संदर्भगत अर्थ तो व्यक्त करता, पर स्रोत की अभिव्यक्ति को अनावश्यक रूप से निर्णायक बना देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। आरंभ का खंड ‘उसके घर में।’ स्रोत की पद-विभाजन स्थिति के अनुसार ज्यों का त्यों रखा गया है, यद्यपि वह पिछले पद से वाक्यगत रूप से जुड़ सकता है।
