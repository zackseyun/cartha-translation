  text: And Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father's covering—his deed is very evil,
translation:
  language: hi
  text: और याकूब फिर उसके पास नहीं गया, क्योंकि रूबेन ने उसे अशुद्ध कर दिया था। और जो कोई अपने पिता का आवरण खोलता है—उसका यह काम बहुत बुरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አቀረበ
  choice: पास गया
  rationale: क्रिया का मूल भाव निकट जाने का है; प्रसंग में यह स्त्री के साथ दाम्पत्य/यौन संबंध के लिए शिष्ट और स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: አርኩሳ
  choice: अशुद्ध कर दिया था
  rationale: यह रूप अपवित्र या अशुद्ध करने का भाव देता है। 'अशुद्ध' मूल धार्मिक-नैतिक अर्थ को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ኵሉ ሰብእ
  choice: जो कोई
  rationale: शाब्दिक 'हर मनुष्य जो' की अपेक्षा सार्वभौमिक कथन के लिए आधुनिक हिंदी में अधिक स्वाभाविक है।
- source_word: ይከሥት
  choice: खोलता है
  rationale: क्रिया का प्रत्यक्ष अर्थ खोलना या उघाड़ना है; स्रोत के रूपक को बनाए रखने के लिए इसे स्पष्ट यौन पदावली में नहीं बदला गया।
- source_word: ክዳነ
  choice: आवरण
  rationale: शब्द वस्त्र/ढकने वाली चीज़ या आवरण का संकेत करता है। 'आवरण' स्रोत की जानबूझकर रखी गई देह-संबंधी उपमा को सुरक्षित रखता है।
theological_decisions:
- issue: ‘पिता का आवरण खोलना’ मुहावरे का अर्थ
  choice: मुहावरे को ‘अपने पिता का आवरण खोलता है’ के रूप में बनाए रखा
  alternative: ‘अपने पिता की पत्नी के साथ संबंध रखता है’
  rationale: स्पष्ट विकल्प संभावित आशय बताता है, पर स्रोत की रूपकात्मक और कुछ हद तक अस्पष्ट अभिव्यक्ति को समाप्त कर देता। अनुवाद ने उस तनाव को सुरक्षित रखा है।
- issue: रूबेन द्वारा स्त्री को अशुद्ध करने का वर्णन
  choice: ‘उसे अशुद्ध कर दिया था’
  alternative: ‘उसके साथ व्यभिचार किया था’ या ‘उसका अपमान किया था’
  rationale: वैकल्पिक वाक्यांश घटना की व्याख्या बढ़ाते या नैतिक श्रेणी को विशेष बनाते हैं; स्रोत में प्रयुक्त अशुद्ध करने की भाषा अधिक सीधे रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उसके पास गया’ शिष्ट बाइबिलीय प्रयोग है, जबकि ‘आवरण खोलता है’ मूल मुहावरे की वास्तविक अस्पष्टता को सुरक्षित रखता है। पद के अंतिम कथन को उपलब्ध स्रोत-पाठ और परामर्श-पाठ के अनुसार पूर्ण वाक्य के रूप में प्रस्तुत किया गया है।
