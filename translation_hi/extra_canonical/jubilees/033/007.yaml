  yaml_path: translation/extra_canonical/jubilees/033/007.yaml
  text: “I am not pure for you, because I have been defiled apart from you; for Reuben has defiled me and lay with me at night while I was asleep, and I did not know until he uncovered my skirt and lay with me.”
translation:
  language: hi
  text: “मैं तुम्हारे लिए शुद्ध नहीं हूँ, क्योंकि तुमसे अलग मुझे अशुद्ध किया गया है[a]; क्योंकि रूबेन ने मुझे अशुद्ध किया और रात में, जब मैं सो रही थी, मेरे साथ लेटा। मुझे तब तक पता नहीं चला, जब तक उसने मेरे वस्त्र का किनारा खोलकर मेरे साथ नहीं लेटा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुमसे अलग” का अनुवाद “तुमसे दूर” या, प्रसंगानुसार, “तुम्हारे सिवा किसी और के द्वारा” भी किया जा सकता है।
    reason: गीज़ वाक्यांश संबंध-विच्छेद, दूरी, अथवा पति के अतिरिक्त किसी और के द्वारा अशुद्ध किए जाने का भाव दे सकता है; मुख्य पाठ में इस अस्पष्टता को पूरी तरह समाप्त नहीं किया गया है।
lexical_decisions:
- source_word: ንጽሕተ
  choice: शुद्ध
  rationale: यह शब्द शारीरिक/अनुष्ठानिक शुद्धता का भाव रखता है; ‘शुद्ध’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल अर्थ और प्रसंग की गंभीरता बनाए रखता है।
- source_word: ተገመዝኩ / አርኩሰኒ
  choice: मुझे अशुद्ध किया गया है / मुझे अशुद्ध किया
  rationale: दोनों रूप अपवित्र या दूषित किए जाने का भाव व्यक्त करते हैं। समान हिन्दी शब्दावली से मूल की पुनरावृत्ति सुरक्षित रहती है और वक्ता पर हुई क्रिया स्पष्ट होती है।
- source_word: ወሰከበ ምስሌየ
  choice: मेरे साथ सोया / मेरे साथ शयन किया
  rationale: मूल का शाब्दिक यौन-विनम्र प्रयोग बनाए रखा गया है। अंतिम पुनरावृत्ति में ‘शयन किया’ वाक्य को गरिमामय और स्पष्ट बनाता है, बिना अर्थ को अधिक खुला करके जोड़ने के।
- source_word: ክነፍየ
  choice: मेरे वस्त्र का छोर
  rationale: शाब्दिक अर्थ ‘मेरा पंख’ है, पर वस्त्र के संदर्भ में इसका अर्थ किनारा, पल्ला या छोर है। ‘वस्त्र का छोर’ आधुनिक पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: ከሠተ
  choice: हटाकर
  rationale: क्रिया खोलने या अनावृत करने का अर्थ देती है। वस्त्र के छोर के साथ ‘हटाकर’ स्वाभाविक हिन्दी है और घटना को अनावश्यक रूप से विस्तार नहीं देती।
theological_decisions:
- issue: ‘तुमसे अलग’ वाक्यांश का संबंध और आशय
  choice: तुमसे अलग मुझे अशुद्ध किया गया है
  alternative: तुम्हारे सिवा किसी और ने मुझे अशुद्ध किया है
  rationale: मूल እምኔከ का शाब्दिक संबंध ‘तुमसे/तुमसे अलग’ है। चुना हुआ अनुवाद वैवाहिक निष्ठा और दूरी से जुड़े संभावित अर्थ को बनाए रखता है, जबकि विकल्प मूल में स्पष्ट रूप से न आए ‘किसी और ने’ को जोड़कर अर्थ को अधिक निश्चित कर देता।
- issue: रूबेन के कृत्य का वर्णन
  choice: मूल के ‘अशुद्ध किया’ और ‘साथ सोया’ को बनाए रखना
  alternative: स्पष्ट आधुनिक कानूनी या नैतिक शब्दावली से कृत्य का वर्गीकरण करना
  rationale: वक्ता के सोए होने और अनजान रहने की बात मूल में स्पष्ट है, पर पद स्वयं किसी आधुनिक कानूनी संज्ञा का प्रयोग नहीं करता। अनुवाद घटना की गंभीरता छिपाए बिना मूल की अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और साधारण पाठक के लिए बोधगम्य रखी गई है। यौन घटना के लिए मूल की संयत अभिव्यक्ति सुरक्षित है। स्त्री वक्ता के कारण ‘रही’ और ‘सो रही थी’ प्रयुक्त हुए हैं।
