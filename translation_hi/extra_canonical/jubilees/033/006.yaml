  source_fidelity: 'हिन्दी पाठ गीज़ वाक्य के मुख्य संबंधों को सही रखता है: स्त्री पात्र ने किसी को नहीं बताया; याकूब आया और उसी स्त्री को ढूँढ़ा; फिर स्त्री ने याकूब से कहा। विशेषतः ‘उसे ढूँढ़ने लगा’ में पुल्लिंग क्रिया याकूब को कर्ता बनाती है, जो अद्यतन स्रोत-आधारित अंग्रेज़ी audit trail के ‘he sought her’ से संगत है। आरंभिक ፈድፋደ को अध्याय-विभाजन से जुड़ा अवशेष मानकर मुख्य पाठ में न रखना दिए गए source-context और अंग्रेज़ी audit trail के अनुरूप है।'
