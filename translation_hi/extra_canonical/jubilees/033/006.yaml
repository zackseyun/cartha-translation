  text: और उसने किसी को नहीं बताया। जब याकूब आया और उसे ढूँढ़ने लगा, तब उसने उससे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአነገረት ፡ ወኢለመኑሂ ፡ ሰብአ
  choice: और उसने किसी को नहीं बताया
  rationale: स्त्रीलिंग कर्ता को बनाए रखते हुए निषेध और ‘किसी मनुष्य को नहीं’ का स्वाभाविक आधुनिक हिन्दी रूप दिया गया है; स्रोत में स्पष्ट कर्म न होने के कारण ‘यह बात’ नहीं जोड़ा गया।
- source_word: ወሶበ ፡ መጽአ ፡ ያዕቆብ
  choice: जब याकूब आया
  rationale: कालवाचक उपवाक्य और व्यक्तिनाम का सीधा, स्वाभाविक रूप।
- source_word: ወኀሠሣ
  choice: और उसे ढूँढ़ने लगा
  rationale: क्रिया पुल्लिंग एकवचन है और उसके साथ स्त्रीलिंग कर्म-प्रत्यय है; अतः याकूब कर्ता और स्त्री पात्र कर्म है। प्रसंग में हिन्दी का ‘ढूँढ़ने लगा’ साधारण ‘ढूँढ़ा’ से अधिक स्वाभाविक है।
- source_word: ትቤሎ
  choice: तब उसने उससे कहा
  rationale: स्त्रीलिंग कर्ता तथा पुल्लिंग अप्रत्यक्ष कर्म को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ወኀሠሣ में कर्ता और कर्म की पहचान
  choice: याकूब ने उसे ढूँढ़ा
  alternative: उसने याकूब को ढूँढ़ा
  rationale: गीज़ रूप में क्रिया तीसरे पुरुष पुल्लिंग एकवचन है और स्त्रीलिंग कर्म-प्रत्यय लगा है; इसलिए वैकल्पिक पाठ व्याकरणसम्मत नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज कथात्मक हिन्दी। आरंभिक ፈድፋደ (‘बहुत/अत्यन्त’) इस अंश में स्वतंत्र वाक्यांश नहीं बनाता और अध्याय-विभाजन में पिछले कथन से जुड़ा अवशेष प्रतीत होता है; इसलिए अंग्रेज़ी परामर्श-पाठ के समान इसे इस पद के हिन्दी मुख्य पाठ में नहीं रखा गया।
