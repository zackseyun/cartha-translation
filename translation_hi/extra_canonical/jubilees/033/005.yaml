lexical_decisions:
- source_word: ተኀፍረት
  choice: लज्जित हुई
  rationale: क्रिया का अर्थ लज्जित या शर्मिंदा होना है; आधुनिक गरिमापूर्ण हिन्दी में ‘लज्जित हुई’ उपयुक्त है।
- source_word: እምኔሁ
  choice: उसके सामने
  rationale: पूर्वसर्गीय रूप को प्रसंगानुसार ‘उसके सामने’ रखा गया है; इसे कारणवाचक ‘उसके कारण’ बनाकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ኀደገት እዴሃ እምላዕሌሁ
  choice: उसने उसके ऊपर से अपना हाथ हटा लिया
  rationale: शाब्दिक स्थानिक संबंध ‘उसके ऊपर से’ को बनाए रखते हुए क्रिया को स्वाभाविक हिन्दी में ‘हटा लिया’ कहा गया है।
- source_word: ጐየ
  choice: भाग गया
  rationale: क्रिया पलायन या तेजी से चले जाने को व्यक्त करती है; ‘भाग गया’ सीधा और स्वाभाविक अनुवाद है।
- source_word: ትላሑ
  choice: विलाप करने लगी
  rationale: यह शोकपूर्ण विलाप को दर्शाता है; हिन्दी में आरंभसूचक रूप वाक्य-प्रवाह और स्त्रीलिंग कर्ता को स्पष्ट करता है।
- source_word: በእንተዝ ነገር
  choice: इस बात पर
  rationale: वाक्यांश का अर्थ ‘इस बात/मामले के कारण या विषय में’ है; ‘इस बात पर’ हिन्दी में स्वाभाविक रहते हुए संबंध की व्यापकता बनाए रखता है।
