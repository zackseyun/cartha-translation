  text: 'उसका यह काम अत्यन्त बुरा है, क्योंकि वह प्रभु के सामने घृणित है। इसलिए स्वर्गीय पट्टिकाओं पर यह लिखा और ठहराया गया है कि कोई पुरुष अपने पिता की पत्नी के साथ न सोए और अपने पिता का आवरण न उघाड़े[a], क्योंकि यह अशुद्ध है। दोनों निश्चय ही मार डाले जाएँ—वह पुरुष जो अपने पिता की पत्नी के साथ सोता है, और वह स्त्री भी—क्योंकि उन्होंने पृथ्वी पर अशुद्ध काम किया है। और हमारे परमेश्वर के सामने उस प्रजा के बीच, जिसे उसने अपने लिए राज्य होने को चुना है, कोई अशुद्धता न हो। फिर दूसरी बार यह लिखा है, “शापित हो वह जो अपने पिता की पत्नी के साथ सोता है, क्योंकि उसने अपने पिता की लज्जा उघाड़ी है।” और प्रभु के सभी पवित्र जन कहें, “ऐसा ही हो! ऐसा ही हो!”


    और हे मूसा, इस्राएल की सन्तान को आज्ञा दे कि वे इस वचन का पालन करें, क्योंकि यह मृत्युदंड-योग्य अपराध है और अशुद्ध है। ऐसा करनेवाले पुरुष के लिए सदा तक प्रायश्चित करने का कोई उपाय नहीं है, सिवाय इसके कि उसे मृत्युदंड देकर मार डाला जाए, पत्थरवाह किया जाए और हमारे परमेश्वर की प्रजा के बीच से उखाड़ फेंका जाए। क्योंकि इस्राएल में ऐसा करनेवाला कोई भी पुरुष पृथ्वी पर एक दिन भी जीवित न रहने पाए; वह घृणित और अशुद्ध है। वे यह न कहें, “रूबेन को जीवित रहने दिया गया और उसे क्षमा मिली, यद्यपि वह अपने पिता की रखैल के साथ सोया था; और वह स्त्री भी विवाहित थी, और उसके पिता याकूब तब जीवित थे।” क्योंकि उस समय तक विधि, न्याय और व्यवस्था सबके लिए पूरी तरह प्रकट नहीं किए गए थे; परन्तु तुम्हारे दिनों में यह युगों और दिनों की व्यवस्था तथा पीढ़ी-दर-पीढ़ी बनी रहनेवाली सनातन व्यवस्था है। इस व्यवस्था की अवधि कभी समाप्त नहीं होगी और इस अपराध की क्षमा नहीं है। उन दोनों को प्रजा के बीच से उखाड़ फेंका जाए; जिस दिन वे ऐसा करें, उसी दिन उन्हें मार डाला जाए।


    और हे मूसा, इसे इस्राएल के लिए लिख दे, ताकि वे इसका पालन करें, ऐसा काम न करें और मृत्युदंड-योग्य पाप न करें। क्योंकि हमारा परमेश्वर प्रभु न्यायी है; वह पक्षपात नहीं करता और घूस नहीं लेता। उन्हें इस विधि का वचन बता, ताकि वे सुनें, सावधान रहें, अपने को सँभालकर रखें और नष्ट होकर देश में से उखाड़े न जाएँ। क्योंकि पृथ्वी पर ऐसा करनेवाले सभी लोग हमारे परमेश्वर के सामने अशुद्ध, मलिन, कलुषित और दूषित हैं। पृथ्वी पर की जानेवाली यौन-अनैतिकता से बढ़कर कोई पाप नहीं है। इस्राएल अपने परमेश्वर प्रभु के लिए पवित्र प्रजा, उसकी विरासत की प्रजा, याजकीय प्रजा, राजकीय प्रजा और उसके द्वारा रोपी हुई प्रजा[b] है; इसलिए पवित्र प्रजा के बीच ऐसी अशुद्धता दिखाई न दे।


    इस सप्ताह के तीसरे वर्ष में याकूब और उसके सभी पुत्र गए और उसके पिता इसहाक तथा उसकी माता रिबका के पास, अब्राहम के घर में रहने लगे। याकूब की सन्तानों के नाम ये हैं: पहलौठा रूबेन; शिमोन; लेवी; यहूदा; इस्साकार और जबूलून—ये लिआ के पुत्र थे। राहेल के पुत्र यूसुफ और बिन्यामीन थे; बिल्हा के पुत्र दान और नप्ताली; और जिल्पा के पुत्र गाद और आशेर थे। दीना लिआ की इकलौती बेटी और याकूब की बेटी थी। वे जाकर इसहाक और रिबका के सामने झुके। जब इसहाक और रिबका ने उन्हें देखा, तो उन्होंने याकूब और उसके सभी पुत्रों को आशीर्वाद दिया। इसहाक बहुत आनन्दित हुआ, क्योंकि उसने अपने छोटे पुत्र याकूब के पुत्रों को देखा; और उसने उन्हें आशीर्वाद दिया।'
