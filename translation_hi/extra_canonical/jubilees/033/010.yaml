  to: 'उसका यह काम अत्यन्त बुरा है, क्योंकि वह प्रभु के सामने घृणित है। इसलिए स्वर्गीय पट्टिकाओं पर यह लिखा और ठहराया गया है कि कोई पुरुष अपने पिता की पत्नी के साथ न सोए और अपने पिता का आवरण न उघाड़े[a], क्योंकि यह अशुद्ध है। दोनों निश्चय ही मार डाले जाएँ—वह पुरुष जो अपने पिता की पत्नी के साथ सोता है, और वह स्त्री भी—क्योंकि उन्होंने पृथ्वी पर अशुद्ध काम किया है। और हमारे परमेश्वर के सामने उस प्रजा के बीच, जिसे उसने अपने लिए राज्य होने को चुना है, कोई अशुद्धता न हो। फिर दूसरी बार यह लिखा है, “शापित हो वह जो अपने पिता की पत्नी के साथ सोता है, क्योंकि उसने अपने पिता की लज्जा उघाड़ी है।” और प्रभु के सभी पवित्र जन कहें, “ऐसा ही हो! ऐसा ही हो!”


