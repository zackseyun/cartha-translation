  yaml_path: translation/extra_canonical/jubilees/033/003.yaml
  text: the maidservant of Rachel, the concubine of his father, bathing in water in a secluded place, and he loved her. And he hid himself, and at night he entered the house of Bilhah and found her sleeping alone in her bed.
translation:
  language: hi
  text: राहेल की दासी को, जो उसके पिता की उपपत्नी थी, एकांत स्थान में पानी से नहाते देखकर वह उससे प्रेम करने लगा। फिर वह छिप गया और रात को बिल्हा के घर में प्रवेश किया[a]। उसने उसे अपने बिस्तर पर अकेली सोती हुई पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ संस्करण में ‘बिल्हा के घर’ के बाद कोष्ठकों में ‘रात’ शब्द फिर से दिया गया है।
    reason: मूल संस्करण में कोष्ठकबद्ध ሌሊተ पाठगत पुनरावृत्ति है; मुख्य पाठ में अनावश्यक दुहराव नहीं रखा गया है।
lexical_decisions:
- source_word: ለአኪተ ፡ ራሔል
  choice: राहेल की दासी
  rationale: गीज़ पदबंध स्पष्ट रूप से राहेल की दासी को सूचित करता है; यह बिल्हा है, स्वयं राहेल नहीं।
- source_word: ዐቅብተ ፡ አቡሁ
  choice: जो उसके पिता की उपपत्नी थी
  rationale: संबंधवाचक रूप हिंदी में पूर्ववर्ती ‘दासी’ के साथ स्वाभाविक apposition देता है और ‘उसके पिता’ को बनाए रखता है।
- source_word: በማይ ፡ በኅቡእ
  choice: एकांत स्थान में पानी से नहाते
  rationale: ‘पानी में/से’ और गुप्त अथवा ओझल स्थान—दोनों अर्थ-तत्वों को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ወአፍቀራ
  choice: वह उससे प्रेम करने लगा
  rationale: मूल क्रिया ‘प्रेम करना’ को उसके कथात्मक और कामुक तनाव सहित रखा गया है; इसे अधिक स्पष्ट ‘वासना करना’ बनाकर अर्थ को संकीर्ण नहीं किया।
- source_word: ተኀቢኦ
  choice: वह छिप गया
  rationale: मूल के आत्मवाचक अर्थ का सीधा और स्वाभाविक अनुवाद।
- source_word: ቤተ ፡ ባላን
  choice: बिल्हा के घर
  rationale: व्यक्तिनाम को प्रचलित बाइबलीय हिंदी रूप ‘बिल्हा’ में दिया गया है और ‘घर’ को स्पष्ट रखा गया है।
- source_word: ውስተ ፡ ዐራታ ፡ ባሕቲታ
  choice: अपने बिस्तर पर अकेली
  rationale: गीज़ वाक्यांश का आशय उसके अपने बिस्तर में/पर अकेली होना है; यहाँ अंत में ‘अपने घर में’ जोड़ने का स्रोतगत आधार नहीं है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। आरंभिक गीज़ खंड पिछले प्रसंग से व्याकरणिक रूप से जुड़ा प्रतीत होता है; हिंदी में अर्थ स्पष्ट करने के लिए ‘देखकर’ जोड़ा गया है। ‘उपपत्नी’ ने संबंध को बिना सांप्रदायिक या नैतिक व्याख्या जोड़े व्यक्त किया है।
