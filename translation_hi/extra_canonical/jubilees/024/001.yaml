base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/001.yaml
  text: And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision[a] in the first year of the third week of this jubilee.
translation:
  language: hi
  text: अब्राहम की मृत्यु के बाद ऐसा हुआ कि यहोवा ने उसके पुत्र इसहाक को आशीष दी। तब इसहाक हेब्रोन से चला और दर्शन के कुएँ[a] पर जाकर वहीं रहने लगा। यह इस जुबली के तीसरे सप्ताह के पहले वर्ष में हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दर्शन का कुआँ’ गीज़ स्थान-नाम का शाब्दिक अनुवाद है। संभवतः यह उत्पत्ति में ज्ञात उसी स्थान से संबंधित है, पर उसका विस्तृत पारंपरिक नाम मुख्य पाठ में नहीं जोड़ा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यह पद परमेश्वर के विशिष्ट नाम के लिए प्रचलित गीइज़ दैवी पद का प्रयोग करता है; संदर्भ और हिन्दी बाइबलीय परंपरा के अनुरूप ‘यहोवा’ चुना गया।
- source_word: ዐዘቅተ፡ ራእይ
  choice: दर्शन का कुआँ
  rationale: गीइज़ पदबंध का शाब्दिक अर्थ सुरक्षित रखा गया है और उत्पत्ति में मिलने वाले स्थान-नाम का विस्तृत पारंपरिक रूप मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: जुबली की काल-गणना में यह सात वर्षों के समूह को सूचित करता है; परिचित पद ‘सप्ताह’ मूल की संरचना बनाए रखता है।
- source_word: ኀደረ
  choice: रहने लगा
  rationale: क्रिया का अर्थ ठहरना या निवास करना है; प्रसंग में स्वाभाविक आधुनिक हिन्दी के लिए ‘वहीं रहने लगा’ चुना गया।
theological_decisions:
- issue: आशीष देने वाले के दैवी नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु / परमेश्वर
  rationale: ‘यहोवा’ विशिष्ट दैवी नाम का संकेत स्पष्ट रखता है और इसे केवल सामान्य उपाधि में नहीं बदलता।
- issue: ‘वह उठा’ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘इसहाक’ स्पष्ट किया गया
  alternative: ‘वह’ बनाए रखना
  rationale: व्याकरण और घटनाक्रम में कर्ता इसहाक है; नाम दोहराने से हिन्दी में क्षणिक भ्रम दूर होता है, बिना कथ्य बदले।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक कथात्मक सूत्र ‘ऐसा हुआ’ और जुबली की काल-गणना दोनों संरक्षित हैं; अत्यधिक शाब्दिक वाक्य-विन्यास को स्वाभाविक हिन्दी में विभाजित किया गया है।
