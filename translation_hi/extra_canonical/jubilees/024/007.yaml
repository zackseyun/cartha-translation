translation:
  language: hi
  text: और याकूब बड़ा हुआ और उसने अपने पिता की आज्ञा मानी, परन्तु एसाव ने उसे ठुकरा दिया। तब देश में अकाल पड़ा, और वह आया—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध मूल-पाठ का अंश अधूरे वाक्य पर समाप्त होता है।
    reason: स्रोत-अंश ‘और वह आया’ पर रुकता है; पाठक को यह बताना आवश्यक है कि अपूर्णता अनुवाद की त्रुटि नहीं है।
lexical_decisions:
- source_word: አህቀ
  choice: बड़ा हुआ
  rationale: यह क्रिया आयु और परिपक्वता में बढ़ने को व्यक्त करती है; इसलिए पद या सामर्थ्य में ‘महान होने’ के बजाय स्वाभाविक हिन्दी ‘बड़ा हुआ’ चुना गया।
- source_word: ኀለወ
  choice: मानी
  rationale: मूल क्रिया का अर्थ आज्ञा को मानना, रखना या उसका पालन करना है; सामान्य हिन्दी में ‘आज्ञा मानी’ सहज और सटीक है।
- source_word: ዐበየ
  choice: ठुकरा दिया
  rationale: सुधारे गए स्रोत-पाठ के अनुसार यह एसाव द्वारा आज्ञा के अस्वीकार को बताता है; ‘ठुकरा दिया’ विरोधात्मक बल को बनाए रखता है।
- source_word: ዐባር
  choice: अकाल पड़ा
  rationale: भूमि पर अकाल होने के लिए आधुनिक हिन्दी की स्वाभाविक अभिव्यक्ति।
- source_word: መጽአ
  choice: वह आया
  rationale: क्रिया पुल्लिंग एकवचन है, पर उपलब्ध अंश में कर्ता या गंतव्य स्पष्ट नहीं; अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: पिता की आज्ञा के प्रति याकूब और एसाव की विपरीत प्रतिक्रिया
  choice: याकूब ने आज्ञा मानी, परन्तु एसाव ने उसे ठुकरा दिया
  alternative: याकूब अपने पिता की आज्ञा से दूर चला गया
  rationale: प्रमाणित संशोधित गीइज़ पाठ में ኀለወ ‘मानना/पालन करना’ याकूब के लिए और ዐበየ ‘अस्वीकार करना’ एसाव के लिए है; वैकल्पिक पाठ नैतिक भूमिकाओं को उलट देता है।
- issue: अधूरे अंतिम वाक्य का निर्वाह
  choice: ‘और वह आया—’ के रूप में अपूर्णता बनाए रखी
  alternative: अगले प्रसंग से गंतव्य या कर्म जोड़कर वाक्य पूरा करना
  rationale: दिए गए स्रोत-अंश का अंत መጽአ ‘वह आया’ पर होता है; अनुमानित पूर्ति मूल से अधिक निश्चितता जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘परन्तु’ विरोध को स्पष्ट करता है। अंतिम डैश स्रोत में वाक्य के अधूरे रहने का संकेत देता है; उससे जुड़ा [a] मुख्य पाठ में रखा गया है।
