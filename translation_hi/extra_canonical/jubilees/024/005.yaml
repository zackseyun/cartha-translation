  text: What use is this birthright of the firstborn to me?" And he said to Jacob, "I give it to you." And Jacob said,
translation:
  language: hi
  text: “मेरे लिए पहलौठे का यह जन्मसिद्ध अधिकार किस काम का?” और उसने याकूब से कहा, “मैं इसे तुम्हें देता हूँ।” तब याकूब ने कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝቀዳሙ፡ ትውልድ
  choice: इस पहलौठे के जन्मसिद्ध अधिकार
  rationale: शाब्दिक संरचना ‘पहले जन्मे का जन्म/जन्माधिकार’ की ओर संकेत करती है; प्रसंग में यह पहलौठे का विशेष अधिकार है। ‘जन्मसिद्ध अधिकार’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है, जबकि ‘पहलौठे’ से मूल की विशिष्टता बनी रहती है।
- source_word: ለምንት፡ ሊተ
  choice: मेरे लिए ... का क्या लाभ?
  rationale: मूल प्रश्न का आशय वक्ता के लिए उस अधिकार की उपयोगिता पर है। यह हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: ወሀብኩከ
  choice: मैं इसे तुम्हें देता हूँ
  rationale: क्रिया का प्रथम पुरुष रूप प्रत्यक्ष कथन में वर्तमानार्थक प्रतिज्ञा/हस्तांतरण व्यक्त करता है; ‘देता हूँ’ इसे सहज रूप से दर्शाता है।
theological_decisions:
- issue: पहलौठेपन और जन्मसिद्ध अधिकार का संबंध
  choice: ‘पहलौठे के जन्मसिद्ध अधिकार’ दोनों तत्वों को स्पष्ट रूप से रखा गया।
  alternative: केवल ‘जन्मसिद्ध अधिकार’ या ‘पहलौठेपन का अधिकार’
  rationale: दोनों स्रोतगत धारणाओं को बनाए रखने से कानूनी-पारिवारिक अर्थ सुरक्षित रहता है और पाठ किसी विशेष धर्मशास्त्रीय व्याख्या तक सीमित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वचन के अंत में अल्पविराम रखा गया है क्योंकि अगला पद याकूब के अधूरे कथन को आगे बढ़ाता है।
