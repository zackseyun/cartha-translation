  language: hi
  text: 'अब्राहम की मृत्यु के बाद पलिश्तियों ने उन्हें मिट्टी से भर दिया था। अबीमेलेक ने इसहाक से कहा, “हमारे यहाँ से चले जाओ, क्योंकि तुम हमसे कहीं अधिक सामर्थी हो गए हो।” तब इसहाक वहाँ से चला गया। सातवें सप्ताह के पहले वर्ष में उसने गरार की तराई में डेरा डाला। उसके पिता अब्राहम के सेवकों ने पानी के जो कुएँ खोदे थे और जिन्हें पलिश्तियों ने अब्राहम की मृत्यु के बाद बंद कर दिया था, उन्हें उन्होंने फिर से खोदा। उन्होंने उन कुओं के वही नाम रखे जो उसके पिता अब्राहम ने रखे थे।


    इसहाक के सेवकों ने उस सूखी नदी की घाटी में एक कुआँ खोदा और उन्हें उसमें बहता हुआ जल मिला। तब गरार के चरवाहे इसहाक के चरवाहों से झगड़ने लगे। वे कहते थे, “यह पानी हमारा है।” इसलिए इसहाक ने उस कुएँ का नाम ‘विवाद’ रखा, क्योंकि उन्होंने हमसे विवाद किया था। फिर उन्होंने दूसरा कुआँ खोदा और वे उसके विषय में भी झगड़े; इसलिए उसने उसका नाम ‘वैर’ रखा। वह वहाँ से आगे बढ़ गया और उसने एक और कुआँ खोदा। उसके विषय में उन्होंने झगड़ा नहीं किया, इसलिए उसने उसका नाम ‘खुली जगह’ रखा। इसहाक ने कहा, “अब यहोवा ने हमारे लिए जगह बनाई है और हम इस देश में फलेंगे-फूलेंगे।”


    फिर वह वहाँ से ‘शपथ के कुएँ’ पर गया। यह चौवालीसवीं जुबली के पहले सप्ताह का पहला वर्ष था। उसी रात, पहले महीने के पहले दिन भोर में, यहोवा उसे दिखाई दिया और उससे कहा, “मैं तुम्हारे पिता अब्राहम का परमेश्वर हूँ। मत डरो, क्योंकि मैं तुम्हारे साथ हूँ। मैं तुम्हें आशीष दूँगा और तुम्हारे वंश को पृथ्वी की रेत के समान बहुत बढ़ाऊँगा—अपने सेवक अब्राहम के कारण।”


    उसने वहाँ एक वेदी बनाई, जहाँ उसके पिता अब्राहम ने पहले वेदी बनाई थी। उसने यहोवा का नाम पुकारा और अपने पिता अब्राहम के परमेश्वर को बलिदान चढ़ाया। उन्होंने एक कुआँ खोदा और उन्हें बहता हुआ जल मिला। इसहाक के सेवकों ने एक और कुआँ खोदा, पर उन्हें पानी नहीं मिला। उन्होंने आकर इसहाक को बताया कि उन्हें पानी नहीं मिला। इसहाक ने कहा, “आज मैंने पलिश्तियों से शपथ खाई है और हमारे साथ यह बात हुई है।” इसलिए उसने उस स्थान का नाम ‘शपथ का कुआँ’ रखा, क्योंकि वहीं उसने अबीमेलेक, उसके साथी अहुज्जत और उसकी सेना के प्रधान पीकोल से शपथ खाई थी। उस दिन इसहाक समझ गया कि उनसे शांति करने के लिए उसने दबाव में शपथ खाई थी।


    उसी दिन इसहाक ने पलिश्तियों को शाप देते हुए कहा,


    “सब जातियों के बीच पलिश्ती कोप और क्रोध के शाप के अधीन हों। यहोवा उन्हें निंदा, शाप, कोप और क्रोध के लिए पापी जातियों के हाथ में—कित्तियों के हाथ में—सौंप दे। जो लोग शत्रु और कित्तियों की तलवार से बच निकलें, उन्हें एक धर्मी जाति न्याय करके[a] आकाश के नीचे से जड़ से उखाड़ दे; क्योंकि वे पीढ़ी-दर-पीढ़ी पृथ्वी पर मेरी संतान के शत्रु और बैरी बने रहेंगे।


    “कोपपूर्ण न्याय के दिन उनमें न कोई बचा रहेगा, न कोई बच निकलेगा। क्योंकि पलिश्तियों का सारा वंश विनाश, जड़ से उखाड़े जाने और पृथ्वी पर से मिटा दिए जाने के लिए ठहराया गया है। इन कप्तोरियों का कोई अवशेष या वंश पृथ्वी पर शेष नहीं रहेगा। यदि उनमें से कोई आकाश तक चढ़ जाए, तो वहाँ से नीचे उतारा जाएगा; यदि वह पृथ्वी में धँस जाए, तो वहाँ से घसीटकर निकाला जाएगा; यदि वह जातियों के बीच छिप जाए, तो वहाँ से जड़ से उखाड़ दिया जाएगा; और यदि वह अधोलोक में उतर जाए, तो वहाँ भी उसका दंड बढ़ेगा और उसे वहाँ शांति नहीं मिलेगी।


    “यदि वह बंदी होकर चला जाए, तो उसके प्राणों के खोजी उसे मार्ग में ही मार डालेंगे। सारी पृथ्वी पर न उसका नाम रहेगा, न वंश; क्योंकि वह अनन्त शाप में चला जाएगा।”


