base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/003.yaml
  text: And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this wheat stew." And Jacob said to him, "Sell me your firstborn birthright."
translation:
  language: hi
  text: और याकूब ने मसूर का पकवान बनाया। एसाव खेत से भूखा आया और उसने अपने भाई याकूब से कहा, “मुझे गेहूँ के इस पकवान में से कुछ दे।”[a] याकूब ने उससे कहा, “अपना पहलौठेपन का अधिकार मुझे बेच दे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में पहले पकवान को मसूर का बताया गया है, लेकिन यहाँ एसाव उसे गेहूँ का पकवान कहता है।
    reason: स्रोत में मौजूद उल्लेखनीय पाठगत विषमता को स्पष्ट करना।
  - marker: b
    text: 'शाब्दिक भाव: “अपनी प्रथम-जन्म की वरिष्ठता मुझे बेच दे।”'
    reason: मूल पदबंध में पहलौठे की स्थिति/वरिष्ठता का अर्थ दिखाना।
lexical_decisions:
- source_word: ብርስን
  choice: मसूर की दाल
  rationale: यह शब्द पहले पकवान की सामग्री के रूप में मसूर को सूचित करता है; इसलिए स्रोत की स्पष्टता बनाए रखी गई है।
- source_word: ርኁብ
  choice: भूखा
  rationale: एसाव की शारीरिक दशा का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: ተብሰል፡ ዘሥርናይ
  choice: गेहूँ का पकवान
  rationale: गीज़ में एसाव की माँग स्पष्टतः गेहूँ/अन्न के पकवान के लिए है। इसे पहले उल्लिखित मसूर के पकवान से मिलाकर नहीं लिखा गया, ताकि पाठ की वास्तविक विषमता बनी रहे।
- source_word: ልህቃኒከ፡ ዘቅድመ፡ ልደት
  choice: अपना पहलौठे का अधिकार
  rationale: पदबंध प्रथम जन्म से जुड़ी वरिष्ठता अथवा जन्मसिद्ध स्थिति को दर्शाता है; हिन्दी में 'पहलौठे का अधिकार' इसे स्वाभाविक ढंग से व्यक्त करता है और 'पहले मुझे बेच' वाली कालगत व्याख्या से बचता है।
theological_decisions:
- issue: मसूर के पकवान और गेहूँ के पकवान के बीच पाठगत विषमता
  choice: मुख्य पाठ में दोनों को अलग-अलग सामग्री के रूप में रखा गया
  alternative: दोनों स्थानों पर 'मसूर की दाल का पकवान' लिखकर कथा में सामंजस्य बैठाना
  rationale: उपलब्ध गीज़ स्रोत पहले स्थान पर मसूर और एसाव की माँग में गेहूँ/अन्न कहता है। वास्तविक पाठगत तनाव को चुपचाप दूर करना उचित नहीं।
- issue: जन्मसिद्ध अधिकार का स्वरूप
  choice: पहलौठे का अधिकार
  alternative: अपना जन्मसिद्ध अधिकार पहले मुझे बेच दे
  rationale: ዘቅድመ ልደት प्रथम जन्म से संबंधित अधिकार को विशेषित करता है, न कि आवश्यक रूप से बेचने की क्रिया का समय बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथा-शैली रखी गई है। 'पकवान' को व्यापक खाद्य-संज्ञा के रूप में चुना गया है, क्योंकि स्रोत उबाले या पकाए गए मिश्रण को दर्शाता है। संवाद सहज रखा गया है और स्रोत की मसूर/गेहूँ संबंधी विषमता को मुख्य पाठ तथा पादटिप्पणी दोनों में सुरक्षित रखा गया है।
