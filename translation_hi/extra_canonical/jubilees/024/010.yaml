  text: And to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And they will bless themselves
translation:
  language: hi
  text: और मैं तुम्हारे वंश को यह सारी भूमि दूँगा, और उस शपथ को दृढ़ करूँगा जो मैंने तुम्हारे पिता अब्राहम से खाई थी। और मैं तुम्हारे वंश को आकाश के तारों के समान बढ़ाऊँगा, और तुम्हारे वंश को यह सारी भूमि दूँगा। और वे आशीष पाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे अपने को धन्य कहेंगे।” अंतिम गीज़ क्रिया का अर्थ निष्क्रिय (“आशीष पाएँगे”) या आत्मवाचक हो सकता है। उपलब्ध गीज़ पाठ-अंश इसी स्थान पर समाप्त होता है; इसमें “पृथ्वी की सब जातियाँ” शब्द नहीं हैं।
    reason: अंतिम गीज़ क्रिया की व्याकरणिक अस्पष्टता को दर्शाने और यह स्पष्ट करने के लिए कि अगले पद के शब्द इस पद के मुख्य पाठ में नहीं जोड़े गए हैं।
lexical_decisions:
- source_word: ዘርእ
  choice: वंश
  rationale: इस प्रसंग में ‘बीज’ का आशय संतान और भावी वंशजों से है; ‘वंश’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक अर्थ बनाए रखता है।
- source_word: አቀውም
  choice: पूरा करूँगा
  rationale: क्रिया का मूल भाव खड़ा करने, स्थिर करने या कायम रखने का है। शपथ के साथ हिन्दी में ‘शपथ को पूरा करना’ स्वाभाविक है और उसकी पुष्टि तथा क्रियान्वयन का आशय व्यक्त करता है।
- source_word: መሐላ
  choice: शपथ
  rationale: यह प्रतिज्ञाबद्ध शपथ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ከዋክብተ፡ ሰማይ
  choice: आकाश के तारे
  rationale: मूल उपमा को सीधे और स्वाभाविक रूप में सुरक्षित रखा गया है।
- source_word: ይትባረኩ
  choice: आशीष पाएँगे
  rationale: रूप का निष्क्रिय अर्थ सम्भव है और खंडित वाक्यांश में कर्ता को जोड़े बिना मूल की अस्पष्टता को यथासंभव बनाए रखता है। आत्मवाचक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अंतिम क्रिया ይትባረኩ का निष्क्रिय अथवा आत्मवाचक अर्थ
  choice: और वे आशीष पाएँगे
  alternative: और वे अपने को धन्य कहेंगे / अपने लिए आशीष चाहेंगे
  rationale: गीज़ रूप निष्क्रिय और आत्मवाचक दोनों प्रकार से समझा जा सकता है। दिए गए स्रोत में ‘पृथ्वी की सब जातियाँ’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: शपथ को ‘स्थापित’ करने का अर्थ
  choice: अपनी उस शपथ को पूरा करूँगा
  alternative: अपनी उस शपथ को स्थिर करूँगा
  rationale: ‘पूरा करूँगा’ हिन्दी में प्रतिज्ञा के प्रभावी होने का स्वाभाविक अर्थ देता है, बिना अतिरिक्त साम्प्रदायिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाचा-संबंधी पदावली में अनावश्यक तकनीकी या साम्प्रदायिक शब्द नहीं जोड़े गए हैं।
