  text: By your seed all the nations of the earth will be covenant.[a] And now your father obeyed my voice and kept my charge and my commandments and my laws and my statutes and my covenant. And now, listen to my voice and dwell in this land." And he dwelt in Gerar three weeks of years. And Abimelech gave command concerning him
translation:
  language: hi
  text: तेरे वंश के द्वारा पृथ्वी की सारी जातियाँ आशीष पाएँगी,[a] क्योंकि तेरे पिता ने मेरी वाणी मानी और मेरे निर्देशों, मेरी आज्ञाओं, मेरे नियमों, मेरी विधियों और मेरी वाचा का पालन किया।[b] अब तू मेरी वाणी मान और इसी देश में रह।” तब वह गरार में तीन वर्ष-सप्ताह[c] तक रहा। और अबीमेलेक ने उसके विषय में आदेश दिया—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में यहाँ ‘आशीष पाएँगी’ क्रिया स्पष्ट रूप से नहीं लिखी गई है; वाक्य-संदर्भ और उत्पत्ति 26:4–5 के समानांतर के आधार पर इसे पूरा किया गया है।
    reason: textual_ellipsis
  - marker: b
    text: दैवी वचन की यह कानूनी सूची पाठ में सघन और कुछ हद तक परस्पर मिलते-जुलते पाँच पदों से बनी है; अनुवाद ने उन्हें एक ही शब्द ‘व्यवस्था’ में नहीं समेटा है।
    reason: segmentation_note
  - marker: c
    text: अर्थात इक्कीस वर्ष।
    reason: cultural_time_unit
lexical_decisions:
- source_word: በዘርእከ
  choice: तेरे वंश के द्वारा
  rationale: यह साधन अथवा माध्यम का भाव स्वाभाविक हिन्दी में व्यक्त करता है और सामूहिक अर्थ वाले ‘वंश’ को बनाए रखता है।
- source_word: ሰምዐ ... ቃለ
  choice: वाणी मानी
  rationale: यहाँ ‘सुनना’ आज्ञापालन के अर्थ में है; हिन्दी में ‘वाणी मानना’ श्रवण और आज्ञाकारिता दोनों को संक्षेप में व्यक्त करता है।
- source_word: ዑቃቤየ
  choice: मेरे निर्देश
  rationale: ‘मेरी रखवाली/मेरा दायित्व’ जैसे अस्वाभाविक शब्दों के बजाय सौंपे गए पालन-विषय का अर्थ देता है, जबकि अगली कानूनी संज्ञाओं से अलग रहता है।
- source_word: ትእዛዛትየ
  choice: मेरी आज्ञाएँ
  rationale: बहुवचन आदेशों के लिए सीधा और प्रचलित समतुल्य।
- source_word: ሕገጊየ
  choice: मेरे नियम
  rationale: कानून या विधि का अर्थ रखते हुए ሥርዐትየ से अलग हिन्दी पद चुना गया है।
- source_word: ሥርዐትየ
  choice: मेरी विधियाँ
  rationale: निर्धारित विधान/व्यवस्था का भाव देता है और सूची के पृथक पद को सुरक्षित रखता है।
- source_word: ኪዳንየ
  choice: मेरी वाचा
  rationale: दैवी covenant के लिए प्रतिष्ठित, संक्षिप्त और धर्मवैचारिक रूप से तटस्थ बाइबलीय हिन्दी पद।
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመት
  choice: तीन वर्ष-सप्ताह
  rationale: शाब्दिक काल-इकाई को बनाए रखता है; फुटनोट में उसका कुल समय स्पष्ट किया गया है।
- source_word: ወአዘዘ፡ አቤሜሌክ፡ በእንቲአሁ
  choice: और अबीमेलेक ने उसके विषय में आदेश दिया—
  rationale: स्रोत का अधूरा, अगले कथन की ओर बढ़ता वाक्य सुरक्षित रखने के लिए अंत में डैश रखा गया है।
theological_decisions:
- issue: आशीष की क्रिया स्रोत-पाठ में स्पष्ट रूप से व्यक्त नहीं है
  choice: मुख्य पाठ में ‘आशीष पाएँगी’ रखा और पाठगत संक्षेप को फुटनोट में बताया
  alternative: वाक्य को ‘तेरे वंश के द्वारा पृथ्वी की सारी जातियाँ—क्योंकि...’ के रूप में व्याकरणतः अधूरा छोड़ना
  rationale: संदर्भ और उत्पत्ति 26:4–5 के समानांतर से अपेक्षित अर्थ स्पष्ट है, पर गीज़ पाठ की वास्तविक अपूर्णता को छिपाया नहीं गया।
- issue: दैवी कानूनी पदों की पाँच-सदस्यीय सूची
  choice: निर्देश, आज्ञाएँ, नियम, विधियाँ और वाचा—सभी को अलग रखा
  alternative: निकटार्थी पदों को एक सामान्य शब्द ‘व्यवस्था’ में मिला देना
  rationale: स्रोत में पाँच अलग संज्ञाएँ हैं; उन्हें समेटना पाठ की सघनता और बल को घटा देता।
- issue: ‘वर्ष-सप्ताह’ की कालावधि
  choice: मूल इकाई को मुख्य पाठ में रखा और फुटनोट में इक्कीस वर्ष स्पष्ट किए
  alternative: सीधे ‘इक्कीस वर्ष’ अनुवाद करना
  rationale: यह पाठ की प्राचीन काल-गणना को सुरक्षित रखते हुए आधुनिक पाठक के लिए अर्थ भी स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ईश्वर के प्रत्यक्ष संबोधन में एकवचन ‘तू/तेरे’ रखा गया है, जो निकट और अधिकारपूर्ण बाइबलीय संबोधन है। ‘वाचा’ जैसे आवश्यक बाइबलीय पद को बनाए रखते हुए बाकी कानूनी शब्द सामान्य पाठक के लिए सुलभ रखे गए हैं। अंतिम डैश स्रोत के अगले वाक्य में जारी रहने वाले आदेश को दर्शाता है।
