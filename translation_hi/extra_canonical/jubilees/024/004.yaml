translation:
  language: hi
  text: “और मैं तुझे रोटी दूँगा और यह मसूर की दाल भी।” तब एसाव ने अपने मन में कहा, “मैं मरने ही वाला हूँ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: रोटी
  rationale: यह शब्द सामान्यतः रोटी या भोजन के रूप में खाई जाने वाली पकी हुई रोटी को दर्शाता है; यहाँ ‘रोटी’ स्वाभाविक और सटीक है।
- source_word: ተብሰለ፡ ብርስን
  choice: मसूर की दाल
  rationale: वाक्यांश का अर्थ मसूर से पकाए गए भोजन से है। हिन्दी में ‘मसूर की दाल’ सामान्य पाठक के लिए स्वाभाविक है और संदर्भित व्यंजन को स्पष्ट करती है।
- source_word: በልቡ
  choice: अपने मन में
  rationale: शाब्दिक भाव ‘अपने हृदय में’ है, पर मौन आंतरिक कथन के लिए आधुनिक हिन्दी में ‘अपने मन में’ अधिक स्वाभाविक है।
- source_word: እመውት
  choice: मैं मरने ही वाला हूँ
  rationale: रूप आसन्न मृत्यु का भाव व्यक्त करता है; यह चयन हिन्दी में उस तात्कालिकता को स्वाभाविक ढंग से रखता है।
