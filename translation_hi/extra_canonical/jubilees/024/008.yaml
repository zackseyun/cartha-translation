base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/008.yaml
  text: Isaac was going to go down to Egypt in the second year of this week, and he went to Gerar, to Abimelech king of the Philistines.
translation:
  language: hi
  text: इसहाक इस सप्ताह के दूसरे वर्ष में मिस्र उतरने को था[a], और वह पलिश्तियों के राजा अबीमेलेक के पास गरार चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र उतरने के लिए निकलने वाला था।”
    reason: गीज़ का क्रियारूप इरादे, आरंभ होने वाली गति, या आसन्न कार्य को व्यक्त कर सकता है; यह मिस्र पहुँच जाने को नहीं बताता।
lexical_decisions:
- source_word: ይረድ
  choice: उतरने को था
  rationale: अपूर्ण क्रियारूप को पूर्ण हुई यात्रा के बजाय इरादे या आसन्न कार्य के रूप में प्रस्तुत करता है; आगे गरार जाने की बात से भी स्पष्ट है कि वह मिस्र नहीं पहुँचा।
- source_word: ዘዝ፡ ሱባዔ
  choice: इस सप्ताह के
  rationale: पाठ के संकेतवाचक ‘इस’ को बनाए रखता है; इसे संदर्भानुसार ‘छठे सप्ताह’ में बदलकर अंतर्निहित अर्थ नहीं थोपा गया।
- source_word: ጌራርገ
  choice: गरार
  rationale: स्थाननाम Gerar का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: አቤሜሌክ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम Abimelech का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ንጉሠ፡ ፍልስጥኤም
  choice: पलिश्तियों के राजा
  rationale: राजकीय उपाधि और जनसमूह के संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या इसहाक वास्तव में मिस्र गया?
  choice: ‘मिस्र उतरने को था’—इरादा या आसन्न कार्य
  alternative: ‘मिस्र उतर गया’—पूर्ण हुई यात्रा
  rationale: गीज़ का अपूर्ण रूप और अगला खंड पूर्ण यात्रा के बजाय इरादा दर्शाते हैं; इससे उत्पत्ति 26 के कथात्मक क्रम के साथ भी अनावश्यक टकराव नहीं बनता।
- issue: कालगणना में ‘इस सप्ताह’ या ‘छठा सप्ताह’
  choice: इस सप्ताह
  alternative: छठा सप्ताह
  rationale: मूल पाठ का संकेतवाचक रूप संरक्षित किया गया है; संदर्भगत पहचान को मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पर’ दूसरे गंतव्य की ओर कथात्मक मोड़ को स्पष्ट करता है, जबकि स्रोत के दोनों गति-संबंधी खंड सुरक्षित रहते हैं।
