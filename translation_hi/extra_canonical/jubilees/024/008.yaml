    issue: The conjunction ‘पर’ introduces an adversative contrast absent from the Ge'ez.
    rationale: 'The source coordinates the clauses with ወ (‘and’): Isaac was going/intending to go down to Egypt, and he went to Gerar. Although the narrative context explains why he did not reach Egypt, the verse itself does not mark the second clause with ‘but.’'
