  text: और जो कुछ उसका था उसके विषय में यह कहते हुए, “हर व्यक्ति जो उसे और उसकी हर एक वस्तु को छुएगा,[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वाक्य अगले पद में पूरा होता है।
    reason: यह अंश स्रोत में वाक्य के बीच में समाप्त होता है; पादटिप्पणी केवल इस पाठगत निरंतरता को स्पष्ट करती है।
lexical_decisions:
- source_word: በእንተ፡ ኵሉ፡ ዘዚአሁ
  choice: उसकी हर एक वस्तु के विषय में
  rationale: यह पदबंध उस व्यक्ति से संबंधित सभी वस्तुओं/संपत्ति को समेटता है; ‘वस्तु’ हिंदी में जान-बूझकर व्यापक रखा गया है।
- source_word: ኵሉ፡ ሰብእ
  choice: जो कोई
  rationale: शाब्दिक ‘हर मनुष्य’ की अपेक्षा चेतावनी या शर्त आरंभ करने वाला स्वाभाविक हिंदी रूप।
- source_word: ዘይሰክፎ
  choice: उसे छुएगा
  rationale: क्रिया का मूल अर्थ छूना/स्पर्श करना है; संदर्भ के अभाव में ‘हानि पहुँचाना’ जैसा व्याख्यात्मक अर्थ नहीं जोड़ा गया।
- source_word: ወለኵሉ፡ ዘዚአሁ
  choice: या उसकी किसी वस्तु को
  rationale: व्यक्ति और उससे संबंधित हर चीज़ के बीच विकल्पसूचक संबंध को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘छूने’ का आशय
  choice: प्रत्यक्ष अर्थ ‘छुएगा’ बनाए रखा
  alternative: ‘हानि पहुँचाएगा’ या ‘हाथ लगाएगा’
  rationale: उपलब्ध गीइज़ पाठ वास्तविक स्पर्श और शत्रुतापूर्ण हस्तक्षेप के बीच संभावित अर्थ-विस्तार को निर्णायक रूप से हल नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। स्रोत के खंडित वाक्य को कृत्रिम रूप से पूरा नहीं किया गया; अंत में अल्पविराम और पादटिप्पणी से अगले पद तक निरंतरता दिखाई गई है।
