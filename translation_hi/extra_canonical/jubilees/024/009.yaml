  text: And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and sojourn in that land, and I will be with you and bless you. For to you
translation:
  language: hi
  text: और प्रभु उसके सामने प्रकट हुए और उससे कहा, “मिस्र की ओर नीचे मत जाना। उस देश में रहना जिसके विषय में मैं तुझसे कहूँगा, और उसी देश में परदेशी के रूप में रहना; मैं तेरे साथ रहूँगा और तुझे आशीष दूँगा, क्योंकि तुझे…[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध मूल-पाठ का अंश यहाँ अधूरा समाप्त होता है; वाक्य अगले पाठांश में पूरा होता है।
    reason: स्रोत की वास्तविक अपूर्णता को पाठक के सामने स्पष्ट रखना और अनुमानित पूर्ति से बचना।
lexical_decisions:
- source_word: አስተርአዮ
  choice: दर्शन दिया
  rationale: गीज़ क्रिया का अर्थ उसके सामने प्रकट होना/दिखाई देना है; हिंदी बाइबलीय गद्य में ‘दर्शन दिया’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ኢትረድ፡ ግብጸ
  choice: मिस्र को मत उतरना
  rationale: ‘उतरना’ मूल की दिशासूचक क्रिया को सुरक्षित रखता है और मिस्र जाने के लिए प्रचलित प्राचीन अभिव्यक्ति है।
- source_word: ንበር
  choice: रहना
  rationale: स्थिर निवास की आज्ञा को सरल आधुनिक हिंदी में व्यक्त करता है।
- source_word: ፍልስ
  choice: परदेशी होकर रहना
  rationale: यह क्रिया अस्थायी अथवा प्रवासी निवास का भाव रखती है और पहले आए सामान्य ‘रहना’ से इसका अंतर बचाती है।
- source_word: እሄሉ፡ ምስሌከ
  choice: मैं तेरे साथ रहूँगा
  rationale: साथ उपस्थित रहने के प्रतिज्ञात्मक अर्थ का सीधा अनुवाद।
- source_word: እባርከከ
  choice: तुझे आशीष दूँगा
  rationale: आशीर्वाद देने की मूल धार्मिक संकल्पना का मानक हिंदी रूप।
theological_decisions:
- issue: दिव्य नाम እግዚአብሔር का निरूपण
  choice: प्रभु
  alternative: यहोवा
  rationale: गीज़ पाठ में सामान्य प्रभु-सूचक पद है; किसी विशेष पुनर्निर्मित इब्रानी दिव्य नाम को मूल में न होने पर आरोपित नहीं किया गया।
- issue: प्रतिज्ञा का अपूर्ण अंतिम वाक्यांश
  choice: ‘क्योंकि तुझे…’ के बाद अपूर्णता स्पष्ट की
  alternative: अगले पद से वाक्य पूरा करना
  rationale: दिया गया स्रोत अंश ‘क्योंकि तुझे’ पर समाप्त होता है; अनुपलब्ध पाठ को अनुमान से जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण बाइबलीय शैली रखी गई है। ईश्वर के सीधे संबोधन में एकवचन ‘तू/तेरे/तुझे’ का पारंपरिक रूप प्रयोग हुआ है। ‘रहना’ और ‘परदेशी होकर रहना’ के द्वारा मूल की दो अलग निवास-संबंधी क्रियाओं का भेद सुरक्षित रखा गया है।
