base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/006.yaml
  text: '"Swear to me today." And he swore to him. And Jacob gave Esau his brother bread and stew, and he ate until he was satisfied. And Esau sold his birthright. Therefore his name was called Edom, because of the wheat stew that Jacob gave him in exchange for his birthright.'
translation:
  language: hi
  text: “आज ही मुझसे शपथ खा।” तब एसाव ने याकूब से शपथ खाई। फिर याकूब ने अपने भाई एसाव को रोटी और पकवान दिया, और उसने पेट भरकर खाया। एसाव ने अपना पहलौठे का अधिकार बेच दिया। इसलिए उसका नाम एदोम कहलाया, क्योंकि याकूब ने उसके पहलौठे के अधिकार के बदले उसे गेहूँ का पकवान[a] दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में यहाँ “गेहूँ” है; कुछ प्रस्तुतियाँ उत्पत्ति 25 के समानांतर वर्णन के आधार पर “लाल मसूर की खिचड़ी” कहती हैं।
    reason: मूल पाठ की आश्चर्यजनक लेकिन स्पष्ट शब्दावली को बनाए रखते हुए प्रचलित वैकल्पिक प्रस्तुति की सूचना देना।
lexical_decisions:
- source_word: መሐል፡ ሊተ፡ ዮም
  choice: आज ही मुझसे शपथ खा
  rationale: प्रत्यक्ष आज्ञा और ‘आज’ के काल-संकेत को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: ተብሰለ
  choice: पका हुआ भोजन / पकवान
  rationale: शब्द पके हुए व्यंजन या स्टू-सदृश भोजन को सूचित करता है; पहले उल्लेख में सामान्य और अंतिम उल्लेख में गेहूँ से युक्त विशिष्ट रूप रखा गया है।
- source_word: መጠ
  choice: बेच दिया
  rationale: गीइज़ क्रिया का अर्थ यहाँ जन्मसिद्ध अधिकार को तुच्छ समझना नहीं, बल्कि बेचना है।
- source_word: ቀዳሙ፡ ትውልዶ / ቅድመተ፡ ልደቱ
  choice: पहलौठे का अधिकार
  rationale: शाब्दिक ‘जन्म में प्रथम होना’ के कानूनी-पारिवारिक आशय को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: ስርናይ
  choice: गेहूँ
  rationale: गीइज़ शब्द स्पष्ट रूप से गेहूँ का द्योतक है, मसूर का नहीं।
theological_decisions:
- issue: एसाव के पहलौठे के अधिकार के प्रति क्रिया
  choice: बेच दिया
  alternative: तुच्छ जाना
  rationale: इस पद का गीइज़ पाठ बिक्री का कथन करता है; उत्पत्ति के निकटवर्ती वर्णन से ‘तुच्छ जाना’ लेकर पाठ को समरूप नहीं बनाया गया।
- issue: एदोम नाम और भोजन के बीच संबंध
  choice: गेहूँ का पकवान
  alternative: लाल मसूर की खिचड़ी
  rationale: नाम-व्युत्पत्ति के साथ संभावित तनाव के बावजूद मूल गीइज़ पाठ में ‘गेहूँ’ है; कठिनाई को सामंजस्य बैठाकर मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहलौठे का अधिकार’ धार्मिक-पारिवारिक संदर्भ में प्रचलित और स्पष्ट पद है।
