translation:
  language: hi
  text: उसने पलिश्तियों के बीच सौ गुनी फसल काटी। इसहाक बहुत महान हो गया, और पलिश्तियों ने उससे ईर्ष्या की। अब्राहम के जीवनकाल में अब्राहम के सेवकों ने जितने कुएँ खोदे थे, उन सबको पलिश्तियों ने पाट दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስዊተ
  choice: सौ गुना
  rationale: यह पाठ में उपज की मात्रा को व्यक्त करता है; प्रसंगानुसार इसे स्वाभाविक हिन्दी में ‘सौ गुना’ रखा गया है।
- source_word: ዐብየ ... ፈድፋደ
  choice: अत्यन्त महान हो गया
  rationale: मूल में इसहाक के बहुत बढ़ जाने या महान होने की अभिव्यक्ति है। ‘महान’ मूल की व्यापकता बनाए रखता है और इसे केवल धन-संपत्ति तक सीमित नहीं करता।
- source_word: ቀንኡ
  choice: ईर्ष्या करने लगे
  rationale: क्रिया पलिश्तियों द्वारा इसहाक से ईर्ष्या किए जाने को व्यक्त करती है; हिन्दी में सतत प्रतिक्रिया के लिए यह रूप स्वाभाविक है।
- source_word: ዐዘቅተ
  choice: कुएँ
  rationale: यह जल के लिए खोदे गए कुओं का सामान्य शब्द है।
- source_word: ደፈንዎ
  choice: पाट दिया
  rationale: मूल क्रिया कुओं को भरकर या ढककर बंद कर देने का भाव देती है; ‘पाट दिया’ हिन्दी में सटीक और सहज है।
