  text: And the rain was withheld from the land, because there was no shower that came down. And the land became barren, but in the land of Egypt alone there was food, because Joseph had gathered seed for the land
translation:
  language: hi
  text: और भूमि पर वर्षा रोक दी गई[a], क्योंकि एक भी बौछार नहीं पड़ी। भूमि बंजर हो गई; केवल मिस्र देश में भोजन था, क्योंकि यूसुफ ने देश के लिए बीज इकट्ठा कर रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “वर्षा ने दिए जाने से इनकार कर दिया।”'
    reason: गीज़ की मानवीकरणयुक्त अभिव्यक्ति ወአበየ ዝናም ተውህቦ को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ዝናም (zənām)
  choice: वर्षा
  rationale: यह सामान्य वर्षा का स्पष्ट और स्वाभाविक आधुनिक हिन्दी पर्याय है।
- source_word: ምትነ (mətna)
  choice: बौछार
  rationale: मुख्य शब्द ‘वर्षा’ की पुनरावृत्ति से बचते हुए स्रोत के वर्षा/झड़ी संबंधी दूसरे पद को अलग रूप में बनाए रखता है।
- source_word: ዐብረተ (ʿabrata)
  choice: बंजर हो गई
  rationale: अकाल के प्रसंग में भूमि के अनुपजाऊ हो जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሲሲተ (sisita)
  choice: भोजन
  rationale: संदर्भ में उपलब्ध खाद्य-सामग्री का व्यापक अर्थ देता है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
- source_word: ዘርአ (zarʾa)
  choice: बीज
  rationale: स्रोत के ठोस शब्द को ‘अनाज’ में बदलने के बजाय उसके मूल अर्थ को सुरक्षित रखता है।
- source_word: አስተጋብአ (ʾastagābʾa)
  choice: इकट्ठा कर रखा था
  rationale: पूर्व में किए गए संग्रह के कारण वर्तमान अकाल में भोजन उपलब्ध होने का परिणाम स्पष्ट करता है।
theological_decisions:
- issue: वर्षा रुकने में कर्ता का संकेत
  choice: निष्कर्तृक कर्मवाच्य ‘वर्षा रोक दी गई’
  alternative: ‘परमेश्वर ने वर्षा रोक दी’
  rationale: स्रोत इस वाक्य में परमेश्वर को स्पष्ट कर्ता नहीं बनाता; इसलिए किसी अघोषित कर्ता की धार्मिक पहचान नहीं जोड़ी गई।
- issue: वर्षा का मानवीकरण
  choice: मुख्य पाठ में स्वाभाविक अर्थ, शाब्दिक मुहावरा पादटिप्पणी में
  alternative: ‘वर्षा ने दिए जाने से इनकार किया’
  rationale: गीज़ की अभिव्यक्ति का मानवीकरण पादटिप्पणी में सुरक्षित है, जबकि मुख्य पाठ साधारण हिन्दी पाठक के लिए सहज रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘केवल मिस्र देश में’ स्रोत के विरोध और विशिष्टता को बनाए रखता है। आरंभिक ‘और’ गीज़ संयोजक के अनुरूप रखा गया है।
