translation:
  language: hi
  text: उसने उन्हें हिरासत में डाल दिया। इसके बाद उसने उन्हें छोड़ दिया और केवल शिमोन को रोक रखा, और उन नौ को [विदा कर दिया]।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ पाठ-खंड यहीं ‘और उन नौ को’ पर समाप्त होता है; वाक्य पूरा करने वाली क्रिया संभवतः अगले खंड में चली गई है। इसलिए ‘विदा कर दिया’ को कोष्ठकों में संदर्भ के आधार पर पूरा किया गया है।
    reason: खंड-विभाजन के कारण स्रोत में छूटी हुई क्रिया और उसके संपादकीय पूरण को स्पष्ट करना।
lexical_decisions:
- source_word: ወንጸዎሙ
  choice: उसने उन्हें हिरासत में डाल दिया
  rationale: क्रिया का आशय उन्हें बंदी या निगरानी में रखने का है; ‘हिरासत में डाल दिया’ आधुनिक और सहज हिन्दी में न्यायिक अभिरक्षा का भाव व्यक्त करता है।
- source_word: ፈትሖሙ
  choice: उसने उन्हें छोड़ दिया
  rationale: यहाँ बंधन या हिरासत से मुक्त करने का अर्थ है; ‘छोड़ दिया’ संदर्भानुकूल और सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ወአቀመ፡ ስምዖንን፡ ባሕቲተ
  choice: और केवल शिमोन को रोक रखा
  rationale: रचना शिमोन को अकेले/एकमात्र व्यक्ति के रूप में अपने पास रोके रखने पर बल देती है; हिन्दी में ‘केवल शिमोन’ उस बल को स्वाभाविक रूप से रखता है।
- source_word: ወተስዐተ
  choice: और उन नौ को
  rationale: उपलब्ध स्रोत-खंड में केवल ‘और नौ’ है। संदर्भगत व्यक्तियों को हिन्दी में स्पष्ट करने के लिए ‘उन’ जोड़ा गया है, पर ‘भाइयों’ जैसा संज्ञापद नहीं जोड़ा गया।
