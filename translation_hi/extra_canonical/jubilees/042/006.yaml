translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘हिरासत’ और ‘रोक रखा’ सामान्य पाठक के लिए स्पष्ट हैं। स्रोत-खंड की अपूर्णता को छिपाने के बजाय वर्ग कोष्ठक और पाद-टिप्पणी से दर्शाया गया है।
