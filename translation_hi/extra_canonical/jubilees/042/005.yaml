  text: And Joseph recognized them, but they did not recognize him. And he spoke harshly with them and said to them, “Are you not spies, and have you come to observe the exposed parts of the land?”
translation:
  language: hi
  text: और यूसुफ ने उन्हें पहचान लिया, पर उन्होंने उसे नहीं पहचाना। उसने उनसे कठोरता से बात की और कहा, “क्या तुम भेदिए नहीं हो? क्या तुम देश के खुले पड़े भागों को देखने आए हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእመሮሙ
  choice: उन्हें पहचान लिया
  rationale: इस प्रसंग में क्रिया केवल जानने की नहीं, सामने आए भाइयों को पहचान लेने की क्रिया व्यक्त करती है।
- source_word: ዐጹባጺበ
  choice: कठोरता से
  rationale: यूसुफ के बोलने के रुखे या कठोर ढंग को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሰብአ፡ ዓይን
  choice: भेदिए
  rationale: शाब्दिक रूप से ‘आँख के लोग’ जैसा पद यहाँ निगरानी या जासूसी करने वालों के अर्थ में है; ‘भेदिए’ प्रसंगानुकूल और सहज हिन्दी है।
- source_word: ጸባረ፡ ምድር
  choice: देश के खुले पड़े भागों
  rationale: भूमि के असुरक्षित, अनावृत या कमजोर स्थानों की मूल छवि को बनाए रखता है, बिना अर्थ को केवल ‘कमजोरियाँ’ तक सीमित किए।
theological_decisions: []
