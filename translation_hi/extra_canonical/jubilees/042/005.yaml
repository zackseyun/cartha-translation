  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और कथात्मक शैली रखी गई है। प्रश्न को दो वाक्यों में बाँटकर आरोप की तीव्रता और स्वाभाविक हिन्दी संवाद संरक्षित की गई है।
