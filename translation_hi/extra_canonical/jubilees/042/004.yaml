  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल कथात्मक शैली रखी गई है। वाक्यक्रम स्रोत के निकट है, जबकि ‘इसलिए’ द्वारा याकूब के सुनने और पुत्रों को भेजने का स्वाभाविक संबंध स्पष्ट किया गया है। कोई पाद-टिप्पणी आवश्यक नहीं है।
