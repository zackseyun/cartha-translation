  yaml_path: translation/extra_canonical/jubilees/042/004.yaml
  text: And the famine became very severe in the land of Canaan, and Jacob heard that there was grain in Egypt, and he sent ten of his sons to get grain for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.
translation:
  language: hi
  text: और कनान देश में अकाल बहुत भयंकर हो गया। याकूब ने सुना कि मिस्र में अनाज है, इसलिए उसने अपने दस पुत्रों को मिस्र से अपने लिए अनाज लाने भेजा। परन्तु बिन्यामीन को उसने नहीं भेजा। और याकूब के दस पुत्र यात्रियों के साथ मिस्र पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረኃብ
  choice: अकाल
  rationale: यह शब्द सामान्य भूख के साथ व्यापक खाद्य-संकट को भी व्यक्त करता है; भूमि-विशेष में उसकी तीव्रता के संदर्भ में ‘अकाल’ स्वाभाविक और सटीक है।
- source_word: ጥቀ
  choice: बहुत भयंकर
  rationale: तीव्रता सूचक पद को सहज आधुनिक हिन्दी में अकाल की अत्यधिक गंभीरता के रूप में व्यक्त किया गया है।
- source_word: ሲሲት
  choice: अनाज
  rationale: संदर्भ मिस्र से अकाल के समय प्राप्त की जाने वाली खाद्य-उपज का है; ‘अनाज’ सामान्य ‘भोजन’ से अधिक विशिष्ट और प्रसंगानुकूल है।
- source_word: ዘየሐውር
  choice: यात्रियों
  rationale: स्रोत का अर्थ ‘जो जा रहे/यात्रा कर रहे थे’ है; संक्षिप्त प्राकृतिक हिन्दी में ‘यात्रियों’ उस समूह को व्यक्त करता है।
