  yaml_path: translation/extra_canonical/jubilees/042/003.yaml
  text: in the seven years of abundance and had kept it. And the Egyptians came to Joseph so that he might give them food, and he opened the storehouses where the grain of the former years was, and sold it to the peoples of the land for gold.
translation:
  language: hi
  text: भरपूरी के सात वर्षों में उसने उसे इकट्ठा करके सुरक्षित रखा था। तब मिस्रवासी[a] यूसुफ़ के पास आए कि वह उन्हें भोजन दे। उसने उन भंडारों को खोल दिया जिनमें पिछले वर्षों का अनाज था, और उसे देश के लोगों को सोने के बदले बेच दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मिस्र’; यहाँ क्रिया और सर्वनाम बहुवचन हैं।
    reason: स्थाननाम के शाब्दिक रूप और उसके सामूहिक बहुवचन अर्थ—दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ሠምር
  choice: भरपूरी
  rationale: यह शब्द समृद्ध उपज और प्रचुरता का भाव देता है; अकाल के विपरीत संदर्भ में ‘भरपूरी’ सहज और स्पष्ट है।
- source_word: ግብጽ
  choice: मिस्रवासी
  rationale: संज्ञा शाब्दिक रूप से ‘मिस्र’ है, पर साथ का क्रियापद और परवर्ती सर्वनाम बहुवचन हैं; इसलिए यहाँ सामूहिक अर्थ ‘मिस्रवासी’ स्वाभाविक है।
- source_word: ሲሲተ
  choice: भोजन
  rationale: संदर्भ में लोगों के निर्वाह के लिए दी जाने वाली खाद्य-सामग्री अभिप्रेत है।
- source_word: መዛግብተ
  choice: भंडार
  rationale: यह संचित अनाज रखने के कोषों या भंडारगृहों को सूचित करता है; ‘भंडार’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: ስርናይ
  choice: अनाज
  rationale: अकाल और भंडारण के संदर्भ में सामान्य खाद्यान्न का अर्थ उपयुक्त है।
- source_word: በወርቅ
  choice: सोने के बदले
  rationale: ወርቅ का स्पष्ट अर्थ ‘सोना’ है; विनिमय-संदर्भ को हिंदी में ‘के बदले’ से व्यक्त किया गया है।
theological_decisions:
- issue: ግብጽ का एकवचन स्थाननाम और वाक्य में बहुवचन व्याकरण
  choice: मुख्य पाठ में ‘मिस्रवासी’
  alternative: ‘मिस्र’
  rationale: बहुवचन क्रिया ወመጽኡ और ‘उन्हें’ अर्थ वाला प्रत्यय लोगों के समूह की ओर संकेत करते हैं, फिर भी स्थाननाम की शाब्दिकता पादटिप्पणी में रखी गई है।
- issue: ዘቀዳሚ ዓመት में वर्ष की समय-संबंधी अभिव्यक्ति
  choice: ‘पिछले वर्ष का’
  alternative: ‘पहले वर्ष का’
  rationale: रूप एकवचन ‘वर्ष’ के साथ पूर्वकालीन वर्ष को दर्शाता है; ‘पिछले वर्ष’ हिंदी में इस संबंध को बिना अनावश्यक क्रम-संख्या थोपे स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभ मूल पद की पूर्ववर्ती संदर्भ पर निर्भरता को बनाए रखता है; अस्पष्ट कर्म के लिए कोई नया संज्ञापद नहीं जोड़ा गया।
