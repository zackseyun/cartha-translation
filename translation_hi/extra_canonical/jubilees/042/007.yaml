    issue: Awkward word order in the final clause
    rationale: The phrase ‘उनका धन भी उनके लिए रख दिया’ is grammatically possible, but ‘उनके लिए उनका धन भी रख दिया’ is more idiomatic modern Hindi and retains the source’s dative ‘for them’ rather than introducing ‘in them।’
  revised_text: उसने अपने भाइयों को रवाना किया, उनके बोरों में अनाज भर दिया, और उनके लिए उनका धन भी रख दिया।
