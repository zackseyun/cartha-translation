  text: He sent his brothers away, and he filled their sacks with grain, and he also put their money for them.
translation:
  language: hi
  text: उसने अपने भाइयों को रवाना किया, उनके बोरों में अनाज भर दिया, और उनके लिए उनका धन भी रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አኀዊሁ
  choice: अपने भाइयों को
  rationale: यह रूप ‘उसके भाइयों’ को सूचित करता है; हिन्दी वाक्य में कर्म के रूप में ‘अपने भाइयों को’ स्वाभाविक है।
- source_word: ፈነወ
  choice: विदा किया
  rationale: क्रिया का अर्थ भेज देना या विदा करना है; प्रसंग में भाइयों को यात्रा पर रवाना करना अभिप्रेत है।
- source_word: አሕስሊሆሙ
  choice: उनके बोरों में
  rationale: यह उनके अनाज रखने के थैलों या बोरों को दर्शाता है; आधुनिक हिन्दी में ‘बोरे’ सहज और स्पष्ट है।
- source_word: ስርናየ
  choice: अनाज
  rationale: स्रोत शब्द गेहूँ अथवा धान्य के लिए प्रयुक्त हो सकता है; यहाँ व्यापक अर्थ ‘अनाज’ प्रसंगानुकूल है और अनावश्यक विशिष्टता से बचता है।
- source_word: ወርቆሙ
  choice: उनका धन
  rationale: शाब्दिक अर्थ ‘उनका सोना’ हो सकता है, पर विनिमय-माध्यम के प्रसंग में ‘धन’ स्वाभाविक है। इसे ‘चाँदी’ कहना गीइज़ पाठ के बजाय उत्पत्ति के समानांतर पाठ से सामंजस्य बैठाना होगा।
- source_word: ሎሙ
  choice: उनके लिए
  rationale: गीइज़ पद स्पष्टतः ‘उनके लिए’ कहता है, ‘उनमें’ नहीं।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। स्रोत के क्रम और संबंधों को सुरक्षित रखते हुए हिन्दी के स्वाभाविक वाक्य-विन्यास का प्रयोग किया गया है। अंतिम पद को ‘उनके लिए’ ही रखा गया है; स्थानसूचक ‘उनमें’ नहीं जोड़ा गया।
