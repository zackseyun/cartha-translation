  text: 'they should bring Benjamin. And Jacob said, “You have bereaved me: Joseph is no more, and Simeon also is no more...”'
translation:
  language: hi
  text: 'वे बिन्यामीन को ले आएँ। तब याकूब ने कहा, “तुमने मुझे मेरे बच्चों से वंचित कर दिया है: यूसुफ अब नहीं है, और शिमोन भी नहीं है...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያመጽእዎ፡ ለብንያም
  choice: वे बिन्यामीन को ले आएँ
  rationale: क्रिया का आशय बिन्यामीन को लाने से है; हिंदी में अपेक्षित/आवश्यक क्रिया का भाव सहज रूप में रखा गया है।
- source_word: እምከንከሙኒከ
  choice: तुमने मुझे संतान-विहीन कर दिया है
  rationale: यह रूप संतान छिन जाने अथवा संतान से वंचित किए जाने का भाव देता है; केवल सामान्य ‘शोक दिया’ कहने के बजाय पारिवारिक क्षति का विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: ኢሀሎ
  choice: अब नहीं रहा
  rationale: शाब्दिक ‘नहीं है’ हिंदी में अस्पष्ट और अस्वाभाविक होता; संदर्भ में खो जाने या मृत मान लिए जाने का भाव है, पर मृत्यु को निश्चित घोषित नहीं किया गया।
- source_word: ወስምዖንሂ
  choice: और शिमोन भी
  rationale: संयोजक और बलसूचक अव्यय दोनों को ‘और...भी’ से व्यक्त किया गया है।
theological_decisions:
- issue: यूसुफ और शिमोन की अनुपस्थिति का अर्थ
  choice: अब नहीं रहा
  alternative: मर गया है
  rationale: पाठ केवल उनके ‘न होने’ की बात कहता है। ‘मर गया है’ अनिश्चित स्थिति को निश्चित मृत्यु में बदल देता, इसलिए मूल की व्यंजना और तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली। ‘संतान-विहीन’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के विशिष्ट शोक को व्यक्त करता है। अंतिम त्रिबिंदु दिए गए अंश की अपूर्णता दर्शाता है।
