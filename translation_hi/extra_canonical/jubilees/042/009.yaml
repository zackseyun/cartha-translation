translation:
  language: hi
  text: '[उनका] छोटा भाई,[a] क्योंकि उन्होंने उसे बताया था कि उनका पिता जीवित है और उनका छोटा भाई भी। फिर वे मिस्र देश से ऊपर चढ़कर कनान देश पहुँचे। उन्होंने अपने पिता को वह सब बताया जो उनके साथ हुआ था—यह भी कि उस देश के शासक ने उनसे कितनी कठोरता से बात की और शिमोन को तब तक पकड़ रखा...[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद मूल पाठ में पिछले वाक्य से जुड़े शब्द ‘छोटा’ से आरम्भ होता है। ‘उनका’ अर्थ स्पष्ट करने के लिए जोड़ा गया है।
    reason: verse_boundary_fragment
  - marker: b
    text: मूल में वाक्य यहाँ पूरा नहीं होता; उसका अगला भाग अगले पद में आता है।
    reason: cross_verse_syntax
lexical_decisions:
- source_word: ንእስ / ዘይንእስ
  choice: '[उनका] छोटा भाई / उनका छोटा भाई'
  rationale: मूल में आयु की दृष्टि से छोटे भाई का उल्लेख है। आरम्भिक ንእስ पिछले वाक्य से जुड़ा हुआ खंड प्रतीत होता है; हिंदी में संबंध स्पष्ट करने के लिए पूरित शब्द को कोष्ठकों में रखा गया है।
- source_word: ወዐርጉ
  choice: ऊपर चढ़कर
  rationale: मिस्र से कनान जाने के लिए प्रयुक्त स्रोत की दिशात्मक अभिव्यक्ति को बनाए रखता है और हिंदी में स्वाभाविक है।
- source_word: ወአፎ
  choice: यह भी कि ... कितनी
  rationale: यह शब्द ढंग या रीति, अर्थात ‘कैसे’, का बोध देता है। हिंदी में ‘कितनी कठोरता से’ उसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: መኰንነ፡ ብሔር
  choice: उस देश के शासक
  rationale: दोनों स्रोत पदों का सीधा और संदर्भानुकूल अर्थ है।
- source_word: ዐጹባጺበ
  choice: कितनी कठोरता से
  rationale: शासक के कठोर या रूखे ढंग से बोलने का भाव व्यक्त करता है, बिना अतिरिक्त आशय जोड़े।
- source_word: ወአሐዘ፡ ለስምዖን
  choice: शिमोन को ... पकड़ रखा
  rationale: क्रिया का अर्थ पकड़ने या हिरासत में रखने का है; प्रसंग में ‘पकड़ रखा’ सरल और सटीक है।
- source_word: እስከ፡ ሶበ
  choice: तब तक ...
  rationale: यह ‘उस समय तक जब...’ के अर्थ में अगले उपवाक्य की भूमिका बाँधता है; वर्तमान पद पर वाक्य पूरा नहीं होता।
