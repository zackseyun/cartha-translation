translation:
  language: hi
  text: उसे उनकी बोरियों में रखवा दिया, और उन्हें यह पता न चला। फिर उसने उन्हें आज्ञा दी कि वे अपने सबसे छोटे भाई को ले आएँ, क्योंकि उन्होंने उसे बताया था कि उनका पिता जीवित है और उनका सबसे छोटा भाई भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕስሊሆሙ
  choice: उनकी बोरियों में
  rationale: संदर्भ और परामर्श-पाठ के अनुसार यह यूसुफ के भाइयों की अनाज की बोरियों को सूचित करता है; उपलब्ध गीइज़ अंश वाक्य के बीच से आरम्भ होता है।
- source_word: ወኢያእመሩ
  choice: और उन्हें इसका पता न चला
  rationale: गीइज़ क्रिया का अर्थ ‘उन्होंने नहीं जाना’ है; स्वाभाविक हिन्दी में पूर्ववर्ती घटना की ओर संकेत करने के लिए ‘इसका पता’ रखा गया।
- source_word: ወአዘዞሙ
  choice: फिर उसने उन्हें आज्ञा दी
  rationale: मूल में आदेश देने का स्पष्ट भाव है; ‘फिर’ कथानक के अगले चरण को सहज रूप से जोड़ता है।
- source_word: ከመ፡ ያምጽኡ
  choice: कि वे ... ले आएँ
  rationale: आदेश के आशय को आधुनिक मानक हिन्दी में स्वाभाविक पराश्रित रचना से व्यक्त किया गया।
- source_word: እኅዋሆሙ
  choice: अपने ... भाई को
  rationale: शाब्दिक अर्थ ‘उनका भाई’ है; कर्ता के साथ संबंध स्पष्ट करने हेतु हिन्दी में ‘अपने’ स्वाभाविक है।
