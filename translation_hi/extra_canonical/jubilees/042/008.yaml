  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। उपलब्ध गीइज़ पाठ खंडित है और ‘ዘይ’ पर कटता है; इसलिए शेष वाक्य के लिए उसी पद के प्रमाणित अंग्रेज़ी परामर्श-पाठ का सहारा लिया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
