lexical_decisions:
- source_word: ዓመት፡ ዘሱባዔ፡ ሣልስ
  choice: तीसरे सप्ताह के पहले वर्ष
  rationale: गीज़ की कालगणना-संबंधी पदावली को उसके क्रमिक संबंध सहित स्वाभाविक हिन्दी में रखा गया है।
- source_word: ዘ፵ወ፭፡ ኢዮቤልው
  choice: पैंतालीसवीं जयन्ती
  rationale: ‘इयोबेल’ को जुबिली-कालचक्र के अर्थ में ‘जयन्ती’ से व्यक्त किया गया है, संख्या और स्त्रीलिंग क्रमवाचक रूप बनाए रखते हुए।
- source_word: ዐባር
  choice: अकाल
  rationale: संदर्भ में यह शब्द अन्नाभाव/दुर्भिक्ष को सूचित करता है; आधुनिक पाठक के लिए ‘अकाल’ स्पष्ट और स्वाभाविक है।
- source_word: ይምጻእ፡ ውስተ
  choice: देश में आ रहा था
  rationale: आगतिशील क्रिया का पक्ष सुरक्षित रखा गया है; स्रोतांश के अंत में स्थान-संज्ञा अनुपस्थित है, जिसे परामर्श-पाठ के आधार पर ‘देश’ से पूरा किया गया है।
