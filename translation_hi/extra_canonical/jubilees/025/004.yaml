  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, आत्मीय मातृ-संबोधन रखा गया है। प्राचीन पारिवारिक संबोधन के अनुरूप ‘तू/तुझ’ का प्रयोग अनादर के लिए नहीं, निकटता के लिए है।
