  text: But I[a], my son, love you exceedingly, and my heart and my affection will bless you at all times, by day and in the watches of the night.
translation:
  language: hi
  text: परन्तु हे मेरे पुत्र, मैं तुझसे अत्यन्त प्रेम करती हूँ, और मेरा हृदय और मेरा स्नेह हर समय—दिन में और रात के पहरों में[a]—तुझे आशीष देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पंक्ति का अंतिम पदसमूह पाठ और विभाजन की दृष्टि से कठिन है; यहाँ उसका आशय समग्र समय से लिया गया है—‘दिन में और रात के पहरों में।’
    reason: segmentation_note
lexical_decisions:
- source_word: አፈቅረከ፡ ጥቀ፡ ፈድፋደ
  choice: तुझसे अत्यन्त प्रेम करती हूँ
  rationale: क्रिया के तीव्रतासूचक पदों को स्वाभाविक हिन्दी में ‘अत्यन्त’ से व्यक्त किया गया है; स्त्री वक्ता के प्रसंग के अनुरूप ‘करती हूँ’ रखा गया है।
- source_word: ልብየ፡ ወምሕረትየ
  choice: मेरा हृदय और मेरा स्नेह
  rationale: दोनों समन्वित संज्ञाओं को अलग बनाए रखा गया है; ምሕረት यहाँ मातृ-स्नेह/करुण अनुराग के अर्थ में है।
- source_word: ይባርከከ
  choice: तुझे आशीष देंगे
  rationale: मूल के आशीष देने वाले क्रियार्थ को सुरक्षित रखा गया है और संयुक्त कर्ता ‘हृदय और स्नेह’ के अनुसार हिन्दी में बहुवचन किया गया है।
- source_word: በኵሉ፡ ጊዜ
  choice: हर समय
  rationale: कालगत व्यापकता को सरल और वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: ዕለት፡ ወዐቃቤ፡ ለያልይ
  choice: दिन में और रात के पहरों में
  rationale: अंतिम पदसमूह को दिन और रात के पहरों की समग्रता बताने वाले युग्म के रूप में रखा गया है, बिना उसकी पाठगत कठिनाई छिपाए।
