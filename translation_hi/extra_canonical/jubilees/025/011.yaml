  yaml_path: translation/extra_canonical/jubilees/025/011.yaml
  text: I swear before you all the days of my life that I will not take a wife for myself from the daughters of the seed of Canaan, and that I will not act wickedly as Esau did.
translation:
  language: hi
  text: मैं जीवन भर तुम्हारे सामने यह शपथ खाता हूँ कि मैं कनान के वंश की बेटियों में से अपने लिए पत्नी नहीं लूँगा और एसाव की तरह बुराई नहीं करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሕለ፡ አነ፡ እም፡ ቅድሜኪ
  choice: मैं तुम्हारे सामने यह शपथ खाता हूँ
  rationale: क्रिया शपथ खाने और ቅድሜኪ स्त्रीलिंग एकवचन संबोधन में ‘तुम्हारे सामने’ का भाव देती है। हिंदी में स्वाभाविक प्रत्यक्ष-वचन क्रम रखा गया है।
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘मेरे जीवन के सभी दिन’ है; ‘जीवन भर’ उसी अवधि को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ብእሲተ፡ እምአዋልደ፡ ዘርአ፡ ከናአን
  choice: कनान के वंश की बेटियों में से अपने लिए पत्नी
  rationale: ‘कनान के बीज/वंश की बेटियों में से स्त्री’ का अर्थ सुरक्षित रखते हुए हिंदी में विवाह-संदर्भ के लिए ‘पत्नी’ चुना गया है।
- source_word: ወኢያአኪ፡ ገቢረ፡ በከመ፡ ገብረ፡ ዔሳው
  choice: और एसाव की तरह बुराई नहीं करूँगा
  rationale: ያአኪ बुराई करने का स्पष्ट मूल्यांकन रखता है; इसलिए इसे केवल ‘वैसा नहीं करूँगा’ बनाकर नैतिक अर्थ हटाया नहीं गया। በከመ፡ ገብረ፡ ዔሳው तुलना को ‘एसाव की तरह’ व्यक्त करता है।
theological_decisions:
- issue: एसाव के कार्य का नैतिक वर्णन
  choice: बुराई नहीं करूँगा
  alternative: एसाव ने जैसा किया, वैसा नहीं करूँगा
  rationale: गीज़ पाठ में बुराई करने वाली क्रिया स्पष्ट है। तटस्थ विकल्प स्रोत में उपस्थित नैतिक मूल्यांकन को दबा देता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सरल। प्रतिज्ञा की गंभीरता बनाए रखने के लिए ‘शपथ खाता हूँ’ और विवाह-निषेध के लिए सीधी, सामान्य शब्दावली प्रयुक्त हुई है।
