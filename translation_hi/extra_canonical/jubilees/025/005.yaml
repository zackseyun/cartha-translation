base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/005.yaml
  text: And now[a], my son, listen to my voice and do the will of your mother, and do not take for yourself a wife from the daughters of this land; rather, from my father’s house and from my father’s kindred you shall take a wife for yourself. And God Most High will bless you, and your children will be a righteous offspring and a holy seed.
translation:
  language: hi
  text: और अब[a], मेरे बेटे, मेरी बात सुन और अपनी माँ की इच्छा पूरी कर। इस देश की बेटियों में से अपने लिए पत्नी मत लेना; बल्कि मेरे पिता के घराने और मेरे पिता के कुल में से अपने लिए पत्नी लेना। और परमप्रधान परमेश्वर तुझे आशीष देगा, और तेरी संतान धर्मी वंश और पवित्र बीज होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में ‘मेरे पिता के घराने से’ के आसपास कुछ पुनरावृत्ति मिलती है। यह बल देने की शैली हो सकती है, या उपलब्ध पाठ के खंड-विभाजन की समस्या।
    reason: segmentation_note
lexical_decisions:
- source_word: ቃለየ
  choice: मेरी बात
  rationale: शाब्दिक अर्थ ‘मेरी वाणी’ है; आज की स्वाभाविक हिन्दी में मातृ-आज्ञा के संदर्भ में ‘मेरी बात सुन’ अधिक सहज है।
- source_word: ግበር፡ ፈቃደ፡ ለአምከ
  choice: अपनी माँ की इच्छा पूरी कर
  rationale: मूल के ‘अपनी माँ की इच्छा कर/पूरी कर’ को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है, बिना इसे केवल ‘आज्ञा मान’ तक सीमित किए।
- source_word: ቤተ፡ አቡየ / ዘመደ፡ አቡየ
  choice: मेरे पिता के घराने / मेरे पिता के कुल
  rationale: घर और व्यापक रिश्तेदारी के निकटस्थ किंतु अलग सामाजिक आयामों को बनाए रखने के लिए दो पद प्रयुक्त किए गए हैं।
- source_word: አምላከ፡ ልዑል
  choice: परमप्रधान परमेश्वर
  rationale: दैवी उपाधि ‘Most High God’ का प्रतिष्ठित और स्पष्ट हिन्दी रूप।
- source_word: ትውልደ፡ ጽድቅ፡ ወዘርአ፡ ቅዱሰ
  choice: धर्मी वंश और पवित्र बीज
  rationale: ‘धार्मिकता का वंश’ की अपेक्षा ‘धर्मी वंश’ अधिक स्वाभाविक है; ‘पवित्र बीज’ मूल की वंशावली-संबंधी प्रतीकात्मक भाषा सुरक्षित रखता है।
theological_decisions:
- issue: आशीष और धर्मी संतान के बीच संबंध
  choice: ‘तब’ द्वारा प्रसंगगत परिणाम-संबंध व्यक्त किया, पर कठोर शर्तात्मक प्रतिज्ञा नहीं बनाई
  alternative: ‘और’ से सभी खंडों को केवल समानांतर रखना
  rationale: मूल में संयोजक ‘और’ है, पर मातृ-निर्देश के बाद आशीष का वचन परिणामात्मक प्रवाह रखता है। ‘तब’ हिन्दी में यह प्रवाह स्वाभाविक बनाता है, बिना किसी अतिरिक्त सिद्धान्त को जोड़ने के।
- issue: ‘पवित्र बीज’ का अर्थ
  choice: रूपक को यथावत रखा
  alternative: ‘पवित्र वंशज’ कहकर रूपक खोल देना
  rationale: मूल की धार्मिक और वंशावलीगत तनावपूर्ण छवि को व्याख्यात्मक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय मातृ-संबोधन के अनुरूप एकवचन ‘तू’ के सम्मानहीन नहीं बल्कि निकट पारिवारिक क्रियारूपों के साथ; भाषा सरल, गरिमापूर्ण और वाचनयोग्य रखी गई है।
