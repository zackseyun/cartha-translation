  text: And despite all this that he has commanded me[a], these twenty-two years Esau has been urging me and pressing me, speaking to me and saying, ‘My brother, take a wife, one of the sisters of my two wives,’ but I have not been willing to do as he did.
translation:
  language: hi
  text: और उसने मुझे जो कुछ करने की आज्ञा दी है, उस सबके बावजूद,[a] इन बाईस वर्षों से एसाव मुझसे आग्रह करता और मुझ पर दबाव डालता रहा है, मुझसे कहते हुए, ‘मेरे भाई, मेरी दोनों पत्नियों की बहनों में से किसी एक को अपनी पत्नी बना ले।’ पर मैं वह करने को तैयार नहीं हुआ जो उसने किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ का आरम्भिक वाक्यांश शाब्दिक रूप से ‘और इस सबके साथ, जिसकी उसने मुझे आज्ञा दी’ भी समझा जा सकता है; यहाँ प्रसंग के विरोधसूचक भाव के कारण ‘उस सबके बावजूद’ किया गया है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወምስለ፡ ኵሉ፡ ዘአዘዘኒ፡ ዘንተ
  choice: और जो कुछ उसने मुझे करने की आज्ञा दी है, उस सबके बावजूद
  rationale: ‘ዘአዘዘኒ’ के आज्ञा देने के अर्थ को स्पष्ट रखा गया और आरम्भिक वाक्यांश का विरोधसूचक बल ‘उस सबके बावजूद’ से व्यक्त किया गया।
- source_word: ይትኃአዘኒ፡ ወያበዝኀ
  choice: मुझसे आग्रह करता और मुझ पर दबाव डालता रहा है
  rationale: दोनों समांतर क्रियाओं को बनाए रखते हुए दीर्घकालीन और बार-बार किए गए आग्रह का स्वाभाविक हिन्दी रूप दिया गया।
- source_word: ንሣእ፡ ብእሲተ
  choice: अपनी पत्नी बना ले
  rationale: शाब्दिक ‘एक स्त्री ले’ के वैवाहिक आशय को आधुनिक, सहज हिन्दी में व्यक्त किया गया।
- source_word: አሐተ፡ እኅትነ፡ ለአንስቲያየ፡ ክልኤቲ
  choice: मेरी दोनों पत्नियों की बहनों में से किसी एक को
  rationale: स्रोत की संख्या और संबंध को सुरक्षित रखते हुए हिन्दी में संभावित चयन का अर्थ स्पष्ट किया गया।
- source_word: ኢይፈቅድ፡ እግበር፡ ከመ፡ ገብረ፡ ውእቱ
  choice: मैं वह करने को तैयार नहीं हुआ जो उसने किया
  rationale: इच्छा/सहमति के अभाव और एसाव के आचरण से तुलना—दोनों को बिना अतिरिक्त व्याख्या के रखा गया।
theological_decisions:
- issue: आज्ञा देने वाले सर्वनाम ‘उसने’ का संदर्भ
  choice: मुख्य पाठ में ‘उसने’ को अनिर्दिष्ट रखा गया
  alternative: संदर्भ का अनुमान लगाकर किसी व्यक्ति या परमेश्वर का नाम जोड़ना
  rationale: स्रोत में कर्ता सर्वनाम से व्यक्त है; नाम जोड़ना वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘आग्रह’ और ‘दबाव’ से स्रोत की दोनों क्रियाएँ सुरक्षित रखी गई हैं; अस्पष्ट सर्वनाम का संदर्भ नहीं भरा गया।
