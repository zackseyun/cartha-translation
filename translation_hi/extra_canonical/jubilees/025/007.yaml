base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/007.yaml
  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
translation:
  language: hi
  text: क्योंकि मुझे हमारे पिता अब्राहम का वचन याद है[a]; उन्होंने मुझे आज्ञा दी थी कि मैं कनान की बेटियों में से पत्नी न लूँ, बल्कि अपने पिता के घराने की संतति और अपने कुटुम्ब में से अपने लिए पत्नी लूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “हमारे पिता अब्राहम ने मुझसे जो कहा था, वह मुझे याद है: उन्होंने मुझे आज्ञा दी थी...”'
    reason: आरंभिक वाक्य-विन्यास को ‘अब्राहम का वचन’ अथवा ‘अब्राहम ने जो कहा’—दोनों प्रकार से समझकर व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ነገረ፡ አብርሃም፡ አቡነ
  choice: हमारे पिता अब्राहम का वचन
  rationale: ‘वचन’ मूल के संज्ञात्मक रूप को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: እምአወልደ፡ ከናአን
  choice: कनान की बेटियों में से
  rationale: मूल के संबंधवाचक बहुवचन का सीधा और स्पष्ट अनुवाद।
- source_word: እምዘርአ፡ ቤተ፡ አቡየ
  choice: अपने पिता के घराने के वंश में से
  rationale: ‘वंश’ स्रोत के ‘बीज/संतति’ संबंधी पद का स्वाभाविक हिन्दी समतुल्य है; ‘घराना’ पारिवारिक इकाई को व्यक्त करता है।
- source_word: ወእምዘመድየ
  choice: और अपने कुटुम्ब में से
  rationale: ‘कुटुम्ब’ रक्त-संबंधी व्यापक परिवार का अर्थ देता है और ‘पिता के घराने’ से संबंधित किंतु अलग पद को बनाए रखता है।
theological_decisions:
- issue: विवाह के लिए समूह-सीमा संबंधी आज्ञा
  choice: कनान की बेटियों में से पत्नी न लूँ, बल्कि अपने पिता के घराने के वंश और अपने कुटुम्ब में से
  alternative: कनानी स्त्री से विवाह न करूँ, बल्कि अपने संबंधियों में विवाह करूँ
  rationale: चुना हुआ रूप स्रोत की दोहरी पारिवारिक अभिव्यक्ति और ‘बेटियों में से’ की भाषा को सुरक्षित रखता है; इसे किसी व्यापक धार्मिक विवाह-सिद्धांत में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘पत्नी लूँ’ स्रोत की ग्रहण करने वाली अभिव्यक्ति को बनाए रखता है, जबकि ‘बल्कि’ निषेध और अपेक्षित विकल्प के बीच स्वाभाविक हिन्दी विरोध स्थापित करता है।
