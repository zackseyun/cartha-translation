review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the prohibition against taking a wife from the daughters of Canaan and the positive instruction to take one from the speaker’s paternal household and kin. However, ‘अपने पिता के घराने के वंश’ is an unnatural genitive sequence in Hindi and can be made clearer without reducing the source’s ‘seed/offspring’ sense.
  naturalness: The overall register is appropriate, but ‘घराने के वंश’ is stylistically cumbersome. ‘अपने पिता के घराने की संतति’ is natural modern standard Hindi and retains the familial-lineage meaning.
  terminology: ‘वचन,’ ‘कनान,’ ‘पत्नी,’ and ‘कुटुम्ब’ are suitable. ‘संतति’ is a more idiomatic equivalent for the source expression ‘seed of my father’s house’ in this context.
  issues:
  - severity: low
    issue: Awkward expression ‘अपने पिता के घराने के वंश’
    rationale: In modern Hindi, a household does not naturally take ‘वंश’ as a dependent genitive in this form. ‘अपने पिता के घराने की संतति’ clearly conveys descendants/lineage from the paternal household while preserving the distinction from ‘अपने कुटुम्ब।’
  revised_text: क्योंकि मुझे हमारे पिता अब्राहम का वचन याद है[a]; उन्होंने मुझे आज्ञा दी थी कि मैं कनान की बेटियों में से पत्नी न लूँ, बल्कि अपने पिता के घराने की संतति और अपने कुटुम्ब में से अपने लिए पत्नी लूँ।
