  yaml_path: translation/extra_canonical/jubilees/025/002.yaml
  text: And she spoke to him, saying, “My son, do not take for yourself a wife from the daughters of Canaan, as Esau your brother did, who took for himself two wives from the daughters of Canaan, and they have made my spirit bitter by all their unclean conduct.”
translation:
  language: hi
  text: और उसने उससे कहा, “मेरे बेटे, अपने लिए कनान की बेटियों में से कोई पत्नी मत लेना, जैसा तेरे भाई एसाव ने किया, जिसने कनान की बेटियों में से दो स्त्रियों को अपनी पत्नियों के रूप में लिया; और उन्होंने अपने सारे अशुद्ध आचरण से मेरे मन को कड़वाहट से भर दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: मेरे बेटे
  rationale: स्रोत के आत्मीय मातृ-संबोधन को आधुनिक और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ኢትንሣእ፡ ለከ፡ ብእሲተ
  choice: अपने लिए ... कोई पत्नी मत लेना
  rationale: ‘लेना’ विवाह करने का स्रोत-संगत सामी मुहावरा है; ‘कोई’ निषेध को हिन्दी में स्वाभाविक बनाता है।
- source_word: እም፡ አዋልደ፡ ከናአን
  choice: कनान की बेटियों में से
  rationale: वंश अथवा समुदाय की स्त्रियों के लिए प्रयुक्त मूल अभिव्यक्ति का पारंपरिक और स्पष्ट रूप।
- source_word: ወእምረርዋ፡ ለመንፈሰያ
  choice: मेरे मन को कड़वाहट से भर दिया है
  rationale: शाब्दिक ‘मेरी आत्मा को कड़वा किया’ का भाव सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: በኵሉ፡ ምግባሮሙ፡ ርኵስ
  choice: अपने सारे अशुद्ध आचरण से
  rationale: मूल में आचरण की नैतिक/धार्मिक अशुद्धता को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ‘अशुद्ध’ आचरण का आशय
  choice: अशुद्ध आचरण
  alternative: दुष्ट कर्म
  rationale: ‘अशुद्ध’ मूल शब्द की शुद्धता-संबंधी तथा नैतिक व्यापकता और संभावित तनाव को सुरक्षित रखता है; इसे केवल सामान्य दुष्टता तक सीमित नहीं करता।
- issue: ‘मेरी आत्मा’ का हिन्दी रूप
  choice: मेरे मन
  alternative: मेरी आत्मा
  rationale: यहाँ ‘आत्मा’ व्यक्ति के भीतरी भाव अथवा चित्त को सूचित करती है; ‘मन’ हिन्दी में कथन का भाव अधिक स्वाभाविक ढंग से देता है, बिना किसी विशिष्ट आत्मा-विज्ञान को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पारिवारिक संवाद। रिबका के स्त्रीलिंग कर्ता को ‘उसने’ से संदर्भानुसार व्यक्त किया गया है। याकूब को संबोधन में निकटता के लिए ‘तेरे’ रखा गया है, जबकि वाक्यरचना साधारण पाठकों के लिए स्पष्ट और प्रवाहपूर्ण है।
