  text: '"Do not fear, mother; be assured that I will do your will and walk in uprightness, and I will never corrupt my ways."'
translation:
  language: hi
  text: “मत डर, माँ। यक़ीन रख कि मैं तेरी इच्छा पूरी करूँगा, सीधेपन के साथ चलूँगा, और अपने मार्गों को कभी भी बिगाड़ूँगा नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍርሂ
  choice: मत डर
  rationale: स्त्रीलिंग एकवचन निषेधात्मक आज्ञा का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: ትእመኒ
  choice: भरोसा रख
  rationale: मातृ-संबोधन के अनौपचारिक एकवचन के अनुरूप; आश्वस्त होने या विश्वास रखने का भाव व्यक्त करता है।
- source_word: ፈቃደኪ
  choice: तेरी इच्छा
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन संबंधसूचक रूप को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ወበርትዕ፡ አሐውር
  choice: सीधाई से चलूँगा
  rationale: नैतिक सीधेपन और जीवन-चाल की स्रोत-छवि दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ወኢያማስን፡ ፍናውየ፡ ለዓለም
  choice: और अपने मार्गों को कभी भ्रष्ट नहीं करूँगा
  rationale: मार्गों की रूपकात्मक भाषा बनाए रखते हुए स्थायी निषेध को ‘कभी नहीं’ से व्यक्त करता है।
theological_decisions:
- issue: नैतिक चाल और मार्गों का रूपक
  choice: ‘सीधाई से चलूँगा’ और ‘अपने मार्गों को ... भ्रष्ट नहीं करूँगा’
  alternative: ‘सच्चाई से जीवन बिताऊँगा और कभी बिगड़ूँगा नहीं’
  rationale: स्रोत में उपस्थित चलने और मार्गों की अलग-अलग छवियों को बिना किसी अतिरिक्त धार्मिक व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। माँ-बेटे के निकट संबंध के कारण ‘माँ/तेरी/रख’ का आत्मीय एकवचन प्रयोग किया गया है; प्रत्यक्ष कथन के उद्धरण-चिह्न पूर्ण रखे गए हैं।
