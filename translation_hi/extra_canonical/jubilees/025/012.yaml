review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the feminine-singular address to the mother, the commitment to do her will, upright conduct, and the enduring denial of corrupting his ways. ‘कभी’ adequately conveys the emphatic enduring negation, though ‘कभी भी’ makes it explicit.
  naturalness: ‘सीधाई से चलूँगा’ and especially ‘अपने मार्गों को ... भ्रष्ट नहीं करूँगा’ are understandable but somewhat wooden in modern standard Hindi. ‘सीधेपन के साथ चलूँगा’ and ‘अपने मार्गों को कभी भी बिगाड़ूँगा नहीं’ retain the source imagery more idiomatically.
  terminology: No doctrinal terminology is at issue. ‘मार्गों’ preserves the source’s moral-path metaphor without importing interpretation.
  issues:
  - severity: low
    issue: ‘सीधाई से’ is less natural than ‘सीधेपन के साथ’ in this moral-conduct context.
    rationale: The Ge’ez expresses walking in uprightness; the revision is standard contemporary Hindi while retaining the walking image.
  - severity: low
    issue: ‘मार्गों को भ्रष्ट करना’ is not idiomatic Hindi collocation.
    rationale: ‘मार्गों को ... बिगाड़ना’ naturally conveys corrupting one’s ways while preserving the plural ‘ways’ metaphor.
