translation:
  language: hi
  text: और इस जयन्ती के इस सप्ताह के दूसरे वर्ष में रिबका ने अपने पुत्र याकूब को बुलाया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበካልእ፡ ዓመት
  choice: और ... दूसरे वर्ष में
  rationale: संयोजक ወ और कालसूचक በ के साथ ካልእ ዓመት का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ዘዝ፡ ሱባዔ
  choice: इस सप्ताह के
  rationale: गीज़ में संकेतवाचक 'इस' है; संदर्भ से इसे चुपचाप 'सातवाँ सप्ताह' नहीं बनाया गया।
- source_word: በዝ፡ አምቤልዉ
  choice: इस जयन्ती के ... में
  rationale: በዝ का अर्थ 'इस ... में' रखा गया और አምቤልዉ को ग्रन्थ की कालगणना के तकनीकी पद 'जयन्ती' से व्यक्त किया गया।
- source_word: ጸውዐት፡ ርብቃ፡ ያዕቆብሃ፡ ወልዳ
  choice: रिबका ने अपने पुत्र याकूब को बुलाया
  rationale: कर्ता, क्रिया और संबंधसूचक सर्वनाम को आधुनिक मानक हिन्दी के स्वाभाविक क्रम में रखा गया।
theological_decisions:
- issue: सप्ताह की पहचान
  choice: इस सप्ताह
  alternative: इस जयन्ती का सातवाँ सप्ताह
  rationale: मूल पाठ ዘዝ፡ ሱባዔ स्पष्टतः 'इस सप्ताह' कहता है। पूर्व प्रसंग भले सातवें सप्ताह की पहचान कराता हो, पर उसे पद में जोड़ना मूल की संकेतात्मकता को अनावश्यक रूप से स्पष्ट कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। 'जयन्ती' को पचास-वर्षीय कालखंड के तकनीकी अर्थ में रखा गया है। वाक्य के अंत का अल्पविराम मूल और उपलब्ध अंग्रेज़ी पाठ की अगले कथन से निरंतरता दर्शाता है।
