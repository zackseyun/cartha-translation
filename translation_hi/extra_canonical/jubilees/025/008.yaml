  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पत्नी के रूप में लूँ’ में मूल प्रथम पुरुष को बनाए रखा गया है; संभावित लाभार्थी को व्याख्यात्मक रूप से नहीं जोड़ा गया।
