  yaml_path: translation/extra_canonical/jubilees/025/008.yaml
  text: And I heard previously that daughters had been born to Laban, your brother, and I set my heart on them, that I might take a wife from among them.
translation:
  language: hi
  text: और मैंने पहले ही सुना था कि तुम्हारे भाई लाबान के यहाँ बेटियाँ पैदा हुई थीं, और मैंने उन पर अपना मन लगाया था, ताकि मैं उनमें से एक को पत्नी के रूप में ले सकूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምቀዲሙ
  choice: पहले ही
  rationale: पूर्वकाल का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ትወልዲ፡ አዋልደ፡ ለላባ
  choice: लाबान के यहाँ बेटियाँ पैदा हुई हैं
  rationale: गीज़ की जन्म-संबंधी अभिव्यक्ति को सहज हिन्दी में प्रस्तुत करता है और लाबान को बेटियों के पिता के रूप में स्पष्ट रखता है।
- source_word: አንበርኩ፡ ልብየ፡ ላዕሌሆን
  choice: मैंने उन्हीं पर अपना मन लगाया
  rationale: शाब्दिक रूप से ‘मैंने अपना हृदय उन पर रखा’ के संकल्प और झुकाव दोनों को बनाए रखता है।
- source_word: እንሣእ፡ እምኔሆን፡ ብእሲተ
  choice: उनमें से एक को पत्नी के रूप में लूँ
  rationale: ‘उनमें से पत्नी लेना’ का अर्थ सुरक्षित रखता है और पत्नी किसके लिए ली जाएगी, इस विषय में स्रोत से अधिक स्पष्टता नहीं जोड़ता।
