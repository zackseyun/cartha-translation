review_pass:
  verdict: revise
  source_fidelity: Draft broadly conveys the verse, but its present-perfect ‘पैदा हुई हैं’ is inconsistent with the prior report and the source’s past narrative setting. ‘इसलिए’ introduces an explicit causal connector not stated in the source, and ‘उन्हीं’ adds emphasis absent from the text.
  naturalness: The revised wording is natural, formal modern Hindi and retains the source’s sequential sense without making the relationship more explicit than the text does.
  terminology: ‘मन लगाया’ suitably represents the idiom of setting one’s heart on them, while ‘पत्नी के रूप में ले सकूँ’ preserves the source’s ‘take a wife from among them’ without supplying a doctrinal or interpretive beneficiary.
  issues:
  - severity: medium
    issue: Tense mismatch in ‘बेटियाँ पैदा हुई हैं’.
    rationale: The source and English audit trail refer to daughters having been born previously; Hindi pluperfect ‘पैदा हुई थीं’ preserves that temporal relation.
  - severity: low
    issue: Added causal ‘इसलिए’ and emphatic ‘उन्हीं’.
    rationale: The source coordinates the clauses and expresses purpose, but does not explicitly say ‘therefore’ or emphasize ‘those very ones’.
  revised_text: और मैंने पहले ही सुना था कि तुम्हारे भाई लाबान के यहाँ बेटियाँ पैदा हुई थीं, और मैंने उन पर अपना मन लगाया था, ताकि मैं उनमें से एक को पत्नी के रूप में ले सकूँ।
