  text: For all their conduct is fornication and impurity, and there is no righteousness with them, for it is evil.
translation:
  language: hi
  text: क्योंकि उनका सारा आचरण व्यभिचार और अशुद्धता है, और उनमें कोई धार्मिकता नहीं है, क्योंकि वह बुरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ምግባሮሙ
  choice: उनका सारा आचरण
  rationale: समष्टिगत अर्थ और नैतिक व्यवहार के संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ዝሙት
  choice: व्यभिचार
  rationale: यह यौन अनैतिकता/व्यभिचार का प्रबल नैतिक अर्थ व्यक्त करता है और यहाँ आरोप की गंभीरता बनाए रखता है।
- source_word: ምርጓት
  choice: अशुद्धता
  rationale: स्रोत के नैतिक अपवित्रता-सूचक पद के लिए व्यापक और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: ጽድቀ
  choice: धार्मिकता
  rationale: नैतिक न्यायशीलता और सही आचरण, दोनों से जुड़े अर्थ को सुरक्षित रखता है।
- source_word: እኩይ
  choice: बुरा
  rationale: स्रोत के सामान्य नैतिक विशेषण को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सीधे प्रस्तुत करता है।
theological_decisions:
- issue: अंतिम एकवचन कथन ‘वह बुरा है’ का संदर्भ
  choice: अस्पष्ट एकवचन संदर्भ को बनाए रखा गया
  alternative: ‘उनका आचरण बुरा है’ या ‘वे बुरे हैं’
  rationale: स्रोत में एकवचन सर्वनाम/विधेय है और उसका सटीक पूर्वपद पूरी तरह स्पष्ट नहीं; अनुवाद में उसे चुपचाप निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप; स्रोत की कठोर नैतिक भाषा तथा अंतिम वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
