  yaml_path: translation/extra_canonical/jubilees/025/006.yaml
  text: Then Jacob spoke with Rebekah his mother and said to her[a], “Look, I am now a son of nine weeks of years, and I do not know a woman, nor have I touched one, nor have I become engaged, nor do I intend to take a wife for myself from the daughters of Canaan.”
translation:
  language: hi
  text: तब याकूब ने अपनी माता रिबका से बात की और उससे कहा, “देख, मैं अब नौ वर्ष-सप्ताहों का हो चुका हूँ,[a] फिर भी मैंने किसी स्त्री को नहीं जाना, न किसी को छुआ है, न मैंने किसी से सगाई की है; और कनान की बेटियों में से किसी को अपनी पत्नी बनाने का मेरा कोई विचार नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नौ वर्ष-सप्ताह’ अर्थात तिरसठ वर्ष; मुख्य पाठ में जुबिलीज़ की अपनी कालगणनात्मक अभिव्यक्ति रखी गई है।
    reason: cultural_note
lexical_decisions:
- source_word: ተናገረ፡ ... ምስለ፡
  choice: से बात की
  rationale: गीज़ पदबंध का स्वाभाविक हिन्दी रूप; इसके बाद आने वाला ‘उससे कहा’ कथन की शुरुआत स्पष्ट करता है।
- source_word: ወልደ፡ ተስዓተ፡ ሱባዔ፡ ዓመት፡
  choice: नौ वर्ष-सप्ताहों का हो चुका हूँ
  rationale: मूल की कालगणनात्मक अभिव्यक्ति को बनाए रखता है; इसका अर्थ तिरसठ वर्ष है।
- source_word: ኢያአምር፡ ... አንስቲ፡
  choice: मैंने किसी स्त्री को नहीं जाना
  rationale: ‘जानना’ यहाँ यौन संबंध का विनीत संकेत है; मूल की अर्थ-परत को स्पष्ट किए बिना सुरक्षित रखा गया है।
- source_word: ወአገስስኩ፡
  choice: न किसी को छुआ है
  rationale: क्रिया का सीधा अर्थ ‘छूना’ है और यहाँ पूर्ववर्ती कथन के समानांतर आता है।
- source_word: ወአፈፃርኩ፡
  choice: न मेरी सगाई हुई है
  rationale: सगाई/वाग्दान की स्वतंत्र क्रिया को छोड़े बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወኢይሔሊኒ፡ እንሣእ፡ ብእሲተ፡
  choice: किसी को अपनी पत्नी बनाने का मेरा कोई विचार नहीं है
  rationale: ‘सोचना/विचार करना/इरादा रखना’ की स्पष्ट भावार्थ-शक्ति सुरक्षित है; इसे केवल भविष्यकाल ‘न लूँगा’ नहीं बनाया गया।
- source_word: እምአዋልደ፡ ከናአን፡
  choice: कनान की बेटियों में से
  rationale: मूल के पारंपरिक सामूहिक पदबंध का औपचारिक किंतु सुबोध हिन्दी रूप।
