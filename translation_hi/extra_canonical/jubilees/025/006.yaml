  source_fidelity: 'The draft retains all four elements of Jacob’s statement: his age in ‘weeks of years,’ not knowing a woman, not touching one, not being betrothed, and not intending to take a Canaanite wife. However, ‘न मेरी सगाई हुई है’ is passive and can imply that no one has arranged an engagement for him, whereas the Geʽez first-person perfect is Jacob’s own denial of having entered into/betrothed himself in an engagement. A minor active recasting more closely reflects the source.'
  naturalness: The Hindi is clear, dignified, and modern. ‘न मैंने किसी से सगाई की है’ is more idiomatic in context than the passive wording while preserving the sequence of denials. The retained chronological idiom and its explanatory note are appropriate.
  terminology: ‘वर्ष-सप्ताह’ faithfully preserves the distinctive chronological expression, and the note correctly explains it as sixty-three years. ‘स्त्री को जानना’ preserves the source’s restrained idiom. ‘कनान की बेटियों’ is a conventional and accurate rendering.
  issues:
  - severity: low
    issue: 'The engagement clause is phrased passively: ‘न मेरी सगाई हुई है।’'
    rationale: The source has a first-person active perfect, denying that Jacob has betrothed/engaged himself. An active Hindi construction avoids a slight shift of agency and more directly represents the source.
