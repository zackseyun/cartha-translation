  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘स्त्री को जानना’ जैसे मूल के विनीत मुहावरे और ‘वर्ष-सप्ताह’ जैसी विशिष्ट कालगणना को सुरक्षित रखा गया है; सगाई और इरादे वाली दोनों पृथक क्रियाएँ स्पष्ट रूप से अनूदित हैं।
