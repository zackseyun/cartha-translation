base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/009.yaml
  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
translation:
  language: hi
  text: और इसी कारण मैंने अपनी आत्मा की रक्षा की है[a], ताकि मैं पाप न करूँ और अपने सभी मार्गों में, जीवन भर, अशुद्ध न होऊँ; क्योंकि उच्छृंखलता और व्यभिचार के कारण मेरे पिता अब्राहम ने मुझे बहुत-सी आज्ञाएँ दी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इन शब्दों का अर्थ यह भी समझा जा सकता है: “ताकि मैं अपने आपको अशुद्ध न करूँ और मेरे मार्ग भ्रष्ट न हों।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተዐቀብኩ በመንፈስየ
  choice: मैंने अपनी आत्मा की रक्षा की है
  rationale: क्रिया और ‘मेरी आत्मा’ को निकटता से व्यक्त करता है; आशय आंतरिक नैतिक सतर्कता का है।
- source_word: ኢየአብስ
  choice: मैं पाप न करूँ
  rationale: प्रसंग में नैतिक अपराध को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኢይማስን
  choice: अशुद्ध न होऊँ
  rationale: नैतिक मलिनता का भाव रखता है और पाठ में निहित संभावित वैकल्पिक व्याकरणिक संबंध को पादटिप्पणी में सुरक्षित रखता है।
- source_word: ምርዐት ወዝሙት
  choice: व्यभिचारी उच्छृंखलता
  rationale: दोनों निकटवर्ती यौन-अनैतिकता-सूचक पदों को अनावश्यक पुनरुक्ति के बिना व्यक्त करता है; ‘व्यभिचारी’ यौन पक्ष और ‘उच्छृंखलता’ बेलगाम आचरण को दर्शाता है।
- source_word: አብዝኀ ... አዝዘትየ
  choice: मुझे बहुत-सी आज्ञाएँ दी थीं
  rationale: बहुलता और पिता द्वारा पूर्व में दिए गए निर्देश—दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: आत्म-संरक्षण, अशुद्धता और मार्गों के भ्रष्ट होने के बीच व्याकरणिक संबंध
  choice: मुख्य पाठ में वक्ता स्वयं को अशुद्ध होने से बचाता है
  alternative: ‘ताकि मैं अपने आपको अशुद्ध न करूँ और मेरे मार्ग भ्रष्ट न हों’
  rationale: मुख्य पाठ स्रोत की प्रथम-पुरुष नैतिक आत्म-संयम की धारा और परामर्श-पाठ से मेल खाता है, जबकि वास्तविक वैकल्पिक समझ पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘आत्मा की रक्षा’ स्रोत की छवि बनाए रखता है; ‘व्यभिचारी उच्छृंखलता’ सामान्य पाठक के लिए बोधगम्य रहते हुए यौन अनैतिकता और बेलगाम आचरण दोनों को समेटता है।
