base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/026.yaml
  text: 'And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed[26] and from wine and from oil.'
translation:
  language: hi
  text: 'और इस व्यवस्था के लिए दिनों की कोई सीमा नहीं है, क्योंकि उसने इसे पीढ़ी-दर-पीढ़ी सदा के लिए ठहराया है: वे हर वस्तु का दसवाँ भाग यहोवा को दें—खेती की उपज[a], दाखमधु और तेल में से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से ‘बीज से’ है; यहाँ सम्भवतः आशय केवल बोने के लिए रखे बीज से नहीं, बल्कि खेती की उपज से है।
    reason: cultural_note
lexical_decisions:
- source_word: ሕግ
  choice: व्यवस्था
  rationale: यहाँ शब्द किसी सामान्य नियम से अधिक स्थायी धार्मिक विधान को व्यक्त करता है; ‘व्यवस्था’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: ወሰነ፡ መዋዕል
  choice: दिनों की कोई सीमा
  rationale: मूल अभिव्यक्ति का निकट और बोधगम्य रूप; विधान की कालातीतता को बिना विस्तार किए बनाए रखता है।
- source_word: ዓሥራተ
  choice: दसवाँ भाग
  rationale: दशमांश की संकल्पना को साधारण पाठक के लिए सीधे और स्पष्ट रूप में व्यक्त करता है।
- source_word: ለእግዚአብሔር
  choice: यहोवा को
  rationale: संदर्भ में इस ईश्वरीय पदनाम को अंग्रेज़ी परामर्श-पाठ ने LORD के रूप में पहचाना है; ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
- source_word: እምዘርእ
  choice: खेती की उपज
  rationale: शाब्दिक अर्थ ‘बीज से’ है, पर दशमांश के कृषि-संदर्भ में आशय बीज मात्र नहीं बल्कि उससे प्राप्त उपज है; पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: ወእምወይን፡ ወእምቅብእ
  choice: दाखमधु और तेल में से
  rationale: दोनों कृषि-उत्पादों को मूल क्रम में रखा गया है; ‘दाखमधु’ गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है।
theological_decisions:
- issue: व्यवस्था ठहराने वाले कर्ता की पहचान
  choice: उसने
  alternative: परमेश्वर ने
  rationale: मूल में केवल पुल्लिंग एकवचन कर्ता निहित है; स्पष्ट नाम जोड़ने से मूल की संदर्भगत अस्पष्टता अनावश्यक रूप से समाप्त हो जाती।
- issue: विधान की स्थायित्व-भाषा
  choice: पीढ़ी-दर-पीढ़ी सदा के लिए
  alternative: अनन्त पीढ़ियों के लिए
  rationale: मूल की स्थायी और पीढ़ीगत दोनों धारणाएँ सुरक्षित रखते हुए स्वाभाविक आधुनिक हिन्दी दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य की विधिक गंभीरता तथा मूल का कारणसूचक और आदेशात्मक प्रवाह सुरक्षित है; अस्पष्ट कर्ता को स्पष्ट करके कोई अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
