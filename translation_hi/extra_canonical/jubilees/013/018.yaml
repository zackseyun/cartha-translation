  choice: उसके मन को यह बात बहुत खली
  rationale: यह पदबंध मन के भीतर गहरा दुःख या क्लेश व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण अभिव्यक्ति है।
- source_word: ተፈልጠ፡
  choice: अलग हो गया था
  rationale: स्रोत का निष्क्रिय रूप अलग किए जाने या अलग हो जाने—दोनों की गुंजाइश रखता है। हिन्दी में यह चयन कर्ता या कारण जोड़े बिना उस अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: ወልደ፡ እኁሁ፡
  choice: उसके भाई का बेटा
  rationale: स्रोत के संबंधसूचक पदबंध का सीधा और सामान्य हिन्दी रूप।
- source_word: አልቦ፡ ውሉደ፡
  choice: उसकी अपनी कोई संतान नहीं थी
  rationale: बहुवचन-सामूहिक अर्थ को स्वाभाविक हिन्दी में 'कोई संतान नहीं' से व्यक्त किया गया है; 'अपनी' संदर्भगत भाव स्पष्ट करता है कि वह भाई के बेटे को अपने संभावित पारिवारिक सहारे की तरह देखता था।
