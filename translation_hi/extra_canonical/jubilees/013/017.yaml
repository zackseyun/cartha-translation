  yaml_path: translation/extra_canonical/jubilees/013/017.yaml
  text: And he said, “You are God Most High, my God forever and ever.” And in the seventh year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.
translation:
  language: hi
  text: और उसने कहा, “आप परमप्रधान परमेश्वर हैं; आप युगानुयुग मेरे परमेश्वर हैं।” और इस सप्ताह के सातवें वर्ष में लूत उससे अलग हो गया। लूत सदोम में रहने लगा, और सदोम के लोग बहुत पापी थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: परमप्रधान परमेश्वर
  rationale: यह पदवी ‘Most High God’ का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है तथा मूल के दोनों पदों को बनाए रखती है।
- source_word: ለዓለመ፡ ዓለም
  choice: युगानुयुग
  rationale: मूल की अनंत कालसूचक पुनरुक्ति को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: በ፯ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: इस सप्ताह के सातवें वर्ष में
  rationale: गीज़ पाठ स्पष्ट रूप से सातवें वर्ष का संकेत देता है; ‘सप्ताह’ यहाँ सात वर्षों की काल-इकाई है।
- source_word: ተፈልጠ
  choice: अलग हो गया
  rationale: लूत के उससे पृथक होने के अर्थ को सीधा और स्वाभाविक रूप देता है।
- source_word: ኀደረ
  choice: रहने लगा
  rationale: सदोम में निवास करने या बसने के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኃጥኣን፡ ጥቀ
  choice: बहुत पापी
  rationale: विशेषण और तीव्रतासूचक क्रियाविशेषण दोनों को निकटता से दर्शाता है।
theological_decisions:
- issue: परमेश्वर के लिए संबोधन का सर्वनाम
  choice: आप
  alternative: तू
  rationale: आधुनिक मानक हिन्दी में श्रद्धापूर्ण और सामान्य-पाठक-अनुकूल संबोधन चुना गया है; इससे मूल के कथन में कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा जाता।
- issue: ‘सप्ताह’ का कालगत अर्थ
  choice: मूल की ‘सप्ताह’ शब्दावली को बनाए रखा
  alternative: सात-वर्षीय अवधि
  rationale: जुबलीज़ की कालगणना की विशिष्ट शब्दावली सुरक्षित रहती है, जबकि ‘सातवें वर्ष’ से आशय पर्याप्त स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। वाक्य-विन्यास को पठनीय बनाया गया है, जबकि मूल की कालगणना, ईश्वरीय पदवी और नैतिक कथन सुरक्षित रखे गए हैं।
