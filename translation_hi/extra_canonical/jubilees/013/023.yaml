  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। स्थान-नामों में प्रचलित बाइबलीय हिन्दी रूप रखे गए हैं। गीज़ पाठ की असामान्य शुरुआत और नगरों को ‘बंदी बनाने’ की पुनरावृत्ति को अत्यधिक समतल किए बिना स्वाभाविक वाक्य-विन्यास दिया गया है।
