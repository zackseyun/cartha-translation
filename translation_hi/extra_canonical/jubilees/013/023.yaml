base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/023.yaml
  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
translation:
  language: hi
  text: और राष्ट्रों का राजा तर्गाल[a] था; और उन्होंने अमोरा के राजा को मार डाला। सदोम का राजा भाग गया, और बहुत-से लोग लवण सागर के पास सदोमियों की घाटी के डामर में जा गिरे।[b] उन्होंने सदोम, अदमा और सबोयीम को बंदी बना लिया। उन्होंने अब्राम के भाई के पुत्र लूत और उसकी सारी संपत्ति को भी बंदी बना लिया, और वे दान तक चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ में ‘तर्गाल’; यह उत्पत्ति 14:1 के ‘तिदाल’ के समकक्ष है।
    reason: lexical_choice
  - marker: b
    text: गीज़ का शाब्दिक अर्थ है, ‘सदोमियों की घाटी के तेल/डामर में।’ यह उत्पत्ति 14:10 की ‘सिद्दीम की घाटी के डामर के गड्ढों’ वाली परंपरा के अनुरूप है। चार्ल्स (1902) ने पाठ को विकृत मानकर इसका संशोधन ‘घावों से’ किया था, पर गीज़ पाठ अपने वर्तमान रूप में भी अर्थपूर्ण है।
    reason: textual_critical
lexical_decisions:
- source_word: ተርጋል
  choice: तर्गाल
  rationale: गीज़ नाम का निकट देवनागरी लिप्यंतरण रखा गया है; उत्पत्ति 14:1 में इसके समकक्ष नाम की जानकारी पादटिप्पणी में दी गई है।
- source_word: ወጐየ
  choice: भाग गया
  rationale: क्रिया का अर्थ ‘भागना’ है; इससे सदोम के राजा को भगाए जाने के बजाय उसके स्वयं भागने का भाव स्पष्ट रहता है।
- source_word: በቀብአ
  choice: डामर में
  rationale: ቀብአ का सामान्य अर्थ तेल या लेप हो सकता है, पर इस प्रसंग में यह उत्पत्ति 14:10 की डामर-संबंधी परंपरा को व्यक्त करता है। स्रोत में ‘गड्ढे’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ሰዶማውያን
  choice: सदोमियों की
  rationale: गीज़ पाठ स्पष्टतः ‘सदोमियों’ कहता है, ‘सिद्दीम’ नहीं; वास्तविक पाठांतर को सुरक्षित रखा गया है।
- source_word: ፄወዉ
  choice: बंदी बना लिया
  rationale: मूल क्रिया बंदी बनाने या पकड़ ले जाने का भाव देती है। नगरों के संबंध में यह कुछ असामान्य होते हुए भी स्रोत की पुनरावृत्ति और युद्ध-बंदी के भाव को बनाए रखता है।
- source_word: ጥሪቶ
  choice: सारी संपत्ति
  rationale: यह लूत के माल-असबाब और अधिकार की वस्तुओं के लिए स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है।
