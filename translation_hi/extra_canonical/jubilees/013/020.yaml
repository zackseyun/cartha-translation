  text: For all the land that you see I will give to you and to your seed forever. And I will make your seed like the sand of the sea; if a man can count the dust of the earth, then your seed also
translation:
  language: hi
  text: क्योंकि यह सारी भूमि, जिसे तू देख रहा है, मैं तुझे और तेरे वंश को सदा के लिए दूँगा। मैं तेरे वंश को समुद्र की रेत के समान करूँगा। यदि कोई मनुष्य पृथ्वी की धूल को गिन सके, तो तेरा वंश भी[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वाक्य मूल पाठ में यहाँ अधूरा रहता है और अगले पद में पूरा होता है।
    reason: पाठक को असामान्य पद-विभाजन समझाने और मूल में अनुपस्थित क्रिया जोड़ने से बचने के लिए।
lexical_decisions:
- source_word: ዘርእ
  choice: वंश
  rationale: गीज़ शब्द संतान, बीज या वंश का बोध करा सकता है; भूमि की प्रतिज्ञा और असंख्यता के इस प्रसंग में ‘वंश’ स्वाभाविक और अर्थपूर्ण है।
- source_word: ኆፃ፡ ባሕር
  choice: समुद्र की रेत
  rationale: मूल उपमा का सीधा और प्रचलित हिन्दी रूप।
- source_word: ኆፃ፡ ምድር
  choice: पृथ्वी की धूल
  rationale: यद्यपि ኆፃ सामान्यतः रेत/धूल हो सकता है, ‘पृथ्वी की धूल’ प्रसंगगत समानांतर और गिनती की बाइबिलीय उपमा को स्पष्ट रखता है।
- source_word: እስከ፡ ለዓለም
  choice: सदा के लिए
  rationale: दीर्घकालिक अथवा अनंत काल तक रहने वाली देन के सामान्य अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पद के अंत में अपूर्ण शर्त-वाक्य
  choice: ‘तो तेरा वंश भी—’ कहकर वाक्य को अगले पद के लिए खुला रखा गया
  alternative: ‘तो तेरा वंश भी गिना जा सकेगा’
  rationale: इस पद के गीज़ पाठ में अंतिम क्रिया नहीं है; संबंधित नकारात्मक क्रिया अगले पद में आती है। यहाँ सकारात्मक क्रिया जोड़ना पद-विभाजन और आगे के अर्थ को विकृत करेगा।
- issue: प्रतिज्ञा की अवधि
  choice: ‘सदा के लिए’
  alternative: ‘युग-युग तक’
  rationale: मूल ለዓለም की कालगत व्यापकता को बनाए रखते हुए किसी विशिष्ट धर्मवैधानिक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; अब्राहम को संबोधन में मूल के एकवचन को बनाए रखने के लिए ‘तू/तेरा’ रूप प्रयुक्त है। अंतिम डैश जानबूझकर अगले पद से व्याकरणिक निरंतरता दिखाता है।
