lexical_decisions:
- source_word: ወበጽሐ
  choice: तब ... पास आया
  rationale: क्रिया के निकट आने/पहुँचने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; आरंभिक संयोजक को प्रसंगगत क्रम के लिए ‘तब’ किया गया है।
- source_word: ወሰገደ፡ ቅድሜሁ
  choice: उसके सामने दण्डवत् किया
  rationale: साष्टांग झुकने अथवा आदरपूर्वक प्रणाम करने की शारीरिक क्रिया को बनाए रखता है और इसे उपासना के अर्थ तक सीमित नहीं करता।
- source_word: እግዚእነ
  choice: हमारे स्वामी
  rationale: प्रथम पुरुष बहुवचन संबंधसूचक रूप को स्पष्ट रूप से सुरक्षित रखता है और सम्मानसूचक संबोधन देता है।
theological_decisions:
- issue: राजा का अब्राम के सामने झुकना
  choice: दण्डवत् किया
  alternative: आराधना की
  rationale: मूल क्रिया सम्मान, अधीनता या उपासना के लिए झुकने को सूचित कर सकती है; यहाँ राजकीय भेंट के प्रसंग में ‘दण्डवत् किया’ वास्तविक क्रिया और अर्थगत अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। पद आरंभ और अंत दोनों ओर खंडित वाक्य है, इसलिए स्रोत की सीमा के अनुरूप आरंभिक ‘उसके सामने।’ और अंतिम अपूर्ण संबोधन को बनाए रखा गया है।
