  yaml_path: translation/extra_canonical/jubilees/013/024.yaml
  text: And one who had escaped came and told Abram that his brother’s son had been taken captive[24]. And he armed the servants born in his house . . . Upon Abram and upon his seed is the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him[24],
translation:
  language: hi
  text: और जो व्यक्ति बच निकला था, उसने आकर अब्राम को बताया कि उसके भाई का पुत्र बंदी बना लिया गया था। तब अब्राम ने अपने घर में जन्मे सेवकों को हथियारबंद किया . . .[a] अब्राम और उसके वंश के लिए यहोवा को पहला दशमांश देना है; और यहोवा ने इसे सदा के लिए एक विधि ठहराया, ताकि वे इसे उन याजकों को दें जो उसके सामने सेवा करते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद पाठ की दृष्टि से कठिन और संभवतः संक्षिप्त या खंडित है। “अपने घर में जन्मे सेवकों को हथियारबंद किया” के बाद वर्णन अचानक दशमांश की व्यवस्था पर आ जाता है; संभव है कि यहाँ मूल कथा का कुछ अंश लुप्त हो गया हो।
    reason: segmentation_note
  - marker: b
    text: “पहला दशमांश” का अनुवाद “प्रमुख दशमांश” भी हो सकता है, या इसे पहली उपज से जुड़े दशमांश के रूप में समझा जा सकता है। गीज़ वाक्यांश असामान्य और क्रियारहित है; मुख्य पाठ में “देना है” उस निहित दायित्व को स्पष्ट करता है, पर इसका भाव अब्राम और उसके वंश पर दशमांश का दायित्व होने का भी हो सकता है।
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: ዘድኅነ
  choice: जो व्यक्ति बच निकला था
  rationale: यह रूप बच निकलने वाले व्यक्ति को दर्शाता है; हिन्दी में संबंधवाचक रचना अधिक स्वाभाविक है।
- source_word: ተፄወወ
  choice: बंदी बना लिया गया है
  rationale: स्रोत का कर्मवाच्य भाव सुरक्षित रखा गया है; प्रसंग में बंदी बनाए जाने का अर्थ उपयुक्त है।
- source_word: ልደ፡ ቤቱ
  choice: अपने घर में जन्मे लोगों
  rationale: शाब्दिक अर्थ ‘उसके घर में जन्मे’ है। ‘सेवक’ प्रसंग से संभव है, पर स्रोत में यहाँ स्पष्ट संज्ञा न होने के कारण अधिक सामान्य ‘लोगों’ चुना गया।
- source_word: ዐሥራተ፡ ቀዳሚ
  choice: पहला दशमांश
  rationale: ዐሥራት ‘दशमांश’ और ቀዳሚ ‘पहला/प्रमुख’ है। मुख्य पाठ में निकटतम औपचारिक अर्थ रखा गया और विकल्प पादटिप्पणी में दिए गए।
- source_word: ይትቀነዩ፡ ቅድሜሁ
  choice: उसके सामने सेवा करते हैं
  rationale: याजकीय सेवा के भाव को संप्रदाय-विशेष की तकनीकी शब्दावली जोड़े बिना व्यक्त करता है।
theological_decisions:
- issue: अब्राम और उसके वंश पर दशमांश संबंधी खंड का कर्ता और क्रिया
  choice: अब्राम और उसके वंश पर यहोवा के लिए पहला दशमांश है
  alternative: उसने अब्राम और उसके वंश पर पहला दशमांश लगाया
  rationale: गीज़ खंड क्रियारहित है। सक्रिय क्रिया और अस्पष्ट कर्ता जोड़ने के बजाय मूल की व्याकरणिक और धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई।
- issue: दशमांश के प्राप्तकर्ता
  choice: उन याजकों को दें जो उसके सामने सेवा करते हैं
  alternative: सेवकाई करने वाले याजकों को दें
  rationale: स्रोत में याजकों और परमेश्वर के सामने उनकी सेवा का स्पष्ट उल्लेख है; इसे सामान्य, गरिमापूर्ण हिन्दी में रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। कथात्मक भाग में स्वाभाविक वाक्य-विन्यास रखा गया है, जबकि खंडित स्रोत-पाठ और दशमांश वाले क्रियारहित वाक्य की वास्तविक अस्पष्टता पादटिप्पणियों सहित सुरक्षित रखी गई है।
