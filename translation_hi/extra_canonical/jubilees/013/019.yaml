  text: In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,
translation:
  language: hi
  text: उस वर्ष, जब लूत को बंदी बना लिया गया था, उस सप्ताह के चौथे वर्ष में, लूत के अब्राम से अलग हो जाने के बाद प्रभु ने अब्राम से कहा, “जिस स्थान पर तुम रह रहे हो, वहाँ से अपनी आँखें उठाकर उत्तर, दक्षिण, पश्चिम[a] और पूर्व[b] की ओर देखो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘समुद्र की ओर’।
    reason: मूल पाठ पश्चिम के लिए समुद्र-दिशा का बिंब प्रयोग करता है।
  - marker: b
    text: शाब्दिक रूप से ‘भोर की ओर’ या ‘सूर्योदय की ओर’।
    reason: मूल पाठ पूर्व दिशा को भोर/सूर्योदय से व्यक्त करता है।
lexical_decisions:
- source_word: ተፄወወ፡ ሎጥ
  choice: लूत को बंदी बना लिया गया था
  rationale: क्रिया लूत के पकड़े जाने अथवा बंदी बनाए जाने को व्यक्त करती है; कर्मवाच्य हिन्दी मूल की संरचना और अर्थ दोनों को स्पष्ट रखती है।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: यहाँ इस्राएल के परमेश्वर के लिए प्रयुक्त दिव्य उपाधि का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; मूल गीइज़ में कोई विशिष्ट उच्चारण-आधारित निजी नाम नहीं दिया गया है।
- source_word: በ፬ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: उस सप्ताह के चौथे वर्ष में
  rationale: यूबिली ग्रंथ की कालगणना-संबंधी अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सीधे सुरक्षित रखा गया है।
- source_word: ባሕር
  choice: पश्चिम
  rationale: शाब्दिक अर्थ ‘समुद्र’ है, पर दिशासूचक क्रम में यह पश्चिम को सूचित करता है; पादटिप्पणी मूल बिंब को सुरक्षित रखती है।
- source_word: ጽባሕ
  choice: पूर्व
  rationale: शाब्दिक रूप से यह भोर अथवा सूर्योदय की दिशा का संकेत देता है; दिशासूचक संदर्भ में ‘पूर्व’ स्वाभाविक है और पादटिप्पणी मूल बिंब बताती है।
theological_decisions:
- issue: दिव्य संबोधन का हिन्दी रूप
  choice: प्रभु
  alternative: यहोवा
  rationale: गीइज़ पाठ में እግዚአብሔር (‘प्रभु/परमेश्वर’) है, न कि स्पष्ट रूप से लिखा हुआ हिब्रू चतुरक्षरीय निजी नाम; इसलिए ‘प्रभु’ स्रोत-संगत और संप्रदाय-निरपेक्ष है।
- issue: प्रत्यक्ष वचन का इस पद के अंत पर खुला रहना
  choice: अंत में उद्धरण-चिह्न बंद नहीं किया गया
  alternative: अंत में उद्धरण-चिह्न बंद करना
  rationale: वचन अगले पद में जारी रहता है; इसलिए पद-विभाजन को वक्तव्य का अंत नहीं माना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। काल-सूचक अंशों को हिन्दी में सुबोध क्रम दिया गया है। दिशाओं को सामान्य हिन्दी शब्दों में प्रस्तुत करते हुए मूल गीइज़ के ‘समुद्र’ और ‘भोर’ वाले बिंब पादटिप्पणियों में सुरक्षित रखे गए हैं।
