  text: And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, to the place of the altar, between Bethel on the west and Ai on the east, and he blessed the LORD his God who had brought him back in peace.
translation:
  language: hi
  text: तब फ़िरौन ने अब्राम की पत्नी सारै को भेज दिया और अब्राम को मिस्र देश से निकाल दिया। अब्राम उस स्थान पर गया जहाँ उसने पहले अपना तंबू लगाया था—वेदी के उस स्थान पर, जो पश्चिम में बेतेल और पूर्व में अय के बीच था। वहाँ उसने अपने परमेश्वर यहोवा को धन्य कहा, जो उसे सकुशल वापस ले आया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አገብአ
  choice: लौटा दिया
  rationale: क्रिया का मूल भाव ‘वापस करना/लौटा देना’ है; इससे स्पष्ट होता है कि फ़िरौन ने सारै को अब्राम को लौटा दिया।
- source_word: አፍለሶ
  choice: निकाल दिया
  rationale: यहाँ किसी को देश से हटाकर भेज देने या निष्कासित करने का भाव है; सहज हिन्दी में ‘निकाल दिया’ उपयुक्त है।
- source_word: ደብተራሁ
  choice: अपना तंबू
  rationale: संदर्भ में अब्राम के पहले लगाए हुए निवास-तंबू का उल्लेख है।
- source_word: ምሥዋዕ
  choice: वेदी
  rationale: बलिदान चढ़ाने के स्थान के लिए प्रचलित और सटीक बाइबिलीय हिन्दी शब्द।
- source_word: በሰላም
  choice: सकुशल
  rationale: शाब्दिक ‘शांति में’ यहाँ सुरक्षित लौट आने का मुहावरेदार भाव रखता है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: इस ईश्वरीय संबोधन को अंग्रेज़ी परामर्श-पाठ में LORD से दर्शाया गया है; हिन्दी बाइबिलीय प्रयोग में ‘यहोवा’ उस विशिष्ट नाम को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम और ‘उसका परमेश्वर’ का संबंध
  choice: अपने परमेश्वर यहोवा
  alternative: प्रभु, अपने परमेश्वर
  rationale: यह रूप विशिष्ट ईश्वरीय नाम और अब्राम के साथ उसके संबंध—‘उसका परमेश्वर’—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- issue: आशीष देने की दिशा
  choice: यहोवा को धन्य कहा
  alternative: यहोवा की स्तुति की
  rationale: स्रोत की ‘आशीष देना/धन्य कहना’ वाली भाषा को बनाए रखा गया है; इसे केवल सामान्य ‘स्तुति’ में बदलने से मूल अभिव्यक्ति का रूप खो जाता।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थान-क्रम स्रोत के अनुसार रखा गया है: पहले पूर्व तंबू-स्थल और वेदी का स्थान, फिर पश्चिम में बेतेल तथा पूर्व में अय।'
