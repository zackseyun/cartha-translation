  text: 'Give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: from a thread even to a sandal strap, I will not take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre; let them take their share.”'
translation:
  language: hi
  text: '“जिन लोगों को तुमने बचाया है, उन्हें हमें दे दो, पर माल तुम रख लो।” तब अब्राम ने उससे कहा, “मैंने परमप्रधान परमेश्वर की ओर अपने हाथ उठाए हैं: मैं तुम्हारी किसी भी वस्तु में से—एक धागे से लेकर सैंडल के पट्टे तक—कुछ नहीं लूँगा, कहीं ऐसा न हो कि तुम कहो, ‘मैंने अब्राम को धनी बनाया है।’ सिवाय उसके जो जवान लोग खा चुके हैं, और उन पुरुषों के हिस्से के जो मेरे साथ गए थे—आनेर, एश्कोल और मम्रे; वे अपना हिस्सा ले लें।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸግወነ
  choice: उन्हें हमें दे दो
  rationale: क्रिया में प्रथम पुरुष बहुवचन कर्मसूचक रूप है, इसलिए ‘हमें’ रखा गया है; इसे उत्पत्ति 14:21 के अन्य पाठों के अनुरूप ‘मुझे’ नहीं किया गया।
- source_word: ነፍሰ፡ እለ፡ ባሳሕከ
  choice: जिन लोगों को तुमने बचाया है
  rationale: ነፍሰ यहाँ युद्ध से छुड़ाए गए व्यक्तियों/प्राणियों को सूचित करता है; स्वाभाविक हिन्दी में ‘लोगों’ और ባሳሕከ के लिए ‘बचाया’ उपयुक्त है।
- source_word: አነሣእ፡ እደየ
  choice: मैंने ... अपना हाथ उठाया है
  rationale: शपथ लेने की स्रोत-भाषीय देहभंगिमा को स्पष्ट व्याख्या से बदलने के बजाय औपचारिक रूप से सुरक्षित रखा गया।
- source_word: እምፈትል፡ እስከ፡ ተታነ፡ እሣእነ
  choice: एक धागे से लेकर जूती के फीते तक
  rationale: छोटी से छोटी वस्तु तक कुछ न लेने की मेरिस्मात्मक अभिव्यक्ति को हिन्दी में निकट और सहज रूप दिया गया।
- source_word: መክፈልቶሙ
  choice: उनका हिस्सा
  rationale: सहयोगी पुरुषों के युद्ध-लाभ में उचित अंश का सामान्य, गैर-व्याख्यात्मक अनुवाद।
theological_decisions:
- issue: अब्राम की परमप्रधान परमेश्वर के सामने शपथ
  choice: ‘मैंने परमप्रधान परमेश्वर की ओर अपना हाथ उठाया है’
  alternative: ‘मैं परमप्रधान परमेश्वर की शपथ खाता हूँ’
  rationale: वैकल्पिक रूप आशय स्पष्ट करता, पर स्रोत की मूर्त अभिव्यक्ति और शपथ-सूचक सांस्कृतिक तनाव को मिटा देता; इसलिए मूल बिंब सुरक्षित रखा गया।
- issue: राजा का बहुवचन ‘हमें’
  choice: ‘उन्हें हमें दे दो’
  alternative: ‘उन्हें मुझे दे दो’
  rationale: गीज़ पाठ के प्रथम पुरुष बहुवचन को ही रखा गया और उत्पत्ति की अन्य पाठ-परंपराओं से सामंजस्य स्थापित नहीं किया गया।
- issue: अब्राम द्वारा माल अस्वीकार करने का कारण
  choice: ‘कहीं ऐसा न हो कि तुम कहो, “मैंने अब्राम को धनी बनाया है”’
  alternative: कारण को परमेश्वर की महिमा के बारे में व्याख्यायित करना
  rationale: पाठ केवल राजा के संभावित दावे को व्यक्त करता है; अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: 'आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संवाद में स्रोत का बहुवचन ‘हमें’ और शपथ की देहभंगिमा दोनों सुरक्षित हैं। नामों का रूप: अब्राम, आनेर, एश्कोल, मम्रे।'
