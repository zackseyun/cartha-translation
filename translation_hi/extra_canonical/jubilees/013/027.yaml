- source_word: ፍሥሓ
  choice: आनन्द
  rationale: शब्द हर्ष, प्रसन्नता या उत्सवपूर्ण आनन्द का भाव देता है; ‘आनन्द के साथ’ स्रोत की रीति और गरिमा दोनों बनाए रखता है।
