translation:
  language: hi
  text: “क्योंकि मैं इसे तुम्हारे वंश को दूँगा।” तब अब्राम हेब्रोन गया और वहीं बस गया। उसी वर्ष एलाम का राजा कदोर्लाओमेर, शिनार का राजा अम्रापेल और एल्लासार का राजा अर्योक आए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዘርእከ
  choice: तुम्हारे वंश को
  rationale: गीज़ पद का अर्थ संतान अथवा वंश है; सामूहिक और वाचा-संबंधी अर्थ की व्यापकता बनाए रखने के लिए ‘वंश’ चुना गया।
- source_word: እሁብ
  choice: मैं ... दूँगा
  rationale: प्रथम पुरुष एकवचन के भविष्यकालीन आश्वासन को हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ኀደረ፡ ህየ
  choice: वहीं बस गया
  rationale: क्रिया के ठहरने/निवास करने के अर्थ को प्रसंगानुसार सहज आधुनिक हिंदी में व्यक्त किया गया।
- source_word: መጽአ
  choice: आए
  rationale: सूचीबद्ध तीन राजाओं के संयुक्त कर्ता के कारण हिंदी में बहुवचन रखा गया, जबकि स्रोत में क्रिया पहले नाम के साथ एकवचन रूप में आती है।
- source_word: ኮዶላጎሞር
  choice: कदोर्लाओमेर
  rationale: व्यक्तिनाम का गीज़-आधारित देवनागरी लिप्यंतरण, प्रचलित बाइबलीय रूप से निकट रखा गया।
- source_word: ሴናአር
  choice: शिनार
  rationale: स्थाननाम का हिंदी बाइबल परंपरा में सुबोध और प्रचलित रूप।
- source_word: ሴላሰር
  choice: एल्लासार
  rationale: गीज़ स्थाननाम को प्रचलित बाइबलीय समतुल्य ‘एल्लासार’ के रूप में प्रस्तुत किया गया।
theological_decisions:
- issue: ‘वंश’ का सामूहिक अथवा एकवचन आशय
  choice: ‘वंश’
  alternative: ‘संतान’
  rationale: मूल पद की संख्या और आशय को किसी एक विशिष्ट धर्मवैज्ञानिक व्याख्या तक सीमित किए बिना उसकी सामूहिक/वंशगत संभाव्यता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। राजाओं की अधूरी सूची को स्रोत और दिए गए खंड के अनुसार अंतिम अल्पविराम सहित खुला रखा गया है।
