base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/016.yaml
  text: And in the forty-first jubilee, in the third year of the first week, he returned to this place and offered a sacrifice upon it, and he called on the name of the LORD.
translation:
  language: hi
  text: और इकतालीसवें जुबली-काल में, पहले सप्ताह के तीसरे वर्ष में, वह इसी स्थान पर लौट आया और उस पर बलि चढ़ाई[a]; और उसने यहोवा का नाम पुकारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने रूप में: ‘वह उस स्थान में गया और वहाँ एक वेदी बनाई।’ गीज़ मूल पाठ ‘इसी स्थान पर लौट आया और उस पर बलि चढ़ाई’ का समर्थन करता है।'
    reason: पूर्व प्रचलित पाठ को दर्ज करते हुए यह स्पष्ट करना कि वह मूल-पाठ-समर्थित मुख्य अनुवाद नहीं है।
lexical_decisions:
- source_word: ኢዮቤልዎን
  choice: जुबली-काल
  rationale: यह शब्द जुबली की कालगणना को सूचित करता है; ‘जुबली-काल’ मूल संज्ञा को बनाए रखते हुए हिन्दी पाठक के लिए इसका कालखंड होना स्पष्ट करता है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: यहाँ सात वर्षों के कालखंड का तकनीकी कालगणनात्मक अर्थ है; निकटवर्ती ‘वर्ष’ से आशय स्पष्ट होता है।
- source_word: ገብአ
  choice: लौट आया
  rationale: क्रिया का अर्थ ‘लौटा’ है और प्रसंग में अब्राम के मिस्र से पुनः इस स्थान पर आने के अनुरूप है।
- source_word: ውስተዝ፡ መካን
  choice: इसी स्थान पर
  rationale: संकेतवाचक तत्व निकटवर्ती ‘इस’ स्थान को दर्शाता है, न कि ‘उस’ स्थान को।
- source_word: ወአዕረገ፡ በዲቤሁ፡ ጽንሓሐ
  choice: और उस पर बलि चढ़ाई
  rationale: पदबंध किसी बलि को ऊपर चढ़ाने या अर्पित करने का वर्णन करता है; वेदी बनाने का विचार मूल पाठ में नहीं है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: ‘नाम पुकारने’ के सूत्र में यह परमेश्वर के विशिष्ट नाम को सूचित करता है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में सुबोध है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में ईश्वरीय पदनाम है, पर ‘नाम पुकारा’ का पारंपरिक सूत्र विशिष्ट वाचा-नाम की ओर संकेत करता है; ‘यहोवा’ इस संबंध को स्पष्ट रखता है, बिना अतिरिक्त धर्मवैचारिक व्याख्या जोड़े।
- issue: बलि चढ़ाने और वेदी बनाने के बीच पाठगत चयन
  choice: बलि चढ़ाई
  alternative: वहाँ एक वेदी बनाई
  rationale: गीज़ पाठ स्पष्ट रूप से बलि अर्पित करने का समर्थन करता है। वेदी बनाने वाला पाठ संभवतः उत्पत्ति 13:4 से सामंजस्य बैठाने वाला पुराना रूप है और इसे मुख्य पाठ में नहीं अपनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘जुबली-काल’ और ‘सप्ताह’ ग्रंथ की विशिष्ट कालगणना को बनाए रखते हैं; वाक्य की पुनरावृत्तिपूर्ण संरचना मूल कथन-शैली के निकट है।
