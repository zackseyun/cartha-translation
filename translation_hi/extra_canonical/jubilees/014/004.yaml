lexical_decisions:
- source_word: ዘይወፅእ፡ እምከርሥከ
  choice: जो तुम्हारे अपने शरीर से निकलेगा
  rationale: गीज़ पदबंध का शाब्दिक अर्थ ‘जो तुम्हारे गर्भ/अंतरंग से निकलेगा’ है; पुरुष को संबोधित इस वंश-संबंधी प्रसंग में ‘अपने शरीर से’ स्वाभाविक हिंदी है और जैविक वंश का भाव बनाए रखता है।
- source_word: ይወርሰከ
  choice: तुम्हारा वारिस होगा
  rationale: क्रिया में उत्तराधिकार पाने का भाव है। हिंदी में ‘तुम्हारा वारिस होगा’ व्यक्ति और विरासत के संबंध को स्पष्ट तथा सहज रूप में व्यक्त करता है।
- source_word: ወአውፅኦ፡ አፍአ
  choice: फिर वह उसे बाहर ले गया
  rationale: मूल में कारणवाचक ‘उसे बाहर निकाला/ले गया’ है; ‘बाहर ले गया’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: ነጽር
  choice: देखो
  rationale: आज्ञार्थक क्रिया का सीधा और वर्तमान मानक हिंदी समतुल्य। पद अगले वाक्य में जारी रहने के कारण अंत में डैश रखा गया है।
theological_decisions:
- issue: प्रतिज्ञात उत्तराधिकारी का जैविक संबंध
  choice: ‘तुम्हारे अपने शरीर से’ कहकर प्रत्यक्ष जैविक वंश का भाव सुरक्षित रखा गया।
  alternative: ‘तुम्हारी कोख से’ या ‘तुम्हारे अंतरंग से’
  rationale: ‘कोख’ पुरुष संबोधन में आधुनिक हिंदी में अस्वाभाविक हो सकती है, जबकि ‘अंतरंग’ अर्थ को अस्पष्ट कर सकता है। चुना हुआ रूप मूल भाव को बिना अतिरिक्त doctrinal व्याख्या के संप्रेषित करता है।
- issue: कर्ता की पहचान
  choice: ‘वह’ सर्वनाम बनाए रखा गया।
  alternative: ‘परमेश्वर’ जोड़ना
  rationale: दिए गए गीज़ अंश में कर्ता सर्वनाम/क्रियारूप से निहित है; नाम जोड़ने से मूल की अभिव्यक्ति की तुलना में अधिक स्पष्टता आयात होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण पिछले कथन के बीच से आरम्भ होता है और ‘देखो’ के बाद अगले पद/खंड में जारी रहता है; इसलिए आरम्भ में ‘परन्तु’ और अंत में दीर्घ डैश रखा गया है।
