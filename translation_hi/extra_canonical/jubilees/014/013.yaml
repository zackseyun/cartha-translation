lexical_decisions:
- source_word: ይከልኦሙ
  choice: उन्हें भगा दिया
  rationale: संदर्भ में अब्राम का पक्षियों को बलि के टुकड़ों से दूर हटाना अभिप्रेत है; यह स्वाभाविक हिन्दी में क्रिया का व्यावहारिक अर्थ व्यक्त करता है।
- source_word: ኢየኀድጎ
  choice: नहीं दिया
  rationale: मूल की निषेधात्मक अनुमति—‘उसने अनुमति नहीं दी’—को सीधे और सहज रूप में रखा गया है।
- source_word: አዕዋፍ
  choice: पक्षियों
  rationale: गीज़ बहुवचन का सामान्य, आधुनिक हिन्दी समतुल्य।
- source_word: ይልከፍዎሙ
  choice: उन्हें छूने
  rationale: मूल क्रिया का मूलभूत अर्थ ‘छूना/संपर्क करना’ रखा गया है; ‘खाना’ जैसी संदर्भजन्य व्याख्या नहीं जोड़ी गई।
- source_word: ዐርበት፡ ፀሐይ
  choice: सूर्य अस्त हो रहा था
  rationale: सूर्य के ढलने/अस्त होने की प्रगतिशील घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
