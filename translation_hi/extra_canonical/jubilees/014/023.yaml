  text: And Abram rejoiced, and he told this whole matter to Sarai his wife, and he believed that he would have offspring, though she was not bearing. And Sarai advised Abram her husband and said to him, “Go in to Hagar, my Egyptian maidservant; perhaps I may build up offspring for you from her.” And Abram listened to the voice of Sarai his wife and said to her, “Do so.” And she took her,
translation:
  language: hi
  text: और अब्राम आनन्दित हुआ। उसने यह सारी बात अपनी पत्नी सारै को बताई और विश्वास किया कि उसकी सन्तान होगी, यद्यपि सारै सन्तान नहीं जन रही थी। तब सारै ने अपने पति अब्राम को सलाह दी और उससे कहा, “मेरी मिस्री दासी हागार के पास जा; शायद मैं उसके द्वारा तेरे लिए सन्तान उत्पन्न कर सकूँ।” अब्राम ने अपनी पत्नी सारै की बात मानी और उससे कहा, “ऐसा ही कर।” तब उसने उसे ले लिया,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब सारै ने उसे ले लिया।”
    reason: मूल में स्त्रीलिंग कर्ता स्पष्ट नाम से नहीं दिया गया है; प्रसंग के आधार पर वह सारै समझी जा सकती है।
lexical_decisions:
- source_word: ዘርእ / ዘርአ
  choice: सन्तान
  rationale: गेज़ पद का अर्थ ‘बीज’ और वंशज/सन्तान दोनों हो सकता है; इस प्रजनन-सन्दर्भ में ‘सन्तान’ स्वाभाविक हिन्दी है और दोनों occurrences को एकरूप रखता है।
- source_word: ባእ፡ ኀበ፡ አጋር
  choice: हागार के पास जा
  rationale: यह सहवास के लिए प्रयुक्त शिष्ट संकेतात्मक अभिव्यक्ति है; हिन्दी में शब्दशः निकटता रखते हुए अनावश्यक स्पष्टता नहीं जोड़ी गई।
- source_word: አሐንጽ
  choice: खड़ी कर सकूँ
  rationale: मूल रूपक ‘बनाना/निर्माण करना’ को हिन्दी के स्वाभाविक वंश-वृद्धि मुहावरे ‘सन्तान खड़ी करना’ से बनाए रखा गया है।
- source_word: ወሰምዐ ... ቃለ
  choice: बात मानी
  rationale: शाब्दिक अर्थ ‘आवाज़ सुनी’ है, पर इस प्रसंग में आज्ञा/परामर्श स्वीकार करने का अर्थ है; ‘बात मानी’ आधुनिक हिन्दी में वही भाव स्पष्ट करता है।
- source_word: ወሥአታ
  choice: उसने उसे ले लिया
  rationale: क्रिया में स्त्रीलिंग कर्म-प्रत्यय ‘उसे’ निहित है; कर्ता मूल में स्पष्ट संज्ञा से दोहराया नहीं गया और आगे की कथा से सारै समझी जाती है।
theological_decisions:
- issue: अब्राम के विश्वास और सारै के न जनने के बीच सम्बन्ध
  choice: ‘और विश्वास किया कि उसकी सन्तान होगी, यद्यपि सारै सन्तान नहीं जन रही थी’
  alternative: ‘और उसने विश्वास किया कि सन्तान होगी और वह जन नहीं रही थी’
  rationale: मूल की कथात्मक तनातनी बनाए रखते हुए अस्पष्ट स्त्रीलिंग कर्ता को निकटवर्ती सारै से जोड़ा गया; यह अंग्रेज़ी परामर्श-पाठ और उत्पत्ति-सन्दर्भ के अनुरूप है, पर कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता।
- issue: हागार के माध्यम से सन्तान पाने का रूपक
  choice: ‘मैं उसके द्वारा तेरे लिए सन्तान खड़ी कर सकूँ’
  alternative: ‘मुझे उससे सन्तान प्राप्त हो’
  rationale: ‘निर्माण/खड़ा करने’ का मूल रूपक सुरक्षित रखा गया है और इसे केवल जैविक प्राप्ति तक सीमित नहीं किया गया।
- issue: अन्तिम स्त्रीलिंग कर्ता की अस्पष्टता
  choice: मुख्य पाठ में ‘उसने’ और पादटिप्पणी में सम्भावित स्पष्ट कर्ता
  alternative: मुख्य पाठ में ‘सारै ने’
  rationale: मूल में कर्ता सर्वनामतः निहित है, स्पष्ट नाम नहीं; इसलिए वास्तविक व्याकरणिक अस्पष्टता मुख्य पाठ में बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘सन्तान’, ‘दासी’ और ‘के पास जा’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य हैं। पद का अन्त स्रोत के अनुसार अगले पद से जुड़ती हुई अपूर्ण कथात्मक धारा और अल्पविराम के साथ रखा गया है।
