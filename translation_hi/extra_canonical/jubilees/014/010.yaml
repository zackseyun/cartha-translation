  text: तीन वर्ष की [बछिया], और तीन वर्ष की एक बकरी, और तीन वर्ष का एक मेढ़ा, और एक पंडुक और एक कबूतर।” फिर उसने ये सब महीने के मध्य में[a] लिए, और वह—के पास रहता था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महीने के मध्य में’ शब्द गीज़ पाठ में स्पष्ट रूप से हैं। जुबिलीज़ में उपासना और कालक्रम से जुड़े समय का प्रायः सावधानी से उल्लेख होता है।
    reason: cultural_note
  - marker: b
    text: गीज़ पाठ अंत में शाब्दिक रूप से ‘के पास’ कहता है; इसका कर्म अगले पद में आता है। दीर्घ डैश पद-विभाजन के कारण बनी इस अधूरी कड़ी को दर्शाता है।
    reason: textual_boundary
lexical_decisions:
- source_word: ዘሠለስቱ፡ ዓመት፡
  choice: तीन वर्ष की
  rationale: यह पद पिछले पद में आए मादा पशु का आयु-वर्णन पूरा करता है; स्त्रीलिंग रखकर अध्याय-विभाजन से टूटी हुई व्याकरणिक कड़ी सुरक्षित की गई है।
- source_word: ጠሌ
  choice: बकरी
  rationale: यहाँ बलि के लिए माँगे गए मादा बकरी के बच्चे/बकरी का सामान्य और सहज हिन्दी नाम उपयुक्त है।
- source_word: በገዐ
  choice: मेढ़ा
  rationale: स्रोत में नर भेड़ का संकेत है; ‘मेढ़ा’ आधुनिक हिन्दी में सटीक है।
- source_word: መንጢጠ
  choice: पंडुक
  rationale: यह turtledove के लिए प्रचलित हिन्दी बाइबलीय पक्षी-नाम है और अगले ‘कबूतर’ से भेद बनाए रखता है।
- source_word: ርግብ
  choice: कबूतर
  rationale: सामान्य pigeon/dove के लिए स्वाभाविक हिन्दी शब्द।
- source_word: በመንፈቀ፡ ወርኅ፡
  choice: महीने के मध्य में
  rationale: गीज़ में समय-सूचना स्पष्ट है; जुबिलीज़ की कालक्रम-संबंधी सटीकता बनाए रखने के लिए इसे प्रत्यक्ष रूप से रखा गया है।
- source_word: ይነብር፡ ኀበ፡
  choice: वह पास ही निवास करता था—
  rationale: ኀበ का अर्थ ‘के पास/निकट’ है, लेकिन उसका कर्म अगले पद में आता है। हिन्दी की स्वाभाविक शब्द-व्यवस्था के कारण डैश और टिप्पणी द्वारा अधूरे स्रोत-वाक्य की कड़ी सुरक्षित रखी गई है; ‘वहीं’ कहकर स्थान को अनिर्दिष्ट रूप से पूर्ण नहीं किया गया।
