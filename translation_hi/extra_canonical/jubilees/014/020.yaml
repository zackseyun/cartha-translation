  yaml_path: translation/extra_canonical/jubilees/014/020.yaml
  text: the Kenites, and the Kenizzites, and the Kadmonites, and the Perizzites, and the Rephaim, and the Rakites[a], and the Avvites, and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: hi
  text: केनियों को, कनिज्जियों को, कदमोनियों को, परिज्जियों को, रपाइयों को, राकियों को[a], अव्वियों को, एमोरियों को, कनानियों को, गिर्गाशियों को और यबूसियों को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘राकी’ जातिनाम गीज़ पाठ के रूप को दर्शाता है। समानांतर परंपराओं में संभवतः इसी समूह का नाम किसी दूसरे रूप में मिलता है; इसलिए पाठ में मिले रूप को किसी अधिक परिचित नाम से नहीं बदला गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ለራኬዎን
  choice: राकियों को
  rationale: गीज़ पाठ में ‘राके/राकी’ के अनुरूप संप्रेषित जातिनाम है। इसे समानांतर परंपराओं के ‘अर्की’ जैसे रूप से समरूप नहीं किया गया।
- source_word: ለራፋኤዎን
  choice: रपाइयों को
  rationale: यह रपाई जाति के प्रचलित हिन्दी बाइबलीय नाम को दर्शाता है और गीज़ रूप Rafaʾewon के निकट है।
- source_word: ለከነናኔውስ
  choice: कनानियों को
  rationale: कनान के लोगों के लिए स्वाभाविक और प्रचलित हिन्दी जातिनाम चुना गया।
- source_word: ለ-
  choice: …को
  rationale: सूची के प्रत्येक गीज़ जातिनाम से पहले आए संबंधसूचक उपसर्ग का दातृ/लक्ष्य अर्थ हिन्दी में ‘को’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में बाइबलीय जातिनामों के परिचित देवनागरी रूप अपनाए गए हैं। गीज़ की पुनरावृत्त दातृ रचना को स्पष्ट रखने के लिए प्रत्येक नाम के साथ ‘को’ रखा गया है; अंतिम संयोजक ‘और’ सूची को स्वाभाविक हिन्दी प्रवाह देता है।
