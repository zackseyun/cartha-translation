  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। यह पद पिछले वाक्य से आरम्भ होने वाला खंड है और अगली उक्ति की भूमिका पर समाप्त होता है।
