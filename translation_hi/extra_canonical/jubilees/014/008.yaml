translation:
  language: hi
  text: कनानियों की भूमि को सदा के लिए अपनी संपत्ति के रूप में रखने के लिए, और तुम्हारा तथा तुम्हारे बाद तुम्हारे वंश का परमेश्वर होने के लिए।” और उसने कहा,
