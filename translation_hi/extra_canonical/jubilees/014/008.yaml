lexical_decisions:
- source_word: ከናናዊያን
  choice: कनानियों की भूमि
  rationale: स्रोतांश में केवल ‘कनानियों की’ आता है और वह पिछले संदर्भ के भूमि-सूचक पद से जुड़ा है; स्वाभाविक हिन्दी में निहित संज्ञा ‘भूमि’ स्पष्ट की गई है।
- source_word: ለእኂዝ፡ ለዓለም
  choice: सदा की संपत्ति के रूप में अपने अधिकार में रखने के लिए
  rationale: यह अधिकार/कब्ज़े में रखने और उसके स्थायी होने—दोनों भावों को व्यक्त करता है।
- source_word: ለከዊነ፡ ለከ፡ አምላከ
  choice: तुम्हारा ... परमेश्वर होने के लिए
  rationale: स्रोत के उद्देश्यवाचक अनंत क्रिया-रूप को बिना संभाव्यता या अतिरिक्त व्याख्या जोड़े सीधे रखा गया है।
- source_word: ወለዘርእከ፡ እምድኅሬከ
  choice: तथा तुम्हारे बाद तुम्हारे वंश का
  rationale: ‘बीज’ के वंशगत अर्थ के लिए आधुनिक हिन्दी का स्वाभाविक और गरिमापूर्ण शब्द ‘वंश’ चुना गया है।
- source_word: ወይቤ
  choice: फिर उसने कहा
  rationale: कथात्मक संक्रमण को सहज आधुनिक हिन्दी में व्यक्त करता है; अगली उक्ति से जुड़ने के कारण अंत में अल्पविराम रखा गया है।
theological_decisions:
- issue: परमेश्वर होने के उद्देश्यवाचक कथन का स्वर
  choice: परमेश्वर होने के लिए
  alternative: ताकि मैं परमेश्वर बनूँ / परमेश्वर हो सकूँ
  rationale: स्रोत का अनंत क्रिया-रूप संभाव्यता या अनिश्चितता व्यक्त नहीं करता; इसलिए सरल उद्देश्यवाचक रूप रखा गया है।
