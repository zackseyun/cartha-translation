  text: A deep sleep fell upon Abram; and behold, a great terror of darkness fell upon him. And it was said to Abram, “Know with certainty that your seed will be aliens in a land not theirs, and they will enslave them and afflict them four hundred years.”
translation:
  language: hi
  text: अब्राम पर गहरी नींद छा गई; और देखो, अंधकार का भयंकर भय उस पर आ पड़ा। तब अब्राम से कहा गया, “यह निश्चय जान लो कि तुम्हारा वंश पराए देश में परदेशी होकर रहेगा; वे उन्हें दास बनाएँगे और चार सौ वर्ष तक उन्हें दुःख देंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድንጋፄ
  choice: गहरी नींद
  rationale: यह शब्द यहाँ दैवी दर्शन से जुड़ी गहन या असामान्य निद्रा को व्यक्त करता है; आधुनिक हिन्दी में ‘गहरी नींद’ स्वाभाविक और स्पष्ट है।
- source_word: ግርማ፡ ዐቢይ፡ ጽልመት
  choice: अंधकार का बड़ा भय
  rationale: स्रोत के ‘भय/आतंक’, ‘बड़ा’ और ‘अंधकार’—तीनों घटकों को बनाए रखता है और भय को केवल घने अंधकार में बदलकर अर्थ को हल्का नहीं करता।
- source_word: አእምሮ፡ አእምር
  choice: यह निश्चय जान लो
  rationale: एक ही धातु की पुनरुक्ति ज्ञान की निश्चितता पर बल देती है; हिन्दी में यह मुहावरेदार ढंग से उसी बल को व्यक्त करता है।
- source_word: ዘርእከ
  choice: तुम्हारा वंश
  rationale: शाब्दिक अर्थ ‘तुम्हारा बीज’ है, पर वंशजों के सामूहिक अर्थ में आधुनिक हिन्दी का ‘वंश’ अधिक स्वाभाविक है।
- source_word: ፈላሴ
  choice: परदेशी
  rationale: ऐसे व्यक्ति या समुदाय का अर्थ देता है जो अपने देश से बाहर विदेशी भूमि में रह रहा हो।
- source_word: ምድረ፡ ነኪር
  choice: पराए देश
  rationale: शाब्दिक रूप से ‘विदेशी/अजनबी भूमि’; ‘पराया देश’ इस बात को स्पष्ट रखता है कि वह भूमि उनके अधिकार की नहीं है।
- source_word: ይቀንይዎሙ
  choice: वे उन्हें दास बनाएँगे
  rationale: संदर्भ में पराए देश के निवासी अब्राम के वंश को अधीनता में लाते हैं; यह हिन्दी में दासत्व का भाव स्पष्ट करता है।
- source_word: ያሐምምዎሙ
  choice: उन्हें दुःख देंगे
  rationale: क्रिया कष्ट पहुँचाने या पीड़ित करने का अर्थ देती है; ‘दुःख देंगे’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: चार सौ वर्षों का संबंध दासता और दुःख से
  choice: “दास बनाएँगे और चार सौ वर्ष तक उन्हें दुःख देंगे”
  alternative: “वे चार सौ वर्ष तक उन्हें दास बनाएँगे और दुःख देंगे”
  rationale: स्रोत में अवधि अंत में आती है और उसके सटीक व्याकरणिक विस्तार में कुछ तनाव है। चुनी हुई रचना उसे कम-से-कम निकटवर्ती ‘दुःख देंगे’ से जोड़ती है, बिना यह घोषित किए कि दासता की पूरी अवधि भी अनिवार्यतः ठीक चार सौ वर्ष थी।
- issue: ‘वे’ और ‘उन्हें’ के संकेतार्थ
  choice: स्रोत की सर्वनामात्मक अभिव्यक्ति बनाए रखी गई
  alternative: “वहाँ के लोग तुम्हारे वंश को दास बनाएँगे”
  rationale: संदर्भ से अर्थ समझ में आता है, पर स्रोत जिन पक्षों को सर्वनामों से व्यक्त करता है उन्हें नाम देकर अनावश्यक रूप से अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य की दर्शनात्मक गंभीरता और स्रोत की पुनरुक्ति से उत्पन्न निश्चितता को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
