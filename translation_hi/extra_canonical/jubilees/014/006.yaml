lexical_decisions:
- source_word: ከዋክብተ
  choice: तारों को
  rationale: यह पद पिछले वाक्य से जुड़ा हुआ अंश है; कर्मकारक अर्थ और खंडित आरंभ को स्रोत के अनुसार बनाए रखा गया है।
- source_word: ዘርእከ
  choice: तुम्हारा वंश
  rationale: गीज़ शब्द ‘बीज’ और ‘संतान/वंश’ दोनों का अर्थ रख सकता है; इस संदर्भ में स्वाभाविक हिन्दी ‘वंश’ है, जबकि सामूहिक भाव सुरक्षित रहता है।
- source_word: አምኖ ለእግዚአብሔር
  choice: प्रभु पर विश्वास किया
  rationale: यह सम्बन्धपरक विश्वास को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और परमेश्वर के लिए प्रयुक्त स्रोत-पद को ‘प्रभु’ से दर्शाता है।
- source_word: ተኈለቍ ጽድቀ
  choice: धार्मिकता गिना गया
  rationale: गिनने/लेखा करने की धारणा को बनाए रखते हुए निष्क्रिय रूप और धार्मिकता की संज्ञा सुरक्षित रखी गई है।
theological_decisions:
- issue: विश्वास और धार्मिकता के बीच सम्बन्ध
  choice: “यह उसके लिए धार्मिकता गिना गया”
  alternative: “उसका विश्वास उसके लिए धार्मिकता गिना गया”
  rationale: स्रोत में कर्ता अथवा ‘विश्वास’ को स्पष्ट रूप से दोहराया नहीं गया है। इसलिए अस्पष्ट सर्वनामात्मक भाव को बनाए रखा गया है और यह नहीं तय किया गया कि ठीक-ठीक क्या गिना गया।
- issue: ईश्वरीय नाम का निरूपण
  choice: प्रभु
  alternative: यहोवा
  rationale: गीज़ እግዚአብሔር सामान्यतः ‘प्रभु/परमेश्वर’ का पद है और यहाँ किसी विशिष्ट हिन्दी लिप्यंतरण को बाध्य नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद का आरंभ स्रोत और दिए गए खंड-विभाजन के अनुसार जानबूझकर अपूर्ण रखा गया है, क्योंकि ‘तारों को’ पिछले पद के वाक्य से जुड़ता है।
