  text: Sarah took Hagar, her maidservant, the Egyptian, and gave her to Abram her husband as a wife. And he went in to her, and she conceived and bore a son, and he called his name Ishmael, in the fifth year of this week; and that year was the eighty-sixth year in Abram’s life.
translation:
  language: hi
  text: सारा ने अपनी मिस्री दासी हागर को लिया और उसे अपने पति अब्राम को पत्नी के रूप में दे दिया। अब्राम उसके पास गया, और वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया। अब्राम ने उसका नाम इश्माएल रखा। यह इस सप्ताह का पाँचवाँ वर्ष था, और वह अब्राम के जीवन का छियासीवाँ वर्ष था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጋር፡ ለአአታ፡ ግብጻዊት
  choice: अपनी मिस्री दासी हागर
  rationale: व्यक्ति का नाम, सारा से उसका संबंध और उसकी मिस्री पहचान—तीनों स्रोत के अनुसार स्वाभाविक हिन्दी क्रम में रखे गए हैं।
- source_word: ለአብራም፡ ለምታ፡ ትኩኖ፡ ብእሲተ
  choice: अपने पति अब्राम को पत्नी के रूप में दे दिया
  rationale: ለምታ (‘उसका पति’) को स्पष्ट रूप से सुरक्षित रखते हुए पत्नी बनाए जाने का आशय सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ወቦአ፡ ኀቤሃ
  choice: अब्राम उसके पास गया
  rationale: स्रोत के शिष्ट यौन-संकेतक मुहावरे को हिन्दी के समान शिष्ट और पारंपरिक मुहावरे में रखा गया है; अर्थ को अनावश्यक रूप से अधिक स्पष्ट नहीं किया गया।
- source_word: ይስማዔል
  choice: इश्माएल
  rationale: नाम का मानक हिन्दी बाइबिलीय रूप चुना गया है।
- source_word: በዓመተ፡ ኃምስ፡ ዘዘሰብዐ
  choice: इस सप्ताह का पाँचवाँ वर्ष
  rationale: जुबली-वृत्तांत की कालगणना में ‘सप्ताह’ वर्षों के सातक को दर्शाता है; स्रोत की विशिष्ट शब्दावली को बनाए रखा गया है।
- source_word: ዓመት፡ ሰማንያ፡ ወስድስቱ፡ ዓም፡ በሕይወተ፡ አብራም
  choice: अब्राम के जीवन का छियासीवाँ वर्ष
  rationale: अब्राम की आयु-सूचना को स्रोत के क्रम और अर्थ के निकट, किंतु स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
theological_decisions:
- issue: हागर को ‘पत्नी’ के रूप में दिए जाने की स्थिति
  choice: पत्नी के रूप में दे दिया
  alternative: उपपत्नी के रूप में दे दिया
  rationale: स्रोत में सामान्यतः ‘स्त्री/पत्नी’ का शब्द है; ‘उपपत्नी’ कहना सामाजिक या वैधानिक स्थिति की ऐसी व्याख्या जोड़ देता जिसे यह पद स्वयं स्पष्ट नहीं करता।
- issue: ‘उसके पास गया’ का आशय
  choice: स्रोत का शिष्ट मुहावरा बनाए रखा
  alternative: उससे शारीरिक संबंध बनाया
  rationale: मूल पाठ यौन संबंध को संकेतात्मक भाषा में व्यक्त करता है; अनुवाद ने उसी मर्यादा और साहित्यिक तनाव को सुरक्षित रखा है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबे स्रोत-वाक्य को पठनीयता के लिए छोटे वाक्यों में विभाजित किया गया, पर घटनाक्रम और काल-सूचना अपरिवर्तित हैं।
