  yaml_path: translation/extra_canonical/jubilees/014/021.yaml
  text: And that day passed, and Abram offered up the pieces and the birds and their grain offerings and their drink offerings, and fire consumed them.
translation:
  language: hi
  text: और वह दिन बीत गया। अब्राम ने उन टुकड़ों और पक्षियों को तथा उनके साथ अन्न-बलियाँ और पेय-बलियाँ चढ़ाईं; और आग ने उन्हें भस्म कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክፍላተ
  choice: टुकड़ों
  rationale: यह बहुवचन पद पहले विभाजित किए गए पशुओं के अंगों या टुकड़ों को सूचित करता है; इसलिए सामान्य किंतु प्रसंगानुकूल शब्द चुना गया।
- source_word: አዕዋፈ
  choice: पक्षियों
  rationale: गीज़ बहुवचन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: መሥዋዕቶሙ
  choice: उनके साथ अन्नबलियाँ
  rationale: यद्यपि पद का व्यापक अर्थ बलि/भेंट हो सकता है, अगले पद ‘अर्घ’ के साथ इसका युग्म इस याजकीय प्रसंग में अन्नबलि की ओर संकेत करता है। ‘उनके साथ’ संबंधसूचक प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሞጻሕቶሙ
  choice: अर्घ
  rationale: यह पेय-भेंट को सूचित करता है; ‘अर्घ’ संक्षिप्त, प्रतिष्ठित और हिन्दी बाइबलीय शैली में समझने योग्य cultic पद है।
- source_word: በልዐቶሙ፡ እሳት
  choice: आग ने उन्हें भस्म कर दिया
  rationale: शाब्दिक अर्थ ‘आग ने उन्हें खा लिया’ है; ‘भस्म कर दिया’ हिन्दी में अग्नि द्वारा पूर्णतः जला दिए जाने का स्वाभाविक और गरिमापूर्ण रूप है।
theological_decisions:
- issue: መሥዋዕቶሙ का अर्थ
  choice: अन्नबलियाँ
  alternative: बलियाँ / भेंटें
  rationale: पेय-भेंट के साथ cultic युग्म और संभावित सेमिटिक पृष्ठभूमि अधिक विशिष्ट ‘अन्नबलि’ का समर्थन करती है; व्यापक ‘बलियाँ’ पशु-पक्षियों के टुकड़ों के साथ अनावश्यक पुनरुक्ति उत्पन्न करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और कथात्मक शैली रखी गई है। ‘अन्नबलियाँ’ और ‘अर्घ’ से याजकीय विशिष्टता सुरक्षित रहती है, जबकि वाक्य सामान्य पाठक के लिए प्रवाहपूर्ण है।
