translation:
  language: hi
  text: मम्रे का बलूत-वृक्ष, जो हेब्रोन के पास है। वहाँ उसने एक वेदी बनाई और बलि चढ़ाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድራይ፡ ዘማምሬ
  choice: मम्रे का बांज वृक्ष
  rationale: ድራይ को वृक्ष-नाम के रूप में ‘बांज वृक्ष’ और संबंधसूचक ዘ को ‘का’ से व्यक्त किया गया; यह माम्रे के प्रसिद्ध वृक्ष का स्वाभाविक हिन्दी रूप है।
- source_word: ቅሩበ፡ ኬብሮን
  choice: हेब्रोन के पास
  rationale: स्थानिक निकटता को सरल और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሐነጸ፡ ምሥዋዐ
  choice: एक वेदी बनाई
  rationale: ሐነጸ का मूल अर्थ ‘निर्माण किया’ और ምሥዋዐ का अर्थ ‘वेदी’ है; हिन्दी में ‘वेदी बनाई’ स्वाभाविक है।
- source_word: ወዘብሐ
  choice: और बलि चढ़ाई
  rationale: क्रिया बलिदान के लिए पशु वध/बलि करने को दर्शाती है; वेदी के प्रसंग में ‘बलि चढ़ाई’ अर्थ को पूर्ण और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ዘብሐ को केवल ‘वध किया’ या धार्मिक बलिदान के रूप में प्रस्तुत करना
  choice: बलि चढ़ाई
  alternative: वध किया
  rationale: वेदी के तत्काल प्रसंग से बलिदानात्मक आशय स्पष्ट है। ‘बलि चढ़ाई’ इस धार्मिक क्रिया को व्यक्त करता है, बिना बलि के प्रकार या विधि के बारे में अतिरिक्त दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल अंश की वाक्य-खंडात्मक शुरुआत बनाए रखी गई है, क्योंकि यह पिछले संदर्भ से जारी वाक्यांश प्रतीत होता है।
