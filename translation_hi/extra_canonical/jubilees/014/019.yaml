  yaml_path: translation/extra_canonical/jubilees/014/019.yaml
  text: On that day the LORD made a covenant with Abram, saying, “To your offspring I will give this land, from the river of Egypt to the great river, the river Euphrates.”
translation:
  language: hi
  text: उस दिन यहोवा ने अब्राम के साथ वाचा बाँधी और कहा, “मैं तुम्हारे वंश को यह देश दूँगा—मिस्र की नदी से लेकर महानदी, अर्थात फ़रात नदी तक।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳነ
  choice: वाचा
  rationale: यह शब्द औपचारिक और बाध्यकारी covenant को व्यक्त करता है; हिन्दी बाइबलीय प्रयोग में ‘वाचा’ सटीक और प्रतिष्ठित है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यहाँ स्रोत-पाठ में परमेश्वर का पारंपरिक दैवी नाम है; ‘यहोवा’ हिन्दी पाठकों के लिए परिचित प्रतिनिधित्व है।
- source_word: ለዘርእከ
  choice: तुम्हारे वंश को
  rationale: ‘बीज’ का शाब्दिक रूप हिन्दी में इस संदर्भ में अप्राकृतिक होगा; ‘वंश’ सामूहिक संतति का अर्थ बनाए रखता है और संख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ፈለገ፡ ግብጽ
  choice: मिस्र की नदी
  rationale: स्रोत का सीधा भौगोलिक पदनाम रखा गया है; इसे किसी विशेष जलधारा से पहचानकर अस्पष्टता दूर नहीं की गई।
- source_word: ፈለገ፡ ዐቢይ፡ ፈለገ፡ ኤውፍራጢስ
  choice: महानदी, अर्थात फ़रात नदी
  rationale: स्रोत में ‘महान नदी’ के बाद ‘फ़रात नदी’ आता है; ‘अर्थात’ हिन्दी में दोनों पदों के समानाधिकरण को स्वाभाविक ढंग से स्पष्ट करता है।
theological_decisions:
- issue: वाचा में भूमि पाने वाले ‘वंश/बीज’ का सामूहिक या एकवचन अर्थ
  choice: ‘वंश’ द्वारा सामूहिक और खुला अर्थ सुरक्षित रखा गया
  alternative: ‘संतानों’ या ‘एक वंशज’
  rationale: स्रोत शब्द सामूहिक संतति को सूचित कर सकता है और आगे की किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को यहाँ आरोपित नहीं करता।
- issue: ‘मिस्र की नदी’ की भौगोलिक पहचान
  choice: पारंपरिक पदनाम को बिना पहचान निर्धारित किए रखा गया
  alternative: नील नदी या मिस्र का नाला
  rationale: स्रोत स्वयं केवल ‘मिस्र की नदी’ कहता है; अधिक विशिष्ट अनुवाद वास्तविक पाठगत अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘वाचा बाँधी’ प्रचलित और स्वाभाविक पदबंध है। सीमा के विस्तार को स्पष्ट करने के लिए दीर्घ विराम और समानाधिकरण के लिए ‘अर्थात’ का प्रयोग किया गया है।
