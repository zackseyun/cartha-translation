  text: And I will also judge the nation to whom they will be enslaved, and after this they will come out from there with much property.
translation:
  language: hi
  text: और जिस जाति के वे दास होंगे, उसका भी मैं न्याय करूँगा; और इसके बाद वे वहाँ से बहुत-सी संपत्ति लेकर निकलेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለሕዝብ፡ኒ
  choice: और ... जाति का भी
  rationale: संयोजक ወ और संलग्न बलवाचक ኒ दोनों को व्यक्त करता है; ኒ का अर्थ यहाँ ‘भी’ है।
- source_word: ይትቀነዩ
  choice: वे दास होंगे
  rationale: यह भविष्यवाणी के प्रसंग में अपूर्ण/भविष्य रूप है और अधीन होकर दासता करने का भाव देता है।
- source_word: እፈትሖሙ፡ ሎሙ
  choice: उसका ... न्याय करूँगा
  rationale: क्रिया में न्याय करने अथवा दंड देकर न्याय चुकाने का भाव है; ‘न्याय करूँगा’ मूल की न्यायिक व्यापकता बनाए रखता है।
- source_word: ጥሪት፡ ብዙኅ
  choice: बहुत-सी संपत्ति
  rationale: ጥሪት भौतिक धन-संपत्ति/माल का बोध कराता है और ብዙኅ उसकी प्रचुरता बताता है।
theological_decisions:
- issue: दासता वाली सापेक्ष उपवाक्य का काल
  choice: जिस जाति के वे दास होंगे
  alternative: जिस जाति के वे दास हैं
  rationale: भविष्यवाणी का कालक्रम और गीइज़ अपूर्ण रूप भविष्य अर्थ का समर्थन करते हैं।
- issue: ईश्वरीय न्याय की अभिव्यक्ति
  choice: उसका भी मैं न्याय करूँगा
  alternative: उसे भी मैं दंड दूँगा
  rationale: ‘न्याय’ स्रोत की न्यायिक अर्थ-सीमा और धर्मवैचारिक तनाव को ‘दंड’ की अपेक्षा अधिक खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-सन्निकट वाक्य; ‘संपत्ति लेकर’ हिन्दी में साथ बाहर लाने के भाव को स्वाभाविक रूप से व्यक्त करता है।
