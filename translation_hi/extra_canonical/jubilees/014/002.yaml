  text: and your reward will be exceedingly great.” And he said[a], “Lord, Lord, what will you give me? For I go childless, and the son of Maseq, the son of my maidservant, is Damascus."”
translation:
  language: hi
  text: “और तेरा प्रतिफल अत्यन्त बड़ा होगा।” तब उसने कहा, “हे प्रभु, हे प्रभु, तू मुझे क्या देगा? मैं तो निःसन्तान ही जा रहा हूँ, और मासेक का पुत्र, मेरी दासी का पुत्र, दमिश्क है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़ में यह वाक्यांश अत्यन्त संकुचित और पाठ की दृष्टि से कठिन है: ‘मासेक’ और ‘दमिश्क’ पास-पास आते हैं, पर ‘एलीएज़ेर’ नाम नहीं मिलता। उत्पत्ति 15:2 के समानान्तर कथन के आधार पर यहाँ सम्भवतः घराने के उत्तराधिकारी, दमिश्कवासी एलीएज़ेर, की ओर संकेत है।'
    reason: textual_and_segmentation_note
lexical_decisions:
- source_word: ዐስብከ
  choice: तेरा प्रतिफल
  rationale: यह संज्ञा पुरस्कार, मजदूरी या प्रतिफल का अर्थ देती है; इस प्रसंग में ‘प्रतिफल’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ይፈደፍድ፡ ጥቀ
  choice: अत्यन्त बड़ा होगा
  rationale: तीव्रता और परिमाण दोनों को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: አሐውር፡ ዘእንበለ፡ ውሉድ
  choice: मैं तो निःसन्तान ही जा रहा हूँ
  rationale: ‘जाना’ क्रिया तथा सन्तान-विहीन अवस्था को बनाए रखता है; ‘ही’ वक्ता की व्यथा को स्वाभाविक हिन्दी में उभारता है।
- source_word: ወወልደ፡ ማሴቅ፡ ወልደ፡ አመትየ
  choice: और मेरी दासी के पुत्र मासेक का पुत्र
  rationale: गीज़ की संकुचित सम्बन्ध-श्रृंखला को बिना किसी नाम की पूर्ति किए यथासम्भव औपचारिक रूप से सुरक्षित रखता है।
- source_word: ውእቱ፡ ደማስቆስ
  choice: दमिश्क है
  rationale: स्रोत में स्पष्ट रूप से ‘वह/है दमिश्क’ है और एलीएज़ेर नाम नहीं है; इसलिए मूल की असामान्य पाठ-स्थिति को बनाए रखा गया है।
theological_decisions:
- issue: उत्पत्ति 15:2 के समानान्तर पाठ से ‘एलीएज़ेर’ नाम की पूर्ति
  choice: मुख्य पाठ में नाम नहीं जोड़ा गया
  alternative: ‘दमिश्क का एलीएज़ेर’ अथवा ‘यह दमिश्की एलीएज़ेर है’
  rationale: प्राप्त गीज़ पाठ में एलीएज़ेर अनुपस्थित है। समानान्तर बाइबिलीय पाठ से उसे जोड़ना मूल पाठ की वास्तविक कठिनाई को चुपचाप सुलझा देता।
- issue: अन्तिम वाक्यांश की अस्पष्ट वंश-संरचना
  choice: ‘मेरी दासी के पुत्र मासेक का पुत्र दमिश्क है’
  alternative: अर्थ स्पष्ट करके घराने के उत्तराधिकारी एलीएज़ेर का उल्लेख
  rationale: मूल की संकुचित और कठिन संरचना को मुख्य पाठ में सुरक्षित रखा गया है तथा सम्भावित आशय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘हे प्रभु, हे प्रभु’ की पुनरुक्ति और स्रोत के असामान्य अन्तिम कथन को बनाए रखा गया है; व्याख्यात्मक सामंजस्य केवल पादटिप्पणी में दिया गया है।
