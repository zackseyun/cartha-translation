lexical_decisions:
- source_word: እግዚኦ፡ እግዚኦ
  choice: हे प्रभु, हे प्रभु
  rationale: स्रोत की दोहरी पुकार और संबोधन का बल बनाए रखा गया है।
- source_word: በምንት፡ አአምር
  choice: मैं किस बात से जानूँ
  rationale: शाब्दिक अर्थ ‘किससे/किस बात के द्वारा मैं जानूँ’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और चिन्ह अथवा प्रमाण की माँग को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ከመ፡ እወርሳ
  choice: कि मैं इसका उत्तराधिकारी होऊँगा
  rationale: क्रिया के उत्तराधिकार/अधिकार पाने के भाव को सुरक्षित रखा गया है; ‘इसका’ पूर्ववर्ती प्रतिज्ञात विषय की ओर संकेत करता है।
- source_word: ንሣእ፡ ሊተ
  choice: मेरे लिए … ले आ
  rationale: आज्ञार्थक क्रिया और लाभार्थक ‘मेरे लिए’ दोनों को सहज हिन्दी में रखा गया है।
- source_word: ጣዕዋ
  choice: तीन वर्ष की एक बछिया
  rationale: चार्ल्स के पाठ और समानांतर उत्पत्ति 15:9 के अनुसार तीन वर्ष की मादा गाय का आशय व्यक्त किया गया है।
theological_decisions:
- issue: प्रतिज्ञा के विषय का संकेत
  choice: इसका उत्तराधिकारी होऊँगा
  alternative: इसे अपने अधिकार में पाऊँगा
  rationale: ‘उत्तराधिकारी’ मूल क्रिया के विरासत-संबंधी अर्थ और पाठ की धर्मवैचारिक प्रतिध्वनि को बनाए रखता है; अधिक व्याख्यात्मक ‘भूमि’ नहीं जोड़ा गया।
- issue: जानने के साधन की अस्पष्टता
  choice: किस बात से जानूँ
  alternative: किस चिन्ह से जानूँ
  rationale: स्रोत में ‘चिन्ह’ के लिए स्पष्ट संज्ञा नहीं है, इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज प्रत्यक्ष कथन। पद अगले वाक्य में जारी है, इसलिए अंतिम उद्धरण के भीतर अल्पविराम रखा गया है।
