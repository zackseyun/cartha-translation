  text: “Lord, Lord, by what shall I know that I will inherit it?” And he said to him, “Bring me a three-year-old heifer,”
translation:
  language: hi
  text: “हे प्रभु, हे प्रभु, मैं किस बात से जानूँ कि मैं इसे विरासत में पाऊँगा?” तब उसने उससे कहा, “मेरे लिए तीन वर्ष की एक बछिया ले आ,”
