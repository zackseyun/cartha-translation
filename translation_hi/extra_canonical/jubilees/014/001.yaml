base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/014/001.yaml
  text: And after this new moon[a], in the fourth year of this week, on the new moon of the third month, the word of the LORD came to Abram in a dream, saying, “Do not fear, Abram; I am your protector, and your reward will be very great.”
translation:
  language: hi
  text: 'और इस बात के बाद, इस सप्ताह के चौथे वर्ष में, तीसरे महीने के नवचंद्र[a] पर, प्रभु का वचन अब्राम के पास स्वप्न में आया: “मत डर, अब्राम। मैं तेरा रक्षक हूँ, और तेरा प्रतिफल बहुत बड़ा होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ शब्द का अर्थ ‘उदय के समय’ या ‘आरंभ में’ भी हो सकता है, पर जुबिलीज़ की कालगणना में यह प्रायः महीने के ‘नवचंद्र’ को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: ወእምድኅረዝ፡ ነገር
  choice: और इन बातों के बाद
  rationale: शाब्दिक अर्थ ‘और इस बात/विषय के बाद’ है; प्रसंग-संयोजक के रूप में स्वाभाविक हिन्दी ‘इन बातों के बाद’ है। इसे ‘इस नवचंद्र के बाद’ नहीं बनाया गया, क्योंकि ነገር का अर्थ ‘बात/विषय’ है, जबकि नवचंद्र-संबंधी पद आगे आता है।
- source_word: ዘዝሱባዔ
  choice: इस सप्ताह के
  rationale: जुबिलीज़ की कालगणना में ‘सप्ताह’ वर्षों के सातक को सूचित करता है; मूल की विशिष्ट काल-संरचना को बनाए रखा गया है।
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  choice: तीसरे महीने के नवचंद्र पर
  rationale: ሠርቀ मूलतः उदय/आरंभ का बोध करा सकता है, पर जुबिलीज़ की पंचांग-संबंधी भाषा में महीने के आरंभ, अर्थात नवचंद्र, के लिए प्रयुक्त होता है।
- source_word: ቃለ፡ እግዚአብሔር
  choice: यहोवा का वचन
  rationale: ईश्वर के व्यक्तिगत नाम को ‘यहोवा’ और सामान्य बाइबलीय सूत्र को स्पष्ट, परिचित हिन्दी में रखा गया है।
- source_word: ኢትፍራህ
  choice: मत डर
  rationale: निषेधात्मक आज्ञा का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ሞገስከ
  choice: तेरा रक्षक
  rationale: उपलब्ध परामर्श-पाठ और पूर्ण पद की स्रोत-परंपरा के अनुसार संरक्षण देने वाले की संज्ञा; हिन्दी में ‘रक्षक’ सहज और अर्थपूर्ण है।
- source_word: ወዐስብከ፡ ዐቢይ፡ ጥቀ
  choice: और तेरा प्रतिफल बहुत बड़ा होगा
  rationale: पूर्ण पद में प्रमाणित अंतिम खंड का स्वाभाविक हिन्दी रूप; ‘प्रतिफल’ मूल के पुरस्कार/फल संबंधी अर्थ और धर्मवैचारिक अनुगूँज को बनाए रखता है।
theological_decisions:
- issue: ‘मैं तेरा रक्षक हूँ’ और ‘तेरा प्रतिफल बहुत बड़ा होगा’ के बीच संबंध
  choice: दोनों को एक ही ईश्वरीय कथन के समन्वित खंडों के रूप में रखा गया
  alternative: ‘मैं ही तेरा रक्षक और तेरा अत्यन्त बड़ा प्रतिफल हूँ’
  rationale: मूल की वाक्यरचना यह पूरी तरह निश्चित नहीं करती कि स्वयं परमेश्वर ‘प्रतिफल’ हैं या प्रतिफल देने वाले; चुना गया रूप परामर्श-पाठ का अनुसरण करते हुए इस धर्मवैचारिक पहचान को अनावश्यक रूप से आरोपित नहीं करता।
- issue: ईश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: इथियोपिक እግዚአብሔር सामान्यतः ‘प्रभु’ है, किंतु यहाँ उत्पत्ति 15:1 की उद्धरणात्मक परंपरा और परामर्श-पाठ में LORD के आधार पर वाचा-संबंधी व्यक्तिगत नाम ‘यहोवा’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। संबोधन में ‘तेरा’ रखा गया है ताकि प्रत्यक्ष ईश्वरीय वचन की आत्मीय एकवचनता बनी रहे। उपलब्ध गीज़ उद्धरण अंतिम कथन के बीच में कट जाता है; अंतिम दो पदबंध पूर्ण पद की स्रोत-परंपरा और लेखापरीक्षित परामर्श-पाठ के प्रमाण पर सम्मिलित किए गए हैं।
