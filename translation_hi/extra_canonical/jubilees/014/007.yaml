  yaml_path: translation/extra_canonical/jubilees/014/007.yaml
  text: And he said to him, “I am the LORD who brought you out from Ur of the Chaldeans, so that I might give you this land to inherit it.”
translation:
  language: hi
  text: और उसने उससे कहा, “मैं प्रभु हूँ, जो तुम्हें कसदियों के ऊर से निकाल लाया, ताकि मैं तुम्हें यह देश विरासत में दूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ में यह परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ मूल के पदवी-संबंधी स्वरूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ኡር፡ ዘከለዳዊያን
  choice: कसदियों का ऊर
  rationale: स्थाननाम और जनसमूह के पारंपरिक, स्पष्ट हिन्दी रूप को अपनाया गया है।
- source_word: ምድረ፡ ዛቲ
  choice: यह देश
  rationale: पूर्ण पद में संकेतवाचक ‘यह’ भूमि/देश को निर्दिष्ट करता है; हिन्दी में ‘देश’ प्रतिज्ञात भूभाग के लिए स्वाभाविक है।
- source_word: ትረሳ
  choice: विरासत में दूँ
  rationale: क्रिया का आशय भूमि को उत्तराधिकार/विरासत के रूप में प्राप्त कराना है; यह रूप उद्देश्य और विरासत दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम/उपाधि का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: उपलब्ध गीज़ पाठ में टेट्राग्राम का लिप्यंतरण नहीं, बल्कि ईश्वरीय उपाधि እግዚአብሔር है; इसलिए किसी विशिष्ट हिब्रू नाम को आयात किए बिना ‘प्रभु’ चुना गया।
- issue: भूमि देने का उद्देश्य और विरासत का भाव
  choice: ताकि मैं तुम्हें यह देश विरासत में दूँ
  alternative: कि तुम इस देश के अधिकारी हो जाओ
  rationale: चुना गया रूप परमेश्वर को देने वाले कर्ता के रूप में रखता है और विरासत का भाव भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘उसने उससे’ मूल पाठ के सर्वनामगत संदर्भ को बिना अनावश्यक नाम जोड़कर सुरक्षित रखता है। प्रदत्त गीज़ अंश ‘देश’ पर कटता है, पर Charles 1895 के पूर्ण पद के प्रमाण और सत्यापित संशोधन के अनुसार ‘यह देश विरासत में दूँ’ सम्मिलित किया गया है।
