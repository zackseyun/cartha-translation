  text: And in the fourth generation they will return here, for the sin of the Amorites is not complete until now.”
translation:
  language: hi
  text: और चौथी पीढ़ी में वे यहाँ लौटेंगे, क्योंकि अमोरियों का पाप अब तक पूरा नहीं हुआ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበትውልድ፡ ራብዕ
  choice: और चौथी पीढ़ी में
  rationale: मूल के क्रमसूचक पद और पीढ़ी-संबंधी अर्थ को स्वाभाविक हिन्दी में सीधे रखा गया है।
- source_word: ይትመየጡ፡ ዝየ
  choice: वे यहाँ लौटेंगे
  rationale: क्रिया का भाव लौटने का है और ዝየ स्थानवाचक ‘यहाँ’ है; भविष्यकाल को बनाए रखा गया है।
- source_word: ኃጢአቶሙ፡ ለአሞሬዎን
  choice: अमोरियों का पाप
  rationale: संबंधवाचक रचना को सहज हिन्दी में व्यक्त किया गया है; सामूहिक एकवचन ‘पाप’ मूल और संदर्भ दोनों के अनुरूप है।
- source_word: ኢተፈጸመ ... እስከ፡ ይእዜ
  choice: अब तक पूरा नहीं हुआ है
  rationale: निषेध, पूर्णता और ‘अब तक’ की कालगत सीमा को बिना अनावश्यक ‘अभी तक ... अब तक’ दोहराव के सुरक्षित रखा गया है।
theological_decisions:
- issue: अमोरियों के पाप की पूर्णता
  choice: पाप ‘अब तक पूरा नहीं हुआ है’
  alternative: अमोरियों का अधर्म अभी अपनी पराकाष्ठा तक नहीं पहुँचा है
  rationale: मूल की ‘पूरा होना’ वाली संक्षिप्त और तनावपूर्ण अभिव्यक्ति को बनाए रखा गया है; व्याख्यात्मक ‘पराकाष्ठा’ नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। वाक्य में मूल की कारणसूचक संरचना और भविष्यकाल सुरक्षित हैं। आरंभिक ‘और’ प्रसंगगत निरंतरता दर्शाता है।
