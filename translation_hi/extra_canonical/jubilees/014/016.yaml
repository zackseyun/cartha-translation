  text: But you will go to your fathers in peace, and you will be buried at a good old age.
translation:
  language: hi
  text: परन्तु तुम शान्ति से अपने पुरखाओं के पास जाओगे और अच्छी वृद्धावस्था में दफ़नाए जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐውር፡ ኀበ፡ አበዊከ
  choice: अपने पुरखाओं के पास जाओगे
  rationale: गीज़ पदबंध का सीधा और स्वाभाविक रूप; मृत्यु के संकेतार्थ को स्पष्ट किए बिना मूल अभिव्यक्ति बनाए रखता है।
- source_word: በሰላም
  choice: शान्ति से
  rationale: मूल के रीति/अवस्था-सूचक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ትትቀበር
  choice: दफ़नाए जाओगे
  rationale: निष्क्रिय क्रिया का अर्थ और भविष्यकाल सुरक्षित रखता है।
- source_word: በርእስ፡ ሠናይ
  choice: अच्छी वृद्धावस्था में
  rationale: शाब्दिक रूप से ‘अच्छे बुढ़ापे/वृद्धावस्था में’; हिन्दी में गरिमापूर्ण और अर्थ-सटीक अभिव्यक्ति।
theological_decisions:
- issue: ‘अपने पुरखाओं के पास जाना’ का आशय
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: शान्ति से मरोगे
  rationale: मूल पाठ मृत्यु को प्रत्यक्ष रूप से नहीं कहता; पूर्वजों के पास जाने की वास्तविक अभिव्यक्ति और उसकी संभावित धार्मिक गूँज को सुरक्षित रखना उचित है।
- issue: अच्छी वृद्धावस्था का वाक्यगत सम्बन्ध
  choice: दफ़नाए जाने के समय/अवस्था से जोड़ा गया
  alternative: बहुत बूढ़े होकर दफ़नाए जाओगे
  rationale: मूल पूर्वसर्गीय पदबंध को बिना अनावश्यक तीव्रता जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबिलीय गद्य। ‘पुरखाओं’ सामान्य पाठक के लिए सहज है; ‘शान्ति’ और ‘वृद्धावस्था’ औपचारिक गरिमा बनाए रखते हैं।
