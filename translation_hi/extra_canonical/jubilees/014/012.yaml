  text: all these, and poured out their blood upon the altar, and divided them in the middle, and placed them opposite one another, face to face; but the birds he did not divide. And birds came down upon the pieces,
translation:
  language: hi
  text: उसने इन सबको लिया और उनका लहू वेदी पर उँडेल दिया। फिर उसने उन्हें बीच से चीरकर उनके टुकड़ों को एक-दूसरे के सामने, आमने-सामने रखा; पर पक्षियों को उसने नहीं चीरा। और पक्षी उन टुकड़ों पर उतर आए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከዐወ፡ ደሞሙ፡ ውስተ፡ ምሥዋዕ
  choice: और उनका लहू वेदी पर उँडेल दिया
  rationale: क्रिया और उसके लक्ष्य को सीधे रखते हुए गीइज़ के बलिदान-संबंधी दृश्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ወነፈቆሙ፡ እማእከል
  choice: फिर उसने उन्हें बीच से चीरकर
  rationale: मूल में वस्तुओं को मध्य से दो भाग करने का भाव है; ‘चीरकर’ पशु-बलि के प्रसंग में ‘बाँटा’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: ወአንበሮሙ፡ አንጻራቲሆሙ፡ በበገጾሙ
  choice: उनके टुकड़ों को आमने-सामने रखा
  rationale: ‘एक-दूसरे के सामने, मुख के अनुसार’ का आशय हिन्दी मुहावरे ‘आमने-सामने’ से स्पष्ट होता है; ‘टुकड़ों’ को स्पष्टतः जोड़ने से सर्वनाम का संदर्भ सहज बनता है।
- source_word: ወለዐዋፊሰ፡ ኢነተፈ
  choice: पर पक्षियों को उसने नहीं चीरा
  rationale: विरोधसूचक संरचना और वही विभाजन-क्रिया बनाए रखी गई है।
- source_word: ወይወርዱ፡ አዕዋፍ፡ ዲበ፡ ክፍሉ
  choice: तब पक्षी उन टुकड़ों पर उतर आए
  rationale: מूल का बहुवचन ‘पक्षी’ और नीचे आकर टुकड़ों पर बैठने/उतरने की गति सुरक्षित रखी गई है।
theological_decisions:
- issue: उत्पत्ति 15 से समानता के कारण शिकारी पक्षियों का अर्थ ग्रहण करना
  choice: सामान्य शब्द ‘पक्षी’ रखा गया
  alternative: ‘शिकारी पक्षी’ या ‘गिद्ध’
  rationale: प्रस्तुत गीइज़ पाठ में सामान्य ‘पक्षी’ शब्द है; समानांतर बाइबिल प्रसंग के आधार पर उसका अर्थ संकीर्ण नहीं किया गया।
- issue: पद के आरम्भ में कर्ता की स्पष्टता
  choice: मूल की तरह निहित एकवचन कर्ता रखा गया
  alternative: ‘अब्राम ने इन सबको लिया’
  rationale: दिए गए अंश में नाम उपस्थित नहीं है; संदर्भ से मिलने वाले कर्ता को पाठ में जोड़ने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। वाक्य का अंतिम अल्पविराम रखा गया है, क्योंकि स्रोत और परामर्श-पाठ दोनों में कथन अगले पद/खंड में जारी रहता है।
