  text: Eliezer—he will inherit me, and to me you have not given seed.” And he said to him, “This one will not inherit you,”
translation:
  language: hi
  text: “एलीएज़ेर—वही मेरा वारिस होगा, और तूने मुझे कोई संतान नहीं दी।” तब उसने उससे कहा, “यह व्यक्ति तेरा वारिस नहीं होगा,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኤሊኤዜር
  choice: एलीएज़ेर
  rationale: व्यक्तिनाम को गीइज़ रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: ውእቱ
  choice: वही
  rationale: यह स्वतंत्र सर्वनाम एलीएज़ेर पर बल देता है; ‘वही’ उस emphatic अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይወርሰኒ
  choice: मेरा वारिस होगा
  rationale: शाब्दिक भाव ‘मुझे विरासत में पाएगा’ है, पर सन्दर्भ में इसका स्वाभाविक हिन्दी अर्थ उत्तराधिकारी अथवा वारिस होना है।
- source_word: ዘርአ
  choice: संतान
  rationale: मूल शब्द का शाब्दिक अर्थ ‘बीज’ है, किन्तु यहाँ वंशज/संतान का अर्थ अभिप्रेत है; आधुनिक हिन्दी में ‘संतान’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: ኢይወርስከዝ
  choice: यह व्यक्ति तेरा वारिस नहीं होगा
  rationale: निषेध और निकट-संकेतवाचक भाव दोनों सुरक्षित रखते हुए वाक्य को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘बीज’ के वंशगत रूपक का अनुवाद
  choice: संतान
  alternative: वंश / बीज
  rationale: यहाँ कथन संतान न दिए जाने के विषय में है। ‘संतान’ अर्थ स्पष्ट करता है और किसी विशेष धर्मशास्त्रीय व्याख्या को नहीं जोड़ता।
- issue: उत्तराधिकार की अभिव्यक्ति
  choice: मेरा/तेरा वारिस होगा
  alternative: मुझे/तुझे विरासत में पाएगा
  rationale: मूल की संरचना का भाव बनाए रखते हुए आधुनिक हिन्दी में समझ आने वाला प्रचलित उत्तराधिकार-संबंधी प्रयोग चुना गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। मूल के बलसूचक सर्वनाम को ‘वही’ से सुरक्षित रखा गया है। पद उपलब्ध अंश के अनुसार अल्पविराम पर समाप्त होता है, क्योंकि वाक्य अगले अंश में जारी रह सकता है।
