  yaml_path: translation/extra_canonical/jubilees/014/018.yaml
  text: And he awoke from his sleep and arose, and the sun had set, and there was a flame. And behold, a smoking furnace and a torch of fire passed between the pieces.
translation:
  language: hi
  text: और वह अपनी नींद से जागा और उठा। सूर्य अस्त हो चुका था, और एक ज्वाला थी। और देखो, धुआँ देता हुआ एक भट्ठा और आग की एक मशाल उन टुकड़ों के बीच से होकर गुज़रे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነድ፡ ኮነ፡
  choice: और एक ज्वाला थी
  rationale: गीज़ में ነድ का अर्थ ‘ज्वाला/लपट’ है और ኮነ अस्तित्व अथवा घटित होने को व्यक्त करता है; इसलिए इसे ‘अँधेरा हो गया’ कहना स्रोत के बजाय उत्पत्ति 15:17 से सामंजस्य बैठाता।
- source_word: እቶን፡ ይጤይስ፡
  choice: धुआँ देता हुआ एक भट्ठा
  rationale: यह पदबंध धुआँ निकालने वाले furnace/oven की छवि देता है; ‘भट्ठा’ आधुनिक हिन्दी में स्वाभाविक और दृश्यात्मक है।
- source_word: በልባስ፡ እሳት፡
  choice: आग की एक मशाल
  rationale: पदबंध अग्निमय मशाल की छवि प्रकट करता है; ‘आग की मशाल’ सहज हिन्दी है और पहले उल्लिखित ‘ज्वाला’ से इसे अलग रखता है।
- source_word: ማእከለ፡ ክፍል፡
  choice: उन टुकड़ों के बीच से
  rationale: संज्ञा विभाजित हिस्सों/टुकड़ों की ओर संकेत करती है; प्रसंग में बलि के काटे हुए टुकड़े अभिप्रेत हैं, पर अनावश्यक व्याख्या जोड़े बिना ‘टुकड़ों’ रखा गया है।
theological_decisions:
- issue: उत्पत्ति 15:17 के समानांतर पाठ में ‘अँधेरा’ बनाम ‘ज्वाला’
  choice: ज्वाला
  alternative: अँधेरा हो गया
  rationale: जुबलीज़ के उपलब्ध गीज़ पाठ में स्पष्ट रूप से ነድ (‘ज्वाला’) है। समानांतर बाइबिलीय पाठ के आधार पर इसे ‘अँधेरा’ में बदलना स्रोत-साक्ष्य को दबा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। वाक्य-विन्यास में मूल की क्रमिक दृश्यात्मकता बनाए रखी गई है।
