base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/014/022.yaml
  text: And on this day we made the covenant with Abram[a], just as we had made it in this month with Noah; and Abram renewed it as a festival and as an ordinance for himself forever.
translation:
  language: hi
  text: और इसी दिन हमने अब्राम के साथ वाचा बाँधी[a], जैसे हमने इसी महीने नूह के साथ बाँधी थी; और अब्राम ने उसका नवीकरण किया और उसे अपने लिए सदा के लिए एक पर्व और विधि ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हमने वाचा बाँधी’ में आया प्रथम पुरुष बहुवचन जुबिलीज़ की स्वर्गीय मध्यस्थता की रूपरेखा को दर्शाता है। संभवतः मूसा को प्रकाशन सुनाने वाला स्वर्गदूत यहाँ बोल रहा है।
    reason: cross_reference
lexical_decisions:
- source_word: ኪዳነ
  choice: वाचा
  rationale: गीज़ पद में यह ‘वाचा’ को सूचित करता है; बाइबलीय संदर्भ में ‘वाचा’ स्वाभाविक और सटीक हिन्दी शब्द है।
- source_word: ተካየድነ
  choice: हमने ... बाँधी
  rationale: प्रथम पुरुष बहुवचन को बनाए रखा गया है। हिन्दी में वाचा के साथ ‘बाँधना’ स्वाभाविक प्रयोग है।
- source_word: ሐደሶ
  choice: फिर से स्थापित किया
  rationale: क्रिया में नवीकरण का भाव है; यह अभिव्यक्ति केवल स्मरण या उत्सव मनाने के बजाय वाचा के नवीकरण को स्पष्ट रखती है।
- source_word: በበዓል
  choice: एक पर्व ... के रूप में
  rationale: मूल का पर्व/उत्सव-संबंधी अर्थ सुरक्षित रखा गया है।
- source_word: ለሥርዓት
  choice: विधि
  rationale: स्थायी रूप से मान्य व्यवस्था या विधान के अर्थ में आधुनिक, गरिमापूर्ण हिन्दी।
- source_word: እስከ፡ ለዓለም
  choice: सदा
  rationale: शाब्दिक कालातीतता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा बाँधने वाले के लिए प्रथम पुरुष बहुवचन
  choice: ‘हमने’ को मुख्य पाठ में बनाए रखा
  alternative: इसे ‘परमेश्वर ने’ या एकवचन ‘मैंने’ करना
  rationale: मूल गीज़ का प्रथम पुरुष बहुवचन वास्तविक पाठीय विशेषता है और जुबिलीज़ की स्वर्गीय मध्यस्थता-वर्णन शैली से जुड़ा है; इसे चुपचाप स्पष्ट या परिवर्तित नहीं किया जाना चाहिए।
- issue: अब्राम द्वारा वाचा का नवीकरण
  choice: ‘उसे ... फिर से स्थापित किया’
  alternative: ‘उसका उत्सव मनाया’
  rationale: मूल क्रिया नवीकरण का संकेत देती है, जबकि आगे आने वाले ‘पर्व’ और ‘विधि’ उसके स्वरूप को बताते हैं; इसलिए दोनों विचार अलग रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘वाचा’, ‘पर्व’ और ‘विधि’ जैसे परिचित शब्द मूल की औपचारिकता रखते हैं; प्रथम पुरुष बहुवचन की अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
