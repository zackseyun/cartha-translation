base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/001.yaml
  text: 'And the angel of the presence said to Moses by the word of the LORD, saying, "Write the whole account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all."'
translation:
  language: hi
  text: और उपस्थिति का दूत यहोवा के वचन द्वारा मूसा से कहने लगा, “सृष्टि का पूरा वृत्तांत लिखो—कि किस प्रकार यहोवा परमेश्वर ने छह दिनों में अपने सब काम और अपनी रची हुई हर वस्तु पूरी की; और सातवें दिन उसने विश्राम किया, उसे सभी युगों के लिए पवित्र ठहराया और सबके लिए एक चिह्न ठहराया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: उपस्थिति का दूत
  rationale: शाब्दिक रूप से ‘मुख/उपस्थिति का दूत’; ‘उपस्थिति का दूत’ पद की विशिष्टता बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: በቃለ፡ እግዚአብሔር
  choice: यहोवा के वचन के अनुसार
  rationale: गीज़ में माध्यम अथवा अधिकार का भाव संभव है। ‘के अनुसार’ स्वाभाविक हिन्दी में दूत के कथन का ईश्वरीय प्राधिकार व्यक्त करता है, बिना वाक्य को कृत्रिम बनाए।
- source_word: ኵሎ፡ ነገረ፡ ፍጥረት
  choice: सृष्टि का पूरा वृत्तांत
  rationale: ‘सृष्टि से संबंधित समूची बात/कथा’ का स्वाभाविक और व्यापक हिन्दी रूप।
- source_word: ፈጸመ
  choice: पूरी की
  rationale: मूल क्रिया पूर्ण करने या समाप्त करने का भाव देती है; यहाँ बहुवचन ‘काम’ के साथ स्वाभाविक हिन्दी प्रयोग चुना गया है।
- source_word: አዕረፈ
  choice: विश्राम किया
  rationale: सातवें दिन काम से विराम लेने के पारंपरिक और संदर्भानुकूल अर्थ को सुरक्षित रखता है।
- source_word: ቀደሳ
  choice: पवित्र ठहराया
  rationale: दिन को अलग और पवित्र घोषित करने का भाव स्पष्ट करता है।
- source_word: ለኵሉ፡ ዓለማት
  choice: सभी युगों के लिए
  rationale: ዓለማት का कालगत बहुवचन यहाँ ‘युगों’ के अर्थ में उपयुक्त है; इससे स्थायी विधान का भाव बना रहता है।
- source_word: ትእምርተ፡ ለኵሉ
  choice: सबके लिए एक चिह्न
  rationale: अंतिम ለኵሉ सार्वत्रिक किंतु व्याकरणतः कुछ अस्पष्ट है। ‘सबके लिए’ इस अस्पष्टता को बनाए रखता है और अनावश्यक रूप से ‘उसके सब कामों’ जैसा पूरक नहीं जोड़ता।
theological_decisions:
- issue: ‘यहोवा के वचन’ और दूत के बोलने का संबंध
  choice: यहोवा के वचन के अनुसार
  alternative: यहोवा के वचन द्वारा
  rationale: मूल का በ साधन, माध्यम या प्राधिकार सूचित कर सकता है। चुना हुआ रूप दूत को स्वतंत्र प्रकाशन-स्रोत न बनाकर ईश्वरीय आदेश के अधीन दिखाता है, पर किसी विशिष्ट दार्शनिक अर्थ को आरोपित नहीं करता।
- issue: अंतिम ‘सब’ का संदर्भ
  choice: सबके लिए एक चिह्न
  alternative: अपने सब कामों के लिए एक चिह्न
  rationale: गीज़ पाठ में अंतिम पद केवल ‘सबके लिए’ कहता है और उसका स्पष्ट संज्ञात्मक संदर्भ नहीं देता। इसलिए व्यापक अभिव्यक्ति रखी गई है और संभावित संदर्भ को चुपचाप निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की दीर्घ मूल संरचना को डैश और अर्धविराम से स्पष्ट किया गया है। ‘उपस्थिति का दूत’, ‘विश्राम किया’, ‘पवित्र ठहराया’ और ‘चिह्न’ जैसे पारंपरिक धार्मिक पद अर्थगत सटीकता के लिए रखे गए हैं।
