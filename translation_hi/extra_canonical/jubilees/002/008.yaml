  yaml_path: translation/extra_canonical/jubilees/002/008.yaml
  text: And on the fourth day he made the sun and the moon and the stars, and set them in the firmament of heaven so that they might give light upon all the earth and rule it,
translation:
  language: hi
  text: और चौथे दिन उसने सूर्य, चंद्रमा और तारों को बनाया और उन्हें आकाश के विस्तार में रखा, ताकि वे सारी पृथ्वी पर प्रकाश दें और उस पर शासन करें,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምጽናዓተ፡ ሰማይ
  choice: आकाश का विस्तार
  rationale: यह पद आकाश की दृढ़ संरचना अथवा फैलाव को सूचित करता है। आधुनिक हिन्दी में ‘आकाश का विस्तार’ स्वाभाविक है और ‘firmament’ की प्राचीन विश्व-कल्पना को पूरी तरह मिटाता भी नहीं।
- source_word: ያብርሁ
  choice: प्रकाश दें
  rationale: स्रोत में प्रयुक्त बहुवचन क्रिया सूर्य, चंद्रमा और तारों के पृथ्वी को प्रकाशित करने के उद्देश्य को व्यक्त करती है।
- source_word: ወለኰንኖ
  choice: और उस पर शासन करें
  rationale: अंतिम क्रिया शासन/अधिकार करने का अर्थ रखती है और उसमें पृथ्वी की ओर संकेत करता सर्वनामिक तत्व भी है; इसलिए ‘उस पर’ स्पष्ट रखा गया है।
theological_decisions:
- issue: सृष्टिकर्ता के लिए स्रोत में निहित एकवचन कर्ता
  choice: उसने
  alternative: परमेश्वर ने
  rationale: उपलब्ध पदांश चौथे दिन के वाक्य में क्रियात्मक रूप से पूर्वोक्त कर्ता को जारी रखता है। ‘उसने’ इस वाक्य-संबंध को सुरक्षित रखता है और स्रोत में यहाँ नाम को अनावश्यक रूप से दोहराता नहीं।
- issue: आकाशीय पिंडों का ‘शासन’
  choice: शाब्दिक शासन-भाषा बनाए रखी गई
  alternative: समयों को निर्धारित करें
  rationale: स्रोत की अंतिम क्रिया शासन करने का बिंब रखती है। उसे किसी व्याख्यात्मक कार्य-विवरण में बदलना वास्तविक अर्थ और धर्मवैचारिक तनाव को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद अगले खंड में जारी प्रतीत होता है, इसलिए अंत में अल्पविराम रखा गया है।
