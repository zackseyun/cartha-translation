  revised_text: 'पक्षी और उनकी सभी जातियाँ। और सूर्य उनके ऊपर कल्याण के लिए उदय हुआ, और पृथ्वी पर विद्यमान हर वस्तु के ऊपर भी—पृथ्वी से अंकुरित होनेवाली हर वस्तु, हर फलदार पेड़ और सभी प्राणी। ये तीन जातियाँ उसने पाँचवें दिन बनाईं। छठे दिन उसने पृथ्वी के सभी वन-पशु, सब पालतू पशु और भूमि पर चलनेवाले सभी जीव बनाए। इन सबके बाद उसने मनुष्यजाति को बनाया; नर और नारी के रूप में उसने उन्हें बनाया। उसने उन्हें पृथ्वी और समुद्रों में विद्यमान हर वस्तु पर, उड़नेवाले हर जीव पर, वन-पशुओं, पालतू पशुओं और भूमि पर चलनेवाले हर जीव पर, और सारी पृथ्वी पर अधिकार दिया। इन सब पर उसने उन्हें अधिकार दिया। इस प्रकार उसने छठे दिन चार जातियाँ बनाईं। कुल मिलाकर बाईस जातियाँ हुईं। उसने छठे दिन अपना सारा कार्य पूरा किया—वह सब जो आकाशों में, पृथ्वी पर, समुद्रों में, गहराइयों में, प्रकाश में, अंधकार में और सब कुछ में है।


    उसने हमें एक महान चिह्न, अर्थात सब्त का दिन, दिया, ताकि हम छह दिन काम करें और सातवें दिन अपने सारे काम से विश्राम करें। उपस्थिति के सभी स्वर्गदूतों और पवित्रता के सभी स्वर्गदूतों—इन दो महान जातियों—के विषय में उसने हमें कहा, “हम उसके साथ आकाश और पृथ्वी पर विश्राम करें।” फिर उसने मुझसे कहा, “देख, मैं सब जातियों में से अपने लिए एक प्रजा अलग करूँगा। वे सब्त मानेंगे, और मैं उन्हें अपने लिए अपनी प्रजा के रूप में पवित्र करूँगा और उन्हें आशीष दूँगा। जैसे मैंने सब्त के दिन को पवित्र किया, वैसे ही मैं उन्हें अपने लिए पवित्र करूँगा और उन्हें आशीष दूँगा। वे मेरी प्रजा होंगे और मैं उनका परमेश्वर होऊँगा। मैंने उन सबमें से जिन्हें मैंने देखा है, याकूब के वंश को चुन लिया है। मैंने उसे अपने ज्येष्ठ पुत्र के रूप में अपने लिए लिख लिया है और सदा-सर्वदा के लिए अपने लिए पवित्र किया है। मैं उन्हें सब्त के दिन का ज्ञान दूँगा, ताकि वे उस दिन अपने सारे काम से विश्राम करें।”


    इस प्रकार उसने एक चिह्न ठहराया कि वे सातवें दिन हमारे साथ सब्त मानें—खाएँ, पिएँ और उस सृष्टिकर्ता को धन्य कहें जिसने सब कुछ बनाया; क्योंकि उसने सब जातियों में से अपने अधिकार की प्रजा को अपने लिए आशीष दी और पवित्र किया, ताकि वे हमारे साथ मिलकर सब्त मानें। उसने अपनी इच्छा को ऐसी मनभावनी सुगंध के समान ऊपर उठाया जो उसके सामने सदा ग्रहणयोग्य है। आदम से याकूब तक मनुष्यों के बाईस प्रधान हुए, और सातवें दिन तक कामों की बाईस श्रेणियाँ बनाई गईं। यह धन्य और पवित्र है, और वह भी धन्य और पवित्र है; यह और वह, दोनों पवित्रता और आशीष के लिए हुए। इसे यह वर दिया गया कि यह सदा धन्य और पवित्र रहे—साक्षी और पहली व्यवस्था के अनुसार—ठीक वैसे ही जैसे सातवाँ दिन पवित्र किया गया और आशीषित हुआ।


    उसने आकाश, पृथ्वी और अपनी बनाई हुई हर वस्तु को छह दिनों में बनाया, और परमेश्वर ने अपने सभी कार्यों के लिए सातवें दिन को पवित्र ठहराया। इसलिए उसने उसके विषय में आज्ञा दी कि जो कोई उस दिन कोई काम करे वह मर जाए, और जो कोई उसे अपवित्र करे वह निश्चय मार डाला जाए। तू इस्राएलियों को आज्ञा दे कि वे इस दिन को मानें और इसे पवित्र रखें; उस दिन कोई काम न करें और उसे अपवित्र न करें, क्योंकि वह सभी दिनों से अधिक पवित्र है। जो कोई उसे अपवित्र करे वह निश्चय मार डाला जाए, और जो कोई उस दिन कोई काम करे वह सदा के लिए निश्चय मार डाला जाए। इस प्रकार इस्राएली पीढ़ी-दर-पीढ़ी इस दिन को मानें और देश से उखाड़े न जाएँ, क्योंकि यह पवित्र और धन्य दिन है। जो भी इसे मानता और उस दिन अपने सारे काम से विश्राम करता है, वह हमारी तरह सदा पवित्र और धन्य रहेगा।[a]'
