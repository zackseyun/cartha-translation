    इस प्रकार उसने एक चिह्न ठहराया कि वे सातवें दिन हमारे साथ सब्त मानें—खाएँ, पिएँ और उस सृष्टिकर्ता को धन्य कहें जिसने सब कुछ बनाया; क्योंकि उसने सब जातियों में से अपने अधिकार की प्रजा को अपने लिए आशीष दी और पवित्र किया, ताकि वे हमारे साथ मिलकर सब्त मानें। उसने अपनी इच्छा को ऐसी मनभावनी सुगंध के समान ऊपर उठाया जो उसके सामने सदा ग्रहणयोग्य है। आदम से याकूब तक मनुष्यों के बाईस प्रधान हुए, और सातवें दिन तक सृष्टि-कार्य की बाईस जातियाँ बनाई गईं। यह धन्य और पवित्र है, और वह भी धन्य और पवित्र है; यह और वह, दोनों पवित्रता और आशीष के लिए हुए। इसे यह वर दिया गया कि वे सदा धन्य और पवित्र रहें—साक्षी और पहली व्यवस्था के अनुसार—ठीक वैसे ही जैसे सातवाँ दिन पवित्र किया गया और आशीषित हुआ।


    उसने आकाश, पृथ्वी और अपनी बनाई हुई हर वस्तु को छह दिनों में बनाया, और परमेश्वर ने अपने सभी कार्यों के कारण सातवें दिन को पवित्र ठहराया। इसलिए उसने उसके विषय में आज्ञा दी कि जो कोई उस दिन कोई काम करे वह मर जाए, और जो कोई उसे अपवित्र करे वह निश्चय मार डाला जाए। तू इस्राएलियों को आज्ञा दे कि वे इस दिन को मानें और इसे पवित्र रखें; उस दिन कोई काम न करें और उसे अपवित्र न करें, क्योंकि वह सभी दिनों से अधिक पवित्र है। जो कोई उसे अपवित्र करे वह निश्चय मार डाला जाए, और जो कोई उस दिन कोई काम करे वह सदा के लिए निश्चय मार डाला जाए। इस प्रकार इस्राएली पीढ़ी-दर-पीढ़ी इस दिन को मानें और देश से उखाड़े न जाएँ, क्योंकि यह पवित्र और धन्य दिन है। जो भी इसे मानता और उस दिन अपने सारे काम से विश्राम करता है, वह हमारी तरह सदा पवित्र और धन्य रहेगा।[a]'
