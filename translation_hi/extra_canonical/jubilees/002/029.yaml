base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
translation:
  language: hi
  text: इसी प्रकार, इस्राएल की सन्तान को इस दिन की व्यवस्था घोषित करके कह कि वे इस दिन सब्त मानें और अपने मन के भटकाव में इसे न छोड़ें; वे इस दिन कोई ऐसा काम न करें जो करना उचित नहीं है, न अपनी इच्छा के अनुसार कुछ करें, न खाने या पीने की कोई वस्तु तैयार करें, न पानी भरें, और न अपने फाटकों से कोई ऐसा बोझ भीतर लाएँ या बाहर ले जाएँ जिसे उन्होंने अपने लिए छठे दिन तैयार नहीं किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከማሁ
  choice: इसी प्रकार
  rationale: यह शब्द ‘उसी प्रकार/इसी प्रकार’ का संबंधसूचक भाव रखता है; केवल ‘और’ कहना इसे खो देता।
- source_word: አይድዕ፡ ወንገር
  choice: आज्ञा देकर कह
  rationale: दोनों क्रियाओं में अवगत कराने/घोषित करने और कहने का संयुक्त भाव है; विधि-संबंधी संदर्भ में ‘आज्ञा देकर कह’ सहज और गरिमापूर्ण है।
- source_word: ያሰንብቱ
  choice: सब्त मानें
  rationale: क्रिया सब्त का पालन करने अथवा विश्राम मनाने को व्यक्त करती है; ‘सब्त मानें’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: በስሕተት፡ ልቦሙ
  choice: अपने मन के भटकाव में
  rationale: शाब्दिक रूप से हृदय की भूल/भटकाव; यह नैतिक और आंतरिक अर्थ को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ገቢረ፡ ግብር
  choice: काम करें
  rationale: संज्ञा-क्रिया की पुनरुक्ति का स्वाभाविक हिन्दी रूप ‘काम करना’ है।
- source_word: ፈቃዶሙ
  choice: अपनी इच्छा पूरी करें
  rationale: शब्द इच्छा, अभिलाषा या प्रसन्नता का अर्थ दे सकता है; प्रसंग में अपने मन की गतिविधि/रुचि करने का निषेध है।
- source_word: ለቀዲሐ፡ ማይ
  choice: पानी भरें
  rationale: पानी खींचने या निकालने की क्रिया के लिए सामान्य हिन्दी में ‘पानी भरना’ स्वाभाविक है।
- source_word: በአናቅጺሆሙ
  choice: अपने फाटकों से
  rationale: मूल में बहुवचन ‘उनके फाटकों/द्वारों’ का स्पष्ट स्थान-सूचक भाव है।
- source_word: በሰዱስ
  choice: छठे दिन
  rationale: मूल का संक्षिप्त काल-सूचक पद यही अर्थ देता है; ‘निवासों में’ जैसा अतिरिक्त पाठ स्रोत में नहीं है।
theological_decisions:
- issue: सब्त के निषेधों का विधिक बल
  choice: स्पष्ट आज्ञार्थक रूप—‘मानें’, ‘न छोड़ें’, ‘न करें’
  alternative: सामान्य वर्णनात्मक भविष्यकाल
  rationale: स्रोत में इस्राएल की सन्तान को दिन की व्यवस्था बताने का आदेशात्मक प्रसंग है।
- issue: ‘अपनी इच्छा’ का अर्थ
  choice: ‘अपनी इच्छा पूरी करें’
  alternative: ‘अपना सुख-विलास करें’
  rationale: मूल की व्यापकता को बनाए रखा गया है; अधिक नैतिकीकृत ‘सुख-विलास’ अनावश्यक रूप से अर्थ को संकीर्ण करता।
- issue: छठे दिन तैयारी का संबंध
  choice: बोझ/वस्तु को अपने लिए छठे दिन तैयार करने से जोड़ा
  alternative: अपने निवासों में छठे दिन तैयार करना
  rationale: प्रदत्त गीइज़ पाठ में ‘अपने लिए’ और ‘छठे दिन’ हैं, पर ‘अपने निवासों में’ नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘सब्त’ और ‘इस्राएल’ जैसे स्थापित धार्मिक पद रखे गए हैं। स्रोत में स्पष्ट न होने के कारण कोई पांडुलिपीय विस्तार मुख्य पाठ या पादटिप्पणी में नहीं जोड़ा गया।
