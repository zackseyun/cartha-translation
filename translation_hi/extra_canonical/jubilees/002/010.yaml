  yaml_path: translation/extra_canonical/jubilees/002/010.yaml
  text: And it separates between light and darkness[10], and for prosperity, so that everything that sprouts and grows on the earth may prosper. These three kinds he made on the fourth day.
translation:
  language: hi
  text: वर्षों के लिए। वह प्रकाश और अंधकार के बीच अलग करता है, और फलने-फूलने के लिए,[a] ताकि पृथ्वी पर उगने और बढ़ने वाली हर चीज़ फले-फूले। ये तीन प्रकार उसने चौथे दिन बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फलने-फूलने के लिए’ का अर्थ ‘चिकित्सा के लिए’ या ‘समृद्धि के लिए’ भी हो सकता है; यहाँ आशय पृथ्वी की उपज पर आकाशीय ज्योतियों के लाभकारी प्रभाव से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይፈሊጥ፡ ማእከለ፡ ብርሃን፡ ወማእከለ፡ ጽልመት
  choice: उजियाले और अंधकार के बीच भेद करता है
  rationale: गीज़ का ‘माअकला ... व-माअकला ...’ यहाँ ‘के बीच’ का मुहावरा है; ‘मध्य’ को दोहराना हिन्दी में अनावश्यक रूप से शब्दशः और अस्वाभाविक होता।
- source_word: ለጠዐዮ / ይጥዐይ
  choice: समृद्धि लाता है / फले-फूले
  rationale: मूल शब्द-समूह में भलाई, स्वस्थ होने और फलने-फूलने का अर्थक्षेत्र है। प्रसंग पृथ्वी की वनस्पति-वृद्धि का है, इसलिए ‘फलना-फूलना’ सहज है; किंतु वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ዘይሠርፅ፡ ወይለቍፅ
  choice: उगने और बढ़ने वाली
  rationale: दोनों क्रियाओं का क्रम अंकुरित/उत्पन्न होने और आगे बढ़ने का भाव देता है; वर्तमान हिन्दी में यह युग्म स्पष्ट और स्वाभाविक है।
- source_word: ሠለስተ፡ ዘንተ፡ ዘመደ
  choice: ये तीन प्रकार
  rationale: ‘ज़मद’ यहाँ बनाए गए आकाशीय पिंडों की तीन श्रेणियों/प्रकारों की ओर संकेत करता है; ‘प्रकार’ हिन्दी में संदर्भ-संगत है।
theological_decisions:
- issue: आकाशीय ज्योतियों का पृथ्वी की वृद्धि पर प्रभाव
  choice: ‘समृद्धि लाता है ... ताकि ... फले-फूले’ के रूप में मूल कथन बनाए रखा
  alternative: इसे केवल ऋतुओं या समय-निर्धारण का रूपक मानना
  rationale: मूल पाठ आकाशीय ज्योतियों और धरती की वृद्धि के लाभकारी संबंध को प्रत्यक्ष रूप से व्यक्त करता है; अनुवाद को किसी बाद की प्राकृतिक या धर्मवैज्ञानिक व्याख्या से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। आरंभिक ‘वर्षों के लिए’ पिछले पद से जुड़ा खंड है, पर उपलब्ध पद-विभाजन का सम्मान करते हुए इसे बनाए रखा गया है। ‘उजियाला’ बाइबलीय गरिमा देता है और सामान्य पाठक के लिए स्पष्ट है।
