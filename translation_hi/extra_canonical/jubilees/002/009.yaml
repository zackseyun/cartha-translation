  yaml_path: translation/extra_canonical/jubilees/002/009.yaml
  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: hi
  text: दिन और रात पर शासन करने और उजियाले को अंधकार से अलग करने के लिए। और परमेश्वर ने सूर्य को पृथ्वी पर एक बड़ा चिह्न ठहराया—दिनों, सब्तों, महीनों, नियत समयों, वर्षों, वर्ष-सब्तों, जुबिलियों और हर समय के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለፈሊጥ፡ ማዕከለ፡ ብርሃን፡ ወጽልመት
  choice: उजियाले को अंधकार से अलग करने के लिए
  rationale: गीज़ वाक्यांश के उद्देश्य-बोध और प्रकाश-अंधकार के बीच विभाजन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ለትእምርት፡ ዐቢይ
  choice: एक बड़ा चिह्न
  rationale: ‘चिह्न’ मूल के संकेत/निशान संबंधी अर्थ को सुरक्षित रखता है; इसे केवल समय-मापक कहना अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: ለሰንበታት
  choice: सब्तों
  rationale: मूल का धार्मिक-कालगत पद बनाए रखा गया है; सामान्य ‘विश्राम-दिनों’ की अपेक्षा यह अधिक सटीक और संक्षिप्त है।
- source_word: ለበዓላት
  choice: नियत समयों
  rationale: यहाँ पद पर्वों अथवा नियत उत्सवी समयों को सूचित कर सकता है; ‘नियत समय’ उस अर्थ-क्षेत्र को बिना अधिक संकीर्ण किए व्यक्त करता है।
- source_word: ለሰንበታት፡ ዓመታት
  choice: वर्ष-सब्तों
  rationale: शाब्दिक संरचना ‘वर्षों के सब्त’ है; हिन्दी में ‘वर्ष-सब्त’ अर्थ को स्पष्ट और सहज रूप से रखता है।
- source_word: ለአዮቤልውሳት
  choice: जुबिलियों
  rationale: विशिष्ट काल-चक्र के पारिभाषिक नाम को लिप्यंतरित किया गया है, ताकि इसे सामान्य उत्सव न समझा जाए।
- source_word: ለኵሉ፡ ጊዜ
  choice: वर्षों के सभी ऋतु-समयों के लिए
  rationale: प्रदत्त गीज़ में ‘सभी समय’ है, जबकि परामर्श-पाठ ‘वर्षों के सभी seasons’ दर्शाता है; व्यापक कालगत अर्थ को ‘ऋतु-समय’ से व्यक्त किया गया है, और ‘वर्षों के’ को वाक्य की काल-सूची के अनुरूप रखा गया है।
theological_decisions:
- issue: सूर्य की भूमिका
  choice: परमेश्वर ने सूर्य को ... चिह्न ठहराया
  alternative: परमेश्वर ने सूर्य को ... संकेत के रूप में नियुक्त किया
  rationale: ‘ठहराया’ ईश्वरीय नियुक्ति व्यक्त करता है, पर सूर्य को स्वतंत्र दैवी सत्ता नहीं बनाता।
- issue: सब्त और वर्ष-सब्त की पारिभाषिकता
  choice: सब्तों ... वर्ष-सब्तों
  alternative: विश्राम-दिनों ... वर्षों के विश्राम-कालों
  rationale: मूल की विशिष्ट धार्मिक-कालगत शब्दावली को सामान्यीकृत करने के बजाय सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पाठयोग्य रूप। यह अंश पिछले वाक्य से जुड़ी उद्देश्य-श्रृंखला के रूप में आरम्भ होता है, इसलिए आरम्भिक खंड को पूर्ण स्वतंत्र वाक्य बनाने का प्रयास नहीं किया गया। काल-सूची में समानांतरता और मूल की पुनरावृत्ति बनाए रखी गई है।
