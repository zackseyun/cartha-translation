base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/002.yaml
  text: 'For on the first day he created the heavens above and the earth and the waters and all the spirits that minister before him: the angels of the presence[2], and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of clouds, and of darkness, and of snow and hail and frost, and the angels of the voices and thunder and lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his works that are in the heavens and on the earth and in the seas and in the depths and in darkness and in night and in light and in dawn and in morning, which he prepared in the knowledge of his heart.'
translation:
  language: hi
  text: 'क्योंकि पहले दिन उसने ऊपर के आकाशों, पृथ्वी और जलों को, और उन सभी आत्माओं को रचा जो उसके सम्मुख सेवा करती हैं: उपस्थिति के स्वर्गदूत[a], पवित्रीकरण के स्वर्गदूत, अग्नि की आत्माओं के स्वर्गदूत, बादलों की आत्माओं के स्वर्गदूत, अंधकार, हिम, ओले और पाला, ध्वनियों के स्वर्गदूत, गर्जन और बिजली, तथा ठंड, गर्मी, शीत ऋतु, वसंत, कटनी और ग्रीष्म ऋतु की आत्माओं के स्वर्गदूत; और उसके कार्यों की वे सभी आत्माएँ जो आकाशों में, पृथ्वी पर, समुद्रों में, गहराइयों में, अंधकार में, रात में, प्रकाश में, भोर में और प्रभात में हैं[b]—इन सबको उसने अपने हृदय के ज्ञान से तैयार किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मुख के स्वर्गदूत’; अर्थात वे स्वर्गदूत जो परमेश्वर की उपस्थिति में रहते हैं।
    reason: lexical_clarification
  - marker: b
    text: सृष्ट स्वर्गदूतों और तत्त्व-संबंधी आत्माओं की यह सूची गीज़ पाठ में अत्यंत सघन है और संभवतः कहीं-कहीं पाठगत संक्षेप या विकृति को दर्शाती है। अनुवाद ने सूची को सुव्यवस्थित करके उसका अर्थ तय करने के बजाय मूल क्रम को यथासंभव बनाए रखा है।
    reason: segmentation_note
lexical_decisions:
- source_word: መላእክተ ገጽ
  choice: उपस्थिति के स्वर्गदूत
  rationale: शाब्दिक अर्थ ‘मुख के स्वर्गदूत’ है, पर प्रसंग में यह परमेश्वर की प्रत्यक्ष उपस्थिति में रहने वाले स्वर्गदूतों का पदनाम है; ‘उपस्थिति’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: መላእክተ ቅዳሴ
  choice: पवित्रीकरण के स्वर्गदूत
  rationale: संज्ञा ቅዳሴ को किसी विशिष्ट कलीसियाई पद या उपासना-विधि से जोड़ने के बजाय उसके पवित्र करने/पवित्रीकरण के मूल भाव में रखा गया है।
- source_word: ለማእረር
  choice: कटनी
  rationale: ऋतुओं और प्राकृतिक अवधियों की सूची में यह फसल काटने के समय को सूचित करता है; ‘कटनी’ साधारण हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: በአእምሮ ልቡ
  choice: अपने हृदय के ज्ञान से
  rationale: አእምሮ का सीधा अर्थ ‘ज्ञान/समझ’ है। ‘उद्देश्य’ कहने से मूल की संज्ञानात्मक बारीकी अनावश्यक रूप से बदल जाती।
theological_decisions:
- issue: प्राकृतिक शक्तियों और स्वर्गदूतों के संबंध की अस्पष्टता
  choice: मूल की दोहराती संरचना के निकट रहते हुए ‘...की आत्मा/आत्माओं के स्वर्गदूत’ रखा गया
  alternative: सभी प्राकृतिक शक्तियों को सीधे स्वर्गदूतों के अलग-अलग वर्गों के रूप में सुचारु सूची बनाना
  rationale: गीज़ पाठ का अनुक्रम घना और कुछ स्थानों पर संकुचित है। अनुवाद यह निश्चित नहीं करता कि हर प्राकृतिक तत्व स्वयं एक आत्मा है या उससे संबंधित स्वर्गदूतों का एक वर्ग।
- issue: सृष्ट आत्माओं की व्यापकता
  choice: ‘उसके कार्यों से संबंधित वे सभी आत्माएँ’
  alternative: ‘उसके सभी कार्यों की आत्माएँ’
  rationale: संबंधसूचक रूप मूल के अर्थ को रखता है, पर यह कठोर दार्शनिक दावा नहीं करता कि परमेश्वर के प्रत्येक कार्य का अपना अलग आत्मिक प्राणी है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। लंबी सूची की शास्त्रीय लय बचाने के लिए अर्धविराम और डैश का प्रयोग किया गया है; दुर्बोध तत्सम पदों और किसी विशेष संप्रदाय की पारिभाषिक शब्दावली से बचा गया है।
