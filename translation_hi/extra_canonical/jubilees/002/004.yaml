base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/004.yaml
  text: 'He made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above, and half of them went down beneath the firmament that is in the midst, over the face of the whole earth. And this alone he made.'
translation:
  language: hi
  text: 'पहले दिन उसने सात महान कार्य किए। और दूसरे दिन उसने जल के बीच आकाशमंडल बनाया, और उस दिन जल दो भागों में बँट गया: उसका आधा भाग ऊपर चला गया, और आधा भाग उस आकाशमंडल के नीचे उतर गया, जो बीच में और सारी पृथ्वी के ऊपर था। और उस दिन उसने केवल यही कार्य किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምጽናዓት
  choice: आकाशमण्डल
  rationale: यह शब्द उत्पत्ति 1 के जल-विभाजक विस्तार/firmament को दर्शाता है। ‘आकाशमण्डल’ आधुनिक हिन्दी में समझने योग्य है और प्राचीन ब्रह्माण्ड-वर्णन को सामान्य ‘आकाश’ में पूरी तरह समतल नहीं करता।
- source_word: ማእከለ ማይ
  choice: जल के बीच
  rationale: स्रोत के स्थानवाचक भाव को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ተከፍለ ማያት
  choice: जल दो भागों में बँट गया
  rationale: क्रिया के विभाजन-अर्थ को स्पष्ट किया गया है; आगे आने वाले दो आधे भागों से ‘दो भागों में’ स्वाभाविक रूप से निहित है।
- source_word: ዲበ ገጸ ለኵሉ ምድር
  choice: सारी पृथ्वी के ऊपर फैला था
  rationale: शाब्दिक ‘सारी पृथ्वी के मुख पर/ऊपर’ का स्वाभाविक हिन्दी रूप; ‘फैला था’ आकाशमण्डल की स्थिति स्पष्ट करता है, कोई नई सृष्टि-वस्तु नहीं जोड़ता।
- source_word: ወዘንተ ባሕቲቶ
  choice: और उस दिन उसने केवल यही कार्य किया
  rationale: खंडित शाब्दिक वाक्य ‘और केवल यही’ में प्रसंग से निहित क्रिया और दिन को स्पष्ट करके सहज हिन्दी बनाई गई है।
theological_decisions:
- issue: आकाशमण्डल की प्रकृति
  choice: आकाशमण्डल
  alternative: विस्तार
  rationale: ‘आकाशमण्डल’ पारंपरिक सृष्टि-वर्णन और जल को अलग करने वाली संरचना का संकेत बनाए रखता है; पाठ यह निर्धारित नहीं करता कि इसे आधुनिक वैज्ञानिक अर्थ में कैसे समझा जाए।
- issue: अंतिम वाक्य में निहित क्रिया
  choice: उस दिन उसने केवल यही कार्य किया
  alternative: और केवल यही
  rationale: स्रोत का संक्षिप्त वाक्य प्रसंगगत रूप से दूसरे दिन के एकमात्र कार्य को सूचित करता है। निहित बात को स्पष्ट किया गया है, पर कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। स्रोत की पुनरुक्ति और कालानुक्रमिक संरचना रखी गई है। ‘उसने’ का कर्ता पूर्व प्रसंग से परमेश्वर है; स्रोत के अनुरूप इस पद में नाम नहीं जोड़ा गया।
