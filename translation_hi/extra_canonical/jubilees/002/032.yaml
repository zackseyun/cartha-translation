  text: on it upon the earth. And the Creator of all blessed it, he who created this day for blessing and holiness.
translation:
  language: hi
  text: उस पर, पृथ्वी पर। और सबके सृष्टिकर्ता ने उसे आशीष दी—उसी ने इस दिन को आशीष और पवित्रता के लिए बनाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और सबके सृष्टिकर्ता ने इस दिन को आशीष दी, जिसे उसने आशीष और पवित्रता के लिए बनाया था।”
    reason: वाक्य की संरचना में ‘उसे’ तथा संबंधवाचक खंड के संदर्भ की वैकल्पिक सम्भव व्याख्या को दर्ज करता है।
lexical_decisions:
- source_word: በዲበ፡ ምድር
  choice: पृथ्वी पर
  rationale: स्थानसूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ፈጣሪ፡ ኵሉ
  choice: सबके सृष्टिकर्ता
  rationale: स्रोत के ‘सभी/सबका सृष्टिकर्ता’ भाव को संक्षिप्त और गरिमापूर्ण ढंग से रखता है।
- source_word: ባረካ
  choice: आशीष दी
  rationale: आशीष देने की क्रिया को आधुनिक मानक हिन्दी में स्पष्ट करता है।
- source_word: ለበረከት፡ ወለቅድሳት
  choice: आशीष और पवित्रता के लिए
  rationale: दोनों प्रयोजनवाचक संज्ञाओं और उनके समानांतर संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: क्रिया ‘आशीष दी’ के सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उसे’ रखकर स्रोत की संदर्भगत अस्पष्टता बनाए रखी
  alternative: ‘इस दिन को’ स्पष्ट वस्तु मानना
  rationale: गीज़ पाठ में स्त्रीलिंग सर्वनाम पूर्ववर्ती संदर्भ की ओर संकेत करता है, जबकि आगे ‘इस दिन’ वाला संबंधवाचक खंड आता है; इसलिए संदर्भ को बिना आधार पूरी तरह निश्चित नहीं किया गया।
- issue: ‘जिसने बनाया’ संबंधवाचक खंड का संबंध
  choice: ‘सबके सृष्टिकर्ता’ से जोड़कर ‘उसी ने’ अनूदित किया
  alternative: ‘इस दिन, जिसे उसने बनाया था’
  rationale: ዘፈጠረ को कर्तावाचक ‘वह जिसने बनाया’ पढ़ना स्रोत की संरचना और नवीनतम स्रोत-समीक्षा के अनुरूप है, यद्यपि वैकल्पिक वाक्य-विन्यास संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। आरम्भिक खंड को पिछले पद/वाक्य से जुड़ा हुआ अंश मानते हुए उसकी खंडित संरचना सुरक्षित रखी गई है।
