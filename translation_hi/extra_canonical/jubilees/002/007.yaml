  text: one place outside this firmament[7], and the dry land appeared. And on that day he created for it all the seas according to their separate gatherings, and all the rivers and the gatherings of the waters in the mountains and in all the earth, and all the lakes and all the dew of the earth, and the seed that is sown, and everything that sprouts, and fruit-bearing trees, and woods, and the Garden of Eden in Eden for delight, and all these four great kinds he made on the third day.
translation:
  language: hi
  text: आकाशमण्डल के बाहर एक स्थान में जल इकट्ठा हुआ, और सूखी भूमि दिखाई दी। उस दिन उसने उस [सूखी भूमि] पर सभी समुद्रों को उनके अलग-अलग एकत्र होने के स्थानों के अनुसार बनाया; और सभी नदियाँ, पहाड़ों और सारी पृथ्वी में जल के सभी भंडार, सभी झीलें, पृथ्वी की सारी ओस, बोया जाने वाला बीज, अंकुरित होने वाली हर वस्तु, फल देने वाले वृक्ष, वन,[a] और आनन्द के लिए एदेन में एदेन का बाग बनाया। तीसरे दिन उसने इन सबको—चार बड़े वर्गों को—बनाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य सम्भव पाठ-विभाजन: “फल देने वाले वृक्ष और एदेन का बाग”; किन्तु गीइज़ पाठ में इनके बीच “वन” के लिए एक अलग पद है।'
    reason: textual_segmentation
  - marker: b
    text: “इन सबको—चार बड़े वर्गों को—” मूल में कठिन और संक्षिप्त वाक्यांश है। सूची में भू-आकृतियाँ, जलराशियाँ, वनस्पति और एदेन सम्मिलित हैं; सम्भवतः संख्या चार प्रत्येक वस्तु को अलग-अलग गिनने के बजाय व्यापक समूहों का सार देती है।
    reason: segmentation_note
lexical_decisions:
- source_word: አፍአ፡ እምጽናዓት
  choice: आकाशमण्डल के नीचे
  rationale: खंड का आशय उत्पत्ति 1:9 के समान आकाशमण्डल के नीचे के जल से है। गीइज़ पदबंध का अत्यधिक शाब्दिक रूप ‘आकाशमण्डल के बाहर’ आधुनिक हिन्दी में भ्रामक होगा।
- source_word: በበ፡ ምትባኢሆሙ
  choice: उनके अलग-अलग एकत्र होने के स्थानों के अनुसार
  rationale: वितरणात्मक भाव और जलराशियों के पृथक संग्रह-स्थानों, दोनों को स्पष्ट करता है।
- source_word: ምዕቃባተ
  choice: झीलें
  rationale: जल के रोके या संचित निकायों के लिए स्वाभाविक हिन्दी; निकटवर्ती ‘जल के भंडार’ से इसे अलग रखा गया है।
- source_word: አማተ
  choice: वन
  rationale: फलदार वृक्षों के बाद आने वाली पृथक वनस्पति-श्रेणी को सुरक्षित रखता है; संशोधित स्रोत-पाठ में छूटी हुई वस्तु नहीं छोड़ी गई।
- source_word: ለተድላ
  choice: आनन्द के लिए
  rationale: उद्देश्यसूचक पद को सरल और प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አርባዕተ፡ ዘንተ፡ ዐበይተ፡ ትውልደ
  choice: इन सबको—चार बड़े वर्गों को—
  rationale: संख्या चार और सामूहिक वर्गीकरण को बनाए रखता है, पर सूची की कठिन संक्षिप्त संरचना को कृत्रिम रूप से हल नहीं करता।
theological_decisions:
- issue: एदेन और एदेन के बाग का संबंध
  choice: एदेन में एदेन का बाग
  alternative: एदेन का आनन्ददायक बाग
  rationale: मूल में स्थान ‘एदेन में’ और ‘एदेन का बाग’ दोनों का संकेत है; दोहराव को बनाए रखने से भौगोलिक और नामसूचक तनाव सुरक्षित रहता है।
- issue: ‘चार बड़े वर्गों’ का संदर्भ
  choice: सूची के अंत में अस्पष्ट सामूहिक सारांश बनाए रखा
  alternative: जल, वनस्पति, वृक्ष और एदेन जैसे चार वर्गों की व्याख्यात्मक पहचान
  rationale: मूल सूची संकुचित और वर्गीकरण की दृष्टि से कठिन है; पाठ स्वयं चार वर्गों की सीमाएँ स्पष्ट नहीं करता, इसलिए कोई विशिष्ट धर्मवैज्ञानिक या सृष्टि-वर्गीकरण आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। पद आरम्भ में पिछले संदर्भ से जुड़ा हुआ प्रतीत होता है, इसलिए खंडित अंग्रेज़ी रूप के स्थान पर गीइज़ और उत्पत्ति-सदृश वाक्य-संरचना के आधार पर स्वाभाविक पूर्ण वाक्य दिया गया है। ‘आकाशमण्डल’, ‘सूखी भूमि’ और ‘एदेन का बाग’ जैसे परिचित बाइबलीय पद बनाए गए हैं; दुर्बोध चार-वर्गीय सारांश को व्याख्या द्वारा निश्चित नहीं किया गया।
