  text: This was the work that he did on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and the dry land to appear.
translation:
  language: hi
  text: यह वह कार्य था जो उसने दूसरे दिन किया। तीसरे दिन उसने आज्ञा दी कि जल सारी पृथ्वी के सामने से हटकर एक स्थान में इकट्ठा हो जाए और सूखी भूमि दिखाई दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ
  choice: कार्य था जो उसने…किया
  rationale: मूल में दोहराया गया क्रिया-रूप ‘करना/बनाना’ है। हिन्दी में ‘कार्य…किया’ प्रसंगानुकूल और स्वाभाविक है तथा सृष्टि-कार्य का भाव बनाए रखता है।
- source_word: ይኅለፉ
  choice: हटकर…इकट्ठा हो जाए
  rationale: क्रिया का मूल भाव ‘गुज़रना/हट जाना’ है; साथ आए ‘एक स्थान में’ के कारण हिन्दी में जल के हटकर एकत्र होने का आशय स्पष्ट किया गया है।
- source_word: እምቅድመ፡ ገጸ፡ ለኵላ፡ ምድር
  choice: सारी पृथ्वी के मुख के सामने से
  rationale: ‘समस्त पृथ्वी के मुख के सामने से’ की स्थानिक छवि को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: የብስ
  choice: सूखी भूमि
  rationale: यह शब्द जल के विपरीत प्रकट होने वाले स्थल/शुष्क भूभाग को दर्शाता है; ‘सूखी भूमि’ सामान्य और बाइबिलीय हिन्दी दोनों में स्पष्ट है।
- source_word: ያስተርኢ
  choice: दिखाई दे
  rationale: मूल का कारणवाचक/प्रकट होने का भाव हिन्दी में स्वाभाविक आज्ञार्थक परोक्ष कथन के रूप में दिया गया है।
theological_decisions:
- issue: तीसरे दिन की आज्ञा में दोनों घटनाओं का व्याकरणिक संबंध
  choice: जल के एक स्थान में इकट्ठा होने और सूखी भूमि के दिखाई देने—दोनों को एक ही आज्ञा के समानांतर आशयों के रूप में रखा गया।
  alternative: दूसरे खंड को स्वतंत्र प्रत्यक्ष आज्ञा, ‘सूखी भूमि दिखाई दे,’ के रूप में प्रस्तुत करना।
  rationale: गीज़ पाठ में दोनों क्रियाएँ ‘उसने कहा/आज्ञा दी’ के अधीन हैं; समानांतर हिन्दी रचना इसे स्पष्ट रखती है और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘पृथ्वी का मुख’ मूल की ठोस प्राचीन छवि बचाता है; ‘एक स्थान में इकट्ठा हो जाए’ हिन्दी में जल की गति को स्वाभाविक बनाता है।
