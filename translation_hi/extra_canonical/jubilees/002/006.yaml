  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘जल’ को सामूहिक संज्ञा मानकर एकवचन क्रिया रखी गई है, जबकि ‘उनसे’ मूल में जल के लिए प्रयुक्त बहुवचन सर्वनाम को प्रतिबिंबित करता है। उपलब्ध स्रोत के अंत में आया ውስተ (‘में/के भीतर’) बिना व्यक्त पूरक के अधूरा है; सत्यापित पाठ-खंड और संशोधन-साक्ष्य के अनुसार उसे मुख्य अनुवाद में नहीं जोड़ा गया।
