lexical_decisions:
- source_word: ማያት
  choice: जल
  rationale: गीज़ का बहुवचन रूप ‘जल/जलराशियाँ’ दर्शाता है; आधुनिक हिन्दी में सामूहिक अर्थ वाला ‘जल’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: በከመ፡ ይቤሎሙ
  choice: ठीक वैसा ही ... जैसा उसने उनसे कहा था
  rationale: यह आज्ञा और उसके यथावत् पालन का तुलनात्मक संबंध स्पष्ट रखता है; ‘उनसे’ स्रोत के बहुवचन कर्म-सर्वनाम को सुरक्षित रखता है।
- source_word: ተገብሡ
  choice: पीछे हट गया
  rationale: क्रिया के हटने अथवा पीछे चले जाने के स्थानिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እምዲበ፡ ገጸ፡ ለምድር
  choice: धरती की सतह से
  rationale: शाब्दिक ‘धरती के मुख के ऊपर से’ के स्थानिक अर्थ को स्पष्ट और सहज आधुनिक हिन्दी में देता है।
