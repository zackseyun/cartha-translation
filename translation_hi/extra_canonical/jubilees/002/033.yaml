  text: and for glory above all days. This law and testimony was given to the children of Israel as an everlasting law throughout their generations.
translation:
  language: hi
  text: और सब दिनों से बढ़कर महिमा के लिए। यह व्यवस्था और गवाही इस्राएल की संतानों को उनकी पीढ़ियों के लिए सदा की व्यवस्था के रूप में दी गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለስብሐት
  choice: महिमा के लिए
  rationale: उपसर्ग ለ- के प्रयोजनात्मक अर्थ (‘के लिए’) और ስብሐት के ‘महिमा’ अर्थ, दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: እምኵሉ መዋዕል
  choice: सब दिनों से बढ़कर
  rationale: तुलनात्मक भाव ‘सभी दिनों से ऊपर/बढ़कर’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሕግ
  choice: व्यवस्था
  rationale: विधि अथवा स्थापित धार्मिक विधान के अर्थ में बाइबलीय हिन्दी का परिचित और गरिमापूर्ण शब्द है।
- source_word: ስምዕ
  choice: साक्षी
  rationale: मूल के ‘गवाही/साक्षी’ अर्थ को अमूर्त ‘साक्ष्य’ में बदले बिना बनाए रखता है।
- source_word: ደቂቀ እስራኤል
  choice: इस्राएल की संतानों
  rationale: वंशगत सामूहिक अभिव्यक्ति को आधुनिक, समावेशी और मूल-सन्निकट हिन्दी में प्रस्तुत करता है।
- source_word: ሕገ ዘለዓለም
  choice: सदा की व्यवस्था
  rationale: स्थायी और अनवरत वैधता का मूल भाव सरल हिन्दी में सुरक्षित है।
- source_word: ለትውልዶሙ
  choice: उनकी पीढ़ियों के लिए
  rationale: पूर्वसर्ग ለ- और बहुवचन पीढ़ियों के वंशगत विस्तार को यथासंभव सीधे रूप में रखता है।
theological_decisions:
- issue: ‘व्यवस्था और साक्षी’ का संबंध
  choice: दोनों संज्ञाओं को योजक ‘और’ के साथ समानांतर रखा गया
  alternative: इसे एक संयुक्त धारणा, जैसे ‘साक्षी-व्यवस्था’, के रूप में प्रस्तुत करना
  rationale: मूल में दोनों पद अलग-अलग हैं; अनुवाद उनकी संभावित विशिष्टता और अर्थगत तनाव को बनाए रखता है।
- issue: स्थायित्व की अभिव्यक्ति
  choice: ‘सदा की व्यवस्था’
  alternative: ‘अनन्त व्यवस्था’
  rationale: ‘सदा की’ सामान्य पाठक के लिए अधिक सहज है और अवधि की स्थायित्व-धारणा व्यक्त करती है, बिना दार्शनिक अनन्तता का अतिरिक्त अर्थ थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। पद आरम्भ में ‘और’ रखा गया है क्योंकि यह पिछले वाक्य के साथ निरंतरता दिखाता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
