  text: And on the fifth day he created the great sea monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—
translation:
  language: hi
  text: और पाँचवें दिन उसने जल की गहराइयों में विशाल समुद्री जीवों को बनाया, क्योंकि ये उसके हाथों से बनाए गए पहले देहधारी प्राणी थे; और जल में चलनेवाले हर प्राणी को, और उड़नेवाली हर वस्तु को—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አናብርት፡ ዐበይተ
  choice: बड़े-बड़े समुद्री जीव
  rationale: यह पदबंध बड़े जलीय/समुद्री प्राणियों को सूचित करता है। ‘समुद्री दैत्य’ अनावश्यक रूप से पौराणिक अर्थ ला सकता है, जबकि ‘जीव’ आधुनिक हिंदी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ማእከለ፡ ቀላያተ፡ ማያት
  choice: जल की गहराइयों में
  rationale: शाब्दिक स्थान-संबंध को सहज हिंदी में व्यक्त करता है और गहरे जल का बिंब बनाए रखता है।
- source_word: ዘሥጋ
  choice: मांसधारी प्राणियों में
  rationale: स्रोत के ‘मांस/देह’ संबंधी वर्गीकरण को केवल ‘जीवित प्राणी’ कहकर समतल नहीं किया गया।
- source_word: በአደዊሁ
  choice: उसके हाथों ने
  rationale: सृष्टि के मानवीकृत बिंब को बनाए रखने के लिए स्रोत का ‘उसके हाथों द्वारा’ रूप संरक्षित किया गया।
- source_word: ዘይትነወስ፡ ውስተ፡ ማያት
  choice: जल में चलनेवाली हर गतिशील वस्तु
  rationale: मूल की गति-संबंधी पुनरुक्ति को आंशिक रूप से बनाए रखते हुए हिंदी में सुबोध बनाया गया।
- source_word: ዘይሰርር
  choice: उड़नेवाली हर वस्तु
  rationale: मूल का व्यापक ‘जो उड़ता है’ अर्थ रखा गया; इसे केवल ‘पक्षी’ तक सीमित नहीं किया।
theological_decisions:
- issue: ‘पहले मांसधारी प्राणी’ का दावा
  choice: मांसधारी प्राणियों में ये पहले थे जिन्हें उसके हाथों ने बनाया था
  alternative: ये उसके हाथों से बनाए गए पहले जीवित प्राणी थे
  rationale: स्रोत में उपस्थित ‘मांस/देह’ की विशिष्टता और उसके सृष्टिक्रम संबंधी तनाव को सुरक्षित रखा गया; उसे व्यापक ‘जीवित प्राणी’ में नहीं बदला गया।
- issue: दिव्य हस्तकर्म का रूपक
  choice: उसके हाथों ने बनाया था
  alternative: उसने बनाया था
  rationale: मूल पाठ का प्रत्यक्ष हस्तकर्म-बिंब हटाने के बजाय ज्यों का त्यों रखा गया, बिना उसके तात्त्विक अर्थ की व्याख्या किए।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पद अंत में अगले अंश की ओर जारी रहता है, इसलिए दीर्घ डैश रखा गया है।
