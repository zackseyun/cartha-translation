  yaml_path: translation/extra_canonical/jubilees/002/031.yaml
  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
translation:
  language: hi
  text: और सबके सृष्टिकर्ता ने उस दिन को आशीष दी।[31] पर उसने सभी जातियों और राष्ट्रों को उस दिन शब्बात मानने के लिए पवित्र नहीं ठहराया; केवल इस्राएल को—उसी को अकेले—उसने पृथ्वी पर उस दिन खाने-पीने और शब्बात मानने का अधिकार दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: '31'
    text: यहाँ पाठ कहता है कि सृष्टिकर्ता ने उस दिन को आशीष दी, पर सभी जातियों और राष्ट्रों को उस दिन शब्बात मानने के लिए पवित्र नहीं ठहराया; पृथ्वी पर यह पालन केवल इस्राएल को दिया गया है। यह पवित्र समय के संबंध में चुनाव का एक धर्मवैचारिक दावा है, केवल जातीय टिप्पणी नहीं।
    reason: cross_reference
lexical_decisions:
- source_word: ፈጣሪ፡ ኵሉ
  choice: सबके सृष्टिकर्ता
  rationale: शाब्दिक अर्थ ‘सबका/सब वस्तुओं का सृष्टिकर्ता’ है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ለአሰንብቶ፡ ባቲ
  choice: उस दिन शब्बात मनाने
  rationale: क्रिया का अर्थ शब्बात का पालन करना अथवा विश्राम करना है। ‘शब्बात मनाना’ धार्मिक-सांस्कृतिक आशय को स्पष्ट रखता है और केवल सामान्य विश्राम तक अर्थ को सीमित नहीं करता।
- source_word: ወሀበ፡ ይብላዕ፡ ወይስተይ
  choice: खाने-पीने का अधिकार दिया
  rationale: ሀበ के बाद आश्रित क्रियाएँ यहाँ भोजन उपलब्ध कराने की अपेक्षा अनुमति या विशेषाधिकार देने का भाव रखती हैं; इसलिए केवल ‘खाने-पीने को दिया’ की सम्भावित भ्रांति से बचा गया है।
- source_word: ሕዝበ፡ ወአሕዛበ
  choice: लोगों और राष्ट्रों
  rationale: दो निकटार्थक सामूहिक पदों के भेद को हिन्दी में बनाए रखा गया है।
- source_word: እስራኤል፡ ባሕቲቱ፡ ሎቱ፡ ለባሕቲቱ
  choice: केवल इस्राएल को—हाँ, केवल उसी को—
  rationale: मूल में ‘केवल’ और एकवचन सर्वनाम की पुनरुक्ति द्वारा दिए गए जोर को बनाए रखा गया है।
theological_decisions:
- issue: शब्बात के लिए इस्राएल का विशेष पवित्रीकरण
  choice: सभी लोगों और राष्ट्रों को पवित्र न ठहराने तथा केवल इस्राएल को अधिकार दिए जाने का स्पष्ट विरोध बनाए रखा
  alternative: वाक्य को सामान्य जातीय टिप्पणी या केवल ऐतिहासिक प्रथा के रूप में नरम करना
  rationale: मूल पाठ पवित्र समय के पालन के संबंध में चुनाव और विशेषाधिकार का स्पष्ट धर्मवैचारिक दावा करता है; अनुवाद में इसे न तो कम किया गया है, न किसी बाद की साम्प्रदायिक व्याख्या से बढ़ाया गया है।
- issue: ‘पृथ्वी पर’ का संबंध
  choice: इसे खाने-पीने और शब्बात मनाने के पूरे विशेषाधिकार से जोड़ा
  alternative: इसे केवल अंतिम क्रिया ‘शब्बात मनाने’ से जोड़ना
  rationale: वाक्य के अंत में स्थित पद का दायरा कुछ हद तक खुला है; हिन्दी क्रम उसे पृथ्वी पर होने वाले समूचे वर्णित पालन से स्वाभाविक रूप से जोड़ता है, बिना अतिरिक्त सिद्धान्त गढ़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘विश्रामदिन’ के बजाय ‘शब्बात’ रखा गया है, क्योंकि मूल क्रिया सामान्य विश्राम से अधिक एक विशिष्ट पवित्र दिन के पालन की ओर संकेत करती है। विरामचिह्न मूल के जोर और विरोध को स्पष्ट करते हैं।
