  yaml_path: translation/extra_canonical/jubilees/002/003.yaml
  text: And then we saw his works, and we blessed him and offered praise before him on account of all his works, because
translation:
  language: hi
  text: तब हमने उसके कार्य देखे, और हमने उसे धन्य कहा तथा उसके सभी कार्यों के कारण उसके सामने स्तुति अर्पित की[a], क्योंकि—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने उसकी स्तुति की।”
    reason: गीज़ वाक्यांश का अर्थ परमेश्वर को स्तुति का प्रत्यक्ष लक्ष्य मानकर भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ምግባሮ፡ / ኵሉ፡ ምግባሩ፡
  choice: उसके कार्य / उसके सभी कार्य
  rationale: गीज़ ‘मिग्बार’ यहाँ किए हुए कामों या कृतियों को दर्शाता है; ‘कार्य’ सृष्टि के प्रसंग में स्वाभाविक है और दोनों आवृत्तियों को बनाए रखता है।
- source_word: ባረክናሁ፡
  choice: हमने उसे धन्य कहा
  rationale: क्रिया का पुरुषवाचक कर्म स्पष्ट है। ‘आशीष दी’ की तुलना में ‘धन्य कहा’ परमेश्वर के प्रति मनुष्यों/स्वर्गदूतों की वाणी के लिए अधिक स्वाभाविक है।
- source_word: ሰብሕነ፡ ቅድሜሁ፡
  choice: उसके सामने स्तुति अर्पित की
  rationale: शाब्दिक संरचना ‘हमने उसके सामने स्तुति की’ है। ‘स्तुति अर्पित की’ आधुनिक हिन्दी में सहज है और अनावश्यक ‘उसके सामने उसकी स्तुति’ की पुनरुक्ति से बचती है।
- source_word: በእንተ፡
  choice: के कारण
  rationale: 'यहाँ कारणसूचक अर्थ उपयुक्त है: स्तुति उसके सभी कार्यों के कारण की गई।'
- source_word: እስመ፡
  choice: क्योंकि—
  rationale: पद का अंतिम शब्द अगले कथन का कारण प्रस्तुत करता है; डैश से हिन्दी पाठ में वाक्य की जानबूझकर अधूरी निरंतरता स्पष्ट होती है।
theological_decisions:
- issue: परमेश्वर को ‘धन्य कहना’ बनाम ‘आशीष देना’
  choice: उसे धन्य कहा
  alternative: उसे आशीष दी
  rationale: मूल क्रिया दोनों अर्थ दे सकती है, पर इस दिशा में आशीष का अर्थ प्रशंसात्मक घोषणा है, न कि परमेश्वर को कोई वरदान प्रदान करना।
- issue: स्तुति का व्याकरणिक कर्म
  choice: उसके सामने स्तुति अर्पित की
  alternative: उसके सामने उसकी स्तुति की
  rationale: मूल में ‘उसके सामने’ स्पष्ट है, जबकि ‘उसकी’ जैसा प्रत्यक्ष कर्म अलग से व्यक्त नहीं है। मुख्य पाठ इस संरचना को सुरक्षित रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पद अगले पद में जारी रहता है, इसलिए अंत में ‘क्योंकि—’ रखा गया है।
