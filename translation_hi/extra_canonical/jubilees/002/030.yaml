base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/030.yaml
  text: And they shall not bring in or take out from house to house on this day[30], for it is holy and blessed more than any jubilee day of jubilees. On this one we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.
translation:
  language: hi
  text: इस दिन वे एक घर से दूसरे घर में न कुछ लाएँ और न कुछ बाहर ले जाएँ, क्योंकि यह दिन जुबलियों के किसी भी जुबली-दिन से बढ़कर पवित्र और धन्य है।[a] पृथ्वी पर किसी भी देहधारी को इस दिन सब्त मानना ज्ञात कराए जाने से पहले ही हमने स्वर्ग में इस दिन सब्त मनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जुबलियों के किसी भी जुबली-दिन से बढ़कर पवित्र और धन्य’ मूल पाठ में कठिन अभिव्यक्ति है। संभव है कि यह जोरदार तुलना हो, जो साप्ताहिक सब्त को सबसे बड़े उत्सवी चक्रों से भी ऊँचा ठहराती है; इसे ‘जुबलियों के किसी भी दिन से बढ़कर’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ወኢያብኡ፡ ወኢያውፅኡ፡ እምቤት፡ ቤተ
  choice: न तो एक घर से दूसरे घर में कुछ लाएँ, न वहाँ से कुछ बाहर ले जाएँ
  rationale: आने और बाहर ले जाने की दोनों निषेधात्मक क्रियाओं तथा घर-से-घर संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ቅድስት፡ ይእቲ፡ ወቡርክት፡ ይእቲ
  choice: पवित्र और धन्य है
  rationale: दोनों विशेषणों को बिना किसी धार्मिक परंपरा-विशेष की व्याख्या जोड़े सीधे सुरक्षित रखता है।
- source_word: ዕለት፡ ኢዮቤል፡ ዘኢዮቤልውሳት
  choice: जुबलियों के किसी भी जुबली-दिन
  rationale: मूल में उपस्थित ‘जुबली-दिन’ और ‘जुबलियों’ दोनों को बनाए रखता है, यद्यपि अभिव्यक्ति असामान्य है।
- source_word: አሰንበትነ
  choice: हमने ... सब्त मनाया था
  rationale: स्वर्गीय वक्ताओं द्वारा सब्त के पालन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለኵሉ፡ ዘሥጋ
  choice: किसी भी देहधारी को
  rationale: ‘समस्त देह/मांस’ की सामी अभिव्यक्ति का मानवीय संदर्भ रखते हुए मूल की देह-संबंधी भाषा भी सुरक्षित रखता है।
theological_decisions:
- issue: साप्ताहिक सब्त और जुबली-दिनों के बीच तुलना
  choice: जुबलियों के किसी भी जुबली-दिन से बढ़कर पवित्र और धन्य
  alternative: जुबलियों के किसी भी दिन से अधिक पवित्र और धन्य
  rationale: मूल पाठ में ‘जुबली’ शब्द की दोहरी संरचना है; उसे हटाने के बजाय बनाए रखा गया है। तुलना का सटीक आशय कठिन होने के कारण पादटिप्पणी में अनिश्चितता बताई गई है।
- issue: पृथ्वी पर सब्त-पालन के ज्ञान का दिया जाना
  choice: आज्ञा दिए जाने से पहले
  alternative: ज्ञात कराए जाने से पहले
  rationale: संदर्भ सब्त मनाने के लिए मनुष्यों को बताने का है; ‘आज्ञा दिए जाने’ से प्रयोजन स्पष्ट होता है, पर यह अर्थगत विस्तार है। मूल की औपचारिक निकटता हेतु मुख्य पाठ में इसे संयत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। ‘सब्त’ और ‘जुबली’ जैसे पाठ-विशिष्ट शब्द बनाए गए हैं। असामान्य ‘जुबली-दिन of जुबलियाँ’ संरचना को अर्थ की कठिनाई सहित सुरक्षित रखा गया है।
