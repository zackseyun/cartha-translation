  yaml_path: translation/extra_canonical/jubilees/048/014.yaml
  text: And all the people whom he had brought out pursued after Israel, and the Lord God cast them into the midst of the sea, into the depths of the abyss, beneath the children of Israel, just as the people of Egypt had cast their children into the river; He took vengeance on a million of them, and one thousand mighty men were destroyed, and those who pursued them perished because of envy.
translation:
  language: hi
  text: जो सूख गया था।[a] और वे सभी लोग, जिन्हें वह निकाल लाया था, इस्राएल का पीछा करने लगे। तब प्रभु परमेश्वर ने उन्हें समुद्र के बीच, अथाह गहराइयों में—इस्राएल की सन्तानों के नीचे—फेंक दिया, ठीक वैसे ही जैसे मिस्र के लोगों ने अपने बच्चों को नदी में फेंक दिया था। उसने उनमें से दस लाख से बदला लिया, और एक हज़ार पराक्रमी पुरुष नष्ट हो गए; इस्राएलियों का पीछा करने वाले भी ईर्ष्या के कारण नाश हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में यह पद इसी आश्रित वाक्यांश से आरम्भ होता है; इसका पूर्वपद सम्भवतः पिछले संदर्भ में है।
    reason: verse_boundary_fragment
lexical_decisions:
- source_word: እንተ፡ የብስ
  choice: जो सूख गया था
  rationale: मूल साक्ष्य पद के आरम्भ में एक आश्रित खंड देता है, जिसका पूर्वपद उपलब्ध अंश में नहीं है। हिन्दी में किसी अनिर्दिष्ट वस्तु के सूखने का भाव रखा गया है, बिना ‘भूमि’ या ‘समुद्र’ जोड़कर संदर्भ तय किए।
- source_word: ይደግኑ፡ ድኅሬሆሙ፡ ለእስራኤል
  choice: इस्राएल का पीछा करने लगे
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप, जिसमें पीछे दौड़ने/पीछा करने का अर्थ सुरक्षित है।
- source_word: ውስተ፡ መዓምቅቲሃ፡ ሰቀላይ
  choice: अथाह गर्त की गहराइयों में
  rationale: ‘गहराइयों’ और ‘गर्त/अथाह गहराई’ दोनों स्रोत-तत्त्वों को बनाए रखता है; केवल ‘गहराइयों में’ कहने से ሰቀላይ छूट जाता।
- source_word: በከመ፡ ወረዉ፡ ውሉዶሙ፡ ሰብአ፡ ግብጽ፡ ውስተ፡ ፈለገ
  choice: ठीक वैसे ही जैसे मिस्र के लोगों ने अपने बच्चों को नदी में फेंक दिया था
  rationale: सक्रिय क्रिया ‘फेंक दिया’, कर्ता ‘मिस्र के लोग’, और कर्म ‘अपने बच्चे’—तीनों को स्रोत के अनुसार स्पष्ट रखता है।
- source_word: ምእተ፡ አልፈ፡ ኀበቀሎሙ
  choice: उसने उनमें से दस लाख से बदला लिया
  rationale: संख्या को 100 × 10,000 अर्थात 1,000,000 माना गया है और पाठ में विद्यमान प्रतिशोध की क्रिया को अनूदित किया गया है।
- source_word: ዐሠርተ፡ ምእተ፡ ዐይሠ፡ ኀያላን
  choice: एक हज़ार पराक्रमी पुरुष
  rationale: 10 × 100 अर्थात 1,000; ኀያላን के सामर्थ्य/पराक्रम के भाव को ‘पराक्रमी’ से व्यक्त किया गया है।
- source_word: በእንተ፡ ሕሱዳ
  choice: ईर्ष्या के कारण
  rationale: ሕሱዳ का सीधा अर्थ ‘ईर्ष्या’ रखा गया है; कारण-संबंध को स्रोत की तरह खुला छोड़ा गया है।
theological_decisions:
- issue: मिस्रियों पर दण्ड और नदी में बच्चों को फेंकने के बीच प्रतिशोधात्मक समानता
  choice: ‘ठीक वैसे ही’ द्वारा समानता को स्पष्ट रखा
  alternative: समानता को सामान्य कालक्रम या केवल उपमा के रूप में नरम करना
  rationale: स्रोत की በከመ संरचना दैवी दण्ड और मिस्र के लोगों के पूर्व कृत्य के बीच जानबूझकर समानता बनाती है; इसे कमज़ोर करना न्याय-विषयक तनाव को मिटा देता।
- issue: ‘अपने बच्चों’ का संदर्भ
  choice: स्रोत के सर्वनाम को ‘अपने बच्चों’ के रूप में रखा
  alternative: व्याख्यात्मक रूप से ‘इस्राएलियों के बच्चों’ कहना
  rationale: व्याकरणिक रूप से सम्बद्ध स्वत्ववाचक अभिव्यक्ति को सुरक्षित रखा गया है; ऐतिहासिक संदर्भ के आधार पर कर्म की पहचान चुपचाप बदलना उचित नहीं।
- issue: ईर्ष्या किसकी थी और वह विनाश का कारण कैसे बनी
  choice: ‘ईर्ष्या के कारण’ कहकर संबंध अनिर्धारित रखा
  alternative: मिस्रियों की ईर्ष्या या परमेश्वर के दण्ड की विस्तृत व्याख्या जोड़ना
  rationale: स्रोत कारण बताता है, पर यहाँ उसके कर्ता और धर्मवैज्ञानिक प्रक्रिया को स्पष्ट नहीं करता।
