base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/007.yaml
  text: 'And you were to speak before the king of Egypt, before all his servants and before his people. And everything happened at your word: ten great and grievous judgments came upon the land of Egypt, for you to carry out.'
translation:
  language: hi
  text: 'और तुझे मिस्र के राजा के सामने, उसके सभी सेवकों और उसकी प्रजा के सामने बोलना था। और सब कुछ तेरे वचन के अनुसार हुआ: दस बड़े और कठोर दण्ड मिस्र देश पर आए, ताकि तू उन्हें कार्यान्वित करे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትናገር
  choice: तुझे ... कहना था
  rationale: द्वितीय पुरुष एकवचन क्रिया को प्रसंगानुकूल भूतकालीन दायित्व/नियति के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; संबोधन की प्रत्यक्षता बनाए रखने के लिए ‘तुझे’ रखा गया है।
- source_word: በቃልከ
  choice: तेरे वचन के अनुसार
  rationale: शाब्दिक अर्थ ‘तेरे वचन पर/से’ है; यह रूप मूसा के कहे वचन और उसके बाद हुई घटनाओं के संबंध को स्पष्ट रखते हुए हिन्दी में सहज है।
- source_word: ዐሥሩ፡ ኵነኔ፡ ዐበይት፡ ወጸዋጋት
  choice: दस बड़े और दुःखदायी दण्ड
  rationale: संख्या, न्याय-दण्ड का भाव और दोनों विशेषण सुरक्षित रखे गए हैं; ‘दुःखदायी’ कठोर परिणाम का भाव देता है, बिना किसी अतिरिक्त सांप्रदायिक अर्थ के।
- source_word: ትግበር
  choice: तू उन्हें पूरा करे
  rationale: क्रिया सक्रिय द्वितीय पुरुष पुल्लिंग एकवचन है; इसलिए निष्क्रिय ‘वे पूरे किए जाएँ’ के बजाय मूसा की सक्रिय भूमिका सुरक्षित रखी गई है।
theological_decisions:
- issue: अन्तिम प्रयोजन-वाक्य में मूसा की सक्रिय भूमिका
  choice: ताकि तू उन्हें पूरा करे
  alternative: ताकि वे पूरे किए जाएँ
  rationale: गीज़ क्रिया सक्रिय द्वितीय पुरुष एकवचन है। चुना हुआ रूप निर्णयों को पूरा करने में संबोधित व्यक्ति की सक्रिय भूमिका को बनाए रखता है, जबकि निष्क्रिय विकल्प स्रोत की व्याकरणिक सूचना को धुँधला कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष संबोधन रखा गया है। ‘तू/तेरे’ यहाँ अनादर नहीं, बल्कि एकवचन निकट धार्मिक संबोधन को दर्शाते हैं। वाक्यरचना साधारण पाठक के लिए सहज रखी गई है और स्रोत की सक्रिय क्रिया तथा प्रयोजन-संबंध सुरक्षित हैं।
