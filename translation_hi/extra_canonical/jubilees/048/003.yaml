base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/003.yaml
  text: On the way[3], at the lodging-place, he met you. Did he not desire with all his power to kill you and to save the Egyptians from your hand, when he saw that you had been sent to do this and to execute judgment upon Egypt?
translation:
  language: hi
  text: मार्ग में, पड़ाव के स्थान पर, वह तुमसे मिला।[a] क्या उसने अपनी पूरी शक्ति से तुम्हें मार डालने और मिस्रियों को तुम्हारे हाथ से बचाने की इच्छा नहीं की, जब उसने देखा कि तुम्हें यह करने और मिस्र पर न्याय करने के लिए भेजा गया है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ की क्रिया का अर्थ ‘सामना किया’ भी हो सकता है; प्रसंग यात्रा के दौरान हुई एक शत्रुतापूर्ण, प्राणघातक मुठभेड़ की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ትትቄበሎ
  choice: वह तुमसे भिड़ा
  rationale: मूल क्रिया का सामान्य अर्थ मिलना या सामना करना है; प्रसंग में यह घातक और विरोधपूर्ण मुठभेड़ है, इसलिए ‘भिड़ा’ उस शत्रुतापूर्ण भाव को व्यक्त करता है, पर ‘दोष लगाया’ जैसा असमर्थित अर्थ नहीं जोड़ता।
- source_word: በምጽላል
  choice: पड़ाव के स्थान पर
  rationale: यात्रा के दौरान रात बिताने या ठहरने के स्थान का स्वाभाविक हिन्दी रूप।
- source_word: አኮሁ
  choice: क्या ... नहीं की
  rationale: मूल की नकारात्मक आलंकारिक प्रश्न-रचना को सुरक्षित रखता है।
- source_word: ወበቀለ፡ ላዕለ
  choice: और मिस्र पर दण्ड लागू करने
  rationale: वाक्य के अंत और परामर्श-पाठ के आधार पर न्याय/प्रतिदण्ड को मिस्र पर कार्यान्वित करने का अर्थ; ‘लागू करना’ सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: यात्रा के दौरान प्राणघातक सामना करने वाले का संकेत
  choice: सर्वनाम ‘वह’ को मूल की तरह अनिर्दिष्ट रखा गया
  alternative: स्पष्ट रूप से ‘मस्तेमा’ या ‘परमेश्वर’ कहना
  rationale: इस पद के दिए हुए मूल पाठ में कर्ता नामित नहीं है; नाम जोड़ने से संदर्भगत व्याख्या पाठ में आयात हो जाती।
- issue: मिस्र पर होने वाली कार्रवाई का स्वरूप
  choice: ‘दण्ड लागू करना’
  alternative: ‘मिस्र से बदला लेना’
  rationale: यह रूप न्यायिक और प्रतिदण्डात्मक दोनों संभावनाओं को खुला रखता है और अनावश्यक सांप्रदायिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पड़ाव के स्थान पर’ यात्रा-संदर्भ को स्पष्ट करता है और ‘क्या ... नहीं’ मूल आलंकारिक प्रश्न को बनाए रखता है।
