  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the angel Mastema was bound and restrained from following after the children of Israel.
translation:
  language: hi
  text: और चौदहवें दिन, पंद्रहवें दिन, सोलहवें दिन, सत्रहवें दिन और अठारहवें दिन, स्वर्गदूत मस्तेमा बाँधा गया और इस्राएल की संतानों का पीछा करने से रोका गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአክ
  choice: स्वर्गदूत
  rationale: गीज़ शब्द का सामान्य अर्थ ‘दूत’ या ‘स्वर्गदूत’ है; इस अलौकिक पात्र के संदर्भ में ‘स्वर्गदूत’ स्पष्ट और स्वाभाविक है।
- source_word: ተእስረ
  choice: बाँधा गया
  rationale: यह क्रिया बंधन में डाले जाने को सीधे व्यक्त करती है और मूल पाठ के कर्मवाच्य को बनाए रखती है।
- source_word: ተዐግሠ
  choice: रोका गया
  rationale: संदर्भ में इसका आशय मस्तेमा को इस्राएल की संतानों के पीछे जाने से रोकना या नियंत्रित करना है; ‘रोका गया’ आधुनिक हिन्दी में सहज है।
- source_word: እምድኅረ ፡ ደቂቀ ፡ እስራኤል
  choice: इस्राएल की संतानों का पीछा करने से
  rationale: शाब्दिक ‘इस्राएल की संतानों के पीछे’ को प्रसंगानुसार स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि पीछा करने का भाव सुरक्षित है।
