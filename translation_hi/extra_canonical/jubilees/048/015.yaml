base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/015.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the prince Mastema was bound and imprisoned behind the children of Israel.
translation:
  language: hi
  text: और चौदहवें दिन, पंद्रहवें दिन, सोलहवें दिन, सत्रहवें दिन और अठारहवें दिन प्रधान मस्तेमा को बाँधकर इस्राएल की संतानों के पीछे बंदी रखा गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इस्राएल की संतानों के पीछे’ का आशय संभवतः उनसे दूर या उनके मार्ग के पीछे रोके रखा जाना है; मूल पाठ का स्थान-संबंध असामान्य और कुछ अस्पष्ट है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: መኩነነ፡ ማእቲማ
  choice: प्रधान मस्तेमा
  rationale: መኩነን पदाधिकारी, शासक या प्रधान को सूचित करता है; यहाँ स्वाभाविक हिन्दी में ‘प्रधान’ चुना गया है, जबकि मस्तेमा व्यक्तिनाम के रूप में रखा गया है।
- source_word: አቡረ፡ ወዐዐወ
  choice: बाँधकर … बंदी रखा गया
  rationale: दोनों क्रियाओं—बाँधे जाने और निरुद्ध किए जाने—को अलग-अलग बनाए रखता है और स्रोत के कर्मवाच्य भाव को सुरक्षित रखता है।
- source_word: እምድኅሬሆሙ፡ ለውሉደ
  choice: इस्राएल की संतानों के पीछे
  rationale: स्थान-सूचक ‘पीछे’ का असामान्य किंतु प्रत्यक्ष अर्थ बनाए रखा गया है; पदबंध में ‘इस्राएल’ संदर्भ से स्पष्ट है और प्रमाणित पाठ-परंपरा के अनुसार व्यक्त किया गया है।
theological_decisions:
- issue: मस्तेमा को किसने बाँधा
  choice: कर्ता को अनिर्दिष्ट रखते हुए कर्मवाच्य अनुवाद
  alternative: परमेश्वर/स्वर्गदूतों ने मस्तेमा को बाँधा
  rationale: इस पद के गीइज़ पाठ में कर्ता स्पष्ट नहीं है; किसी विशिष्ट दिव्य कर्ता को जोड़ना व्याख्यात्मक विस्तार होता।
- issue: ‘पीछे’ का संबंध
  choice: भौतिक/स्थानिक भाषा को यथावत रखना
  alternative: इस्राएल की संतानों से दूर या उनकी रक्षा के लिए बंदी रखना
  rationale: ऐसे विकल्प संभावित आशय समझाते हैं, पर स्रोत की अस्पष्टता को अनावश्यक रूप से सुलझा देते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; क्रमिक तिथियों की पुनरावृत्ति स्रोत के जोर के अनुसार रखी गई है। आरंभ के वे शब्द शामिल नहीं किए गए जो उपलब्ध गीइज़ अंश में पिछले पद के अंत से संबंधित प्रतीत होते हैं।
