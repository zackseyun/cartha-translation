base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/010.yaml
  text: And all the people whom he brought out pursued after them[10], after Israel, and Yahweh our God cast them into the midst of the sea, into its depths, beneath the sons of Israel, just as the people of Egypt had cast their sons into the river. A thousand thousand and ten thousand mighty men were destroyed because of one nursing infant of the children of your people whom they had thrown into the river.
translation:
  language: hi
  text: और जिन सब लोगों को बाहर निकाला गया था, वे उनके पीछे[a]—इस्राएल के पीछे—दौड़े। तब यहोवा, हमारे परमेश्वर, ने उन्हें समुद्र के बीच में, उसकी गहराइयों में, इस्राएल की संतानों के नीचे ही डाल दिया, ठीक जैसे मिस्र के लोगों ने उनके बेटों को नदी में डाल दिया था। तुम्हारे लोगों की संतानों में से एक दूध पीते शिशु के कारण, जिसे उन्होंने नदी में डाल दिया था, दस लाख और दस हज़ार पराक्रमी पुरुष नष्ट हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बचे हुए स्रोत में पद-संख्या 9 से सीधे 14 पर चली जाती है; यहाँ अध्याय की पद-संख्या पढ़ने की सुविधा के लिए क्रम से दी गई है, जबकि उपलब्ध पूरा पाठ सुरक्षित रखा गया है।
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር፡ አምላክ
  choice: हमारे परमेश्वर यहोवा
  rationale: वाक्य में निहित प्रथम-पुरुष बहुवचन संबंध को रखते हुए दिव्य नाम को ‘यहोवा’ और አምላክ को ‘परमेश्वर’ के रूप में व्यक्त किया गया है।
- source_word: መዓምቅቲሃ
  choice: उसकी गहराइयों में
  rationale: समुद्र की गहरी अथवा अथाह जगहों के बहुवचन भाव को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ሰቀላይ
  choice: दूध पीते एक बच्चे
  rationale: यह शब्द स्तनपान करने वाले शिशु का संकेत देता है; ‘दूध पीता बच्चा’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: ምእተ፡ አልፈ ... ዐሠርተ፡ ምእተ
  choice: दस लाख और दस हज़ार
  rationale: संख्या-समूह को परामर्श-पाठ में प्रमाणित ‘a thousand thousand and ten thousand’ के अनुसार आधुनिक हिन्दी संख्या-रूप में दिया गया है।
theological_decisions:
- issue: मिस्रियों द्वारा नदी में फेंके गए ‘बेटों’ का संबंध
  choice: ‘उनके बेटों’ कहकर सर्वनामगत संदर्भ खुला रखा गया
  alternative: ‘इस्राएलियों के बेटों’ कहकर स्पष्ट करना
  rationale: स्रोत में सर्वनाम है; निर्गमन-कथा इस्राएली बालकों की ओर संकेत करती है, पर अनुवाद में स्रोत की व्याकरणिक अस्पष्टता को अनावश्यक रूप से समाप्त नहीं किया गया।
- issue: मिस्री सेना का विनाश और एक शिशु के साथ उसका कारणात्मक संबंध
  choice: ‘एक बच्चे के कारण’
  alternative: ‘एक बच्चे के बदले में’
  rationale: अंतिम संबंधसूचक पद कारण अथवा प्रतिफल—दोनों की छाया दे सकता है; ‘के कारण’ स्रोत के निकट रहते हुए प्रतिशोध की अधिक स्पष्ट व्याख्या आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे गीइज़ वाक्य को दो वाक्यों में बाँटा गया है, पर घटनाक्रम और कारणात्मक तनाव सुरक्षित हैं। ‘पीछे—इस्राएल के पीछे—’ स्रोत की पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
