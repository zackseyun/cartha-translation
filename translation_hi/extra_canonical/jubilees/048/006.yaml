  text: And he burned them with fire. And everything was entrusted into your hand so that you might do it, before it was done, and you were present.
translation:
  language: hi
  text: और उसने उन्हें आग में जला दिया। और सब कुछ तुम्हारे हाथ में सौंप दिया गया, ताकि तुम उसे करो; उसके किए जाने से पहले ही तुम उपस्थित थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውዐዮሙ፡ በእሳት
  choice: उन्हें आग में जला दिया
  rationale: क्रिया और अग्नि-सूचक पद का सीधा, स्वाभाविक हिन्दी रूप; कर्ता के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: ኵሉ፡ ተፈነወ፡ በእዴከ
  choice: सब कुछ तुम्हारे हाथ में सौंप दिया गया
  rationale: शाब्दिक ‘भेजा गया’ की तुलना में प्रसंगानुकूल रूप से अधिकार अथवा दायित्व सौंपे जाने का भाव व्यक्त करता है, जबकि कर्मवाच्य और ‘तुम्हारे हाथ में’ की छवि सुरक्षित रहती है।
- source_word: ከመ፡ ትግበር
  choice: ताकि तुम उसे करो
  rationale: उद्देश्यवाचक रचना को स्पष्ट रखते हुए मूल क्रिया ‘करना’ को अनावश्यक व्याख्या के बिना सुरक्षित रखा गया है।
- source_word: ዘእንበለ፡ ይትገበር
  choice: उसके किए जाने से पहले
  rationale: यहाँ ዘእንበለ के साथ क्रियात्मक रचना को कालवाचक ‘इससे पहले कि वह किया जाए’ के अर्थ में लिया गया है, न कि ‘तुम्हारे बिना कुछ नहीं हुआ’ के अर्थ में।
- source_word: ወሀለወከ
  choice: ही तुम उपस्थित थे
  rationale: मूल में उपस्थित रहने या मौजूद होने का स्वतंत्र कथन है; ‘ही’ हिन्दी में पूर्वता पर बल को सहज बनाता है, पर कथन का आशय नहीं बदलता।
theological_decisions:
- issue: मूसा की भूमिका और पूर्व-उपस्थिति का कथन
  choice: ‘उसके किए जाने से पहले ही तुम उपस्थित थे’
  alternative: ‘और तुम्हारे बिना कुछ भी नहीं किया गया’
  rationale: वैकल्पिक पाठ एक अधिक व्यापक कारणात्मक या सहभागी दावा उत्पन्न करता है, पर गीइज़ पदबंध का कालवाचक अर्थ और अंतिम क्रिया ‘तुम उपस्थित थे’ वर्तमान चयन का समर्थन करते हैं। इस प्रकार पाठ की असामान्य धार्मिक-कालगत तनावपूर्ण भाषा को मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘तुम’ मूल के एकवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है। वाक्य-विन्यास को पठनीय बनाया गया है, लेकिन मूल की क्रमिकता, कर्मवाच्य और पूर्व-उपस्थिति का कथन सुरक्षित रखा गया है।
