  text: Through him he took vengeance for Israel. And the LORD did everything for Israel, and according to his ordinance, which he established with Abraham, so that he might take vengeance on them just as they had enslaved them by force.
translation:
  language: hi
  text: उसी के द्वारा उसने इस्राएल के लिए प्रतिशोध लिया[a]। और प्रभु ने इस्राएल के लिए जो कुछ किया, वह सब अपने उस विधान के अनुसार था, जिसे उसने अब्राहम के साथ स्थापित किया था, ताकि वह उनसे उसी प्रकार प्रतिशोध ले, जिस प्रकार उन्होंने उन्हें बलपूर्वक दास बनाया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके द्वारा उसने इस्राएल का बदला लिया।”
    reason: गीज़ अभिव्यक्ति में इस्राएल के पक्ष में प्रतिशोध लेने का भाव है; हिन्दी में ‘इस्राएल का बदला’ निकट, किंतु अधिक अस्पष्ट, मुहावरेदार रूप है।
  - marker: b
    text: या, “जिस प्रकार उन्होंने उन्हें अन्यायपूर्वक अधीन किया था।”
    reason: स्रोत-क्रिया दास बनाने अथवा अधीन करने का अर्थ दे सकती है, और अंतिम पद में अन्यायपूर्ण बल या जबरदस्ती का भाव है।
lexical_decisions:
- source_word: ቦቱ
  choice: उसी के द्वारा
  rationale: यह पद पिछले संदर्भ के व्यक्ति को साधन के रूप में इंगित करता है; इसलिए इसे उद्देश्यवाचक वाक्य न बनाकर ‘उसी के द्वारा’ रखा गया है।
- source_word: በቀለ / ይትበቀል
  choice: बदला लिया / बदला ले
  rationale: दोनों रूप प्रतिशोध लेने की एक ही मूल धारणा व्यक्त करते हैं; आधुनिक हिन्दी में ‘बदला लेना’ सहज और स्पष्ट है।
- source_word: ሥርዐቱ
  choice: विधान
  rationale: यहाँ शब्द व्यवस्था, निर्धारित नियम या अध्यादेश का बोध देता है; स्रोत में स्पष्ट ‘वाचा’ न होने के कारण ‘विधान’ चुना गया है।
- source_word: ቀነይዎሙ
  choice: उन्हें ... दास बनाया था
  rationale: क्रिया केवल सामान्य उत्पीड़न नहीं, बल्कि अधीन करने या दास बनाने का विशिष्ट अर्थ रखती है।
- source_word: በግፍዕ
  choice: बलपूर्वक
  rationale: यह अन्यायपूर्ण हिंसा या जबरदस्ती का भाव देता है; दास बनाने की क्रिया के साथ ‘बलपूर्वक’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम እግዚአብሔር का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: गीज़ पद में प्रयुक्त उपाधि का सीधा और संप्रदाय-निरपेक्ष हिन्दी रूप ‘प्रभु’ है; यहाँ स्रोत-पाठ स्वयं टेट्राग्राम को प्रत्यक्ष रूप से प्रस्तुत नहीं करता।
- issue: प्रतिशोध का आधार
  choice: ‘जिस प्रकार’ द्वारा समानुपातिक संबंध बनाए रखा
  alternative: ‘क्योंकि’ द्वारा केवल कारण बताना
  rationale: በከመ समानता या अनुरूपता व्यक्त करता है; इसलिए पाठ प्रतिशोध और पूर्व दासता के बीच ‘उसी प्रकार’ का संबंध रखता है, केवल कारणात्मक संबंध नहीं।
- issue: अंतिम सर्वनामों की संदर्भगत अस्पष्टता
  choice: ‘उन्होंने उन्हें’ बनाए रखा
  alternative: ‘मिस्रियों ने इस्राएलियों को’ स्पष्ट करना
  rationale: स्रोत में दोनों समूह सर्वनामों से व्यक्त हैं। संदर्भ अर्थ स्पष्ट करता है, पर नाम जोड़ना मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश के भीतर का अंश मुख्य क्रिया ‘सब कुछ किया’ को उसके विधान से जोड़ता है, जबकि सर्वनामों की स्रोतगत अस्पष्टता अनावश्यक नाम जोड़कर समाप्त नहीं की गई।
