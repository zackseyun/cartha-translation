base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/004.yaml
  text: But I delivered you from his hand, and you did the signs and wonders which you were sent to do in Egypt against Pharaoh and against all his house and against his servants and against his people.
translation:
  language: hi
  text: परन्तु मैंने तुझे उसके हाथ से छुड़ाया, और तूने वे चिन्ह और अद्भुत काम किए जिन्हें करने के लिए तुझे भेजा गया था[a]—मिस्र में फ़िरौन, उसके पूरे घराने, उसके सेवकों और उसकी प्रजा के विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जिनके लिए तुझे भेजा गया था कि तू उन्हें करे।”'
    reason: गीज़ वाक्यांश में उद्देश्यसूचक संबंध को अधिक प्रत्यक्ष रूप से दिखाने वाला वैकल्पिक पाठ।
lexical_decisions:
- source_word: ባላሕኩከ
  choice: मैंने तुझे ... छुड़ाया
  rationale: क्रिया का अर्थ बचाना या छुड़ाना है; एकवचन संबोधन को ‘तुझे’ से बनाए रखा गया है।
- source_word: እምእዴሁ
  choice: उसके हाथ से
  rationale: स्रोत के ‘उसके हाथ से’ रूपक को हिन्दी में स्वाभाविक और निकट रूप में सुरक्षित रखा गया है।
- source_word: ተአምረ፡ ወመንክረ
  choice: चिन्ह और अद्भुत काम
  rationale: पारंपरिक अर्थ-युग्म ‘signs and wonders’ को साधारण आधुनिक हिन्दी में स्पष्ट रखते हुए दोनों पद अलग रखे गए हैं।
- source_word: ኵሉ፡ ቤቱ
  choice: उसके पूरे घराने
  rationale: ‘उसका सारा घर’ यहाँ भवन से अधिक फ़िरौन के गृह/वंशीय प्रतिष्ठान का संकेत देता है; ‘घराना’ उस सामूहिक अर्थ को व्यक्त करता है।
- source_word: አግብርቱ
  choice: उसके सेवकों
  rationale: बहुवचन आश्रित सेवकों के लिए तटस्थ ‘सेवक’ चुना गया है; इससे अनावश्यक रूप से ‘दास’ का अधिक संकीर्ण अर्थ आरोपित नहीं होता।
theological_decisions:
- issue: ለዛ፡ ተፈነውከ፡ ትግበር में उद्देश्य और संबंधवाचक संरचना
  choice: जिन्हें करने के लिए तुझे भेजा गया था
  alternative: जिनके लिए तुझे भेजा गया था कि तू उन्हें करे
  rationale: स्रोत में भेजे जाने और कार्य करने के बीच उद्देश्य-संबंध स्पष्ट है, पर उसकी संरचना हिन्दी में शब्दशः रखने पर अस्वाभाविक हो जाती है। मुख्य पाठ अर्थ को सहज रूप से देता है और पादटिप्पणी स्रोत की अधिक शाब्दिक संरचना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; एकवचन निकट संबोधन ‘तू/तुझे’ स्रोत के व्याकरणिक रूप को बनाए रखता है। आरम्भ का ግብጻውያን (‘मिस्री’) पूर्ववर्ती वाक्य/पद का अंतिम शब्द प्रतीत होता है और अंग्रेज़ी परामर्श-पाठ भी उसे 48:4 में नहीं रखता, इसलिए उसे इस पद के मुख्य पाठ में शामिल नहीं किया गया।
