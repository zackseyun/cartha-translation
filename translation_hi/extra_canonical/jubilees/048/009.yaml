  yaml_path: translation/extra_canonical/jubilees/048/009.yaml
  text: And the prince Mastema stood up against you and sought to cast you into Pharaoh’s hand, and he helped the magicians of Egypt, and they stood and acted before you. We indeed permitted them to do evil, but we did not allow healing to be performed by their hands. But the LORD struck them with evil sores, and they were unable to continue resisting, because we made them incapable of performing even one sign of enchantment. And through all the signs and wonders the prince Mastema was put to shame, until, when he grew strong, he cried out to the Egyptians that they should pursue after you with all the power of Egypt, with their chariots and with their horses and with all the multitude of the people of Egypt. And I stood between the Egyptians and Israel, and we delivered Israel from his hand and from the hand of his people, and the LORD brought them out through the midst of the sea as on dry land.
translation:
  language: hi
  text: और प्रधान मस्तेमा तेरे विरुद्ध उठ खड़ा हुआ और उसने तुझे फ़िरौन के हाथ में सौंप देने का प्रयत्न किया। उसने मिस्र के जादूगरों की सहायता की, और वे तेरे सामने खड़े होकर अपने काम करने लगे। हमने उन्हें बुराई करने की अनुमति तो दी, पर उनके हाथों से चंगाई करने नहीं दी। तब प्रभु ने उन्हें बुरे फोड़ों से मारा, और वे आगे विरोध न कर सके, क्योंकि हमने उन्हें ऐसा असमर्थ कर दिया था कि वे जादू-टोने का एक भी चिह्न न दिखा सकें। सभी चिह्नों और अद्भुत कामों के द्वारा प्रधान मस्तेमा लज्जित हुआ। फिर वह प्रबल हुआ और उसने मिस्रियों को पुकारकर कहा कि वे मिस्र की सारी शक्ति—अपने रथों, घोड़ों और मिस्र की जनता की पूरी भीड़—के साथ तेरा पीछा करें। तब मैं मिस्रियों और इस्राएल के बीच खड़ा हो गया, और हमने इस्राएल को उसके हाथ और उसकी प्रजा के हाथ से छुड़ाया। प्रभु उन्हें समुद्र के बीच से निकाल ले गया, मानो वे सूखी भूमि पर चल रहे हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: मस्तेमा का प्रधान
  rationale: መኰንን का मूल अर्थ शासक/प्रधान है; व्यक्तिनाम मस्तेमा को लिप्यंतरित रखा गया।
- source_word: ሥረያቲሆሙ
  choice: जादूगरों
  rationale: प्रसंग निर्गमन के मिस्री जादूगरों का है; सामान्य आधुनिक हिन्दी में स्पष्ट पद चुना गया।
- source_word: ፈውሳ
  choice: चंगाई
  rationale: शब्द उपचार या आरोग्य का संकेत देता है; बुराई के विपरीत स्पष्ट अर्थ बनाए रखा गया।
- source_word: ሕሱደ፡ ትእምርተ
  choice: जादू-टोने का ... चिह्न
  rationale: मिस्री जादूगरों के मायावी/मंत्र-संबंधी चिह्न का प्रसंगगत अर्थ व्यक्त करता है।
- source_word: በኵሉ፡ ኃይሎሙ
  choice: सारी शक्ति
  rationale: मिस्र की समूची सैन्य सामर्थ्य को स्वाभाविक हिन्दी में व्यक्त किया गया।
theological_decisions:
- issue: जादूगरों के बुरे कार्य और चंगाई के बीच विरोध
  choice: हमने उन्हें बुराई करने की अनुमति तो दी, पर उनके हाथों से चंगाई होने नहीं दी
  alternative: उन्होंने अपनी कलाएँ कीं और हमने उन्हें ऐसा करने दिया
  rationale: स्रोत में ‘बुराई’ और ‘चंगाई’ के बीच स्पष्ट विरोध तथा दूसरे खंड में निषेध पर नवीन पाठ-समीक्षा आधारित है।
- issue: प्रथम पुरुष बहुवचन ‘हम’ और एकवचन ‘मैं’
  choice: दोनों को स्रोत के अनुसार यथावत रखा
  alternative: दोनों को एक ही दैवी वक्ता के एकवचन में समतल करना
  rationale: वचन-परिवर्तन पाठ की वास्तविक कथात्मक और धर्मवैचारिक तनावपूर्ण विशेषता है; इसे चुपचाप हल नहीं किया गया।
- issue: समुद्र पार करने की रीति
  choice: मानो वे सूखी भूमि पर चल रहे हों
  alternative: सूखी भूमि पर
  rationale: प्राप्त गीइज़ अंश ‘जैसे/मानो’ पर समाप्त होता है; अंग्रेज़ी परामर्श-पाठ के आशय को रखते हुए उपमा की संरचना संरक्षित की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘प्रभु’, ‘फ़िरौन’, ‘इस्राएल’ और ‘मस्तेमा’ जैसे परिचित बाइबलीय रूप रखे गए हैं। स्रोत की वचन-असंगति और नैतिक तनाव को समतल नहीं किया गया।
