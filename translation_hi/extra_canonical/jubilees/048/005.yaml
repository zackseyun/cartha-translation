base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/005.yaml
  text: 'And the LORD executed a great vengeance on them for Israel: he struck them with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters, and their livestock with death, and with hailstones—by this he destroyed everything that grew for them—and with locusts that devoured what had been left for them from the hail, and with darkness, and with the death of their firstborn, of man and beast; and on all their gods the LORD executed vengeance.'
translation:
  language: hi
  text: 'और यहोवा ने इस्राएल के कारण उन पर बड़ा प्रतिशोध लिया: उसने उन्हें लहू से, मेंढकों से, मच्छरों[a] से, डाँसों[b] से, और ऐसे बुरे फोड़ों से मारा जिनमें फफोले फूट पड़ते थे; उनके पशुओं पर मृत्यु लाई; ओलों से उसने वह सब नष्ट कर दिया जो उनके लिए उगता था; टिड्डियों से, जिन्होंने उनके लिए ओलों से बचा हुआ सब खा लिया; अंधकार से; और मनुष्यों तथा पशुओं के पहिलौठों की मृत्यु से। और यहोवा ने उनके सभी देवताओं पर प्रतिशोध लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: जूँ; मूल शब्द किसी छोटे काटने वाले कीट को सूचित करता है, पर उसकी ठीक पहचान निश्चित नहीं है।'
    reason: प्राचीन विपत्ति-सूची में संबंधित कीट की प्रजाति विवादित है।
  - marker: b
    text: 'या: काटने वाली मक्खियाँ; मूल शब्द से अभिप्रेत कीट की ठीक पहचान निश्चित नहीं है।'
    reason: ‘डाँस’, ‘कुत्ता-मक्खी’ और अन्य काटने वाली मक्खियों के बीच स्रोत-साक्ष्य निर्णायक नहीं है।
lexical_decisions:
- source_word: በቀለ
  choice: प्रतिशोध लिया
  rationale: यहाँ संज्ञात्मक अर्थ ‘vengeance/retribution’ है; ‘बदला’ की तुलना में ‘प्रतिशोध’ अधिक गरिमापूर्ण और न्यायिक भाव रखता है।
- source_word: በቍርነነዓን
  choice: कुटकियों
  rationale: मिस्र की विपत्ति के संदर्भ में यह छोटे काटने वाले कीट/gnats की ओर संकेत करता है; सटीक कीट-जाति अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: በትነንያ
  choice: डाँसों
  rationale: पारंपरिक plague terminology में dog-flies अथवा काटने वाली मक्खियों के लिए स्वाभाविक हिन्दी विकल्प; प्राणी की निश्चित पहचान पर पादटिप्पणी रखी गई है।
- source_word: በእኩይ፡ ቍስል፡ ዘውእቱ፡ ይፈልሕ፡ ዐንጸዐንጺ
  choice: ऐसे बुरे फोड़ों से ... जिनसे फफोले निकलते थे
  rationale: घावों के फूटने/फफोले उभरने की स्रोत-छवि को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ወእንስሳሆሙ፡ በሞት
  choice: उनके पशुओं को महामारी से मारा
  rationale: शाब्दिक ‘मृत्यु से’ हिन्दी में अस्पष्ट है; निर्गमन की पशु-मृत्यु के संदर्भ में ‘महामारी’ साधन और परिणाम दोनों को सहज रूप से व्यक्त करती है।
- source_word: ኵሎ፡ ዘይሠርፅ፡ ሎሙ
  choice: उनकी सारी उपज
  rationale: शाब्दिक अर्थ ‘जो कुछ उनके लिए उगता था’ है; ‘उपज’ कृषि-संदर्भ को संक्षेप और स्वाभाविक रूप से व्यक्त करती है।
- source_word: በኵሉ፡ አማልክቲሆሙ
  choice: उनके सभी देवताओं पर
  rationale: बहुवचन और दैवी न्याय के लक्ष्य को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखा गया है।
theological_decisions:
- issue: इस्राएल के कारण दण्ड का आशय
  choice: इस्राएल के कारण
  alternative: इस्राएल की ओर से / इस्राएल के लिए
  rationale: स्रोत का በእንተ कारण, हित या पक्ष—इनसे जुड़ी अर्थ-छाया रख सकता है। ‘के कारण’ इस संबंध को खुला रखता है और परमेश्वर की प्रेरणा को अत्यधिक विशिष्ट नहीं बनाता।
- issue: मिस्र के देवताओं पर प्रतिशोध
  choice: देवताओं
  alternative: मूर्तियों
  rationale: स्रोत स्पष्ट रूप से ‘देवताओं’ कहता है। ‘मूर्तियाँ’ कर देने से अस्तित्वगत/धर्मवैज्ञानिक तनाव अनावश्यक रूप से हल हो जाता; इसलिए स्रोत की भाषा सुरक्षित रखी गई है।
- issue: दैवी नाम
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत दैवी नाम के पारंपरिक हिन्दी रूप को रखा गया है, जिससे सामान्य उपाधि और नाम का भेद बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। लंबी गीइज़ सूची को हिन्दी की पठनीयता के लिए कई वाक्यों में बाँटा गया, पर विपत्तियों का क्रम और अंतिम समांतर ‘प्रतिशोध’ सुरक्षित रखा गया है। तकनीकी या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘पहिलौठों’, ‘ओलों’, ‘टिड्डियों’ जैसे परिचित बाइबिलीय पद बनाए रखे गए हैं।
