  text: Israel, so that he could not accuse them.
translation:
  language: hi
  text: उसने मिस्रियों की सहायता की, ताकि वे इस्राएल की सन्तानों का पीछा करें। उसने उनके मनों को कठोर और हठी बना दिया; और यहोवा परमेश्वर की ओर से यह योजना बनाई गई कि वह उन्हें मार डाले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए गीइज़ स्रोत की पंक्ति स्रोत-सारणी में पद 17 के रूप में चिह्नित है और उसकी विषयवस्तु उपलब्ध अंग्रेज़ी परामर्श-पाठ (“Israel, so that he could not accuse them”) से मेल नहीं खाती। यहाँ अनुवाद गीइज़ पंक्ति के आधार पर किया गया है; प्रकाशन से पहले पद-संरेखण की जाँच आवश्यक है।
    reason: अनुरोधित सन्दर्भ, स्रोत-पंक्ति की पद-संख्या और अंग्रेज़ी परामर्श-पाठ के बीच महत्त्वपूर्ण पाठ-संरेखण असंगति को पारदर्शी बनाना।
lexical_decisions:
- source_word: ይርድእዎሙ፡ ለግብጽ
  choice: उसने मिस्रियों की सहायता की
  rationale: क्रिया का मूल अर्थ ‘सहायता करना’ है; प्रसंग में मिस्रियों को पीछा करने में सहायता देने का भाव है।
- source_word: ይደግኑ፡ ድኅሬሆሙ
  choice: वे ... का पीछा करें
  rationale: ድኅሬहोሙ के ‘उनके पीछे’ अर्थ को स्वाभाविक हिन्दी में ‘उनका पीछा’ के रूप में व्यक्त किया गया है।
- source_word: ለውሉደ፡ እስራኤል
  choice: इस्राएल की सन्तानों
  rationale: शाब्दिक संरचना ‘इस्राएल की सन्तान/सन्तानों’ है; समूहवाचक आशय के लिए बहुवचन रखा गया है।
- source_word: ጸጽንዐ፡ አልባቢሆሙ፡ ወአንየሎሙ
  choice: उसने उनके मनों को कठोर और हठी बना दिया
  rationale: दो समांतर क्रियाओं में दृढ़/कठोर करने और अड़ियल बनाने का भाव है; हिन्दी में उनकी अलग-अलग छटा सुरक्षित रखी गई है।
- source_word: ወተኀስየ፡ እምኀበ፡ እግዚአብሔር፡ አምላክ
  choice: यहोवा परमेश्वर की ओर से यह योजना बनाई गई
  rationale: निष्क्रिय अभिव्यक्ति और दैवी स्रोत दोनों सुरक्षित रखे गए हैं; ‘यहोवा परमेश्वर’ እግዚአብሔር አምላክ का गरिमापूर्ण पारंपरिक हिन्दी रूप है।
- source_word: ከመ፡ ይምሐጾሙ
  choice: कि वह उन्हें मार डाले
  rationale: क्रिया विनाशकारी प्रहार/मार डालने का संकेत देती है; कर्म के रूप में आए बहुवचन सर्वनाम ‘उन्हें’ को जानबूझकर अनिर्दिष्ट रखा गया है।
theological_decisions:
- issue: मिस्रियों के मन कठोर करने में कर्ता की पहचान
  choice: ‘उसने’ कहकर स्रोत के पुरुषवाचक एकवचन को बनाए रखा
  alternative: कर्ता को स्पष्ट रूप से परमेश्वर या मस्तेमा बताना
  rationale: उद्धृत पंक्ति अपने आप कर्ता का नाम नहीं देती; किसी पात्र का नाम जोड़ना वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से हल कर देता।
- issue: अन्तिम ‘उन्हें’ का संदर्भ
  choice: सर्वनाम को अनिर्दिष्ट रखा
  alternative: ‘मिस्रियों को’ स्पष्ट करना
  rationale: संदर्भ से मिस्री सम्भावित हैं, पर गीइज़ पंक्ति स्वयं केवल बहुवचन सर्वनाम देती है; इसलिए अनुवाद ने उससे अधिक स्पष्टता नहीं जोड़ी।
- issue: दैवी योजना और मानवीय/आत्मिक कार्यकारिता का तनाव
  choice: कठोर करने वाले कर्ता और ‘यहोवा परमेश्वर की ओर से’ बनी योजना, दोनों कथनों को साथ रखा
  alternative: दोनों को एक ही कर्ता की सीधी कार्रवाई बनाना
  rationale: स्रोत में उपस्थित स्तरित कार्यकारिता और धार्मिक तनाव को बिना समतल किए सुरक्षित रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘सन्तानों’, ‘हठी’ और ‘योजना’ सामान्य पाठक के लिए सुबोध हैं। सर्वनामों की स्रोतगत अस्पष्टता को नाम जोड़कर नहीं सुलझाया गया।
