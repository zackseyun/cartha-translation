base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/002.yaml
  text: Again, in the second year of the fiftieth jubilee, you know what was spoken to you on Mount Sinai, and what the prince Mastema desired to do to you when you were returning to Egypt.
translation:
  language: hi
  text: फिर, पचासवीं जुबली के दूसरे वर्ष में, तुम जानते हो[a] कि सीनै पर्वत पर तुमसे क्या कहा गया था, और जब तुम मिस्र लौट रहे थे[b], तब राजकुमार मस्तेमा तुम्हारे साथ क्या करना चाहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम जानोगे।”
    reason: गीज़ क्रियारूप वर्तमान अथवा भविष्य—दोनों अर्थ दे सकता है।
  - marker: b
    text: या, “मिस्र में प्रवेश कर रहे थे।”
    reason: यहाँ प्रयुक्त क्रिया का अर्थ संदर्भानुसार ‘लौटना’ है, पर इसे ‘प्रवेश करना’ भी समझा गया है।
lexical_decisions:
- source_word: ፶ኢዮቤሌው
  choice: पचासवाँ जुबली-वर्ष
  rationale: स्रोत की कालगणना को स्पष्ट रखते हुए ‘जुबली’ के तकनीकी अर्थ को सुरक्षित रखा गया है।
- source_word: ታአምር
  choice: तुम जानते हो
  rationale: गीज़ अपूर्ण क्रिया वर्तमान या भविष्य का भाव दे सकती है; यहाँ बीती घटनाओं की स्मृति की ओर संकेत होने के कारण वर्तमान काल अधिक स्वाभाविक है।
- source_word: መኰንን፡ መስተማ
  choice: प्रधान मस्तेमा
  rationale: መኰንን पदाधिकारी अथवा शासक के अर्थ में है; ‘प्रधान’ सहज हिंदी में पदवी को व्यक्त करता है, जबकि मस्तेमा व्यक्तिनाम के रूप में लिप्यंतरित है।
- source_word: ትገብእ፡ ግብጸ
  choice: तुम मिस्र लौट रहे थे
  rationale: ገብአ का मूल अर्थ ‘लौटना’ है और कथा-संदर्भ में मूसा का मिस्र वापस जाना अभिप्रेत है।
- source_word: ይግበር፡ ምስሌከ
  choice: तुम्हारे साथ क्या करना चाहता था
  rationale: ምስሌከ का निकट अर्थ ‘तुम्हारे साथ’ है; इससे स्रोत का कथन बना रहता है और अनावश्यक रूप से ‘तुम्हारे विरुद्ध’ नहीं जोड़ा जाता।
theological_decisions:
- issue: मस्तेमा की पदवी
  choice: प्रधान मस्तेमा
  alternative: राजकुमार मस्तेमा
  rationale: स्रोत-पद መኰንን को किसी विशिष्ट वंशगत राजपद तक सीमित किए बिना अधिकार-सूचक पदवी के रूप में प्रस्तुत किया गया है।
- issue: ज्ञानसूचक क्रिया का काल
  choice: तुम जानते हो
  alternative: तुम जानोगे
  rationale: स्रोत दोनों संभावनाओं की अनुमति देता है, पर प्रसंग मूसा के मौजूदा ज्ञान या स्मरण को संबोधित करता है; वैकल्पिक काल पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। कालगणना के तकनीकी शब्द ‘जुबली’ को अर्थ-स्पष्टता के लिए ‘जुबली-वर्ष’ कहा गया है; वास्तविक भाषिक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
