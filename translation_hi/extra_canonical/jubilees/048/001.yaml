base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/001.yaml
  text: And in the sixth year of the third week of the forty-ninth jubilee[1], you departed and lived in the land of Midian for five weeks of years and one year, and you returned to Egypt in the second week, in the second year, in the fiftieth jubilee.
translation:
  language: hi
  text: और उनचासवीं जुबली के तीसरे सप्ताह के छठे वर्ष में तुम चले गए और मिद्यान देश में पाँच वर्ष-सप्ताह और एक वर्ष तक रहे[a]; फिर पचासवीं जुबली के दूसरे सप्ताह के दूसरे वर्ष में तुम मिस्र लौट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ की कालगणना संक्षिप्त और कुछ कठिन है। यहाँ ‘पाँच सप्ताह और एक वर्ष’ है; प्रसंग में ये सात-सात वर्षों वाले सप्ताह हैं।
    reason: segmentation_note
lexical_decisions:
- source_word: ኢዮቤልውሳት
  choice: जुबली-वर्ष
  rationale: यह शब्द पुस्तक की उनचास-वर्षीय कालगणना की इकाई को दर्शाता है। ‘जुबली-वर्ष’ आधुनिक हिन्दी पाठक के लिए पहचाने जाने योग्य है और इसे सामान्य उत्सव या वर्षगाँठ समझे जाने से बचाता है।
- source_word: ሱባዔ
  choice: सप्ताह / वर्ष-सप्ताह
  rationale: तिथि-सूत्र में ‘सप्ताह’ रखा गया है; निवास की अवधि में प्रसंगानुसार सात वर्षों की इकाई स्पष्ट करने के लिए ‘वर्ष-सप्ताह’ चुना गया है।
- source_word: ሖርከ
  choice: तुम चले गए
  rationale: द्वितीय पुरुष एकवचन क्रिया और प्रस्थान के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ነበርከ
  choice: रहे
  rationale: यहाँ क्रिया किसी स्थान में निवास करने या ठहरे रहने की अवधि बताती है; ‘रहे’ सहज और पर्याप्त व्यापक है।
- source_word: ገባእከ
  choice: तुम ... लौट आए
  rationale: ገብአ इस प्रसंग में वापस आने का अर्थ देता है; मूसा पहले मिस्र में रह चुका था, इसलिए केवल ‘प्रवेश किया’ की अपेक्षा ‘लौट आए’ अधिक सटीक है।
theological_decisions:
- issue: जुबली और सप्ताहों की कालगणना
  choice: स्रोत के सभी काल-सूचक पदों को उसी क्रम और तनाव सहित बनाए रखा गया है।
  alternative: गणना को आधुनिक वर्षों में बदल देना या कठिन तिथि-सूत्र को सरल कर देना।
  rationale: पुस्तक की धर्मवैचारिक और साहित्यिक संरचना उसकी जुबली-आधारित कालगणना से जुड़ी है; अनुवाद में उसे चुपचाप समतल नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। कालगणना की तकनीकी प्रकृति बनाए रखने के लिए ‘जुबली-वर्ष’ और ‘वर्ष-सप्ताह’ का प्रयोग किया गया है; कठिनाई को मुख्य पाठ में मिटाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
