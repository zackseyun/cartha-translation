  text: And they shall be eighty days in all. And when she had completed these eighty days, we brought her into the garden of Eden, for it is holier than all the earth, and every tree that is planted in it is holy.
translation:
  language: hi
  text: कुल मिलाकर अस्सी दिन होंगे। जब उसने ये अस्सी दिन पूरे कर लिए, तब हम उसे अदन की वाटिका में ले आए, क्योंकि वह सारी पृथ्वी से अधिक पवित्र है, और उसमें लगाया गया हर पेड़ पवित्र है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎን፡ ሰማንያ፡ መዋዕለ
  choice: कुल मिलाकर अस्सी दिन
  rationale: यह पद के आरम्भिक वाक्य की संपूर्ण अवधि को सहज आधुनिक हिन्दी में व्यक्त करता है और छूटे हुए पहले वाक्य को पुनः स्थापित करता है।
- source_word: አባእናሃ
  choice: हम उसे ... ले आए
  rationale: क्रिया के प्रथम पुरुष बहुवचन और स्त्रीलिंग कर्म को स्पष्ट रखते हुए स्वाभाविक कथात्मक हिन्दी दी गई है।
- source_word: ገነት፡ ኤዶም
  choice: अदन की वाटिका
  rationale: ‘वाटिका’ पवित्रशास्त्रीय गरिमा बनाए रखती है और ገነት के बाग/उद्यान अर्थ को व्यक्त करती है।
- source_word: ቅድስት፡ ይእቲ፡ እምኵሉ፡ ምድር
  choice: वह सारी पृथ्वी से अधिक पवित्र है
  rationale: तुलनात्मक अर्थ को किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के बिना सुरक्षित रखा गया है।
- source_word: ኵሉ፡ ዕፀ፡ ዘትከል
  choice: उसमें लगाया गया हर पेड़
  rationale: स्रोत के ‘हर पेड़ जो लगाया गया’ को हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है; स्थानसूचक संबंध प्रसंग से स्पष्ट किया गया है।
theological_decisions:
- issue: ‘हम’ की पहचान
  choice: प्रथम पुरुष बहुवचन ‘हम’ को यथावत रखा गया
  alternative: वक्ताओं को स्वर्गदूत या किसी अन्य समूह के रूप में स्पष्ट करना
  rationale: पद स्वयं वक्ताओं की पहचान नहीं बताता; उसे स्पष्ट करना अनावश्यक धर्मवैज्ञानिक निष्कर्ष होता।
- issue: अदन की पवित्रता का तुलनात्मक कथन
  choice: ‘सारी पृथ्वी से अधिक पवित्र’
  alternative: ‘पृथ्वी का सबसे पवित्र स्थान’
  rationale: चुना गया रूप मूल के प्रत्यक्ष तुलनात्मक कथन को बनाए रखता है और उसे स्थान-संबंधी परिभाषा में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। कालक्रम स्पष्ट करने के लिए ‘जब ... पूरे कर लिए, तब ... ले आए’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
