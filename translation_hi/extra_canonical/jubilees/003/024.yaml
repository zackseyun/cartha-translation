  text: And to Adam also he said, “Because you listened to the voice of your wife and ate from that tree from which I commanded you not to eat, cursed shall the ground be on your account. It shall produce thorns and thistles for you, and you shall eat your bread by the sweat of your face until you return to the ground from which you were taken; for you are earth, and to the earth you shall return.”
translation:
  language: hi
  text: और आदम से भी उसने कहा, “क्योंकि तूने अपनी पत्नी की बात मानी और उस वृक्ष से खाया, जिसके बारे में मैंने तुझे आज्ञा दी थी कि उसमें से न खाना, इसलिए तेरे कारण भूमि शापित होगी। वह तेरे लिए काँटे और ऊँटकटारे उगाएगी, और तू अपने माथे के पसीने से अपनी वनस्पति खाएगा, जब तक कि उस मिट्टी में लौट न जाए जिससे तुझे लिया गया था; क्योंकि तू मिट्टी है और मिट्टी में ही लौट जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ ብእሲትከ
  choice: अपनी पत्नी की बात
  rationale: शाब्दिक अर्थ ‘अपनी पत्नी की आवाज़’ है; आधुनिक हिन्दी में किसी की बात मानने के अर्थ में ‘पत्नी की बात’ अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
- source_word: ርገምት፡ ትኩን፡ ምድር፡ በእንቲአከ
  choice: तेरे कारण भूमि शापित होगी
  rationale: कारणसूचक वाक्यांश और भूमि पर आए शाप—दोनों को स्पष्ट रखते हुए स्रोत की संरचना के निकट है।
- source_word: እከዋከ፡ ወአሜካሳ
  choice: काँटे और ऊँटकटारे
  rationale: दो अलग प्रकार के कँटीले पौधों का युग्म बनाए रखा गया है; ‘ऊँटकटारे’ आधुनिक हिन्दी में thistles के लिए समझने योग्य शब्द है।
- source_word: በሐፈ፡ ገጽከ
  choice: अपने माथे का पसीना बहाकर
  rationale: स्रोत का शाब्दिक भाव ‘अपने मुख के पसीने में’ है; हिन्दी का यह मुहावरा परिश्रम और पसीने दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ምድር
  choice: भूमि / मिट्टी
  rationale: शाप के संदर्भ में ‘भूमि’ और मनुष्य की उत्पत्ति व वापसी के संदर्भ में ‘मिट्टी’ स्वाभाविक हिन्दी है; दोनों स्रोत के एक ही व्यापक शब्दार्थ-क्षेत्र को व्यक्त करते हैं।
theological_decisions:
- issue: आदम के दोष का कारण
  choice: पत्नी की बात मानने और निषिद्ध वृक्ष से खाने—दोनों को स्पष्ट कारणों के रूप में रखा गया
  alternative: केवल निषिद्ध फल खाने को प्रमुख बनाना
  rationale: स्रोत दोनों बातों को सीधे जोड़ता है; अनुवाद किसी एक को कम या अधिक करके व्याख्यात्मक तनाव को नहीं मिटाता।
- issue: मनुष्य और मिट्टी की समानता
  choice: ‘तू मिट्टी है और मिट्टी में ही लौट जाएगा’
  alternative: ‘तू धूल है और धूल में लौट जाएगा’
  rationale: गीज़ पाठ में प्रयुक्त शब्द ‘भूमि/धरती’ है; ‘मिट्टी’ उत्पत्ति और वापसी के संबंध को सहज रूप से बनाए रखता है, बिना पाठ में ‘धूल’ जोड़ने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ईश्वरीय संबोधन में एकवचन ‘तू/तुझे’ रखा गया है, जो प्राचीन प्रत्यक्ष वचन की निकटता और गंभीरता बनाए रखता है।
