  text: And on that day on which Adam went out from the garden[a], he burned incense as a sweet fragrance—frankincense, galbanum, stacte, and spices—in the morning with the rising of the sun, from the day when he covered his shame.
translation:
  language: hi
  text: और जिस दिन आदम अदन की वाटिका से बाहर निकला, उस दिन उसने भोर में, सूर्योदय के समय, मधुर सुगंध के लिए लोबान, गलबानम, स्तक्ते और सुगंध-द्रव्य जलाए—उस दिन से जब उसने अपनी लज्जा ढकी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सुगंधित पदार्थों की इस सूची के कुछ शब्द पाठ और अर्थ की दृष्टि से कठिन हैं। समग्र आशय यह है कि आदम ने अपनी लज्जा ढकने के बाद सूर्योदय के समय सुगंधित धूप जलाई।
    reason: textual_variant
lexical_decisions:
- source_word: ገነት፡ ኤዶም
  choice: वाटिका
  rationale: पद में स्थान का संकेत स्पष्ट है; स्वाभाविक हिन्दी के लिए 'वाटिका' चुना गया, जबकि इसी अध्याय के व्यापक संदर्भ में यह अदन की वाटिका है।
- source_word: ዐጠነ
  choice: धूप ... जलाए
  rationale: क्रिया धूप अथवा सुगंधित पदार्थ जलाने का बोध देती है; हिन्दी में यही सहज और अनुष्ठानिक अर्थ स्पष्ट करता है।
- source_word: መዐዛ፡ ሠናይ
  choice: सुगंधित धूप के रूप में
  rationale: शाब्दिक अर्थ 'अच्छी/मधुर सुगंध' है; वाक्य में धूपार्पण का आशय बनाए रखते हुए स्वाभाविक हिन्दी दी गई।
- source_word: ዕጣነ፡ ስኂነ፡ ወቀንአተ፡ ወማየ፡ ልብን፡ ወሰንበለ
  choice: लोबान, गंधरस, सुगंधित राल और सुगंध-द्रव्य
  rationale: सुगंधित पदार्थों की सूची पांडुलिपीय और शब्दार्थगत रूप से कठिन है; जहाँ पहचान अपेक्षाकृत संभव है वहाँ प्रचलित नाम और जहाँ अनिश्चित है वहाँ व्यापक वर्णन रखा गया।
- source_word: በጽባሕ፡ ምስለ፡ ትንሣኤ፡ ፀሐይ
  choice: भोर को सूर्योदय के समय
  rationale: मूल के काल-सूचक पदबंध को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኀፍረቶ
  choice: अपनी लज्जा
  rationale: शब्द नग्नता से जुड़ी लज्जाजनक देहावस्था/अंग को इंगित कर सकता है; 'लज्जा' मूल की संक्षिप्तता और अर्थ-व्याप्ति बनाए रखता है।
theological_decisions:
- issue: आदम के कार्य को औपचारिक बलिदान या वेदी-उपासना कहना
  choice: केवल सुगंधित धूप जलाने का वर्णन
  alternative: धूप-बलि चढ़ाई / वेदी पर अर्पित की
  rationale: मूल में धूप जलाने का कार्य है, पर इस पद में वेदी अथवा विधिवत बलिदान स्पष्ट नहीं; अतः अतिरिक्त उपासना-विधान नहीं जोड़ा गया।
- issue: अंतिम काल-वाक्यांश का संबंध
  choice: मूल की असहजता को बनाए रखते हुए इसे समय-संबंधी वाक्यांश रखा
  alternative: इसे निश्चित रूप से उसी सुबह या निष्कासन के कारण से जोड़ना
  rationale: ‘उस दिन से जब उसने अपनी लज्जा ढकी थी’ का वाक्य-संबंध अस्पष्ट है; अनुवाद ने इसे चुपचाप निर्णीत नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘वाटिका’, ‘लोबान’ और ‘सुगंधित राल’ जैसे शब्द प्रसंग की प्राचीनता बनाए रखते हैं, पर दुर्बोध तकनीकी पहचान थोपने से बचते हैं।
