  text: And the woman saw the tree, that it was delightful[a] and pleasing to the eye, and its fruit was good for food, and she took from it and ate.
translation:
  language: hi
  text: और स्त्री ने देखा कि वह वृक्ष मनोहर[a] और आँखों को भानेवाला था, और उसका फल खाने के लिए अच्छा था; तब उसने उसमें से लिया और खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ गीइज़ शब्द አዳም (ʾaddām) ‘आदम’ नाम नहीं, बल्कि ‘मनभावन’ या ‘मनोहर’ अर्थ वाला विशेषण है।
    reason: lexical_choice
lexical_decisions:
- source_word: አዳም
  choice: मनोहर
  rationale: यहाँ यह आदम का व्यक्तिवाचक नाम नहीं, बल्कि वृक्ष के सौंदर्य या आकर्षण को व्यक्त करने वाला विशेषण है। ‘मनोहर’ इस अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ያሠምር፡ ለዐይን
  choice: आँखों को भानेवाला
  rationale: यह पदबंध दृष्टि को सुखद या प्रिय लगने का भाव देता है; हिन्दी में यह सहज और मूल के निकट है।
- source_word: ለበሊዕ
  choice: खाने के लिए
  rationale: प्रसंग में यह फल की खाद्य-उपयुक्तता बताता है और उत्पत्ति-वृत्तांत से जुड़े वाक्य-विन्यास को भी सुरक्षित रखता है।
- source_word: ወነሥአት፡ እምኔሁ፡ ወበልዐት
  choice: तब उसने उसमें से लिया और खाया
  rationale: क्रियाओं के क्रम को स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
