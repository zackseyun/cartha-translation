base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/001.yaml
  text: 'And during the six days of the second week we brought to Adam, by the word of the Lord, all the beasts, and all the livestock, and all the birds, and everything that moves on the earth, and everything that moves in the waters, according to their kinds and according to their forms: the beasts on the first day, the livestock on the second day, the birds on the third day, and everything that moves on the earth on the fourth day, and what moves in the waters on the fifth day.'
translation:
  language: hi
  text: 'और दूसरे सप्ताह के छह दिनों के दौरान हम प्रभु के वचन के अनुसार आदम के पास सभी वन-पशुओं, सभी पालतू पशुओं, सभी पक्षियों, पृथ्वी पर चलने-फिरनेवाले हर प्राणी और जल में चलने-फिरनेवाले हर प्राणी को उनकी-अपनी जातियों और रूपों के अनुसार ले आए: वन-पशुओं को पहले दिन, पालतू पशुओं को दूसरे दिन, पक्षियों को तीसरे दिन, पृथ्वी पर चलने-फिरनेवाले हर प्राणी को चौथे दिन, और जल में चलने-फिरनेवाले हर प्राणी को पाँचवें दिन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰዱስ፡ መዋዕል
  choice: छह दिनों के दौरान
  rationale: गीज़ पदबंध का अर्थ ‘छह दिनों में/के दौरान’ है; आगे की गतिविधियाँ अनेक दिनों में बाँटी गई हैं।
- source_word: አራዊተ
  choice: वन-पशु
  rationale: इसे अगली श्रेणी እንስሳ से अलग रखते हुए जंगली पशुओं का अर्थ व्यक्त किया गया है।
- source_word: እንስሳ
  choice: पालतू पशु
  rationale: वन-पशुओं से भिन्न घरेलू या मनुष्य द्वारा पाले जाने वाले पशुओं की व्यापक श्रेणी के लिए स्वाभाविक हिन्दी।
- source_word: በቃለ፡ እግዚአብሔር
  choice: प्रभु के वचन से
  rationale: ‘वचन’ स्रोत के ‘शब्द/वचन’ को औपचारिक रूप से बनाए रखता है और दैवी आदेश के भाव को भी खुला रखता है।
- source_word: በበ፡ ዘመዶሙ፡ ወበበ፡ አምሳሎሙ
  choice: उनकी जाति और उनके रूप के अनुसार
  rationale: दोनों समानांतर स्रोत-संज्ञाओं—जातिगत वर्ग और बाहरी रूप—को अलग-अलग सुरक्षित रखा गया है।
- source_word: ዘይትነወስ / ዘይትሐወስ
  choice: चलने-फिरनेवाला
  rationale: व्यापक गतिशीलता का भाव व्यक्त करता है और अर्थ को केवल ‘रेंगने’ तक सीमित नहीं करता।
theological_decisions:
- issue: वक्ता का बहुवचन ‘हम’
  choice: हम ... ले आए
  alternative: वे ... ले आए
  rationale: स्रोत का प्रथम पुरुष बहुवचन ज्यों का त्यों रखा गया है; वक्ताओं की पहचान व्याख्यात्मक रूप से नहीं जोड़ी गई।
- issue: छह दिनों की अवधि, पर पाँच दिनों की सूची
  choice: आरंभ में ‘छह दिनों के दौरान’ और आगे पाँच दिनों की सूची दोनों सुरक्षित रखे
  alternative: आरंभ को ‘दूसरे दिन’ करना या सूची में छठा दिन जोड़ना
  rationale: स्रोत-पाठ में उपस्थित तनाव को बिना सामंजस्य बैठाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पशु-श्रेणियों के बीच स्रोत का भेद स्पष्ट किया गया है और अनावश्यक धर्म-सांप्रदायिक शब्दावली से बचा गया है।
