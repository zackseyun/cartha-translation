translation:
  language: hi
  text: …अपनी सृष्टि की भूमि में एक थे। और आदम ने अपनी पत्नी का नाम हव्वा रखा, और उनके पास कोई… नहीं था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त गीइज़ पाठ आरम्भ और अन्त—दोनों ओर से अधूरा है; इसलिए यहाँ दीर्घविराम लगाए गए हैं। अन्तिम शब्दों का शाब्दिक भाव ‘और वे नहीं थे…’ भी हो सकता है।
    reason: खंडित और सम्भवतः पद-सीमा पार करते स्रोत-पाठ की अनिश्चितता बताने के लिए।
lexical_decisions:
- source_word: አሐዱ
  choice: एक थे
  rationale: इसका मूल अर्थ ‘एक’ है; खंडित वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘थे’ जोड़ा गया है।
- source_word: ምድረ፡ ፍጥረቶሙ
  choice: अपनी सृष्टि की भूमि में
  rationale: शाब्दिक आशय ‘उनकी सृष्टि की भूमि’ है; हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपनी’ स्वाभाविक है।
- source_word: ወሰመያ፡ አዳም፡ ስመ፡ ብእሲቱ፡ ሔዋ
  choice: और आदम ने अपनी पत्नी का नाम हव्वा रखा
  rationale: नाम देने की प्रचलित गीइज़ अभिव्यक्ति को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: ወአኮኑ
  choice: और उनके कोई… नहीं थे
  rationale: पाठ यहीं अधूरा समाप्त होता है। उपलब्ध अंग्रेज़ी परामर्श-पाठ के अनुसार अभाव का भाव रखा गया है, पर लुप्त पूरक को अनुमान से नहीं भरा गया।
theological_decisions:
- issue: ‘एक’ होने का आशय
  choice: ‘एक थे’ को बिना व्याख्या के रखा गया
  alternative: इसे वैवाहिक ‘एक देह’ के रूप में स्पष्ट करना
  rationale: स्रोत केवल ‘एक’ कहता है; किसी विशिष्ट धर्मवैज्ञानिक अर्थ को जोड़ना मूल की अस्पष्टता मिटा देता।
- issue: अंतिम अपूर्ण कथन
  choice: रिक्ति को दीर्घविराम से दिखाया गया
  alternative: अनुमान से ‘सन्तान’ या कोई अन्य संज्ञा जोड़ना
  rationale: प्रदत्त गीइज़ अंश पूरक संज्ञा से पहले समाप्त हो जाता है, इसलिए अर्थ को चुपचाप पूरा करना स्रोत-साक्ष्य से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हव्वा’ हिन्दी बाइबिल परम्परा में प्रचलित नामरूप है। पाठ के खंडित स्वरूप को ठीक करने या वाक्यांशों का क्रम बदलने के बजाय दृश्य रूप से सुरक्षित रखा गया है।
