lexical_decisions:
- source_word: ይትፈጸማ እላንቱ መዋዕል
  choice: वे दिन पूरे न हो जाएँ
  rationale: क्रिया का भाव दिनों की निर्धारित अवधि पूरी होने का है; हिंदी में यह सहज और स्रोत-संगत है।
- source_word: ለተባዕት ወለአንስት
  choice: बालक और बालिका के लिए
  rationale: प्रसंग जन्म के बाद की अवधि से संबंधित है, इसलिए शाब्दिक ‘नर और मादा’ की अपेक्षा मनुष्यों के लिए स्वाभाविक ‘बालक और बालिका’ चुना गया। ወ का अर्थ यहाँ ‘और’ है, ‘या’ नहीं।
- source_word: ሕግ ወስምዕ
  choice: व्यवस्था और साक्षी
  rationale: दोनों संज्ञाओं को अलग रखते हुए उनके विधिक और प्रमाणात्मक अर्थ सुरक्षित रखे गए हैं।
- source_word: ዘተጽሕፈ
  choice: जो लिखी गई थी
  rationale: स्रोत के लिखे जाने संबंधी निष्क्रिय भूतकालीन भाव को बनाए रखा गया है।
theological_decisions:
- issue: ‘व्यवस्था और साक्षी’ के संबंध की व्याख्या
  choice: दोनों पदों को समन्वित संज्ञाओं के रूप में रखा गया
  alternative: इसे ‘साक्ष्य देने वाली व्यवस्था’ जैसे एक संयुक्त विचार में बदलना
  rationale: स्रोत का ወ (‘और’) दोनों अवधारणाओं को जोड़ता है; उन्हें एक-दूसरे में मिला देना मूल की संभावित विधिक-धार्मिक तनाव और भिन्नता को अनावश्यक रूप से समाप्त कर देता।
