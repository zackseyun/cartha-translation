  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। जन्म-संबंधी प्रसंग के कारण ‘बालक और बालिका’ प्रयोग किया गया है; वाक्य में स्रोत से बाहर की कोई सामग्री नहीं जोड़ी गई।
