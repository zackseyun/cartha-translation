base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/004.yaml
  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
translation:
  language: hi
  text: और प्रभु ने हमसे कहा, “मनुष्य का अकेला रहना अच्छा नहीं है; हम उसके लिए उसी के समान एक सहायक बनाएँ।” तब प्रभु, हमारे परमेश्वर ने उस पर गहरी नींद डाली, और वह सो गया। उसने स्त्री के लिए उसकी हड्डियों में से एक हड्डी ली; और वही पसली उसकी हड्डियों में से स्त्री की रचना का मूल थी।[a] फिर उसने उसकी जगह मांस बनाया और स्त्री की रचना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसी से स्त्री की रचना हुई।”
    reason: गीज़ वाक्यांश पसली और स्त्री की रचना/उत्पत्ति के संबंध को संक्षेप में व्यक्त करता है; यह वैकल्पिक पाठ उसी अर्थ को अधिक मुहावरेदार हिन्दी में देता है।
lexical_decisions:
- source_word: ብእሲ
  choice: मनुष्य
  rationale: यहाँ शब्द आदम के लिए पुरुष मानव को सूचित करता है; आधुनिक हिन्दी में ‘मनुष्य’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: መርዳእ፡ ዘከማሁ
  choice: उसी के समान एक सहायक
  rationale: ‘सहायक’ सहायता करने वाले व्यक्ति का अर्थ रखता है, जबकि ‘उसी के समान’ स्रोत के अनुरूपता/सादृश्य के भाव को बिना अधिक व्याख्या के बनाए रखता है।
- source_word: ህድመተ
  choice: गहरी नींद
  rationale: यह साधारण निद्रा से अधिक गहन, ईश्वर द्वारा लाई गई नींद को व्यक्त करता है।
- source_word: ዐጽመ፡ አሐደ
  choice: एक हड्डी
  rationale: स्रोत पहले सामान्य शब्द ‘हड्डी’ का प्रयोग करता है; इसलिए इसे तुरंत ‘पसली’ बनाकर विशिष्ट नहीं किया गया।
- source_word: ገቦ
  choice: पसली
  rationale: अगले वाक्यांश में स्रोत विशिष्ट रूप से पार्श्व की हड्डी/पसली का उल्लेख करता है, इसलिए ‘पसली’ चुना गया।
- source_word: ፍጥረት
  choice: रचना का मूल
  rationale: शब्द ‘रचना/सृष्टि’ का भाव देता है; इस वाक्य में ‘मूल’ जोड़ने से स्रोत का ‘वही पसली स्त्री की रचना थी/का उद्गम थी’ वाला असामान्य किंतु अर्थपूर्ण कथन स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ሐነጸ
  choice: बनाया / रचना की
  rationale: मूल क्रिया का शाब्दिक भाव ‘निर्माण करना’ है। मांस के साथ ‘बनाया’ और स्त्री के साथ ‘रचना की’ हिन्दी में स्वाभाविक रहते हुए निर्माण-रूपक को बनाए रखते हैं।
theological_decisions:
- issue: ‘हम’ का संदर्भ
  choice: “हमसे कहा” और “हम ... बनाएँ” को यथावत रखा गया
  alternative: ‘स्वर्गदूतों से कहा’ या त्रिएकता-संबंधी कोई स्पष्ट व्याख्या
  rationale: स्रोत स्वयं श्रोताओं अथवा बहुवचन के धर्मवैज्ञानिक संदर्भ की व्याख्या नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई।
- issue: सहायक की समानता
  choice: “उसी के समान एक सहायक”
  alternative: “उसके योग्य सहायक” या “उसकी पूरक सहायक”
  rationale: वैकल्पिक रूप स्रोत में निहित संबंध को अधिक निश्चित कर देते; चुना हुआ पाठ सादृश्य के सीधे भाव को रखता है।
- issue: हड्डी और पसली का क्रम
  choice: पहले ‘एक हड्डी’, फिर ‘वही पसली’
  alternative: दोनों स्थानों पर केवल ‘पसली’
  rationale: स्रोत की शब्दगत प्रगति को बनाए रखा गया है और बाद के विशिष्ट ‘पसली’ को छोड़ा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘हमसे’ और ‘हम ... बनाएँ’ जैसे मूल के तनावपूर्ण बहुवचन को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है। ‘हड्डी’ और ‘पसली’ के स्रोतगत भेद तथा ‘रचना का मूल’ वाले असामान्य कथन को बनाए रखते हुए पादटिप्पणी में अधिक स्वाभाविक विकल्प दिया गया है।
