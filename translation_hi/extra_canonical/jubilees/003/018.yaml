  text: …of the garden God commanded you, saying, ‘Do not eat from it.’ And she said to him, “From all the fruit of the trees of the garden God said to us, ‘Eat’; but from the fruit of the tree that is in the middle of the garden,”
translation:
  language: hi
  text: “…बगीचे के विषय में परमेश्वर ने तुम्हें यह आज्ञा दी थी, ‘उसमें से मत खाना।’” और उसने उससे कहा, “परमेश्वर ने हमसे कहा था, ‘बगीचे के सभी पेड़ों के फल खाओ’; परन्तु उस पेड़ के फल के विषय में जो बगीचे के बीच में है…”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገነት (ganat)
  choice: बगीचा
  rationale: यह सामान्य पाठकों के लिए स्वाभाविक शब्द है और अदन के उद्यान के संदर्भ को स्पष्ट रखता है।
- source_word: አዘዘክሙ (ʾazzazakəmu)
  choice: तुम्हें यह आज्ञा दी थी
  rationale: क्रिया के आदेश देने के अर्थ और बहुवचन संबोधन को सुरक्षित रखा गया है।
- source_word: ኢትብልዑ፡ እምኔሁ
  choice: उसमें से मत खाना
  rationale: निषेध और स्रोत में प्रयुक्त एकवचन संदर्भ दोनों को सीधे व्यक्त करता है।
- source_word: ወትቤሎ
  choice: तब स्त्री ने उससे कहा
  rationale: स्त्रीलिंग कर्ता और पुल्लिंग कर्म को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है; कथानक-संबंधी ‘तब’ संयोजक का सहज रूप है।
- source_word: ብልዑ
  choice: खाओ
  rationale: स्रोत के सकारात्मक बहुवचन आदेश को आज्ञार्थक रूप में बनाए रखा गया है।
- source_word: ዘማእከለ፡ ገነት
  choice: जो बगीचे के बीच में है
  rationale: स्थान-संबंधी वाक्यांश का निकट और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: स्त्री के कथन में परमेश्वर की आज्ञा का स्वरूप
  choice: ‘बगीचे के सभी पेड़ों के फल खाओ’
  alternative: ‘तुम बगीचे के सभी पेड़ों के फल खा सकते हो’
  rationale: स्रोत में आज्ञार्थक ‘खाओ’ है; अनुमति के रूप में बदलने से कथन का व्याकरणिक बल कम हो जाता।
- issue: बीच के पेड़ से पहले संबंधसूचक अव्यय
  choice: परन्तु
  alternative: और
  rationale: गीज़ में संयोजक का शाब्दिक रूप ‘और’ हो सकता है, किंतु वर्जित पेड़ के साथ स्पष्ट विरोध-संबंध है; आधुनिक हिन्दी में ‘परन्तु’ अर्थगत प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। आरम्भ और अन्त में दीर्घविराम लगाए गए हैं क्योंकि उपलब्ध गीज़ अंश पिछले वाक्य के बीच से आरम्भ होता और स्त्री के कथन के बीच में समाप्त होता है। उद्धरण-चिह्नों से वक्ताओं और भीतर उद्धृत परमेश्वर-वचन को अलग रखा गया है।
