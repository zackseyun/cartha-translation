base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/019.yaml
  text: God said to us, ‘Do not eat from it, and do not touch it, lest you die.’” And the serpent said to the woman, “You will not surely die, for God knows that on the day you eat from it, your eyes will be opened, and you will be like gods, and you will know good.”
translation:
  language: hi
  text: परमेश्वर ने हमसे कहा, “उसमें से मत खाना और उसे मत छूना, कहीं ऐसा न हो कि तुम मर जाओ।” तब धरती का सर्प स्त्री से बोला, “तुम हरगिज़ नहीं मरोगी, क्योंकि परमेश्वर जानता है कि जिस दिन तुम उसमें से खाओगी, तुम्हारी आँखें खुल जाएँगी, और तुम देवताओं के समान हो जाओगी और भले को जानोगी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो भला है, उसे जानोगी।”
    reason: गीज़ ሠናየ विशेषण ‘भला/अच्छा’ का संज्ञात्मक प्रयोग भी हो सकता है; हिन्दी में ‘भले को’ और ‘जो भला है’ दोनों इस अर्थ को व्यक्त करते हैं।
lexical_decisions:
- source_word: እግዚአብሔር
  choice: परमेश्वर
  rationale: गीज़ में ईश्वर के लिए प्रयुक्त मानक पद का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: አርዌ፡ ምድር
  choice: धरती का सर्प
  rationale: दोनों स्रोत-शब्दों—‘सर्प’ और ‘धरती/भूमि’—को बनाए रखता है, यद्यपि हिन्दी में केवल ‘सर्प’ अधिक सामान्य होता।
- source_word: አማልክት
  choice: देवताओं
  rationale: स्रोत का रूप बहुवचन है; उसे एकवचन ‘परमेश्वर’ बनाकर संभावित अर्थगत तनाव को नहीं मिटाया गया।
- source_word: ወታአምሩ
  choice: और ... जानोगी
  rationale: यह finite बहुवचन क्रिया है, कृदंत नहीं; स्त्री को संबोधित प्रत्यक्ष वचन होने के कारण स्वाभाविक हिन्दी में स्त्रीलिंग एकवचन प्रयुक्त है।
- source_word: ሠናየ
  choice: भलाई
  rationale: स्रोत में केवल ‘भला/अच्छा’ है; परिचित ‘भले और बुरे’ को जोड़ना स्रोत से आगे जाना होता।
theological_decisions:
- issue: ‘देवताओं के समान’ बनाम ‘परमेश्वर के समान’
  choice: देवताओं के समान
  alternative: परमेश्वर के समान
  rationale: गीज़ አማልክት स्पष्ट रूप से बहुवचन है; धार्मिक परिचितता के लिए इसे एकवचन करना स्रोत की वास्तविक अभिव्यक्ति को बदल देता।
- issue: ज्ञान की वस्तु
  choice: भलाई को जानोगी
  alternative: भले और बुरे को जानोगी
  rationale: इस गीज़ पाठ में केवल ሠናየ (‘भला/अच्छा’) है; ‘बुरा’ जोड़ना समानांतर उत्पत्ति-पाठ से आयात होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्त्री से सीधे संबोधन के कारण ‘मरोगी’, ‘खाओगी’, ‘जानोगी’ जैसे स्त्रीलिंग रूप आए हैं। ‘हरगिज़ नहीं’ स्रोत के प्रबल निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
