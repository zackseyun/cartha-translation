  yaml_path: translation/extra_canonical/jubilees/003/023.yaml
  text: And the Lord cursed the serpent and was angry with it forever. And he was also angry with the woman, because she listened to the voice of the serpent and ate; and he said to her, “I will greatly multiply your sorrow and your pain; in sorrow you shall bear children, and your desire shall be for your husband, and he will rule over you.”
translation:
  language: hi
  text: और प्रभु ने साँप को शाप दिया और उस पर सदा के लिए क्रोधित हुआ। वह स्त्री पर भी क्रोधित हुआ, क्योंकि उसने साँप की बात सुनी और खाया था। उसने स्त्री से कहा, “मैं तुम्हारे दुःख और तुम्हारी पीड़ा को बहुत बढ़ाऊँगा। दुःख में तुम बच्चों को जन्म दोगी; तुम्हारा लौटना अपने पति की ओर होगा[a], और वह तुम पर शासन करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी वापसी अपने पति की ओर होगी।” कुछ अनुवाद इसे “तुम्हारी इच्छा अपने पति के लिए होगी” कहते हैं।
    reason: गीज़ पाठ की शब्दावली और प्रचलित वैकल्पिक अर्थ—दोनों को पारदर्शी रूप से दिखाने के लिए।
lexical_decisions:
- source_word: አርዌ፡ ምድር
  choice: साँप
  rationale: शाब्दिक रूप से ‘धरती का सरीसृप/साँप’; इस प्रसंग में स्वाभाविक और स्पष्ट हिन्दी ‘साँप’ है।
- source_word: ተምዕዓ
  choice: क्रोधित हुआ
  rationale: यहाँ स्त्री के प्रति दैवी रोष व्यक्त है; समानांतर अंग्रेज़ी परामर्श-पाठ और प्रसंग भी इसी अर्थ का समर्थन करते हैं।
- source_word: ኀዘንኪ፡ ወለፃዕርኪ
  choice: तुम्हारे दुःख और तुम्हारी पीड़ा
  rationale: दोनों स्रोत-संज्ञाओं के अलग-अलग भाव को बनाए रखते हुए सहज आधुनिक हिन्दी दी गई है।
- source_word: ኀበ፡ ምትኪ፡ ምግባእኪ
  choice: तुम्हारा लौटना अपने पति की ओर होगा
  rationale: गीज़ पाठ में ‘लौटना/वापसी’ का भाव स्पष्ट है; इसे ‘इच्छा’ बनाकर मूल की वास्तविक शाब्दिक अनिश्चितता को चुपचाप हल नहीं किया गया।
- source_word: ይኴንነኪ
  choice: वह तुम पर शासन करेगा
  rationale: क्रिया अधिकार अथवा प्रभुत्व चलाने का अर्थ देती है; ‘शासन करेगा’ कथन की कठोरता को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: पति की ओर ‘लौटना’ बनाम पति के लिए ‘इच्छा’
  choice: मुख्य पाठ में ‘तुम्हारा लौटना अपने पति की ओर होगा’
  alternative: ‘तुम्हारी इच्छा अपने पति के लिए होगी’
  rationale: प्राथमिक गीज़ पाठ में वापसी/लौटने की संज्ञा है। परिचित उत्पत्ति-पाठ और कुछ व्याख्यात्मक अनुवाद ‘इच्छा’ देते हैं, इसलिए उसे पादटिप्पणी में रखा गया है, मुख्य पाठ में नहीं।
- issue: ‘वह तुम पर शासन करेगा’ का स्वरूप
  choice: इसे दैवी कथन के रूप में यथावत रखा गया
  alternative: इसे आदेश, आदर्श या सार्वकालिक वैवाहिक विधान के रूप में विस्तार देना
  rationale: स्रोत केवल कथन करता है; अनुवाद यह तय नहीं करता कि वाक्य वर्णन, परिणाम, भविष्यवाणी या आदर्श विधान है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप रखा गया है। ‘प्रभु’, ‘शाप’, ‘क्रोधित’, और ‘शासन’ जैसे शब्द स्रोत की गंभीरता बनाए रखते हैं; वाक्य-विन्यास को अनावश्यक रूप से पुरातन नहीं बनाया गया।
