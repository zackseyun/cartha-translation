  text: And he recognized her and said to her, “This now is bone from my bones and flesh from my flesh. This one shall be called my woman, because she was taken from her man.”
translation:
  language: hi
  text: उसने उसे पहचान लिया[a] और उससे कहा, “यह अब मेरी हड्डियों में से हड्डी और मेरे मांस में से मांस है। यह ‘नारी’ कहलाएगी, क्योंकि यह ‘नर’ से निकाली गई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसे जान लिया।”
    reason: स्रोत-क्रिया का अधिक शाब्दिक अनुवाद सुरक्षित रखने के लिए; आधुनिक हिन्दी में इससे यौन अर्थ भी ग्रहण किया जा सकता है।
lexical_decisions:
- source_word: ወአእመራ (wa-ʾaʿmerā)
  choice: उसने उसे पहचान लिया
  rationale: यहाँ क्रिया का अर्थ आदम द्वारा जागने पर स्त्री को पहचानना है। केवल ‘जान लिया’ आधुनिक हिन्दी में यौन संबंध का अनचाहा संकेत दे सकता है, जबकि इस प्रसंग में वह अर्थ अभिप्रेत नहीं है।
- source_word: ብእሲትየ / ብእሲሃ (bəʾəsitye / bəʾəsiha)
  choice: ‘नारी’ / ‘नर’
  rationale: स्रोत में ‘स्त्री’ और ‘पुरुष’ के निकट शब्द-संबंध को हिन्दी के स्वाभाविक ‘नारी/नर’ शब्द-युग्म से सुरक्षित रखा गया है।
- source_word: ዐጽም፡ እምዐጽምየ፡ ወሥጋ፡ እምሥጋየ
  choice: मेरी हड्डियों की हड्डी और मेरे मांस का मांस
  rationale: स्रोत की काव्यात्मक समानांतर रचना और अंग-संबंधी रूपक को औपचारिक निकटता के साथ रखा गया है।
theological_decisions:
- issue: ‘पहचानना/जानना’ क्रिया का संभावित यौन अर्थ
  choice: मुख्य पाठ में ‘पहचान लिया’
  alternative: ‘जान लिया’
  rationale: कथा-क्रम में यह स्त्री की उत्पत्ति पहचानने का क्षण है; यौन संबंध बाद में आता है। इसलिए मुख्य पाठ अनचाहे अर्थ को टालता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘नारी/नर’ का चयन मूल के स्त्री–पुरुष शब्द-संबंध को सुनाई देता है; उद्धरण-चिह्न इस शब्द-क्रीड़ा को स्पष्ट करते हैं।
