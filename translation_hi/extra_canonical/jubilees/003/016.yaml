base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/016.yaml
  text: And we gave him work, and we instructed him to do everything suitable for cultivation. And he was cultivating, and he was naked and did not know it, and was not ashamed, and he kept the garden from the birds and from the beasts and from the cattle, and gathered its fruit and ate, and set aside the remainder for himself.
translation:
  language: hi
  text: और हमने उसे काम दिया और खेती के लिए उपयुक्त हर काम करना सिखाया।[a] वह खेती करता था। वह नंगा था, और उसे पता नहीं था कि वह नंगा था, और वह लज्जित नहीं था। वह पक्षियों, जंगली पशुओं और पालतू पशुओं से बगीचे की रखवाली करता, उसके फल इकट्ठे करके खाता और जो बचता उसे अपने लिए रख लेता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे हर बात की शिक्षा दी।”
    reason: वाक्यांश को ‘उपयुक्त हर काम करना सिखाया’ अथवा अधिक सामान्य रूप से ‘हर बात की शिक्षा दी’ समझा जा सकता है; पाठ की अभिव्यक्तिगत अस्पष्टता सुरक्षित रखी गई है।
lexical_decisions:
- source_word: ምግባረ
  choice: काम
  rationale: यहाँ संज्ञा के रूप में आदम को सौंपे गए कार्य का संकेत है; ‘काम’ सरल और स्वाभाविक हिन्दी है।
- source_word: ገቢሮተ፡ ኵሉ፡ ዘይስተርኢ፡ ለቅኔ
  choice: खेती के लिए उपयुक्त हर काम करना
  rationale: ገቢሮተ के ‘करना’ भाव को स्पष्ट रखा गया है और शेष वाक्यांश को संदर्भानुसार खेती के योग्य कार्य के रूप में प्रस्तुत किया गया है।
- source_word: ይትቀነይ
  choice: खेती करता था
  rationale: इस प्रसंग में श्रम या सेवा का भाव विशेष रूप से बगीचे की खेती से जुड़ा है।
- source_word: ዕራቁ
  choice: नंगा
  rationale: स्रोत का सीधा अर्थ; आधुनिक सामान्य हिन्दी में स्वाभाविक और स्पष्ट।
- source_word: አዕዋፍ፡ ... አራዊት፡ ... እንስሳ
  choice: पक्षियों, जंगली पशुओं और पालतू पशुओं
  rationale: तीनों प्राणी-वर्गों का भेद बनाए रखा गया है; अंतिम पद को घरेलू/पालतू पशुओं के अर्थ में लिया गया है।
- source_word: ያነብር፡ ተረፎ፡ ሎቱ
  choice: जो बचता उसे अपने लिए रख लेता था
  rationale: अंतिम ሎቱ (‘अपने लिए/उसके लिए’) को स्पष्ट रूप से व्यक्त करते हुए अपूर्ण भूतकालीन क्रम बनाए रखा गया है।
theological_decisions:
- issue: आदम का अपने नंगेपन से अनजान होना
  choice: उसे इसका ज्ञान नहीं था और वह लज्जित नहीं होता था
  alternative: वह इसे नहीं पहचानता था और लज्जित नहीं था
  rationale: स्रोत के ‘नहीं जानता था’ और ‘लज्जित नहीं होता था’—दोनों कथनों को बिना उनका आपसी संबंध धर्मवैज्ञानिक रूप से समझाए अलग-अलग सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘खेती करता था’, ‘रखवाली करता’ और ‘रख लेता था’ से जारी/अभ्यस्त क्रियाओं का भाव व्यक्त किया गया है।
