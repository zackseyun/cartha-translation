  rationale: ‘गेन्नत’ वाटिका/उद्यान और ‘एदोम’ यहाँ प्रचलित बाइबिलीय स्थाननाम अदन है; सामान्य हिंदी पाठक के लिए स्वाभाविक रूप रखा गया।
- source_word: ምድረ፡ ፍጥረቶሙ
  choice: उसी देश में जहाँ उनकी सृष्टि हुई थी
  rationale: शाब्दिक अर्थ ‘उनकी सृष्टि का देश’ है; हिंदी में संबंध को स्वाभाविक और अर्थ-सटीक उपवाक्य से व्यक्त किया गया।
