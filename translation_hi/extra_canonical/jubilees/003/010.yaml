base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/010.yaml
  text: 'Therefore the commandment was written on the heavenly tablets concerning her who gives birth: if she bears a male, she shall remain in her uncleanness seven days, according to the first seven days, and thirty-three days she shall remain in the blood of purification; she shall touch nothing holy, and she shall not enter the sanctuary until she completes these days for a male child.'
translation:
  language: hi
  text: 'इस कारण स्वर्गीय पट्टिकाओं पर जन्म देनेवाली स्त्री के विषय में यह आज्ञा लिखी गई: यदि वह पुत्र को जन्म दे, तो वह पहले सात दिनों के समान सात दिन अपनी अशुद्धता में रहेगी; और तैंतीस दिन वह शुद्धिकरण के रक्त में रहेगी। वह किसी पवित्र वस्तु को न छुए और पवित्रस्थान में प्रवेश न करे, जब तक पुत्र के लिए ठहराए गए ये दिन पूरे न हो जाएँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाएँ
  rationale: शाब्दिक अर्थ ‘स्वर्ग की पट्टिकाएँ’ है; ‘स्वर्गीय पट्टिकाएँ’ हिन्दी में स्वाभाविक रहते हुए ग्रंथ की विशिष्ट धारणा सुरक्षित रखता है।
- source_word: ተባዕተ
  choice: पुत्र
  rationale: यहाँ जन्मे हुए नर शिशु का संदर्भ है; विधिक प्रसंग में ‘पुत्र’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: ርኵሳ
  choice: अशुद्धता
  rationale: यह नैतिक दोष नहीं, प्रसवोत्तर अनुष्ठानिक अशुद्धता की स्थिति है; इसलिए तटस्थ विधिक शब्द चुना गया।
- source_word: ደመ፡ ንጽሓ
  choice: शुद्धिकरण का रक्त
  rationale: स्रोत की विशिष्ट और कुछ असामान्य विधिक अभिव्यक्ति को बिना व्याख्यात्मक रूप से सरल किए सुरक्षित रखा गया।
- source_word: መቅደስ
  choice: पवित्रस्थान
  rationale: यह पवित्र परिसर अथवा sanctuary को सूचित करता है; ‘पवित्रस्थान’ अर्थ को खुला रखता है और बाद के किसी विशेष स्थापत्य को आरोपित नहीं करता।
theological_decisions:
- issue: प्रसवोत्तर अशुद्धता का स्वरूप
  choice: ‘अपनी अशुद्धता में रहेगी’ के रूप में अनुष्ठानिक स्थिति व्यक्त की गई
  alternative: ‘अपवित्र रहेगी’
  rationale: ‘अपवित्र’ नैतिक या आध्यात्मिक दोष का आभास दे सकता है, जबकि प्रसंग विधिक और अनुष्ठानिक शुद्धता का है।
- issue: अंतिम समय-सीमा
  choice: ‘जब तक पुत्र के लिए ठहराए गए ये दिन पूरे न हो जाएँ’
  alternative: अंतिम उपवाक्य छोड़ देना
  rationale: गीज़ स्रोत में पुरुष शिशु से संबंधित दिनों की समाप्ति तक पवित्रस्थान में प्रवेश निषिद्ध होने का अंतिम उपवाक्य स्पष्ट रूप से मौजूद है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण विधिक-कथात्मक रजिस्टर रखा गया है। स्रोत की ‘पहले सात दिनों के समान’ और ‘शुद्धिकरण के रक्त’ जैसी विशिष्ट अभिव्यक्तियाँ संरक्षित हैं; वाक्य-विन्यास पाठनीय बनाने के लिए स्वाभाविक हिन्दी क्रम अपनाया गया है।
