translation:
  language: hi
  text: और परमेश्वर ने आदम को उसकी नींद से जगाया। जब आदम जागा, तब वह छठे दिन उठा, और परमेश्वर उस स्त्री को उसके पास ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነቅሆ … እምነዋሙ
  choice: उसे उसकी नींद से जगाया
  rationale: क्रिया और ‘नींद से’ के स्रोतगत अर्थ को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ተንሥአ
  choice: उठा
  rationale: यहाँ क्रिया जागने के बाद उठ खड़े होने को व्यक्त करती है; संक्षिप्त ‘उठा’ प्रसंग के अनुकूल है।
- source_word: በዕለት፡ ሣድስት
  choice: छठे दिन
  rationale: स्रोत के काल-सूचक पद का सीधा और स्वाभाविक अनुवाद।
- source_word: አብጽሓ፡ ኀቤሁ
  choice: उस स्त्री को उसके पास ले आया
  rationale: क्रिया का अर्थ किसी को सामने/पास लाना है। स्त्री का स्पष्ट उल्लेख हिन्दी में सर्वनाम-संदेह घटाता है।
theological_decisions:
- issue: अंतिम क्रिया ‘ले आया’ का कर्ता
  choice: परमेश्वर को स्पष्ट कर्ता बनाया गया
  alternative: सिर्फ ‘वह उसे उसके पास ले आया’ कहकर सर्वनामगत अस्पष्टता बनाए रखना
  rationale: 'स्रोत में निकटवर्ती वाक्यों के कर्ता बदलते हैं: आदम जागकर उठता है, जबकि स्त्री को आदम के पास लाने वाला प्रसंगानुसार प्रभु परमेश्वर है। हिन्दी में केवल सर्वनाम रखने पर अर्थ यह निकल सकता है कि आदम स्त्री को अपने ही पास लाया; इसलिए संदर्भ में निहित कर्ता को स्पष्ट किया गया है।'
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘आदम’ और ‘परमेश्वर’ जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट बनाया गया है।
