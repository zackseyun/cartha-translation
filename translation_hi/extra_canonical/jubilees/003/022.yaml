base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/022.yaml
  text: And he ate, and his eyes were opened, and he saw that he was naked. And he took fig leaves and sewed them and made himself a covering, and covered his shame.
translation:
  language: hi
  text: और उसने खाया; तब उसकी आँखें खुल गईं और उसने देखा कि वह नंगा है। उसने अंजीर के पत्ते लेकर उन्हें सी दिया, अपने लिए कमर का आवरण बनाया और अपनी लज्जा ढक ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበልዐ
  choice: और उसने खाया
  rationale: क्रिया के आरंभिक उपवाक्य को स्पष्ट रूप से रखा गया है; कर्ता आदम है, जैसा निकटवर्ती संदर्भ और अंग्रेज़ी परामर्श-पाठ दर्शाते हैं।
- source_word: ተርኅወ፡ አዕይንቲሁ
  choice: उसकी आँखें खुल गईं
  rationale: मूल के पारंपरिक और स्वाभाविक रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: ቈጽለ፡ በለስ
  choice: अंजीर के पत्ते
  rationale: दोनों संज्ञाओं का सीधा और आधुनिक हिन्दी में सहज अनुवाद।
- source_word: ምርአ
  choice: कमर का आवरण
  rationale: यह शब्द शरीर ढकने के लिए बनाए गए लपेटने योग्य आवरण को सूचित करता है; केवल सामान्य 'वस्त्र' की अपेक्षा यह प्रसंगानुकूल और अधिक विशिष्ट है।
- source_word: ኀፍረቶ
  choice: अपनी लज्जा
  rationale: मूल शब्द नग्नता से जुड़ी लज्जा अथवा लज्जास्थान का संकेत दे सकता है; हिन्दी में 'अपनी लज्जा ढक ली' इस अर्थ-विस्तार को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: आँखें खुलने का अर्थ
  choice: मूल रूपक 'उसकी आँखें खुल गईं' को ज्यों का त्यों रखा
  alternative: उसे भले-बुरे का ज्ञान हो गया
  rationale: पद स्वयं ऐसी व्याख्या स्पष्ट नहीं करता; व्याख्यात्मक धर्मवैज्ञानिक निष्कर्ष जोड़ने से मूल की संक्षिप्तता और तनाव समाप्त हो जाता।
- issue: लज्जा और नग्नता का संबंध
  choice: '''वह नंगा है'' और ''अपनी लज्जा ढक ली'' दोनों अलग अभिव्यक्तियाँ रखीं'
  alternative: दोनों स्थानों पर केवल 'नंगापन' कहना
  rationale: मूल पहले शारीरिक नग्नता और फिर उससे जुड़ी लज्जा को अलग शब्दों में व्यक्त करता है; इस भेद को बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। वाक्य-संरचना मूल के क्रम के निकट है, पर प्रवाह के लिए दूसरे उपवाक्य में 'तब' जोड़ा गया है।
