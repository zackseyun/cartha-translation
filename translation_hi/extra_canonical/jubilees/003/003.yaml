  yaml_path: translation/extra_canonical/jubilees/003/003.yaml
  text: And during these five days Adam saw them[a], male and female, of every kind that was on the earth, but he was alone, and no helper like him was found for him.
translation:
  language: hi
  text: इन पाँच दिनों के दौरान आदम ने पृथ्वी पर हर प्रकार के नर और मादा जीवों को देखा[a], पर वह अकेला था, और उसके अनुरूप कोई सहायक उसके लिए नहीं मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में पद-संख्या 2 के बाद सीधे 4 आती है; फिर भी प्रसंग का आशय स्पष्ट है कि इन पाँच दिनों के दौरान आदम ने जीवों को नर और मादा के रूप में देखा और अपने अनुरूप कोई सहायक नहीं पाया।
    reason: segmentation_note
lexical_decisions:
- source_word: ዘይረድኦ፡ ዘከማሁ
  choice: उसके अनुरूप कोई सहायक
  rationale: वाक्यांश में सहायता करनेवाले और आदम के समान/अनुरूप होने—दोनों भाव हैं। ‘उसके अनुरूप’ मूल की तुलना को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: በበ፡ ዘመዶሙ / male and female (reconstructed missing row)
  choice: हर प्रकार के जीवों को नर और मादा के रूप में
  rationale: लुप्त पंक्ति का आशय आसपास के सृष्टि-वर्णन और प्रमाणित परामर्श-पाठ से स्पष्ट होता है; ‘हर प्रकार’ जाति/प्रकार के वितरण को व्यक्त करता है।
theological_decisions:
- issue: आदम के लिए सहायक का स्वरूप
  choice: ‘उसके अनुरूप कोई सहायक’—समानता/अनुकूलता का भाव खुला रखा गया
  alternative: ‘उसके समान कोई सहायक’ या ‘उसके योग्य कोई सहायक’
  rationale: मूल अभिव्यक्ति समानता और अनुरूपता दोनों का संकेत दे सकती है। ‘योग्य’ पदानुक्रम का अनावश्यक अर्थ ला सकता है, जबकि ‘अनुरूप’ बिना सांप्रदायिक व्याख्या के संबंधपरक उपयुक्तता व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘नर और मादा’, ‘हर प्रकार के जीव’ और ‘उसके अनुरूप कोई सहायक’ सामान्य पाठक के लिए स्पष्ट हैं तथा मूल की अर्थगत अनिश्चितता को अनावश्यक रूप से नहीं सुलझाते।
