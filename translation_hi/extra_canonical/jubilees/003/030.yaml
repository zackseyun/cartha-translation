  text: Therefore it was commanded on the heavenly tablets concerning all those who know the judgment of the law, that they should cover their shame and should not uncover themselves as the nations uncover themselves.
translation:
  language: hi
  text: 'इस कारण स्वर्गीय पट्टिकाओं पर उन सभी के विषय में यह आज्ञा दी गई जो व्यवस्था का न्याय जानते हैं: वे अपनी लज्जा ढकें और अपने को वैसे अनावृत न करें जैसे अन्यजातियाँ अपने को अनावृत करती हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: गीज़ पदबंध का सीधा और जुबिली ग्रंथ की विशिष्ट संकल्पना के अनुरूप रूपांतरण।
- source_word: ፍትሐ፡ ሕግ
  choice: व्यवस्था का न्याय
  rationale: ‘न्याय/निर्णय’ और ‘व्यवस्था’ दोनों घटकों को बनाए रखता है; इसे केवल ‘व्यवस्था’ या ‘विधि’ बनाकर निहित तनाव को नहीं मिटाता।
- source_word: ኀፍረቶሙ
  choice: अपनी लज्जा
  rationale: मूल शब्द लज्जा तथा लज्जास्थान दोनों की ओर संकेत कर सकता है; शाब्दिक ‘लज्जा’ इस अर्थ-विस्तार को सुरक्षित रखता है।
- source_word: አሕዛብ
  choice: अन्यजातियाँ
  rationale: यहाँ इस्राएल से बाहर की जातियों/राष्ट्रों के सामूहिक धार्मिक-सांस्कृतिक अर्थ को व्यक्त करता है।
- source_word: ይትከሠቱ
  choice: अपने को उघाड़ा करें
  rationale: मूल की अनावृत होने/अपने को खोलने की क्रिया को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘व्यवस्था का न्याय’ का आशय
  choice: अर्थ को ‘व्यवस्था का न्याय’ के रूप में खुला रखा गया
  alternative: ‘व्यवस्था का विधान’ या ‘धर्मशास्त्र का निर्णय’
  rationale: मूल ፍትሐ፡ ሕግ में न्यायिक और विधिक दोनों आयाम हैं; किसी एक व्यवस्थित धार्मिक अर्थ में सीमित करना उचित नहीं।
- issue: शारीरिक नग्नता और नैतिक लज्जा का संबंध
  choice: ‘अपनी लज्जा ढकें’
  alternative: ‘अपने गुप्तांग ढकें’
  rationale: मूल की मर्यादित अभिव्यक्ति और उसकी अर्थगत द्व्यर्थता को बनाए रखा गया है; अधिक शारीरिक रूप से स्पष्ट अनुवाद मूल से संकरा होता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘पट्टिकाओं’, ‘व्यवस्था’, और ‘अन्यजातियाँ’ जैसे शब्द ग्रंथ के प्राचीन धार्मिक परिवेश को बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट रखा गया है।
