  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: hi
  text: 'इसलिए जो स्त्री पुत्र या पुत्री को जन्म देती है, उसके लिए इन दिनों की विधि ठहराई गई: वह किसी पवित्र वस्तु को न छुए और पवित्रस्थान में प्रवेश न करे, जब तक कि—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተዝ
  choice: इसलिए
  rationale: पूर्ववर्ती कथन से निष्कर्ष या आधार-संबंध व्यक्त करने वाले गीइज़ पद का स्वाभाविक हिन्दी प्रतिरूप।
- source_word: ተሠርዐ
  choice: ठहराई गई
  rationale: विधि के निर्धारित या नियत किए जाने का निष्क्रिय भाव सुरक्षित रखता है।
- source_word: ለእኅተ፡ ትውልድ፡ ለተባዕት፡ ወለአንስት
  choice: जो स्त्री पुत्र या पुत्री को जन्म देती है, उसके लिए
  rationale: जन्म देने वाली स्त्री तथा नर या मादा संतान के स्रोतार्थ को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है; मनुष्य-संतान के संदर्भ में ‘पुत्र या पुत्री’ स्वाभाविक है।
- source_word: ፍትሖን
  choice: विधि
  rationale: नियत धार्मिक-कानूनी व्यवस्था के अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: ኵሎ፡ ቅዱሰ፡ ኢትልከፍ
  choice: वह किसी पवित्र वस्तु को न छुए
  rationale: निषेध और ‘सब/कोई पवित्र [वस्तु]’ के अर्थ को सहज हिन्दी में सुरक्षित करता है।
- source_word: ውስተ፡ መቅደስ፡ ኢትባእ
  choice: पवित्रस्थान में प्रवेश न करे
  rationale: मंदिर अथवा पवित्र क्षेत्र के लिए पारंपरिक किंतु बोधगम्य शब्द और प्रवेश-निषेध का स्पष्ट अनुवाद।
- source_word: እስከ፡ አመ
  choice: जब तक कि—
  rationale: स्रोत पद अगले अंश में पूरा होता है; डैश अपूर्ण कालवाचक उपवाक्य को ईमानदारी से दर्शाता है।
theological_decisions:
- issue: प्रसूति-संबंधी पवित्रता की विधि का वर्णन
  choice: पाठ को धार्मिक विधि के रूप में बिना व्याख्यात्मक विस्तार के प्रस्तुत किया गया।
  alternative: इसे नैतिक अशुद्धता या केवल अनुष्ठानिक अशुद्धता कहकर स्पष्ट करना।
  rationale: इस अंश में ऐसा विशेषण नहीं है; किसी धार्मिक परंपरा की व्याख्या आरोपित करने से बचते हुए तनाव और संदर्भ को खुला रखा गया।
- issue: ‘पवित्र’ का कर्म
  choice: ‘पवित्र वस्तु’
  alternative: ‘पवित्र भोजन’ या ‘पवित्र चीज़’
  rationale: स्रोत व्यापक है; ‘भोजन’ अर्थ को अनावश्यक रूप से सीमित करता, जबकि ‘वस्तु’ गरिमापूर्ण और पर्याप्त रूप से व्यापक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण धार्मिक-कानूनी शैली। पद के अंत की स्रोतगत अपूर्णता को ‘जब तक कि—’ द्वारा बनाए रखा गया है।
