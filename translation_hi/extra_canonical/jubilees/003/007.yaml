  text: Therefore a man and a woman shall be one, and therefore a man shall leave his father and his mother and join to his wife, and they shall become one flesh.
translation:
  language: hi
  text: इसी कारण पुरुष और स्त्री एक हों; और इसी कारण पुरुष अपने पिता और अपनी माता को छोड़कर अपनी पत्नी से जुड़ जाए, और वे एक देह हो जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተዝ (baʾənta-zə)
  choice: इसी कारण
  rationale: कारणसूचक पद को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा मूल में इसकी पुनरावृत्ति को बनाए रखता है।
- source_word: ይኩኑ / ይኩን (yəkunnu / yəkun)
  choice: हों / हो जाए
  rationale: मूल के इच्छार्थक-विध्यर्थक भाव को हिन्दी के संभावनार्थक रूप से सुरक्षित रखा गया है।
- source_word: የኀድግ (yaḫaddəg)
  choice: छोड़कर
  rationale: पिता और माता से संबंध के प्रसंग में मूल क्रिया ‘छोड़ना’ का सीधा अर्थ देता है।
- source_word: ይጻመር (yəṣṣammar)
  choice: जुड़ जाए
  rationale: पत्नी के साथ दृढ़ संबंध में आने का भाव देता है, बिना ‘लिपटना’ या किसी विशिष्ट वैवाहिक व्याख्या को जोड़ने के।
- source_word: ሥጋ፡ አሐደ (śəga ʾaḥadu)
  choice: एक देह
  rationale: ‘मांस/शरीर’ के मूल रूपक को प्रचलित, गरिमापूर्ण बाइबलीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: आरंभिक कथन और विवाह-संबंधी कथन का विध्यर्थक स्वर
  choice: ‘एक हों’, ‘जुड़ जाए’ और ‘एक देह हो जाएँ’
  alternative: ‘एक होंगे’, ‘जुड़ा रहेगा’ और ‘एक देह होंगे’
  rationale: गीज़ क्रियारूपों के इच्छार्थक/विध्यर्थक तनाव को निश्चित भविष्यवाणी में बदलने के बजाय बनाए रखा गया है।
- issue: ‘एक’ होने और ‘एक देह’ होने का संबंध
  choice: दोनों कथनों को अलग रखते हुए मूल की पुनरावृत्ति बनाए रखी गई
  alternative: पहले कथन को दूसरे में मिला देना
  rationale: मूल पाठ पहले पुरुष और स्त्री के एक होने की बात कहता है और फिर माता-पिता को छोड़कर पत्नी से जुड़ने तथा एक देह होने की; अनुवाद इस संरचना को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। मूल की कारणसूचक पुनरावृत्ति और विध्यर्थक भाव को सुरक्षित रखा गया है।
