translation:
  language: hi
  text: परन्तु सभी जंगली और पालतू पशुओं में से केवल आदम को ही उसने अपनी लज्जा ढकने का साधन दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይክድን
  choice: ढकने
  rationale: क्रिया का सीधा अर्थ ‘ढकना’ है; प्रसंग में इसका आशय शरीर की लज्जा को आवृत करना है।
- source_word: ኀፍረቶ
  choice: अपनी लज्जा
  rationale: यह पद ‘उसकी लज्जा/नग्नता के लज्जाजनक अंग’ का भाव रखता है; आधुनिक, शालीन हिन्दी में ‘अपनी लज्जा’ स्रोत की संक्षिप्तता बनाए रखता है।
- source_word: እምኵሉ፡ አራዊት ወእንስሳ
  choice: सभी जंगली और पालतू पशुओं में से
  rationale: አራዊት और እንስሳ के भेद को क्रमशः जंगली और पालतू पशुओं के रूप में रखा गया है; እምኵሉ यहाँ आदम को अन्य प्राणियों से अलग दिखाता है।
- source_word: ወሀቦ
  choice: उसने ... क्षमता दी
  rationale: शाब्दिक रूप ‘उसने उसे दिया कि वह ढके’ हिन्दी में अस्वाभाविक है; ‘क्षमता दी’ आशय को स्वाभाविक रूप से व्यक्त करता है, बिना वस्त्र जैसी कोई अनुल्लिखित वस्तु जोड़ने के।
