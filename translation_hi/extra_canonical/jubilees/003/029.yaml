  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी अपनाई गई है। वाक्य में ‘सभी जंगली और पालतू पशुओं में से’ को ‘केवल आदम’ के निकट रखा गया है, ताकि स्रोत में निहित आदम और पशुओं का विरोध स्पष्ट रहे और पदबंध लटकता हुआ न लगे।
