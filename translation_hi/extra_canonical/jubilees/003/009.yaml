  yaml_path: translation/extra_canonical/jubilees/003/009.yaml
  text: And after forty days had been completed for Adam in the land where he had been created, we brought him into the garden of Eden, that he might till it and keep it; but his wife was brought in after eighty days, and after this she entered into the garden of Eden.
translation:
  language: hi
  text: और जिस भूमि पर आदम को रचा गया था, वहाँ उसके चालीस दिन पूरे होने पर हम उसे अदन के बाग़ में ले आए, ताकि वह उसकी खेती करे और उसकी देखभाल करे। पर उसकी पत्नी को अस्सी दिन बाद वहाँ लाया गया[a]; और इसके बाद वह अदन के बाग़ में प्रवेश कर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी पत्नी को वे अस्सी दिन बाद वहाँ लाए।”
    reason: मूल क्रिया का तृतीय पुरुष बहुवचन रूप शाब्दिक रूप से ‘वे लाए’ भी अनूदित हो सकता है, यद्यपि वह अनिर्दिष्ट कर्मवाच्य के अर्थ में प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: ተፈጥረ
  choice: सृष्टि हुई थी
  rationale: यह क्रिया आदम के रचे जाने को व्यक्त करती है; आधुनिक और गरिमापूर्ण हिन्दी में ‘सृष्टि हुई थी’ स्वाभाविक है।
- source_word: ገነት፡ ኤዶም
  choice: अदन का बाग़
  rationale: पारंपरिक बाइबलीय नाम ‘अदन’ रखते हुए ‘बाग़’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ይትቀነይ
  choice: उसकी खेती करे
  rationale: संदर्भ में बाग़ में श्रम/सेवा करने का अर्थ है; ‘खेती करे’ उत्पत्ति-वृत्तांत के कृषि-संदर्भ को सहज रूप देता है।
- source_word: ይዕቀባ
  choice: उसकी देखभाल करे
  rationale: मूल में रक्षा, निगरानी या संभालने का भाव है; ‘देखभाल करे’ इस अर्थ-परास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አብአ
  choice: वहाँ लाया गया
  rationale: तृतीय पुरुष बहुवचन रूप यहाँ अनिर्दिष्ट कर्ता वाले कर्मवाच्य के रूप में समझा जा सकता है; ‘वहाँ’ गंतव्य को प्रसंग से स्पष्ट करता है।
theological_decisions:
- issue: आदम और उसकी पत्नी को बाग़ में लाने वाले कर्ता की पहचान
  choice: आदम के लिए ‘हम’ रखा गया और पत्नी के लिए अनिर्दिष्ट कर्मवाच्य ‘लाया गया’ रखा गया
  alternative: दोनों स्थानों पर स्वर्गदूतों को स्पष्ट कर्ता बनाना, या पत्नी के लिए ‘वे लाए’ कहना
  rationale: मूल आदम के विषय में प्रथम पुरुष बहुवचन बोलता है, पर पत्नी के विषय में तृतीय पुरुष बहुवचन रूप देता है, जो गीइज़ में अनिर्दिष्ट कर्मवाच्य हो सकता है। अनावश्यक रूप से कर्ता की पहचान निश्चित नहीं की गई।
- issue: चालीस और अस्सी दिनों की गणना
  choice: दोनों अवधियों को क्रमशः आदम और उसकी पत्नी से संबंधित रखा गया
  alternative: अस्सी दिनों को आदम के चालीस दिनों के बाद की अतिरिक्त अवधि समझना
  rationale: मूल की समानांतर रचना और अगले पदों का शुद्धि-विधान पुरुष के लिए चालीस तथा स्त्री के लिए अस्सी दिनों को अलग-अलग संबद्ध करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘खेती करे और उसकी देखभाल करे’ मूल के दोहरे कार्य को बनाए रखता है।
