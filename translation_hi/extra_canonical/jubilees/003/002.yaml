  language: hi
  text: और आदम ने उन सबके नाम रखे, हर एक का अलग-अलग नाम; और उसने हर एक को जिस नाम से पुकारा, वही उसका नाम था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰመዮሙ፡ አዳም፡ ለኵሎሙ
  choice: और आदम ने उन सबका नाम रखा
  rationale: गीज़ वाक्यांश में आदम कर्ता है और ‘उन सबका नाम रखा’ समस्त प्राणियों को नाम देने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በበ፡ አስማቲሆሙ
  choice: हर एक का अपना नाम
  rationale: वितरणात्मक በበ का भाव ‘हर एक’ से और बहुवचन-संबंधित रूप का आशय ‘अपना नाम’ से स्पष्ट तथा सहज रूप में व्यक्त होता है।
- source_word: ወበከመ፡ …
  choice: और उसने उन्हें जैसा पुकारा, वैसा ही उनका नाम हो गया
  rationale: उपलब्ध गीज़ अंश आगे की तुलना का आरम्भ करता है; परामर्श-पाठ में सुरक्षित पूर्ण वाक्य के अनुरूप समानता की संरचना बनाए रखी गई है।
theological_decisions:
- issue: नामकरण के परिणाम का स्वरूप
  choice: वैसा ही उनका नाम हो गया
  alternative: वही उनका नाम था
  rationale: यह रूप नाम देने की प्रभावी क्रिया और परिणति को व्यक्त करता है, पर इससे किसी अतिरिक्त धर्मवैज्ञानिक सिद्धांत का निष्कर्ष नहीं निकाला जाता।
