  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
translation:
  language: hi
  text: अपने और अपनी पत्नी के लिए, जो रखा जाता था उसे इकट्ठा करके रखता था। वहाँ उसके सात वर्ष पूरे हो चुके थे—ठीक सात वर्ष—तब दूसरे महीने के सत्रहवें दिन[a] सर्प आया और स्त्री के पास पहुँचा। सर्प ने स्त्री से कहा, “क्या परमेश्वर ने कहा है, ‘तुम वाटिका के किसी भी वृक्ष में से मत खाना’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'तिथि ठीक-ठीक दी गई है: एदेन में सात पूरे वर्ष बीतने के बाद, दूसरे महीने का सत्रहवाँ दिन। जुबली ग्रंथ में ऐसी कालगणना उसकी प्रकाशनात्मक संरचना का नियमित अंग है।'
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓቱ / ሰብዓተ
  choice: सात / सात
  rationale: ये गीइज़ में लिखे हुए संख्या-शब्द ‘सात’ हैं। साथ दिखाई देने वाले ፳፮ और ፳፯ आलोचनात्मक संस्करण के टिप्पणी-संकेत हैं, पाठ की संख्याएँ नहीं।
- source_word: ጥንቁቀ
  choice: ठीक
  rationale: कालावधि की सटीकता और पूर्णता पर दिए गए बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አርዌ ምድር
  choice: सर्प
  rationale: शाब्दिक रूप से ‘पृथ्वी/भूमि का जीव’; प्रसंग और परंपरागत पहचान के अनुसार ‘सर्प’ स्वाभाविक और सटीक है।
- source_word: ቀርበ ኀበ ብእሲት
  choice: स्त्री के पास पहुँचा
  rationale: निकट आने की क्रिया और स्त्री की ओर उसकी दिशा, दोनों को स्पष्ट रखता है।
- source_word: እምኵሉ ዕፀ
  choice: किसी भी वृक्ष में से
  rationale: ‘हर/सभी वृक्षों में से’ वाले व्यापक निषेध की प्रश्नात्मक अर्थछाया को स्वाभाविक हिन्दी में रखता है और मूल में अनुपस्थित ‘फल’ शब्द नहीं जोड़ता।
theological_decisions:
- issue: सर्प के प्रश्न का व्यापक निषेध
  choice: ‘तुम वाटिका के किसी भी वृक्ष में से न खाना’
  alternative: ‘तुम वाटिका के हर वृक्ष में से न खाना’
  rationale: सर्प के प्रश्न की भ्रामक व्यापकता बनी रहती है; हिन्दी में ‘किसी भी ... न’ अधिक स्वाभाविक है, जबकि कथन को किसी विशेष धर्मवैज्ञानिक व्याख्या की ओर नहीं मोड़ा गया।
- issue: एदेन में बिताए वर्षों की संख्या
  choice: सात वर्ष—ठीक सात वर्ष
  alternative: छब्बीस वर्ष—ठीक सत्ताईस वर्ष
  rationale: मूल पाठ के शब्द ሰብዓቱ और ሰብዓተ दोनों ‘सात’ कहते हैं। ፳፮ और ፳፯ चार्ल्स संस्करण के आलोचनात्मक apparatus के संकेत हैं, कथानक की संख्याएँ नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। आरंभ पिछले वाक्य की निरंतरता है, इसलिए खंडात्मक प्रवाह बनाए रखा गया है। ‘वाटिका’ बाइबलीय प्रसंग के अनुकूल है; मूल में न होने के कारण ‘फल’ नहीं जोड़ा गया।
