base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/027.yaml
  text: And on that day the mouths of all the beasts and cattle and birds and whatever walks and whatever moves were closed from speech, for they all used to speak with one another, with one lip and one tongue.
translation:
  language: hi
  text: और उसी दिन सब जंगली पशुओं, पालतू पशुओं, पक्षियों, रेंगने वाले और चलने-फिरने वाले जीवों के मुँह से बोलना बंद हो गया, क्योंकि वे सब एक ही बोली और एक ही भाषा में आपस में बात करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊት፡ ወዘእንስሳ፡ ወዘአዕዋፍ
  choice: वन-पशुओं, पालतू पशुओं, पक्षियों
  rationale: गीज़ पाठ की तीन पशु-श्रेणियों—जंगली जीव, घरेलू/चौपाए पशु और पक्षी—का स्वाभाविक तथा भेद-संरक्षक हिन्दी रूप।
- source_word: ወዘያንሶሱ፡ ወዘይትሐወስ
  choice: रेंगनेवाले और चलने-फिरनेवाले जीवों
  rationale: दोनों गतिसूचक पदों का अंतर बनाए रखते हुए उन्हें आधुनिक हिन्दी में स्पष्ट किया गया है; ‘जीवों’ की पूर्ति संदर्भ से स्वाभाविक है।
- source_word: ተፈጽመ፡ አፈ ... እምነቢብ
  choice: मुँह बोलने से बंद कर दिए गए
  rationale: शाब्दिक अर्थ ‘उनका मुँह वाणी/बोलने से बंद हुआ’ को सहज हिन्दी कर्मवाच्य में रखा गया है।
- source_word: ዝንቱ፡ ምስለ፡ ዝንቱ
  choice: एक-दूसरे से
  rationale: गीज़ का मुहावरा ‘यह उसके साथ’ परस्पर संवाद का बोध कराता है; हिन्दी में ‘एक-दूसरे से’ उसका स्वाभाविक समतुल्य है।
- source_word: ክንፈረ፡ አሐደ፡ ወልሳነ፡ አሐደ
  choice: एक ही बोली और एक ही भाषा
  rationale: ‘एक होंठ और एक जीभ’ सामूहिक भाषिक एकता का मुहावरा है। ‘बोली’ और ‘भाषा’ मूल के दो समानांतर अंगों को पठनीय हिन्दी में सुरक्षित रखते हैं।
theological_decisions:
- issue: पशु-पक्षियों की पूर्वकालीन वाणी
  choice: कथन को सीधे ऐतिहासिक-वृत्तांत की शैली में रखा गया है
  alternative: इसे रूपक, लोककथा या केवल परस्पर संप्रेषण के रूप में समझाकर अनुवाद करना
  rationale: मूल पाठ स्पष्ट रूप से कहता है कि वे बोलते थे और उस दिन उनका बोलना बंद हुआ; अनुवाद में इस दावे को न तो कमजोर किया गया है, न उसकी अतिरिक्त व्याख्या की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘वन-पशु’ और ‘पालतू पशु’ सामान्य पाठक के लिए स्पष्ट हैं; वाक्य की पुनरुक्त संरचना मूल की व्यापकता और लय को बनाए रखती है।
