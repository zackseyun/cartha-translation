translation:
  language: hi
  text: जब तक वह बालक के लिए ये दिन पूरे न कर ले। लेकिन बालिका के लिए, वह अपनी अशुद्धता में, पहले दो सप्ताहों के समान, दो सप्ताह रहेगी; और छियासठ दिन वह अपने शुद्धिकरण के रक्त में रहेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰቡዓተ
  choice: सप्ताह
  rationale: यह शब्द सात दिनों की अवधि को दर्शाता है; शुद्धिकरण-विधि के इस संदर्भ में आधुनिक हिन्दी में ‘सप्ताह’ सबसे स्वाभाविक और सटीक है।
- source_word: ተባዕት / አንስት
  choice: बालक / बालिका
  rationale: प्रसव और शुद्धिकरण के संदर्भ में ये शब्द जन्मे हुए नर और मादा शिशु का संकेत देते हैं; ‘बालक/बालिका’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: በርኵሳ
  choice: अपनी अशुद्धता में
  rationale: मूल शब्द में स्त्रीलिंग एकवचन संबंधसूचक भाव है, इसलिए ‘अपनी’ को स्पष्ट रूप से रखा गया है।
- source_word: በደመ፡ ንጽሓ
  choice: अपने शुद्धिकरण के रक्त में
  rationale: ‘रक्त’ और ‘शुद्धिकरण’ दोनों की स्रोत-संरचना को बनाए रखते हुए स्त्रीलिंग संबंधसूचक भाव को ‘अपने’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘पहले दो सप्ताहों के समान’ वाक्यांश की संभावित अस्पष्टता
  choice: पहले दो सप्ताहों के समान
  alternative: पहले की अवधि के समान
  rationale: मूल में ‘दो सप्ताह’ और ‘पहले’ दोनों स्पष्ट हैं। संदर्भ के आधार पर इसे किसी विशिष्ट धार्मिक व्याख्या से बदलने के बजाय स्रोत की असामान्य किंतु वास्तविक अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। पद 12 से संबंधित ‘कुल अस्सी दिन’ वाला वाक्यांश नहीं जोड़ा गया है।
