  text: for food; and she took from it and ate. And she covered her shame with fig leaves first, and she gave to Adam, and he ate.
translation:
  language: hi
  text: खाने के लिए; और उसने उसमें से लेकर खाया। फिर उसने पहले अंजीर के पत्तों से अपनी लज्जा ढकी और आदम को दिया, और उसने खाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበሊዕ
  choice: खाने के लिए
  rationale: यह उद्देश्यसूचक पद है और उपलब्ध अंश पिछले वाक्य से जुड़ता है; इसलिए उसके खंडात्मक रूप को बनाए रखा गया है।
- source_word: እምኔሁ
  choice: उसमें से
  rationale: फल का नाम इस अंश में दोहराया नहीं गया है; सर्वनाम का सामान्य और स्वाभाविक हिन्दी रूप रखा गया है।
- source_word: ኀፍረታ
  choice: अपनी लज्जा
  rationale: मूल शब्द लज्जा या लज्जाजनक नग्नता का संकेत देता है। ‘अपनी लज्जा’ मूल की संक्षिप्तता और अर्थ-तनाव दोनों बनाए रखता है।
- source_word: በቈጽለ፡ በለስ
  choice: अंजीर के पत्तों से
  rationale: साधनसूचक पूर्वसर्ग और बहुवचन पत्तों को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ዘቀዳሚ
  choice: पहले
  rationale: 'इस पद का कालक्रमसूचक अर्थ लिया गया है: उसने आदम को देने से पहले अपनी लज्जा ढकी। इसे ‘भी’ के अर्थ में प्रस्तुत करना मूल से समर्थित नहीं है।'
theological_decisions:
- issue: आदम को देने से पहले स्त्री की क्रिया का क्रम
  choice: ‘पहले’ को लज्जा ढकने की क्रिया से जोड़ा गया
  alternative: ‘और उसने भी दिया’ या ‘पहले अंजीर के पत्ते’
  rationale: गीइज़ ዘቀዳሚ स्पष्ट रूप से ‘पहले’ का बोध कराता है और प्रसंग में क्रियाओं का क्रम सबसे सहज है; किसी अतिरिक्त ‘भी’ को जोड़ने का आधार नहीं है।
- issue: ‘लज्जा’ और ‘नग्नता’ के बीच चयन
  choice: लज्जा
  alternative: नग्नता
  rationale: मूल ኀፍረታ सीधे लज्जा/शर्म को व्यक्त करता है। ‘नग्नता’ प्रसंगगत व्याख्या है, इसलिए अधिक निकट शब्द ‘लज्जा’ रखा गया।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। आरंभिक अर्धविराम इसलिए रखा गया है कि उपलब्ध पद पिछले कथन से व्याकरणिक रूप से जुड़ा हुआ है। ‘फिर’ क्रम को सहज बनाता है, जबकि ‘पहले’ मूल के ዘቀዳሚ को स्पष्ट रूप से सुरक्षित रखता है। उपलब्ध उद्धृत गीइज़ अंश ‘और उसने दिया’ पर समाप्त होता है; ‘आदम को दिया, और उसने खाया’ को प्रदत्त, परीक्षित अंग्रेज़ी परामर्श-पाठ के आधार पर पद की पूर्णता के लिए रखा गया है।
