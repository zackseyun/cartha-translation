lexical_decisions:
- source_word: አልባሰ፡ ዘማዕስ
  choice: चमड़े के वस्त्र
  rationale: गीज़ पदबंध का सीधा अर्थ खाल या चमड़े से बने वस्त्र है; आधुनिक हिन्दी में “चमड़े के वस्त्र” स्वाभाविक और अर्थ-सटीक है।
- source_word: አልበሶሙ
  choice: उन्हें पहनाए
  rationale: क्रिया का कारक अर्थ है कि उसने वे वस्त्र उन्हें पहनाए; इससे मूल की क्रियात्मकता बनी रहती है।
- source_word: ፈነዎሙ
  choice: उन्हें ... बाहर भेज दिया
  rationale: मूल क्रिया भेजने या विदा करने का अर्थ देती है; प्रसंग में उद्यान से निष्कासन को बिना अतिरिक्त व्याख्या के व्यक्त करने हेतु यह चयन किया गया।
- source_word: ገነት፡ ኤዶም
  choice: अदन की वाटिका
  rationale: “वाटिका” ገነት के उद्यानार्थ को गरिमापूर्ण और परिचित बाइबलीय हिन्दी में व्यक्त करती है; ኤዶም को प्रचलित रूप “अदन” दिया गया है।
