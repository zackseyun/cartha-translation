base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/008.yaml
  text: In the first week Adam was created[a], and the rib—his wife—was made; and in the second week he showed her to him. Therefore the command was given to keep seven days for a male, and two weeks of days for a female, in impurity.
translation:
  language: hi
  text: पहले सप्ताह में आदम रचा गया[a], और आदम की पसली से उसकी पत्नी बनाई गई; दूसरे सप्ताह में परमेश्वर ने उसे आदम के सामने प्रस्तुत किया। इसी कारण यह आज्ञा दी गई कि पुरुष-शिशु के लिए अशुद्धता की अवस्था में सात दिन और स्त्री-शिशु के लिए दो सप्ताह रहा जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अध्याय आदम और स्त्री के अदन में देर से प्रवेश को बाद में पुरुष-शिशु और स्त्री-शिशु के जन्म पर मानी जाने वाली अशुद्धता की अवधियों से जोड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: ሳብዕት
  choice: सप्ताह
  rationale: मूल में ‘सात’ अथवा सात दिनों की अवधि है; प्रसंग और समानांतर अगली अवधि के आधार पर आधुनिक हिन्दी में ‘सप्ताह’ स्वाभाविक है।
- source_word: ገቦ
  choice: पसली
  rationale: शब्द का अर्थ ‘बगल/पार्श्व’ भी हो सकता है, पर इस सृष्टि-वर्णन में पसली अभिप्रेत है; वाक्य को स्पष्ट करने के लिए ‘वह पसली भी, जिससे उसकी पत्नी बनाई गई’ कहा गया है।
- source_word: አርአዮ ኪያሃ ሎቱ
  choice: परमेश्वर ने उसे आदम के सामने प्रस्तुत किया
  rationale: शाब्दिक अर्थ ‘उसने उसे उसको दिखाया’ है; हिन्दी में कर्ता और दोनों सर्वनामों की पहचान स्पष्ट करते हुए क्रिया का आशय रखा गया है।
- source_word: ርኵስን
  choice: अशुद्धता
  rationale: यह अनुष्ठानिक अशुद्धता की अवधि को व्यक्त करता है; ‘अशुद्धता’ धार्मिक-कानूनी संदर्भ में मानक और समझने योग्य शब्द है।
theological_decisions:
- issue: आदम और स्त्री की सृष्टि तथा बाद की प्रसवोत्तर अशुद्धता-अवधियों के बीच ग्रंथ का संबंध
  choice: ‘इसी कारण’ के साथ ग्रंथ द्वारा बताए गए कारणात्मक संबंध को बनाए रखा गया है।
  alternative: कारणात्मक संबंध को नरम करके केवल कालक्रम या तुलना के रूप में प्रस्तुत करना।
  rationale: मूल पाठ स्पष्टतः ‘इस कारण’ कहकर सृष्टि-क्रम को बालक और बालिका के लिए निर्धारित अशुद्धता-अवधियों का आधार बनाता है; अनुवाद को इस तनावपूर्ण धार्मिक तर्क को न तो हटाना चाहिए, न आधुनिक व्याख्या से बदलना चाहिए।
- issue: ‘नर’ और ‘मादा’ का आशय
  choice: प्रसव-संबंधी संदर्भ स्पष्ट करने के लिए ‘बालक’ और ‘बालिका’ चुना गया है।
  alternative: ‘पुरुष’ और ‘स्त्री’ अथवा ‘नर’ और ‘मादा’।
  rationale: आगे के पद जन्म के बाद की अशुद्धता की विधि बताते हैं; इसलिए यहाँ संतान का लिंग अभिप्रेत है। ‘बालक/बालिका’ आधुनिक हिन्दी में सबसे स्वाभाविक है और अवधि किस जन्म से संबंधित है, यह स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य रखा गया है। मूल की कारणात्मक संरचना और अनुष्ठानिक शब्दावली सुरक्षित हैं; अस्पष्ट सर्वनामों को पाठ के पात्रों के नाम देकर स्वाभाविक बनाया गया है।
