  text: And he sent out from the garden of Eden all flesh that was in the garden of Eden, and all flesh was scattered, each according to its kind and according to its form, to the places that had been created for them.
translation:
  language: hi
  text: और उसने अदन के बाग में रहनेवाले सभी प्राणियों को वहाँ से बाहर भेज दिया। तब सभी प्राणी अपनी-अपनी जाति और अपने-अपने स्वरूप के अनुसार उन स्थानों में फैल गए, जो उनके लिए बनाए गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ዘሥጋ
  choice: सभी प्राणी
  rationale: शाब्दिक अर्थ ‘सब मांस’ है, पर यहाँ बाग में रहनेवाले समस्त जीव-जगत का बोध है; आधुनिक हिन्दी में ‘सभी प्राणी’ स्वाभाविक और अर्थानुकूल है।
- source_word: ወተዘርዉ
  choice: फैल गए
  rationale: क्रिया बिखरने या अलग-अलग स्थानों में फैल जाने का भाव देती है; प्रसंग में जीवों के नियत आवासों की ओर वितरण को व्यक्त करती है।
- source_word: በበ፡ ዘመዶሙ
  choice: अपनी-अपनी जाति के अनुसार
  rationale: ዘመድ यहाँ जीवों के वर्ग या kind को सूचित करता है; ‘जाति’ सृष्टि-वर्णन की हिन्दी में परिचित और संक्षिप्त शब्द है।
- source_word: በበ፡ ፍጥረቶሙ
  choice: अपने-अपने स्वरूप के अनुसार
  rationale: ፍጥረት रचना, निर्मित प्रकृति या रूप का बोध करा सकता है; ‘स्वरूप’ इस व्यापकता को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ውስተ፡ መካን፡ ዘተፈጥረ፡ ሎሙ
  choice: उन स्थानों में, जो उनके लिए बनाए गए थे
  rationale: मूल के बहुवचन स्थान और उनके लिए पहले से निर्मित किए जाने—दोनों को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: प्राणियों को बाग से बाहर भेजने वाले कर्ता की पहचान
  choice: सर्वनाम ‘उसने’ बनाए रखा गया
  alternative: ‘परमेश्वर ने’
  rationale: इस पद के तत्काल मूल पाठ में कर्ता सर्वनाम से व्यक्त है। संदर्भ से परमेश्वर अभिप्रेत हो सकता है, पर अनुवाद में नाम जोड़कर मूल की अभिव्यक्ति को अधिक स्पष्ट नहीं किया गया।
- issue: ‘सब मांस’ का अर्थक्षेत्र
  choice: ‘सभी प्राणी’
  alternative: ‘सभी जीवधारी’ या शाब्दिक ‘सब मांस’
  rationale: यहाँ मनुष्यों समेत धार्मिक अर्थ में ‘समस्त देहधारी’ पर बल देने के बजाय बाग के जीवों के वितरण का वर्णन है; इसलिए सामान्य पाठक के लिए ‘प्राणी’ उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सहज रखी गई है। ‘वहाँ से’ संदर्भगत दिशा स्पष्ट करता है, जबकि दूसरी बार ‘अदन के बाग’ दोहराने की जगह हिन्दी की स्वाभाविकता के लिए उसे सर्वनाम से व्यक्त किया गया है।
