lexical_decisions:
- source_word: ዮቤሌው
  choice: जयंती
  rationale: यह निश्चित पचास-वर्षीय काल-खंड के लिए प्रयुक्त पारंपरिक बाइबलीय शब्द है; यहाँ इसे उत्सव मात्र के अर्थ में नहीं, कालगणना की इकाई के रूप में रखा गया है।
- source_word: ይትቀነይ
  choice: काम करते
  rationale: क्रिया में सेवा या श्रम करने का भाव है। प्रसंग में बाग में काम करना स्वाभाविक है और मूल अर्थ को अनावश्यक रूप से केवल ‘खेती करना’ तक सीमित नहीं करता।
- source_word: የዐቅብ
  choice: रखवाली करते
  rationale: मूल क्रिया का अर्थ रक्षा करना, संभालना या सुरक्षित रखना है। ‘रखवाली’ उसके सक्रिय संरक्षण के भाव को स्पष्ट रखती है।
- source_word: ገነት ኤዶም
  choice: अदन का बाग
  rationale: यह आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और सुविख्यात रूप है।
