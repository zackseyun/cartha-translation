  yaml_path: translation/extra_canonical/jubilees/040/007.yaml
  text: And he appointed him second in all his kingdom, and made him ruler over all Egypt, and caused him to ride on Pharaoh’s second chariot. And he clothed him with garments of fine linen, and put a gold chain on his neck, and they proclaimed before him, “El, El,” and “Abrer”; and he gave him his signet ring into his hand, and set him over all his house, and magnified him, and said to him, “Only with respect to the throne alone will I be greater than you.”
translation:
  language: hi
  text: और उसने उसे अपने सारे राज्य में अपने बाद दूसरे स्थान पर नियुक्त किया और उसे पूरे मिस्र पर शासक बनाया। उसने उसे फ़िरौन के दूसरे रथ पर सवार कराया। उसने उसे महीन लिनन के वस्त्र पहनाए और उसके गले में सोने की जंजीर पहनाई। और उसके आगे यह पुकारा गया, “एल, एल,” और “अब्रेर।”[a] उसने अपनी राजमुद्रा की अंगूठी उसके हाथ में दी, उसे अपने सारे घराने पर नियुक्त किया, उसका सम्मान बढ़ाया और उससे कहा, “केवल सिंहासन को छोड़कर मैं तुमसे बड़ा रहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एल, एल” और “अब्रेर” मूल पाठ में आए उद्घोषों का लिप्यंतरण है; उनका सटीक अर्थ अनिश्चित है।
    reason: अस्पष्ट विदेशी उद्घोष का अनुमानित अर्थ थोपने से बचने और पाठगत अनिश्चितता बताने के लिए।
lexical_decisions:
- source_word: ዳግመ
  choice: अपने बाद दूसरे स्थान पर
  rationale: यहाँ शब्द राजकीय पदक्रम में दूसरे स्थान का संकेत देता है; हिन्दी में संबंध स्पष्ट करने के लिए ‘अपने बाद’ जोड़ा गया है।
- source_word: ቢሶስ
  choice: महीन मलमल
  rationale: यह यूनानी मूल से आया वस्त्र-संबंधी शब्द है, जिसका आशय उत्तम महीन लिनन से है; आधुनिक हिन्दी में ‘महीन मलमल’ सहज और प्रतिष्ठित वस्त्र का बोध कराता है।
- source_word: በዝግና፡ ወርቅ
  choice: सोने की जंजीर
  rationale: गले में पहनाए जाने वाले स्वर्ण आभूषण के लिए स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: ማዕተቤ
  choice: मुहर की अंगूठी
  rationale: राजकीय अधिकार सौंपने वाले signet का आशय व्यक्त करता है, न कि केवल साधारण अंगूठी का।
- source_word: መንበር
  choice: सिंहासन
  rationale: राजकीय आसन और सर्वोच्च पदाधिकार दोनों की छाया बनाए रखता है।
theological_decisions:
- issue: घोषणा ‘አል፡ አል፡ ወአቢርር’ का अर्थ
  choice: “एल, एल,” और “अब्रेर” के रूप में लिप्यंतरण
  alternative: इसे अर्थानुवाद करके कोई सम्मानसूचक राजकीय उद्घोष देना
  rationale: पाठ में विदेशी अथवा अस्पष्ट उद्घोष संरक्षित है और उसका अर्थ निश्चित नहीं है; किसी धार्मिक उपाधि या विशिष्ट व्याख्या को थोपने के बजाय अस्पष्टता बनाए रखी गई है।
- issue: फ़िरौन की श्रेष्ठता का आधार
  choice: “केवल सिंहासन के कारण ही मैं तुमसे बड़ा रहूँगा”
  alternative: “केवल सिंहासन पर मैं तुमसे बड़ा हूँ”
  rationale: मूल कथन पद और सिंहासन के संबंध में श्रेष्ठता को सीमित करता है; हिन्दी रूप इसी तनाव को बनाए रखता है और व्यक्तिगत श्रेष्ठता का अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। वाक्य साधारण पाठक के लिए सहज रखे गए हैं, जबकि राजकीय पदक्रम, अधिकार-सौंपने और मूल उद्घोष की अस्पष्टता सुरक्षित है।
