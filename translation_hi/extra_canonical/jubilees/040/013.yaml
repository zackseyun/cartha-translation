base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/013.yaml
  text: And Joseph gathered food for each city within the city until they were full of grain, until they were unable to count and measure it because of its abundance.
translation:
  language: hi
  text: और यूसुफ़ ने हर नगर के लिए भोजन उसी नगर में इकट्ठा किया[a], यहाँ तक कि नगर अनाज से भर गए और उसकी बहुतायत के कारण वे उसे गिन और माप न सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘एक नगर के लिए, एक नगर के भीतर’; इसे ‘नगर-नगर में’ भी समझा जा सकता है।
    reason: गीज़ वाक्यांश की संक्षिप्त संरचना और संभावित वैकल्पिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ሲሳተ፡ (sisāta)
  choice: भोजन
  rationale: यह शब्द खाद्य-सामग्री या रसद को व्यक्त करता है; ‘भोजन’ सामान्य और स्वाभाविक हिन्दी है तथा संदर्भ में आगे आए ‘अनाज’ से अनावश्यक रूप से पहले ही इसे संकुचित नहीं करता।
- source_word: ለሀገር፡ ውስተ፡ ሀገር፡ (la-hāgar wəsta hāgar)
  choice: हर नगर के लिए भोजन उसी नगर में
  rationale: वाक्यांश का आशय प्रत्येक नगर से संबंधित भोजन को उसी नगर में रखने का है। यह स्रोत की ‘नगर ... नगर में’ संरचना को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: መልአ፡ ስርናየ፡ (mal'a sərnāya)
  choice: नगर अनाज से भर गए
  rationale: ‘मलअ’ का मूल अर्थ ‘भर जाना’ है और ‘सर्नाय’ अनाज को सूचित करता है; इसलिए माप से परे होने जैसा अर्थ यहाँ पहले से नहीं जोड़ा गया।
- source_word: ይስእኑ፡ ኍልቈቶ፡ ወሰፈረ፡ (yəs'ənu ḫʷəlqʷato wa-safara)
  choice: वे उसे गिन और माप न सके
  rationale: असमर्थता बताने वाला एक ही क्रियापद गिनने और मापने, दोनों पर लागू होता है; समानांतर रचना हिन्दी में भी बनाए रखी गई है।
- source_word: እምነ፡ ብዝኁ፡ ('əmna bəzḫu)
  choice: उसकी बहुतायत के कारण
  rationale: यह अनाज की प्रचुर मात्रा को गिनने और मापने में असमर्थता का कारण बताता है।
