translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत में असमर्थ होने वाले बहुवचन कर्ता स्पष्ट रूप से नामित नहीं हैं, इसलिए हिन्दी में भी ‘वे’ रखा गया है और कोई अतिरिक्त कर्ता नहीं जोड़ा गया।
