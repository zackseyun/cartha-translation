  rationale: शाब्दिक अर्थ ‘फ़िरौन के सामने खड़ा हुआ’ है; यहाँ राजकीय उपस्थिति/सेवा में आने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ሠላሳ፡ ክረምተ
