base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/005.yaml
  text: “And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up grain in the storehouses of the cities, in each city, during the days of the years of abundance. And it will be provision for the seven years of famine, and the land will not perish before the face of the famine, for it will be very severe.”
translation:
  language: hi
  text: “और अब फ़िरौन सारे मिस्र देश में अधिकारियों को नियुक्त करे, और वे भरपूरी के वर्षों के दिनों में नगर-नगर के भंडार-घरों[a] में अनाज इकट्ठा करके रखें। वह अकाल के सात वर्षों के लिए भोजन-सामग्री होगा, और देश अकाल के सामने नष्ट नहीं होगा, क्योंकि अकाल बहुत भयंकर होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “नगरों के घरों में।”'
    reason: गीज़ पद በቤተ፡ አህጉር का शाब्दिक रूप संरक्षित करना, जबकि मुख्य पाठ में प्रसंगानुसार ‘भंडार-घर’ रखा गया है।
lexical_decisions:
- source_word: መኰንነ
  choice: अधिकारियों
  rationale: यह पद नियुक्त प्रशासनिक अधिकारियों या निरीक्षकों को सूचित करता है; आधुनिक हिन्दी में ‘अधिकारियों’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ይዝግቡ
  choice: इकट्ठा करके रखें
  rationale: क्रिया का भाव भविष्य की आवश्यकता के लिए संचय करने का है; यह हिन्दी अभिव्यक्ति उस उद्देश्यपूर्ण भंडारण को स्पष्ट करती है।
- source_word: በቤተ፡ አህጉር
  choice: नगर-नगर के भंडार-घरों
  rationale: शाब्दिक रूप से ‘नगरों के घरों में’; अनाज-संचय के प्रसंग में ये भंडार-घर हैं। साथ का ውስተ፡ ሀገር ‘नगर-नगर’ के वितरणात्मक भाव को समर्थन देता है।
- source_word: በመዋዕለ፡ ዓመታት፡ ዘጽጋብ
  choice: भरपूरी के वर्षों के दिनों में
  rationale: स्रोत के विशिष्ट ‘वर्षों के दिनों’ मुहावरे को बनाए रखते हुए ጽጋብ को भरपूरी के रूप में प्रस्तुत किया गया है।
- source_word: ሲሳተ
  choice: भोजन-सामग्री
  rationale: यह जीविका, रसद या provision को सूचित करता है; अकाल के प्रसंग में ‘भोजन-सामग्री’ सहज और सटीक है।
- source_word: ኀያል፡ ይከውን፡ ጥቀ
  choice: बहुत भयंकर होगा
  rationale: शाब्दिक बल ‘बहुत प्रबल/कठोर होगा’ है; अकाल के लिए स्वाभाविक हिन्दी में ‘बहुत भयंकर’ उसका तीव्रता-बोध रखता है।
