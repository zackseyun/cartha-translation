base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/001.yaml
  text: 'And it happened to them just as he had interpreted for them: Pharaoh restored the chief cupbearer to his office, and he killed the baker, as Joseph had interpreted for them. And the chief cupbearer left Joseph in the prison house, even though he had informed him of what would happen, and he did not remember to inform Pharaoh of what Joseph had told him, for he forgot.'
translation:
  language: hi
  text: 'और जैसा उसने उनके लिए अर्थ बताया था, वैसा ही उनके साथ हुआ: फ़िरौन ने प्रधान पिलाने वाले को उसके पद पर बहाल कर दिया और रोटी पकाने वाले को मार डाला, ठीक वैसा ही जैसा यूसुफ ने उनके लिए अर्थ बताया था। फिर भी प्रधान पिलाने वाले ने यूसुफ को कारागार में ही छोड़ दिया, हालाँकि यूसुफ ने उसे बता दिया था कि क्या होने वाला है। उसने फ़िरौन को वह बात बताने की सुधि नहीं ली जो यूसुफ ने उससे कही थी, क्योंकि वह भूल गया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈከረ
  choice: अर्थ बताया
  rationale: यहाँ स्वप्न के अर्थ की व्याख्या करना अभिप्रेत है। ‘अर्थ बताया’ आधुनिक हिन्दी में स्वाभाविक है और स्रोत की क्रिया को अनावश्यक विस्तार दिए बिना व्यक्त करता है।
- source_word: ሊቀ፡ መዘርት
  choice: प्रधान पिलानेवाला
  rationale: ሊቀ पद की प्रधानता और መዘርት राजकीय पेय-सेवा के अधिकारी को सूचित करता है; यह पदनाम सामान्य पाठक के लिए स्पष्ट रखा गया है।
- source_word: ሐባዚ
  choice: रोटी पकानेवाला
  rationale: स्रोत में इस व्यक्ति के साथ ‘प्रधान’ का पदसूचक शब्द नहीं है, इसलिए उत्पत्ति की समानांतर कथा से ‘प्रधान’ जोड़कर सामंजस्य नहीं किया गया।
- source_word: አግብኦ
  choice: उसके पद पर बहाल कर दिया
  rationale: क्रिया का भाव फिर से लौटा देने का है और ‘उसके पद पर’ स्रोत के ውስተ፡ ግብሩ፡ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወረሰዮ
  choice: छोड़ दिया
  rationale: इस क्रिया का अर्थ यहाँ ‘छोड़ दिया’ है, ‘भूल गया’ नहीं; भूलने की अलग क्रिया ረስዐ पद के अंत में आती है।
- source_word: አይድዖ
  choice: उसे बता दिया था
  rationale: 'यह कारक रूप सूचना देने का भाव रखता है: यूसुफ ने प्रधान पिलानेवाले को आनेवाली घटना बता दी थी। इसे केवल ‘वह जानता था’ कहना स्रोत की क्रियात्मकता खो देता।'
- source_word: ረሳዐ
  choice: भूल गया
  rationale: पद के अंत में स्पष्ट रूप से भूलने की क्रिया है; हिन्दी में इसका सीधा और स्वाभाविक समतुल्य चुना गया है।
