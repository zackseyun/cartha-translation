translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले उपवाक्य में स्रोत के सर्वनाम ‘उसने’ को बनाए रखा गया है और यूसुफ का नाम वहीं जोड़ा गया है जहाँ गीइज़ पाठ उसे स्पष्ट करता है। ‘रोटी पकानेवाला’ के साथ ‘प्रधान’ नहीं जोड़ा गया, ताकि उत्पत्ति की समानांतर कथा के आधार पर स्रोत का विस्तार न हो। अंतिम वाक्यों में सर्वनामों का आशय स्पष्ट करने के लिए ‘यूसुफ’ और ‘प्रधान पिलानेवाला’ को आवश्यक स्थानों पर दोहराया गया है।
