base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/006.yaml
  text: And the Lord gave Joseph favor and mercy in Pharaoh’s sight, and Pharaoh said to his servants, “We will not find a man wise and understanding like this man, for the spirit of the Lord is with him.”
translation:
  language: hi
  text: और प्रभु ने यूसुफ को फ़िरौन की दृष्टि में कृपा और दया दिलाई। तब फ़िरौन ने अपने सेवकों से कहा, “हमें इस मनुष्य के समान बुद्धिमान और समझदार मनुष्य नहीं मिलेगा, क्योंकि प्रभु का आत्मा उसके साथ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞገሰ፡ ወምሕረተ
  choice: कृपा और दया
  rationale: 'दोनों समन्वित संज्ञाओं का भेद बनाए रखा गया है: ሞገስ अनुग्रह/कृपा और ምሕረት दया को व्यक्त करता है।'
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለፈርዖን
  choice: फ़िरौन की दृष्टि में
  rationale: मूल के ‘आँखों के सामने’ मुहावरे का स्वाभाविक हिन्दी रूप, जिसका अर्थ फ़िरौन की निगाह में अनुकूलता पाना है।
- source_word: ጠቢበ፡ ወማእምረ
  choice: बुद्धिमान और समझदार
  rationale: दो अलग गुणों को बनाए रखते हुए आधुनिक और सहज हिन्दी शब्द चुने गए हैं।
- source_word: መንፈሰ፡ እግዚአብሔር
  choice: प्रभु का आत्मा
  rationale: मूल में ‘प्रभु का आत्मा’ है; इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक पद में नहीं बदला गया।
- source_word: ምስሌሁ
  choice: उसके साथ है
  rationale: गेइज़ संबंधसूचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: यूसुफ के साथ दिव्य आत्मा की उपस्थिति
  choice: प्रभु का आत्मा उसके साथ है
  alternative: परमेश्वर का आत्मा उसमें है
  rationale: मूल ምስሌሁ का अर्थ ‘उसके साथ’ है, ‘उसमें’ नहीं; इसलिए आत्मा के अंतर्वास जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ी गई।
- issue: दिव्य उपाधि እግዚአብሔር
  choice: प्रभु
  alternative: परमेश्वर
  rationale: स्रोत और परामर्श-पाठ में प्रयुक्त प्रभुतासूचक उपाधि को ‘प्रभु’ से लगातार व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। फ़िरौन के कथन में मूल का ‘हम नहीं पाएँगे’ भाव रखा गया है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
