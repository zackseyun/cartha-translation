base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/008.yaml
  text: And Joseph went out through all the land of Egypt, and all Pharaoh’s princes loved him, and all his servants, and all who did the king’s work, because he walked uprightly and there was no pride, or arrogance of heart, or partiality, and no taking of bribes; for he judged uprightly for all the peoples of the earth.
translation:
  language: hi
  text: और यूसुफ निकलकर मिस्र के सारे देश में गया। फ़िरौन के सभी अधिकारियों, उसके सभी सेवकों और राजा का काम करने वाले सभी लोगों ने उससे प्रेम किया, क्योंकि वह सीधाई से चलता था। उसमें न घमंड था, न मन का अहंकार, न पक्षपात, और न वह घूस लेता था; क्योंकि वह पृथ्वी के सभी लोगों का निष्पक्षता से न्याय करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መበለ
  choice: घूमता रहा
  rationale: संदर्भ में देश भर में निकलकर जाने/भ्रमण करने का भाव है; आधुनिक हिन्दी में सहज अभिव्यक्ति।
- source_word: አፍቀርዎ
  choice: उससे प्रेम करते थे
  rationale: मूल क्रिया के सीधे प्रेम/स्नेह के अर्थ को बनाए रखा गया है।
- source_word: ርቱዐ፡ የሐውር
  choice: सीधाई से चलता था
  rationale: नैतिक आचरण के ‘सीधा/खरा होकर चलने’ वाले रूपक को सुरक्षित रखता है।
- source_word: አሢሦተ፡ ገጽ
  choice: पक्षपात
  rationale: चेहरा देखकर कृपा करने के मुहावरे का आशय पक्षपात है; ‘मुख का घमंड’ अर्थसंगत नहीं है।
- source_word: ነሢአ፡ ሕልያነ
  choice: घूस लेता था
  rationale: यह पद उपहार/रिश्वत स्वीकार करने को सूचित करता है, विचार या मन को नहीं।
- source_word: ርቱዐ፡ ይኴንን
  choice: निष्पक्षता से न्याय करता था
  rationale: न्याय के प्रसंग में ‘सीधाई से न्याय’ को स्वाभाविक हिन्दी में निष्पक्ष न्याय के रूप में व्यक्त किया गया है।
- source_word: አሕዛበ፡ ምድር
  choice: देश के सभी लोगों
  rationale: यहाँ प्रसंग मिस्र देश में यूसुफ के प्रशासन का है; ‘धरती की सब जातियाँ’ से अधिक संदर्भानुकूल और सहज।
theological_decisions:
- issue: यूसुफ के न्याय की नैतिक विशेषता
  choice: निष्पक्षता से न्याय करता था
  alternative: सीधाई से न्याय करता था
  rationale: दोनों मूल की धर्मनिष्ठा व्यक्त करते हैं, पर न्यायिक संदर्भ और पूर्ववर्ती ‘पक्षपात’ के निषेध के कारण ‘निष्पक्षता’ अधिक स्पष्ट है।
- issue: अंतिम पद का दायरा
  choice: देश के सभी लोगों
  alternative: पृथ्वी की सभी जातियों
  rationale: ‘भूमि/देश’ और ‘लोग/जातियाँ’ दोनों शब्द व्यापक हो सकते हैं; मिस्र में यूसुफ की गतिविधि का निकट संदर्भ स्थानीय अर्थ का समर्थन करता है, बिना किसी सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रशासनिक पद के लिए ‘हाकिम’, नैतिक चाल के लिए ‘सीधाई’, और रिश्वत के लिए प्रचलित ‘घूस’ चुना गया है।
