base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/002.yaml
  text: And in those days Pharaoh dreamed two dreams in one night concerning the matter of the famine that would come upon all the earth. And he awoke from his sleep and called all the interpreters of dreams who were in Egypt, and the diviners, and he told them both his dreams, but they were not able to understand.
translation:
  language: hi
  text: और उन दिनों फ़िरौन ने एक ही रात में दो स्वप्न देखे। वे उस अकाल के विषय में थे जो सारी धरती पर आने वाला था। वह नींद से जागा और उसने मिस्र के सभी स्वप्न-विवेचकों और शकुन-विचारकों को बुलाया। उसने उन्हें अपने दोनों स्वप्न सुनाए, पर वे उन्हें समझ न सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለመ፡ ... ሕለመ፡ ክልኤተ
  choice: दो स्वप्न देखे
  rationale: मूल में फ़िरौन के दो स्वप्न देखने की बात स्पष्ट है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण अभिव्यक्ति रखी गई है।
- source_word: በአሐቲ፡ ሌሊት
  choice: एक ही रात में
  rationale: ‘एक रात में’ के साथ ‘ही’ दोनों स्वप्नों के उसी रात देखे जाने पर मूल के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ረኃብ
  choice: अकाल
  rationale: यहाँ केवल व्यक्तिगत भूख नहीं, पूरी धरती पर आने वाली व्यापक खाद्य-विपत्ति अभिप्रेत है।
- source_word: ዲበ፡ ኵሉ፡ ምድር
  choice: सारी धरती पर
  rationale: ‘ምድር’ का व्यापक अर्थ सुरक्षित रखा गया है; इसे चुपचाप केवल मिस्र या किसी सीमित देश तक नहीं बाँधा गया।
- source_word: መፈክራነ፡ ሕልም
  choice: स्वप्न-विवेचकों
  rationale: यह पद स्वप्नों की व्याख्या करने वालों को सूचित करता है; ‘विवेचक’ आधुनिक, संक्षिप्त और समझने योग्य है।
- source_word: ረቅይተ
  choice: शकुन-विचारकों
  rationale: यह अलग प्रकार के गूढ़ संकेतों अथवा शकुनों से अर्थ निकालने वाले विशेषज्ञों को सूचित करता है; इसे पहले समूह में मिला नहीं दिया गया।
- source_word: ወአክሀሉ፡ አእምሮ
  choice: पर वे उन्हें समझ न सके
  rationale: अंतिम पद को अर्थ ‘बताने’ के बजाय समझने की असमर्थता के रूप में रखा गया है, जो स्रोत के ‘ज्ञान/समझ’ संबंधी शब्द के अधिक निकट है।
theological_decisions:
- issue: ‘सारी धरती’ की भौगोलिक व्यापकता
  choice: सारी धरती
  alternative: सारा देश / समूचा मिस्र
  rationale: स्रोत का पद व्यापक है। अनुवाद ने यह तय नहीं किया कि कथन अनिवार्यतः वैश्विक है या प्राचीन कथन-शैली में ज्ञात भूभाग को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। लंबे मूल वाक्य को स्पष्टता के लिए छोटे वाक्यों में बाँटा गया है। ‘फ़िरौन’, ‘स्वप्न’, ‘अकाल’ और ‘धरती’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं; किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
