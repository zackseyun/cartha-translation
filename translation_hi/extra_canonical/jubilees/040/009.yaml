  text: And the land of Egypt prospered before Pharaoh because of Joseph, for the Lord was with him and gave him favor and mercy over all his generation, in the sight of all who knew him and all who heard of him. And Pharaoh’s kingdom was well ordered, and there was no adversary and no evil.
translation:
  language: hi
  text: और यूसुफ के कारण मिस्र देश फ़िरौन के समक्ष समृद्ध हुआ, क्योंकि प्रभु उसके साथ था और उसने उसे उसकी सारी पीढ़ी के लोगों से बढ़कर अनुग्रह और दया दी[a], उन सबकी दृष्टि में जो उसे जानते थे और उन सबकी दृष्टि में जिन्होंने उसके विषय में सुना था। फ़िरौन का राज्य सुव्यवस्थित था, और न कोई विरोधी था, न कोई बुराई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसकी पीढ़ी” का अर्थ उसके समकालीन लोग हो सकता है; वैकल्पिक रूप से, “उसके कुटुम्बी।”
    reason: ዘመዱ के ‘पीढ़ी/समकालीनों’ और संभावित ‘कुटुम्बियों’ के अर्थ-क्षेत्र को सुरक्षित रखता है, जबकि मुख्य पाठ में ላዕለ का ‘से बढ़कर’ भाव स्पष्ट रहता है।
lexical_decisions:
- source_word: ትሠናአወት
  choice: समृद्ध हुआ
  rationale: मूल क्रिया में दृढ़ होने, फलने-फूलने या उन्नत होने का भाव है; प्रसंग में मिस्र की उन्नति के लिए ‘समृद्ध हुआ’ स्वाभाविक है।
- source_word: ሞገሰ፡ ወምሕረተ
  choice: अनुग्रह और दया
  rationale: दोनों अलग संज्ञाओं को बनाए रखते हुए ईश्वरीय कृपादृष्टि और करुणा का भाव व्यक्त किया गया है।
- source_word: ዘመዱ
  choice: उसकी पूरी पीढ़ी
  rationale: यहाँ शब्द को केवल रक्त-संबंधियों तक सीमित न करके यूसुफ के युग के लोगों अथवा समकालीन पीढ़ी के अर्थ में लिया गया है।
- source_word: ወረጐዐት
  choice: सुव्यवस्थित और शांत रहा
  rationale: क्रिया राज्य के स्थिर, शांत और व्यवस्थित हो जाने का भाव देती है; हिन्दी में संयुक्त पदबंध उस व्यापक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ሰይጣነ
  choice: विरोधी
  rationale: इस प्रसंग में सामान्य अर्थ ‘शत्रु/प्रतिद्वंद्वी’ उपयुक्त है; इसे व्यक्तिवाचक ‘शैतान’ बनाना अनावश्यक धर्मवैचारिक विशिष्टता जोड़ता।
- source_word: እኩየ
  choice: बुराई
  rationale: मूल रूप सामान्य ‘बुराई/अनिष्ट’ को दर्शा सकता है; इसे ‘दुष्ट व्यक्ति’ मानकर अस्पष्टता समाप्त नहीं की गई।
theological_decisions:
- issue: ሰይጣነ को व्यक्तिवाचक या सामान्य संज्ञा मानना
  choice: विरोधी
  alternative: शैतान
  rationale: फ़िरौन के राज्य की राजनीतिक-सामाजिक स्थिरता वाले निकट प्रसंग में सामान्य ‘विरोधी’ अधिक संगत है।
- issue: अंतिम እኩየ का अर्थ
  choice: बुराई
  alternative: कोई दुष्ट जन
  rationale: मूल में सामान्य अनिष्ट और दुष्ट व्यक्ति दोनों की संभावना हो सकती है; मुख्य पाठ में अमूर्त और स्वाभाविक हिन्दी रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘फ़िरौन’, ‘अनुग्रह’ और ‘दया’ जैसे परिचित बाइबलीय पदों का प्रयोग किया गया है, जबकि वाक्य-संरचना को सामान्य पाठक के लिए स्वाभाविक रखा गया है।
