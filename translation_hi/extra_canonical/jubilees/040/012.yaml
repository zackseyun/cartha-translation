base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/012.yaml
  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: hi
  text: 'और उसी वर्ष इसहाक की मृत्यु हुई। और वैसा ही हुआ जैसा यूसुफ ने उसके दोनों स्वप्नों की व्याख्या के विषय में कहा था, जैसा उसने उसे बताया था: पूरे मिस्र देश में भरपूरी के सात वर्ष हुए, और मिस्र की भूमि ने अत्यन्त उपज दी—एक माप से अठारह सौ माप उपजे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ
  choice: मृत्यु हुई
  rationale: गीज़ क्रिया ‘मरना’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; कर्ता इसहाक स्पष्ट रखा गया है।
- source_word: ፍካሬ፡ ክልኤ፡ ሕልሙ
  choice: उसके दोनों स्वप्नों के अर्थ
  rationale: ፍካሬ को ‘अर्थ/व्याख्या’ और ክልኤ ሕልሙ को ‘उसके दोनों स्वप्न’ के रूप में प्रस्तुत किया गया है; हिन्दी में ‘अर्थ’ अधिक सहज है।
- source_word: ሰብዐቱ፡ ክረምት፡ ዘጽጋብ
  choice: भरपूरी के सात वर्ष
  rationale: ጽጋብ प्रचुरता और तृप्ति का भाव देता है; अकाल के विपरीत कृषि-समृद्धि के संदर्भ में ‘भरपूरी’ सरल और स्वाभाविक है।
- source_word: ወፈርየት፡ ምድረ፡ ግብጽ፡ ብዙኀ
  choice: मिस्र की भूमि ने अत्यन्त उपज दी
  rationale: भूमि के बहुत फलने/उत्पन्न करने की स्रोत-छवि और तीव्रता दोनों सुरक्षित हैं।
- source_word: አሐቲ፡ መስፈርት፡ ዐሠርተ፡ ወሰመትነ፡ ምእተ፡ መስፈረ
  choice: एक माप से अठारह सौ माप उपजे
  rationale: स्रोत में दिए असाधारण 1:1800 अनुपात को बिना सामान्यीकृत या संशोधित किए स्पष्ट हिन्दी में रखा गया है।
theological_decisions:
- issue: यूसुफ के कथन और घटनाओं की पूर्ति
  choice: जैसा कहा था, ठीक वैसा ही हुआ
  alternative: यूसुफ की भविष्यवाणी पूरी हुई
  rationale: स्रोत घटना और पूर्व कथन के मेल पर बल देता है, पर इसे तकनीकी रूप से ‘भविष्यवाणी’ नहीं कहता; इसलिए अतिरिक्त धार्मिक वर्गीकरण नहीं जोड़ा गया।
- issue: दोनों स्वप्नों से संबद्ध सर्वनाम
  choice: उसके दोनों स्वप्न ... जैसा उसने उसे बताया था
  alternative: फ़िरौन के दोनों स्वप्न ... जैसा यूसुफ ने फ़िरौन को बताया था
  rationale: स्रोत के सर्वनामों को नामों से स्पष्ट कर देने पर अस्पष्टता समाप्त हो जाती; अतः वास्तविक सर्वनामगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। वाक्य-संरचना को पठनीय बनाया गया है, जबकि स्रोत की पुनरुक्ति (‘जैसा कहा था ... जैसा बताया था’) और सर्वनामगत अस्पष्टता को बनाए रखा गया है।
