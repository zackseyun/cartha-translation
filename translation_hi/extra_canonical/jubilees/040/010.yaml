base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/010.yaml
  text: And the king called Joseph’s name Pontifans,^a and he gave Joseph as wife the daughter of Potiphar, the daughter of Sawes^b of Heliopolis, chief of the guards.
translation:
  language: hi
  text: राजा ने यूसुफ का नाम पोंतिफ़ान्स[a] रखा। फिर उसने पोतीफ़रान की बेटी—हेलियोपोलिस के पहरेदारों के प्रधान सावेस[b] की बेटी—यूसुफ को पत्नी के रूप में दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्सोन्थोम्फ़ानेस’।
    reason: वैकल्पिक, यूनानी-सदृश नाम-रूप को दर्ज करना, बिना उसे गीज़ पाठ का निश्चित पाठांतर बताए।
  - marker: b
    text: या पाठ-संशोधन के अनुसार, ‘एक याजक’।
    reason: गीज़ ‘सावेस’ को कुछ विद्वान ‘याजक’ अर्थ वाले यूनानी शब्द का विकृत रूप मानते हैं।
lexical_decisions:
- source_word: ጸውዐ፡ ... ስሞ
  choice: नाम ... रखा
  rationale: गीज़ मुहावरे ‘उसका नाम पुकारा’ को स्वाभाविक आधुनिक हिन्दी में ‘नाम रखा’ व्यक्त करता है।
- source_word: ጶንጢፋንስ
  choice: पोंतिफ़ान्स
  rationale: गीज़ नाम-रूप P̣onṭifans का निकट देवनागरी लिप्यंतरण; इसे उत्पत्ति के यूनानी रूप से समरूप नहीं किया गया।
- source_word: ጶጢፋራን
  choice: पोतीफ़रान
  rationale: मूल गीज़ में उपस्थित विशिष्ट नाम-रूप को बनाए रखा गया है।
- source_word: ሳውፅ
  choice: सावेस
  rationale: गीज़ पाठ इसे संज्ञा-नाम की तरह प्रस्तुत करता है; ‘याजक’ में संशोधन करने के बजाय पाठगत रूप रखा गया है और पादटिप्पणी में विकल्प बताया गया है।
- source_word: ሊቀ፡ ዐቀብት
  choice: पहरेदारों के प्रधान
  rationale: शाब्दिक पदानुक्रम और कार्य को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: सावेस को नाम मानना या ‘याजक’ के रूप में संशोधित करना
  choice: मुख्य पाठ में ‘सावेस’
  alternative: ‘एक याजक’
  rationale: प्राप्त गीज़ पाठ का रूप प्राथमिक है; संभावित पाठ-संशोधन को मुख्य पाठ में चुपचाप नहीं अपनाया गया।
- issue: दो बार आए ‘बेटी’ संबंध का अर्थ
  choice: पोतीफ़रान की बेटी और सावेस की बेटी—दोनों संबंधों को मूल की तरह साथ रखा
  alternative: किसी एक संबंध को हटाकर या दोनों पुरुषों को एक मानकर वाक्य सरल करना
  rationale: मूल पाठ की असहजता/अस्पष्टता को मिटाने के बजाय डैशयुक्त समानाधिकरण से संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल कथात्मक शैली। नामों को मूल गीज़ रूप के निकट रखा गया है और पाठगत कठिनाई को बिना समरस किए सुरक्षित किया गया है।
