  text: Then the chief cupbearer remembered Joseph and spoke about him to the king, and he brought him out from the prison house, and he told before him both his dreams.
translation:
  language: hi
  text: तब प्रधान पिलानेवाले ने यूसुफ को याद किया और राजा से उसके विषय में कहा। राजा ने उसे बन्दीगृह से बाहर बुलवाया; तब यूसुफ ने राजा के सामने अपने दोनों स्वप्न सुनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: प्रधान पिलानेवाला
  rationale: यह पद राजकीय पेय परोसनेवालों के प्रमुख अधिकारी को दर्शाता है; सहज हिन्दी में पद और कार्य दोनों स्पष्ट रखे गए हैं।
- source_word: ንጉሥ
  choice: राजा
  rationale: गीज़ के सामान्य राजकीय पद का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: ቤተ፡ ሞቅሕ
  choice: बन्दीगृह
  rationale: शाब्दिक अर्थ ‘कैद का घर’ है; ‘बन्दीगृह’ आधुनिक, dignified और प्रसंगानुकूल है।
- source_word: ክልኤሆሙ፡ ሕለመሁ
  choice: अपने दोनों स्वप्न
  rationale: ክልኤሆሙ ‘दोनों’ और ሕለመሁ में तृतीय पुरुष पुल्लिंग एकवचन संबंधसूचक प्रत्यय ‘उसके/अपने’ निहित है।
