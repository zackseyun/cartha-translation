translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। गीज़ की वाक्य-श्रृंखला को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘उसे बाहर निकाला’ के शाब्दिक रूप के स्थान पर राजकीय कर्तृत्व के स्वाभाविक हिन्दी प्रयोग ‘बाहर बुलवाया’ रखा गया है; स्वप्नों पर मूल का संबंधसूचक अर्थ स्पष्ट रूप से सुरक्षित है।
