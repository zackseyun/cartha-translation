  text: And he said before Pharaoh that both his dreams were one, and he said to him, “Seven years of abundance will come in all the land of Egypt, and after this seven years of famine, such famine as has not been in all the earth.”
translation:
  language: hi
  text: और उसने फ़िरौन के सामने कहा कि उसके दोनों स्वप्न एक ही थे। उसने उससे कहा, “समूचे मिस्र देश में भरपूरी के सात वर्ष आएँगे, और इसके बाद अकाल के सात वर्ष आएँगे—ऐसा अकाल, जैसा सारी पृथ्वी पर कभी नहीं पड़ा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆሙ፡ ሕለመሁ፡ አሐዱ፡ እሙንቱ
  choice: उसके दोनों स्वप्न एक ही हैं
  rationale: गीज़ में द्विवचन-संबंधी भाव और बहुवचन विधेय के साथ दोनों स्वप्नों की एकता व्यक्त है; हिन्दी में स्वाभाविक और निकट रूप।
- source_word: ጽጋብ
  choice: भरपूरी
  rationale: यहाँ अर्थ अन्न और उपज की प्रचुरता का है; ‘भरपूरी’ सामान्य पाठक के लिए सहज है और केवल धन-संपत्ति तक अर्थ सीमित नहीं करती।
- source_word: ወእምድኅረዝ
  choice: और इसके बाद
  rationale: शाब्दिक रूप से ‘और इस/इसके बाद’; एकवचन संकेतवाचक को बनाए रखा गया है, न कि संदर्भानुसार ‘उनके बाद’।
- source_word: ረኃብ፡ ዘአኮ፡ ከማሁ፡ ረኃብ
  choice: ऐसा अकाल, जैसा ... कभी नहीं पड़ा
  rationale: स्रोत की तुलना—‘जिसके समान अकाल नहीं’—को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ውስተ፡ ኵሉ፡ ምድር
  choice: सारी पृथ्वी पर
  rationale: गीज़ पदबंध का व्यापक अर्थ सुरक्षित रखा गया है; इसे केवल मिस्र या आसपास के देशों तक सीमित नहीं किया गया।
theological_decisions:
- issue: दो स्वप्नों की एकता
  choice: दोनों स्वप्न एक ही हैं
  alternative: दोनों स्वप्नों का अर्थ एक ही है
  rationale: स्रोत सीधे स्वप्नों को ‘एक’ कहता है; व्याख्यात्मक शब्द ‘अर्थ’ जोड़कर कथन की प्रकृति को नहीं बदला गया।
- issue: अकाल के विश्वव्यापी दायरे का कथन
  choice: सारी पृथ्वी पर
  alternative: सारे देश में
  rationale: पहले खंड में मिस्र देश स्पष्ट है, जबकि अंतिम पदबंध व्यापक ‘समूची पृथ्वी/भूमि’ कहता है; इस तनाव को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘फ़िरौन’ प्रचलित बाइबलीय नामरूप है। प्रत्यक्ष कथन में भविष्यसूचक लय बनाए रखने के लिए ‘आएँगे’ दोहराया गया है।
