lexical_decisions:
- source_word: አባግዒሁ፡ በቴምናታ
  choice: उसकी भेड़ें तिम्ना में थीं
  rationale: उपलब्ध अंश वाक्य के बीच से आरम्भ होता है; ‘उसकी भेड़ें’ और स्थान ‘तिम्ना’ को यथासंभव सीधे रखा गया है। आरम्भ का दीर्घविराम इस अपूर्ण संदर्भ को दर्शाता है।
- source_word: አንበረች፡ አልባሰ፡ ምዕስብናሃ
  choice: उसने अपने विधवापन के वस्त्र उतार दिए
  rationale: संदर्भ और प्राचीन पाठ-परंपरा के अनुसार यह विधवा के रूप को सूचित करने वाले वस्त्र हटाने की क्रिया है; आधुनिक हिन्दी में ‘विधवापन के वस्त्र’ स्पष्ट और गरिमापूर्ण है।
- source_word: ለብሰት፡ ገልባቤ
  choice: घूँघट ओढ़ लिया
  rationale: ገልባቤ सिर या मुख ढकने वाले आवरण का बोध देता है। ‘घूँघट’ सामान्य हिन्दी में इस दृश्य को सहज रूप से व्यक्त करता है, बिना यह तय किए कि मुख कितना ढका था।
- source_word: ተሣየየት
  choice: अपना शृंगार किया
  rationale: यह रूप स्वयं को सजाने-सँवारने का अर्थ देता है; ‘अपना शृंगार किया’ प्राकृतिक हिन्दी है।
