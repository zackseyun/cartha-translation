lexical_decisions:
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यह परमेश्वर के लिए प्रयुक्त गीइज़ पद है; प्रसंग में इसे इस्राएल के परमेश्वर के व्यक्तिगत नाम के रूप में प्रस्तुत किया गया है।
- source_word: ወቀተሎ
  choice: ने उसे मार डाला
  rationale: क्रिया का अर्थ ‘और उसने उसे मार डाला’ है; हिंदी में स्पष्ट कर्ता ‘यहोवा’ के साथ स्वाभाविक वाक्य बनाया गया है।
- source_word: መርዓቱ
  choice: अपनी बहू
  rationale: यह संबंधसूचक पद तामार को यहूदा की पुत्रवधू के रूप में पहचानता है; आधुनिक हिंदी में ‘बहू’ सहज और स्पष्ट है।
- source_word: ንበሪ፡ ቤተ፡ አቡኪ
  choice: अपने पिता के घर में रह
  rationale: स्त्रीलिंग एकवचन आज्ञा और ‘तेरे पिता के घर’ को स्वाभाविक प्रत्यक्ष कथन में रखा गया है।
- source_word: እንዘ
  choice: जब तक…
  rationale: यह आश्रित कालवाची अभिव्यक्ति आरंभ करता है, पर उपलब्ध स्रोत इसी शब्द पर कट जाता है; दीर्घविराम अधूरे वाक्यांश को दर्शाता है।
theological_decisions:
- issue: मृत्यु के कर्ता की पहचान
  choice: यहोवा को स्पष्ट कर्ता रखा गया
  alternative: ‘प्रभु, और उसने उसे मार डाला’ जैसा स्रोत-खंडानुरूप असहज रूप
  rationale: गीइज़ में ‘यहोवा’ के बाद संयोजित क्रिया आती है और उसी को कर्ता समझना व्याकरण तथा प्रसंग दोनों के अनुरूप है; हिंदी में सर्वनाम रखने से अनावश्यक अस्पष्टता आती।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। उपलब्ध गीइज़ अंश እንዘ (‘जब/जब तक’) पर समाप्त होता है, इसलिए बाद की अप्रदत्त सामग्री नहीं जोड़ी गई; उद्धरण के भीतर दीर्घविराम स्रोत की अपूर्णता दिखाता है।
