translation:
  language: hi
  text: और उसके पिता यहूदा ने उसे रोका। और यहूदा का पहलौठा एर दुष्ट था, और यहोवा ने उसे मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕበሶ (ʾaḥbaso)
  choice: उसे रोका
  rationale: यह क्रिया रोकने, बाधा डालने या निषेध करने का भाव देती है; यहाँ सरल और प्रसंगानुकूल हिन्दी में ‘रोका’ चुना गया है।
- source_word: በኵሩ (bakʷəru)
  choice: पहलौठा
  rationale: यहूदा के प्रथम जन्मे पुत्र के लिए स्वाभाविक बाइबलीय हिन्दी।
- source_word: እኩይ (ʾəkuy)
  choice: दुष्ट
  rationale: नैतिक बुराई को सीधे और संक्षेप में व्यक्त करता है।
- source_word: ቀተሎ (qatalo)
  choice: उसे मार डाला
  rationale: मृत्यु दिए जाने की क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: यहोवा
  rationale: ईश्वर के नाम के लिए प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: एर की दुष्टता और उसकी मृत्यु के बीच संबंध
  choice: ‘इसलिए’ द्वारा कारणात्मक संबंध स्पष्ट किया
  alternative: दो स्वतंत्र उपवाक्यों को केवल ‘और’ से जोड़ना
  rationale: स्रोत में क्रम और समन्वय है तथा समानांतर उत्पत्ति-वृत्तांत दुष्टता को प्रभु द्वारा मृत्यु दिए जाने का कारण बताता है; ‘इसलिए’ हिन्दी में निहित संबंध को स्वाभाविक बनाता है।
- issue: दिव्य कर्ता का नाम
  choice: यहोवा
  alternative: प्रभु
  rationale: स्रोत का እግዚአብሔር संदर्भित दिव्य नाम/उपाधि है; ‘यहोवा’ पात्र और क्रिया के संबंध को स्पष्ट रखते हुए परिचित हिन्दी बाइबलीय प्रयोग देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। पहले वाक्य में ‘उसे’ का संदर्भ पूर्ववर्ती प्रसंग पर निर्भर रहने दिया गया है, जैसा स्रोत में है।
