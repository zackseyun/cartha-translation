  text: “अपने भाई के लिए संतान उत्पन्न कर।” और ओनान जानता था कि संतान उसकी नहीं, बल्कि उसके भाई की होगी। और जब वह अपने भाई की पत्नी के पास गया, तो उसने वीर्य भूमि पर गिरा दिया। और यह … की दृष्टि में बुरा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीज़ स्रोतांश वाक्यांश ‘… की दृष्टि में’ पर अधूरा समाप्त होता है; आगे आने वाला नाम या अन्य शब्द इस स्रोतांश में नहीं दिया गया है।
    reason: अपूर्ण पद-सीमा और ‘दृष्टि’ के अज्ञात संदर्भ को दिखाना, बिना अनुमान से कोई नाम या सर्वनाम जोड़े।
lexical_decisions:
- source_word: ዘርአ
  choice: वंश / वीर्य
  rationale: गीज़ शब्द प्रसंग में पहले संतान अथवा वंश और बाद में शारीरिक बीज/वीर्य के अर्थ में प्रयुक्त है; हिंदी में दोनों संदर्भों के अनुसार अलग शब्द रखने से मूल का अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: ቦአ፡ ቤተ፡ ብእሲተ፡ እኁሁ
  choice: अपने भाई की पत्नी के पास गया
  rationale: यह यौन संबंध के लिए प्रयुक्त शिष्ट मुहावरा है; हिंदी में ‘के पास गया’ उसी संकेत को गरिमापूर्ण और सहज रूप में रखता है।
- source_word: ወከዐወ
  choice: गिरा दिया
  rationale: क्रिया का आशय उँडेलने या बहा देने से है; वीर्य के संदर्भ में ‘गिरा दिया’ प्राकृतिक हिंदी है।
- source_word: በቅድመ፡ አዕይንተ
  choice: उसकी दृष्टि में
  rationale: स्रोतांश का शाब्दिक अर्थ ‘की आँखों के सामने/दृष्टि में’ है। उपलब्ध पाठ यहीं अधूरा समाप्त होता है, इसलिए जिसके दृष्टिकोण की बात है उसे अनुमान से नहीं भरा गया।
theological_decisions:
- issue: दुष्टता किसकी दृष्टि में थी
  choice: सर्वनाम ‘उसकी’ को अनिर्दिष्ट रखा और अपूर्णता दर्शाई
  alternative: ‘यहोवा की दृष्टि में’ अथवा ‘परमेश्वर की दृष्टि में’
  rationale: दिए गए गीज़ स्रोत में पद ‘की दृष्टि में’ पर समाप्त होता है और अपेक्षित संज्ञा उपलब्ध अंश में नहीं है। संभावित अगले पाठ को जोड़ना स्रोत से आगे जाना होता।
- issue: ओनान के कार्य का वर्णन
  choice: कार्य को केवल स्रोत के अनुसार वर्णित किया
  alternative: उसके उद्देश्य या पाप की प्रकृति की व्याख्या जोड़ना
  rationale: पाठ वीर्य भूमि पर गिराने और कार्य के बुरा होने को कहता है; कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष अनुवाद में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘वंश उत्पन्न कर’ पारिवारिक उत्तराधिकारी के भाव को रखता है, जबकि ‘वीर्य’ शारीरिक क्रिया को अस्पष्ट किए बिना सीधे व्यक्त करता है। अंतिम डैश स्रोतांश की अपूर्णता संकेतित करता है।
