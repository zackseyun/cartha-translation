  terminology: ‘संतान’ consistently renders offspring in the inheritance/descendant sense, while ‘वीर्य’ renders the physical seed. ‘अपने भाई की पत्नी के पास गया’ retains the source’s restrained sexual euphemism without adding interpretation.
