lexical_decisions:
- source_word: ኢዮቤልው
  choice: जुबली-काल
  rationale: यह कालगणना की विशिष्ट इकाई है; ‘जुबली-काल’ सामान्य पाठक को इसके समय-संबंधी अर्थ का संकेत देता है और पारिभाषिक पहचान भी बनाए रखता है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: शाब्दिक रूप से सात की इकाई; जुबली की कालगणना में यहाँ सात वर्षों का ‘सप्ताह’ अभिप्रेत है, जिसे अनावश्यक व्याख्या जोड़े बिना रखा गया है।
- source_word: ነሥአ
  choice: लिया
  rationale: क्रिया का मूल अर्थ ‘लेना’ है। उपलब्ध अंश यहीं समाप्त होता है, इसलिए कर्म या विवाह जैसे आशय को अनुमान से नहीं जोड़ा गया।
- source_word: ይሁዳ
  choice: यहूदा
  rationale: इस बाइबलीय नाम का प्रचलित आधुनिक हिन्दी रूप।
