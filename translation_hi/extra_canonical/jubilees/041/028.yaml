revisions:
- from: क्योंकि वह अपनी दृष्टि की निष्कपटता में चला और न्याय की माँग की; क्योंकि अब्राहम ने अपने पुत्रों को जिस न्याय का आदेश दिया था, उसी के अनुसार यहूदा ने चाहा कि वह स्त्री आग में जला दी जाए।
  to: क्योंकि उसने निष्कपट दृष्टि से काम किया और न्याय की माँग की; क्योंकि अब्राहम के उस न्याय-विधान के अनुसार, जिसका पालन करने की आज्ञा उसने अपने पुत्रों को दी थी, यहूदा ने चाहा कि उस स्त्री को आग में जला दिया जाए।
  rationale: The revision retains the source's defense of Judah's perspective as innocent or straightforward, avoids the rejected ‘desire’ reading, and expresses the legal relation to Abraham's ordinance in natural modern Hindi. ‘उस स्त्री’ appropriately reflects the feminine object of the source's final passive clause.
