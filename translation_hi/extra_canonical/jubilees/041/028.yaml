review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders የውሀት as innocence/simplicity rather than desire, and it properly treats Abraham's judgment as the legal basis for Judah's wish. The feminine passive sense of the final clause is retained.
  naturalness: ‘अपनी दृष्टि की निष्कपटता में चला’ is overly literal and unnatural in modern Hindi. ‘अब्राहम ने ... जिस न्याय का आदेश दिया था’ is also awkward; a legal ordinance whose observance was commanded is clearer.
  terminology: ‘निष्कपट,’ ‘न्याय,’ and ‘आग में जला दी जाए’ suit the register. ‘न्याय-विधान’ makes the inherited legal norm explicit without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: Unnatural rendering of the ‘innocence of his eyes’ idiom
    rationale: The phrase ‘अपनी दृष्टि की निष्कपटता में चला’ does not read idiomatically in contemporary Hindi. ‘निष्कपट दृष्टि से काम किया’ preserves the eye/direction metaphor while communicating the sense naturally.
  - severity: low
    issue: Awkward expression for Abraham's commanded judgment
    rationale: Hindi normally gives an order to observe or follow a legal ordinance, rather than ‘giving an order of judgment.’ Recasting this as an ordinance whose observance Abraham commanded his sons clarifies the syntax and legal sense.
  revised_text: क्योंकि उसने निष्कपट दृष्टि से काम किया और न्याय की माँग की; क्योंकि अब्राहम के उस न्याय-विधान के अनुसार, जिसका पालन करने की आज्ञा उसने अपने पुत्रों को दी थी, यहूदा ने चाहा कि उस स्त्री को आग में जला दिया जाए।
  revised_footnotes: []
  revision_rationale: The revision retains the source's defense of Judah's perspective as innocent or straightforward, avoids the rejected ‘desire’ reading, and expresses the legal relation to Abraham's ordinance in natural modern Hindi. ‘उस स्त्री’ appropriately reflects the feminine object of the source's final passive clause.
