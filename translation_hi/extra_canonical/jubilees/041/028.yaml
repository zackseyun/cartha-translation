base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/028.yaml
  text: For he went in the innocence of his eyes and sought judgment, because by the judgment of Abraham, which he commanded his sons, Judah desired that she be burned with fire.
translation:
  language: hi
  text: क्योंकि उसने निष्कपट दृष्टि से काम किया और न्याय की माँग की; क्योंकि अब्राहम के उस न्याय-विधान के अनुसार, जिसका पालन करने की आज्ञा उसने अपने पुत्रों को दी थी, यहूदा ने चाहा कि उस स्त्री को आग में जला दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በየውሀተ፡ አዕይንቲሁ
  choice: अपनी दृष्टि की निष्कपटता में
  rationale: የውሀት निष्कपटता, सरलता या निर्दोष भाव को व्यक्त करता है; इसलिए इसे ‘इच्छा’ नहीं बनाया गया। ‘दृष्टि’ ने አዕይንቲሁ के नेत्र-संबंधी रूपक को बनाए रखा है।
- source_word: ኀሠሠ፡ ኵነኔ
  choice: न्याय की माँग की
  rationale: क्रिया और न्यायवाचक संज्ञा का कानूनी आशय स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: እምፍተሐ፡ አብርሃም
  choice: अब्राहम ... के न्याय ... के अनुसार
  rationale: እም का मूल भाव ‘से’ है, पर इस विधिक प्रसंग में यह निर्णय को कार्रवाई का आधार या मानक बताता है; ‘के अनुसार’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ፈቃደ፡ ይሁዳ
  choice: यहूदा ने चाहा
  rationale: ፈቃደ की इच्छा/संकल्प की प्रत्यक्ष अभिव्यक्ति को बनाए रखा गया है।
- source_word: ይውዐይ፡ በእሳት
  choice: आग में जला दी जाए
  rationale: निष्क्रिय दंडात्मक आशय को सहज आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: यहूदा की मनोवृत्ति का चित्रण
  choice: ‘निष्कपटता’ द्वारा पाठ में दिए गए उसके निर्दोष या सरल दृष्टिकोण को बनाए रखा
  alternative: ‘अपनी आँखों की इच्छा के पीछे’
  rationale: स्रोत का የውሀት इच्छा या वासना नहीं, बल्कि निष्कपटता/सरलता दर्शाता है; वैकल्पिक अर्थ कथानक का आशय उलट देगा।
- issue: अब्राहम के आदेश और यहूदा के निर्णय का संबंध
  choice: ‘उसी के अनुसार’ द्वारा उसे निर्णय का मानक बताया
  alternative: ‘उस न्याय से’
  rationale: शाब्दिक ‘से’ हिन्दी में संबंध को अस्पष्ट रखता; संदर्भ में अब्राहम का आदेश यहूदा की कार्रवाई का विधिक आधार है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। स्रोत के नेत्र-संबंधी मुहावरे को ‘दृष्टि की निष्कपटता’ के रूप में रखा गया है, जबकि कानूनी वाक्य-विन्यास को स्वाभाविक हिन्दी में सँवारा गया है।
