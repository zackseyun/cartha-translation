  yaml_path: translation/extra_canonical/jubilees/041/004.yaml
  text: And Judah said to Onan, his brother,, “Go in to your brother’s wife, and perform a brother-in-law’s duty to her, and raise up offspring for your brother.”
translation:
  language: hi
  text: तब यहूदा ने एर के भाई ओनान[a] से कहा, “अपने भाई की पत्नी के पास जा, उसके प्रति देवर का कर्तव्य निभा और अपने भाई के लिए संतान उत्पन्न कर।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “ओनान, उसका भाई।” गीज़ पदबंध में “उसका” का पूर्वपद प्रत्यक्ष रूप से नहीं दिया गया है; कथा-संदर्भ में इसे एर के लिए समझा जाता है।'
    reason: मूल के सर्वनामगत संक्षेप को दर्ज करते हुए हिन्दी में यहूदा और ओनान के संबंध के बारे में गलत अर्थ से बचने के लिए।
  - marker: b
    text: मूल में अंतिम क्रिया का कर्म प्रत्यक्ष रूप से नहीं दिया गया है; संदर्भ में भाई के लिए संतान उत्पन्न करना निहित है।
    reason: अनुवाद में स्पष्ट किए गए निहित कर्म की जानकारी देने के लिए।
lexical_decisions:
- source_word: ባእ፡ ኀበ፡ ብእሲተ፡ እኁከ
  choice: अपने भाई की पत्नी के पास जा
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप; मूल में यौन-संबंध का संकेत संदर्भ से स्पष्ट है, पर भाषा शिष्ट और अप्रत्यक्ष है।
- source_word: ወረከያ፡ ናዕልተ
  choice: उसके प्रति देवर का कर्तव्य निभा
  rationale: यह मृत भाई की पत्नी के प्रति भाई के वैवाहिक/वंशगत दायित्व को व्यक्त करता है; केवल ‘विवाह कर’ कहना स्रोत के भाव को सीमित कर देता।
- source_word: ወአንሥእ
  choice: और अपने भाई के लिए वंश खड़ा कर
  rationale: क्रिया का शाब्दिक अर्थ ‘उठा/खड़ा कर’ है; संदर्भ में निहित संतान और वंश-वृद्धि को सहज हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘उसका भाई’ का संदर्भ
  choice: मुख्य पाठ में सर्वनामगत अभिव्यक्ति रखकर संदर्भ को खुला रखा
  alternative: ‘एर के भाई ओनान से’ या ‘अपने भाई ओनान से’
  rationale: गीज़ पदबंध አውናን፡ እኁሁ፡ में संबंधसूचक सर्वनाम का संदर्भ व्याकरणतः स्पष्ट नहीं है; कथा-संदर्भ में एर अभिप्रेत हो सकता है, जबकि सतही पठन यहूदा की ओर संकेत कर सकता है। इसलिए अनुवाद में अस्पष्टता को मिटाया नहीं गया।
- issue: अंतिम क्रिया का निहित कर्म
  choice: ‘वंश’ को स्पष्ट किया
  alternative: शाब्दिक ‘उठा’
  rationale: मूल में कर्म व्यक्त नहीं है, पर विवाह-संबंधी प्रसंग में भाई के लिए संतान/वंश उत्पन्न करना स्पष्ट रूप से निहित है। ‘वंश’ व्यक्तिगत संतान और पारिवारिक निरंतरता दोनों को समेटता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आज्ञार्थक एकवचन रूप कथा के पारिवारिक और पितृसत्तात्मक संदर्भ के अनुकूल है। ‘देवर का कर्तव्य’ सामान्य पाठक के लिए बोधगम्य है और स्रोत में निहित प्रथा को किसी बाद की सांप्रदायिक व्याख्या से नहीं बाँधता।
