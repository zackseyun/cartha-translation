base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/027.yaml
  text: And by this he will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.
translation:
  language: hi
  text: और इसके द्वारा वह इस्राएल पर से क्रोध और दंड[a] को टाल देगा। और हमने यहूदा से कहा कि उसके दोनों पुत्रों ने तामार के साथ सहवास नहीं किया था; इसी कारण यहूदा का वंश दूसरे गोत्र के लिए स्थापित हुआ और उखाड़ा नहीं गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति” अथवा “प्रकोप”।
    reason: गीज़ संज्ञा መመቅሠፍተ में दंड के साथ विपत्ति, महामारी, या प्रकोप का अर्थ भी हो सकता है।
lexical_decisions:
- source_word: ወበእሊአሁ
  choice: और इसके द्वारा
  rationale: आरंभिक पदबंध साधन या आधार का भाव देता है; यह अनुवाद उस संबंध को स्पष्ट रखते हुए पूर्ववर्ती प्रसंग की ओर संकेत करता है।
- source_word: መዐተ፡ መመቅሠፍተ
  choice: क्रोध और दंड
  rationale: दोनों संज्ञाओं को अलग रखा गया है। दूसरी संज्ञा दंड, विपत्ति या प्रकोप का भाव दे सकती है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ነገሮሙ
  choice: हमने ... कहा
  rationale: क्रिया के प्रथम पुरुष बहुवचन कथन-स्वर को बनाए रखा गया है; इसे भाववाच्य बनाने से पुस्तक की स्वर्गदूतीय कथावाचक-रचना धुंधली हो जाती।
- source_word: ኢበከቡ፡ ምስሌነ
  choice: उसके साथ सहवास नहीं किया था
  rationale: यौन संबंध के मूल भाव को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक विस्तार के।
- source_word: ዘርአ
  choice: वंश
  rationale: शाब्दिक अर्थ 'बीज' है, पर यहाँ संतान और वंश-परंपरा अभिप्रेत है; हिन्दी में 'वंश' स्वाभाविक और प्रसंगानुकूल है।
- source_word: ነገደ
  choice: गोत्र
  rationale: यह शब्द जनजातीय या वंशगत समूह को सूचित करता है; इस्राएली संदर्भ में 'गोत्र' उपयुक्त है।
- source_word: ወኢይሤረወ
  choice: और उखाड़ा नहीं गया
  rationale: मूल के पौधे को जड़ से उखाड़ने वाले रूपक को सुरक्षित रखा गया है, जो वंश के नष्ट न होने को दर्शाता है।
theological_decisions:
- issue: कथावाचक का प्रथम पुरुष बहुवचन
  choice: हमने यहूदा से कहा
  alternative: यहूदा से कहा गया
  rationale: मूल क्रिया के प्रथम पुरुष बहुवचन और जुबलीज़ की कथात्मक रूपरेखा को बनाए रखा गया है; भाववाच्य विकल्प कथावाचक की पहचान को अनावश्यक रूप से अस्पष्ट करता।
- issue: यहूदा के वंश का दूसरे गोत्र के लिए स्थापित होना
  choice: दूसरे गोत्र के लिए स्थापित हुआ
  alternative: दूसरे गोत्र में स्थापित हुआ
  rationale: मूल में प्रयुक्त संबंध को संप्रदायगत या वंशावलीगत व्याख्या से हल किए बिना यथासंभव खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। 'सहवास' यौन अर्थ को शिष्टता और सटीकता से व्यक्त करता है; 'वंश' और 'गोत्र' बाइबलीय वंशगत संदर्भ को सामान्य पाठक के लिए सुबोध रखते हैं।
