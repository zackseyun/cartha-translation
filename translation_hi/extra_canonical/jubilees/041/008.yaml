  text: And in the fifth year of this week, Shua, the wife of Judah, died. And in the sixth year Judah went up to shear his sheep at Timnah, and they told Tamar, saying, “Behold, your father-in-law is going up to Timnah to shear.”
translation:
  language: hi
  text: और इस सप्ताह के पाँचवें वर्ष में यहूदा की पत्नी शूआ मर गई। छठे वर्ष में यहूदा तिम्ना की ओर अपनी भेड़ों की ऊन कतरने के लिए चढ़ गया। उन्होंने तामार को बताया, “देखो, तुम्हारे ससुर ऊन कतरने के लिए तिम्ना की ओर चढ़ रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱኤል
  choice: शूआ
  rationale: यह यहूदा की पत्नी का व्यक्तिगत नाम है; इसे स्रोत के ध्वन्यात्मक रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: ዘዝሱባዔ
  choice: इस सप्ताह के
  rationale: गीज़ पदबंध का अर्थ ‘इस सप्ताह का/के’ है, न कि ‘सातवें सप्ताह का’; इसलिए संकेतवाचक अर्थ सुरक्षित रखा गया है।
- source_word: ይቅርጽ አባግዒሁ
  choice: अपनी भेड़ों की ऊन कतरने के लिए
  rationale: क्रिया और उसके कर्म का स्वाभाविक हिन्दी रूप; ‘ऊन’ हिन्दी में निहित क्रिया-अर्थ को स्पष्ट करता है।
- source_word: በቴምናታ
  choice: तिम्ना
  rationale: स्थान-नाम का प्रचलित बाइबलीय हिन्दी लिप्यंतरण अपनाया गया है; गमनवाचक संदर्भ में ‘तिम्ना गया’ स्वाभाविक है।
- source_word: ናሁ
  choice: देख
  rationale: सूचना की ओर ध्यान खींचने वाले उद्गार का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: ይቅርጽ
  choice: ऊन कतरने के लिए
  rationale: अंतिम वाक्य में स्रोत केवल ‘कतरने’ को दोहराता है; हिन्दी में आशय स्पष्ट रखने के लिए निहित ‘ऊन’ जोड़ा गया, पर ‘अपनी भेड़ों’ को पुनः नहीं जोड़ा गया।
