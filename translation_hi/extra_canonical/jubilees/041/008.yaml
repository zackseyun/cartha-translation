  register: आधुनिक मानक हिन्दी में सहज, कथात्मक और गरिमापूर्ण शैली रखी गई है। कालक्रम के ‘इस सप्ताह’ को स्रोत के अनुसार सुरक्षित रखा गया है। अंतिम खंड की संक्षिप्तता यथासंभव बनाए रखते हुए हिन्दी में अस्पष्टता से बचने के लिए ‘ऊन कतरने’ कहा गया है।
