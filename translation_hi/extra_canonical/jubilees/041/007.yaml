base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/007.yaml
  text: Remain a widow until my son Shelah grows up, and I will give you to him as a wife. And he grew up, but Bedsu’el, Judah’s wife, did not let Shelah her son to marry, and Bed[su'el] died.
translation:
  language: hi
  text: “जब तक मेरा पुत्र शेलह बड़ा न हो जाए, तब तक विधवा बनी रहो; फिर मैं तुम्हें उसकी पत्नी बना दूँगा।” वह बड़ा हो गया, पर यहूदा की पत्नी बेदसूएल ने अपने पुत्र शेलह को विवाह नहीं करने दिया; और बेद[सूएल][a] मर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ यहाँ नाम के केवल आरम्भिक अक्षरों, ‘बेद’, पर समाप्त हो जाता है; ‘सूएल’ पूर्वसंदर्भ के आधार पर पूरा किया गया है।
    reason: पांडुलिपीय रूप से अपूर्ण नाम की पारदर्शी पुनःस्थापना।
lexical_decisions:
- source_word: ትመዐስቢ
  choice: विधवा बनी रहो
  rationale: यह क्रिया केवल ‘प्रतीक्षा करो’ नहीं, बल्कि विधवा की अवस्था में बने रहने का विशिष्ट अर्थ व्यक्त करती है; इसलिए कानूनी और कथात्मक आशय सुरक्षित रखा गया है।
- source_word: ይልህቅ / ወልህቀ
  choice: बड़ा न हो जाए / वह बड़ा हो गया
  rationale: दोनों रूपों में एक ही मूल का भाव है—पहले अपेक्षित रूप से शेलह के बड़ा होने की बात, फिर उसके वास्तव में बड़ा हो जाने की बात। पुनरुक्ति को स्रोत के अनुसार रखा गया है।
- source_word: ወእሁበኪ፡ ሎቱ፡ ብእሲተ
  choice: फिर मैं तुम्हें उसकी पत्नी बना दूँगा
  rationale: शाब्दिक भाव ‘मैं तुम्हें उसे पत्नी के रूप में दूँगा’ है। आधुनिक हिन्दी में स्वाभाविक और स्पष्ट अभिव्यक्ति चुनी गई है, जबकि विवाह की व्यवस्था करने वाले वक्ता की भूमिका बनी रहती है।
- source_word: ከመ፡ ያውስብ
  choice: विवाह करने
  rationale: क्रिया का आशय पत्नी ग्रहण करने अथवा विवाह करने से है। सहज हिन्दी में ‘विवाह करने’ कहा गया है; किसी अनुल्लिखित स्त्री को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ቤድ
  choice: बेद[सूएल]
  rationale: उपलब्ध पाठ नाम के आरम्भ ‘बेद’ पर कट जाता है। निकट पूर्वसंदर्भ में पूरा नाम बेदसूएल है, इसलिए पुनःस्थापित अंश को कोष्ठकों में रखा गया है।
