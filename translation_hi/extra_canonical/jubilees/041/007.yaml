translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘विधवा बनी रहो’ स्रोत की विशिष्ट सामाजिक-कानूनी बारीकी को बचाता है। नाम ‘Shelah’ को प्रचलित हिन्दी रूप ‘शेलह’ और ‘Bedsu’el’ को ‘बेदसूएल’ के रूप में लिप्यंतरित किया गया है।
