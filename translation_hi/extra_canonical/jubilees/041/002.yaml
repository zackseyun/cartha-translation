base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/002.yaml
  text: For Er his firstborn he took a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.
translation:
  language: hi
  text: उसने अपने पहलौठे पुत्र एर के लिए अराम की बेटियों में से एक पत्नी ली; उसका नाम तामार था। पर एर ने उससे घृणा की और उसके साथ शयन नहीं किया, क्योंकि एर की माँ कनान की बेटियों में से थी, और एर अपनी माँ के कुल में से अपने लिए पत्नी लेना चाहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሩ
  choice: अपने पहलौठे
  rationale: गीज़ पद का अर्थ ‘उसका पहलौठा’ है; एर के संबंध में स्वाभाविक हिन्दी रूप रखा गया।
- source_word: እምነ፡ አዋልደ፡ አራም
  choice: अराम की बेटियों में से
  rationale: स्रोत की वंश-समुदाय सूचक अभिव्यक्ति को निकटता से सुरक्षित रखा गया।
- source_word: ወጸልአ
  choice: बैर रखा
  rationale: क्रिया का मूल भाव ‘घृणा करना/शत्रुता रखना’ है; इसे केवल ‘ठुकराया’ कहकर कमजोर नहीं किया गया।
- source_word: ወኢሰከበ፡ ምስሌሃ
  choice: उसके साथ शयन नहीं किया
  rationale: स्रोत की यौन-संबंध सूचक शिष्ट अभिव्यक्ति का dignified और स्पष्ट हिन्दी समतुल्य।
- source_word: እምነገደ፡ እሙ
  choice: अपनी माँ के कुल में से
  rationale: ነገድ वंश, कुल या जातीय समूह सूचित करता है; प्रसंग में ‘कुल’ सहज और पर्याप्त व्यापक है।
theological_decisions:
- issue: एर की तामार के प्रति प्रतिक्रिया की तीव्रता
  choice: उससे बैर रखा
  alternative: उसे ठुकरा दिया
  rationale: स्रोत-पाठ की क्रिया घृणा अथवा शत्रुता का अधिक प्रबल भाव रखती है; अनावश्यक रूप से उसे हल्का नहीं किया गया।
- issue: आरंभिक कर्ता की पहचान
  choice: उसने
  alternative: यहूदा ने
  rationale: इस पद में नाम स्पष्टतः नहीं है; पूर्ववर्ती प्रसंग से कर्ता समझा जाता है, इसलिए स्रोत की अंतर्निहितता बनाए रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सुबोध। ‘पहलौठा’, ‘शयन’ और ‘कुल’ जैसे बाइबलीय-साहित्यिक शब्द स्रोत की संक्षिप्तता और गंभीरता बनाए रखते हैं।
