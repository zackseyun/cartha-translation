translation:
  language: hi
  text: और वह तिम्ना के मार्ग पर स्थित प्रवेश-द्वार पर बैठ गई[a]। और जब यहूदा जा रहा था, उसने उसे पाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ठहर गई’।
    reason: गीज़ क्रिया बैठने के साथ किसी स्थान पर रहने या ठहरने का भाव भी दे सकती है।
  - marker: b
    text: या ‘उससे मिला’।
    reason: यह क्रिया प्रसंगानुसार किसी को पाने अथवा उससे सामना होने—दोनों अर्थों में समझी जा सकती है।
lexical_decisions:
- source_word: ወነበረት (wa-nabarat)
  choice: और वह … बैठ गई
  rationale: इस प्रसंग में क्रिया किसी स्थान पर बैठने को व्यक्त करती है; स्त्रीलिंग एकवचन रूप को स्पष्ट रखा गया है।
- source_word: አንቀጽ (ʾanqats)
  choice: प्रवेश-द्वार
  rationale: शब्द किसी प्रवेश-स्थान या द्वार को सूचित करता है; आधुनिक हिन्दी में ‘प्रवेश-द्वार’ स्वाभाविक और स्पष्ट है।
- source_word: ፍኖተ፡ ቴምናታ (fənnōta Tēmnāta)
  choice: तिम्ना जानेवाला मार्ग
  rationale: स्थान-संबंध को सहज हिन्दी में लक्ष्य की ओर जानेवाले मार्ग के रूप में व्यक्त किया गया है।
- source_word: ረከባ (rakabā)
  choice: उसने उसे वहाँ पाया
  rationale: मूल क्रिया का प्रमुख अर्थ ‘पाना/पा लेना’ है; ‘वहाँ’ जोड़ने से हिन्दी में आकस्मिक रूप से सामने पाए जाने का भाव स्वाभाविक होता है, बिना इसे पारस्परिक भेंट मानने के।
