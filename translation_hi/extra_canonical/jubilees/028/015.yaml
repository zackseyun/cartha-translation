  text: he brings up sin against himself into heaven, and no one who does this thing is righteous, for
translation:
  language: hi
  text: वह अपने ही विरुद्ध पाप को स्वर्ग तक चढ़ाता है[a], और जो कोई यह काम करता है, वह धर्मी नहीं है[b], क्योंकि
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके कारण उसका पाप स्वर्ग तक चढ़ता है।”
    reason: पूर्ववर्ती अनुवाद में क्रिया और በእንቲአሁ पदबंध की वैकल्पिक समझ को सुरक्षित रखना।
  - marker: b
    text: या, “कोई धर्मी जन यह काम नहीं करता।”
    reason: संबंधवाचक उपवाक्यों की संरचना के वैकल्पिक अर्थ को दर्शाना।
lexical_decisions:
- source_word: አበሳ (ʾabäsa)
  choice: पाप
  rationale: यह शब्द पाप, अपराध या दोष का बोध करा सकता है; इस प्रसंग में ‘पाप’ सबसे स्वाभाविक और व्यापक हिन्दी रूप है।
- source_word: ያዐርግ (yaʿarg)
  choice: चढ़ाता है
  rationale: क्रिया का रूप सकर्मक/प्रेरणार्थक है—‘ऊपर चढ़ाता है’ या ‘चढ़ने देता है’—न कि केवल ‘चढ़ता है’।
- source_word: በእንቲአሁ (baʾəntiahu)
  choice: अपने ही विरुद्ध
  rationale: यहाँ व्यक्ति के अपने ही विरुद्ध स्वर्ग में पाप के आरोपित होने का भाव बनता है; पदबंध की वैकल्पिक कारणवाचक समझ को पादटिप्पणी में रखा गया है।
- source_word: ይጸድቅ (yəṣaddəq)
  choice: धर्मी नहीं है
  rationale: धातु धार्मिक/न्यायसंगत ठहरने या धर्मी होने का अर्थ देती है; वाक्य के निषेधात्मक विधान को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ዘንተ፡ ነገረ (zanta nagara)
  choice: यह काम
  rationale: शाब्दिक अर्थ ‘यह बात/वस्तु’ हो सकता है, पर करने की क्रिया के साथ ‘यह काम’ वर्तमान हिन्दी में स्वाभाविक है।
- source_word: እስመ (ʾəsma)
  choice: क्योंकि
  rationale: पद अगले कथन के लिए कारणसूचक संयोजक है; स्रोत अंश भी इसी पर अधूरा समाप्त होता है।
theological_decisions:
- issue: यह काम करने वाले और धार्मिकता के बीच संबंध
  choice: जो कोई यह काम करता है, वह धर्मी नहीं है
  alternative: कोई धर्मी जन यह काम नहीं करता
  rationale: मुख्य पाठ स्रोत की इस संभावित घोषणा को सामने रखता है कि ऐसा करने वाला धर्मी नहीं है; संबंधवाचक रचना का वैकल्पिक वर्ग-वर्णन पादटिप्पणी में सुरक्षित है।
- issue: पाप का स्वर्ग तक पहुँचना
  choice: व्यक्ति पाप को अपने ही विरुद्ध स्वर्ग तक चढ़ाता है
  alternative: उसके कारण उसका पाप स्वर्ग तक चढ़ता है
  rationale: क्रिया के प्रेरणार्थक रूप के कारण मुख्य पाठ में व्यक्ति को कर्ता और पाप को कर्म रखा गया है; वैकल्पिक पारंपरिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वर्ग तक चढ़ाता है’ स्रोत की ऊर्ध्वगामी छवि और क्रिया की सकर्मकता दोनों को बनाए रखता है। पद के अंत का ‘क्योंकि’ जानबूझकर रखा गया है, क्योंकि उपलब्ध स्रोतांश अगले वाक्य से जुड़ता हुआ यहीं समाप्त होता है।
