lexical_decisions:
- source_word: ምድረ፡ ከናአን
  choice: कनान देश
  rationale: गीज़ पदबंध का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: በህልም
  choice: स्वप्न में
  rationale: मूल के औपचारिक तथा गरिमापूर्ण भाव को बनाए रखता है।
- source_word: ዘተናገረ፡ ሎቱ
  choice: जो उससे कहा गया था
  rationale: मूल के कर्मवाच्य अर्थ को सुरक्षित रखता है और बोलने वाले की पहचान नहीं जोड़ता।
theological_decisions:
- issue: स्वप्न में कही या दिखाई गई बातों के कर्ता की पहचान
  choice: बोलने वाले अथवा प्रकाशन देने वाले की पहचान अनिर्दिष्ट रखी गई
  alternative: जो परमेश्वर ने उससे कहा था
  rationale: मूल पाठ यहाँ कर्ता का स्पष्ट नाम नहीं देता; इसलिए धार्मिक व्याख्या जोड़ने के बजाय उसकी अस्पष्टता सुरक्षित रखी गई।
