  text: all the sheep that were speckled and those that had marks of spots and those that had dark spots, and they would breed again
translation:
  language: hi
  text: वे सभी भेड़ें जो चितकबरी थीं, जिन पर धब्बों के निशान थे और जिन पर गहरे धब्बे थे—वे फिर से प्रजनन करती थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉን፡ አባግዕ
  choice: वे सभी भेड़ें
  rationale: स्रोत में ‘सभी’ और ‘भेड़ें’ का सामूहिक संदर्भ है; हिन्दी में कर्ता को स्पष्ट और स्वाभाविक रूप दिया गया है।
- source_word: ጋሴ
  choice: चितकबरी
  rationale: यह भेड़ों के मिश्रित अथवा बिखरे रंग वाले रूप को व्यक्त करता है और पशुओं के रंग-वर्णन में सहज हिन्दी है।
- source_word: ዘቦ፡ ትእምርተ፡ ኵስኵሰ
  choice: जिन पर धब्बों के निशान थे
  rationale: ‘निशान/चिह्न’ और ‘धब्बे’ दोनों तत्वों को बनाए रखते हुए वाक्यांश को आधुनिक हिन्दी में स्वाभाविक बनाया गया है।
- source_word: ዘቦ፡ ሐመደ፡ ኵስኵሰ
  choice: जिन पर गहरे धब्बे थे
  rationale: रंग की गहरी अथवा मटमैली प्रकृति को अनावश्यक रूप से किसी एक निश्चित रंग में सीमित किए बिना व्यक्त किया गया है।
- source_word: ወይደግማ
  choice: वे फिर से प्रजनन करती थीं
  rationale: अंतिम क्रिया पुनरावृत्ति बताती है; प्रसंगानुसार इसका अभिप्राय पशुओं के दोबारा प्रजनन करने से है। अपूर्ण शाब्दिक ‘फिर करती थीं’ के स्थान पर अपेक्षित क्रिया स्पष्ट की गई है।
