  text: Leah conceived and bore Jacob a second son, and he called his name Simeon, on the twenty-first.
translation:
  language: hi
  text: लिआ गर्भवती हुई और उसने याकूब के लिए दूसरे पुत्र को जन्म दिया। याकूब ने उसका नाम शिमोन रखा, इक्कीसवें दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልያ
  choice: लिआ
  rationale: व्यक्तिनाम Leah का आधुनिक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: ወፀንሰት ወወለደት
  choice: गर्भवती हुई और उसने ... जन्म दिया
  rationale: दोनों क्रियाएँ स्त्रीलिंग एकवचन हैं और लिआ को कर्ता बताती हैं।
- source_word: ለያዕቆብ
  choice: याकूब के लिए
  rationale: गीज़ के संबंधसूचक उपसर्ग का निकट और स्वाभाविक प्रतिरूप; आशय है कि उसने याकूब के लिए/याकूब को पुत्र जना।
- source_word: ወልደ ካልአ
  choice: दूसरे पुत्र
  rationale: शाब्दिक अर्थ ‘दूसरा पुत्र’; हिन्दी वाक्य में कर्म के रूप में स्वाभाविक बनाया गया है।
- source_word: ወጸውዐ ስሞ ስምዖን
  choice: उसने उसका नाम शिमोन रखा
  rationale: ጸውዐ तीसरे पुरुष पुल्लिंग एकवचन है; अतः नाम रखने वाला याकूब है, भले हिन्दी सर्वनाम संदर्भ से समझा जाए।
- source_word: አመ ፲ሥራ
  choice: यह इक्कीसवें दिन हुआ
  rationale: कालसूचक पद को हिन्दी में स्पष्ट पूर्ण वाक्यांश बनाया गया; दिन किस महीने का है, यह पद नहीं बताता।
theological_decisions:
- issue: शिमोन का नाम किसने रखा
  choice: पुल्लिंग ‘उसने’ द्वारा याकूब को नामकर्ता बनाए रखा
  alternative: स्त्रीलिंग ‘उसने’ द्वारा लिआ को नामकर्ता मानना
  rationale: स्रोत की ጸውዐ क्रिया पुल्लिंग एकवचन है। उत्पत्ति-वृत्तांत से सामंजस्य बैठाने के लिए इसे स्त्रीलिंग करना स्रोत की विशिष्टता मिटा देगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्रोत का आरंभिक संयोजक हिन्दी में नहीं दोहराया गया। नामकरण में पुल्लिंग कर्ता बनाए रखने के लिए दूसरा वाक्य रखा गया, जिससे निकटतम पुल्लिंग संदर्भ याकूब स्पष्ट रहे।
