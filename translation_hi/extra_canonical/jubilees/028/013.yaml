translation:
  language: hi
  text: इस प्रकार यह ठहराया गया है और स्वर्गीय पट्टिकाओं पर लिखा है कि कोई भी छोटी बेटी को न दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥሩዕ
  choice: ठहराया गया है
  rationale: यह शब्द किसी स्थापित या निर्धारित विधान को व्यक्त करता है; निष्क्रिय रूप मूल की विधिक गंभीरता बनाए रखता है।
- source_word: ጽሑፍ
  choice: लिखा है
  rationale: मूल में लिखित और स्थायी अभिलेख का भाव है; हिन्दी में सहज रहते हुए उसे सीधे व्यक्त किया गया है।
- source_word: ጽላተ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: यह शाब्दिक रूप से ‘स्वर्ग की पट्टिकाएँ’ है; ‘स्वर्गीय पट्टिकाएँ’ प्राकृतिक और गरिमापूर्ण हिन्दी है।
- source_word: ወለተ እንተ ትንእስ
  choice: छोटी बेटी
  rationale: वाक्यांश आयु में छोटी बेटी को सूचित करता है; प्रसंग से परे ‘सबसे छोटी’ जोड़ना उचित नहीं।
theological_decisions:
- issue: स्वर्गीय पट्टिकाओं पर विधान का स्वरूप
  choice: ‘ठहराया गया है और ... लिखा है’ दोनों क्रियाएँ रखी गईं
  alternative: ‘स्वर्गीय पट्टिकाओं पर यह नियम लिखा है’
  rationale: मूल में निर्धारित होने और लिखे होने के दो अलग भाव हैं; उन्हें मिलाने से अभिव्यक्ति का विधिक और धर्मवैचारिक बल घट जाता।
- issue: अपूर्ण निषेध का संरक्षण
  choice: पद को ‘छोटी बेटी को न दे’ पर समाप्त रखा गया
  alternative: प्रसंग के आधार पर कोई कर्मपूरक जोड़ना
  rationale: दिए गए स्रोत-पद में वाक्य इसी बिंदु पर समाप्त होता है; अनकहा कर्मपूरक जोड़कर अस्पष्टता को कृत्रिम रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्रोत-सन्निकट शैली। ‘पट्टिकाओं’ से अभिलेखित स्वर्गीय फलक का बिंब सुरक्षित रखा गया है।
