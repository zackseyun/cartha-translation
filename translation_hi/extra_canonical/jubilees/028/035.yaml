translation:
  language: hi
  text: याकूब के लिए—रूबेन, शिमोन, लेवी और यहूदा—और उसने याकूब से कहा, “बिल्हा के पास जा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम गीज़ वाक्यांश का पाठ कठिन है। संभवतः पाठ-सुधार के आधार पर अर्थ है, “बिल्हा के पास जा।” एक वैकल्पिक निर्वचन है: “उसने बिल्हा से कहा, ‘यह बिल्हा है।’”'
    reason: मुख्य पाठ के संदर्भानुकूल पाठ-सुधार को बताते हुए उपलब्ध कठिन पाठ से निकले वैकल्पिक निर्वचन को सुरक्षित रखना।
lexical_decisions:
- source_word: ለያዕቆብ
  choice: याकूब के लिए
  rationale: गीज़ के संबंधसूचक ለ को स्वाभाविक हिन्दी में ‘के लिए’ रखा गया है; यह खंड पिछले संदर्भ से जारी संतानों की सूची का अंश है।
- source_word: ሮቤል ወስምዖን ወሌዊ ወይሁዳ
  choice: रूबेन, शिमोन, लेवी और यहूदा
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं और बार-बार आए संयोजक ወ को हिन्दी सूची की स्वाभाविक रचना में व्यक्त किया गया है।
- source_word: ወትቤሎ
  choice: और उसने उससे कहा
  rationale: क्रिया का स्त्रीलिंग कर्ता और पुल्लिंग एकवचन कर्म स्पष्ट रखा गया है; संदर्भ में यह याकूब को संबोधन है।
- source_word: ባላ፡ ኀበ፡ ባላ፡
  choice: बिल्हा के पास जा
  rationale: पाठ कठिन अथवा भ्रष्ट प्रतीत होता है। संदर्भ और प्रस्तावित पाठ-सुधार के आधार पर इसे बिल्हा के पास जाने की आज्ञा समझा गया है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: राहेल द्वारा याकूब को बिल्हा के पास भेजने का कथन
  choice: “बिल्हा के पास जा।”
  alternative: “बिल्हा के साथ संबंध बना।”
  rationale: ‘के पास जा’ मूल मुहावरे की शिष्ट और कुछ हद तक अप्रत्यक्ष प्रकृति बनाए रखता है; प्रसंग से वैवाहिक/यौन आशय समझ आता है, पर अनुवाद उसे मूल से अधिक स्पष्ट नहीं करता।
- issue: अंतिम गीज़ वाक्यांश की पाठगत अनिश्चितता
  choice: मुख्य पाठ में संदर्भानुकूल पाठ-सुधार का अर्थ
  alternative: “उसने बिल्हा से कहा, ‘यह रही बिल्हा।’”
  rationale: ወትቤሎ में पुल्लिंग कर्मसूचक प्रत्यय ‘उससे/उसे’ का समर्थन करता है, इसलिए बिल्हा को संबोधित मानना कठिन है। फिर भी उपलब्ध रूप भ्रष्ट या गलत पढ़ा हुआ हो सकता है, अतः वैकल्पिक पुराना निर्वचन पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। पद पिछले वाक्य से जुड़ा खंड है, इसलिए आरंभिक सूची-रचना और डैश बनाए गए हैं। ‘के पास जा’ जानबूझकर शिष्ट और अप्रत्यक्ष है।
