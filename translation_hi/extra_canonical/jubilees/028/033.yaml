translation:
  language: hi
  text: उसने कोई संतान नहीं जनी, और उसने याकूब से कहा, “मुझे संतान दो।” याकूब ने कहा, “क्या मैंने तुमसे कुछ रोक रखा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትወልድ
  choice: उसने कोई संतान नहीं जनी
  rationale: नकारात्मक स्त्रीलिंग क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया; प्रसंगानुसार निहित कर्म ‘संतान’ स्पष्ट किया।
- source_word: ውሉደ
  choice: संतान
  rationale: शाब्दिक बहुवचन ‘बच्चे’ के बजाय हिन्दी में सामूहिक और स्वाभाविक ‘संतान’ चुना, जो जन्म देने के प्रसंग में उपयुक्त है।
- source_word: ከላእኩ፡ እምኔኪ
  choice: मैंने तुम्हें इससे वंचित रखा है
  rationale: मूल में ‘तुमसे रोक रखा/वंचित रखा’ का भाव है। ‘इससे’ पूर्वोक्त संतान की ओर संकेत करता है, पर अपूर्ण स्रोत-वाक्य में कोई नया कर्ता या ईश्वर-संबंधी स्पष्टीकरण नहीं जोड़ता।
theological_decisions:
- issue: याकूब के उत्तर का अपूर्ण और तनावपूर्ण स्वरूप
  choice: “क्या मैंने तुम्हें इससे वंचित रखा है?”
  alternative: “क्या मैं परमेश्वर हूँ, जिसने तुम्हें गर्भ का फल नहीं दिया?”
  rationale: दिए गए गीइज़ पाठ में केवल ‘क्या मैंने तुमसे रोक रखा है?’ के अनुरूप अंश है। उत्पत्ति 30:2 या अन्य पाठ-परंपरा से ईश्वर और गर्भफल संबंधी सामग्री जोड़ना मूल साक्ष्य से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की संक्षिप्तता तथा मूल पाठ में विद्यमान अधूरा-सा प्रश्न सुरक्षित रखा गया है।
