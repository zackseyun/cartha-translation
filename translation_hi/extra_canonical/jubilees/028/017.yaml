  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। ‘छोटी’ और ‘बड़ी’ स्रोत के स्त्रीलिंग तथा संक्षिप्त पारिवारिक संकेत को सुरक्षित रखते हैं; ‘बेटी’ या ‘बहन’ जोड़कर संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
