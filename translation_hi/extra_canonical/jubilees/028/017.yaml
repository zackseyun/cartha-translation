review_pass:
  verdict: revise
  source_fidelity: The draft preserves the imperative, the coordinated prohibitions to take and give, and the contrast between the younger and elder women. However, its temporal construction is awkward and can momentarily obscure that giving the elder is the prior condition.
  naturalness: ‘यह बात मानो’ is understandable but is less direct than the source’s imperative ‘Do this thing.’ ‘बड़ी को पहले देने से पहले’ redundantly repeats ‘पहले’ and is syntactically cumbersome in modern Hindi.
  terminology: ‘छोटी’ and ‘बड़ी’ appropriately retain the source’s feminine and deliberately non-specific references without adding ‘daughter’ or ‘sister.’ No doctrinal terminology is involved.
  issues:
  - severity: medium
    issue: Opening imperative is rendered as ‘यह बात मानो।’
    rationale: The source and English audit trail command that an action be done. ‘यह करो’ is a more direct, faithful modern-Hindi equivalent than ‘मानो,’ which can suggest accepting or obeying a statement.
  - severity: medium
    issue: The prior-condition clause is awkwardly phrased.
    rationale: ‘बड़ी को पहले देने से पहले’ repeats the temporal marker and is less natural. ‘पहले बड़ी को दिए बिना’ clearly expresses that the elder must first be given before the younger may be taken or given.
  revised_text: 'यह करो: वे पहले बड़ी को दिए बिना छोटी को न लें या न दें।'
