  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግበሩ፡ ዘንተ፡ ቃለ
  choice: यह बात मानो
  rationale: शाब्दिक अर्थ ‘यह वचन/बात करो’ है; प्रसंग में यह किसी स्थापित वैवाहिक रीति का पालन करने की आज्ञा है। ‘मानो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए आदेश का बल बनाए रखता है।
- source_word: አይንሥኡ፡ ወአየሀቡ
  choice: न लें, न दें
  rationale: दोनों समन्वित क्रियाओं—‘लेना’ और ‘देना’—को यथावत रखा गया है, ताकि पाठ की व्यापक और कुछ हद तक अस्पष्ट अभिव्यक्ति बनी रहे।
- source_word: እንተ፡ ትንእስ
  choice: छोटी
  rationale: स्त्रीलिंग रूप विवाहयोग्य छोटी/कम उम्र की स्त्री, अर्थात छोटी बेटी या बहन, की ओर संकेत करता है; स्रोत की संक्षिप्तता बनाए रखने के लिए ‘छोटी’ चुना गया।
- source_word: ያቅድሙ፡ እንተ፡ ትልህቅ
  choice: बड़ी को पहले देने
  rationale: ‘पहले करना/प्राथमिकता देना’ और बड़ी स्त्री के उल्लेख को प्रसंगानुकूल विवाह में पहले दिए जाने के रूप में व्यक्त किया गया है।
