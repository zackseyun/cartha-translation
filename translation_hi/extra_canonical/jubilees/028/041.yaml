  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘उसने भी’ स्रोत की कर्ता-केंद्रित संरचना को दर्शाता है। अंतिम ‘जन्म दिया’ को स्रोत की तरह अपूर्ण रखा गया है, क्योंकि पद संभवतः अगले अंश में जारी रहता है।
