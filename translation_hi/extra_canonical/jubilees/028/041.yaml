  text: she also took and gave her maidservant Zilpah to Jacob as a wife, and she conceived and bore
translation:
  language: hi
  text: उसने भी अपनी दासी ज़िल्पा को लिया और पत्नी के रूप में याकूब को दे दिया; और वह गर्भवती हुई और उसने जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይእቲኒ
  choice: उसने भी
  rationale: स्वतंत्र स्त्रीलिंग सर्वनाम और ‘भी’ सूचक परसर्ग को कर्ता के साथ रखकर पिछली समानांतर घटना से संबंध सुरक्षित रखा गया है।
- source_word: ዜልፋሃ ለአኪታ
  choice: अपनी दासी ज़िल्पा को
  rationale: नाम और उसके संबंधसूचक पद को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ለያዕቆብ ብእሲተ
  choice: पत्नी के रूप में याकूब को
  rationale: शाब्दिक अर्थ ‘याकूब को पत्नी [होने] के लिए’ है; वर्तमान हिन्दी में ‘पत्नी के रूप में’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ወፀንሰት ወወለደት
  choice: और वह गर्भवती हुई और उसने जन्म दिया
  rationale: दोनों क्रमिक क्रियाओं को अलग-अलग सुरक्षित रखा गया है; स्रोत में संतान या लिंग यहाँ निर्दिष्ट नहीं है।
