  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। पद-विभाजन से मूल पाठ आरम्भ में खंडित प्रतीत होता है, इसलिए पूर्ण अर्थ के लिए पूरक क्रिया को वर्ग कोष्ठकों में रखा गया है। ‘अपनी’ का संदर्भ लाबान है; ‘उसे’ का अंतिम संदर्भ याकूब है।
