  text: '[He took] Leah his elder daughter, and gave her to Jacob as a wife, and he gave her Zilpah his maidservant as a handmaid.'
translation:
  language: hi
  text: '[उसने] अपनी बड़ी बेटी लिआ को [लिया] और उसे याकूब को पत्नी के रूप में दे दिया। उसने अपनी दासी ज़िल्पा को भी लिआ को उसकी सेविका के रूप में दे दिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትልህቅ
  choice: बड़ी
  rationale: यह लिआ को आयु में बड़ी बेटी बताता है; आधुनिक हिन्दी में ‘बड़ी बेटी’ स्वाभाविक और स्पष्ट है।
- source_word: ብእሲተ
  choice: पत्नी
  rationale: यह स्त्री/पत्नी के अर्थ में प्रयुक्त है; प्रसंग विवाह का है, इसलिए ‘पत्नी’ उपयुक्त है।
- source_word: አመተ
  choice: दासी
  rationale: यह स्त्री दास अथवा सेविका को सूचित करता है; ज़िल्पा की सामाजिक स्थिति व्यक्त करने के लिए ‘दासी’ रखा गया है।
- source_word: ለእኪት
  choice: सेविका
  rationale: अंतिम पद घरेलू स्त्री-सेविका की भूमिका बताता है; पहली बार आए ‘दासी’ की अनावश्यक पुनरावृत्ति से बचते हुए भूमिका स्पष्ट की गई है।
