  rationale: शाब्दिक भाव ‘लिआ ने उसका नाम गाद पुकारा’ है; आधुनिक हिन्दी में नामकरण के लिए ‘नाम ... रखा’ अधिक स्वाभाविक और अर्थनिष्ठ है।
