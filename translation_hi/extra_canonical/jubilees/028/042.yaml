  rationale: तिथि के तीनों घटक—बारहवाँ दिन, आठवाँ महीना और तीसरा वर्ष—स्रोत के क्रम-संबंध को स्पष्ट रखते हुए स्वाभाविक हिन्दी में दिए गए हैं।
