lexical_decisions:
- source_word: ዘሱባዔ፡ ራብዕ
  choice: चौथे सप्ताह में
  rationale: खंडित गीइज़ पदबंध का स्वाभाविक हिन्दी रूप; यह वाक्य पिछले संदर्भ से जुड़ा हुआ है।
- source_word: ወደገመ፡ ቦአ፡ ኀቤሃ
  choice: फिर वह उसके पास गया
  rationale: शाब्दिक अर्थ ‘उसने फिर उसके पास प्रवेश किया’; दाम्पत्य संबंध के शिष्ट बाइबलीय संकेत को हिन्दी में बनाए रखा गया है।
- source_word: ወፀንሰት
  choice: और वह गर्भवती हुई
  rationale: स्त्रीलिंग क्रिया का सीधा और सहज अनुवाद।
- source_word: ወወለደት፡ ሎቱ፡ ወልደ፡ ካልአ
  choice: और उसने उसके लिए दूसरे पुत्र को जन्म दिया
  rationale: ‘उसके लिए’ से मूल का अप्रत्यक्ष कर्म ሎቱ सुरक्षित रहता है और ካልአ का क्रमसूचक अर्थ ‘दूसरा’ व्यक्त होता है।
- source_word: ወጸውዐት
  choice: और उसने उसका नाम रखा—
  rationale: स्रोत इसी क्रिया पर अधूरा समाप्त होता है; हिन्दी में अपेक्षित नाम अगले अंश में आने का संकेत डैश से दिया गया है।
