  text: And a daughter was born, whose name was Dinah, in the seventh month, in the seventh year of the sixth week of the fourth jubilee. And He had mercy on her,
translation:
  language: hi
  text: और एक बेटी जन्मी, जिसका नाम दीना था। यह चौथी जुबली के छठे सप्ताह के सातवें वर्ष के सातवें महीने में हुआ। और उसने उस पर दया की,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल क्रिया में कर्ता पुल्लिंग एकवचन और कर्म स्त्रीलिंग एकवचन है; इस पद में दोनों के नाम स्पष्ट रूप से नहीं दिए गए हैं।
    reason: अंतिम क्रिया में निहित व्याकरणिक लिंग और वचन को स्पष्ट करता है, बिना कर्ता या स्त्री-कर्म की पहचान पाठ में जोड़ने के।
lexical_decisions:
- source_word: ስማ፡ ዲና
  choice: जिसका नाम दीना रखा गया
  rationale: शाब्दिक अर्थ ‘उसका नाम दीना’ है; जन्म-वृत्तांत के स्वाभाविक आधुनिक हिन्दी रूप में नामकरण स्पष्ट किया गया है।
- source_word: ሳብዕ፡ ወርኅ
  choice: सातवें महीने
  rationale: समय-सूचक गीइज़ पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: यह सात वर्षों के कालखंड को सूचित करता है; ‘सप्ताह’ मूल की सात-इकाई संरचना बनाए रखता है।
- source_word: ተሣሀላ
  choice: दया की
  rationale: क्रिया का अर्थ दया/करुणा करना है; पुल्लिंग एकवचन कर्ता और स्त्रीलिंग कर्म-प्रत्यय को ‘उसने उस पर’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम वाक्य के अव्यक्त पुल्लिंग कर्ता की पहचान
  choice: उसने उस पर दया की
  alternative: परमेश्वर ने उस पर दया की
  rationale: गीइज़ में कर्ता पुल्लिंग एकवचन है और स्त्रीलिंग कर्म ‘उस पर’ व्यक्त है, पर इस पद में कर्ता का नाम नहीं है। इसलिए परमेश्वर की पहचान पाठ में जोड़ने के बजाय वास्तविक संदर्भगत अस्पष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। कालगणना की क्रमबद्ध संरचना ज्यों की त्यों रखी गई है और अंतिम वाक्य की व्याकरणिक जानकारी को सुरक्षित रखते हुए उसकी संदर्भगत अस्पष्टता फुटनोट में स्पष्ट की गई है।
