translation:
  language: hi
  text: और उसने याकूब के एक पुत्र को जन्म दिया, और याकूब ने महीने के चौदहवें दिन उसका नाम रूबेन रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘नौवें महीने का चौदहवाँ दिन’ है।
    reason: प्रदत्त आलोचनात्मक पाठ में महीने की संख्या नहीं है, पर कुछ पांडुलिपियों में ‘नौवाँ’ मिलता है।
lexical_decisions:
- source_word: ወወለደት፡ ለያዕቆብ፡ ወልደ፡
  choice: उसने याकूब के लिए एक पुत्र को जन्म दिया
  rationale: स्त्रीलिंग एकवचन क्रिया ወለደት को स्पष्ट रखते हुए याकूब के साथ प्रयुक्त संबंधसूचक ለ का निकट और स्वाभाविक अर्थ दिया गया है।
- source_word: ወጸውዐ፡ ስሞ፡
  choice: याकूब ने उसका नाम … रखा
  rationale: ጸውዐ पुरुषलिंग एकवचन है, इसलिए पिछले स्त्रीलिंग कर्ता से भिन्न पुरुष कर्ता को संदर्भानुसार याकूब के रूप में स्पष्ट किया गया; हिंदी में ‘नाम रखा’ स्वाभाविक है।
- source_word: ሮቤል፡
  choice: रूबेन
  rationale: गीज़ रूप ‘रोबेल’ के स्थान पर इस बाइबिलीय व्यक्ति के प्रचलित हिंदी नाम ‘रूबेन’ का प्रयोग पहचान और निरंतरता के लिए किया गया है।
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡
  choice: यह महीने का चौदहवाँ दिन था
  rationale: प्रदत्त पाठ केवल ‘महीने के चौदहवें दिन’ कहता है; उसमें महीने की क्रम-संख्या नहीं है। हिंदी में इसे पूर्ण और सहज वाक्य बनाया गया है।
theological_decisions:
- issue: बालक का नाम किसने रखा
  choice: याकूब ने
  alternative: उसने/और नाम रखा
  rationale: गीज़ क्रिया ጸውዐ तीसरे पुरुष पुल्लिंग एकवचन है, जबकि जन्म देने वाली क्रिया स्त्रीलिंग है; अतः कर्ता-परिवर्तन को बनाए रखा गया है और संदर्भ के अनुसार याकूब को स्पष्ट किया गया है।
- issue: महीने की पहचान
  choice: मुख्य पाठ में केवल ‘महीने का’
  alternative: ‘नौवें महीने का’
  rationale: प्रदत्त गीज़ पाठ में ‘नौवाँ’ शब्द नहीं है; उसे मुख्य पाठ में जोड़ना स्रोत से आगे जाना होगा। पांडुलिपीय पाठांतर को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। स्त्रीलिंग और पुल्लिंग क्रियाओं से सूचित कर्ता-परिवर्तन को स्पष्ट रखा गया है तथा अनुपस्थित ‘नौवें’ को मुख्य पाठ में नहीं जोड़ा गया।
