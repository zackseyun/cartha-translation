translation:
  language: hi
  text: पहला[a], इस सप्ताह के छठे वर्ष में। फिर याकूब उसके पास गया, और वह गर्भवती हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में केवल ‘पहला’ है; संभवतः यह पिछले वाक्य से जुड़ा हुआ है।
    reason: पद-विभाजन के कारण आरंभिक शब्द का व्याकरणिक संबंध अस्पष्ट है; अनुवाद में इस वास्तविक अस्पष्टता को बनाए रखा गया है।
lexical_decisions:
- source_word: ቀዳማዊ
  choice: पहला
  rationale: मूल गीइज़ का अर्थ ‘पहला’ अथवा ‘प्रथम’ है। खंड-विभाजन के कारण यह शब्द यहाँ अधूरा-सा प्रतीत होता है, फिर भी इसे छोड़ा नहीं गया।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: यह शब्द सात की अवधि को सूचित करता है; जुबिली ग्रंथ के कालक्रम में यहाँ सात वर्षों के ‘सप्ताह’ का संकेत है।
- source_word: ደገመ
  choice: फिर
  rationale: क्रिया का अर्थ किसी कार्य को दोबारा करना है; स्वाभाविक हिन्दी में ‘फिर’ पूर्व क्रिया की पुनरावृत्ति व्यक्त करता है।
- source_word: ቦአ፡ ኀቤሃ
  choice: उसके पास गया
  rationale: शाब्दिक भाव ‘उसके यहाँ/उसके पास प्रवेश किया’ है और प्रसंग में यह दाम्पत्य संबंध का विनम्र मुहावरा है।
- source_word: ፀንሰት
  choice: वह गर्भवती हुई
  rationale: स्त्रीलिंग क्रिया गर्भधारण को स्पष्ट रूप से व्यक्त करती है।
