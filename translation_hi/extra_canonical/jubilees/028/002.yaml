translation:
  language: hi
  text: और उसने उसकी बेटी राहेल के बदले एक सप्ताह तक उसकी सेवा की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् वर्षों का एक सप्ताह—सात वर्ष।
    reason: ‘एक सप्ताह’ स्रोत की अभिव्यक्ति को बनाए रखता है; यह पादटिप्पणी जुबिलीज़ की कालगणना में उसके आशय को स्पष्ट करती है।
lexical_decisions:
- source_word: ወተቀንየ፡ ሎቱ፡
  choice: और उसने ... उसकी सेवा की
  rationale: क्रिया और परोक्ष कर्म को स्वाभाविक हिन्दी में रखा गया है; संदर्भ में ‘उसकी’ लाबान की ओर संकेत करता है।
- source_word: ህየንተ፡ ራሔል፡ ወለቱ፡
  choice: उसकी बेटी राहेल के लिए
  rationale: ህየንተ को विनिमय/प्रतिफल के अर्थ में ‘के लिए’ और ወለቱ को स्पष्ट रूप से ‘उसकी बेटी’ अनूदित किया गया है।
- source_word: ሱባዔ፡ አሐደ።
  choice: एक सप्ताह तक
  rationale: शाब्दिक अर्थ ‘एक सप्ताह’ है। जुबिलीज़ की कालगणना में यह वर्षों का सप्ताह हो सकता है, पर मुख्य पाठ में स्रोत की विशिष्ट अभिव्यक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘एक सप्ताह’ का कालगत आशय
  choice: मुख्य पाठ में ‘एक सप्ताह’
  alternative: ‘सात वर्ष’
  rationale: स्रोत की कालगणनात्मक शब्दावली और उसकी संभावित साहित्यिक महत्ता को सुरक्षित रखते हुए अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘सेवा की’ स्रोत की क्रिया के निकट है; ‘काम किया’ अधिक बोलचाल का विकल्प होता, पर यहाँ औपचारिक कथात्मक शैली बनाए रखी गई है।
