lexical_decisions:
- source_word: ሱባዔ፡ ቀዳማ
  choice: पहले सप्ताह
  rationale: ‘ሱባዔ’ सात दिनों की अवधि या सप्ताह को सूचित करता है; विशेषण ‘ቀዳማ’ के साथ स्वाभाविक हिन्दी रूप ‘पहले सप्ताह’ है।
- source_word: ሰቡዕ፡ ዕለት
  choice: सात दिन
  rationale: यह पदबंध स्पष्ट रूप से सात दिनों की अवधि बताता है।
- source_word: ዘግዝአ፡ ዘልያ
  choice: लिआ के विवाह-उत्सव के
  rationale: प्रसंग और अंग्रेज़ी परामर्श-पाठ के अनुसार यह लिआ से संबंधित वैवाहिक उत्सव की अवधि है; ‘विवाह-उत्सव’ आधुनिक हिन्दी में अर्थ को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ኀለፈ
  choice: बीत गए
  rationale: समयावधि के पूरा हो जाने के लिए सहज और सटीक हिन्दी प्रयोग।
