translation:
  language: hi
  text: यूसुफ़। याकूब ने लाबान से कहा, “मेरी पत्नियाँ और मेरे बच्चे मुझे दे दे, और मैं अपने पिता इसहाक के पास जाऊँगा और बनाऊँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य उपलब्ध पद-विभाजन में अधूरा है; अंतिम क्रिया का अर्थ “करूँगा” भी हो सकता है।
    reason: मूल गीइज़ ወእግበር का अर्थ ‘और मैं करूँगा/बनाऊँगा’ है, पर उसका कर्म इस खंड में नहीं दिया गया।
lexical_decisions:
- source_word: ዮሴፍ
  choice: यूसुफ़
  rationale: खंड में केवल नाम है; ‘जब यूसुफ़ उत्पन्न हुआ’ जोड़ना इस उपलब्ध गीइज़ पाठ से समर्थित नहीं है।
- source_word: ሀበኒ
  choice: मुझे दे दे
  rationale: प्रत्यक्ष आज्ञार्थक रूप को लाबान से याकूब के सीधे संबोधन में स्वाभाविक हिन्दी में रखा गया है।
- source_word: አንስትየየ፡ ወውሉድየ
  choice: मेरी पत्नियाँ और मेरे बच्चे
  rationale: दोनों स्वत्वसूचक बहुवचन संज्ञाओं का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: ወእሖር፡ ኀበ፡ አቡየ፡ ይስሐቅ
  choice: और मैं अपने पिता इसहाक के पास जाऊँगा
  rationale: गमन और गंतव्य को निकटता से मूल शब्दक्रम के अनुसार व्यक्त किया गया है।
- source_word: ወእግበር
  choice: और बनाऊँगा
  rationale: यह ገብረ ‘करना/बनाना’ से है, न कि ‘लौटना’ से। खंड-विभाजन के कारण कर्म अगले पद में हो सकता है; इसलिए अपूर्णता को मनमाने ढंग से नहीं भरा गया।
