- source_word: እስመ ርእየ
  choice: क्योंकि उसने देखा
  rationale: खंड मूल में यहीं अपूर्ण समाप्त होता है; पुल्लिंग एकवचन कर्ता को ‘उसने’ से व्यक्त कर अस्पष्ट संदर्भ को बनाए रखा गया है।
