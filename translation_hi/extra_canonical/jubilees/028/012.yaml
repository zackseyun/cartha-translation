translation:
  language: hi
  text: हमारे देश में छोटी बेटी को बड़ी बेटी से पहले ब्याह देना उचित नहीं है, क्योंकि—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በምድርነ
  choice: हमारे देश में
  rationale: शाब्दिक अर्थ ‘हमारी भूमि में’ है; यहाँ स्थानीय रीति के संदर्भ में ‘हमारे देश में’ स्वाभाविक और सटीक है।
- source_word: ውሂበ
  choice: ब्याह देना
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना’ है, पर इस प्रसंग में बेटी को विवाह में देना अभिप्रेत है; ‘ब्याह देना’ आधुनिक हिन्दी में इसे स्पष्ट और सहज रखता है।
- source_word: እንተ ትንእስ ... እንተ ትልህቅ
  choice: छोटी बेटी को बड़ी बेटी से पहले
  rationale: स्त्रीलिंग रूप और विवाह-प्रसंग को हिन्दी में स्पष्ट करने के लिए ‘बेटी’ जोड़ा गया है; छोटी और बड़ी का क्रम मूल के अनुसार रखा गया है।
- source_word: አኮ ርቱዐ
  choice: उचित नहीं है
  rationale: यह पदबंध किसी कार्य के सही या उचित न होने को व्यक्त करता है; ‘उचित नहीं’ dignified तथा सामान्य आधुनिक हिन्दी है।
- source_word: እስመ
  choice: क्योंकि—
  rationale: पद अगले वाक्यांश की ओर खुलता है; डैश से यह संकेत रखा गया है कि कारण अगले पद में पूरा होगा।
