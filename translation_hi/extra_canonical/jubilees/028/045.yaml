  yaml_path: translation/extra_canonical/jubilees/028/045.yaml
  text: And Jacob went in to Leah, and she conceived and bore a son, and she called his name Issachar, on the fourth day.
translation:
  language: hi
  text: और याकूब लिआ के पास गया[a]। वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया। उसने चौथे दिन उसका नाम इस्साकार रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उसने लिआ के साथ दांपत्य संबंध बनाया।
    reason: मूल भाषा के शिष्ट संकेत का आशय आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ቦአ፡ ... ኀበ፡ ሊያ፡
  choice: लिआ के पास गया
  rationale: मूल का शाब्दिक भाव ‘लिआ के पास भीतर गया’ है और यह दांपत्य संबंध के लिए प्रयुक्त शिष्ट संकेत है। हिन्दी में ‘के पास गया’ उसी संकेतात्मकता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ፀንሰት፡
  choice: गर्भवती हुई
  rationale: यह आधुनिक और सहज हिन्दी में गर्भधारण का स्पष्ट भाव देता है।
- source_word: ጸውዐት፡ ስሞ፡ ይሳኮር፡
  choice: उसने उसका नाम इस्साकार रखा
  rationale: ‘नाम पुकारा’ के मूल से स्वाभाविक हिन्दी नामकरण-वाक्य बनाया गया है; ‘इस्साकार’ प्रचलित बाइबलीय नाम-रूप है।
- source_word: በራብዑ፡
  choice: यह चौथा दिन था
  rationale: मूल में ‘चौथे [दिन]’ का संक्षिप्त रूप है। स्वतंत्र वाक्य इसे दिन की गणना के रूप में स्पष्ट करता है, बिना अतिरिक्त काल-संबंध जोड़ने के।
theological_decisions:
- issue: याकूब के लिआ के पास जाने का दांपत्य अर्थ
  choice: मुख्य पाठ में शिष्ट संकेतात्मक भाषा रखी गई और पादटिप्पणी में अर्थ स्पष्ट किया गया।
  alternative: ‘याकूब ने लिआ के साथ सहवास किया’
  rationale: मूल की व्यंजना और गरिमा सुरक्षित रहती है, जबकि आधुनिक पाठक के लिए संभावित अस्पष्टता पादटिप्पणी से दूर होती है।
- issue: ‘चौथे’ का संबंध
  choice: इसे ‘चौथा दिन’ मानकर अलग कथन के रूप में प्रस्तुत किया गया।
  alternative: ‘चौथे दिन उसने उसका नाम इस्साकार रखा’
  rationale: मूल पदक्रम में ‘चौथे’ अंत में है और उसका सटीक क्रियात्मक संबंध पूर्णतः स्पष्ट नहीं है; अलग कथन अनावश्यक रूप से इसे केवल नामकरण से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट होता है, और मूल की दांपत्य संकेतात्मकता को पादटिप्पणी सहित सुरक्षित रखा गया है।
