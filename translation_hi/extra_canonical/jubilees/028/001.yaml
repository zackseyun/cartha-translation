lexical_decisions:
- source_word: አንሥአ፡ እገሪሁ
  choice: उसने अपने पाँव उठाए
  rationale: मूल गीइज़ की सजीव गति-सूचक अभिव्यक्ति को बनाए रखा गया है; यह केवल ‘चल पड़ा’ कहने की अपेक्षा स्रोत के रूपक के अधिक निकट है।
- source_word: ምድረ፡ ጽባሕ
  choice: पूरब के देश में
  rationale: शाब्दिक अर्थ ‘भोर/सूर्योदय का देश’ है, जो दिशा के रूप में पूर्वी प्रदेश को दर्शाता है; आधुनिक हिन्दी में ‘पूरब का देश’ स्वाभाविक और स्पष्ट है।
- source_word: ኀበ፡ ላባ
  choice: लाबान के पास
  rationale: ኀበ गंतव्य की ओर जाने का भाव देता है; व्यक्ति के संदर्भ में ‘के पास’ स्वाभाविक हिन्दी है।
- source_word: ወሀሎ፡ ምስሌሁ
  choice: और वह उसके साथ रहा
  rationale: ሀሎ का मूल भाव ‘था/रहा’ और ምስሌሁ का अर्थ ‘उसके साथ’ है। ‘रहा’ संदर्भानुसार ठहरने का भाव देता है, बिना अवधि निश्चित किए।
