  choice: तुम्हारे गर्भ का फल
  rationale: शाब्दिक रूपक ‘गर्भ का फल’ हिंदी में भी स्वाभाविक और बोधगम्य है; उपलब्ध अंश वाक्य के बीच से आरम्भ होता है, इसलिए उसकी खंडित संरचना बनाए रखी गई है।
- source_word: ኀደገኪ
  choice: तुम्हें छोड़ दिया है
  rationale: क्रिया का मूल अर्थ छोड़ना या त्याग देना है। ‘छोड़ दिया है’ प्रसंग में स्वाभाविक है और अनावश्यक रूप से अधिक कठोर धार्मिक अर्थ नहीं जोड़ता।
- source_word: ደቀ፡ አርባዕተ
  choice: चार पुत्रों
  rationale: ደቀ संतान/बालकों के लिए प्रयुक्त हो सकता है; इस प्रसंग में लिआ से जन्मे चारों बच्चे पुत्र हैं, इसलिए ‘चार पुत्रों’ अधिक स्पष्ट और स्रोत-संगत है।
