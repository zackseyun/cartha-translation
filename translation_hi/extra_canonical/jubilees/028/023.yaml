  text: And he loved Rachel more than Leah, because Leah had been given to him. And the LORD opened Leah’s womb, and she conceived.
translation:
  language: hi
  text: और वह राहेल को लिआ की अपेक्षा अधिक प्रेम करता था[a], क्योंकि लिआ उसे दी गई थी। और यहोवा ने लिआ की कोख खोल दी, और वह गर्भवती हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दिया गया गीइज़ पाठांश खंडित रूप में ‘राहेल, क्योंकि लिआ उसे दी गई थी’ से आरम्भ होता है। मानक पद-विभाजन के अनुसार पुनर्स्थापित आरम्भ है: ‘और वह राहेल को लिआ की अपेक्षा अधिक प्रेम करता था।’'
    reason: स्रोत-पाठांश के आरम्भ में सम्भावित कटौती अथवा खंड-विभाजन की समस्या को पारदर्शी रखना।
lexical_decisions:
- source_word: ልያ
  choice: लिआ
  rationale: नाम का ऐसा देवनागरी लिप्यंतरण जो गीइज़ रूप और प्रचलित बाइबलीय नाम—दोनों के निकट है।
- source_word: ትውህበት
  choice: दी गई थी
  rationale: स्त्रीलिंग कर्मवाच्य पूर्ण क्रिया का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: አርኀወ
  choice: खोल दी
  rationale: मूल पाठ की ठोस अभिव्यक्ति को बनाए रखा गया है; इसे केवल ‘सन्तान उत्पन्न करने योग्य बनाया’ कहकर व्याख्यायित नहीं किया गया।
- source_word: ማኅፀነ
  choice: कोख
  rationale: गर्भाशय/कोख के स्रोतार्थ के लिए सहज, गरिमापूर्ण और बाइबलीय हिन्दी।
- source_word: ፀንሰት
  choice: गर्भवती हुई
  rationale: गर्भधारण के पूर्ण हो जाने को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यहाँ प्रयुक्त ईश्वरीय नाम के लिए हिन्दी बाइबल परम्परा में परिचित विशिष्ट नाम।
theological_decisions:
- issue: लिआ की कोख खोलने में परमेश्वर की प्रत्यक्ष भूमिका
  choice: ‘यहोवा ने लिआ की कोख खोल दी’ के रूप में प्रत्यक्ष कथन रखा गया
  alternative: ‘यहोवा ने लिआ को गर्भधारण करने योग्य बनाया’
  rationale: मूल रूपक और परमेश्वर की कर्तृता को बिना नरम किए या अतिरिक्त सिद्धान्त जोड़े सुरक्षित रखता है।
- issue: आरम्भिक तुलनात्मक प्रेम-वाक्य की पाठीय स्थिति
  choice: मानक पद-विभाजन और उपलब्ध समीक्षा-साक्ष्य के आधार पर ‘वह राहेल से लिआ की अपेक्षा अधिक प्रेम करता था’ मुख्य पाठ में रखा गया
  alternative: पद को खंडित रूप में ‘राहेल, क्योंकि लिआ उसे दी गई थी’ से आरम्भ करना
  rationale: दिया गया गीइज़ अंश आरम्भ में खंडित है; वैकल्पिक रूप हिन्दी में अपूर्ण वाक्य बनाता है और प्रसंग का स्पष्टतः लुप्त आरम्भ छोड़ देता है। अनिश्चितता को पादटिप्पणी में खुलकर बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और कथात्मक है। ‘कोख खोल दी’ जैसे मूल रूपक को बनाए रखा गया है। नामों के लिए ‘राहेल’ और ‘लिआ’ तथा ईश्वरीय नाम के लिए ‘यहोवा’ अपनाया गया है।
