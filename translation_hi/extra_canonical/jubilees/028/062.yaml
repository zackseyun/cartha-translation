  text: He was a three days' journey from him. And Jacob saw that Laban had gone to shear.
translation:
  language: hi
  text: वह उससे तीन दिन की यात्रा की दूरी पर था। और याकूब ने देखा कि लाबान ऊन कतरने गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀሎ
  choice: था
  rationale: गीज़ क्रिया अस्तित्व अथवा स्थिति व्यक्त करती है; इसे स्पष्ट रूप से रखकर पहले उपवाक्य को पूर्ण बनाया गया है।
- source_word: ምሕዋረ፡ ሠሉስ፡ ዕለት
  choice: तीन दिन की यात्रा की दूरी
  rationale: शाब्दिक संरचना ‘तीन दिन की यात्रा’ है; ‘की दूरी’ हिंदी में स्थानगत संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ይቅርጽ
  choice: ऊन कतरने
  rationale: क्रिया का अर्थ ‘कतरना’ है। हिंदी में निरुद्देश्य ‘कतरने’ अस्वाभाविक होता, इसलिए प्रसंगानुकूल सामान्य कर्म ‘ऊन’ व्यक्त किया गया है, बिना यह निर्धारित किए कि किन पशुओं की ऊन थी।
