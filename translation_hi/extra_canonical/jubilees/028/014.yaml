translation:
  language: hi
  text: बड़ी से पहले;[a] वह पहले बड़ी को विवाह में दे, और उसके बाद छोटी को। और जो पुरुष ऐसा करता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह वाक्यांश पिछले पद के अंतिम विचार को पूरा करता है: “छोटी को बड़ी से पहले।”'
    reason: पद-विभाजन के कारण आरंभिक वाक्यांश अकेला प्रतीत हो सकता है; टिप्पणी स्रोत-पाठ के वाक्य-संबंध को स्पष्ट करती है।
lexical_decisions:
- source_word: እምእንተ፡ ትልህቅ፡
  choice: बड़ी से पहले
  rationale: यह पद पिछले पद के ‘छोटी को ... देना’ वाले अधूरे विचार को पूरा करता है; खंड-विभाजन के कारण वाक्यांश यहाँ आरंभ में आता है।
- source_word: ያቀድም፡ ውሂበ፡
  choice: वह पहले ... को विवाह में दे
  rationale: शाब्दिक अर्थ ‘पहले दे’ है, पर प्रसंग कन्या को विवाह में देने का है; ‘विवाह में’ जोड़ने से आधुनिक हिन्दी में आशय स्पष्ट रहता है।
- source_word: እንተ፡ ትልህቅ፡ / እንተ፡ ትንእስ፡
  choice: बड़ी / छोटी
  rationale: दो स्त्रीलिंग व्यक्तियों, अर्थात बड़ी और छोटी कन्या या बहन, के तुलनात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወበእሲ፡ ዘይገብር፡ ከመዝ፡
  choice: और जो पुरुष ऐसा करता है,
  rationale: स्रोत का वाक्य अगले अंश में जारी रहता है, इसलिए अंतिम अल्पविराम और अपूर्ण वाक्य-रचना बनाए रखी गई है।
