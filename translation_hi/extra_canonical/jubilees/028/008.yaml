- source_word: ተቀነይኩ፡ ለከ፡
  choice: मैंने ... तुम्हारी सेवा की थी
  rationale: गीज़ क्रिया प्रथम पुरुष एकवचन में है और साथ का सर्वनाम सेवा के प्राप्तकर्ता को स्पष्ट करता है; हिन्दी में पूर्ण भूतकाल प्रसंगानुकूल और स्वाभाविक है।
- source_word: 7ፋዕከኒ
  choice: तुमने मेरे साथ छल किया
  rationale: पाठ का आशय अनुचित या कपटपूर्ण व्यवहार है। ‘छल किया’ याकूब-लाबान प्रसंग में स्वाभाविक है, पर किसी विशिष्ट कानूनी अर्थ को नहीं जोड़ता।
- source_word: ንግአ፡ ወሰተከ፡
  choice: अपनी बेटी को ले जाओ
  rationale: यह आज्ञार्थक अभिव्यक्ति है। अंग्रेज़ी परामर्श-पाठ के ‘Take your daughter’ और स्रोत-साक्ष्य के अनुरूप आधुनिक हिन्दी में इसे सीधे रखा गया है।
