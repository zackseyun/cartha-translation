  text: राहेल को बिल्हा—जो जिल्पा की बहन थी—दासी के रूप में [दिया]।[a] और उसने फिर सात वर्ष सेवा की—के लिए…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में इस पद के आरम्भ पर क्रिया नहीं है; वाक्य पिछले पद से जारी जान पड़ता है। प्रसंग के अनुसार लाबान ने बिल्हा को राहेल की दासी के रूप में दिया।
    reason: पद-विभाजन से उत्पन्न खंडित वाक्य और अंतर्निहित क्रिया को स्पष्ट करना।
  - marker: b
    text: मूल पाठ यहाँ ‘के लिए’ पर अधूरा समाप्त होता है और वाक्य अगले पद में जारी रहता है।
    reason: स्रोत की पद-सीमा और वास्तविक अपूर्णता को सुरक्षित रखना।
lexical_decisions:
- source_word: ለአኪት
  choice: दासी के रूप में
  rationale: यह स्त्री सेविका/दासी की भूमिका को व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का सामाजिक पदनाम बनाए रखता है।
- source_word: ወትቀንየ
  choice: और उसने … सेवा की
  rationale: क्रिया का अर्थ सेवा करना है; कर्ता मूल में निहित पुल्लिंग एकवचन है और प्रसंग में याकूब है, इसलिए नाम जोड़ने के बजाय सर्वनाम रखा गया।
- source_word: ሰብዓተ፡ ዓመተ፡ ዳግመ
  choice: फिर सात वर्ष
  rationale: ‘दूसरी बार/पुनः’ के भाव को सहज हिन्दी ‘फिर’ से व्यक्त किया गया है।
theological_decisions:
- issue: खंडित पद-विभाजन में देने वाले कर्ता की पहचान
  choice: ‘राहेल को … [दिया]’ द्वारा राहेल को प्राप्तकर्ता रखा गया और पूरित क्रिया को कोष्ठक में दिखाया गया
  alternative: ‘राहेल ने बिल्हा … को दासी के रूप में दिया’
  rationale: यह अंश पिछले पद से कटा हुआ वाक्यांश प्रतीत होता है। कथा-संदर्भ में लाबान बिल्हा को राहेल के लिए देता है; राहेल को कर्ता बनाना कथात्मक तथ्य उलट देगा। कोष्ठक स्रोत में प्रत्यक्षतः अनुपस्थित क्रिया की पारदर्शी पूर्ति दिखाते हैं।
- issue: अंतिम अधूरा संबंधबोधक वाक्यांश
  choice: अंत में दीर्घ विराम-चिह्न और पादटिप्पणी सहित अपूर्णता बनाए रखी
  alternative: अगले पद से कर्म लेकर वाक्य पूरा करना
  rationale: प्रदत्त गीइज़ पाठ በእንተ (‘के लिए/के कारण’) पर समाप्त होता है। उपलब्ध अंश से उसका कर्म निश्चित नहीं किया जा सकता, इसलिए पद-सीमा की वास्तविक अपूर्णता को चुपचाप पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘बिल्हा’ और ‘जिल्पा’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। स्रोत की दोनों खंडित सीमाओं को स्पष्ट करने के लिए कोष्ठक, दीर्घ विराम और पादटिप्पणियाँ प्रयुक्त हुई हैं।
