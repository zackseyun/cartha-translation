translation:
  language: hi
  text: और याकूब की संपत्ति बहुत बढ़ गई, और उसने गाय-बैल, भेड़ें, गधे और ऊँट प्राप्त किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጥሪቱ
  choice: संपत्ति
  rationale: यह शब्द याकूब की कुल धन-संपदा या माल-मवेशी के व्यापक अर्थ को व्यक्त करता है; अगले पदांश में पशुओं का विवरण दिया गया है।
- source_word: ጥቀ
  choice: बहुत
  rationale: वृद्धि की तीव्र मात्रा को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አጥረየ
  choice: प्राप्त किए
  rationale: पशुधन अर्जित करने के अर्थ को बिना यह निर्धारित किए व्यक्त करता है कि वह खरीद, प्रजनन या किसी अन्य माध्यम से मिला।
- source_word: አልህምተ
  choice: गाय-बैल
  rationale: मवेशियों की श्रेणी के लिए सामान्य और स्पष्ट हिन्दी पद।
- source_word: አባግዐ
  choice: भेड़ें
  rationale: गीज़ शब्द का सीधा पशु-वर्ग संबंधी अर्थ।
- source_word: አእዱገ
  choice: गधे
  rationale: स्रोत में स्पष्ट रूप से उपस्थित पशु-वर्ग को शामिल करता है, जो एक पुराने अंग्रेज़ी रूप में छूट गया था।
- source_word: አገማለ
  choice: ऊँट
  rationale: गीज़ शब्द का सीधा और प्रचलित हिन्दी समतुल्य।
