  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्रोत की सूची-संरचना के निकट अनुवाद। ‘मवेशी’ की अपेक्षा ‘गाय-बैल’ रखा गया है, ताकि इसके बाद आने वाली भेड़ों, गधों और ऊँटों से श्रेणियाँ स्पष्ट रूप से अलग रहें।
