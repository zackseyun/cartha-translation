translation:
  language: hi
  text: लिआ गर्भवती हुई और उसने याकूब के तीसरे पुत्र को जन्म दिया। याकूब ने उसका नाम लेवी रखा—महीने के पहले दिन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नए चाँद पर।” गीइज़ पदबंध का शाब्दिक अर्थ महीने के उदय या आरम्भ से संबंधित है।
    reason: काल-सूचक पदबंध की ‘नया चाँद/महीने का आरम्भ’ वाली अर्थ-छाया सुरक्षित रखने के लिए।
