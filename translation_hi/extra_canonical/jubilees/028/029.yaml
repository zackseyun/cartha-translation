  choice: गर्भवती हुई और उसने उसके लिए तीसरे पुत्र को जन्म दिया
  rationale: स्त्रीलिंग क्रियाओं और ሎቱ (‘उसके लिए/उसको’) को स्पष्ट रखते हुए सहज आधुनिक हिन्दी दी गई है।
- source_word: ወጸውዐ፡ ስሞ፡ ሌዊ፡
  choice: उसने उसका नाम लेवी रखा
  rationale: ጸውዐ का रूप तृतीय पुरुष पुल्लिंग एकवचन है, इसलिए कर्ता याकूब समझा गया; हिन्दी में सर्वनाम का लिंग प्रकट न होने के कारण स्रोतगत बात पादटिप्पणी में स्पष्ट की गई है।
- source_word: በሠርቅ፡ ወርኅ፡
  choice: पहले महीने के पहले दिन
  rationale: ሠርቅ፡ ወርኅ का आशय महीने का आरम्भ/नया चाँद, अर्थात पहला दिन है; इसे ‘भोर में’ और ‘पहले दिन’ दोनों कहकर दोहरा अनुवाद नहीं किया गया।
