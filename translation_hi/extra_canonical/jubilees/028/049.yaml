  text: And the Lord remembered Rachel and opened her womb, and she conceived and bore a son, and she called his name
translation:
  language: hi
  text: और प्रभु ने राहेल को याद किया[a] और उसकी कोख खोल दी। वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया, और उसने उसका नाम रखा—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त गीइज़ पाठ में ‘याद किया’ के समकक्ष क्रिया दिखाई नहीं देती; वहाँ वाक्य व्याकरणतः अधूरा है। संदर्भ के आधार पर यह क्रिया यहाँ पूरी की गई है।
    reason: स्रोत की संभावित पाठगत कमी को पारदर्शी रखना।
  - marker: b
    text: यह पद मूल अंश में नाम बताए बिना यहीं समाप्त होता है।
    reason: अंतिम अधूरे वाक्यांश को भूल या अनुवाद-लोप समझे जाने से बचाना।
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: यह ईश्वर के लिए प्रयुक्त पारंपरिक गीइज़ पद है; ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: አርኀወ ማኅፀና
  choice: उसकी कोख खोल दी
  rationale: मूल के ठोस प्रजनन-संबंधी मुहावरे को बनाए रखता है और हिन्दी में बोधगम्य है।
- source_word: ፀንሰት
  choice: गर्भवती हुई
  rationale: क्रिया के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ወለደት ወልደ
  choice: उसने एक पुत्र को जन्म दिया
  rationale: मूल में संतान के पुल्लिंग होने को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ጸውዐት ስሞ
  choice: उसका नाम रखा
  rationale: शाब्दिक रूप ‘उसने उसका नाम पुकारा’ के स्थान पर नामकरण के स्वाभाविक हिन्दी मुहावरे का प्रयोग किया गया है।
theological_decisions:
- issue: राहेल के गर्भधारण में परमेश्वर की भूमिका
  choice: ‘प्रभु ने ... उसकी कोख खोल दी’ को प्रत्यक्ष रूप में रखा
  alternative: इसे केवल ‘राहेल गर्भवती हुई’ कहना
  rationale: मूल पाठ परमेश्वर की क्रिया और राहेल के गर्भधारण दोनों को स्पष्ट रूप से जोड़ता है; इसे कमज़ोर या अप्रत्यक्ष नहीं किया गया।
- issue: ‘राहेल को याद किया’ की पाठगत स्थिति
  choice: वाक्य की अपेक्षित क्रिया को मुख्य पाठ में रखा और पाठ-टिप्पणी दी
  alternative: केवल ‘प्रभु ने राहेल की कोख खोल दी’ लिखना
  rationale: प्रदत्त गीइज़ पंक्ति में ‘प्रभु, राहेल के लिए/को, और खोल दिया’ जैसा व्याकरणतः अपूर्ण क्रम है, जबकि संदर्भ और परामर्श-पाठ ‘याद किया’ का समर्थन करते हैं; टिप्पणी इस अनिश्चितता को छिपाती नहीं।
- issue: अधूरा अंतिम वाक्यांश
  choice: ‘उसका नाम रखा—’ पर पाठ को अधूरा छोड़ा
  alternative: अगले पद से नाम जोड़कर वाक्य पूरा करना
  rationale: स्रोत अंश नाम बताए बिना समाप्त होता है; अगले पद की सामग्री को इस पद में आयात नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कोख खोल दी’ मूल बिंब को सुरक्षित रखता है। अंतिम डैश जानबूझकर अधूरे नामकरण-वाक्य को दर्शाता है; सभी टिप्पणियों के चिह्न मुख्य पाठ में उपस्थित हैं।
