  choice: इस पूरे समय
  rationale: शाब्दिक ‘इस सब में/इसके दौरान’ के कालगत आशय को प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ራሔል፡ ትቀንዕ፡ በልያ
  choice: राहेल को लिआ से ईर्ष्या होती रही
  rationale: क्रिया का निरंतर भाव और लिआ के प्रति ईर्ष्या का संबंध सहज हिन्दी में सुरक्षित है।
- source_word: እስመ፡ ይእቲ
  choice: क्योंकि वह बाँझ थी
  rationale: प्रस्तुत स्रोत-पंक्ति में विधेय पाठ-संक्रमण के कारण अधूरा दिखता है, पर समीक्षित पाठ और निकट प्रसंग राहेल के बाँझ होने को अपेक्षित करते हैं; हिन्दी में अर्थपूर्ण पूर्ण वाक्य दिया गया है।
