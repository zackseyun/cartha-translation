translation:
  language: hi
  text: यूसुफ, चौथे महीने के नए चाँद के दिन[a], इस चौथे सप्ताह के छठे वर्ष में। और जिन दिनों वह जन्मा था…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चौथे महीने के आरम्भ में।”
    reason: गीज़ ሠርቅ इस कालगणनात्मक सूत्र में नए चाँद अथवा महीने के आरम्भ का बोध करा सकता है।
  - marker: b
    text: यह आश्रित खंड अगले पद में पूरा होता है।
    reason: गीज़ पाठ का अंतिम खंड व्याकरणतः अधूरा है और आगे के कथन से जुड़ता है।
lexical_decisions:
- source_word: በሠርቅ፡ ወርኅ፡ ራብዕ
  choice: चौथे महीने की अमावस्या को
  rationale: इस कालगणनात्मक सूत्र में ሠርቅ महीने के आरम्भ अथवा नए चाँद का संकेत देता है; इसलिए इसे ‘भोर’ नहीं माना गया। आधुनिक हिन्दी में ‘अमावस्या’ नए चंद्रमास के आरम्भ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: በሳድስ፡ ዓመት፡ በሱባዔ፡ ዝንቱ፡ ራብዕ
  choice: इस चौथे सप्ताह के छठे वर्ष में
  rationale: ዓመት को ‘वर्ष’ और ሱባዔ को जुबिली-कालक्रम के सात-वर्षीय ‘सप्ताह’ के रूप में रखा गया है; पदक्रम हिन्दी में स्वाभाविक बनाया गया।
- source_word: ወበመዋዕለ፡ ተወልደ
  choice: और उसके जन्म के दिनों में…
  rationale: መዋዕለ की संबंधकारी रचना अगले कथन की ओर ले जाने वाला आश्रित कालवाचक खंड है; अतः इसे स्वतंत्र पूर्ण वाक्य न बनाकर अपूर्णता बनाए रखी गई है।
