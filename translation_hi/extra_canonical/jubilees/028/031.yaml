theological_decisions:
- issue: यहूदा का नाम किसने रखा
  choice: 'मुख्य पाठ में पुरुष कर्ता: ‘उसने ... रखा’'
  alternative: 'स्त्री कर्ता: ‘उसने ... रखा’ (अर्थात् माँ ने), जैसा उत्पत्ति 29:35 और कुछ पूर्व प्रस्तुतियों में समझा गया है'
  rationale: प्रदत्त गीइज़ पाठ की क्रिया ጸውዐ तृतीय पुरुष पुल्लिंग एकवचन है; इसे उत्पत्ति के समान बनाने के लिए मौन रूप से स्त्रीलिंग नहीं किया गया। हिन्दी में सर्वनाम का रूप समान होने के कारण पादटिप्पणी से वास्तविक अस्पष्टता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सापेक्ष अनुवाद। ‘उसके लिए’ ने गीइज़ ሎቱ को स्पष्ट रखा है। मुख्य पाठ में लगातार आए दो ‘उसने’ क्रमशः स्त्री और पुरुष कर्ता को व्यक्त करते हैं; लिंग-संबंधी अंतर पादटिप्पणी में स्पष्ट किया गया है।
