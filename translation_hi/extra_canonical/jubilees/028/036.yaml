translation:
  language: hi
  text: “मेरी दासी; वह गर्भ धारण करेगी और मेरे लिए एक पुत्र जनेगी।” तब उसने अपनी दासी बिल्हा को अपने पति की पत्नी के रूप में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመትየ
  choice: मेरी दासी
  rationale: प्रथम पुरुष संबंधसूचक रूप को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ወትፀንስ፡ ወትወልድ
  choice: और वह गर्भवती होकर … जनेगी
  rationale: दोनों समन्वित क्रियाओं—गर्भ धारण करना और जन्म देना—को सुरक्षित रखा गया है; मूल में ‘उसके पास जा’ जैसा कोई वाक्यांश नहीं है।
- source_word: ሊተ፡ ወልደ
  choice: मेरे लिए एक पुत्र
  rationale: ሊተ का लाभार्थक अर्थ ‘मेरे लिए’ और ወልደ का पुरुष संतान-सूचक अर्थ ‘पुत्र’ से व्यक्त किया गया है।
- source_word: ትኩኖ፡ ብእሲተ
  choice: उसकी पत्नी बनने के लिए
  rationale: उद्देश्यवाचक स्त्रीलिंग रचना का स्वाभाविक हिन्दी रूप; प्रसंग से ‘उसकी’ का संकेत याकूब की ओर है।
theological_decisions:
- issue: उत्पत्ति 30:3 से संभावित सामंजस्य
  choice: ‘उसके पास जा’ वाक्यांश नहीं जोड़ा गया
  alternative: ‘मेरी दासी के पास जा; वह गर्भवती होगी…’
  rationale: प्रस्तुत गीइज़ पाठ में उस आदेश के लिए कोई शब्द नहीं है; समान बाइबिलीय प्रसंग के आधार पर उसे जोड़ना स्रोत-पाठ का विस्तार होता।
- issue: बिल्हा को पत्नी के रूप में देना
  choice: ‘उसकी पत्नी बनने के लिए’
  alternative: ‘उसे पत्नी के रूप में’
  rationale: मूल की उद्देश्यवाचक अभिव्यक्ति सुरक्षित रखते हुए आधुनिक हिन्दी में संबंध स्पष्ट किया गया है, बिना विवाह की प्रकृति पर अतिरिक्त धर्मशास्त्रीय निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आरंभ का वाक्यांश पिछले पद से जुड़ा हुआ प्रतीत होता है, इसलिए स्रोत में उपस्थित खंडित वाक्य-संरचना और उद्धरण का प्रवाह बनाए रखा गया है।
