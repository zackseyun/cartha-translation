translation:
  language: hi
  text: मेरे लिए एक घर[a], क्योंकि जिन वर्षों तक मैंने तुम्हारी दोनों बेटियों के बदले तुम्हारी सेवा की, वे पूरे हो गए हैं; और मैं जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद पिछले वाक्य को आगे बढ़ाता हुआ प्रतीत होता है; गीज़ में शाब्दिक रूप से ‘मेरे लिए एक घर’ है।
    reason: पद आरंभ में स्वतंत्र क्रिया नहीं है और अध्याय-विभाजन के कारण हिन्दी में अंशात्मक संरचना अस्पष्ट हो सकती है।
lexical_decisions:
- source_word: ሊተ፡ ቤተ፡
  choice: अपने लिए एक घर
  rationale: गीज़ पदबंध का सीधा अर्थ ‘मेरे लिए/अपने लिए एक घर’ है। उत्पत्ति के समानांतर वृत्तांत के आधार पर इसे ‘मेरी पत्नी मुझे दे दो’ नहीं बनाया गया।
- source_word: ፈጸምኩ፡ ዓመታተ፡
  choice: जिन वर्षों तक … वे पूरे हो गए हैं
  rationale: शाब्दिक भाव ‘मैंने वर्ष पूरे कर लिए’ है; हिन्दी में संबंधवाचक रचना से सेवा की अवधि स्पष्ट और स्वाभाविक रहती है।
- source_word: ዘተቀነይኩ፡ ለከ፡
  choice: मैंने … तुम्हारी सेवा की
  rationale: क्रिया दासवत या अधीन सेवा करने का भाव रखती है; सामान्य प्रसंग में ‘सेवा की’ स्वाभाविक और पर्याप्त है।
- source_word: ህየንተ፡ ክልኤቲ፡ አዋልዲከ፡
  choice: तुम्हारी दोनों बेटियों के बदले
  rationale: ህየንተ विनिमय/प्रतिफल का संबंध व्यक्त करता है; ‘के बदले’ इस आशय को सीधे रखता है।
- source_word: ወአሐውር፡
  choice: अब मैं चला जाऊँगा
  rationale: मूल में ‘और मैं जाऊँगा’ है। हिन्दी प्रवाह में ‘अब’ पूर्ण हुई सेवा से आगामी प्रस्थान का संबंध स्पष्ट करता है।
theological_decisions:
- issue: उत्पत्ति के समानांतर पाठ से संभावित सामंजस्य
  choice: ‘अपने लिए एक घर’ रखा गया
  alternative: ‘मेरी पत्नी मुझे दे दो’
  rationale: प्रस्तुत गीज़ पाठ ሊተ፡ ቤተ፡ स्पष्टतः ‘मेरे लिए एक घर’ पढ़ता है। समानांतर बाइबिलीय वृत्तांत के अनुसार पाठ को बदलना स्रोत-साक्ष्य के विरुद्ध होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन ‘तुम्हारी/तुम्हारी सेवा’ रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। स्रोत की खंडित आरंभिक संरचना को फुटनोट सहित सुरक्षित रखा गया है।
