lexical_decisions:
- source_word: ወአሐውር
  choice: और मैं चली जाऊँगी
  rationale: क्रिया प्रथम पुरुष एकवचन भावी है; प्रसंग में वक्ता स्त्री है, इसलिए हिन्दी में स्त्रीलिंग रूप स्वाभाविक है।
- source_word: እኩየ፡ ገበርከ፡ ላዕሌየ
  choice: तुमने मेरे साथ बुरा किया है
  rationale: शाब्दिक अर्थ ‘तुमने मुझ पर/मेरे विरुद्ध बुरा किया’ है; ‘मेरे साथ बुरा किया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दोषारोपण को सुरक्षित रखता है।
- source_word: ያፈቅር
  choice: प्रेम करता था
  rationale: यहाँ निरंतर या स्थापित लगाव व्यक्त है; हिन्दी का अपूर्ण भूतकाल प्रसंग के अनुकूल है।
- source_word: እምነ
  choice: से अधिक
  rationale: तुलनात्मक संरचना राहेल के प्रति प्रेम को लिआ की अपेक्षा अधिक बताती है।
