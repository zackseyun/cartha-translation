- source_word: ካልእተ፡ ወልደ፡
  choice: एक और पुत्र
  rationale: ካልእተ का अर्थ ‘दूसरा’ अथवा ‘एक और’ हो सकता है। यहाँ ‘एक और पुत्र’ कथानक में लिआ के पुत्रों के जन्मक्रम के विषय में अनावश्यक भ्रम से बचते हुए मूल की स्वाभाविक अर्थ-सीमा को व्यक्त करता है।
