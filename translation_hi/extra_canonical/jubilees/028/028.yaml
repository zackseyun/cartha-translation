  text: And on the first day of the tenth month, in the third year of this week, Jacob again went in to
translation:
  language: hi
  text: और इस सप्ताह के तीसरे वर्ष में, दसवें महीने के पहले दिन, याकूब फिर … के पास गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ पाठ-अंश यहाँ ‘के पास’ पर रुकता है; वाक्य का कर्म अगले पद में आता है।
    reason: अंश की वाक्यगत अपूर्णता समझाने और अनुवाद में किसी अनुल्लिखित व्यक्ति को जोड़ने से बचने के लिए।
lexical_decisions:
- source_word: ወአሐዱ ዘወርኅ ዓሥር
  choice: दसवें महीने के पहले दिन
  rationale: ‘አሐዱ’ का यहाँ दिनांक के संदर्भ में अर्थ ‘पहला’ है; हिंदी में स्वाभाविक क्रम अपनाया गया है।
- source_word: በሣልስ ዓመት ለዝ ሱባዔ
  choice: इस सप्ताह के तीसरे वर्ष में
  rationale: ‘ሱባዔ’ सात वर्षों की अवधि है; पुस्तक की प्रचलित कालगणना को बनाए रखने के लिए ‘सप्ताह’ रखा गया है।
- source_word: ደገመ
  choice: फिर
  rationale: क्रिया का पुनरावृत्ति-सूचक अर्थ संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ቦአ ኀበ
  choice: … के पास गया
  rationale: शाब्दिक रूप से ‘की ओर/के पास भीतर गया’; उपलब्ध स्रोत अंश ‘ኀበ’ पर रुकता है और उसका कर्म अगले अंश में आता है। हिंदी में अधूरे संबंध को दीर्घविराम से स्पष्ट रखा गया है, बिना कर्म जोड़ने के।
theological_decisions:
- issue: ‘भीतर गया/के पास गया’ के संभावित वैवाहिक या यौन अर्थ को कितना स्पष्ट किया जाए
  choice: के पास गया
  alternative: उसके साथ संबंध बनाए
  rationale: मूल अभिव्यक्ति सांकेतिक है और उपलब्ध अंश में कर्म भी नहीं दिया गया; अधिक स्पष्ट अनुवाद मूल की अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। कालगणना के तकनीकी शब्द ‘सप्ताह’ को पुस्तक की सात-वर्षीय इकाई के रूप में बनाए रखा गया है।
