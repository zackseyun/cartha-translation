lexical_decisions:
- source_word: አባግዒሁ
  choice: अपनी भेड़-बकरियों के पास
  rationale: यह खंड पूर्ववर्ती वाक्य से जुड़ा हुआ प्रतीत होता है; ‘भेड़-बकरियाँ’ सामान्य हिन्दी में पशुधन के आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ወጸውዖን
  choice: तब ... को बुलाया
  rationale: क्रिया का मूल अर्थ ‘बुलाना’ है; स्त्रीलिंग बहुवचन कर्म लिआ और राहेल की ओर संकेत करता है।
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: और उनके मन से बात की
  rationale: शाब्दिक मुहावरे ‘उनके हृदय में/से बोला’ को पूरी तरह समतल किए बिना हिन्दी में बोधगम्य रखा गया है; इसका आशय मन को संबोधित करके समझाना है।
- source_word: ከመ፡ ይምጽኣ፡ ምስ
  choice: कि वे उसके साथ आएँ
  rationale: उपलब्ध गीइज़ खंड अंत में अपूर्ण है; अंग्रेज़ी परामर्श-पाठ के आधार पर ‘साथ आएँ’ रखा गया है, जबकि साथ का कर्म संदर्भानुसार याकूब है।
