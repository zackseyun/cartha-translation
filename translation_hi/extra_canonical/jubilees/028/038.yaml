translation:
  language: hi
  text: छठा:[a] तीसरे सप्ताह के छठे वर्ष में याकूब फिर बिल्हा के पास गया, और वह गर्भवती हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भ का “छठा” सम्भवतः इस जन्म को क्रम में छठा बताता है। कुछ पाठक इसे आगे आने वाले “छठे वर्ष में” के साथ जोड़कर समझ सकते हैं।
    reason: मूल में ‘छठा’ स्वतंत्र रूप से आया है, पर उसका वाक्यगत कार्य पूरी तरह निश्चित नहीं है।
lexical_decisions:
- source_word: ሳድስ
  choice: छठा
  rationale: पद के आरम्भ में स्वतंत्र रूप से आए ‘छठा’ को बनाए रखा गया है; प्रसंग में यह जन्म-क्रम की गणना हो सकता है।
- source_word: በሳድስ ዓመት ዘሱባዔ ሣልስ
  choice: तीसरे सप्ताह के छठे वर्ष में
  rationale: ‘सप्ताह’ यहाँ सात वर्षों की काल-इकाई है; स्रोत का क्रम स्वाभाविक हिन्दी में बदला गया है।
- source_word: ደገመ … ካዕበ
  choice: फिर
  rationale: दोनों शब्द पुनरावृत्ति का भाव देते हैं; हिन्दी में अनावश्यक दोहराव से बचते हुए संयुक्त अर्थ ‘फिर’ से व्यक्त किया गया है।
- source_word: ቦአ ኀበ ባላ
  choice: बिल्हा के पास गया
  rationale: मूल का शिष्ट, अप्रत्यक्ष यौन-संबंधसूचक प्रयोग सुरक्षित रखा गया है; अगला वाक्य गर्भधारण का आशय स्पष्ट करता है।
- source_word: ፀንሰት
  choice: वह गर्भवती हुई
  rationale: स्त्रीलिंग क्रिया का कर्ता बिल्हा है; आधुनिक हिन्दी में सहज अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: आरम्भिक ‘छठा’ का आशय
  choice: मुख्य पाठ में ‘छठा’ रखा और टिप्पणी में संभावित जन्म-क्रम बताया
  alternative: इसे केवल ‘छठे वर्ष में’ मानकर स्वतंत्र शब्द हटा देना
  rationale: गीज़ पाठ में ‘छठा’ अलग से उपस्थित है; उसका संभावित गणनात्मक कार्य मिटाना स्रोत-साक्ष्य को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘के पास गया’ मूल की शिष्ट अप्रत्यक्षता बनाए रखता है और प्रसंग से उसका आशय स्पष्ट हो जाता है।
