lexical_decisions:
- source_word: ድኩም
  choice: कमजोर
  rationale: यह शब्द लिआ की आँखों की दुर्बलता बताता है; ‘कमजोर’ आधुनिक हिन्दी में स्वाभाविक है और स्रोत का मूल्यांकन बनाए रखता है।
- source_word: ላሕይ፡ ራእያ፡ ጥቀ
  choice: उसका रूप बहुत सुंदर था
  rationale: स्त्रीलिंग संबंधसूचक रूप संदर्भ में लिआ की ओर लौटता है; ጥቀ की तीव्रता ‘बहुत’ से व्यक्त की गई है। इससे लिआ के विषय में जुबिलीज़ की विशिष्ट सकारात्मक टिप्पणी सुरक्षित रहती है।
- source_word: ወራሔል፡ ሠናይ
  choice: और राहेल सुंदर थी
  rationale: स्रोत में राहेल के बारे में अलग, संक्षिप्त कथन है; इसे पिछले वाक्यांश में मिलाकर केवल राहेल पर लागू नहीं किया गया।
