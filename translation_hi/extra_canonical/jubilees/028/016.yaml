  text: This deed is evil before the LORD. And you also command the children of Israel that they not
translation:
  language: hi
  text: यह काम प्रभु के सामने बुरा है। और तुम भी इस्राएल की संतानों को आज्ञा दो कि वे न—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ स्रोत यहाँ नकारसूचक शब्द के बाद बीच वाक्य में समाप्त हो जाता है।
    reason: पाठ की अपूर्णता बताने और अनुवादक द्वारा अनुमानित शब्द जोड़ने से बचने के लिए।
lexical_decisions:
- source_word: እኩይ፡ ዝንቱ፡ ግብር
  choice: यह काम ... बुरा है
  rationale: शब्दक्रम को स्वाभाविक हिन्दी में रखते हुए እኩይ (‘बुरा’) और ግብር (‘काम/कर्म’) का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: በቅድመ፡ እግዚአብሔር
  choice: प्रभु के सामने
  rationale: በቅድመ का अर्थ ‘के सामने/की दृष्टि में’ है; እግዚአብሔር के लिए यहाँ प्रतिष्ठित और सहज पद ‘प्रभु’ चुना गया है।
- source_word: ወአንተኒ፡ አዝዝ
  choice: और तुम भी ... आज्ञा दो
  rationale: አንተኒ में निहित ‘तुम भी’ और አዝዝ के आज्ञार्थक बल को स्पष्ट रखा गया है।
- source_word: ለደቂቀ፡ እስራኤል
  choice: इस्राएल की संतानों को
  rationale: शाब्दिक वंश-संबंध को बनाए रखते हुए आधुनिक, गरिमापूर्ण हिन्दी प्रयोग अपनाया गया है।
- source_word: ወአይ
  choice: कि वे न—
  rationale: उपलब्ध गीइज़ पाठ नकार के आरम्भ पर ही कट जाता है; डैश अधूरे वाक्य को दर्शाता है और कोई अनुपलब्ध क्रिया नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम እግዚአብሔር का निरूपण
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: प्रदत्त गीइज़ पद स्वयं टेट्राग्राम का लिप्यंतरण नहीं है। इसलिए ‘प्रभु’ स्रोत के पारंपरिक अर्थ को व्यक्त करता है और ऐसा विशिष्ट नाम नहीं जोड़ता जो इस अंश में प्रत्यक्ष नहीं है।
- issue: अधूरे निषेध का अर्थ पूरा करना
  choice: वाक्य को ‘कि वे न—’ पर अधूरा रखा गया
  alternative: संदर्भ के अनुमान से निषिद्ध कार्य जोड़ना
  rationale: स्रोत-साक्ष्य इसी बिंदु पर समाप्त होता है; अनुमानित पूर्ति वास्तविक अस्पष्टता और पाठ की अपूर्णता को छिपा देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-निकट शैली रखी गई है। अधूरे स्रोत को डैश और पादटिप्पणी द्वारा स्पष्ट किया गया है।
