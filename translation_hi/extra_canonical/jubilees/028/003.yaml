  text: And in the first year of the third week he said to him, “Give me my wife, for whom I have served you.”
translation:
  language: hi
  text: और तीसरे सप्ताह के पहले वर्ष में उसने उससे कहा, “मेरी पत्नी मुझे दे दीजिए, जिसके लिए मैंने आपकी सेवा की है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዓመት፡ ቀዳማይ፡ ዘ'ሣልስ፡ ሱባዔ
  choice: और तीसरे सप्ताह के पहले वर्ष में
  rationale: मूल की काल-गणना और पदक्रम को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: ሀበኒ፡ ብእሲትየ
  choice: मेरी पत्नी मुझे दे दीजिए
  rationale: शाब्दिक अर्थ ‘मुझे मेरी पत्नी दीजिए’ है; हिन्दी में कर्म के बाद ‘मुझे’ रखना अधिक स्वाभाविक है। संबोधन के संबंधगत संदर्भ के अनुरूप आदरसूचक क्रिया चुनी गई है।
- source_word: ዘበእንቲአሃ፡ ተቀነይኩ፡ ለከ
  choice: जिसके लिए मैंने आपकी सेवा की है
  rationale: स्त्रीलिंग संबंधवाचक पद पत्नी की ओर संकेत करता है; ‘आपकी सेवा की है’ मूल में निहित संबोधित व्यक्ति के लिए की गई सेवा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
