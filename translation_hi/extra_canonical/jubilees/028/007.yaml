lexical_decisions:
- source_word: ይእቲሰ፡ ልያ
  choice: वह तो लिआ थी
  rationale: Ge'ez emphatic particle ሰ is reflected by ‘तो’, preserving the discovery and contrast.
- source_word: ወተምዐ፡ ያዕቆብ፡ ላዕለ፡ ላባ
  choice: तब याकूब लाबान पर क्रोधित हुआ
  rationale: Renders the anger verb directly and ላዕለ as its target; ‘तब’ gives natural Hindi narrative linkage.
- source_word: ለምንት፡ ገበርከኒ፡ ከመዝ
  choice: तूने मेरे साथ ऐसा क्यों किया?
  rationale: Natural Hindi rendering of the interrogative and idiom ‘do to me thus’.
- source_word: አኩ
  choice: क्या मैंने नहीं—
  rationale: Preserves the source's incomplete negative question at the verse boundary; the dash signals that the sentence continues rather than supplying words absent from this segment.
