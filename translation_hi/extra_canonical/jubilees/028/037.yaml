  yaml_path: translation/extra_canonical/jubilees/028/037.yaml
  text: And he went in to her, and she conceived and bore him a son, and he called his name Dan, on the ninth of the month.
translation:
  language: hi
  text: और वह उसके पास गया। उसने गर्भधारण किया और उसके लिए एक पुत्र को जन्म दिया। याकूब ने उसका नाम दान रखा[a]। यह महीने के नौवें दिन हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “उस स्त्री ने उसका नाम दान रखा।”
    reason: दिए गए गीइज़ पाठ में क्रिया पुल्लिंग है, पर एक प्रमाणित स्त्रीलिंग पाठांतर भी मिलता है।
lexical_decisions:
- source_word: ቦአ፡ ኀቤሃ
  choice: वह उसके पास गया
  rationale: यह मूल पाठ के शाब्दिक संबंधसूचक मुहावरे को गरिमापूर्ण और स्वाभाविक हिन्दी में बनाए रखता है, बिना अनावश्यक स्पष्टता जोड़ने के।
- source_word: ፀንሰት
  choice: उसने गर्भधारण किया
  rationale: स्त्रीलिंग एकवचन क्रिया का सीधा और आधुनिक हिन्दी रूप।
- source_word: ወለደት፡ ሎቱ፡ ወልደ
  choice: उसके लिए एक पुत्र को जन्म दिया
  rationale: ሎቱ (‘उसके लिए/उसको’) और ወልደ (‘पुत्र’) दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: ወጸውዐ፡ ስሞ፡ ዳን
  choice: याकूब ने उसका नाम दान रखा
  rationale: दिए गए गीइज़ पाठ की क्रिया पुल्लिंग एकवचन है। हिन्दी में केवल ‘उसने’ से लिंग स्पष्ट नहीं होता, इसलिए प्रसंग के पुरुष कर्ता याकूब का नाम देकर स्रोत का भेद सुरक्षित रखा गया है।
- source_word: አመ፡ ተሱዑ፡ ለወርኅ
  choice: महीने के नौवें दिन
  rationale: यह पदबंध महीने की नौवीं तारीख बताता है, न कि गर्भावस्था का नौवाँ महीना।
theological_decisions:
- issue: दान का नाम किसने रखा
  choice: याकूब ने
  alternative: उस स्त्री ने
  rationale: प्रस्तुत मूल पाठ में ወጸውዐ तीसरे पुरुष का पुल्लिंग एकवचन रूप है; स्त्रीलिंग पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘उसके पास गया’ मूल के संयत मुहावरे को बनाए रखता है। अंतिम कालवाक्य को अलग वाक्य बनाकर महीने की नौवीं तारीख का अर्थ सहज और स्पष्ट किया गया है।
