translation:
  language: hi
  text: और गधे, दास और दासियाँ। लाबान और उसके पुत्र याकूब से ईर्ष्या करते थे, और लाबान ने अपनी भेड़ें इकट्ठी कीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀንአ
  choice: ईर्ष्या करने लगे
  rationale: यह क्रिया ईर्ष्या या डाह करने का भाव व्यक्त करती है; आधुनिक हिन्दी में ‘ईर्ष्या करने लगे’ स्वाभाविक और स्पष्ट है।
- source_word: አስተጋብአ
  choice: इकट्ठी कीं
  rationale: प्रेरणार्थक क्रिया का अर्थ एकत्र करना है; भेड़ों के लिए ‘इकट्ठी कीं’ सहज हिन्दी है।
- source_word: አባግዒሁ
  choice: अपनी भेड़ें
  rationale: संज्ञा भेड़ों को और प्रत्यय लाबान के स्वामित्व को दर्शाता है।
- source_word: ደቀ … አዋልደ
  choice: दास और दासियाँ
  rationale: संदर्भ में ये शब्द पुरुष और स्त्री सेवकों की समानांतर श्रेणियाँ सूचित करते हैं; ‘दास और दासियाँ’ सूची की संक्षिप्तता बनाए रखता है।
