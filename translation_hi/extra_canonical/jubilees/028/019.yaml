lexical_decisions:
- source_word: ወእሁበከ
  choice: और मैं तुम्हें दे दूँगा
  rationale: क्रिया का प्रथम पुरुष एकवचन और द्वितीय पुरुष कर्म स्वाभाविक हिन्दी भविष्यकाल में व्यक्त किया गया है।
- source_word: ራሔልሃ
  choice: राहेल को भी
  rationale: नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है; प्रत्यय का समावेशी भाव ‘भी’ से व्यक्त किया गया है।
- source_word: ትትቀነይ ሊተ
  choice: तुम मेरे लिए ... सेवा करोगे
  rationale: सेवा/अधीन होकर काम करने का मूल भाव बनाए रखते हुए प्रसंगानुकूल और सहज हिन्दी चुनी गई है।
- source_word: ካልአነ ዓመተ ሰብዐተ
  choice: और सात वर्ष
  rationale: अतिरिक्त सात वर्षों का अर्थ संक्षिप्त और स्पष्ट रूप में व्यक्त होता है।
- source_word: ትርዐይ አባግዐየ
  choice: मेरी भेड़ें चराओगे
  rationale: पशुओं की रखवाली और चराने वाली क्रिया को सामान्य हिन्दी ‘भेड़ें चराना’ से व्यक्त किया गया है।
