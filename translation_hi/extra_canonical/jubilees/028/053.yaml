- source_word: በዐስብከ፡
  choice: अपनी मज़दूरी पर
  rationale: यह पद याकूब को मिलने वाले पारिश्रमिक या मज़दूरी को व्यक्त करता है; ‘अपनी मज़दूरी पर’ मूल के ‘तुम्हारी मज़दूरी के लिए’ अर्थ को संक्षेप में रखता है।
- source_word: ወረዐይ፡ ሊተ፡ ካዕበ፡ መርዔትየ፡
  choice: और फिर से मेरे लिए मेरे झुंड को चराओ
  rationale: क्रिया ‘चराना/चरवाही करना’, ካዕበ ‘फिर से’, और दोहरे प्रथम-पुरुष संबंध (‘मेरे लिए’, ‘मेरा झुंड’) को स्पष्ट रूप से सुरक्षित रखा गया है।
