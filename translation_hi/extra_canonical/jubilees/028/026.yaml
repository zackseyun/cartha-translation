  text: the LORD saw that Leah was hated, while Rachel was loved. And Jacob again went in to
translation:
  language: hi
  text: प्रभु ने देखा कि लिआ से घृणा की जाती थी, जबकि राहेल से प्रेम किया जाता था। याकूब फिर उसके पास गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ वाक्य में ‘उसके’ का स्पष्ट पूरक ‘राहेल’ अगले पद के आरम्भ में आता है; पद-विभाजन के कारण मूल वाक्य वहाँ तक जारी रहता है।
    reason: हिन्दी में स्वाभाविक सर्वनाम का प्रयोग करते हुए गीज़ पाठ की पद-सीमा और अगले पद से उसका वाक्यगत संबंध स्पष्ट करना।
lexical_decisions:
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यह परमेश्वर के वाचागत नाम के लिए प्रचलित, गरिमापूर्ण हिन्दी रूप है; अंग्रेज़ी परामर्श-पाठ का LORD भी इसी ओर संकेत करता है।
- source_word: ትጸላእ
  choice: से घृणा की जाती थी
  rationale: स्रोत के निष्क्रिय भाव को बनाए रखता है और यह नहीं बताता कि घृणा करने वाला विशेष रूप से कौन था।
- source_word: ትትፈቀር
  choice: से प्रेम किया जाता था
  rationale: लिआ के विषय में प्रयुक्त निष्क्रिय कथन के समानांतर स्रोत का निष्क्रिय भाव सुरक्षित रखता है।
- source_word: ወደገመ
  choice: फिर
  rationale: पुनरावृत्ति अथवा दोबारा होने का स्वाभाविक हिन्दी संकेत।
- source_word: ወቦአ
  choice: भीतर गया
  rationale: क्रिया के मूल प्रवेश-संबंधी अर्थ को व्यक्त करता है और अगले पद में आने वाले संबंध-पद के पूरक को इस पद में मनमाने ढंग से नहीं जोड़ता।
- source_word: ኀበ
  choice: —[a]
  rationale: गीज़ पद इसी संबंधसूचक शब्द पर टूटता है, जिसका पूरक अगले पद का आरंभिक ‘राहेल’ है। हिन्दी में ‘के पास’ को बिना पूर्ववर्ती संज्ञा के छोड़ना अस्वाभाविक है, इसलिए डैश और पादटिप्पणी से अधूरी वाक्य-रचना दर्शाई गई है।
theological_decisions:
- issue: लिआ से ‘घृणा’ और राहेल से ‘प्रेम’ किए जाने का विरोध
  choice: कड़े विरोध को यथावत रखा गया
  alternative: ‘लिआ को कम प्रेम मिला’ जैसे नरम अर्थ में बदलना
  rationale: स्रोत घृणा और प्रेम की तनावपूर्ण शब्दावली रखता है; उसे धर्मवैचारिक सामंजस्य के लिए नरम करना उचित नहीं।
- issue: घृणा और प्रेम का कर्ता
  choice: निष्क्रिय वाक्य-रचना रखी गई
  alternative: ‘याकूब लिआ से घृणा करता था और राहेल से प्रेम करता था’
  rationale: स्रोत के रूप कर्ता को स्पष्ट नहीं करते; याकूब को स्पष्ट कर्ता बनाना पाठ से अधिक निश्चितता जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली अपनाई गई है। ‘लिआ’ और ‘राहेल’ प्रचलित बाइबलीय नाम-रूप हैं। अंतिम डैश जानबूझकर अगले पद में जारी वाक्य का संकेत देता है।
