  text: The sheep bore according to their kinds; and every one with marks belonged to Jacob, and every one without marks to Laban.
translation:
  language: hi
  text: भेड़ों ने अपने-अपने रूप[a] के अनुसार बच्चे जने; और जिन पर निशान थे, वे सब याकूब के हुए, और जिन पर कोई निशान नहीं था, वे लाबान के हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी-अपनी जाति के अनुसार।”
    reason: मूल पद ‘रूप/आकृति’ का अर्थ दे सकता है, जबकि प्रसंग में इसे प्रकार या जाति के अर्थ में भी समझा गया है; इस अस्पष्टता को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: አባግዐ
  choice: भेड़ों
  rationale: यह स्पष्ट कर्ता है; इसे बनाए रखना आवश्यक है।
- source_word: ይለዳ
  choice: बच्चे जने
  rationale: प्रसंग में पशुओं के प्रसव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘበአርአያሆን
  choice: अपने-अपने रूप के अनुसार
  rationale: गीज़ पद का मूल अर्थ रूप या दिखाई देने वाली आकृति की ओर संकेत करता है; पुनरुक्त ‘अपने-अपने’ समूह के भीतर भिन्न रूपों का भाव स्पष्ट करता है।
- source_word: ትእምርት
  choice: निशान
  rationale: चिह्न या पहचान देने वाले बाहरी चिन्ह के लिए सहज और प्रसंगानुकूल शब्द।
- source_word: ለያዕቆብ / ለላባ
  choice: याकूब के हुए / लाबान के हुए
  rationale: सम्बन्धसूचक गीज़ रचना को पशुओं के स्वामित्व के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
