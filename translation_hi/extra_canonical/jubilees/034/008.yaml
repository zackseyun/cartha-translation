  choice: अपने पशुधन को फिर इकट्ठा किया
  rationale: መራዕይ पशुओं के झुंड अथवा पशुधन को सूचित करता है और क्रिया पुनः एकत्र करने का भाव देती है; इसलिए व्यापक ‘संपत्ति’ के बजाय स्रोत का पशु-संबंधी अर्थ रखा गया है।
- source_word: ዐብየ፡ ላዕሌሆሙ
  choice: उन पर प्रबल हुआ
  rationale: वाक्यांश विरोधियों की तुलना में शक्तिशाली होकर उन पर अधिकार पाने का भाव व्यक्त करता है।
- source_word: ሠርዐ፡ ፀባሕተ፡ ላዕሌሆሙ
  choice: उन पर कर लगाया
  rationale: यहाँ ፀባሕት अधीन लोगों से लिए जाने वाले कर अथवा नजराने के अर्थ में है; आधुनिक हिन्दी में ‘कर’ स्पष्ट और स्वाभाविक है।
- source_word: ኀምስተ፡ ፍሬ፡ ምድርሙ
  choice: अपनी भूमि की उपज का पाँचवाँ भाग
  rationale: शाब्दिक संरचना ‘उनकी भूमि के फल/उत्पाद का पाँचवाँ’ है; ‘उपज’ कृषि-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወሐነጸ
  choice: और उसने निर्माण कराया—
  rationale: क्रिया का अर्थ बनाना/निर्माण करना है। उपलब्ध अंश यहीं अपूर्ण रूप से समाप्त होता है, इसलिए डैश द्वारा अगले पाठ में जारी निर्माण-वस्तु का संकेत रखा गया है।
