  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
translation:
  language: hi
  text: इस कारण इस्राएल की संतानों के लिए यह ठहराया गया कि वे सातवें महीने के दसवें दिन[a]—जिस दिन यूसुफ के विषय में समाचार उसके पिता याकूब तक पहुँचा था—अपने आप को कष्ट दें। और वे उसी दिन, अर्थात् सातवें महीने के दसवें दिन, हर वर्ष अपने पापों के कारण एक बकरे के बच्चे के द्वारा अपने लिए प्रायश्चित करें; क्योंकि उन्होंने अपने पिता के अपने पुत्र यूसुफ के प्रति स्नेह को दुःख पहुँचाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अध्याय सातवें महीने के दसवें दिन प्रतिवर्ष अपने आप को कष्ट देने की प्रथा को यूसुफ के लहू लगे वस्त्र और याकूब के शोक से जोड़ता है। इस प्रकार यह प्रायश्चित-दिवस (योम किप्पूर) के पालन की उत्पत्ति का कारण बताता है।
    reason: cross_reference
lexical_decisions:
- source_word: ይሕመሙ
  choice: अपने आपको दीन करें
  rationale: क्रिया के आत्मपीड़न/आत्म-दीनता के धार्मिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर स्रोत में स्पष्ट न किए गए उपवास को नहीं जोड़ता।
- source_word: ያስተስርዩ
  choice: अपने लिए प्रायश्चित करें
  rationale: प्रायश्चित कराने/संपन्न करने के अनुष्ठानिक भाव को स्पष्ट और प्रचलित धार्मिक हिन्दी में रखता है।
- source_word: ጠሊ
  choice: एक बकरे के बच्चे के द्वारा
  rationale: यहाँ शब्द कम उम्र के बकरे या छौने को सूचित करता है; 'बकरे का बच्चा' सामान्य पाठक के लिए स्पष्ट है और अनुष्ठानिक साधन को 'के द्वारा' व्यक्त करता है।
- source_word: ምሕረቶ
  choice: स्नेह
  rationale: इस प्रसंग में पिता की यूसुफ के प्रति कोमल भावना/ममता अभिप्रेत है; 'स्नेह' स्वाभाविक हिन्दी है और इसे केवल 'दया' तक सीमित नहीं करता।
- source_word: ዜናሁ ለዮሴፍ
  choice: यूसुफ के विषय में समाचार
  rationale: स्रोत केवल यूसुफ से संबंधित समाचार कहता है; उसकी मृत्यु का समाचार कहना पाठ से अधिक निश्चित होगा।
theological_decisions:
- issue: सातवें महीने के दसवें दिन स्वयं को दीन करने का विधान
  choice: पाठ में केवल 'अपने आपको दीन करें' रखा गया
  alternative: उपवास करें / अपने प्राणों को दुःख दें
  rationale: यह अनुवाद प्रायश्चित-दिवस से संबंध बनाए रखता है, किंतु स्रोत में स्पष्ट रूप से न आए उपवास या किसी खास तपस्या को नहीं जोड़ता।
- issue: यूसुफ के समाचार की प्रकृति
  choice: यूसुफ के विषय में समाचार
  alternative: यूसुफ की मृत्यु का समाचार
  rationale: गीज़ पाठ समाचार की विषयवस्तु को मृत्यु के रूप में स्पष्ट नहीं करता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। लंबे गीज़ वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। 'इस्राएल की संतानें', 'प्रायश्चित' और 'अपने आपको दीन करें' जैसे पद बाइबलीय संदर्भ बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
