  text: उसके सेवकों को उस दिन तक, जब वह और उसके पुत्र मिस्र उतर गए। और इस सप्ताह के सातवें वर्ष में उसने यूसुफ को अपने घर से भेजा, ताकि वह अपने भाइयों का कुशल-क्षेम जाने—के देश में[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए गीइज़ स्रोतांश का अंत संबंधसूचक वाक्यांश “के देश में” पर होता है; इसके बाद आने वाला स्थान-नाम यहाँ उपलब्ध नहीं है।
    reason: स्रोत में पद-विभाजन या पाठांश की अपूर्णता को स्पष्ट करना और अनुमान से संभावित स्थान-नाम न जोड़ना।
lexical_decisions:
- source_word: ወረዱ
  choice: उतर गए
  rationale: मिस्र जाने के लिए प्रयुक्त मूल क्रिया के स्थानिक रूपक ‘नीचे उतरना’ को बनाए रखा गया है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: यह सात वर्षों की अवधि के लिए प्रयुक्त ‘सप्ताह’ है; पद में साथ आए ‘सातवें वर्ष’ से अर्थ स्पष्ट रहता है।
- source_word: ያእምር፡ ሰላሞሙ
  choice: कुशल-क्षेम जाने
  rationale: शाब्दिक भाव ‘उनकी शांति/भलाई जाने’ है; आधुनिक हिन्दी में ‘कुशल-क्षेम जानना’ स्वाभाविक और अर्थ-संगत है।
- source_word: እምቤቱ
  choice: अपने घर से
  rationale: प्रत्यावर्ती संदर्भ यूसुफ को भेजने वाले व्यक्ति के घर की ओर है; हिन्दी में ‘अपने’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ውስተ፡ ምድረ
  choice: के देश में
  rationale: ምድረ संबंधसूचक/construct रूप में है और इसके बाद अपेक्षित स्थान-नाम दिए गए स्रोतांश में नहीं है; इसलिए अपूर्णता को नहीं भरा गया।
