base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/020.yaml
  text: And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, an Egyptian; and the name of Benjamin’s wife was Iyasaka.
translation:
  language: hi
  text: और यूसुफ को ले जाया गया, उसके बाद याकूब के पुत्रों ने विवाह किए। रूबेन की पत्नी का नाम आदा था; शिमोन की पत्नी का नाम अदीबा था, जो कनानी थी; लेवी की पत्नी का नाम मेलका था, जो अराम की बेटियों में से और तेरह के पुत्रों के वंश से थी; यहूदा की पत्नी का नाम बेतासूएल था, जो कनानी थी; इस्साकार की पत्नी का नाम हीज़का था; जबूलून की पत्नी का नाम नीअमान था; दान की पत्नी का नाम एगला था; नप्ताली की पत्नी का नाम रासूआ था, जो मेसोपोटामिया की थी; गाद की पत्नी का नाम माका था; आशेर की पत्नी का नाम इयोना था; यूसुफ की पत्नी का नाम आसनत था, जो मिस्री थी; और बिन्यामीन की पत्नी का नाम इयासाका था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐጕለ ዮሴፍ
  choice: यूसुफ के लापता हो जाने के बाद
  rationale: क्रिया यूसुफ के खो जाने या दृष्टि से ओझल हो जाने का भाव देती है; यहाँ ‘मर जाने’ जैसा अधिक निश्चित अर्थ आरोपित न करके कथा-संदर्भ के अनुकूल ‘लापता’ रखा गया है।
- source_word: ነሥኡ ... አንስትያ
  choice: विवाह किए
  rationale: शाब्दिक अर्थ ‘स्त्रियाँ/पत्नियाँ लीं’ है; आधुनिक हिन्दी में ‘विवाह किए’ उसी आशय को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ከናዊት / ከነናዊት
  choice: कनानी थी
  rationale: स्त्रीलिंग जातिवाचक पद को स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: እንተ ሜስጶጦምያ
  choice: जो मेसोपोटामिया की थी
  rationale: भौगोलिक संबद्धता को सहज हिन्दी में रखा गया है और प्राचीन स्थान-नाम का प्रचलित रूप अपनाया गया है।
- source_word: አስኔት ግብጻዊት
  choice: आसनत था, जो मिस्री थी
  rationale: नाम का निकट देवनागरी लिप्यंतरण किया गया है और स्त्रीलिंग ‘मिस्री’ द्वारा मिस्र की मूलनिवासी होने का भाव सुरक्षित रखा गया है।
