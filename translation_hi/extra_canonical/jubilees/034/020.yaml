translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। व्यक्तिनामों को गीइज़ रूपों के निकट देवनागरी में लिखा गया है, जबकि बाइबिल में सुविख्यात पितृवंशीय नामों के प्रचलित हिन्दी रूप अपनाए गए हैं। उपलब्ध गीइज़ अंश अंतिम ‘और ... की पत्नी का नाम’ पर कट जाता है; बिन्यामीन और इयासाका का अंतिम पद दिए गए परीक्षित अंग्रेज़ी परामर्श-पाठ के अनुसार पूरा किया गया है।
