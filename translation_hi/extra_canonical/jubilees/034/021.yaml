  yaml_path: translation/extra_canonical/jubilees/034/021.yaml
  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
translation:
  language: hi
  text: बिन्यामीन की पत्नी इयासाका थी। और शिमोन को पछतावा हुआ[a], और उसने अपने भाइयों की तरह मेसोपोटामिया से दूसरी पत्नी ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस क्रिया का अर्थ “उसने पश्चात्ताप किया,” “उसने मन बदल लिया,” या अधिक सामान्य रूप में “वह लौट आया” भी हो सकता है। यहाँ इसका संबंध इस बात से है कि उसने अपने भाइयों की तरह मेसोपोटामिया से दूसरी पत्नी ली।
    reason: alternative_reading
lexical_decisions:
- source_word: ብእሲተ፡ ብንያም፡ ኢያስካ
  choice: बिन्यामीन की पत्नी इयासाका थी
  rationale: खंड नामवाचक कथन है; हिंदी में स्वाभाविक पूर्ण वाक्य के लिए ‘थी’ जोड़ा गया है।
- source_word: ወተመይጠ፡ ስምዖን
  choice: फिर शिमोन का मन बदल गया
  rationale: क्रिया लौटने, मन बदलने अथवा पछताने का भाव दे सकती है। संदर्भ में दूसरी पत्नी लेने की ओर निर्णय-परिवर्तन स्पष्ट है, जबकि नैतिक ‘पश्चात्ताप’ कहना अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: እም፡ ሜስጶ ጦምያ
  choice: मेसोपोटामिया से
  rationale: स्थाननाम का प्रचलित हिंदी लिप्यंतरण अपनाया गया है।
- source_word: ካልእተ
  choice: दूसरी पत्नी
  rationale: स्त्रीलिंग क्रमवाचक पद पूर्ववर्ती ‘पत्नी’ को समझाता है; स्पष्ट और स्वाभाविक हिंदी में संज्ञा दोहराई गई है।
- source_word: ከመ፡ አኅዊሁ
  choice: अपने भाइयों के समान
  rationale: तुलना को औपचारिक किंतु सरल आधुनिक हिंदी में सुरक्षित रखा गया है।
theological_decisions:
- issue: शिमोन की क्रिया में पश्चात्ताप या सामान्य निर्णय-परिवर्तन
  choice: उसका मन बदल गया
  alternative: उसे पछतावा हुआ / उसने पश्चात्ताप किया / वह लौट गया
  rationale: मूल क्रिया अर्थगत विस्तार रखती है। मुख्य पाठ में संदर्भानुकूल तटस्थ अभिव्यक्ति रखी गई और वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है।
