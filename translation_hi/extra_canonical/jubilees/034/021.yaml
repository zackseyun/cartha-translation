  register: आधुनिक मानक हिंदी, सरल और गरिमापूर्ण कथात्मक शैली। नामों के लिए ‘बिन्यामीन’, ‘शिमोन’, ‘इयासाका’ और ‘मेसोपोटामिया’ रूप रखे गए हैं।
