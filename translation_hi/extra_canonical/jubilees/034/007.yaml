  choice: हथियार उठानेवाले
  rationale: क्रिया ‘ढोना/उठाना’ और संज्ञा ‘हथियार’ का स्वाभाविक हिन्दी रूप; इससे सशस्त्र पुरुषों का आशय स्पष्ट रहता है।
- source_word: ጸአተ፡ ዘሴቄም
  choice: शकेम की उतराई
  rationale: ጸአተ का मूल भाव निकलने अथवा नीचे जाने का है और यहाँ स्थलाकृतिक संदर्भ में ‘उतराई’ उपयुक्त है; ‘मैदान’ अर्थ को गलत ढंग से निश्चित कर देगा।
- source_word: በአፈ፡ ሰይፍ
  choice: तलवार की धार से
  rationale: शाब्दिक मुहावरा ‘तलवार के मुँह से’ है; आधुनिक हिन्दी में ‘तलवार की धार से’ वही अर्थ स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: አሬስ፡ ታፉ፡ ሴሬጋን
  choice: आरेस, ताफू और सेरागान
  rationale: व्यक्तिवाचक नामों का गीइज़ रूप के निकट देवनागरी लिप्यंतरण किया गया है।
