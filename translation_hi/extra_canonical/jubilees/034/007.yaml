translation:
  language: hi
  text: हथियार लिए हुए छह हज़ार पुरुष थे। उसने उन्हें शकेम की उतराई[a] में मार डाला। फिर उसने भागनेवालों का पीछा किया और उन्हें तलवार की धार से मार डाला। उसने आरेस, ताफू और सेरागान को भी मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शकेम का मैदान।”
    reason: गीइज़ स्थलाकृतिक पद ጸአተ के अर्थ पर अनिश्चितता को दर्शाता है; मुख्य पाठ में “उतराई” नवीन source-review निर्णय के अनुसार रखा गया है।
