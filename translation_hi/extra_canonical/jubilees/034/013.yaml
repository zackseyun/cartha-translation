  yaml_path: translation/extra_canonical/jubilees/034/013.yaml
  text: And he mourned all that night, because at evening they had brought it to him, and he became fevered with grief for his death, and said, “A wild beast has devoured Joseph.” And all the people of his house mourned with him on that day, and they were grieving and mourning with him all that day.
translation:
  language: hi
  text: वह उस सारी रात विलाप करता रहा, क्योंकि साँझ को वे उसे उसके पास ले आए थे। उसकी मृत्यु का शोक करते हुए उसे ज्वर चढ़ गया, और उसने कहा, “किसी जंगली पशु ने यूसुफ को खा लिया है।” उस दिन उसके घर के सभी लोग उसके साथ विलाप करते रहे; वे उस पूरे दिन उसके साथ शोक और विलाप करते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበሐወ
  choice: विलाप करता रहा
  rationale: यह क्रिया गहरे शोक की मुखर अभिव्यक्ति बताती है; आधुनिक हिन्दी में ‘विलाप’ प्रसंग की तीव्रता और गरिमा दोनों बनाए रखता है।
- source_word: ወፈጸነ
  choice: उसे ज्वर चढ़ गया
  rationale: स्रोत और प्राचीन पाठ-परंपरा यहाँ शोक से उत्पन्न ज्वराक्रांत अवस्था का संकेत देती है; केवल ‘बहुत दुखी हुआ’ कहने से शारीरिक प्रभाव लुप्त हो जाता।
- source_word: አርዌ፡ ጸዋገ
  choice: किसी जंगली पशु
  rationale: पदबंध हिंसक वन-पशु की ओर संकेत करता है। ‘किसी’ हिन्दी में अनिश्चितता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ሰብአ፡ ቤቱ
  choice: उसके घर के सभी लोग
  rationale: यह केवल निकट परिवार तक सीमित न होकर पूरे घराने के लोगों को समेट सकता है; इसलिए समावेशी अभिव्यक्ति चुनी गई।
theological_decisions:
- issue: यूसुफ की कथित मृत्यु को कथाकार का तथ्य मानना या याकूब की धारणा के रूप में रखना
