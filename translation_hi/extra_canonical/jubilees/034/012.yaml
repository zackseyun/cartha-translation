  yaml_path: translation/extra_canonical/jubilees/034/012.yaml
  text: And the sons of Jacob slaughtered a kid of the goats and dipped Joseph’s garment in the blood, and sent it to Jacob their father on the tenth of the seventh month.
translation:
  language: hi
  text: और याकूब के पुत्रों ने बकरी का एक बच्चा मार डाला, यूसुफ़ के वस्त्र को उसके खून में डुबोया, और सातवें महीने की दसवीं तारीख को उसे अपने पिता याकूब के पास भेज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘብሑ
  choice: बलि किया
  rationale: गीज़ क्रिया वध करने/बलि करने का बोध देती है; प्रसंग में पशु को मारने की क्रिया के लिए यह संक्षिप्त और गरिमापूर्ण रूप है।
- source_word: ዳቤላ ጠሊ
  choice: बकरियों में से एक मेमना
  rationale: स्रोत पदबंध बकरी के बच्चे को सूचित करता है; हिंदी में पशु-समूह और एक बच्चे, दोनों संकेत सुरक्षित रखे गए हैं।
- source_word: ወጸንቀቀ
  choice: डुबोया
  rationale: क्रिया वस्त्र को लहू में डुबाने की क्रिया व्यक्त करती है; यह केवल ‘रंग दिया’ या ‘दाग दिया’ से अधिक सटीक है।
- source_word: ልብሱ ለዮሴፍ
  choice: यूसुफ़ के वस्त्र
  rationale: स्वामित्व-संबंध को स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है; स्रोत वस्त्र का प्रकार निर्दिष्ट नहीं करता।
- source_word: አመ ዐሡሩ ለወርኀ ሳብዕ
  choice: सातवें महीने की दसवीं तारीख को
  rationale: स्रोत की कैलेंडर-सूचना को स्पष्ट, सामान्य आधुनिक हिंदी में रखा गया है।
