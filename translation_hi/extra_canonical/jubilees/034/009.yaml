  text: Robel and Tamnatares. And he returned in peace and made peace with them, and they became his
translation:
  language: hi
  text: रोबेल और तम्नातारेस। फिर वह सकुशल लौट आया, उसने उनके साथ मेल किया, और वे उसके हो गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक भाव ‘वे उसके लिए/उसके हो गए’ है; सम्बन्ध का ठीक स्वरूप स्पष्ट नहीं किया गया है।
    reason: अन्तिम गीइज़ क्रिया में सम्बन्ध-सूचक प्रत्यय है, पर उस सम्बन्ध की प्रकृति अनिर्दिष्ट है।
lexical_decisions:
- source_word: ወተመይጠ፡ በሰላም
  choice: फिर वह सकुशल लौट आया
  rationale: वाक्यांश का शाब्दिक भाव ‘और वह शान्ति में लौटा’ है; ‘सकुशल लौट आया’ आधुनिक हिन्दी में स्वाभाविक ढंग से सुरक्षित और शान्तिपूर्ण वापसी व्यक्त करता है।
- source_word: ወገብረ፡ ምስሌሆሙ፡ ሰላመ
  choice: उसने उनके साथ मेल किया
  rationale: ‘उनके साथ शान्ति की/स्थापित की’ का स्वाभाविक हिन्दी रूप; यह केवल मन की शान्ति नहीं, पारस्परिक मेल का संकेत देता है।
- source_word: ወኮንዎ
  choice: और वे उसके हो गए
  rationale: क्रिया के साथ तीसरे पुरुष एकवचन पुल्लिंग कर्म/सम्बन्ध-सूचक प्रत्यय को बनाए रखता है। केवल ‘वे थे’ कहना इस प्रत्यय को खो देगा; फिर भी मूल में सम्बन्ध का सटीक प्रकार नहीं बताया गया।
theological_decisions:
- issue: अन्तिम पद में व्यक्त सम्बन्ध का स्वरूप
  choice: वे उसके हो गए
  alternative: वे उसके अधीन हो गए / वे उसके सेवक हो गए
  rationale: मूल पाठ ‘उसके’ साथ सम्बन्ध व्यक्त करता है, पर सेवकता, अधीनता या किसी अन्य विशेष सम्बन्ध को स्पष्ट नहीं करता; इसलिए अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। व्यक्तिनामों का लिप्यन्तरण उपलब्ध पाठ और परामर्श-पाठ के अनुरूप है; खण्डित आरम्भ तथा अन्तिम सम्बन्धगत अस्पष्टता को बिना विस्तार जोड़े सुरक्षित रखा गया है।
