  yaml_path: translation/extra_canonical/jubilees/034/015.yaml
  text: And on that day Bilhah heard that Joseph had perished, and while she was mourning for him she died in Qafratef[15], and Dinah his daughter also died after Joseph had perished.
translation:
  language: hi
  text: उसी दिन बिल्हा ने सुना कि यूसुफ खो गया था। उसके लिए विलाप करते-करते वह कफरातेफ[a] में मर गई। यूसुफ के खो जाने के बाद याकूब की बेटी दीना भी मर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कफरातेफ’ स्थान-नाम का उच्चारण निश्चित नहीं है; संभव है कि इथियोपिक पाठ-परंपरा में यह नाम बिगड़ गया हो।
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕለ
  choice: खो गया
  rationale: क्रिया का अर्थ खो जाना, लापता हो जाना या नष्ट हो जाना हो सकता है। प्रसंग में यूसुफ वास्तव में जीवित था, पर परिवार उसे खोया हुआ और संभवतः मरा हुआ मानता था; इसलिए ‘खो गया’ मूल की अर्थगत व्यापकता बनाए रखता है।
- source_word: ትለሐዎ
  choice: उसके लिए विलाप करते-करते
  rationale: यह रूप यूसुफ के कारण शोक-विलाप करने की निरंतर क्रिया बताता है; हिंदी में यह अभिव्यक्ति स्वाभाविक और प्रसंगानुकूल है।
- source_word: ቀፍራቲፍ
  choice: कफरातेफ
  rationale: अनिश्चित इथियोपिक स्थान-नाम का अर्थानुवाद करने के बजाय ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: ወዳኖኒ ወለቱ
