  yaml_path: translation/extra_canonical/jubilees/034/017.yaml
  text: And he mourned for Joseph one year and did not cease, for he said, “I will go down to the grave mourning for my son.”
translation:
  language: hi
  text: और वह यूसुफ़ के लिए एक वर्ष तक शोक करता रहा और उसने शोक करना न छोड़ा, क्योंकि उसने कहा, “मैं अपने बेटे के लिए शोक करते हुए कब्र में उतरूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይላሑ
  choice: शोक करता रहा
  rationale: यह क्रिया निरंतर विलाप या शोक करने का भाव व्यक्त करती है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण रूप चुना गया है।
- source_word: ኢአነገሐ
  choice: उसने शोक करना न छोड़ा
  rationale: स्रोत में न रुकने या विराम न देने का भाव है; हिन्दी में स्पष्टता के लिए क्रिया का आशय दोहराया गया है।
- source_word: መቃብር
  choice: कब्र
  rationale: शब्द का सीधा अर्थ कब्र या समाधि है; यहाँ मृत्यु अथवा मृतकों के लोक की व्याख्या थोपे बिना मूर्त स्रोत-रूप रखा गया है।
theological_decisions:
- issue: ‘कब्र में उतरना’ का अर्थ
  choice: कब्र में उतरूँगा
  alternative: अधोलोक में उतरूँगा / मर जाऊँगा
  rationale: स्रोत के ठोस और कुछ हद तक बहुअर्थी रूप को सुरक्षित रखा गया है; इसे किसी विशिष्ट परलोक-सिद्धांत के अनुसार नहीं खोला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। ‘यूसुफ़’ और ‘कब्र’ जैसे सामान्य बाइबिलीय शब्द रखे गए हैं, तथा स्रोत की पुनरुक्ति को अर्थ-स्पष्टता के लिए स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
