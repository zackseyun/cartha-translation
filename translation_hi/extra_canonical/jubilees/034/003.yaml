lexical_decisions:
- source_word: መንፈሱ
  choice: उसकी आत्मा
  rationale: मूल में ‘आत्मा/प्राण’ का स्पष्ट उल्लेख है; इसे केवल ‘मन’ करके अर्थ को संकीर्ण नहीं किया गया।
- source_word: ኀዲጎተ
  choice: उसे छोड़कर
  rationale: मूल क्रिया का अर्थ ‘छोड़ना’ है; प्रसंग में इसका स्वाभाविक हिन्दी रूप ‘उसे छोड़कर नहीं जा सकते थे’ है।
- source_word: እንስሳሆሙ
  choice: उनके पशुओं
  rationale: यह सामान्य रूप से उनके पालतू पशुओं या मवेशियों को सूचित करता है; ‘पशुओं’ से मूल की व्यापकता बनी रहती है।
