translation:
  language: hi
  text: “उन्होंने तुम्हारे पुत्रों को घेर लिया है और उनके झुंडों को कब्ज़े में ले लिया है।” तब वह अपने घर से निकला—वह, उसके तीन पुत्र, उसके पिता के सभी सेवक और उसके अपने घर के सेवक—और छह हज़ार पुरुषों को साथ लेकर उनका सामना करने गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐገትዎሙ
  choice: उन्होंने ... को घेर लिया है
  rationale: क्रिया का घेरने या चारों ओर से रोक लेने का भाव रखा गया है; पूर्ववर्ती कथन का आरंभ इस पद में नहीं है, इसलिए हिन्दी वाक्य भी उद्धरण के बीच से आरंभ होता है।
- source_word: መራዕዮሙ
  choice: उनके झुंडों
  rationale: यह पशुओं के झुंडों के लिए प्रयुक्त शब्द है; संदर्भ में सामान्य और स्वाभाविक हिन्दी ‘झुंड’ उपयुक्त है।
- source_word: ተማህጠኑ
  choice: कब्ज़े में ले लिया है
  rationale: बलपूर्वक पकड़ने या छीन लेने का भाव व्यक्त करता है; केवल तटस्थ ‘ले लिया’ से अधिक सटीक है।
- source_word: ደቂ አቡሁ ወደቂ ቤቱ
  choice: उसके पिता के सभी सेवक और उसके अपने घर के सेवक
  rationale: स्रोत में दो अलग समूह हैं; उन्हें एक ही ‘पिता के घराने’ में नहीं मिलाया गया।
- source_word: በስሳ [ምእት]
  choice: छह हज़ार पुरुषों को साथ लेकर
  rationale: पाठ-साक्ष्य में संख्या ‘साठ सौ’, अर्थात छह हज़ार, समझी जाती है; प्रसंगानुसार साथ जाने वाले पुरुष स्पष्ट किए गए हैं।
