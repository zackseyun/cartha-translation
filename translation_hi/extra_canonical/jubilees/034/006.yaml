  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। उद्धरण के खंडित आरंभ को कृत्रिम रूप से पूरा नहीं किया गया। दो सेवक-समूहों का भेद सुरक्षित रखा गया है और पुराने ‘पशुओं के साथ’ वाले भ्रमित पाठ को नहीं अपनाया गया।
