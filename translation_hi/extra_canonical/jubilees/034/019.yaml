  yaml_path: translation/extra_canonical/jubilees/034/019.yaml
  text: Their sin was that they had brought grief to the compassion of their father because of Joseph his son. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.
translation:
  language: hi
  text: उनका पाप यह था कि उन्होंने यूसुफ के कारण—जो उनके पिता का पुत्र था—अपने पिता की करुणा को ठेस पहुँचाई। और यह दिन इसलिए ठहराया गया कि वे हर वर्ष एक बार इसी दिन अपने पापों, अपने सब अपराधों और अपनी सब भूलों के लिए शोक करें और अपने आप को शुद्ध करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃጢአቶሙ (ḫaṭiʾātomu)
  choice: उनका पाप / अपने पापों
  rationale: पहले प्रयोग में उनके विशेष दोष का उल्लेख है, जबकि बाद के प्रयोग में व्यापक रूप से उनके पापों के लिए शोक करने की बात है; हिन्दी में प्रसंगानुसार वचन रखा गया है।
- source_word: ምሕረተ፡ አቡሆሙ (məḥrata ʾabuhomu)
  choice: अपने पिता के करुणामय हृदय
  rationale: मूल का ‘पिता की करुणा’ हिन्दी में अस्वाभाविक लग सकता है। ‘करुणामय हृदय’ करुणा के अर्थ को बनाए रखते हुए भावनात्मक पीड़ा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ተሠርዐት (taśarʿat)
  choice: ठहराया गया
  rationale: यह दिन विधिवत नियुक्त या निर्धारित किए जाने का भाव देता है; ‘ठहराया गया’ धार्मिक-साहित्यिक गरिमा के साथ सरल हिन्दी है।
- source_word: ይሕዝኑ (yəḥzənu)
  choice: शोक करें
  rationale: क्रिया दुःख या शोक मनाने का अर्थ देती है; प्रायश्चित्त के प्रसंग में ‘शोक करें’ उपयुक्त है।
- source_word: አበሳሆሙ (ʾabasāhomu)
  choice: अपने सब अपराधों
  rationale: यह पाप से संबंधित दोष अथवा अपराध को दर्शाता है और निकटवर्ती ‘पापों’ से अर्थगत भेद बनाए रखता है।
theological_decisions:
- issue: वार्षिक शुद्धि का स्वरूप
  choice: अपने आप को शुद्ध करें
  alternative: उनका प्रायश्चित्त हो / वे क्षमा पाएँ
  rationale: परामर्श-पाठ और पद के अनुष्ठानिक संदर्भ में आत्म-शुद्धि की भाषा है। किसी विशिष्ट प्रायश्चित्त-सिद्धान्त या क्षमा की व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: पिता की करुणा को दुःख पहुँचाना
  choice: अपने पिता के करुणामय हृदय को दुःख पहुँचाया
  alternative: अपने पिता की करुणा को दुःखी किया
  rationale: मूल की असामान्य अभिव्यक्ति का करुणा-संबंधी तनाव बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य रूप दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और अनुष्ठानिक लहजा रखा गया है। वाक्य-संरचना को स्वाभाविक बनाया गया है, पर पाप, अपराध, भूल, शोक और शुद्धि के अलग-अलग भाव सुरक्षित रखे गए हैं। उपलब्ध गीइज़ उद्धरण अंत में अपूर्ण है; अंतिम खंड के लिए परीक्षित अंग्रेज़ी POB परामर्श-पाठ का सहारा लिया गया है।
