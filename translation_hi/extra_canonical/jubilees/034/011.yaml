base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/011.yaml
  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
translation:
  language: hi
  text: शकेम, और उसने उन्हें दोतान की भूमि में पाया। उन्होंने उसके साथ विश्वासघात किया और उसे मार डालने की योजना बनाई। परन्तु फिर अपना विचार बदलकर उन्होंने उसे इश्माएली व्यापारियों के हाथ बेच दिया। वे उसे मिस्र ले गए और वहाँ उसे फ़िरौन के एक अधिकारी—अंगरक्षकों के प्रधान[a] और हेलियोपोलिस नगर के पुरोहित—पोतीपर के हाथ बेच दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवाद यहाँ ‘रसोइयों का प्रधान’ देते हैं, पर इस गीज़ पाठ में प्रयुक्त पद का सीधा अर्थ ‘अंगरक्षकों का प्रधान’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐብበይዎ
  choice: उन्होंने उसके साथ विश्वासघात किया
  rationale: क्रिया का अर्थ छल या विश्वासघात करना है; इसे ‘उससे घृणा की’ कहना स्रोत के अर्थ से कम सटीक होगा।
- source_word: ለነጋዲተ እስማዒላዊያን
  choice: इश्माएली व्यापारियों के हाथ
  rationale: यह पद इश्माएली सौदागरों या व्यापारियों को सूचित करता है; आधुनिक हिन्दी में ‘व्यापारियों’ स्वाभाविक और स्पष्ट है।
- source_word: ሐፀወ ፈርዖን
  choice: फ़िरौन के अधिकारी
  rationale: राजदरबार के पदाधिकारी के लिए सम्मानजनक और व्यापक हिन्दी शब्द चुना गया है; मूल पद का शाब्दिक अर्थ खोजा या नपुंसक भी हो सकता है, पर प्रसंग में राजकीय अधिकारी अभिप्रेत है।
- source_word: ሊቀ ዐቀብት
  choice: अंगरक्षकों के प्रधान
  rationale: इथियोपिक पद का सीधा अर्थ रखवालों या अंगरक्षकों का प्रधान है; परिचित उत्पत्ति-पाठ के ‘रसोइयों का प्रधान’ को यहाँ आरोपित नहीं किया गया।
- source_word: ሣውዕ ዘሀገረ ኤሌው
  choice: हेलियोपोलिस नगर के पुरोहित
  rationale: नगर-नाम को उसके प्रचलित रूप ‘हेलियोपोलिस’ में दिया गया और पद को ‘पुरोहित’ अनूदित किया गया, भले ही यह परिचित उत्पत्ति-विवरण से तनाव उत्पन्न करता हो।
theological_decisions:
- issue: पोतीपर के पदों का असामान्य संयोजन
  choice: फ़िरौन का अधिकारी, अंगरक्षकों का प्रधान और हेलियोपोलिस का पुरोहित—तीनों पद सुरक्षित रखे गए।
  alternative: परिचित उत्पत्ति-पाठ के अनुरूप ‘फ़िरौन का अधिकारी और अंगरक्षकों का प्रधान’ कहना अथवा पुरोहित-पद को अलग व्यक्ति से जोड़ना।
  rationale: स्रोत-पाठ इसी वाक्य में सभी पद पोतीपर से जोड़ता है; पाठगत या ऐतिहासिक तनाव को चुपचाप दूर नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भ का ‘शकेम’ पिछले पद से चली आ रही यात्रा-सूचना का वाक्यांश है; उपलब्ध पद-विभाजन के सम्मान में इसे बनाए रखा गया है। व्यक्ति और स्थान के नाम प्रचलित हिन्दी बाइबिलीय रूपों के निकट रखे गए हैं।
