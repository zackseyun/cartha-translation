- source_word: ዘይኄእስ
  choice: सबसे छोटा
  rationale: संदर्भ में यह पिता के पास रह गए सबसे छोटे पुत्र को सूचित करता है; हिन्दी में स्वाभाविक संबंधवाचक अर्थ दिया गया है।
- source_word: በእግዚአ
  choice: इसी कारण
  rationale: पाठ में कारणसूचक कथन है; अंग्रेज़ी परामर्श-पाठ भी इसी संबंध की पुष्टि करता है।
- source_word: ነገሥተ
  choice: के राजा
  rationale: गीज़ बहुवचन रूप को जहाँ स्थान-नाम के साथ बहुवचन है वहाँ यथावत रखा गया है।
- source_word: ደብር
  choice: पहाड़
  rationale: यहाँ निवास-स्थान के रूप में पर्वतीय भूभाग अभिप्रेत है; साधारण आधुनिक हिन्दी में ‘पहाड़’ स्वाभाविक है।
