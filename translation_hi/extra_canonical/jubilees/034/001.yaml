translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। मूल की कालगणना को ‘जुबली’ और ‘सप्ताह’ के रूप में सुरक्षित रखकर पादटिप्पणियों में समझाया गया है। वाक्य में निहित दूसरी क्रिया (‘सेवकों को भी भेजा’) हिन्दी में स्पष्ट रूप से दोहराई गई है, और बहुवचन स्वामित्व ‘उनके सेवक’ सावधानी से रखा गया है।
