base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/001.yaml
  text: And in the sixth year of this week, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and their servants also with them, in the pasture of Shechem.
translation:
  language: hi
  text: इस चवालीसवीं जुबली[a] के इस सप्ताह[b] के छठे वर्ष में याकूब ने अपने पुत्रों को उनकी भेड़ें चराने के लिए शकेम के चरागाह में भेजा, और उनके सेवकों को भी उनके साथ भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक जुबली उनचास वर्षों की अवधि है।
    reason: पुस्तक की तकनीकी कालगणना आधुनिक पाठक के लिए स्पष्ट करना।
  - marker: b
    text: यहाँ “सप्ताह” से सात वर्षों की अवधि का बोध होता है।
    reason: मूल के ‘सप्ताह’ को बनाए रखते हुए उसके कालगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: እዮቤልው
  choice: जुबली
  rationale: यह पुस्तक की कालगणना का तकनीकी शब्द है; प्रचलित बाइबलीय रूप रखते हुए पादटिप्पणी में इसकी अवधि स्पष्ट की गई है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल शब्द का सीधा अर्थ ‘सप्ताह’ है, पर यहाँ सात वर्षों की अवधि अभिप्रेत है; इस कालगत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ይርዐዩ
  choice: चराने के लिए
  rationale: क्रिया पशुओं को चराने या उनकी चरवाही करने को व्यक्त करती है; प्रसंग में ‘भेड़ें चराने’ स्वाभाविक हिन्दी है।
- source_word: አግብርቲሆሙኒ
  choice: उनके सेवकों को भी
  rationale: बहुवचन स्वामित्व-प्रत्यय का अर्थ ‘उनके’ है, अर्थात पुत्रों के सेवक; इसे ‘उसके’ नहीं किया गया।
- source_word: ጸአተ፡ ሴቄም
  choice: शकेम के चरागाह में
  rationale: मूल में एकवचन चराई-क्षेत्र का भाव है; ‘चरागाह’ इसे संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
