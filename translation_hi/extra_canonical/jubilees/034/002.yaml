translation:
  language: hi
  text: और एमोरियों के सात राजा उनके विरुद्ध इकट्ठे हुए, ताकि छिपकर उन्हें मार डालें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጋብኡ
  choice: इकट्ठे हुए
  rationale: यह क्रिया एकत्र होने या जुटने का भाव देती है; आधुनिक हिन्दी में ‘इकट्ठे हुए’ सहज और स्पष्ट है।
- source_word: ሱባዔቲሆሙ፡ ነገሥተ፡ አሞሬዎን
  choice: एमोरियों के सात राजा
  rationale: वाक्यांश में सात की संख्या, राजाओं और एमोरियों का संबंध सीधे रखा गया है।
- source_word: ከመ፡ ይቅትልዎሙ
  choice: ताकि ... उन्हें मार डालें
  rationale: उद्देश्यसूचक संरचना को ‘ताकि’ से व्यक्त किया गया है; ‘मार डालें’ हत्या के आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ኀብኢኦሙ
  choice: छिपकर
  rationale: रूप का संबंध छिपने या अपने को छिपाने से है। ‘छिपकर’ कर्ताओं द्वारा गुप्त ढंग से कार्य करने का भाव रखता है, बिना उसे केवल अमूर्त ‘गुप्त रूप से’ में बदलने के।
