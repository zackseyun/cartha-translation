  text: And it happened[3], when they had gone out from there, Joseph said to the man of his house, "Pursue them, run and overtake them, saying, 'Instead of good you have repaid me evil; you have stolen from me the silver cup from which my lord drinks.' And bring back to me their youngest brother, and bring him quickly before I enter into my judgment."
translation:
  language: hi
  text: और ऐसा हुआ कि जब वे वहाँ से निकल गए, तब यूसुफ़ ने अपने घर के प्रबंधक से कहा, “उनका पीछा करो, दौड़कर उन्हें जा पकड़ो और उनसे कहो, ‘भलाई के बदले तुमने मेरे साथ बुराई की है; तुमने मुझसे चाँदी का वह प्याला चुरा लिया है जिससे मेरा स्वामी पीता है।’ फिर उनके सबसे छोटे भाई को मेरे पास लौटा लाओ; इससे पहले कि मैं न्याय करने बैठूँ, उसे शीघ्र ले आओ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद का अंतिम वाक्यांश इस पाठ-विभाजन में कठिन है। आशय संभवतः यह है कि सबसे छोटे भाई को तत्काल वापस लाया जाए, इससे पहले कि यूसुफ़ इस मामले का न्याय करे; मूल मुहावरे का ठीक अर्थ अनिश्चित है।
    reason: segmentation_note
lexical_decisions:
- source_word: ለብእሲ፡ ቤቱ
  choice: अपने घर के प्रबंधक
  rationale: शाब्दिक अर्थ ‘उसके घर का आदमी’ है, पर प्रसंग में यह घर का उत्तरदायी अधिकारी है; ‘प्रबंधक’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ደግፎሙ፡ ሩጽ፡ ወተአንዞሙ
  choice: उनका पीछा करो, दौड़कर उन्हें जा पकड़ो
  rationale: तीनों आज्ञार्थक क्रियाओं—पीछा करना, दौड़ना और जा पकड़ना—का क्रम तथा तात्कालिकता सुरक्षित रखी गई है।
- source_word: ህየንተ፡ ሠናይት፡ ዐሠይክሙኒ፡ እኩየ
  choice: भलाई के बदले तुमने मेरे साथ बुराई की है
  rationale: ህየንተ का अर्थ ‘के बदले’ है; इसे प्रश्नवाचक ‘क्यों’ नहीं बनाया गया। प्रथम पुरुष कर्म-संबंध को ‘मेरे साथ’ से व्यक्त किया गया है।
- source_word: ሠረቅክሙኒ፡ ጽዋዐ፡ ብሩር
  choice: तुमने मुझसे चाँदी का वह प्याला चुरा लिया है
  rationale: क्रिया में निहित प्रथम पुरुष एकवचन कर्म-प्रत्यय को ‘मुझसे’ द्वारा स्पष्ट किया गया और ጽዋዐ፡ ብሩር को ‘चाँदी का प्याला’ अनूदित किया गया।
- source_word: ወአገብአ፡ ሊተ፡ ለአኁሆሙ፡ ዘይንእስ
  choice: फिर उनके सबसे छोटे भाई को मेरे पास लौटा लाओ
  rationale: ‘उनके भाई’ को सीधे आदेश का भाग रखा गया है, भाइयों से कहलाए गए उद्धरण का नहीं; इस कारण ‘तुम्हारे’ के स्थान पर स्रोत का तृतीय पुरुष ‘उनके’ सुरक्षित है।
- source_word: ዘእንበለ፡ እባእ፡ ውስተ፡ ምኵናንየ
  choice: इससे पहले कि मैं न्याय करने बैठूँ
  rationale: ዘእንበለ को ‘इससे पहले कि’ माना गया है, ‘कहीं ऐसा न हो कि’ नहीं। ‘न्याय में प्रवेश करना’ मुहावरे को बोधगम्य हिन्दी में ‘न्याय करने बैठना’ कहा गया है।
