  source_fidelity: 'The Hindi accurately represents the Geʽez sequence: ten donkeys carrying grain, their being sent away, their ascent to their father, and their report that Joseph lives, distributes grain to all the peoples of the earth, and rules. The distinct final governing/ruling predicate is retained.'
