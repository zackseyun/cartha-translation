  yaml_path: translation/extra_canonical/jubilees/043/024.yaml
  text: and ten donkeys carrying grain. And he sent them away. And they went up and told their father that Joseph was alive, and that he was distributing grain to all the peoples of the earth and ruling.
translation:
  language: hi
  text: और अनाज से लदे दस गधे भी। फिर उसने उन्हें विदा किया। वे ऊपर अपने पिता के पास गए और उन्हें बताया कि यूसुफ जीवित है, और वह पृथ्वी के सभी लोगों को अनाज बाँट रहा है और शासन कर रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐሠርተ፡ አእዱገ
  choice: दस गधे
  rationale: स्रोत में संख्या और संज्ञा स्पष्ट हैं; पूर्ववर्ती प्रसंग से जुड़ाव बनाए रखने के लिए आरंभ में ‘और’ रखा गया है।
- source_word: ዘይወስዱ፡ ስርናየ
  choice: अनाज से लदे
  rationale: शाब्दिक अर्थ ‘जो अनाज ले जा रहे थे’ है; हिंदी में भारवाही पशुओं के लिए ‘अनाज से लदे’ अधिक स्वाभाविक और समानार्थी है।
- source_word: ወፈነዎሙ
  choice: फिर उसने उन्हें विदा किया
  rationale: क्रिया का अर्थ भेज देना/विदा करना है; प्रसंग में ‘विदा किया’ सहज है और कर्ता को स्रोत के अनुसार एकवचन रखता है।
- source_word: ወዐርጉ
  choice: वे ऊपर ... गए
  rationale: स्रोत की आरोहणसूचक क्रिया को छोड़ा नहीं गया; पिता के निवास की ओर लौटने की दिशा ‘ऊपर गए’ से व्यक्त होती है।
- source_word: ይበፍር፡ ስርናየ
  choice: अनाज बाँट रहा है
  rationale: क्रिया अनाज वितरित करने का भाव देती है; वर्तमान जारी क्रिया स्रोत के कथन की स्थिति को बनाए रखती है।
- source_word: ለኵሉ፡ አሕዛበ፡ ምድር
  choice: पृथ्वी के सभी लोगों को
  rationale: ‘सभी जातियों/लोगों’ के व्यापक भाव को आधुनिक, सहज हिंदी में व्यक्त किया गया है।
- source_word: ወይኴንን
  choice: और शासन कर रहा है
  rationale: अंतिम क्रिया स्वतंत्र रूप से शासन/अधिकार चलाने का भाव रखती है; इसे पिछले क्रियापद में विलीन नहीं किया गया।
theological_decisions:
- issue: यूसुफ की शासकीय भूमिका का वर्णन
  choice: शासन कर रहा है
  alternative: न्याय कर रहा है / अधिकारी है
  rationale: गीज़ क्रिया शासन या अधिकार चलाने का अर्थ दे सकती है। ‘शासन कर रहा है’ स्रोत और अंग्रेज़ी परामर्श-पाठ दोनों के अनुरूप है और किसी अतिरिक्त धार्मिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद स्रोत में पूर्ववर्ती वाक्य से ‘और’ द्वारा जुड़ा है, इसलिए आरंभिक खंड को जानबूझकर उसी संयोजक रूप में रखा गया है।
