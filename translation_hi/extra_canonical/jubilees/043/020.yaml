  text: a numerous people. And tell my father that I am still alive, and look, you yourselves see that God has made me as a father to Pharaoh and as ruler in his house,
translation:
  language: hi
  text: बहुत-से लोग। और मेरे पिता को बता देना कि मैं अब भी जीवित हूँ। और देखो, तुम स्वयं देख ही रहे हो कि परमेश्वर ने मुझे फ़िरौन के लिए पिता-सा[a] और उसके घर का शासक बनाया है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “फ़िरौन का पिता”; आशय संभवतः विश्वस्त सलाहकार और संरक्षक का है।'
    reason: मूल की असामान्य ‘पिता’ संबंधी राजकीय उपमा को पाठक के लिए पारदर्शी रखते हुए मुख्य पाठ में स्वाभाविक हिन्दी देना।
lexical_decisions:
- source_word: ሕዝብ፡ ብዙኃን
  choice: बहुत-से लोग
  rationale: मूल का अर्थ ‘बहुसंख्यक लोग/एक बड़ी जनसंख्या’ है; खंडित वाक्य-संदर्भ को बनाए रखते हुए सरल आधुनिक हिन्दी चुनी गई।
- source_word: ዓዲ፡ ሕያው፡ አነ
  choice: मैं अब भी जीवित हूँ
  rationale: ዓዲ यहाँ निरंतरता, अर्थात ‘अब भी’, व्यक्त करता है।
- source_word: አንትሙኒ፡ ናሁ፡ ትሬእዩ
  choice: देखो, तुम स्वयं देख रहे हो
  rationale: नाहू (‘देखो’) और बलसूचक बहुवचन सर्वनाम दोनों को स्वाभाविक हिन्दी में स्पष्ट रखा गया।
- source_word: ከመ፡ እንተ፡ አቡሁ፡ ለፈርዖን
  choice: फ़िरौन के लिए पिता के समान
  rationale: शाब्दिक पितृत्व का दावा किए बिना मूल की राजकीय-सलाहकारी उपमा और उसकी असामान्य अभिव्यक्ति सुरक्षित रखी गई।
- source_word: እመብል፡ ውስተ፡ ቤቱ
  choice: उसके घर का प्रधान
  rationale: यह पद घराने पर अधिकार रखने वाले शासक/प्रबंधक को सूचित करता है; ‘प्रधान’ हिन्दी में पद और अधिकार दोनों व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा यूसुफ को फ़िरौन के लिए ‘पिता’ बनाए जाने की भाषा
  choice: फ़िरौन के लिए पिता के समान
  alternative: फ़िरौन का पिता
  rationale: उपमा और परमेश्वर की नियुक्ति दोनों सुरक्षित हैं, जबकि हिन्दी में अनपेक्षित जैविक पितृत्व का अर्थ नहीं निकलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। आरंभ और अंत को प्राप्त स्रोत की खंडित वाक्य-रचना के अनुरूप रखा गया है; इसलिए आरंभ पूर्ववर्ती वाक्य का अंश और अंत अल्पविराम के साथ है।
