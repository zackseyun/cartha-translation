  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክብረየ
  choice: मेरे सारे सम्मान
  rationale: गीज़ शब्द ክብር महिमा, प्रतिष्ठा या सम्मान का बोध करा सकता है; यहाँ यूसुफ की ऊँची पदवी और प्रतिष्ठा के लिए स्वाभाविक हिन्दी में ‘सम्मान’ चुना गया है।
- source_word: ኵሎ፡ ዘመጠነ፡ ወሀበኒ
  choice: उस सब के विषय में … जो मुझे दिया गया है
  rationale: पदबंध को व्यापक और अनिर्दिष्ट रखा गया है। कर्ता को स्पष्ट रूप से ‘परमेश्वर’ बताना स्रोत से अधिक व्याख्यात्मक होता; इसलिए हिन्दी में कर्मवाच्य रखा गया है।
- source_word: ዜንውዎ፡ ለአቡየ
  choice: मेरे पिता को … के विषय में बताना
  rationale: आज्ञार्थक कथन को आधुनिक स्वाभाविक हिन्दी में व्यक्त किया गया है और ‘सम्मान’ को सीधे कही जाने वाली वस्तु बनाने के बजाय विषयसूचक ‘के विषय में’ लगाया गया है।
theological_decisions:
- issue: जो कुछ मिला उसका कर्ता
  choice: ‘जो मुझे दिया गया है’—कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘जो परमेश्वर ने मुझे दिया है’
  rationale: उपलब्ध गीज़ पाठ में इस स्थान पर परमेश्वर का नाम स्पष्ट रूप से नहीं है; उसे जोड़ने से निहित अर्थ को अनावश्यक रूप से निश्चित कर दिया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। आरंभिक वाक्यांश पिछले पद से जुड़ा हुआ खंड है, इसलिए उसकी खंडात्मक संरचना सुरक्षित रखी गई है। समापन उद्धरण-चिह्न प्रसंग के संवाद की समाप्ति दर्शाता है।
