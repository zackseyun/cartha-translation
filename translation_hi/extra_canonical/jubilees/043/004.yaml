  text: And he ran after them and spoke to them according to this word. And they said to him, "Far be it from your servants to do this thing, and to steal from your lord's house any money or gold. The money that we found before in our sacks we, your servants, brought back from the land
translation:
  language: hi
  text: तब वह उनके पीछे दौड़ा और उनसे वही बात कही। उन्होंने उससे कहा, “तेरे सेवक ऐसा काम कभी नहीं करेंगे, न तेरे स्वामी के घर से कोई धन या सोना चुराएँगे। जो धन हमें पहले अपनी बोरियों में मिला था, उसे हम, तेरे सेवक, उस देश से वापस ले आए थे[a]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ पाठ का यह अंश यहाँ वाक्य के बीच में समाप्त होता है; वाक्य अगले पद में पूरा होता है।
    reason: प्रदत्त स्रोत-पाठ की अध्याय/पद-विभाजनजनित अपूर्णता स्पष्ट करना और अगले पद की सामग्री इस पद में न मिलाना।
lexical_decisions:
- source_word: ወሮጸ፡ ድኅሬሆሙ
  choice: तब वह उनके पीछे दौड़ा
  rationale: क्रिया और दिशासूचक पद का स्वाभाविक तथा निकट अर्थ; संदर्भगत कर्ता को मूल की तरह सर्वनाम से रखा गया है।
- source_word: በከመ፡ ዝንቱ፡ ነገር
  choice: वही बात
  rationale: शाब्दिक अर्थ ‘इस बात/वचन के अनुसार’ है; हिन्दी में ‘वही बात कही’ आदेश के अनुरूप कथन दोहराने का स्वाभाविक रूप है।
- source_word: ሐሰ፡ ሎሙ፡ ለአግብርቲከ
  choice: तेरे सेवक ऐसा काम करने की बात सोच भी नहीं सकते
  rationale: मुहावरेदार निषेध ‘तेरे सेवकों से यह दूर हो’ को अर्थ-संगत आधुनिक हिन्दी में व्यक्त करता है, बिना आरोप को स्वीकार किए।
- source_word: ንዋየ፡ ወወርቀኒ
  choice: कोई धन या सोना
  rationale: ንዋይ का अर्थ धन/संपत्ति/माल है, ‘चाँदी’ नहीं; इसलिए उत्पत्ति 44:8 से सामंजस्य बैठाने के बजाय गीइज़ पाठ का अनुसरण किया गया है।
- source_word: ውስተ፡ አኅጢነ
  choice: अपनी बोरियों में
  rationale: संज्ञा का संदर्भानुकूल अर्थ अनाज रखने की बोरियाँ है।
- source_word: አበጥከ፡ ደቂቅከ፡ እምድረ፡
  choice: हम, तेरे सेवक, उस देश से वापस ले आए थे
  rationale: प्राप्त अंश वाक्य के बीच ‘देश से’ पर समाप्त होता है; अनुवाद उस अपूर्णता को डैश द्वारा सुरक्षित रखता है और अगले पद की सामग्री नहीं जोड़ता।
