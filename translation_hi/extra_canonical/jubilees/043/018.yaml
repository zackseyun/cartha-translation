  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल के तीन निषेधों—जुताई, पेड़ों के फल और कटनी—की समानांतरता सुरक्षित रखी गई है; भविष्यकाल प्रसंग और अर्थ के अनुसार स्पष्ट किया गया है।
