translation:
  language: hi
  text: अभी पाँच वर्ष और बाकी हैं, जिनमें न जुताई होगी, न पेड़ों के फल होंगे और न कटनी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዓዲ፡ ኃምስቱ፡ ዓመት፡ ሀሎ
  choice: अभी पाँच वर्ष और बाकी हैं
  rationale: यह अस्तित्वसूचक वाक्यांश शेष बचे पाँच वर्षों को बताता है; ‘अभी…और बाकी हैं’ आधुनिक हिन्दी में इसके आशय को स्वाभाविक और पूर्ण रूप से व्यक्त करता है।
- source_word: ማእረር
  choice: जुताई
  rationale: यह खेत जोतने अथवा हल चलाने के काम को सूचित करता है; संज्ञात्मक समानांतर संरचना बनाए रखने के लिए ‘जुताई’ चुना गया है।
- source_word: ፍሬ፡ ዕፅ
  choice: पेड़ों के फल
  rationale: मूल पद का सीधा अर्थ ‘वृक्षों का फल’ है; बहुवचन भाव को हिन्दी में स्वाभाविक रूप से ‘पेड़ों के फल’ कहा गया है।
- source_word: ሐፅስ
  choice: कटनी
  rationale: यह फसल काटने या कटाई के अर्थ में है; ‘कटनी’ सरल, प्रचलित और कृषि-संदर्भ के अनुकूल है।
