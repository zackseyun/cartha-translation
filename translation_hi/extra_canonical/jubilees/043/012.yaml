  text: our father loves him, and his life is bound up with his life. And it will happen, when we go to your servant our father, if the boy is not with us, that he will die, and we will afflict our father with sorrow to death.
translation:
  language: hi
  text: हमारा पिता उससे प्रेम करता है, और उसका प्राण उसके प्राण से बँधा हुआ है। यदि हम तेरे दास हमारे पिता के पास जाएँ, और वह लड़का हमारे साथ न हो, तो वे मर जाएँगे; और हम अपने पिता को शोक पहुँचाकर मृत्यु तक पीड़ित करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍስ (nafs)
  choice: प्राण
  rationale: यहाँ शब्द जीवन/प्राण और व्यक्ति के गहरे भावनात्मक लगाव—दोनों का संकेत देता है। ‘प्राण’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है और एक ही वाक्यांश में इसकी पुनरावृत्ति को सुरक्षित रखता है।
- source_word: እስርት (ʾəsərt)
  choice: बँधा हुआ है
  rationale: स्रोत का बिंब सीधा और संबंधात्मक है; ‘बँधा हुआ’ उस गहरे जीवन-संबंध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ወሬዛ (warēzā)
  choice: वह लड़का
  rationale: संदर्भ में अनुपस्थित व्यक्ति बिन्यामीन है; पद का आशय युवक/लड़के की ओर है। आधुनिक हिन्दी में ‘वह लड़का’ संदर्भ को स्पष्ट रखते हुए स्वाभाविक है।
- source_word: ንቀጽዕ (nəqaṣṣəʿ)
  choice: पीड़ित करेंगे
  rationale: क्रिया का अर्थ दुःख देना, पीड़ित करना या दण्ड देना है। ‘पीड़ित करेंगे’ जुबिलीज़ की अपनी शब्दावली को बनाए रखता है और उत्पत्ति के समानांतर पाठ से ‘नीचे उतारेंगे’ आयात नहीं करता।
- source_word: በሐዘን (ba-ḥāzan)
  choice: शोक से
  rationale: 'साधन अथवा कारण का भाव सुरक्षित है: पिता को पहुँचने वाली पीड़ा शोक के द्वारा होगी।'
theological_decisions:
- issue: पिता और पुत्र के प्राणों का बँधना
  choice: ‘उसका प्राण उसके प्राण से बँधा हुआ है’
  alternative: ‘उसका जीवन उसके जीवन से जुड़ा हुआ है’
  rationale: ‘प्राण’ मूल शब्द की भावात्मक और जीवन-संबंधी व्यापकता बनाए रखता है; इसे केवल मनोवैज्ञानिक लगाव या केवल जैविक जीवन तक सीमित नहीं किया गया।
- issue: अंतिम मृत्यु-वाक्य का संबंध
  choice: पिता को शोक से मृत्यु तक पीड़ित करने की क्रिया को पृथक रखा गया
  alternative: ‘हम अपने पिता को ऐसा शोक देंगे कि वह मर जाएगा’
  rationale: स्रोत के दो क्रमिक कथनों और उनकी तनावपूर्ण पुनरुक्ति को सुरक्षित रखा गया है; उन्हें एक कारणात्मक व्याख्या में विलीन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तेरे दास, अपने पिता’ स्रोत की प्रत्यक्ष संबोधन-रचना को बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
