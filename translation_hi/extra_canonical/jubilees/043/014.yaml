lexical_decisions:
- source_word: ልበ፡ ኵሎሙ፡ ዕሩይ
  choice: उन सबका मन एक था
  rationale: शाब्दिक रूप से ‘उन सबका हृदय संयुक्त/एक था’; आधुनिक हिन्दी में ‘मन एक था’ सामूहिक एकता को स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: ብእሲ፡ ምስለ፡ ካልኡ
  choice: हर एक दूसरे के साथ
  rationale: 'पारस्परिक संबंध का भाव बनाए रखता है: प्रत्येक व्यक्ति अपने दूसरे साथी के साथ एकमत था।'
- source_word: ለሠናይ
  choice: भलाई के लिए
  rationale: उद्देश्यसूचक अर्थ और नैतिक रूप से सकारात्मक दिशा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ወበአከ
  choice: और वह रो पड़ा
  rationale: क्रिया के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है; कर्ता निकटतम स्पष्ट व्यक्तिवाचक संज्ञा यूसुफ है।
