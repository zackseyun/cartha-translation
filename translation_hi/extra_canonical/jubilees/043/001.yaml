  text: And Joseph devised a plan by which he might know their thoughts, whether there was a thought of peace among them. And he said to the man who was over his house, "Fill all their sacks with grain, and put their money back in the middle of their bags; and put my silver cup, the cup from which I drink, in the sack of the youngest." And he sent them away.
translation:
  language: hi
  text: यूसुफ़ ने एक योजना बनाई, जिससे वह जान सके कि उनके मन में क्या है और क्या उनके बीच शांति का भाव है। उसने अपने घर के अधिकारी से कहा, “उनकी सभी बोरियाँ अनाज से भर दो और उनका पैसा भी उनकी थैलियों के बीचोबीच वापस रख दो। फिर मेरा चाँदी का प्याला—जिससे मैं पीता हूँ—सबसे छोटे की बोरी में रख दो।” और उसने उन्हें विदा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለየ፡ ... ሕሊና
  choice: एक योजना बनाई
  rationale: शाब्दिक रूप से ‘एक विचार सोचा’; प्रसंग में यूसुफ़ द्वारा परीक्षा की युक्ति रचने का भाव है, इसलिए आधुनिक हिन्दी में स्वाभाविक और सटीक अभिव्यक्ति चुनी गई।
- source_word: ያአምር፡ ሕሊናሆሙ
  choice: जान सके कि उनके मन में क्या है
  rationale: मूल की ‘उनके विचार जानना’ वाली अभिव्यक्ति को सहज हिन्दी में प्रस्तुत करता है और उनके आंतरिक उद्देश्य की जाँच का भाव बनाए रखता है।
- source_word: ሕሊና፡ ሰላም
  choice: मेल-मिलाप का भाव
  rationale: शाब्दिक ‘शांति का विचार’ यहाँ भाइयों के आपसी रुख और सद्भाव को सूचित करता है; ‘मेल-मिलाप’ प्रसंगानुकूल है और शत्रुता के विपरीत भाव को स्पष्ट करता है।
- source_word: ዘላዕለ፡ ቤቱ
  choice: अपने घर के अधिकारी
  rationale: शाब्दिक अर्थ ‘जो उसके घर के ऊपर था’ है; हिन्दी में गृह-प्रबंधक अथवा अधिकारी का कार्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: ወርቆሙኒ፡ አግብእ፡ ሎሙ
  choice: उनका पैसा भी ... वापस रख दो
  rationale: ‘उनका सोना’ विनिमय-मूल्य अर्थात पैसा है, और አግብእ में लौटाने/वापस रखने का स्पष्ट भाव है।
- source_word: ኮራ፡ ዘብሩር
  choice: चाँदी का प्याला
  rationale: पात्र के लिए ‘प्याला’ और धातु के लिए ‘चाँदी’ मूल अर्थ को सीधे और स्वाभाविक रूप में व्यक्त करते हैं।
theological_decisions:
- issue: भाइयों के बीच ‘शांति’ का आशय
  choice: मेल-मिलाप का भाव
  alternative: शांति का विचार
  rationale: मूल की नैतिक और संबंधपरक अस्पष्टता को किसी विशेष धार्मिक सिद्धांत में बदले बिना, भाइयों के आपसी सद्भाव की जाँच के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। वाक्य-विन्यास सहज रखा गया है, जबकि मूल के प्रमुख तत्व—योजना, मन की जाँच, आपसी मेल, पैसा लौटाना और चाँदी का प्याला—सुरक्षित हैं।
