  yaml_path: translation/extra_canonical/jubilees/043/007.yaml
  text: I will take him as a servant, and you may go in peace to your houses." And while they were searching in their goods, beginning with the eldest and finishing with the youngest, it was found in Benjamin's sack.
translation:
  language: hi
  text: “मैं उसे अपना दास बना लूँगा,[a] और तुम लोग शान्ति से अपने घर लौट जाओ।” फिर जब वे उनके सामान की तलाशी ले रहे थे, तो उन्होंने सबसे बड़े से आरम्भ किया और सबसे छोटे पर समाप्त किया; और वह वस्तु बिन्यामीन के बोरे में मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे दास के रूप में लिया जाएगा।”
    reason: अंग्रेज़ी POB audit trail में दर्ज पूर्व निष्क्रिय rendering (“shall be taken as a slave”)।
lexical_decisions:
- source_word: እነሥእ፡ ገብረ
  choice: मैं उसे अपना दास बना लूँगा
  rationale: पहला क्रियापद प्रथम पुरुष एकवचन कर्तृवाच्य है—‘मैं लूँगा’; ገብረ दास अथवा सेवक को सूचित कर सकता है। प्रसंग में दण्डस्वरूप बन्धुआ स्थिति होने के कारण ‘दास’ चुना गया है।
- source_word: ተአትዉ፡ በሰላም፡ ቤቲክሙ
  choice: तुम लोग शान्ति से अपने घर लौट जाओ
  rationale: शाब्दिक भाव ‘शान्ति से अपने घर जाओ/प्रवेश करो’ है; हिन्दी में वापसी के प्रसंग को स्वाभाविक रूप से व्यक्त करने के लिए ‘लौट जाओ’ रखा गया है।
- source_word: ይፈትኑ፡ ውስተ፡ ንዋዮሙ
  choice: वे उनके सामान की तलाशी ले रहे थे
  rationale: क्रिया खोजने या जाँचने का भाव देती है और ንዋዮሙ उनके सामान/वस्तुओं को दर्शाता है; हिन्दी में ‘तलाशी लेना’ प्रसंगानुकूल है।
- source_word: እምዘ፡ ይልህቅ፡ ቀደሙ፡ ወፈጸሙ፡ በኀበ፡ ዘይንእስ
  choice: सबसे बड़े से आरम्भ किया और सबसे छोटे पर समाप्त किया
  rationale: मूल की क्रमसूचक संरचना को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ሐስለ፡ ብንያም
  choice: बिन्यामीन के बोरे
  rationale: ሐስለ पात्र, थैले या बोरे को दर्शाता है; अनाज ढोने के प्रसंग में ‘बोरा’ उपयुक्त है।
theological_decisions:
- issue: ገብረ में ‘दास’ और ‘सेवक’ का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘दास’
  alternative: ‘सेवक’
  rationale: यहाँ किसी को अपराध के परिणामस्वरूप अपने अधिकार में रखने की बात है, इसलिए ‘दास’ प्रसंग की कठोरता को अधिक ठीक रखता है; फिर भी शब्द का व्यापक अर्थ-क्षेत्र पाद-टिप्पणी में दिया गया है।
- issue: मिली हुई वस्तु का अप्रकट नाम
  choice: ‘वह वस्तु’
  alternative: पिछले प्रसंग के आधार पर वस्तु का नाम जोड़ना
  rationale: इस पद के गीइज़ पाठ में वस्तु का नाम स्पष्ट रूप से नहीं दोहराया गया; इसलिए अनावश्यक विशिष्टता जोड़े बिना संकेतात्मक अभिव्यक्ति रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। प्रत्यक्ष कथन में बहुवचन ‘तुम लोग’ से सम्बोधित समूह स्पष्ट होता है। ‘शान्ति से’ मूल अभिव्यक्ति को बनाए रखता है, और ‘अपने घर लौट जाओ’ प्रसंगानुकूल स्वाभाविक हिन्दी है।
