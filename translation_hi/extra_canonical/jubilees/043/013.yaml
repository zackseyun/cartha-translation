base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/013.yaml
  text: And I[13], your servant, remain alone instead of the boy as a servant to my lord, and let the young man go with his brothers, for I became surety for him from the hand of your servant, our father. And if I do not bring him back, your servant will bear the blame before our father all our days.’
translation:
  language: hi
  text: “और मैं, आपका दास, उस लड़के के बदले अपने स्वामी का दास बनकर ठहरूँ, और वह युवक अपने भाइयों के साथ चला जाए। क्योंकि मैं आपके दास, हमारे पिता, के प्रति उसके लिए ज़मानती बना था। यदि मैं उसे वापस न लाऊँ, तो आपका दास जीवन भर हमारे पिता के सामने दोष अपने ऊपर लिए रहेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्रेषित गीज़ पाठ इस पद में संक्षिप्त और कुछ अनियमित है। अनुवाद मुख्य भाव को सुरक्षित रखता है: यहूदा लड़के के बदले स्वयं रहने की पेशकश करता है और अपने पिता के प्रति उसके लिए अपनी ज़मानत बताता है।'
    reason: segmentation_note
lexical_decisions:
- source_word: ገብርከ / ገብረ
  choice: आपका दास / दास
  rationale: गीज़ में दास अथवा सेवक के अर्थ वाला पद है; अधीनता और यहूदा के आत्म-समर्पण की तीव्रता बनाए रखने के लिए ‘दास’ चुना गया।
- source_word: ህየንቴሁ
  choice: उस लड़के के बदले
  rationale: 'प्रतिस्थापन का स्पष्ट अर्थ व्यक्त करता है: यहूदा लड़के के स्थान पर रहने की पेशकश करता है।'
- source_word: ወይሖር፡ ወሬዛ፡ ምስለ፡ አኀዊሁ
  choice: पर वह युवक अपने भाइयों के साथ चला जाए
  rationale: क्रिया ‘जाए’ और ‘अपने भाइयों के साथ’ को सीधे रखा गया है; स्वाभाविक हिन्दी के लिए विरोधसूचक ‘पर’ जोड़ा गया।
- source_word: ተሀበይክዎ
  choice: मैंने ... उसकी ज़मानत ली थी
  rationale: संदर्भ और उत्पत्ति 44:32 के समान कथन के अनुसार यह ज़मानत लेने अथवा उत्तरदायित्व अपने ऊपर लेने का भाव देता है।
- source_word: ይሌብከ
  choice: दोषी ठहरेगा
  rationale: पिता के सामने दोष अथवा अपराध का भार उठाने के मुहावरे को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኵሎነ፡ መዋዕለ
  choice: जीवन भर
  rationale: शाब्दिक ‘हमारे सभी दिन’ का स्वाभाविक हिन्दी समतुल्य, दीर्घकालिक दोष का भाव सुरक्षित रखता है।
theological_decisions:
- issue: यहूदा का लड़के के स्थान पर स्वयं को दास बनाकर रहने का प्रस्ताव
  choice: प्रतिस्थापन को स्पष्ट रखते हुए ‘उस लड़के के बदले ... दास बनकर’
  alternative: केवल ‘उसके लिए ज़मानत’
  rationale: पाठ में रहने, लड़के को जाने देने और उसके बदले दास बनने की अलग-अलग बातें हैं; इन्हें केवल ज़मानत की सामान्य धारणा में समेटना मूल तनाव घटा देता।
- issue: ज़मानत संबंधी वाक्य का कर्ता और संबंध
  choice: यहूदा ने पिता के हाथ से लड़के की ज़मानत ली
  alternative: यूसुफ ने लड़के को पिता को सौंपा
  rationale: तत्काल कथानक और उत्पत्ति 44:32 के समानांतर के अनुरूप वक्ता अपनी प्रतिज्ञा का उल्लेख करता है; वैकल्पिक अर्थ कथानक में असंगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरार्थक संबोधन ‘आपका’ रखा गया है। भाषा कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। पदचिह्न [a] मुख्य पाठ में सम्मिलित है।
