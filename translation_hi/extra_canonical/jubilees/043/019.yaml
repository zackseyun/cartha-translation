  text: for preservation[19], go down, you and your households, so that you may not be consumed by the famine and not be distressed on account of your possessions. For God sent me before you quickly, so that they may live.
translation:
  language: hi
  text: जल्दी नीचे जाओ—तुम और तुम्हारे घराने—ताकि तुम अकाल से नष्ट न हो जाओ और अपनी संपत्ति के कारण व्याकुल न हो। क्योंकि परमेश्वर ने मुझे तुमसे पहले संरक्षण के लिए[a] भेजा, ताकि वे जीवित रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बचे हुओं के लिए’, ‘वंश बचाए रखने के लिए’ अथवा ‘जीवित रहने के लिए’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ፍጡነ፡ ረዱ
  choice: शीघ्र नीचे आ जाओ
  rationale: क्रियाविशेषण की तात्कालिकता और नीचे जाने की आज्ञा, दोनों को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ኢትትሐጐሉ፡ በዐባር
  choice: अकाल से नष्ट न हो जाओ
  rationale: पहली निषेधात्मक क्रिया विनाश/समाप्त हो जाने का भाव देती है और ዐባር अकाल को सूचित करता है।
- source_word: ኢትትከዙ
  choice: व्याकुल न हो
  rationale: यह क्रिया दुःखी, चिंतित या व्याकुल होने का अर्थ देती है; इसे ‘नाश होना’ नहीं बनाया गया, क्योंकि वह भाव पिछली क्रिया में पहले से है।
- source_word: ጥዕንትከሙ
  choice: अपनी संपत्ति
  rationale: संदर्भ में घराने की संपदा/माल-असबाब का व्यापक अर्थ रखा गया है; किसी एक प्रकार की संपत्ति तक अर्थ को सीमित नहीं किया गया।
- source_word: ለሠሪዕ
  choice: बचाव के लिए[a]
  rationale: मुख्य पाठ में सहज और व्यापक हिन्दी दी गई है, जबकि ‘बचे हुओं/वंश की रक्षा’ और ‘जीवित रहने’ की संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ይሕየዉ
  choice: वे जीवित रहें
  rationale: स्रोत का क्रियारूप तृतीय पुरुष बहुवचन है; इसलिए इसे एकवचन कर्तृवाचक ‘वह तुम्हें जीवित रखे’ में नहीं बदला गया।
theological_decisions:
- issue: परमेश्वर के भेजने का उद्देश्य और अंतिम बहुवचन सर्वनाम
  choice: परमेश्वर ने मुझे तुमसे पहले शीघ्र भेजा, ताकि वे जीवित रहें
  alternative: ताकि वह तुम्हें जीवित रखे
  rationale: स्रोत में अंतिम क्रिया तृतीय पुरुष बहुवचन है। उसके संदर्भ की कुछ अस्पष्टता को बनाए रखा गया है; उसे परमेश्वर की एकवचन क्रिया और ‘तुम्हें’ कर्म बनाकर नहीं समझाया गया।
- issue: ለሠሪዕ का उद्धार-संबंधी अर्थ
  choice: बचाव के लिए
  alternative: एक बचे हुए समूह के लिए / जीवित रहने के लिए
  rationale: ऐसा व्यापक शब्द चुना गया है जो संरक्षण या जीवन-रक्षा का भाव देता है, पर किसी विशिष्ट धार्मिक सिद्धांत या ‘शेष’ संबंधी व्याख्या को मुख्य पाठ में अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण किंतु सीधी कथन-शैली अपनाई गई है। ‘घराने’, ‘अकाल’, ‘व्याकुल’ और ‘जीवित रहें’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य हैं तथा प्राचीन कथात्मक गरिमा भी बनाए रखते हैं।
