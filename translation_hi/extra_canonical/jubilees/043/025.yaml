  text: over all the land of Egypt. And their father did not believe them, for his mind was stunned. But when he saw the wagons that Joseph had sent, the life of his spirit was renewed, and he said, "It is enough for me if Joseph is alive. I will go down and see him before I die."
translation:
  language: hi
  text: मिस्र के सारे देश पर। उनके पिता ने उनकी बात पर विश्वास नहीं किया, क्योंकि उनका मन स्तब्ध रह गया था। फिर जब उन्होंने वे रथ देखे जिन्हें यूसुफ ने भेजा था, तो उनके प्राण में फिर से जान आ गई। उन्होंने कहा, “मेरे लिए इतना ही काफ़ी है कि यूसुफ जीवित है। मैं मरने से पहले नीचे जाकर उसे देखूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደንገፀ፡ በሕሊናሁ
  choice: उनका मन स्तब्ध रह गया था
  rationale: यह पदसमूह मानसिक आघात या विस्मय से सुन्न पड़ जाने का भाव देता है; ‘स्तब्ध’ मूल की तीव्रता और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: ሰረገላተ
  choice: रथ
  rationale: यह बहुवचन वाहन/रथ के लिए है; पितृकालीन कथा की गरिमा और परिचित बाइबिलीय शब्दावली के कारण ‘रथ’ चुना गया।
- source_word: ተሐደሰት፡ ሕይወተ፡ መንፈሱ
  choice: उनके प्राण में फिर से जान आ गई
  rationale: शाब्दिक अर्थ ‘उनकी आत्मा का जीवन नया हुआ’ है। चुना गया हिन्दी मुहावरा पुनर्जीवन का अर्थ सहज रूप से देता है, बिना ‘आत्मा’ के धर्मशास्त्रीय अर्थ को अनावश्यक रूप से उभारने के।
- source_word: ዐቢይ፡ ውእቱ፡ ሊተ
  choice: मेरे लिए इतना ही काफ़ी है
  rationale: यह कथन पर्याप्तता या संतोष व्यक्त करता है; प्राकृतिक हिन्दी में यही निकटतम अर्थ है।
- source_word: እረድ
  choice: मैं नीचे जाकर
  rationale: क्रिया में नीचे उतरने का भौगोलिक कथात्मक भाव है, जिसे ‘नीचे जाकर’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: መንፈሱ का अनुवाद
  choice: उनके प्राण में फिर से जान आ गई
  alternative: उनकी आत्मा का जीवन फिर नया हो गया
  rationale: यहाँ संदर्भ भावनात्मक और शारीरिक पुनर्जीवन का है। ‘प्राण में फिर से जान आ गई’ मूल रूपक को अर्थपूर्ण हिन्दी में रखता है और मनुष्य की आत्मा के स्वरूप पर कोई अतिरिक्त धर्मशास्त्रीय निष्कर्ष नहीं थोपता।
- issue: यूसुफ के संबंध की स्पष्टता
  choice: मेरा पुत्र यूसुफ
  alternative: यूसुफ
  rationale: मूल में केवल यूसुफ का नाम है, किंतु वक्ता उसका पिता है। हिन्दी में भावनात्मक स्वाभाविकता के लिए ‘मेरा पुत्र’ जोड़ा गया है; इससे आशय नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक खंड पिछले वाक्य की निरंतरता है, इसलिए उसे मूल की तरह वाक्यांश के रूप में रखा गया है।
