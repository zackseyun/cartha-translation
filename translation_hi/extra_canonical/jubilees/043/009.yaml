base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/009.yaml
  text: And they came to Joseph, and all of them bowed down before him with their faces to the ground. And Joseph said to them, "You have done evil." And they said, "What shall we say, and how shall we clear ourselves? Our Lord has found the guilt of your servants."
translation:
  language: hi
  text: वे यूसुफ़ के पास आए, और उन सब ने मुँह के बल भूमि पर झुककर उसे प्रणाम किया। यूसुफ़ ने उनसे कहा, “तुमने बुरा काम किया है।” उन्होंने कहा, “हम क्या कहें, और अपने को निर्दोष कैसे ठहराएँ? हमारे प्रभु ने उनका अपराध जान लिया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे प्रभु ने उनका अपराध पा लिया है।” संदर्भ के अनुसार इसका आशय “हमारे प्रभु ने हमारा—अर्थात् आपके सेवकों का—अपराध प्रकट कर दिया है” भी समझा जा सकता है; उपलब्ध गीइज़ पाठ में “सेवकों” शब्द नहीं है।
    reason: गीइज़ के तृतीय पुरुष बहुवचन प्रत्यय और प्रसंग में वक्ताओं के आत्मसंदर्भ के बीच तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: ሰገዱ
  choice: झुककर ... प्रणाम किया
  rationale: क्रिया भूमि पर झुकने या दंडवत करने का भाव रखती है; अगले पदबंध ‘मुँह के बल भूमि पर’ के साथ यह स्वाभाविक हिन्दी है।
- source_word: እኩየ፡ ገበርክሙ
  choice: तुमने बुरा काम किया है
  rationale: शाब्दिक अर्थ ‘तुमने बुरा किया’ है; ‘काम’ जोड़ने से आधुनिक हिन्दी में कथन सहज रहता है, बिना किसी विशिष्ट अपराध को जोड़ने के।
- source_word: ንትዋቀስ
  choice: अपने को निर्दोष ठहराएँ
  rationale: यहाँ प्रतिवाद करके स्वयं को दोषमुक्त सिद्ध करने का भाव है; ‘सफ़ाई दें’ भी संभव है, पर चुना गया रूप प्रश्न की न्यायिक तीव्रता बनाए रखता है।
- source_word: ረከበ
  choice: जान लिया है
  rationale: मूलतः ‘पा लिया/खोज निकाला’ है; अपराध के संदर्भ में ‘जान लिया’ स्वाभाविक हिन्दी है, जबकि खोज निकालने का भाव पादटिप्पणी में सुरक्षित है।
- source_word: አበሳሆሙ
  choice: उनका अपराध
  rationale: उपलब्ध गीइज़ पाठ में तृतीय पुरुष बहुवचन प्रत्यय है, अतः उसे सीधे ‘उनका’ रखा गया है; संदर्भजनित वैकल्पिक समझ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: እግዚእነ का अभिप्राय
  choice: हमारे प्रभु
  alternative: हमारे स्वामी
  rationale: वक्ता यूसुफ़ से अलग किसी उच्चतर प्रभु की बात करते प्रतीत होते हैं, और उत्पत्ति 44:16 की समानांतर घटना परमेश्वर की ओर संकेत करती है। फिर भी अनुवाद में ‘परमेश्वर’ जोड़कर निहितार्थ को पूर्णतः स्पष्ट नहीं किया गया।
- issue: अंतिम सर्वनाम और अनुपस्थित ‘सेवक’ पद
  choice: उनका अपराध
  alternative: आपके सेवकों का अपराध / हमारा अपराध
  rationale: प्रस्तुत गीइज़ स्रोत አበሳሆሙ (‘उनका अपराध’) पर समाप्त होता है और इसमें ‘सेवकों’ का शब्द नहीं है। संदर्भ में भाई संभवतः अपने ही अपराध की बात कर रहे हैं, पर मुख्य पाठ में अनुपस्थित शब्द जोड़ना उचित नहीं समझा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘मुँह के बल भूमि पर झुककर प्रणाम किया’ प्राचीन दरबारी भाव को स्पष्ट करता है। आरंभिक ‘वे ... आए’ अंग्रेज़ी परामर्श-पाठ और प्रसंग से ग्रहण किया गया है, क्योंकि दिए गए अध्याय-विभाजित गीइज़ अंश का आरंभ केवल ‘यूसुफ़’ से होता है और वाक्य अन्यथा अपूर्ण प्रतीत होता है।
