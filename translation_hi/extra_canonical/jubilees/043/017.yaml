  yaml_path: translation/extra_canonical/jubilees/043/017.yaml
  text: Do not weep over me, but hurry and bring my father to me, and you see that it is my mouth that speaks, and the eyes of my brother Benjamin also see. For behold, this is the second year of the famine,
translation:
  language: hi
  text: मेरे लिए मत रोओ, बल्कि जल्दी करो और मेरे पिता को मेरे पास ले आओ। तुम देख रहे हो[a] कि मेरा ही मुँह बोल रहा है, और मेरे भाई बिन्यामीन की आँखें भी यह देख रही हैं। क्योंकि देखो, यह अकाल का दूसरा वर्ष है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम देखोगे’।
    reason: गीज़ का क्रियारूप यहाँ वर्तमान या भावी, दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: ኢትብከዩ፡ ላዕሌየ
  choice: मेरे लिए मत रोओ
  rationale: निषेधात्मक क्रिया और ላዕሌየ (‘मेरे ऊपर/मेरे कारण’) को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ወአፍጥኑ፡ ወእምጽእዎ፡ ለአቡየ፡ ኀቤየ
  choice: बल्कि जल्दी करो और मेरे पिता को मेरे पास ले आओ
  rationale: दोनों आज्ञार्थक क्रियाओं—शीघ्र करने और पिता को वक्ता के पास लाने—को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ወትሬእዩ
  choice: तुम देख रहे हो
  rationale: अपूर्ण क्रियारूप वर्तमान अथवा भावी अर्थ दे सकता है; प्रसंग में तत्काल प्रत्यक्ष अनुभव के कारण वर्तमान प्रगतिशील हिन्दी स्वाभाविक है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: ዘይነብብ፡ አፉየ
  choice: कि मेरा ही मुँह बोल रहा है
  rationale: स्रोत के शाब्दिक ‘मेरा मुँह बोलता है’ और उसके बलाघात को बनाए रखता है; ‘ही’ पहचान पर दिए गए जोर को हिन्दी में व्यक्त करता है।
- source_word: ወአዕይንቲሁኒ፡ ለአኁየ፡ ብንያም፡ ይሬእያ
  choice: और मेरे भाई बिन्यामीन की आँखें भी यह देख रही हैं
  rationale: ‘आँखें’ को हटाकर केवल ‘बिन्यामीन भी देख रहा है’ कहने के बजाय स्रोत की देह-अंग वाली अभिव्यक्ति और ‘भी’ दोनों सुरक्षित रखे गए हैं।
- source_word: እስመ፡ ናሁ፡ ዝንቱ፡ ካልእ፡ ዓም፡ ዘዐባር
  choice: क्योंकि देखो, यह अकाल का दूसरा वर्ष है
  rationale: कारणसूचक እስመ, ध्यानाकर्षक ናሁ और ‘अकाल का दूसरा वर्ष’ को बिना अनावश्यक विस्तार के सीधे व्यक्त करता है।
