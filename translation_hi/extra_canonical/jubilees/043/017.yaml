translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘देखो’ ने स्रोत के ध्यानाकर्षक शब्द को बनाए रखा है, और ‘मेरा ही मुँह’ तथा ‘बिन्यामीन की आँखें’ जैसी ठोस मूल अभिव्यक्तियों को अत्यधिक सहज बनाकर मिटाया नहीं गया।
