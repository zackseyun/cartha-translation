lexical_decisions:
- source_word: ሐቀፈ፡ ክሳውዲሆሙ
  choice: उनकी गरदनों को गले लगाया
  rationale: क्रिया ሐቀፈ का अर्थ आलिंगन करना है और ክሳውዲሆሙ बहुवचन में ‘उनकी गरदनें’ है; हिंदी में बाइबलीय प्रसंग के अनुरूप स्वाभाविक अभिव्यक्ति रखी गई।
- source_word: በከየ
  choice: रोया
  rationale: मूल क्रिया के सीधे अर्थ ‘रोना’ को बनाए रखा गया।
- source_word: ኢያእመርዎ
  choice: उसे पहचान नहीं पाए
  rationale: यहाँ ‘जानना/पहचानना’ प्रसंगतः व्यक्ति की पहचान से संबंधित है; वाक्य की असामान्य कथात्मक स्थिति को बदले बिना रखा गया।
- source_word: አንከ፡ ይብከዩ
  choice: वे भी रोए
  rationale: አንከ का योगात्मक बल ‘भी’ से और बहुवचन रोने की क्रिया को सरल आधुनिक हिंदी से व्यक्त किया गया।
- source_word: ወይቤሎሙ
  choice: फिर उसने उनसे कहा
  rationale: कथात्मक संयोजक ወ को हिंदी प्रवाह में ‘फिर’ और संबोधन के बहुवचन कर्म को ‘उनसे’ से व्यक्त किया गया।
theological_decisions:
- issue: यूसुफ के प्रकट होने के बीच भाइयों द्वारा उसे न पहचानना
  choice: पर वे उसे पहचान नहीं पाए
  alternative: पर उन्होंने उसे नहीं जाना
  rationale: मूल पाठ के स्पष्ट निषेध को बनाए रखा गया है और कथानक की संभावित विसंगति को किसी विशेष व्याख्या से हल नहीं किया गया; टिप्पणी में वास्तविक अस्पष्टता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली। ‘गरदनों को गले लगाया’ मूल की शारीरिक छवि को सुरक्षित रखता है। पद अगले कथन की ओर खुला रहता है, इसलिए अंत में अल्पविराम रखा गया है।
