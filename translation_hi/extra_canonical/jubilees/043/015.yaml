translation:
  language: hi
  text: और वह अपने आप को अब और न रोक सका[a] और उसने उन्हें बता दिया कि वह यूसुफ है। फिर उसने उनसे इब्रानी भाषा में बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक गीज़ पाठ का अनुवाद संभवतः: “उसने अपने आप को रोका।” उपलब्ध पाठ में “नहीं” या “अब और नहीं” के लिए कोई स्पष्ट शब्द नहीं है।'
    reason: मौजूदा गीज़ रूप और प्रसंग से अपेक्षित अर्थ के बीच पाठगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ተዐገሦ
  choice: अपने आप को अब और न रोक सका
  rationale: गीज़ क्रिया का मूल अर्थ ‘अपने को रोकना/धीरज रखना’ है। उपलब्ध पाठ में निषेध स्पष्ट रूप से नहीं है, पर पहचान प्रकट करने के प्रसंग और उत्पत्ति 45:1 के समानांतर कथानक में ‘अब और न रोक सका’ अपेक्षित अर्थ देता है। शाब्दिक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ነገሮሙ
  choice: उन्हें बता दिया
  rationale: क्रिया ‘कहना/बताना’ को इस प्रसंग में पहचान प्रकट करने के स्वाभाविक हिन्दी रूप में व्यक्त किया गया है।
- source_word: ልሳነ፡ ዕብራይስጥ
  choice: इब्रानी भाषा
  rationale: शाब्दिक रूप से ‘इब्रानियों की भाषा/इब्रानी ज़बान’; आधुनिक मानक हिन्दी में ‘इब्रानी भाषा’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ተዐገሦ में निषेध का अभाव और प्रसंगगत अर्थ
  choice: मुख्य पाठ में ‘अब और न रोक सका’
  alternative: ‘उसने अपने आप को रोका’
  rationale: मौजूदा गीज़ पाठ का रूप सकारात्मक पढ़ा जा सकता है, किंतु उससे अगले कार्य—अपनी पहचान बताने—के साथ कथात्मक तनाव उत्पन्न होता है। समानांतर बाइबिल प्रसंग और वाक्य का आशय नकारात्मक अर्थ का समर्थन करते हैं; फिर भी वास्तविक पाठगत अस्पष्टता को पादटिप्पणी में छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘यूसुफ’ और ‘इब्रानी’ जैसे प्रचलित बाइबिल नाम-रूप रखे गए हैं।
