  text: And he did as Joseph told him, and filled all their sacks with grain, and put their money in their sacks; and he put the cup in Benjamin's sack. And when morning dawned, they went away.
translation:
  language: hi
  text: उसने वैसा ही किया जैसा यूसुफ ने उससे कहा था। उसने उनके सभी बोरों को अनाज से भर दिया और उनका पैसा भी उनके बोरों में रख दिया; और प्याला बिन्यामीन के बोरे में रख दिया। सुबह होते ही वे चल पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕስሊሆሙ / ሐስለ
  choice: उनके बोरे / बोरे
  rationale: इन रूपों का अर्थ अनाज या सामान रखने के बोरे हैं; आधुनिक हिन्दी में ‘बोरा’ स्वाभाविक और स्पष्ट है।
- source_word: ሲሊተ
  choice: अनाज
  rationale: स्रोत में खाद्यान्न के लिए प्रयुक्त सामान्य शब्द को सहज आधुनिक हिन्दी में ‘अनाज’ कहा गया है।
- source_word: ወርቆሙ
  choice: उनका पैसा
  rationale: शाब्दिक अर्थ ‘उनका सोना’ हो सकता है, पर इस लेन-देन के प्रसंग में यह भुगतान की रकम को दर्शाता है; ‘पैसा’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ኮራ
  choice: प्याला
  rationale: पात्र के लिए पारंपरिक और प्रसंगानुकूल हिन्दी शब्द।
- source_word: ነግሀ፡ በጽባሕ
  choice: सुबह होते ही
  rationale: ‘भोर हुई, सुबह में’ जैसी स्रोत-अभिव्यक्ति का स्वाभाविक हिन्दी रूप, जिसमें उनके प्रातः प्रस्थान का समय बना रहता है।
