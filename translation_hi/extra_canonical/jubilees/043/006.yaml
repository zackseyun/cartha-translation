  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। पद स्रोत के अनुसार पिछले कथन के अंतिम अंश से आरम्भ होता है और उपलब्ध स्रोतांश अधूरे वाक्य पर समाप्त होता है; अंतिम डैश उसी अपूर्णता को दर्शाता है।
