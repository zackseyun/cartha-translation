translation:
  language: hi
  text: “हम अपने स्वामी के दास हो जाएँगे।” उसने उनसे कहा, “ऐसा नहीं। जिस मनुष्य के पास मैंने उसे पाया, केवल वही—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንትቀነይ
  choice: हम ... के दास हो जाएँगे
  rationale: यह क्रिया दास के रूप में सेवा करने या अधीन हो जाने का भाव व्यक्त करती है; प्रसंग में ‘दास हो जाएँगे’ स्वाभाविक और सटीक है।
- source_word: ለእግዚእነ
  choice: अपने स्वामी के
  rationale: यहाँ ‘हमारे स्वामी के लिए/अधीन’ का सांसारिक संबोधन है, इसलिए ‘अपने स्वामी के दास’ स्वाभाविक हिन्दी है।
- source_word: አኮ፡ ከማሁ
  choice: ऐसा नहीं होगा
  rationale: निषेधात्मक उत्तर का मुहावरेदार हिन्दी रूप, जो प्रस्ताव को स्पष्ट रूप से अस्वीकार करता है।
- source_word: ዘረከብክዎ
  choice: मैंने उसे पाया है
  rationale: गीज़ रूप में प्रथम पुरुष एकवचन कर्ता और तृतीय पुरुष कर्म स्पष्ट हैं; इसलिए निष्क्रिय ‘वह पाया गया’ नहीं अपनाया गया।
- source_word: ኪያሁ፡ ባሕቲቶ
  choice: केवल वही
  rationale: दोनों पद उस एक व्यक्ति पर बल देते हैं; ‘केवल वही’ हिन्दी में इस विशेष बल को सुरक्षित रखता है।
