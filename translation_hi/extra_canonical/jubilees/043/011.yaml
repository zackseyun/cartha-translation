  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
translation:
  language: hi
  text: तब यहूदा ने कहा, “हे मेरे स्वामी, मैं आपसे विनती करता हूँ, आपका दास मेरे स्वामी के सुनने में एक बात कहे। उसकी माँ ने आपके दास, हमारे पिता के लिए दो भाइयों को जन्म दिया था।[a] उनमें से एक बाहर गया और खो गया, और किसी ने उसे नहीं पाया; और वही अकेला अपनी माँ से बचा है, और आपका दास भी…”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पिता, आपके दास, के एक माँ से दो बेटे थे।”
    reason: मूल के असामान्य संबंध-विन्यास का अधिक स्वाभाविक वैकल्पिक अर्थ देता है, पर मुख्य पाठ में ‘भाइयों’, ‘जन्म दिया’ और ‘उसकी माँ’ को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: ሳዕሌየ፡ እግዚኦ
  choice: हे मेरे स्वामी, मैं आपसे विनती करता हूँ
  rationale: विनयपूर्ण निवेदन और संबोधन—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ቃለ፡ ውስተ፡ እዝነ፡ እግዚእየ
  choice: अपने स्वामी के कानों में एक बात
  rationale: मूल के ‘स्वामी के कान में/कानों में एक वचन’ मुहावरे को निकटता से रखते हुए हिन्दी में बोधगम्य बनाया गया है।
- source_word: ክልኤተ፡ አኀወ
  choice: दो भाइयों
  rationale: አኀወ का प्रत्यक्ष अर्थ ‘भाई’ है; इसे ‘बेटे’ बनाकर संबंध को व्याख्यायित नहीं किया गया।
- source_word: ወለደት፡ እሙ
  choice: उसकी माँ ने … जन्म दिया था
  rationale: मूल की क्रिया ‘जन्म दिया’ और सर्वनामयुक्त ‘उसकी माँ’ दोनों सुरक्षित रखे गए हैं।
- source_word: ወፅአ፡ ወተገደፈ
  choice: बाहर गया और खो गया
  rationale: दो समन्वित घटनाओं को उसी क्रम में रखा गया है; दूसरे पद को प्रसंगानुकूल ‘खो गया’ कहा गया है।
- source_word: ወውእቱ፡ ባሕቲቱ፡ ተረፈ፡ እምእሙ
  choice: अब अपनी माँ की ओर से वही अकेला बचा है
  rationale: ‘वही अकेला बचा’ पर मूल का बल बनाए रखा गया है; ‘अपनी माँ की ओर से’ मातृ-संबंध की अभिव्यक्ति को खुला रखता है।
theological_decisions:
- issue: ‘दो भाइयों’ और ‘हमारे पिता’ के बीच असामान्य संबंध-वाक्य
  choice: उसकी माँ ने आपके दास, हमारे पिता के लिए दो भाइयों को जन्म दिया था
  alternative: हमारे पिता, आपके दास, के एक ही माँ से दो बेटे थे
  rationale: मुख्य पाठ में गीइज़ की शब्दावली और वाक्य-संबंध को निकटता से रखा गया है; अधिक व्याख्यात्मक और सहज अर्थ को पादटिप्पणी में दिया गया है, ताकि वास्तविक अस्पष्टता न मिटे।
- issue: पद का अधूरा अंतिम उपवाक्य
  choice: और आपका दास भी…
  alternative: वाक्य को अगले पद की सामग्री से पूरा करना
  rationale: स्रोतांश ወገብርከሂ (‘और आपका दास भी’) पर अधूरा समाप्त होता है; त्रिबिंदु इस पाठगत अपूर्णता को स्पष्ट करते हैं और अगले पद को यहाँ आयात नहीं करते।
translation_notes:
  register: भाषा आधुनिक, विनयपूर्ण और गरिमापूर्ण रखी गई है। ‘अपने स्वामी के कानों में’ जानबूझकर स्रोत-समीप बाइबलीय मुहावरा है। स्रोत के आरंभ में दिखाई देने वाला ‘इस प्याले के द्वारा…’ अंश पूर्ववर्ती पद का अवशेष प्रतीत होता है और उपलब्ध पद-विभाजन तथा परामर्श-पाठ के अनुसार इस पद में सम्मिलित नहीं किया गया।
