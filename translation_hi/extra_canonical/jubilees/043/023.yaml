translation:
  language: hi
  text: और उसने उन सबको बदलने के कपड़े[a] और चाँदी दी। और उनके पिता के लिए भी उसने कपड़े और चाँदी भेजी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “तरह-तरह के कपड़े” या “रंगीन कपड़े” भी हो सकता है।
    reason: मूल गीइज़ पदबंध में ‘बदलाव’, ‘विविधता’ और ‘रंग’ के अर्थ संभव हैं; समान बाइबलीय प्रसंग ‘बदलने के कपड़े’ का समर्थन करता है।
lexical_decisions:
- source_word: አልባሰ፡ ኅብር
  choice: बदलने के लिए वस्त्र
  rationale: यह पदबंध शाब्दिक रूप से रंग/विविधता के वस्त्रों का संकेत दे सकता है, पर उत्पत्ति 45:22 के समान प्रसंग में इसका मुहावरेदार अर्थ अतिरिक्त जोड़े अथवा बदलने के वस्त्र है। सहज हिन्दी में अर्थ स्पष्ट रखा गया है।
- source_word: ወብሩረ
  choice: और चाँदी
  rationale: ብሩር का सामान्य अर्थ चाँदी है; स्रोत में मात्रा निर्दिष्ट नहीं है, इसलिए कोई संख्या या धनराशि नहीं जोड़ी गई।
- source_word: ፈነወ
  choice: भेजी
  rationale: क्रिया का अर्थ भेजना है और पिता को दूर से वस्तुएँ पहुँचाने के प्रसंग में यही स्वाभाविक हिन्दी है।
