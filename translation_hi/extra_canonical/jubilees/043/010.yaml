  text: his servants. Look, we are servants to our lord, we and our donkeys also." And Joseph said to them, "God forbid that I should do this[10]. You, go to your houses; but your youngest brother shall be my servant, because you have done evil. Did you not know that a man surely divines with his cup, as I do?
translation:
  language: hi
  text: उसके दास। “देखो, हम भी और हमारे गधे भी अपने स्वामी के दास हैं।” तब यूसुफ ने उनसे कहा, “परमेश्वर न करे कि मैं ऐसा करूँ![a] तुम अपने घरों को चले जाओ; पर तुम्हारा सबसे छोटा भाई मेरा दास रहेगा, क्योंकि तुमने बुरा किया है। क्या तुम नहीं जानते थे कि एक मनुष्य अपने प्याले से निश्चय ही शकुन-विचार करता है, जैसा कि मैं करता हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ गीज़ का वाक्यांश कठिन और संभवतः पाठगत रूप से विकृत है। प्रसंग का व्यापक अर्थ यह है कि यूसुफ सब भाइयों को दास बनाने का उनका प्रस्ताव दृढ़ता से ठुकराता है और केवल सबसे छोटे भाई को रोकने की बात कहता है।
    reason: textual_variant
lexical_decisions:
- source_word: አግብርት / ቅኔየ
  choice: दास / मेरा दास
  rationale: इन शब्दों में स्वामित्व और बंधुआ अधीनता का स्पष्ट भाव है; ‘सेवक’ उस कठोर सामाजिक अर्थ को हल्का कर देता।
- source_word: አእዱጊነ
  choice: हमारे गधे
  rationale: स्रोत में भाइयों के साथ उनके गधों को भी स्वामी की संपत्ति के रूप में सौंपने की अतिशयोक्तिपूर्ण पेशकश है।
- source_word: ያስተቀስም
  choice: शकुन देखता है
  rationale: क्रिया प्याले द्वारा भविष्य या छिपी बात जानने की शकुन-विधि को दर्शाती है; आधुनिक पाठक के लिए ‘शकुन देखना’ स्वाभाविक और अर्थपूर्ण है।
- source_word: ጽዋዖ
  choice: अपने प्याले से
  rationale: प्रत्यय पुरुष के अपने प्याले का बोध देता है और प्रसंग यूसुफ के प्याले का है।
- source_word: እኑክሙ
  choice: तुम्हारा सबसे छोटा भाई
  rationale: पाठ का रूप कठिन/चिह्नित है, पर प्रसंग और परंपरागत पाठ इसे सबसे छोटे भाई के रूप में पहचानते हैं।
theological_decisions:
- issue: यूसुफ द्वारा प्याले से शकुन देखने का दावा
  choice: 'दावे को सीधे रखा गया: ‘शकुन देखता है, जैसे मैं देखता हूँ’'
  alternative: इसे केवल ढोंग, परीक्षा या कथित व्यवहार बताना
  rationale: स्रोत कथन की वास्तविकता अथवा छल होने का निर्णय नहीं करता; अनुवाद ने इस नैतिक और कथात्मक तनाव को अनसुलझा रखा है।
- issue: कठिन वाक्यांश እግዚአብሔር አገሰ አፈረሀ
  choice: “परमेश्वर न करे कि मैं ऐसा करूँ!”
  alternative: अधिक शाब्दिक किंतु अस्पष्ट रूप, जैसे ‘परमेश्वर ने सहा; मैं डरा’
  rationale: गीज़ पाठ कठिन या विकृत प्रतीत होता है। प्रसंग में यूसुफ सब भाइयों को दास बनाने का प्रस्ताव दृढ़ता से ठुकराता है; मुख्य पाठ उसी व्यापक अर्थ को देता है और कठिनाई को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘दास’ सामाजिक अधीनता को स्पष्ट करता है; ‘स्वामी’ प्रसंगानुकूल है। आरंभ का खंडित वाक्यांश पद-विभाजन के कारण ज्यों का त्यों एक संक्षिप्त अंश के रूप में रखा गया है।
