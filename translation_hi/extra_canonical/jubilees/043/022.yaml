    rationale: The source’s ‘mouth/word of Pharaoh’ is an idiom for Pharaoh’s command. Modern Hindi should express this as ‘फ़िरौन के आदेश पर’.
  - severity: medium
    issue: ‘रथ’ is too narrow for the vehicles in this context.
    rationale: The source term can denote wagons/carriages; the audit trail specifically has ‘wagons,’ and provisions for a journey support ‘गाड़ियाँ’.
