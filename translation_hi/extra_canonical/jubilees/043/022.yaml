  verdict: revise
  source_fidelity: The draft correctly represents the connective, Pharaoh's authorization, the indirect object, the vehicles, and provisions for the journey. However, ሰረገላተ is best rendered here as ‘गाड़ियाँ’/wagons, consistent with the English audit trail and the travel-and-transport context, rather than the more specifically martial ‘रथ’.
