lexical_decisions:
- source_word: በቃለ፡ አፈ፡ ፈርዖን
  choice: फ़िरौन के मुँह की आज्ञा के अनुसार
  rationale: शाब्दिक संरचना ‘फ़िरौन के मुख के वचन से’ राजकीय मौखिक आदेश को दर्शाती है; हिन्दी में अर्थ स्पष्ट रखते हुए ‘मुँह की आज्ञा’ स्रोत की अभिव्यक्ति भी बचाती है।
- source_word: ሰረገላተ
  choice: रथ
  rationale: यह बहुवचन में यात्रा या ढुलाई के वाहनों को सूचित करता है; प्राचीन परिवेश के लिए ‘रथ’ स्वाभाविक और परिचित है।
- source_word: ስንቀ፡ ለፍኖት
  choice: यात्रा के लिए भोजन-सामग्री
  rationale: यह मार्ग के लिए दिए गए रसद या प्रावधान को दर्शाता है; ‘भोजन-सामग्री’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ወወሀቦሙ
  choice: और उसने उन्हें ... दी
  rationale: क्रिया, संयोजक और परोक्ष कर्म को सीधे रखते हुए स्रोत के कथात्मक क्रम को सुरक्षित किया गया है।
