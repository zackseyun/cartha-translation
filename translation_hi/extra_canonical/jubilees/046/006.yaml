translation:
  language: hi
  text: उसकी हड्डियाँ उस दिन, जब वे मिस्र देश से निकले। उसने उन्हें अपनी हड्डियों के विषय में शपथ दिलाई, क्योंकि वह जानता था कि मिस्री उसे फिर बाहर ले जाकर कनान देश में दफ़न नहीं करेंगे। क्योंकि कनान का राजा मकमरोन, अश्शूर देश में रहते हुए, घाटी में ... के राजा से युद्ध किया—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध स्रोत-पाठ यहाँ “... के राजा” पर अधूरा समाप्त होता है; अगले नाम या देश की पूर्ति अनुमान से नहीं की गई है।
    reason: पांडुलिपीय/संपादकीय रूप से अधूरे वाक्य को पाठक के सामने स्पष्ट रखना और अनिश्चित सामग्री न जोड़ना।
lexical_decisions:
- source_word: አዕፅምቲሁ
  choice: उसकी हड्डियाँ / अपनी हड्डियों
  rationale: प्रसंग के अनुसार एक ही व्यक्ति की अस्थियों का उल्लेख है; पहले वाक्य में तृतीय पुरुष और शपथ दिलाने वाले वाक्य में स्वाभाविक हिन्दी के लिए निजवाचक रूप रखा गया।
- source_word: ምድረ፡ ግብጽ
  choice: मिस्र देश
  rationale: स्थाननाम का प्रचलित हिन्दी रूप रखा गया और ‘देश’ से स्रोत के ‘भूमि/देश’ भाव को व्यक्त किया गया।
- source_word: ቀቢሮተ
  choice: दफ़न
  rationale: यह शव को भूमि में गाड़ने/समाधि देने की क्रिया है; आधुनिक सामान्य हिन्दी में ‘दफ़न’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: ማክማሮን
  choice: मकमरोन
  rationale: व्यक्तिनाम का ध्वन्यात्मक देवनागरी लिप्यंतरण किया गया; किसी अधिक परिचित नाम से इसकी पहचान मानकर पाठ को नहीं बदला गया।
- source_word: ምድረ፡ አሱር
  choice: अश्शूर देश
  rationale: Assur/Assyria के लिए बाइबिलीय हिन्दी में परिचित ‘अश्शूर’ रखा गया, साथ में स्रोत के ‘भूमि/देश’ का संकेत भी बचाया गया।
- source_word: በቈላ
  choice: घाटी में
  rationale: शब्द का स्थलाकृतिक अर्थ ‘घाटी/निचला मैदान’ है; यहाँ युद्धस्थल के रूप में ‘घाटी’ सहज है।
- source_word: ተቃተለ
  choice: युद्ध किया
  rationale: परस्पर लड़ने की क्रिया को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया।
theological_decisions:
- issue: मिस्रियों द्वारा अस्थियाँ निकालकर कनान में दफ़न करने का कथन
  choice: मिस्री उसे फिर बाहर ले जाकर कनान देश में दफ़न नहीं करेंगे
  alternative: मिस्री उसे बाहर निकालने और कनान में दफ़न करने का कष्ट नहीं उठाएँगे
  rationale: प्रदत्त गीइज़ पाठ और परामर्श-पाठ में क्रिया की सूक्ष्मता कुछ कठिन है। मुख्य पाठ में व्यक्ति को बाहर ले जाने और दफ़न करने का सीधा अर्थ रखा गया, बिना मिस्रियों की प्रेरणा या किसी धार्मिक कारण को जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भ का वाक्य पिछले प्रसंग से जुड़ा हुआ खंड प्रतीत होता है, इसलिए उसकी खंडित संरचना को कृत्रिम रूप से पूरा नहीं किया गया। अंतिम वाक्य स्रोत में अधूरा है; दीर्घ विराम और पादटिप्पणी से यह स्पष्ट किया गया है।
