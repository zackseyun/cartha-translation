  text: मिस्र देश में। उन्होंने उनसे बलपूर्वक सेवा कराई; और जितना अधिक वे उन पर अत्याचार करते गए, उतना ही अधिक—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሀገረ፡ ግብጽ
  choice: मिस्र देश में
  rationale: स्थानसूचक पदबंध को स्वाभाविक आधुनिक हिन्दी में रखा गया है; यह पिछले वाक्य से जुड़ा हुआ आरम्भिक खंड है।
- source_word: ይቀንይዎሙ፡ በግፍዕ
  choice: उन्होंने उनसे बलपूर्वक सेवा कराई
  rationale: क्रिया में किसी को सेवा/अधीन श्रम में लगाने का कारक भाव है, और በግፍዕ बल, दमन या अन्यायपूर्ण बाध्यता को व्यक्त करता है; ‘बलपूर्वक सेवा कराई’ दोनों भावों को संक्षेप में सुरक्षित रखता है।
- source_word: መጠነ፡ ያሐስሙ፡ ላዕሌሆሙ፡ ከማሁ
  choice: जितना अधिक वे उन पर अत्याचार करते गए, उतना ही अधिक
  rationale: मूल का परिमाण-सापेक्ष तुलनात्मक ढाँचा सुरक्षित रखा गया है। ‘अत्याचार’ कठोर दमन का स्वाभाविक हिन्दी रूप है, जबकि ‘करते गए’ बढ़ती हुई प्रक्रिया को स्पष्ट करता है।
theological_decisions:
- issue: पद के अंत में अधूरा तुलनात्मक वाक्य
  choice: ‘उतना ही अधिक—’ पर खंड को खुला छोड़ा गया
  alternative: अगले पद की बात अनुमान से जोड़कर वाक्य पूरा करना
  rationale: गीज़ स्रोत और उपलब्ध पद-विभाजन दोनों में तुलनात्मक उत्तरांश इस पद में पूरा नहीं होता। अर्थ का अनुमान लगाकर जोड़ना स्रोत की वास्तविक अपूर्णता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भ का ‘मिस्र देश में’ पिछले पद से जुड़ा खंड है और अंत का दीर्घ विरामचिह्न अगले पद में जारी रहने वाले अधूरे तुलनात्मक वाक्य को दर्शाता है।
