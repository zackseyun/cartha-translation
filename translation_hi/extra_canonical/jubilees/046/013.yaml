base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/013.yaml
  text: and he oppressed them, and he said to the people of Egypt, 'Look, the people of the children of Israel are more and stronger than we are. Come, let us deal wisely with them, before they multiply, and let us oppress them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.'
translation:
  language: hi
  text: और उसने उन पर अत्याचार किया। उसने मिस्र के लोगों से कहा, “देखो, इस्राएलियों की प्रजा हमसे अधिक और बलवान है। आओ, हम उनके विरुद्ध समझदारी से काम लें, इससे पहले कि वे और बढ़ जाएँ[a]; और हम उन्हें दासता में लगाकर सताएँ, कहीं ऐसा न हो कि हम पर युद्ध आ पड़े और वे भी हमारे शत्रुओं से जा मिलें और हमारे देश से निकल जाएँ[b], क्योंकि उनके मन और मुख कनान देश की ओर हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “कहीं ऐसा न हो कि वे और बढ़ जाएँ।”
    reason: गीइज़ पदबंध का मुख्य अर्थ यहाँ “इससे पहले कि” लिया गया है; वैकल्पिक निषेधात्मक-आशंकात्मक समझ को भी दर्ज किया गया है।
  - marker: b
    text: कुछ समानान्तर परम्पराओं में, “हमारे देश से ऊपर चले जाएँ”; गीइज़ पाठ का अर्थ “निकल जाएँ” है।
    reason: निर्गमन 1:10 के परिचित समानान्तर से भेद स्पष्ट करते हुए गीइज़ स्रोत की सामान्य “निकलना” क्रिया को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: ያሕምሞሙ / ናሕምሞሙ
  choice: उन पर अत्याचार किया / उन्हें सताएँ
  rationale: एक ही गीइज़ धातु की पुनरावृत्ति को प्रसंगानुसार स्वाभाविक हिन्दी में व्यक्त किया गया है; दोनों स्थानों पर पीड़ा पहुँचाने और दमन करने का भाव सुरक्षित है।
- source_word: ሕዝበ፡ ውሉደ፡ እስራኤል
  choice: इस्राएल की सन्तानों के लोग
  rationale: ‘इस्राएल की सन्तान’ के सामूहिक अर्थ को रखते हुए ሕዝብ (‘लोग/जन’) को भी स्पष्ट रूप से व्यक्त किया गया है।
- source_word: ንጥበብ፡ ላዕሌሆሙ
  choice: हम उनके साथ चतुराई से व्यवहार करें
  rationale: शाब्दिक रूप से ‘उनके विरुद्ध/विषय में बुद्धिमानी करें’; यहाँ चालाक नीति अपनाने का भाव है, इसलिए प्रचलित और स्वाभाविक हिन्दी चुनी गई।
- source_word: ዘእንበለ፡ ይብዝኁ
  choice: इससे पहले कि वे और बढ़ जाएँ
  rationale: ዘእንበለ को इस प्रसंग में ‘पहले कि’ समझा गया है, न कि उद्देश्यसूचक ‘कहीं ऐसा न हो’; इससे स्रोत की क्रमगत चेतावनी बनी रहती है।
- source_word: በቅኔ
  choice: दासता का काम कराकर
  rationale: शब्द में सेवा/परिश्रम/दास-श्रम का अर्थ है; यह रूप मिस्र में थोपी गई श्रम-दासता को साधारण हिन्दी में स्पष्ट करता है।
- source_word: ይወፅኡ፡ እምድርነ
  choice: हमारे देश से निकल जाएँ
  rationale: ወፅአ का मूल अर्थ ‘बाहर निकलना’ है; इसे निर्गमन 1:10 के हिब्रानी पाठ के अनुरूप ‘ऊपर चले जाएँ’ बनाकर समरूप नहीं किया गया।
- source_word: ልቦሙ፡ ወገጾሙ፡ ውስተ፡ ምድረ፡ ከናአን
  choice: उनके मन और उनके मुख कनान देश की ओर लगे हैं
  rationale: ‘मन और मुख’ की स्रोत-छवि को बनाए रखते हुए दिशा और अभिलाषा का अर्थ स्वाभाविक हिन्दी में दिया गया है।
theological_decisions:
- issue: इस्राएलियों के बढ़ने के संबंध में फिरौन की आशंका
  choice: “इससे पहले कि वे और बढ़ जाएँ”
  alternative: “कहीं ऐसा न हो कि वे बढ़ जाएँ”
  rationale: गीइज़ ዘእንበለ यहाँ कालगत ‘पहले कि’ का समर्थन करता है; निर्गमन के परिचित रूप के कारण उद्देश्यसूचक अर्थ आरोपित नहीं किया गया।
- issue: देश छोड़ने की दिशा
  choice: “हमारे देश से निकल जाएँ”
  alternative: “हमारे देश से ऊपर चले जाएँ”
  rationale: प्राप्त गीइज़ पाठ में सामान्य ‘निकलना’ क्रिया है; हिब्रानी निर्गमन 1:10 के संभावित दिशात्मक मुहावरे से पाठ का सामंजस्य नहीं कराया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। वाक्य में प्राचीन भाषण की गंभीरता रखी गई है, पर अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। ‘सन्तानों’, ‘दासता’, ‘अत्याचार’ और ‘कनान’ जैसे बाइबलीय रूप सामान्य पाठक के लिए पर्याप्त परिचित हैं।
