  text: and shut the gate of Egypt. And he devised an evil plan against the sons of Israel, so that
translation:
  language: hi
  text: और उसने मिस्र का फाटक बंद कर दिया। उसने इस्राएल की संतानों के विरुद्ध एक बुरी योजना बनाई, ताकि—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ वाक्य अधूरा है और अगले पद में पूरा होता है।
    reason: स्रोत अंश ከመ (‘ताकि’) पर समाप्त होता है; डैश और टिप्पणी पाठ की वास्तविक अपूर्णता को स्पष्ट करते हैं।
lexical_decisions:
- source_word: ዐጸወ፡ አንቀጸ፡ ግብጽ
  choice: मिस्र का फाटक बंद कर दिया
  rationale: क्रिया ዐጸወ का अर्थ ‘बंद करना’ और አንቀጸ का अर्थ ‘फाटक/द्वार’ है; एकवचन और ठोस बिंब सुरक्षित रखा गया है।
- source_word: ሐለየ፡ እኩየ፡ ሕሊና
  choice: एक बुरी योजना बनाई
  rationale: शाब्दिक रूप से ‘बुरा विचार सोचा’ के भाव को स्वाभाविक आधुनिक हिन्दी में षड्यंत्रकारी योजना के रूप में व्यक्त किया गया है, बिना अगले पद की सामग्री जोड़े।
- source_word: ውሉደ፡ እስራኤል
  choice: इस्राएल की संतानों
  rationale: ‘इस्राएल के पुत्रों’ की सामूहिक वंशगत संज्ञा को समावेशी और स्रोत-संगत ‘संतानों’ से व्यक्त किया गया है।
- source_word: ከመ
  choice: ताकि
  rationale: यह उद्देश्य/परिणाम सूचक संयोजक है और वाक्य अगले पद में पूरा होता है।
