  yaml_path: translation/extra_canonical/jubilees/046/007.yaml
  text: Egypt and killed him there; and he pursued after them to Egypt, as far as the entrance of Eromon. But he could not enter, because another new king had arisen over Egypt, stronger than he, and he returned to the land of Canaan, and the gate of Egypt was shut, and there was none who went out and none who came in to Egypt.
translation:
  language: hi
  text: मिस्र में उसने उसे वहीं मार डाला। फिर वह उनका पीछा करते हुए मिस्र में एरोमोन के प्रवेश-द्वार तक गया। पर वह प्रवेश न कर सका, क्योंकि मिस्र पर एक और नया राजा राज्य करने लगा था, जो उससे अधिक शक्तिशाली था। तब वह कनान देश लौट गया। मिस्र का फाटक बंद हो गया था, और न कोई मिस्र से बाहर जाता था, न कोई मिस्र में प्रवेश करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዴገነ፡ ድኅሬሆሙ
  choice: फिर वह उनका पीछा करते हुए
  rationale: क्रिया और बहुवचन प्रत्यय—‘उसने उनका पीछा किया’—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አንቀጸ፡ ኤሮሞን
  choice: एरोमोन के प्रवेश-द्वार
  rationale: स्थान-नाम का लिप्यंतरण करते हुए ‘द्वार/प्रवेश’ का भौगोलिक आशय बनाए रखता है।
- source_word: ነግሠ፡ ካልእ፡ ሐዲስ፡ ንጉሥ፡ ለግብጽ
  choice: मिस्र पर एक और नया राजा राज्य करने लगा था
  rationale: नए राजा के उदय और मिस्र पर उसके शासन को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወገብአ፡ ምድረ፡ ከናአን
  choice: तब वह कनान देश लौट गया
  rationale: ገብአ को यहाँ ‘लौटना’ के अर्थ में लिया गया है; इसे ‘अधिकार कर लिया’ कहना स्रोत-क्रिया के अनुरूप नहीं है।
- source_word: ወተዐጽወ፡ አንቀጸ፡ ግብጽ
  choice: मिस्र का फाटक बंद हो गया था
  rationale: क्रिया के कर्मवाच्य/मध्यवाच्य रूप को बनाए रखता है और किसी व्यक्ति को फाटक बंद करने वाला नहीं ठहराता।
