base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/001.yaml
  text: And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all united in their hearts, so that each loved his brother and a man helped his brother. And they increased abundantly and multiplied exceedingly during all the days of Joseph, for ten weeks of years.
translation:
  language: hi
  text: याकूब की मृत्यु के बाद ऐसा हुआ कि इस्राएल की संतान मिस्र देश में बढ़ती गई और एक बड़ी जाति बन गई। वे सभी अपने हृदयों में एक थे[a], इसलिए हर एक अपने भाई से प्रेम करता था और हर व्यक्ति अपने भाई की सहायता करता था। वे बहुत बढ़े और अत्यन्त बढ़ते गए—पूरे दस वर्ष-सप्तकों तक[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सब अपने हृदयों में एकमत थे।”
    reason: गीइज़ पद में ‘एक/समान’ और ‘अपने हृदयों में’ दोनों भाव हैं; यह वैकल्पिक रूप उस संरचना को अधिक स्पष्टता से दिखाता है।
  - marker: b
    text: दस वर्ष-सप्तक अर्थात सत्तर वर्ष।
    reason: प्राचीन ‘वर्षों के सप्ताह’ वाली कालगणना आधुनिक पाठक के लिए स्पष्ट की गई है।
lexical_decisions:
- source_word: ውሉደ፡ እስራኤል
  choice: इस्राएल की संतान
  rationale: शाब्दिक अर्थ ‘इस्राएल की संतान/पुत्र’ है। सामूहिक एकवचन ‘संतान’ आधुनिक हिन्दी में वंशजों के पूरे समुदाय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ዕሩያነ፡ በአልቦሙ
  choice: हृदय से एक थे
  rationale: ዕሩያነ में समान/एकमत होने का भाव है और በአልቦሙ हृदय के आन्तरिक भाव को स्पष्ट करता है। यह अनुवाद दोनों तत्वों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ይትራዳእ
  choice: सहायता करता था
  rationale: क्रिया पारस्परिक सहायता देने का भाव रखती है; प्रसंग में ‘अपने भाई की सहायता करना’ स्पष्ट और स्वाभाविक है।
- source_word: ወበዝኁ፡ ፈድፋደ፡ ወበዝኁ፡ ጥቀ
  choice: वे बहुत बढ़े और अत्यन्त बहुगुणित हुए
  rationale: मूल में በዝኁ क्रिया की पुनरावृत्ति और दो तीव्रतासूचक पद हैं। हिन्दी में दोनों समानान्तर कथनों और उनकी बढ़ती तीव्रता को बनाए रखा गया है; ‘बलवन्त हुए’ नहीं अपनाया गया क्योंकि मूल क्रिया बढ़ने/बहुगुणित होने की है।
- source_word: ዐሠርተ፡ ሱባዔ፡ ዓመታት
  choice: दस वर्ष-सप्तक
  rationale: यह ‘वर्षों के दस सप्ताह’, अर्थात दस सात-वर्षीय अवधियाँ, कहता है। ‘वर्ष-सप्तक’ प्राचीन कालगणना को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: भाईचारे की एकता और उसके फल के बीच सम्बन्ध
  choice: ‘इसलिए’ के द्वारा परिणाम का सम्बन्ध
  alternative: ‘ताकि’ के द्वारा उद्देश्य का सम्बन्ध
  rationale: ከመ उद्देश्य अथवा परिणाम दोनों दर्शा सकता है। यहाँ हृदय की एकता के बाद प्रेम और सहायता का वर्णन परिणाम के रूप में अधिक स्वाभाविक है, पर किसी विशिष्ट धार्मिक सिद्धान्त को आरोपित नहीं किया गया।
- issue: यूसुफ के दिनों का उल्लेख
  choice: अनुवाद में नहीं जोड़ा गया
  alternative: ‘यूसुफ के सभी दिनों में’ जोड़ना, जैसा अंग्रेज़ी परामर्श-पाठ में है
  rationale: प्रदान किए गए गीइज़ पाठ में यूसुफ अथवा उसके दिनों के अनुरूप शब्द नहीं हैं। इसलिए स्रोत से अप्रमाणित सामग्री मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जाति’, ‘हृदय से एक’ और ‘वर्ष-सप्तक’ जैसे पद प्राचीन कथात्मक वातावरण बनाए रखते हैं। मूल की पुनरुक्ति को जानबूझकर सुरक्षित रखा गया है।
