base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/002.yaml
  text: And there was no adversary and nothing evil through all the days of Joseph's life that he lived after his father Jacob, because all Egypt honored him.
translation:
  language: hi
  text: और अपने पिता याकूब के बाद[a] यूसुफ ने जितने दिन जीवन बिताया, उन सारे दिनों में न कोई विरोधी[b] था और न कोई बुराई, क्योंकि समूचा मिस्र उसका आदर करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात संभवतः, ‘अपने पिता याकूब की मृत्यु के बाद’।
    reason: मूल में केवल ‘अपने पिता याकूब के बाद’ है; ‘मृत्यु’ प्रसंग से समझी जाती है, लिखी नहीं है।
  - marker: b
    text: या, ‘शैतान’।
    reason: गीज़ ሰይጣን सामान्य रूप से ‘विरोधी’ और व्यक्तिवाचक रूप में ‘शैतान’—दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: ሰይጣን
  choice: विरोधी
  rationale: गीज़ शब्द का अर्थ ‘विरोधी’ भी हो सकता है और यह ‘शैतान’ के नाम के रूप में भी प्रयुक्त होता है। प्रसंग में अनिश्चितता बनाए रखने के लिए मुख्य पाठ में सामान्य अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ምንተኒ፡ እኩየ
  choice: कोई बुराई
  rationale: यह ‘कुछ भी बुरा’ अथवा ‘कोई बुरी बात’ का भाव देता है; स्वाभाविक और व्यापक हिन्दी के लिए ‘कोई बुराई’ चुना गया है।
- source_word: ያከብ
  choice: आदर करता था
  rationale: क्रिया सम्मान या आदर देने का भाव रखती है; पूरे मिस्र को सामूहिक कर्ता मानते हुए हिन्दी में एकवचन ‘करता था’ स्वाभाविक है।
theological_decisions:
- issue: ሰይጣን का व्यक्तिवाचक या सामान्य अर्थ
  choice: मुख्य पाठ में ‘विरोधी’
  alternative: ‘शैतान’
  rationale: मूल शब्द दोनों अर्थों की अनुमति देता है। पद स्वयं स्पष्ट रूप से किसी व्यक्तिवाचक सत्ता की पहचान नहीं कराता, इसलिए अधिक सामान्य अर्थ मुख्य पाठ में और दूसरा अर्थ पादटिप्पणी में रखा गया है।
- issue: ‘अपने पिता याकूब के बाद’ में निहित अर्थ
  choice: मूल की संक्षिप्त अभिव्यक्ति को पाठ में बनाए रखा
  alternative: ‘अपने पिता याकूब की मृत्यु के बाद’
  rationale: मूल में ‘मृत्यु’ स्पष्ट रूप से नहीं है, यद्यपि प्रसंग में यही आशय संभव है। अतः स्पष्टतर अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘जितने दिन जीवन बिताया, उन सारे दिनों में’ संरचना मूल के संबंधवाचक उपवाक्य को स्पष्ट रूप से दर्शाती है; ‘समूचा मिस्र’ सामूहिक रूप से मिस्रवासियों के लिए प्रयुक्त है।
