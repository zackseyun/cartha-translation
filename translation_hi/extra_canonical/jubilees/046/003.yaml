  text: the sons of Israel throughout all the days of Joseph's life. And Joseph died at the age of one hundred and ten years. Seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt.
translation:
  language: hi
  text: इस्राएल के पुत्रों को—यूसुफ के जीवन के सभी दिनों तक। यूसुफ एक सौ दस वर्ष की आयु में मर गया। वह सत्रह वर्ष कनान देश में रहा, दस वर्ष दास के रूप में सेवा करता रहा, तीन वर्ष बंदीगृह में रहा, और अस्सी वर्ष मिस्र के राजा फ़िरौन के अधिकार में रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቱ፡ ለዮሴፍ
  choice: यूसुफ के जीवन के सब दिनों में
  rationale: स्रोत की कालवाची अभिव्यक्ति को स्वाभाविक किंतु निकट हिंदी में रखा गया है।
- source_word: እንዘ፡ ይትቀነይ
  choice: दास के रूप में सेवा करता रहा
  rationale: क्रिया में सेवा के साथ अधीन अथवा दास अवस्था का भाव है; केवल ‘सेवा’ कहने से प्रसंग का यह भाव दब जाता।
- source_word: ቤተ፡ ሞቅሕ
  choice: बंदीगृह
  rationale: शाब्दिक अर्थ ‘बन्धन का घर’ है; ‘बंदीगृह’ आधुनिक, स्पष्ट और गरिमापूर्ण समतुल्य है।
- source_word: ታሕተ፡ ሤመቱ፡ ለፈርዖን፡ ንጉሠ፡ ግብጽ
  choice: मिस्र के राजा फ़िरौन के अधिकार में
  rationale: समीक्षित पूर्ण गीइज़ पाठ के अंतिम खंड में फ़िरौन के अधीन अथवा अधिकार में रहने की बात है; इसे केवल ‘मिस्र देश में’ नहीं बनाया गया।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है और ऐतिहासिक आख्यान के अनुरूप गरिमापूर्ण रखी गई है। उपलब्ध पद-पाठ का आरंभ वाक्य-खंड के रूप में होता है; अनुल्लिखित पूर्ववर्ती क्रिया जोड़कर अर्थ पूरा नहीं किया गया, इसलिए आरंभिक खंड की वास्तविक अपूर्णता सुरक्षित है। अंतिम वाक्यांश के लिए समीक्षित पूर्ण गीइज़ पाठ-साक्ष्य अपनाया गया है।
