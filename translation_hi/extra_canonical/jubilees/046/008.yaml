translation:
  language: hi
  text: और यूसुफ छियालीसवें जुबली-काल के छठे सप्ताह के दूसरे वर्ष में मर गया; और उन्होंने उसे दफ़ना दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልው
  choice: जुबली-काल
  rationale: यह एक विशिष्ट कालगणनात्मक इकाई है; ‘जुबली-काल’ सामान्य पाठक को इसके समय-अवधि होने का संकेत देता है और मूल पद को भी सुरक्षित रखता है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल शब्द सात की अवधि को दर्शाता है। प्रसंग में यह वर्षों का सप्ताह है, पर पद में ‘वर्षों’ स्पष्ट रूप से नहीं है; इसलिए मूल की संक्षिप्तता और संभावित अस्पष्टता बनाए रखी गई है।
- source_word: ዓመት
  choice: वर्ष
  rationale: कालगणना के क्रम में दूसरे वर्ष का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ወቀበርዎ
  choice: और उन्होंने उसे दफ़ना दिया
  rationale: बहुवचन कर्ता और एकवचन कर्म को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
