lexical_decisions:
- source_word: ይበዝኁ፡ ወከማሁ፡ ይፈደፍዱ
  choice: वे बढ़ते गए और उसी प्रकार उनकी संख्या बहुत होती गई
  rationale: दोनों समानांतर क्रियाओं के बढ़ने और बहुगुणित होने के भाव को स्वाभाविक आधुनिक हिन्दी में रखा गया है; ወከማሁ को ‘उसी प्रकार’ कहा गया है, न कि तीव्रता सूचक ‘और भी अधिक’।”
- source_word: ያስተረዙስዎሙ
  choice: से घृणा करने लगे
  rationale: यहाँ क्रिया मिस्रियों द्वारा इस्राएलियों को घृणित या अशुद्ध समझने और उनसे घृणा करने का भाव देती है; इसे ऐसा नहीं कहा गया कि मिस्रियों ने उन्हें दूसरों के लिए घृणित बना दिया।
- source_word: ውሉደ፡ እስራኤል
  choice: इस्राएल की संतानों
  rationale: ‘इस्राएल की संतान’ सामूहिक रूप से वंशजों को सूचित करता है; बहुवचन संदर्भ को स्पष्ट करने के लिए ‘संतानों’ चुना गया है।
