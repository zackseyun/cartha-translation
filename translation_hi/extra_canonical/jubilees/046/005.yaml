  choice: कि वे ले जाएँ
  rationale: उद्देश्य/विषयवाचक उपवाक्य तथा बहुवचन क्रिया को सुरक्षित रखता है; वस्तु अगले पाठ में आने के कारण यहाँ नहीं जोड़ी गई।
