lexical_decisions:
- source_word: እምታሕተ፡ ንጉሥ
  choice: राजा के अधीन
  rationale: गीज़ पदबंध का सीधा अर्थ सत्ता अथवा अधिकार के अधीन होना है; खंडित प्रसंग को बिना अनावश्यक विस्तार के रखा गया है।
- source_word: እንዘ፡ ይኴንን
  choice: जब वह ... शासन कर रहा था
  rationale: እንዘ से आरंभ समकालिक क्रियात्मक उपवाक्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኵላ፡ ምድረ፡ ግብጽ
  choice: मिस्र के पूरे देश पर
  rationale: ‘समस्त मिस्र-भूमि’ का स्पष्ट और आधुनिक हिन्दी रूप।
- source_word: ወሞተ
  choice: फिर वह मर गया
  rationale: संयोजक ወ को यहाँ कथानक की अगली घटना बताने वाले ‘फिर’ से व्यक्त किया गया है।
- source_word: ወኵሎሙ፡ አኅዊሁ
  choice: और उसके सभी भाई भी
  rationale: शाब्दिक रूप से ‘और उसके सभी भाई’; ‘भी’ साझा क्रिया ‘मर गए’ को स्पष्ट करता है, जिसे स्रोत में लोप के रूप में समझा जाता है।
theological_decisions:
- issue: अंतिम पदबंध में क्रिया का लोप
  choice: ‘और उसके सभी भाई भी,’
  alternative: ‘और उसके सभी भाई मर गए,’
  rationale: स्रोत का वाक्यांश इसी स्थान पर अधूरा है और ‘मर गए’ दोहराता नहीं; अल्पविराम तथा ‘भी’ से अगले अंश से जुड़ाव और मूल की अपूर्ण संरचना सुरक्षित रहती है।
