translation:
  language: hi
  text: और बहुत-से लोग मिस्र लौट गए, पर उनमें से थोड़े लोग हेब्रोन के पहाड़[a] पर रह गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद-विभाजन में ‘हेब्रोन’ अगले पद के आरम्भ में चला गया है, पर गीइज़ में ‘पहाड़’ का रूप अपने बाद आने वाले स्थान-नाम से जुड़ने की अपेक्षा करता है। इसलिए यहाँ अर्थ है, ‘हेब्रोन के पहाड़ पर।’
    reason: गीइज़ के व्याकरणिक संबंध और पद-विभाजन से उत्पन्न प्रतीत होने वाले विच्छेद को स्पष्ट करता है, बिना अप्रमाणित पांडुलिपि-साक्ष्य का दावा किए।
lexical_decisions:
- source_word: ወገብኡ፡ ብዙኃን፡ ውስተ፡ ግብጽ
  choice: और बहुत-से लोग मिस्र लौट गए
  rationale: ገብኡ का मूल अर्थ ‘प्रवेश किया/गए’ है; प्रसंग में ये लोग मिस्र से आए थे, इसलिए हिन्दी में स्वाभाविक और प्रसंगानुकूल अर्थ ‘मिस्र लौट गए’ रखा गया।
- source_word: ወኅዳጣን፡ ተርፉ፡ እምኔሆሙ
  choice: पर उनमें से थोड़े लोग … रह गए
  rationale: यह अनुवाद ‘उनमें से थोड़े बचे/रह गए’ के स्रोतार्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ውስተ፡ ደብረ
  choice: के पहाड़ पर
  rationale: ደብረ संबंधसूचक रूप ‘… का पहाड़’ है; स्थान के साथ हिन्दी में ‘… के पहाड़ पर’ स्वाभाविक है।
