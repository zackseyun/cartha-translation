base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/014.yaml
  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
translation:
  language: hi
  text: और उसने उन पर बेगार करानेवाले अधिकारी नियुक्त किए, ताकि वे उन्हें उत्पीड़न से पीड़ित करें। उन्होंने फ़िरौन के लिए किलेबंद नगर—पीतोम और रामसेस—बनाए। और उन्होंने वे सारी दीवारें और सारे तटबंध बनाए जो गिर गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
  choice: बेगार करानेवाले अधिकारी
  rationale: पदबंध उन निरीक्षकों या अधिकारियों को सूचित करता है जो जबरन श्रम करवाते थे; यह आधुनिक हिन्दी में भूमिका को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በቅኔ
  choice: कठोर श्रम से
  rationale: संदर्भ में यह उत्पीड़क सेवा अथवा श्रम का बोध देता है; ‘कठोर श्रम’ दमनकारी आशय को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: አህጉረ፡ ጽኑዓተ
  choice: किलेबंद नगर
  rationale: शाब्दिक अर्थ ‘दृढ़/सुरक्षित नगर’ है; ‘किलेबंद नगर’ सामान्य हिन्दी में उपयुक्त स्थापत्य और सैनिक अर्थ रखता है।
- source_word: ጥቆመ
  choice: दीवारें
  rationale: संदर्भानुसार यह नगर-निर्माण से जुड़ी दीवारों या परकोटों को दर्शाता है; सहज हिन्दी के लिए ‘दीवारें’ चुना गया।
- source_word: ዐረፋተ
  choice: बाँध
  rationale: यह मिट्टी अथवा पत्थर की उठी हुई रोधक संरचनाओं का संकेत देता है; ‘बाँध’ सामान्य पाठक के लिए संक्षिप्त और बोधगम्य है।
- source_word: ዘወደቀ
  choice: जो गिर गए थे
  rationale: स्रोत में पतन/गिरने का सीधा अर्थ सुरक्षित रखा गया है; वाक्य में ‘फिर से’ पुनर्निर्माण को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: फ़िरौन की एकवचन क्रिया का कर्ता
  choice: ‘उसने’ रखकर पूर्ववर्ती संदर्भ के पुरुष कर्ता को खुला रखा गया
  alternative: ‘फ़िरौन ने’
  rationale: इस पद में कर्ता सर्वनाम से व्यक्त है; उसका नाम जोड़ना स्रोत की तुलना में अधिक स्पष्ट निर्धारण होता।
- issue: गिरी हुई संरचनाओं का पुनर्निर्माण
  choice: ‘फिर से बनाए’
  alternative: केवल ‘बनाए’
  rationale: ‘जो गिर गए थे’ के साथ पुनर्निर्माण का आशय स्वाभाविक है, पर फुटनोट में अधिक निकट और कम व्याख्यात्मक विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘फ़िरौन’, ‘पीतोम’ और ‘रामसेस’ प्रचलित बाइबलीय नाम-रूपों में रखे गए हैं; जबरन श्रम के ऐतिहासिक संदर्भ के लिए ‘बेगार’ का प्रयोग किया गया है।
