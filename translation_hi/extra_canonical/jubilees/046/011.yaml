translation:
  language: hi
  text: हेब्रोन; और तुम्हारा पिता अम्राम[a] उनके साथ रहा। और कनान के राजा ने मिस्र के राजा को हरा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में ‘अब्राम’ है; संदर्भ के आधार पर यहाँ ‘अम्राम’ पाठ-संशोधन अपनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: አብራም
  choice: अम्राम
  rationale: गीइज़ पांडुलिपि में शाब्दिक रूप से ‘अब्राम’ है, पर संबोधन मूसा से है और यहाँ उसके पिता का उल्लेख है; इसलिए संदर्भानुकूल पाठ-संशोधन ‘अम्राम’ मुख्य पाठ में रखा गया है और पांडुलिपि-पाठ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: ተረፈ
  choice: रहा
  rationale: क्रिया का अर्थ यहाँ किसी समूह के साथ बने रहने या ठहरे रहने का है; स्वाभाविक हिन्दी में ‘उनके साथ रहा’ उपयुक्त है।
- source_word: ሞአ
  choice: हरा दिया
  rationale: यह क्रिया ‘जीतना, पराजित करना, प्रबल होना’ व्यक्त करती है; इसे मृत्यु-सूचक क्रिया समझना उचित नहीं। ‘हरा दिया’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: मूसा के पिता के नाम में पांडुलिपिगत कठिनाई
  choice: मुख्य पाठ में ‘अम्राम’, पादटिप्पणी में गीइज़ का ‘अब्राम’
  alternative: मुख्य पाठ में ‘अब्राम’ रखना
  rationale: मूल गीइज़ पाठ का साक्ष्य स्पष्ट रूप से बताया गया है, लेकिन प्रसंग में मूसा के पिता अम्राम अभिप्रेत हैं। यह व्यवस्था पाठ-साक्ष्य और कथानक-संदर्भ दोनों को बिना छिपाए प्रस्तुत करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज कथात्मक शैली रखी गई है। आरंभ का ‘हेब्रोन;’ स्रोत में पूर्ववर्ती वाक्य से जुड़ा खंड है, इसलिए उसकी खंडात्मकता सुरक्षित रखी गई है।
