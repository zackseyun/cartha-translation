  text: in the land of Egypt. And all his brothers died after him. And the king of Egypt went out to fight with the king of Canaan in the forty-seventh jubilee, in the second week, in the second year; and the sons of Israel brought out all the bones of the sons of Jacob, except the bones of Joseph, and they buried them in the field, in the double cave in the mountain,
translation:
  language: hi
  text: मिस्र देश में। उसके बाद उसके सभी भाई भी मर गए। फिर सैंतालीसवें जुबली-चक्र के दूसरे सप्ताह के दूसरे वर्ष में मिस्र का राजा कनान के राजा से युद्ध करने निकला। तब इस्राएल के पुत्र यूसुफ़ की हड्डियों को छोड़कर याकूब के सभी पुत्रों की हड्डियाँ बाहर ले आए और उन्हें मैदान में, पहाड़ की दोहरी गुफा में[a] दफ़ना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल में स्थान-संबंध कुछ असमंजसपूर्ण है: शाब्दिक रूप से, “मैदान में, दोहरी गुफा में, पहाड़ में।”'
    reason: गीज़ पाठ में ‘में’ का प्रयोग बार-बार हुआ है; इसलिए मैदान, गुफा और पहाड़ के बीच सटीक स्थानिक संबंध को मुख्य पाठ में पूरी तरह निश्चित नहीं किया गया।
lexical_decisions:
- source_word: ኢዮቤልው
  choice: जुबली-चक्र
  rationale: यह ग्रंथ की कालगणना की तकनीकी इकाई है; ‘चक्र’ जोड़ने से आधुनिक हिन्दी पाठक समझ सकता है कि यह उत्सव नहीं, समय की एक अवधि है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल में सात की काल-इकाई है। ‘दूसरे सप्ताह के दूसरे वर्ष’ ग्रंथ की कालगणना को बनाए रखता है और ‘सात वर्ष’ जैसा अतिरिक्त अर्थ मुख्य पाठ में नहीं जोड़ता।
- source_word: ይትቃተል
  choice: युद्ध करने
  rationale: क्रिया परस्पर लड़ने या युद्ध करने का भाव देती है; राजाओं के प्रसंग में यह स्वाभाविक और सटीक हिन्दी है।
- source_word: ገዳም
  choice: मैदान
  rationale: इस प्रसंग में दफ़नाने के स्थान के लिए ‘मैदान’ उपयुक्त है; शब्द का ‘निर्जन प्रदेश’ अर्थ भी हो सकता है, पर निकटवर्ती गुफा और दफ़नाने के संदर्भ में ‘मैदान’ अधिक संगत है।
- source_word: በዐት፡ ዘካዕበት
  choice: दुहरी गुफा
  rationale: शाब्दिक संरचना ‘दुगुनी/दोहरी गुफा’ है; किसी पारंपरिक स्थान-नाम को बिना आवश्यकता आरोपित नहीं किया गया।
