  text: And he said, “Let a tenth of them remain before him, and let nine parts descend into the place of judgment.”
translation:
  language: hi
  text: उसने कहा, “उनमें से एक-दसवाँ भाग उसके सामने रहने दिया जाए, और शेष नौ-दसवाँ भाग न्याय के स्थान में नीचे उतर जाएँ।”
  philosophy: optimal-equivalence
lexical_decisions:
