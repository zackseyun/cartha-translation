  text: for your grace has been great toward me, and great is your mercy toward my life—let your grace be magnified over my sons, and do not let wicked spirits rule over them, lest they destroy them from the earth.
translation:
  language: hi
  text: क्योंकि मुझ पर तेरा अनुग्रह महान रहा है, और मेरे जीवन पर तेरी दया महान है। मेरे पुत्रों पर तेरा अनुग्रह महान हो[a], और दुष्ट आत्माओं को उन पर प्रभुत्व न करने दे, कहीं ऐसा न हो कि वे उन्हें पृथ्वी से मिटा दें।
  philosophy: optimal-equivalence
