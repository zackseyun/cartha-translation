  text: And the Lord sent a mighty wind against the tower, and it threw it down upon the earth.
translation:
  language: hi
  text: और प्रभु ने मीनार पर एक प्रचण्ड हवा भेजी, और उस हवा ने उसे धरती पर गिरा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
