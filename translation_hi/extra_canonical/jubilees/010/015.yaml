translation:
  language: hi
  text: क्योंकि वह उसे अपने सब पुत्रों से अधिक प्रेम करता था। और नूह अपने पुरखाओं के साथ सो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪያሁ
  choice: उसे
  rationale: यह स्वतंत्र कर्मवाचक सर्वनाम ‘उसे’ है। पद में नाम जोड़ने के बजाय मूल पाठ की सर्वनामिक अभिव्यक्ति और संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
- source_word: ያፈቅር
  choice: प्रेम करता था
  rationale: क्रिया का स्वाभाविक आधुनिक हिन्दी रूप, जो यहाँ निरंतर/पूर्वकालीन भाव व्यक्त करता है।
- source_word: ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: अपने सब पुत्रों से अधिक
  rationale: तुलनात्मक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: नूह अपने पुरखाओं के साथ सो गया
  rationale: मृत्यु के पारंपरिक शास्त्रीय मुहावरे को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: ‘उसे’ का संदर्भ
  choice: सर्वनाम ‘उसे’ बनाए रखा गया
  alternative: संदर्भ के आधार पर ‘शेम’ नाम रखना
  rationale: गीज़ पाठ में स्पष्ट नाम नहीं, बल्कि ኪያሁ (‘उसे’) है; अतः अनुवाद में नाम जोड़कर वास्तविक संदर्भगत अस्पष्टता को समाप्त नहीं किया गया।
- issue: ‘पुरखाओं के साथ सो गया’ का अर्थ
  choice: मृत्यु-सूचक मुहावरा ज्यों का त्यों रखा गया
  alternative: ‘मर गया’
  rationale: मूल की रूपकात्मक और शास्त्रीय अभिव्यक्ति को सुरक्षित रखते हुए हिन्दी में समझ में आने वाला रूप चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और शास्त्रीय मुहावरे के प्रति निष्ठावान अनुवाद। ‘पुरखाओं’ सामान्य पाठक के लिए स्वाभाविक है, और ‘सो गया’ मूल मृत्यु-मुहावरे को बनाए रखता है।
