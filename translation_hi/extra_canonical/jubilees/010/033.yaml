  text: पवित्र अधिपति के सामने और हमारे पिता नूह के सामने। पर उसने उनकी बात नहीं सुनी और वह उस देश में रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ ቅዱስ
  choice: पवित्र प्रधान
  rationale: ‘መኰንን’ शासक, प्रधान या अधिकारी को सूचित करता है; ‘प्रधान’ पद की गरिमा रखते हुए स्वाभाविक हिन्दी देता है। विशेषण ‘ቅዱስ’ को ‘पवित्र’ रखा गया है।
- source_word: ኖኅ፡ አቡነ
  choice: हमारे पिता नूह
  rationale: ‘አቡነ’ का प्रथम पुरुष बहुवचन संबंधसूचक अर्थ सीधे सुरक्षित रखा गया है।
- source_word: ኢሰምዖሙ
  choice: उसने उनकी बात नहीं मानी
  rationale: शाब्दिक ‘उसने उनकी नहीं सुनी’ की अपेक्षा यह हिन्दी में आज्ञा या समझाइश न मानने का स्वाभाविक अर्थ व्यक्त करता है, जबकि बहुवचन कर्म ‘उनकी’ सुरक्षित है।
- source_word: ኀደረ፡ ምድረ
  choice: वह उस देश में रहने लगा
  rationale: क्रिया ठहरने/निवास करने को और ‘ምድረ’ भूमि या देश को व्यक्त करती है; प्रसंगगत निश्चितता के लिए ‘उस देश’ स्वाभाविक है।
theological_decisions:
- issue: በቅድሜሁ፡ ለመኰንን में प्रत्यय का अनुवाद
  choice: पवित्र प्रधान के सामने
  alternative: उसके सामने, अर्थात् पवित्र प्रधान के सामने
  rationale: ‘-ሁ’ को आगामी ‘ለመኰንን’ की ओर संकेत करने वाली प्रोलैप्टिक रचना माना गया है; इसलिए हिन्दी में वस्तु को दोहराया नहीं गया।
