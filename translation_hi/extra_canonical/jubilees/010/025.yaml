  text: It is between Asshur and Babylon in the land of Shinar[25]. And they called its name Overthrow.
translation:
  language: hi
  text: वह शिनार देश में अश्शूर और बाबुल के बीच है। और उन्होंने उसका नाम “विध्वंस”[a] रखा।
  philosophy: optimal-equivalence
