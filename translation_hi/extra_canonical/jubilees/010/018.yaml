  yaml_path: translation/extra_canonical/jubilees/010/018.yaml
  text: And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the counsel of wickedness to build for themselves a city and a tower in the land of Shinar.”
translation:
  language: hi
  text: और तैंतीसवें जुबली-काल में, दूसरे सप्ताह के पहले वर्ष में, पेलेग ने लोमना नाम की एक स्त्री से विवाह किया, जो शिनार की बेटी थी। इस सप्ताह के चौथे वर्ष में उसने पेलेग के लिए एक पुत्र को जन्म दिया। पेलेग ने उसका नाम रऊ रखा, क्योंकि उसने कहा, “देखो, मनुष्यों की संतान दुष्टता की उस सलाह के कारण दुष्ट हो गई है कि वे अपने लिए शिनार देश में एक नगर और एक मीनार बनाएं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त गीइज़ अंश यहाँ शाब्दिक रूप से “... के देश में” पर समाप्त होता है और संबंधसूचक नाम पद-विभाजन के बाहर रह गया प्रतीत होता है; प्रसंग के अनुसार “शिनार” पूरा किया गया है।
    reason: मूल पाठ के construct रूप और पद-विभाजन से उत्पन्न वास्तविक पाठगत अपूर्णता को स्पष्ट करना।
lexical_decisions:
- source_word: እዮቤልው
  choice: जुबली-काल
  rationale: यह कालगणना की विशिष्ट इकाई है; ‘जुबली-काल’ मूल संज्ञा को बनाए रखते हुए सामान्य हिन्दी पाठक को इसके समय-अर्थ का संकेत देता है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल में सात वर्षों की काल-इकाई के लिए प्रयुक्त शब्द है; ग्रंथ की पारंपरिक कालगणना के अनुरूप ‘सप्ताह’ रखा गया है।
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: एक स्त्री से विवाह किया
  rationale: शाब्दिक अर्थ ‘अपने लिए स्त्री ली’ है; आधुनिक हिन्दी में इसका स्वाभाविक वैवाहिक अर्थ इस प्रकार व्यक्त होता है।
- source_word: ራገው
  choice: रऊ
  rationale: यह बाइबिलीय नाम Reu का प्रचलित हिन्दी रूप है।
- source_word: በምክረ፡ ዐግ
  choice: दुष्टता की सम्मति के अधीन होकर
  rationale: ‘सम्मति/परामर्श’ और ‘दुष्टता’ दोनों मूल तत्त्व सुरक्षित हैं; वाक्य में यह उस दुष्ट प्रभाव को व्यक्त करता है जिसके अंतर्गत निर्माण की योजना बनी।
- source_word: ማኅፈደ
  choice: मीनार
  rationale: बाबेल-वृत्तांत के संदर्भ में यह ऊँची संरचना या गुम्मट के लिए स्वाभाविक आधुनिक हिन्दी शब्द है।
theological_decisions:
- issue: मनुष्यों की नैतिक दशा और निर्माण-योजना का संबंध
  choice: ‘दुष्टता की सम्मति के अधीन होकर ... बनाने लगी है’
  alternative: ‘दुष्ट हो गई है, ताकि ... बनाए’
  rationale: मूल वाक्य दुष्टता की सम्मति और नगर-मीनार बनाने की योजना को निकटता से जोड़ता है। चुना हुआ रूप उद्देश्यगत अर्थ थोपने के बजाय इस संबंध को बनाए रखता है।
- issue: अंतिम स्थाननाम की पाठ-सीमा
  choice: ‘शिनार देश में’
  alternative: ‘देश में’
  rationale: प्राप्त अंश का अंतिम ምድረ construct रूप है और उसके बाद संबंधसूचक पूरक अपेक्षित है; पद-विभाजन में छूटे अगले शब्द तथा संदर्भ के आधार पर ‘शिनार’ ग्रहण किया गया है, पर इसे पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सहज रूप अपनाया गया है। ‘जुबली-काल’ और कालगणना के ‘सप्ताह’ जैसे ग्रंथ-विशिष्ट पद सुरक्षित रखे गए हैं; अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट भाषा से बचा गया है।
