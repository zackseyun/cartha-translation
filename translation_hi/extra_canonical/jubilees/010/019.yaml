  text: For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us go up by it into heaven.”
translation:
  language: hi
  text: क्योंकि वे अरारात के देश से पूर्व की ओर, शिनार को चले गए। और उसके दिनों में उन्होंने नगर और मीनार बनाई और कहा, “आओ, हम इसके सहारे स्वर्ग तक चढ़ जाएँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈለሱ
  choice: चले गए
  rationale: स्थान छोड़कर दूसरे क्षेत्र में जाने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: መንገለ፡ ጽባሕ
  choice: पूर्व की ओर
  rationale: शाब्दिक रूप से ‘भोर की ओर’; गीइज़ में यह पूर्व दिशा का स्वाभाविक संकेत है।
- source_word: ሰናአር
  choice: शिनार
  rationale: बाइबलीय स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ማኅፈድ
  choice: मीनार
  rationale: संदर्भ में नगर के साथ निर्मित ऊँची संरचना को दर्शाता है।
- source_word: ንዕርግ፡ ቦቱ
  choice: हम इसके सहारे ... चढ़ जाएँ
  rationale: क्रिया ‘चढ़ें’ और साधन/मार्गसूचक ‘इसके द्वारा’ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ውስተ
  choice: स्वर्ग तक
  rationale: उद्धरण के अंत में स्रोत-पाठ खंडित है, पर उपलब्ध अंग्रेज़ी परामर्श-पाठ और वाक्य-संदर्भ ‘स्वर्ग में/तक’ की पुष्टि करते हैं; हिन्दी में लक्ष्यगत गति के लिए ‘तक’ स्वाभाविक है।
theological_decisions:
- issue: मीनार के द्वारा स्वर्गारोहण का दावा
  choice: इसके सहारे स्वर्ग तक चढ़ जाएँ
  alternative: इसके द्वारा स्वर्ग में प्रवेश करें
  rationale: स्रोत की चढ़ने की क्रिया और मीनार को माध्यम मानने का भाव बनाए रखा गया है, बिना कथन की व्यवहार्यता या धार्मिक आशय की व्याख्या किए।
- issue: ‘उसके दिनों में’ का संदर्भ
  choice: उसके दिनों में
  alternative: उन दिनों में
  rationale: स्रोत के एकवचन पुरुषवाचक प्रत्यय को सुरक्षित रखा गया है; उसका पूर्वपद इस पृथक पद्यांश में स्पष्ट न होने के कारण अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज लेकिन गरिमापूर्ण कथात्मक शैली। स्रोत की वास्तविक संदर्भगत अस्पष्टता ‘उसके दिनों में’ में सुरक्षित है।
