base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/029.yaml
  text: And Canaan saw the land of Lebanon as far as the brook of Egypt, that it was very good, and he did not go into the land of his inheritance to the west of the sea, and he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.
translation:
  language: hi
  text: कनान ने लबानोन की भूमि को मिस्र की नदी तक देखा कि वह बहुत अच्छी थी। वह अपनी विरासत की भूमि में, समुद्र के पश्चिम की ओर, नहीं गया; और वह लबानोन की भूमि में बस गया—पूर्व से पश्चिम तक, यरदन की सीमा से समुद्र की सीमा तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐዘ፡ ግብጽ
  choice: मिस्र की नदी
  rationale: ‘मिस्र की नदी’ स्रोत के पदबंध का औपचारिक और भौगोलिक रूप से तटस्थ अनुवाद है; इसे किसी विशिष्ट आधुनिक जलधारा के नाम से नहीं पहचाना गया।
- source_word: ምድረ፡ ርስት
  choice: अपनी विरासत की भूमि
  rationale: ‘ርስት’ वंशानुगत अधिकार अथवा विरासत में मिले भूभाग को दर्शाता है; ‘विरासत की भूमि’ इस आवंटित अधिकार को बनाए रखता है।
- source_word: መንገለ፡ ዐረብ፡ ባሕር
  choice: पश्चिम में समुद्र की ओर
  rationale: पदबंध में दिशा (‘पश्चिम’) और समुद्र की ओर गमन दोनों हैं; यह रूप ‘समुद्र के पश्चिम में’ जैसी संभावित भौगोलिक भ्रांति से बचता है।
- source_word: ኀደረ
  choice: बस गया
  rationale: यहाँ क्रिया किसी स्थान में निवास स्थापित करने का भाव देती है; आधुनिक हिन्दी में ‘बस गया’ स्वाभाविक और स्पष्ट है।
- source_word: እምእደ፡ ዮርዳኖስ፡ ውእምእደ
  choice: यरदन की सीमा से समुद्र की सीमा तक
  rationale: स्रोत की समानांतर सीमावाची रचना को रखा गया है; अंतिम सीमा का आशय निकटवर्ती ‘समुद्र’ से लिया गया है, जैसा उपलब्ध पाठ और परामर्श-पाठ संकेत करते हैं।
theological_decisions:
- issue: कनान का अपने निर्धारित विरासती भूभाग में न जाना
  choice: वर्णन को नैतिक टिप्पणी जोड़े बिना रखा गया
  alternative: इसे सीधे अवज्ञा या पाप कहना
  rationale: इस पद में घटना बताई गई है, पर उसका स्पष्ट धर्मवैचारिक मूल्यांकन नहीं दिया गया; इसलिए अनुवाद कोई अतिरिक्त निर्णय आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। उपलब्ध गीइज़ अंश के आरम्भ का ‘अपने भाग में, दक्षिण की भूमि में’ पिछली वाक्य-इकाई का खंड प्रतीत होता है और अंग्रेज़ी परामर्श-पाठ भी उसे इस पद में नहीं रखता; इसलिए मुख्य अनुवाद कनान से आरम्भ किया गया है। ‘पूर्व से पश्चिम तक’ और सीमा-सूची की कुछ असहजता स्रोत की संरचना को अनावश्यक रूप से समतल किए बिना बनाए रखी गई है।
