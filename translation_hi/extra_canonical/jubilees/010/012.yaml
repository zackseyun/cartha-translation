translation:
  language: hi
  text: हमने उन्हें छोड़ दिया, ताकि वे पृथ्वी पर शैतान के अधीन रहें। और उनकी सभी बीमारियों का उपचार...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ स्रोत-पाठ यहाँ अधूरे संज्ञात्मक वाक्यांश पर समाप्त होता है; इसलिए आगे का आशय पूरा नहीं किया गया है।
    reason: source_truncation
lexical_decisions:
- source_word: አተርፍነ
  choice: हमने ... छोड़ दिया
  rationale: यह प्रथम पुरुष बहुवचन क्रिया है, जिसका अर्थ यहाँ ‘हमने छोड़ दिया/बचा रहने दिया’ है। दिए गए गीइज़ पाठ में ‘दसवाँ भाग’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ይትኰነኑ
  choice: वे ... के अधीन रहें
  rationale: यह अधीन होने या वश में रहने का भाव व्यक्त करता है; हिंदी में स्वाभाविक उद्देश्यवाचक रूप रखा गया।
- source_word: ቅድመ፡ ሰይጣን
  choice: शैतान के अधीन
  rationale: शाब्दिक ‘शैतान के सामने’ यहाँ सत्ता या अधीनता के संबंध को दर्शाता है; संदर्भानुकूल हिंदी में ‘के अधीन’ चुना गया।
- source_word: ወፈውሰ፡ ደዌሆሙ፡ ኵሎ
  choice: और उनकी सभी बीमारियों का उपचार...
  rationale: ወፈውሰ को क्रिया ‘हमने चंगा किया’ के बजाय संज्ञात्मक पद ‘और उपचार’ माना गया है। उपलब्ध स्रोत अंश यहीं अपूर्ण समाप्त होता है, इसलिए वाक्यांश को अधूरा ही रखा गया।
theological_decisions:
- issue: शैतान के संबंध में अधीनता का स्वरूप
  choice: ‘शैतान के अधीन’
  alternative: ‘शैतान के सामने’
  rationale: यह चयन सत्ता के अधीन रहने का संभावित आशय स्पष्ट करता है, पर शैतान की भूमिका या अधिकार के बारे में स्रोत से आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: छोड़े गए प्राणियों की संख्या
  choice: मुख्य पाठ में केवल ‘उन्हें’
  alternative: ‘उनमें से दसवाँ भाग’
  rationale: पिछले संदर्भ में दसवें भाग का संकेत हो सकता है, किंतु दिए गए पद के गीइज़ पाठ में संख्या व्यक्त नहीं हुई है; अतः उसे अंतर्निहित मानकर नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। मूल पाठ की अपूर्णता को दीर्घविराम और पादटिप्पणी द्वारा सुरक्षित रखा गया है।
