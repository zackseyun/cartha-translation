  text: And he prayed before the Lord his God, and said, “God of the spirits of all flesh, who have shown mercy to me and saved me and my sons from the waters of the flood, and have not caused me to perish as you caused the sons of perdition to perish—
translation:
  language: hi
  text: और उसने अपने परमेश्वर, प्रभु के सामने प्रार्थना करके कहा, “समस्त प्राणियों की आत्माओं के परमेश्वर, तूने मुझ पर दया की और मुझे तथा मेरे पुत्रों को जलप्रलय के जल से बचाया। तूने मुझे उन विनाश के पुत्रों के समान नाश नहीं होने दिया, जिन्हें तूने नाश कर दिया था—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር / አምላክ
  choice: प्रभु / परमेश्वर
  rationale: प्रभुता और ईश्वर-संबंधी दोनों पदों का स्वाभाविक तथा गरिमापूर्ण हिन्दी भेद बनाए रखा गया है।
- source_word: God of the spirits of all flesh
  choice: समस्त प्राणियों की आत्माओं के परमेश्वर
  rationale: ‘all flesh’ का शब्दशः ‘सारा मांस’ हिन्दी में भ्रामक होता; ‘समस्त प्राणी’ उसके सामूहिक जीवधारी अर्थ को व्यक्त करता है, जबकि ‘आत्माओं’ का बहुवचन सुरक्षित है।
- source_word: waters of the flood
  choice: जलप्रलय के पानी
  rationale: जलप्रलय की परिचित संज्ञा के साथ मूल के बहुवचनात्मक जल-बिंब को सहज हिन्दी में रखा गया है।
- source_word: sons of perdition
  choice: विनाश के पुत्र
  rationale: यह सामी मुहावरा मूल की न्याय-विषयक तीव्रता और संभावित अस्पष्टता बनाए रखता है; इसे व्याख्यात्मक रूप से केवल ‘दुष्ट लोग’ नहीं बनाया गया।
theological_decisions:
- issue: ‘विनाश के पुत्र’ की पहचान
  choice: समूह की पहचान स्पष्ट किए बिना मूल पदबंध बनाए रखा गया
  alternative: ‘दुष्ट लोग’ या ‘नाश के योग्य लोग’
  rationale: पाठ स्वयं इस पदबंध को व्याख्यायित नहीं करता; किसी विशिष्ट जाति, दानवी समूह या पूर्वनियत दंड के सिद्धांत को अनावश्यक रूप से आरोपित नहीं किया गया।
- issue: परमेश्वर द्वारा नाश और नाश होने देना
  choice: ‘जिन्हें तूने नाश कर दिया था’
  alternative: ‘जिन्हें तूने नाश होने दिया था’
  rationale: परामर्श-पाठ में परमेश्वर की प्रत्यक्ष क्रिया व्यक्त है; उसकी धार को नरम करके केवल अनुमति में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। परमेश्वर को संबोधित करते समय एकवचन ‘तू’ रखा गया है, जो बाइबिलीय प्रार्थना-भाषा में निकटता और प्रत्यक्ष संबोधन दोनों व्यक्त करता है। अंतिम दीर्घ डैश अगले पद में वाक्य जारी रहने का संकेत देता है।
