  text: And you know how your Watchers, the fathers of these spirits, acted in my days. As for these spirits that are living, imprison them and hold them fast in the place of judgment, and do not let them bring corruption upon the sons of your servant, O my God, for these are malignant and were created in order to destroy.
translation:
  language: hi
  text: और तू जानता है कि तेरे प्रहरियों ने—जो इन आत्माओं के पिता हैं—मेरे दिनों में कैसा आचरण किया था। जो जीवित आत्माएँ हैं, उन्हें बंदी बना और न्याय के स्थान में दृढ़ता से बाँधकर रख। हे मेरे परमेश्वर, उन्हें अपने दास के पुत्रों पर विनाश न पहुँचाने देना, क्योंकि वे विनाशकारी हैं और नाश करने के लिए सृजी गई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Watchers
  choice: पहरुए
  rationale: हनोक-साहित्य के विशिष्ट स्वर्गीय प्राणियों के पदनाम को साधारण और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: spirits
  choice: आत्माएँ
  rationale: यहाँ दुष्ट अलौकिक प्राणियों का उल्लेख है; ‘आत्माएँ’ स्वाभाविक हिन्दी है और संदर्भ की अस्पष्टता को बनाए रखती है।
- source_word: place of judgment
  choice: न्याय का स्थान
  rationale: स्रोत के न्याय/दंड-स्थान संबंधी पद को किसी अधिक विशिष्ट परलोक-सिद्धांत में बदले बिना औपचारिक रूप से व्यक्त करता है।
- source_word: bring corruption upon
  choice: भ्रष्ट करना
  rationale: ‘विनाश’ से कुछ अलग, नैतिक और हानिकारक बिगाड़ दोनों का अर्थ बनाए रखता है।
- source_word: malignant
  choice: घातक
  rationale: इन आत्माओं की सक्रिय हानिकारक प्रकृति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: created in order to destroy
  choice: नाश करने के लिए रची गई थीं
  rationale: स्रोत के प्रयोजनसूचक और कर्मवाच्य कथन को उसकी कठिन धार्मिक धार सहित सुरक्षित रखता है।
theological_decisions:
- issue: दुष्ट आत्माओं का ‘नाश करने के लिए’ रचा जाना
  choice: 'कथन को सीधे कर्मवाच्य में रखा गया: ‘नाश करने के लिए रची गई थीं।’'
  alternative: ‘जिनका स्वभाव नाश करना है’
  rationale: वैकल्पिक रूप सृष्टि और प्रयोजन के संबंध को नरम कर देता; स्रोत की धार्मिक तनावपूर्ण भाषा को अनसुलझा रखा गया है।
- issue: ‘मेरे परमेश्वर’ का व्याकरणिक संबंध
  choice: 'इसे स्पष्ट संबोधन बनाया गया: ‘हे मेरे परमेश्वर’।'
  alternative: विरामचिह्न के सहारे ‘मेरे परमेश्वर’ रखना
  rationale: प्रार्थना-संदर्भ में संबोधन ही सबसे स्वाभाविक पठन है और हिन्दी में क्षणिक गलत संबंध से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज प्रार्थना-रजिस्टर अपनाया गया है। ईश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है, और आदेशार्थक क्रियाएँ उसी अनुरूप हैं।
