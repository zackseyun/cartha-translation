  text: And the Lord our God said to us[22], “Look, they are one people, and this they have begun to do; and now nothing will be withheld from them. Come, let us go down and confuse their tongues, so that one will not hear another’s speech, and they will be scattered into cities and nations, and one purpose will no longer remain with them until the day of judgment.”
translation:
  language: hi
  text: और हमारे प्रभु परमेश्वर ने हमसे कहा[a], “देखो, ये एक ही लोग हैं, और इन्होंने यह काम आरम्भ कर दिया है। अब वे जो कुछ करने की ठानेंगे, उसमें उन्हें रोका न जा सकेगा। आओ, हम नीचे उतरें और उनकी भाषाओं में ऐसी गड़बड़ी डालें कि वे एक-दूसरे की बात न समझ सकें। तब वे नगरों और जातियों में तितर-बितर हो जाएँगे, और न्याय के दिन तक उनमें एक ही उद्देश्य फिर न रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह भाषा बाबेल के वृत्तांत की प्रतिध्वनि करती है, पर इसे केवल उत्पत्ति की सीधी उद्धृति नहीं समझना चाहिए; जुबिलीज़ इसे स्वर्गदूतों द्वारा प्रथम पुरुष में दिए जा रहे प्रकाशन के ढाँचे में रखती है।
    reason: cross_reference
lexical_decisions:
- source_word: ሕዝብ፡ አሐዱ
  choice: एक ही जाति
  rationale: शाब्दिक अर्थ ‘एक लोग/एक जनसमुदाय’ है; आधुनिक हिन्दी में ‘एक ही जाति’ यहाँ साझा समुदाय को स्वाभाविक ढंग से व्यक्त करता है, नस्लीय अर्थ अभिप्रेत नहीं है।
- source_word: ኢይኅልቅ፡ እምኔሆሙ
  choice: उससे उन्हें रोका न जा सकेगा
  rationale: पाठ की निषेधात्मक अभिव्यक्ति बाबेल-वृत्तांत के भाव में उनके प्रस्तावित कार्य के अब अबाध होने को बताती है; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: ንከዐው፡ ልሳናቲሆሙ
  choice: उनकी भाषाओं में ऐसी गड़बड़ी डालें
  rationale: ልሳን का मूल अर्थ ‘जीभ’ भी है और ‘भाषा’ भी; इस प्रसंग में पारस्परिक समझ का टूटना अभिप्रेत है, इसलिए ‘भाषाओं’ चुना गया।
- source_word: አሐቲ፡ ምክር
  choice: एक ही उद्देश्य
  rationale: ምክር में परामर्श, योजना या साझा संकल्प का अर्थ हो सकता है; ‘उद्देश्य’ सामूहिक अभिप्राय को व्यक्त करता है और अनावश्यक रूप से किसी एक निश्चित योजना तक अर्थ को सीमित नहीं करता।
- source_word: ዕለተ፡ ይኴን
  choice: न्याय के दिन
  rationale: पाठ का आशय निर्णायक न्याय-दिवस है; हिन्दी धार्मिक साहित्य में यह प्रतिष्ठित और सहज पद है।
theological_decisions:
- issue: परमेश्वर के बहुवचन ‘हम’ और स्वर्गदूतीय कथावाचक-ढाँचे का संबंध
  choice: “आओ, हम नीचे उतरें” और “हमसे कहा” दोनों को यथावत रखा गया
  alternative: बहुवचन को परमेश्वर का आत्म-संबोधन मानकर कथावाचक स्वर्गदूतों से उसका संबंध अस्पष्ट करना
  rationale: जुबिलीज़ में यह वचन स्वर्गदूतीय प्रथम-पुरुष प्रकाशन के ढाँचे में आता है। अनुवाद बहुवचन की वास्तविक अस्पष्टता और कथात्मक तनाव को बिना धर्मसैद्धान्तिक व्याख्या थोपे सुरक्षित रखता है।
- issue: भाषाओं की गड़बड़ी और लोगों का बिखराव
  choice: बिखराव को अगले परिणाम के रूप में “तब वे… तितर-बितर हो जाएँगे” कहा गया
  alternative: परमेश्वर को सीधे कर्ता बनाकर “हम उन्हें तितर-बितर कर देंगे” कहना
  rationale: उपलब्ध गीइज़ पाठ में इस खंड का व्याकरण परिणामसूचक/तृतीय-पुरुष रूप में है; इसलिए अनुवाद ने उससे अधिक प्रत्यक्ष दैवी कर्तृत्व नहीं जोड़ा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जाति’ का प्रयोग यहाँ ‘जनसमुदाय/लोग’ के अर्थ में है। प्रत्यक्ष वचन की लय बनाए रखते हुए गीइज़ पाठ के सामूहिक बहुवचन और न्याय-दिवस तक साझा उद्देश्य न रहने की कथनात्मक विशेषता सुरक्षित रखी गई है।
