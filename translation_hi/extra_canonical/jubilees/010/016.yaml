lexical_decisions:
- source_word: ተቀብረ
  choice: उसे दफ़नाया गया
  rationale: गीज़ के कर्मवाच्य क्रियारूप का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: ውስተ፡ ሉባር፡ ደብር
  choice: लूबार पर्वत पर
  rationale: स्थानसूचक ውስተ का प्रसंगानुकूल हिन्दी रूप ‘पर’ है; ሉባር को व्यक्तिवाचक स्थाननाम के रूप में लिप्यंतरित किया गया और ደብር का अर्थ ‘पर्वत’ रखा गया।
- source_word: በምድረ፡ አራራት
  choice: अरारात देश के
  rationale: ‘अरारात की भूमि में’ के अर्थ को सहज हिन्दी में व्यक्त करता है और भौगोलिक संबंध बनाए रखता है।
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: उसने अपने जीवन में नौ सौ पचास वर्ष पूरे किए
  rationale: संख्या, पूर्णता-सूचक क्रिया और ‘अपने जीवन में’—तीनों स्रोत-तत्वों को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया।
