  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत के निकट प्रस्तुति। वाक्य के अंत का अपूर्ण संक्रमण ‘और देखो,’ जानबूझकर सुरक्षित रखा गया है, क्योंकि मूल पाठ भी अगले कथन की ओर इसी प्रकार बढ़ता है।
