translation:
  language: hi
  text: और प्रभु ने मीनार पर एक प्रचण्ड वायु भेजी और उसे धरती पर गिरा दिया; और देखो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: यह ईश्वर के लिए प्रयुक्त मानक उपाधि है और हिन्दी बाइबिलीय शैली में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ነፋሰ፡ ዐቢየ
  choice: एक प्रचण्ड वायु
  rationale: शाब्दिक अर्थ ‘बड़ी/शक्तिशाली वायु’ है; ‘प्रचण्ड वायु’ उसकी शक्ति और विनाशकारी प्रभाव दोनों को सुरक्षित रखता है।
- source_word: ማኅፈድ
  choice: मीनार
  rationale: बाबेल की कथा के प्रसंग और नवीन स्रोत-समीक्षा के अनुसार यहाँ आशय मीनार से है, न कि भंडारघर से।
- source_word: ውስተ
  choice: पर
  rationale: इस संदर्भ में वायु की दिशा और मीनार के विरुद्ध उसकी क्रिया व्यक्त करने के लिए ‘पर’ स्वाभाविक हिन्दी है।
- source_word: ወገፍታአ
  choice: और उसे ... गिरा दिया
  rationale: क्रिया मीनार को उलटकर/ढहाकर भूमि पर गिराने का भाव देती है; स्त्रीलिंग सर्वनाम ‘उसे’ का संबंध ‘मीनार’ से स्पष्ट है।
- source_word: ወናሁ
  choice: और देखो,
  rationale: स्रोत का दृश्य-परिवर्तन सूचक पद सुरक्षित रखा गया है; अंतिम अल्पविराम अगले वाक्यांश से इसके जुड़ाव को दर्शाता है।
