base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/030.yaml
  text: 'And Ham his father, and Cush and Mizraim his brothers, said to him: ''Because you have settled in a land which is not yours, and which did not fall to you by lot, do not do so; for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'''
translation:
  language: hi
  text: और उसके पिता हाम और उसके भाइयों कूश तथा मिस्रैम ने उससे कहा, “तू ऐसी भूमि में बस गया है जो तेरी नहीं है और जो चिट्ठी डालने से तेरे हिस्से में नहीं पड़ी थी। ऐसा मत कर; क्योंकि यदि तू ऐसा करेगा, तो तू और तेरे पुत्र उस भूमि में गिर पड़ोगे और विद्रोह के कारण शापित होगे। क्योंकि तू विद्रोह करके बसा है, और विद्रोह के कारण तेरे पुत्र गिर पड़ेंगे, और तू सदा के लिए जड़ से उखाड़ दिया जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደርከ
  choice: तू ... बस गया है
  rationale: क्रिया का मूल भाव किसी स्थान में रहने या बसने का है; प्रसंग में भूमि पर अनुचित अधिकार जमाकर बसना अभिप्रेत है।
- source_word: በዕፁ
  choice: चिट्ठी डालकर ... भाग में
  rationale: शाब्दिक अर्थ ‘लकड़ी/चिट्ठी के द्वारा’ है और यहाँ भूमि के चिट्ठी द्वारा बाँटे जाने का संकेत है; आधुनिक हिन्दी में अर्थ स्पष्ट करने के लिए यह मुहावरा चुना गया।
- source_word: በሀከከ
  choice: विद्रोह के कारण
  rationale: यह शब्द विरोध, विद्रोह या उद्दंड अवज्ञा का भाव रखता है; ‘विद्रोह’ कारणगत और नैतिक तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ትወድቁ
  choice: गिर पड़ोगे / गिर पड़ेंगे
  rationale: स्रोत में ‘गिरना’ ही है। इसका आशय मृत्यु, पराजय या पतन हो सकता है, इसलिए अस्पष्टता बनाए रखी गई है।
theological_decisions:
- issue: भूमि का चिट्ठी द्वारा आवंटन
  choice: ‘चिट्ठी डालकर तेरे भाग में नहीं आई’
  alternative: ‘तेरे हिस्से में नहीं पड़ी’
  rationale: चुना हुआ रूप आवंटन की विधि और वैध हिस्से—दोनों को व्यक्त करता है, पर किसी बाद की विशिष्ट धर्मशास्त्रीय व्यवस्था को पाठ में नहीं जोड़ता।
- issue: ‘गिरने’ का आशय
  choice: शाब्दिक ‘गिर पड़ना’ बनाए रखा
  alternative: ‘नष्ट हो जाना’ या ‘मारा जाना’
  rationale: मूल अभिव्यक्ति संभावित शारीरिक मृत्यु, पराजय और व्यापक पतन के बीच स्पष्ट चुनाव नहीं करती; अनुवाद ने इस तनाव को सुरक्षित रखा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष चेतावनी का स्वर रखा गया है। एकवचन ‘तू’ प्राचीन पारिवारिक संबोधन और कठोर फटकार के अनुकूल है। उपलब्ध गीइज़ अंश आरम्भ और अंत में पद-सीमा के कारण कटा हुआ है; पूर्ण वाक्य-क्रम के लिए प्रस्तुत मूल-पाठ के साथ समीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानी से उपयोग किया गया, जबकि मुख्य शब्दावली गीइज़ के आधार पर रखी गई है।
