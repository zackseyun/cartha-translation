  text: And the Lord went down, and we went down with him, to see the city and the tower that the sons of men had built. And he confused all their tongues, and they no longer heard one another’s speech, and they ceased building the city and the tower. Therefore the whole land of Shinar was called Babel, because there the Lord confused all the tongues of the sons of men, and from there they were scattered into their cities, each according to his tongue and according to his nation.
translation:
  language: hi
  text: तब प्रभु नीचे उतरा, और हम भी उसके साथ नीचे उतरे, ताकि उस नगर और मीनार को देखें जिन्हें मनुष्यों ने बनाया था। उसने उनकी सभी भाषाओं को उलझा दिया, और वे फिर एक-दूसरे की बात समझ न सके; उन्होंने नगर और मीनार बनाना छोड़ दिया। इसी कारण शिनार का सारा देश बाबेल[a] कहलाया, क्योंकि वहीं प्रभु ने मनुष्यों की सभी भाषाओं को उलझा दिया था। फिर वे वहाँ से अपने-अपने प्रदेशों में तितर-बितर हो गए, हर एक अपनी भाषा और अपने जनसमूह के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बाबेल” नाम को यहाँ भाषाओं के उलझा दिए जाने से जोड़ा गया है।
    reason: मूल में नामकरण और भाषाओं के भ्रम के बीच निहित शब्द-संबंध हिन्दी में स्वतः स्पष्ट नहीं है।
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ में प्रयुक्त दैवी उपाधि का स्वाभाविक और गरिमापूर्ण हिन्दी प्रतिरूप।
- source_word: ሀገረ፡ ወማኅፈደ
  choice: नगर और मीनार
  rationale: संदर्भ बाबेल के नगर और ऊँची संरचना का है; ‘मीनार’ सामान्य पाठक के लिए स्वाभाविक है, यद्यपि दूसरे पद का मूल अर्थ व्यापक रूप से दुर्ग/ऊँची इमारत भी हो सकता है।
- source_word: ሰወጠ / ሥጠ ልሳናቲሆሙ
  choice: उनकी सभी भाषाओं को उलझा दिया
  rationale: भाषाओं के परस्पर अबोधगम्य हो जाने का आशय स्पष्ट करता है और बाबेल के नामकरण से जुड़े शब्द-खेल को यथासंभव बनाए रखता है।
- source_word: አህጉሪሆሙ
  choice: अलग-अलग देशों में
  rationale: गीज़ बहुवचन का अर्थ प्रदेशों/देशों की ओर संकेत करता है; इसलिए अंग्रेज़ी परामर्श-पाठ के ‘cities’ के बजाय स्रोत-साक्ष्य के निकट ‘देशों’ चुना गया।
- source_word: በበ፡ ልሳናቲሆሙ፡ ወበበ፡ ሕዝቢሆሙ
  choice: अपनी-अपनी भाषा और जाति के अनुसार
  rationale: वितरण के भाषाई और जनसमुदाय-संबंधी दोनों आधारों को सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु के साथ नीचे उतरने वाले बहुवचन वक्ता
  choice: “हम भी उसके साथ नीचे उतरे” को ज्यों का त्यों रखा गया
  alternative: बहुवचन को हटाकर केवल प्रभु के उतरने का उल्लेख करना
  rationale: मूल पाठ का प्रथम-पुरुष बहुवचन वास्तविक साहित्यिक और धर्मवैचारिक तनाव रखता है; उसकी पहचान या प्रकृति को व्याख्यात्मक रूप से निश्चित नहीं किया गया।
- issue: ‘मनुष्यों के पुत्र’ का पदबंध
  choice: मनुष्यों
  alternative: मनुष्यों के पुत्र
  rationale: यह सामी पदबंध सामान्यतः मानवजाति को दर्शाता है; आधुनिक हिन्दी में ‘मनुष्यों’ अर्थ को स्वाभाविक रूप से व्यक्त करता है और कोई अतिरिक्त वंशगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक गद्य अपनाया गया है। दैवी बहुवचन को बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है, और स्रोत के ‘देशों/प्रदेशों’ को अंग्रेज़ी परामर्श-पाठ के ‘नगरों’ पर प्राथमिकता दी गई है।
