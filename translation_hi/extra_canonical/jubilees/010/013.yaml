base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/013.yaml
  text: And we told Noah all their medicines, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies, and the spirits were restrained.
translation:
  language: hi
  text: और हमने नूह को उनकी सभी औषधियाँ बताईं, ताकि वे पृथ्वी के पौधों से चंगे हो सकें। और नूह ने जो कुछ हमने उसे सिखाया था, वह सब—हर प्रकार के उपचार—एक पुस्तक में लिख लिया; और आत्माओं को रोक दिया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስሕተትሙ
  choice: उनकी सारी औषधियों के विषय में
  rationale: यह रूप औषधि/उपचार के अर्थ को व्यक्त करता है; प्रसंग में दुष्टात्माओं से उत्पन्न रोगों के उपचार बताए जा रहे हैं। सर्वनाम की वास्तविक संदर्भगत अस्पष्टता को ‘उनकी’ से बनाए रखा गया है।
- source_word: ዕፀወ፡ ምድር
  choice: पृथ्वी के पौधों
  rationale: शाब्दिक अर्थ ‘पृथ्वी की वनस्पतियाँ/पौधे’ है। ‘पौधे’ आधुनिक सामान्य हिन्दी में सहज है और औषधीय उपयोग का भाव प्रसंग से स्पष्ट होता है।
- source_word: ትዝምደ፡ ፈውሳት
  choice: हर प्रकार के उपचार
  rationale: वाक्यांश उपचारों की जातियों या प्रकारों को सूचित करता है; हिन्दी में यह स्वाभाविक और अर्थनिष्ठ अभिव्यक्ति है।
- source_word: ወተዐጸዉ፡ መናፍስት
  choice: और आत्माओं को रोक दिया गया
  rationale: स्रोत केवल ‘आत्माओं’ और उनके रोके/बाँधे जाने की बात करता है। इसमें ‘दुष्ट’ या ‘नूह के पुत्रों का पीछा करने से’ जोड़ना स्रोत से परे होगा।
theological_decisions:
- issue: आत्माओं का नैतिक विशेषण
  choice: आत्माओं
  alternative: दुष्टात्माओं
  rationale: इस पद के गीइज़ पाठ में ‘दुष्ट’ विशेषण नहीं है। व्यापक प्रसंग ऐसा संकेत दे सकता है, पर अनुवाद में अनुपस्थित विशेषण नहीं जोड़ा गया।
- issue: आत्माओं को रोके जाने का कर्ता और सीमा
  choice: 'कर्मवाच्य: ‘आत्माओं को रोक दिया गया’'
  alternative: ‘उसने आत्माओं को रोक दिया’ अथवा ‘उन्हें नूह के पुत्रों का पीछा करने से रोका गया’
  rationale: स्रोत में क्रिया कर्मवाच्य है और यह नहीं बताता कि किसने रोका या किस विशेष गतिविधि से रोका। इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘चंगे हो सकें’ बाइबिलीय हिन्दी में परिचित है, जबकि ‘पृथ्वी के पौधे’ और ‘हर प्रकार के उपचार’ सामान्य पाठक के लिए स्पष्ट हैं। मूल पाठ में जहाँ कर्ता या संदर्भ अस्पष्ट है, वहाँ स्पष्टीकरण जोड़कर उसे नहीं सुलझाया गया।
