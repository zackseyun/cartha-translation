base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/021.yaml
  text: And they built it for forty-three years. Its breadth was 204 cubits[21], and the height of a brick was one third of one cubit; and its height amounted to 5,433 cubits and 2 palms, and twelve stades.
translation:
  language: hi
  text: और उन्होंने उसे तैंतालीस वर्ष तक बनाया। उसकी चौड़ाई 204 हाथ[a] थी, और एक ईंट की ऊँचाई एक हाथ का एक-तिहाई थी। उसकी ऊँचाई 5,433 हाथ, दो हथेलियाँ और बारह स्टेडिया थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मीनार के ये माप इथियोपियाई पाठ में अत्यंत कठिन हैं; कुछ अंक या इकाइयाँ पाठ-संचरण में बिगड़ गई हो सकती हैं। यहाँ प्राप्त पाठ के आँकड़ों को यथासंभव अक्षरशः रखा गया है, पर ठीक-ठीक आयाम अनिश्चित हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ዓመተ
  choice: वर्ष
  rationale: निर्माण की अवधि के लिए सामान्य और सटीक आधुनिक हिन्दी शब्द।
- source_word: ኑኅ
  choice: हाथ
  rationale: यहाँ प्राचीन लंबाई की इकाई ‘क्यूबिट’ अभिप्रेत है; हिन्दी बाइबलीय प्रयोग में ‘हाथ’ स्वाभाविक और सुबोध है।
- source_word: ስዝር
  choice: हथेली
  rationale: यह छोटी लंबाई की इकाई ‘पाम’ को दर्शाता है; ‘हथेली’ उसके शारीरिक आधार को सहज रूप से व्यक्त करती है।
- source_word: ምዕራፍ
  choice: स्टेडिया
  rationale: स्रोत में आई प्राचीन दूरी की इकाई को आधुनिक माप में बदलने के बजाय लिप्यंतरित किया गया है, ताकि अनिश्चित मापों के बीच मूल इकाई सुरक्षित रहे।
