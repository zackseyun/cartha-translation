  text: Lebanon, from Hamath as far as the entrance of Egypt, he and his descendants to this day. And because of this,
translation:
  language: hi
  text: लबानोन—हमात से लेकर मिस्र के प्रवेश-स्थान तक—आज के दिन तक उसी और उसके वंशजों का है। और इसी कारण,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊባኖስ
  choice: लबानोन
  rationale: स्थाननाम का निकट लिप्यंतरण; आधुनिक हिन्दी बाइबलीय प्रयोग में पहचान योग्य।
- source_word: እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ
  choice: हमात से लेकर मिस्र के प्रवेश-स्थान तक
  rationale: सीमा-विस्तार को औपचारिक रूप से सुरक्षित रखा; ምብዋአ का अर्थ प्रवेश या प्रवेश-स्थान है।
- source_word: ውእቱ፡ ወውሉዱ
  choice: उसका और उसके वंशजों का
  rationale: पुल्लिंग सर्वनाम और संबंधसूचक प्रत्यय कनान की ओर संकेत करते हैं; भूमि को वंशज देने वाला अर्थ नहीं अपनाया।
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: आज के दिन तक
  rationale: मूल के कालगत मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ወበእንተዝ
  choice: और इसी कारण,
  rationale: अगले कथन से जुड़ने वाले अधूरे संयोजक को मूल की तरह बनाए रखा।
theological_decisions:
- issue: ውእቱ और ወውሉዱ का संदर्भ
  choice: 'कनान को सूचित करने वाला पुल्लिंग स्वामित्व: ‘उसका और उसके वंशजों का’'
  alternative: ‘वह और उसके वंशज’ अथवा भूमि के लिए ‘उसके और उसके वंशज’
  rationale: गीज़ का पुल्लिंग सर्वनाम और ‘उसके वंशज’ वाला रूप व्यक्ति कनान की ओर संकेत करता है। हिन्दी वाक्य में भूभाग पर अधिकार का संबंध स्पष्ट करने के लिए स्वामित्व-वाचक रचना उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्थाननामों और सीमावर्णन में गरिमापूर्ण बाइबलीय शैली। पद के अंत का अपूर्ण संयोजक जानबूझकर सुरक्षित रखा गया है, क्योंकि स्रोत भी अगले कथन में जारी रहता है।
