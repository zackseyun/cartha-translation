  text: And let them not rule over the spirits of the living, for you alone know their judgment; and do not let them have power over the sons of the righteous from now and forevermore.”
translation:
  language: hi
  text: और उन्हें जीवितों की आत्माओं पर शासन करने न दे, क्योंकि केवल तू ही उनका न्याय जानता है; और अब से लेकर सदा तक उन्हें धर्मियों के पुत्रों पर अधिकार न करने दे।
  philosophy: optimal-equivalence
lexical_decisions:
