base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/032.yaml
  text: Cursed are you, and cursed shall you be beyond all the sons of Noah, by the curse with which we bound ourselves by an oath before the holy judge and before Noah our father.”
translation:
  language: hi
  text: “तू शापित है, और नूह के सभी पुत्रों से बढ़कर शापित रहेगा—उस शाप के द्वारा, जिसके द्वारा हमने शपथ खाकर अपने आपको बाँधा था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርጉም፡ አንተ
  choice: तू शापित है
  rationale: प्रत्यक्ष संबोधन और स्रोत की संक्षिप्त, न्याय-घोषणा जैसी शैली को बनाए रखता है।
- source_word: ወርጉመ፡ ትከውን
  choice: और ... शापित रहेगा
  rationale: भविष्यकालीन निरंतर परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: እምኵሎሙ፡ ውሉደ፡ ኖኅ
  choice: नूह के सभी पुत्रों से बढ़कर
  rationale: እም के तुलनात्मक अर्थ और ‘नूह के सभी पुत्रों’ के व्यापक संदर्भ को सुरक्षित रखता है।
- source_word: በመርገም፡ እንተ፡ ተማራዕነ፡ በመሐላ
  choice: उस शाप के अनुसार, जिसे मानने की हमने शपथ खाई थी
  rationale: शाप और सामूहिक शपथ के संबंध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है, बिना स्रोत से अनुपस्थित विवरण जोड़े।
theological_decisions:
- issue: शाप की तुलनात्मक तीव्रता
  choice: नूह के सभी पुत्रों से बढ़कर शापित
  alternative: नूह के सभी पुत्रों के बीच शापित
  rationale: स्रोत का እምኵሎሙ तुलनात्मक अर्थ दे सकता है; इसलिए अंग्रेज़ी परामर्श-पाठ के ‘beyond all’ के अनुरूप तुलना को खुला और स्पष्ट रखा गया है।
- issue: अंग्रेज़ी परामर्श-पाठ में ‘पवित्र न्यायी’ और ‘हमारे पिता नूह’ का उल्लेख
  choice: इन पदबंधों को मुख्य पाठ में नहीं जोड़ा
  alternative: पवित्र न्यायी और हमारे पिता नूह के सामने
  rationale: प्रस्तुत गीइज़ स्रोत में ये पदबंध नहीं हैं। मूल-भाषा साक्ष्य को प्राथमिकता देते हुए स्रोत से अनुपस्थित धार्मिक विवरण को आयात नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक घोषणा के अनुकूल रखी गई है। प्रस्तुत गीइज़ अंश के आरम्भिक शब्द ‘शेम के निवास/भाग में, क्योंकि वह चिट्ठी से शेम और उसकी संतान को मिला’ संदर्भतः पिछले वाक्य का अंश प्रतीत होते हैं और दिए गए अंग्रेज़ी POB पद-खंड से बाहर हैं; इसलिए इस पद के मुख्य पाठ में उन्हें सम्मिलित नहीं किया गया।
