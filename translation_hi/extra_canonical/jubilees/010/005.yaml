  yaml_path: translation/extra_canonical/jubilees/010/005.yaml
  text: But bless me and my sons, that we may increase and multiply and fill the earth.
translation:
  language: hi
  text: पर मुझ पर और मेरे पुत्रों पर आशीष दे, ताकि हमारी संख्या बढ़े और हम पृथ्वी को भर दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bless
  choice: आशीष दे
  rationale: प्रार्थना के संदर्भ में स्वाभाविक, गरिमापूर्ण और प्रचलित बाइबलीय अभिव्यक्ति।
