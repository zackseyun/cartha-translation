base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/020.yaml
  text: And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.
translation:
  language: hi
  text: और उन्होंने निर्माण करना शुरू किया। चौथे सप्ताह में उन्होंने आग में ईंटें पकाईं; ईंटें उनके लिए पत्थर का काम करती थीं, और जिस गारे से वे लेप करते थे, वह डामर था, जो समुद्र और शिनार देश के जल-स्रोतों से निकलता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሕንጹ
  choice: निर्माण करना
  rationale: क्रिया का सामान्य और स्वाभाविक हिन्दी अर्थ; प्रसंग में नगर अथवा मीनार जैसी वस्तु को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ንንፈሱ፡ በእሳት
  choice: आग में ईंटें पकाईं
  rationale: शाब्दिक रूप से आग द्वारा ईंट बनाने की प्रक्रिया को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ከመ፡ እብን
  choice: पत्थर का काम करती थीं
  rationale: ईंटों के पत्थर के स्थान पर प्रयुक्त होने का कार्यात्मक संबंध स्पष्ट करता है।
- source_word: አስፋሌጦስ
  choice: डामर
  rationale: निर्माण में प्रयुक्त प्राकृतिक asphalt/bitumen के लिए सामान्य हिन्दी शब्द।
- source_word: አንቅዐተ
  choice: जल-स्रोतों
  rationale: स्रोत-पाठ के springs/fountains के व्यापक अर्थ को बनाए रखता है और केवल आधुनिक अर्थ वाले झरनों तक सीमित नहीं करता।
