  yaml_path: translation/extra_canonical/jubilees/010/027.yaml
  text: And it was between Asshur and Babylon, in the land of Shinar; and he called its name Overthrow, in the fourth week, in the first year at its beginning, in the thirty-fourth jubilee, they were dispersed.
translation:
  language: hi
  text: वह शिनार देश में अश्शूर और बाबिल के बीच था। उसने उसका नाम “पतन” रखा। चौंतीसवीं जुबली के चौथे सप्ताह के पहले वर्ष के आरम्भ में वे तितर-बितर हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቀት (däqät)
  choice: पतन
  rationale: यह शब्द गिरने, नाश या उलट दिए जाने का भाव व्यक्त करता है और यहाँ स्थान के अर्थपूर्ण नाम के रूप में आया है; इसलिए केवल लिप्यंतरण के बजाय संक्षिप्त अर्थानुवाद चुना गया।
- source_word: ሰናአር (Senaʾar)
  choice: शिनार
  rationale: यह बाइबलीय भू-नाम का प्रचलित हिन्दी रूप है।
- source_word: አሱር / ባቢሎን
  choice: अश्शूर / बाबिल
  rationale: इन प्राचीन भू-नामों के परिचित हिन्दी रूप अपनाए गए हैं।
- source_word: ተዘርዉ (täzärräwu)
  choice: वे तितर-बितर हो गए
  rationale: रूप सामूहिक बिखराव बताता है; यह अनुवाद किसी ऐसे कर्ता को स्पष्ट रूप से नहीं जोड़ता जिसका स्रोत में उल्लेख नहीं है।
theological_decisions:
- issue: बिखराव का कर्ता
  choice: 'कर्ता को अनिर्दिष्ट रखा गया: “वे तितर-बितर हो गए”'
  alternative: “वे तितर-बितर कर दिए गए” या परमेश्वर को स्पष्ट कर्ता बनाना
  rationale: गीज़ पाठ इस वाक्य में बिखराव कराने वाले का नाम नहीं लेता; इसलिए निहित दैवी कर्तृत्व को व्याख्या के रूप में नहीं जोड़ा गया।
- issue: कालगणना में ወአርባዕቱ
  choice: चौंतीसवीं जुबली
  alternative: सैंतीसवीं जुबली
  rationale: मूल पाठ का अंकांश “और चार” है, अतः संख्या 34 बनती है, 37 नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। स्रोत की खंडित वाक्य-संरचना को अर्थ-संबंध स्पष्ट रखने के लिए तीन वाक्यों में बाँटा गया है। “उसके आरम्भ में” की संभावित अस्पष्टता को कालक्रम की स्वाभाविक हिन्दी रचना—“चौथे सप्ताह के पहले वर्ष के आरम्भ में”—से व्यक्त किया गया है।
