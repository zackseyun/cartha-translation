  yaml_path: translation/extra_canonical/jubilees/010/017.yaml
  text: nineteen jubilees and two weeks of years and five years. And during his life on the earth he surpassed the sons of men[17], except Enoch, because of the righteousness in which he was perfect. For Enoch was appointed as a testimony for the generations of the world, to recount all the deeds of generation after generation until the day of judgment.
translation:
  language: hi
  text: उन्नीस जुबली, दो सप्ताह और पाँच वर्ष। पृथ्वी पर अपने जीवनकाल में वह मनुष्यों में सबसे अधिक आयु तक जीवित रहा[a]—हनोक को छोड़कर—क्योंकि वह उस धार्मिकता में सिद्ध था। हनोक को संसार की पीढ़ियों के लिए गवाही के रूप में नियुक्त किया गया था, ताकि वह न्याय के दिन तक हर पीढ़ी के सभी कामों का वर्णन करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हनोक से संबंधित यह वाक्य पाठ की दृष्टि से सघन है। यहाँ इसका अर्थ यह समझा गया है कि नूह आयु में अन्य सभी मनुष्यों से बढ़कर था, केवल हनोक को छोड़कर। इसे इस तरह भी समझा जा सकता है कि अपवाद धार्मिकता में सिद्ध होने से संबंधित है।
    reason: alternative_reading
lexical_decisions:
- source_word: እዮቤልው
  choice: जुबली
  rationale: यह ग्रंथ की काल-गणना की तकनीकी इकाई है; इसे अर्थ-विस्तार किए बिना लिप्यंतरित किया गया है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: संदर्भ में वर्षों का सात-वर्षीय समूह अभिप्रेत है; निकटवर्ती ‘वर्ष’ इसे स्पष्ट करता है।
- source_word: አፈድፈደ፡ ሐዩዎ
  choice: सबसे अधिक आयु तक जीवित रहा
  rationale: क्रिया-समूह को तुलना और जीवन-अवधि के अर्थ में समझा गया है, जैसा वाक्य में हनोक के अपवाद से संकेत मिलता है; पाठ की घनी बनावट को पादटिप्पणी में स्वीकार किया गया है।
- source_word: ውሉደ፡ ሰብእ
  choice: मनुष्यों
  rationale: शाब्दिक ‘मनुष्यों की संतान’ आधुनिक हिन्दी में अनावश्यक रूप से कृत्रिम होता; सामूहिक अर्थ स्वाभाविक रूप से दिया गया है।
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: नैतिक और ईश्वर-संबंधी दोनों आयामों वाला पारंपरिक, किंतु सामान्यतः समझ में आने वाला समतुल्य।
- source_word: ፍጹመ
  choice: सिद्ध
  rationale: पूर्णता/निर्दोषता के दावे को कमजोर किए बिना स्रोत की धार्मिक भाषा बनाए रखता है।
- source_word: ስምዕ
  choice: गवाही
  rationale: गीज़ शब्द का मूल अर्थ ‘गवाही/साक्ष्य’ है; ‘चिह्न’ की अपेक्षा यही अधिक सटीक है।
- source_word: ይንገር
  choice: वर्णन करे
  rationale: ‘बताए/सुनाए’ के भाव को पीढ़ियों के कर्मों के अभिलेखी विवरण के संदर्भ में स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: हनोक के अपवाद और नूह की श्रेष्ठता का संबंध
  choice: अपवाद को आयु की तुलना से जोड़ा गया
  alternative: अपवाद को धार्मिकता में सिद्ध होने से जोड़ना
  rationale: वाक्य पाठ की दृष्टि से घना और कुछ हद तक संदिग्ध है। अंग्रेज़ी परामर्श-पाठ तथा संदर्भ आयु की तुलना का समर्थन करते हैं, पर वैकल्पिक व्याकरणिक संबंध को पादटिप्पणी में खुला रखा गया है।
- issue: हनोक की भूमिका
  choice: ‘संसार की पीढ़ियों के लिए गवाही’
  alternative: ‘संसार की पीढ़ियों के लिए चिह्न’
  rationale: ስምዕ का प्रत्यक्ष अर्थ गवाही/साक्ष्य है और इससे हनोक की साक्षी-संबंधी भूमिका सुरक्षित रहती है, बिना ‘चिह्न’ का भिन्न अर्थ आरोपित किए।
- issue: न्याय के दिन तक
  choice: मुख्य पाठ में रखा गया
  alternative: उपलब्ध उद्धृत गीज़ अंश के अंत पर वाक्य रोक देना
  rationale: परामर्श-पाठ और पद की स्वीकृत पाठ-परंपरा इस काल-सीमा को सम्मिलित करती है; उपलब्ध गीज़ उद्धरण प्रत्यक्षतः अधूरा प्रतीत होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काल-गणना के तकनीकी शब्द ‘जुबली’ को बनाए रखा गया है। ‘गवाही’ को ‘चिह्न’ पर प्राथमिकता दी गई है। आरंभिक खंड की अपूर्ण-वाक्य जैसी शैली स्रोत के काल-गणनात्मक प्रवाह को सुरक्षित रखने के लिए जानबूझकर रखी गई है।
