translation:
  language: hi
  text: शिनार देश से।[a] फिर हाम और उसके पुत्र उस देश में गए, जो उसके लिए बाँटा गया था और जिसे उसने प्राप्त किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद पिछले वाक्य के अंतिम शब्दों से आरम्भ होता है; इसलिए आरम्भिक वाक्यांश अपने आप में अधूरा दिखाई देता है।
    reason: segmentation_note
lexical_decisions:
- source_word: ሲናአር
  choice: शिनार
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: አሕዝት ሎቱ
  choice: उसके लिए बाँटा गया था
  rationale: यह पदबंध भूमि को हाम के अधिकार में दिए जाने का भाव व्यक्त करता है; संदर्भ में यह उसके वैध हिस्से की ओर संकेत करता है, न कि अनधिकृत कब्ज़े की ओर।
- source_word: ዘረከበ
  choice: जिसे उसने प्राप्त किया था
  rationale: रूप का 'पाना/प्राप्त करना' अर्थ स्पष्ट रखा गया है और इसे पिछले पदबंध में विलीन नहीं किया गया।
- source_word: ወሖሩ
  choice: फिर ... गए
  rationale: संयोजक और क्रिया को स्वाभाविक हिन्दी कथात्मक क्रम में प्रस्तुत किया गया है।
theological_decisions:
- issue: हाम द्वारा भूमि लेने का स्वरूप
  choice: वैध रूप से बाँटी गई और प्राप्त भूमि
  alternative: उसने अपने लिए भूमि छीन ली थी
  rationale: गीज़ पाठ के causative possession/allotment भाव और ዘረከበ ('प्राप्त किया') को देखते हुए 'छीन ली' अनधिकृत कब्ज़े का ऐसा अर्थ जोड़ता है जो इस पद में आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। पद-विभाजन की कठिनाई को मुख्य पाठ में बदलने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
