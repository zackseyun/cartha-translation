lexical_decisions:
- source_word: ወወሀበ፡ ኵሎ፡ ዘጸሐፈ
  choice: और उसने जो कुछ लिखा था, वह सब … को दे दिया
  rationale: यह स्रोत के ‘और उसने वह सब दिया जो उसने लिखा था’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ለሴም፡ ወልዱ
  choice: अपने पुत्र शेम को
  rationale: संबंध और अप्रत्यक्ष कर्म दोनों को संक्षिप्त तथा स्पष्ट रूप से रखा गया है।
- source_word: ዘይፈህቅ
  choice: जिससे वह … प्रेम करता था
  rationale: स्रोत की संबंधवाचक संरचना को बनाए रखा गया है; इसे कारणवाचक ‘क्योंकि’ में नहीं बदला गया।
theological_decisions:
- issue: शेम के प्रति प्रेम की तुलनात्मक अभिव्यक्ति
  choice: अपने सभी पुत्रों से अधिक प्रेम करता था
  alternative: बहुत अधिक प्रेम करता था
  rationale: परामर्श-पाठ में सुरक्षित तुलनात्मक अर्थ को रखा गया है और अनावश्यक ‘बहुत’ नहीं जोड़ा गया। यह पारिवारिक प्राथमिकता को व्यक्त करता है, किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को नहीं।
