  yaml_path: translation/extra_canonical/jubilees/010/035.yaml
  text: That land was named Canaan. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea[35], and it did not please him, and he asked from Elam and Asshur and Arpachshad, the brothers of his wife, a portion, and he dwelt there.
translation:
  language: hi
  text: उस भूमि का नाम कनान पड़ा। फिर यापेत और उसके पुत्र समुद्र की ओर गए और अपने हिस्से की भूमि में बस गए। मादै ने समुद्र के पास की भूमि देखी, पर वह उसे अच्छी नहीं लगी। तब उसने अपनी पत्नी के भाइयों—एलाम, अश्शूर और अर्पक्षद—से भूमि का एक हिस्सा माँगा[a] और वहीं बस गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ में इस वाक्य की रचना कुछ असहज है। यहाँ एलाम, अश्शूर और अर्पक्षद को मादै की पत्नी के भाई और उसी भूमि के हिस्से के दाता समझा गया है; ‘भूमि का एक हिस्सा’ पिछले वाक्य के संदर्भ से स्पष्ट किया गया है।
    reason: segmentation_note
