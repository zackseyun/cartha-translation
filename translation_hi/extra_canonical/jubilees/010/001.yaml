lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: न्याय का स्थान
  rationale: यह स्रोत में संज्ञा-पदबंध मात्र है; इसमें ‘स्थापित किया गया’ जैसी कोई क्रिया जोड़ना उचित नहीं।
- source_word: ወለአሐዱ፡ እምኔነ
  choice: फिर हममें से एक
  rationale: शाब्दिक अर्थ ‘और हममें से एक’ है; हिन्दी में कथानक के स्वाभाविक प्रवाह के लिए ‘फिर’ चुना गया है।
- source_word: ንምሀር፡ ለኖኅ
  choice: हम नूह को ... सिखाएँ
  rationale: प्रथम पुरुष बहुवचन प्रेरणार्थक भाव को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ኵሎ፡ ፈውሶሙ
  choice: उनके सभी उपचार
  rationale: ፈውስ उपचार/आरोग्य-उपाय का अर्थ देता है; सर्वनाम का संदर्भ इस खंड में स्पष्ट नहीं, इसलिए ‘उनके’ की अस्पष्टता सुरक्षित रखी गई है।
- source_word: እስመ
  choice: क्योंकि—
  rationale: स्रोत खंड इसी कारणसूचक संयोजक पर अपूर्ण समाप्त होता है; डैश आगे जारी रहने का संकेत देता है, बिना लुप्त सामग्री गढ़े।
theological_decisions:
- issue: ‘हममें से एक’ की पहचान
  choice: वक्ता-समूह और बोलने वाले की पहचान अनिर्दिष्ट रखी गई
  alternative: उन्हें स्वर्गदूत या किसी विशेष पात्र के रूप में स्पष्ट करना
  rationale: दिए गए स्रोत-खंड में ऐसी पहचान प्रत्यक्ष रूप से नहीं दी गई; उसे जोड़ना व्याख्यात्मक होगा।
- issue: ‘उनके’ का संदर्भ
  choice: सर्वनाम को अस्पष्ट रखा गया
  alternative: संदर्भित व्यक्तियों या आत्माओं का नाम जोड़ना
  rationale: मूल खंड में केवल बहुवचन संबंधसूचक रूप है; निकटवर्ती संदर्भ के बिना उसे विशिष्ट करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। आरंभिक संज्ञा-पदबंध को जानबूझकर पूर्ण वाक्य नहीं बनाया गया, और अंतिम ‘क्योंकि’ के बाद डैश देकर पाठ की अपूर्णता दिखाई गई है।
