  yaml_path: translation/extra_canonical/jubilees/010/036.yaml
  text: And he dwelt in the land of Media, near his wife’s brothers, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media, after Madai their father.
translation:
  language: hi
  text: और वह आज के दिन तक मादी देश में अपनी पत्नी के भाइयों के पास रहता रहा। उसने अपने निवास-स्थान और अपने पुत्रों के निवास-स्थान को उनके पिता मादै के नाम पर मादी नाम दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ሜድቂን
  choice: मादी देश
  rationale: यह भौगोलिक नाम ‘Media’ को आधुनिक हिन्दी बाइबलीय रूप ‘मादी’ में व्यक्त करता है।
- source_word: ቅሩበ፡ ኀበ፡ አኀወ፡ ብእሲቱ
  choice: अपनी पत्नी के भाइयों के पास
  rationale: स्रोत में ‘भाइयों’ बहुवचन है; ‘के पास’ निकटता के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ምገባሪሁ፡ ወምገባረ፡ ውሉዱ
  choice: अपने और अपने पुत्रों के निवास-स्थान
  rationale: दोहराए गए ‘निवास-स्थान’ को हिन्दी में संक्षिप्त किया गया है, जबकि उसके तथा उसके पुत्रों—दोनों का संबंध सुरक्षित है।
- source_word: ማዳይ፡ አቡሆሙ
  choice: उनके पिता मादै
  rationale: व्यक्तिनाम Madai को ‘मादै’ और बहुवचन संबंधसूचक रूप को ‘उनके पिता’ के रूप में रखा गया है।
