  text: In rebellion you have dwelt, and in rebellion your children will fall, and you will be uprooted forever. Do not dwell.
translation:
  language: hi
  text: तुम विद्रोह में[a] रहे हो, और विद्रोह में तुम्हारे बच्चे गिर पड़ेंगे, और तुम सदा के लिए जड़ से उखाड़ दिए जाओगे। निवास मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक पाठ-निर्वचन: “अपने निवास-स्थान में तुम निवास करोगे, और अपने निवास-स्थान में तुम्हारे बच्चे सदा के लिए गिर पड़ेंगे।”'
    reason: यह टिप्पणी दोहराए गए आरंभिक पद के पुराने निवास-संबंधी निर्वचन को सुरक्षित रखती है।
lexical_decisions:
- source_word: በሀከከ
  choice: विद्रोह में
  rationale: समीक्षित गीइज़ पाठ में दोहराया गया पद विद्रोह अथवा राजद्रोह का भाव देता है; दोनों स्थानों पर पुनरावृत्ति बनाए रखी गई है।
- source_word: ኀደርክሙ
  choice: तुमने ... निवास किया है
  rationale: पूर्ण क्रिया के भूतकालिक पक्ष को सुरक्षित रखते हुए स्वाभाविक आधुनिक हिन्दी दी गई है।
- source_word: ደቂቅከ
  choice: तुम्हारी सन्तान
  rationale: शाब्दिक अर्थ 'तुम्हारे पुत्र/बच्चे' है; 'सन्तान' सामूहिक और वंशगत आशय को संक्षेप में व्यक्त करता है।
- source_word: ይወድቁ
  choice: गिर पड़ेगी
  rationale: मूल क्रिया 'गिरना' को सीधे रखा गया है और सामूहिक 'सन्तान' के अनुसार एकवचन क्रिया प्रयुक्त हुई है।
- source_word: ወትሴር
  choice: और तुम ... जड़ से उखाड़ दिए जाओगे
  rationale: यह उखाड़े या मिटाए जाने का बिंब देता है; 'जड़ से उखाड़ दिए जाओगे' उस तीव्रता को बनाए रखता है।
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: स्थायी अवधि का स्वाभाविक हिन्दी रूप।
- source_word: ኢትኅደር
  choice: निवास मत करो
  rationale: निषेधात्मक आज्ञा को सीधे और गरिमापूर्ण रूप में रखा गया है।
theological_decisions:
- issue: በሀከከ का अर्थ
  choice: विद्रोह में
  alternative: अपने निवास में
  rationale: वर्तमान समीक्षित पाठ-साक्ष्य और नवीनतम स्रोत-समीक्षा 'विद्रोह/राजद्रोह' का समर्थन करती है; पुराने निवास-संबंधी पाठांतर को टिप्पणी में सुरक्षित रखा गया है।
- issue: अन्तिम निषेध का निहित स्थान
  choice: वहाँ निवास मत करो
  alternative: निवास मत करो
  rationale: हिन्दी में आदेश को प्रसंग से जोड़ने के लिए 'वहाँ' जोड़ा गया है, पर किसी विशिष्ट स्थान या शेम-संबंधी विवरण को पाठ में नहीं लाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल की समानांतर पुनरावृत्ति और कठोर न्याय-वाणी को बनाए रखा गया है।
