  text: And the chief of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me, I will not be able to exercise the authority of my will over the sons of men. For these are for corruption and for leading astray before my judgment, because the wickedness of the sons of men is great.”
translation:
  language: hi
  text: तब आत्माओं का प्रधान मस्तेमा आया और उसने कहा, “हे प्रभु, हे सृष्टिकर्ता, इनमें से कुछ को मेरे सामने रहने दे। वे मेरी वाणी सुनें और जो कुछ मैं उनसे कहूँ, वह करें; क्योंकि यदि उनमें से कुछ मेरे लिए न छोड़े गए, तो मैं मनुष्यों के पुत्रों पर अपनी इच्छा के अनुसार अधिकार नहीं चला सकूँगा। क्योंकि ये मेरे न्याय के सम्मुख भ्रष्ट करने और भटकाने के लिए हैं, क्योंकि मनुष्यों के पुत्रों की दुष्टता बहुत बढ़ गई है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastema
  choice: मस्तेमा
  rationale: व्यक्तिवाचक नाम को ध्वन्यात्मक रूप में रखा गया है; इसे ‘शैतान’ जैसे किसी अधिक परिचित धार्मिक पद से बदलकर पहचान को संकीर्ण नहीं किया गया।
- source_word: chief of the spirits
  choice: आत्माओं का प्रधान
  rationale: पद और उसके संबंध को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: sons of men
  choice: मनुष्यों के पुत्रों
  rationale: प्राचीन वाक्यांश की औपचारिक संरचना बनाए रखता है और इसे सामान्यीकृत करके केवल ‘मनुष्यों’ नहीं करता।
- source_word: exercise the authority of my will
  choice: अपनी इच्छा के अनुसार अधिकार ... चला सकूँगा
  rationale: ‘इच्छा’ और ‘अधिकार’ दोनों अर्थ-घटकों को रखते हुए हिन्दी में बोधगम्य अभिव्यक्ति देता है।
- source_word: corruption and leading astray
  choice: भ्रष्ट करने और भटकाने
  rationale: दो समानांतर क्रियात्मक भूमिकाओं को अलग-अलग बनाए रखता है।
theological_decisions:
- issue: मस्तेमा की पहचान
  choice: नाम ‘मस्तेमा’ और पद ‘आत्माओं का प्रधान’ दोनों यथावत रखे गए
  alternative: मस्तेमा को सीधे ‘शैतान’ कहना
  rationale: पाठ स्वयं दिए गए रूप में नाम और पद का उपयोग करता है; किसी बाद की धर्मवैचारिक पहचान को अनुवाद में आरोपित नहीं किया गया।
- issue: दुष्ट आत्माओं की भूमिका और मस्तेमा का न्याय
  choice: ‘मेरे न्याय के सामने भ्रष्ट करने और भटकाने के लिए’
  alternative: ‘मेरे न्याय तक भ्रष्ट और भटकाते रहने के लिए’ या ‘मेरे दंड के अधीन’
  rationale: वाक्यांश की वास्तविक अस्पष्टता और असहज धर्मवैचारिक तनाव को बनाए रखा गया है; समय, स्थान या अधीनता का अर्थ चुपचाप निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उपलब्ध गीइज़ अंश संबंधित मूल अभिलेख का है, पर उद्धृत अंश लक्ष्य पद 10:9 से आगे आरंभ होता प्रतीत होता है; इसलिए लक्ष्य पद की शब्दावली के लिए दिए गए परीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानी से सहारा लिया गया है और अस्पष्टताओं को नहीं मिटाया गया।
