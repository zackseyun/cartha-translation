base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/011.yaml
  text: 'He knew that they were not walking in uprightness and were not striving in righteousness. And we acted according to all his word: all the evil ones that were cruel we bound in the place of judgment, and a tenth of them'
translation:
  language: hi
  text: 'वह जानता था कि वे सीधाई से नहीं चलते थे और धार्मिकता में प्रयत्नशील नहीं थे।[a] और हमने उसके हर वचन के अनुसार किया: सभी क्रूर दुष्टों को हमने न्याय के स्थान में बाँध दिया, और उनमें से दसवाँ भाग—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के आरम्भ का इथियोपिक वाक्य कठिन है। अधिक शब्दशः अर्थ संभवतः यह है: “वह जानता था कि वे चलने में दृढ़ नहीं थे और धार्मिकता में संघर्ष नहीं करते थे।” यहाँ संदर्भगत भाव के अनुसार अनुवाद किया गया है।'
    reason: segmentation_note
lexical_decisions:
- source_word: በርቱዕ
  choice: खराई से
  rationale: इस कठिन वाक्यांश में शब्द का मूल भाव ‘दृढ़/सुदृढ़’ है, पर चलने के रूपक के साथ यह नैतिक सीधाई या खराई का संकेत देता है। ‘खराई से चलना’ आधुनिक हिन्दी में स्वाभाविक रहते हुए संदर्भगत अर्थ को व्यक्त करता है।
- source_word: በጽድቅ
  choice: धार्मिकता के लिए
  rationale: ጽድቅ न्याय, धार्मिकता और सही आचरण के अर्थ-क्षेत्र में आता है। ‘धार्मिकता’ यहाँ नैतिक-धार्मिक तनाव को बनाए रखता है।
- source_word: ይትባአሱ
  choice: संघर्ष नहीं करते थे
  rationale: क्रिया में लड़ने या प्रयत्न करने का भाव है। ‘संघर्ष करना’ शारीरिक युद्ध को अनावश्यक रूप से निश्चित किए बिना सक्रिय प्रयास दर्शाता है।
- source_word: መካነ፡ ደይን
  choice: न्याय के स्थान
  rationale: दोनों संज्ञाओं को औपचारिक रूप से सुरक्षित रखा गया है; ‘दण्ड-स्थान’ अर्थ को केवल दण्ड तक सीमित कर देता।
- source_word: ዓሥራተሙ
  choice: उनमें से दसवाँ भाग
  rationale: यह रूप समूह के दसवें हिस्से को दर्शाता है। स्रोत पद इसी अधूरे संयोजन पर समाप्त होता है, इसलिए हिन्दी में भी उसे अगले पद से जोड़े जाने योग्य रखा गया है।
theological_decisions:
- issue: ‘धार्मिकता’ के लिए संघर्ष का आशय
  choice: वाक्य को नैतिक प्रयास के सामान्य अर्थ में रखा गया
  alternative: इसे किसी विशिष्ट धार्मिक व्यवस्था, व्यवस्था-पालन या सम्प्रदायगत सिद्धान्त से जोड़ना
  rationale: मूल पाठ ऐसी विशिष्ट पहचान नहीं देता; अतः व्यापक नैतिक-धार्मिक अर्थ सुरक्षित रखा गया है।
- issue: न्याय के स्थान का स्वरूप
  choice: ‘न्याय के स्थान’
  alternative: ‘नरक’, ‘कारागार’ या ‘दण्ड-स्थान’
  rationale: मूल अभिव्यक्ति न्याय के स्थान की है और उसके सटीक ब्रह्माण्डीय स्वरूप को निर्धारित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘खराई से चलना’ बाइबिलीय नैतिक रूपक को स्वाभाविक हिन्दी में रखता है। अंतिम दीर्घ विराम जानबूझकर है, क्योंकि उपलब्ध स्रोत-पद ‘उनमें से दसवाँ भाग’ पर अधूरा समाप्त होता है और विचार अगले पद में जारी रहता है।
