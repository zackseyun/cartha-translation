  text: And after this law I made known to you the days of the sabbaths in the wilderness of Sinai, which is between Elim and Sinai.
translation:
  language: hi
  text: और इस व्यवस्था के बाद मैंने तुम्हें सीनै के वीराने में—जो एलीम और सीनै के बीच है—सब्तों के दिन बताए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገ
  choice: इस व्यवस्था के बाद
  rationale: यहाँ ‘व्यवस्था’ को पूर्ववर्ती फसह-सम्बन्धी विधान की ओर संकेत करने वाला स्वतंत्र पद माना गया है; इसे बाद के ‘दिनों’ के साथ अस्वाभाविक रूप से जोड़कर ‘दिनों की व्यवस्था’ नहीं बनाया गया।
- source_word: አደለውኩ
  choice: मैंने ... बता दिए
  rationale: क्रिया का अर्थ किसी बात को ज्ञात या प्रकट कराना है; सहज आधुनिक हिन्दी में ‘बता दिए’ उपयुक्त है।
- source_word: መዋዕለ፡ ሰንበታት
  choice: विश्राम-दिनों के दिन
  rationale: मूल की पुनरुक्त संरचना और विभिन्न सब्तों से सम्बद्ध निर्धारित दिनों का भाव सुरक्षित रखा गया है।
- source_word: በገዳመ፡ ሲና
  choice: सीनै के वीराने में
  rationale: ገዳም यहाँ पर्वत नहीं, निर्जन प्रदेश/वीराना है; इसलिए ‘सीनै पर्वत पर’ नहीं किया गया।
- source_word: ምእከለ፡ ኤሎም፡ ወሲና
  choice: एलीम और सीनै के बीच
  rationale: दो स्थानों के मध्य स्थित क्षेत्र का सीधा भौगोलिक वर्णन है।
theological_decisions:
- issue: ‘व्यवस्था’ का वाक्यगत सम्बन्ध
  choice: इसे पिछली व्यवस्था की ओर संकेत करते हुए ‘इस व्यवस्था के बाद’ माना गया।
  alternative: ‘इसके बाद मैंने तुम्हें विश्राम-दिनों के दिनों की व्यवस्था बताई।’
  rationale: गीज़ पदक्रम में ሕገ क्रिया से पहले आता है, जबकि कथित संबंधवाचक पद መዋዕለ क्रिया के बाद होगा; इसलिए स्वतंत्र पूर्वसंदर्भ अधिक स्वाभाविक है और अध्याय 49 की व्यवस्था से भी जुड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब्त’ के स्थान पर अर्थ-स्पष्ट ‘विश्राम-दिन’ चुना गया; स्थान-नाम ‘एलीम’ और ‘सीनै’ प्रचलित बाइबलीय हिन्दी रूपों में दिए गए हैं।
