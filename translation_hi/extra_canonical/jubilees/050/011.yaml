base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/011.yaml
  text: This work alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel with a continual offering, day by day, as a memorial that is acceptable before the LORD, and he will receive them forever, day after day, according as you were commanded.
translation:
  language: hi
  text: सब्त के दिनों में तुम्हारे परमेश्वर यहोवा के पवित्रस्थान के भवन में केवल यही काम[c] किया जाए, ताकि वे इस्राएल के लिए नित्य भेंट के द्वारा[b] प्रायश्चित करें—दिन-प्रतिदिन, यहोवा के सामने ग्रहणयोग्य स्मरणार्थ[a]। और जैसा तुम्हें आज्ञा दी गई थी, वह उन्हें सदा, दिन-प्रतिदिन, ग्रहण करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो यहोवा को प्रसन्न करे।”
    reason: स्वीकार्यता व्यक्त करनेवाली मूल क्रिया को हिन्दी में ‘ग्रहणयोग्य’ अथवा ‘प्रसन्न करनेवाला’ दोनों प्रकार स्वाभाविक रूप से व्यक्त किया जा सकता है।
  - marker: b
    text: शब्दक्रम के अनुसार इसका अर्थ “इस्राएल के लिए निरन्तर प्रायश्चित करें और भेंट चढ़ाएँ” भी समझा जा सकता है।
    reason: मूल की संक्षिप्त संरचना में ‘नित्य/निरन्तर’ का वाक्यगत संबंध कुछ अस्पष्ट है, जबकि ‘भेंट’ शब्द स्पष्ट रूप से उपस्थित है।
  - marker: c
    text: या, “यह काम ही।”
    reason: विशिष्टता-सूचक पद को हिन्दी में दो स्वाभाविक ढंग से रखा जा सकता है।
lexical_decisions:
- source_word: ዘግብር፡ ባሕቲቱ
  choice: केवल यही काम
  rationale: ግብር का अर्थ ‘काम/कार्य’ है और ባሕቲቱ विशिष्टता (‘अकेला/केवल’) व्यक्त करता है; इसलिए संज्ञा ‘काम’ को स्पष्ट रखा गया है।
- source_word: በመዋዕለ፡ ሰንበታት
  choice: सब्त के दिनों में
  rationale: बहुवचन संरचना को स्वाभाविक हिन्दी में रखते हुए सब्त के आवर्ती दिनों का भाव व्यक्त किया गया है।
- source_word: በቤተ፡ መቅደሱ
  choice: पवित्रस्थान के भवन में
  rationale: ቤት (‘भवन/घर’) और መቅደስ (‘पवित्रस्थान’) दोनों तत्वों को बनाए रखा गया है।
- source_word: ያስተስርዩ
  choice: प्रायश्चित करें
  rationale: यह धार्मिक-सांस्कृतिक क्रिया पाप अथवा अशुद्धि के निवारण हेतु प्रायश्चित कराने/करने का भाव देती है।
- source_word: መባአ፡ ወትረ
  choice: नित्य भेंट
  rationale: መባአ को ‘भेंट’ के रूप में स्पष्ट रखा गया है और ወትረ के निरन्तरता-बोध को ‘नित्य’ से व्यक्त किया गया है।
- source_word: ዘይሠጠው
  choice: जो ... ग्रहणयोग्य हो
  rationale: यहाँ क्रिया का अर्थ ‘स्वीकार्य/प्रसन्न करनेवाला होना’ है, न कि ‘दिया जाना’; ‘ग्रहणयोग्य’ बलिदानी संदर्भ में स्वाभाविक है।
- source_word: ይትወከፎሙ
  choice: वह उन्हें ... ग्रहण करेगा
  rationale: क्रिया का स्वीकार/ग्रहण करने का अर्थ और मूल का बहुवचन कर्म-सर्वनाम दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: सब्त में अनुमत कार्य की विशिष्टता
  choice: केवल यही काम ... किया जाए
  alternative: यह काम ही ... किया जाए
  rationale: मूल पाठ सब्त के दिन पवित्रस्थान में एक विशिष्ट उपासना-संबंधी कार्य को अपवाद के रूप में रखता है; अनुवाद इससे आगे कोई विधिक या सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: अंतिम बहुवचन सर्वनाम का संदर्भ
  choice: वह उन्हें ... ग्रहण करेगा
  alternative: वह भेंटों को ग्रहण करेगा / वह इस्राएलियों को स्वीकार करेगा
  rationale: मूल में बहुवचन कर्म-सर्वनाम है, पर उसका ठीक पूर्वपद व्याकरणतः पूरी तरह स्पष्ट नहीं है। ‘उन्हें’ मूल की अस्पष्टता को सुरक्षित रखता है।
- issue: प्रायश्चित और भेंट का वाक्यगत संबंध
  choice: इस्राएल के लिए नित्य भेंट के द्वारा प्रायश्चित करें
  alternative: इस्राएल के लिए निरन्तर प्रायश्चित करें और भेंट चढ़ाएँ
  rationale: मूल की संक्षिप्त शृंखला में ‘नित्य’ का संबंध भेंट अथवा प्रायश्चित की निरन्तरता—दोनों प्रकार समझा जा सकता है; मुख्य पाठ भेंट को छोड़े बिना सर्वाधिक सुसंगत संबंध प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा’, ‘सब्त’, ‘पवित्रस्थान’, ‘भेंट’ और ‘प्रायश्चित’ जैसे स्थापित बाइबलीय शब्द प्रयुक्त हैं। मूल की पुनरुक्ति ‘दिन-प्रतिदिन’ दोनों स्थानों पर जानबूझकर सुरक्षित रखी गई है, और अंतिम ‘उन्हें’ की संदर्भगत अस्पष्टता को नहीं सुलझाया गया है।
