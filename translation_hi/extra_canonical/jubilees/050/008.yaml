base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/008.yaml
  text: And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do any matter on it so as to do business concerning any buying or selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.
translation:
  language: hi
  text: और जो मनुष्य उस दिन कोई भी काम करे, वह मार डाला जाए—हर वह पुरुष जो इस दिन को अपवित्र करे, या किसी स्त्री के साथ सोए, या कहे कि वह उस दिन कोई काम करेगा, ताकि किसी भी खरीद या बिक्री के संबंध में व्यापार करे, या उस दिन वह पानी खींचे जिसे उसने छठे दिन अपने लिए तैयार नहीं किया था, या कोई बोझ उठाकर अपने तंबू अथवा अपने घर से बाहर ले जाए—वह मार डाला जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመት
  choice: मार डाला जाए
  rationale: गीज़ रूप दंडात्मक मृत्यु-विधान व्यक्त करता है; हिंदी में ‘मार डाला जाए’ कानूनी आदेश की शक्ति को ‘मर जाए’ से अधिक स्पष्ट रखता है।
- source_word: ዘይፄምና
  choice: जो ... अपवित्र करे
  rationale: मूल क्रिया दिन को दूषित या अपवित्र करने का भाव देती है; धार्मिक-विधिक संदर्भ में ‘अपवित्र करे’ स्वाभाविक और सटीक है।
- source_word: ዘይስክብ፡ ምስለ፡ ብእሲት
  choice: किसी स्त्री के साथ सोए
  rationale: मूल का शाब्दिक और मर्यादित लैंगिक मुहावरा सुरक्षित रखा गया है; इससे आशय स्पष्ट रहता है, पर अनावश्यक विस्तार नहीं जोड़ा जाता।
- source_word: ሠይጥ፡ ወተሣይጦ
  choice: क्रय-विक्रय
  rationale: युग्म खरीदने और बेचने दोनों व्यावसायिक क्रियाओं को दर्शाता है; ‘क्रय-विक्रय’ संक्षिप्त, प्रचलित और विधिक शैली के अनुकूल है।
- source_word: ዘኢያስተዳለው፡ ሎቱ
  choice: जिसे उसने ... अपने लिए तैयार नहीं किया था
  rationale: तैयारी का प्रत्यक्ष कर्म पानी है और लाभार्थी ‘अपने लिए’; हिंदी वाक्य में दोनों संबंध स्पष्ट रखे गए हैं।
- source_word: ዘይጸውር
  choice: बोझ ... ले जाए
  rationale: यह धारण या ढोने का भाव देता है; निकटवर्ती ‘उठाकर’ और ‘बाहर’ के साथ ‘ले जाए’ सहज हिंदी बनाता है।
theological_decisions:
- issue: मृत्युदंड वाले विधान की शक्ति
  choice: ‘वह मार डाला जाए’
  alternative: ‘वह मर जाए’
  rationale: पाठ को केवल परिणाम-वर्णन के रूप में नरम नहीं किया गया; विधिक दंड की कठोरता सुरक्षित रखी गई है।
- issue: स्त्री के साथ सोने का आशय
  choice: मूल का मर्यादित मुहावरा ‘किसी स्त्री के साथ सोए’ रखा
  alternative: ‘संभोग करे’
  rationale: मूल अभिव्यक्ति की रूपकात्मक स्पष्टता और गरिमा बनाए रखी गई है; किसी विशेष वैवाहिक या अनुष्ठानिक व्याख्या को नहीं जोड़ा गया।
- issue: ‘किसी काम को करने की बात कहे’ का अस्पष्ट संबंध
  choice: कथन और व्यापार करने के प्रयोजन दोनों को पाठ में रहने दिया
  alternative: इसे केवल व्यापारिक आदेश देने या योजना बनाने के रूप में स्पष्ट करना
  rationale: गीज़ वाक्यरचना कुछ असहज है और अंग्रेज़ी परामर्श-पाठ भी इस तनाव को रखता है; अनिश्चितता को संप्रदायगत या व्याख्यात्मक विस्तार से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी की गरिमापूर्ण विधिक शैली अपनाई गई है। लंबे मूल वाक्य की सूची और आरंभ-अंत में दोहराया गया मृत्युदंड-वाक्य सुरक्षित है। ‘उस दिन’ की पुनरावृत्ति संदर्भ स्पष्ट करने के लिए की गई है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
