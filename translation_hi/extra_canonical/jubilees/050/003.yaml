  verdict: revise
  source_fidelity: The draft preserves the two future clauses, the land as the subject of keeping/observing its own sabbaths, the contemporaneous qualification that the people dwell on the land, and the broad sense of 'know' for the jubilee year. The conditional-temporal Hindi framing 'जब ... तब' is acceptable for the source's 'while/in their dwelling upon it.'
  naturalness: The sentence is clear and suitably formal. However, 'भूमि अपने सब्तों को मानेगी' is less idiomatic in Hindi and can suggest that the land obeys the sabbaths; 'अपने सब्तों का पालन करेगी' more naturally expresses observance while retaining the source's personification.
  terminology: '''सब्त'' and ''जुबली'' appropriately preserve established historical-religious terminology. Writing ''जुबली-वर्ष'' makes the fixed technical expression more natural in Hindi without adding interpretation.'
  issues:
  - severity: low
    issue: '''सब्तों को मानेगी'' is an awkward collocation.'
    rationale: Modern standard Hindi normally says 'का पालन करना' for observing prescribed days or ordinances. This better represents the source/English sense 'keep its sabbaths.'
  - severity: low
    issue: The technical phrase for the year of jubilee is slightly less smooth as 'जुबली के वर्ष.'
    rationale: '''जुबली-वर्ष'' is a conventional, compact Hindi rendering and preserves the same referent and ambiguity.'
  revised_text: और जब वे उस पर बसे रहेंगे, तब भूमि अपने सब्तों का पालन करेगी, और वे जुबली-वर्ष को जानेंगे।
