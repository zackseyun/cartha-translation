  yaml_path: translation/extra_canonical/jubilees/050/003.yaml
  text: And the land will keep its sabbaths while they dwell upon it, and they will know the year of the jubilee.
translation:
  language: hi
  text: और जब वे उस पर बसे रहेंगे, तब भूमि अपने सब्तों का पालन करेगी, और वे जुबली-वर्ष को जानेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታበብት፡ ምድር፡ ሰንበታቲሃ
  choice: भूमि अपने सब्तों को मानेगी
  rationale: गीज़ पदबंध का आशय भूमि द्वारा अपने निर्धारित सब्तों का पालन करना है। ‘मानेगी’ आधुनिक हिन्दी में स्वाभाविक है और भूमि के विश्राम-वर्षों की विधिक पृष्ठभूमि को बनाए रखता है।
- source_word: በነቢሮቶሙ፡ ዲቤሃ
  choice: जब वे उस पर बसे रहेंगे
  rationale: यह पदबंध उनके भूमि पर रहने/बसने की अवस्था व्यक्त करता है। ‘जब’ प्रसंगगत काल-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዓመተ፡ ለኢዮቤል
  choice: जुबली के वर्ष
  rationale: ‘जुबली’ मूल पद का पारंपरिक और पहचानने योग्य रूप है; ‘वर्ष’ को स्पष्ट रखते हुए विशेष विधिक संस्था का नाम सुरक्षित रखा गया है।
- source_word: ያእምሩ
  choice: वे ... जानेंगे
  rationale: क्रिया के सामान्य ज्ञानार्थ को सीधे रखा गया है; इसे ‘मानेंगे’ या ‘पहचानेंगे’ बनाकर अर्थ को संकीर्ण नहीं किया गया।
theological_decisions:
- issue: भूमि के सब्तों का स्वरूप
  choice: भूमि अपने सब्तों को मानेगी
  alternative: भूमि अपने सब्तों में विश्राम करेगी
  rationale: स्रोत में ‘भूमि’ कर्ता और ‘उसके सब्त’ कर्म हैं। चुना हुआ रूप इस व्यक्तिकरण और बहुवचन दोनों को बनाए रखता है, बिना यह तय किए कि आशय केवल विश्राम है या व्यापक विधिपालन।
- issue: जुबली-वर्ष का ज्ञान
  choice: जुबली के वर्ष को जानेंगे
  alternative: जुबली का वर्ष पहचानेंगे
  rationale: ‘जानेंगे’ स्रोत क्रिया की व्यापकता और संभावित धार्मिक-विधिक तनाव को सुरक्षित रखता है; ‘पहचानेंगे’ अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘सब्त’ तथा ‘जुबली’ जैसे ऐतिहासिक-विधिक शब्द बनाए गए हैं; वाक्य-संरचना को हिन्दी के स्वाभाविक क्रम में रखा गया है।
