base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/007.yaml
  text: Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your children and your male servants and your female servants and all your animals and also the resident foreigner who is with you.
translation:
  language: hi
  text: छः दिन तक तुम काम करना, पर सातवाँ दिन तुम्हारे परमेश्वर यहोवा का विश्राम-दिन है। उस दिन तुम, तुम्हारी संतान[a], तुम्हारे दास-दासियाँ, तुम्हारे सभी पशु, और तुम्हारे बीच रहनेवाला परदेशी, कोई काम न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे बच्चे’।
    reason: गीज़ शब्द का अर्थ ‘संतान’ अथवा ‘बच्चे’ हो सकता है।
lexical_decisions:
- source_word: ሰንበት (sanbat)
  choice: विश्राम-दिन
  rationale: यह शब्द सब्त के पवित्र विश्राम-दिवस को सूचित करता है; ‘विश्राम-दिन’ आधुनिक हिन्दी पाठक के लिए अर्थ स्पष्ट रखते हुए बाइबलीय भाव बनाए रखता है।
- source_word: ውሉድክሙ (wəludəkkəmu)
  choice: तुम्हारी संतान
  rationale: मूल बहुवचन का अर्थ बच्चे या वंशज हो सकता है। प्रसंग में घर के सभी बच्चों का समावेश है; ‘संतान’ लिंग-समावेशी है और पुत्रों तक अर्थ सीमित नहीं करता।
- source_word: አግብርቲክሙ፡ ወአእማቲክሙ
  choice: तुम्हारे दास-दासियाँ
  rationale: मूल में पुरुष और स्त्री सेवकों की अलग श्रेणियाँ हैं। संयुक्त हिन्दी पद दोनों को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ነኪርኒ፡ ዘኀቤክሙ
  choice: तुम्हारे बीच रहनेवाला परदेशी
  rationale: मूल का आशय उस विदेशी व्यक्ति से है जो समुदाय के यहाँ या बीच निवास करता है; यह केवल आगंतुक नहीं, बल्कि निवासी परदेशी है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: ईश्वर के विशिष्ट नाम को सामान्य उपाधि ‘प्रभु’ में विलीन न करके हिन्दी बाइबल परंपरा में प्रचलित नाम से प्रस्तुत किया गया है।
theological_decisions:
- issue: सातवें दिन की पहचान
  choice: तुम्हारे परमेश्वर यहोवा का विश्राम-दिन
  alternative: तुम्हारे परमेश्वर प्रभु का सब्त
  rationale: अनुवाद दिन को परमेश्वर से संबंधित पवित्र विश्राम के रूप में रखता है, बिना बाद की किसी सांप्रदायिक व्याख्या को जोड़े।
- issue: संतान का दायरा
  choice: लिंग-समावेशी ‘संतान’
  alternative: ‘पुत्र’ या ‘बेटे’
  rationale: गीज़ पद सामान्यतः बच्चों या संतान को व्यक्त कर सकता है और यहाँ सब्त-आज्ञा के घरेलू दायरे को संकुचित करना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आज्ञात्मक शैली अपनाई गई है। ‘तुम’ मूल के बहुवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है। मुख्य पाठ में सभी निर्दिष्ट घरेलू समूहों को बनाए रखा गया है और फुटनोट-चिह्न [a] पाठ में सम्मिलित है।
