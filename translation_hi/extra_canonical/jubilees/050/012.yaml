base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/012.yaml
  text: And every person who does work on it, or goes on a journey, or tills his field, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—
translation:
  language: hi
  text: और हर वह व्यक्ति जो उस दिन कोई काम करता है, या यात्रा पर जाता है, या अपना खेत जोतता है—चाहे अपने घर में हो या किसी भी स्थान पर—या आग जलाता है, या किसी पशु पर सवारी करता है, या जहाज़ से समुद्र की यात्रा करता है, या किसी चीज़ पर प्रहार करता या उसे मार डालता है, या किसी पशु अथवा पक्षी का वध करता है, या किसी जंगली पशु, पक्षी अथवा मछली को पकड़ता है, या उपवास करता है, या सब्त के दिन युद्ध करता है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባቲ
  choice: उस दिन
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ सब्त के दिन से है; हिन्दी में स्पष्ट और स्वाभाविक संदर्भ दिया गया।
- source_word: ይትቀነይ፡ ወፍረ
  choice: अपना खेत जोतता है
  rationale: कृषिकर्म और खेत के अर्थ को निकटता से व्यक्त करता है; ‘खेत’ मूल अर्थ के लिए ‘खेती-बाड़ी’ से अधिक सटीक है।
- source_word: ያነድድ፡ እሳተ
  choice: आग जलाता है
  rationale: मूल की क्रिया और संज्ञा का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ይጼአን፡ ዲበ፡ ኵሉ፡ እንስሳ
  choice: किसी पशु पर सवारी करता है
  rationale: शाब्दिक ‘किसी पशु पर चढ़ता है’ के आशय को वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ይነግድ፡ በሐመር፡ ባሕረ
  choice: जहाज़ से समुद्र की यात्रा करता है
  rationale: समुद्री जहाज़ द्वारा जाने/यात्रा करने का अर्थ सुरक्षित रखा गया; व्यापार का अनावश्यक विशिष्ट अर्थ नहीं थोपा गया।
- source_word: ይዘብጥ፡ ወይቀትል
  choice: मारता-पीटता या उसका वध करता है
  rationale: दो अलग क्रियाओं—प्रहार करना और मार डालना—का भेद बनाए रखा गया।
- source_word: የሐርድ
  choice: बलि के लिए काटता है
  rationale: क्रिया पशु या पक्षी को विधिपूर्वक काटने/वध करने की ओर संकेत करती है; इसे सामान्य हत्या से अलग रखा गया।
- source_word: አሰገረ
  choice: पकड़ता है
  rationale: जंगली पशु, पक्षी या मछली के आखेट/पकड़े जाने के साझा अर्थ को सरल हिन्दी में व्यक्त करता है।
- source_word: ይጾውም
  choice: उपवास करता है
  rationale: मूल क्रिया का सीधा धार्मिक-सांस्कृतिक समतुल्य।
- source_word: ይገብር፡ ጸብአ
  choice: युद्ध करता है
  rationale: शाब्दिक ‘युद्ध करना/छेड़ना’ का संक्षिप्त और स्वाभाविक रूप।
- source_word: ዕለተ፡ ሰንበት
  choice: सब्त के दिन
  rationale: यहूदी विश्राम-दिन के विशिष्ट नाम को ‘सब्त’ के रूप में सुरक्षित रखा गया।
theological_decisions:
- issue: पद का अधूरा दंड-विधानात्मक वाक्य होना
  choice: अंत में दीर्घ विराम-चिह्न (—) रखा गया
  alternative: पूर्णविराम लगाकर इसे स्वतंत्र निषेध-वाक्य बनाना
  rationale: मूल और उपलब्ध संदर्भ में यह अगली पंक्ति में आने वाले परिणाम या निर्णय की सूचीगत भूमिका निभाता है; इसे स्वतंत्र आज्ञा बनाना पाठ की संरचना और तनाव को बदल देता।
- issue: सब्त के दिन उपवास का सूची में निषिद्ध कार्यों के साथ आना
  choice: ‘उपवास करता है’ को बिना व्याख्यात्मक संशोधन के रखा गया
  alternative: इसे हटाना या किसी विशेष प्रकार के उपवास तक सीमित करना
  rationale: मूल पाठ में यह स्पष्ट रूप से सूची का भाग है; संभावित धार्मिक तनाव को अनुवाद में हल नहीं किया गया।
- issue: वध संबंधी क्रियाओं का भेद
  choice: ‘वध करता है’ और ‘बलि के लिए काटता है’ अलग रखे गए
  alternative: दोनों को केवल ‘मारता है’ कहना
  rationale: मूल में सामान्य मार डालने और पशु-पक्षी के विधिपूर्वक वध के लिए अलग क्रियाएँ हैं; यह भेद अर्थ और संभावित अनुष्ठानिक संदर्भ दोनों के लिए महत्त्वपूर्ण है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। बार-बार आने वाले संयोजक ‘या’ को बनाए रखकर मूल की विस्तृत विधिक सूची का संचयी प्रभाव सुरक्षित रखा गया है। ‘सब्त’ को सांस्कृतिक-धार्मिक पद के रूप में लिप्यंतरित किया गया है।
