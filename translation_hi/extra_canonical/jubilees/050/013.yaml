base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/013.yaml
  text: And the person who does any of these things on the Sabbath day shall die, so that the children of Israel may keep according to the commandments of the Sabbaths of the land, as it is written on the tablets that he gave into my hands so that I might write for you the laws of each appointed time according to the divisions of its days.
translation:
  language: hi
  text: और जो व्यक्ति सब्त के दिन इनमें से कोई भी काम करे, वह मारा जाए, ताकि इस्राएल की संतानें देश के सब्तों का पालन उनकी आज्ञाओं के अनुसार करती रहें,[a] जैसा उन पटियाओं पर लिखा है जिन्हें उसने मेरे हाथों में दिया था, जिससे मैं तुम्हारे लिए प्रत्येक नियत समय के नियम उसके दिनों के विभाजनों के अनुसार लिखूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “सब्तों की आज्ञाओं के अनुसार पालन करती रहें।”'
    reason: मूल में ‘आज्ञाओं के अनुसार’ पालन का मानक है, न कि ‘आज्ञाओं’ को सीधे पालन का कर्म बनाया गया है।
lexical_decisions:
- source_word: ዘይገብር፡ ኵሎ፡ ዘእምዝ
  choice: जो व्यक्ति ... इनमें से कोई भी काम करे
  rationale: शाब्दिक संरचना में ‘इनमें से सब/कोई’ का भाव है; हिन्दी में निषेध-सूची के संदर्भ में ‘इनमें से कोई भी काम’ स्वाभाविक और अर्थसंगत है।
- source_word: ይሙት
  choice: वह अवश्य मारा जाए
  rationale: यहाँ विधिक दंड-विधान है। केवल ‘मरे’ हिन्दी में भविष्यवाणी जैसा लग सकता है; ‘अवश्य मारा जाए’ मृत्यु-दंड का बल स्पष्ट करता है, यद्यपि गीइज़ क्रिया मूलतः ‘मरे’ है।
- source_word: ሰንበት / ሰንበታት
  choice: सब्त / सब्तों
  rationale: धार्मिक-सांस्कृतिक पद को परिचित हिन्दी बाइबलीय रूप में रखा गया है और एकवचन/बहुवचन भेद सुरक्षित है।
- source_word: በከመ፡ ትእዛዛተ
  choice: आज्ञाओं के अनुसार
  rationale: በከመ का मानक अथवा अनुरूपता-सूचक अर्थ सुरक्षित रखा गया है; आज्ञाओं को सीधे क्रिया का कर्म नहीं बनाया गया।
- source_word: ሕገገ
  choice: नियम
  rationale: यह बहुवचन रूप है; अतः ‘नियम’ को बहुवचन अर्थ में लिया गया है, न कि एकवचन ‘व्यवस्था’।
- source_word: ጊዜ፡ ወጊዜ
  choice: प्रत्येक नियत समय
  rationale: दोहराव वितरणात्मक है—‘एक-एक समय’ अथवा ‘हर समय’; प्रसंग में निर्धारित पवित्र अवसरों का भाव होने से ‘नियत समय’ चुना गया।
- source_word: በበ፡ ክፍሌ፡ መዋዕሊሁ
  choice: उसके दिनों के विभाजनों के अनुसार
  rationale: दिनों के काल-विभाजन संबंधी मूल अभिव्यक्ति को संक्षिप्त किए बिना रखा गया है।
theological_decisions:
- issue: ‘देश के सब्तों’ और पालन की वस्तु
  choice: ‘देश के सब्तों की आज्ञाओं के अनुसार सब्त मानती रहे’
  alternative: ‘देश के सब्तों की आज्ञाओं का पालन करती रहे’
  rationale: मूल में ‘आज्ञाओं के अनुसार’ है, आज्ञाएँ सीधे ‘पालन करना’ क्रिया का कर्म नहीं हैं। मुख्य पाठ मूल संबंध को बचाता है और हिन्दी में निहित कर्म ‘सब्त’ स्पष्ट करता है।
- issue: पटियाएँ देने वाले का सर्वनाम
  choice: ‘जिन्हें उसने मेरे हाथों में दिया था’
  alternative: कर्ता को स्पष्ट नाम से पहचानना
  rationale: मूल का तीसरे पुरुष एकवचन सर्वनाम बनाए रखा गया है; वक्ता अथवा देने वाले की पहचान को व्याख्यात्मक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक दंड-विधान का बल, ‘सब्तों’ का बहुवचन, नियमों का बहुवचन और दिनों के विभाजन की काल-संबंधी अभिव्यक्ति सुरक्षित रखी गई है।
