base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
translation:
  language: hi
  text: इसलिए मैंने तुम्हारे लिए वर्षों के सप्ताह, वर्ष और जुबली ठहराए हैं—आदम के दिनों से लेकर आज के दिन तक उनचास जुबली; और प्रभु की आज्ञाओं को सीखने के लिए अभी एक सप्ताह, दो वर्ष और चालीस वर्ष बाकी हैं, जब तक वे यरदन पार करके पश्चिम की ओर कनान देश में प्रवेश न कर लें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अनुवाद यह भी हो सकता है: “यरदन पार करके, उसके पश्चिमी किनारे की ओर कनान देश में प्रवेश न कर लें।”'
    reason: गीज़ ‘उसके पश्चिमी मुख’ को दिशात्मक ‘पश्चिम की ओर’ समझा जा सकता है, अथवा उसे यरदन के पश्चिमी किनारे से संबद्ध माना जा सकता है। मुख्य पाठ पहले अर्थ को रखता है और टिप्पणी दूसरा संभावित संबंध सुरक्षित रखती है।
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: वर्षों के सप्ताह
  rationale: शाब्दिक रूप से ‘वर्षों का सप्ताह’; सात-सात वर्षों की गणना को स्पष्ट रखते हुए स्रोत की कालगणनात्मक अभिव्यक्ति सुरक्षित की गई है।
- source_word: ኢዮቤሌዎታት
  choice: जुबली
  rationale: यह उनचास-वर्षीय कालखंडों के लिए प्रयुक्त पारिभाषिक शब्द है; ‘जयन्ती’ आधुनिक हिन्दी में उत्सव का भ्रामक अर्थ दे सकती है।
- source_word: ርሑቅ
  choice: बाकी हैं
  rationale: संदर्भ में समय की वह अवधि अभिप्रेत है जो अभी आगे शेष है; स्वाभाविक हिन्दी में इसे ‘बाकी हैं’ से व्यक्त किया गया है।
- source_word: ለእእምሮ
  choice: सीखने के लिए
  rationale: मूल में जानने/ज्ञान प्राप्त करने का भाव है; आज्ञाओं के संदर्भ में ‘सीखने’ से आशय सहज और स्पष्ट बनता है।
- source_word: ዐዲዎሙ፡ ዮርዳኖሰ
  choice: यरदन पार करके
  rationale: क्रियात्मक रूप ‘पार करते हुए/पार करके’ को बनाए रखा गया है; इसे केवल ‘यरदन के पास’ नहीं बनाया गया।
- source_word: ገጸ፡ ዐረቢሁ
  choice: पश्चिम की ओर
  rationale: शाब्दिक भाव ‘उसके पश्चिमी मुख/पश्चिम की दिशा’ है; नदी पार कर कनान में प्रवेश के प्रसंग में दिशात्मक अर्थ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम እግዚአብሔር का अनुवाद
  choice: प्रभु
  alternative: परमेश्वर / यहोवा
  rationale: गीज़ पद सामान्य प्रभुतासूचक ईश्वरीय उपाधि है; यहाँ ‘प्रभु’ स्रोत की उपाधि को बिना किसी विशिष्ट नाम को आरोपित किए सुरक्षित रखता है।
- issue: आज्ञाएँ सीखने की समयावधि
  choice: एक सप्ताह, दो वर्ष और चालीस वर्ष—तीनों को शेष अवधि के रूप में रखा
  alternative: केवल चालीस वर्षों को शेष मानना
  rationale: मूल सूची इन कालांशों को संयोजक से जोड़ती है; अनुवाद उन्हें अलग-अलग ऐतिहासिक या धर्मशास्त्रीय चरण मानकर तनाव को नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सरल शैली अपनाई गई है। कालगणना की तकनीकी अभिव्यक्ति ‘वर्षों के सप्ताह’ और पारिभाषिक शब्द ‘जुबली’ बनाए रखे गए हैं। मुख्य वाक्य की लंबी सूची को अर्धविराम और डैश से पठनीय बनाया गया है; फुटनोट चिह्न [a] मुख्य पाठ में उपस्थित है।
