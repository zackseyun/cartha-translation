  yaml_path: translation/extra_canonical/jubilees/050/006.yaml
  text: And behold, I have written for you the command concerning the Sabbaths, and all the judgments of its laws.
translation:
  language: hi
  text: और देखो, मैंने तेरे लिए सब्तों की आज्ञा और उसके[a] नियमों के सभी न्याय-विधान लिख दिए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके’ का संकेत ऊपर की ‘आज्ञा’ या सब्त-व्यवस्था की ओर हो सकता है। मूल पाठ में ‘सब्तों’ बहुवचन है, पर अंतिम शब्द में संबंधसूचक प्रत्यय एकवचन है।
    reason: मूल पाठ में बहुवचन ‘सब्तों’ और एकवचन संबंधसूचक प्रत्यय के बीच की वास्तविक व्याकरणिक अस्पष्टता को स्पष्ट करता है, बिना किसी एक व्याख्या को निश्चित किए।
lexical_decisions:
- source_word: ሰንበታት
  choice: सब्तों
  rationale: स्रोत में ‘सब्त’ का बहुवचन है; इसलिए बहुवचन को बनाए रखा गया है।
- source_word: ፍትሓተ
  choice: न्याय-विधान
  rationale: यह शब्द कानूनी निर्णयों अथवा विधि-संबंधी ठहरावों को सूचित करता है; ‘न्याय-विधान’ उस विधिक अर्थ और गरिमापूर्ण शैली, दोनों को व्यक्त करता है।
- source_word: ሕገጊሁ
  choice: उसके नियमों
  rationale: ሕገግ बहुवचन ‘नियमों/विधियों’ को सूचित करता है और -ሁ एकवचन संबंधसूचक प्रत्यय है; हिन्दी में ‘उसके नियमों’ द्वारा दोनों विशेषताएँ सुरक्षित रखी गई हैं।
theological_decisions:
- issue: एकवचन संबंधसूचक प्रत्यय का संदर्भ
  choice: ‘उसके नियमों’ रखा गया, जिससे सब्त-व्यवस्था को एक इकाई मानने की संभावना बनी रहती है।
  alternative: ‘उनके नियमों’, जिसमें ‘सब्तों’ के व्याकरणिक बहुवचन से सीधा सामंजस्य होता।
  rationale: गीज़ में ‘सब्तों’ बहुवचन है, पर ‘उसके’ का प्रत्यय एकवचन है। पाठ की इस वास्तविक व्याकरणिक तनातनी को बहुवचन सर्वनाम से चुपचाप समतल नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन संबोधन के लिए ‘तेरे’ रखा गया है; ‘और देख’ स्रोत के उद्घोषात्मक ወናሁ को निकटता से व्यक्त करता है।
