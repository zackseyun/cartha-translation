review_pass:
  verdict: revise
  source_fidelity: The draft retains the verse’s temporal sequence, the catalog of defilements, Israel’s secure dwelling, the removal of satan/evil one, and the enduring cleansing of the land. A small revision better represents the source’s repeated ‘land’ terminology without narrowing it to a modern political ‘country,’ and makes the Hindi ‘until’ construction unambiguous.
  naturalness: The construction ‘जब तक ... न हो जाए और ... न रहे’ is potentially awkward because the second negative can be read as ‘does not dwell.’ ‘न रहने लगे’ is clear and natural in this future-oriented temporal clause. ‘निश्चिंतता से’ is more idiomatic than ‘निश्चिंत होकर’ in this setting.
  terminology: ‘जुबली-वर्ष,’ ‘व्यभिचार,’ ‘अशुद्धता,’ ‘मलिनता,’ ‘पाप,’ ‘भूल,’ and ‘शैतान’ are suitable. ‘भूमि’ consistently renders the source term and avoids over-specifying its referent. ‘कोई दुष्ट जन’ naturally conveys the nominal sense of ‘evil one.’
  issues:
  - severity: low
    issue: ‘देश’ narrows the source term for land.
    rationale: The Geʽez ምድር can denote land or earth. ‘भूमि’ is a natural Hindi rendering that preserves this breadth and is preferable in both occurrences.
  - severity: medium
    issue: The phrase ‘जब तक ... न हो जाए और ... न रहे’ can be misread.
    rationale: In Hindi, the second ‘न रहे’ may suggest that Israel will not dwell, whereas the source says that Israel dwells securely. ‘न रहने लगे’ clearly expresses the intended endpoint.
  revised_text: और जुबली-वर्ष बीतते जाएँगे, जब तक इस्राएल व्यभिचार, अशुद्धता, मलिनता, पाप और भूल के सभी दोषों से शुद्ध न हो जाए और सारी भूमि में निश्चिंतता से न रहने लगे। तब उनके लिए न कोई शैतान रहेगा, न कोई दुष्ट जन; और उस समय से भूमि सदा के लिए शुद्ध रहेगी।
