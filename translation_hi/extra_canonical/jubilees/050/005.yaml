base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/005.yaml
  text: And the jubilees will pass until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in confidence in all the land; and there will no longer be for them any satan or any evil one, and the land will be clean from that time forever.
translation:
  language: hi
  text: और जुबली-वर्ष बीतते जाएँगे, जब तक इस्राएल व्यभिचार, अशुद्धता, मलिनता, पाप और भूल के सभी दोषों से शुद्ध न हो जाए और सारी भूमि में निश्चिंतता से न रहने लगे। तब उनके लिए न कोई शैतान रहेगा, न कोई दुष्ट जन; और उस समय से भूमि सदा के लिए शुद्ध रहेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤሌዎታት
  choice: जुबली-वर्ष
  rationale: बहुवचन रूप को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है; केवल लिप्यंतरण की अपेक्षा कालगत अर्थ भी सामने आता है।
- source_word: የኃልፉ
  choice: बीतते जाएँगे
  rationale: क्रिया के निरंतर कालगत प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አበሳ
  choice: दोष
  rationale: अपराध अथवा दोष की व्यापक धारणा रखता है और आगे दी गई बुराइयों से इसका संबंध बनाए रखता है।
- source_word: ዝሙት
  choice: व्यभिचार
  rationale: यौन अनैतिकता के अर्थ को गरिमापूर्ण और प्रचलित धार्मिक हिन्दी में व्यक्त करता है।
- source_word: ርኵስ
  choice: अशुद्धता
  rationale: नैतिक या धार्मिक अशुद्धता की स्रोतगत व्यापकता बनाए रखता है।
- source_word: ግማኔ
  choice: मलिनता
  rationale: प्रदूषण अथवा अपवित्र करने वाली गंदगी का भाव रखता है, साथ ही निकटवर्ती 'अशुद्धता' से अलग शब्द देता है।
- source_word: ጌጋይ
  choice: भूल
  rationale: त्रुटि या भटकाव की अस्पष्टता को किसी अधिक कठोर धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
- source_word: ይትአመን
  choice: निश्चिंत होकर
  rationale: सुरक्षा, भरोसे और निर्भय निवास के भाव को स्वाभाविक हिन्दी में समेटता है।
- source_word: ሰይጣነ
  choice: शैतान
  rationale: स्रोत के पद का सीधा पारंपरिक लिप्यंतरण; यहाँ अनिश्चित सूचक के कारण इसे व्यक्तिनाम मानकर बड़े अक्षर जैसी विशिष्टता थोपना उचित नहीं।
- source_word: እኩየ
  choice: दुष्ट
  rationale: ‘evil one’ के व्यक्तिगत अथवा सामान्य संदर्भ की कुछ गुंजाइश बनाए रखता है।
theological_decisions:
- issue: ‘शैतान’ को विशिष्ट व्यक्तित्व या सामान्य विरोधी के रूप में समझना
  choice: कोई शैतान
  alternative: शैतान
  rationale: स्रोत में अनिश्चितता-सूचक संरचना है; इसलिए हिन्दी में ‘कोई’ रखकर सामान्य अथवा वर्गगत अर्थ की संभावना सुरक्षित रखी गई है।
- issue: भूमि में निवास की सीमा और भरोसे की अवस्था
  choice: पूरे देश में निश्चिंत होकर न रहे
  alternative: सारी पृथ्वी पर भरोसे में न रहे
  rationale: ‘ምድር’ भूमि/देश दोनों हो सकता है; इस्राएल के निवास-संदर्भ में ‘देश’ स्वाभाविक है, जबकि सार्वभौमिक ‘पृथ्वी’ को अनिवार्य नहीं बनाया गया।
- issue: शुद्धि का विषय
  choice: इस्राएल ... हर दोष से शुद्ध
  alternative: इस्राएल ... सभी अपराधों से क्षमा पाया हुआ
  rationale: पाठ शुद्ध होने की भाषा प्रयोग करता है, स्पष्टतः क्षमा या न्यायसंगत ठहराए जाने की नहीं; अतः उसी रूपक को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। स्रोत की सूचीबद्ध लय और भविष्यकालीन आशा को रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में भी कोई पादटिप्पणी-चिह्न नहीं है।
