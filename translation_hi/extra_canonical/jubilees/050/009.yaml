  yaml_path: translation/extra_canonical/jubilees/050/009.yaml
  text: You shall do no work at all on the Sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep Sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of the kingdom for all Israel—this day throughout their days, throughout all days.
translation:
  language: hi
  text: सब्त के दिन तुम कोई भी काम न करना, सिवाय उसके जिसे तुमने अपने लिए छठे दिन खाने, पीने और विश्राम करने के लिए तैयार कर रखा है। इस दिन हर काम से विरत रहकर सब्त मानना और अपने परमेश्वर, प्रभु को धन्य कहना, जिसने तुम्हें उत्सव का दिन, पवित्र दिन और समस्त इस्राएल के लिए राज्य का पवित्र दिन[a] दिया है—यह दिन उनके दिनों भर, सभी दिनों भर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र राज्य-दिन।”
    reason: स्रोत के संक्षिप्त संबंध-विन्यास की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ሰንበት
  choice: सब्त
  rationale: यह संज्ञा और उससे संबंधित क्रिया, दोनों का पारंपरिक और स्पष्ट हिन्दी रूप है; इससे केवल सामान्य ‘विश्राम’ और विधिवत सब्त-पालन में अंतर बना रहता है।
- source_word: እግዚአብሔር፡ አምላክክሙ
  choice: अपने परमेश्वर प्रभु
  rationale: दोनों स्रोत-पदों को बनाए रखते हुए हिन्दी में स्वाभाविक संबंध व्यक्त करता है; किसी विशिष्ट नाम-पाठ को स्रोत पर आरोपित नहीं करता।
- source_word: ዕለተ፡ መንግሥት፡ ቅድስት
  choice: राज्य का पवित्र दिन
  rationale: ‘दिन’, ‘राज्य’ और ‘पवित्र’—तीनों घटकों को रखते हुए गीइज़ पदबंध का स्वाभाविक हिन्दी रूप देता है।
- source_word: በመዋዕሊሆሙ፡ በኵሉ፡ መዋዕል
  choice: उनके दिनों भर, सभी दिनों तक
  rationale: दोनों बार आए ‘दिन’ को बनाए रखता है और ‘पीढ़ियों’ जैसा स्रोत में अनुपस्थित अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ‘राज्य का पवित्र दिन’ पदबंध का संबंध
  choice: राज्य का पवित्र दिन
  alternative: पवित्र राज्य-दिन
  rationale: स्रोत का संबंध-विन्यास संक्षिप्त है और एक से अधिक ढंग से समझा जा सकता है; मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी निकटतर वैकल्पिक गठन सुरक्षित रखती है।
- issue: अंतिम काल-सूचक वाक्यांश
  choice: उनके दिनों भर, सभी दिनों तक
  alternative: उनकी पीढ़ियों तक, सदा-सर्वदा
  rationale: गीइज़ में स्पष्ट रूप से ‘दिन’ है, ‘पीढ़ियाँ’ नहीं; इसलिए पारंपरिक विस्तार को मुख्य पाठ में नहीं अपनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। निषेधात्मक आज्ञा के बाद उद्देश्यसूचक क्रियाओं को हिन्दी में स्वाभाविक क्रम दिया गया है। मुख्य पाठ में प्रयुक्त [a] पादटिप्पणी-चिह्न से पूर्णतः मेल खाता है।
