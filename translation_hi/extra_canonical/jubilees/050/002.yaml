base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/002.yaml
  text: And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but its year I did not tell you until the time when you enter the land that you are to possess.
translation:
  language: hi
  text: और सीनै पर्वत पर मैंने तुम्हें भूमि के विश्राम-वर्षों के विषय में बताया था, और वर्ष-सप्ताहों के अंतर्गत मैंने तुम्हें जुबली-वर्षों के विषय में भी बताया था; पर उसका वर्ष मैंने तुम्हें उस समय तक नहीं बताया, जब तुम उस भूमि में प्रवेश करोगे जिसे तुम्हें अपने अधिकार में लेना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰንበታተ፡ ምድር
  choice: भूमि के विश्राम-वर्षों
  rationale: शाब्दिक अर्थ ‘भूमि के सब्त’ है, पर प्रसंग में भूमि के लिए निर्धारित सातवें-वर्षीय विश्राम अभिप्रेत है; ‘विश्राम-वर्ष’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ደብረ፡ ሲና
  choice: सीनै पर्वत
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबिलीय रूप में रखा गया है।
- source_word: ሰንበታተ፡ ዓመታት
  choice: वर्ष-सप्ताहों
  rationale: यह सात-सात वर्षों के समूहों को सूचित करता है। ‘वर्ष-सप्ताह’ मूल की संरचना और जुबली की गणना से उसका संबंध बनाए रखता है।
- source_word: ዓመታተ፡ ኢዮቤሌዎኒ
  choice: जुबली-वर्षों
  rationale: ‘जुबली’ इस विशिष्ट पचासवें-वर्षीय विधान के लिए पहचाना जाने वाला पद है; बहुवचन को भी सुरक्षित रखा गया है।
- source_word: ትእኅዙ
  choice: अपने अधिकार में लेना
  rationale: क्रिया में भूमि को ग्रहण करने अथवा उसका अधिकार पाने का भाव है; यह अनावश्यक रूप से सैन्य ‘विजय’ का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ‘उसका वर्ष’ का संदर्भ
  choice: अस्पष्ट एकवचन सर्वनाम को ‘उसका वर्ष’ के रूप में बनाए रखा
  alternative: ‘जुबली का ठीक वर्ष’ या ‘उसका आरंभ-वर्ष’
  rationale: गीज़ पाठ में एकवचन संबंधसूचक रूप का सटीक पूर्वपद स्पष्ट नहीं है। किसी विशिष्ट व्याख्या को पाठ में जोड़ने के बजाय मूल की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
- issue: भूमि में प्रवेश और अधिकार
  choice: ‘उस भूमि में प्रवेश करोगे जिसे तुम्हें अपने अधिकार में लेना है’
  alternative: ‘जिस पर तुम अधिकार करोगे’
  rationale: यह भावी प्रवेश और भूमि-ग्रहण दोनों को व्यक्त करता है, पर अधिकार प्राप्ति की प्रक्रिया या साधन के विषय में अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। लंबे मूल वाक्य की समानांतर रचना बनाए रखते हुए अल्पविराम और अर्धविराम से उसके खंड स्पष्ट किए गए हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
