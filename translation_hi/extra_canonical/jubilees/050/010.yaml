base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/010.yaml
  text: 'For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.'
translation:
  language: hi
  text: क्योंकि यह बड़ा सम्मान है जो प्रभु ने इस्राएल को दिया है—इस पर्व के दिन खाना, पीना और तृप्त होना, और उस दिन मनुष्यों के श्रम के किसी भी काम से विश्राम करना; केवल धूप जलाना और दिनों और सब्तों के लिए प्रभु के सामने भेंट और बलिदान चढ़ाना इसका अपवाद है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ፡ ክብር
  choice: बड़ा सम्मान
  rationale: मूल में परिमाण और प्रतिष्ठा दोनों व्यक्त हैं; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: በዛቲ፡ ዕለት፡ በዓል
  choice: इस पर्व के दिन
  rationale: ዕለት और በዓል के संयुक्त भाव को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ወለጸጊብ
  choice: और तृप्त होना
  rationale: क्रिया का अर्थ भरपेट या संतुष्ट होना है; ‘तृप्त’ गरिमापूर्ण और सुबोध है।
- source_word: ግብር፡ ዘእምግብረ፡ እጓለ፡ እመሕያው
  choice: मनुष्यों के परिश्रम के सब कामों
  rationale: शाब्दिक पुनरुक्ति को बनाए बिना मानव श्रम से संबंधित कार्य का मूल भाव व्यक्त किया गया है।
- source_word: ዕጣን፡ ዕጣን
  choice: धूप जलाना
  rationale: पाठ में संज्ञा की पुनरावृत्ति संभवतः धूप चढ़ाने/जलाने की क्रिया व्यक्त करती है; हिन्दी में क्रियात्मक रूप स्पष्ट है।
- source_word: ለመዋዕለ፡ ወለሰንበታት
  choice: नित्य दिनों और सब्तों के लिए
  rationale: पहले पद का आशय नियमित दैनिक अवसरों से और दूसरे का सब्तों से है; दोनों को अलग रखा गया है।
theological_decisions:
- issue: सब्त के विश्राम में उपासना-संबंधी अपवाद
  choice: केवल धूप जलाना और ... भेंट और बलिदान चढ़ाना इसका अपवाद है
  alternative: सिवाय धूप जलाने और ... चढ़ाने के
  rationale: मूल की निषेध-अपवाद संरचना स्पष्ट रखी गई है, बिना यह निष्कर्ष जोड़े कि हर इस्राएली स्वयं ये याजकीय कार्य करता था।
- issue: दैवी नाम
  choice: प्रभु
  alternative: यहोवा
  rationale: गीज़ እግዚአብሔር सामान्यतः ‘प्रभु’ के अनुरूप है; स्रोत में टेट्राग्राम का प्रत्यक्ष रूप नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। वाक्य की मूल कारणसूचक और अपवादसूचक संरचना सुरक्षित रखी गई है।
