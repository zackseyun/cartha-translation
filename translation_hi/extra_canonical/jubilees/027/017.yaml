  yaml_path: translation/extra_canonical/jubilees/027/017.yaml
  text: And Isaac said to Rebekah, “My sister, do not weep because of Jacob my son, for he will go in peace and return in peace.
translation:
  language: hi
  text: और इसहाक ने रिबका से कहा, “मेरी बहन, मेरे पुत्र याकूब के कारण मत रो, क्योंकि वह शान्ति से जाएगा और शान्ति से लौटेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅትየ
  choice: मेरी बहन
  rationale: गीज़ पाठ के शाब्दिक पारिवारिक-स्नेहसूचक संबोधन को बनाए रखा गया है; इसे केवल ‘प्रिय’ बनाकर मूल की छवि को हटाया नहीं गया।
- source_word: ኢትብከዪ
  choice: मत रो
  rationale: निषेधात्मक क्रिया का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: በእንተ፡ ያዕቆብ፡ ወልድየ
  choice: मेरे पुत्र याकूब के कारण
  rationale: ‘के विषय में/के कारण’ की संभावित अर्थ-सीमा में प्रसंगानुकूल चिन्ता का कारण व्यक्त किया गया, जबकि ‘मेरे पुत्र’ का संबंध सुरक्षित रखा गया।
- source_word: በሰላም፡ የሐውር
  choice: वह शान्ति से जाएगा
  rationale: ‘शान्ति में’ का स्वाभाविक हिन्दी समतुल्य; सुरक्षित और कुशल यात्रा का भाव बिना अतिरिक्त व्याख्या के रखा गया।
- source_word: ወበሰላም፡ ይትመየጥ
  choice: और शान्ति से लौटेगा
  rationale: मूल की समानांतर पुनरावृत्ति और भविष्याभिमुख कथन को संरक्षित किया गया।
theological_decisions:
- issue: इसहाक के कथन की निश्चितता
  choice: ‘जाएगा ... लौटेगा’
  alternative: ‘जाए और लौट आए’ अथवा ‘कुशल से जा सकेगा और लौट सकेगा’
  rationale: स्रोत में प्रयुक्त क्रियारूप कथन/आश्वासन के रूप में प्रस्तुत हैं; इसे प्रार्थना, इच्छा या केवल संभावना में नहीं बदला गया।
- issue: ‘शान्ति’ का अर्थ
  choice: ‘शान्ति से’
  alternative: ‘कुशल से’ या ‘सुरक्षित’
  rationale: ‘शान्ति’ मूल शब्द की व्यापकता और धार्मिक-साहित्यिक प्रतिध्वनि को बनाए रखती है, जबकि हिन्दी में यात्रा की कुशलता भी स्वाभाविक रूप से व्यक्त होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक शैली अपनाई गई है। मूल की दोहरावपूर्ण समानांतर रचना—‘शान्ति से जाएगा और शान्ति से लौटेगा’—जानबूझकर सुरक्षित रखी गई है।
