  text: And Isaac called Jacob and blessed him and charged him and said to him, “Do not take a wife for yourself from any of the daughters of Canaan.
translation:
  language: hi
  text: और इसहाक ने याकूब को बुलाया, उसे आशीर्वाद दिया, उसे आज्ञा दी और उससे कहा, “कनान की बेटियों में से अपने लिए पत्नी मत लेना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዐ
  choice: बुलाया
  rationale: यह क्रिया किसी व्यक्ति को अपने पास बुलाने के सामान्य अर्थ में है।
- source_word: ባረኮ
  choice: आशीर्वाद दिया
  rationale: मूल क्रिया के आशीष देने के धार्मिक और पारिवारिक अर्थ को सीधे बनाए रखता है।
- source_word: ነሠጾ
  choice: आज्ञा दी
  rationale: संदर्भ में यह केवल सलाह नहीं, बल्कि पिता द्वारा दिया गया स्पष्ट निर्देश है।
- source_word: ብእሲተ
  choice: पत्नी
  rationale: इस संदर्भ में स्त्री को विवाह के लिए ग्रहण करने का आशय है।
- source_word: አዋልደ፡ ከናአን
  choice: कनान की बेटियों
  rationale: मूल की वंश/समुदाय-सूचक अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: विवाह संबंधी निषेध की सीमा
  choice: कनान की बेटियों में से किसी को अपनी पत्नी मत बनाना
  alternative: किसी कनानी स्त्री से विवाह मत करना
  rationale: ‘बेटियों’ वाली मूल अभिव्यक्ति को बनाए रखा गया है और निषेध को विवाह के संदर्भ तक सीमित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। मूल के क्रमिक क्रियापदों—बुलाया, आशीर्वाद दिया, आज्ञा दी, कहा—को संरक्षित किया गया है।
