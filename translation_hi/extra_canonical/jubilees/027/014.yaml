base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/014.yaml
  text: And may he give to you the blessings of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”
translation:
  language: hi
  text: और वह मेरे पिता अब्राहम की आशीषें[a] तुझे और तेरे बाद तेरे वंश को दे, ताकि तू अपने परदेश-वास की भूमि और वह सारी भूमि विरासत में पाए जो परमेश्वर ने अब्राहम को दी थी। मेरे पुत्र, शान्ति से जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आशीष’।
    reason: गीज़ मुख्य पाठ में बहुवचन है; यह वैकल्पिक एकवचन रेंडरिंग को संक्षेप में दर्शाता है।
lexical_decisions:
- source_word: በረከታቲሁ
  choice: उसकी आशीषें / मेरे पिता अब्राहम की आशीषें
  rationale: गीज़ रूप बहुवचन है; हिन्दी में ‘आशीषें’ रखकर स्रोत की संख्या को स्पष्ट रूप से सुरक्षित किया गया है। सम्बन्धवाचक प्रत्यय वाक्य में अब्राहम से जुड़ता है।
- source_word: ዘርእከ
  choice: तेरे वंश
  rationale: ‘बीज’ का शाब्दिक रूप हिन्दी में यहाँ अस्वाभाविक होता; ‘वंश’ सामूहिक उत्तराधिकारियों का अर्थ स्वाभाविक ढंग से देता है।
- source_word: ምድረ ፍልሰትከ
  choice: अपने परदेश-वास की भूमि
  rationale: यह उस भूमि को दर्शाता है जहाँ संबोधित व्यक्ति प्रवासी/परदेशी के रूप में रहता है; ‘परदेश-वास’ इस अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: ትረሰ
  choice: विरासत में पाए
  rationale: क्रिया का उत्तराधिकार या अधिकार में प्राप्त करने का भाव हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: በሰላም
  choice: शान्ति से
  rationale: मूल के ‘शान्ति में/के साथ’ भाव को निकटता से रखता है और विदाई-वचन के रूप में सहज है।
theological_decisions:
- issue: आरम्भिक क्रिया के कर्ता की पहचान
  choice: ‘वह ... दे’
  alternative: ‘परमेश्वर ... दे’
  rationale: मूल पाठ सर्वनाम/पूर्वसंदर्भ पर निर्भर कर्ता को इस पद में दोबारा स्पष्ट नाम नहीं देता। ‘वह’ रखकर संदर्भगत सम्बन्ध और मूल की अभिव्यक्ति सुरक्षित रहती है।
- issue: आशीष का वचन-रूप
  choice: बहुवचन ‘आशीषें’
  alternative: एकवचन ‘आशीष’
  rationale: गीज़ በረከታቲሁ बहुवचन है। समानान्तर परम्परा या पूर्व अनुवाद के एकवचन को मुख्य पाठ में थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘तू/तेरे’ पारिवारिक पिता-पुत्र संबोधन और एकवचन मूल को बनाए रखते हैं; शैली अपमानसूचक नहीं है।
