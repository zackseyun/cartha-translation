  yaml_path: translation/extra_canonical/jubilees/027/025.yaml
  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: hi
  text: और उसने याकूब से बात की और कहा, “मैं प्रभु हूँ, तुम्हारे पिता अब्राहम का परमेश्वर और इसहाक का परमेश्वर। जिस भूमि पर तुम सोए पड़े हो, उसे मैं तुम्हें और तुम्हारे बाद तुम्हारे वंश को दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यहाँ पद ईश्वर के व्यक्तिगत वाचा-नाम के रूप में प्रयुक्त है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और परिचित रूप है।
- source_word: አቡከ
  choice: तुम्हारे पिता
  rationale: गीज़ के प्रत्यक्ष संबंधसूचक पद का स्वाभाविक और औपचारिक हिन्दी रूप।
- source_word: ትነውም
  choice: सोए पड़े हो
  rationale: क्रिया में सोने के साथ लेटे होने का भाव है; यह चयन स्रोत के उस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ዘርእከ
  choice: तुम्हारे वंश
  rationale: ‘बीज’ का शाब्दिक रूप यहाँ संतति के सामूहिक अर्थ में है; ‘वंश’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक अर्थ सुरक्षित रखता है।
- source_word: እምድኅሬከ
  choice: तुम्हारे बाद
  rationale: स्रोत के कालिक/उत्तराधिकार संबंधी भाव का सीधा प्रतिनिधित्व करता है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: स्रोत का እግዚአብሔር प्रसंग में उत्पत्ति 28:13 के वाचा-नाम को दर्शाता है; ‘यहोवा’ वक्ता की विशिष्ट पहचान बनाए रखता है, जबकि ‘प्रभु’ उपाधि और नाम के बीच का भेद धुंधला कर सकता है।
- issue: ‘वंश’ का सामूहिक अर्थ
  choice: तुम्हारे वंश
  alternative: तुम्हारी संतानों
  rationale: एकवचन सामूहिकता और वाचा-संबंधी पारंपरिक तनाव को अनावश्यक रूप से बहुवचन व्यक्तियों में नहीं बाँटा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। वाक्य-संरचना स्रोत के निकट रखी गई है, पर ‘सोए पड़े हो’ जैसे स्वाभाविक हिन्दी मुहावरे से क्रिया का लेटे हुए सोने का भाव सुरक्षित किया गया है।
