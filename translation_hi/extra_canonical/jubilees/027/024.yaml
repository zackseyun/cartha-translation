base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/024.yaml
  text: And he dreamed that night, and behold, a ladder was set on the earth, and its top reached to heaven. And behold, the angels of God were going up and coming down on it, and behold, God stood upon it.
translation:
  language: hi
  text: और उस रात उसने स्वप्न देखा। और देखो, एक सीढ़ी पृथ्वी पर खड़ी थी, और उसका सिरा आकाश तक पहुँचता था। और देखो, परमेश्वर के स्वर्गदूत उस पर चढ़ रहे और उतर रहे थे; और देखो, परमेश्वर उस पर खड़ा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके ऊपर खड़ा था।”
    reason: अंतिम गीज़ स्थानवाचक पद का सीधा अर्थ ‘उस पर’ है; प्रसंगानुसार ‘उसके ऊपर’ भी संभव समझा गया है।
lexical_decisions:
- source_word: መዓርግ
  choice: सीढ़ी
  rationale: इस प्रसंग में पृथ्वी और आकाश को जोड़ने वाली, चढ़ने-उतरने योग्य संरचना अभिप्रेत है; आधुनिक हिन्दी में ‘सीढ़ी’ स्वाभाविक और स्पष्ट है।
- source_word: ትክልት፡ ውስተ፡ ምድር
  choice: पृथ्वी पर खड़ी थी
  rationale: शाब्दिक भाव ‘पृथ्वी पर स्थापित/लगाई हुई’ है। ‘खड़ी थी’ हिन्दी में दृश्य को स्वाभाविक ढंग से व्यक्त करता है और स्थापन का भाव बनाए रखता है।
- source_word: ርእሳ
  choice: उसका सिरा
  rationale: मूल का अर्थ ‘उसका सिर/शीर्ष’ है; सीढ़ी के लिए हिन्दी में ‘सिरा’ अधिक स्वाभाविक है।
- source_word: እግዚአብሔር
  choice: परमेश्वर
  rationale: यहाँ शब्द ईश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक, गरिमापूर्ण और व्यापक हिन्दी बाइबलीय प्रयोग है।
- source_word: ውስቴታ
  choice: उस पर
  rationale: गीज़ रूप का निकट अर्थ ‘उसमें/उस पर’ है। सीढ़ी के संदर्भ में ‘उस पर’ सर्वाधिक स्वाभाविक है; ‘उसके ऊपर’ भी संभव समझ के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अंतिम वाक्य में परमेश्वर की स्थिति
  choice: परमेश्वर उस पर खड़ा था
  alternative: परमेश्वर उसके ऊपर खड़ा था
  rationale: मूल ውስቴታ का सीधा स्थानवाचक अर्थ ‘उसमें/उस पर’ है और संशोधन-साक्ष्य भी ‘upon it’ का समर्थन करता है। फिर भी प्रसंग में ‘उसके ऊपर’ समझना संभव है, इसलिए वास्तविक स्थानवाचक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। बार-बार आए ወናሁ को ‘और देखो’ के रूप में बनाए रखा गया है, ताकि मूल का दृश्यात्मक और उद्घोषात्मक प्रवाह सुरक्षित रहे।
