  yaml_path: translation/extra_canonical/jubilees/027/026.yaml
  text: And your seed will be like the dust of the earth, and you will spread out to the sea and to the east and to the north and to the south. And in you and in your seed all the lands of the nations will be blessed.
translation:
  language: hi
  text: और तुम्हारा वंश पृथ्वी की धूल के समान होगा, और तुम समुद्र की ओर, पूर्व की ओर, उत्तर की ओर और दक्षिण की ओर फैल जाओगे। और तुममें और तुम्हारे वंश में राष्ट्रों की सारी भूमियाँ आशीष पाएँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: तुम्हारा वंश
  rationale: गीज़ शब्द संतान अथवा वंश को सूचित करता है; यहाँ एक सामूहिक वंश के अर्थ में ‘वंश’ स्वाभाविक और संदर्भानुकूल है।
- source_word: ኖላ፡ ምድር
  choice: पृथ्वी की धूल
  rationale: पाठ में पृथ्वी की धूल की उपमा है; इसे परिचित बाइबलीय रूप में सीधे रखा गया है।
- source_word: ባሕር
  choice: समुद्र की ओर
  rationale: स्रोत में शाब्दिक रूप से ‘समुद्र’ है। इसे ‘पश्चिम’ बनाकर निहित दिशा स्पष्ट नहीं की गई, ताकि मूल दिशासूचक मुहावरा सुरक्षित रहे।
- source_word: በሐውርተ፡ አሕዛብ
  choice: राष्ट्रों के सभी देश
  rationale: गीज़ पद देशों/भूमियों का बहुवचन सूचित करता है, ‘परिवारों’ का नहीं; इसलिए स्रोत-संगत ‘देश’ चुना गया।
- source_word: ይትባረኩ
  choice: आशीष पाएँगे
  rationale: निष्क्रिय क्रिया का अर्थ ‘आशीष दिए जाएँगे/आशीष पाएँगे’ है; आधुनिक हिन्दी में ‘आशीष पाएँगे’ अधिक सहज है और वाच्य का भाव बनाए रखता है।
theological_decisions:
- issue: 'आशीष का माध्यम: ‘तुममें और तुम्हारे वंश में’'
  choice: दोनों पदों को यथावत रखा गया
  alternative: ‘तुम्हारे द्वारा और तुम्हारे वंश द्वारा’
  rationale: स्रोत का संबंधसूचक ‘में’ माध्यम, सहभागिता या संबंध की संभावित अर्थ-छायाओं को खुला रखता है; ‘द्वारा’ अर्थ को अनावश्यक रूप से निश्चित कर देता।
- issue: सामूहिक ‘वंश’ की संख्या-संबंधी अस्पष्टता
  choice: एकवचन सामूहिक संज्ञा ‘वंश’
  alternative: ‘वंशज’ या ‘संतानें’
  rationale: यह चयन मूल के सामूहिक एकवचन और उसकी संभावित धर्मवैचारिक तनावशीलता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। दिशाओं की समानांतर रचना बनाए रखी गई है। ‘समुद्र’ को ‘पश्चिम’ में नहीं बदला गया, और मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
