  text: Rise and go to Mesopotamia, to the house of Bethuel, your mother’s father, and take for yourself a wife from there, from the daughters of Laban, your mother’s brother.
translation:
  language: hi
  text: उठ और मेसोपोटामिया में अपनी माता के पिता बतूएल के घर जा, और वहाँ से अपनी माता के भाई लाबान की बेटियों में से अपने लिए एक पत्नी ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥእ
  choice: उठ
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ፄስጶጦሚያ
  choice: मेसोपोटामिया
  rationale: स्थान-नाम का प्रचलित आधुनिक हिन्दी लिप्यंतरण; स्रोत-पाठ में इसी भू-नाम का रूप है।
- source_word: ቤተ፡ ባቱኤል
  choice: बतूएल के घर
  rationale: ‘घर/परिवार’ के मूल अर्थ को रखते हुए सम्बन्धसूचक हिन्दी संरचना अपनाई गई।
- source_word: ወንሣእ፡ ለከ፡ ብእሲተ
  choice: अपने लिए एक पत्नी ले
  rationale: क्रिया, हितसूचक सर्वनाम और ‘पत्नी’ को स्पष्ट तथा स्रोत के निकट रखा गया।
- source_word: እምአዋልደ፡ ላባ
  choice: लाबान की बेटियों में से
  rationale: स्रोत के बहुवचन और चयनसूचक ‘में से’ दोनों को सुरक्षित रखा गया।
- source_word: እኁሃ፡ ለእምከ
  choice: अपनी माता के भाई
  rationale: रिश्ते को स्रोत के अनुसार सीधे व्यक्त किया गया; स्वाभाविक हिन्दी में ‘मामा’ सम्भव था, पर औपचारिक समानता हेतु विश्लेषणात्मक रूप चुना गया।
