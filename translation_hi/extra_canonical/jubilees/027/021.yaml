translation:
  language: hi
  text: और इसहाक ने रिबका को उसके पुत्र याकूब के विषय में सांत्वना दी, और याकूब को आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይናዘዛ
  choice: सांत्वना दी
  rationale: यह क्रिया इस प्रसंग में ढाढ़स देने या सांत्वना देने का भाव व्यक्त करती है; आधुनिक हिन्दी में ‘सांत्वना दी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: በእንተ
  choice: के विषय में
  rationale: गीज़ संबंधसूचक पद का अर्थ यहाँ ‘के विषय में/के कारण’ हो सकता है; ‘के विषय में’ स्रोत की व्यापकता और अंग्रेज़ी परामर्श-पाठ के अर्थ को बनाए रखता है।
- source_word: ባረኮ
  choice: उसे आशीर्वाद दिया
  rationale: क्रिया का अर्थ ‘आशीर्वाद देना’ है। पुल्लिंग एकवचन कर्मसूचक अर्थ निकटवर्ती याकूब की ओर संकेत करता है।
theological_decisions:
- issue: आशीर्वाद पाने वाले व्यक्ति की पहचान
  choice: ‘उसे’ को याकूब के संदर्भ में रखा गया
  alternative: रिबका को आशीर्वाद दिया
  rationale: गीज़ रूप और वाक्य-संरचना, साथ ही उपलब्ध परामर्श-पाठ, आशीर्वाद के प्राप्तकर्ता के रूप में याकूब का समर्थन करते हैं; हिन्दी में सर्वनाम रखकर स्रोत की संक्षिप्तता सुरक्षित की गई है।
- issue: इसहाक द्वारा रिबका को सांत्वना देने का आधार
  choice: ‘याकूब के विषय में’
  alternative: ‘याकूब के कारण’
  rationale: संबंधसूचक पद दोनों छायाएँ दे सकता है। ‘के विषय में’ कारण को अनावश्यक रूप से निश्चित किए बिना संबंध व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट वाक्य। ‘रिबका’ और ‘याकूब’ प्रचलित बाइबलीय नाम-रूप हैं; किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
