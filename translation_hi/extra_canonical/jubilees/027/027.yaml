  yaml_path: translation/extra_canonical/jubilees/027/027.yaml
  text: And behold, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.
translation:
  language: hi
  text: और देख, मैं तेरे साथ रहूँगा और जहाँ कहीं तू जाएगा, वहाँ तेरी रक्षा करूँगा; और तुझे सकुशल इस देश में वापस ले आऊँगा। क्योंकि मैं तुझे तब तक नहीं छोड़ूँगा, जब तक मैं वह सब न कर लूँ जो मैंने तुझसे कहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነየ
  choice: और देख
  rationale: ध्यान आकर्षित करने वाले आरंभिक पद का निकट और स्वाभाविक हिन्दी रूप; प्रसंग की गंभीरता बनाए रखता है।
- source_word: እዐቅበከ
  choice: तेरी रक्षा करूँगा
  rationale: क्रिया में निगरानी, संभाल और सुरक्षा का भाव है; आधुनिक हिन्दी में ‘रक्षा करना’ स्पष्ट और स्वाभाविक है।
- source_word: በኵለን፡ ወእዴ፡ ሖርከ
  choice: जहाँ कहीं तू जाएगा
  rationale: गमन के प्रत्येक स्थान को व्यक्त करने वाली स्रोत-अभिव्यक्ति का स्वाभाविक हिन्दी रूप।
- source_word: በሰላም
  choice: कुशल से
  rationale: यहाँ केवल आंतरिक शांति नहीं, सुरक्षित और सकुशल लौटने का भाव है; ‘कुशल से’ उसी प्रसंगगत अर्थ को व्यक्त करता है।
- source_word: ኢየኀድገከ
  choice: मैं तुझे नहीं छोड़ूँगा
  rationale: त्याग देने या साथ छोड़ देने की प्रतिज्ञात्मक नकारात्मक क्रिया का सीधा रूप।
theological_decisions:
- issue: ईश्वरीय उपस्थिति और संरक्षण की प्रतिज्ञा
  choice: प्रतिज्ञा को प्रथम पुरुष भविष्यकाल में बिना विस्तार के रखा गया है
  alternative: इसे सर्वकालिक या सार्वभौमिक धर्मशास्त्रीय कथन के रूप में विस्तार देना
  rationale: स्रोत विशेष संबोधित व्यक्ति से की गई प्रतिज्ञा देता है; अनुवाद इसकी सीमा और तनाव को ज्यों का त्यों रखता है।
- issue: प्रतिज्ञा की अवधि
  choice: ‘जब तक ... तब तक’ से स्रोत की समय-संबंधी संरचना सुरक्षित रखी गई है
  alternative: ‘मैं कभी तुझे नहीं छोड़ूँगा’
  rationale: ‘कभी नहीं’ स्रोत के ‘जब तक मैं सब पूरा न कर लूँ’ को अनावश्यक रूप से सार्वकालिक बना देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। एकवचन निकट संबोधन के लिए ‘तू/तेरे/तुझे’ रखा गया है, क्योंकि प्रतिज्ञा सीधे एक व्यक्ति को संबोधित है और बाइबिलीय शैली में यह अपमानसूचक नहीं है।
