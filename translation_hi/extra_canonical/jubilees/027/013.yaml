  text: And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.
translation:
  language: hi
  text: और सर्वशक्तिमान परमेश्वर तुम्हें आशीष दे, तुम्हें फलवन्त करे और तुम्हारी संख्या बढ़ाए; और तुम जातियों का एक समुदाय बनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ሰዳይ
  choice: सर्वशक्तिमान परमेश्वर
  rationale: यह ‘एल शद्दाय’ के समतुल्य पारंपरिक और सहज हिन्दी पद है; इसमें ईश्वर के नाम/उपाधि का धार्मिक भार बना रहता है।
- source_word: ይባርከ
  choice: आशीष दे
  rationale: आशीर्वाद की प्रार्थना व्यक्त करने वाले स्रोत क्रियारूप का स्वाभाविक हिन्दी अनुवाद।
- source_word: ያልህቀ
  choice: फलवन्त करे
  rationale: संदर्भ में संतानोत्पत्ति और वंश-वृद्धि का भाव है; ‘फलवन्त’ बाइबलीय गरिमा और अर्थ दोनों बनाए रखता है।
- source_word: ያብዝኀከ
  choice: तुम्हारी संख्या बढ़ाए
  rationale: ‘तुम्हें बढ़ाए’ की अपेक्षा आधुनिक हिन्दी में बहुगुणित होने का आशय अधिक स्पष्ट करता है, बिना उसे केवल धन या सामर्थ्य की वृद्धि मानने के।
- source_word: መክብበ፡ አሕዛብ
  choice: जातियों का एक समुदाय
  rationale: संज्ञा-समूह में अनेक जनसमूहों के संगठित समुदाय का भाव है; ‘सभा’ भी संभव है, पर ‘समुदाय’ आधुनिक पाठक के लिए अधिक सहज है।
theological_decisions:
- issue: ‘सर्वशक्तिमान परमेश्वर’ को उपाधि मानना या निजी नाम का लिप्यंतरण करना
  choice: सर्वशक्तिमान परमेश्वर
  alternative: एल शद्दाय
  rationale: स्रोत में गीइज़ रूप अर्थानुवादित ईश्वरीय उपाधि के रूप में समझा जा सकता है; हिन्दी में अर्थानुवाद सामान्य पाठक के लिए स्पष्ट है और कोई संप्रदायगत व्याख्या नहीं जोड़ता।
- issue: ‘जातियों का समुदाय’ की सामूहिक पहचान
  choice: अर्थ को खुला रखा गया है
  alternative: राष्ट्रों की सभा / अनेक जातियों का पूर्वज
  rationale: स्रोत सीधे यह नहीं बताता कि यह संतान, वंश या राजनीतिक राष्ट्रों की बात है; इसलिए पाठ में उस अस्पष्टता को अतिरिक्त व्याख्या से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण बाइबलीय शैली। एकवचन आत्मीय ‘तुम’ रखा गया है। समानांतर क्रियाओं की लय बनाए रखते हुए ‘तुम्हारी संख्या’ जोड़कर वृद्धि का आशय स्वाभाविक हिन्दी में स्पष्ट किया गया है।
