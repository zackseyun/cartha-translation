- source_word: እኁሃ፡ ለርብቃ
  choice: रिबका का भाई
  rationale: संबंधवाचक पदबंध का सीधा और स्पष्ट अनुवाद।
- source_word: እሙ፡ ለያዕቆብ
  choice: याकूब का मामा
  rationale: शाब्दिक रूप ‘याकूब की माता’ पूर्ववर्ती रिबका का पुनरुल्लेख करता है; हिन्दी में संबंध-श्रृंखला को स्वाभाविक और स्पष्ट बनाने के लिए लाबान को ‘याकूब का मामा’ कहा गया।
