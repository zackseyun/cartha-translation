lexical_decisions:
- source_word: ወፈነዎ፡ ይስሐቅ፡ ለያዕቆብ
  choice: और इसहाक ने याकूब को विदा किया
  rationale: क्रिया का अर्थ भेज देना या विदा करना है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘विदा किया’ चुना गया।
- source_word: መስጶጦሚያ
  choice: मेसोपोटामिया
  rationale: मूल पाठ के भौगोलिक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया।
- source_word: ሶርያዊ
  choice: अरामी
