translation:
  language: hi
  text: और इसहाक ने याकूब को भेज दिया, और वह मेसोपोटामिया में सीरियाई बतूएल के पुत्र लाबान के पास गया। लाबान रिबका का भाई था, और रिबका याकूब की माता थी।
