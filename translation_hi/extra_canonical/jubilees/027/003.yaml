  text: and until he turns his anger away from you and he forgets all that you did to him. Then I will send and bring you back from there.”
translation:
  language: hi
  text: और जब तक वह तुम पर से अपना क्रोध हटा न ले[a] और जो कुछ तुमने उसके साथ किया है, वह सब भूल न जाए। तब मैं किसी को भेजकर तुम्हें वहाँ से वापस ले आऊँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक तुम्हारे भाई का क्रोध तुमसे दूर न हो जाए।”
    reason: यह पहले प्रचलित पाठ-व्याख्या को दर्शाता है, यद्यपि गीज़ व्याकरण में ‘क्रोध’ को कर्म मानना अधिक उपयुक्त है।
lexical_decisions:
- source_word: የኀድግ፡ መዐተ፡ እምኔከ
  choice: वह तुम पर से अपना क्रोध हटा न ले
  rationale: क्रोध यहाँ क्रिया का कर्म है; इसलिए वाक्य को ‘उसका क्रोध तुमसे दूर हो जाए’ के बजाय कर्ता ‘वह’ और कर्म ‘अपना क्रोध’ के साथ रखा गया है। हिंदी मुहावरे में ‘तुम पर से’ क्रोध के लक्ष्य से हटने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ይረስዕ፡ ኵሎ፡ ዘመጠነ፡ ረሰይኮ
  choice: जो कुछ तुमने उसके साथ किया है, वह सब भूल न जाए
  rationale: मूल पाठ के ‘सब/जितना तुमने किया’ के व्यापक भाव को रखा गया है; प्रसंग के आधार पर ‘उसके साथ’ जोड़ा गया है ताकि हिंदी में कर्म-संबंध स्पष्ट और स्वाभाविक रहे।
- source_word: ወፈነውየ፡ አቄብለከ፡ እምህየ
  choice: तब मैं किसी को भेजकर तुम्हें वहाँ से वापस बुलवा लूँगी
  rationale: ‘भेजना’ और ‘वहाँ से वापस लाना/बुलाना’ दोनों क्रियात्मक तत्व सुरक्षित हैं। ‘बुलवा लूँगी’ प्रसंगानुकूल स्वाभाविक हिंदी है और वक्ता द्वारा दूत भेजने का आशय व्यक्त करता है।
theological_decisions:
- issue: क्रोध वाले उपवाक्य का कर्ता और कर्म
  choice: ‘वह’ को कर्ता और ‘अपना क्रोध’ को कर्म माना गया है।
  alternative: ‘तुम्हारे भाई का क्रोध तुमसे दूर हो जाए।’
  rationale: गीज़ पाठ में ‘क्रोध’ कर्मरूप में है, इसलिए संशोधित व्याकरणिक विश्लेषण को मुख्य पाठ में अपनाया गया है; फिर भी पारंपरिक वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। संबोधन अनौपचारिक एकवचन ‘तुम’ में है, जो माता द्वारा पुत्र से कही गई बात के प्रसंग के अनुकूल है।
