lexical_decisions:
- source_word: እበውእ
  choice: मैं भीतर जाकर
  rationale: क्रिया का मूल अर्थ ‘मैं प्रवेश करूँगी/भीतर जाऊँगी’ है; हिंदी में अगली क्रिया के साथ ‘भीतर जाकर’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: እነግር
  choice: बात करूँगी
  rationale: यहाँ रिबका का इसहाक से बात करना अभिप्रेत है; कर्म मूल पाठ में व्यक्त नहीं है, इसलिए हिंदी में भी उसे अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ይፈንወከ
  choice: वह तुम्हें भेज देगा
  rationale: क्रिया का अर्थ याकूब को भेजना है, न कि उसे बुलवा भेजना; गंतव्य मूल वाक्य में अनकहा छोड़ा गया है।
