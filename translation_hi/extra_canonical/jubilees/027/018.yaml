  text: The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.
translation:
  language: hi
  text: परमप्रधान परमेश्वर उसे हर बुराई से बचाएगा और उसके साथ रहेगा, क्योंकि वह जीवन भर उसे नहीं छोड़ेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: परमप्रधान परमेश्वर
  rationale: यह पदबंध ‘सर्वोच्च/परमप्रधान परमेश्वर’ को सूचित करता है; हिन्दी में यह स्वाभाविक और गरिमापूर्ण ईश्वरीय उपाधि है।
- source_word: የዐቅቦ
  choice: बचाएगा
  rationale: मूल क्रिया रक्षा करने या सुरक्षित रखने का भाव देती है; ‘बचाएगा’ सामान्य आधुनिक हिन्दी में इस संदर्भ को स्पष्ट रूप से व्यक्त करता है।
- source_word: እምኵሉ፡ እኩይ
  choice: हर बुराई से
  rationale: शाब्दिक अर्थ ‘समस्त बुराई/अनिष्ट से’ है; यह नैतिक बुराई और हानि, दोनों की संभावित व्यापकता बनाए रखता है।
- source_word: ወይሄሉ፡ ምስሌሁ
  choice: और उसके साथ रहेगा
  rationale: मूल में साथ होने की प्रतिज्ञा है; हिन्दी का भविष्यकाल प्रसंग और समानांतर क्रियाओं के अनुरूप है।
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: जीवन भर
  rationale: शाब्दिक रूप से ‘उसके सभी दिन’; स्वाभाविक हिन्दी में ‘जीवन भर’ वही कालगत समग्रता व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय संरक्षण का विस्तार
  choice: ‘हर बुराई से’ की व्यापक अभिव्यक्ति बनाए रखी गई
  alternative: ‘हर विपत्ति से’
  rationale: मूल እኩይ ‘बुराई/अनिष्ट’ के व्यापक अर्थ को वहन करता है; केवल ‘विपत्ति’ कहना इसे बाहरी संकट तक सीमित कर सकता है।
- issue: अंतिम सर्वनाम का कर्ता
  choice: ‘वह’ को परमेश्वर के लिए और ‘उसे’ को संरक्षित व्यक्ति के लिए रखा गया
  alternative: संज्ञा दोहराकर ‘परमेश्वर उसे...’
  rationale: मूल वाक्य का सर्वनाम-संबंध पर्याप्त स्पष्ट है; हिन्दी में इसे बनाए रखने से शैली सहज रहती है और कोई अतिरिक्त व्याख्या नहीं जुड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। मूल के चार दावों—परमप्रधान परमेश्वर, सर्वांगीण रक्षा, साथ रहना और जीवनपर्यंत न छोड़ना—को संक्षिप्त एवं स्वाभाविक रूप में सुरक्षित रखा गया है।
