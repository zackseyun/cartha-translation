  text: And Jacob rose early in the morning and took the stone that he had placed by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.
translation:
  language: hi
  text: और याकूब भोर को उठा। उसने वह पत्थर लिया जिसे उसने अपने सिर के पास रखा था, और उसे चिह्न के रूप में एक स्तंभ खड़ा किया। फिर उसने उसके ऊपरी सिरे पर तेल उँडेला। उसने उस स्थान का नाम बेतेल रखा, यद्यपि पहले उस प्रदेश का नाम लूज़ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በነግህ
  choice: भोर को
  rationale: गीज़ पद का अर्थ प्रातःकाल या बहुत सवेरे है; ‘भोर को’ सहज और संक्षिप्त आधुनिक हिन्दी है।
- source_word: እብነ፡ ዘአንበረ፡ ኀበ፡ ርእሱ
  choice: वह पत्थर ... जिसे उसने अपने सिर के पास रखा था
  rationale: ‘ኀበ ርእሱ’ स्थान-सूचक है; ‘सिर के पास’ मूल की अपेक्षा ‘सिरहाने’ से कम व्याख्यात्मक है।
- source_word: ሐውልተ፡ ለትእምርት
  choice: एक चिह्न के लिए स्तंभ
  rationale: दोनों संज्ञाओं—स्तंभ और चिह्न—को स्पष्ट रखते हुए उद्देश्य/भूमिका का संबंध सुरक्षित किया गया है।
- source_word: ዲበ፡ ርእሱ
  choice: उसके ऊपरी सिरे पर
  rationale: पत्थर/स्तंभ के ‘सिर’ का स्वाभाविक हिन्दी रूप ‘ऊपरी सिरा’ है।
- source_word: ብሔር
  choice: प्रदेश
  rationale: यहाँ शब्द स्थान से व्यापक भूभाग/क्षेत्र को सूचित करता है; ‘प्रदेश’ इस भेद को बनाए रखता है।
