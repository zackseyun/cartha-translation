  yaml_path: translation/extra_canonical/jubilees/027/022.yaml
  text: And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to a certain place at evening, and he turned aside from his road to the west of the road that night, and he slept there, because the sun had set.
translation:
  language: hi
  text: और याकूब शपथ के कुएँ से हारान जाने के लिए निकला। यह चौवालीसवीं जुबली के दूसरे सप्ताह का पहला वर्ष था। उस सप्ताह के पहले महीने के नवचंद्र के दिन वह पहाड़ी प्रदेश में स्थित लूज़, अर्थात् बेतेल, पहुँचा। शाम को वह एक स्थान पर पहुँचा और उस रात अपने मार्ग से हटकर मार्ग के पश्चिम की ओर मुड़ गया।[a] वह वहीं सो गया, क्योंकि सूर्य अस्त हो चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन पदबंध का एक अन्य सम्भव अर्थ है, “और उस रात वह अपने मार्ग से हट गया।”
    reason: गीइज़ वाक्यांश में ‘पश्चिम’ और ‘मार्ग’ का व्याकरणिक संबंध कुछ अस्पष्ट है। मुख्य पाठ दिशात्मक अर्थ को रखता है, जबकि यह पादटिप्पणी संक्षिप्त वैकल्पिक अर्थ देती है।
lexical_decisions:
- source_word: ዐዘቆተ፡ መሐላ
  choice: शपथ का कुआँ
  rationale: स्थान-नाम के घटकों का अर्थ स्पष्ट रखते हुए गीइज़ पदबंध का सीधा और स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: जुबली की कालगणना में प्रयुक्त सात वर्षों की इकाई को परंपरागत और सुबोध ‘सप्ताह’ से व्यक्त किया गया है; संदर्भ इसे साधारण सात दिनों से अलग करता है।
- source_word: በሠርቀ፡ ወርኅ
  choice: नवचंद्र के दिन
  rationale: शाब्दिक रूप से चंद्रमा के उदय/नए चंद्रमा का संकेत है; ‘नवचंद्र’ प्राचीन मासारंभ को ‘अमावस्या’ से अनावश्यक रूप से समान ठहराए बिना व्यक्त करता है।
- source_word: መካነ፡ መሴየ
  choice: शाम को वह एक स्थान पर पहुँचा
  rationale: स्थान की अनिश्चितता को ‘एक स्थान’ से और समय-सूचक भाव को ‘शाम को’ से स्वाभाविक हिन्दी में रखा गया है।
- source_word: እምፍኖቱ
  choice: अपने रास्ते से
  rationale: स्रोत के तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय को ‘अपने’ से स्पष्ट किया गया है।
- source_word: እንተ፡ ዐረበን፡ ለመንገደ
  choice: सड़क के पश्चिम की ओर
  rationale: दिशा बताने वाले ‘पश्चिम’ के तत्व को छोड़े बिना वाक्य को आधुनिक हिन्दी में पठनीय बनाया गया है।
