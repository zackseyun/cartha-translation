  yaml_path: translation/extra_canonical/jubilees/027/028.yaml
  text: And Jacob awoke from his sleep and said, “Surely this place is the house of the Lord, and I did not know it.” And he was afraid and said, “How awesome this place is! This is none other than the house of the Lord, and this is the gate of heaven.”
translation:
  language: hi
  text: और याकूब नींद से जागा और उसने कहा, “निश्चय ही यह स्थान प्रभु का भवन है, और मुझे यह पता नहीं था।” तब वह डर गया और बोला, “यह स्थान कितना विस्मयकारी है! यह प्रभु के भवन के सिवा और कुछ नहीं है; और यही स्वर्ग का द्वार है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማን
  choice: निश्चय ही
  rationale: यह पुष्टि और अचानक हुए बोध का स्वाभाविक हिन्दी रूप है।
- source_word: ቤቱ፡ ለእግዚአብሔር
  choice: प्रभु का भवन
  rationale: शाब्दिक अर्थ ‘प्रभु का घर/भवन’ है; ‘भवन’ यहाँ पवित्र स्थान के गरिमापूर्ण भाव को बनाए रखता है।
- source_word: ግሩም
  choice: विस्मयकारी
  rationale: यह शब्द भय, श्रद्धा और आश्चर्य के संयुक्त भाव को व्यक्त करता है; केवल ‘भयानक’ कहना अर्थ को अनावश्यक रूप से नकारात्मक बना देता।
- source_word: አንቀጸ፡ ሰማይ
  choice: स्वर्ग का द्वार
  rationale: स्रोत की ठोस रूपकात्मक अभिव्यक्ति का सीधा और प्रचलित हिन्दी अनुवाद।
theological_decisions:
- issue: स्थान को ‘प्रभु का भवन’ कहने का आशय
  choice: कथन को बिना व्याख्यात्मक विस्तार के प्रत्यक्ष रूप में रखा गया।
  alternative: ‘यहाँ प्रभु उपस्थित हैं’ जैसे अर्थ-स्पष्टीकरण को मुख्य पाठ में जोड़ना।
  rationale: स्रोत स्वयं स्थान को प्रभु का भवन कहता है; रूपक या पवित्र-स्थान संबंधी धार्मिक तनाव को अनुवाद में सुलझाना उचित नहीं।
- issue: ግሩም में भय और श्रद्धा का मिश्रण
  choice: ‘विस्मयकारी’
  alternative: ‘भयानक’ या ‘श्रद्धा जगाने वाला’
  rationale: प्रसंग में याकूब का डरना स्पष्ट रूप से अलग कथन में मौजूद है; ‘विस्मयकारी’ अगले उद्गार में भयमिश्रित श्रद्धा और आश्चर्य की व्यापकता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। संवाद में ‘कहा/बोला’ का स्वाभाविक प्रयोग किया गया है और स्रोत की पुनरुक्ति तथा दो क्रमिक उद्गार सुरक्षित रखे गए हैं।
