  text: And after Jacob had arisen to go to Mesopotamia, the spirit of Rebekah was grieved over her son, and she wept.
translation:
  language: hi
  text: और याकूब के मेसोपोटामिया जाने के लिए उठ खड़े होने के बाद, रिबका का मन अपने पुत्र के लिए दुःखी हुआ, और वह रोई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥአ
  choice: उठ खड़ा हुआ
  rationale: क्रिया के ‘उठने’ के मूल अर्थ को रखते हुए आगामी यात्रा के लिए तैयार होकर उठने का स्वाभाविक हिन्दी भाव व्यक्त करता है।
- source_word: ሰሐዊረ
  choice: जाने के लिए
  rationale: यात्रा करने या प्रस्थान करने के आशय को साधारण आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: መስጶጦሚያ
  choice: मेसोपोटामिया
  rationale: स्थान-नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: መንፈሰ፡ ርብቃ
  choice: रिबका का मन
  rationale: शाब्दिक ‘रिबका की आत्मा’ यहाँ उसकी भीतरी भाव-दशा को बताता है; हिन्दी में ‘मन’ उसी अर्थ को अधिक स्वाभाविक ढंग से पहुँचाता है।
- source_word: ድኅረ፡ ወልዳ
  choice: अपने पुत्र के कारण
  rationale: संदर्भ में पुत्र से बिछुड़ने पर हुए शोक का संबंध व्यक्त करता है और हिन्दी में कालक्रम का भ्रामक अर्थ आने से बचाता है।
