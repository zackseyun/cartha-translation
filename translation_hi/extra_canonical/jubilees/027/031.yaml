  yaml_path: translation/extra_canonical/jubilees/027/031.yaml
  text: and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you, my God.”
translation:
  language: hi
  text: और मैं कुशल-क्षेम से अपने पिता के घर लौट आऊँ, तो प्रभु मेरा परमेश्वर होगा। और यह पत्थर, जिसे मैंने इस स्थान पर चिह्न के लिए स्तम्भ के रूप में स्थापित किया है, प्रभु का भवन होगा। और जो कुछ तू मुझे देगा, उसका दसवाँ भाग मैं निश्चय ही तुझे दूँगा, हे मेरे परमेश्वर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰላም
  choice: कुशल-क्षेम से
  rationale: गीज़ पद का अर्थ केवल आंतरिक शांति नहीं, बल्कि सुरक्षित और सकुशल लौटना भी है; यह स्वाभाविक हिन्दी में उसी व्यापक भाव को रखता है।
- source_word: ሐውልተ፡ ለትእምርት
  choice: एक चिह्न के रूप में स्तम्भ
  rationale: दोनों विचार—खड़ा किया हुआ स्मारक-स्तम्भ और उसका चिह्न होना—स्पष्ट रूप से सुरक्षित रखे गए हैं।
- source_word: ቤተ፡ እግዚአብሔር
  choice: प्रभु का भवन
  rationale: शाब्दिक ‘घर’ सम्भव है, पर पवित्र स्थान के आशय में ‘भवन’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: አሡር
  choice: दसवाँ भाग
  rationale: यह दशमांश देने की क्रिया को साधारण पाठक के लिए सीधे और स्पष्ट ढंग से व्यक्त करता है।
theological_decisions:
- issue: शर्तात्मक वाक्य में ‘प्रभु मेरा परमेश्वर होगा’
  choice: तो प्रभु मेरा परमेश्वर होगा
  alternative: और प्रभु मेरे परमेश्वर बने रहें
  rationale: स्रोत में भावी क्रिया और पूर्ववर्ती शर्तात्मक क्रम की वास्तविक धार्मिक अस्पष्टता को नहीं मिटाया गया; इसे प्रतिज्ञा अथवा शर्त—दोनों रूपों में पढ़े जाने की सम्भावना बनी रहती है।
- issue: पत्थर और प्रभु के भवन का संबंध
  choice: यह पत्थर ... प्रभु का भवन होगा
  alternative: इस स्थान पर प्रभु का भवन होगा
  rationale: स्रोत के प्रत्यक्ष व्याकरणिक संबंध को बनाए रखा गया है, भले ही कथन में प्रतीकात्मक तनाव हो; उसे व्याख्या द्वारा हल नहीं किया गया।
- issue: दसवाँ भाग देने की दृढ़ता
  choice: मैं निश्चय ही तुझे दूँगा
  alternative: मैं तुझे दशमांश दूँगा
  rationale: क्रियात्मक रूप स्रोत की प्रतिज्ञात्मक दृढ़ता को अधिक स्पष्टता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठकों के लिए स्पष्ट किंतु गरिमापूर्ण। परमेश्वर को संबोधित करते समय एकवचन ‘तू/तुझे’ का प्रयोग बाइबिलीय निकटता और मूल के एकवचन संबोधन के अनुरूप है।
