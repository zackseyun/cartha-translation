  text: And he took one of the stones of that place and put it under that tree, and he was traveling alone, and he slept.
translation:
  language: hi
  text: और उसने उस स्थान के पत्थरों में से एक पत्थर लिया और उसे उस पेड़ के नीचे रख दिया। वह अकेला यात्रा कर रहा था[a], और सो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चल रहा था’।
    reason: गीज़ क्रिया የሐውር का अर्थ ‘चलना’, ‘जाना’ अथवा ‘यात्रा करना’ हो सकता है; पादटिप्पणी इस वास्तविक अर्थगत विस्तार को बनाए रखती है।
lexical_decisions:
- source_word: የሐውር (yaḥawwer)
  choice: यात्रा कर रहा था
  rationale: यह क्रिया ‘जाना’, ‘चलना’ या ‘यात्रा करना’ व्यक्त कर सकती है। याकूब की लंबी यात्रा के प्रसंग में ‘यात्रा कर रहा था’ स्वाभाविक है, जबकि पादटिप्पणी में अधिक शाब्दिक विकल्प सुरक्षित रखा गया है।
- source_word: እምእብነ ውእቱ መካን
  choice: उस स्थान के पत्थरों में से एक पत्थर
  rationale: स्रोत की विभाजक अभिव्यक्ति को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ታሕተ ውእቱ ዕፅ
  choice: उस पेड़ के नीचे
  rationale: स्रोत में संकेतवाचक सर्वनाम है; इसलिए केवल ‘पेड़’ के बजाय ‘उस पेड़’ रखा गया है।
- source_word: ባሕቲቱ
  choice: अकेला
  rationale: पुल्लिंग एकवचन रूप का सीधा और स्वाभाविक हिन्दी समतुल्य।
