  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। स्रोत के क्रम और दोहराए गए संकेतवाचक भाव को यथासंभव बनाए रखते हुए वाक्य को सामान्य पाठक के लिए स्वाभाविक रखा गया है।
