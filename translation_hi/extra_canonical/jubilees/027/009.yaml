  text: And Rebekah went in and said to Isaac, “I loathe my life because of the two daughters of Heth whom Esau has taken for himself as wives.
translation:
  language: hi
  text: और रिबका भीतर गई और इसहाक से कहा, “एसाव ने हित्त की जिन दो बेटियों को अपनी पत्नियाँ बनाया है, उनके कारण मुझे अपने जीवन से घृणा हो गई है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቦአት
  choice: और ... भीतर गई
  rationale: क्रिया का मूल अर्थ प्रवेश करना है; प्रसंग में रिबका का इसहाक के पास भीतर जाना स्वाभाविक रूप से व्यक्त होता है।
- source_word: ገእዝኩ፡ ሕይወትየ
  choice: मुझे अपने जीवन से घृणा हो गई है
  rationale: गीज़ अभिव्यक्ति जीवन के प्रति तीव्र विरक्ति बताती है; आधुनिक हिन्दी में यह अर्थ स्पष्ट और गरिमापूर्ण है।
- source_word: እምክልኤሆን፡ አዋልደ፡ ኬጥ
  choice: हित्त की ... दो बेटियों ... के कारण
  rationale: द्विवचन-सदृश संख्या और कारणसूचक संबंध दोनों सुरक्षित रखे गए हैं; जातिनाम को प्रचलित बाइबलीय हिन्दी रूप ‘हित्त’ में दिया गया है।
- source_word: እለ፡ ነሥአ፡ ዔሳው፡ ሎቱ፡ አንስትያ
  choice: जिन ... को एसाव ने अपनी पत्नियाँ बनाया है
  rationale: शाब्दिक अर्थ ‘जिन्हें एसाव ने अपने लिए पत्नियों के रूप में लिया’ है; हिन्दी में ‘अपनी पत्नियाँ बनाया’ उसी वैवाहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
