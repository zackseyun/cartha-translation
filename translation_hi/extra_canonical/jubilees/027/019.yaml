  text: For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.
translation:
  language: hi
  text: क्योंकि मैं जानती हूँ कि वह जहाँ कहीं जाएगा, उसके मार्ग हर बात में सफल होंगे, जब तक कि वह कुशल से हमारे पास लौट न आए और हम उसे कुशल से न देख लें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አአምር
  choice: मैं जानती हूँ
  rationale: क्रिया प्रथम पुरुष एकवचन है; प्रसंग में वक्ता रिबका है, इसलिए हिन्दी में स्त्रीलिंग स्वाभाविक है।
- source_word: ይሤራኅ ፍኖዊሁ
  choice: उसके मार्ग ... सफल होंगे
  rationale: शाब्दिक अर्थ ‘उसके मार्ग सफल/समृद्ध होंगे’ को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: በኵሉ ውእደ ሖረ
  choice: हर बात में, जहाँ कहीं जाएगा
  rationale: दोनों व्यापकता-सूचक तत्वों—‘हर बात में’ और गमन के हर स्थान—को सुरक्षित रखा गया है।
- source_word: በሰላም
  choice: कुशल से
  rationale: लौटने और फिर से देखने, दोनों के साथ आए ‘शांति/सलामती में’ का सहज हिन्दी समतुल्य; स्रोत की पुनरावृत्ति भी रखी गई है।
