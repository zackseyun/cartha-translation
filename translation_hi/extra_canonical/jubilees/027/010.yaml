  text: And if Jacob takes a wife from among the daughters of the land like these, why should I still live? For the daughters of Canaan are evil.”
translation:
  language: hi
  text: और यदि याकूब इस देश की इन जैसी बेटियों में से किसी को पत्नी बना ले, तो मैं फिर क्यों जीवित रहूँ? क्योंकि कनान की बेटियाँ बुरी हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ ... ብእሲተ
  choice: किसी को पत्नी बना ले
  rationale: गीज़ अभिव्यक्ति का अर्थ ‘पत्नी ग्रहण करना’ है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट रूप है।
- source_word: አዋልደ፡ ምድር
  choice: इस देश की बेटियों
  rationale: शाब्दिक अर्थ ‘भूमि/देश की बेटियाँ’ है; संदर्भ में स्थानीय स्त्रियों का संकेत बनाए रखा गया है।
- source_word: ለምንት፡ ሊተ፡ እንከ፡ አሐዩ
  choice: तो मेरे जीवित रहने का क्या लाभ?
  rationale: मूल का प्रश्न ‘तब मैं क्यों जीवित रहूँ?’ निराशा और जीवन की निरर्थकता व्यक्त करता है; हिन्दी में यह मुहावरेदार रूप उसी आशय को संप्रेषित करता है।
- source_word: እኩያት
  choice: बुरी
  rationale: मूल विशेषण नैतिक रूप से ‘बुरी/दुष्ट’ का अर्थ देता है; सरल ‘बुरी’ अनावश्यक तीव्रता जोड़े बिना अर्थ रखता है।
theological_decisions:
- issue: कनान की बेटियों के विषय में सामूहिक नकारात्मक कथन
  choice: क्योंकि कनान की बेटियाँ बुरी हैं
  alternative: क्योंकि ये कनानी स्त्रियाँ दुष्ट हैं
  rationale: मूल के व्यापक, तनावपूर्ण कथन को नरम या विशिष्ट व्यक्तियों तक सीमित नहीं किया गया; साथ ही ‘बुरी’ मूल के सामान्य विशेषण के अधिक निकट है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘भी’ से प्रसंगगत समानता व्यक्त होती है: याकूब भी एसाव की तरह ऐसी पत्नी चुन सकता है। उद्धरण के अंत को बनाए रखा गया है।'
