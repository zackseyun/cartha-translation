  yaml_path: translation/extra_canonical/jubilees/027/020.yaml
  text: Do not fear for him, my sister, for he is upright in his way, and he is a blameless man, and he is faithful, and he will not be forsaken. Do not weep.
translation:
  language: hi
  text: “मेरी बहन, उसके लिए मत डर, क्योंकि वह अपने मार्ग पर खरा है; वह निर्दोष मनुष्य और विश्वासयोग्य है, और उसे त्यागा नहीं जाएगा। मत रो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትፍርሂ፡ በእንቲአሁ
  choice: उसके विषय में मत डर
  rationale: निषेधात्मक आज्ञा और संबंधसूचक पदबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: እኅትየ
  choice: हे मेरी बहन
  rationale: प्रत्यक्ष संबोधन और आत्मीय संबंध दोनों सुरक्षित रखता है।
- source_word: ሪትዕ፡ በፍኖቱ
  choice: अपने मार्ग में सीधा
  rationale: ‘मार्ग’ को स्रोत के एकवचन के अनुसार रखा और नैतिक खराई का अर्थ सुरक्षित किया।
- source_word: ፍጹም፡ ውእቱ፡ ብእሲ
  choice: वह निर्दोष मनुष्य है
  rationale: ፍጹም का शाब्दिक अर्थ ‘पूर्ण’ हो सकता है, पर इस नैतिक संदर्भ में ‘निर्दोष’ अधिक स्वाभाविक और सटीक है।
- source_word: ምእመን፡ ውእቱ
  choice: विश्वासयोग्य है
  rationale: व्यक्ति की निष्ठा और भरोसेमंदी व्यक्त करता है।
- source_word: ወኢይትገደፍ
  choice: और उसे त्यागा नहीं जाएगा
  rationale: स्रोत में उपस्थित निषेधात्मक कर्मवाच्य भाव को स्पष्ट रूप से सुरक्षित रखता है; इसे पूर्ववर्ती वाक्य में विलीन या लोप नहीं किया गया।
- source_word: ኢትብከዪ
  choice: मत रो
  rationale: स्त्रीलिंग एकवचन को संबोधित संक्षिप्त निषेधात्मक आज्ञा का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘उसे त्यागा नहीं जाएगा’ में कर्ता अनुल्लिखित है
  choice: कर्मवाच्य रूप बनाए रखा
  alternative: ‘परमेश्वर उसे नहीं त्यागेगा’
  rationale: गीज़ पाठ त्यागने वाले कर्ता का नाम नहीं बताता; ‘परमेश्वर’ जोड़ना निहितार्थ की व्याख्या होता, अनुवाद नहीं।
- issue: ፍጹም का नैतिक आशय
  choice: निर्दोष
  alternative: पूर्ण / सिद्ध
  rationale: ‘निर्दोष’ संदर्भ में चरित्रगत अखंडता को स्वाभाविक ढंग से व्यक्त करता है और मनुष्य की निरपेक्ष निष्पापता का अनावश्यक धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। स्रोत की क्रमिक समानांतर रचना और अंतिम सांत्वनात्मक आज्ञा को बनाए रखा गया है।
