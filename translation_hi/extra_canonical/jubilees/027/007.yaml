lexical_decisions:
- source_word: ይትመዓዕ
  choice: क्रोधित होकर
  rationale: क्रोध करने या अप्रसन्न होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और अगले क्रियापद से इसका संबंध बनाए रखता है।
- source_word: ይረግመኒ
  choice: मुझे शाप देंगे
  rationale: क्रिया के शाप देने के अर्थ और प्रथम पुरुष कर्म को सीधे सुरक्षित रखता है।
- source_word: ኢየሐውር
  choice: मैं नहीं जाऊँगा
  rationale: निषेध और प्रथम पुरुष गमन को स्पष्ट, आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: ባሕቱ
  choice: तभी
  rationale: इस संदर्भ में अपवादात्मक शर्त—केवल पिता के भेजने पर जाना—को सहज हिन्दी में व्यक्त करता है।
