  text: And now, my son, listen to my voice. Rise and flee to Laban my brother, to Haran, and stay with him a few days, until your brother’s anger turns away,
translation:
  language: hi
  text: और अब, मेरे बेटे, मेरी बात सुन। उठ और हारान में मेरे भाई लाबान के पास भाग जा। कुछ दिन उसके साथ रह, जब तक तेरे भाई का क्रोध दूर न हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስማዕ፡ ቃለየ
  choice: मेरी बात सुन
  rationale: शाब्दिक अर्थ ‘मेरी वाणी सुन’ है; आधुनिक हिन्दी में ‘मेरी बात सुन’ वही आग्रह स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ወጐየይ
  choice: भाग जा
  rationale: क्रिया शीघ्र पलायन करने का भाव रखती है; ‘भाग जा’ प्रसंग की तात्कालिकता बनाए रखता है।
- source_word: ኀበ፡ ላባ፡ እኁየ፡ ሐራንሃ
  choice: हारान में मेरे भाई लाबान के पास
  rationale: गंतव्य और व्यक्ति—हारान तथा लाबान—दोनों को हिन्दी के स्वाभाविक क्रम में स्पष्ट किया गया है।
- source_word: ኅዳጠ፡ መዋዕለ
  choice: कुछ दिन
  rationale: यह पद अल्प अवधि को दर्शाता है; ‘कुछ दिन’ उसका सीधा और सहज हिन्दी रूप है।
- source_word: ይትመየጥ፡ መዐተ፡ እኁከ
  choice: तेरे भाई का क्रोध टल न जाए
  rationale: मूल क्रिया में क्रोध के लौटने या हट जाने का बिंब है। ‘टल जाए’ उस गति-बोध को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
