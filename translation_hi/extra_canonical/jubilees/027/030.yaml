  text: और याकूब ने यह कहते हुए प्रभु से प्रार्थना की, “यदि प्रभु मेरे साथ रहे, जिस मार्ग पर मैं जा रहा हूँ उस पर मेरी रक्षा करे, और मुझे खाने के लिए रोटी और पहनने के लिए वस्त्र दे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸሎተ፡ ለእግዚአብሔር
  choice: प्रभु से प्रार्थना
  rationale: गीज़ पदबंध का स्वाभाविक हिन्दी रूप; ‘प्रार्थना की’ क्रिया के साथ अनावश्यक पुनरुक्ति से बचते हुए आशय सुरक्षित रखा गया है।
- source_word: ዐቀበኒ
  choice: मेरी रक्षा करे
  rationale: मूल क्रिया में रक्षा करने, सुरक्षित रखने और निगरानी रखने का भाव है; यात्रा के प्रसंग में यह सहज और सटीक है।
- source_word: ፍኖት
  choice: मार्ग
  rationale: ‘रास्ता’ भी संभव है, पर ‘मार्ग’ आधुनिक, गरिमापूर्ण और इस प्रार्थना के साहित्यिक स्तर के अनुकूल है।
- source_word: ኅብስተ
  choice: रोटी
  rationale: मूल शब्द का सामान्य अर्थ रोटी/भोजन है; ठोस संज्ञा ‘रोटी’ मूल की अभिव्यक्ति को बनाए रखती है।
- source_word: ልብሰ
  choice: वस्त्र
  rationale: मूल का अर्थ पहनावा या कपड़ा है; ‘वस्त्र’ संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: शर्तसूचक प्रार्थना में ‘यदि प्रभु मेरे साथ रहे’
  choice: यदि प्रभु मेरे साथ रहे
  alternative: यदि परमेश्वर मेरे साथ होगा
  rationale: मूल में शर्तसूचक ‘यदि’ और साथ होने की भाषा स्पष्ट है। इसे प्रतिज्ञा, संशय या सौदेबाज़ी के रूप में व्याख्यायित किए बिना मूल तनाव बनाए रखा गया है।
- issue: ईश्वरीय संबोधन እግዚአብሔር
  choice: प्रभु
  alternative: परमेश्वर
  rationale: इस पाठ-परंपरा और उपलब्ध परामर्श-पाठ के अनुरूप ‘प्रभु’ चुना गया; इससे मूल पद में संबोधन की पुनरावृत्ति भी बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास रखा गया है। पद आगे जारी रहने के कारण अंत में अल्पविराम रखा गया है। ‘प्रार्थना की’ में मूल की संज्ञात्मक पुनरुक्ति (‘प्रार्थना की एक प्रार्थना’) को स्वाभाविक हिन्दी के लिए संक्षिप्त किया गया है।
