lexical_decisions:
- source_word: ኢይሥአን
  choice: वंचित हो जाऊँ
  rationale: गीज़ क्रिया यहाँ संतान खोकर रह जाने या उनसे वंचित होने का भाव व्यक्त करती है; यह हिन्दी में मातृशोक की आशंका को स्वाभाविक ढंग से रखता है।
- source_word: እምክልኤቱ ውሉድየ
  choice: अपने दोनों बेटों से
  rationale: शाब्दिक अर्थ ‘मेरे दोनों पुत्रों में से/से’ है; प्रसंगानुकूल आधुनिक हिन्दी में संबंधसूचक ‘अपने’ अधिक सहज है।
- source_word: በአሐቲ ዕለት
  choice: एक ही दिन
  rationale: ‘एक दिन में’ के मूल अर्थ को रखते हुए ‘ही’ दोनों पुत्रों को उसी दिन खोने की आशंका पर स्वाभाविक बल देता है।
