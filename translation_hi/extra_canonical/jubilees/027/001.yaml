  text: And the matter of Esau her older son was told to Rebekah in a dream. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is bearing a grudge against you, to kill you.”
translation:
  language: hi
  text: और रिबका को स्वप्न में उसके बड़े बेटे एसाव की बात बताई गई। और रिबका ने भेजकर अपने छोटे बेटे याकूब को बुलाया और उससे कहा, “देख, तेरा भाई एसाव तुझसे बैर रखता है, ताकि तुझे मार डाले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገሩ
  choice: बात
  rationale: यह रूप प्रसंग में एसाव से संबंधित बात या मामला सूचित करता है; ‘बात’ स्वाभाविक हिन्दी में इस व्यापकता को बनाए रखता है।
- source_word: ይትቄየመከ
  choice: तुझसे बैर रखता है
  rationale: गीज़ क्रिया यहाँ किसी के विरुद्ध द्वेष या वैर पालने का भाव देती है। यह स्रोत-पाठ के अर्थ को व्यक्त करती है और इब्रानी समानांतर के ‘अपने को सांत्वना देना’ मुहावरे को अनावश्यक रूप से आरोपित नहीं करती।
- source_word: ከመ፡ ይቅትልከ
  choice: और तुझे मार डालना चाहता है
  rationale: शाब्दिक उद्देश्य-वाक्य ‘कि वह तुझे मार डाले’ को सहज हिन्दी में आशय के रूप में व्यक्त किया गया है; हत्या की मंशा स्पष्ट रहती है।
theological_decisions:
- issue: एसाव की मानसिक अवस्था का वर्णन
  choice: तुझसे बैर रखता है
  alternative: तेरे विषय में अपने को सांत्वना देता है
  rationale: वैकल्पिक वाक्यांश उत्पत्ति 27:42 के इब्रानी मुहावरे पर आधारित हो सकता है, पर उपलब्ध गीज़ क्रिया सीधे वैर या द्वेष रखने का अर्थ देती है; इसलिए गीज़ स्रोत को प्राथमिकता दी गई।
