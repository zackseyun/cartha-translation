base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/006.yaml
  text: And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you.”
translation:
  language: hi
  text: और याकूब ने अपनी माता रिबका से कहा, “देखो, तुम जानती हो कि मेरे पिता बूढ़े हो गए हैं और उन्हें दिखाई नहीं देता, क्योंकि उनकी आँखें धुँधली हो गई हैं। यदि मैं उन्हें छोड़ दूँ, तो यह उनकी दृष्टि में बुरा होगा, क्योंकि मैं उन्हें छोड़कर तुम्हारे पास से चला जाऊँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे” के लिए मूल पाठ में बहुवचन रूप है, यद्यपि याकूब यहाँ अपनी माता रिबका को संबोधित कर रहा है।
    reason: स्रोत में एकवचन संबोधन और अंतिम बहुवचन प्रत्यय के बीच की वास्तविक पाठगत असंगति को सुरक्षित रखना।
lexical_decisions:
- source_word: ረሰአ
  choice: बूढ़े हो गए हैं
  rationale: क्रिया पिता के वृद्ध हो जाने को व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ክቡዳ፡ አዕይንቲሁ
  choice: उनकी आँखें धुँधली हो गई हैं
  rationale: शाब्दिक अर्थ ‘उनकी आँखें भारी हैं’ है, पर प्रसंग में दृष्टि क्षीण होने का भाव है; ‘धुँधली’ उस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: እኩይ፡ ውእቱ፡ በቅድመ፡ አዕይንቲሁ
  choice: यह उनकी दृष्टि में बुरा होगा
  rationale: स्रोत की ‘उसकी आँखों के सामने/उसकी दृष्टि में बुरा’ संरचना को यथासंभव बनाए रखा गया है।
- source_word: ወአሐውር፡ እምኔክሙ
  choice: तुम्हारे पास से चला जाऊँगा
  rationale: गमन और अलगाव दोनों को व्यक्त करता है। गीइज़ प्रत्यय बहुवचन है, पर प्रत्यक्ष संबोधन रिबका से है; इस असंगति को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: पिता को छोड़ना ‘बुरा’ होने का आशय
  choice: यह उनकी दृष्टि में बुरा होगा
  alternative: यह उनके साथ अन्याय होगा
  rationale: स्रोत नैतिक अपराध की प्रकृति स्पष्ट नहीं करता; अधिक व्याख्यात्मक शब्दावली से बचकर उसकी अस्पष्टता और तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। पारिवारिक संबोधन में ‘तुम’ स्रोत के एकवचन स्त्रीलिंग संबोधन के अनुरूप है।
