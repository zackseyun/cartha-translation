  text: And they arose in the night and wanted to rescue their gods from the midst of the fire. And Haran rushed
translation:
  language: hi
  text: वे रात को उठे और आग के बीच से अपने देवताओं को बचाना चाहते थे। और हारान दौड़ पड़ा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हारान झपटकर आगे बढ़ा।” यह खंड संभवतः अगले पद के आरंभ से जुड़ता है।
    reason: गीज़ क्रिया में दौड़ने, लपकने या तेजी से आगे बढ़ने का अर्थ हो सकता है; साथ ही उपलब्ध स्रोत में पद-विभाजन संदिग्ध है।
lexical_decisions:
- source_word: ተንሥኡ
  choice: उठे
  rationale: यह क्रिया रात में उठने या खड़े होने को व्यक्त करती है; प्रसंग में सरल ‘उठे’ स्वाभाविक है।
- source_word: ፈቀዱ
  choice: चाहते थे
  rationale: मूल क्रिया इच्छा या अभिप्राय को दर्शाती है; इससे बचाने का उनका प्रयत्न अभी उद्देश्य के रूप में ही रहता है।
- source_word: ያድኅኑ
  choice: बचाना
  rationale: यहाँ अर्थ आग के बीच से छुड़ाने या सुरक्षित निकालने का है; ‘बचाना’ सामान्य और सटीक हिन्दी है।
- source_word: አማልክቲሆሙ
  choice: अपने देवताओं को
  rationale: बहुवचन और संबंधवाचक प्रत्यय ‘उनके देवता’ को व्यक्त करते हैं; हिन्दी में कर्ता-संदर्भ के कारण ‘अपने देवताओं’ अधिक स्वाभाविक है।
- source_word: አራን
  choice: हारान
  rationale: गीज़ रूप अरान/आरान बाइबिल में प्रचलित नाम हारान को सूचित करता है; हिन्दी बाइबिलीय नाम-परंपरा के अनुरूप ‘हारान’ रखा गया है।
- source_word: ሰረረ
  choice: दौड़ पड़ा
  rationale: क्रिया में तेजी से लपकने, उछलने या दौड़ने का भाव है; ‘दौड़ पड़ा’ गति और आकस्मिक आरंभ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘देवताओं’ का संदर्भ
  choice: मूल के बहुवचन ‘अपने देवताओं’ को यथावत रखा गया
  alternative: ‘अपनी देव-मूर्तियों’
  rationale: मूल पाठ स्पष्ट रूप से ‘देवताओं’ कहता है; उन्हें व्याख्यात्मक रूप से केवल मूर्तियाँ कहना अर्थ को अनावश्यक रूप से सीमित करता।
- issue: अंतिम खंड की पद-सीमा
  choice: ‘और हारान दौड़ पड़ा’ को पद 13 में रखते हुए टिप्पणी दी गई
  alternative: इसे पद 14 की शुरुआत में स्थानांतरित करना
  rationale: दिया गया गीज़ स्रोत इस खंड को सम्मिलित करता है, पर कथात्मक और संपादकीय विभाजन के आधार पर इसके अगले पद से जुड़ने की संभावना पाठक को बताना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘आग के बीच से’ मूल स्थान-संबंध को बनाए रखता है, और अंतिम अपूर्ण-से कथात्मक खंड को स्रोत के अनुसार संरक्षित किया गया है।
