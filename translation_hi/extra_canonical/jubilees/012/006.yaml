base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/006.yaml
  text: '[They are a deception] to those who make them, and confusion of heart to those who worship them. Do not worship them." And his father said to him, "I too know, my son, but what can I do for a people who have made me serve?'
translation:
  language: hi
  text: “[वे छलावे हैं][a] उन्हें बनाने वालों के लिए, और उन्हें पूजने वालों के लिए मन का भ्रम। उनकी पूजा मत करना।” तब उसके पिता ने उससे कहा, “मेरे पुत्र, मैं भी यह जानता हूँ; पर उन लोगों के संबंध में मैं क्या कर सकता हूँ, जिन्होंने मुझे उनकी सेवा करने के लिए विवश कर दिया है?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ये शब्द पिछले पद में चल रहे विचार के आधार पर पूरित किए गए हैं; मूल पाठ यहाँ केवल “उन्हें बनाने वालों के लिए” कहता है।
    reason: स्रोत में वाक्य पिछले पद से जारी है, इसलिए संपादकीय पूर्ति को पारदर्शी बनाना आवश्यक है।
  - marker: b
    text: या, “जिन्होंने मुझे उनकी आज्ञा मानने के लिए विवश कर दिया है?” अथवा “जिन्होंने मुझे उनके अधीन कर दिया है?”
    reason: गीज़ क्रिया में सेवा करने, आज्ञा मानने और अधीन होने के परस्पर जुड़े अर्थ संभव हैं।
lexical_decisions:
- source_word: ከሕተት፡ ልብ
  choice: मन का भ्रम
  rationale: शाब्दिक अर्थ ‘हृदय/मन का भ्रम या उलझन’ है; यह मूर्तिपूजा से उत्पन्न आंतरिक भ्रांति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: उन्हें पूजनेवालों / उनकी पूजा मत करना
  rationale: क्रिया का अर्थ आराधना या पूजा करना है; ‘पूजा’ सामान्य पाठक के लिए सीधा और प्रसंगानुकूल है।
- source_word: እትአዘዝ
  choice: सेवा करने के लिए विवश कर दिया है
  rationale: इस रूप में आज्ञा मानने, अधीन होने या सेवा करने का भाव है। प्रसंग में तेरह का लोगों के दबाव में मूर्तियों की सेवा करना अभिप्रेत प्रतीत होता है; ‘विवश’ कारक भाव को स्पष्ट करता है।
theological_decisions:
- issue: आरंभिक अपूर्ण वाक्यांश का संबंध पिछले पद से
  choice: ‘वे छलावा हैं’ को कोष्ठकों में पूरित किया गया
  alternative: ‘लज्जा उन्हें बनानेवालों की है’
  rationale: गीज़ पाठ केवल ‘उन्हें बनानेवालों के लिए’ से आरंभ होता है और विचार पिछले पद से चलता है। ‘लज्जा’ स्रोत में नहीं है; इसलिए पिछले संदर्भ से न्यूनतम पूर्ति को स्पष्ट कोष्ठकों में रखा गया।
- issue: तेरह की बाध्यता का स्वरूप
  choice: लोगों ने उसे ‘उनकी सेवा करने के लिए विवश’ किया
  alternative: लोगों ने उसे ‘आज्ञा मानने/अधीन होने’ के लिए विवश किया
  rationale: मूल क्रिया में सेवा, आज्ञापालन और अधीनता का अर्थ-क्षेत्र है। मूर्तियों के प्रसंग में ‘उनकी सेवा’ स्वाभाविक है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण संवाद रखा गया है। ‘मन का भ्रम’ स्रोत के संक्षिप्त संज्ञात्मक विन्यास को बनाए रखता है। संपादकीय पूर्ति वर्ग कोष्ठकों में है और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से दिए गए हैं।
