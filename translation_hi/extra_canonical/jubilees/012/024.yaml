  yaml_path: translation/extra_canonical/jubilees/012/024.yaml
  text: And I will be God to you and to your son and to your son's son and to all your seed. Do not fear from now and unto all the generations of the earth; I am your God." And he said to me,
translation:
  language: hi
  text: “और मैं तेरा, तेरे पुत्र का, तेरे पुत्र के पुत्र का और तेरे सारे वंश का परमेश्वर होऊँगा। अब से लेकर पृथ्वी की सभी पीढ़ियों तक मत डर; मैं तेरा परमेश्वर हूँ।” और उसने मुझसे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እከውንከ ... አምላከ
  choice: मैं ... परमेश्वर होऊँगा
  rationale: अस्तित्वसूचक क्रिया और ‘परमेश्वर’ को भविष्यकालीन वाचागत प्रतिज्ञा के रूप में स्वाभाविक हिन्दी में रखा गया है।
- source_word: ወለወልድከ፡ ወለወልደ፡ ወልድከ
  choice: तेरे पुत्र का, तेरे पुत्र के पुत्र का
  rationale: स्रोत की क्रमिक वंशावली और एकवचन रूपों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ወለኵሉ፡ ዘርእከ
  choice: तेरे सारे वंश का
  rationale: ‘बीज/संतान’ के सामूहिक अर्थ के लिए आधुनिक और गरिमापूर्ण हिन्दी ‘वंश’ चुना गया है।
- source_word: ኢትፍራህ
  choice: मत डर
  rationale: निषेधात्मक आज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: እምይእዜ፡ ወእስከ፡ ኵሉ፡ ትዝምደ፡ ምድር
  choice: अब से लेकर पृथ्वी की सभी पीढ़ियों तक
  rationale: ‘अब से’ और ‘तक’ की सीमा-संरचना को बनाए रखा गया है; स्रोत में ‘सदा’ का अलग पद न होने के कारण उसे नहीं जोड़ा गया।
- source_word: ወይቤለኒ
  choice: और उसने मुझसे कहा
  rationale: स्रोत में केवल तृतीय पुरुष कर्ता निहित है; ‘प्रभु परमेश्वर’ जैसा नाम स्रोत से बाहर होने के कारण नहीं जोड़ा गया।
theological_decisions:
- issue: वाचा की प्रतिज्ञा में संबोधित वंश की अभिव्यक्ति
  choice: तेरे पुत्र का, तेरे पुत्र के पुत्र का और तेरे सारे वंश का
  alternative: तेरी संतान और तेरी सारी भावी पीढ़ियों का
  rationale: स्रोत की विशिष्ट पुनरुक्त वंश-श्रृंखला को सामान्यीकृत किए बिना सुरक्षित रखा गया है।
- issue: कालावधि का अर्थ
  choice: अब से लेकर पृथ्वी की सभी पीढ़ियों तक
  alternative: अब से सदा तक, पृथ्वी की सभी पीढ़ियों में
  rationale: स्रोत का ‘और तक’ पीढ़ियों तक पहुँचने की सीमा बताता है; ‘सदा’ जोड़ने के लिए स्पष्ट मूल पद नहीं है।
- issue: अंतिम वक्ता की पहचान
  choice: उसने
  alternative: प्रभु परमेश्वर ने
  rationale: स्रोत वक्ता को इस वाक्यांश में नामित नहीं करता, इसलिए संदर्भगत पहचान को पाठ में स्पष्ट करके नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन में एकवचन ‘तू/तेरा’ रूप रखा गया है ताकि स्रोत की निकट, प्रत्यक्ष वाचागत भाषा और पूरी पंक्ति की व्याकरणिक संगति बनी रहे। अंतिम अल्पविराम अगले पद में जारी कथन को दर्शाता है।
