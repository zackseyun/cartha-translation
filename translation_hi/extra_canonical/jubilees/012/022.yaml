  yaml_path: translation/extra_canonical/jubilees/012/022.yaml
  text: the word of the LORD came to him by my hand, saying, "Go out from your land and from your kindred and from your father's house to the land that I will show you, and I will make you into a great and numerous nation, and I will bless you."
translation:
  language: hi
  text: 'मेरे हाथ के द्वारा प्रभु का यह वचन उसके पास पहुँचा: “तू अपने देश, अपने कुटुम्ब और अपने पिता के घराने से निकलकर उस देश में जा जिसे मैं तुझे दिखाऊँगा। मैं तुझसे एक बड़ी और अनेक लोगों वाली जाति बनाऊँगा, और मैं तुझे आशीष दूँगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ እግዚአብሔር
  choice: प्रभु का वचन
  rationale: यह पदबंध ‘प्रभु/परमेश्वर का वचन’ व्यक्त करता है। ‘प्रभु’ मूल उपाधि और अंग्रेज़ी परामर्श-पाठ के LORD के अनुरूप है, बिना मूल में कोई विशिष्ट नाम जोड़ने के।
- source_word: በእዴየ
  choice: मेरे हाथ से
  rationale: शाब्दिक ‘मेरे हाथ से’ को बनाए रखा गया है; इसे केवल ‘मेरे द्वारा’ करने से मूल की मूर्त अभिव्यक्ति मिट जाती।
- source_word: ትዝምድከ
  choice: अपने कुटुम्ब
  rationale: यह संबंधियों अथवा कुल-कुटुम्ब के अर्थ को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሕዝበ፡ ዐቢየ፡ ወብዙኃ
  choice: एक बड़ी जाति … जिसके लोग बहुत होंगे
  rationale: मूल के ‘बड़ी’ और ‘बहुत/बहुसंख्य’ दोनों भावों को सहज हिन्दी में रखा गया है; ‘बहुसंख्यक जाति’ आधुनिक हिन्दी में बहुमत रखने वाले समुदाय का भ्रामक अर्थ दे सकता था।
- source_word: እባርከከ
  choice: मैं तुझे आशीष दूँगा
  rationale: प्रत्यक्ष भविष्यकालीन प्रतिज्ञा और एकवचन संबोधन दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: ईश्वरीय उपाधि እግዚአብሔር का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: गीज़ पाठ यहाँ ईश्वरीय उपाधि देता है, स्पष्ट रूप से कोई व्यक्तिगत नाम नहीं। इसलिए ‘प्रभु’ मूल-साक्ष्य के निकट रहते हुए किसी विशिष्ट नाम को पाठ में आयात नहीं करता।
- issue: प्रतिज्ञा में जाति की उत्पत्ति
  choice: मैं तुझसे एक बड़ी जाति बनाऊँगा
  alternative: मैं तुझे एक बड़ी जाति बनाऊँगा
  rationale: हिन्दी में ‘तुझसे’ यह स्पष्ट और स्वाभाविक रूप से व्यक्त करता है कि संबोधित व्यक्ति से जाति उत्पन्न होगी; इससे प्रतिज्ञा का आशय सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। ईश्वरीय वाणी में एकवचन ‘तू/तुझे’ रखा गया है, क्योंकि मूल में संबोधन एकवचन है और यह प्राचीन वाचिक शैली के अनुरूप है।
