  yaml_path: translation/extra_canonical/jubilees/012/020.yaml
  text: Deliver me from the hand of evil spirits that rule over the thoughts of the heart of man, and do not let them lead me astray from following you, my God. And establish me and my seed forever, so that we may not go astray from now and forever." And he said,
translation:
  language: hi
  text: मुझे उन दुष्ट आत्माओं के हाथ से छुड़ा, जो मनुष्य के हृदय के विचारों पर अधिकार रखती हैं; और उन्हें मुझे तेरे पीछे चलने से भटकाने मत देना, हे मेरे परमेश्वर। तू मुझे और मेरे वंश को सदा के लिए स्थिर कर, ताकि हम अब से लेकर सदा तक न भटकें।” और उसने कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናፍስት፡ እኩያን
  choice: दुष्ट आत्माएँ
  rationale: बहुवचन संज्ञा और विशेषण का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: ይስልጡ
  choice: अधिकार रखती हैं
  rationale: मूल में शासन या प्रभुत्व करने का भाव है; यह हिन्दी में विचारों पर प्रभावशाली नियंत्रण को स्पष्ट रखता है।
- source_word: ሕሊና፡ ልበ፡ ሰብእ
  choice: मनुष्य के हृदय के विचार
  rationale: शाब्दिक संरचना ‘मनुष्य के हृदय की सोच/विचार’ है; ‘विचार’ अर्थ को बिना अनावश्यक व्याख्या के स्वाभाविक बनाता है।
- source_word: እምድኅሬከ
  choice: अपने पीछे चलने से
  rationale: शाब्दिक रूप से ‘तेरे पीछे से’ है और प्रसंग में परमेश्वर का अनुसरण करने का अर्थ देता है।
- source_word: ወትረሰየኒ
  choice: स्थिर कर
  rationale: क्रिया में स्थापित या दृढ़ करने का भाव है; ‘स्थिर कर’ प्रार्थना के संदर्भ में सहज है।
- source_word: ኪያየ፡ ወዘርእየ
  choice: मुझे और मेरे वंश को
  rationale: ኪያየ स्वतंत्र कर्मवाचक सर्वनाम ‘मुझे’ है, जो क्रिया के कर्म-प्रत्यय को बल देकर संयुक्त कर्म ‘मुझे और मेरे वंश को’ आरम्भ करता है; इसका अर्थ ‘तेरे सामने’ नहीं है।
- source_word: ወይቤ
  choice: तब उसने कहा
  rationale: समापन कथात्मक सूत्र को अगले कथन की ओर ले जाने वाले स्वाभाविक हिन्दी रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: दुष्ट आत्माओं का मनुष्य के विचारों पर शासन
  choice: ‘अधिकार रखती हैं’ कहकर मूल का प्रभुत्व-संबंध बनाए रखा गया
  alternative: ‘प्रभाव डालती हैं’
  rationale: वैकल्पिक रूप मूल क्रिया की शक्ति को कम कर देता; पाठ यह नहीं बताता कि यह अधिकार पूर्ण या अनिवार्य नियंत्रण है।
- issue: ‘मुझे और मेरे वंश को’ में ኪያየ का अर्थ
  choice: इसे बलयुक्त कर्मवाचक ‘मुझे’ माना गया
  alternative: ‘मुझे और मेरे वंश को अपने सामने’
  rationale: गीज़ पाठ में ‘सामने’ के लिए कोई पद नहीं है; इसलिए ऐसी धर्मवैचारिक या भक्तिपरक धारणा जोड़ना स्रोत से परे होगा।
- issue: अंतिम बहुवचन ‘हम न भटकें’
  choice: वक्ता और उसके वंश को सम्मिलित करते हुए बहुवचन रखा गया
  alternative: ‘मैं न भटकूँ’
  rationale: मूल बहुवचन क्रिया संयुक्त पूर्ववर्ती कर्म ‘मुझे और मेरे वंश को’ के अनुरूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सहज शैली रखी गई है। परमेश्वर के लिए निकट संबोधन ‘तू’ मूल के एकवचन संबोधन और हिन्दी की पारंपरिक प्रार्थना-भाषा के अनुरूप है। पद के आरम्भ में निहित उद्धार-विनती को हिन्दी में पूर्ण वाक्य बनाने के लिए ‘मुझे…छुड़ा’ व्यक्त किया गया है; अंतिम ‘तब उसने कहा,’ स्रोत के अध्याय-विभाजन को बनाए रखता है।
