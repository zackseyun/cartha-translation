translation:
  language: hi
  text: उनके सामने? और यदि मैं उनसे सच[a] कहूँ, तो वे मुझे मार डालेंगे, क्योंकि उनका मन उन्हीं से लगा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता की बात कहूँ।”
    reason: गीज़ ጽድቀ का अधिक शाब्दिक अर्थ ‘धार्मिकता’ भी हो सकता है।
lexical_decisions:
- source_word: ጽድቀ
  choice: सच
  rationale: मूल संज्ञा का अर्थ ‘धार्मिकता/सच्चाई’ हो सकता है; बोलने के इस प्रसंग में ‘सच कहना’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: ነፍሶሙ
  choice: उनका मन
  rationale: शाब्दिक अर्थ ‘उनकी आत्मा/प्राण’ है, पर लगाव व्यक्त करने वाले मुहावरे में आधुनिक हिन्दी का ‘मन’ व्यक्ति की भीतरी अभिलाषा को सहज रूप से व्यक्त करता है।
- source_word: ተለውት ... ኀቤሆሙ
  choice: उन्हीं से लगा हुआ है
  rationale: यह निकट लगाव या आसक्ति को दर्शाता है; बहुवचन संदर्भ को ‘उन्हीं’ में बनाए रखा गया है।
theological_decisions:
- issue: ጽድቀ को ‘सच’ या ‘धार्मिकता’ के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘सच’
  alternative: ‘धार्मिकता की बात’
  rationale: यहाँ कथन के कारण हत्या का भय है, इसलिए ‘सच कहना’ प्रसंगानुकूल और स्वाभाविक है; फिर भी मूल की नैतिक-धार्मिक अर्थछाया पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, dignified और सहज हिन्दी। पद पिछले वाक्य से जारी प्रश्नांश से आरम्भ होता है, इसलिए आरम्भिक खंडित संरचना और प्रश्नचिह्न सुरक्षित रखे गए हैं।
