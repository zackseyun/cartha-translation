  language: hi
  text: वर्षों के दो सप्ताह[a]। फिर छठे सप्ताह के पाँचवें वर्ष में, अब्राम सातवें महीने के आरम्भ[b] की रात बैठा रहा और संध्या से भोर तक तारों का निरीक्षण करता रहा, ताकि वह देख सके कि वर्ष में वर्षा की स्थिति कैसी होगी। वह वहाँ अकेला बैठा निरीक्षण कर रहा था। तब उसके मन में एक वचन आया, और उसने कहा, “तारों के सारे चिह्न और उनके संकेत…”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “सप्ताह” सात वर्षों की एक कालगणनात्मक इकाई है। इस प्रकार “वर्षों के दो सप्ताह” का अर्थ चौदह वर्ष है। जुबिलीज़ में समय की गणना प्रायः जुबिली, सप्ताह और वर्ष के अनुसार की जाती है।
    reason: cultural_note
  - marker: b
    text: इस पदबंध को अधिक विशिष्ट रूप से “सातवें महीने के चंद्रमा के उदय पर” या “सातवें महीने के नए चाँद के आरम्भ में” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: वर्षों के … सप्ताह
  rationale: यह कालगणना की सात-वर्षीय इकाइयों को दर्शाता है। स्रोत की गणना-पद्धति और आरम्भिक खंडात्मक वाक्य-विन्यास को बनाए रखा गया है; अर्थ footnote में स्पष्ट किया गया है।
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: सातवें महीने के आरम्भ में
  rationale: ሠርቀ፡ ወርኅ चंद्रमा/महीने के उदय या आरम्भ को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक व्यापक अर्थ रखा गया है और अधिक विशिष्ट सम्भावना footnote में दी गई है।
- source_word: ያበይነ፡ ከዋክብተ
  choice: तारों का निरीक्षण करता रहा
  rationale: संदर्भ में यह तारों को ध्यान से देखकर वर्षा के विषय में निष्कर्ष निकालने की क्रिया है; ‘निरीक्षण’ इस आशय को स्पष्ट और तटस्थ ढंग से व्यक्त करता है।
- source_word: ግብረ፡ ዓመት፡ በዝናማት
  choice: वर्ष में वर्षा की स्थिति कैसी होगी
  rationale: शाब्दिक ‘वर्ष का कार्य/चरित्र, वर्षाओं के संबंध में’ को सहज आधुनिक हिन्दी में व्यक्त किया गया है, बिना यह तय किए कि बात मात्रा, समय या समग्र वर्षा-क्रम की है।
- source_word: መጽአ፡ ውስተ፡ ልቡ፡ ቃል
  choice: उसके मन में एक वचन आया
  rationale: स्रोत की भीतरी अनुभूति और ‘वचन’ की संभावित धार्मिक प्रतिध्वनि दोनों सुरक्षित रहती हैं; वक्ता की पहचान स्रोत स्वयं नहीं बताता।
- source_word: ኵሉ፡ ተአምረ፡ ከዋክብት፡ ወተአምራሁ
  choice: तारों के सारे चिह्न और उनके संकेत
  rationale: स्रोत की दोहरावपूर्ण अभिव्यक्ति को मिटाया नहीं गया। पद यहाँ अधूरा समाप्त होता है, इसलिए दीर्घविराम रखा गया है।
theological_decisions:
- issue: अब्राम के मन में आए ‘वचन’ का स्रोत
  choice: ‘उसके मन में एक वचन आया’
  alternative: ‘परमेश्वर का वचन उसके मन में आया’
  rationale: गीज़ पाठ इस वचन को स्पष्ट रूप से परमेश्वर का नहीं कहता; अनकही पहचान जोड़ने से theological ambiguity समाप्त हो जाती।
- issue: तारों के निरीक्षण का स्वरूप
  choice: तटस्थ ‘निरीक्षण’
  alternative: ‘ज्योतिषीय गणना’ या ‘शकुन देखना’
  rationale: पाठ तारों के आधार पर वर्षा जानने का प्रयास बताता है, पर यहाँ किसी विशिष्ट धार्मिक या ज्योतिषीय प्रणाली का नाम नहीं देता।
