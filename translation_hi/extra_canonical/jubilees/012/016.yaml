  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कालगणना की प्राचीन ‘सप्ताह’ इकाई को मुख्य पाठ में संरक्षित करके footnote में समझाया गया है। स्रोत का आरम्भ और अन्त दोनों खंडात्मक हैं; उन्हें कृत्रिम रूप से पूर्ण वाक्य नहीं बनाया गया। उद्धरण के अधूरे बने रहने को दीर्घविराम से दिखाया गया है।
