  text: He told this matter to his two brothers,, and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of
translation:
  language: hi
  text: उसने यह बात अपने दोनों भाइयों को बताई। वे उस पर क्रोधित हुए और चुप रहे। चालीसवीं जुबली के दूसरे सप्ताह के सातवें वर्ष में अब्राम ने अपने लिए एक पत्नी ली। उसका नाम सारै था, और वह बेटी थी—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीज़ स्रोत-खंड यहाँ ‘बेटी’ शब्द पर समाप्त हो जाता है, इसलिए यह नहीं बताया गया कि वह किसकी बेटी थी। पाठ-परंपरा में इस पारिवारिक संबंध की व्याख्या कठिन और भिन्न रही है।
    reason: textual_variant
lexical_decisions:
- source_word: ነገረ
  choice: बताई
  rationale: यह क्रिया किसी बात को कहने या बताने का बोध देती है; हिन्दी में कर्म ‘यह बात’ के साथ ‘बताई’ स्वाभाविक है।
- source_word: ለክልኤ፡ አሐዊሁ
  choice: अपने दोनों भाइयों को
  rationale: संख्या ‘दो’ और संबंधवाचक प्रत्यय दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ወአርመሙ
  choice: और चुप रहे
  rationale: क्रिया तृतीय पुरुष बहुवचन है, इसलिए कर्ता दोनों भाई हैं; एकवचन अर्थ नहीं लिया गया।
- source_word: አዮቤልዉ
  choice: जुबली
  rationale: यह कालगणना की तकनीकी इकाई है; ‘जुबली’ आधुनिक हिन्दी में पहचानने योग्य है और ग्रंथ के शीर्षक व कालक्रम से संगति रखती है।
- source_word: ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ
  choice: अब्राम ने अपने लिए एक पत्नी ली
  rationale: स्रोत की पुनरुक्त संरचना ‘अपने लिए ... ली’ को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: ሶራ
  choice: सारै
  rationale: गीज़ रूप ‘सोरा’ उस पात्र के नाम का रूप है जिसे इस प्रसंग में प्रचलित हिन्दी बाइबलीय नाम ‘सारै’ से पहचाना जाता है; अंग्रेज़ी परामर्श-पाठ भी Sarai देता है।
- source_word: ወሰተ
  choice: और वह बेटी थी—
  rationale: उपलब्ध स्रोत-खंड इसी अपूर्ण संबंध-सूचक पद पर समाप्त होता है; डैश अगले, अनुपस्थित अंश की ओर संकेत करता है और संबंध को अनुमान से पूरा नहीं करता।
theological_decisions:
- issue: सारै के पारिवारिक संबंध की पहचान
  choice: 'संबंध को अधूरा रखा गया: ‘वह बेटी थी—’'
  alternative: ‘वह उसके पिता की बेटी थी’ या किसी अन्य विशिष्ट पारिवारिक संबंध को जोड़ना
  rationale: दिए गए गीज़ स्रोत-खंड में ‘बेटी’ के बाद संबंध बताने वाला अंश उपलब्ध नहीं है। संदर्भ या पाठ-परंपरा के आधार पर उसे चुपचाप पूरा करना वास्तविक पाठगत कठिनाई को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कालगणना के तकनीकी शब्द के रूप में ‘जुबली’ रखा गया है। छोटे वाक्यों से कथानक सहज बनाया गया है, जबकि स्रोत की बहुवचन क्रिया और अंतिम अपूर्ण वंश-संबंध को यथावत सुरक्षित रखा गया है।
