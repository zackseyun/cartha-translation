  text: And he said[a], "Shall I return to Ur of the Chaldeans, who seek my face so that I should return to them? And what shall I do here in this place? Make the right path straight before you in the hand of your servant, that he may do it, and let me not walk in the error of my heart, my God." And he finished speaking and praying, and behold, one was sent
translation:
  language: hi
  text: और उसने कहा[a], “क्या मैं कसदियों के ऊर में लौट जाऊँ, उनके पास जो मेरा मुख खोजते हैं[b], ताकि मैं उनके पास लौट आऊँ? और मैं यहाँ, इस स्थान में, क्या करूँ? अपने सामने सही मार्ग को अपने दास के हाथ से सीधा कर, ताकि वह ऐसा करे[c]; और हे मेरे परमेश्वर, मुझे अपने हृदय की भूल में न चलने दे।” उसने बोलना समाप्त किया और प्रार्थना की, और देखो, कोई व्यक्ति भेजा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में इस पद का मध्य भाग व्याकरण और खंड-विभाजन की दृष्टि से कठिन है। अनुवाद अब्राम की इस प्रार्थना का आशय बनाए रखता है कि परमेश्वर सही मार्ग सीधा करे और उसे अपने भटकते हृदय के अनुसार न चलने दे।
    reason: segmentation_note
  - marker: b
    text: शाब्दिक रूप से ‘मेरा मुख खोजते हैं’; यहाँ इसका अर्थ संभवतः यह है कि वे उसकी उपस्थिति चाहते हैं और चाहते हैं कि वह उनके पास लौट आए।
    reason: idiom_note
  - marker: c
    text: 'यह वाक्यांश शाब्दिक और असामान्य है। दूसरा संभव अनुवाद है: ‘अपने सामने सही मार्ग सीधा कर, और तेरा दास उसे करे।’'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ገጽየ
  choice: मेरा मुख
  rationale: शाब्दिक अर्थ ‘मेरा मुख’ है। संदर्भ में यह उसकी उपस्थिति चाहने का मुहावरा हो सकता है, पर स्रोत के वास्तविक बिंब को मुख्य पाठ में बनाए रखा गया है।
- source_word: እግባእ
  choice: मैं ... लौट आऊँ
  rationale: इस क्रिया का यहाँ प्रसंगानुकूल अर्थ ‘लौटना’ है; इससे ऊर वापस जाने की बात स्पष्ट रहती है।
- source_word: ፍኖተ፡ ርቱዐ
  choice: सही मार्ग
  rationale: दोनों शब्द मिलकर ‘सीधा/सही मार्ग’ व्यक्त करते हैं; हिंदी में पुनरुक्ति से बचते हुए अगले क्रियापद ‘सीधा कर’ के साथ स्वाभाविक रूप रखा गया है।
- source_word: ተፈነወ
  choice: भेजा गया
  rationale: स्रोत का कर्मवाच्य रूप सुरक्षित रखा गया है; कर्ता का नाम इस पद में नहीं दिया गया।
theological_decisions:
- issue: ईश्वरीय मार्गदर्शन और दास की क्रिया का संबंध
  choice: ‘अपने दास के हाथ से ... ताकि वह उसे पूरा करे’
  alternative: ‘मेरे सामने मार्ग सीधा कर, और अपने दास से उस पर चलवा’
  rationale: मूल में ‘तेरे सामने’, ‘तेरे दास के हाथ से’ और सक्रिय ‘वह करे’ की असामान्य संरचना है। अनुवाद ने इसे किसी विशिष्ट धर्मवैज्ञानिक व्याख्या से सरल किए बिना यथासंभव बनाए रखा है।
- issue: ‘अपने हृदय की भूल’
  choice: वक्ता की अपनी अंतःप्रेरणा के भटकाव को खुला रखा गया
  alternative: इसे स्पष्ट रूप से ‘पापी मन’ या ‘अविश्वास’ कहना
  rationale: स्रोत केवल हृदय की भूल/भटकाव कहता है; अधिक विशिष्ट धार्मिक अर्थ जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रार्थना में एकवचन निकट संबोधन (‘अपने’, ‘तेरे’ के निहित संबंध) है। ‘मुख खोजते हैं’ और ‘अपने दास के हाथ से’ जैसे स्रोतगत असामान्य बिंबों को व्याख्यात्मक पादटिप्पणियों के साथ सुरक्षित रखा गया है।
