base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/025.yaml
  text: 'The Lord God [said]: ''Open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.''[a]'
translation:
  language: hi
  text: प्रभु परमेश्वर ने [कहा], “उसका मुँह और उसके कान खोल, ताकि वह सुन सके और उस प्रकट की गई भाषा में अपने मुँह से बोल सके; क्योंकि उलट दिए जाने के दिन से वह भाषा सभी मनुष्यों के मुँह से लुप्त हो गई है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश संभवतः बाबेल से जुड़ी न्याय की घटना के बाद आदिम भाषा के लुप्त हो जाने की ओर संकेत करता है। गीइज़ में अभिव्यक्ति संक्षिप्त है: “उलट दिए जाने के दिन से।”'
    reason: cross_reference
lexical_decisions:
- source_word: ፍታሕ (fətaḥ)
  choice: खोल
  rationale: यह द्वितीय पुरुष एकवचन की आज्ञार्थक क्रिया है; इसलिए इसे विनतीसूचक ‘खोले’ के बजाय सीधे आदेश के रूप में रखा गया है।
- source_word: በልሳን፡ እንተ፡ ታስተርኢ
  choice: उस प्रकट की गई भाषा में
  rationale: वाक्यांश ऐसी भाषा की ओर संकेत करता है जो प्रकट की गई है; हिन्दी में कर्मवाच्य रूप स्रोत के अर्थ और अंग्रेज़ी परामर्श-पाठ दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: አዐረፈ
  choice: लुप्त हो गई है
  rationale: मूल अर्थ ‘रुक गई/समाप्त हो गई’ है; मुँह से भाषा के हट जाने के संदर्भ में ‘लुप्त हो गई’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ዕለተ፡ ድቀት
  choice: उलट दिए जाने के दिन
  rationale: शाब्दिक रूप से पतन, गिराए जाने या उलट दिए जाने का दिन; अनिश्चित ऐतिहासिक संकेत को किसी विशेष घटना का नाम देकर सीमित नहीं किया गया।
theological_decisions:
- issue: आरंभ में ‘कहा’ क्रिया मूल उद्धृत गीइज़ पाठ में अनुपस्थित है, पर कथात्मक संदर्भ में अपेक्षित है।
  choice: ‘ने [कहा]’ को कोष्ठकों में जोड़ा गया
  alternative: ‘प्रभु परमेश्वर, उसका मुँह… खोल’ पढ़कर इसे संबोधन या प्रार्थना मानना
  rationale: ፍታሕ स्पष्टतः द्वितीय पुरुष एकवचन आज्ञार्थक है। कोष्ठक पाठक को बताता है कि कथन-क्रिया संदर्भ से पूरित है, मूल पंक्ति का प्रत्यक्ष शब्द नहीं।
- issue: ‘उलट दिए जाने’ का संभावित बाबेल-संबंध
  choice: मुख्य पाठ में घटना का नाम नहीं जोड़ा गया
  alternative: ‘बाबेल में भाषाओं के उलट-पुलट के दिन से’
  rationale: वाक्यांश संभवतः बाबेल से जुड़ा है, लेकिन स्रोत केवल संक्षिप्त ‘उलट दिए जाने/पतन के दिन’ कहता है; अतः संभावित पहचान पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक स्वर रखा गया है। ‘सभी मनुष्यों’ से सामूहिक मानवीय अर्थ व्यक्त किया गया है और स्रोत की संक्षिप्तता तथा अंतिम वाक्यांश की अस्पष्टता बनाए रखी गई है।
