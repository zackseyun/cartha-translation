lexical_decisions:
- source_word: ብእሲተ
  choice: पत्नी
  rationale: यहाँ स्त्री को विवाह के संबंध में लेने और पत्नी हो जाने का संदर्भ है; इसलिए सामान्य अर्थ ‘स्त्री’ के बजाय ‘पत्नी’ स्वाभाविक और संदर्भानुकूल है।
- source_word: አሬን
  choice: हारान
  rationale: अब्राम के भाई के नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: ሱባዔ
  choice: सप्ताह
  rationale: मूल का काल-गणना संबंधी ‘सात का समूह/सप्ताह’ बनाए रखा गया है; इसे बिना आधार ‘सात वर्षों की अवधि’ कहकर स्पष्ट नहीं किया गया।
- source_word: ወጸውዐ
  choice: और उसने उसका नाम रखा—
  rationale: यह नामकरण का सूत्र है, पर उपलब्ध पदांश नाम बताए जाने से पहले समाप्त हो जाता है; डैश इस अपूर्ण निरंतरता को दर्शाता है।
