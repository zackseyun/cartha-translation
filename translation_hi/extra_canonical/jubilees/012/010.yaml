  text: उसके पिता की, और वह उसकी पत्नी हो गई। उसके भाई हारान ने तीसरे सप्ताह के तीसरे वर्ष में अपने लिए एक पत्नी ली। उसने इस सप्ताह के सातवें वर्ष में उसके लिए एक पुत्र को जन्म दिया, और उसने उसका नाम रखा—
