base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/026.yaml
  text: And I opened his mouth and his ears and his lips, and I began to speak with him in Hebrew, in the language of creation. And he took the books of his fathers, and they were written in Hebrew, and he copied them and began from then on to study them. And I made known to him everything that he was unable to understand, and he studied them during the six rainy months.
translation:
  language: hi
  text: और मैंने उसका मुँह, उसके कान और उसके होंठ खोल दिए, और मैं उससे इब्रानी में—सृष्टि की भाषा में—बात करने लगा। तब उसने अपने पूर्वजों की पुस्तकें लीं; वे इब्रानी में लिखी हुई थीं। उसने उनकी नकल की और उसी समय से उनका अध्ययन करने लगा। जो कुछ वह समझ नहीं पाता था, वह सब मैंने उसे समझा दिया; और उसने वर्षा के छह महीनों तक उनका अध्ययन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዕብራይስጥ
  choice: इब्रानी में
  rationale: यह क्रियाविशेषण रूप भाषा को सूचित करता है; आधुनिक मानक हिन्दी में ‘इब्रानी में’ स्वाभाविक और स्पष्ट है।
- source_word: በልሳነ፡ ፍጥረታት
  choice: सृष्टि की भाषा में
  rationale: शाब्दिक अर्थ ‘सृष्टि की भाषा/जिह्वा में’ है। ‘सृष्टि की भाषा’ मूल अभिव्यक्ति के धार्मिक-साहित्यिक स्वर और उसकी दावाकृत पहचान को बनाए रखती है।
- source_word: ደገሞን
  choice: उनकी नकल की
  rationale: संदर्भ में पुस्तकों को दोहराने या प्रतिलिपि बनाने का भाव है; ‘नकल की’ साधारण पाठक के लिए स्पष्ट है और लिखित प्रतिलिपि का आशय देता है।
- source_word: አየድዖ
  choice: समझा दिया
  rationale: मूल का अर्थ ‘जानने योग्य बनाया/अवगत कराया’ है। यहाँ न समझी गई पुस्तक-सामग्री के संदर्भ में ‘समझा दिया’ स्वाभाविक हिन्दी है।
- source_word: ስድስተ፡ ወርኀ፡ ዘናም
  choice: वर्षा के छह महीनों तक
  rationale: मूल पदों में ‘छह महीने’ और ‘वर्षा’ का संबंध है; यह रूप अंग्रेज़ी परामर्श-पाठ के अर्थ से भी मेल खाता है और असामान्य काल-संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी को ‘सृष्टि की भाषा’ कहना
  choice: 'दोनों पदों को समानाधिकरण रूप में रखा: ‘इब्रानी में—सृष्टि की भाषा में—’'
  alternative: ‘इब्रानी में, अर्थात सृष्टि की भाषा में’
  rationale: मूल पाठ दोनों अभिव्यक्तियों को निकट रखता है। डैश पहचान का संकेत देता है, पर ‘अर्थात’ जैसी अतिरिक्त व्याख्यात्मक दृढ़ता नहीं जोड़ता।
- issue: वक्ता द्वारा ज्ञान प्रदान करना
  choice: ‘जो कुछ वह समझ नहीं पाता था, वह सब मैंने उसे समझा दिया’
  alternative: ‘जो कुछ वह नहीं जानता था, वह सब मैंने उसे बता दिया’
  rationale: यह चयन अध्ययन और पुस्तकों के तात्कालिक संदर्भ को व्यक्त करता है, बिना इस दावे को सार्वभौमिक सर्वज्ञान की दिशा में बढ़ाए कि पात्र हर प्रकार की अज्ञात बात जान गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य-रचना मूल की क्रमिक शैली को यथासंभव बनाए रखती है, जबकि अत्यधिक कृत्रिम पुनरुक्ति से बचती है। ‘पूर्वजों’ को ‘पितरों’ पर इसलिए चुना गया कि यह आधुनिक पाठक के लिए अधिक सहज है और वंशगत अर्थ स्पष्ट रखता है।
