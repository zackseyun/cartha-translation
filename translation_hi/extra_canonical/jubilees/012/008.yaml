translation:
  language: hi
  text: ताकि वे उनकी उपासना करें और उनकी स्तुति करें। चुप रहो, मेरे बेटे, कहीं वे तुम्हें मार न डालें।” उसने ये बातें अपने दोनों भाइयों से कहीं; वे उस पर क्रोधित हुए, और वह चुप रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያምልክዎሙ
  choice: उनकी उपासना करें
  rationale: क्रिया का आशय देवताओं के प्रति धार्मिक उपासना करना है; बहुवचन कर्म को ‘उनकी’ से बनाए रखा गया है।
- source_word: ይስብሕዎሙ
  choice: उनकी स्तुति करें
  rationale: ‘स्तुति/महिमा करना’ के धार्मिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አርምም
  choice: चुप रहो
  rationale: पिता द्वारा पुत्र को दी गई सीधी आज्ञा के रूप में संक्षिप्त और स्वाभाविक अनुवाद।
- source_word: አይቅትሉከ
  choice: कहीं वे तुम्हें मार न डालें
  rationale: निषेधात्मक आशंका अथवा चेतावनी का भाव सुरक्षित रहता है।
- source_word: ወነገረ … ዘንተ ነገረ ለ፪አኃዊሁ
  choice: उसने ये बातें अपने दोनों भाइयों से कहीं
  rationale: संशोधित पूर्ण पद-पाठ के अनुसार कथन, उसके विषय और दोनों भाइयों को संबोधन स्पष्ट किया गया है।
- source_word: ወተምዑ ሎቱ
  choice: वे उस पर क्रोधित हुए
  rationale: उसके प्रति भाइयों के क्रोध को सीधे और सहज हिन्दी में व्यक्त करता है।
- source_word: ወአርመመ
  choice: और वह चुप रहा
  rationale: आरंभिक आज्ञा से जुड़ी अंतिम प्रतिक्रिया को समान शब्दावली में बनाए रखता है।
theological_decisions:
- issue: बहुवचन उपास्य वस्तुओं का संदर्भ
  choice: ‘उनकी उपासना करें और उनकी स्तुति करें’
  alternative: ‘उन्हें पूजें और उनका गुणगान करें’
  rationale: मूल में बहुवचन सर्वनाम है; उसका संदर्भ स्पष्ट किए बिना उसी रूप में रखा गया है, ताकि पाठ की अंतर्निहित संदर्भ-निर्भरता बनी रहे।
- issue: हत्या की चेतावनी का बल
  choice: ‘कहीं वे तुम्हें मार न डालें’
  alternative: ‘ऐसा न हो कि वे तुम्हें मार डालें’
  rationale: दोनों संभव हैं; चुना गया रूप साधारण आधुनिक हिन्दी में चेतावनी और संभावित परिणाम दोनों को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। प्रत्यक्ष कथन में पिता-पुत्र संबंध के लिए ‘मेरे बेटे’ रखा गया है। उपलब्ध गीइज़ अंश पद के बीच में रुकता है, इसलिए सत्यापित पूर्ण पद-पाठ से शेष वाक्य सम्मिलित किया गया है।
