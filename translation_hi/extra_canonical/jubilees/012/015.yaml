  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: hi
  text: अपने पिता तेरह के सामने[a]। और उन्होंने उसे कसदियों के ऊर में दफ़नाया। फिर तेरह अपने पुत्रों के साथ कसदियों के ऊर से निकला, ताकि वे लबानोन देश और कनान देश जाएँ। वह हारान देश में बस गया, और अब्राम अपने पिता तेरह के साथ हारान में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह आरंभिक वाक्यांश पिछले पद के अंतिम वाक्य को पूरा करता है।
    reason: स्रोत में यह पद पिछले पद से जुड़ा हुआ एक अपूर्ण वाक्यांश लेकर आरंभ होता है।
lexical_decisions:
- source_word: በቅድመ
  choice: के सामने
  rationale: मूल पद का स्थानिक/संबंधपरक अर्थ सुरक्षित रखा गया है; इसे ‘के जीवित रहते’ कहने से निहितार्थ अधिक स्पष्ट तो होता, पर मूल की संभावित व्यापकता घट जाती।
- source_word: ኡር፡ ዘከለዳዊያን
  choice: कसदियों का ऊर / कसदियों के ऊर
  rationale: यह प्रचलित बाइबलीय स्थान-नाम है; कारक के अनुसार ‘का’ और ‘के’ का स्वाभाविक प्रयोग किया गया है।
- source_word: ምድረ፡ ሊባኖስ
  choice: लबानोन देश
  rationale: ‘लेबनान की भूमि’ की अपेक्षा सामान्य पाठक के लिए सहज, किंतु मूल के ‘देश/भूमि’ तत्व को बनाए रखने वाला रूप।
- source_word: ኀደረ
  choice: बस गया / रहा
  rationale: एक ही गीइज़ क्रिया दोनों खंडों में है, पर तेरह के गंतव्य पर ठहरने के लिए ‘बस गया’ और अब्राम के उसके साथ निवास के लिए ‘रहा’ हिंदी में अधिक स्वाभाविक हैं।
theological_decisions:
- issue: आरंभिक खंड का पिछले पद से व्याकरणिक संबंध
  choice: खंडित आरंभ को बनाए रखा और पादटिप्पणी से संकेत दिया
  alternative: ‘वह अपने पिता तेरह के सामने मर गया’ जोड़कर वाक्य पूरा करना
  rationale: इस पद में कर्ता और मृत्यु-सूचक क्रिया नहीं हैं; वे पिछले पद से आती हैं। उन्हें यहाँ जोड़ना अर्थ को स्पष्ट करता, पर दिए गए पद-विभाजन से बाहर का पाठ सम्मिलित करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिंदी अपनाई गई है। मूल घटनाक्रम और वाक्य-क्रम सुरक्षित हैं; स्थान-नामों के लिए प्रचलित हिंदी बाइबलीय रूप प्रयुक्त हुए हैं।
