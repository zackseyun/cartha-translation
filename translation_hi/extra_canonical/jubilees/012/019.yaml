  yaml_path: translation/extra_canonical/jubilees/012/019.yaml
  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
translation:
  language: hi
  text: उस रात उसने कहा, “हे मेरे परमेश्वर, परमप्रधान परमेश्वर, मेरे लिए केवल तू ही परमेश्वर है। तूने सब कुछ रचा है, और जो कुछ अस्तित्व में है, वह सब तेरे हाथों का काम है। मैंने तुझे और तेरे प्रभुत्व[a] को चुना है; मुझे बचा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुद्रित पाठ का यह शब्द अस्पष्ट है; मान्य पाठ-संशोधन के अनुसार अर्थ “तेरा शासन” है। एक अन्य पाठ-समझ के अनुसार “तेरी स्तुति”।
    reason: उपलब्ध गीइज़ पाठ में संभावित लिपिकीय या मुद्रण/OCR त्रुटि है। मुख्य पाठ में पाठ-साक्ष्य से समर्थित ‘प्रभुत्व’ रखा गया है, और वास्तविक पाठगत अनिश्चितता पाठक के लिए सुरक्षित की गई है।
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: परमप्रधान परमेश्वर
  rationale: यह उपाधि परमेश्वर की सर्वोच्चता को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: አንተ፡ ባሕቲትከ፡ ሊተ፡ አምላክ
  choice: मेरे लिए केवल तू ही परमेश्वर है
  rationale: ‘अकेले/केवल तू’ के बल और ‘मेरे लिए’ के व्यक्तिगत संबंध—दोनों को सुरक्षित रखा गया है।
- source_word: ኵሎ፡ ፈጠርከ
  choice: तूने सब कुछ रचा है
  rationale: सृष्टि की समग्रता को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: ግብረ፡ እደዊከ፡ ኵሉ፡ ኮነ፡ ዘሀሎ
  choice: जो कुछ अस्तित्व में है, वह सब तेरे हाथों का काम है
  rationale: मूल के ‘तेरे हाथों का काम’ रूपक और अस्तित्वमान सभी वस्तुओं की व्यापकता दोनों बनाए रखी गई हैं।
- source_word: 'ወመሰክንከ (संभावित पाठ-संशोधन: ወመኰንንከ)'
  choice: और तेरे प्रभुत्व को
  rationale: प्रसंग तथा मान्य पाठ-साक्ष्य ‘शासन/प्रभुत्व’ का समर्थन करते हैं; ‘प्रभुत्व’ गरिमापूर्ण और सामान्य हिन्दी में बोधगम्य है।
- source_word: አድኅነኒ
  choice: मुझे बचा
  rationale: अंतिम विनती को सीधे और पूर्ण रूप में प्रस्तुत करता है; यहाँ उद्धार के स्वर को किसी विशेष धार्मिक अर्थ तक सीमित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर और उसके प्रभुत्व को ‘चुनने’ की अभिव्यक्ति
  choice: मैंने तुझे और तेरे प्रभुत्व को चुना है
  alternative: मैंने तुझे अपना शासक चुना है
  rationale: मूल में परमेश्वर और उसके प्रभुत्व—दोनों अलग कर्म-पदों की तरह आते हैं। सहज बनाने के लिए उन्हें एक में मिलाने से मूल की असामान्य किंतु अर्थपूर्ण संरचना मिट जाती।
- issue: अंतिम क्रिया में उद्धार का अर्थ
  choice: मुझे बचा
  alternative: मेरा उद्धार कर
  rationale: ‘मुझे बचा’ व्यापक अर्थ रखता है और तत्काल रक्षा तथा धार्मिक उद्धार के बीच मूल की संभावित अर्थ-व्याप्ति को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली रखी गई है। परमेश्वर को सीधे संबोधन में ‘तू/तेरे’ का प्रयोग निकटता और मूल के एकवचन संबोधन को दर्शाता है; भाषा न तो अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की।
