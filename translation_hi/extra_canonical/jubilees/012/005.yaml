base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/005.yaml
  text: There is no spirit in them, because they are the work of hands; and you carry them on your shoulders, and from them there is no help for you, except great shame.
translation:
  language: hi
  text: उनमें प्राण नहीं है, क्योंकि वे हाथों की बनाई हुई चीज़ें हैं। तुम उन्हें अपने कंधों पर ढोते हो, और उनसे तुम्हें बड़ी लज्जा के सिवा कोई सहायता नहीं मिलती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈስ
  choice: आत्मा
  rationale: मूल शब्द का अर्थ ‘आत्मा/प्राण/जीवन-श्वास’ हो सकता है। मूर्तियों में चेतन जीवन न होने के कथन में ‘आत्मा’ मूल की धार्मिक और अस्तित्वगत व्यापकता बनाए रखता है।
- source_word: ግብረ፡ እደው
  choice: मनुष्यों के हाथों की कारीगरी
  rationale: शाब्दिक अर्थ ‘हाथों का काम’ है। ‘मनुष्यों के’ जोड़ने से हिन्दी में आशय स्वाभाविक रूप से स्पष्ट होता है कि ये मानव-निर्मित वस्तुएँ हैं, बिना कोई नया वैचारिक दावा जोड़े।
- source_word: ትጸውርዎሙ
  choice: ढोते हो
  rationale: यह क्रिया उठाकर ले जाने या भार की तरह वहन करने का भाव देती है; कंधों के संदर्भ में ‘ढोते हो’ सहज और सटीक है।
- source_word: ረድኤት
  choice: सहायता
  rationale: मूल का सामान्य अर्थ ‘मदद/सहायता’ है; ‘सहायता’ गरिमापूर्ण आधुनिक हिन्दी के अनुकूल है।
- source_word: ሐሳር፡ ዐቢይ
  choice: बड़ी लज्जा
  rationale: यह पद बड़ा अपमान, लज्जा या दुर्दशा सूचित कर सकता है। ‘बड़ी लज्जा’ अंग्रेज़ी परामर्श-पाठ से मेल खाते हुए मूल की नकारात्मक सामाजिक-अर्थवत्ता बनाए रखता है।
theological_decisions:
- issue: मूर्तियों में መንፈስ का अभाव
  choice: ‘कोई आत्मा नहीं है’
  alternative: ‘कोई प्राण नहीं है’
  rationale: ‘आत्मा’ मूल शब्द की व्यापकता को बनाए रखता है और कथन को केवल जैविक जीवन तक सीमित नहीं करता; फिर भी यह नहीं बताता कि लेखक आत्मा की प्रकृति के बारे में कोई विशिष्ट सांप्रदायिक सिद्धांत दे रहा है।
- issue: अंतिम विरोधाभासी वाक्यांश
  choice: ‘बड़ी लज्जा के सिवा कोई सहायता नहीं मिलती’
  alternative: ‘उनसे तुम्हें कोई सहायता नहीं, बल्कि बड़ी लज्जा मिलती है’
  rationale: चुना हुआ रूप मूल के ‘सिवा’ वाले वाक्य-विन्यास और उसकी तीखी विडंबना को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट शैली रखी गई है। मूल में केवल कंधों पर ढोने की बात है; ‘वे तुम्हारे लिए बोझ हैं’ जैसा अस्रोत विस्तार नहीं जोड़ा गया।
