  text: He causes it to rain in the morning and in the evening; and if he wills, he does not make it come down. And everything is in his hand." And he prayed
translation:
  language: hi
  text: “वह सुबह और शाम वर्षा करता है; और यदि वह चाहे, तो वर्षा नहीं होने देता। सब कुछ उसके हाथ में है।” और उसने प्रार्थना की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और उसने प्रार्थना की” शब्द दिए गए स्रोत-खंड के अंत में हैं; संभव है कि वे अगले वचन की कथा का आरम्भ हों।
    reason: verse_segmentation
lexical_decisions:
- source_word: ያዘንም
  choice: वर्षा करता है
  rationale: यह क्रिया वर्षा कराने या बरसाने का भाव व्यक्त करती है; सामान्य आधुनिक हिन्दी में ‘वर्षा करता है’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ነግሀ፡ ወሰርከ
  choice: सुबह और शाम
  rationale: दोनों काल-सूचक शब्दों का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ወእመ፡ ፈቀደ፡ ኢያወርድ
  choice: और यदि वह चाहे, तो वर्षा नहीं होने देता
  rationale: शर्त केवल वर्षा रोकने वाले दूसरे उपवाक्य से जुड़ी है। ‘नीचे नहीं उतारता’ की शाब्दिक छवि की अपेक्षा वर्षा के प्रसंग में यह हिन्दी अधिक स्पष्ट है।
- source_word: ወኵሉ፡ ውስተ፡ እዴሁ
  choice: सब कुछ उसके हाथ में है
  rationale: मूल मुहावरे को हिन्दी में समान रूप से स्वाभाविक और अधिकार/नियंत्रण के अर्थ सहित रखा गया है।
- source_word: ወጸለየ
  choice: और उसने प्रार्थना की
  rationale: स्रोत-खंड के अंतिम शब्दों को अनूदित किया गया है, यद्यपि वे संभवतः अगले वचन की कथा आरम्भ करते हैं।
theological_decisions:
- issue: ईश्वरीय इच्छा और वर्षा रोकने का संबंध
  choice: ‘यदि वह चाहे’ को केवल वर्षा न होने देने वाले उपवाक्य से जोड़ा गया
  alternative: इसे पहले उपवाक्य, अर्थात वर्षा करने, से भी जोड़ना
  rationale: गीज़ पाठ में शर्तसूचक पद पहले कथन के बाद आता है; इसलिए उसे पहले कथन में जोड़ना स्रोत से असमर्थित होगा।
- issue: ‘सब कुछ उसके हाथ में है’ का अर्थ
  choice: मूल नियंत्रण/अधिकार संबंधी मुहावरा बनाए रखा
  alternative: इसे स्पष्ट करके ‘सब कुछ उसके वश में है’ करना
  rationale: ‘हाथ में’ हिन्दी में भी स्वाभाविक है और मूल की अभिव्यक्ति तथा उसकी संभावित अर्थ-व्याप्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष कथन के उद्धरण-चिह्न बनाए गए हैं और स्रोत में उपस्थित अंतिम क्रिया को पद-विभाजन संबंधी टिप्पणी सहित रखा गया है।
