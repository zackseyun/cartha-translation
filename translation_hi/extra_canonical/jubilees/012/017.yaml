translation:
  language: hi
  text: …सूर्य और चंद्रमा के[a], सब प्रभु के हाथ में हैं। मैं क्यों खोजता हूँ? यदि वह चाहे…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद बीच वाक्य से आरम्भ होता है; ‘सूर्य और चंद्रमा के’ पिछले पद से जुड़ता है। इसी प्रकार अन्त का ‘यदि वह चाहे’ अगले वाक्य का आरम्भ है।
    reason: खंड-विभाजन के कारण आरम्भ और अन्त दोनों अधूरे हैं; पाठक को कृत्रिम रूप से पूर्ण वाक्य समझने से बचाना।
lexical_decisions:
- source_word: ለፀሓይ፡ ወለወርኅ
  choice: सूर्य और चन्द्रमा के
  rationale: दोनों संज्ञाओं पर लगा संबंधसूचक उपसर्ग पूर्ववर्ती वाक्य से जुड़ाव दिखाता है; इसलिए खंडित आरम्भ को पूरा वाक्य बनाकर अर्थ नहीं जोड़ा गया।
- source_word: ኵሉ፡ በእዴ፡ እግዚአብሔር
  choice: सब प्रभु के हाथ में हैं
  rationale: ‘सब’ और ‘प्रभु के हाथ में’ की मूल छवि को सरल, स्वाभाविक हिन्दी में सुरक्षित रखा गया।
- source_word: ለምንት፡ አነ፡ እትኃሠሥ
  choice: मैं क्यों खोजता हूँ?
  rationale: प्रथम पुरुष के प्रश्न को बिना किसी अनकहे कर्म या निरंतरता के सीधे रूप में रखा गया।
- source_word: በእመ፡ ፈቀደ
  choice: यदि वह चाहे…
  rationale: यह शर्तसूचक पद अगले वाक्य का आरम्भ है; इसे पिछले प्रश्न से जोड़ने के बजाय अधूरे अगले खंड के रूप में रखा गया।
theological_decisions:
- issue: ‘प्रभु के हाथ में’ वाक्यांश का आशय
  choice: मूल रूपक को यथावत रखना
  alternative: इसे ‘प्रभु के नियंत्रण में’ के रूप में स्पष्ट करना
  rationale: मूल पाठ की ठोस और धर्मवैचारिक रूप से अर्थसमृद्ध छवि को व्याख्यात्मक अमूर्तीकरण से बदलना उचित नहीं है।
- issue: ‘यदि वह चाहे’ का वाक्यगत संबंध
  choice: इसे अगले, अधूरे वाक्य का आरम्भ दिखाना
  alternative: इसे ‘मैं क्यों खोजता रहूँ, यदि वह चाहे?’ के रूप में पिछले प्रश्न से जोड़ना
  rationale: स्रोत-खंड का विभाजन यहाँ वाक्य-सीमा के बीच हुआ है; पिछले प्रश्न से जोड़ना ऐसा संबंध बना देगा जो मूल से समर्थित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। आरम्भ और अन्त की वास्तविक खंडित अवस्था को दीर्घविराम से दिखाया गया है; अस्वाभाविकता मिटाने के लिए स्रोत से बाहर के शब्द नहीं जोड़े गए।
