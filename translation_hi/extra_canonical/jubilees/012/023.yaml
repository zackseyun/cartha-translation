revisions:
- from: और मैं तुम्हारा नाम महान करूँगा, और तुम पृथ्वी पर आशीषित होगे; और तुम में पृथ्वी की सारी जातियाँ आशीष पाएँगी। जो तुम्हें आशीष देते हैं, उन्हें मैं आशीष दूँगा; और जो तुम्हें शाप देते हैं, उन्हें मैं शाप दूँगा।
  to: और मैं तुम्हारा नाम महान करूँगा, और तुम पृथ्वी पर धन्य होगे; और तुम में पृथ्वी के सभी राष्ट्र धन्य होंगे। जो तुम्हें आशीष देते हैं, उन्हें मैं आशीष दूँगा; और जो तुम्हें शाप देते हैं, उन्हें मैं शाप दूँगा।
  rationale: 'The revision makes two limited idiomatic and terminological improvements: “आशीषित” becomes “धन्य,” consistently reflecting the blessing predicates, and “जातियाँ” becomes “राष्ट्र” to express the intended nations/peoples sense clearly. The unresolved force of “in you” is retained, and no material from the parallel Genesis wording is added.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:30:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly omits an initial promise to bless the addressee, since the supplied Geʽez begins with making the name great. It preserves the sequence and parallelism: great name; blessed in/on the earth; all earthly nations blessed in the addressee; reciprocal blessing and cursing. “तुम में” appropriately retains the semantic openness of ብከ rather than resolving it as only ‘through you.’'
  naturalness: “आशीषित” is intelligible but is not idiomatic modern standard Hindi. “धन्य” is the natural elevated biblical Hindi predicate and permits the repeated source blessing terminology to be represented consistently. “राष्ट्र” avoids the potentially caste-associated modern sense of “जातियाँ” while fitting the reference to the peoples/nations of the earth.
  terminology: Use “धन्य” consistently for the blessing predicates and “आशीष दूँगा” for the active acts of blessing. Retain “शाप” for the corresponding curse clauses. “पृथ्वी के सभी राष्ट्र” accurately and naturally conveys all the nations/peoples of the earth.
  issues:
  - severity: low
    issue: The term “आशीषित” is awkward in modern Hindi.
    rationale: Although semantically understandable, it is less natural than the established formal Hindi biblical expression “धन्य.” The revision improves idiom without changing voice, scope, or meaning.
  - severity: low
    issue: “जातियाँ” can carry a caste-related association in current Hindi.
    rationale: In this context the source and English audit trail refer to nations/peoples. “राष्ट्र” communicates this sense more directly in modern standard Hindi.
  revised_text: और मैं तुम्हारा नाम महान करूँगा, और तुम पृथ्वी पर धन्य होगे; और तुम में पृथ्वी के सभी राष्ट्र धन्य होंगे। जो तुम्हें आशीष देते हैं, उन्हें मैं आशीष दूँगा; और जो तुम्हें शाप देते हैं, उन्हें मैं शाप दूँगा।
  revised_footnotes: []
  revision_rationale: 'The revision makes two limited idiomatic and terminological improvements: “आशीषित” becomes “धन्य,” consistently reflecting the blessing predicates, and “जातियाँ” becomes “राष्ट्र” to express the intended nations/peoples sense clearly. The unresolved force of “in you” is retained, and no material from the parallel Genesis wording is added.'
