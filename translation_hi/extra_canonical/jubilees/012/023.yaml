  yaml_path: translation/extra_canonical/jubilees/012/023.yaml
  text: And I will make your name great, and you will be blessed in the earth, and in you all the nations of the earth will be blessed. And those who bless you I will bless, and those who curse you I will curse.
translation:
  language: hi
  text: और मैं तुम्हारा नाम महान करूँगा, और तुम पृथ्वी पर धन्य होगे; और तुम में पृथ्वी के सभी राष्ट्र धन्य होंगे। जो तुम्हें आशीष देते हैं, उन्हें मैं आशीष दूँगा; और जो तुम्हें शाप देते हैं, उन्हें मैं शाप दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐቢ፡ ስመከ
  choice: और मैं तुम्हारा नाम महान करूँगा
  rationale: गीज़ पाठ सीधे ‘मैं तुम्हारा नाम महान करूँगा’ से आरम्भ होता है; यहाँ अतिरिक्त ‘मैं तुम्हें आशीष दूँगा’ नहीं जोड़ा गया।
- source_word: ትከውን፡ ቡሩከ፡ ውስተ፡ ምድር
  choice: तुम पृथ्वी पर आशीषित होगे
  rationale: ‘आशीषित होना’ का निष्क्रिय भाव बनाए रखा गया और ውስተ ምድር को स्वाभाविक हिन्दी में ‘पृथ्वी पर’ व्यक्त किया गया।
- source_word: ይትባረኩ፡ ብከ
  choice: तुम में … आशीष पाएँगी
  rationale: ብከ के ‘तुम में/तुम्हारे द्वारा’ संबंध को बिना अनावश्यक रूप से निश्चित किए ‘तुम में’ रखा गया; निष्क्रिय क्रिया को हिन्दी में ‘आशीष पाएँगी’ कहा गया।
- source_word: ኵሎሙ፡ አሕዛበ፡ ምድር
  choice: पृथ्वी की सारी जातियाँ
  rationale: አሕዛብ का अर्थ यहाँ पृथ्वी के जनसमूहों अथवा राष्ट्रों से है; बाइबलीय और सामान्य हिन्दी में ‘जातियाँ’ उपयुक्त है।
- source_word: ይረግሙከ / እረግሞሙ
  choice: तुम्हें शाप देते हैं / उन्हें मैं शाप दूँगा
  rationale: स्रोत में प्रयुक्त समान धातु और दोनों उपवाक्यों की समानांतर रचना को बनाए रखा गया।
theological_decisions:
- issue: ‘तुम में’ आशीष पाने का माध्यम अथवा आधार
  choice: तुम में पृथ्वी की सारी जातियाँ आशीष पाएँगी
  alternative: तुम्हारे द्वारा पृथ्वी की सारी जातियाँ आशीष पाएँगी
  rationale: गीज़ ብከ दोनों अर्थ-संभावनाओं को सह सकता है। ‘तुम में’ स्रोत की औपचारिकता और वास्तविक अस्पष्टता को अधिक निकटता से सुरक्षित रखता है।
- issue: आरम्भ में आशीष की अतिरिक्त प्रतिज्ञा
  choice: पद को ‘मैं तुम्हारा नाम महान करूँगा’ से आरम्भ किया गया
  alternative: ‘मैं तुम्हें आशीष दूँगा’ जोड़ना
  rationale: प्रदत्त गीज़ पाठ में आरम्भिक ‘मैं तुम्हें आशीष दूँगा’ नहीं है, इसलिए समानान्तर उत्पत्ति-पाठ के आधार पर उसे आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम’ रखा गया है; वाक्य-समानांतरता और आशीष/शाप की पुनरावृत्ति संरक्षित है।
