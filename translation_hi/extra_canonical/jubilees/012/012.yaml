  yaml_path: translation/extra_canonical/jubilees/012/012.yaml
  text: And in the sixtieth year of the life of Abram, that is, in the fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no one knew it.
translation:
  language: hi
  text: और अब्राम के जीवन के साठवें वर्ष में—अर्थात् चौथे सप्ताह के चौथे वर्ष में—अब्राम रात को उठा और उसने मूर्तियों का भवन जला दिया। उसने भवन के भीतर की सारी वस्तुएँ जला दीं, और किसी को इसका पता न चला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤተ፡ ጣዖታት
  choice: मूर्तियों का भवन
  rationale: शाब्दिक अर्थ ‘मूर्तियों का घर/भवन’ है। ‘मन्दिर’ कहना सम्भव होता, पर स्रोत उस अधिक विशिष्ट धार्मिक पद का प्रयोग नहीं करता; इसलिए मूल की व्यापकता बनाए रखी गई।
- source_word: አውዐየ
  choice: जला दिया
  rationale: क्रिया आग लगाकर भस्म करने या जलाने का भाव देती है। हिन्दी में इस प्रसंग के लिए ‘जला दिया’ स्वाभाविक और स्पष्ट है।
- source_word: ኵሎ፡ በውስተ፡ ቤት
  choice: भवन के भीतर की सारी वस्तुएँ
  rationale: मूलतः ‘घर के भीतर सब कुछ’। हिन्दी में निर्जीव सामग्री का आशय स्पष्ट करने के लिए ‘सारी वस्तुएँ’ कहा गया, बिना कोई विशेष वस्तु जोड़े।
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: किसी को इसका पता न चला
  rationale: शाब्दिक भाव ‘कोई मनुष्य नहीं था जो जानता था’ है। आधुनिक हिन्दी में यह रूप घटना के गुप्त रहने का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
