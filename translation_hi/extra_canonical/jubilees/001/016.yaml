  text: with all my heart and with all my soul. And they will be for a blessing and not for a curse, and they will be the head and not the tail. And I will build my sanctuary in their midst, and I will dwell with them,
translation:
  language: hi
  text: मेरे पूरे हृदय और मेरे पूरे प्राण से। और वे आशीष होंगे, श्राप नहीं; वे सिर होंगे, पूँछ नहीं। और मैं उनके बीच अपना पवित्र स्थान बनाऊँगा और उनके साथ निवास करूँगा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሉ፡ ልብየ፡ ወበኵሉ፡ ነፍስየ
  choice: अपने पूरे हृदय और अपने पूरे प्राण से
  rationale: प्रथम पुरुष संबंधसूचक प्रत्यय और ‘समस्त/पूरा’ की पुनरावृत्ति को सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ለበረከት
  choice: आशीष का कारण
  rationale: लाम-सदृश संबंधवाचक रचना ‘आशीष के लिए’ का आशय हिन्दी में स्पष्ट करता है, बिना आशीष की धार्मिक धारणा को बदलने के।
- source_word: ርእሰ፡ ወአኮ፡ ዘነበ
  choice: सिर होंगे, पूँछ नहीं
  rationale: व्यवस्थाविवरण-सदृश मूल रूपक को अक्षुण्ण रखा गया है।
- source_word: መቅደስየ
  choice: अपना पवित्रस्थान
  rationale: ‘मेरा पवित्रस्थान’ के अर्थ को हिन्दी के कर्ता-सापेक्ष स्वत्व ‘अपना’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: እኀድር፡ ምስሌሆሙ
  choice: उनके साथ निवास करूँगा
  rationale: क्रिया का अर्थ स्थायी वास है; ‘निवास’ गरिमापूर्ण और सामान्य धार्मिक हिन्दी में सुबोध है।
theological_decisions:
- issue: ‘आशीष’ और ‘शाप’ के साथ लोगों का संबंध
  choice: वे आशीष का कारण होंगे, शाप का नहीं
  alternative: वे आशीष होंगे, शाप नहीं
  rationale: मूल की संक्षिप्त संबंधवाचक अभिव्यक्ति दोनों अर्थों की अनुमति दे सकती है; चुना हुआ पाठ स्वाभाविक हिन्दी में उनके आशीषकारी होने का भाव देता है, न कि उन्हें अमूर्त ‘आशीष’ से पूर्णतः अभिन्न ठहराता है।
- issue: ईश्वर का समुदाय के बीच और साथ निवास
  choice: मैं उनके बीच अपना पवित्रस्थान बनाऊँगा और उनके साथ निवास करूँगा
  alternative: मैं उनके बीच अपना मंदिर बनाऊँगा और उनमें वास करूँगा
  rationale: ‘पवित्रस्थान’ भवन से अधिक व्यापक पवित्र निवास-धारणा बनाए रखता है, और मूल ‘उनके साथ’ को ‘उनमें’ में बदलकर अंतर्वास का अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली। पद उपलब्ध अंश के बीच से आरम्भ और अल्पविराम पर समाप्त होता है, इसलिए खंडित वाक्य-सीमा को स्रोत के अनुसार बनाए रखा गया है।
