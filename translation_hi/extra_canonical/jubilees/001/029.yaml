base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/029.yaml
  text: And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years from the time of creation, of the law and of the testimony, of the weeks of their jubilees, year by year in all their number, and the jubilees year by year, from the day of creation until the day when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of Yahweh is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel, and that it may be thus from that day and throughout all the days of the earth.
translation:
  language: hi
  text: और उपस्थिति का दूत, जो इस्राएल की छावनी के आगे-आगे चलता था, वर्षों के विभाजनों की पटियाएँ ले गया—सृष्टि के समय से व्यवस्था और साक्षी की, तथा उनके जुबली-वर्षों के सप्ताहों की—उनकी पूरी गिनती के अनुसार वर्ष-दर-वर्ष, और जुबली-वर्षों की भी वर्ष-दर-वर्ष, सृष्टि के दिन से उस दिन तक जब आकाश, पृथ्वी और उनके सभी प्राणी आकाश की शक्तियों के अनुसार और पृथ्वी की सारी सृष्टि के अनुसार नवीनीकृत किए जाएँगे; उस समय तक जब यरूशलेम में सिय्योन पर्वत पर यहोवा का पवित्रस्थान सृजा जाएगा, और सभी ज्योतियाँ इस्राएल के सभी चुने हुओं के लिए चंगाई, शांति और आशीष हेतु नवीनीकृत की जाएँगी; और ऐसा उस दिन से पृथ्वी के सभी दिनों तक होता रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: उपस्थिति का दूत
  rationale: शाब्दिक अर्थ ‘मुख/उपस्थिति का दूत’ है; ‘उपस्थिति का दूत’ पदवी की विशिष्टता बनाए रखते हुए हिंदी में स्वाभाविक है।
- source_word: ጸላተ፡ ዘክፋሌ፡ ዓመታት
  choice: वर्षों के विभाजनों की पटियाएँ
  rationale: ጸላት को लिखित पटियाओं और ክፋሌ को काल-विभाजनों के अर्थ में रखा गया है।
- source_word: ሕገ፡ ወለስምዕ
  choice: व्यवस्था और साक्षी
  rationale: दोनों पारंपरिक धार्मिक-साहित्यिक संज्ञाओं को अलग और समानांतर रखा गया है।
- source_word: ኢዮቤሌዎን
  choice: जुबली-वर्ष / जुबलियाँ
  rationale: पुस्तक की कालगणना में तकनीकी अर्थ स्पष्ट करने हेतु पहली बार ‘जुबली-वर्ष’, फिर संक्षिप्त ‘जुबलियाँ’ प्रयुक्त है।
- source_word: ይትኃደስ / ይትኄደሱ
  choice: नए किए जाएँगे / नई की जाएँगी
  rationale: निष्क्रिय नवीनीकरण का भाव सुरक्षित है; इसे ‘नई सृष्टि’ जैसी अतिरिक्त संज्ञा में नहीं बदला गया।
- source_word: መቅደሰ፡ እግዚአብሔር
  choice: यहोवा का पवित्रस्थान
  rationale: መቅደስ के लिए ‘पवित्रस्थान’ और POB की नीति के अनुरूप दिव्य नाम के लिए ‘यहोवा’ चुना गया।
- source_word: ብርሃናት
  choice: ज्योतियाँ
  rationale: बहुवचन ‘प्रकाशों/ज्योतियों’ को खगोलीय अथवा व्यापक आलोक-संदर्भ की अस्पष्टता सहित रखा गया है।
theological_decisions:
- issue: पवित्रस्थान के लिए प्रयुक्त सृजन-क्रिया
  choice: पवित्रस्थान रचा जाएगा
  alternative: पवित्रस्थान बनाया जाएगा
  rationale: स्रोत में ‘सृजित/रचा जाना’ वाली क्रिया है; असामान्य अभिव्यक्ति को सामान्य निर्माण-भाषा में पूरी तरह समतल नहीं किया गया।
- issue: आकाश की शक्तियों और पृथ्वी की सृष्टि के अनुरूप नवीनीकरण
  choice: मूल समानांतरता और व्यापक अर्थ को बनाए रखा
  alternative: इसे किसी विशेष ब्रह्मांड-विज्ञान या पुनरुत्थान-सिद्धांत के रूप में स्पष्ट करना
  rationale: वाक्यांश का सटीक आशय कठिन है; अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
- issue: इस्राएल के चुने हुए
  choice: इस्राएल के सभी चुने हुए
  alternative: सभी चुने हुए लोग अथवा कलीसिया
  rationale: स्रोत की स्पष्ट इस्राएल-संबंधी अभिव्यक्ति को बिना विस्तार या प्रतिस्थापन के सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, पाठनीय शैली रखी गई है। मूल के लंबे संचयी वाक्य को अर्धविरामों और डैश से व्यवस्थित किया गया, पर उसकी कालक्रमिक श्रृंखला और पुनरावृत्ति सुरक्षित रखी गई है।
