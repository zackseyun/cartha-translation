  yaml_path: translation/extra_canonical/jubilees/001/028.yaml
  text: And all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion forever, and Zion and Jerusalem will be holy.”
translation:
  language: hi
  text: और सब जानेंगे कि मैं इस्राएल का परमेश्वर, याकूब की सभी संतानों का पिता और सिय्योन पर्वत पर सदा-सर्वदा राजा हूँ; और सिय्योन और यरूशलेम पवित्र होंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያእምር
  choice: जानेंगे
  rationale: गीज़ क्रिया का भाव ‘जानना/पहचानना’ है; भविष्यसूचक संदर्भ के अनुरूप बहुवचन भविष्यकाल रखा गया।
- source_word: አምላከ፡ እስራኤል
  choice: इस्राएल का परमेश्वर
  rationale: संबंधसूचक रचना का स्वाभाविक और पारंपरिक हिन्दी रूप।
- source_word: አብ፡ ለኵሎሙ፡ ደቂቀ፡ ያዕቆብ
  choice: याकूब की सभी संतानों का पिता
  rationale: शाब्दिक अर्थ ‘याकूब के सभी पुत्रों/बच्चों का पिता’ है; ‘संतानों’ से वंशजों का समावेशी आशय सहज हिन्दी में व्यक्त होता है।
- source_word: ንጉሥ፡ በደብረ፡ ጽዮን
  choice: सिय्योन पर्वत पर ... राजा
  rationale: स्थानवाचक संबंध और राजकीय पदवी दोनों सीधे सुरक्षित रखे गए।
- source_word: ለዓለመ፡ ዓለም
  choice: सदा-सर्वदा
  rationale: अनंत अवधि दर्शाने वाली गीज़ अभिव्यक्ति का गरिमापूर्ण और प्रचलित हिन्दी समतुल्य।
- source_word: ቅድስት
  choice: पवित्र होंगे
  rationale: सिय्योन और यरूशलेम संयुक्त कर्ता हैं, इसलिए हिन्दी में बहुवचन क्रिया स्वाभाविक है; विशेषण का मूल अर्थ ‘पवित्र’ रखा गया।
theological_decisions:
- issue: ‘पिता’ का दायरा
  choice: याकूब की सभी संतानों का पिता
  alternative: सबका पिता
  rationale: स्रोत में ‘सब’ स्वतंत्र सार्वभौमिक पद नहीं, बल्कि ‘याकूब की संतानों’ को विशेषित करता है; इसलिए दायरा उसी प्रकार सीमित रखा गया।
- issue: राजत्व की अवधि
  choice: सदा-सर्वदा राजा
  alternative: युगानुयुग राजा
  rationale: दोनों अनंतता व्यक्त कर सकते हैं; ‘सदा-सर्वदा’ आधुनिक पाठक के लिए अधिक सहज है और स्रोत के प्रबल कालगत भाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय किंतु सहज शैली। स्रोत में न पाए जाने वाले किसी प्रकट होने संबंधी वाक्यांश को नहीं जोड़ा गया। अंतिम उद्धरण-चिह्न व्यापक अनुच्छेद के समापन को मानकर रखा गया है।
