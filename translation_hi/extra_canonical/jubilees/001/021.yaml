translation:
  language: hi
  text: शुद्ध हृदय और पवित्र आत्मा दे, और अब से सदा तक उन्हें उनके पापों में न फँसने दे।” तब प्रभु ने मूसा से कहा, “मैं उनकी विरोधी प्रवृत्ति, उनके विचार और उनकी हठीली गर्दन को जानता हूँ; वे नहीं सुनेंगे
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ንጹሐ
  choice: शुद्ध हृदय
  rationale: शाब्दिक अर्थ ‘शुद्ध हृदय’ है; प्रार्थना के पूर्ववर्ती वाक्य से जुड़ने के कारण हिन्दी में ‘दे’ जोड़ा गया है।
- source_word: መንፈሰ፡ ቅዱሰ
  choice: पवित्र आत्मा
  rationale: स्रोत की संज्ञात्मक अभिव्यक्ति को सीधे और परिचित धार्मिक हिन्दी में रखा गया है।
- source_word: ይትዐቀጹ
  choice: फँसने
  rationale: क्रिया पापों में पकड़े या जकड़े जाने का भाव देती है; ‘फँसने’ सहज हिन्दी में जाल-सदृश अर्थ बनाए रखता है।
- source_word: ተዋሥኦቶሙ
  choice: उनकी हठधर्मिता
  rationale: यह विरोध, प्रतिकूलता या विद्रोही रुझान का बोध कराता है; ‘हठधर्मिता’ प्रसंग में उनके अड़ियल विरोध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ሕሊናሆሙ
  choice: उनके विचार
  rationale: मन, मंशा या विचार के अर्थ-क्षेत्र में यहाँ बहुवचन ‘विचार’ उपयुक्त है।
- source_word: ይቡሰ
  choice: उनकी अकड़ी हुई गर्दन
  rationale: यह कठोर या अड़ियल गर्दन की पारंपरिक रूपकात्मक छवि को बनाए रखता है और उसे व्याख्यात्मक मुहावरे में नहीं बदलता।
theological_decisions:
- issue: ‘पवित्र आत्मा’ का आशय
  choice: पवित्र आत्मा
  alternative: पवित्र मनोभाव
  rationale: स्रोत में መንፈስ ‘आत्मा’ है; संभावित व्यक्तिगत अथवा गुणात्मक अर्थ को अनावश्यक रूप से तय किए बिना मूल अभिव्यक्ति सुरक्षित रखी गई है।
- issue: पापों में फँसने की कर्तृवाच्यता
  choice: उन्हें उनके पापों में न फँसने दे
  alternative: उनके पाप उन्हें न फँसाएँ
  rationale: स्रोत की निष्क्रिय/मध्यवाच्य संरचना और प्रार्थनात्मक निवेदन को बनाए रखा गया है, बिना यह निश्चित किए कि फँसाने वाला कौन है।
- issue: अकड़ी हुई गर्दन का रूपक
  choice: रूपक को अक्षुण्ण रखा गया
  alternative: उनकी ज़िद
  rationale: धर्मग्रंथीय रूपक स्वयं पाठ का हिस्सा है; उसे केवल अमूर्त गुण में बदलने से स्रोत की छवि खो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यह पद पिछले वाक्य की प्रार्थना के बीच से आरम्भ और अगले कथन के बीच में समाप्त होता है, इसलिए आरम्भ में निहित क्रिया ‘दे’ जोड़ी गई है तथा अंत में पूर्णविराम नहीं लगाया गया। ‘प्रभु’ द्वारा ईश्वरीय नाम की मुद्रण-परंपरा व्यक्त नहीं होती, पर उपलब्ध स्रोत में प्रयुक्त እግዚአብሔር का स्वाभाविक हिन्दी रूप यही है।
