base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/026.yaml
  text: And I will write down for you all these things that I am making known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them throughout all the ages of eternity.”
translation:
  language: hi
  text: '“और जो कुछ मैं इस पर्वत पर तुम्हें बता रहा हूँ—जो आरम्भ की बातें हैं, जो अन्त की बातें हैं और जो आनेवाली हैं—वह सब मैं तुम्हारे लिए लिखूँगा: व्यवस्था में, साक्षी में, और उनकी जुबिलियों के सप्ताहों में दिनों के सभी विभागों में, सदा के लिए, जब तक कि मैं उतरकर उनके साथ युगानुयुग निवास करूँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ ዘንተ፡ ነገረ
  choice: वह सब
  rationale: यह पद केवल बोले गए ‘शब्दों’ के बजाय प्रकट की जा रही समस्त विषय-वस्तु की ओर संकेत करता है; इसलिए स्वाभाविक हिन्दी में ‘वह सब’ चुना गया।
- source_word: ዘአነ፡ አየድዐከ
  choice: जो कुछ मैं ... तुम्हें बता रहा हूँ
  rationale: गीज़ क्रिया का अपूर्ण/चलता हुआ भाव बनाए रखा गया है; इसे पूर्ण भूतकाल ‘बता चुका हूँ’ नहीं बनाया गया।
- source_word: ቀዳሚ፡ ወዘደኃሪ
  choice: आरम्भ की बातें ... अन्त की बातें
  rationale: ‘पहला और आखिरी’ का शाब्दिक ढाँचा हिन्दी में अस्पष्ट हो सकता है; यह रूप कालक्रमगत आरम्भ और अन्त को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ዙፋቤ፡ መዋዕል
  choice: दिनों के सभी विभागों
  rationale: काल-विभाजन की तकनीकी धारणा सुरक्षित रखने के लिए ‘विभागों’ का प्रयोग किया गया।
- source_word: ሕግ፡ ወ...ስምዕ
  choice: व्यवस्था और साक्षी
  rationale: दोनों विशिष्ट धार्मिक-साहित्यिक पदों को अलग और औपचारिक रूप में सुरक्षित रखा गया।
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: उनके जुबिलियों के सप्ताहों
  rationale: मूल के संबंध-विन्यास और जुबिली-आधारित कालगणना को यथासंभव ज्यों का त्यों रखा गया।
- source_word: በኵሉ፡ ዓለመ፡ ዓለም
  choice: युगानुयुग
  rationale: शाश्वत काल की मुहावरेदार पुनरुक्ति को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय अवतरण और निवास का समय
  choice: जब तक कि मैं उतरकर उनके साथ ... निवास न करूँ
  alternative: जब तक मैं उतरूँगा और उनके साथ निवास करूँगा
  rationale: मूल कथन के भविष्यगत आशय को रखा गया है, पर उसके समय या धर्मवैज्ञानिक अभिप्राय की अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: ‘व्यवस्था और साक्षी’ का पारस्परिक संबंध
  choice: व्यवस्था और साक्षी के अनुसार
  alternative: व्यवस्था में और साक्षी में
  rationale: मूल की पूर्वसर्गीय रचना एकाधिक प्रकार से समझी जा सकती है। हिन्दी में काल-विभाजनों के नियामक/साक्ष्यगत आधार का स्वाभाविक बोध देने के लिए ‘के अनुसार’ चुना गया, बिना दोनों पदों को मिला देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण शास्त्रीय लहजे के साथ। लंबे गीज़ वाक्य को पठनीय बनाने के लिए डैश और द्विबिंदु का प्रयोग किया गया है। ‘जुबिली’ को तकनीकी कालगणनात्मक पद के रूप में रखा गया है।
