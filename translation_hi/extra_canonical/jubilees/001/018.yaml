lexical_decisions:
- source_word: ኢይትናከሮሙ
  choice: न उनसे अलग हो जाऊँगा
  rationale: निषेधात्मक क्रिया को आत्म-वियोजन के रूप में रखा गया है; इससे स्रोत का संबंधपरक भाव बना रहता है और इसे केवल शारीरिक दूरी तक सीमित नहीं किया जाता।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य; इसे विशिष्ट दिव्य नाम मानकर विशेष रूप से नहीं लिखा गया।
- source_word: አምላኮሙ
  choice: उनका परमेश्वर
  rationale: बहुवचन संबंधसूचक प्रत्यय को स्पष्ट रखते हुए प्रचलित बाइबिलीय हिन्दी चुनी गई है।
- source_word: ወወድቀ፡ ሙሴ፡ በገጹ
  choice: तब मूसा मुँह के बल गिर पड़ा
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप, जो दंडवत या आराधना जैसी व्याख्या जोड़े बिना शारीरिक क्रिया को व्यक्त करता है।
theological_decisions:
- issue: प्रभु और परमेश्वर के संयुक्त आत्म-परिचय का रूप
  choice: मैं प्रभु, उनका परमेश्वर हूँ
  alternative: मैं उनका प्रभु परमेश्वर हूँ
  rationale: स्रोत में ‘प्रभु’ के बाद ‘उनका परमेश्वर’ विधेयात्मक पहचान को विस्तार देता है; अल्पविराम इस संरचना को बनाए रखता है और दोनों को एक संयुक्त उपाधि में नहीं मिला देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। पद अगले वाक्य में जारी है, इसलिए अंत में स्रोत के अनुरूप अल्पविराम रखा गया है। आरंभिक उद्धरण-चिह्न पूर्ववर्ती कथन की निरंतरता दिखाता है।
