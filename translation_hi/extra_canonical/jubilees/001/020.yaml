base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/020.yaml
  text: And create for them an upright spirit, and do not let the spirit of Beliar rule over them to accuse them before you and to turn them away from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them
translation:
  language: hi
  text: और उनके लिए एक सीधी आत्मा रच, और बेलियार की आत्मा को उन पर प्रभुता न करने दे, ऐसा न हो कि वह तेरे सामने उन पर दोष लगाए और उन्हें धार्मिकता के प्रत्येक मार्ग से हटा दे, जिससे वे तेरे सामने से मिट जाएँ। फिर भी वे तेरी प्रजा और तेरा निज भाग हैं, जिन्हें तूने अपनी महान सामर्थ्य से मिस्र के हाथ से छुड़ाया है। उनके लिए रच—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद मूल पाठ में अधूरे वाक्य ‘उनके लिए रच—’ पर समाप्त होता है; वाक्य अगले पद में जारी रहता है।
    reason: अध्याय-विभाजन के कारण पद का अंतिम वाक्यांश अपूर्ण है; पाठक को इसे त्रुटि न समझने देने के लिए सूचना आवश्यक है।
lexical_decisions:
- source_word: መንፈሰ፡ ርቱዐ
  choice: सीधी आत्मा
  rationale: ርቱዐ का मूल भाव सीधा, सही या खरा होना है। ‘सीधी आत्मा’ मूल रूपक और ‘आत्मा’ की स्पष्टता को बनाए रखती है।
- source_word: መንፈሰ፡ ቤልሖር
  choice: बेलियार की आत्मा
  rationale: व्यक्तिवाचक नाम को लिप्यंतरित किया गया है और መንፈስ को ‘आत्मा’ रखा गया है; नाम की पहचान को किसी संप्रदायगत व्याख्या से नहीं बदला गया।
- source_word: ኢይኰንንዎሙ
  choice: उन पर प्रभुता न करने दे
  rationale: संदर्भ में क्रिया का आशय उन पर अधिकार या शासन करने से है; यह अनुवाद प्रार्थनात्मक निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለአስተዋድዮቶሙ
  choice: उन पर दोष न लगाए
  rationale: यहाँ भाव परमेश्वर के सामने आरोप लगाने का है; ‘दोष लगाए’ सामान्य पाठक के लिए स्पष्ट और न्यायिक अर्थ के अनुकूल है।
- source_word: ለአዕቅጾቶሙ፡ እምኵሉ፡ ፍኖተ፡ ጽድቅ
  choice: उन्हें धार्मिकता के हर मार्ग से न भटकाए
  rationale: वाक्यांश में धार्मिकता के मार्गों से हटाने या मोड़ने का भाव है। ‘भटकाए’ इस सक्रिय कारणभाव को सहज हिन्दी में रखता है।
- source_word: እምእዴ፡ ግብጽ
  choice: मिस्र के हाथ से
  rationale: मूल के ‘हाथ’ रूपक को सुरक्षित रखा गया है; यहाँ यह मिस्र के अधिकार या नियंत्रण को सूचित करता है।
theological_decisions:
- issue: बेलियार की आत्मा का स्वरूप
  choice: व्यक्तिवाचक नाम सहित ‘बेलियार की आत्मा’
  alternative: ‘दुष्ट आत्मा’ या ‘शैतान’
  rationale: मूल पाठ विशिष्ट नाम देता है; उसे सामान्यीकृत या किसी अन्य धार्मिक पद से समान ठहराना मूल की संभावित विशिष्टता को मिटा देता।
- issue: मनुष्य की आत्मा और विरोधी आत्मा के बीच तनाव
  choice: ‘सीधी आत्मा उत्पन्न कर’ और ‘प्रभुता न करने दे’ दोनों को यथावत रखा
  alternative: इसे केवल नैतिक स्वभाव अथवा केवल बाहरी दुष्ट सत्ता के रूप में स्पष्ट करना
  rationale: पाठ एक ओर परमेश्वर से भीतर सीधी आत्मा रचने की विनती करता है और दूसरी ओर बेलियार की आत्मा की प्रभुता रोकने की; इस द्विस्तरीय तनाव को बिना व्याख्यात्मक समाधान के बनाए रखा गया है।
- issue: नाश का कारण-संबंध
  choice: ‘जिससे वे ... नष्ट हो जाएँ’
  alternative: निश्चयात्मक ‘और वे नष्ट हो जाएँगे’
  rationale: मूल में उद्देश्य/परिणाम का संबंध है। हिन्दी में ‘जिससे’ उस संबंध को रखता है, बिना यह तय किए कि नाश नियत है या आशंकित परिणाम।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण एकवचन ‘तू/तेरे’ का प्रयोग किया गया है। वाक्य की पुनरुक्ति और अंतिम अपूर्ण आज्ञा मूल संरचना के अनुसार रखी गई है।
