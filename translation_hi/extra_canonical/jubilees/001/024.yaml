  yaml_path: translation/extra_canonical/jubilees/001/024.yaml
  text: And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.
translation:
  language: hi
  text: और उनके प्राण मुझसे और मेरी सारी आज्ञाओं से जुड़े रहेंगे, और वे मेरी आज्ञाओं का पालन करेंगे। मैं उनका पिता होऊँगा, और वे मेरी संतान होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሶሙ (nafsomu)
  choice: उनके प्राण
  rationale: यह शब्द उनके भीतरी जीवन या आत्मिक अस्तित्व को दर्शाता है। ‘प्राण’ मूल की भाव-गंभीरता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ትእዛዝየ (təʾəzāzəya)
  choice: मेरी आज्ञाएँ
  rationale: मूल में परमेश्वर के आदेशों के लिए प्रयुक्त शब्द का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: ይገብሩ (yəgabəru)
  choice: पालन करेंगे
  rationale: शाब्दिक अर्थ ‘करेंगे’ है, पर आज्ञाओं के साथ हिन्दी में ‘पालन करना’ अधिक स्वाभाविक है और आशय को ठीक व्यक्त करता है।
- source_word: አበ (ʾabba)
  choice: पिता
  rationale: पारिवारिक संबंध की मूल उपमा को सीधे बनाए रखता है।
- source_word: ውሉደ (wəluḍa)
  choice: संतान
  rationale: बहुवचन ‘बच्चे/संतान’ का समावेशी भाव देता है और अनावश्यक रूप से केवल पुत्रों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर और समुदाय के बीच पिता-संतान का संबंध
  choice: ‘मैं उनका पिता होऊँगा, और वे मेरी संतान होंगे’ के रूप में संबंधपरक भाषा को सीधे रखा गया।
  alternative: इसे ‘मैं उनके लिए पिता के समान होऊँगा’ जैसे उपमात्मक रूप में नरम किया जा सकता था।
  rationale: मूल पाठ संबंध को प्रत्यक्ष रूप से व्यक्त करता है; ‘के समान’ जोड़ना उसकी धर्मवैचारिक शक्ति को अनावश्यक रूप से घटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘लिपटे रहेंगे’ मूल में निहित दृढ़ लगाव को जीवंत रूप से व्यक्त करता है; ‘आज्ञाओं का पालन’ स्वाभाविक हिन्दी प्रयोग है। उपलब्ध गीइज़ अंश का अंतिम भाग अगले वाक्य में आगे बढ़ता है, पर यहाँ दिए गए पद-संरेखण के अनुसार अनुवाद ‘वे मेरी संतान होंगे’ तक सीमित रखा गया है।
