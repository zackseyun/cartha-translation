  text: and they will not listen until they acknowledge their sin and the sins of their fathers. And after this they will turn to me in all uprightness and with all their heart and with all their soul,
translation:
  language: hi
  text: और वे नहीं सुनेंगे, जब तक वे अपने पाप और अपने पूर्वजों के पापों को पहचान न लें। इसके बाद वे पूरी सच्चाई से, अपने सारे मन और अपने सारे प्राण से मेरी ओर लौटेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢይሰምዑ
  choice: और वे नहीं सुनेंगे
  rationale: क्रिया का मूल अर्थ ‘सुनना’ है; प्रसंग में इसका आशय बात मानने से भी जुड़ा है, पर अनुवाद में मूल बिंब बनाए रखा गया है।
- source_word: ያአምሩ
  choice: स्वीकार न कर लें
  rationale: मूल क्रिया ‘जानना/पहचानना’ व्यक्त करती है; पाप के संदर्भ में आधुनिक हिन्दी में ‘स्वीकार करना’ दोष को पहचानकर मान लेने का स्वाभाविक अर्थ देता है।
- source_word: በኵሉ ርቱዕ
  choice: पूरी खराई से
  rationale: यह अभिव्यक्ति सम्पूर्ण सच्चाई, सीधाई या निष्कपटता का भाव रखती है; ‘खराई’ इस नैतिक अर्थ को संक्षेप और गरिमा से व्यक्त करती है।
- source_word: በኵሉ ልብ ወበኵሉ ነፍስ
  choice: अपने सारे मन और अपने सारे प्राण से
  rationale: दोनों समांतर पदों और उनकी सम्पूर्णता पर दिए गए बल को सुरक्षित रखा गया है।
theological_decisions:
- issue: पाप को जानने और स्वीकार करने के बीच अर्थ-छाया
  choice: स्वीकार न कर लें
  alternative: पहचान न लें
  rationale: प्रसंग पश्चात्ताप और परमेश्वर की ओर लौटने का है, इसलिए ‘स्वीकार’ उपयुक्त है; फिर भी इसे औपचारिक धार्मिक अंगीकार जैसी किसी विशिष्ट परंपरा तक सीमित नहीं किया गया।
- issue: आरंभिक ክሳዶሙ (‘उनकी गर्दन’) की पद-सीमा
  choice: इसे इस पद के अनुवाद में शामिल नहीं किया गया
  alternative: ‘उनकी गर्दन’ को पद 22 के आरंभ में रखना
  rationale: यह अकेला संज्ञा-खंड व्याकरणतः पिछले पद की क्रिया के साथ जुड़ता है और वर्तमान पद में रखने पर वाक्य अपूर्ण हो जाता है; उपलब्ध अध्याय-पद विभाजन समीक्षा भी इसे पिछले पद का अंतिम अंश मानती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘सारे मन’ और ‘सारे प्राण’ का समानांतर विन्यास मूल की पुनरुक्ति और बल को बनाए रखता है।
