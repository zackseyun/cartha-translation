translation:
  language: hi
  text: और वे मेरी सारी व्यवस्था, मेरी सारी आज्ञाएँ और मेरे सारे न्याय-विधान भूल जाएँगे; और नवचंद्रों[a] के विषय में भटक जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नए चाँदों”। यहाँ चंद्र-मास के आरंभ के दिनों का संकेत है।
    reason: ‘नवचंद्र’ का धार्मिक-पंचांगी अर्थ आधुनिक पाठक के लिए अस्पष्ट हो सकता है, और पद का स्रोत-खंड इसी शब्द पर समाप्त होता है।
lexical_decisions:
- source_word: ሕግየ
  choice: मेरी सारी व्यवस्था
  rationale: गीज़ पद में ईश्वर की ‘व्यवस्था/कानून’ का बोध है; ‘व्यवस्था’ बाइबलीय संदर्भ में स्वाभाविक और व्यापक है।
- source_word: ትእዛዝየ
  choice: मेरी सारी आज्ञाएँ
  rationale: यह आज्ञाओं या आदेशों के लिए सामान्य शब्द है; बहुवचन अर्थ को स्पष्ट रखा गया है।
- source_word: ፍትሕየ
  choice: मेरे सारे न्याय-विधान
  rationale: शब्द न्याय, निर्णय या विधानों का संकेत दे सकता है; ‘न्याय-विधान’ कानूनी और न्यायिक दोनों आयामों को सुरक्षित रखता है।
- source_word: ይስሕቱ
  choice: भटक जाएँगे
  rationale: मूल क्रिया पथभ्रष्ट होने या गलती करने का भाव देती है; संदर्भ में ‘भटक जाना’ सहज है।
- source_word: ሠርቀ
  choice: नवचंद्रों
  rationale: यह चंद्र-मास के आरंभ अथवा नवचंद्र के पालन का संकेत देता है; पद के खंडित अंत के कारण संक्षिप्त संज्ञा रखी गई है।
theological_decisions:
- issue: ‘व्यवस्था’, ‘आज्ञाएँ’ और ‘न्याय-विधान’ के बीच भेद
  choice: तीनों समानांतर पदों को अलग-अलग रखा गया
  alternative: इन सबको सामान्यतः ‘मेरे नियम’ कहना
  rationale: मूल में तीन पृथक श्रेणियाँ हैं; उन्हें समतल कर देना विधिक और धार्मिक अर्थ-तनाव को मिटा देता।
- issue: नवचंद्रों के संबंध में भटकने का अर्थ
  choice: ‘के विषय में भटक जाएँगे’
  alternative: ‘नवचंद्रों को गलत ढंग से मनाएँगे’
  rationale: उपलब्ध गीज़ खंड विशिष्ट प्रकार की त्रुटि नहीं बताता; इसलिए व्याख्यात्मक विस्तार से बचा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। तीन बार आए ‘सारी/सारे’ को मूल की पुनरावृत्ति के अनुरूप बनाए रखा गया है। स्रोत-पाठ पद के अंत में खंडित प्रतीत होता है, इसलिए अंतिम वाक्य को पूर्ण विराम के साथ प्रस्तुत किया गया है।
