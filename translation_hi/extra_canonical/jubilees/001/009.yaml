  text: And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.
translation:
  language: hi
  text: और यह गवाही उनके विरुद्ध साक्ष्य के रूप में सुनी जाएगी। क्योंकि वे मेरी सारी आज्ञाएँ—वह सब जो मैं उन्हें आज्ञा देता हूँ—भूल जाएँगे; और वे अन्यजातियों के पीछे, उनकी अशुद्धताओं के पीछे और उनकी लज्जाजनक बातों के पीछे चलेंगे। वे उनके देवताओं की सेवा करेंगे, और उनके देवता उनके लिए ठोकर का कारण, क्लेश, संकट और फंदा बन जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: गवाही
  rationale: यह शब्द ‘साक्ष्य/गवाही’ का अर्थ देता है; प्रसंग में परमेश्वर की ओर से इस्राएल के विरुद्ध प्रमाण बनने वाली गवाही अभिप्रेत है।
- source_word: አሕዛብ
  choice: अन्यजातियाँ
  rationale: यहाँ इस्राएल से बाहर की जातियों/राष्ट्रों का सामूहिक धार्मिक-सांस्कृतिक संदर्भ है; ‘अन्यजातियाँ’ हिंदी बाइबिलीय प्रयोग में स्वाभाविक है।
- source_word: ርኵሶሙ
  choice: उनकी अशुद्धताएँ
  rationale: मूल का बहुवचन धार्मिक और नैतिक अशुद्ध व्यवहारों की ओर संकेत करता है; बहुवचन बनाए रखा गया है।
- source_word: ኀሣሮሙ
  choice: उनकी लज्जाजनक बातें
  rationale: शब्द अपमानजनक, घृणित अथवा लज्जास्पद वस्तुओं/आचरणों को सूचित करता है; किसी विशिष्ट पंथीय अर्थ को आरोपित किए बिना व्यापक अभिव्यक्ति चुनी गई है।
- source_word: ማዕቅፈ
  choice: ठोकर का कारण
  rationale: संदर्भ में ऐसी बाधा या पतन का कारण अभिप्रेत है जो लोगों को फँसाता है; स्वाभाविक हिंदी में अर्थ स्पष्ट किया गया है।
- source_word: መሥገርት
  choice: फंदा
  rationale: मूल में जाल या फँसाने वाली वस्तु का बिंब है; ‘फंदा’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में ‘वे’ का संदर्भ
  choice: ‘वे उनके लिए ... बन जाएँगे’ में सर्वनाम की अस्पष्टता बनाए रखी गई
  alternative: स्पष्ट रूप से ‘उनके देवता’ या ‘ये सब बातें’ लिखना
  rationale: मूल में बहुवचन सर्वनाम का निकटतम संदर्भ देवता हो सकता है, पर संरचना पूर्ववर्ती आचरणों या उनके परिणामों को भी समेट सकती है; इसलिए अनावश्यक व्याख्यात्मक निर्धारण नहीं किया गया।
- issue: गवाही का न्यायिक स्वर
  choice: ‘उनके विरुद्ध गवाही देने के लिए’
  alternative: केवल ‘उनके लिए गवाही के रूप में’
  rationale: प्रसंग दोष सिद्ध करने वाली गवाही का है; ‘विरुद्ध’ न्यायिक बल को स्वाभाविक हिंदी में प्रकट करता है, जैसा परामर्श-पाठ भी संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण बाइबिलीय शैली और सामान्य पाठक के लिए स्पष्ट वाक्य-विन्यास। मूल की पुनरुक्ति और क्रम को यथासंभव रखा गया है, पर अत्यधिक कृत्रिम शाब्दिकता से बचा गया है।
