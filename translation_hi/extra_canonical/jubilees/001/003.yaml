translation:
  language: hi
  text: प्रभु की महिमा सीनै पर्वत पर थी, और बादल उस पर छह दिन तक छाया रहा। और उसने उसे बुलाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में भी यही सर्वनाम हैं: “उसने उसे बुलाया।” इस पद में बुलाने वाले और बुलाए गए व्यक्ति के नाम नहीं दिए गए हैं।'
    reason: मूल पाठ की सर्वनामगत अस्पष्टता को स्पष्ट करना और संदर्भ से नाम जोड़ने से बचना।
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር
  choice: प्रभु की महिमा
  rationale: यह पदबंध ‘प्रभु की महिमा’ को व्यक्त करता है; ‘महिमा’ आधुनिक हिन्दी में स्वाभाविक और धार्मिक संदर्भ में सुविज्ञात है।
- source_word: ደብረ፡ ሲና
  choice: सीनै पर्वत
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय रूप ‘सीनै’ में और ደብር को ‘पर्वत’ के रूप में दिया गया है।
- source_word: ጸለሎ፡ ደመና
  choice: बादल ने उसे … ढके रखा
  rationale: क्रिया बादल द्वारा पर्वत को ढकने या उस पर छा जाने का भाव देती है; ‘ढके रखा’ छह दिनों की अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ስዱሰ፡ ዕለተ
  choice: छः दिन तक
  rationale: मूल में छह दिनों की अवधि है; ‘तक’ हिन्दी में उस निरंतर अवधि को स्पष्ट करता है।
- source_word: ወጸውዖ
  choice: फिर उसने उसे बुलाया
  rationale: क्रिया में तृतीय पुरुष कर्ता और पुरुषवाचक कर्म दोनों अंतर्निहित हैं; मूल की सर्वनामगत अभिव्यक्ति को बनाए रखा गया है।
theological_decisions:
- issue: अंतिम खंड में बुलाने वाले और बुलाए गए व्यक्ति की पहचान
  choice: उसने उसे बुलाया
  alternative: प्रभु ने मूसा को बुलाया
  rationale: तात्कालिक गीइज़ पाठ केवल सर्वनामगत कर्ता और कर्म देता है। संदर्भ से उनकी पहचान संभव हो सकती है, पर इस पद में नाम जोड़ना मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: ईश्वरीय उपाधि እግዚአብሔር का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: गीइज़ पाठ में सामान्य ईश्वरीय उपाधि है, प्रत्यक्ष रूप से हिब्रू चतुरक्षरी नाम नहीं; इसलिए ‘प्रभु’ स्रोत के स्तर को अधिक सावधानी से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘महिमा’, ‘सीनै पर्वत’ और ‘प्रभु’ जैसे परिचित बाइबलीय पद रखे गए हैं। अंतिम वाक्य में मूल की वास्तविक अस्पष्टता सुरक्षित है।
