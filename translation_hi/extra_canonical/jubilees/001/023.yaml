  text: and I will cut off the foreskin of their heart and the foreskin of the heart of their seed, and I will create for them a holy spirit, and I will cleanse them so that they do not turn away from following me from that day and forever.
translation:
  language: hi
  text: और मैं उनके हृदय का अग्रचर्म और उनके वंश के हृदय का अग्रचर्म काट डालूँगा[a]; मैं उनके लिए एक पवित्र आत्मा रचूँगा और उन्हें शुद्ध करूँगा, ताकि उस दिन से सदा तक वे मेरे पीछे चलने से विमुख न हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके हृदय का आवरण और उनके वंश के हृदय का आवरण खोल दूँगा’।
    reason: पूर्ववर्ती वैकल्पिक अनुवाद को दर्ज करते हुए मुख्य पाठ में अग्रचर्म के अधिक ठोस अर्थ को प्राथमिकता दी गई है।
  - marker: b
    text: या, ‘वे मुझसे विमुख न हों’।
    reason: यह संक्षिप्त वैकल्पिक हिन्दी है; मुख्य पाठ मूल के ‘मेरे पीछे से’ वाले अनुयायी-संबंध के बिंब को अधिक स्पष्ट रखता है।
lexical_decisions:
- source_word: ቍልፈተ፡ ልቦሙ፡
  choice: उनके हृदय की खलड़ी
  rationale: ቍልፈት का ठोस अर्थ ‘खलड़ी/अग्रचर्म’ है और यहाँ हृदय के खतने की बाइबलीय उपमा है; ‘आवरण’ कहने से उपमा की तीव्रता दब जाती।
- source_word: ልበ፡ ዘርኦሙ፡
  choice: उनके वंश के हृदय
  rationale: ዘር का अर्थ संतान अथवा वंश है; सामूहिक और पीढ़ीगत आशय को स्वाभाविक हिन्दी में ‘वंश’ से व्यक्त किया गया।
- source_word: እፈጥር፡ ሎሙ፡ መንፈሰ፡ ቅዱሰ፡
  choice: मैं उनके लिए एक पवित्र आत्मा रचूँगा
  rationale: क्रिया के सृजनार्थक बल को ‘रचूँगा’ से और अनिश्चित पदबंध को ‘एक पवित्र आत्मा’ से सुरक्षित रखा गया; इसे स्वतः किसी निश्चित पारिभाषिक नाम में नहीं बदला गया।
- source_word: እነጽሖሙ፡
  choice: उन्हें शुद्ध करूँगा
  rationale: मूल क्रिया शुद्ध या निर्मल करने का भाव देती है; ‘शुद्ध करूँगा’ सीधा और गरिमापूर्ण रूप है।
- source_word: እምድኅሬየ፡
  choice: मेरे पीछे चलना छोड़कर
  rationale: शाब्दिक भाव ‘मेरे पीछे से’ है, जो अनुकरण बंद करके विमुख होने की स्थानिक-सम्बन्धपरक उपमा व्यक्त करता है।
- source_word: እምይእቲ፡ ዕለት፡ እስከ፡ ለዓለም፡
  choice: उस दिन से लेकर सदा तक
  rationale: आरम्भ-बिन्दु और अनन्त अवधि, दोनों को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखा गया।
theological_decisions:
- issue: हृदय के खतने की उपमा
  choice: हृदय की खलड़ी ... काट डालूँगा
  alternative: हृदय का आवरण खोल दूँगा
  rationale: मूल संज्ञा अग्रचर्म/खलड़ी का संकेत करती है और व्यवस्थाविवरण तथा यिर्मयाह में मिलने वाली हृदय-खतने की गंभीर उपमा को प्रतिध्वनित करती है; शिष्टोक्ति से इसे ढका नहीं गया।
- issue: ‘पवित्र आत्मा’ की निश्चितता
  choice: एक पवित्र आत्मा
  alternative: पवित्र आत्मा
  rationale: मूल वाक्यांश को किसी निश्चित व्यवस्थित धर्मशास्त्रीय पहचान में सीमित किए बिना उसकी वास्तविक अनिश्चितता बचाई गई।
- issue: विमुख होने की दिशा
  choice: मेरे पीछे चलना छोड़कर न फिरें
  alternative: मुझसे विमुख न हों
  rationale: यह रूप मूल के ‘मेरे पीछे से’ वाले अनुयायी-संबंध को बचाता है, जबकि केवल ‘मुझसे’ उस बिंब को कम कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘खलड़ी’ स्पष्ट शारीरिक शब्द है और यहाँ आवश्यक बाइबलीय उपमा को सुरक्षित रखता है। वाक्य में भविष्यकालीन प्रथम पुरुष और मूल की क्रमिक प्रतिज्ञाओं को बनाए रखा गया है।
