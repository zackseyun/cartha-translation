  yaml_path: translation/extra_canonical/jubilees/001/027.yaml
  text: And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst forever and ever, and the Lord will appear to the eyes of all.”
translation:
  language: hi
  text: और उसने उपस्थिति के दूत[a] से कहा, “मूसा के लिए सृष्टि के आरम्भ से लेकर उस समय तक का वृत्तान्त लिख, जब मेरा पवित्रस्थान उनके बीच सदा-सर्वदा के लिए बनाया जाएगा और प्रभु सबकी आँखों के सामने प्रकट होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुख का दूत”; अर्थात वह दूत जो परमेश्वर की उपस्थिति में रहता है।
    reason: मूल पद के ठोस ‘मुख’ रूपक और उसके सम्भावित उपस्थिति-संबंधी अर्थ दोनों को पाठक के लिए सुरक्षित रखना।
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: उपस्थिति के दूत
  rationale: शाब्दिक अर्थ ‘मुख का दूत’ है, पर यह पद किसी के सम्मुख अथवा उपस्थिति में रहने वाले स्वर्गदूत को सूचित करता है। ‘उपस्थिति के दूत’ आधुनिक हिन्दी में अर्थपूर्ण रहते हुए मूल मुहावरे की विशिष्टता बचाता है।
- source_word: እምቀዳሚ፡ ፍጥረት
  choice: सृष्टि के आरम्भ से
  rationale: मूल के आरम्भ-बिंदु को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: መቅደስየ
  choice: मेरा पवित्रस्थान
  rationale: यह ‘मेरा पवित्र स्थान/धाम’ है; ‘पवित्रस्थान’ उपासना-स्थल का धार्मिक अर्थ बनाए रखता है और किसी विशिष्ट स्थापत्य रूप को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ለዓለመ፡ ዓለማት
  choice: सदा-सर्वदा के लिए
  rationale: मूल का बहुस्तरीय अनन्तकाल-सूचक मुहावरा हिन्दी के प्रचलित, गरिमापूर्ण मुहावरे से व्यक्त किया गया है।
- source_word: ለዐይን፡ ኵሉ
  choice: सबकी आँखों के सामने
  rationale: मूलतः ‘सबकी आँख के लिए/सम्मुख’ दृश्य प्रकटीकरण बताता है; यह हिन्दी रूप उसी प्रत्यक्षता को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: ‘मेरा पवित्रस्थान’ के बाद ‘प्रभु’ का तृतीय-पुरुष उल्लेख
  choice: और प्रभु सबकी आँखों के सामने प्रकट होगा
  alternative: और मैं सबकी आँखों के सामने प्रकट होऊँगा
  rationale: मूल पाठ में पहले ‘मेरा’ और फिर स्पष्ट रूप से ‘प्रभु’ आता है। वक्ता की पहचान के आधार पर इसे प्रथम पुरुष में समरूप नहीं किया गया, ताकि मूल का व्यक्ति-परिवर्तन और सम्भावित साहित्यिक तनाव सुरक्षित रहे।
- issue: पवित्रस्थान के निर्माण की काल-अवधि
  choice: सदा-सर्वदा के लिए बनाया जाएगा
  alternative: सदा-सर्वदा उनके बीच बनाया जाता रहेगा
  rationale: क्रिया को एक भावी निर्माण के रूप में रखा गया है, जबकि अनन्तकाल-सूचक पद पवित्रस्थान के स्थायी बने रहने को बताता है; निरन्तर निर्माण का अर्थ नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आदेशसूचक ‘लिख’ मूल के एकवचन सम्बोधन को दर्शाता है। ‘वृत्तान्त’ हिन्दी में वाक्य को पूर्ण और सहज बनाता है, यद्यपि मूल में लिखी जाने वाली सामग्री का कर्म प्रसंग से समझा जाता है।
