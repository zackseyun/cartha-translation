  text: 'today for their generations on Mount Sinai.” And so it will be: when all these things come upon them, they will know that I am more righteous than they are in all their judgments and in all their deeds,'
translation:
  language: hi
  text: आज सीनै पर्वत पर उनकी पीढ़ियों के लिए।”[a] और ऐसा होगा कि जब ये सब बातें उन पर आ पड़ेंगी, तब वे जानेंगे कि मैं उनके सब न्यायों और उनके सब कामों में उनसे अधिक धर्मी हूँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज उनकी पीढ़ियों के लिए सीनै पर्वत पर।”
    reason: आरंभिक पदांश का वाक्यगत संबंध पिछले पद से है, और शब्दक्रम के कारण ‘आज’ तथा ‘सीनै पर्वत पर’ के जुड़ाव में कुछ अस्पष्टता बनी रहती है।
lexical_decisions:
- source_word: ዮም
  choice: आज
  rationale: इस शब्द का सामान्य अर्थ ‘आज/इस दिन’ है; पदांश के आरंभ में इसकी स्पष्ट उपस्थिति बनाए रखी गई है।
- source_word: ለትውልዶሙ
  choice: उनकी पीढ़ियों के लिए
  rationale: बहुवचन और संबंधसूचक प्रत्यय को निकटता से व्यक्त करता है; संदर्भगत संबंध कुछ अस्पष्ट है, इसलिए उसे व्याख्यात्मक रूप से नहीं खोला गया।
- source_word: በደብረ፡ ሲና
  choice: सीनै पर्वत पर
  rationale: स्थानवाचक संरचना और परंपरागत स्थान-नाम का स्वाभाविक हिन्दी रूप।
- source_word: ይመጽእ፡ ኵሉ፡ ዝነገር፡ ላዕሌሆሙ
  choice: ये सब बातें उन पर आ पड़ेंगी
  rationale: ‘उन पर आने’ के स्रोत मुहावरे को स्वाभाविक हिन्दी में रखते हुए आगामी घटनाओं का भाव व्यक्त किया गया।
- source_word: ጻድቅ
  choice: धर्मी
  rationale: नैतिक और न्यायिक दोनों आयामों वाला मानक बाइबलीय हिन्दी शब्द।
- source_word: ፍትሖሙ
  choice: उनके सब न्यायों
  rationale: ፍትሕ के न्याय/निर्णय संबंधी अर्थ को बनाए रखता है और साथ के ‘कामों’ से भेद भी सुरक्षित करता है।
- source_word: ምግባሮሙ
  choice: उनके सब कामों
  rationale: आचरण अथवा किए गए कार्यों के व्यापक अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वर की धार्मिकता की तुलनात्मक अभिव्यक्ति
  choice: मैं ... उनसे अधिक धर्मी हूँ
  alternative: मैं ... उनकी अपेक्षा न्यायी हूँ
  rationale: स्रोत में तुलनात्मक भाव स्पष्ट है। उसे समतल करके केवल ‘मैं धर्मी हूँ’ नहीं किया गया; ‘धर्मी’ नैतिक और न्यायिक तनाव दोनों बनाए रखता है।
- issue: ‘न्यायों’ और ‘कामों’ का संबंध
  choice: दोनों को अलग समानांतर पदों के रूप में रखा
  alternative: उनके सारे निर्णयों और आचरण में
  rationale: स्रोत के दो पृथक संज्ञात्मक पदों को मिलाने से अर्थ-संरचना घट जाती; इसलिए समानांतरता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध बाइबलीय शैली अपनाई गई है। उद्धरण का आरंभ पिछले पद से चला आ रहा है, इसलिए समापन उद्धरण-चिह्न रखा गया है। स्रोत की तुलना, समानांतरता और आरंभिक वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
