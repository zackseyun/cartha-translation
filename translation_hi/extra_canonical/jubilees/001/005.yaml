base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/005.yaml
  text: 'And the Lord taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book, so that their generations may see that I have not abandoned them because of all the evil that they have done by transgressing the ordinance that I establish between me and you.”'
translation:
  language: hi
  text: प्रभु ने उसे जो पहले था और जो आने वाला है, उसका ज्ञान दिया[a]—व्यवस्था और साक्ष्य के सभी दिनों के विभाजनों का वृत्तांत। फिर उसने कहा, “जो कुछ मैं तुझे इस पर्वत पर बताता हूँ, उस सबको अपने मन में बसा ले और उसे एक पुस्तक में लिख, ताकि उनकी पीढ़ियाँ देखें कि उनके किए हुए सारे बुरे कामों के कारण मैंने उन्हें त्याग नहीं दिया है—वे बुरे काम जो उन्होंने उस विधान का उल्लंघन करके किए हैं, जिसे मैं अपने और तेरे बीच ठहराता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीज़ पाठ इस स्थान पर ‘रात’ शब्द से आरम्भ होता है। वह संभवतः पिछले वाक्य का अंतिम शब्द है; इसलिए उसे यहाँ नए वाक्य में सम्मिलित नहीं किया गया है।
    reason: पांडुलिपि/पद-विभाजन की सीमा पर उपस्थित असंबद्ध शब्द के विषय में पाठक को सूचित करना।
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ पद सामान्य रूप से ‘प्रभु/ईश्वर’ को सूचित करता है; यह यहाँ यहोवा नाम का प्रत्यक्ष रूप नहीं है।
- source_word: ዘቀዳሚ፡ ወዘኒ፡ ይመጽእ
  choice: आरम्भ की और आनेवाली बातें
  rationale: अतीत/प्रारम्भ और भविष्य के समानांतर भाव को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ነገረ፡ ኩፋሌ፡ ኵሉ፡ መዋዕላት
  choice: सभी दिनों के विभाजनों का वृत्तांत
  rationale: ነገር को ‘वृत्तांत’ और ኩፋሌ को पुस्तक की काल-विभाजन संबंधी शब्दावली के अनुरूप ‘विभाजन’ दिया गया है।
- source_word: ሕግ፡ ወለስምዕ
  choice: व्यवस्था और साक्ष्य
  rationale: दोनों संज्ञाओं को अलग और औपचारिक रखा गया है; ‘साक्ष्य’ धार्मिक-कानूनी अर्थ को बनाए रखता है।
- source_word: አነብር፡ ልበከ
  choice: अपने मन में बसा ले
  rationale: शाब्दिक ‘अपना हृदय रख’ की अपेक्षा यह वर्तमान हिन्दी में ध्यानपूर्वक ग्रहण करने का मुहावरेदार भाव देता है।
- source_word: ሥርዐት
  choice: विधान
  rationale: यह स्थापित नियम/व्यवस्था का भाव देता है और अगले क्रियापद ‘ठहराता हूँ’ के साथ स्वाभाविक है।
theological_decisions:
- issue: बुराई के कारण त्यागने वाले वाक्यांश का निषेध-क्षेत्र
  choice: ‘उनके किए हुए सारे बुरे कामों के कारण मैंने उन्हें त्याग नहीं दिया है’
  alternative: ‘उनकी सारी बुराई के बावजूद मैंने उन्हें त्यागा नहीं है’
  rationale: स्रोत की कारणसूचक रचना और निषेध के तनाव को बनाए रखा गया है; ‘के बावजूद’ जोड़ने से व्याख्या अधिक निश्चित हो जाती।
- issue: ईश्वर और मूसा के बीच विधान
  choice: ‘जिसे मैं अपने और तेरे बीच ठहराता हूँ’
  alternative: ‘जिसे मैं आज अपने और तेरे बीच ठहराता हूँ’
  rationale: स्रोत में ‘आज’ का समर्थन नहीं है, इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन ‘तू/तेरा’ के पारंपरिक, गरिमापूर्ण रूप रखे गए हैं। वाक्य को सामान्य पाठक के लिए स्वाभाविक बनाया गया है, पर ‘विभाजन’, ‘व्यवस्था’, ‘साक्ष्य’ और ‘विधान’ जैसी प्रमुख स्रोत-संज्ञाएँ अलग-अलग सुरक्षित रखी गई हैं।
