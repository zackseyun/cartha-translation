  yaml_path: translation/extra_canonical/jubilees/001/015.yaml
  text: and Sabbaths and festivals and jubilees and ordinances. And after this they will turn to me from among the nations with all their heart and with all their soul and with all their strength, and I will gather them from among all the nations, and they will seek me so that I may be found by them. And when they seek me with all their heart and with all their soul, I will reveal to them abundant peace in righteousness, and I will transplant them as an upright planting,
translation:
  language: hi
  text: और विश्राम-दिनों, पर्वों, जुबली-वर्षों और विधियों को। इसके बाद वे जातियों के बीच से अपने पूरे हृदय, पूरे प्राण और पूरी शक्ति से मेरी ओर फिरेंगे। मैं उन्हें सब जातियों के बीच से इकट्ठा करूँगा, और वे मुझे खोजेंगे ताकि वे मुझे पा सकें। जब वे अपने पूरे हृदय और पूरे प्राण से मुझे खोजेंगे, तब मैं उन्हें धार्मिकता में भरपूर शांति प्रकट करूँगा और उन्हें एक सीधी पौध के समान दूसरी जगह रोपूँगा,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें एक सीधी पौध के समान रोपूँगा।”
    reason: गीज़ क्रिया में स्थानांतरित करके पुनः रोपने का विशिष्ट भाव है, जिसे मुख्य पाठ में रखा गया है; यह टिप्पणी कम विशिष्ट ‘रोपने’ का विकल्प दर्ज करती है।
lexical_decisions:
- source_word: ሰንበተ
  choice: विश्राम-दिनों
  rationale: बहुवचन ‘Sabbaths’ के लिए सामान्य आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए अनुवाद किया गया।
- source_word: በዓለ
  choice: पर्वों
  rationale: धार्मिक उत्सवों के व्यापक अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: አዮቤለ
  choice: जुबली-वर्षों
  rationale: तकनीकी काल-इकाई को ‘जुबली’ के साथ ‘वर्ष’ जोड़कर साधारण पाठक के लिए स्पष्ट किया गया।
- source_word: ሥርዐተ
  choice: विधियों
  rationale: धार्मिक रूप से निर्धारित नियमों/व्यवस्थाओं का बहुवचन भाव सुरक्षित रखा गया।
- source_word: ይትመየጡ
  choice: फिरेंगे
  rationale: ईश्वर की ओर लौटने या मुड़ने का भाव देता है और प्रसंग में स्वाभाविक है।
- source_word: የኀሡኒ
  choice: मुझे खोजेंगे
  rationale: मूल के सक्रिय खोजने वाले भाव का सीधा अनुवाद।
- source_word: እከሥት
  choice: प्रकट करूँगा
  rationale: खोलने, दिखाने या प्रकट करने के अर्थ को यहाँ शांति के संदर्भ में स्वाभाविक हिन्दी में रखा गया।
- source_word: እፈልሶሙ
  choice: उन्हें दूसरी जगह रोपूँगा
  rationale: क्रिया केवल ‘रोपना’ नहीं, स्थानांतरित करके पुनः रोपने का भाव रखती है; जातियों में से इकट्ठा करने के प्रसंग से भी यह पुष्ट होता है।
- source_word: ተክለ፡ ርቱዐ
  choice: एक सीधी पौध
  rationale: रोपण-रूपक बनाए रखते हुए ‘upright’ की नैतिक और स्थिरता-संबंधी संभावित गूँज को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: ‘ताकि मैं उन्हें मिलूँ’ में ईश्वर के पाए जाने की अभिव्यक्ति
  choice: कि मैं उन्हें मिलूँ
  alternative: ताकि वे मुझे पा सकें
  rationale: मूल में ईश्वर के उनके द्वारा पाए जाने का भाव है; चुनी हुई हिन्दी इसे स्वाभाविक ढंग से रखती है और मानवीय खोज तथा ईश्वरीय उपलब्धता के तनाव को बनाए रखती है।
- issue: ‘धार्मिकता में’ का संबंध
  choice: धार्मिकता में उन पर भरपूर शांति प्रकट करूँगा
  alternative: धार्मिकता के साथ भरपूर शांति दूँगा
  rationale: पूर्वसर्गीय वाक्यांश को शांति के प्रकट होने के क्षेत्र/परिवेश के रूप में खुला रखा गया है; इसे केवल साधन या साथ होने के अर्थ में सीमित नहीं किया गया।
- issue: रोपण-रूपक
  choice: उन्हें एक सीधी पौध के समान दूसरी जगह रोपूँगा
  alternative: उन्हें दृढ़ता से स्थापित करूँगा
  rationale: मूल का कृषि-रूपक और स्थानांतरण का विशिष्ट अर्थ दोनों सुरक्षित रखे गए हैं; अमूर्त धार्मिक व्याख्या नहीं थोपी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पद पूर्ववर्ती सूची के बीच से आरम्भ होता है, इसलिए आरम्भिक ‘और’ तथा कर्मकारक बहुवचन संरचना बनाए रखी गई। ‘पूरे हृदय, पूरे प्राण और पूरी शक्ति’ की त्रिक पुनरावृत्ति मूल की लय और बल के लिए सुरक्षित है।
