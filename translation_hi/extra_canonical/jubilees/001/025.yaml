  text: And every angel and every spirit will know that these are my children, and that I am their Father in uprightness and righteousness, and that I love them.
translation:
  language: hi
  text: और हर स्वर्गदूत और हर आत्मा जानेंगे कि ये मेरी संतान हैं, और कि मैं सत्यनिष्ठा और धार्मिकता में उनका पिता हूँ, और कि मैं उनसे प्रेम करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ መላእክ፡ ወኵሉ፡ መንፈስ፡
  choice: हर स्वर्गदूत और हर आत्मा
  rationale: गीज़ के प्रत्येकता-सूचक ኵሉ को दोनों संज्ञाओं के साथ अलग-अलग रखते हुए स्वाभाविक हिन्दी में अनूदित किया गया है।
- source_word: ወያአምርዎሙ፡
  choice: जान जाएगी
  rationale: संयुक्त कर्ता ‘हर स्वर्गदूत और हर आत्मा’ को हिन्दी में एक समष्टिगत एकवचन संरचना के रूप में रखा गया है; क्रिया भविष्यकालीन ज्ञान को व्यक्त करती है।
- source_word: ውሉድየ፡
  choice: मेरी संतान
  rationale: ‘मेरे बच्चे/पुत्र’ के अर्थ को लिंग-समावेशी और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አቡሆሙ፡
  choice: उनका पिता
  rationale: पितृत्व की मूल प्रतिमा को सीधे सुरक्षित रखा गया है।
- source_word: በርቶዕ፡ ወበጽድቅ፡
  choice: खराई और धार्मिकता में
  rationale: दोनों समानांतर नैतिक गुणों और मूल के ‘में’ संबंध को बनाए रखता है; ‘खराई’ नैतिक सीधाई/सत्यनिष्ठा और ‘धार्मिकता’ न्यायोचित सहीपन को व्यक्त करती है।
- source_word: ወአፈቅርሙ፡
  choice: और यह कि मैं उनसे प्रेम करता हूँ
  rationale: प्रेम के स्पष्ट कथन तथा पूर्ववर्ती आश्रित उपवाक्यों की समानांतर रचना को सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘खराई और धार्मिकता में’ का संबंध
  choice: वाक्यांश को ‘मैं उनका पिता हूँ’ के साथ जोड़ा गया है।
  alternative: इसे परमेश्वर के प्रेम या उसकी समग्र प्रकृति की स्वतंत्र विशेषता मानना।
  rationale: मूल पदक्रम में यह पदबंध पितृत्व-वाक्य के तुरंत बाद आता है। अनुवाद उसी व्याकरणिक निकटता को बनाए रखता है और आगे की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘संतान’ समावेशी है; ‘खराई’ और ‘धार्मिकता’ मूल के दो अलग नैतिक पदों को बनाए रखते हैं।
