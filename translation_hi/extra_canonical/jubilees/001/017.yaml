translation:
  language: hi
  text: और मैं उनका परमेश्वर होऊँगा, और वे सत्य और धार्मिकता में मेरी प्रजा होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ
  choice: परमेश्वर
  rationale: यहाँ शब्द वाचा-संबंधी कथन में ईश्वर के लिए प्रयुक्त है; आधुनिक, dignified हिन्दी में ‘परमेश्वर’ स्वाभाविक और स्पष्ट है।
- source_word: ሕዝብየ
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष संबंधसूचक रूप को बनाए रखता है और सामूहिक, वाचा-संबंधी अर्थ व्यक्त करता है।
- source_word: ዘበአማን
  choice: सत्य में
  rationale: गीज़ पदबंध का मूल अर्थ ‘सत्य/सच्चाई में’ है; ‘सत्य में’ स्रोत की संक्षिप्तता और संभावित नैतिक-संबंधपरक व्यापकता बनाए रखता है।
- source_word: ዘበጽድቅ
  choice: धार्मिकता में
  rationale: ጽድቅ के न्याय, सही आचरण और धार्मिकता से जुड़े अर्थ-क्षेत्र को बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
theological_decisions:
- issue: ‘सत्य और धार्मिकता में’ का संबंध
  choice: इस पदबंध को ‘वे ... मेरी प्रजा होंगे’ से जोड़ा गया है।
  alternative: इसे केवल उनके आचरण का वर्णन मानकर ‘सच्चे और धर्मी लोग’ कहना।
  rationale: स्रोत में पूर्वसर्गीय रचना दोनों संज्ञाओं को समानांतर रखती है; शाब्दिक संबंध बनाए रखने से वाचा-संबंधी स्थिति और नैतिक जीवन, दोनों की संभावित छाया सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाचा-संबंधी शैली। स्रोत के समानांतर विन्यास को बनाए रखते हुए अस्वाभाविक शब्दशः रूप से बचा गया है।
