  text: and they will turn to foreign gods, to those who cannot deliver them from any of their distress.
translation:
  language: hi
  text: और वे पराए देवताओं की ओर फिरेंगे, जो उन्हें उनके किसी भी संकट[a] से नहीं छुड़ा सकेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके सारे संकट से।”
    reason: मूल के ‘सब/सारा’ शब्दरूप को दर्ज करते हुए मुख्य पाठ में निषेध के अंतर्गत उसके स्वाभाविक हिंदी अर्थ ‘किसी भी’ को रखा गया है।
lexical_decisions:
- source_word: ይትመየጡ፡ ኀበ
  choice: की ओर फिरेंगे
  rationale: यह क्रिया और संबंधसूचक पद किसी की ओर मुड़ने या फिरने का भाव देते हैं; हिंदी में यह स्वाभाविक रहते हुए धार्मिक निष्ठा बदलने का संकेत बनाए रखता है।
- source_word: አምላክ፡ ነኪር
  choice: पराए देवताओं
  rationale: शाब्दिक रूप से पद एकवचन-जैसा है, ‘पराया देवता’, पर आगे का बहुवचन संबंधवाचक रूप और प्रसंग सामूहिक अर्थ दिखाते हैं; इसलिए सहज हिंदी में बहुवचन चुना गया है।
- source_word: ኢያድኅንዎሙ
  choice: उन्हें नहीं छुड़ा सकेंगे
  rationale: मूल क्रिया बचाने या छुड़ाने का अर्थ रखती है। सामर्थ्य-अभाव व्यक्त करने वाले संबंधवाचक वाक्य में ‘नहीं छुड़ा सकेंगे’ हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: እምኵሉ፡ ምንዳቤሆሙ
  choice: उनके किसी भी संकट से
  rationale: शाब्दिक संरचना ‘उनके सारे संकट से’ है, किंतु निषेध के दायरे में इसका आशय किसी भी संकट से छुड़ाने की पूर्ण असमर्थता है; ‘किसी भी’ हिंदी में उस अर्थ को बिना आंशिक उद्धार का भ्रम पैदा किए व्यक्त करता है।
theological_decisions:
- issue: पराए देवताओं की उद्धार करने की क्षमता
  choice: 'पूर्ण असमर्थता: ‘किसी भी संकट से ... नहीं छुड़ा सकेंगे’'
  alternative: ‘उनके सारे संकट से उन्हें नहीं छुड़ा सकेंगे’, जिससे यह अर्थ निकल सकता है कि वे कुछ संकटों से छुड़ा सकते हैं
  rationale: मूल में निषेध के साथ ‘सब/सारा’ आया है और प्रसंग इन देवताओं की किसी भी विपत्ति से बचाने की असमर्थता बताता है; अनुवाद को संभावित आंशिक सामर्थ्य नहीं सुझानी चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। ‘पराए देवता’ प्राचीन धार्मिक संदर्भ को स्वाभाविक ढंग से व्यक्त करता है, और दीर्घ डैश संबंधवाचक स्पष्टीकरण को साफ करता है।
