  yaml_path: translation/extra_canonical/jubilees/001/007.yaml
  text: and they will know that I have been with them. And you, write down for yourself all the words that I make known to you today, for I know their rebellion and their stiff neck before I bring them into the land that I swore to their fathers—to Abraham, Isaac, and Jacob—saying, ‘To your seed I will give the land that flows with milk and honey.’ And they will eat and be satisfied.
translation:
  language: hi
  text: और वे जान लेंगे कि मैं उनके साथ रहा हूँ। और तुम जो वचन मैं आज तुम्हें बता रहा हूँ, वे सब अपने लिए लिख लो; क्योंकि मैं उनके विद्रोह और उनके हठ को जानता हूँ, इससे पहले कि मैं उन्हें उस देश में ले आऊँ जिसकी शपथ मैंने उनके पूर्वजों—अब्राहम, इसहाक और याकूब—से यह कहते हुए खाई थी, ‘मैं तुम्हारे वंश को वह देश दूँगा जिसमें दूध और मधु की धाराएँ बहती हैं।’ और वे खाएँगे और तृप्त होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምረተሙ
  choice: उनके विद्रोह
  rationale: यह शब्द विद्रोही या अवज्ञाकारी आचरण को व्यक्त करता है; ‘विद्रोह’ स्रोत की नैतिक और वाचा-संबंधी गंभीरता बनाए रखता है।
- source_word: ክሳዶሙ፡ ደቡበ
  choice: उनकी हठधर्मिता
  rationale: शाब्दिक बिंब ‘कठोर गर्दन’ है। आधुनिक हिन्दी में ‘हठधर्मिता’ उसका स्वाभाविक अर्थ व्यक्त करती है, बिना अस्पष्ट शारीरिक बिंब के।
- source_word: ለዘርእክሙ
  choice: तुम्हारे वंश को
  rationale: ‘बीज’ का वंशगत अर्थ यहाँ स्पष्ट है; ‘वंश’ आधुनिक हिन्दी में स्वाभाविक और सामूहिक अर्थ को खुला रखता है।
- source_word: ትውሕዝ፡ ሐሊበ፡ ወመዓረ
  choice: जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: स्रोत के ‘दूध और मधु बहने’ वाले समृद्धि-बिंब को प्राकृतिक हिन्दी मुहावरे में सुरक्षित रखा गया है।
- source_word: ወይጸግቡ
  choice: और तृप्त होंगे
  rationale: यह केवल भोजन करने नहीं, भरपूर खाकर संतुष्ट होने का अर्थ देता है।
theological_decisions:
- issue: परमेश्वर की उपस्थिति का कथन
  choice: मैं उनके साथ रहा हूँ
  alternative: मैं उनके साथ हूँ
  rationale: स्रोत का पूर्णतासूचक रूप पूर्ववर्ती दैवी उपस्थिति को दर्शाता है; कालगत तनाव को वर्तमान में बदलकर सरल नहीं किया गया।
- issue: देश में प्रवेश से पहले विद्रोह का दैवी ज्ञान
  choice: उन्हें उस देश में पहुँचाने से पहले ही मैं उनके विद्रोह… को जानता हूँ
  alternative: मैं जानता हूँ कि देश में पहुँचने के बाद वे विद्रोह करेंगे
  rationale: स्रोत विद्रोह के समय को विस्तार से नहीं बताता, बल्कि प्रवेश से पहले परमेश्वर के ज्ञान पर बल देता है; भावी घटनाक्रम नहीं जोड़ा गया।
- issue: प्रतिज्ञात देश की निश्चितता
  choice: वह देश
  alternative: एक देश
  rationale: स्रोत और प्रसंग किसी सामान्य देश नहीं, पूर्वजों से शपथपूर्वक प्रतिज्ञा किए गए विशिष्ट देश की ओर संकेत करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। वाक्य-संरचना को सहज बनाया गया है, जबकि शपथ, विद्रोह, वंश और प्रतिज्ञात देश जैसे प्रमुख वाचा-संबंधी तत्व सुरक्षित रखे गए हैं।
