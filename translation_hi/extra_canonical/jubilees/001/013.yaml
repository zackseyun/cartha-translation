  text: before my eyes. And I will hide my face from them, and I will deliver them into the hand of the nations for captivity and for plunder and for devouring, and I will uproot them from the midst of the land, and I will scatter them among the nations.
translation:
  language: hi
  text: मेरी आँखों के सामने। और मैं उनसे अपना मुँह छिपा लूँगा और उन्हें बंदी बनाए जाने, लूटे जाने और भक्षण किए जाने के लिए जातियों के हाथ में दे दूँगा। मैं उन्हें भूमि के बीच में से जड़ से उखाड़ दूँगा[a] और जातियों के बीच तितर-बितर कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें हटा दूँगा।”
    reason: मूल क्रिया को सामान्यतः ‘हटाना’ भी समझा जा सकता है, यद्यपि संदर्भ में ‘जड़ से उखाड़ना’ उसका अधिक प्रबल भाव व्यक्त करता है।
lexical_decisions:
- source_word: አኀብእ ገጽየ እምኔሆሙ
  choice: मैं उनसे अपना मुँह छिपा लूँगा
  rationale: यह मूल की शाब्दिक छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: እሜጥዎሙ ውስተ እደ አሕዛብ
  choice: उन्हें ... जातियों के हाथ में कर दूँगा
  rationale: ‘हाथ में देना’ सत्ता और नियंत्रण सौंपने का मूल मुहावरा सुरक्षित रखता है; አሕዛብ के लिए संदर्भानुकूल ‘जातियाँ’ चुना गया है।
- source_word: ለፂዋዌ ወለኀብለ ወለተበልዖ
  choice: बंदी बनाए जाने, लूटे जाने और निगल लिए जाने के लिए
  rationale: तीनों समानांतर विपत्तियों को अलग-अलग रखा गया है; ‘निगल लिए जाने’ में अंतिम पद की विनाशकारी छवि सुरक्षित है।
- source_word: አቤስሎሙ እማእከለ ምድር
  choice: उन्हें देश के बीच से जड़ से उखाड़ दूँगा
  rationale: क्रिया का प्रबल उन्मूलनार्थक भाव और भूमि से उखाड़ने की कृषि-संबंधी छवि दोनों व्यक्त होते हैं।
- source_word: እዘርዎሙ ማእከለ
  choice: जातियों के बीच तितर-बितर कर दूँगा
  rationale: बिखेरने के भाव को सहज हिन्दी में व्यक्त किया गया है; पद का अंतिम पूरक अध्याय-विभाजन के पार प्राप्त संदर्भ और परामर्श-पाठ के अनुसार है।
theological_decisions:
- issue: ईश्वरीय मुख छिपाने और न्याय की कठोर भाषा
  choice: प्रत्यक्ष प्रथम-पुरुष कथन और सभी दंडात्मक क्रियाएँ यथावत रखी गईं
  alternative: भाषा को नरम करके केवल संरक्षण हटाने या निर्वासन की सामान्य बात कहना
  rationale: मूल पाठ ईश्वर की सक्रिय न्यायकारी घोषणा प्रस्तुत करता है; अनुवाद ने इस धार्मिक तनाव को न तो नरम किया है, न किसी संप्रदायगत व्याख्या से समझाया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। आरंभिक वाक्यांश पिछले पद से जुड़ा हुआ खंड है, इसलिए उसकी खंडात्मकता सुरक्षित रखी गई है। समानांतर दंड-सूची और ‘मुँह छिपाना’, ‘हाथ में करना’, ‘जड़ से उखाड़ना’ जैसी मूल छवियाँ बनाए रखी गई हैं।
