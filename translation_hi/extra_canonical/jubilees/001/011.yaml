  text: And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.
translation:
  language: hi
  text: और वे अपने लिए ऊँचे स्थान, उपवन और खुदी हुई मूर्तियाँ बनाएँगे; और वे अपने-अपने भ्रम के आगे दण्डवत् करेंगे। वे अपने बच्चों को दुष्टात्माओं के लिए और अपने हृदय के भ्रम के हर कार्य के लिए बलि करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐታተ
  choice: ऊँचे स्थान
  rationale: संदर्भ में यह उपासना के लिए बनाए गए ‘high places’ को सूचित करता है; हिन्दी में ‘ऊँचे स्थान’ अर्थ को स्पष्ट रखते हुए प्राचीन धार्मिक संदर्भ भी बनाए रखता है।
- source_word: ወግልፎ
  choice: खुदी हुई मूर्तियाँ
  rationale: यह तराशी या खोदकर बनाई गई उपास्य प्रतिमाओं का बोध कराता है; ‘खुदी हुई मूर्तियाँ’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: ይሰግዱ
  choice: दण्डवत् करेंगे
  rationale: क्रिया झुककर आराधना या सम्मान करने को दर्शाती है; ‘दण्डवत् करना’ धार्मिक नमन की तीव्रता बनाए रखता है।
- source_word: ስሒት / ስሕተት
  choice: भ्रम
  rationale: शब्द में भूल, भटकाव और धार्मिक भ्रांति का भाव है। ‘भ्रम’ जानबूझकर ‘मूर्ति’ या ‘पाप’ जैसी अधिक व्याख्यात्मक संकीर्णता से बचता है।
- source_word: አጋንንት
  choice: दुष्टात्माएँ
  rationale: यह दैत्य अथवा demons के लिए प्रयुक्त बहुवचन है; आधुनिक हिन्दी में ‘दुष्टात्माएँ’ सहज और धार्मिक संदर्भ में स्पष्ट है।
- source_word: ይዘብሑ
  choice: बलि करेंगे
  rationale: मूल क्रिया बलि चढ़ाने की है; बच्चों के प्रत्यक्ष कर्म-वाच्य संबंध को हिन्दी में स्पष्ट रखा गया है।
theological_decisions:
- issue: ‘अपने-अपने भ्रम’ का आशय
  choice: अमूर्त ‘भ्रम’ को बनाए रखा गया
  alternative: ‘अपने-अपने देवता/मूर्ति’ के आगे
  rationale: मूल पाठ गलती या भटकाव की भाषा रखता है और उपास्य की ठोस पहचान नहीं करता; इसलिए उसकी धार्मिक आलोचना को बिना अतिरिक्त विशिष्टता जोड़े संरक्षित किया गया है।
- issue: ‘हृदय के भ्रम के हर काम’ की वाक्यगत संबद्धता
  choice: बलि को ‘अपने हृदय के भ्रम से उपजे हर काम के लिए’ से जोड़ा गया
  alternative: ‘और उनके हृदय का हर काम भ्रम होगा’
  rationale: प्राप्त गीइज़ पाठ और परामर्श-पाठ में यह अंतिम पद बलि करने की क्रिया के साथ जुड़ा है; हिन्दी में इस संबंध को पठनीय बनाया गया, जबकि ‘भ्रम’ की पुनरावृत्ति सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-अनुकूल रूप अपनाया गया है। मूल की क्रमिक निन्दात्मक सूची और ‘भ्रम’ की जानबूझकर की गई पुनरावृत्ति बचाई गई है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
