  text: And I will send witnesses to them so that I may testify to them, but they will not listen; and they will also kill the witnesses, and they will drive away those who seek the law, and they will overturn everything and begin to do evil.
translation:
  language: hi
  text: और मैं उनके पास गवाह भेजूँगा, ताकि मैं उनके सामने गवाही दूँ; पर वे नहीं सुनेंगे। वे उन गवाहों को भी मार डालेंगे, और जो व्यवस्था की खोज करते हैं उन्हें भगा देंगे। वे सब कुछ उलट-पुलट कर देंगे और बुराई करने लगेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕተ
  choice: गवाह
  rationale: यह शब्द इस पद में उन व्यक्तियों को सूचित करता है जिन्हें गवाही देने के लिए भेजा जाता है; इसलिए आधुनिक हिन्दी में ‘गवाह’ स्वाभाविक और सटीक है।
- source_word: ሕገ
  choice: व्यवस्था
  rationale: यहाँ आशय ईश्वर की विधि/धार्मिक व्यवस्था से है; ‘व्यवस्था’ बाइबलीय प्रयोग को बनाए रखते हुए ‘कानून’ की अपेक्षा इस संदर्भ में अधिक उपयुक्त है।
- source_word: ያፀርዑ
  choice: उलट-पुलट कर देंगे
  rationale: क्रिया में व्यवस्था बिगाड़ने या सब कुछ उलट देने का भाव है; यह चयन मूल की व्यापकता बनाए रखता है।
- source_word: ይዌልእ፡ ለገቢረ፡ እኩይ
  choice: बुराई करने लगेंगे
  rationale: आरम्भ करने और बुरा कार्य करने के संयुक्त भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा भेजे गए गवाहों और स्वयं परमेश्वर की गवाही के बीच संबंध
  choice: ‘गवाह भेजूँगा, ताकि मैं उनके सामने गवाही दूँ’
  alternative: ‘गवाह भेजूँगा, ताकि वे उनके सामने गवाही दें’
  rationale: गीज़ पाठ में उद्देश्यवाचक क्रिया प्रथम पुरुष एकवचन प्रतीत होती है और अंग्रेज़ी परामर्श-पाठ भी यही तनाव सुरक्षित रखता है; इसलिए इसे गवाहों की गवाही में परमेश्वर की अपनी गवाही के रूप में बिना स्पष्ट व्याख्या जोड़े रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर उपवाक्यों को स्पष्ट वाक्यों में बाँटा गया है, जबकि मूल का क्रम और भविष्यकाल बनाए रखा गया है।
