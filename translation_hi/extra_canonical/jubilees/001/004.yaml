  yaml_path: translation/extra_canonical/jubilees/001/004.yaml
  text: And on the seventh day he called to Moses from the midst of the cloud, and the appearance of the glory of Yahweh was like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.
translation:
  language: hi
  text: और सातवें दिन उसने बादल के बीच से मूसा को पुकारा। यहोवा की महिमा का दृश्य रूप[a] पर्वत की चोटी पर धधकती आग के समान था। मूसा पर्वत पर चालीस दिन और चालीस रात रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की महिमा धधकती आग के समान दिखाई दी।”
    reason: गीज़ पदबंध को ‘महिमा का दृश्य रूप’ जैसी संज्ञात्मक अभिव्यक्ति या ‘महिमा दिखाई दी’ जैसी क्रियात्मक अभिव्यक्ति के रूप में समझने की संभावना को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ርእዩ፡ ስብሐተ፡ እግዚአብሔር
  choice: यहोवा की महिमा का स्वरूप
  rationale: गीज़ पदबंध को संज्ञात्मक अर्थ में लेते हुए ईश्वरीय महिमा के दृश्य रूप को व्यक्त किया गया है; इससे स्रोत की संरचना और संभव अस्पष्टता बनी रहती है।
- source_word: እሳት፡ ዘያነድድ
  choice: धधकती आग
  rationale: यह अभिव्यक्ति जलती हुई, प्रज्वलित आग का स्वाभाविक और सजीव आधुनिक हिन्दी रूप है।
- source_word: ርእሰ፡ ደብር
  choice: पर्वत की चोटी
  rationale: शाब्दिक ‘पर्वत के सिर’ का स्वाभाविक हिन्दी समतुल्य ‘पर्वत की चोटी’ है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: इस संदर्भ में ईश्वरीय नाम को पदवी ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: महिमा के दृश्य प्रकटाव का व्याकरण
  choice: यहोवा की महिमा का स्वरूप ... के समान था
  alternative: यहोवा की महिमा ... के समान दिखाई दी
  rationale: मुख्य पाठ संज्ञात्मक पाठ को सुरक्षित रखता है और यह नहीं ठहराता कि क्रिया का आशय केवल ‘प्रकट हुई’ था; वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बादल के बीच से’, ‘पर्वत की चोटी’ और ‘धधकती आग’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि धर्मदर्शनीय दृश्य की गंभीरता बनी रहती है।
