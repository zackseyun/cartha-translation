  text: And many will perish, and they will be captured and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.
translation:
  language: hi
  text: और बहुत-से लोग नष्ट हो जाएँगे; वे बंदी बना लिए जाएँगे और शत्रु के हाथ में पड़ जाएँगे, क्योंकि उन्होंने मेरी विधियों, मेरी आज्ञाओं, मेरी वाचा के पर्वों, मेरे विश्राम-दिनों और मेरी उन पवित्र वस्तुओं को त्याग दिया जिन्हें मैंने उनके बीच अपने लिए पवित्र ठहराया था; उन्होंने मेरे निवास-तम्बू को और मेरे पवित्रस्थान को भी त्याग दिया, जिसे मैंने देश के बीचोंबीच अपने लिए पवित्र ठहराया था, ताकि मैं उस पर अपना नाम स्थापित करूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሐጐሉ
  choice: नष्ट हो जाएँगे
  rationale: क्रिया विनाश या नाश हो जाने का भाव देती है; यहाँ भविष्यकालीन भविष्यवाणी के अनुरूप यह स्वाभाविक हिन्दी है।
- source_word: ይትአኀዙ
  choice: बंदी बना लिए जाएँगे
  rationale: शत्रु के हाथ में पड़ने के समानांतर प्रसंग में केवल ‘पकड़े जाएँगे’ से अधिक स्पष्ट रूप से युद्ध-बंदी होने का अर्थ व्यक्त होता है।
- source_word: ሥርዐትየ
  choice: मेरी विधियों
  rationale: ‘व्यवस्थाओं/नियमों’ के अर्थ वाले पद के लिए धार्मिक-कानूनी संदर्भ में ‘विधियाँ’ संक्षिप्त और प्रतिष्ठित विकल्प है।
- source_word: በዓላት፡ ኪዳንየ
  choice: मेरी वाचा के पर्वों
  rationale: संबंधसूचक संरचना को यथावत रखते हुए covenant को बाइबलीय हिन्दी के परिचित शब्द ‘वाचा’ से व्यक्त किया गया है।
- source_word: ሰንበታትየ
  choice: मेरे विश्राम-दिनों
  rationale: बहुवचन को बनाए रखा गया है; ‘विश्राम-दिन’ सामान्य पाठक के लिए अर्थपूर्ण है और केवल लिप्यंतर पर निर्भर नहीं करता।
- source_word: ቅድሳትየ
  choice: मेरी पवित्र वस्तुओं
  rationale: मूल का बहुवचन व्यापक है; इसे किसी एक प्रकार की पवित्र वस्तु या संस्था तक सीमित नहीं किया गया।
- source_word: ደብተራየ
  choice: मेरे निवास-तम्बू
  rationale: यहाँ पवित्र तम्बू/टैबरनैकल अभिप्रेत है; ‘निवास-तम्बू’ ईश्वरीय निवास का भाव स्पष्ट करता है।
- source_word: መቅደስየ
  choice: मेरे पवित्रस्थान
  rationale: sanctuary के लिए स्वाभाविक बाइबलीय हिन्दी, बिना इसे अनिवार्य रूप से बाद के स्थायी मंदिर तक सीमित किए।
- source_word: ከመ፡ አሢም፡ ስምየ፡ ላዕሌሁ
  choice: ताकि मैं उस पर अपना नाम स्थापित करूँ
  rationale: उद्देश्यवाचक संरचना और ‘नाम रखने/स्थापित करने’ की मूल धार्मिक अभिव्यक्ति को सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘मेरी वाचा के पर्व’ का संबंध
  choice: ‘वाचा’ को ‘पर्वों’ से संबद्ध रखा गया
  alternative: ‘मेरी वाचा, मेरे पर्व’ के रूप में अलग-अलग मदें
  rationale: मूल पदक्रम और अंग्रेज़ी परामर्श-पाठ दोनों संबंधसूचक अर्थ का समर्थन करते हैं; सूची को पुनर्विभाजित करना अनावश्यक व्याख्या होता।
- issue: पवित्र वस्तुओं, निवास-तम्बू और पवित्रस्थान का संबंध
  choice: इन्हें सूची में संबंधित किन्तु पृथक मदों के रूप में रखा गया
  alternative: निवास-तम्बू और पवित्रस्थान को ‘पवित्र वस्तुओं’ की व्याख्या मानना
  rationale: मूल के संयोजक पद अलग मदों की अनुमति देते हैं; विरामचिह्न अर्थ को स्पष्ट करते हैं, पर पहचान को एक नहीं करते।
- issue: ‘उस पर’ का पूर्वपद
  choice: निकटतम एकवचन ‘पवित्रस्थान’ की ओर संकेत खुला रखा गया
  alternative: पूरे निवास-तम्बू और पवित्रस्थान, या भूमि, को स्पष्ट रूप से पूर्वपद बनाना
  rationale: मूल एकवचन सर्वनाम का प्रयोग करता है और कुछ संदर्भगत अस्पष्टता बनी रहती है; हिन्दी में उसे अतिरिक्त व्याख्या से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पाठयोग्य बाइबलीय शैली अपनाई गई है। लंबी मूल-सूची को अर्धविरामों से व्यवस्थित किया गया है, पर उसकी संचयी लय और सभी प्रमुख अवयव सुरक्षित रखे गए हैं।
