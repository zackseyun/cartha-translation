  yaml_path: translation/extra_canonical/jubilees/001/002.yaml
  text: On the sixteenth day of that month, Yahweh spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written, so that you may teach them.” And Moses went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai,
translation:
  language: hi
  text: उस महीने के सोलहवें दिन प्रभु ने मूसा से कहा, “पर्वत पर मेरे पास चढ़ आ। मैं तुझे व्यवस्था और आज्ञा की पत्थर की दो पटियाएँ दूँगा, जिन्हें मैंने लिखा है, ताकि तू उन्हें सिखाए।” तब मूसा परमेश्वर के पर्वत पर चढ़ गया और वहीं ठहरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु / परमेश्वर
  rationale: गीज़ पद में यही ईश्वर-संज्ञा है। प्रत्यक्ष संबोधन में स्वाभाविक हिन्दी के लिए “प्रभु” और स्थिर पदबंध ደብረ፡ እግዚአብሔር के लिए “परमेश्वर का पर्वत” चुना गया; स्रोत में विशिष्ट नाम ‘याहवे’ अक्षरशः नहीं है।
- source_word: ዕረግ፡ ኀቤየ፡ ውስተ፡ ደብር
  choice: पर्वत पर मेरे पास चढ़ आ
  rationale: चढ़ने की दिशा और ‘मेरे पास’—दोनों अर्थों को सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: ክልኤተ፡ ጽላተ፡ እብን
  choice: पत्थर की दो पटियाएँ
  rationale: दो पत्थर-पट्टिकाओं का ठोस अर्थ सीधे और बाइबिलीय हिन्दी में व्यक्त होता है।
- source_word: ዘሕግ፡ ወዘትእዛዝ
  choice: व्यवस्था और आज्ञा की
  rationale: दोनों समन्वित संज्ञाओं को अलग रखा गया है; उन्हें एक ही अवधारणा में नहीं मिलाया गया।
- source_word: ታስብዎሙ
  choice: तू उन्हें सिखाए
  rationale: संदर्भ और परामर्श-पाठ के अनुसार शिक्षण का आशय लिया गया है, जबकि बहुवचन कर्म का संकेत ‘उन्हें’ से बना रहता है।
- source_word: ወኀደረ
  choice: और वहीं ठहरा
  rationale: क्रिया का कर्ता निकटतम ‘मूसा’ है और इसका अर्थ ठहरना/रहना है; उपलब्ध गीज़ पाठ में ‘प्रभु की महिमा सीनै पर ठहरी’ नहीं लिखा है।
theological_decisions:
- issue: ईश्वर के नाम का रूप
  choice: प्रभु / परमेश्वर
  alternative: याहवे
  rationale: अनुवाद उपलब्ध गीज़ साक्ष्य पर आधारित है, जहाँ እግዚአብሔር है; इसलिए परामर्श-पाठ में आए ‘Yahweh’ को बिना प्रत्यक्ष स्रोत-साक्ष्य के पाठ में नहीं जोड़ा गया।
- issue: पद का अंतिम कर्ता
  choice: मूसा वहीं ठहरा
  alternative: याहवे की महिमा सीनै पर्वत पर ठहरी
  rationale: गीज़ में ‘मूसा ... चढ़ गया और ठहरा’ एक सतत वाक्य है। ‘महिमा’ और ‘सीनै’ उपलब्ध मूल-पाठ में नहीं हैं, इसलिए उन्हें इस पद में सम्मिलित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। उद्धरण में एकवचन निकट संबोधन ‘तू/तुझे’ मूल व्याकरण के अनुरूप है। उपलब्ध गीज़ पाठ को अंग्रेज़ी परामर्श-पाठ से प्राथमिकता दी गई है, विशेषकर अंतिम उपवाक्य में।
