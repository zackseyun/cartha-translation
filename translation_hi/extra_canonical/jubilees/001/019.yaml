base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/019.yaml
  text: And he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people.”
translation:
  language: hi
  text: और उसने प्रार्थना करके कहा, “हे प्रभु, मेरे परमेश्वर, अपनी प्रजा और अपनी विरासत को उनके मन की भटकन में चलते रहने के लिए न छोड़, और उन्हें उनके शत्रुओं—अन्यजातियों—के हाथ में न सौंप, कहीं ऐसा न हो कि वे उन पर शासन करें और उनसे तेरे विरुद्ध पाप करवाएँ। हे प्रभु, तेरी दया तेरी प्रजा पर प्रबल हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝበከ፡ ወርስትከ
  choice: अपनी प्रजा और अपनी विरासत
  rationale: दोनों समांतर संज्ञाओं को अलग रखा गया है; ‘विरासत’ परमेश्वर के अधिकार और विशेष संबंध का भाव बनाए रखती है।
- source_word: በሐዊር፡ በስሕተተ፡ ልቦሙ
  choice: उनके मन की भटकन में चलते रहने के लिए
  rationale: ሐዊር के चलने और ስሕተተ के भूल/भटकन संबंधी अर्थ को स्वाभाविक हिन्दी में संयुक्त रूप से व्यक्त किया गया है।
- source_word: አሕዛብ
  choice: अन्यजातियों
  rationale: यहाँ शब्द शत्रु राष्ट्रों अथवा गैर-इस्राएली जातियों को स्पष्ट करता है; ‘अन्यजातियाँ’ धार्मिक-ऐतिहासिक संदर्भ को संक्षेप में सुरक्षित रखता है।
- source_word: ይኰንንዎሙ
  choice: उन पर शासन करें
  rationale: संदर्भ में प्रभुत्व या अधीन करने का भाव है; ‘शासन करें’ अंग्रेज़ी परामर्श-पाठ के अनुरूप और सहज है।
- source_word: ይትለዐል፡ ... ምሕረትከ
  choice: तेरी दया ... प्रबल हो
  rationale: शाब्दिक ‘ऊपर उठे’ हिन्दी में अस्पष्ट होता; ‘प्रबल हो’ दया के प्रभावी रूप से प्रकट होने का भाव देता है, बिना उसे केवल ‘दिखाई दे’ तक सीमित किए।
theological_decisions:
- issue: लोगों की भटकन और परमेश्वर द्वारा छोड़ दिए जाने के बीच संबंध
  choice: ‘उनके मन की भटकन में चलते रहने के लिए न छोड़’
  alternative: ‘उनके हृदयों की भूल में चलने को न त्याग’
  rationale: 'पाठ की प्रार्थनात्मक तनाव-स्थिति सुरक्षित है: भटकन उनकी अपनी है, फिर भी मूसा परमेश्वर से उन्हें उसमें छोड़ न देने की विनती करता है।'
- issue: शत्रुओं द्वारा पाप कराने की भूमिका
  choice: ‘उनसे तेरे विरुद्ध पाप करवाएँ’
  alternative: ‘वे तेरे विरुद्ध पाप करें’
  rationale: कारक क्रिया का भाव रखा गया है कि विदेशी शासक उन्हें पाप की ओर बाध्य या प्रेरित करेंगे; साथ ही मानवीय उत्तरदायित्व पर अतिरिक्त सिद्धांत आरोपित नहीं किया गया।
- issue: दया के ‘उठाए जाने’ का रूपक
  choice: ‘तेरी दया ... प्रबल हो’
  alternative: ‘तेरी दया ... ऊपर उठे’
  rationale: मूल रूपक असामान्य है और उसका आशय दया की प्रभावी प्रधानता हो सकता है। मुख्य पाठ में अर्थ-सुगमता चुनी गई है; कोई विशिष्ट सम्प्रदायगत व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर को संबोधित करते समय एकवचन निकटता-सूचक ‘तू/तेरा’ रूपों का प्रयोग हुआ है, पर सीधे ‘तू’ की आवश्यकता नहीं पड़ी। वाक्य मूल की लंबी विनती की संरचना बनाए रखते हुए हिन्दी में सहज विरामों के साथ प्रस्तुत है।
