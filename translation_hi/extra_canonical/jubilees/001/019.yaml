  text: ወጸለየ፡ ወይቤ፡ እግዚኦ፡ አምላኪየ፡¹⁴ ኢትኅድግ፡ ሕዝበከ፡ ወርስትከ፡ በሐዊር፡ በስሕተተ፡ ልቦሙ፡ ወኢትመጥዎሙ፡ ውስተ፡ እዴ፡ ፀሮሙ፡¹⁵ አሕዛብ፡ ከመ፡ ኢይኰንንዎሙ፡ ወ*ከመ፡² ኢይገብርዎሙ፡¹⁶ ከመ፡ ይኅጥኡ፡¹⁷ ለከ። ይትለዐል፡¹⁸ እግዚኦ፡¹⁹ ምሕረትከ፡ ላዕለ፡ ሕዝብከ፡
