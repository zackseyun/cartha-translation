  yaml_path: translation/extra_canonical/jubilees/008/037.yaml
  text: Before the altar that is accepted. And in the fifth year make a release, so that you may release it.
translation:
  language: hi
  text: उस वेदी के सामने जो स्वीकार की जाती है।[a] और पाँचवें वर्ष में छुटकारा दो, ताकि तुम उसे छोड़ सको।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से वाक्यखंड है: “स्वीकार की जानेवाली वेदी के सामने।” इसका पिछले संदर्भ से संबंध इस अंश में स्पष्ट नहीं है।'
    reason: खंडित वाक्य और संदर्भगत अस्पष्टता को दर्शाने के लिए।
  - marker: b
    text: प्राप्त गीज़ पाठ में पहले क्रियापद को “उन्होंने किया” भी पढ़ा जा सकता है; पर अगला क्रियापद बहुवचन “तुम” को संबोधित करता है। संभवतः यहाँ आज्ञार्थक रूप अभिप्रेत है। “छोड़ सको” का अर्थ “मुक्त कर सको” भी हो सकता है।
    reason: पाठगत व्यक्ति-वचन असंगति और ኅድገተ/ታሕድግዎ की अर्थगत व्यापकता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ምሥዋዕ
  choice: वेदी
  rationale: गीज़ ምሥዋዕ का अर्थ यहाँ ‘वेदी’ है; ‘बलि/भेंट’ के लिए सामान्यतः भिन्न रूप መሥዋዕት आता है।
- source_word: ዘይትወከፍ
  choice: जो स्वीकार की जाती है
  rationale: यह संबंधवाचक निष्क्रिय रूप स्वीकार किए जाने का भाव रखता है और ‘वेदी’ के साथ व्याकरणिक रूप से जोड़ा गया है।
- source_word: ኅድገተ
  choice: छुटकारा
  rationale: संज्ञा में छोड़ने, मुक्त करने या रिहाई देने का व्यापक भाव है; ‘छुटकारा’ उस अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: ታሕድግዎ
  choice: तुम उसे छोड़ सको
  rationale: क्रिया द्वितीय पुरुष बहुवचन है और प्रत्यय का अर्थ ‘उसे’ है; ‘छोड़ना’ मुक्त करने और त्याग देने, दोनों संभावनाएँ खुली रखता है।
theological_decisions:
- issue: दूसरे खंड में आदेश बनाम भूतकालीन कथन
  choice: 'आदेश: ‘छुटकारा दो’'
  alternative: ‘उन्होंने छुटकारा दिया’
  rationale: प्राप्त पाठ का ገበሩ सतही रूप से तृतीय पुरुष बहुवचन भूतकाल हो सकता है, पर आगे का ታሕድግዎ स्पष्टतः द्वितीय पुरुष बहुवचन है; इसलिए निकटवर्ती आज्ञार्थक पाठ ግበሩ की संभावना और वाक्य-संगति के आधार पर आदेश चुना गया, जबकि पाठगत समस्या पादटिप्पणी में सुरक्षित है।
- issue: छुटकारा देने की वस्तु या आशय
  choice: ‘उसे छोड़ सको’ द्वारा अस्पष्टता बनाए रखना
  alternative: किसी भूमि, ऋण या व्यक्ति की स्पष्ट पहचान करना
  rationale: अंश स्वयं संदर्भित वस्तु की पहचान नहीं करता; अतः कोई विशिष्ट धार्मिक या विधिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्रोत का वाक्य खंडित और संदर्भ से अलग प्रतीत होता है, इसलिए हिन्दी में अनावश्यक पूर्ति नहीं की गई। ‘तुम’ मूल के द्वितीय पुरुष बहुवचन संबोधन को स्वाभाविक ढंग से व्यक्त करता है।
