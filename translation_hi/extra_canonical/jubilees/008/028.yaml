  yaml_path: translation/extra_canonical/jubilees/008/028.yaml
  text: And he blessed the God of gods, who had put the word of the Lord in his mouth.
translation:
  language: hi
  text: और उसने देवताओं के परमेश्वर को धन्य कहा, जिसने उसके मुँह में प्रभु का वचन रखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: धन्य कहा
  rationale: क्रिया का अर्थ आशीष देना/धन्य कहना है; मनुष्य द्वारा परमेश्वर के प्रति की गई स्तुति के संदर्भ में ‘धन्य कहा’ स्वाभाविक और अर्थसंगत है।
- source_word: አምላክ፡ አማልክት
  choice: देवताओं के परमेश्वर
  rationale: मूल पदबंध ‘God of gods’ की श्रेणीवाचक पुनरुक्ति और धर्मवैचारिक तनाव को बिना समतल किए सुरक्षित रखता है।
- source_word: ንባበ፡ እግዚአብሔር
  choice: प्रभु का वचन
  rationale: ንባብ यहाँ कथन/वचन को और እግዚአብሔር प्रभु को सूचित करता है; ‘वचन’ धार्मिक संदर्भ में स्वाभाविक है।
- source_word: ዘወደየ፡ ውስተ፡ አፉሁ
  choice: जिसने उसके मुँह में ... रखा था
  rationale: मूल के ‘उसके मुँह में रखने’ वाले मुहावरे को बनाए रखता है, जिसका आशय बोलने के लिए वचन प्रदान करना है।
theological_decisions:
- issue: ‘God of gods’ में बहुवचन ‘gods’ का निर्वाह
  choice: देवताओं के परमेश्वर
  alternative: सर्वोच्च परमेश्वर
  rationale: वैकल्पिक रूप व्याख्यात्मक होकर मूल के स्पष्ट बहुवचन और उसकी वास्तविक धर्मवैचारिक अभिव्यक्ति को मिटा देता।
- issue: प्रभु के वचन का मुँह में रखा जाना
  choice: मूल रूपक को अक्षुण्ण रखा
  alternative: जिसने उसे प्रभु का वचन बोलने को दिया था
  rationale: मूल वाक्य प्रेरित वाणी का संकेत दे सकता है, पर उसका तंत्र स्पष्ट नहीं करता; इसलिए रूपक को व्याख्या में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज धार्मिक गद्य। ‘धन्य कहा’ परमेश्वर की स्तुति के लिए ‘आशीष दी’ से अधिक स्वाभाविक है; वाक्य-संरचना मूल के निकट रहते हुए स्पष्ट रखी गई है।
