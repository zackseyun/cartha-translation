  text: which they shed in the midst of the earth, He destroyed everything; and I and you, my children, and all who entered with us into the ark were left. And now, behold, I see before me your deeds, that you are not walking in righteousness, for you have begun to walk in the path of corruption, and you are separating, each one from his neighbor, and are jealous of one another, and are not united together.
translation:
  language: hi
  text: '“जिसे उन्होंने धरती के बीच बहाया था, उसने सब कुछ नष्ट कर दिया;[a] और मैं, तुम—मेरे बच्चो—और वे सभी जो हमारे साथ किश्ती में गए थे, बच गए। और अब देखो, मैं तुम्हारे कर्म अपने सामने देख रहा हूँ: तुम धार्मिकता के मार्ग पर नहीं चल रहे हो,[b] क्योंकि तुम भ्रष्टता के मार्ग पर चलने लगे हो। तुममें से हर एक अपने पड़ोसी से अलग हो रहा है, तुम एक-दूसरे से ईर्ष्या करते हो, और मिल-जुलकर नहीं रहते।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “धरती के बीच जो थे, उसने उन सबको नष्ट कर दिया।”
    reason: गीज़ पाठ की पारंपरिक वैकल्पिक समझ दर्ज करने के लिए; मुख्य पाठ में ዘከዐዉ को ‘जिसे उन्होंने बहाया’ और ኵሎ को ‘सब कुछ’ माना गया है।
  - marker: b
    text: शाब्दिक रूप से, “तुम धार्मिकता में नहीं चल रहे हो।”
    reason: स्रोत के ‘धार्मिकता में चलना’ मुहावरे का अधिक औपचारिक रूप सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ዘከዐዉ
  choice: जिसे उन्होंने ... बहाया था
  rationale: क्रिया का अर्थ ‘जिसे उन्होंने उँडेला/बहाया’ है और पूर्ववर्ती पद में आए रक्त की ओर संकेत करता है।
- source_word: ደምሰሰ፡ ኵሎ
  choice: उसने सब कुछ नष्ट कर दिया
  rationale: ኵሎ का अर्थ ‘सब कुछ’ है; यह ‘उन सबको’ नहीं है। तीसरे पुरुष एकवचन कर्ता को स्रोत की तरह अनिर्दिष्ट रखा गया है।
- source_word: ታቦት
  choice: जहाज़
  rationale: जलप्रलय के संदर्भ में यह नूह के बड़े जलयान/ark को दर्शाता है; साधारण पाठक के लिए ‘जहाज़’ स्वाभाविक है।
- source_word: በጽድቅ
  choice: धार्मिकता के मार्ग पर
  rationale: ‘धार्मिकता में चलना’ की नैतिक अर्थछटा को स्वाभाविक हिन्दी मुहावरे में व्यक्त किया गया है।
- source_word: በፍኖተ፡ ሙስና
  choice: भ्रष्टता के मार्ग पर
  rationale: ፍኖተ एकवचन ‘मार्ग’ है और ሙስና नैतिक भ्रष्टता/बिगाड़ को सूचित करता है।
- source_word: ትትፋለጡ፡ አሐዱ፡ አሐዱ፡ እምነ፡ ቢጹ
  choice: तुममें से हर एक अपने पड़ोसी से अलग हो रहा है
  rationale: पारस्परिक अलगाव और ‘एक-एक अपने साथी/पड़ोसी से’ की संरचना को स्पष्ट हिन्दी में रखा गया है।
- source_word: ኢትሄልዉ፡ ኅቡረ
  choice: मिल-जुलकर नहीं रहते
  rationale: शाब्दिक ‘एक साथ/संयुक्त नहीं होते’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसने’ का संदर्भ
  choice: मुख्य पाठ में ‘उसने’ रखा
  alternative: ‘परमेश्वर ने’
  rationale: स्रोत में कर्ता तीसरे पुरुष एकवचन में निहित है, उसका नाम यहाँ स्पष्ट नहीं किया गया; इसलिए धर्मवैचारिक स्पष्टता जोड़ने के बजाय स्रोत की संदर्भगत अस्पष्टता सुरक्षित रखी गई।
- issue: धार्मिकता में चलने का काल-पक्ष
  choice: ‘नहीं चल रहे हो’
  alternative: ‘नहीं चले हो’
  rationale: गीज़ का अपूर्ण/अविरत रूप वर्तमान या जारी आचरण बताता है, पूर्ण भूतकाल नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मेरे बच्चो’ संबोधन रखा गया है; लंबे गीज़ वाक्य को पठनीय हिन्दी वाक्यों में बाँटा गया है। ‘धार्मिकता’ और ‘भ्रष्टता’ नैतिक-धार्मिक तनाव को बिना सांप्रदायिक व्याख्या के बनाए रखते हैं।
