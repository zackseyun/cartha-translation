base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/006.yaml
  text: For he said, “I was indeed sent,” and in the fourth year Shelah was born and grew up; and he took for himself a wife, and her name was Melka, the daughter of Kebed, his father’s brother, in the first year of the fifth week of the thirty-first jubilee.
translation:
  language: hi
  text: क्योंकि उसने कहा, “मैं सचमुच भेजा गया था।” चौथे वर्ष शेलह का जन्म हुआ और वह बड़ा हुआ। फिर उसने अपने लिए एक पत्नी ली, जिसका नाम मेलका था। वह केबेद की बेटी थी; केबेद उसके पिता का भाई था। उसने उसे इकतीसवीं जुबली के पाँचवें सप्ताह के पहले वर्ष में पत्नी के रूप में लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “शेलह का जन्म हुआ; और शेलह ने अपने लिए एक पत्नी ली, जिसका नाम मेलका था। वह केबेद की बेटी थी; केबेद उसके पिता का भाई था। उसने उसे पाँचवीं जुबली के तीसरे सप्ताह के पहले वर्ष में पत्नी के रूप में लिया।”'
    reason: अंग्रेज़ी POB लेखा-पथ में दर्ज पूर्ववर्ती वैकल्पिक पाठ-प्रस्तुति को स्पष्ट रूप से सुरक्षित रखता है; मुख्य पाठ गीइज़ पाठ के अनुसार इकतीसवीं जुबली और पाँचवाँ सप्ताह रखता है।
