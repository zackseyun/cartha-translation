  terminology: ‘जुबली’ is preferable to ‘जुबली-वर्ष’ here, since the source names the book’s calendrical jubilee unit rather than merely a year. Names are retained consistently as शेलह, मेलका, and केबेद.
  issues:
  - severity: medium
    issue: The time phrase is attached too broadly.
    rationale: In the source, ‘in the first year of the fifth week of the thirty-first jubilee’ modifies Shelah’s taking Melka as wife, not the preceding birth-and-growth statement as a whole.
  - severity: low
    issue: The verbal tense of the quoted statement is not aligned with the source/audit trail.
