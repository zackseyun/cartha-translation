  - severity: medium
    issue: The footnote does not preserve the actual alternate rendering recorded in the English audit trail.
    rationale: The audit footnote supplies a full alternative reading, including different jubilee and week numbers. The Hindi note only summarizes a chronological issue and should state that alternative explicitly.
