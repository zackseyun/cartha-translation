  text: And she bore him a son in the third year of this week, and he called his name Kainam. And the child grew,
translation:
  language: hi
  text: और इस सप्ताह के तीसरे वर्ष में उसने उसके लिए एक पुत्र को जन्म दिया, और उसने उसका नाम कैनाम रखा। और बालक बड़ा हुआ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልደ
  choice: उसने ... एक पुत्र को जन्म दिया
  rationale: क्रिया और पुल्लिंग कर्म ‘पुत्र’ को स्पष्ट रखते हुए आधुनिक, स्वाभाविक हिन्दी दी गई है।
- source_word: በዓመተ፡ ሣልስ፡ በሱባዔ፡ ዝንቱ
  choice: इस सप्ताह के तीसरे वर्ष में
  rationale: जुबिलीज़ की कालगणना में ‘सप्ताह’ वर्षों के सातक को सूचित करता है; स्रोत की अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: ቃይናም
  choice: कैनाम
  rationale: व्यक्तिनाम का हिन्दी लिप्यंतरण स्रोत रूप के निकट रखा गया है।
- source_word: ወልህቀ፡ ወልድ
  choice: और बालक बड़ा हुआ
  rationale: समापन वाक्यांश को शामिल किया गया है; ‘बालक’ प्रसंग में स्वाभाविक है और ‘पुत्र’ की अनावश्यक पुनरावृत्ति से बचाता है।
