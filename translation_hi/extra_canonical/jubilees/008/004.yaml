base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/004.yaml
  text: '...and the moon and the stars in all the signs of heaven. And he wrote it down and said nothing about it...'
translation:
  language: hi
  text: …और चन्द्रमा और तारों के विषय में, आकाश के सभी चिह्नों में। उसने इसे लिखा और इसके विषय में कुछ नहीं कहा…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ पाठ में क्रिया का रूप शाब्दिक रूप से “और उसने बताया/कहा” पढ़ा जा सकता है। किंतु संदर्भ में नकारसूचक अक्षर के लोप की संभावना मानी गई है; तब पाठ का अर्थ “और उसने इसके विषय में नहीं कहा” होगा। पूर्व के पद-विभाजन में इससे पहले का एक लंबा अंश भी गलती से यहाँ सम्मिलित था।
    reason: उपलब्ध सकारात्मक क्रिया-रूप और संदर्भ से समर्थित संभावित नकारात्मक पाठ, दोनों को पारदर्शी रूप से दर्शाना; साथ ही पद-विभाजन संबंधी पूर्व त्रुटि स्पष्ट करना।
lexical_decisions:
- source_word: ወወርኅ
  choice: और चन्द्रमा
  rationale: यह खंड पूर्ववर्ती वाक्य की निरंतरता है; ወ उपसर्ग को ‘और’ तथा ወርኅ को ‘चन्द्रमा’ के रूप में प्रस्तुत किया गया है।
- source_word: ወከዋክብት
  choice: और तारों
  rationale: बहुवचन ‘तारे’ को वाक्य के संबंधसूचक ढाँचे के अनुसार ‘तारों’ किया गया है।
- source_word: ውስተ ኵሉ ትእምረ ሰማይ
  choice: आकाश के सभी चिह्नों में
  rationale: शाब्दिक अर्थ ‘आकाश के समस्त चिह्नों में’ है; ‘चिह्न’ मूल की व्यापकता बनाए रखता है और इसे अनावश्यक रूप से ज्योतिषीय शकुन तक सीमित नहीं करता।
- source_word: ወጸሐፋ
  choice: उसने इसे लिख लिया
  rationale: क्रिया का मूल अर्थ ‘उसने उसे/इसे लिखा’ है; हिन्दी में स्वाभाविक पूर्ण क्रिया प्रयोग की गई है।
- source_word: ወአነገረ
  choice: और इसके विषय में कुछ नहीं कहा
  rationale: प्रसंग और पाठ-समीक्षा के अनुसार उपलब्ध रूप में नकारचिह्न के लोप की प्रबल संभावना है; अर्थगत पाठ ወኢነገረ माना गया है।
theological_decisions:
- issue: आकाशीय ‘चिह्नों’ की प्रकृति
  choice: चिह्नों
  alternative: शकुनों / राशियों
  rationale: मूल पद अपने आप में व्यापक है। ‘शकुन’ या ‘राशियाँ’ चुनने से ज्योतिषीय अर्थ को आवश्यकता से अधिक निश्चित कर दिया जाता।
- issue: अंतिम क्रिया में संभावित पाठ-दोष
  choice: कुछ नहीं कहा
  alternative: बताया / कहा
  rationale: प्राप्त ወአነገረ का सतही अर्थ सकारात्मक हो सकता है, पर संदर्भ, संशोधन-इतिहास और संभावित ወኢነገረ पाठ नकारात्मक अर्थ का समर्थन करते हैं; इसे पादटिप्पणी में पारदर्शी बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। आरम्भ और अंत के दीर्घविराम यह दिखाते हैं कि उपलब्ध स्रोत-पंक्ति दोनों ओर से बड़े वाक्य का अंश है। ‘चन्द्रमा’ और ‘आकाश’ साहित्यिक किन्तु सामान्य बाइबिलीय शब्दावली के अनुरूप हैं।
