  yaml_path: translation/extra_canonical/jubilees/008/023.yaml
  text: and a man his neighbor. And everyone sold himself to do iniquity and to shed much blood.
translation:
  language: hi
  text: और मनुष्य अपने पड़ोसी के विरुद्ध हो गया। हर एक ने अधर्म करने और बहुत रक्त बहाने के लिए अपने आप को बेच दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: मनुष्य अपने पड़ोसी के विरुद्ध हो गया
  rationale: खंड शाब्दिक रूप से ‘और मनुष्य—उसका पड़ोसी/साथी’ जैसा संक्षिप्त है। प्रसंगगत पारस्परिक हिंसा को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘के विरुद्ध हो गया’ जोड़ा गया है, बिना किसी विशेष प्रकार के अपराध को निर्धारित किए।
- source_word: ኵሉ
  choice: हर एक
  rationale: सार्वभौमिक अर्थ को सीधे और सामान्य आधुनिक हिन्दी में रखा गया है।
- source_word: ተሰይጠ
  choice: अपने आप को बेच दिया
  rationale: क्रिया का आत्मवाचक/कर्मवाच्य ‘बेचा गया/स्वयं को बेच दिया’ अर्थ सुरक्षित रखा गया है; यहाँ नैतिक समर्पण का रूपक हटाया नहीं गया।
- source_word: ይግበር፡ ዐመፃ
  choice: अधर्म करने के लिए
  rationale: ዐመፃ के विद्रोह, अन्याय और दुष्टता-संबंधी अर्थक्षेत्र के लिए ‘अधर्म’ व्यापक तथा धार्मिक-साहित्यिक हिन्दी में बोधगम्य है।
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: बहुत रक्त बहाने के लिए
  rationale: ‘बहुत/प्रचुर रक्त उँडेलना’ की स्रोत-छवि को प्रचलित हिन्दी मुहावरे ‘रक्त बहाना’ से व्यक्त किया गया है।
theological_decisions:
- issue: मानवीय भ्रष्टता की स्वेच्छा और बंधन का संबंध
  choice: ‘अपने आप को बेच दिया’
  alternative: ‘बेचा गया’ या ‘पूरी तरह लग गया’
  rationale: स्रोत के रूपक और उसकी संभावित आत्मवाचक शक्ति को बनाए रखते हुए मनुष्य की सक्रिय नैतिक सहभागिता व्यक्त होती है; इसे किसी विशिष्ट पाप-सिद्धांत में नहीं बदला गया।
- issue: ዐመፃ का नैतिक-धार्मिक स्वर
  choice: ‘अधर्म’
  alternative: ‘अन्याय’, ‘विद्रोह’ या ‘दुष्टता’
  rationale: मूल शब्द का अर्थक्षेत्र एक ही हिन्दी पद से पूर्णतः सीमित नहीं किया जा सकता। ‘अधर्म’ यहाँ व्यापक नैतिक उल्लंघन को दर्शाता है और किसी संप्रदायगत व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और कथात्मक शैली। उपलब्ध गीइज़ पाठ को प्राथमिक आधार बनाया गया है; संदर्भ-संख्या से स्पष्ट पाठ-असंगति के बावजूद अनुलग्न पूर्ववर्ती पाठ को मुख्य अनुवाद में नहीं मिलाया गया।
