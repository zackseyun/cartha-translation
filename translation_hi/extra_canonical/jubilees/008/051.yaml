base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/051.yaml
  text: Let them bring up in abundance the first of the wine and oil as firstfruits to the altar of Yahweh, who receives it; and what is left let the servants of the house of Yahweh eat before the altar that receives it.
translation:
  language: hi
  text: वे दाखरस और तेल का पहला भाग बहुतायत से पहली उपज के रूप में याहवे की उस वेदी पर चढ़ाएँ, जो उन्हें ग्रहण करती है; और जो शेष बचे, उसे याहवे के भवन के दास उस वेदी के सामने खाएँ, जो उसे ग्रहण करती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀዳሚ፡ ወይኑ፡ ወቅብአ
  choice: दाखमधु और तेल का पहला भाग
  rationale: दाखमधु और तेल की आरम्भिक उपज को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ቀዳሚ፡ ፍሬ
  choice: पहली उपज
  rationale: कृषि और उपासना-संबंधी संदर्भ में ‘पहली उपज’ सामान्य पाठक के लिए स्पष्ट है और मूल के ‘पहले फल/उपज’ का अर्थ बनाए रखता है।
- source_word: እግዚአብሔር
  choice: याहवे
  rationale: इस प्रसंग में परमेश्वर के वाचा-नाम को अंग्रेज़ी परामर्श-पाठ के अनुरूप व्यक्त करता है, सामान्य उपाधि में नहीं बदलता।
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: याहवे के भवन के सेवक
  rationale: मंदिर-सेवा के संदर्भ में पद को स्वाभाविक हिन्दी में रखता है; ‘दास’ की तुलना में यहाँ ‘सेवक’ भूमिका को अधिक स्पष्ट करता है।
- source_word: ምሥዋዕ፡ ዘይትወከፍ
  choice: वह वेदी जो उसे ग्रहण करती है
  rationale: मूल की पुनरावृत्ति और ग्रहण करने वाली वेदी की असामान्य अभिव्यक्ति को बिना व्याख्यात्मक रूप से बदलने के सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पाठ में विशिष्ट वाचा-नाम का संकेत बनाए रखना अधिक उपयुक्त है; ‘प्रभु’ करने से नाम और उपाधि का भेद मिट सकता है।
- issue: भवन के कर्मियों की सामाजिक स्थिति
  choice: सेवक
  alternative: दास
  rationale: मूल पद मंदिर-सेवा करने वालों को सूचित कर सकता है; संदर्भ उनकी भूमिका पर केंद्रित है, इसलिए बिना आवश्यकता उनकी विधिक सामाजिक स्थिति निश्चित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। मूल की दोहराई हुई अभिव्यक्ति ‘जो उसे ग्रहण करती है’ दोनों स्थानों पर सुरक्षित रखी गई है।
