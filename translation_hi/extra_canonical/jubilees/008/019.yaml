base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
translation:
  language: hi
  text: “…यहोवा शेम के निवास में वास करे।”[a] और उसने जान लिया कि अदन की वाटिका परमपवित्र स्थान और यहोवा का निवास है; सीनै पर्वत निर्जन प्रदेश के मध्य में है, और सिय्योन पर्वत पृथ्वी की नाभि के मध्य में है। ये तीनों एक-दूसरे के सामने पवित्र स्थानों के रूप में सृजे गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य पिछले पद की आशीष को पूरा करता है। शाब्दिक रूप में यहाँ केवल “…यहोवा शेम के निवास में” है।
    reason: आरंभिक गीज़ खंड में क्रिया नहीं है और उसका कामनासूचक भाव पिछले पद से प्राप्त होता है।
lexical_decisions:
- source_word: መሓድሪሁ ለሴም
  choice: शेम के निवास में
  rationale: संज्ञा መሓድር को ‘निवास’ से व्यक्त किया गया; प्रत्यय और संबंधसूचक पद शेम से इसके संबंध को दर्शाते हैं।
- source_word: ገነት ኤዶም
  choice: अदन की वाटिका
  rationale: यह पारंपरिक बाइबलीय स्थाननाम और ‘वाटिका’ का स्वाभाविक हिंदी रूप है।
- source_word: ቅድስተ ቅዱሳን
  choice: परमपवित्र स्थान
  rationale: शाब्दिक ‘पवित्रों का पवित्र’ के स्थापित पवित्रस्थान-संबंधी अर्थ को आधुनिक, सहज हिंदी में रखा गया।
- source_word: ማእከለ ገዳም
  choice: निर्जन प्रदेश के मध्य में
  rationale: ገዳም यहाँ आबादी से दूर जंगल/वीराने का बोध देता है; ‘निर्जन प्रदेश’ आधुनिक हिंदी में व्यापक अर्थ सुरक्षित रखता है।
- source_word: ሕንብርት ለምድር
  choice: पृथ्वी की नाभि
  rationale: स्रोत की शारीरिक-भौगोलिक उपमा को व्याख्यात्मक ‘केंद्र’ में बदलने के बजाय सुरक्षित रखा गया।
- source_word: መንጸረ ዝንቱ
  choice: एक-दूसरे के सामने
  rationale: पाठ के परस्पर अभिमुख होने के स्थानिक भाव को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: आरंभिक खंड का काल और भाव
  choice: “…यहोवा शेम के निवास में वास करे।”
  alternative: “यहोवा शेम के निवास में वास करता था।”
  rationale: गीज़ का आरंभिक अक्रियात्मक खंड पिछले पद की कामनासूचक क्रिया को पूरा करता है; इसलिए स्वतंत्र भूतकालीन कथन बनाने के बजाय पूर्ववर्ती आशीष की कामनासूचक निरंतरता रखी गई।
- issue: अदन का ‘परमपवित्र स्थान’ और यहोवा का निवास होना
  choice: प्रत्यक्ष कथन के रूप में सुरक्षित रखा
  alternative: इसे केवल प्रतीकात्मक तुलना के रूप में नरम करना
  rationale: स्रोत स्पष्ट पहचान प्रस्तुत करता है; अनुवाद उसे किसी विशेष धर्मवैज्ञानिक व्याख्या से सीमित नहीं करता।
- issue: तीन पवित्र स्थानों की परस्पर स्थिति
  choice: “एक-दूसरे के सामने”
  alternative: “एक-दूसरे के अनुरूप”
  rationale: स्थानिक कथन की वास्तविक अस्पष्टता को बनाए रखते हुए स्रोत के अभिमुखता-संबंधी अर्थ के निकट रहा गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया। ‘परमपवित्र स्थान’, ‘सीनै’, ‘सिय्योन’ और ‘पृथ्वी की नाभि’ जैसे बाइबलीय पद सुरक्षित रखे गए; आरंभिक उद्धरण के आगे दीर्घविराम पद 18 से वाक्य की निरंतरता दिखाता है।
