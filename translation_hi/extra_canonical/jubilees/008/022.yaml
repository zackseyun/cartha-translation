base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/022.yaml
  text: all the land of Eden, and all the land of the Erythraean Sea, and all the land of the east, and India, and on the Erythraean Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the north, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea beyond the mountains of Asshur toward the north—a blessed and spacious land, and all that is in it is very good.
translation:
  language: hi
  text: एदेन का सारा देश, एरिथ्राई सागर का सारा देश, पूर्व का सारा देश और भारत; एरिथ्राई सागर और उसके पहाड़; बाशान का सारा देश, लबानोन का सारा देश और कप्तोर के द्वीप; सनीर और अमाना के सभी पहाड़; उत्तर में[a] अश्शूर के पहाड़; एलाम, अश्शूर और बाबेल का सारा देश; सूसा और मादै; अरारात के सभी पहाड़; और अश्शूर के पहाड़ों के पार, उत्तर की ओर, समुद्र के उस पार का सारा प्रदेश—यह एक धन्य और विशाल देश है, और इसमें जो कुछ है वह बहुत अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक अन्य पाठानुसार, “दक्षिण में।”
    reason: दिशा-सूचक पाठ के पूर्ववर्ती प्रतिपादन/पाठांतर को दर्ज किया गया है, जबकि मुख्य पाठ में गीज़ के ‘उत्तर’ अर्थ को अपनाया गया है।
lexical_decisions:
- source_word: ኤዶም
  choice: एदेन
  rationale: परंपरागत बाइबलीय स्थान-नाम का आधुनिक मानक हिन्दी रूप।
- source_word: Erythraean Sea
  choice: एरिथ्राई सागर
  rationale: प्राचीन भौगोलिक नाम को आधुनिक ‘लाल सागर’ से पूरी तरह समीकृत किए बिना लिप्यंतरित किया गया।
- source_word: India
  choice: भारत
  rationale: सामान्य आधुनिक हिन्दी में पहचाना जाने वाला देश-नाम।
- source_word: Asshur
  choice: अश्शूर
  rationale: व्यक्ति/देश और पर्वतीय क्षेत्र के प्राचीन नाम के लिए प्रचलित बाइबलीय रूप।
- source_word: Susa and Media
  choice: सूसा और मादै
  rationale: प्राचीन स्थान और जातीय-भौगोलिक नामों को हिन्दी बाइबलीय शैली के अनुरूप रखा गया।
- source_word: ዘመንገለ፡ መስዕ፡
  choice: उत्तर में
  rationale: गीज़ दिशा-सूचक पद का सीधा अर्थ ‘उत्तर की ओर/उत्तर में’ है; इसी पद का आगे भी उत्तर की दिशा के लिए प्रयोग है।
- source_word: ቡርክት፡ ወስፍሕት
  choice: धन्य और विशाल
