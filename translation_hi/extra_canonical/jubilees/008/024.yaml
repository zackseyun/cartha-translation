base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/024.yaml
  text: And the earth was filled with violence. And after this, they sinned against the beasts and the birds and everything that moves and everything that walks on the earth, and much blood was shed on the earth.
translation:
  language: hi
  text: और पृथ्वी हिंसा से भर गई। इसके बाद उन्होंने पशुओं, पक्षियों, और हर उस प्राणी के विरुद्ध पाप किया जो गतिमान है और पृथ्वी पर चलता-फिरता है, और पृथ्वी पर बहुत-सा रक्त बहाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: हिंसा
  rationale: यह शब्द अन्याय, उपद्रव या हिंसा का भाव रखता है; यहाँ पृथ्वी के रक्तपात से भरने के संदर्भ में ‘हिंसा’ सबसे स्वाभाविक और सटीक है।
- source_word: አበሱ፡ ሎሙ
  choice: उनके विरुद्ध पाप किया
  rationale: क्रिया ‘पाप/दोष करना’ और परोक्ष कर्म-सूचक रूप मिलकर पशु-पक्षियों के विरुद्ध अपराध का भाव देते हैं।
- source_word: አራዊት፡ ወለዐዋፍ
  choice: पशुओं, पक्षियों
  rationale: दोनों जीव-वर्गों को सरल, प्रचलित आधुनिक हिन्दी में अलग-अलग बनाए रखा गया है।
- source_word: ዘይትሐወስ፡ ወዘያንሶሱ፡ ዲበ፡ ምድር
  choice: भूमि पर चलने-फिरने वाले हर प्राणी
  rationale: दो निकटवर्ती गतिसूचक अभिव्यक्तियों को हिन्दी में अनावश्यक पुनरुक्ति से बचाते हुए ‘चलने-फिरने’ में समेटा गया है, जबकि व्यापक जीव-संदर्भ को ‘हर प्राणी’ से स्पष्ट किया गया है।
- source_word: ወትክዐወ፡ ደም፡ ብዙኅ
  choice: बहुत रक्त बहाया गया
  rationale: मूल का रक्त उंडेले/बहाए जाने का निष्क्रिय भाव और उसकी प्रचुरता दोनों सुरक्षित हैं।
theological_decisions:
- issue: पशु-पक्षियों के संबंध में मानव पाप की दिशा
  choice: ‘के विरुद्ध पाप किया’
  alternative: ‘पशु-पक्षियों के साथ पाप किया’
  rationale: मूल में प्रयुक्त कर्म-संबंध उनके प्रति अपराध का संकेत देता है। हिन्दी का ‘के साथ पाप किया’ अनुचित रूप से किसी विशिष्ट प्रकार के अपराध का अर्थ ग्रहण करा सकता है; इसलिए अस्पष्टता को बढ़ाए बिना व्यापक नैतिक अपराध का भाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और कथात्मक शैली। ‘रक्त’ ने मूल के गंभीर धार्मिक-साहित्यिक स्वर को बनाए रखा है; वाक्य को स्वाभाविक बनाने के लिए गतिसूचक समानांतर पदों को ‘चलने-फिरने’ में संयोजित किया गया है।
