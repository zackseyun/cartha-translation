base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/001.yaml
  text: In the twenty-ninth jubilee, in the first week, in its first year, Arpachshad took a wife for himself, and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bore him
translation:
  language: hi
  text: उनतीसवें[a] जुबली-वर्ष के पहले सप्ताह के पहले वर्ष में अर्पक्षद ने अपने लिए एक पत्नी ली। उसका नाम रासूएया था। वह सूसान की बेटी थी, जो एलाम की बेटी थी। और उसने अर्पक्षद के लिए जन्म दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनचासवें।” उपलब्ध गीज़ पाठ के अंक-रूप में समस्या है; घटनाक्रम के कालक्रम के आधार पर यहाँ “उनतीसवें” को मुख्य पाठ में रखा गया है।
    reason: स्रोत के अंक-पाठ और पुस्तक के कालक्रम के बीच वास्तविक पाठगत कठिनाई को स्पष्ट करना।
  - marker: b
    text: शाब्दिक रूप से, “और उसने उसके लिए जन्म दिया।” वाक्य का कर्म अगले पद में आता है।
    reason: पद-विभाजन के कारण स्रोत में अधूरी दिखाई देने वाली जन्म-संबंधी अभिव्यक्ति को दर्ज करना।
lexical_decisions:
- source_word: እዮቤልው
  choice: जुबली-वर्ष
  rationale: पुस्तक की विशिष्ट काल-इकाई को नाम के रूप में बनाए रखते हुए ‘वर्ष’ जोड़ा गया, ताकि आधुनिक हिन्दी पाठक इसे उत्सव मात्र न समझे।
- source_word: አርፋክስድ
  choice: अर्पक्षद
  rationale: बाइबलीय नाम का प्रचलित हिन्दी रूप अपनाया गया।
- source_word: ራሱእያ
  choice: रासूएया
  rationale: गीज़ नाम के अक्षरक्रम और स्वर-विभाजन के निकट देवनागरी लिप्यंतरण।
- source_word: ወለተ፡ ሱሳን፡ ወለተ፡ ኤላም
  choice: सूसान की बेटी थी, जो एलाम की बेटी थी
  rationale: दोनों स्त्रीलिंग ‘बेटी’ संबंधों को स्पष्ट रखा गया और वंश-संबंध को ‘नातिन’ कहकर अनावश्यक रूप से संकुचित नहीं किया गया।
- source_word: ወወለደት፡ ሎቱ
  choice: और उससे अर्पक्षद की संतान हुई
  rationale: शाब्दिक ‘उसने उसके लिए जन्म दिया’ हिन्दी में अधूरा और अस्वाभाविक लगता है; अगले पद में आने वाले कर्म को पहले से ‘पुत्र’ कहे बिना आशय सुरक्षित रखा गया।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कालक्रम की तकनीकी भाषा को संक्षिप्त रखा गया है; नामों को देवनागरी में स्रोत के निकट रूप दिया गया है। अंतिम वाक्य को स्वाभाविक हिन्दी बनाया गया है, पर अगले पद से ‘पुत्र’ शब्द यहाँ आयात नहीं किया गया।
