translation:
  language: hi
  text: राफा। फिर वह उत्तर की ओर उतरती हुई तीना नदी के तट तक जाती है।[a] यह भाग चिट्ठी डालने पर निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दिशा बताने वाले शब्द का पाठ अनिश्चित है; संभवतः अर्थ ‘उत्तर की ओर’ है। एक अन्य सम्भव अनुवाद है: ‘फिर वह किनारे के साथ उतरती हुई तीना नदी की ओर जाती है।’'
    reason: गीज़ पाठ ለመጻእ कठिन अथवा विकृत प्रतीत होता है; प्रस्तावित पाठ-सुधार से ‘उत्तर की ओर’ अर्थ निकलता है, जबकि प्राप्त पाठ और መንገበ፡ ጽንፉ का अधिक शाब्दिक निर्वचन अलग हो सकता है।
