- source_word: ወይወርድ
  choice: फिर वह … उतरती हुई … जाती है
  rationale: क्रिया का मूल अर्थ ‘और वह उतरती है’ है; हिन्दी में सीमा-रेखा के वर्णन को स्वाभाविक बनाने के लिए गति का भाव इस रूप में व्यक्त किया गया है।
- source_word: ጢና፡ ፈለገ
  choice: तीना नदी
  rationale: ጢና को स्थान-नाम ‘तीना’ और ፈለገ को ‘नदी’ माना गया है।
- source_word: ዛቲ፡ መክፈልት
  choice: यह भाग
  rationale: भूमि के बाँटे गए हिस्से के लिए सरल और सटीक आधुनिक हिन्दी।
- source_word: ወፅአት፡ በዕፁ
  choice: चिट्ठी डालने पर निकला
