translation:
  language: hi
  text: और जो कोई लहू खाता है या पृथ्वी पर मनुष्य का लहू बहाता है, वह नहीं बचेगा; और आकाश के नीचे उसका न तो वंश रहेगा, न कोई संतान।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደም
  choice: लहू
  rationale: स्रोत में बार-बार आने वाले ‘रक्त/लहू’ के ठोस अर्थ को बनाए रखते हुए शास्त्रीय गरिमा के लिए ‘लहू’ चुना गया।
- source_word: ዘርእ
  choice: वंश
  rationale: मूल शब्द का शाब्दिक अर्थ ‘बीज’ है, पर इस प्रसंग में वह जीवित वंश-परंपरा को सूचित करता है; इसलिए मुख्य पाठ में स्वाभाविक ‘वंश’ रखा गया।
- source_word: ይኃፅት
  choice: संतान
  rationale: संदर्भ में किसी व्यक्ति के बाद बचे हुए वंशज का भाव है; ‘संतान’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: በታሕተ፡ ሰማየ
  choice: आकाश के नीचे
  rationale: स्थानसूचक मूल अभिव्यक्ति का निकट और सहज हिन्दी रूप।
theological_decisions:
- issue: लहू खाने और मानव-रक्त बहाने पर न्याय की समानांतर घोषणा
  choice: दोनों कर्मों को समान व्याकरणिक स्तर पर रखा गया
  alternative: मानव-रक्त बहाने को केवल लहू खाने की व्याख्या मानना
  rationale: गीज़ पाठ दोनों को समन्वयी पदों के रूप में प्रस्तुत करता है; अनुवाद ने इस तनाव को बिना घटाए बनाए रखा।
- issue: वंश के पूर्ण अंत की भाषा
  choice: ‘न तो वंश रहेगा, न कोई संतान’
  alternative: ‘उसका कोई उत्तराधिकारी नहीं रहेगा’
  rationale: मूल में दो निकटार्थी पद हैं; दोनों को अलग-अलग रखकर कथन की तीव्रता और पुनरुक्ति संरक्षित की गई।
