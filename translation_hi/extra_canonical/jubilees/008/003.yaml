base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/003.yaml
  text: And his father taught him writing. And he went to seek for himself a place where he might seize a city for himself. And he found a writing which the ancients had cut on a rock, and he read what was in it. And he copied it, and he found from what was in it that there was in it the teaching of the Watchers, by which they used to observe the omens of the sun.
translation:
  language: hi
  text: उसके पिता ने उसे लिखना सिखाया। वह अपने लिए ऐसी जगह खोजने निकला जहाँ वह एक नगर पर अधिकार कर सके। उसे एक लेख मिला, जिसे प्राचीन लोगों ने चट्टान पर खोदा था। उसने उसमें लिखी बातें पढ़ीं और उनकी नकल उतार ली। उसमें लिखी बातों से उसे पता चला कि उसमें पहरेदारों की शिक्षा थी, जिसके द्वारा वे सूर्य के शकुनों का निरीक्षण किया करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፈ
  choice: लिखना / लेख
  rationale: पहले प्रयोग में पिता द्वारा सिखाए गए कौशल के लिए ‘लिखना’ स्वाभाविक है; दूसरे प्रयोग में चट्टान पर अंकित सामग्री के लिए ‘लेख’ उपयुक्त है।
- source_word: ይእኅዝ፡ ሎቱ፡ ሀገረ
  choice: अपने लिए एक नगर पर अधिकार कर सके
  rationale: क्रिया में पकड़ने, धारण करने या अधिकार करने का भाव है; अनावश्यक रूप से ‘नगर बसाने’ का अर्थ नहीं जोड़ा गया।
- source_word: ወአዕለዎ
  choice: उनकी नकल उतार ली
  rationale: यहाँ क्रिया प्रतिलिपि बनाने का संकेत देती है, केवल समझने का नहीं। बहुवचन ‘उनकी’ निकटवर्ती ‘लिखी बातें’ को संदर्भित करता है।
- source_word: ትጉሃን
  choice: पहरेदारों
  rationale: यह उन अलौकिक ‘Watchers’ के लिए प्रचलित और अर्थ-संगत पद है; सामान्य मानवीय चौकीदार का अर्थ अभिप्रेत नहीं किया गया।
- source_word: ሰገለ፡ ፀሓይ
  choice: सूर्य के शकुनों
  rationale: पद सूर्य से जुड़े शकुनों या पूर्वसूचक चिह्नों को सूचित करता है; ‘शकुन’ प्राचीन ज्योतिषीय संदर्भ को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: ‘पहरेदारों’ की पहचान
  choice: पाठ में केवल ‘पहरेदारों’ कहा गया
  alternative: उन्हें स्पष्ट रूप से स्वर्गदूत या पतित स्वर्गदूत कहना
  rationale: स्रोत इस पद पर उनकी प्रकृति को विस्तार से परिभाषित नहीं करता; इसलिए अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ी गई।
- issue: सूर्य संबंधी क्रिया का अर्थ
  choice: शकुनों का निरीक्षण किया करते थे
  alternative: सूर्य के चिह्न बनाते थे
  rationale: संदर्भ प्राचीन शकुन-विद्या की ओर संकेत करता है, पर वाक्य को किसी विशिष्ट ज्योतिषीय प्रणाली से नहीं बाँधा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली रखी गई है। स्रोत में अनुपस्थित ‘और वह लड़का बड़ा हुआ’ नहीं जोड़ा गया। ‘समझ लिया’ के बजाय प्रतिलिपि बनाने की क्रिया स्पष्ट की गई है।
