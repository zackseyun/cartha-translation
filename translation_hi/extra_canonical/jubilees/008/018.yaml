  text: For Shem and for his sons to possess it forever, for his generations forever. And Noah rejoiced because this portion came forth for Shem and for his sons, and he remembered all that he had spoken with his mouth in prophecy, for he said, “Blessed be the Lord God of Shem, and may he dwell...
translation:
  language: hi
  text: शेम और उसके पुत्रों के लिए, कि वे उस पर सदा के लिए, उसकी पीढ़ियों के लिए सदा तक, अधिकार रखें। नूह आनन्दित हुआ, क्योंकि यह भाग शेम और उसके पुत्रों के लिए निकला था। नूह को वह सब स्मरण आया जो उसने भविष्यवाणी में अपने मुख से कहा था; क्योंकि उसने कहा था, “धन्य हो प्रभु, शेम का परमेश्वर, और वह निवास करे…”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለእኂዞታ
  choice: ताकि वे … उस पर अधिकार रखें
  rationale: यह उद्देश्यसूचक क्रियारूप सर्वनामिक प्रत्यय के साथ ‘उसे/उस पर अधिकार रखना’ व्यक्त करता है। बहुवचन कर्ता ‘शेम और उसके पुत्र’ को हिन्दी में स्पष्ट किया गया है।
- source_word: መክፈልት
  choice: भाग
  rationale: भूमि-विभाजन में मिले हिस्से या आबंटन के लिए सहज और संदर्भानुकूल हिन्दी शब्द।
- source_word: በትንቢት
  choice: भविष्यवाणी करते हुए
  rationale: स्रोत में नूह के मुख से भविष्यसूचक वचन कहे जाने का भाव है; क्रियाविशेषणीय हिन्दी इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: እግዚአብሔር አምላኩ ለሴም
  choice: शेम का परमेश्वर प्रभु
  rationale: शब्दक्रम को स्वाभाविक हिन्दी में रखते हुए ‘प्रभु’ और ‘परमेश्वर’ दोनों पद सुरक्षित रखे गए हैं।
- source_word: ወይኅድር
  choice: और वह निवास करे
  rationale: तीसरे पुरुष एकवचन की संभावनार्थक क्रिया को बिना कर्ता की पहचान निश्चित किए अनूदित किया गया है; उपलब्ध स्रोत यहीं अधूरा समाप्त होता है।
theological_decisions:
- issue: ‘वह निवास करे’ में सर्वनाम का संदर्भ
  choice: अस्पष्ट सर्वनाम ‘वह’ को बनाए रखा
  alternative: कर्ता को ‘परमेश्वर’ या किसी अन्य पात्र के रूप में स्पष्ट करना
  rationale: गीज़ पाठ केवल तीसरे पुरुष एकवचन क्रिया देता है और उद्धरण उपलब्ध अंश में अधूरा है; किसी कर्ता को जोड़ना स्रोत की वास्तविक अस्पष्टता को अनुचित रूप से सुलझा देता।
- issue: ‘शेम का परमेश्वर प्रभु’ में आशीर्वाद का पात्र
  choice: आशीर्वाद प्रभु परमेश्वर पर केंद्रित रखा
  alternative: शेम को सीधे धन्य कहना
  rationale: स्रोत का व्याकरण ‘प्रभु, शेम का परमेश्वर’ को ‘धन्य’ कहता है, इसलिए शेम को प्रत्यक्ष आशीर्वाद का पात्र नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। आरम्भिक आश्रित वाक्यांश को पिछले भौगोलिक संदर्भ से जुड़े रहने योग्य रखा गया है। स्रोत के बीच वाक्य में समाप्त होने को दीर्घविराम से दिखाया गया है; अनुपलब्ध आगे का पाठ पूरा नहीं किया गया।
