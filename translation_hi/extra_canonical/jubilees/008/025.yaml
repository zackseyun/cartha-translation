base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/025.yaml
  text: The thoughts and desire of man imagine vanity and evil continually, and the Lord destroyed everything from the face of the earth because of their evil deeds and because of blood.
translation:
  language: hi
  text: मनुष्य के मन और उसकी इच्छा हर समय निरर्थक और बुरी बातों की कल्पना करते रहते थे; और प्रभु ने उनके बुरे कामों और रक्त के कारण पृथ्वी के मुख पर से सब कुछ मिटा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: मनुष्य का मन और उसकी अभिलाषा
  rationale: यह पदबंध मनुष्य के आंतरिक विचार और इच्छा—दोनों—को व्यक्त करता है। ‘अभिलाषा’ यहाँ इच्छा या चाह का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है।
- source_word: ይኄሊ፡ ከንተ፡ ወእኩየ
  choice: व्यर्थता और बुराई की ही कल्पना करते रहते हैं
  rationale: क्रिया ይኄሊ को ‘कल्पना करते’ तथा ከንተ को ‘व्यर्थता’ कहने से स्रोत में उपस्थित सोचने/कल्पना करने की क्रिया और व्यर्थता—दोनों सुरक्षित रहते हैं; केवल ‘बुरे थे’ कहना इन्हें खो देता। ‘ही’ वाक्य के निरंतर नकारात्मक झुकाव को स्वाभाविक हिन्दी में उभारता है।
- source_word: በኵሉ፡ መዋዕል
  choice: हर समय
  rationale: शाब्दिक भाव ‘सभी दिनों’ है; प्रसंग में इसका मुहावरेदार अर्थ निरंतरता है।
- source_word: ወደምሰሰ
  choice: मिटा दिया
  rationale: विनाश या पूरी तरह हटा देने के अर्थ को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: በእንተ፡ ደም
  choice: रक्तपात
  rationale: स्रोत का शाब्दिक रूप ‘रक्त/लहू के कारण’ है; इस दंड-संदर्भ में ‘रक्तपात’ अभिप्रेत हिंसक रक्त बहाने को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: मानवीय बुराई का स्वरूप
  choice: मन और अभिलाषा व्यर्थता और बुराई की कल्पना करते रहते हैं
  alternative: मनुष्य के विचार और इच्छा निरन्तर बुरे थे
  rationale: चुना हुआ रूप स्रोत में उपस्थित क्रिया ይኄሊ और संज्ञा ከንተ को बनाए रखता है; वैकल्पिक रूप अर्थ को सामान्यीकृत करके इन दोनों तत्वों को मिटा देता है।
- issue: 'विनाश का कारण: ‘रक्त’'
  choice: रक्तपात
  alternative: लहू
  rationale: ‘रक्तपात’ प्रसंगगत अर्थ देता है, पर शाब्दिक ‘लहू’ को पादटिप्पणी में रखने से स्रोत की संक्षिप्त अभिव्यक्ति छिपती नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘पृथ्वी के मुख पर से’ स्रोत की प्राचीन चित्रात्मक अभिव्यक्ति को बनाए रखता है। संयुक्त कर्ता के साथ बहुवचन क्रिया हिन्दी की स्वाभाविक व्याकरणिक संरचना के अनुसार है।
