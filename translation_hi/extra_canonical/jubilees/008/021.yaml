base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/021.yaml
  text: 'and the Lord forever. And he knew that a blessed portion and a blessing had come to Shem and to his sons for the generations of eternity: all the land of Edom, and all the land of the Red Sea, and all the land of the east and India, and on the Red Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the south, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea, beyond the mountains of Asshur toward the north.'
translation:
  language: hi
  text: और प्रभु सदा तक। तब उसने जान लिया कि शेम और उसके वंशजों को सदा की पीढ़ियों के लिए आशीष का भाग और आशीष मिली है:[a] एदोम का सारा देश, लाल सागर का सारा प्रदेश, पूरब का सारा देश और भारत, लाल सागर के तटवर्ती प्रदेश और उसके पहाड़, बाशान का सारा देश, लबानोन का सारा देश और कफ्तोर के द्वीप, सनीर और अमाना के सभी पहाड़, दक्षिण में अश्शूर के पहाड़, एलाम, अश्शूर और बाबेल का सारा देश, सूसा और मादी, अरारात के सभी पहाड़, और समुद्र पार का वह सारा प्रदेश जो अश्शूर के पहाड़ों के पार उत्तर की ओर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आशीष का एक भाग और एक आशीष।”
    reason: मूल पदबंध की पुनरुक्ति और व्याकरणिक बनावट को स्पष्ट करना।
lexical_decisions:
- source_word: መክፈልተ፡ በረከት፡ ወቡራኬ
  choice: आशीष का भाग और आशीष
  rationale: पदबंध में ‘भाग’, ‘आशीष’ और संयोजक के बाद पुनः ‘आशीष’ स्पष्ट हैं; ‘विस्तृत’ अर्थ को मूल पाठ का आधार नहीं मिलता।
- source_word: ባሕረ፡ ኤርትራ
  choice: लाल सागर
  rationale: यह पारंपरिक भौगोलिक नाम ‘एरिथ्राई सागर’ है, जिसे सामान्य आधुनिक हिन्दी में ‘लाल सागर’ कहा जाता है।
- source_word: ጽባሕ፡ ወህንደኬ
  choice: पूरब का सारा देश और भारत
  rationale: ጽባሕ को पूर्व/सूर्योदय की दिशा और ህንደኬ को भारत-संबंधी स्थाननाम के रूप में प्रस्तुत किया गया है।
- source_word: ደሰያት ከፍቸር
  choice: कफ्तोर के द्वीप
  rationale: स्थाननाम को ध्वन्यात्मक रूप में रखा गया और बहुवचन ‘द्वीप’ सुरक्षित रखा गया।
- source_word: ማዕዳይ
  choice: मादी
  rationale: यह मादी/मीडिया प्रदेश का स्थाननाम है; बाइबिलीय हिन्दी में परिचित ‘मादी’ चुना गया।
theological_decisions:
- issue: शेम को प्राप्त भाग की प्रकृति
  choice: ‘आशीष का भाग और आशीष’—दोनों संज्ञाओं को बनाए रखा
  alternative: ‘आशीषित और विस्तृत भाग’
  rationale: मूल गीइज़ दो आशीष-संबंधी पदों को जोड़ता है; किसी कथित ‘विस्तार’ को जोड़ना पाठगत तनाव को अनुचित रूप से हल करता।
- issue: पद के आरंभ का खंडित वाक्यांश
  choice: ‘और प्रभु सदा तक।’ को इसी पद में रखा
  alternative: इसे पिछले पद में मिला देना या छोड़ देना
  rationale: यह वाक्यांश उपलब्ध स्रोत-खंड में स्पष्ट रूप से उपस्थित है और संभवतः पिछले वाक्य का समापन है; पद-सीमा की असहजता को मिटाए बिना पाठ सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। स्थाननामों में प्रचलित बाइबिलीय रूप रखे गए हैं। आरंभिक वाक्यखंड की स्रोतगत असहजता तथा क्षेत्र-सूची की संचयी शैली को जानबूझकर सुरक्षित रखा गया है।
