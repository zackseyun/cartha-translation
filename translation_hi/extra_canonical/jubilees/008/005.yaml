base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/005.yaml
  text: For he was afraid to tell Noah about it, lest he be angry with him because of it. And in the fifth jubilee, in the first week, in the first year, he took a wife, and her name was Melka, the daughter of Madai, the son of Japheth; and in the fourth year of it he fathered a son, and he called his name Salah.
translation:
  language: hi
  text: क्योंकि वह नूह को इसके विषय में बताने से डरता था कि कहीं नूह इसके कारण उस पर क्रोधित न हो जाए। फिर पाँचवीं जुबली के पहले सप्ताह के पहले वर्ष में उसने अपने लिए एक पत्नी ली। उसका नाम मेलका था; वह मादै की बेटी और येपेत की पोती थी। उसी सप्ताह के चौथे वर्ष में उसने एक पुत्र उत्पन्न किया[a] और उसका नाम सालह रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में क्रिया पुल्लिंग एकवचन है, अर्थात् ‘उसने पुत्र उत्पन्न किया’; कुछ अनुवाद इसे ‘उसकी पत्नी ने उसके लिए एक पुत्र जना’ के रूप में देते हैं।
    reason: पूर्ववर्ती अनुवाद-परंपरा में स्त्री को कर्ता मानने वाला पाठ मिलता है, किंतु गीज़ क्रिया पुरुष को कर्ता बताती है।
lexical_decisions:
- source_word: ኢዮቤልው
  choice: जुबली-वर्षचक्र
  rationale: यह पद कालगणना की एक जुबली इकाई का उल्लेख करता है; ‘वर्षचक्र’ जोड़ने से आधुनिक पाठक को अर्थ स्पष्ट होता है, जबकि पारंपरिक नाम भी बना रहता है।
- source_word: በሱባዔ
  choice: सप्ताह
  rationale: जुबली की कालगणना में यह सात वर्षों के सप्ताह को दर्शाता है; संदर्भ में ‘उसी सप्ताह’ से बाद का ሎቱ भी स्पष्ट किया गया है।
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: उसने अपने लिए एक पत्नी ली
  rationale: गीज़ पदबंध का स्वाभाविक और निकट हिंदी रूप, विवाह करने के अर्थ में।
- source_word: ወልደ / ወሊደ
  choice: उसने एक पुत्र उत्पन्न किया
  rationale: क्रिया पुल्लिंग एकवचन है और पूर्ववर्ती पुरुष को कर्ता बनाए रखती है; इसलिए मुख्य पाठ में ‘उसकी पत्नी ने जना’ नहीं किया गया।
- source_word: ሳላ
  choice: शेलह
  rationale: नाम को प्रचलित बाइबलीय हिंदी रूप के निकट रखा गया है।
theological_decisions:
- issue: नूह के क्रोध की आशंका
  choice: कहीं नूह इसके कारण उस पर क्रोधित न हो जाए
  alternative: कहीं वह इसके कारण उस पर क्रोधित न हो जाए
  rationale: मूल में सर्वनाम है, पर हिंदी में लगातार सर्वनामों से संदर्भ अस्पष्ट हो सकता है; ‘नूह’ दोहराने से अर्थ स्पष्ट होता है, कोई धर्मवैचारिक निष्कर्ष नहीं जोड़ा जाता।
- issue: वंश-संबंध की अभिव्यक्ति
  choice: मादै की बेटी और येपेत की पोती
  alternative: येपेत के पुत्र मादै की बेटी
  rationale: दोनों मूल वंशावली को समान रूप से व्यक्त करते हैं; मुख्य रूप साधारण हिंदी पाठक के लिए अधिक सहज है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जुबली-वर्षचक्र’ तकनीकी कालगणना को समझने योग्य बनाता है। सभी नाम देवनागरी में हैं और वंशावली को स्वाभाविक हिंदी संबंधों में व्यक्त किया गया है।
