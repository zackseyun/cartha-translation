base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/020.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee and the seventh week, Noah began to command the ordinances and the commandments to the children of his sons, and all that he knew of justice; and he testified to his sons that they should do righteousness and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication,
translation:
  language: hi
  text: ये नूह के पुत्र हैं।[a] अट्ठाईसवीं जुबली के सातवें सप्ताह में,[b] नूह ने अपने पुत्रों की संतानों को विधि-विधान और आज्ञाओं का, तथा न्याय के विषय में वह सब जो वह जानता था, आदेश देना आरम्भ किया। उसने अपने पुत्रों को समझाया कि वे धार्मिकता करें, अपने शरीर की नग्नता ढकें, अपने सृष्टिकर्ता को धन्य कहें, पिता और माता का आदर करें, एक-दूसरे से प्रेम करें, और अपने प्राणों को यौन अनैतिकता से बचाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस कठिन वाक्य-रचना का एक सम्भव पाठ है: “नूह के पुत्र, अट्ठाईसवीं जुबली के सातवें सप्ताह में, जब नूह अपने पुत्रों की संतानों को विधि-विधान और आज्ञाओं का तथा न्याय के विषय में वह सब जो वह जानता था, आदेश दे रहा था, तब उसने अपने पुत्रों को समझाया…”'
    reason: गीज़ पाठ के आरम्भिक पद और እንዘ (‘जब/जबकि’) के कारण वैकल्पिक वाक्य-संबंध सम्भव है।
  - marker: b
    text: ‘जुबली’ उनचास वर्षों की अवधि है; ‘सातवाँ सप्ताह’ उस जुबली के सात वर्षों वाले सातवें खंड को दर्शाता है।
    reason: प्राचीन काल-गणना को आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ
  choice: विधि-विधान और आज्ञाएँ
  rationale: दोनों निकटवर्ती किन्तु अलग विधिक शब्दों का भेद बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी दी गई है।
- source_word: ፍትሐ
  choice: न्याय
  rationale: यहाँ न्याय, उचित व्यवस्था या न्यायपूर्ण आचरण का व्यापक भाव है; ‘न्याय’ स्रोत की अर्थ-सीमा को खुला रखता है।
- source_word: ጽድቀ
  choice: धार्मिकता के काम
  rationale: स्रोत के धार्मिक-नैतिक ‘righteousness’ को केवल कानूनी न्याय तक सीमित किए बिना व्यवहारगत रूप में व्यक्त करता है।
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: अपने शरीर की नग्नता
  rationale: शाब्दिक अर्थ ‘अपने मांस/शरीर की लज्जा’ है; आधुनिक हिन्दी में आशय नग्न अंगों को ढकने का है।
- source_word: ዝሙት
  choice: यौन अनैतिकता
  rationale: यह शब्द व्यभिचार से व्यापक अवैध यौन आचरण सूचित कर सकता है; इसलिए अर्थ को केवल परस्त्रीगमन तक सीमित नहीं किया गया।
theological_decisions:
- issue: आरम्भिक वाक्य और እንዘ की वाक्य-रचना
  choice: ‘ये नूह के पुत्र हैं’ को स्वतंत्र वाक्य मानकर, प्रसंगानुसार ‘बताना आरम्भ किया’ से अगला वाक्य पूर्ण किया गया।
  alternative: ‘नूह के पुत्र... जब नूह... बता रहा था...’ के रूप में आश्रित उपवाक्य, जिसका मुख्य क्रिया-पद ‘उसने समझाया’ हो।
  rationale: पांडुलिपि-पाठ की वाक्य-रचना कठिन है। मुख्य पाठ अर्थपूर्ण और व्याकरणसम्मत पाठ देता है, जबकि वैकल्पिक विश्लेषण पादटिप्पणी में सुरक्षित है।
- issue: ‘अपने प्राणों को’ बचाने का अर्थ
  choice: नैतिक आत्म-संरक्षण के स्रोत-रूपक को बनाए रखा गया।
  alternative: ‘अपने आपको यौन अनैतिकता से बचाएँ।’
  rationale: ‘प्राणों’ स्रोत के ነፍሶሙ का अधिक औपचारिक अनुरूप है और मनुष्य के समग्र नैतिक जीवन का भाव रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जुबली’ को ग्रंथ की विशिष्ट काल-गणना के तकनीकी पद के रूप में रखा गया और पादटिप्पणी में समझाया गया है। आदेशों की क्रमिक संरचना तथा स्रोत में उपस्थित नैतिक-धार्मिक तनाव को बिना सांप्रदायिक विस्तार के सुरक्षित रखा गया है।
