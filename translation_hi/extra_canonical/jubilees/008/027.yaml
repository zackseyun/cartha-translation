base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/027.yaml
  text: For I see, and behold, the demons have begun to lead you and your children astray. And now I fear for you, that after my death you will shed human blood upon the earth, and you too will be destroyed from the face of the earth.
translation:
  language: hi
  text: क्योंकि मैं देख रहा हूँ—और देखो, दुष्टात्माएँ तुम्हें और तुम्हारी सन्तान को बहकाने लगी हैं। अब मुझे तुम्हारे लिए डर है कि मेरी मृत्यु के बाद तुम पृथ्वी पर मनुष्य का लहू बहाओगे, और तुम भी पृथ्वी पर से मिटा दिए जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጋንንት
  choice: दुष्टात्माएँ
  rationale: यह बहुवचन संज्ञा दुष्ट अलौकिक आत्माओं को दर्शाती है; आधुनिक हिन्दी में ‘दुष्टात्माएँ’ सामान्य पाठक के लिए ‘दानवों’ की अपेक्षा अधिक स्पष्ट है।
- source_word: አበሱተ ወጠኑ
  choice: बहकाने लगी हैं
  rationale: यह आरम्भ हो चुकी भ्रामक या भ्रष्ट करने वाली क्रिया को व्यक्त करता है; ‘लगी हैं’ आरम्भ के पक्ष को बनाए रखता है।
- source_word: ደመ ሰብእ
  choice: मनुष्य का लहू
  rationale: शाब्दिक अर्थ ‘मानव-रक्त’ है; ‘मनुष्य का लहू’ प्रसंग की गंभीरता और बाइबिलीय गरिमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: እምገጸ ምድር
  choice: पृथ्वी पर से
  rationale: शाब्दिक बिंब ‘पृथ्वी के मुख पर से’ है; हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करने के लिए ‘पृथ्वी पर से’ चुना गया है।
theological_decisions:
- issue: दुष्टात्माओं की क्रिया का स्वरूप
  choice: बहकाने
  alternative: भ्रष्ट करने / पाप में फँसाने
  rationale: स्रोत में उनके प्रभाव का लक्ष्य स्पष्ट है, पर उसका सटीक ढंग विस्तार से नहीं बताया गया; ‘बहकाने’ इस अर्थगत खुलापन को बनाए रखता है।
- issue: आगामी विनाश की वाच्य-रचना
  choice: मिटा दिए जाओगे
  alternative: मिट जाओगे
  rationale: स्रोत का रूप विनाश का परिणाम बताता है और कर्ता को नामित नहीं करता; कर्मवाच्य अनकहे न्यायकर्ता को जबरन स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘और देखो’ स्रोत के ध्यानाकर्षक पद को बनाए रखता है; किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
