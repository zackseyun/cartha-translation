    ክብርክሙ፡ በቅድመ፡ አምላክየ፡" ዘአድኀነኒ፡" እምነ፡ ማየ፡ አይኅ። ወናሁ፡ አንትሙ፡ ተሐውሩ፡ ወተሐንጹ፡ ለክሙ፡" አህጉረ፡ ወትተክሉ፡ 35 ውስቴተን፡ ኵሎ፡" ተክለ፡" ዘዲበ፡ ምድር፡ ወኵሎኬ፡ ዕፀ፡" ዘይፈሪ። ሠለስተ፡" ዓመተ፡ ይከውን፡ 36 ፍሬሁ፡ ዘኢይትቀሠም፡" እምኵሉ፡ ዘይትበላዕ፡" ወበዓመት፡ ራብዕ፡" ይትቄስም፡" ፍሬሁ፡ *ወያዐርግ፡ ቀዳሜ፡ ፍሬ፡" ዘይሠጠው፡ ቅድመ፡ እግዚአብሔር፡ ልዑል፡ *ዘፈጠረ፡ ሰማየ፡" ወምድር፡ ወኵሉ፡ ከመ፡ ያዕርጉ፡ በኵል፡ ቀዳሚ፡ ወይኑ፡ ወቅብአ፡ ቀዳሚ፡ ፍሬ፡ ውስተ፡ ምሥዋዐ፡ እግዚአብሔር፡ ዘይትወከፍ፡ ወዘተርፈ፡ ይብልዑ፡ ባእዛኒ፡ ቤተ፡ እግዚአብሔር፡'
