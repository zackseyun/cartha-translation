translation:
  language: hi
  text: तुम धार्मिकता और खराई में धर्मी बनो, और तुम्हारे लगाए हुए सभी पौधे पनपें। क्योंकि जैसा हनोक ने—जो तुम्हारे पिता का पिता था—अपने पुत्र मतूशेलह को आदेश दिया था, और मतूशेलह ने अपने पुत्र लेमेक को, और लेमेक ने…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: यह नैतिक रूप से सही और धर्ममय आचरण का स्वाभाविक हिन्दी रूप है और आगे आने वाले उसी धातु-सम्बन्धी विचार को बनाए रखता है।
- source_word: ርትዕ
  choice: खराई
  rationale: इसका मूल भाव सीधापन, निष्कपटता और सही आचरण है; ‘खराई’ आधुनिक हिन्दी में इस नैतिक अर्थ को सहज रूप से व्यक्त करती है।
- source_word: ትጸድቁ
  choice: तुम धर्मी रहोगे
  rationale: सम्बोधित बहुवचन और भावी परिणाम को बनाए रखते हुए धार्मिकता/धर्मी की स्रोत-पुनरुक्ति भी सुरक्षित रखी गई है।
- source_word: ይረተው
  choice: फलेंगे-फूलेंगे
  rationale: रोपे हुए पौधों के सफल होने और समृद्ध बढ़ने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: ተክሊክሙ
  choice: तुम्हारे लगाए हुए सभी पौधे
  rationale: ‘तुम्हारे समस्त रोपण’ के ठोस कृषि-बिम्ब को सामान्य पाठक के लिए स्पष्ट रखा गया है।
- source_word: አቡሁ፡ ለአቡክሙ
  choice: जो तुम्हारे पिता का पिता था
  rationale: गीज़ की स्पष्ट संबंध-संरचना को ‘तुम्हारे पिता मतूशेलह’ में मिलाए बिना ज्यों का त्यों व्यक्त करता है।
theological_decisions:
- issue: धर्मी आचरण और उसके परिणाम के बीच संबंध
  choice: ‘धार्मिकता और खराई से जीवन बिताओ; तब तुम धर्मी रहोगे’
  alternative: ‘धार्मिकता और खराई में धर्मी बनो’
  rationale: स्रोत में आदेश/आह्वान और उसके बाद आने वाले भावी कथन का तनाव तथा जानबूझकर की गई पुनरुक्ति दोनों बनाए रखे गए हैं; इसे किसी विशिष्ट सिद्धान्तगत अर्थ में नहीं बदला गया।
- issue: हनोक से लेमेक तक आदेश का वंशानुगत संचार
  choice: हर व्यक्ति को उसके पुत्र के साथ स्पष्ट रूप से जोड़ना
  alternative: ‘हनोक ने तुम्हारे पिता मतूशेलह को आदेश दिया’
  rationale: वैकल्पिक रूप हनोक के ‘तुम्हारे पिता का पिता’ होने और मतूशेलह के ‘उसके पुत्र’ होने—दोनों स्पष्ट स्रोत-सूचनाओं को मिला देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत जिस स्थान पर अधूरा समाप्त होता है, वहाँ दीर्घविराम द्वारा अपूर्ण वाक्य सुरक्षित रखा गया है।
