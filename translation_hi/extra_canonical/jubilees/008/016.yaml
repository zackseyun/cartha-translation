  text: और वह इस नदी की सीमा की ओर जाता है और पूर्व की ओर बढ़ता है, जब तक कि वह अदन के बाग के निकट—बाग के उत्तर की ओर, उत्तर में—पहुँच जाता है। फिर वह अदन की सारी भूमि के पूर्व से समूचे पूर्व की ओर जाता है। वह पूर्व के भीतर मुड़ता है और आगे बढ़ता है, जब तक कि उस पर्वत के पूर्वी भाग के निकट पहुँच जाता है, जिसका नाम है—
