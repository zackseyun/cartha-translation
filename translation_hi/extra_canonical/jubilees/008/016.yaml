lexical_decisions:
- source_word: መንገበ
  choice: की ओर / ओर
  rationale: यहाँ दिशा बताने वाला पद है; इसे ‘मार्ग’ कहना स्रोत के अर्थ को अनुचित रूप से ठोस बना देगा।
- source_word: ድንጋጉ፡ ለዝ፡ ፈለግ
  choice: इस नदी की सीमा
  rationale: ድንጋጉ को स्वत्वसूचक रूप में ‘उसकी/इसकी सीमा’ और ለዝ፡ ፈለግ को ‘इस नदी की’ समझा गया है; इसे ‘दुंगागु’ नाम नहीं माना गया।
- source_word: ጽባሕ
  choice: पूर्व
  rationale: भौगोलिक दिशा के बार-बार आने वाले उल्लेख को एकरूप रखते हुए ‘पूर्व’ किया गया है।
- source_word: ገነት፡ ዘኤዶም
  choice: अदन का बाग
  rationale: परंपरागत और सामान्य हिंदी बाइबलीय नामावली के अनुसार, अर्थ को सहज रखते हुए।
- source_word: ውስተ፡ ጽባሕ
  choice: पूर्व के भीतर
  rationale: स्रोत की असामान्य स्थान-संबंधी अभिव्यक्ति को अधिक स्पष्ट अर्थ में बदलने के बजाय यथासंभव सुरक्षित रखा गया है।
- source_word: መንገበ፡ ጽባሒሁ፡ ለደብር
  choice: उस पर्वत के पूर्वी भाग के निकट
  rationale: पर्वत की पूर्व दिशा/पूर्वी ओर का संकेत है, केवल ‘पूर्व की ओर पर्वत तक’ नहीं।
