base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/033.yaml
  text: 'and they begot sons: the Naphidim. And they were all unlike one another, and they devoured one another; and the giant killed the Naphil, and the Naphil killed the Elyo, and the Elyo humankind, and one man another.'
translation:
  language: hi
  text: और उन्होंने पुत्र उत्पन्न किए—नफीदीम[a]। वे सब एक-दूसरे से भिन्न थे और एक-दूसरे को निगल जाते थे। दैत्य ने नाफील को मार डाला, नाफील ने एलयो को, एलयो ने मनुष्यों को, और एक मनुष्य ने दूसरे मनुष्य को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नफीदीम,” “नाफील” और “एलयो” स्रोत-परंपरा में आए अस्पष्ट नाम हैं; यहाँ उनकी पहचान निश्चित किए बिना उनका लिप्यंतरण किया गया है।
    reason: अपरिचित नामों को किसी प्रसिद्ध बाइबलीय वर्ग के साथ अनुचित रूप से समान ठहराने से बचाना।
lexical_decisions:
- source_word: Naphidim
  choice: नफीदीम
  rationale: इसे किसी परिचित बाइबलीय जाति या प्राणी-वर्ग के साथ निश्चित रूप से समान ठहराने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: Naphil
  choice: नाफील
  rationale: पाठ में क्रमबद्ध प्राणी-वर्ग के नाम के रूप में आया है; अर्थ आरोपित न करके ध्वन्यात्मक रूप रखा गया है।
- source_word: Elyo
  choice: एलयो
  rationale: स्रोत-परंपरा के अस्पष्ट नाम को व्याख्यात्मक रूप देने के बजाय लिप्यंतरित किया गया है।
- source_word: giant
  choice: दैत्य
  rationale: आधुनिक हिन्दी में असाधारण आकार और सामर्थ्य वाले प्राणी के लिए स्वाभाविक तथा गरिमापूर्ण शब्द।
- source_word: devoured one another
  choice: एक-दूसरे को निगल जाते थे
  rationale: हिंसा और भक्षण की तीव्रता को बनाए रखते हुए मुहावरे को नरम नहीं किया गया।
- source_word: one man another
  choice: मनुष्य ने अपने साथी मनुष्य को
  rationale: पारस्परिक मानवीय हिंसा को स्पष्ट किया गया, पर स्रोत से बाहर कोई कारण या नैतिक व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: नफीदीम, नाफील और एलयो की पहचान
  choice: तीनों को विशिष्ट नामों के रूप में लिप्यंतरित किया गया।
  alternative: उन्हें नेफिलिम, दैत्य, या किसी निश्चित दानवी वर्ग के रूप में व्याख्यायित करना।
  rationale: पाठ इन वर्गों का स्पष्ट अर्थ या परस्पर संबंध निर्धारित नहीं करता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई।
- issue: हिंसक क्रम का स्वरूप
  choice: हर समूह द्वारा अगले को मारने का क्रम ज्यों का त्यों रखा गया।
  alternative: इसे सामान्य युद्ध या रूपक के रूप में संक्षेपित करना।
  rationale: मूल कथन की असहज क्रमिक हिंसा और theological tension को बिना समाधान दिए बनाए रखना आवश्यक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। वाक्य-रचना सरल किंतु गरिमापूर्ण रखी गई है; नामों की अस्पष्टता और हिंसक क्रम दोनों सुरक्षित हैं।
