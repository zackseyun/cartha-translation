base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/039.yaml
  text: He commanded me all that his fathers had commanded him. And I also command you, my children, according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation; he commanded and testified to his son and to his son's children until the day of his death.
translation:
  language: hi
  text: उसने मुझे वे सब आज्ञाएँ दीं जो उसके पूर्वजों ने उसे दी थीं। और हे मेरे बच्चों, मैं भी तुम्हें उसी प्रकार आज्ञा देता हूँ जैसे हनोक ने प्रारम्भिक जुबिली-कालों में अपने पुत्र को आज्ञा दी थी। सातवीं पीढ़ी में, जब वह जीवित था, उसने अपने पुत्र और अपने पुत्र की संतानों को अपनी मृत्यु के दिन तक आज्ञा दी और गवाही देता रहा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सुनाता’ अथवा ‘सुनवाता रहा’।
    reason: गीज़ क्रिया का मूल भाव ‘सुनवाना’ है; इस संदर्भ में इसका अर्थ औपचारिक रूप से गवाही देना या घोषणा करना भी हो सकता है।
lexical_decisions:
- source_word: አበዊሁ
  choice: उसके पूर्वजों
  rationale: शाब्दिक अर्थ ‘उसके पिता’ है, पर बहुवचन और वंशगत संदर्भ में आधुनिक हिन्दी में ‘पूर्वजों’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: በቀዳሚ፡ እዮቤልውሳት
  choice: पहले जुबिलियों में
  rationale: स्रोत के बहुवचन/कालखंड-सूचक रूप को बनाए रखते हुए पुस्तक के तकनीकी शब्द ‘जुबिली’ का हिन्दी लिप्यंतरण किया गया है।
- source_word: አስምዐ
  choice: गंभीरतापूर्वक चेताता
  rationale: कारक रूप का मूल भाव ‘सुनवाना’ है और प्रसंग में यह गंभीर गवाही, घोषणा या चेतावनी देने का अर्थ रख सकता है; सहज हिन्दी में ‘गंभीरतापूर्वक चेताता’ आदेश के साथ उपयुक्त है।
- source_word: ትዝምዳ፡ ሳባዕ
  choice: सातवीं पीढ़ी
  rationale: वंशक्रम के स्पष्ट काल-संदर्भ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: हनोक के उपदेश की प्रकृति
  choice: गंभीरतापूर्वक चेताता
  alternative: गवाही देता / सुनाता
  rationale: पाठ में औपचारिक, पीढ़ी-दर-पीढ़ी दिए गए निर्देश का भाव है; किसी विशिष्ट सांप्रदायिक अर्थ को आरोपित किए बिना गंभीर घोषणा और चेतावनी दोनों की छाया रखी गई है।
- issue: ‘पहले जुबिलियों’ का कालगत अर्थ
  choice: पहले जुबिलियों में
  alternative: प्रारम्भिक जुबिली-कालों में
  rationale: स्रोत की अभिव्यक्ति की अस्पष्टता को अनावश्यक रूप से किसी निश्चित कालगणना में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। वंशगत भाषा को सहज रखा गया है और स्रोत की कालगत तथा क्रियात्मक अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
