base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/007.yaml
  text: And in the sixth year she bore him a son, and he called his name Peleg, because in his days, when he was born, the sons of Noah began to divide the earth among themselves. For this reason he called his name Peleg.
translation:
  language: hi
  text: और छठे वर्ष में उसने उसे एक पुत्र को जन्म दिया, और उसने उसका नाम पेलेग[a] रखा, क्योंकि उसके दिनों में, जब वह जन्मा था, नूह के पुत्रों ने पृथ्वी को आपस में बाँटना आरम्भ किया। इसी कारण उसने उसका नाम पेलेग रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पेलेग (गीइज़: ፋሌክ, फालेक) नाम इब्रानी मूल פלג (पलाग) से संबंधित है, जिसका अर्थ ‘बाँटना’ या ‘विभाजित करना’ है। यहाँ यह पृथ्वी के विभाजन की ओर संकेत करता है।'
    reason: नाम और ‘बाँटना’ के बीच मूल भाषा का शब्द-संबंध हिन्दी पाठ में सीधे दिखाई नहीं देता, इसलिए उसे स्पष्ट किया गया है।
lexical_decisions:
- source_word: ፋሌክ (Fālēk)
  choice: पेलेग
  rationale: हिन्दी बाइबल परंपरा में प्रचलित इब्रानी नाम का रूप अपनाया गया है; गीइज़ रूप ‘फालेक’ को पादटिप्पणी में बताया गया है और नाम से जुड़ा ‘बाँटने’ का शब्द-संबंध सुरक्षित रखा गया है।
- source_word: ይትካፈሉ
  choice: आपस में बाँटना
  rationale: क्रिया पृथ्वी को परस्पर हिस्सों में विभाजित करने का भाव देती है; ‘आपस में बाँटना’ आधुनिक हिन्दी में स्वाभाविक है और पद के नाम-संबंधी आशय को स्पष्ट रखता है।
- source_word: ደቂቀ፡ ኖኅ
  choice: नूह के पुत्र
  rationale: गीइज़ पदबंध का सीधा अर्थ ‘नूह के पुत्र’ है; इसलिए अधिक व्यापक ‘संतान’ के बजाय संबंध को औपचारिक रूप से सुरक्षित रखा गया है।
