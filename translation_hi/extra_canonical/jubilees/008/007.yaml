translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की कारणसूचक संरचना और अंत में नामकरण की पुनरावृत्ति सुरक्षित रखी गई है। अस्पष्ट सर्वनामों को संदर्भ से अनुमानित नामों से नहीं बदला गया।
