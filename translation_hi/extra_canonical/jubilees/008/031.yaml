  yaml_path: translation/extra_canonical/jubilees/008/031.yaml
  text: And Noah began to command his sons' sons with ordinances and commandments and all the judgments that he knew, and he testified to his sons that they should do righteousness, and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication and uncleanness and all injustice.
translation:
  language: hi
  text: और नूह अपने पुत्रों के पुत्रों को विधि-विधानों, आज्ञाओं और उन सभी न्याय-विधियों की शिक्षा देने लगा जिन्हें वह जानता था। उसने अपने पुत्रों को गंभीरता से समझाया कि वे धार्मिकता का आचरण करें, अपने शरीर की लज्जा ढाँपें, अपने सृष्टिकर्ता को धन्य कहें, पिता और माता का आदर करें, हर एक अपने भाई से प्रेम करे, और अपने प्राणों को व्यभिचार, अशुद्धता और हर प्रकार के अन्याय से बचाए रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ
  choice: विधि-विधानों और आज्ञाओं
  rationale: दो निकट किंतु भिन्न कानूनी श्रेणियों को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी प्रयोग किया गया है।
- source_word: ፍትሐ
  choice: न्याय-संबंधी बातें
  rationale: यहाँ शब्द ज्ञात न्यायनिर्णयों या न्यायपूर्ण नियमों की व्यापक श्रेणी बताता है; केवल ‘फैसले’ कहने से अर्थ अनावश्यक रूप से संकीर्ण हो जाता।
- source_word: ጽድቀ
  choice: धार्मिकता के काम
  rationale: स्रोत के धार्मिक-नैतिक अर्थ को बनाए रखते हुए हिन्दी में क्रियात्मक और सहज अभिव्यक्ति दी गई है।
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: अपने तन की लज्जा
  rationale: स्रोत की शाब्दिक और शिष्ट व्यंजना को सुरक्षित रखा गया है; इसका आशय नग्नता ढाँपना है, पर मुख्य पाठ में व्यंजना को नहीं खोला गया।
- source_word: ዝሙት
  choice: व्यभिचार
  rationale: यह यौन अनैतिकता का पारंपरिक और सामान्य हिन्दी पद है तथा स्रोत के नैतिक भार को बनाए रखता है।
- source_word: ይዕቀቡ፡ ነፍሶሙ
  choice: अपने प्राणों को ... बचाए रखे
  rationale: ‘आत्माओं की रखवाली’ की कठोर शाब्दिकता के बजाय आत्म-संरक्षण का स्रोतार्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘धार्मिकता’ को आंतरिक स्थिति या आचरण के रूप में समझना
  choice: ‘धार्मिकता के काम करें’ द्वारा आचरण पर बल
  alternative: ‘धर्मी बनें’
  rationale: स्रोत में ‘करें’ क्रिया है, इसलिए पाठ नैतिक आचरण की माँग करता है; इसे केवल स्थिति या पहचान में नहीं बदला गया।
- issue: सृष्टिकर्ता के लिए ईश्वर-संबंधी नाम
  choice: ‘अपने सृष्टिकर्ता’
  alternative: ‘परमेश्वर’ या ‘प्रभु’
  rationale: स्रोत का संबंधवाचक सृष्टिकर्ता-पद सीधे रखा गया है और कोई अतिरिक्त दैवी उपाधि नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और साधारण पाठकों के लिए सुबोध रखी गई है। वंशावली-संदर्भ में ‘पुत्रों के पुत्रों’ को स्वाभाविक रूप से ‘पौत्रों’ कहा गया है। कानूनी शब्दावली की पुनरुक्ति और नैतिक आदेशों की क्रमिक लय यथासंभव सुरक्षित रखी गई है।
