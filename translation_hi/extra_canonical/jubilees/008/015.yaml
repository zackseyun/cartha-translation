base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/015.yaml
  text: This sea is named the tongue of the Egyptian Sea. And it extends from there northward to the mouth of the Great Sea, at the waters' edge, and it goes along toward the west to Afra, and it goes on until it approaches the waters of the Gihon River, on the north side of the waters of Gihon.
translation:
  language: hi
  text: इस समुद्र का नाम “मिस्र के समुद्र की जीभ” है। वहाँ से यह जल-सीमा के पास से उत्तर की ओर महान समुद्र के मुहाने तक फैलता है; फिर पश्चिम की ओर अफ़्रा तक जाता है और आगे बढ़ता हुआ गीहोन नदी के जल के निकट पहुँचता है—गीहोन के जल के उत्तर की ओर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልሳነ፡ ባሕረ፡ ገብጽ
  choice: मिस्र के समुद्र की जीभ
  rationale: भौगोलिक आकृति के लिए प्रयुक्त स्रोत-पाठ के ठोस रूपक ‘जीभ’ को बनाए रखा गया है।
- source_word: አፉሃ፡ ለባሕር፡ ዐቢይ
  choice: महासमुद्र के मुहाने
  rationale: ‘मुख/मुहाना’ के भौगोलिक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है और ‘महान समुद्र’ को सामान्य संज्ञा के रूप में ‘महासमुद्र’ कहा गया है।
- source_word: ውስተ፡ ክናፍረ፡ ማያት
  choice: जल के किनारे-किनारे
  rationale: शाब्दिक ‘जल के होंठों पर’ का आशय तट या जल-सीमा है; हिन्दी में उसके दृश्य और दिशात्मक अर्थ को सहज रूप दिया गया है।
- source_word: መንገበ፡ ዐረብ፡ ዐፍራ
  choice: पश्चिम की ओर अफ़्रा तक
  rationale: दिशा ‘पश्चिम की ओर’ और गंतव्य ‘अफ़्रा तक’ को अलग रखते हुए नवीनतम स्रोत-समीक्षा का अनुसरण किया गया है।
- source_word: ማየ፡ ጊዮን፡ ፈለገ
  choice: गीहोन नदी के जल
  rationale: ‘गीहोन’ के साथ ‘नदी’ को स्पष्ट किया गया है, जबकि स्रोत के ‘जल’ को भी छोड़ा नहीं गया।
