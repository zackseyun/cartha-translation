  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध भौगोलिक वर्णन। दिशाओं और सीमा-रेखा की क्रमिक गति को स्पष्ट रखा गया है तथा ‘जीभ’ जैसे मूल रूपक को संरक्षित किया गया है।
