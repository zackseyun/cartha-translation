translation:
  language: hi
  text: इस प्रकार वे उसके लिए स्मारक बन गए। और पहले महीने के नए चाँद के दिन उससे कहा गया कि वह जहाज़ बनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዝካረ
  choice: स्मरण का चिह्न
  rationale: गीज़ पद स्मरण अथवा स्मारक के अर्थ में है; यह वाक्यांश आधुनिक हिन्दी में उसके स्मारकीय कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በሠርቀ፡ ወርኅ፡ ቀዳሚ
  choice: पहले महीने की अमावस्या को
  rationale: शाब्दिक अर्थ ‘पहले महीने के उदय/नए चाँद पर’ है; प्राचीन पंचांग-संदर्भ में ‘अमावस्या’ नए महीने के आरम्भ को स्पष्ट और संक्षिप्त रूप से व्यक्त करती है।
- source_word: ታቦተ
  choice: जहाज़
  rationale: यहाँ नूह द्वारा बनाए जाने वाले ark का संदर्भ है; हिन्दी बाइबलीय प्रयोग में ‘जहाज़’ सामान्य पाठक के लिए स्पष्ट है और इसे वाचा के सन्दूक से अलग रखता है।
theological_decisions:
- issue: आदेश देने वाले कर्ता की पहचान
  choice: उससे कहा गया
  alternative: परमेश्वर ने उससे कहा
  rationale: स्रोत निष्क्रिय प्रयोग करता है और बोलने वाले का नाम नहीं देता; अनुवाद उसी अस्पष्टता को बनाए रखता है।
- issue: पहले खंड में बहुवचन सर्वनाम का संकेत
  choice: वे
  alternative: उनका स्पष्ट नाम जोड़ना
  rationale: प्राप्त पदांश में पूर्ववर्ती संज्ञा उपस्थित नहीं है; संदर्भ की वस्तु का अनुमान लगाकर जोड़ने के बजाय स्रोत का सर्वनाम सुरक्षित रखा गया है।
