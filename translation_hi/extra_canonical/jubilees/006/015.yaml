translation:
  language: hi
  text: और उसने नूह और उसके पुत्रों को एक चिन्ह दिया कि पृथ्वी पर फिर कभी जलप्रलय न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእምርተ
  choice: एक चिन्ह
  rationale: गीज़ शब्द का अर्थ ‘चिन्ह/निशानी’ है; ‘चिन्ह’ आधुनिक, स्वाभाविक और प्रसंगानुकूल है।
- source_word: አይኅ
  choice: जलप्रलय
  rationale: यह शब्द बाढ़ या प्रलयकारी जलराशि को सूचित करता है; नूह के प्रसंग में ‘जलप्रलय’ सामान्य बाढ़ की अपेक्षा आशय को अधिक स्पष्ट रखता है।
- source_word: ዳግመ
  choice: फिर कभी
  rationale: पुनरावृत्ति के निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዲበ፡ ምድር
  choice: पृथ्वी पर
  rationale: मूल के स्थानवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: चिन्ह देने वाले का कर्ता
  choice: सर्वनाम ‘उसने’ बनाए रखा
  alternative: ‘परमेश्वर ने’ स्पष्ट करना
  rationale: मूल पाठ में कर्ता सर्वनाम के रूप में है; संदर्भ से पहचाने जाने वाले कर्ता का नाम जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: भावी जलप्रलय का निषेध
  choice: ‘कि ... न हो’
  alternative: ‘इस बात का कि ... नहीं होगा’
  rationale: मूल के उद्देश्य/परिणाम-सदृश वाक्य-विन्यास को सहज हिन्दी में रखा गया है और कथन की संभावित व्याकरणिक सूक्ष्मता को अत्यधिक निश्चित प्रतिज्ञा में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। मूल का क्रम और संक्षिप्तता यथासंभव सुरक्षित रखी गई है।
