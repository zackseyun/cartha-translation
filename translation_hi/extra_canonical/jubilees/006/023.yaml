  text: for their generations in this month, one day every year. And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and they are the days of the seasons in the four divisions of the year; they are written.
translation:
  language: hi
  text: उनकी पीढ़ियों के लिए, इस महीने में प्रति वर्ष एक दिन। और पहले महीने के नए चाँद का दिन, चौथे महीने के नए चाँद का दिन, सातवें महीने के नए चाँद का दिन और दसवें महीने के नए चाँद का दिन स्मरण के दिन हैं; वे वर्ष के चार भागों में ऋतुओं के दिन हैं—वे लिखे हुए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትዝምዶሙ
  choice: उनकी पीढ़ियों के लिए
  rationale: पाठ का यह रूप संभवतः ‘उनकी पीढ़ियाँ/पीढ़ियों के लिए’ अर्थ वाले रूप का लिप्यंतरण-दोष है और पिछले पद के वाक्य को पूरा करता है; अंग्रेज़ी परामर्श-पाठ भी यही अर्थ सुरक्षित रखता है।
- source_word: በዝ፡ ወርኅ
  choice: इस महीने में
  rationale: स्थान/कालसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: በሠርቀ፡ ወርኅ
  choice: नवचंद्र का दिन
  rationale: शाब्दिक भाव ‘चंद्रमा के उदय/नवचंद्र पर’ है; पंचांगीय संदर्भ में ‘नवचंद्र का दिन’ स्पष्ट और स्रोत-संगत है।
- source_word: ተዝካር
  choice: स्मरण
  rationale: अनुष्ठानिक स्मरण का सामान्य और गरिमापूर्ण हिन्दी पद।
- source_word: ጊዜ
  choice: ऋतुओं
  rationale: यहाँ वर्ष के चार विभागों से जुड़े नियत काल/ऋतु अभिप्रेत हैं; ‘ऋतुओं’ से पंचांगीय अर्थ स्वाभाविक रहता है।
- source_word: መክፈላት
  choice: भागों
  rationale: वर्ष के चार विभाजनों के लिए सहज हिन्दी अभिव्यक्ति।
- source_word: ጽሑፋት፡ እማንቱ
  choice: वे लिखे हुए हैं
  rationale: निष्क्रिय बहुवचन कथन को बिना असमर्थित ‘ठहराए गए’ जैसी वृद्धि के सुरक्षित रखा गया है।
theological_decisions:
- issue: चार नवचंद्र-दिनों का स्वरूप
  choice: उन्हें ‘स्मरण के दिन’ और ‘ऋतुओं के दिन’ कहा गया है
  alternative: उन्हें पर्व या विधिवत ठहराए गए दिन कहना
  rationale: स्रोत केवल स्मरण, नियत काल और लिखे होने की बात करता है; अतिरिक्त धार्मिक दर्जा जोड़ना उचित नहीं।
- issue: आरंभिक पदबंध का पिछले पद से संबंध
  choice: खंडित वाक्य के रूप में ‘उनकी पीढ़ियों के लिए’ बनाए रखा
  alternative: इसे स्वतंत्र पूर्ण वाक्य बनाने के लिए निहित क्रिया जोड़ना
  rationale: यह पद पिछले वाक्य को आगे बढ़ाता प्रतीत होता है; स्रोत की खंडात्मक संरचना और वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘नवचंद्र’ पंचांगीय संदर्भ में ‘नया चाँद’ से अधिक सटीक है। आरंभ में स्रोत के पिछले पद से जुड़े वाक्यांश को कृत्रिम क्रिया जोड़कर पूर्ण नहीं किया गया।
