  text: And there will be those who will assuredly make observations of the moon, for it corrupts the seasons.
translation:
  language: hi
  text: और ऐसे लोग होंगे जो निश्चय ही चाँद का निरीक्षण करेंगे, क्योंकि वह ऋतुओं को बिगाड़ देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውኑ
  choice: और ऐसे लोग होंगे
  rationale: आरंभिक ወ को उसके सामान्य संयोजक अर्थ ‘और’ में रखा गया है; क्रिया भविष्यकालीन अस्तित्व को व्यक्त करती है।
- source_word: ያስተሐይጹ፡ ወርኀ
  choice: चाँद का निरीक्षण करेंगे
  rationale: पदबंध चंद्रमा को ध्यान से देखने या उसके आधार पर गणना करने का भाव देता है; ‘निरीक्षण’ इस अर्थ को बिना अनावश्यक व्याख्या जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በሑያጼ
  choice: निश्चय ही
  rationale: यहाँ बल या सुनिश्चितता के भाव को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ታማስን
  choice: बिगाड़ देता है
  rationale: मूल क्रिया में भ्रष्ट, नष्ट या अव्यवस्थित करने का प्रबल भाव है। ऋतुओं के संदर्भ में ‘बिगाड़ देता है’ स्वाभाविक है और केवल हल्की गड़बड़ी का संकेत नहीं देता।
- source_word: ጊዜያተ
  choice: ऋतुओं
  rationale: बहुवचन संज्ञा का मूल अर्थ ‘समय/काल’ है; इस पंचांग-संबंधी प्रसंग में ‘ऋतुएँ’ अभिप्रेत अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती हैं।
theological_decisions:
- issue: चंद्रमा और ऋतुओं के बीच कारण-संबंध
  choice: क्योंकि वह ऋतुओं को बिगाड़ देता है
  alternative: जिससे ऋतुएँ बिगड़ जाती हैं
  rationale: मूल पाठ चंद्रमा को ही व्याकरणिक कर्ता रखकर कारण बताता है। अनुवाद ने इस कठोर कथन को नरम किए बिना बनाए रखा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चाँद’ सामान्य हिन्दी में ‘चंद्रमा’ से अधिक स्वाभाविक है, जबकि वाक्य की औपचारिक गंभीरता बनी रहती है।
