translation:
  language: hi
  text: और तुम भी इस्राएल की संतानों को आज्ञा दो कि वे पीढ़ी-दर-पीढ़ी इस पर्व का पालन करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ እስራኤል
  choice: इस्राएल की सन्तानों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र/बच्चे’ है; ‘सन्तानों’ से सामूहिक और वंशगत आशय स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ይዕቀብዋ
  choice: मानें
  rationale: मूल क्रिया का अर्थ ‘रखना, पालन करना, मानना’ है; पर्व के सन्दर्भ में ‘पर्व को मानें’ आधुनिक हिन्दी में स्वाभाविक है और पालन का भाव व्यक्त करता है।
- source_word: በዓል
  choice: पर्व
  rationale: यह उत्सव अथवा धार्मिक पर्व को सूचित करता है; ‘पर्व’ गरिमापूर्ण और सामान्यतः बोधगम्य विकल्प है।
- source_word: በኵሉ ትዝምዶሙ
  choice: पीढ़ी-दर-पीढ़ी
  rationale: इस पदबंध का आशय उनकी समस्त पीढ़ियों में निरन्तर पालन है; यह हिन्दी अभिव्यक्ति उसी कालगत निरन्तरता को सहज रूप में देती है।
