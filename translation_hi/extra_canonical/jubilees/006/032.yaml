  yaml_path: translation/extra_canonical/jubilees/006/032.yaml
  text: But if they transgress and do not observe them according to his command, then they will disturb all their seasons, and the years will be moved from this order, and they will transgress their ordinances.
translation:
  language: hi
  text: परन्तु यदि वे उल्लंघन करें और उसकी आज्ञा के अनुसार उनका पालन न करें,[a] तो वे अपने सभी नियत समयों को अस्त-व्यस्त कर देंगे,[b] और वर्ष इस क्रम से हट जाएँगे;[c] और उनकी व्यवस्थाएँ भी बिगड़ जाएँगी।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में कर्म बहुवचन है—‘उनका पालन न करें’; इसका संकेत पहले बताए गए दिनों, पर्वों या विधियों की ओर हो सकता है।
    reason: स्रोत के बहुवचन कर्म-प्रत्यय और उसके संभावित पूर्वपद को स्पष्ट करना।
  - marker: b
    text: अर्थात वे स्वयं नियत समयों को बिगाड़ेंगे; स्रोत में क्रिया सक्रिय है।
    reason: इसे निष्क्रिय, ‘सभी नियत समय अस्त-व्यस्त हो जाएँगे’, समझने से बचाना।
  - marker: c
    text: 'स्रोत-संस्करण में इसके बाद लगभग यही बात दोहराने वाला अंश कोष्ठकों में है: ‘और वे समयों को बिगाड़ेंगे और वर्ष भी अस्त-व्यस्त हो जाएँगे।’'
    reason: संपादकीय रूप से संदिग्ध अथवा पुनरुक्त कोष्ठकित पाठ की पारदर्शी सूचना देना।
  - marker: d
    text: अंतिम वाक्यांश में ‘उनकी व्यवस्थाएँ’ का संबंध निकटवर्ती ‘नियत समयों और वर्षों’ से समझा जा सकता है; स्रोत की क्रिया का भाव ‘उल्लंघित होना’ या ‘बिगड़ जाना’ है।
    reason: अंतिम खंड के संबंध और क्रियाभाव की कुछ अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: ተዐደዉ
  choice: उल्लंघन करें
  rationale: यह क्रिया निर्धारित सीमा या विधान को लाँघने का भाव देती है; ‘उल्लंघन’ प्रसंग के विधिक स्वर को बनाए रखता है।
- source_word: ወኢገብርዎን
  choice: और उनका पालन न करें
  rationale: क्रिया के कर्म-प्रत्यय को बहुवचन मानते हुए पहले उल्लिखित दिनों/पर्वों अथवा विधियों की ओर संकेत रखा गया है। हिन्दी में ‘पालन करना’ आज्ञा और धार्मिक विधान दोनों के लिए स्वाभाविक है।
- source_word: ያማስኑ
  choice: अस्त-व्यस्त कर देंगे
  rationale: 'स्रोत का रूप सक्रिय और कारक है: लोग समयों को बिगाड़ेंगे, न कि समय केवल अपने-आप बिगड़ेंगे।'
- source_word: ጊዜያቲሆሙ
  choice: अपने सभी नियत समयों
  rationale: यहाँ ‘समय’ सामान्य अवधि से अधिक पंचांग के ठहराए हुए अवसरों का संकेत देता है; ‘नियत समय’ उस अर्थ को स्पष्ट करता है।
- source_word: ይትሐወሱ
  choice: हट जाएँगे
  rationale: क्रिया में उलट-पुलट, गड़बड़ी या स्थानांतरित होने का भाव है। ‘इस क्रम से हट जाएँगे’ पंचांगीय व्यवस्था से विचलन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሥርዐቶሙ
  choice: अपनी निर्धारित व्यवस्थाओं
  rationale: शब्द का अर्थ क्रम, विधान या ठहराई हुई व्यवस्था हो सकता है। बहुवचन संबंध और प्रसंग को रखते हुए ऐसा पद चुना गया है जो अत्यधिक संप्रदायगत न हो।
theological_decisions:
- issue: आज्ञा के कर्ता का संदर्भ
  choice: ‘उसकी आज्ञा’
  alternative: ‘उसके आदेश’ या स्पष्ट रूप से ‘परमेश्वर की आज्ञा’
  rationale: स्रोत में सर्वनाम है; नाम जोड़ने से निहित संदर्भ को अनावश्यक रूप से स्पष्ट किया जाता।
- issue: अंतिम बहुवचन कर्ता का संदर्भ
  choice: मुख्य पाठ में ‘वे’ रखा गया
  alternative: ‘वर्ष और नियत समय अपनी व्यवस्थाओं से हट जाएँगे’
  rationale: स्रोत का बहुवचन कर्ता व्याकरणतः पूर्ववर्ती लोगों अथवा निकटवर्ती समयों/वर्षों से जुड़ सकता है। मुख्य पाठ अंग्रेज़ी परामर्श-पाठ के अनुरूप लोगों को अग्रभूमि में रखता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘नियत समय’, ‘क्रम’ और ‘निर्धारित व्यवस्थाएँ’ पंचांग तथा विधान—दोनों से जुड़े स्रोत-भाव को बिना किसी संप्रदायगत पारिभाषिकता के व्यक्त करते हैं।
