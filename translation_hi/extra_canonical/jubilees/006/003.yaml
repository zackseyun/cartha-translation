  text: And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth.
translation:
  language: hi
  text: और यहोवा ने सुखद सुगंध सूँघी और उसके साथ यह वाचा बाँधी कि फिर कभी पृथ्वी का नाश करनेवाला जलप्रलय न होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी बाइबलीय परंपरा में परिचित रूप से प्रस्तुत करता है; यहाँ निश्चित कर्ता का भाव बनाए रखता है।
- source_word: መዐዛ፡ ሠናየ
  choice: सुखद सुगंध
  rationale: शाब्दिक अर्थ ‘अच्छी/मनभावनी सुगंध’ है; यह स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ተካየደ፡ ምስሌሁ፡ ኪዳነ
  choice: उसके साथ यह वाचा बाँधी
  rationale: मूल के ‘उसके साथ वाचा की’ भाव को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
- source_word: ማየ፡ አይኅ
  choice: जलप्रलय
  rationale: ‘प्रलय/बाढ़ का जल’ के संयुक्त भाव को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: ዘያማስን፡ ምድረ
  choice: पृथ्वी का नाश करनेवाला
  rationale: संबंधवाचक पदबंध के विनाशकारी परिणाम को संरक्षित करता है।
theological_decisions:
- issue: ईश्वर द्वारा सुगंध सूँघने का मानवरूपी वर्णन
  choice: सूँघी
  alternative: ग्रहण की
  rationale: मूल के ठोस मानवरूपी क्रियापद को आध्यात्मिक बनाकर कमजोर नहीं किया गया।
- issue: वाचा का सहभागी
  choice: उसके साथ
  alternative: नूह के साथ
  rationale: मूल पाठ के सर्वनाम को बनाए रखा गया; स्पष्टता के लिए नाम जोड़कर पाठ का विस्तार नहीं किया गया।
- issue: भविष्य में प्रलय की निषेधात्मक प्रतिज्ञा
  choice: फिर कभी ... न होगा
  alternative: कभी न हो
  rationale: मूल के उद्देश्य/परिणामसूचक कथन को हिन्दी में स्वाभाविक प्रतिज्ञात्मक रूप दिया गया, जैसा प्रसंग अपेक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। बाइबलीय शब्द ‘वाचा’ और परिचित रूप ‘यहोवा’ बनाए गए हैं।
