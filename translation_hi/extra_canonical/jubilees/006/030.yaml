base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/030.yaml
  text: And all the days of the commandments are fifty-two weeks of days, and all of them make a complete year. Thus it is inscribed and ordained on the heavenly tablets, and there is no neglecting a single year, from year to year.
translation:
  language: hi
  text: और आज्ञाओं के सभी दिन बावन सप्ताहों के बराबर हैं, और वे सब मिलकर एक पूरा वर्ष बनाते हैं। इसी प्रकार यह स्वर्गीय पट्टिकाओं पर अंकित और निर्धारित है, और वर्ष-दर-वर्ष एक भी वर्ष की उपेक्षा नहीं की जाती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዛት
  choice: आज्ञाओं
  rationale: गीज़ रूप बहुवचन है; इसलिए एकवचन ‘आज्ञा’ के बजाय ‘आज्ञाओं’ रखा गया है।
- source_word: ፶ምሳ፡ ወክልኤ፡ ሰንበታት፡ መዋዕል
  choice: बावन सप्ताह
  rationale: शाब्दिक संरचना ‘दिनों के बावन सप्ताह’ है; आधुनिक हिन्दी में ‘बावन सप्ताह’ वही गणना स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ተቈርፀ፡ ወተሠርዐ
  choice: अंकित और निर्धारित
  rationale: 'दोनों क्रियाओं का स्रोत-क्रम सुरक्षित रखा गया है: पहली लिखे/उकेरे जाने और दूसरी ठहराए/व्यवस्थित किए जाने को व्यक्त करती है।'
- source_word: አልቦ፡ ተዐድዎ
  choice: उपेक्षा नहीं की जानी चाहिए
  rationale: संदर्भ में भाव किसी वर्ष को छोड़ देने या उसकी गणना की अवहेलना न करने का है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ውስተ፡ ጽላት፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं पर
  rationale: जुबिलीज़ की स्थायी पारिभाषिक छवि को बनाए रखते हुए ‘heavenly tablets’ का सीधा और गरिमापूर्ण रूप।
theological_decisions:
- issue: वर्ष की कैलेंडरीय पूर्णता
  choice: वे सब मिलकर एक पूरा वर्ष बनाते हैं
  alternative: वे सभी एक पूर्ण वर्ष हैं
  rationale: पाठ बावन सप्ताहों के कुल दिनों को पूर्ण वर्ष बताता है; ‘मिलकर’ गणितीय संबंध स्पष्ट करता है, बिना अतिरिक्त कैलेंडरीय सिद्धांत जोड़े।
- issue: अंतिम निषेध का बल
  choice: एक भी वर्ष की उपेक्षा नहीं की जानी चाहिए
  alternative: एक भी वर्ष को लाँघना नहीं है
  rationale: ‘उपेक्षा’ स्वीकृत अंग्रेज़ी परामर्श-पाठ और प्रसंग के अनुरूप है, जबकि निष्क्रिय विधिक रूप मूल कथन के आदेशात्मक बल को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘वर्ष-दर-वर्ष’ मूल की पुनरुक्त कालगत अभिव्यक्ति को संक्षेप और स्वाभाविक रूप में सुरक्षित रखता है।
