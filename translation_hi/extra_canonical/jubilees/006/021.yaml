base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/021.yaml
  text: 'as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the Feast of Weeks, and it is the Feast of Firstfruits. It is of two kinds and of a double nature.'
translation:
  language: hi
  text: उनके लिए यह आज्ञा है कि वे हर वर्ष इसी महीने में एक दिन यह पर्व मनाएँ। क्योंकि यह सप्ताहों का पर्व और पहली उपज का पर्व है। इसका स्वरूप दो प्रकार का और दोहरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለትእዛዝ፡ ሎሙ
  choice: उनके लिए यह आज्ञा है
  rationale: आज्ञात्मक आशय को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ዕለተ፡ አሐተ፡ ለዓመት
  choice: हर वर्ष ... एक दिन
  rationale: मूल के ‘वर्ष में एक दिन’ को सहज हिन्दी शब्दक्रम में व्यक्त किया गया है।
- source_word: በዓለ፡ ሱባዔያት
  choice: सप्ताहों का पर्व
  rationale: यह पर्व-नाम का निकट औपचारिक अनुवाद है और बाइबलीय परंपरा में पहचाना जाता है।
- source_word: በዓለ፡ ቀዳሜ፡ ፍሬ
  choice: पहली उपज का पर्व
  rationale: ‘प्रथम फल/उपज’ के कृषि-संदर्भ को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ክልኤ፡ ዐጽፍት፡ ይእቲ፡ ወለክልኤ
  choice: इसका स्वरूप दो प्रकार का और दोहरा है
  rationale: स्रोत में ‘दो’ की पुनरावृत्ति और दोहरेपन की अभिव्यक्ति को बिना कृत्रिम रूप से एक अर्थ में समेटे सुरक्षित रखा गया है।
theological_decisions:
- issue: सप्ताहों के पर्व और पहली उपज के पर्व का संबंध
  choice: दोनों नामों को एक ही पर्व के समन्वित वर्णन के रूप में रखा गया
  alternative: इन्हें दो अलग पर्व मानकर अनुवाद करना
  rationale: मूल में दोनों के लिए एकवचन संबंधसूचक कथन आता है और अंत में उसके दोहरे स्वरूप का उल्लेख है; इसलिए भेद को बनाए रखते हुए एक पर्व का संकेत देना उचित है।
- issue: अंतिम दोहरे कथन की व्याख्या
  choice: ‘दो प्रकार का और दोहरा’ कहकर तनाव बनाए रखा
  alternative: इसे केवल ‘इसके दो नाम हैं’ या ‘इसके दो अर्थ हैं’ कहना
  rationale: स्रोत स्वयं यह स्पष्ट नहीं करता कि दोहरापन नाम, अनुष्ठान, अर्थ या स्वरूप में है; किसी विशिष्ट व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पर्व-नामों में अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए औपचारिक बाइबलीय लहजा रखा गया है।
