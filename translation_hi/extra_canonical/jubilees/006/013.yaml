  yaml_path: translation/extra_canonical/jubilees/006/013.yaml
  text: And you, command the children of Israel not to eat any blood, so that their name and their seed may be before Yahweh our God always.
translation:
  language: hi
  text: और तू इस्राएल की संतानों को आज्ञा दे कि वे कोई भी रक्त न खाएँ, ताकि उनका नाम और उनका वंश याहवे हमारे परमेश्वर के सामने सदा बना रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ ደመ
  choice: कोई भी रक्त
  rationale: शाब्दिक रूप से ‘समस्त/सारा रक्त’; निषेधात्मक वाक्य में ‘कोई भी रक्त’ स्वाभाविक हिन्दी में इसके व्यापक अर्थ को सुरक्षित रखता है।
- source_word: ዘርኦሙ
  choice: उनका वंश
  rationale: मूल शब्द ‘बीज/संतति’ का संकेत देता है; मनुष्यों के भावी वंशजों के लिए ‘वंश’ आधुनिक, सहज और गरिमापूर्ण है।
- source_word: ቅድመ
  choice: के सामने
  rationale: मूल का स्थानात्मक तथा संबंधपरक अर्थ सीधे बनाए रखता है।
- source_word: እግዚአብሔር
  choice: याहवे
  rationale: यहाँ परामर्श-पाठ में पहचाने गए परमेश्वर के व्यक्तिगत नाम को हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: ኵሎ፡ መዋዕለ
  choice: सदा
  rationale: शाब्दिक ‘सभी दिनों’ का स्वाभाविक हिन्दी समतुल्य, जो निरंतरता को व्यक्त करता है।
theological_decisions:
- issue: नाम और वंश का परमेश्वर के सामने बने रहना
  choice: ताकि उनका नाम और उनका वंश ... सदा बना रहे
  alternative: जिससे उनकी स्मृति और उनकी संतान सदा जीवित रहें
  rationale: मूल के ‘नाम’, ‘वंश’ और ‘सामने’ को बिना व्याख्यात्मक विस्तार या प्रतिज्ञा की प्रकृति निर्धारित किए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज लेकिन गरिमापूर्ण शैली अपनाई गई है। संबोधन के एकवचन रूप को ‘तू’ से रखा गया है, क्योंकि मूल में दूसरा पुरुष एकवचन है; आज्ञा के अधीन बहुवचन समुदाय के लिए ‘वे ... न खाएँ’ प्रयोग हुआ है।
