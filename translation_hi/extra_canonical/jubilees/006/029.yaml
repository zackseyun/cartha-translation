base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/029.yaml
  text: 'For the feasts and for memorials forever, and thus they are ordained. And they are recorded on the heavenly tablets: thirteen weeks, each one from another, for their memorials, from the first to the second, and from the second to the third, and from the third to the fourth.'
translation:
  language: hi
  text: 'ये पर्वों और स्मरणों के लिए सदा तक ठहराए गए हैं; और इस प्रकार उनका विधान किया गया है। वे स्वर्गीय पट्टिकाओं पर दर्ज हैं:[a] उनके स्मरण के लिए तेरह सप्ताह—हर एक दूसरे से: पहले से दूसरे तक, दूसरे से तीसरे तक, और तीसरे से चौथे तक।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे स्वर्गीय पट्टिकाओं पर लिखे गए थे।”
    reason: गीज़ क्रिया के अर्थ/काल के संबंध में अंग्रेज़ी audit trail में सुरक्षित वैकल्पिक भूतकालीन अनुवाद को दर्शाता है; मुख्य पाठ वर्तमानार्थक 'दर्ज हैं' रखता है।
lexical_decisions:
- source_word: ለበዓላት
  choice: पर्वों के रूप में
  rationale: यह पद पर्वों के उद्देश्य/स्वरूप को व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का आशय सुरक्षित है।
- source_word: ለተዝካር
  choice: स्मरण के अवसरों के रूप में
  rationale: ተዝካር का अर्थ स्मरण या स्मारक पालन है; यहाँ कैलेंडर-संबंधी आवर्ती स्मरण अभिप्रेत है।
- source_word: ሥርዓት
  choice: विधान
  rationale: यह स्थापित व्यवस्था या नियमन को दर्शाता है; 'विधान' धार्मिक-कैलेंडर संबंधी प्रसंग में dignified और स्पष्ट है।
- source_word: ጽላት፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: शाब्दिक अर्थ 'आकाश/स्वर्ग की पट्टिकाएँ' है; 'स्वर्गीय पट्टिकाएँ' सहज और पारंपरिक हिन्दी रूप है।
- source_word: ዓሥሩ፡ ወሠላስ፡ ሰንበታት
  choice: तेरह-तेरह सप्ताह
  rationale: शाब्दिक रूप से 'तेरह सप्ताह'; दो क्रमिक पर्वों के बीच समान अंतर को हिन्दी में स्पष्ट करने के लिए पुनरुक्ति प्रयुक्त है।
- source_word: አሐቲ፡ አሐቲ፡ እምኔሆን
  choice: के अंतर पर
  rationale: मूल का भाव प्रत्येक का दूसरे से पृथक/एक-दूसरे से क्रमबद्ध होना है; अगले क्रमसूचक वाक्यांश के साथ यह हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: स्वर्गीय पट्टिकाओं पर क्रिया का काल और अर्थ
  choice: वे ... अंकित हैं
  alternative: वे ... लिखी गई थीं / वे उन्हें ... चढ़ाते हैं
  rationale: गीज़ अपूर्ण क्रिया ongoing या सामान्य वर्तमान का संकेत दे सकती है। कर्मवाच्य 'अंकित हैं' अंग्रेज़ी परामर्श-पाठ के वर्तमान भाव को रखता है, पर क्रिया को केवल ऐतिहासिक भूतकाल नहीं बनाता।
- issue: चार स्मरणों के बीच तेरह सप्ताह का संबंध
  choice: तेरह-तेरह सप्ताह के अंतर पर
  alternative: तेरह सप्ताह, प्रत्येक एक-दूसरे से
  rationale: मूल वाक्यरचना कुछ संक्षिप्त और कठिन है। क्रम—पहले से दूसरे, दूसरे से तीसरे, तीसरे से चौथे—स्पष्ट करता है कि तेरह सप्ताह अंतराल हैं; अनावश्यक रूप से चारों की पहचान नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'स्मरण के अवसर' अनुष्ठानिक स्मारक-पालन को स्पष्ट करता है; लंबी मूल वाक्यरचना को अर्धविराम और डैश से पठनीय बनाया गया है।
