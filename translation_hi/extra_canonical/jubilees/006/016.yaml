  text: He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.
translation:
  language: hi
  text: उसने अपना धनुष बादल में सनातन वाचा के चिन्ह के रूप में रखा, ताकि पृथ्वी के सारे दिनों में फिर कभी पृथ्वी को नष्ट करने के लिए पृथ्वी पर बाढ़ का जल न आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀስተ
  choice: अपना धनुष
  rationale: गीज़ शब्द का मूल अर्थ ‘धनुष’ है; प्रसंग में यह बादल में रखे गए परमेश्वर के धनुष को दर्शाता है।
- source_word: ለትእምርተ፡ ኪዳን፡ ዘለዓለም
  choice: सनातन वाचा के चिन्ह के रूप में
  rationale: ‘चिन्ह’, ‘वाचा’ और ‘सनातन’—तीनों स्रोत के मुख्य अर्थों को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
- source_word: ማየ፡ አይኅ
  choice: प्रलय का जल
  rationale: शाब्दिक अर्थ ‘बाढ़/प्रलय का जल’ है; ‘प्रलय का जल’ नूह के प्रसंग को स्पष्ट रखते हुए स्रोत के विनाशकारी जल का भाव व्यक्त करता है।
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: पृथ्वी को उसके सारे दिनों तक
  rationale: स्रोत की असामान्य कालगत अभिव्यक्ति ‘पृथ्वी के सभी दिन’ को मिटाए बिना समझने योग्य हिन्दी दी गई है।
theological_decisions:
- issue: धनुष का वक्ता/स्वामी
  choice: उसने अपना धनुष
  alternative: उसने धनुष
  rationale: क्रिया का कर्ता पूर्व प्रसंग से परमेश्वर है; ‘अपना’ अंग्रेज़ी परामर्श-पाठ के अनुरूप संबंध स्पष्ट करता है, पर ‘इंद्रधनुष’ कहकर प्रतीक की धनुष-वाली छवि को समाप्त नहीं करता।
- issue: भविष्य में जलप्रलय का निषेध
  choice: फिर कभी प्रलय का जल न आए और पृथ्वी को ... नष्ट न करे
  alternative: प्रलय का जल पृथ्वी पर उसे नष्ट करने के लिए न हो
  rationale: उद्देश्य-वाक्य को स्वाभाविक हिन्दी में व्यक्त किया गया है और प्रतिज्ञा का निषेध सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘वाचा’ बाइबलीय संकल्पना की सटीकता बनाए रखता है; ‘धनुष’ स्रोत की प्रतिमा को ‘इंद्रधनुष’ की व्याख्या में सीमित नहीं करता।
