base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/010.yaml
  text: And Noah and his sons swore that they would not eat any blood that is in any flesh, and he established a covenant before the Lord God forever throughout all the generations of the earth in this month.
translation:
  language: hi
  text: और नूह और उसके पुत्रों ने शपथ ली कि वे किसी भी प्राणी के शरीर का कोई भी रक्त नहीं खाएँगे; और उसने इस महीने प्रभु परमेश्वर के सामने पृथ्वी की सभी पीढ़ियों में सदा के लिए एक वाचा स्थापित की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐኩ
  choice: शपथ खाई
  rationale: गीज़ क्रिया शपथ लेने का अर्थ देती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट अभिव्यक्ति है।
- source_word: ኵሎ ደመ ዘበኵሉ ሥጋ
  choice: किसी भी प्राणी के शरीर में पाया जाने वाला रक्त
  rationale: शाब्दिक संरचना ‘हर/किसी भी मांस में का समस्त रक्त’ है। यहाँ ‘प्राणी का शरीर’ हिन्दी में आशय स्पष्ट करता है और रक्त-भक्षण की व्यापक मनाही बनाए रखता है।
- source_word: ተካየደ ኪዳነ
  choice: वाचा स्थापित की
  rationale: यह संयोजन वाचा को विधिवत ठहराने या स्थापित करने का भाव देता है; ‘वाचा बाँधी’ भी सम्भव है, पर ‘स्थापित की’ स्रोत की औपचारिकता बेहतर रखता है।
- source_word: እግዚአብሔር አምላክ
  choice: प्रभु परमेश्वर
  rationale: स्रोत में ‘प्रभु परमेश्वर’ है, न कि विशिष्ट दिव्य नाम; इसलिए ‘यहोवा परमेश्वर’ नहीं अपनाया गया।
- source_word: ለዓለም
  choice: सदा की
  rationale: वाचा की स्थायी अवधि व्यक्त करने के लिए प्रसंगानुकूल विशेषणात्मक हिन्दी रूप चुना गया है।
theological_decisions:
- issue: वाचा का कर्ता
  choice: ‘उसने’—नूह को एकवचन कर्ता रखा
  alternative: ‘उन्होंने’—नूह और उसके पुत्रों को सामूहिक कर्ता मानना
  rationale: स्रोत की दूसरी क्रिया एकवचन है, जबकि शपथ लेने वाली पहली क्रिया बहुवचन है। इस व्याकरणिक बदलाव को सुरक्षित रखा गया है।
- issue: रक्त की मनाही का दायरा
  choice: किसी भी प्राणी के शरीर में पाया जाने वाला रक्त
  alternative: किसी भी मांस में का सारा रक्त
  rationale: चयन स्रोत की व्यापकता बनाए रखते हुए आधुनिक हिन्दी में यह स्पष्ट करता है कि आशय देहधारी प्राणी के रक्त से है; किसी बाद की धार्मिक व्यवस्था की अतिरिक्त शर्त नहीं जोड़ी गई।
- issue: वाचा की कालावधि
  choice: पृथ्वी की सभी पीढ़ियों के लिए सदा की वाचा
  alternative: पृथ्वी की हर पीढ़ी में सदा के लिए वाचा
  rationale: दोनों कालगत पदों—‘सदा’ और ‘सभी पीढ़ियों’—को बनाए रखा गया है, बिना उनके आपसी संबंध को कृत्रिम रूप से सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। स्रोत में शपथ के बहुवचन कर्ता और वाचा स्थापित करने के एकवचन कर्ता के बीच जो बदलाव है, उसे जानबूझकर सुरक्षित रखा गया है।
