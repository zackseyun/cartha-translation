revisions:
- from: और नूह और उसके पुत्रों ने शपथ खाई कि वे किसी भी प्राणी के शरीर में पाया जाने वाला रक्त नहीं खाएँगे; और उसने इसी महीने प्रभु परमेश्वर के सामने पृथ्वी की सभी पीढ़ियों के लिए सदा की वाचा स्थापित की।
  to: और नूह और उसके पुत्रों ने शपथ ली कि वे किसी भी प्राणी के शरीर का कोई भी रक्त नहीं खाएँगे; और उसने इस महीने प्रभु परमेश्वर के सामने पृथ्वी की सभी पीढ़ियों में सदा के लिए एक वाचा स्थापित की।
  rationale: The revision retains the source’s notable shift from plural oath-takers to a singular covenant-maker, preserves the unrestricted prohibition on blood, and represents both the everlasting duration and its extension through all earthly generations. It also removes emphasis absent from the source and uses more natural standard Hindi.
  reviewer_model: gpt-5.6-terra
