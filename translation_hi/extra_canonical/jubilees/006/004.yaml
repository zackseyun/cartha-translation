  terminology: “बोआई और कटनी,” “ठंड और गरमी,” and “अपना क्रम” are natural, faithful choices. “शीत ऋतु” is acceptable for ክረምት in this Genesis-like seasonal pairing, though the Geʽez term can be associated with the rainy season in Ethiopian usage; a brief note preserves that lexical caution without altering the main text.
