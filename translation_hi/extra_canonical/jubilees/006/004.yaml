  text: All the days of the earth, seedtime and harvest shall not cease; cold and heat, summer and winter, and day and night shall not change their order, nor shall they cease forever.
translation:
  language: hi
  text: पृथ्वी के सारे दिनों में, बोआई और कटनी समाप्त नहीं होंगी; ठंड और गरमी, ग्रीष्म और शीत ऋतु, तथा दिन और रात अपना क्रम नहीं बदलेंगे, और वे सदा के लिए समाप्त नहीं होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: पृथ्वी के सारे दिनों में
  rationale: यह पदबंध आनेवाली सभी ऋतुओं और चक्रों की अवधि बताता है; हिंदी में ‘में’ जोड़ने से इसका कालवाचक कार्य स्वाभाविक और स्पष्ट होता है।
- source_word: ዘርእ፡ ወማእረር
  choice: बोआई और कटनी
  rationale: शाब्दिक ‘बीज और कटनी’ के बजाय कृषि-चक्र के आशय को आधुनिक, सहज हिंदी में व्यक्त किया गया है।
- source_word: ቍር፡ ወሙቀት
  choice: ठंड और गरमी
  rationale: मूल के परस्पर विपरीत ताप-संबंधी शब्दों का सीधा और सामान्य हिंदी रूप।
- source_word: ሐጋይ፡ ወክረምት
  choice: ग्रीष्म और शीत ऋतु
  rationale: इन ऋतु-संज्ञाओं का पारंपरिक अर्थ ‘ग्रीष्म और शीत/वर्षा ऋतु’ हो सकता है; संदर्भ और परामर्श-पाठ के अनुरूप व्यापक मौसमी युग्म ‘ग्रीष्म और शीत ऋतु’ रखा गया है।
- source_word: ሥርዓቶሙ
  choice: अपना क्रम
  rationale: यहाँ शब्द प्राकृतिक चक्रों की नियत व्यवस्था या क्रम को दर्शाता है; ‘अपना क्रम’ संक्षिप्त और स्वाभाविक है।
- source_word: ለዓለም
  choice: कभी
  rationale: निषेध के साथ यह अनंत काल तक न रुकने का भाव देता है; ‘न कभी समाप्त होंगे’ हिंदी में उसी स्थायित्व को सहजता से व्यक्त करता है।
theological_decisions:
- issue: प्राकृतिक क्रम की स्थायिता
  choice: ‘अपना क्रम नहीं बदलेंगे और न कभी समाप्त होंगे’
  alternative: ‘उनकी व्यवस्था सदा तक न बदलेगी और न वे समाप्त होंगे’
  rationale: मूल में क्रम न बदलने और समाप्त न होने—दोनों कथन बने रहते हैं; किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ा गया।
- issue: ऋतु-संज्ञा ክረምት का अर्थ
  choice: शीत ऋतु
  alternative: वर्षा ऋतु
  rationale: गीज़/इथियोपियाई संदर्भ में यह वर्षा-काल का सूचक भी हो सकता है, जबकि व्यापक बाइबिलीय ऋतु-युग्म में ‘शीत ऋतु’ स्वीकार्य है। मुख्य पाठ में परामर्श-पाठ से संगति रखते हुए ‘शीत ऋतु’ चुना गया, पर अर्थगत सीमा को निर्णय में स्पष्ट रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। समानांतर प्राकृतिक युग्मों और मूल के दोहरे निषेध को सुरक्षित रखा गया है। ‘समाप्त’ का प्रयोग बोआई-कटनी तथा प्राकृतिक चक्रों दोनों के लिए किया गया है, ताकि पद का संरचनात्मक संबंध बना रहे।
