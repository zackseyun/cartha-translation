base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/007.yaml
  text: But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, so that your blood for your lives may not be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.
translation:
  language: hi
  text: परन्तु मांस को उसके प्राण के साथ, अर्थात् उसके लहू के साथ, मत खाना; क्योंकि हर प्राणी का जीवन लहू में है, ताकि तुम्हारे प्राणों के लिए तुम्हारे लहू का हिसाब न माँगा जाए। हर मनुष्य के हाथ से और हर जीवित प्राणी के हाथ से मैं मनुष्य के लहू का हिसाब माँगूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሱ / ነፍሰ
  choice: जीवन / प्राणों
  rationale: इन शब्दों का संदर्भ यहाँ देहधारी जीवन से है। पहले वाक्य में स्वाभाविक हिन्दी के लिए ‘जीवन’ और मनुष्यों के जीवन की जवाबदेही वाले वाक्य में बहुवचन-संबंध बनाए रखने के लिए ‘प्राणों’ चुना गया।
- source_word: ደም
  choice: लहू
  rationale: ‘लहू’ आधुनिक हिन्दी में सहज, गरिमापूर्ण और वाचा तथा रक्तपात के संदर्भ में सशक्त है।
- source_word: ይትኀሠሥ / አኀሥሦ
  choice: हिसाब माँगा जाए / हिसाब माँगूँगा
  rationale: मूल क्रिया में खोजने, माँगने अथवा जवाबदेही ठहराने का भाव है; ‘हिसाब माँगना’ दैवी जवाबदेही का अर्थ स्पष्ट करता है और दोनों प्रयोगों की समानता बनाए रखता है।
- source_word: እምውስተ፡ እዴ / እምእዴ
  choice: के हाथ से
  rationale: मूल की ‘हाथ से’ वाली सामी अभिव्यक्ति को सुरक्षित रखा गया है, क्योंकि यह उत्तरदायित्व के स्रोत को दर्शाती है।
- source_word: ኵሉ፡ አኀሥሦ
  choice: हर जीवित प्राणी
  rationale: गीज़ पदबंध का आशय रक्त बहाने वाले सभी जीवधारियों से है; अंग्रेज़ी परामर्श-पाठ के ‘every living thing’ के अनुरूप स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: मांस, जीवन और लहू का संबंध
  choice: ‘जिसमें उसका जीवन अर्थात् उसका लहू है’
  alternative: ‘उसके जीवन और उसके लहू समेत’
  rationale: मूल में ‘उसकी आत्मा/जीवन के साथ, उसके लहू के साथ’ का निकट संबंध है। चयनित रूप जीवन और लहू की पहचान-सदृश निकटता व्यक्त करता है, पर उन्हें दार्शनिक रूप से पूर्णतः समान घोषित नहीं करता।
- issue: निषेध के बाद उद्देश्य अथवा आशंका का उपवाक्य
  choice: ‘ऐसा न हो कि ... हिसाब माँगा जाए’
  alternative: ‘ताकि ... हिसाब न माँगा जाए’
  rationale: ከመ ኢ- उद्देश्य और निषेधात्मक परिणाम दोनों संकेत कर सकता है। हिन्दी में ‘ऐसा न हो कि’ मूल की चेतावनी और संभावित परिणाम का तनाव अधिक स्वाभाविक रूप से बचाता है।
- issue: लहू के लिए दैवी प्रतिदान
  choice: ‘हिसाब माँगूँगा’
  alternative: ‘बदला लूँगा’
  rationale: मूल क्रिया जवाबदेही या माँग का संकेत देती है; ‘बदला’ दंड का अर्थ अधिक निश्चित कर देता, इसलिए उसे नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। ‘परन्तु’, ‘प्राणी’, ‘प्राणों’ और ‘लहू’ जैसे शब्द शास्त्रीय गंभीरता रखते हुए भी प्रचलित हैं। मूल की पुनरुक्ति और ‘हाथ से’ वाली अभिव्यक्ति यथासंभव सुरक्षित रखी गई है।
