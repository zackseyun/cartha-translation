  text: और उस पर पृथ्वी सूख गई; तब उसने उसे खोला और भूमि को देखा। चौथे महीने के नए चाँद के दिन नीचे स्थित अथाह जल की गहराइयों के मुहाने बंद हो गए। और सातवें महीने के नए चाँद के दिन सारे मुहाने खोल दिए गए—[a]
  philosophy: optimal-equivalence
  footnotes:
