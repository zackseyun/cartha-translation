lexical_decisions:
- source_word: የብሰት፡ ምድር
  choice: पृथ्वी सूख गई
  rationale: क्रिया और कर्ता को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በሠርቀ፡ ወርኅ
  choice: महीने के नवचंद्र के दिन
  rationale: शाब्दिक अर्थ ‘चंद्रमा के उदय/नवचंद्र पर’ है; प्राचीन मासिक तिथि-सूचक प्रयोग को स्पष्ट रखते हुए केवल ‘महीने के आरम्भ’ तक सीमित नहीं किया।
- source_word: አፈ፡ መዓምቅቲሃ፡ ለቀላይ፡ ታሕቲት
  choice: नीचे के अथाह जल की गहराइयों के मुहाने
  rationale: ‘मुख/मुहाने’, ‘गहराइयाँ’, ‘अथाह जल’ और ‘नीचे’—सभी स्रोत-तत्व सुरक्षित रखे गए हैं, यद्यपि वाक्यांश की स्तरित छवि हिन्दी में असामान्य है।
- source_word: ተርኅወ፡ ኵሉ፡ አፈ
  choice: सारे मुहाने खोल दिए गए
  rationale: स्रोत में उपस्थित निष्क्रिय क्रिया को बनाए रखा गया है; पूर्व अंग्रेज़ी पाठ में कभी छूटी हुई क्रिया को पुनः स्थापित किया गया।
theological_decisions:
- issue: जलप्रलय-वर्णन में ‘अथाह जल’ की ब्रह्मांड-संबंधी छवि
  choice: नीचे के अथाह जल की गहराइयों के मुहाने
  alternative: नीचे के महासागर के सोते
  rationale: स्रोत की बहुस्तरीय ‘गहराइयों/अथाह जल/मुहानों’ वाली भाषा को किसी परिचित बाइबलीय समानांतर के अनुसार सरल या समरूप नहीं बनाया गया।
- issue: अपूर्ण अंतिम उपवाक्य
  choice: अपूर्णता को दीर्घ विराम और पादटिप्पणी सहित बनाए रखा
  alternative: अगले पद से अनुमानित संबंधवाची पद जोड़ना
  rationale: दिए गए गीइज़ अंश का अंत ‘सारे मुहाने’ के बाद संबंधसूचक निरंतरता पर होता है; अनुपस्थित सामग्री जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘नवचंद्र’ और ‘अथाह जल’ स्रोत की प्राचीन कालगणना तथा ब्रह्मांड-संबंधी छवि को बनाए रखते हैं।
