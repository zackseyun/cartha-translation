  text: For this festival, as it is written and ordained concerning it, celebrate it. For I have written in the book of the first law what I wrote for you, that you should celebrate it at its appointed time, one day in the year. And I told you about its sacrifices, that they should be a memorial, and that the children of Israel should celebrate it in...
translation:
  language: hi
  text: क्योंकि[a] इस पर्व को, जैसा कि इसके विषय में लिखा और ठहराया गया है, मनाओ। क्योंकि मैंने पहली व्यवस्था की पुस्तक में वह लिखा है जो मैंने तुम्हारे लिए लिखा था, कि तुम इसे इसके नियत समय पर, वर्ष में एक दिन, मनाओ। और मैंने तुम्हें इसके बलिदानों के विषय में बताया है कि वे स्मरण के लिए हों, और इस्राएल की सन्तान इसे … में मनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुद्रित पाठ का आरम्भिक शब्द दूषित प्रतीत होता है; एक पाण्डुलिपि में ‘क्योंकि’ मिलता है।
    reason: स्रोत-पाठ की वास्तविक पाठभेदजन्य अनिश्चितता बताने के लिए।
lexical_decisions:
- source_word: በዓል
  choice: पर्व
  rationale: यह उत्सव अथवा धार्मिक पर्व को सूचित करता है; आधुनिक हिन्दी में ‘पर्व’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: ቍሩጽ
  choice: निर्धारित
  rationale: सन्दर्भ में लिखित रूप से ठहराई या विधिवत नियत की गई बात अभिप्रेत है; शाब्दिक ‘काटा/उकेरा’ हिन्दी में अर्थ को भटका सकता है।
- source_word: መጽሐፈ፡ ሕግ፡ ዘቀዳሚ
  choice: पहली व्यवस्था की पुस्तक
  rationale: पदबंध के ‘पहली’ और ‘व्यवस्था/विधि की पुस्तक’ दोनों घटकों को बनाए रखता है, बिना इसे किसी विशिष्ट बाद के ग्रन्थ-नाम से समान ठहराए।
- source_word: በበጊዜሃ
  choice: इसके नियत समय पर
  rationale: पर्व के ठहराए हुए समय का स्वाभाविक हिन्दी रूप।
- source_word: ቍርባኖሂ
  choice: इसके बलिदानों
  rationale: धार्मिक चढ़ावे/बलिदान के अर्थ को व्यक्त करता है; इस प्रसंग में ‘बलिदान’ अधिक स्पष्ट है।
- source_word: ዝክራነ
  choice: स्मरण के लिए
  rationale: स्रोत के स्मारक अथवा स्मरणार्थ होने के भाव को खुला रखता है।
- source_word: ደቂቀ፡ እስራኤል
  choice: इस्राएल की संतान
  rationale: वंशगत सामूहिक अभिव्यक्ति को आधुनिक, बोधगम्य हिन्दी में बनाए रखता है।
theological_decisions:
- issue: बलिदानों का ‘स्मरण’ होना
  choice: कि वे स्मरण के लिए हों
  alternative: कि वे स्मारक हों
  rationale: यह अनुवाद स्मरण के उद्देश्य को स्पष्ट करता है, पर यह नहीं जोड़ता कि स्मरण किसका या किसके द्वारा किया जाता है।
- issue: पद के अन्त में अधूरा पूर्वसर्ग
  choice: इसे ... में मनाए
  alternative: इसे पीढ़ी-दर-पीढ़ी मनाए
  rationale: गीज़ पाठ पद के अन्त में ውስተ (‘में’) पर रुकता है और वाक्य अगले पद में पूरा होता है। ‘पीढ़ी-दर-पीढ़ी’ जोड़ना स्रोत में अनुपस्थित सामग्री आयात करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। आज्ञार्थक ‘मनाओ’ और आगे एकवचन सामूहिक कर्ता ‘इस्राएल की संतान ... मनाए’ रखा गया है। अन्त का ‘... में’ जानबूझकर अधूरा है, क्योंकि वाक्य पद 23 में जारी रहता है।
