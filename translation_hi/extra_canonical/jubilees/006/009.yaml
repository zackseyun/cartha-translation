lexical_decisions:
- source_word: ወአንትሙኒ
  choice: और तुम भी
  rationale: संयोजक, बहुवचन सर्वनाम और ‘भी’ के बल को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ለሀቁ
  choice: फलवन्त हो
  rationale: संतानोत्पत्ति/फलने की आज्ञा को पारंपरिक गरिमा और आधुनिक बोधगम्यता के साथ व्यक्त करता है।
- source_word: ወብዙአ
  choice: और ... बहुत बढ़ो
  rationale: बहुगुणित होने या संख्या में बढ़ने के भाव को सहज हिन्दी में व्यक्त करता है और पहले क्रियापद से उसका अलग बल बनाए रखता है।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: स्थानसूचक पदबंध का सीधा और स्वाभाविक अनुवाद।
