  yaml_path: translation/extra_canonical/jubilees/006/002.yaml
  text: And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he sprinkled wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the Lord.
translation:
  language: hi
  text: और उसने वेदी पर चरबी चढ़ाई। फिर उसने एक बैल, एक मेढ़ा, एक भेड़, बकरी के बच्चे, नमक, एक पंडुक और कबूतर का एक बच्चा लिया। उसने वेदी पर होमबलि चढ़ाई और उन पर तेल में मिला हुआ चढ़ावा रखा। उसने दाखरस छिड़का[a], सबके ऊपर धूप रखी, और प्रभु के सामने ग्रहणयोग्य मनभावनी सुगंध ऊपर चढ़ाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाखरस उंडेला”; पर मूल क्रिया का अधिक सीधा अर्थ “छिड़का” है।
    reason: गीज़ क्रिया ነዝኀ के ‘छिड़कने’ के मूल अर्थ को बनाए रखते हुए पेय-बलि के संदर्भ से उत्पन्न वैकल्पिक समझ दर्ज करता है।
lexical_decisions:
- source_word: ሥብሐ
  choice: चरबी
  rationale: यहाँ बलिदान के चर्बी वाले भाग का संकेत है; हिन्दी में ‘चरबी’ सीधा और अनुष्ठानिक संदर्भ में स्पष्ट है।
- source_word: በገዐ
  choice: भेड़
  rationale: गीज़ पद पशुओं की सूची में भेड़ को सूचित करता है; निकटवर्ती ‘मेढ़ा’ से भेद बनाए रखा गया है।
- source_word: አጣሊ
  choice: बकरी के बच्चे
  rationale: बहुवचन ‘kids’ के अनुरूप आयु और पशु-प्रकार दोनों स्पष्ट किए गए हैं।
- source_word: ጼወ
  choice: नमक
  rationale: स्रोत की बलिदानी सामग्री की सूची में नमक का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: መንጢጠ
  choice: पंडुक
  rationale: यह turtledove का मानक हिन्दी पक्षी-नाम है और अगले ‘कबूतर के बच्चे’ से भेद रखता है।
- source_word: ጽንሓሐ
  choice: होमबलि
  rationale: संदर्भ में वेदी पर पूर्णतः जलाए जाने वाले बलिदान का पारंपरिक और समझने योग्य हिन्दी पद।
- source_word: አውሰ፡ በቅብዕ
  choice: तेल में मिला हुआ अन्नबलि का चढ़ावा
  rationale: तेल-मिश्रित अर्पण को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘अन्नबलि’ संदर्भगत बलिदानी भेंट को स्पष्ट करता है।
- source_word: ነዝኀ
  choice: छिड़का
  rationale: गीज़ क्रिया का मूल अर्थ छिड़कना/बिखेरना है, न कि केवल उंडेलना।
- source_word: ዕጣነ
  choice: धूप
  rationale: यहाँ सुगंधित धूप/incense अभिप्रेत है; आधुनिक धार्मिक हिन्दी में ‘धूप’ स्वाभाविक है।
- source_word: መዐዛ፡ ሠናየ
  choice: मनभावनी सुगंध
  rationale: ‘अच्छी/सुखद सुगंध’ के बलिदानी मुहावरे को सहज और गरिमापूर्ण हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय संबोधन እግዚአብሔር
  choice: प्रभु
  alternative: यहोवा
  rationale: स्रोत में सामान्य ‘प्रभु’ पद है, विशिष्ट दिव्य नाम YHWH का संकेत नहीं; इसलिए उसे आयात नहीं किया गया।
- issue: सुगंध की ग्रहणयोग्यता
  choice: जो प्रभु के सामने ग्रहणयोग्य थी
  alternative: जिससे प्रभु प्रसन्न हुए
  rationale: स्रोत के ‘प्रभु के सामने प्रसन्न/स्वीकार्य’ भाव को रखा गया है, पर ईश्वर की प्रतिक्रिया को पाठ से अधिक स्पष्ट करके नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। बलिदानी शब्दावली में ‘वेदी’, ‘होमबलि’, ‘अन्नबलि’ और ‘प्रभु’ जैसे प्रचलित बाइबलीय पद रखे गए हैं; वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
