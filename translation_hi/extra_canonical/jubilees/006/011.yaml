base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/011.yaml
  text: Therefore I have said that you also shall make a covenant with the children of Israel in this month on the mountain, with an oath; and you shall sprinkle blood on them because of all the words of the covenant that God made with them for all days.
translation:
  language: hi
  text: इस कारण मैंने कहा कि तुम भी इसी महीने पहाड़ पर इस्राएल की संतानों के साथ शपथ खाकर वाचा बाँधोगे; और उस वाचा की सभी बातों के कारण, जिसे परमेश्वर ने उनके साथ सदा के लिए बाँधी थी, तुम उन पर लहू छिड़कोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳን
  choice: वाचा
  rationale: यह शब्द औपचारिक और बाध्यकारी covenant को व्यक्त करता है तथा हिन्दी बाइबलीय भाषा में स्वाभाविक है।
- source_word: ደቂቀ እስራኤል
  choice: इस्राएल की संतानें
  rationale: मूल के ‘इस्राएल के पुत्र/वंशज’ भाव को समावेशी और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ማሕላ
  choice: शपथ
  rationale: मूल में वाचा की पुष्टि करने वाली oath का स्पष्ट अर्थ है; ‘शपथ खाकर’ हिन्दी में स्वाभाविक क्रियात्मक प्रयोग है।
- source_word: ደመ
  choice: लहू
  rationale: बलिदान और वाचा के औपचारिक प्रसंग में ‘लहू’ गरिमापूर्ण तथा परिचित बाइबलीय शब्द है।
- source_word: ለኵሉ መዋዕል
  choice: सदा के लिए
  rationale: शाब्दिक ‘सभी दिनों के लिए’ का स्वाभाविक हिन्दी समतुल्य, जो स्थायी अवधि का भाव सुरक्षित रखता है।
theological_decisions:
- issue: እግዚአብሔር का ईश-नामात्मक अनुवाद
  choice: परमेश्वर
  alternative: प्रभु
  rationale: इस गीइज़ पद में እግዚአብሔር सामान्यतः ‘God’ के रूप में समझा जाता है; ‘परमेश्वर’ अनावश्यक रूप से टेट्राग्राम ‘यहोवा/प्रभु’ को आरोपित नहीं करता।
- issue: वाचा और शपथ का संबंध
  choice: शपथ खाकर वाचा बाँधोगे
  alternative: शपथ के साथ वाचा बाँधोगे
  rationale: मूल दोनों को साथ रखता है; हिन्दी में क्रियात्मक रूप संबंध को स्पष्ट करता है, बिना शपथ और वाचा को एक ही वस्तु मानने के।
- issue: लहू छिड़कने का आधार
  choice: वाचा की उन सभी बातों के कारण
  alternative: वाचा की सभी बातों के विषय में
  rationale: गीइज़ በእንተ कारण, विषय या संबंध का भाव दे सकता है। यहाँ अंग्रेज़ी परामर्श-पाठ के अनुरूप कारणात्मक रूप रखा गया है, जबकि वाक्य को किसी विशिष्ट प्रायश्चित्त-सिद्धांत तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। ‘वाचा बाँधना’, ‘शपथ खाना’ और ‘लहू छिड़कना’ हिन्दी में सहज हैं और मूल के अनुष्ठानिक स्वर को बनाए रखते हैं।
