base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/018.yaml
  text: And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah's death. And from the day of Noah's death his sons corrupted it until the days of Abraham, and they ate blood.
translation:
  language: hi
  text: और यह पूरा पर्व सृष्टि के दिन से लेकर नूह के दिनों तक स्वर्ग में मनाया जाता रहा—सोलह[a] जुबली और पाँच वर्ष-सप्ताह तक। नूह और उसके पुत्रों ने इसका पालन सात जुबली और एक वर्ष-सप्ताह तक, नूह की मृत्यु के दिन तक किया। नूह की मृत्यु के दिन से लेकर अब्राहम के दिनों तक नूह के पुत्रों ने इसे भ्रष्ट कर दिया, और उन्होंने लहू खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में यहाँ शाब्दिक रूप से ‘सोलह’ है; कुछ पाठ-परंपराएँ और अनुवाद ‘छब्बीस’ पढ़ते हैं।
    reason: प्रस्तुत गीज़ पाठ और अंग्रेज़ी POB audit trail में परिलक्षित भिन्न गणना को छिपाए बिना बताना आवश्यक है।
lexical_decisions:
- source_word: በዓል
  choice: पर्व
  rationale: यह शब्द धार्मिक उत्सव या नियत पर्व को दर्शाता है; ‘पर्व’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ኢዮቤልዉ
  choice: जुबली
  rationale: यह उनचास-वर्षीय कालखंड की पारिभाषिक संज्ञा है; इसे लिप्यंतरित रखने से ‘जुबली’ और ‘वर्ष-सप्ताह’ के बीच स्रोत का भेद बना रहता है।
- source_word: ሱባዔ፡ ዓመት / ሱባዔ፡ ዓመታት
  choice: वर्ष-सप्ताह
  rationale: शाब्दिक अर्थ ‘वर्षों का सप्ताह’ अर्थात सात वर्षों का कालखंड है; संक्षिप्त यौगिक रूप गणनात्मक अर्थ सुरक्षित रखता है।
- source_word: ዐቀብዋ
  choice: इसे ... माना
  rationale: मूल में सुरक्षित रखने, पालन करने या मनाने का भाव है; पर्व के संदर्भ में ‘माना’ सहज हिन्दी है और आज्ञापालन का भाव भी रखता है।
- source_word: ወይበልዑ፡ ደመ
  choice: वे लहू खाने लगे
  rationale: मूल का सीधा अर्थ ‘और उन्होंने लहू खाया’ है; ‘खाने लगे’ प्रसंग में आरम्भ हुई प्रथा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘लहू’ धार्मिक-प्राचीन संदर्भ की गरिमा बनाए रखता है।
theological_decisions:
- issue: पर्व का स्वर्ग में मनाया जाना
  choice: स्वर्ग में मनाया जाता रहा
  alternative: स्वर्ग में उसका पालन होता रहा
  rationale: निरंतर क्रिया को स्पष्ट रखते हुए पाठ के स्वर्गीय पालन के दावे को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- issue: नूह के पुत्रों द्वारा पर्व को भ्रष्ट करना
  choice: इसे भ्रष्ट कर दिया
  alternative: वे इसके विषय में भ्रष्ट हो गए
  rationale: परामर्श-पाठ और वाक्य-संदर्भ पर्व को कर्म के रूप में समझते हैं; फिर भी हिन्दी में ऐसा रूप रखा गया है जो रीति के बिगाड़े जाने को बताता है, किसी विशिष्ट धार्मिक सिद्धांत को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। कालगणना की विशिष्ट शब्दावली ‘जुबली’ और ‘वर्ष-सप्ताह’ के रूप में अलग रखी गई है। मुख्य पाठ स्रोत में प्रत्यक्ष ‘सोलह’ को ग्रहण करता है और पाठांतर को पादटिप्पणी में सुरक्षित रखता है।
