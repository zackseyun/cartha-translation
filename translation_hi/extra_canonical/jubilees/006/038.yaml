base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/038.yaml
  text: Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year three hundred and sixty-four days only. Therefore they will go wrong concerning the new moons and seasons and sabbaths and festivals, and they will eat all the blood with all flesh.
translation:
  language: hi
  text: इसलिए मैं तुझे आज्ञा देता हूँ और तुझे गवाही देकर चेतावनी देता हूँ, ताकि तू भी उन्हें गवाही देकर चेतावनी दे; क्योंकि तेरी मृत्यु के बाद तेरी संतान इसे बिगाड़ देगी और वर्ष की गणना केवल तीन सौ चौंसठ दिनों की नहीं करेगी। इसी कारण वह नवचंद्रों, नियत समयों, सब्तों और पर्वों के विषय में भटक जाएगी, और समस्त रक्त को समस्त मांस के साथ खाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “सारा रक्त सारे मांस के साथ।” यह वाक्यांश व्यापक है और मूल पाठ यह स्पष्ट नहीं करता कि आशय हर प्रकार के रक्त और मांस से है या मांस को उसके रक्त समेत खाने से।'
    reason: मूल के असामान्य वाक्य-विन्यास और उसकी वास्तविक अर्थगत अस्पष्टता को पाठक के सामने रखना।
lexical_decisions:
- source_word: አስምዕ / ታስምዕ
  choice: तेरे सामने गवाही देता हूँ / उनके सामने गवाही दे
  rationale: धातु के साक्ष्य देने अथवा साक्षी ठहराने वाले अर्थ और प्रसंग के गंभीर, वाचागत स्वर को बनाए रखता है; केवल ‘बताना’ इस भार को कम कर देता।
- source_word: ያማስኑ
  choice: इसे बिगाड़ देंगी
  rationale: मूल में भ्रष्ट या विकृत करने का भाव है; यहाँ निकटतम पूर्ववर्ती विषय वर्ष-गणना की व्यवस्था है, इसलिए सर्वनाम की अस्पष्टता को यथासंभव बनाए रखा गया है।
- source_word: ኢይገብሩ፡ ዓመተ
  choice: वर्ष की गणना ... नहीं करेंगी
  rationale: शाब्दिक ‘वर्ष को नहीं बनाएँगी’ हिंदी में अस्वाभाविक है; पंचांग-संदर्भ में इसका स्वाभाविक अर्थ वर्ष को इतने दिनों का गिनना या निर्धारित करना है।
- source_word: ሠርቀ
  choice: नवचंद्रों
  rationale: पंचांग-सूची में यह चंद्र-मास के आरंभ अथवा नवचंद्र का संकेत देता है; बहुवचन हिंदी में आवर्ती पंचांग-विषय को व्यक्त करता है।
- source_word: ጊዜ
  choice: नियत समयों
  rationale: सामान्य ‘समय’ संभव है, पर सब्तों और पर्वों की सूची में निर्धारित धार्मिक-पंचांगीय अवसर अभिप्रेत हैं।
- source_word: ኵሎ፡ ደመ፡ ምስለ፡ ኵሉ፡ ሥጋ
  choice: समस्त रक्त को समस्त मांस के साथ
  rationale: मूल की दोहरी व्यापकता और असामान्य तनाव को किसी विशिष्ट व्याख्या में बदले बिना निकटता से सुरक्षित रखा गया है।
theological_decisions:
- issue: आज्ञा के साथ साक्ष्य की वाचागत गंभीरता
  choice: ‘गवाही देता हूँ ... गवाही दे’
  alternative: ‘तुझे बताता हूँ ... उन्हें बता’
  rationale: मूल क्रिया का साक्ष्य-संबंधी अर्थ संभव और प्रसंगानुकूल है; यह पाठ को किसी संप्रदायगत सिद्धांत से जोड़े बिना उसकी गंभीरता बनाए रखता है।
- issue: रक्त और मांस का अंतिम निषेधात्मक कथन
  choice: असामान्य व्यापक वाक्यांश को शाब्दिक निकटता से रखना
  alternative: ‘हर प्रकार का रक्त हर प्रकार के मांस के साथ’ या ‘मांस को उसके रक्त समेत’
  rationale: वैकल्पिक रूप अर्थ को स्पष्ट करते हुए मूल की संभावित व्यापकता को सीमित कर सकते हैं; इसलिए मुख्य पाठ में वास्तविक तनाव सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध शैली। एकवचन संबोधन के लिए ‘तू/तेरे’ रखा गया है, क्योंकि वक्ता का संबोधन निकट और प्रत्यक्ष है; क्रियाएँ ‘संतानें’ के व्याकरणिक बहुवचन के अनुसार हैं। पंचांग-संबंधी पदों में अनावश्यक तकनीकी शब्दावली से बचते हुए ‘नवचंद्र’, ‘नियत समय’, ‘सब्त’ और ‘पर्व’ चुने गए हैं।
