base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/037.yaml
  text: Therefore years will come upon them when they disturb the order, and they will make a day of testimony an abominable day, and an unclean day a festival day, and they will mix up all the holy days with the unclean, and the unclean day with the holy; for they will go wrong as to months and sabbaths and festivals and jubilees.
translation:
  language: hi
  text: इस कारण उन पर ऐसे वर्ष आएँगे जब वे क्रम को बिगाड़ देंगे। वे साक्षी के दिन को घृणित दिन[a] और अशुद्ध दिन को पर्व-दिन बना देंगे। वे सभी पवित्र दिनों को अशुद्ध दिनों के साथ, और अशुद्ध दिन को पवित्र दिन के साथ मिला देंगे; क्योंकि वे महीनों, सब्तों, पर्वों और योबेल-वर्षों के सम्बन्ध में भटक जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पाठ-व्याख्याओं में क्रम उलटा समझा गया है: “वे घृणित दिन को साक्षी का दिन बना देंगे।”'
    reason: गीज़ वाक्यांश के पूर्व प्रचलित उलटे व्याकरणिक विश्लेषण को दर्ज करना; मुख्य पाठ में स्रोत-समीक्षा द्वारा समर्थित क्रम रखा गया है।
lexical_decisions:
- source_word: ያማስኑ
  choice: व्यवस्था को बिगाड़ देंगे
  rationale: क्रिया में भ्रष्ट करने या क्रम बिगाड़ने का भाव है; प्रसंग पंचांग और पवित्र समयों की व्यवस्था का है।
- source_word: ዕለተ፡ ስምዐ
  choice: साक्षी का दिन
  rationale: गीज़ पद का निकट और अर्थपूर्ण रूप, जो दिन की विशिष्ट धार्मिक पहचान को अनिर्धारित रखते हुए सुरक्षित रखता है।
- source_word: ምግንተ
  choice: घृणित दिन
  rationale: निन्दनीय, जुगुप्सित या घृणित होने का मूल्यांकन व्यक्त करता है और पवित्र दिन के पतन से विरोध बनाए रखता है।
- source_word: ሰንበታት
  choice: सब्तों
  rationale: बहुवचन और धार्मिक-सांस्कृतिक पद दोनों सुरक्षित रहते हैं।
- source_word: ኢዮቤል
  choice: जयन्ती-वर्षों
  rationale: यहाँ सामान्य उत्सव नहीं, गणना किए जाने वाले जुबिली-वर्ष अभिप्रेत हैं; 'वर्षों' जोड़ने से आधुनिक हिन्दी में आशय स्पष्ट होता है।
theological_decisions:
- issue: साक्षी के दिन और घृणित दिन का व्याकरणिक संबंध
  choice: वे साक्षी के दिन को घृणित दिन बना देंगे
  alternative: वे घृणित दिन को साक्षी का दिन बना देंगे
  rationale: स्रोत में ‘साक्षी का दिन’ प्रत्यक्ष कर्म और ‘घृणित’ उसका विधेयपूरक जान पड़ता है; इससे आगे के विपरीत कथन—अशुद्ध दिन को पर्व बनाना—के साथ समानांतरता बनती है।
- issue: पवित्र और अशुद्ध दिनों का मिश्रण
  choice: दोनों दिशाओं को स्पष्ट रूप से बनाए रखा
  alternative: सामान्यीकृत रूप में केवल पवित्र और अशुद्ध दिनों को मिला देना
  rationale: मूल पाठ पवित्र को अशुद्ध से और अशुद्ध को पवित्र से मिलाने की उलटी दिशाओं पर बल देता है; धार्मिक तनाव को संक्षिप्त करके मिटाना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सब्त’ और ‘जयन्ती-वर्ष’ जैसे प्रसंग-विशिष्ट धार्मिक शब्द बनाए गए हैं। फुटनोट-चिह्न को संबंधित विवादित वाक्य के बजाय पद के अंत में रखा गया है ताकि मुख्य वाक्य का प्रवाह न टूटे।
