  text: For this reason it is ordained and written on the heavenly tablets that they should celebrate the Feast of Weeks in this month, once each year, to renew the covenant every year.
translation:
  language: hi
  text: इसी कारण यह ठहराया गया और स्वर्गीय पट्टियों पर लिखा गया कि वे इसी महीने में सप्ताहों का पर्व मनाएँ—हर वर्ष एक बार—ताकि हर वर्ष वाचा का नवीकरण करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: ठहराया गया
  rationale: यह विधिवत निर्धारित या नियत किए जाने का भाव व्यक्त करता है और निष्क्रिय रूप को बनाए रखता है।
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टियों
  rationale: शाब्दिक अर्थ ‘स्वर्ग की पट्टियाँ’ है; ‘स्वर्गीय पट्टियाँ’ हिन्दी में स्वाभाविक और पारंपरिक अभिव्यक्ति है।
- source_word: በዓል፡ ዘሱባዔ
  choice: सप्ताहों का पर्व
  rationale: पर्व के नाम का स्रोत-संगत अर्थ है; इसे सामान्य पाठक के लिए स्पष्ट रखते हुए विशिष्ट पर्वनाम के रूप में प्रस्तुत किया गया है।
- source_word: ምዕረ፡ ለዓመት
  choice: हर वर्ष एक बार
  rationale: वार्षिक एकबारगी आयोजन का आशय स्पष्ट करता है।
- source_word: ለሐዲስ፡ ኪዳን
  choice: वाचा को नया करें
  rationale: ‘वाचा’ बाइबलीय covenant के लिए सटीक और प्रचलित शब्द है; क्रिया नवीकरण का उद्देश्य व्यक्त करती है।
- source_word: በኵሉ፡ ዓም፡ ወዓመት
  choice: हर वर्ष
  rationale: मूल की वार्षिक पुनरावृत्ति को बनाए रखता है, यद्यपि पिछले वाक्यांश में भी वर्ष का उल्लेख है।
theological_decisions:
- issue: वाचा के नवीकरण का कर्ता
  choice: ‘वे ... वाचा को नया करें’
  alternative: ‘वाचा हर वर्ष नई की जाए’
  rationale: मूल वाक्य में पर्व मनाने वालों से जुड़ा उद्देश्य अधिक स्वाभाविक है; फिर भी यह नहीं जोड़ा गया कि वे वाचा को स्वयं स्थापित करते हैं।
- issue: स्वर्गीय पट्टियों पर विधान
  choice: ‘यह ठहराया गया और ... लिखा गया’
  alternative: ‘उसने इसे ठहराया और लिखा’
  rationale: मूल के निष्क्रिय रूप को सुरक्षित रखा गया है और अनिर्दिष्ट कर्ता की पहचान नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल शैली। मूल की पुनरुक्ति—‘हर वर्ष एक बार’ और ‘हर वर्ष’—अर्थगत बल के कारण सुरक्षित रखी गई है।
