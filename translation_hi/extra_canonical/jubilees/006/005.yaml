base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/005.yaml
  text: And as for you, be fruitful and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.
translation:
  language: hi
  text: और तुम फलो-फूलो और पृथ्वी पर बढ़ो; उस पर बहुत हो जाओ और पृथ्वी के लिए आशीष बनो। मैं तुम्हारा भय और आतंक पृथ्वी पर और समुद्र में जो कुछ है, उस सब पर डालूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሀቁ፡ ወተባዝኁ
  choice: फलो-फूलो और ... बढ़ते जाओ
  rationale: यह प्रजनन और बहुगुणित होने की आशीष-सूत्र भाषा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘फलो-फूलो’ पहले पद की फलवन्तता को बनाए रखता है।
- source_word: ወብዙኁ ላዕሌሃ
  choice: उस पर बहुत हो जाओ
  rationale: पृथ्वी पर संख्या में बहुत हो जाने का स्रोतार्थ सीधे बनाए रखा गया है।
- source_word: ወኩኑ ለበረከት ላዕሌሃ
  choice: उसके लिए आशीष बनो
  rationale: ‘आशीष बनो’ की आज्ञा को पृथ्वी से सम्बद्ध रखते हुए अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: ፍርሀትክሙ፡ ወረዓድክሙ
  choice: तुम्हारा भय और आतंक
  rationale: दो समानार्थी किन्तु तीव्रता में भिन्न संज्ञाओं को अलग रखा गया है; दूसरा पद अधिक प्रबल दहशत सूचित करता है।
- source_word: ኵሉ፡ ዘውስተ፡ ምድር፡ ወዘውስተ፡ ባሕር
  choice: पृथ्वी और समुद्र में रहनेवाले हर प्राणी
  rationale: शाब्दिक ‘हर वह जो ... में है’ को हिन्दी में स्वाभाविक बनाया गया है। सन्दर्भ सजीव प्राणियों का है, इसलिए ‘प्राणी’ स्पष्ट किन्तु सीमित पूर्ति है।
theological_decisions:
- issue: मनुष्यों के भय का विस्तार
  choice: पृथ्वी और समुद्र में रहनेवाले हर प्राणी पर
  alternative: पृथ्वी और समुद्र की हर वस्तु पर
  rationale: स्रोत का व्याकरण व्यापक ‘सब कुछ/हर वह जो’ कह सकता है, पर भय और आतंक ग्रहण करने के प्रसंग में सजीव प्राणियों का अर्थ अपेक्षित है। इसे किसी विशिष्ट जीव-वर्ग तक सीमित नहीं किया गया।
- issue: आशीष का सम्बन्ध
  choice: उसके लिए आशीष बनो
  alternative: उस पर आशीषित रहो
  rationale: गीज़ पाठ में ‘आशीष के लिए/आशीष बनो’ का भाव है; इसलिए मनुष्यों को पृथ्वी के लिए आशीष बनने की आज्ञा के रूप में रखा गया, न कि केवल स्वयं आशीष पाने के रूप में।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। आशीष-सूत्र की पुनरुक्ति को संक्षिप्त करने के बजाय सुरक्षित रखा गया है।
