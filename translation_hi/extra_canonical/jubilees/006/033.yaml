  yaml_path: translation/extra_canonical/jubilees/006/033.yaml
  text: And all the children of Israel will forget, and will not find the path of the years, and they will forget the new moons and appointed times and sabbaths, and they will go wrong as to the whole order of the years.
translation:
  language: hi
  text: और इस्राएल की सारी संतान भूल जाएगी और वर्षों का मार्ग नहीं पा सकेगी। वे नवचंद्रों, नियत समयों और सब्तों को भूल जाएँगे, और वर्षों की पूरी व्यवस्था के बारे में गलती करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎሙ፡ ውሉደ፡ እስራኤል
  choice: इस्राएल की सारी संतान
  rationale: मूल के ‘इस्राएल की समस्त संतान’ को स्वाभाविक और सामूहिक अर्थ में रखा गया है।
- source_word: ፍኖተ፡ ዓመታት
  choice: वर्षों का मार्ग
  rationale: मूल रूपक को बनाए रखा गया है; संदर्भ में यह वर्षों की गणना अथवा पंचांगीय क्रम की ओर संकेत करता है, पर अनुवाद में उसे स्पष्ट करके सीमित नहीं किया गया।
- source_word: ሠርቀ
  choice: नवचंद्रों
  rationale: शाब्दिक रूप से चंद्रमा के उदय/नए चंद्रमा का बोध; यहाँ पंचांगीय संदर्भ में ‘नवचंद्र’ उपयुक्त है।
- source_word: ጊዜ
  choice: नियत समयों
  rationale: सामान्य ‘समयों’ के साथ यहाँ धार्मिक-पंचांगीय नियत अवसरों का भाव है; ‘नियत समय’ उस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ሰንበተ
  choice: सब्तों
  rationale: विशिष्ट धार्मिक विश्राम-दिवस के तकनीकी अर्थ को सुरक्षित रखने के लिए पारंपरिक ‘सब्त’ रखा गया है।
- source_word: ኵሎ፡ ሥርዐተ፡ ዘዓመታት
  choice: वर्षों की पूरी व्यवस्था
  rationale: मूल में वर्षों के समग्र क्रम/विधान का भाव है; ‘पूरी व्यवस्था’ अर्थ और गरिमा दोनों बनाए रखती है।
- source_word: ይጌግዩ
  choice: भटक जाएँगे
  rationale: क्रिया के चूकने, गलती करने या मार्ग से हटने के भाव को संदर्भानुकूल ‘भटक जाना’ से व्यक्त किया गया है।
theological_decisions:
- issue: पंचांगीय भाषा की व्याख्यात्मक सीमा
  choice: ‘वर्षों का मार्ग’ और ‘वर्षों की पूरी व्यवस्था’ जैसे मूल रूपकों को बनाए रखा गया।
  alternative: इन्हें ‘वर्षों की सही गणना’ अथवा किसी विशिष्ट कैलेंडर-पद्धति के रूप में स्पष्ट करना।
  rationale: पद पंचांग-संबंधी भूल का संकेत देता है, पर स्वयं किसी संप्रदायगत या विशिष्ट कैलेंडर-व्याख्या को स्पष्ट नहीं करता; इसलिए तनाव और व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली। ‘नवचंद्र’, ‘नियत समय’ और ‘सब्त’ जैसे पद धार्मिक-पंचांगीय अर्थ को सुरक्षित रखते हैं; वाक्य-विन्यास को हिन्दी में सहज बनाने के लिए दो वाक्यों में प्रस्तुत किया गया है।
