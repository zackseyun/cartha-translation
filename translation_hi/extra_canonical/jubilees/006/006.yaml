  yaml_path: translation/extra_canonical/jubilees/006/006.yaml
  text: And behold, I have given you all the beasts and everything that flies and everything that moves on the earth, and the fish in the waters, and everything for food; like the green plants I have given you everything to eat.
translation:
  language: hi
  text: और देखो, मैंने तुम्हें सभी जंगली पशु, उड़नेवाले सभी जीव, धरती पर चलनेवाले सभी जीव, जल की मछलियाँ और भोजन के लिए सब कुछ दे दिया है। जैसे मैंने हरे पौधे दिए थे, वैसे ही मैंने तुम्हें सब कुछ खाने के लिए दे दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊተ
  choice: जंगली पशु
  rationale: गीज़ बहुवचन संज्ञा पशुओं/वन्य जीवों को सूचित करती है; सूची में प्राणी-वर्ग के रूप में स्वाभाविक हिन्दी।
- source_word: ዘይሰርር
  choice: उड़नेवाले सभी जीव
  rationale: क्रिया का अर्थ ‘उड़ना’ है; इससे पूर्ववर्ती गलत अर्थ ‘चलना/जीना’ से बचते हुए पक्षी-जगत का वर्ग स्पष्ट रहता है।
- source_word: ዘይትሐወስ
  choice: धरती पर चलनेवाले सभी जीव
  rationale: शब्द गति करने, चलने या रेंगने का व्यापक भाव रखता है; ‘चलनेवाले’ हिन्दी में इस वर्ग को अनावश्यक रूप से केवल रेंगनेवाले जीवों तक सीमित नहीं करता।
- source_word: ለሲሲት
  choice: भोजन के लिए
  rationale: यहाँ उद्देश्य/उपयोग के रूप में खाने या आहार का भाव है; ‘भोजन के लिए’ वाक्य में सहज और स्पष्ट है।
- source_word: ሐምለ፡ ሣዕር
  choice: हरे पौधे
  rationale: शाब्दिक रूप से हरियाली/घास-सदृश वनस्पति; उत्पत्ति-सदृश संदर्भ में ‘हरे पौधे’ स्वाभाविक और पर्याप्त व्यापक है।
theological_decisions:
- issue: प्राणियों को भोजन के रूप में देने की व्यापकता
  choice: ‘सब कुछ खाने के लिए’ की व्यापक अभिव्यक्ति बनाए रखी गई
  alternative: इसे केवल कुछ विशेष पशुओं या वनस्पति तक सीमित करना
  rationale: स्रोत का ኵሎ (‘सब/सब कुछ’) बार-बार व्यापकता पर बल देता है; पाठ स्वयं यहाँ कोई आहार-संबंधी अतिरिक्त सीमा व्यक्त नहीं करता।
- issue: हरे पौधों से तुलना का काल-संबंध
  choice: ‘जैसे मैंने हरे पौधे दिए थे, वैसे ही’
  alternative: ‘हरे पौधों के समान’ बिना पूर्व दान का संकेत
  rationale: स्रोत में देने की क्रिया पुनः आती है और तुलना पूर्व में दिए गए पौधों से है; हिन्दी में ‘दिए थे’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है, बिना अतिरिक्त सिद्धान्त जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथन। ‘और देखो’ से मूल का उद्घोषात्मक ወናሁ सुरक्षित रखा गया है। प्राणी-वर्गों की पुनरावृत्त संरचना यथासंभव बनाए रखते हुए हिन्दी वाक्य को पठनीय बनाया गया है।
