revisions:
- from: परन्तु केवल अब्राहम ने इसका पालन किया; और इसहाक, याकूब और उसकी सन्तान ने भी तुम्हारे दिनों तक इसका पालन किया। पर तुम्हारे दिनों में इस्राएल की सन्तान इसे भूल गई, जब तक कि मैंने इस पर्वत पर उनके लिए इसे फिर से स्थापित नहीं किया।
  to: परन्तु अब्राहम ने ही इसका पालन किया; और इसहाक, याकूब और उसके पुत्रों ने तुम्हारे दिनों तक इसका पालन किया। पर तुम्हारे दिनों में इस्राएल की सन्तान इसे भूल गई, जब तक कि मैंने इस पर्वत पर उनके लिए इसे पुनः स्थापित नहीं किया।
