base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/019.yaml
  text: But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.
translation:
  language: hi
  text: परन्तु अब्राहम ने ही इसका पालन किया; और इसहाक, याकूब और उसके पुत्रों ने तुम्हारे दिनों तक इसका पालन किया। पर तुम्हारे दिनों में इस्राएल की सन्तान इसे भूल गई, जब तक कि मैंने इस पर्वत पर उनके लिए इसे पुनः स्थापित नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕቲቱ
  choice: केवल
  rationale: यह शब्द अब्राहम को अन्य लोगों से अलग करते हुए ‘अकेले/केवल’ का भाव देता है; स्वाभाविक हिन्दी में ‘केवल अब्राहम’ चुना गया।
- source_word: ዐቀበ / ዐቀብዋ
  choice: इसका पालन किया
  rationale: मूल क्रिया में सुरक्षित रखने, मानने या पालन करने का अर्थ हो सकता है। प्रसंग किसी निर्धारित विधान/पर्व के निर्वाह का है, इसलिए ‘पालन किया’ उपयुक्त है।
- source_word: ረከቡ
  choice: भूल गई
  rationale: प्रस्तुत गीइज़ पाठ का सतही रूप सामान्यतः ‘पाया/प्राप्त किया’ से जुड़ सकता है, पर वाक्य-संरचना, अंग्रेज़ी परामर्श-पाठ और इस पद की पाठ-परंपरा यहाँ भूल जाने का अर्थ दर्शाते हैं। इसे पाठगत तनाव के रूप में टिप्पणी में दर्ज किया गया है।
- source_word: ኀይስክዎሙ
  choice: उनके लिए इसे फिर से स्थापित किया
  rationale: क्रिया में नया करने, पुनर्स्थापित करने या सुधारने का भाव है। विधान को पुनः प्रभावी करने के प्रसंग में ‘फिर से स्थापित किया’ स्वाभाविक और अर्थ-संगत है।
- source_word: ደብር
  choice: पर्वत
  rationale: यहाँ मूसा को संबोधन और विधान के नवीकरण का स्थान संदर्भित है; ‘पर्वत’ सीधा और तटस्थ अनुवाद है।
theological_decisions:
- issue: ‘इसे’ किस वस्तु की ओर संकेत करता है
  choice: सर्वनाम ‘इसे’ को बिना व्याख्यात्मक संज्ञा जोड़े बनाए रखा गया
  alternative: ‘सप्ताहों के पर्व’ अथवा ‘विधान’ को स्पष्ट रूप से जोड़ना
  rationale: मूल पद में संकेतवाचक का आशय निकटवर्ती प्रसंग से मिलता है। पद के भीतर नाम जोड़ना वास्तविक संदर्भगत निर्भरता और सम्भावित व्यापकता को अनावश्यक रूप से सीमित करता।
- issue: ईश्वरीय क्रिया का स्वरूप
  choice: ‘फिर से स्थापित किया’
  alternative: ‘नया किया’ या ‘फिर से प्रकट किया’
  rationale: इससे मूल का नवीकरणात्मक भाव बचता है, पर यह अतिरिक्त धर्मशास्त्रीय दावा नहीं करता कि विधान बिल्कुल नया बनाया गया या केवल बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। ‘सन्तान’ सामूहिक अर्थ में एकवचन क्रिया के साथ प्रयुक्त है। आरम्भिक विरोध को स्पष्ट करने के लिए ‘परन्तु’ और दूसरे वाक्य में प्रसंगगत मोड़ के लिए ‘पर’ रखा गया है।
