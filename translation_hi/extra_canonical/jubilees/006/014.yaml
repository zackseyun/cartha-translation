base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/014.yaml
  text: And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day, at morning and evening. They shall make atonement for it continually before the Lord, so that they may keep it and not be uprooted.
translation:
  language: hi
  text: इस व्यवस्था के लिए दिनों की कोई सीमा नहीं है, क्योंकि यह सदा के लिए है। वे पीढ़ी-दर-पीढ़ी इसका पालन करें, ताकि वे तुम्हारे लिए[a] वेदी के सामने लहू के साथ प्रतिदिन—सुबह और शाम—विनती करते रहें। वे उसके लिए[b] प्रभु के सामने निरन्तर प्रायश्चित करते रहें, ताकि वे इसका पालन करें और जड़ से न उखाड़े जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी ओर से।”
    reason: गीइज़ पदबंध प्रतिनिधित्व अथवा हित—दोनों अर्थ दे सकता है।
  - marker: b
    text: शाब्दिक रूप से, “उसके लिए”; सर्वनाम किसकी ओर संकेत करता है, यह निश्चित नहीं है।
    reason: मूल पाठ के सर्वनाम का पूर्वपद अस्पष्ट है, इसलिए संभावित संदर्भ को किसी एक अर्थ तक सीमित नहीं किया गया।
lexical_decisions:
- source_word: ዐቅመ፡ መዋዕል
  choice: दिनों की कोई सीमा
  rationale: ‘माप/परिमाण’ और ‘दिनों’ के संयोग को स्वाभाविक हिन्दी में काल-सीमा के रूप में व्यक्त किया गया है।
- source_word: ይትመሀለሉ
  choice: विनती करते रहें
  rationale: यह क्रिया प्रार्थना, याचना या अनुनय करने का बोध देती है; इसे बाद की प्रायश्चित-सूचक क्रिया से अलग रखा गया है।
- source_word: በደም
  choice: लहू के साथ
  rationale: मूल पाठ के बलिदानी संदर्भ और साधन/सहचर्य की अभिव्यक्ति को स्पष्ट किंतु अनिर्णायक रूप में सुरक्षित रखता है।
- source_word: ያስተሰርዩ
  choice: प्रायश्चित करें
  rationale: यह पहले प्रयुक्त ‘विनती करें’ से भिन्न, प्रायश्चित अथवा दोष-निवारण कराने वाली क्रिया है।
- source_word: ኢይሠረዉ
  choice: जड़ से न उखाड़े जाएँ
  rationale: निष्क्रिय बहुवचन रूप के उखाड़े या निर्मूल किए जाने के गंभीर परिणाम को सुरक्षित रखता है; ‘उपेक्षा न करें’ अर्थसंगत नहीं है।
theological_decisions:
- issue: विनती और प्रायश्चित के संबंध को कैसे व्यक्त किया जाए
  choice: दो अलग क्रियाएँ—‘विनती करते रहें’ और ‘प्रायश्चित करें’
  alternative: दोनों को ‘प्रायश्चित करना’ कहना
  rationale: मूल गीइज़ में अलग-अलग क्रियाएँ हैं; उन्हें एक करना पाठ की धार्मिक और क्रियात्मक भिन्नता मिटा देगा।
- issue: अंतिम चेतावनी का स्वरूप
  choice: ‘जड़ से न उखाड़े जाएँ’
  alternative: ‘इसकी उपेक्षा न करें’
  rationale: मूल क्रिया निष्क्रिय रूप में उखाड़े जाने या निर्मूल होने का संकेत देती है और वाचा-संबंधी कठोर परिणाम को बनाए रखती है।
- issue: प्रायश्चित की वस्तु
  choice: सर्वनामिक अस्पष्टता बनाए रखते हुए ‘उसके लिए’
  alternative: स्पष्ट रूप से ‘व्यवस्था के लिए’ या ‘अपने लिए’
  rationale: मूल में पुल्लिंग एकवचन सर्वनाम है, पर उसका सटीक पूर्वपद निर्विवाद नहीं; अनुवाद में इसे अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘पीढ़ी-दर-पीढ़ी’, ‘लहू’, ‘वेदी’ और ‘प्रायश्चित’ जैसे परिचित धार्मिक शब्द संदर्भ की गंभीरता बनाए रखते हैं; वाक्य-विन्यास को साधारण पाठकों के लिए प्रवाहपूर्ण रखा गया है।
