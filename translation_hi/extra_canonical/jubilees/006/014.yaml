    rationale: ‘इस व्यवस्था के दिनों की कोई सीमा’ can sound as though the law itself has days. Recasting it as a limit of days ‘for this law’ is clearer while retaining the source sense.
  - severity: low
    issue: Footnote b’s literal gloss does not precisely match the translation’s ‘उसके लिए.’
    rationale: The note says ‘उसके विषय में,’ whereas the source phrase and main rendering are more directly represented by ‘उसके लिए’; the ambiguity concerns the antecedent, not a shift from ‘for’ to ‘about.’
