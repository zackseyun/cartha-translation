  text: the tops of the mountains appeared, and Noah rejoiced. Therefore he ordained them for himself as festivals for remembrance forever, and thus they are ordained.
translation:
  language: hi
  text: पहाड़ों की चोटियाँ दिखाई दीं, और नूह आनन्दित हुआ। इसलिए उसने उन्हें अपने लिए सदा के लिए स्मरण के पर्वों के रूप में ठहराया; और इसी प्रकार वे ठहराए गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስቲ፡ አድባር
  choice: पहाड़ों की चोटियाँ
  rationale: शाब्दिक अर्थ ‘पहाड़ों के सिर/शिखर’ है; आधुनिक हिन्दी में ‘चोटियाँ’ स्वाभाविक और सटीक है।
- source_word: ተፈሥሐ
  choice: आनन्दित हुआ
  rationale: क्रिया नूह के प्रसन्न या हर्षित होने को व्यक्त करती है; ‘आनन्दित हुआ’ गरिमापूर्ण और सहज है।
- source_word: ሠርዓን፡ ኪያሆን፡ ሎቱ
  choice: उसने उन्हें अपने लिए ... ठहराया
  rationale: विधान या स्थापना के भाव और कर्मवाचक सर्वनाम को सुरक्षित रखता है।
- source_word: በዓላተ፡ ለተዝካር፡ ለዓለም
  choice: सदा स्मरण के पर्वों के रूप में
  rationale: समीक्षित पूर्ण गीइज़ पाठ में उपलब्ध ‘पर्व’, ‘स्मरण’ और ‘सदा’—तीनों तत्वों को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: ወከማሁ፡ ሠርዓዋ
  choice: और इसी प्रकार वे ठहराए गए हैं
  rationale: पूर्व विधान के अनुरूप उनके स्थापित होने का निष्क्रिय भाव बनाए रखता है।
theological_decisions:
- issue: पर्वों का उद्देश्य
  choice: सदा स्मरण के पर्वों के रूप में
  alternative: सदा के पर्वों के रूप में
  rationale: पूर्ण पाठ की पदावली ለተዝካር (‘स्मरण के लिए’) को हटाना अर्थ की हानि होगी; इसलिए स्मरण का उद्देश्य स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और स्रोत-सन्निकट शैली। उपलब्ध उद्धृत गीइज़ अंश खंड-विभाजन के कारण अपूर्ण है; नवीनतम स्रोत-समीक्षा में प्रमाणित शेष पाठ के आधार पर ‘स्मरण के पर्व’ और अंतिम उपवाक्य सुरक्षित रखे गए हैं।
