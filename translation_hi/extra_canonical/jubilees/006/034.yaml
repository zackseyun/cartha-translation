base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/034.yaml
  text: For I know, and from now on I will make it known to you—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ, और अब से मैं इसे तुम्हें बताऊँगा—अपने मन से नहीं; क्योंकि मेरे सामने पुस्तक लिखी हुई है, और दिनों के विभाजन[a] स्वर्गीय पट्टिकाओं पर निर्धारित किए गए हैं—ताकि वे वाचा के पर्वों को न भूलें और जातियों के पर्वों के अनुसार न चलें, बल्कि उन जातियों की भूल और अज्ञानता का अनुसरण न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘समयों के विभाजन’।
    reason: መዋዕል का मूल अर्थ ‘दिन’ है, पर पंचांगीय संदर्भ में व्यापक अर्थ ‘समय’ भी सम्भव है।
lexical_decisions:
- source_word: መዋዕል
  choice: दिनों
  rationale: इसका मूल अर्थ ‘दिन’ है; इस प्रसंग में जुबिलीज़ की सटीक पंचांग-गणना को बनाए रखने के लिए ‘समयों’ की अपेक्षा ‘दिनों’ उपयुक्त है।
- source_word: ክፋሌሁ ለመዋዕል
  choice: दिनों के विभाजन
  rationale: शाब्दिक संरचना और पंचांगीय संदर्भ दोनों सुरक्षित रहते हैं; संभावित व्यापक अर्थ फुटनोट में दिया गया है।
- source_word: ጽላተ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: ग्रंथ में दैवी अभिलेख के ठोस बिंब को सुरक्षित रखने वाला स्वाभाविक हिन्दी पद।
- source_word: በዓላተ ኪዳን
  choice: वाचा के पर्वों
  rationale: ‘वाचा’ धार्मिक-ग्रंथीय अर्थ को ठीक रखता है और ‘पर्व’ कैलेंडर में नियत उत्सवों के लिए सहज है।
- source_word: አሕዛብ
  choice: जातियों
  rationale: यहाँ अर्थ इस्राएल से बाहर की अन्य जातियाँ/राष्ट्र हैं; ‘जातियों’ से स्रोत की सामूहिक धार्मिक-सांस्कृतिक भिन्नता बनी रहती है।
theological_decisions:
- issue: ज्ञान का स्रोत
  choice: ‘अपने मन की ओर से नहीं’ को स्पष्ट रखा गया
  alternative: इसे ‘अपनी समझ से नहीं’ कहकर व्याख्यात्मक बनाना
  rationale: वक्ता अपने संदेश को निजी अंतःप्रेरणा से अलग कर लिखित स्वर्गीय अभिलेख पर आधारित बताता है; स्रोत की तनावपूर्ण अभिव्यक्ति को नहीं सुलझाया गया।
- issue: दिनों का निर्धारित विभाजन
  choice: इसे स्वर्गीय पट्टिकाओं पर निर्धारित बताया गया
  alternative: इसे केवल पुस्तक में लिखी पंचांग-सूची के रूप में प्रस्तुत करना
  rationale: मूल पाठ पुस्तक और स्वर्गीय पट्टिकाओं दोनों का उल्लेख करता है; दैवी निर्धारण की अवधारणा सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। एकवचन संबोधन के लिए ‘तुझे’ चुना गया है; वाक्य की भविष्यवाणी-सदृश गंभीरता और मूल पाठ की कारणात्मक तथा उद्देश्यसूचक संरचना बनाए रखी गई है।
