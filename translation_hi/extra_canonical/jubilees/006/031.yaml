base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/031.yaml
  text: 'And you, command the children of Israel to keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And it will not disturb its time from its days or from its feasts, for everything will come in them according to their testimony, and they will not omit a day nor disturb a feast.'
translation:
  language: hi
  text: 'और तुम इस्राएल की सन्तानों को आज्ञा दो कि वे इसी गणना के अनुसार वर्षों का पालन करें: तीन सौ चौंसठ दिन; और वह एक पूरा वर्ष होगा। वह अपने दिनों या अपने पर्वों के नियत समय को नहीं बिगाड़ेगा,[a] क्योंकि सब कुछ उनमें उनकी गवाही के अनुसार आएगा। वे न किसी दिन को छोड़ेंगे, न किसी पर्व को बिगाड़ेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने दिनों या अपने पर्वों से अपने समय को नहीं हटाएगा।”
    reason: गीज़ की क्रिया में बिगाड़ने, विचलित करने, या नियत समय से हटाने का भाव संभव है; इस कठिन वाक्य-संबंध का वैकल्पिक, अधिक शाब्दिक रूप दिया गया है।
lexical_decisions:
- source_word: ወእንተኒ
  choice: और तुम
  rationale: स्वतंत्र सर्वनाम के बल को बनाए रखते हुए मूसा को दिए गए निर्देश पर जोर रखा गया है।
- source_word: ይዕቀቡ፡ ዓመታተ
  choice: वर्षों का पालन करें
  rationale: ‘रखना/मानना’ के अर्थ को कैलेंडर-वर्षों की विधिवत गणना और पालन के स्वाभाविक हिन्दी रूप में व्यक्त करता है।
- source_word: በዝ፡ ኍልቍ
  choice: इसी गणना के अनुसार
  rationale: निर्दिष्ट गणना-पद्धति का संकेत और मूल के संकेतवाचक बल दोनों सुरक्षित हैं।
- source_word: ፍጹመ፡ ዓመተ
  choice: एक पूरा वर्ष
  rationale: ‘पूर्ण/सम्पूर्ण वर्ष’ का सीधा और सहज हिन्दी रूप।
- source_word: ያማስን / ያማስኑ
  choice: बिगाड़ेगा / बिगाड़ेंगे
  rationale: एक ही धातु की एकवचन और बहुवचन क्रियाओं को समान शब्द से प्रस्तुत कर मूल का विरोध और पुनरावृत्ति बनाए रखी गई है।
- source_word: በዓላቲሁ / በዓለ
  choice: अपने पर्वों / किसी पर्व
  rationale: धार्मिक कैलेंडर के नियत उत्सवों के लिए ‘पर्व’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: በከመ፡ ስምዖሙ
  choice: उनकी गवाही के अनुसार
  rationale: ‘गवाही’ के असामान्य किंतु महत्वपूर्ण मूल रूपक को किसी व्याख्यात्मक विकल्प से बदले बिना सुरक्षित रखा गया है।
- source_word: ኢየኀልፉ፡ ዕለተ
  choice: किसी दिन को छोड़ेंगे नहीं
  rationale: दिन के छूट जाने या गणना से निकल जाने का अर्थ सहज हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: 364 दिनों की वर्ष-गणना
  choice: तीन सौ चौंसठ दिनों को ‘एक पूरा वर्ष’ के रूप में स्पष्टतः रखा गया
  alternative: इसे आधुनिक सौर वर्ष के अनुरूप समझाकर नरम करना
  rationale: पाठ की विशिष्ट कैलेंडर-संबंधी धारणा को बिना सामंजस्य बैठाए ज्यों का त्यों प्रस्तुत करना आवश्यक है।
- issue: ‘उनकी गवाही’ का संदर्भ
  choice: सर्वनाम की अस्पष्टता बनाए रखी गई
  alternative: इसे दिनों, पर्वों, स्वर्गीय पट्टिकाओं या नियत कालों के रूप में स्पष्ट करना
  rationale: मूल में संदर्भ पूरी तरह स्पष्ट नहीं है; किसी एक व्याख्या को मुख्य पाठ में थोपना उचित नहीं।
- issue: एकवचन क्रिया का कर्ता
  choice: ‘वह’ रखा गया, जिसका निकटतम संभावित संदर्भ पूरा वर्ष/यह हिसाब है
  alternative: बहुवचन ‘वे’ करके इस्राएलियों को कर्ता बनाना
  rationale: गीज़ की एकवचन पुल्लिंग क्रिया को सुरक्षित रखना स्रोत-साक्ष्य के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘सन्तानों’, ‘गणना’, ‘पर्व’ और ‘गवाही’ जैसे शब्द पाठ के प्राचीन धार्मिक-कैलेंडर संबंधी स्वर को बनाए रखते हैं। एकवचन और बहुवचन क्रियाओं का अंतर जानबूझकर सुरक्षित रखा गया है।
