  text: and an ordinance for a testimony forever. And Noah ordained them for himself as festivals for everlasting generations,
translation:
  language: hi
  text: और सदा के लिए गवाही[a] का एक विधान। और नूह ने उन्हें अपने लिए सदा की पीढ़ियों के लिए पर्वों के रूप में ठहराया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सदा के लिए गवाही के रूप में।’
    reason: अंग्रेज़ी audit trail में दर्ज वैकल्पिक संबंध को हिन्दी में सुरक्षित रखता है, बिना किसी एक व्याख्या को थोपे।
lexical_decisions:
- source_word: ሥርዓት
  choice: विधान
  rationale: यह शब्द नियम, व्यवस्था या विधि के अर्थ में है; यहाँ संज्ञा के रूप को स्पष्ट रखते हुए ‘विधान’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ስምዕ
  choice: गवाही
  rationale: स्रोत का मूल अर्थ ‘साक्षी/गवाही’ है; ‘गवाही’ आधुनिक सामान्य हिन्दी में अधिक सहज है।
- source_word: ሠርዓን
  choice: ठहराया
  rationale: क्रिया में निर्धारित या स्थापित करने का भाव है; पर्वों के संबंध में ‘ठहराया’ उपयुक्त है।
- source_word: በዓላት
  choice: पर्वों
  rationale: धार्मिक उत्सवों अथवा नियत पर्व-दिवसों के लिए स्वाभाविक हिन्दी शब्द।
- source_word: ለትውልድ፡ ዘለዓለም
  choice: चिरस्थायी पीढ़ियों के
  rationale: पीढ़ियों और स्थायी काल—दोनों तत्वों को रखते हुए हिन्दी में सहज अभिव्यक्ति।
theological_decisions:
- issue: विधान और गवाही के बीच संबंध
  choice: ‘गवाही का विधान’
  alternative: ‘गवाही के रूप में सदा का विधान’
  rationale: स्रोत की संज्ञात्मक बनावट और संबंध को यथासंभव सुरक्षित रखा गया है; वैकल्पिक रूप अर्थ को अधिक व्याख्यायित कर देता।
- issue: नूह द्वारा पर्व अपने लिए ठहराना
  choice: ‘अपने लिए’ को स्पष्ट रखा
  alternative: सर्वनाम को छोड़ देना या सामुदायिक अर्थ देना
  rationale: ሎቱ का स्पष्ट दैवाचक अर्थ मौजूद है; इसे हटाना स्रोत-सूचना का लोप होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; धार्मिक गरिमा बनाए रखते हुए सरल शब्दावली। पद अगले वाक्य से जुड़ता प्रतीत होता है, इसलिए अंत में अल्पविराम रखा गया है।
