  yaml_path: translation/extra_canonical/jubilees/006/001.yaml
  text: And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.
translation:
  language: hi
  text: और तीसरे महीने के नए चाँद के दिन नूह जहाज़ से बाहर निकला और उसने उस पहाड़ पर एक वेदी बनाई। उसने पृथ्वी के लिए प्रायश्चित किया; उसने बकरी का एक बच्चा लिया और उसके लहू से पृथ्वी के सारे अपराध के लिए प्रायश्चित किया, क्योंकि जो कुछ पृथ्वी पर था, वह सब मिटा दिया गया था—केवल वे ही बचे थे जो नूह के साथ जहाज़ में थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቁ፡ ለወርኅ፡ ሣልስ
  choice: तीसरे महीने के नवचंद्र के दिन
  rationale: गीज़ पदबंध महीने के आरंभ अथवा नवचंद्र को सूचित करता है; ‘नवचंद्र’ मूल की कालगणनात्मक छवि को बनाए रखता है।
- source_word: ታቦት
  choice: जहाज़
  rationale: जलप्रलय के संदर्भ में यह नूह के विशाल जलयान का स्वाभाविक आधुनिक हिन्दी रूप है; ‘सन्दूक’ यहाँ भ्रामक हो सकता है।
- source_word: ምሥዋዐ
  choice: वेदी
  rationale: बलिदान चढ़ाने के लिए निर्मित altar का मानक और सहज हिन्दी धार्मिक शब्द।
- source_word: አስተስረየ
  choice: प्रायश्चित किया
  rationale: क्रिया पाप या अपराध के निवारण/प्रायश्चित का बोध देती है और पद में दोहराई गई धार्मिक क्रिया को समान रूप से प्रस्तुत करती है।
- source_word: መሐስአ፡ ጠሊ
  choice: बकरी का एक बच्चा
  rationale: स्रोत में युवा बकरी का संकेत है; यह ‘मेमना’ कहकर पशु की जाति बदलने से बचता है।
- source_word: አበሳ፡ ምድር
  choice: पृथ्वी के सारे अपराध
  rationale: शाब्दिक संबंध ‘पृथ्वी का अपराध/दोष’ है; हिन्दी में ‘पृथ्वी के सारे अपराध’ सामूहिक दोष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ተደምሰሰ
  choice: मिटा दिया गया था
  rationale: नष्ट या पूर्णतः मिटा दिए जाने के निष्क्रिय अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: पृथ्वी के लिए प्रायश्चित
  choice: प्रायश्चित-संबंधी भाषा को स्पष्ट रूप से बनाए रखा गया
  alternative: पृथ्वी को शुद्ध किया
  rationale: स्रोत की दोहराई हुई क्रिया प्रायश्चित का बोध देती है; इसे केवल अनुष्ठानिक शुद्धि बनाना धार्मिक तनाव को समय से पहले सुलझा देता।
- issue: लहू की भूमिका
  choice: ‘उसके लहू से ... प्रायश्चित किया’
  alternative: ‘उसका लहू छिड़ककर पृथ्वी को शुद्ध किया’
  rationale: स्रोत लहू को प्रायश्चित के साधन के रूप में रखता है, पर छिड़कने की क्रिया स्पष्ट नहीं करता; इसलिए अतिरिक्त अनुष्ठानिक विवरण नहीं जोड़ा गया।
- issue: कर्ता की पहचान
  choice: आरंभ में ‘नूह’ स्पष्ट किया गया
  alternative: सर्वत्र केवल ‘वह’
  rationale: पूर्ववर्ती संदर्भ उपलब्ध न होने पर हिन्दी में कर्ता स्पष्ट करना आवश्यक है; पद के अंत में नूह का नाम स्वयं स्रोत में आता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-रचना स्रोत की क्रमिकता और प्रायश्चित-विषयक पुनरावृत्ति को बनाए रखती है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
