base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/012.yaml
  text: 'And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.'
translation:
  language: hi
  text: 'और यह गवाही तुम्हारे विषय में इसलिए लिखी गई है कि तुम इसे सदा मानो: पृथ्वी के सारे दिनों तक किसी जंगली पशु, पक्षी या पालतू पशु का लहू न खाओ। जो मनुष्य पृथ्वी के सारे दिनों तक किसी जंगली पशु, पालतू पशु या पक्षी का लहू खाए, वह और उसका वंश पृथ्वी पर से जड़ से उखाड़ दिए जाएँगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: गवाही
  rationale: यह शब्द साक्ष्य या गवाही का अर्थ देता है; यहाँ लिखित, बाध्यकारी साक्ष्य के भाव में ‘गवाही’ स्वाभाविक और सटीक है।
- source_word: ትዕቀብዋ
  choice: इसे सदा मानते रहो
  rationale: मूल क्रिया में सुरक्षित रखने, पालन करने और ध्यानपूर्वक मानने का भाव है; आज्ञा के संदर्भ में ‘मानते रहो’ सहज हिन्दी है।
- source_word: አራዊት
  choice: जंगली पशु
  rationale: यह पशुओं की उस श्रेणी को दर्शाता है जो आगे पालतू पशुओं से अलग रखी गई है।
- source_word: እንስሳ
  choice: पालतू पशु
  rationale: पक्षियों और जंगली पशुओं के साथ त्रिपक्षीय सूची में यह घरेलू या पालतू पशुओं को सूचित करता है।
- source_word: ደም
  choice: लहू
  rationale: ‘लहू’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और इस धार्मिक निषेध के लिए स्वाभाविक है।
- source_word: ይስሮ
  choice: जड़ समेत मिटा दिए जाएँ
  rationale: मूल में उखाड़े या मूलोच्छिन्न किए जाने का तीव्र चित्र है; यह हिन्दी अभिव्यक्ति उस रूपक को बनाए रखती है।
- source_word: ዘርኡ
  choice: उसका वंश
  rationale: शाब्दिक अर्थ ‘उसका बीज’ है, पर मानव-संदर्भ में ‘वंश’ अभिप्रेत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: लहू खाने के निषेध की कालावधि
  choice: ‘पृथ्वी के सारे दिनों में’ को दोनों स्थानों पर बनाए रखा गया
  alternative: ‘सदा’ या ‘जब तक पृथ्वी बनी रहे’
  rationale: मूल की पुनरावृत्ति और स्थायी निषेध का बल सुरक्षित रखने के लिए उसकी विशिष्ट अभिव्यक्ति को नहीं हटाया गया।
- issue: दंड में व्यक्ति के साथ उसके वंश का समावेश
  choice: ‘वह और उसका वंश’ स्पष्ट रूप से रखा गया
  alternative: केवल अपराधी व्यक्ति के मिटाए जाने का उल्लेख
  rationale: मूल पाठ का कठिन धार्मिक और नैतिक तनाव अनुवाद में कम या हल नहीं किया गया।
- issue: दंडात्मक क्रिया का व्याकरण
  choice: ‘मिटा दिए जाएँ’
  alternative: ‘मिट जाएँ’ या ‘उखाड़ दिया जाएगा’
  rationale: यह रूप मूल के न्यायात्मक निष्कासन को व्यक्त करता है और व्यक्ति तथा उसके वंश—दोनों के साथ हिन्दी में व्याकरणिक रूप से मेल खाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। मूल की श्रेणीगत सूची, कालसूचक पुनरावृत्ति और ‘जड़ समेत’ वाले विनाश-रूपक को सुरक्षित रखा गया है।
