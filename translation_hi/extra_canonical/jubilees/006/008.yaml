  text: Whoever sheds the blood of a man, by a man shall his blood be shed; for in the likeness of God he made man.
translation:
  language: hi
  text: जो कोई मनुष्य का खून बहाएगा, उसका खून मनुष्य के द्वारा बहाया जाएगा; क्योंकि परमेश्वर ने मनुष्य[a] को अपनी समानता में बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आदम’।
    reason: गीज़ አዳም का रूप व्यक्तिवाचक नाम ‘आदम’ भी समझा जा सकता है, यद्यपि इस संदर्भ में सामान्य अर्थ ‘मनुष्य’ अधिक उपयुक्त है।
lexical_decisions:
- source_word: ዘይከዑ፡ ደመ፡ ሰብእ
  choice: जो कोई मनुष्य का खून बहाएगा
  rationale: गीज़ पदबंध में रक्त बहाने वाले के लिए सामान्य संबंधवाचक अभिव्यक्ति है; आधुनिक हिन्दी में ‘जो कोई’ उसके सार्वभौमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በሰብእ፡ ደሙ፡ ይትከዐው
  choice: उसका खून मनुष्य के द्वारा बहाया जाएगा
  rationale: स्रोत की कर्मवाच्य संरचना और ‘मनुष्य के द्वारा’ अभिकर्ता को सुरक्षित रखा गया है, बिना यह तय किए कि वह व्यक्ति, समुदाय या विधिक प्राधिकारी है।
- source_word: በምስለ፡ እግዚአብሔር
  choice: परमेश्वर ने … अपने स्वरूप में
  rationale: ‘परमेश्वर के स्वरूप में’ का अर्थ स्वाभाविक हिन्दी में व्यक्त करते हुए कर्ता परमेश्वर से जुड़ा ‘अपने’ प्रयोग किया गया है।
- source_word: ለአዳም
  choice: मनुष्य
  rationale: यहाँ आदम/मानव के लिए प्रयुक्त शब्द उत्पत्ति 9:6 के संदर्भ में सामान्य मानवजातीय अर्थ रखता है; ‘मनुष्य’ पहले खंड से तर्क-संबंध भी स्पष्ट रखता है।
theological_decisions:
- issue: रक्त बहाने के प्रतिफल का अभिकर्ता
  choice: ‘मनुष्य के द्वारा’ को यथावत रखा
  alternative: ‘लोग उसका खून बहाएँगे’ या किसी न्यायिक प्राधिकारी को स्पष्ट करना
  rationale: स्रोत अभिकर्ता को केवल ‘मनुष्य’ कहता है; अनुवाद किसी विशिष्ट दंड-व्यवस्था या प्राधिकारी को आरोपित नहीं करता।
- issue: ለአዳም का सामान्य या व्यक्तिवाचक अर्थ
  choice: मुख्य पाठ में ‘मनुष्य’
  alternative: ‘आदम’
  rationale: वाक्य का कारणात्मक कथन समस्त मानव जीवन की परमेश्वर-सदृशता पर आधारित है; फिर भी रूपगत संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर और सहज शैली। ‘रक्त’ के बजाय प्रचलित ‘खून’ स्रोत और अंग्रेज़ी परामर्श-पाठ की रक्त-बहाने वाली ठोस अभिव्यक्ति को सामान्य पाठक के लिए स्वाभाविक रखता है। समानांतर वाक्य-विन्यास और कारणसूचक ‘क्योंकि’ बनाए गए हैं।
