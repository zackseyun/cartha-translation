  text: His city was Danaba. And Balaq died, and Jobab son of Zarah from Boser reigned in his place.
translation:
  language: hi
  text: उसका नगर दनाबा था। बालाक मर गया, और उसके स्थान पर बोसेर के ज़ारा का पुत्र योबाब राजा हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका नगर दनाबा था। बालाक मर गया, और उसके बाद बोसेर के ज़ारा का पुत्र योबाब राजा हुआ।”
    reason: ህየንቴሁ को उत्तराधिकार के कालक्रम पर बल देते हुए ‘उसके बाद’ भी समझा जा सकता है; मुख्य पाठ उसका अधिक शाब्दिक अर्थ ‘उसके स्थान पर’ रखता है।
lexical_decisions:
- source_word: ሀገሩ፡ ደናባ
  choice: उसका नगर दनाबा था
  rationale: ሀገሩ का अर्थ ‘उसका नगर’ है; नाम ደናባ को दनाबा के रूप में लिप्यंतरित किया गया है। स्रोत में निहित संबंधवाचक क्रिया को स्वाभाविक हिन्दी के लिए ‘था’ से व्यक्त किया गया है।
- source_word: ሞተ
  choice: मर गया
  rationale: यह सामान्य भूतकालीन क्रिया है और आधुनिक हिन्दी में स्वाभाविक रूप से ‘मर गया’ होती है।
- source_word: ነግሠ
  choice: राजा हुआ
  rationale: क्रिया का अर्थ राज करना अथवा राजा बनना है; उत्तराधिकार के इस प्रसंग में ‘राजा हुआ’ संक्षिप्त और स्वाभाविक है।
- source_word: ህየንቴሁ
  choice: उसके स्थान पर
  rationale: यह पद प्रतिस्थापन या उत्तराधिकार का भाव देता है; ‘उसके स्थान पर’ उस अर्थ को ‘उसके बाद’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: ዮባብ፡ ወልደ፡ ዛራ፡ ዘእም፡ ቦሴር
  choice: बोसेर के ज़ारा का पुत्र योबाब
  rationale: वंश और स्थान-संबंध को हिन्दी के स्वाभाविक क्रम में रखा गया है, जबकि सभी नाम और संबंध सुरक्षित हैं।
