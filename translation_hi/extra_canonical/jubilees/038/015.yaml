  text: And the sons of Edom have not cast off the yoke of servitude that the twelve sons of Jacob had laid upon them, to this day.
translation:
  language: hi
  text: और एदोम के वंशजों ने दासता का वह जुआ आज तक नहीं उतारा है, जिसे याकूब के बारह पुत्रों ने उन पर लादा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ኤዶም
  choice: एदोम के वंशजों
  rationale: शाब्दिक अर्थ ‘एदोम की संतान’ है; हिन्दी में पूरे वंश/समुदाय के लिए ‘वंशज’ अधिक स्वाभाविक है।
- source_word: እምአርዑተ፡ ቅኔ
  choice: दासता का ... जूआ
  rationale: यह दासत्व अथवा अधीन सेवा के जूए का रूपक है; ‘दासता’ उसकी कठोरता और ‘जूआ’ मूल बिंब को सुरक्षित रखते हैं।
- source_word: ኢነገኁ
  choice: नहीं उतारा है
  rationale: जूए को झटककर हटा देने/उतारने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘሠርዑ
  choice: जिसे ... रखा था
  rationale: जूआ किसी पर रखने अथवा लादने के आशय को हिन्दी के स्वाभाविक वाक्य-विन्यास में रखा गया है।
- source_word: ውሉደ፡ ያዕቆብ
  choice: याकूब के ... पुत्रों
  rationale: वंशगत व्यापकता के बजाय यहाँ याकूब के गिने हुए पुत्र अभिप्रेत हैं, इसलिए ‘पुत्रों’ उपयुक्त है।
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: आज तक
  rationale: मुहावरे का सीधा और प्रचलित हिन्दी समतुल्य।
theological_decisions:
- issue: याकूब के पुत्रों की संख्या
  choice: बारह
  alternative: प्रदत्त डिजिटल पाठ के विकृत रूप को अक्षरशः पढ़कर ‘चौदह और पंद्रह’
  rationale: प्रदत्त गीइज़ पंक्ति में संख्या-सम्बन्धी पाठ OCR/प्रतिलिपि-विकृति दर्शाता है। Charles 1895 के समीक्षित पाठ, प्रसंग और याकूब के पुत्रों की स्थापित गणना के अनुसार यहाँ ‘बारह’ है; निरर्थक विकृत पाठ को मुख्य अनुवाद में नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। मूल का ‘जूआ’ रूपक बनाए रखा गया है और वाक्य को अनावश्यक रूप से पुरातन नहीं बनाया गया।
