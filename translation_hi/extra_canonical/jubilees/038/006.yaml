  text: And Levi and Dan and Asher went out toward the east side of the tower, and fifty were with them; and they killed the warriors of Moab and Ammon.
translation:
  language: hi
  text: और लेवी, दान और आशेर मीनार की पूर्वी ओर निकले। उनके साथ पचास थे; और उन्होंने मोआब और अम्मोन के योद्धाओं को मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገጸ፡ ጽባሕ
  choice: पूर्वी ओर
  rationale: शाब्दिक अर्थ ‘भोर/पूर्व की दिशा की ओर’ है; प्रसंग में यह मीनार की पूर्वी दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ማኅፈድ
  choice: मीनार
  rationale: इस प्रसंग में यह किसी दुर्गनुमा ऊँची संरचना या मीनार को सूचित करता है; ‘मीनार’ स्पष्ट और सहज हिन्दी है।
- source_word: መስተቃትላኒሆሙ
  choice: योद्धाओं
  rationale: यह युद्ध करने वाले लोगों को सूचित करता है; ‘योद्धा’ अर्थ और युद्ध-संदर्भ दोनों को संक्षेप में बनाए रखता है।
