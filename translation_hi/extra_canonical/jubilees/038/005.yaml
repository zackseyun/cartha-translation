  yaml_path: translation/extra_canonical/jubilees/038/005.yaml
  text: And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and none of them escaped, not even one.
translation:
  language: hi
  text: और यहूदा सबसे पहले निकला। नप्ताली और गाद उसके साथ थे, और पचास सेवक भी उसके साथ थे। वे मीनार के दक्षिणी भाग की ओर गए और उन्होंने अपने सामने मिले सब लोगों को मार डाला। उनमें से कोई भी नहीं बच निकला—एक भी नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጹመ
  choice: सबसे पहले
  rationale: इस प्रसंग में यह क्रियाविशेषण यहूदा के पहले निकलने या आगे बढ़ने को सूचित करता है; ‘सबसे पहले’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ንፍታሌም
  choice: नप्ताली
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ፶ ደቅ
  choice: पचास सेवक
  rationale: पाठ में संख्या पचास है; संज्ञा अधीनस्थ पुरुषों/सेवकों के अर्थ में समझी गई है, इसलिए परामर्श-पाठ के अनुरूप ‘सेवक’ रखा गया है।
- source_word: ማኅፈድ
  choice: गढ़
  rationale: यह शब्द किलेबंद संरचना को दर्शाता है। ‘गढ़’ सामान्य हिन्दी में स्वाभाविक है और ‘मीनार’ की अपेक्षा व्यापक अर्थ को सुरक्षित रखता है।
- source_word: እንተ፡ ገጸ፡ ደቡብ
  choice: दक्षिणी भाग की ओर
  rationale: शाब्दिक रूप से दक्षिण की ओर वाले मुख/पक्ष का बोध है; हिन्दी में ‘दक्षिणी भाग की ओर’ सहज है।
- source_word: ወአሐዱኒ
  choice: एक भी नहीं
  rationale: अंत का पद पिछले निषेध को बल देता है; हिन्दी में पृथक बलाघाती वाक्यांश से वही प्रभाव आता है।
