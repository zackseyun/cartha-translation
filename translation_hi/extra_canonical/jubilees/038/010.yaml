  text: But Jacob buried his brother in the mountain that is in Adurim, and he returned to his house.
translation:
  language: hi
  text: पर याकूब ने अपने भाई को अदूरीम में स्थित पहाड़ में दफ़नाया और अपने घर लौट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወገር (wagar)
  choice: पहाड़
  rationale: गीज़ शब्द स्थलाकृति को सूचित करता है और सामान्यतः ‘पहाड़’ या ‘पहाड़ी’ के अर्थ में आता है; इसलिए ‘क्षेत्र’ की अपेक्षा ‘पहाड़’ अधिक स्रोत-संगत है।
- source_word: ቀበሮ (qabar-o)
  choice: दफ़नाया
  rationale: क्रिया का सीधा अर्थ ‘उसने उसे दफ़नाया’ है; हिन्दी में व्यक्तिवाचक कर्म को स्पष्ट करने के लिए ‘अपने भाई को’ के साथ स्वाभाविक रूप दिया गया है।
- source_word: አዱፊም (Adūfīm)
  choice: अदूरीम
  rationale: स्थान-नाम को अंग्रेज़ी परामर्श पाठ में संरक्षित प्रचलित रूप Adurim के अनुसार देवनागरी में लिप्यंतरित किया गया है; गीज़ पाठ का व्यंजन यहाँ पांडुलिपीय/पाठगत रूपांतर दर्शा सकता है।
- source_word: ወገብአ ውስተ ቤቱ
  choice: और अपने घर लौट गया
  rationale: शाब्दिक अर्थ ‘और वह अपने घर में/को लौट गया’ है; आधुनिक हिन्दी में गंतव्य के लिए ‘अपने घर लौट गया’ स्वाभाविक है।
