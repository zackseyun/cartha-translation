  text: And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned in his place; and the name of his city was Avith.
translation:
  language: hi
  text: और आसाम मर गया, और उसके स्थान पर बारद का पुत्र अदात राजा बना, जिसने मोआब के मैदान में मिद्यान को परास्त किया था; और उसके नगर का नाम अवीत था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ
  choice: उसके स्थान पर
  rationale: इसका सीधा अर्थ ‘उसके स्थान में/उसकी जगह’ है; यह केवल कालक्रम बताने वाले ‘उसके बाद’ से अधिक सटीक है।
- source_word: ዘቀተለ
  choice: पराजित किया था
  rationale: मूल क्रिया का सामान्य अर्थ ‘मारना’ है, पर मिद्यान जैसे सामूहिक/राजनीतिक नाम के साथ युद्ध-संदर्भ में ‘पराजित करना’ स्वाभाविक और अर्थानुकूल है।
- source_word: በሐቅለ፡ ሞአብ
  choice: मोआब के मैदान में
  rationale: ሐቅል का मूल अर्थ खेत या मैदान है; यहाँ भौगोलिक युद्धस्थल के लिए ‘मैदान’ उपयुक्त है।
- source_word: ወነግሠ
  choice: राजा बना
  rationale: राजत्व ग्रहण करने के अर्थ को आधुनिक, सहज हिन्दी में व्यक्त करता है।
