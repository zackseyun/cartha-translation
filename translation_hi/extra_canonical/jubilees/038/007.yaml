- source_word: ማኅፈድ
  choice: गढ़
  rationale: संदर्भ में यह किसी किलेबंद संरचना या गढ़ को सूचित करता है; अंग्रेज़ी परामर्श-पाठ में ‘tower’ है, पर हिन्दी में ‘गढ़’ युद्धस्थल के संदर्भ में अधिक स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: መስተባእሳኒሆሙ
  choice: लड़नेवाले पुरुषों
  rationale: शब्द को सामान्य ‘योद्धाओं’ की अपेक्षा अधिक शाब्दिक ढंग से उन पुरुषों के रूप में रखा गया है जो युद्ध कर रहे थे।
- source_word: ፍልስጥኤም
  choice: पलिश्तियों
  rationale: यह बाइबलीय जातिनाम का प्रचलित आधुनिक हिन्दी रूप है।
