  language: hi
  text: और योबाब मर गया, और तेमान के पहाड़ी प्रदेश से असाम उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሞተ፡ ዮባብ፡
  choice: और योबाब मर गया
  rationale: क्रिया ሞተ का सीधा अर्थ ‘मर गया’ है; नाम योबाब का मानक देवनागरी लिप्यंतरण रखा गया है।
- source_word: ወነግሠ፡
  choice: और ... राजा हुआ
  rationale: ነግሠ का अर्थ राज करना अथवा राजा बनना है; उत्तराधिकार के इस प्रसंग में ‘राजा हुआ’ स्वाभाविक और सटीक है।
- source_word: ህየንቴሁ፡
  choice: उसके स्थान पर
  rationale: यह पदबंध ‘उसकी जगह/उसके स्थान पर’ का अर्थ देता है, केवल कालक्रमसूचक ‘उसके बाद’ नहीं।
- source_word: አሳም፡
  choice: असाम
  rationale: व्यक्तिनाम का स्रोत-पाठ के अनुसार निकट देवनागरी लिप्यंतरण।
- source_word: ዘእም፡ ደብረ፡ ቴማን።
  choice: तेमान के पहाड़ी प्रदेश का
  rationale: ዘእም संबंध और उद्गम व्यक्त करता है; ደብረ यहाँ किसी एक पहाड़ की अपेक्षा पहाड़ी भूभाग को सूचित कर सकता है, इसलिए सहज हिन्दी में ‘पहाड़ी प्रदेश’ चुना गया।
