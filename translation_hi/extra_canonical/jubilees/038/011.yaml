translation:
  language: hi
  text: और याकूब के पुत्रों ने सेईर पर्वत पर एसाव के पुत्रों को अपने अधीन कर लिया, और एसाव के पुत्रों ने अपनी गर्दनें झुका दीं, ताकि वे दास बन जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መገብዎሙ
  choice: अपने अधीन कर लिया
  rationale: क्रिया का भाव वश में करने या अधीन करने का है; यह युद्ध-संदर्भ में स्वाभाविक हिन्दी है और केवल दबाव डालने से अधिक स्पष्ट है।
- source_word: ደብረ፡ ሴኢር
  choice: सेईर पर्वत पर
  rationale: स्थाननाम को प्रचलित बाइबलीय रूप में लिप्यंतरित किया गया और पर्वतीय स्थल का अर्थ बनाए रखा गया।
- source_word: አትሐቱ፡ ክሳዶሙ
  choice: अपनी गर्दनें झुका दीं
  rationale: स्रोत की शारीरिक उपमा को बनाए रखा गया है; यह समर्पण और अधीनता व्यक्त करती है।
- source_word: አግብርተ
  choice: दास
  rationale: यहाँ शब्द अधीन सेवा करने वालों को दर्शाता है; ‘दास’ स्रोत की कठोर सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
theological_decisions:
- issue: एसाव के पुत्रों की अधीनता का स्वरूप
  choice: दास बन जाएँ
  alternative: सेवक बन जाएँ
  rationale: स्रोत में प्रयुक्त पद को नरम किए बिना उसकी अधीन और बाध्य स्थिति व्यक्त की गई है; पद में किसी विशिष्ट वैधानिक या धार्मिक दास-प्रथा का अतिरिक्त अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘अपनी गर्दनें झुका दीं’ स्रोत की जीवंत उपमा को अक्षुण्ण रखता है, जबकि ‘अपने अधीन कर लिया’ युद्ध में विजय का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
