  text: And Salman died, and Saul from Rehoboth by the River reigned in his place.
translation:
  language: hi
  text: और सलमान मर गया, और उसके स्थान पर नदी के पास के रहोबोत का शाऊल राजा हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ (ḥəyāntehu)
  choice: उसके स्थान पर
  rationale: यह पदबंध केवल कालक्रम में ‘उसके बाद’ नहीं, बल्कि उसके स्थान पर उत्तराधिकारी होने का भाव व्यक्त करता है।
- source_word: ራኦቦት፡ ፈለግ (Rāʾobōt Falag)
  choice: नदी के पास के रहोबोत
  rationale: ፈለግ का अर्थ ‘नदी’ है और यह रहोबोत की पहचान नदी से जुड़े स्थान के रूप में कराता है; ‘के पास के’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ነግሠ (nagaśa)
  choice: राजा हुआ
  rationale: क्रिया का अर्थ राज करना अथवा सिंहासन ग्रहण करना है; उत्तराधिकार के इस प्रसंग में ‘राजा हुआ’ सहज और सटीक है।
