lexical_decisions:
- source_word: ወእምዝ
  choice: इसके बाद
  rationale: क्रमसूचक वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ወጽኡ
  choice: निकले
  rationale: क्रिया के पूर्ण भूतकालीन कथात्मक अर्थ को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: ውሉደ፡ ያዕቆብ
  choice: याकूब के पुत्र
  rationale: वंश-संबंधी पदबंध का सीधा और प्रतिष्ठित हिन्दी रूप।
- source_word: እሙንቱ፡ ወአግብርቲሆሙ
  choice: अपने सेवकों के साथ
  rationale: ‘वे और उनके सेवक’ का स्वाभाविक हिन्दी संक्षेप है; दोनों समूहों की संयुक्त गति सुरक्षित रहती है।
- source_word: ተናፊቆሙ
  choice: बँट गए
  rationale: पारस्परिक/मध्यवाची भाव को बनाए रखता है कि उन्होंने स्वयं को अलग-अलग दलों में व्यवस्थित किया।
- source_word: ውስተ፡ መርብዕተ፡ ማኅፈድ
  choice: चार युद्ध-पंक्तियों में
  rationale: संख्या और सैन्य विन्यास दोनों को सहज हिन्दी में व्यक्त करता है; ‘पंक्ति’ यहाँ युद्ध के लिए संगठित गठन का संकेत देती है।
