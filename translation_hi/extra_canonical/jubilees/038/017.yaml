  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भ का वाक्यांश स्रोत में पिछले कथन की निरंतरता जैसा खंडित है; इस साहित्यिक संरचना को पूर्ण वाक्य बनाकर बदलने के बजाय यथावत रखा गया है। उपलब्ध गीइज़ उद्धरण अंतिम उपवाक्य के बीच में कटता है, इसलिए नगर-नाम वाला पूर्ण कथन दिए गए समीक्षित अंग्रेज़ी परामर्श-पाठ और निर्दिष्ट संस्करण-संदर्भ के अनुरूप प्रस्तुत किया गया है।
