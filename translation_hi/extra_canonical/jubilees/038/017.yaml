translation:
  language: hi
  text: आज तक, एदोम की भूमि में। और बओर के पुत्र बालाक ने एदोम में राज्य किया, और उसके नगर का नाम दनाबा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: आज तक
  rationale: यह मुहावरा शाब्दिक रूप से ‘इस दिन तक’ है; आधुनिक हिन्दी में ‘आज तक’ उसका स्वाभाविक और सटीक समतुल्य है।
- source_word: በምድረ፡ ኤዶም
  choice: एदोम देश में
  rationale: ‘भूमि/देश’ के अर्थ को सहज हिन्दी में व्यक्त करते हुए स्थान-नाम एदोम को लिप्यंतरित किया गया है।
- source_word: ወነግሠ፡ በአዶም
  choice: और ... ने एदोम पर राज्य किया
  rationale: आरम्भिक संयोजक को ‘और’ से सुरक्षित रखा गया है तथा राज करने के क्षेत्र को हिन्दी के स्वाभाविक ‘पर राज्य किया’ से व्यक्त किया गया है।
- source_word: ባላቅ፡ ወልደ፡ ቤዖር
  choice: बओर के पुत्र बालाक
  rationale: वंश-संबंध को स्पष्ट हिन्दी रचना में रखा गया और दोनों व्यक्तिनामों का निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: Denaba
  choice: दनाबा
  rationale: नगर के प्राचीन नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है; इसका अर्थानुवाद नहीं किया गया।
