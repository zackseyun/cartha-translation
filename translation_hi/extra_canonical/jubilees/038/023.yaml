  footnotes:
  - marker: a
    text: या, ‘उसके बाद।’
    reason: पूर्व प्रचलित अर्थगत प्रस्तुति को विकल्प के रूप में सुरक्षित रखा गया है, जबकि मुख्य पाठ गीज़ पद का अधिक सटीक स्थानापन्न भाव देता है।
lexical_decisions:
- source_word: ህየንቴሁ
  choice: उसके स्थान पर
  rationale: यह स्रोत के ‘उसकी जगह/उसके स्थान पर’ अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है; ‘उसके बाद’ सम्भव अर्थगत प्रस्तुति है, पर कम सटीक है।
- source_word: ነግሠ
  choice: राज्य किया
  rationale: क्रिया का सीधा अर्थ ‘राजा होना/राज्य करना’ है; ‘राज्य किया’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: ባኤሉናን፡ ወልደ፡ አክቡር
  choice: अकबूर के पुत्र बाएलूनान
  rationale: गीज़ पाठ में दिए नामों का देवनागरी लिप्यंतरण करते हुए पुत्र-संबंध को हिन्दी के स्वाभाविक क्रम में रखा गया है।
