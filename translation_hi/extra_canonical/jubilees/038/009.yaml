  text: 'And six hundred fled, and four of the sons of Esau fled with them; and they left their father slain, as he had fallen in the hill-country which is in Add footnote: "Ge''ez reads Adufim, likely a scribal corruption of Adurim.". And the sons of Jacob pursued them as far as Mount Seir.'
translation:
  language: hi
  text: और छः सौ भाग गए, और एसाव के चार पुत्र उनके साथ भाग गए। वे अपने पिता को मारा हुआ छोड़ गए, क्योंकि वह उस पहाड़ी प्रदेश में गिर पड़ा था जो अदूरीम[a] में है। और याकूब के पुत्रों ने सेईर पर्वत तक उनका पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में “अदूफीम” है; सम्भवतः यह “अदूरीम” की लिपिकीय विकृति है।
    reason: गीज़ की प्राप्त वर्तनी को पारदर्शी रूप से रखते हुए संभावित स्थाननाम-संशोधन को अनिश्चित रूप में प्रस्तुत करना।
lexical_decisions:
- source_word: ስድስቱ፡ ምእት
  choice: छः सौ पुरुष
  rationale: मूल में संख्या ‘छः सौ’ है; प्रसंग में भागने वाले योद्धा/पुरुष हैं, इसलिए हिन्दी में आशय स्पष्ट करने के लिए ‘पुरुष’ जोड़ा गया।
- source_word: አርባዕቲሆሙ፡ ደቀ፡ ዔሳው
  choice: एसाव के पुत्रों में से चार
  rationale: गीज़ पदबंध का स्वाभाविक हिन्दी रूप, जो चार पुत्रों को शेष भागने वालों से अलग पहचानता है।
- source_word: ቅቱለ
  choice: मरा हुआ
  rationale: शब्द का अर्थ ‘मारा गया/वध किया हुआ’ है; ‘मरा हुआ’ इस वाक्य में स्वाभाविक है और यह निश्चित नहीं करता कि तत्काल कर्ता कौन था।
- source_word: ውስተ፡ ወገር
  choice: पहाड़ी प्रदेश में
  rationale: यहाँ भूभाग-सूचक अभिव्यक्ति है; ‘पहाड़ी प्रदेश’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: አዱፊም
  choice: अदूरीम[a]
  rationale: मुख्य पाठ में संभावित मूल स्थाननाम ‘अदूरीम’ अपनाया गया है, जबकि वास्तविक गीज़ पाठ ‘अदूफीम’ को पादटिप्पणी में पारदर्शी रूप से रखा गया है।
- source_word: ደብረ፡ ሴኢር
  choice: सेईर पर्वत
  rationale: स्थाननाम और पर्वत-सूचक संज्ञा का प्रचलित हिन्दी रूप।
theological_decisions:
- issue: पिता की मृत्यु का वर्णन
  choice: ‘अपने पिता को मरा हुआ वहीं छोड़ गए, जहाँ वह ... गिरा था’
  alternative: ‘अपने मारे गए पिता को छोड़ गए’
  rationale: मूल के ‘मारा हुआ’ और ‘जैसे/जिस प्रकार वह गिरा’ संबंध को बनाए रखते हुए हिन्दी में सहज वाक्य दिया गया; किसी विशिष्ट हत्यारे या अतिरिक्त कारण को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। स्थाननामों को देवनागरी में ध्वन्यात्मक रूप से दिया गया है।
