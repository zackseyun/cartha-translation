lexical_decisions:
- source_word: ሀገሩ፡ አውኢት
  choice: उसका नगर अवीत था
  rationale: ሀገሩ का अर्थ ‘उसका नगर’ है; አውኢት स्थान-नाम है, जिसे ध्वन्यात्मक रूप से ‘अवीत’ लिखा गया है।
- source_word: ወሞተ፡ አዳት
  choice: और अदात मर गया
  rationale: सरल समन्वयी वाक्य-विन्यास मूल गीइज़ के क्रम और स्पष्ट अर्थ को बनाए रखता है।
- source_word: ህየንቴሁ
  choice: उसके स्थान पर
  rationale: यह पद उत्तराधिकार को केवल कालगत ‘उसके बाद’ कहने की अपेक्षा अधिक सटीक रूप से ‘उसके स्थान पर’ व्यक्त करता है।
- source_word: ሰልማን፡ ዘእም፡ አማሴቃ
  choice: अमासेका के सलमान
  rationale: ዘእም किसी स्थान से संबंध या उद्गम दर्शाता है; स्वाभाविक हिन्दी में इसे ‘अमासेका के सलमान’ कहा गया है।
