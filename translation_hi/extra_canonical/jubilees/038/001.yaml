base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/038/001.yaml
  text: And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send forth your arrows, and cast down the enemy and kill the adversary; and let there be strength for you, for we will not kill your brother, for he is your companion and he is like you; let us give him honor.”
translation:
  language: hi
  text: इसके बाद यहूदा ने अपने पिता याकूब से कहा, “हे पिता, अपना धनुष खींचिए और अपने तीर छोड़िए; शत्रु को गिरा दीजिए और विरोधी को मार डालिए। आपको सामर्थ्य मिले, क्योंकि हम आपके भाई को नहीं मारेंगे; वह आपका साथी है और आपके समान है। आइए, हम उसका सम्मान करें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስከ፡ አባ፡ ቀስተከ
  choice: हे पिता, अपना धनुष खींचिए
  rationale: ምስከ को धनुष के संदर्भ में ‘खींचना/तानना’ समझा गया है; यह उपलब्ध स्रोत-समीक्षा और अगले आदेश के युद्ध-संदर्भ से मेल खाता है।
- source_word: ወፈኑ፡ አሕፃከ
  choice: और अपने तीर छोड़िए
  rationale: ፈኑ का मूल भाव भेजना/छोड़ना है; तीरों के संदर्भ में स्वाभाविक हिन्दी ‘तीर छोड़ना’ है।
- source_word: ወንደፍ፡ ጸላኢ፡ ወቅትል፡ ፀረዊ
  choice: शत्रु को गिरा दीजिए और विरोधी को मार डालिए
  rationale: दो समानांतर युद्ध-आदेशों और ‘शत्रु/विरोधी’ के भेद को बनाए रखा गया है।
- source_word: ወይኩን፡ ለከ፡ ኀይለ
  choice: आपको सामर्थ्य मिले
  rationale: शाब्दिक आशीर्वचनात्मक/कामनासूचक संरचना को सहज हिन्दी में रखा गया है।
- source_word: ውእቱ፡ ወመምስአከ፡ ውእቱ
  choice: वह आपका साथी है और आपके समान है
  rationale: प्रेषित स्रोत-समीक्षा के अनुसार पाठ में लिपिकीय/OCR विकृतियों के पीछे अभिप्रेत वाचन ‘साथी’ और ‘आपके समान’ है; असमर्थित ‘आपका हाथ/आपकी सहायता’ नहीं अपनाया गया।
- source_word: ንህቦ፡ ለክብር
  choice: आइए, हम उसका सम्मान करें
  rationale: संदर्भानुसार ‘उसे सम्मान दें’ को आधुनिक, स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: याकूब के भाई के प्रति हिंसा से इनकार
  choice: क्योंकि हम आपके भाई को नहीं मारेंगे
  alternative: क्योंकि हम आपके भाइयों के शत्रु को मारेंगे
  rationale: नवीनतम स्रोत-समीक्षा पाठ में निषेध और एकवचन ‘आपके भाई’ को पुनर्स्थापित करती है। इससे संबंध और सम्मान का अगला कथन सुसंगत रहता है; किसी धर्मवैचारिक निष्कर्ष के कारण पाठ को नहीं बदला गया।
- issue: भाई की स्थिति
  choice: वह आपका साथी है और आपके समान है
  alternative: आपका हाथ आपके साथ है और आपकी सहायता आपके साथ है
  rationale: प्रदत्त समीक्षा के अनुसार वैकल्पिक वाक्यांश भ्रष्ट/OCR-पाठ पर आधारित और गीइज़ से असमर्थित है। संबंधपरक अर्थ को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक संबोधन और आज्ञार्थक क्रियाएँ; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘धनुष खींचिए’ और ‘तीर छोड़िए’ युद्ध-संदर्भ में स्वाभाविक हैं। स्रोत-समीक्षा द्वारा सुधारे गए उत्तरार्ध को मुख्य पाठ में रखा गया है; कोई फुटनोट आवश्यक नहीं माना गया।
