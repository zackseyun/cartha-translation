  text: And they sent to their father asking whether they should make peace with them or kill them.
translation:
  language: hi
  text: और उन्होंने अपने पिता के पास यह पूछने के लिए संदेश भेजा कि वे उनके साथ मेल करें या उन्हें मार डालें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአኩ
  choice: संदेश भेजा
  rationale: क्रिया का मूल अर्थ ‘भेजा’ है; पिता के पास प्रश्न भिजवाने के प्रसंग में आधुनिक हिन्दी में ‘संदेश भेजा’ स्वाभाविक और स्पष्ट है।
- source_word: ይገብሩ፡ ሰላመ፡ ምስሌሆሙ
  choice: उनके साथ मेल करें
  rationale: शाब्दिक भाव ‘उनके साथ शांति करें’ है; ‘मेल करें’ शांति-संबंध स्थापित करने का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है।
- source_word: ይቀትልዎሙ
  choice: उन्हें मार डालें
  rationale: यह क्रिया प्रत्यक्ष रूप से ‘उन्हें मारें/वध करें’ का अर्थ देती है; ‘मार डालें’ आधुनिक सामान्य हिन्दी में परिणाम को स्पष्ट रखता है।
theological_decisions: []
