translation:
  language: hi
  text: और ये वे राजा हैं जिन्होंने एदोम में उस समय से पहले राज्य किया, जब इस्राएलियों पर एक राजा राज्य करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገሥት
  choice: राजा
  rationale: बहुवचन ‘राजाओं’ को आधुनिक हिन्दी में स्वाभाविक रूप से ‘वे राजा’ के द्वारा व्यक्त किया गया है।
- source_word: ነገሡ
  choice: राज्य किया
  rationale: गीज़ क्रिया का सीधा और प्रसंगानुकूल राजकीय अर्थ सुरक्षित रखता है।
- source_word: በኤዶም
  choice: एदोम में
  rationale: स्थान-सूचक पूर्वसर्ग और पारंपरिक हिन्दी नाम-रूप को बनाए रखता है।
- source_word: ዘእንበለ
  choice: उस समय से पहले, जब
  rationale: ‘इससे पहले कि’ का काल-संबंध स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለውሉደ እስራኤል
  choice: इस्राएल की संतान पर
  rationale: ‘इस्राएल की संतान/संतानों’ की सामूहिक वंशगत धारणा तथा शासन के लक्ष्य को सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल के राजा की अनिश्चितता
  choice: कोई राजा
  alternative: एक राजा
  rationale: स्रोत में संज्ञा अनिश्चित है; ‘कोई राजा’ यहाँ किसी विशिष्ट राजा की पहचान आरोपित किए बिना उस अवस्था को व्यक्त करता है जब इस्राएल पर राजतंत्र स्थापित नहीं हुआ था।
- issue: ‘इस्राएल की संतान’ का सामूहिक अर्थ
  choice: इस्राएल की संतान
  alternative: इस्राएल के पुत्र
  rationale: वंशज समुदाय का समावेशी सामूहिक अर्थ देता है और केवल पुरुष संतानों तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और साधारण पाठकों के लिए सुबोध शैली। मूल वाक्य की वंशावली-सदृश प्रस्तावना तथा ‘राजा/राज्य किया’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
