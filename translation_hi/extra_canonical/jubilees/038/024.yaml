  yaml_path: translation/extra_canonical/jubilees/038/024.yaml
  text: And Baelunan son of Achbor died, and Adath reigned in his place; and the name of his wife was Mayṭabigo, daughter of Maṭarego, daughter of Metebedzaab.
translation:
  language: hi
  text: और अकबूर का पुत्र बाएलूनान मर गया, और उसकी जगह[a] आदात राजा हुआ। उसकी पत्नी का नाम मयतबीगो[b] था; वह मतारेगो की बेटी थी, जो मेतेबेदज़ाआब की बेटी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके बाद।”
    reason: गीज़ पद का मुख्य अर्थ ‘उसकी जगह’ है, पर पिछला अनुवाद कालक्रमसूचक विकल्प भी देता था।
  - marker: b
    text: या, “मेतबीगो।”
    reason: नाम का एक वैकल्पिक लिप्यंतरण।
lexical_decisions:
- source_word: ህየንቴሁ
  choice: उसकी जगह
  rationale: यह पद केवल कालक्रम में ‘उसके बाद’ नहीं, बल्कि पूर्ववर्ती राजा के स्थान पर उत्तराधिकार व्यक्त करता है।
- source_word: መይጠቢጎ
  choice: मयतबीगो
  rationale: गीज़ वर्तनी में ይ (य) स्पष्ट है; इसलिए नाम में ‘य’ बनाए रखा गया है।
- source_word: ወለተ፡ ማጠረጎ፡ ወለተ፡ ሜተቤድዛአብ
  choice: मतारेगो की बेटी और मेतेबेदज़ाआब की नातिन
  rationale: 'मूल की वंशावली-श्रृंखला को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है: वह मतारेगो की बेटी है और मतारेगो मेतेबेदज़ाआब की बेटी है।'
