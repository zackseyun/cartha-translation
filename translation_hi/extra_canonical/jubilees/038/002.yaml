translation:
  language: hi
  text: उस समय याकूब ने अपना धनुष ताना, एक तीर छोड़ा, और उससे अपने भाई एसाव की दाहिनी छाती में प्रहार किया और उसे मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰቀ፡ ያዕቆብ፡ ቀስተ
  choice: याकूब ने अपना धनुष चढ़ाया
  rationale: क्रिया और ‘धनुष’ का संयोजन धनुष को चलाने के लिए तैयार करने या तानने का भाव देता है; आधुनिक हिन्दी में ‘धनुष चढ़ाया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ወፈነወ፡ ሐጸ
  choice: एक तीर छोड़ा
  rationale: मूल में प्रक्षेप्य भेजने/छोड़ने की क्रिया है; हिन्दी में धनुष के प्रसंग में ‘तीर छोड़ा’ सहज अभिव्यक्ति है।
- source_word: ወነደፎ፡ ለዔሳው፡ እኁሁ
  choice: तीर उसके भाई एसाव ... में लगा
  rationale: क्रिया प्रहार करने अथवा भेदने का बोध देती है। वाक्य को स्पष्ट और स्वाभाविक रखने के लिए ‘तीर’ को कर्ता बनाकर ‘लगा’ कहा गया है, बिना परिणाम को मूल से अधिक विशिष्ट बनाए।
- source_word: ጥቦ፡ የማናዊ
  choice: छाती के दाहिने भाग में
  rationale: शरीर के दाहिने वक्ष/स्तन-क्षेत्र का संकेत सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक और अनावश्यक रूप से लैंगिक या चिकित्सकीय नहीं है।
- source_word: ወገደሎ
  choice: और उसने उसे मार डाला
  rationale: मूल की स्पष्ट हत्या/मृत्युकारक क्रिया तथा याकूब की कर्तृता को सीधे व्यक्त करता है।
