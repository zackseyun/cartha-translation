review_pass:
  verdict: revise
  source_fidelity: 'The supplied Ge''ez text opens with ይቀትልዎሙ, ‘he killed them’ (in narrative rendering). The draft omits this clause on the basis of a chapter-split explanation, but it is present in the supplied source for this reference and must be represented. The remaining clauses are substantially faithful: Jacob sends to his sons to make peace; they make peace with the other party; a yoke of service is imposed; and the final verb is appropriately rendered as payment of tribute/tax rather than generic service. The source as supplied does not explicitly contain ‘all their days,’ so this has rightly not been added.'
  naturalness: ‘मेल करना’ is more idiomatic than ‘शांति करना’ for making peace with an opposing party in modern standard Hindi. ‘अपने पुत्रों को संदेश भेजा’ is also more natural than ‘अपने पुत्रों के पास संदेश भेजा.’ ‘सेवा का जुआ’ preserves the source’s concrete metaphor and is understandable in an elevated scriptural register.
  terminology: ‘कर देते रहें’ accurately expresses the tribute sense of ይጽብሑ. The footnote preserves the less specific alternative, ‘serve Jacob,’ without displacing the main rendering. ‘याकूब’ is consistently used.
  issues:
  - severity: high
    issue: The opening clause ይቀትልዎሙ is omitted.
    rationale: Although the draft identifies a possible editorial verse-boundary issue, the source text supplied for JUB.38.13 includes this clause. A source-grounded translation of the assigned text should include it; the referent remains unstated, as in the source.
  - severity: low
    issue: ‘शांति कर लें’ is somewhat less idiomatic in this conflict-resolution context.
    rationale: ‘मेल करें/मेल कर लिया’ naturally conveys making peace while retaining the source meaning.
  revised_text: उसने उन्हें मार डाला। फिर याकूब ने अपने पुत्रों को यह संदेश भेजा कि वे मेल करें। उन्होंने उनसे मेल कर लिया और उन पर सेवा का जुआ रख दिया, ताकि वे याकूब और उसके सभी पुत्रों को कर देते रहें।[a]
  revised_footnotes:
  - marker: a
    text: या, “याकूब की सेवा करते रहें।”
    reason: अंतिम क्रिया का मुख्य अर्थ इस प्रसंग में कर या भेंट देना है, पर अंग्रेज़ी POB लेखा-पथ में दर्ज व्यापक ‘serve Jacob’ विकल्प को पारदर्शिता के लिए सुरक्षित रखा गया है।
