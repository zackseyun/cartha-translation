base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/038/013.yaml
  text: And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should pay tribute to Jacob and his sons all their days.
translation:
  language: hi
  text: तब याकूब ने अपने पुत्रों के पास संदेश भेजा कि वे शांति कर लें। उन्होंने उन लोगों के साथ शांति कर ली और उन पर सेवा का जुआ रख दिया, ताकि वे याकूब और उसके सभी पुत्रों को कर चुकाते रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰላመ (salāma)
  choice: शांति
  rationale: यहाँ शब्द वैर समाप्त करके समझौता करने के अर्थ में है; इसलिए ‘शांति कर लेना’ स्वाभाविक और अर्थानुकूल है।
- source_word: አርዑተ፡ ቅኔ (ʾarʿuta qenē)
  choice: सेवा का जुआ
  rationale: मूल का ठोस रूपक ‘जुआ’ और अधीन सेवा का भाव दोनों सुरक्षित रखे गए हैं।
- source_word: ይጽብሑ (yiṣbəḥu)
  choice: कर चुकाते रहें
  rationale: इस प्रसंग में क्रिया कर या राजस्व देने का विशिष्ट भाव व्यक्त करती है, केवल सामान्य सेवा का नहीं।
- source_word: ኵሎ (kwello)
  choice: सभी
  rationale: यह याकूब के पुत्रों की समग्रता बताता है; उपलब्ध गीइज़ पाठ में ‘जीवन भर’ या ‘सारे दिन’ के लिए अलग पद नहीं है।
theological_decisions:
- issue: अधीनता के स्वरूप को सामान्य सेवा या कराधान के रूप में प्रस्तुत करना
  choice: सेवा का जुआ रखे जाने के परिणाम को ‘कर चुकाते रहें’ कहा गया
  alternative: ‘याकूब की सेवा करते रहें’
  rationale: मूल संज्ञा-समूह अधीन सेवा का रूपक देता है, जबकि अंतिम क्रिया अधिक विशेष रूप से कर चुकाने की ओर संकेत करती है; दोनों स्तरों को अलग-अलग बनाए रखना मूल का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक ይቀትልዎሙ को संस्करणीय पद-विभाजन में पिछले वाक्य का अंतिम अंश मानते हुए इस पद में शामिल नहीं किया गया। ‘उन लोगों’ से संदर्भित दूसरे पक्ष को स्पष्ट किया गया है, पर उसका नाम पाठ में नहीं जोड़ा गया।
