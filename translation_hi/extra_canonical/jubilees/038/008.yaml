  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। लंबे गीइज़ वाक्य को पठनीयता के लिए तीन हिन्दी वाक्यों में विभाजित किया गया है; व्यक्तिनामों के प्रचलित बाइबिलीय हिन्दी रूप अपनाए गए हैं।
