  yaml_path: translation/extra_canonical/jubilees/038/008.yaml
  text: And Simeon and Benjamin and Enoch, the son of Reuben, went out to the west side of the tower, and fifty were with them; and they killed four hundred valiant warriors of Edom and the Horites.
translation:
  language: hi
  text: और शिमोन, बिन्यामीन और रूबेन का पुत्र हनोक मीनार की पश्चिमी ओर निकल गए। उनके साथ पचास और थे। उन्होंने एदोमियों और होरियों के चार सौ वीर योद्धाओं को मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገጸ፡ ዐረቢሁ፡ ለማኅፈድ
  choice: मीनार की पश्चिमी ओर
  rationale: यह पदबंध मीनार के पश्चिमी भाग या दिशा को सूचित करता है; ‘पश्चिमी ओर’ हिन्दी में स्वाभाविक रहते हुए स्थानगत अर्थ बनाए रखता है।
- source_word: ጽኑዓነ፡ መስተቃትላነ
  choice: वीर योद्धाओं
  rationale: दोनों शब्द बलवान/दृढ़ और युद्ध करने वाले पुरुषों का संयुक्त वर्णन करते हैं; ‘वीर योद्धा’ इसे संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኤዶማ፡ ኤዶም፡ ወኤዶማ፡ ሖሬዎን
  choice: एदोमियों और होरियों के
  rationale: पाठ एदोम और होरी समुदायों से मारे गए लोगों को निर्दिष्ट करता है; समुदायवाचक हिन्दी रूप वाक्य का संबंध स्पष्ट करता है।
theological_decisions: []
