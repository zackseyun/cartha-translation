  yaml_path: translation/extra_canonical/jubilees/017/003.yaml
  text: And he remembered the word that He had spoken to him on the day when Lot was separated from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed the Creator with all his mouth.
translation:
  language: hi
  text: और उसे वह वचन याद आया जो प्रभु ने उससे उस दिन कहा था जब लूत उससे अलग हो गया था। वह आनन्दित हुआ, क्योंकि प्रभु ने उसे धरती पर वंश दिया था, ताकि वह धरती का उत्तराधिकारी हो जाए; और उसने अपने पूरे मुँह से[a] सृष्टिकर्ता को धन्य ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने समूचे मुँह से।”
    reason: ‘अपने पूरे मुँह से’ मूल की अभिव्यक्ति है, जो हिन्दी में असामान्य लग सकती है; टिप्पणी उसका शाब्दिक स्वरूप स्पष्ट करती है।
lexical_decisions:
- source_word: ቃሎ (qālo)
  choice: वह वचन
  rationale: यह रूप एकवचन है और संदर्भ में अब्राहम से कही गई परमेश्वर की प्रतिज्ञा को दर्शाता है।
- source_word: ዘርአ (zarʾa)
  choice: वंश
  rationale: ‘बीज’ के वंशगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और आगे के उत्तराधिकार-वाक्य से जुड़ता है।
- source_word: ይረሳ (yǝrasa)
  choice: उत्तराधिकारी हो जाए
  rationale: यह ወረሰ, ‘उत्तराधिकार पाना’, से निकला रूप है; इसलिए ‘धरती को ढकना’ उपयुक्त नहीं है।
- source_word: ለፈጣሪ (la-fäṭari)
  choice: सृष्टिकर्ता को
  rationale: संज्ञा का सीधा और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: በኵሉ አፉሁ (ba-kʷǝllu ʾafuhu)
  choice: अपने पूरे मुँह से
  rationale: मूल की ठोस देहात्मक अभिव्यक्ति को सुरक्षित रखता है; इसे केवल ‘पूरे मन से’ करने पर ‘मुँह’ का बिंब मिट जाता।
theological_decisions:
- issue: स्मरण किए गए वचन का वक्ता
  choice: मुख्य पाठ में ‘प्रभु ने उससे’
  alternative: ‘उसने उससे’ अथवा कर्मवाच्य ‘उससे कहा गया था’
  rationale: गीज़ सर्वनामों से युक्त है, पर उत्पत्ति 13 के प्रसंग और इसी पद में ‘प्रभु’ के उल्लेख से वक्ता परमेश्वर है। स्पष्ट हिन्दी के लिए इसे मुख्य पाठ में व्यक्त किया गया है।
- issue: धरती का उत्तराधिकारी कौन है
  choice: एकवचन ‘वह’ को बनाए रखा
  alternative: ‘उसका वंश धरती का उत्तराधिकारी हो जाए’
  rationale: मूल में एकवचन सर्वनाम है, जिसका निकटतम संबंध सामूहिक ‘वंश’ से हो सकता है, पर वाक्य में कुछ संदर्भगत खुलापन रहता है; हिन्दी में ‘वह’ उसी तनाव को यथासंभव बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘लूत’, ‘प्रभु’, ‘वचन’ और ‘सृष्टिकर्ता’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं। हर मुख्य क्रिया और संबंध को स्पष्ट रखते हुए मूल के एकवचन ‘वचन’, वंशगत ‘बीज’ और उत्तराधिकार के अर्थ को सुरक्षित किया गया है।
