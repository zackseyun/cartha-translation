  text: And she bore him a son and he called his name Nabaioth, for she said, “The Lord is near to me.”
translation:
  language: hi
  text: और उस स्त्री ने उसके लिए एक पुत्र को जन्म दिया, और उस पुरुष ने उसका नाम नबायोत रखा, क्योंकि वह स्त्री बोली, “प्रभु मेरे निकट है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: और उसने उसके लिए एक पुत्र को जन्म दिया
  rationale: स्त्रीलिंग क्रिया ወለደት और परोक्ष कर्म ሎቱ को स्पष्ट रखते हुए मूल वाक्य-संरचना के निकट स्वाभाविक हिन्दी दी गई है।
- source_word: ወጸውዐ፡ ስሞ፡ ናቤዮት
  choice: और उसने उसका नाम नबायोत रखा
  rationale: ጸውዐ तृतीय पुरुष पुल्लिंग एकवचन है, इसलिए यहाँ कर्ता पुरुष है; नाम ናቤዮት का लिप्यंतरण ‘नबायोत’ किया गया है।
- source_word: ቅሩብ፡ እግዚአብሔር፡ ሊተ
  choice: प्रभु मेरे निकट है
  rationale: ‘निकट’ मूल के स्थानिक/संबंधपरक भाव को बनाए रखता है और እግዚአብሔር को सामान्य, गरिमापूर्ण ‘प्रभु’ से व्यक्त करता है।
theological_decisions:
- issue: नाम रखने वाले व्यक्ति की पहचान
  choice: दूसरी क्रिया के पुल्लिंग रूप को हिन्दी में ‘उसने’ द्वारा बनाए रखा गया है, जिसका संदर्भ पुरुष है।
  alternative: दोनों क्रियाओं का कर्ता स्त्री मानकर ‘और उसने उसका नाम... रखा’ पढ़ना।
  rationale: गीज़ पाठ में जन्म देने की क्रिया स्त्रीलिंग है, जबकि नाम पुकारने/रखने की क्रिया पुल्लिंग है; इस व्याकरणिक परिवर्तन को मिटाना उचित नहीं।
- issue: प्रभु की निकटता का कथन
  choice: “प्रभु मेरे निकट है।”
  alternative: “प्रभु मेरे पास है” या “प्रभु मेरे समीप आया है।”
  rationale: मूल में ‘निकट’ का विधेयात्मक कथन है; उसमें गति या आगमन का भाव जोड़ना स्रोत से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। स्त्री और पुरुष कर्ताओं के व्याकरणिक अंतर को यथासंभव सुरक्षित रखा गया है; प्रसंग उपलब्ध न होने से पुरुष कर्ता का नाम नहीं जोड़ा गया।
