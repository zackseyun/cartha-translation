  yaml_path: translation/extra_canonical/jubilees/017/001.yaml
  text: And the Lord knew that Abraham was faithful in all his trials; for he had tested him in his country, and with famine, and had tested him through the wealth of kings, and again had tested him through his wife when she was taken away, and through circumcision, and had tested him through Ishmael and Hagar his maidservant when he sent them away. And in everything by which he had tested him, he was found faithful, and his soul was not impatient, and he did not delay in acting; for he was faithful and a lover of the Lord.
translation:
  language: hi
  text: और प्रभु जानता था कि अब्राहम अपनी सभी परीक्षाओं में विश्वासयोग्य रहा; क्योंकि उसने उसके देश में और अकाल के द्वारा उसे परखा था। उसने राजाओं की धन-संपत्ति के द्वारा भी उसे परखा था; फिर उसकी पत्नी के द्वारा, जब उसे ले जाया गया था, और खतने के द्वारा; और इश्माएल तथा उसकी दासी हागर के द्वारा, जब उसने उन्हें विदा कर दिया था। जिन-जिन बातों के द्वारा उसने उसे परखा, उन सब में वह विश्वासयोग्य पाया गया। उसका मन अधीर नहीं हुआ और उसने कार्य करने में देर नहीं की, क्योंकि वह विश्वासयोग्य और प्रभु से प्रेम करनेवाला था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምንዳቤሁ
  choice: अपनी सभी परीक्षाओं में
  rationale: संदर्भ में बार-बार आनेवाली ‘परखने’ की क्रिया के अनुरूप इसे कष्ट मात्र नहीं, बल्कि विश्वासयोग्यता जाँचने वाली परीक्षाओं के रूप में व्यक्त किया गया है।
- source_word: አመከሮ
  choice: उसे परखा था
  rationale: यहाँ प्रयुक्त क्रिया परीक्षा या जाँच करने का भाव रखती है; ‘परखा’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: በብዕለ፡ ነገሥት
  choice: राजाओं की धन-संपत्ति के द्वारा
  rationale: मूल के ‘राजाओं के धन/वैभव’ को व्यापक अर्थ वाले ‘धन-संपत्ति’ से रखा गया है और माध्यमसूचक संरचना सुरक्षित रखी गई है।
- source_word: ኢተአገተት፡ ነፍሱ
  choice: उसका मन अधीर नहीं हुआ
  rationale: शाब्दिक ‘उसका प्राण/आत्मा अधीर नहीं हुआ’ हिन्दी में अस्वाभाविक है; ‘मन’ व्यक्ति की भीतरी प्रतिक्रिया का स्वाभाविक समतुल्य है।
- source_word: መፍቀሬ፡ እግዚአብሔር
  choice: प्रभु से प्रेम करनेवाला
  rationale: ‘प्रभु का प्रेमी’ की अपेक्षा यह आधुनिक हिन्दी में अधिक सहज है और संबंध का अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वर द्वारा अब्राहम की परीक्षा और उसकी विश्वासयोग्यता
  choice: ईश्वर के परखने और अब्राहम के विश्वासयोग्य पाए जाने—दोनों कथनों को स्पष्ट रूप से बनाए रखा गया है।
  alternative: परीक्षा को केवल दुःख सहने या नैतिक प्रलोभन के रूप में प्रस्तुत करना।
  rationale: मूल पाठ विभिन्न घटनाओं को ईश्वरीय परीक्षा के रूप में जोड़ता है; अनुवाद इस तनाव को किसी संप्रदायगत व्याख्या से हल नहीं करता।
- issue: ‘प्रभु से प्रेम करनेवाला’ का स्वरूप
  choice: इसे अब्राहम के चरित्र का वर्णन माना गया है।
  alternative: इसे किसी औपचारिक धार्मिक उपाधि के रूप में अनूदित करना।
  rationale: मूल में सामान्य वर्णनात्मक पद है; अतः अनावश्यक धर्मशास्त्रीय पदवी नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज गद्य रखा गया है। मूल की पुनरावृत्त ‘परखा’ संरचना को अर्थगत एकता के लिए बनाए रखा गया है, जबकि अत्यधिक बोझिल वाक्य को पठनीयता हेतु कई वाक्यों में बाँटा गया है।
