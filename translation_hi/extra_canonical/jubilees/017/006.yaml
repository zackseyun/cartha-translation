translation:
  language: hi
  text: कि वह उन्हें अपने पास से दूर भेज दे।[a] तब प्रभु ने अब्राहम से कहा, “उस बालक और उस दासी के कारण यह बात तेरी दृष्टि में दुःखद न हो। सारा तुझसे जो कुछ कहे, उसकी बात सुन और वैसा ही कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ अनुवादों में: “उसने उन्हें अपने पास से दूर भेज दिया।”'
    reason: पूर्व प्रचलित पाठ और क्रियारूप की वैकल्पिक व्याख्या को दर्ज करना, यद्यपि आश्रित अर्थ व्याकरण और प्रसंग से अधिक समर्थित है।
lexical_decisions:
- source_word: ይሰድዶሙ፡ እምኀቤሁ
  choice: कि वह उन्हें अपने पास से दूर भेज दे
  rationale: क्रिया का रूप पूर्ववर्ती विचार को पूरा करने वाला संभावनार्थक/आश्रित रूप है, न कि पूर्ण भूतकाल। ‘अपने पास से दूर’ मूल के अलग कर भेजने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሕፃን
  choice: बालक
  rationale: यहाँ इश्माएल के लिए प्रयुक्त सामान्य शब्द का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: ወለት
  choice: दासी
  rationale: शब्द का अर्थ कन्या/युवती अथवा सेविका हो सकता है; हाजिरा के सामाजिक दर्जे और प्रसंग में ‘दासी’ सर्वाधिक उपयुक्त है।
- source_word: ስማዕ፡ ቃለ፡ ወግበር
  choice: उसकी बात सुन और वैसा ही कर
  rationale: शाब्दिक ‘वचन सुन और कर’ को वर्तमान हिन्दी के स्वाभाविक आदेश में व्यक्त किया गया है, जबकि सुनने और पालन करने—दोनों क्रियाएँ सुरक्षित हैं।
theological_decisions:
- issue: आरम्भिक क्रिया को स्वतंत्र घटना मानना या पिछले पद पर निर्भर वाक्यांश
  choice: 'पिछले पद को पूरा करने वाला आश्रित वाक्यांश: ‘कि वह… भेज दे’'
  alternative: ‘उसने उन्हें अपने पास से दूर भेज दिया’
  rationale: गीज़ क्रिया का व्याकरणिक रूप और कथा-क्रम आश्रित अर्थ का समर्थन करते हैं; अब्राहम परमेश्वर के बोलने के बाद ही उन्हें वास्तव में भेजता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। संवाद में बाइबिलीय संबोधन के अनुरूप ‘तेरी/तुझसे’ रखा गया है। ‘तेरी दृष्टि में दुःखद’ मूल की दृष्टि-संबंधी अभिव्यक्ति को बनाए रखते हुए बोधगम्य हिन्दी देता है।
