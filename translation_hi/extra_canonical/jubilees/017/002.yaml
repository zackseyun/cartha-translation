base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/002.yaml
  text: And the Lord said to him, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your beloved son whom you love, Isaac, and go into the high land, and offer him there on one of the mountains that I will show you.” And he rose early in the morning and saddled his donkey and took two of his young servants with him, and Isaac his son; and he split the wood of the offering and went to the place on the third day, and he saw the place from afar. And he came to a well of water, and he said to his young servants, “Stay here with the donkey, and I and the boy will go on, and when we have worshiped we will return to you.” And he took the wood of the sacrifice and laid it on Isaac his son, and he took in his hand the fire and the knife. And the two of them went together to that place.
translation:
  language: hi
  text: और उसे वह बात याद आई जो उसने उस दिन कही थी जब लूत उससे अलग हुआ था। वह आनन्दित हुआ, क्योंकि प्रभु ने उसे पृथ्वी पर ऐसा वंश दिया था जो उस देश का अधिकारी बने। तब उसने पूरे मन से सृष्टिकर्ता की स्तुति की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उसने अपने पूरे मुख से सृष्टिकर्ता को आशीष दी।”'
    reason: मूल की ठोस और कुछ असामान्य अभिव्यक्ति को पाठक के लिए सुरक्षित रखना।
lexical_decisions:
- source_word: ተዘከረ
  choice: उसे ... याद आई
  rationale: क्रिया के स्मरणार्थक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘርአ
  choice: वंश
  rationale: यहाँ ‘बीज’ का अर्थ अब्राहम की संतान/वंश है; ‘वंश’ हिन्दी में स्वाभाविक है और सामूहिक अर्थ बनाए रखता है।
- source_word: ይረሳ
  choice: अधिकारी बने
  rationale: विरासत में पाने या अधिकार ग्रहण करने के भाव को व्यक्त करता है; ‘देश का अधिकारी’ प्रतिज्ञात भूमि के संदर्भ में स्वाभाविक है।
- source_word: ፈጣሪ
  choice: सृष्टिकर्ता
  rationale: मूल में प्रयुक्त ईश्वर-संबंधी उपाधि ‘Creator’ का सीधा और प्रतिष्ठित हिन्दी रूप।
- source_word: በኵሉ አፉሁ
  choice: पूरे मन से
  rationale: शाब्दिक रूप ‘अपने पूरे मुख से’ है; हिन्दी में इसका भाव पूर्ण और हार्दिक स्तुति है, जिसे यह मुहावरा स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: भूमि के उत्तराधिकारी का कर्ता
  choice: वंश को उस देश का अधिकारी बताया गया है
  alternative: अब्राहम स्वयं देश का अधिकारी बने
  rationale: मूल में निकटतम कर्ता ‘वंश’ है और क्रिया एकवचन सामूहिक संज्ञा के अनुरूप समझी जा सकती है; अनुवाद इसी व्याकरणिक संबंध को बनाए रखता है।
- issue: ईश्वर को आशीष देने की अभिव्यक्ति
  choice: सृष्टिकर्ता की स्तुति की
  alternative: सृष्टिकर्ता को आशीष दी
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘आशीष देना’ है, पर ईश्वर के संबंध में हिन्दी में ‘स्तुति करना’ अभिप्रेत अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। प्रदत्त गीइज़ पंक्ति का विषय लूत से अलग होने की स्मृति और दिए गए वंश पर आनन्द है; यह साथ दिए गए अंग्रेज़ी परामर्श-पाठ से विषयवस्तु में मेल नहीं खाती। अनुवाद मूल-भाषा पंक्ति पर आधारित है। स्रोत-मेटाडेटा में पंक्ति को पद 3 बताया गया है, जबकि अनुरोधित संदर्भ 17:2 है; पद-संख्या का प्रकाशन से पहले सत्यापन आवश्यक है।
