  text: her child. And she arose and went toward the wilderness of Paran. And the child grew, and he became an archer, and the Lord was with him, and his mother took for him a wife from the daughters of Egypt.
translation:
  language: hi
  text: उसके बच्चे को।[a] फिर वह उठी और पारान के निर्जन प्रदेश की ओर चली गई। बच्चा बड़ा हुआ और धनुर्धर बन गया। प्रभु उसके साथ था, और उसकी माँ ने मिस्र की बेटियों में से उसके लिए एक पत्नी ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और बच्चा बड़ा हुआ, और वह उठकर निर्जन प्रदेश में चली गई।”
    reason: पूर्ववर्ती पाठ-प्रस्तुति में आरम्भिक शब्द को अगले कथन से जोड़कर पढ़ने और पद-विभाजन को अलग ढंग से समझने का विकल्प दर्ज करता है।
lexical_decisions:
- source_word: ሕፃና
  choice: उसके बच्चे को
  rationale: स्त्रीलिंग संबंधसूचक प्रत्यय के साथ यह रूप ‘उसके बच्चे को’ दर्शाता है और सम्भवतः पिछले पद के अंतिम क्रियापद का कर्म है; इसलिए पद की खंडित शुरुआत को सुरक्षित रखा गया है।
- source_word: መንገለ
  choice: की ओर
  rationale: यह दिशासूचक शब्द ‘की ओर’ है, केवल ‘में’ नहीं।
- source_word: በድው ፍራም
  choice: पारान के निर्जन प्रदेश
  rationale: ‘पारान का wilderness/desert’ के लिए सहज आधुनिक हिन्दी; ‘निर्जन प्रदेश’ भौगोलिक मरुस्थलीय क्षेत्र का भाव देता है।
- source_word: ወአሀቀ ሕፃን
  choice: बच्चा बड़ा हुआ
  rationale: क्रिया बच्चे की वृद्धि या बड़ा होने को व्यक्त करती है।
- source_word: ነዳፌ
  choice: धनुर्धर
  rationale: धनुष चलाने वाले व्यक्ति के लिए संक्षिप्त और प्रतिष्ठित हिन्दी शब्द।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ की पारंपरिक ईश्वरीय उपाधि और परामर्श-पाठ के ‘the Lord’ के अनुरूप।
- source_word: እምአዋልደ ግብጽ
  choice: मिस्र की बेटियों में से
  rationale: ‘मिस्र की पुत्रियों में से’ का निकट, स्वाभाविक रूप; जातीय-भौगोलिक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: प्रभु की उपस्थिति का कथन
  choice: प्रभु उसके साथ था
  alternative: परमेश्वर उसके साथ था
  rationale: मूल እግዚአብሔር और अंग्रेज़ी परामर्श-पाठ की उपाधि ‘Lord’ को बनाए रखा गया; कथन में कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: पत्नी चुनने में माँ की भूमिका
  choice: उसकी माँ ने ... उसके लिए एक पत्नी ली
  alternative: उसकी माँ ने ... उसके लिए एक पत्नी चुनी
  rationale: ‘ली’ मूल क्रिया के अधिक निकट है और विवाह की व्यवस्था में माँ की भूमिका को ‘चुनी’ कहकर अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। आरम्भ का वाक्यांश पिछले पद से जुड़ा खंड प्रतीत होता है, इसलिए उसे पूरा वाक्य बनाकर अर्थ जोड़ने के बजाय उसकी खंडित प्रकृति सुरक्षित रखी गई है।
