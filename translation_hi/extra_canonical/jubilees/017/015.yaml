  text: When I called him. And it came to pass in the seventh week, in the first year, in the first month, in this jubilee, on the twelfth of this month, words came in heaven concerning Abraham, that he was faithful in all that he spoke, and he loved the Lord, and in every trial he was faithful.
translation:
  language: hi
  text: जब मैंने उसे पुकारा। फिर ऐसा हुआ कि सातवें सप्ताह में, पहले वर्ष में, पहले महीने में, इस जुबिली में, इसी महीने के बारहवें दिन, स्वर्ग में अब्राहम के विषय में वचन हुए कि जो कुछ वह कहता था उसमें वह विश्वासयोग्य था, वह प्रभु से प्रेम करता था, और हर परीक्षा में विश्वासयोग्य था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸዋዕክዎ
  choice: मैंने उसे पुकारा
  rationale: क्रिया प्रथम पुरुष एकवचन है और कर्म-प्रत्यय पुल्लिंग एकवचन है; इसलिए इसे तीसरे पुरुष में नहीं बदला गया।
- source_word: በሱባዔ፡ ሳብዕ
  choice: सातवें सप्ताह
  rationale: काल-गणना के तकनीकी पद को स्रोत के निकट रखते हुए सहज हिन्दी में प्रस्तुत किया गया।
- source_word: ኢዮቤልው
  choice: जयन्ती
  rationale: यह ‘जुबिली’ काल-चक्र का पद है; ‘जयन्ती’ हिन्दी बाइबिलीय साहित्य में संक्षिप्त और बोधगम्य समतुल्य है।
- source_word: ኮነ፡ ቃላት፡ በሰማያት
  choice: स्वर्ग में ... ये बातें कही गईं
  rationale: शाब्दिक ‘स्वर्ग में बातें/वचन हुए’ को स्वाभाविक हिन्दी में निष्क्रिय कथन के रूप में दिया गया, बिना वक्ता जोड़ने के।
- source_word: መሃይምን / ምእመነ
  choice: विश्वासयोग्य / विश्वासयोग्य बना रहा
  rationale: दोनों स्थानों पर अब्राहम की निष्ठा का दोहराव स्रोत में है; अन्तिम प्रयोग में परीक्षा के दौरान स्थिरता दिखाने के लिए ‘बना रहा’ कहा गया।
- source_word: ምንዳቤ
  choice: परीक्षा
  rationale: सन्दर्भ में इसका अर्थ आज़माइश या कसौटी है; ‘परीक्षा’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: स्वर्ग में कही गई बातों का वक्ता
  choice: वक्ता को अनिर्दिष्ट रखा गया
  alternative: परमेश्वर या स्वर्गदूतों को स्पष्ट वक्ता बताना
  rationale: स्रोत केवल स्वर्ग में वचन/बातें होने की बात कहता है; किसी विशिष्ट वक्ता को जोड़ना व्याख्यात्मक विस्तार होता।
- issue: अब्राहम की विश्वासयोग्यता का दोहराव
  choice: दोनों कथनों को बनाए रखा गया
  alternative: दोनों को मिलाकर एक संक्षिप्त कथन बनाना
  rationale: स्रोत पहले उसकी बातों में और फिर हर परीक्षा में विश्वासयोग्यता अलग-अलग बताता है; इस बलाघात को सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरम्भिक ‘जब मैंने उसे पुकारा।’ स्रोत की खंडित वाक्य-रचना और विराम को जानबूझकर सुरक्षित रखता है; इसे पिछले पद से जोड़कर तीसरे पुरुष में नहीं बदला गया।
