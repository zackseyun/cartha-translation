  text: क्योंकि इसहाक में तुम्हारे लिए नाम और वंश पुकारे जाएंगे। और इस दासी के पुत्र के विषय में—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በይስሐቅ
  choice: इसहाक में
  rationale: उपसर्ग በ का निकट औपचारिक अर्थ ‘में’ है; यह उत्पत्ति 21:12 से जुड़ी पारंपरिक अभिव्यक्ति को भी बनाए रखता है।
- source_word: ይጼዋዕ
  choice: पुकारा जाएगा
  rationale: क्रिया का मूल अर्थ ‘पुकारना/नाम देना’ है। कर्मवाच्य और भविष्य-संदर्भ दोनों सुरक्षित रखे गए हैं।
- source_word: ስም፡ ወዘርእ
  choice: नाम और वंश
  rationale: दोनों संज्ञाओं को स्पष्ट रूप से रखा गया है; ዘርእ के लिए प्रसंगानुकूल सामूहिक अर्थ ‘वंश’ स्वाभाविक हिन्दी देता है।
- source_word: ወልደስ፡ ለዛ፡ ወለት
  choice: इस दासी के पुत्र
  rationale: वाक्यांश का आशय स्त्री की अधीन सामाजिक स्थिति और उसके पुत्र से है; आधुनिक हिन्दी में ‘दासी’ गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: ‘नाम और वंश पुकारे जाने’ की असामान्य संयुक्त अभिव्यक्ति
  choice: नाम और वंश पुकारा जाएगा
  alternative: तुम्हारा नाम और वंश इसहाक से चलेगा
  rationale: स्रोत की वास्तविक असामान्यता और संभावित धर्मवैचारिक तनाव को सरल व्याख्या में बदलने के बजाय सुरक्षित रखा गया है।
- issue: पद का अधूरा अंतिम उपवाक्य
  choice: अंत में दीर्घ विराम-चिह्न लगाकर अगले पद की ओर खुला रखा गया
  alternative: अगले पद की सामग्री जोड़कर वाक्य पूरा करना
  rationale: दिए गए स्रोत में वाक्य ‘इस दासी के पुत्र के विषय में’ पर आगे जारी रहता है; अनुपस्थित सामग्री नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठक के लिए स्पष्ट किंतु मूल की औपचारिक और कुछ असामान्य संरचना को सुरक्षित रखने वाला गरिमापूर्ण धर्मग्रंथीय रजिस्टर।
