translation:
  language: hi
  text: तब उसने[a] उस स्त्री की आँखें खोल दीं। उस स्त्री ने पानी का एक कुआँ देखा; वह गई, उसने मशक में पानी भरा और उसे पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में क्रिया का कर्ता तीसरे पुरुष पुल्लिंग एकवचन—‘उसने’—है; प्रसंग में इसका संकेत परमेश्वर की ओर है।
    reason: गीज़ के पुल्लिंग क्रियारूप को स्पष्ट करना और स्त्री को कर्ता मानने वाले पुराने पाठ से भेद बताना।
lexical_decisions:
- source_word: ዐዘቅተ፡ ማይ
  choice: पानी का एक कुआँ
  rationale: यह पद पानी के स्रोत या कुएँ को सूचित करता है; प्रसंग के अनुरूप सहज हिन्दी में ‘कुआँ’ चुना गया है।
- source_word: ዝቃ
  choice: मशक
  rationale: यह पानी रखने की पशु-चर्म से बनी थैली को सूचित करता है; ‘मशक’ संक्षिप्त और प्रचलित हिन्दी बाइबलीय शब्द है।
- source_word: ወአስተየቶ
  choice: और उसे पिलाया
  rationale: क्रिया का अर्थ किसी पुरुषवाचक पात्र को पीने के लिए देना है; हिन्दी में ‘उसे पिलाया’ स्वाभाविक रूप से इसे व्यक्त करता है।
theological_decisions:
- issue: आँखें खोलने वाले कर्ता की पहचान
  choice: मुख्य पाठ में ‘उसने’ रखा गया और पादटिप्पणी में पुल्लिंग एकवचन का संकेत दिया गया।
  alternative: ‘परमेश्वर ने’ लिखकर कर्ता की स्पष्ट पहचान करना, या ‘उस स्त्री ने अपनी आँखें खोलीं’ लिखना।
  rationale: गीज़ क्रिया ወከሠተ तीसरे पुरुष पुल्लिंग एकवचन में है, इसलिए स्त्री को कर्ता बनाना व्याकरण के विरुद्ध होगा। फिर भी इस वाक्यांश में परमेश्वर का नाम स्पष्ट रूप से नहीं है; अतः मुख्य पाठ में निहित कर्ता की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लगातार आने वाले हिन्दी सर्वनामों से कर्ताओं में भ्रम न हो, इसलिए दूसरी उपवाक्य में ‘उस स्त्री ने’ स्पष्ट किया गया है।
