lexical_decisions:
- source_word: ወነሥአቶ፡ እሙ፡
  choice: तब उसकी माँ ने उसे उठाकर
  rationale: क्रिया ነሥአ ‘लेना/उठाना’ और कर्ता እሙ ‘उसकी माँ’ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ወገደፈቶ፡
  choice: डाल दिया
  rationale: ገደፈ के ‘फेंकना/डाल देना/छोड़ देना’ अर्थ-क्षेत्र में ‘डाल दिया’ प्रसंगानुकूल है और अनावश्यक हिंस्रता नहीं जोड़ता।
- source_word: ታኅተ፡ አሐቲ፡ እልያስ፡
  choice: जैतून के एक पेड़ के नीचे
  rationale: शाब्दिक रूप से ‘एक जैतून-वृक्ष के नीचे’; አሐቲ यहाँ अनिश्चितता भी जता सकता है, पर हिन्दी में ‘एक पेड़’ स्वाभाविक ढंग से वही अर्थ देता है।
- source_word: ወሖረት፡ ወነበረት፡
  choice: फिर वह वहाँ से जाकर ... बैठ गई
  rationale: दोनों क्रमिक स्त्रीलिंग क्रियाओं ‘वह गई’ और ‘वह बैठी’ को हिन्दी की स्वाभाविक क्रिया-श्रृंखला में रखा गया है; ‘वहाँ से’ प्रस्थान का निहित भाव स्पष्ट करता है।
- source_word: አንጻር፡ መጠነ፡
  choice: कुछ दूरी पर उसके सामने
  rationale: አንጻር ‘सामने/आमने-सामने’ और መጠነ ‘एक माप/दूरी तक’ का संक्षिप्त, स्वाभाविक निरूपण; ‘उसके’ प्रसंगगत लक्ष्य को स्पष्ट करता है।
