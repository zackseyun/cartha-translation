  yaml_path: translation/extra_canonical/jubilees/017/004.yaml
  text: And Sarah saw Ishmael joking and dancing, and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, “Cast out this maidservant and her son.”
translation:
  language: hi
  text: और सारा ने इश्माएल को हँसी-मज़ाक करते और नाचते देखा, और अब्राहम को बड़े आनन्द के साथ आनन्द मनाते देखा। तब वह इश्माएल से ईर्ष्या करने लगी और उसने अब्राहम से कहा, “इस दासी[a] और उसके बेटे को निकाल दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस स्त्री”। यहाँ मूल पाठ का अंतिम शब्द विकृत है; पाठ-संदर्भ “दासी” अर्थ का समर्थन करता है।
    reason: स्रोत-पाठ की पाठगत कठिनाई और वैकल्पिक सामान्य अर्थ को पारदर्शी बनाना।
lexical_decisions:
- source_word: ይትዋነይ፡ ወይዘፍን
  choice: हँसी-मज़ाक करते और नाचते
  rationale: दोनों समन्वित क्रियाओं का स्वाभाविक हिन्दी रूप; पहली क्रिया विनोद/परिहास और दूसरी नृत्य को व्यक्त करती है।
- source_word: ይትፌሣሕ፡ ፍሥሓ፡ ዐቢየ
  choice: बड़े आनन्द से आनन्दित होते
  rationale: मूल की संज्ञेय पुनरुक्ति और तीव्रता को यथासंभव सुरक्षित रखता है।
- source_word: ወቀንአት፡ ለይስማዔል
  choice: वह इश्माएल से ईर्ष्या करने लगी
  rationale: क्रिया के ईर्ष्या/जलन संबंधी अर्थ और इश्माएल को उसके लक्ष्य के रूप में बनाए रखता है।
- source_word: ስድድ
  choice: निकाल दे
  rationale: आज्ञार्थक ‘बाहर निकालना/दूर कर देना’ का सहज आधुनिक हिन्दी रूप।
- source_word: ዛተ፡ ወሰተ
  choice: इस दासी
  rationale: प्रेषित पाठ का अंतिम शब्द विकृत प्रतीत होता है; आलोचनात्मक संदर्भ और उत्पत्ति 21:10 से दासी/सेविका का सामाजिक पद समर्थित है।
theological_decisions:
- issue: सारा की मनोदशा
  choice: ईर्ष्या
  alternative: जलन
  rationale: मूल क्रिया का सीधा भाव सुरक्षित रखा गया है; इसे धार्मिक या नैतिक व्याख्या से नरम नहीं किया गया।
- issue: स्त्री की सामाजिक स्थिति
  choice: दासी
  alternative: स्त्री
  rationale: ‘स्त्री’ सामाजिक स्थिति खो देता; ‘दासी’ कथानक में आश्रित/सेविका की हैसियत स्पष्ट करता है, जबकि पादटिप्पणी पाठगत विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। मूल की दोहरी आनन्द-अभिव्यक्ति को जानबूझकर कुछ औपचारिक रूप में रखा गया है; सामाजिक पद के लिए ‘दासी’ प्रयुक्त है।
