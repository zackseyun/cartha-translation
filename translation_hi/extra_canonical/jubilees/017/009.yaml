  text: And he took bread and a skin of water and put them on Hagar's shoulder, and the child, and sent her away. And she went and wandered in the wilderness of Beersheba, and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell.
translation:
  language: hi
  text: और उसने रोटी और पानी की एक मशक ली, उन्हें हाजिरा के कंधे पर रख दिया और बालक को भी उसके हवाले करके उसे विदा कर दिया। वह चली गई और बेर्शेबा के निर्जन प्रदेश में भटकती रही। जब मशक का पानी समाप्त हो गया, तब बालक प्यासा हो गया; वह चल नहीं सका और गिर पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝቀ፡ ማይ
  choice: पानी की एक मशक
  rationale: यह पद पानी रखने की चमड़े की मशक को सूचित करता है; आधुनिक हिन्दी में ‘मशक’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: አስከማ
  choice: कंधे पर रख दिया
  rationale: क्रिया का अर्थ किसी पर भार रखना या उसे ढोने देना है; यहाँ हाजिरा पर रोटी और मशक रखे जाने का भाव व्यक्त किया गया है।
- source_word: ገዳመ፡ ቤርሳቤ
  choice: बेर्शेबा के निर्जन प्रदेश
  rationale: ‘गेदाम’ उजाड़ अथवा निर्जन भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ተንገገ
  choice: भटकती रही
  rationale: क्रिया दिशाहीन घूमने या भटकने का भाव देती है; अपूर्णतासूचक हिन्दी रूप घटनाक्रम को स्वाभाविक बनाता है।
- source_word: ወስእነ፡ ሐዊረ
  choice: वह चल नहीं सका
  rationale: शाब्दिक भाव ‘चलने में असमर्थ हुआ’ है; सरल आधुनिक हिन्दी में यही अर्थ स्पष्ट रहता है।
theological_decisions:
- issue: रोटी, मशक और बालक को हाजिरा के साथ रखने की संक्षिप्त एवं अस्पष्ट रचना
  choice: सामान हाजिरा के कंधे पर रखा गया और बालक उसके साथ किया गया
  alternative: रोटी और पानी हाजिरा और बालक को दे दिए गए
  rationale: स्रोत की क्रिया भार रखने/ढोने देने की ओर संकेत करती है, जबकि उसके बाद ‘और बालक’ वाक्य-विन्यास की संक्षिप्तता बनाए रखता है। मुख्य पाठ अधिक ठोस अर्थ देता है और पादटिप्पणी दूसरा संभव पाठ सुरक्षित रखती है।
- issue: विदा किए जाने वाले व्यक्ति की संख्या
  choice: उसे विदा कर दिया
  alternative: उन्हें विदा कर दिया
  rationale: स्रोत की क्रिया में स्त्रीलिंग एकवचन कर्म-प्रत्यय है, जो हाजिरा की ओर संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेर्शेबा’ नाम का प्रचलित हिन्दी लिप्यंतरण लिया गया है। अंतिम खंड में छोटे उपवाक्यों द्वारा प्यास, चलने की असमर्थता और गिरने का क्रम स्पष्ट रखा गया है।
