base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/011.yaml
  text: She went a bowshot away, because she said, “Let me not see the death of my child,” and she sat and wept. And an angel of God, one of the holy ones, said to her, “What are you weeping for, Hagar? Rise, take up the child, and hold him with your hand, for God has heard your voice and has seen the child.”
translation:
  language: hi
  text: वह एक तीर की मार जितनी दूर चली गई, क्योंकि उसने कहा, “मैं अपने बालक की मृत्यु न देखूँ।” फिर वह बैठी और रोई। तब परमेश्वर के एक दूत ने, जो पवित्र जनों में से एक था, उससे कहा, “हाजिरा, तुम क्यों रो रही हो? उठो, बालक को उठाकर अपने हाथ से थाम लो, क्योंकि परमेश्वर ने तुम्हारी आवाज़ सुनी है और बालक को देखा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐቲ፡ ምንዳፍ፡
  choice: एक तीर की मार जितनी दूर
  rationale: यह पदबंध शाब्दिक रूप से ‘एक bowshot’ की विशिष्ट दूरी बताता है; आधुनिक हिन्दी में यह रूप स्वाभाविक है और उत्पत्ति 21:16 से संबंध भी बनाए रखता है।
- source_word: ሕፃን / ኅፃን
  choice: बालक
  rationale: स्रोत में प्रयुक्त शब्द बच्चे या बालक को सूचित करता है; ‘बालक’ गरिमापूर्ण, स्पष्ट और प्रसंगानुकूल है।
- source_word: መልአከ፡ አምላክ፡
  choice: परमेश्वर का एक दूत
  rationale: यह स्रोत के ‘angel/messenger of God’ को बिना अतिरिक्त धर्मवैधानिक अर्थ जोड़े सीधे व्यक्त करता है।
- source_word: እምቅዱሳን፡
  choice: पवित्र जनों में से
  rationale: बहुवचन ‘holy ones’ को सामूहिक और जानबूझकर अनिर्दिष्ट रखा गया है।
- source_word: አንዝዮ፡ በእዴኪ፡
  choice: अपने हाथ से थाम लो
  rationale: स्रोत का आशय बालक को हाथ से संभालने या सहारा देने का है; यह हिन्दी में स्वाभाविक रहते हुए उस क्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: दूत की पहचान और ‘पवित्र जनों’ का अर्थ
  choice: “परमेश्वर के एक दूत ने, जो पवित्र जनों में से एक था”
  alternative: “परमेश्वर के स्वर्गदूत ने” अथवा ‘पवित्र जनों’ की किसी विशिष्ट स्वर्गीय श्रेणी के रूप में व्याख्या
  rationale: स्रोत दूत को ‘पवित्र जनों में से एक’ कहता है, पर उस समूह की प्रकृति अधिक स्पष्ट नहीं करता; अनुवाद वही अनिश्चितता बनाए रखता है।
- issue: परमेश्वर द्वारा हाजिरा की आवाज़ सुनना और बालक को देखना
  choice: दोनों कथनों को अलग और प्रत्यक्ष रूप में बनाए रखा
  alternative: इसे सामान्यीकृत करके ‘परमेश्वर ने तुम्हारी दशा पर ध्यान दिया है’ कहना
  rationale: स्रोत में स्त्री की आवाज़ सुनने और बालक को देखने की विशिष्ट समानांतर अभिव्यक्तियाँ हैं; धार्मिक तनाव या कथात्मक भिन्नता को समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘एक तीर की मार जितनी दूर’ विशिष्ट प्राचीन दूरी को सामान्य पाठक के लिए समझने योग्य बनाता है। उत्पत्ति के समानांतर पाठ से ‘उसके सामने’ जैसा स्रोत में अनुपस्थित वाक्यांश नहीं जोड़ा गया।
