  yaml_path: translation/extra_canonical/jubilees/017/005.yaml
  text: …and her son, for the son of this servant woman will not be an heir with my son Isaac.” And the matter was very grievous in the sight of Abraham because of his maidservant and because of his son.
translation:
  language: hi
  text: …और उसके बेटे को भी निकाल दे, क्योंकि इस दासी का बेटा मेरे बेटे इसहाक के साथ वारिस नहीं होगा।” अपनी दासी और अपने बेटे के कारण यह बात अब्राहम की दृष्टि में बहुत बुरी लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወልዳ
  choice: …और उसके बेटे को भी निकाल दे
  rationale: शाब्दिक रूप से ‘और उसके बेटे को’; यह पिछले पद की आज्ञा को पूरा करता है। हिन्दी में खंड का आशय स्पष्ट करने के लिए पिछले पद से निहित क्रिया ‘निकाल दे’ दोहराई गई है, और आरम्भिक दीर्घवृत्त पद-मध्य निरन्तरता दिखाता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: कारणसूचक सम्बन्ध को स्वाभाविक और सटीक हिन्दी में व्यक्त करता है।
- source_word: ወልዳ፡ ለዛ፡ ወሰት
  choice: इस दासी का बेटा
  rationale: यह पदबंध स्त्री की दासता की स्थिति बताता है; ‘दासी’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ይስሐቅ
  choice: इसहाक
  rationale: व्यक्ति-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ወማኅዘነ፡ ውእቱ፡ ቃል
  choice: यह बात … बहुत दुःखद लगी
  rationale: ‘वचन/बात बहुत पीड़ादायक या गंभीर थी’ के अर्थ को सहज हिन्दी में रखता है, बिना अब्राहम की प्रतिक्रिया को आवश्यकता से अधिक विशिष्ट किए।
- source_word: በእንተ፡ አመቱ፡ ወበእንተ፡ ወልዱ
  choice: अपनी दासी और अपने बेटे के कारण
  rationale: दोनों कारणों को स्रोत के समान समानान्तर रूप में सुरक्षित रखता है; केवल पुत्र तक दुःख को सीमित नहीं करता।
theological_decisions:
- issue: इश्माएल के उत्तराधिकार से बहिष्कार का कथन
  choice: वारिस नहीं होगा
  alternative: उत्तराधिकार नहीं पाएगा
  rationale: स्रोत के उत्तराधिकार-संबंधी कथन को सीधे रखता है और उसके धार्मिक या वाचा-संबंधी दायरे की अतिरिक्त व्याख्या नहीं करता।
- issue: अब्राहम के दुःख के कारण
  choice: अपनी दासी और अपने बेटे के कारण
  alternative: अपने बेटे के कारण
  rationale: गीज़ पाठ दोनों—दासी और पुत्र—का स्पष्ट उल्लेख करता है; किसी एक को हटाना स्रोत की तनावपूर्ण प्रस्तुति को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। आरम्भ का दीर्घवृत्त बताता है कि पद पिछले वाक्य के बीच से जारी है। ‘दासी’ स्रोत के सामाजिक पद को बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक रखा गया है।
