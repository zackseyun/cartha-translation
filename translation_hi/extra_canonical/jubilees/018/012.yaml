base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/018/012.yaml
  text: And Prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, one ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: hi
  text: और प्रधान मस्तेमा लज्जित हुआ। तब अब्राहम ने आँखें उठाकर देखा, और क्या देखा कि एक मेढ़ा झाड़ी में अपने सींगों से फँसा हुआ था। अब्राहम ने जाकर उस मेढ़े को लिया और अपने पुत्र के स्थान पर उसे होमबलि के रूप में चढ़ाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: प्रधान मस्तेमा
  rationale: መኰንን पदवी के रूप में शासक या प्रधान का बोध कराता है; नाम መስተማ को मस्तेमा रूप में लिप्यंतरित किया गया है।
- source_word: ትገፍረ
  choice: लज्जित हुआ
  rationale: क्रिया अपमानित या लज्जित किए जाने का भाव रखती है; सहज हिन्दी में परिणामसूचक रूप चुना गया।
- source_word: አሐዱ፡ በሐኵ
  choice: एक मेढ़ा
  rationale: አሐዱ की स्पष्ट संख्या को बनाए रखा गया और बलि के प्रसंग में नर भेड़ के लिए स्वाभाविक शब्द 'मेढ़ा' चुना गया।
- source_word: በዕፀው
  choice: झाड़ी में
  rationale: यहाँ वनस्पति की घनी उलझन या झुरमुट अभिप्रेत है; आधुनिक सामान्य हिन्दी में 'झाड़ी' स्वाभाविक है।
- source_word: ጽንሓሕ
  choice: होमबलि
  rationale: संपूर्णतः जलाकर चढ़ाई जाने वाली बलि के पारंपरिक बाइबिलीय अर्थ को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ህየንተ፡ ወልዱ
  choice: अपने पुत्र के स्थान पर
  rationale: प्रतिस्थापन का मूल अर्थ सीधे बनाए रखा गया है; पाठ पुत्र का नाम यहाँ नहीं बताता।
theological_decisions:
- issue: मस्तेमा की पदवी
  choice: प्रधान मस्तेमा
  alternative: राजकुमार मस्तेमा
  rationale: मूल መኰንን व्यापक रूप से अधिकारी, शासक या प्रधान को सूचित कर सकता है। 'प्रधान' अनावश्यक राजवंशीय अर्थ जोड़े बिना उसकी पदवी बनाए रखता है।
- issue: मेढ़े की प्रतिस्थापनकारी बलि
  choice: अपने पुत्र के स्थान पर
  alternative: अपने पुत्र के बदले
  rationale: मूल का प्रतिस्थापन स्पष्ट रखा गया है, पर उससे आगे कोई प्रायश्चित्त-संबंधी व्याख्या पाठ में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास में मूल की क्रमिक कथन-शैली सुरक्षित है, जबकि 'और क्या देखा कि' से ወናሁ का स्वाभाविक हिन्दी कथात्मक प्रभाव व्यक्त किया गया है।
