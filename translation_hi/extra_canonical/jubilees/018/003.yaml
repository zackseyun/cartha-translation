  verdict: revise
  source_fidelity: Draft accurately reflects rising early, saddling the donkey, taking two servants and Isaac, and splitting the wood for the burnt offering. However, the source and English audit trail say that he 'went to the place on the third day,' whereas 'उस स्थान पर पहुँचा' adds arrival and changes the stated action.
