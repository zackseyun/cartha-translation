  yaml_path: translation/extra_canonical/jubilees/018/003.yaml
  text: And he rose early in the morning and saddled his donkey, and he took two servants with him, and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.
translation:
  language: hi
  text: और वह सुबह तड़के उठा, अपने गधे पर काठी कसी, और अपने दो सेवकों तथा अपने पुत्र इसहाक को साथ लिया। उसने होम-बलि के लिए लकड़ी चीर ली और तीसरे दिन उस स्थान को गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በነግህ
  choice: भोर को
  rationale: गीज़ पद का अर्थ सुबह बहुत जल्दी उठने का है; ‘भोर को’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: ጸዐነ፡ አድጎ
  choice: अपने गधे पर काठी कसी
  rationale: क्रिया और ‘गधा’ का संयोजन यात्रा के लिए पशु को तैयार करने, विशेषतः काठी कसने, को व्यक्त करता है।
- source_word: ደቂቀ
  choice: सेवकों
  rationale: यहाँ आश्रित युवक/सेवक अभिप्रेत हैं; प्रसंग में आधुनिक हिन्दी का ‘सेवक’ सबसे स्पष्ट है।
- source_word: መሥዋዕተ፡ ሰፀረ
  choice: होम-बलि
  rationale: बलि-संबंधी पद उस अर्पण को सूचित करता है जो आग में पूर्णतः चढ़ाया जाता था; ‘होम-बलि’ स्थापित बाइबलीय पद है।
- source_word: በሠሉስ፡ ዕለት
  choice: तीसरे दिन
  rationale: समय-सूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद।
