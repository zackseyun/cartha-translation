  verdict: revise
  source_fidelity: The draft accurately preserves the dialogue sequence, the fire, knife, wood, and the unspecified sheep for the burnt offering. The source does not specify the animal's age or sex, and «भेड़» appropriately maintains that breadth. A small adjustment better reflects the collective ‘wood’ of the source and English audit trail.
  naturalness: The Hindi is clear, modern, and suitably dignified. «लकड़ी» is more idiomatic as a collective material noun in this list than «लकड़ियाँ».
  terminology: «छुरा» accurately conveys the sacrificial knife, and «होमबलि» is an established, comprehensible rendering for the offering. «पिताजी» naturally conveys the repeated filial address without unwarranted theological interpretation.
  issues:
  - severity: low
    issue: Collective ‘wood’ rendered as plural «लकड़ियाँ».
    rationale: The Geʽez term and the English audit trail use collective ‘wood’. Hindi normally uses singular collective «लकड़ी» in a list such as ‘आग, छुरा और लकड़ी’, without changing the referent.
