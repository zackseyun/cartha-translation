  yaml_path: translation/extra_canonical/jubilees/018/006.yaml
  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: hi
  text: तब इसहाक ने अपने पिता से कहा, “पिताजी!” उन्होंने कहा, “हाँ, मेरे बेटे, मैं यहीं हूँ।” इसहाक ने उनसे कहा, “देखिए, आग, छुरा और लकड़ी तो हैं, पर होमबलि के लिए भेड़ कहाँ है, पिताजी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባ
  choice: पिताजी
  rationale: संबोधन में पुत्र का आदर और आत्मीयता व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ነየ፡ አነ
  choice: हाँ, मेरे बेटे, मैं यहीं हूँ
  rationale: शाब्दिक रूप से ‘देख, मैं’ के आशय को हिन्दी के स्वाभाविक प्रत्युत्तर में व्यक्त करता है और तत्पर उपस्थिति का भाव बनाए रखता है।
- source_word: መጥባሕት
  choice: छुरा
  rationale: बलि के प्रसंग में प्रयुक्त काटने के औज़ार के लिए सटीक और सामान्य हिन्दी शब्द।
- source_word: ዕፀው
  choice: लकड़ियाँ
  rationale: आग और होमबलि के प्रसंग में ईंधन की लकड़ियों का स्वाभाविक बहुवचन।
- source_word: በግዕ
  choice: भेड़
  rationale: गीज़ पद सामान्यतः sheep को दर्शाता है; पाठ स्वयं मेमना या मेढ़ा निश्चित नहीं करता, इसलिए व्यापक शब्द रखा गया।
- source_word: ዘለጽንሓሕ
  choice: होमबलि के लिए
  rationale: बलि को आग में पूर्णतः चढ़ाने के अर्थ को प्रचलित और समझने योग्य बाइबलीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बलि के पशु की आयु या लिंग
  choice: भेड़
  alternative: मेमना / मेढ़ा
  rationale: मूल शब्द आयु या लिंग को स्पष्ट रूप से सीमित नहीं करता; इसलिए व्याख्यात्मक विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संवाद में स्वाभाविक रखी गई है। बार-बार आने वाले ‘और उसने कहा’ को पात्रों के नाम और हिन्दी वाक्य-संयोजन से स्पष्ट किया गया है, बिना कथ्य बदले।
