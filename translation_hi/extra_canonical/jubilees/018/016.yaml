  to: और तेरे वंश में पृथ्वी की सभी जातियाँ आशीष पाएँगी, क्योंकि तूने मेरी बात मानी है। और मैंने सबको यह प्रकट कर दिया है कि जो कुछ मैंने तुझसे कहा, उस सब में तू मेरे प्रति विश्वासयोग्य है। शान्ति से जा।”
