  yaml_path: translation/extra_canonical/jubilees/018/016.yaml
  text: And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to all that you are faithful to me in all that I have said to you. Go in peace.”
translation:
  language: hi
  text: और तेरे वंश में पृथ्वी की सभी जातियाँ आशीष पाएँगी, क्योंकि तूने मेरी बात मानी है। और मैंने सबको यह प्रकट कर दिया है कि जो कुछ मैंने तुझसे कहा, उस सब में तू मेरे प्रति विश्वासयोग्य है। शान्ति से जा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዘርእከ
  choice: तेरे वंश में
  rationale: पूर्वसर्ग በ और ‘तेरा वंश/बीज’ के सामूहिक अर्थ को बनाए रखता है तथा उत्पत्ति-संबंधी प्रतिध्वनि को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ይትባረኩ
  choice: आशीष पाएँगी
  rationale: आशीष दिए जाने के निष्क्रिय भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘሰማዕከ፡ ቃለ፡ ዚአየ
  choice: क्योंकि तूने मेरी बात मानी है
  rationale: शाब्दिक ‘मेरी वाणी सुनी’ यहाँ आज्ञापालन का भाव रखता है; ‘बात मानी’ हिन्दी में उसे सहजता से व्यक्त करता है।
- source_word: አይደዐኩ፡ ለኵሉ
  choice: मैंने सब पर यह प्रकट कर दिया है
  rationale: ‘मैंने सबको ज्ञात कराया’ का स्वाभाविक, किंचित औपचारिक हिन्दी रूप।
- source_word: ምእመን
  choice: विश्वासयोग्य
  rationale: विश्वस्त/निष्ठावान होने के अर्थ को धर्मशास्त्रीय तनाव जोड़े बिना सुरक्षित रखता है।
- source_word: ሖር፡ በሰላም
  choice: शान्ति से जा
  rationale: विदाई-सूत्र का निकट और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: ‘वंश/बीज’ का सामूहिक अथवा एकवचन-संदर्भ
  choice: वंश
  alternative: सन्तान
  rationale: मूल शब्द की सामूहिक और संभावित एकवचन-संदर्भ वाली अस्पष्टता को बनाए रखा गया है; किसी विशिष्ट मसीही व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: आशीष के क्रियार्थ की दिशा
  choice: आशीष पाएँगी
  alternative: अपने को आशीषित मानेंगी
  rationale: गीज़ निष्क्रिय रूप और उपलब्ध स्रोत-साक्ष्य के अनुरूप सामान्य निष्क्रिय अर्थ रखा गया है, प्रतिवाची अर्थ नहीं अपनाया गया।
- issue: ईश्वर के प्रति अब्राहम की स्थिति
  choice: मेरे प्रति विश्वासयोग्य
  alternative: मुझ पर विश्वास करनेवाला
  rationale: मूल विशेषण निष्ठा/विश्वासयोग्यता को व्यक्त करता है; इसे केवल मानसिक विश्वास में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली; ईश्वर द्वारा अब्राहम को एकवचन आत्मीय संबोधन होने के कारण ‘तू/तेरे/तुझसे’ रखा गया है। ‘शान्ति’ की वर्तनी औपचारिक बाइबलीय रजिस्टर के अनुरूप है।
