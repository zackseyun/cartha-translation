  text: And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together to that place.
translation:
  language: hi
  text: और उसने बलि की लकड़ियाँ लीं और उन्हें अपने पुत्र इसहाक पर रख दिया। उसने अपने हाथ में आग और छुरा लिया, और वे दोनों साथ-साथ उस स्थान तक गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀወ፡ መሥዋዕት
  choice: बलि की लकड़ियाँ
  rationale: शाब्दिक अर्थ ‘बलि/चढ़ावे की लकड़ियाँ’ है; प्रसंग में बलि जलाने के लिए प्रयुक्त लकड़ियाँ अभिप्रेत हैं।
- source_word: መጥባሕት
  choice: छुरा
  rationale: यह बलि चढ़ाते समय काटने के उपकरण को सूचित करता है; ‘छुरा’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ኅቡረ፡ ክልኤሆሙ
  choice: वे दोनों साथ-साथ
  rationale: मूल के ‘दोनों एक साथ’ भाव को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
- source_word: እስክ፡ ውእቱ፡ መካን
  choice: उस स्थान तक
  rationale: गीज़ पदबंध गंतव्य की सीमा तक जाने का भाव देता है; ‘तक’ मूल की संरचना और अर्थ के निकट है।
