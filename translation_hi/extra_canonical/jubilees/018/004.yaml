  yaml_path: translation/extra_canonical/jubilees/018/004.yaml
  text: And he saw the place from afar. And he came as far as the well of water, and he said to his servants, “Stay here with the donkeys, and I and the boy will go on, and we will worship, and we will return to you.”
translation:
  language: hi
  text: और उसने दूर से उस स्थान को देखा। वह पानी के कुएँ[a] तक पहुँचा और अपने सेवकों से कहा, “तुम गधों के साथ यहीं ठहरो। मैं और यह लड़का आगे जाएँगे, दण्डवत् करेंगे और फिर तुम्हारे पास लौट आएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पानी के गड्ढे”।
    reason: गीज़ पद ዐዘቅተ ማይ का अधिक व्युत्पत्तिपरक अनुवाद ‘पानी का गड्ढा’ भी संभव है।
lexical_decisions:
- source_word: መካነ
  choice: स्थान
  rationale: गीज़ शब्द का सामान्य अर्थ ‘स्थान’ है; यहाँ बलिदान के निश्चित स्थल का संकेत है, पर पाठ उसे अधिक विशिष्ट नाम नहीं देता।
- source_word: ዐዘቅተ፡ ማይ
  choice: पानी का कुआँ
  rationale: शाब्दिक संरचना ‘पानी का गड्ढा/कुआँ’ है। प्रसंग और इस सामी मुहावरे के प्रचलित अर्थ के अनुसार ‘पानी का कुआँ’ स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ለደቁ
  choice: अपने सेवकों से
  rationale: यहाँ आश्रित पुरुष सेवकों के लिए प्रयुक्त रूप है; आधुनिक हिन्दी में ‘अपने सेवकों से’ स्पष्ट और स्वाभाविक है।
- source_word: አድግት
  choice: गधों
  rationale: स्रोत रूप बहुवचन है, इसलिए उत्पत्ति 22:5 के एकवचन से सामंजस्य न करके बहुवचन सुरक्षित रखा गया है।
- source_word: ወሕፃን
  choice: यह लड़का
  rationale: ሕፃን बच्चे/लड़के को सूचित करता है। प्रत्यक्ष कथन में ‘यह लड़का’ हिन्दी में स्वाभाविक रूप से इसहाक की ओर संकेत करता है।
- source_word: ወሰጊደነ
  choice: दण्डवत् करेंगे
  rationale: मूल क्रिया झुककर उपासना/प्रणाम करने को व्यक्त करती है। ‘दण्डवत् करेंगे’ शारीरिक नमन और आराधनात्मक आशय दोनों बनाए रखता है।
theological_decisions:
- issue: अब्राहम का बहुवचन में लौटने का कथन
  choice: “फिर तुम्हारे पास लौट आएँगे”
  alternative: “फिर मैं तुम्हारे पास लौट आऊँगा”
  rationale: स्रोत में क्रिया प्रथम पुरुष बहुवचन है। इसे एकवचन बनाना कथानक के धर्मवैचारिक तनाव को समाप्त कर देता; इसलिए अब्राहम और लड़के दोनों की वापसी का व्याकरणिक संकेत सुरक्षित रखा गया है।
- issue: उपासना-संबंधी क्रिया का अर्थ
  choice: “दण्डवत् करेंगे”
  alternative: “आराधना करेंगे”
  rationale: स्रोत क्रिया में झुकने की ठोस मुद्रा और उपासना का भाव दोनों हो सकते हैं। ‘दण्डवत्’ उस देहगत अर्थ को सुरक्षित रखता है और प्रसंग में आराधना भी सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। वाक्य-क्रम मूल के निकट है, पर प्रत्यक्ष कथन को स्वाभाविक हिन्दी प्रवाह दिया गया है। गधों का बहुवचन और ‘लौट आएँगे’ का बहुवचन स्रोत के अनुसार जानबूझकर सुरक्षित हैं।
