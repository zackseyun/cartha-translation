  text: And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your firstborn, from me.”
translation:
  language: hi
  text: और मैंने उससे कहा, “लड़के पर अपना हाथ मत बढ़ाओ और उसके साथ कुछ भी मत करो, क्योंकि अब मैं जान गया हूँ कि तुम परमेश्वर का भय मानते हो। तुमने अपने बेटे, अपने पहलौठे[a] को भी मुझसे नहीं रोका।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए लिप्यंतरित गीइज़ पाठ में यहाँ “तुम्हारा वंश” है, पर Charles के 1895 के मुद्रित संस्करण में शब्द “तुम्हारा पहलौठा” है।
    reason: प्रदत्त पाठ में OCR/लिप्यंतरण संबंधी पाठांतर को दर्ज करना और मुद्रित आलोचनात्मक संस्करण के पाठ को स्पष्ट करना।
lexical_decisions:
- source_word: ወእቤሎ
  choice: और मैंने उससे कहा
  rationale: क्रिया प्रथम पुरुष एकवचन पूर्ण रूप में है; इसलिए वक्ता स्वयं कहता है, न कि ‘उसने कहा’.
- source_word: አትፈኑ፡ እዴከ፡ ዲበ፡ ሕፃን
  choice: लड़के पर अपना हाथ मत बढ़ाओ
  rationale: मूल की शारीरिक क्रिया और निषेध को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: परमेश्वर का भय मानते हो
  rationale: ‘भय’ की धार्मिक और नैतिक गंभीरता को बनाए रखता है; इसे केवल ‘सम्मान’ कहकर हल्का नहीं करता.
- source_word: ወልደከ፡ በኵረከ
  choice: अपने बेटे, अपने पहलौठे
  rationale: Charles के मुद्रित पाठ में दूसरा शब्द ‘पहलौठा’ है और यह ‘बेटे’ के समानाधिकरण में आता है.
theological_decisions:
- issue: ‘अब मैं जान गया हूँ’ में ईश्वरीय ज्ञान और परीक्षा का तनाव
  choice: मूल के प्रत्यक्ष कथन ‘अब मैं जान गया हूँ’ को यथावत रखा
  alternative: ‘अब यह प्रकट हो गया है’
  rationale: वैकल्पिक रूप संभावित धर्मवैज्ञानिक कठिनाई को व्याख्या द्वारा सुलझा देता; अनुवाद मूल के तनाव को सुरक्षित रखता है.
- issue: परमेश्वर का भय
  choice: ‘भय मानते हो’
  alternative: ‘आदर करते हो’
  rationale: मूल में भय का स्पष्ट पद है; ‘आदर’ उसका केवल एक पक्ष व्यक्त करता है.
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण प्रत्यक्ष वचन। ‘तुम’ सामान्य आधुनिक संबोधन के रूप में चुना गया है; वाक्य-विन्यास मूल के क्रम और जोर को यथासंभव बनाए रखते हुए स्वाभाविक हिन्दी में रखा गया है।
