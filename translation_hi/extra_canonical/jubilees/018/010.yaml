translation:
  language: hi
  text: और मैंने स्वर्ग से उसे पुकारकर कहा, “अब्राहम, अब्राहम!” तब वह भयभीत हो गया और बोला, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸዋዕክዎ (ṣawāʿkuwo)
  choice: मैंने ... उसे पुकारकर कहा
  rationale: क्रिया का अर्थ ‘पुकारना’ है; ‘उसे’ में कर्म-प्रत्यय और ‘स्वर्ग से’ में अगले पदबंध का संबंध स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: እምሰማይ (ʾəm-samāy)
  choice: स्वर्ग से
  rationale: अपादानसूचक እም का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: ይገብዕ (yəgabəʿ)
  choice: वह भयभीत हो गया
  rationale: इस प्रसंग में गीइज़ क्रिया का अर्थ भयभीत होना या सहम जाना है; ‘शीघ्रता करना’ स्रोतार्थ को नहीं दर्शाता।
- source_word: ነየ፡ አነ (nəyə ʾana)
  choice: मैं यहाँ हूँ
  rationale: आह्वान के उत्तर में प्रयुक्त उपस्थिति-सूचक सूत्र का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: अब्राहम की प्रतिक्रिया का स्वरूप
  choice: वह भयभीत हो गया
  alternative: वह शीघ्रता से आया / उसने जल्दी की
  rationale: मूल ይገብዕ को यहाँ भय या सहमने की प्रतिक्रिया के रूप में समझना भाषिक और प्राचीन अनुवाद-परंपरा के अनुरूप है तथा जुबिलीज़ की विशिष्ट कथात्मक बात को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और कथात्मक है। प्रत्यक्ष वचन में नाम की पुनरावृत्ति और उत्तर का सूत्र यथावत रखा गया है।
