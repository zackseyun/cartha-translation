  text: And he kept this festival every year for seven days with joy, and he named it the Festival of the LORD, according to the seven days during which he had gone and returned in peace.
translation:
  language: hi
  text: और उसने हर वर्ष यह पर्व सात दिनों तक आनन्द के साथ मनाया। और उसने उसका नाम “प्रभु का पर्व” रखा, उन सात दिनों के अनुसार जिनमें वह गया और सकुशल लौटा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብር
  choice: मनाया
  rationale: पर्व के संदर्भ में शाब्दिक ‘करता था’ की अपेक्षा आधुनिक हिन्दी में ‘पर्व मनाना’ स्वाभाविक और अर्थसंगत है।
- source_word: በኵሉ፡ ዓመታት
  choice: हर वर्ष
  rationale: वितरणात्मक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በፍሥሓ
  choice: आनन्द के साथ
  rationale: मूल के हर्ष अथवा उल्लास के भाव को गरिमापूर्ण और सामान्य हिन्दी में रखता है।
- source_word: በዓለ፡ እግዚአብሔር
  choice: याहवे का पर्व
  rationale: ईश्वरीय नाम को सामान्य उपाधि ‘प्रभु’ में विलीन न करके नाम के रूप में प्रस्तुत किया गया है।
- source_word: በሰላም
  choice: कुशल-क्षेम से
  rationale: यहाँ यात्रा से सुरक्षित और सकुशल लौटने का भाव है; केवल ‘शान्ति से’ आधुनिक हिन्दी में अस्पष्ट हो सकता है।
theological_decisions:
- issue: እግዚአብሔር का निरूपण
  choice: याहवे
  alternative: प्रभु
  rationale: वाक्य में पर्व का नाम दिया जा रहा है; ‘याहवे’ ईश्वर के विशिष्ट नाम का संकेत स्पष्ट रखता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: सात दिनों और यात्रा का संबंध
  choice: क्योंकि वह सात दिन में जाकर कुशल-क्षेम से लौट आया था
  alternative: उन सात दिनों के अनुसार, जिनमें वह गया और कुशल-क्षेम से लौटा था
  rationale: मूल का संबंध सुरक्षित रखते हुए हिन्दी वाक्य को स्वाभाविक बनाया गया है; कारणसूचक संबंध अंग्रेज़ी परामर्श-पाठ से भी पुष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। ‘पर्व’ धार्मिक उत्सव के लिए स्वाभाविक है; क्रिया के पुनरावृत्त भाव को ‘हर वर्ष ... मनाया’ से व्यक्त किया गया है।
