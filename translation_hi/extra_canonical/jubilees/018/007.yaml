  text: And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.
translation:
  language: hi
  text: उसने कहा, “मेरे बेटे, परमेश्वर अपने लिए होमबलि की भेड़ देख लेगा।” फिर वह यहोवा के पर्वत के स्थान के पास पहुँचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሬኢ፡ ሎቱ
  choice: स्वयं ... देख लेगा
  rationale: गीज़ पदबंध का निकट अर्थ ‘अपने लिए देखेगा’ है। हिन्दी में ‘स्वयं ... देख लेगा’ मूल की अस्पष्टता बनाए रखता है—यह देखने, चुनने या प्रबंध करने की ओर संकेत कर सकता है—और किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: በግዐ
  choice: भेड़
  rationale: संज्ञा का सामान्य अर्थ ‘भेड़’ है; मूल पाठ यहाँ विशेष रूप से ‘मेढ़ा’ नहीं कहता।
- source_word: ለጽንሓሕ
  choice: होमबलि के लिए
  rationale: यह बलि को पूर्णतः जलाकर चढ़ाने के प्रचलित बाइबलीय भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ደብረ፡ እግዚአብሔር
  choice: यहोवा के पर्वत
  rationale: शाब्दिक संरचना ‘प्रभु/यहोवा का पर्वत’ है। ‘यहोवा’ नाम-सूचक अनुवाद है और ‘पर्वत’ मूल संज्ञा के अनुरूप है।
theological_decisions:
- issue: परमेश्वर द्वारा बलि का पशु ‘देखना’
  choice: देख लेगा
  alternative: प्रबंध करेगा / चुन लेगा
  rationale: ‘प्रबंध करेगा’ कथन को ईश्वरीय व्यवस्था के निश्चित अर्थ में खोल देता, जबकि स्रोत में देखने का क्रियापद है। ‘देख लेगा’ मूल रूपक और उसकी धार्मिक तनावपूर्ण अस्पष्टता को सुरक्षित रखता है।
- issue: ईश्वरीय नाम እግዚአብሔር का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: पर्वत-संबंधी पदबंध में अंग्रेज़ी परामर्श-पाठ LORD देता है और प्रसंग बाइबलीय दिव्य नाम की ओर संकेत करता है; आधुनिक हिन्दी बाइबल-परंपरा में ‘यहोवा’ स्पष्ट और समझने योग्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। पिता का संबोधन ‘मेरे बेटे’ स्वाभाविक रखा गया है। अंतिम वाक्य में स्रोत की कुछ असामान्य संरचना ‘पर्वत के स्थान’ को संक्षिप्त करके मिटाया नहीं गया, ताकि स्थान और पर्वत दोनों का उल्लेख बना रहे।
