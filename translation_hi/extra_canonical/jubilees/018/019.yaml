  yaml_path: translation/extra_canonical/jubilees/018/019.yaml
  text: And thus it is ordained and written on the heavenly tablets concerning Israel and his seed, that they should keep this festival seven days with festal joy.
translation:
  language: hi
  text: और इस प्रकार स्वर्गीय पट्टिकाओं पर इस्राएल और उसके वंश के विषय में यह ठहराया और लिखा हुआ है कि वे इस पर्व को सात दिन तक पर्व के उल्लास के साथ मनाएँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्सवी आनंद के साथ।”
    reason: अंतिम गीइज़ पदबंध आनंद और पर्व—दोनों को जोड़ता है; इसका विशेषणात्मक अनुवाद भी संभव है।
lexical_decisions:
- source_word: ሤሩዕ፡ ውእቱ፡ መጽሐፍ
  choice: यह ठहराया और लिखा हुआ है
  rationale: विधान किए जाने और लिखित रूप में दर्ज होने—दोनों भावों को सुरक्षित रखता है।
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: शाब्दिक अर्थ ‘स्वर्ग की पट्टिकाएँ’ है; ‘स्वर्गीय पट्टिकाएँ’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ዘርኡ
  choice: उसके वंश
  rationale: ‘बीज’ के वंशगत रूपक को हिन्दी के सामान्य बाइबलीय अर्थ ‘वंश’ में व्यक्त करता है।
- source_word: ለገቢረ፡ ዛቲ፡ በዓል
  choice: इस पर्व को … मनाएँ
  rationale: क्रिया ‘करना’ और संज्ञा ‘पर्व’ का स्वाभाविक हिन्दी समतुल्य ‘पर्व मनाना’ है।
- source_word: በፍሥሓ፡ በዓል
  choice: पर्व के उल्लास के साथ
  rationale: आनंद/उल्लास के साथ स्रोत में अंत में पुनः आए ‘पर्व’ को भी बनाए रखता है; केवल ‘आनंद के साथ’ कहने से यह तत्व छूट जाता।
theological_decisions:
- issue: स्वर्गीय पट्टिकाओं पर विधान का स्वरूप
  choice: ‘ठहराया और लिखा हुआ है’—दोनों पद रखे गए
  alternative: केवल ‘लिखा हुआ है’
  rationale: पाठ विधान और अभिलेखन दोनों का दावा करता है; किसी एक को हटाने से भाव संकुचित होता।
- issue: आज्ञार्थकता का स्तर
  choice: ‘कि वे … मनाएँ’
  alternative: ‘कि उन्हें … मनाना चाहिए’
  rationale: स्रोत का उद्देश्यसूचक/विधिसूचक निर्माण दायित्व व्यक्त करता है; हिन्दी में ‘कि वे … मनाएँ’ औपचारिकता और निर्देशात्मक भाव दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘पट्टिकाएँ’, ‘वंश’ और ‘पर्व’ सामान्य पाठक के लिए बोधगम्य रहते हुए स्रोत की औपचारिकता बनाए रखते हैं।
