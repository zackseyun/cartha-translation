  text: And Abraham went to his servants, and they arose and went together to Beer-sheba, and Abraham dwelt by the Well of the Oath.
translation:
  language: hi
  text: तब अब्राहम अपने सेवकों के पास गया। वे उठे और साथ-साथ बेर्शेबा गए; और अब्राहम शपथ के कुएँ के पास रहने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቁ
  choice: अपने सेवकों
  rationale: इस प्रसंग में यह शब्द अब्राहम के साथ आए युवा सेवकों के लिए प्रयुक्त है; ‘सेवक’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: በርስሕ
  choice: बेर्शेबा
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: ዐዘቅት፡ መሐላ
  choice: शपथ का कुआँ
  rationale: गीज़ पदबंध का अर्थगत अनुवाद है, जो बेर्शेबा नाम से जुड़े ‘शपथ के कुएँ’ के अर्थ को सुरक्षित रखता है।
- source_word: ኀደረ
  choice: रहने लगा
  rationale: क्रिया का आशय वहाँ निवास करने से है; ‘रहने लगा’ आधुनिक हिन्दी में सहज है और स्थायी बसावट को आवश्यकता से अधिक नहीं दर्शाता।
