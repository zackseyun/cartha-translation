  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पहले वाक्य के बाद स्पष्ट विराम दिया गया है; दूसरे भाग में ‘साथ-साथ’ मूल के सामूहिक गमन पर बल को बनाए रखता है।
