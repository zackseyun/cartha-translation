review_pass:
  verdict: revise
  source_fidelity: The naming statement and the direct identification with Mount Zion are accurately conveyed. However, Geʽez ከመ፡ ይትበሀል is most directly “as it is said,” whereas “इसलिए कहा जाता है” makes the following saying a result or consequence. The source’s comparative/formulaic connection should be retained.
  naturalness: The Hindi is clear, modern, and appropriately dignified. “जैसा कहा जाता है” is equally natural and more exact in this context.
  terminology: “यहोवा” consistently renders the English audit trail’s small-caps divine name and preserves the repeated wording in the place-name and quotation. “सिय्योन पर्वत” is standard and suitable. “ने देखा है” correctly avoids importing the interpretive “will provide.”
  issues:
  - severity: medium
    issue: “इसलिए कहा जाता है” is too causal for ከመ፡ ይትበሀል.
    rationale: The Geʽez construction means “as it is said” / “as people say,” not specifically “therefore it is said.” Replacing it preserves the source’s relation between the name and the saying without adding a causal inference.
