  yaml_path: translation/extra_canonical/jubilees/018/013.yaml
  text: And Abraham called that place “The LORD has seen,” so that it is said, “The LORD has seen”—it is Mount Zion.
translation:
  language: hi
  text: और अब्राहम ने उस स्थान का नाम “यहोवा ने देखा है” रखा; जैसा कहा जाता है, “यहोवा ने देखा है”—वह सिय्योन पर्वत है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዖ፡ ... ለውእቱ፡ መካን
  choice: उस स्थान का नाम ... रखा
  rationale: गीज़ की ‘उस स्थान को पुकारा/नाम दिया’ संरचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यहाँ दिव्य नाम के पारंपरिक बाइबलीय हिन्दी रूप का प्रयोग किया गया है; इसे सामान्य पद ‘प्रभु’ में बदलने से नामकरण-वाक्य की विशिष्टता कम हो सकती थी।
- source_word: ርእየ
  choice: ने देखा है
  rationale: स्रोत के पूर्ण क्रियात्मक भाव को बनाए रखता है और ‘प्रबंध करेगा’ जैसी उत्पत्ति 22 से प्रभावित व्याख्या को पाठ में आयात नहीं करता।
- source_word: ውእቱ፡ ደብረ፡ ጽዮን
  choice: वह सिय्योन पर्वत है
  rationale: स्रोत की सीधी पहचानसूचक संरचना का निकट और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: स्थान-नाम के अर्थ को उत्पत्ति 22:14 की प्रचलित व्याख्या के अनुसार ‘यहोवा प्रबंध करेगा’ बनाना
  choice: यहोवा ने देखा है
  alternative: यहोवा प्रबंध करेगा / यहोवा देखेगा
  rationale: प्रस्तुत गीज़ पाठ में क्रिया का अर्थ स्पष्टतः ‘देखा’ है; धार्मिक परंपरा के आधार पर अर्थ को बदलना उचित नहीं।
- issue: स्थान की सिय्योन पर्वत से पहचान
  choice: वह सिय्योन पर्वत है
  alternative: अर्थात वह सिय्योन पर्वत है
  rationale: स्रोत की स्पष्ट, प्रत्यक्ष पहचान को बिना अतिरिक्त व्याख्यात्मक संकेत के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। उद्धृत नाम और बाद की प्रचलित उक्ति के बीच समान शब्दावली बनाए रखी गई है।
