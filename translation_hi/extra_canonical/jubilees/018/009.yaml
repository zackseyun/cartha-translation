  yaml_path: translation/extra_canonical/jubilees/018/009.yaml
  text: And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”
translation:
  language: hi
  text: और मैं उसके सामने तथा मस्तेमा के दूतों[a] के सामने खड़ा हुआ। तब प्रभु ने कहा, “उससे कह कि वह बालक पर अपना हाथ न लगाए और उसके साथ कुछ भी न करे, क्योंकि मैं जान गया हूँ कि वह परमेश्वर का भय मानता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में यहाँ शाब्दिक रूप से “मस्तेमा के दूतों” है; कुछ अनुवाद इसे “प्रधान मस्तेमा” पढ़ते हैं।
    reason: प्रदत्त गीज़ पाठ और अंग्रेज़ी POB audit trail/कुछ प्रचलित अनुवादों के बीच संख्या तथा पदवी की भिन्नता को स्पष्ट करना।
lexical_decisions:
- source_word: መላእክት፡ መስተማ
  choice: मस्तेमा के दूतों
  rationale: प्रदत्त गीज़ पाठ में መላእክት बहुवचन ‘दूतों/स्वर्गदूतों’ है और መስተማ उसके साथ संबंधसूचक रूप में समझा गया है। परामर्श-पाठ के ‘प्रधान मस्तेमा’ को मुख्य पाठ में रखकर मूल-पाठ के बहुवचन को दबाया नहीं गया।
- source_word: ኢያውርድ፡ እዴሁ፡ ላዕለ፡ ሕፃን
  choice: वह बालक पर अपना हाथ न लगाए
  rationale: मूल की ‘हाथ ... पर’ वाली ठोस अभिव्यक्ति को सहज हिन्दी में बनाए रखा गया; अर्थ को केवल ‘हानि न पहुँचाए’ कहकर सीमित नहीं किया गया।
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: परमेश्वर का भय मानता है
  rationale: यह श्रद्धा और आज्ञाकारिता से जुड़ी पारंपरिक धार्मिक अभिव्यक्ति है; ‘भक्त’ कहने से मूल का भय-संबंधी शब्द लुप्त हो जाता।
theological_decisions:
- issue: परमेश्वर का ‘अब जानना’
  choice: अब मैं जान गया हूँ
  alternative: अब यह प्रकट हो गया है कि / अब मैंने प्रमाणित कर लिया है कि
  rationale: मूल के አእመርኩ (‘मैंने जाना’) और कालगत ከመ/संदर्भगत ‘अब’ की धर्मवैचारिक कठिनाई को किसी सर्वज्ञता-संबंधी व्याख्या से शांत नहीं किया गया।
- issue: मस्तेमा की पहचान
  choice: मस्तेमा के दूतों
  alternative: प्रधान मस्तेमा
  rationale: प्रदत्त गीज़ साक्ष्य बहुवचन ‘दूतों’ का समर्थन करता है, जबकि परामर्श-पाठ और प्रचलित अनुवाद मस्तेमा को एक प्रधान के रूप में पढ़ते हैं; मुख्य पाठ में प्रत्यक्ष स्रोत को प्राथमिकता दी गई और भिन्नता को पादटिप्पणी में दर्ज किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘बालक पर अपना हाथ न लगाए’ में मूल की बाइबिलीय ठोस छवि सुरक्षित है। सर्वनाम ‘उसके/उससे/वह’ की मूलगत संदर्भ-अस्पष्टता को अनावश्यक नाम जोड़कर समाप्त नहीं किया गया।
