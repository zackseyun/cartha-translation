  text: And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go to the high land, and offer him up on one of the mountains that I will show you.”
translation:
  language: hi
  text: और प्रभु ने अब्राहम से कहा, “अब्राहम, अब्राहम।” उसने कहा, “मैं यहाँ हूँ।” तब उसने कहा, “अपने पुत्र को, अपने प्रिय पुत्र को, जिससे तू प्रेम करता है—इसहाक को—ले और ऊँची भूमि में जा; और उसे उन पहाड़ों में से एक पर चढ़ा दे, जो मैं तुझे दिखाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ का यह प्रचलित ईश्वरीय संबोधन है; प्रसंग में गरिमापूर्ण और स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: ምድር፡ ልዐልት
  choice: ऊँची भूमि
  rationale: यह संज्ञा के साथ स्त्रीलिंग विशेषण वाला पद है, जिसका सीधा अर्थ ‘ऊँची भूमि’ है; इसे संबंधकारक ‘ऊँचाई की भूमि’ नहीं बनाया गया।
- source_word: ወአዕርጎ
  choice: उसे चढ़ा दे
  rationale: क्रिया का मूल भाव ‘ऊपर चढ़ाना’ है और इस प्रसंग में अर्पण का आशय भी निहित है; ‘बलि’ जोड़ने के बजाय स्रोत की संक्षिप्तता और तनाव बनाए रखा गया।
- source_word: ዘአነ፡ እፄይዐከ
  choice: जिस एक को मैं तुझे दिखाऊँगा
  rationale: संबंधवाचक वाक्यांश और भविष्यकालीन निर्देश को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: इसहाक को चढ़ाने की आज्ञा का स्वरूप
  choice: ‘उसे चढ़ा दे’
  alternative: ‘उसे बलि के रूप में चढ़ा दे’
  rationale: स्रोत की क्रिया शाब्दिक रूप से ‘ऊपर चढ़ाने’ का भाव रखती है। प्रसंग बलिदान की ओर संकेत करता है, पर ‘बलि के रूप में’ जोड़ना स्रोत से अधिक स्पष्ट व्याख्या होता।
- issue: ईश्वरीय नाम/उपाधि
  choice: ‘प्रभु’
  alternative: ‘परमेश्वर’ या ‘यहोवा’
  rationale: स्रोत-पद के पारंपरिक उपाधिपरक प्रयोग और अंग्रेज़ी परामर्श-पाठ के LORD को ध्यान में रखते हुए ऐसा रूप चुना गया जो किसी विशिष्ट नाम-पद्धति को अनावश्यक रूप से आरोपित न करे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पुनरुक्त संबोधन और ‘अपने पुत्र…अपने प्रिय पुत्र…अपने इसहाक’ की क्रमिक तीव्रता सुरक्षित है। अंतिम वाक्य में हिन्दी की स्वाभाविक पद-रचना हेतु ‘वहाँ के पहाड़ों में से’ रखा गया है; इससे कोई स्वतंत्र स्रोत-विहीन ‘वहाँ’ नहीं जोड़ा गया, बल्कि ‘ऊँची भूमि’ के भीतर स्थित पहाड़ों का संबंध स्पष्ट किया गया है।
