base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/018/008.yaml
  text: And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.
translation:
  language: hi
  text: और उसने वेदी बनाई और उस पर लकड़ियाँ रखीं। फिर उसने अपने पुत्र इसहाक को बाँधा और उसे वेदी के ऊपर रखी लकड़ियों पर लिटा दिया। तब उसने छुरी लेने के लिए अपना हाथ बढ़ाया, ताकि वह अपने पुत्र इसहाक का वध करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሥዋዕ
  choice: वेदी
  rationale: यहाँ शब्द बलि चढ़ाने के लिए बनाई गई संरचना को दर्शाता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘वेदी’ स्वाभाविक और सटीक है।
- source_word: ዕፀወ / ዕፀው
  choice: लकड़ियाँ
  rationale: प्रसंग में बलि जलाने के लिए वेदी पर रखी गई लकड़ी है; हिन्दी में बहुवचन ‘लकड़ियाँ’ अर्थ को सहजता से व्यक्त करता है।
- source_word: አሰረ
  choice: बाँधा
  rationale: मूल क्रिया का सीधा अर्थ बाँधना है; इसे बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: መጥባሕተ
  choice: छुरी
  rationale: यह बलि-वध के लिए प्रयुक्त चाकू या छुरी को सूचित करता है; ‘छुरी’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ይዝብሖ
  choice: वध करे
  rationale: मूल क्रिया बलि के प्रसंग में गला काटकर मारने/बलि करने का स्पष्ट भाव रखती है। ‘वध करे’ उस गंभीरता को बनाए रखता है और केवल सामान्य ‘मार डाले’ से अधिक प्रसंगानुकूल है।
theological_decisions:
- issue: अब्राहम की मंशा का स्वरूप
  choice: ‘ताकि वह ... वध करे’ के रूप में उद्देश्यसूचक कथन रखा गया
  alternative: ‘वध करने ही वाला था’
  rationale: मूल पाठ हाथ बढ़ाने का उद्देश्य बताता है; यह आवश्यक रूप से घटना की समयगत निकटता पर अतिरिक्त बल नहीं देता।
- issue: इसहाक के संबंध की पुनरावृत्ति
  choice: दोनों स्थानों पर ‘अपने पुत्र इसहाक’ रखा गया
  alternative: दूसरे स्थान पर केवल ‘उसे’ या ‘इसहाक’
  rationale: मूल में पुत्र-संबंध की पुनरावृत्ति है, जो कथा के भावात्मक और धर्मवैचारिक तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल कथात्मक शैली। मूल की क्रमिक क्रियाओं को स्पष्ट वाक्यों में रखा गया है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
