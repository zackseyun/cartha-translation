  text: And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your firstborn, your beloved one, from me, surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.”
translation:
  language: hi
  text: 'और उसने कहा, “यहोवा कहता है, ‘मैंने अपनी ही शपथ खाई है: क्योंकि तूने यह काम किया है और अपने पुत्र, अपने पहलौठे, जिससे तू प्रेम करता है, को मुझसे नहीं रोका है, इसलिए मैं निश्चय ही तुझे आशीष दूँगा और तेरे वंश को आकाश के तारों और समुद्र-तट की रेत के समान बहुत बढ़ाऊँगा; और तेरा वंश अपने शत्रुओं के नगरों पर अधिकार करेगा।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በርእስየ፡ መሐልኩ
  choice: मैंने अपनी ही शपथ खाई है
  rationale: शाब्दिक अर्थ ‘मैंने अपने आप की शपथ खाई’; स्वाभाविक हिन्दी में आत्म-शपथ का बल बनाए रखा गया है।
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यहाँ परमेश्वर के विशिष्ट वाचा-नाम का प्रतिनिधित्व करता है; हिन्दी बाइबलीय प्रयोग के अनुरूप ‘यहोवा’ चुना गया।
- source_word: 'በኵረከ (पाठ में OCR: በዘረከ)'
  choice: अपने पहलौठे
  rationale: समीक्षित पाठ-साक्ष्य के अनुसार डिजिटल रूप OCR-दोष है और अभिप्रेत शब्द ‘तेरा पहलौठा’ है; इसे छोड़ा या ‘वंश’ अनूदित नहीं किया गया।
- source_word: ዘአፍቀርከ
  choice: अपने प्रिय पुत्र
  rationale: अर्थ ‘जिससे तू प्रेम करता है’; निकटवर्ती ‘पुत्र’ को स्पष्ट करते हुए सहज हिन्दी में अनूदित।
- source_word: ባርኮ፡ እባርከከ
  choice: मैं निश्चय ही तुझे आशीष दूँगा
  rationale: सजातीय क्रिया-रचना के emphatic बल को हिन्दी के ‘निश्चय ही’ से व्यक्त किया गया।
- source_word: አበዝኆ፡ አበዝኆ
  choice: बहुत बढ़ाऊँगा
  rationale: दोहराई गई क्रिया की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘርአከ
  choice: तेरा वंश
  rationale: सामूहिक ‘seed/offspring’ के लिए प्रचलित और संदर्भानुकूल हिन्दी पद।
- source_word: አህጉረ፡ ፀሮሙ
  choice: अपने शत्रुओं के नगरों
  rationale: አህጉር का यहाँ अर्थ नगर/बस्तियाँ है; अधिकार के अगले अर्थ को क्रिया में व्यक्त किया गया।
- source_word: ይወርሱ
  choice: अधिकारी होगा
  rationale: ‘विरासत में पाएगा/अधिकार करेगा’ का बाइबलीय और स्वाभाविक हिन्दी रूप; सामूहिक एकवचन ‘वंश’ के अनुरूप एकवचन क्रिया।
theological_decisions:
- issue: पुत्र के वर्णन में ‘पहलौठा’ का समावेश
  choice: ‘अपने पुत्र—अपने पहलौठे, अपने प्रिय पुत्र—’
  alternative: ‘अपने पुत्र, अपने प्रिय पुत्र’
  rationale: पाठ-समीक्षा በዘረከ को በኵረከ का OCR-दोष मानती है; इसलिए ‘पहलौठा’ स्रोत का वास्तविक घटक है और धर्मवैचारिक कठिनाई के कारण हटाया नहीं जाना चाहिए।
- issue: दिव्य प्रतिज्ञा की तीव्रता
  choice: ‘निश्चय ही ... आशीष दूँगा’ और ‘बहुत बढ़ाऊँगा’
  alternative: सिर्फ ‘आशीष दूँगा और बढ़ाऊँगा’
  rationale: स्रोत की emphatic infinitive/दोहराव-सदृश रचना को अर्थपूर्ण हिन्दी बल के साथ सुरक्षित रखा गया।
- issue: वंश द्वारा शत्रु-नगरों का अधिकार
  choice: ‘तेरा वंश अपने शत्रुओं के नगरों का अधिकारी होगा’
  alternative: ‘तेरा वंश अपने शत्रुओं के फाटक का अधिकारी होगा’
  rationale: दिए गए गीइज़ पाठ में ‘नगरों’ का पाठ है; उत्पत्ति के किसी समानांतर पाठ से ‘फाटक’ आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध बाइबलीय शैली। संबोधन के लिए एकवचन ‘तू/तेरा’ रखा गया है। स्रोत की औपचारिक शपथ, प्रतिज्ञा का बल और सामूहिक ‘वंश’ सुरक्षित हैं; विराम-चिह्न पुत्र के तीन संबद्ध वर्णनों को स्पष्ट करते हैं।
