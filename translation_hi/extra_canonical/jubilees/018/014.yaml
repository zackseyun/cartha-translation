  text: And the LORD called to Abraham by name a second time from heaven, as he had shown me, that we should speak in the name of the LORD.
translation:
  language: hi
  text: और प्रभु ने दूसरी बार स्वर्ग से अब्राहम को नाम लेकर पुकारा, जैसा उसने मुझे दिखाया था कि हम प्रभु के नाम से बोलें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: यहोवा
  rationale: यहाँ इस पद में दो बार आया ईश्वरीय नाम/उपाधि हिन्दी बाइबलीय परंपरा में परिचित और विशिष्ट रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: ጸውዖ ... በስሙ
  choice: नाम लेकर पुकारा
  rationale: क्रिया और ‘उसके नाम से/नाम द्वारा’ के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዳግመ
  choice: दूसरी बार
  rationale: पुनरावृत्ति का स्रोतगत अर्थ सीधे बनाए रखता है।
- source_word: እምሰማይ
  choice: स्वर्ग से
  rationale: स्थान/स्रोत-सूचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: በከመ አስተረአየኒ
  choice: जैसा उसने मुझे दिखाया था
  rationale: तुलनात्मक उपवाक्य और प्रथम-पुरुष वक्ता, दोनों को बिना स्पष्टकारी विस्तार के सुरक्षित रखता है।
- source_word: ከመ ንትናገር
  choice: ताकि हम ... बोलें
  rationale: ከመ के प्रयोजन/परिणाम-संभावित संबंध को ‘ताकि’ से व्यक्त किया गया है; बहुवचन प्रथम पुरुष को बनाए रखा गया है।
- source_word: በስመ እግዚአብሔር
  choice: यहोवा के नाम से
  rationale: प्रतिनिधित्व या अधिकार के नाम पर बोलने का स्रोतगत मुहावरा हिन्दी में इसी परिचित रूप में सुरक्षित रहता है।
theological_decisions:
- issue: ‘मुझे’ और ‘हम’ के कथावाचक संदर्भ की अस्पष्टता
  choice: जैसा उसने मुझे दिखाया था, ताकि हम ... बोलें
  alternative: संदर्भ स्पष्ट करने के लिए कथावाचक या स्वर्गदूत की पहचान जोड़ना
  rationale: स्रोत स्वयं वक्ता की पहचान इस पद में स्पष्ट नहीं करता; इसलिए किसी व्याख्यात्मक पहचान को पाठ में नहीं जोड़ा गया।
- issue: अंतिम ከመ उपवाक्य का संबंध
  choice: उसे प्रयोजनसूचक ‘ताकि’ के रूप में रखा गया
  alternative: ‘और इस प्रकार हमें ... बोलना था’ या केवल ‘कि हम ... बोलें’
  rationale: स्रोत में प्रयोजन और परिणाम के बीच कुछ व्याकरणिक लचीलापन संभव है; ‘ताकि’ अंग्रेज़ी परामर्श-पाठ के अनुरूप रहते हुए वाक्य का संबंध स्पष्ट करता है, पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण बाइबलीय शैली अपनाई गई है। वाक्य की असामान्य कथावाचकीय गति—‘मुझे’ से ‘हम’—जानबूझकर सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
