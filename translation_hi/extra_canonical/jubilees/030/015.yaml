  yaml_path: translation/extra_canonical/jubilees/030/015.yaml
  text: or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague[15], and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.
translation:
  language: hi
  text: या यदि उसकी बेटियों में से किसी को उसने अन्यजातियों में से किसी पुरुष को दे दिया हो। क्योंकि यह विपत्ति पर विपत्ति[a] और शाप पर शाप है; और हर दण्ड, विपत्ति और शाप आएगा। यदि वह ऐसा करता है, या उन लोगों की ओर से आँखें मूँद लेता है जो अशुद्धता करते हैं, जो प्रभु के पवित्रस्थान को अशुद्ध करते हैं और जो उसके पवित्र नाम को अपवित्र करते हैं, तो सारी प्रजा का उन सब अशुद्धताओं और अपवित्रीकरणों के कारण एक साथ न्याय किया जाएगा। न पक्षपात किया जाएगा, न उसके हाथ से फल, बलिदान, होमबलि, चरबी या सुखद सुगन्ध स्वीकार की जाएगी, कि वह स्वीकार्य हो। इस्राएल के हर उस पुरुष या स्त्री के साथ ऐसा ही होगा जो उसके पवित्रस्थान को अशुद्ध करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 15 की भाषा असामान्य रूप से सघन है और सम्भवतः इसमें कई कानूनी और उपासना-सम्बन्धी कथन संक्षेप में एक साथ रखे गए हैं। अनुवाद में अशुद्धता, सामूहिक न्याय, पक्षपात का अभाव और भेंटों के अस्वीकार किए जाने का क्रम बिना अधिक सरल बनाए सुरक्षित रखा गया है।
    reason: segmentation_note
lexical_decisions:
- source_word: መቅሠፍት
  choice: विपत्ति
  rationale: यह शब्द दैवी प्रकोप, मार या विपत्ति का भाव रखता है; ‘विपत्ति’ सामान्य पाठक के लिए स्वाभाविक रहते हुए दण्डात्मक संदर्भ भी बनाए रखता है।
- source_word: ርኵሰ
  choice: अशुद्धता
  rationale: प्रसंग नैतिक और उपासना-सम्बन्धी दोनों प्रकार की अशुद्धता को समेटता है, इसलिए व्यापक शब्द चुना गया है।
- source_word: ያረኵሱ፡ መቅደሶ
  choice: पवित्रस्थान को अशुद्ध करते हैं
  rationale: मूल में पवित्रस्थान को अशुद्ध या दूषित करने की उपासना-सम्बन्धी भाषा है; इसे स्पष्ट और पारंपरिक बाइबलीय हिन्दी में रखा गया है।
- source_word: ነሢአ፡ ገጽ / አድልዎ፡ ለገጽ
  choice: पक्षपात
  rationale: शाब्दिक रूप से ‘मुख ग्रहण करना’ पक्षपात दिखाने का मुहावरा है; हिन्दी में अर्थगत समतुल्य शब्द अधिक स्वाभाविक है।
- source_word: ትምዐዘ፡ መዐዛ፡ ሠናይ
  choice: सुखद सुगन्ध
  rationale: यह स्वीकार्य भेंट की सुगन्ध के लिए प्रचलित उपासना-सम्बन्धी पदबंध है; मूल की स्वीकार्यता की धारणा अगले क्रियापद से व्यक्त होती है।
theological_decisions:
- issue: अशुद्धता के कारण सामूहिक न्याय
  choice: ‘सारी प्रजा ... एक साथ दोषी ठहराई जाएगी’
  alternative: ‘सारी प्रजा का न्याय किया जाएगा’
  rationale: मूल सामूहिक दण्ड/न्याय की कठोरता बनाए रखता है; ‘दोषी ठहराई जाएगी’ संदर्भ में न्यायिक परिणाम को स्पष्ट करता है, पर व्यक्तिगत दोष की पूरी व्याख्या नहीं जोड़ता।
- issue: भेंटों का अस्वीकार
  choice: फल, बलिदान, होमबलि, चरबी और सुखद सुगन्ध स्वीकार न किए जाने की सूची सुरक्षित रखी
  alternative: सूची को सामान्यीकृत करके ‘कोई भेंट स्वीकार न होगी’
  rationale: मूल की उपासना-सम्बन्धी सघनता और विभिन्न चढ़ावों का क्रम धर्मवैज्ञानिक रूप से महत्त्वपूर्ण है, इसलिए सूची को संक्षिप्त नहीं किया गया।
- issue: ईश्वर के नाम और पवित्रस्थान के सर्वनाम
  choice: ‘उसके पवित्र नाम’ और ‘उसके पवित्रस्थान’
  alternative: हर स्थान पर ‘प्रभु का’ दोहराना
  rationale: मूल के सर्वनामिक संबंध को सुरक्षित रखा गया है और निकटवर्ती ‘प्रभु’ से संदर्भ स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘अन्यजातियाँ’, ‘पवित्रस्थान’, ‘होमबलि’ और ‘अशुद्धता’ जैसे परिचित बाइबलीय पद रखे गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट बनाया गया है।
