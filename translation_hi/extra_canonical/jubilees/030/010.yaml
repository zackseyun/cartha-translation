  text: whoever defiles it shall surely die[10], and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man should be rooted out who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.
translation:
  language: hi
  text: जो उसे अशुद्ध करे, वह निश्चय ही मरे; उसे पत्थरों से मार डाला जाए। इस व्यवस्था के लिए दिनों की कोई सीमा नहीं है; न क्षमा है, न किसी प्रकार का प्रायश्चित—सिवाय इसके कि वह पुरुष जड़ से उखाड़ दिया जाए जिसने समस्त इस्राएल के बीच एक बेटी को अशुद्ध किया है, क्योंकि उसने अपने वंश में से मोलेक को दिया है[a] और उसे अशुद्ध करने के लिए दुष्टता की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मोलेक वाला यह खंड इस संदर्भ में अचानक आता है। गीज़ पाठ इसे सुरक्षित रखता है; संभव है कि यह अनुचित रीति से वंश देने और उपासना-संबंधी अपवित्रता के बीच एक व्यापक समानता प्रस्तुत करता हो।
    reason: textual_variant
lexical_decisions:
- source_word: ዘያረኵስ
  choice: जो उसे अशुद्ध करे
  rationale: क्रिया का मूल अर्थ अशुद्ध या अपवित्र करना है। कर्म का स्पष्ट संज्ञा-रूप इस अंश में नहीं है, इसलिए सर्वनाम द्वारा स्रोत की संदर्भगत अस्पष्टता बनाए रखी गई है।
- source_word: ሞተ፡ ለይሙት
  choice: वह निश्चय ही मार डाला जाए
  rationale: सजातीय क्रिया-रचना मृत्यु-दंड की निश्चितता पर बल देती है; स्वाभाविक हिन्दी में इसे ‘निश्चय ही’ से व्यक्त किया गया है।
- source_word: ወበእብን፡ ይትወገር
  choice: और पत्थरों से मारा जाए
  rationale: शाब्दिक रूप से पत्थर से प्रहार किए जाने का भाव है; हिन्दी में प्रचलित दंड-वाक्यांश चुना गया है।
- source_word: አልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ
  choice: इस व्यवस्था के लिए दिनों की कोई सीमा नहीं है
  rationale: व्यवस्था के कालातीत या असीमित लागू होने की स्रोत-अभिव्यक्ति को निकटता से रखा गया है।
- source_word: ይሤረው
  choice: जड़ से उखाड़ दिया जाए
  rationale: क्रिया का उखाड़ने या समूल हटाने वाला बिंब सुरक्षित रखा गया है; इसे केवल ‘मार डाला जाए’ बनाकर विशिष्ट रूपक को नहीं मिटाया गया।
- source_word: እምውስተ፡ ዘርኡ፡ ወሀቦ፡ ለሞሎክ
  choice: उसने अपने वंश में से मोलेक को दिया है
  rationale: ‘वंश/बीज में से’ और मोलेक को देने की असामान्य, संक्षिप्त संरचना को बिना अनुमानित कर्म जोड़कर सुरक्षित रखा गया है।
theological_decisions:
- issue: क्षमा और प्रायश्चित के निषेध के बाद दंड का संबंध
  choice: ‘सिवाय इसके कि’ द्वारा स्रोत की अपवादात्मक संरचना बनाए रखी
  alternative: इसे ‘इसका एकमात्र उपाय यह है’ कहकर व्याख्यायित करना
  rationale: मूल पाठ क्षमा, प्रायश्चित और अपराधी के उखाड़े जाने के बीच एक कठिन तनाव रखता है; अनुवाद ने उसे व्यवस्थित सिद्धांत में नहीं बदला।
- issue: मोलेक संबंधी खंड
  choice: खंड को मुख्य पाठ में यथावत रखा और उसकी आकस्मिकता पर पादटिप्पणी दी
  alternative: इसे प्रक्षेप मानकर हटाना या व्याख्यात्मक रूप से अनैतिक यौनाचार का रूपक बनाना
  rationale: गीज़ पाठ इस खंड को सुरक्षित रखता है, पर संदर्भ में इसका संबंध अचानक आता है; इसलिए पाठ और उसकी कठिनाई दोनों संरक्षित किए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर विधिक-धार्मिक शैली रखी गई है। ‘व्यवस्था’, ‘प्रायश्चित’ और ‘जड़ से उखाड़ दिया जाए’ जैसे पद स्रोत के औपचारिक तथा बिंबात्मक स्वर को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सुबोध रखी गई है।
