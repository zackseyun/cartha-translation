base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/011.yaml
  text: And you, Moses, command the children of Israel and testify to them that they are not to give any of their daughters to the nations, and that they are not to take wives for their sons from the daughters of the nations.
translation:
  language: hi
  text: और तुम, हे मूसा, इस्राएल की संतानों को आज्ञा दो और उन्हें सचेत करो[a] कि वे अपनी बेटियों में से किसी को अन्यजातियों को न दें और अपने बेटों के लिए अन्यजातियों की बेटियों में से पत्नियाँ न लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें गवाही देकर चेतावनी दो”; अधिक शाब्दिक रूप में, “उन्हें सुनाओ।”
    reason: गीज़ मुहावरे में चेतावनी देने, साक्षी ठहराने और सुनाने की अर्थ-छायाएँ संभव हैं।
lexical_decisions:
- source_word: ለደቂቀ፡ እስራኤል
  choice: इस्राएल की संतानों को
  rationale: शाब्दिक अर्थ ‘इस्राएल की संतान/बच्चे’ है; यह हिन्दी में सामूहिक वाचा-समुदाय के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: ወአስምዕ፡ ላዕሌሆሙ
  choice: और उन्हें सचेत करो
  rationale: कारक ‘सुनाना’ और ‘उन पर/उनके विरुद्ध’ का यह मुहावरा गंभीर चेतावनी या साक्ष्य देने का भाव रखता है। ‘सचेत करो’ स्वाभाविक हिन्दी में आदेश की गंभीरता रखता है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ለአሕዛብ
  choice: अन्यजातियों को
  rationale: यहाँ शब्द इस्राएल से बाहर की जातियों/राष्ट्रों को सूचित करता है; ‘अन्यजातियाँ’ बाइबलीय संदर्भ में प्रचलित और संक्षिप्त है।
- source_word: አይንሥኡ፡ ለውሉዶሙ
  choice: अपने बेटों के लिए ... पत्नियाँ न लें
  rationale: स्रोत में ‘अपने पुत्रों के लिए न लें’ है; विवाह-संदर्भ को हिन्दी में स्पष्ट करने के लिए ‘पत्नियाँ’ व्यक्त किया गया है, जैसा वाक्य के आशय से निहित है।
theological_decisions:
- issue: अंतरजातीय विवाह-निषेध का दायरा
  choice: ‘अन्यजातियों’ के रूप में स्रोत की सामुदायिक सीमा को यथावत रखा
  alternative: इसे सभी युगों के सभी जातीय समूहों के बीच विवाह पर सार्वभौमिक निषेध की तरह विस्तार देना
  rationale: पाठ सीधे इस्राएल की संतानों और अन्यजातियों के बीच विवाह की बात करता है; अनुवाद उस ऐतिहासिक-वाचागत कथन से आगे कोई सिद्धान्त आरोपित नहीं करता।
- issue: ወአስምዕ፡ ላዕሌሆሙ का बल
  choice: ‘उन्हें सचेत करो’
  alternative: ‘उनके विरुद्ध साक्षी दो’ या ‘उन्हें सुनाओ’
  rationale: मूल मुहावरे में चेतावनी, उद्घोषणा और साक्ष्य का तनाव है। मुख्य पाठ में स्वाभाविक ‘सचेत करो’ चुना गया और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘हे मूसा’ संबोधन को स्पष्ट करता है, और समानांतर निषेधों की संरचना मूल के अनुरूप रखी गई है।
