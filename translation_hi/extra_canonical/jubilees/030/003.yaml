base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/003.yaml
  text: And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister.
translation:
  language: hi
  text: और वह बारह वर्ष की थी। उसने उसके पिता और उसके भाइयों से आग्रह किया कि उसे उसके लिए पत्नी के रूप में दे दिया जाए। शकेम के पुरुषों के कारण याकूब और उसके पुत्र क्रोधित हुए, क्योंकि उन्होंने उनकी बहन दीना को अपवित्र किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስተብቍዓ
  choice: विनती की
  rationale: यह क्रिया साधारणतः आग्रह या याचना करने का भाव रखती है; इसलिए केवल ‘माँगा’ की अपेक्षा ‘विनती की’ स्रोत के भाव को अधिक स्पष्ट करता है।
- source_word: ዐደወ፡ ሰቂማ
  choice: शकेम के पुरुषों
  rationale: ዐደወ यहाँ बहुवचन संबंधसूचक रूप ‘के पुरुष’ है, ‘शहर’ नहीं; इसलिए स्रोत-समीक्षा के अनुसार ‘शकेम के पुरुषों’ रखा गया है।
- source_word: አርኰስዋ
  choice: उसे अशुद्ध किया था
  rationale: मूल क्रिया अपवित्र या अशुद्ध करने का भाव व्यक्त करती है। ‘अशुद्ध किया’ स्रोत की धार्मिक-सामाजिक गंभीरता बनाए रखता है और घटना का अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: दीना के साथ किए गए कृत्य का वर्णन
  choice: अशुद्ध किया था
  alternative: उसका अपमान किया था / उसे भ्रष्ट किया था
  rationale: ‘अशुद्ध किया’ मूल के अपवित्रीकरण संबंधी अर्थ को सुरक्षित रखता है; वैकल्पिक पद स्रोत के धार्मिक और सामाजिक आयाम को संकुचित या अधिक व्याख्यायित कर सकते हैं।
- issue: ‘उनकी बहन’ में संबंधगत तनाव
  choice: उनकी बहन दीना
  alternative: याकूब की बेटी और उसके पुत्रों की बहन दीना
  rationale: मूल पाठ स्वयं ‘उनकी बहन’ कहता है। संबंध को विस्तार देकर सुगम बनाना संभव था, पर उससे स्रोत की संक्षिप्त और कुछ हद तक तनावपूर्ण अभिव्यक्ति बदल जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और स्रोत-सन्निकट रूप। आरंभिक सर्वनाम जानबूझकर बनाए रखे गए हैं, क्योंकि मूल में स्त्री और पुरुष कर्ताओं के नाम इस पद में दोहराए नहीं गए। ‘शकेम के पुरुषों’ को ‘शकेम नगर’ नहीं किया गया है।
