revisions:
- from: और वह बारह वर्ष की थी। उसने उसके पिता और उसके भाइयों से विनती की कि वह उसे पत्नी के रूप में दे दी जाए। शकेम के पुरुषों के कारण याकूब और उसके पुत्र क्रोधित हुए, क्योंकि उन्होंने उनकी बहन दीना को अशुद्ध किया था।
  to: और वह बारह वर्ष की थी। उसने उसके पिता और उसके भाइयों से आग्रह किया कि उसे उसके लिए पत्नी के रूप में दे दिया जाए। शकेम के पुरुषों के कारण याकूब और उसके पुत्र क्रोधित हुए, क्योंकि उन्होंने उनकी बहन दीना को अपवित्र किया था।
  rationale: The revision only improves the Hindi syntax of the marriage-request clause and uses the more idiomatic formal term “अपवित्र किया.” It retains “शकेम के पुरुषों,” in accordance with the Ge'ez construct plural and the audit trail’s correction of the erroneous “city of Shechem” rendering. The source’s pronoun-based style and its concise “their sister Dinah” relationship are preserved.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T20:08:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders ዐደወ፡ ሰቂማ as “शकेम के पुरुषों,” not “शकेम नगर.” It also retains the source’s indirect reference to Dinah’s defilement without adding details. The request clause, however, needs a clearer Hindi passive construction to convey that he asked her father and brothers to give her to him as wife.
  naturalness: “कि वह उसे पत्नी के रूप में दे दी जाए” is grammatically cumbersome and leaves the passive construction needlessly opaque. “कि उसे उसके लिए पत्नी के रूप में दे दिया जाए” is idiomatic and preserves the source’s unnamed participants. “अपवित्र किया” is more natural and suitably formal Hindi than “अशुद्ध किया” in this context.
  terminology: “आग्रह किया” appropriately renders the request without overstating it as a plea. “अपवित्र किया” accurately represents the source’s defilement language and maintains the religious-social register. No footnote is needed for “शकेम के पुरुषों,” since the source wording supports this directly; the English audit’s former city rendering was an identified error, not a textual ambiguity requiring preservation.
  issues:
  - severity: medium
    issue: The wife-request clause is awkwardly formed in Hindi.
    rationale: The draft’s “कि वह उसे पत्नी के रूप में दे दी जाए” has potentially confusing pronoun roles and an unnatural passive construction. Revising it clarifies that she was to be given to him while retaining the source’s unnamed pronouns.
  - severity: low
    issue: “अशुद्ध किया” is less idiomatic than “अपवित्र किया” for defiling a person.
    rationale: “अपवित्र किया” better fits elevated modern biblical Hindi and the source verb’s semantic range, without adding interpretation.
  revised_text: और वह बारह वर्ष की थी। उसने उसके पिता और उसके भाइयों से आग्रह किया कि उसे उसके लिए पत्नी के रूप में दे दिया जाए। शकेम के पुरुषों के कारण याकूब और उसके पुत्र क्रोधित हुए, क्योंकि उन्होंने उनकी बहन दीना को अपवित्र किया था।
