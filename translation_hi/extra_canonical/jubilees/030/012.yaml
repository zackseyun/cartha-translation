  text: because it is an abomination before the LORD. Therefore I have written for you in the words of the law all the deeds of the Shechemites that they did against Dinah, and how the sons of Jacob spoke, saying,
translation:
  language: hi
  text: 'क्योंकि यह प्रभु के सामने घृणित बात है। इसलिए मैंने व्यवस्था के वचनों में तुम्हारे लिए शकेमवासियों के वे सब काम लिखे हैं, जो उन्होंने दीना के विरुद्ध किए, और यह भी कि याकूब के पुत्रों ने किस प्रकार कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምኑን
  choice: घृणित बात
  rationale: यह शब्द किसी घृणित या वर्जित वस्तु/कर्म का संज्ञात्मक बोध कराता है; इसलिए केवल विशेषण के बजाय संज्ञात्मक अभिव्यक्ति रखी गई।
- source_word: እግዚአብሔር
  choice: प्रभु
  rationale: गीज़ में ईश्वर के लिए प्रयुक्त मानक पद का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ውስተ፡ ቃለ፡ ሕግ
  choice: व्यवस्था के वचनों में
  rationale: शाब्दिक संरचना ‘व्यवस्था के वचन में/वचनों में’ को बनाए रखते हुए हिन्दी में सहज बहुवचन चुना गया।
- source_word: ግብሮሙ፡ ለሴቄማ
  choice: शकेमवासियों के ... काम
  rationale: परवर्ती सर्वनाम और क्रिया बहुवचन हैं; अतः नगर अथवा एक व्यक्ति ‘शकेम’ के बजाय उसके लोगों का संकेत स्पष्ट किया गया।
- source_word: ላዕለ፡ ዲና
  choice: दीना के विरुद्ध
  rationale: संदर्भ में दीना पर किए गए अपराध के प्रतिकूल भाव को ठीक प्रकार व्यक्त करता है।
- source_word: ደቂ፡ ያዕቆብ
  choice: याकूब के पुत्रों
  rationale: मूल की संबंधसूचक औपचारिक संरचना सुरक्षित रखी गई।
- source_word: እንዘ፡ ይብሉ
  choice: 'कहा:'
  rationale: यह सूत्र आगे आने वाले प्रत्यक्ष कथन का परिचय देता है; हिन्दी में पद्यांत पर कोलन इसका स्वाभाविक संकेत है।
theological_decisions:
- issue: घृणितता के कर्ता/संदर्भ की अस्पष्टता
  choice: ‘यह ... घृणित बात है’
  alternative: ‘वह ... घृणित बात है’ अथवा किसी विशिष्ट कर्म का नाम जोड़ना
  rationale: मूल में संकेत का संदर्भ पूर्ववर्ती प्रसंग पर निर्भर है; किसी खास कर्म को नाम देकर अस्पष्टता को कृत्रिम रूप से नहीं सुलझाया गया।
- issue: ईश्वरीय नाम का निरूपण
  choice: ‘प्रभु’
  alternative: ‘यहोवा’ या ‘परमेश्वर’
  rationale: स्रोत-पद का परंपरागत अर्थ ‘प्रभु’ है; यहाँ कोई विशिष्ट साम्प्रदायिक नामरूप आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘व्यवस्था’, ‘घृणित बात’ और ‘याकूब के पुत्र’ जैसे बाइबिलीय पद बनाए गए हैं। पद्य आगे आने वाले कथन की भूमिका है, इसलिए अंत में कोलन रखा गया है।
