base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/002.yaml
  text: And there Shechem[2], the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter, and he seized her and lay with her and defiled her, and she was a young girl.
translation:
  language: hi
  text: और वहाँ हिव्वी हमोर के पुत्र शकेम ने, जो उस देश का प्रधान था, याकूब की बेटी दीना को देखा। उसने उसे पकड़ लिया, उसके साथ सहवास किया और उसे अपवित्र कर दिया,[a] और वह कम उम्र की लड़की थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उसे अशुद्ध या दूषित कर दिया।
    reason: गीज़ क्रिया में अपवित्रता और अशुद्धता का भाव प्रमुख है।
  - marker: b
    text: मूल पाठ यहाँ केवल यह बताता है कि दीना कम उम्र की लड़की थी; अगले पद में उसकी आयु बारह वर्ष बताई गई है।
    reason: इस पद की सामान्य आयु-सूचना और अगले पद की निश्चित आयु के बीच अंतर सुरक्षित रखना।
lexical_decisions:
- source_word: ወአርኰሳ
  choice: और उसे अपवित्र कर दिया
  rationale: गीज़ क्रिया का मूल अर्थ अशुद्ध, दूषित या अपवित्र करना है। यह अनुवाद इस अध्याय में दीना के अपवित्रीकरण की प्रमुख विषयवस्तु को सुरक्षित रखता है; केवल ‘उसका अपमान किया’ कहना स्रोत की विशिष्ट शब्दावली को धुंधला कर देता।
- source_word: ወይእቲሰ፡ ንስቲት
  choice: और वह अभी कम उम्र की लड़की थी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उसकी अल्पायु बताता है, जबकि अगले पद में दी गई बारह वर्ष की ठीक आयु को समय से पहले इस पद में नहीं जोड़ता।
- source_word: ወሰከበ፡ ምስሌሃ
  choice: उसके साथ सहवास किया
  rationale: शाब्दिक ‘उसके साथ लेटा’ के यौन आशय को आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: दीना के साथ किए गए कृत्य का वर्णन
  choice: अपवित्र कर दिया
  alternative: उसका अपमान किया / उसे दीन किया
  rationale: गीज़ पाठ यहाँ अपवित्र या अशुद्ध करने वाली क्रिया का प्रयोग करता है। उत्पत्ति 34 की किसी वैकल्पिक इब्रानी अभिव्यक्ति को प्रधान बनाकर गीज़ की विशिष्ट धर्मवैचारिक भाषा को बदलना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘देश के प्रधान’ पदवी का औपचारिक भाव बनाए रखता है। यौन हिंसा के वर्णन में स्रोत की सीधी क्रमबद्धता—पकड़ना, सहवास करना, अपवित्र करना—बिना अनावश्यक विस्तार के सुरक्षित है। आरंभिक ‘शांति से, छठे महीने में’ जैसा अंश इस पद से पहले के वाक्य/पद का समापन प्रतीत होता है और प्रमाणित पद-विभाजन तथा परामर्श-पाठ के अनुसार यहाँ सम्मिलित नहीं किया गया।
