  text: 'For thus it has been ordained and written on the heavenly tablets concerning all the seed of Israel:'
translation:
  language: hi
  text: 'क्योंकि इस्राएल के समस्त वंश के विषय में स्वर्गीय पट्टिकाओं पर ऐसा ही ठहराया और लिखा गया है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: कारणसूचक संयोजक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ከመዝ
  choice: ऐसा ही
  rationale: पूर्ववर्ती या आगामी विधान की ओर संकेत करने वाले अर्थ को बनाए रखता है।
- source_word: ተሠርዐ
  choice: ठहराया गया है
  rationale: विधान किए जाने या नियत किए जाने का निष्क्रिय अर्थ व्यक्त करता है, बिना यह जोड़े कि कर्ता कौन है।
- source_word: ተጽሕፈ
  choice: लिखा गया है
  rationale: मूल के निष्क्रिय क्रियारूप को सुरक्षित रखता है।
- source_word: ውስተ ጽላተ ሰማይ
  choice: स्वर्गीय पट्टिकाओं पर
  rationale: शाब्दिक बिंब को स्पष्ट और सहज आधुनिक हिन्दी में रखता है।
- source_word: በእንተ ኵሉ ዘርአ እስራኤል
  choice: इस्राएल के समस्त वंश के विषय में
  rationale: ‘समस्त बीज’ की वंशगत सामूहिक धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विधान के कर्ता की पहचान
  choice: निष्क्रिय रूप ‘ठहराया और लिखा गया है’
  alternative: ‘परमेश्वर ने ठहराया और लिखवाया है’
  rationale: मूल पाठ कर्ता को स्पष्ट नहीं करता; इसलिए किसी विशिष्ट दैवी कर्ता या लिखवाने की प्रक्रिया को जोड़ना उचित नहीं।
- issue: ‘इस्राएल के बीज’ का अर्थ
  choice: ‘इस्राएल का समस्त वंश’
  alternative: ‘इस्राएल की सारी सन्तान’
  rationale: वंशगत-सामूहिक अर्थ को बनाए रखते हुए लिंग-समावेशी और गरिमापूर्ण अभिव्यक्ति चुनी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मूल की विधिक-स्वर्गीय शब्दावली के अनुरूप। पद के अंत का द्विबिंदु आगे आने वाले विधान से इसके संबंध को दर्शाता है।
