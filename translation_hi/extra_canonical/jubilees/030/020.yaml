base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/020.yaml
  text: And on the day when Jacob's sons killed Shechem, a record was written for them in heaven that they had performed righteousness and uprightness and vengeance on the sinners, and it was written down for blessing.
translation:
  language: hi
  text: और जिस दिन याकूब के पुत्रों ने शकेम के लोगों को मार डाला, उस दिन स्वर्ग में उनके लिए एक अभिलेख लिखा गया कि उन्होंने धार्मिकता और सत्यनिष्ठा का कार्य किया और पापियों पर प्रतिशोध किया; और यह आशीष के लिए लिखा गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፍ (maṣḥaf)
  choice: अभिलेख
  rationale: मूल शब्द का अर्थ पुस्तक या लिखित लेख हो सकता है; इस प्रसंग में स्वर्ग में दर्ज किए गए आधिकारिक विवरण के लिए ‘अभिलेख’ स्वाभाविक और सटीक है।
- source_word: ተጽሕፈ (taṣeḥfa)
  choice: लिखा गया
  rationale: यह कर्मवाच्य रूप है; इसलिए संशोधित स्रोत-पाठ के अनुसार ‘लिखा गया’ रखा गया, न कि ‘ऊपर गया’।
- source_word: ጽድቀ ወርትዐ (ṣədqa wa-rətʿa)
  choice: धार्मिकता और न्याय का काम
  rationale: दोनों नैतिक संज्ञाओं को अलग रखते हुए आधुनिक हिन्दी में सहज क्रियात्मक अभिव्यक्ति दी गई है।
- source_word: በቀለ (baqala)
  choice: बदला लिया
  rationale: यहाँ अपराधियों के विरुद्ध प्रतिशोध या दंडात्मक बदले का भाव है; ‘बदला लिया’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ሰቂማነ (saqimāna)
  choice: शकेम के लोगों को
  rationale: रूप बहुवचन समुदाय-निवासियों की ओर संकेत करता है, केवल शकेम नामक व्यक्ति की ओर नहीं।
theological_decisions:
- issue: शकेम के लोगों की हत्या का स्वर्गीय नैतिक मूल्यांकन
  choice: पाठ के स्पष्ट कथन को बनाए रखा कि यह धार्मिकता, न्याय और पापियों से बदला लेना था
  alternative: हिंसा को नरम करना, उससे दूरी बनाना, या केवल घटना का तटस्थ वर्णन करना
  rationale: मूल पाठ इस कार्य को स्पष्ट रूप से सकारात्मक स्वर्गीय मूल्यांकन और आशीष से जोड़ता है। अनुवादक को इस कठिन धार्मिक तनाव को न तो मिटाना चाहिए, न अपनी ओर से उचित ठहराना चाहिए।
- issue: स्वर्गीय लेख का कर्ता
  choice: कर्मवाच्य ‘लिखा गया’
  alternative: परमेश्वर या स्वर्गदूतों को स्पष्ट कर्ता बनाना
  rationale: मूल पाठ कर्ता को व्यक्त नहीं करता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और स्पष्ट शैली रखी गई है। ‘अभिलेख’, ‘धार्मिकता’, ‘न्याय’ और ‘आशीष’ धार्मिक-साहित्यिक प्रसंग के अनुरूप हैं, पर वाक्य-संरचना सामान्य पाठकों के लिए सहज है।
