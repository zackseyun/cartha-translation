  yaml_path: translation/extra_canonical/jubilees/030/007.yaml
  text: Thus, there shall not be in Israel one who defiles an Israelite virgin. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And as for the woman,
translation:
  language: hi
  text: इस प्रकार इस्राएल में ऐसा कोई न हो जो किसी इस्राएली कुँवारी को अशुद्ध करे। यदि इस्राएल में कोई पुरुष अपनी बेटी या अपनी बहन तक को अन्यजातियों के वंश के किसी पुरुष को देना चाहे, तो वह निश्चय ही मार डाला जाए; लोग उसे पत्थरों से मार डालें, क्योंकि उसने इस्राएल में लज्जाजनक काम किया है। और जहाँ तक उस स्त्री की बात है,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और उस स्त्री को भी—”; यह खंड अगले पद में पूरा होता है।
    reason: मूल पद के अंतिम अधूरे खंड और उसके अगले पद से व्याकरणिक संबंध को स्पष्ट करता है, बिना स्त्री को पिछले दण्ड-विधान से गलत ढंग से जोड़ने के।
lexical_decisions:
- source_word: ለአርኵሶ
  choice: अशुद्ध करे
  rationale: यह क्रिया दूषित या अपवित्र करने का भाव रखती है; प्रसंग में यौन अपमान निहित है, पर स्रोत से अधिक स्पष्ट शब्द जोड़ना उचित नहीं।
- source_word: ድንግለ፡ እስራኤላዊት
  choice: इस्राएली कुँवारी
  rationale: संज्ञा और जातीय विशेषण दोनों को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: अन्यजातियों के वंश के
  rationale: शाब्दिक ‘जातियों के बीज से’ के वंशगत भाव को सहज हिन्दी में व्यक्त करता है और इस्राएल से बाहर के लोगों का संकेत बनाए रखता है।
- source_word: ሞተ፡ ለይሙት
  choice: निश्चय ही मार डाला जाए
  rationale: मूल की emphatic infinitive construction मृत्यु-दण्ड की निश्चितता व्यक्त करती है; हिन्दी में इसे ‘निश्चय ही’ से दर्शाया गया है।
- source_word: ኀፍረተ
  choice: लज्जा का काम
  rationale: ‘लज्जा/अपमान’ के भाव को ऐसी सहज अभिव्यक्ति में रखा गया है जो कृत्य की सामुदायिक निन्दा को दिखाती है।
- source_word: ወለብእሲትሂ
  choice: और जहाँ तक उस स्त्री की बात है
  rationale: यह अगले वाक्य/पद के लिए स्त्री को आगे रखता हुआ खंड है; इसे पिछले दण्ड से जोड़कर यह अर्थ नहीं दिया गया कि उसे भी पत्थरवाह किया जाए।
theological_decisions:
- issue: ‘अन्यजातियों’ की पहचान
  choice: स्रोत का सामूहिक, वंशगत पद बनाए रखा गया
  alternative: किसी विशिष्ट जाति, धर्म या आधुनिक समुदाय का नाम देना
  rationale: मूल केवल ‘जातियों के वंश’ कहता है; किसी बाद की धार्मिक पहचान को पाठ में लाना अनुचित होगा।
- issue: अंतिम स्त्री पर लागू दण्ड
  choice: खंड को अगले पद की ओर खुला रखा गया
  alternative: स्त्री को भी इसी पद में पत्थरवाह या लज्जा के अपराध की भागी घोषित करना
  rationale: गीज़ में ለ उपसर्ग स्त्री को अगले कथन के अग्रस्थ कर्म के रूप में प्रस्तुत करता है; वर्तमान पद अपने आप उसके दण्ड को पूरा नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। विधिक आदेश के लिए ‘न करे’, ‘मार डाला जाए’ और ‘मार डालें’ का प्रयोग हुआ है। अंतिम अल्पविराम जानबूझकर रखा गया है, क्योंकि मूल का विचार अगले पद में जारी रहता है।
