base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/008.yaml
  text: They shall burn her with fire, because she has defiled the name of her father's house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel throughout all the days of the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.
translation:
  language: hi
  text: वे उसे आग में जला दें, क्योंकि उसने अपने पिता के घराने का नाम अशुद्ध किया है; और उसे इस्राएल में से जड़ से उखाड़ दिया जाए। और पृथ्वी की पीढ़ियों के सभी दिनों तक[a] इस्राएल में कोई व्यभिचारी या अशुद्ध व्यक्ति न पाया जाए, क्योंकि इस्राएल यहोवा के लिए पवित्र है। जो कोई उसे अशुद्ध करे, वह निश्चय मार डाला जाए; लोग उसे पत्थरों से मार डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी की सभी पीढ़ियों के दौरान।”
    reason: मुख्य पाठ में स्रोत का ‘दिनों’ वाला कालगत पदबंध रखा गया है; यह अधिक मुहावरेदार वैकल्पिक प्रस्तुति है।
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: वे उसे आग में जला दें
  rationale: क्रिया के स्त्रीलिंग कर्म को स्पष्ट रखते हुए गेइज़ की विधिक/आदेशात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत किया।
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: उसने अपने पिता के घराने का नाम अशुद्ध किया है
  rationale: ‘नाम’ और ‘पिता का घर’ दोनों स्रोत-तत्व सुरक्षित रखे; ‘घराने’ से वंशगत परिवार का अर्थ स्पष्ट होता है।
- source_word: ትሠረው፡ እምእስራኤል
  choice: उसे इस्राएल में से जड़ से मिटा दिया जाए
  rationale: उन्मूलन/जड़ से निकाले जाने की तीव्रता को ‘जड़ से मिटा’ द्वारा व्यक्त किया।
- source_word: ዘማ፡ ወርኵስ
  choice: व्यभिचारी या अशुद्ध व्यक्ति
  rationale: पहला पद यौन अनैतिकता करने वाले और दूसरा अशुद्ध/अपवित्र व्यक्ति को सूचित करता है; दोनों श्रेणियाँ अलग रखी गईं।
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: पृथ्वी की पीढ़ियों के सारे दिनों तक
  rationale: መዋዕለ (‘दिनों’) को छोड़े बिना जुबलीज़ की विशिष्ट कालगत अभिव्यक्ति संरक्षित की।
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: इस्राएल यहोवा के लिए पवित्र है
  rationale: समर्पण/संबंध दर्शाने वाले ‘के लिए’ को रखा और दिव्य नाम को प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ में दिया।
- source_word: ሞተ፡ ለይሙት
  choice: वह निश्चय मार डाला जाए
  rationale: मृत्यु की निश्चितता व्यक्त करने वाली संज्ञेय-क्रियात्मक पुनरुक्ति का स्वाभाविक विधिक हिन्दी समतुल्य।
- source_word: በእብን፡ ይውግርዎ
  choice: लोग उसे पत्थरों से मारें
  rationale: पत्थर मारकर दंड देने का अर्थ स्पष्ट है; बहुवचन/सामुदायिक कर्ता को अनिर्दिष्ट ‘लोग’ से व्यक्त किया।
theological_decisions:
- issue: ‘जो कोई उसे अशुद्ध करे’ में सर्वनाम का संदर्भ
  choice: ‘उसे’ रखकर स्रोत की संदर्भगत अस्पष्टता बनाए रखी
  alternative: ‘इस्राएल को अशुद्ध करे’ या ‘अपने को अशुद्ध करे’
  rationale: गेइज़ अभिव्यक्ति में कर्म स्पष्ट रूप से दोहराया नहीं गया; निकटवर्ती ‘इस्राएल’ संभावित संदर्भ है, पर अनुवाद में उसे निर्णायक रूप से जोड़ना उचित नहीं।
- issue: दिव्य नाम እግዚአብሔር का प्रतिपादन
  choice: यहोवा
  alternative: प्रभु
  rationale: अंग्रेज़ी परामर्श-पाठ में LORD और प्रसंग में इस्राएल की वाचा-संबंधी पवित्रता को देखते हुए हिन्दी बाइबलीय परंपरा का विशिष्ट नाम चुना; इससे कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक-धार्मिक शैली अपनाई गई है। वाक्य साधारण पाठकों के लिए सुबोध रखा गया, जबकि स्रोत की तीव्र दंडात्मक भाषा, कालगत मुहावरा और सर्वनाम-संदर्भ की वास्तविक अस्पष्टता सुरक्षित हैं।
