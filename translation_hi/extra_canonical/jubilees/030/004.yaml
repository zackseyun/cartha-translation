base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/004.yaml
  text: And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all in agony, because they had disgraced Dinah their sister.
translation:
  language: hi
  text: उन्होंने उनसे कपट से बातें कीं, उनके साथ विश्वासघात किया और उन्हें धोखा दिया। तब शिमोन और लेवी अचानक शकेम नगर में घुस गए और शकेम के सभी पुरुषों पर न्याय किया। वहाँ उन्हें जितने भी पुरुष मिले, उन्होंने उन सबको मार डाला और एक को भी जीवित नहीं छोड़ा। उन्होंने उन सबको उस समय मार डाला जब वे पीड़ा में थे,[a] क्योंकि उन्होंने उनकी बहन दीना का अपमान किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘पीड़ा में’। संभवतः यह खतने के बाद की उनकी पीड़ा की ओर संकेत है। कुछ पुराने रूपांतर, उत्पत्ति 34:26 के अनुरूप, यहाँ ‘तलवार की धार से’ देते हैं, पर उपलब्ध गीइज़ पाठ इसका समर्थन नहीं करता।
    reason: गीइज़ पाठ की ‘पीड़ा में’ वाली विशिष्ट व्याख्यात्मक सूचना स्पष्ट करता है और पुराने सामंजस्यकारी रूपांतर से भेद बताता है।
lexical_decisions:
- source_word: በአኩይ
  choice: छल से
  rationale: शाब्दिक अर्थ ‘बुराई में/बुरी रीति से’ है; प्रसंग में कपटपूर्ण बातचीत अभिप्रेत है।
- source_word: ግብተ
  choice: अचानक
  rationale: यह प्रवेश के आकस्मिक या अप्रत्याशित ढंग को व्यक्त करता है।
- source_word: ኵነኔ
  choice: न्याय-दण्ड
  rationale: मूल में न्याय अथवा दण्डादेश का भाव है; केवल ‘बदला’ कहना स्रोत की न्याय-संबंधी भाषा को संकुचित कर देता।
- source_word: በ፵ዐር (पाठगत रूप; በጻዕር)
  choice: जब वे पीड़ा में थे
  rationale: सुधारे गए गीइज़ पाठ का अर्थ ‘पीड़ा/यातना में’ है और प्रसंगतः खतना के बाद पुरुषों की पीड़ित अवस्था की ओर संकेत करता है।
- source_word: ገመፉ
  choice: अपमान किया
  rationale: क्रिया में लज्जित, कलंकित या अनादृत करने का भाव है; दीना के साथ किए गए अपराध के लिए dignified और स्रोत-संगत अभिव्यक्ति।
theological_decisions:
- issue: शिमोन और लेवी की हिंसा का न्याय के रूप में वर्णन
  choice: ‘न्याय-दण्ड लागू किया’ द्वारा मूल की न्याय-संबंधी शब्दावली सुरक्षित रखी गई
  alternative: ‘बदला लिया’ या कथाकार की ओर से उनकी कार्रवाई को स्पष्टतः उचित/अनुचित ठहराना
  rationale: मूल घटना को न्याय-दण्ड की भाषा में प्रस्तुत करता है, पर अनुवाद को उसकी नैतिक वैधता पर अतिरिक्त निर्णय नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गंभीर और सामान्य पाठक के लिए स्पष्ट। ‘जीवित’ अर्थ की सहज स्पष्टता के लिए जोड़ा गया है। शकेम को नगर के रूप में स्पष्ट किया गया है ताकि समान नाम वाले व्यक्ति से भ्रम न हो।
