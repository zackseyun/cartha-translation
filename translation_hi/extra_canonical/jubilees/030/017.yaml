  choice: याजकपद के लिए और लेवियों के रूप में सेवा करने के लिए
  rationale: दोनों ला-युक्त पदों का उद्देश्यगत अर्थ रखा गया है; दूसरे पद को शाब्दिक रूप से दोहराने पर हिन्दी में ऐसा भ्रम हो सकता है कि चुनाव लेवियों की ओर से हुआ था।
- source_word: ይትለአኩ፡ ቅድመ፡ እግዚአብሔር
  choice: प्रभु के सामने ... सेवा करें
  rationale: क्रिया धार्मिक परिचर्या/सेवा को सूचित करती है; ‘के सामने’ मूल स्थानगत अभिव्यक्ति को बनाए रखता है।
- source_word: ቀንአ
  choice: उत्साह दिखाया
  rationale: यहाँ शब्द धार्मिक जोश या उत्साही निष्ठा को व्यक्त करता है, केवल भावनात्मक ईर्ष्या को नहीं।
- source_word: ጽድቀ፡ ወኵነኔ፡ ወበቀለ
  choice: धार्मिकता और न्याय को पूरा करने और ... बदला लेने
  rationale: तीनों न्याय-संबंधी संज्ञाओं का क्रम और तनाव सुरक्षित रखा गया है; अंतिम पद प्रतिशोध/बदले का स्पष्ट अर्थ रखता है।
theological_decisions:
- issue: लेवी के वंश के चुनाव का स्वरूप
  choice: याजकपद और लेवीय सेवा—दोनों भूमिकाओं के लिए चुनाव
  alternative: शाब्दिक रूप से ‘याजकपद के लिए और लेवियों के लिए’
  rationale: मूल की समानांतर रचना भूमिका या उद्देश्य का संकेत देती है, पर उसकी शाब्दिक संरचना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘जैसे हम हर समय करते हैं’ में ‘हम’ की पहचान
  choice: मुख्य पाठ में प्रथम-पुरुष बहुवचन को बिना व्याख्यात्मक विस्तार के बनाए रखा
  alternative: मुख्य पाठ में ‘हम स्वर्गदूत’ जोड़ना
  rationale: वक्ता की स्वर्गदूतीय पहचान पुस्तक के कथात्मक ढाँचे से समझी जाती है; मूल में यहाँ ‘स्वर्गदूत’ शब्द जोड़ना उचित नहीं होगा।
- issue: शकेम की घटना पर लेवी के कार्य का मूल्यांकन
  choice: पाठ के सकारात्मक मूल्यांकन—धार्मिकता, न्याय और बदला—को ज्यों का त्यों रखा
  alternative: नैतिक असुविधा कम करने के लिए प्रतिशोध को नरम करना
  rationale: जुबिलीज़ का अपना धार्मिक तनाव और मूल्यांकन अनसुलझा रहना चाहिए; अनुवाद को उसे आधुनिक नैतिक भाषा से संशोधित नहीं करना चाहिए।
