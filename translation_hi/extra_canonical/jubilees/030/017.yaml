  text: और लेवी का वंश याजकाई और लेवीय सेवा के लिए चुना गया, ताकि वे प्रभु के सामने सेवा करें, जैसे हम हर समय करते हैं[17]। और लेवी तथा उसके पुत्र सदा आशीषित होंगे, क्योंकि वह धार्मिकता और न्याय को कार्यान्वित करने और इस्राएल के विरुद्ध उठ खड़े होनेवालों सब से बदला लेने में उत्साही था।
