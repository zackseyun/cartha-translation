base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/013.yaml
  text: '"We will not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.'
translation:
  language: hi
  text: “हम अपनी बेटी किसी ऐसे पुरुष को नहीं देंगे जिसका खतना न हुआ हो, क्योंकि यह हमारे लिए अपमान की बात है।” और यह इस्राएल के लिए भी अपमान की बात है—उनके लिए जो देते हैं और जो अन्यजातियों की बेटियों में से लेते हैं—क्योंकि यह अशुद्ध है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቍልፈተ
  choice: जिसका खतना न हुआ हो
  rationale: गीज़ पद का शाब्दिक अर्थ ‘जिसके अग्रचर्म हो’ है; आधुनिक हिन्दी में यही स्वाभाविक और स्पष्ट अभिव्यक्ति है।
- source_word: ጽእለት
  choice: अपमान की बात
  rationale: यह शब्द सामाजिक निंदा, लज्जा या तिरस्कार का भाव रखता है; ‘अपमान की बात’ प्रसंग में सहज रहते हुए उस अर्थ को सुरक्षित रखता है।
- source_word: አሕዛብ
  choice: अन्यजातियाँ
  rationale: यहाँ इस्राएल से बाहर के जनसमूह अभिप्रेत हैं; ‘अन्यजातियाँ’ बाइबलीय संदर्भ में संक्षिप्त और परिचित पद है।
- source_word: ርኵስ
  choice: अशुद्ध
  rationale: स्रोत का शब्द धार्मिक/अनुष्ठानिक अशुद्धता का अर्थ दे सकता है; ‘अशुद्ध’ इस आयाम को ‘गंदा’ जैसे सामान्य शब्द से अधिक ठीक रखता है।
theological_decisions:
- issue: पहले वाक्य और उसके बाद की व्याख्या के बीच वक्ता-सीमा
  choice: पहले वाक्य को उद्धरण-चिह्नों में रखा गया
  alternative: पूरे पद को बिना उद्धरण-चिह्न के सतत कथन बनाना
  rationale: पहला वाक्य उत्पत्ति 34:14 से जुड़ा प्रत्यक्ष कथन है, जबकि अगला वाक्य इस्राएल के लिए व्यापक निष्कर्ष देता है; उद्धरण-चिह्न इस वास्तविक बदलाव को स्पष्ट करते हैं।
- issue: ‘जो देते हैं और जो लेते हैं’ का आशय
  choice: लिंग या वैवाहिक भूमिका को अतिरिक्त रूप से स्पष्ट किए बिना मूल की समांतर अभिव्यक्ति रखी गई
  alternative: ‘जो अपनी बेटियाँ देते हैं और जो उनकी बेटियों से विवाह करते हैं’
  rationale: स्रोत संक्षिप्त और कुछ हद तक द्व्यर्थी है; विस्तृत व्याख्या जोड़ने से मूल से अधिक निश्चितता आ जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। प्रत्यक्ष कथन और बाद की विधिक/नैतिक टिप्पणी के बीच उद्धरण-चिह्न से सीमा दिखाई गई है।
