- source_word: ዐርገ
  choice: पहुँचा
  rationale: मूलतः ‘ऊपर गया/चढ़ा’ का भाव है; यहाँ गंतव्य की ओर यात्रा के लिए ‘पहुँचा’ स्वाभाविक हिन्दी है और अनावश्यक भौगोलिक अनुमान से बचता है।
