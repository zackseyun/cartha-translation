    text: आरंभिक वाक्यांश का पाठ और विभाजन कठिन है। गीइज़ पाठ घटना को छठे सप्ताह के पहले वर्ष में रखता प्रतीत होता है और शालेम को शकेम के पूर्व से संबद्ध करता है। कर्ता याकूब है, जो कनान लौट रहा था।
    reason: segmentation_note
