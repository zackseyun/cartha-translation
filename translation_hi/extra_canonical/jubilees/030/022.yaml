  yaml_path: translation/extra_canonical/jubilees/030/022.yaml
  text: and they brought it all to Jacob their father. And he spoke with them about their having destroyed the city, because he feared those who lived in the land, the Canaanites and the Perizzites. And the terror of Yahweh was on all the cities around Shechem, and they did not rise up to pursue the sons of Jacob, because dread had fallen on them.
translation:
  language: hi
  text: और वे यह सब अपने पिता याकूब के पास ले आए। याकूब ने उनसे नगर का विनाश करने[a] के विषय में बात की, क्योंकि वह उस देश के निवासियों—कनानियों और परिज्जियों—से डरता था। तब शकेम के आसपास के सभी नगरों पर याहवे का आतंक छा गया, और वे याकूब के पुत्रों का पीछा करने के लिए नहीं उठे, क्योंकि उन पर दहशत छा गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नगर को मार डालना।”
    reason: मूल गीइज़ में ‘मारना’ क्रिया का कर्म ‘नगर’ है; मुख्य पाठ में इसके मुहावरेदार अर्थ को रखा गया है।
lexical_decisions:
- source_word: ቀተሉ፡ ሀገረ
  choice: नगर का नाश करने
  rationale: मूल गीइज़ में शाब्दिक रूप से ‘नगर को मारना’ है; यह नगर के निवासियों के संहार के लिए प्रयुक्त मुहावरेदार अभिव्यक्ति है। हिंदी में ‘नगर का नाश करना’ अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ግርማ፡ እግዚአብሔር
  choice: याहवे का आतंक
  rationale: ግርማ यहाँ आसपास के नगरों पर पड़े भयकारी आतंक को दर्शाता है। እግዚአብሔር को संदर्भ और परामर्श-पाठ के अनुरूप व्यक्तिगत ईश्वरीय नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: ድንጋፄ
  choice: दहशत
  rationale: यह तीव्र भय को व्यक्त करता है; ‘दहशत’ पहले खंड के ‘आतंक’ से निकट अर्थ-संबंध बनाए रखते हुए परिणामस्वरूप पड़े भय को स्वाभाविक हिंदी में बताता है।
- source_word: ሰሰዲደ
  choice: पीछा करने
  rationale: क्रिया का आशय खदेड़ने या पीछा करने के लिए निकलना है; प्रसंग में ‘पीछा करना’ सबसे स्पष्ट और सहज है।
theological_decisions:
- issue: ईश्वरीय नाम का निरूपण
  choice: याहवे
  alternative: प्रभु
  rationale: स्रोत का እግዚአብሔር सामान्यतः ‘प्रभु’ भी अनूदित हो सकता है, पर इस कथात्मक वाक्य में परामर्श-पाठ ने इसे वाचा-संबंधी व्यक्तिगत नाम के रूप में पहचाना है। ‘याहवे’ उस पहचान को संप्रदायगत विस्तार के बिना स्पष्ट रखता है।
- issue: शकेम के विनाश का वर्णन
  choice: नगर का नाश करने
  alternative: नगर को मार डालने
  rationale: मूल की कठोर रूपकात्मक भाषा को पूरी तरह मिटाया नहीं गया; मुख्य पाठ में स्वाभाविक हिंदी रखी गई और शाब्दिक तनाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘आतंक’ और ‘दहशत’ मूल के दो भय-सूचक पदों का अंतर बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
