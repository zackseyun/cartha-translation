  text: And it is abominable for Israel. And Israel will not be cleansed from this uncleanness, who has a wife from the daughters of the nations,
translation:
  language: hi
  text: और यह इस्राएल के लिए घृणित है। और इस्राएल इस अशुद्धता से शुद्ध नहीं होगा, यदि किसी की पत्नी अन्यजातियों की बेटियों में से हो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምኑን (mənun)
  choice: घृणित
  rationale: यह शब्द किसी धार्मिक-सामुदायिक दृष्टि से अत्यंत आपत्तिजनक या घिनौनी बात को व्यक्त करता है; ‘घृणित’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ርኵስ (rəkus)
  choice: अशुद्धता
  rationale: प्रसंग में यह केवल शारीरिक गंदगी नहीं, बल्कि धार्मिक और नैतिक अपवित्रता का संकेत देता है; इसलिए ‘अशुद्धता’ उपयुक्त है।
- source_word: ዘቦ፡ ብእሲት (za-bo bəʾəsit)
  choice: जिस व्यक्ति की पत्नी … हो
  rationale: सापेक्ष पद और अधिकारसूचक अभिव्यक्ति का मूल अर्थ ‘जिसके पास/जिसकी पत्नी है’ है। हिन्दी में यह रूप स्वाभाविक है और वैवाहिक संबंध को स्पष्ट रखता है।
- source_word: እም (ʾəm)
  choice: में से
  rationale: 'यह उद्गम अथवा समूह में से संबंध को व्यक्त करता है: पत्नी अन्यजातियों की बेटियों में से है।'
theological_decisions:
- issue: व्यक्ति के विदेशी पत्नी रखने और सामूहिक इस्राएल की अशुद्धता के बीच संबंध
  choice: व्यक्ति को ‘जिस व्यक्ति की पत्नी…हो’ और परिणाम को ‘उसके कारण इस्राएल…शुद्ध नहीं होगा’ के रूप में व्यक्त किया गया है।
  alternative: ‘इस्राएल…जिसकी पत्नी अन्यजातियों की बेटियों में से हो’ या ‘यदि कोई स्त्री हो’
  rationale: गीज़ वाक्यांश में पत्नी रखने का संबंध उपस्थित है, पर वाक्य-संरचना संक्षिप्त और कुछ हद तक अस्पष्ट है। चुना हुआ रूप व्यक्ति और सामूहिक इस्राएल के बीच निहित संबंध को पठनीय बनाता है, बिना किसी संप्रदायगत निष्कर्ष को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध रूप अपनाया गया है। पद उपलब्ध स्रोत में अधूरा समाप्त होता है, इसलिए अंत में अल्पविराम रखा गया है ताकि अगले अंश से उसका संबंध बना रहे।
