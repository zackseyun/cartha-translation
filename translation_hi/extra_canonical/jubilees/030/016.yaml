  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। आज्ञा और उद्धृत गवाही की संरचना सुरक्षित रखी गई है; स्रोत की नैतिक-धार्मिक असहजता को व्याख्यात्मक रूप से नहीं दबाया गया।
