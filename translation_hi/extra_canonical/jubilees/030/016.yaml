  rationale: स्रोत की गणना/मान्यता और धार्मिकता की भाषा को उसकी असहज धार्मिक धार सहित बनाए रखता है।
- source_word: ተጽሕፎሙ፡ ለጽድቅ
  choice: उनके पक्ष में धार्मिकता के रूप में लिख दिया गया
  rationale: ሎሙ के हित अथवा पक्ष-सूचक अर्थ को व्यक्त करता है और इसे उन्हें संबोधित किसी लिखित संदेश के रूप में पढ़े जाने से बचाता है।
theological_decisions:
- issue: शकेमवासियों की हत्या को धार्मिकता माना जाना
  choice: कथन को बिना नरम किए सीधे रखा गया
  alternative: इसे केवल दंड के न्यायसंगत होने के अर्थ में व्याख्यायित करना
  rationale: स्रोत स्वयं इस कार्य को धार्मिकता माने और लिखे जाने की बात करता है; अनुवाद में इस तनाव को किसी व्याख्यात्मक सिद्धांत से हल नहीं किया गया।
