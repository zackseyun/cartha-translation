base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/016.yaml
  text: 'Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment[16], and it was reckoned to them as righteousness, and it was written for them for righteousness.'''
translation:
  language: hi
  text: 'इसलिए मैंने तुम्हें यह आज्ञा दी है, “इस्राएल को यह गवाही सुनाओ: देखो, शकेमवासियों और उनके पुत्रों का क्या हुआ—वे किस प्रकार याकूब के दोनों पुत्रों के हाथ में कर दिए गए, और उन्होंने उन्हें यातना देकर मार डाला[a]। यह उनके लिए धार्मिकता मानी गई, और उनके लिए धार्मिकता के रूप में लिखा गया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यातना देकर” एक कठिन वाक्यांश का अनुवाद है। इसका अर्थ “कष्ट के साथ” या “व्यथा पहुँचाते हुए” भी हो सकता है; कुछ पाठ-परंपराओं में “तलवार से” का अर्थ संभव है। व्यापक आशय यह है कि उन्हें हिंसापूर्वक मार डाला गया।
    reason: lexical_alternative
