base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/018.yaml
  text: And so they inscribe for him on the heavenly tablets blessing and righteousness before the God of all.
translation:
  language: hi
  text: और इस प्रकार वे उसके पक्ष में गवाही के रूप में स्वर्गीय पट्टिकाओं पर आशीष और धार्मिकता अंकित करते हैं—सबके परमेश्वर के सामने।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዐርጉ
  choice: अंकित करते हैं
  rationale: क्रिया का आशय किसी अभिलेख को ऊपर चढ़ाने/दर्ज करने से है; स्वर्गीय पट्टिकाओं के संदर्भ में ‘अंकित करते हैं’ स्वाभाविक और सटीक है।
- source_word: ሎቱ፡ በስምዐ
  choice: उसके पक्ष में गवाही के रूप में
  rationale: ሎቱ लाभार्थक अर्थ देता है और በስምዐ गवाही/साक्ष्य का भाव रखता है; दोनों को साथ रखकर मूल का न्यायिक-अभिलेखीय स्वर सुरक्षित रहता है।
- source_word: ጽላተ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं
  rationale: यह जुबलीज़ की विशिष्ट ‘heavenly tablets’ संकल्पना का सीधा और सुबोध हिन्दी रूप है।
- source_word: በረከተ፡ ወጽድቀ
  choice: आशीष और धार्मिकता
  rationale: दोनों संज्ञाओं के धार्मिक और अभिलेखीय अर्थ को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: አምላከ፡ ኵሉ
  choice: सबके परमेश्वर
  rationale: मूल के ‘God of all’ को संक्षिप्त और औपचारिक रूप में व्यक्त करता है; ‘सब वस्तुओं’ जैसा अनावश्यक स्पष्टीकरण नहीं जोड़ता।
theological_decisions:
- issue: स्वर्गीय लेखे में धार्मिकता का अंकन
  choice: ‘धार्मिकता अंकित करते हैं’
  alternative: ‘उसे धर्मी ठहराते हैं’
  rationale: मूल पाठ पट्टिकाओं पर धार्मिकता दर्ज किए जाने की बात करता है; इसे न्यायशास्त्रीय ‘धर्मी ठहराने’ में बदलना पाठ से अधिक विशिष्ट धार्मिक निष्कर्ष जोड़ देता।
- issue: दिव्य उपाधि का दायरा
  choice: ‘सबके परमेश्वर’
  alternative: ‘सर्वेश्वर’
  rationale: ‘सबके परमेश्वर’ मूल संरचना और उसके व्यापक दायरे को पारदर्शी रखता है, जबकि ‘सर्वेश्वर’ अधिक संस्कृतनिष्ठ और संभावित रूप से व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और शास्त्रीय अभिलेखीय स्वर रखा गया है। ‘गवाही के रूप में’ गीइज़ पाठ में उपस्थित तत्व को सुरक्षित रखता है, जो अंग्रेज़ी परामर्श-पाठ में संक्षिप्त हो गया है।
