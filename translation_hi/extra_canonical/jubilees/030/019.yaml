base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/019.yaml
  text: 'And for this reason they inscribe for him a testimony of favor[a] on the heavenly tablets: blessing and righteousness before the God of all.'
translation:
  language: hi
  text: और इसी कारण वे उसके लिए स्वर्गीय पट्टिकाओं पर कृपा की गवाही[a] अंकित करते हैं—सबके परमेश्वर के सामने आशीष और धार्मिकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़: ስምዐ ፡ ሞገስ (semʿa mogas), अर्थात दैवी कृपा या स्वीकृति का औपचारिक अभिलेख।'
    reason: lexical_choice
lexical_decisions:
- source_word: ይጽሕፉ
  choice: वे ... अंकित करते हैं
  rationale: स्रोत के सक्रिय बहुवचन को बनाए रखता है; कर्ता संभवतः लेखा रखने वाले स्वर्गीय प्राणी हैं, पर स्रोत उन्हें स्पष्ट नहीं करता।
- source_word: ስምዐ ፡ ሞገስ
  choice: कृपा की गवाही
  rationale: औपचारिक रूप से दर्ज दैवी अनुग्रह या स्वीकृति का भाव व्यक्त करता है और संज्ञा-समूह की संक्षिप्तता बनाए रखता है।
- source_word: በጽላተ ፡ ሰማይ
  choice: स्वर्गीय पट्टिकाओं पर
  rationale: यूबिलीज़ की स्थिर पारिभाषिक अभिव्यक्ति के अनुरूप प्राकृतिक हिन्दी रूप।
- source_word: በረከተ ፡ ወጽድቀ
  choice: आशीष और धार्मिकता
  rationale: दोनों समन्वित संज्ञाओं को अलग रखते हुए उनके धार्मिक अर्थ और स्रोत की संरचना को सुरक्षित करता है।
- source_word: ቅድመ ፡ አምላከ ፡ ኵሉ
  choice: सबके परमेश्वर के सामने
  rationale: ‘के सामने’ दैवी उपस्थिति और अनुमोदन के न्यायिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘सबके परमेश्वर’ मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: बहुवचन ‘वे’ की पहचान
  choice: कर्ता को केवल ‘वे’ रहने दिया गया
  alternative: ‘स्वर्गदूत’ या कर्मवाच्य ‘अंकित किया जाता है’
  rationale: गीज़ पाठ सक्रिय बहुवचन देता है, लेकिन इस पद में कर्ताओं की पहचान नहीं करता; ‘स्वर्गदूत’ जोड़ना व्याख्यात्मक होता।
- issue: ሞገስ का धार्मिक अर्थ
  choice: कृपा
  alternative: अनुग्रह / स्वीकृति
  rationale: ‘कृपा’ दैवी प्रसन्नता और अनुग्रह दोनों को सहज हिन्दी में समेटती है, जबकि पादटिप्पणी औपचारिक दैवी अनुमोदन का आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘अंकित करते हैं’ स्वर्गीय अभिलेख के प्रसंग के अनुकूल है। पद को केवल उपलब्ध गीज़ पाठ तक सीमित रखा गया है; निकटवर्ती पदों की सामग्री नहीं जोड़ी गई।
