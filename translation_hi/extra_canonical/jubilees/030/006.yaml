  yaml_path: translation/extra_canonical/jubilees/030/006.yaml
  text: because they had committed shame in Israel. And the LORD delivered them into the hand of Jacob's sons so that they might destroy them with the sword and do this to them, and so that it might not be done again,
translation:
  language: hi
  text: क्योंकि उन्होंने इस्राएल में लज्जा का काम किया था। तब यहोवा ने उन्हें याकूब के पुत्रों के हाथ में सौंप दिया, ताकि वे तलवार से उनका नाश कर दें[a] और उनके साथ यह करें, और ताकि ऐसा फिर न हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें मार डालें’।
    reason: मूल क्रिया में नष्ट करने या उन्मूलन का प्रबल भाव है; संदर्भ में इसे मार डालने के अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: ገብሩ፡ ኀፍረተ፡
  choice: लज्जा का काम किया
  rationale: शाब्दिक अर्थ ‘लज्जा की’ के बजाय यह स्वाभाविक हिन्दी में उस निंदनीय कृत्य को व्यक्त करता है, बिना प्रसंग से अतिरिक्त विवरण जोड़े।
- source_word: መጠዎሙ፡ እግዚአብሔር፡ ውስተ፡ እዴ
  choice: यहोवा ने उन्हें ... के हाथ में कर दिया
  rationale: सामियों की प्रचलित अभिव्यक्ति ‘हाथ में देना’ को अर्थपूर्ण और बाइबलीय हिन्दी में सुरक्षित रखा गया है।
- source_word: ይሠርውዎሙ፡
  choice: उन्हें ... मिटा दें
  rationale: ግዕዝ क्रिया ሠረወ उखाड़ने, समूल हटाने या नष्ट करने का प्रबल भाव रखती है; ‘मिटा दें’ केवल ‘मार डालें’ से अधिक व्यापक विनाश का संकेत देता है।
- source_word: በሰይፍ፡
  choice: तलवार से
  rationale: स्रोत के साधनवाचक पद का सीधा और स्वाभाविक अनुवाद।
- source_word: ኢይኩን፡
  choice: ऐसा फिर न हो
  rationale: उपलब्ध स्रोत इसी अधूरे निषेधात्मक खंड पर समाप्त होता है; अनुवाद ने प्रसंग से कोई अनुपस्थित पूरक वाक्यांश नहीं जोड़ा।
theological_decisions:
- issue: विनाशकारी कार्रवाई में प्रभु की भूमिका
  choice: यहोवा ने उन्हें याकूब के पुत्रों के हाथ में कर दिया
  alternative: वे याकूब के पुत्रों के हाथ में पड़ गए
  rationale: स्रोत स्पष्ट रूप से परमेश्वर को कर्ता बताता है; निष्क्रिय रूप अपनाकर इस कठिन धार्मिक तनाव को नरम नहीं किया गया।
- issue: याकूब के पुत्रों की कार्रवाई का स्वरूप
  choice: ताकि वे उन्हें तलवार से मिटा दें
  alternative: ताकि वे तलवार से उनका न्याय करें
  rationale: स्रोत की क्रिया विनाश या उन्मूलन व्यक्त करती है, न्याय करने का वैधानिक अर्थ नहीं; इसलिए व्याख्यात्मक धार्मिक भाषा से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘लज्जा का काम’ और ‘हाथ में कर दिया’ बाइबलीय भाव बनाए रखते हुए स्वाभाविक हैं। स्रोत-पाठ वाक्य के बीच में समाप्त होता है, इसलिए अन्त में अल्पविराम रखा गया है और आगे का प्रसंग नहीं जोड़ा गया।
