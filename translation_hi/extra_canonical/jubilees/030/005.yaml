  yaml_path: translation/extra_canonical/jubilees/030/005.yaml
  text: And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem be destroyed by the sword,
translation:
  language: hi
  text: उनकी बहन दीना। और इस प्रकार, अब से इस्राएल की किसी बेटी को अपवित्र करने के लिए ऐसा नहीं किया जाना चाहिए, क्योंकि स्वर्ग में उनके विरुद्ध यह ठहराया गया है कि शकेम के सभी पुरुष तलवार से नष्ट कर दिए जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአርኵሶ
  choice: अपवित्र किया जाए
  rationale: मूल क्रिया में अशुद्ध या अपवित्र करने का भाव है; प्रसंग में यह दीना के साथ किए गए यौन अत्याचार की ओर संकेत करता है, पर मूल की संयत अभिव्यक्ति को बनाए रखा गया है।
- source_word: ተሠርዐ
  choice: ठहराया गया था
  rationale: यह स्वर्ग में निर्धारित या विधिवत् नियत किए जाने का भाव व्यक्त करता है और दैवी निर्णय की गंभीरता बनाए रखता है।
- source_word: ዐደወ፡ ሴቄማ
  choice: शकेम के सभी पुरुष
  rationale: वाक्यांश शकेम के पुरुषों/निवासियों को सूचित करता है; प्रसंग और परामर्श-पाठ के अनुरूप ‘पुरुष’ चुना गया है।
theological_decisions:
- issue: स्वर्गीय निर्णय और मानवीय विनाश के बीच संबंध
  choice: निष्क्रिय रूप में ‘ठहराया गया था’ और ‘नष्ट कर दिए जाएँ’
  alternative: इसे सीधे परमेश्वर की आज्ञा या अनुमोदन के रूप में व्यक्त करना
  rationale: मूल पाठ ‘स्वर्ग में’ हुए निर्धारण की बात करता है, पर कर्ता का स्पष्ट नाम नहीं लेता; इसलिए कर्ता और निर्णय के स्वरूप को मूल की सीमा से आगे स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सहज रखी गई है। आरंभिक ‘उनकी बहन दीना’ मूल स्रोत में उपस्थित एक खंडित पदांश है, संभवतः पिछले वाक्य से जुड़ा हुआ; स्रोत-साक्ष्य के प्रति निष्ठा रखते हुए उसे हटाया या कृत्रिम रूप से पूर्ण नहीं किया गया।
