  yaml_path: translation/extra_canonical/tripartite_tractate/005.yaml
  text: 'The Father brought forth the All like a small child, like a drop from a spring, like a blossom from [a vine], like [a flower], like a <planting> [. . .], so that it needed to obtain [nourishment] and growth and perfection. He held it back for a season. The one who conceived of it from the first instant of the beginning possessed and beheld it from the first instant of the beginning, but he <concealed> it for those who were the first to originate from him. Not from envy, but that the aeons could not receive their perfection (prematurely) from the first instant of the beginning and could not lift up themselves to the glory (that belongs solely to) the Father, and could not suppose that they possess all this from themselves. Instead, just as he willed to allow them to be able to come into being, so that they could also come into being as perfect entities, at the time of his choosing he granted them the perfect idea of generosity toward them.


    The one he raised up to be a light to those who originated from himself, the one from whom they derive their name, he is the full, complete and perfect Son. He produced him mixed with what emerged out of him, [] [. . .] sharing in the glory [. . .] the Totality, congruent with [. . .], by means of which each is [able] to receive it to [himself], although each did not have this greatness before they were received by it. They, instead, exist only partially in his proper mode and form and greatness. [They] are able to see him and speak of [what they] know about him, because they wear each other, because they are able to grasp [him]. By contrast, [his] mode of being is without comparison, so that the Father could receive honor from each one and could reveal himself, despite his incomparability. Concealed and unseen, they wonder at him in mind. The greatness of his exaltedness is consequently manifested when they speak of him and behold him, hymning him for the riches of his sweetness.'
translation:
  language: hi
  text: 'पिता ने समग्रता[a] को ऐसे उत्पन्न किया जैसे कोई छोटा बच्चा, जैसे किसी सोते से निकली बूँद, जैसे [दाखलता] की कली, जैसे [फूल], जैसे कोई <रोपण> [. . .], इसलिए उसे [पोषण], वृद्धि और पूर्णता पाने की आवश्यकता थी। उसने उसे कुछ समय तक रोके रखा। जिसने आरम्भ के प्रथम क्षण से ही उसकी परिकल्पना की थी, वह आरम्भ के प्रथम क्षण से ही उसे अपने अधिकार में रखता और देखता था; पर जो उससे सबसे पहले उत्पन्न हुए थे, उनसे उसने उसे <छिपाए> रखा। यह ईर्ष्या के कारण नहीं था, बल्कि इसलिए कि युग[b] आरम्भ के प्रथम क्षण में ही अपनी पूर्णता (समय से पहले) न पा लें, स्वयं को उस महिमा तक न उठा लें (जो केवल पिता की है), और यह न मान बैठें कि यह सब उनके पास अपने ही कारण है। इसके बजाय, जिस प्रकार उसने चाहा कि वे अस्तित्व में आने योग्य हों, ताकि वे पूर्ण सत्ताओं के रूप में भी अस्तित्व में आ सकें, उसी प्रकार अपने चुने हुए समय पर उसने उन्हें उनके प्रति अपनी उदारता का पूर्ण विचार प्रदान किया।


    जिसे उसने अपने से उत्पन्न हुओं के लिए ज्योति होने को उठाया—जिससे वे अपना नाम पाते हैं—वही परिपूर्ण, संपूर्ण और सिद्ध पुत्र है। उसने उसे उस चीज़ के साथ मिला हुआ उत्पन्न किया जो उससे निकली थी, [] [. . .] महिमा में सहभागी [. . .] समग्रता, [. . .] के अनुरूप, जिसके द्वारा प्रत्येक उसे [अपने भीतर] ग्रहण [कर सकता] है; यद्यपि उसके द्वारा ग्रहण किए जाने से पहले उनमें से किसी के पास यह महानता नहीं थी। इसके बजाय, वे उसके अपने स्वरूप, रूप और महानता में केवल आंशिक रूप से विद्यमान हैं। [वे] उसे देख सकते हैं और उसके विषय में [जो वे] जानते हैं, उसे कह सकते हैं, क्योंकि वे एक-दूसरे को धारण किए हुए हैं, क्योंकि वे [उसे] ग्रहण कर सकते हैं। इसके विपरीत, [उसके] अस्तित्व का ढंग अतुलनीय है, ताकि पिता प्रत्येक से आदर पा सके और अपनी अतुलनीयता के बावजूद स्वयं को प्रकट कर सके। छिपा और अदृश्य रहते हुए भी, वे मन में उस पर विस्मित होते हैं। इसलिए उसकी उच्चता की महानता तब प्रकट होती है, जब वे उसके विषय में कहते और उसे देखते हुए उसकी मधुरता के वैभव के लिए स्तुति-गान करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “समग्रता” उस समस्त दिव्य पूर्ण समूह या सर्वसमष्टि के लिए प्रयुक्त तकनीकी पद हो सकता है जिसे इस ग्रंथ में “The All/Totality” कहा गया है।
    reason: सामान्य हिन्दी अर्थ और ग्रंथ के संभावित तकनीकी अर्थ में भेद स्पष्ट करना।
  - marker: b
    text: यहाँ “युग” (aeons) केवल समय-खंड नहीं, बल्कि इस ग्रंथ की अधिभौतिक सत्ताओं या दिव्य प्रसरणों के लिए प्रयुक्त नाम हो सकता है।
    reason: तकनीकी ज्ञानवादी शब्द के अर्थ को बिना पंथगत विस्तार के संकेत करना।
lexical_decisions:
- source_word: the All / the Totality
  choice: समग्रता
  rationale: यह दार्शनिक-धर्मवैचारिक सामूहिक सत्ता का संकेत देता है; ‘सब कुछ’ की तुलना में संज्ञात्मक और सुसंगत है। दोनों अंग्रेज़ी पद संभवतः संबंधित तकनीकी अवधारणा दर्शाते हैं, इसलिए एकरूपता रखी गई।
- source_word: aeons
  choice: युग
  rationale: आम हिन्दी में समझ आने वाला निकटतम रूप है, पर यहाँ यह केवल कालखंड नहीं बल्कि दिव्य/अधिभौतिक सत्ताओं का तकनीकी नाम हो सकता है; इसलिए पादटिप्पणी दी गई।
- source_word: produced / brought forth
  choice: उत्पन्न किया
  rationale: उत्पत्ति को व्यक्त करता है, पर सृष्टि की कोई विशिष्ट सिद्धान्तगत व्याख्या आरोपित नहीं करता।
- source_word: perfection / perfect
  choice: पूर्णता / पूर्ण / सिद्ध
  rationale: संदर्भानुसार अवस्था के लिए ‘पूर्णता’, समग्रता के लिए ‘संपूर्ण/परिपूर्ण’, और परिपक्व सिद्धता के लिए ‘सिद्ध’ रखा गया, जिससे मूल की पुनरुक्ति का अर्थपूर्ण बल बना रहे।
- source_word: mode of being
  choice: अस्तित्व का ढंग
  rationale: दार्शनिक अर्थ को आधुनिक और सुबोध हिन्दी में रखता है, बिना बाद की तकनीकी शब्दावली थोपे।
- source_word: wear each other
  choice: एक-दूसरे को धारण किए हुए हैं
  rationale: शाब्दिक चित्र की असामान्यता बचाते हुए हिन्दी में अर्थगम्य अभिव्यक्ति दी गई; इसे ‘एक-दूसरे में निवास’ कहकर अस्पष्टता नहीं सुलझाई गई।
- source_word: sweetness
  choice: मधुरता
  rationale: गुणात्मक और भक्तिपरक दोनों अर्थों को खुला रखता है।
theological_decisions:
- issue: पिता द्वारा समग्रता को रोकना और छिपाना
  choice: ईर्ष्या के निषेध और समयपूर्व पूर्णता की रोक—दोनों को स्पष्ट रखा गया
  alternative: इसे दंड, परीक्षा या पूर्वनियति के रूप में व्याख्यायित करना
  rationale: साक्ष्य केवल ईर्ष्या का निषेध करता और नियत समय पर पूर्णता देने की बात कहता है; अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
- issue: पुत्र का पिता से तथा उससे निकली वस्तु से संबंध
  choice: ‘उस चीज़ के साथ मिला हुआ उत्पन्न किया जो उससे निकली थी’
  alternative: त्रिएकता, उत्सर्जन या सृष्टि के किसी निश्चित पंथगत सूत्र में ढालना
  rationale: खंडित पाठ और वाक्य की अस्पष्टता को सुरक्षित रखा गया है।
- issue: युगों की पूर्णता और महिमा
  choice: महिमा को केवल पिता की बताते हुए युगों के समयपूर्व आत्म-उत्थान की संभावना रखी गई
  alternative: युगों को स्वतः पापी या विद्रोही घोषित करना
  rationale: मूल में संभावित अनुचित दावा है, पर नैतिक पतन का विस्तृत सिद्धान्त नहीं।
- issue: ‘वे एक-दूसरे को पहनते हैं’ रूपक
  choice: ‘एक-दूसरे को धारण किए हुए हैं’
  alternative: परस्पर अन्तर्वास या एकसत्ता के रूप में निर्णायक व्याख्या
  rationale: रूपक का धर्मवैचारिक तनाव और अस्पष्टता बचाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, किंतु सामान्य पाठक के लिए यथासंभव सुबोध शैली रखी गई है। स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है। वर्ग कोष्ठक, रिक्त कोष्ठक, दीर्घविराम और कोणीय कोष्ठक पांडुलिपीय/संपादकीय संकेतों के रूप में यथावत रखे गए हैं। खंडित दूसरे अनुच्छेद में वाक्य-संबंधों को जानबूझकर निर्णायक ढंग से नहीं सुधारा गया।
