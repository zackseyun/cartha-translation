  revised_text: '## बुलाए हुओं के विषय में और अधिक


    चुने हुओं के विषय में और भी बहुत कुछ कहा जा सकता है, […] और उस पर बोलना उचित भी होता; फिर भी हमें बुलाए हुओं के विषय में—जिन्हें “दाहिनी ओर के लोग” कहा जाता है—और अधिक <बोलना> चाहिए, क्योंकि उन्हें भूल जाना लाभदायक न होगा। हम पहले उनके विषय में विस्तार से ऐसे बोल चुके हैं, मानो उतना पर्याप्त था। फिर हमने उनके विषय में केवल आंशिक रूप से ही क्यों कहा?


    मैंने कहा था कि वे सभी जो वचन[a] से उत्पन्न हुए—चाहे दुष्टों पर किए गए न्याय से, या उनके विरुद्ध लड़ने वाले क्रोध से, या उनसे फिरकर ऊँचे जनों की ओर लौटने से, या पूर्व-अस्तित्व रखने वालों की प्रार्थना और स्मरण से, या इस आशा और विश्वास से कि अच्छे कामों के द्वारा उनका उद्धार [प्राप्त किया जा सकता है]—वे सभी योग्य ठहराए गए हैं। इसका कारण यह है कि वे अच्छी प्रवृत्तियों से निकले हैं और उनके जन्म का कारण उस अस्तित्वमान की ओर से आया एक विचार है।


    मैंने यह भी कहा था कि वचन के अदृश्य रीति से स्वेच्छा से उनके साथ जुड़ने से पहले ही परम-उच्च ने उन्हें वह पहले बताया हुआ विचार प्रदान किया था, क्योंकि उन्होंने [उस पर ध्यान दिया]। […] वही विचार उनके अस्तित्व का कारण बना। जब <उनका> उद्धार हुआ, तब उन्होंने घमंड में अपने आपको ऐसा ऊँचा नहीं उठाया, मानो उनसे पहले कुछ भी अस्तित्व में न था। इसके बजाय उन्होंने स्वीकार किया कि उनके अस्तित्व का एक उद्गम है और वे उसे जानना चाहते हैं जो उनसे पहले अस्तित्व में था।


    मैंने यह भी कहा था कि जब बिजली-सी चमक के रूप में प्रकाश प्रकट हुआ, तब उन्होंने दंडवत किया और गवाही दी कि वह उनके उद्धार के लिए प्रकट हुआ था।


    मैंने कहा था कि केवल वचन से उत्पन्न हुए लोग ही भलाई प्राप्त नहीं करेंगे, बल्कि वे भी, जिन्हें इन लोगों ने अच्छी प्रवृत्तियों के अनुसार उत्पन्न किया, वरदान की प्रचुरता के कारण विश्राम का आनंद पाएँगे। यहाँ तक कि वे लोग भी, जो प्रभुत्व की लालसा से उत्पन्न हुए और जिनमें प्रभुत्व की लालसा का बीज है, अच्छे कामों का प्रतिफल पाएँगे—यदि उन्होंने अच्छी प्रवृत्ति वालों के साथ सहयोग किया हो और यदि वे जान-बूझकर मिट जाने वाली महिमा के खोखले प्रेम को छोड़ना चाहें, ताकि महिमा के प्रभु […] की आज्ञा मानें। तब वे थोड़े समय के तुच्छ सम्मान के बदले अनन्त राज्य के उत्तराधिकारी होंगे।


    हमें अपनी पिछली चर्चा पर फिर लौटना आवश्यक था। पर अब एक सुसंगत तर्क प्रस्तुत करने के लिए हमें कारणों, परिणामों और उस <प्रमाण> को आपस में जोड़ना होगा जो यह दिखाता है कि दाहिनी ओर के लोग—चाहे वे अमिश्रित हों या मिश्रित—उद्धार और विश्राम का वरदान पा सकते हैं या नहीं। इसलिए हमें विश्वास के उनके स्वरूप के आधार पर एक विश्वासयोग्य विवेचन में इसे प्रमाणित करना होगा।


    यदि हम मसीह में राज्य को स्वीकार करते हैं, तो हम रूपों, असमानता और परिवर्तन की सारी विविधता को मिटा देते हैं। क्योंकि अन्त फिर से एकता को प्राप्त करेगा, जैसे आरम्भ में एकता थी—वह स्थान जहाँ न नर है न नारी, न दास न स्वतंत्र, न खतना न खतनारहित, न स्वर्गदूत न मनुष्य, बल्कि मसीह ही सब में सब है। जो आरम्भ में अस्तित्व में नहीं था, वह अस्तित्व में कैसे पाया जा सकता है? और जो दास नहीं था, उसका स्वरूप क्या है, जब वह […] किसी स्वतंत्र व्यक्ति के साथ स्थान पाएगा? वे प्रत्यक्ष दर्शन भी पाएँगे; उन्हें केवल किसी वाणी के छोटे-से कथन के आधार पर यह विश्वास करने की आवश्यकता न होगी कि बातें ऐसी ही हैं।


    ऐसा इसलिए है कि जो कभी था उसकी पुनःस्थापना एकता है। यदि उद्धार की योजना के कारण कुछ लोगों को ऊँचा किया जाता है—उन्हें अस्तित्वमान वस्तुओं के कारणों पर नियुक्त किया जाता है, वे अनेक प्राकृतिक शक्तियों को सक्रिय करते और उनमें आनंद लेते हैं—तो चाहे वे स्वर्गदूत हों या मनुष्य, वे राज्य, दृढ़ता और उद्धार को प्राप्त करेंगे।


    इसके कारण ये हैं: जो देह में प्रकट हुए, उन्होंने अटल विश्वास किया कि वह उस अज्ञात परमेश्वर का पुत्र है जो प्राचीन काल से अकथनीय है और जिसे कोई देख नहीं सका। उन्होंने अपने उन देवताओं को त्याग दिया, जिनके आगे वे पहले दंडवत करते थे, और आकाश तथा पृथ्वी के प्रभुओं को भी। उसके ऊपर उठा लिए जाने से पहले ही, जब वह अभी बालक था, उन्होंने गवाही दी कि वह पहले से प्रचार कर रहा था। और जब वह कब्र में [एक] मृत मनुष्य के रूप में था, तब स्वर्गदूतों ने विश्वास किया कि वह जीवित है; [उन्होंने जीवन भी पाया] […] उस व्यक्ति से जो मर गया था।


    मंदिरों में की गई उनकी अनेक पवित्र सेवाएँ और अद्भुत कार्य अब दूसरे, अर्थात मसीह, की भक्ति में बदल गए। मसीह के उनके अंगीकार ने उन्हें ऐसा करने की सामर्थ्य दी, क्योंकि वे शीघ्रता से उसके निकट आए। उन्हें वह (मूर्तिपूजक) तैयारी केवल इसलिए मिली थी कि बाद में वे उसे त्यागकर उस जन को अपना लें, जिसका इस निचले स्थान, अर्थात संसार में, <सम्मान नहीं किया गया> था। उन देवताओं को त्यागने पर [उन्होंने] मसीह को [प्राप्त किया]। उन्होंने जाना कि वह उस [ऊँचे] स्थान से आया था [जहाँ से] वे भी उसके साथ आए थे—ईश्वरीय शासन का स्थान। जिन नामों का वे आदर करते, जिनकी देखभाल और सेवा करते थे, वे नाम उन्हें उधार मिले थे; अब उन्होंने वे नाम उस जन को दे दिए, जिस पर वे वास्तव में लागू होते हैं।


    फिर भी, उसके ऊपर उठा लिए जाने के बाद ही उन्होंने पहचाना कि वही उनका प्रभु है और उसके ऊपर कोई प्रभु नहीं। उन्होंने अपने राज्य उसे सौंप दिए; वे [अपने] सिंहासनों से उठ गए और अपने मुकुट समर्पित कर दिए। फिर भी उसने अपने आपको उन कारणों से उन पर प्रकट किया जिनकी चर्चा हम पहले कर चुके हैं—उनके चंगे होने और […] के विषय में अच्छे विचार की ओर उनके [फिरने] के लिए, […] सहचर और स्वर्गदूत […], और उस भलाई की प्रचुरता के कारण जो उन्होंने उसके लिए की थी। इसलिए उन्हें ऐसी सेवाएँ सौंपी गईं जो चुने हुओं को लाभ पहुँचाती हैं: उनके अधर्म को स्वर्ग तक ले जाना, ताकि उसका अनन्त परीक्षण निर्विवाद और अचूक [न्याय] से हो। वे उनकी ओर से तब तक लगे रहते हैं जब तक सभी पृथ्वी के जीवन में प्रवेश करके जीवन से विदा नहीं हो जाते। जब उनके शरीर पृथ्वी पर [पड़े रहते] हैं, तब वे उनकी सभी […] की सेवा करते हैं और अपने आपको उनके दुःखों, सतावों और संकटों में सहभागी बनाते हैं—उन दुःखों में जो दूसरों से अधिक पवित्र जनों पर आए।


