translation:
  language: hi
  text: '**अंतिम एओन की भूल—वचन**


    एओनों[a] में से एक के मन में आया कि वह उस अगम्यता को समझने का प्रयत्न करे और उसकी महिमा करे—विशेषकर पिता की अनिर्वचनीयता की। क्योंकि वह एकता से निकला हुआ वचन है, इसलिए वह एक है; [फिर भी] वह समग्रताओं[b] की एकता से नहीं है, न उससे है जिसने उन्हें उत्पन्न किया—अर्थात् समग्रता को उत्पन्न करनेवाले पिता से। यह एओन उन लोगों में से था जिन्हें बुद्धि दी गई थी, जिनका विचार पहले से विद्यमान था और जिसके द्वारा उन्होंने अपनी इच्छा की वस्तुएँ उत्पन्न कीं। इसलिए छिपी हुई नींव की जाँच करने के लिए उसे जन्मजात बुद्धि मिली, क्योंकि वह बुद्धि का फल है। समग्रताओं के साथ उत्पन्न हुई स्वतंत्र इच्छा ही एक कारण थी कि उसने […] बिना किसी के रोके वही किया जो वह चाहता था।


    इसका अभिप्राय—अर्थात् वचन का अभिप्राय—अच्छा था। उत्पन्न होने पर वह पिता की महिमा करने के लिए उतावला हुआ, यद्यपि <उसने> एक असंभव बात चाही: वह ऐसी संयुक्तता से, जिसमें उसका कोई भाग न था, और बिना कोई आदेश पाए, एक सिद्ध अस्तित्व उत्पन्न करना चाहता था। यह एओन पारस्परिक सहायता से <उत्पन्न> होनेवालों में अंतिम था और परिमाण में छोटा था। इच्छा की महिमा के लिए, और समग्रताओं के साथ एकता में, कुछ भी उत्पन्न करने से पहले ही वह अपने उमड़ते प्रेम के कारण उदारता से आगे बढ़ा और उस ओर गया जो सिद्ध महिमा को घेरे हुए है; क्योंकि वचन का उत्पन्न होना पिता की इच्छा से बाहर नहीं था—अर्थात् वह उसकी इच्छा के बिना आगे नहीं बढ़ा था।


    फिर भी पिता ने उसे उन लोगों के लिए उत्पन्न किया था जिन्हें वह उत्पन्न करने के योग्य जानता था। पिता और समग्रताएँ उससे पीछे हट गए, ताकि पिता द्वारा ठहराई गई सीमा स्थापित हो सके; क्योंकि यह उस अगम्य को समझ लेने से नहीं, बल्कि पिता की इच्छा […] से होता है। इसके अतिरिक्त, यह इसलिए हुआ कि जो वस्तुएँ अस्तित्व में आ चुकी थीं, वे प्रकट होनेवाली उद्धार-योजना का रूप ले सकें, और परिपूर्णता[c] को प्रकट करने के लिए उसका प्रकट होना <न> टले। इसलिए वचन के इस कार्य के विषय में बुरा कहना उचित नहीं है; पर यह कहना उचित है कि वचन का यह कार्य उस उद्धार-योजना का कारण है जिसका प्रकट होना निश्चित है।


    वचन ने स्वयं को सिद्ध और एकमात्र रूप में उत्पन्न किया और पिता की जिस महिमा की वह अभिलाषा करता था, उसके लिए उसी से संतुष्ट रहा। किंतु जिन्हें वह दृढ़ता से थामना चाहता था, उन्हें उसने छायाओं, प्रतिमाओं और समानताओं के रूप में उत्पन्न किया। वह प्रकाश की ओर टकटकी नहीं लगा सका; इसके बदले उसने गहराई में झाँका और संदेह किया। इससे एक अलगाव उत्पन्न हुआ जिसने उसे बहुत व्याकुल किया, और उसके आत्म-संदेह और अलगाव, स्वयं को भूल जाने, स्वयं के अज्ञान और <जो कुछ> अस्तित्व में है उसके अज्ञान के कारण पीछे हटना हुआ।


    उसका आत्म-अभिमान और यह विश्वास कि वह अगम्य को समझ सकता है, उसके भीतर कठोर होकर जड़ पकड़ गया। पर ये दुर्बलताएँ उसी समय तक उसमें बनी रहीं जब वह अपने आपे में नहीं था; उनका कारण आत्म-संदेह था, क्योंकि <वह पिता की महिमाओं तक पहुँचने में असफल रहा>, जिनकी महानता का अनुकरण नहीं किया जा सकता। वह वहाँ तक इसलिए नहीं पहुँच सका क्योंकि वह उसे समझने में असमर्थ था।


    जिसे उसने अपने आप […] एक अकेले एओन के रूप में उत्पन्न किया था, वह शीघ्रता से ऊपर अपने लोगों के पास गया। परिपूर्णता में रहनेवाले उसके इस संबंधी ने उसे त्याग दिया जो न्यूनता में अस्तित्व में आया था—और उसके साथ उन सबको भी जिन्हें उसने कल्पना के रूप में उत्पन्न किया था—क्योंकि वे उसके नहीं हैं। स्वयं को सिद्ध रूप में उत्पन्न करने के बाद, वह जिसने सचमुच स्वयं को उत्पन्न किया था, उस स्त्री-स्वभाव के समान निर्बल हो गया जो अपने पुरुष सहचर को छोड़ देता है। जो उसमें न्यून था, उससे वे वस्तुएँ निकलीं जो उसके विचार और अभिमान से उपजी थीं; पर जो उसमें सिद्ध था, उससे वह अलग हुआ और [अपने को ऊपर उठाकर] अपने लोगों के पास गया। वह उसके लिए स्मरण के रूप में परिपूर्णता में रहने लगा, क्योंकि [वह अपने अभिमान से] बचा लिया [गया था]।


    जो ऊपर शीघ्रता से गया और जिसने उसे अपनी ओर खींच लिया, वे निष्फल नहीं थे। परिपूर्णता में एक फल उत्पन्न करके उन्होंने उस वस्तु को पदच्युत कर दिया जो न्यूनता में प्रकट हुई थी। अभिमानी विचार से अस्तित्व में आई वस्तुएँ परिपूर्णताओं के समान हैं—वे उनकी समानताएँ, प्रतिमाएँ, छायाएँ और मायावी रूप हैं। उनमें विवेक और प्रकाश नहीं है; वे खोखले विचार से संबंधित हैं, क्योंकि वे किसी वस्तु द्वारा उत्पन्न नहीं की गई थीं। […] इसलिए उनका अंत उनके आरंभ के अनुरूप होगा: जो कभी था ही नहीं, वह उस दशा में लौट जाएगा जिसमें वह कभी नहीं होगा। फिर भी वे अपने को उन नामों से अधिक महान, अधिक सामर्थी और अधिक [आदरणीय] समझती हैं [जो उन्हें शोभा देते हैं] और जिनकी वे छायाएँ हैं। वे उस सुंदर प्रतिबिंब के समान हैं [जिसे कोई देखता है], क्योंकि सामान्यतः किसी प्रतिरूप के मुख की सुंदरता उस मूल रूप से आती है जिसका वह प्रतिबिंब है।


    उन्होंने सोचा कि वे अपने आप अस्तित्व में आए हैं और उनका कोई स्रोत नहीं है, क्योंकि उन्होंने अपने से पहले विद्यमान किसी और को नहीं देखा। इसलिए वे उद्दंडता और विद्रोही कामों में जीते रहे और उसके सामने दीन नहीं हुए जिसके कारण वे अस्तित्व में आए थे। महिमा पाने की लालसा में वे एक-दूसरे को आज्ञा देना और एक-दूसरे पर शासन करना चाहते थे; जबकि उनके पास जो महिमा थी, उसमें उस भावी व्यवस्था का कारण भी निहित था। क्योंकि [वे] ऊपर की वस्तुओं की समानताएँ हैं, <इसलिए उन्होंने> प्रभुत्व की लालसा से अपने को ऊँचा उठाया। हर एक ने उस महान नाम के परिमाण के अनुसार ऐसा किया जिसकी वह छाया है, और हर एक ने अपने को अपने साथियों से श्रेष्ठ समझा।


    इन दूसरे प्राणियों का विचार भी निष्फल नहीं था। जिनकी छायाएँ वे हैं, उनमें जैसे प्रत्येक विचार पुत्र बन जाता है, […] वैसे ही ये जो कुछ सोचते हैं वह उनकी संतान बन जाता है। इस प्रकार उनसे संतानों की भीड़ उत्पन्न हुई—लड़ाके, योद्धा, उपद्रवी, आज्ञा न माननेवाले विद्रोही, प्रभुत्व के प्रेमी, और इसी प्रकार के हर दूसरे अस्तित्व, जो इनसे निकले।


    इस [भीड़] के अस्तित्व में आने का कारण वचन था, और वह अधिकाधिक उलझन में पड़ता और अचंभा करता गया। सिद्धता के स्थान पर उसने न्यूनता देखी; एकता के स्थान पर अलगाव; स्थिरता के स्थान पर [दुर्बलताएँ]; और [विश्राम] के स्थान पर हलचलें। वह उन्हें हलचल से [प्रेम करना] बंद नहीं करा [सका], न [उसे] नष्ट कर सका। वह [पूरी तरह] शक्तिहीन था; उसकी समग्रता और उसकी [सिद्धता] ने उसे छोड़ दिया था।


    जो अपने ही विषय में अनजान रहकर अस्तित्व में आए थे, वे न तो उन परिपूर्णताओं को जानते थे जहाँ से उनका उद्गम हुआ था, न अपने अस्तित्व का कारण जानते थे। इस अस्थिर दशा में वचन फिर ऐसी कोई वस्तु उत्पन्न न कर सका जो उन उद्भवों[d] के समान हो जो परिपूर्णता में निवास करते हैं—उन महिमाओं के समान जो पिता की महिमा के लिए विद्यमान हैं। इसके बदले उसने […] छोटे-छोटे दुर्बल प्राणी उत्पन्न किए, जो उन दुर्बलताओं से सीमित थे जिन्होंने स्वयं उसे भी जकड़ रखा था।


    इस दशा में अकेली रह गई समानता उन वस्तुओं का कारण बनी, जो आरंभ से अपने अस्तित्व का कारण स्वयं नहीं थीं। इस न्यून दशा में रहनेवाला न्यून प्राणियों को तब तक उत्पन्न करता रहा, जब तक उसने न्याय का निर्णय सुनाकर अपने उत्पन्न किए हुए उन विवेकहीन प्राणियों को दोषी नहीं ठहराया। वह उनसे तब तक संघर्ष करता रहा जब तक वे नष्ट नहीं हो गए—अर्थात् वे जिन्होंने उस दंडादेश का विरोध किया था—[और] क्रोध उनका पीछा करता रहा।


    [a] **एओन**: इस ग्रंथ में दिव्य, शाश्वत लोक की एक सत्ता या कालातीत अस्तित्व के लिए प्रयुक्त पारिभाषिक शब्द।


    [b] **समग्रताएँ**: बहुवचन पारिभाषिक पद; दिव्य समग्रता से संबंधित सत्ताओं के समूह का संकेत करता है।


    [c] **परिपूर्णता**: उस पूर्ण दिव्य क्षेत्र या समग्रता के लिए प्रयुक्त पद जिसे प्रायः यूनानी *प्लेरोमा* कहा जाता है।


    [d] **उद्भव**: स्रोत से निकलकर अस्तित्व में आनेवाली दिव्य सत्ताएँ; इसे “प्रसरण” भी कहा जा सकता है।'
