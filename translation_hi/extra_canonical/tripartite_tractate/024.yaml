  revised_text: 'करुणा की ओर झुकाव के कारण हमारा उद्धारकर्ता वैसा ही बन गया जैसा वे लोग बन गए थे जिनके लिए वह प्रकट हुआ था—अर्थात देह और प्राण, जो सहज प्रवृत्ति के कारण उन पर निरंतर प्रभुत्व रखते हैं, और वे नष्ट होकर मर जाते हैं। फिर भी, जो [अस्तित्व में आए] [a] [के रूप में] अदृश्य थे और अदृश्य रीति से आए थे, उन्हें उसने अपने विषय में अदृश्य रीति से शिक्षा दी। जिन्हें वह बचाना चाहता था, उनकी मृत्यु उसने न केवल अपने ऊपर ली, बल्कि उनकी उस हीन दशा को भी अपना लिया जिसमें वे देह और प्राण के साथ [जन्म लेते] समय गिर गए थे; क्योंकि उसने देह और प्राण सहित बालक के रूप में जन्म लेना स्वीकार किया। पतित लोगों की उन सभी दूसरी दशाओं में भी वह सहभागी हुआ जिनमें वे सहभागी थे, यद्यपि उनके पास प्रकाश था और वह उनसे ऊँचा था; क्योंकि उसने पाप, अशुद्धता और विनाश से रहित गर्भधारण किया जाना स्वीकार किया। जीवन में निवास करते हुए वह देहधारी जीवन में उत्पन्न हुआ, क्योंकि यह निर्धारित किया गया था कि वासना और वचन से निकले बदलते झुकाव के कारण—जब वचन ने मन फेरकर अपने को प्रेरित किया था—दोनों समान रूप से देह और प्राण बनें।


    परन्तु उद्धार की योजना के अनुसार, उसी ने उन बातों के परिणाम अपने ऊपर लिए जिनका हमने पहले उल्लेख किया था—अर्थात वह जो वचन के मन फेरने और अपने को प्रेरित करने के बाद उसकी प्रकाश देनेवाली दृष्टि और दृढ़ विचार से अस्तित्व में आया। इसी प्रकार वे भी हैं जिन्होंने उसकी तरह देह और प्राण, तथा स्थापना, स्थिरता और बुद्धि धारण की। पहले से निर्धारित था कि वे उद्धारकर्ता के उस आगमन के साथ एकत्र हों जो स्वयं भी पहले से निर्धारित था। उद्धारकर्ता के निर्णय लेने पर ही वे भी आए। इस प्रकार वे आए और अपने देहधारी उद्भव में उन लोगों से बहुत बढ़कर निकले जो अभाव से उत्पन्न हुए थे [b]; क्योंकि इसी प्रकार उन्होंने भी, उद्धारकर्ता की तरह, उसके साथ अपने मिलन के प्रकाशन द्वारा शारीरिक उद्भव पाया।


    ये एक ही तत्त्व के हैं, अर्थात आत्मिक तत्त्व के। फिर भी उद्धार की योजना विविध है—यह एक बात है और वह दूसरी। कुछ वासना और विभाजन से निकलते हैं और उन्हें चंगाई की आवश्यकता होती है। दूसरे उस प्रार्थना से निकलते हैं जो रोगियों को चंगा करती है, और पतितों का उपचार करने के लिए नियुक्त किए जाते हैं। ये प्रेरित और संदेश के प्रचारक हैं। ये उद्धारकर्ता के शिष्य और शिक्षा की आवश्यकता रखनेवालों के शिक्षक हैं।


    तब वे भी उन्हीं वासनाओं में क्यों सहभागी होते हैं जिनमें वासना से उत्पन्न लोग सहभागी होते हैं, यदि उद्धार की योजना के अनुसार वे उद्धारकर्ता के साथ एक देह में उत्पन्न हुए थे, जो ऐसी वासनाओं में सहभागी नहीं हुआ? उद्धारकर्ता उस एक सत्ता का प्रतिरूप था और देहधारी रूप में समग्रता था। इसलिए उसने अविभाज्यता के प्रतिमान को बनाए रखा, जिससे अप्रभावितता उत्पन्न होती है। परन्तु वे प्रकट हुए प्रत्येक जन के प्रतिरूप हैं। इसी कारण वे अपने प्रतिमान से अलगाव को अपना लेते हैं, क्योंकि उन्होंने उस रोपण के लिए रूप धारण किया जो आकाश के नीचे है और जो उन स्थानों में प्रबल बुराई में भी [c] सहभागी होता है जहाँ वे पहुँचे हैं। क्योंकि इच्छा ने समग्रता को पाप के अधीन बंदी बना लिया, ताकि वह इच्छा के द्वारा समग्रता पर दया करे और वे बचाए जाएँ; क्योंकि जीवन देने के लिए उस एक को चुना गया है, जबकि शेष सभी को उद्धार की आवश्यकता है।


    इसी कारण वह उन लोगों में पहला था जिन्हें वरदान देने का अनुग्रह मिला—वे वरदान जिनका प्रचार उन लोगों ने किया जिन्हें उसने दूसरों को प्रचार करने के योग्य समझा। क्योंकि यीशु मसीह की प्रतिज्ञा का बीज स्थापित किया गया था, जिसके प्रकाशन और मिलन की हमने सेवा की है। उस प्रतिज्ञा ने शिक्षा को संभव बनाया, अर्थात आरम्भ में वे जो थे उसी दशा में लौटना भी। उनके भीतर एक बूँद है जो उन्हें उसकी ओर लौटने के लिए झुकाती है। इसी को वे “छुटकारा” कहते हैं—बन्धन से मुक्ति और स्वतंत्रता की प्राप्ति।


    बन्धन उनका है जो अज्ञान के दास बनाए गए थे। इसके विपरीत, स्वतंत्रता उस सत्य का ज्ञान है जो अज्ञान से पहले विद्यमान था और आदि तथा अन्त के बिना सदा प्रबल रहता है। वही भलाई, सब रोगों की औषधि, और उस दास बनानेवाले स्वभाव से मुक्ति है जिसने उन लोगों को दुःख दिया जो रिक्तता के तुच्छ विचार में उत्पन्न हुए थे—अर्थात बुरे झुकाव का स्वभाव [d], उस विचार के द्वारा जो उन्हें गिराकर प्रभुत्व की लालसा में डाल देता है। बालकों पर दृष्टि करनेवाले अनुग्रह की भरपूरी से उन्हें स्वतंत्रता का खजाना मिला। स्वतंत्रता वासना को गिरा देती है और उन वस्तुओं को नष्ट कर देती है जिन्हें उसने पहले अपने से अलग कर दिया था, जब वचन ने उन्हें अपने से अलग किया था। उसने उद्धार की योजना पूरी होने तक उन्हें विनाश के लिए ठहराया और उन्हें अस्तित्व में बने रहने दिया, क्योंकि वे भी पहले से निर्धारित बातों के लिए उपयोगी थीं।'
