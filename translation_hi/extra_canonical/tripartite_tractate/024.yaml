  text: 'Out of an inclination toward mercy, our Savior became the same as those for whose sake he appeared had become through an instinctive passion—namely, flesh and soul, which constantly rule over them, so that they are destroyed and die. Yet those who [came into being] [] [as] invisible and invisibly, he taught about himself invisibly. He not only took on <himself> the death of those he intended to save, but also embraced the smallness into which they had fallen when they were <born> with body and soul, because he chose to be born as a child with body and soul. He shared in all the other conditions shared by those who had fallen, even though they possessed the light and he was exalted above them, because he chose to be conceived without sin, impurity, or corruption. He was begotten into physical life while dwelling in life, because it had been determined that both would equally become body and soul on account of the passion and shifting inclination from the Word, who had stirred himself
    in conversion.


    But according to the plan of salvation, it was he <who> took upon himself the results of the things we mentioned before—namely, what came into being from the illuminating vision and the firm thought of the Word after his self-conversion, after he stirred himself. This is how those who, like him, assumed body and soul, as well as establishment, stability, and wisdom. It had been determined beforehand that they would come together with the coming of the Savior, which had also been determined beforehand. Only when the Savior had made the decision did they also come. Thus they came, far surpassing in their fleshly emanation those who had been produced from the deficiency, [] because this was how they too underwent bodily emanation, as did the Savior, through the revelation of their union with him.


    These are those of a single substance, namely, the spiritual substance. The plan of salvation, however, is diverse: this is one thing, and that is another. Some emerge from passion and division and need healing. Others issue from the prayer that heals the sick and are appointed to treat the fallen. These are the apostles and the preachers of the message. They are the students of the Savior and the instructors of those who need teaching.


    Why, then, do they also share in the same passions as those who were produced from passion, if, according to the plan of salvation, they were produced in one body with <the> Savior, who did not share in such passions? The Savior was an image of a single entity, being the Totality in bodily form. Consequently, he preserved the pattern of inseparability, from which impassability comes. But they are images of each one who was revealed. This is why they embrace separation from their pattern, since they took on form for the planting that exists beneath heaven and that also [] shares in the evil prevailing in the places they have reached. For the will held the Totality captive under sin, so that by will he could show mercy to the Totality and they could be saved, since the one who is singular is chosen to give life, while all the rest need salvation.


    Because of this, he was the first among those to receive the grace of bestowing the gifts proclaimed by those whom he considered worthy of preaching to others. For <the> seed of the promise of Jesus Christ was put in place, whose revelation and union we have served. The promise made teaching possible, including the return to what they had been in the beginning. They possess a drop inclining them to return to it. This is what they call “redemption,” which is release from captivity and the attainment of freedom.


    The captivity is that of those who were enslaved to ignorance. In contrast, freedom is knowledge of the truth that existed before ignorance and prevails eternally, without beginning and without end. It is what is good, a cure for everything, and a release from the enslaving nature that caused suffering to those who had been produced in a lowly thought of emptiness—the nature of the evil inclination, [] through the thought that degrades them into lust for control. From the wealth of grace that looked upon the children, they received the treasure of freedom. Freedom casts down passion and destroys those things that it had earlier cast away from itself when the Word separated them from himself. He destined them for destruction until <the> the plan of salvation ends, and he allowed them to continue to exist because they too were useful for the things that had been predetermined.'
translation:
  language: hi
  text: 'करुणा की ओर झुकाव के कारण, हमारा उद्धारकर्ता वैसा ही बन गया जैसे वे लोग बन गए थे जिनके लिए वह प्रकट हुआ था—अर्थात सहज वासना के कारण देह और प्राण; ये उन पर निरंतर प्रभुत्व रखते हैं, और वे नष्ट होकर मर जाते हैं। फिर भी जो [अस्तित्व में आए] [a] [अदृश्य रूप में], उन्हें उसने अदृश्य रीति से अपने विषय में शिक्षा दी। जिन लोगों को वह बचाना चाहता था, उनकी मृत्यु उसने न केवल अपने ऊपर ले ली, बल्कि उनकी उस लघुता को भी अपना लिया जिसमें वे देह और प्राण के साथ [जन्म लेते] समय गिर गए थे; क्योंकि उसने देह और प्राण सहित बालक के रूप में जन्म लेना स्वीकार किया। पतित लोगों की दूसरी सभी दशाओं में भी वह सहभागी हुआ, यद्यपि उनके पास प्रकाश था और वह उनसे ऊँचा था; क्योंकि उसने पाप, अशुद्धता और विनाश से रहित गर्भ में आना स्वीकार किया। जीवन में निवास करते हुए वह शारीरिक जीवन के लिए जन्मा, क्योंकि यह निर्धारित किया गया था कि वासना और वचन से निकले उस बदलते झुकाव के कारण—जब वचन ने मन फेरकर अपने को प्रेरित किया था—दोनों समान रूप से देह और प्राण बनें।


    परन्तु उद्धार की योजना के अनुसार, उसी ने उन बातों के परिणाम अपने ऊपर लिए जिनका हमने पहले उल्लेख किया था—अर्थात वे परिणाम जो वचन के मन फेरने और अपने को प्रेरित करने के बाद उसकी प्रकाश देनेवाली दृष्टि और दृढ़ विचार से अस्तित्व में आए। इसी प्रकार वे भी, जिन्होंने उसकी तरह देह और प्राण तथा स्थापना, स्थिरता और बुद्धि धारण की। पहले से निर्धारित था कि वे उद्धारकर्ता के आगमन के साथ एकत्र हों, जिसका आगमन भी पहले से निर्धारित था। उद्धारकर्ता के निर्णय लेने पर ही वे भी आए। इस प्रकार वे आए और अपने देहधारी उद्भव में उन लोगों से कहीं बढ़कर निकले जो अभाव से उत्पन्न हुए थे [b]; क्योंकि उद्धारकर्ता की तरह उन्होंने भी उसके साथ अपने मिलन के प्रकाशन द्वारा शारीरिक उद्भव पाया।


    ये एक ही तत्त्व के हैं, अर्थात आत्मिक तत्त्व के। फिर भी उद्धार की योजना विविध है—यह एक बात है और वह दूसरी। कुछ वासना और विभाजन से निकलते हैं और उन्हें चंगाई की आवश्यकता होती है। दूसरे उस प्रार्थना से निकलते हैं जो रोगियों को चंगा करती है, और पतितों का उपचार करने के लिए नियुक्त किए जाते हैं। ये प्रेरित और संदेश के प्रचारक हैं। ये उद्धारकर्ता के शिष्य और शिक्षा की आवश्यकता रखनेवालों के शिक्षक हैं।


    तब वे भी उन्हीं वासनाओं में क्यों सहभागी होते हैं जिनमें वासना से उत्पन्न लोग होते हैं, यदि उद्धार की योजना के अनुसार वे उद्धारकर्ता के साथ एक देह में उत्पन्न हुए थे, जो ऐसी वासनाओं में सहभागी नहीं हुआ? उद्धारकर्ता उस एकमात्र सत्ता का प्रतिरूप था और देहधारी रूप में समग्रता था। इसलिए उसने अविभाज्यता के प्रतिमान को बनाए रखा, जिससे दुःखातीतता उत्पन्न होती है। परन्तु वे प्रकट हुए प्रत्येक जन के प्रतिरूप हैं। इसी कारण वे अपने प्रतिमान से अलगाव को अपना लेते हैं, क्योंकि उन्होंने उस रोपण के लिए रूप धारण किया जो आकाश के नीचे है और जो उन स्थानों में प्रबल बुराई में भी [c] सहभागी होता है जहाँ वे पहुँचे हैं। क्योंकि इच्छा ने समग्रता को पाप के अधीन बंदी बना लिया, ताकि वह अपनी इच्छा से समग्रता पर दया करे और वे बचाए जाएँ; क्योंकि जीवन देने के लिए उस एकमात्र को चुना गया है, जबकि शेष सभी को उद्धार की आवश्यकता है।


    इसी कारण वह उन लोगों में पहला था जिन्हें वे वरदान बाँटने का अनुग्रह मिला जिनका प्रचार उन लोगों ने किया जिन्हें उसने दूसरों को प्रचार करने के योग्य समझा। क्योंकि यीशु मसीह की प्रतिज्ञा का बीज स्थापित किया गया था, जिसके प्रकाशन और मिलन की हमने सेवा की है। उस प्रतिज्ञा ने शिक्षा को संभव बनाया—आरम्भ में वे जो थे, उस दशा में लौटना भी। उनके भीतर एक बूँद है जो उन्हें उसकी ओर लौटने के लिए झुकाती है। इसी को वे “छुटकारा” कहते हैं—बन्धन से मुक्ति और स्वतंत्रता की प्राप्ति।


    बन्धन उनका है जो अज्ञान के दास बनाए गए थे। इसके विपरीत, स्वतंत्रता उस सत्य का ज्ञान है जो अज्ञान से पहले विद्यमान था और आदि तथा अन्त के बिना सदा प्रबल रहता है। वही भलाई, सब रोगों की औषधि और उस दास बनानेवाले स्वभाव से मुक्ति है जिसने उन लोगों को दुःख दिया जो रिक्तता के तुच्छ विचार में उत्पन्न हुए थे—अर्थात बुरे झुकाव का स्वभाव [d], उस विचार के द्वारा जो उन्हें गिराकर प्रभुत्व की लालसा में डाल देता है। बालकों पर दृष्टि करनेवाले अनुग्रह की भरपूरी से उन्हें स्वतंत्रता का खजाना मिला। स्वतंत्रता वासना को गिरा देती और उन वस्तुओं को नष्ट कर देती है जिन्हें उसने पहले अपने से अलग कर दिया था, जब वचन ने उन्हें अपने से अलग किया। उसने उद्धार की योजना पूरी होने तक उन्हें विनाश के लिए ठहराया और उन्हें अस्तित्व में बने रहने दिया, क्योंकि वे भी पहले से निर्धारित बातों के लिए उपयोगी थीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पाण्डुलिपि में पाठ लुप्त या अत्यन्त अस्पष्ट है; कोष्ठकों में दिया वाक्यांश संपादकीय पुनर्निर्माण है।
    reason: आरम्भिक वाक्य में lacuna के कारण व्याकरण और आशय अनिश्चित हैं।
  - marker: b
    text: “अभाव से उत्पन्न हुए थे” के बाद पाण्डुलिपि में कुछ पाठ लुप्त है।
    reason: स्रोत-साक्ष्य में स्पष्ट रिक्ति है, जो तुलना के पूरे आशय को प्रभावित कर सकती है।
  - marker: c
    text: “बुराई में भी” के आसपास पाण्डुलिपि में पाठ का एक भाग लुप्त है।
    reason: वाक्य का संबंध और सहभागिता का सटीक स्वरूप अनिश्चित है।
  - marker: d
    text: “बुरे झुकाव का स्वभाव” के आसपास भी पाण्डुलिपि में रिक्ति है।
    reason: मूल तर्क की कुछ मध्यवर्ती सामग्री अनुपलब्ध है।
lexical_decisions:
- source_word: flesh and soul
  choice: देह और प्राण
  rationale: ‘देह’ शारीरिक अस्तित्व और ‘प्राण’ जीवित, मनोदैहिक सत्ता का संकेत देता है; ‘आत्मा’ को spiritual के लिए सुरक्षित रखा गया है।
- source_word: plan of salvation
  choice: उद्धार की योजना
  rationale: पाठ की व्यवस्थात्मक, पूर्वनिर्धारित प्रक्रिया को सहज और धार्मिक रूप से तटस्थ हिन्दी में व्यक्त करता है।
