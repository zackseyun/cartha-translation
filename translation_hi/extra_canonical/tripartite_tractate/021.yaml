translation:
  language: hi
  text: 'जिस द्रव्य का रूप अस्थिर है, वह उस अंधेपन का कारण है जो शक्तियों के द्वारा व्याप्त है [. . .] उनमें उसका सब कुछ [. . .], जबकि वे मिलकर उत्पन्न करते हैं और [नष्ट हो जाते हैं]। [दाहिने पक्ष वालों] और बाएँ पक्ष वालों के बीच रखा गया विचार [अनुकरण] की शक्ति है। वे आरम्भिक सत्ताएँ जिन-जिन को बनाना चाहती हैं, वे मानो शरीर के पीछे चलने वाली छाया के प्रक्षेप हैं; यही दृश्य प्राणियों की जड़ें <बनते> हैं।[a]


    प्रतिबिम्बों, प्रतिरूपों और समानताओं की व्यवस्था की सारी तैयारी उन लोगों के कारण अस्तित्व में आई जिन्हें शिक्षा, उपदेश और गठन की आवश्यकता है—ये उन्हें दर्पण के माध्यम से दिए जाते हैं—ताकि जो छोटा है वह धीरे-धीरे बढ़ सके। इसी कारण उसने मनुष्यजाति को सबसे अन्त में बनाया; पहले उसने उनके लिए वे वस्तुएँ तैयार और उपलब्ध कराईं जिन्हें उसने उन्हीं के लिए रचा था।


    मनुष्यजाति की सृष्टि भी अन्य सब वस्तुओं की तरह हुई। आत्मिक वचन ने अदृश्य रीति से उन्हें प्रेरित किया और शिल्पी-सृष्टिकर्ता[b] [] तथा उसके स्वर्गदूतीय सेवकों के द्वारा उन्हें पूर्ण रूप दिया। दंभ और उसके शासकों ने भी उनके साथ गठन के इस कार्य में भाग लिया। मनुष्य पृथ्वी की छाया के समान हैं, ताकि वे उन [सत्ताओं] जैसे हों जो समग्रताओं से अलग कर दी गई हैं। उन्हें उन सबने बनाया—दाहिने पक्ष वालों और बाएँ पक्ष वालों ने—और प्रत्येक वर्ग ने [मनुष्य को उसी प्रकार] एक रूप दिया, जिस प्रकार (समग्रता) स्वयं [रची गई] थी।


    वचन ने जो [रूप] उत्पन्न किया वह अपूर्ण था, मानो दुर्बलता की कोई [पीड़ा] हो, क्योंकि उसने उसे [विस्मृति], अज्ञान, [अपूर्णता] और हर दूसरी दुर्बलता की ओर ले गया। वचन ने केवल पहला रूप दिया था—<कुछ ऐसा जो उसने उसे> शिल्पी-सृष्टिकर्ता के माध्यम से अनजाने में दिया—ताकि वह जान सके कि कोई महान सत्ता अस्तित्व में है और उसे [उसकी] आवश्यकता है। इसी को भविष्यद्वक्ता ने “जीवित आत्मा,” “महान युगों की श्वास” और “अदृश्य” कहा। यही वह जीवित प्राण है जिसने उस शरीर को जीवन दिया जो पहले निर्जीव था; और जो जीवनरहित है, वह अज्ञान है।


    इसलिए यह मानना उचित है कि प्रथम मनुष्य का प्राण आत्मिक वचन से उत्पन्न हुआ, यद्यपि सृष्टिकर्ता ने समझा कि उसे उसी ने बनाया है। जो फूँका गया था, वह उसके भीतर से ऐसे निकला जैसे किसी मुख से।


    सृष्टिकर्ता ने अपने तत्त्व में से भी प्राणों को नीचे भेजा, क्योंकि [उसमें] भी उत्पन्न करने की शक्ति है; [] वह पिता के प्रतिरूप से <उत्पन्न हुआ> है। बाएँ पक्ष वालों ने भी अपने लिए एक विशेष प्रकार का मनुष्य उत्पन्न किया, क्योंकि उनमें भी <अस्तित्व> की समानता है।


    आत्मिक तत्त्व एक एकीकृत वस्तु और एक ही प्रतिरूप है, [परन्तु] उसकी दुर्बलता [अनेक] रूपों की अवस्था है। प्राणमय लोगों के तत्त्व की अवस्था द्वैतमय है, क्योंकि उसमें ज्ञान है और वह परम महान की स्तुति करता है; फिर भी दंभ की प्रवृत्ति के कारण वह बुराई की ओर <भी> झुका हुआ है। भौतिक लोगों के तत्त्व की दशा भिन्न है, बल्कि वह अनेक रूपों में है; वह ऐसी दुर्बलता थी जो कई प्रकार की प्रवृत्तियों में प्रबल हुई।


    इस प्रकार प्रथम मनुष्य विविध रूपों से गढ़ा गया, विविध सत्ताओं की रचना है, और बाएँ तथा दाहिने पक्ष वालों का भंडार है। वह आत्मिक वचन भी है, जिसकी अभिरुचियाँ उन दोनों तत्त्वों के बीच बँटी हुई हैं जिनसे उसे अस्तित्व मिला है।


    इसीलिए कहा गया है कि उसके लिए स्वर्गोद्यान लगाया गया, ताकि वह तीन प्रकार के वृक्षों का फल खा सके; क्योंकि वह तीन वर्गों का उद्यान है और आनन्द देता है। उसके भीतर का श्रेष्ठ और चुना हुआ तत्त्व <सृष्टि> से अधिक महान था, और वह उनके लिए <हानि> था। इसलिए उन्होंने आज्ञा दी और धमकाया कि उस पर एक भयंकर संकट आएगा, [] अर्थात मृत्यु। उसे केवल बुरे वृक्षों का फल चखने और उनका आनन्द लेने की अनुमति थी। दूसरे वृक्ष से, अर्थात द्वैत के वृक्ष से, उसने [उसे] खाने नहीं दिया—जीवन के वृक्ष से तो और भी नहीं—ताकि उसे उनके [समान] सम्मान न मिले और ताकि [वह . . .] उन्हें न सके।


    “सर्प” कहलाने वाली दुष्ट शक्ति के द्वारा—जो सभी दुष्ट शक्तियों से भी अधिक चतुर है—मनुष्य को स्मृति और अभिलाषाओं से सम्बन्ध रखने वालों की योजना के अनुसार बहकाया गया। उसने मनुष्य से आज्ञा का उल्लंघन कराया, ताकि वह मर जाए। तब उसे उस स्थान और उसके सारे आनन्दों से निकाल दिया गया।


    यही वह निष्कासन है जिसके द्वारा उन्होंने उसे दण्ड दिया: उसे समानता से सम्बन्ध रखने वालों और प्रतिरूप से सम्बन्ध रखने वालों के आनन्दों से निकाल दिया गया। वास्तव में यह ईश्वरीय प्रबंध का कार्य था, ताकि मनुष्य समझें कि आनन्द थोड़े ही समय तक रहते हैं, जबकि विश्राम का स्थान अनन्त है। आत्मा ने इस कार्य को ठहराया था, जब उसने पहले ही यह योजना बनाई कि मनुष्य उस बड़ी बुराई का अनुभव करे जिसे मृत्यु कहते हैं—अर्थात समग्रता का पूर्ण अज्ञान—और उससे निकलने वाली सभी बुराइयों का स्वाद भी चखे; फिर विकारों, चिंताओं और उनसे उत्पन्न होने वाली बातों के बाद वह सबसे बड़ा [] भला पाए, अर्थात अनन्त जीवन, जो समग्रताओं का पूर्ण ज्ञान और हर भली वस्तु की प्राप्ति है।


