  revised_text: "और <उसने> अदृश्य रूप से उसके भीतर एक वचन बोया, जिसे ज्ञान बनना था; और उसने उसे यह सामर्थ्य दी कि वह दूर हट सके और जो उसकी आज्ञा नहीं मानते, उन्हें अपने से दूर कर सके। इस प्रकार उसने अपने आपको उसे प्रकट किया। पर जो उसके कारण अस्तित्व में आए थे, उनके सामने उसने ऐसा रूप प्रकट किया जो उनकी समझ से परे था। इसलिए वे एक-दूसरे से शत्रुता करने लगे। <उसने> अचानक अपने आपको उन पर प्रकट किया—वह बिजली के रूप में निकट आया और बिजली की कौंध के समान चला गया। उनके आपसी उलझाव को समाप्त करते समय, उसने उस अचानक प्रकाशन के द्वारा उसका अंत कर दिया []; वे इसके लिए तैयार नहीं थे, इसकी प्रतीक्षा नहीं कर रहे थे और इसे जानते भी नहीं थे।\n\n\n      इससे वे भयभीत हो गए और गिर पड़े, क्योंकि जिस प्रकाश ने उन पर प्रहार किया था, उसके प्राकट्य को वे सह नहीं सके। जो प्रकट हुआ था, उसने दोनों श्रेणियों को तहस-नहस कर दिया। जैसे स्मृति के प्राणियों को <लघु जन> कहा गया है, वैसे ही उन्हें उस परम-उन्नत के विषय में केवल धुँधला-सा बोध है, जो उनसे पहले से विद्यमान है; और उन्होंने अपने भीतर उस परम-उन्नत के प्रति विस्मय\
    \ की भावना बोई है, जो प्रकट होनेवाला है। इसलिए उन्होंने उसका प्रकाशन ग्रहण किया और उसके सामने दंडवत किया। वे <उसके> विषय में आश्वस्त साक्षी बने और उन्होंने स्वीकार किया कि जो प्रकाश प्रकट हुआ था, वह उनका विरोध करनेवालों से अधिक सामर्थी था।\n\n\n      पर समानता वाले अत्यन्त भयभीत हो गए, क्योंकि आरम्भ में वे उसके विषय में यह सुनना सह नहीं सके कि ऐसा दर्शन भी अस्तित्व में हो सकता है। इसलिए वे अज्ञान के उस गड्ढे में जा गिरे जिसे “बाहरी अंधकार,” “अव्यवस्था,” “मृत्यु” और “अथाह गर्त” कहा जाता है। उसने उन्हें स्मृति के प्राणियों की श्रेणी से नीचे रखा, क्योंकि स्पष्ट था कि वह श्रेणी उनसे अधिक सामर्थी थी। वे उस अवर्णनीय अंधकार पर शासन करने के योग्य ठहराए गए, क्योंकि वह उन्हीं का है और उनके लिए निर्धारित भाग है। उसने यह अवसर दिया कि वे भी उस उद्धार-योजना में उपयोगी हों जो आगे प्रकट होनेवाली थी, [] यद्यपि <वे> स्वयं उससे अनजान थे।\n\n\n      जो अस्तित्व में आया उसके लिए हुए प्रकाशन, जो न्यून था उसके लिए हुए प्रकाशन, और जो उसके कारण अस्तित्व में आए उनके लिए हुए प्रकाशन में [बहुत] अन्तर है। उसने उसके\
