lexical_decisions:
- source_word: word
  choice: वचन
  rationale: यहाँ बोए गए और ज्ञान बनने वाले अर्थपूर्ण दिव्य संप्रेषण का भाव है; ‘वचन’ धार्मिक-दार्शनिक गरिमा बनाए रखता है।
- source_word: knowledge
  choice: ज्ञान
  rationale: ज्ञानात्मक तथा आध्यात्मिक दोनों संभावित अर्थों को बिना संकीर्ण किए सुरक्षित रखता है।
- source_word: orders
  choice: श्रेणियाँ
  rationale: अस्तित्वगत समूहों या व्यवस्थाओं के लिए तटस्थ शब्द; ‘आदेश’ का भ्रामक अर्थ टाला गया है।
- source_word: beings of memory
  choice: स्मृति के प्राणी
  rationale: असामान्य तकनीकी पद की पारदर्शिता बनाए रखी गई है; इसे किसी परिचित धार्मिक वर्ग में नहीं बदला गया।
- source_word: Little One
  choice: छोटा जन
  rationale: उपाधि का सामूहिक अथवा वर्गगत संकेत खुला रखते हुए शाब्दिक लघुता का भाव बचाया गया है।
- source_word: Exalted One
  choice: परम-उन्नत
  rationale: एक विशिष्ट उच्चतर सत्ता की उपाधि का भाव और निश्चितता सुरक्षित रखी गई है।
- source_word: those of the likeness
  choice: समानता से संबंधित प्राणी
  rationale: अंग्रेज़ी साक्ष्य में संबंध अस्पष्ट है; ‘प्रतिरूप’ या ‘सदृश लोग’ कहकर उसे अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: Chaos
  choice: अव्यवस्था
  rationale: नामवत ब्रह्मांडीय अवस्था का अर्थ सामान्य हिंदी पाठक तक पहुँचाता है।
- source_word: Abyss
  choice: अथाह गर्त
  rationale: गहराई और अगम्यता दोनों को व्यक्त करता है।
- source_word: repose
  choice: विश्राम
  rationale: शांति, स्थिरता और कष्ट से राहत के व्यापक आध्यात्मिक भाव को सुरक्षित रखता है।
- source_word: revelation
  choice: प्रकाशन
  rationale: अपने आपको दिखाने या ज्ञात कराने की क्रिया के लिए लगातार प्रयुक्त; केवल दृश्य ‘दर्शन’ तक सीमित नहीं करता।
theological_decisions:
- issue: बार-बार आने वाले पुरुषवाचक सर्वनामों के संदर्भ
  choice: मूल साक्ष्य की सर्वनामगत अस्पष्टता बनाए रखी गई
  alternative: हर स्थान पर ‘पुत्र,’ ‘वचन’ या किसी निश्चित सत्ता का नाम जोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य अनेक पूर्वपदों को स्पष्ट नहीं करता; किसी विशिष्ट धर्मवैज्ञानिक पहचान को थोपना उचित नहीं।
- issue: कोणीय कोष्ठकों में पुनर्स्थापित पाठ
  choice: <उसने>, <उसके>, <वे> जैसे संकेत यथावत रखे गए
  alternative: कोष्ठक हटाकर पाठ को निर्विवाद बनाना
  rationale: पांडुलिपीय पुनर्स्थापन की अनिश्चितता पाठक के सामने रहनी चाहिए।
- issue: ‘उद्धार की योजना’ में विरोधी समूहों की उपयोगिता
  choice: उन्हें भी योजना में उपयोगी ठहराए जाने का तनाव यथावत रखा गया
  alternative: इसे पश्चात्ताप, अंतिम उद्धार या केवल अनिच्छित साधन के रूप में समझाना
  rationale: पाठ उपयोगिता का दावा करता है, पर उसके धर्मवैज्ञानिक तंत्र को पूरी तरह स्पष्ट नहीं करता।
- issue: ‘उसके भीतर’ हुआ प्रकाशन
  choice: आंतरिक प्रकाशन की भाषा सीधे रखी गई
  alternative: इसे केवल मानसिक समझ या देहधारण के रूप में व्याख्यायित करना
  rationale: मूल कथन अनुभवगत और अस्तित्वगत दोनों अर्थों के लिए खुला है।
- issue: ‘योग्य ठहराए गए’ और अंधकार पर शासन
  choice: विडंबनापूर्ण या न्यायिक तनाव सुरक्षित रखा गया
  alternative: इसे पुरस्कार अथवा दंड में स्पष्ट रूप से बदलना
  rationale: साक्ष्य में ‘worthy’ का प्रयोग असामान्य है और उसका तनाव मिटाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और पठनीय रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। इसलिए तकनीकी पदों और सर्वनाम-संदर्भों में सावधानी बरती गई है। मूल साक्ष्य के कोणीय कोष्ठक <…>, वर्ग कोष्ठक […] और रिक्ति-संकेत [] सुरक्षित रखे गए हैं; कोई फुटनोट नहीं जोड़ा गया।
