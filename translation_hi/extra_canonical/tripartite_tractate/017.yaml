  revised_text: 'वचन का विचार—उस वचन का जिसने फिर अपनी स्थिरता पा ली थी और जो उन लोगों पर शासन करने लगा था जो उसके द्वारा अस्तित्व में आए थे—उन सभी के लिए जिन्हें उसने निर्णय के अनुसार उत्पन्न किया था, “युग” और “स्थान” कहलाया; अर्थात वह जिसे “उद्धार की सभा” कहा जाता है। क्योंकि उसने अपने आपको उस बिखराव से चंगा किया जो बहुविध विचार है, और वह एक विचार में लौट आया। उसे मिले उस विश्राम के कारण, जो उसने केवल अपने आपको प्रदान किया, वह इसी प्रकार “भंडार” भी कहलाता है।[a] वह “दुल्हन” भी कहलाता है, क्योंकि जिसने अपने आपको उसे सौंप दिया था, वह मिलन से फल पाने की आशा में आनंदित हुआ—अर्थात वह जो उसके सामने प्रकट हुआ था। वह “राज्य” भी कहलाता है, क्योंकि जिन्होंने उसके विरुद्ध युद्ध किया था, उन पर प्रभुत्व पाकर उसने दृढ़ता प्राप्त की और आनंद मनाया। और वह “प्रभु का आनंद” कहलाता है, क्योंकि उसने अपने आपको उस हर्ष से ओढ़ लिया था। ज्योति उसके साथ बनी रहती है और जो अच्छी वस्तुएँ उसकी हैं उनका प्रतिफल उसे देती है—अर्थात स्वतंत्रता के विचारों का।[b]


    जिस युग का हमने पहले उल्लेख किया है, वह एक-दूसरे से युद्ध करनेवालों के दोनों वर्गों से ऊँचा है। वह सत्ता चलानेवालों का साथी नहीं है और न ही उसका संबंध दुर्बलताओं और कमजोरियों से है—उन वस्तुओं से जो स्मृति और प्रतिरूप से संबंधित हैं। वचन ने अपने आपको जिस युग में रखा, वह पूर्णतः आनंदमय था, पदार्थ का रूप धारण किए हुए था, फिर भी अपने कारण का स्वभाव भी रखता था—उस कारण का जो प्रकट हुआ था। क्योंकि वह उन लोगों का प्रतिरूप था जो पूर्णता में निवास करते हैं और जो अस्तित्वमान के आनंद की समृद्धि से अस्तित्व में आए थे।


    इसके अतिरिक्त, जो अपने को प्रकट करनेवाला था उसके मुख को देखकर, उसके <आनंद>, प्रतीक्षा और उस बात की प्रतिज्ञा में आनंदित होकर जिसे उसने माँगा था, उसके पास पुत्र का नाम, उसका सार, उसकी सामर्थ्य और उसका रूप था।[c] वह वही है जिससे उसने प्रेम किया और जिसमें उसने आनंद पाया,[d] और जिसके लिए प्रेमपूर्वक प्रार्थनाएँ चढ़ाई गई थीं। यह युग ज्योति था, दृढ़ किए जाने की लालसा था, सिखाए जाने की तत्परता और देखने के लिए आँख था—ये वे गुण थे जो उसे उच्चस्थ जनों से प्राप्त थे। इसके अतिरिक्त, उद्धार-योजना में नीचे स्थित लोगों के विरोध में वह उसके विचार के लिए बुद्धि, बोलने के लिए वचन और ऐसी ही अन्य बातों की सिद्धता था।


