translation:
  language: hi
  text: 'वचन का विचार—उस वचन का, जिसने फिर से अपनी स्थिरता पा ली थी और जो उन सब पर शासन करने लगा था जो उसके द्वारा अस्तित्व में आए थे—“युग” और “स्थान” कहलाया। यह उन सभी के लिए था जिन्हें उसने निर्णय के अनुसार उत्पन्न किया था; इसे “उद्धार की सभा” भी कहा जाता है, क्योंकि उसने अपने आपको उस बिखराव से चंगा किया जो अनेक विचारों में होने के कारण था, और वह फिर एक विचार में लौट आया। इसी प्रकार, उसे मिले उस विश्राम के कारण—जो उसने केवल अपने आपको प्रदान किया—यह “भंडार” कहलाता है।[a] यह “दुल्हन” भी कहलाता है, क्योंकि जो अपने आपको उसके हवाले कर चुका था, वह मिलन से फल पाने की आशा में आनंदित हुआ—वही जो उसके सामने प्रकट हुआ था। यह “राज्य” भी कहलाता है, क्योंकि जिन्होंने उसके विरुद्ध युद्ध किया था उन पर प्रभुत्व पाकर उसने दृढ़ता प्राप्त की और आनंदित हुआ। और यह “प्रभु का आनंद” कहलाता है, क्योंकि उसने अपने आपको उस हर्ष से ओढ़ लिया था। ज्योति उसके साथ बनी रहती है और जो अच्छी वस्तुएँ उसकी हैं उनका प्रतिफल उसे देती है—अर्थात स्वतंत्रता के विचारों का।[b]


    जिस युग का हमने पहले उल्लेख किया, वह एक-दूसरे से लड़नेवाले दोनों वर्गों से ऊँचा है। वह सत्ता चलानेवालों का साथी नहीं है, और उसका संबंध दुर्बलताओं और कमजोरियों से नहीं—उन बातों से जो स्मृति और प्रतिरूप से संबंधित हैं। वचन ने अपने आपको जिस अवस्था में रखा, वह पूरी तरह आनंदमय युग था। उसमें पदार्थ का रूप था, फिर भी उसमें अपने कारण का स्वभाव भी था—उस कारण का जो प्रकट हुआ था—क्योंकि वह पूर्णता में निवास करनेवालों का प्रतिरूप था, जो अस्तित्वमान के आनंद की समृद्धि से अस्तित्व में आए थे।


    इसके अतिरिक्त, जो उसके सामने प्रकट हुआ था उसका मुख देखकर, उसके आनंद, प्रतीक्षा और अपनी माँगी हुई वस्तु की प्रतिज्ञा में मग्न होकर, उसके पास पुत्र का नाम और उसका सार, उसकी सामर्थ्य और उसका रूप था। यही वह था जिससे उसने प्रेम किया और जिसमें उसने आनंद पाया,[c] और जिसके लिए प्रेमपूर्वक प्रार्थनाएँ चढ़ाई गई थीं। यह युग ज्योति था; दृढ़ किए जाने की लालसा, सीखने की तत्परता और देखने के लिए आँख था—ये गुण उसे उच्चस्थ जनों से मिले थे। इसके अतिरिक्त, उद्धार की योजना में नीचे स्थित लोगों के विरोध में वह उसके विचार के लिए बुद्धि, बोलने के लिए वचन और ऐसी ही दूसरी बातों की सिद्धता था।


    और जो पूर्णता के प्रतिरूप के अनुसार उसके साथ-साथ स्वरूप में आए, उनके जनक वे हैं जो प्रकट हुए थे; उनमें से हर एक किसी एक आकृति की प्रतिलिपि है। वे पुरुषत्व के रूप हैं और उस दुर्बलता से उत्पन्न नहीं हुए जो स्त्रीत्व है; वे उससे उत्पन्न हुए जो पहले ही दुर्बलता से बच निकला था।[d] वे “कलीसिया” नाम धारण करते हैं, क्योंकि वे सामंजस्य के साथ उन प्रकट हो चुके लोगों की सभा के सामंजस्य के सदृश हैं। जो ज्योति के प्रतिरूप में अस्तित्व में आया, वह भी सिद्ध है, क्योंकि वह एकमात्र अस्तित्वमान ज्योति का प्रतिरूप है, जो समस्तताएँ है। यद्यपि वह उससे निम्न है जिसका वह प्रतिरूप है, फिर भी उसमें उसकी अविभाज्यता है, क्योंकि वह अविभाज्य ज्योति का मुख है।


    फिर भी, जो प्रत्येक युग के प्रतिरूप में अस्तित्व में आए, वे अपने सार में वही हैं जिनका हमने पहले उल्लेख किया; पर अपनी सक्रिय शक्ति में वे असमान हैं, क्योंकि वह उनमें से प्रत्येक में अलग-अलग प्रकार से विद्यमान है। एक-दूसरे के साथ इस एकीकरण में वे समान हैं,[e] पर प्रत्येक युग ने अपनी विशिष्ट भिन्नताएँ बनाए रखी हैं। इसी कारण उनमें भावावेग हैं, और भावावेग एक दुर्बलता है; क्योंकि वे पूर्णता की एकता से उत्पन्न नहीं हुए थे। इसके विपरीत, वे समय से पहले एक ही से उत्पन्न हुए—इससे पहले कि वह इसे पिता से, अथवा उसकी समस्तता और इच्छा के साथ एकता से, प्राप्त करता।[f]


    इसके बावजूद, यह भावी उद्धार-योजना के लिए लाभदायक था। उन्हें निचले स्थानों से होकर जाने दिया गया, क्योंकि वे स्थान उनके अचानक आगमन को ग्रहण नहीं कर सकते—उन्हें एक-एक करके ही आना होगा। उनका आगमन आवश्यक है, क्योंकि उन्हीं के द्वारा सब कुछ पूर्णता तक पहुँचाया जाएगा।


    संक्षेप में, वचन ने सब कुछ का दर्शन पाया—जो थे, जो अब हैं और जो होंगे—क्योंकि जो कुछ अस्तित्व में है, उस सबकी उद्धार-योजना उसे सौंपी गई है। कुछ वस्तुएँ पहले ही अस्तित्व को प्राप्त हो चुकी हैं, क्योंकि इसके पीछे एक उद्देश्य था। इसके विपरीत, जो बीज अभी अस्तित्व में आनेवाले हैं, उन्हें उसने अपने भीतर सुरक्षित रखा है, उस प्रतिज्ञा के कारण जो उसकी कल्पना की हुई बात से संबंधित थी—अर्थात उन बीजों की प्रतिज्ञा जो आगे अस्तित्व में आनेवाले थे। और उसने अपनी संतान उत्पन्न की, अर्थात जो उसने सोचा था उसका प्रकाशन। किंतु कुछ समय तक प्रतिज्ञात बीजों को अस्तित्व में आने से रोका गया, क्योंकि उन्हें उस समय के एक कार्य के लिए नियुक्त किया गया है जब उद्धारकर्ता और उसके साथी आएँगे—वे जो पिता के ज्ञान और महिमा में प्रथम हैं।'
  philosophy: optimal-equivalence
