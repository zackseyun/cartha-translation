translation:
  language: hi
  text: 'यदि वह अगम्य है, तो परिणामतः उसे जाना नहीं जा सकता। कोई भी विचार उसे ग्रहण नहीं कर सकता; वह सबके लिए अदृश्य है, किसी भी शब्द से उसका वर्णन नहीं किया जा सकता, और किसी भी हाथ की पहुँच से परे है। केवल वही अपने आपको वैसा जानता है जैसा वह [a] है, और अपने स्वरूप, अपनी महानता और अपने विस्तार को वैसा ही जानता है जैसे वे हैं। चूँकि वह अपने आपको विचार में ग्रहण कर सकता है, अपने आपको देख सकता है, अपना नाम ले सकता है और अपने आपको समझ सकता है, इसलिए केवल वही ऐसा है जिसका अपना मन, अपनी आँख, अपना मुख और अपना स्वरूप उसके अपने अस्तित्व के समतुल्य हैं। इस प्रकार वह वही है जिसे वह विचार में ग्रहण करता है, जिसे वह देखता है, जिसे वह कहता है और जिसे वह समझता है—जबकि वह स्वयं विचार से परे, अवर्णनीय, अग्राह्य और अपरिवर्तनशील है। पर जिसे वह विचार में ग्रहण करता, देखता और कहता है, और जिसका उसने विचार किया है, वह पोषणदायक, आनन्दमय, सत्य, मनभावना और विश्रामदायक है। वह समस्त बुद्धि से बढ़कर है और हर मन, सारी महिमा, सारी सुन्दरता, सारी मधुरता, सारी महानता, और हर गहराई तथा हर ऊँचाई से ऊपर है।


    जो अपने स्वभाव में अज्ञेय है और उन सभी महान गुणों से युक्त है जिन्हें मैंने गिनाया है, यदि वह अपनी मधुरता की समृद्धि से अपने ज्ञान का वरदान देना चाहे, ताकि उसे जाना जाए, तो वह ऐसा कर सकता है। ऐसा करने की उसकी सामर्थ्य उसकी इच्छा ही है। फिर भी वह महान अपने आपको मौन में रोके रखता है—वही जो समस्तताओं[b] को उनके अनन्त अस्तित्व में प्रकट करता है।


    [a] ठीक-ठीक कहें तो वह अवर्णनीय रीति से अपने आपको जन्म देता है, क्योंकि केवल वही स्वयं-जात है: वह अपने ही भीतर से विचारित हुआ है और अपने आपको वैसा जानता है जैसा वह है। अपनी अनन्त महानता, अपनी अथाह बुद्धि, अपनी अपरिमेय सामर्थ्य और स्वाद से परे अपनी मधुरता से वह वह सब उत्पन्न करता है जो उसके आदर, महिमा, सम्मान और स्तुति के योग्य है। वह जन्म देने की रीति से अपने आपको प्रकट करता है और महिमा, स्तुति, सम्मान तथा प्रेम ग्रहण करता है; और वह स्वयं अपनी महिमा और स्तुति करता है तथा अपने आपको सम्मान और प्रेम देता है। इस प्रकार उसका एक पुत्र है, जो उसी में विद्यमान है। वह उसके विषय में मौन रहता है; पुत्र अवर्णनीय में अवर्णनीय, अदृश्य में अदृश्य, अग्राह्य में अग्राह्य और अगम्य में अगम्य है।


    इस प्रकार पुत्र पिता में सदा विद्यमान है। जैसा हम पहले समझा चुके हैं, अजन्मी रीति से पिता अपने आपको अपने ही भीतर जानता है; उसने विचार के द्वारा अपने आपको जन्म दिया—अपने विषय का वह विचार, जो अपने ही बोध [c] का, अपनी अनन्त प्रकृति के […] का रूप है। फिर भी, ठीक-ठीक कहें तो वही मौन, बुद्धि और वरदान है—यदि उसे इस प्रकार कहना उचित हो। जैसे पिता, ठीक-ठीक कहें तो, विद्यमान है—जिससे पहले कोई [और विद्यमान नहीं था], और [जिसके] अतिरिक्त कोई दूसरा अजन्मा नहीं है—वैसे ही [पुत्र] भी, ठीक-ठीक कहें तो, विद्यमान है: उससे पहले कोई और विद्यमान नहीं था और उसके बाद कोई दूसरा पुत्र नहीं होगा। इसलिए वह पहलौठा और एकमात्र पुत्र है। वह पहलौठा है, क्योंकि उससे पहले कोई विद्यमान नहीं है; और वह एकमात्र पुत्र है, क्योंकि उसके बाद कोई नहीं होगा। इसके अतिरिक्त, उसका फल है, जो अपनी सर्वोपरि महानता के कारण अज्ञेय है। फिर भी उसने अपनी मधुरता की समृद्धि से चाहा कि उसका फल जाना जाए। उसने अवर्णनीय सामर्थ्य प्रकट की और उसे अपनी उदारता की महान सम्पदा में मिला दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि/साक्ष्य में पाठ लुप्त है। इसी चिह्न का अगला प्रयोग तीसरे अनुच्छेद के आरम्भ में एक अन्य पाठ-रिक्ति को दर्शाता है।
    reason: स्रोत में दोनों स्थानों पर खाली वर्ग-कोष्ठक हैं; संकेत को पारदर्शी रखते हुए अक्षर-चिह्न से जोड़ा गया।
  - marker: b
    text: ‘समस्तताएँ’ ग्रन्थ का विशिष्ट पारिभाषिक बहुवचन है; इसका आशय अस्तित्व की समस्त उत्पन्न पूर्णताओं या सत्ताओं से हो सकता है।
    reason: शाब्दिक बहुवचन हिन्दी में असामान्य है और पाठक को तकनीकी प्रयोग की सूचना आवश्यक है।
  - marker: c
    text: 'इसके बाद मूल साक्ष्य में पाठ लुप्त और खंडित है: ‘अपने ही बोध […] का, अपनी अनन्त प्रकृति के […] का’।'
    reason: क्षतिग्रस्त पाठ के कारण वाक्य का व्याकरण और आशय अनिश्चित है; अनुमान से पूर्ति नहीं की गई।
lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: अगम्य / अग्राह्य
  rationale: 'दो निकटवर्ती पर भिन्न धारणाओं को अलग रखा गया है: बौद्धिक समझ से परे के लिए ‘अगम्य’, और विचार द्वारा पकड़ में न आने के लिए ‘अग्राह्य’।”},{'
- source_word: Totalities
  choice: समस्तताएँ
  rationale: यह ग्रन्थ का विशिष्ट पारिभाषिक बहुवचन है; इसे केवल ‘सब कुछ’ बनाकर इसकी तकनीकी धारणा मिटाई नहीं गई।”},{
- source_word: self-begotten
  choice: स्वयं-जात
  rationale: आत्मोत्पत्ति की असामान्य धारणा को संक्षिप्त और औपचारिक रूप में बनाए रखता है, बिना उसे सामान्य ‘स्वयं उत्पन्न’ में हल्का किए।”},{
- source_word: Firstborn
  choice: पहलौठा
  rationale: जन्म-क्रम से जुड़ा पारंपरिक और समझने योग्य हिन्दी शब्द, जिसे आगे के कारण-वाक्य से स्पष्ट किया गया है।”},{
- source_word: only Son
  choice: एकमात्र पुत्र
  rationale: ‘इकलौता’ की तुलना में अधिक औपचारिक और प्रत्यक्ष; पाठ द्वारा दिए गए अर्थ—जिसके बाद कोई पुत्र नहीं होगा—को नहीं बदलता।”},{
- source_word: projects himself
  choice: अपने आपको प्रकट करता है
  rationale: यहाँ ‘प्रक्षेपित करता है’ अत्यधिक यांत्रिक लगता; ‘प्रकट करता है’ उत्सर्जन/अभिव्यक्ति के भाव को प्राकृतिक हिन्दी में रखता है, जबकि ‘जन्म देने की रीति से’ संदर्भ को सीमित करता है।”},{
- source_word: sustenance
  choice: पोषणदायक
  rationale: अंग्रेज़ी साक्ष्य की व्याकरणिक अस्पष्टता के बीच गुणों की समानांतर सूची के अनुरूप विशेषण रूप चुना गया।”},{
- source_word: scale
  choice: विस्तार
  rationale: व्यक्ति के संदर्भ में ‘पैमाना’ अप्राकृतिक है; ‘विस्तार’ परिमाण और व्यापकता दोनों को व्यक्त करता है।”},{
- source_word: silence
  choice: मौन
  rationale: दर्शनात्मक/व्यक्तीकृत अवधारणा की गरिमा और पुनरावृत्ति बनाए रखने वाला सीधा समतुल्य।” }],
- source_word: fruit
  choice: फल
  rationale: रूपक की वास्तविक अस्पष्टता को बनाए रखा गया; इसे ‘सन्तान’, ‘परिणाम’ या किसी विशिष्ट सत्ता के रूप में नहीं समझाया गया।
theological_decisions:
- issue: पिता द्वारा अपने आपको जन्म देने और पुत्र के अस्तित्व का संबंध
  choice: दोनों कथनों को पाठ की तनावपूर्ण भाषा में यथावत रखा गया
  alternative: ‘अपने आपको प्रकट किया’ कहकर आत्म-जन्म को रूपक बना देना
  rationale: साक्ष्य स्पष्टतः self-begotten और thought द्वारा begot himself कहता है; इसे किसी व्यवस्थित त्रित्व-सिद्धान्त के अनुसार नरम या पुनर्व्याख्यायित नहीं किया गया।
- issue: पिता और पुत्र की कालगत प्राथमिकता
  choice: ‘उससे पहले कोई और विद्यमान नहीं था’ तथा ‘पहलौठा’ दोनों कथन सुरक्षित रखे
  alternative: पुत्र की अनादिता या कालगत उत्पत्ति को स्पष्ट रूप से सिद्ध करना
  rationale: मूल साक्ष्य में मौजूद तनाव को हल करना अनुवादक का कार्य नहीं है।
- issue: पुत्र का पिता में होना
