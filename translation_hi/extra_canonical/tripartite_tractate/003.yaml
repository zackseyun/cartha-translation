translation:
  language: hi
  text: 'आरम्भ से केवल पुत्र ही अस्तित्व में नहीं था, बल्कि कलीसिया भी आरम्भ से अस्तित्व में थी। विषय के रहस्यमय स्वभाव के कारण यदि कोई यह समझता है कि पुत्र के इकलौता पुत्र होने की बात इस कथन का खण्डन करती है, तो ऐसा नहीं है। जैसे [यहाँ पाठ अधूरा है][a] पिता एकता है और उसने अपने आपको पिता के रूप में अपने सिवा किसी और पर प्रकट नहीं किया, वैसे ही पुत्र भी अपने सिवा किसी और का भाई नहीं पाया गया, क्योंकि वह अजन्मा और अनादि है। पिता पिता के रूप में अपने आप पर आश्चर्य करता है, और वह अपने आपको [महिमा][b], आदर और [प्रेम][c] देता है। इसके अतिरिक्त, वह अपने आपको पुत्र के रूप में भी समझता है—यह अनादि और अनन्त होने के गुणों के अनुरूप है। इस प्रकार यह बात पुष्ट होती है।


    उसकी असंख्य और असीम सन्तानें एक-दूसरे से अलग नहीं हैं। जो अस्तित्व में हैं, वे पुत्र और पिता से ऐसे निकले हैं जैसे उत्तम और कभी न तृप्त होने वाले भाव से एक-दूसरे को चूमने वालों के चुम्बन निकलते हैं: आलिंगन एक है, यद्यपि उसमें अनेक चुम्बन हैं। इसका अर्थ यह है कि कलीसिया उन अनेक व्यक्तियों से बनी है जो ईऑनों[d] से पहले अस्तित्व में थे; ठीक-ठीक कहें तो इसे “ईऑनों के ईऑन” कहा जाता है। अविनाशी पवित्र आत्माओं का स्वभाव ऐसा ही है। पुत्र उन पर विश्राम करता है, क्योंकि उसका स्वभाव यही है, जैसे पिता भी पुत्र पर [यहाँ पाठ अधूरा है][e] विश्राम करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्षी यहाँ पाण्डुलिपि में रिक्ति दर्शाता है; लुप्त शब्दों का अनुमान नहीं लगाया गया।
    reason: पाण्डुलिपि-क्षति को स्पष्ट करना और अनिश्चित सामग्री न गढ़ना।
  - marker: b
    text: “महिमा” उपलब्ध साक्षी में सम्पादकीय पुनर्स्थापना के रूप में कोष्ठकों में है।
    reason: पुनर्स्थापित पाठ को निर्विवाद मूल पाठ की तरह प्रस्तुत न करना।
  - marker: c
    text: “प्रेम” भी उपलब्ध साक्षी में सम्पादकीय पुनर्स्थापना है।
    reason: पाठगत अनिश्चितता सुरक्षित रखना।
  - marker: d
    text: “ईऑन” यूनानी मूल की पारिभाषिक संज्ञा है। इसका अर्थ केवल समय के “युग” हो सकता है, पर ऐसे ग्रन्थों में यह शाश्वत या आध्यात्मिक सत्ताओं/क्षेत्रों का संकेत भी दे सकती है।
    reason: मूल संज्ञा की अर्थगत व्यापकता और सम्भावित व्यक्तित्वपूर्ण अर्थ को बनाए रखना।
  - marker: e
    text: उपलब्ध साक्षी यहाँ भी पाण्डुलिपि में रिक्ति दर्शाता है; वाक्य का शेष अर्थ अनिश्चित है।
    reason: अन्तिम वाक्य की क्षति और अनिश्चितता बताना।
lexical_decisions:
- source_word: Church
  choice: कलीसिया
  rationale: यहाँ सामान्य भवन या संस्था नहीं, पूर्व-अस्तित्व रखने वाले सामूहिक आध्यात्मिक समुदाय का पारिभाषिक अर्थ है; ‘कलीसिया’ इस धार्मिक अर्थ को स्पष्ट रखता है।
- source_word: only son
  choice: इकलौता पुत्र
  rationale: पुत्र की अद्वितीयता और आगे आने वाले ‘भाई’ संबंधी तनाव को बिना समतल किए सुरक्षित रखता है।
- source_word: unity
  choice: एकता
  rationale: ‘एक’ भी सम्भव है, पर उपलब्ध साक्षी का अमूर्त भाव और दार्शनिक स्वर ‘एकता’ से बेहतर बना रहता है।
- source_word: unbegotten and without a beginning
  choice: अजन्मा और अनादि
  rationale: दोनों अलग विशेषताओं को संक्षिप्त, स्वाभाविक और पारिभाषिक हिन्दी में सुरक्षित रखा गया है।
- source_word: aeons
  choice: ईऑन
  rationale: यह इस ग्रन्थ की विशिष्ट ब्रह्माण्ड-विषयक संज्ञा हो सकती है; केवल ‘युग’ करने से व्यक्तित्वपूर्ण या आध्यात्मिक अर्थ मिट सकता है।
- source_word: reposes
  choice: विश्राम करता है
  rationale: मूल रूपक को बनाए रखता है और ‘निवास करता है’ जैसी व्याख्यात्मक निश्चितता नहीं जोड़ता।
theological_decisions:
- issue: पुत्र के इकलौते होने और कलीसिया के आरम्भ से अस्तित्व में होने का सम्बन्ध
  choice: दोनों कथनों के बीच विद्यमान तनाव को ज्यों का त्यों रखा गया है।
  alternative: इकलौतेपन को केवल पद, स्वभाव या उत्पत्ति के किसी निश्चित अर्थ तक सीमित करके विरोध मिटाना।
  rationale: उपलब्ध साक्षी स्वयं इसे रहस्यमय विषय कहता है और उसका पूर्ण तात्त्विक समाधान नहीं देता।
- issue: पिता का अपने आपको पुत्र के रूप में समझना
  choice: साक्षी के चौंकाने वाले कथन का सीधा अनुवाद किया गया है।
  alternative: इसे केवल पिता द्वारा पुत्र की कल्पना, उत्पत्ति या ज्ञान के रूप में समझाकर अनुवाद करना।
  rationale: ऐसी व्याख्या पाठ की वास्तविक अस्पष्टता और तात्त्विक तनाव को अनुचित ढंग से हल कर देगी।
- issue: ‘अविनाशी पवित्र आत्माओं’ और कलीसिया का सम्बन्ध
  choice: वाक्यों को निकट रखा गया, पर दोनों को पूर्णतः समान घोषित नहीं किया गया।
  alternative: स्पष्ट रूप से कहना कि पवित्र आत्माएँ ही कलीसिया हैं।
  rationale: साक्षी उनके चरित्र या स्वभाव की ओर संकेत करता है, किन्तु सम्बन्ध की सटीक प्रकृति अस्पष्ट है।
- issue: पिता और पुत्र से अस्तित्वमानों की उत्पत्ति
  choice: ‘पुत्र और पिता से ... निकले हैं’ रखा गया।
  alternative: किसी व्यवस्थित त्रित्ववादी या उत्सर्जनवादी सूत्र में पुनर्लेखन।
  rationale: पाठ के अपने संयुक्त उत्पत्ति-रूपक को बिना सम्प्रदायगत विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। दार्शनिक वाक्यरचना को जहाँ सम्भव था सहज किया गया, पर मूल की पहेली-जैसी पुनरुक्तियों और पिता–पुत्र सम्बन्धी अस्पष्टता को नहीं हटाया गया। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी अनुवाद है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
