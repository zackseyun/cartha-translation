  text: 'When the deficient Word became enlightened, his Fullness came into being. He escaped from those who had troubled him at first. He disentangled himself from them. He stripped off that prideful thought. When those who had at first disobeyed him prostrated and humbled themselves before him, he became mingled with the Repose.


    And <he> rejoiced because of the visitation of his visiting brothers. He glorified and praised those who had shown themselves to be a help to him. He gave thanks for escaping from those who had rebelled against him, and he esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good because they come from living things and resemble them in beauty, yet they are not equal to them in truth, because they do not come from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. Therefore, those produced from him are great, just as He Who Is is truly great.


    After he marveled at the beauty of those <who> had appeared to him, he declared his gratitude for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come into being through him, so that they could obtain something good. For he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Therefore, those whom he purposefully produced are on chariots, like those who came into being, those who appeared so that they could pass through every place of what is below, so that each of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory—a revelation of those from the decision of the aeons, which was a unity and a mercy—whereas they are only seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised [] while gazing at those whom he beseeched, so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and their hope in the promise, because they possess joy, a wealth of repose, and unsullied delights. Bestowing perfection with vision as the goal, he generated those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come into being would not perish by gazing upon the light, since they are unable to bear the great, lofty stature.'
translation:
  language: hi
  text: 'जब अपूर्ण वचन प्रकाशित हुआ, तब उसकी परिपूर्णता अस्तित्व में आ गई। जो आरम्भ में उसे व्याकुल करते थे, वह उनसे बच निकला। उसने अपने आपको उनसे छुड़ा लिया। उसने उस अभिमान-भरे विचार को उतार फेंका। जब आरम्भ में उसकी अवज्ञा करनेवालों ने उसके सामने दण्डवत् करके अपने आपको नम्र किया, तब वह विश्राम के साथ मिल गया।


    और <वह>[a] अपने उन भाइयों के आगमन से आनन्दित हुआ जो उससे मिलने आए थे। उसने उन लोगों की महिमा की और उनकी प्रशंसा की, जो उसके सहायक सिद्ध हुए थे। जिन लोगों ने उसके विरुद्ध विद्रोह किया था, उनसे बच निकलने के लिए उसने धन्यवाद दिया; और उसने महानता का तथा उन लोगों का आदर-सम्मान किया जिन्होंने अपने आपको उस पर प्रकट करने का निश्चय किया था। उसने जीवित स्वरूपों की जीवित प्रतिमाएँ उत्पन्न कीं। वे मनभावनी और अच्छी हैं, क्योंकि वे जीवित वस्तुओं से अस्तित्व में आई हैं और सुन्दरता में उनके समान हैं; फिर भी वास्तविकता में उनके बराबर नहीं हैं, क्योंकि वे उन्हें उत्पन्न करनेवाले और उस पर अपने आपको प्रकट करनेवाले के बीच के एकीकरण से उत्पन्न नहीं हुईं [].[b] फिर भी वह बुद्धि और ज्ञान से कार्य करता है और वचन को पूरी तरह अपने साथ मिला लेता है। इसलिए जो उससे उत्पन्न हुए हैं वे महान हैं, ठीक जैसे वह जो है वास्तव में महान है।


    जो <लोग>[c] उस पर प्रकट हुए थे, उनकी सुन्दरता पर अचम्भा करने के बाद उसने इस आगमन के लिए अपना आभार प्रकट किया। वचन ने अपने सहायकों की सहायता से यह कार्य किया। उसने ऐसा इसलिए किया कि जो उसके द्वारा अस्तित्व में आए थे, वे दृढ़ होकर कुछ अच्छा प्राप्त कर सकें; क्योंकि उसे उन सबके उद्धार की योजना के लिए प्रार्थना करना स्मरण रहा जिन्हें उसने उत्पन्न किया था—उस योजना को उन्हें स्थिर करने के लिए दृढ़ किया गया था।


    इसलिए जिन्हें उसने जानबूझकर उत्पन्न किया, वे रथों पर हैं—उनकी तरह जो अस्तित्व में आए, जो इसलिए प्रकट हुए कि वे नीचे के प्रत्येक स्थान से होकर जा सकें और उनमें से हर एक को उसके स्वभाव के अनुरूप स्थान दिया जा सके।


    यह समानता से सम्बन्ध रखनेवालों के लिए विनाशकारी है, पर स्मृति से सम्बन्ध रखनेवालों के लिए लाभकारी है। यह युगों के निर्णय से आनेवालों का प्रकाशन है—वह निर्णय जो एकता और दया था—जबकि वे केवल ऐसे बीज हैं जो अभी पूर्ण अस्तित्व तक नहीं पहुँचे हैं।[d]


    जो प्रकट हुआ, वह पिता और सामंजस्य का मुख था। वह समस्त अनुग्रहों का वस्त्र और उन लोगों का भोजन था जिन्हें वचन ने प्रार्थना, महिमा और प्रशंसा करते हुए उत्पन्न किया। यह वही है जिसकी उसने महिमा और प्रशंसा की [],[e] और जिनके लिए वह विनती करता था, उन पर दृष्टि लगाए रहा, ताकि अपनी उत्पन्न की हुई प्रतिमाओं के द्वारा उन्हें पूर्ण कर सके।


    वचन ने उनकी पारस्परिक सहायता और प्रतिज्ञा में उनकी आशा को बढ़ाया, क्योंकि उनके पास आनन्द, विश्राम की भरपूरी और निष्कलंक सुख हैं। दर्शन को लक्ष्य बनाकर पूर्णता प्रदान करते हुए उसने उन्हें उत्पन्न किया, जिन्हें उसने आरम्भ में स्मरण किया था, जब वे अभी उसके साथ नहीं थे। समस्त पूर्णताओं की तरह वह भी सिद्ध पिता में आशा और विश्वास रखता है।[f] वह उसके साथ मिलने से पहले ही उस पर प्रकट हो जाती है,[g] ताकि जो अस्तित्व में आए हैं वे प्रकाश को देखकर नष्ट न हो जाएँ, क्योंकि वे उस महान और अति ऊँचे स्वरूप को सह नहीं सकते।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोणीय कोष्ठक में दिया ‘वह’ सम्पादक द्वारा पूरित शब्द है।
    reason: अंग्रेज़ी साक्ष्य में सम्पादकीय पूर्ति का संकेत सुरक्षित रखना।
  - marker: b
    text: यहाँ पाण्डुलिपि में पाठ का कुछ भाग अनुपलब्ध या क्षतिग्रस्त है।
    reason: स्रोत में दिए रिक्त वर्ग-कोष्ठक के पाण्डुलिपि-क्षति संकेत को समझाना।
  - marker: c
    text: कोणीय कोष्ठक में दिया ‘लोग’ सम्पादक द्वारा पूरित शब्द है।
    reason: साक्ष्य की सम्पादकीय पूर्ति को दृश्य और स्पष्ट रखना।
  - marker: d
    text: ‘समानता’, ‘स्मृति’ और ‘युगों के निर्णय’ सम्भवतः इस ग्रन्थ के तकनीकी ब्रह्माण्डीय पद हैं; उपलब्ध साक्ष्य से उनका सटीक संदर्भ अनिश्चित है।
    reason: दुर्बोध तकनीकी पदों पर झूठी निश्चितता से बचना।
  - marker: e
    text: यहाँ भी पाण्डुलिपि में पाठ का कुछ भाग अनुपलब्ध या क्षतिग्रस्त है।
    reason: दूसरे रिक्त वर्ग-कोष्ठक के पाठ-क्षति संकेत को सुरक्षित रखना।
  - marker: f
    text: ‘समस्त पूर्णताएँ’ उस सामूहिक ब्रह्माण्डीय वास्तविकता का अनुवाद है जिसे साक्ष्य में ‘the Totalities’ कहा गया है।
    reason: असामान्य बहुवचन संज्ञा का आशय पाठक को बताना।
  - marker: g
    text: ‘वह’ सम्भवतः ‘परिपूर्णता’ की ओर संकेत करता है, पर सर्वनाम का संदर्भ निश्चित नहीं है।
    reason: अन्तिम वाक्य के वास्तविक संदर्भगत संशय को संरक्षित करना।
lexical_decisions:
- source_word: Word
  choice: वचन
  rationale: पाठ की व्यक्तिवाचक, ब्रह्माण्डीय संज्ञा को बनाए रखने वाला प्रतिष्ठित और सुबोध हिन्दी रूप।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: यहाँ सामान्य भरपूरी के बजाय एक विशिष्ट ब्रह्माण्डीय अवस्था/सत्ता का संकेत है; इसलिए संदर्भानुसार व्यक्तिवाचक अर्थ सुरक्षित रखा गया।
- source_word: Repose
  choice: विश्राम
  rationale: शान्त, स्थिर, पारलौकिक अवस्था या सत्ता—दोनों सम्भावनाएँ खुली रखता है।
- source_word: Greatness
  choice: महानता
  rationale: अमूर्त गुण और व्यक्तिवाचक ब्रह्माण्डीय सत्ता के बीच स्रोत की अस्पष्टता बनाए रखता है।
- source_word: aeons
  choice: युग
  rationale: ग्नॉस्टिक तकनीकी अर्थ पूरी तरह सामान्य हिन्दी में समाहित नहीं होता; ‘युग’ पठनीय है और पादटिप्पणी के बिना भी कालातीत/ब्रह्माण्डीय आशय देता है।
- source_word: Totalities
  choice: समस्त पूर्णताएँ
  rationale: बहुवचन सामूहिक ब्रह्माण्डीय पद को केवल ‘सब लोग’ बनाकर सपाट करने से बचाता है।
- source_word: vision
  choice: दर्शन
  rationale: सिर्फ भौतिक देखने के बजाय आध्यात्मिक अवलोकन का अर्थ सम्भव रखता है।
- source_word: figures / images
  choice: स्वरूप / प्रतिमाएँ
  rationale: मूल आदिरूप और उनसे बनी प्रतिकृतियों का भेद हिन्दी में स्पष्ट रखा गया।
theological_decisions:
- issue: वचन की कमी और बाद की परिपूर्णता
  choice: ‘अपूर्ण वचन’ और ‘उसकी परिपूर्णता’
  alternative: ‘दोषयुक्त लोगोस’ और ‘प्लेरोमा’
  rationale: स्रोत की धार्मिक विडम्बना और तनाव बनाए रखते हुए अनावश्यक यूनानी पारिभाषिक शब्द नहीं जोड़े गए।
- issue: ‘He Who Is’ की पहचान
  choice: ‘वह जो है’
  alternative: ‘परमेश्वर’ या ‘अस्तित्ववान’
  rationale: स्रोत किसी स्पष्ट नाम या व्यवस्थित ईश्वरशास्त्रीय पहचान पर बाध्य नहीं करता; शाब्दिक नामवत् अभिव्यक्ति अस्पष्टता बचाती है।
- issue: ‘likeness’ और ‘memory’ के समूह
  choice: ‘समानता से सम्बन्ध रखनेवाले’ और ‘स्मृति से सम्बन्ध रखनेवाले’
  alternative: इनको किसी निश्चित सम्प्रदाय, जाति या आत्मिक वर्ग के रूप में पहचानना
  rationale: अंग्रेज़ी साक्ष्य में तकनीकी अर्थ अस्पष्ट है; किसी संप्रदायगत वर्गीकरण को आयात नहीं किया गया।
- issue: अन्तिम अनुच्छेद में सर्वनामों के संदर्भ
  choice: स्त्रीलिंग ‘वह’ को निकटवर्ती ‘पूर्णता’ से सम्भवतः सम्बन्धित रखते हुए अस्पष्टता बनाए रखी
  alternative: हर सर्वनाम को निश्चित रूप से पिता, प्रकाश या परिपूर्णता से जोड़ना
  rationale: साक्ष्य सर्वनाम-संदर्भ को निर्णायक रूप से स्पष्ट नहीं करता।
- issue: ‘face of the Father and of the harmony’
