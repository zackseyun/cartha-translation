    Next he (adorned the place of) the inclination toward prayer and supplication. This was followed by forgiveness and the word about the one who was to appear.


    Every spiritual place subsists in a spiritual power. They are different from the beings of the memory, because their power is founded in an image, being what separates the Fullness from the Word. By contrast, the power – which operates in prophecy concerning the future – guides the beings of the memory <who came into being for the sake of> what is pre-existent. This prevents them from comingling with the things that attain being through a vision of things that abide with him.'
translation:
  language: hi
  text: 'उसकी की हुई प्रार्थना और उससे हुए मन-फिराव को देखते हुए यह उचित है कि कुछ नाश हों, कुछ लाभ पाएँ, और कुछ अन्य अलग ठहराए जाएँ।[a] सबसे पहले उसने अवज्ञाकारियों के दंड की तैयारी की। इसके लिए उसने उस प्रकट हुए जन से मिली सामर्थ्य का उपयोग किया, जिससे उसे सब वस्तुओं पर अधिकार मिला था, ताकि वह उससे अलग हो जाए। वही नीचे वाला है, और वह परम-उच्च से तब तक अलग रहता है, जब तक वह सब वस्तुओं के लिए उद्धार की योजना को बाहरी रूप में तैयार नहीं कर देता और प्रत्येक को उसका निर्धारित स्थान नहीं दे देता।


    जब वचन ने समस्तताओं को सुव्यवस्थित किया, तब उसने पहले अपने आपको उन अस्तित्व में आई वस्तुओं के मूलभूत नियम, कारण और शासक के रूप में स्थापित किया; जैसे पिता—जो इस स्थापना का कारण है—उसके बाद अस्तित्व में आने वाला प्रथम था।[b] उसने पूर्व-अस्तित्ववान प्रतिरूपों की रचना की, जिन्हें उसने धन्यवाद और महिमा के साथ उत्पन्न किया।


    फिर उसने उन लोगों के लिए स्थान सुव्यवस्थित किया जिन्हें उसने महिमा में उत्पन्न किया था। वह स्थान “परादीस,” “आनंद,” “पोषण से परिपूर्ण हर्ष,” और “पूर्व-अस्तित्ववानों का हर्ष” कहलाता है।[c] वह परिपूर्णता में निवास करने वाली सभी अच्छी वस्तुओं का प्रतिरूप सुरक्षित रखता है।


    फिर उसने राज्य को ऐसी नगरी के रूप में सुव्यवस्थित किया जो हर मनोहर वस्तु से भरी थी—अर्थात भाईचारे के प्रेम और भरपूर उदारता से—और जो पवित्र आत्माओं तथा उन पर शासन करने वाली शक्तिशाली सामर्थ्यों से परिपूर्ण थी।[d] इन्हें वचन ने उत्पन्न किया और सामर्थ्य के साथ स्थापित किया।


    इसके बाद सुव्यवस्थित किए जाने के लिए कलीसिया का स्थान था, जो इस स्थान में एकत्र होती है और युगों में निवास करने वाली कलीसिया का स्वरूप धारण करती है, ताकि पिता की महिमा हो।


    इनके बाद उसने विश्वास और आशा से उत्पन्न आज्ञाकारिता का स्थान सुव्यवस्थित किया। जब प्रकाश प्रकट हुआ, तब वचन ने इन्हें प्राप्त किया।


    इसके बाद उसने प्रार्थना और विनती की ओर झुकाव का स्थान सुव्यवस्थित किया। इसके पीछे क्षमा और उस जन के विषय का वचन आया जो प्रकट होने वाला था।


    हर आत्मिक स्थान किसी आत्मिक सामर्थ्य में स्थित रहता है। वे स्मृति के प्राणियों से भिन्न हैं, क्योंकि उनकी सामर्थ्य एक प्रतिरूप में स्थापित है—वही परिपूर्णता को वचन से अलग करती है। इसके विपरीत, वह सामर्थ्य जो भविष्य के विषय में भविष्यवाणी में कार्य करती है, स्मृति के उन प्राणियों का मार्गदर्शन करती है जो पूर्व-अस्तित्ववान के निमित्त अस्तित्व में आए।[e] इससे वे उन वस्तुओं के साथ घुल-मिल नहीं पाते जो उसके साथ बनी रहने वाली वस्तुओं के दर्शन के द्वारा अस्तित्व प्राप्त करती हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान पर उपलब्ध साक्ष्य में पाठ का कुछ भाग लुप्त है; इसलिए वाक्य-संबंध अनिश्चित है।
    reason: अंग्रेज़ी साक्ष्य के [] पाठ-लोप संकेत को प्रकाशनयोग्य टिप्पणी में सुरक्षित करना।
  - marker: b
    text: यह वाक्य उपलब्ध साक्ष्य में व्याकरणिक रूप से कठिन है; ‘उसके बाद’ किसकी ओर संकेत करता है, यह निश्चित नहीं।
    reason: पिता और वचन के क्रम के संबंध में वास्तविक पाठगत अस्पष्टता बताना।
  - marker: c
    text: उपलब्ध साक्ष्य में ‘पूर्व-अस्तित्ववानों का हर्ष’ पद के भीतर ‘का’ संपादकीय रूप से पूरा किया गया है।
    reason: अंग्रेज़ी साक्ष्य के कोणीय कोष्ठक वाले पूरक को दर्ज करना।
  - marker: d
    text: ‘परिपूर्ण थी’ के निकट उपलब्ध साक्ष्य में पाठ का कुछ भाग लुप्त है।
    reason: दूसरे [] पाठ-लोप संकेत को सुरक्षित करना।
  - marker: e
    text: ‘जो पूर्व-अस्तित्ववान के निमित्त अस्तित्व में आए’ उपलब्ध साक्ष्य में संपादकीय रूप से पूरा किया गया पाठ है।
    reason: कोणीय कोष्ठक से सूचित पुनर्निर्माण को पाठक के सामने स्पष्ट करना।
lexical_decisions:
- source_word: Word
  choice: वचन
  rationale: ग्रंथ के विशिष्ट मध्यस्थ सत्तावाचक पद को हिन्दी की परिचित, गरिमापूर्ण संज्ञा में रखा गया है; व्यक्तिवाचक प्रयोग स्पष्ट है।
- source_word: Totalities
  choice: समस्तताएँ
  rationale: बहुवचन और तकनीकी व्यापकता बनाए रखने के लिए सामान्य ‘सब कुछ’ के बजाय संज्ञात्मक बहुवचन चुना गया।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: तकनीकी ब्रह्मांड-विज्ञान संबंधी अर्थ को बनाए रखते हुए सहज हिन्दी पद चुना गया।
- source_word: Church
  choice: कलीसिया
  rationale: सामान्य भवन के बजाय एकत्रित समुदाय तथा उसके पारलौकिक प्रतिरूप—दोनों अर्थों को सुरक्षित रखता है।
- source_word: aeons
  choice: युग
  rationale: स्रोत-साक्ष्य की पारलौकिक काल/सत्ता संबंधी अस्पष्टता को बिना अतिरिक्त व्याख्या के रहने देता है।
- source_word: beings of the memory
  choice: स्मृति के प्राणी
  rationale: असामान्य तकनीकी पदबंध को व्याख्यात्मक रूप से सामान्यीकृत किए बिना निकट रूप में रखा गया।
- source_word: adorned
  choice: सुव्यवस्थित किया
  rationale: यहाँ केवल सजावट नहीं, ब्रह्मांडीय व्यवस्था और स्थान-निर्धारण अभिप्रेत प्रतीत होता है; ‘सुव्यवस्थित’ दोनों पहलू समेटता है।
- source_word: conversion
  choice: मन-फिराव
  rationale: परिवर्तन/वापसी की धार्मिक और दिशात्मक गुंजाइश को बनाए रखने वाला स्वाभाविक हिन्दी पद।
theological_decisions:
- issue: पिता और वचन के अस्तित्व-क्रम वाला व्याकरणिक रूप से कठिन वाक्य
  choice: वाक्य की असहज तुलना और क्रम को यथासंभव सुरक्षित रखा गया
  alternative: वचन को स्पष्ट रूप से पिता के बाद प्रथम उत्पन्न सत्ता घोषित करना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में कर्ता-संबंध अस्पष्ट है; संप्रदायगत या तत्त्वमीमांसक निष्कर्ष थोपना उचित नहीं।
- issue: ‘the one who had appeared’ और ‘the one who was to appear’ की पहचान
  choice: क्रमशः ‘प्रकट हुआ जन’ और ‘प्रकट होने वाला जन’
  alternative: दोनों को मसीह या किसी विशिष्ट उद्धारकर्ता के रूप में नामित करना
  rationale: साक्ष्य स्वयं पहचान स्पष्ट नहीं करता; अनिश्चितता संरक्षित है।
- issue: ‘spiritual power’ में spirit/Spirit का प्रश्न
  choice: ‘आत्मिक सामर्थ्य’
  alternative: ‘पवित्र आत्मा की सामर्थ्य’
  rationale: मूल साक्ष्य सामान्य गुणसूचक प्रयोग देता है; त्रिएकवादी विशिष्टता जोड़ना स्रोत से अधिक कहना होता।
- issue: salvation plan ‘outwardly’
  choice: ‘बाहरी रूप में’
  alternative: ‘सबके सामने’ या ‘भौतिक जगत में’
  rationale: दिशात्मक/क्षेत्रगत अस्पष्टता को किसी एक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय गद्य अपनाया गया है। तकनीकी सत्तावाचक पदों—वचन, समस्तताएँ, परिपूर्णता और कलीसिया—को स्थिर रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम अनुवाद है; कॉप्टिक स्रोत-पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन वाक्यों और पाठ-लोपों में सावधानीपूर्वक अस्पष्टता बनाए रखी गई है।
