base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/013.yaml
  text: 'The others had a stronger lust for control because they were more honorable [] than the former ones, who had risen up against them. They refused to humble themselves, thinking that they had originated from themselves and had no beginning, and, as for giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control because of their way of being. As a result, they were flooded with powers and natures that typify mutual combat, possessing lust for control and everything else like it. From these things, empty love of glory drove them to desire control, although not one of them possessed the exalted thought or recognized it.


    The forces of this thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind had harmony among themselves. They, however, battled against the order of those of the likeness, while the order of those of the likeness waged war against the likenesses and acted against them in its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he did not cease [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse kinds of matter and powers of different kinds, intermixed in great numbers. Meanwhile, the Word, who caused them to be begotten, was awaiting in his mind a revelation of the [hope] that was to come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. As for those of the shadow, he distanced himself from them completely because they warred against him and did not humble themselves before him in the least. But he found rest in those who belonged to memory. As for those who came into being through memory, the Word produced, in an unseen manner and in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above, bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
translation:
  language: hi
  text: 'दूसरों में प्रभुत्व की लालसा अधिक प्रबल थी, क्योंकि वे उन पहले वालों से अधिक सम्मानित थे, जो उनके विरुद्ध उठ खड़े हुए थे। वे अपने को दीन करने को तैयार नहीं थे। वे सोचते थे कि वे स्वयं अपने से उत्पन्न हुए हैं और उनका कोई आरम्भ नहीं है; और जहाँ तक उत्पन्न करने की बात थी, वे मानते थे कि दूसरों को उत्पन्न करने वाले सबसे पहले वही थे। दोनों वर्ग अपने अस्तित्व के ढंग के कारण प्रभुत्व के लिए लड़ते हुए एक-दूसरे से युद्ध करने लगे। परिणामस्वरूप वे ऐसी शक्तियों और स्वभावों से भर गए जो आपसी संघर्ष की दशा को प्रकट करते हैं और जिनमें प्रभुत्व की लालसा तथा वैसी ही हर दूसरी प्रवृत्ति थी। इनसे उपजी खोखली यश-लालसा ने उन्हें प्रभुत्व चाहने के लिए उकसाया, जबकि उनमें से न तो किसी के पास वह उच्चतर विचार था, न किसी ने उसे पहचाना।


    इस विचार की शक्तियाँ पूर्व-अस्तित्वमान जनों के <नामों> से सुसज्जित की गईं, जिनके वे प्रतिरूप हैं। इस प्रकार के जनों के वर्ग में आपसी सामंजस्य था। फिर भी उन्होंने समानता वाले जनों के वर्ग से युद्ध किया, जबकि समानता वाले जनों के वर्ग ने प्रतिरूपों के विरुद्ध युद्ध छेड़ दिया और क्रोध में उनके विरुद्ध काम किया। [a] इसी से यह [हुआ ... उनका] अपना [एक-दूसरे के विरुद्ध], बहुत-से [...] अनिवार्यता ने उन्हें इस प्रकार स्थापित किया [...] कि वे प्रबल हो सकें [...] वह रुका नहीं [...] और उनकी ईर्ष्या, [उनका] क्रोध, हिंसा, लालसा और अज्ञान सफल हुए; उन्होंने अनेक प्रकार के द्रव्य और भिन्न-भिन्न प्रकार की शक्तियाँ उत्पन्न कीं, जो बड़ी संख्या में आपस में मिली हुई थीं। इस बीच वचन, जिसने उन्हें उत्पन्न कराया था, अपने मन में उस [आशा] के प्रकाशन की प्रतीक्षा कर रहा था जो ऊपर से उसके पास आने वाली थी।


    जब वचन ने अपने को सक्रिय किया, तो उसे परम-उच्च के लिए आशा और प्रतीक्षा प्राप्त हुई। जहाँ तक छाया से सम्बन्ध रखने वालों की बात है, वह उनसे पूरी तरह दूर हो गया, क्योंकि वे उससे युद्ध करते थे और उसके सामने तनिक भी दीन नहीं हुए। परन्तु स्मृति से सम्बन्ध रखने वालों में उसे विश्राम मिला। जो स्मृति के द्वारा अस्तित्व में आए थे, उनके विषय में वचन ने अदृश्य रीति से और उनके स्वभाव के अनुरूप उस जन को उत्पन्न किया जो ऊँचाई पर चढ़ गया और उस जन को स्मरण करता रहा जिसमें कमी थी—जब तक कि ऊपर से उस पर प्रकाश नहीं चमका और उसे जीवन प्रदान नहीं किया; यह प्रकाश पूर्व-अस्तित्वमान पूर्णताओं के बीच भ्रातृ-प्रेम के विचार से उत्पन्न हुआ था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि का पाठ अत्यन्त खंडित है। कोष्ठक सम्भावित पुनर्स्थापन और बिंदु लुप्त अथवा अपठनीय अंश दर्शाते हैं; इसलिए वाक्य का क्रम और अर्थ अनिश्चित है।
    reason: मुख्य पाठ में संरक्षित रिक्तियों, पुनर्स्थापनों और विखंडित व्याकरण के कारण पाठकीय चेतावनी आवश्यक है।
lexical_decisions:
- source_word: lust for control
  choice: प्रभुत्व की लालसा
  rationale: सत्ता पर अधिकार की तीव्र और अव्यवस्थित चाह को स्पष्ट रखता है; केवल ‘नियंत्रण’ से अधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: orders
  choice: वर्ग
  rationale: यहाँ सुव्यवस्थित समूहों या श्रेणियों का बोध है; ‘आदेश’ अर्थभ्रम पैदा करता।
- source_word: the Word
  choice: वचन
  rationale: विशिष्ट ब्रह्माण्ड-विज्ञानात्मक सत्ता के रूप में पद की पारंपरिक गरिमा और पहचान बनाए रखता है।
- source_word: memory
  choice: स्मृति
  rationale: अमूर्त तत्त्व या क्षेत्र के रूप में मूल संज्ञा की खुली अर्थवत्ता सुरक्षित रखता है।
- source_word: Fullnesses
  choice: पूर्णताएँ
  rationale: बहुवचन और तकनीकी ब्रह्माण्ड-विज्ञानात्मक अर्थ दोनों सुरक्षित हैं; इसे किसी एक ‘परिपूर्णता’ में नहीं समेटा गया।
- source_word: matter
  choice: द्रव्य
  rationale: दार्शनिक और ब्रह्माण्ड-विज्ञानात्मक प्रसंग में ‘पदार्थ’ की अपेक्षा अधिक उपयुक्त तथा गरिमापूर्ण।
- source_word: likeness / likenesses
  choice: समानता वाले जन / प्रतिरूप
  rationale: अंग्रेज़ी साक्ष्य में एकवचन सामूहिक वर्ग और बहुवचन प्रतिनिधि रूपों के बीच जो संभावित भेद है, उसे यथासम्भव दर्शाता है; कॉप्टिक समीक्षा लंबित है।
theological_decisions:
- issue: सत्ताओं का स्वयंभू और अनादि होने का दावा
  choice: 'इसे पात्रों की धारणा के रूप में रखा गया: ‘वे सोचते थे...’'
  alternative: उन्हें वस्तुतः स्वयंभू और अनादि बताना
  rationale: पाठ उनके दावे का वर्णन करता है, उसकी सत्यता की पुष्टि नहीं; धार्मिक तनाव को बिना निर्णय दिए सुरक्षित रखा गया।
- issue: ‘the Exalted One’ की पहचान
  choice: परम-उच्च
  alternative: परमेश्वर या पिता
  rationale: मूल साक्ष्य किसी विशिष्ट पहचान को स्पष्ट नहीं करता; अधिक निश्चित धार्मिक पद जोड़ना अनुचित होता।
- issue: अंतिम वाक्य में प्रकाश का जन्म और जीवनदान
  choice: ‘यह प्रकाश ... विचार से उत्पन्न हुआ था’
  alternative: ऊपर चढ़ने वाले जन या जीवन को उत्पन्न मानना
  rationale: अंग्रेज़ी वाक्य की व्याकरणिक संबद्धता अस्पष्ट है। निकटतम सम्भावित पूर्वपद ‘प्रकाश’ को चुना गया, पर इसे निर्णायक स्रोत-पाठ निष्कर्ष नहीं माना गया।
- issue: ‘the one who ascended’ और ‘the one who had been deficient’
  choice: दोनों को ‘जन’ कहकर अलग संदर्भों की सम्भावना खुली रखी
  alternative: दोनों को एक ही सत्ता के रूप में स्पष्ट करना
  rationale: साक्ष्य पहचान को निर्णायक रूप से नहीं सुलझाता; अनावश्यक समानीकरण से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। तकनीकी ब्रह्माण्ड-विज्ञानात्मक पदों—वचन, स्मृति, पूर्णताएँ, प्रतिरूप—को सरलीकृत धार्मिक समानार्थकों में नहीं बदला गया। कोणीय कोष्ठक, वर्ग कोष्ठक और दीर्घविराम मूल साक्ष्य के पाठगत संकेतों के रूप में सुरक्षित हैं। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर स्रोत-सचेत रूप से आधारित है।
