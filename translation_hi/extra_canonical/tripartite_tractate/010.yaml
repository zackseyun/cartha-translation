base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/010.yaml
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
translation:
  language: hi
  text: '**त्रिभागी ग्रंथ — प्रसरण का स्वरूप**


    समग्रताएँ,[a] जो उस अस्तित्वमान से हैं, उनका प्रसरण एक-दूसरे से अलग हो जाने के द्वारा नहीं हुआ, मानो उन्हें जन्म देने वाले ने [कोई वस्तु] त्यागकर फेंक दी हो।[b] इसके बजाय, उनका जन्म विस्तार की एक क्रिया के समान है: जैसे पिता अपने प्रिय जनों की ओर स्वयं को फैलाता है, ताकि [वे] जो उससे उत्पन्न हुए हैं, वह भी बन सकें। वर्तमान युग एक इकाई होते हुए भी समय की इकाइयों में बँटा है; वे इकाइयाँ वर्षों में, वर्ष ऋतुओं में, फिर ऋतुएँ महीनों में, महीने दिनों में, दिन घंटों में और घंटे मिनटों में बँटे हैं। इसी प्रकार, [] सत्य का युग एक भी है और अनेक भी; इसलिए हर एक जितना उसे समझ सकता है, उसके अनुसार वह गौण और महत्त्वपूर्ण नामों से सम्मानित होता है। एक उपमा में वह ऐसे सोते के समान है, जो वही बने रहने पर भी बहता है और बढ़कर धाराओं, झीलों, नहरों और शाखाओं में फैल जाता है। अथवा वह ऐसी जड़ के समान है जो वृक्षों के नीचे फैलती है और उनके फलों समेत शाखाएँ निकालती है; या ऐसे मानव-शरीर के समान, जो अलग हुए बिना अनेक शाखायुक्त अंगों में विभाजित है—मुख्य और गौण, बड़े और छोटे।


    युग-सत्ताओं[c] ने अपनी स्वतंत्र इच्छा से और उस समझ के द्वारा, जो उसने उन्हें विचार करने के लिए दी थी, तीसरे फल के साथ सहमति में स्वयं को उत्पन्न किया। वे उस चीज़ के साथ महिमा देना नहीं चाहते, जिसे अलग-अलग पूर्णताओं[d] ने [स्तुति] के वचनों के रूप में एकमत होकर उत्पन्न किया। न वे संपूर्ण समग्रता के साथ महिमा देना चाहते हैं, न किसी ऐसी अकेली युग-सत्ता के साथ, जो अपने स्थान या अवस्था से ऊँचे स्थान या अवस्था तक पहुँच गई हो—जब तक कि वह अधिक ऊँचे नाम और ऊँचे स्थान वाले से <वह> प्राप्त न कर ले जिसकी इच्छा की गई थी। [] वे ऊँचे स्थान पर एक-दूसरे को ग्रहण करते हैं। जो और ऊँचा उठना चाहता था, वह मानो स्वयं को जन्म देता है—उस दूसरे के साथ और जो कुछ वह है उसके साथ स्वयं को जन्म देता हुआ। वह उस जन के साथ नया किया जाता है जो उसके भाई से उसके पास आया था; वह उसे देखता और उस विषय में उससे विनती करता है।[e]


    यह सब इसी रीति से हो, इसलिए जो महिमा देना चाहता था, वह इसके सिवा उस विषय में उससे कुछ नहीं कहता; क्योंकि पूर्णता में वाणी की एक सीमा ठहराई गई है। इस कारण वे पिता की अगम्यता के विषय में मौन रहते हैं, फिर भी उसे समझने की अपनी इच्छा के विषय में बोलने की उन्हें अनुमति है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समग्रताएँ’ इस ग्रंथ का तकनीकी बहुवचन है; इसका आशय उस अस्तित्वमान से निकली संपूर्ण सत्ताओं या पूर्ण वास्तविकताओं से है, पर उपलब्ध गवाह इसकी सीमा पूरी तरह स्पष्ट नहीं करता।
    reason: तकनीकी पद को सामान्य हिन्दी में गलत अर्थ दिए जाने से बचाना।
  - marker: b
    text: वर्ग कोष्ठकों में शब्द अनुवाद-गवाह द्वारा पूरित माने गए हैं; खाली [] पाठ में रिक्ति या अस्पष्ट अंश को दर्शाता है, और कोणीय कोष्ठक < > अनिश्चित रूप से पुनःस्थापित शब्द को।
    reason: पांडुलिपीय और संपादकीय संकेतों को पारदर्शी रखना।
  - marker: c
    text: ‘युग-सत्ताएँ’ यूनानी मूल के तकनीकी पद ‘aeons’ का अर्थ-संकेतक रूप है; यहाँ ये केवल समय-खंड नहीं, बल्कि व्यक्तिकृत सत्ताएँ भी हैं।
    reason: समयवाची और सत्तावाची दोनों अर्थों को बनाए रखना।
  - marker: d
    text: ‘पूर्णताएँ’ तकनीकी पद ‘Fullnesses’ का बहुवचन है; आगे एकवचन ‘पूर्णता’ भी आता है। दोनों का सटीक पारस्परिक संबंध इस अंश में निश्चित नहीं है।
    reason: एकवचन और बहुवचन की धर्मवैचारिक विशिष्टता को न मिटाना।
  - marker: e
    text: इस अनुच्छेद के सर्वनाम और संबंध उपलब्ध अंग्रेज़ी गवाह में अत्यंत अस्पष्ट हैं; इसलिए ‘दूसरा’, ‘वह’, ‘उसका भाई’ और ‘उसके पास’ को अनुमान से किसी निश्चित सत्ता से नहीं जोड़ा गया।
    reason: वास्तविक पाठगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: emanation
  choice: प्रसरण
  rationale: ‘प्रसरण’ स्रोत के ऐसे निकलने या फैलने का भाव रखता है जिसमें मूल से कटकर अलग हो जाना आवश्यक नहीं; आगे दिए विस्तार, सोते और जड़ के बिंबों से भी इसका मेल है।
- source_word: Totalities
  choice: समग्रताएँ
  rationale: बहुवचन और तकनीकी सामूहिक अर्थ को बनाए रखने के लिए ‘समग्रताएँ’ चुना गया; इसे ‘सृष्टि’ या ‘सब प्राणी’ कहने से पाठ की विशिष्ट अवधारणा अनावश्यक रूप से सीमित हो जाती।
- source_word: the existent one
  choice: वह अस्तित्वमान
  rationale: स्रोत की दार्शनिक संज्ञा और उसकी कुछ असामान्य अभिव्यक्ति को बचाया गया; ‘परमेश्वर’ जोड़कर पहचान को निश्चित नहीं किया गया।
- source_word: aeons
  choice: युग-सत्ताएँ
  rationale: केवल ‘युग’ समयावधि का अर्थ दे सकता था, जबकि यहाँ व्यक्तिकृत/अधिभौतिक सत्ताएँ अभिप्रेत हैं; संयुक्त पद दोनों पहलुओं को संकेत करता है।
- source_word: Fullness / Fullnesses
  choice: पूर्णता / पूर्णताएँ
  rationale: तकनीकी अर्थ को यथासंभव शाब्दिक रखा गया और इसे किसी बाद की व्यवस्थित धर्मशास्त्रीय परिभाषा से नहीं बाँधा गया।
- source_word: ungraspability
  choice: अगम्यता
  rationale: यह पिता को पूरी तरह समझ या ग्रहण न कर पाने का भाव संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: उत्पन्न जनों का पिता ‘बनना’
  choice: ‘वह भी बन सकें’
  alternative: ‘उसके समान बन सकें’
  rationale: स्रोत का कथन अधिक प्रबल और धर्मवैचारिक रूप से तनावपूर्ण है; ‘उसके समान’ कहने से उस तनाव का अनधिकृत समाधान हो जाता।
- issue: एक और अनेक सत्य-युग
  choice: ‘एक भी है और अनेक भी’
  alternative: ‘एकता में अनेक रूप रखता है’
  rationale: मूल विरोधाभासी सूत्र को व्याख्यात्मक सामंजस्य में बदले बिना सुरक्षित रखा गया।
- issue: स्वयं को जन्म देने वाली युग-सत्ताएँ
  choice: ‘स्वयं को उत्पन्न किया’ और ‘स्वयं को जन्म देता है’
  alternative: ‘प्रकट हुईं’
  rationale: स्रोत की आत्म-जनन संबंधी कठिन भाषा को नरम या सामान्य नहीं किया गया।
- issue: पिता की अगम्यता और उसे समझने की इच्छा
  choice: दोनों कथनों को साथ रखा गया
  alternative: इच्छा को केवल आराधना या ज्ञान-प्राप्ति के रूप में स्पष्ट करना
  rationale: पाठ स्वयं मौन की सीमा और समझने की अनुमति के बीच तनाव बनाए रखता है।
- issue: अस्पष्ट सर्वनाम और ऊँचे स्थान की प्रक्रिया
  choice: सर्वनामों को यथासंभव अनिर्धारित रखा गया
  alternative: हर सर्वनाम के लिए निश्चित पात्र निर्दिष्ट करना
  rationale: उपलब्ध गवाह में संदर्भ अस्पष्ट हैं; किसी पात्र-संबंध को अनुमान से निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। तकनीकी ग्नॉस्टिक पदों के लिए अर्थ-संकेतक हिन्दी रूप दिए गए हैं और प्रथम प्रयोग पर टिप्पणियाँ जोड़ी गई हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया, पर विरोधाभास, पुनरुक्ति, सर्वनामगत अनिश्चितता और पांडुलिपीय संकेत नहीं हटाए गए। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी गवाह पर आधारित है; नाग हम्मादी कॉप्टिक पाठ से प्रत्यक्ष समीक्षा अभी लंबित होने के कारण सभी सूक्ष्म स्रोत-भाषिक निष्कर्ष अस्थायी माने जाएँ।
