  revised_text: '**त्रिभागी ग्रंथ — प्रसरण का स्वरूप**


    समग्रताएँ,[a] जो उस अस्तित्वमान से हैं, उनका प्रसरण एक-दूसरे से अलग होने के द्वारा नहीं हुआ, मानो उन्हें जन्म देने वाले ने [कोई वस्तु] त्यागकर फेंक दी हो।[b] इसके बजाय, उनका जन्म विस्तार की एक क्रिया के समान है, जैसे पिता अपने प्रिय जनों की ओर स्वयं को फैलाता है, ताकि [वे] जो उससे उत्पन्न हुए हैं, वह भी बन सकें। वर्तमान युग एक इकाई होते हुए भी समय की इकाइयों में बँटा है; वे इकाइयाँ वर्षों में, वर्ष ऋतुओं में, फिर ऋतुएँ महीनों में, महीने दिनों में, दिन घंटों में और घंटे मिनटों में बँटे हैं। इसी प्रकार, [] सत्य का युग, क्योंकि वह एक भी है और अनेक भी, हर एक की समझ के अनुसार गौण और महत्त्वपूर्ण नामों से सम्मानित होता है। उपमा के लिए, वह ऐसे सोते के समान है, जो वही बने रहने पर भी बहता है और बढ़कर धाराओं, झीलों, नहरों और शाखाओं में फैल जाता है। अथवा वह ऐसी जड़ के समान है जो वृक्षों के नीचे फैलती है और शाखाएँ निकालती है, जिनके फल होते हैं; या ऐसे मानव-शरीर के समान, जो अलग हुए बिना अनेक शाखायुक्त अंगों में विभाजित है—मुख्य और गौण, बड़े और छोटे।


    युग-सत्ताओं[c] ने अपनी स्वतंत्र इच्छा से और उस समझ के द्वारा, जो उसने उन्हें विचार करने के लिए दी थी, तीसरे फल के साथ सहमति में स्वयं को उत्पन्न किया। उस चीज़ के साथ महिमा देने की उनकी इच्छा नहीं है, जिसे अलग-अलग पूर्णताओं[d] ने [स्तुति] के वचनों के रूप में एकमत होकर उत्पन्न किया। न वे संपूर्ण समग्रता के साथ महिमा देना चाहते हैं, न किसी ऐसी अकेली युग-सत्ता के साथ महिमा करना चाहते हैं, जो अपने ही स्थान या अवस्था से ऊँचा स्थान या अवस्था प्राप्त कर चुका हो—जब तक कि वह अधिक ऊँचे नाम और ऊँचे स्थान वाले से <वह> प्राप्त न कर ले जिसकी इच्छा की गई थी। [] वे ऊँचे स्थान पर एक-दूसरे को ग्रहण करते हैं। जो और ऊँचा उठना चाहता था, वह, मानो, स्वयं को जन्म देता है—उस दूसरे के साथ और जो कुछ वह है उसके साथ स्वयं को जन्म देता हुआ। वह उस जन के साथ नवीकृत होता है जो उसके भाई से उसके पास आया था; वह उसे देखता है और उस विषय के बारे में उससे विनती करता है।[e]


    ऐसा इसी रीति से हो, इसलिए जो महिमा देना चाहता था, वह इस बात के सिवा उससे उसके विषय में कुछ नहीं कहता; क्योंकि पूर्णता में वाणी की एक सीमा ठहराई गई है। इस कारण वे पिता की अगम्यता के विषय में मौन रहते हैं, फिर भी उसे समझने की अपनी इच्छा के विषय में बोलने की उन्हें अनुमति है।'
