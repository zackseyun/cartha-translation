base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/028.yaml
  text: 'Concerning the true baptism, into which the Totalities descend and in which they come into being, there is no baptism other than this one. It is redemption in God the Father, the Son, and the Holy Spirit, when faith is professed in those names, [which] are the single name of the gospel, [] when someone has believed that the things told to them are real.


    For someone who believes that they exist, this means receiving, invisibly, the Father, the Son, and the Holy Spirit by testifying with firm faith and understanding them with firm hope. On this basis, attaining what someone has believed could become a return for that person, so that the Father could become one with him—the Father (and) God whom he has professed in faith and who granted that he should be made one with him in knowledge.


    The baptism mentioned earlier is called “the garment <that> those who wear it do not remove,” because it is put on by those who have received redemption. It is also called “the confirmation of the unfailing truth,” since it is unmoving and unshakable, firmly grasping those who have received <restoration> while they firmly grasp it. It is called “silence” because of its quietness and immovability. It is also called “bridal chamber” because of the harmonious and inseparable condition of those [whom] <he has> known <and who> have known him. It is also called [] “the light that does not set and is without flame,” not because it fails to give light, but because those who put it on and those whom it clothes are transformed into light. It is also called “eternal life,” which is deathlessness.


    Thus, whatever it is called, including its names <omitted> here, corresponds to all the beautiful things it contains in a manner that is simple, pleasant, inseparable, intricate, perfect, and unshakable. How, then, can it be named except as the Totality? Even if countless names were assigned to it, they would be spoken simply as a way of referring to it, when in fact it transcends all words, all voices, and all thoughts. It transcends everything, and it transcends all silence. So it is <…> with those who are what it is. This is indeed what it is, possessing a face that cannot be spoken or grasped, glorified by those who possess knowledge through what they have grasped.'
translation:
  language: hi
  text: 'सच्चे बपतिस्मे के विषय में—जिसमें समस्तताएँ उतरती हैं और जिसमें वे अस्तित्व में आती हैं—इसके सिवा कोई और बपतिस्मा नहीं है। यही परमेश्वर पिता, पुत्र और पवित्र आत्मा में छुटकारा है, जब उन नामों में विश्वास का अंगीकार किया जाता है, [a]जो सुसमाचार का एक ही नाम हैं, [b]जब कोई यह विश्वास कर लेता है कि उसे बताई गई बातें वास्तविक हैं।


    जो उनके अस्तित्व पर विश्वास करता है, उसके लिए इसका अर्थ है—दृढ़ विश्वास के साथ साक्षी देकर और दृढ़ आशा के साथ उन्हें समझकर, अदृश्य रीति से पिता, पुत्र और पवित्र आत्मा को प्राप्त करना। इसी आधार पर, जिस पर किसी ने विश्वास किया है उसकी प्राप्ति उसके लिए वापसी बन सकती है, ताकि पिता उसके साथ एक हो सके—वही पिता (और) परमेश्वर, जिसका उसने विश्वास में अंगीकार किया है और जिसने उसे यह वर दिया कि वह ज्ञान में उसके साथ एक किया जाए।


    जिस बपतिस्मे का हमने पहले उल्लेख किया, उसे “वह वस्त्र [c]जिसे पहननेवाले उतारते नहीं” कहा जाता है, क्योंकि छुटकारा पानेवाले उसे धारण करते हैं। उसे “कभी न चूकनेवाले सत्य की पुष्टि” भी कहा जाता है, क्योंकि वह अचल और अडिग है: वह उन लोगों को दृढ़ता से थामे रहता है जिन्होंने [d]पुनर्स्थापना पाई है, और वे भी उसे दृढ़ता से थामे रहते हैं। उसकी शांति और अचलता के कारण उसे “मौन” कहा जाता है। उसे “विवाह-कक्ष” भी कहा जाता है, क्योंकि जिन लोगों को [e]उसने जाना है और जिन्होंने उसे जाना है, उनकी दशा सामंजस्यपूर्ण और अविभाज्य है। उसे [f]“वह प्रकाश जो अस्त नहीं होता और जिसमें ज्वाला नहीं है” भी कहा जाता है—इसलिए नहीं कि वह प्रकाश नहीं देता, बल्कि इसलिए कि जो उसे धारण करते हैं और जिन्हें वह धारण करता है, वे प्रकाश में बदल जाते हैं। उसे “अनन्त जीवन” भी कहा जाता है, अर्थात् मृत्युहीनता।


    इसलिए उसे जो कुछ भी कहा जाता है—यहाँ [g]छोड़ दिए गए उसके नामों सहित—वह उन सभी सुंदर बातों के अनुरूप है जिन्हें वह सरल, सुखद, अविभाज्य, जटिल, सिद्ध और अडिग रीति से अपने में समेटे हुए है। तब उसे “समग्रता” के सिवा और क्या नाम दिया जाए? यदि उसे अनगिनत नाम भी दिए जाएँ, तो वे केवल उसकी ओर संकेत करने के साधन के रूप में बोले जाते हैं; वास्तव में वह सभी शब्दों, सभी स्वरों और सभी विचारों से परे है। वह हर वस्तु से परे है, और समस्त मौन से भी परे है। जो वही हैं जो वह है, उनके साथ भी ऐसा ही [h]… है। निश्चय ही वह यही है: उसका स्वरूप अकथनीय और अगम्य है, और जिन्होंने जो कुछ ग्रहण किया है उसके द्वारा ज्ञान पाया है, वे उसकी महिमा करते हैं।


    [a] पांडुलिपि में “जो” के आसपास का पाठ संदिग्ध है; वाक्य यह भी संकेत कर सकता है कि अनेक नाम सुसमाचार के एक नाम में एक हैं।

    [b] यहाँ पांडुलिपि में पाठ लुप्त है।

    [c] “जिसे” संपादकीय रूप से पूरा किया गया है।

    [d] “पुनर्स्थापना” संपादकीय रूप से पुनर्निर्मित पाठ है।

    [e] “उसने” और संबंधित पद संपादकीय रूप से पुनर्निर्मित हैं।

    [f] यहाँ पांडुलिपि में कुछ पाठ लुप्त है।

    [g] “छोड़ दिए गए” संपादकीय रूप से पूरा किया गया है।

    [h] यहाँ पांडुलिपि का पाठ लुप्त या अपठनीय है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में “जो” के आसपास का पाठ संदिग्ध है; वाक्य यह भी संकेत कर सकता है कि अनेक नाम सुसमाचार के एक नाम में एक हैं।
    reason: वर्ग-कोष्ठक और वाक्य-संबंध की अनिश्चितता को दर्शाना।
  - marker: b
    text: यहाँ पांडुलिपि में पाठ लुप्त है।
    reason: स्रोत-साक्ष्य में रिक्ति सुरक्षित रखना।
  - marker: c
    text: “जिसे” संपादकीय रूप से पूरा किया गया है।
    reason: कोणीय कोष्ठक में दिए पुनर्निर्माण को पारदर्शी बनाना।
  - marker: d
    text: “पुनर्स्थापना” संपादकीय रूप से पुनर्निर्मित पाठ है।
    reason: अनिश्चित पुनर्स्थापित शब्द की सूचना देना।
  - marker: e
    text: “उसने” और संबंधित पद संपादकीय रूप से पुनर्निर्मित हैं।
    reason: कर्ता और संबंधवाचक पदों की पाठगत अनिश्चितता बताना।
  - marker: f
    text: यहाँ पांडुलिपि में कुछ पाठ लुप्त है।
    reason: प्रकाश-उपाधि से पहले की रिक्ति सुरक्षित रखना।
  - marker: g
    text: “छोड़ दिए गए” संपादकीय रूप से पूरा किया गया है।
    reason: स्रोत के कोणीय कोष्ठक वाले पूरक को चिह्नित करना।
  - marker: h
    text: यहाँ पांडुलिपि का पाठ लुप्त या अपठनीय है।
    reason: अंतिम अनुच्छेद की महत्वपूर्ण रिक्ति को पाठक से न छिपाना।
lexical_decisions:
- source_word: baptism
  choice: बपतिस्मा
  rationale: आधुनिक हिन्दी मसीही प्रयोग में परिचित शब्द; अनुष्ठानिक और रहस्यात्मक दोनों संदर्भों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: Totalities / Totality
  choice: समस्तताएँ / समग्रता
  rationale: बहुवचन और एकवचन के भेद को सुरक्षित रखा गया है। यह असामान्य पारिभाषिक प्रयोग जानबूझकर सामान्यीकृत नहीं किया गया।
- source_word: redemption
  choice: छुटकारा
  rationale: स्वाभाविक आधुनिक हिन्दी में मुक्ति-मूलक अर्थ देता है और किसी विशिष्ट सम्प्रदायगत सिद्धान्त तक सीमित नहीं करता।
- source_word: profession of faith
  choice: विश्वास का अंगीकार
  rationale: सार्वजनिक या वाचिक स्वीकार के अर्थ को स्पष्ट और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: knowledge
  choice: ज्ञान
  rationale: ग्रंथ के ज्ञान-संबंधी धार्मिक तनाव को बनाए रखता है; इसे केवल बौद्धिक समझ या अनुभव में सीमित नहीं किया गया।
- source_word: bridal chamber
  choice: विवाह-कक्ष
  rationale: मूल रूपक को प्रत्यक्ष रखता है और बाद की किसी खास संस्कारगत व्याख्या को आरोपित नहीं करता।
- source_word: deathlessness
  choice: मृत्युहीनता
  rationale: ‘अमरता’ की अपेक्षा स्रोत की नकारात्मक संरचना और ‘अनन्त जीवन’ की व्याख्यात्मक समानता अधिक निकटता से सुरक्षित रहती है।
- source_word: face
  choice: स्वरूप
  rationale: यहाँ शाब्दिक ‘चेहरा’ हिन्दी में भ्रामक हो सकता है; ‘स्वरूप’ अप्रकट पहचान/प्रकटन का भाव देता है, यद्यपि देहात्मक रूपक कुछ मंद होता है।
theological_decisions:
- issue: त्रित्व-संबंधी बपतिस्मा-वाक्य
  choice: “परमेश्वर पिता, पुत्र और पवित्र आत्मा में छुटकारा”
  alternative: “पिता, पुत्र और पवित्र आत्मा के नाम में छुटकारा”
  rationale: साक्ष्य में ‘in God the Father, the Son and the Holy Spirit’ है; अगले खंड में नाम आते हैं। दोनों को मिला कर एक प्रचलित सूत्र नहीं बनाया गया।
- issue: नामों की एकता
  choice: “उन नामों में… जो सुसमाचार का एक ही नाम हैं”
  alternative: “उस नाम में, जो सुसमाचार का एक नाम है”
  rationale: बहुवचन ‘names’ और एकवचन ‘a single name’ के जानबूझकर तनाव को सुरक्षित रखा गया है।
- issue: पिता के साथ एकता
  choice: “पिता उसके साथ एक हो सके… वह ज्ञान में उसके साथ एक किया जाए”
  alternative: एकता को केवल नैतिक संगति या तत्त्वगत विलय के रूप में स्पष्ट करना
  rationale: स्रोत एकता की प्रकृति को निश्चित नहीं करता; अतः उसकी वास्तविकता रखी गई, पर उसका दार्शनिक अर्थ नहीं ठहराया गया।
- issue: बपतिस्मे के अनेक नाम
  choice: वस्त्र, पुष्टि, मौन, विवाह-कक्ष, प्रकाश और अनन्त जीवन—सभी रूपकों को समान स्तर पर रखा गया
  alternative: इन्हें अलग-अलग संस्कार या उद्धार की क्रमिक अवस्थाएँ मानना
  rationale: अंश इन्हें उसी बपतिस्मे के नाम कहता है; कोई बाहरी संस्कार-तंत्र आरोपित नहीं किया गया।
- issue: “those who are what it is”
  choice: “जो वही हैं जो वह है”
  alternative: “जो उसके समान हैं”
  rationale: मूल की प्रबल और अस्पष्ट पहचानात्मक भाषा को नरम नहीं किया गया; साथ ही इसे स्पष्ट तत्त्वगत समानता के सिद्धान्त में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित होने के कारण पाठगत रिक्तियाँ, पुनर्निर्माण और वैचारिक असामान्यताएँ स्पष्ट रूप से सुरक्षित रखी गई हैं। सर्वनामों में अनावश्यक लिंग-निर्धारण से बचा गया, पर जहाँ स्रोत पिता के लिए पुल्लिंग रखता है वहाँ उसे बनाए रखा गया।
