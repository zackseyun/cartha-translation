  revised_text: 'फिर भी भविष्यद्वक्ताओं ने अपनी इच्छा से कुछ नहीं कहा। इसके बजाय, उनमें से प्रत्येक ने उद्धारकर्ता की घोषणा के विषय में उन बातों के बारे में कहा जो उसने देखीं और सुनी थीं। उसने जिसकी घोषणा की—और जो उनकी घोषणा का मुख्य विषय था—वह उद्धारकर्ता के आगमन के बारे में प्रत्येक का यह कथन था कि उसका आगमन होगा। कभी-कभी भविष्यद्वक्ता उसके विषय में ऐसे बोलते हैं मानो उसका जन्म अभी होना बाकी हो; और कभी-कभी ऐसा लगता है मानो उद्धारकर्ता उनके मुँह से बोल रहा हो और कह रहा हो कि उद्धारकर्ता आएगा और उन लोगों पर कृपा करेगा जो उसे नहीं जानते थे। इसलिए उन सबने हर बात एक ही ढंग से नहीं कही। बल्कि हर एक को उसके विषय में और उस स्थान के विषय में, जिसे उसने देखा था, बोलने की जो सामर्थ्य दी गई थी, उसके अनुसार उसने समझा कि उद्धारकर्ता उसी स्थान से जन्म लेगा और वहीं से आएगा। इसलिए उनमें से कोई नहीं जानता था कि वह कहाँ से आएगा या कौन उसे जन्म देगा। वे केवल इतना कहने के योग्य ठहरे कि वह जन्म लेगा और दुःख सहेगा। जहाँ तक उसके पूर्व-अस्तित्व और अनुत्पन्न तथा दुःखातीत रूप में उसके सनातन अस्तित्व का प्रश्न है—<…>
