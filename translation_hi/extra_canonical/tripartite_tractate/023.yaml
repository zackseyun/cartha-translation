base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: hi
  text: 'फिर भी भविष्यद्वक्ताओं ने अपनी इच्छा से कुछ नहीं कहा। इसके बजाय, उनमें से प्रत्येक ने उद्धारकर्ता की घोषणा के विषय में वही कहा जो उसने देखा और सुना था। उसने जिसकी घोषणा की—और जो उनकी घोषणा का मुख्य विषय था—वह उद्धारकर्ता के आगमन के बारे में प्रत्येक का यह कथन था कि उसका आगमन होगा। कभी-कभी भविष्यद्वक्ता उसके विषय में ऐसे बोलते हैं मानो उसका जन्म अभी होना बाकी हो; और कभी-कभी ऐसा लगता है मानो उद्धारकर्ता उनके मुँह से बोल रहा हो और कह रहा हो कि उद्धारकर्ता आएगा और उन लोगों पर कृपा करेगा जो उसे नहीं जानते थे। इसलिए उन सबने हर बात एक ही ढंग से नहीं कही। बल्कि उसके विषय में और उस स्थान के विषय में, जिसे प्रत्येक ने देखा था, बोलने की जो सामर्थ्य उसे दी गई थी, उसके अनुसार हर एक ने समझा कि उद्धारकर्ता उसी स्थान से जन्म लेगा और वहीं से आएगा। इसलिए उनमें से कोई नहीं जानता था कि वह कहाँ से आएगा या कौन उसे जन्म देगा। वे केवल इतना कहने के योग्य ठहरे कि वह जन्म लेगा और दुःख सहेगा। जहाँ तक उसके पूर्व-अस्तित्व और अनुत्पन्न तथा दुःखातीत रूप में उसके सनातन अस्तित्व का प्रश्न है—<…> उस वचन से नहीं,
    जो देह में अस्तित्व में आया, []—यह बात उनके विचार में कभी आई ही नहीं।[a][b]


    और उसकी उस देह के विषय में, जो प्रकट होनेवाली थी, उन्हें प्रेरणा से यही संदेश देना था। कहा जाता है कि उसका जन्म उन सबके जन्म जैसा था, पर सबसे बढ़कर वह आत्मिक वचन से था, जो अस्तित्व में आई सभी वस्तुओं का कारण है। जिससे उद्धारकर्ता ने अपनी देह पाई, उसने सचमुच प्रकाश के प्रकट होने पर बीज के रूप में उसे जन्म दिया; यह उसके प्रकटन के प्रतिज्ञात वचन के अनुरूप था—<जो था उसके> <एक> बीज की अवस्था में सचमुच <होते हुए>, यद्यपि वह सबसे अंत में उत्पन्न हुआ।[c] परंतु जिसे पिता ने उसके द्वारा उद्धार प्रकट करने के लिए ठहराया था, और जो प्रतिज्ञा की पूर्ति है, जब वह जीवन में उतरा, तब उसके उतरने के लिए आवश्यक हर साधन उसे दिया गया। उसका पिता एक ही है—एकमात्र वही जो सचमुच उसका पिता है: अदृश्य, अज्ञेय और स्वभाव से अगम्य; वही अकेला परमेश्वर है, जिसने अपनी इच्छा और अपने वरदान से यह संभव किया कि वह देखा, जाना और ग्रहण किया जा सके।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित प्रारूप है; नाग हम्मादी कोडेक्स I,5 के कॉप्टिक पाठ से प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: स्रोत-आधार की सीमा पारदर्शी करना।
  - marker: b
    text: कोणीय कोष्ठक संपादकीय पूर्ति या पाठ-लोप को और खाली वर्ग-कोष्ठक पांडुलिपि के अस्पष्ट अथवा अनुपलब्ध अंश को सूचित करते हैं। इस क्षतिग्रस्त वाक्य का व्याकरणिक संबंध अनिश्चित है।
    reason: पांडुलिपि-क्षति और वास्तविक वाक्यगत अस्पष्टता को सुरक्षित रखना।
  - marker: c
    text: ‘<जो था उसके> <एक> बीज…’ वाला अंश अत्यंत कठिन और आंशिक रूप से पुनर्निर्मित है; शब्दों का परस्पर संबंध निश्चित नहीं है।
    reason: कठिन पुनर्निर्मित पाठ को अनावश्यक निश्चितता से प्रस्तुत करने से बचना।
lexical_decisions:
- source_word: Savior (English witness; Coptic review pending)
  choice: उद्धारकर्ता
  rationale: यह आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से संप्रदायगत बनाए बिना व्यक्त करता है।
- source_word: Word (English witness; Coptic review pending)
  choice: वचन
  rationale: यह व्यक्ति-सूचक और सृष्टि-कारण संबंधी दोनों संभावित अर्थ-स्तरों को बनाए रखता है; ‘शब्द’ की अपेक्षा धार्मिक-साहित्यिक प्रसंग में अधिक स्वाभाविक है।
- source_word: spiritual
  choice: आत्मिक
  rationale: ‘आध्यात्मिक’ की अपेक्षा यह संक्षिप्त है और यहाँ ‘वचन’ के गुण को दार्शनिक अमूर्तन में बदले बिना व्यक्त करता है।
- source_word: unbegotten
  choice: अनुत्पन्न
  rationale: यह ‘जिसे जन्म नहीं दिया गया’ के तात्त्विक अर्थ को संक्षेप में रखता है और ‘अजन्मा’ से उत्पन्न हो सकनेवाले केवल ऐतिहासिक जन्म के अर्थ को टालता है।
- source_word: impassible
  choice: दुःखातीत
  rationale: यह ‘दुःख सहने में असमर्थ’ के भ्रामक आधुनिक अर्थ के बजाय दुःख या विकार से परे होने का तात्त्विक आशय देता है।
- source_word: favor
  choice: कृपा
  rationale: सामान्य पाठक के लिए परिचित शब्द है और अनुग्रहपूर्ण व्यवहार के अर्थ को बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वक्ताओं के कथन में उद्धारकर्ता का कभी भावी जन्म और कभी उनके मुँह से बोलना
  choice: दोनों रूपों को साथ रखा गया और असंगति को समतल नहीं किया गया।
  alternative: इसे केवल पूर्व-अस्तित्ववान उद्धारकर्ता द्वारा भविष्यद्वक्ताओं के माध्यम से बोलने के रूप में स्पष्ट करना।
  rationale: मूल साक्ष्य स्वयं ‘कभी…कभी…’ का तनाव रखता है; किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या को थोपना उचित नहीं।
- issue: ‘unbegotten, impassible’ और देहधारी वचन वाले क्षतिग्रस्त वाक्य का संबंध
  choice: अनुत्पन्न और दुःखातीत को उद्धारकर्ता के सनातन अस्तित्व से जोड़ा गया, पर डैश, कोणीय कोष्ठक और रिक्त वर्ग-कोष्ठक द्वारा टूटे हुए वाक्य को खुला रखा गया।
  alternative: ‘वचन से नहीं’ को हटाकर वाक्य को निर्विघ्न धर्मवैज्ञानिक कथन बनाना।
  rationale: उपलब्ध साक्ष्य में पाठ-विच्छेद और वाक्य-संबंध की वास्तविक अनिश्चितता है।
- issue: अंतिम वाक्य में ‘वह देखा, जाना और ग्रहण किया जा सके’ का संदर्भ
  choice: सर्वनाम ‘वह’ रखा गया।
  alternative: स्पष्ट रूप से ‘पिता स्वयं’ या ‘पुत्र’ लिखना।
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का सर्वनाम संदर्भ अस्पष्ट है; हिन्दी में भी उस अस्पष्टता को यथासंभव सुरक्षित रखा गया।
- issue: ‘जिसके द्वारा उद्धार प्रकट करना’ में सर्वनाम-संदर्भ
  choice: ‘जिसे…उसके द्वारा…’ की मूल सर्वनाम-रचना को बनाए रखा गया।
  alternative: दोनों सर्वनामों को उद्धारकर्ता या किसी विशिष्ट मध्यस्थ के नाम से बदलना।
  rationale: ऐसा स्पष्टीकरण पाठ से परे जाकर धर्मवैज्ञानिक पहचान निर्धारित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘भविष्यद्वक्ता’, ‘उद्धारकर्ता’, ‘वचन’, ‘पूर्व-अस्तित्व’ और ‘दुःखातीत’ जैसे शब्द प्रसंग की धर्मवैज्ञानिक-साहित्यिक गंभीरता के कारण रखे गए हैं। लंबे और क्षतिग्रस्त वाक्यों में अर्थ को पढ़ने योग्य बनाया गया है, पर सर्वनाम-संदर्भ, पाठ-विच्छेद और धर्मवैज्ञानिक तनाव को जानबूझकर निर्णीत नहीं किया गया।
