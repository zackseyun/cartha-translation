  yaml_path: translation/extra_canonical/tripartite_tractate/014.yaml
  text: 'The fall experienced by the aeons of the Father of the Totalities happened only as if it were their own experience, planned by the Father with care, generosity, and great kindness. [] […] the Totality, to teach them about [the deficiency] through the one [from whom alone they] all received power to remove deficiencies.


    His own [order came] into being from <him> who hastened on high, from what produced itself from him, and from complete perfection. The one who hastened on high became an intercessor for the deficient one, together with the emanation of the aeons that had come into being in agreement with the things that exist. When he prayed to them, because they were united, they joyfully and eagerly agreed, in harmonious accord, to help the deficient one. They assembled and pleaded with the Father of generous intention that help would come from the Father above, for his glory, because there was no other way for the deficient one to become perfect except by the will of the Fullness of the Father. He had moved it toward himself, revealing and bestowing <it> on the deficient one.


    From the harmony that had come into being through their joyful inclination, they produced the fruit as an offspring of that harmony, a unity possessed by the Totalities, revealing the face of the Father. The aeons thought about the Father as they glorified him and prayed for help for their brother, asking that the Father would join with them. In this way, they eagerly and joyfully produced the fruit. He then revealed the manifestation of the agreement arising from their mutual union, who is his beloved Son. [] The Son in whom the Totalities are well pleased clothed them with himself as with a garment, imparting perfection to the deficient one and giving strength to the perfect ones. Strictly speaking, he is called “Savior,” “Redeemer,” “the Well-Pleasing One,” “the Beloved,” “the Paraclete,” “the Christ,” and “the Light for the Appointed Ones.” He is congruent with those who produced him because he became the names of the places granted to him. But what other name can be given to him
    except “the Son”? As we said before, this is because he is the knowledge of the Father, whom he desired that they know.


    The aeons generated both the face of the Father whom they glorify, as we wrote earlier, and their own face, because the aeons who glorify generated <his> appearance and their own face. They were formed as his army, like the army of a king, because the beings from the thought possess a powerful unity and a harmony blended together. They were produced in a complex form so that the one who would receive help could behold those for whom he had interceded. He also beholds the one who bestowed it on him. The fruit of the agreement with him that we mentioned earlier is subordinate to the power of the Totalities, because the Father was able to place the Totalities within him: those who existed beforehand, those who are, and those who will be. [] He revealed those whom the Father had placed within him, not giving them away but entrusting them to him. He carried out the universal plan of salvation with the authority granted to him from the beginning and with the power needed for the work. In this
    way, he began to accomplish his revelation.


    The one in whom the Father dwells and in whom the Totalities dwell <was> created before the one who is without sight. He taught him about those who sought their sight through the radiance of the perfect light. First, he perfected him in unspeakable joy. He perfected him for his own sake as a perfect one, and he also bestowed on him what is appropriate for each individual. This is the nature of the first joy.'
translation:
  language: hi
  text: 'समस्तताओं के पिता के युगों ने जिस पतन का अनुभव किया, वह केवल ऐसा था मानो वह उनका अपना अनुभव हो; पिता ने उसे सावधानी, उदारता और बड़ी दयालुता के साथ नियोजित किया था। [a] […] समग्रता को, ताकि उस एक के द्वारा उन्हें [कमी] के विषय में सिखाया जाए, [जिससे अकेले उन] सबने कमियों को दूर करने की सामर्थ्य पाई।


    उसकी अपनी [व्यवस्था उस] से अस्तित्व में [आई] जो शीघ्रता से ऊपर गया, और उससे भी जो अपने आप उससे उत्पन्न हुआ, तथा पूर्ण सिद्धता से। जो शीघ्रता से ऊपर गया था, वह कमीवाले के लिए मध्यस्थ बना; उसके साथ उन युगों का निर्गमन भी था जो अस्तित्वमान वस्तुओं के साथ सहमति में अस्तित्व में आया था। जब उसने उनसे प्रार्थना की, तो एकता में होने के कारण वे खुशी और उत्सुकता से सहमत हुए कि सामंजस्यपूर्ण सहमति के साथ कमीवाले की सहायता करें। वे इकट्ठे हुए और उदार अभिप्रायवाले पिता से विनती करने लगे कि ऊपर के पिता से, उसकी महिमा के लिए, सहायता आए; क्योंकि कमीवाले के सिद्ध होने का और कोई मार्ग नहीं था, सिवाय पिता की परिपूर्णता की इच्छा के। उसने उस इच्छा को अपनी ओर प्रेरित किया था और उसे प्रकट करके कमीवाले को प्रदान किया था। [b]


    आनंदपूर्ण तत्परता से उत्पन्न हुए सामंजस्य से उन्होंने फल उत्पन्न किया—उस सामंजस्य से जन्मी संतान के रूप में, अर्थात वह एकता जो समस्तताओं में थी और पिता का मुख प्रकट करती थी। युग पिता का ध्यान करते हुए उसकी महिमा कर रहे थे और अपने भाई की सहायता के लिए प्रार्थना कर रहे थे; वे माँग रहे थे कि पिता उनके साथ जुड़ जाए। इस प्रकार उन्होंने उत्सुकता और आनंद से वह फल उत्पन्न किया। तब उसने उनके पारस्परिक मिलन से उपजी सहमति की अभिव्यक्ति को प्रकट किया, जो उसका प्रिय पुत्र है। [a] वह पुत्र, जिससे समस्तताएँ प्रसन्न हैं, उन्हें वस्त्र के समान स्वयं से ढाँपता है; वह कमीवाले को सिद्धता देता और सिद्ध जनों को सामर्थ्य प्रदान करता है। ठीक-ठीक कहें तो उसे “उद्धारकर्ता,” “छुड़ानेवाला,” “सुप्रिय,” “प्रिय,” “सहायक,” “मसीह” और “चुने हुओं की ज्योति” कहा जाता है। वह उन्हें उत्पन्न करनेवालों के अनुरूप है, क्योंकि जो स्थान उसे दिए गए थे, वह उनके नाम बन गया। फिर भी पुत्र के सिवा उसे और कौन-सा नाम दिया जा सकता है? जैसा हमने पहले कहा, इसका कारण यह है कि वह पिता का ज्ञान है—उस पिता का, जिसकी इच्छा थी कि वे उसे जानें।
    [c]


    युगों ने पिता का वह मुख, जिसकी वे महिमा करते हैं—जैसा हमने पहले लिखा—और अपना स्वयं का मुख, दोनों उत्पन्न किए; क्योंकि महिमा करनेवाले युगों ने <उसकी> आकृति और अपना मुख उत्पन्न किया। वे उसकी सेना के रूप में, जैसे किसी राजा की सेना, बनाए गए; क्योंकि विचार से उत्पन्न प्राणियों में दृढ़ एकता और परस्पर घुला-मिला सामंजस्य है। वे एक बहुरूपी स्वरूप में उत्पन्न किए गए, ताकि जिसे सहायता मिलनेवाली थी वह उनको देख सके जिनके लिए उसने मध्यस्थता की थी। वह उसे भी देखता है जिसने यह सहायता उसे प्रदान की। उसके साथ हुई उस सहमति का फल, जिसका हमने पहले उल्लेख किया, समस्तताओं की सामर्थ्य के अधीन है; क्योंकि पिता समस्तताओं को उसके भीतर रख सका—उन्हें जो पहले से थे, जो हैं और जो होंगे। [a] जिन्हें पिता ने उसके भीतर रखा था, उन्हें उसने प्रकट किया; उन्हें दे नहीं दिया, बल्कि उसके भरोसे सौंप दिया। आरम्भ से उसे दिए गए अधिकार और कार्य की सामर्थ्य से उसने उद्धार की सार्वभौमिक योजना पूरी की। इस प्रकार उसने अपना प्रकाशन पूरा करना आरम्भ किया।


    जिसमें पिता और समस्तताएँ वास करती हैं, वह दृष्टिहीन से पहले सृजा <गया था>। उसने उसे उन लोगों के विषय में सिखाया जो सिद्ध ज्योति की चमक के द्वारा अपनी दृष्टि खोज रहे थे। पहले उसने उसे अवर्णनीय आनंद में सिद्ध किया। उसने अपने ही निमित्त उसे एक सिद्ध जन के रूप में सिद्ध किया, और उसे वह भी प्रदान किया जो प्रत्येक व्यक्ति के लिए उचित है। प्रथम आनंद का स्वरूप यही है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि-साक्ष्य में रिक्ति है; इस कारण वाक्य-संबंध अपूर्ण या अनिश्चित है।
    reason: मूल साक्षी के [] चिह्नों को पाठकीय रूप से समझाना।
  - marker: b
    text: “उस इच्छा को अपनी ओर प्रेरित किया” और इसके आसपास के सर्वनामों का संदर्भ अनिश्चित है; अनुवाद उपलब्ध अंग्रेज़ी साक्षी के निकट रखा गया है।
    reason: वास्तविक वाक्यगत और कर्तृगत अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: 'अंतिम वाक्य का व्याकरण एक से अधिक अर्थ दे सकता है: पिता चाहता था कि युग पिता को जानें, या पुत्र पिता का वह ज्ञान है जिसे प्रकट किया जाना था।'
    reason: धर्मवैचारिक तनाव को किसी एक व्याख्या से बंद न करना।
lexical_decisions:
- source_word: aeons
  choice: युग
  rationale: ग्रंथ की विशिष्ट ब्रह्मांड-रचना में कालिक और व्यक्तित्वी अर्थ की अस्पष्टता बनाए रखने के लिए प्रचलित हिन्दी शब्द चुना; इसे केवल ‘स्वर्गदूत’ या ‘लोक’ बनाकर अर्थ सीमित नहीं किया।
- source_word: Totalities / Totality
  choice: समस्तताएँ / समग्रता
  rationale: बहुवचन और एकवचन के स्रोतगत भेद को सुरक्षित रखा; ‘पूर्णता’ से अलग किया ताकि Fullness के साथ विलय न हो।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: तकनीकी पूर्णत्व-बोध बनाए रखते हुए साधारण पाठक के लिए बोधगम्य रूप; Totality के लिए प्रयुक्त शब्द से अलग रखा।
- source_word: deficient one
  choice: कमीवाला
  rationale: व्यक्ति-सदृश संदर्भ और मूल की अनिश्चित पहचान सुरक्षित रखता है; ‘पतित व्यक्ति’ जैसा धर्मवैचारिक निष्कर्ष नहीं जोड़ा।
- source_word: intercessor
  choice: मध्यस्थ
  rationale: किसी दूसरे के लिए निवेदन करने की भूमिका को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Paraclete
  choice: सहायक
  rationale: उपाधि के व्यापक सहायता-संबंधी अर्थ को दर्शाता है और इसे स्वतः किसी एक विशिष्ट धर्मवैज्ञानिक पहचान तक सीमित नहीं करता।
- source_word: face / visage
  choice: मुख / आकृति
  rationale: ‘मुख’ की प्रतीकात्मक भाषा रखी; निकटवर्ती पुनरुक्ति में visage को ‘आकृति’ करके स्रोत का सूक्ष्म भेद दिखाया।
- source_word: emanation
  choice: निर्गमन
  rationale: स्रोत की उत्पत्ति/प्रसरण संबंधी तकनीकी धारणा को यथासंभव तटस्थ रखा; ‘सृष्टि’ कहकर प्रक्रिया को पूर्वनिर्धारित नहीं किया।
theological_decisions:
- issue: पतन की कर्तृता और अनुभव
  choice: “मानो वह उनका अपना अनुभव हो; पिता ने उसे… नियोजित किया था”
  alternative: “पिता ने उनका पतन कराया”
  rationale: पाठ में वास्तविक अनुभव, ‘मानो’, और पितृ-योजना के बीच मौजूद तनाव को बनाए रखा; प्रत्यक्ष कारणता को उससे अधिक कठोर नहीं बनाया जितना साक्ष्य कहता है।
- issue: युगों द्वारा पुत्र/फल का उत्पादन
