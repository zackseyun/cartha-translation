base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: hi
  text: 'बाहर स्थित स्मृति के प्राणी[a] दीन हैं। वे परिपूर्णता के प्रतिरूप को बनाए रखते हैं, विशेष रूप से इसलिए कि उन्हें सुशोभित करनेवाले नामों में उनकी परस्पर सहभागिता है। मन-फिराव स्मृति के प्राणियों के प्रति दीनता उत्पन्न करता है; और उनके प्रति दीन होना न्याय का विधान भी है, जो दंडादेश और क्रोध है।


    उनके प्रति दीनता वह शक्ति भी है जो उनके नीचे गिरनेवालों को अलग करके बहुत दूर भेज देती है। वह उन्हें [...] स्मृति के प्राणियों और मन-फिराव पर फैलने [से] रोकती है। इस शक्ति में भय, उलझन, विस्मृति, घबराहट, अज्ञान और वे बातें सम्मिलित हैं जो कल्पना से उसी प्रकार अस्तित्व में आई हैं जैसे कोई सदृशता आती है। इसके अतिरिक्त, जो वास्तव में नीच थीं, उन्हें ऊँचे नाम दिए जाते हैं। जो उनसे घमंड, शासन की लालसा, अवज्ञा और असत्य के द्वारा उत्पन्न हुए, <उनमें ज्ञान का अभाव है>।


    उसने उनमें से प्रत्येक <को> एक नाम दिया, क्योंकि दोनों श्रेणियाँ एक नाम में स्थित हैं। जो स्मृति और प्रतिरूप से संबंधित हैं, वे “दाहिनी ओरवाले,” “प्राणिक,”[b] “अग्निमय” और “मध्यवर्ती” कहलाते हैं। जो घमंडी विचार और सदृशता से संबंधित हैं, वे “बाईं ओरवाले,” “भौतिक,” “अंधकारमय” और “अंतिम” कहलाते हैं।


    वचन ने प्रत्येक को उसकी श्रेणी में स्थापित किया—अर्थात् प्रतिबिंबों, प्रतिरूपों और सदृशताओं को—और प्रतिबिंबों के युगलोक[c] को उन सब से शुद्ध रखा जो उसके विरुद्ध संघर्ष करते हैं, क्योंकि वह आनंद का स्थान है। परंतु स्मृति से संबंधित लोगों पर उसने वह विचार प्रकट किया जिसे उसने अपने से उतार दिया था। वह उन्हें एक भौतिक एकता में ले जाना और उनके लिए एक व्यवस्थित व्यवस्था तथा निवास उपलब्ध कराना चाहता था, ताकि उनमें ऐसी इच्छा भी उत्पन्न हो जो उनके लिए बुराई के आकर्षण को दुर्बल कर दे। ऐसा इसलिए था कि वे अपने चारों ओर की महिमा में अत्यधिक आनंद लेना और इस प्रकार निर्वासन में बने रहना छोड़ दें, और इसके बदले उस दुर्बलता को पहचानें जिससे वे पीड़ित हैं। [...] इस प्रकार वे प्रेम और उस व्यक्ति की निरंतर खोज उत्पन्न कर सकें जो उन्हें इस निर्बलता से चंगा कर सकता है। उन्हें एक रूप धारण कराने के लिए उसने सदृशता से संबंधित लोगों के ऊपर सौंदर्य का वचन रखा और न्याय का विधान भी उन पर नियुक्त किया। उसने उनके ऊपर वे शक्तियाँ भी रखीं जिन्हें जड़ों ने शासन की अपनी लालसा [में] उत्पन्न किया था। वचन उनसे प्रसन्न था,
    क्योंकि वे उद्धार की योजना में उपयोगी हैं; इसलिए उसने इन्हें उनके ऊपर शासक होने के लिए [चुना]। इसका उद्देश्य यह था कि सुंदर वचन की सहायता, [विधान] की धमकी अथवा शासन की लालसा के प्रभाव से उस श्रेणी को उन लोगों से सुरक्षित रखा जाए जो उसे बुराई में नीचे गिरा देते।


    वचन दोनों श्रेणियों में समान रूप से पाई जानेवाली शासन की लालसा को जानता है। उसने उन्हें और अन्य सभी को कृपापूर्वक उनकी इच्छा के अनुसार दिया और प्रत्येक को अधिकार का उपयुक्त पद प्रदान किया, ताकि हर एक किसी स्थान और कार्य पर शासन करे, उच्चतर श्रेणीवालों के अधीन रहे, निचले स्थानों के कार्य को निर्देश दे और अपने अस्तित्व के ढंग के अनुसार अधिकार चलाए। इसका परिणाम यह हुआ कि स्वर्गदूतों [...] और प्रधान स्वर्गदूतों के बीच शासन और अधीनता के पदों पर अगुवे और अधीनस्थ हैं, जबकि उनके कार्य विविध और भिन्न-भिन्न प्रकार के हैं।


    हर अधिपति[d] अपनी जाति और अपने विशेषाधिकारों सहित उस वस्तु का आनंद लेता है जिसका अधिकार उसे उसके भाग से मिला है। अपने प्रकट होने के ढंग के अनुरूप प्रत्येक अपने पद पर खड़ा हुआ और उसे उद्धार की योजना का दायित्व सौंपा गया। स्वर्ग के एक छोर से [पृथ्वी] के दूसरे छोर तक, [पृथ्वी] के प्रत्येक प्रदेश में और पृथ्वी के नीचे रहनेवालों के बीच, उन पर कोई न कोई राजसत्ता अवश्य है। वहाँ राजा हैं, प्रभु हैं और वे भी हैं जिन्हें आदेश दिए जाते हैं—कुछ दंड की देखरेख करते हैं, दूसरे न्याय की, कुछ विश्राम और चंगाई प्रदान करते हैं, दूसरे शिक्षा देते हैं और कुछ पहरा देते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्मृति के प्राणी” इस ग्रंथ का तकनीकी पद है; यहाँ “स्मृति” साधारण याद करने से अधिक व्यापक ब्रह्मांडीय अर्थ रख सकती है।
    reason: असामान्य तकनीकी अभिव्यक्ति को पाठ में बनाए रखते हुए पाठक को सावधान करना।
  - marker: b
    text: “प्राणिक” उस वर्ग के लिए प्रयुक्त है जिसे साक्ष्य में “Soulish” कहा गया है; इसे “आत्मिक” से अलग समझना चाहिए।
    reason: soul और spirit संबंधी संभावित तकनीकी भेद को सुरक्षित रखना।
  - marker: c
    text: “युगलोक” उस तकनीकी पद का अनुवाद है जिसे प्रायः यूनानी रूप से “ऐओन” कहा जाता है; इसका अर्थ काल, लोक अथवा दोनों हो सकता है।
    reason: पद की वास्तविक अर्थ-सीमा और अस्पष्टता बताना।
  - marker: d
    text: “अधिपति” उन शासक सत्ताओं के लिए है जिन्हें प्रायः “आर्कोन” कहा जाता है।
    reason: तकनीकी ब्रह्मांडीय पद की पहचान उपलब्ध कराना।
lexical_decisions:
- source_word: memory
  choice: स्मृति
  rationale: तकनीकी संज्ञा के रूप में मूल रूपक बनाए रखने के लिए; इसे सामान्य ‘याद’ बनाना अवधारणात्मक भार घटाता।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: पूर्ण दैवी समग्रता की तकनीकी धारणा को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: conversion
  choice: मन-फिराव
  rationale: दिशा-परिवर्तन और आंतरिक परिवर्तन दोनों का संकेत देता है; ‘धर्मांतरण’ जैसी बाद की संकीर्ण धारणा से बचता है।
- source_word: representation
  choice: प्रतिरूप
  rationale: किसी उच्चतर वास्तविकता को उपस्थित करनेवाले रूप का भाव देता है और ‘image’ से भेद बनाए रखता है।
- source_word: image
  choice: प्रतिबिंब
  rationale: representation और likeness से शब्दगत भेद बनाए रखने के लिए चुना गया।
- source_word: likeness
  choice: सदृशता
  rationale: रूप-समानता का अपेक्षाकृत औपचारिक अर्थ बनाए रखता है।
- source_word: Soulish
  choice: प्राणिक
  rationale: तकनीकी वर्गनाम को ‘आत्मिक’ से अलग रखता है, जिससे spirit/soul का भेद न मिटे।
- source_word: aeon
  choice: युगलोक
  rationale: सिर्फ कालखंड नहीं, बल्कि क्षेत्र अथवा लोक की अवधारणा भी व्यक्त करता है; तकनीकी पद होने के कारण पादटिप्पणी दी गई है।
- source_word: Word
  choice: वचन
  rationale: व्यक्तिगत/सत्तात्मक Logos-सदृश प्रयोग को बनाए रखता है, बिना उसकी पहचान को अतिरिक्त रूप से निश्चित किए।
- source_word: archons
  choice: अधिपति
  rationale: शासक सत्ताओं का अर्थ स्पष्ट करता है और अपरिचित लिप्यंतरण से बचता है।
- source_word: plan of salvation
  choice: उद्धार की योजना
  rationale: मूल साक्ष्य में उपस्थित उद्धार-संबंधी प्रयोजन को सीधे और संप्रदाय-निरपेक्ष रूप में रखता है।
theological_decisions:
- issue: वचन की पहचान
  choice: ‘वचन’ को व्यक्तिवाचक रूप में रखा गया, पर उसकी पहचान स्पष्ट नहीं की गई।
