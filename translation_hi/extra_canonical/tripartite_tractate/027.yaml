  footnotes:
  - marker: a
    text: कोष्ठक में दिए शब्द उपलब्ध साक्ष्य में पुनर्स्थापित पाठ को सूचित करते हैं। आरंभिक सर्वनामों का सटीक संदर्भ अनिश्चित है।
    reason: पांडुलिपि-पुनर्स्थापन और वास्तविक सर्वनाम-अस्पष्टता को पाठक के लिए स्पष्ट करना।
  - marker: b
    text: '[…] पांडुलिपि में रिक्त या क्षतिग्रस्त अंश को, और [अच्छी वस्तुओं का आनंद] पुनर्स्थापित पाठ को दर्शाता है।'
    reason: मूल साक्ष्य में पाठ-क्षति और संपादकीय पूर्ति के संकेत सुरक्षित रखना।
lexical_decisions:
- source_word: Fullness
  choice: परिपूर्णता
  rationale: पाठ के विशिष्ट ब्रह्मांड-विज्ञान संबंधी अर्थ को किसी संप्रदायगत तकनीकी लिप्यंतरण में सीमित किए बिना सुरक्षित रखता है।
- source_word: the Totalities
  choice: समस्तताएँ
  rationale: बहुवचन और सामूहिक तकनीकी भाव दोनों को बनाए रखता है; केवल ‘सब लोग’ कहना अर्थ को संकीर्ण कर देता।
- source_word: knowledge
  choice: ज्ञान
  rationale: बार-बार आने वाले केंद्रीय वैचारिक शब्द के लिए एकरूप और स्वाभाविक हिन्दी चयन।
- source_word: deficiency
  choice: कमी
  rationale: ‘अभाव’ भी संभव है, पर ‘कमी’ सामान्य पाठक के लिए सहज है और अस्तित्वगत अथवा ब्रह्मांडीय अस्पष्टता को खुला रखती है।
- source_word: counsel
  choice: सम्मति
  rationale: स्थिर निर्णय, योजना और अभिप्राय के संयुक्त भाव को दर्शाता है।
- source_word: union
  choice: एकता
  rationale: मिलन की दिशा को व्यक्त करता है, बिना किसी विशेष आध्यात्मिक सिद्धांत को आरोपित किए।
- source_word: the pre-existent one
  choice: वह जो पहले से विद्यमान है
  rationale: संज्ञात्मक अस्पष्टता और पुल्लिंग/व्यक्तिगत संकेत को यथासंभव बनाए रखता है।
theological_decisions:
- issue: आरंभिक वाक्यों और दूसरे अनुच्छेद में सर्वनामों के संदर्भ
  choice: ‘वह/उसे/उसके’ की अस्पष्टता बनाए रखी गई
  alternative: हर सर्वनाम को स्पष्ट रूप से ‘पिता’ या किसी अन्य पात्र से जोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में संदर्भ अनिश्चित हैं और कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित है; स्पष्टता के नाम पर संबंध तय करना धार्मिक अर्थ को बदल सकता है।
- issue: अज्ञान के कारण के रूप में प्रकट होना
  choice: कठिन कथन को सीधे सुरक्षित रखा गया
  alternative: इसे केवल अनुमति देने या न्यायिक परिणाम के रूप में समझाकर नरम करना
  rationale: पाठ स्वयं ज्ञान उत्पन्न करने और अज्ञान का कारण कहे जाने के बीच तनाव रखता है; अनुवाद में इसे हल नहीं किया गया।
- issue: पिता का अज्ञेय होना और ज्ञान दिया जाना
  choice: दोनों कथनों को साथ रखा गया
  alternative: अज्ञेयता को केवल मानवीय प्रयास की सीमा तक सीमित करना
  rationale: पाठ प्राकृतिक अज्ञेयता और अनुग्रह से प्राप्त ज्ञान के बीच जानबूझकर तनाव स्थापित करता है।
- issue: अंतिम वाक्य में निर्धारित महानता का त्याग
  choice: ‘त्याग दिया’ का विरोधाभासी अर्थ बनाए रखा गया
  alternative: ‘पा लिया’ या ‘फिर प्राप्त किया’ जैसा सामंजस्यकारी पाठ
  rationale: उपलब्ध साक्ष्य में यही कठिन अर्थ है; स्रोत-पुनरीक्षण के बिना इसे सरल नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु पठनीय रूप अपनाया गया है। तकनीकी ब्रह्मांड-विज्ञान संबंधी शब्दों को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए उनकी विशिष्टता रखी गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-आधारित प्रस्तुति है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा लंबित होने के कारण सर्वनाम, रिक्तियाँ और कठिन धार्मिक तनाव जानबूझकर अनिर्णीत रखे गए हैं।
