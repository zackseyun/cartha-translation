translation:
  language: hi
  text: 'पिता उसे पहले से जानता था, क्योंकि किसी भी वस्तु के अस्तित्व में आने से पहले वह उसके विचारों में निवास करता था; वहीं उसके पास वे भी थे, जिनके लिए उसने उसे प्रकट किया। उसने उस कमी को उस पर रखा जो बीतते युगों तक बना रहता है, ताकि उसकी परिपूर्णता की महिमा हो। उसके अज्ञात होने के तथ्य ने उसे अपनी कृपा प्रकट करने के लिए प्रेरित किया—[अपने विषय में ज्ञान देकर]।[a]


    इस प्रकार, उसने उसके विषय में ज्ञान प्राप्त किया—उसकी उदारता की अभिव्यक्ति और उसकी मधुरता के वैभव के प्रकाशन के रूप में; यही दूसरी महिमा है। और इस प्रकार वह अज्ञान के कारण के रूप में भी प्रकट हुआ है, यद्यपि वह ज्ञान उत्पन्न करता है—एक गुप्त और अगम्य बुद्धि, जिसमें वह ज्ञान को अंत तक सुरक्षित रखता है। तब समस्तताएँ परमेश्वर पिता की खोज में अपने सारे प्रयत्न समाप्त कर चुकी होंगी; उसे किसी ने अपनी बुद्धि या सामर्थ्य से नहीं खोज पाया। वह कृपा करके उन्हें उस उत्तम विचार के महान वरदान का ज्ञान देता है, जिससे उसके प्रति अनंत धन्यवाद उत्पन्न होता है। अपनी अटल सम्मति के अनुसार वह अपने आपको सदा उन लोगों पर प्रकट करता है, जिन्हें उसकी इच्छा से पिता का ज्ञान पाने योग्य समझा गया। पिता अपने स्वभाव में अज्ञेय है; फिर भी उसने अपने पूर्वज्ञान में यह ठहराया कि वे ज्ञान और उसके साथ आने वाली हर अच्छी वस्तु पा सकें, साथ ही अज्ञान और उसकी पीड़ाओं का स्वाद भी चखें।


    इस प्रकार वे बुरी वस्तुओं का स्वाद चखते और उनके द्वारा कुछ समय तक अपने आपको प्रशिक्षित कर पाते […] ताकि वे अनंतकाल तक [अच्छी वस्तुओं का आनंद] पा सकें।[b] वे अपने आपको सामने लाते हैं और अपने शत्रुओं द्वारा निरंतर ठुकराए और बदनाम किए जाते हैं, फिर भी इसे वे ऊँची वस्तुओं का एक आभूषण और अद्भुत चिह्न मानते हैं। इसका उद्देश्य यह स्पष्ट करना था कि जो लोग पिता से अनजान थे, उनका अज्ञान उनका अपना किया हुआ था; इसके विपरीत, उसकी सामर्थ्य ने उनके लिए उसका ज्ञान पाना संभव बनाया।


    इस ज्ञान को उचित ही “हर संभव विचार का ज्ञान” और “खजाना” कहा जाता है। और ज्ञान को और भी बढ़ाने के लिए, यह उन लोगों का प्रकाशन है जो आरंभ से जाने गए थे; यह एकता की ओर जाने वाला मार्ग और वह है जो पहले से विद्यमान है। इसका परिणाम यह है कि महानता में बढ़ने वाले वही हैं जिन्होंने उद्धार की योजना में, ईश्वरीय इच्छा के अनुसार, अपने लिए निर्धारित महानता को त्याग दिया, ताकि अंत आरंभ के समान हो सके।'
