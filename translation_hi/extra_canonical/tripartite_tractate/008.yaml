translation:
  language: hi
  text: 'और उसने विविध गुणों को समस्तताओं पर एक ही बार में प्रकट नहीं किया, न ही उसने अपने से उत्पन्न हुए लोगों पर अपने समान होने का तथ्य प्रकट किया। वे सभी जो उससे उत्पन्न हुए, <जो> युगों के युग हैं, [a] क्योंकि वे <उसकी> जननशील प्रकृति से निकले उद्गम और संतान हैं, अपनी जननशील प्रकृति में वे भी पिता की महिमा के लिए <उत्पन्न करते> हैं; क्योंकि वही उन्हें स्थापित करने वाला कारण है। जैसा कि हम पहले कह चुके हैं, वह युगों को जड़ों, सोतों और पिताओं के रूप में रचता है; और वे उसी की महिमा करते हैं, क्योंकि ज्ञान और बुद्धि उसी के पास हैं, और क्योंकि समस्तताओं ने पहचान लिया कि वे समस्तता के ज्ञान और बुद्धि से उत्पन्न हुई हैं।


    यदि समस्तता के जन प्रत्येक युग की अपनी <क्षमताओं> के अनुसार महिमा करते, तो उनकी उपज केवल उस पिता की एक धुँधली प्रतिछाया होती, जो समस्तता है। इसीलिए महिमा के गीत में और उसकी उस एकता की सामर्थ्य में, जिससे वे निकले थे, उन्हें एक-दूसरे के साथ मेल, मिश्रण और एकता में लाया गया। उन्होंने परिपूर्णता की सभा की ओर से पिता को उसके योग्य महिमा अर्पित की—एक ऐसा रूप जो एक भी था और अनेक भी; क्योंकि वह एक की महिमा के लिए उत्पन्न हुआ था, और क्योंकि वे उसके निकट आए जो स्वयं समस्तताएँ है।


    यह उस व्यक्ति की [युगों द्वारा की गई] स्तुति थी जिसने समस्तताओं को अमरों के प्रथम फल और एक सनातन के रूप में उत्पन्न किया। इसका कारण यह था कि वे जीवित युगों से निकले थे और उस सिद्ध एवं परिपूर्ण के कारण स्वयं सिद्ध और परिपूर्ण थे। संगति के कारण सिद्ध रीति से महिमा करने वालों की परिपूर्ण और सिद्ध अवस्था अक्षुण्ण रही—उस सिद्ध पिता के समान, जो महिमा पाकर उस महिमा-वाणी को भी सुनता है जो [उसकी महिमा करती है, ताकि] यह प्रकट हो कि वे भी वही हैं जो वह है।


    उन्हें दिए गए दूसरे सम्मान का कारण वह था जो पिता की ओर से उनके पास लौट आया, जब उन्होंने उस वरदान को जाना जिसने उन्हें पिता के लिए एक-दूसरे के बीच फल उत्पन्न करने योग्य बनाया। परिणाम यह हुआ कि जैसे वे पिता के लिए महिमामय रीति से <उत्पन्न किए गए> थे, वैसे ही महिमा करने के कार्य में वे सिद्ध रूप से प्रकट हुए।


    वे तीसरी महिमा के जनक थे, जो उस स्वतंत्रता और सामर्थ्य के अनुरूप थी जो उनके साथ उत्पन्न हुई थी और जिसने उन्हें मिलकर महिमा करने तथा अपनी इच्छा से अलग-अलग महिमा करने की क्षमता दी। वे पहली और दूसरी महिमाएँ थे, ताकि दोनों सिद्ध और परिपूर्ण हों, क्योंकि वे सिद्ध और परिपूर्ण पिता की तथा उन सिद्ध वस्तुओं की अभिव्यक्तियाँ हैं जो सिद्ध जन की महिमा से निकलीं। परंतु तीसरी महिमा के फल में प्रत्येक युग की इच्छा और पिता का प्रत्येक गुण और सामर्थ्य सम्मिलित है। यह फल इस सीमा तक संपूर्ण और सिद्ध है कि युग पिता को जितनी महिमा देना चाहते और दे सकते हैं, वह उनकी सहमति से और प्रत्येक के द्वारा अलग-अलग प्रकट होती है। यही वह है जिससे वह प्रेम करता है और जिस पर वह अपनी सामर्थ्य चलाता है, क्योंकि इसी के द्वारा पिता की महिमा होती है। इसीलिए वे मनों के मन पाए जाते हैं, वचनों के वचन, प्राचीनों के प्राचीन और श्रेणियों की श्रेणियाँ—एक-दूसरे से ऊपर प्रतिष्ठित।


    महिमा करने वाले प्रत्येक जन का अपना स्थान, अपनी प्रतिष्ठा, अपना निवास और अपना विश्राम है; इन्हीं में उसकी अर्पित महिमा समाई है। पिता की महिमा करने वाले सभी जन सनातन रूप से उत्पन्न होते रहते हैं; वे एक-दूसरे की सहायता से उत्पन्न करते हैं, क्योंकि उद्गम अनंत और अपरिमेय हैं, और क्योंकि पिता में अपने से उत्पन्न हुए लोगों के प्रति ईर्ष्या का कोई चिह्न नहीं है कि वे उसके बराबर या उसके समान कुछ उत्पन्न करें। कारण यह है कि वह समस्तताओं में विद्यमान रहते हुए उत्पन्न करता और अपने आपको प्रकट करता है। वह जिसे चाहता है पिता बनाता है, और वास्तव में वह उसका पिता है; वह जिसे चाहता है देवता बनाता है, और वास्तव में वह उसका परमेश्वर है; और वह उन्हें समस्तताएँ बनाता है, <जिनके लिए> वह समस्तता है। [b] ठीक-ठीक कहें तो सभी महान नाम वहीं के लिए सुरक्षित हैं—वे नाम जिनमें स्वर्गदूत भी भागी होते हैं, जो शासकों के साथ संसार में अस्तित्व में आए, यद्यपि उनमें सनातन सत्ताओं से कोई समानता नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि में पाठ का एक अंश लुप्त है। कोणीय कोष्ठक अनुवादक द्वारा पुनर्स्थापित शब्दों को दिखाते हैं।
    reason: स्रोत-साक्ष्य की रिक्ति और संपादकीय पुनर्स्थापन को पारदर्शी बनाना।
  - marker: b
    text: यहाँ भी पांडुलिपि में एक अंश लुप्त है।
    reason: मूल गवाह में चिह्नित दूसरी पाठ-रिक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: Totalities / Totality
  choice: समस्तताएँ / समस्तता
  rationale: ग्रंथ की तकनीकी, सामूहिक और कभी एकवचन-कभी बहुवचन शब्दावली को बनाए रखता है; इसे सामान्य ‘सब कुछ’ बनाकर दार्शनिक तनाव नहीं मिटाता।
- source_word: aeons
  choice: युग
  rationale: हिन्दी में बोधगम्य पारंपरिक समतुल्य; यहाँ यह कालखंड के साथ-साथ सनातन आध्यात्मिक सत्ताओं का तकनीकी नाम है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: पूर्णता की सामूहिक आध्यात्मिक वास्तविकता का भाव सुरक्षित रखता है।
- source_word: emanations
  choice: उद्गम
  rationale: स्रोत से निकलने वाली सत्ताओं का भाव देता है, बिना किसी बाद की दार्शनिक प्रणाली को अत्यधिक आरोपित किए।
- source_word: procreative nature
  choice: जननशील प्रकृति
  rationale: उत्पन्न करने की अंतर्निहित क्षमता को औपचारिक और स्पष्ट रूप से व्यक्त करता है।
- source_word: archons
  choice: शासक
  rationale: मूल पद के शासन-अर्थ को सामने रखता है; संदर्भ में ये विश्व-संबंधी आध्यात्मिक शासक हैं।
- source_word: words of words
  choice: वचनों के वचन
  rationale: ‘word’ की वैचारिक गहराई और क्रमबद्ध पुनरुक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: पिता और उससे उत्पन्न सत्ताओं की समानता
  choice: ‘वे भी वही हैं जो वह है’ को यथावत रखा
  alternative: इसे केवल नैतिक समानता या प्रतिनिधित्व के रूप में समझाकर अनुवाद करना
  rationale: साक्ष्य में वास्तविक तात्त्विक तनाव है; अनुवाद उसे किसी संप्रदायगत सिद्धांत के अनुसार सीमित नहीं करता।
- issue: ‘god’ और ‘God’ का संबंध
  choice: बनाई गई सत्ता के लिए ‘देवता’ और उसके संबंध में पिता के लिए ‘परमेश्वर’
  alternative: दोनों जगह ‘ईश्वर’ या दोनों जगह ‘देवता’
  rationale: वाक्य का संबंध और पदानुक्रम हिन्दी में स्पष्ट होता है, जबकि उत्पन्न सत्ता को परम पिता के समान पूर्णतः अभिन्न नहीं ठहराया जाता।
- issue: एक और अनेक रूप
