  text: 'The Election shares in the nature and body of the Savior. It is like a bridal chamber because of its unity and union with him, since it was above all for its sake that Christ came. By contrast, the Calling is appointed for those who rejoice in the bridal chamber and are glad and happy about the union of the bridegroom and the bride. In this way, the place the Calling will receive is the aeon of the images, where the Word has yet to unite with the Fullness. Because of this, the Human of the Church was joyful and glad, and he hopes for her. He consists of spirit, soul, and body, corresponding to the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. He possessed what came from the [Father], which [] the places could receive. He also possessed the limbs we mentioned earlier. When the redemption was proclaimed, the Perfect Human immediately gained the knowledge of how to return quickly to his unity, to the place from which he originated. He joyfully returned to the place from which he had originated, the place from which he had come forth.


    However, his limbs needed a place of instruction, as is in the places prepared to provide it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and receive the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father, until the Totalities acquire a face like his. The restoration at the end, however, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption—that is, the path toward the incomprehensible Father, that is, the return to the pre-existent—and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not only from the control of those <of> the left, and not only an escape from the power of those of the right, whose servants and sons we believed ourselves to be, and from whom no one escapes without quickly being caught by them again. Instead, redemption is also an ascent <to> the degrees in the Fullness and to those who received names and grasped them according to the ability of each aeon. It is also an entrance into what is silent, with no need for voice, knowledge, conceptualization, or enlightenment, but (where) all things are light, all radiant without any need for enlightenment.


    Angels as well as humans need redemption, as do the image, the Fullnesses of the aeons, and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended upon him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received naturally received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, his love, the fleshly Son, and the heavenly angels were considered worthy to form a fellowship with him on the earth. This is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed upon him, before anyone else.'
translation:
  language: hi
  text: '**त्रिभागी ग्रंथ — चयन, बुलाहट, पुनर्स्थापना और उद्धार**


    चयन[a] उद्धारकर्ता के स्वभाव और देह में सहभागी है। उसके साथ उसकी एकता और मिलन के कारण वह विवाह-कक्ष के समान है, क्योंकि सबसे बढ़कर उसी के लिए मसीह आया। इसके विपरीत, बुलाहट[a] उन लोगों के लिए ठहराई गई है जो विवाह-कक्ष में आनन्द मनाते हैं और दूल्हे और दुल्हन के मिलन पर प्रसन्न और मग्न होते हैं। इस प्रकार बुलाहट को जो स्थान मिलेगा, वह प्रतिरूपों का ऐयोन[b] है, जहाँ वचन का परिपूर्णता के साथ मिलन अभी होना बाकी है। इसी कारण कलीसिया का मनुष्य[c] आनन्दित और प्रसन्न हुआ, और वह उसकी आशा करता है। वह आत्मा, प्राण और देह से बना है और उसके अनुरूप है जिसने उद्धार की योजना बनाई।


    उस मनुष्य के भीतर एक ऐसा मनुष्य था जो एकता था, क्योंकि वह समग्रता[d] था और वह उन सबका समावेश था। उसके पास वह भी था जो [पिता] से निकला था और जिसे [] स्थान ग्रहण कर सकते थे।[e] उसके पास वे अंग भी थे जिनका हमने पहले उल्लेख किया। जब उद्धार की घोषणा हुई, तब सिद्ध मनुष्य को तुरन्त यह ज्ञान मिला कि वह शीघ्रता से अपनी एकता में—उस स्थान पर जहाँ से उसकी उत्पत्ति हुई थी—कैसे लौटे। वह आनन्द के साथ उस स्थान पर लौट गया जहाँ से उसकी उत्पत्ति हुई थी, उस स्थान पर जहाँ से वह निकलकर आया था।


    परन्तु उसके अंगों को शिक्षा पाने के लिए एक स्थान की आवश्यकता थी। ऐसा उन स्थानों में है जो उन्हें दर्पण की तरह प्रतिरूप और मूलरूप प्रदान करने के लिए तैयार किए गए हैं, जब तक कि कलीसिया की देह के सभी अंग एक ही स्थान पर <जोड़ दिए जाएँ> और पूरी देह के प्रकट होने के द्वारा एक ही समय पुनर्स्थापना प्राप्त करें, <…> अर्थात परिपूर्णता में पुनर्स्थापना।


    उसमें आरम्भिक साझी समरसता और एकता है—वह समरसता जो पिता की है—जब तक कि सभी समग्रताएँ[d] उसके समान मुख प्राप्त न कर लें। किन्तु अन्त में पुनर्स्थापना <तब होगी>, जब समग्रता उसमें प्रकट कर दी जाएगी जो पुत्र है, जो उद्धार है—अर्थात उस अगम्य पिता की ओर जाने वाला मार्ग, अर्थात पूर्व-अस्तित्वमान की ओर वापसी—और जब सभी समग्रताएँ उस एक में उचित रीति से अपने आपको प्रकट करेंगी, जो उस अनधिगम्य, अकथनीय, [] अदृश्य और अगम्य की ओर जाने वाला मार्ग है, ताकि वह उद्धार प्राप्त करे।


    यह केवल बाईं ओर वालों के नियन्त्रण से मुक्ति नहीं होगी और न केवल दाईं ओर वालों की शक्ति से बच निकलना होगा। हम अपने आपको उनके दास और पुत्र मानते थे, और उनसे कोई भी ऐसा नहीं बचता कि वे उसे शीघ्र फिर पकड़ न लें। इसके बजाय, उद्धार परिपूर्णता के स्तरों <तक> और उन लोगों तक ऊपर चढ़ना भी है जिन्होंने नाम पाए और प्रत्येक ऐयोन की सामर्थ्य के अनुसार उन्हें ग्रहण किया। यह उस मौन में प्रवेश करना भी है जहाँ वाणी, ज्ञान, धारणा या प्रकाश पाने की कोई आवश्यकता नहीं; बल्कि वहाँ सब कुछ प्रकाश है और सब कुछ बिना प्रकाश पाने की आवश्यकता के दीप्तिमान है।


    स्वर्गदूतों और मनुष्यों—दोनों को उद्धार की आवश्यकता है; इसी प्रकार प्रतिरूप, ऐयोन की परिपूर्णताओं और आश्चर्यजनक रूप से दीप्तिमान शक्तियों को भी। स्वयं पुत्र को भी, जो समग्रता के उद्धार का आदर्श है, उद्धार की [आवश्यकता थी], [] क्योंकि वह मनुष्य बना और उसने देह में उन सभी बातों को अपने ऊपर ले लिया जो हम लोगों के लिए आवश्यक हैं—हम, जो उसकी कलीसिया हैं। फिर जब उसने पहले उस वचन के द्वारा उद्धार प्राप्त किया जो उस पर उतरा था, तब बाकी सबने उसे अपना बनाकर उससे उद्धार प्राप्त किया। क्योंकि जिन्होंने उसे ग्रहण किया जिसने पहले ही प्राप्त कर लिया था, उन्होंने स्वाभाविक रूप से वह भी ग्रहण किया जो उसके भीतर था।


    देहधारी मनुष्यों के बीच उद्धार [दिया जाना] तब आरम्भ हुआ, जब उसका पहलौठा, उसका प्रिय, देहधारी पुत्र और स्वर्गीय स्वर्गदूत पृथ्वी पर उसके साथ संगति करने के योग्य समझे गए। इसी कारण उसे “पिता का स्वर्गदूतीय उद्धार” कहा जाता है। उसने उन लोगों को सांत्वना दी जो समग्रता के ज्ञान के कारण शोकित हुए थे, क्योंकि सबसे पहले उसी को, किसी और से पहले, यह वरदान दिया गया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चयन” और “बुलाहट” यहाँ तकनीकी पद हैं। ये किसी कार्य या अवस्था के साथ-साथ लोगों की सामूहिक श्रेणियों का भी संकेत दे सकते हैं।
    reason: मूल की अमूर्त और सामूहिक अर्थ-सम्भावना को स्पष्ट करना।
  - marker: b
    text: “ऐयोन” उस पारलौकिक युग, क्षेत्र या सत्ता के लिए प्रयुक्त तकनीकी पद है; इस प्रसंग में केवल “युग” कहना अर्थ को सीमित कर सकता है।
    reason: अपरिचित लिप्यन्तरित तकनीकी शब्द की संक्षिप्त व्याख्या।
  - marker: c
    text: “कलीसिया का मनुष्य” पाठ का तकनीकी और कुछ हद तक अस्पष्ट पद है; इसका आशय केवल कलीसिया के किसी साधारण सदस्य से होना आवश्यक नहीं।
    reason: असामान्य पदबंध को किसी एक धर्मवैचारिक पहचान में सीमित होने से बचाना।
  - marker: d
    text: “समग्रता/समग्रताएँ” सम्पूर्ण दिव्य व्यवस्था, उसके घटकों या समस्त सत्ताओं के लिए प्रयुक्त तकनीकी भाषा है; एकवचन और बहुवचन मूल के अनुसार रखे गए हैं।
    reason: असामान्य बहुवचन और तकनीकी प्रयोग समझाना।
  - marker: e
    text: वर्ग कोष्ठक पाण्डुलिपि की क्षति या सम्पादकीय पूर्ति, कोणीय कोष्ठक सम्भावित पूर्ति, और <…> खोए हुए पाठ को दर्शाते हैं। खाली [] में शब्द पढ़ा नहीं जा सकता।
    reason: संरक्षित पाठालोचनात्मक संकेतों की व्याख्या।
lexical_decisions:
- source_word: Election
  choice: चयन
  rationale: यहाँ यह साधारण चुनाव नहीं, एक तकनीकी और सम्भवतः सामूहिक श्रेणी है। ‘चयन’ आधुनिक हिन्दी में गरिमापूर्ण है और राजनीतिक अर्थ से अपेक्षाकृत बचता है; अर्थ को पादटिप्पणी में खुला रखा गया है।
- source_word: Calling
  choice: बुलाहट
  rationale: अमूर्त क्रिया और तकनीकी श्रेणी—दोनों का संकेत बनाए रखता है; ‘बुलाए हुए लोग’ कहने से मूल की व्याकरणिक अमूर्तता नष्ट हो जाती।
- source_word: aeon
  choice: ऐयोन
  rationale: सन्दर्भ में यह मात्र काल या ‘युग’ नहीं, एक विशिष्ट पारलौकिक क्षेत्र अथवा सत्ता भी हो सकता है; इसलिए लिप्यन्तरण किया गया।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: तकनीकी समग्र दिव्य क्षेत्र का संकेत देते हुए मूल रूपक को बनाए रखता है; इसे किसी सम्प्रदायगत पारिभाषिक पद से नहीं बदला गया।
- source_word: Word
  choice: वचन
  rationale: व्यक्तिवाचक-धर्मवैचारिक प्रयोग और ‘कथन/शब्द’ की अंतर्निहित अर्थ-सीमा दोनों को सम्भव सीमा तक रखता है।
- source_word: Human / Perfect Human
  choice: मनुष्य / सिद्ध मनुष्य
