    चयन[a] उद्धारकर्ता के स्वभाव और देह में सहभागी है। उसके साथ अपनी एकता और मिलन के कारण वह विवाह-कक्ष के समान है, क्योंकि सबसे बढ़कर उसी के लिए मसीह आया। इसके विपरीत, बुलाहट[a] उन लोगों के लिए ठहराई गई है जो विवाह-कक्ष में आनन्द मनाते हैं और दूल्हे और दुल्हन के मिलन पर प्रसन्न और मग्न होते हैं। इस प्रकार बुलाहट को जो स्थान मिलेगा, वह प्रतिरूपों का ऐयोन[b] है, जहाँ वचन का परिपूर्णता के साथ मिलन अभी होना बाकी है। इसी कारण कलीसिया का मनुष्य[c] आनन्दित और प्रसन्न हुआ, और वह उसकी आशा करता है। वह आत्मा, प्राण और देह से बना है और उसके अनुरूप है जिसने उद्धार की योजना बनाई।


    उस मनुष्य के भीतर एक ऐसा मनुष्य था जो एकता था, क्योंकि वह समग्रता[d] था और वह वे सभी था। उसके पास वह भी था जो [पिता] से निकला था और जिसे [] स्थान ग्रहण कर सकते थे।[e] उसके पास वे अंग भी थे जिनका हमने पहले उल्लेख किया। जब उद्धार की घोषणा हुई, तब सिद्ध मनुष्य को तुरन्त यह ज्ञान मिला कि वह शीघ्रता से अपनी एकता में—उस स्थान पर जहाँ से उसकी उत्पत्ति हुई थी—कैसे लौटे। वह आनन्द के साथ उस स्थान पर लौट गया जहाँ से उसकी उत्पत्ति हुई थी, उस स्थान पर जहाँ से वह निकलकर आया था।


    परन्तु उसके अंगों को शिक्षा पाने के लिए एक स्थान की आवश्यकता थी, जैसा उन स्थानों में होता है जो उसे दर्पण के समान प्रतिरूप और मूलरूप प्रदान करने के लिए तैयार किए गए हैं; जब तक कि कलीसिया की देह के सभी अंग एक ही स्थान पर <जोड़ दिए जाएँ> और पूरी देह के प्रकट होने के द्वारा एक ही समय पर पुनर्स्थापना प्राप्त करें, <…> अर्थात परिपूर्णता में पुनर्स्थापना।


    उसमें आरम्भिक साझी समरसता और एकता है—वह समरसता जो पिता की है—जब तक कि सभी समग्रताएँ[d] उसके समान मुखाकृति प्राप्त न कर लें। किन्तु अन्त में पुनर्स्थापना <तब होगी>, जब समग्रता उसमें प्रकट कर दी जाएगी जो पुत्र है, जो उद्धार है—अर्थात उस अविज्ञेय पिता की ओर जाने वाला मार्ग, अर्थात पूर्व-अस्तित्वमान की ओर वापसी—और जब सभी समग्रताएँ उस एक में उचित रीति से अपने आपको प्रकट करेंगी, जो उस अगम्य, अकथनीय, [] अदृश्य और अविज्ञेय की ओर जाने वाला मार्ग है, ताकि वह उद्धार प्राप्त करे।


    यह केवल बाईं ओर वालों के नियन्त्रण से मुक्ति नहीं होगी और न केवल दाईं ओर वालों की शक्ति से बच निकलना होगा। हम अपने आपको उनके दास और पुत्र मानते थे, और उनसे कोई भी ऐसा नहीं बचता कि वे उसे शीघ्र फिर पकड़ न लें। इसके बजाय, उद्धार परिपूर्णता के स्तरों <तक> और उन लोगों तक ऊपर चढ़ना भी है जिन्होंने नाम पाए और प्रत्येक ऐयोन की सामर्थ्य के अनुसार उन्हें ग्रहण किया। यह उस मौन में प्रवेश करना भी है जहाँ वाणी, ज्ञान, अवधारणा या प्रबोधन की कोई आवश्यकता नहीं; बल्कि वहाँ सब कुछ प्रकाश है और सब कुछ प्रबोधन की किसी आवश्यकता के बिना दीप्तिमान है।


    स्वर्गदूतों और मनुष्यों—दोनों को उद्धार की आवश्यकता है; इसी प्रकार प्रतिरूप, ऐयोन की परिपूर्णताओं और आश्चर्यजनक रूप से दीप्तिमान शक्तियों को भी। स्वयं पुत्र को भी, जो समग्रता के उद्धार का आदर्श है, उद्धार की [आवश्यकता थी], [] क्योंकि वह मनुष्य बना और उसने देह में उन सभी बातों को अपने ऊपर ले लिया जो हम लोगों के लिए आवश्यक हैं—हम, जो उसकी कलीसिया हैं। फिर जब उसने पहले उस वचन के द्वारा उद्धार प्राप्त किया जो उस पर उतरा था, तब बाकी सबने उसे अपना बनाकर उससे उद्धार प्राप्त किया। क्योंकि जिन्होंने उसे ग्रहण किया जिसने पहले ही प्राप्त कर लिया था, उन्होंने स्वाभाविक रूप से वह भी ग्रहण किया जो उसके भीतर था।


    देहधारी मनुष्यों के बीच उद्धार [दिया जाना] तब आरम्भ हुआ, जब उसका पहलौठा, उसका प्रिय, देहधारी पुत्र और स्वर्गीय स्वर्गदूत पृथ्वी पर उसके साथ संगति करने के योग्य समझे गए। इसी कारण उसे “पिता का स्वर्गदूतीय उद्धार” कहा जाता है, जो उन लोगों को सांत्वना देता है जो समग्रता के ज्ञान के लिए शोकित हुए थे, क्योंकि सबसे पहले उसी को, किसी और से पहले, यह वरदान दिया गया था।'
