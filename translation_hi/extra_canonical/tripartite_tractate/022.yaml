    इस प्रकार इन प्रकार के […] कामों से वस्तुएँ स्थापित होती और अस्तित्व में आती हैं, ताकि समान और असमान (एक-दूसरे से मिलते-जुलते हों)। इसलिए अशिक्षित लोग विद्यमान वस्तुओं के कारण को नहीं जान पाते, और उन्होंने तरह-तरह की व्याख्याएँ प्रस्तुत की हैं। कुछ कहते हैं कि विद्यमान वस्तुओं को अपना अस्तित्व ईश्वरीय विधान से मिलता है। ये वे लोग हैं जो सृष्टि की गतियों में व्यवस्था और नमूना देखते हैं। दूसरे कहते हैं कि अस्तित्व किसी परायी वस्तु से आता है। ये वे हैं जो शक्तियों की नियमहीनता में <विविधता> और बुराई देखते हैं। दूसरे कहते हैं कि विद्यमान वस्तुएँ नियति के कारण घटित होती हैं। ये वे लोग हैं जो इसी प्रश्न में उलझे रहे। कुछ कहते हैं कि यह प्रकृति का विषय है, और कुछ कि यह संयोग का विषय है। पर उन सब में से अधिकांश, जिनकी समझ केवल दिखाई देने वाले तत्त्वों तक पहुँची है, उनके परे कुछ नहीं जानते।


    यूनानी मनीषियों और गैर-यूनानी लोगों[a] की समझ उन शक्तियों तक पहुँची जो कल्पना और खोखले विचार के द्वारा अस्तित्व में आई थीं, <और उन तक भी> जो इनसे निकली थीं—उनके बीच कार्यरत संघर्ष और विद्रोही आचरण के द्वारा। फलतः, जब उन्होंने उन बातों के विषय में कहा जिन्हें वे ज्ञान समझते थे, तो एक <छाया-प्रतिरूप> ने उन्हें धोखा दिया। उन्होंने समझा कि वे सत्य तक पहुँच गए हैं, […] जबकि वे भूल तक पहुँचे थे। यह भूल केवल छोटे-मोटे नामों से संबंधित नहीं थी; बल्कि स्वयं उन शक्तियों ने उन्हें यह विश्वास दिलाकर रोक दिया कि वे <समग्रता को समझ चुके> हैं।


    फलतः वह वर्ग अपने ही भीतर लड़ने लगा। इसका कारण उस अधिपति[b] की [एक संतान] का घमंड-भरा बैर था, जो <श्रेष्ठ> था और उससे पहले अस्तित्व में था। इसी कारण हर किसी का हर विषय पर पूरी तरह मतभेद हुआ—दर्शन, चिकित्सा की विधाएँ, वक्तृत्व की श्रेणियाँ, संगीत के प्रकार और तर्क की व्यवस्थाएँ; ये सब मत और सिद्धांत थे। इस प्रकार <बहुत बोलना> प्रबल हो गया और <वे> उलझन में पड़ गए, क्योंकि वे उन <सत्ताधारियों> की व्याख्या नहीं कर सके जिनके पास शक्ति थी और जिन्होंने उन्हें उनके सिद्धांत दिए थे।


    जहाँ तक उन बातों का संबंध है जो इब्रानियों के <राष्ट्र> में उत्पन्न हुईं—भौतिक जनों के वे लेख <जिनका> अनुकरण यूनानी करते हैं—उन्हें व्यक्त करने के लिए उन्होंने जो कुछ सोचा, उसमें दाईं ओर की शक्तियों ने <…> उन सबको शब्दों <के द्वारा> और आत्म-प्रतिरूप के सहारे तर्क करने की प्रेरणा दी। इस प्रकार उन्होंने अपने भीतर कार्यरत मिली-जुली शक्तियों का उपयोग करके सत्य तक पहुँचने की यात्रा आरंभ की।[c]


