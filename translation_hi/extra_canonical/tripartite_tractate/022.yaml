translation:
  language: hi
  text: '**अलग-अलग मत**


    जब दोनों वर्ग—[दाएँ वाले] और बाएँ वाले—अपने बीच की मध्यस्थ विचार-शक्ति के द्वारा एक-दूसरे से जुड़ जाते हैं, जो उन्हें उद्धार की साझी योजना देती है, तो दोनों एक ही आवेग से काम करने लगते हैं: दाएँ वाले बाएँ वालों की नकल करते हैं और बाएँ वाले दाएँ वालों की। कभी-कभी जब बुरा वर्ग मूर्खता के कारण बुराई करने लगता है, तब <बुद्धिमान> वर्ग भी नर-रूप में उसकी नकल करके बुराई करता है, मानो वह भी बुराई की कोई शक्ति हो। दूसरे समय, जब बुद्धिमान वर्ग भले काम करने लगता है, तब <मूर्ख> वर्ग भी उसकी नकल करके भलाई करने का प्रयत्न करता है।


    इस प्रकार, इन तरह-तरह के […] कामों से वस्तुएँ स्थापित होती और अस्तित्व में आती हैं, ताकि समान और असमान एक-दूसरे जैसे दिखाई दें। इसलिए अशिक्षित लोग विद्यमान वस्तुओं के कारण को नहीं जान पाते और उन्होंने तरह-तरह की व्याख्याएँ प्रस्तुत की हैं। कुछ कहते हैं कि विद्यमान वस्ताओं को उनका अस्तित्व ईश्वरीय विधान से मिलता है। ये वे लोग हैं जो सृष्टि की गतियों में व्यवस्था और नमूना देखते हैं। दूसरे कहते हैं कि अस्तित्व किसी परायी वस्तु से आता है। ये वे हैं जो शक्तियों की नियमहीनता में <विविधता> और बुराई देखते हैं। दूसरे कहते हैं कि विद्यमान वस्तुएँ नियति के कारण घटित होती हैं। ये वे लोग हैं जो इसी प्रश्न में उलझे रहे। कुछ कहते हैं कि यह प्रकृति का परिणाम है, और कुछ कि यह संयोग का परिणाम है। पर उन सब में से अधिकांश, जिनकी समझ केवल दिखाई देने वाले तत्त्वों तक पहुँची है, उनके परे कुछ नहीं जानते।


    यूनानी मनीषियों और गैर-यूनानी लोगों[a] की समझ केवल उन शक्तियों तक पहुँची जो कल्पना और खोखले विचार से अस्तित्व में आई थीं, <और उन तक भी> जो उनके बीच चल रहे संघर्ष और विद्रोही आचरण से निकली थीं। फलतः जब उन्होंने उन बातों के विषय में कहा जिन्हें वे ज्ञान समझते थे, तो एक <छाया-प्रतिरूप> ने उन्हें धोखा दिया। उन्होंने समझा कि वे सत्य तक पहुँच गए हैं, […] जबकि वे भूल तक पहुँचे थे। यह भूल केवल छोटे-मोटे नामों के विषय में नहीं थी; बल्कि स्वयं उन शक्तियों ने उन्हें यह विश्वास दिलाकर आगे बढ़ने से रोक दिया कि वे <समग्रता को समझ चुके> हैं।


    फलतः वह वर्ग अपने ही भीतर लड़ने लगा। इसका कारण उस <प्रधान> अधिपति[b] की [एक संतान] का घमंड-भरा बैर था, जो उस संतान से पहले अस्तित्व में था। इसी कारण हर व्यक्ति का हर विषय पर पूरी तरह मतभेद हुआ—दर्शन, चिकित्सा की विधाएँ, वक्तृत्व की श्रेणियाँ, संगीत के प्रकार और तर्क की व्यवस्थाएँ; सब कुछ मतों और सिद्धांतों में बदल गया। इस प्रकार <बहुत बोलना> प्रबल हो गया और <वे> उलझन में पड़ गए, क्योंकि वे उन <सत्ताधारियों> की व्याख्या नहीं कर सके जिन्होंने उन्हें उनके सिद्धांत दिए थे।


    जहाँ तक उन बातों का संबंध है जो इब्रानियों के <राष्ट्र> में उत्पन्न हुईं—भौतिक जनों के वे लेख <जिनका> अनुकरण यूनानी करते हैं—उन्होंने उन्हें व्यक्त करने के लिए जो कुछ सोचा, उसमें दाईं ओर की शक्तियों ने <…> उन सबको शब्दों <के द्वारा> और आत्म-प्रतिरूप के सहारे तर्क करने की प्रेरणा दी। इस प्रकार उन्होंने अपने भीतर कार्यरत मिली-जुली शक्तियों का उपयोग करके सत्य तक पहुँचने की यात्रा आरंभ की।[c]


    इसके बाद वे अमिश्रित शक्तियों के वर्ग तक पहुँचे, <इससे पहले कि> वे उसके पास पहुँचे जो पिता की समानता के अनुसार स्थापित है। वह अपने स्वभाव <के कारण> अदृश्य नहीं है, बल्कि इसलिए कि एक बुद्धि उसे छिपाए रखती है, ताकि उसकी उस आकृति को सुरक्षित रखे जो सचमुच अदृश्य है। इसलिए बहुत-से स्वर्गदूत भी उसका दर्शन नहीं कर पाए। इब्रानी राष्ट्र के जिन लोगों का हमने पहले उल्लेख किया—अर्थात धर्मी जनों और भविष्यवक्ताओं—ने न तो कल्पना से, न किसी भ्रामक छवि के द्वारा और न ही किसी गूढ़ विचार से कुछ सोचा या कहा। इसके बजाय, हर एक ने अपने भीतर कार्यरत शक्ति के अनुसार, जो उसने देखा और सुना उस पर ध्यान देकर, ठीक-ठीक कहा। वे एक-दूसरे के साथ वैसे ही सामंजस्य और सहमति में थे जैसे वे शक्तियाँ जो उनमें कार्यरत थीं, क्योंकि उन्होंने अपनी <एकता> और पारस्परिक सामंजस्य बनाए रखा। यह विशेष रूप से इसलिए हुआ कि उन्होंने उससे अधिक महान व्यक्ति की स्तुति की जो उनसे ऊँचा था और जो अस्तित्व में था तथा इसलिए नियुक्त किया गया था कि उन्हें उसकी आवश्यकता थी।


    आत्मिक वचन ने उनके बीच यह उत्पन्न किया, मानो किसी ऐसे व्यक्ति में जिसे परम-उच्च की आवश्यकता हो: उद्धार का बीज ठहरने वाले विचार के अनुसार आशा और प्रतीक्षापूर्ण बाट जोहना, और स्मृति ठहरने वाला एक प्रकाशमान वचन—उसकी संतानों और उससे निकले प्रवाहों के साथ, अर्थात वे धर्मी जन और भविष्यवक्ता जिनका हमने पहले उल्लेख किया। वे अपने पितरों की स्तुति और महानता के विषय में उनकी गवाही सुरक्षित रखते हैं। ये […] आशापूर्ण प्रतीक्षा और सतर्कता के साथ अस्तित्व में आए। उनमें प्रार्थना और खोज का <वह> बीज बोया गया जो उन बहुतों में बोया जाता है जिन्होंने सामर्थ्य पाने की खोज की है। वह स्वयं प्रकट होता है और उन्हें परम-उच्च से प्रेम करने तथा यह घोषित करने को प्रेरित करता है कि ये बातें केवल उस एकमात्र से संबंधित हैं।[d]


