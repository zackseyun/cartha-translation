translation:
  language: hi
  text: '**वह परिवर्तन जिसे “मन-फिराव” कहा जाता है**


    फिर भी वह उनकी धारणा और विद्रोह से छुड़ाने वाला एक <सहायक> और उद्धारकर्ता था, क्योंकि उसी से वह परिवर्तन आता है जिसे “मन-फिराव” कहा जाता है।[a] यह तब हुआ [जब] वचन ने अपनी धारणा और अपना विचार [बदल लिया]। वह बुराई से फिरकर अच्छी बातों की ओर मुड़ा। परिवर्तन के बाद उसने उनका स्मरण किया जो अस्तित्व में हैं, और उस व्यक्ति के लिए की गई प्रार्थना का भी, जिसने भलाई के द्वारा स्वयं को बदल लिया था। उसने सबसे पहले उसका स्मरण करके उससे प्रार्थना की जो परिपूर्णता में निवास करता है;[b] फिर उसने अपने भाइयों को—एक-एक करके और साथ ही उन सबको एक साथ—स्मरण किया; पर उन सबसे पहले पिता को।


    [] सबके एक स्वर से की गई प्रार्थना ने स्वयं अपने पास और समग्रता के पास लौटने में उसकी सहायता की। क्योंकि आरंभ से अस्तित्व में रहे प्राणियों का स्मरण उसे इसलिए हुआ कि स्वयं उसका स्मरण किया गया था। यह वही दूरस्थ विचार था जो दूर से पुकारकर उसे वापस ला रहा था।


    उसकी पूरी प्रार्थना और स्मृति में अनेक सामर्थ्य समाए हुए थे, जो पहले बताई गई सीमा के अनुरूप थे, क्योंकि उसके विचार में कुछ भी निष्फल नहीं है। वे सामर्थ्य अच्छे और प्रतिरूप के सामर्थ्यों से बड़े थे, क्योंकि प्रतिरूप के सामर्थ्य भी एक [अंधकारमय] प्रकृति के हैं। वे जो बने, उनकी उत्पत्ति समानता से जुड़े एक भ्रम और घमंड के [व्यर्थ विचार] से हुई थी; और वे उस [विचार] से उत्पन्न हुए थे जिसने उन्हें पहले ही जान लिया था। वे पहले वाले प्राणी किसके समान हैं? वे <विस्मृति> और गहरी नींद के समान हैं। वे उन लोगों जैसे हैं जिन्हें व्याकुल करने वाले सपने आते हैं—जो सपने में देखते हैं कि <कोई> उनका पीछा कर रहा है और उन्हें परेशान कर रहा है। किंतु उसके लिए दूसरे प्राणी उन प्रकाशमय जीवों जैसे हैं जो सूर्योदय की प्रतीक्षा करते हैं, क्योंकि उन्होंने उसमें ऐसे सपने देखे जो सचमुच मधुर हैं।


    उसी समय [] विचार से निकले उद्भव <रुक गए>। अब न उनका कोई सार था, न कोई सम्मान, [क्योंकि] <वे> उन प्राणियों के समान नहीं हैं जो उनसे पहले अस्तित्व में थे। यदि वे प्रतिरूपों से श्रेष्ठ थे, तो उनसे ऊँचे ठहराए जाने का एकमात्र कारण यह था कि उन्होंने अच्छी अभिलाषा से कार्य किया था। उनका उद्भव उस दुर्बलता से नहीं हुआ था जो अस्तित्व में आई थी। वह अच्छी अभिलाषा <उसकी थी जो> प्रार्थना करने और स्वयं को भलाई की ओर ऊपर उठाने के बाद उस पूर्व-अस्तित्ववान को खोज रहा था। उसने उनमें उस पूर्व-अस्तित्ववान महिमामय जन को खोजने और उससे प्रार्थना करने की प्रवृत्ति बोई। उसने उनमें [उसके] विषय में सोचने की क्षमता भी बोई, और यह समझने की क्षमता भी कि उनसे पहले कोई ऐसी सत्ता अस्तित्व में थी जो उनसे बड़ी थी—यद्यपि वे नहीं जानते थे कि वह क्या थी। उस विचार से मेल और पारस्परिक प्रेम उत्पन्न करके उन्होंने एकता और एकमतता से कार्य किया, क्योंकि उनका अपना अस्तित्व भी एकता और एकमतता से ही निकला था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मन-फिराव” उस ‘परिवर्तन’ का नाम है जिसमें वचन बुराई से भलाई की ओर मुड़ता है; इसका आशय केवल पछतावे की भावना तक सीमित नहीं है।
    reason: मुख्य तकनीकी पद के अर्थ-क्षेत्र और पाठ में दी गई परिभाषा को स्पष्ट करना।
  - marker: b
    text: “परिपूर्णता” इस ग्रंथ की विश्व-रचना संबंधी एक विशिष्ट संज्ञा है; आगे आने वाली “समग्रता” के लिए स्रोत-साक्ष्य में अलग पद है।
    reason: दो निकट धर्मवैचारिक संज्ञाओं को पाठक द्वारा अनायास एक न समझे जाने देना।
lexical_decisions:
- source_word: conversion called “repentance”
  choice: वह परिवर्तन जिसे “मन-फिराव” कहा जाता है
  rationale: ‘परिवर्तन’ और ‘मन-फिराव’ दोनों को रखकर साक्ष्य में उपस्थित व्याख्यात्मक संबंध सुरक्षित किया गया है; केवल पारंपरिक धार्मिक पद से अर्थ सीमित नहीं किया गया।
- source_word: the Word
  choice: वचन
  rationale: व्यक्तिवाचक और धर्मवैचारिक प्रयोग को बनाए रखने वाला स्वाभाविक हिन्दी पद।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: विशिष्ट ब्रह्मांड-विज्ञान संबंधी संज्ञा के रूप में अर्थ और व्यक्तिवाचक महत्त्व सुरक्षित रहता है।
- source_word: Totality
  choice: समग्रता
  rationale: इसे ‘परिपूर्णता’ से अलग रखा गया है, क्योंकि साक्ष्य में दोनों भिन्न शब्द हैं।
- source_word: likeness
  choice: प्रतिरूप
  rationale: ‘समानता’ से भेद रखते हुए किसी निर्मित या प्रतिबिंबित रूप के भाव को व्यक्त करता है।
- source_word: limit
  choice: सीमा
  rationale: स्रोत-साक्ष्य के तकनीकी पद को बिना धर्मवैचारिक विस्तार के औपचारिक रूप से रखा गया है।
- source_word: emanations
  choice: विचार से निकले उद्भव
  rationale: ‘उत्सर्जन’ की यांत्रिक ध्वनि से बचते हुए निकलने और अस्तित्व ग्रहण करने, दोनों का भाव दिया गया है।
- source_word: pre-existent
  choice: पूर्व-अस्तित्ववान
  rationale: पहले से अस्तित्व में रहने की तकनीकी धारणा सुरक्षित रखी गई है और उसे केवल ‘प्राचीन’ नहीं बनाया गया।
- source_word: unanimity
  choice: एकमतता
  rationale: ‘एकता’ के साथ आए निकटार्थक किंतु अलग पद का भेद बनाए रखता है।
theological_decisions:
- issue: ‘मन-फिराव’ किसका है
  choice: वचन द्वारा अपनी धारणा और विचार बदलने की स्पष्ट भाषा रखी गई
  alternative: इसे केवल नैतिक पश्चात्ताप या मानवीय परिवर्तन के रूप में समझाना
  rationale: साक्ष्य स्वयं इस परिवर्तन को ‘वचन’ से जोड़ता है; अनुवाद ने उत्पन्न धर्मवैचारिक तनाव को हल नहीं किया।
- issue: स्मरण किए जाने और स्मरण करने का कारणात्मक संबंध
  choice: ‘स्वयं उसका स्मरण किया गया था’ निष्क्रिय वाक्य रखा गया
  alternative: स्मरण करने वाले को पिता या परिपूर्णता के निवासी के रूप में स्पष्ट करना
  rationale: साक्ष्य कर्ता को स्पष्ट नहीं करता, इसलिए अस्पष्टता सुरक्षित रखी गई।
- issue: ‘जो परिपूर्णता में निवास करता है’ और ‘पिता’ का संबंध
  choice: दोनों उल्लेखों को पाठ की क्रम-रचना के अनुसार रखा गया
  alternative: दोनों को सीधे एक ही सत्ता घोषित करना
  rationale: संभावित समानता के बावजूद साक्ष्य की वाक्यगत भिन्नता को अनुवाद में मिटाया नहीं गया।
- issue: अच्छी अभिलाषा का स्वामी
  choice: पांडुलिपीय पूर्ति-संकेत सहित ‘<उसकी थी जो>’ रखा गया
  alternative: सर्वनाम का निश्चित पूर्वपद चुनना
  rationale: उपलब्ध साक्ष्य में पाठ पुनर्निर्मित और सर्वनाम-संदर्भ अनिश्चित है।
- issue: सपनों और प्राणियों की तुलना
  choice: ‘पहले वाले’ और ‘दूसरे’ समूहों की अनिश्चित पहचान बनाए रखी गई
  alternative: उन्हें स्पष्ट रूप से अंधकारमय और प्रकाशमय शक्तियाँ नाम देना
  rationale: ऐसा स्पष्ट नामकरण पाठ से अधिक व्याख्या जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु पठनीय गद्य रखा गया है। उपलब्ध आधार प्रत्यक्ष कॉप्टिक समीक्षा नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए अनुवाद अस्थायी स्रोत-समीक्षा की स्थिति को ध्यान में रखता है। कोणीय कोष्ठक < > संपादकीय पुनर्पूर्ति और वर्ग कोष्ठक [ ] क्षतिग्रस्त/पूर्ति किए गए पाठ या रिक्ति के संकेत के रूप में यथासंभव सुरक्षित रखे गए हैं। तकनीकी संज्ञाओं को हिन्दी में अलग-अलग रखा गया है और अस्पष्ट सर्वनामों या ब्रह्मांड-विज्ञान संबंधी संबंधों को चुपचाप निश्चित नहीं किया गया।
