translation:
  language: hi
  text: 'यह उत्पत्ति का पूर्ण स्वरूप है, जो उस बात से हुई जिसे [मसीह] ने सहा, जब वह उन पर [एक ज्योति से] चमका, जिसे उसने प्रकट किया [. . .] उसके समान [. . .] जो होगा [. . .] उसके समान [. . .], जबकि उन लोगों में, जो थे, केवल यही भिन्नता [विद्यमान] है—


    (5 पंक्तियाँ लुप्त हैं)


    [] [. . .] जो विद्यमान हैं [. . .] के द्वारा [. . .], जैसा [मैंने] पहले कहा है। परन्तु भौतिक जन अन्त तक त्यागे रहेंगे, ताकि उनका नाश हो जाए, क्योंकि यदि वे एक बार फिर उस ओर लौटें जो [अस्तित्व में नहीं होगा], तो वे अपने [नाम] नहीं देंगे। जैसे वे [. . .] वे नहीं थे [. . .], पर जिस समय वे उनके बीच रहे, उस समय वे [लाभदायक] थे, यद्यपि आरम्भ में वे [. . .] नहीं थे। तब [. . .] तैयारी में उनके पास जो अधिकार था, उसके द्वारा अलग ढंग से कार्य करने के लिए, [और] उनका विरोध [करने के लिए]।


    यद्यपि मैं निरन्तर इन शब्दों का प्रयोग करता हूँ, [फिर भी मैं] इन विचारों को [समझ नहीं पाया हूँ]। कुछ प्राचीनों ने [. . .] उसे महानता।


    (5 या 6 पंक्तियाँ लुप्त हैं)


    [] [. . .] प्रत्येक [. . .] स्वर्गदूत [. . .] वचन [और] तुरही की [ध्वनि], जो प्रकाशमान पूर्व दिशा से होने वाली महान और पूर्ण पुनर्स्थापना की घोषणा करती है—विवाह-कक्ष में, जो परमेश्वर [पिता] का प्रेम है—उस सामर्थ्य के अनुसार जो [. . .] महानता की [. . .], उस [. . .] की मधुरता [. . .] उसकी; क्योंकि वह अपने आपको महानताओं पर प्रकट करता है [. . .] उसकी भलाई [. . .] स्तुति, राज्य और [महिमा], [यीशु मसीह] के द्वारा—जो प्रभु, उद्धारकर्ता और उन सभी का छुड़ानेवाला है जिन्हें प्रेममय करुणा से परिपूर्ण उस एक ने अपने में समेटा है—[उसके] पवित्र आत्मा के द्वारा, अब से लेकर सभी पीढ़ियों तक, युगानुयुग। आमीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: begetting
  choice: उत्पत्ति
  rationale: यहाँ जन्म देने की प्रक्रिया या उद्भव दोनों सम्भव हैं; ‘उत्पत्ति’ संदर्भ की दार्शनिक व्यापकता बनाए रखती है और अनावश्यक रूप से जैविक अर्थ निश्चित नहीं करती।
- source_word: material ones
  choice: भौतिक जन
  rationale: समूह-संज्ञा का दार्शनिक अर्थ बनाए रखा गया है; इसे किसी आधुनिक सामाजिक या नैतिक श्रेणी में नहीं बदला गया।
- source_word: complete restoration
  choice: पूर्ण पुनर्स्थापना
  rationale: मूल साक्ष्य में बहाली/पुनःस्थापन का भाव है; ‘पुनर्स्थापना’ उसके व्यापक ब्रह्माण्डीय आशय को खुला रखती है।
- source_word: bridal chamber
  choice: विवाह-कक्ष
  rationale: विशिष्ट प्रतीकात्मक पद को शाब्दिक और सुबोध रूप में रखा गया है, बिना उसके धार्मिक अर्थ की अतिरिक्त व्याख्या किए।
- source_word: greatnesses
  choice: महानताएँ
  rationale: असामान्य बहुवचन को सामान्यीकृत नहीं किया गया, क्योंकि यह ग्रन्थ की विशिष्ट तत्त्वमीमांसक शब्दावली हो सकती है।
- source_word: Redeemer
  choice: छुड़ानेवाला
  rationale: ‘उद्धारकर्ता’ से भेद बनाए रखने तथा मुक्ति/छुड़ौती के क्रियात्मक भाव को व्यक्त करने के लिए।
theological_decisions:
- issue: मसीह ने क्या ‘सहा’ या ‘वहन किया’
  choice: जिसे [मसीह] ने सहा
  alternative: जिसे [मसीह] ने वहन किया
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का ‘bore’ अस्पष्ट है। वाक्य-संदर्भ में ‘सहा’ स्वाभाविक है, पर कोष्ठकीय पुनर्निर्माण और स्रोत-समीक्षा लंबित होने के कारण इसे निश्चित धर्मवैज्ञानिक कथन नहीं माना गया।
- issue: भौतिक जनों का अन्तिम नाश
  choice: अन्त तक त्यागे रहेंगे, ताकि उनका नाश हो जाए
  alternative: अन्त में नाश के लिए छोड़ दिए जाएँगे
  rationale: वाक्य की कालगत और प्रयोजनगत बनावट को यथासम्भव सुरक्षित रखा गया; किसी सार्वभौमिक उद्धार या शाश्वत दण्ड की पद्धति इसमें नहीं जोड़ी गई।
- issue: ‘one filled with loving mercy’ का संबंध
  choice: प्रेममय करुणा से परिपूर्ण उस एक ने अपने में समेटा है
  alternative: वे सभी जो प्रेममय करुणा से परिपूर्ण जन के द्वारा घेरे गए हैं
  rationale: सर्वनाम-संबंध क्षतिग्रस्त और अस्पष्ट है। हिन्दी में पठनीयता हेतु ‘उस एक’ रखा गया, पर उसकी पहचान पिता, मसीह या किसी अन्य सत्ता के रूप में निश्चित नहीं की गई।
- issue: पवित्र आत्मा संबंधी अन्तिम वाक्य-विन्यास
  choice: '[उसके] पवित्र आत्मा के द्वारा'
  alternative: अपने पवित्र आत्मा के द्वारा
  rationale: साक्ष्य में ‘his’ संपादकीय पूर्ति है; कोष्ठक बनाए रखकर पाठ की अनिश्चितता सुरक्षित की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, पर सामान्य पाठक के लिए सुबोध शैली रखी गई है। उपलब्ध आधार प्रत्यक्ष कॉप्टिक पाठ नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए यह मसौदा अनिवार्यतः अंतरिम है। सभी वर्ग कोष्ठक, दीर्घविराम और लुप्त-पंक्ति सूचनाएँ पाण्डुलिपि-क्षति तथा संपादकीय पुनर्स्थापन दिखाने के लिए सुरक्षित रखी गई हैं। वेबसाइट संपर्क, विज्ञापन और नेविगेशन सामग्री को मूल ग्रन्थ का भाग न मानकर छोड़ दिया गया है। कोई पादटिप्पणी नहीं जोड़ी गई, अतः मुख्य पाठ में पादटिप्पणी-चिह्न आवश्यक नहीं हैं।
