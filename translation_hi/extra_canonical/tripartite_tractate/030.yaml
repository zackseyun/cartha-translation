  source_fidelity: प्रत्यक्ष कॉप्टिक पाठ उपलब्ध नहीं है; अतः समीक्षा उपलब्ध अंग्रेज़ी साक्ष्य के आधार पर अंतरिम है। मसौदा सामान्यतः साक्ष्य के खंडित पाठ, वर्ग-कोष्ठकों और लुप्त-पंक्ति सूचनाओं को सुरक्षित रखता है। फिर भी ‘bore’ के लिए ‘सहा’ अस्पष्ट अंग्रेज़ी को अनावश्यक रूप से पीड़ा के अर्थ में सीमित करता है; ‘वहन किया’ अधिक तटस्थ है। अंतिम वाक्य में ‘to the greatnesses’ का संबंध ‘महानताओं पर’ नहीं बल्कि ‘महानताओं को’ होना चाहिए, और ‘encompassed by’ का निष्क्रिय तथा अनिश्चित संबंध स्पष्टतः सुरक्षित रहना चाहिए।
  naturalness: संशोधित पाठ आधुनिक मानक हिन्दी में खंडित पाण्डुलिपि-पाठ की असंपूर्ण वाक्यरचना को यथासंभव बचाते हुए अधिक स्वाभाविक संबंध-कारक और क्रिया-रूप अपनाता है। ‘प्राचीन’ को ‘वृद्ध’ किया गया है ताकि ‘elders’ का सामान्य अर्थ रहे और किसी विशिष्ट संस्थागत पद का आरोप न हो।
  terminology: ‘जनन’, ‘भौतिक जन’, ‘पूर्ण पुनर्स्थापना’, ‘विवाह-कक्ष’, ‘महानताएँ’, ‘उद्धारकर्ता’ और ‘छुड़ानेवाला’ पाठ की दार्शनिक/धार्मिक शब्दावली और उनके पारस्परिक भेद को बनाए रखते हैं। ‘वहन किया’ ‘bore’ की व्याख्यात्मक धार्मिक संकीर्णता से बचता है।
  issues:
  - severity: medium
    issue: ‘bore’ का अनुवाद ‘सहा’ किया गया है।
    rationale: अंग्रेज़ी साक्ष्य में ‘bore’ बहुअर्थी है और [Christ] भी संपादकीय पुनर्निर्माण है। ‘सहा’ पीड़ा/यातना का विशिष्ट अर्थ जोड़ता है, जबकि ‘वहन किया’ अधिक तटस्थ है।
  - severity: medium
    issue: ‘he reveals himself to the greatnesses’ के लिए ‘वह अपने आपको महानताओं पर प्रकट करता है’ लिखा गया है।
    rationale: ‘to’ का संबंध प्राप्तकर्ता से है; ‘महानताओं को’ अपेक्षित है। ‘पर’ से अर्थ बदल जाता है।
  - severity: medium
    issue: ‘all those encompassed by the one filled with loving mercy’ को सक्रिय रूप में ‘उस एक ने अपने में समेटा है’ किया गया है।
    rationale: साक्ष्य का निष्क्रिय ‘encompassed by’ और क्षतिग्रस्त संबंध अस्पष्ट है। निष्क्रिय विन्यास रखने से यह नहीं ठहरता कि ‘उस एक’ ने कौन-सी क्रिया की या उसकी पहचान क्या है।
