translation:
  language: hi
  text: '[. . .] कलीसिया उन्हीं गुणों और विशेषताओं में अस्तित्व रखती है जिनमें पिता और पुत्र अस्तित्व रखते हैं, जैसा कि मैंने आरम्भ से कहा है। इसलिए वह असंख्य युगों[a] के जन्मों में बनी रहती है। जिन गुणों और विशेषताओं में कलीसिया [अस्तित्व रखती] है, उन्हीं के अनुसार वे युग भी ऐसी रीति से जन्म देते हैं जिसकी गिनती नहीं की जा सकती। इसका कारण यह है कि ये युग कलीसिया की उस एकता को [बनाते] हैं, जिसे वे एक-दूसरे के साथ, [उनके साथ] जो [उनसे] निकल आए हैं, और पुत्र के साथ [स्थापित करते] हैं—उस पुत्र के साथ जिसकी महिमा के लिए वे अस्तित्व रखते हैं।


    इसलिए मन के लिए <उनकी> कल्पना करना असम्भव है, क्योंकि वह उस स्थान की पूर्णता है। वाणी भी उनका वर्णन नहीं कर सकती, क्योंकि वे अकथनीय, अनाम और अगम्य हैं। केवल वे ही अपने नाम रख सकते और अपने विषय में विचार कर सकते हैं, क्योंकि इन स्थानों में उनकी जड़ें नहीं हैं। उस स्थान में रहनेवाले अकथनीय और अगणित हैं—उस व्यवस्था में [जो] रीति और विस्तार दोनों है; उस अजन्मे, बेनाम, अनाम, अगम्य, अदृश्य और अचिन्तनीय जन का उल्लास और आनन्द। यही पितृत्व की परिपूर्णता है, जिससे उसकी समृद्धि एक जन्म बन जाती है।


    [] [. . .] युगों में से [. . .] विचार में सदा निवास करते थे, क्योंकि पिता उनके लिए मानो विचार और स्थान था। जब उनकी पीढ़ियाँ स्थापित हो गईं, तब सब पर अधिकार रखनेवाले ने [. . .] में जो अधूरा था उसे थामकर प्रकट करने की इच्छा की, और उसने उन्हें प्रकट किया जो [उसके भीतर] थे। फिर भी, क्योंकि वह [जैसा] है [वैसा ही] है, वह ऐसा सोता है जिसमें से बहुत जल बहता है, फिर भी जो घटता नहीं।


    जब वे पिता के विचार में, अर्थात छिपी हुई गहराई में, निवास करते थे, तब गहराई उन्हें जानती थी; पर वे उस गहराई को नहीं जान सकते थे जिसमें वे रहते थे। उनके लिए न स्वयं को जानना सम्भव था, न किसी और वस्तु को। दूसरे शब्दों में, वे पिता के साथ रहते थे, पर उनका अस्तित्व उनके अपने लिए नहीं था। इसके बजाय वे केवल बीज के समान अस्तित्व रखते थे; इस प्रकार पाया गया कि उनका अस्तित्व गर्भस्थ शिशु जैसा था। उसने मानो एक वचन के द्वारा उन्हें जन्म दिया। वे वीर्य-रूप में विद्यमान थे, जबकि जिन्हें वह जन्म देनेवाला था, वे अभी उससे अस्तित्व में नहीं आए थे।


    [] पिता ने ही सबसे पहले उनके विषय में विचार किया। उसने विचार को वीर्य के बीज के समान बोया—केवल इसलिए नहीं कि वे उसके लिए अस्तित्व रखें, बल्कि इसलिए भी कि वे अपने लिए अस्तित्व रखें; कि वे उसके विचार में एक जाननेवाली सत्ता के रूप में अस्तित्व रखें और अपने लिए भी अस्तित्व रखें। वे उसे जान सकें जो उनके लिए अस्तित्व रखता है, इसलिए उसने उदारता से [आरम्भिक रूप प्रदान किया]; और वे [जान सकें कि वह पिता कौन] है जो उनके लिए अस्तित्व रखता है, इसलिए उसने एक वाणी के द्वारा उन्हें ‘पिता’ नाम दिया। उस वाणी ने उनसे घोषित किया कि जो कुछ अस्तित्व रखता है, वह उस नाम के द्वारा अस्तित्व रखता है जो उनका है। इसका कारण यह है कि नाम में रहनेवाली महिमा के कारण उन्हें अस्तित्व मिला—ऐसी महिमा जिसे वे पहचान नहीं पाए। जब कोई शिशु गर्भ में होता है, तब उसके पास अपने लिए पर्याप्त होता है, पर वह अभी उसे नहीं देखता जिसने उसे बोया। इसलिए उनका एकमात्र कार्य उसे खोजना था—यह पहचानते हुए कि वह अस्तित्व रखता है और जो अस्तित्व रखता है उसे पाने की निरन्तर लालसा करते हुए।


    परन्तु सिद्ध पिता भला है। जिस प्रकार उसने अपने आपको उनसे <बन्द नहीं रखा>, ताकि वे उसके विचार में ही सदा अस्तित्व रखते रहें, बल्कि उन्हें यह भी दिया कि वे अपने लिए अस्तित्व प्राप्त करें, उसी प्रकार उसने उन्हें उसका ज्ञान पाने का वरदान भी दिया जो अस्तित्व रखता है—अर्थात उसका, जो अनन्तकाल से अपने आपको जानता है। [] [. . .] [यह जानने के लिए] रूप प्राप्त करें कि ‘जो है’[b] वह अस्तित्व रखता है; ठीक वैसे ही जैसे इस स्थान में जन्म लेनेवाले लोग प्रकाश में आते हैं, ताकि वे उन्हें देख सकें जिन्होंने उन्हें जन्म दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘युग’ यहाँ केवल समय की अवधि नहीं, बल्कि इस ग्रन्थ की ब्रह्माण्ड-कल्पना में शाश्वत अथवा दैवी सत्ताओं के लिए प्रयुक्त पद है (यूनानी: aiōnes; कॉप्टिक पाठ में ग्रहण किया गया पारिभाषिक शब्द)।'
    reason: आधुनिक हिन्दी में ‘युग’ का सामान्य कालगत अर्थ भ्रम उत्पन्न कर सकता है।
  - marker: b
    text: ‘जो है’ अस्तित्व को व्यक्त करनेवाली एक उपाधि है; इसे ‘अस्तित्वमान’ भी अनूदित किया जा सकता है।
    reason: उपाधि के दार्शनिक और सम्भावित दैवी अर्थ को स्पष्ट करते हुए उसकी अस्पष्टता बनाए रखनी है।
lexical_decisions:
- source_word: Church
  choice: कलीसिया
  rationale: यहाँ सामान्य सभा मात्र नहीं, एक विशिष्ट ब्रह्माण्डीय सत्ता अभिप्रेत है; ‘कलीसिया’ पारम्परिक धार्मिक पद को बनाए रखता है और ‘चर्च’ से अधिक हिन्दी-संगत है।
- source_word: aeons
  choice: युग
  rationale: पाठ में ये केवल कालखंड नहीं बल्कि व्यक्तित्वरूप शाश्वत सत्ताएँ हैं; मुख्य पाठ में सुबोध ‘युग’ रखा और पादटिप्पणी में तकनीकी अर्थ स्पष्ट किया।
- source_word: fullness of paternity
  choice: पितृत्व की परिपूर्णता
  rationale: अमूर्त और धर्मवैचारिक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: depth
  choice: गहराई
  rationale: रहस्यात्मक स्थान अथवा सत्ता—दोनों सम्भावनाएँ खुली रखने के लिए सामान्य अमूर्त शब्द चुना गया।
- source_word: spermatic form / spermatic seed
  choice: वीर्य-रूप / वीर्य का बीज
  rationale: मूल रूपक की जैविक और उत्पत्तिसम्बन्धी शक्ति को शिष्ट किन्तु स्पष्ट आधुनिक हिन्दी में बनाए रखा गया।
- source_word: He Who Is
  choice: ‘जो है’
  rationale: अस्तित्वसूचक उपाधि की संक्षिप्तता और सम्भावित दैवी प्रतिध्वनि को बिना किसी विशिष्ट धर्मसिद्धान्त में बाँधे रखा गया।
theological_decisions:
- issue: कलीसिया और युगों का पारस्परिक सम्बन्ध
  choice: युग कलीसिया की एकता को ‘बनाते’ हैं
  alternative: युग स्वयं कलीसिया हैं
  rationale: खंडित और पुनर्स्थापित वाक्य में पहचान और संघटन दोनों सम्भव हैं; कोष्ठकीय पुनर्स्थापन को बनाए रखते हुए अधिक प्रत्यक्ष व्याकरणिक अर्थ चुना गया।
- issue: ‘he being the perfection of that place’ में सर्वनाम का संकेत
  choice: ‘वह उस स्थान की पूर्णता है’ के रूप में अस्पष्टता सुरक्षित
  alternative: मन उस स्थान की पूर्णता है / पुत्र उस स्थान की पूर्णता है
  rationale: उपलब्ध साक्ष्य में सर्वनाम का पूर्वपद निश्चित नहीं है; किसी पात्र की स्पष्ट पहचान जोड़ना अनुचित होता।
