base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: hi
  text: '<…> जैसे मौनों के अद्भुत कार्य सनातन उत्पत्तियाँ और बौद्धिक संतानें हैं, वैसे ही वचन के गुण आत्मिक प्रसरण हैं। क्योंकि वे वाणी से संबंधित हैं, [a] [अद्भुत कार्य] और गुण—दोनों—उसकी संतानों के बीज और विचार हैं; वे जीवित और सनातन जड़ें हैं, जो स्वयं से उत्पन्न संतानों के रूप में प्रकट होती हैं। वे पिता की महिमा के लिए बुद्धियों और आत्मिक संतानों के रूप में विद्यमान हैं।


    [आत्माएँ] और बुद्धियाँ होने के कारण उन्हें ध्वनि या वाणी की आवश्यकता नहीं है; और जो कुछ वे [करवाना] चाहती हैं, उसे प्राप्त करने के लिए कोई [कार्य] करना भी आवश्यक नहीं है। इसके बजाय, [पिता] के अपने अस्तित्व के प्रतिरूप के अनुसार, [जो] उससे उत्पन्न होते हैं, वे जो कुछ चाहते हैं उसे जन्म देते हैं। और उसकी संतान<ें> हैं: वही, जिसके विषय में वे सोचते और बोलते हैं, जिसकी ओर वे बढ़ते हैं, जिसमें वे बने रहते हैं, और जिसकी महिमा करने के लिए वे स्तुतिगान करते हैं। क्योंकि यही उनकी उत्पन्न करने की सामर्थ्य है—उनके समान, जिनसे वे उत्पन्न हुए, और उनकी पारस्परिक सहायता के अनुरूप; क्योंकि वे एक-दूसरे की सहायता वैसे ही करते हैं जैसे अजन्मे करते हैं।


    समस्तताओं से ऊपर अपने उच्च स्थान के अनुरूप पिता अज्ञात और अगम्य है। उसकी महानता और विशालता ऐसी है कि यदि वह अचानक, एक ही क्षण में प्रकट हो जाए, तो युगों के उन सभी उच्च प्राणियों को नष्ट कर देगी जो उससे उत्पन्न हुए हैं। इसलिए उसने अपनी शक्ति और अपने असीम साधनों को—जो उसके [a] अस्तित्व का गठन करते हैं—संयत रखा; वह अकथनीय और अनाम बना रहा, हर बुद्धि और समस्त वाणी से परे ऊँचा।


    फिर भी यही वह है जिसने अपने आपको फैलाया, और जो कुछ उसने फैलाया, वह विश्व के लिए नींव, स्थान और निवास बना। उसका एक नाम “वह जिसके द्वारा” है, क्योंकि वह सबका पिता है। विद्यमान प्राणियों के लिए अपने परिश्रम के द्वारा उसने उनके भीतर अपनी खोज करने का विचार बोया। उनकी […] की संपदा यह है कि वे समझते हैं कि वह अस्तित्व में है और यह खोज करते हैं कि पहले से क्या विद्यमान था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि या उपलब्ध पाठ-साक्ष्य में रिक्ति है; लुप्त शब्दों की पूर्ति नहीं की गई है।
    reason: मुख्य पाठ में [] से सूचित दोनों पाठगत रिक्तियों को पाठक के लिए स्पष्ट करना और मौन रूप से पुनर्निर्माण करने से बचना।
lexical_decisions:
- source_word: silences
  choice: मौन
  rationale: रहस्यवादी संदर्भ में व्यक्तिवाची या बहुविध ‘silences’ की संभावना बनाए रखते हुए ‘मौनों’ प्रयोग किया गया है; इसे केवल सामान्य चुप्पी नहीं बनाया गया।
- source_word: Word
  choice: वचन
  rationale: दार्शनिक-धार्मिक Logos-सदृश अर्थ और व्यक्तिवाची संकेत सुरक्षित रखने के लिए ‘वचन’ चुना गया।
- source_word: emanations
  choice: प्रसरण
  rationale: स्रोत से निकलने या विस्तृत होने की प्रक्रिया को बिना किसी विशिष्ट सांप्रदायिक तंत्र में बाँधे व्यक्त करता है।
- source_word: minds
  choice: बुद्धियाँ
  rationale: अनेक बौद्धिक सत्ताओं का संकेत रखने के लिए बहुवचन रूप चुना गया; ‘मन’ की अपेक्षा दार्शनिक अर्थ अधिक स्पष्ट है।
- source_word: Totalities
  choice: समस्तताएँ
  rationale: तकनीकी बहुवचन को सामान्य ‘सब कुछ’ में विलीन न करके उसकी विशिष्टता और असामान्यता सुरक्षित रखी गई।
- source_word: aeons
  choice: युग
  rationale: आम पाठक के लिए सुबोध पारंपरिक समतुल्य; संदर्भ में यह उच्च ब्रह्मांडीय सत्ताओं/क्षेत्रों को सूचित कर सकता है, इसलिए वाक्य ने उस तनाव को खुला रखा है।
- source_word: unbegotten
  choice: अजन्मे
  rationale: ‘जिन्हें जन्म नहीं दिया गया’ के औपचारिक अर्थ को संक्षेप और गरिमा के साथ सुरक्षित करता है।
- source_word: subsist
  choice: बने रहते हैं
  rationale: ‘स्थित/अस्तित्ववान रहते हैं’ का सहज हिंदी रूप, जिसमें निर्भर अस्तित्व का भाव बना रहता है।
- source_word: the One by Whom
  choice: वह जिसके द्वारा
  rationale: नाम की अपूर्ण, संबंधसूचक संरचना को व्याख्यात्मक पूर्ति के बिना सुरक्षित रखा गया।
theological_decisions:
- issue: पिता और उससे उत्पन्न सत्ताओं का संबंध
  choice: ‘उत्पन्न होते हैं’ और ‘जन्म देते हैं’ की स्रोतगत भाषा बनाए रखी
  alternative: ‘सृष्ट किए जाते हैं’ और ‘रचना करते हैं’
  rationale: सृष्टि और उत्पत्ति के बीच किसी बाद की धर्मवैज्ञानिक व्यवस्था को आरोपित न करते हुए मूल पाठ का जननात्मक रूपक सुरक्षित रखा गया।
- issue: पिता की महानता से उच्च प्राणियों के विनाश की संभावना
  choice: संभावित विनाश को सीधे रखा
  alternative: इसे केवल उनकी समझ की सीमा या भय के रूप में नरम करना
  rationale: पाठ के धर्मवैज्ञानिक तनाव—पिता जीवन का स्रोत भी है और उसका अप्रतिबंधित प्रकाशन विनाशकारी भी हो सकता है—को हल नहीं किया गया।
- issue: आत्माओं और बुद्धियों को ध्वनि-वाणी की आवश्यकता न होना
  choice: उनकी अभौतिक इच्छा और उत्पत्ति की क्रिया को यथावत रखा
  alternative: इसे मात्र मौन चिंतन का रूपक बताना
  rationale: पाठ जिस अस्तित्वगत दावे को प्रस्तुत करता है, उसे मनोवैज्ञानिक रूपक में सीमित नहीं किया गया।
- issue: ‘युग’ की सत्ता या कालखंड होने की अस्पष्टता
  choice: ‘युगों के … उच्च प्राणियों’ द्वारा दोनों स्तरों का तनाव बनाए रखा
  alternative: सीधे ‘ऐऑन नामक दिव्य सत्ताएँ’ कहना
  rationale: स्रोत-भाषा समीक्षा लंबित है और उपलब्ध साक्ष्य इस तकनीकी पद का एकमात्र अर्थ निर्णायक रूप से स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, दार्शनिक किंतु सुबोध शैली रखी गई है। कोणीय कोष्ठक, वर्ग कोष्ठक और […] जैसे संपादकीय संकेत मूल साक्ष्य की अनिश्चितता दिखाने के लिए सुरक्षित हैं। प्रारंभिक <…> अंश-लोप को दर्शाता है और संतान<ें> मूल witness के child<ren> की संपादकीय अनिश्चितता को यथासंभव प्रतिबिंबित करता है। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर स्रोत-सचेत रूप से आधारित है।
