  revised_text: 'ऐऑनों[a] की पूरी व्यवस्था में पिता को पूर्णतः और समग्र रूप से खोज पाने का प्रेम और लालसा है; यही उनकी निर्बाध एकता है। यद्यपि पिता अनन्त काल से अपने आपको प्रकट करता है, फिर भी उसकी इच्छा यह नहीं थी कि वे उसे अपने-आप जान लें। इसके बजाय, वह अपने अगम आदि-सार को अपने ही पास सुरक्षित रखते हुए यह होने देता है कि खोज के द्वारा उसे ग्रहण किया जाए। पिता ने ऐऑनों को मूल अभिलाषाएँ दीं, क्योंकि वे उस तक ले जानेवाले मार्ग के पड़ाव हैं—मानो आचरण का प्रशिक्षण देनेवाली पाठशाला। उसने उन्हें ये दिए हैं:



    उस पर विश्वास और उस अदृश्य से प्रार्थना,



    और उसमें दृढ़ आशा जिसे वे ग्रहण नहीं कर पाते,



    और जो दिखाई नहीं देता उसकी ओर निहारनेवाला फलदायी प्रेम,



    और अनन्त मन का मूल्यवान बोध,



