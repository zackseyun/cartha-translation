base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: hi
  text: 'ऐऑनों[a] की पूरी व्यवस्था में पिता को पूर्णतः और समग्र रूप से जान लेने का प्रेम और लालसा है; यही उनकी निर्बाध एकता है। यद्यपि पिता अनन्त काल से अपने आपको प्रकट करता है, फिर भी उसकी इच्छा यह नहीं थी कि वे उसे अपने-आप जान लें। इसके बजाय, वह अपने अगम आदि-सार को अपने ही पास सुरक्षित रखते हुए यह होने देता है कि खोजने के द्वारा उसे ग्रहण किया जाए। पिता ने ऐऑनों को मूल अभिलाषाएँ दीं, क्योंकि वे उस तक ले जानेवाले मार्ग के पड़ाव हैं—मानो आचरण का प्रशिक्षण देनेवाली कोई पाठशाला। उसने उन्हें ये दिए हैं:


    उस पर विश्वास और उस अदृश्य से प्रार्थना,


    और उस अगम पर दृढ़ आशा,


    और उस अदृश्य की ओर निहारनेवाला फलदायी प्रेम,


    और अनन्त मन की योग्य समझ,


    और समृद्धि तथा स्वतंत्रता की आशीष,


    और ऐसी समझ जो पिता की <उसकी>[b] विचारणा के लिए महिमा करने को लालायित है।


    [पाठ लुप्त है।][c] अपनी इच्छा के द्वारा महान पिता उस आत्मा के माध्यम से जाना जाता है जो समग्रताओं[d] के भीतर साँस लेता है। वही उनमें उस अज्ञात को खोजने का विचार भी जगाता है। यह वैसा ही है जैसे कोई सुगन्धित महक किसी व्यक्ति को उसके स्रोत की खोज करने के लिए प्रेरित करे, क्योंकि पिता की सुगन्ध इन प्राकृतिक सुगन्धों से श्रेष्ठ है। उसकी मधुरता ऐऑनों को अकथनीय आनन्द देती है और उनमें उसके साथ एक हो जाने का विचार उत्पन्न करती है—उसके साथ, जो चाहता है कि वे उसे एकीकृत रीति से जानें—और यह भी कि वे अपने भीतर रोपे गए आत्मा में एक-दूसरे की सहायता करें। यद्यपि एक भारी बोझ उन पर दबाव डालता है, फिर भी वे अकथनीय रीति से नए किए जाते हैं। क्योंकि जिस वास्तविकता में उन्हें अगम रीति से रखा गया है, उससे वे अलग नहीं हो सकते। वे बोलेंगे नहीं, बल्कि पिता की महिमा के विषय में—उसके विषय में जो बोल सकता है—मौन रहेंगे; फिर भी उसी से वे एक स्वरूप पाएँगे।


    यद्यपि वाणी उसका वर्णन नहीं कर सकती, उसने [अपने आपको][e] प्रकट किया। वे <उसे>[f] एक विचार के भीतर छिपा हुआ धारण करते हैं। इसीलिए ऐऑन इस विषय में मौन रहते हैं कि पिता अपने स्वरूप, अपने सार और अपनी महानता में किस प्रकार विद्यमान है। [पाठ लुप्त है।][g] फिर भी ऐऑन इस योग्य हैं कि उसके आत्मा के द्वारा जानें कि उसे न तो कोई नाम दिया जा सकता है, न पूरी तरह समझा जा सकता है। अपने आत्मा के द्वारा—जो उसकी खोज का चिह्न है—वह उन्हें उसे ग्रहण करने और उसके विषय में बोलने की क्षमता देता है। प्रत्येक ऐऑन एक नाम है, <अर्थात्>[h] प्रत्येक पिता का एक गुण और सामर्थ्य है; क्योंकि वह अनेक नामों में विद्यमान है, और वे नाम परस्पर मिले हुए तथा एक-दूसरे के साथ सामंजस्य में हैं। वाणी की समृद्धि के कारण उसके विषय में बोला जा सकता है। इसी प्रकार पिता अपनी एकता के कारण एक ही नाम होते हुए भी असंख्य गुण और नाम रखता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऐऑन’ यूनानी मूल की एक तकनीकी संज्ञा है। इसका अर्थ ‘युग’ भी हो सकता है, पर इस ग्रन्थ में यह पिता से सम्बद्ध शाश्वत आध्यात्मिक सत्ताओं या अभिव्यक्तियों के लिए प्रयुक्त होती है।
    reason: तकनीकी शब्द की अर्थ-सीमा बताए बिना उसका लिप्यंतरण साधारण पाठक के लिए अस्पष्ट रहता।
  - marker: b
    text: कोणीय कोष्ठक के शब्द उपलब्ध साक्ष्य के सम्पादकीय पूरण को दर्शाते हैं। यहाँ सर्वनाम का सम्बन्ध और वाक्य का ठीक आशय अनिश्चित है।
    reason: साक्ष्य में <his> के रूप में दिया गया पाठ-संकेत और उसकी वास्तविक अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: यहाँ उपलब्ध साक्ष्य में पाठ का एक रिक्त स्थान चिह्नित है।
    reason: पाण्डुलिपीय अथवा सम्पादकीय रिक्ति को छिपाने से बचना।
  - marker: d
    text: ‘समग्रताएँ’ इस ग्रन्थ की तकनीकी बहुवचन संज्ञा है; सम्भवतः इससे समस्त आध्यात्मिक पूर्णताएँ या उनका सामूहिक क्षेत्र अभिप्रेत है, पर उपलब्ध साक्ष्य इसे पूरी तरह स्पष्ट नहीं करता।
    reason: ‘Totalities’ के असामान्य बहुवचन और उसकी अनिश्चित तकनीकी अर्थवत्ता को समझाना।
  - marker: e
    text: वर्गाकार कोष्ठक के शब्द उपलब्ध साक्ष्य में पुनर्निर्मित अथवा पूरित पाठ को दर्शाते हैं।
    reason: '[himself] के पाठ-संकेत को प्रकाशन-पाठ में स्पष्ट बनाना।'
  - marker: f
    text: कोणीय कोष्ठक का सर्वनाम उपलब्ध साक्ष्य का सम्पादकीय पूरण है।
    reason: <him> के पाठ-संकेत को बनाए रखना।
  - marker: g
    text: यहाँ उपलब्ध साक्ष्य में पाठ का एक और रिक्त स्थान चिह्नित है।
    reason: दूसरी पाठ-रिक्ति को स्पष्ट रूप से दर्ज करना।
  - marker: h
    text: ‘अर्थात्’ उपलब्ध साक्ष्य में सम्पादकीय रूप से पूरित है।
    reason: <that is> के कोणीय कोष्ठक का पाठ-संकेत सुरक्षित रखना।
lexical_decisions:
- source_word: aeons
  choice: ऐऑन / ऐऑनों
  rationale: यह इस ग्रन्थ की विशिष्ट ब्रह्माण्ड-विषयक संज्ञा है। इसे केवल ‘युग’ कहना सत्ताओं और कालखंडों के बीच की मूल अस्पष्टता को मिटा देता; इसलिए लिप्यंतरण रखा गया और पहली टिप्पणी में अर्थ-परास बताया गया।
- source_word: Father
  choice: पिता
  rationale: मूल साक्ष्य के संबंधपरक और धर्मवैचारिक शीर्षक को बिना सांप्रदायिक विस्तार के सीधे रखा गया।
- source_word: primal essence
  choice: आदि-सार
  rationale: ‘आदि’ मूल अथवा प्रथम होने का भाव और ‘सार’ सत्ता/essence का भाव संक्षेप में बनाए रखता है।
- source_word: Totalities
  choice: समग्रताएँ
  rationale: बहुवचन और तकनीकी अमूर्तता को बनाए रखा गया; इसे ‘सृष्टि’ या ‘सब प्राणी’ कहने से आशय अनावश्यक रूप से निश्चित हो जाता।
- source_word: Spirit / spirit
  choice: आत्मा
  rationale: व्यक्तिगत अथवा सक्रिय आध्यात्मिक सत्ता का संकेत बनाए रखा गया। उपलब्ध अंग्रेज़ी साक्ष्य में बड़े और छोटे अक्षर का अंतर हिन्दी में स्वाभाविक रूप से व्यक्त नहीं होता।
- source_word: mind
  choice: मन
  rationale: ‘बुद्धि’ या ‘दैवी बुद्धि’ चुनकर अर्थ को संकीर्ण करने के बजाय व्यापक मानसिक/बौद्धिक अर्थ रखा गया।
- source_word: form
  choice: स्वरूप
  rationale: दृश्य आकार की अपेक्षा अस्तित्वगत रूप का भाव व्यक्त करता है, फिर भी दार्शनिक अर्थ को पूरी तरह निश्चित नहीं करता।
- source_word: speech
  choice: वाणी
  rationale: बोलने, वर्णन करने और नाम देने की क्षमता के साहित्यिक-दार्शनिक भाव के लिए स्वाभाविक हिन्दी।
theological_decisions:
- issue: पिता का प्रकट होना और फिर भी खोज के द्वारा जाना जाना
  choice: दोनों कथनों का तनाव यथावत रखा गया
  alternative: यह समझाना कि पिता केवल आंशिक रूप से प्रकट होता है
  rationale: साक्ष्य स्वयं शाश्वत प्रकाशन और अगम आदि-सार को साथ रखता है; अनुवाद ने इस तनाव का समाधान नहीं थोपा।
- issue: ‘automatically’ का आशय
  choice: ‘अपने-आप जान लें’
  alternative: ‘तुरन्त’ या ‘सहज ज्ञान से’
  rationale: यहाँ समय की गति से अधिक बिना खोज के स्वतः ज्ञान का निषेध प्रमुख है।
- issue: ‘mixing/joining with him’
  choice: ‘उसके साथ एक हो जाने’
  alternative: ‘उसमें मिल जाने’
  rationale: ‘मिल जाने’ से पूर्ण सत्ता-विलय का मत अनावश्यक रूप से निश्चित हो सकता था; ‘एक हो जाना’ निकट सहभागिता और एकता दोनों की सम्भावना खुली रखता है।
- issue: ‘the one who can speak’ का संदर्भ
  choice: सर्वनामगत अस्पष्टता बनाए रखी गई
  alternative: इसे स्पष्ट रूप से पिता या ऐऑनों से जोड़ना
  rationale: उपलब्ध साक्ष्य में वाक्य-विन्यास अस्पष्ट है; किसी एक पूर्वपद से निर्णायक पहचान नहीं की गई।
- issue: प्रत्येक ऐऑन का पिता का ‘नाम’ होना
  choice: ‘नाम’, ‘गुण’ और ‘सामर्थ्य’ तीनों कथनों को साथ रखा गया
  alternative: ऐऑनों को केवल पिता के गुणों के रूप में समझाना
  rationale: ग्रन्थ नाम, गुण और शक्ति के बीच पहचान/संबंध स्थापित करता है; किसी एक श्रेणी में समेटना धर्मवैचारिक तनाव मिटा देता।
