  revised_text: 'मनुष्य स्वभाव की तीन श्रेणियों में विभाजित हो गए: आत्मिक, प्राणिक और भौतिक। ये वचन की तीन प्रकार की प्रवृत्ति के अनुरूप हैं, जिनसे भौतिक, प्राणिक और आत्मिक लोग उत्पन्न हुए। स्वभाव की इन तीनों श्रेणियों में से प्रत्येक अपने फल से पहचानी जाती है। फिर भी आरम्भ से उनकी पहचान नहीं हुई थी; उनकी पहचान तभी हुई जब उद्धारकर्ता आया, संतों पर प्रकाशमान हुआ और उसने प्रकट किया कि प्रत्येक किस श्रेणी का है।



    आत्मिक श्रेणी प्रकाश से निकले प्रकाश और आत्मा से निकली आत्मा के समान है। जब उसका सिर प्रकट हुआ, तो वह तुरन्त अपनी उचित श्रेणी की ओर दौड़ी। अचानक उसने अपने सिर के लिए एक देह धारण कर ली और प्रकाशन के द्वारा तुरन्त ज्ञान प्राप्त किया।



    इसके विपरीत, प्राणिक श्रेणी आग से निकले प्रकाश के समान है। जो उसके सामने प्रकट हुआ, उसे पहचानने में वह हिचकिचाई [a], और विश्वास के द्वारा उसकी ओर दौड़ने में तो और भी अधिक हिचकिचाई। इसके बजाय, यद्यपि एक वाणी ने उसे शिक्षा दी, <वह> संतुष्ट रही, क्योंकि वह प्रतिज्ञा की आशा से दूर नहीं थी। उसने मानो आनेवाली बातों का भरोसा बयाने के रूप में प्राप्त किया।



    इसके विपरीत, भौतिक श्रेणी हर प्रकार से पराई है, क्योंकि वह अन्धकार के समान है और चमकते हुए प्रकाश को ठुकराती है, क्योंकि उसका प्रकट होना उसे मिटा देता है। और क्योंकि उसने उसके <आगमन> को स्वीकार नहीं किया, इसलिए वह <असंयमी> है और प्रभु के प्रकाशन के प्रति द्वेष से भरी हुई है।



    आत्मिक श्रेणी हर प्रकार से पूर्ण उद्धार पाएगी। भौतिक श्रेणी हर प्रकार से नष्ट की जाएगी, जैसे किसी विरोधी के साथ होता है। प्राणिक श्रेणी, जिस प्रकार वह उत्पन्न हुई और अपने स्वभाव—दोनों ही दृष्टियों से मध्यवर्ती होने के कारण—द्विविध है; यह भले और बुरे, दोनों की ओर उसकी प्रवृत्ति के अनुरूप है। और उसके लिए जो निर्धारित किया गया है वह अनिश्चित है <…>, और जो भला है उससे उसका पूरी तरह बच निकलना।[b]



    जिन्हें वचन ने अपने विचार में पहले से विद्यमान प्रतिरूप के अनुसार उत्पन्न किया था—जब उसने परम महान को स्मरण किया और उद्धार के लिए प्रार्थना की—उन्होंने तुरन्त उद्धार पाया। उद्धार देनेवाले विचार [के कारण], उसके द्वारा उत्पन्न किए गए वे पूर्ण रूप से बचाए गए। यही बात [उन लोगों] पर भी लागू होती है जिन्हें इन्होंने आगे उत्पन्न किया, [c] चाहे वे स्वर्गदूत हों या मनुष्य। वे इस स्वीकारोक्ति में सहमत हैं कि उनसे भी महान कोई अस्तित्व रखता है, और वे उससे प्रार्थना करने और उसे खोजने में सहमत हैं; इसलिए वे भी वही उद्धार पाएँगे जो उत्पन्न किए गए लोगों को मिला, क्योंकि वे भली प्रवृत्ति से हैं। उन्हें उद्धारकर्ता के भावी आगमन का प्रचार करने और उसके आ जाने के बाद उसके प्रकाशन की घोषणा करने की सेवा सौंपी गई। चाहे वे स्वर्गदूत हों या मनुष्य, जब उसने उन्हें इस सेवा में नियुक्त किया, तब उन्होंने सचमुच अपने अस्तित्व का स्वभाव प्राप्त किया।



    इसके विपरीत, जो प्रभुत्व की लालसा के विचार से आए और उसके विरोधियों के प्रहार से अस्तित्व में आए, वे उसी विचार से उत्पन्न हुए। मिश्रित होने के कारण उनका अन्त अनिश्चित होगा। जो उस प्रभुत्व की लालसा को त्याग देंगे जो उन्हें केवल कुछ समय और निश्चित अवधियों के लिए दी गई थी, महिमा के प्रभु की महिमा करेंगे और अपना क्रोध छोड़ देंगे, वे अपनी दीनता का प्रतिफल पाएँगे—एक ऐसा अस्तित्व जिसका अन्त नहीं है।



    इसके विपरीत, जो प्रतिष्ठा की लालसा के कारण घमण्डी हैं, क्षणभंगुर महिमा से प्रेम करते हैं और भूल जाते हैं कि उन्हें केवल निश्चित अवधियों और समयों के लिए अधिकार सौंपा गया था—और इस कारण उन्होंने यह अंगीकार नहीं किया कि परमेश्वर का पुत्र [d] सबका प्रभु और उद्धारकर्ता है, न अपना क्रोध छोड़ा और न दुष्टों की नकल करना बन्द किया—वे अपनी अज्ञानता और मूर्खतापूर्ण वासना का दण्ड उन लोगों के साथ पाएँगे जो भूल में पड़े और भटक गए हैं।



    उनसे भी अधिक बुरे वे हैं जिन्होंने प्रभु के विरुद्ध अनुचित काम किए, जैसे बाईं ओर की शक्तियों ने उसके विरुद्ध किए, यहाँ तक कि उसे मार डाला। उन्होंने मन में कहा, “यदि समग्रता का घोषित राजा मार डाला जाए, तो हम समग्रता के स्वामी बन जाएँगे।” और उन्होंने इसी उद्देश्य से काम किया—वे मनुष्य और स्वर्गदूत जो दाईं ओर वालों की भली प्रवृत्ति के नहीं, बल्कि मिश्रण से हैं। उन्होंने अपनी महिमा को चुना, यद्यपि वह केवल क्षणभंगुर महिमा और लालसा है; जबकि अनन्त विश्राम का मार्ग उस दीनता से होकर जाता है <जो> उद्धार <लाती है>, और यह उन लोगों का मार्ग है जिनका उद्धार होना है—दाईं ओर के लोगों का।[e]



    जब वे प्रभु की स्तुति करेंगे, कलीसिया को प्रसन्न करनेवाली बातों पर मनन करेंगे, और उसके साथ मिलकर यथासम्भव पूरी तरह दीन लोगों का स्तुतिगान गाएँगे तथा उसे प्रसन्न करनेवाले काम करेंगे, तब वे उन लोगों के समान उसके कष्टों और उसकी व्यथाओं में सहभागी होंगे जो कलीसिया की भलाई का ध्यान रखते हैं। वे उसकी आशा में भी भाग पाएँगे। यह बात [f] मनुष्यों और स्वर्गदूतों से सम्बन्ध रखती है।



    बाईं ओर के क्रम से सम्बन्ध रखनेवालों का मार्ग विनाश की ओर जाता है, क्योंकि उन्होंने न केवल प्रभु को ठुकराया और उसके विरुद्ध बुरी योजना बनाई, बल्कि कलीसिया पर अपना बैर, डाह और ईर्ष्या भी साधी। यही उन लोगों के दण्ड का कारण है जिन्होंने कलीसिया को सताया और स्वयं को उकसाकर कलीसिया के लिए <परीक्षाएँ> खड़ी कीं।'
