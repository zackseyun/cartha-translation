    संख्या की तरह पिता एक है, क्योंकि वह सबसे पहले है और अपने आप में अकेला है। फिर भी वह किसी ऐसे व्यक्ति के समान नहीं है जो केवल एक हो। यदि वह ऐसा होता, तो पिता कैसे होता? क्योंकि जहाँ पिता होता है, वहाँ उसके बाद “पुत्र” नाम भी आता है। परन्तु वह एक, जो अकेला पिता है, उस वृक्ष की जड़ के समान है जिसकी शाखाएँ और फल हैं। ठीक अर्थ में उसी को पिता कहा जाता है, क्योंकि उसकी तुलना किसी से नहीं हो सकती और वह अपरिवर्तनशील है। इसीलिए, ठीक अर्थ में, वह एक है और परमेश्वर है; क्योंकि परमेश्वर के रूप में उससे सम्बन्ध रखनेवाला कोई नहीं है—उसका कोई पिता नहीं है। वह अजन्मा है: किसी अन्य ने उसे जन्म नहीं दिया और किसी अन्य ने उसकी रचना नहीं की। क्योंकि जो कोई किसी दूसरे का पिता या रचयिता है, उसका भी एक पिता और रचयिता होता है। निश्चय ही ऐसा व्यक्ति उसका पिता और रचयिता हो सकता है जो उससे अस्तित्व में आया और जिसकी उसने रचना की। पर ठीक अर्थ में ऐसा व्यक्ति पिता नहीं और परमेश्वर नहीं है, क्योंकि कोई [] था जिसने उसे [जन्म दिया और] रचा। इसलिए ठीक अर्थ में केवल वही पिता और परमेश्वर है, जिसे किसी ने जन्म नहीं दिया।
    जहाँ तक समस्तताओं का प्रश्न है, उसी ने उन्हें जन्म दिया और उनकी रचना की।


    उसका न आरम्भ है, न अन्त; किन्तु बात केवल इतनी ही नहीं कि उसका अन्त नहीं है। अजन्मा होने के कारण वह मृत्यु से परे है। फिर भी वह अपने सनातन अस्तित्व में, अपने वही होने में, उसे स्थिर रखनेवाली बात में और उसे महान बनानेवाली बात में अपरिवर्तनशील भी है। जो उसे अस्तित्वमान बनाता है, उससे वह कभी अलग नहीं होगा; और कोई उसे ऐसा कोई विचार प्रकट करने के लिए विवश नहीं करेगा जिसे उसने कभी चाहा ही न हो। किसी ने पिता के अस्तित्व को आरम्भ नहीं दिया, इसलिए वह अपरिवर्तनशील है। कोई उसे उसके अपने अस्तित्व और उसके वही होने से—जिसमें वह विद्यमान है—अलग नहीं कर सकता, न उसकी महानता से; इसीलिए कोई उसे समझ नहीं सकता। किसी के लिए यह असम्भव है कि वह उसके स्वरूप को बदलकर कुछ और कर दे, उसे नीचे गिरा दे, बदल दे या घटा दे। सत्य की परिपूर्णता में वह <इस प्रकार> अपरिवर्तनशील और अटल है, मानो अपरिवर्तनशीलता ही उसका वस्त्र हो। बात केवल इतनी नहीं कि उसे “अनादि” और “अनन्त” कहा जाता है; न वह जन्मा, न कभी मरेगा। इसलिए जिस प्रकार अपने अस्तित्व में वह आदि और अन्त से रहित है, उसी प्रकार [] अपनी महानता में वह पहुँच से परे है—अपनी
