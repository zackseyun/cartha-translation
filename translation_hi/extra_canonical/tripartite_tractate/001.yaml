  text: '[] When discussing exalted matters, it is fitting to begin with the Father, the root of the Totality, from whom we have received the gift of speaking about him. Before anything besides him came into being, he existed.


    Like a number, the Father is one, because he comes first and is alone in himself. Yet he does not resemble someone who is merely one. If he did, how could he be a father? For whenever a father exists, the name “son” follows. The one who is the Father alone resembles the root of a tree with branches and fruit. Strictly speaking, he is called a father because he is incomparable and unchanging. This is why, strictly speaking, he is one and is a god, since no one stands in relation to him as a god, because no one is his father. For he is unbegotten: no one else begot him, and no one else created him. Anyone who is someone else’s father or creator also has a father and a creator. Certainly, he can be the father and creator of someone who came into being from him and whom he created. But, strictly speaking, he is not a father and is not a god, because there was [] someone who [begot and] created him. Therefore, strictly speaking, only he is Father and God who has had no one beget him. As for
    the Totalities, he is the one who begot and created them.


    He has no beginning and no end, but it is not merely that he has no end. Because he is unbegotten, he is deathless. Yet he is also unchanging in his eternal being, in his self-identity, in what established him, and in what makes him great. He will never be separated from what makes him exist, and no one will compel him to bring forth any intention he has never willed. No one originated the Father’s existence, and so he is unchanging. No one can separate him from his own being and self-identity, in which he exists, or from his greatness, which is why no one can comprehend him. It is impossible for anyone to change his form into something different, to lower him, to change him, or to diminish him. This is <how>, in the fullness of truth, he is the unchangeable and invariable one, with immutability as his garments. It is not merely that he is called “Beginningless” and “Endless”; he was not born, nor will he die. Thus, just as he is without beginning and without end in the way he exists,
    so [] in his greatness he cannot be reached. He is incomprehensible in his wisdom, unfathomable in his power, and unknowable in his sweetness.


    Strictly speaking, only he who is good—the unbegotten Father and the wholly perfect one—is full of his offspring, of every virtue, and of everything valuable. He possesses still more, including the absence of all spite, so that one may find that all who possess anything owe it to him, because he bestows it. Yet he is unattainable and tireless in his giving, rich in the gifts he gives and at rest in the favors he lavishes.


    His category, form, and great scale are such that none have been with him from the beginning. There is no place where he dwells, from which he proceeds, or into which he enters. There is no primal form that he uses as a pattern when he works. No difficulty accompanies him in anything he does, nor is any matter available for him to use in creating what <he> creates. There is no substance inhering in him that he uses to beget whatever he begets, nor is there any coworker accompanying him in his work. To claim anything like this is ignorance. Instead, one should declare that he is good, without defect, perfect, [] entire, since he is the Totality.


    None of the names that are thought or spoken, seen or understood, apply to him, no matter how immensely majestic, glorifying, and reverential they may be. Such names may, however, be spoken for his glory and honor, according to the ability of those who glorify him. As for what inheres in his existence, being, and form, the mind cannot conceive of him, words cannot express him, eyes cannot behold him, and no one can comprehend him. This is because of his unsearchable greatness, his ungraspable depth, his limitless height, and his unlimited <extension>.


    This is the character of what is unbegotten: it does not extend or join itself to anything as something limited does. Instead, he has a character without possessing a face or form, things that can be comprehended through perception. This is why he is incomprehensible.'
translation:
  language: hi
  text: '[] जब ऊँची बातों की चर्चा की जाए, तो उचित है कि हम पिता से आरम्भ करें—समग्रता[a] की जड़ से—जिससे हमें उसके विषय में बोलने का वरदान मिला है। उसके अतिरिक्त किसी भी वस्तु के अस्तित्व में आने से पहले वह विद्यमान था।


    संख्या की तरह पिता एक है, क्योंकि वह सबसे पहले है और अपने आप में अकेला है। फिर भी वह किसी ऐसे व्यक्ति के समान नहीं है जो केवल एक हो। यदि वह ऐसा होता, तो पिता कैसे होता? क्योंकि जहाँ पिता होता है, वहाँ उसके बाद “पुत्र” नाम भी आता है। परन्तु वह एक, जो अकेला पिता है, उस वृक्ष की जड़ के समान है जिसकी शाखाएँ और फल हैं। ठीक अर्थ में उसी को पिता कहा जाता है, क्योंकि उसकी तुलना किसी से नहीं हो सकती और वह अपरिवर्तनशील है। इसीलिए, ठीक अर्थ में, वह एक है और परमेश्वर है; क्योंकि परमेश्वर के रूप में उससे सम्बन्ध रखनेवाला कोई नहीं है—उसका कोई पिता नहीं है। वह अजन्मा है: किसी अन्य ने उसे जन्म नहीं दिया और किसी अन्य ने उसकी रचना नहीं की। क्योंकि जो कोई किसी दूसरे का पिता या रचयिता है, उसका भी एक पिता और रचयिता होता है। निश्चय ही वह उसका पिता और रचयिता हो सकता है जो उससे अस्तित्व में आया और जिसकी उसने रचना की। पर ठीक अर्थ में वह पिता नहीं और परमेश्वर नहीं है, क्योंकि कोई [] था जिसने उसे [जन्म दिया और] रचा। इसलिए ठीक अर्थ में केवल वही पिता और परमेश्वर है, जिसे किसी ने जन्म नहीं दिया। जहाँ तक समस्तताओं
    का प्रश्न है, उसी ने उन्हें जन्म दिया और उनकी रचना की।


    उसका न आरम्भ है, न अन्त; किन्तु बात केवल इतनी ही नहीं कि उसका अन्त नहीं है। अजन्मा होने के कारण वह मृत्यु से परे है। फिर भी वह अपने सनातन अस्तित्व में, अपने वही होने में, उसे स्थिर रखनेवाली बात में और उसे महान बनानेवाली बात में अपरिवर्तनशील भी है। जो उसे अस्तित्वमान बनाता है, उससे वह कभी अलग नहीं होगा; और कोई उसे ऐसा कोई विचार प्रकट करने के लिए विवश नहीं करेगा जिसे उसने कभी चाहा ही न हो। किसी ने पिता के अस्तित्व को आरम्भ नहीं दिया, इसलिए वह अपरिवर्तनशील है। कोई उसे उसके अपने अस्तित्व और उसके वही होने से—जिसमें वह विद्यमान है—अलग नहीं कर सकता, न उसकी महानता से; इसीलिए कोई उसे समझ नहीं सकता। किसी के लिए यह असम्भव है कि वह उसके स्वरूप को बदलकर कुछ और कर दे, उसे नीचे गिरा दे, बदल दे या घटा दे। सत्य की परिपूर्णता में वह <इस प्रकार> अपरिवर्तनशील और अटल है, मानो अपरिवर्तनशीलता ही उसका वस्त्र हो। बात केवल इतनी नहीं कि उसे “अनादि” और “अनन्त” कहा जाता है; न वह जन्मा, न कभी मरेगा। इसलिए जिस प्रकार अपने अस्तित्व में वह आदि और अन्त से रहित है, उसी प्रकार [] अपनी महानता में वह पहुँच से परे है—अपनी
    बुद्धि में अबोध्य, अपनी सामर्थ्य में अथाह और अपनी मधुरता में अज्ञेय।


    ठीक अर्थ में केवल वही, जो भला है—अजन्मा पिता और सर्वथा सिद्ध—अपनी संतान, हर सद्गुण और हर मूल्यवान वस्तु से परिपूर्ण है। उसके पास इससे भी अधिक है, यहाँ तक कि उसमें हर प्रकार की दुर्भावना का अभाव है। इस प्रकार यह जाना जा सकता है कि जिनके पास कुछ भी है, वे उसके लिए उसी के ऋणी हैं, क्योंकि वही उसे देता है। फिर भी वह पहुँच से परे है और देते-देते कभी नहीं थकता; वह अपने दिए हुए वरदानों में धनी है और उदारता से बाँटे गए उपकारों में विश्राम करता है।


    उसकी श्रेणी, उसका स्वरूप और उसकी महान विशालता ऐसी है कि आरम्भ से कोई उसके साथ नहीं रहा। ऐसा कोई स्थान नहीं जहाँ वह निवास करता हो, जहाँ से वह निकलता हो या जिसमें वह प्रवेश करता हो। कोई आदि-रूप भी नहीं है जिसे वह काम करते समय नमूने के रूप में प्रयोग करे। वह जो कुछ करता है उसमें कोई कठिनाई उसके साथ नहीं होती, न कोई ऐसा पदार्थ उपलब्ध है जिसे लेकर वह अपनी रची हुई वस्तुओं की रचना करे। न उसके भीतर कोई ऐसा तत्त्व विद्यमान है जिसका उपयोग वह अपनी उत्पन्न की हुई वस्तुओं को उत्पन्न करने में करे, और न उसके काम में उसका साथ देनेवाला कोई सहकर्मी है। ऐसी कोई बात कहना अज्ञान है। इसके बजाय यह कहना चाहिए कि वह भला, निर्दोष, सिद्ध और [] सम्पूर्ण है, क्योंकि वही समग्रता है।


    जितने भी नाम सोचे या बोले, देखे या समझे जाते हैं, उनमें से कोई उस पर लागू नहीं होता—चाहे वे कितने ही अत्यन्त प्रतापी, महिमा देनेवाले और श्रद्धापूर्ण क्यों न हों। फिर भी उसकी महिमा और आदर के लिए ऐसे नाम बोले जा सकते हैं, जितनी क्षमता उसकी महिमा करनेवालों में है। उसके अस्तित्व, सत्ता और स्वरूप में जो अन्तर्निहित है, उसे मन धारण नहीं कर सकता, शब्द व्यक्त नहीं कर सकते, आँखें देख नहीं सकतीं और कोई समझ नहीं सकता। इसका कारण उसकी अगम्य महानता, पकड़ से परे गहराई, असीम ऊँचाई और अपरिमित <विस्तार> है।


    अजन्मे का स्वभाव यह है: वह किसी सीमित वस्तु की तरह न तो फैलकर किसी वस्तु तक पहुँचता है, न उससे जुड़ता है। इसके विपरीत, उसका स्वभाव ऐसा है कि उसका कोई चेहरा या रूप नहीं—वे बातें जिन्हें इन्द्रियों द्वारा ग्रहण किया जा सकता है। इसीलिए वह अबोध्य है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “समग्रता” यहाँ उस सर्वसमावेशी पूर्णता के लिए प्रयुक्त है जिसकी जड़ पिता को कहा गया है। आगे आया बहुवचन “समस्तताएँ” मूल साक्ष्य के बहुवचन को दर्शाता है।
    reason: तकनीकी पद के एकवचन और बहुवचन के भेद को सामान्य पाठक के लिए स्पष्ट करना।
  - marker: b
    text: '[] पाण्डुलिपि में रिक्त या क्षतिग्रस्त स्थान, [ ] सम्पादकीय पूर्ति, और < > अनुमानित पुनर्स्थापना को दर्शाते हैं। उपलब्ध प्राचीन स्रोत कॉप्टिक है; यह हिन्दी प्रारूप दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है और प्रत्यक्ष कॉप्टिक समीक्षा अभी शेष है।'
    reason: पाठ-साक्ष्य के चिह्नों और इस प्रारूप की स्रोतगत सीमा को पारदर्शी रखना।
lexical_decisions:
