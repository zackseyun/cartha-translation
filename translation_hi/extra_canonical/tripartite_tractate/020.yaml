translation:
  language: hi
  text: 'उसने सभी आर्कोनों[a] के ऊपर एक ऐसा आर्कोन नियुक्त किया जिसे कोई आदेश नहीं देता। वही उन सबका प्रभु है—अर्थात वह मुख, जिसे वचन ने अपने विचार के द्वारा समस्तताओं के पिता का प्रतिरूप होने के लिए उत्पन्न किया। इसलिए वह हर उस <नाम> से सुशोभित है जो उसका सदृश रूप है, क्योंकि उसमें हर गुण और महिमामय विशेषता है। इसी कारण उसे “पिता,” “परमेश्वर,” “डेमिउर्ज[b],” “राजा,” “न्यायाधीश,” “स्थान,” “निवास” और “व्यवस्था” भी कहा जाता है। वचन नीचे की वस्तुओं के कार्य को व्यवस्थित करने के लिए उसे हाथ के समान काम में लाता है, और जो भविष्यवाणी की जानी है उसे कहने के लिए मुख के समान उसका उपयोग करता है। उसने कहा और व्यवस्था की; और जब उसने देखा कि (उसके कार्य) महान, अच्छे और अद्भुत थे, तो वह आनंदित और प्रसन्न हुआ, मानो [] उसने अपने ही विचारों से उन्हें कहा और किया हो। वह इस बात से अनजान था कि उसके भीतर की गति उस आत्मा से उत्पन्न हुई थी, जो उसे पूर्वनिर्धारित रीति से चलाती है कि वह वही करे जो वह इच्छा करता है।


    जो वस्तुएँ उससे अस्तित्व में आईं, उनके विषय में उसने कहा, और वे उन आत्मिक स्थानों के सदृश अस्तित्व में आईं जिनका उल्लेख हमने पहले प्रतिरूपों के प्रसंग में किया था। उसने केवल कार्य ही नहीं <किया>; क्योंकि अपनी उद्धार-योजना का पिता नियुक्त किए जाने पर उसने न केवल अपने द्वारा और बीजों के द्वारा, बल्कि [उस] चुनी हुई आत्मा [के द्वारा] भी उत्पन्न किया, जो [उसके माध्यम से] नीचे के स्थानों में उतरेगी। वह केवल अपने आत्मिक वचन ही नहीं कहता, <बल्कि> ऐसा छिपे हुए ढंग से उस आत्मा के माध्यम से करता है, जो पुकारती है और ऐसी वस्तुओं को जन्म देती है जो उसकी अपनी प्रकृति से परे हैं। क्योंकि अपनी प्रकृति के अनुसार वह परमेश्वर और पिता है और आदर की अन्य सभी उपाधियाँ भी रखता है, इसलिए उसने मान लिया कि वे उसकी अपनी प्रकृति से संबंधित हैं।


    उसने अपनी आज्ञा माननेवालों के लिए विश्राम स्थापित किया; और जो उसकी आज्ञा नहीं मानते, उनके लिए <उसने> दंड भी <ठहराए>। एक स्वर्गोद्यान और एक राज्य उसके साथ निवास करते हैं, और वे सब अन्य वस्तुएँ भी जो उससे पहले से विद्यमान ऐयोन[c] में निवास करती हैं। विचार से उनका संबंध होने के कारण वे प्रतिलिपियों से अधिक मूल्यवान हैं। (यह संबंध) मानो [] छाया और वस्त्र से तुलना करने योग्य है, क्योंकि वह यह नहीं देख सकता कि जो कुछ अस्तित्व में है, वह वास्तव में किस प्रकार अस्तित्व में है।


    उसने श्रमिकों और सेवकों को स्थापित किया, ताकि वे उसके किए और कहे जानेवाले कामों में सहायता करें; क्योंकि जहाँ कहीं उसने कार्य किया, वहाँ उसने अपने सुंदर नाम सहित अपना मुख पीछे छोड़ दिया और जिस बात पर वह मनन करता है उसे उत्पन्न और घोषित किया। [उसने] अपने ही सार से अपने स्थान में प्रकाश के दृश्यमान प्रतिरूप और [वे] (अदृश्य) आत्मिक [स्थान] स्थापित किए। इस प्रकार हर स्थान उसके द्वारा सुशोभित हुआ और अपने स्थापित करनेवाले का प्रतिरूप प्रतिबिंबित करता रहा; और इसी प्रकार वे स्थापित किए गए। यद्यपि स्वर्गोद्यान, राज्य, विश्राम, प्रतिज्ञाएँ और उसकी इच्छा पूरी करनेवाले सेवकों की असंख्य भीड़ शासन करनेवाले प्रभु हैं, फिर भी वे उस प्रभु के अधीन रखे गए हैं जिसने उन्हें नियुक्त किया।


    इस प्रकार उसकी बात सुनने के बाद, उसने उन ज्योतियों को—जो इस व्यवस्था के स्रोत को <बनाती> हैं—नीचे की वस्तुओं की संरचना के ऊपर नियुक्त किया। अदृश्य आत्मा ने उसे इसी प्रकार चलाया, ताकि वह [] अपने ही सेवक के द्वारा शासन करने को प्रवृत्त हो; उस सेवक को उसने हाथ, <मुख>, यहाँ तक कि अपने चेहरे के रूप में भी काम में लिया। उसने आदेश, धमकियाँ और भय उत्पन्न किए, ताकि जो अज्ञान के कारण कार्य करते थे […] वे [अपने लिए दिए गए] स्थान को बनाए रख सकें, क्योंकि वे अपने ऊपर के आर्कोनों की [जंजीरों से] अपने-अपने स्थानों में बँधे हैं।


    पदार्थ की संपूर्ण प्रकृति [तीन] श्रेणियों में विभाजित [है]। आत्मिक वचन ने कल्पना और घमंड से [पहली] शक्तियाँ उत्पन्न कीं और आत्मिक पद के अनुसार उन्हें प्रथम स्थान पर रखा। जिन (शक्तियों) को इन पहली शक्तियों ने प्रभुत्व की लालसा से उत्पन्न किया, उन्हें उसने मध्य (पद) में रखा, क्योंकि परिणामस्वरूप वे प्रभुत्व की लालसा रखनेवाली शक्तियाँ <थीं>, ताकि वे शासन कर सकें और अपने नीचे की व्यवस्था को बलपूर्वक बाध्यकारी आदेश दे सकें। जो ईर्ष्या, डाह और ऐसी प्रवृत्तियों से निकलनेवाली हर दूसरी संतान से अस्तित्व में आए, उन्हें उसने दासता के क्रम में रखा, ताकि वे सबसे बाहरी सीमाओं को नियंत्रित करें और अस्तित्व में आनेवाली सभी वस्तुओं तथा समस्त उत्पत्ति को आदेश दें। इन्हीं से वे (सत्ताएँ) निकलती हैं जो अचानक प्राण लेनेवाले रोग लाती हैं और उत्पन्न करने को उत्सुक रहती हैं, यद्यपि जिस स्थान से वे निकली थीं और जहाँ वे फिर लौटेंगी, वहाँ वे कुछ भी नहीं थीं। इसलिए उसने उनके ऊपर अधिकार-संपन्न शक्तियाँ नियुक्त कीं, जो पदार्थ पर निरंतर काम करती हैं, ताकि [] अस्तित्वमान सत्ताओं की संतान भी उसी प्रकार निरंतर अस्तित्व
    में आती रहे, क्योंकि यही उनकी महिमा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आर्कोन” का अर्थ शासक या अधिकार रखनेवाली सत्ता है; इस ग्रंथ में यह एक विशिष्ट ब्रह्मांडीय पद है।
    reason: तकनीकी पद को पाठक के लिए स्पष्ट करना, बिना उसे किसी एक साधारण हिन्दी शब्द तक सीमित किए।
  - marker: b
    text: “डेमिउर्ज” यूनानी मूल का पद है, जिसका सामान्य अर्थ जगत को गढ़ने या व्यवस्थित करनेवाला कर्ता है; यहाँ यह एक विशिष्ट अधीनस्थ शासक की उपाधि है।
    reason: लिप्यंतरित दार्शनिक पद का अर्थ देना और ‘परम सृष्टिकर्ता’ जैसी अतिरिक्त धर्मसैद्धांतिक धारणा से बचना।
  - marker: c
    text: “ऐयोन” का अर्थ युग हो सकता है, पर ऐसे ग्रंथों में यह किसी शाश्वत क्षेत्र, लोक या ब्रह्मांडीय सत्ता को भी सूचित कर सकता है।
    reason: मूल तकनीकी पद की वास्तविक अर्थगत अस्पष्टता बनाए रखना।
lexical_decisions:
