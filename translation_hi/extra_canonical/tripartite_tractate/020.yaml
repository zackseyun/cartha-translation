  revised_text: 'उसने सभी आर्कोनों[a] के ऊपर एक ऐसा आर्कोन नियुक्त किया जिसे कोई आदेश नहीं देता। वही उन सबका प्रभु है—अर्थात वह मुख, जिसे वचन ने अपने विचार के द्वारा समस्तताओं के पिता का प्रतिरूप होने के लिए उत्पन्न किया। इसलिए वह हर उस <नाम> से सुशोभित है जो उसका सदृश रूप है, क्योंकि उसमें हर गुण और महिमामय विशेषता है। इसी कारण उसे “पिता,” “परमेश्वर,” “डेमिउर्ज[b],” “राजा,” “न्यायाधीश,” “स्थान,” “निवास” और “व्यवस्था” भी कहा जाता है। वचन नीचे की वस्तुओं के कार्य को व्यवस्थित करने के लिए उसे हाथ के समान काम में लाता है, और जो भविष्यवाणी की जानी है उसे कहने के लिए मुख के समान उसका उपयोग करता है। उसने कहा और व्यवस्था की; और जब उसने देखा कि (उसके कार्य) महान, अच्छे और अद्भुत थे, तो वह आनंदित और प्रसन्न हुआ, मानो [] उसने अपने ही विचारों से उन्हें कहा और किया हो। वह इस बात से अनजान था कि उसके भीतर की गति उस आत्मा से उत्पन्न हुई थी, जो उसे पूर्वनिर्धारित रीति से चलाती है कि वह वही करे जो वह इच्छा करता है।


    जो वस्तुएँ उससे अस्तित्व में आईं, उनके विषय में उसने कहा, और वे उन आत्मिक स्थानों के सदृश अस्तित्व में आईं जिनका उल्लेख हमने पहले प्रतिरूपों के प्रसंग में किया था। उसने केवल कार्य ही नहीं <किया>; क्योंकि अपनी उद्धार-योजना का पिता नियुक्त किए जाने पर उसने न केवल अपने द्वारा और बीजों के द्वारा, बल्कि [उस] चुनी हुई आत्मा [के द्वारा] भी उत्पन्न किया, जो [उसके माध्यम से] नीचे के स्थानों में उतरेगी। वह केवल अपने आत्मिक वचन ही नहीं कहता, <बल्कि> ऐसा छिपे हुए ढंग से उस आत्मा के माध्यम से करता है, जो पुकारती है और ऐसी वस्तुओं को जन्म देती है जो उसकी अपनी प्रकृति से परे हैं। क्योंकि अपनी प्रकृति के अनुसार वह परमेश्वर और पिता है और आदर की अन्य सभी उपाधियाँ भी रखता है, इसलिए उसने मान लिया कि वे उसकी अपनी प्रकृति से संबंधित हैं।


    उसने अपनी आज्ञा माननेवालों के लिए विश्राम स्थापित किया; और जो उसकी आज्ञा नहीं मानते, उनके लिए <उसने> दंड भी <ठहराए>। एक स्वर्गोद्यान और एक राज्य उसके साथ निवास करते हैं, और वे सब अन्य वस्तुएँ भी जो उससे पहले से विद्यमान ऐयोन[c] में निवास करती हैं। विचार से उनका संबंध होने के कारण वे प्रतिलिपियों से अधिक मूल्यवान हैं। (यह संबंध) मानो [] छाया और वस्त्र से तुलना करने योग्य है, क्योंकि वह यह नहीं देख सकता कि जो कुछ अस्तित्व में है, वह वास्तव में किस प्रकार अस्तित्व में है।


