translation:
  language: hi
  text: '**पिता और पुत्र**


    यही वह है जो उन्हें तृप्ति, पोषण, आनन्द और प्रबोधन की भरपूरी के लिए दिया गया था। इस भरपूरी में उनके साथ उसका मिलकर काम करना, उसका ज्ञान और उनके साथ उसका घुल-मिल जाना समाया है। वास्तव में यही वह है जो “पुत्र” कहलाता भी है और पुत्र है भी, क्योंकि वही समस्तताएँ[a] है। वे जानते हैं कि वह कौन है और यह भी कि वह उन्हें वस्त्रों से ढाँपता है। यही वह है जो “पुत्र” कहलाता है, जिसके अस्तित्व को वे समझते हैं और जिसे वे खोज रहे थे। यही वह है जो पिता के रूप में विद्यमान है—वह जिसके विषय में वे बोल नहीं सकते और जिसे वे ग्रहण नहीं कर पाते। यही वह प्रथम है जो अस्तित्व में आया। कोई भी उसे ग्रहण या समझ नहीं सकता। अथवा क्या कोई उस परम महान के निकट जा सकता है—उसके निकट जो, ठीक-ठीक कहा जाए तो, पहले से विद्यमान है? फिर भी, उसके लिए सोचे गए [] या उसके विषय में बोले गए सभी नाम उसके सम्मान में प्रयुक्त होते हैं। वे उसकी ओर संकेत भर करते हैं, और हर कोई अपनी सामर्थ्य के अनुसार उनके द्वारा उसकी महिमा करता है।[b]


    जब उसने जन्म देने और समस्तताओं के लिए ज्ञान उत्पन्न करने को अपने आपको विस्तृत किया, तब जो उससे प्रकट हुआ, वह [. . .] हर नाम को बिना किसी मिथ्यापन के धारण करता है। ठीक-ठीक कहा जाए तो केवल वही प्रथम है—पिता से आया मनुष्य—जिसे मैं [कहता हूँ]:


    निराकार स्वरूप,


    देहरहित देह,


    अदृश्य मुख,


    अकथनीय वचन,


    अगम मन,


    उससे बहता हुआ सोता,


    रोपे गए जनों की जड़,


    और विद्यमान प्राणियों का ईश्वर;


    जिन्हें वह प्रकाशित करता है उनका प्रकाश,


    जिनसे वह प्रेम करता है उनका प्रेम,


    जिनका वह पूर्व-प्रबन्ध से मार्गदर्शन करता है उनका पूर्व-प्रबन्ध,


    जिन्हें उसने बुद्धिमान बनाया उनकी बुद्धि,


    जिन्हें उसने सामर्थ्य दी उनकी सामर्थ्य,


    जिन्हें वह अपने पास एकत्र करता है उनकी सभा,


    खोजी जानेवाली बातों का प्रकाशन,


    देखनेवालों की आँख,


    साँस लेनेवालों की साँस,


    जीवितों का जीवन,


    और समस्तताओं के साथ मिले हुओं की एकता।


    ये सभी उस एक में विद्यमान रहते हैं, क्योंकि वह अपने आपको पूरी तरह इनसे वस्त्र के समान ढाँप लेता है; फिर भी उसे कभी उसके एकमात्र नाम से नहीं पुकारा जाता। और अस्तित्व के इस एक ही ढंग में वे समान रूप से वह एक भी हैं और समस्तताएँ भी। वह किसी देह की तरह अलग-अलग नहीं किया जा सकता, न ही अपने पाए हुए नामों के कारण इस प्रकार बँटा हुआ है मानो एक ढंग से वह एक वस्तु हो और [] दूसरे ढंग से कुछ [भिन्न]। फिर वह [. . .] में बदलता भी नहीं, न ही अपने सोचे हुए नामों में रूपान्तरित होता है—मानो अब यह और फिर वह बन जाए, अभी एक वस्तु हो और किसी दूसरे समय कुछ भिन्न बन जाए। इसके विपरीत, वह अन्त तक पूर्णतः स्वयं ही बना रहता है। [वह] एक ही साथ और अनन्तकाल तक, बिना किसी अपवाद के, सभी समस्तताएँ है। वही उन सबको अपने भीतर समेटे हुए है। उसने समस्तताओं के सामने पिता को प्रकट किया। यहाँ तक कि वह स्वयं समस्तताएँ है, क्योंकि वह अपने ही विषय का ज्ञान है और वह प्रत्येक गुण और सामर्थ्य है। और [वह] स्वयं वह आँख [है] जिसके द्वारा वह ज्ञान रखता है; वह अपने भीतर अपने आपको पूरी तरह देखता है और उसके पास एक पुत्र और एक स्वरूप है।


    इसलिए जिस रीति से वह उन्हें जन्म देता है, उसके कारण उसकी सामर्थ्यें और गुण अनगिनत और अनसुने हैं। जिन्हें उसके वचन जन्म देते हैं, वे अनगिनत और अविभाज्य हैं; और ऐसी ही उसकी शिक्षाएँ और उसकी समस्तताएँ भी हैं। वह उन्हें जानता है—उन्हें, जो वही हैं जो वह स्वयं है—क्योंकि वे उस एक नाम में विद्यमान रहते हैं और वे सभी उसी के द्वारा बोलते हैं। और वह उन्हें प्रकट करता है, ताकि वे जान पाएँ कि वे अपने-अपने विशिष्ट गुणों के अनुरूप, फिर भी एकीकृत रीति से, अस्तित्व रखते हैं।


    [a] “समस्तताएँ” उस बहुवचन पारिभाषिक अभिव्यक्ति का अनुवाद है जिसे उपलब्ध अंग्रेज़ी साक्ष्य में *the Totalities* कहा गया है; प्रसंग में यह अस्तित्व की समस्त पूर्णताओं या सत्ताओं की सामूहिकता की ओर संकेत करती है, पर इसका आशय जानबूझकर अधिक निश्चित नहीं किया गया है।


    [b] यह प्रारूप उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी शेष है। खाली कोष्ठक [], बिन्दुओं वाले कोष्ठक [. . .] और कोष्ठकों में पुनःस्थापित शब्द पाण्डुलिपि की क्षति अथवा सम्पादकीय पुनर्निर्माण के संकेत सुरक्षित रखते हैं।'
  philosophy: optimal-equivalence
