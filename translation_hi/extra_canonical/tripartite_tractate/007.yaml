    reason: मुख्य तकनीकी पद की बहुवचन और अस्पष्ट सत्ता-सम्बन्धी प्रकृति स्पष्ट करना।
  - marker: b
    text: यह प्रारूप उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी शेष है। खाली कोष्ठक [], बिन्दुओं वाले कोष्ठक [. . .] और कोष्ठकों में पुनःस्थापित शब्द पाण्डुलिपि की क्षति अथवा सम्पादकीय पुनर्निर्माण के संकेत सुरक्षित रखते हैं।
    reason: स्रोतगत सीमा तथा पाठालोचनात्मक संकेतों की प्रकृति पारदर्शी बनाना।
lexical_decisions:
- source_word: the Totalities
  choice: समस्तताएँ
  rationale: बहुवचन और पारिभाषिक स्वरूप को बनाए रखा गया है; ‘समग्रता’ जैसा एकवचन इस ग्रन्थ की सत्ता-सम्बन्धी बहुलता को समतल कर देता।
- source_word: mixing with them
  choice: उनके साथ उसका घुल-मिल जाना
  rationale: मूल साक्ष्य की सहभागिता और मिश्रण—दोनों ध्वनियों को सहज हिन्दी में बनाए रखता है, बिना इसे केवल संगति या एकत्व में सीमित किए।
- source_word: the human from the Father
  choice: पिता से आया मनुष्य
  rationale: असामान्य मानव-संज्ञा और पिता से उद्भव का सम्बन्ध ज्यों का त्यों रखा गया है; इसे ‘मानव-पुत्र’ या किसी रूढ़ उपाधि में नहीं बदला गया।
- source_word: providence
  choice: पूर्व-प्रबन्ध
  rationale: दैवी अग्रिम देखभाल और मार्गदर्शन का भाव देता है तथा निकटवर्ती क्रियात्मक वाक्य में ‘मार्गदर्शन’ से अर्थ स्पष्ट होता है।
- source_word: subsist
  choice: विद्यमान रहते हैं
  rationale: सत्ता-सम्बन्धी कथन को सामान्य आधुनिक हिन्दी में व्यक्त करता है, पर इसे केवल ‘रहते हैं’ या स्थानगत निवास तक सीमित नहीं करता।
- source_word: assembly
  choice: सभा
  rationale: एकत्र किए गए समुदाय का सामान्य और गरिमामय रूप; बाद की कलीसियाई संस्थागत पहचान को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: पुत्र का ‘समस्तताएँ’ होना
