  text: 'One day Jesus was with his disciples in Judea. He found them sitting together, practicing their piety. When he [came up to] his disciples sitting together and praying over the bread, [he] laughed.


    The disciples said to him, “Master, why are you laughing at [our] prayer? What have we done? [This] is what is right.”


    He answered them, “I’m not laughing at you. You aren’t doing this because you want to, but because through this your God [will be] praised.”


    They said, “Master, you […] are the Son of our God!”


    Jesus said to them, “How do [you] know me? Truly [I] say to you, no generation of the people among you will know me.”


    When his disciples heard this, [they] began to grow angry and furious, and they began to curse him in their hearts.


    But when Jesus noticed their ignorance, [he said] to them, “Why are you letting your anger trouble you? Has your God within you and [his stars] become angry with your souls? If any of you is [strong enough] among humans to bring out the perfect Humanity, stand up and face me.”


    They all said, “We’re strong enough.” But their spirits weren’t brave enough to stand before [him]—except for Judas Iscariot. He was able to stand before him, but he couldn’t look him in the eye, so he looked away.


    Judas [said] to him, “I know who you are and where you’ve come from. You’ve come from the immortal realm of Barbelo, and I’m not worthy to utter the name of the one who’s sent you.”


    Then Jesus, knowing that he was thinking about what is exalted, said to him, “Come away from the others, and I’ll tell you the mysteries of the kingdom. Not so that you’ll go there, but you’ll grieve much because someone else will replace you to complete the twelve [elements] before their God.”


    Judas said to him, “When will you tell me these things, and when will the great day of light dawn for the generation […]?”


    But when he said these things, Jesus left him.'
translation:
  language: hi
  text: 'एक दिन यीशु यहूदिया में अपने शिष्यों के साथ था। उसने उन्हें एक साथ बैठे हुए धार्मिक आचरण करते पाया। जब वह अपने शिष्यों के [पास आया और उन्हें] एक साथ बैठे रोटी पर प्रार्थना करते देखा, तो [वह] हँसा।


    शिष्यों ने उससे कहा, “गुरु, आप [हमारी] प्रार्थना पर क्यों हँस रहे हैं? हमने क्या किया है? [यही] तो उचित है।”


    उसने उन्हें उत्तर दिया, “मैं तुम पर नहीं हँस रहा। तुम यह अपनी इच्छा से नहीं कर रहे, बल्कि इसलिए कर रहे हो कि इसके द्वारा तुम्हारे परमेश्वर की [स्तुति होगी]।”


    उन्होंने कहा, “गुरु, आप […] हमारे परमेश्वर के पुत्र हैं!”


    यीशु ने उनसे कहा, “तुम मुझे कैसे जानते हो? मैं तुमसे सच [कहता] हूँ, तुम्हारे बीच के लोगों की कोई पीढ़ी मुझे नहीं जानेगी।”


    यह सुनकर उसके शिष्य क्रोधित और आग-बबूला होने लगे और मन ही मन उसे कोसने लगे।


    पर जब यीशु ने उनकी अज्ञानता देखी, तो [उसने] उनसे कहा, “तुम अपने क्रोध से व्याकुल क्यों हो रहे हो? क्या तुम्हारे भीतर के तुम्हारे परमेश्वर और [उसके तारे] तुम्हारी आत्माओं पर क्रोधित हो गए हैं?[a] यदि तुममें से कोई मनुष्यों के बीच इतना [सामर्थी] है कि सिद्ध मानवता को प्रकट कर सके,[b] तो उठकर मेरे सामने आए।”


    उन सबने कहा, “हममें सामर्थ्य है।” लेकिन यहूदा इस्करियोती को छोड़ किसी की आत्मा में [उसके] सामने खड़े होने का साहस नहीं था। वह उसके सामने खड़ा हो सका, पर उसकी आँखों में नहीं देख सका, इसलिए उसने मुँह फेर लिया।


    यहूदा ने उससे [कहा], “मैं जानता हूँ कि आप कौन हैं और कहाँ से आए हैं। आप बारबेलो के अमर लोक से आए हैं,[c] और जिसने आपको भेजा है, उसका नाम उच्चारित करने के योग्य मैं नहीं हूँ।”


    तब यीशु ने यह जानकर कि वह ऊँची बातों पर विचार कर रहा था, उससे कहा, “दूसरों से अलग होकर मेरे पास आओ, और मैं तुम्हें राज्य के रहस्य बताऊँगा। इसलिए नहीं कि तुम वहाँ जाओगे; बल्कि तुम्हें बहुत दुःख उठाना होगा, क्योंकि कोई दूसरा तुम्हारा स्थान लेगा, ताकि उनके परमेश्वर के सामने बारह [तत्त्व] पूरे हो जाएँ।”[d]


    यहूदा ने उससे कहा, “आप मुझे ये बातें कब बताएँगे, और उस पीढ़ी के लिए प्रकाश का महान दिन कब उदित होगा […]?”


    पर जब उसने ये बातें कहीं, तो यीशु उसे छोड़कर चला गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे भीतर” का संबंध “तुम्हारे परमेश्वर” से है या पूरे वाक्यांश से, यह उपलब्ध साक्ष्य में स्पष्ट नहीं है; “[उसके तारे]” पुनर्स्थापित पाठ है।
    reason: वाक्यगत अस्पष्टता और पांडुलिपि-पुनर्स्थापन को स्पष्ट करना।
  - marker: b
    text: “सिद्ध मानवता” संभवतः इस ग्रंथ की एक तकनीकी अभिव्यक्ति है; इसका आशय “सिद्ध मनुष्य” भी समझा जा सकता है।
    reason: महत्त्वपूर्ण दार्शनिक/मानवशास्त्रीय बहुअर्थकता को सुरक्षित रखना।
  - marker: c
    text: बारबेलो इस ग्रंथ की ब्रह्मांड-कल्पना में एक विशिष्ट स्वर्गीय नाम है; यहाँ नाम का केवल लिप्यंतरण किया गया है।
    reason: अपरिचित पारिभाषिक नाम के बारे में न्यूनतम पाठकीय सहायता देना।
  - marker: d
    text: “[तत्त्व]” क्षतिग्रस्त पाठ की पूर्ति है। इसका सटीक आशय अनिश्चित है और इसे सीधे “शिष्य” मान लेना आवश्यक नहीं।
    reason: पाठीय अनिश्चितता और संभावित धार्मिक अति-व्याख्या से बचना।
lexical_decisions:
- source_word: practicing their piety
  choice: धार्मिक आचरण करते
  rationale: भक्ति या उपासना जैसे अधिक विशिष्ट अर्थ थोपे बिना बाहरी धार्मिक क्रिया का सामान्य और स्वाभाविक हिन्दी रूप।
- source_word: praying over the bread
  choice: रोटी पर प्रार्थना करते
  rationale: ‘over’ के अनुष्ठानिक संबंध को बनाए रखा गया; इसे प्रभु-भोज या धन्यवाद-प्रार्थना कहकर व्याख्यायित नहीं किया गया।
- source_word: perfect Humanity
  choice: सिद्ध मानवता
  rationale: असामान्य और संभवतः तकनीकी अभिव्यक्ति की अस्पष्टता रखी गई; इसे ‘सिद्ध मनुष्य’ में सीमित नहीं किया गया।
- source_word: realm of Barbelo
  choice: बारबेलो का अमर लोक
  rationale: विशिष्ट नाम का लिप्यंतरण और realm के लिए सहज ‘लोक’; ज्ञानवादी अवधारणा को किसी दूसरी धार्मिक संज्ञा से नहीं बदला गया।
- source_word: mysteries of the kingdom
  choice: राज्य के रहस्य
  rationale: पारंपरिक अर्थ-संगति और पाठ की रहस्यात्मक भाषा दोनों संरक्षित हैं।
- source_word: generation
  choice: पीढ़ी
  rationale: हर स्थान पर मूल साक्ष्य की बहुअर्थी सामूहिक/वंशगत संज्ञा को सामान्य हिन्दी ‘पीढ़ी’ से रखा गया।
- source_word: elements
  choice: तत्त्व
  rationale: पूरक शब्द की अनिश्चित और संभवतः ब्रह्मांडीय प्रकृति बनाए रखने के लिए कोष्ठक सहित तटस्थ शब्द चुना गया।
theological_decisions:
- issue: ‘your God’ और यीशु द्वारा प्रयुक्त भेदकारी भाषा
  choice: तुम्हारे परमेश्वर
  alternative: परमेश्वर / हमारे परमेश्वर
  rationale: पाठ में यीशु और शिष्यों की धार्मिक समझ के बीच जानबूझकर उपस्थित तनाव को समाप्त नहीं किया गया।
- issue: ‘God within you and [his stars]’ की वाक्यगत अस्पष्टता
  choice: तुम्हारे भीतर के तुम्हारे परमेश्वर और [उसके तारे]
  alternative: तुम्हारे भीतर तुम्हारा परमेश्वर और [उसके तारे]
  rationale: ‘within you’ का संबंध व्याकरणतः अनिश्चित है; मुख्य पाठ में निकटतम संरचना रखी और पादटिप्पणी में अस्पष्टता बताई गई।
- issue: ‘bring out the perfect Humanity’
  choice: सिद्ध मानवता को प्रकट कर सके
  alternative: सिद्ध मनुष्य को सामने ला सके
  rationale: इसे केवल नैतिक पूर्णता, किसी एक आदर्श मनुष्य या विशिष्ट मुक्तिदाता-सिद्धांत के रूप में निर्णीत नहीं किया गया।
- issue: यहूदा का राज्य में जाना
  choice: इसलिए नहीं कि तुम वहाँ जाओगे
  alternative: यद्यपि तुम वहाँ नहीं जाओगे
  rationale: कथन की कठोर नकारात्मकता रखी गई, पर उसके अंतिम उद्धार या दंड के बारे में अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
- issue: बारह [तत्त्व] की पूर्ति
  choice: उनके परमेश्वर के सामने बारह [तत्त्व] पूरे हो जाएँ
  alternative: उनके परमेश्वर के सामने बारह [शिष्य] पूरे हो जाएँ
  rationale: क्षतिग्रस्त/पूरित पाठ को परिचित बारह शिष्यों की धारणा से चुपचाप नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज गद्य। संवाद में ‘आप’ और शिष्यों को संबोधन में ‘तुम’ रखा गया है। वर्गाकार कोष्ठक और दीर्घविराम पांडुलिपि की क्षति अथवा संपादकीय पुनर्स्थापन के संकेत के रूप में ज्यों के त्यों सुरक्षित हैं। उपलब्ध आधार प्रत्यक्ष कॉप्टिक समीक्षा नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; अतः यह प्रकाशन-पूर्व अंतरिम, स्रोत-सचेत मसौदा है और कॉप्टिक पाठ से पुनः जाँच आवश्यक है।
