  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: hi
  text: 'जब यीशु ने ये बातें [कहीं], तो वह यहूदा इस्करियोती को अपने साथ [लेकर] वहाँ से चला गया। उसने उससे कहा, “ऊँचे पर्वत का जल […] [से] है। वह इस लोक के [फल …] के वृक्ष के [कुएँ को सींचने …] नहीं आया […] कुछ समय के बाद […], बल्कि वह परमेश्वर के स्वर्गोद्यान और अविनाशी [फल] को सींचने आया, क्योंकि [वह] उस पीढ़ी की [जीवन-चाल] को नष्ट नहीं करेगा, बल्कि [वह] सदा-सर्वदा बना रहेगा।”[a]


    यहूदा ने [उससे कहा, “मुझे बता], इस पीढ़ी का फल किस प्रकार का है?”


    यीशु ने कहा, “मनुष्यों की हर पीढ़ी के प्राण मर जाएँगे। पर जब ये लोग राज्य में अपना समय पूरा कर लेंगे और आत्मा उन्हें छोड़ देगी, तब उनके शरीर मर जाएँगे, पर उनके प्राण जीवित रहेंगे और ऊपर उठा लिए जाएँगे।”[b]


    यहूदा ने कहा, “तब मनुष्यों की बाकी पीढ़ियाँ क्या करेंगी?”


    यीशु ने कहा, “[चट्टान] पर बीज बोकर उसका फल काटना संभव नहीं है। उसी प्रकार, नाशवान बुद्धि [और] नश्वर मनुष्यों को रचने वाले हाथ के साथ [भ्रष्ट] वंश पर [बीज बोना संभव नहीं है], ताकि उनके प्राण ऊपर के लोकों में चढ़ जाएँ। [सच] मैं तुमसे कहता हूँ, कोई [शासक], स्वर्गदूत [या] शक्ति उन [स्थानों] को नहीं देख सकेगी जिन्हें [यह महान] पवित्र पीढ़ी [देखेगी]।” यह कहकर यीशु वहाँ से चला गया।[c]


    यहूदा ने कहा, “गुरु, जैसे आपने उन सबकी बात सुनी है, वैसे अब मेरी भी सुनिए, क्योंकि मैंने एक महान दर्शन देखा है।”


    यह सुनकर यीशु हँसा। उसने उससे कहा, “तू इतना व्याकुल क्यों है, हे तेरहवें दुष्टात्मा? फिर भी बोल; मैं तेरी सह लूँगा।”[d]


    यहूदा ने उससे कहा, “दर्शन में मैंने अपने आपको देखा। वे बारह शिष्य मुझे पत्थर मार रहे थे और [तेजी से मेरा] पीछा कर रहे थे। मैं उस स्थान पर भी पहुँचा जहाँ [मैं आपके पीछे आया था]। मैंने [उस स्थान पर एक भवन देखा], और मेरी आँखें उसका आकार [नाप] नहीं सकीं। महान लोग उसके चारों ओर थे, और उस भवन की छत हरियाली से ढकी थी। भवन के बीच में [एक भीड़ …] थी। गुरु, मुझे इन लोगों के साथ भीतर ले चलिए!”[e]


    [यीशु] ने उत्तर दिया, “यहूदा, तेरे तारे ने तुझे भटका दिया है।” फिर उसने कहा, “नश्वर जन्म वाला कोई मनुष्य उस भवन में प्रवेश करने योग्य नहीं है जिसे तूने देखा है, क्योंकि वह स्थान पवित्र लोगों के लिए सुरक्षित रखा गया है। वहाँ न सूर्य शासन करेगा, न चंद्रमा, न दिन; बल्कि पवित्र लोग पवित्र स्वर्गदूतों के साथ उस लोक में सदा खड़े रहेंगे। देख, मैंने तुझे राज्य के रहस्य बताए हैं और तारों के भ्रम के विषय में सिखाया है, और […] बारह लोकों के ऊपर [ऊँचाई पर] भेजा।”[f]


    यहूदा ने कहा, “गुरु, मेरा वंश शासकों पर प्रभुत्व तो नहीं रखता, है न?”[g]


    यीशु ने उत्तर दिया, “आ, मैं तुझे [पवित्र पीढ़ी के विषय में बताऊँ—इसलिए नहीं कि तू वहाँ जाएगा], बल्कि जब तू राज्य और उसकी पूरी पीढ़ी को देखेगा, तब तू बहुत शोक करेगा।”


    यह सुनकर यहूदा ने उससे कहा, “आपने मुझे उस पीढ़ी से अलग किया—इससे मुझे क्या लाभ हुआ?”


    यीशु ने उत्तर दिया, “तू तेरहवाँ बनेगा। दूसरी पीढ़ियाँ तुझे शाप देंगी, और तू उन पर शासन करेगा। अंतिम दिनों में वे तेरे पास […] और तू ऊपर पवित्र पीढ़ी तक नहीं जाएगा।”[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अनुच्छेद में अनेक स्थान पांडुलिपि की क्षति या अनिश्चित पुनर्स्थापना के कारण कोष्ठकों और त्रिबिंदु में हैं; जल, वृक्ष, फल और ‘जीवन-चाल’ के बीच ठीक संबंध स्पष्ट नहीं है।
    reason: गंभीर पाठ-खंडितता और वाक्यगत अस्पष्टता बताना आवश्यक है।
  - marker: b
    text: यहाँ ‘प्राण’ और ‘आत्मा’ अलग शब्दों के रूप में रखे गए हैं। ‘हर पीढ़ी के प्राण मरेंगे’ और आगे ‘उनके प्राण जीवित रहेंगे’ के बीच का तनाव साक्ष्य में ही मौजूद है।
    reason: महत्त्वपूर्ण शब्दभेद और अनसुलझी धर्मवैचारिक कठिनाई सुरक्षित करना।
  - marker: c
    text: भ्रष्ट वंश, नाशवान बुद्धि, रचने वाले हाथ और प्राणों के ऊपर चढ़ने के बीच व्याकरणिक संबंध क्षतिग्रस्त पाठ के कारण अनिश्चित है।
    reason: अनुवाद को निश्चित धर्मतंत्र के रूप में पढ़े जाने से रोकना।
  - marker: d
    text: ‘तेरहवें दुष्टात्मा’ कठोर संबोधन है; इसका आशय—अपमान, व्यंग्य या कोई तकनीकी पहचान—इस अंश से निश्चित नहीं होता।
    reason: संभावित अर्थ-क्षेत्र बताए बिना एक व्याख्या थोपने से बचना।
  - marker: e
    text: भवन के स्थान, आकार, छत और भीतर की भीड़ से संबंधित वाक्य आंशिक रूप से पुनर्स्थापित हैं।
    reason: दर्शन-वर्णन में पांडुलिपीय रिक्तियों की सूचना।
  - marker: f
    text: अंतिम वाक्य में कर्ता और ‘भेजे जाने’ वाली वस्तु या व्यक्ति का उल्लेख क्षतिग्रस्त है; प्रस्तुत हिन्दी जानबूझकर अधूरी संरचना को बनाए रखती है।
    reason: खंडित पाठ को अनुमान से पूरा न करना।
  - marker: g
    text: यहाँ ‘मेरा वंश’ के पीछे ‘मेरा बीज’ जैसा शाब्दिक बिंब हो सकता है। प्रश्न की नकारात्मक रचना पुष्टि चाहने वाला प्रश्न है।
    reason: महत्त्वपूर्ण रूपक और प्रश्न की अनिश्चित अपेक्षा दर्ज करना।
  - marker: h
    text: ‘वे तेरे पास […]’ के बीच का पाठ लुप्त है। इसलिए अंतिम दिनों में दूसरी पीढ़ियाँ यहूदा के साथ क्या करेंगी, यह निश्चित नहीं है।
    reason: अंतिम भविष्यवाणी में निर्णायक पांडुलिपीय रिक्ति को स्पष्ट करना।
lexical_decisions:
- source_word: generation / race
  choice: पीढ़ी / वंश
  rationale: जहाँ समूह की कालिक या आध्यात्मिक पहचान प्रमुख है वहाँ ‘पीढ़ी’, और ‘race/seed’ के वंशगत संदर्भ में ‘वंश’ रखा गया; एक ही हिन्दी शब्द से भिन्न स्रोत-पदों का अंतर मिटाया नहीं गया।
- source_word: soul / spirit
  choice: प्राण / आत्मा
  rationale: अंग्रेज़ी साक्ष्य में soul और spirit का स्पष्ट भेद है; इसलिए क्रमशः ‘प्राण’ और ‘आत्मा’ रखकर उस तनाव को सुरक्षित किया गया।
- source_word: realm(s)
  choice: लोक / लोकों
  rationale: ब्रह्मांडीय क्षेत्रों के लिए सामान्य, समझने योग्य और अपेक्षाकृत तटस्थ हिन्दी पद।
- source_word: paradise
  choice: स्वर्गोद्यान
  rationale: ‘परमेश्वर का स्वर्गोद्यान’ उद्यान-संबंधी बिंब और पारलौकिक अर्थ दोनों को बनाए रखता है।
- source_word: demon
  choice: दुष्टात्मा
  rationale: आधुनिक हिन्दी पाठक के लिए सहज; ‘दानव’ से उत्पन्न पौराणिक देहधारी अर्थ से बचाता है।
- source_word: star
  choice: तारा
  rationale: ग्रंथ की तारकीय/ब्रह्मांडीय शब्दावली को बिना व्याख्यात्मक विस्तार के यथावत रखा गया।
- source_word: rulers
  choice: शासक
  rationale: अलौकिक सत्ताओं की संभावित तकनीकी पृष्ठभूमि को किसी विशिष्ट संप्रदायगत पद से बाँधे बिना प्रस्तुत करता है।
- source_word: seed
  choice: वंश
  rationale: यहाँ शाब्दिक ‘बीज’ अस्पष्ट और अप्राकृतिक हो सकता था; प्रश्न में वंशज या संबद्ध समूह का अर्थ अधिक स्वाभाविक है, पर टिप्पणी में मूल रूप की संभावना दर्ज है।
theological_decisions:
