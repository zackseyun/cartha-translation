  text: 'This is the secret message of judgment Jesus spoke with Judas Iscariot over a period of eight days, three days before he celebrated Passover.


    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: hi
  text: 'यह न्याय का वह गुप्त संदेश है, जिसे यीशु ने यहूदा इस्करियोती से आठ दिनों के दौरान कहा—फसह मनाने से तीन दिन पहले तक।


    जब वह पृथ्वी पर प्रकट हुआ, तो उसने मानवजाति के उद्धार के लिए चिन्ह और बड़े-बड़े अद्भुत काम किए। कुछ लोग धार्मिकता के मार्ग पर [चले][a], पर दूसरे अपने अपराध के मार्ग पर चलते रहे; इसलिए बारह शिष्य बुलाए गए। वह उन्हें संसार से परे के रहस्यों और अंत में होनेवाली बातों के विषय में बताने लगा। वह प्रायः अपने शिष्यों के सामने अपने वास्तविक रूप में प्रकट नहीं होता था; बल्कि वे उसे अपने बीच एक बालक के रूप में पाते थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठक संकेत करते हैं कि ‘चले’ पांडुलिपि के क्षतिग्रस्त या अनिश्चित पाठ की पूर्ति है।
    reason: आपूर्ति किए गए साक्ष्य में वर्गाकार कोष्ठक पुनर्स्थापित अथवा अनिश्चित पाठ को चिह्नित करते हैं।
lexical_decisions:
- source_word: secret message of judgment
  choice: न्याय का वह गुप्त संदेश
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के अर्थ-संबंध को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है; ‘न्याय’ को संदेश का विषय माना गया है, यद्यपि कॉप्टिक समीक्षा अभी शेष है।
- source_word: salvation of humanity
  choice: मानवजाति के उद्धार के लिए
  rationale: ‘उद्धार’ धार्मिक संदर्भ में परिचित और गरिमापूर्ण है, जबकि ‘मानवजाति’ समस्त humanity को समेटता है।
- source_word: the way of righteousness
  choice: धार्मिकता के मार्ग
  rationale: मार्ग-संबंधी रूपक और नैतिक-धार्मिक अर्थ दोनों सुरक्षित रखे गए हैं।
- source_word: mysteries beyond the world
  choice: संसार से परे के रहस्य
  rationale: स्थानिक या पारलौकिक अस्पष्टता को बिना किसी विशिष्ट ब्रह्मांड-विज्ञान में बदलने के बनाए रखा गया है।
- source_word: as a child
  choice: एक बालक के रूप में
  rationale: रूपांतरण, दर्शन या प्रतीकात्मक उपस्थिति में से किसी एक व्याख्या को निर्णायक बनाए बिना साक्ष्य का सीधा अर्थ रखा गया है।
theological_decisions:
- issue: ‘message of judgment’ में न्याय का व्याकरणिक संबंध
  choice: ‘न्याय का ... संदेश’
  alternative: ‘गुप्त वचन/विवरण’ या ‘न्याय-वचन’
  rationale: दिए गए साक्ष्य में संबंध अस्पष्ट है; मुख्य पाठ में सहज किंतु अपेक्षाकृत खुला संबंध रखा गया है। प्रत्यक्ष कॉप्टिक समीक्षा पर इसे पुनः जाँचना होगा।
- issue: यीशु का शिष्यों के सामने प्रकट न होना
  choice: ‘अपने वास्तविक रूप में’ जोड़कर अभिप्राय स्पष्ट किया
  alternative: शाब्दिक रूप से ‘अपने शिष्यों पर/को प्रकट नहीं होता था’
  rationale: अगले वाक्य में बालक के रूप में मिलने से आशय पूर्ण अनुपस्थिति नहीं, बल्कि पहचान योग्य सामान्य रूप में प्रकट न होना जान पड़ता है; फिर भी किसी निश्चित मसीह-तत्वज्ञान को आरोपित नहीं किया गया।
- issue: बारह शिष्यों को बुलाने का कारण-संबंध
  choice: ‘इसलिए’ बनाए रखा
  alternative: ‘तब’ या केवल कथात्मक संयोजन
  rationale: अंग्रेज़ी साक्ष्य का कारणसूचक संबंध संरक्षित है, भले ही उसका धर्मवैज्ञानिक आशय असामान्य या तनावपूर्ण लगे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अनंतिम अनुवाद है; कॉप्टिक स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
