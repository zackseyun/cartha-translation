  language: hi
  text: 'यीशु ने कहा, “［आओ］, और मैं तुम्हें उन ［रहस्यों के विषय में सिखाऊँगा जिन्हें कोई］ मनुष्य ［नहीं］ देखेगा; क्योंकि एक महान और असीम लोक है, जिसके छोर किसी स्वर्गदूतीय पीढ़ी ने नहीं देखे। ［उसमें］ एक ［महान］ अदृश्य आत्मा है, जिसे किसी ［स्वर्गदूत की］ आँख ने कभी नहीं देखा, किसी हृदय ने कभी नहीं समझा, और जिसे कभी कोई नाम नहीं दिया गया।[a]


    “वहाँ एक प्रकाशमय बादल प्रकट हुआ। और उसने—अर्थात आत्मा ने—कहा, ‘मेरी सेवा करने के लिए एक स्वर्गदूत अस्तित्व में आए।’ तब बादल में से एक महान स्वर्गदूत निकला—स्वयं-उत्पन्न, प्रकाश का परमेश्वर। और उसके कारण दूसरे बादल से चार और स्वर्गदूत अस्तित्व में आए और उस स्वर्गदूतीय स्वयं-उत्पन्न की सेवा करने लगे। ［स्वयं-उत्पन्न］ ने कहा, ‘［एक लोक］ अस्तित्व में आए,’ और वह ［ठीक उसके कहे अनुसार］ अस्तित्व में आ गया। फिर उसने उस पर शासन करने के लिए प्रथम ज्योतिर्मय सत्ता की ［रचना की］। उसने कहा, ‘［उसकी］ सेवा करने के लिए स्वर्गदूत अस्तित्व में आएँ,’ और असंख्य ［लाखों］ स्वर्गदूत अस्तित्व में आ गए। फिर उसने कहा, ‘［एक］ प्रकाशमय लोक अस्तित्व में आए,’ और वह अस्तित्व में आ गया। उसने उस पर शासन करने के लिए दूसरी ज्योतिर्मय सत्ता की रचना की और उसकी सेवा के लिए असंख्य स्वर्गदूत भी बनाए। इसी प्रकार उसने प्रकाश के शेष लोकों की रचना की। उसने उन पर शासक ठहराए और उनकी सहायता के लिए असंख्य स्वर्गदूत बनाए।


    “आदमास प्रकाश के उस प्रथम बादल में था, जिसे ‘परमेश्वर’ कहलाने वालों में से कोई स्वर्गदूत कभी नहीं देख सकता था। ［उसी］ स्थान में ［आदमास ने शेत को जन्म दिया］—［… के］ स्वरूप और ［इस］ स्वर्गदूत की समानता के अनुसार। उसने शेत की अविनाशी ［पीढ़ी］ को बारह उभयलिंगी ［ज्योतिर्मय सत्ताओं के सामने］ प्रकट किया। ［फिर］ उसने आत्मा की इच्छा के अनुसार अविनाशी पीढ़ी में बहत्तर ज्योतिर्मय सत्ताएँ प्रकट कीं। तब उन बहत्तर ज्योतिर्मय सत्ताओं ने स्वयं आत्मा की इच्छा के अनुसार अविनाशी पीढ़ी में तीन सौ साठ ज्योतिर्मय सत्ताएँ प्रकट कीं, ताकि प्रत्येक के लिए पाँच हों। बारह ज्योतिर्मय सत्ताओं के बारह लोक मिलकर उनके पिता को बनाते हैं। प्रत्येक लोक के छह आकाश हैं; इस प्रकार बहत्तर ज्योतिर्मय सत्ताओं के लिए बहत्तर आकाश हैं, और उनमें से प्रत्येक के लिए ［पाँच］ आकाशमंडल हैं—［कुल］ तीन सौ साठ ［आकाशमंडल］। उन्हें अधिकार और आदर तथा सेवा के लिए असंख्य स्वर्गदूतों की ［एक विशाल］ सेना दी गई। साथ ही सभी लोकों और आकाशों तथा उनके आकाशमंडलों के आदर और ［सेवा］ के लिए कुँवारी आत्माएँ ［भी］ दी गईं।


    “अब उन अमर प्राणियों के समुदाय को पिता, बहत्तर ज्योतिर्मय सत्ताएँ, स्वयं-उत्पन्न और उसके बहत्तर लोक ‘कोसमोस’—अर्थात ‘नाशवान’—कहते हैं।[b] वहीं प्रथम मनुष्य अपनी अविनाशी शक्तियों सहित प्रकट हुआ। उसकी पीढ़ी के साथ जो लोक प्रकट हुआ, उसमें ज्ञान का बादल और वह स्वर्गदूत है जिसका नाम ［एलेलेथ …］ है। इन बातों के बाद ［एलेलेथ］ ने कहा, ‘अराजकता और ［अधोलोक］ पर शासन करने के लिए बारह स्वर्गदूत अस्तित्व में आएँ।’ और देखो, बादल में से एक ［स्वर्गदूत］ प्रकट हुआ, जिसका चेहरा ［आग］ से चमक रहा था और जिसका रूप लहू से ［कलंकित］ था। उसका नाम नेब्रो था, जिसका अर्थ ‘विद्रोही’ है। दूसरे लोग उसे याल्दाबाओथ कहते हैं। एक और स्वर्गदूत, सकलास, भी बादल में से आया। तब नेब्रो ने सहायक होने के लिए छह स्वर्गदूत बनाए—और सकलास ने भी ऐसा ही किया। उन्होंने आकाशों में बारह स्वर्गदूत उत्पन्न किए और उनमें से प्रत्येक को आकाशों में एक भाग मिला।


    “तब बारह शासकों ने बारह स्वर्गदूतों से कहा, ‘तुममें से प्रत्येक […] और वे […] पीढ़ी [… पाँच］ स्वर्गदूत:


    पहला ［याओथ है］, जो ‘भला’ कहलाता है।


    दूसरा हरमाथोथ है, ［अग्नि की आँख］।


    ［तीसरा］ गलीला है।


    चौथा ［योबेल］ है।


    पाँचवाँ अदोनायोस है।


    “ये वे पाँच हैं जिन्होंने अधोलोक पर शासन किया और जो अराजकता के ऊपर प्रधान हैं।


    “तब सकलास ने अपने स्वर्गदूतों से कहा, ‘आओ, हम स्वरूप और समानता के अनुसार एक मनुष्य बनाएँ।’ उन्होंने आदम और उसकी पत्नी हव्वा को गढ़ा। बादल में हव्वा को ‘जीवन’ कहा जाता है, क्योंकि इसी नाम से सभी पीढ़ियाँ उसे खोजती हैं, और उनमें से प्रत्येक उसे अपने-अपने नाम से पुकारती है।[c] अब सकलास ने ［आज्ञा नहीं दी …］ जन्म देना, सिवाय […] पीढ़ियों के बीच […] जो यह […] और ［स्वर्गदूत］ ने उससे कहा, ‘तुम्हारा और तुम्हारी संतानों का जीवन सीमित समय तक रहेगा।’”


    तब यहूदा ने यीशु से कहा, “एक मनुष्य ［कितने समय］ तक जीवित रह सकता है?”


    यीशु ने कहा, “तुम इस बात पर क्यों चकित होते हो कि आदम और उसकी पीढ़ी का जीवनकाल उस स्थान में सीमित है, जहाँ उसने अपने शासक के साथ अपना राज्य पाया है?”


    यहूदा ने यीशु से कहा, “क्या मनुष्य की आत्मा मर जाती है?”


    यीशु ने कहा, “बात इस प्रकार है: परमेश्वर ने मीकाएल को आज्ञा दी कि वह मनुष्यों को आत्माएँ उधार दे, ताकि वे सेवा करें। फिर महान सत्ता ने गब्रिएल को आज्ञा दी कि वह उस महान पीढ़ी को, जिसका कोई राजा नहीं है, आत्मा के साथ प्राण भी दे।[d] इसलिए ［शेष］ प्राण […] प्रकाश […］ अराजकता […] अपने भीतर उस आत्मा को खोजो, जिसे तुमने स्वर्गदूतीय पीढ़ियों से पाकर इस देह में जीवित किया है। तब परमेश्वर ने आदम और उसके साथियों तक ज्ञान पहुँचाया, ताकि अराजकता और अधोलोक के राजा उन पर शासन न करें।”


    ［तब］ यहूदा ने यीशु से कहा, “तो वे पीढ़ियाँ क्या करेंगी?”


    यीशु ने कहा, “मैं तुमसे सच कहता हूँ, तारे इन सभी बातों को पूरा करते हैं। जब सकलास अपने लिए निर्धारित समय पूरा कर लेगा, तब उनका पहला तारा उन पीढ़ियों के साथ प्रकट होगा और वे कही हुई बात पूरी करेंगे। फिर वे मेरे नाम पर व्यभिचार करेंगे, अपने बच्चों की हत्या करेंगे, और ［वे …］ बुराई और […] लोकों को, पीढ़ियों को लाकर सकलास के सामने प्रस्तुत करेंगे। ［और］ उसके बाद […] ［इस्राएल］ के बारह गोत्रों को […] से लाएगा, और सभी ［पीढ़ियाँ］ मेरे नाम पर पाप करते हुए सकलास की सेवा करेंगी। और तुम्हारा तारा तेरहवें लोक पर ［शासन］ करेगा।” तब यीशु ［हँसा］।


    ［यहूदा］ ने कहा, “गुरु, आप ［मुझ पर क्यों हँस रहे हैं?］”


    ［यीशु］ ने उत्तर ［दिया］, “मैं ［तुम पर नहीं, बल्कि］ तारों की भूल पर हँस रहा हूँ; क्योंकि ये छह तारे इन पाँच योद्धाओं के साथ भटक जाते हैं, और वे सब अपनी रचनाओं समेत नष्ट हो जाएँगे।”


    तब यहूदा ने यीशु से कहा, “जिन्होंने आपके नाम में बपतिस्मा लिया है, वे क्या करेंगे?”'
