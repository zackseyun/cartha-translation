lexical_decisions:
- source_word: generation
  choice: पीढ़ी
  rationale: अंग्रेज़ी साक्ष्य में बार-बार आए ‘generation’ की सामूहिक और वंशगत अस्पष्टता को यथासंभव बनाए रखता है; ‘वंश’ चुनने से जैविक वंश का अर्थ अनावश्यक रूप से निश्चित हो सकता था।
- source_word: realms
  choice: लोकों
  rationale: बहुवचन ब्रह्मांडीय क्षेत्रों का अर्थ देता है और साधारण पाठक के लिए भी सुबोध है।
- source_word: strong
  choice: सामर्थी
  rationale: ‘बलवान’ की केवल शारीरिक ध्वनि से बचते हुए शक्ति और सामर्थ्य दोनों का भाव रखता है।
- source_word: army of angels from the stars
  choice: तारों से आए स्वर्गदूतों की कोई सेना
  rationale: स्रोत-साक्ष्य के संबंध को स्पष्ट रखते हुए ‘तारकीय स्वर्गदूत’ जैसे अधिक व्याख्यात्मक पद से बचता है।
- source_word: mortal-born person
  choice: नश्वर जन्म पाया कोई भी व्यक्ति
  rationale: मृत्यु के अधीन मानवीय जन्म के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट मानवशास्त्रीय सिद्धान्त को आरोपित किए।
- source_word: spirit
  choice: आत्मा
  rationale: यहाँ व्यक्ति के भीतरी आध्यात्मिक पक्ष का स्वाभाविक और गरिमापूर्ण हिन्दी पद है; इसे केवल ‘मन’ बनाकर आध्यात्मिक अर्थ को संकुचित नहीं किया गया।
theological_decisions:
- issue: ‘दूसरी महान और पवित्र पीढ़ी’ की पहचान
  choice: इसे अनिर्दिष्ट सामूहिक ‘पीढ़ी’ के रूप में रखा गया है।
  alternative: इसे ‘जाति’, ‘वंश’ या किसी विशेष स्वर्गीय समुदाय के रूप में स्पष्ट करना।
  rationale: उपलब्ध साक्ष्य स्वयं इसकी ठीक पहचान नहीं बताता; अनुवाद को किसी सम्प्रदायगत या गूढ़ तंत्र की निश्चित व्याख्या नहीं थोपनी चाहिए।
- issue: यीशु का हँसना
  choice: सीधे ‘वह हँसा’ रखा गया है।
  alternative: हँसी को उपहास, प्रसन्नता या करुणा के रूप में समझाकर अनुवाद करना।
  rationale: स्रोत क्रिया का भावार्थ स्पष्ट नहीं करता, इसलिए उसका धर्मवैचारिक आशय खुला रखा गया है।
- issue: तारों से आए स्वर्गदूतों का अधिकार
  choice: ‘उस पर शासन नहीं करेगी’ के रूप में सीधा निषेध रखा गया है।
  alternative: इन स्वर्गदूतों को दुष्ट, पतित या विशिष्ट ब्रह्मांडीय शासक घोषित करना।
  rationale: ऐसी पहचान इस अंश में स्पष्ट नहीं है और उसे अनुवाद में जोड़ना अनुचित होगा।
- issue: खंडित अंतिम कथन
  choice: वाक्यखंडों और उनकी असंबद्धता को सुरक्षित रखा गया है।
  alternative: अनुमान से रिक्त स्थान भरकर एक सुसंगत धर्मवैचारिक कथन बनाना।
  rationale: पांडुलिपि-क्षति के कारण आशय अनिश्चित है; कृत्रिम पूर्णता वास्तविक पाठगत तनाव को मिटा देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली अपनाई गई है। संवाद में शिष्यों की ओर से सम्मानसूचक ‘आप’ रखा गया है, जबकि कथावाचक और यीशु की वाणी में प्रचलित बाइबिलीय शैली के अनुसार ‘वह/तुम’ है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-आधारित रूपांतर है; कॉप्टिक पांडुलिपि की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग कोष्ठक और दीर्घविराम पांडुलिपि की पुनर्स्थापना तथा क्षति के संकेत के रूप में सुरक्षित रखे गए हैं।
