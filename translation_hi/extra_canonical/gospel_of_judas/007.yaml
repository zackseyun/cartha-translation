    rationale: स्रोत में लोक के सिंहासनों से पहले क्षति है और ‘the thrones’ पुनर्स्थापित है। संशोधित पाठ उस क्षति को ‘लोक के [… सिंहासन]’ के रूप में दर्शाता है।
