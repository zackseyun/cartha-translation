  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पांडुलिपि-क्षति और संपादकीय पुनर्स्थापन के सभी संकेत वर्ग कोष्ठकों तथा दीर्घविराम से सुरक्षित रखे गए हैं। चूँकि प्रत्यक्ष कॉप्टिक समीक्षा लंबित है, यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-सचेत प्रस्तुति है।
