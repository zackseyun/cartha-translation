  footnotes:
  - marker: a
    text: सकलास इस ग्रंथ की ब्रह्मांड-कल्पना में एक नाम है; इसका रूप लिप्यंतरित किया गया है, अनूदित नहीं।
    reason: अपरिचित व्यक्तिनाम/दैवी सत्ता के नाम की पहचान में पाठक की सहायता।
  - marker: b
    text: ‘सींग’ सामर्थ्य, प्रतिष्ठा या अधिकार का प्रतीक हो सकता है; यहाँ बिंब को ज्यों का त्यों रखा गया है।
    reason: रूपक को किसी एक अर्थ में सीमित किए बिना सांस्कृतिक संकेत देना।
lexical_decisions:
- source_word: baptism
  choice: बपतिस्मा
  rationale: धार्मिक-सांस्कृतिक तकनीकी शब्द को परिचित आधुनिक हिन्दी रूप में रखा; संदिग्ध क्षतिग्रस्त वाक्य को स्पष्ट करने का प्रयास नहीं किया।
- source_word: the one/human who bears me
  choice: जो मुझे धारण किए हुए है / उस मनुष्य की … जो मुझे धारण किए हुए है
  rationale: ‘धारण करना’ मूल साक्ष्य के शरीर और अंतर्निहित सत्ता के बीच तनाव को बिना व्याख्यात्मक रूप से सुलझाए सुरक्षित रखता है।
- source_word: generation
  choice: पीढ़ी
  rationale: वंश, समूह और ब्रह्मांडीय वर्ग के बीच संभावित अर्थ-बहुलता बनाए रखने के लिए एक ही सामान्य शब्द रखा।
- source_word: realm(s)
  choice: लोक / लोकों
  rationale: ब्रह्मांडीय क्षेत्र के अर्थ के लिए स्वाभाविक हिन्दी; ‘राज्य’ से होने वाली राजनीतिक या ईश्वरीय-राज्य संबंधी अनावश्यक धारणा से बचा गया।
- source_word: luminous cloud
  choice: प्रकाशमय बादल
  rationale: दृश्य बिंब को सरल और गरिमापूर्ण हिन्दी में प्रत्यक्ष रखा।
- source_word: handed him over
  choice: उसे उनके हवाले कर दिया
  rationale: क्रिया का तटस्थ सुपुर्दगी/विश्वासघात-संबंधी अर्थ रखा; लक्ष्य की अस्पष्टता को अतिरिक्त नाम जोड़कर नहीं सुलझाया।
theological_decisions:
- issue: यीशु को ‘धारण करने वाले मनुष्य’ की पहचान
  choice: शाब्दिक तनाव को बनाए रखा
  alternative: इसे सीधे ‘मेरा शरीर’ या ‘मेरी मानवीय देह’ कहना
  rationale: उपलब्ध साक्ष्य में शरीर, मनुष्य और बोलने वाले यीशु के संबंध को सिद्धांतगत ढंग से स्पष्ट नहीं किया गया है।
- issue: यहूदा द्वारा ‘अधिक’ करने का मूल्यांकन
  choice: ‘उन सबसे बढ़कर करोगे’
  alternative: ‘उनसे भी बुरा करोगे’ या ‘उनसे महान काम करोगे’
  rationale: कथन प्रशंसा, निंदा या केवल परिमाण सूचित कर सकता है; अनुवाद ने नैतिक दिशा नहीं जोड़ी।
- issue: आदम की महान पीढ़ी का पूर्व-अस्तित्व
  choice: ‘स्वर्ग, पृथ्वी और स्वर्गदूतों से पहले … अस्तित्व में है’
  alternative: इसे सृष्टि से पहले चुनी हुई जाति या आत्मिक समुदाय के रूप में व्याख्यायित करना
  rationale: ब्रह्मांडीय कथन को यथावत रखा और किसी संप्रदायगत पहचान से नहीं जोड़ा।
- issue: यहूदा का बादल में प्रवेश
  choice: सीधा कथन रखा
  alternative: इसे स्वर्गारोहण, रूपांतरण या दर्शन कहना
  rationale: साक्ष्य केवल प्रवेश का वर्णन करता है; घटना की धर्मवैज्ञानिक श्रेणी निर्धारित नहीं की गई।
