    rationale: ‘no’ साक्ष्य में सुरक्षित है, जबकि केवल ‘will fall’ पुनर्स्थापित है। हिन्दी में निषेध को कोष्ठक के बाहर रखकर यही अंतर सुरक्षित किया जा सकता है।
