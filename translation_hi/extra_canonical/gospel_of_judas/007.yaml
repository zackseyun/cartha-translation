translation:
  language: hi
  text: 'यीशु ने कहा, “सचमुच मैं [तुमसे] कहता हूँ, मेरे नाम में [उन्होंने जो] यह बपतिस्मा [पाया है], वह […] पृथ्वी के आदम की पूरी पीढ़ी को नष्ट कर देगा। कल वे उसे यातना देंगे जो मुझे धारण किए हुए है। सचमुच मैं [तुमसे कहता] हूँ, किसी नश्वर मनुष्य का हाथ [मुझ पर नहीं पड़ेगा]। सचमुच [मैं तुमसे कहता हूँ], यहूदा, जो लोग सकलास[a] को बलि चढ़ाते हैं, वे […] हर बुरी बात। पर तुम उन सबसे बढ़कर करोगे, क्योंकि तुम उस मनुष्य की बलि चढ़ाओगे जो मुझे धारण किए हुए है। तुम्हारा सींग[b] पहले ही ऊँचा किया जा चुका है, तुम्हारा क्रोध भड़क उठा है, तुम्हारा तारा उदित हो गया है, और तुम्हारा हृदय [भटक गया है]। सचमुच [मैं तुमसे कहता हूँ], तुम्हारा अंतिम […] और […] [लोक के सिंहासन] [पराजित हो चुके हैं], राजा निर्बल हो गए हैं, स्वर्गदूतों की पीढ़ियाँ शोक में हैं, और वह बुराई [जो उन्होंने बोई थी …] नष्ट हो गई है, [और] [शासक] मिटा दिया गया है। [और] तब आदम की महान पीढ़ी का [फल] ऊँचा उठाया जाएगा, क्योंकि स्वर्ग, पृथ्वी और स्वर्गदूतों से पहले वह पीढ़ी उन लोकों से अस्तित्व में है। देखो, तुम्हें सब कुछ बता दिया गया है। अपनी
    आँखें ऊपर उठाओ और उस बादल को देखो जिसमें प्रकाश है और जिसके चारों ओर तारे हैं। और जो तारा आगे-आगे चलता है, वह तुम्हारा तारा है।”


    तब यहूदा ने ऊपर देखा और उस प्रकाशमय बादल को देखा, और वह उसमें प्रवेश कर गया। भूमि पर खड़े लोगों ने बादल में से यह कहते हुए एक आवाज़ सुनी, “[… वह] महान [पीढ़ी …] और […].” इसके बाद यहूदा ने यीशु को फिर नहीं देखा।


    तुरंत [यहूदियों] में भारी हलचल मच गई, […] से भी अधिक। उनके प्रधान याजक कुड़कुड़ाने लगे, क्योंकि वह प्रार्थना करने अतिथि-कक्ष में गया था। पर कुछ शास्त्री वहाँ ध्यान से निगरानी कर रहे थे, ताकि प्रार्थना करते समय उसे पकड़ सकें। वे लोगों से डरते थे, क्योंकि सभी उसे नबी मानते थे।


    वे यहूदा के पास आए और उससे कहा, “तुम यहाँ क्या कर रहे हो? क्या तुम यीशु के शिष्य नहीं हो?”


    तब उसने उन्हें वैसा ही उत्तर दिया जैसा वे चाहते थे। फिर यहूदा ने कुछ धन लिया और उसे उनके हवाले कर दिया।


    यहूदा का सुसमाचार'
