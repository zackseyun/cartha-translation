    rationale: साक्ष्य में ‘this baptism[which they’ve received in] my name’ है। मसौदे का ‘मेरे नाम में [उन्होंने जो] यह बपतिस्मा [पाया है]’ न केवल कोष्ठकों को पुनर्वितरित करता है, बल्कि ‘my name’ को पुनर्स्थापित अंश के भीतर कर देता है।
