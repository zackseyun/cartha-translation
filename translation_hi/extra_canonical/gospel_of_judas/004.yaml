translation:
  language: hi
  text: 'एक और दिन यीशु उनके पास आया। उन्होंने उससे कहा, “गुरु, हमने आपको स्वप्न में देखा, क्योंकि पिछली रात हमने बड़े [स्वप्न देखे] थे।”


    पर यीशु ने कहा, “तुमने क्यों […] अपने आपको छिपा लिया?”


    तब उन्होंने [कहा, “हमने] एक विशाल [भवन देखा, जिसमें एक विशाल] वेदी [थी, और] बारह व्यक्ति थे—हम कहेंगे कि वे पुरोहित थे—और एक नाम था। लोगों की एक भीड़ वेदी के पास तब तक प्रतीक्षा कर रही थी, [जब तक] पुरोहित भेंटें [लेना पूरा नहीं कर लेते]। हम भी प्रतीक्षा करते रहे।”


    [यीशु ने कहा], “वे कैसे थे?”


    उन्होंने कहा, “[कुछ लोग] दो सप्ताह [तक] उपवास करते हैं। दूसरे अपने ही बच्चों की बलि चढ़ाते हैं; और दूसरे अपनी पत्नियों की—वे आपस में एक-दूसरे की प्रशंसा करते और अपने आपको दीन बनाते हैं। कुछ पुरुषों के साथ सोते हैं; कुछ हत्या करते हैं; और कुछ अन्य अनेक पाप और अपराध करते हैं। [और] वेदी के [सामने] खड़े लोग आपके [नाम] को पुकारते हैं! और बलि चढ़ाते हुए वे अपनी भेंटों से [वेदी] भर देते हैं।” यह कहकर [वे] चुप हो गए, क्योंकि वे व्याकुल थे।


    यीशु ने उनसे कहा, “तुम व्याकुल क्यों हो? मैं तुमसे सच कहता हूँ, उस वेदी के सामने खड़े सभी पुरोहित मेरे नाम को पुकारते हैं। और मैं तुमसे [फिर] कहता हूँ, मनुष्यों की पीढ़ियों ने तारों की पीढ़ियों के इस [भवन] पर मेरा नाम लिख दिया है। [और उन्होंने] मेरे नाम से निर्लज्जता के साथ निष्फल पेड़ लगाए हैं।” यीशु ने उनसे कहा, “जिस वेदी को तुमने देखा, उस पर चढ़ाई गई भेंटें लेने वाले तुम ही हो। यही वह ईश्वर है जिसकी तुम सेवा करते हो, और जिन बारह व्यक्तियों को तुमने देखा, वे तुम ही हो। और जिन पशुओं को तुमने बलि के लिए लाया जाता देखा, वे वही भीड़ हैं जिसे तुम उस वेदी के सामने भटका रहे हो। [तुम्हारा सेवक] उठ खड़ा होगा और इसी तरह मेरे नाम का उपयोग करेगा, और धर्मपरायण लोगों की [पीढ़ियाँ] उसके प्रति निष्ठावान रहेंगी। उसके बाद कोई दूसरा [व्यभिचार करने वालों] को प्रस्तुत करेगा, कोई और बच्चों की हत्या करने वालों को, कोई और पुरुषों के साथ सोने वालों को, फिर उपवास करने वालों को और शेष अशुद्धता, अपराध और भ्रम को। और जो कहते हैं, ‘हम स्वर्गदूतों के समान हैं’—वे वे तारे हैं जो सब कुछ पूरा कर देते हैं। मनुष्यों
    की पीढ़ियों से कहा गया है, ‘देखो, ईश्वर ने पुरोहितों के हाथों से तुम्हारी बलि स्वीकार कर ली है,’ अर्थात भ्रम के सेवक के हाथों से। पर आज्ञा देने वाला प्रभु सबके ऊपर प्रभु है। अंतिम दिन वे दोषी पाए जाएँगे।”


    यीशु ने [उनसे] कहा, “[पशुओं की बलि चढ़ाना] बंद करो। तुम उन्हें वेदी के ऊपर, अपने तारों के ऊपर अपने स्वर्गदूतों के साथ [चढ़ा चुके हो], जहाँ वे पहले ही पूरे किए जा चुके हैं। इसलिए वे तुम्हारे साथ […] हो जाएँ और वे [स्पष्ट] हो जाएँ।”[a]


    उसके शिष्यों ने [उससे कहा], “स्वर्गदूतों के छल के कारण हमने जो [पाप] किए हैं, उनसे हमें शुद्ध कीजिए।”


    यीशु ने उनसे कहा, “यह संभव नहीं है […]; न कोई सोता समूचे बसे हुए संसार की आग बुझा [सकता] है। न किसी [नगर का] कुआँ सभी पीढ़ियों को तृप्त कर सकता है—केवल वह महान और स्थिर कुआँ ही ऐसा कर सकता है। न एक अकेला दीपक सभी लोकों को प्रकाशित करेगा—केवल दूसरी पीढ़ी ही ऐसा करेगी; और न कोई रोटी बनाने वाला [आकाश] के नीचे की सारी सृष्टि को भोजन दे सकता है।”[b]


    और [जब शिष्यों ने] ये [बातें सुनीं], तो उन्होंने [उससे] कहा, “गुरु, हमारी सहायता कीजिए और हमें बचाइए!”


    यीशु ने उनसे कहा, “मेरे विरुद्ध संघर्ष करना बंद करो। तुममें से हर एक का अपना तारा है, [और …] तारों में से […] जो उसका है […]। मुझे नाशवान पीढ़ी के पास नहीं, बल्कि दृढ़ और अविनाशी पीढ़ी के पास भेजा गया था, क्योंकि उस पीढ़ी पर न किसी शत्रु ने शासन किया है और न किसी तारे ने। मैं तुमसे सच कहता हूँ, आग का खंभा शीघ्र ही गिरेगा, और वह पीढ़ी तारों से विचलित नहीं होगी।”


    [a] इस वाक्य के कई अंश क्षतिग्रस्त हैं; “पूरे किए जा चुके,” “तुम्हारे साथ” और “[स्पष्ट]” के बीच का संबंध अनिश्चित है।


    [b] “केवल वह महान और स्थिर कुआँ” तथा “केवल दूसरी पीढ़ी” मूल साक्ष्य में अर्थ की दृष्टि से कठिन अभिव्यक्तियाँ हैं; अनुवाद ने उन्हें समझाकर बदलने के बजाय उनकी असामान्यता बनाए रखी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य के कई अंश क्षतिग्रस्त हैं; “पूरे किए जा चुके,” “तुम्हारे साथ” और “[स्पष्ट]” के बीच का संबंध अनिश्चित है।
    reason: खंडित पांडुलिपि के कारण वाक्य-संबंध असुरक्षित है; पाठक को अनुवाद की अनिश्चितता बताना आवश्यक है।
  - marker: b
    text: “केवल वह महान और स्थिर कुआँ” तथा “केवल दूसरी पीढ़ी” मूल साक्ष्य में अर्थ की दृष्टि से कठिन अभिव्यक्तियाँ हैं; अनुवाद ने उन्हें समझाकर बदलने के बजाय उनकी असामान्यता बनाए रखी है।
    reason: असामान्य उपमानों पर अत्यधिक व्याख्यात्मक अनुवाद से बचने और वास्तविक अस्पष्टता चिह्नित करने के लिए।
lexical_decisions:
- source_word: Master
  choice: गुरु
  rationale: आधुनिक हिन्दी में सम्मानपूर्ण और सहज संबोधन; प्रसंग में शिक्षक/स्वामी दोनों की छाया रखता है।
- source_word: altar
  choice: वेदी
  rationale: बलि और धार्मिक भेंट के संदर्भ में प्रचलित, गरिमापूर्ण शब्द।
- source_word: generation(s)
  choice: पीढ़ी/पीढ़ियाँ
  rationale: पाठ में मानवीय, तारकीय और अविनाशी समूहों के लिए एक ही आवर्ती संकल्पना को यथासंभव एकरूप रखा गया है; इसे ‘वंश’ या किसी संप्रदायगत तकनीकी पद से सीमित नहीं किया गया।
- source_word: minister
  choice: सेवक
  rationale: यहाँ पद की सटीक प्रकृति अनिश्चित है; ‘सेवक’ धार्मिक कार्यकर्ता का व्यापक अर्थ रखता है और ‘पुरोहित’ से अनावश्यक समानता नहीं बनाता।
- source_word: stars
  choice: तारे
  rationale: दृश्य और ब्रह्मांडीय भाषा को शाब्दिक रूप से सुरक्षित रखा गया है; इसे भाग्य, देवता या शासक शक्तियाँ कहकर व्याख्यायित नहीं किया गया।
- source_word: entire inhabited world
  choice: समूचा बसा हुआ संसार
  rationale: सिर्फ ‘दुनिया’ के बजाय स्रोत की inhabited-world विशेषता व्यक्त करता है।
- source_word: realms
  choice: लोक
  rationale: अनेक ब्रह्मांडीय क्षेत्रों के लिए संक्षिप्त और स्वाभाविक हिन्दी शब्द।
- source_word: incorruptible
  choice: अविनाशी
  rationale: नाश/क्षय के अधीन न होने का अर्थ देता है, बिना नैतिक ‘भ्रष्ट न होने’ तक अर्थ को सीमित किए।
theological_decisions:
- issue: दृष्टि में ईश्वर, वेदी और शिष्यों की पहचान
  choice: “यही वह ईश्वर है जिसकी तुम सेवा करते हो” को सीधे रखा गया
  alternative: इसे ‘झूठा देवता’ या ‘जिसे तुम ईश्वर समझते हो’ कहकर स्पष्ट करना
  rationale: पाठ की कठोर धार्मिक आलोचना और उसका निहित तनाव सुरक्षित रखा गया; व्याख्यात्मक विशेषण नहीं जोड़ा गया।
- issue: स्वर्गदूतों, तारों और मानवीय कर्मों का संबंध
