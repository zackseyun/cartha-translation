  - marker: a
    text: यहाँ पांडुलिपि का कुछ पाठ नष्ट या अस्पष्ट है।
    reason: आरंभ में उपलब्ध साक्ष्य वर्ग-कोष्ठक द्वारा पाठगत रिक्ति दर्शाता है।
  - marker: b
    text: यहाँ पांडुलिपि का कुछ पाठ नष्ट या अस्पष्ट है; इसलिए आसपास के वाक्य का सटीक रूप अनिश्चित है।
    reason: ‘our Lord Jesus Christ’ से ठीक पहले उपलब्ध साक्ष्य में पाठगत रिक्ति है।
lexical_decisions:
- source_word: apostle / co-apostle
  choice: प्रेरित / सह-प्रेरित
  rationale: ये प्रचलित और गरिमापूर्ण हिन्दी धार्मिक पद हैं; ‘सह-प्रेरित’ मूल में व्यक्त समान सेवकीय संबंध को बनाए रखता है।
- source_word: directives
  choice: निर्देश
  rationale: यह ‘आज्ञा’ की अपेक्षा स्रोत के प्रशासनिक/मार्गदर्शक भाव को अधिक तटस्थ ढंग से व्यक्त करता है।
- source_word: coordinate ourselves
  choice: आपस में तालमेल रखें
  rationale: आधुनिक सामान्य हिन्दी में सामूहिक कार्य-व्यवस्था का स्वाभाविक अर्थ देता है, बिना किसी अतिरिक्त संस्थागत संरचना का संकेत दिए।
- source_word: announce the message
  choice: संदेश की घोषणा करें
  rationale: ‘संदेश’ मूल की अनिर्दिष्ट विषयवस्तु को बनाए रखता है; इसे स्वतः ‘सुसमाचार’ बनाकर अर्थ को संकीर्ण नहीं किया गया।
- source_word: delighting with glee
  choice: बड़े आनंद के साथ
  rationale: दोहराए गए आनन्द-भाव को स्वाभाविक हिन्दी में व्यक्त करता है और असहज शब्दाडंबर से बचता है।
theological_decisions:
- issue: ‘our God, Jesus’ में यीशु और परमेश्वर का संबंध
  choice: हमारे परमेश्वर यीशु
  alternative: हमारे परमेश्वर, यीशु
  rationale: साक्ष्य में ‘Jesus’ को ‘our God’ के समानाधिकरण में पढ़ना सबसे सीधा है। विराम-चिह्न से अनावश्यक दूरी पैदा किए बिना इसकी तीक्ष्ण धर्मवैज्ञानिक अभिव्यक्ति को सुरक्षित रखा गया है।
- issue: उद्धार की प्रतिज्ञा का कर्ता
  choice: जिसकी प्रतिज्ञा ... प्रभु यीशु मसीह ने हमसे की है
  alternative: जो उद्धार हमें ... प्रभु यीशु मसीह द्वारा प्रतिज्ञात है
  rationale: स्रोत के अर्थ को सक्रिय, स्वाभाविक हिन्दी में रखा गया है; पांडुलिपीय रिक्ति के कारण उत्पन्न अनिश्चितता अलग से चिह्नित है।
- issue: ‘brethren’ का सामुदायिक संबोधन
  choice: भाइयों
  alternative: भाई-बहनों
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का औपचारिक रूप बनाए रखा गया है और स्रोत-भाषा की समीक्षा से पहले समावेशी विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। यह प्रारूप उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है। इसलिए पांडुलिपीय रिक्तियों को मुख्य पाठ में स्पष्ट रूप से रखा गया है और संदिग्ध स्थानों पर अनावश्यक पुनर्निर्माण नहीं किया गया।
