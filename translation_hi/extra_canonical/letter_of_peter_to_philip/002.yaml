translation:
  language: hi
  text: 'तब पतरस ने बाकी सबको इकट्ठा किया। वे उस पहाड़ पर गए जिसे जैतून पर्वत कहा जाता है। जब धन्य मसीह देह में निवास करते थे, तब वे पहले वहीं एक साथ इकट्ठा हुआ करते थे।


    जब प्रेरित इकट्ठे हो गए, तो उन्होंने घुटने टेककर इस प्रकार प्रार्थना की:


    “पिता, पिता, ज्योति के पिता,


    आप, जिनके हैं वे अविनाशी जन,


    हमारी सुनिए।


    जैसे आप अपने पवित्र पुत्र यीशु मसीह से प्रसन्न हुए हैं,


    क्योंकि वह हमारे लिए अंधकार में ज्योति [][a] बन गया है,


    वैसे ही सचमुच हमारी सुनिए।”


    फिर उन्होंने दोबारा प्रार्थना की:


    “जीवन के पुत्र, अमरता के पुत्र,


    आप जो ज्योति में निवास करते हैं,


    पुत्र, अमरता के मसीह,


    हमारे छुड़ानेवाले,


    हमें सामर्थ्य दीजिए,


    क्योंकि वे हमें मार डालने के लिए हमारा पीछा कर रहे हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध साक्ष्य में “ज्योति” के बाद एक रिक्त पुनर्स्थापन-चिह्न “[]” है; उसका लुप्त पाठ ज्ञात नहीं है। साक्ष्य में इस स्थान के निकट आया “[1]” पांडुलिपि का पृष्ठ-संकेत माना गया है और मुख्य पाठ में नहीं रखा गया।
    reason: रिक्त पाठ-स्थान को दृश्यमान रखना और गैर-पाठीय पृष्ठ-संकेत के विलोपन को दर्ज करना।
lexical_decisions:
- source_word: Olivet
  choice: जैतून पर्वत
  rationale: यह स्थान-नाम आधुनिक हिन्दी पाठकों के लिए स्वाभाविक और बाइबलीय प्रयोग में परिचित है।
- source_word: dwelt in the body
  choice: देह में निवास करते थे
  rationale: मूल साक्ष्य की देह-संबंधी अभिव्यक्ति और उसके संभावित theological तनाव को स्पष्ट किए बिना सुरक्षित रखा गया है।
- source_word: indestructible ones
  choice: वे जो अविनाशी हैं
  rationale: संज्ञीकृत विशेषण की अस्पष्टता बनाए रखी गई है; इसे स्वर्गदूतों, संतों या किसी विशिष्ट समूह के रूप में नहीं समझाया गया।
- source_word: deathlessness
  choice: अमरता
  rationale: प्रार्थनात्मक हिन्दी में सहज रहते हुए मृत्यु से अछूते जीवन का भाव व्यक्त करता है।
- source_word: redeemer
  choice: छुड़ानेवाले
  rationale: सुगम और प्रतिष्ठित धार्मिक हिन्दी, बिना किसी विशेष प्रायश्चित्त-सिद्धांत को आरोपित किए।
- source_word: they are hunting for us
  choice: वे ... हमारा पीछा कर रहे हैं
  rationale: संदर्भ में हिंसक खोज और आसन्न हत्या का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: “जिनके हैं वे जो अविनाशी हैं” की पहचान
  choice: पहचान अनिर्धारित रखी गई
  alternative: इसे ‘अविनाशी जनों के पिता’ या किसी विशिष्ट स्वर्गीय वर्ग के रूप में प्रस्तुत करना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य उस समूह की पहचान निश्चित नहीं करता।
- issue: “अपने पवित्र पुत्र ... से प्रसन्न हुए हैं” और अगली पंक्ति का संबंध
  choice: ‘जैसे ... वैसे ही’ द्वारा निवेदन का संबंध दिखाया गया
  alternative: कारणसूचक वाक्य बनाकर कहना कि परमेश्वर इसलिए सुनें क्योंकि वे पुत्र से प्रसन्न हुए
  rationale: साक्ष्य में ‘just as’ है; तुलना को बचाते हुए हिन्दी वाक्य को पूर्ण और पठनीय बनाया गया।
- issue: “Son, Christ of deathlessness” का संबोधन
  choice: ‘पुत्र, अमरता के मसीह’
  alternative: ‘अमर पुत्र मसीह’
  rationale: दो संबोधनों और असामान्य संबंधवाचक संरचना को मिलाकर theological अर्थ निश्चित नहीं किया गया।
- issue: देह में मसीह का निवास
  choice: शाब्दिक theological भाषा सुरक्षित रखी गई
  alternative: ‘जब मसीह पृथ्वी पर थे’
  rationale: वैकल्पिक रूप मूल की देह-संबंधी विशिष्टता मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘आप’ और आदरसूचक क्रियाओं का प्रयोग प्रार्थना में किया गया है। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-सचेत अनुवाद है।
