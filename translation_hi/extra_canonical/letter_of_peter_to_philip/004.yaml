translation:
  language: hi
  text: '“अब युगों[a] की [कमी] के विषय में—कमी यह है: जब पिता की महानता की व्यवस्था से अलग होकर माता का विद्रोह और अविवेक प्रकट हुआ, तो उसने युगों को स्थापित करना चाहा। जब उसने कहा, तब वह अत्याचारी उसके पीछे हो लिया; पर जब उसने एक अंश छोड़ दिया, तो अत्याचारी ने उसे पकड़ लिया, और वह कमी बन गया। यही युगों की कमी है।


    “जब अत्याचारी ने वह अंश ले लिया, तो उसने उसे रोपा, उस पर शक्तियों और अधिकारियों को नियुक्त किया, और उसे नश्वर युगों के भीतर सीमित कर दिया। प्रत्येक ब्रह्मांडीय शक्ति इस बात से बहुत प्रसन्न हुई कि वे अस्तित्व में लाई गई थीं। [][b] परंतु वे पूर्व-अस्तित्वमान [पिता] को नहीं जानती थीं, क्योंकि वे उसके लिए पराई हैं। [इसके बजाय, इस] अत्याचारी को अधिकार दिया गया, और उन्होंने उसकी उपासना और स्तुति की।


    “तब शक्तियों की स्तुति के कारण अत्याचारी का मन घमंडी हो गया। वह विरोधी बन गया और एक प्रतिमा को [दूसरी प्रतिमा से] तथा एक रूप को दूसरे रूप से बदल देना चाहता था। तब उसने अपने अधीन शक्तियों को नश्वर शरीर गढ़ने का काम सौंपा, और वे उस उत्पन्न की गई समानता की असमानता से अस्तित्व में आए।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “युग” उस प्राचीन गूढ़ शब्द का अनुवाद है जिसका अर्थ कालखंड के साथ-साथ एक ब्रह्मांडीय लोक या सत्ता भी हो सकता है।
    reason: तकनीकी ‘aeons’ की अर्थ-सीमा स्पष्ट करना।
  - marker: b
    text: खाली कोष्ठक उपलब्ध पाठ में क्षति या लुप्त अंश का संकेत सुरक्षित रखते हैं।
    reason: पांडुलिपीय/संपादकीय संकेत को पाठक के लिए समझाना।
  - marker: c
    text: अंतिम पदबंध का आशय कठिन और अनिश्चित है; इसका अर्थ ऐसी समानता भी हो सकता है जो मूल आदर्श से मेल नहीं खाती।
    reason: स्रोत-साक्ष्य की वास्तविक अस्पष्टता और अनुवाद की अस्थायिता बताना।
lexical_decisions:
- source_word: aeons
  choice: युग
  rationale: यहाँ शब्द ब्रह्मांडीय लोकों/सत्ताओं की गूढ़ अवधारणा भी व्यक्त कर सकता है; मुख्य पाठ में सुबोध ‘युग’ रखा और पादटिप्पणी में अर्थ-सीमा स्पष्ट की।
- source_word: deficiency
  choice: कमी
  rationale: ‘अभाव’ की तुलना में ‘कमी’ अधिक सहज है और स्रोत में बार-बार आने वाले एक ही पद की पुनरावृत्ति बनाए रखती है।
- source_word: tyrannical one
  choice: अत्याचारी
  rationale: व्यक्ति-संज्ञक विशेषण और दमनकारी अर्थ दोनों सुरक्षित रहते हैं; ‘तानाशाह’ अनावश्यक रूप से आधुनिक राजनीतिक रंग देता।
- source_word: powers and authorities
  choice: शक्तियाँ और अधिकारी
  rationale: दो अलग श्रेणियों को अलग रखा गया है; ‘अधिकारी’ व्यक्तिगत/ब्रह्मांडीय शासक सत्ताओं का स्वाभाविक हिन्दी रूप है।
- source_word: cosmic power
  choice: ब्रह्मांडीय शक्ति
  rationale: गूढ़ ब्रह्मांड-विधान के तकनीकी आशय को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: pre-existent
  choice: पूर्व-अस्तित्वमान
  rationale: कालगत और तात्त्विक पूर्व-अस्तित्व दोनों को बिना व्याख्यात्मक विस्तार के बचाता है।
- source_word: image / form
  choice: प्रतिमा / रूप
  rationale: स्रोत के दो निकटार्थी किंतु अलग पदों का भेद बनाए रखा गया है।
- source_word: shape mortal bodies
  choice: नश्वर शरीर गढ़ना
  rationale: ‘गढ़ना’ जानबूझकर आकार देने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: माता का पिता की व्यवस्था से संबंध
  choice: “पिता की महानता की व्यवस्था से अलग होकर”
  alternative: “पिता की महानता के आदेश के विरुद्ध”
  rationale: स्रोत का ‘apart from’ अलगाव या स्वतंत्र क्रिया बताता है; उसे सीधे नैतिक अवज्ञा में बदलकर तनाव को अधिक निश्चित नहीं किया गया।
- issue: अत्याचारी के अधिकार का कर्ता
  choice: निष्क्रिय रूप “अधिकार दिया गया”
  alternative: “पिता ने उसे अधिकार दिया”
  rationale: स्रोत कर्ता नहीं बताता; किसी विशिष्ट दैवी कर्ता को जोड़ना धार्मिक अस्पष्टता को अनुचित रूप से सुलझाता।
- issue: शक्तियों की उत्पत्ति में सर्वनाम की अस्पष्टता
  choice: “वे अस्तित्व में लाई गई थीं”
  alternative: “वह अंश अस्तित्व में लाया गया था”
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का बहुवचन रखा गया, यद्यपि संदर्भगत लक्ष्य पूरी तरह स्पष्ट नहीं है।
- issue: अंतिम वाक्य का कठिन ब्रह्मांड-विज्ञान
  choice: “समानता की असमानता” का शाब्दिक तनाव सुरक्षित
  alternative: “बिगड़ी हुई समानता”
  rationale: व्याख्यात्मक सरलीकरण से बचते हुए स्रोत की विरोधाभासी/तकनीकी अभिव्यक्ति बनाए रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण यह सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी मसौदा है। वर्ग कोष्ठकों में पुनर्स्थापित या क्षतिग्रस्त पाठ-संकेत यथासंभव सुरक्षित रखे गए हैं।
