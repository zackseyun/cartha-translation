translation:
  language: hi
  text: '“परन्तु जहाँ तक तुम्हारे बन्दी बनाए जाने की बात है, वह इसलिए है कि तुम मेरे हो। जब तुम अपने भीतर से नाशवान वस्तु को निकाल दोगे, तब तुम मनुष्यों के बीच ज्योतियाँ बन जाओगे।


    “और शक्तियों के विरुद्ध तुम्हारा संघर्ष इसलिए है कि उन्हें, तुम्हारे विपरीत, विश्राम नहीं मिला है, क्योंकि वे नहीं चाहतीं कि तुम्हारा उद्धार हो।”


    तब प्रेरितों ने फिर से दण्डवत् किया और कहा, “प्रभु, हमें सिखाइए कि हम शासकों[a] से कैसे युद्ध करें, क्योंकि शासक हमसे अधिक शक्तिशाली हैं?”


    तब उस दिव्य-दर्शन में से एक आवाज़ ने उन्हें पुकारकर कहा, “तुम्हें उनसे इस प्रकार युद्ध करना है, क्योंकि शासक भीतरी मनुष्य[b] के विरुद्ध युद्ध करते हैं। तुम्हें उनसे इस प्रकार युद्ध करना है:


    “एक साथ इकट्ठे हो जाओ और संसार को प्रतिज्ञा सहित उद्धार की शिक्षा दो। मेरे पिता की सामर्थ्य कमर पर बाँध लो, और अपनी विनती प्रकट करो। तब वह—पिता—तुम्हारी सहायता करेगा, जैसे उसने उस समय तुम्हारी सहायता की थी जब उसने मुझे भेजा। [c] [डरो] मत; [मैं निरन्तर तुम्हारे साथ रहूँगा], जैसा मैंने पहले तुमसे कहा था, जब मैं शरीर में रहता था।”[d]


    तब आकाश से बिजली चमकी और गर्जन हुआ, और जिसे उन्होंने वहाँ उस दिव्य-दर्शन में देखा था, वह आकाश में उठा लिया गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शासक” उन विरोधी अलौकिक सत्ताओं के लिए प्रयुक्त पद है जिन्हें प्रायः यूनानी शब्द ‘आर्खोन’ से जाना जाता है।
    reason: तकनीकी पद का अर्थ स्पष्ट करना, बिना उसे किसी बाद की व्यवस्थित दानवविद्या से समान ठहराए।
  - marker: b
    text: “भीतरी मनुष्य” मनुष्य के आन्तरिक अस्तित्व के लिए प्रयुक्त विशिष्ट अभिव्यक्ति है; यहाँ इसका ठीक तात्पर्य स्पष्ट नहीं किया गया है।
    reason: मूल की मानवशास्त्रीय अस्पष्टता को सुरक्षित रखना।
  - marker: c
    text: यह रिक्त वर्ग-कोष्ठक प्राप्त पाठ में किसी क्षति या छूटे हुए अंश का संकेत है।
    reason: स्रोत-साक्ष्य में मौजूद खाली restoration signal को स्पष्ट करना।
  - marker: d
    text: वर्ग कोष्ठकों के भीतर के शब्द क्षतिग्रस्त पाठ की सम्पादकीय पूर्ति को दर्शाते हैं।
    reason: पुनर्स्थापित पाठ और सुरक्षित पाण्डुलिपीय पाठ में भेद दिखाना।
lexical_decisions:
- source_word: detention
  choice: बन्दी बनाए जाने
  rationale: सन्दर्भ में बलपूर्वक रोक या कैद का भाव है; यह आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य ‘रुकने’ का अर्थ नहीं देता।
- source_word: powers
  choice: शक्तियाँ
  rationale: यह प्रतिकूल अलौकिक सत्ताओं का व्यापक पद है; इसे आगे आए ‘शासकों’ से अलग रखा गया है।
- source_word: archons
  choice: शासक
  rationale: यूनानी मूल के पारिभाषिक भाव को समझने योग्य हिन्दी में रखा गया है; पहली occurrence पर पादटिप्पणी इसकी अलौकिक सत्ता-सूचक सम्भावना स्पष्ट करती है।
- source_word: Inner Man
  choice: भीतरी मनुष्य
  rationale: मूल की विशिष्ट मानवशास्त्रीय अभिव्यक्ति को बिना व्याख्यात्मक रूप से ‘आत्मा’ बना देने के यथासम्भव औपचारिक ढंग से सुरक्षित रखा गया है।
- source_word: apparition
  choice: दिव्य-दर्शन
  rationale: सन्दर्भ में दिखाई देने वाली अलौकिक आकृति/प्रकटन का संकेत है; ‘भूत’ जैसे अनचाहे आधुनिक अर्थ से बचता है।
- source_word: gird yourselves
  choice: कमर पर बाँध लो
  rationale: मूल रूपक को बनाए रखता है, यद्यपि आधुनिक हिन्दी में उसके आशय को पाठक पादटिप्पणी के बिना भी तैयारी और धारण करने के रूप में समझ सकता है।
- source_word: mortals
  choice: मनुष्य
  rationale: ‘मरणशीलों’ की अपेक्षा अधिक स्वाभाविक हिन्दी, जबकि नश्वर मानवजाति का आशय सन्दर्भ से बना रहता है।
theological_decisions:
- issue: ‘नाशवान वस्तु’ की पहचान
  choice: नाशवान वस्तु
  alternative: नश्वर शरीर / सांसारिक स्वभाव
  rationale: साक्ष्य यह स्पष्ट नहीं करता कि संकेत शरीर, भ्रष्टता या किसी अन्य नाशवान तत्व की ओर है; इसलिए अस्पष्टता सुरक्षित रखी गई है।
- issue: शक्तियों को विश्राम न मिलने का कथन
  choice: उन्हें, तुम्हारे विपरीत, विश्राम नहीं मिला है
  alternative: वे तुम्हारी तरह विश्राम नहीं चाहतीं
  rationale: गवाही ‘lacking rest’ और श्रोताओं से विरोध प्रस्तुत करती है; इसे मुक्ति-सिद्धान्त की किसी खास प्रणाली में नहीं ढाला गया।
- issue: उद्धार और प्रतिज्ञा का सम्बन्ध
  choice: प्रतिज्ञा सहित उद्धार की शिक्षा
  alternative: संसार को उद्धार की प्रतिज्ञा सुनाओ
  rationale: अंग्रेज़ी साक्ष्य में ‘salvation accompanied with a promise’ का व्याकरण कुछ अस्पष्ट है; चुना रूप दोनों को सम्बद्ध रखता है, पर प्रतिज्ञा को उद्धार के समान घोषित नहीं करता।
- issue: पिता की सहायता का काल-सन्दर्भ
  choice: जैसे उसने उस समय तुम्हारी सहायता की थी जब उसने मुझे भेजा
  alternative: जैसे उसने मेरी सहायता की जब उसने मुझे भेजा
  rationale: प्राप्त साक्ष्य में ‘assisted you’ है, यद्यपि कथन असामान्य लग सकता है; सम्भावित सुधार करके अर्थ नहीं बदला गया।
- issue: पुनर्स्थापित वाक्यांश
  choice: वर्ग कोष्ठक बनाए रखे गए
  alternative: कोष्ठक हटाकर धाराप्रवाह पाठ
  rationale: पाण्डुलिपि-क्षति अथवा सम्पादकीय पुनर्स्थापन के संकेत को पाठकीय पारदर्शिता हेतु सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। अलौकिक सत्ताओं के लिए ‘शक्तियाँ’ और तकनीकी archons के लिए ‘शासक’ का भेद रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी शेष है।
