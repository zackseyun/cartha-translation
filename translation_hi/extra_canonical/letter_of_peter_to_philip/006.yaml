id: LPPH.006
reference: Letter of Peter to Philip — Battling the Powers
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: '“However, regarding your detention, it is because you belong to me. When you remove from yourselves what is destructible, then you will become lights among mortals.


    “Regarding your battle against the powers, it results from their lacking rest, unlike yourselves, given that they do not desire for you to be saved.”


    Then once more the apostles worshipped, and said: “Lord, instruct us, how shall we battle with the archons, given that the archons are superior to us?”


    A voice then cried out to them from the apparition, and said: “You have to war against them in the following way, because the archons war against the Inner Man. You have to war against them in the following way:


    “Assemble together and teach salvation accompanied with a promise to the world, and gird yourselves with the power of my Father, and make known your request, and he, the Father, will assist you, as he assisted you when he sent me. [] [Fear] not, [I will be with you continually], as I spoke to you formerly when I dwelt in the body.”


    Then lightning and thunder came from heaven, and the one they had seen in the apparition in that place was snatched to heaven.'
