base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: hi
  text: “अब पूर्णता के विषय में—मैं ही, [हाँ] मैं ही, इस खोए हुए बीज के कारण देह में नीचे भेजा गया था, और मैं उनके नश्वर साँचे में उतर आया। पर उन्होंने मुझे पहचाना नहीं, क्योंकि वे मुझे एक नश्वर मनुष्य समझते थे। मैंने उससे बात की जो मेरा अपना है, और उसने मेरी बात पर ध्यान दिया, ठीक जैसे तुमने भी आज ध्यान दिया है। मैंने उसे अपने पितृत्व की विरासत में प्रवेश करने का अधिकार दिया, और मैंने [उसे] [a] […] भरा हुआ […] उसके उद्धार के द्वारा। क्योंकि वह अभाव था, वह पूर्णता बन गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि का पाठ खंडित है। कोष्ठक और दीर्घविराम लुप्त या अनिश्चित अंशों को दर्शाते हैं; पूरे वाक्य का निश्चित पुनर्निर्माण संभव नहीं है।
    reason: मुख्य पाठ में दिखाई देने वाली विखंडित वाक्य-रचना और रिक्तियों का कारण स्पष्ट करना।
lexical_decisions:
- source_word: fullness
  choice: पूर्णता
  rationale: यह पाठ का प्रमुख पारिभाषिक प्रतिपक्ष सुरक्षित रखता है और अंतिम ‘अभाव’ के साथ अर्थगत विरोध भी स्पष्ट करता है।
- source_word: seed
  choice: बीज
  rationale: रूपक को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखा गया है।
- source_word: mortal mold
  choice: नश्वर साँचा
  rationale: ‘साँचा’ मूल बिंब को सुरक्षित रखता है; इसे केवल ‘शरीर’ कहना रूपक को समतल कर देता।
- source_word: paid attention
  choice: बात पर ध्यान दिया
  rationale: सिर्फ ‘सुना’ की अपेक्षा ग्रहणशील ध्यान का भाव व्यक्त होता है।
- source_word: fatherhood
  choice: पितृत्व
  rationale: असामान्य अमूर्त संज्ञा को जानबूझकर सुरक्षित रखा गया है; ‘पिता की विरासत’ कहना संभावित अर्थ को पहले ही निश्चित कर देता।
- source_word: deficiency
  choice: अभाव
  rationale: ‘पूर्णता’ के विपरीत पारिभाषिक और अवधारणात्मक ध्रुव को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: वक्ता का देह में भेजा जाना और नश्वर साँचे में उतरना
  choice: ‘देह में नीचे भेजा गया’ और ‘नश्वर साँचे में उतर आया’—दोनों कथन बनाए रखे
  alternative: दोनों को मिलाकर केवल ‘मनुष्य बना’ कहना
  rationale: पाठ की अवतरण-संबंधी विशिष्ट भाषा और उसका संभावित धार्मिक तनाव बिना सांप्रदायिक व्याख्या के सुरक्षित रहता है।
- issue: ‘जो मेरा अपना है’ की पहचान
  choice: व्यक्ति को अनाम रखा
  alternative: उसे किसी विशिष्ट ऐतिहासिक या आध्यात्मिक पात्र के रूप में पहचानना
  rationale: उपलब्ध साक्ष्य में पहचान स्पष्ट नहीं है; नाम जोड़ना अनुचित व्याख्या होती।
- issue: अभाव से पूर्णता बनना
  choice: अस्तित्वसूचक रूप में ‘वह अभाव था, वह पूर्णता बन गया’
  alternative: ‘उसमें कमी थी, फिर वह संपूर्ण हो गया’
  rationale: अधिक सहज विकल्प पारिभाषिक/ब्रह्मांडवैज्ञानिक तनाव को मनोवैज्ञानिक या नैतिक सुधार में बदल सकता था।
- issue: खंडित वाक्य में उद्धार का संबंध
  choice: व्याकरणिक असंगति सहित क्षति-संकेत सुरक्षित रखा
  alternative: ‘मैंने उसके उद्धार के द्वारा उसे पूर्ण कर दिया’ जैसा पुनर्निर्माण
  rationale: पांडुलिपि-क्षति के कारण कर्म, क्रिया और साधन का संबंध अनिश्चित है; उसे चुपचाप पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय रूप अपनाया गया है। अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित है। वर्ग कोष्ठक और दीर्घविराम पाठ-संशोधन तथा पांडुलिपि-क्षति के संकेत के रूप में सुरक्षित रखे गए हैं।
