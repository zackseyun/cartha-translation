translation:
  language: hi
  text: 'तब प्रेरितों ने हर प्रकार की स्तुति करते हुए प्रभु को धन्यवाद दिया और यरूशलेम लौट गए।


    जब वे मार्ग से नीचे उतर रहे थे (पहाड़ से यरूशलेम की ओर जाते हुए), तब वे उस प्रकाश के विषय में बातचीत कर रहे थे जो दिखाई दिया था। इसी बीच प्रभु के विषय में विवाद छिड़ गया और वे कहने लगे, “यदि हमारे प्रभु ने दुःख सहा, तो हम कितना अधिक सहेंगे?”


    पतरस ने उत्तर दिया, “उसने हमारे लिए दुःख सहा, और हमें भी दुःख सहना पड़ेगा, क्योंकि हम छोटे हैं।”[a]


    तब उनके पास एक वाणी आई, जिसने कहा, “मैंने तुम्हें अनेक बार बताया है कि तुम्हें दुःख सहना पड़ेगा। तुम्हें घसीटकर आराधनालयों और शासकों के सामने ले जाया जाएगा, जिससे तुम्हें दुःख होगा। परन्तु जो दुःख नहीं सहेगा, वह भी [नहीं] [] [… मेरे] पिता […] ताकि वह […] सके।”[b]


    किन्तु प्रेरित बहुत आनन्दित हुए और यरूशलेम चढ़ गए। वे मन्दिर में गए, प्रभु यीशु मसीह के नाम में उद्धार की शिक्षा देने लगे और उन्होंने बहुत-से लोगों को चंगा किया।


    तब पतरस अपने शिष्यों से कहने लगा, “जब हमारे प्रभु यीशु ने देह में निवास किया, तब उसने हमें सब कुछ बताया, क्योंकि वह स्वयं नीचे उतरा था। मेरे भाइयो, मेरी बात ध्यान से सुनो।”


    वह एक पवित्र आत्मा से भर गया और इस प्रकार बोला:


    “हमारा प्रकाश, यीशु, [नीचे] उतरा,

    और क्रूस पर चढ़ाया गया,

    और उसने काँटों का मुकुट पहना,

    और उसने बैंगनी वस्त्र धारण किया,

    और वह काठ पर लटकाया गया,

    और कब्र में रखा गया,

    और मरे हुओं में से जी उठा।


    “मेरे भाइयो, यीशु ऐसे दुःख से पराया है। किन्तु हम ही हैं जिन्होंने माता के अपराध के कारण दुःख सहा है। इसी कारण जब वह हमारे बीच था, तब उसने हर बात प्रतीकात्मक अर्थ में बताई। प्रभु यीशु, पिता की असीम महिमा का पुत्र, हमारे जीवन का रचयिता है।[c]


    “मेरे भाइयो, हम इन ईश्वर-विहीन लोगों पर ध्यान न दें और न [] […] में चलें।”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “क्योंकि हम छोटे हैं” का आशय अनिश्चित है; इसका अर्थ पद, महत्त्व, सामर्थ्य या आध्यात्मिक अवस्था में छोटा होना हो सकता है।
    reason: साक्ष्य की वास्तविक शब्दार्थगत अस्पष्टता बताना।
  - marker: b
    text: यहाँ पाण्डुलिपि बुरी तरह क्षतिग्रस्त है। वर्ग कोष्ठक पुनर्स्थापित या अधूरे पाठ को और […] खोए हुए पाठ को दिखाते हैं; वाक्य का पूरा अर्थ निश्चित नहीं है।
    reason: पाठीय रिक्तियों को छिपाने या अनुमान से भरने से बचना।
  - marker: c
    text: “माता,” “अपराध” और यीशु के दुःख से “पराया” होने का कथन इस रचना की विशिष्ट धर्मवैचारिक भाषा है। अनुवाद किसी एक व्याख्या को निश्चित नहीं करता।
    reason: महत्त्वपूर्ण धर्मवैचारिक तनाव और संदर्भगत अनिश्चितता सुरक्षित रखना।
  - marker: d
    text: अन्तिम वाक्य पाण्डुलिपि में अधूरा है, इसलिए किस मार्ग या आचरण में न चलने की बात है, यह ज्ञात नहीं।
    reason: खंडित समापन की सीमा स्पष्ट करना।
lexical_decisions:
- source_word: apostles
  choice: प्रेरित
  rationale: भारतीय हिन्दी बाइबलीय प्रयोग में स्वाभाविक और व्यापक रूप से समझा जाने वाला पद।
- source_word: synagogues
  choice: आराधनालयों
  rationale: यहूदी सभा-स्थल का अर्थ संप्रेषित करता है; अधिक तकनीकी लिप्यंतरण की अपेक्षा सामान्य पाठक के लिए सुबोध है।
- source_word: governors
  choice: शासकों
  rationale: स्रोत के व्यापक प्रशासनिक पद को बिना अनावश्यक ऐतिहासिक विशिष्टता जोड़े व्यक्त करता है।
- source_word: small
  choice: छोटे
  rationale: असामान्य और संभवतः धर्मवैचारिक अभिव्यक्ति को स्पष्ट करके हल नहीं किया गया; उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: a holy Spirit
  choice: एक पवित्र आत्मा
  rationale: अनिश्चित उपपद का बल सुरक्षित रखा गया है; इसे स्वतः ही निश्चित पदनाम ‘पवित्र आत्मा’ में नहीं बदला गया।
- source_word: tree
  choice: काठ
  rationale: क्रूस-संदर्भ बनाए रखते हुए स्रोत की ‘tree/wood’ छवि को सुरक्षित रखता है।
- source_word: alien to
  choice: से पराया
  rationale: कथन की धर्मवैचारिक कठिनाई और दूरी के भाव को ‘अछूता’ या ‘असमर्थ’ कहकर हल नहीं किया गया।
- source_word: Mother
  choice: माता
  rationale: स्रोत में विशिष्ट, बड़े अक्षर वाला ब्रह्मांड-विज्ञान संबंधी संकेत सुरक्षित रखा गया है, बिना पहचान निर्धारित किए।
- source_word: author of our life
  choice: हमारे जीवन का रचयिता
  rationale: जीवन के उद्गमकर्ता का भाव स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘लेखक’ की आधुनिक संकीर्ण ध्वनि से बचता है।
- source_word: Godless
  choice: ईश्वर-विहीन
  rationale: नैतिक और धार्मिक दूरी का मूल भाव रखता है, बिना अधिक संप्रदायगत शब्दावली जोड़े।
theological_decisions:
- issue: यीशु के दुःख और उससे ‘पराया’ होने के बीच तनाव
  choice: दोनों कथनों को यथावत तनाव में रखा गया
  alternative: ‘यीशु वास्तव में नहीं, केवल प्रतीकात्मक रूप से दुःख सहता दिखाई दिया’ जैसे व्याख्यात्मक विस्तार से सामंजस्य बैठाना
  rationale: अंश स्वयं दुःख, प्रतीक और यीशु की उससे दूरी को साथ रखता है; अनुवाद को कोई निजी मसीह-विज्ञान आरोपित नहीं करना चाहिए।
- issue: ‘माता के अपराध’ की पहचान
  choice: ‘माता’ को बिना व्याख्यात्मक पहचान के रखा गया
  alternative: इसे हव्वा, सोफिया या किसी अन्य विशिष्ट पात्र के रूप में नामित करना
  rationale: उपलब्ध साक्ष्य यहाँ उस पहचान को स्पष्ट नहीं करता।
- issue: ‘एक पवित्र आत्मा’
  choice: अनिश्चित अभिव्यक्ति सुरक्षित रखी गई
  alternative: निश्चित रूप से ‘पवित्र आत्मा’ करना
  rationale: आधार-पाठ के व्याकरणिक संकेत को धर्मसिद्धान्त के अनुसार सामान्यीकृत नहीं किया गया।
- issue: ‘हम छोटे हैं’ का आशय
  choice: शाब्दिक रूप से ‘हम छोटे हैं’
  alternative: ‘हम दुर्बल/तुच्छ हैं’
  rationale: मूल स्रोत की प्रत्यक्ष समीक्षा लंबित है और अंग्रेज़ी साक्ष्य का अर्थ बहुविकल्पी है; इसलिए अस्पष्टता संरक्षित है।
- issue: उद्धार की शिक्षा ‘नाम में’
  choice: ‘प्रभु यीशु मसीह के नाम में’
  alternative: ‘के नाम से’ या ‘के विषय में’
  rationale: स्रोत की धार्मिक सूत्रात्मकता और संभावित साधन/अधिकार संबंधी अर्थ दोनों खुले रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण पुनर्स्थापन, विराम और कठिन शब्दों में सावधानी बरती गई है। पाण्डुलिपि के पृष्ठ-संकेत हटाए गए हैं, पर क्षतिग्रस्त पाठ के वर्ग कोष्ठक और दीर्घविराम सुरक्षित हैं।
