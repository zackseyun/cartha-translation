translation:
  language: hi
  text: 'तब एक तेजस्वी प्रकाश दिखाई दिया, और जो प्रकट हुआ था, उसके दर्शन से पहाड़ चमक उठा। एक आवाज़ ने उन्हें जोर से पुकारा और कहा:


    “मेरी बातों पर ध्यान दो, ताकि मैं तुमसे बोल सकूँ।


    तुम मुझे क्यों खोज रहे हो?


    मैं यीशु मसीह हूँ, जो सदा तुम्हारे साथ रहता है।”


    प्रेरितों ने उत्तर दिया:


    “प्रभु, हम ऐओनों[a] की कमी और उनकी परिपूर्णता को समझना चाहेंगे, और यह भी कि इस निवास-स्थान में हमें कैसे रोके रखा गया है।


    हम इस स्थान पर कैसे पहुँचे?


    हम यहाँ से कैसे निकलेंगे?


    [b] हमें निर्भीक होकर बोलने का अधिकार कैसे मिलता है?


    शक्तियाँ हमारे विरुद्ध क्यों लड़ती हैं?”


    तब प्रकाश में से एक आवाज़ ने उन्हें जोर से पुकारा और कहा, “तुम ही गवाही देते हो कि मैंने ये सारी बातें तुमसे कही हैं; फिर भी तुम्हारे अविश्वास के कारण मैं इन्हें दोबारा कहूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऐओन” इस ग्रंथ में युग, लोक या ब्रह्मांडीय सत्ता के अर्थ में प्रयुक्त पारिभाषिक शब्द हो सकता है; यहाँ उसका अर्थ जानबूझकर खुला रखा गया है।
    reason: सामान्य हिंदी ‘युग’ संभावित पारिभाषिक अर्थ को अनावश्यक रूप से सीमित कर सकती है।
  - marker: b
    text: यहाँ उपलब्ध साक्ष्य में पाठ-हानि अथवा अनिश्चित पुनर्स्थापन का संकेत है।
    reason: अंग्रेज़ी साक्ष्य के वर्ग-कोष्ठक संकेत को पाठ में दृश्य रूप से सुरक्षित रखना आवश्यक है।
lexical_decisions:
- source_word: aeons
  choice: ऐओनों
  rationale: इस ग्रंथ के विशिष्ट ब्रह्मांड-विज्ञान में यह शब्द केवल सामान्य ‘युगों’ से अधिक अर्थ रख सकता है; इसलिए अर्थ को संकीर्ण किए बिना लिप्यंतरण रखा गया है।
- source_word: fullness
  choice: परिपूर्णता
  rationale: ‘कमी’ के साथ मूल विरोध को बनाए रखता है और संभावित पारिभाषिक अर्थ को अनावश्यक रूप से नहीं खोलता।
- source_word: dwelling-place
  choice: निवास-स्थान
  rationale: यह स्वाभाविक हिंदी है, पर ‘संसार’, ‘शरीर’ या किसी विशिष्ट लोक की व्याख्या आरोपित नहीं करती।
- source_word: authority for boldness of speech
  choice: निर्भीक होकर बोलने का अधिकार
  rationale: अधिकार और स्पष्ट/साहसी वाणी—दोनों अर्थ-घटकों को साधारण आधुनिक हिंदी में व्यक्त करता है।
- source_word: powers
  choice: शक्तियाँ
  rationale: संभावित अलौकिक या ब्रह्मांडीय सत्ताओं की पहचान को और अधिक निश्चित किए बिना स्रोत की व्यापकता बनाए रखता है।
- source_word: unfaithfulness
  choice: अविश्वास
  rationale: विश्वास न करने या विश्वास की कमी के अर्थ को संक्षेप में रखता है; इसे नैतिक ‘विश्वासघात’ के रूप में सीमित नहीं करता।
theological_decisions:
- issue: ‘ऐओन’ और ‘परिपूर्णता’ की ब्रह्मांड-विज्ञान संबंधी भाषा
  choice: पारिभाषिक अस्पष्टता को बनाए रखते हुए ‘ऐओनों’ और ‘परिपूर्णता’ रखा गया।
  alternative: ‘युगों’ और ‘पूर्णता’ अथवा किसी विशिष्ट ज्ञानवादी लोक-व्यवस्था का व्याख्यात्मक वर्णन।
  rationale: उपलब्ध आधार अंग्रेज़ी साक्ष्य है और कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित है; इसलिए किसी संप्रदायगत या आधुनिक विद्वत्तापरक व्यवस्था को पाठ में आरोपित नहीं किया गया।
- issue: प्रकाश से आने वाली आवाज़ और यीशु की पहचान
  choice: वक्ता की पहचान को प्रसंग के अनुसार रहने दिया गया; बाद में केवल ‘प्रकाश में से एक आवाज़’ कहा गया।
  alternative: हर बार स्पष्ट रूप से ‘यीशु की आवाज़’ कहना।
  rationale: साक्ष्य जहाँ केवल आवाज़ कहता है, वहाँ उससे अधिक स्पष्ट पहचान जोड़ना मूल की साहित्यिक अस्पष्टता को मिटा देता।
- issue: शक्तियों की प्रकृति
  choice: ‘शक्तियाँ’ रखा गया।
  alternative: ‘दुष्ट आत्मिक शक्तियाँ’, ‘शासक’ या ‘दैत्य’।
  rationale: मूल साक्ष्य उनकी नैतिक या अस्तित्वगत प्रकृति यहाँ स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज शैली रखी गई है। छोटे प्रश्न और समानांतर पंक्तियाँ मौखिक संवाद की लय बनाए रखती हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; नाग हम्मादी कोडेक्स VIII,2 और कोडेक्स त्चाकोस के कॉप्टिक पाठ से प्रत्यक्ष मिलान अभी अपेक्षित है।
