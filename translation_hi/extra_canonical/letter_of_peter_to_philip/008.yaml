  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: hi
  text: 'पतरस ने [तब] [दूसरे प्रेरितों को] इकट्ठा किया और कहा, “हे [हमारे प्रभु] यीशु मसीह, हमारे विश्राम के कर्ता, हमें समझ की आत्मा प्रदान कर, ताकि हम भी चमत्कार कर सकें!”


    तब पतरस और दूसरे प्रेरितों ने [उसे] देखा। वे पवित्र आत्मा से भर गए, और उनमें से प्रत्येक ने लोगों को चंगा किया। वे प्रभु यीशु की घोषणा करने निकल पड़े। बाद में वे फिर इकट्ठा हुए, एक-दूसरे का अभिवादन किया और बोले, “आमीन।”


    तब यीशु उन्हें दिखाई दिया और उनसे कहा, “तुम [सबको] और उन सभी को शांति मिले जो मेरे नाम में विश्वासयोग्य हैं। जब तुम जाओगे, तब आनंद, अनुग्रह और सामर्थ्य तुम्हारे साथ होंगे।


    “मत डरो। देखो, मैं सदा तुम्हारे साथ रहूँगा।”


    तब प्रेरित प्रचार के अपने चार अभियानों[a] के लिए एक-दूसरे से अलग होकर निकल पड़े। वे यीशु की सामर्थ्य के साथ शांति से गए।


    पतरस का फिलिप्पुस के नाम पत्र'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य का शाब्दिक पाठ यहाँ “चार संदेशों में” कहता है; आशय सम्भवतः चार प्रचार-कार्यों या दिशाओं से है। कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी बाकी है।
    reason: पाठगत अभिव्यक्ति असामान्य और अनिश्चित है; मुख्य पाठ में पठनीय अर्थ दिया गया है, पर वैकल्पिक शाब्दिक रूप को छिपाया नहीं गया।
lexical_decisions:
- source_word: repose / rest
  choice: विश्राम
  rationale: रचना के आध्यात्मिक ‘rest’ को सामान्य और गरिमापूर्ण हिन्दी में रखता है; इसे केवल शारीरिक आराम या किसी विशिष्ट सांप्रदायिक अवधारणा तक सीमित नहीं करता।
- source_word: spirit of insight / understanding
  choice: समझ की आत्मा
  rationale: ‘आत्मा’ और ‘समझ’ दोनों घटकों को स्पष्ट रखते हुए प्रार्थना की स्वाभाविक हिन्दी देता है।
- source_word: holy Spirit
  choice: पवित्र आत्मा
  rationale: धार्मिक पद की परिचित हिन्दी है; अंग्रेज़ी साक्ष्य के अनिश्चित लेख को हिन्दी में अस्वाभाविक ‘एक’ जोड़कर आवश्यकता से अधिक निर्णीत नहीं किया गया।
- source_word: declare / proclaim
  choice: घोषणा करने
  rationale: सार्वजनिक प्रचार के भाव को साधारण पाठक के लिए स्पष्ट रखता है।
- source_word: power
  choice: सामर्थ्य
  rationale: यहाँ चमत्कार और सेवकाई की प्रदत्त क्षमता का भाव है; ‘सत्ता’ की अपेक्षा ‘सामर्थ्य’ अधिक उपयुक्त है।
theological_decisions:
- issue: ‘holy Spirit’ में व्यक्तित्व अथवा अनिश्चितता
  choice: ‘पवित्र आत्मा से भर गए’
  alternative: ‘एक पवित्र आत्मा से भर गए’
  rationale: हिन्दी में लेख नहीं होते; ‘एक’ जोड़ना अंग्रेज़ी के अनिश्चित लेख को धर्मवैचारिक रूप से आवश्यकता से अधिक उभारता और वाक्य को अस्वाभाविक बनाता।
- issue: यीशु के ‘सदा साथ’ रहने का कथन
  choice: ‘मैं सदा तुम्हारे साथ रहूँगा’
  alternative: ‘मैं निरंतर तुम्हारे साथ रहूँगा’
  rationale: दोनों सम्भव हैं; ‘सदा’ साधारण आधुनिक हिन्दी में निरंतर उपस्थिति का आशय स्पष्ट करता है, बिना उसकी प्रकृति की व्याख्या किए।
- issue: ‘faithful in my name’
  choice: ‘जो मेरे नाम में विश्वासयोग्य हैं’
  alternative: ‘जो मेरे नाम पर विश्वास करते हैं’
  rationale: ‘विश्वासयोग्य’ मूल साक्ष्य में निष्ठा और विश्वास के बीच मौजूद तनाव को बनाए रखता है; केवल आरंभिक विश्वास तक अर्थ सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, सरल किंतु गरिमापूर्ण धार्मिक शैली। पांडुलिपि में पुनर्स्थापित शब्दों को वर्ग कोष्ठकों में बनाए रखा गया है। अनावश्यक पृष्ठ-संख्या संकेत हटाए गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दिए गए लेखा-परीक्षित परामर्श-पाठ पर आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित है।
