base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: hi
  text: प्रभु ने किस रीति से प्रचार किया—जब वे देह में रहते थे, और जब उन्होंने अपने आपको परमेश्वर का पुत्र प्रकट किया, उसके बाद? वे इसी स्थान में रहे जहाँ तुम रहते हो और प्राकृतिक वस्तुओं की व्यवस्था के विषय में बताते रहे, जिसे मैं, फिर भी, “मृत्यु” कहता हूँ। हे रेगिनोस, परमेश्वर का पुत्र मनुष्य का पुत्र था। मानवता और दिव्यता—दोनों को धारण करके उसने दोनों को अपने में ले लिया। इसलिए एक ओर, परमेश्वर का पुत्र होने के नाते वह मृत्यु को दूर कर सका; और दूसरी ओर, मनुष्य का पुत्र होने के नाते उसने पूर्णता[b] की पुनर्स्थापना की। ऐसा इसलिए था कि उसके (निचले) ढाँचे[a] के अस्तित्व में आने से पहले उसकी उत्पत्ति ऊपर से, सत्य के बीज के रूप में हुई थी। इसी (निचले) ढाँचे में बहुत-से प्रभुत्व और देवत्व अस्तित्व में आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “(निचला) ढाँचा” उपलब्ध अंग्रेज़ी साक्ष्य का निकट अनुवाद है। यह ठीक किस ढाँचे—शरीर, सांसारिक गठन या किसी ब्रह्मांडीय संरचना—को सूचित करता है, यह यहाँ निश्चित नहीं है।
    reason: तकनीकी और संदर्भगत अस्पष्टता को बिना चुपचाप सुलझाए पाठक के सामने रखना।
  - marker: b
    text: “पूर्णता” यहाँ संभवतः संपूर्ण दिव्य परिपूर्णता या दिव्य लोक के लिए प्रयुक्त विशेष शब्द है।
    reason: सामान्य हिन्दी अर्थ और संभावित तकनीकी ब्रह्मांड-विज्ञान संबंधी अर्थ, दोनों का संकेत देना।
lexical_decisions:
- source_word: lived in the flesh
  choice: देह में रहते थे
  rationale: देहधारण से जुड़े मूर्त अर्थ को बनाए रखते हुए सहज और गरिमापूर्ण हिन्दी देता है।
- source_word: law of natural things
  choice: प्राकृतिक वस्तुओं की व्यवस्था
  rationale: ‘law’ को केवल विधान या आज्ञा न मानकर प्रकृति में कार्यरत व्यवस्था के व्यापक अर्थ में रखा गया है; उपलब्ध अंग्रेज़ी साक्ष्य की अस्पष्टता बनी रहती है।
- source_word: banish death
  choice: मृत्यु को दूर कर सका
  rationale: मृत्यु को हटाने या निष्कासित करने का अर्थ देता है, पर उसके ढंग के विषय में अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- source_word: Fullness
  choice: पूर्णता
  rationale: विशिष्ट ब्रह्मांड-विज्ञान संबंधी आशय की संभावना बनाए रखने के लिए संज्ञा-रूप ‘पूर्णता’ चुना गया है और पादटिप्पणी में इसे स्पष्ट किया गया है।
- source_word: (lower) structure
  choice: (निचला) ढाँचा
  rationale: साक्ष्य में कोष्ठकबद्ध ‘lower’ और रूपकात्मक ‘structure’ दोनों को यथासंभव प्रत्यक्ष रखा गया है; मूल कॉप्टिक की समीक्षा लंबित होने के कारण अधिक निश्चित शब्द नहीं चुना गया।
- source_word: dominions and divinities
  choice: प्रभुत्व और देवत्व
  rationale: दोनों श्रेणियों के बीच भेद और उनकी संभावित अमूर्त अथवा सत्तात्मक अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के पुत्र और मनुष्य के पुत्र की पहचान
  choice: “परमेश्वर का पुत्र मनुष्य का पुत्र था” को सीधे बनाए रखा गया है।
  alternative: दोनों उपाधियों को दो स्वभावों की व्यवस्थित धर्मवैज्ञानिक व्याख्या में विस्तृत करना।
  rationale: साक्ष्य का कथन स्वयं बोलने दिया गया है; बाद की किसी मतपरंपरा की शब्दावली आरोपित नहीं की गई।
- issue: मानवता और दिव्यता को अपने में लेना
  choice: “मानवता और दिव्यता—दोनों को धारण करके उसने दोनों को अपने में ले लिया”
  alternative: इसे ‘पूर्ण परमेश्वर और पूर्ण मनुष्य’ जैसी पारिभाषिक अभिव्यक्ति में बदलना।
  rationale: उपलब्ध साक्ष्य की भाषा और तनाव सुरक्षित रहते हैं, जबकि कोई उत्तरकालीन सिद्धान्तात्मक सूत्र नहीं जोड़ा जाता।
- issue: पूर्णता की पुनर्स्थापना
  choice: विशिष्ट शब्द ‘पूर्णता’ रखा गया है।
  alternative: ‘समस्त सृष्टि की बहाली’ अथवा ‘प्लेरोमा’ लिखना।
  rationale: पहला विकल्प मूल से अधिक व्याख्यात्मक होता और दूसरा साधारण पाठक के लिए अनावश्यक रूप से तकनीकी; ‘पूर्णता’ दोनों के बीच संतुलन रखता है।
- issue: ऊपर से उत्पत्ति और निचला ढाँचा
  choice: कालक्रम और ऊपर/नीचे के विरोध को अक्षुण्ण रखा गया है।
  alternative: इसे अवतार, शरीर या भौतिक जगत के रूप में निश्चित करना।
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य यह निश्चित नहीं करता कि ‘structure’ ठीक किसका संकेत है; अतः अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। वाक्य-विन्यास को सीमित रूप से स्वाभाविक बनाया गया है, पर मूल साक्ष्य की प्रश्नात्मक शुरुआत, द्विपक्षीय तर्क और ब्रह्मांड-विज्ञान संबंधी अस्पष्टता सुरक्षित रखी गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
