review_pass:
  verdict: revise
  source_fidelity: Draft is broadly faithful to the supplied English witness, including its contrast between seeking one's own satisfaction and receiving satisfaction through the Savior, and it appropriately does not add “Jesus” to “Lord Christ.” However, it normalizes away the witness’s parenthetical “(interpretation)” and “(true satisfaction),” which are important signals of editorial/restorative uncertainty in this provisional bridge text. “If they are successful with these” is also more closely represented as success in those matters/questions than as specifically finding their answers.
  naturalness: The Hindi is clear, idiomatic, and appropriately reflective in register. Minor revisions improve precision while retaining natural modern standard Hindi.
  terminology: “सत्य का वचन,” “तृप्ति,” “विश्राम,” and “पुनरुत्थान” are suitable and preserve the witness’s theological and conceptual openness. “रेगिनोस” more closely reflects Rheginos than “रेजिनोस.”
  issues:
  - severity: medium
    issue: Parenthetical source signals are omitted.
    rationale: The English witness marks “(true satisfaction)” and “(interpretation)” parenthetically. Since the translation is based on that witness and direct Coptic review is pending, these signals should be retained rather than silently resolved in the main text.
  - severity: low
    issue: “If they are successful with these” is narrowed to obtaining answers.
    rationale: “यदि वे उनके उत्तर पा लेते हैं” makes success specifically consist in finding answers, whereas the witness more broadly says that they are successful “with these” questions/matters.
  - severity: low
    issue: Proper-name transliteration can be improved.
    rationale: “रेगिनोस” represents the g sound in Rheginos more closely than “रेजिनोस.”
