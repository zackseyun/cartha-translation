translation:
  language: hi
  text: '[] मेरे पुत्र रेजिनोस, कुछ लोग बहुत-सी बातें सीखना चाहते हैं। जिन प्रश्नों के उत्तर उनके पास नहीं हैं, उन्हीं में उलझे रहना उनका लक्ष्य होता है। यदि वे उनके उत्तर पा लेते हैं, तो वे अपने आपको बहुत महत्त्वपूर्ण समझने लगते हैं। पर मैं नहीं मानता कि वे सत्य के वचन तक पहुँचे हैं। इसके बजाय, वे अपनी ही तृप्ति खोजते हैं, जबकि हमने अपने उद्धारकर्ता, अपने प्रभु मसीह के द्वारा सच्ची तृप्ति पाई है। [] हमने इसे तब पाया, जब हमने सत्य को जाना और उसमें अपना विश्राम पाया।


    फिर भी, चूँकि तुम विनम्रतापूर्वक पूछते हो कि पुनरुत्थान की सही व्याख्या क्या है, इसलिए मैं तुम्हें वही लिख रहा हूँ जो आवश्यक है। निश्चय ही बहुत-से लोग उस पर विश्वास नहीं करते; पर कुछ लोग उसे पा लेते हैं। तो आओ, हम इस विषय पर विचार करें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: My son Rheginos
  choice: मेरे पुत्र रेजिनोस
  rationale: पत्रात्मक आत्मीय संबोधन को औपचारिक किन्तु स्वाभाविक हिन्दी में रखा गया; नाम का ध्वन्यात्मक लिप्यंतरण किया गया।
- source_word: word of truth
  choice: सत्य का वचन
  rationale: मूल साक्ष्य की सम्भावित तकनीकी अथवा धार्मिक अभिव्यक्ति को व्याख्यात्मक रूप से सरल किए बिना सुरक्षित रखा गया।
- source_word: satisfaction
  choice: तृप्ति
  rationale: सिर्फ बौद्धिक संतोष के बजाय पूर्णता या संतुष्टि की व्यापक अर्थ-छाया बनाए रखता है।
- source_word: repose
  choice: विश्राम
  rationale: आत्मिक और अस्तित्वगत शांति—दोनों की सम्भावना रखने वाला स्वाभाविक धार्मिक शब्द।
- source_word: resurrection
  choice: पुनरुत्थान
  rationale: मृतकों के फिर उठने के लिए प्रचलित, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला पद।
- source_word: find it
  choice: उसे पा लेते हैं
  rationale: साक्ष्य की असामान्य और सम्भवतः धार्मिक अर्थवत्ता वाली भाषा को ‘समझते हैं’ या ‘मानते हैं’ बनाकर स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ‘true satisfaction’ में कोष्ठकीय स्पष्टीकरण
  choice: ‘सच्ची तृप्ति’ को मुख्य पाठ में स्पष्ट रूप से व्यक्त किया
  alternative: केवल ‘तृप्ति’ अथवा कोष्ठकों सहित ‘(सच्ची तृप्ति)’
  rationale: अंग्रेज़ी साक्ष्य में यह पुनःपूर्ति/व्याख्यात्मक संकेत है; हिन्दी में वाक्य का विरोध स्पष्ट रखने के लिए इसे सहज रूप दिया गया, पर इसे किसी विशिष्ट उद्धार-सिद्धान्त से नहीं जोड़ा गया।
- issue: पुनरुत्थान को ‘पाना’
  choice: ‘कुछ लोग उसे पा लेते हैं’
  alternative: ‘कुछ लोग उस पर विश्वास करते हैं’ या ‘उसे समझते हैं’
  rationale: ‘find it’ और उससे पहले ‘put no faith in it’ के बीच तनाव को बनाए रखा गया; दोनों कथनों को एक ही अर्थ में समतल नहीं किया गया।
- issue: उद्धारकर्ता और प्रभु मसीह का संबंध
  choice: ‘अपने उद्धारकर्ता, अपने प्रभु मसीह के द्वारा’
  alternative: ‘हमारे उद्धारकर्ता प्रभु यीशु मसीह के द्वारा’
  rationale: साक्ष्य में ‘Jesus’ नहीं है; इसलिए नाम जोड़ने और उपाधियों का संबंध आवश्यकता से अधिक निश्चित करने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय पत्रात्मक और विचारपरक शैली। पांडुलिपि-क्षति या पुनर्स्थापन के संकेत के रूप में दिए गए खाली वर्ग-कोष्ठक [] यथावत रखे गए हैं। प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-सचेत अनुवाद है।
