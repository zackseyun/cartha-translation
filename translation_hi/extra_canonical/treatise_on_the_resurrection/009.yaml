base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: hi
  text: 'फिर भी, मैं तुमसे यह क्या कह रहा हूँ? जो जीवित हैं, क्या वे मरेंगे? वे माया में कैसे जीवित हैं? धनी निर्धन हो गए हैं और राजा नीचे गिरा दिए गए हैं। सब कुछ परिवर्तन के अधीन है। संसार माया है—यदि सचमुच मैं परिस्थिति को बढ़ा-चढ़ाकर नहीं कह रहा हूँ।


    परन्तु पुनरुत्थान का स्वभाव वैसा—मायावी और क्षणभंगुर—नहीं है, क्योंकि वह दृढ़ बनी रहने वाली वास्तविकता है। वह उसका प्रकाशन है जो अस्तित्व में है—वस्तुओं का रूपान्तरण और जो नया है उसमें परिवर्तन। क्योंकि अविनाशिता [a] नाशवान पर [उतरेगी]। प्रकाश अन्धकार पर उतरकर उसे निगल जाएगा। तब परिपूर्णता अभाव को भर देगी। ये पुनरुत्थान के प्रतीक और प्रतिरूप हैं। इसी से भलाई होती है।


    [a] यहाँ उपलब्ध पाठ में एक रिक्ति है; “उतरेगी” सम्पादकीय पुनर्स्थापना है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध पाठ में एक रिक्ति है; “उतरेगी” सम्पादकीय पुनर्स्थापना है।
    reason: अंग्रेज़ी साक्ष्य के [] और [will descend] संकेत पाण्डुलिपि-क्षति अथवा सम्पादकीय पूर्ति दर्शाते हैं; इसे पाठक के लिए पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: illusion
  choice: माया
  rationale: यहाँ बदलते और अस्थायी जगत की आभासी प्रकृति व्यक्त होती है; आधुनिक हिन्दी में ‘माया’ स्वाभाविक है, पर इसे किसी विशिष्ट दार्शनिक मत तक सीमित नहीं किया गया।
- source_word: resurrection
  choice: पुनरुत्थान
  rationale: मृत्यु से उठने के लिए प्रचलित, गरिमापूर्ण और व्यापक धार्मिक शब्द।
- source_word: reality that remains firm
  choice: दृढ़ बनी रहने वाली वास्तविकता
  rationale: स्थायित्व और वास्तविक अस्तित्व—दोनों बलों को बनाए रखता है।
- source_word: transfiguration
  choice: रूपान्तरण
  rationale: रूप के गहरे परिवर्तन को सहज हिन्दी में व्यक्त करता है; निकटवर्ती ‘transformation’ के साथ कुछ पुनरुक्ति मूल की अर्थ-सघनता को सुरक्षित रखती है।
- source_word: imperishability
  choice: अविनाशिता
  rationale: नाश के अधीन न होने की अमूर्त अवस्था को ठीक रूप से व्यक्त करता है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: मूल की सम्भावित तकनीकी/प्रतीकात्मक संज्ञा को सामान्य अर्थ सहित सुरक्षित रखने के लिए आरम्भिक अक्षर की विशिष्टता हिन्दी में प्रसंग और समानांतरता से व्यक्त की गई।
- source_word: Deficiency
  choice: अभाव
  rationale: कमी या अपूर्णता की विरोधी अवस्था को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: symbols and images
  choice: प्रतीक और प्रतिरूप
  rationale: दो अलग लेकिन निकटवर्ती चित्रात्मक शब्दों का भेद बनाए रखता है।
theological_decisions:
- issue: संसार को ‘illusion’ कहना
  choice: ‘संसार माया है’ को प्रत्यक्ष कथन के रूप में रखा
  alternative: ‘संसार भ्रम है’ या कथन को केवल अस्थायित्व तक सीमित करना
  rationale: साक्ष्य के तीखे तात्त्विक कथन और उसके साथ लगे आत्म-संशय (‘यदि... बढ़ा-चढ़ाकर नहीं’) दोनों को बिना मतगत व्याख्या के सुरक्षित रखा।
- issue: पुनरुत्थान की प्रकृति
  choice: उसे स्थायी वास्तविकता और प्रकाशन दोनों कहा
  alternative: इसे केवल भविष्य की शारीरिक घटना अथवा केवल आध्यात्मिक अनुभूति बनाना
  rationale: पाठ दोनों प्रकार की संभावनाओं को पूरी तरह परिभाषित नहीं करता; इसलिए उसकी धर्मवैचारिक खुली बनावट रखी गई।
- issue: परिपूर्णता और अभाव
  choice: प्रतीकात्मक अमूर्त संज्ञाओं के रूप में अनूदित किया
  alternative: विशिष्ट ग्नोस्टिक तकनीकी शब्दावली या व्यक्तिवाचक सत्ताओं के रूप में स्पष्ट करना
  rationale: प्रत्यक्ष कॉप्टिक समीक्षा लंबित है और अंग्रेज़ी साक्ष्य से तकनीकी अर्थ को निर्णायक बनाना उचित नहीं।
- issue: ‘This makes for what is good’
  choice: ‘इसी से भलाई होती है’
  alternative: ‘यही उद्धार लाता है’
  rationale: मूल साक्ष्य के सामान्य ‘good’ को किसी अधिक विशिष्ट उद्धार-सिद्धान्त में नहीं बदला।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष कॉप्टिक स्रोत-परीक्षण अभी लंबित है। अलंकारिक प्रश्न, परिवर्तनशील संसार और स्थायी पुनरुत्थान का विरोध, तथा ‘परिपूर्णता/अभाव’ की प्रतीकात्मक समानांतरता बनाए रखी गई है।
