translation:
  language: hi
  text: 'इसलिए, हे रेगिनोस, अधूरे सत्यों में मत सोचो और दूसरों से सहमत होने के लिए इस देह के अनुसार मत जियो। इसके बजाय, फूट और बंधनों से दूर भागो, और तुम अभी पुनरुत्थान का अनुभव करोगे। क्योंकि यदि नश्वर मनुष्य जानता है कि वह मरेगा, तो इस जीवन में बहुत वर्ष बिताने पर भी वह इस निष्कर्ष पर पहुँचता है: क्यों न तुम अपने आप को जी उठा और मंज़िल पर पहुँचा हुआ मानो?


    यदि पुनरुत्थान तुम्हें प्राप्त है, तो तुम अब भी ऐसा आचरण क्यों करते हो मानो तुम फिर मरोगे? तुम्हें जानना चाहिए कि तुम पहले ही मर चुके हो। अभ्यास की कमी के कारण तुम इस बात को अनदेखा करते हो। हर किसी के लिए अलग-अलग ढंग से अभ्यास करना उचित है। तब वे इस तत्व[a] से मुक्त किए जाएँगे, ताकि वे भूल में न पड़ें, बल्कि जो आरम्भ से था उसे फिर से प्राप्त करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस तत्व” का आशय अस्पष्ट है; उपलब्ध अंग्रेज़ी साक्ष्य भी इसे स्पष्ट नहीं करता।
    reason: मूल कॉप्टिक पाठ की प्रत्यक्ष समीक्षा अभी लंबित है और परामर्श-साक्ष्य ने इस पद की अस्पष्टता सुरक्षित रखी है।
lexical_decisions:
- source_word: partial (truths)
  choice: अधूरे सत्य
  rationale: अंग्रेज़ी साक्ष्य की असामान्य और कुछ अस्पष्ट अभिव्यक्ति को सहज हिन्दी में रखते हुए उसकी अपूर्णता का भाव सुरक्षित किया गया है।
- source_word: this flesh
  choice: इस देह
  rationale: ‘देह’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है तथा मूल अभिव्यक्ति के निकट रहती है।
- source_word: divisions and bondages
  choice: फूट और बंधन
  rationale: सामुदायिक विभाजन तथा बाँधने वाली अवस्थाओं—दोनों अर्थ-क्षेत्रों को खुला रखा गया है।
- source_word: experience the resurrection now
  choice: अभी पुनरुत्थान का अनुभव करोगे
  rationale: वर्तमान अनुभव पर दिए गए स्पष्ट बल को भविष्यकालीन पुनरुत्थान में विलीन नहीं किया गया।
- source_word: having arrived
  choice: मंज़िल पर पहुँचा हुआ
  rationale: केवल भौतिक आगमन के बजाय पूर्णता तक पहुँचने का संभावित भाव देता है, पर गंतव्य को निश्चित नहीं करता।
- source_word: train / training
  choice: अभ्यास / अभ्यास की कमी
  rationale: आत्मिक, नैतिक या अनुशासनात्मक प्रशिक्षण में से किसी एक को अनावश्यक रूप से निश्चित किए बिना व्यापक शब्द चुना गया।
- source_word: this element
  choice: इस तत्व
  rationale: अंग्रेज़ी साक्ष्य की वास्तविक अस्पष्टता को व्याख्यात्मक विस्तार से हल नहीं किया गया।
theological_decisions:
- issue: पुनरुत्थान का वर्तमान अनुभव
  choice: ‘अभी पुनरुत्थान का अनुभव करोगे’ और ‘पुनरुत्थान तुम्हें प्राप्त है’
  alternative: इसे केवल भविष्य के देहधारी पुनरुत्थान के रूप में स्पष्ट करना
  rationale: अनुच्छेद वर्तमान में पुनरुत्थान पाने या अनुभव करने की भाषा स्वयं इस्तेमाल करता है; अनुवाद उस तनाव को सुरक्षित रखता है।
- issue: ‘तुम पहले ही मर चुके हो’ का अर्थ
  choice: कथन को बिना व्याख्यात्मक योग के यथावत रखा गया
  alternative: ‘पाप के लिए मर चुके हो’ या ‘आत्मिक रूप से मर चुके हो’
  rationale: साक्ष्य मृत्यु के प्रकार को स्पष्ट नहीं करता; किसी विशिष्ट धार्मिक व्याख्या को जोड़ना अनुचित होगा।
- issue: आरम्भिक वस्तु या अवस्था की पुनःप्राप्ति
  choice: ‘जो आरम्भ से था उसे फिर से प्राप्त करें’
  alternative: इसे किसी नामित सिद्धान्त, स्वभाव या उद्धार-अवस्था के रूप में पहचानना
  rationale: वाक्य का संकेतात्मक और अस्पष्ट स्वर बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक स्रोत-पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण असामान्य या अस्पष्ट पदों को सावधानी से खुला रखा गया है।
