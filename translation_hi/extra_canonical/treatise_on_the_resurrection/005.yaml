  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: hi
  text: 'फिर भी, यदि कुछ लोग विश्वास नहीं करते, तो इसका कारण यह है कि उन्हें विश्वास दिलाया नहीं जा सकता। क्योंकि, मेरे पुत्र, मरे हुओं का जी उठना विश्वास का विषय है, तर्क-वितर्क का नहीं।


    इस संसार के दार्शनिकों में कुछ ऐसे हैं जो विश्वास करते हैं, ताकि कम-से-कम वे जी उठें। और इस संसार का कोई दार्शनिक यह विश्वास करके अपने आप को सही न ठहराए कि वह स्वयं ही अपने आप को मृत्यु से जीवन में लौटा लाता है। क्योंकि अपने विश्वास के कारण हम मनुष्य के पुत्र को जानते हैं, और विश्वास करते हैं कि वह मरे हुओं में से जी उठा। उसी के विषय में हम घोषणा करते हैं, “वह मृत्यु का मिटा दिया जाना बन गया।”[a] क्योंकि विश्वास महान है, और विश्वास करनेवाले भी ⟨महान⟩ हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मृत्यु का मिटा दिया जाना” प्राप्त अंग्रेज़ी साक्ष्य की असामान्य अभिव्यक्ति का निकट अनुवाद है; इसका अर्थ मृत्यु का अंत या उन्मूलन भी समझा जा सकता है।
    reason: अभिव्यक्ति की वास्तविक अर्थगत असामान्यता को स्पष्ट करना, बिना मुख्य पाठ को सहज बनाने के लिए उसका धर्मवैज्ञानिक अर्थ तय किए।
  - marker: b
    text: ⟨महान⟩ साक्ष्य में संपादक द्वारा पुनर्स्थापित शब्द है; कोणीय कोष्ठक इसी पाठगत अनिश्चितता को दर्शाते हैं।
    reason: प्राप्त साक्ष्य के restoration marking को पाठक के लिए समझाना।
lexical_decisions:
- source_word: cannot be convinced
  choice: उन्हें विश्वास दिलाया नहीं जा सकता
  rationale: प्राप्त अंग्रेज़ी साक्ष्य में निहित मनवाए या आश्वस्त किए जाने की असमर्थता को सहज हिन्दी में रखता है, बिना यह तय किए कि बाधा बौद्धिक है या इच्छागत।
- source_word: argumentation
  choice: तर्क-वितर्क
  rationale: विश्वास के साथ रखे गए विरोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और केवल औपचारिक प्रमाण तक अर्थ सीमित नहीं करता।
- source_word: feel justified
  choice: अपने आप को सही ठहराए
  rationale: आत्म-औचित्य के भाव को बनाए रखता है; इसे धार्मिक ‘धर्मी ठहरना’ जैसी पारिभाषिक भाषा में नहीं बदलता।
- source_word: Son of Man
  choice: मनुष्य का पुत्र
  rationale: पारंपरिक उपाधि का औपचारिक और पहचानने योग्य हिन्दी रूप।
- source_word: obliteration of death
  choice: मृत्यु का मिटा दिया जाना
  rationale: साक्ष्य की असामान्य और प्रबल संज्ञात्मक अभिव्यक्ति को सामान्यीकृत करके केवल ‘मृत्यु का नाश करनेवाला’ नहीं बनाया गया।
- source_word: <great>
  choice: ⟨महान⟩
  rationale: साक्ष्य में संपादकीय पुनर्स्थापन के चिह्न को सुरक्षित रखता है।
theological_decisions:
- issue: पुनरुत्थान और विश्वास का संबंध
  choice: ‘मरे हुओं का जी उठना विश्वास का विषय है, तर्क-वितर्क का नहीं’
  alternative: ‘पुनरुत्थान को तर्क से सिद्ध नहीं किया जा सकता’
  rationale: मूल साक्ष्य जितना कहता है उतना ही रखा गया है; यह अतिरिक्त दावा नहीं जोड़ा गया कि तर्क का कोई स्थान सर्वथा नहीं है।
- issue: दार्शनिक का स्वयं को जीवन में लौटाना
  choice: ‘वह स्वयं ही अपने आप को मृत्यु से जीवन में लौटा लाता है’
  alternative: ‘वह अपने बल से पुनरुत्थान प्राप्त करता है’
  rationale: आत्म-क्रिया और आत्मनिर्भरता दोनों को सुरक्षित रखा गया है, बिना किसी विशिष्ट उद्धारशास्त्रीय प्रणाली को आरोपित किए।
- issue: ‘जिसके विषय में’ का पूर्वपद
  choice: इसे मनुष्य के पुत्र से जोड़ा गया
  alternative: इसे उसके पुनरुत्थान से जोड़ना
  rationale: प्राप्त साक्ष्य का निकटतम व्याकरणिक पूर्वपद ‘मनुष्य का पुत्र’ है, यद्यपि वाक्य कुछ असहज है।
- issue: विश्वास करनेवाले ‘महान’
  choice: पुनर्स्थापित शब्द को कोणीय कोष्ठकों में रखा
  alternative: चिह्न हटाकर ‘महान’ को निर्विवाद पाठ की तरह छापना
  rationale: पांडुलिपीय/संपादकीय अनिश्चितता को छिपाया नहीं गया।
