  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। ‘मेरे पुत्र’, ‘मनुष्य का पुत्र’ और ‘मरे हुओं में से जी उठा’ जैसे सूत्रात्मक पद संरक्षित हैं। यह मसौदा प्रत्यक्ष कॉप्टिक समीक्षा के अभाव में दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; इसलिए असामान्य वाक्य-विन्यास और पाठ-पुनर्स्थापन को अनावश्यक रूप से समतल नहीं किया गया।
