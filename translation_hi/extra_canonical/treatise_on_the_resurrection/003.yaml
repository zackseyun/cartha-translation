    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/003.yaml
  text: 'I realize that I am giving [] the answer in complex language. Yet there is nothing difficult to understand about the word of truth. The answer appeared so that nothing would remain hidden, but so that everything about existence would be revealed. The result was, on the one hand, the obliteration of evil and, on the other, the revelation of the chosen ones. All this is the emanation of truth and spirit, with grace coming from truth.


    People do not think that you are unaware that the Savior swallowed up death, because he did away with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible and thus preparing the way for us to our immortality.'
translation:
  language: hi
  text: 'मैं समझता हूँ कि मैं [] उत्तर जटिल भाषा में दे रहा हूँ। फिर भी सत्य के वचन में समझने के लिए कुछ भी कठिन नहीं है। उत्तर इसलिए प्रकट हुआ कि कुछ भी छिपा न रहे, बल्कि अस्तित्व से संबंधित सब बातें प्रकट हो जाएँ। इसका परिणाम एक ओर बुराई का मिट जाना और दूसरी ओर चुने हुओं का प्रकट होना था। यह सब सत्य और आत्मा का प्रस्फुटन है, और अनुग्रह सत्य से आता है।


    लोग यह नहीं मानते कि तुम इस बात से अनजान हो कि उद्धारकर्ता ने मृत्यु को निगल लिया, क्योंकि उसने नाशवान संसार को समाप्त कर दिया। उसने [उसे] एक अविनाशी एओन[a] में बदल दिया और स्वयं को ऊपर उठाया; अदृश्य के द्वारा दृश्य को निगलकर उसने इस प्रकार हमारे लिए अमरता का मार्ग तैयार किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एओन” का अर्थ संदर्भ के अनुसार “युग,” “लोक” या एक शाश्वत अस्तित्व-क्षेत्र हो सकता है; इसलिए इसे अनूदित करने के बजाय लिप्यंतरित रखा गया है।
    reason: मूल पारिभाषिक शब्द की वास्तविक अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: word of truth
  choice: सत्य का वचन
  rationale: धार्मिक-दार्शनिक गरिमा बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: emanation
  choice: प्रस्फुटन
  rationale: किसी स्रोत से प्रकट या प्रवाहित होने का भाव रखता है, पर किसी विशिष्ट दार्शनिक तंत्र को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: मूल उपाधि का प्रचलित, संप्रदाय-निरपेक्ष हिन्दी रूप।
- source_word: aeon
  choice: एओन
  rationale: शब्द को लिप्यंतरित रखा गया है, क्योंकि संदर्भ में इसका अर्थ युग, लोक या शाश्वत सत्ता-क्षेत्र हो सकता है।
- source_word: swallowed up
  choice: निगल लिया / निगलकर
  rationale: मूल की सशक्त रूपकात्मक भाषा को दोनों स्थलों पर प्रत्यक्ष रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: नाशवान संसार के साथ उद्धारकर्ता की क्रिया
  choice: समाप्त कर दिया
  alternative: उससे छुटकारा पाया / उसे त्याग दिया
  rationale: अंग्रेज़ी साक्ष्य का ‘dispensed with/did away with’ अस्पष्ट है; चुना गया रूप विनाश या निरसन का भाव देता है, पर किसी विस्तृत ब्रह्माण्ड-विज्ञान को नहीं जोड़ता।
- issue: अदृश्य के द्वारा दृश्य को निगलना
  choice: मूल विरोध और साधन-संबंध यथावत रखा
  alternative: अदृश्य ने दृश्य को अपने में समा लिया
  rationale: रहस्यात्मक कथन को व्याख्यायित करके उसकी theological tension समाप्त नहीं की गई।
- issue: ‘grace being from truth’ का संबंध
  choice: अनुग्रह सत्य से आता है
  alternative: अनुग्रह सत्य का है
  rationale: स्रोत-साक्ष्य में निर्गमन या उद्गम का भाव है; हिन्दी में स्पष्ट किया गया, पर सत्य और आत्मा के बीच संबंध को आगे नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। आरंभ का [] पांडुलिपि-क्षति या लुप्त पाठ दर्शाने के लिए जस का तस रखा गया है; [उसे] संपादकीय पूर्ति को दर्शाता है। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
