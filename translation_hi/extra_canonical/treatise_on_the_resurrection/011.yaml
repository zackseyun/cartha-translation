translation:
  language: hi
  text: 'यह सब मैंने अपने [] प्रभु यीशु मसीह की कृपा से पाया है। हे मेरे बच्चो, इन बातों के विषय में मैंने तुम्हें और तुम्हारे [भाइयों और बहनों] को शिक्षा दी है और ऐसी किसी भी बात की उपेक्षा नहीं की जो तुम्हें दृढ़ कर सकती थी। फिर भी, यदि वचन की मेरी व्याख्या में मैंने कुछ ऐसा लिखा है जो अस्पष्ट है, तो तुम्हारे पूछने पर मैं उसे तुम्हें समझा दूँगा।


    परन्तु अब इसे अपने बीच किसी के साथ बाँटने को लेकर चिन्तित मत हो, क्योंकि यह सहायक हो सकता है।[a]


    बहुत-से लोग उन प्रश्नों की जाँच-पड़ताल कर रहे हैं जिनके विषय में मैंने तुम्हें लिखा है। उनसे मैं कहता हूँ: उन्हें शान्ति और अनुग्रह मिले।


    मैं तुम्हें और उन लोगों को नमस्कार भेजता हूँ जो भाई-बहनों के प्रेम से तुमसे प्रेम करते हैं।


    पुनरुत्थान पर ग्रन्थ'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध अंग्रेज़ी साक्ष्य में यह वाक्य अर्थ की दृष्टि से कुछ असामान्य है: बाँटने को लेकर चिन्तित न होने की बात के बाद कहा गया है कि यह सहायक हो सकता है। प्रत्यक्ष कॉप्टिक स्रोत-समीक्षा लंबित होने के कारण सम्भावित वैकल्पिक पाठ या आशय तय नहीं किया गया है।'
    reason: गenuine ambiguity और सम्भावित पाठगत/अनुवादगत तनाव को पारदर्शी रखना।
lexical_decisions:
- source_word: graciousness
  choice: कृपा
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के ‘graciousness’ को स्वाभाविक और धर्मवैचारिक रूप से अनावश्यक रूप से संकीर्ण किए बिना व्यक्त करता है।
- source_word: word
  choice: वचन
  rationale: ‘शब्द’ या ‘विषय’ की अपेक्षा धार्मिक-शिक्षात्मक सन्दर्भ को बनाए रखता है, पर इसका आशय किसी विशिष्ट धर्मसैद्धान्तिक पहचान तक सीमित नहीं करता।
- source_word: strengthen
  choice: दृढ़ कर सकती थी
  rationale: आत्मिक अथवा शिक्षात्मक पुष्टि—दोनों सम्भावनाओं को खुला रखता है।
- source_word: looking into
  choice: जाँच-पड़ताल कर रहे हैं
  rationale: प्रश्नों पर विचार, खोज या अनुसन्धान के व्यापक अर्थ को सहज हिन्दी में रखता है।
- source_word: love of brothers and sisters
  choice: भाई-बहनों के प्रेम
  rationale: समुदायगत पारिवारिक स्नेह को लिंग-समावेशी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Treatise on the Resurrection
  choice: पुनरुत्थान पर ग्रन्थ
  rationale: रचना के औपचारिक शीर्षक और उसके विषय—पुनरुत्थान—दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: ‘my [] Lord’ में पाण्डुलिपीय रिक्ति
  choice: अपने [] प्रभु
  alternative: रिक्ति का अनुमान लगाकर कोई विशेषण जोड़ना
  rationale: प्रत्यक्ष कॉप्टिक समीक्षा उपलब्ध न होने और साक्ष्य में रिक्ति होने के कारण क्षति/पुनर्स्थापन संकेत को यथावत रखा गया है।
- issue: ‘the word’ का आशय
  choice: वचन
  alternative: सन्देश / धर्मवचन / लोगोस
  rationale: स्रोत-समीक्षा लंबित होने के कारण सम्भावित सामान्य और धर्मवैचारिक अर्थों को कृत्रिम रूप से निर्णीत नहीं किया गया।
- issue: ‘Peace be to them, and grace’
  choice: उन्हें शान्ति और अनुग्रह मिले
  alternative: उन पर शान्ति और अनुग्रह हो
  rationale: आशीर्वचन का भाव बनाए रखते हुए आधुनिक, गरिमापूर्ण हिन्दी अपनाई गई है।
- issue: साझा करने वाले वाक्य का सम्भावित तनाव
  choice: निकट-औपचारिक अनुवाद और व्याख्यात्मक पादटिप्पणी
  alternative: इसे स्पष्ट निषेध या स्पष्ट प्रोत्साहन में बदल देना
  rationale: ‘चिन्तित मत हो’, ‘किसी के साथ बाँटना’ और ‘क्योंकि यह सहायक हो सकता है’ के बीच उपलब्ध साक्ष्य में सम्भावित अर्थगत तनाव है; इसे चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठकों के लिए सुबोध। उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर यह अनुवाद अस्थायी है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग कोष्ठकों में दिए पाण्डुलिपीय क्षति या पुनर्स्थापन संकेत सुरक्षित रखे गए हैं। रचना के शीर्षक के बाद की वेबसाइट FAQ, सम्पर्क और विज्ञापन सामग्री को प्राचीन ग्रन्थ का भाग न मानकर शामिल नहीं किया गया।
