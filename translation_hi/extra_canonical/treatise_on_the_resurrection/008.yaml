id: TRES.008
reference: Treatise on the Resurrection — The Resurrection is Real
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'There are some, however, who in the course of their investigation, wish to understand if one who is saved, when discarding the body, will be saved immediately. Let none doubt concerning this. [...]. In fact, the visible limbs that are dead [] shall not be saved, for (in that case) the living [limbs] that exist in them would rise.


    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'There are some, however, who in the course of their investigation, wish to understand if one who is saved, when discarding the body, will be saved immediately. Let none doubt concerning this. [...]. In fact, the visible limbs that are dead [] shall not be saved, for (in that case) the living [limbs] that exist in them would rise.


    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: hi
  text: 'फिर भी कुछ लोग अपनी जाँच-पड़ताल के दौरान यह समझना चाहते हैं कि जो व्यक्ति बचाया गया है, क्या वह शरीर को त्यागते ही तुरंत बचा लिया जाएगा। इस विषय में कोई संदेह न करे। […]। वास्तव में, जो दिखाई देनेवाले अंग मर चुके हैं, वे बचाए नहीं जाएँगे, क्योंकि तब उनके भीतर मौजूद जीवित [अंग] जी उठते।


    तो फिर पुनरुत्थान क्या है? यह जी उठे लोगों का निरंतर प्रकट होना है। क्योंकि यदि तुम्हें सुसमाचार में पढ़ी हुई यह बात याद है कि एलिय्याह दिखाई दिया और उसके साथ मूसा भी, तो पुनरुत्थान को भ्रम मत समझो। यह भ्रम नहीं, बल्कि वास्तविकता है! वास्तव में, यह कहना अधिक सही होगा कि संसार एक भ्रम है, बजाय यह कहने के कि वह पुनरुत्थान भ्रम है जो हमारे प्रभु और उद्धारकर्ता यीशु मसीह के द्वारा घटित हुआ है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saved / salvation language
  choice: बचाया गया / बचा लिया जाएगा / बचाए नहीं जाएँगे
  rationale: साक्ष्य में एक ही उद्धार-संबंधी क्रिया की पुनरावृत्ति को बनाए रखते हुए सामान्य, स्पष्ट हिन्दी चुनी गई; ‘उद्धार पाया’ की अपेक्षा यह क्रियात्मक और सहज है।
- source_word: discarding the body
  choice: शरीर को त्यागते ही
  rationale: देह से अलग होने के अर्थ को स्वाभाविक हिन्दी में रखा गया और ‘immediately’ को ‘ही तुरंत’ की अनावश्यक पुनरुक्ति से बचाते हुए ‘त्यागते ही तुरंत’ के बजाय ‘त्यागते ही तुरंत’ नहीं, वाक्य में समय-संबंध स्पष्ट किया गया।
- source_word: visible limbs
  choice: दिखाई देनेवाले अंग
  rationale: ‘limbs’ को व्यापक ‘अंग’ के रूप में रखा गया, क्योंकि प्रसंग केवल हाथ-पैर तक सीमित नहीं है।
- source_word: resurrection
  choice: पुनरुत्थान
  rationale: आधुनिक हिन्दी के धार्मिक-साहित्यिक प्रयोग में स्थापित शब्द है और ‘जी उठना’ से संज्ञात्मक भेद स्पष्ट रखता है।
- source_word: continuing revelation
  choice: निरंतर प्रकट होना
  rationale: अर्थ को सहज हिन्दी में व्यक्त किया गया; ‘प्रकाशन’ यहाँ पुस्तक या सैद्धांतिक प्रकाशना का भ्रामक संकेत दे सकता था।
- source_word: illusion / reality
  choice: भ्रम / वास्तविकता
  rationale: मूल साक्ष्य के तीखे विरोध को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया।
- source_word: has come to pass through
  choice: के द्वारा घटित हुआ है
  rationale: माध्यम/कर्तृत्व की संभावित अस्पष्टता को हल किए बिना अंग्रेज़ी साक्ष्य की संरचना को निकटता से रखा गया।
theological_decisions:
- issue: शरीर त्यागने पर तत्काल उद्धार
  choice: प्रश्न और उसके बाद का आश्वासन ज्यों का त्यों रखा गया
  alternative: इसे तत्काल देह-विहीन स्वर्गारोहण या अंतिम पुनरुत्थान के किसी विशिष्ट सिद्धांत के रूप में स्पष्ट करना
  rationale: खंडित प्रसंग किसी एक व्यवस्थित धर्मवैज्ञानिक निष्कर्ष को निश्चित नहीं करता; इसलिए तनाव को नहीं सुलझाया गया।
- issue: मृत दिखाई देनेवाले अंगों और भीतर के जीवित अंगों का संबंध
  choice: ‘उनके भीतर मौजूद जीवित [अंग]’ रखा गया
  alternative: इसे आत्मा, आध्यात्मिक शरीर या सूक्ष्म अंग कहकर पहचान देना
  rationale: साक्ष्य स्वयं ऐसी स्पष्ट पहचान नहीं देता; कोष्ठकीय पुनर्स्थापन भी बनाए रखा गया।
- issue: ‘निरंतर प्रकट होना’ के रूप में पुनरुत्थान
  choice: असामान्य परिभाषा को बिना सिद्धांतगत सामान्यीकरण के सुरक्षित रखा गया
  alternative: ‘जी उठना’ या ‘मृतकों का फिर जीवित होना’ के रूप में सरल करना
  rationale: लेख का विशिष्ट कथन और उससे जुड़ी धर्मवैज्ञानिक अस्पष्टता अनुवाद में बनी रहनी चाहिए।
- issue: एलिय्याह और मूसा का प्रकट होना
  choice: इसे पुनरुत्थान की वास्तविकता के लेखक के उदाहरण के रूप में यथावत रखा गया
  alternative: रूपांतरण की घटना को दर्शन, प्रतीक या अंतिम पुनरुत्थान से अलग बताने वाली व्याख्या जोड़ना
  rationale: अनुवाद को लेखक के तर्क को प्रस्तुत करना है, उसका सामंजस्यकारी विवेचन नहीं।
- issue: संसार को भ्रम कहना
  choice: तुलनात्मक दावे को स्पष्ट रूप से बनाए रखा गया
  alternative: ‘संसार क्षणभंगुर है’ कहकर कथन को नरम करना
  rationale: मूल साक्ष्य ‘illusion’ के प्रबल विरोध का उपयोग करता है; इसे धर्मवैज्ञानिक असुविधा के कारण कमज़ोर नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। मूल में दिए […] तथा पुनर्स्थापित [अंग] जैसे पाठ-संकेत सुरक्षित रखे गए हैं। खाली [] संभवतः पाठ-क्षति का अनिर्दिष्ट संकेत था; हिन्दी मुख्य पाठ में असहज रिक्त कोष्ठक न दोहराकर वाक्य का प्रमाणित पठनीय अंश रखा गया है।
