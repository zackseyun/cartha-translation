id: TRES.004
reference: Treatise on the Resurrection — The Spiritual Resurrection
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/004.yaml
  text: Then, as the apostle truly said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” If we live visibly in this world, we wear this world. We are his radiant beams, and we remain with him until our setting—that is, our death in this life. Through him we are drawn to heaven, like rays drawn by the sun, with nothing holding us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
translation:
  language: hi
  text: तब, जैसा कि प्रेरित ने सचमुच कहा, “हमने उसके साथ दुःख सहा, हम उसके साथ जी उठे, और हम उसके साथ स्वर्ग पर चढ़े।” अब यदि हम इस संसार में दिखाई देते हुए जीते हैं, तो हम इस संसार को वस्त्र की तरह पहने हुए हैं। हम उसकी दीप्तिमान किरणें हैं, और अपने अस्त होने तक—अर्थात इस जीवन में अपनी मृत्यु तक—उसके साथ बने रहते हैं। उसी के द्वारा हम स्वर्ग की ओर खींचे जाते हैं, जैसे सूर्य अपनी किरणों को खींचता है; कोई भी वस्तु हमें रोक नहीं सकती। यही आत्मिक पुनरुत्थान है, [a] जो शरीर के समान प्राण को भी निगल लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि में पाठ क्षतिग्रस्त है या एक अंश पुनर्स्थापित नहीं किया जा सका है।
    reason: स्रोत-साक्षी में दिए गए खाली वर्ग कोष्ठक पांडुलिपीय रिक्ति को चिह्नित करते हैं; मुख्य पाठ में marker जोड़कर इसे पाठक के लिए स्पष्ट किया गया है।
lexical_decisions:
- source_word: we wear this world
  choice: हम इस संसार को वस्त्र की तरह पहने हुए हैं
  rationale: वस्त्र धारण करने के मूल रूपक को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: radiant beams
  choice: दीप्तिमान किरणें
  rationale: प्रकाश और सूर्य-किरण के विस्तारित रूपक को बनाए रखता है।
- source_word: our setting
  choice: अपने अस्त होने तक
  rationale: सूर्य और किरणों के रूपक से जुड़ा ‘अस्त होना’ सुरक्षित है; अगला स्पष्टीकरण इसे मृत्यु से स्पष्ट करता है।
- source_word: spiritual resurrection
  choice: आत्मिक पुनरुत्थान
  rationale: ‘आत्मिक’ यहाँ भौतिक पुनरुत्थान के विपरीत या उससे संबंधित आध्यात्मिक आयाम को खुला रखता है; ‘पुनरुत्थान’ धार्मिक और साहित्यिक संदर्भ में सुबोध है।
- source_word: soul
  choice: प्राण
  rationale: ‘प्राण’ व्यक्ति के अभौतिक जीवन/आत्म-तत्त्व का संकेत देता है और ‘आत्मिक’ के साथ अनावश्यक शब्द-पुनरावृत्ति से बचाता है; अर्थ को किसी विकसित दार्शनिक परिभाषा तक सीमित नहीं करता।
- source_word: swallowing up
  choice: निगल लेता है
  rationale: साक्षी के प्रबल और संभवतः धर्मवैचारिक रूप से तनावपूर्ण रूपक को नरम किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: मसीह के साथ दुःख सहने, जी उठने और स्वर्ग चढ़ने की कालगत स्थिति
  choice: तीनों को पूर्ण क्रियाओं के रूप में प्रस्तुत किया गया है
  alternative: इन्हें केवल भावी प्रतिज्ञा या प्रतीकात्मक अनुभव के रूप में स्पष्ट करना
  rationale: साक्षी इन्हें प्रेरित के कथन के रूप में पूर्ण घटनाओं की भाषा में रखता है; अनुवाद उस तनाव को बिना व्याख्यात्मक समाधान के बनाए रखता है।
- issue: आत्मिक पुनरुत्थान का प्राण और शरीर को ‘निगलना’
  choice: अस्पष्ट और तीखा रूपक ज्यों का त्यों रखा गया है
  alternative: ‘रूपांतरित करता है’, ‘जीवन देता है’ या ‘अपने में समा लेता है’
  rationale: वैकल्पिक पद धर्मवैचारिक अर्थ को पहले ही तय कर देंगे, जबकि उपलब्ध साक्षी ‘swallowing up’ कहता है।
- issue: किरणों का सूर्य द्वारा खींचा जाना
  choice: उसी के द्वारा… जैसे सूर्य अपनी किरणों को खींचता है
  alternative: हम स्वयं सूर्य की ओर ऊपर उठते हैं
  rationale: मूल साक्षी में कर्ता ‘वह’ है और तुलना में सूर्य है; अनुग्रह, आकर्षण या एकत्व की विशिष्ट व्याख्या नहीं थोपी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। सूर्य, किरण, वस्त्र और अस्त होने के परस्पर जुड़े रूपक सुरक्षित रखे गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है।
