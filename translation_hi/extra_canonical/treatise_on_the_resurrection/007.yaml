translation:
  language: hi
  text: 'इसलिए, हे मेरे पुत्र रेगिनोस, पुनरुत्थान के विषय में कभी संदेह मत करना! क्योंकि यदि तुम पहले देह में जीवित नहीं थे, तो इस संसार में प्रवेश करते समय तुमने देह धारण की।


    फिर जब तुम (लौटकर) ऐयोन[a] में ऊपर उठोगे, तो देह क्यों न धारण करोगे? जो देह से उत्तम है, वही जीवन देता है। जो तुम्हारे लिए अस्तित्व में आया, क्या वह तुम्हारा नहीं है? और जो तुम्हारा है, क्या वह तुम्हारे साथ विद्यमान नहीं है? फिर भी, जब तुम इस संसार में हो, तो तुम्हें किस बात की कमी है? यही वह बात है जिसे खोजने के लिए तुम इतना अधिक प्रयत्न करते रहे हो।


    देह की अपरा[b] बुढ़ापा है, और तुम नश्वरता की दशा में हो। जिस बात की तुम्हें कमी है, वही लाभ है; क्योंकि यदि तुम यहाँ से चले जाओ, तो जो सर्वोत्तम है उसे नहीं खोओगे। जो निकृष्टतर है वह क्षीण होता है, पर उसके लिए अनुग्रह है।


    इसलिए कोई भी वस्तु हमें इस संसार से छुड़ा नहीं सकती। परन्तु हम ही समग्रता[c] हैं; इसलिए हम बचाए गए हैं। हमने आरम्भ से अन्त तक उद्धार पा लिया है। हम इसी प्रकार विचार करें। हम इसी प्रकार समझें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऐयोन’ यूनानी मूल का शब्द है। यहाँ यह सामान्य कालखंड के बजाय एक पारलौकिक युग या क्षेत्र का संकेत दे सकता है।
    reason: तकनीकी शब्द का अर्थ ‘युग’ कहकर समय तक सीमित न हो जाए।
  - marker: b
    text: ‘अपरा’ जन्म के बाद बाहर आने वाला ऊतक है। यहाँ बुढ़ापे के लिए प्रयुक्त जन्म-संबंधी रूपक को शाब्दिक रूप में रखा गया है।
    reason: असामान्य रूपक को स्पष्ट करना और उसकी कठिनता सुरक्षित रखना।
  - marker: c
    text: ‘समग्रता’ उस पूर्ण दिव्य अथवा पारलौकिक वास्तविकता के लिए प्रयुक्त तकनीकी पद हो सकता है जिसे अंग्रेज़ी साक्ष्य ‘the All’ कहता है।
    reason: पद को सामान्य ‘सब कुछ’ या ‘सभी लोग’ समझे जाने से बचाना।
lexical_decisions:
- source_word: flesh
  choice: देह
  rationale: ‘देह’ शारीरिक अस्तित्व और धारण किए जाने वाले शरीर—दोनों अर्थों को गरिमापूर्ण, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: aeon
  choice: ऐयोन
  rationale: यहाँ शब्द सम्भवतः केवल सामान्य ‘युग’ नहीं, बल्कि एक विशिष्ट पारलौकिक क्षेत्र को सूचित करता है; इसलिए इसे लिप्यंतरित कर टिप्पणी दी गई है।
- source_word: afterbirth
  choice: अपरा
  rationale: मूल साक्ष्य की जन्म-संबंधी तीखी उपमा को सामान्यीकृत किए बिना सुरक्षित रखने के लिए शाब्दिक चिकित्सकीय शब्द चुना गया है।
- source_word: the All
  choice: समग्रता
  rationale: लेख के दार्शनिक-पारलौकिक तकनीकी भाव को व्यक्त करने के लिए ऐसा शब्द चुना गया है जो केवल ‘सब लोग’ का अर्थ न दे।
- source_word: redeem
  choice: छुड़ा सकती
  rationale: वाक्य में संसार से मुक्ति का क्रियात्मक भाव प्रमुख है; ‘छुड़ाना’ इसे सहज हिन्दी में रखता है, जबकि अगले वाक्यों में ‘उद्धार’ धार्मिक संज्ञा के रूप में बना रहता है।
theological_decisions:
- issue: ऐयोन में आरोहण के समय देह धारण करने का कथन
  choice: 'प्रश्न को उसी स्पष्ट तनाव के साथ रखा गया है: ‘देह क्यों न धारण करोगे?’'
  alternative: इसे केवल आध्यात्मिक अथवा केवल भौतिक पुनरुत्थान के रूप में समझाकर अनूदित करना
  rationale: उपलब्ध साक्ष्य देह और ‘देह से उत्तम’ के बीच संबंध को जानबूझकर तनावपूर्ण रखता है; किसी विशिष्ट मत के अनुसार उसका समाधान करना उचित नहीं।
- issue: ‘हम ही समग्रता हैं; इसलिए हम बचाए गए हैं’ में कारण-संबंध
  choice: साक्ष्य के कोष्ठकीय ‘so’ को ‘इसलिए’ के रूप में रखा गया है।
  alternative: दोनों कथनों को बिना कारण-संबंध के अलग रखना
  rationale: अंग्रेज़ी साक्ष्य कारणार्थक संबंध प्रस्तुत करता है, यद्यपि कोष्ठक उसके संपादकीय अथवा पुनर्निर्मित स्वरूप का संकेत देते हैं। हिन्दी में कथन को प्रवाहपूर्ण रखते हुए यह संबंध सुरक्षित किया गया है।
- issue: ‘जिस बात की तुम्हें कमी है, वही लाभ है’ का अर्थ
  choice: विरोधाभासी कथन को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: ‘देह का छूटना तुम्हारा लाभ है’ जैसे स्पष्टार्थक पुनर्लेखन
  rationale: उपलब्ध साक्ष्य में ‘कमी’ का आशय अनिश्चित है; उसे निश्चित कर देना वास्तविक अस्पष्टता मिटा देता।
- issue: उद्धार की कालगत पूर्णता
  choice: ‘हमने आरम्भ से अन्त तक उद्धार पा लिया है’
  alternative: ‘हम आरम्भ से अन्त तक उद्धार पाएँगे’
  rationale: साक्ष्य प्राप्त उद्धार को पूर्ण घटना के रूप में कहता है; भविष्यकाल करने से उसका धार्मिक और कालगत बल बदल जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण उपदेशात्मक स्वर रखा गया है। ‘रेगिनोस’ नाम और ‘ऐयोन’ तकनीकी पद के रूप में लिप्यंतरित हैं। साक्ष्य के ‘(return and)’ को ‘(लौटकर)’ के रूप में कोष्ठक सहित सुरक्षित रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण विशेषतः ‘अपरा’, ‘समग्रता’, कारणार्थक ‘इसलिए’, और देह-संबंधी पदावली को आगे स्रोत-परीक्षण की आवश्यकता है।
