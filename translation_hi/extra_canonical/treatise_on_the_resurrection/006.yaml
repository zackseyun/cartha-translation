id: TRES.006
reference: Treatise on the Resurrection — Chosen for Salvation
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: hi
  text: जिनका उद्धार हुआ है, उनके विचार नष्ट नहीं होंगे। जिन्होंने (उद्धार को) जाना है, उनका मन नष्ट नहीं होगा। इसलिए हमें उद्धार और छुटकारे के लिए चुना गया, क्योंकि आरम्भ ही से यह पहले से ठहराया गया था कि हम अज्ञानियों की मूर्खता में न पड़ें, बल्कि सत्य को जानने वालों की बुद्धि में प्रवेश करें। जिस सत्य को वे सँभालकर रखते हैं, वह वास्तव में न तो खो सकता है और न कभी खोएगा। परिपूर्णता की व्यवस्था शक्तिशाली है। जो अलग होकर जगत बन गया, वह निर्बल है। परन्तु सर्वसमग्र वही है जो सुरक्षित रखा गया है। वह अस्तित्व में नहीं [] आया; वह पहले से ही था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: चौकोर कोष्ठक [] पाण्डुलिपि में क्षति या अनिश्चित रिक्त स्थान का संकेत देते हैं। यह हिन्दी प्रारूप उपलब्ध सार्वजनिक-अधिकार अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी बाकी है।
    reason: पाण्डुलिपि की भौतिक/पाठीय अनिश्चितता और वर्तमान मसौदे की स्रोत-सीमा पाठक के सामने स्पष्ट रखना आवश्यक है।
lexical_decisions:
- source_word: salvation
  choice: उद्धार
  rationale: धार्मिक संदर्भ में स्वाभाविक और व्यापक हिन्दी पद; कोष्ठक में मूल साक्ष्य की स्पष्टता-अनिश्चितता बनाए रखी गई है।
- source_word: redemption
  choice: छुटकारा
  rationale: ‘उद्धार’ से भेद बनाए रखते हुए मुक्ति या छुड़ाए जाने का भाव साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Fullness
  choice: परिपूर्णता
  rationale: संभावित पारिभाषिक ब्रह्माण्ड-विज्ञान संबंधी अर्थ को सामान्य ‘पूर्णता’ में विलीन किए बिना एक विशिष्ट संज्ञा के रूप में रखा गया है।
- source_word: the All
  choice: सर्वसमग्र
  rationale: सिर्फ ‘सब कुछ’ के बजाय एक पारिभाषिक समग्र सत्ता/वास्तविकता का संकेत सुरक्षित रखता है।
- source_word: system
  choice: व्यवस्था
  rationale: मूल साक्ष्य के संरचना, क्रम या तंत्र संबंधी व्यापक अर्थ को अनावश्यक तकनीकी कठोरता के बिना व्यक्त करता है।
- source_word: broke loose
  choice: अलग होकर
  rationale: विच्छेद के भाव को सुरक्षित रखता है, पर यह तय नहीं करता कि अलगाव विद्रोह, पतन या स्वतः विभाजन था।
- source_word: preserved
  choice: सुरक्षित रखा गया
  rationale: संरक्षित बने रहने के कर्मवाच्य भाव को बनाए रखता है; संरक्षक की पहचान नहीं जोड़ता।
theological_decisions:
- issue: पूर्वनिर्धारण और मानवीय प्रवेश का संबंध
  choice: ‘पहले से ठहराया गया था’ और ‘प्रवेश करें’ दोनों रखे गए
  alternative: इसे केवल ईश्वरीय चुनाव या केवल मानवीय निर्णय के रूप में स्पष्ट करना
  rationale: पाठ में चुनाव/पूर्वनिर्धारण और ज्ञान में प्रवेश दोनों साथ हैं; किसी एक मत के पक्ष में तनाव समाप्त नहीं किया गया।
- issue: ‘परिपूर्णता’ और ‘सर्वसमग्र’ का स्वरूप
  choice: दोनों को विशिष्ट पारिभाषिक अभिव्यक्तियों की तरह प्रस्तुत किया
  alternative: उन्हें सीधे परमेश्वर, कलीसिया, सृष्टि या ब्रह्माण्ड के रूप में पहचानना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य ऐसी निश्चित पहचान नहीं देता।
- issue: जगत की उत्पत्ति का वर्णन
  choice: ‘जो अलग होकर जगत बन गया’
  alternative: ‘जो गिरकर संसार बना’ या ‘जिसे रचा गया’
  rationale: पतन अथवा सृष्टि का अतिरिक्त धर्मवैज्ञानिक ढाँचा आरोपित किए बिना स्रोत की अस्पष्टता रखी गई।
- issue: अन्तिम वाक्य का कर्ता
  choice: निकटतम पारिभाषिक पद ‘सर्वसमग्र’ को कर्ता माना
  alternative: ‘परिपूर्णता’ या ‘जगत’ को कर्ता मानना
  rationale: अंग्रेज़ी साक्ष्य में ‘The All’ निकटतम स्पष्ट कर्ता है, यद्यपि पाण्डुलिपि-क्षति के कारण वाक्यांश सावधानी से पढ़ा जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। ‘परिपूर्णता’ और ‘सर्वसमग्र’ जैसे संभावित पारिभाषिक शब्दों को अलग रखा गया है। स्रोत-साक्ष्य में एकवचन ‘mind’ होने के कारण ‘उनका मन’ चुना गया; विचार और मन के बीच मूल पुनरुक्ति भी बनाए रखी गई है।
