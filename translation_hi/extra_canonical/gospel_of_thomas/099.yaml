base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/099.yaml
  text: The disciples said to him[a], "Your brothers and your mother are standing outside." He said to them, "Those here who do the will of my Father—these are my brothers and my mother[f][e][d][c][b]. They are the ones who will enter the kingdom of my Father."
translation:
  language: hi
  text: '**कहावत 99**


    चेलों ने उससे कहा, “तुम्हारे भाई और तुम्हारी माँ बाहर खड़े हैं।”[a] उसने उनसे कहा, “यहाँ जो लोग मेरे पिता की इच्छा पूरी करते हैं,[b][c] वे ही मेरे भाई और मेरी माँ हैं। वे ही मेरे पिता के राज्य में प्रवेश करेंगे।”[d][e][f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में इस वाक्यांश का अधिक शाब्दिक रूप लगभग ‘वे उनके सामने, बाहर खड़े हैं’ है। ‘उनके सामने’ संभवतः अनावश्यक पुनरुक्ति या पाठगत विशेषता है; मुख्य पाठ में सहज हिन्दी के लिए ‘बाहर खड़े हैं’ रखा गया है।
    reason: dialect_note
  - marker: b
    text: ‘यहाँ’ (ⲡⲉⲓⲙⲁ) का शाब्दिक अर्थ ‘इस स्थान में’ है।
    reason: lexical_alternative
  - marker: c
    text: ‘इच्छा’ के लिए आया ⲟⲩⲱϣ ‘चाह’, ‘अभिलाषा’ या ‘संकल्प’ भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘प्रवेश करेंगे’ का अधिक शाब्दिक रूप ‘अंदर जाएँगे’ है।
    reason: lexical_alternative
  - marker: e
    text: ‘राज्य’ (ⲙⲛⲧⲣⲣⲟ) ‘राजा’ शब्द से बना भाववाचक रूप है; इसका आशय राज्य या राजकीय शासन हो सकता है।
    reason: cultural_note
  - marker: f
    text: 'तुलना करें: मरकुस 3:31–35; मत्ती 12:46–50; लूका 8:19–21। थोमा के इस कथन में यह अतिरिक्त वाक्य है कि वे पिता के राज्य में प्रवेश करेंगे।'
    reason: cross_reference
lexical_decisions:
- source_word: ⲥⲛⲏⲩ
  choice: भाई
  rationale: साहिदिक कॉप्टिक में यह सामान्यतः पुरुष सहोदरों के लिए प्रयुक्त होता है। व्यापक अर्थ ‘भाई-बहन’ संभव है, पर यहाँ पारिवारिक संबोधन के रूप में ‘भाई’ अधिक सीधा है।
- source_word: ⲙⲁⲁⲩ
  choice: माँ
  rationale: यह ‘माँ’ के लिए सामान्य शब्द है; आधुनिक हिन्दी में स्वाभाविक और आत्मीय रूप रखा गया है।
- source_word: ⲁϩⲉⲣⲁⲧⲟⲩ / ⲛⲧⲟⲟⲩⲱϩ … ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: बाहर खड़े हैं
  rationale: वाक्य वर्तमान स्थिति और बाहरी स्थान दोनों बताता है। ‘बाहर खड़े हैं’ हिन्दी में इन्हें संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲡⲉⲓⲙⲁ
  choice: यहाँ
  rationale: शाब्दिक अर्थ ‘इस स्थान में’ है। ‘यहाँ’ निकटता-सूचक भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ⲉⲓⲣⲉ ⲛⲡⲟⲩⲱϣ
  choice: इच्छा पूरी करते हैं
  rationale: मुहावरे का अर्थ पिता की इच्छा के अनुसार कार्य करना है। ‘इच्छा पूरी करना’ हिन्दी में स्वाभाविक है और ⲟⲩⲱϣ के ‘इच्छा/अभिलाषा/संकल्प’ अर्थक्षेत्र को खुला रखता है।
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: मेरे पिता
  rationale: प्रथम पुरुष एकवचन संबंध को यथावत रखा गया है; इसे सामान्यीकृत करके केवल ‘पिता’ नहीं किया गया।
- source_word: ⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: प्रवेश करेंगे
  rationale: मूल अभिव्यक्ति का शाब्दिक भाव ‘अंदर जाएँगे’ है। ‘प्रवेश करेंगे’ वर्तमान हिन्दी में संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: राज्य
  rationale: यह ‘राजा’ से बना भाववाचक शब्द है और राजत्व, शासन या राज्य का संकेत दे सकता है। पारंपरिक तथा सुबोध समतुल्य ‘राज्य’ रखा गया है।
theological_decisions:
- issue: जैविक परिवार और पिता की इच्छा पूरी करने वालों के बीच संबंध
  choice: ‘वे ही मेरे भाई और मेरी माँ हैं’
  alternative: ‘वे मेरे सच्चे भाई और मेरी सच्ची माँ हैं’
  rationale: मूल में ‘सच्चे’ नहीं है। उसे जोड़ने से जैविक परिवार के निषेध का अर्थ अनावश्यक रूप से अधिक स्पष्ट हो जाता; इसलिए मूल कथन का तनाव बनाए रखा गया है।
- issue: पिता के राज्य में प्रवेश करने वालों की पहचान
  choice: पूर्ववर्ती समूह की ओर संकेत करते हुए ‘वे ही’
  alternative: प्रवेश को सभी लोगों के विषय में सामान्य कथन बनाना
  rationale: कॉप्टिक सर्वनाम निकटतम उल्लिखित समूह—पिता की इच्छा पूरी करने वालों—की ओर संकेत करता है। अनुवाद इस संबंध को रखता है, पर प्रवेश की व्यापक धर्मशास्त्रीय शर्तों पर अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल शैली रखी गई है। संबोधन में ‘तेरे/तेरी’ मूल प्रसंग की सीधी निकटता व्यक्त करता है; वर्णनकर्ता के लिए ‘उससे/उसने’ प्रयोग किया गया है। ‘चेलों’ सामान्य पाठक के लिए सहज है, जबकि वाक्य-विन्यास मूल की समानांतर पारिवारिक संरचना को बनाए रखता है।
