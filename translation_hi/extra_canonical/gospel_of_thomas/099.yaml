review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Sahidic sequence: the disciples report that Jesus'' brothers and mother are outside; he identifies those present who do his Father''s will as his brother(s) and mother; and the final pronoun refers to that group as those who will enter his Father''s kingdom. The deictic force of ⲡⲉⲓⲙⲁ (''here/in this place''), the first-person possessive in ''my Father,'' and the future sense of entering are retained. The manuscript''s awkward/redundant ''before them/outside'' element is responsibly confined to a note.'
  naturalness: The Hindi is clear and idiomatic overall. However, ‘तेरे/तेरी’ introduces an unmarked informal singular address that the Coptic possessive does not specify. ‘तुम्हारे/तुम्हारी’ is equally direct, modern-standard, and more register-neutral in a public scripture translation.
  terminology: ‘चेलों,’ ‘इच्छा पूरी करते हैं,’ ‘पिता,’ ‘राज्य,’ and ‘प्रवेश करेंगे’ are suitable and consistent. ‘राज्य’ appropriately retains the source term's range without imposing a doctrinal interpretation.
  issues:
  - severity: low
    issue: Unwarranted informal second-person address
    rationale: The source marks only second-person singular possession, not an informal Hindi social register. Replacing ‘तेरे भाई और तेरी माँ’ with ‘तुम्हारे भाई और तुम्हारी माँ’ avoids adding a register nuance while preserving the singular addressee and natural speech.
