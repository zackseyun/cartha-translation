base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/003.yaml
  text: Jesus says[a], "If those who lead you say to you, 'Look, the kingdom is in the sky,' then the birds of the sky will precede you. If they say to you, 'It is in the sea,' then the fish will precede you. Rather, the kingdom is inside you and it is outside you. When you come to know yourselves, then you will be known, and you will realize that you are the children of the living Father. But if you do not know yourselves[b], you are in poverty[i][h][g][f][e][d][c], and you are poverty."
translation:
  language: hi
  text: '**कथन 3**


    यीशु ने कहा, “यदि तुम्हारी अगुवाई करने वाले[a] तुमसे कहें, ‘देखो, राज्य आकाश[b] में है,’ तो आकाश के पक्षी तुमसे पहले पहुँच जाएँगे। यदि वे तुमसे कहें, ‘वह समुद्र में है,’ तो मछलियाँ तुमसे पहले पहुँच जाएँगी। बल्कि, राज्य तुम्हारे भीतर भी है और तुम्हारे बाहर भी। जब तुम अपने आप को जान लोगे, तब तुम्हें जाना जाएगा[c], और तुम समझोगे कि तुम जीवित पिता की संतानें हो[d]। पर यदि तुम अपने आप को नहीं जानते, तो तुम अभाव में हो, और तुम ही अभाव हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘अगुवाई करने वाले’: कॉप्टिक ⲥⲱⲕ का अर्थ ‘खींचना’, ‘ले चलना’ या ‘अगुवाई करना’ हो सकता है। यहाँ ‘भटकाना’ स्पष्ट रूप से नहीं कहा गया है।'
    reason: lexical_alternative
  - marker: b
    text: ‘आकाश’ के स्थान पर ‘स्वर्ग’ भी अनुवाद किया जा सकता है। पक्षियों का उल्लेख यहाँ ठोस अर्थ ‘आकाश’ का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: मूल में शाब्दिक रूप से अनिश्चित बहुवचन है—‘वे तुम्हें जानेंगे’। यह कर्ता का नाम बताए बिना कर्मवाच्य अर्थ व्यक्त कर सकता है।
    reason: dialect_note
  - marker: d
    text: मूल पांडुलिपि में ‘संतानें/बच्चे’ का बहुवचन रूप है, यद्यपि दिए गए सामान्यीकृत पाठ में इसे एकवचन कर दिया गया है। यहाँ पांडुलिपि के बहुवचन को प्राथमिकता दी गई है।
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: राज्य
  rationale: यह शब्द राजत्व, शासन या राज्य-क्षेत्र का बोध करा सकता है। ‘राज्य’ सहज हिन्दी है और स्रोत की व्यापक अर्थ-सीमा को पर्याप्त रूप से खुला रखता है।
- source_word: ⲥⲱⲕ ϩⲏⲧⲛⲧⲱⲧⲛ
  choice: तुम्हारी अगुवाई करने वाले
  rationale: ⲥⲱⲕ का मूल अर्थ खींचना, ले चलना या अगुवाई करना है। स्रोत में ‘भटकाना’ स्पष्ट नहीं है, इसलिए तटस्थ अभिव्यक्ति चुनी गई।
- source_word: ⲡⲉ / ⲧⲡⲉ
  choice: आकाश
  rationale: पक्षियों के ठोस चित्र के साथ ‘आकाश’ स्वाभाविक है; ‘स्वर्ग’ भी भाषिक रूप से संभव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: ⲛⲡⲉⲧⲛϩⲟⲩⲛ / ⲛⲡⲉⲧⲛⲃⲟⲗ
  choice: तुम्हारे भीतर / तुम्हारे बाहर
  rationale: दोनों स्थानवाचक अभिव्यक्तियों की समानांतरता और उनकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: ⲥⲟⲟⲩⲛ ⲛⲧⲱⲧⲛ
  choice: अपने आप को जानना
  rationale: यह आत्म-ज्ञान की सीधी अभिव्यक्ति है; ‘पहचानना’ भी संभव है, पर ‘जानना’ स्रोत की पुनरावृत्ति को बेहतर बनाए रखता है।
- source_word: ⲙⲛⲧϩⲏⲕⲉ
