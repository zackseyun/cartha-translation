base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
translation:
  language: hi
  text: '**कथन 16**


    यीशु ने कहा, “शायद लोग सोचते हैं कि मैं संसार पर शांति डालने आया हूँ। पर वे नहीं जानते कि मैं धरती पर फूट डालने आया हूँ—आग, तलवार और युद्ध। क्योंकि एक घर में पाँच होंगे: तीन दो के विरुद्ध और दो तीन के विरुद्ध; पिता पुत्र के विरुद्ध और पुत्र पिता के विरुद्ध।[a] और वे एकाकी जन बनकर खड़े होंगे।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'तुलना करें: लूका 12:51–53; मत्ती 10:34–35।'
    reason: cross_reference
  - marker: b
    text: “एकाकी जन” के पीछे यूनानी मूल का शब्द *मोनाखोस* है। इसका अर्थ “अकेला” या “एकल” व्यक्ति हो सकता है; यहाँ इसे बाद के अर्थ “भिक्षु” या “मठवासी” के रूप में समझना आवश्यक नहीं है।
    reason: lexical_and_historical_note
lexical_decisions:
- source_word: ⲧⲁⲭⲁ
  choice: शायद
  rationale: यह यूनानी मूल का शब्द यहाँ लोगों की अनुमानपूर्ण धारणा व्यक्त करता है; आधुनिक हिन्दी में “शायद” उसका स्वाभाविक और सटीक रूप है।
- source_word: ⲛⲟⲩϫⲉ
  choice: डालने
  rationale: मूल क्रिया का अर्थ “फेंकना/डालना” है। “डालना” हिन्दी में शांति और फूट—दोनों के साथ एक ही क्रिया को बनाए रखता है और मूल के जानबूझकर रखे गए विरोधाभास को बिना अत्यधिक अस्वाभाविक हुए व्यक्त करता है।
- source_word: ⲡⲱⲣϫ
  choice: फूट
  rationale: शब्द अलगाव या विभाजन को सूचित करता है। पारिवारिक विरोध के संदर्भ में “फूट” सामान्य पाठक के लिए स्वाभाविक है और संबंध-विच्छेद की तीव्रता बनाए रखता है।
- source_word: ⲕⲟⲥⲙⲟⲥ / ⲕⲁϩ
  choice: संसार / धरती
  rationale: मूल में पहले “संसार” और फिर “धरती” के लिए अलग शब्द हैं; हिन्दी में यह भेद सुरक्षित रखा गया है।
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: खड़े होंगे
  rationale: कॉप्टिक मुहावरे का सामान्य अर्थ अपने पैरों पर खड़ा होना है; हिन्दी में “खड़े होंगे” पर्याप्त और स्वाभाविक है।
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: एकाकी जन
  rationale: यूनानी आगंतुक शब्द का यहाँ “अकेला/एकल व्यक्ति” अर्थ संभव है। “एकाकी जन” उस अर्थ को रखता है और बाद के संस्थागत अर्थ “भिक्षु/संन्यासी” को पाठ में आरोपित नहीं करता।
theological_decisions:
- issue: ⲙⲟⲛⲁⲭⲟⲥ का आशय
  choice: एकाकी जन
  alternative: भिक्षु; अकेले लोग; एकचित्त जन
  rationale: मूल शब्द में अकेलेपन या एकलता का भाव है, पर यह स्पष्ट नहीं करता कि आशय सामाजिक एकाकीपन, आध्यात्मिक अखंडता या दोनों से है। इसलिए मुख्य पाठ में “एकाकी जन” रखा गया है और किसी विकसित मठवासी व्यवस्था अथवा विशिष्ट आध्यात्मिक सिद्धांत को निश्चित नहीं माना गया।
- issue: शांति और फूट को “डालना”
  choice: दोनों के लिए एक ही क्रिया “डालना”
  alternative: शांति लाना और फूट डालना
  rationale: मूल दोनों विपरीत वस्तुओं के साथ एक ही क्रिया दोहराता है। वही क्रिया बनाए रखने से कथन का विरोधाभासी तनाव सुरक्षित रहता है।
- issue: आग, तलवार और युद्ध का व्याकरणिक संबंध
  choice: फूट के बाद व्याख्यात्मक सूची
  alternative: फूट से पृथक तीन अतिरिक्त कर्म
  rationale: मूल में संक्षिप्त, संयोजक-विहीन सूची है। डैश सूची को फूट के ठोस रूपों या उससे संबद्ध तत्वों के रूप में पढ़ने देता है, पर संबंध को लंबी व्याख्या द्वारा आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर कथन की गंभीर और सूक्तिपरक लय बनाए रखी गई है। “संसार/धरती,” “तीन दो के विरुद्ध,” और “पिता पुत्र के विरुद्ध” जैसे समानांतर विन्यास मूल की संरचना को निकटता से रखते हैं। “डालना” ने मूल की दोहराई हुई क्रिया को स्वाभाविक हिन्दी में सुरक्षित किया है।
