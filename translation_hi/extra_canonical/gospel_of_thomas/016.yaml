  source_fidelity: 'The Hindi accurately represents the Sahidic text: ⲧⲁⲭⲁ as “शायद”; the repeated ⲛⲟⲩϫⲉ with the same Hindi verb “डालना”; the contrast between संसार (ⲕⲟⲥⲙⲟⲥ) and धरती (ⲕⲁϩ); the sequence “आग, तलवार और युद्ध”; and the essential numerical pattern of five in one house, three against two and two against three. “एकाकी जन” is a suitably non-anachronistic rendering of ⲙⲟⲛⲁⲭⲟⲥ and does not resolve its semantic range beyond the source.'
