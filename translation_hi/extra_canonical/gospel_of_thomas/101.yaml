base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/101.yaml
  text: Whoever does not hate his father and his mother as I do cannot become my disciple[a]; and whoever does not love his father and his mother as I do cannot become my disciple. For my mother [...][c], but my true[b] [mother] gave me life.
translation:
  language: hi
  text: जो कोई अपने पिता और अपनी माता से मेरी तरह घृणा नहीं करता, वह मेरा शिष्य नहीं बन सकता[a]; और जो कोई अपने पिता और अपनी माता से मेरी तरह प्रेम नहीं करता, वह मेरा शिष्य नहीं बन सकता। क्योंकि मेरी माता ने [...][b], पर मेरी सच्ची [माता][c] ने मुझे जीवन दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरी तरह’ का शाब्दिक भाव ‘मेरे ढंग से’ या ‘मेरे समान’ (ⲛ̄ⲧⲁϩⲉ) है।
    reason: lexical_alternative
  - marker: b
    text: पांडुलिपि यहाँ क्षतिग्रस्त है (ⲛ̄ⲧⲁⲥ̣[.........] [..]ⲟ̣ⲗ̣)। कुछ विद्वान लुप्त शब्दों को लगभग ‘मुझे मृत्यु के लिए जन्म दिया’ या ‘मुझे असत्य दिया’ मानते हैं, पर पाठ निश्चित नहीं है।
    reason: textual_damage
  - marker: c
    text: ‘सच्ची’ का शाब्दिक अर्थ ‘सत्य की’ (ⲙ̄ⲙⲉ) है; पांडुलिपि में दूसरी बार ‘माता’ शब्द संदर्भ से समझा जाता है।
    reason: lexical_and_ellipsis
lexical_decisions:
- source_word: ⲙⲉⲥⲧⲉ
  choice: घृणा करना
  rationale: यह ‘घृणा करना’ का मानक साहिदिक क्रियापद है; कथन की कठोरता को नरम किए बिना सुरक्षित रखा गया है।
- source_word: ⲙⲣ̄ⲣⲉ
  choice: प्रेम करना
  rationale: यह ⲙⲉ (‘प्रेम करना’) का स्टेटस कन्स्ट्रक्टस रूप है और पहले वाक्य के ‘घृणा’ से स्पष्ट विरोध बनाता है।
- source_word: ⲛ̄ⲧⲁϩⲉ
  choice: मेरी तरह
  rationale: इसका शाब्दिक भाव ‘मेरे ढंग से’ अथवा ‘मेरे समान’ है। ‘मेरी तरह’ स्वाभाविक हिन्दी में वास्तविक अस्पष्टता बनाए रखता है कि तुलना भाव से है या आचरण से।
- source_word: ϣ ... ⲁⲛ
  choice: नहीं बन सकता
  rationale: सामर्थ्यसूचक सहायक क्रिया और निषेध का अर्थ ‘नहीं कर सकता/बन सकता’ है।
- source_word: ⲙ̄ⲙⲉ
  choice: सच्ची
  rationale: शाब्दिक रूप से ‘सत्य की’; यहाँ यह ‘माता’ को विशेषित करते हुए ‘सच्ची माता’ का अर्थ देता है।
- source_word: ⲱⲛϩ
  choice: जीवन
  rationale: यह ‘जीवन’ का मानक साहिदिक संज्ञा-रूप है।
theological_decisions:
- issue: जैविक माता और ‘सच्ची माता’ के बीच विरोध
  choice: ‘मेरी माता’ और ‘मेरी सच्ची [माता]’ का विरोध यथावत रखा गया है, पर सच्ची माता की पहचान नहीं बताई गई।
  alternative: ‘सच्ची माता’ को पवित्र आत्मा, दिव्य बुद्धि या किसी अन्य विशिष्ट सत्ता के रूप में स्पष्ट करना।
  rationale: पांडुलिपि केवल ‘सच्ची’ अथवा ‘सत्य की’ माता कहती है; किसी खास धर्मवैज्ञानिक पहचान को अनुवाद में जोड़ना स्रोत से आगे जाना होगा।
- issue: क्षतिग्रस्त खंड में जैविक माता के विषय में कथन
  choice: रिक्त स्थान को [...] के रूप में रखा गया है।
  alternative: ‘मुझे मृत्यु के लिए जन्म दिया’ या ‘मुझे असत्य दिया’ जैसी विद्वत पुनर्रचना अपनाना।
  rationale: पांडुलिपि यहाँ गंभीर रूप से क्षतिग्रस्त है और उपलब्ध अक्षर किसी एक पुनर्रचना को निर्णायक नहीं बनाते।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमामय शैली रखी गई है। ‘घृणा’ और ‘प्रेम’ के तीखे विरोध को मूल के अनुसार बनाए रखा गया है। क्षतिग्रस्त पाठ को अनुमान से नहीं भरा गया, और ‘सच्ची माता’ की धर्मवैज्ञानिक पहचान खुली छोड़ी गई है।
