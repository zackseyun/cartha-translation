base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/078.yaml
  text: 'Jesus said[a], "What did you go out into the wilderness to see? A reed shaken by the wind? And a person in soft clothing, with garments put on him? Look: those in soft clothing are in the house of your king and your magnate[f][e][d][c][b], and they are not able to know the truth."'
translation:
  language: hi
  text: यीशु ने कहा, “तुम निर्जन प्रदेश[a] में क्या देखने निकले थे? हवा से हिलता हुआ सरकंडा? और ऐसा व्यक्ति, जिसे मुलायम वस्त्र[b] पहनाए गए हों—तुम्हारे राजा और तुम्हारे बड़े अधिकारी[c][d][e] जैसा? देखो, जिन लोगों को मुलायम वस्त्र पहनाए गए हैं, वे सत्य को जान[f] नहीं सकेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲥⲱϣⲉ का अनुवाद “उजाड़,” “जंगल” या “रेगिस्तान” भी किया जा सकता है। यहाँ “निर्जन प्रदेश” चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: ⲛϣⲧⲏⲛ वस्त्रों की कोमलता बताता है; “महीन वस्त्र” या “नाज़ुक वस्त्र” भी संभव हैं।
    reason: lexical_alternative
  - marker: c
    text: इस वाक्यांश की पांडुलिपि क्षतिग्रस्त है। दिए गए सामान्यीकृत पाठ को “तुम्हारे राजा और तुम्हारे बड़े अधिकारी जैसा” समझा गया है; एक अन्य पुनर्निर्माण बहुवचन “तुम्हारे राजाओं … जैसे” का संकेत देता है, और अंग्रेज़ी परामर्श-पाठ इसे “तुम्हारे राजा और बड़े अधिकारी के घर में” समझता है।
    reason: lacuna_or_restoration
  - marker: d
    text: “बड़ा अधिकारी” यूनानी से आए कॉप्टिक शब्द ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ का अनुवाद है; “प्रतिष्ठित व्यक्ति,” “उच्च पदाधिकारी” या “प्रभावशाली व्यक्ति” भी संभव हैं।
    reason: lexical_alternative
  - marker: e
    text: सामान्यीकृत कॉप्टिक पाठ में “तुम्हारा राजा” और “तुम्हारा बड़ा अधिकारी” एकवचन हैं; क्षतिग्रस्त पांडुलिपि के प्रस्तावित पाठ में “राजाओं” का बहुवचन मिलता है। मुख्य पाठ सामान्यीकृत रूप का एकवचन बनाए रखता है।
    reason: textual_ambiguity
  - marker: f
    text: “सत्य को जानना” का अनुवाद “सत्य को पहचानना” या “सत्य को समझना” भी हो सकता है; कॉप्टिक क्रिया के अर्थ व्यापक हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ … ⲉⲛⲁⲩ
  choice: क्या देखने
  rationale: प्रश्न यहाँ बाहर जाने के कारण के बजाय देखी जाने वाली वस्तु पूछता है; इसलिए स्वाभाविक हिन्दी में “क्या देखने”।
- source_word: ⲡⲥⲱϣⲉ
  choice: निर्जन प्रदेश
  rationale: शब्द का अर्थ जंगल, उजाड़ या मरुस्थलीय क्षेत्र हो सकता है। “निर्जन प्रदेश” आधुनिक हिन्दी में व्यापक अर्थ रखता है और रेत वाले रेगिस्तान तक सीमित नहीं करता।
- source_word: ⲟⲩⲕⲁϣ
  choice: सरकंडा
  rationale: प्रसंग में हवा से हिलने वाला लंबा जलीय या वनस्पतीय तना अभिप्रेत है; “सरकंडा” हिन्दी में स्पष्ट और मुहावरेदार है।
- source_word: ⲕⲓⲙ … ϩⲓⲧⲛⲡⲧⲏⲩ
  choice: हवा से हिलता हुआ
  rationale: मूल में हवा प्रेरक शक्ति है। “हिलता हुआ” तटस्थ है और “झकझोरा हुआ” जैसी अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: ⲟⲩⲣⲱⲙⲉ
  choice: व्यक्ति
  rationale: कॉप्टिक शब्द सामान्य मनुष्य को सूचित कर सकता है; “व्यक्ति” अनावश्यक रूप से केवल पुरुष होने का अर्थ नहीं जोड़ता।
- source_word: ⲛϣⲧⲏⲛ
  choice: मुलायम वस्त्र
  rationale: शब्द वस्त्र की कोमलता बताता है; “महीन” भी संभव है, पर वह बुनावट या गुणवत्ता की ओर अर्थ मोड़ सकता है।
- source_word: ϭⲛⲟⲛ ϩⲓⲛⲧⲟϥ / ϭⲛⲟⲛ ϩⲓⲛⲧⲟⲟⲩ
  choice: पहनाए गए हों / पहनाए गए हैं
  rationale: मूल की ठोस परिभाषात्मक रचना को रखा गया है, जिसमें वस्त्र किसी पर चढ़ाए या पहनाए गए हैं।
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: बड़ा अधिकारी
  rationale: यूनानी आगंतुक शब्द किसी उच्च पदस्थ या प्रभावशाली व्यक्ति को दर्शाता है। “बड़ा अधिकारी” सामान्य पाठक के लिए सहज है और कोई विशिष्ट ऐतिहासिक पद नहीं थोपता।
- source_word: ϣⲥⲟⲟⲩⲛ ⲡⲙⲉ
  choice: सत्य को जान
  rationale: क्रिया जानने, समझने या पहचानने के अर्थ दे सकती है। “जानना” सबसे सीधा है और मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: मुलायम वस्त्र पहने लोगों और सत्य के ज्ञान के बीच कथन का संबंध
  choice: स्पष्ट निष्कर्ष या नैतिक व्याख्या जोड़े बिना सीधा विरोध बनाए रखा गया।
  alternative: इसे धन, राजसत्ता या विलासिता की स्पष्ट निंदा के रूप में विस्तार देना।
  rationale: मूल कथन तीखा संबंध स्थापित करता है, पर उसका कारण नहीं बताता। अनुवाद को उस धार्मिक और सामाजिक तनाव को स्वयं हल नहीं करना चाहिए।
- issue: क्षतिग्रस्त पंक्ति में राजा और बड़े अधिकारी से तुलना या स्थान का संबंध
  choice: उपलब्ध सामान्यीकृत पाठ ⲛⲡϩⲉ को रीति/समानता के अर्थ में लेकर “तुम्हारे राजा और तुम्हारे बड़े अधिकारी जैसा” किया गया।
  alternative: अंग्रेज़ी परामर्श-पाठ के अनुसार “तुम्हारे राजा और बड़े अधिकारी के घर में”।
  rationale: दिए गए सामान्यीकृत कॉप्टिक में ⲡϩⲉ ‘ढंग/रीति’ का समर्थन करता है, जबकि पांडुलिपि भी इस स्थान पर क्षतिग्रस्त है। इसलिए स्थानवाचक ‘घर’ को मुख्य पाठ में आयात नहीं किया गया; अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। छोटे आलंकारिक प्रश्न मूल की तीक्ष्ण शैली बनाए रखते हैं। “सरकंडा,” “मुलायम वस्त्र,” “राजा,” “बड़ा अधिकारी” और “सत्य” सामान्य पाठक के लिए स्पष्ट शब्द हैं। क्षतिग्रस्त पाठ को अनावश्यक रूप से निश्चित नहीं बनाया गया और किसी संप्रदायगत व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
