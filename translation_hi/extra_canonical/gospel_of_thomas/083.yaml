base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
translation:
  language: hi
  text: यीशु ने कहा, “प्रतिरूप मनुष्यजाति[a] के सामने प्रकट हैं, पर उनके भीतर का प्रकाश पिता के प्रकाश के प्रतिरूप में छिपा है। वह प्रकट होगा[b], और उसका प्रतिरूप उसके प्रकाश द्वारा छिपा हुआ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से एकवचन ‘मनुष्य’ या ‘मानव’ है, जो यहाँ समस्त मानवजाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: 'कॉप्टिक पुल्लिंग सर्वनाम का संबंध ‘पिता’ या ‘प्रकाश’—दोनों में से किसी से हो सकता है, क्योंकि दोनों संज्ञाएँ पुल्लिंग हैं। इसलिए इसका अर्थ यह भी हो सकता है: ‘वह प्रकाश प्रकट होगा, और उसका प्रतिरूप उसके प्रकाश द्वारा छिपा हुआ है।’'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ⲛϩⲓⲕⲱⲛ
  choice: प्रतिरूप
  rationale: यूनानी मूल के इस शब्द का अर्थ दृश्य छवि, रूप या प्रतिरूप हो सकता है। ‘प्रतिरूप’ आगे आने वाले पिता के प्रकाश और उसके प्रतिरूप के संबंध को बनाए रखता है।
- source_word: ⲥⲉⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: प्रकट हैं
  rationale: यह स्थैतिक रूप दृश्य या प्रत्यक्ष होने की अवस्था बताता है; ‘प्रकट हैं’ बाद के ‘छिपा है’ और ‘प्रकट होगा’ के विरोध को सुरक्षित रखता है।
- source_word: ⲙ̄ⲡⲣⲱⲙⲉ
  choice: मनुष्यजाति के सामने
  rationale: एकवचन ‘मनुष्य/मानव’ यहाँ सामूहिक अर्थ में प्रयुक्त है। संबंधसूचक रूप को संदर्भानुसार ‘के सामने’ से व्यक्त किया गया है।
- source_word: ϩⲏⲡ⳿ / ϩⲱⲡ
  choice: छिपा है / छिपा हुआ है
  rationale: स्थैतिक रूप वर्तमान छिपी हुई अवस्था को व्यक्त करता है, भविष्य की क्रिया को नहीं।
- source_word: ϭⲱⲗⲡ⳿ ⲉⲃⲟⲗ
  choice: प्रकट होगा
  rationale: यहाँ क्रिया का अकर्मक अर्थ ‘प्रकट होना’ है और यह कथन में छिपे तथा प्रकट के जानबूझकर रखे गए विरोध को बनाए रखता है।
theological_decisions:
- issue: ‘वह प्रकट होगा’ में पुल्लिंग सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘वह…उसका…उसके’ रखा गया है, जिससे निकटवर्ती ‘पिता’ संभावित संदर्भ बनता है।
  alternative: 'सर्वनाम ‘प्रकाश’ की ओर भी संकेत कर सकता है: ‘वह प्रकाश प्रकट होगा, और उसका प्रतिरूप उसके प्रकाश द्वारा छिपा हुआ है।’'
  rationale: कॉप्टिक में ‘पिता’ और ‘प्रकाश’ दोनों पुल्लिंग संज्ञाएँ हैं, इसलिए व्याकरण दोनों संदर्भों की अनुमति देता है। मुख्य पाठ कोई अतिरिक्त व्याख्या नहीं जोड़ता और पाद-टिप्पणी वास्तविक अस्पष्टता बताती है।
- issue: ‘प्रतिरूप’ और ‘प्रकाश’ के संबंध की व्याख्या
  choice: ‘पिता के प्रकाश के प्रतिरूप में’ जैसी स्रोत-समीप संरचना रखी गई है।
  alternative: इसे व्याख्यात्मक रूप से ‘पिता के प्रकाशमय प्रतिरूप में’ या ‘पिता के प्रकाश की छवि में’ कहा जा सकता था।
  rationale: मूल कथन का संबंध जानबूझकर गूढ़ है; अधिक सहज व्याख्यात्मक अनुवाद उसकी धर्मवैचारिक अनिश्चितता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। ‘छिपा’ और ‘प्रकट’ की पुनरावृत्ति मूल के केंद्रीय विरोध को बनाए रखती है। ‘प्रतिरूप’ को पूरे कथन में एकरूप रखा गया है; रहस्यात्मक वाक्य-संरचना को किसी विशिष्ट सम्प्रदायगत व्याख्या से स्पष्ट नहीं किया गया।
