  terminology: ‘प्रतिरूप,’ ‘प्रकाश,’ ‘पिता,’ ‘प्रकट,’ and ‘छिपा’ are consistently used and preserve the source’s key image/light and concealed/revealed vocabulary. The pronoun ambiguity is not resolved in the main text and is clearly, accurately explained in footnote b. Footnote anchors correspond to the claims they support.
