  yaml_path: translation/extra_canonical/gospel_of_thomas/021.yaml
  text: 'Mary said to Jesus[a], "Whom are your disciples like?"


    He said, "They are like little children who have settled in a field that is not theirs. When the owners of the field come, they will say, ''Leave our field to us.'' They strip naked before them in order to leave it to them and give their field to them.


    "Therefore I say: If the master of the house knows that the thief is coming, he will keep watch before he comes and will not let him dig into his house of his kingdom to carry away his goods.


    "But you, keep watch against the world. Gird yourselves upon your loins with great power, so that the robbers will not find a way to come to you. Because the advantage you expect will be found.


    "Let there be among you a person of understanding. When the fruit ripened, he came quickly, his sickle in his hand; he harvested it. Whoever has ears to hear[b][c], let him hear."'
translation:
  language: hi
  text: 'मरियम ने यीशु से कहा, “आपके शिष्य किसके समान हैं?”


    उन्होंने कहा, “वे उन छोटे बच्चों के समान हैं जो एक ऐसे खेत में आ बसे हैं जो उनका नहीं है। जब खेत के मालिक आएँगे, तो वे कहेंगे, ‘हमारा खेत हमारे लिए छोड़ दो।’ तब बच्चे उनके सामने नंगे हो जाएँगे[a], ताकि वे उसे उनके लिए छोड़ दें और उनका खेत उन्हें दे दें।


    “इसलिए मैं कहता हूँ: यदि घर का स्वामी जानता हो कि चोर आ रहा है, तो वह उसके आने से पहले जागता रहेगा और उसे अपने राज्य के घर[b] में सेंध लगाने और वहाँ का सामान उठा ले जाने नहीं देगा।


    “पर तुम संसार से सावधान रहो। अपनी कमर बड़ी सामर्थ्य से कस लो, ताकि लुटेरों को तुम्हारे पास आने का रास्ता न मिले; क्योंकि जिस आवश्यकता की तुम प्रतीक्षा कर रहे हो, वह मिल जाएगी[c]।


    “तुम्हारे बीच एक समझदार व्यक्ति हो। जब फल पक गया, तो वह हाथ में हँसिया लिए तुरंत आया और उसे काट लिया। जिसके सुनने के कान हों, वह सुन ले।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक क्रिया का अर्थ ‘नंगा होना’ या ‘नंगा हो जाना’ है। यहाँ ‘उनके सामने’ का अर्थ उपस्थिति में है, कपड़ों के लिए प्रयुक्त कोई शब्द नहीं।
    reason: शाब्दिक अर्थ स्पष्ट करना और पांडुलिपि की असामान्य छवि सुरक्षित रखना।
  - marker: b
    text: 'शाब्दिक रूप से: ‘अपने राज्य के अपने घर में।’ यह असामान्य वाक्यांश समानान्तर सुसमाचार-कथनों के केवल ‘उसके घर’ से भिन्न है।'
    reason: पाठ की विशिष्टता और मूल की असहज संरचना बताना।
  - marker: c
    text: यहाँ प्रयुक्त यूनानी आगंतुक शब्द χρεία का अर्थ ‘आवश्यकता’, ‘जरूरत’, ‘कठिनाई’, ‘उपयोग’ या ‘लाभ’ हो सकता है। इसलिए पूरे वाक्य का ठीक आशय विवादित है।
    reason: वास्तविक शब्दार्थगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: ϭⲉⲗⲓⲧ
  choice: आ बसे हैं
  rationale: यह खेत में ठहरने, रहने या बस जाने का भाव देता है; ‘आ बसे’ अस्थायी अधिकार और वास्तविक निवास—दोनों को खुला रखता है।
- source_word: ⲕⲁⲕⲁϩⲏⲩ
  choice: नंगे हो जाएँगे
  rationale: क्रिया नग्न होने या अपने को नग्न करने का स्पष्ट अर्थ रखती है; इसे केवल ‘कपड़े उतारेंगे’ कहकर सीमित नहीं किया गया।
- source_word: ϣⲟϫⲧ
  choice: सेंध लगाकर
  rationale: घर में खोदकर या तोड़कर घुसने के संदर्भ में स्वाभाविक हिन्दी; मूल के ‘खोदने/भेदने’ के चोर-संबंधी भाव को रखता है।
- source_word: ⲭⲣⲉⲓⲁ
  choice: आवश्यकता
  rationale: यूनानी आगंतुक शब्द χρεία का मूल अर्थ आवश्यकता, जरूरत, उपयोग या लाभ हो सकता है; मुख्य पाठ में व्यापक और अपेक्षाकृत तटस्थ ‘आवश्यकता’ रखा गया है तथा अस्पष्टता पादटिप्पणी में बताई गई है।
- source_word: ⲡⲱϩ
  choice: पक गया
  rationale: फल के विषय में यह परिपक्व या पक जाने का अर्थ देता है।
- source_word: ϩⲁⲥ-
  choice: काट लिया
  rationale: हँसिए और पके फल की छवि में ‘काटना/फसल काटना’ है; एक फल के एकवचन संदर्भ में ‘उसे काट लिया’ सहज है।
- source_word: ⲣⲟⲉⲓⲥ ϩⲁⲧⲉϩⲏ ⲙ̄ⲡⲕⲟⲥⲙⲟⲥ
  choice: संसार से सावधान रहो
  rationale: आज्ञा में चौकसी और संसार के सम्मुख/विरुद्ध सतर्कता का भाव है; हिन्दी में संक्षिप्त और स्वाभाविक रूप चुना गया।
- source_word: ⲙⲟⲩⲣ ⲙ̄ⲙⲱⲧⲛ̄ ⲉϫⲛ̄ⲛⲉⲧⲛ̄ϯⲡⲉ
  choice: अपनी कमर ... कस लो
  rationale: शाब्दिक शारीरिक मुहावरे को हिन्दी के प्रचलित ‘कमर कसना’ में रखा गया, जबकि ‘बड़ी सामर्थ्य से’ मूल की शक्ति-सूचना बचाता है।
theological_decisions:
- issue: समानान्तर सिनॉप्टिक कथनों से सामंजस्य
  choice: अपने राज्य के घर
  alternative: अपने घर
  rationale: कॉप्टिक में ‘उसका घर’ और ‘उसका राज्य’ दोनों उपस्थित हैं। असामान्य अभिव्यक्ति को मत्ती या लूका के समानान्तर कथन के अनुसार सरल नहीं किया गया।
- issue: बच्चों का नग्न होना
  choice: उनके सामने नंगे हो जाएँगे
  alternative: अपने कपड़े उतार देंगे
  rationale: मूल क्रिया नग्न होने पर बल देती है और ‘उनके सामने’ अलग पदबंध है। संभावित थोमसी धार्मिक संकेत को न तो हटाया गया, न मुख्य पाठ में उसकी व्याख्या थोपी गई।
- issue: χρεία का अर्थ
  choice: आवश्यकता
  alternative: कठिनाई / लाभ
  rationale: शब्दार्थ विवादित है। मुख्य पाठ में व्यापक अर्थ चुना गया और अन्य वास्तविक संभावनाएँ पादटिप्पणी में सुरक्षित रखी गईं।
- issue: कटनी की छवि
  choice: फल पकने पर समझदार व्यक्ति तुरंत काटता है
  alternative: फल को अंतकालीन न्याय या आध्यात्मिक उपलब्धि के रूप में स्पष्ट करना
  rationale: मूल उपमा का धार्मिक आशय खुला छोड़ा गया; किसी विशेष व्याख्यात्मक परंपरा को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। यीशु के लिए आदरसूचक ‘आप’ और कथावाचक में ‘उन्होंने’ प्रयुक्त है, जबकि शिष्यों को सामूहिक संबोधन में मूल के बहुवचन के अनुरूप ‘तुम’ रखा गया है। खेत, सेंध, कमर कसने और हँसिए की ठोस छवियाँ बनाए रखी गई हैं; असामान्य ‘राज्य के घर’ को जानबूझकर सामान्य नहीं किया गया।
