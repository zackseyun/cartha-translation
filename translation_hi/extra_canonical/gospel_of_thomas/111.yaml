base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
translation:
  language: hi
  text: यीशु ने कहा, “आकाश और पृथ्वी तुम्हारे सामने लिपट जाएँगे, और जो जीवित जन से जीवन पाता है, वह मृत्यु को नहीं देखेगा।” क्या यीशु यह नहीं कहते[a], “जो अपने आपको पा लेता है[b], संसार उसके योग्य नहीं है”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पाठ अचानक तीसरे पुरुष में यीशु को एक बाहरी प्रमाण के रूप में उद्धृत करने लगता है। थोमा के सुसमाचार में ऐसी टिप्पणी अद्वितीय है; संभव है कि यह संकलनकर्ता की टिप्पणी या बाद की संपादकीय परत हो जो पाठ में सम्मिलित हो गई।
    reason: textual_variant
  - marker: b
    text: कॉप्टिक पदबंध का व्याकरणिक अर्थ ‘अपने आपको पा लेता है’ है, पर ‘अपने आपको अकेला पाता है’ की अनुगूँज भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱⲗ
  choice: लपेट दिए जाएँगे
  rationale: क्रिया का अर्थ ‘मोड़ना/लपेटना’ है और यहाँ आकाश तथा पृथ्वी के अंतकालीन रूप से लपेटे जाने का चित्र है। हिंदी में कर्मवाच्य इस ब्रह्मांडीय घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: तुम्हारे सामने
  rationale: यह पदबंध ‘उपस्थिति में/सामने’ का अर्थ देता है; बहुवचन संबोधन को ‘तुम्हारे’ से बनाए रखा गया है।
- source_word: ⲡⲉⲧⲟⲛϩ ⲉⲃⲟⲗ ϩⲛ̄ ⲡⲉⲧⲟⲛϩ
  choice: जो जीवित से जीवित है
  rationale: ‘जीवित से’ या ‘जीवित के कारण’ की स्रोतगत अस्पष्टता को कठोर पर समझने योग्य हिंदी में सुरक्षित रखा गया है; ‘जीवित’ को व्यक्तिवाचक बनाकर निश्चित धर्मवैज्ञानिक पहचान नहीं थोपी गई।
- source_word: ⲟⲩⲭ ϩⲟⲧⲓ
  choice: क्या ... नहीं
  rationale: यह सकारात्मक उत्तर की अपेक्षा करने वाला प्रश्नसूचक प्रयोग है।
- source_word: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ
  choice: अपने आपको पा लेता है
  rationale: रचना का प्रतिवाचक अर्थ ‘अपने आपको पाना’ है; ⲟⲩⲁⲁϥ में ‘अकेला’ की संभावित अनुगूँज को पादटिप्पणी में रखा गया है।
- source_word: ⲙ̄ⲡϣⲁ
  choice: योग्य नहीं है
  rationale: स्रोत का ‘योग्य होना’ अर्थ सीधे और गरिमापूर्ण हिंदी में व्यक्त होता है।
theological_decisions:
- issue: ‘जीवित’ की पहचान
  choice: जीवित
  alternative: जीवित जन / जीवित परमेश्वर
  rationale: स्रोत यह स्पष्ट नहीं करता कि संकेत पिता, जीवित यीशु या सामान्यतः दिव्य जीवन-स्रोत की ओर है; इसलिए किसी एक पहचान को आरोपित नहीं किया गया।
- issue: तीसरे पुरुष में ‘यीशु’ का अचानक उल्लेख
  choice: मुख्य पाठ में यथावत रखा
  alternative: इसे यीशु के कथन का निरंतर प्रथम-पुरुष भाग मानना या संपादकीय टिप्पणी हटाना
  rationale: पाठ अचानक यीशु को बाहरी प्रामाणिक वक्ता के रूप में उद्धृत करता है। संभावित संपादकीय परत की सूचना पादटिप्पणी में है, पर मुख्य पाठ से प्रमाणित सामग्री नहीं हटाई गई।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ब्रह्मांडीय और रहस्यात्मक भाषा को अनावश्यक व्याख्या से सरल नहीं किया गया। बहुवचन ‘तुम्हारे’ तथा पाठ के अचानक तीसरे पुरुष में बदलने को सुरक्षित रखा गया है।
