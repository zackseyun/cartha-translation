base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
translation:
  language: hi
  text: यीशु ने कहा[a], “जो खोजता है, वह पाएगा; और जो भीतर जाने के लिए खटखटाता है[b], उसके लिए खोला जाएगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में आरंभिक “यीशु ने कहा” का कुछ भाग क्षतिग्रस्त है और संपादकीय रूप से पुनर्निर्मित किया गया है।
    reason: lacuna_or_restoration
  - marker: b
    text: “भीतर जाने के लिए खटखटाता है” मूल में भीतर की ओर जाने का भाव बनाए रखता है; वहाँ “दरवाज़ा” शब्द नहीं है।
    reason: cultural_note
  - marker: c
    text: “खोला जाएगा” मूल के अवैयक्तिक बहुवचन को निष्क्रिय अर्थ में प्रस्तुत करता है। इसका अनुवाद “वे उसके लिए उसे खोलेंगे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: ⲡⲉϫⲉ ‘कहा’ और ⲓⲏⲥⲟⲩⲥ ‘यीशु’ को थोमा की सूक्तिपरक आरंभिक शैली के अनुरूप स्वाभाविक हिन्दी में रखा गया है।
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ ⲛⲧⲟϥⲛⲁϭⲓⲛⲉ
  choice: जो खोजता है, वह पाएगा
  rationale: सापेक्ष वर्तमान रचना एक सामान्य व्यक्ति को सूचित करती है और भविष्यसूचक ⲛⲁ- परिणाम बताता है; संक्षिप्त हिन्दी सूक्ति मूल की लय बनाए रखती है।
- source_word: ⲡⲉⲧⲉⲣⲉⲧⲱϩⲙ ⲉϩⲟⲩⲛ
  choice: जो भीतर जाने के लिए खटखटाता है
  rationale: ⲧⲱϩⲙ का अर्थ ‘खटखटाना’ है और ⲉϩⲟⲩⲛ भीतर की दिशा या प्रवेश का भाव देता है। ‘दरवाज़ा’ मूल में नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ⲛⲧⲟⲟⲩⲛⲁⲟⲩⲱⲛ ⲛⲁⲛⲧⲟϥ
  choice: उसके लिए खोला जाएगा
  rationale: तृतीय पुरुष बहुवचन यहाँ अवैयक्तिक निष्क्रिय अर्थ दे सकता है। हिन्दी का निष्क्रिय प्रयोग कर्ता और खुलने वाली वस्तु—दोनों को अनिर्दिष्ट रखता है।
theological_decisions:
- issue: खोलने वाले और खोली जाने वाली वस्तु की पहचान
  choice: 'दोनों को अनिर्दिष्ट रखा गया: ‘उसके लिए खोला जाएगा’'
  alternative: ‘वे उसके लिए उसे खोलेंगे’ अथवा ‘उसके लिए द्वार खोला जाएगा’
  rationale: मूल अवैयक्तिक बहुवचन का निष्क्रिय अर्थ संभव है और न कर्ता को स्पष्ट करता है, न ‘द्वार’ कहता है। इसलिए किसी विशिष्ट दैवी कर्ता या वस्तु को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूक्तिपरक शैली अपनाई गई है। ‘खोजता है/पाएगा’ मूल की सामान्य, कालातीत उक्ति को व्यक्त करता है। सभी पुनर्निर्माण और वास्तविक व्याकरणिक विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
