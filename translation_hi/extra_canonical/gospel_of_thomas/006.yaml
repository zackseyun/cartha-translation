base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/006.yaml
  text: 'His disciples questioned him and said to him[1], "Do you want us to fast? And how shall we pray? Shall we give alms? And what shall we observe concerning eating?"


    Jesus said, "Do not lie, and what you hate, do not do. For all things are revealed before heaven. For there is nothing hidden that will not be revealed[2], and nothing covered that will remain without being uncovered."'
translation:
  language: hi
  text: 'उसके शिष्यों ने उससे पूछा, “क्या तुम चाहते हो कि हम उपवास करें? हम किस प्रकार प्रार्थना करें? क्या हम दान दें? और आहार के विषय में हम किन बातों का पालन करें?”


    यीशु ने कहा, “झूठ मत बोलो, और जिस बात से तुम घृणा करते हो, उसे मत करो। क्योंकि सब कुछ आकाश के समक्ष प्रकट है।[a] ऐसा कुछ भी छिपा नहीं है जो प्रकट न होगा, और ऐसा कुछ भी ढका नहीं है जो बिना खोले रह जाएगा।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी खंड P.Oxy. 654 में “आकाश के समक्ष” के स्थान पर “सत्य के सामने” है।
    reason: textual_variant
  - marker: b
    text: 'यूनानी खंड P.Oxy. 654 में अंतिम वाक्यांश है: “और ऐसा कुछ भी गाड़ा हुआ नहीं है जो जिलाया न जाएगा।”'
    reason: textual_variant
lexical_decisions:
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ
  choice: उपवास करें
  rationale: यूनानी मूल से आया क्रियापद धार्मिक उपवास रखने को स्पष्ट रूप से व्यक्त करता है।
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
  choice: किस प्रकार
  rationale: शाब्दिक अर्थ ‘क्या रीति है’ है; आधुनिक हिन्दी में प्रश्नवाचक ढंग से ‘किस प्रकार’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ϯⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: दान दें
  rationale: यूनानी ऋणशब्द जरूरतमंदों को दान देने का संकेत करता है; ‘दान’ सामान्य हिन्दी में उपयुक्त है।
- source_word: ⲣⲡⲁⲣⲁⲧⲏⲣⲉⲓ
  choice: पालन करें
  rationale: यहाँ अर्थ किसी नियम या आचार को मानने/बरतने का है।
- source_word: ϭⲓⲛⲟⲩⲱⲙ
  choice: खाने-पीने के विषय में
  rationale: संज्ञात्मक पद भोजन, आहार या खाने की क्रिया को सूचित करता है; इसे कालवाचक ‘जब हम खाएँ’ न बनाकर विषयगत अर्थ रखा गया है। ‘खाने-पीने’ सामान्य हिन्दी में आहार-संबंधी व्यवहार को सहज रूप से व्यक्त करता है।
- source_word: ϫⲉϭⲟⲗ
  choice: झूठ मत बोलो
  rationale: संयुक्त अभिव्यक्ति का शाब्दिक अर्थ ‘झूठ बोलना’ है; हिन्दी में यही सीधा और सूक्तिपरक रूप है।
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ ⲛⲧⲡⲉ
  choice: आकाश के सामने
  rationale: यह सामान्य संयुक्त पूर्वसर्ग ‘के सामने/उपस्थिति में’ है; ⲧⲡⲉ को यहाँ ‘आकाश’ रखा गया है, न कि व्याख्यात्मक रूप से ‘स्वर्ग’।
- source_word: ϩⲏⲡ / ϩⲟⲃⲥ / ϭⲟⲗⲡ
  choice: छिपा / ढका / प्रकट-खोला
  rationale: मूल में छिपे होने और ढके होने की समानांतर पर अलग छवियाँ हैं; हिन्दी में यह भेद यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: कॉप्टिक ‘आकाश’ और यूनानी खंड ‘सत्य’ का पाठांतर
  choice: मुख्य पाठ में ‘आकाश के सामने’
  alternative: ‘सत्य के सामने’
  rationale: प्रदत्त मुख्य स्रोत कॉप्टिक है और उसमें ⲧⲡⲉ ‘आकाश/स्वर्ग’ है। यूनानी साक्षी का भिन्न पाठ पादटिप्पणी में रखा गया है।
- issue: कॉप्टिक ‘ढका/खोला’ और यूनानी ‘गाड़ा/जिलाया’ का अंतर
  choice: ऐसा कुछ भी ढका नहीं है जो बिना खोले रह जाएगा
  alternative: ऐसा कुछ भी गाड़ा नहीं है जो जिलाया न जाएगा
  rationale: कॉप्टिक पाठ प्रकाशन/उद्घाटन की छवि रखता है, जबकि यूनानी साक्षी पुनरुत्थान-सदृश भाषा देता है। मुख्य अनुवाद कॉप्टिक का अनुसरण करता है और यूनानी रूप को पादटिप्पणी में सुरक्षित रखता है।
- issue: ‘सब कुछ प्रकट है’ का काल
  choice: वर्तमान काल ‘प्रकट है’
  alternative: भविष्यकाल ‘प्रकट होगा’
  rationale: कॉप्टिक वाक्य में यह कथन वर्तमान रूप में है; अगले वाक्य का भविष्यकाल अलग रखा गया है।
- issue: यीशु के उत्तर का अनुष्ठान-संबंधी प्रश्नों से संबंध
  choice: उत्तर को ज्यों का त्यों रखा गया, कोई व्याख्यात्मक जोड़ नहीं
  alternative: इसे उपवास, प्रार्थना, दान और आहार के प्रत्यक्ष नियमों के रूप में स्पष्ट करना
  rationale: मूल में प्रश्नों और उत्तर के बीच तनाव है। अनुवाद उसे किसी धार्मिक परंपरा की व्याख्या से नहीं भरता।
