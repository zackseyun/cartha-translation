base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/093.yaml
  text: Do not give what is holy to the dogs[a], lest they throw them onto the dung-heap. Do not throw pearls to the pigs[f][e][d][c][b], lest they do it [...].
translation:
  language: hi
  text: जो पवित्र है, उसे कुत्तों को मत दो[a], कहीं ऐसा न हो कि वे उन्हें गोबर के ढेर पर फेंक दें[b]। मोती सूअरों के आगे मत फेंको, कहीं ऐसा न हो कि वे उसके साथ ऐसा करें […]।[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जो पवित्र है’ का शाब्दिक रूप ‘पवित्र [वस्तु]’ है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘गोबर का ढेर’ उस गोबर और कूड़े के ढेर को दर्शाता है जो गाँव के जीवन में सामान्य था। मूल शब्द यूनानी से लिया गया है।
    reason: cultural_note
  - marker: c
    text: पांडुलिपि में इसके बाद केवल ‘प्ला…’ अक्षर बचे हैं, फिर पाठ टूट जाता है। कुछ संपादक मत्ती 7:6 के आधार पर ‘रौंद डालें’ जैसी क्रिया का अनुमान करते हैं, पर वह शब्द पांडुलिपि में सुरक्षित नहीं है।
    reason: lacuna_or_restoration
  - marker: d
    text: मूल पाठ में पहले खंड का सर्वनाम बहुवचन (‘उन्हें’) है, यद्यपि ‘जो पवित्र है’ एकवचन है; दूसरे खंड में ‘मोती’ बहुवचन होने पर भी सर्वनाम एकवचन (‘उसके’) है। अनुवाद ने इस व्याकरणिक असंगति को बनाए रखा है।
    reason: textual_grammar
lexical_decisions:
- source_word: ⲡⲉⲧⲟⲩⲁⲁⲃ
  choice: जो पवित्र है
  rationale: यह विशेषण से बनी संज्ञात्मक अभिव्यक्ति है, जिसका शाब्दिक अर्थ ‘पवित्र [वस्तु]’ है। ‘जो पवित्र है’ इसकी अनिश्चितता और लोकोक्तिपरक स्वर बनाए रखता है।
- source_word: ⲛⲡⲟⲩϩⲟⲣ
  choice: कुत्तों को
  rationale: बहुवचन ‘कुत्ते’ को आधुनिक हिन्दी में सामान्य वर्ग के अर्थ में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲛⲟⲩⲛⲟⲩϫⲉⲛⲧⲟⲟⲩ
  choice: वे उन्हें … फेंक दें
  rationale: क्रिया का अर्थ ‘फेंकना’ है और पांडुलिपि में कर्म-प्रत्यय बहुवचन है; इसलिए निकटवर्ती एकवचन भाव के बावजूद ‘उन्हें’ रखा गया है।
- source_word: ⲕⲟⲡⲣⲓⲁ
  choice: गोबर का ढेर
  rationale: यह यूनानी से लिया गया शब्द है, जो गोबर अथवा गाँव के कूड़े-करकट के ढेर को सूचित करता है; ‘गोबर का ढेर’ ठोस और सहज हिन्दी है।
- source_word: ⲙⲡⲣⲛⲟⲩϫⲉ
  choice: मत फेंको
  rationale: निषेधात्मक आज्ञा और पहले खंड में प्रयुक्त उसी क्रिया की पुनरावृत्ति दोनों सुरक्षित रहती हैं।
- source_word: ⲛⲡⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: मोती
  rationale: यूनानी मूल का उधार लिया हुआ शब्द ‘मोती’ को सूचित करता है; प्रसंग में हिन्दी का बहुवचन रूप स्वाभाविक है।
- source_word: ⲛⲡⲉϣⲁⲩ
  choice: सूअरों के आगे
  rationale: मूल का अर्थ ‘सूअर’ है। ‘के आगे’ हिन्दी में किसी पशु के सामने वस्तु डालने की स्वाभाविक अभिव्यक्ति है और संबंध को अनावश्यक रूप से विशिष्ट नहीं करता।
- source_word: ⲉⲓⲣⲉ ⲛⲧⲟϥ
  choice: वे उसके साथ ऐसा करें
  rationale: खंडित पाठ में ‘करें’ और एकवचन सर्वनाम सुरक्षित हैं, पर आगे की क्रिया/पूरक नष्ट है। हिन्दी वाक्य को पठनीय रखते हुए ‘ऐसा करें’ लिया गया है और रिक्ति स्पष्ट छोड़ी गई है।
theological_decisions:
- issue: पवित्र वस्तु और मोतियों के प्रतीकात्मक अर्थ
  choice: किसी विशिष्ट शिक्षा, संस्कार या समुदाय से इनकी पहचान नहीं की गई
  alternative: इन्हें किसी निश्चित धार्मिक शिक्षा अथवा पवित्र अनुष्ठान का संकेत मानना
  rationale: कथन स्वयं प्रतीकों की व्याख्या नहीं करता; किसी संप्रदायगत अर्थ को जोड़ना स्रोत की वास्तविक खुली अर्थवत्ता को समाप्त कर देता।
- issue: खंडित अंतिम क्रिया
  choice: केवल सुरक्षित ‘ऐसा करें’ का भाव दिया और रिक्ति छोड़ी
  alternative: मत्ती 7:6 के प्रभाव से ‘रौंद डालें’ जोड़ना
  rationale: पांडुलिपि अनुमानित क्रिया को सुरक्षित नहीं रखती; समानांतर पाठ के आधार पर उसे भरना स्रोत से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘मत दो/मत फेंको’ लोकोक्तिपरक निषेध की तीक्ष्णता रखते हैं। ‘गोबर का ढेर’ ग्रामीण बिंब को स्पष्ट करता है। अंतिम रिक्ति को बिना अनुमान लगाए दृश्य रूप में बनाए रखा गया है।
