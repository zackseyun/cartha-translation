base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/040.yaml
  text: Jesus said[a], "A grapevine was planted outside the Father, and since it is not established[e][d][c][b], it will be uprooted from its root and will perish."
translation:
  language: hi
  text: यीशु ने कहा, “अंगूर की एक बेल[a] पिता के बाहर लगाई गई थी, और क्योंकि वह दृढ़ता से स्थापित नहीं है[b], उसे उसकी जड़ से[c] उखाड़ दिया जाएगा[d] और वह नष्ट हो जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह शब्द यूनानी ἄμπελος से लिया गया है। पांडुलिपि में इसका रूप नासिक्य अक्षर के बिना लिखा गया है, जो बोली अथवा वर्तनी की विशेषता है।
    reason: dialect_note
  - marker: b
    text: इसका अनुवाद “दृढ़ नहीं है,” “स्थिर नहीं है,” या प्रसंगानुसार “जड़ नहीं पकड़ती” भी किया जा सकता है। “स्थापित” मूल शब्द के व्यापक अर्थ को बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: “उसकी जड़ से” का अर्थ “उसकी जड़ पकड़कर” भी हो सकता है; मूल पूर्वसर्ग स्रोत अथवा अलगाव—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: d
    text: 'कॉप्टिक में शाब्दिक रूप से अनिर्दिष्ट बहुवचन कर्ता है: “वे उसे उखाड़ देंगे।” हिन्दी में इसे स्वाभाविक निष्क्रिय रूप में व्यक्त किया गया है।'
    reason: grammar_note
lexical_decisions:
- source_word: ⲟⲩⲃⲁⲡⲉⲗⲟⲟⲗⲉ
  choice: अंगूर की एक बेल
  rationale: यूनानी ἄμπελος से आए इस शब्द का आशय अंगूर की बेल है। केवल “बेल” कहने के बजाय कृषि-संबंधी विशिष्टता बनाए रखी गई है।
- source_word: ⲁⲩⲧⲟϭⲥ (ⲧⲱϭⲉ + -ⲥ)
  choice: लगाई गई थी
  rationale: ⲧⲱϭⲉ का मूल अर्थ रोपना या लगाना है। हिन्दी में बेल के लिए “लगाई गई थी” स्वाभाविक है और कॉप्टिक के अनिर्दिष्ट बहुवचन कर्ता को निष्क्रिय वाक्य से व्यक्त करता है।
- source_word: ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: के बाहर
  rationale: यह बाहरी स्थान को सूचित करने वाला पदबंध है। असामान्य कथन “पिता के बाहर” को किसी व्याख्यात्मक अर्थ में बदले बिना सुरक्षित रखा गया है।
- source_word: ⲡⲉⲓⲱⲧ
  choice: पिता
  rationale: स्रोत में निश्चित उपपद है और “मेरे” नहीं है। हिन्दी में उपाधि-सदृश “पिता” निश्चित संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲥⲧⲁϫⲣⲟ
  choice: दृढ़ता से स्थापित
  rationale: क्रिया में दृढ़ होने, स्थिर किए जाने या स्थापित होने का व्यापक भाव है। “जड़ नहीं पकड़ी” कृषि-संदर्भ में संभव है, पर वह स्रोत में स्पष्ट निहित जड़ की छवि को समय से पहले जोड़ देता।
- source_word: ⲛⲧⲟⲟⲩ + ⲛⲁ
  choice: उखाड़ दिया जाएगा
  rationale: स्रोत का तृतीय पुरुष बहुवचन अनिर्दिष्ट कर्ता के रूप में प्रयुक्त है। हिन्दी में निष्क्रिय रूप उस अनिर्दिष्ट कर्ता को बिना “लोग” जैसे नए संज्ञापद जोड़े स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ⲡⲱⲣⲕ
  choice: उखाड़ दिया जाएगा
  rationale: कृषि-संदर्भ में इस क्रिया का अर्थ जड़ से निकालना या उखाड़ना है।
- source_word: ϩⲁ ⲡⲉⲥⲛⲟⲩⲛⲉ
  choice: उसकी जड़ से
  rationale: ϩⲁ स्रोत या अलगाव का भाव दे सकता है; “जड़ से” हिन्दी में उसी अर्थ को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: ⲧⲁⲕⲟ
  choice: नष्ट हो जाएगी
  rationale: इसका अर्थ नाश होना, मिट जाना या विनष्ट होना है। “नष्ट हो जाएगी” सूक्तिपरक और गंभीर स्वर बनाए रखता है।
theological_decisions:
- issue: “पिता के बाहर” का आशय
  choice: पिता के बाहर
  alternative: पिता से अलग / पिता की इच्छा के बिना
  rationale: स्रोत स्थान-सूचक और जानबूझकर संक्षिप्त है। इसे संबंध-विच्छेद या इच्छा के विषय में स्पष्ट करना व्याख्या जोड़ता और कथन की वास्तविक अस्पष्टता घटाता।
- issue: बेल का दृढ़ न होना
  choice: वह दृढ़ता से स्थापित नहीं है
  alternative: उसने जड़ नहीं पकड़ी है
  rationale: कृषि-संदर्भ “जड़ पकड़ने” का संकेत दे सकता है, लेकिन स्रोत की क्रिया केवल जड़ जमाने तक सीमित नहीं है। व्यापक अर्थ रखने से धार्मिक या रूपकात्मक निष्कर्ष पहले से निर्धारित नहीं होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गंभीर और सूक्तिपरक रखी गई है। “पिता के बाहर” जैसी स्रोत की असामान्य अभिव्यक्ति को सहज बनाने के नाम पर धर्मवैचारिक व्याख्या में नहीं बदला गया। दोनों अनिर्दिष्ट बहुवचन क्रियाओं को हिन्दी के निष्क्रिय रूपों से व्यक्त किया गया है, जबकि वर्तमान स्थिति बताने वाले कॉप्टिक स्थैतिक रूप को “स्थापित नहीं है” रखा गया है।
