base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/056.yaml
  text: 'Jesus said: Whoever has come to know the world has found a corpse[a]; and whoever has found the corpse[c][b], the world is not worthy of him.'
translation:
  language: hi
  text: यीशु ने कहा, “जिसने संसार को जान लिया है, उसने एक शव[a] पाया है; और जिसने उस शव[b] को पाया है, संसार उसके योग्य नहीं है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले उल्लेख में मूल पाठ अनिश्चित रूप, अर्थात् “एक शव,” का प्रयोग करता है।
    reason: dialect_note
  - marker: b
    text: दूसरे उल्लेख में मूल पाठ निश्चित रूप, अर्थात् “उस शव,” का प्रयोग करता है और सम्भवतः पहले पाए गए उसी शव की ओर संकेत करता है।
    reason: textual_detail
  - marker: c
    text: 'तुलना करें: इब्रानियों 11:38—“संसार उनके योग्य न था।” यह कोई प्रत्यक्ष समानान्तर कथन नहीं, केवल विषयगत साम्य है।'
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: कथन आरम्भ करने वाला सामान्य आख्यानात्मक सूत्र है; हिन्दी का पूर्ण भूतकाल इसके कथात्मक और पूर्णतासूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲥⲟⲟⲩⲛ
  choice: जान लिया है
  rationale: यहाँ सापेक्ष रचना में प्राप्त या पूर्ण हुई जान-पहचान का भाव है; ‘जान लिया है’ उस परिणामसूचकता को ‘जानता है’ से अधिक स्पष्ट रखता है।
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: संसार
  rationale: यूनानी मूल का यह शब्द यहाँ सामान्यतः ‘world’ के अर्थ में है; ‘ब्रह्मांड’ अनावश्यक रूप से भौतिक या तकनीकी अर्थ ला सकता है।
- source_word: ϩⲉ
  choice: पाया
  rationale: मूल क्रिया का सीधा अर्थ ‘पाना’ है; यह कथन की संक्षिप्त और तीखी शैली बनाए रखता है।
- source_word: ⲟⲩⲡⲧⲱⲙⲁ / ⲡⲧⲱⲙⲁ
  choice: एक शव / उस शव
  rationale: पहली बार अनिश्चित और दूसरी बार निश्चित उल्लेख है। हिन्दी में ‘एक शव’ और फिर ‘उस शव’ उसी पूर्वसंदर्भ को स्वाभाविक और स्पष्ट रूप से सुरक्षित रखते हैं।
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: संसार उसके योग्य नहीं है
  rationale: यह ‘योग्य होना’ और ‘उसके’ वाली मूल मुहावरेदार रचना का निकट, गरिमापूर्ण हिन्दी रूप है।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: सरल संयोजक को बिना अतिरिक्त व्याख्यात्मक बल जोड़े सीधे रखा गया है।
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ …
  choice: जिसने …
  rationale: अनिश्चित सापेक्ष अर्थ को आधुनिक हिन्दी में स्वाभाविक ‘जिसने’ से व्यक्त किया गया है; अगली उपवाक्य-रचना इसके सामान्य आशय को स्पष्ट करती है।
theological_decisions:
- issue: ‘संसार’ और ‘शव’ के संबंध का अर्थ
  choice: रूपक की व्याख्या किए बिना मूल कथन की तीक्ष्णता और अस्पष्टता बनाए रखी गई।
  alternative: ‘संसार मरे हुए शरीर के समान है’ जैसे व्याख्यात्मक रूप में अनुवाद करना।
  rationale: मूल पाठ संसार को स्पष्ट उपमा द्वारा शव ‘के समान’ नहीं कहता, बल्कि जानने और शव पाने के बीच संक्षिप्त, तनावपूर्ण संबंध रखता है; अनुवाद में किसी विशिष्ट विश्व-दृष्टि को आरोपित नहीं किया जाना चाहिए।
- issue: ‘उसके योग्य’ का संदर्भ
  choice: पुल्लिंग एकवचन ‘उसके’ को उस व्यक्ति के संदर्भ में रखा गया जिसने शव पाया है।
  alternative: लिंग-निरपेक्ष बहुवचन या व्याख्यात्मक ‘ऐसे व्यक्ति के योग्य’ कहना।
  rationale: कॉप्टिक में एकवचन पुल्लिंग सर्वनाम है। हिन्दी का ‘उसके’ मूल व्याकरणिक रूप को बचाता है, जबकि कथन का सामान्य अनुप्रयोग सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लाश’ की अपेक्षा ‘शव’ मूल की कठोरता रखते हुए अधिक प्रकाशन-उपयुक्त है। वाक्य की असामान्य रूपकात्मक संरचना को समझाकर समतल नहीं किया गया।
