base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
translation:
  language: hi
  text: 'यीशु ने उनसे कहा, “यदि तुम उपवास करोगे, तो अपने लिए एक पाप उत्पन्न करोगे[a]; और यदि तुम प्रार्थना करोगे, तो तुम्हें दोषी ठहराया जाएगा[b]; और यदि तुम दान दोगे, तो अपनी आत्माओं का बुरा करोगे।


    “और यदि तुम किसी भी देश में जाओ और उसके प्रदेशों में यात्रा करो, और वे तुम्हें स्वीकार करें, तो जो कुछ वे तुम्हारे सामने रखें, उसे खाओ; और उनके बीच जो बीमार हैं, उन्हें चंगा करो। क्योंकि जो तुम्हारे मुँह में जाता है, वह तुम्हें अशुद्ध नहीं करेगा; बल्कि जो तुम्हारे मुँह से निकलता है, वही तुम्हें अशुद्ध करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल क्रिया का अर्थ ‘उत्पन्न करना/जन्म देना’ या ‘प्राप्त करना’ हो सकता है; इसलिए इसका अनुवाद ‘अपने लिए एक पाप अर्जित करोगे’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “वे तुम्हें दोषी ठहराएँगे।” कॉप्टिक में अनिर्दिष्ट बहुवचन कर्ता का प्रयोग कर्मवाच्य अर्थ में हो सकता है।'
    reason: source_idiom
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: उपजा लोगे
  rationale: क्रिया का अर्थ ‘उत्पन्न करना/जन्म देना’ और ‘प्राप्त करना’ दोनों हो सकता है। ‘उपजा लोगे’ मूल की जानबूझकर चौंकाने वाली छवि और अपने ऊपर पाप ले आने का भाव दोनों बनाए रखता है।
- source_word: ⲕⲁⲧⲁⲕⲣⲓⲛⲉ
  choice: दोषी ठहराया जाएगा
  rationale: यूनानी मूल का यह ऋणशब्द दंडात्मक निर्णय या दोषी ठहराने को व्यक्त करता है; हिंदी में कर्मवाच्य कथन स्वाभाविक है।
- source_word: ⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: दान
  rationale: यहाँ धार्मिक करुणादान/भिक्षादान अभिप्रेत है। सामान्य पाठक के लिए ‘दान’ सहज है और धार्मिक कर्म का संदर्भ बनाए रखता है।
- source_word: ⲕⲱ ϩⲁ-
  choice: सामने रखें
  rationale: शाब्दिक रूप से ‘नीचे रखना’ वाला मुहावरा आतिथ्य और भोजन के संदर्भ में किसी के सामने परोसने या रखने को दर्शाता है।
- source_word: ϫⲱϩⲙ̄
