base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
translation:
  language: hi
  text: यीशु ने कहा, “यदि वे तुमसे कहें, ‘तुम कहाँ से अस्तित्व में आए हो?’ तो उनसे कहना, ‘हम प्रकाश से निकलकर आए हैं—उस स्थान से, जहाँ प्रकाश अपने-आप अस्तित्व में आया, खड़ा हुआ[a] और उनके स्वरूप में प्रकट हुआ[b]।’ यदि वे तुमसे कहें, ‘क्या तुम वही हो?’[c] तो कहना, ‘हम उसकी संतान हैं और जीवित पिता के चुने हुए[d] हैं।’ और यदि वे तुमसे पूछें, ‘तुम्हारे पिता का, जो तुम्हारे भीतर है, चिन्ह क्या है?’ तो उनसे कहना, ‘गति और विश्राम।’[e]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में इस अंश का कुछ भाग क्षतिग्रस्त है और विद्वानों द्वारा पुनर्स्थापित किया गया है। ‘अपने-आप’ से जुड़ी पूर्वसर्गीय अभिव्यक्ति का सटीक बल भी अनिश्चित है; इसका अर्थ ‘अपने लिए’ या ‘अपने ही द्वारा’ भी समझा जा सकता है।
    reason: lacuna_or_restoration
  - marker: b
    text: ‘उनके स्वरूप’ कॉप्टिक ⲡⲉⲩϩⲓⲕⲱⲛ का अनुवाद है। ‘उनके’ किसकी ओर संकेत करता है, यह संदर्भ में अस्पष्ट है; इसलिए इसे ‘उसके’ या ‘अपने’ नहीं किया गया।
    reason: textual_ambiguity
  - marker: c
    text: ‘क्या तुम वही हो?’ मूल कॉप्टिक की संक्षिप्त समास-वाक्य रचना को दर्शाता है, जिसमें विधेय निहित है। संभव अर्थ ‘क्या तुम वह प्रकाश हो?’ है, पर मूल पाठ इसे स्पष्ट नहीं करता।
    reason: grammatical_ambiguity
  - marker: d
    text: ‘चुने हुए’ कॉप्टिक ⲡⲥⲱⲧⲡ का अनुवाद है; ‘निर्वाचित’ एक संभव, किंतु अधिक पारिभाषिक विकल्प है।
    reason: lexical_alternative
  - marker: e
    text: ‘गति’ के लिए ‘चलन’ और ‘विश्राम’ के लिए ‘शांति’ या ‘ठहराव’ संभव विकल्प हैं। कॉप्टिक में दोनों अमूर्त संज्ञाएँ हैं, इसलिए अनुवाद ‘एक गति और एक विश्राम’ नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: अस्तित्व में आना
  rationale: यहाँ क्रिया उत्पत्ति या अस्तित्व में आने को व्यक्त करती है; इसे अगले वाक्य में प्रकाश के अस्तित्व में आने के समान रूप से प्रस्तुत किया गया है।
- source_word: ⲉⲓ ⲉⲃⲟⲗ
  choice: निकलकर आना
  rationale: यह गति और उद्गम को व्यक्त करता है तथा ϣⲱⲡⲉ ‘अस्तित्व में आना’ से भेद बनाए रखता है।
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: प्रकाश
  rationale: मूल शब्द का सीधा और स्वाभाविक अर्थ है, और कथन की ब्रह्मांडीय भाषा को बनाए रखता है।
- source_word: ⲟⲩⲱϩⲉ
  choice: खड़ा हुआ
  rationale: मूल क्रिया के संक्षिप्त ‘खड़ा होना’ अर्थ और कथन की त्रिक लय को सुरक्षित रखता है।
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: प्रकट हुआ
  rationale: यह अभिव्यक्ति दिखाई देने या अभिव्यक्त होने को बताती है; ‘प्रकट हुआ’ हिन्दी में संक्षिप्त और सटीक है।
- source_word: ⲡⲉⲩϩⲓⲕⲱⲛ
  choice: उनके स्वरूप
  rationale: उपसर्ग बहुवचन स्वामी को दर्शाता है। संदर्भ अस्पष्ट होने पर भी ‘उनके’ को एकवचन में बदलकर अर्थ का समाधान नहीं किया गया।
- source_word: ⲡⲉϥϣⲏⲣⲉ
  choice: उसकी संतान
  rationale: पहले व्यक्ति बहुवचन के साथ सामूहिक अर्थ देता है; ‘संतान’ लिंग-समावेशी और स्वाभाविक हिन्दी है।
- source_word: ⲡⲥⲱⲧⲡ
  choice: चुने हुए
  rationale: ‘निर्वाचित’ जैसे अधिक पारिभाषिक धार्मिक शब्द के बिना चुने जाने का मूल भाव रखता है।
