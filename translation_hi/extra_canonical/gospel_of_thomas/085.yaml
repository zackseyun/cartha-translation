base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/085.yaml
  text: Jesus said[1], "Adam came into being from a great power and a great wealth, and he did not become worthy of you. For had he been worthy[2], he would not have tasted death."
translation:
  language: hi
  text: यीशु ने कहा, “आदम एक महान सामर्थ्य और बड़ी समृद्धि से अस्तित्व में आया, और वह तुम्हारे योग्य न बना। क्योंकि यदि वह योग्य होता,[a] तो उसने मृत्यु का स्वाद न चखा होता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में ‘योग्य’ और ‘स्वाद चखा होता’ के कुछ अक्षर नष्ट हैं। यहाँ दिए गए पाठ की पुनर्स्थापना प्रसंग और उपलब्ध स्थान के आधार पर व्यापक रूप से स्वीकार की जाती है।
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: अस्तित्व में आया
  rationale: यह संयुक्त अभिव्यक्ति अस्तित्व में आने या उत्पन्न होने को बताती है; ‘अस्तित्व में आया’ जन्म की अपेक्षा अधिक व्यापक और स्रोत के निकट है।
- source_word: ⲟⲩⲛⲟϭ ⲛⲇⲩⲛⲁⲙⲓⲥ
  choice: एक महान सामर्थ्य
  rationale: ⲟⲩ एकवचन अनिश्चित उपपद है, इसलिए ‘एक’ रखा गया है; ⲇⲩⲛⲁⲙⲓⲥ के लिए धार्मिक अर्थ थोपे बिना ‘सामर्थ्य’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ⲟⲩⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: बड़ी समृद्धि
  rationale: अमूर्त संज्ञा धन, वैभव या समृद्धि का बोध देती है; ‘समृद्धि’ हिन्दी में स्रोत की व्यापकता बनाए रखती है।
- source_word: ⲙⲡϣⲁ / ⲁⲝⲓⲟⲥ
  choice: योग्य
  rationale: दोनों शब्द इस प्रसंग में worthiness व्यक्त करते हैं; एक ही हिन्दी शब्द पुनरावृत्ति और तर्क-संबंध को सुरक्षित रखता है।
- source_word: ϫⲓ ϯⲡⲉ ⲙⲡⲙⲟⲩ
  choice: मृत्यु का स्वाद चखा
  rationale: यह ‘मृत्यु का स्वाद चखना’ अर्थ वाला मुहावरा है; इसे स्थान-सूचक वाक्यांश नहीं माना गया है।
theological_decisions:
- issue: ⲙⲡⲉϥϣⲱⲡⲉ ⲉϥⲙⲡϣⲁ का अर्थ
  choice: वह तुम्हारे योग्य न बना
  alternative: वह तुम्हारे योग्य न था
  rationale: ϣⲱⲡⲉ का विकासात्मक भाव ‘न बना’ में बना रहता है; अनुवाद यह तय नहीं करता कि योग्यता का ठीक धर्मवैज्ञानिक आधार क्या है।
- issue: अवास्तविक शर्त का काल और बल
  choice: यदि वह योग्य होता, तो उसने मृत्यु का स्वाद न चखा होता
  alternative: यदि वह योग्य था, तो वह मृत्यु का स्वाद न चखता
  rationale: कॉप्टिक संरचना अतीत की प्रतिकल्पित शर्त और उसके परिणाम को व्यक्त करती है; हिन्दी पूर्ण प्रतिकल्पित रूप इसे स्पष्ट और स्वाभाविक बनाता है।
- issue: आदम की उत्पत्ति में ‘सामर्थ्य’ और ‘समृद्धि’ का संबंध
  choice: एक महान सामर्थ्य और बड़ी समृद्धि से
  alternative: महान शक्ति और महान धन से
  rationale: ‘से’ स्रोत/उद्गम का संबंध बनाए रखता है, पर यह नहीं ठहराता कि ये दैवी सत्ता, गुण, पदार्थ या प्रतीक हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘अस्तित्व में आया’, ‘सामर्थ्य’, ‘समृद्धि’ और ‘मृत्यु का स्वाद चखा’ स्रोत की प्रमुख छवियों को बनाए रखते हैं। मुख्य पाठ में पांडुलिपीय रिक्तियों के लिए [a] चिह्न दिया गया है।
