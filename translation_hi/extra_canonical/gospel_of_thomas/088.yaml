base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
translation:
  language: hi
  text: यीशु ने कहा, “स्वर्गदूत और भविष्यद्वक्ता[a] तुम्हारे पास आएँगे और तुम्हें वह देंगे जो तुम्हारा है।[b] और तुम भी अपने हाथों में जो है, उन्हें दे देना और अपने आप से कहना, ‘वे किस दिन आएँगे और जो उनका है, उसे ले जाएँगे?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में “स्वर्गदूत” और “भविष्यद्वक्ता” दोनों बहुवचन में हैं।
    reason: textual_source_clarification
  - marker: b
    text: 'शाब्दिक अर्थ: “वे वस्तुएँ जो तुम्हारे पास हैं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛ̄ⲁⲅⲅⲉⲗⲟⲥ … ⲛ̄ⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: स्वर्गदूत और भविष्यद्वक्ता
  rationale: पांडुलिपि में दोनों संज्ञाओं के साथ बहुवचन सूचक लेख है; इसलिए दोनों को बहुवचन में रखा गया है।
- source_word: ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ
  choice: वह जो तुम्हारा है
  rationale: कॉप्टिक का अधिकारसूचक प्रयोग शाब्दिक रूप से ‘जो तुम्हारे पास है’ कहता है; हिंदी में ‘जो तुम्हारा है’ अंतिम ‘जो उनका है’ के साथ पारस्परिक विरोध स्पष्ट रखता है।
- source_word: ϩⲱⲧ̂ⲧⲏⲩⲧⲛ̄
  choice: तुम भी
  rationale: यह बलसूचक सर्वनाम ‘अपनी ओर से/बदले में’ का भाव देता है; सहज हिंदी में ‘भी’ पारस्परिकता व्यक्त करता है।
- source_word: ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  choice: अपने हाथों में जो है
  rationale: मूल में ‘हाथ में’ का ठोस बिंब है; इसे केवल ‘जो तुम्हारे पास है’ बनाकर समतल नहीं किया गया।
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ϫⲟⲟⲥ ⲛⲏⲧⲛ̄
  choice: अपने आप से कहना
  rationale: ‘तुमसे/तुम्हारे लिए कहना’ का आत्मवाची आशय हिंदी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ⲡⲉⲧⲉⲡⲱⲟⲩ
  choice: जो उनका है
  rationale: स्वतंत्र अधिकारसूचक सर्वनाम का सीधा अर्थ ‘उनका’ है और यह पहले अधिकारसूचक वाक्यांश के साथ संतुलन बनाता है।
theological_decisions:
- issue: लेन-देन या लौटाने की प्रकृति
  choice: ‘जो तुम्हारा है’ और ‘जो उनका है’ के पारस्परिक कथन को बनाए रखा गया
  alternative: ‘जो तुम्हारे पास है’ और ‘उनकी वस्तु’
  rationale: मूल पाठ यह नहीं बताता कि दी और ली जाने वाली वस्तुएँ क्या हैं। अनुवाद इस अस्पष्टता को बनाए रखता है और किसी विशिष्ट आध्यात्मिक या सांप्रदायिक अर्थ को आरोपित नहीं करता।
- issue: आगमन का समय
  choice: प्रश्न को भविष्यकालीन और खुला रखा गया
  alternative: किसी निश्चित अंतिम-दिन या न्याय-दिवस का संकेत जोड़ना
  rationale: मूल केवल ‘किस दिन’ पूछता है; वह घटना की पहचान या धर्मवैज्ञानिक समय-सारणी स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल शैली रखी गई है। बहुवचन संबोधन के लिए ‘तुम’ प्रयुक्त है। ‘अपने हाथों में’ का मूल बिंब और कथन की जानबूझकर बनी हुई अस्पष्टता सुरक्षित रखी गई है।
