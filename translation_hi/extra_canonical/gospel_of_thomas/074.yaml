base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/074.yaml
  text: He said[1], "Lord, there are many around the drinking trough[3][2], but there is nothing in the well."
translation:
  language: hi
  text: उसने कहा[a], “हे प्रभु, हौद[b] के चारों ओर बहुत-से लोग हैं, पर कुएँ में कुछ भी नहीं है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ का शाब्दिक क्रम है, ‘उसने कहा, “प्रभु…”’। यह स्पष्ट नहीं है कि यीशु परमेश्वर को संबोधित कर रहे हैं या कोई शिष्य यीशु को। कुछ विद्वान इसे कथन 73 की निरंतरता भी मानते हैं।
    reason: वक्ता और संबोधित व्यक्ति की अस्पष्टता
  - marker: b
    text: कॉप्टिक ⲧϫⲱⲧⲉ का अर्थ ‘कुआँ’ या ‘जल-संग्रह-कुंड’ हो सकता है। यहाँ अगले शब्द से भेद दिखाने के लिए इसका अनुवाद ‘हौद’ किया गया है।
    reason: शब्दार्थ का विकल्प
  - marker: c
    text: कॉप्टिक ⲗⲁⲁⲩ का अर्थ ‘कुछ भी’ या ‘कोई भी व्यक्ति’ हो सकता है। अतः अंतिम भाग का अनुवाद ‘पर कुएँ में कोई नहीं है’ भी संभव है।
    reason: व्याकरणिक और रूपकात्मक अस्पष्टता
lexical_decisions:
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: हे प्रभु
  rationale: निश्चित उपपद सहित यह पद यहाँ संबोधन के रूप में स्वाभाविक है। ‘हे प्रभु’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है, जबकि वक्ता और संबोधित व्यक्ति की पहचान पाठ में अनिश्चित रहती है।
- source_word: ⲧϫⲱⲧⲉ
  choice: हौद
  rationale: शब्द का अर्थ ‘कुआँ’ या ‘जल-संग्रह-कुंड’ हो सकता है। अगले जल-स्रोतवाचक शब्द से भेद बनाए रखने और जिसके चारों ओर लोग इकट्ठे हैं ऐसे पात्र/स्थान का बोध कराने के लिए ‘हौद’ चुना गया है।
- source_word: ⲧϣⲱⲛⲉ
  choice: कुआँ
  rationale: इस शब्द के अर्थ-क्षेत्र में कुआँ, कुंड और गड्ढा आते हैं। यहाँ पहले आए ⲧϫⲱⲧⲉ से भेद रखते हुए ‘कुआँ’ सबसे सहज हिन्दी है।
- source_word: ⲗⲁⲁⲩ
  choice: कुछ भी
  rationale: नकारात्मक अस्तित्ववाचक रचना में इसका अर्थ ‘कुछ भी’ अथवा ‘कोई भी व्यक्ति’ हो सकता है। मुख्य पाठ में ‘कुछ भी’ लिया गया है, पर व्यक्ति-सूचक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ϩⲁϩ
  choice: बहुत-से लोग
  rationale: मूल में केवल ‘बहुत-से’ है; कुएँ/हौद के चारों ओर उपस्थित जनों के संदर्भ में हिन्दी वाक्य पूरा और स्वाभाविक करने के लिए ‘लोग’ स्पष्ट किया गया है।
theological_decisions:
- issue: वक्ता और संबोधित व्यक्ति की पहचान
  choice: उसने कहा, “हे प्रभु…”
  alternative: “प्रभु ने कहा…” अथवा वक्ता को यीशु मानकर परमेश्वर से संबोधन
  rationale: कॉप्टिक वाक्य-विन्यास पहले ‘उसने कहा’ और फिर संबोधन ‘प्रभु’ देता है। यह स्पष्ट नहीं करता कि यीशु परमेश्वर से बोल रहे हैं या कोई शिष्य यीशु से; इसलिए पहचान को अनिर्धारित रखा गया है।
- issue: कुएँ में किसका अभाव है
  choice: कुछ भी नहीं
  alternative: कोई नहीं
  rationale: ⲗⲁⲁⲩ वस्तु और व्यक्ति दोनों को सूचित कर सकता है। ‘कुछ भी नहीं’ जल या सामग्री के अभाव की छवि बनाए रखता है, जबकि ‘कोई नहीं’ की वैकल्पिक मानवीय व्याख्या पादटिप्पणी में दी गई है; किसी एक रूपकात्मक अर्थ को धर्मशास्त्रीय रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, मौखिक और गरिमापूर्ण रखी गई है। ‘हौद’ और ‘कुआँ’ साधारण पाठक के लिए परिचित शब्द हैं। मूल की संक्षिप्त सूक्तिपरक शैली तथा वक्ता, संबोधन और अंतिम नकार की वास्तविक अस्पष्टताएँ सुरक्षित रखी गई हैं।
