base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/106.yaml
  text: Jesus said[a], “When you make the two one, you will become sons of the Human; and when you say, ‘Mountain[e][d][c][b], move away,’ it will move.”
translation:
  language: hi
  text: यीशु ने कहा, “जब तुम दोनों को एक करोगे[b], तब तुम ‘मानव के पुत्र’[a] बनोगे; और जब तुम कहोगे, ‘हे पहाड़, दूर हट जा,’ तब वह हट जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मानव के पुत्र’ का अनुवाद ‘मानव की संतान’ या ‘मानव के बच्चे’ भी किया जा सकता है। कॉप्टिक बहुवचन सामूहिक अर्थ में प्रयुक्त हो सकता है; ‘पुत्र’ मूल की अधिक शाब्दिक और असामान्य अभिव्यक्ति को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: 'तुलना करें: थोमा 22 और 48, जहाँ ‘दो को एक’ करने से जुड़ा भाव मिलता है।'
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ … ⲉⲣϣⲁⲛ
  choice: जब … तब
  rationale: यह रचना भविष्य की शर्त अथवा समय को व्यक्त करती है। हिन्दी में ‘जब … तब’ मूल के समानांतर वाक्य-विन्यास को स्वाभाविक रूप से बनाए रखता है।
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: दोनों को एक
  rationale: मूल का निश्चित और रहस्यमय विरोध—‘दो’ और ‘एक’—बिना उसकी व्याख्या किए सुरक्षित रखा गया है।
- source_word: ⲛϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  choice: ‘मानव के पुत्र’
  rationale: बहुवचन ‘पुत्र’ ϣⲏⲣⲉ का निकट रूप है और ‘मानव’ ⲡⲣⲱⲙⲉ की विशिष्ट, किंतु अस्पष्ट, थोमासी अभिव्यक्ति को बनाए रखता है। उद्धरण-चिह्न पाठक को यह संकेत देते हैं कि यह एक असामान्य पदबंध है, न कि अनजाने में बनी सामान्य हिन्दी।
- source_word: ϫⲟⲟⲥ
  choice: कहोगे
  rationale: पांडुलिपि का रूप ‘तुम इसे कहो’ है; सामान्यीकृत ϫⲱⲛⲧⲟⲥ को ‘ऊँचे स्वर से’ अर्थ वाला एक शब्द नहीं माना गया। प्रत्यय आगे आने वाले सीधे कथन की ओर संकेत करता है, इसलिए हिन्दी में केवल ‘कहोगे’ स्वाभाविक है।
- source_word: ⲡⲧⲟⲟⲩ
  choice: हे पहाड़
  rationale: संज्ञा संबोधन में है। हिन्दी का ‘हे’ प्रत्यक्ष आज्ञा को स्पष्ट करता है, जबकि मूल का निश्चित लेख अलग से अनूदित नहीं किया गया।
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: यहाँ से हट जा
  rationale: क्रिया और दिशासूचक अव्यय का अर्थ ‘हट/दूर हो जाना’ है। ‘यहाँ से’ हिन्दी में दिशा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ⲛⲧⲟϥ ⲛⲁⲡⲱⲱⲛⲉ
  choice: तब वह हट जाएगा
  rationale: भविष्यसूचक रूप और पहाड़ की ओर संकेत करने वाला पुल्लिंग सर्वनाम स्पष्ट रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ⲡⲣⲱⲙⲉ को सामान्य ‘मनुष्य’ मानना या विशिष्ट ‘मानव’ पदबंध के रूप में रखना
  choice: मानव
  alternative: मनुष्य / वह मानव / मनुष्य-पुत्र संबंधी पारंपरिक शब्दावली
  rationale: मूल में निश्चित लेख है और थोमा में यह पदबंध अर्थपूर्ण रूप से विशिष्ट तथा रहस्यमय रह सकता है। ‘मानव’ उसकी असामान्यता बचाता है; ‘वह मानव’ अनावश्यक रूप से किसी निश्चित व्यक्ति की पहचान तय कर देता, जबकि पारंपरिक ‘मनुष्य का पुत्र’ इस बहुवचन कथन को धर्मवैज्ञानिक रूप से पहले ही सुलझा देता।
- issue: ⲛϣⲏⲣⲉ का लिंग-सापेक्ष रूप
  choice: पुत्र
  alternative: संतान / बच्चे
  rationale: ‘पुत्र’ मूल के अधिक शाब्दिक किनारे और पदबंध की विशिष्टता को रखता है। फिर भी कॉप्टिक बहुवचन सामूहिक अर्थ में ‘संतान’ या ‘बच्चे’ भी व्यक्त कर सकता है; इसे पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। कथन की पहेली-जैसी प्रकृति को समझाकर समाप्त नहीं किया गया। ‘ऊँचे स्वर से’ या ‘खुले तौर पर’ नहीं जोड़ा गया, क्योंकि पांडुलिपि का ϫⲟⲟⲥ ‘इसे कहना’ है; सामान्यीकृत रूप में सर्वनाम को गलती से स्वतंत्र क्रिया-विशेषण नहीं समझना चाहिए।
