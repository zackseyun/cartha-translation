base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/028.yaml
  text: Jesus said[1], "I stood in the midst of the world, and I appeared to them in flesh.[1] I found them all drunk; I found not one of them thirsting.[2] And my soul was pained over the children of humanity,[3] for they are blind in their heart and they do not see that they came into the world empty, seeking also to go out of the world empty.[4] But now they are drunk. When they have shaken off their wine[a][5][4][3][2], then they will repent."[5]
translation:
  language: hi
  text: यीशु ने कहा, “मैं संसार के बीच खड़ा हुआ और देह में उनके सामने प्रकट हुआ[a]। मैंने उन सबको मतवाला पाया; उनमें से एक को भी प्यासा नहीं पाया[b]। मनुष्य की संतानों[c] के कारण मेरा प्राण व्यथित हुआ, क्योंकि वे अपने हृदय में अंधे हैं। वे यह नहीं देखते कि वे संसार में खाली आए हैं और खाली ही संसार से निकलने की खोज भी कर रहे हैं[d]। पर अभी वे मतवाले हैं। जब वे अपनी दाखमधु का नशा झाड़ फेंकेंगे[e], तब वे मन फिराएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक पद का अर्थ ‘प्रकट हुआ’, ‘प्रत्यक्ष हुआ’ या ‘चमककर सामने आया’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कॉप्टिक वाक्य-रचना संक्षिप्त है; यूनानी POxy 1 साक्षी स्पष्ट रूप से ‘उनमें एक को भी प्यासा नहीं पाया’ पढ़ने का समर्थन करता है।
    reason: textual_variant
  - marker: c
    text: शाब्दिक रूप से ‘मनुष्य की संतानें’; इसका आशय सामान्य रूप से मानवजाति के लोग हैं।
    reason: lexical_alternative
  - marker: d
    text: ‘निकलने’ का शाब्दिक अर्थ ‘बाहर जाने’ का है। यहाँ ‘खोज भी कर रहे हैं’ एक साथ चल रही क्रिया को व्यक्त करता है; ‘और वे निकलना भी चाहते हैं’ भी संभव है।
    reason: grammar
  - marker: e
    text: शाब्दिक मुहावरा लगभग ‘अपनी दाखमधु झाड़ फेंकेंगे’ है। ‘दाखमधु का नशा झाड़ फेंकेंगे’ हिन्दी में इस मुहावरे को स्पष्ट करता है; ‘जब उनकी मदिरा उतर जाएगी’ या ‘जब उनका नशा उतर जाएगा’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲱϩⲉ ⲉⲣⲁⲧ ϩⲛⲡⲙⲏⲧⲉ
  choice: संसार के बीच खड़ा हुआ
  rationale: क्रिया का अर्थ ‘खड़ा होना/अपना स्थान लेना’ है; हिन्दी में ‘खड़ा हुआ’ कथन की संक्षिप्तता और औपचारिक स्वर बनाए रखता है।
- source_word: ⲕⲟⲥⲙⲟⲥ
  choice: संसार
  rationale: यूनानी मूल का यह कॉप्टिक शब्द यहाँ मानव-जगत के व्यापक अर्थ में है; ‘संसार’ स्वाभाविक और अर्थ-संगत है।
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: प्रकट हुआ
  rationale: पद का अर्थ ‘प्रकट होना’ या ‘चमककर सामने आना’ हो सकता है; ‘प्रकट हुआ’ मूल की अर्थ-सीमा को बिना अनावश्यक व्याख्या के रखता है।
- source_word: ϩⲛⲥⲁⲣⲝ
  choice: देह में
  rationale: मूल में यूनानी-व्युत्पन्न ‘मांस/देह’ का स्पष्ट पद है; ‘देह में’ हिन्दी में स्वाभाविक रहते हुए उसके मूर्त भाव को बनाए रखता है।
- source_word: ⲧⲁϩⲟ / ⲧⲟϩⲉ
  choice: मतवाला
  rationale: दोनों रूप मदिरा से नशे में होने को व्यक्त करते हैं; ‘मतवाला’ आगे आने वाली दाखमधु की छवि से जुड़ता है और गरिमापूर्ण हिन्दी देता है।
- source_word: ⲉⲗⲁⲁⲩ ⲛ̄ϩⲏⲧⲟⲩ ⲉϥⲟⲃⲉ
  choice: उनमें से एक को भी प्यासा नहीं पाया
  rationale: पांडुलिपि का वाक्य संक्षिप्त है, पर नकार स्पष्ट है; यूनानी POxy 1 साक्षी भी ‘एक को भी प्यासा नहीं’ पढ़ने का समर्थन करता है।
- source_word: ⲯⲩⲭⲏ
  choice: प्राण
  rationale: यह पद ‘आत्मा, प्राण, अंतःजीवन’ की अर्थ-सीमा रखता है; ‘मेरा प्राण व्यथित हुआ’ हिन्दी में स्वाभाविक है और किसी व्यवस्थित आत्मा-सिद्धांत को आरोपित नहीं करता।
- source_word: ϯⲧⲕⲁⲥ
  choice: व्यथित हुआ
  rationale: मुहावरे का आशय भीतर गहरी पीड़ा अनुभव करना है; ‘व्यथित हुआ’ भाव की तीव्रता और गरिमा दोनों रखता है।
