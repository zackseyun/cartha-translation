base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
translation:
  language: hi
  text: यीशु ने कहा, “देखो, बोनेवाला बाहर निकला। उसने अपना हाथ भर लिया[a] और बीज बिखेरा। कुछ बीज रास्ते पर गिरे; पक्षी आए और उन्हें बटोर ले गए[b]। कुछ बीज चट्टान पर गिरे; उन्होंने नीचे धरती में जड़ नहीं जमाई और ऊपर आकाश की ओर बालें नहीं निकालीं[c]। कुछ बीज काँटों के बीच गिरे; काँटों ने बीज को घोंट दिया, और कीड़े ने उन्हें खा लिया[d]। कुछ बीज अच्छी भूमि पर गिरे, और उसने आकाश की ओर अच्छा फल दिया। उसकी उपज साठ माप और एक सौ बीस माप हुई[e]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: थोमा के इस वर्णन में बोनेवाले के अपना हाथ भरने का विवरण है; समानांतर सुसमाचारों में यह नहीं मिलता।
    reason: textual_variant
  - marker: b
    text: यहाँ कॉप्टिक क्रिया का अर्थ “बटोरना” या “चुन लेना” है, न कि समानांतर सुसमाचारों में मिलने वाला “खा जाना।”
    reason: lexical_ambiguity
  - marker: c
    text: मूल पाठ में नीचे धरती की ओर जड़ और ऊपर आकाश की ओर बालें निकलने का सजीव ऊर्ध्वाधर चित्र है।
    reason: distinctive_imagery
  - marker: d
    text: बीज को कीड़े द्वारा खा लिए जाने का विवरण थोमा के इस रूप में विशेष है।
    reason: textual_variant
  - marker: e
    text: “माप” का अनुवाद कॉप्टिक ⲉⲥⲟⲧⲉ से है। पाठ में साठ और एक सौ बीस माप हैं; इसे समानांतर सुसमाचारों के अनुसार “साठ गुना और सौ गुना” नहीं बनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲥⲓⲧⲉ
  choice: बोनेवाला
  rationale: कृषि-दृष्टांत के संदर्भ में स्वाभाविक और सटीक कर्ता-संज्ञा।
- source_word: ⲙⲉϩⲧⲟⲟⲧϥ
  choice: अपनी मुट्ठी भरी
  rationale: हाथ भरने की विशिष्ट भौतिक क्रिया को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ⲕⲱⲧϥ
  choice: बटोर ले गए / घेर लिया
  rationale: क्रिया का मूल भाव इकट्ठा करने या चारों ओर समेटने का है। पक्षियों के प्रसंग में “बटोर ले गए” और काँटों के प्रसंग में “घेर लिया” हिन्दी में संदर्भानुकूल हैं; इसे समानांतर परंपरा के अनुसार “खा गए” नहीं किया गया।
- source_word: ⲧⲉⲩⲉϩⲙⲥ
  choice: बालें नहीं निकालीं
  rationale: अनाज की बालें ऊपर भेजने/निकालने की कृषि-छवि को स्पष्ट रखता है।
- source_word: ⲱϭⲧ
  choice: दबा दिया
  rationale: काँटों द्वारा बीज को कुचलने या घोंटने का भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ϥⲛⲧ
  choice: कीड़ा
  rationale: स्रोत के सामान्य अर्थ ‘worm’ को बिना अतिरिक्त विशिष्टीकरण के देता है।
- source_word: ⲉⲥⲟⲧⲉ
  choice: माप
  rationale: स्रोत के माप/उपज-संबंधी पद को औपचारिक रूप से सुरक्षित रखता है और समानांतर सुसमाचारों के ‘गुना’ से सामंजस्य नहीं बैठाता।
theological_decisions:
- issue: समानांतर बीज बोनेवाले के दृष्टांतों से सामंजस्य
  choice: थोमा के विशिष्ट विवरण—मुट्ठी भरना, पक्षियों का बटोरना, नीचे जड़ और ऊपर बालें, कीड़ा, तथा साठ और एक सौ बीस माप—सुरक्षित रखे गए।
  alternative: विवरणों को मत्ती, मरकुस या लूका के अनुरूप ‘खा गए’, ‘गुना’ आदि बनाना।
  rationale: स्रोत-पाठ की स्वतंत्र शब्दावली और तनाव को बनाए रखना आवश्यक है; समानांतर ग्रंथों से मौन सामंजस्य पाठ की विशिष्टता मिटा देता।
