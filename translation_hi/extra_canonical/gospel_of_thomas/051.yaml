base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/051.yaml
  text: 'His disciples said to him[a], "On what day will the rest of the dead take place, and on what day will the new world come?"

    He said to them, "That which you are expecting has come[b][c], but you yourselves do not know it."'
translation:
  language: hi
  text: 'उनके शिष्यों ने उनसे कहा, “मरे हुओं का विश्राम किस दिन होगा, और नया संसार किस दिन आएगा?”


    उन्होंने उनसे कहा, “तुम जिस विश्राम की बाट जोह रहे हो, वह[a] आ गया है[b]; पर तुम स्वयं[c] उसे नहीं जानते।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक में यहाँ प्रयुक्त स्त्रीलिंग संकेतवाचक सर्वनाम व्याकरणतः पहले आए स्त्रीलिंग शब्द ‘विश्राम’ की ओर संकेत करता है।
    reason: सर्वनाम के संदर्भ को स्पष्ट करना
  - marker: b
    text: कॉप्टिक का अर्थ ‘आ गया है’ है; मूल पाठ में ‘पहले ही’ के लिए कोई अलग शब्द नहीं है।
    reason: पूर्णकाल का अर्थ और सीमा स्पष्ट करना
  - marker: c
    text: कॉप्टिक में ‘तुम’ का स्वतंत्र सर्वनाम क्रिया से पहले रखकर विशेष बल दिया गया है।
    reason: स्रोत के बलाघात को बताना
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: किस दिन
  rationale: प्रश्नवाचक पद का सीधा अर्थ किसी निश्चित दिन के विषय में पूछना है; इसलिए सामान्य ‘कब’ के बजाय ‘किस दिन’ रखा गया।
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: विश्राम
  rationale: यह यूनानी मूल का शब्द है जिसका मूल अर्थ विश्राम या विराम है। ‘विश्राम’ हिन्दी में स्वाभाविक है और पाठ की आध्यात्मिक या अंतिम अवस्था संबंधी संभावनाओं को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ϣⲱⲡⲉ
  choice: होगा
  rationale: विश्राम जैसी घटना या अवस्था के घटित होने के लिए सहज हिन्दी भविष्यकाल प्रयोग किया गया है।
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲃⲃⲣⲣⲉ
  choice: नया संसार
  rationale: ⲕⲟⲥⲙⲟⲥ के लिए ‘संसार’ और ⲃⲃⲣⲣⲉ के लिए ‘नया’ सीधा तथा स्वाभाविक अनुवाद है।
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-
  choice: बाट जोह रहे हो
  rationale: यह मुहावरा आगे देखकर प्रतीक्षा करने का भाव देता है। ‘बाट जोहना’ अपेक्षा और प्रतीक्षा दोनों को गरिमापूर्ण, समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: ⲁⲥⲉⲓ
  choice: आ गया है
  rationale: कॉप्टिक पूर्णकाल अपेक्षित घटना को घटित वास्तविकता के रूप में रखता है। ‘आ गया है’ इसका स्वाभाविक हिन्दी पूर्णकाल है और पाठ में न पाए जाने वाले ‘पहले ही’ को नहीं जोड़ता।
- source_word: ⲛⲧⲱⲧⲛ
  choice: तुम स्वयं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; ‘स्वयं’ उस बल को हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: भविष्य की अपेक्षा और वर्तमान में घटित वास्तविकता के बीच तनाव
  choice: “वह आ गया है”
  alternative: “वह आएगा” अथवा “वह पहले ही आ चुका है”
  rationale: स्रोत में पूर्णकाल स्पष्ट रूप से आने की घटना को घटित बताता है, पर ‘पहले ही’ के लिए अलग शब्द नहीं है। इसलिए वर्तमान/पूर्ण वास्तविकता बनाए रखी गई, बिना यह निर्धारित किए कि उसका पूरा धर्मवैचारिक अर्थ क्या है।
- issue: उत्तर में संकेतवाचक सर्वनाम का संदर्भ
  choice: “तुम जिस विश्राम की बाट जोह रहे हो”
  alternative: “जिसकी तुम बाट जोह रहे हो” अथवा इसे ‘नया संसार’ मानना
  rationale: कॉप्टिक स्त्रीलिंग संकेतवाचक सर्वनाम व्याकरणतः स्त्रीलिंग ‘विश्राम’ की ओर लौटता है। हिन्दी में संदर्भ खो न जाए, इसलिए ‘विश्राम’ को स्पष्ट रूप से दोहराया गया; फिर भी इस विश्राम की प्रकृति की कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनयोग्य रखी गई है। ‘मरे हुए’, ‘विश्राम’, ‘नया संसार’ और ‘बाट जोहना’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल की समय-संबंधी और धर्मवैचारिक तनातनी को व्याख्यात्मक शब्द जोड़कर समाप्त नहीं किया गया।
