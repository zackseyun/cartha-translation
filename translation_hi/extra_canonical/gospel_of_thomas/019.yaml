base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/019.yaml
  text: Jesus said[a], “Blessed is the one who has come to be before he comes to be. If you become my disciples and listen to my words, these stones will minister to you. For you have five trees in Paradise; they do not move in summer or in winter, and their leaves do not fall[d][c][b]. Whoever comes to know them will not taste death.”
translation:
  language: hi
  text: यीशु ने कहा, “धन्य है वह, जो अस्तित्व में आने से पहले अस्तित्व में आ चुका है।[a] यदि तुम मेरे शिष्य बनोगे और मेरी बातें सुनोगे, तो ये पत्थर तुम्हारी सेवा करेंगे।[b] क्योंकि स्वर्गोद्यान में तुम्हारे पाँच पेड़ हैं; वे न गर्मी में हिलते हैं, न सर्दी में, और उनके पत्ते नहीं झड़ते। जो उन्हें जान लेगा, वह मृत्यु का स्वाद नहीं चखेगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल में एक ही क्रिया ϣⲱⲡⲉ (‘होना; अस्तित्व में आना’) दोहराई गई है: शाब्दिक भाव है, ‘धन्य है वह, जो अपने अस्तित्व में आने से पहले अस्तित्व में आ चुका है।’ इस जानबूझकर रचे गए विरोधाभास को सरल करके ‘जन्म से पहले’ नहीं किया गया है।'
    reason: lexical_alternative
  - marker: b
    text: 'पांडुलिपि के प्रत्यक्ष पाठ में बहुवचन ‘मेरी बातें’ और ‘ये पत्थर’ पढ़े जाते हैं। उद्धृत सामान्यीकृत संपादित पाठ इन्हें एकवचन मानता है: ‘मेरी बात सुनो, तो यह पत्थर तुम्हारी सेवा करेगा।’'
    reason: textual_variant
  - marker: c
    text: ‘मृत्यु का स्वाद चखना’ कॉप्टिक का मुहावरा है; तुलना करें मरकुस 9:1 और मत्ती 16:28।
    reason: cross_reference
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य
  rationale: यूनानी मूल के इस कॉप्टिक शब्द में आशीर्वचन का भाव है; ‘धन्य’ कथन की धार्मिक और सूक्तिपरक गरिमा बनाए रखता है।
- source_word: ϣⲱⲡⲉ
  choice: अस्तित्व में आना
  rationale: यह क्रिया ‘होना/अस्तित्व में आना’ व्यक्त करती है। दोनों बार समान अभिव्यक्ति रखकर मूल का जानबूझकर रचा गया विरोधाभास सुरक्षित रखा गया है।
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲱⲧⲛ ϣⲱⲡⲉ
  choice: यदि तुम … बनो
  rationale: भविष्यकालिक-शर्तसूचक रचना को स्वाभाविक हिन्दी में ‘यदि’ से व्यक्त किया गया है, बिना इसे निश्चित समयवाचक ‘जब’ बनाने के।
- source_word: ⲙⲁⲑⲏⲧⲏⲥ
  choice: शिष्य
  rationale: यह यूनानी आगत शब्द का मानक धार्मिक अर्थ है और केवल ‘विद्यार्थी’ से अधिक उपयुक्त है।
- source_word: ⲥⲱⲧⲙ ⲉ-
  choice: सुनो
  rationale: मूल में ध्यान से सुनने का भाव है; ‘सुनो’ इसे रखता है, जबकि ‘आज्ञा मानो’ अर्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: ⲁⲛⲁϣⲁϫⲉ / ⲛⲉⲉⲓⲱⲛⲉ
  choice: मेरी बातों / ये पत्थर
  rationale: पांडुलिपि-पृष्ठ के प्रत्यक्ष पाठ में दोनों रूप बहुवचन हैं। हिन्दी में ‘बातों’ और ‘पत्थर’ से उस बहुवचन का अनुसरण किया गया है; संपादित सामान्यीकृत पाठ का एकवचन पादटिप्पणी में दर्ज है।
- source_word: ⲛⲁⲣⲇⲓⲁⲕⲟⲛⲉⲓ
  choice: सेवा करेंगे
  rationale: यूनानी diakonein से आए शब्द का सेवाकार्य संबंधी भाव ‘सेवा करेंगे’ में स्वाभाविक हिन्दी के साथ सुरक्षित रहता है।
- source_word: ⲡⲁⲣⲁⲇⲓⲥⲟⲥ
  choice: स्वर्गोद्यान
  rationale: यह ‘Paradise’ का उद्यान-संबंधी अर्थ बनाए रखता है और सामान्य हिन्दी पाठक के लिए ‘परादीस’ जैसे लिप्यंतरण से अधिक स्पष्ट है।
- source_word: ⲕⲓⲙ
  choice: हिलते
  rationale: मूल का सामान्य अर्थ ‘हिलना/गतिमान होना’ है; ‘बदलते’ कहने से ऋतुओं के प्रभाव की व्याख्या पाठ में जोड़ दी जाती।
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: मृत्यु का स्वाद चखेगा
  rationale: मूल के सजीव मुहावरे को शाब्दिक और बोधगम्य हिन्दी में रखा गया है।
theological_decisions:
- issue: ‘अस्तित्व में आने से पहले अस्तित्व में आ चुका है’ का आशय
  choice: विरोधाभासी कथन को ज्यों का त्यों खुला रखा गया
  alternative: इसे जन्म-पूर्व अस्तित्व, आत्मज्ञान या पूर्वनियति के किसी एक सिद्धांत के रूप में स्पष्ट करना
  rationale: कॉप्टिक पाठ स्वयं व्याख्या नहीं देता; किसी एक धर्मवैचारिक अर्थ को थोपना मूल की वास्तविक अस्पष्टता समाप्त कर देता।
- issue: स्वर्गोद्यान के पाँच पेड़ों की पहचान
  choice: ‘पाँच पेड़’ का अक्षरशः अनुवाद
  alternative: उन्हें पाँच इंद्रियों, आध्यात्मिक शक्तियों या किसी अन्य प्रतीक के रूप में पहचानना
  rationale: मूल में प्रतीक की व्याख्या नहीं है, इसलिए अनुवाद को किसी परंपरागत पहचान को पाठ का हिस्सा नहीं बनाना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सूक्तिपरक रखी गई है। ‘गर्मी/सर्दी’ जैसे सहज शब्द सामान्य पाठक के लिए चुने गए हैं, जबकि ‘धन्य’, ‘शिष्य’ और ‘स्वर्गोद्यान’ कथन के धार्मिक-साहित्यिक स्वर को बनाए रखते हैं। पांडुलिपि के बहुवचन पाठ को मुख्य पाठ में और सामान्यीकृत संपादकीय एकवचन को पादटिप्पणी में रखा गया है।
