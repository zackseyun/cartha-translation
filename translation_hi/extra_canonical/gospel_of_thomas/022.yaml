  revised_text: '**थोमा का सुसमाचार — कथन 22**


    यीशु ने कुछ छोटे बच्चों को माँ का दूध पीते देखा।[a] उन्होंने अपने शिष्यों से कहा, “ये छोटे बच्चे, जो माँ का दूध पीते हैं, उन लोगों के समान हैं जो राज्य में प्रवेश करते हैं।”[b]


    उन्होंने उनसे पूछा, “क्या हम, छोटे बच्चे होते हुए, राज्य में प्रवेश करेंगे?”[c]


    यीशु ने उनसे कहा, “जब तुम दोनों को एक करोगे, और भीतर को बाहर के समान तथा बाहर को भीतर के समान करोगे, और ऊपर को नीचे के समान करोगे;[d] और जब तुम पुरुष और स्त्री को एक ही करोगे, ताकि पुरुष पुरुष न रहे और स्त्री स्त्री न रहे; जब तुम एक आँख के स्थान पर आँखें, एक हाथ के स्थान पर एक हाथ, एक पैर के स्थान पर एक पैर, और एक छवि के स्थान पर एक छवि बनाओगे—तब तुम राज्य में प्रवेश करोगे।”[e]


    **पादटिप्पणियाँ**


    [a] कॉप्टिक क्रिया ϫⲓⲉⲣⲱⲧⲉ विशेष रूप से माँ का दूध पीने या स्तनपान किए जाने को व्यक्त करती है।


    [b] “राज्य” कॉप्टिक ⲙⲛⲧⲣⲣⲟ का अनुवाद है, जिसका मूल अर्थ “राजत्व” या “राजकीय शासन” भी हो सकता है; यहाँ उसमें प्रवेश करने की बात कही गई है।


    [c] शिष्यों के प्रश्न में “छोटे बच्चे होना” मुख्य क्रिया नहीं, बल्कि उनकी अवस्था बताने वाला वाक्यांश है; इसलिए इसका अर्थ “क्या हम छोटे बच्चे बन जाएँ?” नहीं किया गया।


    [d] “ऊपर” और “नीचे” के लिए आए शब्दों को “स्वर्ग” और “पृथ्वी” भी समझा जा सकता है। पाठ में “पीछे को आगे के समान” कहने वाला कोई अलग जोड़ा नहीं है।


    [e] पांडुलिपि की अंतिम पंक्ति थोड़ी क्षतिग्रस्त है; “राज्य” संपादकीय रूप से पुनर्स्थापित पाठ के अनुसार है।'
