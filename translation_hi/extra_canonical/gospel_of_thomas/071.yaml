base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/071.yaml
  text: Jesus said[a], I will cast down this house[c][b], and no one will be able to build it.
translation:
  language: hi
  text: यीशु ने कहा, “मैं इस घर[a] को ढा दूँगा, और कोई भी इसे बना नहीं सकेगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इस घर’ वाला अंश पांडुलिपि में आंशिक रूप से नष्ट है; संपादित सामान्यीकृत पाठ इसे पुनर्स्थापित करता है।
    reason: lacuna_or_restoration
  - marker: b
    text: मूल पाठ में ‘सक्षम होना’ और ‘इसे’ स्पष्ट हैं, पर बनाने की क्रिया अलग से व्यक्त नहीं है। घर को ढाने के प्रसंग से ‘इसे बनाना’ समझा गया है। कुछ अनुवाद ‘फिर बनाना’ कहते हैं, पर कॉप्टिक में ‘फिर’ के लिए कोई अलग शब्द नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: यह वक्ता का परिचय देने वाला निश्चित सूत्र है; संक्षिप्त नाम को सामान्यीकृत पाठ के अनुसार ‘यीशु’ के रूप में खोला गया है।
- source_word: ⲁⲛⲟⲕ
  choice: मैं
  rationale: स्वतंत्र प्रथम-पुरुष सर्वनाम में बल है, पर हिन्दी में ‘मैं’ ही प्रसंगतः पर्याप्त और स्वाभाविक है।
- source_word: ϣⲟⲣϣⲣ
  choice: ढा दूँगा
  rationale: क्रिया का अर्थ गिराना, तोड़ डालना या ध्वस्त करना है; घर के संदर्भ में ‘ढा देना’ सीधा और स्वाभाविक है।
- source_word: ⲡⲉⲓⲏⲓ
  choice: इस घर को
  rationale: संज्ञा का मूल अर्थ ‘घर/निवास’ है और demonstrative से ‘यह’ व्यक्त होता है; हिन्दी में सकर्मक क्रिया के साथ ‘इस घर को’ स्वाभाविक है।
- source_word: ⲙⲛⲗⲁⲁⲩ
  choice: कोई भी ... नहीं
  rationale: नकार और अनिश्चित सर्वनाम मिलकर ‘कोई नहीं’ का अर्थ देते हैं; हिन्दी वाक्य-विन्यास में ‘कोई भी ... नहीं’ स्वाभाविक है।
- source_word: ϣⲕⲱⲧ
  choice: सकेगा
  rationale: क्रिया का अर्थ ‘सक्षम होना’ है; हिन्दी में सामर्थ्यसूचक ‘सकना’ इसका सीधा समतुल्य है।
- source_word: ⲛⲧⲟϥ
  choice: इसे
  rationale: पुल्लिंग एकवचन वस्तु-सूचक रूप पहले आए ‘घर’ की ओर संकेत करता है।
theological_decisions:
- issue: अंतिम क्रिया का लुप्त या अध्याहृत अर्थ
  choice: फिर खड़ा नहीं कर सकेगा
  alternative: इसके साथ कुछ नहीं कर सकेगा / इसे बना नहीं सकेगा
  rationale: कॉप्टिक में ‘सक्षम होना’ और ‘इसे’ स्पष्ट हैं, लेकिन करने की क्रिया व्यक्त नहीं है। घर और उसे ढाने के प्रसंग से निर्माण का अर्थ स्वाभाविक रूप से निकलता है। ‘फिर’ पुनर्निर्माण का प्रसंगगत भाव बताता है, पर इसकी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘ढा दूँगा’ मूल की तीव्रता बनाए रखता है। मुख्य पाठ में अस्पष्ट अध्याहृत क्रिया को पठनीय रूप दिया गया है और उसकी सीमा पादटिप्पणी में स्पष्ट की गई है।
