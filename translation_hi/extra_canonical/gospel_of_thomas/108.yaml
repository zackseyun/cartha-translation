base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/108.yaml
  text: Jesus said[a], “Whoever drinks from my mouth will become like me. I myself shall become he[e][d][c][b], and the hidden things will be revealed to him.”
translation:
  language: hi
  text: यीशु ने कहा, “जो मेरे मुँह से पिएगा,[a] वह मेरे जैसा हो जाएगा। मैं स्वयं भी वह हो जाऊँगा, और जो छिपा है वह उस पर प्रकट हो जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे मुँह से पिएगा” मूल की रूपकात्मक अभिव्यक्ति है। यहाँ “मुँह” कथन या शिक्षा की ओर संकेत कर सकता है, पर अनुवाद इसे सीधे “मेरी बातें ग्रहण करेगा” नहीं बनाता।
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲱ
  choice: जो … पिएगा
  rationale: सापेक्ष भविष्य यहाँ सामान्य और अनिश्चित अर्थ देता है; हिन्दी में ‘जो … पिएगा’ स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲡⲁⲧⲁⲡⲣⲟ
  choice: मेरे मुँह से
  rationale: यह स्रोत को सूचित करता है। मूल की सशक्त रूपकात्मक अभिव्यक्ति को ‘मेरी बातें’ कहकर व्याख्यायित नहीं किया गया।
- source_word: ⲛ̄ⲧⲁϩⲉ / ⲛ ⲡⲁϩⲉ
  choice: मेरे जैसा
  rationale: पांडुलिपि का ⲛ̄ⲧⲁϩⲉ ‘मेरे ढंग/रीति में’ का मुहावरा है, जिसका स्वाभाविक अर्थ ‘मेरे जैसा’ है; ‘मेरे बराबर’ उचित नहीं।
- source_word: ϣⲱⲡⲉ
  choice: हो जाएगा / हो जाऊँगा
  rationale: इस प्रसंग में क्रिया का अर्थ ‘बनना/हो जाना’ है; हिन्दी में ‘हो जाना’ अधिक सहज और गरिमापूर्ण है।
- source_word: ⲁⲛⲟⲕ ϩⲱⲱ
  choice: मैं स्वयं भी
  rationale: ϩⲱⲱ कर्ता पर बल देने के साथ पारस्परिकता का भाव भी रखता है; ‘स्वयं भी’ दोनों को संक्षेप में बनाए रखता है।
- source_word: ⲁⲛⲟⲕⲛⲁϣⲱⲡⲉ ⲉⲣⲉⲛⲧⲟϥ ⲡⲉ
  choice: मैं स्वयं भी वह हो जाऊँगा
  rationale: मूल की असामान्य, पारस्परिक पहचान की उक्ति को स्पष्ट किए बिना यथासंभव निकट रखा गया है।
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ
  choice: जो छिपा है
  rationale: संज्ञीकृत सापेक्ष पद संख्या की दृष्टि से सामान्य है; ‘जो छिपा है’ इस अस्पष्टता को बनाए रखता है।
- source_word: ⲟⲩⲱⲛϩ ⲉⲛⲧⲟϥ
  choice: उस पर प्रकट हो जाएगा
  rationale: ⲟⲩⲱⲛϩ का अर्थ प्रकट/प्रत्यक्ष होना है। हिन्दी में ज्ञान या रहस्य के व्यक्ति पर प्रकट होने के लिए ‘उस पर प्रकट’ स्वाभाविक है।
theological_decisions:
- issue: वक्ता और पीने वाले के बीच पारस्परिक पहचान
  choice: ‘वह मेरे जैसा हो जाएगा। मैं स्वयं भी वह हो जाऊँगा’
  alternative: ‘वह मेरे बराबर हो जाएगा, और मैं वह बन जाऊँगा’
  rationale: पहले वाक्यांश में पांडुलिपि ‘मेरे जैसा’ का समर्थन करती है, जबकि दूसरे की तीखी पहचान-वाचक भाषा को नरम या किसी विशिष्ट धर्मवैज्ञानिक सिद्धांत के अनुसार नहीं समझाया गया।
- issue: छिपी हुई वस्तु या सत्य का वचन
  choice: ‘जो छिपा है’
  alternative: ‘छिपी हुई बातें’
  rationale: कॉप्टिक व्याकरण यहाँ निश्चित संख्या नहीं ठहराता; एकवचन-सदृश हिन्दी संरचना मूल की सामूहिक अथवा अमूर्त अस्पष्टता बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। मूल की रूपकात्मकता और पारस्परिक पहचान की असामान्य अभिव्यक्ति को बिना सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
