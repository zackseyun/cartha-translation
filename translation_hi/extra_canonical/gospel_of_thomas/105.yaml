base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/105.yaml
  text: Jesus said[f][e][d][c][b][a], “The one who will come to know the father and the mother—they will call him ‘the son of a prostitute.’”
translation:
  language: hi
  text: यीशु ने कहा, “जो पिता और माता को जान लेगा[a], वे उसे ‘एक वेश्या का बेटा’[b][c] कहेंगे[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल में सापेक्ष भविष्यकाल है: भाव साधारण “जो जानता है” नहीं, बल्कि “जो जान लेगा/जानने आएगा” है।'
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द का अर्थ “संतान” या “बच्चा” भी हो सकता है; यहाँ पुल्लिंग रूप और प्रचलित पदबंध के कारण “बेटा” रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: “वेश्या” के कॉप्टिक शब्द का आरंभिक ⲡ उसी शब्द का हिस्सा है, निश्चित उपपद नहीं; इसलिए अर्थ “एक वेश्या” है, “उस वेश्या” नहीं।
    reason: textual_morphology
  - marker: d
    text: “कहेंगे” का अनुवाद “नाम देंगे” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  choice: जान लेगा
  rationale: सापेक्ष भविष्यकाल की भावी/प्राप्तिजन्य छाया को साधारण वर्तमान ‘जानता है’ के बजाय ‘जान लेगा’ से व्यक्त किया गया है।
- source_word: ⲡⲉⲓⲱⲧ ⲙⲛ ⲡⲙⲁⲁⲩ
  choice: पिता और माता
  rationale: दोनों संज्ञाओं की निश्चितता को हिन्दी में स्वाभाविक रूप से बिना किसी अतिरिक्त संकेतक के व्यक्त किया गया है; आरंभिक अक्षर बड़े करके कोई धर्मवैज्ञानिक पहचान आरोपित नहीं की गई।
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲙⲟⲩⲧⲉ ⲉⲛⲧⲟϥ
  choice: वे उसे … कहेंगे
  rationale: स्रोत के स्पष्ट बहुवचन कर्ता और सक्रिय वाक्य-विन्यास को रखा गया है। ‘वे’ का संदर्भ स्रोत की तरह अनिर्दिष्ट रहने दिया गया है।
- source_word: ⲡϣⲏⲣⲉ
  choice: बेटा
  rationale: यद्यपि शब्द का अर्थ ‘संतान/बच्चा’ भी हो सकता है, पुल्लिंग निर्धारक और मातृ-संबंधी अपमानसूचक पदबंध में ‘बेटा’ अधिक उपयुक्त है।
- source_word: ⲡⲟⲣⲛⲏ
  choice: एक वेश्या
  rationale: यह यूनानी πόρνη से आया स्त्रीलिंग शब्द है; आरंभिक ⲡ शब्द का अंग है, निश्चित उपपद नहीं। अतः अनिश्चित अर्थ ‘एक वेश्या’ चुना गया। ‘वेश्या’ अर्थ की कठोरता रखता है, पर अनावश्यक बोलचाल की गाली नहीं जोड़ता।
theological_decisions:
- issue: ‘पिता और माता’ की पहचान
  choice: सामान्य संज्ञाओं के रूप में ‘पिता और माता’
  alternative: धर्मवैज्ञानिक उपाधियों के रूप में विशेष रूप से चिह्नित करना
  rationale: स्रोत में निश्चित उपपद हैं, पर ऐसी कोई स्पष्ट सूचना नहीं जो इन्हें अनिवार्यतः दिव्य उपाधियाँ ठहराए; अनिश्चितता को खुला रखा गया है।
- issue: अनिर्दिष्ट बहुवचन कर्ता
  choice: ‘वे’
  alternative: ‘लोग’ या कर्मवाच्य ‘उसे कहा जाएगा’
  rationale: ‘लोग’ जोड़ने से कर्ता की पहचान कुछ अधिक निश्चित होती और कर्मवाच्य से स्रोत का सक्रिय रूप मिट जाता; ‘वे’ मूल की तनावपूर्ण संदर्भ-अस्पष्टता बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और गरिमापूर्ण रखी गई है। कठोर अपमानसूचक कथन को नरम नहीं किया गया, पर अधिक भद्दा पर्याय भी नहीं अपनाया गया। स्रोत का अनिर्दिष्ट ‘वे’ और पिता-माता की संभावित पहचान जानबूझकर खुली रखी गई है।
