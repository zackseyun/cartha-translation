  source_fidelity: Hindi rendering accurately represents the Sahidic relative-future construction (‘जो ... जान लेगा’), the definite nouns ‘पिता और माता,’ the explicit but unspecified plural subject (‘वे’), and the active future ‘कहेंगे.’ It correctly reflects the zero-article loanword ⲡⲟⲣⲛⲏ as ‘एक वेश्या,’ rather than mistakenly treating its initial ⲡ as a definite article.
  naturalness: The sentence is natural, concise modern standard Hindi. ‘पिता और माता’ appropriately preserves the restrained, formal register, and ‘एक वेश्या का बेटा’ is idiomatic while retaining the source’s disparaging epithet without gratuitously intensifying it.
  terminology: ‘यीशु,’ ‘पिता,’ ‘माता,’ ‘बेटा,’ and ‘वेश्या’ are suitable and non-doctrinal. The translation avoids interpretive capitalization and preserves the source’s ambiguity concerning the identity of the father and mother and of ‘वे.’
