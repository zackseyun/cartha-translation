  verdict: approve
  source_fidelity: The Hindi accurately follows the Sahidic Coptic sequence, including the deliberately difficult contrast of hearing ‘in your ear’ and proclaiming ‘in the other ear.’ It retains both ‘those entering’ and ‘those going out,’ as does the source and English audit text. The lamp, measuring vessel, hidden place, lampstand, and visible light are all represented without interpretive expansion.
  naturalness: The Hindi is fluent and suitably elevated for a saying. The interrupted phrase ‘उसे दूसरे कान में’ is intentionally unusual, reflecting the source’s unusual wording; the punctuation makes it readable without falsely resolving the difficulty. ‘दीपक,’ ‘दीवट,’ and ‘प्रकाश’ form a coherent and natural register.
  terminology: 'Key terms are appropriate: ‘घोषित करो’ conveys public proclamation, ‘नापने की टोकरी’ responsibly renders the measuring-container sense, and ‘दीवट’ is an established Hindi term for a lampstand. The explanatory notes are restrained and accurately anchored to markers a–c.'
