base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
translation:
  language: hi
  text: यीशु ने कहा, “जो कुछ तुम अपने एक कान में सुनोगे—उसे दूसरे कान में[a]—अपनी छतों पर से घोषित करो। क्योंकि कोई दीपक जलाकर उसे नापने की टोकरी[b] के नीचे नहीं रखता, न किसी छिपी जगह में रखता है; बल्कि उसे दीवट पर रखता है, ताकि भीतर आनेवाले और बाहर जानेवाले सभी उसका प्रकाश देख सकें।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसे दूसरे कान में” का वाक्यांश मूल कॉप्टिक में भी असामान्य है। इसका आशय संभवतः यह है कि कान में सुनी बात को छतों से खुलेआम घोषित किया जाए; पर अनुवाद में मूल की कठिन अभिव्यक्ति बनाए रखी गई है।
    reason: स्रोत-पाठ की वास्तविक वाक्यगत अस्पष्टता बताने के लिए।
  - marker: b
    text: मूल में ऐसा पात्र है जिसका उपयोग अनाज आदि नापने के लिए होता था; उसे उलटकर दीपक ढका जा सकता था।
    reason: प्राचीन घरेलू वस्तु का अर्थ आधुनिक पाठक के लिए स्पष्ट करने के लिए।
  - marker: c
    text: कॉप्टिक पाठ में “भीतर आनेवाले और बाहर जानेवाले” दोनों हैं।
    reason: समानांतर परंपराओं से भिन्न इस पाठ-रूप को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ⲧⲁϣⲉⲟⲉⲓϣ
  choice: घोषित करो
  rationale: यह क्रिया सार्वजनिक रूप से प्रचार या घोषणा करने का भाव रखती है; ‘घोषित करो’ छतों से खुले प्रचार के संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: ⲛⲉⲧⲛϫⲉⲛⲉⲡⲱⲣ
  choice: अपनी छतों पर से
  rationale: बहुवचन ‘तुम्हारी छतों’ को हिन्दी में सार्वजनिक पुकार के स्वाभाविक मुहावरे के अनुसार ‘अपनी छतों पर से’ दिया गया है।
- source_word: ϩⲏⲃⲥ
  choice: दीपक
  rationale: तेल से जलने वाले प्रकाश-साधन के लिए साधारण आधुनिक हिन्दी शब्द; ‘दीया’ भी संभव है, पर ‘दीपक’ दीवट के साथ स्पष्ट रहता है।
- source_word: ⲙⲁⲁϫⲉ (in ϩⲁⲙⲁⲁϫⲉ)
  choice: नापने की टोकरी
  rationale: यहाँ शब्द पात्र/माप के अर्थ में है, कान के अर्थ में नहीं। ‘नापने की टोकरी’ आकार और उपयोग दोनों को सामान्य पाठक के लिए स्पष्ट करती है।
- source_word: ⲗⲩⲭⲛⲓⲁ
  choice: दीवट
  rationale: दीपक रखने के आधार के लिए संक्षिप्त, प्रचलित बाइबिलीय हिन्दी शब्द।
- source_word: ⲟⲩⲟⲉⲓⲛ
  choice: प्रकाश
  rationale: शाब्दिक अर्थ को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘एक कान…दूसरे कान’ वाले कठिन वाक्य का अर्थ
  choice: असामान्य अभिव्यक्ति और उसका क्रम बनाए रखा गया
  alternative: इसे सरल करके ‘जो तुम्हारे कान में कहा जाए, उसे छतों से प्रचार करो’ करना
  rationale: कॉप्टिक पाठ का ‘दूसरे कान में’ वाक्यांश वास्तविक पाठगत/अर्थगत कठिनाई है। उसे हटाना या किसी परिचित समानांतर के अनुसार सुधारना मूल की अस्पष्टता को अनुचित रूप से मिटा देता।
- issue: भीतर आने और बाहर जाने वालों का संदर्भ
  choice: दोनों समूहों को यथावत रखा गया
  alternative: केवल ‘घर में आने वाले’ कहना
  rationale: स्रोत स्पष्ट रूप से प्रवेश करने और बाहर जाने, दोनों का उल्लेख करता है; इसे किसी विशेष आध्यात्मिक अर्थ में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली सरल, गरिमापूर्ण और मौखिक कहावत के अनुकूल रखी गई है। ‘घोषित करो’, ‘दीपक’ और ‘प्रकाश’ सामान्य पाठकों के लिए सहज हैं, जबकि ‘दीवट’ संदर्भ में स्पष्ट और संक्षिप्त पारंपरिक शब्द है। कठिन आरंभिक वाक्य को प्रवाह के लिए विराम-चिह्नों से सँभाला गया है, पर उसकी अस्पष्टता नहीं मिटाई गई।
