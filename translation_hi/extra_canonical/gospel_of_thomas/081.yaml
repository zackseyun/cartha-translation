base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/081.yaml
  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
translation:
  language: hi
  text: यीशु ने कहा, “जो धनी हो गया है, वह राजा बने[a]; और जिसके पास शक्ति है[b], वह उसे त्याग दे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह क्रिया “राज करे” या “शासन करे” भी अनूदित हो सकती है; “राजा बने” मूल में ‘राजा’ से जुड़ी तीखी अभिव्यक्ति को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “शक्ति” के मूल शब्द का अर्थ “सामर्थ्य,” “बल” या “क्षमता” भी हो सकता है; कुछ प्रसंगों में यह चमत्कारी शक्ति को भी दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: कॉप्टिक पाठ में “उसे” जैसा कर्म व्यक्त नहीं है; हिन्दी में यह पूर्वोक्त “शक्ति” को संकेत करने के लिए जोड़ा गया है।
    reason: implicit_object
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: कथन आरम्भ करने वाली कॉप्टिक अभिव्यक्ति का स्वाभाविक और मानक हिन्दी रूप।
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  choice: जो धनी हो गया है
  rationale: सापेक्ष पूर्णकाल और ‘धनी बनना’—दोनों अर्थों को स्पष्ट रूप से बनाए रखता है।
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲣⲣⲣⲟ
  choice: वह राजा बने
  rationale: आज्ञार्थक/प्रेरणार्थक भाव तथा ‘राजा होना/राजा बनना’ की तीखी शब्दावली को सुरक्षित रखता है; केवल ‘राज करे’ कहने से संज्ञात्मक बिंब दब जाता।
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ ⲛⲟⲩⲇⲩⲛⲁⲙⲓⲥ
  choice: जिसके पास शक्ति है
  rationale: स्वामित्व की कॉप्टिक रचना को सहज हिन्दी में व्यक्त करता है। यूनानी आगत शब्द ⲇⲩⲛⲁⲙⲓⲥ के व्यापक अर्थ के लिए ‘शक्ति’ रखा गया है।
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲁⲣⲛⲁ
  choice: वह उसे त्याग दे
  rationale: ⲁⲣⲛⲁ के ‘इनकार करना/त्याग देना’ अर्थ में यहाँ पूर्वोक्त शक्ति से विमुख होने का भाव है। हिन्दी में आवश्यक कर्म ‘उसे’ जोड़ा गया है, यद्यपि कॉप्टिक में वह निहित है।
theological_decisions:
- issue: धनवान के राजा बनने और शक्तिशाली के शक्ति त्यागने के बीच तनाव
  choice: दोनों खंडों को बिना व्याख्यात्मक विस्तार के समानांतर और विरोधाभासी रूप में रखा गया।
  alternative: ‘राजा बने’ को रूपकात्मक ‘अपने ऊपर शासन करे’ बनाना, अथवा ‘शक्ति’ को विशेष रूप से सांसारिक/चमत्कारी शक्ति कहना।
  rationale: मूल पाठ इन अर्थों को स्पष्ट नहीं करता; किसी विशिष्ट नैतिक, राजनीतिक या आध्यात्मिक व्याख्या को अनुवाद में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। मूल कथन की असामान्य समानांतरता और अर्थगत तनाव को समझाकर समतल नहीं किया गया है।
