base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/036.yaml
  text: Jesus said[a], Do not be anxious from morning until evening, and from evening until morning[c][b], about what you will put on yourselves.
translation:
  language: hi
  text: यीशु ने कहा, “सुबह से शाम तक और शाम से सुबह तक इस बात की चिंता मत करो[a] कि तुम अपने ऊपर क्या पहनोगे।”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त क्रिया का अर्थ “चिंता करना,” “व्याकुल होना,” या पुराने मुहावरे में “सोच-विचार में पड़े रहना” हो सकता है। स्पष्ट और स्वाभाविक हिन्दी के लिए “चिंता मत करो” चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: कथन 36 के यूनानी साक्षी POxy 655 में भोजन, सोसन के फूलों और कद से संबंधित अतिरिक्त अंश हैं; वस्त्र वाला खंड ही इस कॉप्टिक पाठ से मेल खाता है। यहाँ नाग हम्मादी के कॉप्टिक पाठ का अनुसरण किया गया है।
    reason: textual_variant
  - marker: c
    text: पांडुलिपि के इस स्थान पर संपादक एक अक्षर की पूर्ति करते हैं। सामान्यीकृत पाठ इस वाक्यांश को “तुम क्या पहनोगे” के अर्थ में समझता है।
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  choice: चिंता मत करो
  rationale: नकारात्मक आज्ञा चिंता या व्याकुलता न करने को कहती है। यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है; ‘फ़िक्र मत करो’ की अपेक्षा अधिक गरिमापूर्ण और व्यापक रूप से मानक है।
- source_word: ϫⲓⲛϩⲧⲟⲟⲩⲉ ϣⲁⲣⲟⲩϩⲉ
  choice: सुबह से शाम तक
  rationale: यह मूल के सीधे समय-विस्तार और समानांतर संरचना को बनाए रखता है।
- source_word: ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ϣⲁϩⲧⲟⲟⲩⲉ
  choice: शाम से सुबह तक
  rationale: पहले समय-विस्तार के साथ मूल की सममित अभिव्यक्ति सुरक्षित रखता है।
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁ–
  choice: क्या ... पहनोगे
  rationale: शीर्षहीन संबंधवाचक रचना और भविष्यकाल को सहज हिन्दी प्रश्नवाचक-संबंधवाचक वाक्यांश में व्यक्त करता है।
- source_word: ϯⲛⲧⲟϥ
  choice: पहनोगे
  rationale: वस्त्र धारण करने के प्रसंग में यह ‘अपने ऊपर रखोगे’ की अपेक्षा अधिक स्वाभाविक है, जबकि मूल की ठोस क्रिया का आशय बनाए रखता है।
- source_word: ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  choice: अपने ऊपर
  rationale: मूल के पूर्वसर्गीय और आत्मवाचक बल को बनाए रखता है; केवल ‘पहनोगे’ कहने पर यह सूक्ष्मता खो जाती।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: मूल के साधारण समन्वय तथा समानांतर वाक्य-विन्यास को सुरक्षित रखता है।
