base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/038.yaml
  text: Jesus said[a], “Many times you have desired to hear these words that I am saying to you, and you have no other from whom to hear them. There will be days when you will seek me[d][c][b], and you will not find me.”
translation:
  language: hi
  text: '**कथन 38**


    यीशु ने कहा, “बहुत बार तुमने ये वचन[a] सुनने की इच्छा की है, जिन्हें मैं तुमसे कह रहा हूँ; और तुम्हारे लिए कोई दूसरा नहीं है जिससे तुम उन्हें सुन सको।[b] दिन आएँगे[c] जब तुम मुझे ढूँढ़ोगे,[d] पर मुझे पाओगे नहीं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक पाठ पहले शाब्दिक रूप से एकवचन ‘यह वचन’ कहता है, फिर अगले खंड में बहुवचन ‘उन्हें’ की ओर चला जाता है। सहज हिंदी के लिए मुख्य पाठ में ‘ये वचन’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: कॉप्टिक रचना का आशय शाब्दिक रूप से ‘तुम्हारे लिए कोई दूसरा नहीं है, जिससे उन्हें सुन सको’ है; यहाँ ‘जिससे’ उस व्यक्ति को दर्शाता है जिसके पास से ये वचन सुने जा सकते हैं।
    reason: dialect_note
  - marker: c
    text: शाब्दिक रूप लगभग ‘कुछ दिन अस्तित्व में आएँगे’ है—यह कॉप्टिक में भविष्य व्यक्त करने वाली अस्तित्वसूचक रचना है।
    reason: cultural_note
  - marker: d
    text: इसी प्रकार के भाव के लिए यूहन्ना 7:34; 8:21; 13:33 देखें। यहाँ थोमा के अपने शब्दों को यूहन्ना के शब्दों के अनुरूप नहीं बनाया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲁϩ ⲛⲥⲟⲡ
  choice: बहुत बार
  rationale: यह सहिदी मुहावरा शाब्दिक रूप से ‘बहुत बार’ है। हिंदी में भी यह सहज है और कथन की सीधी लय बनाए रखता है।
- source_word: ⲣⲉⲡⲓⲑⲩⲙⲉⲓ
  choice: इच्छा की है
  rationale: यूनानी मूल का यह क्रियापद ‘इच्छा करना/लालसा रखना’ व्यक्त करता है। यहाँ ‘इच्छा की है’ स्वाभाविक है और अनावश्यक भावात्मक तीव्रता नहीं जोड़ता।
- source_word: ⲉⲥⲱⲧⲙ
  choice: सुनने
  rationale: मूल अर्थ ‘सुनना’ है। ‘मानना’ या ‘पालन करना’ जैसा व्याख्यात्मक अर्थ नहीं जोड़ा गया।
- source_word: ⲡⲉⲓϣⲁϫⲉ ⲡⲁⲓ (with subsequent ⲛⲛⲧⲟⲟⲩ)
  choice: मेरे ये वचन
  rationale: कॉप्टिक पहले एकवचन ‘यह वचन/कथन’ रखता है और फिर बहुवचन सर्वनाम की ओर जाता है। मुख्य पाठ में सहज हिंदी के लिए बहुवचन किया गया है और पाठगत संख्या-परिवर्तन को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ⲉⲧⲉⲣⲉ … ϫⲱ ⲛⲛⲧⲟⲟⲩ ⲛⲁⲛⲧⲱⲧⲛ
  choice: जिन्हें मैं तुमसे कह रहा हूँ
  rationale: दुरेटिव रूप वर्तमान में चल रही वाणी को दिखाता है; ‘कह रहा हूँ’ उसकी तात्कालिकता सुरक्षित रखता है।
- source_word: ⲙⲛⲧⲁⲛⲧⲱⲧⲛ ⲕⲉⲟⲩⲁ
  choice: तुम्हारे लिए कोई दूसरा नहीं है
  rationale: अस्तित्व/अधिकार संबंधी कॉप्टिक रचना का यह स्वाभाविक हिंदी रूप है; ‘दूसरा’ व्यक्ति को सूचित करता है।
- source_word: ⲛ̄ⲧⲟϥ (after ⲕⲉⲟⲩⲁ)
  choice: जिससे
  rationale: अनिश्चित पूर्वपद ‘कोई दूसरा’ के बाद यह सर्वनाम स्रोत-संबंधी अर्थ देता है—‘जिससे/जिसके पास से’।
- source_word: ⲟⲩⲛ ϩⲉⲛ ϩⲟⲟⲩ ⲛⲁϣⲱⲡⲉ
  choice: ऐसे दिन आएँगे
  rationale: कॉप्टिक भविष्य-अस्तित्वसूचक मुहावरे का संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: ⲛⲧⲉ … ϣⲓⲛⲉ ⲛⲥⲁⲁⲛⲟⲕ
  choice: जब तुम मुझे ढूँढ़ोगे
  rationale: यहाँ कालवाचक उपवाक्य और खोजने का भाव है। ‘ढूँढ़ना’ सामान्य आधुनिक हिंदी में सीधा और स्पष्ट है।
- source_word: ⲛⲁϩⲉ ⲁⲛ ⲉ ⲁⲛⲟⲕ
  choice: मुझे पाओगे नहीं
  rationale: क्रिया का अर्थ ‘पाना/खोजकर पाना’ है। अंतिम नकार को हिंदी की संक्षिप्त, प्रभावपूर्ण संरचना में रखा गया है।
theological_decisions:
- issue: भविष्य में यीशु को ढूँढ़ने पर न पाने का आशय
  choice: कथन को बिना व्याख्यात्मक विस्तार के रखा गया है
  alternative: इसे यीशु की मृत्यु, प्रस्थान, अनुपस्थिति या आध्यात्मिक अप्राप्यता में से किसी एक अर्थ से स्पष्ट करना
  rationale: मूल कथन कारण या परिस्थिति निर्धारित नहीं करता। किसी एक धर्मवैचारिक व्याख्या को पाठ में जोड़ना उसकी वास्तविक अस्पष्टता और तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण रखी गई है। ‘वचन’ धार्मिक और साहित्यिक प्रसंग में स्वाभाविक है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा है। एकवचन-बहुवचन के कॉप्टिक बदलाव को मुख्य पाठ में सहज बनाया गया है, पर पादटिप्पणी में पारदर्शी रूप से सुरक्षित रखा गया है।
