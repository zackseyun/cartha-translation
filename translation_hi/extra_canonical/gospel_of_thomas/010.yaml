base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/010.yaml
  text: Jesus said[a], “I have cast a fire upon the world, and look[c][b], I am guarding it until it blazes.”
translation:
  language: hi
  text: यीशु ने कहा, “मैंने संसार पर आग डाली है; और देखो,[a] मैं उसकी रखवाली कर रहा हूँ[b] जब तक कि वह धधक न उठे।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “देखो” उस संकेतसूचक मुहावरे का अनुवाद है जिसका अर्थ “निहारो” या “ध्यान दो” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “रखवाली कर रहा हूँ” का अनुवाद “उस पर निगाह रख रहा हूँ” या “उसकी निगरानी कर रहा हूँ” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'लूका 12:49 से तुलना करें: “मैं पृथ्वी पर आग लगाने आया हूँ…”। यहाँ “पृथ्वी” के स्थान पर “संसार” है और कथन आगे कहता है, “मैं उसकी रखवाली कर रहा हूँ जब तक कि वह धधक न उठे।”'
    reason: cross_reference
lexical_decisions:
- source_word: ⲁⲁⲛⲟⲕ … ⲛⲟⲩϫⲉ
  choice: मैंने … डाली है
  rationale: ⲛⲟⲩϫⲉ का मूल अर्थ ‘फेंकना/डालना’ है। पूर्ण हो चुकी किंतु वर्तमान से जुड़ी क्रिया को हिन्दी में ‘मैंने … डाली है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲛⲟⲩⲕⲱϩⲧ
  choice: आग
  rationale: ⲕⲱϩⲧ का सीधा अर्थ ‘आग’ है। हिन्दी में इस द्रव्यवाचक संज्ञा के साथ अनिश्चित लेख की अलग अभिव्यक्ति आवश्यक नहीं है।
- source_word: ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: संसार पर
  rationale: ⲉϫⲛ का अर्थ ‘पर’ और यूनानी से आए ⲕⲟⲥⲙⲟⲥ का यहाँ व्यापक अर्थ ‘संसार’ है; यह ‘पृथ्वी’ से भिन्न स्रोत-पाठ की व्यापकता बनाए रखता है।
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेतसूचक मुहावरा है। ‘देखो’ आधुनिक, संक्षिप्त और तात्कालिक है; ‘निहारो’ या ‘ध्यान दो’ भी संभावित हैं।
- source_word: ϩⲁⲣⲉϩ
  choice: रखवाली कर रहा हूँ
  rationale: क्रिया में पहरा देने, निगरानी रखने या सुरक्षित रखने की अर्थ-छाया है। ‘रखवाली’ उसकी निरंतर और कुछ हद तक संरक्षणात्मक शक्ति बनाए रखती है।
- source_word: ⲉⲛⲧⲟϥ
  choice: उसकी
  rationale: पुल्लिंग एकवचन सर्वनाम पहले उल्लिखित ‘आग’ की ओर लौटता है। हिन्दी में ‘आग’ स्त्रीलिंग होने के कारण स्वाभाविक संदर्भ ‘उसकी’ है।
- source_word: ϣⲁⲛⲧⲉ
  choice: जब तक कि
  rationale: यह समय की सीमा बताने वाला संयोजक है और आगामी घटना तक जारी क्रिया को व्यक्त करता है।
- source_word: ϫⲉⲣⲟ
  choice: धधक न उठे
  rationale: क्रिया केवल जलने के बजाय भड़कने या तेज़ी से प्रज्वलित होने का बिंब देती है। ‘धधक उठना’ उसकी जीवंतता को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: आग के प्रतीक का आशय
  choice: अनिर्दिष्ट रखा गया
  alternative: इसे न्याय, शुद्धिकरण, प्रकाशन या आत्मिक उत्कंठा के रूप में स्पष्ट करना
  rationale: कथन स्वयं आग का धार्मिक आशय नहीं खोलता; किसी एक व्याख्या को पाठ में जोड़ना वास्तविक प्रतीकात्मक तनाव को समाप्त कर देता।
- issue: रखवाली का उद्देश्य
  choice: आग की रखवाली का सीधा, किंतु रहस्यमय कथन बनाए रखा गया
  alternative: इसे आग को दबाए रखने, सुरक्षित रखने या फैलाने के रूप में समझाकर अनुवाद करना
  rationale: ϩⲁⲣⲉϩ संरक्षण या निगरानी दोनों अर्थ-छायाएँ रख सकता है और पाठ यह नहीं बताता कि रखवाली किस उद्देश्य से है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और मौखिक कथन-सदृश रूप अपनाया गया है। ‘यीशु ने कहा’ सामान्य पाठक के लिए सहज है। ‘संसार’, ‘रखवाली’ और ‘धधक उठे’ स्रोत की व्यापकता, निरंतर क्रिया और ज्वलंत बिंब को बनाए रखते हैं। सभी टिप्पणियों के चिह्न मुख्य पाठ में उनके संबंधित पदों के बाद रखे गए हैं।
