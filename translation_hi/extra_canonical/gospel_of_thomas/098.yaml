base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/098.yaml
  text: Jesus said[a], “The Father’s kingship is like a man who wanted to kill a magnate. He drew the sword in his house and drove it into the wall, so that he might find out whether his hand would be strong enough[e][d][c][b]; then he killed the magnate.”
translation:
  language: hi
  text: यीशु ने कहा, “पिता की राजसत्ता[a] उस व्यक्ति के समान है जो एक प्रभावशाली व्यक्ति[b] को मार डालना चाहता था। उसने अपने घर में तलवार खींची और उसे दीवार में घोंप दिया, ताकि वह जान सके कि उसका हाथ भीतर तक जाने के लिए पर्याप्त मजबूत है या नहीं[c]। तब उसने उस प्रभावशाली व्यक्ति को मार डाला।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द अमूर्त रूप में ‘राज करना’, ‘शासन’ या ‘राजसत्ता’ का अर्थ देता है, किसी भूभाग का नहीं; “पिता का राज्य” भी एक संभव अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: 'यह यूनानी से लिया गया शब्द किसी ऊँचे दर्जे वाले ‘बड़े आदमी’ को दर्शाता है। अन्य संभव अनुवाद हैं: “महान व्यक्ति”, “कुलीन व्यक्ति” या “शक्तिशाली व्यक्ति”।'
    reason: lexical_alternative
  - marker: c
    text: मूल वाक्यांश में हाथ के बलवान या समर्थ होने का भाव है, साथ ही उसका अधिक शाब्दिक अर्थ “उसका हाथ भीतर जा सकेगा” भी हो सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: राज
  rationale: यह अमूर्त भाववाचक रूप शासन या राज करने की अवस्था को दर्शाता है। हिंदी में “राज” स्वाभाविक रूप से शासन और राज्य—दोनों की संभावित छाया बनाए रखता है; टिप्पणी में अधिक स्पष्ट विकल्प दिया गया है।
- source_word: ⲡⲉⲓⲱⲧ
  choice: पिता
  rationale: मूल पाठ में निश्चित रूप “पिता” है, “मेरे पिता” नहीं।
- source_word: ⲉⲣⲉⲛⲧⲟⲥⲧⲟⲛⲧⲛ
  choice: के समान है
  rationale: यह दृष्टांत आरंभ करने वाली सामान्य कॉप्टिक उपमा-रचना है।
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: बड़ा अधिकारी
  rationale: यूनानी से लिया गया यह शब्द ऊँचे पद या सामाजिक प्रभाव वाले ‘बड़े आदमी’ को सूचित करता है। “बड़ा अधिकारी” आधुनिक हिंदी में इसका सामाजिक-पदगत भाव स्पष्ट करता है।
- source_word: ϣⲱⲗⲙ ⲛⲡⲥⲏϥⲉ
  choice: तलवार खींची
  rationale: तलवार को बाहर निकालने के लिए हिंदी का स्वाभाविक और संक्षिप्त प्रयोग।
- source_word: ϫⲟⲧⲥ ⲛⲡϫⲟ
  choice: उसे दीवार में घोंप दिया
  rationale: क्रिया प्रहार करके भीतर धँसाने का बलपूर्ण भाव रखती है; सर्वनाम का संदर्भ तलवार से है।
- source_word: ⲉⲓⲙⲉ
  choice: जान सके
  rationale: उद्देश्यवाचक वाक्य में परीक्षण द्वारा जान लेने का अर्थ है।
- source_word: ⲧⲱⲕ ⲉϩⲟⲩⲛ
  choice: पर्याप्त बलवान होगा
  rationale: ⲧⲱⲕ शक्ति या सामर्थ्य पर बल देता है; ⲉϩⲟⲩⲛ का शाब्दिक ‘भीतर जाना’ टिप्पणी में सुरक्षित रखा गया है, जबकि मुख्य पाठ में प्रसंगानुकूल स्वाभाविक हिंदी दी गई है।
- source_word: ϩⲱⲧⲙ
  choice: मार डाला
  rationale: हत्या की सीधी और कठोर कथन-शैली को बिना कानूनी या धार्मिक अर्थ जोड़े व्यक्त करता है।
theological_decisions:
- issue: पिता के ⲡⲙⲛⲧⲣⲣⲟ का स्वरूप
  choice: पिता का राज
  alternative: पिता का राज्य / पिता की राजसत्ता
  rationale: “राज” शासन और क्षेत्र दोनों की अर्थ-संभावना खुली रखता है, पर मूल अमूर्त भाव को केवल किसी भूभाग के रूप में सीमित नहीं करता।
- issue: दृष्टांत में हिंसा का अर्थ
  choice: हिंसक कार्यों को मूल की भाँति सीधे बयान किया गया है
  alternative: उन्हें आध्यात्मिक रूपक बनाकर स्पष्ट करना
  rationale: मूल पाठ कोई व्याख्या नहीं देता; इसलिए अनुवाद ने हिंसा की नैतिक या आध्यात्मिक व्याख्या आरोपित नहीं की।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “राज” सामान्य हिंदी में संक्षिप्त और परिचित है; “बड़ा अधिकारी” दुर्लभ विदेशी पदनाम की तुलना में साधारण पाठक के लिए स्पष्ट है। दृष्टांत की संक्षिप्तता, विचित्रता और नैतिक तनाव को व्याख्यात्मक विस्तार के बिना बनाए रखा गया है।
