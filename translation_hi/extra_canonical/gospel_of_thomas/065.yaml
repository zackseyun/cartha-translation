  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दास’ स्रोत की सामाजिक कठोरता को बनाए रखता है, जबकि ‘अंगूर का बाग’, ‘उपज’ और ‘आदर करेंगे’ सामान्य हिन्दी पाठक के लिए स्वाभाविक हैं। छोटे वाक्यों और प्रत्यक्ष कथन से दृष्टांत की मौखिक लय सुरक्षित रखी गई है।
