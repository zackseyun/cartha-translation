base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/065.yaml
  text: He said[1], "A good man had a vineyard. He gave it to some farmers so that they would work it and he would receive its fruit from them. He sent his servant so that the farmers would give him the fruit of the vineyard. They seized his servant and beat him; they almost killed him. The servant went and told his master. His master said, 'Perhaps he did not know them.' He sent another servant[2]. The farmers beat the other one. Then the master sent his son. He said, 'Perhaps they will respect my son.' Those farmers, since they knew that he was the heir of the vineyard, seized him and killed him. Whoever has ears[3], let him hear."
translation:
  language: hi
  text: उसने कहा, “एक भले[a] आदमी के पास अंगूर का एक बाग था। उसने उसे कुछ किसानों को दे दिया, ताकि वे उसमें काम करें और वह उनसे उसकी उपज पाए। उसने अपने दास को भेजा, ताकि किसान उसे अंगूर के बाग की उपज दें। उन्होंने उसके दास को पकड़ लिया और उसे पीटा; वे उसे लगभग मार ही डालते।[b] दास ने जाकर अपने स्वामी को यह बात बता दी। उसके स्वामी ने कहा, ‘शायद उसने उन्हें नहीं पहचाना।’[c] उसने एक और दास को भेजा। किसानों ने उस दूसरे को भी पीटा। तब स्वामी ने अपने बेटे को भेजा। उसने कहा, ‘शायद वे मेरे बेटे का आदर करेंगे।’ उन किसानों ने, क्योंकि वे जानते थे कि वही अंगूर के बाग का वारिस है, उसे पकड़ लिया और मार डाला। जिसके कान हों, वह सुने।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में शब्द आंशिक रूप से क्षतिग्रस्त है और उसे ⲭⲣⲏⲥⲧⲟⲥ, यूनानी χρηστός (‘भला’), के रूप में पुनर्स्थापित किया गया है। कुछ विद्वान इसे उच्चारण-संबंधी वर्तनी के कारण χρήστης (‘लेनदार’ या ‘सूदखोर’) भी समझते हैं।
    reason: textual_variant
  - marker: b
    text: कॉप्टिक में शाब्दिक मुहावरा है, ‘थोड़ा ही और, तो वे उसे मार डालते’; इसका अर्थ है कि उन्होंने उसे लगभग मार डाला।
    reason: lexical_alternative
  - marker: c
    text: पांडुलिपि का पाठ शाब्दिक रूप से ‘उसने उन्हें नहीं पहचाना’ है। अनेक अनुवाद अपेक्षित कथानक के अनुसार इसे ‘उन्होंने उसे नहीं पहचाना’ कर देते हैं, पर यहाँ पांडुलिपि का असामान्य पाठ सुरक्षित रखा गया है।
    reason: textual_variant
