  rationale: क्रिया का अर्थ पकड़ना, धर लेना या कब्जे में लेना है; हिंसक प्रसंग में ‘पकड़ लिया’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: समानार्थी सुसमाचारों के समानांतर दृष्टांतों से सामंजस्य
  choice: थॉमस की कॉप्टिक पांडुलिपि का स्वतंत्र रूप बनाए रखा गया।
  alternative: मत्ती, मरकुस या लूका से कुण्ड, मीनार, बाड़ या अनेक दासों जैसे विवरण जोड़ना।
  rationale: इस पाठ में वे विवरण नहीं हैं; उन्हें जोड़ने से थॉमस के विशिष्ट और कुछ हद तक तनावपूर्ण कथानक को चुपचाप बदल दिया जाता।
- issue: स्वामी के कथन में सर्वनाम का असामान्य संबंध
  choice: ‘शायद उसने उन्हें नहीं पहचाना’ रखा गया।
  alternative: ‘शायद उन्होंने उसे नहीं पहचाना’ कर देना।
  rationale: पांडुलिपि स्पष्टतः एकवचन कर्ता ‘उसने’ और बहुवचन कर्म ‘उन्हें’ देती है। अपेक्षित दृष्टांत-तर्क के अनुसार पाठ-संशोधन संभव है, पर अनुवाद में मूल पाठ को बदलना उचित नहीं।
- issue: बेटे और वारिस की पहचान का धर्मवैज्ञानिक विस्तार
  choice: केवल स्रोत के कथन ‘वही ... वारिस है’ का अनुवाद किया गया।
  alternative: बेटे को स्पष्ट रूप से यीशु, इस्राएल या किसी अन्य धर्मवैज्ञानिक प्रतीक से अभिन्न बताना।
  rationale: दृष्टांत व्याख्या आमंत्रित करता है, पर स्रोत स्वयं प्रतीकों की पहचान स्पष्ट नहीं करता; अनुवाद को यह तनाव खुला रखना चाहिए।
