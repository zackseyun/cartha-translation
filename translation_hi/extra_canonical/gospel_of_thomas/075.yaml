base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/075.yaml
  text: Jesus said[a], “Many are standing at the door[e][d][c][b], but it is the solitary ones who will enter into the place of the bridal chamber.”
translation:
  language: hi
  text: यीशु ने कहा, “बहुत-से लोग द्वार पर खड़े हैं[a], पर एकाकी लोग ही[b][d][e] विवाह-कक्ष के स्थान में[c] प्रवेश करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक मुहावरा शाब्दिक रूप से ‘अपने पैरों पर खड़े हैं’ कहता है; हिन्दी में इसे सहज रूप से ‘खड़े हैं’ किया गया है।
    reason: dialect_note
  - marker: b
    text: ⲙⲟⲛⲁⲭⲟⲥ का अर्थ ‘एकाकी’ या ‘अकेला’ हो सकता है और बाद में ‘मठवासी’ भी हुआ। थोमा में यह ‘एक/अखंड होने’ की ओर भी संकेत कर सकता है; इसलिए अर्थ को पूरी तरह निश्चित नहीं किया गया है।
    reason: lexical_alternative
  - marker: c
    text: मूल पाठ में केवल ‘विवाह-कक्ष’ नहीं, बल्कि स्पष्ट रूप से ‘विवाह-कक्ष का स्थान’ (ⲡⲙⲁ ⲛ̄ϣⲉⲗⲉⲉⲧ) है।
    reason: lexical_alternative
  - marker: d
    text: 'पांडुलिपि में बहुवचन रूप हैं: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ और ⲛⲉⲧⲛⲁⲃⲱⲕ, अर्थात ‘एकाकी लोग … जो प्रवेश करेंगे।’ मुख्य अनुवाद इन्हीं रूपों का अनुसरण करता है।'
    reason: textual_variant
  - marker: e
    text: 'सामान्यीकृत संपादकीय पाठ इसे एकवचन बनाता है: ‘पर एकाकी व्यक्ति ही वह है जो प्रवेश करेगा।’'
    reason: previous_rendering
lexical_decisions:
- source_word: ⲟⲩⲛϩⲁϩ
  choice: बहुत-से लोग
  rationale: यह अस्तित्वसूचक कॉप्टिक रचना है; हिन्दी में ‘बहुत-से लोग’ स्वाभाविक है और आरम्भिक बल को बनाए रखता है।
- source_word: ⲱϩⲉⲣⲁⲧⲛⲧⲟⲟⲩ
  choice: खड़े हैं
  rationale: शाब्दिक मुहावरा ‘अपने पैरों पर खड़े हैं’ है; हिन्दी में ‘खड़े हैं’ उसी अर्थ को सहज ढंग से व्यक्त करता है।
- source_word: ϩⲓⲣⲛⲡⲣⲟ
  choice: द्वार पर
  rationale: स्थानसूचक अर्थ ‘द्वार पर/के पास’ है; ‘द्वार पर’ संक्षिप्त और स्वाभाविक है।
- source_word: ⲁⲗⲗⲁ
  choice: पर
  rationale: यह तीखा विरोध दर्शाने वाला अव्यय है; आधुनिक हिन्दी में ‘पर’ उस विरोध को स्पष्ट रखता है।
- source_word: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ
  choice: एकाकी लोग
  rationale: यूनानी मूल का यह शब्द ‘एकाकी/अकेला’ और बाद के प्रयोग में ‘संन्यासी/मठवासी’ कह सकता है। यहाँ संस्थागत ‘मठवासी’ थोपने के बजाय थोमा में एकत्व और अकेलेपन की वास्तविक अस्पष्टता को ‘एकाकी’ से रखा गया है; पांडुलिपि का रूप बहुवचन है।
- source_word: ⲛⲉⲧⲛⲁⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: ही … प्रवेश करेंगे
  rationale: पांडुलिपि में बहुवचन संबंधवाचक भविष्य है—‘वे ही जो प्रवेश करेंगे’; हिन्दी की ‘ही’ वाली रचना पहचान और विरोध के बल को सहज रूप से व्यक्त करती है।
- source_word: ⲡⲙⲁ ⲛ̄ϣⲉⲗⲉⲉⲧ
  choice: विवाह-कक्ष के स्थान
  rationale: मूल में ‘स्थान’ स्पष्ट रूप से उपस्थित है; कुछ असामान्य लगने पर भी उसे हटाया नहीं गया। ‘विवाह-कक्ष’ bridal chamber का वर्तमान, गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: ⲙⲟⲛⲁⲭⲟⲥ का आशय
  choice: एकाकी लोग
  alternative: मठवासी; अकेले लोग; एकत्व वाले लोग
  rationale: पाठ यह स्पष्ट नहीं करता कि आशय सामाजिक एकाकीपन, आंतरिक एकत्व या बाद का मठवासी अर्थ है। मुख्य पाठ में ‘एकाकी’ इस तनाव को खुला रखता है और किसी संप्रदायगत व्याख्या को निर्णायक नहीं बनाता।
- issue: कर्ता की वचन-संख्या
  choice: पांडुलिपि के अनुसार बहुवचन—‘एकाकी लोग’
  alternative: संपादकीय सामान्यीकृत पाठ के अनुसार एकवचन—‘एकाकी व्यक्ति’
  rationale: भौतिक पांडुलिपि में बहुवचन लेख और बहुवचन संबंधवाचक रूप हैं; इसलिए मुख्य पाठ बहुवचन का अनुसरण करता है, जबकि सामान्यीकृत पाठ का एकवचन पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘द्वार’ और ‘प्रवेश’ साहित्यिक होते हुए सामान्य पाठकों के लिए स्पष्ट हैं। मूल के स्पष्ट ‘स्थान’ को बचाने के कारण अंतिम पद जानबूझकर थोड़ा असामान्य है।
