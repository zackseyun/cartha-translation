base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
translation:
  language: hi
  text: यीशु ने कहा, “जो कोई पिता की निन्दा करेगा, उसे क्षमा किया जाएगा; और जो कोई पुत्र की निन्दा करेगा, उसे क्षमा किया जाएगा। पर जो कोई पवित्र आत्मा की निन्दा करेगा, उसे क्षमा नहीं किया जाएगा—न धरती पर, न स्वर्ग में।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्रोत में अंतिम शब्द ठीक “न धरती पर, न स्वर्ग में” हैं; यहाँ “न इस युग में, न आने वाले युग में” नहीं कहा गया है।
    reason: समानान्तर परम्पराओं से भिन्न स्रोत-पाठ की स्थानिक अभिव्यक्ति को स्पष्ट करना।
lexical_decisions:
- source_word: ϫⲓⲟⲩⲁ
  choice: निन्दा करना
  rationale: यह कॉप्टिक क्रिया ईश्वर या पवित्र सत्ता के विरुद्ध निन्दात्मक वचन कहने के अर्थ में है। आधुनिक हिन्दी में “निन्दा करना” स्वाभाविक और धार्मिक संदर्भ के अनुकूल है; “शाप देना” अर्थ को अनावश्यक रूप से संकीर्ण कर सकता है।
- source_word: ⲕⲱ ⲉⲃⲟⲗ
  choice: क्षमा किया जाएगा
  rationale: स्रोत में सक्रिय तृतीय-पुरुष बहुवचन, शाब्दिक रूप से “वे उसे क्षमा करेंगे,” निष्क्रिय भाव व्यक्त करने की कॉप्टिक रीति है। हिन्दी में निष्क्रिय रूप आशय को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ⲡⲕⲁϩ
  choice: धरती
  rationale: स्वर्ग के साथ ब्रह्मांडीय युग्म में यह शब्द पृथ्वी/धरती को सूचित करता है। “धरती” साधारण आधुनिक हिन्दी में सहज है।
- source_word: ⲧⲡⲉ
  choice: स्वर्ग
  rationale: इस ब्रह्मांडीय युग्म में मानक अर्थ “स्वर्ग” है।
theological_decisions:
- issue: अंतिम वाक्यांश का स्थानिक बनाम कालगत अर्थ
  choice: न धरती पर, न स्वर्ग में
  alternative: न इस युग में, न आने वाले युग में
  rationale: कॉप्टिक पाठ स्पष्ट रूप से धरती और स्वर्ग का स्थानिक युग्म देता है। समानान्तर परम्परा की कालगत भाषा को यहाँ आरोपित नहीं किया गया।
- issue: पवित्र आत्मा के विरुद्ध निन्दा की अक्षमता
  choice: उसे क्षमा नहीं किया जाएगा
  alternative: वे उसे क्षमा नहीं करेंगे
  rationale: स्रोत की व्याकरणिक रीति को स्वाभाविक हिन्दी निष्क्रिय वाच्य में व्यक्त किया गया है, बिना इस प्रश्न को तय किए कि क्षमा देने वाला कर्ता कौन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “निन्दा” को संस्कृतनिष्ठ “ईशनिन्दा” की अपेक्षा चुना गया, क्योंकि स्रोत में पिता, पुत्र और पवित्र आत्मा तीनों के साथ एक ही क्रिया दोहराई गई है। विराम-चिह्न वाक्य की त्रिस्तरीय समानता और अंतिम विरोध को स्पष्ट करते हैं।
