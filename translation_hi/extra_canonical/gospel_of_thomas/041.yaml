base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/041.yaml
  text: Jesus said[a], “Whoever has something in his hand, they will give to him; and whoever does not have[f][e][d][c][b], they will take even the little that he has from him.”
translation:
  language: hi
  text: यीशु ने कहा, “जिसके हाथ में कुछ है[a], उसे दिया जाएगा[b]; और जिसके पास नहीं है, उससे वह थोड़ा-सा भी ले लिया जाएगा जो उसके पास है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक अधिकार-वाचक रचना में वस्तु-सर्वनाम है, जो यहाँ अनिर्दिष्ट या पूरक रूप से प्रयुक्त हो सकता है; वस्तु को अलग से नाम नहीं दिया गया है। सहज हिन्दी के लिए ‘कुछ’ जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: कॉप्टिक में दोनों क्रियाएँ तीसरे पुरुष बहुवचन में हैं—शाब्दिक रूप से ‘वे देंगे’ और ‘वे ले लेंगे’—पर यह बहुवचन अनिश्चित कर्ता को व्यक्त कर सकता है। इसलिए हिन्दी में स्वाभाविक कर्मवाच्य रखा गया है।
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: कथन-संग्रह की संक्षिप्त शैली में सामान्य भूतकाल स्वाभाविक है।
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: जिसके ... कुछ है
  rationale: सापेक्ष अधिकार-वाचक रचना है; वस्तु-सर्वनाम यहाँ स्पष्ट वस्तु नहीं बताता, इसलिए हिन्दी में ‘कुछ’ जोड़ा गया है।
- source_word: ϩⲛⲡⲉϥϭⲓϫ
  choice: हाथ में
  rationale: स्थानसूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ⲛⲧⲟⲟⲩⲛⲁϯ ⲛⲁⲛⲧⲟϥ
  choice: उसे और दिया जाएगा
  rationale: कॉप्टिक का तृतीय पुरुष बहुवचन यहाँ अनिश्चित/अव्यक्त कर्ता के रूप में काम करता है; हिन्दी कर्मवाच्य वही अर्थ स्वाभाविक ढंग से देता है। ‘और’ प्राप्त मात्रा की वृद्धि को स्पष्ट करता है, बिना वस्तु निश्चित किए।
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲛⲧⲁⲛⲧⲟϥ
  choice: जिसके पास नहीं है
  rationale: नकारात्मक अधिकार-वाचक सापेक्ष रचना का स्वाभाविक हिन्दी रूप; क्या नहीं है, इसे मूल की तरह अनिर्दिष्ट रखा गया है।
- source_word: ⲡⲕⲉϣⲏⲙ
  choice: वह थोड़ा-सा भी
  rationale: ϣⲏⲙ की ‘छोटी वस्तु/थोड़ी मात्रा’ वाली संक्षिप्तता और ⲕⲉ- के ‘भी’ अर्थ दोनों सुरक्षित हैं।
- source_word: ⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: जो उसके पास है
  rationale: संबंधवाचक उपवाक्य उस थोड़ी मात्रा या वस्तु को निर्दिष्ट करता है।
- source_word: ⲛⲧⲟⲟⲩⲛⲁϥⲓϥ ⲛ̄ⲧⲟⲟⲧϥ̄
  choice: उससे ... ले लिया जाएगा
  rationale: अव्यक्त बहुवचन कर्ता को हिन्दी में कर्मवाच्य से व्यक्त किया गया है; पृथक्करणसूचक पद का अर्थ ‘उससे’ है।
theological_decisions:
- issue: कथन में ‘कुछ’ और ‘थोड़ा-सा’ किस वस्तु, ज्ञान या आध्यात्मिक दशा को सूचित करते हैं
  choice: संदर्भ को अनिर्दिष्ट रखा गया
  alternative: इसे स्पष्टतः ज्ञान, विश्वास, समझ या संपत्ति कहना
  rationale: कॉप्टिक पाठ वस्तु को नाम नहीं देता; किसी विशिष्ट धार्मिक व्याख्या को पाठ में जोड़ना मूल की अर्थगत खुलावट को समाप्त कर देता।
- issue: अव्यक्त बहुवचन कर्ता की पहचान
  choice: हिन्दी कर्मवाच्य द्वारा कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘वे देंगे/ले लेंगे,’ ‘परमेश्वर देगा,’ या ‘लोग देंगे’
  rationale: मूल का तृतीय पुरुष बहुवचन अव्यक्त कर्ता के रूप में समझा जा सकता है; किसी निश्चित मानवीय या दैवी कर्ता की पहचान पाठ से सिद्ध नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और सूक्तिपरक शैली। ‘जिसके हाथ में’ मूल की विशिष्ट स्थानसूचक अभिव्यक्ति को बचाता है। अनिश्चित वस्तु तथा अनिश्चित कर्ता को स्पष्ट धार्मिक अर्थ देकर सीमित नहीं किया गया।
