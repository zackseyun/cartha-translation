base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
translation:
  language: hi
  text: यीशु ने कहा, “मैं तुम्हें चुनूँगा—हज़ार में से एक और दस हज़ार में से दो; और वे खड़े होंगे,[a] एक ही होकर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ मूल पाठ अचानक “तुम” से “वे” पर आ जाता है: “मैं तुम्हें चुनूँगा … और वे खड़े होंगे।” इस व्याकरणिक परिवर्तन को अनुवाद में बनाए रखा गया है। अंतिम “एक ही होकर” कॉप्टिक ⲟⲩⲁ ⲟⲩⲱⲧ का अनुवाद है।'
    reason: grammatical_shift_and_lexical_note
lexical_decisions:
- source_word: ⲥⲱⲧⲡ / ⲥⲉⲧⲡ-
  choice: चुनूँगा
  rationale: क्रिया का मूल अर्थ ‘चुनना’ है। ‘निर्वाचित करूँगा’ की अपेक्षा ‘चुनूँगा’ आधुनिक सामान्य हिन्दी में अधिक स्वाभाविक है और किसी विशिष्ट धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ϣⲟ
  choice: हज़ार
  rationale: यह 1,000 के लिए सामान्य कॉप्टिक संख्या है।
- source_word: ⲧⲃⲁ
  choice: दस हज़ार
  rationale: यह 10,000 के लिए प्रयुक्त संख्या है; हिन्दी पाठकों के लिए ‘अयुत’ या ‘असंख्य’ की अपेक्षा ‘दस हज़ार’ अधिक स्पष्ट और ठीक है।
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: खड़े होंगे
  rationale: यह मुहावरा शाब्दिक रूप से अपने पैरों पर खड़े होने और सामान्यतः ‘खड़े होना’ व्यक्त करता है; इसका अर्थ ‘तुम्हारे सामने खड़े होना’ नहीं है।
- source_word: ⲉⲩⲟ
  choice: होकर
  rationale: यह स्थितिवाचक रूप है, जिसका अर्थ यहाँ ‘होते हुए/होकर’ है; इसे सक्रिय ‘बनाते हुए’ नहीं समझना चाहिए।
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: एकमात्र / एक ही
  rationale: कॉप्टिक पद एकता और एकत्व पर बल देता है। पहली जगह संज्ञात्मक प्रयोग में ‘एकमात्र’ और अंतिम अवस्थावाचक प्रयोग में स्वाभाविक हिन्दी ‘एक ही होकर’ रखा गया है।
theological_decisions:
- issue: ⲟⲩⲁ ⲟⲩⲱⲧ में निहित एकत्व
  choice: ‘एकमात्र’ और ‘एक ही होकर’
  alternative: ‘एक’, ‘एकजुट’, अथवा ‘एक और वही’
  rationale: ‘एकजुट’ किसी समूहगत सहमति का अर्थ जोड़ सकता है, जबकि स्रोत अधिक गहन एकत्व की भाषा रखता है। हिन्दी में एक ही वाक्य में दोनों व्याकरणिक स्थानों पर बिल्कुल समान शब्दावली अस्वाभाविक होती, इसलिए अर्थगत पुनरावृत्ति को दो निकट रूपों से सुरक्षित रखा गया है।
- issue: दूसरे पुरुष से तीसरे पुरुष में अचानक परिवर्तन
  choice: ‘तुममें से चुनूँगा’ के बाद ‘वे खड़े होंगे’
  alternative: ‘तुम खड़े होगे’
  rationale: स्रोत में व्यक्ति का व्याकरणिक परिवर्तन वास्तविक है। उसे सुधारकर दूसरे पुरुष में करना स्रोत की असहजता और सम्भावित आशय को मिटा देता।
- issue: संख्या-वाक्य के बाद ‘एकमात्र’ का संबंध
  choice: इसे विराम से अलग रखते हुए मूल पाठ में बनाए रखना
  alternative: इसे पूरी तरह अगले उपवाक्य से जोड़ना या हटा देना
  rationale: पांडुलिपि की संक्षिप्त संरचना संबंध को पूरी तरह स्पष्ट नहीं करती। विरामचिह्न पाठनीयता देता है, पर टिप्पणी में अस्पष्टता को स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सामान्य पाठक के लिए सहज। ‘तुम’ बहुवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है। ‘हज़ार में से’ और ‘दस हज़ार में से’ हिन्दी की सामान्य चयन-संरचना है। अंतिम खंड में स्रोत की पुनरावृत्ति और एकत्व संबंधी तनाव को यथासंभव बनाए रखा गया है।
