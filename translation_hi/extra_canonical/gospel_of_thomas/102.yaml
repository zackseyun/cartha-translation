base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/102.yaml
  text: 'Jesus said[d][c][b][a], “Woe to the Pharisees! For they are like a dog lying on the manger of the cattle: it neither eats nor lets the cattle eat.”'
translation:
  language: hi
  text: 'यीशु ने कहा, “फ़रीसियों पर हाय! क्योंकि वे एक कुत्ते के समान हैं, जो मवेशियों[b] की चरनी[a] पर लेटा है: न तो वह स्वयं खाता है, न मवेशियों को खाने देता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चरनी” उस कॉप्टिक शब्द का अनुवाद है जिसका अर्थ पशुओं के चारा खाने की नाँद भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: पांडुलिपि में इस वाक्य के कुछ अक्षर क्षतिग्रस्त हैं। संपादित पाठ यहाँ “मवेशियों” पढ़ता है; आगे उसी शब्द का स्पष्ट प्रयोग इस पाठ-पुनर्निर्माण का समर्थन करता है।
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲟⲩⲟⲓ
  choice: पर हाय
  rationale: यह निंदा और चेतावनी व्यक्त करने वाला उद्गार है; ‘पर हाय’ उसके तीखे और संक्षिप्त बल को बनाए रखता है।
- source_word: ⲉⲓⲛⲉ
  choice: के समान हैं
  rationale: समानता का सीधा अर्थ देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ⲟⲩϩⲟⲣ
  choice: कुत्ता
  rationale: मूल शब्द का सामान्य और स्पष्ट अर्थ है; उपमा की कठोरता बनी रहती है।
- source_word: ⲛⲛⲕⲟⲧⲕ
  choice: लेटा रहता है
  rationale: यहाँ शारीरिक मुद्रा अभिप्रेत है; ‘सोता है’ अनावश्यक रूप से नींद का अर्थ जोड़ता।
- source_word: ϩⲓϫⲛ
  choice: पर
  rationale: स्थान-संबंधी अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ⲡⲟⲩⲟⲙϥ
  choice: चरनी
  rationale: पशुओं के चारा खाने के पात्र के लिए सामान्य और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: ⲛϩⲉⲛⲉϩⲉ / ⲡⲉϩⲉ
  choice: मवेशी
  rationale: कॉप्टिक शब्द घरेलू पशुओं/मवेशियों के लिए सामान्य है; ‘बैल’ कहना अर्थ को अनावश्यक रूप से संकीर्ण करता।
- source_word: ⲟⲩⲱⲙ
  choice: खाना
  rationale: मूल क्रिया का सीधा अर्थ है और दोनों प्रयोगों में सहज रहता है।
- source_word: ⲕⲱ (ⲛⲡⲉϩⲉ ⲉⲟⲩⲱⲙ)
  choice: खाने देना
  rationale: क्रिया और infinitive की रचना यहाँ अनुमति देने का भाव रखती है; निषेध के साथ ‘खाने नहीं देता’ बनता है।
- source_word: ϫⲉ (causal)
  choice: क्योंकि
  rationale: दूसरा ϫⲉ कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
