base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/103.yaml
  text: Jesus said, “Blessed is the man who knows in which part the robbers are coming in, so that he will arise, gather his kingdom, and gird his loins beforehand, before they come in.”
translation:
  language: hi
  text: यीशु ने कहा, “धन्य है वह मनुष्य जो जानता है कि किस हिस्से में लुटेरे भीतर आ रहे हैं[a], ताकि वह उठ खड़ा हो, अपने राज्य को इकट्ठा करे[b] और उनके भीतर आने से पहले ही अपनी कमर कस ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किस हिस्से में।” सम्भव है कि यहाँ रात के किसी हिस्से या पहर का संकेत हो; पर मूल अभिव्यक्ति स्पष्ट नहीं करती कि बात समय की है या प्रवेश की दिशा/जगह की।
    reason: मूल की वास्तविक शब्दगत अस्पष्टता और सम्भावित सांस्कृतिक अर्थ स्पष्ट करना।
  - marker: b
    text: मूल पाठ में असामान्य अभिव्यक्ति “अपने राज्य को इकट्ठा करे” ही है। इसे अधिक सहज बनाने के लिए “अपनी सम्पत्ति समेटे” नहीं किया गया है।
    reason: थॉमस की विशिष्ट शब्दावली और धर्मवैचारिक तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य
  rationale: यह यूनानी आगत शब्द μακάριος का प्रचलित और गरिमापूर्ण हिन्दी रूप है तथा धन्य-वचन की शैली बनाए रखता है।
- source_word: ⲙⲉⲣⲟⲥ
  choice: हिस्सा
  rationale: मूल शब्द का अर्थ ‘भाग/हिस्सा’ है। सम्भावित अर्थ ‘रात का पहर’ हो सकता है, पर उसे मुख्य पाठ में निश्चित न करके मूल की अस्पष्टता सुरक्षित रखी गई है।
- source_word: ⲗⲏⲥⲧⲏⲥ
  choice: लुटेरे
  rationale: मूल में बहुवचन सूचक लेख है और अंतिम क्रिया का कर्ता भी बहुवचन है; इसलिए बहुवचन रखा गया है।
- source_word: ⲧⲱⲟⲩⲛ
  choice: उठ खड़ा हो
  rationale: क्रिया का अर्थ ‘उठना’ है, न कि केवल ‘जागते रहना’; यह थॉमस के विशिष्ट कथन को समानान्तर सुसमाचारों में विलीन होने से बचाता है।
- source_word: ⲥⲱⲟⲩϩ
  choice: इकट्ठा करे
  rationale: यह क्रिया ‘एकत्र करना/समेटना’ व्यक्त करती है और मूल की असामान्य सक्रिय छवि को बनाए रखती है।
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: राज्य
  rationale: शब्द का सामान्य और धर्मवैचारिक रूप से महत्त्वपूर्ण अर्थ ‘राज्य’ है; ‘सम्पत्ति’ या ‘इलाका’ करने से मूल की जानबूझकर रखी गई तनावपूर्ण छवि मिट जाती।
- source_word: ⲙⲟⲩⲣ ... ⲉϫⲛ ⲧⲉϥϯⲡⲉ
  choice: अपनी कमर कस ले
  rationale: यह तैयारी के लिए प्रयुक्त स्वाभाविक मुहावरा है और मूल के ‘अपनी कमर पर बाँधना’ का अर्थ ठीक व्यक्त करता है।
- source_word: ϩⲁⲧⲉϩⲏ
  choice: पहले ही
  rationale: यह ‘पहले से/अग्रिम रूप से’ तैयारी करने का भाव देता है; अगले ‘उनके भीतर आने से पहले’ के साथ मूल का जोर भी बना रहता है।
theological_decisions:
- issue: ⲙⲛⲧⲣⲣⲟ का दृष्टान्तगत अर्थ
  choice: राज्य
  alternative: इलाका, सम्पत्ति, अधिकार-क्षेत्र
  rationale: कथानक में वैकल्पिक अर्थ अधिक सहज लग सकते हैं, फिर भी थॉमस में यही पद ‘राज्य’ के धर्मवैचारिक विषय से जुड़ा है। ‘राज्य’ रखने से मूल का असामान्य और सम्भवतः उद्देश्यपूर्ण तनाव सुरक्षित रहता है।
- issue: समानान्तर जागते रहने वाले गृहस्वामी के दृष्टान्त से सामंजस्य
  choice: मूल के अनुसार ‘उठ खड़ा हो, ... इकट्ठा करे’
  alternative: ‘जागता रहे’ या ‘घर की रखवाली करे’
  rationale: कॉप्टिक पाठ में उठने और इकट्ठा करने की क्रियाएँ हैं। समानान्तर सुसमाचारों की अधिक परिचित भाषा आयात नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल शैली रखी गई है। ‘मनुष्य’, ‘धन्य’, ‘राज्य’ और ‘कमर कसना’ जैसे परिचित शब्द औपचारिकता और सहज बोध के बीच संतुलन बनाते हैं।
