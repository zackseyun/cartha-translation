base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/053.yaml
  text: His disciples said to him[1], “Does circumcision benefit or not?” He said to them, “If it were beneficial, their father would beget them circumcised from their mother. Rather[6][5][4][3][2], the circumcision of truth in spirit has become entirely profitable.”
translation:
  language: hi
  text: '**कथन 53**


    उसके शिष्यों ने उससे कहा, “क्या खतना लाभ पहुँचाता है या नहीं?” उसने उनसे कहा,[f] “यदि उससे लाभ होता,[a] तो उनका पिता उन्हें उनकी माता से[b] खतना किए हुए उत्पन्न करता। परन्तु आत्मा में[e] सत्य का खतना[c] पूरी तरह लाभकारी हो गया है।”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यदि उससे लाभ होता” मूल की अवास्तविक या प्रतिकल्पित शर्त को व्यक्त करता है; अर्थ यह है कि वास्तविकता इसके विपरीत मानी जा रही है।
    reason: व्याकरणिक स्पष्टीकरण
  - marker: b
    text: 'मूल पाठ में पिता कर्ता है और “माता से” उद्गम बताता है: अर्थात पिता उन्हें उनकी माता से खतना किए हुए उत्पन्न करता।'
    reason: मूल वाक्यरचना
  - marker: c
    text: “सत्य का खतना” का अनुवाद “सच्चा खतना” भी किया जा सकता है।
    reason: वैकल्पिक अर्थ
  - marker: d
    text: शाब्दिक अभिव्यक्ति में पूर्णता पर बल है; “लाभकारी” शब्द पहले आए “लाभ पहुँचाता” से अर्थ पूरा करने के लिए लिया गया है।
    reason: निहित पद की पूर्ति
  - marker: e
    text: विचार की तुलना रोमियों 2:29 और फिलिप्पियों 3:3 से की जा सकती है।
    reason: समानान्तर सन्दर्भ
  - marker: f
    text: यहाँ “उससे/उसे” के लिए प्रयुक्त सर्वनाम-रूप में लाइकोपोलिटन बोली का प्रभाव दिखाई देता है; इससे कथन का अर्थ नहीं बदलता।
    reason: पाठ-भाषिक टिप्पणी
lexical_decisions:
- source_word: ⲥⲃⲃⲉ
  choice: खतना
  rationale: यह अनुष्ठानिक circumcision का मानक कॉप्टिक शब्द है; प्रसंग में इसी प्रथा की चर्चा है।
- source_word: ⲣⲱⲫⲉⲗⲉⲓ
  choice: लाभ पहुँचाता है / लाभकारी
  rationale: यूनानी ὠφελεῖν से आया यह शब्द लाभ या उपयोगिता व्यक्त करता है; आरम्भ और अन्त के शब्द-संबंध को हिन्दी में भी बनाए रखा गया है।
- source_word: ⲛⲉⲣⲉ…ⲣⲱⲫⲉⲗⲉⲓ
  choice: यदि वह लाभ पहुँचाता
  rationale: ⲛⲉⲣⲉ के साथ बनी अवास्तविक शर्त को हिन्दी की प्रसंगानुकूल शर्तात्मक रचना में रखा गया है।
- source_word: ϫⲡⲟⲛ
  choice: उत्पन्न करता
  rationale: कर्ता ‘उनका पिता’ है। ‘उत्पन्न करता’ पैतृक जनन को स्पष्ट रखता है और हिन्दी में ‘पिता जन्म देता’ की अनचाही अस्वाभाविकता से बचता है।
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲡⲉⲩⲙⲁⲁⲩ
  choice: उनकी माता से
  rationale: मूल में माता को उद्गम के रूप में बताने वाली रचना है; ‘गर्भ’ जैसा शब्द मूल में न होने के कारण नहीं जोड़ा गया।
- source_word: ⲉⲣⲉⲛⲧⲟⲟⲩ ⲥⲃⲃⲉ
  choice: खतना किए हुए
  rationale: यह समकालीन अवस्था बताने वाली विधेयात्मक रचना है; हिन्दी कृदन्त उस अवस्था को सहज रूप से व्यक्त करता है।
- source_word: ⲁⲗⲗⲁ
  choice: परन्तु
  rationale: यह पहले कथन के विपरीत सुधारात्मक मोड़ लाता है; आधुनिक गरिमापूर्ण हिन्दी में ‘परन्तु’ उपयुक्त है।
- source_word: ⲡⲥⲃⲃⲉ ⲛⲙⲉ
  choice: सत्य का खतना
  rationale: संज्ञा-संबंध को ज्यों का त्यों रखा गया है ताकि ‘सच्चा खतना’ वाला विशेषणार्थ सम्भव रहे, पर अनिवार्य न बनाया जाए।
- source_word: ϩⲛ ⲡⲛⲉⲩⲙⲁ
  choice: आत्मा में
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि आशय मानवीय आत्मा है या दिव्य आत्मा; हिन्दी में सामान्य रूप देकर यह अस्पष्टता सुरक्षित रखी गई है।
- source_word: ⲁϥϭⲛ̄ϩⲏⲩ ⲧⲏⲣϥ
  choice: पूरी तरह लाभकारी हुआ है
  rationale: पूर्णता बताने वाली अभिव्यक्ति में ‘लाभकारी’ पहले आए लाभ के विचार से पूरा किया गया है; पूर्ण पक्ष को ‘हुआ है’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘आत्मा’ की पहचान
  choice: आत्मा में
  alternative: पवित्र आत्मा में / मनुष्य की आत्मा में
  rationale: कॉप्टिक ⲡⲛⲉⲩⲙⲁ यहाँ किसी एक धर्मवैज्ञानिक पहचान को स्पष्ट नहीं करता; इसलिए अनिर्णीत अर्थ को बनाए रखा गया है।
- issue: ‘सत्य का खतना’ का संबंध
  choice: सत्य का खतना
  alternative: सच्चा खतना
  rationale: मूल की संबंधकारक रचना को सुरक्षित रखा गया है; विशेषणार्थ सम्भव है, पर उसे अकेला निश्चित अर्थ नहीं माना गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण रखी गई है। ‘खतना’ सामान्य पाठक के लिए परिचित और सटीक शब्द है। ‘उत्पन्न करता’ पैतृक कर्ता को बनाए रखता है, जबकि ‘सत्य का खतना’ और ‘आत्मा में’ मूल की अर्थगत तथा धर्मवैज्ञानिक अस्पष्टता को अनिर्णीत छोड़ते हैं।
