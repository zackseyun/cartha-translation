base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/012.yaml
  text: The disciples said to Jesus[a], "We know that you will depart from us. Who will be great over us?" Jesus said to them, "Wherever you are, you are to go to James the Just—this one[f][e][d][c][b], for whose sake heaven and earth came into being."
translation:
  language: hi
  text: शिष्यों ने यीशु से कहा, “हम जानते हैं कि आप हमें छोड़कर चले जाएँगे। हमारे ऊपर कौन बड़ा होगा?” यीशु ने उनसे कहा, “तुम जहाँ कहीं हो[a], याकूब धर्मी के पास जाओ—उसी के कारण आकाश और पृथ्वी अस्तित्व में आए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह स्थान जहाँ तुम आए हो।” प्रसंग में इसका भाव “तुम जहाँ कहीं हो” है। पांडुलिपि में ‘तुम स्वयं’ का कोई स्वतंत्र बलवाचक सर्वनाम नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: ⲛⲧⲟⲕⲛⲁⲃⲱⲕ ⲛⲧⲛⲁⲛⲟⲛ
  choice: आप हमें छोड़कर चले जाएँगे
  rationale: ⲃⲱⲕ का मूल अर्थ ‘जाना’ है और ⲛⲧⲛⲁⲛⲟⲛ अलगाव को बताता है; संयुक्त हिन्दी वाक्यांश गति और समूह से विदाई, दोनों को स्वाभाविक ढंग से रखता है।
- source_word: ⲉⲧⲉⲣⲉⲛⲁⲣⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲛⲁⲛⲟⲛ
  choice: हमारे ऊपर कौन बड़ा होगा
  rationale: यह ⲣⲛⲟϭ के ‘बड़ा होना’ और ⲉϩⲣⲁⲓ ⲉϫⲛ- के ‘ऊपर’ भाव को बनाए रखता है, बिना ‘राज करना’ या कोई औपचारिक पद जोड़ने के।
- source_word: ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ
  choice: तुम जहाँ कहीं हो
  rationale: पांडुलिपि का वाक्यांश शाब्दिक रूप से ‘वह स्थान जहाँ तुम आए हो’ है; प्रसंग में यह वर्तमान स्थिति के लिए मुहावरेदार है। पांडुलिपि में स्वतंत्र बलवाचक सर्वनाम नहीं है, इसलिए ‘तुम स्वयं’ नहीं जोड़ा गया।
- source_word: ⲉⲧⲉⲧⲛⲁⲃⲱⲕ ϣⲁⲓⲁⲕⲱⲃⲟⲥ
  choice: याकूब धर्मी के पास जाना
  rationale: निर्देशात्मक भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है और ϣⲁ के व्यक्ति की ओर गमन को ‘के पास’ से स्पष्ट करता है।
- source_word: ⲡⲇⲓⲕⲁⲓⲟⲥ
  choice: धर्मी
  rationale: यूनानी मूल के इस विशेषण/उपाधि का अर्थ न्यायी या धर्मी है; ‘धर्मी’ हिन्दी बाइबलीय संदर्भ में स्वाभाविक और संक्षिप्त है।
- source_word: ⲡⲁⲓ ⲛ̄ⲧⲁⲧⲡⲉ ⲙⲛ̄ⲡⲕⲁϩ ϣⲱⲡⲉ ⲉⲧⲃⲏⲧϥ̅
  choice: उसी के कारण आकाश और पृथ्वी अस्तित्व में आए
  rationale: कारणसूचक ⲉⲧⲃⲏⲧϥ̅ और उत्पत्ति/होने के क्रियार्थ को सीधे रखता है; कथन की प्रबल ब्रह्मांडीय भाषा को नरम नहीं किया गया।
theological_decisions:
- issue: याकूब के नेतृत्व का स्वरूप
  choice: ‘हमारे ऊपर कौन बड़ा होगा’ और ‘याकूब धर्मी के पास जाना’
  alternative: ‘हम पर कौन शासन करेगा’ अथवा ‘कौन हमारा अगुवा होगा’
  rationale: स्रोत ‘बड़ा’ होने की भाषा इस्तेमाल करता है और यीशु याकूब के पास जाने का निर्देश देते हैं; अनुवाद इससे कोई औपचारिक कलीसियाई पद या राजनीतिक शासन निष्कर्षित नहीं करता।
- issue: याकूब के कारण आकाश और पृथ्वी का अस्तित्व
  choice: कथन को बिना व्याख्यात्मक कमी के ज्यों का त्यों रखा
  alternative: इसे केवल याकूब की महत्ता के अतिशयोक्तिपूर्ण रूपक के रूप में स्पष्ट करना
  rationale: मूल कथन जानबूझकर प्रबल और धर्मवैज्ञानिक रूप से तनावपूर्ण है; अनुवाद उसके आशय को किसी एक सिद्धान्त में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरपूर्ण, सहज और गरिमापूर्ण रूप अपनाया गया है। यीशु के लिए ‘आप’ और शिष्यों के लिए सामूहिक ‘तुम’ रखा गया है। स्रोत की असामान्य ‘ऊपर बड़ा’ भाषा तथा याकूब के विषय में ब्रह्मांडीय कथन को व्याख्या द्वारा सामान्य नहीं बनाया गया।
