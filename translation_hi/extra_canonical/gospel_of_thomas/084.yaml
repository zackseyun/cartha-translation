base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
translation:
  language: hi
  text: यीशु ने कहा, “जिस दिन तुम अपना रूप देखते हो, तुम आनन्दित होते हो। लेकिन जब तुम अपनी उन छवियों[a] को देखोगे, जो तुमसे पहले अस्तित्व में आई थीं[b] और जो न मरती हैं, न प्रकट होती हैं[c]—तुम कितना सह सकोगे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “छवियों” के लिए कॉप्टिक में यूनानी मूल का शब्द ϩⲓⲕⲱⲛ (εἰκών, आइकोन) है। मूल पाठ पहले आए “रूप” (ⲉⲓⲛⲉ) से अलग शब्द इस्तेमाल करता है।
    reason: मूल की अलग शब्दावली को स्पष्ट करना, बिना छवियों की प्रकृति के बारे में व्याख्यात्मक दावा जोड़े।
  - marker: b
    text: “अस्तित्व में आई थीं” वाले कॉप्टिक रूप में तृतीय पुरुष बहुवचन सर्वनाम का एक क्षेत्रीय रूप मिलता है।
    reason: पाण्डुलिपि की बोलीगत विशेषता बताना।
  - marker: c
    text: “न मरती हैं, न प्रकट होती हैं” में निषेध के लिए क्षेत्रीय उपसर्ग-रूप प्रयुक्त हुए हैं। “प्रकट होती हैं” का अर्थ “दिखाई देती हैं” या “उजागर होती हैं” भी हो सकता है।
    reason: बोलीगत रूप और क्रिया की अर्थ-सीमा बताना।
lexical_decisions:
- source_word: ⲉⲓⲛⲉ
  choice: समानता
  rationale: यह व्यक्ति के दिखाई देने वाले सदृश रूप को व्यक्त करता है और आगे आए यूनानी मूल के ‘प्रतिमाओं’ शब्द से शब्दावली का भेद बनाए रखता है।
- source_word: ϩⲓⲕⲱⲛ
  choice: प्रतिमाएँ
  rationale: यह यूनानी εἰκών से लिया गया शब्द है; ‘प्रतिमाएँ’ इसके चित्र/रूप संबंधी अर्थ को बनाए रखता है, बिना किसी विशिष्ट धर्मवैज्ञानिक पहचान को पाठ में जोड़ने के।
- source_word: ϣⲱⲡⲉ
  choice: अस्तित्व में आई थीं
  rationale: इस प्रसंग में क्रिया उत्पन्न होने या अस्तित्व में आने का अर्थ देती है; यह ‘बनाई गई थीं’ की अपेक्षा कर्ता के विषय में तटस्थ है।
- source_word: ϩⲓⲧⲉⲧⲛⲉϩⲏ
  choice: तुमसे पहले
  rationale: मूल पद समय या स्थान में पूर्वता व्यक्त कर सकता है; प्रसंग में स्वाभाविक हिन्दी ‘तुमसे पहले’ है, जो पूर्व-अस्तित्व का संकेत देता है पर उसे विस्तार से परिभाषित नहीं करता।
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: प्रकट होती हैं
  rationale: यह दिखाई देने, प्रकट होने या उजागर होने का अर्थ देता है; संक्षिप्त हिन्दी मूल की अनिर्दिष्टता बनाए रखती है।
- source_word: ϥⲓ ϩⲁ
  choice: सह सकोगे
  rationale: मुहावरे का अर्थ भार उठाना या सहना है; प्रश्न में ‘सह सकोगे’ स्वाभाविक हिन्दी है और तीव्र चुनौती को व्यक्त करता है।
theological_decisions:
- issue: ⲉⲓⲛⲉ और ϩⲓⲕⲱⲛ के बीच भेद
  choice: ‘समानता’ और ‘प्रतिमाएँ’
  alternative: ‘रूप’ और ‘स्वरूप’
  rationale: मूल में अलग शब्द हैं। चुनी हुई शब्दावली उस भेद को सुनाई देती है, पर ‘दिव्य प्रतिरूप’ जैसी व्याख्यात्मक धारणा मुख्य पाठ में नहीं जोड़ती।
- issue: ‘तुमसे पहले अस्तित्व में आई’ प्रतिमाओं की प्रकृति
  choice: उनकी पहचान को अनिर्धारित रखा गया
  alternative: उन्हें स्पष्ट रूप से ‘अनन्त दिव्य प्रतिरूप’ कहना
  rationale: पाठ उनके पूर्व-अस्तित्व, न मरने और न प्रकट होने की बात करता है, पर उनकी सटीक तत्त्वमीमांसक पहचान नहीं बताता; इसलिए धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
- issue: अन्तिम प्रश्न की शक्ति
  choice: ‘तब तुम कितना सह सकोगे!’
  alternative: ‘तुम्हें कितना सहना पड़ेगा!’
  rationale: मूल का प्रश्न सहने की मात्रा/क्षमता पर है, अनिवार्यता पर नहीं; अतः क्षमता-सूचक रूप अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। सामान्य सत्य के लिए वर्तमान काल (‘देखते हो’, ‘आनन्दित होते हो’) और बाद की शर्त तथा परिणाम के लिए भविष्यसूचक रूप रखा गया है। मुख्य पाठ में ‘प्रतिमाओं’ की प्रकृति की कोई सम्प्रदायगत या तत्त्वमीमांसक व्याख्या नहीं जोड़ी गई।
