base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
translation:
  language: hi
  text: यीशु ने कहा, “मैं वह प्रकाश हूँ जो उन सबके ऊपर है। मैं सब कुछ हूँ। मुझी से सब कुछ निकला, और मुझी तक सब कुछ पहुँचा।[a] लकड़ी का एक टुकड़ा चीर दो; मैं वहाँ हूँ।[b] पत्थर को उठाओ, और तुम मुझे वहाँ पाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक में “पहुँचा” और अगले वाक्य के “चीर दो” के लिए एक ही रूप, ⲡⲱϩ (पोह), आया है। इस शब्दालंकार को हिन्दी में उसी रूप में बनाए रखना संभव नहीं है।
    reason: मूल भाषा का शब्दालंकार
  - marker: b
    text: यूनानी खंड P.Oxy. 1 में पत्थर उठाने और लकड़ी चीरने के आदेश उलटे क्रम में हैं और वे कथन 30 के अंत में जुड़े हुए मिलते हैं।
    reason: पाठांतर
lexical_decisions:
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: प्रकाश
  rationale: कॉप्टिक संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य; कथन में वक्ता की पहचान प्रकाश से की गई है।
- source_word: ⲡⲧⲏⲣϥ
  choice: सर्वस्व
  rationale: यह पद समस्त अस्तित्व अथवा संपूर्णता को एक संज्ञात्मक निरपेक्ष रूप में व्यक्त करता है। “सब कुछ” की तुलना में “सर्वस्व” इस संज्ञात्मक बल को अधिक संक्षेप और गरिमा से बनाए रखता है।
- source_word: ⲉⲃⲟⲗ ⲛϩⲏⲧ
  choice: मुझी से
  rationale: स्रोत के द्वितीय पूर्णकाल द्वारा ‘मुझसे’ पर दिए गए बल को हिन्दी के निश्चयार्थक ‘ही’ से व्यक्त किया गया है।
- source_word: ϣⲁⲁⲛⲟⲕ / ϣⲁⲣⲟⲉⲓ
  choice: मुझी तक
  rationale: दिशात्मक अर्थ ‘मेरी ओर/मुझ तक’ और स्रोत में इस वाक्यांश पर दिए गए बल, दोनों को सुरक्षित रखता है।
- source_word: ⲡⲱϩ
  choice: पहुँचा / चीर दो
  rationale: कॉप्टिक में एक ही रूप पहले ‘पहुँचना’ और फिर ‘चीरना’ के अर्थ में आता है। हिन्दी में दोनों अर्थों को सही-सही दिया गया है, यद्यपि मूल का शब्दालंकार पुनरुत्पादित नहीं होता।
- source_word: ϣⲉ
  choice: लकड़ी का एक टुकड़ा
  rationale: यह शब्द लकड़ी अथवा लकड़ी के टुकड़े को सूचित कर सकता है; आदेश के प्रसंग में यह सहज और ठोस हिन्दी अभिव्यक्ति है।
- source_word: ϥⲓ ... ⲉϩⲣⲁⲓ
  choice: उठाओ
  rationale: क्रिया और दिशासूचक क्रियाविशेषण मिलकर पत्थर को ऊपर उठाने का स्पष्ट आदेश देते हैं।
- source_word: ϩⲉ ⲉ-
  choice: पाओगे
  rationale: इस रचना का अर्थ ‘पाना/ढूँढ़ पाना’ है, न कि केवल ‘देखना’।
theological_decisions:
- issue: ⲡⲧⲏⲣϥ द्वारा यीशु और संपूर्णता की पहचान
  choice: “मैं सर्वस्व हूँ”
  alternative: “मैं सब कुछ हूँ” / “मैं समस्त हूँ”
  rationale: “सर्वस्व” मूल के संज्ञात्मक निरपेक्ष भाव को बनाए रखता है, पर कथन की दार्शनिक या धर्मवैज्ञानिक व्याख्या को अनुवाद में अतिरिक्त रूप से परिभाषित नहीं करता।
- issue: “सबके ऊपर” का आशय
  choice: “वह प्रकाश ... जो उन सबके ऊपर है”
  alternative: “वह प्रकाश ... जो सबमें व्याप्त है”
  rationale: कॉप्टिक में स्थानसूचक ‘ऊपर’ है। ‘व्याप्त’ कहना संभावित धर्मवैज्ञानिक अर्थ को मूल से अधिक स्पष्ट कर देता, इसलिए स्थानसूचक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “मुझी से” और “मुझी तक” स्रोत के व्याकरणिक बल को हिन्दी में स्वाभाविक ढंग से दर्शाते हैं। “सर्वस्व” को किसी विशेष सम्प्रदायगत व्याख्या के बिना संपूर्णता के संज्ञात्मक पद के रूप में चुना गया है।
