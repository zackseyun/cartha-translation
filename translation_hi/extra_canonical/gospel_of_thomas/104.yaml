base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/104.yaml
  text: They said to Jesus[a], “Come, let us pray today, and let us fast.” Jesus said, “For what is the sin that I have committed, or in what have I been overcome? But when the bridegroom goes out from the bridal chamber, then let them fast[f][e][d][c][b], and let them pray.”
translation:
  language: hi
  text: उन्होंने यीशु से कहा, “आइए, आज[a] हम प्रार्थना करें और उपवास रखें।” यीशु ने कहा, “भला मैंने कौन-सा पाप किया है, या किस बात में मैं परास्त हुआ हूँ?[b] पर जब दूल्हा विवाह-कक्ष[c] से बाहर निकले, तब वे उपवास रखें और प्रार्थना करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से “उस दिन/दिन” है, जिसका यहाँ स्वाभाविक अर्थ “आज” है।
    reason: dialect_note
  - marker: b
    text: यहाँ प्रयुक्त क्रिया का अर्थ “परास्त किया जाना,” “वश में किया जाना” या संदर्भानुसार “दबाया जाना” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “दूल्हा” और “विवाह-कक्ष” के मूल शब्द यूनानी से लिए गए हैं और विवाह का रूपक बनाए रखते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲙⲟⲩ
  choice: आइए
  rationale: एकवचन आज्ञार्थक निमंत्रण है। यीशु को संबोधित करते हुए आधुनिक मानक हिन्दी में आदरसूचक “आइए” स्वाभाविक है।
- source_word: ϣⲗⲏⲗ
  choice: प्रार्थना करें
  rationale: प्रार्थना करने के सामान्य क्रियार्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ⲛⲏⲥⲧⲉⲩⲉ
  choice: उपवास रखें
  rationale: धार्मिक उपवास के लिए सामान्य आधुनिक हिन्दी अभिव्यक्ति; केवल भोजन न करने से अधिक स्पष्ट है।
- source_word: ⲡⲛⲟⲃⲉ
  choice: पाप
  rationale: नैतिक दोष के मूल अर्थ और कथन के धार्मिक संदर्भ दोनों को सुरक्षित रखता है।
- source_word: ⲟⲩ ⲡⲉ
  choice: कौन-सा
  rationale: यह प्रश्नवाचक रचना है; “भला मैंने कौन-सा पाप किया है” इसे किसी निष्कर्षात्मक कथन में बदले बिना स्वाभाविक हिन्दी प्रश्न बनाती है।
- source_word: ϫⲣⲟ ⲉ-
  choice: परास्त हुआ
  rationale: इस रचना में ‘जीतना, परास्त करना, वश में कर लेना’ प्रमुख अर्थ है। कर्मवाच्य भाव को हिन्दी में “परास्त हुआ” से स्वाभाविक रूप दिया गया है।
- source_word: ⲡⲛⲩⲙⲫⲓⲟⲥ
  choice: दूल्हा
  rationale: विवाह के पुरुष पात्र के लिए सर्वसुलभ हिन्दी शब्द है और मूल विवाह-रूपक बनाए रखता है।
- source_word: ⲡⲛⲩⲙⲫⲱⲛ
  choice: विवाह-कक्ष
  rationale: यूनानी मूल के शब्द का आशय वह कक्ष है जो विवाह अथवा दूल्हा-दुल्हन से जुड़ा है; “विवाह-कक्ष” आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ⲉⲓ ⲉⲃⲟⲗ ϩⲛ-
  choice: से बाहर निकले
  rationale: मूल में बाहर आने या निकलने का भाव है; इसे ‘छीन लिया जाए’ जैसे अधिक व्याख्यात्मक समानांतर वाक्यांश से नहीं बदला गया।
- source_word: ⲙⲁⲣⲟⲩ-
  choice: तब वे … रखें और … करें
  rationale: तृतीय पुरुष बहुवचन के आदेशात्मक/अनुमतिपरक भाव “वे करें” को सुरक्षित रखता है, साधारण भविष्यकाल नहीं बनाता।
theological_decisions:
- issue: दूल्हे के विवाह-कक्ष से निकलने का अर्थ
  choice: मूल के अनुसार “बाहर निकले”
  alternative: “दूर चला जाए” या “छीन लिया जाए”
  rationale: कॉप्टिक पाठ केवल बाहर निकलने की क्रिया कहता है। समानांतर माने जाने वाले अन्य आरंभिक मसीही कथनों की भाषा या धर्मवैज्ञानिक व्याख्या इसमें जोड़ना उचित नहीं।
- issue: यीशु के प्रश्न का स्वरूप
  choice: दो वास्तविक अलंकारिक प्रश्नों के रूप में प्रस्तुत
  alternative: पापहीनता का सीधा घोषणात्मक कथन
  rationale: पाठ प्रश्नवाचक है। प्रश्न से निहित अर्थ निकल सकता है, पर अनुवाद को उस निहितार्थ को स्पष्ट धर्मवैज्ञानिक घोषणा में नहीं बदलना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सहज रखी गई है। यीशु के लिए आदरसूचक “आइए” प्रयुक्त है। वाक्य की संक्षिप्त संवादात्मक गति और अंतिम आदेशात्मक भाव सुरक्षित रखे गए हैं।
