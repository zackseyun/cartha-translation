base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/052.yaml
  text: His disciples said to him[a], “Twenty-four prophets spoke in Israel, and they all spoke about you.” He said to them, “You have left out the living one who is in your presence[d][c][b], and you have spoken about the dead.”
translation:
  language: hi
  text: उसके शिष्यों ने उससे कहा, “इस्राएल में चौबीस[c] भविष्यवक्ता बोले थे, और उन सबने तुम्हारे विषय में[a] कहा था।” उसने उनसे कहा, “तुमने उस जीवित जन को, जो तुम्हारे सामने है[d], छोड़ दिया है[b], और मृतकों के विषय में बोले हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुद्रित पांडुलिपि-पाठ को ‘तुम्हारे हृदय में’ भी पढ़ा जा सकता है; डिली के सामान्यीकृत पाठ में ‘तुम्हारे विषय में’ है। यहाँ सामान्यीकृत पाठ का अनुवाद किया गया है।
    reason: textual_variant
  - marker: b
    text: ‘छोड़ दिया’ का अनुवाद ‘सम्मिलित नहीं किया’, ‘उपेक्षित किया’ या ‘चूक गए’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘चौबीस भविष्यवक्ता’ भविष्यवाणी-संबंधी प्रामाणिक व्यक्तियों की किसी पारंपरिक गणना या प्रतीकात्मक संख्या की ओर संकेत कर सकता है। कुछ प्राचीन परंपराओं में इब्रानी पवित्रशास्त्र की चौबीस पुस्तकों की गणना भी मिलती है, पर यह कथन स्वयं संबंध स्पष्ट नहीं करता।
    reason: cultural_note
  - marker: d
    text: जीवित और मृत के विरोध की तुलना मरकुस 12:27 और उसके समानांतर पाठों से की जा सकती है; पर यहाँ बल उस जीवित जन पर है जो शिष्यों के सामने उपस्थित है।
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲟⲩⲧⲁϥⲧⲉ
  choice: चौबीस
  rationale: यह सामान्य संयुक्त संख्या है; आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: भविष्यवक्ता
  rationale: यह यूनानी से आए कॉप्टिक शब्द का मानक और व्यापक रूप से समझा जाने वाला हिन्दी धार्मिक समतुल्य है।
- source_word: ϣⲁϫⲉ
  choice: बोलना / बातें करना
  rationale: पहले प्रसंग में भविष्यवक्ताओं के बोलने के लिए ‘बोले’, और अंतिम विरोध में विषय के बारे में बोलते रहने के भाव के लिए ‘बातें की हैं’ स्वाभाविक है।
- source_word: ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ
  choice: तुम्हारे विषय में
  rationale: सामान्यीकृत पाठ व्यक्ति को कथन का विषय बनाता है; हिन्दी में यह ‘तुम्हारे बारे में’ से थोड़ा अधिक गरिमापूर्ण है। पांडुलिपि-पाठ की दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ⲕⲱ
  choice: छोड़ दिया है
  rationale: क्रिया में छोड़ देने, शामिल न करने या उपेक्षित कर देने का भाव हो सकता है; ‘छोड़ दिया’ इस सक्रिय और आरोपात्मक स्वर को बनाए रखता है।
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: जीवित जन
  rationale: मूल में एकवचन संज्ञीकृत संबंधवाचक रचना है। ‘जीवित जन’ उसकी एकवचनता और विशिष्टता बनाए रखता है, पर उसकी पहचान को व्याख्या द्वारा निश्चित नहीं करता।
- source_word: ⲛⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  choice: तुम्हारे सामने
  rationale: कॉप्टिक मुहावरे का सीधा और स्वाभाविक हिन्दी रूप है; इससे उपस्थित व्यक्ति की तात्कालिकता स्पष्ट रहती है।
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: मृतकों
  rationale: पांडुलिपि का मूल पाठ बहुवचन ‘मरे हुए लोग’ का समर्थन करता है; ‘मृतकों’ भविष्यवक्ताओं के साथ बनाए गए विरोध को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘जीवित जन’ की पहचान
  choice: पहचान को स्पष्ट किए बिना ‘उस जीवित जन’ रखा गया
  alternative: इसे सीधे यीशु या किसी विशिष्ट उपाधि के रूप में प्रस्तुत करना
  rationale: कथन उपस्थित वक्ता की ओर संकेत करता है, पर मूल पाठ कोई नाम या स्पष्ट धर्मवैज्ञानिक उपाधि नहीं जोड़ता; अनुवाद को यह निहितार्थ खुला रखना चाहिए।
- issue: जीवित और मृत का विरोध
  choice: शाब्दिक विरोध ‘जीवित जन’ और ‘मृतकों’ के रूप में रखा गया
  alternative: जीवित शिक्षक बनाम प्राचीन भविष्यवक्ता कहकर अर्थ स्पष्ट करना
  rationale: ऐसी व्याख्या सम्भव है, पर पाठ का तीखा और कुछ हद तक रहस्यमय विरोध स्वयं बना रहना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक कथन के अनुकूल रखी गई है। ‘जीवित जन’ सामान्य बातचीत से थोड़ा ऊँचा पदबंध है, पर मूल की विशिष्ट एकवचन रचना को बचाता है। ‘मृतकों’ पांडुलिपि के बहुवचन पाठ को दर्शाता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
