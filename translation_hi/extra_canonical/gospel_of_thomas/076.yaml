base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/076.yaml
  text: 'Jesus said[a], “The Reign of the Father is like a merchant. He had a consignment of goods, and he found a pearl. The merchant was prudent: he sold the consignment and bought the one pearl for himself. You too, seek his treasure that does not fail, that endures—the place where no moth comes in to eat it[e][d][c][b], and no worm destroys.”'
translation:
  language: hi
  text: '**कथन 76**


    यीशु ने कहा, “पिता का राज एक व्यापारी के समान है। उसके पास माल की एक खेप थी, और उसे एक मोती मिला। वह व्यापारी समझदार था; उसने माल की खेप बेच दी[a] और अपने लिए वह एक मोती खरीद लिया। तुम भी उसके उस खजाने की खोज करो[b] जो समाप्त नहीं होता, बल्कि उस स्थान पर बना रहता है जहाँ कोई पतंगा उसे खाने के लिए भीतर नहीं आता और न कोई कृमि उसे नष्ट करता है[c]।”


    **पादटिप्पणियाँ**


    [a] शाब्दिक रूप से, “उसने माल की खेप बाहर दे दी।” खरीदने-बेचने के इस प्रसंग में इसका अर्थ माल को बेच देना या मूल्य लेकर उससे छुटकारा पाना है।


    [b] पांडुलिपि में “उसके खजाने” वाले शब्दों पर लेखन-संबंधी कठिनाई है। यहाँ संपादित सामान्यीकृत पाठ का अनुसरण किया गया है। “तुम भी” कॉप्टिक के बलाघाती रूप का अनुवाद है; उसका अर्थ “तुम भी” या “अपनी ओर से तुम” है, न कि अलग से “अपने लिए।”


    [c] यहाँ मूल पाठ में “कृमि” है, “जंग” नहीं; चित्र जैविक क्षय का है, धातु के क्षरण का नहीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने माल की खेप बाहर दे दी।” खरीदने-बेचने के इस प्रसंग में इसका अर्थ माल को बेच देना या मूल्य लेकर उससे छुटकारा पाना है।
    reason: lexical_alternative
  - marker: b
    text: पांडुलिपि में “उसके खजाने” वाले शब्दों पर लेखन-संबंधी कठिनाई है। यहाँ संपादित सामान्यीकृत पाठ का अनुसरण किया गया है। “तुम भी” कॉप्टिक के बलाघाती रूप का अनुवाद है; उसका अर्थ “तुम भी” या “अपनी ओर से तुम” है, न कि अलग से “अपने लिए।”
    reason: lacuna_or_restoration
  - marker: c
    text: यहाँ मूल पाठ में “कृमि” है, “जंग” नहीं; चित्र जैविक क्षय का है, धातु के क्षरण का नहीं।
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: पिता का राज
  rationale: ⲙⲛⲧⲣⲣⲟ मुख्यतः राजा की सत्ता या राज करने को सूचित करता है। “राज” आधुनिक हिन्दी में स्वाभाविक है और “राज्य” की केवल भूभाग-संबंधी छाया से बचते हुए मूल की व्यापकता बनाए रखता है।
- source_word: ⲣⲱⲙⲉ ⲛϣⲱⲧ / ⲡϣⲱⲧ
  choice: व्यापारी
  rationale: शाब्दिक रूप से व्यापार से जुड़ा व्यक्ति; प्रसंग में “व्यापारी” इसका सहज और सटीक हिन्दी रूप है।
- source_word: ⲫⲟⲣⲧⲓⲟⲛ
  choice: माल की एक खेप
  rationale: यूनानी मूल का यह शब्द बोझ या माल-खेप का अर्थ दे सकता है। व्यापारिक प्रसंग में “माल की खेप” वस्तुओं के व्यावसायिक समूह को स्पष्ट करता है।
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: मोती
  rationale: यूनानी आगत शब्द का मानक अर्थ “मोती” है।
- source_word: ⲥⲁⲃⲉ
  choice: समझदार
  rationale: यह व्यावहारिक बुद्धिमानी को सूचित करता है; “समझदार” सामान्य पाठक के लिए सहज है और व्यापारी के विवेकपूर्ण निर्णय को व्यक्त करता है।
- source_word: ϯⲡⲫⲟⲣⲧⲓⲟⲛ ⲉⲃⲟⲗ
  choice: माल की खेप बेच दी
  rationale: शाब्दिक संरचना “खेप बाहर दे दी” है, पर खरीद के समानांतर व्यापारिक प्रसंग में “बेच दी” स्वाभाविक अर्थ है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ⲟⲩⲱⲧ
  choice: वह एक मोती
  rationale: “एक” मोती की अद्वितीयता पर बल देता है; संकेतवाचक “वह” पूर्वोक्त मोती को स्पष्ट रूप से फिर ग्रहण करता है।
- source_word: ϩⲱⲱⲛⲧⲱⲧⲛ
  choice: तुम भी
  rationale: यह बलाघाती-अव्ययी रूप “तुम भी/अपनी ओर से तुम” का भाव देता है; इसे प्रतिवर्ती “अपने लिए” कहकर दोहरा अर्थ नहीं जोड़ा गया।
- source_word: ⲡⲉϥⲁϩⲟ
  choice: उसके उस खजाने
  rationale: ⲁϩⲟ धन या खजाना है। पुरुषवाचक संबंधसूचक को “उसके” के रूप में रखा गया है, बिना यह तय किए कि उसका संकेत किसकी ओर है; “उस” पूर्वोक्त और विशिष्ट खजाने को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ⲱϫⲛ / ⲙⲟⲩⲛ ⲉⲃⲟⲗ
  choice: समाप्त नहीं होता, बल्कि बना रहता है
  rationale: 'दोनों समानांतर अभिव्यक्तियों को रखा गया है: खजाना चुकता नहीं और निरंतर बना रहता है।'
- source_word: ϫⲟⲟⲗⲉⲥ / ⲡϥⲛⲧ
  choice: पतंगा / कृमि
  rationale: दो अलग जैविक विनाशकों का भेद सुरक्षित रखा गया है। “कृमि” मूल के worm को व्यक्त करता है, उसे समानांतर परंपराओं के “जंग” में नहीं बदलता।
