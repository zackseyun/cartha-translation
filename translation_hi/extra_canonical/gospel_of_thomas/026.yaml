base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/026.yaml
  text: Jesus said, “The splinter that is in your brother’s eye, you see it; but the beam that is in your own eye, you do not see it. When you take the beam out of your own eye, then you will see clearly to take the splinter out of your brother’s eye.”
translation:
  language: hi
  text: यीशु ने कहा, “जो किरच[a] तुम्हारे भाई[c] की आँख में है, उसे तुम देखते हो; लेकिन जो शहतीर[b] तुम्हारी अपनी आँख में है, उसे तुम नहीं देखते। जब तुम अपनी आँख से शहतीर निकालोगे[e], तब तुम साफ़ देखोगे[d], ताकि अपने भाई की आँख से किरच निकाल सको।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किरच” का अनुवाद “लकड़ी का छोटा टुकड़ा” या “कण” भी किया जा सकता है; यहाँ लकड़ी की छवि बनाए रखने के लिए “किरच” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: “शहतीर” किसी भवन का भारी संरचनात्मक काष्ठ है; “लट्ठा” संभव है, पर उससे भवन-संबंधी अर्थ कम स्पष्ट होता है।
    reason: lexical_alternative
  - marker: c
    text: “भाई” यहाँ किसी साथी शिष्य या समुदाय के सदस्य को भी सूचित कर सकता है।
    reason: cultural_note
  - marker: d
    text: “साफ़ देखोगे” कॉप्टिक मुहावरे ⲛⲁⲩ ⲉⲃⲟⲗ का भावानुवाद है; उसका शाब्दिक रूप लगभग “बाहर देखना” है।
    reason: dialect_note
  - marker: e
    text: यहाँ अनूदित क्रिया का अर्थ “बाहर फेंकना,” “बाहर करना” या “निकालना” हो सकता है; आँख के प्रसंग में “निकालना” स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡϫⲏ
  choice: किरच
  rationale: यह लकड़ी के एक छोटे टुकड़े को व्यक्त करता है और शहतीर के साथ मूल का लकड़ी-संबंधी विरोध बनाए रखता है; ‘तिनका’ अधिक परिचित है, पर लकड़ी का अर्थ उतना स्पष्ट नहीं करता।
- source_word: ⲡⲥⲟⲓ
  choice: शहतीर
  rationale: यह भवन में प्रयुक्त संरचनात्मक beam का स्वाभाविक हिन्दी शब्द है और किरच के साथ आकार का तीखा विरोध बनाए रखता है।
- source_word: ⲛⲟⲩϫⲉ
  choice: निकालना
  rationale: क्रिया का अर्थ फेंकना, बाहर करना या हटाना हो सकता है; आँख में पड़ी वस्तु के प्रसंग में ‘निकालना’ स्वाभाविक और सटीक है।
- source_word: ⲛⲁⲩ ⲉⲃⲟⲗ
  choice: साफ़ देख सकना
  rationale: शाब्दिक रूप से ‘बाहर देखना’ वाला यह मुहावरा दृष्टि की स्पष्टता बताता है; आधुनिक हिन्दी में ‘साफ़ देख सकना’ उसका स्वाभाविक अर्थ देता है।
- source_word: ⲥⲟⲛ
  choice: भाई
  rationale: कॉप्टिक शब्द का सीधा अर्थ ‘भाई’ है; शिष्य-समुदाय में यह किसी साथी सदस्य का भी संकेत कर सकता है, पर मुख्य पाठ में मूल पारिवारिक रूप रखा गया है।
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_
  choice: जब ... निकाल दोगे
  rationale: यह भविष्य-सापेक्ष कालवाचक रचना है; हिन्दी में ‘जब ... निकाल दोगे’ अपेक्षित भावी क्रिया और उसके बाद के परिणाम को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲃⲁⲗ
  choice: आँख
  rationale: यह सामान्य शारीरिक अर्थ वाला सीधा समतुल्य है।
theological_decisions:
- issue: ‘भाई’ का दायरा
  choice: मुख्य पाठ में ‘भाई’ रखा गया
  alternative: साथी / सहविश्वासी
  rationale: स्रोत का शब्द पुरुषवाचक ‘भाई’ है, यद्यपि प्रसंग में इसका सामुदायिक अर्थ व्यापक हो सकता है; अनुवाद ने उस व्यापकता को मुख्य पाठ में निश्चित नहीं किया।
- issue: अंतिम क्रिया का उद्देश्य-संबंध
  choice: ‘साफ़ देख सकोगे और ... निकाल सकोगे’
  alternative: ‘साफ़ देख सकोगे ताकि ... निकालो’
  rationale: स्रोत में स्पष्ट दृष्टि के बाद किरच निकालने का उद्देश्य/परिणाम जुड़ा है। हिन्दी में समन्वित रचना अर्थ को स्वाभाविक रखती है, बिना यह तय किए कि बल केवल क्षमता पर है या उद्देश्य पर।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की विषय-प्रमुख रचना—‘जो किरच..., उसे तुम देखते हो’—को हिन्दी में बनाए रखा गया है। ‘शहतीर’ साहित्यिक होते हुए भी प्रचलित और चित्रात्मक है; ‘साफ़’ में मानक नुक्ते का प्रयोग किया गया है।
