base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/017.yaml
  text: Jesus said[a], “I will give you what eye has not seen, and what ear has not heard[e][d][c][b], and what hand has not touched—and it has not arisen upon the human heart.”
translation:
  language: hi
  text: यीशु ने कहा, “मैं तुम सबको[a] वह दूँगा—जिसे न आँख ने देखा है, न कान ने सुना है, न हाथ ने छुआ है, और जो मनुष्य के हृदय पर नहीं उभरा है।”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक में “तुम” बहुवचन है।
    reason: grammar_note
  - marker: c
    text: मिलते-जुलते कथन के लिए यशायाह 64:4 और 1 कुरिन्थियों 2:9 देखें; यहाँ अनुवाद सीधे कॉप्टिक पाठ से किया गया है।
    reason: cross_reference
  - marker: d
    text: “हृदय पर” स्रोत के स्थानिक वाक्यांश का निकट अनुवाद है; अधिक स्वाभाविक हिन्दी में “हृदय में” कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ϯⲛⲁϯ
  choice: मैं … दूँगा
  rationale: पांडुलिपि का रूप सामान्य प्रथम-पुरुष एकवचन भविष्यकाल है। इसलिए अनावश्यक बलसूचक ‘मैं स्वयं’ जोड़े बिना साधारण भविष्यकाल रखा गया है।
- source_word: ⲛⲏⲧⲛ̄ / ⲛⲁⲛⲧⲱⲧⲛ
  choice: तुम सबको
  rationale: कॉप्टिक में संबोधन बहुवचन है; आधुनिक हिन्दी में ‘तुम सबको’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ⲙ̄ⲡⲉⲃⲁⲗ ⲛⲁⲩ
  choice: न आँख ने देखा है
  rationale: नकारात्मक पूर्णकाल और जातिवाचक एकवचन को समानांतर, सूक्तिपरक हिन्दी में रखा गया है।
- source_word: ⲙ̄ⲡⲉⲙⲁⲁϫⲉ ⲥⲟⲧⲙ
  choice: न कान ने सुना है
  rationale: ‘आँख—देखना, कान—सुनना’ का मूल समानांतर क्रम सुरक्षित रखा गया है।
- source_word: ⲙⲡⲉϭⲓϫ ϭⲙ̄ϭⲱⲙ
  choice: न हाथ ने छुआ है
  rationale: ϭⲙϭⲱⲙ यहाँ स्पर्श या हाथ लगाने का भाव देता है; ‘छुआ’ त्रिपदी के इंद्रियबोध संबंधी क्रम में सबसे सहज है।
- source_word: ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ
  choice: नहीं उभरा है
  rationale: शाब्दिक ‘ऊपर आना/उठना’ को हिन्दी के ‘उभरना’ से व्यक्त किया गया है, ताकि इसे चुपचाप ‘प्रवेश करना’ न बना दिया जाए।
- source_word: ϩⲓ ⲫⲏⲧ
  choice: हृदय पर
  rationale: ϩⲓ का ‘पर’ वाला स्थानिक बिंब जानबूझकर रखा गया है, भले ही हिन्दी में ‘हृदय में’ अधिक सामान्य होता।
- source_word: ⲣ̄ⲣⲱⲙⲉ
  choice: मनुष्य के
  rationale: यह सामान्य मानव का संकेत है; ‘मनुष्य’ गरिमापूर्ण, लिंग-समावेशी और स्रोत के निकट है।
theological_decisions:
- issue: अंतिम वाक्यांश में ‘हृदय पर उभरने’ का असामान्य बिंब
  choice: मनुष्य के हृदय पर नहीं उभरा है
  alternative: मनुष्य के हृदय में नहीं आया है
  rationale: अधिक सहज विकल्प अर्थ को मानसिक कल्पना या प्रवेश तक सीमित कर सकता है। स्रोत के ‘ऊपर आने’ और ‘पर’ के तनावपूर्ण बिंब को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। त्रिपदी की लय के लिए ‘न आँख… न कान… न हाथ…’ का समानांतर विन्यास अपनाया गया है। अंतिम पद की जानबूझकर असामान्य छवि को सहज बनाकर मिटाया नहीं गया।
