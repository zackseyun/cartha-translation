base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/030.yaml
  text: Jesus says[1], "Where there are three gods, they are gods. Where there are two or one[a][3][2], I am with him."
translation:
  language: hi
  text: यीशु कहते हैं, “जहाँ तीन देवता हैं, वे देवता हैं।[a] जहाँ दो या एक हैं,[b] मैं उसके साथ हूँ।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि के मुद्रित कॉप्टिक पाठ का शाब्दिक रूप कठिन है और लगभग ‘वे देवताओं में हैं’ पढ़ा जा सकता है, जबकि सामान्यीकृत पाठ ‘वह एक देवता है’ देता है। यहाँ ‘वे देवता हैं’ पांडुलिपि की बहुवचन कोपुला और यूनानी साक्षी POxy 1 के अनुरूप लिया गया है।
    reason: textual_variant
  - marker: b
    text: यूनानी साक्षी POxy 1 में ‘दो’ नहीं है; वहाँ केवल एक व्यक्ति के अकेले होने की बात आती है। उसी साक्षी में इसके बाद पत्थर उठाने और लकड़ी चीरने वाला अंश है, जो कॉप्टिक थोमा में अलग से कथन 77 में मिलता है।
    reason: cross_reference
  - marker: c
    text: ‘उसके’ मूल के पुल्लिंग एकवचन सर्वनाम का अनुवाद है। पांडुलिपि का ‘मैं’ बलयुक्त है, पर वह ‘मैं—मैं’ का शाब्दिक दोहराव नहीं है।
    reason: grammar
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु कहते हैं
  rationale: थोमा के कथन-संग्रह की सूत्रात्मक शैली और कॉप्टिक के प्रस्तुतीकरण की तत्क्षणता बनाए रखने के लिए वर्तमानकालिक ‘कहते हैं’ चुना गया।
- source_word: ⲡⲙⲁ … ⲉⲣⲉ-
  choice: जहाँ
  rationale: शाब्दिक अर्थ ‘वह स्थान जहाँ’ है; हिंदी में ‘जहाँ’ उसी संबंधवाचक स्थान-बोध को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ϣⲟⲙⲧ ⲛⲛⲟⲩⲧⲉ
  choice: तीन देवता
  rationale: बहुवचन को स्पष्ट रखा गया है; ‘देवता’ मूल की चौंकाने वाली बहुदेववाचक भाषा को ‘ईश्वर’ जैसे एकवचन धर्मशास्त्रीय शब्द से नहीं ढकता।
- source_word: ⲟⲩⲛⲟⲩⲧⲉ ⲡⲉ / manuscript ⲛⲉ
  choice: वे देवता हैं
  rationale: ‘तीन देवता’ को कर्ता मानकर बहुवचन विधेय प्रस्तुत किया गया है। पांडुलिपि का बहुवचन संबंधसूचक रूप और यूनानी साक्षी इस पाठ का समर्थन करते हैं, यद्यपि कॉप्टिक पंक्ति पाठगत कठिनाई रखती है।
- source_word: ⲥⲛⲁⲩ ⲏ ⲟⲩⲁ
  choice: दो या एक
  rationale: दोनों संख्याओं और उनके बीच के विकल्प को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
- source_word: ⲁⲛⲟⲕ ϯϣⲟⲟⲡ / normalized ⲁⲛⲟⲕ ⲁⲛⲟⲕϣⲱⲡⲉ
  choice: मैं … हूँ
  rationale: पांडुलिपि में स्वतंत्र सर्वनाम के बाद प्रथम-पुरुष वर्तमानकालिक क्रिया आती है; यह कर्ता को स्पष्ट या बलयुक्त करती है, पर हिंदी में कृत्रिम ‘मैं—मैं’ दोहराव आवश्यक नहीं है।
- source_word: ⲛⲙⲙⲁϥ
  choice: उसके साथ
  rationale: मूल का तीसरे पुरुष पुल्लिंग एकवचन सर्वनाम सुरक्षित रखा गया है, भले ही उससे पहले ‘दो या एक’ आता है।
theological_decisions:
- issue: ‘तीन देवता’ के बहुवचन को धर्मशास्त्रीय रूप से सामान्य बनाना
  choice: मूल की बहुवचन भाषा ‘तीन देवता’ और ‘वे देवता हैं’ के रूप में बनाए रखी गई।
  alternative: इसे ‘तीन ईश्वरीय जन’ या किसी त्रित्व-संबंधी व्याख्या में बदलना।
  rationale: पाठ स्वयं कोई त्रित्ववादी अथवा अन्य व्यवस्थित धर्मशास्त्रीय व्याख्या नहीं देता; अनुवाद को उसकी वास्तविक कठिनाई और तनाव सुरक्षित रखना चाहिए।
- issue: ‘दो या एक’ के बाद एकवचन सर्वनाम
  choice: ‘उसके साथ’ रखा गया।
  alternative: ‘उनके साथ’ करके हिंदी में संख्या-सामंजस्य स्थापित करना।
  rationale: कॉप्टिक सर्वनाम पुल्लिंग एकवचन है। बहुवचन बनाना पाठ की असंगति को चुपचाप सुलझा देता।
- issue: प्रथम पुरुष पर बल
  choice: स्वाभाविक ‘मैं उसके साथ हूँ’ रखा गया।
  alternative: ‘मैं—मैं उसके साथ हूँ’ या ‘मैं ही उसके साथ हूँ’।
  rationale: पांडुलिपि का व्याकरण स्वतंत्र सर्वनाम और प्रथम-पुरुष क्रिया का सामान्य बलयुक्त संयोजन है; दोहराव भ्रामक होगा और ‘ही’ अनावश्यक अनन्यता जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और कथन-संग्रह के अनुरूप सूत्रात्मक शैली रखी गई है। ‘देवता’ सामान्य पाठक के लिए सहज है और मूल के बहुवचन को स्पष्ट रखता है। वाक्य की पाठगत तथा संख्यात्मक असहजता को मुख्य पाठ में मिटाया नहीं गया; आवश्यक जानकारी टिप्पणियों में दी गई है।
