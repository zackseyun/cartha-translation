base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
translation:
  language: hi
  text: यीशु ने कहा, “फसल तो बहुत है, पर मज़दूर थोड़े हैं। तब स्वामी[a] से विनती करो कि वह फसल काटने के लिए मज़दूर भेजे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक शब्द ⲡϫⲟⲉⲓⲥ का अनुवाद “प्रभु” भी किया जा सकता है। इस कृषि-संदर्भ में “स्वामी” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲱϩⲥ
  choice: फसल
  rationale: यह शब्द कटाई और काटी जाने वाली उपज दोनों को सूचित कर सकता है। आधुनिक हिन्दी में “फसल” इस कृषि-संदर्भ में स्वाभाविक है; अंतिम वाक्य में “फसल काटने के लिए” प्रयोजन स्पष्ट करता है।
- source_word: ⲛⲁϣⲱϥ
  choice: बहुत
  rationale: अर्थ ‘बहुत/प्रचुर’ है। “फसल बहुत है” सरल, वर्तमान और स्रोत के परिमाणात्मक बल के अनुरूप है।
- source_word: ⲉⲣⲅⲁⲧⲏⲥ
  choice: मज़दूर
  rationale: यूनानी मूल का कॉप्टिक शब्द श्रमिकों को दर्शाता है। कृषि-प्रसंग में “मज़दूर” सामान्य हिन्दी का उपयुक्त शब्द है।
- source_word: ⲥⲟⲃⲕ
  choice: थोड़े
  rationale: स्रोत का अर्थ ‘कम/थोड़े’ है। गिने जा सकने वाले मज़दूरों के साथ “थोड़े” स्वाभाविक है।
- source_word: ⲥⲟⲡⲥ
  choice: विनती करो
  rationale: क्रिया का अर्थ आग्रहपूर्वक माँगना या प्रार्थना करना है। “विनती करो” उसकी तीव्रता को रखता है और इसे केवल सामान्य ‘पूछने’ में नहीं बदलता।
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: स्वामी
  rationale: शब्द ‘प्रभु’ अथवा ‘स्वामी’ दोनों अर्थ दे सकता है। कृषि-प्रसंग में “स्वामी” स्वाभाविक है, जबकि पादटिप्पणी धार्मिक उपाधि की सम्भावना सुरक्षित रखती है।
- source_word: ⲛⲁⲛⲟⲩϫⲉ ... ⲉⲃⲟⲗ
  choice: भेजे
  rationale: शाब्दिक बल ‘बाहर निकालना/भेज देना’ है। यहाँ काम के लिए मज़दूर रवाना करने के अर्थ में “भेजे” सहज हिन्दी है।
theological_decisions:
- issue: ⲡϫⲟⲉⲓⲥ को कृषि-स्वामी या धार्मिक उपाधि के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में “स्वामी”
  alternative: “प्रभु”
  rationale: कथन का तत्काल कृषि-संदर्भ ‘स्वामी’ का समर्थन करता है, पर स्रोत-शब्द की धार्मिक उपाधि वाली सम्भावना वास्तविक है; इसलिए उसे पादटिप्पणी में दिया गया है, न कि मिटाया गया है।
- issue: अंतिम ‘फसल’ को स्वामी की संपत्ति बताना
  choice: केवल “फसल”
  alternative: “उसकी फसल”
  rationale: कॉप्टिक पाठ अंतिम ‘फसल’ के साथ स्वामित्व-सूचक सर्वनाम नहीं देता। इसलिए समानांतर परंपराओं के आधार पर “उसकी” नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक कथन जैसा प्रवाह रखा गया है। “विनती करो” स्रोत की स्पष्ट आग्रहसूचक क्रिया को बनाए रखता है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
