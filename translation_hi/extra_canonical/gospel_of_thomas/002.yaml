base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/002.yaml
  text: Jesus said[a], "Let the one who seeks not stop seeking until he finds; and when he finds, he will be disturbed; and when he is disturbed, he will marvel[e][d][c][b]; and he will reign over the All."
translation:
  language: hi
  text: यीशु ने कहा, “जो खोजता है, वह तब तक खोजना बंद न करे, जब तक वह पा न ले; और जब वह पाएगा, तो व्याकुल होगा[b]; और जब वह व्याकुल होगा, तो विस्मित होगा; और वह समस्त पर राज करेगा[c]।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी खंड (POxy 654) में है: “वह चकित होगा … और राज करने के बाद विश्राम पाएगा।” कॉप्टिक पाठ में “वह व्याकुल होगा; … वह विस्मित होगा” है और अंत में “विश्राम पाएगा” नहीं है।'
    reason: textual_variant
  - marker: b
    text: कॉप्टिक शब्द ϣⲧⲟⲣⲧⲣ का अनुवाद “अशांत होगा” या “घबरा जाएगा” भी किया जा सकता है। यहाँ इसे अगले शब्द “विस्मित होगा” (ⲣϣⲡⲏⲣⲉ) से अलग रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “समस्त पर।” थोमा में यह अभिव्यक्ति सभी वस्तुओं की समग्रता या समूचे विश्व को सूचित करती है, केवल बहुत-सी वस्तुओं को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ…ⲗⲟ
  choice: खोजता रहे
  rationale: यह तीसरे पुरुष का निषेधात्मक आदेश है—खोजनेवाला खोजना बंद न करे। सकारात्मक हिंदी रूप ‘खोजता रहे’ सामान्य पाठक के लिए स्वाभाविक है और निरंतर खोजने का भाव बनाए रखता है।
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ
  choice: जो खोजता है
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को सहज और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: ϣⲁⲛⲧⲉ ⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: जब तक पा न ले
  rationale: कालवाचक ‘जब तक’ संरचना और खोज के फल को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: जब वह पा लेगा
  rationale: भावी उपलब्धि को दर्शानेवाली कालवाचक शर्त को स्पष्ट रूप से व्यक्त करता है।
- source_word: ϣⲧⲟⲣⲧⲣ
  choice: व्याकुल होगा
  rationale: मन के विचलित या अशांत होने का भाव देता है और अगले क्रियापद ‘विस्मित होगा’ से भेद बनाए रखता है।
- source_word: ⲣϣⲡⲏⲣⲉ
  choice: विस्मित होगा
  rationale: आश्चर्यचकित होने के भाव को गरिमापूर्ण, प्रचलित हिंदी में व्यक्त करता है।
- source_word: ⲣ̄ⲣ̄ⲣⲟ
  choice: राज करेगा
  rationale: क्रिया में निहित राजा होने या प्रभुत्व करने का भाव ‘राज करेगा’ से सीधे व्यक्त होता है।
- source_word: ⲉϫⲛ ⲡⲧⲏⲣϥ
  choice: समूचे जगत पर
  rationale: कॉप्टिक सामूहिक पद ‘समस्त/समग्र’ को सामान्य पाठक के लिए बोधगम्य बनाते हुए वस्तुओं की संपूर्णता या विश्वगत समष्टि का संकेत देता है।
theological_decisions:
- issue: ‘समस्त’ का विश्वगत/समष्टिगत अर्थ
  choice: मुख्य पाठ में ‘समूचे जगत पर’, साथ में व्याख्यात्मक पाद-टिप्पणी
  alternative: ‘सब पर’ या ‘समस्त पर’
  rationale: ‘सब पर’ व्यक्तियों के समूह की तरह समझा जा सकता है, जबकि ‘समस्त पर’ हिंदी में अस्वाभाविक है। चुना हुआ रूप थोमा के इस पद में निहित समग्र विश्व या समस्त वस्तुओं की धारणा को बिना किसी संप्रदायगत व्याख्या के संप्रेषित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य की सूत्रात्मक लय और खोज—प्राप्ति—व्याकुलता—विस्मय—राज्य की क्रमिक गति सुरक्षित रखी गई है। पुल्लिंग एकवचन मूल पाठ के व्याकरणिक रूप का अनुसरण करता है; इसे किसी विशेष लिंग तक अर्थ सीमित करने के उद्देश्य से नहीं चुना गया।
