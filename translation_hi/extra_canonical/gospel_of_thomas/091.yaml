base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/091.yaml
  text: They said to him[a], "Say to us who you are, so that we may believe in you." He said to them, "You test the face of the sky and the earth, and the one who is before you you do not recognize[e][d][c][b]; and this kairos you do not know how to test."
translation:
  language: hi
  text: उन्होंने उससे कहा, “हमें बताओ[e] कि तुम कौन हो, ताकि हम तुम पर विश्वास[a] करें।” उसने उनसे कहा, “तुम आकाश और पृथ्वी के मुख[b] को परखते हो, पर जो तुम्हारे सामने है, उसे नहीं पहचानते[c]; और इस कैरोस[d] को परखना नहीं जानते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विश्वास” का अर्थ यहाँ “भरोसा रखना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में शाब्दिक रूप से “आकाश और पृथ्वी का मुख” है; “मुख” से उनका दिखाई देने वाला रूप या स्वरूप भी अभिप्रेत हो सकता है।
    reason: cultural_note
  - marker: c
    text: इस वाक्य का अनुवाद “जो तुम्हारे सामने है” या “वह व्यक्ति जो तुम्हारे सामने है” किया जा सकता है; आगे का एकवचन सर्वनाम व्यक्तिगत संदर्भ के पक्ष में है।
    reason: textual_variant
  - marker: d
    text: मूल में यूनानी ऋण-शब्द “कैरोस” है, जिसका अर्थ निर्णायक, नियत या अनुकूल समय अथवा अवसर हो सकता है।
    reason: cultural_note
  - marker: e
    text: मुद्रित पाठ में “ϫⲟⲟⲥ ⲉⲣⲟⲛ” और सामान्यीकृत पाठ में “ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ” है; दोनों का अर्थ “हमें बताओ” है।
    reason: textual_variant
lexical_decisions:
- source_word: ϫⲟⲟⲥ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: हमें बता
  rationale: दोनों पाठ-रूप सरल आज्ञार्थक निवेदन व्यक्त करते हैं; आधुनिक हिन्दी में “हमें बता” स्वाभाविक है।
- source_word: ⲛⲧⲕ ⲛⲓⲙ
  choice: तू कौन है
  rationale: यह व्यक्ति की पहचान पूछने वाला सामान्य प्रश्न है। एकवचन सम्बोधन को स्पष्ट रखने के लिए “तू” रखा गया है।
- source_word: ⲣⲡⲓⲥⲧⲉⲩⲉ
  choice: विश्वास करना
  rationale: यूनानी ऋण-क्रिया का अर्थ विश्वास करना या भरोसा रखना हो सकता है; मुख्य पाठ में प्रचलित और व्यापक “विश्वास” उपयुक्त है।
- source_word: ⲣⲡⲓⲣⲁⲍⲉ
  choice: परखना
  rationale: यह चयन जाँचने/कसौटी पर रखने की तीक्ष्णता और कथन में क्रिया की पुनरावृत्ति दोनों बनाए रखता है।
- source_word: ⲡϩⲟ
  choice: मुख
  rationale: शाब्दिक और प्रभावशाली बिंब सुरक्षित रहता है; ‘रूप/दिखावट’ का मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: ⲡⲡⲉ (ⲧⲡⲉ)
  choice: आकाश
  rationale: पृथ्वी के साथ दृश्य जगत के संदर्भ में “आकाश” धार्मिक अर्थ वाले “स्वर्ग” से अधिक उपयुक्त है।
- source_word: ⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  choice: जो तुम्हारे सामने है
  rationale: रचना व्यक्ति या वस्तु दोनों की ओर संकेत कर सकती है। हिन्दी का “जो” इस अस्पष्टता को कुछ हद तक बनाए रखता है, जबकि आगे का एकवचन कर्म-संदर्भ व्यक्ति की सम्भावना खुली रखता है।
- source_word: ⲥⲟⲟⲩⲛ
  choice: पहचानना
  rationale: सामने उपस्थित जन को न जानने के संदर्भ में “पहचानना” सम्बन्धपरक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲕⲁⲓⲣⲟⲥ
  choice: उचित समय
  rationale: यूनानी ऋण-शब्द किसी निर्णायक, अनुकूल या नियत अवसर/समय का बोध देता है। साधारण पाठक के लिए अर्थपूर्ण हिन्दी दी गई और व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ⲥⲟⲟⲩⲛ ⲛⲧⲉ ⲣⲡⲓⲣⲁⲍⲉ
  choice: परखना तुम नहीं जानते
  rationale: यह योग्यता या जानने-के-ढंग को व्यक्त करता है; हिन्दी वाक्य स्वाभाविक रहते हुए इसी अभिप्राय को वहन करता है।
theological_decisions:
- issue: सामने उपस्थित संदर्भ का व्यक्ति या वस्तु होना
  choice: जो तुम्हारे सामने है
  alternative: वह व्यक्ति जो तुम्हारे सामने है
  rationale: कॉप्टिक रचना में कुछ व्याकरणिक अस्पष्टता है, यद्यपि बाद का एकवचन सर्वनाम व्यक्तिगत संदर्भ का समर्थन करता है। मुख्य पाठ ने इसे अनावश्यक रूप से निश्चित नहीं किया।
- issue: καιρός का अर्थ
  choice: उचित समय
  alternative: नियत समय / निर्णायक अवसर / कैरोस
  rationale: किसी विशिष्ट अंत-समय या धर्मसैद्धान्तिक योजना को आरोपित किए बिना समय की गुणात्मक और अवसरगत धारणा रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। संवाद की एकवचन निकट सम्बोधन-शैली के लिए “तू/तुझ” और समूह के लिए “तुम” रखा गया है। “मुख” जैसे मूल के विशिष्ट बिंब को बनाए रखते हुए पादटिप्पणी से अर्थ स्पष्ट किया गया है।
