  to: उन्होंने उससे कहा, “हमें बताओ[e] कि तुम कौन हो, ताकि हम तुम पर विश्वास[a] करें।” उसने उनसे कहा, “तुम आकाश और पृथ्वी के मुख[b] को परखते हो, पर जो तुम्हारे सामने है, उसे नहीं पहचानते[c]; और इस कैरोस[d] को परखना नहीं जानते।”
