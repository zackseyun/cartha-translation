base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
translation:
  language: hi
  text: यीशु ने कहा, “तुम धन्य हो, जब वे तुमसे घृणा करें और तुम्हें सताएँ[a]; उन्हें उस जगह में कोई स्थान नहीं मिलेगा जहाँ उन्होंने तुम्हें सताया[b]।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस क्रम की सभी क्रियाओं में कॉप्टिक तृतीय-पुरुष बहुवचन का प्रयोग करता है। अनिश्चित कर्ता के कारण इसे कर्मवाच्य भी समझा जा सकता है: “जब तुमसे घृणा की जाए और तुम्हें सताया जाए; उस जगह में कोई स्थान नहीं मिलेगा जहाँ तुम्हें सताया गया।”'
    reason: व्याकरणगत अस्पष्टता
  - marker: b
    text: मूल पाठ में ‘स्थान’ के लिए यूनानी से आया ⲧⲟⲡⲟⲥ और ‘जगह’ के लिए देशज कॉप्टिक ⲙⲁ है। पहला शब्द थोमा में कभी-कभी आध्यात्मिक ठिकाने या स्थिति का संकेत दे सकता है; यहाँ यह संकेत संभव है, पर निश्चित नहीं।
    reason: शाब्दिक भेद और संभावित अर्थ-छाया
  - marker: c
    text: मत्ती 5:11 और लूका 6:22 के समानांतर धन्यता-वचनों के विपरीत, यहाँ यह नहीं कहा गया कि सताव यीशु के कारण या मनुष्य के पुत्र के कारण होता है।
    reason: समानांतर पाठ का अंतर
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य
  rationale: यह यूनानी मूल का शब्द धन्यता-वचन में प्रयुक्त होता है; ‘धन्य’ आधुनिक हिन्दी में संक्षिप्त, प्रतिष्ठित और परिचित समतुल्य है।
- source_word: ⲙⲉⲥⲧⲉ-
  choice: घृणा करना
  rationale: क्रिया का सीधा अर्थ ‘घृणा करना’ है; यह विरोध की तीव्रता को कम नहीं करता।
- source_word: ⲇⲓⲱⲕⲉ
  choice: सताना
  rationale: यह यूनानी मूल की क्रिया पीछा करने या उत्पीड़ित करने का भाव रखती है; व्यक्तियों के संदर्भ में ‘सताना’ सहज और सटीक हिन्दी है।
- source_word: ϩⲉ ⲉ-
  choice: मिलना
  rationale: इस रचना का अर्थ ‘पाना/मिलना’ है; हिन्दी वाक्य में कर्ता के साथ ‘उन्हें ... नहीं मिलेगा’ स्वाभाविक है।
- source_word: ⲧⲟⲡⲟⲥ
  choice: स्थान
  rationale: यूनानी आगत शब्द को अपेक्षाकृत औपचारिक ‘स्थान’ से व्यक्त किया गया है, ताकि साथ आए देशज ⲙⲁ से इसका भेद दिख सके।
- source_word: ⲙⲁ
  choice: जगह
  rationale: देशज कॉप्टिक शब्द सामान्य स्थल या जगह को बताता है; ‘जगह’ चुनने से ⲧⲟⲡⲟⲥ के ‘स्थान’ से शाब्दिक भेद बना रहता है।
theological_decisions:
- issue: तृतीय-पुरुष बहुवचन का कर्तृवाच्य अथवा कर्मवाच्य अनुवाद
  choice: 'कर्तृवाच्य: ‘वे ... घृणा करें ... सताएँ ... उन्हें ... नहीं मिलेगा’'
  alternative: 'कर्मवाच्य: ‘जब तुमसे घृणा की जाए और तुम्हें सताया जाए; और ... कोई स्थान नहीं मिलेगा’'
  rationale: कॉप्टिक में तृतीय-पुरुष बहुवचन अनिश्चित कर्ता के कारण कर्मवाच्य भाव दे सकता है, पर पूरे कथन में उसी बहुवचन कर्ता को बनाए रखना व्याकरण के अधिक निकट है और सताने वालों के अंततः ‘स्थान’ न पाने की विडंबना को सुरक्षित रखता है।
- issue: ⲧⲟⲡⲟⲥ और ⲙⲁ के अर्थगत संबंध
  choice: ‘स्थान’ और ‘जगह’ के रूप में भेद बनाए रखना
  alternative: दोनों को केवल ‘स्थान’ या दोनों को केवल ‘जगह’ कहना
  rationale: मूल में दो अलग शब्द हैं। पहला थोमा में आध्यात्मिक ठिकाने या स्थिति का संकेत दे सकता है, पर यह अर्थ निश्चित नहीं है; इसलिए मुख्य पाठ भेद बचाता है और पादटिप्पणी संभावना बताती है, उसे सिद्धांत के रूप में आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उलटे हुए ‘धन्य हो तुम’ क्रम से धन्यता-वचन की उद्घोषणात्मक लय बनी रहती है। ‘स्थान’ और ‘जगह’ का जानबूझकर किया गया भेद मूल के दो शब्दों को हिन्दी में दिखाई देता है, जबकि पादटिप्पणी संभावित धार्मिक अर्थ को अनिवार्य व्याख्या नहीं बनाती।
