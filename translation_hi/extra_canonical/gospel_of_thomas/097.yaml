  source_fidelity: 'मसौदा साहिदी पाठ के मुख्य विवरणों को ठीक रखता है: ‘पिता का राज्य,’ स्त्री, आटे से भरा घड़ा, मार्ग पर चलते हुए उसका अभी दूर होना, हत्थे का टूटना, पीछे आटे का निकल जाना, अनभिज्ञता, घर पहुँचना, और घड़े का खाली मिलना। ‘गिरता गया’ मूल के खाली होते/पीछे निकलते जाने के भाव का स्वीकार्य, स्वाभाविक रूप है।'
