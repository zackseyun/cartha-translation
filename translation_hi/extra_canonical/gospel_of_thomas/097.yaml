  terminology: ‘पिता का राज्य,’ ‘घड़ा,’ ‘आटा,’ और ‘हत्था’ उपयुक्त हैं। हत्थे के लिए ‘कान’ वाला शाब्दिक फुटनोट सही है। ‘परेशानी’ ϩⲓⲥⲉ के ‘trouble/problem/toil’ अर्थ-क्षेत्र में है और मुख्य पाठ में अधिक स्वाभाविक है।
