base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
translation:
  language: hi
  text: यीशु ने कहा, “पिता का राज्य उस स्त्री के समान है जो आटे से भरा एक घड़ा उठाए हुए थी। जब वह मार्ग पर चल रही थी और अभी दूर ही थी, तब घड़े का हत्था[a] टूट गया। आटा उसके पीछे मार्ग पर गिरता गया। उसे इसका पता नहीं था; उसे इस परेशानी[b] का भी ध्यान नहीं हुआ था। जब वह अपने घर पहुँची, तो उसने घड़ा नीचे रखा और उसे खाली पाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘कान’; यहाँ घड़े का हत्था।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुसीबत’, ‘कष्ट’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲗⲙⲉⲉⲓ
  choice: घड़ा
  rationale: यह शब्द घड़े या मटके जैसे पात्र को सूचित करता है; ‘घड़ा’ सामान्य, स्पष्ट और प्रसंगानुकूल है।
- source_word: ⲛⲟⲉⲓⲧ
  choice: आटा
  rationale: शब्द का अर्थ flour/meal है; आधुनिक हिन्दी में इस प्रसंग के लिए ‘आटा’ सबसे सहज है।
- source_word: ⲙⲁⲁϫⲉ
  choice: हत्था
  rationale: शाब्दिक अर्थ ‘कान’ है, पर पात्र के संदर्भ में उससे आशय पकड़ने वाले हत्थे से है।
- source_word: ⲟⲩⲱϭⲡ
  choice: टूट गया
  rationale: क्रिया पात्र के हत्थे के टूट जाने को सीधे व्यक्त करती है।
- source_word: ϣⲟⲩⲟ
  choice: गिरता गया
  rationale: मूल क्रिया खाली होने या उँड़ेल दिए जाने का भाव रखती है; छेद वाले घड़े और पीछे मार्ग पर आटे के क्रमशः निकलने को ‘गिरता गया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ϩⲓⲥⲉ
  choice: मुसीबत
  rationale: शब्द में कष्ट, परेशानी या विपत्ति का अर्थ है; यहाँ अनजाने में हुई हानि के लिए ‘मुसीबत’ उपयुक्त है।
- source_word: ⲟⲩⲉ
  choice: दूर
  rationale: स्रोत में उपस्थित ‘दूर होना’ के परिस्थिति-वाचक भाव को बिना किसी अनुल्लिखित गंतव्य को जोड़े सुरक्षित रखा गया है।
theological_decisions:
- issue: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ का अनुवाद
  choice: पिता का राज्य
  alternative: परमेश्वर का राज्य / स्वर्ग का राज्य
  rationale: मूल पाठ विशेष रूप से ‘पिता का राज्य’ कहता है; इसे समानांतर धार्मिक पदों से सामंजस्य बैठाकर नहीं बदला गया।
- issue: दृष्टान्त के अर्थ की व्याख्या
  choice: अर्थ को स्पष्ट करने वाली कोई व्याख्या पाठ में नहीं जोड़ी गई
  alternative: राज्य की अदृश्य हानि या अनजानी प्रक्रिया के रूप में अर्थ खोलना
  rationale: कथन स्वयं व्याख्या नहीं देता; उसकी वास्तविक अस्पष्टता और धार्मिक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मार्ग’ और ‘पिता का राज्य’ धार्मिक-साहित्यिक गरिमा बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज है।
