base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
translation:
  language: hi
  text: '**कथन 63**


    यीशु ने कहा, “एक धनी मनुष्य था, जिसके पास बहुत धन[a] था। उसने कहा, ‘मैं अपने धन का उपयोग करूँगा, ताकि मैं बोऊँ, फसल काटूँ[b], पौधे लगाऊँ[c] और अपने भंडारों[d] को उपज से भर दूँ, जिससे मुझे किसी चीज़ की कमी न हो।’ इन्हीं बातों के बारे में वह अपने मन में सोच रहा था[e]। और उसी रात वह मर गया। जिसके कान हों, वह सुने।”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲭⲣⲏⲙⲁ का अर्थ धन, रुपया-पैसा या संपत्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘फसल काटूँ’ के कॉप्टिक शब्द ⲱϩⲥ में ϩ अक्षर पांडुलिपि की क्षति के कारण संपादकीय रूप से पुनःस्थापित किया गया है।
    reason: lacuna_or_restoration
  - marker: c
    text: यहाँ कॉप्टिक क्रिया का अर्थ ‘पौधे लगाना/रोपना’ है, ‘इमारत बनाना’ नहीं।
    reason: lexical_alternative
  - marker: d
    text: कॉप्टिक ⲁϩⲟ का अनुवाद कोठार, अन्नागार या भंडार भी किया जा सकता है।
    reason: lexical_alternative
  - marker: e
    text: मूल में ‘इन्हीं’ और विचार की वस्तु दोनों बहुवचन हैं; इसलिए इसे एकवचन ‘यही वह बात थी’ नहीं किया गया।
    reason: source_grammar
  - marker: f
    text: तुलना के लिए लूका 12:16–21 देखें। दोनों वृत्तांतों में उल्लेखनीय शब्दगत और कथात्मक भिन्नताएँ हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ⲛⲡⲗⲟⲩⲥⲓⲟⲥ
  choice: धनी
  rationale: यूनानी से आए विशेषण का सीधा सामाजिक-आर्थिक अर्थ रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ⲭⲣⲏⲙⲁ
  choice: धन
  rationale: शब्द धन, रुपया-पैसा या संपत्ति का बोध करा सकता है। प्रसंग में कृषि के लिए इस्तेमाल की जाने वाली पूँजी का भाव है; ‘धन’ अर्थ की चौड़ाई और पुनरावृत्ति दोनों बनाए रखता है।
- source_word: ⲣⲭⲣⲱ
  choice: उपयोग करूँगा
  rationale: कारक रूप का अर्थ ‘काम में लाना’ है; यह सहज हिन्दी में भविष्यकालीन संकल्प को व्यक्त करता है।
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: ताकि
  rationale: यह स्पष्ट रूप से उद्देश्यसूचक पद है; इसलिए कारणसूचक ‘क्योंकि’ नहीं लिया गया।
- source_word: ϫⲟ
  choice: बोऊँ
  rationale: मानक कृषि-क्रिया है और मूल की संक्षिप्तता रखती है।
- source_word: ⲱϩⲥ
  choice: फसल काटूँ
  rationale: ‘बोने’ के साथ स्वाभाविक कृषि-युग्म बनाता है और सामान्य पाठक के लिए ‘काटूँ’ से अधिक स्पष्ट है।
- source_word: ⲧⲱⲱϭⲉ
  choice: पौधे लगाऊँ
  rationale: मूल क्रिया कृषि-संबंधी ‘लगाना/रोपना’ है; यह लूका के वृत्तांत से वास्तु-संबंधी ‘बनाना’ आयात नहीं करती।
- source_word: ⲁϩⲟ
  choice: भंडारों
  rationale: यह कोठार, खत्ती या अन्नागार जैसे अधिक विशिष्ट विकल्पों की अपेक्षा स्रोत की व्यापकता बनाए रखता है।
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: उपज
  rationale: कृषि-भंडारण के प्रसंग में ‘फल’ से व्यापक और अधिक स्वाभाविक है।
- source_word: ⲣϭⲣⲱϩ ⲛⲗⲁⲁⲩ
  choice: किसी चीज़ की कमी न हो
  rationale: नकारात्मक रचना का सीधा अर्थ ‘किसी भी वस्तु के लिए जरूरतमंद न होना’ है; हिन्दी में यह संक्षिप्त और सहज है।
- source_word: ⲡⲉⲧⲉⲟⲩⲛⲙⲁϫⲉ ⲛⲛⲧⲟϥ
  choice: जिसके कान हों
  rationale: स्रोत में बहुवचन ‘कान’ है और इसके साथ ‘सुनने के लिए’ जैसा कोई अतिरिक्त infinitive नहीं है।
theological_decisions:
- issue: धनी व्यक्ति की मृत्यु का कर्ता और कारण
  choice: “उसी रात वह मर गया”
  alternative: “उसी रात उसका प्राण ले लिया गया”
  rationale: कॉप्टिक केवल उसकी मृत्यु बताता है; वह न तो परमेश्वर को प्रत्यक्ष कर्ता बनाता है, न मृत्यु का नैतिक कारण स्पष्ट करता है।
- issue: अंतिम श्रवण-सूत्र
  choice: “जिसके कान हों, वह सुने”
  alternative: “जिसके सुनने के कान हों, वह सुन ले”
  rationale: स्रोत का पहला खंड केवल ‘जिसके कान हों’ कहता है। उसे समदर्शी सुसमाचारों के अधिक विस्तृत सूत्र से मिलाने के बजाय थॉमस की संक्षिप्त अभिव्यक्ति रखी गई है।
- issue: लूका 12 के दृष्टांत से संबंध
  choice: थॉमस के स्वतंत्र शब्दक्रम और बिंबों को बनाए रखना
  alternative: ‘अपने खत्ते तोड़कर बड़े बनाऊँगा’ जैसे लूका-सदृश शब्द
  rationale: यह कथन लूका 12:16–21 से विषयगत समानता रखता है, पर कॉप्टिक पाठ यहाँ बोने, काटने और पौधे लगाने की बात करता है; पाठों को समरूप नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य रखा गया है। कृषि-क्रियाओं का असामान्य मूल क्रम—बोना, फसल काटना, पौधे लगाना—सुधारकर सामान्य नहीं किया गया, क्योंकि वही उपलब्ध कॉप्टिक पाठ में है। वाक्य छोटे रखे गए हैं ताकि कथन की सूत्रात्मक शैली बनी रहे।
