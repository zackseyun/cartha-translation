base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/092.yaml
  text: Jesus said[a], “Seek, and you will find. But the things that you asked me about in those days, which I did not tell you on that day—now I am willing to tell them[e][d][c][b], and you are not seeking them.”
translation:
  language: hi
  text: यीशु ने कहा, “खोजो, और तुम पाओगे।[d] लेकिन जिन बातों के विषय में तुमने उन दिनों मुझसे पूछा था[a][b], और जिन्हें मैंने उस दिन तुम्हें नहीं बताया था—अब मैं उन्हें बताने को तैयार हूँ[c][e], पर तुम उनकी खोज नहीं कर रहे हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सम्बन्धवाचक रचना को एकवचन (‘जिस बात’) या बहुवचन (‘जिन बातों’) समझा जा सकता है। आगे आने वाले बहुवचन सर्वनाम बहुवचन अर्थ का समर्थन करते हैं।
    reason: textual_variant
  - marker: b
    text: मुद्रित पाठ का रूप-विभाजन ‘तुमने उनसे पूछा’ का संकेत देता है, जबकि सामान्यीकृत पंक्ति ‘तुमने मुझसे पूछा’ का समर्थन करती है। अनुवाद में ‘मुझसे’ अपनाया गया है।
    reason: textual_variant
  - marker: c
    text: कॉप्टिक में ⲉϩⲛⲁ के साथ क्रिया का अनन्त रूप तत्परता या अभिप्राय व्यक्त करता है। इसलिए ‘मैं बताने को तैयार हूँ’ का अनुवाद ‘मैं बताने वाला हूँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘खोजो … पाओगे’ एक जानी-पहचानी जोड़ी है; तुलना करें मत्ती 7:7 और लूका 11:9। पर थोमा का यह कथन आगे अलग दिशा में जाता है और ‘उन दिनों/उस दिन’ तथा ‘अब’ के बीच विरोध दिखाता है।
    reason: cross_reference
  - marker: e
    text: 'वैकल्पिक वाक्य-विन्यास: ‘लेकिन जिन बातों के विषय में तुमने उन दिनों मुझसे पूछा था, उन्हें मैंने उस दिन तुम्हें नहीं बताया था; अब मैं उन्हें बताने को तैयार हूँ, पर तुम उनकी खोज नहीं कर रहे हो।’'
    reason: previous_rendering
lexical_decisions:
- source_word: ϣⲓⲛⲉ
  choice: खोजो / खोज करना
  rationale: यह सक्रिय रूप से ढूँढ़ने का भाव रखता है। ‘खोजो’ संक्षिप्त आज्ञा और आगे आने वाले ‘पाओगे’ के साथ मूल की जोड़ी को बनाए रखता है।
- source_word: ϭⲓⲛⲉ
  choice: पाओगे
  rationale: यह ϣⲓⲛⲉ का सीधा प्रतिरूप है; ‘पाना’ सामान्य, स्वाभाविक और अलंकरणरहित हिन्दी है।
- source_word: ⲁⲗⲗⲁ
  choice: लेकिन
  rationale: यह कथन में आने वाले तीखे विरोधात्मक मोड़ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ⲡⲉⲧⲉⲣⲉ… / ⲛⲉⲧⲁ…
  choice: जिन बातों
  rationale: रूप को एकवचन या बहुवचन समझा जा सकता है, पर आगे के बहुवचन सर्वनाम बहुवचन अर्थ का समर्थन करते हैं।
- source_word: ϫⲛⲟⲩⲉⲓ ⲉⲣⲟⲟⲩ
  choice: जिन बातों के विषय में … मुझसे पूछा
  rationale: ‘के विषय में’ पूछी गई विषय-वस्तु को व्यक्त करता है, जबकि ‘मुझसे’ प्रश्न के संबोधित व्यक्ति को स्पष्ट करता है।
- source_word: ⲛⲛⲓϩⲟⲟⲩ
  choice: उन दिनों
  rationale: यह कालसूचक पद का स्वाभाविक हिन्दी रूप है।
- source_word: ⲙ̄ⲫⲟⲟⲩ ⲉⲧⲙ̄ⲙⲁⲩ
  choice: उस दिन
  rationale: शाब्दिक कालसूचक अभिव्यक्ति को सुरक्षित रखता है और ‘उन दिनों … उस दिन’ की पुनरावृत्ति को मिटाता नहीं।
- source_word: ϫⲱ (ⲟⲩ)
  choice: बताना
  rationale: विषय-वस्तु और श्रोताओं, दोनों के साथ इस प्रसंग में ‘बताना’ स्वाभाविक हिन्दी क्रिया है।
- source_word: ⲧⲉⲛⲟⲩ
  choice: अब
  rationale: यह सीधा वर्तमानकालिक संकेत है और पहले के समय से विरोध बनाता है।
- source_word: ⲉϩⲛⲁ + ϫⲟⲟⲩ
  choice: बताने को तैयार हूँ
  rationale: यह तत्परता या अभिप्राय व्यक्त करने वाली रचना है। पहले न बताने के विरोध में ‘तैयार हूँ’ इच्छुकता को स्वाभाविक हिन्दी में रखता है।
- source_word: ⲛⲥⲁⲛⲧⲟⲟⲩ / ⲛⲥⲱⲟⲩ
  choice: उनकी खोज
  rationale: ⲛⲥⲁ खोज के लक्ष्य को चिह्नित करता है; ‘उनकी खोज’ उस वस्तु को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
