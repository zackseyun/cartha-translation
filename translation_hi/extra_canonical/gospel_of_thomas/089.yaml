base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
translation:
  language: hi
  text: यीशु ने कहा, “तुम प्याले का बाहरी भाग क्यों धोते हो?[a] क्या तुम नहीं जानते[b] कि जिसने भीतरी भाग बनाया, उसी ने बाहरी भाग भी बनाया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्याले की बाहर वाली ओर।” इसी के समानांतर आगे “भीतर वाली ओर” आता है।
    reason: मूल के समानांतर स्थानवाचक पदबंधों को स्पष्ट करना।
  - marker: b
    text: यहाँ प्रयुक्त कॉप्टिक क्रिया का अर्थ “समझते” या “पहचानते” भी हो सकता है।
    reason: महत्त्वपूर्ण शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: ⲉⲓⲱⲉ
  choice: धोते हो
  rationale: यह क्रिया पात्र को धोने के ठोस, सामान्य कार्य को व्यक्त करती है; ‘शुद्ध करते हो’ अनावश्यक रूप से धार्मिक अर्थ ला सकता है।
- source_word: ⲡⲥⲁ ⲛⲃⲟⲗ / ⲡⲥⲁ ⲛϩⲟⲩⲛ
  choice: बाहर का भाग / भीतर का भाग
  rationale: दोनों समानांतर कॉप्टिक पदबंधों में ‘भाग/ओर’ का तत्व बनाए रखते हुए स्वाभाविक हिन्दी और भीतर-बाहर का स्पष्ट विरोध मिलता है।
- source_word: ⲡⲡⲟⲧⲏⲣⲓⲟⲛ
  choice: प्याला
  rationale: यूनानी मूल के इस कॉप्टिक शब्द का सामान्य अर्थ पीने का प्याला है; हिन्दी बाइबलीय गद्य में भी यह सहज और परिचित है।
- source_word: ⲛⲟⲉⲓ
  choice: जानते
  rationale: मूल का सीधा संज्ञानात्मक अर्थ रखा गया है; ‘समझते’ और ‘एहसास करते’ भी संभव हैं, इसलिए विकल्प पादटिप्पणी में बताया गया है।
- source_word: ⲧⲁⲙⲓⲟ
  choice: बनाया
  rationale: मूल क्रिया का अर्थ ‘बनाना/गढ़ना’ है और इसे पहले प्रयुक्त ‘धोना’ से अलग रखना आवश्यक है।
- source_word: ⲟⲛ
  choice: भी
  rationale: यह भीतर बनाने वाले और बाहर बनाने वाले की समानता तथा अतिरिक्त समावेश को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ‘जिसने भीतर बनाया’ का कर्ता और आशय
  choice: ‘जिसने भीतर का भाग बनाया’
  alternative: ‘भीतर और बाहर का सृष्टिकर्ता’ अथवा स्पष्ट रूप से ‘परमेश्वर’
  rationale: कॉप्टिक पाठ केवल ‘जिसने’ कहता है; कर्ता को परमेश्वर के रूप में स्पष्ट करना संभावित धार्मिक आशय को पाठ में जोड़ देता। अनिश्चितता को यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रश्नात्मक और गरिमापूर्ण शैली रखी गई है। ‘प्याला’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है। मूल के भीतर/बाहर संबंधी समानांतरपन को ‘भाग’ की पुनरावृत्ति से सुरक्षित रखा गया है।
