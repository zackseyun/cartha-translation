base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/100.yaml
  text: They showed Jesus a gold coin,[1] and they said to him[1], "Those who belong to Caesar demand the tax from us."[2] He said to them, "Give the things of Caesar to Caesar; give the things of God to God[a][3][2]; and what is mine—give it to me."[3]
translation:
  language: hi
  text: उन्होंने यीशु को सोने का एक सिक्का[a] दिखाया और उससे कहा, “कैसर के लोग हमसे कर माँगते हैं[b]।” तब यीशु ने उनसे कहा, “कैसर की वस्तुएँ कैसर को दो; परमेश्वर की वस्तुएँ परमेश्वर को दो; और जो मेरा है, वह मुझे दो[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से ‘एक सोना’ है; इस प्रसंग में आशय सोने के एक सिक्के से है।
    reason: lexical_alternative
  - marker: b
    text: 'इसका अधिक शाब्दिक अनुवाद हो सकता है: “जो कैसर के हैं, वे हमसे कर माँगते हैं।” कर-वसूली के संदर्भ में “कर वसूलते हैं” भी संभव है।'
    reason: lexical_alternative
  - marker: c
    text: थॉमस के इस कथन में अंत की यह तीसरी आज्ञा—“और जो मेरा है, वह मुझे दो”—समान विषय वाले मत्ती 22:21, मरकुस 12:17 और लूका 20:25 के कथनों में नहीं मिलती।
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲟⲩⲛⲟⲩⲃ
  choice: सोने का एक सिक्का
  rationale: ⲛⲟⲩⲃ का शाब्दिक अर्थ ‘सोना’ है, पर कर के प्रसंग में यह सोने के सिक्के को सूचित करता है; किसी विशेष मूल्यवर्ग को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ⲕⲁⲓⲥⲁⲣ
  choice: कैसर
  rationale: यूनानी से आए ऐतिहासिक नाम/पदवी को बनाए रखा गया है; ‘सम्राट’ अर्थ स्पष्ट करता, पर मूल की ऐतिहासिक रंगत घटाता।
- source_word: ⲛⲉⲧⲏⲡ ⲁⲕⲁⲓⲥⲁⲣ
  choice: कैसर के लोग
  rationale: यह वाक्यांश कैसर से संबंधित या उसकी सेवा में लगे लोगों को सूचित करता है; सहज हिन्दी में ‘कैसर के लोग’ मूल की व्यापकता बनाए रखता है।
- source_word: ⲥⲉϣⲓⲧⲉ
  choice: माँगते हैं
  rationale: क्रिया का मूल अर्थ ‘खोजना/माँगना’ है। कर-वसूली के संदर्भ में ‘माँगते हैं’ स्वाभाविक है और ‘वसूलते हैं’ की अपेक्षा मूल की शक्ति को कम निर्णायक ढंग से व्यक्त करता है।
- source_word: ⲡϣⲱⲙ
  choice: कर
  rationale: यहाँ शब्द राजकीय कर या महसूल को सूचित करता है; आधुनिक सामान्य हिन्दी में ‘कर’ सबसे स्पष्ट है।
- source_word: ϯ
  choice: दो
  rationale: साधारण आज्ञार्थक ‘दो’ मूल का सीधा और स्वाभाविक रूप है; परिचित धर्मग्रंथीय समानांतर से ‘चुका दो’ या ‘लौटा दो’ नहीं लिया गया।
- source_word: ⲛⲁⲕⲁⲓⲥⲁⲣ / ⲛⲁⲡⲛⲟⲩⲧⲉ
  choice: कैसर की वस्तुएँ / परमेश्वर की वस्तुएँ
  rationale: पांडुलिपि के बहुवचन स्वामित्वसूचक रूप ‘कैसर की वस्तुएँ’ और ‘परमेश्वर की वस्तुएँ’ हैं। इसे बनाए रखने से अंतिम एकवचन ‘जो मेरा है’ के साथ मूल का व्याकरणिक अंतर सुरक्षित रहता है।
- source_word: ⲡⲉⲧⲉⲡⲱⲉⲓ
  choice: जो मेरा है
  rationale: सापेक्ष रचना का संक्षिप्त और सीधा हिन्दी रूप; यह अंतिम कथन की तीक्ष्णता और खुले अर्थ को बनाए रखता है।
theological_decisions:
- issue: कैसर, परमेश्वर और यीशु से संबंधित तीन आज्ञाओं का परस्पर संबंध
  choice: तीनों आज्ञाओं को समानांतर रूप में रखा गया और ‘जो मेरा है’ की व्याख्या नहीं जोड़ी गई।
  alternative: इन्हें कर, उपासना और शिष्यत्व के निश्चित धर्मवैज्ञानिक क्षेत्रों के रूप में स्पष्ट करना।
  rationale: मूल कथन यह नहीं बताता कि यीशु की वस्तु क्या है या तीनों दावों का ठीक संबंध क्या है; व्याख्यात्मक विस्तार वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को अनुचित रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कैसर’ ऐतिहासिक पदवी के रूप में सुरक्षित है। ‘वस्तुएँ’ का प्रयोग कुछ औपचारिक होते हुए भी मूल के बहुवचन और अंतिम एकवचन ‘जो मेरा है’ के बीच महत्त्वपूर्ण अंतर को स्पष्ट रखता है।
