base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/027.yaml
  text: If you do not fast the world[a], you will not find the kingdom; and if you do not make the Sabbath a Sabbath[e][d][c][b], you will not see the Father.
translation:
  language: hi
  text: यदि तुम संसार का उपवास नहीं करते[a], तो तुम राज्य को नहीं पाओगे[b]; और यदि तुम सब्त को सब्त नहीं बनाते[c][d], तो तुम पिता को नहीं देखोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में यह असामान्य वाक्यांश ‘संसार का उपवास करना’ है—अर्थात् ‘उपवास करना’ यहाँ सकर्मक क्रिया की तरह प्रयुक्त हुआ है। इसे प्रायः अर्थ स्पष्ट करने के लिए ‘संसार से उपवास करना’ कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी साक्षी पी.ऑक्सी. 1 में ‘परमेश्वर का राज्य’ है; नाग हम्मादी के कॉप्टिक पाठ में केवल ‘राज्य’ है।
    reason: textual_variant
  - marker: c
    text: ‘सब्त को सब्त बनाना’ मूल की शाब्दिक, पुनरुक्त अभिव्यक्ति है। इसका आशय सम्भवतः सब्त को वास्तव में सब्त के रूप में मानना या उसका पालन करना है, पर अनुवाद मूल की संक्षिप्तता और खुलापन बनाए रखता है।
    reason: cultural_note
  - marker: d
    text: पांडुलिपि में पहली बार ‘सब्त’ की वर्तनी ⲥⲁⲙⲃⲁⲧⲟⲛ है, जिसे सामान्यीकृत पाठ में ⲥⲁⲃⲃⲁⲧⲟⲛ किया गया है; यह इस कॉप्टिक लेखन-परंपरा में mb/bb का सामान्य रूपांतर है।
    reason: dialect_note
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ … ⲧⲙ-
  choice: यदि … नहीं
  rationale: यह रचना भविष्य-सापेक्ष शर्त व्यक्त करती है; हिन्दी में ‘यदि’ कथन की संक्षिप्त और गंभीर शैली बनाए रखता है।
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ ⲉⲡⲕⲟⲥⲙⲟⲥ
  choice: संसार का उपवास करना
  rationale: यहाँ ⲉ- क्रिया के प्रत्यक्ष कर्म को चिह्नित करता है; यूनानी साक्षी में भी ‘संसार’ कर्मकारक में है। असामान्य सकर्मक प्रयोग को सामान्य ‘संसार से उपवास’ बनाकर उसका तनाव मिटाने के बजाय हिन्दी में ‘संसार का उपवास’ रखा गया है।
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: संसार
  rationale: आधुनिक धार्मिक हिन्दी में स्वाभाविक और व्यापक रूप से बोधगम्य शब्द है; ‘कॉसमॉस’ अनावश्यक रूप से तकनीकी होता।
- source_word: ⲁϩⲉ
  choice: पाना
  rationale: स्रोत का अर्थ ‘पाना/खोजना’ हो सकता है; ‘राज्य को पाना’ सहज हिन्दी है और प्राप्ति का भाव सुरक्षित रखता है।
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: राज्य
  rationale: कॉप्टिक में केवल निश्चित ‘राज्य’ है, किसी संबंधवाचक पद के बिना; अनुवाद भी उतना ही अनिर्दिष्ट रखा गया है।
- source_word: ⲉⲓⲣⲉ ⲛⲡⲥⲁⲃⲃⲁⲧⲟⲛ ⲛⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: सब्त को सब्त बनाना
  rationale: मूल की संक्षिप्त विधेय-कर्म रचना और जानबूझकर की गई पुनरुक्ति सुरक्षित रहती है; इसे सीधे ‘सब्त मानना’ कहना अर्थ का समाधान कर देता।
- source_word: ⲛⲁⲩ
  choice: देखना
  rationale: सीधा और स्वाभाविक समतुल्य, जो कथन की समानांतर संरचना बनाए रखता है।
- source_word: ⲡⲉⲓⲱⲧ
  choice: पिता
  rationale: निश्चित पदवी के रूप में प्रयुक्त है; हिन्दी बाइबलीय शैली में ‘पिता’ उपयुक्त है।
theological_decisions:
- issue: ‘संसार का उपवास’ का आशय
  choice: असामान्य सकर्मक रूप को बनाए रखा गया
  alternative: ‘संसार से अलग रहना’ या ‘संसार की बातों से उपवास करना’
  rationale: स्रोत इस रूपक का आशय स्पष्ट नहीं करता; व्याख्यात्मक विस्तार किसी खास तपस्वी या धर्मवैज्ञानिक अर्थ को आरोपित कर देता।
- issue: ‘सब्त को सब्त बनाना’ का आशय
  choice: मूल की पुनरुक्त और संक्षिप्त अभिव्यक्ति रखी गई
  alternative: ‘सब्त का पालन करना’
  rationale: ‘पालन करना’ सम्भावित अर्थ है, पर मूल कथन सब्त को वास्तव में सब्त बनाने की अधिक गहन या रूपकात्मक संभावना भी खुली रखता है।
- issue: राज्य की पहचान
  choice: केवल ‘राज्य’
  alternative: ‘परमेश्वर का राज्य’
  rationale: नाग हम्मादी कॉप्टिक पाठ में संबंधवाचक ‘परमेश्वर का’ नहीं है; उसे यूनानी पाठांतर से मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथन। ‘सब्त’ पाठकों के लिए प्रचलित बाइबलीय शब्द के रूप में रखा गया है। मूल की दो जानबूझकर असामान्य अभिव्यक्तियाँ—‘संसार का उपवास’ और ‘सब्त को सब्त बनाना’—सरल व्याख्या से प्रतिस्थापित नहीं की गईं; उनकी सहायता के लिए टिप्पणियाँ दी गई हैं।
