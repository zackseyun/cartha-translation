base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/031.yaml
  text: Jesus said[1], "No prophet is acceptable in his village[3][2]; a physician does not heal those who know him."
translation:
  language: hi
  text: यीशु ने कहा, “कोई भविष्यद्वक्ता अपने गाँव में स्वीकार नहीं किया जाता[a][c]; कोई चिकित्सक उन लोगों को चंगा नहीं करता[b] जो उसे जानते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अंश पी.ऑक्सी. 1 में यहाँ ‘अपने गृहनगर/अपने देश में’ (πατρίδι) है, जबकि कॉप्टिक पाठ में ‘गाँव’ (ϯⲙⲉ) है। यूनानी अंश में आगे ‘चंगाइयाँ करता’ के समान अभिव्यक्ति भी मिलती है।
    reason: textual_variant
  - marker: b
    text: पांडुलिपि का ⲙⲁⲣⲉ- यहाँ सामान्य सत्य बताने वाला नकारात्मक रूप (‘नहीं करता’) है। यह मानक साहिदिक ⲙⲉⲣⲉ- की क्षेत्रीय वर्तनी है; इसे उसी रूप जैसे दिखने वाले ‘करने दो’ अर्थक रूप से अलग समझना चाहिए।
    reason: dialect_note
  - marker: c
    text: 'तुलना करें लूका 4:24: ‘कोई भविष्यद्वक्ता अपने देश में स्वीकार नहीं किया जाता।’ थोमा इस कथन को चिकित्सक वाली सूक्ति के साथ जोड़ता है; लूका 4:23 में इससे ठीक पहले ‘हे वैद्य, अपने आप को चंगा कर’ कहावत आती है।'
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲛ̄ⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: कोई भविष्यद्वक्ता … नहीं
  rationale: नकारात्मक अस्तित्वसूचक रचना सार्वभौमिक निषेध व्यक्त करती है। यह हिंदी में स्वाभाविक रूप से ‘कोई … नहीं’ से व्यक्त होती है।
- source_word: ϣⲏⲡ
  choice: स्वीकार नहीं किया जाता
  rationale: यह ϣⲱⲡ (‘ग्रहण करना, स्वीकार करना’) का गुणात्मक रूप है। संदर्भ में निष्क्रिय अर्थ ‘स्वीकार किया जाता’ हिंदी में स्रोत के आशय को स्पष्ट रखता है।
- source_word: ϯⲙⲉ
  choice: गाँव
  rationale: कॉप्टिक शब्द का सामान्य अर्थ ‘गाँव’ या छोटा नगर है। उपलब्ध यूनानी साक्षी के ‘गृहनगर/अपना देश’ से सामंजस्य बैठाने के बजाय कॉप्टिक पाठ का विशिष्ट शब्द सुरक्षित रखा गया है।
- source_word: ⲥⲟⲉⲓⲛ
  choice: चिकित्सक
  rationale: यह ⲥⲁⲉⲓⲛ का क्षेत्रीय वर्तनी-रूप है और संज्ञा के रूप में ‘चिकित्सक’ का अर्थ देता है; इसे क्रियात्मक सहायक नहीं समझा गया है।
- source_word: ⲣ̄ⲑⲉⲣⲁⲡⲉⲩⲉ
  choice: चंगा करता
  rationale: यूनानी मूल के इस ऋणशब्द का अर्थ ‘चिकित्सा करना/चंगा करना’ है। ‘चंगा करना’ परिणामसूचक अर्थ और सूक्ति की संक्षिप्तता बनाए रखता है।
- source_word: ⲛ̄ⲛⲉⲧ⳿ⲥⲟⲟⲩⲛ ⲙ̄ⲙⲟϥ
  choice: जो उसे जानते हैं
  rationale: सापेक्ष बहुवचन रचना और प्रत्यक्ष कर्म-सर्वनाम का सरल तथा निकट अनुवाद। ‘जानते हैं’ में निहित संबंध की अस्पष्टता को नहीं खोला गया है।
theological_decisions:
- issue: कैनोनिकल समानांतरों के साथ सामंजस्य
  choice: अपने गाँव में
  alternative: अपने गृहनगर में / अपने देश में
  rationale: लूका 4:24 और उपलब्ध यूनानी अंश में समानांतर अभिव्यक्ति होने पर भी कॉप्टिक पाठ स्पष्टतः ϯⲙⲉ (‘गाँव’) कहता है; इसलिए किसी कैनोनिकल रूप को इसमें आरोपित नहीं किया गया।
- issue: ‘जो उसे जानते हैं’ का आशय
  choice: वाक्य को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: उसके परिचित लोग / जो उसकी असलियत जानते हैं
  rationale: स्रोत केवल ‘उसे जानते हैं’ कहता है। यह परिचय, पहचान या निकटता में से किस पर बल देता है, इसे पाठ स्वयं स्पष्ट नहीं करता; इसलिए अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली अपनाई गई है। ‘भविष्यद्वक्ता’, ‘स्वीकार’ और ‘चंगा करना’ सामान्य हिंदी बाइबलीय शब्दावली से परिचित हैं, जबकि ‘चिकित्सक’ आधुनिक पाठक के लिए स्पष्ट और संप्रदाय-निरपेक्ष है। अर्धविराम दोनों समानांतर सूक्तियों का घनिष्ठ संबंध दिखाता है।
