base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
translation:
  language: hi
  text: उनके शिष्यों ने कहा, “किस दिन[a] आप हमारे सामने प्रकट होंगे,[f] और किस दिन हम आपको देखेंगे?” यीशु ने कहा, “जब तुम लज्जित हुए बिना अपने कपड़े उतार दोगे,[b] और अपने वस्त्र लेकर उन्हें छोटे बच्चों[c] की तरह[e] अपने पैरों तले रखोगे और उन्हें रौंदोगे, तब[d] तुम जीवित जन का पुत्र[g] देखोगे, और नहीं डरोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “किस दिन”; भावार्थ “कब” भी हो सकता है।'
    reason: मूल की दिन-संबंधी अभिव्यक्ति और उसके स्वाभाविक कालवाचक अर्थ दोनों बताने के लिए।
  - marker: b
    text: यहाँ निर्वस्त्र होने का दृश्य प्रतीकात्मक हो सकता है, पर कथन स्वयं उसका आशय स्पष्ट नहीं करता।
    reason: अर्थ को किसी एक धार्मिक व्याख्या तक सीमित किए बिना वास्तविक अस्पष्टता सुरक्षित रखने के लिए।
  - marker: c
    text: मूल में निश्चित रूप से “उन छोटे बच्चों” भी समझा जा सकता है।
    reason: कॉप्टिक निश्चित उपपद की उपस्थिति दर्ज करने के लिए, जो हिन्दी में संदर्भ के बिना कठोर लग सकता है।
  - marker: d
    text: पांडुलिपि में “तब” का कुछ भाग पुनर्स्थापित किया गया है।
    reason: पाठ-साक्ष्य में भौतिक क्षति और संपादकीय पुनर्निर्माण बताने के लिए।
  - marker: e
    text: “छोटे बच्चों की तरह” निकटतम रूप से वस्त्रों को पैरों तले रखने और रौंदने से जुड़ता है; पूरे दृश्य पर लागू होना भी सम्भव है।
    reason: उपमा के व्याकरणिक विस्तार की अस्पष्टता दर्शाने के लिए।
  - marker: f
    text: या, “अपने आपको हम पर प्रकट करेंगे।”
    reason: प्रकाशन की क्रिया के आत्मवाचक/प्रकटीकरणात्मक भाव को वैकल्पिक रूप से दिखाने के लिए।
  - marker: g
    text: शाब्दिक रूप से “जीवित का पुत्र” या “जीवित जन का पुत्र”; इसे “जीवते परमेश्वर का पुत्र” समझा जा सकता है, पर “परमेश्वर” मूल में स्पष्ट नहीं है।
    reason: महत्त्वपूर्ण धार्मिक उपाधि की भाषिक अस्पष्टता बनाए रखने के लिए।
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: किस दिन
  rationale: कॉप्टिक अभिव्यक्ति का औपचारिक अर्थ ‘किस दिन’ है; यह केवल सामान्य ‘कब’ की अपेक्षा मूल की समय-संबंधी छवि को सुरक्षित रखता है।
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: सामने प्रकट होंगे
  rationale: क्रिया का अर्थ स्वयं को प्रकट या जाहिर करना है; ‘हमारे सामने’ हिन्दी में प्राप्तकर्ता ⲛⲁⲛ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ϣⲁⲕⲉⲕⲧⲏⲩⲧⲛ ⲉϩⲏⲩ
  choice: अपने कपड़े उतार दोगे
  rationale: मुहावरे का आशय स्वयं को निर्वस्त्र करना है; हिन्दी में ‘कपड़े उतारना’ स्पष्ट और स्वाभाविक है।
- source_word: ⲛⲉⲧⲛϣⲧⲏⲛ
  choice: अपने वस्त्र
  rationale: शाब्दिक अर्थ ‘तुम्हारे वस्त्र’ है; निकटवर्ती ‘कपड़े’ से अनावश्यक पुनरुक्ति घटाने और गरिमापूर्ण शैली बनाए रखने हेतु ‘वस्त्र’ चुना गया।
- source_word: ⲛⲓⲕⲟⲩⲉⲓ ⲛϣⲏⲣⲉ ϣⲏⲙ
  choice: छोटे बच्चों
  rationale: पदबंध छोटे बालकों/बच्चों को सूचित करता है; लिंग-विशिष्ट अर्थ आरोपित न करने के लिए सामान्य बहुवचन रखा गया।
- source_word: ϫⲟⲡϫⲡ
  choice: रौंदोगे
  rationale: क्रिया पैरों से कुचलने या रौंदने का बोध देती है; संदर्भ में ‘रौंदना’ सबसे सीधा है।
- source_word: ⲡϣⲏⲣⲉ ⲙⲡⲉⲧⲟⲛϩ
  choice: जीवित जन का पुत्र
  rationale: मूल में ‘जीवित [व्यक्ति/सत्ता] का पुत्र’ है। ‘जीवते परमेश्वर का पुत्र’ कहना सम्भव धार्मिक पहचान को स्पष्ट कर देता, पर कॉप्टिक की अस्पष्टता मिटा देता।
theological_decisions:
- issue: निर्वस्त्रता और वस्त्रों को रौंदने की प्रतीकात्मक व्याख्या
  choice: दृश्य को बिना व्याख्यात्मक विस्तार के प्रत्यक्ष रूप में अनूदित किया गया
  alternative: इसे देह-त्याग, निष्कपटता, बपतिस्मा या आदिम निर्दोषता के रूप में स्पष्ट करना
  rationale: मूल कथन प्रतीक का अर्थ स्वयं नहीं खोलता; किसी एक धार्मिक व्याख्या को पाठ में जोड़ना उचित नहीं।
- issue: ‘जीवित जन के पुत्र’ की पहचान
  choice: अस्पष्ट उपाधि को ‘जीवित जन का पुत्र’ रखा गया
  alternative: ‘जीवते परमेश्वर का पुत्र’
  rationale: ⲡⲉⲧⲟⲛϩ में ‘परमेश्वर’ स्पष्ट रूप से नहीं लिखा है। सम्भावित धार्मिक संकेत को सुरक्षित रखते हुए उसे निश्चित नहीं किया गया।
- issue: ‘छोटे बच्चों की तरह’ का व्याकरणिक संबंध
  choice: इसे वस्त्र पैरों तले रखने और रौंदने की क्रिया से जोड़ा गया
  alternative: इसे केवल निर्वस्त्र और निर्लज्ज होने से जोड़ना
