base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
translation:
  language: hi
  text: यीशु ने कहा, “राज्य उस मनुष्य के समान है जिसके खेत में एक खज़ाना छिपा हुआ था, पर वह उसके बारे में नहीं जानता था। उसके मरने के बाद वह खज़ाना अपने बेटे के लिए छोड़ गया। बेटा भी नहीं जानता था। उसने वह खेत ले लिया और बेच दिया। जिसने उसे खरीदा था, वह आया और हल चलाते समय उसे वह खज़ाना मिला। तब वह जिसे चाहता था, उसे ब्याज पर पैसा देने लगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कथन की कथा मत्ती 13:44 के समानांतर दृष्टांत से काफ़ी भिन्न है। यहाँ पहले खेत-मालिक को खज़ाने का पता नहीं है; बाद में खेत खरीदने वाला उसे पाता है और ब्याज पर पैसा देने लगता है। पांडुलिपि में इस कथन के कुछ शब्द क्षतिग्रस्त स्थानों पर संपादकों द्वारा पुनर्स्थापित किए गए हैं, पर बचे हुए अक्षरों और प्रसंग के आधार पर ये पुनर्स्थापन काफ़ी सुनिश्चित हैं।
    reason: समानांतर पाठ और पांडुलिपीय पुनर्स्थापन की सूचना
lexical_decisions:
- source_word: ⲁϩⲟ
  choice: खज़ाना
  rationale: शब्द का सामान्य अर्थ ‘खज़ाना’ या संचित धन है; आधुनिक हिन्दी में ‘खज़ाना’ स्वाभाविक और स्पष्ट है।
- source_word: ⲉϥϩⲏⲡ
  choice: छिपा हुआ था
  rationale: खज़ाने के छिपे होने की स्पष्ट विशेषता को बनाए रखता है।
- source_word: ⲁⲧⲥⲟⲟⲩⲛ ⲉⲣⲟϥ
  choice: उसके बारे में नहीं जानता था
  rationale: मूल की ‘उससे अनजान होना’ वाली परिस्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: ϥⲓ
  choice: ले लिया
  rationale: क्रिया का सीधा अर्थ ‘लेना/ग्रहण करना’ है; ‘विरासत में पाया’ संभव है, पर मूल उससे अधिक स्पष्ट नहीं है।
- source_word: ⲧⲟⲟⲩ
  choice: खरीदा
  rationale: यहाँ खेत के अगले स्वामी द्वारा उसे खरीदने का स्पष्ट अर्थ है।
- source_word: ⲉϥⲥⲕⲁⲉⲓ
  choice: हल चलाते समय
  rationale: परिस्थितिजन्य खंड को दर्शाता है और खोज के आकस्मिक होने को बनाए रखता है; क्रिया खोदने या हल चलाने दोनों का बोध दे सकती है, पर खेत के प्रसंग में ‘हल चलाना’ स्वाभाविक है।
- source_word: ϩⲉ ⲉ-
  choice: मिल गया
  rationale: ‘पा लेना/मिलना’ का अर्थ देता है और हिन्दी में आकस्मिक खोज को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ϯ ϩⲟⲙⲧ ⲉ ⲧⲙⲏⲥⲉ
  choice: ब्याज पर पैसा देने लगा
  rationale: शाब्दिक मुहावरा ‘ब्याज पर पैसा देना’ है; इसे ‘निवेश करना’ कहकर नैतिक या आर्थिक तनाव को नरम नहीं किया गया।
theological_decisions:
- issue: ब्याज पर धन देना
  choice: ब्याज पर पैसा देने लगा
  alternative: पैसा निवेश करने लगा
  rationale: कॉप्टिक पाठ स्पष्ट रूप से ब्याज पर धन देने की बात कहता है। आरंभिक मसीही संदर्भ में सूद संबंधी तनाव के बावजूद पाठ को नरम या व्याख्यायित नहीं किया गया।
- issue: ‘राज्य’ की पहचान
  choice: राज्य
  alternative: स्वर्ग का राज्य / परमेश्वर का राज्य
  rationale: मूल में केवल ‘राज्य’ है; किसी विशिष्ट विस्तारित पद को जोड़ना मूल की संक्षिप्तता और संभावित अस्पष्टता को मिटा देता।
- issue: खज़ाने का प्रतीकात्मक अर्थ
  choice: कोई प्रतीकात्मक व्याख्या मुख्य पाठ में नहीं जोड़ी
  alternative: खज़ाने को ज्ञान या बुद्धि कहना
  rationale: दृष्टांत स्वयं खज़ाने का अर्थ स्पष्ट नहीं करता; अनुवाद को किसी एक धर्मवैज्ञानिक व्याख्या पर स्थिर नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, dignified कथात्मक रूप रखा गया है। वाक्य छोटे और मौखिक दृष्टांत के अनुकूल हैं। ‘राज्य’ की मूल संक्षिप्तता, खज़ाने की अनभिज्ञता और ब्याज पर धन देने के असहज तत्व—तीनों को बिना सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
