base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
translation:
  language: hi
  text: यीशु ने कहा, “अपने भाई से अपने प्राण[a] के समान[e] प्रेम करो; उसकी रक्षा[b] अपनी आँख की पुतली[c][d] के समान करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राण’ के लिए मूल में यूनानी से लिया गया कॉप्टिक शब्द ⲯⲩⲭⲏ है; इसका अर्थ ‘आत्मा’, ‘जीवन’ या ‘स्वयं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: पांडुलिपि में ⲙ̄ⲙⲟϥ है, जो ‘उसे’ को सीधा कर्म बनाता है; सामान्यीकृत पाठ में ⲛⲛⲧⲟϥ (‘उसके लिए’) है। दोनों पाठ यहाँ उसकी रक्षा या सुरक्षा करने का भाव देते हैं।
    reason: textual_variant
  - marker: c
    text: ‘आँख की पुतली’ मूल शब्द ⲡⲉⲗⲟⲩ का सीधा अर्थ है।
    reason: lexical_alternative
  - marker: d
    text: इसी बिंब की तुलना व्यवस्थाविवरण 32:10; भजन 17:8; नीतिवचन 7:2 से करें।
    reason: cross_reference
  - marker: e
    text: तुलनासूचक रूप पांडुलिपि में ⲛ̄ⲑⲉ लिखा है, जबकि सामान्यीकृत पाठ में ⲛⲡϩⲉ है; साहिदिक और लाइकोपोलिटन प्रयोग में दोनों का अर्थ ‘के समान/जैसा’ है।
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: यह ⲡⲉϫⲉ के साथ व्यक्तिवाचक नाम वाली सामान्य कॉप्टिक कथन-भूमिका है; हिन्दी में इसका स्वाभाविक और संक्षिप्त रूप यही है।
- source_word: ⲙⲉ
  choice: प्रेम करो
  rationale: व्यक्ति को कर्म बनाकर प्रयुक्त यह क्रिया यहाँ ‘चाहना’ नहीं, नैतिक अर्थ में ‘प्रेम करना’ व्यक्त करती है।
- source_word: ⲥⲟⲛ
  choice: भाई
  rationale: मूल शब्द का सीधा अर्थ ‘भाई’ है; इसे ‘पड़ोसी’ या ‘साथी’ करने से मूल की भ्रातृ-संबंधी भाषा बदल जाएगी।
- source_word: ⲛ̄ⲑⲉ / ⲛⲡϩⲉ
  choice: के समान
  rationale: पांडुलिपि और सामान्यीकृत पाठ के दोनों रूप तुलना सूचित करते हैं; आधुनिक हिन्दी में ‘के समान’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ⲯⲩⲭⲏ
  choice: प्राण
  rationale: यूनानी मूल का यह कॉप्टिक शब्द ‘प्राण/जीवन’, ‘आत्मा’ या ‘स्वयं’ के अर्थ दे सकता है। ‘प्राण’ हिन्दी में जीवन की आत्मीयता और मूल्य को व्यक्त करता है, जबकि टिप्पणी अन्य अर्थों को खुला रखती है।
- source_word: ⲉⲓⲣⲉ ⲧⲏⲣⲉ(ⲓ)
  choice: रक्षा करो
  rationale: यह परिप्रयुक्त अभिव्यक्ति किसी को संभालकर रखने, पहरा देने या बचाने का अर्थ देती है; व्यक्ति के संदर्भ में ‘रक्षा करो’ सबसे स्वाभाविक है।
- source_word: ⲡⲉⲗⲟⲩ
  choice: पुतली
  rationale: शब्द आँख की पुतली को सीधे सूचित करता है; हिन्दी में ‘आँख की पुतली’ शारीरिक अर्थ और मूल्यवान वस्तु की परिचित छवि, दोनों को बनाए रखता है।
- source_word: ⲃⲁⲗ
  choice: आँख
  rationale: यह आँख के लिए सामान्य शारीरिक संज्ञा है।
theological_decisions:
- issue: ⲯⲩⲭⲏ का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘प्राण’, टिप्पणी में ‘आत्मा’, ‘जीवन’ और ‘स्वयं’
  alternative: केवल ‘आत्मा’
  rationale: मूल शब्द की अर्थगत व्यापकता को किसी एक दार्शनिक या सांप्रदायिक मानव-विज्ञान में सीमित नहीं किया गया।
- issue: ⲥⲟⲛ की संबंधपरक भाषा
  choice: भाई
  alternative: पड़ोसी या साथी
  rationale: मूल की स्पष्ट भ्रातृ-संबंधी भाषा सुरक्षित रखी गई है; उसके दायरे को अनुवाद में न तो संकुचित किया गया, न बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज कथन। ‘अपने भाई से … प्रेम करो’ और ‘उसकी रक्षा … करो’ सामान्य हिन्दी वाक्य-विन्यास रखते हैं। ‘आँख की पुतली’ मूल शारीरिक बिंब को अक्षुण्ण रखते हुए हिन्दी पाठक के लिए स्वाभाविक है।
