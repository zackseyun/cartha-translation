base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/082.yaml
  text: Jesus said[a], “The one who is near me is near the fire[c][b], and the one who is far from me is far from the kingdom.”
translation:
  language: hi
  text: यीशु ने कहा, “जो मेरे निकट है, वह आग के निकट है,[a] और जो मुझसे दूर है, वह राज्य[c] से दूर है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आग’ के इस बिंब की तुलना लूका 12:49 से की जा सकती है, यद्यपि वहाँ का कथन इससे अलग है।
    reason: cross_reference
  - marker: b
    text: पांडुलिपि में ‘मेरी ओर’ (ⲉⲣⲟⲓ) और ‘मुझसे’ (ⲙ̄ⲙⲟⲓ) रूप हैं; सामान्यीकृत पाठ इन्हें स्वतंत्र सर्वनामों वाली रचनाओं में प्रस्तुत करता है। ‘राज्य’ के साथ लगे निश्चित उपपद के रूप में भी पांडुलिपि और सामान्यीकृत पाठ में भिन्नता है।
    reason: textual_variant
  - marker: c
    text: कॉप्टिक ⲙⲛⲧⲣⲣⲟ का अर्थ ‘राज्य’ के साथ-साथ ‘राजत्व’ या ‘राजकीय शासन’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲏⲛ
  choice: निकट है
  rationale: यहाँ शब्द गति की नहीं, स्थिति के रूप में निकटता व्यक्त करता है। ‘निकट है’ संक्षिप्तता और दोनों खंडों की समानांतर रचना बनाए रखता है।
- source_word: ⲉⲣⲟⲓ / ⲙ̄ⲙⲟⲓ
  choice: मेरे निकट / मुझसे दूर
  rationale: हिन्दी में इन संबंधों को स्वाभाविक ढंग से व्यक्त करते हुए ‘मेरे निकट’ और ‘मुझसे दूर’ मूल के निकटता तथा दूरी के दिशात्मक भेद को सुरक्षित रखते हैं।
- source_word: ⲥⲁⲧⲉ
  choice: आग
  rationale: मूल शब्द का सामान्य अर्थ ‘आग’ है; ‘ज्वाला’ कहने से बिंब अनावश्यक रूप से अधिक विशिष्ट हो जाता।
- source_word: ⲟⲩⲏⲩ
  choice: दूर है
  rationale: यह ‘निकट है’ के साथ स्पष्ट, संक्षिप्त और स्वाभाविक विरोधी समानांतर बनाता है।
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: राज्य
  rationale: यह शब्द राज्य, राजत्व या राजकीय शासन का बोध करा सकता है। मुख्य पाठ में ‘राज्य’ सहज और पारंपरिक है, जबकि व्यापक अर्थ-क्षेत्र को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ⲡⲉⲧ-
  choice: जो
  rationale: यह एकवचन सामान्य संबंधवाचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और कथन की सूक्तिपरक शैली बनाए रखता है।
theological_decisions:
- issue: ‘आग’ के बिंब का आशय
  choice: आग
  alternative: दैवी आग / न्याय की आग / शुद्ध करने वाली आग
  rationale: मूल पाठ आग का आशय स्पष्ट नहीं करता। किसी विशेष धार्मिक व्याख्या को मुख्य पाठ में जोड़ने के बजाय उसकी वास्तविक अस्पष्टता बनाए रखी गई है।
- issue: ⲙⲛⲧⲣⲣⲟ का अर्थ
  choice: राज्य
  alternative: राजत्व / राजकीय शासन
  rationale: ‘राज्य’ सामान्य पाठक के लिए स्वाभाविक है, पर मूल शब्द केवल भौगोलिक क्षेत्र नहीं, राजा के शासन या राजत्व को भी सूचित कर सकता है; यह संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सूक्तिपरक रूप अपनाया गया है। ‘निकट’ और ‘दूर’ की पुनरावृत्ति मूल की समानांतर संरचना तथा तीखे विरोध को बनाए रखती है। ‘आग’ और ‘राज्य’ की व्याख्या मुख्य पाठ में नहीं खोली गई, ताकि मूल का धार्मिक तनाव और अर्थगत खुलापन सुरक्षित रहे।
