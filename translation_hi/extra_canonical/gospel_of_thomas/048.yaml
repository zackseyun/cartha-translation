base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/048.yaml
  text: Jesus said[a], "If two make peace with each other in this one house, they will say to the mountain[c][b], ‘Move away,’ and it will move."
translation:
  language: hi
  text: यीशु ने कहा, “यदि दो इस एक घर में[a] एक-दूसरे से[b] मेल कर लें, तो वे पहाड़ से कहेंगे, ‘दूर हट जा,’[c] और वह हट जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस एक घर” का अनुवाद “एक ही घर में” या “इसी घर में” भी हो सकता है; ⲟⲩⲱⲧ में “एक, अकेला/एक ही, वही” का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “एक-दूसरे से” का शाब्दिक रूप “अपने साथियों/मित्रों के साथ” है, पर यह पद यहाँ पारस्परिक अर्थ में प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: c
    text: “दूर हट जा” में ⲉⲃⲟⲗ का “बाहर, दूर” वाला भाव है; इसका अनुवाद “बाहर निकल जा” या केवल “हट जा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ
  choice: यदि
  rationale: यह भावी शर्त को सूचित करने वाला चिह्न है; इस नीतिपरक कथन में ‘यदि’ उसकी शर्तवाचक शक्ति को बनाए रखता है।
- source_word: ⲥⲛⲁⲩ
  choice: दो व्यक्ति
  rationale: मूल में केवल संख्या ‘दो’ है; हिन्दी में मानवीय कर्ता स्पष्ट और स्वाभाविक करने के लिए ‘व्यक्ति’ जोड़ा गया है।
- source_word: ⲣⲉⲓⲣⲏⲛⲏ
  choice: मेल कर लें
  rationale: यूनानी मूल के ‘शांति’ शब्द के साथ प्रयुक्त कॉप्टिक रचना पारस्परिक शांति या मेल स्थापित करने का भाव देती है; ‘मेल कर लें’ आधुनिक हिन्दी में इस पारस्परिक समाधान को सहजता से व्यक्त करता है।
- source_word: ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ
  choice: एक-दूसरे के साथ
  rationale: शाब्दिक अर्थ ‘अपने साथियों/मित्रों के साथ’ हो सकता है, पर यहाँ मुहावरेदार पारस्परिक अर्थ है; ‘एक-दूसरे के साथ’ अनावश्यक रूप से मित्रता नहीं मानता।
- source_word: ϩⲛ ⲡⲉⲓⲏⲓ ⲟⲩⲱⲧ
  choice: इस एक घर में
  rationale: प्रदर्शक ‘इस’ और पश्चस्थ ⲟⲩⲱⲧ के ‘एक/एकमात्र/उसी’ भाव को असामान्य किन्तु बोधगम्य रूप में सुरक्षित रखा गया है।
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁϫⲱ ⲛⲧⲟⲥ ⲛⲡⲧⲟⲟⲩ
  choice: वे पहाड़ से कहेंगे
  rationale: भविष्यकाल और कथन की क्रिया को सीधे रखा गया है; हिन्दी में ‘पहाड़ से कहना’ स्वाभाविक है और कॉप्टिक सर्वनाम की पुनरुक्ति अलग से व्यक्त करना आवश्यक नहीं।
- source_word: ϫⲉ ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: यहाँ से हट जा
  rationale: ⲉⲃⲟⲗ बाहर या दूर जाने की दिशा देता है; ‘यहाँ से हट जा’ हिन्दी में आज्ञा और दूर हटने, दोनों को स्पष्ट करता है।
- source_word: ⲛⲧⲟϥ ⲛⲁⲡⲱⲱⲛⲉ
  choice: और वह हट जाएगा
  rationale: पुल्लिंग एकवचन कर्ता पहाड़ को संदर्भित करता है; भविष्यकाल और उसी गति-क्रिया की पुनरावृत्ति सुरक्षित है।
theological_decisions:
- issue: दो व्यक्तियों की एकता और पहाड़ हटने के बीच संबंध
  choice: कथन को बिना व्याख्यात्मक विस्तार के शर्त और परिणाम के रूप में रखा गया है।
  alternative: इसे प्रार्थना, विश्वास, कलीसियाई सहमति या आंतरिक आध्यात्मिक एकता के किसी विशेष सिद्धांत के रूप में स्पष्ट करना।
  rationale: मूल कथन स्वयं किसी विशिष्ट धार्मिक तंत्र या अनुप्रयोग को नहीं बताता; उसकी रूपकात्मक अथवा प्रत्यक्ष संभावनाओं को खुला रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘मेल कर लें’ ने कृत्रिम ‘शांति बनाएँ’ की अपेक्षा पारस्परिक मेल-मिलाप का भाव दिया है। मूल की चिह्नित अभिव्यक्ति ‘इस एक घर’ मुख्य पाठ में रखी गई है और उसकी वास्तविक अर्थ-सीमा पादटिप्पणी में दी गई है।
