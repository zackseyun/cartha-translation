base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/072.yaml
  text: A man said to him[a], "Tell my brothers, so that they may divide my father's property with me." He said to him, "Man, who has made me a divider?" He turned to his disciples and said to them, "I am not a divider, am I?"
translation:
  language: hi
  text: एक आदमी ने उनसे[a] कहा, “मेरे भाइयों[b] से कहिए कि वे मेरे साथ मेरे पिता की संपत्ति[c] बाँट लें।” उन्होंने उससे कहा, “मनुष्य, किसने मुझे बँटवारा करनेवाला ठहराया है?” फिर वे अपने शिष्यों की ओर मुड़े[d] और उनसे कहा, “मैं बँटवारा करनेवाला नहीं हूँ—हूँ क्या?”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में आरम्भिक शब्द ‘एक आदमी ने उनसे कहा’ का कुछ भाग क्षतिग्रस्त है और विद्वानों द्वारा पुनःस्थापित किया गया है।
    reason: lacuna_or_restoration
  - marker: b
    text: पांडुलिपि के मुद्रित पाठ में ‘मेरे भाइयों’ बहुवचन है; सामान्यीकृत पाठ में ‘मेरे भाई’ एकवचन मिलता है।
    reason: textual_variant
  - marker: c
    text: यह कॉप्टिक शब्द ‘संपत्ति’, ‘माल-मत्ता’ या प्रसंगानुसार ‘विरासत’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: मुद्रित और सामान्यीकृत पाठ में ‘मुड़ना’ क्रिया की वर्तनी अलग है; अर्थ में कोई महत्वपूर्ण अंतर नहीं है।
    reason: dialect_note
  - marker: e
    text: 'आरम्भिक कण ⲙⲏ ऐसे प्रश्न को चिह्नित करता है जिसमें नकारात्मक उत्तर अपेक्षित है। इसलिए अर्थ है: ‘मैं बँटवारा करनेवाला तो नहीं हूँ, है न?’'
    reason: grammatical_clarification
lexical_decisions:
- source_word: ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ ⲛⲁⲛⲧⲟϥ
  choice: एक आदमी ने उनसे कहा
  rationale: यह ‘एक आदमी ने उससे कहा’ का सीधा रूप है। यीशु के लिए आधुनिक हिन्दी का आदरसूचक बहुवचन स्वाभाविक और गरिमापूर्ण है।
- source_word: ϫⲱⲛⲧⲟⲥ
  choice: से कहिए
  rationale: आज्ञार्थक निवेदन का बल बनाए रखता है; ‘बताइए’ की अपेक्षा यहाँ संबोधित करके कहने का भाव अधिक उपयुक्त है।
- source_word: ⲛⲡⲁⲥⲟⲛ / ⲛ̄ⲛⲁⲥⲛⲏⲩ
  choice: मेरे भाइयों
  rationale: पांडुलिपि के मुद्रित पाठ में बहुवचन है, जबकि सामान्यीकृत पाठ में एकवचन मिलता है; मुख्य पाठ में मुद्रित बहुवचन लिया गया और भेद को टिप्पणी में रखा गया।
- source_word: ϩⲓⲛⲁ ⲉⲣⲉⲛⲧⲟⲟⲩⲛⲁⲡⲱϣⲉ
  choice: कि वे ... बाँट लें
  rationale: उद्देश्यसूचक ϩⲓⲛⲁ और विभाजन के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ⲛⲡϩⲛⲁⲁⲩ
  choice: संपत्ति
  rationale: शब्द वस्तुओं, माल-मत्ता या पैतृक संपदा का बोध करा सकता है। ‘संपत्ति’ तटस्थ है और अनावश्यक कानूनी विशिष्टता नहीं जोड़ता।
- source_word: ⲱ ⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: मनुष्य, किसने
  rationale: सम्बोधन की संक्षिप्त और कुछ तीखी ध्वनि सुरक्षित रखी गई; ‘भाई’ या ‘मित्र’ जैसा भाव स्रोत में नहीं जोड़ा गया।
- source_word: ⲉⲓⲣⲉ ... ⲛⲣⲉϥⲡⲱϣⲉ
  choice: बँटवारा करनेवाला नियुक्त किया
  rationale: ⲉⲓⲣⲉ यहाँ किसी को भूमिका में ठहराने या नियुक्त करने का अर्थ देता है; कर्तृवाचक ⲣⲉϥⲡⲱϣⲉ को वर्णनात्मक हिन्दी में रखा गया।
- source_word: ⲁϥⲕⲟⲧϥ / ⲕⲱⲧⲛⲧⲟϥ
  choice: अपने शिष्यों की ओर मुड़े
  rationale: प्रतिवर्ती ‘मुड़ने’ की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ⲙⲏ ⲉⲉⲓϣⲟⲟⲡ ⲛⲣⲉϥⲡⲱϣⲉ
  choice: मैं बँटवारा करनेवाला नहीं हूँ—हूँ क्या?
  rationale: ⲙⲏ को नकारात्मक उत्तर की अपेक्षा रखनेवाले प्रश्नसूचक कण के रूप में लिया गया है; कथन की अलंकारिक प्रश्नात्मकता सुरक्षित है।
theological_decisions:
- issue: यीशु की भूमिका और संपत्ति-विवाद
  choice: ‘बँटवारा करनेवाला’ को दोनों कथनों में समान रखा गया
  alternative: ‘न्यायाधीश’, ‘मध्यस्थ’ या ‘पंच’
  rationale: थॉमस के कॉप्टिक पाठ में केवल विभाजक/बँटवारा करनेवाले का पद है। लूका 12:13–14 के समानांतर से ‘न्यायाधीश’ आयात नहीं किया गया।
- issue: अंतिम वाक्य का स्वरूप
  choice: नकारात्मक उत्तर की अपेक्षा वाला अलंकारिक प्रश्न
  alternative: ‘देखो, मैं बँटवारा करनेवाला नहीं हूँ’ या निषेधात्मक कथन
  rationale: संदर्भ में ⲙⲏ प्रश्नसूचक है; इसे केवल घोषणात्मक या निषेधात्मक बनाना स्रोत की व्याकरणिक तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक कथन-शैली और सहज लेकिन गरिमापूर्ण शब्दावली अपनाई गई है। ‘बँटवारा करनेवाला’ कुछ असामान्य सुनाई देता है, पर स्रोत के बार-बार प्रयुक्त एक ही कर्तृवाचक पद को सुरक्षित रखता है और ‘न्यायाधीश’ जैसी समानांतर परंपरा से आई धारणा नहीं जोड़ता।
