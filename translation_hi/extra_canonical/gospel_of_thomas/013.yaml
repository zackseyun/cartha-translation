base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/013.yaml
  text: 'Jesus said to his disciples[a], "Compare me, and tell me whom I am like."

    Simon Peter said to him, "You are like a righteous angel."

    Matthew said to him, "You are like a human being—a philosopher, a man of understanding."

    Thomas said to him, "Teacher, my mouth will not be able at all to say whom you are like."

    Jesus said, "I am not your teacher, because you have drunk and you have become intoxicated from the bubbling spring that I myself have measured out."

    And he took him; he withdrew and spoke three sayings to him.

    When Thomas came to his companions, they asked him, "What did Jesus say to you?"

    Thomas said to them, "If I should tell you one of the sayings he spoke to me, you will pick up stones and throw them at me[j][i][h][g][f][e][d][c][b], and fire will come out of the stones and consume you."'
translation:
  language: hi
  text: 'यीशु ने अपने शिष्यों से कहा, “मेरी तुलना करो और मुझे बताओ कि मैं किसके समान हूँ।”


    शमौन पतरस ने उनसे कहा, “आप एक धर्मी स्वर्गदूत के समान हैं।”


    मत्ती ने उनसे कहा, “आप एक मनुष्य, एक दार्शनिक, एक समझदार व्यक्ति के समान हैं।”[a]


    थोमा ने उनसे कहा, “गुरु, मेरा मुँह बिल्कुल भी यह नहीं कह सकेगा कि आप किसके समान हैं।”[b]


    यीशु ने कहा, “मैं तुम्हारा गुरु नहीं हूँ, क्योंकि तुमने पिया है और उस बुदबुदाते सोते से मतवाले हो गए हो, जिसे मैंने स्वयं नापकर दिया है।”[c][d]


    फिर वह उसे अपने साथ ले गए, अलग हट गए और उससे तीन बातें कहीं।


    जब थोमा अपने साथियों के पास आया, तो उन्होंने उससे पूछा, “यीशु ने तुमसे क्या कहा?”


    थोमा ने उनसे कहा, “यदि मैं तुम्हें उन बातों में से एक भी बता दूँ जो उन्होंने मुझसे कही थीं, तो तुम पत्थर उठाकर मुझ पर फेंकोगे; और उन पत्थरों में से आग निकलेगी और तुम्हें भस्म कर देगी।”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल वाक्यांश का अधिक शाब्दिक रूप है: “एक मनुष्य, एक दार्शनिक, हृदय/मन वाला मनुष्य।” अंतिम पद का भाव “समझदार व्यक्ति” है; “एक बुद्धिमान दार्शनिक” सम्भव संक्षिप्त अनुवाद है।'
    reason: lexical_alternative
  - marker: b
    text: 'मूल में भविष्यकाल का भाव है: “मेरा मुँह बिल्कुल भी यह नहीं कह सकेगा”; इसे वर्तमानकाल “नहीं कह सकता” भी समझा गया है, पर यहाँ भविष्य का रूप सुरक्षित रखा गया है।'
    reason: grammar
  - marker: c
    text: “बुदबुदाता” ध्वनि-अनुकरणात्मक कॉप्टिक शब्द ⲃⲣⲃⲣ का अनुवाद है; “कलकल करता” या “उमड़ता” भी सम्भव हैं।
    reason: lexical_alternative
  - marker: d
    text: “नापकर दिया” का अनुवाद “बाँटकर दिया” या जल के सन्दर्भ में “निकालकर दिया” भी हो सकता है। मूल रूपक असामान्य है, इसलिए उसे सरल करके हटाया नहीं गया है।
    reason: lexical_alternative
  - marker: e
    text: 'मूल में दो क्रियाएँ स्पष्ट हैं: वे पत्थर उठाएँगे और उन्हें थोमा पर फेंकेंगे। इसके बाद पत्थरों में से निकलने वाली आग हमलावरों को ही भस्म कर देती है।'
    reason: translation_clarity
lexical_decisions:
- source_word: ϫⲉⲧⲟⲛⲧⲛⲁⲛⲟⲕ
  choice: मेरी तुलना करो
  rationale: आज्ञार्थक निर्माण और तुलना करने की क्रिया, दोनों को संक्षिप्त तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ⲁⲅⲅⲉⲗⲟⲥ ⲛⲇⲓⲕⲁⲓⲟⲥ
  choice: धर्मी स्वर्गदूत
  rationale: यहाँ यूनानी मूल का ⲁⲅⲅⲉⲗⲟⲥ एक स्वर्गीय प्राणी के अर्थ में है; ⲇⲓⲕⲁⲓⲟⲥ के नैतिक-धार्मिक भाव को ‘धर्मी’ व्यक्त करता है।
- source_word: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ
  choice: एक मनुष्य—एक दार्शनिक, एक समझदार व्यक्ति
  rationale: मूल की तीन पदों वाली समानाधिकरण संरचना तथा ‘मनुष्य’ पर दिए गए बल को बनाए रखा गया है; अंतिम पद का शाब्दिक भाव ‘हृदय/मन वाला मनुष्य’ है।
- source_word: ⲡⲥⲁϩ
  choice: गुरु
  rationale: सम्बोधन में यह आधुनिक हिन्दी का सहज और गरिमापूर्ण शब्द है; यह शिक्षक और स्वामी, दोनों से जुड़े मूल शब्द के व्यापक भाव को समेटता है।
- source_word: ⲧⲁⲧⲁⲡⲣⲟ ⲛⲁϣϣⲁⲡϥ ⲁⲛ
  choice: मेरा मुँह यह बिल्कुल नहीं कह सकेगा
  rationale: ‘मेरा मुँह’ की ठोस छवि और Future I रूप का भविष्यकालीन बल दोनों सुरक्षित हैं।
- source_word: ⲡⲡⲏⲅⲏ ⲉⲧⲃⲣⲃⲣⲉ
  choice: बुदबुदाता सोता
  rationale: ध्वन्यात्मक ⲃⲣⲃⲣ जल की ध्वनि और गति का संकेत देता है; ‘बुदबुदाता’ उस असामान्य, सजीव बिंब को बनाए रखता है।
- source_word: ⲁⲛⲟⲕ ⲛⲧⲁⲉⲓϣⲓⲧⲥ
  choice: जिसे मैंने स्वयं नापकर दिया है
  rationale: स्वतंत्र सर्वनाम ⲁⲛⲟⲕ का बल ‘स्वयं’ से व्यक्त किया गया है; ϣⲓ का मापने/मात्रा बाँटने का रूपक ‘नापकर दिया’ में सुरक्षित है।
- source_word: ⲧⲉⲧⲛⲁϥⲓⲱⲛⲉ ⲛⲧⲉⲧⲛⲛⲟⲩϫⲉ ⲉⲣⲟⲉⲓ
  choice: तुम पत्थर उठाकर मुझ पर फेंकोगे
  rationale: मूल में पत्थर उठाने और उन्हें फेंकने की दो स्पष्ट क्रियाएँ हैं; हिन्दी में दोनों को व्यक्त किया गया है।
theological_decisions:
- issue: “मैं तुम्हारा गुरु नहीं हूँ” का विरोधाभासी कथन
  choice: कथन को सीधे और बिना व्याख्यात्मक विस्तार के रखा गया है
  alternative: इसे ‘अब मैं तुम्हारा गुरु नहीं रहा’ अथवा किसी आध्यात्मिक पदोन्नति के स्पष्ट दावे के रूप में समझाना
  rationale: मूल कथन का कारण पीने और मतवाले होने के रूपक से जुड़ा है, पर वह सम्बन्ध जानबूझकर रहस्यमय है; अनुवाद किसी संप्रदायगत अर्थ को आरोपित नहीं करता।
- issue: पत्थरों से निकलने वाली आग
  choice: आग के कथन को वास्तविक कथन की तरह अक्षुण्ण रखा गया है
  alternative: इसे केवल रूपक, न्याय या प्रतिशोध के रूप में स्पष्ट करना
  rationale: पाठ स्वयं यह नहीं बताता कि आग शाब्दिक है या प्रतीकात्मक; उसकी धमकी और उलटाव दोनों को खुला रखा गया है।
- issue: यीशु द्वारा कही गई तीन गुप्त बातें
  choice: विषय-वस्तु को अनिर्दिष्ट रखा गया है
  alternative: तीन बातों की पहचान किसी ज्ञात सिद्धांत या सूत्र से करना
  rationale: कॉप्टिक पाठ केवल उनकी संख्या बताता है; उनकी विषय-वस्तु की पहचान करना स्रोत से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संवादात्मक पर गरिमापूर्ण रखी गई है। ‘आप’ से यीशु के प्रति सम्मान और ‘तुम’ से यीशु तथा शिष्यों के प्राचीन गुरु-शिष्य संवाद की निकटता व्यक्त की गई है। रहस्यमय बिंबों—मतवालापन, बुदबुदाता सोता, नापकर दिया गया जल और पत्थरों की आग—को सहज व्याख्या में विलीन नहीं किया गया।
