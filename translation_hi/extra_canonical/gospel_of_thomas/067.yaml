base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/067.yaml
  text: Jesus said[1], "The one who knows the All, yet lacks himself[a][x][t][3][2], is lacking in every respect."
translation:
  language: hi
  text: यीशु ने कहा, “जो ‘समस्त’[a] को जानता है, फिर भी स्वयं से वंचित है[b], वह हर तरह से वंचित है[c][d]।”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समस्त’ के लिए मूल शब्द ⲡⲧⲏⲣϥ है। इसका अनुवाद ‘पूरा’, ‘सब कुछ’ या ‘समग्रता’ भी हो सकता है; यहाँ इसका आशय व्यापक, संभवतः विश्वात्मक है।
    reason: lexical_alternative
  - marker: b
    text: ‘स्वयं से वंचित है’ का अनुवाद ‘अपने आप में कमी रखता है’ या संभवतः ‘अकेला अभावग्रस्त है’ भी किया जा सकता है। मूल अभिव्यक्ति आत्मवाचक अर्थ के साथ ‘अकेला’ की छाया भी रखती है।
    reason: lexical_alternative
  - marker: c
    text: ‘हर तरह से’ उस कॉप्टिक मुहावरे का सहज हिन्दी रूप है जिसका शाब्दिक रूप लगभग ‘उसके पूरे स्थान में’ है; आशय पूर्ण या सर्वांगीण अभाव है।
    reason: dialect_note
  - marker: d
    text: पांडुलिपि में इस अंतिम खंड का दूसरा कर्ता-सर्वनाम छूट गया जान पड़ता है; संपादक ने उसे पूरा किया है। इससे आशय नहीं बदलता।
    reason: lacuna_or_restoration
  - marker: e
    text: विषय की दृष्टि से मरकुस 8:36; मत्ती 16:26; लूका 9:25 से तुलना करें, जहाँ संसार पाने और अपने प्राण या स्वयं को खोने की बात है; पर यहाँ प्रयुक्त शब्द अलग हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (ⲡⲉⲧⲥⲟⲟⲩⲛ)
  choice: जानता है
  rationale: यह सापेक्ष वर्तमान रचना है, इसलिए वर्तमानकालीन, सूक्तिपरक अर्थ ‘जो जानता है’ उपयुक्त है; ‘जान चुका है’ अनावश्यक पूर्णताबोध जोड़ता।
- source_word: ⲡⲧⲏⲣϥ
  choice: ‘समस्त’
  rationale: यह ‘पूरा/सब कुछ’ को सूचित करता है और थोमा में संभवतः व्यापक, विश्वात्मक अर्थ रखता है। संज्ञा के रूप में ‘समस्त’ मूल की जानबूझकर असामान्य व्यापकता और अर्थगत खुलापन बचाता है।
- source_word: ⲣϭⲣⲱϩ
  choice: वंचित है
  rationale: क्रिया अभाव या कमी की दशा व्यक्त करती है। ‘वंचित है’ दोनों प्रयोगों में स्वाभाविक रहते हुए मूल की deficiency/lack संबंधी पुनरावृत्ति को बनाए रखता है।
- source_word: ⲟⲩⲁⲁ (with ⲛⲧⲟϥ)
  choice: स्वयं से
  rationale: ‘अकेला’ के साथ सर्वनाम यहाँ आत्मवाचक अर्थ दे सकता है। ‘स्वयं से वंचित’ कथन का विरोधाभासी प्रभाव बचाता है, जबकि ‘अपने आप में कमी रखता है’ वैकल्पिक समझ है।
- source_word: ⲛⲡⲙⲁ ⲧⲏⲣⲛⲧⲟϥ
  choice: हर तरह से
  rationale: यह समग्रता बताने वाला क्रियाविशेषणीय मुहावरा है; आधुनिक हिन्दी में ‘हर तरह से’ स्पष्ट और सहज है।
theological_decisions:
- issue: ‘समस्त’ का आशय
  choice: इसे संज्ञा की तरह ‘समस्त’ रखा गया और किसी निश्चित ब्रह्मांडीय तत्त्व के रूप में नहीं समझाया गया।
  alternative: ‘सब कुछ’, ‘संपूर्ण जगत’ या ‘सृष्टि की समग्रता’
  rationale: मूल व्यापक है और विश्वात्मक आशय संभव है, पर उसे स्पष्ट रूप से केवल भौतिक जगत या किसी विशिष्ट दार्शनिक सत्ता तक सीमित नहीं करता।
- issue: ‘स्वयं से वंचित’ का अर्थ
  choice: विरोधाभासी आत्मवाचक भाषा को सुरक्षित रखा गया।
  alternative: ‘अपने आप में कमी रखता है’, ‘अकेला अभावग्रस्त है’
  rationale: मूल व्याकरण आत्मवाचक और ‘अकेला/अपने आप’ दोनों छायाएँ दे सकता है; अनुवाद किसी संप्रदायगत आत्मज्ञान-सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण रखी गई है। ‘समस्त’ का संज्ञात्मक प्रयोग जानबूझकर थोड़ा असामान्य है, ताकि मूल की व्यापकता और रहस्यात्मक तनाव बने रहें। ‘वंचित’ की पुनरावृत्ति मूल में एक ही क्रिया की पुनरावृत्ति को दर्शाती है।
