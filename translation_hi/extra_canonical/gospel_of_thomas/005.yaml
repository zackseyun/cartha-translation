base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/005.yaml
  text: 'Jesus says: Know what is before your face[a], and what is hidden from you will be uncovered[c] to you. For there is nothing hidden that will not be made manifest[d].[b]'
translation:
  language: hi
  text: यीशु ने कहा, “जो तुम्हारे चेहरे के सामने है, उसे जानो[a], और जो तुमसे छिपा है, वह तुम्हारे लिए उजागर किया जाएगा[c]। क्योंकि ऐसा कुछ भी छिपा नहीं है जो प्रकट न होगा[d]।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे चेहरे के सामने” कॉप्टिक मुहावरे (ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ) का निकट अनुवाद है; इसका अर्थ है “ठीक तुम्हारे सामने।”
    reason: cultural_note
  - marker: b
    text: 'यूनानी साक्षी POxy 654 इसके बाद जोड़ता है: “और ऐसा कुछ भी गड़ा हुआ नहीं है जो उठाया न जाएगा।” नाग हम्मादी के कॉप्टिक पाठ में यह अतिरिक्त खंड नहीं है; यहाँ अनुवाद कॉप्टिक पाठ का अनुसरण करता है।'
    reason: textual_variant
  - marker: c
    text: कॉप्टिक ϭⲱⲗⲡ का शाब्दिक भाव “आवरण हटाना” है; अन्य संभव अनुवाद हैं “प्रकट करना” और “खोल देना।”
    reason: lexical_alternative
  - marker: d
    text: कॉप्टिक ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ का अर्थ इस प्रयोग में “प्रकट होना,” “दिखाई देना” या “सामने आना” है, “जीवित होना” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  choice: जानो
  rationale: आज्ञार्थक क्रिया की संक्षिप्त और सूक्तिपरक शक्ति बनाए रखता है; ‘पहचानो’ या ‘समझो’ की अपेक्षा मूल अर्थ को कम व्याख्यायित करता है।
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ ⲉⲃⲟⲗ
  choice: जो तुम्हारे चेहरे के सामने है
  rationale: स्थानसूचक अर्थ और ‘चेहरे’ की ठोस मूल छवि दोनों सुरक्षित रखता है, भले ही हिंदी में केवल ‘तुम्हारे सामने’ अधिक सामान्य होता।
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ ⲉⲛⲧⲟⲕ
  choice: जो तुमसे छिपा है
  rationale: छिपाने या ओझल होने के भाव को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: उजागर कर दिया जाएगा
  rationale: मूल क्रिया का शाब्दिक भाव ‘आवरण हटाना’ है; ‘उजागर करना’ उस रूपक को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: ⲛⲁⲛⲧⲟⲕ
  choice: तुम्हारे लिए
  rationale: एकवचन संबोधन के साथ लाभार्थी/प्राप्तकर्ता का भाव व्यक्त करता है।
- source_word: ⲙⲛⲗⲁⲁⲩ ⲅⲁⲣ
  choice: क्योंकि ऐसा कुछ भी नहीं है
  rationale: सार्वत्रिक निषेध को सहज हिंदी में व्यक्त करता है और कारणसूचक संबंध बनाए रखता है।
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: प्रकट होगा
  rationale: इस रचना में अर्थ ‘दिखाई देना/प्रकट होना’ है; इसे ‘जीवित होना’ नहीं समझा गया है।
theological_decisions:
- issue: छिपी वस्तु के प्रकट होने का कर्ता
  choice: निष्क्रिय वाक्य ‘उजागर कर दिया जाएगा’
  alternative: ‘तुम्हें उसका पता चल जाएगा’
  rationale: मूल पाठ कर्ता की पहचान नहीं करता; इसलिए ईश्वर, ज्ञान या आत्मबोध को स्पष्ट कर्ता बनाकर धर्मवैचारिक तनाव को नहीं सुलझाया गया।
- issue: ‘जानो’ का आशय
  choice: सामान्य ज्ञानसूचक आज्ञा
  alternative: ‘आध्यात्मिक रूप से पहचानो’ या ‘समझ लो’
  rationale: मूल कथन यह स्पष्ट नहीं करता कि अपेक्षित ज्ञान इंद्रियगत, बौद्धिक या आध्यात्मिक है; अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सुबोध और सूक्तिपरक रूप अपनाया गया है। मूल के एकवचन संबोधन के लिए ‘तुम’ रखा गया है। ‘चेहरे के सामने’ सामान्य हिंदी से कुछ अधिक शाब्दिक है, पर मूल की ठोस छवि सुरक्षित रखने के लिए इसे रखा गया और पादटिप्पणी में मुहावरे का अर्थ स्पष्ट किया गया है।
