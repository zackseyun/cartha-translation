base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/096.yaml
  text: Jesus said[a], "The Father's kingdom is like a woman. She took a little leaven, hid it in dough, and made it into big loaves. Whoever has ears[c][b], let him hear."
translation:
  language: hi
  text: यीशु ने कहा, “पिता का राज्य एक स्त्री के समान है। उसने थोड़ा-सा खमीर[a] लिया, उसे गुँधे हुए आटे में छिपा दिया और उससे बड़ी रोटियाँ[b] बनाईं।[c] जिसके कान हों, वह सुन ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “खमीर” (ⲥⲓⲣ) पारंपरिक खमीर या खमीर उठाने वाले आटे को दर्शाता है, आधुनिक व्यावसायिक यीस्ट को आवश्यक रूप से नहीं।
    reason: cultural_note
  - marker: b
    text: ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ का अर्थ “बड़ी रोटियाँ” के साथ-साथ “बहुत-सी रोटियाँ” या “बहुत अधिक रोटी” भी समझा जा सकता है। मुख्य पाठ आकार की ठोस छवि को बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: पांडुलिपि NHAM02.49 में यहाँ कुछ अक्षर क्षतिग्रस्त हैं या संपादकीय रूप से पूरे किए गए हैं, फिर भी “एक स्त्री … उसे गुँधे हुए आटे में छिपा दिया … बड़ी रोटियाँ बनाईं” वाला पाठ पर्याप्त रूप से सुनिश्चित है।
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: राज्य
  rationale: यह शब्द ‘राज्य’, ‘राजत्व’ या ‘राजकीय शासन’ का भाव दे सकता है। ‘राज्य’ हिन्दी में इस थोमाई अभिव्यक्ति का संक्षिप्त और स्थापित समतुल्य है तथा अर्थ को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: ⲡⲉⲓⲱⲧ
  choice: पिता
  rationale: स्रोत में परमेश्वर के लिए स्पष्ट रूप से ‘पिता’ पद प्रयुक्त है; अनुवाद उसी संबोधन को बनाए रखता है।
- source_word: ⲥϩⲓⲙⲉ
  choice: स्त्री
  rationale: मूल शब्द का सामान्य अर्थ ‘स्त्री’ है; प्रसंग उसे ‘पत्नी’ मानने की माँग नहीं करता।
- source_word: ⲕⲟⲩⲓ ⲛⲥⲓⲣ
  choice: थोड़ा-सा खमीर
  rationale: यहाँ मात्रा का बोध है। ‘थोड़ा-सा’ सहज हिन्दी है और थोड़ी मात्रा से बड़े परिणाम की छवि बनाए रखता है।
- source_word: ⲥⲓⲣ
  choice: खमीर
  rationale: यह पारंपरिक खमीरी उठावन को सूचित करता है, आधुनिक पैकेट वाले यीस्ट को आवश्यक रूप से नहीं। ‘खमीर’ सामान्य हिन्दी में प्राचीन रोटी बनाने के प्रसंग के अनुकूल है।
- source_word: ϩⲱⲡ
  choice: छिपा दिया
  rationale: क्रिया का मूल अर्थ ‘छिपाना’ है। इसे ‘मिला दिया’ नहीं किया गया, ताकि स्रोत की विशिष्ट और संभावित रूपकात्मक भाषा सुरक्षित रहे।
- source_word: ϣⲱⲧⲉ
  choice: गुँधा हुआ आटा
  rationale: रोटी बनाने के प्रसंग में शब्द तैयार आटे या dough की ओर संकेत करता है। ‘गुँधा हुआ आटा’ हिन्दी में इसे सूखे आटे से स्पष्टतः अलग करता है।
- source_word: ⲉⲓⲣⲉ … ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ
  choice: उससे बड़ी-बड़ी रोटियाँ बनाईं
  rationale: यह परिणामसूचक निर्माण को स्वाभाविक हिन्दी में व्यक्त करता है। ‘बड़ी-बड़ी’ आकार पर बल रखता है, जबकि पाठ में बहुत-सी रोटियों या बहुत अधिक रोटी की सम्भावना टिप्पणी में सुरक्षित है।
- source_word: ⲛⲟⲉⲓⲕ
  choice: रोटियाँ
  rationale: स्रोत का रूप बहुवचन है। भारतीय हिन्दी पाठक के लिए ‘रोटियाँ’ ठोस और सहज है, जबकि सामान्य ‘रोटी’ या ‘भोजन’ बहुवचन छवि को कम कर देता।
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  choice: जिसके कान हों, वह सुन ले
  rationale: यह स्रोत के परिचित श्रवण-सूत्र को संक्षिप्त, गरिमामय और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘पिता का राज्य’ का आशय
  choice: पिता का राज्य
  alternative: पिता का शासन / पिता का राजत्व
  rationale: स्रोत ‘राज्य’ और ‘राजकीय शासन’ दोनों की अर्थ-छाया रख सकता है। मुख्य पाठ में पारंपरिक और व्यापक ‘राज्य’ रखा गया है; किसी विशेष अंतकालीन, आंतरिक या संस्थागत व्याख्या को नहीं जोड़ा गया।
- issue: खमीर की प्रतीकात्मक भूमिका
  choice: रूपक की व्याख्या किए बिना ‘खमीर’
  alternative: भलाई, बुराई या छिपी आध्यात्मिक शक्ति के रूप में स्पष्ट करना
  rationale: कथन स्वयं खमीर के प्रतीक का नैतिक मूल्य स्पष्ट नहीं करता। इसलिए अनुवाद उसकी धर्मवैचारिक अस्पष्टता और तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, मौखिक कथन के अनुकूल और गरिमामय। ‘गुँधा हुआ आटा’ सांस्कृतिक स्पष्टता देता है; ‘बड़ी-बड़ी रोटियाँ’ सामान्य पाठक के लिए दृश्यात्मक है। श्रवण-सूत्र में पुल्लिंग-विशिष्ट सर्वनाम से बचते हुए ‘जिसके … वह’ का सर्वसमावेशी और स्वाभाविक रूप रखा गया है।
