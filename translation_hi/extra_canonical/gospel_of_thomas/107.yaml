base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/107.yaml
  text: Jesus said[a], The kingship is like a shepherd who had a hundred sheep. One of them—the great one—went astray. He left the ninety‑nine and searched for the one until he found it. After he had toiled, he said to the sheep[i][h][g][f][e][d][c][b], I love you more than the ninety‑nine.
translation:
  language: hi
  text: यीशु ने कहा, “राज-सत्ता[a] एक चरवाहे के समान है, जिसके पास सौ भेड़ें थीं। उनमें से एक—वह बड़ी वाली[b]—भटक गई। उसने निन्यानवे को छोड़ दिया और उस एक को तब तक खोजता रहा, जब तक उसने उसे पा नहीं लिया। परिश्रम करने के बाद उसने उस भेड़[c] से कहा, ‘मैं उन निन्यानवे से अधिक तुमसे प्रेम करता हूँ।’[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक शब्द ⲡⲙⲛⲧⲣⲣⲟ का अर्थ राजा का शासन या प्रभुत्व है। इसका अनुवाद प्रायः “राज्य” भी किया जाता है, पर वह स्थान या भूभाग का आभास दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में शाब्दिक रूप से “वह बड़ी/महान वाली” है; भेड़ के संदर्भ में इसका अर्थ “बड़ी” या संभवतः “सबसे बड़ी” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: पांडुलिपि में “भेड़” शब्द का एक अक्षर लिपिकीय सुधार के रूप में पुनःस्थापित किया गया है।
    reason: lacuna_or_restoration
  - marker: d
    text: यहाँ की कॉप्टिक क्रिया का अर्थ “प्रेम करना” या “अधिक चाहना/पसंद करना” हो सकता है; इसलिए “मैं तुम्हें उन निन्यानवे से अधिक पसंद करता हूँ” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: राज-सत्ता
  rationale: यह mnt- से बना भाववाचक शब्द है और किसी भूभाग की अपेक्षा राजा के शासन या प्रभुत्व को दर्शाता है। ‘राज-सत्ता’ आधुनिक हिन्दी में इस अमूर्त अर्थ को अपेक्षाकृत स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ
  choice: एक चरवाहा
  rationale: यह पदबंध ‘चरवाही करने वाला मनुष्य’ अर्थात ‘चरवाहा’ है; स्वामित्व अगले पदबंध ⲟⲩⲛⲧⲁϥ द्वारा व्यक्त होता है।
- source_word: ⲡⲛⲟϭ
  choice: वह बड़ी वाली
  rationale: विशेषण का अर्थ ‘बड़ा/महान’ है। भेड़ के संदर्भ में ‘बड़ी वाली’ सहज है और ‘सबसे बड़ी’ जैसा स्पष्ट अतिशयोक्तिपरक अर्थ नहीं जोड़ता।
- source_word: ⲥⲱⲣⲙ
  choice: भटक गई
  rationale: क्रिया भटकने या मार्ग से चूक जाने को व्यक्त करती है; पशुपालन के प्रसंग में ‘भटक गई’ स्वाभाविक है।
- source_word: ⲕⲱ
  choice: छोड़ दिया
  rationale: मूल क्रिया का तटस्थ अर्थ ‘छोड़ना’ है; ‘त्याग दिया’ अनावश्यक रूप से कठोर होता।
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ
  choice: खोजता रहा
  rationale: यह रचना किसी को ढूँढ़ने या खोजने का अर्थ देती है; ‘रहा’ खोज की निरंतरता को सहज हिन्दी में प्रकट करता है।
- source_word: ϩⲓⲥⲉ
  choice: परिश्रम करने के बाद
  rationale: शब्द श्रम, कठिन प्रयास या थकावट का बोध करा सकता है। यह अनुवाद कथन से पहले किए गए प्रयास को बनाए रखता है।
- source_word: ⲟⲩⲟϣⲕ
  choice: प्रेम करता हूँ
  rationale: क्रिया ‘प्रेम करना’ और ‘अधिक चाहना/पसंद करना’ दोनों अर्थ दे सकती है। मुख्य पाठ में ‘प्रेम’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ को स्थानवाचक ‘राज्य’ या भाववाचक शासन के रूप में व्यक्त करना
  choice: राज-सत्ता
  alternative: राज्य; राजकीय शासन
  rationale: कॉप्टिक शब्द भाववाचक है। ‘राज-सत्ता’ शासन और प्रभुत्व का तनाव बचाता है, पर किसी विशिष्ट धार्मिक व्यवस्था या भूभाग का अर्थ आरोपित नहीं करता।
- issue: खोई हुई बड़ी भेड़ के प्रति चरवाहे के अंतिम कथन का अर्थ
  choice: मैं उन निन्यानवे से अधिक तुमसे प्रेम करता हूँ
  alternative: मैं उन निन्यानवे की अपेक्षा तुम्हें अधिक चाहता/पसंद करता हूँ
  rationale: स्रोत में प्रेम और वरीयता दोनों संभव हैं। मुख्य पाठ भावनात्मक अर्थ रखता है, जबकि पादटिप्पणी वरीयता की वास्तविक संभावना सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक दृष्टांत के अनुरूप रखी गई है। ‘राज-सत्ता’ सामान्य ‘राज्य’ से कुछ कम प्रचलित है, इसलिए उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है। चरवाहे और भेड़ के लिए सामान्य आधुनिक शब्दावली अपनाई गई है; वाक्य-संरचना स्रोत की क्रमिक कथात्मक गति बनाए रखती है।
