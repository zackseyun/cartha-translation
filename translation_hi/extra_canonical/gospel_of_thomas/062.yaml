base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
translation:
  language: hi
  text: यीशु ने कहा, “मैं अपने रहस्य उन्हीं को बताता हूँ जो मेरे रहस्यों के योग्य हैं।[a] तुम्हारा दाहिना हाथ जो करने वाला है, तुम्हारे बाएँ हाथ को यह न जानने दो कि दाहिना हाथ क्या कर रहा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि यहाँ क्षतिग्रस्त है। “जो … योग्य हैं” और दूसरे “मेरे” के लिए कॉप्टिक शब्दों के कुछ अंश विद्वानों द्वारा प्रसंग के आधार पर पुनर्स्थापित किए गए हैं।
    reason: textual_variant
  - marker: b
    text: मत्ती 6:3 में दाहिने और बाएँ हाथ की ऐसी ही उक्ति दान देने के संदर्भ में आती है; थॉमस के इस कथन में दान का उल्लेख नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲩⲥⲧⲏⲣⲓⲟⲛ
  choice: रहस्य
  rationale: यह यूनानी मूल का क़िब्ती शब्द है। स्वत्ववाचक बहुवचन सूचक के कारण दोनों स्थानों पर बहुवचन ‘रहस्य’ लिया गया है।
- source_word: ⲙⲡϣⲁ
  choice: योग्य हैं
  rationale: यह ‘योग्य होना’ या ‘पात्र होना’ व्यक्त करता है; सरल और स्रोत-समीप हिन्दी के लिए ‘योग्य’ चुना गया है।
- source_word: ⲟⲩⲛⲁⲙ
  choice: दाहिना हाथ
  rationale: संदर्भ में यह ‘दाहिना/दाहिना हाथ’ है, न कि ‘सामर्थ्य’। हिन्दी मुहावरे में अंग का नाम स्पष्ट किया गया है।
- source_word: ϩⲃⲟⲩⲣ
  choice: बायाँ हाथ
  rationale: स्रोत में ‘बायाँ/बायाँ हाथ’ का सामान्य शब्द है; दाहिने हाथ के समानांतर अंग स्पष्ट किया गया है।
- source_word: ⲉⲓⲣⲉ ⲟⲩ
  choice: क्या कर रहा है
  rationale: अंतिम ⲟⲩ प्रश्नवाचक ‘क्या’ है; इसलिए इसे केवल ‘कि वह ऐसा कर रहा है’ नहीं बनाया गया।
theological_decisions:
- issue: दाहिने और बाएँ हाथ की उक्ति का संदर्भ
  choice: इसे रहस्यों के कथन के तुरंत बाद स्वतंत्र निर्देश के रूप में रखा गया है।
  alternative: मत्ती 6:3 के आधार पर इसे दान देने के विषय में स्पष्ट करना।
  rationale: थॉमस के उपलब्ध पाठ में दान का उल्लेख नहीं है। अनुवाद उस प्रामाणिक समानांतर का प्रसंग इसमें आरोपित नहीं करता और दोनों वाक्यों के संबंध को खुला रखता है।
- issue: ‘रहस्यों’ की प्रकृति
  choice: स्रोत का सामान्य शब्द ‘रहस्य’ बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘गुप्त आध्यात्मिक शिक्षाएँ’ जैसे अधिक व्याख्यात्मक पद।
  rationale: स्रोत यह निश्चित नहीं करता कि इन रहस्यों का स्वरूप क्या है; अतः उसकी धार्मिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘उन्हीं को’ पात्र व्यक्तियों की सीमा को स्वाभाविक हिन्दी में व्यक्त करता है। पहले वाक्य में वर्तमानकाल और दूसरे में भविष्याभिमुख ‘करने वाला है’ रखा गया है। अप्रासंगिक क़िब्ती वर्तनी/उपभाषा संबंधी टिप्पणियाँ प्रकाशन-पाठ में नहीं जोड़ी गईं।
