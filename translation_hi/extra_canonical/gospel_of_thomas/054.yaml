base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/054.yaml
  text: Jesus said[a], “Blessed are the poor[f][e][d][c][b], for yours is the kingdom of the heavens.”
translation:
  language: hi
  text: यीशु ने कहा, “धन्य हैं गरीब[a], क्योंकि स्वर्गों का राज्य तुम्हारा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कॉप्टिक में ‘गरीब व्यक्ति’ व्याकरणतः एकवचन है, पर यहाँ वह सामान्य और सामूहिक अर्थ में है। पाठ ‘मन के दीन’ या ‘आत्मा में गरीब’ नहीं कहता। तुलना करें: लूका 6:20; मत्ती 5:3।'
    reason: व्याकरणिक स्पष्टीकरण और समानांतर कथनों से भेद
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: यह कथन आरम्भ करने वाले कॉप्टिक पद का स्वाभाविक और सीधा हिन्दी रूप है; उसके बाद के ϫⲉ को उद्धरण-चिह्नों से व्यक्त किया गया है।
- source_word: ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य हैं
  rationale: यह आशीर्वचन की मूल्यांकनात्मक शैली को बनाए रखता है और आधुनिक हिन्दी में परिचित तथा गरिमापूर्ण है।
- source_word: ⲡϩⲏⲕⲉ
  choice: गरीब
  rationale: कॉप्टिक में यह व्याकरणतः एकवचन है, पर सामान्य वर्ग का बोध कराता है; हिन्दी का ‘गरीब’ बहुवचन क्रिया ‘हैं’ के साथ सामूहिक अर्थ स्वाभाविक रूप से देता है।
- source_word: ϫⲉ
  choice: क्योंकि
  rationale: दूसरा ϫⲉ आशीर्वचन का कारण प्रस्तुत करता है; ‘क्योंकि’ उसके स्पष्ट कारणवाचक बल को व्यक्त करता है।
- source_word: ⲧⲱⲧⲛ
  choice: तुम्हारा
  rationale: यह द्वितीय पुरुष बहुवचन का रूप है। हिन्दी में ‘तुम्हारा’ ‘राज्य’ से लिंग-वचन सामंजस्य रखते हुए पूरे सम्बोधित समूह का अधिकार बताता है।
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: राज्य
  rationale: शब्द राजत्व, शासन या राज्य का बोध करा सकता है; थॉमस में प्रवेश करने, पाने या उपस्थित वास्तविकता के अर्थ में ‘राज्य’ सबसे स्वाभाविक है, जबकि ‘राजत्व’ वैकल्पिक अर्थ है।
- source_word: ⲛⲡⲡⲉ
  choice: स्वर्गों का
  rationale: स्रोत में ‘स्वर्ग’ स्पष्टतः बहुवचन है; ‘स्वर्गों का’ इस रूप को सुरक्षित रखता है और इसे चुपचाप एकवचन नहीं बनाता।
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ को स्थान/क्षेत्र या सार्वभौम शासन के रूप में व्यक्त करना
  choice: राज्य
  alternative: राजत्व / शासन
  rationale: मूल शब्द दोनों अर्थ-छायाएँ रख सकता है। थॉमस के व्यापक प्रयोग में यह ऐसी वास्तविकता भी है जिसमें प्रवेश किया या जिसे पाया जा सकता है, इसलिए मुख्य पाठ में ‘राज्य’ रखा गया है; इससे शासन की अर्थ-छाया पूर्णतः नकारी नहीं जाती।
- issue: गरीबी को भौतिक या आत्मिक अर्थ देना
  choice: केवल ‘गरीब’, बिना किसी विशेषक के
  alternative: मन के दीन / आत्मा में गरीब
  rationale: इस कथन में गरीबी के साथ ‘आत्मिक’ जैसा कोई विशेषक नहीं है। अनुवाद स्रोत की खुली अभिव्यक्ति को बनाए रखता है और मत्ती 5:3 की शब्दावली इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आशीर्वचन-शैली अपनाई गई है। ‘धन्य’ पारंपरिक होते हुए भी सामान्य धार्मिक हिन्दी में सुबोध है। स्रोत के बहुवचन को बचाने के लिए ‘स्वर्गों’ रखा गया है; ‘आकाशों’ यहाँ अनावश्यक रूप से भौतिक अर्थ दे सकता था।
