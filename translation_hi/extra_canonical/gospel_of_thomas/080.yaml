base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/080.yaml
  text: Jesus said[a], “Whoever has come to know the world has found the body; and whoever has found the body[e][d][c][b], the world is not worthy of him.”
translation:
  language: hi
  text: यीशु ने कहा, “जिसने संसार को जान लिया है, उसने देह[a] को पा लिया है; और जिसने देह को पा लिया है[b], संसार उसके योग्य नहीं है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲡⲥⲱⲙⲁ का सामान्य अर्थ ‘देह’ या ‘शरीर’ है; प्रसंगानुसार यह मृत देह भी सूचित कर सकता है। यहाँ ‘देह’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘पाना’ वाली कॉप्टिक क्रिया ϩⲉ के बाद यहाँ ⲉ आया है। यह नाग हम्मादी कॉप्टिक की बोलीगत या वर्तनीगत विशेषता है और क्रिया का मूल अर्थ नहीं बदलती।
    reason: dialect_note
  - marker: c
    text: कथन 56 में इससे मिलता-जुलता वचन है, पर वहाँ ‘लाश’ के लिए अलग कॉप्टिक शब्द ⲡⲧⲱⲙⲁ प्रयुक्त हुआ है। दोनों रूपों को एक जैसा नहीं किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: यह थोमा में कथन आरम्भ करने वाला प्रचलित सूत्र है; हिन्दी में पूर्ण भूतकाल स्वाभाविक रूप से उद्धरण का परिचय देता है।
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲥⲟⲟⲩⲛ
  choice: जिसने … जान लिया है
  rationale: सम्बन्धवाचक पूर्ण क्रिया को व्यक्त करता है और ज्ञान प्राप्त करने की पूर्णता बनाए रखता है, बिना ‘पहचानना’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: संसार
  rationale: यूनानी मूल के इस शब्द का अर्थ-बोध ब्रह्मांड और मानवीय जगत दोनों तक जा सकता है; ‘संसार’ हिन्दी में इसी व्यापकता को स्वाभाविक ढंग से रखता है।
- source_word: ϩⲉ (with ⲉ)
  choice: पा लिया है
  rationale: मूल अर्थ ‘पाना/खोजना’ है। यहाँ ‘पा लिया’ पूर्ण क्रिया और सूक्ति की सहज हिन्दी दोनों को व्यक्त करता है।
- source_word: ⲡⲥⲱⲙⲁ
  choice: देह
  rationale: यहाँ पाण्डुलिपि में ⲥⲱⲙⲁ है, जिसका सीधा अर्थ ‘देह/शरीर’ है। ‘देह’ संक्षिप्त और गरिमापूर्ण है तथा समानांतर कथन 56 के ‘लाश’ अर्थ वाले अलग शब्द के साथ कृत्रिम सामंजस्य नहीं बनाता।
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: उसके योग्य नहीं है
  rationale: योग्यता व्यक्त करने वाली मूल मुहावरेदार रचना और उसके निषेध को सीधा बनाए रखता है।
- source_word: ⲇⲉ
  choice: और
  rationale: दो समानांतर खंडों को जोड़ता है; ‘परन्तु’ अनावश्यक विरोध जोड़ देता।
theological_decisions:
- issue: ‘देह’ और ‘लाश’ के बीच अर्थ-चयन
  choice: देह
  alternative: लाश
  rationale: ⲥⲱⲙⲁ कभी-कभी मृत देह के लिए प्रयुक्त हो सकता है, पर यहाँ ‘देह’ उसका सीधा और अचिह्नित अर्थ है। कथन 56 में स्पष्टतः अलग शब्द ⲡⲧⲱⲙⲁ (‘लाश’) मिलता है; इसलिए दोनों कथनों का भेद सुरक्षित रखा गया है।
- issue: संसार और देह के सम्बन्ध की व्याख्या
  choice: सूक्ति के विरोधाभासी कथन को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: देह को संसार का मृत या निकृष्ट सार बताना
  rationale: मूल पाठ केवल कहता है कि संसार को जानने वाले ने देह को पाया है; वह इस सम्बन्ध का दार्शनिक अर्थ स्पष्ट नहीं करता। अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
- issue: पुल्लिंग एकवचन सर्वनाम का सामान्य मानवीय सन्दर्भ
  choice: जिसने … उसके
  alternative: जिस किसी ने … वह व्यक्ति
  rationale: हिन्दी की सम्बन्धवाचक रचना सभी व्यक्तियों के लिए स्वाभाविक रूप से सामान्य है और मूल के व्याकरणिक पुल्लिंग को किसी विशेष पुरुष तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त, सूक्तिपरक और गरिमापूर्ण रखी गई है। ‘देह’ सामान्य पाठक के लिए बोधगम्य है और ‘शरीर’ की तुलना में वाक्य की लय को अधिक सघन रखता है। ‘जान लिया’ और ‘पा लिया’ की समान पूर्णतामूलक बनावट मूल के दो पूर्ण कार्यों का संतुलन सुरक्षित रखती है।
