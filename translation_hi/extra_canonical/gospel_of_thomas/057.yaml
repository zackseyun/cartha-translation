base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
translation:
  language: hi
  text: यीशु ने कहा, “पिता का राज्य उस मनुष्य के समान है जिसके पास अच्छा बीज था। उसका शत्रु रात में आया और अच्छे बीज पर एक जंगली घास[a] बो गया। उस मनुष्य ने उन्हें उस जंगली घास को उखाड़ने नहीं दिया। उसने उनसे कहा, ‘कहीं ऐसा न हो कि तुम कहो, “हम जंगली घास को उखाड़ देंगे,” और उसके साथ गेहूँ भी उखाड़ डालो। क्योंकि कटनी के दिन जंगली घासें दिखाई देंगी; उन्हें उखाड़कर जला दिया जाएगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक पाठ में यहाँ एकवचन अनिश्चित रूप है—शाब्दिक रूप से, “एक जंगली घास।” अगले वाक्यों में वही शब्द निश्चित एकवचन में आता है, और अंत में बहुवचन हो जाता है। यह यूनानी मूल का शब्द प्रायः डार्नेल जैसी गेहूँ से मिलती-जुलती हानिकारक घास के लिए प्रयुक्त होता है।
    reason: स्रोत में असामान्य एकवचन से अंत के बहुवचन में होने वाले बदलाव को स्पष्ट करना।
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: पिता का राज्य
  rationale: यह स्रोत के संबंधवाचक विन्यास का सीधा और स्वाभाविक हिन्दी रूप है; ‘राज्य’ कथन की धार्मिक और रूपकात्मक व्यापकता बनाए रखता है।
- source_word: ⲟⲩϭⲣⲟϭ ⲉⲛⲁⲛⲟⲩϥ
  choice: अच्छा बीज
  rationale: ⲛⲁⲛⲟⲩϥ का मूल अर्थ ‘अच्छा’ है; ‘उत्तम’ भी संभव है, पर ‘अच्छा बीज’ सामान्य आधुनिक हिन्दी में अधिक सहज है।
- source_word: ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: जंगली पौधा / जंगली पौधे
  rationale: यह यूनानी मूल का शब्द विशेषतः डार्नेल जैसे हानिकारक पौधे को सूचित करता है। ‘जंगली पौधा’ सामान्य पाठक के लिए बोधगम्य है और स्रोत में एकवचन से बहुवचन की ओर होने वाले बदलाव को व्यक्त कर सकता है। आरंभिक वाक्य में ‘एक बीज’ जोड़कर अच्छे बीज के ऊपर/बीच किसी एक पौधे को बोने की हिन्दी अस्वाभाविकता घटाई गई है, जबकि फुटनोट स्रोत का शाब्दिक रूप बताता है।
- source_word: ⲕⲟⲟⲩ ⲉϩⲱⲗⲉ
  choice: लोगों को … उखाड़ने नहीं दिया
  rationale: बहुवचन कर्मवाचक सर्वनाम का हिन्दी में स्पष्ट संदर्भ देने के लिए ‘लोगों’ का प्रयोग किया गया है; क्रिया का आशय अनुमति न देना है।
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: दिखाई दे जाएँगे
  rationale: इस पदबंध का अर्थ प्रकट होना या दिखाई देना है। कटनी के समय पहचान स्पष्ट हो जाने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ⲡⲱϩⲥ
  choice: कटनी
  rationale: शब्द का अर्थ फसल काटना या कटनी है। ‘कटनी का दिन’ ग्रामीण रूपक के अनुकूल और हिन्दी बाइबलीय गद्य में सुबोध है।
theological_decisions:
- issue: राज्य का संबंध
  choice: पिता का राज्य
  alternative: स्वर्ग का राज्य / परमेश्वर का राज्य
  rationale: स्रोत स्पष्ट रूप से ‘पिता’ कहता है। समानांतर परंपराओं के अधिक परिचित पदों को यहाँ प्रतिस्थापित करना स्रोत की विशिष्ट अभिव्यक्ति मिटा देता।
- issue: जंगली पौधों की पहचान
  choice: किसी व्यक्ति या धार्मिक समूह के रूप में व्याख्या नहीं की गई
  alternative: बुरे लोग / दुष्ट की संतान
  rationale: इस कथन में रूपक की व्याख्या नहीं दी गई है। अनुवाद केवल पौधे, गेहूँ और कटनी की छवियाँ रखता है और उनकी धर्मवैज्ञानिक पहचान तय नहीं करता।
- issue: अंतिम क्रियाओं की वाच्यता
  choice: उन्हें उखाड़कर जला दिया जाएगा
  alternative: वे उन्हें उखाड़ेंगे और जला देंगे
  rationale: कॉप्टिक में अनिश्चित बहुवचन कर्ता के साथ सक्रिय क्रियाएँ हैं, जो प्रसंग में हिन्दी कर्मवाच्य से स्वाभाविक रूप से व्यक्त होती हैं। इससे यह अनावश्यक रूप से तय नहीं होता कि कार्य करने वाले कौन हैं।
