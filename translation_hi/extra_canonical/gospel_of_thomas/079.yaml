base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/079.yaml
  text: A woman said to him in the crowd[a], “Blessed is the womb that bore you, and the breasts that nursed you.” He said to her, “Blessed are those who have heard the word of the Father and have kept it in truth; for days will come when you will say, ‘Blessed is the womb that has not conceived[e][d][c][b], and the breasts that have not given milk.’”
translation:
  language: hi
  text: भीड़ में एक स्त्री ने उससे कहा, “धन्य है वह गर्भ जिसने तुझे धारण किया, और वे स्तन जिन्होंने तुझे दूध पिलाया।”[a] उसने उससे कहा, “धन्य हैं वे जिन्होंने पिता का वचन सुना है और सच्चाई से उसे सँभालकर रखा है।[b] क्योंकि ऐसे दिन आएँगे जब तुम लोग कहोगे, ‘धन्य है वह गर्भ जिसने गर्भधारण नहीं किया,[c] और वे स्तन जिन्होंने दूध नहीं पिलाया।’”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक में शाब्दिक रूप से “तेरे स्तन” है। यह संबंधसूचक प्रयोग उन स्तनों को सूचित करता है जिनसे उसे दूध पिलाया गया था।
    reason: dialect_note
  - marker: b
    text: “सच्चाई से उसे सँभालकर रखा” का अनुवाद “उसकी रक्षा की” या “सचमुच उसका पालन किया” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त कॉप्टिक क्रिया विशेष रूप से गर्भधारण करने या गर्भवती होने का अर्थ देती है, न कि केवल जन्म देने का।
    reason: lexical_clarification
  - marker: d
    text: 'तुलना करें: लूका 11:27–28 और लूका 23:29। पांडुलिपि में ‘स्त्री’, ‘गर्भ’, ‘स्तन’ और ‘दूध पिलाने’ से जुड़े कुछ छोटे पाठांश संपादकीय रूप से पुनर्स्थापित हैं, पर उनसे कथन का आशय नहीं बदलता।'
    reason: cross_reference_and_restoration
lexical_decisions:
- source_word: ⲟⲩⲥϩⲓⲙⲉ ϩⲛ ⲡⲙⲏⲏϣⲉ
  choice: भीड़ में एक स्त्री
  rationale: अनिश्चित उपपद ⲟⲩ- किसी अनिर्दिष्ट स्त्री को सूचित करता है; ⲙⲏⲏϣⲉ का स्वाभाविक आधुनिक हिन्दी रूप ‘भीड़’ है।
- source_word: ⲡϩⲏ … ϥⲓ ϩⲁ
  choice: वह गर्भ जिसने तुझे धारण किया
  rationale: संदर्भ में ϩⲏ ‘गर्भ’ है और ϥⲓ ϩⲁ जन्म देने/उठाए रखने का भाव रखता है। ‘धारण किया’ बाद में प्रयुक्त गर्भधारण वाले अलग क्रियापद से भेद बनाए रखता है।
- source_word: ⲓⲃⲉ … ⲥⲁⲛⲟⲩϣ
  choice: वे स्तन जिन्होंने तुझे दूध पिलाया
  rationale: ⲓⲃⲉ बहुवचन ‘स्तन’ और ⲥⲁⲛⲟⲩϣ दूध पिलाने या स्तनपान कराने को व्यक्त करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ⲛⲉⲉⲓⲁⲧ
  choice: धन्य है/हैं
  rationale: आशीर्वचन की गंभीर शैली और पारंपरिक अर्थ को बनाए रखने के लिए ‘धन्य’ चुना गया।
- source_word: ⲡⲗⲟⲅⲟⲥ ⲛⲡⲉⲓⲱⲧ
  choice: पिता का वचन
  rationale: यूनानी आगंतुक शब्द λόγος का स्थापित समतुल्य ‘वचन’ है; ‘पिता’ को मूल पाठ की तरह बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: ϩⲁⲣⲉϩ … ϩⲛ ⲟⲩⲙⲉ
  choice: सच्चाई से उसे सँभालकर रखा है
  rationale: ϩⲁⲣⲉϩ में रखने, बचाए रखने और रक्षा करने की अर्थ-छाया है; ϩⲛ ⲟⲩⲙⲉ को स्वाभाविक हिन्दी में ‘सच्चाई से’ दिया गया है, जबकि वैकल्पिक अर्थ टिप्पणी में सुरक्षित है।
- source_word: ⲙⲡⲥⲱ
  choice: जिसने गर्भधारण नहीं किया
  rationale: यहाँ क्रिया गर्भवती होने या गर्भधारण करने को सूचित करती है; इसे ‘जन्म नहीं दिया’ कहने से पहले प्रयुक्त ϥⲓ ϩⲁ के साथ मौजूद शाब्दिक भेद मिट जाता।
theological_decisions:
- issue: स्त्री के जैविक मातृत्व-विषयक आशीर्वचन और यीशु के उत्तर का संबंध
  choice: उत्तर को बिना ‘बल्कि’ जोड़े स्वतंत्र दूसरे आशीर्वचन के रूप में रखा गया
  alternative: ‘बल्कि धन्य हैं वे…’
  rationale: कॉप्टिक पाठ में स्पष्ट विरोधसूचक संयोजक नहीं है। ‘बल्कि’ जोड़ना दोनों कथनों का संबंध व्याख्यात्मक रूप से तय कर देता, जबकि मूल पाठ का तनाव खुला है।
- issue: ‘पिता’ की पहचान
  choice: केवल ‘पिता’
  alternative: ‘परमेश्वर पिता’
  rationale: मूल पाठ केवल ‘पिता’ कहता है; व्याख्यात्मक पहचान जोड़ना अनावश्यक धार्मिक विस्तार होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर पर सहज बाइबिलीय शैली में रखी गई है। प्रत्यक्ष संबोधन में एकवचन ‘तुझे’ और अंतिम बहुवचन में स्पष्ट ‘तुम लोग’ मूल के वचन-भेद को दर्शाते हैं। जैविक बिंबों को शिष्ट पर प्रत्यक्ष भाषा में सुरक्षित रखा गया है।
