base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
translation:
  language: hi
  text: और उसने कहा, “मनुष्य उस बुद्धिमान मछुआरे के समान है जिसने अपना जाल समुद्र में डाला। उसने उसे समुद्र से ऊपर खींचा; वह छोटी मछलियों से भरा था। उनके बीच उस बुद्धिमान मछुआरे को एक बड़ी और अच्छी मछली मिली। उसने सभी छोटी मछलियों को वापस समुद्र में फेंक दिया और बिना कठिनाई के बड़ी मछली चुन ली। जिसके सुनने के कान हों, वह सुन ले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ
  choice: मनुष्य
  rationale: निश्चित पदबंध यहाँ किसी एक पुरुष के बजाय मनुष्य को सामान्य रूप से दर्शाता है; ‘मनुष्य’ आधुनिक हिन्दी में इस सामान्य और दृष्टान्तात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲟⲩⲱϩⲉ ⲛⲣⲙⲛϩⲏⲧ
  choice: बुद्धिमान मछुआरा
  rationale: ⲟⲩⲱϩⲉ मछुआरे को और ⲣⲙⲛϩⲏⲧ शाब्दिक रूप से ‘हृदय/मन वाला’, अर्थात बुद्धिमान या समझदार व्यक्ति, को सूचित करता है।
- source_word: ⲡⲉϥⲁⲃⲱ
  choice: अपना जाल
  rationale: कॉप्टिक में तृतीय पुरुष एकवचन का स्वामित्वसूचक रूप है। हिन्दी में कर्ता से सह-संदर्भित स्वामित्व के लिए ‘अपना’ सबसे स्वाभाविक है।
- source_word: ϩⲉ ⲉ-
  choice: मिली
  rationale: मुहावरे का शाब्दिक अर्थ ‘पर जा पड़ा’ है, पर इस प्रसंग में इसका सामान्य अर्थ ‘मिलना/पा लेना’ है।
- source_word: ⲉⲛⲁⲛⲟⲩϥ
  choice: अच्छी
  rationale: यह मछली के सकारात्मक गुण या उपयुक्तता को व्यक्त करता है। ‘अच्छी’ मूल की व्यापकता बनाए रखता है; ‘बहुमूल्य’ कहना अर्थ को अनावश्यक रूप से संकरा करता।
- source_word: ⲭⲱⲣⲓⲥϩⲓⲥⲉ
  choice: बिना कठिनाई के
  rationale: यूनानी मूल के ‘बिना’ और कॉप्टिक ‘परिश्रम/कठिनाई’ से बना पदबंध है; हिन्दी अभिव्यक्ति दोनों घटकों का अर्थ स्पष्ट रखती है।
theological_decisions:
- issue: दृष्टान्त को मत्ती 13:47–48 के समान बनाना
  choice: एक बुद्धिमान मछुआरे और एक बड़ी अच्छी मछली पर कॉप्टिक पाठ का एकवचन-केंद्रित रूप बनाए रखा गया।
  alternative: मछलियों को ‘अच्छी’ और ‘बुरी’ श्रेणियों में बाँटकर अंतिम न्याय का भाव जोड़ना।
  rationale: कॉप्टिक पाठ छोटी और बड़ी/अच्छी मछली का विरोध दिखाता है, न कि अच्छी और बुरी मछलियों का। किसी समानान्तर परम्परा से न्याय-विषयक अर्थ आयात करना स्रोत के तनाव और विशिष्टता को मिटा देगा।
- issue: ⲡⲣⲱⲙⲉ का लिंग और सामान्य आशय
  choice: ‘मनुष्य’ द्वारा सामान्य दृष्टान्तात्मक आशय रखा गया।
  alternative: ‘एक आदमी’ या केवल पुरुष-विशेष के रूप में अनुवाद।
  rationale: वाक्य किसी विशिष्ट पुरुष की पहचान नहीं कराता, बल्कि सामान्य तुलना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। छोटे वाक्य मौखिक दृष्टान्त की लय बनाए रखते हैं। ‘नीचे समुद्र में’ को इसलिए रखा गया है कि स्रोत के ⲉⲡⲉⲥⲏⲧ (‘नीचे’) को छोड़ा न जाए; पाठ में किसी अनिश्चित या व्याख्यात्मक फुटनोट की आवश्यकता नहीं पड़ी।
