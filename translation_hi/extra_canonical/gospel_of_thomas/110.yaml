base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/110.yaml
  text: Jesus said, “Whoever has found the world[b] and become wealthy[a], let that one renounce the world.”
translation:
  language: hi
  text: यीशु ने कहा, “जिसने संसार[b] को पा लिया है और धनी[a] हो गया है, वह संसार का त्याग कर दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महान/प्रतिष्ठित”; ⲣⲣⲙⲙⲁⲟ का अर्थ धनी होना या महान/प्रतिष्ठित होना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: डिली ने पहले “संसार” के पहले [ⲙ̄] पूर्वसर्ग को पांडुलिपि के एक छोटे रिक्त स्थान के कारण पुनर्स्थापित किया है।
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: प्रत्यक्ष कथन का परिचय देने वाला स्थिर सूत्र; सहज हिन्दी में मूल की संक्षिप्त शैली बनाए रखता है।
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: जिसने ... पा लिया है
  rationale: अनिश्चित संबंधवाचक रचना और पूर्ण पक्ष, दोनों को सामान्य अर्थ वाले हिन्दी वाक्य में व्यक्त करता है।
- source_word: ⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: संसार
  rationale: यूनानी मूल के कॉप्टिक ऋणशब्द का स्वाभाविक और व्यापक हिन्दी समतुल्य; दोनों स्थानों पर पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: ⲛ̄ⲧⲉⲛⲧⲟϥ ⲣⲣⲙⲙⲁⲟ
  choice: और धनी हो गया है
  rationale: क्रिया परिणामी अवस्था को व्यक्त करती है; ‘धनी’ यहाँ संभावित प्रमुख अर्थ है, जबकि ‘महान/प्रतिष्ठित’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: ⲙⲁⲣⲉ ⲛⲧⲟϥ
  choice: वह ... कर दे
  rationale: कॉप्टिक आज्ञार्थक/विध्यर्थक निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है और सामान्य व्यक्ति-संदर्भ बनाए रखता है।
- source_word: ⲁⲣⲛⲁ
  choice: त्याग कर दे
  rationale: सिर्फ मौखिक इनकार के बजाय संबंध-विच्छेद या परित्याग का भाव देता है; आधुनिक हिन्दी में ‘renounce’ का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ‘संसार को पा लिया’ और ‘संसार का त्याग’ के संबंध की व्याख्या
  choice: कथन को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘संसार की संपत्ति प्राप्त कर ली’ या किसी विशिष्ट तपस्वी अर्थ को स्पष्ट रूप से जोड़ना।
  rationale: मूल पाठ ‘संसार’ और ‘धनी/महान’ के बीच संबंध को पूरी तरह स्पष्ट नहीं करता; अनुवाद इस तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘पा लिया है’ मूल के पूर्ण पक्ष को और ‘त्याग कर दे’ निर्देशात्मक बल को व्यक्त करता है।
