base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
translation:
  language: hi
  text: 'यीशु ने कहा, “दो व्यक्ति एक ही शय्या पर विश्राम करेंगे; एक मरेगा और एक जीवित रहेगा।”


    सलोमी ने कहा, “तुम कौन हो, आदमी? मानो किसी एक की ओर से आए हो—तुम मेरी शय्या पर चढ़ बैठे और मेरी मेज़ से खाया।”[a]


    यीशु ने उससे कहा, “मैं वह हूँ जो समता से उत्पन्न हुआ है। मुझे मेरे पिता की वस्तुओं में से दिया गया है।”[b]


    [सलोमी ने कहा,] “मैं तुम्हारी शिष्या हूँ।”[c]


    [यीशु ने कहा,] “इसी कारण मैं कहता हूँ: जब कोई खाली हो जाएगा, तब वह प्रकाश से भर जाएगा; पर जब कोई विभाजित हो जाएगा, तब वह अंधकार से भर जाएगा।”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मानो एक से” या “मानो किसी एक की ओर से।” यहाँ “एक” किसी व्यक्ति को सूचित कर सकता है, पर इसे “एकमात्र” अथवा “एकता” के दार्शनिक संकेत के रूप में भी समझा गया है।'
    reason: lexical_alternative
  - marker: b
    text: “समता” के लिए कॉप्टिक पद का अर्थ “जो समान है” या “सम” भी हो सकता है। “मेरे पिता की वस्तुओं” मूल के बहुवचन संबंधवाचक रूप को दर्शाता है; अर्थ “जो मेरे पिता का है” भी हो सकता है।
    reason: lexical_and_theological_ambiguity
  - marker: c
    text: मूल कॉप्टिक पाठ अंतिम दो कथनों के वक्ताओं का परिचय नहीं देता। “सलोमी ने कहा” और अगले अनुच्छेद में “यीशु ने कहा” संदर्भ के आधार पर जोड़े गए हैं।
    reason: speaker_supplement
  - marker: d
    text: पांडुलिपि में “खाली” लिखा है, जिससे “प्रकाश से भर जाएगा” के साथ शब्द-विरोध बनता है। कुछ विद्वान इसे पाठ-संशोधित करके “सम” या “समान” पढ़ते हैं, जो पहले की “समता” और आगे के “विभाजित” से मेल खाता है।
    reason: textual_variant
lexical_decisions:
- source_word: ϭⲗⲟϭ
  choice: शय्या
  rationale: यह शब्द बिस्तर अथवा लेटने की चौकी के लिए है। ‘शय्या’ विश्राम और भोजन के प्रसंग, दोनों में उपयुक्त तथा गरिमापूर्ण है।
- source_word: ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ
  choice: मानो किसी एक की ओर से आए हो
  rationale: मूल अभिव्यक्ति का शाब्दिक अर्थ ‘मानो एक से/एक की ओर से’ है। हिंदी में क्रिया जोड़कर वाक्य स्वाभाविक बनाया गया है, जबकि ‘एक’ की संभावित दार्शनिक अनुगूँज को फुटनोट में सुरक्षित रखा गया है।
- source_word: ⲡⲉⲧϣⲏϣ
  choice: समता
  rationale: यह पद ‘जो समान/सम है’ को व्यक्त करता है। ‘समता’ मूल की अमूर्तता को बनाए रखता है और ‘एकता’ या ‘अविभाजित’ जैसी अधिक व्याख्यात्मक शब्दावली थोपने से बचता है।
- source_word: ⲛⲁⲡⲁⲉⲓⲱⲧ
  choice: मेरे पिता की वस्तुओं
  rationale: बहुवचन संबंधवाचक रूप का अर्थ ‘मेरे पिता की वस्तुएँ/जो मेरे पिता का है’ है; इसलिए केवल ‘मेरे पिता से’ कहना मूल की बहुवचन संरचना खो देता।
- source_word: ϣⲏϥ
  choice: खाली
  rationale: यह पांडुलिपि में विद्यमान पाठ है और ‘भर जाएगा’ के साथ स्पष्ट शब्द-विरोध बनाता है।
- source_word: ⲡⲏϣ
  choice: विभाजित
  rationale: यह ⲡⲱϣ, ‘बाँटना/विभाजित करना’, का गुणवाचक रूप है; इसका अर्थ ‘दो’ नहीं है।
theological_decisions:
- issue: ⲡⲉⲧϣⲏϣ को दैवी उपाधि मानना
  choice: समता
  alternative: सम; समान सत्ता; अविभाजित
  rationale: मूल को किसी निश्चित दार्शनिक तंत्र या व्यक्तिवाचक दैवी उपाधि में बदलने के बजाय उसकी अमूर्त और कुछ हद तक रहस्यमय भाषा सुरक्षित रखी गई है।
- issue: ϣⲏϥ का पाठ
