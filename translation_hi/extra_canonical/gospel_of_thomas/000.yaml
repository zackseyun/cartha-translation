base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/000.yaml
  text: These are the hidden sayings which the living Jesus spoke[4][3][2][1], and Didymos Judas Thomas wrote them.
translation:
  language: hi
  text: ये छिपे हुए[a] वचन हैं जिन्हें जीवित यीशु[c] ने कहा, और दिदिमुस[b] यहूदा थोमा ने उन्हें लिखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छिपे हुए” का अनुवाद “गुप्त” भी किया जा सकता है। यहाँ छिपे होने का मूल भाव रखा गया है, बिना किसी विशिष्ट रहस्यवादी परंपरा का अर्थ जोड़े।
    reason: lexical_alternative
  - marker: b
    text: “दिदिमुस” यूनानी भाषा का नाम है, जिसका अर्थ “जुड़वाँ” है। “थोमा” भी सामी मूल के ऐसे नाम से जुड़ा है जिसका अर्थ “जुड़वाँ” है; इसलिए पूरा नाम संभवतः दो भाषाओं में इस अर्थ को साथ रखता है।
    reason: cultural_note
  - marker: c
    text: पांडुलिपि में “जीवित” शब्द की वर्तनी में बोलीगत अथवा लेखनगत भिन्नता है; इससे अर्थ नहीं बदलता।
    reason: textual_variant
lexical_decisions:
- source_word: ⲛ̄ϣⲁϫⲉ
  choice: वचन
  rationale: बहुवचन को बनाए रखते हुए यह संक्षिप्त उक्तियों के संग्रह का संकेत देता है; “शिक्षाएँ” कहना अर्थ को आवश्यकता से अधिक व्याख्यायित करता।
- source_word: ϩⲏⲡ
  choice: छिपे हुए
  rationale: यह कॉप्टिक शब्द के ‘hidden/secret’ अर्थ में छिपे होने के भाव को रखता है, पर “गुप्त” से जुड़ सकने वाले बाद के रहस्यवादी आशयों को स्वतः नहीं जोड़ता।
- source_word: 'ⲱⲛϩ (manuscript: ⲧⲟⲛϩ)'
  choice: जीवित
  rationale: यीशु के विशेषणात्मक वर्णन को संक्षिप्त रूप में सुरक्षित रखता है और किसी प्रचलित धर्मवैज्ञानिक पदबंध से अनावश्यक सामंजस्य नहीं करता।
- source_word: ϫⲟⲟⲩ
  choice: कहा
  rationale: मूल क्रिया और उसके बहुवचन कर्म का सीधा, स्वाभाविक हिन्दी रूप; ‘उच्चारित किया’ अनावश्यक रूप से औपचारिक होता।
- source_word: ⲥϩⲁⲓ
  choice: लिखा
  rationale: लेखन की साधारण क्रिया को बिना ‘लिख लिया’ या ‘अभिलिखित किया’ जैसे अतिरिक्त भाव के व्यक्त करता है।
- source_word: ⲇⲓⲇⲩⲙⲟⲥ
  choice: दिदुमुस
  rationale: पांडुलिपि में आए यूनानी-उधार नाम का लिप्यंतरण है; उसके अर्थ ‘जुड़वाँ’ को मुख्य पाठ में प्रतिस्थापित करने के बजाय टिप्पणी में बताया गया है।
- source_word: ⲓⲟⲩⲇⲁⲥ
  choice: यहूदा
  rationale: इस नाम का प्रचलित हिन्दी बाइबलीय रूप चुना गया है।
- source_word: ⲑⲱⲙⲁⲥ
  choice: थोमा
  rationale: नाम का प्रचलित हिन्दी रूप, जो पांडुलिपि की नाम-श्रृंखला को बनाए रखता है।
- source_word: ⲛⲁⲉⲓ ⲛⲉ
  choice: ये वे … हैं
  rationale: पांडुलिपि के बहुवचन को स्पष्ट करता है और आगे आने वाले वचनों के संग्रह की भूमिका प्रस्तुत करता है।
theological_decisions:
- issue: ‘जीवित यीशु’ पदबंध का अर्थ
  choice: पदबंध को ज्यों का त्यों विशेषणात्मक रूप में रखा गया
  alternative: ‘जी उठे हुए यीशु’ या ‘सदा जीवित यीशु’
  rationale: मूल केवल यीशु को ‘जीवित’ कहता है; वह स्वयं यह निश्चित नहीं करता कि संकेत पुनरुत्थान, वर्तमान जीवन या उपाधिसदृश प्रयोग की ओर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भूमिका। वाक्य की पुनरुक्त कर्म-संरचना (“उन्हें”) मूल में दोनों क्रियाओं के समान वचनों की ओर संकेत को स्पष्ट रखती है। नामों के प्रचलित हिन्दी रूप अपनाए गए हैं, जबकि ‘दिदुमुस’ को अनूदित करने के बजाय लिप्यंतरित किया गया है।
