base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
translation:
  language: hi
  text: यीशु ने कहा, “कोई बूढ़ा व्यक्ति अपनी वृद्धावस्था में सात दिन के छोटे बच्चे से जीवन के स्थान के बारे में पूछने में नहीं हिचकेगा,[a] और वह जीवित रहेगा। क्योंकि बहुत-से जो पहले हैं, वे अंतिम हो जाएँगे,[b] और वे एक हो जाएँगे।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक में ‘हिचकना’ (ϫⲛⲁⲩ) और ‘पूछना’ (ϫⲛⲉ) की ध्वनियाँ एक-दूसरे से मिलती हैं; यह शब्द-खेल हिन्दी में सुरक्षित नहीं रह पाता।
    reason: register_note
  - marker: b
    text: यूनानी खंड P.Oxy. 654 में इसके बाद “और अंतिम पहले हो जाएँगे” भी है; उपलब्ध कॉप्टिक पाठ में यह वाक्यांश नहीं है।
    reason: textual_variant
  - marker: c
    text: “बहुत-से जो पहले हैं, वे अंतिम हो जाएँगे” से मिलती-जुलती उक्ति मत्ती 19:30, मरकुस 10:31 और लूका 13:30 में भी मिलती है। यहाँ कथन का अंत “और वे एक हो जाएँगे” से होता है।
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲛⲁⲩ
  choice: हिचकेगा
  rationale: इस क्रिया का अर्थ ‘हिचकना/देर करना’ है; यूनानी साक्षी का ἀποκνήσει भी ‘हिचकना’ अर्थ की पुष्टि करता है। ‘लज्जित होगा’ अर्थ यहाँ स्रोत-साक्ष्य से समर्थित नहीं है।
- source_word: ϫⲛⲉ
  choice: पूछने
  rationale: यह ϫⲛⲟⲩ (‘पूछना’) का रूप है। सहज आधुनिक हिन्दी में ‘पूछना’ सबसे स्पष्ट है।
- source_word: ⲡⲧⲟⲡⲟⲥ ⲛⲡⲱⲛϩ
  choice: जीवन के स्थान
  rationale: ‘स्थान’ स्रोत के τόπος-आधारित पद की ठोस और जानबूझकर रहस्यमय अभिव्यक्ति को बनाए रखता है; इसे ‘जीवन का रहस्य’ जैसे व्याख्यात्मक रूप में नहीं बदला गया।
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: एक ही
  rationale: यह संख्यात्मक एकता/एकत्व को व्यक्त करता है और ‘एकजुट’ जैसे केवल सामाजिक अर्थ वाले शब्द से अधिक निकट है। हिन्दी में ‘एक ही’ स्वाभाविक रहते हुए मूल की एकता को सुरक्षित रखता है।
theological_decisions:
- issue: ⲟⲩⲁ ⲟⲩⲱⲧ में निहित एकता का स्वरूप
  choice: एक ही हो जाएँगे
  alternative: एक हो जाएँगे / एकजुट हो जाएँगे / एक अकेला हो जाएँगे
  rationale: अनुवाद परिवर्तन और एकत्व की भाषा बनाए रखता है, पर यह तय नहीं करता कि एकता आध्यात्मिक, सामाजिक या अस्तित्वगत है।
- issue: ‘पहले’ और ‘अंतिम’ वाले कथन का पाठ
  choice: कॉप्टिक पाठ के अनुसार केवल ‘जो पहले हैं, वे अंतिम हो जाएँगे’
  alternative: ‘और अंतिम पहले’ जोड़ना
  rationale: मुख्य अनुवाद उपलब्ध कॉप्टिक पाठ का अनुसरण करता है। यूनानी खंड में मिलने वाला अतिरिक्त उलटाव पादटिप्पणी में दिया गया है, मुख्य पाठ में नहीं मिलाया गया।
- issue: ‘वह जीवित रहेगा’ का कर्ता
  choice: एकवचन सर्वनाम ‘वह’ को अस्पष्ट रखा गया
  alternative: स्पष्ट रूप से बूढ़े व्यक्ति या बच्चे को कर्ता बताना
  rationale: स्रोत में एकवचन कर्ता है, पर निकटवर्ती दो पुरुषवाचक व्यक्तियों के कारण उसका संदर्भ पाठक के लिए तनावपूर्ण रह सकता है; अनुवाद उसे चुपचाप निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘अपनी उम्र के दिनों में’ मूल की असामान्य काल-अभिव्यक्ति को कुछ हद तक बनाए रखता है। ‘छोटे बच्चे’ और ‘सात दिन’ की ठोस छवि को सरल नहीं किया गया। उद्धरण के रहस्यमय और विरोधाभासी स्वर को व्याख्यात्मक विस्तार से नहीं दबाया गया।
