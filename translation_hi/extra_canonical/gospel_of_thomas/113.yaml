base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
translation:
  language: hi
  text: 'उसके शिष्यों ने उससे कहा, “पिता का शासन[a] किस दिन आएगा?”


    [उसने कहा][b], “वह देखने से नहीं आएगा। लोग यह नहीं कहेंगे, ‘देखो, यहाँ!’ या ‘देखो, वहाँ!’[c] बल्कि पिता का शासन धरती[d] पर फैला हुआ है, और लोग उसे नहीं देखते।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शासन’ के स्थान पर ‘राज्य’ भी अनुवाद किया जा सकता है। मूल भाववाचक शब्द में राजा के शासन या राज करने का अर्थ प्रमुख है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में उत्तर से पहले ‘उसने कहा’ शब्द नहीं हैं; वाक्य की स्पष्टता के लिए इन्हें वर्ग कोष्ठकों में जोड़ा गया है।
    reason: source_omission
  - marker: c
    text: पांडुलिपि की पंक्ति में ‘वहाँ’ पढ़ा जाता है। सामान्यीकृत पाठ में मिलता-जुलता शब्द ‘आकाश/स्वर्ग’ छपा है, पर इस प्रसंग में ‘यहाँ—वहाँ’ का युग्म अधिक स्वाभाविक है।
    reason: textual_variant
  - marker: d
    text: ‘धरती’ के लिए प्रयुक्त मूल शब्द का अर्थ ‘भूमि’ या ‘देश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: राज
  rationale: यह भाववाचक संज्ञा राजा के शासन या राज करने को व्यक्त करती है। ‘राज’ आधुनिक हिन्दी में इस अमूर्त अर्थ को स्वाभाविक रूप से रखता है, जबकि ‘राज्य’ किसी भूभाग का संकेत भी दे सकता है।
- source_word: ⲛⲁϣ ⲛϩⲟⲟⲩ
  choice: किस दिन
  rationale: स्रोत का शाब्दिक प्रश्न ‘किस दिन’ है; इसे सामान्य ‘कब’ में सरल नहीं किया गया।
- source_word: ϭⲱϣⲧ
  choice: देखते रहना
  rationale: संज्ञा का अर्थ देखना या निगाह रखना है। यह चुनाव बाहरी संकेतों को देखने की क्रिया को बनाए रखता है, बिना ‘निरीक्षण’ जैसे अधिक तकनीकी शब्द के।
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: देखो
  rationale: संकेत करते हुए ध्यान खींचने वाली संक्षिप्त आज्ञा के लिए सहज आधुनिक हिन्दी।
- source_word: ⲡⲓⲥⲁ
  choice: यहाँ
  rationale: शाब्दिक रूप से ‘यह स्थान’; इस संकेतवाचक युग्म में इसका स्वाभाविक अर्थ ‘यहाँ’ है।
- source_word: ⲧⲏ / ⲡⲏ
  choice: वहाँ
  rationale: पांडुलिपि की पंक्ति में संकेतवाचक ⲧⲏ ‘वहाँ’ है, जो ‘यहाँ/वहाँ’ युग्म बनाता है; सामान्यीकृत पाठ का ⲡⲏ ‘आकाश/स्वर्ग’ संदर्भ में कठिन है।
- source_word: ⲥⲡⲱⲣϣ
  choice: फैला हुआ है
  rationale: क्रिया फैलाने या बिखेरने का बोध देती है। हिन्दी रूप वर्तमान में पहले से विद्यमान और विस्तृत वास्तविकता को व्यक्त करता है।
- source_word: ϩⲓϫⲛ ⲡⲕⲁϩ
  choice: धरती पर
  rationale: मूल स्थानिक चित्र को बनाए रखता है; ⲡⲕⲁϩ का अर्थ ‘भूमि’ भी हो सकता है।
- source_word: ⲛⲣⲱⲙⲉ
  choice: लोग
  rationale: स्रोत का सामान्य बहुवचन है; ‘लोग’ समावेशी और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ को भूभाग या शासन के रूप में समझना
  choice: राज
  alternative: राज्य
  rationale: ‘राज’ पिता के शासन या राज करने के अमूर्त भाव को प्रमुख रखता है, पर टिप्पणी में प्रचलित वैकल्पिक अनुवाद ‘राज्य’ को भी दर्ज किया गया है।
- issue: राज का वर्तमान में फैला होना
  choice: ‘फैला हुआ है’ के वर्तमान कथन को बनाए रखा
  alternative: ‘फैलाया गया है’ या केवल भावी राज्य के रूप में पढ़ना
  rationale: स्रोत वर्तमान, पहले से फैली हुई वास्तविकता का कथन करता है; अनुवाद इसे भावी घटना या स्पष्ट कर्मवाच्य में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘राज’ अमूर्त शासन का अर्थ बचाता है; ‘देखते रहने’ की कुछ असामान्य संक्षिप्तता स्रोत की तीखी अभिव्यक्ति को बनाए रखती है। स्रोत में अनुपस्थित कथन-क्रिया को वर्ग कोष्ठकों में दिखाया गया है।
