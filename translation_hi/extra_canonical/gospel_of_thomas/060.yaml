base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
translation:
  language: hi
  text: '**कथन 60**


    ⟨उन्होंने देखा⟩[a] कि एक सामरी एक मेमना उठाए हुए यहूदिया में जा रहा था। उसने अपने शिष्यों से कहा, “वह—मेमने के साथ?”[b]


    उन्होंने उससे कहा, “ताकि वह उसे मारकर खा सके।”


    उसने उनसे कहा, “जब तक वह जीवित है, वह उसे नहीं खाएगा; लेकिन यदि वह उसे मार डाले और वह लाश बन जाए—”


    उन्होंने कहा, “दूसरे ढंग से वह ऐसा नहीं कर सकेगा।”


    उसने उनसे कहा, “तुम भी अपने लिए विश्राम में एक स्थान खोजो, ताकि तुम लाश न बन जाओ और वे तुम्हें खा न जाएँ।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में यहाँ मुख्य क्रिया नहीं है; उसका शाब्दिक पाठ केवल “एक सामरी को” है। अर्थ पूरा करने के लिए संपादक “उन्होंने देखा” जोड़ते हैं।
    reason: textual_variant
  - marker: b
    text: कॉप्टिक वाक्य अधूरा और अत्यंत संक्षिप्त है; शाब्दिक रूप से लगभग “वह—मेमने के आसपास?” शिष्यों के उत्तर से स्पष्ट है कि उन्होंने इसे उस व्यक्ति के उद्देश्य के बारे में प्रश्न समझा।
    reason: lexical_alternative
  - marker: c
    text: कॉप्टिक में यहाँ कर्तृवाच्य बहुवचन है—“वे तुम्हें खाएँ”—न कि कर्मवाच्य “तुम खाए जाओ।”
    reason: register_note
lexical_decisions:
- source_word: ⲥⲁⲙⲁⲣⲉⲓⲧⲏⲥ
  choice: सामरी
  rationale: सामरिया के व्यक्ति के लिए प्रचलित, संक्षिप्त और ऐतिहासिक रूप से उपयुक्त हिन्दी पद।
- source_word: ϩⲓⲉⲓⲃ
  choice: मेमना
  rationale: यह शब्द भेड़ के बच्चे को सूचित करता है; “मेमना” सहज आधुनिक हिन्दी है और कथन में पशु की पहचान बनाए रखता है।
- source_word: ⲡⲏ ... ⲡⲕⲱⲧⲉ ⲛⲡϩⲓⲉⲓⲃ
  choice: वह—मेमने के साथ?
  rationale: मूल का प्रश्न अत्यंत संक्षिप्त और व्याकरणतः अधूरा है। हिन्दी में डैश के द्वारा उसका अटपटा, संकेतात्मक स्वर सुरक्षित रखा गया है; “किसलिए” जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: ⲡⲧⲱⲙⲁ
  choice: लाश
  rationale: यूनानी आगंतुक शब्द πτῶμα मृत शरीर या शव को दर्शाता है। “लाश” साधारण आधुनिक पाठक के लिए स्पष्ट है और पशु तथा मनुष्य दोनों के संदर्भ में काम करता है।
- source_word: ϣⲁ
  choice: कर सकेगा
  rationale: यहाँ क्रिया सामर्थ्य व्यक्त करती है और Future I रूप के कारण भविष्यकाल “सकेगा” रखा गया है।
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: विश्राम
  rationale: यूनानी ἀνάπαυσις का अर्थ विश्राम/चैन है। “विश्राम” कथन के आध्यात्मिक आयाम को खुला रखते हुए स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: मेमने के विषय में यीशु के संक्षिप्त प्रश्न की व्याख्या
  choice: वह—मेमने के साथ?
  alternative: वह उस मेमने को किसलिए ले जा रहा है?
