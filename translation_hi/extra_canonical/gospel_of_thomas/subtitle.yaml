translation:
  language: hi
  text: थोमा के अनुसार सुसमाचार[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: शुभ समाचार। ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ का शाब्दिक अर्थ ‘शुभ समाचार’ हो सकता है, पर किसी ग्रंथ-विधा के शीर्षक में ‘सुसमाचार’ प्रचलित है।'
    reason: lexical_alternative
  - marker: b
    text: कॉप्टिक में ‘थोमा के अनुसार’ (ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ) के आगे निश्चित उपपद ⲡ- है; यह कॉप्टिक पांडुलिपियों में प्रयुक्त एक निश्चित शीर्षक-सूत्र है।
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: सुसमाचार
  rationale: यह यूनानी εὐαγγέλιον से आया कॉप्टिक शब्द है। शीर्षक और साहित्यिक विधा के नाम के रूप में हिन्दी में ‘सुसमाचार’ स्वाभाविक और प्रचलित है; शाब्दिक विकल्प ‘शुभ समाचार’ पाद-टिप्पणी में रखा गया है।
- source_word: ⲡⲕⲁⲧⲁ
  choice: के अनुसार
  rationale: कॉप्टिक पांडुलिपियों के निश्चित शीर्षक-सूत्र में यूनानी κατά से आया यह पद संबंध या आरोपण के अर्थ में ‘के अनुसार’ है; इसे सीधे ‘के द्वारा’ कहने से लेखकत्व आवश्यकता से अधिक निश्चित हो सकता है।
- source_word: ⲑⲱⲙⲁⲥ
  choice: थोमा
  rationale: Θωμᾶς/ⲑⲱⲙⲁⲥ नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘थोमा’ है।
theological_decisions:
- issue: शीर्षक-सूत्र में लेखकत्व का स्वरूप
  choice: थोमा के अनुसार
  alternative: थोमा द्वारा रचित
  rationale: मूल का κατά/ⲕⲁⲧⲁ सूत्र संबद्धता या परंपरागत आरोपण बताता है, पर स्वयं स्पष्ट रूप से प्रत्यक्ष लेखकत्व का दावा नहीं करता; इसलिए मूल की गुंजाइश सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ग्रंथ-शीर्षक। ‘के अनुसार’ मूल शीर्षक-सूत्र को स्वाभाविक हिन्दी में रखते हुए लेखकत्व के विषय में अनावश्यक निश्चितता से बचाता है।
