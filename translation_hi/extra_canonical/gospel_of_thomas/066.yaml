base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/066.yaml
  text: Jesus said, "Show me this stone that the builders threw out; it is the cornerstone."[a][b][c][d]
translation:
  language: hi
  text: यीशु ने कहा, “मुझे यह पत्थर दिखाओ[a], जिसे निर्माण करने वालों ने बाहर फेंक दिया था[b]; वही कोने का पत्थर[c] है।”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक पदबंध का शाब्दिक भाव है, “मुझे देखने दो,” अर्थात् “मुझे दिखाओ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बाहर फेंक दिया”; इसका अनुवाद “ठुकरा दिया” भी किया जाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “कोने का पत्थर।” प्रसंग यह निश्चित नहीं करता कि इससे नींव का पत्थर अभिप्रेत है या भवन के किसी अन्य कोने का प्रमुख पत्थर।
    reason: lexical_alternative
  - marker: d
    text: यह भजन 118:22 (यूनानी सेप्टुआजिंट में 117:22) की प्रतिध्वनि है; यही वचन मरकुस 12:10; मत्ती 21:42; लूका 20:17; प्रेरितों के काम 4:11; और 1 पतरस 2:7 में उद्धृत है।
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ
  choice: मुझे … दिखाओ
  rationale: इस पदबंध का शाब्दिक भाव ‘मुझे देखने दो/मुझे देखने के लिए दो’ है; स्वाभाविक आधुनिक हिन्दी में ‘मुझे दिखाओ’ आज्ञार्थक चुनौती को बनाए रखता है।
- source_word: ⲡⲱⲛⲉ ⲡⲁⲓ
  choice: यह पत्थर
  rationale: संकेतवाचक ⲡⲁⲓ को स्पष्ट रखते हुए निकटता और कथन की संकेतात्मक तीक्ष्णता सुरक्षित रहती है।
- source_word: ⲛ̄ⲧⲁⲩⲥⲧⲟϥ ⲉⲃⲟⲗ
  choice: जिसे … बाहर फेंक दिया था
  rationale: क्रिया का सजीव, मूल अर्थ ‘बाहर फेंकना’ सुरक्षित रखा गया है; केवल ‘ठुकराना’ करने से ठोस बिंब कम हो जाता।
- source_word: ⲛ̄ϭⲓ ⲛⲉⲧ ⲕⲱⲧ
  choice: राजमिस्त्रियों
  rationale: संज्ञीकृत भाव ‘निर्माण करने वाले’ है। पत्थर से निर्माण के प्रसंग में ‘राजमिस्त्री’ साधारण हिन्दी में सटीक और स्वाभाविक है।
- source_word: ⲡⲱⲛⲉ ⲛⲕⲱϩ
  choice: कोने का पत्थर
  rationale: कॉप्टिक संरचना का सीधा अर्थ ‘कोने का पत्थर’ है। यह ‘कोने का प्रधान पत्थर’ या किसी खास स्थापत्य स्थान को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ⲡⲱⲛⲉ ⲛⲕⲱϩ का स्थापत्य और प्रतीकात्मक अर्थ
  choice: कोने का पत्थर
  alternative: कोने का प्रधान पत्थर / आधारशिला
  rationale: मूल पाठ केवल ‘कोने का पत्थर’ कहता है; ‘प्रधान’ अथवा ‘आधारशिला’ जोड़ने से पत्थर की स्थिति और धर्मवैचारिक भूमिका मूल से अधिक निश्चित हो सकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बनाने वालों’ की अपेक्षा पत्थर-निर्माण के प्रसंग में ‘राजमिस्त्रियों’ को चुना गया है। मूल का ठोस बिंब बनाए रखने के लिए ‘ठुकराया’ के बजाय ‘बाहर फेंक दिया’ मुख्य पाठ में है।
