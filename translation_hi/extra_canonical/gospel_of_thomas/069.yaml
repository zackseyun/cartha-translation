base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/069.yaml
  text: Jesus said[1], “Blessed are those who have been persecuted in their heart; those are the ones who have truly known the Father. Blessed are those who have gone hungry[a][3][2], so that the belly of the one who desires will be filled.”
translation:
  language: hi
  text: यीशु ने कहा, “धन्य हैं वे जिन्हें उनके हृदय में सताया गया है।[a] वे ही हैं जिन्होंने सचमुच पिता को जाना है। धन्य हैं वे जो भूखे हैं,[b] ताकि इच्छा रखनेवाले का पेट भर जाए।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनके हृदय में” का संबंध सतानेवालों के हृदय से भी हो सकता है और सताए गए लोगों के भीतरी हृदय से भी; कॉप्टिक वाक्य दोनों अर्थों की गुंजाइश देता है।
    reason: ambiguity
  - marker: b
    text: पांडुलिपि में यहाँ बहुवचन है—“वे जो भूखे हैं।” संपादित सामान्यीकृत पाठ इसे व्याकरणिक रूप से एकवचन बनाता है।
    reason: textual_variant
  - marker: c
    text: मूल में “पेट” के लिए ठोस देहगत शब्द है। “भर जाए” का अर्थ “तृप्त हो जाए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ / MS ϩⲙ̄ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य हैं
  rationale: यूनानी मूल के इस कॉप्टिक शब्द की आशीर्वचनात्मक शैली और गरिमा को बनाए रखता है; ‘सुखी’ या ‘भाग्यशाली’ यहाँ अपेक्षाकृत हल्के पड़ते हैं।
- source_word: ⲇⲓⲱⲕⲉ
  choice: सताया गया
  rationale: विरोधपूर्ण उत्पीड़न का भाव देता है और निष्क्रिय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ϩⲣⲁⲓ ϩⲛⲡⲉⲩϩⲏⲧ
  choice: उनके हृदय में
  rationale: ‘हृदय’ के मूल बिंब को रखता है और ‘उनके’ का संदर्भ जानबूझकर अनिश्चित छोड़ता है।
- source_word: ⲥⲟⲟⲩⲛ ⲡⲉⲓⲱⲧ ϩⲛⲟⲩⲙⲉ
  choice: सचमुच पिता को जाना है
  rationale: ⲥⲟⲟⲩⲛ के पूर्ण अनुभव और ϩⲛⲟⲩⲙⲉ के क्रियाविशेषणात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ⲛⲉⲧϩⲕⲁⲉⲓⲧ
  choice: वे जो भूखे हैं
  rationale: पांडुलिपि के बहुवचन और भूख की व्यक्त अवस्था को सीधे व्यक्त करता है।
- source_word: ⲥⲓⲟ ⲛ̄ⲑϩⲏ
  choice: पेट भर जाए
  rationale: ‘तृप्त हो’ की अपेक्षा पेट के ठोस, देहगत बिंब को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ⲡⲉⲧⲟⲩⲱϣ
  choice: इच्छा रखनेवाला
  rationale: इच्छा के कर्म को मूल पाठ की तरह अनिर्दिष्ट रखता है; किस वस्तु की इच्छा है, यह नहीं जोड़ा गया।
theological_decisions:
- issue: ‘पिता’ की पहचान
  choice: पिता
  alternative: परमपिता / परमेश्वर पिता
  rationale: पाठ में केवल ‘पिता’ है; स्पष्टकारी धार्मिक उपाधि जोड़ना मूल की संक्षिप्तता और खुलापन घटा देता।
- issue: भूख और इच्छा का संबंध
  choice: भूखे लोगों और इच्छा रखनेवाले के पेट के बीच असामान्य संबंध को ज्यों का त्यों रखा गया
  alternative: धार्मिक भूख या धार्मिकता की लालसा के रूप में व्याख्यात्मक अनुवाद
  rationale: मूल पाठ भूख या इच्छा की वस्तु नहीं बताता; किसी आध्यात्मिक अर्थ को जोड़ना वास्तविक तनाव को अनावश्यक रूप से हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सीधी आशीर्वचनात्मक शैली रखी गई है। ‘हृदय’ धार्मिक-साहित्यिक स्वर को बनाए रखता है, जबकि ‘पेट भर जाए’ मूल की ठोस और धरती से जुड़ी अभिव्यक्ति को स्वाभाविक हिन्दी देता है। पांडुलिपि के बहुवचन को प्राथमिकता दी गई है और सर्वनाम-संबंध तथा अंतिम उद्देश्य-वाक्य की असामान्यता को व्याख्या से समतल नहीं किया गया।
