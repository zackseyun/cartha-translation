base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/112.yaml
  text: Jesus said[a], “Woe to the flesh that depends on the soul[c][b]; woe to the soul that depends on the flesh.”
translation:
  language: hi
  text: यीशु ने कहा, “हाय उस देह पर[c], जो आत्मा[b] पर निर्भर है[a]! हाय उस आत्मा पर, जो देह पर निर्भर है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस क्रिया का अनुवाद “टिकी है” या “लटकी है” भी किया जा सकता है; इन विकल्पों में अधिक मूर्त चित्र बना रहता है।
    reason: lexical_alternative
  - marker: b
    text: ⲯⲩⲭⲏ (प्स्यूखे) का अर्थ “जीवन” या “स्व” भी हो सकता है; “आत्मा” यहाँ देह और आत्मा के तीखे विरोध को बनाए रखती है।
    reason: lexical_alternative
  - marker: c
    text: पांडुलिपि में दोनों उपवाक्यों में स्त्रीलिंग संकेतवाचक ⲧⲁⲉⲓ है; संपादित पाठ में इसे ⲡⲁⲓ किया गया है। यहाँ इसका अर्थ केवल “उस/वह, जो” है, इसलिए लिंग-भेद से कथन का आशय नहीं बदलता।
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓ / ⲟⲩⲟⲓ
  choice: हाय … पर
  rationale: यह अभिव्यक्ति चेतावनी और विलाप—दोनों का प्रबल भाव रखती है तथा हिन्दी में भविष्यवाणी-सदृश कथन के लिए स्वाभाविक है।
- source_word: ⲥⲁⲣⲝ
  choice: देह
  rationale: ‘देह’ आधुनिक हिन्दी में व्यक्ति के शारीरिक पक्ष को गरिमापूर्ण और सहज ढंग से व्यक्त करती है। ‘मांस’ अधिक शाब्दिक है, पर सामान्य पाठक के लिए खाने के मांस का अनचाहा अर्थ जगा सकता है।
- source_word: ⲯⲩⲭⲏ
  choice: आत्मा
  rationale: यहाँ ‘आत्मा’ देह के साथ जानबूझकर रखे गए तीखे विरोध को बनाए रखती है। स्रोत शब्द का अर्थ ‘जीवन’ या ‘स्व’ भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ⲉⲧⲉⲣⲉⲉⲓϣⲉ (ⲉⲓϣⲉ)
  choice: निर्भर है
  rationale: यह चुनाव सहारे या आश्रय के संबंध को स्पष्ट, सहज हिन्दी में बताता है, जबकि अधिक मूर्त अर्थ ‘टिकी है’ या ‘लटकी है’ पादटिप्पणी में दिया गया है।
- source_word: ⲡⲁⲓ / manuscript ⲧⲁⲉⲓ
  choice: उस … जो
  rationale: संकेतवाचक और उसके बाद आने वाले संबंधवाचक उपवाक्य को हिन्दी की स्वाभाविक रचना ‘उस … जो’ में व्यक्त किया गया है।
- source_word: preposition ⲛ
  choice: पर
  rationale: ‘हाय … पर’ में यह संबद्ध व्यक्ति या वस्तु को और ‘निर्भर … पर’ में आश्रय के आधार को स्वाभाविक हिन्दी में चिह्नित करती है।
theological_decisions:
- issue: देह और आत्मा के पारस्परिक संबंध का आशय
  choice: दोनों समांतर वाक्यों को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: पहले वाक्य को आत्मा की श्रेष्ठता या दूसरे को देह की अनिवार्यता की स्पष्ट शिक्षा के रूप में समझाकर अनुवाद करना।
  rationale: कथन स्वयं देह और आत्मा—दोनों की परनिर्भरता पर ‘हाय’ कहता है। अनुवाद को इस तनाव को बनाए रखना चाहिए, न कि किसी एक पक्ष को स्वतः श्रेष्ठ घोषित करना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और सूक्ति-सदृश रखी गई है। ‘हाय … पर’ कथन की गंभीर चेतावनी को बनाए रखता है। ‘देह’ और ‘आत्मा’ सामान्य पाठक के लिए बोधगम्य हैं, और समांतर वाक्य-विन्यास मूल की कठोर पारस्परिकता को सुरक्षित रखता है।
