base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
translation:
  language: hi
  text: यीशु ने कहा, “जब तुम जीवित हो, जीवित जन की खोज करो[a][b], ताकि तुम मर न जाओ[c] और फिर उसे देखने के लिए खोजो[d][f], पर देख न सको[e]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खोज करो’ ϭⲱϣⲧ के साथ ⲛⲥⲁ का अनुवाद है; इसे ‘ढूँढ़ो’ या ‘उसके पीछे खोजते रहो’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘जीवित जन’ का शाब्दिक अर्थ है ‘वह जो जीवित है।’ पाठ यह स्पष्ट नहीं करता कि यह किसे सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: ‘ताकि तुम मर न जाओ’ को ‘कहीं ऐसा न हो कि तुम मर जाओ’ भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: यहाँ की क्रिया ϣⲓⲛⲉ का अर्थ ‘खोजना’ या ‘प्रयत्न करना’ हो सकता है; इसलिए भावार्थ ‘उसे देखने का प्रयत्न करो’ भी संभव है।
    reason: lexical_alternative
  - marker: e
    text: ‘सको’ का मूल मुहावरा शाब्दिक रूप से ‘सामर्थी होना’ है और यहाँ देखने की क्षमता बताता है।
    reason: cultural_note
  - marker: f
    text: पांडुलिपि में ‘उसे’ के लिए ⲉⲣⲟϥ है, जबकि सामान्यीकृत पाठ में ⲉⲛⲧⲟϥ दिया गया है; दोनों इसी पुल्लिंग एकवचन कर्म को सूचित करते हैं।
    reason: dialect_note
lexical_decisions:
- source_word: ϭⲱϣⲧ ⲛⲥⲁ
  choice: की खोज करो
  rationale: क्रिया और उसके साथ आए संबंधसूचक पद का अर्थ किसी के पीछे लगकर उसे खोजना है। हिन्दी में ‘की खोज करो’ स्वाभाविक है और खोज के भाव को स्पष्ट रखता है।
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: जीवित जन
  rationale: यह सापेक्ष पदबंध शाब्दिक रूप से ‘वह जो जीवित है’ है। ‘जीवित जन’ इसकी संक्षिप्त, गरिमापूर्ण अभिव्यक्ति है और उस व्यक्ति की पहचान को अनिर्णीत रहने देता है।
- source_word: ϩⲱⲥ ⲉⲣⲉⲛⲧⲱⲧⲛⲱⲛϩ
  choice: जब तक तुम जीवित हो
  rationale: परिस्थितिवाचक खंड यहाँ उपलब्ध जीवनकाल के भीतर खोजने का समय बताता है। ‘जब तक’ हिन्दी में इस तात्कालिक सीमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ϩⲓⲛⲁ ϫⲉ ⲛⲛⲉ…ⲙⲟⲩ
  choice: ताकि तुम मर न जाओ
  rationale: नकारात्मक प्रयोजन-वाक्य को आधुनिक हिन्दी में सहज ढंग से रखा गया है; ‘कहीं ऐसा न हो कि’ भी संभव है।
- source_word: ϣⲓⲛⲉ ⲉⲛⲁⲩ
  choice: उसे देखने की खोज करो
  rationale: ϣⲓⲛⲉ के ‘खोजना/प्रयत्न करना’ दोनों संभव अर्थ हैं। मुख्य पाठ में ‘खोज’ रखकर थोमा में बार-बार आने वाले खोज-विषय से शब्दगत संबंध बचाया गया है, भले ही हिन्दी में वाक्यांश जानबूझकर कुछ असामान्य लगे।
- source_word: ϣϭⲙϭⲟⲙ ⲁⲛ ⲉⲛⲁⲩ
  choice: देख न सको
  rationale: ‘सामर्थ्य पाना’ वाला मुहावरा यहाँ योग्यता या क्षमता का निषेध करता है; संक्षिप्त हिन्दी मूल के अंतिम ‘देखने’ को स्वाभाविक रूप से दोहराती है।
theological_decisions:
- issue: ‘जीवित जन’ की पहचान
  choice: पहचान को अनिर्दिष्ट रखा गया
  alternative: इसे स्पष्ट रूप से परमेश्वर, यीशु या किसी अन्य धार्मिक उपाधि के रूप में पहचानना
  rationale: कॉप्टिक पाठ केवल ‘वह जो जीवित है’ कहता है। किसी निश्चित धर्मवैज्ञानिक पहचान को जोड़ना मूल की अर्थगत खुली जगह को समाप्त कर देता।
- issue: मृत्यु का आशय
  choice: सिर्फ ‘मर जाओ’ रखा गया
  alternative: इसे शारीरिक या आत्मिक मृत्यु के रूप में स्पष्ट करना
  rationale: मूल पाठ मृत्यु के प्रकार को स्पष्ट नहीं करता; अनुवाद में इस तनाव को खुला रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण स्तर रखा गया है। कथन की संक्षिप्त चेतावनी, ‘खोज’ की पुनरावृत्ति और अंतिम असमर्थता का तीखा विरोध सुरक्षित रखा गया है। ‘जीवित जन’ सामान्य बोलचाल से थोड़ा ऊँचा है, पर मूल के भार और अनिर्दिष्ट पहचान दोनों को सँभालता है।
