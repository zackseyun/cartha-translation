base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/029.yaml
  text: Jesus said[1], "If the flesh came into being because of the spirit, it is a wonder; but if the spirit came into being because of the body, it is a wonder of wonders[b][a][3][2]. Yet I myself marvel at how this great wealth has made its home in this poverty."
translation:
  language: hi
  text: यीशु ने कहा, “यदि देह आत्मा के कारण अस्तित्व में आई, तो यह आश्चर्य है; लेकिन यदि आत्मा शरीर के कारण अस्तित्व में आई, तो यह आश्चर्यों का आश्चर्य है। फिर भी मुझे स्वयं इस बात पर आश्चर्य होता है कि इस महान धन ने इस दरिद्रता में कैसे अपना घर बना लिया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में ‘कैसे’ के कॉप्टिक शब्द का अंतिम अक्षर संपादकीय रूप से पुनर्स्थापित किया गया है। यूनानी साक्षी POxy 1 भी अंतिम पद ‘इस दरिद्रता’ की पुष्टि करता है।
    reason: lacuna_or_restoration_and_cross_reference
lexical_decisions:
- source_word: ⲡⲥⲁⲣⲝ
  choice: देह
  rationale: ⲥⲁⲣⲝ को ⲥⲱⲙⲁ से अलग रखते हुए ‘देह’ चुना गया है; इससे मूल के flesh/body भेद को स्वाभाविक हिन्दी में बनाए रखा जाता है।
- source_word: ⲡⲥⲱⲙⲁ
  choice: शरीर
  rationale: दूसरे यूनानी आगंतुक शब्द को ‘शरीर’ देकर पहले पद के ‘देह’ से मूल का शब्दगत भेद सुरक्षित रखा गया है।
- source_word: ϣⲱⲡⲉ
  choice: अस्तित्व में आना
  rationale: यहाँ क्रिया जन्म लेने से अधिक उत्पत्ति या अस्तित्व में आने का बोध देती है; दार्शनिक विरोध को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: ⲉⲧⲃⲉ
  choice: के कारण
  rationale: कारणसूचक अर्थ को दोनों समानांतर शर्तों में एक-सा रखा गया है; ‘के लिए’ कहने से प्रयोजन का अनावश्यक अर्थ आ सकता था।
- source_word: ⲡⲛⲉⲩⲙⲁ
  choice: आत्मा
  rationale: इस कथन के देह–शरीर संबंधी दार्शनिक विरोध में ‘आत्मा’ आधुनिक हिन्दी का सर्वाधिक सहज और गरिमापूर्ण विकल्प है।
- source_word: ⲟⲩϣⲡⲏⲣⲉ / ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ
  choice: आश्चर्य / आश्चर्यों का आश्चर्य
  rationale: दूसरी अभिव्यक्ति अतिशयोक्तिपूर्ण श्रेष्ठता-सूचक रचना है। ‘संतान’ वाला संभावित कोशीय अर्थ इस संदर्भ में उपयुक्त नहीं है।
- source_word: ⲇⲉ
  choice: लेकिन
  rationale: दूसरी शर्त के स्पष्ट विरोधसूचक अव्यय को छोड़ा नहीं गया है।
- source_word: ⲁⲛⲟⲕ ϯⲣϣⲡⲏⲣⲉ
  choice: मुझे स्वयं … आश्चर्य होता है
  rationale: पांडुलिपि में स्वतंत्र सर्वनाम के बाद प्रथम-पुरुष क्रियारूप विषय पर बल देता है; इसे कृत्रिम पुनरुक्ति के बजाय स्वाभाविक हिन्दी बलाघात से व्यक्त किया गया है।
- source_word: ⲡⲉⲓⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: यह महान धन
  rationale: गुणवाचक संबंध को हिन्दी में संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है तथा संकेतवाचकता बनाए रखता है।
- source_word: ⲁⲥⲟⲩⲱϩ
  choice: अपना घर बना लिया है
  rationale: रहने या बसने की पूर्ण हुई क्रिया को जीवंत और सहज हिन्दी में व्यक्त करता है, साथ ही धन के मानवीकरण को बचाता है।
- source_word: ⲡⲉⲓⲙⲛⲧϩⲏⲕⲉ
  choice: यह दरिद्रता
  rationale: ‘धन’ के साथ मूल का तीखा विरोध बनाए रखने के लिए ‘गरीबी’ से अधिक गरिमापूर्ण ‘दरिद्रता’ चुना गया है।
theological_decisions:
- issue: देह, आत्मा और शरीर की उत्पत्ति का संबंध
  choice: दोनों शर्तों को वास्तविक शर्तों की तरह अनिर्णीत रखा गया है
  alternative: किसी एक शर्त को लेखक की स्वीकृत सृष्टि-व्याख्या मानना
  rationale: मूल कथन विरोधी संभावनाएँ रखता है, पर किसी एक को सिद्धांत के रूप में निश्चित नहीं करता; अनुवाद इस तनाव को नहीं सुलझाता।
- issue: ‘महान धन’ और ‘दरिद्रता’ की पहचान
  choice: रूपकों को बिना व्याख्यात्मक पहचान दिए यथावत रखा गया है
  alternative: धन को आत्मा और दरिद्रता को शरीर के रूप में सीधे स्पष्ट करना
  rationale: ऐसी पहचान संदर्भ से सुझाई जा सकती है, पर वाक्य स्वयं उसे स्पष्ट रूप से नहीं कहता; इसलिए अनुवाद में व्याख्या आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देह’ और ‘शरीर’ के द्वारा मूल के दो अलग शब्दों का भेद बचाया गया है। ‘मुझे स्वयं’ पांडुलिपि के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में footnote marker [a] उपस्थित है।
