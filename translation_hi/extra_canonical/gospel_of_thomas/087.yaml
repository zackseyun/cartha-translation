base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
translation:
  language: hi
  text: यीशु ने कहा, “दयनीय है वह शरीर जो किसी शरीर पर निर्भर है,[a] और दयनीय है वह आत्मा जो इन दोनों पर निर्भर है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निर्भर है” का अनुवाद “पर टिका है” या “पर आधारित है” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “इन दोनों” से आशय पहले खंड में निहित दो शरीर हैं—वह शरीर जो निर्भर है और वह शरीर जिस पर वह निर्भर है; शरीर और आत्मा नहीं।
    reason: referent_clarification
lexical_decisions:
- source_word: ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲛ / ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ
  choice: दयनीय
  rationale: यूनानी मूल के इस विशेषण का अर्थ ‘दुर्दशाग्रस्त, अभागा, दयनीय’ है। ‘दयनीय’ तीखे नकारात्मक मूल्यांकन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ⲥⲱⲙⲁ
  choice: शरीर
  rationale: यह यूनानी मूल के शब्द का मानक और प्रसंगानुकूल हिन्दी प्रतिरूप है।
- source_word: ⲉⲓϣⲉ (ⲁϣⲉ) + ⲛ
  choice: पर निर्भर है
  rationale: यह रचना किसी वस्तु पर टिके होने या उसका सहारा लेने का भाव दे सकती है। ‘पर निर्भर है’ संबंध की निरंतरता को व्यक्त करता है, बिना ‘से उत्पन्न है’ का अर्थ थोपे।
- source_word: ⲯⲩⲭⲏ
  choice: प्राण
  rationale: यहाँ यूनानी मूल ψυχή शरीर से अलग जीवित अंतःतत्त्व को सूचित करता है। ‘प्राण’ साधारण हिन्दी में बोधगम्य है और ‘आत्मा’ से जुड़ी संभावित विशिष्ट धर्मवैज्ञानिक धारणाओं को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  choice: इन दोनों
  rationale: संकेतवाचक पद और द्विवचन का सीधा अर्थ सुरक्षित रखा गया है; यह पहले खंड में निहित दो शरीरों की ओर संकेत करता है।
theological_decisions:
- issue: ⲯⲩⲭⲏ का हिन्दी प्रतिरूप
  choice: प्राण
  alternative: आत्मा
  rationale: ‘आत्मा’ सम्भव है, पर वह पाठ में निहित अर्थ से अधिक विकसित धर्मवैज्ञानिक अर्थ सुझा सकता है। ‘प्राण’ शरीर के साथ विरोध को बनाए रखते हुए अर्थ को अपेक्षाकृत खुला रखता है।
- issue: ‘इन दोनों’ का पूर्वसंदर्भ
  choice: पहले खंड के दो शरीर—निर्भर शरीर और वह शरीर जिस पर वह निर्भर है
  alternative: शरीर और प्राण
  rationale: व्याकरण और निकटतम पूर्वसंदर्भ के अनुसार द्विवचन पहले कथन में आए शरीर तथा दूसरे शरीर की जोड़ी की ओर लौटता है; इसे मुख्य पाठ में विस्तार देकर व्याख्यायित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। मूल की पुनरावृत्ति तथा असामान्य विचार-रचना को सरल बनाकर मिटाया नहीं गया। पांडुलिपि में विशेषण के यूनानी पुल्लिंग/नपुंसकलिंग अंत का उतार-चढ़ाव अर्थ को प्रभावित नहीं करता, इसलिए हिन्दी पाठ में अलग टिप्पणी आवश्यक नहीं समझी गई।
