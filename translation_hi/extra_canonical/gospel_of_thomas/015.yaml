base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/015.yaml
  text: Jesus said[a], "When you see the one who was not born from a woman, throw yourselves down upon your faces and worship him[d][c][b]. That one is your Father."
translation:
  language: hi
  text: यीशु ने कहा, “जब तुम उसे देखो जो स्त्री से नहीं जन्मा[a], तो अपने मुँह के बल गिर पड़ो[b] और उसकी आराधना करो। वही[c] तुम्हारा पिता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्त्री से जन्मा” बाइबिल में मनुष्य-जन्म का एक परिचित मुहावरा है (देखें अय्यूब 14:1; मत्ती 11:11); पर यहाँ ऐसे व्यक्ति को “तुम्हारा पिता” कहना थोमा के इस कथन की विशिष्टता है।
    reason: cross_reference
  - marker: b
    text: 'शाब्दिक भाव: “अपने चेहरे के बल अपने-आपको गिरा दो।” इसे अधिक पारंपरिक ढंग से “दण्डवत् हो जाओ” भी कहा जा सकता है; “गिर पड़ो” मूल की तीखी और प्रत्यक्ष अभिव्यक्ति को बनाए रखता है।'
    reason: lexical_alternative
  - marker: c
    text: मूल का दूरसूचक पद केवल “वह” नहीं, बल्कि बल देकर “वही” या “वह व्यक्ति” कहता है।
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले सामान्य कॉप्टिक सूत्र को स्वाभाविक और संक्षिप्त हिन्दी में रखा गया है।
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲛⲁⲩ
  choice: जब तुम ... देखो
  rationale: ϩⲟⲧⲁⲛ और prospective eršan रचना का भाव हिन्दी के ‘जब ... देखो’ में स्वाभाविक रूप से आता है; इससे अनावश्यक निश्चित भविष्यकाल नहीं जोड़ा जाता।
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲡⲉⲛⲧⲟⲟⲩϫⲡⲟⲛⲧⲟϥ ⲉⲃⲟⲗ ϩⲛⲡⲥϩⲓⲙⲉ
  choice: उसे ... जो स्त्री से नहीं जन्मा
  rationale: निश्चित सम्बन्धवाचक ‘उस एक’ को ‘उसे जो’ से और जन्म-संबंधी नकार को सीधे ‘स्त्री से नहीं जन्मा’ से व्यक्त किया गया है। ‘उत्पन्न नहीं हुआ’ की अपेक्षा यह जन्म के प्रसंग को अधिक स्पष्ट रखता है।
- source_word: ⲡⲱϩⲧⲛⲧⲱⲧⲛ ⲉϫⲛⲡⲉⲧⲛϩⲟ
  choice: अपने मुँह के बल गिर पड़ो
  rationale: क्रिया की तीव्र शारीरिक मुद्रा, उसका आत्मवाचक बल और मुख भूमि की ओर करने का भाव वर्तमान, सहज हिन्दी में सुरक्षित है।
- source_word: ⲟⲩⲱϣⲧ ⲛⲁⲛⲧⲟϥ
  choice: उसकी आराधना करो
  rationale: साष्टांग मुद्रा के साथ प्रयुक्त क्रिया धार्मिक उपासना/आराधना दर्शाती है; ‘आराधना’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ
  choice: वही
  rationale: दूरसूचक और बलात्मक अर्थ को संक्षिप्त हिन्दी ‘वही’ से रखा गया है, न कि केवल ‘वह’ से।
- source_word: ⲡⲉⲧⲛⲉⲓⲱⲧ
  choice: तुम्हारा पिता
  rationale: बहुवचन संबोधन के साथ कॉप्टिक में एकवचन ‘पिता’ है; हिन्दी में सामूहिक अर्थ वाला ‘तुम्हारा पिता’ उसी संरचना को बनाए रखता है।
theological_decisions:
- issue: ‘स्त्री से नहीं जन्मा’ व्यक्ति की पहचान
  choice: पाठ के अनुसार उसे केवल ‘तुम्हारा पिता’ कहा गया है
  alternative: इसे किसी विशिष्ट दार्शनिक सत्ता, मसीही उपाधि या परमेश्वर-विषयक व्यवस्थित सिद्धान्त से स्पष्ट करना
  rationale: कथन स्वयं पहचान को रहस्यमय और तनावपूर्ण रखता है; अनुवाद स्रोत से आगे जाकर उसका सम्प्रदायगत अर्थ निर्धारित नहीं करता।
- issue: आराधना का अर्थ
  choice: ‘आराधना करो’
  alternative: केवल ‘सम्मान करो’ या ‘प्रणाम करो’
  rationale: ⲟⲩⲱϣⲧ और उसके पहले की दण्डवत् मुद्रा साधारण सम्मान से अधिक प्रबल धार्मिक अभिप्राय रखती है, पर अनुवाद यह नहीं बताता कि उस आराधना की व्यवस्थित धर्मवैज्ञानिक व्याख्या क्या हो।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। ‘मुँह के बल गिर पड़ो’ सामान्य पाठक के लिए स्वाभाविक है और कॉप्टिक के बहुवचन स्वामित्व के साथ एकवचन शारीरिक अंग वाली वितरणात्मक रचना को हिन्दी में बिना कृत्रिमता के व्यक्त करता है। सर्वनाम ‘तुम’ मूल के बहुवचन संबोधन को बनाए रखता है।
