base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/049.yaml
  text: Jesus said[a], "Blessed are the solitary and chosen, for you will find the kingdom. For you are from it[b][c], and you will go there again."
translation:
  language: hi
  text: यीशु ने कहा, “धन्य हैं वे जो एकाकी[a] और चुने हुए हैं, क्योंकि तुम राज्य को पाओगे[b]। क्योंकि तुम उसी में से हो[c], और फिर वहीं जाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ कॉप्टिक में यूनानी से लिया गया शब्द ⲙⲟⲛⲁⲭⲟⲥ (मोनाखोस) है। इसका अर्थ ‘अकेला’, ‘एक’ या ‘अविभाजित’ हो सकता है; यहाँ बाद के संस्थागत अर्थ वाला ‘भिक्षु/संन्यासी’ आवश्यक नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इस पांडुलिपि में ‘पाना’ क्रिया के बाद सामान्य साहिदिक ⲉ के स्थान पर ⲁ आया है; यह इसकी क्षेत्रीय बोली की विशेषता है और अर्थ को नहीं बदलता।
    reason: dialect_note
  - marker: c
    text: 'शाब्दिक रूप से: ‘तुम उसमें से हो’ या ‘तुम उससे निकले हुए हो।’'
    reason: register_note
lexical_decisions:
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: एकाकी
  rationale: यह यूनानी मूल का शब्द यहाँ संस्थागत अर्थ में ‘भिक्षु’ या ‘संन्यासी’ नहीं, बल्कि अकेले, एक अथवा अविभाजित होने का भाव रखता है। ‘एकाकी’ मूल की अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: ⲥⲱⲧⲡ
  choice: चुने हुए
  rationale: पांडुलिपि का रूप निष्क्रिय/स्थितिवाचक और बहुवचन है; इसलिए ‘जिन्होंने चुना है’ के बजाय ‘चुने हुए’ उचित है।
- source_word: ϩⲉ
  choice: पाओगे
  rationale: यहाँ क्रिया का सामान्य अर्थ ‘पाना/खोजना’ है। भविष्यकालीन द्वितीय पुरुष बहुवचन को स्वाभाविक हिन्दी में ‘पाओगे’ कहा गया है।
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: राज्य
  rationale: यह ‘राज्य’, ‘राजत्व’ या ‘शासन’ का भाव दे सकता है; इस कथन की पारंपरिक और प्रसंगानुकूल अभिव्यक्ति के रूप में ‘राज्य’ रखा गया है।
- source_word: ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧⲛⲧⲟⲥ
  choice: तुम उसी से आए हो
  rationale: शाब्दिक भाव ‘तुम उसमें से हो’ है। ‘उसी से आए हो’ हिन्दी में उद्गम का भाव स्पष्ट करता है और अगले वाक्य के वहाँ फिर जाने से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: ⲙⲟⲛⲁⲭⲟⲥ का आशय
  choice: एकाकी
  alternative: संन्यासी; अकेले; एक/अविभाजित जन
  rationale: ‘संन्यासी’ बाद की संस्थागत धारणा को पाठ में ला सकता है। ‘एकाकी’ बाहरी अकेलेपन और भीतरी अखंडता—दोनों संभावनाओं को खुला रखता है; टिप्पणी इस अर्थ-परास को बताती है।
- issue: वचन और वाच्य
  choice: धन्य हैं वे जो एकाकी और चुने हुए हैं
  alternative: धन्य है वह एकाकी जिसने चुना है
  rationale: मूल पांडुलिपि बहुवचन है और ⲥⲱⲧⲡ यहाँ निष्क्रिय/स्थितिवाचक है। अनुवाद इस व्याकरण को बनाए रखता है।
- issue: राज्य से उद्गम और वहाँ पुनः जाना
  choice: तुम उसी से आए हो, और फिर वहीं जाओगे
  alternative: तुम उसी में से हो, और फिर वहाँ जाओगे
  rationale: पाठ के उद्गम और पुनर्गमन के कथन को बिना किसी विशेष दार्शनिक या सांप्रदायिक व्याख्या में बदलने के रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल में ‘धन्य हैं वे...’ से ‘तुम...’ की ओर जो पुरुष-परिवर्तन है, उसे जानबूझकर सुरक्षित रखा गया है। ‘एकाकी’ की संभावित आध्यात्मिक अर्थच्छाया को मुख्य पाठ में निर्णायक रूप से नहीं खोला गया; पादटिप्पणी अर्थ-परास बताती है।
