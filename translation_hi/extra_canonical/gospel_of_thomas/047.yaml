base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
translation:
  language: hi
  text: यीशु ने कहा, “कोई व्यक्ति दो घोड़ों पर सवार होकर दो धनुष नहीं खींच सकता। और कोई दास दो स्वामियों की सेवा नहीं कर सकता; नहीं तो वह एक का आदर करेगा और दूसरे का अपमान करेगा। कोई व्यक्ति पुरानी दाखमधु पीकर उसी घड़ी नई दाखमधु पीने की इच्छा नहीं करता। और लोग नई दाखमधु पुरानी मशकों में नहीं डालते, कहीं वे फट न जाएँ। न वे पुरानी दाखमधु नई मशक में डालते हैं, कहीं वह उसे बरबाद न कर दे। वे पुराना पैबंद उत्सव के वस्त्र पर नहीं लगाते[a], क्योंकि तब चीर पड़ जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कॉप्टिक पद का शाब्दिक अर्थ “उत्सव का वस्त्र” है। यहाँ थोमा का रूप समानान्तर सुसमाचारों से भिन्न है: पुराने पैबंद को उत्सव के वस्त्र पर लगाया जा रहा है।'
    reason: स्रोत की विशिष्ट शब्दावली और समानान्तर परम्परा से अंतर स्पष्ट करना।
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ
  choice: नहीं कर सकता
  rationale: कॉप्टिक पदबंध का अर्थ ‘सामर्थ्य नहीं है/असम्भव है’; हिन्दी में प्रसंगानुकूल और सहज रूप ‘नहीं कर सकता’ है।
- source_word: ϫⲱⲗⲕ
  choice: खींचना
  rationale: धनुष के साथ यह क्रिया धनुष की डोरी खींचने के अर्थ में है।
- source_word: ⲏⲣⲡ
  choice: दाखमधु
  rationale: यह ‘मदिरा/वाइन’ है; ‘दाखमधु’ बाइबलीय संदर्भ में स्पष्ट, प्रतिष्ठित और सामान्य पाठकों के लिए बोधगम्य है।
- source_word: ⲁⲥⲕⲟⲥ
  choice: मशक
  rationale: यूनानी आगंतुक शब्द का अर्थ चमड़े की दाखमधु रखने वाली थैली है; हिन्दी का पारंपरिक और संक्षिप्त समतुल्य ‘मशक’ है।
- source_word: ϣⲧⲏⲛ ⲛϣⲁⲓ
  choice: उत्सव का वस्त्र
  rationale: शाब्दिक अर्थ ‘उत्सव का वस्त्र’ है; इसे केवल ‘नया वस्त्र’ करने से स्रोत की विशिष्ट अभिव्यक्ति मिट जाती।
- source_word: ⲧⲁⲕⲟ
  choice: बरबाद कर देना
  rationale: क्रिया का अर्थ नष्ट, खराब या बरबाद करना है; मशक के संदर्भ में ‘बरबाद कर दे’ स्वाभाविक है।
- source_word: ⲡⲱϩ
  choice: फटना / चीर पड़ना
  rationale: यह फटने या चिरने को व्यक्त करता है; मशकों के लिए ‘फट जाएँ’ और वस्त्र के लिए ‘चीर पड़ जाएगी’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: समानान्तर सुसमाचारों के अनुरूप सामंजस्य
  choice: थोमा के पाठ में पुरानी दाखमधु को नई मशक में डालने और पुराने पैबंद को उत्सव के वस्त्र पर लगाने की उलटी संरचनाएँ ज्यों की त्यों रखी गईं।
  alternative: पाठ को मत्ती/मरकुस/लूका के परिचित रूप—नई दाखमधु नई मशकों में और नया पैबंद पुराने वस्त्र पर—के अनुसार बदलना।
  rationale: दिए गए कॉप्टिक पाठ की विशिष्टता को किसी समानान्तर परम्परा से चुपचाप बदलना स्रोत-साक्ष्य के विरुद्ध होगा और कथन की वास्तविक तनावपूर्ण संरचना मिटा देगा।
- issue: दो स्वामियों के प्रति प्रतिक्रिया
  choice: ‘एक का आदर करेगा और दूसरे का अपमान’
  alternative: ‘एक से प्रेम और दूसरे से बैर’ अथवा अन्य कैनोनिकल समानान्तर शब्दावली
  rationale: कॉप्टिक में यूनानी मूल के शब्द सम्मान और अपमान के अर्थ देते हैं; परिचित कैनोनिकल शब्दावली आयात नहीं की गई।
