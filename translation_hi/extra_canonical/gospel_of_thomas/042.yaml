- source_word: ⲡⲉϫⲉ ⲓⲏⲥⲟⲩⲥ
  choice: यीशु ने कहा
  rationale: यह मानक कथन-परिचय है; सरल हिन्दी रूप मूल की सूत्रबद्ध संरचना को सुरक्षित रखता है।
