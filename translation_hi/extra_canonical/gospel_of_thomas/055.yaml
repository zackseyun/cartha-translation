base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/055.yaml
  text: Jesus said, "Whoever does not hate his father and his mother cannot be my disciple; and whoever does not hate his brothers and his sisters, and does not carry his cross as I do, will not be worthy of me."[a][b][c]
translation:
  language: hi
  text: यीशु ने कहा, “जो अपने पिता और माता से घृणा नहीं करता, वह मेरा शिष्य नहीं बन सकता। और जो अपने भाइयों और बहनों से घृणा नहीं करता[a] और मेरी तरह अपना क्रूस नहीं उठाता,[b] वह मेरे योग्य नहीं होगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुद्रित पांडुलिपि में “उसके भाई … और उसकी बहनें” (ⲥⲛⲏⲩ … ⲥⲱⲛⲉ) है। डिली के सामान्यीकृत शब्द-विश्लेषण में “उसका पुत्र … उसकी पुत्री” सूचीबद्ध है। यहाँ पांडुलिपि-पाठ का अनुसरण किया गया है।
    reason: textual_variant
  - marker: b
    text: कॉप्टिक ⲛⲡⲁϩⲉ का अर्थ “मेरे ढंग/मेरी रीति से” है। इस कथन में “पीछे चलना” की स्पष्ट क्रिया नहीं है।
    reason: dialect_note
  - marker: c
    text: संबंधित विषयों के लिए लूका 14:26–27 और मत्ती 10:37–38 देखें; फिर भी थोमा के इस कथन की शब्दावली अलग है।
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  choice: घृणा करना
  rationale: सहिदिक में यह प्रबल क्रिया है। इसे ‘कम प्रेम करना’ कहकर नरम करने के बजाय मूल कथन की तीक्ष्णता बनाए रखी गई है।
- source_word: ϣⲣⲙⲁⲑⲏⲧⲏⲥ
  choice: शिष्य बन सकना
  rationale: पहले वाक्य में संभाव्यता/सामर्थ्य सूचक ϣ- है; इसलिए केवल भविष्यकाल के बजाय ‘नहीं बन सकता’ मूल का भेद सुरक्षित रखता है।
- source_word: ⲉⲓⲱⲧ / ⲙⲁⲁⲩ
  choice: पिता / माता
  rationale: सामान्य पारिवारिक संबोधन; शाब्दिक और स्वाभाविक अनुवाद।
- source_word: ⲥⲛⲏⲩ / ⲥⲱⲛⲉ
  choice: भाइयों / बहनों
  rationale: मुद्रित पांडुलिपि-पाठ में पुरुष और स्त्री सहोदरों की समानांतर जोड़ी है; हिंदी में बहुवचन संबंधरूप स्वाभाविक है।
- source_word: ϥⲓ
  choice: उठाना
  rationale: क्रूस के साथ यह ‘उठाना/वहन करना’ व्यक्त करता है। ‘उठाता’ सरल हिंदी है और प्रसंग में भार उठाने का अर्थ बनाए रखता है।
- source_word: ⲥⲧⲁⲩⲣⲟⲥ
  choice: क्रूस
  rationale: यह यूनानी से लिया गया शब्द है जिसका मानक अर्थ ‘क्रूस’ है।
- source_word: ϩⲉ (ⲛⲡⲁϩⲉ)
  choice: मेरी तरह
  rationale: इस पदबंध का अर्थ ‘मेरे ढंग/रीति से’ है। ‘मेरी तरह’ आधुनिक हिंदी में स्वाभाविक है और मूल में अनुपस्थित स्पष्ट ‘मेरे पीछे चलना’ नहीं जोड़ता।
- source_word: ⲉⲓⲣⲉ ⲛⲁⲝⲓⲟⲥ
  choice: योग्य होना
  rationale: कॉप्टिक मुहावरा किसी अवस्था या गुण को व्यक्त करता है; ‘मेरे योग्य’ संक्षिप्त और अर्थ-संगत है।
- source_word: ⲡⲉⲧⲉⲣⲉ…
  choice: जो
  rationale: अनिश्चित संबंधवाचक कथन को हिंदी की स्वाभाविक लोकोक्तिपरक रचना ‘जो … वह’ से व्यक्त किया गया है।
theological_decisions:
- issue: परिवार से ‘घृणा’ करने की तीक्ष्ण भाषा
  choice: ‘घृणा नहीं करता’ को यथावत रखा गया
  alternative: ‘कम प्रेम नहीं करता’ या ‘त्याग नहीं देता’
  rationale: मूल क्रिया स्पष्ट रूप से प्रबल है। संभावित आलंकारिक या तुलनात्मक आशय को अनुवाद में पूर्वनिर्धारित नहीं किया गया।
- issue: क्रूस उठाने का संबंध यीशु से
  choice: ‘मेरी तरह अपना क्रूस’
  alternative: ‘मेरे पीछे अपना क्रूस’
  rationale: कॉप्टिक पाठ में ‘पीछे चलना’ की स्पष्ट क्रिया नहीं है; समान रीति या ढंग का संबंध सुरक्षित रखा गया है।
- issue: पहली और अंतिम निषेधात्मक उक्तियों का भेद
  choice: पहले ‘नहीं बन सकता’, अंत में ‘योग्य नहीं होगा’
  alternative: दोनों जगह साधारण भविष्यकाल
  rationale: पहले खंड की सामर्थ्य-सूचक रचना और अंतिम खंड की भावी अवस्था के बीच स्रोत-पाठ का व्याकरणिक अंतर बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘घृणा’, ‘शिष्य’, ‘क्रूस’ और ‘योग्य’ जैसे परिचित धार्मिक शब्द मूल की संक्षिप्त और चुनौतीपूर्ण शैली बनाए रखते हैं। वाक्य को दो भागों में बाँटकर हिंदी की पठनीयता सुधारी गई है, जबकि समानांतर संरचना सुरक्षित है।
