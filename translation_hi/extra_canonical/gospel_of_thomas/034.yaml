base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/034.yaml
  text: Jesus said, “If a blind person leads a blind person, both of them fall down into a pit.”
translation:
  language: hi
  text: यीशु ने कहा, “यदि एक अंधा व्यक्ति दूसरे अंधे व्यक्ति की अगुवाई करे, तो दोनों नीचे एक गड्ढे में गिरते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲃⲗⲗⲉ
  choice: अंधा व्यक्ति
  rationale: कॉप्टिक संज्ञा सामान्य रूप से दृष्टिहीन व्यक्ति को सूचित करती है; ‘अंधा व्यक्ति’ लिंग-विशेष जोड़े बिना अर्थ स्पष्ट रखता है।
- source_word: ⲥⲱⲕ ϩⲏⲧϥ
  choice: अगुवाई करे
  rationale: शाब्दिक भाव ‘अपने आगे खींचे’ है, पर यह किसी को आगे ले चलने या मार्ग दिखाने का कॉप्टिक मुहावरा है।
- source_word: ϣⲁⲣⲉⲛⲧⲟⲟⲩϩⲉ
  choice: दोनों … गिरते हैं
  rationale: यह सामान्य या सार्वकालिक परिणाम व्यक्त करने वाला रूप है; हिन्दी का सामान्य वर्तमान इस लोकोक्तिपरक भाव को बनाए रखता है।
- source_word: ⲉⲡⲉⲥⲏⲧ
  choice: नीचे
  rationale: यह क्रिया-विशेषणीय पद है और गिरने की दिशा स्पष्ट करता है।
- source_word: ⲉⲟⲩϩⲓⲉⲓⲧ
  choice: एक गड्ढे में
  rationale: अनिश्चित उपपद ⲟⲩ के कारण ‘एक’ रखा गया है; ϩⲓⲉⲓⲧ का अर्थ गड्ढा, खाई या कुआँ हो सकता है, और यहाँ ‘गड्ढा’ स्वाभाविक है।
theological_decisions: []
