  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली। सामान्य वर्तमान ‘गिरते हैं’ स्रोत के आदतन/सार्वकालिक भाव को सुरक्षित रखता है; इसे भविष्यकाल में नहीं बदला गया।
