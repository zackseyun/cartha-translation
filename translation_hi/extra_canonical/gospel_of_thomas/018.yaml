base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/018.yaml
  text: The disciples said to Jesus[a], “Tell us how our end will be.” He said, “Have you found the beginning, then, that you are seeking the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand in the beginning; he will know the end[d][c][b], and he will not taste death.”
translation:
  language: hi
  text: शिष्य ने यीशु से कहा, “हमें बताइए, हमारा अंत कैसा होगा?” उन्होंने कहा, “तो क्या तुमने आरम्भ पा लिया है कि तुम अंत की खोज कर रहे हो?[a] क्योंकि जिस स्थान पर आरम्भ है, वहीं अंत होगा।[b] धन्य है वह जो आरम्भ में उसके सामने खड़ा होगा;[c] वह अंत को जानेगा और मृत्यु का स्वाद नहीं चखेगा।”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तो क्या तुमने आरम्भ पा लिया है कि तुम अंत की खोज कर रहे हो?” में कॉप्टिक कण-समूह ⲁⲛⲧⲱⲧⲛ … ⲅⲁⲣ प्रश्न को तीखा, आलंकारिक स्वर देता है। ‘तो’ इस स्वर को व्यक्त करता है; इसका भाव “क्या तुमने आरम्भ पा लिया है, कि अंत खोज रहे हो?” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल में स्पष्ट रूप से “जिस स्थान पर आरम्भ है, वहीं अंत होगा” कहा गया है; स्पष्ट स्थानवाचक संरचना को अनुवाद में बनाए रखा गया है।
    reason: source_structure
  - marker: c
    text: '“उसके सामने” का शाब्दिक संकेत किसकी ओर है, यह निश्चित नहीं है: यह ‘आरम्भ’ की ओर लौट सकता है या किसी निहित ‘प्रथम/आदि’ की उपस्थिति का संकेत हो सकता है।'
    reason: textual_ambiguity
  - marker: d
    text: “मृत्यु का स्वाद चखना” मृत्यु का अनुभव करने के लिए प्रयुक्त कॉप्टिक मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: हमें बताइए
  rationale: प्रत्यक्ष अनुरोध के रूप में प्रयुक्त ‘हमसे कहो’ का स्वाभाविक और आदरपूर्ण आधुनिक हिन्दी रूप।
- source_word: ⲡϩⲁⲏ
  choice: अंत
  rationale: यहाँ अर्थ ‘अंत/समाप्ति’ है और इसका स्पष्ट विरोध ⲡⲁⲣⲭⲏ से है; ‘लक्ष्य’ चुनने से अनावश्यक व्याख्या जुड़ती।
- source_word: ⲡⲁⲣⲭⲏ
  choice: आरम्भ
  rationale: यूनानी ἀρχή से आया शब्द ‘आरम्भ/मूल’ दोनों अर्थ दे सकता है। ‘आरम्भ’ अंत के साथ मूल पाठ की सममिति बनाए रखता है।
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: पा लिया
  rationale: क्रिया का अर्थ ‘पाना/खोज निकालना’ है। ‘पा लिया’ संक्षिप्त है और अगले ‘खोज’ से अनावश्यक शब्द-पुनरावृत्ति टालता है।
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ ⲡϩⲁⲏ
  choice: अंत की खोज कर रहे हो
  rationale: ‘अंत को ढूँढ़ना/उसकी खोज करना’ का स्वाभाविक हिन्दी रूप, जो क्रिया की सक्रिय खोज को बनाए रखता है।
- source_word: ϩⲛ ⲡⲙⲁ ⲉⲧⲉⲣⲉ … ⲙⲙⲁⲩ
  choice: जिस स्थान में … वहीं …
  rationale: स्रोत के स्पष्ट स्थानवाचक ‘उस स्थान में जहाँ … वहाँ …’ को सहज हिन्दी में बनाए रखा गया है।
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य
  rationale: ग्रीक μακάριος से आए इस शब्द के लिए ‘धन्य’ गरिमापूर्ण और परिचित धार्मिक हिन्दी है; ‘भाग्यशाली’ अर्थ को अधिक लौकिक बना देता।
- source_word: ⲁⲱϩⲉ / ϩⲱϩⲉ ⲉⲣⲁⲧϥ
  choice: उसके सामने खड़ा होगा
  rationale: ‘खड़ा होना’ क्रिया और ⲉⲣⲁⲧϥ के तृतीय पुरुष एकवचन संकेत—‘उसके सामने/उसकी उपस्थिति में’—दोनों को रखा गया है।
- source_word: ⲥⲟⲟⲩⲛ
  choice: जानेगा
  rationale: मूल की संक्षिप्त ‘जानना’ क्रिया को बिना ‘समझना’ या ‘पहचानना’ द्वारा अर्थ सीमित किए रखा गया है।
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: मृत्यु का स्वाद नहीं चखेगा
  rationale: मृत्यु का अनुभव करने के लिए स्रोत में प्रयुक्त सजीव मुहावरे को हिन्दी में लगभग समान मुहावरे से सुरक्षित रखा गया है।
theological_decisions:
- issue: ⲉⲣⲁⲧϥ में ‘उसके’ का संदर्भ
  choice: मुख्य पाठ में ‘उसके सामने’ रखकर संदर्भ खुला छोड़ा गया
  alternative: ‘आरम्भ में खड़ा होगा’ अथवा ‘आदि के सामने खड़ा होगा’
  rationale: पुल्लिंग एकवचन प्रत्यय ‘आरम्भ’ की ओर लौट सकता है या किसी निहित प्रथम/आदि-सत्ता की ओर संकेत कर सकता है। किसी एक पहचान को निश्चित कर देना स्रोत की वास्तविक अस्पष्टता मिटा देता।
- issue: ‘अंत’ का आशय
  choice: सर्वत्र ‘अंत’
  alternative: ‘लक्ष्य’, ‘परिपूर्णता’ या ‘जगत का अंत’
  rationale: पाठ यह निश्चित नहीं करता कि अंत व्यक्तिगत मृत्यु, जगत की समाप्ति, लक्ष्य या पूर्णता है। सामान्य शब्द मूल की खुली धार्मिक तथा अस्तित्वगत अर्थवत्ता बचाता है।
- issue: ‘मृत्यु का स्वाद नहीं चखेगा’
  choice: मूल मुहावरा ज्यों का त्यों रखा गया
  alternative: ‘मृत्यु का अनुभव नहीं करेगा’
  rationale: कथन की प्रकृति—शारीरिक मृत्यु से बचना, आत्मिक मृत्यु, या अन्य अर्थ—की व्याख्या किए बिना मूल की तनावपूर्ण भाषा सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। यीशु के लिए आदरसूचक बहुवचन (“उन्होंने”) और शिष्यों को संबोधित करते समय स्रोत के द्वितीय पुरुष बहुवचन के अनुरूप “तुम” रखा गया है। ‘आरम्भ–अंत’, ‘जानना’ और ‘मृत्यु का स्वाद चखना’ जैसे प्रमुख सूत्र जानबूझकर संक्षिप्त रखे गए हैं, ताकि कथन की काव्यात्मक सममिति और धार्मिक अस्पष्टता बनी रहे।
