base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/039.yaml
  text: Jesus said[a], “The Pharisees and the scribes have received the keys of knowledge; they have hidden them. They did not enter, and they did not allow those who wished to enter[e][d][c][b]. But you—become prudent like serpents and innocent like doves.”
translation:
  language: hi
  text: यीशु ने कहा, “फरीसियों और शास्त्रियों ने ज्ञान की कुंजियाँ ले ली हैं[a] और उन्हें छिपा दिया है। वे स्वयं भीतर नहीं गए, और जो भीतर जाना चाहते थे, उन्हें भी उन्होंने भीतर जाने नहीं दिया।[b] पर तुम साँपों के समान समझदार और कबूतरों के समान निष्कपट बनो।[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ज्ञान की कुंजियाँ प्राप्त कर ली हैं।” कॉप्टिक क्रिया का अर्थ “लेना” और “प्राप्त करना” दोनों हो सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: 'तुलना करें: लूका 11:52; मत्ती 23:13। इन समानांतर कथनों में ज्ञान की कुंजी लेने और दूसरों का प्रवेश रोकने की निकटवर्ती विषय-वस्तु मिलती है।'
    reason: cross_reference
  - marker: c
    text: 'तुलना करें: मत्ती 10:16। मूल कॉप्टिक पांडुलिपि यहाँ “साँपों” और “कबूतरों” को बहुवचन में रखती है।'
    reason: cross_reference_and_textual_clarification
lexical_decisions:
- source_word: ⲡⲫⲁⲣⲓⲥⲁⲓⲟⲥ ⲙⲛ̄ⲛⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ
  choice: फरीसियों और शास्त्रियों
  rationale: कॉप्टिक में पहला पद सामूहिक एकवचन और दूसरा पांडुलिपि-पाठ में बहुवचन है; हिन्दी में दोनों समूहों को बहुवचन में रखना स्वाभाविक है। ‘शास्त्री’ उस समय के यहूदी लेखन और धार्मिक व्यवस्था के विशेषज्ञों के लिए प्रचलित, परिचित पद है।
- source_word: ⲁⲩϫⲓ
  choice: ले ली हैं
  rationale: ϫⲓ का अर्थ ‘लेना’ या ‘प्राप्त करना’ दोनों हो सकता है। आगे कुंजियों को छिपाने और प्रवेश रोकने का प्रसंग होने के कारण ‘ले ली हैं’ सहज है, जबकि पादटिप्पणी में ‘प्राप्त कर ली हैं’ की संभावना सुरक्षित रखी गई है।
- source_word: ϣⲁϣⲧ ⲛ̄ⲧⲅⲛⲱⲥⲓⲥ
  choice: ज्ञान की कुंजियाँ
  rationale: पांडुलिपि में ‘कुंजियाँ’ बहुवचन है। ⲅⲛⲱⲥⲓⲥ को किसी बाद की तकनीकी धार्मिक धारणा के रूप में न लेकर सामान्य अर्थ ‘ज्ञान’ दिया गया है।
- source_word: ⲁⲩϩⲟⲡⲟⲩ
  choice: उन्हें छिपा दिया है
  rationale: क्रिया का मूल अर्थ ‘छिपाना/गुप्त रखना’ है और बहुवचन सर्वनाम का संबंध कुंजियों से है।
- source_word: ⲙ̄ⲡⲟⲩⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: वे स्वयं भीतर नहीं गए
  rationale: ‘भीतर जाना’ स्रोत के गति-वाचक पदबंध को सीधे व्यक्त करता है; ‘स्वयं’ हिन्दी में अगले विरोध—दूसरों को भी रोकना—को स्पष्ट करता है, बिना कोई नया आशय जोड़े।
- source_word: ⲛⲉⲧⲟⲩⲱϣ ⲉⲃⲱⲕ ⲉϩⲟⲩⲛ ⲙ̄ⲡⲟⲩⲕⲁⲁⲩ
  choice: जो भीतर जाना चाहते थे, उन्हें भी उन्होंने भीतर जाने नहीं दिया
  rationale: यह हिन्दी में स्वाभाविक रूप से इच्छा और अनुमति-निषेध दोनों को बनाए रखता है।
- source_word: ϣⲱⲡⲉ
  choice: बनो
  rationale: क्रिया का भाव ‘हो जाना/बनना’ है; आज्ञार्थक ‘बनो’ साधारण ‘रहो’ या ‘हो’ से अधिक सटीक है।
- source_word: ⲫⲣⲟⲛⲓⲙⲟⲥ
  choice: समझदार
  rationale: यूनानी मूल के इस पद में विवेकशीलता और व्यावहारिक सूझ का भाव है। ‘समझदार’ आधुनिक हिन्दी में सहज है और ‘चतुर’ से उत्पन्न संभावित छलपूर्ण अर्थ से बचता है।
- source_word: ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: निष्कपट
  rationale: इसमें अमिश्रित, शुद्ध और छलरहित होने का अर्थ-क्षेत्र है। ‘निष्कपट’ साँपों की समझदारी के साथ नैतिक संतुलन को व्यक्त करता है।
- source_word: ⲛ̄ⲑⲉ ⲛ̄ⲛϩⲟϥ … ⲛ̄ⲑⲉ ⲛ̄ⲛ̄ϭⲣⲟⲙⲡⲉ
  choice: साँपों के समान … कबूतरों के समान
  rationale: मूल पांडुलिपि में दोनों पशु-संज्ञाएँ बहुवचन हैं; इसलिए दोषपूर्ण एकवचन सामान्यीकरण के बजाय पांडुलिपि के बहुवचन का अनुसरण किया गया है।
theological_decisions:
- issue: ‘ज्ञान’ को तकनीकी ‘ग्नोसिस’ के रूप में समझना
  choice: सामान्य हिन्दी पद ‘ज्ञान’
  alternative: ‘ग्नोसिस’ या ‘रहस्य-ज्ञान’
  rationale: स्रोत का यूनानी आगत शब्द अपने सामान्य अर्थ में भी प्रयुक्त हो सकता है। इस कथन में उसे किसी बाद की धर्मवैचारिक प्रणाली का तकनीकी पद मानना आवश्यक नहीं है।
- issue: भीतर प्रवेश करने का लक्ष्य
  choice: स्रोत की तरह लक्ष्य को अनिर्दिष्ट रखा गया
  alternative: ‘परमेश्वर के राज्य में’ या ‘ज्ञान में’ जोड़ना
  rationale: कथन यह नहीं बताता कि प्रवेश किसमें है। समानांतर परंपराएँ संभावित पृष्ठभूमि देती हैं, पर मुख्य पाठ में लक्ष्य जोड़ना वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की संक्षिप्त, चेतावनीपूर्ण शैली सुरक्षित है। ‘कुंजियाँ’, ‘शास्त्री’ और ‘निष्कपट’ जैसे पद बाइबलीय परिवेश की गरिमा बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं।
