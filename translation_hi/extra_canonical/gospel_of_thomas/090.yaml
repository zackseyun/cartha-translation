  source_fidelity: 'The draft accurately represents the Coptic: the plural invitation, “yoke,” χρηστός as “good,” the abstract noun for lordship, the future promise of rest, and the explicitly beneficiary-oriented “for yourselves” are all retained. The lexical footnotes appropriately distinguish χρηστός from χριστός and preserve the manuscript’s minor orthographic issue in ἀνάπαυσις.'
  naturalness: ‘प्रभुता’ is intelligible but comparatively uncommon and slightly awkward in modern standard Hindi in this predicative construction. ‘प्रभुत्व’ is the more standard abstract noun for ‘lordship’ and maintains the intended social-authoritative nuance. ‘मृदु’ is a more natural formal predicate than ‘कोमल’ for this abstract quality.
  terminology: ‘जूआ,’ ‘विश्राम,’ and ‘अपने लिए’ are suitable and source-sensitive. ‘प्रभुत्व’ improves the rendering of ⲙⲛⲧϫⲟⲉⲓⲥ without narrowing it to merely administrative शासन.
  issues:
  - severity: low
    issue: ‘प्रभुता’ is less idiomatic than ‘प्रभुत्व’ in contemporary formal Hindi.
    rationale: The Coptic abstract noun denotes lordship/mastery. ‘प्रभुत्व’ is the established modern Hindi abstract term and reads more naturally while preserving the source sense.
  - severity: low
    issue: ‘कोमल’ is somewhat less idiomatic as a predicate of ‘प्रभुता/प्रभुत्व.’
    rationale: ‘मृदु’ directly conveys the source’s mild/gentle quality in a formal, idiomatic Hindi construction.
