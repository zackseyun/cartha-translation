base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/090.yaml
  text: Jesus said[a], “Come to me; for my yoke is good, and my lordship is gentle[c][b]; and you will find rest for yourselves.”
translation:
  language: hi
  text: यीशु ने कहा, “मेरे पास आओ, क्योंकि मेरा जूआ अच्छा[a] है और मेरा प्रभुत्व मृदु है; और तुम अपने लिए विश्राम[b] पाओगे।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ शब्द ⲭⲣⲏⲥⲧⲟⲥ है, जो यूनानी χρηστός (‘अच्छा/सुखद/दयालु’) से आया है; यह ⲭⲣⲓⲥⲧⲟⲥ (‘मसीह’) नहीं है। इसलिए इसे किसी उपाधि के रूप में नहीं, ‘अच्छा’ अनूदित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘विश्राम’ यूनानी आगत शब्द ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (ἀνάπαυσις) का अनुवाद है। हस्तलिखित पाठ में अप्सिलॉन की वर्तनी को लेकर मामूली अनिश्चितता है, पर शब्द की पहचान सुनिश्चित है।
    reason: lacuna_or_restoration
  - marker: c
    text: 'मत्ती 11:28–30 से तुलना करें। पर थॉमस की अभिव्यक्ति भिन्न है: यहाँ ‘मेरा प्रभुत्व मृदु है’ और ‘अपने लिए’ कहा गया है, न कि ‘अपने प्राणों के लिए’।'
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲓⲛⲧⲱⲧⲛ ϣⲁⲁⲛⲟⲕ
  choice: मेरे पास आओ
  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थक और लक्ष्यसूचक पद को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘आओ’ बहुवचन को भी स्पष्ट रखता है।
- source_word: ⲟⲩⲭⲣⲏⲥⲧⲟⲥ
  choice: अच्छा
  rationale: यह यूनानी χρηστός से आया शब्द है, जिसका अर्थ ‘अच्छा/सुखद/दयालु’ है; वर्तनी χριστός (‘मसीह’) से भिन्न है। ‘अच्छा’ मूल अर्थ को व्यापक और सहज रूप में सुरक्षित रखता है।
- source_word: ⲛⲁϩⲃ
  choice: जूआ
  rationale: कृषि और रूपक—दोनों संदर्भों में प्रचलित और सटीक हिन्दी पद।
- source_word: ⲙⲛⲧϫⲟⲉⲓⲥ
  choice: प्रभुता
  rationale: यह ‘प्रभु/स्वामी होने’ का भाववाचक संज्ञा-पद है। ‘प्रभुता’ उस अमूर्त अर्थ को ‘शासन’ की अपेक्षा अधिक निकटता से बनाए रखता है।
- source_word: ⲟⲩⲣⲙⲣⲁϣ
  choice: कोमल
  rationale: मूल में प्रभुता के गुण को ‘नरम/मृदु/कोमल’ बताया गया है; ‘कोमल’ आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य है।
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ
  choice: तुम ... पाओगे
  rationale: द्वितीय पुरुष बहुवचन भविष्यकाल और ‘पाना/खोजना’ क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: विश्राम
  rationale: यूनानी आगत ἀνάπαυσις का सीधा और पारदर्शी हिन्दी समकक्ष।
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  choice: अपने लिए
  rationale: लाभसूचक दत्तिव और बहुवचन सर्वनाम के आत्मसंबंधी बल को स्पष्ट रखता है।
theological_decisions:
- issue: ⲙⲛⲧϫⲟⲉⲓⲥ का अर्थ
  choice: प्रभुता
  alternative: शासन
  rationale: मूल भाववाचक रूप ‘प्रभु/स्वामी होने’ की अवस्था या अधिकार को व्यक्त करता है। ‘प्रभुता’ इस तनाव को सुरक्षित रखती है और पाठ को केवल प्रशासनिक शासन तक सीमित नहीं करती।
- issue: मत्ती 11:28–30 से समानता
  choice: थॉमस के विशिष्ट शब्दों को स्वतंत्र रूप से अनूदित किया गया
  alternative: मत्ती की परिचित शब्दावली के अनुरूप अनुवाद
  rationale: समानता के बावजूद यहाँ ‘मेरी प्रभुता कोमल है’ और ‘अपने लिए’ है; इसलिए मत्ती के पाठ से भिन्नता को मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘जूआ’, ‘प्रभुता’ और ‘विश्राम’ मूल की रूपकात्मक तथा धार्मिक गूँज को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
