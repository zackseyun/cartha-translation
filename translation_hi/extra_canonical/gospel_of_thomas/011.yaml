base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/011.yaml
  text: Jesus said[1], “This heaven will pass away, and the one above it will pass away. And the dead are not alive, and the living will not die. On the days when you ate what is dead, you made it alive. When you come to be in the light, what will you do? On the day when you were one, you became two. But when you become two[5][4][3][2], what will you do?”
translation:
  language: hi
  text: यीशु ने कहा, “यह आकाश[a] मिट जाएगा, और जो इसके ऊपर है वह भी मिट जाएगा। मरे हुए जीवित नहीं हैं, और जो जीवित हैं वे नहीं मरेंगे। उन दिनों जब तुम जो मृत था उसे खाते थे, तुमने उसे जीवित कर दिया[b]। जब तुम प्रकाश में आ जाओगे, तब तुम क्या करोगे[c]? जिस दिन तुम एक थे, तुम दो हो गए[d]। पर जब तुम दो हो जाओगे, तब तुम क्या करोगे[e]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आकाश” का अनुवाद “स्वर्ग” भी हो सकता है। इसके बाद “जो इसके ऊपर है” आने से कई स्तरों वाले ब्रह्मांड की छवि सामने आती है।
    reason: lexical_alternative
  - marker: b
    text: “उसे जीवित कर दिया” में “उसे” संभवतः उसी के प्रति संकेत करता है जो मृत था और जिसे खाया गया था। कॉप्टिक रचना का शाब्दिक भाव है, “उसे जीवित बनाया।”
    reason: lexical_alternative
  - marker: c
    text: कॉप्टिक में “करोगे” के साथ एक कर्म-सर्वनाम भी है। वह “प्रकाश” या पहले कही गई जीवित वस्तु की ओर संकेत कर सकता है, अथवा केवल व्याकरणिक हो सकता है; इसलिए उसे मुख्य पाठ में स्पष्ट नहीं किया गया।
    reason: lexical_alternative
  - marker: d
    text: “तुम एक थे” का कॉप्टिक मुहावरा “तुम एक बने” या “तुमने एक बनाया” भी समझा जा सकता है। अगले भूतकालीन कथन के कारण यहाँ भूतकाल रखा गया है।
    reason: alternative_reading
  - marker: e
    text: अंतिम प्रश्न में पांडुलिपि पहले प्रश्न वाली सामान्य ‘करना’ क्रिया के बजाय ऐसा रूप रखती है जिसका अर्थ “लेना” या “उसके साथ करना” भी हो सकता है। संदर्भ में प्रश्न की पुनरावृत्ति दिखाई देती है, पर शब्द-रूप का अंतर वास्तविक है।
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲓⲡⲉ
  choice: यह आकाशलोक
  rationale: ⲡⲉ का अर्थ ‘आकाश/स्वर्ग’ हो सकता है। अगले वाक्यांश में इसके ऊपर एक और स्तर होने से ‘आकाशलोक’ स्थानगत और ब्रह्मांडीय दोनों भाव रखता है, बिना इसे परमेश्वर के निवास के रूप में सीमित किए।
- source_word: ⲛⲁⲣⲡⲁⲣⲁⲅⲉ
  choice: मिट जाएगा
  rationale: यूनानी मूल के इस क्रियापद का अर्थ ‘बीत जाना/चले जाना’ है। इस ब्रह्मांडीय संदर्भ में ‘मिट जाना’ स्वाभाविक हिन्दी है और अस्तित्वगत समाप्ति का गंभीर भाव देता है।
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ … ⲥⲉⲟⲛϩ ⲁⲛ
  choice: मरे हुए जीवित नहीं हैं
  rationale: मूल के संक्षिप्त, विरोधाभासी कथन को बिना व्याख्या जोड़े सीधे रखा गया है।
- source_word: ⲛⲉⲧⲟⲛϩ ⲥⲉⲛⲁⲙⲟⲩ ⲁⲛ
  choice: जीवित लोग नहीं मरेंगे
  rationale: भविष्यकालीन निषेध को स्पष्ट रखा गया और पिछले उपवाक्य के साथ समानांतरता बनाए रखी गई।
- source_word: ⲡⲉⲧⲙⲟⲟⲩⲧ
  choice: मरी हुई वस्तु
  rationale: यह निर्जीव या मृत भोजन को सूचित करने वाला शीर्षरहित संबंधवाचक पद है; ‘वस्तु’ किसी विशिष्ट जीव या व्यक्ति का अर्थ थोपने से बचाता है।
- source_word: ⲉⲓⲣⲉ ⲙ̄ⲙⲟϥ ⲙ̄ⲡⲉⲧⲟⲛϩ
  choice: तुमने उसे जीवित कर दिया
  rationale: ⲉⲓⲣⲉ ⲛ- के कारक प्रयोग को ‘जीवित कर दिया’ से व्यक्त किया गया है; सर्वनाम का संभावित पूर्वपद ‘मरी हुई वस्तु’ है।
- source_word: ϩⲙ̄ⲡⲟⲩⲟⲉⲓⲛ
  choice: प्रकाश में
  rationale: ‘प्रकाश’ मूल शब्द का सामान्य अर्थ है और प्रतीकात्मक अर्थ को खुला रखता है।
- source_word: ⲟⲩ ⲡⲉⲧⲉⲧⲛⲁⲁϥ
  choice: तुम क्या करोगे?
  rationale: कॉप्टिक में कर्मवाचक सर्वनाम है, पर उसका संदर्भ अनिश्चित है; हिन्दी में उसे प्रकट न करके मूल की पहेलीनुमा अस्पष्टता रखी गई है।
- source_word: ⲉⲧⲉⲧⲛ̄ⲟ ⲛ̄ⲟⲩⲁ
  choice: तुम एक थे
  rationale: यह मुहावरा ‘एक होना’ या ‘एक बनना’ दोनों दे सकता है। इसके बाद के भूतकाल ‘तुम दो हो गए’ के अनुरूप भूतकाल चुना गया है।
- source_word: ⲁⲧⲉⲧⲛ̄ⲉⲓⲣⲉ ⲙ̄ⲡⲥⲛⲁⲩ
  choice: तुम दो हो गए
  rationale: क्रिया और संख्या की संरचना को अस्तित्वगत परिवर्तन के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘प्रकाश’ का आशय
  choice: प्रकाश
  alternative: दिव्य प्रकाश / ज्ञान
  rationale: पाठ स्वयं प्रकाश की पहचान नहीं बताता; किसी विशिष्ट रहस्यवादी, सृष्टितात्त्विक या उद्धार-संबंधी अर्थ को अनुवाद में नहीं जोड़ा गया।
