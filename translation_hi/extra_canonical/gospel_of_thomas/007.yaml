base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/007.yaml
  text: Jesus said[a], “Blessed is this lion which the human will eat, so that the lion becomes human; and accursed is this human whom the lion will eat[d][c][b], and the lion will become human.”
translation:
  language: hi
  text: यीशु ने कहा, “यह सिंह धन्य[a] है, जिसे मनुष्य[b] खाएगा, जिससे सिंह मनुष्य बन जाए[c]; और यह मनुष्य घृणित[d] है, जिसे सिंह खाएगा, और सिंह मनुष्य बन जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “धन्य” का अनुवाद “सुखी” या “भाग्यवान” भी हो सकता है; मूल में यूनानी से लिया गया शब्द है, जिसका धार्मिक और आशीर्वचनात्मक रंग है।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य” के लिए मूल शब्द सामान्य रूप से किसी मानव व्यक्ति को दर्शाता है; यह केवल पुरुष के लिए प्रयुक्त शब्द नहीं है।
    reason: lexical_clarification
  - marker: c
    text: 'पहले स्थान पर मूल भाषा का संयोजक रूप परिणाम या पिछले कथन से घनिष्ठ क्रम व्यक्त कर सकता है: “जिससे सिंह मनुष्य बन जाए” या “और सिंह मनुष्य बन जाए।” दूसरे स्थान पर स्वतंत्र भविष्यकाल है: “सिंह मनुष्य बन जाएगा।”'
    reason: grammatical_ambiguity
  - marker: d
    text: मूल शब्द का अर्थ “घृणित,” “जुगुप्सित” या अधिक तीव्र रूप में “शापित” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य
  rationale: यह यूनानी मूल के धार्मिक और आशीर्वचनात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है; “सुखी” या “भाग्यवान” भी संभव हैं, पर उनका पवित्र-भाषिक रंग कम है।
- source_word: ⲡⲙⲟⲩⲓ / ⲡⲙⲟⲩⲉⲓ
  choice: सिंह
  rationale: स्रोत शब्द का सामान्य और निर्विवाद अर्थ; वर्तनी-भेद अर्थ नहीं बदलता।
- source_word: ⲡⲁⲓ
  choice: यह
  rationale: संज्ञा के बाद आए संकेतवाचक की बलाघातपूर्ण देइक्तिकता को सुरक्षित रखता है।
- source_word: ⲡⲣⲱⲙⲉ
  choice: मनुष्य
  rationale: यहाँ शब्द किसी भी मानव व्यक्ति के लिए सामान्य अर्थ में है; हिन्दी “मनुष्य” लिंग-विशेष का अनावश्यक संकेत नहीं देता।
- source_word: ⲛⲁⲟⲩⲱⲙⲛⲧⲟϥ
  choice: खाएगा
  rationale: ⲛⲁ- भविष्य को व्यक्त करता है और प्रत्यय पूर्वोक्त कर्म की ओर लौटता है; हिन्दी सापेक्ष वाक्य में कर्म “जिसे” से स्पष्ट है।
- source_word: ϣⲱⲡⲉ ⲛ/ⲣ ⲣⲱⲙⲉ
  choice: मनुष्य बन जाए / मनुष्य बन जाएगा
  rationale: दोनों स्थानों पर ‘मानव बनना’ सुरक्षित है, जबकि पहले संयोजक आश्रित रूप और दूसरे स्वतंत्र भविष्यकाल का अन्तर हिन्दी क्रियारूपों में रखा गया है।
- source_word: ⲃⲱⲧⲉ / ϥⲃⲏⲧ
  choice: घृणित
  rationale: शब्द का मूल भाव घृणा या जुगुप्सा का पात्र होना है। “शापित” संभव है, पर वह स्रोत से अधिक स्पष्ट शाप-संबंधी अर्थ जोड़ सकता है।
- source_word: ⲛϭⲓ
  choice: प्रत्यक्ष अनूदित नहीं
  rationale: विषय-सूचक कण का बल हिन्दी में “यह मनुष्य” की वाक्य-स्थिति और संरचना से व्यक्त होता है।
theological_decisions:
- issue: सिंह और मनुष्य के रूपांतरण का प्रतीकात्मक अर्थ
  choice: अनिर्णीत रखा गया; कथन को उसके विरोधाभासी रूप में प्रस्तुत किया गया है
  alternative: सिंह को देह, वासना, बुराई या आध्यात्मिक शक्ति का निश्चित प्रतीक मानना
  rationale: स्रोत स्वयं प्रतीक की व्याख्या नहीं करता; किसी एक धार्मिक या दार्शनिक अर्थ को पाठ में जोड़ना उचित नहीं होगा।
- issue: ⲃⲱⲧⲉ का धार्मिक बल
  choice: घृणित
  alternative: शापित / धिक्कार है
  rationale: “घृणित” स्रोत के abhorrent/detestable भाव को सीधे रखता है और बिना पर्याप्त आधार के औपचारिक दैवी शाप का अर्थ निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथन की जानबूझकर चौंकाने वाली समानांतर रचना और ‘सिंह मनुष्य बने’ की अस्पष्टता को सरल व्याख्या में नहीं बदला गया। पहले रूपांतरण के आश्रित/परिणामसूचक रूप तथा दूसरे के स्वतंत्र भविष्यकाल के बीच अन्तर बनाए रखने के लिए “बन जाए” और “बन जाएगा” प्रयुक्त हैं।
