  source_fidelity: The draft accurately preserves the dialogue, the declarative reading of the negative present, the completed change-of-state sense of ⲁⲧⲉⲧⲛ̄ϣⲱⲡⲉ, the explicit comparison with ‘the Jews,’ and the unresolved tree/fruit image. The source’s coordination between the two parallel clauses is retained by ‘और,’ while no adversative conjunction is inserted within either love/hate pair.
  naturalness: The phrase ‘जो बातें मैं तुमसे कहता हूँ, उनसे तुम नहीं जानते’ is syntactically awkward in modern Hindi and can momentarily suggest that the sayings themselves are unknown. ‘मैं जो बातें तुमसे कहता हूँ, उनके आधार पर तुम नहीं जानते’ naturally conveys the source’s sense that the listeners fail to recognize the speaker from his sayings.
  terminology: ‘शिष्य,’ ‘यहूदी,’ ‘पेड़,’ ‘फल,’ ‘प्रेम,’ and ‘घृणा’ are accurate, modern, and appropriately dignified. The group designation is retained without either softening or adding an unsupported limitation.
  issues:
  - severity: low
    issue: Awkward causal/inferential phrasing in Jesus’s reply
