base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
translation:
  language: hi
  text: 'उसके शिष्यों ने उससे कहा, “तुम कौन हो, जो हमसे ये बातें कहते हो?”


    “मैं जो बातें तुमसे कहता हूँ, उनके आधार पर तुम नहीं जानते कि मैं कौन हूँ।[a] पर तुम यहूदियों जैसे हो गए हो: वे पेड़ से प्रेम करते हैं, उसके फल से घृणा करते हैं; और वे फल से प्रेम करते हैं, पेड़ से घृणा करते हैं।[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक का नकारात्मक वर्तमान रूप कथन—“तुम नहीं जानते”—या आलंकारिक प्रश्न—“क्या तुम नहीं जानते?”—दोनों रूपों में समझा जा सकता है।
    reason: स्रोत की वाक्यगत अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: कॉप्टिक में “प्रेम करते हैं” और “घृणा करते हैं” के बीच कोई विरोधसूचक संयोजक नहीं है; दोनों क्रियाएँ सीधे साथ रखी गई हैं, जिससे विरोध अधिक तीखा होता है।
    reason: स्रोत की असंयोजक शैली और उसके प्रभाव को स्पष्ट करना।
lexical_decisions:
- source_word: ⲉⲓⲙⲉ
  choice: जानना
  rationale: क्रिया का अर्थ ‘जानना’ या ‘समझना’ हो सकता है। यहाँ पहचान—‘मैं कौन हूँ’—के संदर्भ में ‘जानना’ अधिक स्वाभाविक और सटीक है।
- source_word: ϣⲱⲡⲉ
  choice: हो जाना
  rationale: पूर्णकालिक रूप अवस्था में परिवर्तन व्यक्त करता है; इसलिए ‘हो गए हो’ चुना गया, केवल ‘हो’ नहीं।
- source_word: ϣⲏⲛ
  choice: पेड़
  rationale: यह सामान्य कॉप्टिक शब्द ‘पेड़’ के लिए है और फल के साथ रूपकात्मक विरोध को स्पष्ट रखता है।
- source_word: ⲙⲉ
  choice: प्रेम करना
  rationale: यहाँ इसका सीधा विरोध ⲙⲟⲥⲧⲉ (‘घृणा करना’) से है; ‘पसंद करना’ इस तीव्र विरोध को कमजोर कर देता।
- source_word: ⲙⲟⲥⲧⲉ
  choice: घृणा करना
  rationale: स्रोत में यह प्रबल विरोधी क्रिया है; ‘नापसंद करना’ अपेक्षाकृत हल्का होता।
- source_word: ⲓⲟⲩⲇⲁⲓⲟⲥ
  choice: यहूदी
  rationale: स्रोत में समूह का स्पष्ट नाम है। अनुवाद उसे न तो सामान्यीकृत करता है, न ‘अगुए’ जैसी असमर्थित सीमा जोड़ता है।
theological_decisions:
- issue: यीशु के उत्तर में कथन या आलंकारिक प्रश्न
  choice: 'कथन: ‘तुम नहीं जानते कि मैं कौन हूँ’'
  alternative: 'आलंकारिक प्रश्न: ‘क्या तुम नहीं जानते कि मैं कौन हूँ?’'
  rationale: नकारात्मक वर्तमान रूप दोनों प्रकार समझा जा सकता है, पर कथन कॉप्टिक वाक्य-विन्यास से सीधा मेल खाता है और अगले विरोधसूचक वाक्य में सहज रूप से जाता है। अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ‘यहूदियों’ के साथ तुलना
  choice: स्रोत की स्पष्ट समूह-संज्ञा को ज्यों का त्यों रखते हुए केवल शिष्यों से की गई तुलना के रूप में अनुवाद
  alternative: ‘यहूदी अगुओं’ या ‘कुछ यहूदियों’ जैसा सीमित रूप
  rationale: स्रोत ऐसी सीमा नहीं देता। अनुवाद को न तो कथन का विस्तार कर सार्वकालिक आरोप बनाना चाहिए, न पाठ में अनुपस्थित योग्यता जोड़नी चाहिए।
- issue: पेड़ और फल के रूपक की व्याख्या
  choice: रूपक को बिना किसी धर्मवैज्ञानिक पहचान के खुला रखना
  alternative: पेड़ या फल को यीशु, उनकी शिक्षा, व्यवस्था, अथवा किसी समुदाय से स्पष्ट रूप से जोड़ना
  rationale: स्रोत स्वयं रूपक के तत्वों की पहचान नहीं करता; किसी एक व्याख्या को मुख्य पाठ में जोड़ना वास्तविक अर्थगत तनाव को अनुचित रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण संवाद रखा गया है। ‘तुम’ बहुवचन शिष्यों को संबोधित करता है और मूल की प्रत्यक्षता बनाए रखता है। पेड़ और फल वाले वाक्यों में ‘लेकिन’ न जोड़कर स्रोत की तीखी, समानांतर संरचना सुरक्षित रखी गई है।
