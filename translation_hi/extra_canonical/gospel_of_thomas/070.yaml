review_pass:
  verdict: revise
  source_fidelity: मसौदा प्रत्यक्ष पांडुलिपि-पाठ को सामान्यीकृत स्रोत-पाठ के विरुद्ध प्राथमिकता देकर दूसरे वाक्य में ‘दरिद्रता’ को हटा देता है। दिए गए समीक्षाधीन सामान्यीकृत कॉप्टिक पाठ में ⲙⲛⲧⲁⲁⲛⲟⲛ स्पष्टतः ‘दरिद्रता’ है; अतः उसे मुख्य पाठ में बनाए रखना आवश्यक है। मसौदे का अंतिम वाक्य भी स्रोत की रचना ‘यह—जो तुम्हारे पास/भीतर नहीं है—तुम्हें मार डालेगा’ को बदलकर एक शर्तवाचक वाक्य बना देता है।
  naturalness: ‘उसे सामने लाओगे जो तुम्हारे भीतर है’ समझ में आता है, पर आधुनिक हिन्दी में ‘जो तुम्हारे भीतर है, उसे प्रकट करोगे’ अधिक स्वाभाविक है। संशोधित पाठ मूल की संक्षिप्त, विरोधात्मक शैली और अनिर्दिष्ट संदर्भ को बनाए रखता है।
  terminology: ‘बचाएगा’ और ‘मार डालेगा’ उपयुक्त तीखा विरोध बनाए रखते हैं। ⲙⲛⲧⲁⲁⲛⲟⲛ के लिए ‘दरिद्रता’ स्रोत और अंग्रेज़ी POB दोनों के अधिक निकट है। ‘प्रकट करोगे’ ‘सामने लाओगे’ का स्वाभाविक आधुनिक विकल्प है और किसी धार्मिक वस्तु की पहचान आरोपित नहीं करता।
  issues:
  - severity: high
    issue: दूसरे वाक्य में ‘दरिद्रता’ हटाई गई है।
    rationale: समीक्षा का प्राथमिक आधार दिया गया सामान्यीकृत स्रोत-पाठ है, जिसमें ⲙⲛⲧⲁⲁⲛⲟⲛ ‘दरिद्रता’ है। पांडुलिपि और सामान्यीकरण के बीच संभावित पाठ-संबंधी समस्या को नोट में बताया जा सकता है, किंतु मुख्य पाठ को बिना आलोचनात्मक वैकल्पिक पाठ स्थापित किए नहीं बदला जाना चाहिए।
  - severity: high
    issue: अंतिम वाक्य की वाक्य-संरचना और संकेतवाचक विषय बदल गया है।
