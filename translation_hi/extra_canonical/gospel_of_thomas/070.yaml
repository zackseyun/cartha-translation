base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/070.yaml
  text: Jesus said, “When you bring it forth within yourselves, this—what you have—will save you; otherwise, poverty is in you. This—what you do not have within yourselves, inside—will kill you.”
translation:
  language: hi
  text: यीशु ने कहा, “जब तुम उसे सामने लाओगे जो तुम्हारे भीतर है[a], तो जो तुम्हारे पास है, वह तुम्हें बचाएगा[b]। यदि वह तुम्हारे भीतर नहीं है[c], तो जो तुम्हारे अंतरतम में नहीं है, वही तुम्हें मार डालेगा[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “जब तुम उसे उत्पन्न करोगे/जन्म दोगे जो तुम्हारे भीतर है।” क्रिया में किसी भीतरी वस्तु को अस्तित्व या प्रकट रूप में लाने का भाव है।'
    reason: lexical_alternative
  - marker: b
    text: “बचाएगा” का अनुवाद “छुड़ाएगा” भी हो सकता है; “मार डालेगा” के साथ विरोध के कारण यहाँ “बचाएगा” रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: यह अनुवाद पांडुलिपि के पाठ ⲙⲛ̄ⲧⲛ̄ ⲡⲏ ϩⲛ̄ⲧ[ⲏ]ⲩⲧⲛ̄, अर्थात् “यदि तुम्हारे भीतर वह नहीं है,” का अनुसरण करता है। दिए गए सामान्यीकृत पाठ में इसी स्थान पर ऐसा रूप है जिसे “दरिद्रता” समझा गया है, पर वह प्रत्यक्ष पांडुलिपि-पाठ से मेल नहीं खाता।
    reason: alternative_reading
  - marker: d
    text: पांडुलिपि की अंतिम पंक्ति क्षतिग्रस्त है, पर बहाल किया गया क्रियारूप “मार डालेगा” अर्थ की दृष्टि से विश्वसनीय है।
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲉⲧⲉⲧⲛ̄ϣⲁϫⲡⲉ ⲡⲏ ϩⲛ̄ⲧⲏⲩⲧⲛ̄
  choice: तुम उसे सामने लाओगे जो तुम्हारे भीतर है
  rationale: पांडुलिपि में क्रिया ϣⲁϫⲡⲉ/ϫⲡⲟ का भाव उत्पन्न करने, जन्म देने या प्रकट रूप में लाने का है, और ⲡⲏ ϩⲛ̄ⲧⲏⲩⲧⲛ̄ उसका कर्म है—‘वह जो तुम्हारे भीतर है’। ‘सामने लाना’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रखते हुए उसकी व्याख्या निर्धारित नहीं करता।
- source_word: ⲧⲟⲩϫⲉ
  choice: बचाएगा
  rationale: इस क्रिया का अर्थ बचाना या छुड़ाना है; आगे आने वाले ‘मार डालेगा’ के स्पष्ट विरोध के कारण ‘बचाएगा’ उपयुक्त है।
- source_word: ⲙⲛ̄ⲧⲛ̄ ⲡⲏ ϩⲛ̄ⲧⲏⲩⲧⲛ̄
  choice: यदि वह तुम्हारे भीतर नहीं है
  rationale: 'प्रत्यक्ष पांडुलिपि-पाठ में नकारात्मक स्वामित्व-रचना है: ‘यदि तुम्हारे पास वह भीतर नहीं है’। हिन्दी में इसे स्वाभाविक रूप से ‘यदि वह तुम्हारे भीतर नहीं है’ कहा गया है।'
- source_word: ϩⲛ̄ⲧⲏⲛⲉ
  choice: अंतरतम में
  rationale: यह शब्द भीतर के भाग या आंतरिक स्थान पर बल देता है। ‘अंतरतम में’ पहले आए ‘भीतर’ की पुनरावृत्ति को अर्थपूर्ण ढंग से बनाए रखता है।
- source_word: ⲙⲟⲩⲟⲩⲧ
  choice: मार डालेगा
  rationale: यह ‘मरना’ की कारक क्रिया है। ‘मार डालेगा’ कथन के तीखेपन और ‘बचाएगा’ के साथ उसके विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: भीतर स्थित वस्तु या सत्य की पहचान
  choice: ‘वह’ और ‘जो’ जैसे अनिर्दिष्ट पदों को बनाए रखा गया है
  alternative: इसे ‘प्रकाश’, ‘ज्ञान’, ‘राज्य’ या किसी अन्य निश्चित आध्यात्मिक वस्तु के रूप में पहचानना
  rationale: कॉप्टिक पाठ संदर्भित वस्तु की स्पष्ट पहचान नहीं करता; किसी खास धार्मिक व्याख्या को मुख्य पाठ में जोड़ना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: दूसरे वाक्य का पाठ
  choice: पांडुलिपि के ⲙⲛ̄ⲧⲛ̄ ⲡⲏ को ‘यदि वह तुम्हारे भीतर नहीं है’ माना गया है
  alternative: दिए गए सामान्यीकृत पाठ और अंग्रेज़ी परामर्श-पाठ के अनुसार ‘नहीं तो तुम्हारे भीतर दरिद्रता है’
  rationale: NHAM02.45 की पंक्ति 32 में प्रत्यक्ष रूप से ⲙⲛ̄ⲧⲛ̄ ⲡⲏ ϩⲛ̄ⲧ[ⲏ]ⲩⲧⲛ̄ पढ़ा जाता है, जो ‘तुम्हारे भीतर वह नहीं है/तुम्हारे पास वह भीतर नहीं है’ का अर्थ देता है। इसलिए पांडुलिपि-साक्ष्य को सामान्यीकृत रूप की असंगति पर प्राथमिकता दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वचन की संक्षिप्त, विरोधात्मक बनावट—‘बचाएगा/मार डालेगा’ और ‘भीतर/अंतरतम’—सुरक्षित है। अस्पष्ट संदर्भ को स्पष्ट करने के लिए कोई संप्रदायगत या दार्शनिक पद नहीं जोड़ा गया।
