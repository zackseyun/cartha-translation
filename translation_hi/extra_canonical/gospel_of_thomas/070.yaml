    rationale: पाठ-संबंधी असंगति हो तो उसे निष्पक्ष रूप से दर्ज किया जाना चाहिए; अंग्रेज़ी POB के ‘otherwise’ और स्रोत के ‘poverty’ को हटाने का आधार नहीं बनना चाहिए।
