base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/095.yaml
  text: Jesus said[a], “If you have money, do not lend at interest; rather[f][e][d][c][b], give it to the one from whom you will not take it back.”
translation:
  language: hi
  text: यीशु ने कहा[a], “यदि तुम्हारे पास धन हो, तो उसे ब्याज पर उधार मत देना[b]; बल्कि उसे उस व्यक्ति को दे दो[c], जिससे तुम उसे वापस नहीं लोगे[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में आरम्भ के शब्द “यीशु ने कहा” कुछ क्षतिग्रस्त हैं और पाठ-संदर्भ के आधार पर पुनर्स्थापित किए गए हैं।
    reason: lacuna_or_restoration
  - marker: b
    text: कॉप्टिक शब्द ⲙⲏⲥⲉ का अर्थ ‘ब्याज’ या प्राचीन अर्थ में ‘सूद’ है; यहाँ इसका आशय ब्याज पर धन उधार देने से है, केवल अत्यधिक ब्याज से नहीं।
    reason: cultural_note
  - marker: c
    text: इस स्थान पर पांडुलिपि आंशिक रूप से क्षतिग्रस्त है। इसे “उसे दे दो” अथवा “उस व्यक्ति को दे दो” पढ़ा जा सकता है; अगले उपवाक्य से मूल आशय स्पष्ट रहता है।
    reason: textual_variant
  - marker: d
    text: इस उपवाक्य का एक सम्भव अनुवाद है, “जो उसे तुम्हें वापस नहीं देगा।” यहाँ अपनाया गया पाठ है, “जिससे तुम उसे वापस नहीं लोगे।” कॉप्टिक में धन के लिए बहुवचन सर्वनाम है, सम्भवतः सिक्कों को ध्यान में रखकर।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉϣⲱⲡⲉ
  choice: यदि … हो
  rationale: यह सामान्य, संभावित शर्त प्रस्तुत करता है; ‘जब’ की अपेक्षा ‘यदि’ कॉप्टिक की शर्तात्मकता को अधिक स्पष्ट रखता है।
- source_word: ⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛ ϩⲟⲙⲧ
  choice: तुम्हारे पास धन हो
  rationale: कॉप्टिक का अस्तित्ववाचक स्वामित्व-प्रयोग स्वाभाविक हिन्दी में ‘पास होना’ से व्यक्त होता है।
- source_word: ϩⲟⲙⲧ
  choice: धन
  rationale: यह शब्द ताँबे के सिक्के अथवा सामान्यतः धन का बोध करा सकता है; यहाँ सामान्य आर्थिक संदर्भ में ‘धन’ सहज और पर्याप्त व्यापक है।
- source_word: ⲙⲡⲣϯ ⲉⲡⲙⲏⲥⲉ
  choice: उसे ब्याज पर मत देना
  rationale: शाब्दिक ‘ब्याज की ओर मत दो’ आर्थिक मुहावरे के रूप में ब्याज पर धन देने को दर्शाता है। हिन्दी में यह अभिव्यक्ति स्रोत के ‘देना’ को भी बनाए रखती है और अर्थ को भी स्पष्ट करती है।
- source_word: ϯ ⲛⲛⲧⲟϥ
  choice: उसे ऐसे व्यक्ति को दे दो
  rationale: पाठ का सामान्यीकृत रूप ‘उसे/उस व्यक्ति को दो’ की ओर संकेत करता है और अगला संबंधवाचक उपवाक्य उस व्यक्ति की पहचान बताता है। ‘उसे’ धन को स्वाभाविक हिन्दी में फिर ग्रहण करता है।
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϫⲓⲛⲧⲟⲟⲩ ⲁⲛ ⲛⲧⲛⲛⲧⲟϥ
  choice: जिससे तुम उसे वापस नहीं लोगे
  rationale: भविष्यकालीन ‘लेना’, निषेध और स्रोत-सूचक वाक्यांश का सबसे स्वाभाविक पाठ यही है। कॉप्टिक में कर्म बहुवचन है, संभवतः सिक्कों को ध्यान में रखकर; हिन्दी में ‘धन’ के साथ एकवचन ‘उसे’ स्वाभाविक है।
theological_decisions:
- issue: ब्याज पर देने और वापस न लेने के बीच विरोध
  choice: पहले ब्याज पर धन न देने और फिर उसे ऐसे व्यक्ति को दे देने की स्पष्ट तुलना रखी गई है जिससे वापसी नहीं ली जाएगी।
  alternative: इसे केवल ‘बिना ब्याज ऋण दो’ के रूप में समझाना।
  rationale: दूसरी आज्ञा में सामान्य ‘दो’ है और संबंधवाचक उपवाक्य धन वापस न लेने की बात कहता है। इसे केवल ब्याजरहित ऋण बना देना पाठ के तनाव और दान-सदृश अर्थ को अनावश्यक रूप से सीमित कर देगा।
- issue: आर्थिक आज्ञा का सिद्धान्तीकरण
  choice: कथन को उसके संक्षिप्त आज्ञात्मक रूप में रहने दिया गया है।
  alternative: इसमें सभी प्रकार के ऋण, ब्याज या दान पर विस्तृत धार्मिक नियम जोड़ना।
  rationale: स्रोत ऐसा व्यवस्थित सिद्धान्त प्रस्तुत नहीं करता; अनुवाद को किसी सम्प्रदायगत आर्थिक मत का आयात नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञात्मक रूप अपनाया गया है। ‘धन’, ‘ब्याज’ और ‘वापस लेना’ सामान्य पाठक के लिए सहज हैं। एकवचन ‘उसे’ हिन्दी में ‘धन’ के साथ स्वाभाविक है, जबकि स्रोत का सम्भावित सिक्का-केंद्रित बहुवचन पाद-टिप्पणी में सुरक्षित रखा गया है।
