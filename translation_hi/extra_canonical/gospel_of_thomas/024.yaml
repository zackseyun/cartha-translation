base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/024.yaml
  text: His disciples said[1], "Show us the place where you are, for it is necessary for us to seek it." He said to them, "Whoever has ears, let him hear.[1] There is light within a man of light,[2] and he lights the whole world.[3] When he does not shine[a][e][4][3][2], there is darkness."[4]
translation:
  language: hi
  text: उनके शिष्यों ने कहा, “हमें वह स्थान दिखाइए जहाँ आप हैं, क्योंकि हमारे लिए उसे खोजना आवश्यक है।” उन्होंने उनसे कहा, “जिसके कान हों, वह सुने। प्रकाश के मनुष्य के भीतर प्रकाश है[a], और वह सारे संसार को प्रकाशित करता है[b]। जब वह प्रकाश नहीं देता, तब अंधकार होता है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कॉप्टिक पाठ घोषणात्मक है: “प्रकाश के मनुष्य के भीतर प्रकाश है।” यूनानी खंड में शर्तार्थक पाठ है: “यदि प्रकाश के मनुष्य में प्रकाश हो…।”'
    reason: textual_variant
  - marker: b
    text: कॉप्टिक में ‘वह’—अर्थात प्रकाश का मनुष्य—सारे संसार को प्रकाशित करता है। यूनानी खंड में प्रकाश को कर्ता मानकर “वह चमकता है” मिलता है।
    reason: textual_variant
  - marker: c
    text: 'कॉप्टिक का आशय है: “जब वह प्रकाश नहीं देता, तब अंधकार होता है।” यूनानी पाठ के पुनर्निर्माण में संभवतः है: “यदि वह नहीं है, तो संसार अंधकार में है।”'
    reason: textual_variant
lexical_decisions:
- source_word: ϯⲧⲥⲉⲃⲟⲁⲛⲟⲛ
  choice: हमें … दिखाइए
  rationale: कारक क्रिया का अर्थ ‘हमें जानने दीजिए/बताइए’ है; स्थान के संदर्भ में ‘दिखाइए’ सहज और सटीक है।
- source_word: ⲧⲟⲡⲟⲥ
  choice: स्थान
  rationale: यूनानी आगत शब्द का सीधा स्थानीय अर्थ है; ‘स्थान’ संक्षिप्त और गरिमापूर्ण है।
- source_word: ⲉⲧⲉⲣⲉⲛⲧⲟⲕⲙⲙⲁⲩ
  choice: जहाँ आप हैं
  rationale: संबंधवाचक स्थानसूचक उपवाक्य को बिना ‘निवास करते हैं’ जैसी अतिरिक्त व्याख्या के रखा गया है।
- source_word: ⲡⲉⲓⲡⲁⲛⲁⲅⲕⲏ ⲉⲁⲛⲟⲛ ⲡⲉ
  choice: हमारे लिए … आवश्यक है
  rationale: अवैयक्तिक आवश्यकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲛⲧⲟϥ
  choice: उसे खोजना
  rationale: मूल क्रिया खोजने/तलाशने का बोध देती है; ‘खोजना’ प्रसंगानुकूल है।
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛ ⲙⲁⲁϫⲉ ⲙⲙⲟϥ
  choice: जिसके कान हों
  rationale: ‘उसके साथ कान हों’ मूल भाषा का मुहावरा है; हिन्दी में प्रचलित श्रवण-सूत्र अपनाया गया है।
- source_word: ⲙⲁⲣⲉϥ ⲥⲱⲧⲙ
  choice: वह सुने
  rationale: आज्ञार्थक-जसिव बल को संक्षिप्त सूत्रात्मक रूप में सुरक्षित रखता है।
- source_word: ⲟⲩⲛⲟⲩⲟⲉⲓⲛ ϣⲟⲟⲡ
  choice: प्रकाश है
  rationale: अस्तित्व/उपस्थिति बताने वाली कॉप्टिक रचना का सहज हिन्दी रूप है।
- source_word: ⲛⲡϩⲟⲩⲛ
  choice: भीतर
  rationale: आंतरिक स्थान का सीधा और स्वाभाविक अनुवाद है।
- source_word: ⲛⲟⲩⲣⲙⲟⲩⲟⲉⲓⲛ
  choice: प्रकाश का मनुष्य
  rationale: विशिष्ट संबंधवाचक रचना और थोड़े रहस्यमय कथन-स्वर को बनाए रखता है; ‘प्रकाशमान व्यक्ति’ संभावित विकल्प है।
- source_word: ⲛⲧⲟϥ ⲣⲟⲩⲟⲉⲓⲛ
  choice: वह … प्रकाशित करता है
  rationale: कॉप्टिक में कर्ता मनुष्य है, प्रकाश नहीं; हिन्दी में इसी कर्तृत्व को सुरक्षित रखा गया है।
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ
  choice: सारे संसार को
  rationale: κόσμος और ‘समूचा’ के संयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ⲉϥⲧⲙⲣⲟⲩⲟⲉⲓⲛ ⲟⲩⲕⲁⲕⲉ ⲡⲉ
  choice: जब वह प्रकाशित नहीं करता, तब अंधकार होता है
  rationale: नकारात्मक परिस्थितिवाचक रचना और कॉप्टिक में व्यक्ति को कर्ता रखने वाली व्याकरणिक संरचना को बनाए रखता है।
theological_decisions:
- issue: ‘प्रकाश का मनुष्य’ और उसके भीतर के प्रकाश का संबंध
  choice: कॉप्टिक के घोषणात्मक वाक्य और संबंधवाचक पदबंध को यथावत रखा गया
  alternative: ‘यदि किसी प्रकाशमान व्यक्ति में प्रकाश हो’
  rationale: शर्तार्थक पाठ यूनानी खंड में मिलता है, जबकि उपलब्ध कॉप्टिक पाठ अस्तित्वसूचक घोषणा करता है; किसी आध्यात्मिक तंत्र की व्याख्या आरोपित नहीं की गई।
- issue: संसार को प्रकाशित करने वाला कर्ता
  choice: ‘वह’ अर्थात प्रकाश का मनुष्य
  alternative: ‘वह प्रकाश’
  rationale: कॉप्टिक व्याकरण व्यक्ति को कर्ता बनाती है; यूनानी साक्षी में प्रकाश कर्ता हो सकता है। मुख्य पाठ कॉप्टिक पर आधारित है और भिन्नता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक संबोधन और संक्षिप्त सूत्रात्मक शैली अपनाई गई है। ‘प्रकाश का मनुष्य’ जानबूझकर कुछ असामान्य रखा गया है ताकि मूल की विशिष्ट पदरचना मिटे नहीं। सभी पाठ-भेद मुख्य पाठ को बोझिल किए बिना पादटिप्पणियों में दिए गए हैं।
