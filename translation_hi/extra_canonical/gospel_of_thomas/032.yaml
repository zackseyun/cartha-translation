base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/032.yaml
  text: Jesus said[1], "A city built upon a high mountain and fortified cannot fall[3][2], nor will it be able to be hidden."
translation:
  language: hi
  text: यीशु ने कहा, “एक नगर, जो एक ऊँचे पहाड़[a] पर बनाया गया है और सुदृढ़ है, गिर नहीं सकता; और वह छिपाया भी नहीं जा सकेगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अंश (P.Oxy. 1) में “ऊँचे पहाड़ की चोटी पर” है, जबकि कॉप्टिक पाठ में “चोटी” नहीं है।
    reason: textual_variant
  - marker: b
    text: 'कॉप्टिक पाठ अंतिम खंड में भविष्यकाल रखता है—“छिपाया नहीं जा सकेगा”—जबकि यूनानी अंश दोनों क्रियाओं को वर्तमानकाल में रखता है। तुलना करें: मत्ती 5:14; नगर के न गिरने की छवि मत्ती 7:24–25 की भी याद दिलाती है।'
    reason: textual_variant_and_cross_reference
lexical_decisions:
- source_word: ⲕⲱⲧ
  choice: बसाया गया
  rationale: नगर के निर्माण या बसाए जाने को स्वाभाविक हिन्दी में व्यक्त करता है; कॉप्टिक का बहुवचन कर्ता अनिर्दिष्ट है, इसलिए कर्मवाच्य उपयुक्त है।
- source_word: ⲧⲟⲟⲩ
  choice: पहाड़
  rationale: यह पहाड़ या पहाड़ी दोनों अर्थ दे सकता है; ऊँचाई के स्पष्ट विशेषण के साथ ‘पहाड़’ स्रोत के अनुरूप है।
- source_word: ϫⲓⲥⲉ
  choice: ऊँचे
  rationale: पुल्लिंग गुणात्मक रूप ‘पहाड़’ का विशेषण है, नगर का नहीं।
- source_word: ⲧⲁϫⲣⲟ
  choice: दृढ़ किया गया
  rationale: स्त्रीलिंग गुणात्मक रूप नगर को सुदृढ़ या किलेबंद बताता है; ‘दृढ़ किया गया’ सैन्य किलेबंदी तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ϩⲉ
  choice: गिर
  rationale: नकारात्मक सामर्थ्य-वाक्यांश में इसका सीधा अर्थ ‘गिरना’ है।
- source_word: ϩⲱⲡ
  choice: छिपाया
  rationale: सामर्थ्य के साथ कर्मवाच्य अर्थ ‘छिपाया जा सकेगा’ स्वाभाविक हिन्दी है और अंतिम खंड के भविष्यकाल को बनाए रखता है।
theological_decisions:
- issue: मत्ती 5:14 के साथ सामंजस्य
  choice: गिर नहीं सकता, और न ही वह छिपाया जा सकेगा
  alternative: छिप नहीं सकता
  rationale: थॉमस के कॉप्टिक पाठ में नगर के न गिर सकने और भविष्य में न छिपाए जा सकने—दोनों बातें हैं; मत्ती के समान बनाने के लिए पहली बात हटाई नहीं गई और अंतिम खंड का भविष्यकाल सुरक्षित रखा गया।
- issue: नगर की मजबूती का स्वरूप
  choice: दृढ़ किया गया
  alternative: किलेबंद
  rationale: ⲧⲁϫⲣⲟ दृढ़ या सुरक्षित किए जाने का भाव देता है; ‘दृढ़’ स्रोत की अर्थ-व्याप्ति को बनाए रखता है और किसी खास सैन्य संरचना को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। ‘बसाया गया’ नगर के लिए ‘बनाया गया’ से अधिक स्वाभाविक है, जबकि ‘दृढ़ किया गया’ कॉप्टिक की व्यापकता को सुरक्षित रखता है।
