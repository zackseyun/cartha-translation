base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
translation:
  language: hi
  text: शमौन पतरस ने उनसे कहा, “मरियम को हमारे बीच से चले जाने दो, क्योंकि स्त्री[a] जीवन के योग्य नहीं है।” यीशु ने कहा, “देखो, मैं स्वयं उसे[b] आगे ले चलूँगा, ताकि मैं उसे पुरुष[c] बनाऊँ, जिससे वह भी तुम पुरुषों के समान एक जीवित आत्मा बन जाए। क्योंकि हर स्त्री जो अपने आपको पुरुष बनाएगी, स्वर्गों के राज्य[d] में प्रवेश करेगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲥϩⲓⲙⲉ का अर्थ ‘स्त्री’ या ‘मादा’ हो सकता है। यहाँ ‘स्त्री’ चुना गया है, पर मूल में आगे के ‘पुरुष’ के साथ तीखी स्त्री/पुरुष ध्रुवता है।
    reason: lexical_alternative
  - marker: b
    text: पांडुलिपि में ‘उसे’ के लिए ⲙ̄ⲙⲟⲥ है; संपादित सामान्यीकृत पाठ में उसका समतुल्य रूप ⲛⲛⲧⲟⲥ दिया गया है। दोनों स्त्रीलिंग एकवचन कर्म-सर्वनाम हैं।
    reason: textual_variant
  - marker: c
    text: ‘पुरुष/नर’ के कॉप्टिक शब्द की वर्तनी ⲛϩⲟⲟⲧ और ⲛϩⲟⲟⲩⲧ के बीच बदलती है। यह बोली अथवा वर्तनी का अंतर है, अर्थ का नहीं।
    reason: dialect_note
  - marker: d
    text: मूल कॉप्टिक अभिव्यक्ति का शाब्दिक रूप ‘स्वर्गों का राज्य’ है। हिन्दी में ‘स्वर्ग का राज्य’ अधिक परिचित अनुवाद है; यहाँ बहुवचन को सुरक्षित रखा गया है, पर अभिव्यक्ति का आशय परमेश्वर के शासन का क्षेत्र है, केवल अनेक स्थानों का भौगोलिक वर्णन नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲁⲣⲉ- … ⲉⲓ ⲉⲃⲟⲗ
  choice: चले जाने दो
  rationale: आज्ञार्थक/इच्छार्थक भाव और ‘बाहर जाना, छोड़ना’—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ϩⲛⲁⲛⲟⲛ
  choice: हमारे बीच से
  rationale: ⲉⲃⲟⲗ के साथ यह प्रसंगानुसार ‘हमारे बीच से बाहर’ का भाव देता है।
- source_word: ⲥϩⲓⲙⲉ
  choice: स्त्री
  rationale: आधुनिक हिन्दी में मनुष्य के लिए स्वाभाविक और गरिमापूर्ण शब्द है तथा आगे आए ‘पुरुष’ के साथ स्त्री/पुरुष ध्रुवता बनाए रखता है; ‘मादा’ अनावश्यक रूप से अमानवीय सुनाई देता।
- source_word: ⲙⲡϣⲁ ⲁⲛ
  choice: योग्य नहीं है
  rationale: नकारात्मक योग्यता-वाचक रचना का सीधा और प्रचलित हिन्दी रूप।
- source_word: ⲡⲱⲛϩ
  choice: जीवन
  rationale: मूल शब्द का व्यापक अर्थ सुरक्षित रखता है और उसे अस्तित्व या उद्धार के किसी एक अर्थ तक सीमित नहीं करता।
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले तीखे संकेतक का सहज आधुनिक हिन्दी समतुल्य।
- source_word: ⲥⲱⲕ
  choice: आगे ले चलूँगा
  rationale: ‘ले जाना/अगुवाई करना/खींचना’ के अर्थ-क्षेत्र में रहकर हिन्दी में स्वाभाविक है; केवल आध्यात्मिक मार्गदर्शन का अर्थ आरोपित नहीं करता।
- source_word: ⲉⲓⲣⲉ … ⲛϩⲟⲟⲩⲧ
  choice: पुरुष बनाऊँ
  rationale: मूल की जानबूझकर चौंकाने वाली स्त्री/पुरुष भाषा को रूपक समझाकर या नरम करके समाप्त नहीं करता।
- source_word: ⲡⲛⲉⲩⲙⲁ ⲉϥⲟⲛϩ
  choice: एक जीवित आत्मा
  rationale: संज्ञा को उपाधि या पवित्र आत्मा का निर्देश न बनाते हुए सामान्य अर्थ में प्रस्तुत करता है।
- source_word: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲛⲙ̄ⲡⲏⲩⲉ / ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲡⲉ
  choice: स्वर्गों का राज्य
  rationale: कॉप्टिक अभिव्यक्ति में दिखाई देने वाले बहुवचन को सुरक्षित रखता है, यद्यपि हिन्दी बाइबलीय प्रयोग में एकवचन अधिक परिचित है।
theological_decisions:
- issue: स्त्री को ‘पुरुष’ बनाने की कठिन और विवादास्पद कल्पना
  choice: कथन को उसके स्पष्ट स्त्री/पुरुष रूप में बनाए रखा गया
  alternative: इसे ‘आत्मिक रूप से पूर्ण’, ‘मानव’ या ‘पुरुष-समान’ बनना कहना
  rationale: ऐसे विकल्प मूल पाठ की लैंगिक ध्रुवता की व्याख्या करके उसे शांत कर देते और किसी विशेष धार्मिक व्याख्या को अनुवाद में मिला देते।
- issue: ‘जीवन’ का आशय
  choice: केवल ‘जीवन’
  alternative: ‘अनन्त जीवन’, ‘उद्धार’ या ‘अस्तित्व’
  rationale: प्रसंग धार्मिक अर्थ सुझा सकता है, पर मूल संज्ञा स्वयं इन विकल्पों में से किसी एक को स्पष्ट रूप से निर्धारित नहीं करती।
- issue: ‘जीवित आत्मा’ में आत्मा की पहचान
  choice: सामान्य संज्ञा ‘आत्मा’
  alternative: ‘पवित्र आत्मा’ या दिव्य ‘आत्मा’
  rationale: मूल में यह उपाधि नहीं है; बड़े अक्षर या विस्तार से विशिष्ट त्रिएकवादी अथवा अन्य सिद्धान्त आयात करना अनुचित होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। कठिन लैंगिक कथन को न तो शिष्टोक्ति से ढका गया है, न व्याख्यात्मक धर्मशास्त्रीय शब्दों से हल किया गया है। ‘शमौन पतरस’, ‘मरियम’ और ‘यीशु’ हिन्दी बाइबलीय पाठकों के लिए परिचित नाम-रूप हैं।
