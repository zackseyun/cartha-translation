base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/001.yaml
  text: And he said, "Whoever finds the interpretation[1] of these sayings[2] will not taste death[3]."
translation:
  language: hi
  text: और उसने कहा, “जो कोई इन कथनों[b] की व्याख्या[a] खोज निकालेगा, वह मृत्यु का स्वाद नहीं चखेगा।[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्याख्या’ के स्थान पर ‘अर्थ खोलने वाली व्याख्या’ भी समझा जा सकता है। कॉप्टिक शब्द यूनानी ἑρμηνεία से लिया गया है और किसी कथन का अर्थ समझने या स्पष्ट करने को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: पांडुलिपि का बोलीगत रूप ‘इन कथनों’ के बहुवचन को सूचित करता है, जबकि सामान्यीकृत पाठ को एकवचन ‘इस कथन’ के रूप में पढ़ा जा सकता है। यूनानी खंड POxy 654 भी बहुवचन का समर्थन करता है।
    reason: textual_variant
  - marker: c
    text: ‘मृत्यु का स्वाद चखना’ एक पारंपरिक मुहावरा है, जिसका अर्थ मृत्यु का अनुभव करना है। रूपक मूल पाठ के अनुसार बनाए रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲩⲱ
  choice: और
  rationale: यह एक सरल संयोजक है, जो इस कथन को पिछले साहित्यिक प्रसंग से जोड़ता है और मूल की संक्षिप्त शैली बनाए रखता है।
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ
  choice: उसने कहा
  rationale: यह बोलने की सामान्य भूतकालीन अभिव्यक्ति है; सहज हिन्दी में ‘उसने कहा’ मूल की सादगी को बनाए रखता है।
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁϩⲉ
  choice: जो कोई … खोज निकालेगा
  rationale: सापेक्ष रचना एक अनिश्चित, सामान्य व्यक्ति को सूचित करती है। ‘जो कोई’ इस व्यापक अर्थ को व्यक्त करता है, और ‘खोज निकालेगा’ बौद्धिक खोज की प्रसंगगत छाया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  choice: व्याख्या
  rationale: यह यूनानी ἑρμηνεία से लिया गया शब्द है। ‘व्याख्या’ इसके अर्थ खोलने या अर्थ-निर्णय करने वाले तकनीकी भाव को ‘अर्थ’ की अपेक्षा अधिक निकटता से रखता है।
- source_word: ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ / ⲛⲡⲉⲓϣⲁϫⲉ
  choice: इन कथनों
  rationale: पांडुलिपि का रूप बहुवचन का समर्थन करता है और यूनानी साक्षी POxy 654 भी बहुवचन के पक्ष में है; इसलिए ‘इन कथनों’ चुना गया है।
- source_word: ⲛⲧⲟϥ
  choice: वह
  rationale: स्वतंत्र तृतीय पुरुष सर्वनाम पहले आए सामान्य व्यक्ति को फिर से ग्रहण करता है; हिन्दी की ‘जो कोई … वह’ रचना इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: ϥⲛⲁ
  choice: चखेगा
  rationale: भविष्यसूचक सहायक को हिन्दी के सामान्य भविष्यकाल से व्यक्त किया गया है।
- source_word: ϫⲓϯ … ⲛⲡⲙⲟⲩ
  choice: मृत्यु का स्वाद … चखेगा
  rationale: मूल की सजीव पारंपरिक उपमा को ‘मृत्यु का अनुभव नहीं करेगा’ कहकर समतल करने के बजाय हिन्दी में भी सुरक्षित रखा गया है।
- source_word: ⲁⲛ
  choice: नहीं
  rationale: मूल की स्पष्ट क्रियात्मक नकारात्मकता को सामान्य हिन्दी निषेध से व्यक्त किया गया है।
theological_decisions:
- issue: ‘मृत्यु का स्वाद नहीं चखेगा’ का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया
  alternative: ‘कभी नहीं मरेगा’ या ‘आत्मिक मृत्यु का अनुभव नहीं करेगा’
  rationale: मूल पाठ यह निर्धारित नहीं करता कि मृत्यु शारीरिक, आत्मिक या किसी अन्य अर्थ में है। किसी एक धर्मवैज्ञानिक अर्थ को मुख्य पाठ में रख देना वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘कथन’ सूक्तिपरक वचनों के लिए स्वाभाविक है; ‘व्याख्या’ तकनीकी अर्थ को संभालती है। मूल की सामान्य ‘जो कोई … वह’ संरचना और ‘मृत्यु का स्वाद चखना’ रूपक सुरक्षित रखे गए हैं।
