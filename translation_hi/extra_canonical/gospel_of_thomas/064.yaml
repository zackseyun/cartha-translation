base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/064.yaml
  text: Jesus said[1], "A man had some guests. And when he had prepared the dinner, he sent his servant so that he might invite the guests. He went to the first. He said to him, 'My master invites you.' He said, 'I have some money with some merchants; they are coming to me in the evening. I will go to give them orders. I excuse myself from the dinner.' He went to another. He said to him[2], 'My master has invited you.' He said to him, 'I have bought a house, and they are asking for me for a day. I will not have time.' He came to another. He said to him, 'My master invites you.' He said to him, 'My friend is going to marry, and I am the one who will make the dinner. I will not go. I excuse myself from the dinner.' He went to another. He said to him, 'My master invites you.' He said to him, 'I have bought a village. I am going to collect rent. I will not go. I excuse myself.' The servant came. He said to his master, 'Those whom you invited to the dinner have excused themselves.' The master
    said to his servant, 'Go outside to the streets. Those whom you will find, bring them, so that they may dine[4][3]. Buyers and merchants will not enter the places of my father.'"
translation:
  language: hi
  text: 'यीशु ने कहा, “एक मनुष्य के कुछ अतिथि थे। जब उसने भोज तैयार कर लिया, तो उसने अपने सेवक को अतिथियों को बुलाने भेजा।


    सेवक पहले व्यक्ति के पास गया और उससे कहा, ‘मेरे स्वामी तुम्हें बुलाते हैं।’ उसने कहा, ‘मेरा कुछ धन कुछ व्यापारियों के पास है। वे शाम को मेरे पास आ रहे हैं। मैं जाकर उन्हें निर्देश दूँगा। भोज में आने से मुझे क्षमा करें।’


    सेवक दूसरे व्यक्ति के पास गया और उससे कहा, ‘मेरे स्वामी ने तुम्हें बुलाया है।’[a] उसने उससे कहा, ‘मैंने एक घर खरीदा है, और उन्हें एक दिन के लिए मेरी ज़रूरत है। मेरे पास समय नहीं होगा।’


    सेवक एक और व्यक्ति के पास आया और उससे कहा, ‘मेरे स्वामी तुम्हें बुलाते हैं।’ उसने उससे कहा, ‘मेरे मित्र का विवाह होनेवाला है, और मुझे भोज तैयार करना है। मैं नहीं जाऊँगा।[b] भोज में आने से मुझे क्षमा करें।’


    सेवक एक और व्यक्ति के पास गया और उससे कहा, ‘मेरे स्वामी तुम्हें बुलाते हैं।’ उसने उससे कहा, ‘मैंने एक गाँव खरीदा है। मैं लगान वसूल करने जा रहा हूँ। मैं नहीं जाऊँगा। मुझे क्षमा करें।’


    सेवक लौट आया और उसने अपने स्वामी से कहा, ‘जिन्हें आपने भोज में बुलाया था, उन सबने आने से क्षमा माँगी है।’ स्वामी ने अपने सेवक से कहा, ‘बाहर सड़कों पर जाओ। जो भी लोग तुम्हें मिलें, उन्हें ले आओ, ताकि वे भोज करें। खरीदार और व्यापारी मेरे पिता के स्थानों में प्रवेश नहीं करेंगे।’[c][d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दूसरे निमंत्रण में कॉप्टिक पाठ पूर्ण भूतकाल का रूप प्रयोग करता है—‘मेरे स्वामी ने तुम्हें बुलाया है’; अन्य निमंत्रणों में वर्तमानकालीन रूप है—‘मेरे स्वामी तुम्हें बुलाते हैं’।
    reason: textual_variant
  - marker: b
    text: यहाँ कॉप्टिक ϯⲛⲁϣⲓ ⲁⲛ का अर्थ ‘मैं नहीं जाऊँगा’ है। ϣⲓ, ‘जाना’ क्रिया का रूप है; इसे ‘मैं नहीं कर सकूँगा’ समझना उचित नहीं, क्योंकि ‘सकना’ वाली क्रिया के बाद अपेक्षित क्रियार्थक रूप यहाँ नहीं है।
    reason: lexical_alternative
  - marker: c
    text: पांडुलिपि के अंतिम वाक्य में कुछ अक्षर नष्ट हैं। ‘प्रवेश नहीं करेंगे’ मानक पुनर्निर्माण है, जो बचे हुए अक्षरों और उपलब्ध स्थान के अनुकूल है।
    reason: textual_variant
  - marker: d
    text: इस कथन में बहाने धन, घर, विवाह-भोज और लगान से जुड़े हैं, और अंत में ‘खरीदार और व्यापारी’ स्पष्ट रूप से कहे गए हैं। यह विशेषता लूका 14:16–24 और मत्ती 22:1–10 के समान भोज-दृष्टांतों में इस रूप में नहीं मिलती।
    reason: literary_context
lexical_decisions:
- source_word: ϣⲙⲙⲟ
  choice: अतिथि
  rationale: मूल शब्द का सामान्य अर्थ ‘अजनबी/परदेशी’ है, पर भोज और निमंत्रण के प्रसंग में ‘अतिथि’ स्वाभाविक है; इसे अगले शब्द ϩⲙϩⲁⲗ (‘सेवक’) से अलग रखा गया है।
- source_word: ϩⲙϩⲁⲗ
  choice: सेवक
  rationale: ‘दास/सेवक’ अर्थ वाले शब्द के लिए आधुनिक, गरिमापूर्ण और प्रसंगानुकूल चयन; सामाजिक स्थिति को पूरी तरह मिटाए बिना कथात्मक हिंदी में सहज है।
- source_word: ϩⲟⲙⲧ
  choice: धन
  rationale: शाब्दिक अर्थ ‘ताँबा’ है और मुद्रा के अर्थ में प्रयुक्त होता है; ‘धन’ आर्थिक विवरण बनाए रखता है और ‘लेन-देन’ जैसे अस्पष्ट भावानुवाद से बचता है।
- source_word: ⲟⲩⲉϩⲥⲁϩⲛⲉ
  choice: निर्देश देना
  rationale: क्रिया का अर्थ आदेश या निर्देश देना है; व्यापारियों के आने के प्रसंग में ‘निर्देश दूँगा’ स्वाभाविक है।
- source_word: ⲥⲣϥⲉ
  choice: समय होना
  rationale: मूल में अवकाश या समय उपलब्ध होने का भाव है; आधुनिक हिंदी में ‘मेरे पास समय नहीं होगा’ स्पष्ट और सहज है।
- source_word: ⲣϣⲉⲗⲉⲉⲧ
  choice: विवाह होना
  rationale: मूलतः ‘दुल्हन लेना/विवाह करना’; मित्र के आगामी विवाह के लिए यह स्वाभाविक हिंदी है।
- source_word: ϣⲓ
  choice: जाना
  rationale: यह ϣⲉ (‘जाना’) का रूप/वर्तनी-भेद है, न कि ‘सकना’; इसलिए ‘मैं नहीं जाऊँगा’ रखा गया है।
