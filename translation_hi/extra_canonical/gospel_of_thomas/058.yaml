base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/058.yaml
  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
translation:
  language: hi
  text: यीशु ने कहा, “धन्य[a] है वह व्यक्ति[b] जिसने परिश्रम किया है[c]; उसने जीवन पाया है[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धन्य’ का अर्थ यहाँ ‘सुखी’ या ‘सौभाग्यशाली’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कॉप्टिक शब्द सामान्य रूप से ‘मनुष्य’ या ‘व्यक्ति’ को सूचित करता है; इसका आशय केवल पुरुष से नहीं है।
    reason: lexical_alternative
  - marker: c
    text: इस क्रिया का अनुवाद ‘कठिन परिश्रम किया है’, ‘कठिनाई उठाई है’ या ‘दुःख सहा है’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: 'पांडुलिपि का संक्षिप्त रूप है: ‘उसने जीवन पाया।’ मुद्रित रूप ⲁⲡⲱⲛϩ में आरम्भिक ⲁ को वर्तनीगत रूप मानते हुए सामान्यतः ‘जीवन’ को ‘पाया’ का कर्म समझा जाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓ︤ⲥ︥
  choice: यीशु ने कहा
  rationale: यह थोमा में कथन आरम्भ करने वाला सामान्य संक्षिप्त सूत्र है; भूतकालीन ‘कहा’ कॉप्टिक कथात्मक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: धन्य
  rationale: यूनानी मूल का यह शब्द आशीष-वचन की गंभीर शैली रखता है और साथ ही सुखी या सौभाग्यशाली होने का भाव भी दे सकता है।
- source_word: ⲡⲣⲱⲙⲉ
  choice: व्यक्ति
  rationale: शब्द सामान्यतः किसी मानव को सूचित करता है; ‘व्यक्ति’ एकवचन को बनाए रखते हुए अनावश्यक पुरुष-विशेष अर्थ से बचता है।
- source_word: ϩⲓⲥⲉ
  choice: परिश्रम सहा है
  rationale: इस क्रिया का अर्थ-क्षेत्र परिश्रम करने, कठिनाई उठाने और दुःख सहने तक फैला है। ‘परिश्रम सहा’ श्रम और कष्ट दोनों को खुला रखता है, यद्यपि हिन्दी में कुछ असामान्य गंभीरता भी बनाए रखता है।
- source_word: ⲁϥϩⲉ
  choice: उसने … पा लिया है
  rationale: पांडुलिपि में सामान्य तृतीय पुरुष एकवचन पूर्ण क्रिया है, कोई स्वतंत्र बलाघाती सर्वनाम नहीं। ‘पा लिया है’ प्राप्त परिणाम को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: ⲡⲱⲛϩ
  choice: जीवन
  rationale: निश्चित उपपद यहाँ सामान्य या सारगत अर्थ दे सकता है; हिन्दी में ‘जीवन’ स्वाभाविक है और ‘वह जीवन’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: परिश्रम और दुःख के बीच संबंध
  choice: परिश्रम सहा है
  alternative: दुःख सहा है / परिश्रम किया है
  rationale: स्रोत की क्रिया श्रम और पीड़ा दोनों को समेट सकती है। अनुवाद जानबूझकर इस तनाव को पूरी तरह किसी एक ओर सीमित नहीं करता।
- issue: जीवन का आशय
  choice: जीवन
  alternative: वह जीवन / अनन्त जीवन
  rationale: स्रोत केवल ‘जीवन’ कहता है। ‘अनन्त’ जोड़ना व्याख्यात्मक और धर्मवैचारिक विस्तार होता, इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी की संक्षिप्त, गंभीर और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। पांडुलिपि के वास्तविक रूप ⲛ̄ⲧⲁϩϩⲓⲥⲉ और ⲁϥϩⲉ को प्राथमिकता दी गई है; दिए गए सामान्यीकृत पाठ में दिखाई देने वाले स्वतंत्र बलाघाती सर्वनाम को अनुवाद में नहीं अपनाया गया, क्योंकि वह मूल पांडुलिपि-पाठ में नहीं है।
