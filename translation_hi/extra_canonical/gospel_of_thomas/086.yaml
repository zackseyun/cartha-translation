base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
translation:
  language: hi
  text: यीशु ने कहा, “लोमड़ियों के अपने बिल हैं[a], और पक्षियों का अपना घोंसला है[b], पर मनुष्य के पुत्र के पास ऐसी कोई जगह नहीं जहाँ वह अपना सिर टेककर विश्राम करे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि के पुनर्निर्मित पाठ में यहाँ ‘एक बिल/मांद’ पढ़ा जाता है; अगले खंड के समानांतर सामान्यतः इसे ‘उनके बिल’ समझा या संशोधित किया जाता है।
    reason: textual_variant
  - marker: b
    text: मूल पाठ में ‘घोंसला’ एकवचन है और ‘आकाश के’ शब्द नहीं हैं; इस प्रकार यह मत्ती 8:20 और लूका 9:58 के समानांतर कथनों से अलग है।
    reason: cross_reference
  - marker: c
    text: थॉमस के पाठ में ‘और विश्राम करे’ का भाव है, जो मत्ती 8:20 और लूका 9:58 के समानांतर रूपों में नहीं मिलता।
    reason: cross_reference
lexical_decisions:
- source_word: ⲃⲁϣⲟⲣ
  choice: लोमड़ियाँ
  rationale: यह बहुवचन संज्ञा है; इसलिए बहुवचन रखा गया है।
- source_word: ⲃⲏⲃ
  choice: बिल
  rationale: इसका अर्थ गुफा, मांद या बिल हो सकता है। लोमड़ियों के संदर्भ में ‘बिल’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: ϩⲁⲗⲏⲧ
  choice: पक्षी
  rationale: स्रोत में बहुवचन ‘पक्षी’ है और ‘आकाश के’ जैसा कोई विशेषण नहीं है।
- source_word: ⲙⲁϩ
  choice: घोंसला
  rationale: स्रोत में बहुवचन स्वामी के साथ संज्ञा एकवचन है—‘उनका घोंसला’; हिन्दी में ‘पक्षियों का अपना घोंसला’ इस रूप को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ⲣⲓⲕⲉ
  choice: झुकाकर
  rationale: क्रिया का मूल अर्थ झुकाना या टेकना है। सिर के साथ ‘अपना सिर झुकाकर’ स्रोत के चित्र को बनाए रखता है।
- source_word: ⲙⲧⲟⲛ
  choice: विश्राम करे
  rationale: यह आत्मवाचक अर्थ में विश्राम करने को व्यक्त करता है; इसे अलग क्रिया के रूप में रखा गया है, केवल सिर रखने का पर्याय नहीं बनाया गया।
theological_decisions:
- issue: ⲡϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ का अर्थ और उपाधिसूचक स्वर
  choice: मनुष्य के पुत्र
  alternative: मनुष्य-पुत्र; मानव-पुत्र
  rationale: यह रूप स्रोत की शब्द-संरचना को निकटता से रखता है और हिन्दी में कथन को समझने योग्य बनाता है। देवनागरी में बड़े-छोटे अक्षरों का भेद न होने से यह अनुवाद वाक्यांश के सामान्य मानवीय अर्थ और उपाधिसूचक अर्थ के बीच की संभावित द्व्यर्थता को खुला छोड़ता है।
- issue: विश्राम करने वाले का संकेत
  choice: वह अपना सिर झुकाकर विश्राम करे
  alternative: अपना सिर रखकर विश्राम कर सके
  rationale: स्रोत का कर्ता मनुष्य का पुत्र ही है। ‘वह’ जोड़ना हिन्दी में वाक्य स्पष्ट करता है, जबकि ‘झुकाकर’ और ‘विश्राम करे’ दोनों अलग स्रोत-क्रियाओं को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लोमड़ियों के अपने बिल’ तथा ‘पक्षियों का अपना घोंसला’ स्रोत के बहुवचन स्वामियों और क्रमशः बहुवचन तथा एकवचन आश्रय-संज्ञाओं को सुरक्षित रखते हैं। ‘मनुष्य के पुत्र’ को किसी विशिष्ट सांप्रदायिक व्याख्या से बाँधे बिना रखा गया है।
