base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
translation:
  language: hi
  text: यीशु ने कहा, “कोई बलवान के घर में घुसकर उसे[a] बलपूर्वक अपने कब्ज़े में नहीं ले सकता, जब तक कि वह बलवान के हाथ न बाँध दे; तब वह उसके घर को उलट-पुलट कर देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ का संकेत घर या बलवान—दोनों में से किसी की ओर हो सकता है। मूल कॉप्टिक में पुल्लिंग एकवचन सर्वनाम प्रयुक्त है, और दोनों संज्ञाएँ पुल्लिंग हैं।
    reason: मूल पाठ की सर्वनाम-संबंधी वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ
  choice: नहीं कर सकता
  rationale: यह नकार और सामर्थ्य/क्षमता की कॉप्टिक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ⲡϫⲱⲱⲣⲉ
  choice: बलवान
  rationale: मूल में विशेषण ‘बलवान’ संज्ञा के रूप में प्रयुक्त है; हिन्दी में भी यह प्रयोग संक्षिप्त और सहज है।
- source_word: ϫⲓⲧϥ ⲛϫⲛⲁϩ
  choice: उस पर बलपूर्वक अधिकार
  rationale: ⲛϫⲛⲁϩ क्रिया को ‘बलपूर्वक’ का भाव देता है। पुल्लिंग एकवचन सर्वनाम का संदर्भ घर या बलवान, दोनों हो सकता है; ‘उस पर’ इसी अस्पष्टता को बनाए रखता है।
- source_word: ⲙⲟⲩⲣ ⲛⲛⲉϥϭⲓϫ
  choice: उसके हाथ बाँध दे
  rationale: मूल पाठ स्पष्टतः हाथों को बाँधने की बात करता है; रस्सी जैसी कोई अतिरिक्त वस्तु नहीं जोड़ी गई।
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: उलट-पुलट देगा
  rationale: यह क्रिया ‘उंडेल देना/उलट देना’ का चित्रात्मक भाव रखती है। ‘लूटेगा’ कहने से समानांतर सुसमाचारों की अलग क्रिया अनावश्यक रूप से आयात होती।
theological_decisions:
- issue: बलपूर्वक अधिकार किए जाने वाली वस्तु अथवा व्यक्ति
  choice: मुख्य पाठ में ‘उस पर’ रखकर संदर्भ को खुला रखा गया
  alternative: ‘घर को अपने अधिकार में’ या ‘बलवान को पकड़’
  rationale: कॉप्टिक पुल्लिंग एकवचन प्रत्यय व्याकरणतः ‘घर’ और ‘बलवान’, दोनों की ओर संकेत कर सकता है; किसी एक अर्थ को निर्णायक बनाना उचित नहीं।
- issue: अंतिम क्रिया का अर्थ
  choice: उलट-पुलट देगा
  alternative: खाली कर देगा; लूट लेगा
  rationale: मूल क्रिया का प्राथमिक चित्र उंडेलने या उलटने का है। प्रसंग में लूट का आशय संभव है, पर उसे मुख्य पाठ में निश्चित करना मूल की विशिष्ट शब्दावली को दबा देगा।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘बलवान’ स्रोत के संज्ञात्मक विशेषण को बचाता है। ‘उलट-पुलट देगा’ मूल की ठोस छवि को बनाए रखता है और समानांतर कैनोनिकल कथनों से ‘लूटना’ आयात नहीं करता।
