base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
translation:
  language: hi
  text: यीशु ने कहा, “लोग काँटों से अंगूर नहीं तोड़ते, न ऊँटकटारों से अंजीर[b] बटोरते हैं, क्योंकि वे फल नहीं देते। एक भला मनुष्य[a] अपने भंडार से भली वस्तु निकालता है; और एक बुरा मनुष्य अपने उस भंडार से, जो उसके हृदय में है[c], बुरी वस्तु निकालता है और बुरी बातें कहता है[d], क्योंकि हृदय की भरपूरी से वह बुराई निकालता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि में ‘भला’ शब्द का आरंभ क्षतिग्रस्त है; उसका पाठ प्रसंग और शेष अक्षरों के आधार पर पुनर्स्थापित किया गया है।
    reason: पाठ-संबंधी पुनर्निर्माण को पारदर्शी बनाना।
  - marker: b
    text: 'यहाँ ‘अंजीर’ का रूप सामूहिक अर्थ में भी समझा जा सकता है: अंजीर के फल।'
    reason: मूल संज्ञा और हिन्दी के स्वाभाविक फल-संदर्भ का संबंध स्पष्ट करना।
  - marker: c
    text: कॉप्टिक संबंधवाचक वाक्यांश ‘जो उसके हृदय में है’ निकटवर्ती ‘भंडार’ को विशेषित करता है।
    reason: भंडार और हृदय के व्याकरणिक संबंध को स्पष्ट करना।
  - marker: d
    text: 'पांडुलिपि में यहाँ बहुवचन भाव है: ‘बुरी बातें’ या ‘बुरी चीज़ें’; बोलने की क्रिया के कारण ‘बुरी बातें’ रखा गया है।'
    reason: पांडुलिपि के बहुवचन और प्रसंगानुकूल हिन्दी चयन को दर्ज करना।
lexical_decisions:
- source_word: ϣⲟⲛⲧⲉ
  choice: काँटे
  rationale: साहिदिक शब्द काँटे अथवा काँटेदार झाड़ियों को सूचित करता है; सरल बहुवचन हिन्दी में चित्र को स्वाभाविक रखता है।
- source_word: ⲥⲉⲣϭⲁⲙⲟⲩⲗ
  choice: ऊँटकटारे
  rationale: शब्द का शाब्दिक अर्थ ‘ऊँट-काँटा’ है; ‘ऊँटकटारा’ हिन्दी का वनस्पति-संबंधी समतुल्य है और पहले वाले सामान्य ‘काँटों’ से भेद बनाए रखता है।
- source_word: ⲁϩⲟ
  choice: भंडार
  rationale: यह भीतर संचित वस्तुओं के स्थान या कोष को दर्शाता है; ‘भंडार’ हृदय में स्थित नैतिक संचय के रूपक को सुरक्षित रखता है।
- source_word: ⲡϩⲟⲩⲟ ⲛⲡϩⲏⲧ
  choice: हृदय की भरपूरी
  rationale: मूल पदबंध हृदय की अधिकता या उमड़ती हुई पूर्णता को व्यक्त करता है; ‘भरपूरी’ इस कारणात्मक रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखती है।
- source_word: ⲡⲟⲛⲏⲣⲟⲛ
  choice: बुरी वस्तु / बुरी बातें / बुराई
  rationale: संदर्भ के अनुसार यही विशेषण संज्ञा के रूप में किसी बुरी चीज़, कही गई बुरी बातों, अथवा सामूहिक बुराई को सूचित करता है; हिन्दी में प्रसंगानुकूल रूप बदलना स्वाभाविक है।
theological_decisions:
- issue: भंडार और हृदय का संबंध
  choice: ‘उस बुरे भंडार से, जो उसके हृदय में है’
  alternative: ‘अपने भंडार से—अर्थात जो उसके हृदय में है—’
  rationale: कॉप्टिक में संबंधवाचक वाक्यांश निकटतम ‘बुरे भंडार’ को विशेषित करता है; अनुवाद उसी व्याकरणिक संबंध को रखता है और हृदय को सीधे भंडार का समानार्थक घोषित नहीं करता।
- issue: अंतिम वाक्य में नैतिक परिणाम
  choice: ‘हृदय की भरपूरी में से वह बुराई निकालता है’
  alternative: ‘जो हृदय में भरा है, वही मुँह से निकलता है’
  rationale: लोकप्रिय समानांतर कथन जोड़ने के बजाय उपलब्ध कॉप्टिक की ‘निकालता है’ क्रिया और ‘बुराई’ कर्म को संरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ऊँटकटारा’ अपेक्षाकृत दुर्लभ किंतु स्रोत-विशिष्ट वनस्पति नाम है। कथन की पुनरुक्ति और ‘हृदय/भंडार’ का तनाव जानबूझकर सुरक्षित रखा गया है।
