base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/020.yaml
  text: The disciples said to Jesus[a], “Tell us what the kingdom of the heavens is like.” He said to them, “It is like a mustard seed—the smallest of all seeds; but when it falls upon worked soil[f][e][d][c][b], it produces a great branch and becomes a shelter for the birds of the sky.”
translation:
  language: hi
  text: शिष्यों ने यीशु से कहा, “हमें बताइए, स्वर्गों का राज्य[a] कैसा है?” यीशु ने उनसे कहा, “वह राई के एक दाने[b] के समान है। वह सभी बीजों में सबसे छोटा है; पर जब वह जोती हुई भूमि[c] पर गिरता है, तो एक बड़ी डाल निकालता है और आकाश के पक्षियों के लिए आश्रय[d] बन जाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल कॉप्टिक में शब्दशः “स्वर्गों का राज्य” है; ⲡⲡⲉ का अर्थ प्रसंग के अनुसार “स्वर्ग” या “आकाश” भी हो सकता है।
    reason: source_language_note
  - marker: b
    text: शब्दशः “राई का एक दाना।” कॉप्टिक ⲃⲗⲃⲓⲗⲉ दाने या बीज को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: मूल में शाब्दिक रूप से “उस भूमि पर जिस पर वे काम करते हैं” है—यह खेती के लिए जोती या तैयार की गई भूमि का संकेत है।
    reason: cultural_note
  - marker: d
    text: “आश्रय” के लिए प्रयुक्त कॉप्टिक शब्द का अर्थ “छाया,” “आड़” या “ढकाव” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: हमें बताइए
  rationale: शाब्दिक अर्थ ‘हमसे कहिए’ है; प्रश्न के प्रसंग में आधुनिक हिन्दी का स्वाभाविक और सम्मानसूचक रूप ‘हमें बताइए’ है।
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲡⲉ
  choice: स्वर्गों का राज्य
  rationale: ⲙⲛⲧⲣⲣⲟ राज्य/राजत्व और ⲡⲡⲉ स्वर्ग अथवा आकाश को सूचित करता है। बहुवचन-सदृश स्रोत-वाक्यांश की विशिष्टता बनाए रखने के लिए ‘स्वर्गों’ रखा गया है।
- source_word: ⲉⲛⲓⲙ
  choice: कैसा है
  rationale: यह समानता या प्रकार पूछने वाला प्रश्नसूचक प्रयोग है—‘किसके समान/कैसा?’ हिन्दी में ‘कैसा है?’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: ⲁⲟⲩⲃⲗⲃⲓⲗⲉ ⲛϣⲗⲧⲁⲙ
  choice: राई का एक दाना
  rationale: ⲃⲗⲃⲓⲗⲉ दाना/बीज और ϣⲗⲧⲁⲙ राई को दर्शाता है; हिन्दी में ‘राई का दाना’ परिचित और सटीक है।
- source_word: ⲛⲧⲟⲥ ⲥⲃⲟⲕ ⲡⲁⲣⲁⲡϭⲣⲟϭ ⲧⲏⲣⲛⲧⲟⲟⲩ
  choice: वह सभी बीजों में सबसे छोटा है
  rationale: तुलनात्मक रचना का आशय सभी बीजों के बीच अतिशय छोटापन है; हिन्दी में इसे स्वाभाविक सर्वोत्तमावस्था से व्यक्त किया गया है।
- source_word: ⲉϫⲛⲡⲕⲁϩ ⲉⲧⲟⲩⲣϩⲱⲃ ⲉⲣⲟϥ
  choice: जोती हुई भूमि पर
  rationale: शाब्दिक सापेक्ष उपवाक्य ‘उस भूमि पर जिस पर वे काम करते हैं’ कृषि-संदर्भ में तैयार या जोती भूमि को बताता है।
- source_word: ϣⲁϥⲧⲉⲩⲟ ⲉⲃⲟⲗ ⲛⲟⲩⲛⲟϭ ⲛⲧⲁⲣ
  choice: एक बड़ी डाल निकालता है
  rationale: ⲧⲁⲣ का अर्थ डाल/शाखा है और क्रिया बाहर उत्पन्न करने या निकालने को दर्शाती है; इसलिए ‘पौधा’ के बजाय विशिष्ट शाखा-चित्र सुरक्षित रखा गया है।
- source_word: ⲥⲕⲉⲡⲏ ⲛϩⲁⲗⲏⲧ ⲛⲡⲡⲉ
  choice: आकाश के पक्षियों के लिए आश्रय
  rationale: ⲥⲕⲉⲡⲏ आश्रय, आड़ या छाया हो सकता है; ‘आश्रय’ पक्षियों के लिए डाल के उपयोग को व्यापक रूप से व्यक्त करता है। यहाँ ⲡⲡⲉ का भौतिक अर्थ ‘आकाश’ प्रसंगानुकूल है।
theological_decisions:
- issue: ‘स्वर्गों का राज्य’ और ‘आकाश के पक्षी’ में एक ही स्रोत-संज्ञा ⲡⲡⲉ का भिन्न प्रसंगगत रूप
  choice: राज्य के साथ ‘स्वर्गों’ और पक्षियों के साथ ‘आकाश’
  alternative: दोनों स्थानों पर ‘आकाश’ या दोनों स्थानों पर ‘स्वर्ग’
  rationale: स्रोत-शब्द की अर्थ-सीमा आकाश और स्वर्ग दोनों को समेटती है। राज्य-सूत्र में धार्मिक अर्थ और पक्षियों के संदर्भ में दृश्य आकाश प्रमुख है; यह भेद किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। यीशु के प्रति सम्मानसूचक आग्रह ‘बताइए’ प्रयुक्त है, और उत्तर में असहज सर्वनाम से बचने के लिए नाम दोहराया गया है। कृषि और पक्षी-चित्र को सामान्य पाठक के लिए ठोस तथा सहज रखा गया है।
