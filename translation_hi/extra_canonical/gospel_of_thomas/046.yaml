  source_fidelity: 'मुख्य पाठ मूल के सभी प्रमुख खंडों को प्रस्तुत करता है: आदम से यूहन्ना तक की सीमा, स्त्रियों से जन्मे लोगों का उल्लेख, यूहन्ना की उच्चता, आँखों वाला मुहावरा, ‘मैंने कहा है,’ छोटा होने वाला व्यक्ति, राज्य को जानना, और यूहन्ना से ऊँचा होना। किंतु ‘किसी के सामने’ मूल में नहीं है; यह मुहावरे की एक संभावित सामाजिक व्याख्या को अनुवाद के मुख्य पाठ में जोड़ देता है।'
