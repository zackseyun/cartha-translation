base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
translation:
  language: hi
  text: '**कथन 46**


    यीशु ने कहा, “आदम से लेकर बपतिस्मा देने वाले यूहन्ना तक, स्त्रियों से जन्मे लोगों में कोई भी बपतिस्मा देने वाले यूहन्ना से ऊँचा नहीं है; इसलिए उसकी आँखें नीची नहीं होंगी।[a] लेकिन मैंने कहा है: तुममें से जो कोई छोटा बन जाएगा,[b] वह राज्य को जानेगा[c] और यूहन्ना से ऊँचा हो जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक चित्र है, “उसकी आँखें तोड़ी/झुकाई नहीं जाएँगी।” आँखें नीची करना सम्मान, संकोच या अधीनता का संकेत हो सकता है। यहाँ यह उस कथन से जुड़ा है कि यूहन्ना से ऊँचा कोई नहीं है।
    reason: मुहावरे और सांस्कृतिक संकेत की व्याख्या; मुख्य पाठ में निहितार्थ को जोड़े बिना संभावित अर्थ स्पष्ट करना।
  - marker: b
    text: कॉप्टिक शब्द का अर्थ “छोटा” या “नन्हा” है; संज्ञा के रूप में इसका अर्थ “बालक” या “छोटा जन” भी हो सकता है।
    reason: मूल की वास्तविक शब्दार्थगत अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: '“राज्य” के लिए प्रयुक्त शब्द का अर्थ “राजत्व” या “राजकीय शासन” भी हो सकता है। तुलना करें: मत्ती 11:11; लूका 7:28।'
    reason: शब्दार्थ और समानांतर परंपरा।
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: जन्मे लोग
  rationale: संदर्भ में यह जन्म या संतान को दर्शाता है। ‘स्त्रियों से जन्मे लोग’ आधुनिक हिन्दी में स्वाभाविक है और मूल की सामूहिक अभिव्यक्ति बनाए रखता है।
- source_word: ϫⲟⲥⲉ / ϫⲓⲥⲉ
  choice: ऊँचा
  rationale: मूल शब्द ऊँचाई अथवा उच्चता बताता है और यहाँ तुलनात्मक अर्थ में है। ‘ऊँचा’ शाब्दिक तथा प्रतिष्ठा-संबंधी दोनों अर्थों की गुंजाइश रखता है; ‘महान’ अर्थ को अधिक निश्चित कर देता।
- source_word: ⲟⲩⲱϭⲡ … ⲃⲁⲗ
  choice: आँखें … नीची होंगी
  rationale: क्रिया का मूल अर्थ तोड़ना या कुचलना है, पर आँखों के साथ यह आँखें झुकाने/नीची करने का मुहावरा है। हिन्दी में ‘आँखें नीची करना’ सम्मान, संकोच या अधीनता का स्वाभाविक मुहावरा है।
- source_word: ⲕⲟⲩⲉⲓ
  choice: छोटा
  rationale: शब्द का सीधा अर्थ ‘छोटा’ या ‘नन्हा’ है और यह संज्ञा की तरह ‘बालक/छोटा जन’ भी हो सकता है। मुख्य पाठ में ‘छोटा’ रखने से मूल की अस्पष्टता बनी रहती है।
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: राज्य
  rationale: यह शब्द राज्य, राजत्व या राजकीय शासन को सूचित कर सकता है। ‘राज्य’ हिन्दी बाइबलीय प्रयोग में परिचित है और स्थान, शासन तथा राजसत्ता के बीच मूल की अर्थ-व्याप्ति को अपेक्षाकृत खुला रखता है।
theological_decisions:
- issue: ⲕⲟⲩⲉⲓ को बालक-संबंधी या विनम्रता-संबंधी अर्थ देना
  choice: छोटा बन जाएगा
  alternative: बालक बन जाएगा / छोटा जन बन जाएगा
  rationale: मूल केवल ‘छोटा होना’ कहता है; इसे सीधे बालक बनना या विनम्र होना कहना एक विशेष व्याख्या को पाठ में बैठा देता। ‘छोटा’ अर्थगत तनाव को सुरक्षित रखता है और पादटिप्पणी संभावित बालक-संबंधी अर्थ बताती है।
- issue: ⲙⲛⲧⲉⲣⲟ का अर्थ
  choice: राज्य
  alternative: राजत्व / राजकीय शासन
  rationale: यहाँ यह स्पष्ट नहीं किया गया कि आशय किसी क्षेत्र से है, परमेश्वर के शासन से, या राजत्व की अवस्था से। ‘राज्य’ पारंपरिक और पठनीय है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
- issue: यूहन्ना की आँखें नीची न होने का आशय
  choice: मुहावरे का अनुवाद, पर कारण को अतिरिक्त धर्मवैचारिक दावे में न बदलना
  alternative: उसे किसी के प्रति सम्मान में सिर झुकाना नहीं पड़ेगा
  rationale: मूल आँखों का उल्लेख करता है, सिर का नहीं। हिन्दी मुहावरे से अर्थ समझ आता है, पर सम्मान, लज्जा या अधीनता में से किसी एक को निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बपतिस्मा देने वाला यूहन्ना’ हिन्दी बाइबलीय परिचय बनाए रखता है। ‘ऊँचा’, ‘छोटा’ और ‘राज्य’ जानबूझकर ऐसे शब्द चुने गए हैं जो मूल के स्थानिक, सामाजिक और धर्मवैचारिक अर्थों को समय से पहले एक ही व्याख्या में सीमित नहीं करते।
