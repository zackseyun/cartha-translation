translation:
  language: hi
  text: 'तब बरतुलमै ने उनसे पूछा, “सुसमाचार में <उसे> [] ‘मानव’ और ‘मनुष्य का पुत्र’ कैसे कहा गया है? तो इनमें से कौन-सा नाम पुत्र से संबंधित है?”


    जो पवित्र हैं, उन्होंने उससे कहा, “मैं चाहता हूँ कि तुम जानो: आदि मानव को ‘जनक’ और ‘स्वयं-पूर्ण मन’ कहा जाता है। उन्होंने अपनी संगिनी, महान सोफिया, के साथ मनन किया और अपने पहलौठे, उभयलिंगी पुत्र को प्रकट किया। उसका पुरुष-नाम ‘परमेश्वर का प्रथम-जनक पुत्र’ कहलाता है, और उसका स्त्री-नाम ‘प्रथम-जनक सोफिया, विश्व की माता’ है; कुछ लोग उसे ‘प्रेम’ कहते हैं। उस पहलौठे ने, जो ‘मसीह’ कहलाता है, अपने पिता से अधिकार पाकर आत्मा और ज्योति से सेवा के लिए असंख्य [] स्वर्गदूतों की एक विशाल संख्या की सृष्टि की।”


    उनके शिष्यों ने उनसे कहा, “प्रभु, जो ‘मानव’ कहलाता है, उसके विषय में हमें प्रकट कीजिए, ताकि हम भी उसकी महिमा को ठीक-ठीक समझ सकें।”


    सिद्ध उद्धारकर्ता ने कहा, “जिसके सुनने के कान हों, वह सुने! दीप्तिमान ज्योति से उत्पन्न होने के कारण प्रथम-जनक पिता का नाम ‘आदम, ज्योति की आँख’ है; [a] और उनके अवर्णनीय, छायारहित पवित्र स्वर्गदूत अपने पिता से प्राप्त प्रतिरूपों पर निरंतर आनंदित और मग्न रहते हैं। मनुष्य के पुत्र का समूचा राज्य—जो ‘परमेश्वर का पुत्र’ कहलाता है—अवर्णनीय और छायारहित आनंद तथा कभी न बदलनेवाली प्रसन्नता से परिपूर्ण है। वे उसकी अविनाशी [] महिमा पर आनंदित होते हैं, जिसके विषय में बाद में अस्तित्व में आए युगों और उनके लोकों में आज तक न तो सुना गया था, न उसे प्रकट किया गया था। मैं स्वयं-उत्पन्न, आदि अनंत ज्योति से उत्पन्न हुआ, ताकि मैं तुम पर सब कुछ प्रकट कर सकूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी लंबित है। पाठ में < > संपादकीय पूर्ति और [] पांडुलिपि की रिक्ति अथवा क्षति का संकेत देते हैं।
    reason: स्रोत की अस्थायी स्थिति और दृश्य पाठ-संकेतों का अर्थ पाठक के लिए स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: the Human / Son of Man
  choice: ‘मानव’ / ‘मनुष्य का पुत्र’
  rationale: दो अलग उपाधियों के बीच मूल पाठ का प्रश्न और वैचारिक तनाव बनाए रखा गया है।
- source_word: Primal Human
  choice: आदि मानव
  rationale: प्राथमिक अथवा आद्य सत्ता का भाव सहज, गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: the Begetter
  choice: जनक
  rationale: उत्पन्न करनेवाले का अर्थ संक्षिप्त रूप में देता है और ‘पिता’ से शब्दगत भेद बनाए रखता है।
- source_word: Self-Completed Mind
  choice: स्वयं-पूर्ण मन
  rationale: जटिल पारिभाषिक पद की संरचना और आत्म-सम्पूर्णता का अर्थ सुरक्षित रखा गया है।
- source_word: Great Sophia
  choice: महान सोफिया
  rationale: ‘सोफिया’ को व्यक्तिनाम/पारिभाषिक नाम के रूप में लिप्यंतरित किया गया है; इसे केवल ‘बुद्धि’ कहने से यहाँ का व्यक्तिकरण धुँधला पड़ सकता था।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: पुरुष और स्त्री दोनों स्वरूपों की स्पष्टता बनाए रखने वाला आधुनिक मानक पद है।
- source_word: First-Begetting
  choice: प्रथम-जनक
  rationale: असामान्य स्रोत-पद को सामान्य ‘पहलौठा’ में विलीन किए बिना उसकी सक्रिय जनन-संबंधी ध्वनि बचाई गई है।
- source_word: aeons
  choice: युगों
  rationale: सामान्य पाठक के लिए बोधगम्य विकल्प; प्रसंग में ब्रह्मांडीय काल/क्षेत्र का संभावित पारिभाषिक अर्थ टिप्पणी में स्वीकार किया गया है।
- source_word: reflections
  choice: प्रतिरूपों
  rationale: ‘प्रतिबिंब’ और ‘विचार’ के बीच अंग्रेज़ी साक्ष्य की अस्पष्टता में, पिता से प्राप्त स्वरूपों की ध्वनि वाला अपेक्षाकृत खुला विकल्प चुना गया है।
- source_word: self-begotten
  choice: स्वयं-उत्पन्न
  rationale: किसी बाहरी जनक के बिना स्वयं से उत्पत्ति का भाव देता है और ‘स्वयं-पूर्ण’ से अलग पद बनाए रखता है।
theological_decisions:
- issue: पहलौठे का पुरुष और स्त्री नाम
  choice: एक ही उभयलिंगी सत्ता के लिए ‘उसका पुरुष-नाम’ और ‘उसका स्त्री-नाम’ रखा गया
  alternative: दो अलग व्यक्तियों अथवा पुत्र और माता के रूप में व्याख्या करना
  rationale: साक्ष्य एक उभयलिंगी पहलौठे के दो नाम प्रस्तुत करता है; अनुवाद ने इस असामान्य संरचना को सिद्धांतगत रूप से सरल नहीं किया।
- issue: ‘मानव,’ ‘मनुष्य का पुत्र,’ और ‘परमेश्वर का पुत्र’ का संबंध
  choice: तीनों उपाधियों को अलग रूप में बनाए रखा
  alternative: उन्हें एक समान उपाधि में मिला देना
  rationale: वक्ता स्वयं इनके संबंध की व्याख्या कर रहा है; पूर्वनिर्धारित समतुल्यता थोपना उचित नहीं।
- issue: आत्मा और ज्योति से स्वर्गदूतों की सृष्टि
  choice: ‘आत्मा और ज्योति से’
  alternative: ‘आत्मा और ज्योति के द्वारा’ या ‘आत्मा तथा ज्योति की ओर से’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य पदार्थ, साधन या स्रोत के संबंध को निर्णायक रूप से स्पष्ट नहीं करता; ‘से’ इस अस्पष्टता को पर्याप्त रूप से खुला रखता है।
- issue: वक्ता का अनंत ज्योति से उत्पन्न होना
  choice: ‘मैं ... ज्योति से उत्पन्न हुआ’
  alternative: ‘मैं ... ज्योति से आया’
  rationale: साक्ष्य में उत्पत्ति का दावा है; उसे केवल आगमन में हल्का नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। गूढ़ पारिभाषिक नाम ‘सोफिया’ को लिप्यंतरित रखा गया है। आदरसूचक बहुवचन का प्रयोग यीशु/उद्धारकर्ता के लिए किया गया है। स्रोत-समीक्षा लंबित होने के कारण असामान्य पदों और अस्पष्ट संबंधों को अत्यधिक सहज बनाकर निर्णायक व्याख्या नहीं थोपी गई।
