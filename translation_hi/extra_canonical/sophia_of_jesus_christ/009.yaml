  text: 'Mary asked him, “Holy Lord, where did your disciples come from, where are they going, and how should they act here?”


    The perfect Savior said to them, “I want you to know that Sophia, the Mother of the World and the consort, wanted by herself, without her male counterpart, to bring these into existence. However, by the will of the Father of the World, so that his ungraspable benevolence could be manifested, he created the curtain between the immortals and those that arrived thereafter, so that the result could follow that [ . . . ]


    (Coptic pages 115-116 missing)


    [] “[. . .] and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory, and [honor and] the gift of [the Father of the World].


    “[Consequently], whoever knows [the Father in perfect] knowledge [will go] to the Father [and repose in] the unbegotten [Father]. However, [whoever knows him imperfectly] will go [to the deficiency] and the repose [of the Ogdoad].


    “[Now], whoever silently knows the immortal [Spirit] of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of [] the Son of Man, he can go to the dwelling-places of those in the Ogdoad.”'
translation:
  language: hi
  text: 'मरियम ने उससे पूछा, “पवित्र प्रभु, आपके शिष्य कहाँ से उत्पन्न हुए, वे कहाँ जा रहे हैं, और उन्हें यहाँ किस प्रकार आचरण करना चाहिए?”


    सिद्ध उद्धारकर्ता ने उनसे कहा, “मैं चाहता हूँ कि तुम जानो कि सोफिया—जगत की माता और संगिनी—ने अपने पुरुष समकक्ष के बिना, अकेले ही, इन्हें अस्तित्व में लाना चाहा। किंतु जगत के पिता की इच्छा से, ताकि उसकी अगम्य परोपकारिता प्रकट हो सके, उसने अमर प्राणियों और उनके बाद आनेवालों के बीच एक परदा बनाया, ताकि उसका परिणाम यह हो कि [ . . . ][a]


    (कॉप्टिक पांडुलिपि के पृष्ठ 115–116 लुप्त हैं।)[b]


    [] “[. . .] और श्वास, और दो से एक हो सको, जैसा वह आरंभ में था, ताकि तुम बहुत फल उत्पन्न कर सको और अकथनीय आनंद और महिमा में, तथा [सम्मान और] [जगत के पिता] की देन में, उसके पास ऊपर चढ़ सको जो आरंभ से है।[c]


    “[इसलिए], जो कोई [पिता को सिद्ध] ज्ञान से जानता है, [वह] पिता के पास [जाएगा और] अजन्मे [पिता] में [विश्राम पाएगा]। किंतु [जो उसे अपूर्ण रीति से जानता है], वह [अपूर्णता] और [ओगदोआद के] विश्राम में [जाएगा]।[d]


    “[अब], जो कोई मनन करते हुए और सत्य से सहमत होकर प्रकाश के अमर [आत्मा] को मौन में जानता है, यदि वह मुझे अदृश्य के चिह्न देता है, तो वह मौन आत्मा में एक ज्योति बन जाएगा। जो कोई ज्ञान और प्रेम में मनुष्य के पुत्र को जानता है, यदि वह मुझे [] मनुष्य के पुत्र का एक चिह्न देता है, तो वह ओगदोआद में रहनेवालों के निवास-स्थानों में जा सकता है।”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठक और बिंदु पांडुलिपि की क्षति अथवा आधुनिक संपादकीय पुनर्स्थापन को दर्शाते हैं। इस वाक्य का अंत सुरक्षित नहीं है।
    reason: खंडित पाठ और अनिश्चित पुनर्स्थापन को स्पष्ट करना।
  - marker: b
    text: यहाँ कॉप्टिक पांडुलिपि के दो पृष्ठ लुप्त हैं; इसलिए कथन का एक बड़ा भाग उपलब्ध नहीं है।
    reason: प्रमुख भौतिक पाठ-हानि बताना।
  - marker: c
    text: इस अनुच्छेद का आरंभ लुप्त अंश के बीच से होता है; आरंभिक ‘और श्वास’ का संबंध पहले के अनुपलब्ध वाक्य से है।
    reason: खंड के असामान्य व्याकरण और संदर्भ-विच्छेद को समझाना।
  - marker: d
    text: ‘ओगदोआद’ एक तकनीकी ब्रह्मांड-विज्ञान संबंधी नाम है, जिसका सामान्य अर्थ ‘आठ का समूह’ या ‘आठवाँ क्षेत्र’ हो सकता है; यहाँ इसे नाम के रूप में रखा गया है।
    reason: अपरिचित तकनीकी पद की सीमित व्याख्या देना, बिना अर्थ को निश्चित किए।
  - marker: e
    text: ‘[]’ उस स्थान पर क्षतिग्रस्त या अनुपलब्ध पाठ को दर्शाता है; इस कारण ‘चिह्न’ से पहले का संबंध पूरी तरह स्पष्ट नहीं है।
    reason: अंतिम वाक्य में वास्तविक पाठगत रिक्ति सुरक्षित रखना।
lexical_decisions:
- source_word: Sophia
  choice: सोफिया
  rationale: इसे केवल ‘बुद्धि’ करने से इस ग्रंथ में व्यक्तित्व/दैवी सत्ता के रूप में प्रयुक्त नाम अस्पष्ट हो सकता था; इसलिए नाम का लिप्यंतरण रखा गया।
- source_word: consort
  choice: संगिनी
  rationale: संबंधसूचक अर्थ को स्वाभाविक हिंदी में रखा गया, बिना विवाह-संबंध की अतिरिक्त निश्चितता आरोपित किए।
- source_word: male (counterpart)
  choice: पुरुष समकक्ष
  rationale: ‘पुरुष’ और पूरक/प्रतिरूपी संबंध दोनों को बचाता है; केवल ‘पति’ कहना स्रोत से अधिक विशिष्ट होता।
- source_word: curtain
  choice: परदा
  rationale: दो लोक-समूहों के बीच विभाजक आवरण की मूर्त छवि सुरक्षित रखता है।
- source_word: unbegotten
  choice: अजन्मा
  rationale: जिसकी उत्पत्ति या जन्म नहीं हुआ, उस तकनीकी धार्मिक अभिप्राय को संक्षेप में व्यक्त करता है।
- source_word: Ogdoad
  choice: ओगदोआद
  rationale: विशिष्ट ब्रह्मांड-विज्ञान संबंधी पद को व्याख्यात्मक अनुवाद से सीमित करने के बजाय लिप्यंतरित किया गया।
- source_word: Son of Man
  choice: मनुष्य का पुत्र
  rationale: पारंपरिक पदबंध को रखा गया और उसकी संभावित उपाधिगत अर्थवत्ता को खुला छोड़ा गया।
- source_word: repose
  choice: विश्राम
  rationale: गंतव्य, स्थिरता और निवास-सदृश धार्मिक अर्थ को सहज हिंदी में बनाए रखता है।
theological_decisions:
- issue: सोफिया की स्वतंत्र सृष्टि-इच्छा
  choice: ‘अपने पुरुष समकक्ष के बिना, अकेले ही’
  alternative: ‘बिना पति के’
  rationale: स्रोत की ब्रह्मांड-विज्ञान संबंधी लैंगिक पूरकता को रखा गया, पर वैवाहिक अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- issue: Father of the World में सर्वनाम का संदर्भ
  choice: ‘उसने ... परदा बनाया’
  alternative: कर्तारहित वाक्य या सोफिया को कर्ता मानना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में निकटतम व्याकरणिक संदर्भ जगत का पिता है; फिर भी पांडुलिपि-हानि के कारण आगे की परिणति अधूरी रखी गई।
- issue: पूर्ण और अपूर्ण ज्ञान के भिन्न गंतव्य
  choice: दोनों गंतव्यों का अंतर जस का तस रखा
  alternative: उन्हें एक ही अंतिम उद्धार की अवस्थाएँ बताना
  rationale: पाठ की धार्मिक श्रेणीबद्धता और तनाव को बिना सामंजस्य स्थापित किए सुरक्षित रखा गया।
- issue: ओगदोआद का अर्थ
  choice: अव्याख्यायित तकनीकी नाम ‘ओगदोआद’
  alternative: ‘आठवाँ लोक’ या ‘आठ का मंडल’
  rationale: प्रत्यक्ष कॉप्टिक समीक्षा के अभाव में किसी एक ब्रह्मांड-विज्ञान संबंधी व्याख्या को आरोपित नहीं किया गया।
- issue: ‘signs/sign’ का धार्मिक आशय
  choice: ‘चिह्न’
  alternative: ‘प्रमाण’, ‘संस्कार’ या ‘गुप्त संकेत’
  rationale: पाठ यह स्पष्ट नहीं करता कि ये पहचान-चिह्न, प्रमाण, अनुष्ठानिक संकेत या कुछ और हैं; इसलिए व्यापक शब्द चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। तकनीकी नाम ‘सोफिया’ और ‘ओगदोआद’ लिप्यंतरित हैं। सभी वर्गाकार कोष्ठक, रिक्तियाँ और पृष्ठ-हानि के संकेत जानबूझकर सुरक्षित रखे गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष कॉप्टिक स्रोत-समीक्षा अभी लंबित है।
