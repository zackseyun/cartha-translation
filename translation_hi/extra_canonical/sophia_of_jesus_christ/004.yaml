translation:
  language: hi
  text: 'मरियम ने उनसे पूछा, “तो फिर, प्रभु, हम उसे कैसे जान सकते हैं?”


    सिद्ध उद्धारकर्ता ने कहा, “छिपी हुई वस्तुओं से आरम्भ करके दृश्य वस्तुओं के छोर तक जाओ; तब विचार का प्रसरण स्वयं तुम पर प्रकट करेगा कि अदृश्य वस्तुओं पर विश्वास दृश्य वस्तुओं में कैसे पाया जाता है—वे वस्तुएँ जो अजन्मे पिता की हैं। जिसके सुनने के कान हों, वह सुन ले!


    “संसार के प्रभु को ‘पिता’ नहीं, बल्कि ‘आदिपिता’ कहा जाता है, <क्योंकि पिता ही> उन सबका मूल-सिद्धान्त है जो दृश्य होने वाले हैं; फिर भी वह [] आदि-रहित [आदिपिता] है। वह अपने भीतर स्वयं को ऐसे देखता है जैसे दर्पण में। वह अपने ही स्वरूप में दिव्य स्वयं-पिता के रूप में, और <मानो> प्रतिबिम्बित होने वालों के ऊपर प्रतिबिम्ब दिखाने वाले के रूप में प्रकट हुआ है—वह प्रथम अस्तित्वमान, अजन्मा पिता है। वास्तव में उसकी आयु <उस> प्रकाश के समान है जो उससे पहले है, पर सामर्थ्य में वह उसके बराबर नहीं है।


    “इसके बाद उसने बहुत-से प्रतिबिम्बित, स्वयं-उत्पन्न जनों को प्रकट किया, जो आयु और सामर्थ्य में समान हैं, महिमा में स्थित हैं, और असंख्य हैं। उनके समुदाय को ‘वह पीढ़ी जिसके ऊपर कोई राज्य नहीं’ कहा जाता है; उसी में तुम स्वयं इन <राज्यों> के बीच दृश्य हुए हो। और वह समूही भीड़, जिसके ऊपर कोई राज्य नहीं, [] ‘अजन्मे पिता की सन्तान’, ‘परमेश्वर’, ‘[उद्धारकर्ता]’ और ‘परमेश्वर का पुत्र’ कहलाती है; उसका स्वरूप तुम्हारे साथ निवास करता है।


    “वह अज्ञेय है, हर अविनाशी महिमा और अकथनीय आनन्द से परिपूर्ण। वे सब उसमें विश्राम करते हैं और उसकी कभी न बदलने वाली महिमा के कारण अकथनीय आनन्द तथा असीम उल्लास में निरन्तर मग्न रहते हैं। इससे पहले समस्त युगों और उनके लोकों में यह न कभी सुना गया था, न जाना गया था।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी शेष है। कोणीय कोष्ठक < > सम्पादकीय पूर्ति, वर्ग कोष्ठक [ ] पुनर्स्थापित पाठ, और खाली [] पाण्डुलिपि की अपूर्णता दर्शाते हैं। ‘युग’ उस तकनीकी पद का अनुवाद है जिसे प्रायः ‘एओन’ भी कहा जाता है और जो काल-युग के साथ किसी दिव्य लोक या सत्ता का संकेत भी दे सकता है।
    reason: आधार-साक्ष्य की सीमा, पाठालोचन-चिह्नों और ‘aeons’ की वास्तविक अर्थगत व्यापकता को स्पष्ट करना।
lexical_decisions:
- source_word: perfect Savior
  choice: सिद्ध उद्धारकर्ता
  rationale: ‘सिद्ध’ पूर्णता/परिपक्वता का धार्मिक-दार्शनिक भाव रखता है और सहज हिन्दी भी है।
- source_word: emanation of Thought
  choice: विचार का प्रसरण
  rationale: ‘प्रसरण’ स्रोत की उत्सर्जन/निःसरण-संबंधी अवधारणा को बिना किसी विशिष्ट सम्प्रदायगत व्याख्या के व्यक्त करता है।
- source_word: unbegotten Father
  choice: अजन्मा पिता
  rationale: यह ‘जिसे जन्म नहीं दिया गया’ का संक्षिप्त और प्रतिष्ठित हिन्दी रूप है; इसे केवल ‘अनादि’ करने से जन्म-अभाव का विशेष अर्थ मिट जाता।
- source_word: Forefather
  choice: आदिपिता
  rationale: ‘पूर्वज’ की तुलना में ‘आदिपिता’ Father/Forefather के शब्द-संबंध और ब्रह्माण्डीय पदवी दोनों को बनाए रखता है।
- source_word: Self-Father
  choice: स्वयं-पिता
  rationale: असामान्य तकनीकी पद की संरचना जानबूझकर बनाए रखी गई है, ताकि उसे सहज बनाते हुए उसका विशिष्ट अर्थ न मिटे।
- source_word: reflecting / reflector
  choice: प्रतिबिम्बित / प्रतिबिम्ब दिखाने वाला
  rationale: दर्पण के निकटवर्ती बिम्ब और दोनों संबद्ध पदों का शब्दगत संबंध सुरक्षित रहता है।
- source_word: self-begotten ones
  choice: स्वयं-उत्पन्न जन
  rationale: शाब्दिक ‘स्वयं-जन्मे’ की सम्भावित अस्पष्टता से बचते हुए आत्म-उद्भव का भाव रखा गया है।
- source_word: Generation Above Which There Is No Kingdom
  choice: वह पीढ़ी जिसके ऊपर कोई राज्य नहीं
  rationale: शीर्षकीय संज्ञा को व्याख्यात्मक रूप से बदले बिना औपचारिक और बोधगम्य हिन्दी में रखा गया है।
- source_word: aeons
  choice: युगों
  rationale: सामान्य पाठक के लिए बोधगम्य समतुल्य; यहाँ तकनीकी बहुअर्थकता के कारण पादटिप्पणी दी गई है।
theological_decisions:
- issue: ‘Father,’ ‘Forefather,’ और ‘unbegotten Father’ के बीच भेद
  choice: ‘पिता’, ‘आदिपिता’ और ‘अजन्मा पिता’ को अलग पदों के रूप में रखा गया
  alternative: सभी को ‘परम पिता’ या ‘अनादि पिता’ में समतल करना
  rationale: पाठ का ब्रह्माण्डीय क्रम और उसका वास्तविक तनाव सुरक्षित रहना चाहिए।
- issue: पहले के प्रकाश के साथ समान आयु, पर असमान सामर्थ्य
  choice: विरोधाभासी-सा कथन ज्यों का त्यों रखा गया
  alternative: ‘प्रकाश’ को पिता का गुण मानकर कथन को सामंजस्यपूर्ण बनाना
  rationale: स्रोत की अस्पष्ट सत्ता-संबंधी श्रेणी को चुपचाप हल करना उचित नहीं।
- issue: समूही भीड़ के लिए एकवचन उपाधियाँ ‘God,’ ‘Savior,’ और ‘Son of God’
  choice: व्याकरणिक असंगति सहित उपाधियों को एकवचन में रखा गया
  alternative: उन्हें बहुवचन ‘देवता/उद्धारकर्ता/पुत्र’ करना
  rationale: साक्ष्य का सामूहिक-एकवचन तनाव अनुवाद में सुरक्षित रखा गया है।
- issue: ‘whose likeness dwells with you’ में पूर्वपद की अस्पष्टता
  choice: ‘उसका स्वरूप’ रखा गया
  alternative: स्पष्ट करके ‘परमेश्वर के पुत्र का स्वरूप’ कहना
  rationale: ‘whose’ किस पद या समूचे समुदाय की ओर संकेत करता है, इसे पाठ निर्णायक रूप से स्पष्ट नहीं करता।
- issue: क्षतिग्रस्त और पुनर्स्थापित पाठ
  choice: '[] तथा कोणीय/वर्ग कोष्ठक सुरक्षित रखे गए'
  alternative: रिक्तियों को अनुमान से भर देना या चिह्न हटा देना
  rationale: पाण्डुलिपि की क्षति और सम्पादकीय पुनर्स्थापन को पाठक से छिपाया नहीं गया।
