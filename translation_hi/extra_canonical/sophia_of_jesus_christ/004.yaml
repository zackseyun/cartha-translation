  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य। ब्रह्माण्डीय तकनीकी पदों में नियंत्रित औपचारिकता रखी गई है। स्रोत-साक्ष्य की असामान्य वाक्यरचना को जहाँ अर्थगत तनाव वहन करती है वहाँ सुरक्षित रखा गया, जबकि हिन्दी प्रवाह के लिए विराम-चिह्न और वाक्य-विन्यास स्वाभाविक किए गए हैं।
