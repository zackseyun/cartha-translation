translation:
  language: hi
  text: 'उसके शिष्यों ने फिर कहा, “हमें साफ़-साफ़ बताइए कि वे अदृश्य लोकों से—जो अमर है, वहाँ से—मरणशीलता के संसार में कैसे उतरे।”


    सिद्ध उद्धारकर्ता ने कहा, “मनुष्य के पुत्र ने अपनी सहचरी सोफिया के साथ संगति की और एक प्रबल उभयलिंगी ज्योति प्रकट की। उसका पुरुष नाम ‘उद्धारकर्ता, सबका जनक’ कहलाता है। उसका स्त्री नाम ‘सबकी जननी सोफिया’ है; कुछ लोग उसे ‘पिस्टिस’ कहते हैं।[a]


    “जैसे [] ज्योति की एक बूँद, संसार में प्रवेश करनेवाला हर व्यक्ति उसके द्वारा सर्वशक्तिमान के संसार में भेजा जाता है, ताकि वह उसकी निगरानी में रहे।[b] और सोफिया की इच्छा से उसके विस्मरण के बंधन ने ज्योति को बाँध दिया, ताकि इसके द्वारा यह बात पूरे दरिद्र संसार पर <प्रकट> हो सके—अर्थात सर्वशक्तिमान का घमंड और अंधापन, और वह अज्ञान जिसने उसे नाम दिया।[c]


    “परंतु मैं महान ज्योति की इच्छा से ऊपर के स्थानों से उत्पन्न हुआ। मैंने उस बंधन से <मुक्त करते हुए> चोरों की गतिविधि रोक दी। मैंने सोफिया की भेजी हुई उस बूँद को जगा दिया, ताकि वह मेरे द्वारा बहुत फल लाए, पूर्ण हो जाए और फिर कभी त्रुटिपूर्ण न बने; बल्कि मेरे द्वारा—जो महान उद्धारकर्ता हूँ—<जोड़ दी जाए>, ताकि उसकी महिमा प्रकट हो सके और सोफिया भी उस त्रुटि से सुधारी जा सके; ताकि उसकी [] संतान फिर कभी त्रुटिपूर्ण न हो, बल्कि आदर और महिमा पाए, अपने पिता के पास ऊपर चढ़े और पुरुष ज्योति की वाणी समझे।[d]


    “और तुम्हें पुत्र ने भेजा था—वही पुत्र जो स्वयं भेजा गया था—ताकि तुम ज्योति पाओ और शासक शक्तियों के विस्मरण से अपने आपको अलग कर लो; और तुम्हारे कारण वह फिर कभी प्रकट न हो—अर्थात वह अशुद्ध रगड़, जो उनके शिश्न से निकली भयानक आग से उत्पन्न होती है। उनके बुरे इरादे को पैरों तले रौंद डालो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सोफिया’ यूनानी नाम/शब्द है जिसका अर्थ ‘बुद्धि’ है; ‘पिस्टिस’ का अर्थ ‘विश्वास’ हो सकता है। यहाँ दोनों को तकनीकी नामों के रूप में लिप्यंतरित किया गया है।
    reason: नाम और अर्थ के बीच संबंध स्पष्ट करना, बिना मुख्य पाठ में अर्थ को निश्चित किए।
  - marker: b
    text: ‘जैसे []’ में कोष्ठक पांडुलिपि-साक्ष्य में लुप्त या क्षतिग्रस्त अंश का संकेत है। इस वाक्य में ‘उसके’ का संदर्भ भी अनिश्चित है।
    reason: पाठीय क्षति और सर्वनाम-संदर्भ की अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: कोणीय कोष्ठक < > संपादकीय रूप से पुनःस्थापित शब्दों को दिखाते हैं। ‘वह अज्ञान जिसने उसे नाम दिया’ का संबंध और आशय पाठ में अस्पष्ट है।
    reason: साक्ष्य के पुनर्निर्मित और अस्पष्ट स्वरूप की सूचना देना।
  - marker: d
    text: ‘उसकी [] संतान’ में पांडुलिपि का एक अंश लुप्त है। ‘उसकी महिमा’ और अन्य सर्वनामों के सटीक संदर्भ भी निश्चित नहीं हैं।
    reason: क्षतिग्रस्त पाठ और वास्तविक व्याकरणिक/संदर्भगत अनिश्चितता को चिह्नित करना।
lexical_decisions:
- source_word: Sophia
  choice: सोफिया
  rationale: व्यक्तिवाचक/तकनीकी नाम के रूप में लिप्यंतरण रखा गया; इसे केवल ‘बुद्धि’ कर देने से पात्र और गुण के बीच की मूल अस्पष्टता मिट सकती थी।
- source_word: Pistis
  choice: पिस्टिस
  rationale: तकनीकी नाम को लिप्यंतरित किया गया; संभावित अर्थ ‘विश्वास’ को पाठ में आरोपित नहीं किया गया।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: ज्योति के पुरुष और स्त्री दोनों नामों से जुड़े स्पष्ट लैंगिक तनाव को सुरक्षित रखता है।
- source_word: All-Begetter
  choice: सबका जनक / सबकी जननी
  rationale: मूल उपाधि को पुरुष और स्त्री रूप के अनुसार स्वाभाविक हिन्दी में अलग-अलग रूप दिया गया।
- source_word: authorities
  choice: शासक शक्तियाँ
  rationale: केवल सांसारिक ‘अधिकारी’ का अर्थ टालते हुए ब्रह्मांडीय सत्ता का भाव बनाए रखा गया।
- source_word: phallus
  choice: शिश्न
  rationale: मूल की स्पष्ट शारीरिक भाषा को शिष्टोक्ति द्वारा नरम नहीं किया गया।
theological_decisions:
- issue: ‘Almighty’ का संदर्भ और उसका नकारात्मक चित्रण
  choice: ‘सर्वशक्तिमान’ को पदवी के रूप में रखा और घमंड, अंधापन तथा अज्ञान से उसका संबंध यथावत रहने दिया।
  alternative: इसे परमेश्वर कहकर या सकारात्मक अर्थ में पुनर्व्याख्यायित करना।
  rationale: इस ग्रंथ की विशिष्ट ब्रह्मांड-रचना और धार्मिक तनाव को किसी बाद की मान्यतागत प्रणाली से समतल नहीं किया गया।
- issue: सोफिया की त्रुटि और सुधार
  choice: ‘त्रुटि’ और ‘सुधारी जा सके’ रखा।
  alternative: ‘पाप’ और ‘उद्धार’ जैसे अधिक सिद्धांतबद्ध शब्द।
  rationale: स्रोत-साक्ष्य जितना कहता है उससे अधिक नैतिक या पंथगत अर्थ नहीं जोड़ा गया।
- issue: ‘Son of Man’
  choice: ‘मनुष्य का पुत्र’
  alternative: ‘मानव-पुत्र’ या किसी विशिष्ट मसीही पदवी का व्याख्यात्मक रूप।
  rationale: पारंपरिक पहचान योग्य अभिव्यक्ति रखते हुए पाठ की अंतर्निहित पहचान को अनावश्यक रूप से निर्धारित नहीं किया।
- issue: सर्वनाम-संदर्भ की अस्पष्टता
  choice: ‘उसके द्वारा’, ‘उसकी निगरानी’, ‘उसकी महिमा’ जैसे संदर्भों को मूल की सीमा तक खुला रखा।
  alternative: हर सर्वनाम के स्थान पर किसी निश्चित पात्र का नाम डालना।
  rationale: अंग्रेज़ी साक्ष्य में वास्तविक संदर्भगत अस्पष्टता है और कॉप्टिक समीक्षा लंबित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु साधारण पाठक के लिए बोधगम्य। तकनीकी ग्नोस्टिक नामों को लिप्यंतरित किया गया और आवश्यक अर्थ फुटनोट में दिए गए। वर्ग कोष्ठक तथा कोणीय कोष्ठक साक्ष्य के पाठीय संकेतों के रूप में ज्यों के त्यों रखे गए। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है।
