translation:
  language: hi
  text: 'मरे हुओं में से जी उठने के बाद, उनके बारह शिष्य और सात स्त्रियाँ उनके अनुयायी बनी रहीं और गलील में उस पर्वत पर गईं जिसका नाम [पाठ लुप्त] “कटनी का स्थान और आनंद” था। जब वे इकट्ठे हुए, तो वे संसार की मूल प्रकृति, योजना, ईश्वरीय विधान, शासक शक्तियों के सामर्थ्य, और इस बात को लेकर उलझन में थे कि उद्धारकर्ता ईश्वरीय योजना के रहस्य में उनके साथ किस प्रकार व्यवहार करते हैं। उद्धारकर्ता अपने पहले के दिखाई देने वाले रूप में नहीं, बल्कि अदृश्य आत्मा के रूप में प्रकट हुए। उनकी आकृति एक ऊँचे, प्रकाशमान स्वर्गदूत जैसी थी; पर वे वास्तव में किसके समान थे, इसका वर्णन मुझे नहीं करना चाहिए, क्योंकि कोई नश्वर प्राणी उसे सह नहीं सकता। वह पूरी तरह शुद्ध और सिद्ध देह थी, वैसी ही जैसी देह के विषय में उन्होंने हमें गलील के “जैतूनों का” कहलाने वाले पर्वत पर शिक्षा दी थी।


    उन्होंने कहा, “तुम्हें शांति मिले! मैं तुम्हें अपनी शांति देता हूँ!” तब वे सब विस्मय से भर गए और डर गए।


    उद्धारकर्ता [पाठ लुप्त] हँसे और उनसे पूछा, “तुम किस बात पर विचार कर रहे हो? क्यों उलझन में हो? क्या खोज रहे हो?”


    फिलिप्पुस ने कहा, “संसार की मूल प्रकृति और उसकी योजना को।”


    उद्धारकर्ता ने उनसे कहा, “मैं चाहता हूँ कि तुम यह समझो: संसार की नींव डाले जाने से लेकर अब तक पृथ्वी पर जन्मे सभी लोग मिट्टी के बने हैं। यद्यपि उन्होंने परमेश्वर को—उसके अस्तित्व और स्वरूप को—जानने का प्रयास किया, फिर भी वे उसे खोज नहीं पाए। उनमें सबसे बड़े ज्ञानियों ने संसार की व्यवस्था और उसकी गति के आधार पर अनुमान लगाए, पर उनके अनुमान सत्य तक नहीं पहुँचे।


    “सभी दार्शनिक कहते हैं कि विश्व-व्यवस्था तीन अलग-अलग प्रकारों में से किसी एक के द्वारा संचालित होती है; इसलिए वे आपस में असहमत हैं। उनमें से कुछ मानते हैं कि संसार स्वयं अपना संचालन करता है। [पाठ लुप्त] दूसरे मानते हैं कि ईश्वरीय विधान ऐसा करता है, और कुछ अन्य कि नियति; पर इनमें से कोई बात सही नहीं है।


    “मैं फिर कहता हूँ, जिन तीन मतों का मैंने अभी उल्लेख किया, उनमें से कोई भी सत्य के निकट नहीं पहुँचता, क्योंकि वे मनुष्यों के अनुमान हैं। पर मैं अनंत ज्योति से उत्पन्न हुआ हूँ; मैं उसे जानता हूँ और यहाँ इसलिए आया हूँ कि तुम्हें ठीक-ठीक बता सकूँ कि सत्य क्या है। जो कुछ स्वयं उत्पन्न हुआ है, उसका जीवन अशुद्ध है, क्योंकि उसने स्वयं को बनाया है। ईश्वरीय विधान के मत में कोई बुद्धिमत्ता नहीं, और नियति के मत में कोई अंतर्दृष्टि नहीं।


    “पर तुम्हें जानने का वरदान दिया गया है; और जो कोई ज्ञान के योग्य है, वह उसे पाएगा—वह जो अशुद्ध रगड़ के बीज बोने से उत्पन्न नहीं हुआ, बल्कि उस प्रथम भेजे गए के द्वारा उत्पन्न हुआ है, क्योंकि वह नश्वर लोगों के बीच एक अमर है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: मुक्ति देने वाले व्यक्तित्व के लिए स्वाभाविक और धर्मवैचारिक रूप से अपेक्षाकृत तटस्थ हिन्दी पद।
- source_word: fundamental nature
  choice: मूल प्रकृति
  rationale: अस्तित्वगत ‘nature’ को ‘सार’ कहकर अत्यधिक दार्शनिक रूप से निश्चित किए बिना मूल अर्थ सुरक्षित रखता है।
- source_word: plan
  choice: योजना
  rationale: दिए गए साक्ष्य में प्रयुक्त व्यापक अर्थ को बनाए रखता है और इसे ‘सृष्टि-योजना’ तक सीमित नहीं करता।
- source_word: divine providence / providence
  choice: ईश्वरीय विधान
  rationale: सिर्फ पूर्वज्ञान नहीं, बल्कि दैवी संचालन की दार्शनिक धारणा व्यक्त करता है; प्रसंग में जिस मत का खंडन है उसे भी स्पष्ट रखता है।
- source_word: authorities
  choice: शासक शक्तियाँ
  rationale: केवल मानवीय अधिकारियों का अर्थ न देकर ब्रह्मांडीय सत्ताओं की सम्भावना बनाए रखता है।
- source_word: invisible spirit
  choice: अदृश्य आत्मा
  rationale: साक्ष्य की प्रत्यक्ष शब्दावली और उसके शरीर-विषयक तनाव को बिना समाधान किए सुरक्षित रखता है।
- source_word: Infinite Light
  choice: अनंत ज्योति
  rationale: उच्च धार्मिक शैली और मूल रूपक दोनों को बनाए रखता है।
- source_word: fate
  choice: नियति
  rationale: दार्शनिक नियतिवाद के लिए आधुनिक और सहज हिन्दी पद।
- source_word: impure rubbing
  choice: अशुद्ध रगड़
  rationale: वाक्यांश की कठिन और सम्भवतः यौन अर्थच्छाया को नरम या व्याख्यायित किए बिना यथासम्भव औपचारिक रूप से रखता है।
theological_decisions:
- issue: प्रकट रूप और सिद्ध देह के बीच तनाव
  choice: ‘अदृश्य आत्मा’ और ‘शुद्ध और सिद्ध देह’ दोनों कथनों को साथ रखा
  alternative: इसे केवल आत्मिक देह या महिमामय शरीर के रूप में समझाकर अनुवाद करना
  rationale: साक्ष्य स्वयं दोनों प्रकार की भाषा रखता है; किसी एक व्यवस्थित धर्मसिद्धान्त के अनुसार तनाव मिटाना उचित नहीं।
- issue: स्वयं उत्पन्न सत्ता का कथन
  choice: ‘जो कुछ स्वयं उत्पन्न हुआ है’ और ‘उसने स्वयं को बनाया है’
  alternative: इसे विशेष रूप से संसार, मनुष्य या किसी ज्ञात ज्ञानवादी सत्ता के रूप में पहचानना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का विषय व्यापक और कुछ अस्पष्ट है; पहचान को खुला रखा गया है।
- issue: ‘उस प्रथम भेजे गए’ की पहचान
  choice: सर्वनाम और पदवी को अनिर्दिष्ट रखा
  alternative: उसे स्पष्ट रूप से मसीह, पिता या किसी अन्य दिव्य सत्ता के रूप में नाम देना
  rationale: साक्ष्य नाम नहीं देता; धर्मवैचारिक पहचान थोपना अस्पष्टता को समाप्त कर देता।
- issue: ‘वह नश्वर लोगों के बीच एक अमर है’ का कर्ता
  choice: निकटतम व्याकरणिक पूर्वपद ‘प्रथम भेजे गए’ से जुड़ने योग्य अस्पष्टता रखी
  alternative: इसे ज्ञान पाने वाले व्यक्ति पर स्पष्ट रूप से लागू करना
  rationale: दिए गए वाक्य में सर्वनाम का संदर्भ निश्चित नहीं; हिन्दी में भी निर्णायक विस्तार नहीं जोड़ा गया।
- issue: दार्शनिक ‘ईश्वरीय विधान’ का खंडन
  choice: खंडन को मूल के अनुसार स्पष्ट रखा
  alternative: परम्परागत ईश्वरीय विधान के सिद्धान्त से मेल कराने के लिए अर्थ को नरम करना
  rationale: पाठ का धर्मवैचारिक तनाव और उसका दार्शनिक विवाद सुरक्षित रहना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। प्रत्यक्ष स्रोत-भाषा समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है। साक्ष्य के रिक्त वर्ग-कोष्ठकों को पाठ में ‘[पाठ लुप्त]’ के रूप में दिखाया गया है; इन्हें फुटनोट-चिह्न नहीं माना गया। कठिन दार्शनिक पदों को सरल किया गया है, पर उनकी वास्तविक अस्पष्टता और धर्मवैचारिक तनाव नहीं मिटाया गया।
