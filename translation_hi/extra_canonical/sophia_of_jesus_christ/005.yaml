  language: hi
  text: '### यीशु मसीह की सोफ़िया — अमर मानव, सोफ़िया और ओगदोआद


    मत्ती ने उनसे पूछा, “प्रभु, उद्धारकर्ता, मानव[a] कैसे प्रकट हुआ?”


    सिद्ध उद्धारकर्ता ने कहा, “मैं चाहता हूँ कि तुम उसे जानो जो संसार से पहले प्रकट हुआ था।


    “आरम्भ में अनन्त, स्वतः उत्पन्न, […] स्वनिर्मित पिता[b] दीप्तिमान और अवर्णनीय प्रकाश से परिपूर्ण था। जब उसने चाहा कि उसका प्रतिरूप एक महान शक्ति बने, तब उस प्रकाश का मूलकारी तत्त्व अचानक मृत्युहीन उभयलिंगी मानव के रूप में प्रकट हुआ। ऐसा इसलिए हुआ कि उस अमर मानव के द्वारा वे उद्धार पा सकें और उस व्याख्याकार के द्वारा विस्मृति से जाग उठें, जिसे भेजा गया है और जो दरिद्र लुटेरों के अन्त तक तुम्हारे साथ रहता है। उसकी सहचरी महान सोफ़िया है। स्वयंजनित पिता ने आरम्भ ही से उसे उसमें मिलन के लिए ठहराया था—उस अमर मानव से, जो सबसे पहले प्रकट हुआ, अर्थात् ईश्वरत्व और राज्य के रूप में—क्योंकि यह पिता ने प्रकट किया था, […] जिसे ‘मानव’ और ‘स्व-पिता’ कहा जाता है। और अपनी महिमा के लिए उसने एक शक्तिशाली ऐयोन[c] की सृष्टि की, जिसका नाम ओगदोआद[d] है। उसे बड़ा अधिकार दिया गया, यहाँ तक कि दरिद्र सृष्टि पर शासन करने का अधिकार भी।


    “उस प्रकाश और त्रिविध पुरुष आत्मा से, जो उसकी सहचरी सोफ़िया की है, उसने सेवा के लिए देवताओं, स्वर्गदूतों <और> प्रधान स्वर्गदूतों[e] की असंख्य सेनाएँ रचीं। ऐसा इसलिए था कि इस परमेश्वर ने ईश्वरत्व और राज्य की सृष्टि की; इसलिए उसे ‘देवताओं का परमेश्वर’ और ‘राजाओं का राजा’ कहा गया। उसमें आदि मानव का अपना अद्वितीय मन और विचार है—ठीक-ठीक कहें तो विचार, मनन और चिंतन, विवेक, […] और सामर्थ्य। ये सभी विद्यमान गुण सिद्ध और मृत्युहीन हैं।


    “अविनाशिता की दृष्टि से वे वास्तव में समान हैं, पर सामर्थ्य की दृष्टि से उनमें वैसा ही अन्तर है जैसा पिता और पुत्र के बीच, <और पुत्र> और विचार के बीच, तथा विचार और उसके बाद शेष रहनेवाले के बीच है। जैसा मैंने पहले कहा, सृजी हुई सत्ताओं में एकक[f] सबसे पहले आता है। और बाकी सबके बाद जो कुछ भी प्रकट हुआ, वह उसकी सामर्थ्य से प्रकट किया गया। सृजी हुई सत्ताओं से वह सब प्रकट हुआ जो गढ़ा गया; जो गढ़ा गया उससे वह प्रकट हुआ जिसे रूप दिया गया; और जिसे रूप दिया गया उससे वह प्रकट हुआ जिसका नाम रखा गया। इसी प्रकार आरम्भ से अन्त तक अजनित सत्ताओं के बीच भेद उत्पन्न हुआ।”


    [a] यहाँ “मानव” किसी सामान्य मनुष्य के बजाय एक आदिम, दिव्य सत्ता की उपाधि है।


    [b] साक्ष्य में “स्वतः उत्पन्न” और “स्वनिर्मित” के बीच पाठ लुप्त है।


    [c] “ऐयोन” इस ग्रन्थ की विश्व-रचना संबंधी शब्दावली में एक महान, अलौकिक युग-सत्ता या लोक-सत्ता है।


    [d] “ओगदोआद” का शाब्दिक आशय आठ का समूह है; यहाँ यह एक शक्तिशाली ऐयोन का नाम है।


    [e] कोणीय कोष्ठक साक्ष्य के सम्पादक द्वारा पुनःस्थापित शब्द दर्शाते हैं।


    [f] “एकक” उस मूल एकत्व के लिए प्रयुक्त दार्शनिक पद “मोनाड” का अनुवाद है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मानव” किसी सामान्य मनुष्य के बजाय एक आदिम, दिव्य सत्ता की उपाधि है।
    reason: तकनीकी शीर्षक को सामान्य जातिवाचक अर्थ से अलग करना।
  - marker: b
    text: साक्ष्य में “स्वतः उत्पन्न” और “स्वनिर्मित” के बीच पाठ लुप्त है।
    reason: वर्ग कोष्ठकों से संकेतित पाठ-हानि को स्पष्ट करना।
  - marker: c
    text: “ऐयोन” इस ग्रन्थ की विश्व-रचना संबंधी शब्दावली में एक महान, अलौकिक युग-सत्ता या लोक-सत्ता है।
    reason: अपरिचित तकनीकी पद की संक्षिप्त व्याख्या।
  - marker: d
    text: “ओगदोआद” का शाब्दिक आशय आठ का समूह है; यहाँ यह एक शक्तिशाली ऐयोन का नाम है।
    reason: नाम के व्युत्पत्तिगत और प्रसंगगत आशय की पहचान।
  - marker: e
    text: कोणीय कोष्ठक साक्ष्य के सम्पादक द्वारा पुनःस्थापित शब्द दर्शाते हैं।
    reason: सम्पादकीय पुनःस्थापन संकेत को सुरक्षित और स्पष्ट रखना।
  - marker: f
    text: “एकक” उस मूल एकत्व के लिए प्रयुक्त दार्शनिक पद “मोनाड” का अनुवाद है।
    reason: दार्शनिक तकनीकी पद की पहचान।
lexical_decisions:
- source_word: the Human
  choice: मानव
  rationale: यहाँ यह साधारण मानवजाति नहीं, एक आदिम दिव्य सत्ता की तकनीकी उपाधि है; पद को संक्षिप्त रखा और पादटिप्पणी में अर्थ स्पष्ट किया।
- source_word: perfect Savior
  choice: सिद्ध उद्धारकर्ता
  rationale: ‘सिद्ध’ पूर्णता और परिपूर्ण अवस्था दोनों को व्यक्त करता है और धार्मिक आशय को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: self-grown / self-made / self-begotten
  choice: स्वतः उत्पन्न / स्वनिर्मित / स्वयंजनित
  rationale: साक्ष्य में आए निकटवर्ती किन्तु भिन्न पदों का भेद हिन्दी में बनाए रखा गया है।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: मूल अवधारणा के स्त्री-पुरुष दोनों स्वरूपों को सीधे और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Sophia
  choice: सोफ़िया
  rationale: इसे केवल ‘बुद्धि’ न करके नाम/हाइपोस्टैसिस के रूप में लिप्यंतरित किया गया है।
- source_word: aeon
  choice: ऐयोन
  rationale: इस गूढ़ विश्व-रचना संबंधी तकनीकी पद को लिप्यंतरित किया गया और पादटिप्पणी में कार्यात्मक अर्थ दिया गया।
- source_word: Ogdoad
  choice: ओगदोआद
  rationale: सत्ता के नाम को लिप्यंतरित रखा; ‘अष्टक’ कर देने से नाम और तकनीकी आशय धुँधला पड़ता।
- source_word: monad
  choice: एकक
  rationale: दार्शनिक मूल-एकत्व का बोध कराने वाला सुबोध हिन्दी पद; पादटिप्पणी में ‘मोनाड’ की पहचान दी गई।
- source_word: unbegotten ones
  choice: अजनित सत्ताएँ
  rationale: ‘अजनित’ मूल की नकारात्मक उत्पत्ति-संज्ञा को सुरक्षित रखता है; ‘सत्ताएँ’ से बहुवचन संदर्भ स्पष्ट होता है।
theological_decisions:
- issue: ‘Human’ की पहचान
  choice: इसे ‘मानव’ नामक आदिम दिव्य सत्ता की उपाधि के रूप में रखा गया।
  alternative: इसे सामान्य ‘मनुष्य’ या किसी विशिष्ट बाद की धार्मिक पहचान से जोड़ना।
  rationale: अंश स्वयं ‘अमर मानव’, ‘आदि मानव’ और ‘स्व-पिता’ जैसी उपाधियाँ देता है; किसी सम्प्रदायगत पहचान को आरोपित नहीं किया गया।
- issue: सोफ़िया और अमर मानव के संबंध का कठिन वाक्य-विन्यास
  choice: सहचरी, मिलन और प्राकट्य के संबंधों को स्रोत-साक्ष्य की असहजता सहित रखा गया।
  alternative: वाक्य को पुनर्गठित करके यह निश्चित करना कि प्रत्येक उपवाक्य का कर्ता केवल पिता, सोफ़िया या मानव है।
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में व्याकरणिक संबंध अस्पष्ट हैं और कॉप्टिक समीक्षा लंबित है; अतः कृत्रिम निश्चितता से बचा गया।
- issue: ‘देवताओं का परमेश्वर’
  choice: बहुवचन ‘देवताओं’ को यथावत रखा गया।
  alternative: इसे ‘सभी शक्तियों का प्रभु’ जैसे एकेश्वरवादी रूप में नरम करना।
  rationale: पाठ स्वयं देवताओं, स्वर्गदूतों और प्रधान स्वर्गदूतों की सृष्टि कहता है; धार्मिक तनाव को सुरक्षित रखना आवश्यक है।
- issue: सृजी हुई और अजनित सत्ताओं के बीच तनाव
  choice: अन्तिम अनुच्छेद में ‘सृजी हुई सत्ताएँ’ और ‘अजनित सत्ताएँ’ दोनों को बिना सामंजस्य बैठाए रखा गया।
  alternative: एक को दूसरे के अनुरूप बदल देना।
  rationale: यह वास्तविक पाठगत/वैचारिक तनाव हो सकता है; स्रोत-भाषा समीक्षा से पहले इसे चुपचाप हल नहीं किया जाना चाहिए।
- issue: ‘impoverished thieves’ का असामान्य पदबंध
  choice: ‘दरिद्र लुटेरे’ का निकट अनुवाद रखा गया।
  alternative: इसे व्याख्यात्मक रूप से ‘अभावग्रस्त शासक’ या ‘दुष्ट शक्तियाँ’ करना।
  rationale: उपलब्ध साक्ष्य अस्पष्ट है; निकट अनुवाद मूल की कठिनता को बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय गद्य रखा गया है। ‘सोफ़िया’, ‘ऐयोन’ और ‘ओगदोआद’ जैसे विशिष्ट गूढ़ पदों को लिप्यंतरित कर पादटिप्पणियों में समझाया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्राचीन कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग कोष्ठक पाठ-हानि और कोणीय कोष्ठक सम्पादकीय पुनःस्थापन दर्शाते हैं।
