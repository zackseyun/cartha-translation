    rationale: यह पद आधुनिक हिन्दी में अप्राकृतिक और वस्तु/सत्ता के बजाय व्यक्ति-सदृश लगता है। ‘आश्रित सत्ता’ दार्शनिक विरोधाभास को अधिक सुगमता से व्यक्त करता है, बिना किसी निश्चित दार्शनिक तंत्र को आरोपित किए।
