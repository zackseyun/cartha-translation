  text: 'Matthew said [] to him, “Lord, no one can discover the truth except through you, so teach us the truth.”


    The Savior said, “He Who Is cannot be expressed. No power knew him, no authority, nothing contingent, nor anything created from the foundation of the world until now, but he alone and any to whom he wishes to grant revelation through the one who originated from the First Light. From this point on, I am the Great Savior. This is because he is deathless and eternal.


    “He is eternal, without birth, because anyone who has been born will be destroyed (in death). He is unbegotten, without beginning, because anyone who had a beginning will have an end. Because no one rules over him, he is nameless, since anyone with a name has been created by someone else. And He Who Is has an appearance uniquely his own, [] unlike anything you have seen and understood. Yet it is an enigmatic appearance that transcends everything and surpasses the world. It gazes in every direction (simultaneously) and beholds itself from itself.


    “Because it is infinite, he can never be comprehended.

    He is forever indestructible, with nothing resembling him.

    He is the good that never changes.

    He is without defect.

    He is eternal.

    He is blessed.

    He cannot be known, but he knows himself.

    He is beyond measure; he cannot be traced out.

    He is perfect, without imperfection.

    His blessedness is indestructible.

    He is called ‘Father of the World.’”'
translation:
  language: hi
  text: 'मत्ती ने उससे [a] कहा, “प्रभु, आपके द्वारा ही सत्य का पता लगाया जा सकता है; इसलिए हमें सत्य की शिक्षा दीजिए।”


    उद्धारकर्ता ने कहा, “जो है, उसे शब्दों में व्यक्त नहीं किया जा सकता। न किसी शक्ति ने उसे जाना, न किसी सत्ता ने, न किसी आकस्मिक अस्तित्व ने, और न संसार की नींव डाले जाने से लेकर अब तक सृजी गई किसी वस्तु ने। केवल वही अपने आपको जानता है, और वे लोग भी जिन्हें वह प्रथम ज्योति से उत्पन्न हुए के द्वारा प्रकाशन देना चाहता है। अब से मैं महान उद्धारकर्ता हूँ। इसका कारण यह है कि वह मृत्यु से परे और सनातन है।


    “वह सनातन और जन्मरहित है, क्योंकि जिसका भी जन्म हुआ है, वह मृत्यु में नष्ट हो जाएगा। वह अजन्मा और अनादि है, क्योंकि जिसका आरंभ हुआ है, उसका अंत भी होगा। कोई उस पर शासन नहीं करता, इसलिए वह अनाम है; क्योंकि जिसका कोई नाम है, उसे किसी दूसरे ने रचा है। और जो है, उसका अपना ही एक अनोखा स्वरूप है—[b] ऐसा स्वरूप जो तुम्हारे देखे और समझे हुए किसी भी स्वरूप जैसा नहीं। फिर भी वह एक रहस्यमय स्वरूप है, जो हर वस्तु से परे और संसार से श्रेष्ठ है। वह एक ही समय में हर दिशा में देखता है और अपने ही द्वारा अपने आपको देखता है।


    “वह असीम है, इसलिए उसे कभी पूरी तरह समझा नहीं जा सकता।


    वह सदा अविनाशी है; उसके समान कुछ भी नहीं।


    वह कभी न बदलनेवाली भलाई है।


    उसमें कोई दोष नहीं।


    वह सनातन है।


    वह धन्य है।


    उसे जाना नहीं जा सकता, पर वह अपने आपको जानता है।


    वह माप से परे है; उसकी थाह नहीं ली जा सकती।


    वह सिद्ध है, उसमें कोई अपूर्णता नहीं।


    उसकी धन्यता अविनाशी है।


    उसे ‘संसार का पिता’ कहा जाता है।”


    [a] यहाँ उपलब्ध पांडुलिपि-पाठ में कुछ अंश लुप्त है।

    [b] यहाँ उपलब्ध पांडुलिपि-पाठ में कुछ अंश लुप्त है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध पांडुलिपि-पाठ में कुछ अंश लुप्त है।
    reason: मूल दिए गए साक्ष्य में मत्ती के कथन से पहले वर्ग कोष्ठक पाठ-हानि दर्शाते हैं।
  - marker: b
    text: यहाँ उपलब्ध पांडुलिपि-पाठ में कुछ अंश लुप्त है।
    reason: ‘अपना ही एक अनोखा स्वरूप’ के बाद दिए गए वर्ग कोष्ठक पांडुलिपि की रिक्ति या क्षति दर्शाते हैं।
lexical_decisions:
- source_word: He Who Is
  choice: जो है
  rationale: अस्तित्व-सूचक उपाधि की खुली और दार्शनिक प्रकृति बनाए रखता है; इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक नाम में नहीं बदला गया।
- source_word: inexpressible
  choice: शब्दों में व्यक्त नहीं किया जा सकता
  rationale: सहज आधुनिक हिन्दी में कथन की अपोफैटिक शक्ति बनाए रखता है।
- source_word: nothing contingent
  choice: न किसी आकस्मिक अस्तित्व ने
  rationale: ‘contingent’ का दार्शनिक भाव—जिसका अस्तित्व अपने आप में अनिवार्य नहीं—संक्षिप्त रूप में रखा गया; प्राचीन कॉप्टिक की सीधी समीक्षा लंबित होने के कारण इसे निर्णायक तकनीकी पद नहीं बनाया गया।
- source_word: revelation
  choice: प्रकाशन
  rationale: यहाँ सामान्य जानकारी नहीं, छिपी वास्तविकता प्रकट करने का भाव है।
- source_word: deathless
  choice: मृत्यु से परे
  rationale: ‘अमर’ की अपेक्षा स्रोत की निषेधात्मक अभिव्यक्ति के निकट और स्वाभाविक हिन्दी।
- source_word: unbegotten
  choice: अजन्मा
  rationale: ‘जन्मरहित’ के साथ स्रोत में आए समानांतर लेकिन पृथक विशेषण को संक्षेप में सुरक्षित रखता है।
- source_word: appearance
  choice: स्वरूप
  rationale: ‘रूप’ या ‘दिखावट’ की अपेक्षा दृश्यता और अस्तित्वगत अभिव्यक्ति दोनों की संभावित छाया बनाए रखता है।
- source_word: cannot be traced out
  choice: उसकी थाह नहीं ली जा सकती
  rationale: अगम्यता और पूरी खोज न कर पाने का स्वाभाविक हिन्दी मुहावरा।
- source_word: Father of the World
  choice: संसार का पिता
  rationale: उपाधि का सीधा अनुवाद; ‘सृष्टिकर्ता’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: ‘he alone’ का संबंध
  choice: “केवल वही अपने आपको जानता है”
  alternative: “उसके सिवा कोई नहीं” अथवा वाक्य को अधूरा छोड़ना
  rationale: अंग्रेज़ी साक्ष्य में वाक्य व्याकरणतः संकुचित है। प्रसंग ज्ञान और प्रकाशन का है, इसलिए अर्थ को पठनीय बनाया गया, किंतु इसे सार्वभौमिक सर्वज्ञता जैसे अधिक विकसित सूत्र में नहीं बदला गया।
- issue: प्रथम ज्योति से उत्पन्न मध्यस्थ
  choice: “प्रथम ज्योति से उत्पन्न हुए के द्वारा”
  alternative: इसे सीधे महान उद्धारकर्ता अथवा किसी नामित व्यक्ति के साथ एकरूप करना
  rationale: पाठ जिस पहचान को स्पष्ट नहीं करता, अनुवाद उसे किसी विशिष्ट धर्मवैज्ञानिक पहचान से नहीं बाँधता।
- issue: सर्वनाम और व्याकरणिक लिंग का तनाव
  choice: ‘जो है’ के लिए पुल्लिंग सर्वनाम बनाए रखे गए, जबकि ‘स्वरूप’ के अनुरूप वाक्य स्वाभाविक किया गया
  alternative: सभी संदर्भों को निर्लिंग अमूर्त सत्ता बनाना
  rationale: अंग्रेज़ी साक्ष्य में ‘he’ और ‘it’ का परिवर्तन है। हिन्दी में पूर्ण समानता संभव नहीं; व्यक्ति-सूचक और स्वरूप-सूचक दोनों पहलू यथासंभव सुरक्षित रखे गए।
- issue: अज्ञेयता और आत्मज्ञान
  choice: “उसे जाना नहीं जा सकता, पर वह अपने आपको जानता है”
  alternative: “मनुष्य उसे पूरी तरह नहीं जान सकता”
  rationale: स्रोत के तीखे विरोधाभास को नरम या सीमित नहीं किया गया।
- issue: ‘संसार का पिता’ उपाधि
  choice: उद्धरण-चिह्नों में यथावत उपाधि
  alternative: ‘जगत्पिता’, ‘सृष्टिकर्ता पिता’
  rationale: संप्रदायगत या दार्शनिक विस्तार से बचते हुए स्रोत की उपाधि सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुलभ शैली रखी गई है। छोटे गुण-वाक्यों की स्तोत्रात्मक लय सुरक्षित है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; नाग हम्मादी कोडेक्स III,4 और बर्लिन कोडेक्स 8502,3 के कॉप्टिक पाठ की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग-कोष्ठकीय रिक्तियों को अनुमानित शब्दों से नहीं भरा गया।
