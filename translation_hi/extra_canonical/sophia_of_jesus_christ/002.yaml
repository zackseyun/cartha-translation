  source_fidelity: स्रोत-आधारित अंग्रेज़ी साक्ष्य के अधिकांश अर्थ, स्तोत्रात्मक सूची, उपाधियाँ, और दोनों रिक्ति-संकेत सुरक्षित हैं। किंतु ‘but he alone and any to whom…’ का मसौदे में ‘केवल वही अपने आपको जानता है’ के रूप में पुनर्गठन स्रोत से अधिक व्याख्यात्मक है और उन लोगों को, जिन्हें प्रकाशन दिया जाता है, ‘उसे जानने’ वाले अपवाद के रूप में स्पष्ट नहीं रखता।
  naturalness: भाषा सामान्यतः आधुनिक, गरिमापूर्ण और पठनीय है। ‘आकस्मिक अस्तित्व’ इस दार्शनिक संदर्भ में असहज है; ‘आश्रित सत्ता’ अधिक स्वाभाविक है, यद्यपि प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने से इसे व्याख्यात्मक परिभाषा नहीं बनाया गया है। ‘पूर्ण’ भी यहाँ ‘सिद्ध’ से अधिक सहज है।
  terminology: ‘जो है’, ‘प्रथम ज्योति’, ‘प्रकाशन’, ‘अजन्मा’, ‘अनादि’, ‘स्वरूप’, और ‘संसार का पिता’ स्रोत की खुली, गैर-संप्रदायगत भाषा को बनाए रखते हैं। ‘मृत्यु से रहित’ ‘deathless’ के निषेधात्मक अर्थ को ‘मृत्यु से परे’ की अपेक्षा अधिक सीधे रखता है।
