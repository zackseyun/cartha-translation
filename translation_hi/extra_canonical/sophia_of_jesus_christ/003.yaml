  source_fidelity: 'मसौदा उपलब्ध अंग्रेज़ी साक्ष्य के अर्थ, संवाद-क्रम, तकनीकी शब्दावली और पाठालोचनात्मक संकेतों को प्रायः विश्वसनीय ढंग से सुरक्षित रखता है। फिर भी ‘unmoving generation’ से संबंधित वाक्य में ‘अविनाशिता में’ का संबंध अधिक स्पष्ट किया जा सकता है, और पाठालोचनात्मक संकेतों की टिप्पणी को अधिक ठीक ढंग से सीमित करना आवश्यक है: चौकोर कोष्ठक कभी पुनर्स्थापित शब्द और रिक्त चौकोर कोष्ठक पाठ-रिक्ति दर्शाते हैं।'
