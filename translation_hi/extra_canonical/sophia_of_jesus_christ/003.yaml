translation:
  language: hi
  text: 'फिलिप्पुस ने पूछा, “प्रभु, तो फिर वह पूर्ण लोगों के सामने कैसे प्रकट हुआ?”


    पूर्ण उद्धारकर्ता ने उससे कहा, “किसी भी दृश्य वस्तु के दृश्य होने से पहले, महिमा और अधिकार उसमें विद्यमान थे [पाठ में रिक्ति], क्योंकि वह समस्तताओं[a] की संपूर्णता को अपने में समेटे हुए है, जबकि उसे कोई भी अपने में नहीं समेटता। इसका कारण यह है कि वह पूर्णतः मन है; और वही विचार और चिंतन, मनन, तर्क और सामर्थ्य है। ये सभी समान सामर्थ्य हैं और समस्तताओं के स्रोत हैं। उनका पूरा वंश, आरंभ से अंत तक, उस अनंत, अजन्मे पिता के पूर्वज्ञान में है।”


    थोमा ने उससे पूछा, “प्रभु और उद्धारकर्ता, इनके अस्तित्व में आने का कारण क्या है, और इन्हें क्यों प्रकट किया गया?”


    पूर्ण उद्धारकर्ता ने कहा, “मैं अनंत से निकला हूँ, ताकि तुम्हें सब कुछ बता दूँ। ‘जो है वह आत्मा’ ही जनक था। उसमें ⟨जनक की⟩ सामर्थ्य [पाठ में रिक्ति] और रूप [देने] वाले का स्वभाव था,[b] ताकि उसमें छिपी अपार संपदा प्रकट हो सके। अपनी करुणा और प्रेम के कारण उसने स्वयं फल उत्पन्न करना चाहा—इसलिए नहीं कि वह अपनी भलाई का आनंद अकेला ही ले, बल्कि इसलिए कि अचल वंश की दूसरी आत्माएँ अविनाशिता में शरीर और आत्माएँ, महिमा और सम्मान, और उसका अनंत वरदान उत्पन्न कर सकें। इस प्रकार उसका खजाना स्वयंजनित परमेश्वर के द्वारा प्रकट हो सके—जो सारी अविनाशिता का और उन सबका पिता है जो बाद में अस्तित्व में आने वाले थे, पर तब तक दृश्य रूप में प्रकट नहीं हुए थे। अविनाशी जनों के बीच बड़ा भेद विद्यमान है।”


    उसने पुकारकर कहा, “जिसके पास अनंत जनों के विषय में सुनने के कान हों, वह सुने!” और फिर, “मैंने जागे हुओं से कहा है!”


    उसने आगे [पाठ में रिक्ति] कहा, “जो कुछ नाशवान से उत्पन्न हुआ है, वह नाश हो जाएगा, क्योंकि वह नाशवान से उत्पन्न हुआ है। पर जो अविनाशी से उत्पन्न हुआ है, वह नाश नहीं होगा, बल्कि अविनाशी रहेगा।


    “इसी कारण बहुत-से लोग इस भेद को न जानने के कारण भटक गए और मर गए।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “समस्तताएँ” यहाँ एक तकनीकी बहुवचन पद है; इसका आशय अस्तित्व की समग्र दैवी पूर्णताओं या लोकों से हो सकता है, पर दिए गए साक्ष्य से इसकी सीमा निश्चित नहीं है।
    reason: असामान्य तकनीकी पद को पाठ में संक्षिप्त रखते हुए उसकी संभावित व्यापकता बताना।
  - marker: b
    text: कोणीय कोष्ठक ⟨…⟩ अनुवाद-साक्ष्य में अनुमानित पूर्ति को, चौकोर कोष्ठक […] पुनर्स्थापित शब्द को, और “[पाठ में रिक्ति]” पांडुलिपि या उपलब्ध पाठ की कमी को दर्शाता है।
    reason: स्रोत-साक्ष्य के पाठालोचनात्मक संकेतों और अनिश्चितता को पारदर्शी बनाना।
  - marker: c
    text: यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: दिए गए स्रोत-विवरण के अनुसार मसौदे की प्रमाणिक सीमा स्पष्ट करना।
lexical_decisions:
- source_word: perfect ones / perfect Savior
  choice: पूर्ण लोग / पूर्ण उद्धारकर्ता
  rationale: ‘पूर्ण’ मूल साक्ष्य के तकनीकी और नैतिक-आध्यात्मिक अर्थ को बिना ‘सिद्ध’ जैसी अतिरिक्त भारतीय दार्शनिक छाया के बनाए रखता है।
- source_word: Totalities
  choice: समस्तताएँ
  rationale: यह असामान्य बहुवचन जानबूझकर रखा गया है, ताकि ज्ञानवादी तकनीकी पद को सामान्य ‘सब कुछ’ में समतल न कर दिया जाए।
- source_word: Spirit Who Is
  choice: ‘जो है वह आत्मा’
  rationale: शीर्षक की अस्तित्व-संबंधी संरचना और उसकी अस्पष्टता को ‘अस्तित्वमान आत्मा’ जैसे व्याख्यात्मक रूप के बजाय प्रत्यक्ष रखा गया है।
- source_word: unmoving generation
  choice: अचल वंश
  rationale: ‘generation’ के सामूहिक वंशगत अर्थ तथा ‘unmoving’ के स्थिर/अपरिवर्तित भाव को संक्षेप में सुरक्षित रखता है।
- source_word: self-begotten God
  choice: स्वयंजनित परमेश्वर
  rationale: तकनीकी आत्मोत्पत्ति-संबंधी पद को किसी परिचित सांप्रदायिक उपाधि से नहीं बदला गया।
- source_word: imperishable / imperishability
  choice: अविनाशी / अविनाशिता
  rationale: व्यक्ति/वस्तु और अमूर्त अवस्था के बीच स्रोत में उपस्थित भेद को बनाए रखता है।
theological_decisions:
- issue: पिता और सर्वसमावेशी सत्ता का संबंध
  choice: सर्वनामों और पदबंधों की स्रोतगत अस्पष्टता बनाए रखी गई
  alternative: हर ‘वह/उस’ को स्पष्ट रूप से ‘पिता’ या किसी अन्य सत्ता से जोड़ना
  rationale: साक्ष्य स्पष्ट रूप से हर सर्वनाम का संदर्भ निर्धारित नहीं करता; व्याख्यात्मक पहचान थोपना उचित नहीं होगा।
- issue: ‘जो है वह आत्मा’ की जनक भूमिका
  choice: ‘ही जनक था’
  alternative: ‘पिता ने आत्मा को जन्म दिया’ अथवा ‘आत्मा माता थी’
  rationale: दिए गए साक्ष्य की व्याकरणिक दिशा को रखा गया है और लिंग/दैवी संबंध के बारे में अतिरिक्त सिद्धांत नहीं जोड़ा गया।
- issue: अविनाशी जनों के बीच भेद
  choice: कथन को बिना समाधान के ज्यों का त्यों रखा गया
  alternative: इसे केवल नाशवान और अविनाशी वर्गों के बीच का भेद मानकर स्पष्ट करना
  rationale: पाठ स्वयं ‘अविनाशी जनों के बीच’ बड़े भेद की बात करता है; संभावित तनाव को हटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु पठनीय गद्य अपनाया गया है। संवाद स्वाभाविक रखे गए हैं, जबकि ‘समस्तताएँ’, ‘अचल वंश’ और ‘स्वयंजनित’ जैसे तकनीकी पदों को सरल पर्यायों में विलीन नहीं किया गया। पाठ की रिक्तियाँ, पूर्तियाँ और धर्मवैचारिक अस्पष्टताएँ स्पष्ट रूप से सुरक्षित हैं।
