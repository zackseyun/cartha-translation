  revised_text: 'फिलिप्पुस ने पूछा, “प्रभु, तो फिर वह पूर्ण लोगों के सामने कैसे प्रकट हुआ?”


    पूर्ण उद्धारकर्ता ने उससे कहा, “किसी भी दृश्य वस्तु के दृश्य होने से पहले, महिमा और अधिकार उसमें विद्यमान थे [पाठ में रिक्ति], क्योंकि वह समस्तताओं[a] की संपूर्णता को अपने में समेटे हुए है, जबकि उसे कोई भी अपने में नहीं समेटता। इसका कारण यह है कि वह पूर्णतः मन है; और वही विचार और चिंतन, मनन, तर्क और सामर्थ्य है। ये सभी समान सामर्थ्य हैं और समस्तताओं के स्रोत हैं। उनका पूरा वंश, आरंभ से अंत तक, उस अनंत, अजन्मे पिता के पूर्वज्ञान में है।”


    थोमा ने उससे पूछा, “प्रभु और उद्धारकर्ता, इनके अस्तित्व में आने का कारण क्या है, और इन्हें क्यों प्रकट किया गया?”


    पूर्ण उद्धारकर्ता ने कहा, “मैं अनंत से निकला हूँ, ताकि तुम्हें सब कुछ बता दूँ। ‘जो है वह आत्मा’ ही जनक था। उसमें ⟨जनक की⟩ सामर्थ्य [पाठ में रिक्ति] और रूप [देने] वाले का स्वभाव था,[b] ताकि उसमें छिपी अपार संपदा प्रकट हो सके। अपनी करुणा और प्रेम के कारण उसने स्वयं फल उत्पन्न करना चाहा—इसलिए नहीं कि वह अपनी भलाई का आनंद अकेला ही ले, बल्कि इसलिए कि अचल वंश की दूसरी आत्माएँ अविनाशिता में शरीर और आत्माएँ, महिमा और सम्मान, तथा उसका अनंत वरदान उत्पन्न कर सकें। इस प्रकार उसका खजाना स्वयंजनित परमेश्वर के द्वारा प्रकट हो सके—जो सारी अविनाशिता का और उन सबका पिता है जो बाद में अस्तित्व में आने वाले थे, पर तब तक दृश्य रूप में प्रकट नहीं हुए थे। अविनाशी जनों के बीच बड़ा भेद विद्यमान है।”


    उसने पुकारकर कहा, “जिसके पास अनंत जनों के विषय में सुनने के कान हों, वह सुने!” और फिर, “मैंने जागे हुओं से कहा है!”


    उसने आगे [पाठ में रिक्ति] कहा, “जो कुछ नाशवान से उत्पन्न हुआ है, वह नाश हो जाएगा, क्योंकि वह नाशवान से उत्पन्न हुआ है। पर जो अविनाशी से उत्पन्न हुआ है, वह नाश नहीं होगा, बल्कि अविनाशी रहेगा।


