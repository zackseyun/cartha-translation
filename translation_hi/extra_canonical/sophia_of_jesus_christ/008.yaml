  text: 'Then Thomas asked [him], “Lord, Savior, how many aeons are above the heavens?”


    The perfect Savior said, “I praise you for asking about the great aeons, because your roots dwell in the infinities. When those whom I discussed before were revealed, he [supplied . . .]


    (Coptic pages 109 and 110 are missing)


    […] [] and arrive at a unity, we call them the ‘Assembly of the Ogdoad.’ It appeared as androgynous and was named partly male and partly female. The male is called ‘Assembly,’ while the female is called ‘Life,’ so that it could be shown that the life of all the aeons came from a female.


    “And all names were received from the originating principle. This was because, from his harmony with his thought, the powers appeared very quickly and were called ‘gods.’ On the basis of their wisdom, [the] gods of the gods revealed gods, <and the gods> on the basis of their wisdom revealed lords. The lords of the lords, on the basis of their acts of thought, revealed lords, and the lords, on the basis of their power, revealed archangels. The archangels, on the basis of their words, revealed angels, [] likenesses appearing from them that possessed structure, shape, and names for all the aeons and their worlds.


    “And the immortals I have just described all exercise authority from the Immortal Human, who is called ‘Silence,’ because when they contemplated silently, without outward speech, the majesty that belongs to her was brought to completion. Because the indestructible ones possessed authority, each one created a great kingdom in the Ogdoad, as well as thrones, temples, and firmaments for their respective majesties, because all of them came into being through the will of the Mother of the World.”


    Then the holy apostles said to him, “Lord, Savior, tell us about those who dwell in the aeons, because it is necessary for us to inquire about them.”


    The perfect [] Savior said, “You may ask about anything, and I will give you the answer.


    “They created angelic hosts—countless myriads—for service and for their glory. They created virgin spirits, the inexpressible and unwavering lights, because they experience no infirmity or weakness but instead display will.


    “In this way the aeons were quickly completed, together with the heavens and the firmaments, in the glory of the Immortal Human and his consort Sophia. From there, all the aeons and worlds, and those that came afterward, received the model for creating their likenesses, both in the heavens of chaos and in their worlds. And every nature, beginning with the revelation of chaos, dwells in the shadowless light, in indescribable joy, and in unspeakable rejoicing. They continually enjoy their glory, which never fades, [] and their infinite rest, which is indescribable among all the aeons and all their powers that came into being afterward. Everything I have now told you, I said so that you might shine in the light even more than these.”'
translation:
  language: hi
  text: 'तब थोमा ने [उससे] पूछा, “प्रभु, उद्धारकर्ता, कितने युग स्वर्गों से परे हैं?”


    सिद्ध उद्धारकर्ता ने कहा, “मैं तुम्हारी सराहना करता हूँ कि तुमने महान युगों के विषय में पूछा, क्योंकि तुम्हारी जड़ें अनंतताओं में निवास करती हैं। जब वे प्रकट हुए जिनके विषय में मैंने पहले चर्चा की थी, तब उसने [प्रदान किया . . .]


    (कॉप्टिक के पृष्ठ 109 और 110 लुप्त हैं)[a]


    […] [] और एकता को प्राप्त होते हैं, तो हम उन्हें ‘अष्टक की सभा’ कहते हैं। वह उभयलिंगी रूप में प्रकट हुई और कुछ अंश पुरुष तथा कुछ अंश स्त्री कहलायी। पुरुष को ‘सभा’ और स्त्री को ‘जीवन’ कहा जाता है, ताकि यह प्रकट हो कि सभी युगों का जीवन एक स्त्री से आया।


    “और सभी नाम आदि-सिद्धांत से प्राप्त हुए। ऐसा इसलिए हुआ कि उसके और उसके विचार के सामंजस्य से वे शक्तियाँ बहुत शीघ्र प्रकट हुईं जो ‘देवता’ कहलायीं। अपनी बुद्धि के आधार पर [वे] देवताओं के देवता देवताओं को प्रकट करते गए, <और देवताओं ने> अपनी बुद्धि के आधार पर प्रभुओं को प्रकट किया। प्रभुओं के प्रभुओं ने अपने चिंतन-कर्मों के आधार पर प्रभुओं को प्रकट किया, और प्रभुओं ने अपनी सामर्थ्य के आधार पर प्रधान स्वर्गदूतों को। प्रधान स्वर्गदूतों ने अपने वचनों के आधार पर स्वर्गदूतों को प्रकट किया; [] उनसे प्रतिरूप प्रकट हुए, जिनमें सभी युगों और उनके लोकों के लिए संरचना, आकार और नाम थे।


    “और जिन अमर जनों का मैंने अभी वर्णन किया है, वे सभी अमर मानव से अधिकार पाते हैं, जिसे ‘मौन’ कहा जाता है; क्योंकि जब उन्होंने बाहर कोई वचन कहे बिना मौन में मनन किया, तब उसकी महिमा पूर्ण हुई। चूँकि अविनाशी जनों के पास अधिकार था, इसलिए प्रत्येक ने अष्टक में एक विशाल राज्य तथा अपनी-अपनी महिमा के लिए सिंहासन, मंदिर और आकाशमंडल रचे; क्योंकि वे सभी जगत की माता की इच्छा से अस्तित्व में आए।”


    तब पवित्र प्रेरितों ने उससे कहा, “प्रभु, उद्धारकर्ता, हमें उन लोगों के विषय में बताइए जो युगों में निवास करते हैं, क्योंकि उनके विषय में पूछना हमारे लिए आवश्यक है।”


    सिद्ध [] उद्धारकर्ता ने कहा, “तुम किसी भी विषय में पूछ सकते हो, और मैं तुम्हें उत्तर दूँगा।


    “उन्होंने सेवा और अपनी महिमा के लिए स्वर्गदूतों की सेनाएँ—असंख्य लाखों—रचीं। उन्होंने अक्षत आत्माएँ, अवर्णनीय और अडिग ज्योतियाँ रचीं; क्योंकि उनमें कोई दुर्बलता या कमजोरी नहीं होती, बल्कि वे इच्छा-शक्ति प्रकट करती हैं।


    “इस प्रकार युग, स्वर्गों और आकाशमंडलों के साथ, अमर मानव और उसकी सहचरी सोफिया की महिमा में शीघ्र ही पूर्ण हुए। वहीं से सभी युगों और लोकों ने, और उनके बाद आनेवालों ने भी, अपने प्रतिरूपों की रचना का नमूना पाया—अराजकता के स्वर्गों में भी और अपने लोकों में भी। और प्रत्येक प्रकृति, अराजकता के प्रकट होने से आरंभ करके, छायारहित ज्योति, अवर्णनीय आनंद और अकथनीय हर्ष में निवास करती है। वे निरंतर अपनी कभी न मिटनेवाली महिमा [] और अपने अनंत विश्राम का आनंद लेते हैं, जिसका वर्णन सभी युगों और उनके बाद अस्तित्व में आई समस्त शक्तियों के बीच नहीं किया जा सकता। जो कुछ मैंने अभी तुमसे कहा है, वह इसलिए कहा कि तुम इनसे भी अधिक ज्योति में चमको।”


    [a] उपलब्ध पांडुलिपि में यहाँ दो कॉप्टिक पृष्ठ लुप्त हैं; इसलिए इसके पहले और बाद का वाक्य-विन्यास अधूरा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध पांडुलिपि में यहाँ दो कॉप्टिक पृष्ठ लुप्त हैं; इसलिए इसके पहले और बाद का वाक्य-विन्यास अधूरा है।
    reason: पांडुलिपि की वास्तविक lacuna और कथानक-विच्छेद को पाठक के लिए स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: aeons
  choice: युग
  rationale: ज्ञानवादी संदर्भ में यह कालखंड और व्यक्तीकृत दिव्य लोक/सत्ता दोनों का संकेत दे सकता है। ‘युग’ प्रचलित और पठनीय है, जबकि संदर्भ की वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: Ogdoad
  choice: अष्टक
  rationale: आठ से बने दिव्य समूह या क्षेत्र का तकनीकी अर्थ बचाने के लिए संस्कृतनिष्ठ किंतु समझने योग्य पद चुना गया।
- source_word: Assembly
  choice: सभा
  rationale: समूह, समागम या समुदाय के मूल भाव को स्वाभाविक हिन्दी में रखता है और नाम के रूप में उद्धरण चिह्नों में दिया गया है।
- source_word: Life
  choice: जीवन
  rationale: स्त्रीलिंग व्यक्तीकृत सत्ता के नाम का सीधा और पारदर्शी अनुवाद।
- source_word: Immortal Human
  choice: अमर मानव
  rationale: Human को ‘मनुष्य’ या लैंगिक रूप से ‘पुरुष’ करके अर्थ सीमित करने के बजाय व्यापक मानव-सत्ता का भाव रखा गया।
- source_word: Silence
  choice: मौन
  rationale: व्यक्तीकृत नाम और मौन चिंतन, दोनों के शब्द-संबंध को सुरक्षित रखता है।
- source_word: firmaments
  choice: आकाशमंडल
  rationale: प्राचीन ब्रह्मांड-विज्ञान के संरचित स्वर्गीय विस्तार को आधुनिक पाठक के लिए गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: simulacra
  choice: प्रतिरूप
  rationale: नकल, छवि या रूप-सदृश सत्ता की अस्पष्टता बनाए रखने वाला तटस्थ पद।
- source_word: virgin spirits
  choice: अक्षत आत्माएँ
  rationale: ‘कुँवारी आत्माएँ’ से उत्पन्न अनावश्यक जैविक अर्थ से बचते हुए अखंड/अस्पर्शित अवस्था का भाव दिया गया।
- source_word: myriads
  choice: असंख्य लाखों
  rationale: विशाल, अगणनीय संख्या का प्राचीन अलंकारिक बल सामान्य हिन्दी में पहुँचाता है।
- source_word: Sophia
  choice: सोफिया
  rationale: यहाँ विशिष्ट सहचरी सत्ता का नाम है; इसे केवल ‘बुद्धि’ करने से नाम और गुण के बीच का भेद मिट सकता था।
- source_word: chaos
  choice: अराजकता
  rationale: आदिम अव्यवस्थित क्षेत्र का अर्थ रखा गया, बिना इसे किसी बाद की doctrinal संकल्पना से समान ठहराए।
theological_decisions:
- issue: युगों की प्रकृति
  choice: ‘युग’ रखा गया और जहाँ पाठ उन्हें सक्रिय सत्ता की तरह दिखाता है वहाँ व्याकरण को वैसा ही रहने दिया गया।
  alternative: हर स्थान पर ‘दिव्य लोक’ या ‘दैवी सत्ताएँ’ करना।
  rationale: स्रोत में काल, लोक और व्यक्तीकृत सत्ता की परतें एक-दूसरे में मिलती हैं; किसी एक अर्थ को थोपना उचित नहीं।
- issue: उभयलिंगी सत्ता का वर्णन
  choice: ‘उभयलिंगी’, ‘कुछ अंश पुरुष’ और ‘कुछ अंश स्त्री’ का स्पष्ट वर्णन रखा गया।
  alternative: इसे प्रतीकात्मक ‘द्वैध स्वरूप’ कहकर नरम करना।
  rationale: पाठ की वास्तविक लैंगिक ब्रह्मांड-कल्पना और तनाव को छिपाया नहीं गया।
- issue: Silence के सर्वनाम और महिमा
  choice: ‘मौन’ नाम रखा और ‘उसकी महिमा’ के द्वारा स्रोत की स्त्रीलिंग संदर्भ-संभावना को खुला रखा।
  alternative: ‘उसकी’ को अमर मानव के पुल्लिंग संदर्भ से स्पष्ट करना या ‘उस स्त्री की’ जोड़ना।
  rationale: अंग्रेज़ी साक्ष्य में antecedent और लिंग संबंध तनावपूर्ण हैं; अनावश्यक समाधान से बचा गया।
- issue: देवताओं, प्रभुओं और स्वर्गदूतों की उत्पत्ति
  choice: ‘प्रकट किया’ रखा गया।
  alternative: ‘उत्पन्न किया’ या ‘सृष्टि की’।
  rationale: reveal/manifest की उद्भासनात्मक भाषा को सृष्टि-विषयक निश्चित दावे में नहीं बदला गया।
- issue: ‘सिद्ध उद्धारकर्ता’
  choice: perfect का अनुवाद ‘सिद्ध’ किया गया।
  alternative: ‘पूर्ण उद्धारकर्ता’।
  rationale: यहाँ आध्यात्मिक पूर्णता/परिपक्वता की उपाधि का भाव है; ‘सिद्ध’ संक्षिप्त और गरिमापूर्ण है, पर इसे किसी संप्रदाय-विशेष की उपाधि से नहीं जोड़ा गया।
- issue: ‘जगत की माता’
  choice: व्यक्तीकृत उपाधि के रूप में यथावत रखा।
