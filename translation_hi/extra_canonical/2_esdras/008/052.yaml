source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: gloriam. Vobis enim apertus est paradisus, plantata est arbor uitae, paratum est futurum tempus, praeparata est habundantia, aedificata est ciuitas, probata est requies, perfecta est bonitas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/052.yaml
  text: For paradise has been opened to you[a], the tree of life has been planted, the age to come has been prepared, abundance has been made ready, the city has been built, rest has been approved, goodness has been perfected,
translation:
  language: hi
  text: क्योंकि तुम्हारे लिए स्वर्गोद्यान खोल दिया गया है, जीवन का वृक्ष लगाया गया है, आने वाला युग तैयार किया गया है, भरपूरी तैयार रखी गई है, नगर बनाया गया है, विश्राम स्वीकृत ठहराया गया है[a], और भलाई पूर्ण की गई है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विश्राम परखा गया है’ या ‘विश्राम खरा पाया गया है।’
    reason: लैटिन probata में ‘परखा हुआ/प्रमाणित’ और ‘स्वीकृत/अनुमोदित’ दोनों अर्थ-छायाएँ संभव हैं।
lexical_decisions:
- source_word: paradisus
  choice: स्वर्गोद्यान
  rationale: यह शब्द स्वर्गीय उद्यान और जीवन के वृक्ष—दोनों बिंबों को बनाए रखता है; केवल ‘स्वर्ग’ कहने से उद्यान का भाव दब जाता।
- source_word: futurum tempus
  choice: आने वाला युग
  rationale: लैटिन में शाब्दिक अर्थ ‘भविष्य का समय’ है, पर इस अपोकैलिप्टिक संदर्भ में यह भावी युग को दर्शाता है।
- source_word: habundantia
  choice: भरपूरी
  rationale: यह ‘बहुतायत’ का सहज, आधुनिक और व्यापक अर्थ देता है, बिना यह तय किए कि किस वस्तु की भरपूरी अभिप्रेत है।
- source_word: probata
  choice: खरा पाया गया है
  rationale: probare के परखने और अनुमोदित ठहराने के अर्थों को स्वाभाविक हिन्दी में एक साथ व्यक्त करता है।
- source_word: bonitas
  choice: भलाई
  rationale: यह नैतिक अथवा प्रदत्त अच्छाई की व्यापकता बनाए रखता है; इसे किसी विशेष वरदान तक सीमित नहीं करता।
- source_word: gloriam
  choice: इस पद में अनूदित नहीं
  rationale: दिए गए स्रोत के आरंभ का ‘gloriam.’ पिछले वाक्य और पिछले पद का अंतिम शब्द है; 8:52 का नया वाक्य ‘Vobis enim’ से आरंभ होता है।
theological_decisions:
- issue: ‘परादीस’ की प्रकृति
  choice: स्वर्गोद्यान
  alternative: परादीस / स्वर्गलोक
  rationale: अनुवाद उद्यान-संबंधी मूल बिंब को सुरक्षित रखता है, लेकिन उसके स्थान या अंतिम अवस्था के विषय में कोई अतिरिक्त सिद्धांत नहीं जोड़ता।
- issue: विश्राम का probata होना
  choice: विश्राम को खरा पाया गया है
  alternative: विश्राम को स्वीकृत किया गया है
  rationale: ‘खरा पाया’ परखे और अनुमोदित होने की अर्थ-छाया बनाए रखता है; पादटिप्पणी वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मूल की सात निष्क्रिय क्रियाओं वाली क्रमिक संरचना और पद के अंत की निरंतरता बनाए रखी गई है। ‘तुम्हारे’ बहुवचन vobis को संदर्भानुसार सामूहिक संबोधन के रूप में रखा गया है।
