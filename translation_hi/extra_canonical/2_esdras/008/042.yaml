lexical_decisions:
- source_word: Quoniam
  choice: क्योंकि
  rationale: पिछले कथन से इस उदाहरण का कारणसूचक और तर्कसूचक संबंध बनाए रखता है।
- source_word: semen agricolae
  choice: किसान का बोया हुआ बीज
  rationale: शाब्दिक अर्थ ‘किसान का बीज’ है; ‘बोया हुआ’ जोड़ने से कृषि-संदर्भ आधुनिक हिन्दी में स्वाभाविक रूप से स्पष्ट होता है, बिना कोई नई वस्तु जोड़े।
- source_word: ascenderit
  choice: उगता
  rationale: बीज के भूमि से निकलने या अंकुरित होकर ऊपर आने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: non enim accepit
  choice: वास्तव में उसे मिला ही नहीं
  rationale: लैटिन में क्रिया का कर्म अनुपस्थित है; हिन्दी में भी यह अपूर्णता सुरक्षित रखी गई है। ‘वास्तव में’ enim के बल को दर्शाता है।
