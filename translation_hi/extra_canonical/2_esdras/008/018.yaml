  text: But I have heard the swiftness of the judgment that is to come.
translation:
  language: hi
  text: परन्तु मैंने आनेवाले न्याय की शीघ्रता के बारे में सुना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sed
  choice: परन्तु
  rationale: यह पिछले कथन के साथ स्पष्ट विरोध या मोड़ को दर्शाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: audiui
  choice: मैंने…सुना है
  rationale: लैटिन के पूर्ण भूतकाल को यहाँ वर्तमान प्रासंगिकता रखने वाले हिन्दी पूर्ण रूप से व्यक्त किया गया है।
- source_word: celeritatem
  choice: शीघ्रता
  rationale: यह ‘तेजी’ या ‘शीघ्र होने’ के भाव को बनाए रखता है और न्याय के समय या आगमन को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: iudicii quod futurum est
  choice: आनेवाले न्याय
  rationale: यह लैटिन संबंधवाचक वाक्यांश का संक्षिप्त और स्वाभाविक हिन्दी रूप है; ‘न्याय’ दैवी निर्णय और न्यायिक प्रक्रिया के बीच मूल अर्थ-तनाव को बनाए रखता है।
theological_decisions:
- issue: ‘न्याय की शीघ्रता’ का आशय
  choice: अर्थ को सामान्य रखा गया है
  alternative: ‘न्याय के शीघ्र आ पहुँचने’ या ‘न्याय के शीघ्र पूरा होने’ के रूप में स्पष्ट करना
  rationale: मूल celeritatem यह निश्चित नहीं करता कि शीघ्रता न्याय के आने, आरम्भ होने या संपन्न होने की है; इसलिए अनुवाद इस अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘के बारे में’ हिन्दी में ‘सुनना’ के साथ स्वाभाविक है, यद्यपि लैटिन में celeritatem सीधा कर्म है। आरम्भ का ‘terram.’ पिछले पद का अवशेष है, इसलिए इस पद के पाठ में सम्मिलित नहीं किया गया।
