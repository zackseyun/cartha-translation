  text: erunt. Neque adtendas impie agentium studia, sed qui tua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/026.yaml
  text: but upon those who have served you in truth[a]. Do not pay attention to the pursuits of those who act impiously,
translation:
  language: hi
  text: बल्कि उन लोगों पर ध्यान दे, जिन्होंने सच्चाई से तेरी सेवा की है। अधर्म का आचरण करनेवालों के प्रयासों पर ध्यान न दे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके प्रयत्नों पर मन न लगा।”
    reason: Latin adtendas में ध्यान देने के साथ मन को किसी ओर लगाने या विचार करने का भाव भी हो सकता है।
lexical_decisions:
- source_word: adtendas
  choice: ध्यान दे
  rationale: Latin adtendere का अर्थ यहाँ मन लगाना या विचारपूर्वक ध्यान देना है; आधुनिक हिन्दी में ‘ध्यान देना’ स्वाभाविक है और ‘देखभाल करना’ जैसे अनपेक्षित अर्थ से बचता है।
- source_word: impie agentium
  choice: अधर्म का आचरण करनेवालों
  rationale: यह agentium की सक्रिय, व्यवहार-संबंधी शक्ति बनाए रखता है और impie को केवल पहचान नहीं, आचरण की रीति के रूप में व्यक्त करता है।
- source_word: studia
  choice: प्रयासों
  rationale: इस प्रसंग में studia लोगों की लगन, अभिलाषा या प्रयत्नों को सूचित करता है; ‘प्रयास’ नकारात्मक संदर्भ में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: in veritate servierunt (contextually restored preceding clause)
  choice: सच्चाई से तेरी सेवा की है
  rationale: अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूर्ववर्ती खंड के आशय को स्वाभाविक हिन्दी में व्यक्त करता है; ‘सच्चाई से’ सत्यनिष्ठ ढंग और ‘सत्य में’—दोनों संभावित रंगों को खुला रखता है।
theological_decisions:
- issue: ईश्वर के लिए संबोधन का वचन
  choice: तेरी
  alternative: आपकी
  rationale: प्रार्थना-संबंधी बाइबिलीय संबोधन में एकवचन निकटता और मूल भाषाओं की एकवचनता बनाए रखने के लिए ‘तेरी’ चुना गया; इससे अनादर का आशय नहीं है।
- issue: impie को धार्मिक पहचान या नैतिक आचरण के रूप में प्रस्तुत करना
  choice: अधर्म का आचरण करनेवाले
  alternative: दुष्ट लोग
  rationale: Latin participial phrase कर्म और व्यवहार पर बल देता है; इसे स्थायी पहचान ‘दुष्ट’ में बदलने से मूल की सक्रिय बारीकी दब जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थना-सुलभ रखी गई है। उपलब्ध Latin अंश ‘erunt’ से पूर्ववर्ती वाक्य का केवल अंत और फिर ‘Neque adtendas impie agentium studia’ देता है; आरंभिक उपवाक्य अंग्रेज़ी परामर्श-पाठ और प्रसंग से लिया गया है। अंतिम अल्पविराम इसलिए रखा गया है कि Latin में ‘sed qui tua’ के साथ वाक्य अगले पद में जारी रहता है।
