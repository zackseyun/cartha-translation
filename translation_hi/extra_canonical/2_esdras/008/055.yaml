    reason: source_ambiguity
lexical_decisions:
- source_word: in finem
  choice: अंत में
  rationale: लातीनी पदबंध को उपलब्ध खंड और परामर्श-पाठ के अनुरूप रखा गया है; यह वाक्य पिछले अंश से जुड़ा हुआ प्रतीत होता है।
- source_word: thesaurus inmortalitatis
  choice: अमरता का खज़ाना
  rationale: संबंधकारक संरचना और ‘thesaurus’ के ठोस रूपक—बहुमूल्य संचित निधि—दोनों को सुरक्षित रखता है।
- source_word: Noli ergo adhuc adicere
  choice: इसलिए अब और मत जोड़ो
  rationale: निषेध, निष्कर्षसूचक ‘ergo’, और ‘adicere’ के कर्मविहीन खुले अर्थ को बनाए रखता है; संदर्भ से कोई कर्म मनमाने ढंग से नहीं जोड़ा गया।
theological_decisions:
- issue: ‘जोड़ो’ का अप्रकट कर्म
  choice: कर्म को अप्रकट रखा गया
  alternative: ‘पाप’, ‘शोक’ या ‘प्रश्न’ जैसे किसी कर्म को स्पष्ट करना
  rationale: उपलब्ध लातीनी पाठ में ‘adicere’ का कर्म नहीं दिया गया है; किसी विशेष धार्मिक अर्थ को जोड़ना स्रोत की वास्तविक अपूर्णता और अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। स्रोत स्वयं वाक्यखंड जैसा है, इसलिए अनुवाद ने उसे अनुमान से पूर्ण नहीं किया।
