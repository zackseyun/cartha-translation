id: 2ES.8.17
reference: 2 Esdras 8:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter quod conturbor. Ideo incipiam orare coram te pro me et pro eis, quoniam uideo lapsos nostros qui inhabitamus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/017.yaml
  text: Because of this I am troubled. Therefore I will begin to pray before you for myself and for them[a], because I see the falls of us who inhabit the earth.
translation:
  language: hi
  text: इसी कारण मैं व्याकुल हूँ। इसलिए मैं तेरे सामने अपने लिए और उनके लिए[a] प्रार्थना करना आरम्भ करूँगा, क्योंकि मैं देखता हूँ कि हम, जो पृथ्वी पर रहते हैं, गिर चुके हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनके’ से आशय प्रसंग में पहले उल्लिखित लोगों से है; इस पद में उनका नाम स्पष्ट रूप से नहीं दिया गया है।
    reason: सर्वनाम eis का पूर्वपद इस पद के भीतर निर्दिष्ट नहीं है, इसलिए संदर्भगत अस्पष्टता बताना उपयोगी है।
lexical_decisions:
- source_word: conturbor
  choice: मैं व्याकुल हूँ
  rationale: लातीनी क्रिया वर्तमान मानसिक अशांति या गहरे उद्वेग को व्यक्त करती है; ‘व्याकुल’ स्वाभाविक और गरिमापूर्ण है।
- source_word: coram te
  choice: तेरे सामने
  rationale: स्थानिक रूपक और प्रार्थना में परमेश्वर की प्रत्यक्ष उपस्थिति—दोनों को बनाए रखता है।
- source_word: lapsos nostros qui inhabitamus
  choice: हम पृथ्वी के निवासी पतित हो गए हैं
  rationale: पाठ व्याकरण की दृष्टि से कठिन है, पर lapsos का बल मामूली ‘कमियों’ से अधिक, गिरे या पतित होने की अवस्था पर है। हिन्दी में शाब्दिक ‘हमारे पतनों’ की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: inhabitamus
  choice: हम पृथ्वी के निवासी
  rationale: लातीनी वाक्य में कर्म स्पष्टतः उल्लिखित नहीं है, किंतु प्रसंग और अंग्रेज़ी परामर्श-पाठ में ‘पृथ्वी’ निहित/पूरित है; संज्ञात्मक हिन्दी रचना वाक्य को सहज रखती है।
theological_decisions:
- issue: lapsos को नैतिक कमियों या पतित अवस्था के रूप में समझना
  choice: पतित हो गए हैं
  alternative: हमारी चूकें / हमारी विफलताएँ
  rationale: lapsos बहुवचन कृदंत के रूप में व्यक्तियों की गिरी हुई अवस्था को दर्शाने की अधिक संभावना रखता है। यह अनुवाद विनाश या किसी विशिष्ट पाप-सिद्धांत को जोड़ने के बजाय मूल की गंभीरता बनाए रखता है।
- issue: ‘उनके लिए’ का संदर्भ
  choice: सर्वनाम को अनिर्दिष्ट रखते हुए पादटिप्पणी देना
  alternative: उन लोगों के लिए / पृथ्वी के निवासियों के लिए
  rationale: इस एक पद में eis के पूर्वपद की पहचान स्पष्ट नहीं है; उसे मुख्य पाठ में खोलना मूल की संदर्भगत अस्पष्टता को अनुचित रूप से समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। परमेश्वर को संबोधन में एकवचन ‘तेरे’ रखा गया है। अंतिम खंड में कठिन लातीनी वाक्य-विन्यास को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि lapsos की गंभीरता सुरक्षित रखी गई है।
