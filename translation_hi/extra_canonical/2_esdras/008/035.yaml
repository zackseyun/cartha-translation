id: 2ES.8.35
reference: 2 Esdras 8:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in veritate enim nemo de genitis est qui non impie gessit, et de confitentibus qui non deliquit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/035.yaml
  text: For truly there is no one among those born who has not acted impiously[a], and among those who confess, no one who has not sinned.
translation:
  language: hi
  text: क्योंकि सचमुच, जन्म लेनेवालों में कोई ऐसा नहीं है जिसने अधर्म न किया हो, और अस्तित्व में रहनेवालों में[a] कोई ऐसा नहीं है जिसने पाप न किया हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त लैटिन पाठ में ‘जो अंगीकार करते हैं’ है; सम्भवतः यहाँ मूल पाठ ‘जो अस्तित्व में हैं’ था, जिसका समर्थन अन्य प्राचीन अनुवादों से होता है।
    reason: प्राप्त लैटिन पाठ confitentibus और प्राचीन अनुवादों से समर्थित अनुमानित consistentibus के बीच महत्वपूर्ण पाठांतर को सुरक्षित करना।
lexical_decisions:
- source_word: in veritate enim
  choice: क्योंकि सचमुच
  rationale: कारणसूचक enim और बल देनेवाले in veritate—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: de genitis
  choice: जितने जन्मे हैं उनमें
  rationale: लातीनी पद का समावेशी और समानांतर अर्थ बनाए रखता है।
- source_word: impie gessit
  choice: अधर्म न किया हो
  rationale: impie के धार्मिक-नैतिक आशय को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है; केवल सामान्य बुरे आचरण तक सीमित नहीं करता।
- source_word: confitentibus (likely corruption of consistentibus)
  choice: जितने अस्तित्व में हैं
  rationale: उपलब्ध पुत्री-भाषा संस्करणों की सहमति और genitis के साथ समानांतरता के आधार पर संभावित मूल पाठ consistentibus का अनुवाद मुख्य पाठ में रखा गया है; प्राप्त लातीनी पाठ का पाठांतर पादटिप्पणी में सुरक्षित है।
- source_word: deliquit
  choice: पाप न किया हो
  rationale: धार्मिक-नैतिक अपराध के अर्थ को स्पष्ट करता है और पहले खंड के साथ काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: confitentibus और अनुमानित consistentibus के बीच पाठगत समस्या
  choice: मुख्य पाठ में ‘जितने अस्तित्व में हैं’
  alternative: ‘जो अंगीकार करते हैं’ या संदर्भानुसार ‘जो तुझे अंगीकार करते हैं’
  rationale: लातीनी confitentibus को यथावत लेने पर ‘अंगीकार करनेवालों’ का अर्थ निकलता है, पर ‘तुझे’ मूल पाठ में व्यक्त नहीं है। पुत्री-भाषा परंपराएँ ‘अस्तित्व में रहनेवालों’ का समर्थन करती हैं और इससे ‘जितने जन्मे हैं’ के साथ अपेक्षित समानांतरता बनती है। पाठगत तनाव को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। दोनों समांतर खंडों की संरचना बनाए रखी गई है और पाठगत अनिश्चितता को बिना छिपाए पादटिप्पणी में दिया गया है।
