  text: they trampled his righteous ones. And they said in their hearts that there is no God[a], though they indeed know that they will die. Just as
translation:
  language: hi
  text: उन्होंने उसके धर्मी जनों को पैरों तले रौंदा। और उन्होंने अपने मन में कहा, “कोई परमेश्वर नहीं है,” यद्यपि वे भली-भाँति जानते हैं कि वे मरेंगे। जैसे
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustos eius
  choice: उसके धर्मी जनों
  rationale: ‘iustos’ व्यक्तियों के लिए बहुवचन है; ‘धर्मी जन’ आधुनिक हिन्दी में स्वाभाविक है और ‘eius’ के संबंध को बनाए रखता है।
- source_word: conculcauerunt
  choice: पैरों तले रौंदा
  rationale: क्रिया के हिंसक और अपमानजनक भाव को स्पष्ट तथा मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: in corde suo
  choice: अपने मन में
  rationale: लातीनी ‘हृदय में’ आंतरिक विचार या निश्चय का मुहावरा है; हिन्दी में ‘मन में’ अधिक स्वाभाविक है।
- source_word: non esse deum
  choice: कोई परमेश्वर नहीं है
  rationale: अस्तित्व के निषेध को सीधे और सहज रूप में व्यक्त करता है।
- source_word: et quidem scientes sciunt
  choice: यद्यपि वे भली-भाँति जानते हैं
  rationale: दोहराए गए ज्ञान-सूचक पदों का जोर बनाए रखते हुए कृत्रिम शब्दशः पुनरुक्ति से बचता है।
- source_word: quoniam moriuntur
  choice: कि वे मरेंगे
  rationale: संदर्भ में उनकी निश्चित भावी मृत्यु का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: Sicut
  choice: जैसे
  rationale: स्रोत का अधूरा तुलनात्मक संक्रमण सुरक्षित रखा गया है; वाक्य अगले पद में पूरा होगा।
theological_decisions:
- issue: ‘परमेश्वर नहीं है’ कथन का स्वरूप
  choice: इसे दुष्टों के मन का प्रत्यक्ष कथन रखा गया है
  alternative: इसे व्याख्यात्मक रूप से ‘उन्होंने परमेश्वर के अस्तित्व का इनकार किया’ कहना
  rationale: प्रत्यक्ष कथन स्रोत की तीक्ष्णता और धार्मिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: scientes sciunt में बलाघात
  choice: ‘भली-भाँति जानते हैं’
  alternative: ‘निश्चय ही जानते हैं’ या शब्दशः ‘जानते हुए जानते हैं’
  rationale: यह मूल की emphatic पुनरुक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद स्रोत की तरह ‘जैसे’ पर अधूरा समाप्त होता है, क्योंकि तुलना अगले पद में जारी है। अंग्रेज़ी परामर्श-पाठ की [a] टिप्पणी पिछले, अब त्यागे गए पाठांतर को दर्ज करती है और उपलब्ध लातीनी स्रोत से इस पद का वास्तविक विकल्प नहीं है; इसलिए हिन्दी मुख्य पाठ में उसका चिह्न या पादटिप्पणी नहीं जोड़ी गई।
