base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/007.yaml
  text: will bear the place of a man. For you alone are one[a], and we are one thing formed by your hands, as you have spoken.
translation:
  language: hi
  text: मनुष्य का स्थान[a] लेगा। क्योंकि तू ही अकेला है, और हम तेरे हाथों की रची हुई एक ही रचना हैं, जैसा तूने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन अनुवादों और पाठ-संशोधन के आधार पर: “मनुष्य का रूप धारण करेगा।” लातीनी पाठ में शाब्दिक रूप से “मनुष्य का स्थान” है।'
    reason: लातीनी locum (‘स्थान’) संभवतः खोए हुए यूनानी शब्द के गलत पठन को दर्शाता है; अन्य प्राचीन भाषाई साक्ष्य ‘रूप’ या ‘प्रतिरूप’ का समर्थन करते हैं।
lexical_decisions:
- source_word: portabit locum hominis
  choice: मनुष्य का स्थान धारण करेगा
  rationale: लातीनी पाठ में portabit भविष्यकाल है और locum का सीधा अर्थ ‘स्थान’ है। ‘स्थान धारण करना’ हिन्दी में मूल अर्थ को निकटता से रखते हुए स्वाभाविक है।
- source_word: Solus enim es
  choice: क्योंकि केवल तू ही है
  rationale: यह लातीनी वाक्य की अस्तित्वसूचक और कुछ हद तक असामान्य अभिव्यक्ति को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: una plasmatio nos sumus manuum tuarum
  choice: हम सब तेरे हाथों से रची हुई एक ही कृति हैं
  rationale: plasmatio किसी गढ़ी या रची हुई वस्तु को दर्शाता है; ‘एक ही कृति’ मानवजाति की साझा सृष्टता को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: sicut locutus es
  choice: जैसा तूने कहा है
  rationale: locutus es का सरल और निकट हिन्दी रूप।
theological_decisions:
- issue: ‘केवल तू ही है’ में परमेश्वर की अद्वितीयता और अस्तित्वसूचक कथन
  choice: क्योंकि केवल तू ही है
  alternative: क्योंकि केवल तू ही एक है
  rationale: मूल Solus enim es में ‘एक’ के लिए unus नहीं है। चुना हुआ रूप परमेश्वर की अद्वितीयता रखता है, पर मूल से अधिक स्पष्ट संख्यात्मक अथवा सिद्धान्तगत दावा नहीं जोड़ता।
- issue: locum बनाम अनुमानित मूल पाठ में ‘रूप’
  choice: मुख्य पाठ में ‘स्थान’
  alternative: मनुष्य का रूप धारण करेगा
  rationale: प्रदत्त आलोचनात्मक आधार-पाठ में locum स्पष्ट रूप से ‘स्थान’ है। कुछ विद्वान इसे खोए हुए यूनानी पाठ की प्रतिलिपि-त्रुटि मानते हैं, इसलिए ‘रूप’ को मुख्य पाठ में चुपचाप अपनाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। परमेश्वर के लिए निकटवाची एकवचन ‘तू/तेरे’ मूल के एकवचन संबोधन और प्रार्थनात्मक स्वर के अनुरूप है। वाक्य पूर्ववर्ती प्रसंग से जुड़ा खंड है, इसलिए आरम्भिक अपूर्णता को मूल की तरह बनाए रखा गया है।
