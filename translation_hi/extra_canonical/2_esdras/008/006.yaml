id: 2ES.8.6
reference: 2 Esdras 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: O domine super nos, si permittes seruo tuo ut oremus coram te et des nobis semen cordis et sensui culturam unde fructum fiat, unde uiuere possit omnis corruptus qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/006.yaml
  text: O Lord over us[a], if you permit your servant to pray before you, and give us seed for the heart and cultivation for the understanding, from which fruit may come, by which every corruptible one may live[b],
translation:
  language: hi
  text: हे प्रभु, हम पर अधिकार रखनेवाले, यदि तू अपने दास को अनुमति दे कि हम[a] तेरे सामने प्रार्थना करें और हमें हृदय के लिए बीज और बुद्धि के लिए जोताई दे, जिनसे फल उत्पन्न हो और हर नाशवान मनुष्य[b] जीवित रह सके,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में ‘दास’ एकवचन है, पर ‘हम प्रार्थना करें’ बहुवचन है।
    reason: मूल पाठ में व्यक्ति-वचन का उल्लेखनीय परिवर्तन सुरक्षित रखने के लिए।
  - marker: b
    text: या ‘हर क्षयशील मनुष्य’। यहाँ आशय मृत्यु और क्षय के अधीन होने से है, केवल नैतिक भ्रष्टता से नहीं।
    reason: corruptus के संदर्भगत अर्थ और वास्तविक अनुवाद-विकल्प को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: super nos
  choice: हमारे प्रभु
  rationale: शाब्दिक अर्थ ‘हमारे ऊपर’ है और यहाँ प्रभु के अधिकार का भाव है; सहज आधुनिक हिन्दी में ‘हमारे प्रभु’ उसी संबंध को संक्षेप में व्यक्त करता है।
- source_word: semen cordis
  choice: हृदय के लिए बीज
  rationale: मूल के बीज-रूपक और हृदय से उसके संबंध को बनाए रखता है; ‘हृदय का बीज’ हिन्दी में अनावश्यक रूप से यह संकेत दे सकता था कि बीज हृदय से उत्पन्न है।
- source_word: sensui culturam
  choice: बुद्धि के लिए जोताई
  rationale: cultura के कृषि-रूपक को ‘जोताई’ से सुरक्षित रखा गया है और sensus को यहाँ ग्रहण-शक्ति/समझ के अर्थ में ‘बुद्धि’ कहा गया है।
- source_word: fructum fiat
  choice: फल उत्पन्न हो
  rationale: लैटिन की फल आने या बनने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: omnis corruptus
  choice: हर नाशवान मनुष्य
  rationale: संदर्भ में corruptus का आशय क्षय और मृत्यु के अधीन प्राणी से है, न कि अनिवार्यतः नैतिक रूप से भ्रष्ट व्यक्ति से। ‘मनुष्य’ हिन्दी में विशेषण को स्वाभाविक आधार देता है।
theological_decisions:
- issue: एकवचन ‘तेरे दास’ से बहुवचन ‘हम’ की ओर परिवर्तन
  choice: तेरे दास को अनुमति दे कि हम प्रार्थना करें
  alternative: तेरे दास को प्रार्थना करने की अनुमति दे
  rationale: oremus प्रथम पुरुष बहुवचन है। मूल पाठ का संख्या-परिवर्तन सामुदायिक स्वर को खुला रखता है; उसे एकवचन बनाकर समतल नहीं किया गया।
- issue: corruptus का अर्थ-क्षेत्र
  choice: नाशवान
  alternative: भ्रष्ट
  rationale: यहाँ जीवन पाने की आवश्यकता और क्षयशील दशा प्रमुख है। ‘भ्रष्ट’ नैतिक पतन को अनावश्यक रूप से प्रधान बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। परमेश्वर के लिए निकटवर्ती एकवचन ‘तू’ रखा गया है। बीज, जोताई और फल की परस्पर जुड़ी कृषि-छवि सुरक्षित है। पद मूल स्रोत की तरह अगले वाक्यांश की ओर बढ़ता है, इसलिए अंत में अल्पविराम रखा गया है।
