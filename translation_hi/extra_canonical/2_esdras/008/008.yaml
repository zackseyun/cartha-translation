source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam uiuificans uiuificas nunc in matrice plasmatum corpus et praestas membra, conseruatur in igni et aqua tua creatio et nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/008.yaml
  text: And because[a], giving life, you now give life in the womb to the body that has been formed, and you provide its members, your creation is preserved in fire and water, and for nine months your formation bears your creature that has been created in it.
translation:
  language: hi
  text: और क्योंकि आप जीवन देनेवाले हैं, इसलिए अब गर्भ में गढ़े हुए शरीर को जीवन देते हैं और उसके अंग प्रदान करते हैं; आपकी सृष्टि आग और पानी में सुरक्षित रहती है, और नौ महीने तक आपकी गढ़ी हुई रचना आपके उस प्राणी को धारण करती है, जो उसमें रचा गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसमें” का संकेत संभवतः पहले आए “शरीर” की ओर है; लैटिन वाक्य-विन्यास में इसका संदर्भ पूरी तरह स्पष्ट नहीं है।
    reason: source_ambiguity
lexical_decisions:
- source_word: uiuificans uiuificas
  choice: आप जीवन देनेवाले हैं, इसलिए ... जीवन देते हैं
  rationale: मूल के कृदंत और क्रिया में दोहराए गए ‘जीवन देना’ को बनाए रखते हुए हिन्दी में उसका संबंध स्वाभाविक और स्पष्ट किया गया है।
- source_word: in matrice plasmatum corpus
  choice: गर्भ में गढ़े हुए शरीर
  rationale: matrix का अर्थ यहाँ गर्भ है और plasmatum सृजनात्मक रूप से गढ़े या आकार दिए गए शरीर को दर्शाता है।
- source_word: praestas membra
  choice: उसके अंग बनाते हैं
  rationale: praestare का आशय अंग प्रदान करना है; वर्तमान प्रसंग में ‘अंग बनाते हैं’ अधिक स्वाभाविक हिन्दी है।
- source_word: in igni et aqua
  choice: आग और पानी में
  rationale: लैटिन में tua का संबंध creatio से है, igni et aqua से नहीं; इसलिए ‘आपकी आग और पानी’ नहीं किया गया।
- source_word: patitur
  choice: धारण करती है
  rationale: मूल क्रिया सामान्यतः सहने या भोगने का भाव रखती है, पर नौ महीने के गर्भधारण-संदर्भ में ‘धारण करती है’ उसके प्रसंगगत अर्थ को सबसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: plasmatio
  choice: गढ़ी हुई रचना
  rationale: यह शब्द गढ़ने की प्रक्रिया या उससे बने रूप दोनों की ओर संकेत कर सकता है; हिन्दी चयन सृजनात्मक गठन की छवि बनाए रखता है।
theological_decisions:
- issue: जीवन देने में परमेश्वर की सक्रिय भूमिका
  choice: आप ... जीवन देते हैं और उसके अंग बनाते हैं
  alternative: शरीर जीवित हो जाता है और उसके अंग बन जाते हैं
  rationale: मूल पाठ सीधे संबोधित ‘आप’ को इन क्रियाओं का कर्ता बताता है; इसे निष्क्रिय रूप में बदलना मूल के धर्मवैचारिक बल को कम कर देता।
- issue: अंतिम ‘उसमें’ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम की अस्पष्टता बनाए रखी गई और पादटिप्पणी में समझाया गया
  alternative: उसे निश्चित रूप से ‘शरीर में’ या ‘गर्भ में’ कहना
  rationale: लैटिन in eo व्याकरणतः निकटवर्ती स्त्रीलिंग संज्ञाओं से सीधे मेल नहीं खाता और संभवतः corpus की ओर लौटता है; बिना पर्याप्त आधार किसी एक संदर्भ को निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘गढ़ना’, ‘धारण करना’ और ‘अंग बनाना’ गर्भ में सृजन की ठोस छवि को बनाए रखते हैं।
