source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Propter quod miseriae multae miserabiles efficientur qui habitant saeculum in nouissimis, quia in multa superbia ambulaūerunt. Tu autem pro te intellege et de similibus tuis inquire
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/050.yaml
  text: Therefore many grievous miseries will come upon those who inhabit the world in the last times[a], because they have walked in great pride. But understand for yourself, and inquire concerning those like yourself.
translation:
  language: hi
  text: इसलिए अन्तिम दिनों में संसार में रहने वालों पर बहुत-सी घोर विपत्तियाँ आएँगी, क्योंकि वे बड़े घमंड में चलते रहे हैं। पर तुम स्वयं समझो और अपने समान लोगों के विषय में पूछताछ करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miseriae multae miserabiles
  choice: बहुत-सी घोर विपत्तियाँ
  rationale: शब्दशः पुनरुक्ति ‘बहुत-सी दुःखद विपत्तियाँ’ हिन्दी में अस्वाभाविक होती; ‘घोर’ विपत्तियों की पीड़ादायक गंभीरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: qui habitant saeculum
  choice: संसार में रहनेवाले
  rationale: यहाँ saeculum निवास किए जाने वाले वर्तमान संसार को सूचित करता है; इसलिए ‘युग’ की अपेक्षा ‘संसार’ अधिक स्वाभाविक है।
- source_word: in nouissimis
  choice: अन्तिम समय में
  rationale: लातीनी बहुवचन का आशय अन्तकालीन अवधि है; हिन्दी में ‘अन्तिम समय’ स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: in multa superbia ambulauerunt
  choice: वे बड़े घमंड से चलते रहे हैं
  rationale: ‘चलना’ नैतिक आचरण का स्रोत-रूपक बनाए रखता है और पूर्ण क्रिया के जारी परिणाम को ‘चलते रहे हैं’ व्यक्त करता है।
- source_word: pro te intellege
  choice: अपने विषय में समझो
  rationale: यह जानने-समझने का निर्देश है; व्याख्यात्मक विस्तार किए बिना pro te के आत्म-संबंधी बल को बनाए रखा गया है।
- source_word: de similibus tuis inquire
  choice: अपने जैसे लोगों के विषय में पूछो
  rationale: similibus tuis को किसी विशेष धार्मिक समूह के रूप में परिभाषित किए बिना उसकी मूल व्यापकता और अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘अपने जैसे लोगों’ की पहचान
  choice: पहचान को अनिर्धारित रखा गया
  alternative: इसे ‘धर्मी लोगों’ या किसी विशिष्ट विश्वास-समुदाय के रूप में स्पष्ट करना
  rationale: स्रोत केवल similibus tuis कहता है; किसी विशिष्ट समूह का नाम जोड़ना पाठ से आगे जाकर धर्मवैचारिक अर्थ आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। स्रोत के नैतिक ‘चलने’ वाले रूपक और ‘अपने जैसे लोगों’ की वास्तविक अस्पष्टता को सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ का फुटनोट पिछले पद की पुरानी प्रस्तुति से संबंधित है और इस लातीनी पद का पाठांतर नहीं है, इसलिए उसे शामिल नहीं किया गया।
