  text: Do not look upon the offenses of your people[a], but upon those who have served you in truth.
translation:
  language: hi
  text: अपनी प्रजा के अपराधों पर दृष्टि न कर[a], बल्कि उन पर दृष्टि कर जिन्होंने सच्चाई से तेरी सेवा की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या पहले इस प्रकार प्रस्तुत किया गया था: ‘क्योंकि जब तक मैं जीवित हूँ, मैं बोलूँगा, और जब तक मुझमें समझ है, मैं उत्तर दूँगा। अपनी प्रजा के अपराधों पर दृष्टि न कर।’'
    reason: previous_rendering
lexical_decisions:
- source_word: aspicias
  choice: दृष्टि कर
  rationale: लैटिन क्रिया का अर्थ केवल आकस्मिक रूप से देखना नहीं, बल्कि ध्यान देना है; नकारात्मक और सकारात्मक दोनों खंडों में इसकी पुनरावृत्ति स्वाभाविक रूप से पूरी की गई है।
- source_word: populi tui
  choice: अपनी प्रजा के
  rationale: ईश्वर को संबोधित प्रार्थना के संदर्भ में possessive संबंध स्पष्ट करता है; ‘प्रजा’ सामूहिक अर्थ को dignified आधुनिक हिन्दी में व्यक्त करता है।
- source_word: delicta
  choice: अपराधों
  rationale: यह चुनाव नैतिक दोष अथवा उल्लंघन का व्यापक अर्थ बनाए रखता है, बिना इसे किसी अधिक संकीर्ण धार्मिक शब्द तक सीमित किए।
- source_word: in ueritate
  choice: सच्चाई से
  rationale: सेवा की रीति और निष्ठा—दोनों की संभावित छाया को बनाए रखने वाला सहज हिन्दी प्रयोग।
- source_word: seruierunt
  choice: सेवा की है
  rationale: स्रोत में पंक्ति-विभाजन से टूटा हुआ रूप ‘serui-’ अगले अंश के ‘erunt’ के साथ पूर्ण होता है; हिन्दी पूर्णकाल भूतकालीन सेवा की वर्तमान प्रासंगिकता व्यक्त करता है।
theological_decisions:
- issue: अपराधों के विपरीत सत्यनिष्ठ सेवकों पर दृष्टि करने की विनती
  choice: दोनों खंडों में ‘दृष्टि कर’ को स्पष्ट रूप से रखा गया
  alternative: दूसरे खंड में क्रिया को अध्याहृत छोड़ना
  rationale: लैटिन में दूसरी क्रिया अध्याहृत है, पर हिन्दी में उसे दोहराने से विरोध स्पष्ट और स्वाभाविक होता है; इससे यह नहीं कहा जाता कि सेवक निष्पाप हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। प्रार्थना में ईश्वर के लिए पारंपरिक निकट संबोधन ‘तू/तेरी’ रखा गया है। पद-विभाजन स्रोत के अनुसार सुधारा गया है; पहले के अनुवाद का आरंभ वास्तव में पिछले पद की सामग्री है।
