  yaml_path: translation/extra_canonical/2_esdras/008/056.yaml
  text: to inquire about the multitude of those who perish. For they too[a], having received freedom, despised the Most High and his law
translation:
  language: hi
  text: नाश होने वालों की बड़ी संख्या के विषय में पूछताछ करने के लिए। क्योंकि उन्होंने भी[a] स्वतंत्रता पाकर परमप्रधान और उसकी व्यवस्था का तिरस्कार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पुराने अंग्रेज़ी परामर्श-पाठ में दिया गया वैकल्पिक वाक्यांश किसी पूर्ववर्ती अंश से संबंधित है; उपलब्ध लैटिन पाठ यहाँ इस वाक्य का समर्थन करता है।
    reason: अंग्रेज़ी परामर्श-पाठ में उपस्थित [a] चिह्न को बनाए रखते हुए यह स्पष्ट करता है कि उससे जुड़ा पुराना वैकल्पिक पाठ इस पद के लैटिन स्रोत का वैकल्पिक पाठ नहीं है।
lexical_decisions:
- source_word: inquirendo
  choice: पूछताछ करने के लिए
  rationale: लैटिन के प्रयोजनसूचक gerund को स्वाभाविक हिन्दी में व्यक्त करता है और आरम्भिक वाक्यांश के पूर्ववर्ती प्रसंग से जुड़े होने को बनाए रखता है।
- source_word: multitudine eorum qui pereunt
  choice: नाश होनेवालों की बड़ी संख्या
  rationale: multitudo के संख्यात्मक भाव और pereunt के वर्तमानकालीन विनाश/नाश के अर्थ को स्पष्ट तथा सहज हिन्दी में रखता है।
- source_word: accipientes libertatem
  choice: स्वतंत्रता पाकर
  rationale: परिस्थितिवाचक participial construction का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: spreuerunt
  choice: तिरस्कार किया
  rationale: लैटिन spernere के जानबूझकर ठुकराने और हेय समझने के प्रबल भाव को व्यक्त करता है।
- source_word: altissimum
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त Latin superlative उपाधि का प्रतिष्ठित और अर्थसंगत हिन्दी रूप।
- source_word: legem eius
  choice: उसकी व्यवस्था
  rationale: धार्मिक संदर्भ में lex के लिए 'व्यवस्था' उपयुक्त है और eius का संबंध परमप्रधान से स्पष्ट रहता है।
theological_decisions:
- issue: मानवीय स्वतंत्रता और उत्तरदायित्व
  choice: '''स्वतंत्रता पाकर'' का सीधा अनुवाद'
  alternative: '''स्वतंत्र इच्छा पाकर'''
  rationale: मूल libertatem केवल 'स्वतंत्रता' कहता है; 'इच्छा' जोड़ने से एक विशिष्ट धर्मवैज्ञानिक व्याख्या आरोपित हो सकती थी।
- issue: pereunt में विनाश का स्वरूप
  choice: नाश होनेवाले
  alternative: अनन्त दण्ड पानेवाले
  rationale: मूल पाठ विनाश की अवधि या अंतिम स्वरूप को स्पष्ट नहीं करता, इसलिए उसकी धर्मवैज्ञानिक अनिश्चितता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। पद का आरम्भ खंड-वाक्य है; मूल लैटिन की पूर्ववर्ती प्रसंग पर निर्भर संरचना को जानबूझकर पूर्ण स्वतंत्र वाक्य में नहीं बदला गया।
