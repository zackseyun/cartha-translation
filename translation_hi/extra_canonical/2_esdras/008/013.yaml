  text: And you will put him to death as your creature, and you will give him life as your creature.
translation:
  language: hi
  text: और तू उसे—अपनी सृष्टि को—मृत्यु देगा, और उसे—अपनी सृष्टि को—जीवन देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortificabis
  choice: मृत्यु देगा
  rationale: लैटिन क्रिया का भविष्यकाल और मृत्यु देने का सकर्मक भाव सहज, गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: eum
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्म का स्वाभाविक हिन्दी रूप; संदर्भित व्यक्ति की पहचान को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: tuam creaturam
  choice: अपनी सृष्टि मानकर
  rationale: दोनों स्थानों पर एक ही अनुवाद रखकर स्रोत की शब्दगत पुनरावृत्ति सुरक्षित की गई। यहाँ creaturam का अर्थ सृजा हुआ प्राणी/रचना है; ‘अपनी सृष्टि मानकर’ हिन्दी में संबंध और भूमिका दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: uiuificabis
  choice: जीवन देगा
  rationale: मृत्यु देने के समानांतर जीवन देने का अर्थ सुरक्षित रहता है और भविष्यकाल भी स्पष्ट है।
theological_decisions:
- issue: ईश्वर द्वारा उसी सृजे हुए व्यक्ति को मृत्यु और जीवन देना
  choice: मृत्यु और जीवन के दोनों कथनों को बिना व्याख्यात्मक नरमी के समानांतर रखा गया
  alternative: ‘मरने देगा’ और ‘फिर जिलाएगा’
  rationale: स्रोत की सकर्मक क्रियाएँ सीधे ईश्वरीय कर्तृत्व व्यक्त करती हैं; वैकल्पिक रूप कारणता को कम करता और ‘फिर’ जोड़कर स्रोत से अधिक कालक्रम निर्धारित करता।
- issue: tuam creaturam की पुनरावृत्ति
  choice: दोनों खंडों में ‘अपनी सृष्टि मानकर’ दोहराया गया
  alternative: दूसरे खंड में ‘अपनी कृति’
  rationale: स्रोत दोनों बार समान पद प्रयोग करता है; भिन्न हिन्दी शब्द रखने से अनुपस्थित अर्थभेद उत्पन्न होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। संबोधन के लिए ‘तू’ रखा गया है, क्योंकि वचन में ईश्वर से प्रत्यक्ष एकवचन संबोधन है; पूरे पद में भविष्यकाल और संतुलित समानांतर रचना सुरक्षित है।
