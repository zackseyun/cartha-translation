source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: te, et non iudicasti te inter iustos ut plurimum glorificeris.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/049.yaml
  text: you[a], and have not judged yourself among the righteous, so that you might be more greatly glorified.
translation:
  language: hi
  text: तुम्हें[a], और तुमने अपने आपको धर्मियों में नहीं गिना, ताकि तुम्हारी और भी अधिक महिमा की जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह पद उपलब्ध लैटिन पाठ में वाक्य के बीच से ‘तुम्हें’ शब्द के साथ आरम्भ होता है। एक पुराना अनुवाद यहाँ पढ़ता था: ‘क्योंकि तुमने अपने आपको दीन किया है, जैसा तुम्हारे लिए उचित है’; पर ये शब्द इस पद के दिए गए लैटिन पाठ में नहीं हैं।'
    reason: खंडित पद-आरम्भ और पूर्ववर्ती, पद-सीमा से विस्थापित पाठांतर की जानकारी देना।
lexical_decisions:
- source_word: iudicasti te inter iustos
  choice: तुमने अपने आपको धर्मियों में नहीं गिना
  rationale: यहाँ iudicare का भाव किसी वर्ग में अपने को ठहराने या गिनने का है; शाब्दिक ‘न्याय नहीं किया’ आधुनिक हिन्दी में आशय स्पष्ट नहीं करेगा।
- source_word: ut plurimum glorificeris
  choice: ताकि तुम्हारी और भी अधिक महिमा की जाए
  rationale: glorificeris के कर्मवाच्य भाव को बनाए रखा गया है और plurimum के बढ़े हुए परिमाण को ‘और भी अधिक’ से व्यक्त किया गया है।
theological_decisions:
- issue: ut का प्रयोजन अथवा परिणामसूचक अर्थ
  choice: ताकि
  alternative: जिससे
  rationale: लैटिन ut दोनों अर्थ दे सकता है। मुख्य पाठ में प्रयोजनसूचक स्वाभाविक अनुवाद चुना गया है, पर परिणामसूचक संभावना को सिद्धान्तगत रूप से निर्णायक नहीं माना गया।
- issue: धर्मियों के बीच स्वयं को रखने का आशय
  choice: अपने आपको धर्मियों में नहीं गिना
  alternative: अपने आपको धर्मियों में नहीं ठहराया
  rationale: ‘गिना’ आत्म-विनम्रता और वर्गीकरण—दोनों संभावित भावों को खुला रखता है, बिना धार्मिक स्थिति पर अतिरिक्त सिद्धान्त थोपे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। आरम्भिक ‘तुम्हें’ की असामान्य खंडित रचना जानबूझकर रखी गई है, क्योंकि स्रोत-पाठ स्वयं पिछले संदर्भ पर निर्भर वाक्यांश से आरम्भ होता है।
