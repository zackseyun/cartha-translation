translation:
  language: hi
  text: तूने उसे अपनी धार्मिकता से पोषित किया, उसे अपनी व्यवस्था की शिक्षा दी, और अपनी समझ से उसे सुधारा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enutristi
  choice: पोषित किया
  rationale: यह क्रिया पालने-पोसने और पोषण देने का भाव रखती है; ‘पोषित किया’ उसके रूपकात्मक अर्थ को भी बनाए रखता है।
- source_word: tuae iustitiae
  choice: अपनी धार्मिकता से
  rationale: लैटिन संबंधकारक यहाँ पोषण के साधन या विषय का भाव देता है; ‘से’ इसी संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: erudisti
  choice: शिक्षा दी
  rationale: यह विधिवत सिखाने का अर्थ देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: lege tua
  choice: अपनी व्यवस्था
  rationale: बाइबलीय प्रसंग में lex के लिए ‘व्यवस्था’ ईश्वर की दी हुई विधि और शिक्षा दोनों का परिचित, उपयुक्त शब्द है।
- source_word: corripuisti
  choice: सुधारा
  rationale: इसमें त्रुटि बताकर अनुशासित या ठीक करने का भाव है; ‘सुधारा’ अनावश्यक कठोरता जोड़े बिना इसे व्यक्त करता है।
- source_word: tuo intellectu
  choice: अपनी समझ से
  rationale: intellectus के विवेक/समझ के अर्थ को बनाए रखते हुए साधन-सूचक ‘से’ लैटिन संबंध को स्पष्ट करता है।
