  yaml_path: translation/extra_canonical/2_esdras/008/060.yaml
  text: who made them[a], and they were ungrateful to him who prepared life for them. Therefore my judgment now draws near[b], which I have not
translation:
  language: hi
  text: जिसने उन्हें बनाया[a], और वे उसके प्रति कृतघ्न रहे, जिसने उनके लिए जीवन तैयार किया। इसलिए अब मेरा न्याय निकट आ रहा है[b]—जिसे मैंने नहीं…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद पिछले वाक्य के बीच से आरम्भ होता है; ‘जिसने’ का संबंध परमप्रधान से है।
    reason: cross_reference
  - marker: b
    text: उपलब्ध लैटिन पाठ में वाक्य अगले शब्दों तक जारी रहता है; यहाँ दिया गया अंश ‘जिसे मैंने नहीं…’ पर अधूरा समाप्त होता है।
    reason: textual
lexical_decisions:
- source_word: ingrati fuerunt ei
  choice: वे उसके प्रति कृतघ्न रहे
  rationale: लैटिन में अकृतज्ञता का संबंध स्पष्ट रूप से उस सृष्टिकर्ता से है; ‘उसके प्रति’ इसे स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: praeparauit eis uitam
  choice: जिसने उनके लिए जीवन तैयार किया
  rationale: ‘praeparavit’ के ‘तैयार किया’ और ‘eis’ के ‘उनके लिए’ को सीधे रखा गया है; ‘जीवन दिया’ अधिक सहज होता, पर स्रोत के अलग क्रियार्थ को मिटा देता।
- source_word: iudicium meum
  choice: मेरा न्याय
  rationale: यहाँ ‘iudicium’ निर्णय, न्यायादेश या न्याय की कार्रवाई का अर्थ दे सकता है। ‘मेरा न्याय’ मूल की व्यापकता और धार्मिक तनाव को सुरक्षित रखता है।
- source_word: modo adpropinquat
  choice: अब निकट आ रहा है
  rationale: ‘modo’ को ‘अब’ और वर्तमानकालीन ‘adpropinquat’ को गतिशील ‘निकट आ रहा है’ से व्यक्त किया गया है।
- source_word: Quod non
  choice: जिसे मैंने नहीं…
  rationale: उपलब्ध अंश वाक्य के बीच में समाप्त होता है। ‘जिसे’ नपुंसकलिंग ‘quod’ को निकटवर्ती ‘iudicium’ से जोड़ता है; दीर्घविराम अपूर्णता दिखाता है, और ‘मैंने’ अगले निहित प्रथम-पुरुष कथन की हिन्दी संरचना आरम्भ करता है बिना अनुपलब्ध क्रिया पूरी किए।
theological_decisions:
- issue: ‘iudicium’ का अर्थ
  choice: मेरा न्याय
  alternative: मेरा न्याय-दण्ड / मेरा फैसला
  rationale: ‘न्याय-दण्ड’ दण्डात्मक अर्थ को और ‘फैसला’ केवल निर्णय को प्रमुख बना देता। ‘न्याय’ स्रोत की व्यापक और संभावित रूप से बहुअर्थी धारणा बनाए रखता है।
- issue: अपूर्ण अंतिम उपवाक्य
  choice: जिसे मैंने नहीं…
  alternative: जिसको नहीं… / अगले पद से वाक्य पूरा करना
  rationale: प्रदत्त लैटिन स्वयं ‘Quod non’ पर कटता है। पाठ से बाहर की सामग्री जोड़कर अर्थ पूरा करना स्रोत-साक्ष्य की सीमा से आगे जाता; इसलिए अपूर्णता स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण गद्य रखा गया है। आरम्भ और अंत की वाक्यगत अपूर्णता को सहज बनाने के बजाय स्पष्ट रूप से सुरक्षित रखा गया है।
