  text: 'so also is the course of the present age: many indeed have been created[a], but few will be saved.'
translation:
  language: hi
  text: 'वर्तमान युग का क्रम भी ऐसा ही है: बहुत लोग सृजे गए हैं, परन्तु थोड़े ही बचाए जाएँगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: actus praesentis saeculi
  choice: वर्तमान युग की दशा
  rationale: यहाँ एकवचन actus मनुष्यों के नैतिक ‘कामों’ के बजाय वर्तमान युग की अवस्था, रीति या क्रम को सूचित करता है। ‘दशा’ तुलना के आशय को स्वाभाविक हिन्दी में व्यक्त करती है और ‘कर्म’ जैसी भ्रामक नैतिक धारणा से बचाती है।
- source_word: Multi quidem creati sunt
  choice: बहुत लोग सृजे गए हैं
  rationale: Multi संदर्भ में मनुष्यों को सूचित करता है; हिन्दी में ‘लोग’ जोड़ना आवश्यक स्पष्टता देता है। creati sunt का कर्मवाच्य और पूर्णता-बोध सुरक्षित रखा गया है।
- source_word: pauci autem saluabuntur
  choice: परन्तु थोड़े ही बचाए जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य saluabuntur को यथावत रखा गया है। ‘ही’ बहुत और थोड़े के प्रबल विरोध को स्वाभाविक हिन्दी में उभारता है।
theological_decisions:
- issue: उद्धार के कर्मवाच्य का स्वरूप
  choice: बचाए जाएँगे
  alternative: बचेंगे
  rationale: लैटिन में कर्मवाच्य है; ‘बचाए जाएँगे’ उद्धार पाने वालों को क्रिया के कर्ता के रूप में प्रस्तुत नहीं करता और स्रोत की धार्मिक तनावपूर्ण अभिव्यक्ति को बनाए रखता है।
- issue: ‘बहुत’ और ‘थोड़े’ की सीमा
  choice: अनिर्दिष्ट परिमाणसूचक शब्द बनाए रखे गए
  alternative: अधिकांश सृजे गए हैं, पर बहुत कम उद्धार पाएँगे
  rationale: स्रोत न तो अनुपात बताता है, न ‘अधिकांश’ कहता है। इसलिए व्याख्यात्मक तीव्रता जोड़े बिना genuine ambiguity सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘परन्तु’ शास्त्रीय गरिमा बनाए रखता है, जबकि वाक्य-विन्यास सहज है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि actus के संदर्भगत अर्थ को मुख्य पाठ में ‘दशा’ से स्पष्ट और स्रोतसम्मत रूप दिया गया है।
