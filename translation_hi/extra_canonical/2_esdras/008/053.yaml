  yaml_path: translation/extra_canonical/2_esdras/008/053.yaml
  text: wisdom has been perfected beforehand. The root has been sealed by you[a], weakness has been extinguished by you, and death has been hidden; Hades has fled, and
translation:
  language: hi
  text: बुद्धि पहले ही सिद्ध की जा चुकी है। जड़ पर तुम्हारे द्वारा मुहर लगा दी गई है, निर्बलता तुम्हारे द्वारा मिटा दी गई है, और मृत्यु[a] छिपा दी गई है; अधोलोक भाग गया है, और—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मृत्यु’ शब्द संपादित लैटिन पाठ में कोष्ठकों में दिया गया है।
    reason: मूल-साक्ष्य में शब्द की संपादकीय पूर्ति/अनिश्चित स्थिति को पारदर्शी बनाना।
lexical_decisions:
- source_word: ante perfecta sapientia
  choice: बुद्धि पहले ही सिद्ध की जा चुकी है
  rationale: ‘ante’ को कालगत ‘पहले ही’ और ‘perfecta’ को पूर्णता/सिद्धता दर्शाने वाले कर्मवाच्य रूप में रखा गया है।
- source_word: Radix signata est
  choice: जड़ पर मुहर लगा दी गई है
  rationale: ‘radix’ का सीधा अर्थ ‘जड़’ और ‘signata est’ का अर्थ मुहर लगाए जाने की पूर्ण कर्मवाच्य क्रिया है।
- source_word: a uobis
  choice: तुम्हारे द्वारा
  rationale: Latin passive construction में ‘a vobis’ को कर्ता/agent के रूप में बनाए रखा गया है; इसे ‘तुमसे दूर’ अर्थ देकर तनाव को चुपचाप नहीं सुलझाया गया।
- source_word: infirmitas extincta est
  choice: निर्बलता तुम्हारे द्वारा मिटा दी गई है
  rationale: ‘infirmitas’ के लिए सामान्य और व्यापक ‘निर्बलता’; ‘extincta’ के लिए स्वाभाविक हिंदी ‘मिटा दी गई’ चुना गया।
- source_word: infernus fugit
  choice: अधोलोक भाग गया है
  rationale: ‘infernus’ को मृतकों के लोक के अर्थ में संप्रदाय-निरपेक्ष ‘अधोलोक’ कहा गया; ‘fugit’ की सजीव क्रिया ‘भाग गया’ रखी गई।
theological_decisions:
- issue: ‘a vobis’ की व्याख्या
  choice: ‘तुम्हारे द्वारा’
  alternative: ‘तुमसे दूर’
  rationale: व्याकरण की सहज agentive reading को रखा गया है, भले ही संदर्भ में यह कथन कठिन प्रतीत हो।
- issue: infernus का धार्मिक अर्थ
  choice: अधोलोक
  alternative: नरक
  rationale: Latin शब्द यहाँ मृतकों के लोक को सूचित कर सकता है; ‘नरक’ दंडस्थान का अधिक विशिष्ट अर्थ आरोपित कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। स्रोत वाक्य के अंत में ‘और’ होने के कारण अपूर्णता को दीर्घ विराम-चिह्न से दिखाया गया है।
