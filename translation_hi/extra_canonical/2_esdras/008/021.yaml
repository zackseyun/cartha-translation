  text: incomprehensible, before whom the host of angels stands with trembling, whose preservation is turned into wind and fire, whose word
translation:
  language: hi
  text: अगम्य, जिसके सामने स्वर्गदूतों की सेना काँपती हुई खड़ी रहती है, जिनका अस्तित्व वायु और अग्नि में बदल जाता है, जिसका वचन
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prehensibilis
  choice: अगम्य
  rationale: पाठ में रूप ‘prehensibilis’ है, पर संदर्भ और अंग्रेज़ी परामर्श-पाठ इसे ‘incomprehensible’ के अर्थ में लेते हैं; सम्भवतः नकारात्मक अर्थ अभिप्रेत या पाठगत रूप विकृत है। ‘अगम्य’ इस अर्थ को संक्षिप्त और गरिमापूर्ण ढंग से रखता है।
- source_word: exercitus angelorum
  choice: स्वर्गदूतों की सेना
  rationale: ‘exercitus’ का सामूहिक और सैन्य बिंब सुरक्षित रहता है।
- source_word: cum tremore
  choice: काँपती हुई
  rationale: शाब्दिक अर्थ ‘कंपन/भय के साथ’ है; प्राकृतिक हिन्दी में स्वर्गदूतों की सेना के भयमिश्रित कंपन को व्यक्त करता है।
- source_word: seruatio
  choice: अस्तित्व
  rationale: ‘servatio’ सामान्यतः संरक्षण/सुरक्षा है, पर इस वाक्य में ‘जिनका संरक्षण वायु और अग्नि में बदल जाता है’ अस्पष्ट और अस्वाभाविक है। ‘अस्तित्व’ संभावित आशय को पठनीय रखते हुए अत्यधिक सिद्धान्तगत व्याख्या से बचता है।
- source_word: in uento et igni conuertitur
  choice: वायु और अग्नि में बदल जाता है
  rationale: ‘convertitur’ के रूपान्तरण-बोध तथा ‘ventus/ignis’ के प्रत्यक्ष अर्थ को बनाए रखता है।
- source_word: cuius uerbum
  choice: जिसका वचन
  rationale: खंडित वाक्य को स्रोत की तरह खुला छोड़ता है; ‘verbum’ के लिए गरिमापूर्ण और प्रचलित धार्मिक हिन्दी।
theological_decisions:
- issue: स्वर्गदूतों और वायु-अग्नि के बीच संबंध
  choice: जिनका अस्तित्व वायु और अग्नि में बदल जाता है
  alternative: जिनकी रक्षा वायु और अग्नि में बदल जाती है
  rationale: स्रोत का ‘seruatio’ कठिन और संभावतः पाठगत समस्या वाला है। मुख्य पाठ में स्वर्गदूतों के रूपान्तरण का संभावित आशय रखा गया है, पर इसे ‘वे वायु और अग्नि हैं’ जैसी अधिक निश्चित धर्मवैचारिक व्याख्या नहीं बनाया गया।
- issue: आरम्भिक विशेषण का अर्थ
  choice: अगम्य
  alternative: ग्रहणीय
  rationale: लैटिन रूप सकारात्मक दिखाई देता है, जबकि संदर्भ और परामर्श-पाठ नकारात्मक अर्थ की ओर संकेत करते हैं। ‘अगम्य’ प्रार्थनात्मक संबोधन में सुसंगत है, पर पाठगत तनाव को टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण प्रार्थनात्मक शैली। यह पद पिछले और अगले वाक्य से जुड़ा हुआ खंड है, इसलिए आरम्भ और अंत को स्रोत के समान अपूर्ण रखा गया है। किसी पादटिप्पणी-चिह्न की आवश्यकता नहीं रखी गई।
