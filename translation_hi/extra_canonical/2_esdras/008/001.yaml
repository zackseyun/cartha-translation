id: 2ES.8.1
reference: 2 Esdras 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: hoc saeculum fecit altissimus propter multos, futurum autem propter paucos.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/001.yaml
  text: And he answered me and said[a], “The Most High made this age for many, but the age to come for few.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और कहा, “परमप्रधान ने इस युग[a] को बहुतों के लिए बनाया, पर आनेवाले युग को थोड़े लोगों के लिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवादों में “इस वर्तमान युग”; मूल लैटिन में केवल “इस युग” है।
    reason: मूल में hoc saeculum और पद 3 में अधिक स्पष्ट praesentis saeculi के बीच शब्दगत भेद बनाए रखना।
lexical_decisions:
- source_word: hoc saeculum
  choice: इस युग
  rationale: लैटिन में शाब्दिक रूप से ‘यह युग’ है। ‘वर्तमान’ जोड़ने से पद 3 के praesentis saeculi के साथ मूल में मौजूद शब्दगत भेद मिट जाएगा।
- source_word: altissimus
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त सर्वोच्चता-सूचक उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: futurum
  choice: आनेवाले युग
  rationale: यहाँ विशेषण futurum के साथ saeculum निहित है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘युग’ दोहराया गया है।
- source_word: propter multos / propter paucos
  choice: बहुतों के लिए / थोड़े लोगों के लिए
  rationale: दोनों समानांतर वाक्यांशों का विरोध और व्यापकता बनाम अल्पता का तनाव सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘बहुतों’ और ‘थोड़े लोगों’ का आशय
  choice: मूल कथन को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे उद्धार पाए हुए, चुने हुए या योग्य लोगों के रूप में स्पष्ट करना
  rationale: लैटिन केवल multos और paucos कहता है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को जोड़ना मूल की संक्षिप्तता और तनाव को अनुचित रूप से हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-समीपी शैली रखी गई है। ‘उसने मुझे उत्तर दिया और कहा’ मूल के दोहरे कथन-सूत्र को सुरक्षित रखता है।
