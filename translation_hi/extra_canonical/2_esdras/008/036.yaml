source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deliquit. In hoc enim adnuntiabitur iusticia tua et bonitas tua, domine, cum misertus fueris eis qui non habent substantiam operum bonorum. Et respondit ad me et dixit: recte locutus es aliqua, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/036.yaml
  text: For in this your righteousness and your goodness will be declared, Lord, when you have mercy on those who have no store of good works.”
translation:
  language: hi
  text: क्योंकि, हे प्रभु, इसी में आपकी धार्मिकता और भलाई घोषित होगी—जब आप उन पर दया करेंगे जिनके पास भले कामों की कोई पूँजी नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntiabitur
  choice: प्रकट होगी
  rationale: यहाँ भाव सार्वजनिक रूप से ज्ञात या घोषित होने का है; सहज हिन्दी में ‘प्रकट होगी’ दोनों अर्थों को पर्याप्त रूप से व्यक्त करता है।
- source_word: iusticia tua
  choice: आपकी धार्मिकता
  rationale: लैटिन iusticia ईश्वर के न्यायोचित और धर्ममय चरित्र को सूचित करता है; ‘धार्मिकता’ इस धार्मिक-साहित्यिक संदर्भ में उपयुक्त और परिचित पद है।
- source_word: bonitas tua
  choice: आपकी भलाई
  rationale: bonitas के नैतिक सद्गुण और कृपालुता के व्यापक भाव को सरल, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: substantiam operum bonorum
  choice: भले कामों की कोई पूँजी
  rationale: substantia यहाँ संचित आधार, भंडार या संपदा का रूपक है; ‘पूँजी’ अच्छे कर्मों के संचित भंडार का भाव स्वाभाविक ढंग से रखती है।
- source_word: misertus fueris
  choice: आप ... दया करेंगे
  rationale: भविष्य-सिद्ध क्रिया को हिन्दी में स्वाभाविक काल-संबंध के साथ प्रस्तुत किया गया है; ईश्वरीय करुणा का मूल अर्थ सुरक्षित है।
theological_decisions:
- issue: अच्छे कर्मों और दया का संबंध
  choice: ‘भले कामों की कोई पूँजी नहीं’ और ‘दया करेंगे’ को साथ रखते हुए मूल तनाव सुरक्षित रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘जो अपने अच्छे कर्मों से उद्धार नहीं कमा सकते’ कहना।
  rationale: मूल पाठ उद्धार, योग्यता या प्रतिफल की कोई पूर्ण सिद्धांतगत व्याख्या नहीं देता; इसलिए संप्रदायगत निष्कर्ष जोड़े बिना कर्मों के अभाव और परमेश्वर की दया के बीच का तनाव बनाए रखा गया है।
- issue: iusticia का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘न्याय’ संभव है, पर इस वाक्य में दया के द्वारा प्रकट होने वाला परमेश्वर का धर्ममय चरित्र प्रमुख है; ‘धार्मिकता’ अर्थ की व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। आरंभिक enim को ‘क्योंकि’ से रखा गया है, जिससे पिछले कथन के साथ तर्क-संबंध बना रहता है।
