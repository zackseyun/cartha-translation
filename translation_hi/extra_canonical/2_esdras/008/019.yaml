source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ideo audi meam uocem et intellege sermonum meorum, et loquar coram te. Initium uerborum orationis Ezrae priusquam adsumeretur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/019.yaml
  text: Therefore hear my voice and understand my words[a][b], and I will speak before you.” The beginning of the words of Ezra’s prayer before he was taken up.
translation:
  language: hi
  text: इसलिए मेरी वाणी सुन और मेरी बातों को समझ, और मैं तेरे सामने बोलूँगा।[a] एज्रा की प्रार्थना के शब्दों का आरम्भ—उसके उठा लिए जाने से पहले।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “यह एज्रा की प्रार्थना के शब्दों का आरम्भ है—उसके उठा लिए जाने से पहले।”'
    reason: previous_rendering
  - marker: b
    text: “एज्रा की प्रार्थना के शब्दों का आरम्भ—उसके उठा लिए जाने से पहले” वाला अंतिम खंड रचनात्मक या लिपिकीय संक्रमण जैसा प्रतीत होता है। यहाँ प्रयुक्त लैटिन साक्षी में उपस्थित होने के कारण इसे मूल पाठ में रखा गया है।
    reason: compositional_layer
lexical_decisions:
- source_word: audi meam uocem
  choice: मेरी वाणी सुन
  rationale: ‘वाणी’ लैटिन uox के स्वर और गरिमा को बनाए रखती है; आज की हिन्दी में भी सहज है।
- source_word: intellege sermonum meorum
  choice: मेरी बातों को समझ
  rationale: sermonum का यहाँ स्वाभाविक अर्थ कथन/बातें है; बहुवचन को बनाए रखा गया है।
- source_word: loquar coram te
  choice: मैं तेरे सामने बोलूँगा
  rationale: coram te का स्थानिक-संबंधपरक भाव सीधे रखा गया है और loquar की भविष्याभिमुख क्रिया व्यक्त की गई है।
- source_word: Initium uerborum orationis Ezrae
  choice: एज्रा की प्रार्थना के शब्दों का आरम्भ
  rationale: मूल की संज्ञात्मक, क्रियारहित शीर्षकीय संरचना को बिना ‘यह है’ जोड़े सुरक्षित रखा गया है।
- source_word: priusquam adsumeretur
  choice: उसके उठा लिए जाने से पहले
  rationale: निष्क्रिय क्रिया और उसके संभावित धार्मिक/कथात्मक अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: adsumeretur का आशय
  choice: उठा लिए जाने
  alternative: ग्रहण किए जाने / संसार से उठा लिए जाने
  rationale: लैटिन अभिव्यक्ति अस्पष्ट है कि यह स्वर्गारोहण-सदृश उठाए जाने, परमेश्वर द्वारा ग्रहण किए जाने, या मृत्यु के लिए प्रयुक्त है; हिन्दी में ‘उठा लिए जाने’ वही तनाव बनाए रखता है।
- issue: अंतिम वाक्यांश की पाठीय भूमिका
  choice: क्रियारहित शीर्षक/संक्रमण के रूप में रखा
  alternative: ‘यह एज्रा की प्रार्थना के शब्दों का आरम्भ है...’
  rationale: मूल लैटिन में यह क्रियारहित नाममात्र रूब्रिक है; इसे पूर्ण कथन बनाना स्रोत से अधिक स्पष्टता जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज धार्मिक गद्य। परमेश्वर को संबोधन में एकवचन निकटता बनाए रखने के लिए ‘तेरे’ का प्रयोग किया गया है। अंतिम खंड को जानबूझकर क्रियारहित रखा गया है ताकि लैटिन रूब्रिक की खंडात्मक/शीर्षकीय प्रकृति बनी रहे।
