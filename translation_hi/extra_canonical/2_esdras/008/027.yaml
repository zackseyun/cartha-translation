  text: but to those who have kept your covenants with sorrows. Do not think on those who have conducted themselves falsely before you,
translation:
  language: hi
  text: बल्कि उन लोगों पर ध्यान दे, जिन्होंने दुख सहते हुए तेरी वाचाओं का पालन किया है। और उन लोगों पर ध्यान न दे, जिन्होंने तेरे सामने छलपूर्ण आचरण किया है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testamenta
  choice: वाचाओं
  rationale: बहुवचन का संरक्षण करते हुए धार्मिक-संधि के अर्थ को व्यक्त करता है; केवल सामान्य ‘प्रतिज्ञाओं’ की अपेक्षा स्रोत के अर्थ के अधिक निकट है।
- source_word: cum doloribus
  choice: दुख सहते हुए
  rationale: शाब्दिक ‘दुखों के साथ’ हिंदी में असहज है; यह स्रोत में निहित पीड़ा के साथ निष्ठापूर्वक पालन करने का भाव स्वाभाविक हिंदी में रखता है।
- source_word: custodierunt
  choice: माना है
  rationale: वाचा के संदर्भ में ‘पालन किया/माना’ उपयुक्त है; यहाँ सहज और सामान्य हिंदी के लिए ‘माना है’ चुना गया।
- source_word: Neque cogites
  choice: ध्यान न दे
  rationale: लैटिन cogitare का मूल अर्थ ‘सोचना/विचार करना’ है, पर इस प्रार्थनात्मक संदर्भ में किसी को अनुग्रहपूर्ण विचार में न रखना अभिप्रेत है; ‘ध्यान न दे’ इसे स्वाभाविक रूप में व्यक्त करता है।
- source_word: qui in
  choice: जिन्होंने तेरे सामने
  rationale: दिया गया लैटिन अंश अगले वाक्य के बीच में टूटता है; अंग्रेज़ी परामर्श-पाठ के आधार पर निरंतरता रखते हुए ‘तेरे सामने’ लिया गया है।
theological_decisions:
- issue: वाचा-पालन और दुख का संबंध
  choice: ‘दुख सहते हुए तेरी वाचाओं को माना है’
  alternative: ‘दुखों के साथ तेरी वाचाओं की रक्षा की है’
  rationale: cum doloribus की अस्पष्टता को किसी विशेष प्रायश्चित्त-सिद्धांत में नहीं बदला गया; वफादारी के साथ झेली गई पीड़ा का सामान्य अर्थ रखा गया है।
- issue: झूठे आचरण करने वालों के विषय में ईश्वर से निवेदन
  choice: ‘उन लोगों पर ध्यान न दे’
  alternative: ‘उनके विषय में न सोच’
  rationale: वाक्य को ईश्वर की सर्वज्ञता के निषेध जैसा बनाने के बजाय संदर्भगत निवेदन व्यक्त किया गया है, बिना यह निश्चित किए कि इसका आशय न्याय, स्मरण या कृपा में से विशेषतः कौन-सा है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। संबोधन में निकटता और स्रोत की एकवचन शैली बनाए रखने के लिए ‘तेरी/तेरे’ रखा गया है। आरंभ और अंत की विराम-रचना यह दिखाती है कि पद उपलब्ध पाठ में पिछले और अगले वाक्यांश से जुड़ा हुआ अंश है।
