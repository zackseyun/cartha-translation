  text: And he answered me and said[a], “What is present is for the present, and what is future is for the future.
translation:
  language: hi
  text: तब उसने मुझे उत्तर देकर कहा, “जो बातें वर्तमान की हैं, वे वर्तमान में रहने वाले लोगों के लिए हैं, और जो बातें भविष्य की हैं, वे भविष्य में रहने वाले लोगों के लिए हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो वर्तमान है, वह वर्तमान के लिए है, और जो भविष्य है, वह भविष्य के लिए है।”
    reason: लातीनी दत्तिव बहुवचन को वर्तमान और भविष्य के लोगों के लिए समझना मुख्य पाठ में रखा गया है; अधिक अमूर्त अर्थ भी सम्भव है।
lexical_decisions:
- source_word: praesentia praesentibus
  choice: वर्तमान की बातें ... वर्तमान में रहनेवालों के लिए
  rationale: पहला पद नपुंसकलिंग बहुवचन ‘वर्तमान बातें’ और दूसरा दत्तिव बहुवचन ‘वर्तमान में रहनेवालों के लिए’ है; हिन्दी में यह रूप दोनों को अलग और स्वाभाविक रखता है।
- source_word: futura futuris
  choice: भविष्य की बातें ... भविष्य में रहनेवालों के लिए
  rationale: लातीनी समानांतरता और भावी काल/युग से जुड़े लोगों की ओर संकेत सुरक्षित रहता है।
- source_word: respondit ad me et dixit
  choice: उसने मुझे उत्तर दिया
  rationale: हिन्दी में ‘उत्तर देकर कहा’ अनावश्यक पुनरुक्ति लगेगी; संक्षिप्त रूप मूल कथन-भूमिका का अर्थ स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: praesentibus और futuris का संकेत कालखंडों की ओर है या उनमें रहनेवाले लोगों की ओर
  choice: वर्तमान और भविष्य में रहनेवाले लोग
  alternative: वर्तमान के लिए / भविष्य के लिए
  rationale: दोनों लातीनी रूप दत्तिव बहुवचन हैं और प्रसंग में दो समूहों का विरोध सूचित कर सकते हैं; लोगों को स्पष्ट करना व्याकरणिक भेद को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक अमूर्त सम्भावना दर्ज करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; मूल की संतुलित समानांतर रचना बनाए रखी गई है। उपलब्ध लातीनी अंश अगले वाक्य में आगे बढ़ता है (‘क्योंकि तुम्हारे लिए बहुत कुछ शेष है कि…’), पर दिए गए पद-पाठ की सीमा के अनुसार उसे यहाँ शामिल नहीं किया गया।
