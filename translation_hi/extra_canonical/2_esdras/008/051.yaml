  text: But understand for yourself[a], and seek glory among those like you.
translation:
  language: hi
  text: परन्तु तू स्वयं समझ, और अपने जैसे लोगों की महिमा के विषय में पता लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tu autem
  choice: परन्तु तू
  rationale: विरोधसूचक autem और एकवचन सम्बोधन tu—दोनों को स्पष्ट रखा गया है।
- source_word: pro te intellege
  choice: अपने लिए समझ
  rationale: यह वाक्यांश असामान्य होते हुए भी व्यक्ति को स्वयं अपने विषय में समझने या विचार करने की ओर मोड़ता है; अनुवाद इसकी संक्षिप्तता और संभावित अस्पष्टता बनाए रखता है।
- source_word: de similibus tuis
  choice: अपने जैसे लोगों के बीच
  rationale: de को यहाँ उस समुदाय या वर्ग के दायरे में खोजने के अर्थ में लिया गया है, जैसा कि प्रसंग और परामर्श-पाठ सुझाते हैं।
- source_word: inquire gloriam
  choice: महिमा की खोज कर
  rationale: inquire के खोजने/ढूँढ़ने और gloriam के महिमा अर्थ को सीधे तथा स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: महिमा किसके लिए खोजी जानी है
  choice: अपने जैसे लोगों के बीच महिमा की खोज
  alternative: अपने जैसे लोगों के लिए महिमा की खोज
  rationale: Latin de similibus tuis लाभार्थी के लिए अपेक्षित स्पष्ट पदबंध नहीं है; इसलिए इसे उन लोगों के बीच या उनके दायरे में खोजने के रूप में रखा गया है, बिना यह जोड़ने के कि महिमा अनिवार्यतः उनके लिए है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; एकवचन सम्बोधन की निकटता और आदेशात्मक स्वर बनाए रखने के लिए ‘तू’ तथा ‘कर’ प्रयुक्त हैं। पूर्व अंग्रेज़ी पादटिप्पणी में दिया पाठ वास्तव में पिछले पद से जुड़ा पुराना, पद-विस्थापित अनुवाद है; इसलिए उसे पाठांतर के रूप में शामिल नहीं किया गया।
