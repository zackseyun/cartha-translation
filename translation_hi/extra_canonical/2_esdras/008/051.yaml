revisions:
- from: परन्तु तू अपने लिए समझ, और अपने जैसे लोगों के बीच महिमा की खोज कर।
  to: परन्तु तू स्वयं समझ, और अपने जैसे लोगों की महिमा के विषय में पता लगा।
  rationale: The text is revised to reflect de similibus tuis as the subject matter of inquiry (‘about the glory of those like you’), rather than as the sphere in which glory is sought. The phrasing is also made idiomatic in modern standard Hindi while preserving the concise, dignified imperative style.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:09:15Z'
review_pass:
  verdict: revise
  source_fidelity: Latin de similibus tuis most naturally means ‘concerning/about those like you,’ not ‘among those like you.’ The imperative inquire is better represented as making inquiry or finding out about their glory than as seeking glory within their group. The revision retains the compact, individual address and the source’s ambiguity about the exact nature of this ‘glory.’
  naturalness: ‘अपने लिए समझ’ is understandable but not idiomatic modern Hindi. ‘तू स्वयं समझ’ is natural and preserves the personal, contrastive force. ‘महिमा के विषय में पता लगा’ is a natural non-forensic equivalent for inquire.
  terminology: ‘महिमा’ suitably renders gloriam and maintains the elevated register. The singular informal address (‘तू’) and imperatives fit the source text’s direct singular address.
  issues:
  - severity: medium
    issue: ‘अपने जैसे लोगों के बीच’ renders de similibus tuis as a location/group setting.
    rationale: With inquire, de normally marks the persons or matter concerning which inquiry is made. The Latin calls for inquiry about the glory of people like the addressee, rather than a search for glory among them.
  - severity: low
    issue: ‘अपने लिए समझ’ is non-idiomatic in this context.
    rationale: Although literal, it can suggest understanding for one’s own benefit. ‘स्वयं समझ’ expresses pro te naturally without adding interpretation.
  revised_text: परन्तु तू स्वयं समझ, और अपने जैसे लोगों की महिमा के विषय में पता लगा।
