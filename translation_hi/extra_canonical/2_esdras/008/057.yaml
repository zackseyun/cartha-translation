    reason: खंड-सीमा पर ‘Adhuc autem et’ वाक्य को अधूरा छोड़ता है; पाठक को इस असामान्य समाप्ति की सूचना देना आवश्यक है।
lexical_decisions:
- source_word: contempserunt
  choice: उन्होंने उसका तिरस्कार किया
  rationale: लातीनी क्रिया में अवमानना या तुच्छ जानने का भाव है; ‘तिरस्कार किया’ उसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: uias eius
  choice: उसके मार्गों
  rationale: ‘मार्ग’ धार्मिक-नैतिक आचरण के रूपक को बनाए रखता है और eius के पुल्लिंग एकवचन संदर्भ को ‘उसके’ से सुरक्षित रखता है।
- source_word: dereliquerunt
  choice: छोड़ दिया
  rationale: यह परित्याग के अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Adhuc autem et
  choice: इसके अतिरिक्त, उन्होंने
  rationale: यह अधूरा लातीनी वाक्यांश अगले पाठ-खंड की ओर बढ़ता है। ‘इसके अतिरिक्त’ autem et के योगात्मक संक्रमण को व्यक्त करता है; क्रिया से जुड़ने के लिए ‘उन्होंने’ रखा गया है, जबकि वाक्य जानबूझकर अधूरा है।
theological_decisions:
- issue: ‘उसका/उसके’ का संदर्भ
  choice: सर्वनाम को ज्यों का त्यों रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर’ लिखना
  rationale: इस स्रोत-खंड में नाम उपस्थित नहीं है; संदर्भ को स्पष्ट करने के लिए नाम जोड़ना मूल की वास्तविक संदर्भ-निर्भरता को मिटा देता।
- issue: खंड के अंत की अपूर्णता
  choice: अंत को अगले खंड से जुड़ा हुआ और अपूर्ण रखा गया
  alternative: अनुमान लगाकर वाक्य पूरा करना
  rationale: लातीनी स्रोत ‘Adhuc autem et’ पर समाप्त होता है; अज्ञात अगली सामग्री जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और स्रोत के निकट है। ‘मार्गों’ से बाइबिलीय नैतिक रूपक सुरक्षित है। अंतिम खंड को स्रोत की अपूर्णता के कारण पूरा नहीं किया गया।
