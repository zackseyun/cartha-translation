translation:
  language: hi
  text: तुम्हारे वचनों के अनुसार वैसा ही होगा। क्योंकि सचमुच मैं विचार नहीं करूँगा
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuxta sermones tuos
  choice: तुम्हारे वचनों के अनुसार
  rationale: ‘iuxta’ के अनुरूप ‘के अनुसार’ और बहुवचन ‘sermones’ के लिए गरिमापूर्ण तथा स्वाभाविक ‘वचनों’ रखा गया है।
- source_word: sic et fiet
  choice: वैसा ही होगा
  rationale: भविष्यकालीन अर्थ और ‘sic’ के अनुरूप परिणाम को सीधे व्यक्त करता है।
- source_word: Quoniam uere
  choice: क्योंकि सचमुच
  rationale: कारणसूचक संबंध और बलाघात दोनों को सुरक्षित रखता है।
- source_word: non cogitabo
  choice: मैं विचार नहीं करूँगा
  rationale: ‘cogitabo’ के भविष्यकाल और मानसिक क्रिया को निकटता से व्यक्त करता है; स्रोत का वाक्यांश अधूरा होने के कारण कोई कर्म नहीं जोड़ा गया।
theological_decisions:
- issue: अपूर्ण वाक्यांश का संरक्षण
  choice: पद को ‘मैं विचार नहीं करूँगा’ पर अधूरा रहने दिया गया है।
  alternative: अनुमान से कोई कर्म या अगले पद की सामग्री जोड़ना।
  rationale: उपलब्ध लैटिन पाठ इसी स्थान पर अपूर्ण है; अर्थ को अनुमान से पूरा करना स्रोत की वास्तविक पाठगत स्थिति को छिपा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्रोत-सन्निकट भाषा; लैटिन खंड की अपूर्णता जानबूझकर सुरक्षित रखी गई है।
