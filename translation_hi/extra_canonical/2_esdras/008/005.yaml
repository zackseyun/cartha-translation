source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Conuenisti enim obaudire et profecta es nolens, non enim tibi est datum spatium nisi solum modicum uiuere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/005.yaml
  text: For you have consented to obey and have advanced unwillingly[a], for no span has been given to you except only a little while to live.
translation:
  language: hi
  text: क्योंकि तूने आज्ञा मानना स्वीकार किया और अनिच्छा से चल पड़ी[a]; तुझे जीने के लिए केवल थोड़ा-सा समय ही दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनिच्छा से रवाना हुई।”
    reason: profecta es में चल पड़ने या प्रस्थान करने का यात्रा-संबंधी भाव है; वैकल्पिक अनुवाद उस अर्थ को अधिक प्रत्यक्ष बनाता है।
lexical_decisions:
- source_word: conuenisti
  choice: स्वीकार किया
  rationale: यहाँ क्रिया सहमति या रज़ामंदी देने का भाव रखती है; ‘स्वीकार किया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: obaudire
  choice: आज्ञा मानना
  rationale: लैटिन शब्द केवल सुनने के बजाय आज्ञापालन का अर्थ देता है।
- source_word: profecta es
  choice: चल पड़ी
  rationale: proficiscor का सामान्य अर्थ यात्रा पर निकलना या प्रस्थान करना है। स्त्रीलिंग रूप profecta es को ‘चल पड़ी’ से सुरक्षित रखा गया है; ‘आगे बढ़ी’ कहना शब्द को progress की ओर अनावश्यक रूप से मोड़ सकता है।
- source_word: spatium ... modicum uiuere
  choice: जीने के लिए केवल थोड़ा-सा समय
  rationale: यह अभिव्यक्ति जीवन के लिए मिले सीमित समय को सरल और स्पष्ट हिन्दी में व्यक्त करती है।
