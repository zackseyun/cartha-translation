  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। मूल के स्त्रीलिंग एकवचन संबोधन को ‘तू’ और ‘चल पड़ी’ में बनाए रखा गया है। दूसरे उपवाक्य में कारण-सूचक enim को हिन्दी में अलग ‘क्योंकि’ दोहराए बिना अर्थ-संबंध और प्रवाह सुरक्षित रखा गया है।
