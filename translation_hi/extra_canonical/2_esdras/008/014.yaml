  text: your work. If therefore you destroy the one who was formed with such great labors[a], why then was he made?
translation:
  language: hi
  text: तेरी कृति। इसलिए यदि तू उसे नष्ट कर दे, जिसे इतने बड़े परिश्रम से गढ़ा गया था,[a] तो फिर उसे बनाया ही क्यों गया था?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ विस्तृत पाठ-परंपराओं में भाव है: ‘यदि तू एक सहज आदेश से उसे नष्ट कर दे, जिसे तेरी आज्ञा से इतने बड़े परिश्रम से गढ़ा गया था।’ ये शब्द दिए गए लैटिन पाठ में नहीं हैं।'
    reason: अंग्रेज़ी परामर्श-पाठ की पूर्व पाठ-परंपरा को दर्ज करते हुए दिए गए लैटिन स्रोत से उसका अंतर स्पष्ट करना।
lexical_decisions:
- source_word: tuum opus
  choice: तेरी कृति
  rationale: यह पूर्ववर्ती संदर्भ से जुड़ा संक्षिप्त खंड है; ‘कृति’ सृष्टिकर्ता के बनाए हुए कार्य का गरिमापूर्ण और स्वाभाविक बोध देता है।
- source_word: perdideris
  choice: नष्ट कर दे
  rationale: यहाँ संभाव्य शर्त में पूर्ण विनाश या खो देने का अर्थ है; संदर्भ में ‘नष्ट कर देना’ अधिक स्पष्ट है।
- source_word: tantis laboribus
  choice: इतने बड़े परिश्रम से
  rationale: tantis परिश्रम की महान मात्रा पर बल देता है; एकवचन सामूहिक ‘परिश्रम’ हिंदी में स्वाभाविक है।
- source_word: plasmatus
  choice: गढ़ा गया था
  rationale: plasmare में आकार देकर रचने का भाव है; ‘गढ़ा’ मनुष्य की विचारपूर्वक रचना को व्यक्त करता है।
theological_decisions:
- issue: सृष्टि और विनाश के बीच आलंकारिक तनाव
  choice: प्रश्न को अनसुलझे आलंकारिक रूप में रखा गया
  alternative: इसे परमेश्वर के उद्देश्य के बारे में स्पष्ट कथन बनाना
  rationale: लैटिन खंड सृष्टि में लगे महान परिश्रम और बाद के विनाश के बीच तनाव रखता है; अनुवाद को उसकी धार कम नहीं करनी चाहिए।
- issue: plasmatus में कर्ता
  choice: कर्मवाच्य ‘गढ़ा गया था’
  alternative: ‘तूने गढ़ा था’
  rationale: स्रोत पाठ इस खंड में कर्ता को व्याकरणतः व्यक्त नहीं करता; कर्मवाच्य मूल की अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिंदी; परमेश्वर को संबोधित करने के लिए निकट और गंभीर ‘तू/तेरी’ रखा गया है। आरंभिक ‘तेरी कृति’ जानबूझकर खंडात्मक है, क्योंकि उपलब्ध लैटिन भी पूर्ववर्ती वाक्य से जुड़ा अंश है।
