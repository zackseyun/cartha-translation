source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: possis diligere meam creaturam super me, tu autem frequenter temetipsum proximasti iniustis, numquam Sed et in hoc mirabilis eris coram altissimo, Quoniam humiliasti te, sicut decet
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/047.yaml
  text: Can you love my creation more than I do? But you have often drawn yourself near to the unrighteous. Never do so. Yet even in this you will be marvelous before the Most High[a], because you have humbled yourself, as is fitting.
translation:
  language: hi
  text: क्या तुम मुझसे अधिक मेरी सृष्टि से प्रेम कर सकते हो? पर तुम बार-बार अपने आपको अधर्मियों के पास ले गए हो।[a] ऐसा कभी मत करना। फिर भी इसी बात में तुम परमप्रधान के सामने अद्भुत ठहरोगे, क्योंकि तुमने अपने आपको दीन किया है, जैसा उचित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको अधर्मियों के साथ तुलना की है।”
    reason: यह पूर्ववर्ती वैकल्पिक rendering को temetipsum proximasti iniustis के उचित स्थान पर रखता है; मुख्य पाठ लैटिन proximare के ‘निकट आने/ले जाने’ के बिंब को बनाए रखता है।
lexical_decisions:
- source_word: meam creaturam
  choice: मेरी सृष्टि
  rationale: यह सृष्ट वस्तुओं या प्राणियों के समष्टिगत अर्थ को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: temetipsum proximasti iniustis
  choice: अपने आपको अधर्मियों के निकट रखा है
  rationale: लैटिन proximasti का मूल बिंब ‘निकट लाना/होना’ है; यह मानसिक तुलना के बजाय स्वयं को अधर्मियों के पास या उनकी श्रेणी से संबद्ध रखने का भाव देता है।
- source_word: mirabilis eris
  choice: अद्भुत ठहरोगे
  rationale: भविष्यकाल और coram altissimo के मूल्यांकनात्मक संदर्भ दोनों को बनाए रखता है; केवल ‘प्रशंसनीय’ कहकर अर्थ को सीमित नहीं करता।
- source_word: humiliasti te
  choice: अपने आपको दीन किया है
  rationale: स्वैच्छिक आत्म-दीनता का धार्मिक और नैतिक भाव आधुनिक, गरिमापूर्ण हिंदी में सुरक्षित रहता है।
- source_word: sicut decet
  choice: जैसा उचित है
  rationale: लैटिन के औचित्य-सूचक संक्षिप्त वाक्यांश का सीधा और स्वाभाविक रूप।
theological_decisions:
- issue: क्या मनुष्य परमेश्वर की सृष्टि से परमेश्वर से अधिक प्रेम कर सकता है
  choice: प्रश्नात्मक रूप बनाए रखा गया
  alternative: ‘तुम मेरी सृष्टि से मुझसे अधिक प्रेम नहीं कर सकते’ जैसा कथन
  rationale: possis और प्रसंग प्रश्न की वास्तविक चुनौती को व्यक्त करते हैं; कथन में बदलने से वाक्य का आलंकारिक तनाव घट जाता।
- issue: एज्रा का अधर्मियों से संबंध
  choice: ‘अपने आपको अधर्मियों के निकट रखा’
  alternative: ‘अपने आपको अधर्मियों में गिना’
  rationale: मुख्य पाठ में proximare की निकटता की छवि बचाई गई है, जबकि संभावित वर्गीकरण/आत्म-पहचान का अर्थ पादटिप्पणी में दिया गया है।
- issue: परमप्रधान के सामने अद्भुत ठहरना
  choice: ‘अद्भुत ठहरोगे’
  alternative: ‘प्रशंसनीय ठहरोगे’
  rationale: mirabilis की व्यापकता और कुछ असामान्य लगने वाले धार्मिक तनाव को बिना व्याख्यात्मक संकुचन के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘परमप्रधान’, ‘अधर्मी’ और ‘दीन करना’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। मुख्य पाठ ने लैटिन की प्रश्नात्मकता, निकटता के बिंब और mirabilis की अर्थगत खुलावट को यथासंभव सुरक्षित रखा है।
