    issue: ‘सुगम व्यवस्था’ for facili ordine
    rationale: Although semantically possible, “व्यवस्था” can suggest an institutional system rather than order/sequence, and “सुगम व्यवस्था” is stiff in this context. “सहज क्रम” better reflects the Latin while remaining natural.
