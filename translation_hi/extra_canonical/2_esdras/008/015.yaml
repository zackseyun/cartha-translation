  text: 'est tuo iussu, facili ordine, et utquid fiebat? Et nunc dicens dicam: de omni homine tu magis scis, de populo autem tuo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/015.yaml
  text: 'It is by your command[a], in an easy order, and why was it done? And now I will speak: concerning every man you know better, but concerning your people'
translation:
  language: hi
  text: 'यह तेरी आज्ञा से, सहज क्रम में है—और यह क्यों किया गया? अब मैं निश्चय ही कहूँगा[a]: हर मनुष्य के विषय में तू अधिक जानता है, पर तेरी प्रजा के विषय में…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी में शब्दशः, ‘कहते हुए कहूँगा’; यह कथन पर बल देने वाली अभिव्यक्ति हो सकती है।
    reason: source_idiom
  - marker: b
    text: दिए गए लातीनी पाठ में वाक्य यहाँ अधूरा है और विचार अगले पद में आगे बढ़ता है।
    reason: verse_boundary
lexical_decisions:
- source_word: tuo iussu
  choice: तेरी आज्ञा से
  rationale: लातीनी पद का सीधा और स्वाभाविक संबंधसूचक अनुवाद; संबोधन की एकवचन निकटता बनाए रखता है।
- source_word: facili ordine
  choice: सुगम व्यवस्था में
  rationale: ordo के ‘क्रम/व्यवस्था’ और facilis के ‘सुगम’ अर्थ को रखते हुए असामान्य, खंडित वाक्य-विन्यास को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: dicens dicam
  choice: मैं अवश्य कहूँगा
  rationale: लातीनी पुनरुक्ति को शब्दशः अस्वाभाविक बनाने के बजाय उसके संभावित बलाघात को व्यक्त करता है।
- source_word: de omni homine
  choice: प्रत्येक मनुष्य के विषय में
  rationale: omni की व्यापकता और de की विषय-सूचक भूमिका दोनों सुरक्षित रहती हैं।
- source_word: populo autem tuo
  choice: पर अपनी प्रजा के विषय में
  rationale: autem का विरोधसूचक भाव और ‘तेरी प्रजा’ का संबंध बनाए रखता है; स्रोत की अधूरी धारा को पूरा नहीं करता।
theological_decisions:
- issue: अधूरे अंतिम उपवाक्य की पूर्ति
  choice: वाक्य को दीर्घविराम के साथ अधूरा रखा गया
  alternative: अगले पद से शोक का संबंधवाक्य लेकर यहाँ जोड़ना
  rationale: दिए गए लातीनी स्रोत में पद ‘पर अपनी प्रजा के विषय में’ पर रुकता है; अगले पद की सामग्री जोड़ने से इस इकाई की सीमा और पाठगत तनाव बदल जाता।
- issue: dicens dicam का बल
  choice: ‘मैं अवश्य कहूँगा’
  alternative: ‘मैं कहूँगा’ अथवा शब्दशः ‘कहते हुए कहूँगा’
  rationale: यह पुनरुक्ति संभावित सामी बलाघात को दर्शाती है, पर किसी विशेष धर्मवैज्ञानिक अर्थ को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। ईश्वर के लिए एकवचन निकट संबोधन ‘तेरी/तू’ स्रोत के व्याकरण के अनुरूप है। आरंभिक लातीनी वाक्य की खंडित और संदिग्ध संरचना को सहज बनाने का सीमित प्रयास किया गया है, पर उसे किसी निश्चित निहित कर्ता या अर्थ से नहीं भरा गया।
