  text: but I will rejoice over the formation of the righteous[a], and over their pilgrimage also, and their salvation, and the reception of their reward.
translation:
  language: hi
  text: पर मैं धर्मियों की रचना पर[a], और उनके परदेश-प्रवास, उनके उद्धार और उनके प्रतिफल की प्राप्ति पर भी आनन्दित होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके परदेश-प्रवास, उनके उद्धार और उनके प्रतिफल की प्राप्ति पर भी।’
    reason: पूर्ववर्ती अनुवाद में वाक्य-विन्यास ऐसा था जिसमें ‘धर्मियों की रचना’ अलग से व्यक्त नहीं होती।
lexical_decisions:
- source_word: peregrinationis
  choice: परदेश-प्रवास
  rationale: लातीनी शब्द अस्थायी निवास या इस संसार में यात्री-जैसे जीवन का भाव रखता है; ‘परदेश-प्रवास’ इस ठोस अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: saluationis
  choice: उद्धार
  rationale: धार्मिक संदर्भ में यह लातीनी शब्द का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: mercedis receptionis
  choice: प्रतिफल की प्राप्ति
  rationale: यह पदबंध प्रतिफल को पाने या ग्रहण करने की घटना बताता है; ‘प्राप्ति’ औपचारिकता और स्वाभाविकता के बीच संतुलन रखती है।
- source_word: plasma iustorum
  choice: धर्मियों की रचना
  rationale: यह वाक्यांश उपलब्ध लातीनी अंश से ठीक पहले के पाठ और परामर्शी अंग्रेज़ी पाठ में सुरक्षित है; ‘रचना’ plasma के गठन/सृजन संबंधी अर्थ को बिना व्याख्यात्मक विस्तार के रखती है।
theological_decisions:
- issue: संबंधवाचक रूपों का संकेत किसकी ओर है
  choice: ‘उनके’ को धर्मियों से संबंधित रखा गया
  alternative: अमूर्त रूप में केवल ‘परदेश-प्रवास, उद्धार और प्रतिफल की प्राप्ति’
  rationale: peregrinationis, saluationis और mercedis receptionis के संबंधवाचक रूप निकटवर्ती ‘धर्मियों’ की ओर लौटते हैं; हिन्दी में ‘उनके’ इस निहित संबंध को स्पष्ट करता है।
- issue: plasma का अर्थ
  choice: रचना
  alternative: गठन अथवा सृष्टि
  rationale: ‘रचना’ मूल के सृजन/गठन के तनाव को बनाए रखती है और किसी विशेष मानवशास्त्रीय सिद्धान्त को पाठ में नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। ‘आनन्दित होऊँगा’ भविष्यकाल और वक्ता के भाव को सुरक्षित रखता है। उपलब्ध लातीनी उद्धरण आरम्भ में वाक्य के बीच से शुरू होता है; मुख्य पाठ का आरम्भ परामर्शी अंग्रेज़ी पाठ तथा उसी लातीनी वाक्य के पूर्वसंदर्भ के आधार पर रखा गया है।
