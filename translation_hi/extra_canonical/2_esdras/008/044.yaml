  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/044.yaml
  text: called your image[a], because he has been made like you, through whom you formed all things, and you have likened him to the farmer’s seed. No, Lord
translation:
  language: hi
  text: तेरा प्रतिरूप कहलाया, क्योंकि वह तेरे समान बनाया गया; उसी के लिए[a] तूने सब कुछ रचा, और तूने उसकी तुलना किसान के बीज से की। नहीं, प्रभु—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में शाब्दिक रूप से, ‘जिसके द्वारा’। पर अंतर्निहित यूनानी और प्रसंग के अनुसार अर्थ ‘जिसके लिए’ है।
    reason: लैटिन के साधनवाचक शब्दार्थ को स्पष्ट रखते हुए अंतर्निहित यूनानी पाठ और प्रसंग पर आधारित उद्देश्यवाचक अनुवाद का कारण बताना।
lexical_decisions:
- source_word: tua imago nominatus
  choice: तेरा प्रतिरूप कहलाया
  rationale: ‘nominatus’ का अर्थ ‘कहलाया’ है; खंडित वाक्य की पुरुषवाचक कर्तृ-संगति और ‘तुआ इमागो’ का अर्थ बनाए रखा गया है।
- source_word: quoniam similatus est
  choice: क्योंकि वह तेरे समान बनाया गया
  rationale: कर्मवाच्य भाव को स्वाभाविक आधुनिक हिन्दी में रखा गया है; समानता को पहचान की पूर्ण समता नहीं बनाया गया।
- source_word: per quem omnia plasmasti
  choice: उसी के लिए तूने सब कुछ रचा
  rationale: लैटिन ‘per quem’ अकेले देखने पर साधनवाचक भी हो सकता है, पर उपलब्ध पाठ-समीक्षा के अनुसार यह अंतर्निहित यूनानी उद्देश्यवाचक अभिव्यक्ति और 4 एज्रा के व्यापक विचार—मनुष्य के लिए संसार की रचना—को दर्शाता है।
- source_word: similasti eum semini agricolae
  choice: तूने उसकी तुलना किसान के बीज से की
  rationale: ‘किसान के बीज’ की उपमा को बिना अतिरिक्त व्याख्या के स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Non, domine
  choice: नहीं, प्रभु—
  rationale: स्रोत का अचानक टूटता हुआ वाक्यांश सुरक्षित रखने के लिए दीर्घ विराम लगाया गया है; अनुपस्थित शब्द नहीं जोड़े गए।
theological_decisions:
- issue: क्या मनुष्य सृष्टि का माध्यम है या सृष्टि उसके लिए हुई?
  choice: उसी के लिए तूने सब कुछ रचा
  alternative: जिसके द्वारा तूने सब कुछ रचा
  rationale: साधनवाचक विकल्प मनुष्य को सृष्टि का कर्तृ-माध्यम बना सकता है, जो प्रसंग में असंगत धर्मवैज्ञानिक अर्थ उत्पन्न करता है। उद्देश्यवाचक अनुवाद उपलब्ध अंतर्निहित यूनानी साक्ष्य और पुस्तक के संदर्भ के अनुरूप है; पाठगत अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संबोधन में एकवचन ‘तू/तेरा’ वाला बाइबिलीय रजिस्टर अपनाया गया है। आरंभ और अंत, दोनों स्थानों पर स्रोत के खंडित स्वरूप को जस का तस रखा गया है।
