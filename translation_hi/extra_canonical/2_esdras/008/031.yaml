translation:
  language: hi
  text: दोषी ठहराए जाएँ, पर तू उनसे प्रेम करे जिन्होंने सदा तेरी महिमा पर भरोसा रखा है। क्योंकि हमने और हमारे पुरखों ने नश्वर रीति से आचरण किया है, पर तू तो…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicati
  choice: दोषी ठहराए जाएँ
  rationale: यह बहुवचन कर्मवाच्य रूप पूर्ववर्ती वाक्य से जुड़ा हुआ है। उपलब्ध अंश में उसका निषेध या कर्ता नहीं है, इसलिए अनुवाद भी वाक्य के बीच से आरम्भ होने का भाव बनाए रखता है।
- source_word: diligas
  choice: तू उनसे प्रेम करे
  rationale: सम्बोधित परमेश्वर के लिए प्रयुक्त संभावनार्थक रूप को प्रार्थना/कामना के स्वाभाविक हिन्दी रूप में रखा गया है।
- source_word: qui semper in tua gloria confiderunt
  choice: जिन्होंने सदा तेरी महिमा पर भरोसा रखा है
  rationale: confidere का मूल भाव भरोसा रखना है; in tua gloria को बिना व्याख्यात्मक विस्तार के ‘तेरी महिमा पर’ रखा गया है।
- source_word: mortalibus moribus egimus
  choice: नश्वर मनुष्यों के ढंग से जीवन बिताया है
  rationale: शाब्दिक ‘नश्वर रीति-व्यवहारों में आचरण किया’ अस्वाभाविक होता। यह चयन मानवीय नश्वरता से चिह्नित जीवन-व्यवहार को स्पष्ट करता है, पर इसे स्वतः ‘पापमय’ नहीं बनाता।
- source_word: tu autem
  choice: परन्तु तू…
  rationale: स्रोत इसी अधूरे विरोधसूचक वाक्यांश पर समाप्त होता है; त्रिबिंदु उस वास्तविक अपूर्णता को सुरक्षित रखता है।
theological_decisions:
- issue: mortalibus moribus को नैतिक पाप के रूप में स्पष्ट करना
  choice: नश्वर मनुष्यों के ढंग से
  alternative: पापमय चालचलन में
  rationale: Latin में mortalibus का प्रत्यक्ष अर्थ ‘नश्वर/मरणशील’ है। संदर्भ में नैतिक दुर्बलता निहित हो सकती है, पर ‘पापमय’ कहना स्रोत से अधिक निश्चित व्याख्या जोड़ देता।
- issue: आरम्भिक iudicati के साथ लुप्त निषेध जोड़ना
  choice: दोषी ठहराए जाएँ
  alternative: दोषी न ठहराए जाएँ
  rationale: उपलब्ध स्रोत अंश में non नहीं है। पूर्ववर्ती पाठ से निषेध सम्भव हो सकता है, पर दिए गए साक्ष्य में उसे जोड़ना वास्तविक पाठगत अपूर्णता को चुपचाप सुलझाना होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी अपनाई गई है। परमेश्वर के लिए पारंपरिक निकट एकवचन ‘तू/तेरी’ रखा गया है। आरम्भ और अंत की खंडित वाक्य-रचना स्रोत के दिए हुए अंश के अनुरूप सुरक्षित है।
