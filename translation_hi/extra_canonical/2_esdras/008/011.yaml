source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mamillis, praeberi lac, fructum mamillarum, Vt nutriatur id quod plasmatum est usque in tempus aliquem, et postea dispones eum tuae misericordiae. Enutristi eum tuae iusticiae et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/011.yaml
  text: from the breasts[a], milk is provided, the fruit of the breasts, so that what has been formed may be nourished for a certain time, and afterward you direct him by your mercy. You nourished him in your righteousness and instructed him in your law and corrected him by your understanding,
translation:
  language: hi
  text: स्तनों से दूध—स्तनों का फल—दिया जाता है, ताकि जो रचा गया है, उसका कुछ समय तक पोषण हो; और उसके बाद आप अपनी दया से उसका मार्गदर्शन करेंगे।[a] आपने अपनी धार्मिकता से उसका पोषण किया, अपनी व्यवस्था की शिक्षा दी, और अपनी बुद्धि से उसे सुधारा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप उसे अपनी दया को सौंप देंगे।”
    reason: dispones eum tuae misericordiae में सक्रिय दिशा देने के साथ उसे दया के अधीन या दया को सौंपने का अर्थ भी व्याकरणतः सम्भव माना गया है; मूल के भविष्यकाल को वैकल्पिक अनुवाद में भी रखा गया है।
lexical_decisions:
- source_word: mamillis, praeberi lac, fructum mamillarum
  choice: स्तनों से दूध—स्तनों का फल—मिलता है
  rationale: लैटिन की पुनरुक्ति और शारीरिक बिंब को बनाए रखते हुए वाक्य को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: plasmatum est
  choice: जो रचा गया है
  rationale: plasmare का अर्थ आकार देना या रचना है; यहाँ गर्भ में बने मनुष्य के लिए सहज और व्यापक अभिव्यक्ति चुनी गई है।
- source_word: dispones eum
  choice: उसका मार्गदर्शन करते हैं
  rationale: उत्तरकालीन लैटिन disponere यहाँ व्यवस्था करने, दिशा देने या संचालन करने का भाव रख सकता है; प्रसंग में सक्रिय दैवी मार्गदर्शन उपयुक्त है।
- source_word: misericordiae
  choice: अपनी दया से
  rationale: इसे साधन-सूचक दातृ कारक मानकर अनुवाद किया गया है, जो आगे ‘अपनी समझ से’ के समानांतर है।
- source_word: iusticiae
  choice: अपनी धार्मिकता में
  rationale: ईश्वर की iustitia के नैतिक और धार्मिक आयाम को रखते हुए अंग्रेज़ी परामर्श-पाठ की समानांतर संरचना भी सुरक्षित की गई है।
- source_word: lege tua
  choice: अपनी व्यवस्था में
  rationale: धार्मिक संदर्भ में lex के लिए ‘व्यवस्था’ प्रचलित और अर्थ-सटीक है।
- source_word: corripuisti
  choice: सुधारा
  rationale: शब्द में डाँटने, अनुशासित करने और सुधारने का भाव है; ‘सुधारा’ आधुनिक हिन्दी में इनका उपयुक्त समावेश करता है।
theological_decisions:
- issue: dispones eum tuae misericordiae का कारक-संबंध
  choice: आप अपनी दया से उसका मार्गदर्शन करते हैं
  alternative: आप उसे अपनी दया के अधीन कर देते हैं
  rationale: tuae misericordiae को साधन-सूचक मानना निकटवर्ती समानांतर पदों और disponere के सक्रिय अर्थ से मेल खाता है, पर समर्पित या अधीन करने वाला पाठ भी व्याकरणतः सम्भव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’ और सरल किंतु गरिमापूर्ण धार्मिक शब्दावली का प्रयोग किया गया है। मूल की खंडात्मक आरंभिक बनावट और अंतिम अल्पविराम को बनाए रखा गया है, क्योंकि पद निकटवर्ती वाक्य-प्रवाह का अंश है।
