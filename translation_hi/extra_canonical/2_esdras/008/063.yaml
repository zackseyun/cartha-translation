  yaml_path: translation/extra_canonical/2_esdras/008/063.yaml
  text: you have shown me a multitude of signs that you will begin to do in the last times[a], but you have not shown me at what time.”
translation:
  language: hi
  text: तूने मुझे बहुत-से चिन्ह दिखाए हैं, जिन्हें तू अन्तिम समयों में करना आरम्भ करेगा; परन्तु तूने मुझे यह नहीं दिखाया कि यह किस समय होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudinem signorum
  choice: बहुत-से चिन्ह
  rationale: लैटिन पदबंध का स्वाभाविक और सामान्य आधुनिक हिन्दी रूप; लैटिन में उपपद न होने के कारण इसे अनिश्चित अर्थ में लिया गया है।
- source_word: incipies facere
  choice: करना आरम्भ करेगा
  rationale: यह लैटिन के स्पष्ट आरम्भवाचक भविष्य-भाव को सुरक्षित रखता है, यद्यपि अनुवाद-लैटिन में यह कभी-कभी केवल भविष्य का भाव भी दे सकता है।
- source_word: in nouissimis
  choice: अन्तिम समयों में
  rationale: बहुवचन और युगान्त-संबंधी अर्थ दोनों को बनाए रखने वाला सीधा रूप।
- source_word: quo tempore
  choice: किस समय
  rationale: समय के निश्चित बिन्दु के विषय में प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चिन्हों का आरम्भ बनाम केवल भविष्य में किया जाना
  choice: करना आरम्भ करेगा
  alternative: करेगा
  rationale: मूल लैटिन incipies को अनूदित किया गया है और उसकी सम्भावित आरम्भवाचकता को बिना मिटाए रखा गया है।
- issue: nouissimis का युगान्त-संबंधी अर्थ
  choice: अन्तिम समयों में
  alternative: अन्त के दिनों में
  rationale: यह पाठ की युगान्त-संबंधी तनावपूर्ण भाषा को बनाए रखता है, पर किसी विशिष्ट सम्प्रदायगत समय-सारिणी को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर से प्रत्यक्ष संबोधन के लिए ‘तू’ रखा गया है, जो बाइबिलीय हिन्दी में निकट और एकवचन संबोधन को स्पष्ट करता है। अन्तिम उपवाक्य में हिन्दी की स्वाभाविकता के लिए ‘वे ... होंगे’ कहा गया है; आशय चिन्हों के घटित होने के समय से है।
