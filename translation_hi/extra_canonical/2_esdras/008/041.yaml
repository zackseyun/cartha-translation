source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'plantat, sed non in tempore omnia quae seminata sunt saluabuntur, sed nec omnia quae plantata sunt radicabunt, sic et qui in saeculo seminati sunt non omnes saluabuntur. Et respondi et dixi : si inueni gratiam coram te loquar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/041.yaml
  text: plants[a], but not everything that has been sown will be saved in its time, nor will everything that has been planted take root; so also those who have been sown in the world will not all be saved.” And I answered and said, “If I have found favor before you, let me speak.”
translation:
  language: hi
  text: लगाता है, पर बोई हुई हर चीज़ अपने समय में नहीं बचेगी, और लगाई हुई हर चीज़ जड़ नहीं पकड़ेगी। इसी प्रकार, जो संसार[a] में बोए गए हैं, वे सभी नहीं बचेंगे।” तब मैंने उत्तर में कहा, “यदि मैंने तेरी दृष्टि में अनुग्रह पाया है, तो मुझे बोलने दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युग में।” लैटिन शब्द का अर्थ “संसार” अथवा “युग” दोनों हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: plantat
  choice: लगाता है
  rationale: यह पद पिछले वाक्य की निरंतरता है; इसलिए स्रोत की तरह खंडित आरंभ बनाए रखा गया है और पिछले पद की सामग्री यहाँ दोहराई नहीं गई।
- source_word: saluabuntur
  choice: बचेगा / बचेंगे
  rationale: लैटिन में बीजों और संसार में बोए गए लोगों—दोनों के लिए यही क्रिया दोहराई गई है। हिन्दी में भी समान क्रिया रखकर कृषि-रूपक और उद्धार-संबंधी अर्थ की कड़ी सुरक्षित रखी गई है।
- source_word: in tempore
  choice: अपने समय में
  rationale: यह निकट और स्वाभाविक रूप से कृषि-संदर्भ के नियत समय को व्यक्त करता है, बिना 'उचित समय' जैसा अतिरिक्त मूल्यांकन जोड़े।
- source_word: radicabunt
  choice: जड़ पकड़ेगा
  rationale: रोपे हुए पौधे के स्थापित होकर बढ़ने के लिए यह सामान्य और स्पष्ट हिन्दी मुहावरा है।
- source_word: coram te
  choice: तेरे सामने
  rationale: लैटिन के स्थानात्मक/संबंधात्मक भाव को सीधे रखता है और विनम्र निवेदन के संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: saluabuntur का कृषि और मानव—दोनों संदर्भों में अर्थ
  choice: दोनों स्थानों पर 'बचना'
  alternative: पहले स्थान पर 'सुरक्षित रहना' और दूसरे पर 'उद्धार पाना'
  rationale: एक ही लैटिन क्रिया की जानबूझकर की गई पुनरावृत्ति को अलग-अलग धार्मिक शब्दों से खोलना रूपक की तनावपूर्ण समानता को कम कर देता। 'बचना' दोनों संदर्भों में संभव है और अर्थ को समय से पहले सीमित नहीं करता।
- issue: in saeculo का अर्थ
  choice: मुख्य पाठ में 'संसार'
  alternative: '''युग'''
  rationale: इस संदर्भ में मानव अस्तित्व के क्षेत्र के रूप में 'संसार' सहज है, पर लैटिन saeculum में कालगत 'युग' का अर्थ भी संभव है; इसलिए विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। पद का आरंभ जानबूझकर पिछले पद से जुड़े वाक्यांश की तरह रखा गया है। ईश्वर को संबोधन में एकवचन आदरसूचक बाइबिलीय शैली ('तेरे') अपनाई गई है।
