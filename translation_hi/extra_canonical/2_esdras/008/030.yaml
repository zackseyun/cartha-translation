lexical_decisions:
- source_word: Neque indigneris
  choice: और ... क्रोधित न हो
  rationale: लैटिन निषेधात्मक क्रिया का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; “और” पिछले प्रसंग से इसके संबंध को बनाए रखता है।
- source_word: eis qui
  choice: उन लोगों पर ... जो
  rationale: लैटिन संबंधवाचक रचना को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: bestiis peius sunt
  choice: पशुओं से भी बदतर हैं
  rationale: तुलनात्मक अर्थ को सीधे बनाए रखता है; “भी” लैटिन की तीव्र तुलना को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: क्या ‘judged/considered’ का भाव जोड़ा जाए
  choice: निर्णय या माने जाने का कोई भाव नहीं जोड़ा गया
  alternative: जो पशुओं से भी बदतर माने गए हैं
  rationale: प्रदान किए गए साफ़ किए हुए लैटिन पाठ में “iudicati” नहीं है; इसलिए ऐसा भाव जोड़ना स्रोत से परे होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, dignified प्रार्थनात्मक संबोधन। आरंभिक “splendide docuerunt” को इस पद में नहीं लिया गया, क्योंकि वह विराम से समाप्त पिछली वाक्य-इकाई का अवशेष प्रतीत होता है और लेखापरीक्षित पद-पाठ भी वर्तमान वाक्य से आरंभ होता है।
