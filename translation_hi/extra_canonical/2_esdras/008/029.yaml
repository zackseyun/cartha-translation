source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: neque volueris perdere qui pecorum mores habuerunt, sed respicias eos qui legem tuam splendide docuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/029.yaml
  text: Do not desire to destroy those who have had the ways of cattle[a], but look upon those who have taught your law splendidly.
translation:
  language: hi
  text: और तू उन लोगों का नाश करने की इच्छा न कर, जिनका चालचलन पशुओं-जैसा रहा है; बल्कि उन पर दृष्टि कर, जिन्होंने तेरी व्यवस्था को उत्कृष्ट रीति से सिखाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: neque volueris perdere
  choice: और तू ... नाश न करना चाह
  rationale: यह निषेध volueris में निहित इच्छा/चाह को बनाए रखता है और perdere को स्पष्ट रूप से ‘नाश करना’ व्यक्त करता है।
- source_word: pecorum mores habuerunt
  choice: जिनमें पशुओं-जैसा आचरण रहा है
  rationale: mores यहाँ शिष्टाचार नहीं, बल्कि चाल-चलन या आचरण है; pecorum का रूपक बनाए रखते हुए हिन्दी में स्वाभाविक अर्थ दिया गया है।
- source_word: respicias eos
  choice: उन पर दृष्टि कर
  rationale: respicias में कृपापूर्वक ध्यान देने की प्रार्थना का भाव हो सकता है; ‘दृष्टि कर’ उस अर्थ को गरिमापूर्ण ढंग से खुला रखता है।
- source_word: legem tuam splendide docuerunt
  choice: जिन्होंने तेरी व्यवस्था की शिक्षा उत्कृष्ट रीति से दी है
  rationale: docuerunt को ‘शिक्षा दी’ और splendide को गुणवत्ता सूचक ‘उत्कृष्ट रीति से’ के रूप में रखा गया है, बिना इसे केवल वाक्पटुता या नैतिक कुलीनता तक सीमित किए।
theological_decisions:
- issue: पशुवत आचरण करने वालों और व्यवस्था के शिक्षकों के बीच विरोध
  choice: दोनों समूहों के बीच मूल विरोध को यथावत रखा गया है
  alternative: पहले समूह को सीधे ‘दुष्ट’ और दूसरे को ‘धर्मी’ कहना
  rationale: लैटिन पाठ स्वयं व्यवहार और शिक्षा का वर्णन करता है; अतिरिक्त नैतिक या सांप्रदायिक श्रेणियाँ जोड़ना उचित नहीं।
- issue: respicias का आशय
  choice: ‘दृष्टि कर’
  alternative: ‘कृपा कर’ या ‘बचा ले’
  rationale: संदर्भ में अनुग्रह का संकेत संभव है, पर मूल क्रिया सीधे कृपा या उद्धार नहीं कहती; इसलिए अर्थगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। ईश्वर को संबोधन के लिए ‘तू/तेरी’ का प्रयोग निकटता और एकवचन लैटिन संबोधन के अनुरूप है। ‘पशुओं-जैसा आचरण’ सामान्य पाठक के लिए स्पष्ट है और ‘पशुओं के ढंग’ जैसी कृत्रिम शब्दावली से बचता है।
