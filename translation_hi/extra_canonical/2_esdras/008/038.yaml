  yaml_path: translation/extra_canonical/2_esdras/008/038.yaml
  text: For truly I will not think upon the formation of those who have sinned[a], nor upon their death, nor their judgment, nor their destruction; but I will rejoice over the creation of the righteous,
translation:
  language: hi
  text: क्योंकि सचमुच, जिन्होंने पाप किया है उनकी रचना, उनकी मृत्यु, उनके न्याय या उनके विनाश के बारे में मैं नहीं सोचूँगा; बल्कि मैं धर्मियों की रचना पर आनंदित होऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plasma / figmentum
  choice: रचना
  rationale: दोनों लैटिन शब्द गढ़ी या सृजी हुई कृति का बोध कराते हैं। दोनों खंडों में ‘रचना’ रखने से मूल का अर्थ-साम्य और विरोध स्पष्ट रहता है।
- source_word: qui peccauerunt
  choice: जिन्होंने पाप किया है
  rationale: यह कर्तृवाचक संबंधवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: mortem ... iudicium ... perditionem
  choice: उनकी मृत्यु ... उनके न्याय ... उनके विनाश
  rationale: ये संज्ञाएँ समानांतर कर्म हैं और ‘eorum’ का संबंध स्वाभाविक रूप से इन सब पर लागू होता है; ‘उनकी/उनके’ इसे हिन्दी में स्पष्ट करता है।
- source_word: iocundabor super
  choice: पर आनन्दित होऊँगा
  rationale: यह उल्लास या प्रसन्नता व्यक्त करता है; ‘पर’ मूल के super को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: iustorum
  choice: धर्मियों की
  rationale: iusti के लिए प्रचलित, गरिमापूर्ण और धर्मवैचारिक रूप से तटस्थ हिन्दी पद।
theological_decisions:
- issue: मृत्यु, न्याय और विनाश का संबंध
  choice: इन्हें पाप करने वालों की मृत्यु, उनके न्याय और उनके विनाश के रूप में प्रस्तुत किया गया है।
  alternative: मृत्यु, न्याय और विनाश को सामान्य एवं निरपेक्ष अर्थ में लेना।
  rationale: लैटिन eorum पहले plasma के साथ स्पष्ट है और समानांतर accusative संज्ञाओं पर भी अर्थतः लागू होता है; सामान्य अर्थ लेने से कथन का दायरा अनावश्यक रूप से सार्वभौमिक हो जाता।
- issue: plasma और figmentum का संबंध
  choice: दोनों के लिए ‘रचना’
  alternative: पहले ‘बनावट’ और दूसरे ‘सृष्टि’ जैसे अलग शब्द
  rationale: समान पद चुनने से पापियों और धर्मियों के बीच मूल का जानबूझकर रखा गया समानांतर विरोध सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। मूल की समानांतर संरचना को यथासंभव रखा गया है; कोई पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
