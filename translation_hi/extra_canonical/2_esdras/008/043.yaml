  text: your rain in its time; and if it is ruined by the abundance of rain, it perishes. But man, who has been formed by your hands and is called your image
translation:
  language: hi
  text: तेरी वर्षा अपने समय पर; और यदि वर्षा की अधिकता से वह बिगड़ जाए, तो वह नष्ट हो जाता है। परन्तु मनुष्य, जिसे तेरे हाथों ने गढ़ा है और जो तेरी प्रतिमा कहलाता है[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त लैटिन अंश ‘और’ पर समाप्त होता है। ‘जो तेरी प्रतिमा कहलाता है’ उपलब्ध अंग्रेज़ी POB audit trail में दिया गया अगला उपवाक्य है; यह इस लैटिन अंश में प्रत्यक्षतः सुरक्षित नहीं है।
    reason: लैटिन साक्ष्य की खंडित सीमा और audit trail से लिए गए पूरक उपवाक्य, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: pluuiam tuam in tempore
  choice: तेरी वर्षा ठीक समय पर होती है
  rationale: खंडित लैटिन वाक्यांश को स्वाभाविक हिन्दी बनाने के लिए निहित क्रिया ‘होती है’ जोड़ी गई; ‘in tempore’ का अर्थ उचित/नियत समय है।
- source_word: corruptum fuerit multitudine pluuiae
  choice: यदि बहुत अधिक वर्षा से वह नष्ट हो जाए
  rationale: ‘multitudine pluuiae’ को सहज हिन्दी में ‘बहुत अधिक वर्षा’ और perfect passive subjunctive को शर्तसूचक ‘नष्ट हो जाए’ के रूप में व्यक्त किया।
- source_word: Hoc perit
  choice: तो उसका नाश हो जाता है
  rationale: लैटिन ‘hoc’ का संदर्भ दिए गए अंश में स्पष्ट नहीं है; हिन्दी में ‘उसका’ रखकर उसी संदर्भगत अस्पष्टता को बनाए रखा गया है।
- source_word: homo qui manibus tuis plasmatus est
  choice: मनुष्य, जिसे तेरे हाथों ने गढ़ा है
  rationale: ‘plasmatus’ हाथों से आकार देने/गढ़ने का बिंब रखता है; ‘गढ़ा’ आधुनिक, गरिमापूर्ण और सटीक है।
theological_decisions:
- issue: मनुष्य के परमेश्वर की प्रतिमा कहलाने वाला अंतिम उपवाक्य
  choice: जो तेरी प्रतिमा कहलाता है
  alternative: केवल ‘और—’ पर अंश समाप्त करना
  rationale: प्रदत्त लैटिन अंश केवल ‘et’ (‘और’) पर कट जाता है, जबकि परामर्श-पाठ उपवाक्य को पूरा करता है। पाठकीय उपयोगिता के लिए उपवाक्य रखा गया, पर उसकी स्रोतगत स्थिति पादटिप्पणी में स्पष्ट की गई।
- issue: परमेश्वर के लिए सम्बोधन
  choice: तेरी/तेरे
  alternative: आपकी/आपके
  rationale: बाइबिलीय प्रार्थना के सीधे और आत्मीय एकवचन सम्बोधन को बनाए रखता है; इसमें अनादर का आशय नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। आरम्भ और अन्त दोनों ओर वाक्य के खंडित होने का संकेत क्रमशः निहित क्रिया और अंतिम डैश से रखा गया है।
