  text: I have shown these things to all[a], but to you and to a few like you. And—
translation:
  language: hi
  text: मैंने ये बातें सबको दिखाई हैं, तुम्हें और तुम्हारे जैसे कुछ लोगों को छोड़कर।[a] और—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध लातीनी अंश का सीधा अर्थ है: “मैंने सबको दिखाया, तुम्हें और तुम्हारे जैसे कुछ लोगों को छोड़कर।” किंतु निकटवर्ती संदर्भ के आधार पर एक संभावित पठन यह है कि ‘सबको नहीं’ दिखाया गया था, बल्कि केवल तुम्हें और तुम्हारे जैसे कुछ लोगों को; इस अर्थ के लिए ‘सबको’ से पहले निषेधसूचक शब्द मानना पड़ता है।'
    reason: उपलब्ध स्रोत-अंश का प्रत्यक्ष अर्थ मुख्य पाठ में सुरक्षित रखते हुए संदर्भ से उत्पन्न वास्तविक पाठगत कठिनाई और संभावित वैकल्पिक पठन दर्ज करता है।
lexical_decisions:
- source_word: demonstraui
  choice: दिखाई हैं
  rationale: लातीनी क्रिया का सीधा और स्वाभाविक हिन्दी रूप; इसका आशय बातों को प्रकट या ज्ञात कराने से है।
- source_word: tibi similibus paucis
  choice: तुम्हारे जैसे कुछ लोगों को
  rationale: मूल के ‘तुम्हारे समान थोड़े लोगों’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: et re-
  choice: और—
  rationale: स्रोत का अंतिम शब्द अधूरा है; डैश टूटे हुए पाठ और आगे जारी रहने वाले वाक्य को सुरक्षित रखता है।
theological_decisions:
- issue: क्या प्रकाशन सबको दिया गया था या केवल एज्रा और उसके जैसे कुछ लोगों को
  choice: सबको नहीं, बल्कि केवल तुम्हें और तुम्हारे जैसे कुछ लोगों को
  alternative: मैंने सबको दिखाया, सिवाय तुम्हारे और तुम्हारे जैसे कुछ लोगों के
  rationale: उपलब्ध लातीनी अंश में निषेध का शब्द नहीं है, पर ‘nisi tibi’ और निकटवर्ती पाठ-परंपरा सीमित प्रकाशन का अर्थ देती है। शाब्दिक वैकल्पिक पठन को पादटिप्पणी में रखा गया है, ताकि पाठ की वास्तविक कठिनाई छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘केवल’ सीमित प्राप्तकर्ताओं के संदर्भगत अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी उपलब्ध लातीनी शब्दावली का कठिन शाब्दिक पठन भी सुरक्षित रखती है।
