source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid est enim homo, ut ei indigneris, aut genus corruptibile, ut ita amariceris de ipso.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/034.yaml
  text: For what is man, that you should be angry with him, or a corruptible race, that you should be so embittered against it?
translation:
  language: hi
  text: क्योंकि मनुष्य क्या है कि तू उस पर क्रोधित हो, या नाशवान मानवजाति क्या है कि तू उसके प्रति इतना कटु हो जाए?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homo
  choice: मनुष्य
  rationale: यह सामान्य रूप से मानव व्यक्ति को दर्शाता है और प्रश्न की गरिमापूर्ण शैली बनाए रखता है।
- source_word: genus corruptibile
  choice: नाशवान मानवजाति
  rationale: genus यहाँ मानव-वंश या मानवजाति है, जबकि corruptibile उसकी क्षय और मृत्यु के अधीन अवस्था को व्यक्त करता है; ‘नाशवान’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: indigneris
  choice: क्रोधित हो
  rationale: यह किसी पर रोष या अप्रसन्नता व्यक्त करने का सहज और संदर्भानुकूल हिन्दी रूप है।
- source_word: amariceris
  choice: कटु हो जाए
  rationale: लैटिन क्रिया के ‘कटु/कड़वा हो जाने’ के भाव को बनाए रखता है और उसे केवल सामान्य क्रोध में विलीन नहीं करता।
- source_word: de ipso
  choice: उसके कारण
  rationale: संदर्भ में मानवजाति को लेकर या उसके कारण कटु होने का भाव है; यह हिन्दी में स्वाभाविक और मूल की अर्थ-सीमा के भीतर है।
theological_decisions:
- issue: परमेश्वर के रोष और कटुता की मानव-सदृश भाषा
  choice: मूल के सीधे प्रश्नात्मक और मानव-सदृश कथन को बनाए रखा गया।
  alternative: इसे ‘तू उससे इतना अप्रसन्न क्यों हो’ जैसे नरम या व्याख्यात्मक रूप में देना।
  rationale: मूल पाठ की धार्मिक तनावपूर्ण भाषा को नरम करना या व्यवस्थित धर्मशास्त्रीय व्याख्या से बदलना उचित नहीं है।
- issue: genus corruptibile का आशय
  choice: ‘नाशवान मानवजाति’
  alternative: ‘भ्रष्ट जाति’
  rationale: corruptibile यहाँ नष्ट/क्षय होने योग्य अवस्था पर बल देता है; ‘भ्रष्ट’ नैतिक पतन का अनावश्यक रूप से निर्णायक अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक संबोधन के लिए ‘तू’ रखा गया है। समानांतर प्रश्न-रचना को सुरक्षित रखते हुए वाक्य को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
