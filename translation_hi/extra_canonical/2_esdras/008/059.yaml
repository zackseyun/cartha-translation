reference: 2 Esdras 8:59
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enim uos susipient quae praedicta sunt, sic eos sitis et cruciatus quae parata sunt. non enim altissimus uoluit hominem disperdi ; Sed ipsi qui creati sunt coinquinauerunt nomen eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/059.yaml
  text: For what has been foretold will receive you[a], but thirst and torments, which have been prepared, will receive them. For the Most High did not will that man should be destroyed; but they themselves, who were created, defiled his name.
translation:
  language: hi
  text: क्योंकि जिन बातों की भविष्यवाणी की गई है, वे तुम्हें ग्रहण करेंगी; परन्तु[a] प्यास और वे यातनाएँ जो तैयार की गई हैं, उन्हें ग्रहण करेंगी। क्योंकि परमप्रधान ने नहीं चाहा कि मनुष्य नष्ट हो; बल्कि जो सृजे गए थे, उन्होंने स्वयं उसके नाम को अपवित्र कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में यहाँ प्रयुक्त शब्द का शाब्दिक अर्थ ‘इस प्रकार’ या ‘वैसे ही’ भी हो सकता है; प्रसंग के विरोध को देखते हुए मुख्य पाठ में ‘परन्तु’ दिया गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: susipient
  choice: ग्रहण करेंगी
  rationale: लैटिन क्रिया के ‘स्वीकार करना/अपने में लेना’ रूपक को बनाए रखता है और उसे ‘स्वागत’ जैसे अनावश्यक सकारात्मक अर्थ से नहीं भरता।
- source_word: quae praedicta sunt
  choice: जिन बातों की भविष्यवाणी की गई है
  rationale: लैटिन के बहुवचन नपुंसकलिंग पदबंध को स्वाभाविक हिन्दी में ‘बातों’ के रूप में व्यक्त किया गया है।
- source_word: sitis et cruciatus
  choice: प्यास और ... यातनाएँ
  rationale: sitis का सीधा अर्थ ‘प्यास’ और cruciatus के बहुवचन का अर्थ ‘यातनाएँ’ रखा गया है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त लैटिन उपाधि का प्रचलित, गरिमापूर्ण और अर्थ-संगत हिन्दी रूप।
- source_word: coinquinauerunt nomen eius
  choice: उसके नाम को अपवित्र कर दिया
  rationale: coinquinare में निहित दूषित या अपवित्र करने का भाव धार्मिक संदर्भ में स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: क्या परमप्रधान मनुष्य का विनाश चाहता था
  choice: परमप्रधान ने नहीं चाहा कि मनुष्य नष्ट हो
  alternative: परमप्रधान नहीं चाहता कि मनुष्य नष्ट हो
  rationale: uoluit भूतकाल में है; इसलिए कथन को वर्तमानकालीन सार्वभौमिक सिद्धान्त में बदलने के बजाय स्रोत का काल सुरक्षित रखा गया है।
- issue: दोष का उत्तरदायित्व
  choice: जो सृजे गए थे, उन्होंने स्वयं
  alternative: उसकी सृष्टि ने
  rationale: ipsi का जोर बनाए रखते हुए सृजे गए प्राणियों की अपनी जिम्मेदारी स्पष्ट की गई है, पर यह नहीं जोड़ा गया कि वे किस विशेष समूह के लोग थे।
- issue: hominem का आशय
  choice: मनुष्य
  alternative: मनुष्यों
  rationale: लैटिन एकवचन hominem को सामूहिक/जातिवाचक अर्थ सहित एकवचन में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘ग्रहण करेंगी’ का कुछ असामान्य रूपक जानबूझकर सुरक्षित है, क्योंकि मूल पाठ भविष्यवाणी की गई बातों तथा तैयार यातनाओं को व्यक्तिवत् प्रस्तुत करता है।
