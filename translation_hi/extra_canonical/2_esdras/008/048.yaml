translation:
  language: hi
  text: परन्तु इस बात में भी तुम परमप्रधान के सामने अद्भुत ठहरोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sed et in hoc
  choice: परन्तु इस बात में भी
  rationale: यह वाक्यांश विरोधसूचक sed, समावेशी et और प्रसंगसूचक in hoc—तीनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: mirabilis eris
  choice: अद्भुत ठहरोगे
  rationale: mirabilis का मूल भाव विस्मयकारी या विलक्षण होने का है; ‘प्रशंसनीय’ आधुनिक हिन्दी में केवल सराहना योग्य होने का कमजोर अर्थ दे सकता है। ‘ठहरोगे’ coram Altissimo के साथ परमप्रधान की दृष्टि या उपस्थिति में ऐसा माने जाने की छाया को सहज रूप से व्यक्त करता है।
- source_word: coram Altissimo
  choice: परमप्रधान के सामने
  rationale: coram का स्थानिक और मूल्यांकनात्मक खुलापन ‘के सामने’ में सुरक्षित रहता है, और Altissimus के लिए प्रतिष्ठित उपाधि ‘परमप्रधान’ प्रयुक्त हुई है।
theological_decisions:
- issue: परमप्रधान के सामने एज्रा के mirabilis होने का स्वरूप
  choice: अद्भुत ठहरोगे
  alternative: प्रशंसनीय ठहरोगे
  rationale: पाठ यह स्पष्ट नहीं करता कि यह केवल नैतिक प्रशंसा है या विस्मयकारी विशिष्टता; ‘अद्भुत’ मूल शब्द की व्यापक और प्रबल अर्थ-छाया को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। संक्षिप्त मूल वाक्य की विरोधात्मक संरचना और भविष्यकाल बनाए रखे गए हैं।
