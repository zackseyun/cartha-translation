    text: या, “मैं तुम्हें एक उपमा बताऊँगा।”
    reason: dicam coram te का अधिक मुहावरेदार वैकल्पिक अनुवाद।
  - marker: b
    text: शाब्दिक रूप से, “वह बहुत अधिक धरती देती है, जिससे मिट्टी का बरतन बनाया जाता है, पर थोड़ी धूल, जिससे सोना बनता है।”
    reason: मूल में terra/terram की पुनरावृत्ति और वाक्य-विन्यास को दर्शाने के लिए।
