- source_word: fictile
  choice: मिट्टी के बरतन
  rationale: लैटिन शब्द पकी या गढ़ी हुई मिट्टी की वस्तुओं/बरतनों को सूचित करता है; सामान्य पाठक के लिए ‘मिट्टी के बरतन’ स्पष्ट है।
- source_word: puluerem unde aurum fit
  choice: ऐसी धूल ... जिससे सोना बनता है
  rationale: puluerem को ‘धूल’ के रूप में औपचारिक रूप से रखा गया है और unde aurum fit की निष्क्रिय/उत्पत्तिसूचक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के व्यक्त किया गया है।
