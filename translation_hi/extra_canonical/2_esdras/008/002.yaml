  text: But I will set forth a comparison before you[a], Ezra. Just as, if you ask the earth, it will tell you that it yields much clay, from which earthen vessels are made, but little dust from which gold comes[b],
translation:
  language: hi
  text: परन्तु, एज्रा, मैं तुम्हारे सामने एक उपमा प्रस्तुत करूँगा[a]। जैसे, यदि तुम धरती से पूछो, तो वह तुम्हें बताएगी कि वह बहुत अधिक मिट्टी देती है, जिससे मिट्टी के बरतन बनाए जाते हैं, पर बहुत थोड़ी धूल देती है, जिससे सोना बनता है[b],
  philosophy: optimal-equivalence
  footnotes:
