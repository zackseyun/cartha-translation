  text: whose service turns to wind and fire[a], whose word is sure and whose sayings endure, whose ordering is strong and whose command is fearful[b],
translation:
  language: hi
  text: जिनकी सेवा वायु और आग का रूप ले लेती है[a], जिसका वचन अटल है और जिसके कथन स्थायी हैं, जिसकी व्यवस्था दृढ़ है और जिसकी आज्ञा भय उत्पन्न करती है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ लैटिन में seruatio (‘संरक्षण’) है, पर स्वर्गदूतों के इस संदर्भ में इसका अर्थ सामान्यतः ‘सेवा’ या ‘सेवाकार्य’ माना जाता है। अनुवाद प्रसंगगत अर्थ को अपनाता है, पर लैटिन की कठिनाई को छिपाता नहीं है।
    reason: textual_variant
  - marker: b
    text: अथवा, ‘जिनकी सेवा वायु और आग में है।’
    reason: previous_rendering
lexical_decisions:
- source_word: seruatio / conuertitur
  choice: सेवा … में बदल जाती है
  rationale: स्वर्गदूतों के संदर्भ में लैटिन seruatio का शाब्दिक अर्थ ‘संरक्षण’ है, पर यहाँ प्रसंगगत अर्थ ‘सेवा’ या ‘सेवाकार्य’ है। conuertitur के परिवर्तन-बोध को ‘में बदल जाती है’ से स्पष्ट रखा गया है।
- source_word: firmum
  choice: अटल
  rationale: वचन की विश्वसनीयता और स्थिरता को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: dicta perseuerantia
  choice: कथन सदा बने रहते हैं
  rationale: perseuerantia के टिके रहने या स्थायी बने रहने के अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के व्यक्त करता है।
- source_word: dispositio fortis
  choice: व्यवस्था दृढ़
  rationale: dispositio के आयोजन/व्यवस्था और fortis के सामर्थ्य तथा दृढ़ता के भाव को संक्षिप्त रूप में रखता है।
- source_word: iussio
  choice: आज्ञा
  rationale: ईश्वरीय आदेश के लिए सीधा और सामान्य हिन्दी शब्द।
theological_decisions:
- issue: पहले संबंधवाचक पद का स्वर्गदूतों और बाद के पदों का परमेश्वर की ओर संकेत
  choice: ‘जिनकी’ के बाद ‘जिसका/जिसके/जिसकी’
  alternative: सभी खंडों में एक ही वचन का संबंधवाचक रूप
  rationale: लैटिन में पहले बहुवचन Quorum और फिर एकवचन Cuius के बदलाव को हिन्दी में सुरक्षित रखा गया है।
- issue: स्वर्गदूतीय सेवा का वायु और आग से संबंध
  choice: ‘वायु और आग में बदल जाती है’
  alternative: ‘वायु और आग में है’
  rationale: conuertitur के परिवर्तन-सूचक अर्थ को बनाए रखता है और सेवा के केवल स्थान या माध्यम का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण शैली अपनाई गई है। वाक्य को अगले पद से जुड़ने वाली स्तुतिपरक प्रार्थना की निरंतरता दिखाने के लिए अल्पविराम पर समाप्त किया गया है।
