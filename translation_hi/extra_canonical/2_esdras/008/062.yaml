- source_word: spondi et dixi
  choice: मैंने उत्तर देकर कहा
  rationale: पाठ में आरम्भिक अंश संभवतः ‘respondi et dixi’ का कटा हुआ रूप है। हिन्दी में यह स्वाभाविक रहते हुए ‘उत्तर दिया और कहा’ की दोनों क्रियाओं का भाव रखता है।
- source_word: Ecce nunc
