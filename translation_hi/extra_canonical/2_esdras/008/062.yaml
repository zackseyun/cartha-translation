- source_word: domine
  choice: प्रभु
  rationale: सम्बोधन और धार्मिक प्रसंग, दोनों के अनुरूप प्रतिष्ठित हिन्दी रूप।
- source_word: demonstrasti mihi multi-
  choice: आपने मुझे बहुत-से
  rationale: लैटिन पद पदच्छेद पर अधूरा समाप्त होता है और अगले पद में पूरा होता है। ‘बहुत-से’ उसी बहुवचन भाव और पद-सीमा की अपूर्णता को सुरक्षित रखता है, बिना अगले पद के संज्ञा-पद को पहले से जोड़ने के।
