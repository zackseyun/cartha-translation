source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter nos peccatores misericors uocatus es. Si enim desideraueris ut nostri miserearis tunc misericors uocaberis, nobis enim
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/032.yaml
  text: For if you desire to have mercy on us, then you will be called merciful, for we are sinners.
translation:
  language: hi
  text: क्योंकि यदि तू हम पर दया करना चाहे, तो तू दयालु कहलाएगा, क्योंकि हम पापी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericors
  choice: दयालु
  rationale: यह ‘दया दिखानेवाला/करुणामय’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; पद में इसी शब्द की अवधारणा दया करने की क्रिया से जुड़ी है।
- source_word: ut nostri miserearis
  choice: हम पर दया करना
  rationale: लातीनी अभिव्यक्ति का सीधा और आधुनिक हिन्दी में सहज अर्थ है।
- source_word: peccatores
  choice: पापी
  rationale: यह स्रोत में मनुष्यों की नैतिक-धार्मिक स्थिति बतानेवाले शब्द का स्पष्ट और प्रचलित समतुल्य है।
- source_word: uocaberis
  choice: कहलाएगा
  rationale: भविष्यकालीन कर्मवाच्य अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के दयालु कहलाने और पापियों पर दया करने का संबंध
  choice: ‘यदि…तो’ की शर्तात्मक संरचना को ज्यों का त्यों रखा गया है।
  alternative: वाक्य को ऐसा बनाना कि परमेश्वर की दयालुता केवल मनुष्यों की धारणा या उपाधि तक सीमित लगे।
  rationale: स्रोत की शर्तात्मक और संभावित रूप से तनावपूर्ण भाषा को किसी व्यवस्थित धर्मवैज्ञानिक निष्कर्ष से नरम या स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; एज्रा की परमेश्वर से सीधी प्रार्थना के अनुरूप आदरसूचक दूरी के बजाय मूल एकवचन संबोधन को ‘तू’ से व्यक्त किया गया है। वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखा गया है।
