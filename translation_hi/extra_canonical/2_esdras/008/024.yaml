reference: 2 Esdras 8:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: serui tui et auribus percipe precationem figmenti tui, intende uerba mea. Dum enim uiuo loquar et dum sapio respondeam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/024.yaml
  text: Hear[a], Lord, the prayer of your servant, and give ear to the petition of your creature; pay attention to my words. For while I live I will speak, and while I have understanding I will answer.
translation:
  language: hi
  text: हे प्रभु, अपने सेवक की प्रार्थना सुन, और तेरे बनाए हुए प्राणी की विनती पर कान दे; मेरी बातों पर ध्यान दे। क्योंकि जब तक मैं जीवित हूँ, मैं बोलूँगा, और जब तक मुझमें समझ है, मैं उत्तर दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: serui tui
  choice: अपने सेवक की
  rationale: लैटिन संबंधकारक का सीधा और स्वाभाविक हिन्दी रूप; प्रार्थी की प्रभु के प्रति अधीनता बनी रहती है।
- source_word: auribus percipe
  choice: कान लगा
  rationale: शाब्दिक अर्थ ‘कानों से ग्रहण कर’ है; हिन्दी में ‘कान लगा’ प्रार्थनात्मक आग्रह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: figmenti tui
  choice: अपनी रची हुई कृति की
  rationale: figmentum किसी गढ़ी या रची हुई वस्तु/प्राणी को दर्शाता है। ‘कृति’ सृष्टिकर्ता के हाथों रचे होने की विनम्र छवि बचाता है, जबकि केवल ‘प्राणी’ उस गठन-संबंधी बिंब को कमजोर कर देता।
- source_word: intende
  choice: ध्यान दे
  rationale: वचनों की ओर मन लगाने या ध्यान करने का सामान्य आधुनिक हिन्दी रूप।
- source_word: Dum enim uiuo
  choice: क्योंकि जब तक मैं जीवित हूँ
  rationale: dum को यहाँ जारी अवधि की सीमा के अर्थ में लिया गया है; enim पूर्व कथन का कारण प्रस्तुत करता है।
- source_word: dum sapio
  choice: जब तक मुझमें समझ है
  rationale: sapio का अर्थ यहाँ समझ-बूझ रखने या सचेत विवेक में होने से है; यह ‘जब तक मैं बुद्धिमान हूँ’ की अपेक्षा अधिक स्वाभाविक और कम आत्मप्रशंसात्मक है।
- source_word: respondeam
  choice: मैं उत्तर दूँगा
  rationale: लैटिन का मूल ‘उत्तर देना’ अर्थ सुरक्षित रखा गया है; इसे ‘विचार करूँगा’ जैसे व्याख्यात्मक अर्थ में नहीं बदला गया।
theological_decisions:
- issue: figmentum में सृष्ट प्राणी और गढ़ी हुई रचना का बिंब
  choice: अपनी रची हुई कृति
  alternative: अपने प्राणी
  rationale: चयन मनुष्य की सृष्ट और गढ़ी हुई दशा को उभारता है तथा मूल की विनम्र धार्मिक मुद्रा को बनाए रखता है, बिना मिट्टी से रचे जाने का ऐसा विवरण जोड़ने के जो इस पद में प्रत्यक्ष नहीं है।
- issue: sapio की संभावित अर्थ-सीमा
  choice: मुझमें समझ है
  alternative: मैं समझता हूँ
  rationale: यह व्यक्ति की समझ-बूझ की अवस्था को व्यक्त करता है और ‘जीवित हूँ’ के समानांतर अवधि-सूचक संरचना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर को निकट, एकवचन संबोधन के अनुरूप ‘सुन’, ‘कान लगा’ और ‘ध्यान दे’ प्रयुक्त हैं। वाक्य-विन्यास मूल के समानांतर खंडों को बनाए रखते हुए सामान्य पाठक के लिए स्वाभाविक रखा गया है।
