  text: भ्रष्टता विस्मृति में। दुःख बीत गए हैं, और प्रकट किया गया है
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corruptio
  choice: भ्रष्टता
  rationale: लातीनी संज्ञा का व्यापक अर्थ ‘क्षय/भ्रष्टता’ है; ‘भ्रष्टता’ नैतिक और नश्वरताजन्य दोनों संभावित अर्थों को खुला रखती है।
- source_word: in obliuionem
  choice: भुला दी गई है
  rationale: शाब्दिक रूप ‘विस्मृति में’ है, पर यह खंड पूर्ववर्ती कथन से जुड़ा हुआ है; स्वाभाविक हिन्दी में परिणाम का भाव व्यक्त किया गया है।
- source_word: Transierunt dolores
  choice: दुःख बीत गए हैं
  rationale: यह dolores और पूर्ण क्रिया transierunt का सीधा तथा स्वाभाविक अनुवाद है।
- source_word: ostensus est
  choice: प्रकट किया गया है
  rationale: पुल्लिंग एकवचन कर्मवाच्य रूप का कर्ता अगले पाठांश में आने की संभावना है; अतः अपूर्ण वाक्य-संबंध को बिना अनुमान लगाए सुरक्षित रखा गया है।
theological_decisions:
- issue: corruptio का आशय
  choice: भ्रष्टता
  alternative: नश्वरता / क्षय
  rationale: स्रोत इस शब्द को केवल शारीरिक क्षय या केवल नैतिक बुराई तक सीमित नहीं करता; चुना हुआ शब्द इस तनाव को बनाए रखता है।
- issue: ostensus est के निहित कर्ता की पहचान
  choice: कर्ताविहीन कर्मवाच्य वाक्यांश रखा गया
  alternative: अगले पाठांश से संभावित संज्ञा जोड़ना
  rationale: दिए गए स्रोत का अंत ostensus est पर होता है; अनुपस्थित शब्द की पूर्ति करना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्रोत स्वयं पद के आरम्भ और अंत दोनों पर वाक्यांशगत रूप से अधूरा है; अनुवाद ने इस संरचना को अनावश्यक व्याख्या से नहीं भरा। अंग्रेज़ी फुटनोट में दिया पूर्व पाठ इस लातीनी पद के बजाय पिछले पद से संबंधित है, इसलिए उसे शामिल नहीं किया गया।
