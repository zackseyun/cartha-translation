  text: let it not be upon us[a], but spare your people and have mercy on your inheritance, for you have mercy on your own creation.”
translation:
  language: hi
  text: यह हम पर न आए[a]; बल्कि अपनी प्रजा को बख्श और अपनी विरासत पर दया कर, क्योंकि तू अपनी ही सृष्टि पर दया करता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह वाक्य पिछले पद में आरम्भ हुए नकार को पूरा करता है: “हे प्रभु, ऐसा हम पर न हो।”'
    reason: लातीनी पाठ में पद-विभाजन के आर-पार चलने वाली वाक्य-संरचना स्पष्ट करने के लिए।
lexical_decisions:
- source_word: super nos
  choice: यह हम पर न आए
  rationale: 'यह पद पिछले पद के नकार ‘Non’ का आशय पूरा करता है: विनती है कि वह विपत्ति/दण्ड ‘हम पर’ न आए। हिन्दी में निहित विषय को ‘यह’ से स्वाभाविक रूप दिया गया है।'
- source_word: parce populo tuo
  choice: अपनी प्रजा को छोड़ दे
  rationale: parcere का अर्थ यहाँ दण्ड न देना अथवा बख्श देना है; ‘छोड़ दे’ प्रार्थनात्मक और सहज हिन्दी है।
- source_word: miserere haereditati tuae
  choice: अपनी विरासत पर दया कर
  rationale: haereditas के धार्मिक रूपक ‘विरासत’ को बनाए रखा गया है, जहाँ इसका संकेत परमेश्वर के अपने लोगों से है।
- source_word: tuae enim creaturae misereris
  choice: क्योंकि तू अपनी ही सृष्टि पर दया करता है
  rationale: enim का कारणसूचक बल ‘क्योंकि’ से और tuae का बल ‘अपनी ही’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘super nos’ का पिछले पद के नकार से संबंध
  choice: इसे ‘यह हम पर न आए’ के रूप में इसी पद के आरम्भ में रखा गया
  alternative: इसे पिछले पद में ‘हम पर प्रभु’ जैसा संबोधन मानना अथवा छोड़ देना
  rationale: लातीनी वाक्यक्रम में super nos पिछले पद के Non से पूरी होने वाली निषेधात्मक विनती है; इसे ईश्वरीय उपाधि मानना व्याकरण और प्रसंग के विरुद्ध होगा।
- issue: ‘haereditas’ का रूपक
  choice: विरासत
  alternative: निज लोग
  rationale: ‘विरासत’ मूल धार्मिक रूपक और उसकी अर्थगत गहराई को सुरक्षित रखती है, बिना उसे व्याख्यात्मक रूप से केवल ‘लोगों’ तक सीमित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। ईश्वर के लिए एकवचन निकट संबोधन ‘तू’ रखा गया है; आज्ञार्थक क्रियाएँ विनती के भाव में हैं।
