revisions:
- from: हे भययोग्य प्रभु, जिनके दर्शन से अथाह गहराइयाँ सूख जाती हैं, जिनके क्रोध से पहाड़ पिघल जाते हैं, और जिनका सत्य साक्षी देता है—हे प्रभु, प्रार्थना सुनिए।
  to: भययोग्य हैं आप, जिनकी उपस्थिति से अथाह गहराइयाँ सूख जाती हैं, जिनके क्रोध से पहाड़ पिघल जाते हैं, और जिनका सत्य गवाही देता है—हे प्रभु, प्रार्थना सुनिए।
  rationale: The revision removes the unsupported opening title, renders aspectus more directly as divine presence/appearance, and improves the idiom for testificatur. It retains the source’s unusual ambiguity concerning what the truth testifies to, as well as the final explicit address “हे प्रभु.”
