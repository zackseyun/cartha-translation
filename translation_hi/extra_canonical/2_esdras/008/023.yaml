base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/023.yaml
  text: 'terrible, whose appearance dries up the depths, and whose indignation makes the mountains melt, and whose truth bears witness: Hear, O Lord, the prayer'
translation:
  language: hi
  text: भययोग्य हैं आप, जिनकी उपस्थिति से अथाह गहराइयाँ सूख जाती हैं, जिनके क्रोध से पहाड़ पिघल जाते हैं, और जिनका सत्य गवाही देता है—हे प्रभु, प्रार्थना सुनिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terribilis
  choice: हे भययोग्य प्रभु
  rationale: यह संबोधन परमेश्वर की विस्मयकारी और भय उत्पन्न करने वाली महिमा व्यक्त करता है; आधुनिक हिन्दी में केवल ‘भयानक’ अनचाहा नकारात्मक अर्थ दे सकता है। ‘प्रभु’ को संबोधन की स्वाभाविकता और अगले ‘domine’ से स्पष्ट संदर्भ के आधार पर जोड़ा गया है।
- source_word: aspectus
  choice: दर्शन
  rationale: यहाँ परमेश्वर की प्रत्यक्ष उपस्थिति या मुखमंडल के प्रभाव का भाव है; ‘दर्शन’ dignified और संक्षिप्त हिन्दी अभिव्यक्ति है।
- source_word: abyssos
  choice: अथाह गहराइयाँ
  rationale: बहुवचन और अगाध गहराई के अर्थ को सुरक्षित रखता है, बिना इसे किसी एक ब्रह्मांड-विज्ञान संबंधी अर्थ तक सीमित किए।
- source_word: indignatio
  choice: क्रोध
  rationale: दैवी रोष के लिए सामान्य, स्पष्ट और प्रसंगानुकूल आधुनिक हिन्दी शब्द।
- source_word: tabescere facit
  choice: पिघल जाते हैं
  rationale: कारक संरचना ‘पिघला देता है’ के अर्थ को हिन्दी में स्वाभाविक संबंधवाचक वाक्य के रूप में व्यक्त करती है।
- source_word: ueritas testificatur
  choice: सत्य साक्षी देता है
  rationale: लैटिन के असामान्य किंतु अर्थपूर्ण कथन को बिना उसका आशय स्पष्ट करके सीमित किए यथासंभव सीधे रखा गया है।
- source_word: Exaudi, domine, orationem
  choice: हे प्रभु, प्रार्थना सुनिए
  rationale: विनती के स्वर तथा सम्मानसूचक आधुनिक हिन्दी को बनाए रखता है; कर्म का अगली आयत में विस्तार संभव होने के कारण निश्चित सर्वनाम नहीं जोड़ा गया।
theological_decisions:
- issue: ‘जिसका सत्य साक्षी देता है’ में साक्ष्य का विषय या उद्देश्य अस्पष्ट है
  choice: जिनका सत्य साक्षी देता है
  alternative: जिनकी सत्यता इसकी गवाही देती है
  rationale: मूल पाठ ueritas को कर्ता बनाता है और यह नहीं बताता कि सत्य किसकी या किस बात की साक्षी देता है; अनुवाद उसी वास्तविक अस्पष्टता को बनाए रखता है।
- issue: terribilis का दैवी विशेषण
  choice: भययोग्य
  alternative: भयानक
  rationale: ‘भययोग्य’ श्रद्धामिश्रित भय और विस्मय को व्यक्त करता है तथा परमेश्वर को नैतिक रूप से भयावह बताने का अनावश्यक संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली अपनाई गई है। संबंधवाचक उपवाक्यों की समानांतर रचना मूल के काव्यात्मक क्रम को बनाए रखती है; कोई पादटिप्पणी आवश्यक नहीं है।
