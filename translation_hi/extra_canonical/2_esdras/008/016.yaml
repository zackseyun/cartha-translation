  text: which causes me pain[a], and concerning your inheritance, for which I mourn, and concerning Israel, for whom I am sorrowful, and concerning the seed of Jacob,
translation:
  language: hi
  text: जो मुझे पीड़ा देता है; और तेरी विरासत के विषय में, जिसके लिए मैं विलाप करता हूँ; और इस्राएल के विषय में, जिसके लिए मैं दुःखी हूँ; और याकूब के वंश के विषय में—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod mihi dolet
  choice: जो मुझे पीड़ा देता है
  rationale: यह संबंधवाचक उपवाक्य पिछले पद के विषय की ओर संकेत करता है; इसे इसी पद में रखते हुए लैटिन की पद-सीमा और अर्थ सुरक्षित रखा गया है।
- source_word: hereditate tua
  choice: तेरी विरासत
  rationale: hereditas का सीधा धार्मिक-साहित्यिक अर्थ ‘विरासत’ है और द्वितीय पुरुष एकवचन को ‘तेरी’ से व्यक्त किया गया है।
- source_word: lugeo
  choice: मैं विलाप करता हूँ
  rationale: lugeo केवल सामान्य दुःख नहीं, शोक अथवा विलाप करने का भाव रखता है।
- source_word: tristis sum
  choice: मैं दुःखी हूँ
  rationale: लैटिन के स्थितिवाचक पदबंध का सहज और औपचारिक हिन्दी रूप।
- source_word: semine Iacob
  choice: याकूब के वंश
  rationale: semen का यहाँ सामूहिक वंशजों के अर्थ में प्रयोग है; ‘वंश’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: ‘तेरी विरासत’ का संदर्भ
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया
  alternative: ‘तेरी प्रजा’ या ‘तेरा निज भाग’
  rationale: मूल hereditas की धार्मिक और संबंधपरक बहुअर्थकता को अनावश्यक रूप से सीमित नहीं किया गया।
- issue: आरंभिक संबंधवाचक उपवाक्य और अंतिम अपूर्ण संयोजन
  choice: पद-सीमाओं को सुरक्षित रखते हुए आरंभ में ‘जो’ और अंत में डैश रखा गया
  alternative: पिछले या अगले पद की सामग्री जोड़कर वाक्य पूरा करना
  rationale: quod पिछले पद की ओर और अंतिम et-खंड अगले पद की ओर वाक्यगत संबंध रखता है; स्रोत में दिए इसी पदांश को स्वतंत्र पूर्ण वाक्य बनाना अर्थ को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सहज शैली। ‘तू’ के पारंपरिक एकवचन संबोधन का संबंधसूचक रूप ‘तेरी’ रखा गया है। अर्धविराम समानांतर शोक-वाक्यांशों को स्पष्ट करते हैं, और अंतिम डैश अगले पद में जारी विचार का संकेत देता है।
