translation:
  language: hi
  text: धरती पर बहुत-से बीज बोता है और बहुत-से पौधे लगाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: serit
  choice: बोता है
  rationale: लैटिन क्रिया का सीधा और स्वाभाविक हिन्दी अर्थ; इसका कर्ता पिछले संदर्भ से आता है।
- source_word: super terram
  choice: धरती पर
  rationale: स्थान-सूचक वाक्यांश का सहज आधुनिक हिन्दी रूप।
- source_word: semina multa
  choice: बहुत-से बीज
  rationale: मात्रा और बहुवचन दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: plantationis multitudinem
  choice: बहुत-से पौधे लगाता है
  rationale: लैटिन संज्ञात्मक अभिव्यक्ति को स्वाभाविक हिन्दी क्रियात्मक समानांतर में प्रस्तुत करता है; खेती/रोपण की बहुलता सुरक्षित रहती है।
theological_decisions:
- issue: खंड का कर्ता स्रोत-पाठ में व्यक्त नहीं है
  choice: हिन्दी में भी कर्ता को पिछले संदर्भ पर निर्भर रहने दिया गया
  alternative: वह धरती पर बहुत-से बीज बोता है...
  rationale: अलग से ‘वह’ जोड़ने पर पूर्वसंदर्भ से मिलने वाले कर्ता को अनावश्यक रूप से स्पष्ट किया जाता; हिन्दी में कर्ता-रहित खंड यहाँ संभव और स्रोत-संगत है।
- issue: पिछले पाठ से आया वैकल्पिक वाक्य
  choice: पुरानी पादटिप्पणी को शामिल नहीं किया गया
  alternative: ‘इसलिए, जैसा मैंने कहा है, वैसा ही है।’ को पादटिप्पणी में रखना
  rationale: दिया गया लैटिन स्रोत स्पष्टतः बीज बोने और पौधे लगाने की बात करता है; पुराना विकल्प पिछले पद के गलत पद-विभाजन का अवशेष है, वास्तविक पाठांतर नहीं।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। स्रोत का वाक्यांश संभवतः निकटवर्ती पदों से जुड़ा हुआ है, इसलिए अनुवाद में स्वतंत्र कर्ता नहीं जोड़ा गया।
