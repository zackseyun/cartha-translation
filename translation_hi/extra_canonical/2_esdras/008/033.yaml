source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non habentibus opera iusticiae. Iusti enim quibus sunt operae multae repositae apud te, ex propriis operibus recipient mercedem. Quid est enim homo ut ei indigneris, aut genus corruptibile ut ita amariceris de ipso ? In ueritate enim nemo de genitis est qui non impie gessit et de confitentibus qui non
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/033.yaml
  text: For the righteous[a], who have many works laid up with you, will receive their reward from their own works.
translation:
  language: hi
  text: क्योंकि धर्मी लोग[a], जिनके बहुत से कर्म तेरे पास रखे हुए हैं, अपने ही कर्मों से प्रतिफल पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु धर्मी लोग, जिनके बहुत से कर्म तेरे पास रखे हुए हैं, अपने ही कर्मों से प्रतिफल पाएँगे।”
    reason: वाक्य के पिछले कथन से संबंध को कुछ अनुवाद विरोधात्मक मानते हैं, यद्यपि लैटिन ‘enim’ का कारणसूचक या व्याख्यात्मक अर्थ अधिक संभावित है।
lexical_decisions:
- source_word: Iusti
  choice: धर्मी लोग
  rationale: यह बहुवचन संज्ञात्मक विशेषण है और उन लोगों को दर्शाता है जिन्हें धर्मी माना गया है।
- source_word: enim
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; लैटिन तर्क-श्रृंखला को हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- source_word: operae multae repositae apud te
  choice: बहुत-से कर्म तेरे पास संचित हैं
  rationale: ‘repositae apud te’ में परमेश्वर के पास कर्मों के जमा या सुरक्षित होने की रूपकात्मक छवि को बनाए रखा गया है।
- source_word: ex propriis operibus recipient mercedem
  choice: अपने ही कर्मों के आधार पर प्रतिफल पाएँगे
  rationale: ‘ex’ को साधन या आधार के अर्थ में व्यक्त किया गया है और ‘mercedem’ के लिए गरिमापूर्ण तथा सहज ‘प्रतिफल’ चुना गया है।
theological_decisions:
- issue: धर्मियों के कर्म और प्रतिफल का संबंध
  choice: अपने ही कर्मों के आधार पर प्रतिफल पाएँगे
  alternative: अपने ही कर्मों से मजदूरी पाएँगे
  rationale: मूल पाठ कर्मों और मिलने वाले प्रतिफल के प्रत्यक्ष संबंध को व्यक्त करता है। इसे कमजोर या किसी विशिष्ट धर्मवैज्ञानिक प्रणाली के अनुसार पुनर्व्याख्यायित नहीं किया गया; साथ ही ‘प्रतिफल’ संदर्भ में ‘mercedem’ का अधिक स्वाभाविक शब्द है।
- issue: enim का वाक्य-संबंध
  choice: क्योंकि
  alternative: परन्तु
  rationale: ‘enim’ सामान्यतः कारण या व्याख्या देता है और आसपास के तर्क से भी यही अर्थ समर्थित है; फिर भी पूर्ववर्ती विरोधात्मक समझ को पाठांतर-सदृश अनुवाद विकल्प के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। परमेश्वर को संबोधित एकवचन ‘तेरे’ रखा गया है, और कर्मों के ‘संचित’ होने की मूल रूपकात्मक भाषा सुरक्षित रखी गई है।
