translation:
  language: hi
  text: परन्तु उन्हें स्मरण कर, जिन्होंने स्वेच्छा से तेरे भय को स्वीकार किया है। और जिनका आचरण पशुओं-जैसा रहा है, उनका नाश करने की इच्छा न कर; बल्कि उन पर दृष्टि कर, जो तेरी व्यवस्था को—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memorare
  choice: स्मरण कर
  rationale: सीधा आज्ञार्थक भाव बनाए रखता है और प्रार्थना की गरिमापूर्ण शैली के अनुकूल है।
- source_word: ex uoluntate
  choice: अपनी इच्छा से
  rationale: स्वेच्छा अथवा इच्छापूर्वक किए गए स्वीकार को व्यक्त करता है, बिना भाव को आवश्यकता से अधिक स्पष्ट किए।
- source_word: tuum timorem cognouerunt
  choice: तेरे भय को जाना है
  rationale: cognouerunt के मूल ‘जाना/पहचाना’ भाव और tuum timorem की वस्तुगत दिशा को सुरक्षित रखता है; हिन्दी में ‘तेरा भय’ परमेश्वर के प्रति भय का स्वाभाविक धार्मिक प्रयोग है।
- source_word: pecorum mores habuerunt
  choice: जिनका आचरण पशुओं के समान रहा है
  rationale: शाब्दिक पशु-व्यवहार की उपमा को स्वाभाविक हिन्दी में व्यक्त करता है; pecora के लिए सामान्य सामूहिक ‘पशु’ उपयुक्त है।
- source_word: respicias
  choice: दृष्टि कर
  rationale: प्रार्थनात्मक अनुरोध और कृपापूर्वक ध्यान देने के आशय को गरिमापूर्ण ढंग से रखता है।
- source_word: legem tuam
  choice: तेरी व्यवस्था को
  rationale: यहाँ lex के लिए बाइबिलीय हिन्दी का स्थापित और व्यापक रूप ‘व्यवस्था’ है।
theological_decisions:
- issue: ‘तेरे भय को जाना’ का अर्थ
  choice: तेरे भय को जाना है
  alternative: तेरा भय स्वेच्छा से स्वीकार किया है
  rationale: मूल Latin cognouerunt केवल बौद्धिक जानकारी से अधिक पहचान/स्वीकार का संकेत दे सकता है, पर अनुवाद में ‘स्वीकार’ जोड़ने से अर्थ अधिक निश्चित हो जाता। अतः मूल तनाव और व्यापकता बनाए रखी गई।
- issue: पशुओं जैसे आचरण वाले लोगों के लिए विनाश न चाहने की विनती
  choice: उनका नाश करना न चाह
  alternative: उन्हें नष्ट न कर
  rationale: Neque uolueris perdere में इच्छा न करने का स्पष्ट तत्व है; इसे हटाकर केवल निषेध कर देना मूल की सूक्ष्मता खो देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थनात्मक हिन्दी; परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरा’ के अनुरूप क्रियारूप। उपलब्ध Latin अंश आरम्भ और अंत दोनों ओर अपूर्ण है; इसलिए प्रारम्भ में ‘परन्तु’ रखा गया और अंत में दीर्घ विराम-चिह्न द्वारा वाक्य के अगले पद में जारी रहने का संकेत दिया गया।
