  verdict: revise
  source_fidelity: The draft preserves the imperative prayer, the voluntary element in ex uoluntate, the animal-behaviour metaphor, the volitional nuance of Neque uolueris perdere, and the unfinished final clause. However, ‘तेरे भय को जाना है’ is not idiomatic modern Hindi for cognouerunt in this context and can sound like merely acquiring information rather than recognizing/acknowledging God’s fear.
  naturalness: The register is appropriately elevated, but ‘उनका नाश करना न चाह’ and especially ‘तेरे भय को जाना है’ are stiff. The revision retains the solemn direct address while using more natural Hindi.
  terminology: ‘व्यवस्था’ is suitable for legem tuam. ‘तेरे भय को स्वीकार किया है’ renders the contextual sense of voluntarily acknowledging the fear of God without turning it into a denominational formulation. ‘पशुओं-जैसा आचरण’ retains the simile without adding interpretive detail.
  issues:
  - severity: medium
    issue: ‘तेरे भय को जाना है’ is semantically and idiomatically weak.
    rationale: Latin cognouerunt can mean recognize or acknowledge in this context; Hindi ‘भय को जाना’ is not a natural collocation and risks reducing the expression to intellectual knowledge.
  - severity: low
    issue: ‘उनका नाश करना न चाह’ is overly compressed and archaic-sounding.
    rationale: The source explicitly says not to will/desire their destruction. ‘उनका नाश करने की इच्छा न कर’ conveys that nuance in clear modern standard Hindi.
