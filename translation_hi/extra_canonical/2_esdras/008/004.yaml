source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: absorbe ergo anima sensum et deuoret quod sapit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/004.yaml
  text: And I answered and said[a], “Therefore let the soul receive understanding, and let it devour wisdom.”
translation:
  language: hi
  text: और मैंने उत्तर देकर कहा, “इसलिए, हे आत्मा, समझ को निगल जा, और वह स्वादिष्ट वस्तु को भक्षण करे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह उस चीज़ को भक्षण करे जो बुद्धिमान है।” लातीनी `sapit` का अर्थ ‘स्वादिष्ट होना’ और ‘बुद्धिमान होना’ दोनों हो सकता है।
    reason: लातीनी `quod sapit` में खाने के रूपक से जुड़ा ‘स्वादिष्ट’ अर्थ और बौद्धिक ‘बुद्धिमान’ अर्थ—दोनों की संभावना सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: absorbe
  choice: निगल जा
  rationale: यह एकवचन आज्ञार्थक क्रिया है और आगे के ‘भक्षण करे’ के साथ खाने के रूपक को बनाए रखती है।
- source_word: anima
  choice: हे आत्मा
  rationale: ‘anima’ को ‘absorbe’ के संबोधन के रूप में लिया गया है; इसलिए हिन्दी में संबोधनसूचक ‘हे’ रखा गया है।
- source_word: sensum
  choice: समझ
  rationale: यहाँ ‘बोध/समझ’ का अर्थ स्वाभाविक है और साधारण पाठक के लिए स्पष्ट रहता है।
- source_word: deuoret
  choice: वह उसे भक्षण करे
  rationale: लातीनी पाठ में पहले पुरुष-संबोधन वाली आज्ञा के बाद तीसरे पुरुष का विधिलिंग आता है; हिन्दी में इस असामान्य बदलाव को मिटाया नहीं गया।
- source_word: quod sapit
  choice: जिसमें बुद्धि का स्वाद है
  rationale: ‘sapit’ में ‘बुद्धिमान होना/समझ रखना’ और ‘स्वाद होना’ दोनों अर्थों की संभावना है। यह चयन खाने के रूपक और बुद्धि के आशय, दोनों को यथासंभव सुनाई देता है।
theological_decisions:
- issue: क्या ‘anima’ वक्ता की अपनी आत्मा है या सामान्य रूप से आत्मा?
  choice: संबोधन के रूप में ‘हे आत्मा’
  alternative: ‘मेरी आत्मा’ अथवा ‘आत्मा समझ ग्रहण करे’
  rationale: ‘absorbe’ स्पष्टतः एकवचन आज्ञार्थक है और ‘anima’ स्वाभाविक रूप से उसका संबोधन है। मूल में स्वामित्वसूचक शब्द नहीं है, इसलिए ‘मेरी’ नहीं जोड़ा गया।
- issue: ‘quod sapit’ की अर्थगत अस्पष्टता
  choice: ‘जिसमें बुद्धि का स्वाद है’
  alternative: ‘बुद्धि को’ या ‘जो बुद्धिमान है’
  rationale: अमूर्त संज्ञा ‘बुद्धि’ अधिक सहज होती, पर मूल की संबंधवाचक रचना और ‘स्वाद/बुद्धिमत्ता’ के संभावित शब्द-खेल को समतल कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सुबोध रूप अपनाया गया है। ‘निगल जा’ और ‘भक्षण करे’ मूल के खाने-संबंधी रूपक को बनाए रखते हैं। आज्ञार्थक से तीसरे पुरुष विधिलिंग में मूल का असामान्य बदलाव जानबूझकर सुरक्षित रखा गया है।
