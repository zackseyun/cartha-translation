source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pertransiit iustitia, iustum faciens ? et haec negabit. Et erit in illo tempore, et sperabunt homines et non impetrabunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/012.yaml
  text: Has righteousness passed through[a], or one who does righteousness? And it will say no. And it will be at that time that men will hope and not obtain;
translation:
  language: hi
  text: क्या धार्मिकता, या धार्मिकता करने वाला कोई व्यक्ति, गुज़र गया है?[a] और वह इसका इन्कार करेगा। उस समय लोग आशा करेंगे, पर पाएँगे नहीं;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'लैटिन पाठ की रचना संक्षिप्त और कुछ अस्पष्ट है। इसे इस प्रकार भी समझा जा सकता है: “क्या धार्मिकता, या धार्मिकता करने वाला कोई व्यक्ति, गुज़र गया है? और वह ‘नहीं’ कहेगा।”'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: pertransiit
  choice: यहाँ से होकर गुज़रा है
  rationale: लातीनी क्रिया का मूल अर्थ ‘आर-पार जाना/होकर गुज़रना’ है। ‘यहाँ से’ हिन्दी में स्वाभाविकता के लिए जोड़ा गया है, पर किसी विशेष स्थान को निर्धारित नहीं करता।
- source_word: iustitia
  choice: धार्मिकता
  rationale: यहाँ न्यायपूर्ण या धर्मसंगत आचरण के अमूर्त गुण का संकेत है; ‘धार्मिकता’ उस व्यापक अर्थ को बनाए रखती है।
- source_word: iustum faciens
  choice: धार्मिकता पर चलनेवाला कोई व्यक्ति
  rationale: शाब्दिक रूप से ‘न्याय/धार्मिकता करनेवाला’; यह सम्भवतः सेमिटिक मुहावरा है। स्वाभाविक हिन्दी में इसे नैतिक आचरण करनेवाले व्यक्ति के रूप में व्यक्त किया गया है, न कि ‘किसी को धर्मी बनानेवाला’।
- source_word: negabit
  choice: इनकार करेगा
  rationale: क्रिया का सामान्य अर्थ ‘नकारना/इनकार करना’ है। इससे अस्पष्ट कर्ता ‘वह’ और कथन की संक्षिप्तता बनी रहती है।
- source_word: sperabunt homines et non impetrabunt
  choice: लोग आशा रखेंगे, पर उन्हें कुछ प्राप्त न होगा
  rationale: impetrare का अर्थ माँगी या चाही हुई वस्तु को प्राप्त करना है। ‘कुछ’ अनिर्दिष्ट अपेक्षित फल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: iustum faciens का आशय
  choice: धार्मिकता पर चलनेवाला व्यक्ति
  alternative: धर्मी बनानेवाला
  rationale: व्याकरणतः दूसरा अर्थ सम्भव दिखाई दे सकता है, पर स्रोत-परम्परा में यह ‘धार्मिकता करनेवाला’ व्यक्ति बताने वाला मुहावरा है; इसे किसी को धर्मी ठहराने की धर्मवैज्ञानिक धारणा में नहीं बदला गया।
- issue: et haec negabit का अस्पष्ट कर्ता और कर्म
  choice: और वह इससे इनकार करेगा
  alternative: और वह ‘नहीं’ कहेगा
  rationale: लातीनी पाठ में कर्ता स्पष्ट नामित नहीं है और haec का संकेत भी संदर्भाधीन है। मुख्य पाठ सामान्य ‘इनकार करेगा’ रखता है; वैकल्पिक वाक्य-विन्यास पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। पद पिछले वाक्य से जुड़ा हुआ प्रश्न प्रतीत होता है, इसलिए उसकी खंडित संरचना को पूरी तरह समतल नहीं किया गया। अंतिम अर्धविराम अगले पद से प्रवाह का संकेत देता है।
