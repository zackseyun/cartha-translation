  text: Rise therefore and eat some bread[a], and do not abandon us like a shepherd his flock into the hands of evil wolves.
translation:
  language: hi
  text: इसलिए उठो और कुछ रोटी खाओ[a], और जिस प्रकार कोई चरवाहा अपने झुंड को दुष्ट भेड़ियों के हाथों में छोड़ देता है, उस प्रकार हमें मत छोड़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने पाठ-रूप में यहाँ अगले पद से संबंधित ये शब्द दिए गए थे: “तब मैंने उससे कहा, ‘मेरे पास से चले जाओ और सात दिन तक मेरे निकट मत आना; उसके बाद तुम मेरे पास आ सकते हो।’ उसने मेरी बात सुनी और मेरे पास से चला गया।”'
    reason: previous_rendering
lexical_decisions:
- source_word: exsurge
  choice: उठो
  rationale: लातीनी आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: gusta panem alicuius
  choice: कुछ रोटी खाओ
  rationale: यहाँ gusta का अर्थ भोजन ग्रहण करना है और alicuius अनिश्चित मात्रा बताता है; इसलिए साधारण हिन्दी में ‘कुछ रोटी खाओ’।
- source_word: derelinquas
  choice: मत छोड़ो
  rationale: विनती के रूप में आए निषेधात्मक क्रियारूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: in manibus luporum malignorum
  choice: दुष्ट भेड़ियों के हाथों में सौंप देता है
  rationale: लातीनी मुहावरा किसी को शत्रुओं के अधिकार या वश में छोड़ देने का भाव देता है; ‘सौंप देता है’ उस गंतव्य और असहायता को स्पष्ट करता है।
