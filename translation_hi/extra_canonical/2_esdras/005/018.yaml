  verdict: revise
  source_fidelity: 'The draft correctly renders the main imperatives and the image of abandoning the flock to evil wolves. However, the Latin simile is more directly represented by making the shepherd’s abandonment the comparison: “do not abandon us as a shepherd [abandons] his flock...,” rather than by attaching a relative clause to “the shepherd.”'
