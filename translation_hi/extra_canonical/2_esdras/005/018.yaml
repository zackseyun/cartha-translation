    issue: The shepherd simile is awkwardly structured in Hindi.
    rationale: The source has an elliptical comparison, sicut pastor gregem suum [derelinquit] in manibus luporum malignorum. A direct Hindi comparison better preserves both its grammar and rhetorical force.
