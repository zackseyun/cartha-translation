  terminology: “चरवाहा,” “झुंड,” “दुष्ट,” and “भेड़िये” are appropriate and preserve the source image. “कुछ रोटी” is a natural rendering in line with the English audit trail’s treatment of the uncertain/indefinite wording.
  issues:
