id: 2ES.5.30
reference: 2 Esdras 5:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si odiens odisti populum tuum tuis manibus debet castigari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/030.yaml
  text: And if you indeed hate your people[a], they ought to be chastised by your own hands.
translation:
  language: hi
  text: और यदि आप सचमुच अपनी प्रजा से घृणा करते हैं[a], तो उसे आपके अपने ही हाथों से दण्डित किया जाना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहले के पाठ में था: “और जब मैं ये बातें कह चुका, तब वह स्वर्गदूत, जो पिछली रात मेरे पास आया था, मेरे पास भेजा गया।” यह वर्तमान लातीनी स्रोत के इस पद के बजाय अगले पद के शब्दों को दर्शाता है।'
    reason: पूर्व पाठ में हुई पद-असंगति का अभिलेख रखते हुए यह स्पष्ट करना कि वह स्रोत-पाठ का वैकल्पिक पाठ नहीं है।
lexical_decisions:
- source_word: odiens odisti
  choice: सचमुच ... घृणा करते हैं
  rationale: यह दोहराव घृणा की क्रिया पर बल देता है। ‘सचमुच’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे ‘पूरी तरह’ जैसे अधिक तीव्र अर्थ में बदलने के।
- source_word: populum tuum
  choice: अपनी प्रजा
  rationale: यह संबोधित व्यक्ति के सामुदायिक लोगों को दर्शाता है; ‘प्रजा’ प्रसंग के अनुरूप, संक्षिप्त और गरिमापूर्ण है।
- source_word: tuis manibus
  choice: आपके अपने ही हाथों से
  rationale: ‘अपने ही’ मूल पाठ के इस आग्रह को बनाए रखता है कि दण्ड किसी अन्य के द्वारा नहीं, स्वयं संबोधित व्यक्ति के हाथों से हो।
- source_word: debet castigari
  choice: दण्डित किया जाना चाहिए
  rationale: लातीनी निष्क्रिय रचना और दायित्व का भाव दोनों सुरक्षित रहते हैं। ‘दण्डित’ आधुनिक पाठक के लिए ‘ताड़ना दी जाए’ की अपेक्षा अधिक स्पष्ट है, यद्यपि castigari में सुधारात्मक अनुशासन का भाव भी हो सकता है।
theological_decisions:
- issue: परमेश्वर से एकवचन संबोधन का स्तर
  choice: आप
  alternative: तू
  rationale: आधुनिक मानक हिन्दी में ‘आप’ साधारण पाठकों के लिए स्वाभाविक और आदरपूर्ण है; इससे कथन की तीक्ष्णता या मूल तर्क नहीं बदलता।
- issue: castigari का दण्डात्मक अथवा सुधारात्मक अर्थ
  choice: दण्डित किया जाना चाहिए
  alternative: ताड़ना दी जानी चाहिए / अनुशासित किया जाना चाहिए
  rationale: प्रसंग में दण्ड का स्पष्ट भाव है। फिर भी मूल शब्द की सुधारात्मक छाया को शब्दार्थ-निर्णय में स्वीकार किया गया है, उसे किसी विशेष धर्मवैज्ञानिक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की बलयुक्त अभिव्यक्ति को ‘सचमुच’ से और निष्क्रिय दायित्व को ‘दण्डित किया जाना चाहिए’ से सुरक्षित रखा गया है।
