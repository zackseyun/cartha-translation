id: 2ES.5.50
reference: 2 Esdras 5:50
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: coram te ; nam mater nostra de qua dixisti mihi, adhuc iuuenis est, [an] iam senectuti adpropinquat ? Et respondit ad me et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/050.yaml
  text: 'And I asked and said[a], ''Since you have now given me a way, I will speak before you: is our mother, of whom you spoke to me, still young, or is she already drawing near to old age?'''
translation:
  language: hi
  text: 'तब मैंने पूछा और कहा, “अब जब तूने मुझे मार्ग दिया है, तो मैं तेरे सामने बोलूँगा: तो क्या हमारी माता, जिसके विषय में तूने मुझसे कहा था, अभी जवान है, या वह अब बुढ़ापे के निकट पहुँच रही है?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातिनी पाठ में “या” (an) संपादकीय रूप से पुनःस्थापित किया गया है।
    reason: मुद्रित स्रोत में an को कोष्ठकों में दिया गया है; इसलिए विकल्पसूचक शब्द की पाठगत अनिश्चितता बताना उचित है।
lexical_decisions:
- source_word: coram te
  choice: तेरे सामने
  rationale: यह स्थान/उपस्थिति का सीधा भाव देता है और संबोधन की एकवचन निकटता बनाए रखता है।
- source_word: nam
  choice: क्योंकि
  rationale: यह प्रश्न को पिछले कथन या उपमा से कारणात्मक अथवा व्याख्यात्मक रूप से जोड़ता है; इसे छोड़ने के बजाय हिंदी में स्वाभाविक रूप से रखा गया है।
- source_word: mater nostra
  choice: हमारी माता
  rationale: ‘माता’ रूपक की गरिमा और सामूहिक संबंध दोनों को बनाए रखता है।
- source_word: adhuc iuuenis est
  choice: अभी जवान है
  rationale: ‘adhuc’ का ‘अभी’ और ‘iuvenis’ का सहज आधुनिक हिंदी रूप ‘जवान’ है।
- source_word: iam senectuti adpropinquat
  choice: अब बुढ़ापे के निकट पहुँच रही है
  rationale: ‘iam’ और क्रमशः वृद्धावस्था की ओर बढ़ने के भाव को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ‘हमारी माता’ के रूपक की पहचान
  choice: रूपक को बिना व्याख्यात्मक पहचान जोड़े यथावत रखा गया है।
  alternative: इसे यरूशलेम, सिय्योन, संसार या किसी विशिष्ट समुदाय के रूप में स्पष्ट करना।
  rationale: इस पद में स्वयं रूपक की पहचान पूरी तरह नहीं खोली गई है; किसी एक धार्मिक व्याख्या को पाठ में जोड़ना मूल की अस्पष्टता को अनुचित रूप से समाप्त करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। प्रत्यक्ष संबोधन में ‘तू/तेरे’ रखा गया है, और ‘हमारी माता’ का रूपक बिना सांप्रदायिक व्याख्या के सुरक्षित है। उपलब्ध लातिनी अंश के आरंभ और अंत पर वाक्य खंडित है; पूर्ववर्ती संदर्भ से प्रमाणित आरंभिक कथन को अंग्रेज़ी परामर्श-पाठ के अनुरूप स्वाभाविक हिंदी में रखा गया, जबकि अगले पद की ओर जाने वाला ‘Et respondit ad me et’ इस पद में शामिल नहीं किया गया।
