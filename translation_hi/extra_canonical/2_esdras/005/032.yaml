  register: आधुनिक मानक हिन्दी; संवाद में एकवचन ‘तू’ मूल के निकट और बाइबलीय गरिमा के अनुरूप रखा गया है। वाक्य स्वाभाविक बनाया गया है, किंतु अंतिम adiciam में निहित आगे जोड़ने के भाव को अत्यधिक स्पष्ट करके नहीं सुलझाया गया।
