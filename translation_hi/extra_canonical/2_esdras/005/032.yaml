  yaml_path: translation/extra_canonical/2_esdras/005/032.yaml
  text: the angel who had come to me on the previous night was with me[a], and he said to me, 'Hear me, and I will instruct you; pay attention to me, and I will add further.'
translation:
  language: hi
  text: जो स्वर्गदूत पिछली रात मेरे पास आया था, वह मेरे साथ था[a]। उसने मुझसे कहा, “मेरी बात सुन, और मैं तुझे समझाऊँगा; मेरी बात पर ध्यान दे, और मैं और कुछ जोड़ूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैंने कहा, ‘हे मेरे प्रभु, बोल।’ तब उसने मुझसे कहा, ‘इस्राएल के विषय में तेरा मन बहुत अधिक व्याकुल हो उठा है। क्या तूने उससे अधिक प्रेम किया है जिसने उसे बनाया?’”
    reason: पूर्व पद-विभाजन में इस स्थान पर यही पाठ अनूदित था; उपलब्ध लातीनी स्रोत 2 एसद्रास 5:32 के लिए भिन्न पद-सीमा दर्शाता है।
lexical_decisions:
- source_word: audi me
  choice: मेरी सुन
  rationale: लातीनी आज्ञार्थक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: instruam te
  choice: मैं तुझे शिक्षा दूँगा
  rationale: instruere के सिखाने और समझ देने के भाव को गरिमापूर्ण, सुबोध हिन्दी में व्यक्त करता है।
- source_word: intende mihi
  choice: मेरी बात पर ध्यान दे
  rationale: शाब्दिक ‘मेरी ओर ध्यान लगा’ की अपेक्षा हिन्दी में आशय स्पष्ट करता है कि वक्ता के कथन पर ध्यान देना है।
- source_word: adiciam
  choice: मैं आगे भी बताऊँगा
  rationale: क्रिया का अर्थ ‘और जोड़ना’ है; यहाँ वाणी के संदर्भ में स्वाभाविक हिन्दी रखते हुए आगे कही जाने वाली बात का अधूरापन भी बनाए रखा गया है।
