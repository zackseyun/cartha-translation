  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dominator Domine
  choice: हे सर्वसत्ताधारी प्रभु
  rationale: दोनों संबोधनों के संयुक्त भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘Dominator’ की प्रभुसत्ता और ‘Domine’ के प्रभु-संबोधन, दोनों सुरक्षित रहते हैं।
- source_word: ex omni silva terrae et ex omnium arborum eius
  choice: पृथ्वी के सभी वनों और उसके सभी वृक्षों में से
  rationale: लैटिन की चयन-सूचक ‘ex’ संरचना तथा पृथ्वी के वन-वृक्षों के व्यापक समूह को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: vineam unam
  choice: एक ही दाखलता
  rationale: ‘unam’ के एकत्व और चयनात्मक बल को ‘एक ही’ से व्यक्त किया गया है; ‘दाखलता’ धार्मिक-साहित्यिक संदर्भ में परिचित और सटीक है।
theological_decisions:
- issue: एक दाखलता के चुनाव का प्रतीकात्मक अर्थ
  choice: प्रतीक की व्याख्या जोड़े बिना ‘एक ही दाखलता’ रखा गया
  alternative: इसे सीधे किसी विशिष्ट समुदाय या धर्मवैज्ञानिक पहचान के रूप में स्पष्ट करना
  rationale: पद स्वयं प्रतीक की पहचान नहीं बताता; अनुवाद में किसी सांप्रदायिक निष्कर्ष को आरोपित नहीं किया गया।
