- source_word: secundum tempus
  choice: अपने समय के अनुसार
  rationale: यह खंड पूर्ववर्ती संदर्भ से जुड़ा हुआ प्रतीत होता है; हिन्दी में संबंध स्पष्ट और स्वाभाविक रखने के लिए निहित स्वत्वसूचक ‘अपने’ रखा गया है।
- source_word: Et dixit ad me
  choice: तब उसने मुझसे कहा
  rationale: ‘Et’ को प्रसंगगत कथानक-संयोजक ‘तब’ के रूप में व्यक्त किया गया है, और Latin वाक्य-विन्यास का अर्थ सुरक्षित रखा गया है।
- source_word: et ego dedi matricem
  choice: और मैंने गर्भ दिया
  rationale: ‘matricem’ का मूल अर्थ गर्भ/गर्भाशय है। अपूर्ण अंश में इसकी व्याकरणिक और वैचारिक असहजता को दूर करने हेतु कोई अनुमानित कर्म या व्याख्या नहीं जोड़ी गई।
