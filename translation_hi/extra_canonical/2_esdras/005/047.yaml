  choice: गर्भ
  alternative: गर्भाशय
  rationale: ‘गर्भ’ सामान्य आधुनिक हिन्दी में अधिक सहज है और संतानोत्पत्ति की क्षमता या स्थान—दोनों की कुछ अर्थगत गुंजाइश बनाए रखता है; पाठ के अगले भाग के अभाव में आशय को अधिक विशिष्ट नहीं किया गया।
