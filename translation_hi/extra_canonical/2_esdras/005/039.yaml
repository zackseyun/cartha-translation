    reason: पाठक को असामान्य वाक्य-विच्छेद के स्रोतगत कारण से अवगत कराना।
lexical_decisions:
- source_word: insipiens
  choice: मूर्ख
  rationale: लातीनी शब्द यहाँ वक्ता की अपनी समझ की अपर्याप्तता को सीधे व्यक्त करता है; ‘मूर्ख’ इसका स्वाभाविक और स्पष्ट हिन्दी समतुल्य है।
- source_word: quomodo potero dicere
  choice: फिर मैं ... कैसे कह सकूँगा
  rationale: यह भविष्य-सामर्थ्य से जुड़ा प्रश्न है; ‘कैसे कह सकूँगा’ उस असमर्थता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: de his quibus
  choice: इन बातों के विषय में ... जिनके विषय में
  rationale: मूल की पुनरुक्त और अधूरी संबंधवाचक रचना को सँवारकर पूरा करने के बजाय यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: वाक्य का स्रोत में अधूरा होना
  choice: वाक्य को डैश पर अधूरा छोड़ा गया और पादटिप्पणी दी गई
  alternative: अगले अंश या पुराने विस्तारित पाठ के आधार पर वाक्य पूरा करना
  rationale: दिए गए लातीनी स्रोत का अंत ‘quibus’ पर होता है; अनुपस्थित शब्द जोड़ने से मूल साक्ष्य से परे अर्थ आरोपित होता।
