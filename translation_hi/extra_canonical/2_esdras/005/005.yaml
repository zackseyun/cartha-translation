  text: And blood will drip from wood[a], and the stone will give its voice, and peoples will be shaken, and steps will be changed.
translation:
  language: hi
  text: और लकड़ी से खून टपकेगा, और पत्थर आवाज़ देगा; लोग हिल उठेंगे, और कदम बदल जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ligno
  choice: लकड़ी
  rationale: यह lignum का सीधा और संदर्भानुकूल अर्थ है; मूल पाठ यह स्पष्ट नहीं करता कि आशय किसी पेड़, काष्ठ-वस्तु या विशेष लकड़ी से है।
- source_word: sanguis stillabit
  choice: खून टपकेगा
  rationale: stillare का भाव बूंद-बूंद टपकने का है; यह अलौकिक चिन्ह की सजीवता बनाए रखता है।
- source_word: lapis dabit vocem suam
  choice: पत्थर अपनी आवाज़ देगा
  rationale: मूल लैटिन की मानवीकरणयुक्त अभिव्यक्ति को निकटता से सुरक्षित रखा गया है, यद्यपि हिन्दी में ‘आवाज़ निकालेगा’ अधिक मुहावरेदार विकल्प है।
- source_word: populi commovebuntur
  choice: लोग हिल उठेंगे
  rationale: commovebuntur में हिलाए जाने, विचलित होने या उद्वेलित होने की अर्थ-छाया है। ‘हिल उठेंगे’ इस अस्पष्टता को अनावश्यक रूप से भय या भ्रम तक सीमित नहीं करता।
- source_word: gressus commutabuntur
  choice: कदम बदल जाएँगे
  rationale: gressus का मूल अर्थ ‘कदम/चाल’ है। शाब्दिक बिंब को बनाए रखा गया है, क्योंकि पाठ यह नहीं बताता कि आशय मार्ग, व्यवहार या घटनाक्रम से है।
theological_decisions:
- issue: निर्जीव वस्तुओं का मानवीकरण
  choice: पत्थर अपनी आवाज़ देगा
  alternative: पत्थर पुकार उठेगा
  rationale: मूल में केवल आवाज़ देने की बात है; ‘पुकार उठेगा’ कथन को अधिक विशिष्ट और नाटकीय बना देता।
- issue: populi की सामूहिक बहुवचनता
  choice: लोग
  alternative: जातियाँ / जन-समुदाय
  rationale: ‘लोग’ आधुनिक हिन्दी में स्वाभाविक है और मूल को अनावश्यक रूप से राष्ट्रों या जातीय समूहों तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यकालीन अपोकैलिप्टिक लय और मूल के समानांतर वाक्यांश सुरक्षित हैं; अंतिम खंड की संभावित रूपकात्मकता की व्याख्या नहीं की गई।
