source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quos peperisti nunc non sunt similes his qui ante sed minores statu ? Et dicet tibi et ipsa : alii sunt qui in iuuentute uirtutis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/052.yaml
  text: For you will say to her, "Why are those whom you have now borne not like those who came before, but smaller in stature?"
translation:
  language: hi
  text: क्योंकि तुम उससे कहोगे, “जिन्हें तुमने अब जन्म दिया है, वे पहले वालों के समान क्यों नहीं हैं, बल्कि कद में छोटे क्यों हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peperisti
  choice: जन्म दिया है
  rationale: लातीनी क्रिया का सीधा और स्वाभाविक अर्थ है; पृथ्वी को जननी के रूप में संबोधित करने वाले प्रसंग को बनाए रखता है।
- source_word: non sunt similes
  choice: मेल क्यों नहीं खाते
  rationale: ‘समान नहीं हैं’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है और तुलना का अर्थ स्पष्ट रखता है।
- source_word: minores statu
  choice: कद में छोटे
  rationale: statu यहाँ शारीरिक कद या आकार को सूचित करता है; यह अनावश्यक व्याख्या जोड़े बिना तुलना को स्पष्ट करता है।
- source_word: qui ante
  choice: जो पहले जन्मे थे
  rationale: मूल में ‘पहले वाले’ निहित है; हिन्दी में संदर्भ स्पष्ट करने के लिए ‘जन्मे थे’ की पूर्ति की गई है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। उपलब्ध लातीनी पाठ के अंत में अगली उक्ति आरम्भ होती है (‘और वह स्वयं तुमसे कहेगी...’), पर अंग्रेज़ी परामर्श-पाठ और पद-सीमा के अनुसार उसे इस पद में शामिल नहीं किया गया है।
