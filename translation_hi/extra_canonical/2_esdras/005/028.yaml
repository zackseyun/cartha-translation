id: 2ES.5.28
reference: 2 Esdras 5:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et nunc Domine, ut quid tradidisti unum plurimiset praeparasti unam radicem super alias et dispersisti unicum tuum in multis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/028.yaml
  text: And now[a], Lord, why have you handed over the one to the many, and prepared one root above the others, and scattered your only one among the many?
translation:
  language: hi
  text: और अब, हे प्रभु, आपने उस एक को बहुतों के हाथों क्यों सौंप दिया, एक जड़ को दूसरों से बढ़कर क्यों बनाया, और अपने उस इकलौते को बहुतों के बीच क्यों बिखेर दिया?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tradidisti
  choice: हाथ सौंप दिया
  rationale: लैटिन क्रिया में किसी को दूसरों के अधिकार या वश में कर देने का भाव है; यह स्वाभाविक हिन्दी में उसी बल को व्यक्त करता है।
- source_word: unum
  choice: उस एक को
  rationale: मूल में पुल्लिंग एकवचन और संदर्भगत विशिष्टता है; अस्पष्ट पहचान को स्पष्ट किए बिना सुरक्षित रखा गया है।
- source_word: plurimis / multis
  choice: बहुतों के हाथ / बहुतों के बीच
  rationale: दोनों स्थानों पर बहुसंख्यक समूह का भाव रखा गया है, जबकि हिन्दी में संबंधित क्रियाओं के अनुरूप परसर्ग बदले गए हैं।
- source_word: unam radicem
  choice: एक जड़ को
  rationale: मूल रूपक को बिना व्याख्यात्मक विस्तार के यथावत रखा गया है।
- source_word: super alias
  choice: दूसरी जड़ों से ऊपर
  rationale: लैटिन में निहित तुलना को हिन्दी में स्पष्ट करने के लिए संज्ञा दोहराई गई है।
- source_word: unicum tuum
  choice: अपने उस इकलौते को
  rationale: unicum का विशिष्ट, अकेला/अद्वितीय प्रिय पात्र वाला बल रखा गया है और उसकी पहचान अनिर्धारित छोड़ी गई है।
- source_word: dispersisti
  choice: बिखेर दिया
  rationale: लैटिन के तितर-बितर करने के ठोस भाव को सीधे व्यक्त करता है।
theological_decisions:
- issue: ‘एक’, ‘एक जड़’ और ‘इकलौते’ की पहचान
  choice: इन रूपकों और संकेतों की पहचान स्पष्ट किए बिना अनुवादित की गई है।
  alternative: उन्हें सीधे इस्राएल या किसी अन्य धार्मिक समुदाय के रूप में नामित करना।
  rationale: पद स्वयं नाम नहीं बताता; ऐसी पहचान जोड़ना मूल की वास्तविक अस्पष्टता और धार्मिक तनाव को अनुचित रूप से हल कर देता।
- issue: परमेश्वर की क्रिया और उत्तरदायित्व
  choice: ‘आपने ... सौंप दिया’, ‘ठहराया’ और ‘बिखेर दिया’ जैसे सीधे कर्तृवाच्य रूप रखे गए हैं।
  alternative: कर्मवाच्य या अनुमति-सूचक भाषा से परमेश्वर की प्रत्यक्ष भूमिका को नरम करना।
  rationale: मूल पाठ प्रश्न में इन क्रियाओं को सीधे प्रभु से संबद्ध करता है; उसके तीखे धर्मवैचारिक प्रश्न को बनाए रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और गरिमापूर्ण संबोधन रखा गया है। तीन समानांतर प्रश्नात्मक खंड मूल की विलापपूर्ण लय को सुरक्षित रखते हैं। कोई फुटनोट नहीं जोड़ा गया, क्योंकि अंग्रेज़ी [a] पूर्व, गलत पद-संरेखण वाले पाठ को दर्ज करता है और इस पद के लैटिन पाठ का वास्तविक पाठांतर नहीं है।
