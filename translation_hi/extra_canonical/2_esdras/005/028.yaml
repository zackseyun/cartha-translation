review_pass:
  verdict: revise
  source_fidelity: The draft correctly translates the three coordinated questions and preserves the deliberately unspecified referents of unum, radix, and unicum tuum. “बहुतों के हाथ” needs the idiomatic instrumental form “बहुतों के हाथों.” In the middle clause, “ठहराया” can suggest an appointment or decree more than praeparasti; “दूसरों से बढ़कर बनाया” naturally conveys the comparative elevation while avoiding an unnecessarily technical interpretation of the root image.
  naturalness: The register is modern, reverent, and suitable for a lament addressed to the Lord. The revision improves idiomatic Hindi without reducing the rhetorical parallelism.
  terminology: “हे प्रभु,” “जड़,” and “इकलौते” are appropriate and retain the source’s theological and referential ambiguity. No identification of the one/root/only one should be added.
  issues:
  - severity: low
    issue: Instrumental idiom in the first clause
    rationale: Standard Hindi uses “किसी के हाथों सौंप देना,” not ordinarily “किसी के हाथ सौंप देना,” for handing someone over into others’ power.
  - severity: low
    issue: Nuance of praeparasti in the middle clause
    rationale: “ठहराया” may over-specify a decretal or appointive act. “दूसरों से बढ़कर बनाया” is more idiomatic and better represents the comparative preparation/establishment expressed by the Latin phrase.
  revised_text: और अब, हे प्रभु, आपने उस एक को बहुतों के हाथों क्यों सौंप दिया, एक जड़ को दूसरों से बढ़कर क्यों बनाया, और अपने उस इकलौते को बहुतों के बीच क्यों बिखेर दिया?
