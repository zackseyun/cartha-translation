  yaml_path: translation/extra_canonical/2_esdras/005/055.yaml
  text: 'Therefore consider also for yourself: you are smaller in stature than those before you, and those who come after you will be smaller than you, as of a creation already growing old and passing beyond the strength of youth.'
translation:
  language: hi
  text: 'इसलिए अपने विषय में भी विचार करो: तुम अपने से पहले के लोगों से कद में छोटे हो, और तुम्हारे बाद आनेवाले तुमसे भी छोटे होंगे, मानो सृष्टि अब बूढ़ी हो रही हो और जवानी की शक्ति को पीछे छोड़ रही हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: senescentis creaturae
  choice: सृष्टि अब बूढ़ी होती जा रही है
  rationale: लातीनी कृदंत में चल रही वृद्धावस्था का भाव है; यह सहज हिन्दी में सृष्टि के क्रमशः बूढ़े होने की मूल उपमा बनाए रखता है।
- source_word: fortitudinem iuuentutis praeterientis
  choice: जवानी की शक्ति पीछे छूटती जा रही है
  rationale: praeterientis के गुजर जाने/पीछे छूटने के भाव और fortitudo के शक्ति-अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: his qui ante uos ... qui post uos
  choice: अपने से पहले के लोगों ... तुम्हारे बाद आनेवाले
  rationale: पूर्ववर्ती और परवर्ती पीढ़ियों के तुलनात्मक संबंध को स्पष्ट और सामान्य आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: सृष्टि की वृद्धावस्था का स्वरूप
  choice: इसे सृष्टि के बूढ़े होने की उपमा के रूप में यथावत रखा गया
  alternative: इसे केवल मानव पीढ़ियों के नैतिक या शारीरिक पतन के रूप में स्पष्ट करना
  rationale: मूल पाठ व्यापक शब्द creaturae का प्रयोग करता है; किसी विशेष धर्मवैचारिक व्याख्या तक अर्थ को सीमित करना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कद में छोटे’ अंग्रेज़ी परामर्श-पाठ में व्यक्त तुलनात्मक आशय को बनाए रखता है, जबकि सृष्टि की वृद्धावस्था और जवानी की घटती शक्ति की मूल छवि को बिना अतिरिक्त व्याख्या के प्रस्तुत किया गया है।
