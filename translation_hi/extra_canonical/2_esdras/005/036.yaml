  philosophy: optimal-equivalence
lexical_decisions:
- source_word: numera mihi
  choice: उन्हें मेरे लिए गिनो
  rationale: लैटिन आदेश और हितसूचक mihi, दोनों को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: qui necdum uenerunt
  choice: जो अभी तक नहीं आए हैं
  rationale: necdum का अर्थ ‘अभी तक नहीं’ और perfect uenerunt का अर्थ ‘आए हैं’ रखते हुए संदर्भ की वास्तविक अस्पष्टता सुरक्षित रखी गई है कि ये लोग कौन हैं या कहाँ आने हैं।
- source_word: collige mihi
  choice: मेरे लिए इकट्ठा करो
  rationale: आदेशात्मक क्रिया और mihi को स्पष्ट रूप से व्यक्त किया गया है।
- source_word: dispersas guttas
  choice: बिखरी हुई बूँदों
  rationale: रूपक को बिना व्याख्यात्मक विस्तार के शाब्दिक और सहज हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: ‘जो अभी तक नहीं आए हैं’ की पहचान और गंतव्य
  choice: इसे अनिर्दिष्ट रखा गया है
  alternative: इसे भविष्य में जन्म लेने वालों, लौटने वालों या एकत्र होने वालों के रूप में स्पष्ट करना
  rationale: लैटिन पाठ केवल qui necdum uenerunt कहता है; किसी विशेष पहचान या धर्मवैज्ञानिक अर्थ को जोड़ना मूल की अस्पष्टता मिटा देता।
- issue: वाक्य के अंत का अधूरापन
  choice: अंत में ‘और’ बनाए रखा गया है
  alternative: वाक्य को पूर्ण करना या अगले खंड की सामग्री जोड़ना
  rationale: दिए गए स्रोत-खंड का अंत et पर होता है और यह अगले पद/खंड में जारी रहने वाला वाक्य है; अनुपस्थित सामग्री जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। उद्धरण जानबूझकर अपूर्ण छोड़ा गया है क्योंकि उपलब्ध लैटिन खंड संयोजक ‘et’ पर समाप्त होता है।
