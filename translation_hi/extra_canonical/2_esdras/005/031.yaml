lexical_decisions:
- source_word: Et factum est
  choice: और ऐसा हुआ कि
  rationale: लातीनी कथात्मक सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: cum locutus essem sermones istos
  choice: जब मैं ये बातें कह चुका
  rationale: पूर्ण हो चुकी पूर्ववर्ती क्रिया को स्पष्ट करता है; ‘sermones’ का प्रसंगानुकूल सामान्य अर्थ ‘बातें’ है।
- source_word: et missus
  choice: तब भेजा गया—
  rationale: यह पद अगले वचन में पूर्ण होने वाले निष्क्रिय क्रियापद का आरम्भ है। ‘तब’ अपोदोसिस-सूचक et को स्वाभाविक हिन्दी में व्यक्त करता है और कर्ता को अनिर्दिष्ट रखता है।
theological_decisions:
- issue: वचन-सीमा पर अधूरा निष्क्रिय वाक्यांश
  choice: ‘तब भेजा गया—’ के रूप में अधूरापन बनाए रखा
  alternative: अगले वचन से कर्ता या शेष क्रिया जोड़कर वाक्य पूरा करना
  rationale: उपलब्ध लातीनी पाठ इसी स्थान पर ‘missus’ तक है; अगले वचन की सामग्री जोड़ना स्रोत-निर्धारित वचन-सीमा से आगे जाना होगा।
translation_notes:
