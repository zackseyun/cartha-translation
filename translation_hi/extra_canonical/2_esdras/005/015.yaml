  text: it labored to the point of failing. And the angel who had come, who was speaking in me, took hold of me and strengthened me and set me on my feet.
translation:
  language: hi
  text: वह परिश्रम करते-करते चुकने लगा। और जो स्वर्गदूत आया था, जो मेरे भीतर बोल रहा था, उसने मुझे थाम लिया, मुझे सामर्थ्य दिया और मेरे पैरों पर खड़ा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborauit, ut deficeret
  choice: वह परिश्रम करते-करते चुकने लगा
  rationale: लातीनी वाक्यांश के अस्पष्ट कर्ता को ‘वह’ से बनाए रखा गया है। ‘चुकने लगा’ deficeret में निहित शक्ति समाप्त होने या विफल होने की ओर बढ़ने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: tenuit me
  choice: उसने मुझे थाम लिया
  rationale: tenuit का शारीरिक सहारा देने वाला अर्थ प्रसंग में ‘थाम लिया’ से स्पष्ट और स्वाभाविक रूप में आता है।
- source_word: loquebatur in me
  choice: मेरे भीतर बोल रहा था
  rationale: in me को ‘मुझसे’ बनाकर उसकी असामान्य अभिव्यक्ति को सामान्य नहीं किया गया; ‘मेरे भीतर’ मूल पाठ की वास्तविक अस्पष्टता और तनाव सुरक्षित रखता है।
- source_word: confortauit me
  choice: मुझे सामर्थ्य दी
  rationale: confortauit का अर्थ यहाँ बल या सामर्थ्य प्रदान करना है; यह स्वर्गदूत द्वारा संभाले जाने और खड़ा किए जाने के प्रसंग के अनुकूल है।
- source_word: statuit me super pedes
  choice: मेरे पैरों पर खड़ा कर दिया
  rationale: लातीनी अभिव्यक्ति को स्वाभाविक हिन्दी मुहावरे में प्रस्तुत किया गया है, जबकि उसकी शारीरिक क्रिया बनी रहती है।
theological_decisions:
- issue: स्वर्गदूत का लेखक ‘में’ बोलना
  choice: मेरे भीतर बोल रहा था
  alternative: मुझसे बात कर रहा था
  rationale: मूल पाठ loquebatur in me कहता है, न कि सामान्यतः प्रयुक्त ‘मुझसे’। इसलिए संभावित आंतरिक या प्रेरित वाणी को किसी निश्चित धर्मवैज्ञानिक व्याख्या में बदले बिना मूल संरचना सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक खंड के कर्ता की अनिश्चितता को ‘वह’ द्वारा बनाए रखा गया है; कोई व्याख्यात्मक संज्ञा नहीं जोड़ी गई।
