reference: 2 Esdras 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'de signis autem: ecce dies venient, et adprehendentur qui inhabitant super terram in excessu multo, et abscondetur veritatis via, et sterilis erit a fide regio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/001.yaml
  text: 'But concerning the signs: behold[a], days are coming when those who dwell on the earth will be seized with great terror, and the way of truth will be hidden, and the land will be barren of faith.'
translation:
  language: hi
  text: 'परन्तु चिन्हों के विषय में: देखो, वे दिन आ रहे हैं जब पृथ्वी पर रहनेवाले महान आतंक की चपेट में आ जाएँगे,[a] सत्य का मार्ग छिप जाएगा, और देश विश्वास से सूना हो जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बड़ी घबराहट या बड़े विस्मय में पड़ जाएँगे।”
    reason: लैटिन ‘in excessu multo’ (संभवतः खोए हुए यूनानी ‘ekstasis’ का प्रतिबिंब) तीव्र आतंक के साथ घबराहट या विस्मय का भाव भी दे सकता है; प्रसंग के अनुसार मुख्य पाठ में ‘महान आतंक’ रखा गया है।
lexical_decisions:
- source_word: de signis autem
  choice: परन्तु चिन्हों के विषय में सुनो
  rationale: विषय-परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है; ‘सुनो’ लैटिन में स्पष्ट क्रिया न होने पर भी आगे की भविष्यसूचक घोषणा की ओर ध्यान दिलाने के लिए प्रयुक्त है।
- source_word: ecce dies venient
  choice: देखो, वे दिन आ रहे हैं
  rationale: ‘ecce’ की उद्घोषणात्मक शक्ति और ‘dies venient’ के आसन्न भविष्य—दोनों को बनाए रखता है।
- source_word: adprehendentur
  choice: जकड़ लिए जाएँगे
  rationale: निष्क्रिय क्रिया के ‘पकड़े जाने/वश में आ जाने’ के बल को सुरक्षित रखता है और आतंक द्वारा अभिभूत होने का स्वाभाविक हिन्दी बोध देता है।
- source_word: in excessu multo
  choice: बड़े आतंक से
  rationale: प्रलय-संबंधी प्रसंग में यह वाक्यांश तीव्र भय या घबराहट का संकेत देता है; फिर भी अर्थगत अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: abscondetur veritatis via
  choice: सत्य का मार्ग छिप जाएगा
  rationale: लैटिन रूपक और निष्क्रिय भाव का निकट, सहज अनुवाद।
- source_word: sterilis erit a fide regio
  choice: देश विश्वास से रहित हो जाएगा
  rationale: ‘sterilis’ के बाँझपन-रूपक का आशय स्पष्ट करता है, जबकि ‘regio’ को प्रसंगानुकूल ‘देश’ से व्यक्त करता है।
theological_decisions:
- issue: ‘विश्वास’ का आशय
  choice: विश्वास
  alternative: निष्ठा / विश्वस्तता
  rationale: लैटिन ‘fides’ विश्वास, निष्ठा या विश्वस्तता का अर्थ दे सकता है। पाठ किसी संप्रदायगत या अधिक विशिष्ट अर्थ को निश्चित नहीं करता, इसलिए व्यापक ‘विश्वास’ रखा गया है।
- issue: भूमि के बाँझ होने का रूपक
  choice: देश विश्वास से रहित हो जाएगा
  alternative: देश विश्वास के लिए बाँझ हो जाएगा
  rationale: मुख्य पाठ में अर्थ को स्वाभाविक आधुनिक हिन्दी में दिया गया है; असामान्य शाब्दिक रूपक थोपकर किसी विशेष धर्मवैज्ञानिक व्याख्या को प्राथमिकता नहीं दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। भविष्यसूचक लय और मूल के तीन समांतर संकटों को बनाए रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
