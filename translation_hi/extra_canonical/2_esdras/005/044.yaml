source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'spondit ad me et dixit : non potest festinare creatura super creatorem, nec sustinere saeculum qui in eo creati sunt in unum. Et dixi : quomodo dixisti seruo tuo, quoniam uiuificans uiuifi-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/044.yaml
  text: And he answered me and said[a], 'The creature cannot hasten faster than the Creator, nor can the age sustain those who were created in it all at once.'
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और कहा, “सृजा हुआ प्राणी अपने सृष्टिकर्ता से अधिक शीघ्रता से नहीं चल सकता[a], और यह युग उन सबको, जो इसमें रचे गए हैं, एक साथ संभाल नहीं सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सृजा हुआ प्राणी अपने सृष्टिकर्ता से आगे जल्दी नहीं चल सकता।”
    reason: festinare super में तुलनात्मक ‘अधिक शीघ्रता से’ मुख्य अर्थ है; ‘आगे’ वाली सम्भावित स्थानगत अर्थच्छाया भी सुरक्षित रखी गई है।
lexical_decisions:
- source_word: creatura
  choice: सृष्ट प्राणी
  rationale: लातीनी एकवचन का मूल अर्थ ‘रचा हुआ प्राणी/जीव’ बनाए रखता है और उसे स्वतः समूची ‘सृष्टि’ नहीं मानता।
- source_word: festinare super
  choice: से अधिक जल्दी करना
  rationale: यहाँ super को festinare के साथ तुलनात्मक अर्थ में लिया गया है; हिन्दी मुहावरे में यह सृष्ट प्राणी और सृष्टिकर्ता की गति की तुलना स्वाभाविक रूप से व्यक्त करता है।
- source_word: saeculum
  choice: यह युग
  rationale: प्रसंग में यह वर्तमान काल-व्यवस्था या युग को सूचित करता है, केवल ‘संसार’ को नहीं।
- source_word: sustinere
  choice: धारण करना
  rationale: ‘संभालना/सहन करना’ की अर्थ-सीमा रखते हुए युग द्वारा सब सृजे हुओं को समेटे रखने का भाव गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: in unum
  choice: एक साथ
  rationale: सभी रचे हुओं के एक ही समय में उपस्थित होने की बात को सीधे व्यक्त करता है।
theological_decisions:
- issue: सृष्ट प्राणी और सृष्टिकर्ता के बीच समय अथवा गति का संबंध
  choice: 'तुलनात्मक कथन को बिना अतिरिक्त व्याख्या के रखा गया है: ‘अपने सृष्टिकर्ता से अधिक जल्दी नहीं कर सकता।’'
  alternative: ‘सृष्टिकर्ता से आगे नहीं बढ़ सकता’
  rationale: मूल super स्थानगत ‘आगे’ अथवा तुलनात्मक ‘से अधिक’ दोनों का आभास दे सकता है; festinare के कारण मुख्य पाठ में गति-संबंधी तुलना अधिक स्वाभाविक है, जबकि दूसरा पाठ टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘सृष्ट प्राणी’ और ‘सृष्टिकर्ता’ की शब्द-संगति मूल के creatura/creator विरोध को बनाए रखती है; ‘धारण’ औपचारिक है, पर इस अपोक्रिफीय ज्ञान-साहित्य के स्वर के अनुकूल है।
