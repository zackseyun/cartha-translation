  text: And he said[a], 'Ask a woman who bears, and she will tell you. For you will say to her, "Why
translation:
  language: hi
  text: उसने कहा[a], “किसी ऐसी स्त्री से पूछो जो बच्चे को जन्म देती है, और वह तुम्हें बताएगी। क्योंकि तुम उससे कहोगे, ‘क्यों
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मुझे उत्तर दिया और कहा...”
    reason: यह पूर्व प्रचलित पाठांतर है; उपलब्ध लैटिन में केवल ‘उसने कहा’ है।
lexical_decisions:
- source_word: dixit
  choice: उसने कहा
  rationale: लैटिन में केवल सामान्य कथन-सूत्र है; ‘उत्तर दिया’ या ‘मुझसे’ जोड़ना मूल पाठ से अधिक होगा।
- source_word: interroga quae parit
  choice: किसी ऐसी स्त्री से पूछो जो बच्चे को जन्म देती है
  rationale: स्त्रीलिंग संबंधवाचक quae को सामान्य अर्थ में लिया गया है; ‘किसी’ अनिश्चित और उदाहरणात्मक आशय को स्वाभाविक हिन्दी में व्यक्त करता है। parit का अर्थ स्पष्ट करने के लिए ‘बच्चे को जन्म देती है’ रखा गया है।
- source_word: et dicet tibi
  choice: और वह तुम्हें बताएगी
  rationale: भविष्यकाल और एकवचन संबोधन दोनों सुरक्षित रखे गए हैं।
- source_word: 'Dices enim ei : quare'
  choice: क्योंकि तुम उससे कहोगे, ‘क्यों
  rationale: enim को ‘क्योंकि’, dices को भविष्यकाल ‘कहोगे’, और quare को अगले पद में जारी रहने वाले सीधे प्रश्न की शुरुआत ‘क्यों’ के रूप में रखा गया है।
theological_decisions:
- issue: कथन-सूत्र में उत्तर देने का भाव
  choice: उसने कहा
  alternative: उसने मुझे उत्तर दिया और कहा
  rationale: उपलब्ध लैटिन पाठ में केवल dixit है; इसलिए विस्तृत वैकल्पिक पाठ को मुख्य अनुवाद में नहीं जोड़ा गया।
- issue: प्रसव करने वाली स्त्री की निश्चितता
  choice: किसी ऐसी स्त्री
  alternative: उस स्त्री
  rationale: quae parit यहाँ किसी सामान्य उदाहरण की स्त्री को सूचित कर सकता है; निश्चित उपपद न होने और प्रसंग के सामान्य आशय के कारण अनिश्चित रूप अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण किंतु सहज ‘तुम’ संबोधन और बहुवचन-सदृश क्रियारूप ‘पूछो’ रखा गया है। पद मूल स्रोत की तरह अधूरे प्रश्न ‘क्यों’ पर समाप्त होता है, क्योंकि वाक्य अगले पद में जारी रहता है।
