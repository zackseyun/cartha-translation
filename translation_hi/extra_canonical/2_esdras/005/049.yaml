source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'admodum enim infans non parit nec ea quae senuit adhuc, sic ego disposui a me creatum saeculum. Et interrogaui et dixi : cum iam dederis mihi uiam, loquar'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/049.yaml
  text: For just as an infant does not bear children[a], nor does one who has grown old bear any longer, so I ordered the age that I created.'
translation:
  language: hi
  text: क्योंकि जैसे एक शिशु संतान नहीं जनती, और न ही वह जो वृद्ध हो चुकी है अब संतान जनती है, वैसे ही मैंने अपने रचे हुए युग[a] को व्यवस्थित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संसार’।
    reason: लातीनी saeculum का अर्थ ‘युग’ और ‘संसार/विश्व-व्यवस्था’ दोनों हो सकता है।
lexical_decisions:
- source_word: infans
  choice: शिशु
  rationale: लातीनी शब्द का मूल अर्थ ‘शिशु/छोटा बच्चा’ है। प्रसव के स्त्रीलिंग संदर्भ को हिन्दी क्रिया ‘जनती’ से बनाए रखा गया है।
- source_word: ea quae senuit
  choice: जो स्त्री बूढ़ी हो चुकी है
  rationale: लातीनी सर्वनाम स्त्रीलिंग है; ‘स्त्री’ स्पष्ट करने से स्रोत का आशय स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: adhuc
  choice: अब ... नहीं
  rationale: नकारात्मक वाक्य में इसका अर्थ ‘अब और नहीं/अब नहीं’ है।
- source_word: disposui
  choice: क्रम निर्धारित किया है
  rationale: यहाँ शब्द रचे हुए युग की व्यवस्थित अवस्था या क्रम ठहराने का भाव देता है, केवल आज्ञा देने का नहीं।
- source_word: saeculum
  choice: युग
  rationale: इस प्रसंग में सृष्ट इतिहास या वर्तमान विश्व-युग का संकेत है; ‘युग’ प्रमुख अर्थ रखता है, जबकि ‘संसार’ संभावित विकल्प है।
theological_decisions:
- issue: रचे हुए saeculum की प्रकृति
  choice: युग
  alternative: संसार
  rationale: स्रोत का शब्द कालखंड और विश्व-व्यवस्था दोनों का अर्थ दे सकता है। मुख्य पाठ में ‘युग’ रखा गया और अर्थगत व्यापकता को पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर उपमा को स्पष्ट रखने के लिए दोनों खंडों में ‘संतान जनती’ दोहराया गया है। उद्धरण का अंतिम चिह्न इस कारण रखा गया है कि पद वक्ता के कथन का अंत है।
