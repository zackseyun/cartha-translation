source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit inconposita vestigio quam nunc vides regnare regionem, et videbunt eam desertam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/003.yaml
  text: And the region that you now see ruling will be a trackless waste, and they will see it desolate.
translation:
  language: hi
  text: और जिस प्रदेश को तू अब शासन करते देखता है, वह ऐसा उजाड़ हो जाएगा कि वहाँ कोई पगचिह्न न होगा, और वे उसे उजड़ा हुआ देखेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem
  choice: प्रदेश
  rationale: ‘प्रदेश’ लैटिन के क्षेत्र-सूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और इसे केवल ‘भूमि’ तक सीमित नहीं करता।
- source_word: regnare
  choice: शासन करते
  rationale: स्रोत में प्रदेश को मानवीय क्रिया ‘राज करना/शासन करना’ दी गई है; उस असामान्य किंतु अर्थपूर्ण रूपक को बनाए रखा गया है।
- source_word: inconposita vestigio
  choice: ऐसा उजाड़ ... जहाँ कोई पगडंडी न होगी
  rationale: दुरूह लैटिन पदबंध को उसके संदर्भगत अर्थ—मार्ग या पदचिह्न से रहित उजाड़—के रूप में स्पष्ट और सहज हिन्दी में दिया गया है।
- source_word: desertam
  choice: निर्जन
  rationale: यह ‘त्यक्त/उजाड़’ की दशा व्यक्त करता है और पहले आए ‘उजाड़’ की अनावश्यक पुनरावृत्ति से बचाता है।
theological_decisions:
- issue: शासन करने वाले प्रदेश की पहचान
  choice: प्रदेश को सीधे ‘शासन करते’ हुए कहा गया
  alternative: इसे किसी साम्राज्य या उसके शासक के रूप में स्पष्ट करना
  rationale: स्रोत स्वयं पहचान स्पष्ट नहीं करता; इसलिए संभावित साम्राज्यगत संकेत को व्याख्या द्वारा निश्चित नहीं किया गया।
- issue: बहुवचन videbunt का कर्ता
  choice: लोग
  alternative: वे
  rationale: लैटिन में कर्ता अनिर्दिष्ट बहुवचन है। हिन्दी में अकेला ‘वे’ पूर्वपद के बिना अस्पष्ट होता; ‘लोग’ अनिर्दिष्ट सामूहिक अर्थ को स्वाभाविक ढंग से रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। संबोधन में एकवचन ‘तू’ रखा गया है, जो इस भविष्यदर्शी संवाद की निकट और गंभीर शैली के अनुकूल है।
