base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/024.yaml
  text: and from all the lands of the world you chose for yourself one pit[a], and from all the flowers of the world you chose for yourself one lily,
translation:
  language: hi
  text: और संसार की सब भूमियों में से तूने अपने लिए एक गड्ढा[a] चुन लिया, और संसार के सारे फूलों में से तूने अपने लिए एक सोसन का फूल चुन लिया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पिछला अनुवाद: “और समुद्र की सारी गहराइयों में से तूने अपने लिए एक धारा भर दी, और बनाए गए सब नगरों में से तूने अपने लिए सिय्योन को पवित्र ठहराया।”'
    reason: previous_rendering
lexical_decisions:
- source_word: foveam
  choice: गड्ढा
  rationale: लातीनी शब्द का सामान्य अर्थ ‘गड्ढा’ है। प्रसंग में यह असामान्य प्रतीत होता है, फिर भी उपलब्ध मूल पाठ की कठिनता को अनुमान से सरल नहीं किया गया।
- source_word: lilium
  choice: सोसन का फूल
  rationale: यह lily जाति के फूल का पारंपरिक और गरिमापूर्ण हिन्दी नाम है; केवल ‘फूल’ कहने से मूल की विशिष्टता खो जाती।
- source_word: elegisti tibi
  choice: तूने अपने लिए ... चुन लिया
  rationale: मूल के चयन और आत्महितार्थक भाव, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: orbis
  choice: संसार
  rationale: दोनों समानांतर पदों में विश्वव्यापी दायरे को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘एक गड्ढा’ की कठिन और संभावित रूप से भ्रष्ट पाठ-परंपरा
  choice: मुख्य पाठ में उपलब्ध लातीनी पाठ के अनुसार ‘एक गड्ढा’ रखा गया
  alternative: 'पिछला पाठ: ‘समुद्र की सारी गहराइयों में से तूने अपने लिए एक धारा भर दी, और बनाए गए सब नगरों में से तूने अपने लिए सिय्योन को पवित्र ठहराया’'
  rationale: वैकल्पिक पाठ अगले पद से संबद्ध जान पड़ता है और उद्धृत लातीनी मूल का अनुवाद नहीं है। कठिन पाठ को धर्मवैचारिक अनुमान से बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली। ईश्वर को संबोधन के लिए ‘तू’ रखा गया है। पद की समानांतर संरचना और मूल पाठ की वास्तविक कठिनता सुरक्षित रखी गई है।
