  text: 'illum super eum qui fecit illum? Et dixi: non, domine, sed dolens locutus sum, torquent enim me renes mei per omnem horam querentem adprehendere semitam altissimi et inuestigare partem iudicii eius. Et dixit ad me: non potes. et dixi: quare, domine? aut quid nascebar? aut quare non fiebat matrix matris meae mihi sepulchrum, ut non uiderem laborem Iacob'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/034.yaml
  text: him more than he who made him?' And I said[a], 'No, lord, but I have spoken in grief, for my inward parts torment me every hour as I seek to grasp the path of the Most High and to search out part of his judgment.' And he said to me, 'You cannot.' And I said, 'Why, lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see Jacob's trouble?'
translation:
  language: hi
  text: '“उसे उस व्यक्ति से अधिक जिसने उसे बनाया है?” मैंने कहा[a], “नहीं, प्रभु, पर मैंने दुःख में यह कहा है, क्योंकि मेरा अंतरतम हर घड़ी मुझे पीड़ा देता है, जब मैं परमप्रधान के मार्ग को समझने और उसके न्याय के एक अंश की खोज करने का प्रयास करता हूँ।”


    उसने मुझसे कहा, “तुम ऐसा नहीं कर सकते।”


    मैंने कहा, “क्यों, प्रभु? या मैं क्यों जन्मा? या मेरी माता का गर्भ ही मेरी कब्र क्यों न बन गया, ताकि मैं याकूब का कष्ट न देखता?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहले के एक पद-विभाजन में पाठ यहाँ से आरंभ होता था: “उसने मुझसे कहा, ‘तुम ऐसा नहीं कर सकते।’ मैंने कहा, ‘क्यों, प्रभु? या मैं क्यों जन्मा? या मेरी माता का गर्भ ही मेरी कब्र क्यों न बन गया, ताकि मैं याकूब का कष्ट न देखता?’”'
    reason: previous_rendering
lexical_decisions:
- source_word: renes mei
  choice: मेरा अंतरतम
  rationale: लैटिन में शाब्दिक अर्थ ‘मेरे गुर्दे/भीतरी अंग’ है, पर यहाँ यह गहरी आंतरिक व्यथा का मुहावरा है; ‘मेरा अंतरतम’ उस रूपक और भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: semitam altissimi
  choice: परमप्रधान के मार्ग
  rationale: ‘semitam’ पथ या बाट है; हिन्दी में ‘मार्ग’ स्वाभाविक और गरिमापूर्ण है। ‘altissimi’ को पारंपरिक परंतु सुबोध ‘परमप्रधान’ से व्यक्त किया गया है।
- source_word: inuestigare partem iudicii eius
  choice: उसके न्याय के एक अंश की थाह लेने
  rationale: ‘inuestigare’ गहराई से खोजने या जाँचने और ‘partem’ केवल एक अंश को दर्शाता है; ‘थाह लेने’ से मानवीय खोज और उसकी सीमा दोनों प्रकट होती हैं।
- source_word: labor Iacob
  choice: याकूब का कष्ट
  rationale: ‘labor’ यहाँ श्रम मात्र नहीं, बल्कि पीड़ा, संकट या दुःख है; ‘कष्ट’ प्रसंग के विलापपूर्ण स्वर के अनुकूल व्यापक शब्द है।
- source_word: matrix matris meae
  choice: मेरी माता का गर्भ
  rationale: लैटिन पद का सीधा और स्वाभाविक हिन्दी रूप, जो जन्मस्थान के ही कब्र बन जाने की तीखी छवि बनाए रखता है।
theological_decisions:
- issue: परमप्रधान के न्याय को समझ पाने की मानवीय क्षमता
  choice: स्वर्गदूत के स्पष्ट उत्तर ‘तुम ऐसा नहीं कर सकते’ और एज्रा की व्यथित खोज—दोनों को बिना नरम किए रखा गया है।
  alternative: इसे केवल पूर्ण न्याय न समझ पाने, अथवा अभी न समझ पाने के रूप में स्पष्ट करना।
  rationale: मूल ‘non potes’ संक्षिप्त और निरपेक्ष है; अनुवाद को ऐसी सीमा या समयगत योग्यता नहीं जोड़नी चाहिए जो स्रोत में नहीं है।
- issue: याकूब की सामूहिक पहचान
  choice: ‘याकूब’ नाम को यथावत रखा गया है।
  alternative: ‘इस्राएल’ या ‘याकूब के वंशज’ कहना।
  rationale: मूल पाठ ‘Iacob’ कहता है और नाम में व्यक्ति तथा समुदाय के बीच संभावित अर्थ-तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। खंडित आरंभ को स्रोत के अनुसार ज्यों का त्यों रखा गया है, क्योंकि यह पिछले पद से जारी प्रश्न का अंत है। संवाद को स्पष्ट करने के लिए अनुच्छेद-विभाजन किया गया है; स्रोत की बार-बार आने वाली प्रश्नवाचक संरचना और एज्रा की तीव्र व्यथा सुरक्षित रखी गई है।
