  text: 'multiplicabitur iniustitia et incontinentia super terram. Et interrogabit regio proximam suam et dicet: numquid per te'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/011.yaml
  text: Injustice and lack of self-control will be multiplied upon the earth. And one region will ask its neighbor and say, 'Has righteousness passed through you?'
translation:
  language: hi
  text: पृथ्वी पर अन्याय और असंयम बढ़ते जाएँगे। तब एक प्रदेश अपने पड़ोसी प्रदेश से पूछेगा, “क्या धार्मिकता तुम्हारे यहाँ से होकर गुज़री है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लैटिन पाठ यहाँ numquid per te (“क्या … तुम्हारे यहाँ से होकर”) पर समाप्त होता है। प्रश्न के शेष शब्द प्रदत्त अंग्रेज़ी परामर्श-पाठ के आधार पर पूरक रूप में दिए गए हैं।
    reason: दिए गए मूल-भाषा स्रोत की अपूर्णता और प्रश्न की पूर्ति के आधार को स्पष्ट करना।
lexical_decisions:
- source_word: iniustitia
  choice: अन्याय
  rationale: यह लैटिन शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: incontinentia
  choice: असंयम
  rationale: यह आत्म-संयम के अभाव को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: multiplicabitur
  choice: बढ़ते जाएँगे
  rationale: संदर्भ में अन्याय और असंयम के निरंतर फैलने या बढ़ने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: regio proximam suam
  choice: एक प्रदेश अपने पड़ोसी प्रदेश से
  rationale: regio को ‘प्रदेश’ और proximam suam को संबंधसूचक ‘अपने पड़ोसी प्रदेश’ के रूप में प्रस्तुत किया गया है, जिससे मानवीकरण भी बना रहता है।
- source_word: numquid per te
  choice: क्या … तुम्हारे यहाँ से होकर
  rationale: per te का स्थानगत भाव ‘तुम्हारे यहाँ से होकर’ स्वाभाविक हिन्दी में सुरक्षित रहता है; प्रश्न की शेष पूर्ति उपलब्ध परामर्श-पाठ के अनुसार की गई है।
theological_decisions:
- issue: ‘धार्मिकता’ के अर्थ का विस्तार
  choice: केवल ‘धार्मिकता’
  alternative: ‘मनुष्य को धर्मी ठहराने वाली धार्मिकता’
  rationale: लैटिन अंश में ऐसा व्याख्यात्मक विस्तार उपलब्ध नहीं है; इसलिए किसी विशिष्ट धर्मवैज्ञानिक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘असंयम’ सटीकता और संक्षिप्तता बनाए रखता है, जबकि ‘प्रदेश’ पड़ोसी भौगोलिक इकाइयों के मानवीकरण को सहज रूप देता है।
