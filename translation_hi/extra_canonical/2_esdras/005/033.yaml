  text: 'coram te. Et dixi: loquere, dominus meus. et dixit ad me: ualde in excessu mentis factus es in Israel; aut plus dilexisti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/033.yaml
  text: '...before you.'' And I said[a], ''Speak, my lord.'' And he said to me, ''You have become greatly beside yourself in mind over Israel; or have you loved him more...'
translation:
  language: hi
  text: …तेरे सामने।” तब मैंने कहा[a], “मेरे प्रभु, बोलिए।” और उसने मुझसे कहा, “इस्राएल को लेकर तुम बहुत ही आपे से बाहर हो गए हो; या क्या तुमने उससे भी अधिक प्रेम किया है…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, पूर्व अनुवाद: “और मैंने कहा, ‘नहीं, प्रभु, पर मैंने शोक में कहा है, क्योंकि जब मैं परमप्रधान के मार्ग को समझने और उसके न्याय के किसी भाग की खोज करने का प्रयत्न करता हूँ, तब मेरी अंतरात्मा हर घड़ी मुझे पीड़ा देती है।’”'
    reason: पूर्व अनुवाद का audit-trail नोट; यह वर्तमान लैटिन अंश का वैकल्पिक अनुवाद नहीं है।
lexical_decisions:
- source_word: loquere
  choice: बोलिए
  rationale: आज्ञार्थक क्रिया को आदरसूचक आधुनिक हिन्दी में रखा गया है, क्योंकि वक्ता संबोधित व्यक्ति को ‘मेरे प्रभु’ कहता है।
- source_word: dominus meus
  choice: मेरे प्रभु
  rationale: लैटिन संबोधन का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ualde in excessu mentis factus es
  choice: तुम अपने होश से बहुत बाहर हो गए हो
  rationale: यह वाक्यांश केवल मानसिक व्यथा नहीं, बल्कि सामान्य मानसिक संतुलन से अत्यधिक बाहर हो जाने का बोध देता है; इसलिए स्रोत की तीव्रता और असामान्य मुहावरे को बनाए रखा गया है।
- source_word: in Israel
  choice: इस्राएल के कारण
  rationale: 'यहाँ in को प्रसंगगत कारण/विषय के रूप में व्यक्त किया गया है: इस्राएल को लेकर ऐसी दशा होना।'
- source_word: aut plus dilexisti
  choice: या क्या तुमने उससे भी अधिक प्रेम किया है
  rationale: तुलनात्मक plus और आगे जारी रहने वाले अधूरे प्रश्न दोनों को सुरक्षित रखा गया है; ‘उससे’ का संदर्भ इस्राएल है।
theological_decisions:
- issue: इस्राएल के लिए सर्वनाम का लिंग
  choice: ‘उससे’
  alternative: ‘उससे/उन्हें’ या संज्ञा की पुनरावृत्ति
  rationale: लैटिन dilexisti के कर्म का लिंग इस अंश में खुलकर दिखाई नहीं देता; एकवचन सामूहिक सत्ता ‘इस्राएल’ के लिए हिन्दी में ‘उससे’ स्वाभाविक है और आगे की तुलना को अनावश्यक रूप से स्पष्ट नहीं करता।
- issue: मानसिक दशा की व्याख्या
  choice: ‘अपने होश से बहुत बाहर’
  alternative: ‘मन में बहुत व्याकुल’
  rationale: excessu mentis की तीव्रता को केवल दुःख या व्याकुलता तक सीमित करना स्रोत की धार को कम कर देता; चुना हुआ रूप किसी चिकित्सकीय निदान को जोड़े बिना असंतुलन का आरोप बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण संवाद-शैली। आरंभ और अंत के दीर्घवृत्त बनाए गए हैं क्योंकि उपलब्ध लैटिन अंश पिछले और अगले वाक्य से जुड़ा हुआ है। संबोधन में आदरसूचक ‘बोलिए’ रखा गया है, जबकि उत्तर में मूल का एकवचन अनौपचारिक ‘तुम’ संरक्षित है।
