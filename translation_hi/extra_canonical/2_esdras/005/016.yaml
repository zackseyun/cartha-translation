  text: And it happened on the second night that Phaltiel, leader of the people, came to me and said, 'Where were you, and why is your face sad?
translation:
  language: hi
  text: और दूसरी रात ऐसा हुआ कि लोगों का अगुआ फलतीएल मेरे पास आया और मुझसे कहा, “तुम कहाँ थे, और तुम्हारा चेहरा उदास क्यों है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in nocte secunda
  choice: दूसरी रात
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक काल-सूचक अनुवाद।
- source_word: Phalthiel
  choice: फलतीएल
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण, जिसमें मूल उच्चारण के व्यंजन और स्वर यथासंभव सुरक्षित हैं।
- source_word: dux populi
  choice: लोगों का अगुआ
  rationale: dux के नेतृत्व-संबंधी सामान्य अर्थ को व्यक्त करता है; ‘सेनापति’ कहकर अनावश्यक सैन्य अर्थ नहीं जोड़ता।
- source_word: uultus tuus tristis
  choice: तुम्हारा चेहरा उदास
  rationale: मूल के दृश्य भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; कथात्मक प्रवाह के लिए ‘और दूसरी रात ऐसा हुआ कि’ रखा गया है। प्रत्यक्ष वचन में मूल का अनौपचारिक एकवचन संबोधन ‘तुम’ सुरक्षित है।
