  text: et regnabit quem non sperant qui inhabitant super terram; et volatilia conmigrationem facient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/006.yaml
  text: And one whom those who dwell on the earth do not expect will reign, and the birds will migrate.
translation:
  language: hi
  text: और वह राज करेगा जिसकी आशा पृथ्वी के निवासी नहीं करते; और पक्षी प्रवास करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnabit
  choice: राज करेगा
  rationale: लातीनी क्रिया का भविष्यकाल और शासन करने का सीधा अर्थ सुरक्षित रहता है।
- source_word: quem non sperant
  choice: जिसकी आशा ... नहीं करते
  rationale: sperant का मूल अर्थ ‘आशा करना’ है; यह अनपेक्षित होने का भाव रखता है, पर उसे केवल ‘उम्मीद नहीं करते’ कहकर सपाट नहीं बनाता।
- source_word: qui inhabitant super terram
  choice: पृथ्वी के निवासी
  rationale: लातीनी संबंधवाचक वाक्यांश का संक्षिप्त, स्वाभाविक और अर्थपूर्ण हिन्दी रूप।
- source_word: volatilia
  choice: पक्षी
  rationale: उड़ने वाले जीवों के लिए संदर्भानुकूल सामान्य हिन्दी शब्द।
- source_word: conmigrationem facient
  choice: प्रवास करेंगे
  rationale: शाब्दिक ‘प्रवास करेंगे/स्थानांतरित होंगे’ में से ‘प्रवास करेंगे’ पक्षियों के संदर्भ में स्वाभाविक है; उपसर्ग con- के आधार पर ‘एक साथ’ जोड़ना आवश्यक नहीं।
theological_decisions:
- issue: भावी शासक की पहचान
  choice: सर्वनामात्मक और अनिश्चित रूप ‘वह ... जिसकी’ बनाए रखा
  alternative: उसे मसीहा, राजा या किसी विशिष्ट व्यक्ति के रूप में नामित करना
  rationale: लातीनी पाठ व्यक्ति की पहचान स्पष्ट नहीं करता; अनुवाद में किसी धार्मिक व्याख्या को आरोपित नहीं किया गया।
- issue: non sperant में आशा और अपेक्षा का तनाव
  choice: ‘आशा ... नहीं करते’
  alternative: ‘जिसकी उन्हें अपेक्षा नहीं है’
  rationale: मूल क्रिया आशा और अपेक्षा दोनों का संकेत दे सकती है; ‘आशा’ मूल के सकारात्मक अर्थ-रंग को सुरक्षित रखती है, यद्यपि प्रसंग में अनपेक्षितता भी निहित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। अर्धविराम मूल के दो भविष्यसूचक कथनों को अलग रखते हुए उनका संबंध बनाए रखता है।
