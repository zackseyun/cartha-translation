  text: And I said to him[a], 'Go away from me, and do not come near me until seven days have passed, and then you may come to me.' And he did as I said and withdrew from me.
translation:
  language: hi
  text: और मैंने उससे कहा, “मेरे पास से चले जाओ और सात दिन बीतने तक मेरे निकट मत आना। उसके बाद तुम मेरे पास आना।” उसने मेरी बात मानी और मेरे पास से चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vade a me
  choice: मेरे पास से चले जाओ
  rationale: लैटिन आज्ञा का स्वाभाविक और स्पष्ट हिन्दी रूप; प्रसंग में व्यक्ति को अपने पास से विदा करना व्यक्त होता है।
- source_word: non ad me accedas
  choice: मेरे निकट मत आना
  rationale: accedas के समीप आने के अर्थ को औपचारिक किंतु सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: usque diebus septem
  choice: सात दिन बीतने तक
  rationale: समय-सीमा को केवल ‘सात दिनों के लिए’ कहने के बजाय स्रोत के आशय के अनुरूप स्पष्ट करता है।
- source_word: audivit ut dixi
  choice: उसने मेरी बात मानी
  rationale: यहाँ audivit का आज्ञापालन-सूचक मुहावरेदार अर्थ प्रसंगानुकूल है; शाब्दिक ‘सुना’ से आगे उसकी प्रतिक्रिया भी व्यक्त होती है।
- source_word: recessit a me
  choice: मेरे पास से चला गया
  rationale: वक्ता से दूर हट जाने या विदा होने की क्रिया को सहज हिन्दी में व्यक्त करता है।
