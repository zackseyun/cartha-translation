source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus creatis volatilibus nominasti tibi columbam unam, et ex omnibus plasmatis pecoribus providisti tibi ovem unam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/026.yaml
  text: and from all the birds that have been created you named for yourself one dove[a], and from all the cattle that have been formed you provided for yourself one sheep,
translation:
  language: hi
  text: और बनाए गए सब पक्षियों में से तूने अपने लिए एक कबूतरी को नामित किया,[a] और गढ़े गए सब पालतू पशुओं में से तूने अपने लिए एक भेड़ उपलब्ध कराई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “अपने लिए एक कबूतरी को नामित किया।” एक पूर्व अनुवाद में भूल से अगले पद का पाठ यहाँ रखा गया था: “और बढ़ी हुई सब जातियों में से तूने अपने लिए एक प्रजा प्राप्त की, और जिस प्रजा को तूने चाहा, उसे वह व्यवस्था दी जो सबसे बढ़कर स्वीकृत है।”'
    reason: nominasti का शाब्दिक अर्थ स्पष्ट करना और अगले पद से आए पूर्व पद-भ्रमित rendering को पाठांतर बताए बिना दर्ज करना।
lexical_decisions:
- source_word: volatilibus
  choice: पक्षियों
  rationale: लातीनी शब्द यहाँ उड़ने वाले जीवों, अर्थात पक्षियों, के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘पक्षी’ स्वाभाविक और स्पष्ट है।
- source_word: nominasti tibi
  choice: तूने अपने लिए ... को चुना
  rationale: शाब्दिक अर्थ ‘अपने लिए नामित किया’ है, पर इस चयन-सूची के संदर्भ में आशय किसी एक को विशिष्ट रूप से चुनना है।
- source_word: columbam
  choice: कबूतरी
  rationale: लातीनी शब्द स्त्रीलिंग एकवचन है; ‘कबूतरी’ इसे स्वाभाविक हिन्दी में दर्शाता है।
- source_word: plasmatis pecoribus
  choice: गढ़े गए सब पालतू पशुओं
  rationale: plasmatis का सृजनात्मक रूपक ‘गढ़े गए’ से बचा रहता है, और pecora के लिए ‘पालतू पशु’ उपयुक्त सामूहिक अर्थ देता है।
- source_word: providisti tibi
  choice: तूने अपने लिए ... का प्रबंध किया
  rationale: providere के ‘उपलब्ध कराना/प्रबंध करना’ भाव को निकटता से रखता है और इसे केवल ‘चुना’ में विलीन नहीं करता।
- source_word: ovem
  choice: भेड़
  rationale: लातीनी स्त्रीलिंग एकवचन ovis का सामान्य हिन्दी समतुल्य ‘भेड़’ है।
theological_decisions:
- issue: कबूतरी और भेड़ के प्रतीकात्मक आशय
  choice: प्रतीकों को बिना पहचान स्पष्ट किए ज्यों का त्यों रखा गया
  alternative: कबूतरी और भेड़ को किसी विशिष्ट समुदाय या धार्मिक सत्ता के रूप में व्याख्यायित करना
  rationale: पद स्वयं प्रतीकों की पहचान नहीं बताता; अनुवाद में किसी संप्रदायगत व्याख्या को आरोपित नहीं करना चाहिए।
- issue: nominasti का अनुवाद
  choice: चुना
  alternative: नाम दिया / नामित किया
  rationale: संदर्भ सृष्ट वस्तुओं में से ‘अपने लिए एक’ अलग करने का है; ‘चुना’ हिन्दी में आशय स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; ईश्वर को संबोधन में मूल के एकवचन द्वितीय पुरुष के अनुरूप ‘तूने’ रखा गया है। समानांतर वाक्य-विन्यास और ‘बनाए/गढ़े गए’ का भेद मूल लातीनी creatis/plasmatis को प्रतिबिंबित करता है।
