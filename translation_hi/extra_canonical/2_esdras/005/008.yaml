  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/008.yaml
  text: And chaos will come in many places[a], and fire will often break out, and wild beasts will leave their own region,
translation:
  language: hi
  text: और बहुत-से स्थानों में खाइयाँ बन जाएँगी[a], आग बार-बार निकल पड़ेगी, और जंगली पशु अपने क्षेत्र से चले जाएँगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से स्थानों में अराजकता होगी।” लातीनी chaos का अर्थ “खाई” या “गर्त” भी हो सकता है।
    reason: लातीनी chaos के भौतिक गर्त/खाई और अमूर्त अराजकता संबंधी अर्थों के बीच की वास्तविक अनिश्चितता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: chaos fiet per loca multa
  choice: बहुत-से स्थानों पर गहरी दरारें पड़ेंगी
  rationale: लातीनी ‘chaos’ का शाब्दिक रूप आधुनिक हिन्दी में अमूर्त अव्यवस्था का बोध कराता, जबकि इस सर्वनाश-संबंधी प्रसंग और प्राचीन पाठ-परंपरा में धरती की खाई या दरार का भौतिक चित्र अधिक संभावित है। ‘fiet’ को स्वाभाविक हिन्दी में ‘पड़ेंगी’ से व्यक्त किया गया है।
- source_word: ignis frequenter emittetur
  choice: आग बार-बार भड़केगी
  rationale: निष्क्रिय लातीनी अभिव्यक्ति का आशय बारंबार आग निकलने या फूट पड़ने से है; ‘भड़केगी’ सहज हिन्दी में उसी घटना को व्यक्त करता है।
- source_word: bestiae agrestes
  choice: जंगली पशु
  rationale: यह ‘वन्य/जंगली जानवरों’ का सामान्य पद है; ‘जंगली पशु’ dignified और सरल है।
- source_word: transmigrabunt regionem suam
  choice: अपना क्षेत्र छोड़कर चले जाएँगे
  rationale: यह अपने निवास-प्रदेश से अन्यत्र चले जाने का भाव देता है; हिन्दी में केवल ‘प्रवास करेंगे’ की अपेक्षा यह अधिक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘chaos’ का अर्थ अमूर्त अव्यवस्था है या भौतिक खाई/दरार
  choice: मुख्य पाठ में भौतिक ‘गहरी दरारें’
  alternative: ‘बहुत-से स्थानों पर अराजकता फैल जाएगी’ अथवा शाब्दिक ‘कैओस उत्पन्न होगा’
  rationale: इस अपोकैलिप्टिक संकेत में भौतिक भू-विच्छेद का अर्थ प्राचीन पाठ-साक्ष्य और प्रसंग से समर्थित है, पर लातीनी शब्द की सतही अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण भविष्यवाणी-शैली। पद पिछले वाक्य से जुड़ा होने के कारण ‘और’ से आरंभ तथा अल्पविराम पर समाप्त रखा गया है।
