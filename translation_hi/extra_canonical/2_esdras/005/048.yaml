  text: And he said to me, 'So I also gave the womb of the earth to those who were sown upon it in their time.'
translation:
  language: hi
  text: और उसने मुझसे कहा, “इसी प्रकार मैंने पृथ्वी की कोख उन लोगों को दे दी, जो अपने समय पर उसमें बोए गए थे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terrae
  choice: पृथ्वी की
  rationale: यह संबंधकारक रूप है और अगले आशय, ‘पृथ्वी की कोख’, से जुड़ता है; उपलब्ध अंश व परामर्श-पाठ इसी वाक्य-संरचना की पुष्टि करते हैं।
- source_word: seminati sunt
  choice: बोए गए थे
  rationale: लैटिन का कर्मवाच्य और बीज बोने का रूपक दोनों सुरक्षित रखे गए हैं।
- source_word: super eam
  choice: उसमें
  rationale: मनुष्यों को पृथ्वी पर बीज की तरह बोए जाने का स्वाभाविक हिन्दी रूप ‘उसमें बोए गए’ है; शाब्दिक ‘उसके ऊपर’ यहाँ असहज होगा।
- source_word: per tempus
  choice: अपने समय पर
  rationale: समय-निर्धारण का भाव बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई है; वाक्यांश को अनावश्यक रूप से ‘हर एक’ में नहीं बाँटा गया।
theological_decisions:
- issue: पृथ्वी की कोख और बोए जाने का रूपक
  choice: रूपक को ज्यों का त्यों बनाए रखा गया
  alternative: अर्थ स्पष्ट करने के लिए ‘पृथ्वी पर जन्म लेने वाले लोग’
  rationale: मूल का जन्म और बीजारोपण से जुड़ा तनाव धर्मवैचारिक रूप से अर्थपूर्ण है; उसे व्याख्यात्मक भाषा से समतल नहीं किया गया।
- issue: seminati sunt में कर्ता का अनुल्लेख
  choice: कर्मवाच्य ‘बोए गए थे’
  alternative: ‘परमेश्वर ने बोया था’
  rationale: मूल पाठ बोने वाले का स्पष्ट नाम नहीं लेता, इसलिए उसे जोड़ना अनुचित धर्मवैचारिक स्पष्टीकरण होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। उद्धरण और कृषि/गर्भ का मूल रूपक सुरक्षित रखा गया है। उपलब्ध लैटिन पंक्ति खंडित संदर्भ में है, इसलिए अंग्रेज़ी परामर्श-पाठ से प्रमाणित ‘पृथ्वी की कोख’ को वाक्य में रखा गया है।
