source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborabunt et non dirigentur uiae eorum. Haec signa dicere tibi permissum est mihi, et si oraueris iterum et ploraueris sicut et nunc et ieiunaueris septem diebus, audies iterato horum maiora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/013.yaml
  text: They will labor[a], but their ways will not be directed. I have been permitted to tell you these signs; and if you pray again and weep as you do now, and fast for seven days, you will hear again things greater than these.
translation:
  language: hi
  text: वे परिश्रम करेंगे, पर उनके मार्गों को दिशा नहीं दी जाएगी।[a] मुझे तुम्हें ये चिन्ह बताने की अनुमति मिली है। यदि तुम फिर प्रार्थना करोगे, अभी की तरह रोओगे और सात दिन तक उपवास करोगे, तो तुम फिर इनसे भी बड़ी बातें सुनोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर उनके मार्ग सफल नहीं होंगे।”
    reason: लैटिन वाक्यांश का शाब्दिक अर्थ ‘मार्गों को दिशा दी जाना’ है, पर यह मुहावरे के रूप में सफलता मिलने को भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: laborabunt
  choice: वे परिश्रम करेंगे
  rationale: भविष्यकाल और श्रम करने के सामान्य अर्थ को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: non dirigentur uiae eorum
  choice: उनके मार्ग सीधे नहीं किए जाएँगे
  rationale: लातीनी कर्मवाच्य और ‘मार्ग’ के रूपक को सुरक्षित रखता है। यह वाक्य सफलता न मिलने का भाव भी दे सकता है, पर मुख्य पाठ उस अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: signa
  choice: चिन्ह
  rationale: भविष्यसूचक संकेतों के लिए प्रचलित, गरिमापूर्ण बाइबिलीय शब्द।
- source_word: iterato horum maiora
  choice: फिर इनसे भी बड़ी बातें
  rationale: iterato के पुनरावृत्ति-बोध और horum maiora की तुलनात्मक शक्ति, दोनों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: ‘मार्ग सीधे किए जाने’ का अर्थ
  choice: रूपक और कर्मवाच्य को मुख्य पाठ में सुरक्षित रखा गया
  alternative: ‘उनके काम सफल नहीं होंगे’ अथवा ‘उनके मार्ग सुगम नहीं होंगे’
  rationale: dirigentur का शाब्दिक अर्थ दिशा देने या सीधा करने से जुड़ा है, जबकि मुहावरे में सफलता का भाव संभव है। किसी एक व्याख्या को निर्णायक बनाने के बजाय मूल तनाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य शैली अपनाई गई है। संबोधन एकवचन ‘तुम’ रखा गया है; भविष्यकाल और सात दिन के उपवास का क्रम मूल के अनुरूप है।
