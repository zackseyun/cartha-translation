source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'me interrogasti? Et dixit ad me: quomodo non potes facere unum de his quae dicta sunt, sic non poteris inuenire iudicium'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/040.yaml
  text: And he said to me[a], 'Just as you cannot do one of these things that have been spoken[b], so you cannot find out the judgment.'
translation:
  language: hi
  text: तब उसने मुझसे कहा, “जिस प्रकार तू इन कही गई बातों में से एक भी नहीं कर सकता, उसी प्रकार तू न्याय का पता भी नहीं लगा सकता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quomodo ... sic
  choice: जिस प्रकार ... उसी प्रकार
  rationale: लैटिन की तुलनात्मक संरचना को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: facere unum de his quae dicta sunt
  choice: उन बातों में से एक भी नहीं कर सकता जिनके विषय में बताया गया है
  rationale: ‘unum de his’ का अर्थ ‘इनमें से एक भी’ है; ‘dicta sunt’ को प्रसंगानुकूल कर्मवाच्य रूप में रखा गया है।
- source_word: inuenire iudicium
  choice: न्याय का भेद ... जान सकता
  rationale: यहाँ ‘inuenire’ केवल भौतिक रूप से पाने के बजाय समझने या पता लगाने के अर्थ में है। ‘भेद जानना’ हिन्दी में उस आशय को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘न्याय’ की अर्थगत व्यापकता को बनाए रखता है।
theological_decisions:
- issue: iudicium का आशय
  choice: न्याय का भेद
  alternative: निर्णय का पता
  rationale: ‘iudicium’ न्याय, निर्णय या न्यायिक योजना का बोध करा सकता है। ‘न्याय का भेद’ अन्वेषण और समझ से परे होने की बात व्यक्त करता है, पर इसे किसी विशिष्ट धर्मवैज्ञानिक व्याख्या तक सीमित नहीं करता।
- issue: अन्य पाठ-परंपराओं में मिलने वाला प्रेम के लक्ष्य/परिणाम वाला वाक्यांश
  choice: मुख्य पाठ में शामिल नहीं किया
  alternative: ‘और उस प्रेम का लक्ष्य भी नहीं जान सकता जिसकी प्रतिज्ञा मैंने अपनी प्रजा से की है’
  rationale: प्रदान किए गए लैटिन स्रोत में यह अतिरिक्त वाक्यांश नहीं है; इसलिए उसे जोड़ना स्रोत से परे विस्तार होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन में ‘तू’ रखा गया है, क्योंकि वक्ता और एज्रा के बीच एकवचन निकट संबोधन है। दिए गए लैटिन का आरंभ ‘me interrogasti?’ से होता है, जो सम्भवतः पिछले वाक्य का खंडित अंतिम भाग है; अंग्रेज़ी परामर्श-पाठ की तरह अनुवादित पद को ‘Et dixit ad me’ से आरंभ किया गया है।
