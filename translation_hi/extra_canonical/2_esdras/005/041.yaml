  text: And I said[a], 'But behold, Lord, you preside over those who are at the end. And what will those do who were before us, or we ourselves, or those who will be after us?'
translation:
  language: hi
  text: और मैंने कहा[a], “पर देखिए, प्रभु, आप उन लोगों पर शासन करते हैं जो अंत में हैं। और जो हमसे पहले थे, या हम स्वयं, या जो हमारे बाद होंगे—वे क्या करेंगे?”
  philosophy: optimal-equivalence
  footnotes:
