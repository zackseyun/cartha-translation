    text: 'या पूर्व अनुवाद में: “प्रभु, आप उन लोगों पर शासन करते हैं जो अंत में हैं; पर जो हमसे पहले थे…”'
    reason: previous_rendering
lexical_decisions:
- source_word: praees
  choice: शासन करते हैं
  rationale: यहाँ praees का अर्थ अधिकारपूर्वक अगुवाई या अध्यक्षता करना है; ‘शासन करते हैं’ आधुनिक हिन्दी में स्वाभाविक है और प्रभु के अधिकार को स्पष्ट रखता है।
- source_word: qui in fine sunt
  choice: जो अन्त में हैं
  rationale: लातीनी पद की अस्पष्टता को बनाए रखा गया है; इसे केवल ‘अन्तिम समय में जीवित लोग’ कहकर सीमित नहीं किया गया।
- source_word: quid facient
  choice: वे क्या करेंगे
  rationale: भविष्यकाल और शाब्दिक प्रश्न को सुरक्षित रखा गया है; ‘उनका क्या होगा’ अधिक स्वाभाविक हो सकता था, पर वह कर्तृवाचक अर्थ को परिणामवाचक बना देता।
- source_word: sed ecce
  choice: पर देखिए
  rationale: sed के विरोधसूचक बल और ecce के ध्यान आकर्षित करने वाले भाव, दोनों को व्यक्त करता है।
theological_decisions:
- issue: ‘अन्त में’ रहने वालों की पहचान
  choice: जो अन्त में हैं
  alternative: जो अन्तिम समय में जीवित हैं
  rationale: मूल पाठ यह निश्चित नहीं करता कि संकेत केवल अन्तिम पीढ़ी, इतिहास के अन्त, या किसी क्रम के अन्त की ओर है; इसलिए व्यापकता बनाए रखी गई।
- issue: प्रभु के अधिकार के लिए praees
  choice: आप उन लोगों पर शासन करते हैं
  alternative: आप उन लोगों की अध्यक्षता करते हैं
  rationale: ‘शासन’ सामान्य पाठक के लिए स्वाभाविक और अधिकारसूचक है, जबकि ‘अध्यक्षता’ इस प्रसंग में अनावश्यक रूप से संस्थागत सुनाई देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी अपनाई गई है। प्रत्यक्ष संबोधन में ‘प्रभु’ और आदरसूचक ‘आप’ रखा गया है। मूल के कुछ असामान्य और अस्पष्ट वाक्यांशों को व्याख्यात्मक विस्तार देकर सरल नहीं किया गया।
