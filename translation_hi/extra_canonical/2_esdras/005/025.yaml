source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus abyssis maris replesti tibi rivum unum, et ex omnibus aedificatis civitatibus sanctificasti tibimet ipsi Sion,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/025.yaml
  text: and from all the depths of the sea you filled for yourself one stream[a], and from all the cities that have been built you sanctified Zion for yourself,
translation:
  language: hi
  text: और समुद्र की सारी गहराइयों में से तूने अपने लिए एक जलधारा भर ली,[a] और बनाए गए सभी नगरों में से तूने अपने लिए सिय्योन को पवित्र ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या पुराने पाठ-विन्यास के अनुसार: “और सृजे गए सभी पक्षियों में से तूने अपने लिए एक कबूतरी को नाम दिया, और रचे गए सभी पशुओं में से तूने अपने लिए एक भेड़ उपलब्ध कराई।”'
    reason: previous_rendering
lexical_decisions:
- source_word: abyssis maris
  choice: समुद्र की सारी गहराइयों
  rationale: लातीनी बहुवचन का सीधा और स्वाभाविक अर्थ; समुद्र की गहरी अथाह जगहों का भाव बनाए रखता है।
- source_word: replesti tibi rivum unum
  choice: तूने अपने लिए एक धारा भर दी
  rationale: replesti के मूल अर्थ ‘भरना’ और rivum unum के ‘एक धारा’ को सुरक्षित रखता है, यद्यपि कथन असामान्य है।
- source_word: aedificatis civitatibus
  choice: बनाए गए सभी नगरों
  rationale: निर्मित/बसाए गए नगरों का व्यापक अर्थ व्यक्त करने वाला सरल आधुनिक रूप।
- source_word: sanctificasti tibimet ipsi Sion
  choice: तूने अपने लिए सिय्योन को पवित्र ठहराया
  rationale: sanctificasti का धार्मिक अर्थ और परमेश्वर के लिए अलग किए जाने का आशय दोनों बनाए रखता है।
theological_decisions:
- issue: सिय्योन का पवित्रीकरण
  choice: पवित्र ठहराया
  alternative: पवित्र किया
  rationale: यह रूप सिय्योन को परमेश्वर के लिए विशिष्ट रूप से चुनकर अलग किए जाने का भाव व्यक्त करता है, बिना किसी संप्रदायगत व्याख्या को जोड़े।
- issue: असामान्य पाठ ‘एक धारा भर दी’
  choice: मूल लातीनी पाठ को मुख्य पाठ में बनाए रखा
  alternative: पक्षियों, कबूतर, पशुओं और भेड़ वाला पूर्ववर्ती पाठ
  rationale: दिया गया मूल स्रोत इसी पद में समुद्र की गहराइयों और धारा का पाठ देता है; वैकल्पिक पाठ पद-संरेखण की पुरानी समस्या से जुड़ा है, इसलिए उसे केवल पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। परमेश्वर को संबोधन में काव्यात्मक ‘तूने’ रखा गया है। मुख्य पाठ में स्रोत की असामान्य लेकिन स्पष्ट शब्दावली को बिना सहज बनाने के नाम पर बदले संरक्षित किया गया है।
