source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'cabis a te creatam creaturam in unum ? si ergo uiuentes uiuent in unum et sustinebit creatura, poterit et nunc portare praesentes in unum. Et dixit ad me : interroga matricem mulieris et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/045.yaml
  text: And I said[a], “How then did you say to your servant that you will surely give life to the creation created by you all at once? If then the living will live all at once and the creation will endure, it can also now bear those who are present all at once.”
translation:
  language: hi
  text: तब मैंने कहा, “फिर तूने अपने सेवक से यह कैसे कहा कि तू अपने द्वारा रची हुई सृष्टि[a] को एक ही समय में अवश्य जीवन देगा? इसलिए, यदि जीवित लोग एक ही समय में जीवित होंगे और सृष्टि बनी रहेगी, तो वह अभी जो उपस्थित हैं उन्हें भी एक साथ धारण कर सकेगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे द्वारा रचा हुआ प्राणी।”
    reason: लातीनी creatura व्याकरणतः एकवचन है, यद्यपि निकटवर्ती ‘जीवित लोग’ और पद के पुनरावर्तन से सामूहिक ‘सृष्टि’ का अर्थ प्रसंगानुकूल है।
lexical_decisions:
- source_word: creatam creaturam
  choice: अपने द्वारा रची गई सारी सृष्टि
  rationale: लातीनी पद में एक ही धातु से बने शब्दों की पुनरुक्ति है; ‘रची गई सृष्टि’ उसे यथासंभव बनाए रखती है। अगले वाक्य के बहुवचन uiuentes से इसका सामूहिक अर्थ स्पष्ट है, इसलिए ‘सारी’ जोड़ा गया है।
- source_word: in unum
  choice: एक ही समय में / एक साथ
  rationale: संदर्भ में एक साथ जीवित किए जाने और उपस्थित लोगों को एक साथ धारण करने का भाव है; दोनों स्वाभाविक हिन्दी अभिव्यक्तियाँ उसी अर्थ को संप्रेषित करती हैं।
- source_word: sustinebit
  choice: इसे सह सकेगी
  rationale: यहाँ सृष्टि कर्ता है और भाव उस सामूहिक जीवन के भार या दशा को सह पाने का है; अनावश्यक रूप से कर्म जोड़ने से बचते हुए मूल तनाव रखा गया है।
- source_word: portare praesentes
  choice: अभी उपस्थित सब लोगों को … धारण कर सकती है
  rationale: portare का मूल भार उठाने या धारण करने का भाव रखा गया है और praesentes को संदर्भानुसार व्यक्तियों के रूप में स्पष्ट किया गया है।
theological_decisions:
- issue: creatura का सामूहिक या एकवचन अर्थ
  choice: सारी सृष्टि
  alternative: रचा गया प्राणी
  rationale: अगले खंड में ‘जीवित लोग’ बहुवचन है और फिर creatura उसी सामूहिक वास्तविकता के लिए आता है; फिर भी शाब्दिक एकवचन की संभावना पादटिप्पणी में सुरक्षित है।
- issue: ईश्वर को संबोधित करने का सर्वनाम
  choice: तू
  alternative: आप
  rationale: आधुनिक हिन्दी बाइबलीय प्रार्थना और प्रत्यक्ष ईश्वरीय संबोधन में ‘तू’ निकटता और गंभीरता दोनों रखता है; इसे अनादरार्थ नहीं समझा जाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सहज रखी गई है। मूल की तर्कात्मक संरचना तथा ‘सहने’ और ‘धारण करने’ के बीच का भेद सुरक्षित रखा गया है।
