  yaml_path: translation/extra_canonical/2_esdras/005/020.yaml
  text: And I fasted for seven days[a], wailing and weeping, as Uriel the angel had commanded me.
translation:
  language: hi
  text: और मैंने सात दिन तक उपवास किया[a], विलाप करता और रोता रहा, जैसा स्वर्गदूत ऊरीएल ने मुझे करने की आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पूर्व के एक अनुवाद में यहाँ लिखा था: “और सात दिन बाद ऐसा हुआ कि मेरे मन के विचार फिर मेरे लिए बहुत दुःखदायी हो गए।” यह वाक्य अगले पद से संबंधित है।'
    reason: पूर्व अनुवाद की सूचना सुरक्षित रखता है, पर उसे इस पद का पाठ-रूप या पाठांतर होने का भ्रामक संकेत नहीं देता।
lexical_decisions:
- source_word: ieiunavi diebus septem
  choice: मैंने सात दिन तक उपवास किया
  rationale: लातीनी वाक्यांश उपवास की सात दिनों की अवधि बताता है; आधुनिक हिन्दी में ‘सात दिन तक’ स्वाभाविक और स्पष्ट है।
- source_word: ululans et plorans
  choice: विलाप करता और रोता रहा
  rationale: दोनों कृदंत शोक की दो निकटवर्ती किन्तु अलग अभिव्यक्तियाँ रखते हैं; ‘विलाप’ और ‘रोना’ इस युग्म को बनाए रखते हैं।
- source_word: Urihel angelus
  choice: स्वर्गदूत ऊरीएल
  rationale: नाम का देवनागरी लिप्यंतरण किया गया है और ‘angelus’ के लिए प्रचलित, सहज धार्मिक पद ‘स्वर्गदूत’ चुना गया है।
- source_word: mandavit mihi
  choice: मुझे आज्ञा दी थी
  rationale: ‘mandavit’ अधिकारपूर्वक निर्देश देने को व्यक्त करता है; पूर्वकालिकता के लिए ‘दी थी’ उपयुक्त है।
