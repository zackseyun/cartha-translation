  text: And she herself will say to you[a], "Different are those born in the strength of youth, and different are those born toward the time of old age, when the womb is failing."
translation:
  language: hi
  text: और वह स्वयं तुमसे कहेगी[a], “जो यौवन की शक्ति में जन्मे हैं, वे भिन्न हैं, और जो बुढ़ापे के समय के निकट, जब गर्भाशय क्षीण हो रहा हो, जन्मे हैं, वे भिन्न हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, पुराने पाठ-विभाजन के अनुसार: “और वह स्वयं तुमसे कहेगी, ‘जो यौवन की शक्ति में जन्मे हैं, वे भिन्न हैं।’”'
    reason: previous_rendering
lexical_decisions:
- source_word: sub tempus senectutis
  choice: बुढ़ापे का समय निकट आने पर
  rationale: ‘sub tempus’ निकट आते समय की ओर संकेत करता है; यह केवल ‘बुढ़ापे के समय’ कहने से अधिक सटीक है।
- source_word: deficiente matrice
  choice: गर्भाशय के क्षीण हो जाने पर
  rationale: यह लैटिन के अपादान-निरपेक्ष वाक्यांश का स्वाभाविक हिन्दी रूप है और जनन-क्षमता घटने का भाव बनाए रखता है।
- source_word: alii ... et alii
  choice: वे अलग हैं ... वे अलग हैं
  rationale: दो समूहों के बीच मूल पाठ के स्पष्ट विरोध को सरल और स्वाभाविक हिन्दी में सुरक्षित रखता है।
