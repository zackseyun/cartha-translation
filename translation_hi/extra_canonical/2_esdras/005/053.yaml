translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘गर्भाशय’ शारीरिक अर्थ को स्पष्ट रखता है, जबकि ‘क्षीण हो जाने’ से मूल के deficiente का भाव अनावश्यक व्याख्या के बिना व्यक्त होता है।
