  naturalness: “के समान ठहराऊँगा” is understandable but is not idiomatic modern Hindi for a comparison. “की तुलना ... से करूँगा” is clear, natural, and suitably formal. “विलंब/जल्दबाज़ी” maintains the rhetorical opposition with more precision than “देरी/जल्दी.”
  terminology: “न्याय” appropriately retains the breadth of iudicium without adding a doctrinal interpretation. “मुकुट” is the primary sense of corona; the lexical alternative is correctly retained in a footnote.
  issues:
  - severity: low
    issue: “बाद वालों” narrows nouissimorum.
    rationale: The Latin can denote “the last/final ones,” and the precise referent should remain open rather than be limited to a temporal sequence of later people.
  - severity: low
    issue: Comparative expression is somewhat unnatural.
    rationale: “मुकुट के समान ठहराऊँगा” is a literalized construction; “मुकुट से तुलना करूँगा” communicates adsimilabo naturally and directly in modern standard Hindi.
