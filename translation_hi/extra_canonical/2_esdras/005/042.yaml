  text: 'me : coronae adsimilabo iudicium meum ; sicut non nouissimorum tarditas, sic nec priorum uelocitas. Et respondi et dixi :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/042.yaml
  text: 'And he said to me[a], ''I will liken my judgment to a crown: as there is no delay for the last, so there is no haste for the first.'''
translation:
  language: hi
  text: 'और उसने मुझसे कहा, “मैं अपने न्याय की तुलना एक मुकुट[a] से करूँगा: जैसे अंतिम लोगों के लिए कोई विलंब नहीं, वैसे ही पहले लोगों के लिए कोई जल्दबाज़ी नहीं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मुकुट” का अर्थ यहाँ “वृत्त” या “वलय” भी समझा जा सकता है; तब यह तुलना पहले और अंतिम लोगों के बीच सममिति पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: coronae
  choice: मुकुट
  rationale: लातीनी शब्द का सामान्य और प्रत्यक्ष अर्थ ‘मुकुट’ है। संदर्भ में गोलाकार रूप के कारण ‘वृत्त’ या ‘वलय’ का भाव भी संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: adsimilabo
  choice: के समान ठहराऊँगा
  rationale: यह भविष्यकालीन क्रिया किसी वस्तु से तुलना या समानता स्थापित करने का भाव देती है; यह हिन्दी में औपचारिक, किंतु सहज है।
- source_word: iudicium meum
  choice: अपने न्याय
  rationale: iudicium यहाँ परमेश्वर के न्याय अथवा न्याय-निर्णय को दर्शाता है; संक्षिप्त ‘न्याय’ मूल की व्यापकता बनाए रखता है।
- source_word: nouissimorum
  choice: बाद वालों
  rationale: शाब्दिक भाव ‘अंतिम लोगों’ का है, पर कालक्रम में पहले और बाद आने वालों के विरोध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘बाद वालों’ चुना गया है।
- source_word: priorum
  choice: पहले वालों
  rationale: यह nouissimorum के विपरीत कालक्रम में पहले आने वालों को सूचित करता है।
- source_word: tarditas / uelocitas
  choice: देरी / जल्दी
  rationale: विपरीत शब्दों की सममिति को साधारण आधुनिक हिन्दी में बनाए रखता है; अधिक शाब्दिक ‘मंदता/तीव्रता’ इस संदर्भ में अस्वाभाविक होती।
theological_decisions:
- issue: न्याय में पहले और बाद वालों का समय-संबंध
  choice: ‘बाद वालों के लिए कोई देरी नहीं’ और ‘पहले वालों के लिए कोई जल्दी नहीं’
  alternative: पहले और अंतिम लोगों को समान समय पर न्याय मिलने की स्पष्ट व्याख्या
  rationale: मूल कथन की मुकुट/वलय-संबंधी उपमा और उसका रहस्यपूर्ण तनाव बनाए रखा गया है; समानता का धर्मवैचारिक निष्कर्ष पाठ में जोड़कर अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। उपलब्ध लातीनी अंश के आरंभ का ‘me’ पिछले खंड से जुड़ा हुआ है और अंत का ‘Et respondi et dixi’ अगले वचन की शुरुआत प्रतीत होता है; इसलिए अंग्रेज़ी परामर्श-पाठ के पद-विभाजन के अनुरूप यहाँ केवल पूर्ण कथन प्रस्तुत किया गया है।
