source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Aut nescis quoniam tibi creditus est Israel in regione trans migrationis eorum? Exsurge ergo et gusta panem alicuius ut non derelinquas nos, sicut pastor gregem suum in manibus luporum malignorum. Et dixi ei: uade a me et non ad me accedas usque ad dies septem et tunc uenies ad me. et audiuit ut dixi et recessit a me. Et ego ieiunaui diebus septem ululans et plorans sicut mihi mandauit Vriel angelus. Et factum est post dies septem et iterum cogitationes cordis mei molestiae erant mihi ualde. Et resumpsit anima mea spiritum intellectus et iterum coepi loqui coram altissimo sermones, Et dixi: dominator domine, ex omni silua terrae et ex omnium arborum eius elegisti uineam unam, Et ex omnium terrarum orbis elegisti tibi foueam unam, et ex omnibus floribus orbis elegisti tibi lilium unum, Et ex omnibus abyssis maris replesti tibi riuum unum, et ex omnibus aedificatis ciuitatibus sanctificasti tibimetipsi Sion, Et ex omnibus creatis uolatilibus nominasti tibi columbam unam, et ex omnibus
    plasmatis pecoribus prouidisti tibi ouem unam, Et ex omnibus multiplicatis populis adquisisti tibi populum unum et ab omnibus probatam legem donasti huic quem desiderasti populo. Et nunc, domine, utquid dedisti unum pluribus et praeparasti unam radicem super alias et disparsisti unicum tuum in multis? Et conculcauerunt qui contradicebant sponsionibus tuis eos qui tuis testamentis credebant. Et si odiens odisti populum tuum, tuis manibus debet castigari.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/017.yaml
  text: Or do you not know that Israel has been entrusted to you in the land of their exile?[a]
translation:
  language: hi
  text: या क्या तुम नहीं जानते कि इस्राएल को उसके निर्वासन की भूमि में तुम्हारे भरोसे सौंपा गया है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पुरानी प्रस्तुतियों में इसके बाद अगले पद के ये शब्द भी इसी पद में रखे गए हैं: “इसलिए उठो और कुछ रोटी खाओ, और हमें ऐसा न छोड़ो जैसे कोई चरवाहा अपने झुंड को दुष्ट भेड़ियों के हाथों छोड़ दे।”'
    reason: पूर्व पद-विभाजन में अगले पद का वाक्य 5:17 के साथ जोड़ा गया था; संशोधित पाठ Latin वाक्य की सीमा पर समाप्त होता है।
lexical_decisions:
- source_word: tibi creditus est
  choice: तुम्हारे भरोसे सौंपा गया है
  rationale: यह पदबंध दायित्व और संरक्षण के लिए किसी को सौंपे जाने का भाव व्यक्त करता है; हिन्दी में यह स्वाभाविक रूप से उस न्यासगत जिम्मेदारी को बनाए रखता है।
- source_word: in regione trans migrationis eorum
  choice: उनके निर्वासन के देश में
  rationale: संदर्भ इस्राएल के अपने देश से विस्थापन का है। ‘निर्वासन’ आधुनिक पाठक के लिए स्पष्ट है और ‘देश’ Latin regio का सहज समतुल्य है।
theological_decisions:
- issue: इस्राएल किसके भरोसे सौंपा गया है
  choice: Latin के एकवचन संबोधन को ‘तुम्हारे’ के रूप में यथावत रखा गया
  alternative: संबोधित व्यक्ति की पहचान स्पष्ट करके उसका नाम जोड़ना
  rationale: इस पद में संबोधित व्यक्ति का नाम नहीं है; उसे जोड़ने से स्रोत की अपेक्षा अधिक व्याख्या आ जाती।
- issue: trans migrationis का अर्थ
  choice: निर्वासन
  alternative: देश-निकाला या प्रवास
  rationale: संदर्भ में यह केवल स्वैच्छिक प्रवास नहीं, बल्कि अपने देश से विस्थापन है; फिर भी पद में उसके ऐतिहासिक स्वरूप को और अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रश्नवाचक और गरिमापूर्ण शैली। ‘तुम’ का प्रयोग Latin के एकवचन अनौपचारिक संबोधन के अनुरूप है।
