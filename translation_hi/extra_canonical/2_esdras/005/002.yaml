  text: And unrighteousness will be multiplied beyond what you yourself see, and beyond what you heard long ago.
translation:
  language: hi
  text: और अधर्म उस से भी बहुत बढ़ जाएगा जो तू स्वयं देखता है, और उस से भी जो तूने बहुत पहले सुना था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniustitia
  choice: अधर्म
  rationale: यहाँ नैतिक और सामाजिक अन्याय की व्यापक धारणा है; ‘अधर्म’ भविष्यसूचक संदर्भ में स्वाभाविक और व्यापक हिन्दी पद है।
- source_word: multiplicabitur
  choice: बढ़ जाएगा
  rationale: लैटिन का शाब्दिक अर्थ ‘बहुगुणित होगा’ है, पर बुराई की मात्रा बढ़ने के लिए आधुनिक हिन्दी में ‘बढ़ जाएगा’ अधिक स्वाभाविक है।
- source_word: super hanc ... et super quam
  choice: उस सीमा से भी ... और ...
  rationale: दोनों बार प्रयुक्त super तुलना और अतिक्रमण का भाव देता है; हिन्दी में ‘उस सीमा से भी’ इस अर्थ को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: ipse tu vides
  choice: तू स्वयं देखता है
  rationale: ipse और tu के बलाघात को ‘स्वयं’ से सुरक्षित रखा गया है।
- source_word: audisti olim
  choice: तूने बहुत पहले सुना था
  rationale: olim के अनिश्चित बीते समय को ‘बहुत पहले’ व्यक्त करता है, बिना किसी विशिष्ट काल का संकेत जोड़े।
