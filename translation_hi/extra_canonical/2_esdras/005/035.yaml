source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixit ad me: non potes. et dixi: quare, domine, aut quidnascebar, aut quare non fiebat matrix matris meae mihi sepulchrum, ut non viderem laborem Iacob et defatigationem generis Israhel?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/035.yaml
  text: And he said to me[a], 'You cannot.' And I said, 'Why, Lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see the trouble of Jacob and the weariness of the stock of Israel?'
translation:
  language: hi
  text: और उसने मुझसे कहा, “तुम ऐसा नहीं कर सकते।” तब मैंने कहा, “क्यों, प्रभु? या मेरा जन्म ही क्यों हुआ? मेरी माता का गर्भ मेरे लिए कब्र क्यों न बन गया, ताकि मैं याकूब का दुःख और इस्राएल के वंश की थकान न देखता?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non potes
  choice: तुम ऐसा नहीं कर सकते
  rationale: संदर्भगत कर्म को हिन्दी में ‘ऐसा’ से स्पष्ट किया गया है, जबकि असमर्थता का सीधा अर्थ सुरक्षित है।
- source_word: matrix matris meae
  choice: मेरी माता का गर्भ
  rationale: लैटिन पदबंध का स्वाभाविक और सटीक आधुनिक हिन्दी रूप।
- source_word: labor Iacob
  choice: याकूब का दुःख
  rationale: labor यहाँ केवल शारीरिक परिश्रम नहीं, बल्कि समुदाय के कष्ट और संकट को व्यक्त करता है।
- source_word: defatigationem generis Israhel
  choice: इस्राएल के वंश की थकावट
  rationale: defatigatio की थकान/क्लांति की छवि और generis का वंशगत-सामुदायिक अर्थ दोनों बनाए रखे गए हैं।
theological_decisions:
- issue: वक्ता द्वारा अपने जन्म पर विलाप
  choice: प्रश्नों और तीव्र विलाप को बिना नरम किए रखा गया
  alternative: इसे केवल ‘काश मैं जन्मा न होता’ के रूप में संक्षिप्त करना
  rationale: मूल पाठ जन्म, मातृगर्भ और कब्र की सशक्त छवियों के माध्यम से धर्मवैचारिक तनाव को खुला रखता है।
- issue: याकूब और इस्राएल का संबंध
  choice: दोनों नामों को मूल के अनुसार अलग-अलग रखा गया
  alternative: दोनों को केवल ‘इस्राएल’ या ‘इस्राएली लोगों’ में मिला देना
  rationale: मूल की समानांतर अभिव्यक्ति और सामुदायिक काव्यात्मक बल सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कब्र’ सीधा और प्रचलित शब्द है; प्रश्नात्मक क्रम तथा विलाप की तीव्रता मूल के निकट रखी गई है।
