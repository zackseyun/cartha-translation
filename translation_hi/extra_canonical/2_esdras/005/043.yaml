  text: nec enim poteras facere qui facti sunt et qui sunt et qui futuri sunt in unum, ut celerius iudicium tuum ostendas ? Et re-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/043.yaml
  text: And I answered and said[a], 'For could you not make those who have been made, and those who are, and those who will be, all at once, so that you might show your judgment more quickly?'
translation:
  language: hi
  text: आखिर क्या आप उन सबको—जो बनाए जा चुके हैं, जो अभी हैं, और जो भविष्य में होंगे—एक ही साथ नहीं बना सकते थे, ताकि आप अपना न्याय अधिक शीघ्र प्रकट कर सकें?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या आप उन सबको ... एक ही साथ नहीं बना सकते थे?”
    reason: ‘आखिर’ लैटिन ‘enim’ के व्याख्यात्मक/तार्किक बल को दर्शाता है; वैकल्पिक रूप में प्रश्न को इस स्पष्ट संयोजक के बिना प्रस्तुत किया गया है।
lexical_decisions:
- source_word: nec enim poteras facere
  choice: क्योंकि क्या आप ... नहीं बना सकते थे
  rationale: ‘enim’ के कारण explanatory connective ‘क्योंकि’ रखा गया है; imperfect ‘poteras’ को भूतकालीन सामर्थ्य के प्रश्न के रूप में व्यक्त किया गया है।
- source_word: qui facti sunt et qui sunt et qui futuri sunt
  choice: जो बनाए जा चुके हैं, जो अभी हैं और जो भविष्य में होंगे
  rationale: तीनों कालगत समूहों का क्रम और भेद सुरक्षित रखा गया है; ‘अभी’ वर्तमान समूह को सहज हिन्दी में स्पष्ट करता है।
- source_word: in unum
  choice: एक ही साथ
  rationale: यहाँ आशय सभी को एक साथ अस्तित्व में लाने से है; यह स्वाभाविक हिन्दी है और लैटिन की सामूहिकता बनाए रखती है।
- source_word: ut celerius iudicium tuum ostendas
  choice: ताकि आप अपना न्याय और जल्दी प्रकट करते
  rationale: उद्देश्यवाचक संबंध, तुलनात्मक ‘celerius’ और न्याय को प्रकट करने की छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: परमेश्वर की सृजन-सामर्थ्य से जुड़ा प्रतिप्रश्न
  choice: क्या आप ... नहीं बना सकते थे
  alternative: क्या आप ... नहीं बना सकते
  rationale: लैटिन imperfect ‘poteras’ अतीत में सभी को एक साथ बनाने की संभावना पर प्रश्न करता है; अनुवाद इसे कथन बनाकर या प्रश्न को हल करके धर्मवैचारिक निष्कर्ष नहीं थोपता।
- issue: ‘न्याय’ का अर्थ
  choice: अपना न्याय ... प्रकट करते
  alternative: अपना दंडादेश ... दिखाते
  rationale: ‘iudicium’ व्यापक रूप से न्याय, न्यायिक निर्णय या न्याय-कार्य को सूचित कर सकता है; ‘न्याय’ इस अर्थ-विस्तार और धर्मवैचारिक तनाव को अधिक सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आदरसूचक ‘आप’ रखा गया है। डैशों से तीन कालगत समूह स्पष्ट किए गए हैं, जबकि प्रश्न की चुनौतीपूर्ण और अनुमानात्मक प्रकृति सुरक्षित है।
