  text: And I said, 'Lord, Master, who indeed can know these things, except one who does not dwell among men?'
translation:
  language: hi
  text: देख सकूँ। और मैंने कहा, “हे प्रभु, हे स्वामी, भला इन बातों को कौन जान सकता है, सिवाय उसके जो मनुष्यों के बीच निवास नहीं करता?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: हे प्रभु, हे स्वामी
  rationale: दोनों संबोधनों को अलग-अलग बनाए रखा गया है; यह स्वाभाविक हिन्दी में प्रभुता और अधिकार—दोनों का भाव व्यक्त करता है।
- source_word: quis enim
  choice: भला ... कौन
  rationale: लैटिन के enim से आने वाले बल और प्रश्न की वक्तृता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: haec scire
  choice: इन बातों को ... जान सकता है
  rationale: haec का प्रसंगगत बहुवचन ‘इन बातों’ और potest ... scire की सामर्थ्य ‘जान सकता है’ से सुरक्षित रहती है।
- source_word: cum hominibus habitationem non habet
  choice: मनुष्यों के बीच निवास नहीं करता
  rationale: शाब्दिक ‘मनुष्यों के साथ निवास नहीं रखता’ की अपेक्षा यह स्वाभाविक है और मानव-समाज से बाहर रहने का मूल भाव बनाए रखता है।
theological_decisions:
- issue: ‘मनुष्यों के बीच निवास न करने वाले’ की पहचान
  choice: सिवाय उसके जो मनुष्यों के बीच निवास नहीं करता
  alternative: सिवाय परमेश्वर के
  rationale: स्रोत व्यक्ति की स्पष्ट पहचान नहीं करता; इसलिए संभावित दैवी संकेत को व्याख्यात्मक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज शैली। दोहरे संबोधन और मूल के अलंकारिक प्रश्न को सुरक्षित रखा गया है।
