  yaml_path: translation/extra_canonical/2_esdras/005/022.yaml
  text: And my soul recovered the spirit of understanding[a], and again I began to speak before the Most High.
translation:
  language: hi
  text: और मेरी आत्मा ने समझने की शक्ति फिर पा ली, और मैं फिर परमप्रधान के सामने बोलने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: resumpsit
  choice: फिर पा ली
  rationale: यह क्रिया किसी खोई या क्षीण हुई अवस्था को पुनः प्राप्त करने का भाव देती है; सहज हिन्दी में यही अर्थ स्पष्ट होता है।
- source_word: anima mea
  choice: मेरी आत्मा
  rationale: लातीनी पद का सीधा और गरिमापूर्ण अनुवाद, जो व्यक्ति के भीतरी जीवन को व्यक्त करता है।
- source_word: spiritum intellectus
  choice: समझ की चेतना
  rationale: शाब्दिक 'समझ की आत्मा' हिन्दी में भ्रामक हो सकता है। 'चेतना' यहाँ मानसिक सामर्थ्य/सुध-बुध का भाव रखता है, जबकि मूल की संरचना और संभावित अस्पष्टता को काफी हद तक बचाता है।
- source_word: coram Altissimo
  choice: परमप्रधान के सामने
  rationale: coram का अर्थ उपस्थिति में/सामने और Altissimus का पारंपरिक, अर्थ-सटीक रूप 'परमप्रधान' है।
- source_word: sermones
  choice: बोलने
  rationale: coepi loqui sermones का हिन्दी में स्वाभाविक रूप 'बोलने लगा' है; अलग से 'बातें/वचन' जोड़ना अनावश्यक और भारी होगा।
theological_decisions:
- issue: spiritum intellectus का स्वरूप
  choice: समझ की चेतना
  alternative: समझ की आत्मा / समझने की शक्ति
  rationale: मूल यह स्पष्ट नहीं करता कि यह स्वतंत्र दिव्य आत्मा है या एज्रा की लौटी हुई मानसिक क्षमता। चयन किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को थोपे बिना सुध-बुध लौटने का संदर्भगत भाव देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। मूल की पुनःस्थापना और फिर से बोलना आरम्भ करने की क्रमिकता सुरक्षित है।
