source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus multiplicatis populis adquisisti tibi populum unum, et ab omnibus probatam legem donasti huic quem desiderasti populo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/027.yaml
  text: and from all the multiplied peoples you acquired for yourself one people[a], and to this people whom you desired you gave the law approved by all.
translation:
  language: hi
  text: और उन सभी जातियों में से, जिनकी संख्या बढ़ गई थी, तूने अपने लिए एक प्रजा को अपना लिया; और इसी प्रजा को, जिसे तूने चाहा, तूने वह व्यवस्था दी जो सबके द्वारा मान्य ठहराई गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicatis populis
  choice: उन सभी जातियों में से, जिनकी संख्या बढ़ गई थी
  rationale: लातीनी कृदंत का अर्थ सुरक्षित रखते हुए ‘बहुगुणित जातियाँ’ जैसे अस्वाभाविक शाब्दिक रूप से बचा गया है।
- source_word: adquisisti tibi populum unum
  choice: तूने अपने लिए एक प्रजा को अपना बनाया
  rationale: adquisisti का संबंधपरक अर्थ ‘अपने अधिकार में लेना/अपना बनाना’ स्वाभाविक हिन्दी में व्यक्त होता है और ‘एक प्रजा’ के विरोधाभास को बनाए रखता है।
- source_word: quem desiderasti populo
  choice: जिस प्रजा को तूने चाहा
  rationale: desiderasti की सीधी इच्छा/अभिलाषा की भाषा को बिना ‘चुना’ जैसे व्याख्यात्मक शब्द में बदलें सुरक्षित रखा गया है।
- source_word: ab omnibus probatam legem
  choice: वह व्यवस्था दी जिसे सबने मान्य ठहराया था
  rationale: probatam को ‘मान्य ठहराया’ और ab omnibus को व्यक्तिगत कर्ता ‘सबने’ के रूप में प्रस्तुत किया गया है; इससे स्रोत का आशय स्पष्ट और स्वाभाविक हिन्दी में आता है।
theological_decisions:
- issue: एक प्रजा और अनेक जातियों के बीच संबंध
  choice: ‘एक प्रजा’ को स्पष्ट रूप से बनाए रखा गया
  alternative: ‘अपनी चुनी हुई प्रजा’
  rationale: स्रोत ‘एक’ कहता है, ‘चुनी हुई’ नहीं; अतिरिक्त चुनाव-संबंधी धर्मवैज्ञानिक शब्दावली नहीं जोड़ी गई।
- issue: व्यवस्था की सार्वभौमिक मान्यता
  choice: ‘जिसे सबने मान्य ठहराया था’
  alternative: ‘जो सबके द्वारा खरी पाई गई थी’
  rationale: लातीनी probatam में परखे जाने और अनुमोदित होने दोनों की छाया हो सकती है; प्रसंग और परामर्श-पाठ के अनुसार अनुमोदन का अर्थ मुख्य पाठ में रखा गया, बिना यह समझाए कि ‘सब’ किन्हें सूचित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को संबोधन में निकटवाची एकवचन ‘तू’ रखा गया है। अंग्रेज़ी परामर्श-पाठ की पुरानी [a] टिप्पणी अगले पद के पाठ से संबंधित और इस लातीनी स्रोत से असंगत है, इसलिए उसे सम्मिलित नहीं किया गया।
