id: 2ES.5.4
reference: 2 Esdras 5:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem tibi dederit Altissimus vivere, et videbis post tertiam turbatam, et relucescet subito sol noctu et luna interdie.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/004.yaml
  text: But if the Most High grants that you live[a], you will see after the third disturbance that the sun will suddenly shine at night, and the moon by day.
translation:
  language: hi
  text: पर यदि परमप्रधान तुम्हें जीवित रहने दे, तो तीसरी उथल-पुथल[a] के बाद तुम देखोगे कि रात में अचानक सूर्य चमक उठेगा और दिन में चंद्रमा चमकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अन्य प्राचीन अनुवादों में ‘तीसरी तुरही के बाद’ है; यहाँ लैटिन पाठ कठिन और संभवतः दूषित है।
    reason: लैटिन turbatam ‘उथल-पुथल’ की ओर संकेत करता है, जबकि प्राचीन पुत्री-परंपराएँ ‘तुरही’ पढ़ती हैं; महत्वपूर्ण पाठांतर को सुरक्षित रखना आवश्यक है।
lexical_decisions:
- source_word: Altissimus
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त लैटिन उपाधि का प्रचलित, गरिमापूर्ण और अर्थ-सटीक हिन्दी रूप है।
- source_word: dederit ... vivere
  choice: तुम्हें जीवित रहने दे
  rationale: शाब्दिक अर्थ ‘जीने को दे’ है; चुना गया रूप स्वाभाविक हिन्दी में जीवन जारी रहने की अनुमति या अनुग्रह का भाव बनाए रखता है।
- source_word: post tertiam turbatam
  choice: तीसरी उथल-पुथल के बाद
  rationale: उपलब्ध लैटिन पाठ में turbatam है, जो व्यवधान या उथल-पुथल की ओर संकेत करता है, यद्यपि वाक्यांश व्याकरणतः कठिन है। पाठांतर ‘तुरही’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: relucescet subito
  choice: अचानक ... चमक उठेगा
  rationale: relucescet में प्रकाश के प्रकट या फिर से चमकने और subito में आकस्मिकता का भाव है; ‘चमक उठेगा’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: sol noctu et luna interdie
  choice: रात में ... सूर्य ... और दिन में चंद्रमा
  rationale: मूल के उलटे प्राकृतिक क्रम को स्पष्ट और संक्षिप्त हिन्दी में ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: अपोकैलिप्टिक संकेत में ‘उथल-पुथल’ बनाम ‘तुरही’
  choice: मुख्य पाठ में ‘उथल-पुथल’
  alternative: ‘तीसरी तुरही के बाद’
  rationale: दिए गए लैटिन स्रोत में turbatam पढ़ा जाता है, इसलिए मुख्य अनुवाद उसी प्रत्यक्ष साक्ष्य का अनुसरण करता है। अन्य प्राचीन भाषाई साक्ष्य ‘तुरही’ का समर्थन करते हैं; पाठगत तनाव को पादटिप्पणी में स्पष्ट किया गया है, न कि चुपचाप सुलझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य विन्यास सहज, किंतु भविष्यवाणी की गरिमा और विचित्र ब्रह्मांडीय चित्रण बनाए रखा गया है। ‘परमप्रधान’ और ‘चंद्रमा’ औपचारिक पर सामान्य पाठकों के लिए सुबोध हैं।
