  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: reuirida mihi aridos flores, Et aperi mihi clausa prumptuaria et produc mihi inclusos in eis flatos, aut monstra mihi uocis imaginem, et tunc ostendam tibi eum laborem quem rogas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/037.yaml
  text: Restore to me the dried flowers[a], and open for me the storehouses that are shut, and bring out for me the winds enclosed in them, or show me the image of a voice; then I will show you that labor which you ask.
translation:
  language: hi
  text: मेरे लिए सूखे फूलों को फिर हरे-भरे कर दो, और मेरे लिए बंद भंडार-घर खोल दो और उनमें बंद हवाओं को बाहर निकाल लाओ, या मुझे आवाज़ का रूप दिखा दो; तब मैं तुम्हें वह कष्ट दिखाऊँगा जिसके बारे में तुम पूछ रहे हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuirida mihi aridos flores
  choice: मेरे लिए सूखे फूलों को फिर से हरा-भरा कर दो
  rationale: लैटिन क्रिया का भाव केवल लौटाने का नहीं, सूखे फूलों को फिर से हरा या जीवित कर देने का है।
- source_word: prumptuaria
  choice: भंडार
  rationale: यह बंद रखे जाने वाले भंडारगृहों या कोठारों का संकेत देता है; सामान्य हिन्दी में ‘भंडार’ सहज और पर्याप्त स्पष्ट है।
- source_word: flatos
  choice: हवाओं
  rationale: शब्द का शाब्दिक अर्थ फूँक, श्वास या वायु-प्रवाह हो सकता है; इस ब्रह्मांड-संबंधी चित्र में बंद भंडारों से निकाली जाने वाली ‘हवाएँ’ सर्वाधिक स्वाभाविक है।
- source_word: uocis imaginem
  choice: आवाज़ का रूप
  rationale: ‘रूप’ लैटिन imago की दृश्य असंभवता और वाक्य की पहेली-जैसी प्रकृति को बनाए रखता है, बिना अर्थ को अनावश्यक रूप से समझाए।
- source_word: eum laborem
  choice: वह कष्ट
  rationale: यह 5:35 के ‘याकूब के कष्ट’ की ओर संकेत करता है; यहाँ labor का आशय काम या मेहनत से अधिक दुःख-संकट है, और eum का संकेतवाचक बल ‘वह’ से सुरक्षित रहता है।
theological_decisions:
- issue: laborem को कार्य, परिश्रम या क्लेश के रूप में समझना
  choice: कष्ट
  alternative: परिश्रम
  rationale: निकट संदर्भ में यह याकूब के दुःख या संकट का अनाफोरिक उल्लेख है। फिर भी मूल शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। असंभव कार्यों की समानांतर आज्ञाओं को बनाए रखा गया है और ‘आवाज़ का रूप’ जैसी मूल की जानबूझकर रहस्यमय अभिव्यक्ति को सरल करके समाप्त नहीं किया गया।
