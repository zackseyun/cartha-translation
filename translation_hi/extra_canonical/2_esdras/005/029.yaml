source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et conculcaverunt qui contradicebant sponsionibus tuis quique tuis testamentis credebant.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/029.yaml
  text: And those who opposed your promises have trampled those who believed your covenants[a].
translation:
  language: hi
  text: और जो तेरी प्रतिज्ञाओं का विरोध करते थे, उन्होंने तेरी वाचाओं पर विश्वास करने वालों को रौंद डाला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहले के एक अनुवाद में भूल से अगले पद के ये शब्द आ गए थे: “और यदि तूने अपने लोगों से बैर रखकर उनसे घृणा की, तो उन्हें तेरे ही हाथों से दण्ड मिलना चाहिए था।”'
    reason: यह स्पष्ट करता है कि उद्धृत शब्द वैकल्पिक पाठ नहीं, बल्कि पहले के अनुवाद में अगले पद का एक-पद विस्थापन हैं।
lexical_decisions:
- source_word: conculcaverunt
  choice: रौंद डाला
  rationale: यह क्रिया पैरों तले कुचलने या बुरी तरह दबाने का सशक्त बिंब व्यक्त करती है; ‘रौंद डाला’ आधुनिक हिन्दी में स्वाभाविक और मूल के बल के अनुरूप है।
- source_word: sponsionibus tuis
  choice: तेरी प्रतिज्ञाओं
  rationale: sponsio यहाँ परमेश्वर की दी हुई प्रतिज्ञा को सूचित करता है; ‘प्रतिज्ञा’ धार्मिक अर्थ को संप्रदायगत विस्तार दिए बिना स्पष्ट रखती है।
- source_word: testamentis tuis
  choice: तेरी वाचाओं
  rationale: testamentum का यहाँ अर्थ वसीयतनामा नहीं, बल्कि परमेश्वर की बाँधी हुई वाचा है; इसलिए ‘वाचा’ उपयुक्त बाइबलीय शब्द है।
- source_word: credebant
  choice: विश्वास करने वालों
  rationale: यह अपूर्णकालीन रूप निरंतर या स्थापित विश्वास को व्यक्त करता है; हिन्दी का कृदन्तीय वाक्यांश इस आशय को स्वाभाविक रूप से देता है।
theological_decisions:
- issue: रौंदने वाले और रौंदे गए समूहों की पहचान
  choice: प्रतिज्ञाओं का विरोध करने वालों को कर्ता और वाचाओं पर विश्वास करने वालों को कर्म के रूप में प्रस्तुत किया गया है।
  alternative: दोनों qui-खंडों को समान कर्ता मानना और रौंदे गए कर्म को अनिर्दिष्ट छोड़ना।
  rationale: साफ किए गए लैटिन में दूसरे qui-खंड की कारकीय भूमिका सतही रूप से अस्पष्ट है, पर पद का उपलब्ध पाठ-साक्ष्य और संदर्भ विरोधियों द्वारा विश्वासियों को रौंदे जाने का अर्थ समर्थित करते हैं; यही अंग्रेज़ी परामर्श-पाठ में भी है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। प्रार्थना-संबोधन के अनुरूप ‘तेरी/तेरे’ रखा गया है। वाक्य में विरोधी और विश्वासी समूहों का अंतर साफ है, जबकि पादटिप्पणी पुराने विस्थापित पाठ का इतिहास बताती है।
