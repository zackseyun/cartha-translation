translation:
  language: hi
  text: तब मैं जाग उठा, और मेरा शरीर बहुत काँप उठा, और मेरी आत्मा
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: euigilaui
  choice: मैं जाग उठा
  rationale: लातीनी क्रिया का स्वाभाविक और प्रसंगानुकूल हिन्दी रूप; इसमें नींद से जागने की पूर्ण हुई क्रिया व्यक्त होती है।
- source_word: corpus meum
  choice: मेरा शरीर
  rationale: मूल के शारीरिक संकेत को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: horruit ualde
  choice: बहुत काँप उठा
  rationale: horruit भय अथवा तीव्र अनुभूति से शरीर के काँपने या सिहर उठने को व्यक्त कर सकता है; यहाँ सहज हिन्दी में तीव्र शारीरिक प्रतिक्रिया रखी गई है।
- source_word: anima mea
  choice: मेरी आत्मा
  rationale: anima का सीधा, गरिमापूर्ण समतुल्य; स्रोत का अधूरा वाक्यांश भी यथावत रखा गया है।
theological_decisions:
- issue: anima का अर्थ-क्षेत्र
  choice: आत्मा
  alternative: प्राण / मन
  rationale: ‘आत्मा’ corpus के साथ मूल में उपस्थित शरीर–आत्मा भेद को बनाए रखता है, बिना आगे के लुप्त पाठ के आधार पर अर्थ पूरा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भाषा अपनाई गई है। स्रोत स्वयं ‘और मेरी आत्मा’ पर अधूरा समाप्त होता है; इसलिए अनुवाद ने वाक्य को अनुमान से पूरा नहीं किया।
