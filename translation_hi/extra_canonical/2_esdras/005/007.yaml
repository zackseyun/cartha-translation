  text: nem facient. Et mare Sodomiticum pisces reiciet, et dabit uocem noctu, quam non nouerunt multi, omnes autem audient
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/007.yaml
  text: And the Sea of Sodom will cast out fish[a], and by night it will utter a sound that many have not known[b], but all will hear it.
translation:
  language: hi
  text: और सदोम का समुद्र मछलियाँ बाहर फेंक देगा[a], और रात में ऐसी आवाज़ निकालेगा जिसे बहुतों ने पहले कभी नहीं सुना है[b], पर सब उसे सुनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सदोम का समुद्र’ संभवतः मृत सागर को दर्शाता है; अनुवाद में बाद का प्रचलित नाम रखने के बजाय लातीनी पाठ का संकेतात्मक नाम बनाए रखा गया है।
    reason: cultural_note
  - marker: b
    text: 'अधिक शाब्दिक रूप में: ‘और सदोम का समुद्र मछलियाँ बाहर फेंक देगा और रात में एक आवाज़ देगा, जिसे बहुतों ने नहीं जाना है, पर सब उसे सुनेंगे।’'
    reason: translation_note
lexical_decisions:
- source_word: mare Sodomiticum
  choice: सदोम का समुद्र
  rationale: लातीनी विशेषण का भौगोलिक आशय स्वाभाविक हिन्दी में व्यक्त होता है और सदोम से जुड़े संकेत को बनाए रखता है; इसे सीधे ‘मृत सागर’ कर देने से मूल का संकेतात्मक रूप मिट जाता।
- source_word: pisces reiciet
  choice: मछलियाँ बाहर फेंक देगा
  rationale: reiciet के बलपूर्ण निष्कासन के भाव को रखा गया है; केवल ‘निकालेगा’ उस चित्र को कमजोर कर देता।
- source_word: dabit vocem
  choice: आवाज़ निकालेगा
  rationale: शाब्दिक ‘आवाज़ देगा’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि समुद्र द्वारा रहस्यमय ध्वनि किए जाने का अर्थ सुरक्षित रहता है।
- source_word: quam non nouerunt multi
  choice: जिसे बहुतों ने पहले कभी नहीं सुना है
  rationale: ध्वनि के प्रसंग में nouerunt का अनुभवजन्य अर्थ स्वाभाविक हिन्दी में ‘पहले कभी नहीं सुना’ से स्पष्ट होता है; पूर्णकाल का पूर्व-अनुभव भी बना रहता है।
- source_word: omnes autem audient
  choice: पर सब उसे सुनेंगे
  rationale: विरोधसूचक autem और भविष्यकाल audient दोनों को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
