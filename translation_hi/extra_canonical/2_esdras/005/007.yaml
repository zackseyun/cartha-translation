translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समुद्र को कर्ता मानने वाली मूल की सजीव कल्पना सुरक्षित है। nouerunt की शाब्दिक अस्पष्टता को मुख्य पाठ में ध्वनि के प्रसंगानुकूल रूप दिया गया है और अधिक शाब्दिक संभावना पादटिप्पणी में संरक्षित है।
