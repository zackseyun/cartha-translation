source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quaeretur a multis et non invenietur, et multiplicabitur iniustitia et incontinentia super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/010.yaml
  text: And it will be sought by many and will not be found, and unrighteousness and lack of self-control will be multiplied on the earth.
translation:
  language: hi
  text: और बहुत-से लोग उसे खोजेंगे, पर वह नहीं मिलेगा; और पृथ्वी पर अधर्म और असंयम बढ़ता जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaeretur
  choice: उसे खोजेंगे
  rationale: लैटिन का कर्मवाच्य शाब्दिक रूप से ‘खोजा जाएगा’ है; आधुनिक हिन्दी में अनिर्दिष्ट बहुवचन कर्ता के साथ यह अधिक स्वाभाविक है और अगले ‘बहुत-से लोगों’ से मेल खाता है। मूल में खोजी जाने वाली वस्तु अनुक्त है, इसलिए ‘उसे’ से उस संदर्भगत अस्पष्टता को बनाए रखा गया है।
- source_word: iniustitia
  choice: अधर्म
  rationale: यहाँ नैतिक अन्याय/दुष्टता के व्यापक अर्थ को व्यक्त करता है और धार्मिक साहित्य की गरिमा भी बनाए रखता है।
- source_word: incontinentia
  choice: असंयम
  rationale: आत्म-संयम के अभाव का व्यापक अर्थ सुरक्षित रहता है; इसे किसी एक विशेष प्रकार की अनैतिकता तक सीमित नहीं किया गया।
- source_word: multiplicabitur
  choice: बढ़ता जाएगा
  rationale: भविष्य में निरंतर वृद्धि का स्वाभाविक हिन्दी रूप; एकवचन क्रिया संयुक्त अमूर्त विषयों को सामूहिक रूप से ग्रहण करती है।
- source_word: super terram
  choice: पृथ्वी पर
  rationale: स्थानसूचक अर्थ का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: खोजी जाने वाली वस्तु की पहचान
  choice: ‘उसे’ कहकर संदर्भगत लेकिन अनिर्दिष्ट रखा गया
  alternative: किसी विशिष्ट वस्तु, जैसे सत्य या शांति, का नाम जोड़ना
  rationale: इस पद के लैटिन पाठ में कर्म स्पष्ट नहीं है; उसे निश्चित करना मूल की वास्तविक अस्पष्टता को अनुचित रूप से हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘बहुत-से’ और ‘पर’ प्रवाह को स्वाभाविक रखते हैं; ‘अधर्म’ तथा ‘असंयम’ मूल के दो अलग नैतिक पदों को अलग बनाए रखते हैं।
