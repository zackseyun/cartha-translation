  source_fidelity: लैटिन पाठ के कर्मवाच्य भाव—‘बहुतों के द्वारा खोजा जाएगा, पर नहीं पाया जाएगा’—को हिन्दी ने स्वाभाविक सक्रिय विन्यास में बिना अर्थ-हानि के रखा है। ‘उसे’ पूर्वसंदर्भित किंतु इस पद में अनुक्त कर्म को उचित रूप से बनाए रखता है। ‘अधर्म’ iniustitia और ‘असंयम’ incontinentia के भिन्न नैतिक अर्थ-क्षेत्रों को पर्याप्त रूप से दर्शाते हैं; ‘पृथ्वी पर’ super terram का सीधा समतुल्य है।
  naturalness: पाठ आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण है। ‘बहुत-से लोग उसे खोजेंगे, पर वह नहीं मिलेगा’ स्पष्ट तथा प्रवाहपूर्ण है। ‘अधर्म और असंयम बढ़ता जाएगा’ संयुक्त अमूर्त विषय को समष्टि के रूप में लेकर प्रयुक्त स्वाभाविक हिन्दी है।
  terminology: ‘अधर्म’ धार्मिक-साहित्यिक रजिस्टर में iniustitia के व्यापक नैतिक अर्थ के लिए उपयुक्त है और उसे केवल कानूनी ‘अन्याय’ तक सीमित नहीं करता। ‘असंयम’ incontinentia के आत्म-नियंत्रण के अभाव वाले व्यापक अर्थ को सुरक्षित रखता है।
