- source_word: minores statu
  choice: कद में छोटे
  rationale: यहाँ status का रूप statu शारीरिक डील-कद या आकार के अर्थ में है; ‘पद’ या ‘स्थिति’ कहना संदर्भ को अनुचित रूप से बदल देगा।
- source_word: prae his qui ante vos
  choice: अपने से पहले के लोगों की तुलना में
  rationale: तुलनात्मक संबंध तथा पूर्ववर्ती पीढ़ियों का संकेत सहज आधुनिक हिन्दी में व्यक्त होता है।
