lexical_decisions:
- source_word: Considera
  choice: विचार करो
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; संदर्भ में ध्यान देकर निष्कर्ष समझने का भाव रखता है।
- source_word: et tu
  choice: तुम भी
