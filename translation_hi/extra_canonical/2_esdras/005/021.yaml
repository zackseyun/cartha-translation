  text: And it happened after seven days that the thoughts of my heart were again very grievous to me[a].
translation:
  language: hi
  text: और सात दिन के बाद ऐसा हुआ कि मेरे हृदय के विचार फिर मेरे लिए बहुत पीड़ादायक थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने पाठ-रूप में यहाँ है: “और मेरी आत्मा ने फिर समझ की आत्मा को ग्रहण किया, और मैं फिर परमप्रधान के सामने वचन कहने लगा।” यह वर्तमान पाठ में अगले पद से मेल खाता है।'
    reason: पूर्व प्रचलित पाठांतर को सुरक्षित रखते हुए यह स्पष्ट करना कि वह उपलब्ध लातीनी स्रोत में इस पद के बजाय अगले पद से संबंधित है।
