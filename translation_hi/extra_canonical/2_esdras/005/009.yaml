  text: et mulieres parient menstruata monstra. Et in dulcibus aquis salsae inuenientur, et amici omnes semetipsos expugnabunt, et abscondetur tunc sensus, et intellectus separabitur in promptuarium suum, Et queretur a multis et non inuenietur, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/009.yaml
  text: and women will give birth to monstrous things in menstruation. And in sweet waters salty waters will be found[a], and all friends will make war on one another, and then understanding will be hidden, and insight will withdraw into its storehouse.
translation:
  language: hi
  text: और स्त्रियाँ मासिक धर्म के समय विकृत संतानों को जन्म देंगी[a]। मीठे पानी में खारा पानी मिलेगा, और सभी मित्र एक-दूसरे से युद्ध करेंगे। तब समझ छिप जाएगी, और विवेक अपने भंडार में चला जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन पदबंध menstruata monstra अस्पष्ट है। मुख्य पाठ इसका व्यापक अर्थ ‘मासिक धर्म के समय विकृत संतानों’ के रूप में देता है; अधिक शब्दशः अनुवाद कठिन होगा और उपलब्ध लैटिन से जितनी निश्चितता मिलती है, उससे अधिक अर्थ थोप सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: menstruata monstra
  choice: मासिक धर्म के समय विकृत संतानों
  rationale: लैटिन पदबंध अस्पष्ट है। ‘मासिक धर्म के समय’ menstruata के संकेत को बनाए रखता है, जबकि ‘विकृत संतानों’ monstra को जन्म के संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से ‘दैत्य’ जैसा निश्चित अर्थ नहीं थोपता।
- source_word: dulcibus aquis salsae
  choice: मीठे पानी में खारा पानी
  rationale: dulcis और salsus के विरोध को स्पष्ट तथा सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: sensus
  choice: समझ
  rationale: यहाँ sensus को सामान्य मानवीय समझ के रूप में रखा गया है, ताकि अगले निकटार्थी intellectus से हल्का भेद बना रहे।
- source_word: intellectus
  choice: विवेक
  rationale: intellectus के लिए ‘विवेक’ चुना गया है, जो sensus की ‘समझ’ से संबंधित किंतु अलग बौद्धिक अंतर्दृष्टि को व्यक्त करता है।
- source_word: promptuarium suum
  choice: अपने भंडार
  rationale: मूल के भंडार-रूपक को बनाए रखा गया है; ‘चला जाएगा’ separabitur की वापसी अथवा अलग हो जाने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: menstruata monstra की अस्पष्टता
  choice: मासिक धर्म के समय विकृत संतानों को जन्म देंगी
  alternative: रजस्वला विकृत जीवों को जन्म देंगी
  rationale: मुख्य पाठ में लैटिन के मासिक धर्म-संबंधी संकेत को छोड़ा नहीं गया, पर ऐसे अत्यधिक शाब्दिक रूप से बचा गया जो हिन्दी में अस्पष्ट या स्त्रियों के लिए अनावश्यक रूप से कलंककारी अर्थ पैदा कर सकता है। अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
- issue: समझ और विवेक का व्यक्तिकरण
  choice: समझ छिप जाएगी, और विवेक अपने भंडार में चला जाएगा
  alternative: बोध छिपा दिया जाएगा, और बुद्धि अपने कोष में अलग कर दी जाएगी
  rationale: मूल के भावात्मक व्यक्तिकरण और दोनों निकटार्थी संज्ञाओं के तनाव को सुरक्षित रखा गया है, बिना किसी विशिष्ट धर्मवैज्ञानिक पहचान के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सहज रखी गई है। भविष्यवाणी की तीव्रता, जल के विरोधाभास और समझ-विवेक के व्यक्तिकरण को बनाए रखा गया है। स्रोत में आगे आने वाला अधूरा वाक्य ‘Et queretur a multis...’ अंग्रेज़ी परामर्श-पाठ और दिए गए पद की सीमा से बाहर प्रतीत होने के कारण इस मसौदे में शामिल नहीं किया गया।
