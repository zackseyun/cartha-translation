  yaml_path: translation/extra_canonical/2_esdras/005/046.yaml
  text: And he said to it, “If you bear ten, why over time? Ask it therefore to give birth to ten at one time.” And I said, “Certainly it cannot, but—”
translation:
  language: hi
  text: तुम उससे कहोगे, “यदि तुम दस बच्चों को जन्म देती हो, तो अलग-अलग समय पर क्यों? इसलिए उससे अनुरोध करो कि वह एक ही बार में दस बच्चों को जन्म दे।” तब मैंने कहा, “निश्चय ही वह ऐसा नहीं कर सकती, पर—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dices ad eam
  choice: तुम उससे कहोगे
  rationale: लैटिन में भविष्यत्काल और स्त्रीलिंग सर्वनाम है; संदर्भित स्त्रीलिंग सत्ता को स्पष्ट किए बिना उसी अस्पष्टता को रखा गया है।
- source_word: decem si paris
  choice: यदि तुम दस को जन्म देती हो
  rationale: paris को उसके प्रत्यक्ष प्रसव-संबंधी अर्थ में रखा गया और decem की अनिर्दिष्टता सुरक्षित रखी गई।
- source_word: per tempus
  choice: समय के अंतराल में
  rationale: यह क्रमशः अलग-अलग समय पर जन्म देने का भाव व्यक्त करता है, बिना ‘चरणों में’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: in unum
  choice: एक ही बार में
  rationale: संदर्भ में दसों को एक साथ जन्म देने का स्वाभाविक हिन्दी रूप है।
- source_word: non utique poterit
  choice: निश्चय ही वह ऐसा नहीं कर सकती
  rationale: utique की दृढ़ता और poterit की असमर्थता को सहज हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम eam का संदर्भ
  choice: ‘उससे’ और ‘वह’ के रूप में संदर्भ को अनिर्दिष्ट रखा गया
  alternative: ‘स्त्री के गर्भ’ या ‘स्त्री’ को स्पष्ट रूप से जोड़ना
  rationale: दिए गए लैटिन अंश में संज्ञा उपस्थित नहीं है; उसे जोड़ने से स्रोत की वास्तविक संदर्भगत अस्पष्टता मिट जाती।
- issue: अंतिम sed का अधूरापन
  choice: ‘पर—’
  alternative: अगले विचार को अनुमान से पूरा करना
  rationale: स्रोत पद sed पर टूटता है, इसलिए वाक्य की अपूर्णता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन की परतें स्पष्ट हैं और स्रोत में अनुपस्थित संदर्भ को नहीं जोड़ा गया।
