    reason: पाठगत अपूर्णता स्पष्ट करने और अनूदित वाक्य में अर्थ की अनधिकृत पूर्ति से बचने के लिए।
lexical_decisions:
- source_word: discumbebam supra fenum
  choice: मैं घास पर लेटा हुआ था
  rationale: ‘discumbebam’ की अपूर्ण भूतकालीन क्रिया और ‘supra fenum’ के स्थान-संबंध को सहज, निकटार्थी हिन्दी में व्यक्त करता है।
- source_word: cor meum
  choice: मेरा हृदय
  rationale: ‘cor’ का प्रत्यक्ष अर्थ ‘हृदय’ है; स्रोत यह नहीं बताता कि हृदय की कौन-सी अवस्था अभिप्रेत है, इसलिए ‘व्याकुल था’ जैसी पूर्ति नहीं जोड़ी गई।
- source_word: iterum
  choice: फिर
  rationale: पुनरावृत्ति का अर्थ संक्षेप और स्वाभाविक ढंग से सुरक्षित रहता है।
theological_decisions:
- issue: खंडित वाक्य में हृदय की अवस्था
  choice: अवस्था को अनिर्दिष्ट रखते हुए वाक्य को दीर्घविराम पर समाप्त किया गया
  alternative: ‘मेरा हृदय फिर पहले की तरह व्याकुल था’
  rationale: दिए गए लैटिन पाठ में ‘व्याकुल था’ के अनुरूप कोई शब्द नहीं है। अर्थ की अनुमानित पूर्ति करने के बजाय स्रोत की अपूर्णता और अस्पष्टता बनाए रखी गई।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘हृदय’ स्रोत के निकट है, जबकि दीर्घविराम उपलब्ध पाठ के अधूरे अंत को दर्शाता है।
