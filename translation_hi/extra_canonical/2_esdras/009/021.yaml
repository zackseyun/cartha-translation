id: 2ES.9.21
reference: 2 Esdras 9:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ualde et saluaui mihi acinum de botru et plantationem de tribu multa. Pereat ergo multitudo quae sine causa nata est et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/021.yaml
  text: And I saw[a], and I spared them with very great difficulty, and I saved for myself one grape from the cluster, and one planting from a great forest.
translation:
  language: hi
  text: और मैंने देखा, और बड़ी कठिनाई से उन्हें बख्श दिया; और अपने लिए गुच्छे में से एक अंगूर और एक विशाल वन में से एक पौधा बचा लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त लैटिन पाठ में यहाँ “एक बड़े गोत्र में से” है; पर अन्य प्राचीन भाषाओं के साक्ष्य “एक विशाल वन में से” पाठ का समर्थन करते हैं।
    reason: मुख्य पाठ में स्रोत-आलोचनात्मक रूप से समर्थित 'वन' रखा गया है, जबकि लैटिन के वास्तविक वैकल्पिक पाठ 'गोत्र' को पारदर्शी ढंग से दर्ज करना आवश्यक है।
lexical_decisions:
- source_word: saluaui mihi
  choice: अपने लिए ... बचा लिया
  rationale: लैटिन में अपने लिए सुरक्षित बचा रखने का भाव है; हिन्दी में यह अभिव्यक्ति स्वाभाविक और स्पष्ट है।
- source_word: acinum de botru
  choice: गुच्छे में से एक अंगूर
  rationale: acinum एक अंगूर-दाना और botrus अंगूरों का गुच्छा है; रूपक की एक-में-से-अनेक संरचना बनाए रखी गई है।
- source_word: plantationem
  choice: एक पौधा
  rationale: यहाँ समानांतर रूपक में बचाई गई एक वनस्पति/रोपित वस्तु अभिप्रेत है; साधारण पाठक के लिए 'पौधा' सबसे स्वाभाविक है।
- source_word: de tribu multa
  choice: एक विशाल वन में से
  rationale: प्राप्त लैटिन में tribu ('गोत्र') है, पर इसे यूनानी पाठ-परंपरा की पुरानी त्रुटि माना जाता है; सीरियाई, इथियोपिक, अरबी और आर्मेनियाई साक्ष्य तथा 'गुच्छे में से एक अंगूर' वाला समानांतर 'वन' का समर्थन करते हैं।
theological_decisions:
- issue: बचाए गए अल्पांश का रूपक
  choice: एक अंगूर और एक पौधे की ठोस रूपकात्मक भाषा बनाए रखी
  alternative: रूपक को खोलकर 'कुछ ही लोगों को बचाया' कहना
  rationale: मूल की काव्यात्मक तीव्रता और उसके भीतर निहित न्याय तथा संरक्षण के तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- issue: परिश्रम/कठिनाई का भाव
  choice: बड़ी कठिनाई से उन्हें बख्श दिया
  alternative: उन्हें बहुत अधिक बख्श दिया
  rationale: खंडित उपलब्ध लैटिन में केवल valde स्पष्ट है, जबकि परामर्श-पाठ और व्यापक पाठ-परंपरा कठिनाई के भाव को दर्शाते हैं; हिन्दी में वही अर्थ रखा गया है, पर उसे किसी विशिष्ट धर्मसिद्धान्त से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। वाक्य की समानांतर संरचना—गुच्छे में से एक अंगूर, वन में से एक पौधा—सुरक्षित रखी गई है। पद के बाद आने वाला “Pereat ergo...” अगले पद का आरंभ समझकर यहाँ शामिल नहीं किया गया।
