  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: relinquetur de praedictis periculis et videbit salutare meum in terra mea et in finibus meis, quae sanctificavi mihi a saeculo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/008.yaml
  text: will be left from the foretold dangers and will see my salvation in my land and within my borders[a], which I sanctified for myself from of old.
translation:
  language: hi
  text: पहले से बताए गए संकटों से बचा रह जाएगा और मेरी भूमि में तथा मेरी सीमाओं के भीतर मेरा उद्धार देखेगा, जिन्हें मैंने प्राचीन काल से अपने लिए पवित्र किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: relinquetur de praedictis periculis
  choice: पहले से बताए गए संकटों से बचा रह जाएगा
  rationale: शाब्दिक अर्थ ‘संकटों में से शेष छोड़ दिया जाएगा/रह जाएगा’ है; प्रसंग में इसका स्वाभाविक हिन्दी अर्थ उन संकटों से बचकर शेष रहना है। कर्मवाच्य की छाया ‘रह जाएगा’ में बनी रहती है।
- source_word: videbit salutare meum
  choice: मेरा उद्धार देखेगा
  rationale: salutare संज्ञा के रूप में परमेश्वर द्वारा दिए जाने वाले उद्धार को दर्शाता है; ‘देखेगा’ मूल क्रिया videbit का सीधा रूप है।
- source_word: in terra mea et in finibus meis
  choice: मेरी भूमि में, मेरी सीमाओं के भीतर
  rationale: terra को ‘भूमि’ और fines को क्षेत्रीय सीमाओं के अर्थ में ‘सीमाएँ’ दिया गया है; दोहराए गए in को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: a saeculo
  choice: प्राचीन काल से
  rationale: यहाँ पदबंध का अर्थ बहुत पुराने समय से है; ‘अनादि काल से’ संभव है, पर वह मूल से अधिक दार्शनिक या शाश्वत अर्थ दे सकता है।
theological_decisions:
- issue: संकटों के बाद शेष रहने में मानवीय बच निकलने और परमेश्वर द्वारा बचाए जाने का संबंध
  choice: बचा रह जाएगा
  alternative: बचा लिया जाएगा / शेष रह जाएगा
  rationale: relinquetur कर्मवाच्य है और बचाए जाने का संकेत दे सकता है, पर कर्ता स्पष्ट नहीं है। चुना हुआ रूप जीवित शेष रहने का अर्थ रखता है और अनकहे कर्ता को स्पष्ट नहीं करता।
- issue: quae sanctificavi का संबंध
  choice: उस भूमि और उन सीमाओं को जिन्हें मैंने…पवित्र किया है
  alternative: जिन्हें मैंने…पवित्र किया है (बिना संबंध स्पष्ट किए)
  rationale: लैटिन में संबंधवाचक सर्वनाम का व्याकरण असामान्य है, पर अर्थतः पवित्रीकरण पहले कही गई भूमि और सीमाओं/प्रदेश से जुड़ता है। हिन्दी में पुनरुक्ति संदर्भ को स्पष्ट करती है, बिना किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सहज रखी गई है। पद मूल में पिछले वाक्य से जुड़ा हुआ प्रतीत होता है, इसलिए कोई नया स्पष्ट कर्ता नहीं जोड़ा गया।
