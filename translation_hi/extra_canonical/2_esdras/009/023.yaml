translation:
  language: hi
  text: परन्तु उन दिनों में तुम उपवास नहीं करोगे,[a] बल्कि फूलों के एक मैदान में जाओगे, जहाँ
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पाठ-प्रस्तुति में पिछले पद से जोड़कर अर्थ हो सकता है: “परन्तु तुम, यदि सात दिन और प्रतीक्षा करोगे—यद्यपि उन दिनों में उपवास नहीं करोगे—”।'
    reason: पूर्व प्रचलित पद-विभाजन और विस्तृत पाठ-प्रस्तुति को विकल्प के रूप में सुरक्षित रखना। वर्तमान मुख्य पाठ उपलब्ध लातीनी पदांश का अधिक निकटता से अनुसरण करता है।
lexical_decisions:
- source_word: sed non ieiunabis in eis
  choice: परन्तु उन दिनों में तुम उपवास नहीं करोगे
  rationale: लातीनी वाक्यांश उपवास न करने का सीधा निर्देश देता है। संदर्भगत कालावधि को स्पष्ट करने के लिए सर्वनाम eis का स्वाभाविक हिन्दी रूप ‘उन दिनों में’ रखा गया है।
- source_word: Ibis autem
  choice: बल्कि ... जाओगे
  rationale: यहाँ autem पूर्व निषेध के बाद विपरीत निर्देश जोड़ता है; ‘बल्कि’ हिन्दी में उस संबंध को स्वाभाविक रूप से व्यक्त करता है। भविष्यकालीन ibis को ‘जाओगे’ किया गया है।
- source_word: in campum florum
  choice: फूलों के एक मैदान में
  rationale: यह लातीनी संबंधवाचक रचना का सीधा और सहज हिन्दी रूप है; अनिश्चित स्थान होने के कारण ‘एक’ उपयुक्त है।
- source_word: ubi
  choice: जहाँ
  rationale: खंड अगले पद में जारी रहता है, इसलिए संबंधसूचक ‘जहाँ’ के साथ वाक्य जानबूझकर अपूर्ण रखा गया है।
