translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘परन्तु’ और ‘बल्कि’ से विरोध स्पष्ट किया गया है। स्रोत का वाक्य ‘जहाँ’ पर अधूरा समाप्त होता है, इसलिए अनुवाद में भी अगले पद की ओर खुली संरचना सुरक्षित है।
