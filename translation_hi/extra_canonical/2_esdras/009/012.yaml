id: 2ES.9.12
reference: 2 Esdras 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
translation:
  language: hi
  text: और जब उनके लिए पश्चाताप का अवसर अब भी खुला था, तब उन्होंने इसे नहीं समझा, बल्कि इसका तिरस्कार किया; इन लोगों को मृत्यु के बाद यातना में इसे जानना ही होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में अंतिम ‘जानना’ का कर्म नहीं बताया गया है; ‘इसे’ प्रसंग के आधार पर जोड़ा गया है।
    reason: मूल लैटिन की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: paenitentiae locus
  choice: पश्चाताप का अवसर
  rationale: शाब्दिक रूप से ‘पश्चाताप का स्थान’ संभव है, पर प्रसंग में यह पश्चाताप करने के खुले अवसर को दर्शाता है; आधुनिक हिन्दी में ‘अवसर’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: spreverunt
  choice: इसका तिरस्कार किया
  rationale: क्रिया में केवल उपेक्षा नहीं, बल्कि उपलब्ध पश्चाताप को ठुकराने और हेय समझने का भाव है।
- source_word: hos oportet
  choice: इन लोगों को … जानना ही होगा
  rationale: लैटिन में hos अक्यूज़ेटिव के रूप में infinitive cognoscere का कर्ता है; ‘ही होगा’ oportet की अनिवार्यता व्यक्त करता है।
- source_word: cruciamento
  choice: यातना में
  rationale: यह दंडस्वरूप पीड़ा या torment को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: cognoscere का अलिखित कर्म
  choice: ‘इसे जानना’ में ‘इसे’ जोड़कर पूर्ववर्ती अस्वीकार किए गए सत्य/अवसर की ओर संकेत किया गया है।
  alternative: बिना कर्म के ‘जानना होगा’, या स्पष्ट व्याख्या के साथ ‘सत्य जानना होगा’।
  rationale: लैटिन cognoscere का कर्म स्पष्ट नहीं करता। हिन्दी में अकेला ‘जानना’ अधूरा लगता है, जबकि ‘सत्य’ जोड़ना अर्थ को आवश्यकता से अधिक निश्चित कर देता; इसलिए संदर्भसूचक ‘इसे’ रखा गया और अस्पष्टता पादटिप्पणी में बताई गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पश्चाताप का अवसर’ शाब्दिक ‘स्थान’ की अपेक्षा प्रसंगानुकूल है; अर्धविराम मूल वाक्य की दो निकटता से जुड़ी धाराओं को बनाए रखता है।
