base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/036.yaml
  text: For we indeed[a], who received the law, will perish because we sinned, and also our heart, which received it[b];
translation:
  language: hi
  text: हम तो[a], जिन्होंने व्यवस्था पाई है, पाप करते हुए नाश हो जाएँगे, और हमारा हृदय भी, जिसने उसे ग्रहण किया है[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के आसपास का लैटिन पाठ कुछ खुरदुरा है। मुख्य भाव यह है कि व्यवस्था पानेवाले नाश हो जाते हैं, पर व्यवस्था स्वयं नाश नहीं होती और उसका सम्मान बना रहता है।
    reason: textual_variant
  - marker: b
    text: या, “हम तो, जिन्होंने व्यवस्था पाई है, पाप करने के कारण नाश हो जाएँगे, और हमारा हृदय भी, जिसने उसे ग्रहण किया है।”
    reason: previous_rendering
lexical_decisions:
- source_word: nos quidem
  choice: क्योंकि हम ही
  rationale: ‘क्योंकि’ प्रसंगगत संबंध को और ‘ही’ quidem के बलाघात को व्यक्त करता है; पद के पाठ की खुरदुराहट को देखते हुए अनावश्यक रूप से अधिक स्पष्ट विरोध नहीं जोड़ा गया।
- source_word: legem
  choice: व्यवस्था
  rationale: बाइबिलीय प्रसंग में दैवी ‘व्यवस्था’ के लिए प्रचलित, गरिमापूर्ण और सहज शब्द।
- source_word: peccantes peribimus
  choice: पाप करने के कारण नाश हो जाएँगे
  rationale: वर्तमान कृदंत peccantes को परिणाम के कारण के रूप में स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह कहे कि व्यवस्था स्वयं नाश होती है।
- source_word: cor nostrum quod suscepit eam
  choice: हमारा हृदय भी, जिसने उसे ग्रहण किया है
  rationale: nostrum के स्पष्ट स्वामित्व को बनाए रखता है और स्त्रीलिंग eam का संकेत ‘व्यवस्था’ की ओर रखता है।
theological_decisions:
- issue: नाश किसका होता है
  choice: व्यवस्था पानेवाले लोग और उनका हृदय नाश होते हैं
  alternative: व्यवस्था स्वयं नाश होती है
  rationale: लैटिन में कर्ता nos और cor nostrum हैं; legem/eam कर्म हैं। इसलिए व्यवस्था के नाश होने का अर्थ पाठ में नहीं जोड़ा गया।
- issue: peccantes का संबंध
  choice: पाप करने के कारण
  alternative: पाप में रहते हुए
  rationale: कृदंत कारण अथवा साथ-साथ चल रही दशा सूचित कर सकता है। मुख्य पाठ में प्रसंगानुकूल कारणात्मक रूप रखा गया और वैकल्पिक संभावना पादटिप्पणी में सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘व्यवस्था’, ‘ग्रहण’ और ‘नाश’ जैसे परिचित बाइबिलीय शब्दों के साथ वाक्य को गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखा गया है। मूल वाक्य आगे जारी रहने के कारण अंत में अर्धविराम रखा गया है।
