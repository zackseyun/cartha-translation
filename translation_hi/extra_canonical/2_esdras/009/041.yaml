source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: dimitte me, dominus meus, ut defleam me et adiciam dolorem, quoniam valde amara sumanimo et humiliata sum valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/041.yaml
  text: She said to me, “Leave me, my lord, so that I may weep for myself and add to my sorrow, for I am very bitter in spirit and greatly humbled.”
translation:
  language: hi
  text: उसने मुझसे कहा, “हे मेरे प्रभु, मुझे छोड़ दीजिए, ताकि मैं अपने लिए रोऊँ और अपना दुःख और बढ़ाऊँ, क्योंकि मेरा मन बहुत कड़वाहट से भरा है और मैं अत्यन्त दीन कर दी गई हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte me
  choice: मुझे छोड़ दीजिए
  rationale: लैटिन आज्ञार्थक वाक्यांश का निकट और स्वाभाविक हिन्दी रूप; प्रसंग में इसका अर्थ उसे अकेला छोड़ देने का अनुरोध है, पर ‘अकेला’ मूल में स्पष्ट रूप से नहीं है।
- source_word: defleam me
  choice: मैं अपने लिए रोऊँ
  rationale: defleam के विलापपूर्वक रोने के भाव और me के आत्मसंबंधी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: adiciam dolorem
  choice: अपना दुःख और बढ़ाऊँ
  rationale: शाब्दिक भाव ‘दुःख में और जोड़ना’ है; हिन्दी में ‘दुःख और बढ़ाना’ अधिक स्वाभाविक है।
- source_word: amara sum animo
  choice: मेरा मन बहुत कड़वाहट से भरा है
  rationale: animo को ‘मन’ और amara को आंतरिक कटु पीड़ा के रूप में व्यक्त किया गया है; ‘मैं मन में बहुत कड़वी हूँ’ अस्वाभाविक होता।
- source_word: humiliata sum valde
  choice: मैं अत्यन्त दीन हो गई हूँ
  rationale: humiliata के नीचा किए जाने, दब जाने या दीन दशा में पहुँचने के भाव को सुरक्षित रखता है, बिना यह तय किए कि कारण केवल बाहरी अपमान था या आंतरिक विनम्रता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, शोकपूर्ण और सामान्य पाठकों के लिए सुबोध रूप। स्त्री वक्ता के अनुसार स्त्रीलिंग क्रियाएँ रखी गई हैं। ‘मेरे प्रभु’ सम्मानसूचक संबोधन है; इसलिए अनुरोध में ‘दीजिए’ प्रयुक्त हुआ है।
