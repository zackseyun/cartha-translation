id: 2ES.9.6
reference: 2 Esdras 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'manifesta in prodigiis et uirtutibus, et consummatio in actu et in signis. Et erit omnis qui saluus factus fuerit, et qui poterit effugere per opera sua uel per fidem in qua credidit, Is relinquetur de praedictis periculis et uidebit salutare meum in terra mea et in finibus meis quae sanctificaui mihi a saeculo. Et tunc mirabuntur qui nunc abusi sunt uias meas, et in cruciamentis commorabuntur hii qui eas proiecerunt in contemptu. Quodquod enim non cognouerunt me uiuentes beneficia consecuti, Et quodquod fastidierunt legem meam, cum adhuc erant habentes libertatem, Et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreuerunt, hos oportet post mortem in cruciamento cognoscere. Tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti saluabuntur, et quorum saeculum et propter quos saeculum et quando. Respondi et dixi : Olim locutus sum et nunc dico et postea dicam, quoniam plures sunt qui pereunt quam ii qui saluabuntur, Sicut multiplicat
    fluctus super guttam. Et respondit ad me et dixit : qualis ager, talia et semina ; et quales flores, tales et tincturae ; et qualis opera, talis et creatio ; et qualis agricola, talis et area. Quoniam tempus erat saeculi, et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum, in quo inhabitarent; et nemo contradixit mihi tunc, nec enim erat quisquam: Et nunc creati in mundo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/006.yaml
  text: 'so also are the times of the Most High: beginnings made manifest in wonders and mighty works[a], and the end in deeds and signs.'
translation:
  language: hi
  text: 'वैसे ही परमप्रधान के समय हैं: आरम्भ चमत्कारों और सामर्थ्य के कार्यों में प्रकट होते हैं, और अंत कार्यों और चिन्हों में प्रकट होता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tempora Altissimi (English consultation layer; implied by the verse context)
  choice: परमप्रधान के समय
  rationale: ‘परमप्रधान’ बाइबलीय उपाधि को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है; बहुवचन ‘समय’ स्रोत के tempora के अनुरूप है।
- source_word: initia manifesta
  choice: उनके आरम्भ ... प्रकट होते हैं
  rationale: initia बहुवचन है, इसलिए हिन्दी में ‘आरम्भ’ को बहुवचन क्रिया के साथ रखा गया है। ‘प्रकट होते हैं’ manifesta का स्पष्ट और स्वाभाविक रूप है।
- source_word: prodigiis
  choice: अद्भुत चिन्हों
  rationale: यह शब्द केवल आश्चर्य नहीं, संकेतात्मक चमत्कारी घटनाओं का भाव भी रखता है; ‘अद्भुत चिन्ह’ दोनों पहलुओं को व्यक्त करता है।
- source_word: uirtutibus
  choice: सामर्थ्य के कामों
  rationale: यहाँ virtutes नैतिक सद्गुणों के बजाय शक्ति के प्रकट कार्यों को दर्शाता है; इसलिए ‘सामर्थ्य के काम’ चुना गया है।
- source_word: consummatio
  choice: अंत
  rationale: लातिनी शब्द एकवचन है और समय की पूर्ण परिणति या अंत को सूचित करता है; सरल हिन्दी ‘अंत’ इस अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: in actu et in signis
  choice: कार्यों और चिन्हों में
  rationale: actus को सामान्य ‘कार्य’ और signa को ‘चिन्ह’ के रूप में रखा गया है; समानांतर वाक्य-विन्यास बनाए रखने के लिए ‘प्रकट होता है’ दोहराया गया है।
theological_decisions:
- issue: आरम्भों और अंत के बीच वचनगत विषमता
  choice: ‘आरम्भ’ के साथ बहुवचन क्रिया और ‘अंत’ के साथ एकवचन क्रिया
  alternative: दोनों को एकवचन या दोनों को बहुवचन बनाना
  rationale: स्रोत में initia बहुवचन और consummatio एकवचन है। इस तनाव को समतल किए बिना हिन्दी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। स्रोत के समानांतर ढाँचे को बनाए रखते हुए दूसरे खंड में स्पष्टता के लिए ‘प्रकट होता है’ दोहराया गया है।
