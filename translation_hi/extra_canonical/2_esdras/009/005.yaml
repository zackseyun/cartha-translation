id: 2ES.9.5
reference: 2 Esdras 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'omne quod factum est in saeculo, initium per consummationem et consummatio manifesta, Sic et altissimi tempora : initia'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/005.yaml
  text: For just as everything that has come to be in the age has a beginning through an end[a], and the end is manifest,
translation:
  language: hi
  text: क्योंकि जैसे युग में जो कुछ बना है, उसका आरंभ अंत के द्वारा होता है[a], और अंत प्रकट है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-साक्ष्यों के अनुसार, ‘उसका आरंभ स्पष्ट है और अंत प्रकट है।’
    reason: प्रदत्त लातीनी ‘per consummationem’ कठिन पाठ है; ‘initium patet et consummatio manifesta’ अर्थपूर्ण पाठांतर है और प्राचीन अनुवाद-परंपरा से समर्थन पाता है।
lexical_decisions:
- source_word: saeculo
  choice: युग में
  rationale: लातीनी saeculum यहाँ समय-युग को सूचित करता है; इसलिए इसे ‘संसार’ बनाकर स्थानवाचक अर्थ में सीमित नहीं किया गया।
- source_word: omne quod factum est
  choice: जो कुछ बना है
  rationale: factum est के अस्तित्व में आने या बनाए जाने के व्यापक अर्थ को सरल और स्वाभाविक हिन्दी में रखा गया है।
- source_word: initium per consummationem
  choice: आरंभ अंत के द्वारा होता है
  rationale: प्रदत्त लातीनी पाठ की कठिन और संभवतः दूषित शब्दावली को अनुमान से सुधारने के बजाय मुख्य पाठ में निकटता से सुरक्षित रखा गया है।
- source_word: consummatio manifesta
  choice: अंत प्रकट है
  rationale: consummatio को प्रसंगानुसार ‘अंत’ और manifesta को सीधे ‘प्रकट’ अनूदित किया गया है।
theological_decisions:
- issue: कठिन पाठ ‘initium per consummationem’ का अर्थ
  choice: मुख्य पाठ में ‘आरंभ अंत के द्वारा होता है’ रखकर कठिनता सुरक्षित रखी गई
  alternative: ‘आरंभ स्पष्ट है और अंत प्रकट है’
  rationale: वैकल्पिक पाठ अधिक अर्थपूर्ण है और अन्य प्राचीन पाठ-साक्ष्यों से समर्थित बताया जाता है, पर प्रदत्त लातीनी स्रोत में per consummationem है; इसलिए उसे बिना संकेत दिए बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सरल वाक्य रखा गया है। मूल पाठ की असामान्य अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखते हुए पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
