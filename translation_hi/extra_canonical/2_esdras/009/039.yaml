lexical_decisions:
- source_word: dimisi cogitatus
  choice: मैंने उन विचारों को छोड़ दिया
  rationale: ‘dimisi’ के छोड़ देने/जाने देने के भाव और ‘cogitatus’ के ‘विचारों’ को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: in quibus eram cogitans
  choice: जिनमें मैं सोच रहा था
  rationale: लैटिन में ‘विचार’ और ‘सोचने’ की जानबूझकर की गई पुनरुक्ति को बनाए रखता है, यद्यपि हिन्दी में यह कुछ असामान्य लगती है।
- source_word: conversus sum ad eam
  choice: उस स्त्री की ओर मुड़कर
  rationale: ‘conversus sum’ का अर्थ ‘मुड़ा’ और स्त्रीलिंग ‘eam’ का संदर्भ स्पष्ट करता है; केवल ‘उसकी ओर’ की अपेक्षा हिन्दी में अधिक सहज है।
- source_word: dixi ei
  choice: उससे कहा
  rationale: लैटिन के अप्रत्यक्ष कर्म ‘ei’ को स्वाभाविक हिन्दी रचना में व्यक्त करता है।
