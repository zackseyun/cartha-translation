id: 2ES.9.20
reference: 2 Esdras 9:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erat perditum, et orbem meum, et ecce erat periclitans propter cogitationes quae in eo aduenerunt. Et uidi et peperci eis uix
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/020.yaml
  text: And I considered my world, and behold, it was ruined; and my inhabited world, and behold, it was in peril because of the schemes that had come into it.
translation:
  language: hi
  text: मैंने अपने संसार पर विचार किया—देखो, वह नष्ट हो चुका था; और अपने जगत पर—देखो, वह उन विचारों के कारण संकट में था जो उसमें आ गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: orbem meum
  choice: अपनी धरती
  rationale: यहाँ orbis बसाए हुए मानव-जगत अथवा पृथ्वी का बोध कराता है; ‘धरती’ आधुनिक हिन्दी में स्वाभाविक है और पहले आए ‘संसार’ से भेद भी बनाए रखता है।
- source_word: periclitans
  choice: संकट में थी
  rationale: लैटिन कृदन्त आसन्न खतरे या विनाश के जोखिम को व्यक्त करता है; यह अनुवाद उस जारी दशा को सहज हिन्दी में रखता है।
- source_word: cogitationes
  choice: विचारों
  rationale: शब्द का मूल अर्थ विचार, अभिप्राय या योजनाएँ हो सकता है। ‘विचारों’ से मूल की व्यापकता बनी रहती है और ‘षड्यंत्रों’ जैसा अतिरिक्त नकारात्मक अर्थ नहीं जोड़ा जाता।
- source_word: quae in eo advenerunt
  choice: जो उसमें आ गए थे
  rationale: मूल की आगमन-संबंधी अभिव्यक्ति और जगत के भीतर प्रवेश का रूपक यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘मेरे संसार’ और ‘मेरी धरती’ का संबंध
  choice: दो समानांतर किंतु अलग हिन्दी पद रखे गए
  alternative: दोनों के लिए ‘संसार’
  rationale: पाठ में saeculum और orbis के बीच संभावित अर्थभेद है; उन्हें एक ही शब्द में मिला देने से काव्यात्मक समानांतरता और तनाव मिट जाता।
- issue: संकट का कारण बनने वाली cogitationes की नैतिक प्रकृति
  choice: तटस्थ ‘विचारों’
  alternative: ‘दुष्ट योजनाओं’ या ‘षड्यंत्रों’
  rationale: लैटिन शब्द स्वयं इस वाक्य में स्पष्ट रूप से ‘दुष्ट’ नहीं कहता; संदर्भ नकारात्मक है, पर अनुवाद में अतिरिक्त नैतिक विशेषण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; ‘देखो’ से ecce की प्रत्यक्षता तथा अर्धविराम से दोनों समानांतर कथनों की संरचना सुरक्षित रखी गई है। उपलब्ध लैटिन उद्धरण का आरंभ पिछले शब्दों से कटा हुआ प्रतीत होता है और अंत में अगली पंक्ति/पद का ‘Et uidi et peperci eis uix’ जुड़ा है; 9:20 के लिए अंग्रेज़ी परामर्श-पाठ से प्रमाणित पद-सीमा अपनाई गई है, इसलिए उस अगले कथन को मुख्य पाठ में शामिल नहीं किया गया।
