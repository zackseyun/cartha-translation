- from: मैंने अपने संसार पर विचार किया—देखो, वह नष्ट हो चुका था; और अपनी धरती पर—देखो, वह उन विचारों के कारण संकट में थी जो उसमें आ गए थे।
  to: मैंने अपने संसार पर विचार किया—देखो, वह नष्ट हो चुका था; और अपने जगत पर—देखो, वह उन विचारों के कारण संकट में था जो उसमें आ गए थे।
  rationale: The sole change replaces ‘अपनी धरती’ with ‘अपने जगत’ and correspondingly ‘थी’ with ‘था’. This avoids an unnecessarily physical construal of orbis while retaining the source’s parallel contrast between saeculum and orbis. The text ends at advenerunt, in accord with the supplied English audit trail’s verse delimitation; the trailing Latin sentence belongs to the subsequent material and is not translated here.
