  text: '“I have spoken before[a], and now I say, and I will say afterward: many more perish than will be saved,'
translation:
  language: hi
  text: '“मैं पहले बोल चुका हूँ, और अब कहता हूँ,[a] और आगे कहूँगा: क्योंकि नाश होनेवाले उन लोगों से अधिक हैं जिनका उद्धार होगा,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अब बोलता हूँ, और आगे बोलूँगा।”
    reason: nunc dico et postea dicam के लिए ‘कहता हूँ/कहूँगा’ के स्थान पर ‘बोलता हूँ/बोलूँगा’ का वैकल्पिक निरूपण; यह अंग्रेज़ी POB audit trail के विकल्प के अनुरूप है।
lexical_decisions:
- source_word: olim locutus sum
  choice: मैं पहले भी बोल चुका हूँ
  rationale: ‘locutus sum’ बोलने के पूर्व कार्य पर बल देता है; ‘पहले भी’ यहाँ olim को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: nunc dico et postea dicam
  choice: और अब कहता हूँ, और आगे भी कहूँगा
  rationale: dico/dicam को ‘कहता हूँ/कहूँगा’ से व्यक्त कर locutus sum के ‘बोल चुका हूँ’ से लैटिन का वास्तविक शब्दगत अंतर सुरक्षित रखा गया है।
- source_word: plures sunt qui pereunt
  choice: नाश होनेवालों की संख्या ... कहीं अधिक है
  rationale: plures sunt की तुलनात्मक संख्या और pereunt के विनाशार्थ को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: qui salvabuntur
  choice: उद्धार पानेवालों
  rationale: भविष्यकालीन कर्मवाच्य salvabuntur को ‘उद्धार पानेवालों’ द्वारा संक्षिप्त और धर्मशास्त्रीय रूप से तटस्थ ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: pereunt और salvabuntur के बीच विरोध
  choice: नाश होनेवाले / उद्धार पानेवाले
  alternative: खो जानेवाले / बचाए जानेवाले
  rationale: चुने हुए पद पारंपरिक धार्मिक अर्थ को बनाए रखते हैं, पर यह तय नहीं करते कि नाश या उद्धार की प्रक्रिया अथवा कर्ता को कैसे समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बोल चुका हूँ’ और ‘कहता हूँ/कहूँगा’ के द्वारा स्रोत के locutus sum तथा dico/dicam का भेद बनाए रखा गया है।
