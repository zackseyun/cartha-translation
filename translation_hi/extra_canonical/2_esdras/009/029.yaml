  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/029.yaml
  text: O Lord[a], you showed yourself among us to our fathers in the wilderness, when they were coming out of Egypt and were entering the untrodden and fruitless desert,
translation:
  language: hi
  text: और मैंने परमप्रधान के सामने कहा, “हे प्रभु, आपने सचमुच हमारे पूर्वजों को हमारे बीच अपना दर्शन दिया[a], जब वे मिस्र से निकल रहे थे और उस किसी के पाँव न पड़े हुए और बंजर मरुभूमि में प्रवेश कर रहे थे,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “आप हमारे बीच हमारे पूर्वजों को प्रकट हुए।” लैटिन में ‘हमारे बीच’ का ठीक-ठीक वाक्यगत सम्बन्ध अस्पष्ट है।'
    reason: ‘in nobis’ और ‘patribus nostris’ के सम्बन्ध की वास्तविक अस्पष्टता सुरक्षित रखता है, जबकि मुख्य पाठ में दत्तिव ‘हमारे पूर्वजों को’ का अर्थ बना रहता है।
lexical_decisions:
- source_word: altissimo
  choice: परमप्रधान
  rationale: यह सर्वोच्च परमेश्वर के लिए प्रयुक्त लैटिन उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: ostendens ostensus es
  choice: आपने सचमुच … अपने आपको प्रकट किया
  rationale: दोहराए गए लैटिन रूप को शाब्दिक रूप से अस्वाभाविक बनाने के बजाय ‘सचमुच’ द्वारा उसका सम्भावित सामी जोर सुरक्षित रखा गया है।
- source_word: in nobis
  choice: हमारे बीच
  rationale: लैटिन का स्थानवाचक अर्थ बनाए रखता है, यद्यपि वाक्य में इसका सम्बन्ध एक से अधिक प्रकार से समझा जा सकता है।
- source_word: deserto quod non calcatur
  choice: अनछुआ … निर्जन प्रदेश
  rationale: ऐसे वीरान स्थान का भाव देता है जहाँ किसी ने पाँव नहीं रखा; ‘जंगल’ आधुनिक हिन्दी में पेड़ों वाले क्षेत्र का भ्रामक संकेत दे सकता है।
- source_word: Aegypto
  choice: मिस्र
  rationale: आधुनिक मानक हिन्दी में प्रचलित बाइबलीय भौगोलिक नाम।
theological_decisions:
- issue: ostendens ostensus es में दोहराव का अर्थ
  choice: इसे ‘सचमुच … प्रकट किया’ के रूप में जोरदार कथन माना गया
  alternative: ‘अपने आपको दिखाते हुए आप दिखाई दिए’ जैसा शाब्दिक दोहराव
  rationale: दूसरा रूप लैटिन संरचना तो दिखाता है, पर हिन्दी में अस्पष्ट और कृत्रिम है; मुख्य पाठ सम्भावित सामी बलाघात को स्वाभाविक ढंग से व्यक्त करता है।
- issue: in nobis और patribus nostris का परस्पर सम्बन्ध
  choice: ‘हमारे बीच हमारे पूर्वजों के सामने’
  alternative: ‘हमारे लिए हमारे पूर्वजों के सामने’ अथवा ‘हममें अपने आपको हमारे पूर्वजों पर प्रकट किया’
  rationale: मुख्य पाठ लैटिन के ‘हमारे बीच’ को बनाए रखता है और ‘पूर्वजों’ को प्रकाशन के साक्षी/प्राप्तकर्ता के रूप में पढ़ता है, पर अस्पष्टता को पाद-टिप्पणी में स्वीकार करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और श्रद्धापूर्ण रखी गई है। आरम्भिक ‘और मैंने … कहा’ उपलब्ध लैटिन पाठ में है, इसलिए परामर्शार्थ अंग्रेज़ी पाठ में न होने पर भी शामिल किया गया है। उपलब्ध लैटिन अंश अन्त में ‘और’ पर रुकता है; अंग्रेज़ी परामर्श-पाठ के आधार पर ‘बंजर’ से आशय पूरा किया गया है।
