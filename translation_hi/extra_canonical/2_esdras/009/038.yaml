review_pass:
  verdict: revise
  source_fidelity: Draft is largely faithful to the Latin and preserves the woman’s mourning, loud weeping, torn garments, and ashes. However, it omits the emphatic narrative particle “et ecce” (“and behold/look”), and “आँखें उठाकर” adds an upward-motion nuance not explicit in the supplied Latin.
  naturalness: The Hindi is fluent and appropriately dignified. “वह मन से बहुत दुःखी थी” is slightly more idiomatic and directly reflects the woman’s inward grief than “उसका मन अत्यन्त दुःखी था.”
  terminology: No problematic theological terminology or names occur in this verse. “राख” and “विलाप” suitably convey the conventional signs and expression of mourning.
  issues:
  - severity: medium
    issue: The phrase “et ecce” is not represented.
    rationale: The source marks the sight with an emphatic “and behold”; retaining it preserves the narrative emphasis.
  - severity: low
    issue: “आँखें उठाकर” is more specific than the Latin “respexi oculis meis.”
    rationale: The supplied Latin says that the speaker looked with his eyes, without expressly stating that he raised them. A neutral rendering avoids importing that detail.
  revised_text: जब मैं मन ही मन ये बातें कह रहा था, तब मैंने देखा कि दाहिनी ओर एक स्त्री थी। और देखो, वह ऊँचे स्वर में विलाप कर रही थी और रो रही थी; वह मन से बहुत दुःखी थी। उसके वस्त्र फटे हुए थे और उसके सिर पर राख थी।
