base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/035.yaml
  text: and when what was received is destroyed[a], these are destroyed, but the receptacles remain. For with us it has not happened so.
translation:
  language: hi
  text: और जब ग्रहण की गई वस्तुएँ नष्ट हो जाती हैं[a], तब ये नष्ट हो जाती हैं, पर उन्हें ग्रहण करने वाले पात्र बने रहते हैं। क्योंकि हमारे यहाँ ऐसा नहीं हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जब बोई हुई, भेजी हुई अथवा ग्रहण की गई वस्तुएँ नष्ट हो जाती हैं, तब ये नष्ट हो जाती हैं, पर उन्हें ग्रहण करने वाले पात्र बने रहते हैं। फिर भी हमारे यहाँ ऐसा नहीं हुआ है।”
    reason: अंग्रेज़ी audit trail में संरक्षित वैकल्पिक व्यापक पाठ-व्याख्या को पूर्ण वाक्य के रूप में दिया गया है। मुख्य पाठ लातीनी suscepta (‘ग्रहण की गई [वस्तुएँ]’) को रखता है।
lexical_decisions:
- source_word: suscepta sunt
  choice: ग्रहण की हुई वस्तुएँ
  rationale: लातीनी क्रिया suscipere के मूल भाव ‘ग्रहण करना’ को रखा गया है; नपुंसकलिंग बहुवचन को हिन्दी में स्वाभाविक रूप से ‘वस्तुएँ’ कहकर स्पष्ट किया गया है।
- source_word: susceptoria
  choice: उन्हें ग्रहण करनेवाले पात्र
  rationale: यह शब्द ग्रहण करने या अपने भीतर रखने वाली चीज़ों को सूचित करता है। ‘पात्र’ संक्षिप्त और स्वाभाविक है, जबकि संबंध स्पष्ट करने के लिए ‘उन्हें ग्रहण करनेवाले’ जोड़ा गया है।
- source_word: apud nos enim non sic factum est
  choice: क्योंकि हमारे साथ ऐसा नहीं हुआ है
  rationale: enim के कारणसूचक प्रवाह को ‘क्योंकि’ से और apud nos को प्रसंगानुकूल ‘हमारे साथ’ से व्यक्त किया गया है।
theological_decisions:
- issue: ग्रहण की हुई वस्तुओं और ग्रहण करनेवाले पात्रों के रूपक की पहचान
  choice: रूपक के दोनों पक्षों को सामान्य और खुला रखा गया है।
  alternative: इन्हें स्पष्ट रूप से बीज और धरती, अथवा व्यवस्था और मनुष्य के रूप में पहचानना।
  rationale: इस पद के उपलब्ध लातीनी पाठ में वे पहचानें प्रत्यक्ष रूप से नहीं दी गईं; उन्हें मुख्य पाठ में जोड़ना वास्तविक रूपकीय अस्पष्टता को अनावश्यक रूप से हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य। मूल पाठ की कुछ असामान्य पुनरुक्ति (‘ये नष्ट हो जाती हैं’) और रूपकीय अस्पष्टता को बनाए रखा गया है।
