  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्त्रीलिंग रूप संदर्भानुसार रखा गया है। अंग्रेज़ी परत का फुटनोट पाठ के समान ही है और कोई वास्तविक वैकल्पिक पाठ नहीं देता, इसलिए अनावश्यक फुटनोट नहीं रखा गया।
