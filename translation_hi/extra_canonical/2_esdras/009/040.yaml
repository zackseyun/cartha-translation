  text: '“Why are you weeping[a], and why are you grieved in spirit?” And she said to me:'
translation:
  language: hi
  text: '“तुम क्यों रो रही हो, और मन में क्यों दुखी हो?” तब उसने मुझसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fles
  choice: रो रही हो
  rationale: संदर्भ में संबोधित व्यक्ति स्त्री है; वर्तमान काल का यह स्वाभाविक हिन्दी रूप लैटिन क्रिया का सीधा अर्थ रखता है।
- source_word: doles animo
  choice: मन में दुखी हो
  rationale: animo को ‘मन में’ कहना आंतरिक शोक का भाव स्पष्ट करता है और अनावश्यक दार्शनिक अर्थ नहीं जोड़ता।
- source_word: et dixit ad me
  choice: तब उसने मुझसे कहा
  rationale: यह खंड स्त्री के उत्तर का परिचय देता है। हिन्दी कथन-प्रवाह में ‘तब’ स्वाभाविक है और लैटिन et की क्रमसूचक भूमिका व्यक्त करता है।
