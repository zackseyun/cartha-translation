  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc mirabuntur qui nunc abusi sunt vias meas, et in cruciamentis commorabuntur hii qui eos proiecerunt in contemptu.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/009.yaml
  text: Then those who now have abused my ways will be astonished, and those who cast them aside in contempt will remain in torments.
translation:
  language: hi
  text: तब वे लोग चकित होंगे जिन्होंने अब मेरे मार्गों का दुरुपयोग किया है; और जिन्होंने उन्हें तिरस्कार से ठुकरा दिया, वे यातनाओं में पड़े रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mirabuntur
  choice: चकित होंगे
  rationale: लातीनी क्रिया भविष्यकाल में विस्मय या चकित होने का भाव देती है; यह हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: abusi sunt vias meas
  choice: मेरे मार्गों का दुरुपयोग किया है
  rationale: abuti का मूल भाव अनुचित उपयोग या दुरुपयोग करना है; 'मार्गों' के साथ कुछ असामान्य लगने पर भी स्रोत का कठोर रूपक सुरक्षित रहता है।
- source_word: proiecerunt in contemptu
  choice: तिरस्कार से ठुकरा दिया
  rationale: proicere और in contemptu मिलकर अवमानना के साथ परे फेंकने या अस्वीकार करने का भाव देते हैं।
- source_word: in cruciamentis commorabuntur
  choice: यातनाओं में पड़े रहेंगे
  rationale: commorari ठहरे रहने या बने रहने को और cruciamenta यातनाओं को व्यक्त करता है; यह निरंतर दशा का भाव बनाए रखता है।
theological_decisions:
- issue: ‘उन्हें’ का संदर्भ
  choice: बहुवचन सर्वनाम को बनाए रखा गया, जिसका निकटतम संदर्भ ‘मेरे मार्गों’ से है।
  alternative: सर्वनाम को स्पष्ट करके ‘मेरे मार्गों’ दोहराना।
  rationale: लातीनी eos व्याकरणतः vias से लिंग-सामंजस्य नहीं रखता, इसलिए पाठ में कुछ तनाव है; हिन्दी में ‘उन्हें’ रखकर मूल की संदर्भगत अस्पष्टता को अनावश्यक रूप से हल नहीं किया गया।
- issue: दंड की अवधि
  choice: ‘पड़े रहेंगे’
  alternative: ‘सदा यातना सहेंगे’
  rationale: स्रोत commorabuntur बने रहने का भाव देता है, पर इस पद में ‘सदा’ स्पष्ट नहीं है; अतः अनंत दंड की अवधि पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सुबोध और गरिमापूर्ण शैली। वाक्य-संरचना स्रोत के दो समानांतर खंडों को बनाए रखती है।
