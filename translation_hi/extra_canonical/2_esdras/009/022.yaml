  yaml_path: translation/extra_canonical/2_esdras/009/022.yaml
  text: Let my grape and my planting be preserved, because I completed these with much labor. But if you still delay another seven days—
translation:
  language: hi
  text: मेरी दाख और मेरी रोपाई को सुरक्षित रखा जाए, क्योंकि मैंने इन्हें बड़े परिश्रम से पूरा किया है। पर यदि तुम अब भी सात और दिन ठहरो—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य अगली आयत में पूरा होता है। यहाँ अनूदित लैटिन क्रिया का अर्थ ‘ठहरना’, ‘विराम लेना’ या ‘कुछ समय तक टालना’ भी हो सकता है।
    reason: मूल में वाक्य अधूरा है और intermittas में वास्तविक अर्थगत विस्तार है; पाठक को दोनों बातें बताना आवश्यक है।
lexical_decisions:
- source_word: seruietur
  choice: सुरक्षित रखा जाए
  rationale: प्रसंग और परामर्श-पाठ के अनुसार इसे संरक्षण की निष्क्रिय आज्ञा के रूप में लिया गया है; उपलब्ध लैटिन रूप पाठगत कठिनाई रखता है।
- source_word: acinus meus
  choice: मेरे अंगूर
  rationale: acinus एक अंगूर-दाने या अंगूर के लिए प्रयुक्त एकवचन संज्ञा है; रूपक की ठोस छवि बनाए रखने के लिए सामान्य हिंदी ‘अंगूर’ चुना गया।
- source_word: plantatio mea
  choice: मेरे लगाए हुए पौधे
  rationale: plantatio का अर्थ रोपण या लगाई हुई वनस्पति हो सकता है; स्वाभाविक हिंदी में अधिकार और रोपने की क्रिया दोनों व्यक्त किए गए हैं।
- source_word: cum multo labore perfeci haec
  choice: मैंने बड़े परिश्रम से इन्हें पूरा किया है
  rationale: perfeci को ‘सिद्ध’ या ‘परिपूर्ण’ करने के धार्मिक अर्थ से बचाते हुए कार्य को पूरा करने के सामान्य अर्थ में रखा गया है।
- source_word: intermittas septem dies alios
  choice: और सात दिन ठहरो
  rationale: intermittere यहाँ रुकने, विराम लेने या कुछ समय तक स्थगित रखने का भाव दे सकता है; अधूरे शर्त-वाक्य में ‘ठहरो’ सहज है और अगली पंक्ति से जुड़ाव बनाए रखता है।
