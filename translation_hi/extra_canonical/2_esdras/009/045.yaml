  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post triginta annos, exaudivit me Deus ancillae tuae et pervidit humilitatem meam et adtendit tribulationi meae et dedit mihi filium. et iucundata sum super eum valde ego et vir meus et omnes cives mei, et honorificabamus valde Fortem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/045.yaml
  text: And it happened after thirty years that God heard me[a], your female servant, and saw my humiliation, and paid attention to my distress, and gave me a son. And I rejoiced over him greatly, I and my husband and all my fellow citizens, and we greatly honored the Mighty One.
translation:
  language: hi
  text: और ऐसा हुआ कि तीस वर्ष बाद परमेश्वर ने मेरी सुन ली—मैं तेरी दासी हूँ—मेरी दीन दशा को देखा, मेरे क्लेश पर ध्यान दिया और मुझे एक पुत्र दिया। तब मैं उसके कारण बहुत आनन्दित हुई, मैं, मेरा पति और मेरे सभी सहनागरिक; और हम उस सामर्थी का बहुत आदर करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ancillae tuae
  choice: मुझ अपनी दासी की
  rationale: Latin में यह रूप असामान्य अनुवादगत संरचना है और सम्भवतः ‘मुझ, अपनी दासी की सुन ली’ का आशय रखता है। ‘दासी’ स्त्रीवाचकता और अधीन सेविका की सामाजिक स्थिति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: humilitatem meam
  choice: मेरी दीन दशा
  rationale: यहाँ humilitas नैतिक विनम्रता से अधिक अपमानित या नीची अवस्था को सूचित करता है; ‘दीन दशा’ इस संदर्भ में सहज है।
- source_word: tribulationi meae
  choice: मेरे क्लेश पर
  rationale: tribulatio के दुःख और संकट के भाव को ‘क्लेश’ संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: omnes cives mei
  choice: मेरे नगर के सभी लोग
  rationale: शाब्दिक ‘मेरे सभी नागरिक’ हिन्दी में वक्ता के शासक होने का भ्रामक संकेत दे सकता है; आशय उसके सहनागरिकों अथवा नगरवासियों से है।
- source_word: Fortem
  choice: सामर्थी
  rationale: विशेषण के संज्ञात्मक, ईश्वर-संबंधी प्रयोग को बनाए रखते हुए ‘सामर्थी’ उपाधि का भाव देता है और इसे सामान्य ‘शक्तिशाली व्यक्ति’ नहीं बनाता।
- source_word: honorificabamus
  choice: आदर करते थे
  rationale: क्रिया का अर्थ सम्मान देना या महिमा करना है; ‘आदर करते थे’ स्रोत के व्यापक अर्थ को बिना अतिरिक्त आराधनात्मक अर्थ जोड़े रखता है।
theological_decisions:
- issue: exaudivit me Deus ancillae tuae की असामान्य कारक-संरचना
  choice: परमेश्वर ने मुझ अपनी दासी की सुन ली
  alternative: तेरी दासी के परमेश्वर ने मेरी सुन ली
  rationale: Latin translationese में me के बाद ancillae tuae को उसी वक्ता का स्त्रीवाचक apposition समझना अधिक सम्भावित है। फिर भी पांडुलिपीय वाक्यरचना वैकल्पिक पाठ की गुंजाइश देती है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: Fortem को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: सामर्थी
  alternative: सर्वशक्तिमान
  rationale: Fortis का अर्थ ‘सामर्थी/बलवान’ है; ‘सर्वशक्तिमान’ स्रोत से अधिक विशिष्ट धर्मवैज्ञानिक दावा जोड़ देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। स्त्री वक्ता के संकेत सुरक्षित रखे गए हैं। स्रोत की असामान्य वाक्यरचना को मुख्य पाठ में पठनीय बनाया गया है, जबकि वास्तविक वैकल्पिक समझ पादटिप्पणी में दी गई है।
