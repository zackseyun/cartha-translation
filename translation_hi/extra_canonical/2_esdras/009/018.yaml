source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum in quo inhabitarent, et nemo contradixit mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/018.yaml
  text: And then[a], when I was preparing for them—for those who now exist—before the age was made for them in which they would dwell, no one contradicted me.
translation:
  language: hi
  text: और तब[a], जब मैं उनके लिए—अर्थात उनके लिए जो अब हैं—तैयारी कर रहा था, इससे पहले कि उनके लिए वह युग बनाया गया जिसमें वे बसें, किसी ने मेरा विरोध नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘तब’ को अंतिम उपवाक्य से भी जोड़ा जा सकता है: ‘…तब किसी ने मेरा विरोध नहीं किया।’ कुछ अन्य प्राचीन पाठ इसके बाद कारण जोड़ते हैं: ‘क्योंकि कोई था ही नहीं’; यह वाक्यांश इस लातीनी पाठ में नहीं है।'
    reason: लातीनी वाक्य में ‘तब’ के संबंध की संभावित अस्पष्टता और अन्य पाठ-परंपरा के प्रसिद्ध विस्तार को मुख्य पाठ में मिलाए बिना दर्ज करना।
lexical_decisions:
- source_word: et tunc
  choice: और तब
  rationale: दोनों संयोजक और कालवाचक तत्वों को स्पष्ट रूप से बनाए रखता है।
- source_word: parans eis
  choice: उनके लिए…तैयारी कर रहा था
  rationale: लातीनी पाठ में तैयारी की वस्तु अनिर्दिष्ट है; हिन्दी में कोई वस्तु जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: his qui nunc
  choice: अर्थात उनके लिए जो अब हैं
  rationale: यह ‘eis’ का पुनरुक्त स्पष्टीकरण है। मूल में ‘अब हैं’ के बाद अपेक्षित क्रिया निहित है, इसलिए अस्तित्व का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: saeculum
  choice: युग
  rationale: यहाँ संसार मात्र के बजाय निवास के लिए ठहराए गए काल/व्यवस्था का व्यापक और धर्मवैचारिक रूप से खुला अर्थ सुरक्षित रखता है।
- source_word: inhabitarent
  choice: वे बसें
  rationale: निवास करने के अर्थ को संक्षिप्त, स्वाभाविक और अधीनवाक्य के अनिश्चित/अभिप्रेत भाव सहित व्यक्त करता है।
- source_word: nemo contradixit mihi
  choice: किसी ने मेरा विरोध नहीं किया
  rationale: लातीनी वाक्य का सीधा अर्थ देता है और अन्य पाठ-परंपरा का ‘क्योंकि कोई था ही नहीं’ जैसा स्पष्टीकरण मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: सृष्टि-पूर्व अवस्था में विरोध करने वाले के अभाव का कारण
  choice: केवल ‘किसी ने मेरा विरोध नहीं किया’
  alternative: ‘किसी ने मेरा विरोध नहीं किया, क्योंकि कोई था ही नहीं’
  rationale: दिया गया प्राथमिक लातीनी पाठ कारणसूचक अतिरिक्त वाक्यांश नहीं रखता। वैकल्पिक विस्तार अन्य पाठ-परंपरा में मिलता है, पर उसे लातीनी मुख्य पाठ में मिलाना उचित नहीं।
- issue: ‘saeculum’ का आशय
  choice: युग
  alternative: संसार
  rationale: ‘युग’ काल, व्यवस्था और निर्मित निवास-परिस्थिति के बीच मूल की संभावित अर्थ-व्याप्ति को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। डैश द्वारा लातीनी ‘eis, his qui nunc’ की पुनरुक्त व्याख्यात्मक संरचना सुरक्षित रखी गई है।
