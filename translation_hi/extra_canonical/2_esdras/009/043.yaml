  text: She said to me, “I, your female servant, was barren and did not bear a child, though I had a husband for thirty years.”
translation:
  language: hi
  text: उसने मुझसे कहा, “मैं, आपकी दासी, बाँझ थी और तीस वर्ष तक पति होते हुए भी मैंने संतान नहीं जनी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: famula
  choice: दासी
  rationale: स्त्रीलिंग अधीन सेविका के अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; इस प्रसंग में ‘गुलाम स्त्री’ अनावश्यक रूप से कठोर और असहज होता।
- source_word: sterilis
  choice: बाँझ
  rationale: संतान उत्पन्न न कर सकने की अवस्था के लिए सीधा और प्रचलित हिन्दी शब्द।
- source_word: non peperi
  choice: संतान नहीं जनी
  rationale: लैटिन के प्रसव/जन्म देने के स्पष्ट अर्थ को बनाए रखता है और केवल ‘मेरे कोई बच्चा नहीं हुआ’ जैसी अप्रत्यक्ष अभिव्यक्ति से बचता है।
- source_word: habens maritum annis triginta
  choice: तीस वर्ष तक मेरा पति था
  rationale: पति होने की अवधि को लैटिन के निकट रखते हुए सहज हिन्दी में व्यक्त करता है; वाक्य स्वयं यह स्पष्ट नहीं करता कि पूरी अवधि में विवाह कायम था या पति अब जीवित है।
