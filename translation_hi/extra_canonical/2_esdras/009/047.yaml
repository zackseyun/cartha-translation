lexical_decisions:
- source_word: crevisset
  choice: वह बड़ा हो गया
  rationale: लातीनी क्रिया के वयस्क होने तक बढ़ने के स्वाभाविक अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: accipere illi uxorem
  choice: उसके लिए पत्नी लेने
  rationale: मूल में पिता द्वारा पुत्र के लिए पत्नी प्राप्त करने की क्रिया है; ‘उसका विवाह कराने’ की अपेक्षा यह मूल संरचना और सांस्कृतिक अभिव्यक्ति के अधिक निकट है।
- source_word: feci diem epuli
  choice: मैंने भोज का एक दिन रखा
  rationale: ‘भोज का दिन मनाया’ की तुलना में यह मूल लातीनी अभिव्यक्ति को निकटता से रखते हुए हिन्दी में बोधगम्य है।
