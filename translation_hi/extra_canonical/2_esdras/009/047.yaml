  text: And it happened, when he had grown up and I had come to take a wife for him, that I made a day of feasting.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह बड़ा हो गया और मैं उसके लिए पत्नी लेने आया, तब मैंने भोज का दिन मनाया।
