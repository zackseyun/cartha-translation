  yaml_path: translation/extra_canonical/2_esdras/009/037.yaml
  text: For the law does not perish[a], but remains in its honor.”
translation:
  language: hi
  text: क्योंकि व्यवस्था नष्ट नहीं होती[a], बल्कि अपने गौरव में बनी रहती है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर व्यवस्था नष्ट नहीं होती, और अपने गौरव में बनी रहती है।”
    reason: पूर्व प्रचलित पाठांतर को दर्ज करने के लिए; मुख्य पाठ लैटिन Nam…sed की ‘क्योंकि…बल्कि’ संरचना को अधिक ठीक रूप से दर्शाता है।
lexical_decisions:
- source_word: lex
  choice: व्यवस्था
  rationale: यह बाइबलीय संदर्भ में ‘व्यवस्था’ के लिए प्रचलित और अर्थपूर्ण हिन्दी शब्द है।
- source_word: non perit
  choice: नष्ट नहीं होती
  rationale: यह नाश या समाप्त हो जाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: permanet in suo honore
  choice: अपने गौरव में बनी रहती है
  rationale: यह व्यवस्था के स्थायी बने रहने और उसके सम्मानित गौरव की स्थिति—दोनों को व्यक्त करते हुए लैटिन संरचना के निकट रहता है।
theological_decisions:
- issue: व्यवस्था के स्थायित्व और सम्मान का संबंध
  choice: ‘नष्ट नहीं होती, बल्कि अपने गौरव में बनी रहती है’
  alternative: ‘नष्ट नहीं होती और अपना सम्मान बनाए रखती है’
  rationale: चुना हुआ पाठ non…sed के विरोधात्मक बल और in suo honore की अवस्थात्मक अस्पष्टता को बनाए रखता है; वैकल्पिक पाठ व्यवस्था को अधिक सक्रिय कर्ता बना देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी; ‘व्यवस्था’ बाइबलीय पारिभाषिक निरंतरता रखता है और ‘अपने गौरव में’ मूल की औपचारिक तथा धार्मिक गूँज को सुरक्षित रखता है।
