id: 2ES.9.13
reference: 2 Esdras 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti salvabuntur, et quorum saeculum et propter quos saeculum et quando.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/013.yaml
  text: Therefore do not be curious any longer about how the ungodly will be tormented, but inquire how the righteous will be saved, and whose the age is, and for whose sake the age is, and when.
translation:
  language: hi
  text: इसलिए अब इस बात को जानने की उत्सुकता मत रखो कि भक्तिहीन लोग किस प्रकार यातना पाएँगे; बल्कि यह जानने का प्रयत्न करो कि धर्मी लोग किस प्रकार उद्धार पाएँगे, और यह युग किसका है, किनके लिए यह युग है, और कब।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: curiosus esse
  choice: जानने की उत्सुकता रखना
  rationale: यहाँ निषिद्ध विषय के बारे में अत्यधिक जिज्ञासा रखने का भाव है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: impii
  choice: भक्तिहीन लोग
  rationale: लातीनी शब्द उन लोगों को सूचित करता है जिनमें परमेश्वर के प्रति श्रद्धा या निष्ठा नहीं है; ‘भक्तिहीन’ इस धार्मिक अर्थ को बनाए रखता है।
- source_word: cruciabuntur
  choice: यातना पाएँगे
  rationale: भविष्यकालीन निष्क्रिय क्रिया का सीधा और गरिमापूर्ण रूप।
- source_word: inquire
  choice: जानने का प्रयत्न करो
  rationale: सक्रिय खोज या छानबीन का भाव साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: iusti
  choice: धर्मी लोग
  rationale: धार्मिक साहित्य में न्यायी/धर्मनिष्ठ व्यक्तियों के लिए प्रचलित और सुस्पष्ट पद।
- source_word: salvabuntur
  choice: उद्धार पाएँगे
  rationale: भविष्यकालीन निष्क्रिय रूप और धार्मिक ‘बचाए जाने’ के व्यापक भाव को सुरक्षित रखता है।
- source_word: saeculum
  choice: युग
  rationale: यहाँ ‘संसार’ और ‘युग’ दोनों संभव हैं; प्रसंग और ‘कब’ के साथ कालगत अर्थ को ध्यान में रखते हुए ‘युग’ चुना गया है।
theological_decisions:
- issue: ‘quorum saeculum’ और ‘propter quos saeculum’ की अस्पष्टता
  choice: ‘यह युग किसका है, किनके कारण यह युग है’
  alternative: ‘संसार किनका है और किनके लिए संसार बनाया गया है’
  rationale: मूल पाठ स्वामित्व और कारण/निमित्त की संक्षिप्त, कुछ रहस्यमय अभिव्यक्ति रखता है। अनूदित पाठ में ‘बनाया गया’ जोड़कर सृष्टि-विषयक अर्थ को निश्चित नहीं किया गया।
- issue: ‘et quando’ का अपूर्ण प्रश्न
  choice: ‘और कब’
  alternative: ‘और वह कब आएगा’
  rationale: मूल में क्रिया या पूरक नहीं है; उसकी वास्तविक अपूर्णता और अर्थगत तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष उपदेशात्मक शैली रखी गई है। वाक्य के अंतिम समन्वित प्रश्नों की मूल-पाठीय संक्षिप्तता और अस्पष्टता को जानबूझकर नहीं सुलझाया गया।
