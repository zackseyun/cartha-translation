review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibitive exhortation, the future passive torment of the impious, and the salvation of the righteous. However, ‘किनके कारण यह युग है’ naturally reads as a causal claim (‘because of whom the age exists’), whereas propter quos is better represented here as ‘for whose sake/for whom,’ in line with the Latin and the English audit trail.
  naturalness: The Hindi is clear, dignified, and suitable for a formal scriptural register. Retaining the final ‘और कब’ appropriately preserves the Latin’s deliberately elliptical final question.
  terminology: ‘भक्तिहीन,’ ‘धर्मी,’ ‘यातना पाएँगे,’ and ‘उद्धार पाएँगे’ are appropriate modern Hindi religious-language choices and do not impose a doctrinal interpretation. ‘युग’ is a defensible rendering of saeculum in this context.
  issues:
  - severity: medium
    issue: ‘किनके कारण यह युग है’ for propter quos saeculum
    rationale: 'In modern Hindi, ‘किनके कारण’ ordinarily means ‘because of whom’ and changes the phrase toward efficient causation. Latin propter quos more directly indicates purpose, benefit, or regard: ‘for whom/for whose sake.’'
  revised_text: इसलिए अब इस बात को जानने की उत्सुकता मत रखो कि भक्तिहीन लोग किस प्रकार यातना पाएँगे; बल्कि यह जानने का प्रयत्न करो कि धर्मी लोग किस प्रकार उद्धार पाएँगे, और यह युग किसका है, किनके लिए यह युग है, और कब।
