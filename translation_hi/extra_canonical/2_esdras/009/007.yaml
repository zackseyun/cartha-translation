id: 2ES.9.7
reference: 2 Esdras 9:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit, omnis qui salvus factus fuerit et qui poterit effugere per opera sua vel per fidem in qua credidit, is
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/007.yaml
  text: And it shall be that everyone who is saved[a], and who is able to escape by his works or by the faith in which he believed,
translation:
  language: hi
  text: और ऐसा होगा कि हर वह व्यक्ति जो बचाया गया होगा[a], और जो अपने कामों के द्वारा या उस विश्वास के द्वारा, जिस पर उसने विश्वास किया था, बच निकल सकेगा, वह—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हर वह व्यक्ति जो बचाया गया है,”
    reason: वाक्य के आरम्भ और salvus factus fuerit के काल को अधिक सामान्य ढंग से समझने वाला वैकल्पिक पाठ।
lexical_decisions:
- source_word: et erit
  choice: और ऐसा होगा कि
  rationale: भविष्यसूचक उद्घोषणा के भाव और स्पष्ट भविष्यकाल को बनाए रखता है।
- source_word: omnis qui salvus factus fuerit
  choice: हर वह व्यक्ति जो बचाया गया होगा
  rationale: लैटिन के कर्मवाच्य और पूर्ण भविष्यकाल को यथासंभव सुरक्षित रखता है।
- source_word: effugere
  choice: बच निकल सकेगा
  rationale: संकट या न्याय से निकल जाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: per opera sua
  choice: अपने कामों के द्वारा
  rationale: opera का सामान्य और नैतिक रूप से खुला अर्थ रखता है; इसे विशिष्ट धार्मिक कर्मकांड तक सीमित नहीं करता।
- source_word: per fidem in qua credidit
  choice: उस विश्वास के द्वारा, जिस पर उसने विश्वास किया था
  rationale: मूल की कुछ असामान्य पुनरुक्ति को सुरक्षित रखता है और विश्वास की विषयवस्तु को अनिर्दिष्ट छोड़ता है।
- source_word: is
  choice: वह—
  rationale: वाक्य अगले पद में पूरा होता है; अंतिम सर्वनाम और अपूर्ण वाक्य-संरचना को बनाए रखने के लिए डैश लगाया गया है।
theological_decisions:
- issue: उद्धार और कामों अथवा विश्वास का संबंध
  choice: ‘अपने कामों के द्वारा या उस विश्वास के द्वारा’ को ज्यों का त्यों रखा गया है
  alternative: ‘कामों और विश्वास के प्रमाण से’ जैसे समन्वयकारी अर्थ में अनुवाद करना
  rationale: स्रोत में vel (‘या’) है। अनुवाद को इस धार्मिक तनाव को किसी व्यवस्थित मत के अनुसार हल नहीं करना चाहिए।
- issue: salvus factus fuerit का कर्ता
  choice: कर्मवाच्य ‘बचाया गया होगा’
  alternative: भाववाच्य ‘बच गया होगा’
  rationale: कर्मवाच्य स्रोत की व्याकरणिक बनावट और उद्धार दिए जाने की संभावित ध्वनि को बनाए रखता है, बिना कर्ता का नाम जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी। भविष्यसूचक ‘और ऐसा होगा कि’ तथा पद के अंत की जानबूझकर अधूरी संरचना को सुरक्षित रखा गया है।
