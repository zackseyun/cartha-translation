  language: hi
  text: और वे सभी जिन्होंने मेरी व्यवस्था को तुच्छ जाना, जबकि उनके पास अब भी स्वतंत्रता थी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fastidierunt
  choice: तुच्छ जाना
  rationale: लातीनी क्रिया यहाँ घृणा, उपेक्षा या तिरस्कार का भाव रखती है; ‘तुच्छ जाना’ आधुनिक हिन्दी में इस नैतिक अस्वीकार को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: legem meam
  choice: मेरी व्यवस्था
  rationale: ‘व्यवस्था’ बाइबिलीय संदर्भ में lex के लिए प्रचलित है और केवल एक अलग नियम नहीं, बल्कि परमेश्वर द्वारा दी गई समग्र व्यवस्था का संकेत दे सकती है।
- source_word: habentes libertatem
  choice: उनके पास अब भी स्वतंत्रता थी
  rationale: मूल के शाब्दिक भाव ‘स्वतंत्रता रखते थे’ को सहज हिन्दी में रखा गया है; स्वतंत्रता किस अर्थ में है, इसे मूल की तरह अनिर्धारित छोड़ा गया है।
theological_decisions:
- issue: libertas का आशय
  choice: स्वतंत्रता
  alternative: चुनने की स्वतंत्रता / अवसर
  rationale: मूल पाठ केवल libertatem कहता है। इसे स्पष्ट रूप से स्वतंत्र इच्छा या पश्चाताप के अवसर के रूप में सीमित करना व्याख्यात्मक होता, इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; वाक्यांश की अपूर्ण/संयोजक प्रकृति बनाए रखने के लिए आरम्भ में ‘और’ तथा अंत में अल्पविराम रखा गया है।
