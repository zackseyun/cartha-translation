translation:
  language: hi
  text: तब तुम समझोगे कि परमप्रधान ने इन बातों के विषय में पहले के दिनों से, आरम्भ से कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Altissimus
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि का स्वाभाविक और अर्थ-सटीक हिन्दी रूप है।
- source_word: de his
  choice: इन्हीं बातों के विषय में
  rationale: ‘इन्हीं’ संकेतवाचक बल को बनाए रखता है और निकटवर्ती विषयों की ओर संकेत करता है।
- source_word: a diebus qui fuerunt ante ab initio
  choice: आरम्भ से ही, पहले के दिनों में
  rationale: लैटिन की दोहरी काल-सूचना—‘पहले के दिन’ और ‘आरम्भ से’—को बिना किसी विशेष सृष्टितात्त्विक अर्थ को थोपे सुरक्षित रखा गया है।
theological_decisions:
- issue: परमप्रधान के पूर्वकालीन कथन का समय
  choice: आरम्भ से ही, पहले के दिनों में
  alternative: आरम्भ से पहले के दिनों में
  rationale: वैकल्पिक पाठ ऐसा अर्थ दे सकता है मानो ये दिन स्वयं ‘आरम्भ’ से पहले थे। चुना हुआ रूप मूल की असामान्य कालगत अभिव्यक्ति और उसके तनाव को बनाए रखते हुए उस निष्कर्ष को अनिवार्य नहीं बनाता।
