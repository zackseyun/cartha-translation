id: 2ES.9.32
reference: 2 Esdras 9:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nam patres nostri accipientes legem non servaverunt et legitima mea non custodierunt. et factum est fructumlegis non periens; nec enim poterat, quoniam tuus erat.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/032.yaml
  text: Yet our fathers, after receiving the law, did not keep it and did not observe my statutes. And the fruit of the law did not perish, for it could not, because it was yours.
translation:
  language: hi
  text: फिर भी हमारे पूर्वजों ने व्यवस्था पाकर उसका पालन नहीं किया और मेरी विधियों को नहीं माना। पर व्यवस्था का फल नष्ट नहीं हुआ, क्योंकि वह नष्ट हो ही नहीं सकता था, क्योंकि वह तुम्हारा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patres nostri
  choice: हमारे पूर्वजों
  rationale: यहाँ लैटिन patres वंशगत पुरखों को सूचित करता है; आधुनिक हिन्दी में ‘पूर्वज’ स्वाभाविक और समावेशी है।
- source_word: legem
  choice: व्यवस्था
  rationale: बाइबलीय प्रसंग में lex से परमेश्वर की दी हुई व्यवस्था अभिप्रेत है; ‘व्यवस्था’ प्रचलित और उपयुक्त पद है।
- source_word: legitima mea
  choice: मेरी विधियों
  rationale: mea को स्पष्ट रखा गया है और legitima के लिए ऐसे निर्धारित नियमों का बोध कराने वाला ‘विधियाँ’ चुना गया है।
- source_word: fructum legis
  choice: व्यवस्था का फल
  rationale: मूल रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: non periens
  choice: नष्ट नहीं हुआ
  rationale: वाक्य में अपेक्षित पूर्ण क्रियात्मक अर्थ के अनुसार non periens को ‘नष्ट नहीं हुआ’ रूप में व्यक्त किया गया है।
- source_word: tuus erat
  choice: वह तुम्हारा था
  rationale: सर्वनाम tuus की अस्पष्ट संदर्भ-संरचना को मूल के अनुरूप बनाए रखा गया है; उसे ‘हे परमेश्वर’ जैसे विस्तार से नहीं सुलझाया गया।
theological_decisions:
- issue: ‘व्यवस्था का फल’ और उसके स्वामित्व का आशय
  choice: रूपक और ‘तुम्हारा था’ को यथावत अस्पष्ट रखा गया
  alternative: फल को परमेश्वर के लोगों, प्रतिफल या धार्मिकता के रूप में स्पष्ट करना
  rationale: लैटिन पाठ स्वयं फल की पहचान नहीं करता; किसी खास धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ना उचित नहीं होगा।
- issue: व्यवस्था के फल का अविनाशी होना
  choice: ‘वह नष्ट हो ही नहीं सकता था’
  alternative: ‘उसका नष्ट होना असंभव था’
  rationale: nec enim poterat की सामर्थ्य-असम्भवता को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है, बिना इसका अतिरिक्त कारण गढ़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘फिर भी’ पिछले विचार से विरोध दर्शाता है और ‘पर’ अगले वाक्य में मानव की अवज्ञा तथा व्यवस्था के फल के बने रहने का विरोध स्पष्ट करता है।
