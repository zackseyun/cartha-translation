  text: acceperunt perierunt non custodientes quod in eis seminatum fuerat. Et ecce consuetudo est ut, cum acceperit terra semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/033.yaml
  text: For those who received it perished[a], because they did not keep what had been sown in them. And behold, it is the custom that, when the earth has received seed,
translation:
  language: hi
  text: क्योंकि जिन्होंने उसे ग्रहण किया था, वे नष्ट हो गए[a], इसलिए कि उन्होंने उस बात को सँभालकर नहीं रखा जो उनके भीतर बोई गई थी। और देखो, यह रीति है कि जब भूमि बीज ग्रहण करती है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु जिन्होंने उसे ग्रहण किया था, वे नष्ट हो गए।”
    reason: पूर्ववर्ती पाठ-रूप में आरंभिक संबंध को विरोधसूचक समझने की संभावना दर्ज करने के लिए।
lexical_decisions:
- source_word: acceperunt
  choice: ग्रहण किया
  rationale: यहाँ पहले कर्म का संकेत पिछले संदर्भ में दी गई व्यवस्था की ओर है; ‘ग्रहण किया’ लैटिन की पुनरावृत्ति और औपचारिक भाव बनाए रखता है।
- source_word: perierunt
  choice: नष्ट हो गए
  rationale: यह लैटिन क्रिया के प्रबल अर्थ को स्वाभाविक और धर्मशास्त्रीय रूप से अनिर्दिष्ट हिंदी में व्यक्त करता है।
- source_word: custodientes
  choice: सुरक्षित नहीं रखा
  rationale: custodire का अर्थ सँभालकर रखना/रक्षा करना है; यह केवल पालन करने की तुलना में बोए गए बीज के रूपक से बेहतर मेल खाता है।
- source_word: seminatum fuerat
  choice: बोई गई थी
  rationale: लैटिन के पूर्ण कर्मवाच्य और बीज-वपन के रूपक को बनाए रखा गया है।
- source_word: consuetudo est
  choice: यह रीति है
  rationale: शाब्दिक ‘प्रथा’ की अपेक्षा भूमि और बीज की सामान्य प्रक्रिया के संदर्भ में ‘रीति’ अधिक स्वाभाविक है, जबकि कथन की संरचना सुरक्षित रहती है।
- source_word: terra
  choice: भूमि
  rationale: बीज ग्रहण करने वाली धरती के कृषि-संदर्भ में यह स्पष्ट और गरिमापूर्ण विकल्प है।
theological_decisions:
- issue: आरंभिक संबंधसूचक अव्यय
  choice: क्योंकि
  alternative: परन्तु
  rationale: 'साक्ष्य-संदर्भ में उपस्थित nam पिछले कथन का कारण बताता है: व्यवस्था का फल नहीं, बल्कि उसे ग्रहण करने वाले नष्ट हुए।'
- issue: जो बोया गया था उसका आशय
  choice: उस बात को
  alternative: उसे
  rationale: नपुंसकलिंगी quod का संदर्भ जानबूझकर व्यापक रखा गया है; ‘उस बात’ हिंदी में समझने योग्य है और इसे किसी विशिष्ट सिद्धान्त तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और स्रोत की कृषि-संबंधी रूपक-भाषा के निकट। पद अगले वाक्य में जारी रहने वाला खंड है, इसलिए अंत में अल्पविराम रखा गया है।
