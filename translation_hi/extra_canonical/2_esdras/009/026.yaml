  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उपलब्ध लैटिन अंश के आरम्भ में केवल ‘Ardat’ बचा है, इसलिए पूर्ववर्ती कथन की पूर्ति के लिए परामर्श-पाठ में सुरक्षित वाक्य-संदर्भ—‘जैसा उसने मुझसे कहा था... अरदात नाम के मैदान में गया’—को अपनाया गया है। अंत का ‘Et factum est post dies’ अगले वाक्य/पद का आरम्भ प्रतीत होता है, इसलिए इसे 9:26 में शामिल नहीं किया गया।
