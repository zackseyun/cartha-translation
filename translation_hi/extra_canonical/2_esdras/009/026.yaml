  text: Ardat, et sedi ibi in floribus et de herbis agri manducaui et facta est esca earum in saturitatem. Et factum est post dies
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/026.yaml
  text: So I went[a], as he told me, into the field called Ardat, and I sat there among the flowers. I ate the herbs of the field, and their food satisfied me.
translation:
  language: hi
  text: तब मैं, जैसा उसने मुझसे कहा था, अरदात नाम के मैदान में गया और वहाँ फूलों के बीच बैठ गया। मैंने मैदान की जड़ी-बूटियाँ खाईं, और उनसे मिला भोजन मुझे तृप्त करने के लिए पर्याप्त था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ardat
  choice: अरदात
  rationale: स्थान के नाम का देवनागरी लिप्यंतरण; इसे अर्थानुवाद नहीं किया गया।
- source_word: in floribus
  choice: फूलों के बीच
  rationale: लैटिन बहुवचन का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: herbis agri
  choice: मैदान की जड़ी-बूटियाँ
  rationale: herbae के खाद्य वनस्पतियों वाले व्यापक अर्थ को रखते हुए agri के संबंध को स्पष्ट किया गया।
- source_word: esca earum
  choice: उनसे मिला भोजन
  rationale: earum को स्रोत/सामग्रीसूचक मानकर ऐसा रूप चुना गया जिससे यह भ्रम न हो कि भोजन जड़ी-बूटियों का अपना आहार था।
- source_word: in saturitatem
  choice: मुझे तृप्त करने के लिए पर्याप्त था
  rationale: तृप्ति या भरपेट होने के परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions: []
