  text: And behold[a], it is the custom that when the earth receives seed, or the sea a ship, or any other vessel food or drink,
translation:
  language: hi
  text: 'और देखो, यह रीति है: जब धरती बीज को ग्रहण करती है, समुद्र जहाज़ को ग्रहण करता है, या कोई अन्य पात्र[a] भोजन अथवा पेय को ग्रहण करता है,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कम सटीक रूप में, “कोई पात्र भोजन अथवा पेय को।”
    reason: पूर्व अनुवाद में लैटिन ‘aliud’ (‘अन्य’) छूट गया था; टिप्पणी उस पुराने पाठांतर को दर्ज करती है, जबकि मुख्य पाठ मूल के स्पष्ट शब्द को सुरक्षित रखता है।
lexical_decisions:
- source_word: mare
  choice: समुद्र
  rationale: लैटिन सूची में समुद्र को जहाज़ ग्रहण करने वाले स्थान के रूप में रखा गया है।
- source_word: uas aliud
  choice: कोई अन्य पात्र
  rationale: ‘aliud’ का अर्थ ‘अन्य’ है; इसे बनाए रखने से धरती, समुद्र और पात्र—इन सबको ग्रहण करने वाली वस्तुओं के रूप में जोड़ने वाला मूल अलंकार सुरक्षित रहता है।
- source_word: escas uel potus
  choice: भोजन अथवा पेय
  rationale: बहुवचन ‘escas’ और पाठ में आए ‘potus’ का स्वाभाविक हिन्दी सामूहिक रूप; ‘uel’ के विकल्पसूचक भाव को ‘अथवा’ से व्यक्त किया गया है।
