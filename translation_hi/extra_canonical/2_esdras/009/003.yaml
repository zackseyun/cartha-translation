lexical_decisions:
- source_word: populorum turbatio
  choice: लोगों में उलझन
  rationale: ‘turbatio’ की अव्यवस्था/व्याकुलता की व्यापकता को बनाए रखते हुए आधुनिक और सहज हिन्दी चुनी गई है।
- source_word: gentium cogitationes
  choice: जातियों के मन में विचार
  rationale: ‘cogitationes’ को तटस्थ ‘विचार’ के रूप में रखा गया है; इसे ‘षड्यंत्र’ मानकर नकारात्मक अर्थ आरोपित नहीं किया गया। हिन्दी में स्वाभाविकता के लिए ‘मन में’ जोड़ा गया है।
- source_word: ducum inconstantia
  choice: अगुओं में अस्थिरता
  rationale: ‘ducum’ के लिए व्यापक ‘अगुओं’ चुना गया, ताकि इसे केवल सैनिक सेनापतियों तक सीमित न किया जाए; ‘inconstantia’ का सीधा भाव ‘अस्थिरता’ है।
- source_word: principum turbatio
  choice: शासकों में खलबली
  rationale: ‘principum’ को शासनाधिकार रखने वालों के अर्थ में ‘शासकों’ और पुनरुक्त ‘turbatio’ को प्रसंगानुकूल ‘खलबली’ से व्यक्त किया गया है।
- source_word: Tunc intelleges quoniam de his erat altissimus
  choice: तब तुम समझोगे कि इन्हीं बातों के विषय में परमप्रधान ने—
  rationale: खंडित लैटिन वाक्य अगले अंश में पूरा होता है। ‘altis-’ को पांडुलिपीय पंक्ति-विच्छेद के कारण ‘altissimus’ समझते हुए ‘परमप्रधान’ किया गया, पर वाक्य को हिन्दी में कृत्रिम रूप से पूरा नहीं किया गया।
theological_decisions:
- issue: परमप्रधान से संबंधित अधूरा उपवाक्य
  choice: वाक्य को डैश और पादटिप्पणी के साथ अधूरा रखा गया
  alternative: अगले पद की संभावित क्रिया जोड़कर वाक्य पूरा करना
  rationale: दिए गए स्रोत का पाठ ‘altis-’ पर रुकता है; अनुपलब्ध शब्द जोड़ना स्रोत से आगे जाकर धर्मवैचारिक या अर्थगत निष्कर्ष थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर संज्ञात्मक सूची की लय सुरक्षित है। ‘जातियाँ’, ‘अगुए’, ‘शासक’ और ‘परमप्रधान’ बाइबिलीय संदर्भ के अनुकूल हैं, जबकि ‘विचार’ मूल की वास्तविक अस्पष्टता बनाए रखता है।
