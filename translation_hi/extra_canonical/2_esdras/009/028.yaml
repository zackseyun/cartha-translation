  text: And my mouth was opened, and I began to speak before the Most High, and I said,
translation:
  language: hi
  text: और मेरा मुँह खुल गया, और मैंने बोलना शुरू किया…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी पाठ यहाँ ‘और मैंने आरम्भ किया’ पर रुक जाता है। अंग्रेज़ी परामर्श-पाठ आगे ‘परमप्रधान के सामने…और मैंने कहा’ पढ़ता है।
    reason: लातीनी स्रोत की अपूर्णता और अंग्रेज़ी परामर्श-पाठ के विस्तृत रूप को पारदर्शी ढंग से बताना।
lexical_decisions:
- source_word: apertum est os meum
  choice: मेरा मुँह खुल गया
  rationale: लातीनी निष्क्रिय अभिव्यक्ति का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: inchoaui
  choice: मैंने बोलना शुरू किया
  rationale: क्रिया का अर्थ ‘मैंने आरम्भ किया’ है; निकटवर्ती ‘मुँह खुलने’ के प्रसंग से हिन्दी में ‘बोलना’ स्पष्ट किया गया है।
theological_decisions:
- issue: अंग्रेज़ी परामर्श-पाठ में ‘परमप्रधान के सामने’ और ‘मैंने कहा’ का होना
  choice: इन शब्दों को मुख्य पाठ में शामिल नहीं किया गया
  alternative: ‘और मैंने परमप्रधान के सामने बोलना शुरू किया और कहा,’
  rationale: दिए गए लातीनी स्रोत में ये शब्द उपस्थित नहीं हैं; इसलिए धार्मिक संबोधन या कथन-सूत्र को स्रोत-साक्ष्य के बिना नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। आरम्भिक ‘और’ से पिछले वाक्य के साथ संबंध बना रहता है। स्रोत में इससे पहले आया ‘turbabatur sicut et ante’ संभवतः पिछले पद/वाक्य का शेष अंश है, इसलिए 9:28 के मुख्य पाठ में उसे नहीं रखा गया।
