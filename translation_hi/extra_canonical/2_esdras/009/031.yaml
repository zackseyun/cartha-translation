  text: Iacob intendite sermonibus meis. Ecce enim semino in uobis legem meam, et faciet in uobis fructum, et glorificabimini in eo per saeculum. Nam patres nostri accipientes legem non seruauerunt et legitima non custodierunt, et factus est fructus legis non periens; nec enim poterat quoniam tuus erat. Nam qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/031.yaml
  text: For behold, I sow my law in you, and it will bear fruit in you, and by it you will be glorified forever.’
translation:
  language: hi
  text: देखो, मैं अपनी व्यवस्था तुममें बोता हूँ; वह तुममें फल उत्पन्न करेगी, और उसी में तुम सदा के लिए महिमान्वित किए जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce enim
  choice: क्योंकि देखो
  rationale: ‘enim’ के कारणसूचक संबंध और ‘ecce’ के ध्यान आकर्षित करने वाले बल—दोनों को बनाए रखता है।
- source_word: legem meam
  choice: अपनी व्यवस्था
  rationale: धार्मिक-साहित्यिक संदर्भ में ‘lex’ के लिए ‘व्यवस्था’ स्वाभाविक और व्यापक हिन्दी पद है।
- source_word: in uobis
  choice: तुम्हारे भीतर
  rationale: Latin ‘in’ को आंतरिक रोपण और फलने की छवि के अनुरूप व्यक्त करता है; इसे केवल ‘तुम्हारे बीच’ मानकर सीमित नहीं करता।
- source_word: faciet in uobis fructum
  choice: वह तुम्हारे भीतर फल लाएगी
  rationale: बीज बोने की रूपक-श्रृंखला बनाए रखते हुए Latin अभिव्यक्ति का सहज हिन्दी रूप देता है।
- source_word: glorificabimini in eo
  choice: उसके द्वारा तुम महिमान्वित किए जाओगे
  rationale: नपुंसकलिंग ‘eo’ का निकटतम संदर्भ व्यवस्था है; ‘के द्वारा’ साधनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: per saeculum
  choice: सदा के लिए
  rationale: इस प्रसंग में दीर्घकालिक/अनंत अवधि का सामान्य और स्पष्ट हिन्दी रूप।
theological_decisions:
- issue: व्यवस्था मनुष्य के भीतर बोई जाती है या समुदाय के बीच
  choice: तुम्हारे भीतर
  alternative: तुम्हारे बीच
  rationale: ‘in uobis’ दोनों अर्थ दे सकता है, पर बीज के भीतर फल लाने की अगली छवि आंतरिक अर्थ का समर्थन करती है।
- issue: ‘in eo’ का संबंध और अर्थ
  choice: उसके द्वारा
  alternative: उसमें
  rationale: व्यवस्था को महिमा का साधन मानने वाला अर्थ प्रसंग में सहज है, यद्यपि Latin वाक्यांश स्थानात्मक ‘उसमें’ भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध धार्मिक शैली। एकवचन वक्ता और बहुवचन संबोधन सुरक्षित रखे गए हैं; बोने और फलने की मूल रूपक-श्रृंखला अक्षुण्ण है।
