  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘हर घड़ी, हर दिन’ और ‘रात-दिन’ का आंशिक पुनरुक्ति-बल मूल लैटिन के जानबूझकर दिए गए निरंतरता-सूचक जोर के कारण रखा गया है।
