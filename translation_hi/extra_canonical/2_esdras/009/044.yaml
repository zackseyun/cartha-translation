  text: For every hour and every day throughout those thirty years I kept praying to the Most High night and day.
translation:
  language: hi
  text: क्योंकि उन तीस वर्षों के दौरान मैं हर घड़ी, हर दिन, रात-दिन परमप्रधान से विनती करता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deprecabar
  choice: विनती करता रहा
  rationale: लैटिन क्रिया का अर्थ लगातार प्रार्थनापूर्वक याचना करना है; अपूर्ण भूतकाल की निरंतरता को ‘करता रहा’ व्यक्त करता है।
- source_word: Altissimum
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त लैटिन उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य।
- source_word: per singulas horas et per singulos dies
  choice: हर घड़ी, हर दिन
  rationale: दोहराव और निरंतरता पर दिए गए मूल पाठ के बल को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: nocte ac die
  choice: रात-दिन
  rationale: मूल के सतत प्रार्थना करने के मुहावरेदार बल को सुरक्षित रखता है।
theological_decisions: []
