id: 2ES.9.17
reference: 2 Esdras 9:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qualis ager, talia et semina, et quales flores, tales et tincturae, et qualis opera, talis et creatio, et qualis agricola, talis et area. quoniam tempus erat saeculi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/017.yaml
  text: He answered me and said[a], “As the field is, so also are the seeds; and as the flowers are, so also are the colors; and as the work is, so also is the creation; and as the farmer is, so also is the threshing floor. For there was a time of the age,”
translation:
  language: hi
  text: “जैसा खेत होता है, वैसे ही बीज होते हैं; जैसे फूल होते हैं, वैसे ही रंग होते हैं; जैसा काम होता है, वैसी ही सृष्टि होती है; और जैसा किसान होता है, वैसा ही खलिहान होता है। क्योंकि युग का समय था[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि संसार-व्यवस्था का समय था।”
    reason: लातिनी saeculi का अर्थ ‘युग’ के साथ-साथ ‘संसार’ या वर्तमान विश्व-व्यवस्था भी हो सकता है।
lexical_decisions:
- source_word: qualis … talia / tales / talis
  choice: जैसा … वैसे ही / वैसी ही
  rationale: लातिनी तुलना की बार-बार आने वाली समानांतर संरचना को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: tincturae
  choice: रंग
  rationale: फूलों के संदर्भ में इसका सीधा और सामान्य अर्थ ‘रंग’ है; ‘रंगाई’ यहाँ कम स्वाभाविक होगी।
- source_word: opera
  choice: काम
  rationale: शब्द की व्यापकता बनाए रखता है और उसे केवल ‘कारीगरी’ या किसी खास प्रकार के कार्य तक सीमित नहीं करता।
- source_word: creatio
  choice: सृष्टि
  rationale: रचे हुए जगत अथवा सृजन के परिणाम के लिए प्रचलित, गरिमापूर्ण हिन्दी शब्द।
- source_word: agricola
  choice: किसान
  rationale: आधुनिक पाठक के लिए सहज और मूल अर्थ के अनुरूप।
- source_word: area
  choice: खलिहान
  rationale: कृषि-संदर्भ में दाँवने के स्थान का स्वाभाविक हिन्दी प्रतिरूप।
- source_word: tempus … saeculi
  choice: युग का समय
  rationale: मूल की असामान्य पर अर्थपूर्ण पदावली और अगले पद से उसके काल-संबंध को बनाए रखता है; ‘ऐसा समय’ नहीं जोड़ा गया, क्योंकि मूल में कोई संकेतवाचक शब्द नहीं है।
theological_decisions:
- issue: saeculum का अर्थ-क्षेत्र
  choice: युग
  alternative: संसार / संसार-व्यवस्था
  rationale: यहाँ tempus के साथ कालगत अर्थ प्रमुख है, इसलिए ‘युग’ चुना गया; फिर भी लातिनी शब्द में वर्तमान विश्व-व्यवस्था का भाव भी संभव है, जिसे पाद-टिप्पणी में खुला रखा गया है।
- issue: वचन-परिचय का समावेश
  choice: दिए गए लातिनी स्रोत में अनुपस्थित ‘उसने मुझे उत्तर देकर कहा’ को नहीं जोड़ा गया
  alternative: अंग्रेज़ी परामर्श-पाठ के अनुसार वचन-परिचय जोड़ना
  rationale: प्रस्तुत मूल-पाठ सीधे तुलना से आरम्भ होता है; स्रोत में आधार न होने पर कथन-परिचय जोड़ना उचित नहीं। उद्धरण-चिह्न से यह संकेत बना रहता है कि यह चल रहे प्रत्यक्ष कथन का अंश है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की चार समानांतर तुलनाओं को जानबूझकर दोहराव सहित सुरक्षित रखा गया है। अंतिम वाक्यांश अगले पद की ओर बढ़ता प्रतीत होता है, इसलिए उसकी कुछ असामान्य, अधूरी-सी संरचना को सहज बनाने के नाम पर बदला नहीं गया।
