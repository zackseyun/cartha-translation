  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/001.yaml
  text: He answered me and said[a], “Measure carefully within yourself, and when you see that some part of the signs foretold has passed by,
translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “अपने भीतर ध्यान से मापो[a]। और जब तुम देखो कि पहले से बताए गए चिन्हों का कुछ भाग बीत चुका है, तब तुम समझोगे कि ठीक वही समय है—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने भीतर मापो।”
    reason: लैटिन metiens metire का जोरदार, लगभग पुनरुक्त रूप मापने की आज्ञा पर बल देता है; मुख्य पाठ में ‘ध्यान से’ उस बल को स्वाभाविक हिंदी में व्यक्त करता है।
lexical_decisions:
- source_word: metiens metire
  choice: बहुत ध्यान से मापकर देखो
  rationale: सहभागी कृदंत और आज्ञार्थक क्रिया की पुनरुक्ति मापने की क्रिया पर बल देती है; स्वाभाविक हिन्दी में ‘बहुत ध्यान से’ उस बल को व्यक्त करता है। ‘देखो’ जोड़ने से आत्म-परीक्षण के रूप में प्रयुक्त रूपक सहज बनता है।
- source_word: in temetipso
  choice: अपने भीतर
  rationale: यह शाब्दिक अर्थ ‘स्वयं अपने अंदर’ को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल ‘मन’ तक सीमित किए।
- source_word: transiuit
  choice: घट चुके हैं
  rationale: चिन्हों के संदर्भ में इसका अर्थ उनके बीत जाने, अर्थात् पूरा होकर घटित हो जाने से है; ‘घट चुके हैं’ हिन्दी में इसे स्पष्ट रखता है।
- source_word: ipsum est
  choice: यही वह समय है—
  rationale: लैटिन वाक्यांश अगले कथन की ओर संकेत करता है; प्रसंग से निहित ‘समय’ को हिन्दी में पूरा करना आवश्यक है। अंत का दीर्घ विराम दर्शाता है कि विचार आगे जारी है।
theological_decisions:
- issue: संकेतों के बीतने और उनके पूरा होने का संबंध
  choice: कुछ घट चुके हैं
  alternative: चिन्हों का कुछ भाग बीत चुका है
  rationale: चुना हुआ रूप भविष्यवाणी के चिन्हों के ऐतिहासिक रूप से घटित होने का सामान्य अर्थ देता है, पर यह निर्धारित नहीं करता कि वे किस विशेष घटना में पूरे हुए।
- issue: ipsum est में निहित संज्ञा
  choice: यही वह समय है—
  alternative: वही है—
  rationale: अकेला ‘वही है’ हिन्दी में अस्वाभाविक और अस्पष्ट होगा। निकटवर्ती निरंतर प्रसंग में ‘समय’ निहित है; फिर भी दीर्घ विराम द्वारा वाक्य के अगले पद में जारी रहने को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने भीतर’ मूल रूपक और उसकी जानबूझकर रखी गई अस्पष्टता को बनाए रखता है। अंतिम दीर्घ विराम स्रोत-पाठ के अधूरे, अगले पद में जारी होने वाले वाक्य को दर्शाता है।
