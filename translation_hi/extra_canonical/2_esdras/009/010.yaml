  yaml_path: translation/extra_canonical/2_esdras/009/010.yaml
  text: For all who did not know me while they were alive, though they had received benefits,
translation:
  language: hi
  text: क्योंकि जितने लोगों ने जीवित रहते हुए मुझे नहीं जाना, यद्यपि उन्होंने उपकार प्राप्त किए थे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot
  choice: जितने लोगों ने
  rationale: यह अनिश्चित किन्तु सर्वसमावेशी संख्या को व्यक्त करता है और आगे के वाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: non cognoverunt me
  choice: मुझे नहीं जाना
  rationale: cognoscere का सीधा अर्थ ‘जानना/पहचानना’ है; यहाँ धार्मिक संबंध की सम्भावित गहराई को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: viventes
  choice: जीवित रहते हुए
  rationale: लैटिन वर्तमान कृदंत का कालगत अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: beneficia consecuti
  choice: भलाई के वरदान पाए थे
  rationale: beneficia प्राप्त उपकारों या लाभकारी दानों को सूचित करता है; ‘भलाई के वरदान’ दाता की पहचान जोड़े बिना सकारात्मक, प्रदत्त लाभ का भाव रखता है।
theological_decisions:
- issue: ‘मुझे जानना’ का अर्थ
  choice: मुझे नहीं जाना
  alternative: मुझ पर विश्वास नहीं किया
  rationale: मूल पाठ ज्ञान/पहचान की भाषा प्रयोग करता है, स्पष्टतः विश्वास की नहीं; इसलिए सम्भावित धार्मिक संबंधगत अर्थ को खुला रखा गया है।
- issue: beneficia का स्रोत
  choice: भलाई के वरदान पाए थे
  alternative: मुझसे उपकार पाए थे
  rationale: इस खंड में लैटिन प्राप्त लाभों का उल्लेख करता है, पर ‘मुझसे’ स्पष्ट रूप से नहीं कहता; स्रोत को जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पद मूल में अधूरा आश्रित वाक्यांश है, इसलिए अंत में अल्पविराम रखा गया है ताकि अगले पद से उसका संबंध बना रहे।
