  text: hoc parato et mensa indeficienti et lege inuestigabili, corrupti sunt moribus eorum. Et consideraui saeculum meum et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/019.yaml
  text: But those created in this prepared world[a], with an unfailing table and an unsearchable law, have been corrupted in their ways. And I considered my age, and behold,
translation:
  language: hi
  text: परन्तु इस तैयार किए हुए संसार में रचे गए लोग, एक कभी न चुकनेवाली मेज़ और एक अगम्य व्यवस्था के होते हुए भी, अपने आचरण में भ्रष्ट हो गए। और मैंने अपने युग पर विचार किया, और देखो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hoc parato
  choice: इस तैयार किए हुए संसार में
  rationale: निकटवर्ती संदर्भ और अंग्रेज़ी परामर्श-पाठ के आधार पर hoc को तैयार किए गए संसार की ओर संकेत मानकर स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: mensa indeficienti
  choice: कभी न चुकनेवाली मेज़
  rationale: mensa का ठोस रूपक ‘मेज़’ बनाए रखा गया है और indeficiens का भाव निरंतर उपलब्ध प्रावधान के रूप में दिया गया है।
- source_word: lege inuestigabili
  choice: जिसकी थाह न पाई जा सके ऐसी व्यवस्था
  rationale: uestigari से जुड़े ‘खोजकर पूरी तरह जान पाना/थाह पाना’ के भाव को सुरक्षित रखा गया; lex को धार्मिक-नैतिक अर्थ में ‘व्यवस्था’ कहा गया।
- source_word: corrupti sunt moribus eorum
  choice: अपने आचरण में भ्रष्ट हो गए
  rationale: moribus को ‘आचरण’ से व्यक्त किया गया, जिससे नैतिक व्यवहार का अर्थ स्पष्ट रहता है और अस्वाभाविक शाब्दिकता से बचा जाता है।
- source_word: consideraui saeculum meum
  choice: मैंने अपने युग पर ध्यान दिया
  rationale: saeculum के कालगत अर्थ को ‘युग’ और consideraui को विचारपूर्वक देखने के अर्थ में ‘ध्यान दिया’ से प्रस्तुत किया गया।
- source_word: et ecce
  choice: और देखो,
  rationale: आगे आने वाले कथन की ओर ध्यान खींचने वाला अधूरा संक्रमण मूल की तरह बनाए रखा गया है।
theological_decisions:
- issue: मानवता के सामने रखे प्रावधान और व्यवस्था का संबंध
  choice: मेज़ और व्यवस्था दोनों को मानवता को पहले से उपलब्ध कराई गई वस्तुओं के रूप में प्रस्तुत किया
  alternative: ‘मेज़’ को सीधे भोजन/अनुग्रह और ‘व्यवस्था’ को किसी विशिष्ट धर्मशास्त्रीय विधान के रूप में व्याख्यायित करना
  rationale: कठिन लैटिन रूपक और उसके धर्मशास्त्रीय तनाव को बिना किसी सांप्रदायिक अर्थारोपण के सुरक्षित रखा गया है।
- issue: भ्रष्टता का क्षेत्र
  choice: ‘अपने आचरण में भ्रष्ट हो गए’
  alternative: ‘उनका स्वभाव भ्रष्ट हो गया’
  rationale: moribus मुख्यतः रीति-आचरण को दर्शाता है; पाठ को मूल-पाप या स्वभावगत भ्रष्टता की किसी विशेष व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘परन्तु’, ‘व्यवस्था’ और ‘युग’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; कठिन लैटिन संरचना को डैश के सहारे स्पष्ट किया गया है, और पद के अंत का अधूरा ‘और देखो,’ अगले पद से जुड़ने हेतु सुरक्षित रखा गया है।
