  text: Go into a field where no house has been built, and eat only the flowers of the field. You shall not taste meat, and you shall not drink wine, but only flowers. And pray to the Most High without ceasing, and
translation:
  language: hi
  text: ऐसे मैदान में जाओ जहाँ कोई घर न बनाया गया हो, और केवल मैदान के फूल खाओ। तुम मांस न चखना और दाखमधु न पीना, बल्कि केवल फूल खाना। और बिना रुके परमप्रधान से प्रार्थना करना, और
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domus non est aedificata
  choice: जहाँ कोई घर न बनाया गया हो
  rationale: लातीनी वाक्यांश का निकट और स्वाभाविक रूप; यह उस निर्जन स्थान की शर्त को बनाए रखता है।
- source_word: floribus campi
  choice: मैदान के फूल
  rationale: campus के लिए सामान्य आधुनिक हिन्दी ‘मैदान’ और flores के लिए ‘फूल’ लिया गया है।
- source_word: carnem non gustabis
  choice: तुम मांस न चखना
  rationale: gustare के ‘चखना’ भाव को बनाए रखता है और निषेध को सहज निर्देशात्मक हिन्दी में देता है।
- source_word: uinum non bibes
  choice: दाखमधु न पीना
  rationale: uinum का सटीक, गरिमापूर्ण और बाइबिलीय रूप ‘दाखमधु’ है।
- source_word: altissimum
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त लातीनी श्रेष्ठतासूचक उपाधि का प्रचलित हिन्दी समतुल्य।
- source_word: sine intermissione
  choice: बिना रुके
  rationale: निरंतरता का अर्थ साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: अंतिम ‘et’ के कारण पद का अधूरा वाक्य
  choice: अंत में ‘और’ बनाए रखा गया
  alternative: वाक्य को पूर्ण विराम देकर समाप्त करना
  rationale: स्रोत पाठ अगले पद से जुड़ता है; संयोजक हटाने पर पाठ की वास्तविक वाक्यगत अपूर्णता छिप जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज निर्देशात्मक शैली। स्रोत की पुनरुक्ति (‘केवल...फूल’) और पदांत का अधूरा ‘और’ जानबूझकर सुरक्षित रखा गया है।
