  yaml_path: translation/extra_canonical/2_esdras/009/002.yaml
  text: then you will understand that this is the time when the Most High will begin to visit the world that was made by him[a]. And when a shaking of places is seen in the world,
translation:
  language: hi
  text: तब तुम समझोगे कि यही वह समय है जब परमप्रधान अपने बनाए हुए संसार की सुधि लेना आरम्भ करेगा[a]। और जब संसार में स्थानों का हिलना-डुलना दिखाई देगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने बनाए हुए संसार में हस्तक्षेप करना आरम्भ करेगा।”
    reason: ‘सुधि लेना’ के पीछे की क्रिया सक्रिय ईश्वरीय हस्तक्षेप या न्यायपूर्ण कार्रवाई का भाव भी दे सकती है।
lexical_decisions:
- source_word: uisitare
  choice: सुधि लेना
  rationale: यह ईश्वर के केवल आकर मिलने का नहीं, बल्कि संसार की दशा पर सक्रिय रूप से ध्यान देने और उसके विषय में कार्रवाई करने का भाव रखता है। ‘सुधि लेना’ आधुनिक हिन्दी में इस व्यापक अर्थ को बनाए रखता है, जबकि न्याय या दण्ड को पाठ से अधिक स्पष्ट नहीं करता।
- source_word: saeculum
  choice: संसार
  rationale: यहाँ शब्द उस सृष्ट जगत या वर्तमान विश्व-व्यवस्था को सूचित करता है जिस पर परमप्रधान की कार्रवाई होने वाली है; प्रसंग में ‘संसार’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: motio locorum
  choice: स्थानों का हिलना-डुलना
  rationale: लातीनी पद का सीधा और जानबूझकर व्यापक रूप रखा गया है। इसे केवल ‘भूकंप’ कहना संभावित अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: altissimus
  choice: परमप्रधान
  rationale: यह परमेश्वर की सर्वोच्चता बताने वाली उपाधि का प्रचलित, गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय ‘भेंट’ का न्यायात्मक या हस्तक्षेपकारी अर्थ
  choice: सुधि लेना
  alternative: हस्तक्षेप करना / न्याय करने आना
  rationale: सर्वनाश-विषयक प्रसंग सक्रिय ईश्वरीय कार्रवाई का संकेत देता है, पर मूल क्रिया अपने आप में कार्रवाई के स्वरूप को पूरी तरह निश्चित नहीं करती। इसलिए न्याय को स्पष्ट रूप से जोड़ने के बजाय अर्थगत तनाव सुरक्षित रखा गया है।
- issue: संसार का परमप्रधान द्वारा बनाया जाना
  choice: अपने बनाए हुए संसार
  alternative: उस संसार को, जो उसके द्वारा बनाया गया था
  rationale: कर्ता-संबंध को स्पष्ट रखते हुए लातीनी संबंधवाचक उपवाक्य का अर्थ स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य का अंतिम अल्पविराम बनाए रखा गया है, क्योंकि पद अगले कथन में जारी रहता है।
