    rationale: '''वर्षा का वेग बीत गया'' follows the Latin closely but is unnatural Hindi. ''वर्षा का ज़ोर थम गया'' conveys transisset impetus pluviae without loss of meaning.'
  - severity: low
    issue: Rain description is slightly redundant
    rationale: '''बड़े वेग से घनघोर वर्षा'' combines overlapping intensity expressions. ''तेज़ और भारी वर्षा'' more naturally represents impetu multam, preserving both force and abundance.'
  - severity: low
