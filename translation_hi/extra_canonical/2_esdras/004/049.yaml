id: 2ES.4.49
reference: 2 Esdras 4:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'transisset flamma et uidi et ecce superauit fumus. Et post hoc transiit coram me nubs plena aquae et inmisit pluuiam impetu multam, et cum transisset impetus pluuiae superauerunt in ea guttae. Et dixit ad me ; cogita tibi ; sicut enim crescit pluuia amplius quam guttae et ignis amplius quam fumus, sic superhabundauit quae transiuit mensura, superauerunt autem guttae et fumus. Et oraui et dixi : putas uiuo usque in diebus illis ? uel quis erit in diebus illis ? Respondit ad me et dixit : de signis de quibus me interrogas, ex parte possum tibi dicere, de uita autem tua non sum missus dicere tibi, sed nescio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/049.yaml
  text: and behold[a], smoke remained behind. After this a cloud full of water passed before me and sent forth a great driving rain, and when the force of the rain had passed, drops remained behind in it.
translation:
  language: hi
  text: और देखो, धुआँ पीछे रह गया। इसके बाद पानी से भरा एक बादल मेरे सामने से गुज़रा और उसने तेज़ और भारी वर्षा बरसाई। जब वर्षा का ज़ोर थम गया, तो उसमें बूँदें शेष रह गईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बूँदें उसमें बची रहीं।”
    reason: लातीनी superauerunt के ‘शेष रहने’ या ‘बचे रहने’ के निकटवर्ती अर्थ को दर्शाने वाला वैकल्पिक अनुवाद; in ea (‘उसमें’) को भी स्पष्ट रखता है।
lexical_decisions:
- source_word: superauit fumus
  choice: धुआँ पीछे रह गया
  rationale: यहाँ superavit का अर्थ संदर्भ में मुख्य घटना के बीतने के बाद बचा या शेष रह जाना है; अगले वाक्य में बूँदों के शेष रहने से इसकी समानांतरता भी स्पष्ट है।
- source_word: nubs plena aquae
  choice: पानी से भरा एक बादल
  rationale: लातीनी पदबंध का सीधा, स्वाभाविक और चित्रात्मक हिन्दी रूप।
- source_word: inmisit pluuiam impetu multam
  choice: उसने बड़े वेग से घनघोर वर्षा बरसाई
  rationale: inmisit वर्षा को छोड़ने या बरसाने का भाव देता है, जबकि impetu और multam उसकी तीव्रता तथा प्रचुरता व्यक्त करते हैं।
- source_word: superauerunt in ea guttae
  choice: उसमें बूँदें शेष रह गईं
  rationale: in ea को स्पष्ट रूप से सुरक्षित रखा गया है; इसका संकेत स्त्रीलिंग nubs, अर्थात बादल, की ओर है। superaverunt को पूर्ववर्ती समान प्रयोग के अनुरूप 'शेष रह गईं' किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सरल रखी गई है। दृश्य की क्रमिक गति और धुएँ तथा बूँदों के बीच लातीनी पाठ की समानांतरता सुरक्षित रखी गई है।
