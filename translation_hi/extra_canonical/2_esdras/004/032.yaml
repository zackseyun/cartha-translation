lexical_decisions:
- source_word: seminatae fuerint
  choice: बोई जा चुकी होंगी
  rationale: पूर्ण भविष्य/संभाव्य भाव को स्वाभाविक हिन्दी में व्यक्त करता है और बुवाई की क्रिया को बनाए रखता है।
- source_word: spicae quarum non est numerus
