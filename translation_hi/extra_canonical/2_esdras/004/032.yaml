- source_word: aream
  choice: खलिहान
  rationale: कृषि-संदर्भ में area का अर्थ अनाज दाँवने या मँड़ाई करने का स्थान है; आधुनिक हिन्दी में ‘खलिहान’ सर्वाधिक सहज है।
- source_word: incipient facere
  choice: बनाना शुरू करेंगी
  rationale: incipient के आरंभसूचक अर्थ को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: usque-
  choice: कब तक—
  rationale: usque के अधूरे वाक्य को प्रसंगानुकूल प्रश्नवाचक हिन्दी में रखते हुए डैश से स्रोत का टूटना दर्शाया गया है।
theological_decisions:
- issue: Et respondit et dixi में कर्ता-परिवर्तन और पाठगत कठिनाई
  choice: और उसने उत्तर दिया, और मैंने कहा
  alternative: और उसने उत्तर देकर मुझसे कहा
  rationale: उपलब्ध लैटिन में respondit तीसरे पुरुष और dixi पहले पुरुष में है। अर्थ को सहज बनाने के लिए dixi को चुपचाप dixit अथवा ‘मुझसे कहा’ में बदलना स्रोतगत कठिनाई मिटा देता; इसलिए मुख्य पाठ में रूपों का भेद रखा गया और टिप्पणी जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कृषि-बिंब के लिए ‘बालें’ और ‘खलिहान’ चुने गए हैं। अंतिम डैश उस स्थान पर स्रोत-पाठ के अधूरे रह जाने को सुरक्षित रखता है।
