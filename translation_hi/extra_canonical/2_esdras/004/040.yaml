  text: And he answered me and said, “Go and ask a pregnant woman whether, when she has completed her nine months, she can still keep the child within her.”
translation:
  language: hi
  text: तब उसने मुझे उत्तर दिया, “जाकर किसी गर्भवती स्त्री से पूछो कि जब उसके नौ महीने पूरे हो जाते हैं, तो क्या वह बच्चे को अब भी अपने भीतर रख सकती है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnantem
  choice: किसी गर्भवती स्त्री
  rationale: यह आधुनिक मानक हिन्दी में स्वाभाविक और स्पष्ट रूप से ‘एक गर्भवती स्त्री’ का अर्थ व्यक्त करता है।
- source_word: impleuerit nouem menses suos
  choice: उसके नौ महीने पूरे हो जाते हैं
  rationale: गर्भावस्था के नौ महीने पूरे होने की लैटिन अभिव्यक्ति को सहज हिन्दी में व्यक्त किया गया है।
- source_word: adhuc
  choice: अब भी
  rationale: समय पूरा हो जाने के बाद भी स्थिति जारी रहने की संभावना को ठीक प्रकार व्यक्त करता है।
