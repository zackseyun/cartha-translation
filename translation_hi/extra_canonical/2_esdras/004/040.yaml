  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी; ‘उत्तर दिया’ मूल के respondit के निकट है, जबकि प्रत्यक्ष कथन को हिन्दी में स्वाभाविक रखा गया है। उपलब्ध लैटिन अंश अंतिम adhuc पर अपूर्ण है; वाक्य की पूर्णता के लिए प्रमाणित अंग्रेज़ी परामर्श-पाठ में सुरक्षित आशय अपनाया गया है।
