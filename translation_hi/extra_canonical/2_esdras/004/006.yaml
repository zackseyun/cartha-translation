  text: 'Et respondi et dixi : quis natorum poterit hoc facere, ut me interroges de his ?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/006.yaml
  text: And I answered and said, “Who among those born can do this, that you ask me about these things?”
translation:
  language: hi
  text: और मैंने उत्तर देकर कहा, “जन्मे हुओं में कौन यह कर सकता है कि आप मुझसे इन बातों के विषय में पूछें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  choice: तब मैंने उत्तर दिया
  rationale: लातीनी युग्म का अर्थ स्वाभाविक आधुनिक हिन्दी में संक्षेपित किया गया; ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी होता।
- source_word: quis natorum
  choice: जन्मे हुओं में कौन
  rationale: ‘natorum’ के व्यापक और कुछ असामान्य अर्थ को सुरक्षित रखा गया; इसे केवल ‘मनुष्यों’ तक सीमित नहीं किया।
- source_word: poterit hoc facere
  choice: यह कर सकता है
  rationale: समर्थता व्यक्त करने वाले भाव और निकट संकेत ‘hoc’ दोनों को सीधा रखा गया।
- source_word: de his
  choice: इन बातों के विषय में
  rationale: लातीनी निकट संकेत का स्पष्ट और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: ‘जन्मे हुओं’ का दायरा
  choice: व्यापक अभिव्यक्ति ‘जन्मे हुओं’ रखी गई
  alternative: ‘मनुष्यों में कौन’
  rationale: मूल पाठ स्वयं वर्ग को ‘मनुष्य’ कहकर सीमित नहीं करता; अतः उसकी वास्तविक व्यापकता और असामान्यता सुरक्षित रखी गई।
- issue: ut me interroges का संबंध
  choice: परिणाम/परिस्थिति जैसा खुला संबंध—‘जो आप...पूछते हैं’
  alternative: ‘कि आप मुझसे...पूछें’ अथवा ‘इसलिए आप...पूछते हैं’
  rationale: लातीनी subjunctive निर्माण का ठीक तार्किक संबंध पूर्णतः स्पष्ट नहीं है; अनुवाद ने कारण या उद्देश्य को अधिक निश्चित नहीं बनाया।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरार्थी ‘आप’ संवाद की गरिमा के अनुरूप है। वाक्य को स्वाभाविक रखा गया है, जबकि ‘जन्मे हुओं’ की मूल-पाठीय विशिष्टता संरक्षित है।
