  to: मैं तुम्हें उस उपमा की व्याख्या बताऊँगा। और मैं खड़ा हुआ और मैंने देखा, और देखो, एक धधकती हुई भट्ठी मेरे सामने से गुज़री; और ऐसा हुआ कि जब—
