  text: I will show you the interpretation of the likeness. And I stood and saw, and behold, a blazing furnace passed before me, and it happened when
translation:
  language: hi
  text: मैं तुम्हें उस उपमा की व्याख्या बताऊँगा। और मैं खड़ा हुआ और मैंने देखा, और देखो, एक धधकती हुई भट्ठी मेरे सामने से गुज़री; और ऐसा हुआ कि जब—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demonstrabo
  choice: बताऊँगा
  rationale: संदर्भ में किसी अर्थ को स्पष्ट करके दिखाने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: interpretationem similitudinis
  choice: इस उपमा का अर्थ
  rationale: लातीनी पदबंध का सहज और स्पष्ट हिन्दी रूप; यहाँ similitudinis किसी दृष्टान्तात्मक दृश्य या उपमा की ओर संकेत करता है।
- source_word: fornax ardens
  choice: धधकती हुई भट्ठी
  rationale: fornax के लिए ‘भट्ठी’ और ardens के प्रज्वलित, तीव्र रूप से जलने के भाव के लिए ‘धधकती हुई’ उपयुक्त है।
- source_word: transiit coram me
  choice: मेरे सामने से गुज़री
  rationale: गति और वक्ता के सम्मुख होकर निकलने—दोनों भावों को सुरक्षित रखता है।
- source_word: factum est cum
  choice: ऐसा हुआ कि जब
  rationale: मूल स्रोत के अधूरे संक्रमण-वाक्य को बिना अगली पंक्ति से सामग्री जोड़कर पूरा किए यथावत रखता है।
