- source_word: incipiebas iustificare
  choice: निर्दोष ठहराना शुरू करते
  rationale: ‘शुरू करते’ लैटिन incipiebas के आरंभ-सूचक भाव को बनाए रखता है; ‘निर्दोष ठहराना’ न्यायिक अर्थ वाले iustificare को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: quem condemnare
  choice: किसे दोषी ठहराते
  rationale: quem का व्यक्तिवाचक प्रश्नार्थक भाव ‘किसे’ से और condemnare का न्यायिक अर्थ ‘दोषी ठहराते’ से व्यक्त होता है।
- source_word: Et respondi et
  choice: तब मैंने उत्तर दिया और
  rationale: स्रोत का वाक्य et पर अधूरा समाप्त होता है; हिन्दी में भी अंतिम ‘और’ रखकर इस पाठगत अपूर्णता को सुरक्षित रखा गया है।
theological_decisions:
- issue: iustificare का अर्थ
  choice: निर्दोष ठहराना
  alternative: धर्मी ठहराना
  rationale: यहाँ वन और समुद्र के विवाद पर न्याय करने की कल्पना है, इसलिए न्यायिक ‘निर्दोष ठहराना’ संदर्भानुकूल है और अनावश्यक सिद्धान्तगत अर्थ आरोपित नहीं करता।
