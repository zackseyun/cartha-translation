  text: And I answered and said, “How long, and when will these things be? Why are our years few and evil?”
translation:
  language: hi
  text: मैंने उत्तर दिया और कहा, “यह सब कब तक, और कब होगा? हमारे वर्ष थोड़े और बुरे क्यों हैं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'लैटिन में पहला प्रश्न अत्यंत संक्षिप्त है: quo et quando haec? यहाँ इसका अर्थ “यह सब कब तक, और कब होगा?” लिया गया है। quo का रूप स्थान-सूचक अर्थ की संभावना भी रख सकता है, पर इस संदर्भ में अवधि-सूचक अर्थ अधिक संभावित है।'
    reason: संक्षिप्त लैटिन पाठ की वास्तविक व्याकरणिक/अर्थगत अनिश्चितता दर्शाता है, जबकि मुख्य पाठ संदर्भानुकूल ‘कब तक’ अर्थ रखता है।
lexical_decisions:
- source_word: quo et quando haec?
  choice: ये बातें कब तक चलेंगी, और कब पूरी होंगी?
  rationale: लैटिन पाठ का पहला प्रश्न संक्षिप्त और कुछ असामान्य है। संदर्भ तथा परामर्श-पाठ के ‘How long, and when’ को ध्यान में रखते हुए ‘quo’ को अवधि और ‘quando’ को पूर्ण होने के समय का प्रश्न मानकर स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: modici
  choice: थोड़े
  rationale: वर्षों की संख्या अथवा जीवन की अवधि कम होने का सीधा अर्थ सुरक्षित रखता है।
- source_word: mali
  choice: दुःखमय
  rationale: लैटिन malus का शाब्दिक अर्थ ‘बुरा’ है, पर वर्षों के विषय में यह विपत्ति, कष्ट और दुःख से भरे होने का भाव देता है; ‘दुःखमय’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: anni nostri
  choice: हमारे जीवन के वर्ष
  rationale: ‘हमारे वर्ष’ की अपेक्षा यह हिन्दी में स्पष्ट करता है कि बात मनुष्य के जीवनकाल की है, बिना मूल आशय को बढ़ाए।
theological_decisions:
- issue: प्रश्नों का युगांत-संबंधी आशय
  choice: ‘ये बातें’ और प्रश्नात्मक तनाव को खुला रखा गया है
  alternative: इसे स्पष्ट रूप से ‘अंत कब आएगा’ या ‘नया युग कब आएगा’ कहना
  rationale: लैटिन पद स्वयं संकेतात्मक है; किसी विशिष्ट युगांतशास्त्रीय व्याख्या को पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्नों की व्याकुलता बनी रहती है, जबकि असामान्य लैटिन वाक्य-विन्यास को पठनीय हिन्दी में ढाला गया है।
