id: 2ES.4.4
reference: 2 Esdras 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: De quibus si mihi renunciaueris unam ex his, et ego tibi demonstrabo uiam quam desideras uidere, et doceam te quare cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/004.yaml
  text: If you report to me one of these[a], then I also will show you the way that you desire to see, and I will teach you why the heart is evil.”
translation:
  language: hi
  text: यदि तुम इनमें से किसी एक के विषय में मुझे बता दो[a], तो मैं भी तुम्हें वह मार्ग दिखाऊँगा जिसे तुम देखना चाहते हो, और तुम्हें सिखाऊँगा कि हृदय क्यों बुरा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनमें से किसी एक को मुझे समझा दो।”
    reason: renunciaueris का अर्थ प्रसंग में केवल ‘बताना’ ही नहीं, किसी कठिन विषय को स्पष्ट करके बताना भी हो सकता है।
lexical_decisions:
- source_word: renunciaueris
  choice: बता दो
  rationale: लातीनी क्रिया का मूल भाव किसी बात को बताना या निवेदित करना है। यहाँ सीधी शर्त को रखते हुए सहज आधुनिक हिन्दी चुनी गई है; ‘समझा सको’ जैसी सामर्थ्य स्रोत में नहीं है।
- source_word: uiam
  choice: मार्ग
  rationale: ‘मार्ग’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी है तथा शाब्दिक और रूपक—दोनों संभावनाएँ खुली रखता है।
- source_word: cor malignum
  choice: हृदय बुरा है
  rationale: लातीनी वाक्यांश की संक्षिप्त विधेयात्मक संरचना को स्वाभाविक हिन्दी में रखा गया है, बिना ‘एक बुरा हृदय क्यों है’ जैसा अतिरिक्त अस्तित्वार्थ जोड़े।
theological_decisions:
- issue: ‘हृदय’ की बुराई का स्वरूप
  choice: हृदय क्यों बुरा है
  alternative: दुष्ट हृदय क्यों है
  rationale: स्रोत ‘quare cor malignum’ अस्पष्ट और संक्षिप्त है। चुना हुआ पाठ यह नहीं तय करता कि बात किसी विशेष दुष्ट हृदय, मानव-हृदय की सामान्य दशा, या बुराई की उत्पत्ति की है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठकों के लिए सहज। भविष्यकालीन सीधी शर्त, मूल की पुनरुक्त ‘दिखाऊँगा…देखना’, और हृदय संबंधी अर्थगत तनाव सुरक्षित रखे गए हैं।
