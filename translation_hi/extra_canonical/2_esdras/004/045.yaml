  text: possibile est, et si idoneus sum, Demonstra mihi et hoc, si plus quam praeteriit habet uenire, aut plura pertransierunt super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/045.yaml
  text: 'If it is possible[a], and if I am fit, show me this also: whether more is to come than has passed, or whether more has passed over.'
translation:
  language: hi
  text: '“यदि यह संभव हो और यदि मैं योग्य हूँ, तो मुझे यह भी दिखा: जो बीत चुका है, उसकी अपेक्षा क्या आने वाला अधिक है, या अधिक हम पर से बीत चुका है?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी पाठ में ‘हम’ शब्द अगले पद के आरम्भ में आता है, पर वाक्य-विन्यास की दृष्टि से वह इसी वाक्य को पूरा करता है।
    reason: पद-विभाजन के आर-पार फैले लातीनी वाक्य-विन्यास को स्पष्ट करना।
lexical_decisions:
- source_word: idoneus
  choice: योग्य
  rationale: यहाँ वक्ता अपनी पात्रता या उपयुक्तता की बात करता है; ‘योग्य’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: plus quam praeteriit habet uenire
  choice: जो बीत चुका है, उसकी अपेक्षा क्या आनेवाला अधिक है
  rationale: लातीनी तुलना को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है, बिना यह निर्धारित किए कि ‘अधिक’ समय, घटनाओं या युग के शेष भाग को सूचित करता है।
- source_word: plura pertransierunt super [nos]
  choice: अधिक हमारे ऊपर से बीत चुका है
  rationale: ‘ऊपर से बीतना’ मूल की सामी-प्रभावित अभिव्यक्ति को बनाए रखता है। वाक्य को पूरा करने वाला nos लातीनी पाठ में अगले पद के आरम्भ पर आता है।
theological_decisions:
- issue: भविष्य और अतीत में ‘अधिक’ किसका है
  choice: ‘अधिक’ को बिना किसी स्पष्ट संज्ञा के रहने दिया गया
  alternative: ‘अधिक समय’ या ‘अधिक घटनाएँ’ जोड़ना
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि तुलना समय, घटनाओं या युग के भागों के बीच है; अनुवाद उस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल की प्रश्नात्मक तुलना और ‘हमारे ऊपर से बीतना’ जैसी विशिष्ट अभिव्यक्ति को सुरक्षित रखा गया है।
