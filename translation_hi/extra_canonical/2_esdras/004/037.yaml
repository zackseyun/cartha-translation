source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mensurauit tempora, et numero numerauit tempora, et non commouebit nec excitabit usque dum impleatur praedicta
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/037.yaml
  text: and measured the times[a], and numbered the times, and he will not move or stir them until what was foretold is fulfilled.’”
translation:
  language: hi
  text: और उसने समयों को मापा और समयों को गिना; और जब तक जो पहले से कहा गया था वह पूरा न हो जाए,[a] तब तक वह उन्हें न हिलाएगा, न जगाएगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन praedicta का संदर्भ स्पष्ट नहीं है। इसका अर्थ ‘जो पहले से कहा गया था’ है; संदर्भ के आधार पर कुछ अनुवाद ‘पूर्वकथित माप’ समझते हैं, यद्यपि ‘माप’ शब्द यहाँ स्पष्ट रूप से नहीं है।
    reason: praedicta की संदर्भगत अस्पष्टता बनाए रखता है, पर मुख्य पाठ में अनुपस्थित संज्ञा नहीं जोड़ता।
lexical_decisions:
- source_word: mensurauit tempora
  choice: समयों को मापा
  rationale: लैटिन की मापने संबंधी प्रत्यक्ष छवि और बहुवचन ‘समयों’ को बनाए रखा गया है।
- source_word: numero numerauit tempora
  choice: समयों को गिना
  rationale: शाब्दिक ‘संख्या से गिना’ हिन्दी में अनावश्यक पुनरुक्ति लगेगी; ‘गिना’ मूल अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: non commouebit nec excitabit
  choice: वह उन्हें न हिलाएगा, न उकसाएगा
  rationale: दोनों लैटिन क्रियाओं का भेद बनाए रखा गया है। कर्म मूल में व्यक्त नहीं है, पर निकटतम बहुवचन ‘समयों’ की ओर संकेत समझकर हिन्दी में ‘उन्हें’ रखा गया है।
- source_word: usque dum impleatur
  choice: जब तक ... पूरा न हो जाए
  rationale: समय-सीमा और पूर्ति—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: praedicta
  choice: वह ... जो पहले से कहा गया था
  rationale: यह रूप लैटिन के ‘पूर्वकथित/भविष्यवाणी किए हुए’ भाव को रखता है और अस्पष्ट संदर्भ को किसी जोड़े गए संज्ञा से सीमित नहीं करता।
theological_decisions:
- issue: praedicta के निहित संदर्भ की पहचान
  choice: ‘जो पहले से कहा गया था’—संज्ञा को अनिर्दिष्ट रखा गया
  alternative: ‘पहले से बताई हुई बातें’ या ‘पूर्वकथित माप’
  rationale: मूल पाठ स्पष्ट रूप से ‘माप’ नहीं कहता। अनिर्दिष्ट रूप भविष्यवाणी की पूर्ति का भाव रखते हुए कृत्रिम धर्मवैज्ञानिक स्पष्टीकरण से बचता है।
- issue: commouebit/excitabit का कर्म
  choice: निकटवर्ती ‘समयों’ की ओर संकेत करते हुए ‘उन्हें’
  alternative: क्रियाओं को अकर्मक बनाकर ‘वह न हिलेगा, न जागेगा’
  rationale: लैटिन में दोनों क्रियाएँ यहाँ सकर्मक रूप में अधिक स्वाभाविक हैं; अकर्मक अनुवाद अर्थ को उल्लेखनीय रूप से बदल देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वाचनयोग्य रखी गई है। ‘समयों’ का कुछ असामान्य बहुवचन जानबूझकर रखा गया है, क्योंकि मूल में tempora बहुवचन है और यह अपोकैलिप्टिक कालखंडों की ओर संकेत कर सकता है।
