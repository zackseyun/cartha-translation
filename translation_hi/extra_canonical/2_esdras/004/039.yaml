  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/039.yaml
  text: We are all full of impiety. And perhaps because of us the threshing floor of the righteous is kept back[a], because of the sins of those who dwell there.
translation:
  language: hi
  text: हम सब अधर्म से भरे हुए हैं। और शायद हमारे कारण धर्मियों का खलिहान वहाँ रहनेवालों के पापों के कारण रोका जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाधित किया जाए’; प्रसंग में ‘देर हो’ भी संभव है।
    reason: prohibeatur का मुख्य अर्थ ‘रोका जाए’ या ‘बाधित किया जाए’ है; प्रसंग में विलंब उसका संभावित परिणाम हो सकता है।
lexical_decisions:
- source_word: impietatem
  choice: अधर्म
  rationale: यह शब्द परमेश्वर-विरोधी दुष्टता और नैतिक बुराई दोनों को समेटता है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: prohibeatur
  choice: रोक रखा जाए
  rationale: लातीनी क्रिया का मूल भाव ‘रोका जाए/बाधित किया जाए’ है; यह केवल समयगत देरी तक अर्थ को सीमित नहीं करता।
- source_word: iustorum area
  choice: धर्मियों का खलिहान
  rationale: area का कृषि-संबंधी रूपक अक्षुण्ण रखते हुए iustorum को स्वाभाविक संबंधकारक रूप में प्रस्तुत करता है।
- source_word: inhabitantium
  choice: वहाँ रहनेवालों
  rationale: कृदंत का सीधा अर्थ सुरक्षित रखता है और स्रोत में न होने वाले ‘पृथ्वी पर’ जैसे स्थान को नहीं जोड़ता।
theological_decisions:
- issue: धर्मियों के खलिहान के रोके जाने का अर्थ
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा
  alternative: धर्मियों की फसल/प्रतिफल में देर की जाए
  rationale: स्रोत का रूपक और उसकी व्याख्यात्मक अस्पष्टता सुरक्षित रहनी चाहिए; इसे अंत-समय के किसी निश्चित सिद्धान्त से नहीं बाँधा गया।
- issue: ne forte की संभाव्यता
  choice: कहीं ऐसा न हो कि
  alternative: शायद
  rationale: यह लातीनी वाक्यांश की आशंकापूर्ण संभाव्यता को अधिक ठीक ढंग से व्यक्त करता है, बिना घटना को निश्चित बताए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘खलिहान’ के कृषि-रूपक को बनाए रखा गया है। डैश अंतिम कारणवाचक पद को पूरे पूर्ववर्ती कथन से जोड़ते हुए लातीनी वाक्य की कुछ अस्पष्टता सुरक्षित रखता है।
