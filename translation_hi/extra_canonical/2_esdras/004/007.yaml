id: 2ES.4.7
reference: 2 Esdras 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me : si eram interrogans te dicens : quantae habitationes sunt in corde maris, aut quantae uenae sunt in principio abyssi, aut quantae uiae sunt super firmamentum, aut qui sunt exitus paradisi ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/007.yaml
  text: And he said to me, “If I had asked you, saying, ‘How many dwellings are in the heart of the sea? Or how many springs are at the source of the deep? Or how many ways are above the firmament? Or what are the exits of paradise?’
translation:
  language: hi
  text: और उसने मुझसे कहा, “यदि मैं तुमसे यह पूछता, ‘समुद्र के हृदय में कितने निवास-स्थान हैं? अथाह गहराई के आरम्भ में कितने सोते हैं? आकाश-मंडल के ऊपर कितने मार्ग हैं? या स्वर्ग-वाटिका से बाहर निकलने के मार्ग कौन-से हैं?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corde maris
  choice: समुद्र के हृदय में
  rationale: लातीनी रूपक को यथासंभव अक्षुण्ण रखा गया है; यह समुद्र के भीतरी अथवा अगम भाग का संकेत देता है।
- source_word: habitationes
  choice: निवास-स्थान
  rationale: शाब्दिक अर्थ ‘निवास’ या ‘रहने के स्थान’ है; प्रश्न की रहस्यमयता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: uenae
  choice: सोते
  rationale: मूलतः ‘शिराएँ’ भी हो सकता है, पर जल-संदर्भ में भूमिगत जलधाराओं या स्रोतों के अर्थ में ‘सोते’ स्वाभाविक है।
- source_word: principio abyssi
  choice: अथाह गहराई के आरम्भ में
  rationale: principium की संभावित ‘आरम्भ/मूल-स्रोत’ अर्थच्छाया और abyssus की अगाध गहराई दोनों को बनाए रखता है।
- source_word: firmamentum
  choice: आकाश-मंडल
  rationale: प्राचीन ब्रह्मांड-वर्णन के ठोस आकाशीय विस्तार को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: exitus paradisi
  choice: स्वर्ग-वाटिका से बाहर निकलने के मार्ग
  rationale: exitus को केवल ‘निकास’ कहने की अपेक्षा प्रश्नवाचक qui sunt के साथ स्वाभाविक हिन्दी में व्यक्त किया गया; paradisus के उद्यान-संबंधी अर्थ को ‘स्वर्ग-वाटिका’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: paradisus का स्वरूप
  choice: स्वर्ग-वाटिका
  alternative: स्वर्गलोक
  rationale: मूल शब्द उद्यान/परादीस की कल्पना रखता है; ‘स्वर्गलोक’ इसे केवल परलोक-संबंधी स्थान मानकर अर्थ को संकुचित कर सकता है।
- issue: प्राचीन ब्रह्मांड-विज्ञान की भाषा
  choice: आकाश-मंडल के ऊपर
  alternative: आकाश के पार
  rationale: super firmamentum की स्थान-संबंधी भाषा को बनाए रखा गया है और आधुनिक वैज्ञानिक धारणा के अनुरूप पुनर्व्याख्या नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। समुद्र के ‘हृदय’, अथाह गहराई के आरम्भ और आकाश-मंडल जैसे मूल के रहस्यमय ब्रह्मांडीय बिंबों को व्याख्यात्मक रूप से सपाट नहीं किया गया।
