    reason: स्रोत-साक्ष्य की खंडित अवस्था को पाठक से छिपाए बिना पठनीय मुख्य पाठ देना।
lexical_decisions:
- source_word: cogitatus
  choice: इरादा
  rationale: यहाँ शब्द समुद्र की लहरों के मानवीकृत ‘विचार/योजना’ को व्यक्त करता है। ‘इरादा’ आधुनिक हिन्दी में स्वाभाविक है और लहरों के आगे बढ़ने की प्रवृत्ति को बिना अनावश्यक व्याख्या के रखता है।
- source_word: fluctuum maris
  choice: समुद्र की लहरों
  rationale: लातिनी संबंधकारक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: stetit
  choice: दृढ़ता से खड़ी रही
  rationale: क्रिया का मूल अर्थ ‘खड़ी रही/डटी रही’ है; प्रसंग में बालू द्वारा लहरों का सामना करने का भाव स्पष्ट करने के लिए ‘दृढ़ता से’ जोड़ा गया है।
- source_word: prohibuit eos (consultation text’s completed sense)
  choice: उसने उन्हें रोक दिया
  rationale: अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूर्ण अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उन्हें’ का संकेत समुद्र की लहरों की ओर है।
