source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixit ad me: cogita tibi. sicut enim crescit pluvia amplius quam guttae, et ignis amplius quam fumus, sic superabundavit quae transivit mensura, superaverunt autem guttae et fumus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/050.yaml
  text: 'And he said to me[a], “Consider for yourself: just as the rain is greater than the drops, and the fire greater than the smoke, so what has passed has greatly exceeded the measure, but the drops and the smoke remain.”'
translation:
  language: hi
  text: 'तब उसने मुझसे कहा, “इस पर स्वयं विचार कर: जैसे वर्षा बूँदों से अधिक और आग धुएँ से अधिक होती है, वैसे ही जो परिमाण बीत गया है, वह बहुत अधिक हो गया है[a]; पर बूँदें और धुआँ बचे रह गए हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बीत चुका है, वह परिमाण से बहुत अधिक हो गया है।”
    reason: लातीनी वाक्यांश *superabundavit quae transivit mensura* की वाक्यरचना असहज और व्याख्या-योग्य है। मुख्य पाठ स्त्रीलिंग संबंधवाचक शब्द को *mensura* (‘परिमाण’) से जोड़ता है; वैकल्पिक अनुवाद उसे उस वस्तु से जोड़ता है ‘जो बीत चुका है।’
lexical_decisions:
- source_word: cogita tibi
  choice: अपने आप विचार कर
  rationale: लातीनी आत्मवाचक भाव को रखते हुए आधुनिक और सहज हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: pluvia amplius quam guttae
  choice: वर्षा बूँदों से अधिक
  rationale: मूल की तुलनात्मक छवि को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखा गया है।
- source_word: superaverunt
  choice: शेष हैं
  rationale: यहाँ क्रिया का अर्थ ‘बचे रहना/शेष होना’ प्रसंग और बूँदों तथा धुएँ की समानांतर छवि के अनुकूल है; इसे ‘पार कर गए’ कहना अर्थ को विकृत करता।
theological_decisions:
- issue: quae transivit mensura की वाक्यरचना और उसका superabundavit से संबंध
  choice: जो माप बीत चुका है, वह बहुत अधिक रहा है
  alternative: जो बीत चुका है, वह माप से बहुत अधिक हो गया है
  rationale: quae को स्त्रीलिंग mensura से संबद्ध मानना लातीनी व्याकरण के अधिक निकट है, पर पाठ की असहज वाक्यरचना दूसरी समझ की संभावना छोड़ती है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूल की वर्षा-बूँद और आग-धुआँ संबंधी संक्षिप्त उपमाएँ तथा अंतिम विरोध सुरक्षित रखे गए हैं।
