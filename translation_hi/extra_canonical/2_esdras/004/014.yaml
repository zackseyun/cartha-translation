  text: and said[a], ‘Come, let us go and make war against the sea, so that it may withdraw before us, and we may make for ourselves other forests.’ In the same way the waves of the sea also devised a plan,
translation:
  language: hi
  text: और कहा, “आओ, हम समुद्र से युद्ध करें, ताकि वह हमारे सामने से पीछे हट जाए और हम अपने लिए दूसरे वन बना लें।” इसी प्रकार समुद्र की लहरों ने भी एक योजना बनाई,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bellum
  choice: युद्ध करें
  rationale: लातीनी पदबंध में युद्ध करने का भाव है; हिन्दी में ‘युद्ध करें’ स्वाभाविक और अर्थ-सटीक है।
- source_word: recedat coram nos
  choice: वह हमारे सामने से पीछे हट जाए
  rationale: यह समुद्र के उनके सामने से हटने या पीछे जाने का भाव सुरक्षित रखता है।
- source_word: alias siluas
  choice: दूसरे वन
  rationale: ‘alias’ का अर्थ ‘दूसरे’ है, ‘और अधिक’ नहीं; इससे अगले पद के समानांतर विचार की सटीकता भी बनी रहती है।
- source_word: cogitauerunt
  choice: एक योजना बनाई
  rationale: संदर्भ में यह केवल सोचने नहीं, समुद्र की लहरों द्वारा प्रत्युत्तर की योजना बनाने का भाव व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद स्रोत में पिछले वाक्य से जुड़ा हुआ आरम्भ होता है और अगले पद में जारी रहता है, इसलिए आरम्भ में ‘और’ तथा अंत में अल्पविराम रखा गया है। अंग्रेज़ी परामर्श-पाठ की ‘more forests’ वाली पुरानी प्रस्तुति को पादटिप्पणी में नहीं रखा गया, क्योंकि वह कोई स्रोत-पाठांतर नहीं बल्कि पूर्व अनुवाद था; लातीनी ‘alias’ स्पष्ट रूप से ‘दूसरे’ का समर्थन करता है।
