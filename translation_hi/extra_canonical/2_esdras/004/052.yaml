base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/052.yaml
  text: You ask insistently; I can tell you in part[a], but concerning your life, I have not been sent to tell you, and I do not know.
translation:
  language: hi
  text: तुम आग्रहपूर्वक पूछते हो; मैं तुम्हें कुछ हद तक बता सकता हूँ[a], पर तुम्हारे जीवन के बारे में तुम्हें बताने के लिए मुझे नहीं भेजा गया है, और मैं नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह उत्तर जानबूझकर आंशिक है: वक्ता कुछ बातें बता सकता है, पर एज्रा के जीवन के बारे में नहीं। यह पुस्तक ईश्वरीय समय के संबंध में मनुष्य की सीमित पहुँच को दर्शाती है।'
    reason: compositional_layer
lexical_decisions:
- source_word: perrogas
  choice: तुम बार-बार पूछते हो
  rationale: लातीनी क्रिया में लगातार या आग्रहपूर्वक पूछने का भाव है; यह सहज आधुनिक हिन्दी में उस बल को बनाए रखता है।
- source_word: ex parte
  choice: कुछ हद तक
  rationale: उत्तर की आंशिकता को स्पष्ट करता है, बिना यह जोड़े कि वास्तव में कौन-सी बातें प्रकट की जा सकती हैं।
- source_word: de vita autem tua
  choice: पर तुम्हारे जीवन के विषय में
  rationale: vita को व्यापक और जानबूझकर अनिर्धारित ‘जीवन’ रखा गया है; इसे ‘जीवनकाल’ कहकर सीमित नहीं किया गया।
- source_word: non sum missus
  choice: मुझे नहीं भेजा गया है
  rationale: लातीनी कर्मवाच्य को सुरक्षित रखता है और भेजने वाले की पहचान पाठ से बाहर जाकर स्पष्ट नहीं करता।
- source_word: sed nescio
  choice: और मैं नहीं जानता
  rationale: स्रोत के सीधे अज्ञान-वक्तव्य को ज्यों का त्यों रखता है; इसे केवल बताने की मनाही के अर्थ में नरम नहीं करता।
theological_decisions:
- issue: दूत के प्रकाशन-अधिकार और ज्ञान की सीमा
  choice: ‘मुझे नहीं भेजा गया है, और मैं नहीं जानता’—दोनों कथनों को अलग और स्पष्ट रखा गया।
  alternative: ‘मुझे यह बताने की अनुमति नहीं है’ या केवल ‘मैं तुम्हें नहीं बता सकता।’
  rationale: मूल पाठ में कार्यादेश की सीमा और ज्ञान की सीमा दोनों उपस्थित हैं; किसी एक को दूसरे में मिला देना वास्तविक धर्मवैचारिक तनाव को मिटा देता।
- issue: ‘तुम्हारे जीवन’ का आशय
  choice: ‘जीवन’ रखा गया।
  alternative: ‘जीवनकाल’ या ‘तुम कब तक जीवित रहोगे।’
  rationale: संदर्भ में जीवनकाल का संकेत संभव है, पर vita स्वयं व्यापक है; मुख्य पाठ में संभावित अर्थ को अनिवार्य अर्थ नहीं बनाया गया।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। ‘बार-बार पूछते हो’ में perrogas का आग्रह बना रहता है; वाक्य स्रोत की संक्षिप्तता और अस्पष्टता को सुरक्षित रखता है।
