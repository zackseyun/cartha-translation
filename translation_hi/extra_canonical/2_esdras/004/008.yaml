source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Dicebas fortassis mihi : in abyssum non descendi, neque in infernum adhuc, neque in caelis unquam ascendi.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/008.yaml
  text: Perhaps you would have said to me[a], ‘I have not descended into the abyss, nor yet into Hades, nor have I ever ascended into heaven.’
translation:
  language: hi
  text: शायद तुम मुझसे कहते, “मैं न तो अथाह गहराई में उतरा हूँ, न अभी तक अधोलोक में उतरा हूँ, और न कभी स्वर्ग तक चढ़ा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortassis
  choice: शायद
  rationale: संभावना का वही भाव रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: abyssum
  choice: अथाह गहराई
  rationale: ‘अबीस’ जैसे अपरिचित लिप्यंतरण के बजाय अगम, अत्यंत गहरे स्थान का अर्थ स्पष्ट करता है और ‘अधोलोक’ से इसका भेद बनाए रखता है।
- source_word: infernum
  choice: अधोलोक
  rationale: लातीनी शब्द के मृतकों के लोक संबंधी अर्थ को व्यक्त करता है; ‘नरक’ कहने से आने वाला दंड-स्थान का अनावश्यक संकुचन टालता है।
- source_word: caelis
  choice: स्वर्ग
  rationale: लातीनी बहुवचन रूप के बावजूद हिन्दी धार्मिक-साहित्यिक प्रयोग में ‘स्वर्ग’ अधिक स्वाभाविक है और संदर्भ का ऊर्ध्वलोक अर्थ सुरक्षित रखता है।
- source_word: descendi / ascendi
  choice: उतरा हूँ / चढ़ा हूँ
  rationale: नीचे उतरने और ऊपर चढ़ने की स्थानिक समानांतरता को सीधे बनाए रखता है।
theological_decisions:
- issue: infernum को दंड के नरक के रूप में समझना या मृतकों के अधोलोक के रूप में
  choice: अधोलोक
  alternative: नरक / हेडीस
  rationale: पद में abyssum से अलग एक लोक का उल्लेख है। ‘अधोलोक’ व्यापक प्राचीन यहूदी ब्रह्मांड-दृष्टि को बिना अतिरिक्त यूनानी पौराणिक या दंडात्मक अर्थ थोपे व्यक्त करता है।
- issue: caelis के व्याकरणिक बहुवचन को हिन्दी में प्रत्यक्ष बहुवचन देना
  choice: स्वर्ग
  alternative: स्वर्गों
  rationale: ‘स्वर्गों’ स्रोत की संख्या को अधिक प्रत्यक्ष दिखाता, पर आधुनिक हिन्दी में अप्राकृतिक और संभावित रूप से सिद्धांतगत संकेत देने वाला होता; यहाँ सामान्य सामूहिक एकवचन अर्थ पर्याप्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। कथन की काल्पनिकता ‘शायद तुम मुझसे कहते’ से सुरक्षित है। ‘न अभी तक’ द्वारा adhuc का बल बनाए रखा गया है।
