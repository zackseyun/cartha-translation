source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: est, et dispositionis scriptae nusquam sunt. Et pertransimus de saeculo ut locustae, et uita nostra ut uapor, et nec digni sumus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/024.yaml
  text: and the written ordinances are nowhere to be found. And we pass through the age like locusts[a], and our life is like vapor, and we are not worthy,
translation:
  language: hi
  text: और लिखित विधि-विधान कहीं नहीं मिलते[a]। हम टिड्डियों के समान इस युग से होकर गुज़रते हैं, और हमारा जीवन वाष्प के समान है, और हम योग्य भी नहीं हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लिखित विधि-विधान कहीं नहीं मिलते’ संभवतः विपत्ति के कारण इस्राएल की प्रामाणिक लिखित व्यवस्था के प्रभावी रूप से खो जाने या निष्प्रभावी हो जाने को सूचित करता है; यह अनिवार्यतः हर पांडुलिपि के भौतिक रूप से लुप्त हो जाने का अर्थ नहीं है।
    reason: लातीनी कथन उपलब्धता के अभाव को व्यक्त करता है, पर हर लिखित प्रति के पूर्ण भौतिक विनाश का निर्णय नहीं करता।
lexical_decisions:
- source_word: dispositionis scriptae
  choice: लिखित विधि-विधान
  rationale: लातीनी पद लिखित रूप में स्थापित व्यवस्था या अधिकृत नियमों को सूचित करता है। ‘विधि-विधान’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: nusquam sunt
  choice: कहीं नहीं मिलते
  rationale: शाब्दिक अर्थ ‘कहीं नहीं हैं’ है; प्रसंग में ‘नहीं मिलते’ उपलब्ध न होने का भाव देता है, बिना यह अनिवार्य ठहराए कि हर लिखित प्रति भौतिक रूप से नष्ट हो गई थी।
- source_word: pertransimus de saeculo
  choice: इस युग से होकर गुज़रते हैं
  rationale: pertransimus के आर-पार होकर गुजरने के भाव और saeculum के ‘युग’ अर्थ को सुरक्षित रखा गया है; इसे ‘युग से विदा हो जाते हैं’ बनाकर समयपूर्व व्याख्या नहीं की गई।
- source_word: ut locustae
  choice: टिड्डियों के समान
  rationale: locustae का सीधा सामूहिक बिंब रखा गया है।
- source_word: uita nostra ut uapor
  choice: हमारा जीवन भाप के समान है
  rationale: uapor की क्षणभंगुरता का ठोस बिंब ‘भाप’ से स्पष्ट और निकटता से व्यक्त होता है।
- source_word: nec digni sumus
  choice: हम योग्य भी नहीं हैं
  rationale: nec के संयोजक और बलात्मक भाव को ‘भी नहीं’ से व्यक्त किया गया है तथा अधूरे वाक्यांश को अगले पद के लिए खुला रखा गया है।
theological_decisions:
- issue: लिखित व्यवस्था के न मिलने का आशय
  choice: मुख्य पाठ में ‘कहीं नहीं मिलते’ और पादटिप्पणी में अर्थगत अनिश्चितता
  alternative: सभी धर्मग्रंथ भौतिक रूप से लुप्त या नष्ट हो गए हैं
  rationale: स्रोत अनुपलब्धता या प्रभावी निरस्तीकरण और पूर्ण भौतिक लोप के बीच निर्णायक भेद नहीं करता; इसलिए किसी एक ऐतिहासिक निष्कर्ष को मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। स्रोत का आवर्ती ‘और’ तथा अंत का अधूरा प्रवाह सुरक्षित रखा गया है। पादटिप्पणी का चिह्न मुख्य पाठ में संबंधित वाक्यांश के बाद जोड़ा जाना आवश्यक है।
