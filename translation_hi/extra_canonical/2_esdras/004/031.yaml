  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminis
  choice: बीज
  rationale: लातीनी रूप का सीधा और स्वाभाविक अर्थ; इसमें अपने आप ‘बुरा’ जैसा कोई विशेषण निहित नहीं है।
- source_word: fructum impietatis
  choice: अभक्ति का फल
  rationale: ‘फल’ वाले रूपक को बनाए रखते हुए impietas के धार्मिक और नैतिक अर्थ को खुला रखता है।
- source_word: generauerit
  choice: उत्पन्न किया है
  rationale: बीज द्वारा फल पैदा होने की पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Quando
  choice: जब
  rationale: स्रोत-अंश के अंत में आए अगले वाक्यखंड के आरंभ को अधूरा ही सुरक्षित रखता है।
theological_decisions:
- issue: impietas का अर्थ
  choice: अभक्ति
  alternative: दुष्टता / अधर्म
  rationale: ‘अभक्ति’ परमेश्वर के प्रति अनादर और उससे जुड़ी नैतिक बुराई, दोनों की संभावना बनाए रखती है; किसी एक संकीर्ण धार्मिक व्याख्या को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत के अधूरे अंतिम ‘Quando’ को सुरक्षित रखने वाला अनुवाद। ‘स्वयं विचार करो’ पाठक को संबोधित आत्मचिंतन का भाव व्यक्त करता है।
