  text: They are likened to the womb of souls. For just as she who gives birth hastens to escape the necessity of childbirth[a], so also these
translation:
  language: hi
  text: इनकी तुलना आत्माओं के गर्भाशय से की गई है। क्योंकि जैसे प्रसव करनेवाली स्त्री प्रसव की पीड़ा[a] से छुटकारा पाने के लिए शीघ्रता करती है, वैसे ही ये भी…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘प्रसव की अनिवार्यता’ या ‘प्रसव की विवशता’।'
    reason: Latin necessitas का मूल अर्थ अनिवार्यता या विवशता है, पर प्रसव के संदर्भ में यह उससे जुड़ी पीड़ा या क्लेश का भाव भी रख सकता है।
lexical_decisions:
- source_word: matrici
  choice: गर्भ
  rationale: यहाँ Latin matrix का अर्थ वह गर्भ है जिसमें जीवन धारण किया जाता है; आधुनिक हिन्दी में ‘गर्भ’ स्वाभाविक और बोधगम्य है।
- source_word: animarum
  choice: आत्माओं के
  rationale: genitive plural को सीधे और प्रसंगानुकूल रूप में व्यक्त करता है।
- source_word: festinabit
  choice: उतावली होती है
  rationale: भविष्यत् रूप यहाँ सामान्य अनुभव बताने वाला कथन है; हिन्दी में वर्तमानकालीन सामान्य कथन अधिक स्वाभाविक है और शीघ्र मुक्ति पाने की तीव्रता भी बनाए रखता है।
- source_word: necessitatem partus
  choice: प्रसव की पीड़ा
  rationale: necessitas यहाँ प्रसव से जुड़ी अपरिहार्य कठिनाई या क्लेश का भाव रखता है; ‘पीड़ा’ उपमा के अनुभवात्मक आशय को सहज हिन्दी में व्यक्त करती है, जबकि शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: sic et haec
  choice: वैसे ही ये भी…
  rationale: Latin अंश इसी अधूरे तुलनात्मक वाक्यांश पर समाप्त होता है; दीर्घविराम उस अपूर्णता को बिना अनुपस्थित सामग्री जोड़े सुरक्षित रखता है।
