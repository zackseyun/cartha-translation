  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जननेवाली स्त्री’ स्रोत के quae parit को स्पष्ट करती है। अंतिम दीर्घविराम उपलब्ध Latin पाठ के अधूरे वाक्य को दर्शाता है।
