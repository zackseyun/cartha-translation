review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains both clauses of the supplied Latin and preserves the excerpt's unfinished comparison. ‘प्रसव की पीड़ा’ is contextually defensible for necessitatem partus, while the note appropriately records the more literal force of necessitas.
  naturalness: The wording is generally clear and modern. However, ‘आत्माओं के गर्भ’ is less precise for Latin matrici (‘womb’) and can sound as though the souls themselves possess a fetus. ‘आत्माओं के गर्भाशय’ is the more exact and intelligible rendering in this deliberately figurative expression. ‘शीघ्रता करती है’ is more idiomatic than ‘उतावली होती है’ in this context.
  terminology: ‘आत्माओं’ appropriately renders animarum. ‘गर्भाशय’ renders matrix accurately without adding an interpretation. ‘पीड़ा’ gives the experiential sense of necessitas partus; the footnote preserves the literal semantic range without treating one debated nuance as exclusive.
  issues:
  - severity: low
    issue: ‘गर्भ’ is imprecise for matrici.
    rationale: Matrix denotes a womb, not merely a pregnancy or fetus. ‘गर्भाशय’ makes the metaphor's source image more exact.
  - severity: low
    issue: ‘उतावली होती है’ slightly overstates the emotional coloring of festinabit.
    rationale: The Latin indicates hurrying or making haste. ‘शीघ्रता करती है’ retains that sense more neutrally and naturally.
