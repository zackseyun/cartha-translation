  text: how can your vessel grasp the way of the Most High[a], and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face, and I said to him, “It would have been better for us not to exist,”
translation:
  language: hi
  text: तुम्हारा पात्र परमप्रधान के मार्ग को कैसे ग्रहण कर सकता है, और इस भ्रष्ट युग से पहले ही जर्जर हो चुका होकर अविनाशिता को कैसे समझ सकता है?” ये बातें सुनकर मैं मुँह के बल गिर पड़ा और उससे कहा, “हमारा अस्तित्व ही न होता तो अच्छा होता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vas tuum
  choice: तुम्हारा पात्र
  rationale: ‘vas’ का ठोस रूपक बनाए रखा गया है; यहाँ यह मनुष्य की सीमित ग्रहण-क्षमता को दर्शाता है, पर उसे व्याख्यात्मक रूप से ‘मन’ या ‘बुद्धि’ नहीं बनाया गया।
- source_word: capere
  choice: ग्रहण कर सकता है
  rationale: यह ‘समेटने/समझने’ दोनों की छाया रखता है और पात्र के रूपक के साथ स्वाभाविक बैठता है।
- source_word: Altissimi
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त लैटिन उपाधि का प्रचलित और गरिमापूर्ण हिन्दी रूप।
- source_word: corrupto saeculo
  choice: इस भ्रष्ट युग से
  rationale: ‘saeculum’ को संदर्भानुसार ‘युग’ और ‘corruptus’ को नैतिक तथा क्षयशील दोनों अर्थों की गुंजाइश रखने वाले ‘भ्रष्ट’ से व्यक्त किया गया।
- source_word: exteritus
  choice: जर्जर हो चुका
  rationale: घिस जाने, क्षीण होने और थक चुकने का भाव देता है; ‘पात्र’ के रूपक से संबंध भी बनाए रखता है।
- source_word: incorruptionem
  choice: अविनाशिता
  rationale: ‘भ्रष्टता/क्षय’ के विपरीत अक्षय दशा को संज्ञा रूप में व्यक्त करता है और धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: non adesse
  choice: हमारा अस्तित्व ही न होता
  rationale: शाब्दिक ‘उपस्थित न होना’ के बजाय प्रसंगगत अस्तित्वगत अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया।
theological_decisions:
- issue: ‘incorruptionem’ का आशय
  choice: अविनाशिता
  alternative: अमरता
  rationale: ‘अमरता’ अर्थ को केवल मृत्यु-रहित जीवन तक सीमित कर सकती है; ‘अविनाशिता’ मूल के क्षय-विरोधी अर्थ और उसकी व्यापक धर्मवैज्ञानिक अनिश्चितता को सुरक्षित रखती है।
- issue: ‘vas tuum’ की व्याख्या
  choice: रूपक को ‘तुम्हारा पात्र’ के रूप में बनाए रखना
  alternative: तुम्हारा मन/तुम्हारी बुद्धि
  rationale: मूल पाठ पात्र का रूपक देता है; किसी विशिष्ट मानव-सामर्थ्य की पहचान थोपने के बजाय वही तनाव और अस्पष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रश्नों को दो वाक्यों में बाँटकर हिन्दी प्रवाह सुधारा गया, जबकि मूल तर्क-संबंध बना रहा। स्रोत में इसी पद के अंत में आए एज्रा के उत्तर को यहीं शामिल किया गया है।
