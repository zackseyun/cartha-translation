  text: and said, ‘Come, let us go up and subdue the forest of the plain, so that there too we may gain for ourselves another region.’ But the plan concerning the forest was in vain, for fire came and consumed it.
translation:
  language: hi
  text: और उन्होंने कहा, “आओ, हम चढ़कर मैदान के वन को अपने अधीन कर लें, ताकि वहाँ भी हम अपने लिए एक और प्रदेश प्राप्त कर लें।” परन्तु वन के विषय में उनकी योजना व्यर्थ हो गई, क्योंकि आग आई और उसे भस्म कर गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ascendentes
  choice: चढ़कर
  rationale: लातीनी पाठ में ऊपर जाने या चढ़ने का भाव स्पष्ट है; हिन्दी में इसे संक्षेप और स्वाभाविक रूप से रखा गया है।
- source_word: debellemus
  choice: अपने अधीन कर लें
  rationale: इस क्रिया में युद्ध करके पूरी तरह परास्त या वश में करने का भाव है; वन के मानवीकरण वाले प्रसंग में यह अभिव्यक्ति स्वाभाविक है।
- source_word: siluam campi
  choice: मैदान के वन
  rationale: लातीनी संबंध-रचना का सीधा अर्थ सुरक्षित रखा गया है, भले ही मैदान और वन का संयोग जानबूझकर विरोधाभासी प्रतीत हो।
- source_word: aliam regionem
  choice: एक और प्रदेश
  rationale: regionem के भू-क्षेत्र वाले सामान्य अर्थ को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: cogitatus siluae
  choice: वन के विषय में उनकी योजना
  rationale: षष्ठी संबंध को अस्पष्ट ‘वन की योजना’ न बनाकर वन को योजना का विषय माना गया है; ‘उनकी’ प्रसंग से कर्ताओं को स्पष्ट करता है।
- source_word: in uano
  choice: व्यर्थ हो गई
  rationale: योजना के निष्फल सिद्ध होने का अर्थ सहज हिन्दी में देता है।
- source_word: consum[memus]
  choice: प्राप्त कर लें
  rationale: पांडुलिपीय रूप संदिग्ध/विकृत है; उपलब्ध संदर्भ और परामर्श-पाठ के अनुसार अपने लिए अतिरिक्त क्षेत्र हासिल करने का भाव अपनाया गया है।
- source_word: consum-
  choice: भस्म कर दिया
  rationale: अगले पाठ में पूर्ण होने वाली क्रिया का आशय आग द्वारा वन को पूरी तरह जला देने का है; ‘भस्म’ आग के संदर्भ में सटीक और गरिमापूर्ण है।
