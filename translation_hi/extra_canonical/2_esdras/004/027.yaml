id: 2ES.4.27
reference: 2 Esdras 4:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam festinans festinat saeculum pertransire; Non enim capiet portare quae in temporibus iustis repromissa sunt, quoniam plenum mesticia est saeculum hoc et infirmitatibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/027.yaml
  text: because the age is hastening quickly to pass away. For it cannot bear the things that have been promised for the righteous in their proper times, because this age is full of sorrows and weaknesses.
translation:
  language: hi
  text: क्योंकि यह युग तेज़ी से समाप्ति की ओर बढ़ रहा है। क्योंकि यह उन बातों को धारण नहीं कर सकता जिनकी प्रतिज्ञा धर्मियों के लिए उचित समयों पर की गई है, क्योंकि यह युग दुःख और दुर्बलताओं से भरा हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: युग
  rationale: यहाँ saeculum वर्तमान विश्व-युग या काल-व्यवस्था को दर्शाता है; ‘युग’ इस अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: festinans festinat
  choice: शीघ्रता से ... दौड़ा जा रहा है
  rationale: लातीनी पुनरुक्ति तीव्र गति पर बल देती है; हिन्दी में यह वाक्यांश उस जोर को बनाए रखते हुए वर्तमान युग के अंत की ओर बढ़ने का भाव देता है।
- source_word: capiet portare
  choice: धारण नहीं कर सकता
  rationale: शाब्दिक रूप से ‘उठा/सह नहीं सकता’; ‘धारण करना’ प्रतिज्ञात भावी वास्तविकताओं को वर्तमान युग द्वारा समेट पाने की असमर्थता को खुला रखता है।
- source_word: quae ... repromissa sunt
  choice: जिन बातों की प्रतिज्ञा ... की गई है
  rationale: नपुंसकलिंग बहुवचन quae को किसी अनावश्यक विशिष्ट वस्तु में सीमित किए बिना ‘बातों’ से व्यक्त किया गया है।
- source_word: in temporibus iustis
  choice: उनके उचित समयों में
  rationale: iustis का मूल अर्थ ‘न्यायोचित/उचित’ है; संदर्भ में नियत या उपयुक्त समय का भाव है, इसलिए ‘उचित’ चुना गया और बहुवचन बनाए रखा गया।
- source_word: mesticia
  choice: दुःखों
  rationale: पाठ का आशय शोक और संताप है; ‘दुःखों’ आधुनिक हिन्दी में सहज है और बहुवचन को सुरक्षित रखता है।
- source_word: infirmitatibus
  choice: दुर्बलताओं
  rationale: शब्द शारीरिक या व्यापक मानवीय निर्बलताओं दोनों को सूचित कर सकता है; ‘दुर्बलताओं’ इस अर्थ-विस्तार को बनाए रखता है।
theological_decisions:
- issue: धर्मियों के लिए प्रतिज्ञात बातों और उनके समय का संबंध
  choice: ‘धर्मियों के लिए उनके उचित समयों में’
  alternative: ‘धर्मियों से उनके समय में’
  rationale: लातीनी dative iustis को लाभार्थी (‘धर्मियों के लिए’) के रूप में समझना अधिक स्वाभाविक है, जबकि in temporibus समय-संबंधी पद है। अनुवाद यह स्पष्ट करता है कि प्रतिज्ञात बातें धर्मियों के लिए हैं, पर उनकी प्रकृति को निर्दिष्ट नहीं करता।
- issue: वर्तमान युग की भावी प्रतिज्ञाओं को वहन करने की असमर्थता
  choice: ‘धारण नहीं कर सकता’
  alternative: ‘सहन नहीं कर सकता’
  rationale: ‘धारण’ portare की वहन/समेटने की छवि को बनाए रखता है और इसे केवल पीड़ा सहने के अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। लातीनी वाक्य की युग-संबंधी छवि, जोरदार गति, बहुवचन ‘समयों’, ‘दुःखों’ और ‘दुर्बलताओं’, तथा प्रतिज्ञात बातों की अनिर्दिष्टता को बनाए रखा गया है।
