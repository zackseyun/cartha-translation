revisions:
- from: क्योंकि यह युग शीघ्रता से बीत जाने को दौड़ा जा रहा है। यह उन बातों को धारण नहीं कर सकता जिनकी प्रतिज्ञा धर्मियों के लिए उनके उचित समयों में की गई है, क्योंकि यह युग दुःखों और दुर्बलताओं से भरा हुआ है।
  to: क्योंकि यह युग तेज़ी से समाप्ति की ओर बढ़ रहा है। क्योंकि यह उन बातों को धारण नहीं कर सकता जिनकी प्रतिज्ञा धर्मियों के लिए उचित समयों पर की गई है, क्योंकि यह युग दुःख और दुर्बलताओं से भरा हुआ है।
  rationale: The revision replaces the non-idiomatic motion image with natural Hindi that preserves the Latin emphasis on the age’s rapid movement toward passing away. It removes the possessive implication from the temporal phrase and reflects the singular abstract ‘sorrow’ alongside plural ‘weaknesses.’ No footnotes are required, since the translation retains the source’s ambiguity without a textual or lexical clarification needing an anchor.
  reviewer_model: gpt-5.6-terra
