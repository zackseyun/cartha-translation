review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the main sense: the present age is passing away, cannot bear/contain what is promised for the righteous at fitting times, and is marked by sorrow and weaknesses. However, ‘दौड़ा जा रहा है’ is an awkward and slightly misleading rendering of festinans festinat, and ‘उनके उचित समयों में’ introduces an unnecessary possessive ambiguity absent from in temporibus iustis. The singular abstract mesticia is better represented by singular ‘दुःख’ or ‘शोक’ than by ‘दुःखों’.'
  naturalness: ‘शीघ्रता से बीत जाने को दौड़ा जा रहा है’ is not idiomatic modern standard Hindi. ‘तेज़ी से समाप्ति की ओर बढ़ रहा है’ is natural, retains the emphatic movement toward passing away, and suits the elevated register. ‘धारण नहीं कर सकता’ is acceptable in this literary context and preserves the open-ended bearing/containing image.
  terminology: ‘युग’ appropriately renders saeculum; ‘धर्मी’ appropriately renders iustis without interpretive expansion; ‘प्रतिज्ञा’ and ‘दुर्बलताओं’ are suitable. Rendering mesticia as ‘दुःख’ preserves its abstract singular sense.
  issues:
  - severity: medium
    issue: Unnatural rendering of festinans festinat
    rationale: ‘दौड़ा जा रहा है’ normally evokes literal running and is syntactically awkward with ‘बीत जाने को’; it does not read naturally as a description of an age’s rapid approach to its end.
  - severity: low
    issue: Unwarranted possessive ambiguity in the timing phrase
    rationale: ‘उनके उचित समयों में’ can imply that the times belong to the righteous, whereas the Latin simply says ‘in proper/fitting times.’ ‘उचित समयों पर’ is clearer and remains faithful.
  - severity: low
    issue: Number of mesticia
    rationale: The supplied Latin has singular abstract mesticia. Singular ‘दुःख’ better reflects this while retaining the distinct plural infirmitatibus as ‘दुर्बलताओं’.
  revised_text: क्योंकि यह युग तेज़ी से समाप्ति की ओर बढ़ रहा है। क्योंकि यह उन बातों को धारण नहीं कर सकता जिनकी प्रतिज्ञा धर्मियों के लिए उचित समयों पर की गई है, क्योंकि यह युग दुःख और दुर्बलताओं से भरा हुआ है।
  revised_footnotes: []
  revision_rationale: The revision replaces the non-idiomatic motion image with natural Hindi that preserves the Latin emphasis on the age’s rapid movement toward passing away. It removes the possessive implication from the temporal phrase and reflects the singular abstract ‘sorrow’ alongside plural ‘weaknesses.’ No footnotes are required, since the translation retains the source’s ambiguity without a textual or lexical clarification needing an anchor.
