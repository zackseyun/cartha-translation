source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit mihi : excedens excessit cor tuum in saeculo hoc, et comprehendere cogitas uiam altissimi?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/002.yaml
  text: and said to me[a], “Your heart has gone far beyond in this age, and do you think to comprehend the way of the Most High?”
translation:
  language: hi
  text: उसने मुझसे कहा, “इस युग में तुम्हारा मन अपनी सीमा से बहुत आगे निकल गया है[a]; फिर क्या तुम परमप्रधान के मार्ग को समझ लेने की सोचते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस युग में तुम्हारा मन पूरी तरह चकरा गया है।”
    reason: ‘excedens excessit cor tuum’ का शाब्दिक बिंब सीमा पार करने का है, पर यह मन के चकराने या समझ के विफल होने का सामी मुहावरा भी प्रतिबिंबित कर सकता है।
lexical_decisions:
- source_word: excedens excessit
  choice: अपनी सीमा से बहुत आगे निकल गया है
  rationale: दोहराव तीव्रता व्यक्त करता है। यह चुनाव ‘हद से आगे निकलने’ का मूल बिंब बनाए रखता है, जबकि हिन्दी में स्वाभाविक भी है।
- source_word: cor tuum
  choice: तुम्हारा मन
  rationale: यहाँ लैटिन ‘cor’ केवल शारीरिक हृदय नहीं, बल्कि समझने-विचारने की भीतरी क्षमता को दर्शाता है; इस प्रसंग में ‘मन’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: in saeculo hoc
  choice: इस युग में
  rationale: ‘saeculum’ का कालगत अर्थ ‘युग’ है। ‘में’ मूल वाक्य की व्यापकता बनाए रखता है और इसे बिना आधार केवल ‘इस युग के विषय में’ तक सीमित नहीं करता।
- source_word: comprehendere
  choice: समझ लेने
  rationale: यह बौद्धिक रूप से ग्रहण करने या पूरी तरह समझने का भाव देता है।
- source_word: uiam altissimi
  choice: परमप्रधान के मार्ग
  rationale: ‘Altissimus’ के लिए प्रतिष्ठित और अर्थ-सटीक ‘परमप्रधान’ तथा ‘uia’ के लिए मूल रूपक को बनाए रखने वाला ‘मार्ग’ चुना गया है।
theological_decisions:
- issue: excedens excessit cor tuum का आशय
  choice: मुख्य पाठ में सीमा से बहुत आगे निकल जाने का बिंब रखा गया
  alternative: ‘तुम्हारा मन पूरी तरह चकरा गया है’ अथवा ‘तुम्हारी बुद्धि पूरी तरह विफल हो गई है’
  rationale: लैटिन क्रिया में ‘पार निकलने’ का स्पष्ट शब्द-बिंब है, पर इसके पीछे ऐसा सामी मुहावरा हो सकता है जो मन के चकराने या समझ विफल होने को व्यक्त करता है। मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
- issue: परमप्रधान के ‘मार्ग’ का अर्थ
  choice: ‘मार्ग’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘कार्य-प्रणाली’, ‘योजना’ या ‘भेद’
  rationale: मूल पाठ व्यापक और धर्मवैज्ञानिक रूप से अर्थपूर्ण रूपक इस्तेमाल करता है; किसी एक संकीर्ण अर्थ में इसे बाँधना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रश्न में ‘फिर क्या’ तर्क की लघु-से-महान दिशा को स्वाभाविक हिन्दी में उभारता है, बिना मूल आशय में नया सिद्धांत जोड़े।
