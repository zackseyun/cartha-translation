  text: what is above the height of the heavens.” And I answered and said[a], “I beg you, Lord, why has understanding been given to me?”
translation:
  language: hi
  text: “जो आकाश की ऊँचाई से भी ऊपर है।” तब मैंने उत्तर देकर कहा, “हे प्रभु, मैं आपसे विनती करता हूँ, मुझे समझने की क्षमता क्यों दी गई है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae super altitudinem caelorum
  choice: जो आकाश की ऊँचाई से भी ऊपर है
  rationale: यह पिछले पद से जारी संबंधवाचक खंड है। ‘super’ के तुलनात्मक भाव को स्वाभाविक हिन्दी में ‘से भी ऊपर’ से व्यक्त किया गया है।
- source_word: deprecor te, domine
  choice: हे प्रभु, मैं आपसे विनती करता हूँ
  rationale: ‘deprecor’ की विनम्र और आग्रहपूर्ण प्रार्थना तथा ‘domine’ के सीधे संबोधन—दोनों को स्पष्ट रखा गया है।
- source_word: sensus intellegendi
  choice: समझने की क्षमता
  rationale: यह केवल प्राप्त ज्ञान नहीं, बल्कि समझ सकने की योग्यता या सामर्थ्य को सूचित करता है; इसलिए ‘समझ’ मात्र की अपेक्षा यह अधिक सटीक है।
- source_word: ut quid
  choice: फिर ... क्यों
  rationale: प्रसंग में एज्रा का प्रश्न पिछले कथन के प्रत्युत्तर में है; ‘फिर’ उस तार्किक संबंध को सहज हिन्दी में प्रकट करता है।
theological_decisions:
- issue: समझने की क्षमता दिए जाने के उद्देश्य पर प्रश्न
  choice: प्रश्न को अनसुलझे तनाव सहित रखा गया है
  alternative: इसे शिकायत, विरोध या किसी निश्चित धार्मिक निष्कर्ष के रूप में अधिक स्पष्ट करना
  rationale: लैटिन केवल पूछता है कि यह क्षमता क्यों दी गई; वक्ता की मंशा या अपेक्षित उत्तर को पाठ से आगे बढ़कर निर्धारित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। आरंभिक खंड को पिछले पद से जारी वाक्य के समापन के रूप में रखा गया है। अंग्रेज़ी मसौदे का फुटनोट कोई वास्तविक वैकल्पिक पाठ नहीं देता, इसलिए अनावश्यक फुटनोट नहीं जोड़ा गया।
