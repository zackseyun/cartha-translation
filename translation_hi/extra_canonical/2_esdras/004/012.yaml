lexical_decisions:
- source_word: quam
  choice: इसकी अपेक्षा कि
  rationale: यह तुलनात्मक संयोजक है और पिछले पद में आरम्भ हुई तुलना को आगे बढ़ाता है; इसलिए हिन्दी पाठ भी जानबूझकर मध्य-वाक्य से आरम्भ होता है।
- source_word: aduenientes
  choice: हम संसार में आकर
  rationale: शाब्दिक अर्थ ‘आकर’ है। कर्ता अगले बहुवचन क्रियापदों से स्पष्ट होता है; ‘संसार में’ हिन्दी में अभिप्रेत आगमन को स्वाभाविक बनाता है।
- source_word: uiuere in impietatibus
  choice: अभक्ति में जीवन बिताएँ
  rationale: impietates परमेश्वर के प्रति अनादर/अधर्म का भाव रखता है; ‘अभक्ति’ इस धार्मिक अर्थ को संक्षेप में सुरक्षित रखती है।
- source_word: pati
  choice: दुःख सहें
  rationale: निरपेक्ष pati का अर्थ कष्ट या दुःख भोगना है; ‘दुःख सहना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: non intelligere de qua re
  choice: यह न समझें कि ऐसा क्यों हो रहा है
  rationale: शाब्दिक ‘किस बात के विषय में न समझना’ प्रसंग में दुःख का कारण न समझने को व्यक्त करता है; हिन्दी में ‘क्यों’ वही आशय सहज रूप से देता है।
- source_word: proficiscens
  choice: चल पड़कर
  rationale: वर्तमान कृदन्त को छोड़ा नहीं गया है। यह अगले पद की क्रिया से जुड़ता है और इस पद को जानबूझकर अधूरा छोड़ता है।
theological_decisions:
- issue: impietatibus का धार्मिक स्वर
  choice: अभक्ति
  alternative: अधर्म
  rationale: ‘अभक्ति’ परमेश्वर के प्रति श्रद्धाहीनता के स्रोतगत भाव को बनाए रखती है, जबकि ‘अधर्म’ अधिक व्यापक नैतिक अर्थ ले सकता है।
- issue: खंडित पद-सीमा को पूरा करना
  choice: पद को ‘चल पड़कर’ पर अधूरा रहने देना
  alternative: अगले पद की क्रिया यहाँ जोड़कर वाक्य पूरा करना
  rationale: प्रदत्त लैटिन स्रोत proficiscens पर समाप्त होता है। पद-विभाजन की असहजता को मिटाने के लिए स्रोत से बाहर के शब्द जोड़ना उचित नहीं है।
