  yaml_path: translation/extra_canonical/2_esdras/004/005.yaml
  text: And I said[a], “Speak, my lord.” And he said to me, “Go, weigh for me the weight of fire, or measure for me the measure of wind, or call back for me the day that has passed.”
translation:
  language: hi
  text: और मैंने कहा, “मेरे प्रभु, बोलिए।” तब उसने मुझसे कहा, “जाओ, मेरे लिए आग का भार तौलो, या मेरे लिए हवा का माप नापो[a], या उस दिन को मेरे लिए वापस बुलाओ जो बीत चुका है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हवा का माप नापो” के लिए प्रयुक्त लैटिन वाक्यांश पाठ की दृष्टि से कठिन है। आशय स्पष्टतः हवा को परिमाणित करने की असंभव माँग है, पर शब्दों के पीछे निहित सटीक माप-इकाई अनिश्चित है।
    reason: textual_variant
lexical_decisions:
- source_word: dominus meus
  choice: मेरे प्रभु
  rationale: लैटिन में यह संबोधन है; ‘मेरे प्रभु’ सम्मानपूर्ण और स्वाभाविक हिन्दी संबोधन है।
- source_word: pondera mihi ignis pondus
  choice: मेरे लिए आग का भार तौलो
  rationale: मूल की जानबूझकर असंभव माँग और ‘भार/तौलो’ की समान-मूलक अभिव्यक्ति को बनाए रखता है।
- source_word: mensura mihi satum uenti
  choice: मेरे लिए हवा का माप नापो
  rationale: पाठ की कठिन और कुछ असहज शब्दावली को अत्यधिक स्पष्ट किए बिना, हवा को परिमाणित करने की असंभव माँग व्यक्त करता है।
- source_word: reuoca mihi diem quae praeteriit
  choice: उस दिन को मेरे लिए वापस बुलाओ जो बीत चुका है
  rationale: reuoca के ‘फिर बुलाना/वापस बुलाना’ अर्थ और बीते दिन को लौटा लाने की असंभवता को निकटता से सुरक्षित रखता है।
