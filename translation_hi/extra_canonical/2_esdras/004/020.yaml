  text: to me and said, “You have judged rightly, so why have you not judged for yourself?”
translation:
  language: hi
  text: मेरे पास आकर उसने कहा, “तुमने ठीक न्याय किया है; फिर अपने लिए न्याय क्यों नहीं किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bene tu iudicasti
  choice: तुमने ठीक न्याय किया है
  rationale: लैटिन में न्याय करने या सही निर्णय देने की भाषा को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: quare non iudicasti tibi
  choice: फिर अपने लिए न्याय क्यों नहीं किया?
  rationale: ‘tibi’ का अर्थ ‘अपने लिए’ रखकर मूल की संक्षिप्तता और संभावित व्यापकता सुरक्षित रखी गई है; इसे केवल ‘अपने मामले में’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘अपने लिए न्याय करना’ का आशय
  choice: मूल की अस्पष्ट अभिव्यक्ति ‘अपने लिए न्याय’ को बनाए रखा गया।
  alternative: ‘अपने मामले में सही निर्णय क्यों नहीं किया?’
  rationale: वैकल्पिक रूप संदर्भ को अधिक स्पष्ट करता, पर लैटिन ‘tibi’ में निहित व्यापक और कुछ हद तक तनावपूर्ण अर्थ को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी; न्याय-संबंधी शब्दावली को मूल लैटिन के निकट रखा गया है।
