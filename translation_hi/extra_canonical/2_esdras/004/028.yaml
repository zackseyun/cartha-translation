source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Seminatum est enim malum, de quo me interrogas de eo, et necdum uenit destrictio ipsius. Si ergo non messum fuerit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/028.yaml
  text: For the evil about which you ask me has been sown[a], and its destruction has not yet come. If therefore it is not reaped,
translation:
  language: hi
  text: क्योंकि जिस बुराई के विषय में तुम मुझसे पूछते हो, वह बोई जा चुकी है, और उसकी कटनी[a] अभी तक नहीं हुई है। अतः यदि उसे काटा न जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वैकल्पिक रूप से, ‘उसका विनाश’। लातिनी पाठ का शब्द destrictio यहाँ कृषि-रूपक के अनुसार ‘कटनी’ समझा गया है।
    reason: वैकल्पिक पारंपरिक अर्थ को दर्ज करते हुए, बिना अप्रमाणित पांडुलिपि-साक्ष्य का दावा किए, संदर्भानुकूल कृषि-अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: Seminatum est
  choice: बोई जा चुकी है
  rationale: पूर्ण निष्पन्न कर्म को व्यक्त करता है और आगे आने वाले कटनी के रूपक को बनाए रखता है।
- source_word: malum
  choice: बुराई
  rationale: यहाँ अमूर्त नैतिक बुराई अभिप्रेत है; हिंदी में स्त्रीलिंग रूप कृषि-रूपक के साथ स्वाभाविक है।
- source_word: destrictio
  choice: कटनी
  rationale: इस प्रसंग में शब्द का अर्थ फसल काटना या कटनी है, न कि विनाश; आगे के messum से कृषि-रूपक स्पष्ट होता है।
- source_word: messum fuerit
  choice: उसे काटा न जाए
  rationale: लातिनी निष्क्रिय रूप को स्वाभाविक हिंदी में रखा गया है और अधूरे शर्तवाचक वाक्य को अगले पद के लिए खुला छोड़ा गया है।
theological_decisions:
- issue: बुराई की कटनी का रूपक
  choice: बोने और काटने की निरंतर कृषि-छवि बनाए रखी गई
  alternative: ‘उसका विनाश अभी नहीं आया’
  rationale: ‘विनाश’ कृषि-रूपक को तोड़ देता है और destrictio को संदर्भ से अलग अर्थ देता है; स्रोत में अगले वाक्य का messum भी कटनी की पुष्टि करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। पद स्रोत की तरह अधूरे शर्तवाचक वाक्य और अंतिम अल्पविराम पर समाप्त होता है, क्योंकि उसका उत्तरवर्ती भाग अगले पद में आता है।
