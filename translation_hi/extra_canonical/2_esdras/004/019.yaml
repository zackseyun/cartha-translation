lexical_decisions:
- source_word: utrique
  choice: दोनों ने
  rationale: यह दोनों पूर्वोक्त पक्षों को समान रूप से संदर्भित करता है।
- source_word: uanam cogitationem cogitauerunt
  choice: व्यर्थ की कल्पना की है
  rationale: लैटिन की cognate अभिव्यक्ति का अर्थ निष्फल अथवा अव्यावहारिक विचार करना है; सहज हिन्दी के लिए अनावश्यक शब्द-पुनरावृत्ति नहीं रखी गई।
- source_word: terra enim data est siluae
  choice: क्योंकि धरती वन को दी गई है
  rationale: data est की पूर्ण कर्मवाच्य संरचना और siluae के संप्रदान अर्थ को निकटता से सुरक्षित रखा गया है।
- source_word: maris locus portare fluctus suos
  choice: समुद्र का स्थान उसकी लहरों को धारण करने के लिए है
  rationale: लैटिन की संक्षिप्त infinitival संरचना को स्वाभाविक हिन्दी में व्यक्त किया गया; suos का संबंध समुद्र से स्पष्ट रखा गया।
- source_word: Et respondit
  choice: तब उसने उत्तर दिया—
  rationale: अगले पद की ओर ले जाने वाले अधूरे कथात्मक सूत्र को दीर्घ विराम-चिह्न के साथ बनाए रखा गया।
