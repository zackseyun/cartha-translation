  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्रोत-पाठ के अधूरे वाक्य को पूरा करने का अनुमान नहीं लगाया गया; अंतिम दीर्घ विराम उसकी निरंतरता दर्शाता है।
