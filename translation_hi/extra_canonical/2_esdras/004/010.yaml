  text: यदि तुम उन चीज़ों को नहीं समझ सकते जो तुम्हारे साथ बढ़ी हैं, तो फिर तुम कैसे कर पाओगे—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tecum coaſdulescentia
  choice: अपने साथ बढ़ी हुई बातों को
  rationale: लातीनी पद का शाब्दिक बिंब ‘तुम्हारे साथ बड़ी/विकसित हुई वस्तुएँ’ है। ‘बातों’ से इसका सामान्य और संदर्भानुकूल विस्तार व्यक्त होता है, जबकि ‘अपने साथ बढ़ी हुई’ मूल की असामान्य अभिव्यक्ति और उसकी अस्पष्टता को बनाए रखता है।
- source_word: cognoſcere
  choice: समझ सकते
  rationale: यहाँ cognoscere का आशय केवल पहचानना या जानना नहीं, बल्कि समझ पाना है; इसलिए आधुनिक हिन्दी में ‘समझ सकते’ स्वाभाविक है।
- source_word: Et quomodo poterit
  choice: तो फिर कैसे समझ सकोगे—
  rationale: उपलब्ध स्रोत इसी अधूरे प्रश्न पर रुकता है। हिन्दी में पूर्ववर्ती क्रिया ‘समझना’ को स्वाभाविक रूप से दोहराया गया है और दीर्घ विराम-चिह्न से अगले अंश की ओर खुला वाक्य सुरक्षित रखा गया है।
