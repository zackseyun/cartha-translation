id: 2ES.4.36
reference: 2 Esdras 4:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'archangelus et dixit: quando impletus fuerit numerus similium uobis, quoniam in statera ponderauit saeculum, Et mensura'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/036.yaml
  text: And the archangel answered and said, ‘When the number of those like you is completed, for he has weighed the age in a balance,
translation:
  language: hi
  text: और प्रधान स्वर्गदूत ने उत्तर देकर कहा, “जब तुम जैसे लोगों की संख्या पूरी हो जाएगी, क्योंकि उसने युग को तराज़ू में तौला है, और माप से—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: archangelus
  choice: प्रधान स्वर्गदूत
  rationale: ‘Archangel’ के लिए सहज और अर्थ-पारदर्शी हिन्दी; स्रोत में कोई व्यक्तिगत नाम नहीं है।
- source_word: quando impletus fuerit numerus similium uobis
  choice: जब तुम जैसे लोगों की संख्या पूरी हो जाएगी
  rationale: लैटिन की भविष्य पूर्णता और बहुवचन uobis को बनाए रखता है; similium का संबंध ‘तुम जैसे लोगों’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: in statera ponderauit saeculum
  choice: उसने युग को तराज़ू में तौला है
  rationale: statera के तौलने वाले बिंब और saeculum के काल/युग संबंधी अर्थ को सुरक्षित रखता है।
- source_word: Et mensura
  choice: और माप से—
  rationale: प्रदत्त स्रोत यहीं अपूर्ण रूप में अगले वाक्यांश में प्रवेश करता है; ‘माप’ मूल संज्ञा को रखता है और डैश पाठ के टूटने/जारी रहने का संकेत देता है।
theological_decisions:
- issue: प्रधान स्वर्गदूत की पहचान
  choice: कोई नाम नहीं जोड़ा गया
  alternative: यरेमिएल नाम जोड़ना
  rationale: प्रदत्त लैटिन पाठ में स्वर्गदूत का नाम उपस्थित नहीं है; नाम जोड़ना स्रोत से आगे जाना होता।
- issue: saeculum का अर्थ
  choice: युग
  alternative: संसार
  rationale: संदर्भ में अवधि के पूर्ण होने और उसे तौलने की बात है, इसलिए कालगत अर्थ ‘युग’ अधिक उपयुक्त है, जबकि ‘संसार’ भी शब्द का संभावित व्यापक अर्थ हो सकता है।
- issue: quoniam का संबंध
  choice: ‘क्योंकि’ द्वारा पूर्व कथन से जोड़ा
  alternative: नया स्वतंत्र वाक्य आरंभ करना
  rationale: मूल में कारणसूचक संबंध स्पष्ट है, पर उसका पूरा तर्क अगले पाठ में जारी है; इसलिए उसे बिना सुलझाए बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। पद का अंतिम ‘Et mensura’ अगले अंश से व्याकरणिक रूप से जुड़ा और यहाँ अधूरा है; इसे पूर्ण वाक्य बनाने के बजाय डैश से खुला रखा गया है।
