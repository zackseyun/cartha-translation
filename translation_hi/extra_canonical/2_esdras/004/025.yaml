translation:
  language: hi
  text: दया प्राप्त कर सकें। परन्तु वह अपने नाम के लिए क्या करेगा[a], जो
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पद-विभाजन में आगे के शब्द भी इसी पद में रखे जाते हैं: “दया प्राप्त कर सकें। परन्तु वह अपने उस नाम के लिए क्या करेगा, जो हम पर पुकारा गया है? मैंने इन्हीं बातों के विषय में पूछा था।”'
    reason: पूर्ववर्ती पाठ-रूप और वैकल्पिक पद-विभाजन को दर्ज करना; उपलब्ध लातीनी स्रोत में वर्तमान पद ‘जो’ पर समाप्त होता है।
lexical_decisions:
- source_word: misericordiam consequi
  choice: दया प्राप्त कर सकें
  rationale: ‘misericordiam’ को ‘दया’ और ‘consequi’ को ‘प्राप्त करना’ के अर्थ में रखा गया है; खंड पूर्ववर्ती वाक्य से जुड़ा होने के कारण हिन्दी में क्रियात्मक संबंध बनाए रखा गया है।
- source_word: quid faciet nomini suo
  choice: वह अपने नाम का क्या करेगा
  rationale: लातीनी दत्तिव ‘nomini suo’ का स्वाभाविक हिन्दी रूप ‘अपने नाम का’ है; प्रश्न की खुली धर्मवैचारिक धार को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: quod
  choice: जो
  rationale: यह संबंधवाचक सर्वनाम अगले पद में पूरी होने वाली उपवाक्य-रचना आरम्भ करता है; पद-सीमा पर मूल पाठ की अपूर्णता जानबूझकर बनाए रखी गई है।
theological_decisions:
- issue: ‘अपने नाम’ के साथ परमेश्वर की भावी कार्रवाई का आशय
  choice: वह अपने नाम का क्या करेगा
  alternative: वह अपने नाम की खातिर क्या करेगा
  rationale: ‘की खातिर’ उद्देश्य या प्रेरणा को अधिक निश्चित कर देता; मूल ‘nomini suo’ ऐसी व्याख्या को अनिवार्य नहीं करता, इसलिए अपेक्षाकृत खुला रूप चुना गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्रोत की पद-सीमा के कारण अंतिम ‘जो’ अपूर्ण है; इसे अगले पद से कृत्रिम रूप से जोड़कर पूरा नहीं किया गया।
