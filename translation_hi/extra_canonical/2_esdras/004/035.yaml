base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/035.yaml
  text: Did not the souls of the righteous ask about these things in their chambers[a], saying, ‘How long shall I hope thus? And when will the fruit of the threshing floor of our reward come?’ And Jeremiel answered them[b],
translation:
  language: hi
  text: क्या धर्मियों की आत्माओं ने अपने कक्षों में[a] इन बातों के विषय में यह कहते हुए नहीं पूछा था, “मैं इस प्रकार कब तक आशा लगाए रहूँ? और हमारे प्रतिफल के खलिहान की उपज कब आएगी?” और यरेमिएल ने उन्हें उत्तर दिया,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन ‘कक्षों’ में आत्माओं को निर्धारित समय तक सुरक्षित रखे जाने की छवि पद 40–42 की प्रसव-वेदना वाली उपमा की भूमिका तैयार करती है, जहाँ पूरी संख्या के पूरा होने की प्रतीक्षा है।
    reason: cross_reference
  - marker: b
    text: लैटिन में ‘मैं … आशा लगाऊँ’ एकवचन है, यद्यपि बोलनेवाली आत्माएँ अनेक हैं और आगे ‘हमारे प्रतिफल’ कहा गया है। कुछ अन्य प्राचीन संस्करणों के आधार पर इसे ‘हम … आशा लगाए रहें’ भी समझा जा सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: suis
  choice: अपने कक्षों में
  rationale: लैटिन में संज्ञा लुप्त है और केवल ‘अपने/उनके’ का रूप बचा है; प्रसंग आत्माओं के सुरक्षित, निर्धारित निवास-स्थानों का है। ‘कक्ष’ इस अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘भंडार’ संभावित रूपक को अत्यधिक निश्चित कर देता।
- source_word: usquequo spero sic?
  choice: मैं इस प्रकार कब तक आशा लगाए रहूँ?
  rationale: spero व्याकरणतः प्रथम पुरुष एकवचन है। बहुवचन वक्ताओं के साथ तनाव को सुधारकर मिटाने के बजाय मूल लैटिन का एकवचन मुख्य पाठ में रखा गया है।
- source_word: fructus areae mercedis nostrae
  choice: हमारे प्रतिफल के खलिहान की उपज
  rationale: ‘खलिहान’ और ‘उपज’ की असामान्य परंतु महत्वपूर्ण कृषि-छवि को बनाए रखते हुए हिंदी संबंध-रचना को सुबोध बनाया गया है।
- source_word: Hieremiel
  choice: यरेमिएल
  rationale: नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण, बिना इसे अधिक परिचित परंतु भिन्न नाम ‘यिर्मयाह’ में बदलने के।
theological_decisions:
- issue: धर्मी आत्माओं के प्रतीक्षा-स्थल का स्वरूप
  choice: कक्ष
  alternative: भंडारगृह / सुरक्षित स्थान
  rationale: पाठ आत्माओं के आरक्षित निवास का संकेत देता है, पर उसके स्वरूप की विस्तृत परलोक-संबंधी व्यवस्था निश्चित नहीं करता; इसलिए अपेक्षाकृत तटस्थ शब्द चुना गया।
- issue: बहुवचन आत्माओं के कथन में एकवचन spero
  choice: मुख्य पाठ में ‘मैं … आशा लगाए रहूँ’
  alternative: ‘हम … आशा लगाए रहें’
  rationale: लैटिन साक्ष्य का वास्तविक व्याकरणिक तनाव सुरक्षित रखा गया है। बहुवचन विकल्प अर्थ और अन्य प्राचीन संस्करणों से समर्थित है, इसलिए उसे पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रश्न की उद्धरणात्मक संरचना, खलिहान की कृषि-छवि और लैटिन के एकवचन-बहुवचन तनाव को जानबूझकर सुरक्षित रखा गया है।
