lexical_decisions:
- source_word: profectus sum
  choice: मैं ... की ओर निकल पड़ा
  rationale: लातीनी क्रिया का अर्थ केवल पहुँचना नहीं, बल्कि किसी स्थान की ओर प्रस्थान करना है; यह अनावश्यक रूप से ‘एक बार’ जोड़े बिना उस गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: siluam lignorum campi
  choice: मैदान के पेड़ों के एक वन
  rationale: लातीनी संबंध-विन्यास ‘मैदान के पेड़ों का वन’ को यथासंभव बनाए रखता है और ‘मैदान’ को सीधे ‘वन’ का विशेषण बनाकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: cogitauerunt cogitationem
  choice: एक योजना बनाई
  rationale: शाब्दिक ‘एक विचार सोचा’ हिन्दी में अस्वाभाविक है; प्रसंग में सामूहिक विचार-विमर्श से बनी योजना अभिप्रेत है।
- source_word: faciamus
  choice: बनाएँ
  rationale: क्रिया के ‘बनाना/करना’ अर्थ को रखा गया है। पद स्रोत में अधूरे वाक्य पर समाप्त होता है, इसलिए हिन्दी में भी पूरक वस्तु नहीं जोड़ी गई।
