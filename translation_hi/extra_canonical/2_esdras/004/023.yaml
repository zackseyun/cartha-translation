id: 2ES.4.23
reference: 2 Esdras 4:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Non enim uolui interrogare de superioribus uiis, sed de his quae pertranseunt per nos cotidie: propter quod, Israel datus est in obprobrium gentibus, quem dilexisti populum datus est tribubus impiis, et lex patrum nostrorum in inritum deducta'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/023.yaml
  text: 'For I did not want to ask about the ways above[a], but about the things that happen among us daily: why Israel has been given over as a reproach to the nations, why the people whom you loved has been given over to ungodly tribes, and why the law of our fathers has been brought to nothing.'
translation:
  language: hi
  text: 'क्योंकि मैं ऊपर के मार्गों के विषय में नहीं पूछना चाहता था, बल्कि उन बातों के विषय में जो प्रतिदिन हमारे बीच घटती हैं: इस्राएल को अन्यजातियों के बीच तिरस्कार का कारण क्यों बना दिया गया है, जिस प्रजा से तूने प्रेम किया उसे अधर्मी कुलों के हाथ क्यों सौंप दिया गया है, और हमारे पूर्वजों की व्यवस्था को निष्फल क्यों कर दिया गया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superioribus uiis
  choice: ऊपर के मार्गों
  rationale: लातीनी पदबंध का औपचारिक रूप और पूर्ववर्ती प्रसंग की स्थानिक/रहस्यमय अस्पष्टता बनाए रखता है; इसे व्याख्यात्मक रूप से ‘स्वर्गीय मार्ग’ नहीं बनाया गया।
- source_word: quae pertranseunt per nos cotidie
  choice: जो प्रतिदिन हमारे बीच घटती हैं
  rationale: सेमिटिक प्रभाव वाले पदबंध का आशय समुदाय द्वारा प्रतिदिन अनुभव की जाने वाली घटनाएँ है; शाब्दिक ‘हमारे आर-पार जाती हैं’ आधुनिक हिन्दी में भ्रामक होता।
- source_word: in obprobrium gentibus
  choice: अन्यजातियों के सामने अपमान का पात्र
  rationale: obprobrium के तिरस्कार और अपमान के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; gentibus को बाइबिलीय संदर्भ में ‘अन्यजातियों’ कहा गया।
- source_word: tribubus impiis
  choice: अधर्मी कुलों
  rationale: tribus का मूल अर्थ जनजातीय/वंशीय समूह है; ‘कुल’ यहाँ स्वाभाविक है और impius का धार्मिक-नैतिक भाव ‘अधर्मी’ में सुरक्षित है।
- source_word: lex patrum nostrorum in inritum deducta
  choice: हमारे पूर्वजों की व्यवस्था को निष्फल कर दिया गया है
  rationale: in irritum deducere का अर्थ प्रभावहीन या व्यर्थ कर देना है; ‘निष्फल’ व्यवस्था के मिट जाने के बजाय उसके प्रभाव को विफल किए जाने का भाव रखता है।
theological_decisions:
- issue: परमेश्वर को संबोधन में सर्वनाम
  choice: तूने
  alternative: आपने
  rationale: मूल में द्वितीय पुरुष एकवचन का निकट और प्रत्यक्ष संबोधन है; हिन्दी बाइबिलीय काव्यात्मक-प्रार्थनात्मक शैली में ‘तू’ गरिमापूर्ण रूप से इसे सुरक्षित रखता है।
- issue: इस्राएल की दशा में दैवी कर्तृत्व
  choice: निष्क्रिय क्रियाएँ—‘बना दिया गया’, ‘सौंप दिया गया’, ‘कर दिया गया’
  alternative: परमेश्वर ने इस्राएल को...
  rationale: लातीनी पाठ दैवी कर्ता को स्पष्ट नहीं करता। निष्क्रिय रूप संभावित दैवी कर्तृत्व को खुला रखता है और मूल की धार्मिक कसक तथा अस्पष्टता को नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक और सहज शैली। तीनों शिकायतों में ‘क्यों’ दोहराकर लातीनी propter quod के अधीन समानांतर प्रश्न स्पष्ट किए गए हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि pertranseunt per nos का आशय मुख्य पाठ में स्वाभाविक रूप से व्यक्त है।
