id: 2ES.4.9
reference: 2 Esdras 4:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc autem non interrogaui te nisi de igne et uento et die, per quae transisti, et sine quibus esse non potes, et non respondisti mihi de eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/009.yaml
  text: But now I have asked you only about fire and wind and day[a], through which you have passed and without which you cannot exist, and you have not answered me about them.
translation:
  language: hi
  text: पर अब मैंने तुमसे केवल आग, हवा और दिन के बारे में पूछा है—जिनसे होकर तुम गुज़रे हो और जिनके बिना तुम हो नहीं सकते—फिर भी तुमने मुझे इनके बारे में उत्तर नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nunc autem
  choice: पर अब
  rationale: विरोध और वर्तमान प्रसंग की ओर मोड़, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: non interrogaui te nisi
  choice: मैंने तुमसे केवल ... पूछा है
  rationale: लैटिन के प्रतिबंधात्मक अर्थ ‘केवल’ को स्पष्ट रखते हुए हिन्दी में सहज वाक्य-विन्यास देता है।
- source_word: igne et uento et die
  choice: आग, हवा और दिन
  rationale: तीनों सामान्य संज्ञाओं का सीधा और आधुनिक हिन्दी रूप; ‘दिन’ की स्रोतगत असामान्यता को बदला नहीं गया।
- source_word: per quae transisti
  choice: इनसे होकर तुम गुज़रे हो
  rationale: per का स्थानिक/माध्यमगत खुलापन ‘से होकर’ में बना रहता है और बहुवचन quae का संबंध तीनों पूर्ववर्ती वस्तुओं से स्पष्ट होता है।
- source_word: sine quibus esse non potes
  choice: इनके बिना तुम रह नहीं सकते
  rationale: esse का प्रसंगानुकूल सामान्य अर्थ ‘रहना/अस्तित्व में होना’ है; ‘रह नहीं सकते’ साधारण पाठक के लिए स्वाभाविक है और अस्तित्वगत बल भी बनाए रखता है।
- source_word: non respondisti mihi de eis
  choice: तुमने मुझे इनके विषय में उत्तर नहीं दिया
  rationale: mihi और de eis दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। लंबे लैटिन वाक्य की संरचना को दो डैशों से स्पष्ट किया गया है। स्रोत में भाषण आगे जारी रहता है, इसलिए अंत में उद्धरण-चिह्न नहीं लगाया गया। अंग्रेज़ी परामर्श-पाठ का [a] केवल पुरानी विराम-चिह्न संबंधी पाठ-रूप का संकेत है और हिन्दी प्रकाशन-पाठ में वास्तविक वैकल्पिक अर्थ नहीं देता, इसलिए कोई पाद-टिप्पणी नहीं रखी गई।
