  text: And I said[a], “It cannot, Lord.” And he said to me, “In Hades the storehouses
translation:
  language: hi
  text: और मैंने कहा, “हे प्रभु, वह ऐसा नहीं कर सकती।” तब उसने मुझसे कहा, “अधोलोक में भंडार-गृह[a]…”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “अधोलोक” से आशय मृतकों के लोक से है, विशेष रूप से अंतिम दण्ड के स्थान से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: matrix eius
  choice: वह
  rationale: यह पिछले प्रश्न में उल्लिखित गर्भ/माता की ओर संकेत करता है। उपलब्ध पदांश बीच वाक्य से आरम्भ होता है; स्वाभाविक हिन्दी में स्त्रीलिंग सर्वनाम पिछले संदर्भ को बनाए रखता है।
- source_word: domine
  choice: हे प्रभु
  rationale: प्रत्यक्ष संबोधन को आधुनिक, गरिमापूर्ण हिन्दी में स्पष्ट रखा गया है।
- source_word: in inferno
  choice: अधोलोक में
  rationale: यह मृतकों के लोक का संकेत है; इसे अंतिम दण्ड के स्थान तक सीमित करने वाला शब्द नहीं चुना गया।
- source_word: prumptuaria (promptuaria)
  choice: भंडार-गृह
  rationale: लैटिन शब्द का अर्थ संग्रह या भंडारण के स्थान हैं। बहुवचन को हिन्दी के योजक-चिह्नयुक्त रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: infernum की प्रकृति
  choice: अधोलोक
  alternative: नरक
  rationale: ‘नरक’ आधुनिक हिन्दी में प्रायः अंतिम दण्ड का स्थान समझा जाता है, जबकि यहाँ लैटिन व्यापक मृतक-लोक को व्यक्त कर सकता है।
- issue: खंडित वाक्य का समापन
  choice: दीर्घविराम के साथ अपूर्णता बनाए रखी
  alternative: अनुमान से आगे का कथन पूरा करना
  rationale: प्रदत्त लैटिन स्रोत ‘in inferno prumptuaria’ पर रुकता है। स्रोत में न मिलने वाली सामग्री जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद गरिमापूर्ण और सहज रखा गया है। स्रोत के आरम्भिक संदर्भ और अंतिम अपूर्ण वाक्यांश को बिना अनुमान से पूरा किए प्रस्तुत किया गया है।
