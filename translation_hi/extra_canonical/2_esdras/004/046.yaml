  text: For what has passed I know, but what is to come I do not know.”
translation:
  language: hi
  text: क्योंकि जो बीत चुका है, उसे मैं जानता हूँ; लेकिन जो होने वाला है, उसे मैं नहीं जानता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod pertransiuit
  choice: जो बीत चुका है
  rationale: लातीनी पद का स्वाभाविक और अर्थ-सटीक हिन्दी रूप; यह अतीत में घट चुकी बात को व्यक्त करता है।
- source_word: quid autem futurum sit
  choice: लेकिन जो होने वाला है
  rationale: भविष्य की अनिश्चित घटना या स्थिति को बनाए रखता है; autem के विरोधसूचक बल को ‘लेकिन’ से व्यक्त किया गया है।
- source_word: scio ... [non] scio
  choice: मैं जानता हूँ ... मैं नहीं जानता
  rationale: उपलब्ध पाठ और अंग्रेज़ी परामर्श-पाठ में निहित अतीत के ज्ञान तथा भविष्य के अज्ञान के स्पष्ट विरोध को सरल, समानांतर हिन्दी में रखा गया है।
theological_decisions:
- issue: भविष्य के विषय में वक्ता के ज्ञान की सीमा
  choice: ‘मैं नहीं जानता’ के द्वारा सीमा को स्पष्ट रखा गया है
  alternative: ‘मुझे ज्ञात नहीं’
  rationale: यह कथन किसी व्याख्यात्मक या सिद्धान्तगत विस्तार के बिना वक्ता के अज्ञान को सीधे व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। उद्धरण के समापन-चिह्न को संदर्भानुसार बनाए रखा गया है।
