source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'respondit ad me et dixit: non festinas tu super altissimum, tu enim festinas propter temetipsum, nam excelsus pro multis. Nonne de his interrogauerunt animae iustorum in promptuariis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/034.yaml
  text: And he answered me and said[a], “You do not hasten more than the Most High, for you hasten for your own sake, but the Most High for many. Have not the souls of the righteous in their chambers asked about these things?”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और कहा, “तुम परमप्रधान से अधिक जल्दी नहीं करते[a], क्योंकि तुम अपने ही लिए जल्दी करते हो, पर परमप्रधान की जल्दी बहुतों के लिए है। क्या धर्मियों की आत्माओं ने अपने भंडार-कक्षों में इन बातों के बारे में नहीं पूछा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम परमप्रधान से अधिक जल्दी करते हो? क्योंकि तुम अपने ही लिए जल्दी करते हो।”
    reason: पूर्व प्रचलित प्रश्नवाचक अनुवाद। मुख्य पाठ लैटिन के निषेधात्मक कथन non festinas tu को अनुसरता है; अगले वाक्य में प्रश्न के लिए स्पष्ट Nonne प्रयुक्त है।
lexical_decisions:
- source_word: festinas
  choice: उतावली कर रहे हो
  rationale: यह क्रियात्मक रूप को बनाए रखता है और प्रसंग में एज्रा की अधीर शीघ्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: altissimum / excelsus
  choice: परमप्रधान
  rationale: दोनों लैटिन पद यहाँ एक ही ईश्वरीय उपाधि के रूप में प्रयुक्त हैं; हिन्दी में एकरूपता और गरिमा के लिए ‘परमप्रधान’ चुना गया।
- source_word: pro multis
  choice: बहुतों के लिए
  rationale: लैटिन के संक्षिप्त और कुछ हद तक अपूर्ण वाक्य-विन्यास को स्पष्ट किए बिना उसकी तुलना और व्यापकता बनाए रखता है।
- source_word: animae iustorum
  choice: धर्मियों की आत्माएँ
  rationale: मूल के धार्मिक और मानवशास्त्रीय शब्दों का सीधा, प्रचलित अनुवाद।
- source_word: in promptuariis
  choice: अपने भंडार-कक्षों में
  rationale: promptuaria का मूल अर्थ भंडार या सुरक्षित कक्ष है; यह परलोक में आत्माओं के रखे जाने के स्थान की ठोस उपमा को संरक्षित करता है।
theological_decisions:
- issue: पहले वाक्य का कथन अथवा प्रश्न होना
  choice: 'कथन: ‘तुम परमप्रधान से अधिक उतावली नहीं कर रहे’'
  alternative: 'प्रश्न: ‘क्या तुम परमप्रधान से अधिक उतावली कर रहे हो?’'
  rationale: लैटिन non festinas tu व्याकरणतः निषेधात्मक कथन है, जबकि आगे स्पष्ट प्रश्नसूचक Nonne आता है। फिर भी प्राचीन विरामचिह्न की सीमा और पूर्व प्रचलित पाठ को पादटिप्पणी में रखा गया है।
- issue: परमप्रधान की ‘बहुतों के लिए’ उतावली
  choice: 'अपूर्ण समानांतरता को बनाए रखा: ‘पर परमप्रधान बहुतों के लिए’'
  alternative: 'स्पष्टीकरण जोड़ना: ‘पर परमप्रधान बहुतों के लिए उतावली करते हैं’'
  rationale: मूल में दूसरे खंड की क्रिया लुप्त है। हिन्दी में अर्थ समझ में आता है, इसलिए संभावित धर्मवैचारिक अर्थ को अत्यधिक स्पष्ट किए बिना तनाव सुरक्षित रखा गया।
- issue: धर्मी आत्माओं के स्थान का वर्णन
  choice: ‘भंडार-कक्षों’ की प्रतिमा को बनाए रखा
  alternative: ‘निवास-स्थानों’ या ‘प्रतीक्षा-कक्षों’ के रूप में व्याख्यात्मक अनुवाद
  rationale: मूल की परलोक-संबंधी प्रतिमा को किसी विशिष्ट सम्प्रदायगत ढाँचे में बदले बिना प्रस्तुत करना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उत्तर देकर कहा’ की शाब्दिक पुनरुक्ति के बजाय स्वाभाविक हिन्दी ‘उत्तर दिया’ अपनाया गया। वक्ता एज्रा को संबोधित करता है; हिन्दी में लिंगानुसार ‘उतावली’ प्रयोग किया गया है।
