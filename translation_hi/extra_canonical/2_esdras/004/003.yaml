  text: And I said, “Yes, my lord.” And he answered me and said, “I have been sent to show you three ways, and to set three comparisons before you.
translation:
  language: hi
  text: और मैंने कहा, “हाँ, मेरे प्रभु।” तब उसने मुझे उत्तर दिया और कहा, “मुझे तुम्हें तीन मार्ग दिखाने और तुम्हारे सामने तीन उपमाएँ रखने के लिए भेजा गया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus meus
  choice: मेरे प्रभु
  rationale: लैटिन संबोधन का आदरपूर्ण और स्वाभाविक हिन्दी रूप; दूत के प्रति वक्ता के सम्मान को बनाए रखता है।
- source_word: tres uias
  choice: तीन मार्ग
  rationale: ‘मार्ग’ मूल के ठोस तथा रूपक दोनों अर्थों को खुला रखता है।
- source_word: tres similitudines
  choice: तीन उपमाएँ
  rationale: similitudines के यहाँ प्रस्तुत तुलनात्मक उदाहरणों के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: proponere coram te
  choice: तुम्हारे सामने ... रखने
  rationale: मूल की स्थानिक-प्रस्तुतिकरण संबंधी भाषा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: प्रेषित होने का कर्तृवाच्य और भेजने वाले की अनुल्लिखित पहचान
  choice: मुझे ... भेजा गया है
  alternative: मैं ... भेजा गया हूँ / परमेश्वर ने मुझे भेजा है
  rationale: लैटिन missus sum का कर्मवाच्य बनाए रखा गया है और भेजने वाले की पहचान मूल की तरह अनकही छोड़ी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी; प्रत्यक्ष कथन में मूल की पुनरुक्ति ‘उत्तर दिया और कहा’ को अनावश्यक हिन्दी दोहराव से बचाते हुए ‘उत्तर दिया’ में स्वाभाविक किया गया है।
