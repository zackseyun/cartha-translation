id: 2ES.4.29
reference: 2 Esdras 4:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod seminatum est, et discesserit locus ubi seminatum est malum, non ueniet ager ubi seminatum est bonum. Quoniam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/029.yaml
  text: For if what has been sown is not reaped[a], and the place where the evil has been sown does not pass away, the field where the good has been sown will not come.
translation:
  language: hi
  text: क्योंकि यदि जो बोया गया है उसे काटा न जाए[a], और वह स्थान जहाँ बुराई बोई गई है मिट न जाए, तो वह खेत नहीं आएगा जहाँ भलाई बोई गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए यदि जो बोया गया है उसे काटा न जाए, और वह स्थान जहाँ बुराई बोई गई है मिट न जाए, तो वह खेत नहीं आएगा जहाँ भलाई बोई गई है।”
    reason: पूर्व पाठ में आरंभिक संयोजक को परिणामसूचक ढंग से समझने की संभावना दर्ज थी; मुख्य पाठ लैटिन के कारणसूचक संबंध को ‘क्योंकि’ से व्यक्त करता है।
lexical_decisions:
- source_word: seminatum est
  choice: बोया गया है / बोई गई है
  rationale: लैटिन पूर्ण कर्मवाच्य को तीनों स्थानों पर समान रूप से रखा गया है, ताकि बुराई और भलाई के बोए जाने की जानबूझकर बनाई गई समानांतरता बनी रहे। संज्ञा के लिंग के अनुसार हिंदी रूप बदला है।
- source_word: discesserit
  choice: मिट न जाए
  rationale: यहाँ स्थान के हट जाने या समाप्त हो जाने का भाव है; ‘मिट न जाए’ आधुनिक हिंदी में स्वाभाविक है और वर्तमान व्यवस्था के अंत का संकेत देता है, बिना उसके स्वरूप को अधिक स्पष्ट किए।
- source_word: ager
  choice: खेत
  rationale: बीज बोने और काटने के पूरे कृषि-रूपक को बनाए रखने के लिए सीधा और सामान्य शब्द चुना गया है।
- source_word: ueniet
  choice: आएगा
  rationale: स्रोत की असामान्य परंतु अर्थपूर्ण अभिव्यक्ति ‘खेत आएगा’ को सरल व्याख्या में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: malum / bonum
  choice: बुराई / भलाई
  rationale: अमूर्त नैतिक विरोध को उसी रूप में रखा गया है; इसे ‘बुरे लोग’ या ‘अच्छा युग’ बनाकर व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: बुराई के स्थान के अंत और भलाई के खेत के आगमन का संबंध
  choice: दोनों को क्रमिक और शर्तबद्ध रूप में रखा गया है
  alternative: इसे सीधे ‘यह संसार नष्ट हुए बिना आने वाला युग नहीं आएगा’ कहना
  rationale: ऐसी व्याख्या प्रसंग से संभव हो सकती है, पर स्रोत स्वयं कृषि-रूपक और ‘स्थान/खेत’ की भाषा रखता है; अनुवाद ने उस तनाव और अस्पष्टता को सुरक्षित रखा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वह खेत नहीं आएगा’ हिंदी में कुछ असामान्य है, पर स्रोत के रूपक और भावी आगमन की भाषा को सुरक्षित रखने के लिए इसे जानबूझकर बनाए रखा गया है।
