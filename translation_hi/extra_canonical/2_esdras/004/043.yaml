  text: They hasten to return the things that were entrusted from the beginning. Then what you desire to see will be shown to you.
translation:
  language: hi
  text: वे आरम्भ से उन्हें सौंपी गई बातों को लौटाने की जल्दी करते हैं। तब तुम्हें उन बातों के बारे में दिखाया जाएगा जिन्हें देखने की तुम इच्छा रखते हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinant reddere
  choice: लौटाने के लिए शीघ्रता करते हैं
  rationale: ‘festinant’ की तत्परता और ‘reddere’ के वापस देने के भाव—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ea quae commendata sunt
  choice: जो बातें ... उन्हें सौंपी गई हैं
  rationale: ‘commendata sunt’ यहाँ भरोसे के साथ सौंपे जाने या अभिरक्षा में दिए जाने का भाव रखता है; ‘सौंपी गई’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: ab initio
  choice: आरम्भ से
  rationale: लैटिन के कालगत अर्थ को सीधे रखता है और यह तय नहीं करता कि आशय सृष्टि के आरम्भ से है या किसी अन्य आरम्भ से।
- source_word: concupiscis uidere
  choice: देखने की तुम इच्छा रखते हो
  rationale: देखने की प्रबल चाह को गरिमापूर्ण, सहज हिन्दी में व्यक्त करता है, बिना अनुचित नकारात्मक अर्थ जोड़े।
- source_word: demonstrabitur
  choice: दिखाई जाएँगी
  rationale: भविष्यत् कर्मवाच्य को बनाए रखता है और दिखाने वाले कर्ता को अनिर्दिष्ट छोड़ता है, जैसा स्रोत में है।
theological_decisions:
- issue: ‘वे’ का अनिर्दिष्ट पूर्वपद
  choice: स्रोत की तरह कर्ता को ‘वे’ के रूप में अनिर्दिष्ट रखा गया
  alternative: पिछले पद के आधार पर किसी विशिष्ट समूह या सत्ता का नाम जोड़ना
  rationale: इस पद के लैटिन पाठ में कर्ता केवल क्रिया के बहुवचन रूप से व्यक्त है; नाम जोड़ना व्याख्यात्मक विस्तार होता।
- issue: दिखाने वाले कर्ता की पहचान
  choice: कर्मवाच्य ‘दिखाई जाएँगी’ रखा गया
  alternative: ‘परमेश्वर तुम्हें दिखाएगा’
  rationale: स्रोत ‘demonstrabitur’ में कर्ता का नाम नहीं बताता; धर्मवैचारिक निष्कर्ष जोड़ने से बचने के लिए कर्मवाच्य सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘आरम्भ’, ‘सौंपी गई’, और ‘शीघ्रता करते हैं’ स्रोत की औपचारिकता बनाए रखते हैं; कोई पादटिप्पणी आवश्यक नहीं है।
