  text: 'et oravi et dixi: putas vivo usque in diebus illis, vel quiserit in diebus illis? respondit ad me et dixit: de signis de quibus me'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/051.yaml
  text: And I prayed and said, “Do you think I shall live until those days? Or who will be in those days?”
translation:
  language: hi
  text: और मैंने प्रार्थना की और कहा, “क्या तुम सोचते हो कि मैं उन दिनों तक जीवित रहूँगा? या उन दिनों में कौन होगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et oravi et dixi
  choice: तब मैंने प्रार्थना करके कहा
  rationale: लातीनी समन्वयात्मक शैली को स्वाभाविक हिन्दी में रखते हुए प्रार्थना और कथन, दोनों क्रियाएँ सुरक्षित रखी गई हैं।
- source_word: putas vivo usque in diebus illis
  choice: क्या मैं उन दिनों तक जीवित रहूँगा?
  rationale: पाठ का आशय वक्ता के उन भावी दिनों तक जीवित रहने के प्रश्न से है; हिन्दी में इसे स्पष्ट और स्वाभाविक प्रश्न के रूप में व्यक्त किया गया है।
- source_word: vel quiserit in diebus illis
  choice: या उन दिनों में कौन होगा?
  rationale: स्रोत में संभवतः quis erit का संयुक्त/विकृत रूप है। उपलब्ध पाठ की अनिश्चितता को बिना किसी व्यक्ति या समूह की पहचान जोड़े सामान्य प्रश्न के रूप में रखा गया है।
theological_decisions:
- issue: ‘उन दिनों’ में उपस्थित व्यक्ति या लोगों की पहचान
  choice: कौन होगा
  alternative: कौन जीवित रहेगा
  rationale: लातीनी वाक्यांश केवल अस्तित्व/उपस्थिति पूछता प्रतीत होता है। ‘जीवित रहेगा’ संदर्भानुकूल हो सकता है, पर स्रोत से अधिक स्पष्टता जोड़ देता; इसलिए व्यापक और अनिर्णीत अभिव्यक्ति चुनी गई।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रश्नात्मक शैली। उपलब्ध लातीनी अंश का अगला वाक्य अधूरा है (‘उसने मुझे उत्तर देकर कहा: उन चिन्हों के विषय में जिनके बारे में...’), इसलिए इस पद के दिए हुए अंग्रेज़ी परामर्श-पाठ के अनुरूप केवल पूर्ण प्रश्नों को मुख्य पाठ में लिया गया है।'
