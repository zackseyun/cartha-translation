id: 2ES.4.21
reference: 2 Esdras 4:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: metipso? Quemadmodum enim terra siluae data est et mare fluctibus suis, sic et qui super terram inhabitant quae sunt super terram intellegere solummodo possunt, et qui super caelos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/021.yaml
  text: For just as the earth has been given to the forest[a], and the sea to its waves, so also those who dwell upon the earth can understand only what is on the earth, and he who is above the heavens, what is above the heavens.”
translation:
  language: hi
  text: क्योंकि जैसे पृथ्वी वन को दी गई है और समुद्र अपनी लहरों को दिया गया है, वैसे ही पृथ्वी पर रहनेवाले केवल पृथ्वी की बातें समझ सकते हैं; और जो स्वर्गों के ऊपर है[a], वह स्वर्गों के ऊपर की बातें समझ सकता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो स्वर्गों के ऊपर हैं, वे।” लैटिन संबंधवाचक सर्वनाम एकवचन या बहुवचन दोनों हो सकता है; अन्य प्राचीन संस्करण यहाँ एकवचन का समर्थन करते हैं।
    reason: लैटिन की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखते हुए मुख्य पाठ में प्राचीन संस्करण-साक्ष्य से समर्थित एकवचन दिया गया है।
lexical_decisions:
- source_word: terra
  choice: पृथ्वी
  rationale: ‘Terra’ के स्थान और धरती—दोनों अर्थों को समेटने वाला स्वाभाविक और गरिमापूर्ण शब्द।
- source_word: siluae
  choice: वन
  rationale: लैटिन के एकवचन रूप और मूल रूपक को यथासंभव सीधे बनाए रखता है; इसे बहुवचन ‘जंगलों’ में नहीं बदला गया।
- source_word: quae sunt super terram
  choice: पृथ्वी की बातें
  rationale: शाब्दिक ‘जो पृथ्वी पर हैं’ हिंदी में वस्तुओं तक सीमित लग सकता है; ‘बातें’ ज्ञान के विषयों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: qui super caelos
  choice: जो स्वर्गों के ऊपर है
  rationale: लैटिन ‘qui’ व्याकरणतः एकवचन या बहुवचन हो सकता है, पर प्राचीन सहायक साक्ष्य यहाँ एकवचन का समर्थन करते हैं; ‘स्वर्गों’ से ‘caelos’ का बहुवचन सुरक्षित रहता है।
theological_decisions:
- issue: ‘qui super caelos’ में एकवचन या बहुवचन
  choice: 'एकवचन: ‘जो स्वर्गों के ऊपर है, वह’'
  alternative: 'बहुवचन: ‘जो स्वर्गों के ऊपर हैं, वे’'
  rationale: लैटिन रूप अपने-आप में अस्पष्ट है, किंतु अंतर्निहित यूनानी की ओर संकेत करने वाले सीरियाई और इथियोपिक साक्ष्य एकवचन का समर्थन करते हैं। इससे पृथ्वी पर रहने वाले मनुष्यों और स्वर्गों के ऊपर स्थित एक सत्ता के बीच विरोध बना रहता है; पाठ में उस सत्ता का नाम जोड़कर व्याख्या नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। समानांतर वाक्य-रचना और पृथ्वी/स्वर्गों का विरोध सुरक्षित रखा गया है। ‘रहनेवाले’ संयुक्त रूप सामान्य हिंदी बाइबिलीय गद्य के अनुरूप है; अनावश्यक रूप से ईश्वर का नाम जोड़कर निहित संदर्भ को स्पष्ट नहीं किया गया।
