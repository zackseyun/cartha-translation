  text: And he answered me and said, “If you are, you will see; and if you live, you will often marvel,”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और कहा, “यदि तुम होगे, तो देखोगे; और यदि तुम जीवित रहोगे, तो बार-बार चकित होगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: si fueris
  choice: यदि तुम रहोगे
  rationale: लातीनी क्रिया ‘esse’ के भविष्यपरक रूप को अस्तित्वसूचक ‘रहोगे’ से व्यक्त किया गया है, ताकि इसे अगले अलग वाक्यांश ‘यदि तुम जीवित रहोगे’ में न मिला दिया जाए।
- source_word: si uixeris
  choice: यदि तुम जीवित रहोगे
  rationale: ‘uiuere’ का अर्थ स्पष्ट रूप से जीवित रहना है; इससे पहले वाक्यांश के ‘रहोगे’ और इस वाक्यांश के बीच मूल भेद बना रहता है।
- source_word: frequenter
  choice: प्रायः
  rationale: यह ‘अक्सर/बार-बार’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; इसमें ‘काफी लंबे समय तक’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: miraberis
  choice: अचंभित होगे
  rationale: भविष्यकालीन विस्मय को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘si fueris’ और ‘si uixeris’ के बीच भेद
  choice: पहले को ‘यदि तुम रहोगे’ और दूसरे को ‘यदि तुम जीवित रहोगे’ कहा गया
  alternative: दोनों को ‘यदि तुम जीवित रहोगे’ कहना
  rationale: मूल पाठ दो अलग क्रियाओं—‘esse’ और ‘uiuere’—का प्रयोग करता है। उनका भेद बनाए रखने से संभावित अस्तित्वगत या कालगत अस्पष्टता बिना किसी धर्मवैज्ञानिक निष्कर्ष के सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। मूल का दोहराव ‘उत्तर दिया और कहा’ तथा दोनों शर्तवाचक उपवाक्यों का समानांतर विन्यास जानबूझकर सुरक्षित रखा गया है।
