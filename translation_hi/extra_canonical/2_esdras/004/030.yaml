source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: granum seminis mali seminatum est in corde Adam ab initio, et quantum impietatis generauit usque nunc et generabit usque cum ueniat area. Aestima autem apud te granum mali
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/030.yaml
  text: For a grain of evil seed was sown in Adam’s heart from the beginning, and how much ungodliness it has produced until now, and will still produce until the threshing floor comes! But consider within yourself the grain of evil
translation:
  language: hi
  text: क्योंकि आरम्भ से ही आदम के हृदय में बुरे बीज का एक दाना बोया गया था, और उस दाने ने अब तक कितना अधर्म उत्पन्न किया है, और खलिहान के आने तक और कितना अधर्म उत्पन्न करेगा![a] पर तुम अपने भीतर बुराई के उस दाने पर विचार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जब तक खलिहान न आ जाए”; यह कटनी और सम्भवतः न्याय का रूपक है।
    reason: मूल कृषि-रूपक आधुनिक पाठक को अस्पष्ट लग सकता है, इसलिए उसके सम्भावित संकेत को बिना निश्चित किए स्पष्ट किया गया है।
lexical_decisions:
- source_word: granum seminis mali
  choice: बुरे बीज का एक दाना
  rationale: मूल रूपक और ‘एक दाने’ की सूक्ष्मता को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: impietatis
  choice: अधर्म
  rationale: यह शब्द ईश्वर-विरोधी दुष्टता और नैतिक बुराई दोनों को समेट सकता है; ‘अधर्म’ इसी व्यापकता को संक्षेप में बनाए रखता है।
- source_word: area
  choice: खलिहान
  rationale: लैटिन के कृषि-संबंधी न्याय-रूपक को व्याख्यात्मक शब्द से बदलने के बजाय प्रत्यक्ष रूप से सुरक्षित रखा गया है।
- source_word: Aestima autem apud te
  choice: पर तुम अपने भीतर…पर विचार करो
  rationale: Aestima का अर्थ ‘आकलन करो/विचार करो’ और apud te का आत्मपरीक्षण-संबंधी भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: आदम के हृदय में बोए गए बुरे बीज का स्वरूप
  choice: इसे मूल रूपक के रूप में ही रखा गया है
  alternative: इसे ‘मूल पाप’ जैसे किसी व्यवस्थित धर्मवैज्ञानिक पद से स्पष्ट करना
  rationale: पाठ स्वयं किसी विशिष्ट सिद्धान्तगत नाम का प्रयोग नहीं करता; इसलिए उसकी वास्तविक अस्पष्टता और तनाव को बनाए रखा गया है।
- issue: ‘खलिहान’ का आशय
  choice: मुख्य पाठ में कृषि-रूपक को सुरक्षित रखा गया है
  alternative: इसे सीधे ‘न्याय का दिन’ अनूदित करना
  rationale: न्याय या कटनी का संकेत सम्भव है, पर लैटिन area स्पष्ट रूप से ‘खलिहान’ कहता है; अर्थ को चुपचाप निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘आदम’, ‘अधर्म’ और ‘खलिहान’ जैसे परिचित शब्दों से मूल की धार्मिक तथा कृषि-संबंधी छवियाँ सुरक्षित रखी गई हैं।
