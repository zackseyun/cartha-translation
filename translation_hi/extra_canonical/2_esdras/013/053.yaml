  yaml_path: translation/extra_canonical/2_esdras/013/053.yaml
  text: This is the interpretation of the dream that you saw[53], and why you alone have been enlightened concerning these things.
translation:
  language: hi
  text: यह उस स्वप्न की व्याख्या है जो तुमने देखा था, और इसी कारण इन बातों के विषय में केवल तुम्हें ही प्रकाश दिया गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretatio
  choice: व्याख्या
  rationale: यह शब्द स्वप्न के अर्थ को समझाने वाली व्याख्या के लिए स्वाभाविक और स्रोत के निकट है।
- source_word: inluminatus es
  choice: तुम्हें प्रकाश दिया गया है
  rationale: लातीनी कर्मवाच्य को बनाए रखते हुए यह हिन्दी में स्वाभाविक है और प्रकाश पाने के रूपक को सुरक्षित रखता है।
- source_word: haec
  choice: इन बातों के विषय में
  rationale: वाक्य के अंत में आए बहुवचन संकेतवाचक को पूर्ववर्ती प्रकट की गई बातों के संदर्भ में स्पष्ट और स्वाभाविक हिन्दी दी गई है।
- source_word: solus
  choice: केवल तुम्हें ही
  rationale: एज्रा के अकेले इस प्रकाश को पाने पर दिए गए बल को हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: प्रकाश दिए जाने का कर्ता
  choice: कर्मवाच्य रखा गया—“तुम्हें प्रकाश दिया गया है”
  alternative: “परमेश्वर ने तुम्हें प्रकाश दिया है”
  rationale: स्रोत में कर्ता स्पष्ट नहीं है; परमेश्वर को सीधे कर्ता बनाना सम्भावित अर्थ तो है, पर वह स्रोत से अधिक स्पष्टता जोड़ देता।
- issue: propter quod का संबंध
  choice: “और इसी कारण”
  alternative: “और यही कारण है कि”
  rationale: दोनों सम्भव हैं; चुना गया रूप लातीनी कारणसूचक संबंध को संक्षेप में रखता है और पिछले कथन से उसका संबंध बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। अंग्रेज़ी पाठ में लगा [53] चिह्न और उसकी टिप्पणी इस पद के लातीनी पाठ से मेल नहीं खाते, इसलिए स्रोतविहीन पादटिप्पणी नहीं अपनाई गई।
