  text: And after this I saw that man coming down from the mountain and calling to himself another peaceful multitude[a].
translation:
  language: hi
  text: और इसके बाद मैंने उस मनुष्य को पहाड़ से उतरते और एक और शांतिपूर्ण भीड़ को अपने पास बुलाते देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ipsum hominem
  choice: उस मनुष्य को
  rationale: यहाँ ipsum पहले से उल्लिखित मनुष्य की ओर संकेत को पुष्ट करता है; हिंदी में “उस मनुष्य” इसे स्वाभाविक रूप से व्यक्त करता है, बिना अनावश्यक रूप से “उसी” जोड़कर अर्थ को अधिक बल देने के।
- source_word: descendentem de monte
  choice: पहाड़ से उतरते
  rationale: लातीनी कृदंत का सीधा और स्वाभाविक हिंदी रूप।
- source_word: advocantem ad se
  choice: अपने पास बुलाते
  rationale: ad se के आत्मवाचक संबंध और advocantem के बुलाने के भाव, दोनों को स्पष्ट रखता है।
- source_word: multitudinem aliam pacificam
  choice: एक दूसरी शांतिप्रिय भीड़ को
  rationale: aliam को “दूसरी” और pacificam को “शांतिप्रिय” के रूप में रखा गया है; इससे समूह की शांतिपूर्ण प्रवृत्ति व्यक्त होती है और वाक्य सहज रहता है।
