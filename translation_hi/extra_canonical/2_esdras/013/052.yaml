id: 2ES.13.52
reference: 2 Esdras 13:52
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut non potest hoc vel scrutinare vel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram videre Filium meum vel eos qui cum eo sunt nisi in tempore diei.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/052.yaml
  text: And he said to me, “Just as no one can search out or know what is in the depths of the sea, so no one on earth can see my Son, or those who are with him, except at the time of that day.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “जिस प्रकार कोई भी यह खोज या जान नहीं सकता कि समुद्र की गहराई में क्या है, उसी प्रकार पृथ्वी पर कोई भी मेरे पुत्र को या जो उसके साथ हैं उन्हें उस दिन के समय के सिवा नहीं देख सकेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinare vel scire
  choice: खोज या जान नहीं सकता
  rationale: 'दोनों लैटिन क्रियाओं का भेद बनाए रखा गया है: scrutinare का अर्थ खोजबीन करके पता लगाना और scire का अर्थ जानना है।'
- source_word: in profundo maris
  choice: समुद्र की गहराई में
  rationale: लैटिन के स्थानवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Filium meum
  choice: मेरे पुत्र
  rationale: मूल पाठ में पदवी-सदृश बल और अंग्रेज़ी परामर्श-पाठ की परंपरा को ध्यान में रखते हुए ‘पुत्र’ रखा गया है।
- source_word: eos qui cum eo sunt
  choice: उसके साथ रहनेवालों
  rationale: साथ होने की अवस्था को बिना यह निर्धारित किए व्यक्त करता है कि वे अनुयायी, स्वर्गदूत या कोई अन्य समूह हैं।
- source_word: nisi in tempore diei
  choice: उस दिन का समय आने से पहले नहीं
  rationale: शाब्दिक रूप ‘उस दिन के समय को छोड़कर’ हिन्दी में असहज है; यह रूप उसी समय-सीमा को स्वाभाविक ढंग से व्यक्त करता है और diei को ‘उस दिन’ के रूप में रखता है।
theological_decisions:
- issue: ‘मेरे पुत्र’ और उसके साथ रहनेवालों की पहचान
  choice: समूह की पहचान स्पष्ट किए बिना मूल कथन रखा गया
  alternative: ‘उसके अनुयायियों’ या ‘उसके संतों’ जैसे विशिष्ट पद
  rationale: लैटिन eos qui cum eo sunt केवल ‘जो उसके साथ हैं’ कहता है; अधिक विशिष्ट पहचान जोड़ना व्याख्यात्मक और संप्रदायगत हो सकता है।
- issue: अंतिम समय-सूचक वाक्यांश
  choice: ‘उस दिन का समय आने से पहले नहीं’
  alternative: ‘केवल उस दिन के समय’
  rationale: दोनों में अपवादात्मक समय का अर्थ है; चुना हुआ रूप आधुनिक हिन्दी में अधिक सहज है और ‘उस दिन’ की युगांत-संबंधी संभावित अनुगूँज को बिना विस्तार दिए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की उपमा और समांतर रचना सुरक्षित है; किसी अनिर्दिष्ट समूह की पहचान नहीं जोड़ी गई।
