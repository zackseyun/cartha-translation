  text: And bewilderment of mind will come upon those who inhabit the earth. And they will plan to make war, one against another, city against city, place against place,
translation:
  language: hi
  text: और पृथ्वी पर रहने वालों पर मन में घोर भ्रम छा जाएगा। वे एक-दूसरे के विरुद्ध युद्ध करने की योजना बनाएँगे—नगर नगर के विरुद्ध और स्थान स्थान के विरुद्ध।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excessus mentis
  choice: मानसिक व्याकुलता
  rationale: लातीनी पद मन के सामान्य संतुलन से हट जाने, भ्रम या विक्षोभ की दशा बताता है। ‘मानसिक व्याकुलता’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में रखता है, बिना उसे किसी विशिष्ट चिकित्सकीय अवस्था तक सीमित किए।
- source_word: ueniet ... super eos
  choice: उन पर ... छा जाएगी
  rationale: आने और किसी पर पड़ने के भाव को हिन्दी में स्वाभाविक तथा प्रभावशाली ढंग से व्यक्त करता है।
- source_word: cogitabunt bellare
  choice: युद्ध करने की सोचेंगे
  rationale: cogitabunt के विचार या योजना बनाने के भाव को बनाए रखता है; युद्ध को पहले से घटित बताने के बजाय अभिप्राय की अवस्था व्यक्त करता है।
- source_word: in alios alii
  choice: एक-दूसरे के विरुद्ध
  rationale: पारस्परिक विरोध और संघर्ष की दिशा को संक्षेप और सहज हिन्दी में व्यक्त करता है।
- source_word: ciuitates ciuitatem et locus locum
  choice: नगर नगर के विरुद्ध और स्थान स्थान के विरुद्ध
  rationale: स्रोत की समानांतर, सूत्रात्मक रचना को बनाए रखते हुए निहित ‘विरुद्ध’ को स्पष्ट करता है।
