    text: वाक्य अगले पद में पूरा होता है। लैटिन स्रोत में यह पद ‘de’ (‘से’) पर समाप्त होता है और उसका पूरक 13:40 में आता है; हिन्दी में ‘वहाँ से’ उस अधूरे संबंध को संकेतित करता है।
