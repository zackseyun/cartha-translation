lexical_decisions:
- source_word: aliam multitudinem pacificam
  choice: एक दूसरी शांतिप्रिय भीड़
  rationale: ‘aliam’ को ‘दूसरी’, ‘multitudinem’ को सहज सामूहिक संज्ञा ‘भीड़’, और ‘pacificam’ को उसके शांत/अहिंसक भाव में ‘शांतिप्रिय’ रखा गया है।
- source_word: colligentem ad se
  choice: अपने पास इकट्ठा करते
  rationale: यह लैटिन कृदंत-रचना और ‘ad se’ की दिशा को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: decem tribus
  choice: दस गोत्र
  rationale: इस्राएली जनसमूहों के बाइबिलीय संदर्भ में ‘tribus’ के लिए प्रचलित और सटीक शब्द ‘गोत्र’ है।
- source_word: captiuae factae sunt
  choice: बंदी बनाकर ले जाया गया था
  rationale: केवल ‘बंदी बनाए गए’ की अपेक्षा यह निर्वासन-संबंधी आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अगले पद से जुड़ने वाली अधूरी रचना बनी रहती है।
- source_word: de
  choice: वहाँ से
  rationale: लैटिन पदांश ‘de’ पर ही समाप्त होता है और उसका पूरक अगले पद में आता है; हिन्दी में ‘वहाँ से’ कहकर उसी अपूर्ण निरंतरता को सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘शांतिप्रिय भीड़’ की पहचान
  choice: इसे सीधे ‘दस गोत्र’ से पहचाना गया है
  alternative: पहले वाक्य को स्वतंत्र कथन मानना
  rationale: ‘Haec sunt decem tribus’ स्पष्ट रूप से पूर्वोक्त भीड़ की पहचान दस गोत्रों के रूप में करता है; इससे आगे कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। ‘तूने’ कथात्मक संबोधन को बनाए रखता है। डैश पहचानसूचक अगले खंड को सहज रूप से जोड़ता है; अंतिम विराम जानबूझकर नहीं लगाया गया, क्योंकि स्रोत-वाक्य अगले पद में जारी है।
