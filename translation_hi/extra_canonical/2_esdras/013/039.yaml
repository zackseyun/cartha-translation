  text: और तूने उसे एक और शांतिपूर्ण जनसमूह को अपने पास इकट्ठा करते हुए देखा—ये वे दस गोत्र हैं, जिन्हें वहाँ से बंदी बनाकर ले जाया गया था[a]
  philosophy: optimal-equivalence
  footnotes:
