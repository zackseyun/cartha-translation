source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'in sensu meo, uae qui derelicti fuerint in diebus illis, et multo plus uuae his qui non sunt derelicti : Qui enim non sunt derelicti, tristos erunt, Intelligentes quae sunt reposita in nouissimis diebus et non occurrentes eis ; sed et qui derelicti sunt Propter hoc uuae ! uidebunt enim pericula magna et necessitates multas, sicut ostendunt somnia haec. Adtamen facilius est periclitantem uenire in haec quam pertransire sicut nubem a saeculo et non uidere quae contingent in nouissimo. Et respondit ad me et dixit : et uisionis interpretationem dicam tibi, sed et de quibus locutus es adaperiam tibi. Quoniam de his dixisti qui derelicti sunt, haec est interpretatio. Qui adferet periculum in illo tempore, ipse custodibit qui in periculo inciderint, qui habent operas et fidem ad fortissimum. Scito ergo quoniam magis beatificati sunt qui derelicti super eos qui mortui sunt. Interpretationes uisionis haec : quia uidisti uirum ascendentem de corde maris, Ipse est quem conseruat altissimus
    multis temporibus, qui per semetipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt. Et quoniam uidisti de ore eius exire spiritum et ignem et tempestatem, Et quoniam non tenebat frameam neque uas bellicosum, corrumpit enim impetum eius multitudinis quae uenerat ad'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/016.yaml
  text: For in my understanding, woe to those who are left in those days, and much more woe to those who are not left!
translation:
  language: hi
  text: क्योंकि मेरी समझ में, हाय उन पर जो उन दिनों में बचे रहेंगे, और उनसे कहीं अधिक हाय उन पर जो नहीं बचेंगे!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in sensu meo
  choice: मेरी समझ में
  rationale: लातीनी वाक्यांश का स्वाभाविक और सीधा हिन्दी रूप; इसे अनावश्यक रूप से ‘मेरे विचार से’ कहकर व्याख्यायित नहीं किया गया।
- source_word: uae
  choice: हाय ... पर
  rationale: विलाप और आसन्न विपत्ति—दोनों का भाव रखने वाला मानक बाइबिलीय हिन्दी प्रयोग।
- source_word: derelicti fuerint
  choice: बचे रहेंगे
  rationale: इस प्रसंग में derelinquere का आशय संकट के दिनों के बाद जीवित अथवा शेष रह जाने वालों से है; ‘छोड़ दिए जाएँगे’ हिन्दी में भ्रामक हो सकता है।
- source_word: multo plus uuae
  choice: कहीं अधिक हाय
  rationale: तुलनात्मक तीव्रता को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: qui non sunt derelicti
  choice: जो नहीं बचेंगे
  rationale: पहले खंड के समान शब्दावली रखकर मूल का जानबूझकर बनाया गया विरोध सुरक्षित किया गया है।
theological_decisions:
- issue: ‘बचे रहने’ का सटीक आशय
  choice: वाक्य में यह खुला रखा गया कि लोग किस अर्थ में या किसके द्वारा बचेंगे।
  alternative: ‘जीवित बचेंगे’ अथवा ‘परमेश्वर द्वारा बचाए जाएँगे’
  rationale: लातीनी derelicti संदर्भ में शेष रहने का संकेत देता है, पर इस एक पद में जीवित रहने या दैवी संरक्षण को स्पष्ट रूप से निर्धारित नहीं करता; अतः अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध अनुवाद। ‘हाय’ ने शास्त्रीय चेतावनी-विलाप का स्वर बनाए रखा है, जबकि वाक्यरचना को अनावश्यक रूप से पुरातन नहीं बनाया गया।
