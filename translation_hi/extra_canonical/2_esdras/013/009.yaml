source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pugnare. Et ecce ut uidit impetum multitudinis uenientis, non leuauit manum suam, neque frameam tenebat, neque
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/009.yaml
  text: And behold, when he saw the assault of the coming multitude, he did not lift his hand, nor did he hold a spear, nor any weapon of war;
translation:
  language: hi
  text: और देखो, जब उसने आती हुई भीड़ का आक्रमण देखा, तो उसने न अपना हाथ उठाया, न भाला पकड़ा, और न युद्ध का कोई हथियार पकड़ा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराया गया लैटिन अंश अंतिम neque (“और न”) पर टूट जाता है। “युद्ध का कोई हथियार” अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूर्णता के अनुसार दिया गया है; इस अंश से उसके ठीक लैटिन शब्दों की स्वतंत्र पुष्टि नहीं होती।
    reason: प्रस्तुत मूल-पाठ के अधूरे अंत और अनुवाद में दी गई पद-पूर्णता के बारे में पाठक को पारदर्शी सूचना देना।
lexical_decisions:
- source_word: Et ecce
  choice: और देखो
  rationale: लातीनी कथात्मक संकेत और विस्मयकारी दृश्य-परिवर्तन—दोनों को सरल, प्रतिष्ठित हिन्दी में बनाए रखता है।
- source_word: impetum
  choice: आक्रमण
  rationale: यहाँ शब्द आने वाली भीड़ के आक्रामक धावे को व्यक्त करता है; केवल ‘आना’ इसके बल को पर्याप्त रूप से नहीं दर्शाता।
- source_word: multitudinis uenientis
  choice: आती हुई भीड़
  rationale: विशेषणात्मक कृदन्त uenientis को स्वाभाविक हिन्दी में रखते हुए उस भीड़ के निकट आने का भाव सुरक्षित किया गया है।
- source_word: non leuauit manum suam
  choice: उसने न अपना हाथ उठाया
  rationale: मूल की नकारात्मक समानांतर रचना को निकटता से बनाए रखता है और हिन्दी में सहज है।
- source_word: frameam
  choice: भाला
  rationale: framea का अर्थ प्रसंगानुसार भाला अथवा तलवार हो सकता है; यहाँ अंग्रेज़ी परामर्श-पाठ के ‘spear’ तथा युद्धास्त्र-सूची के संदर्भ के अनुसार ‘भाला’ चुना गया है।
theological_decisions:
- issue: पुरुष का बिना सामान्य हथियार उठाए सामना करना
  choice: मूल के नकारात्मक कथनों को बिना व्याख्यात्मक विस्तार के रखा गया है
  alternative: इसे चमत्कारी या मसीहाई सामर्थ्य की स्पष्ट व्याख्या के साथ अनूदित करना
  rationale: पद केवल यह बताता है कि उसने हाथ या हथियार नहीं उठाया; इसके धार्मिक अर्थ को अनुवाद में निर्धारित करना मूल से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक और गरिमापूर्ण शैली। ‘न … न … और न …’ से मूल की समानांतर नकारात्मक संरचना सुरक्षित रखी गई है।
