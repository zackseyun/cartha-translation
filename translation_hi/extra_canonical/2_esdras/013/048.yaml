  text: derelicti sunt de populo tuo, qui inueniuntur intra terminum meum Sanctum. erit ergo, quando incipiet perdere multitu-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/048.yaml
  text: But those of your people who are left[a], who are found within my holy border, shall be saved.
translation:
  language: hi
  text: परन्तु तुम्हारे लोगों में से जो शेष रह गए हैं और मेरी पवित्र सीमा के भीतर पाए जाते हैं, वे बचाए जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी पाठ यहाँ अधूरा है और उसमें इस वाक्य की मुख्य क्रिया नहीं मिलती। कुछ प्राचीन अनुवादों में “वे बचाए जाएँगे,” और सीरियाई में “वे जीवित रहेंगे” है।
    reason: पाठगत कमी और प्राचीन अनुवाद-साक्ष्यों में पाए जाने वाले भेद को स्पष्ट करना।
lexical_decisions:
- source_word: derelicti sunt
  choice: जो शेष रह गए हैं
  rationale: लातीनी पद का अर्थ यहाँ उन लोगों से है जो बाकी बचे हैं; यह हिन्दी में स्वाभाविक है और संदर्भ के भाव को बनाए रखता है।
- source_word: intra terminum meum Sanctum
  choice: मेरी पवित्र सीमा के भीतर
  rationale: terminus का मूल अर्थ सीमा या सीमाक्षेत्र है। ‘पवित्र सीमा’ मूल की स्थान-संबंधी भाषा और उसके धार्मिक स्वर, दोनों को सुरक्षित रखती है।
- source_word: '[verb absent in extant Latin]'
  choice: वे बचाए जाएँगे
  rationale: उपलब्ध लातीनी पाठ में मुख्य विधेय लुप्त है, जिससे वाक्य व्याकरण की दृष्टि से अधूरा है। प्राचीन अनुवाद-परंपरा के प्रमाण के आधार पर वाक्य को पूरा किया गया है।
theological_decisions:
- issue: लुप्त मुख्य क्रिया का पुनर्निर्माण
  choice: वे बचाए जाएँगे
  alternative: वे जीवित रहेंगे; अथवा वाक्य को अधूरा छोड़ देना
  rationale: सीरियाई पाठ ‘जीवित रहेंगे’ का समर्थन करता है, जबकि इथियोपी और अरबी साक्ष्य ‘बचाए जाएँगे’ का। लातीनी प्रतिलिपि की स्पष्ट क्षति को ज्यों का त्यों छोड़ने के बजाय बहुसाक्ष्य के आधार पर अर्थ पुनर्स्थापित किया गया है और अनिश्चितता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘शेष रह गए’ तथा ‘पवित्र सीमा के भीतर’ मूल लातीनी संरचना के निकट रहते हुए स्वाभाविक हिन्दी देते हैं। आरम्भ का ‘परन्तु’ प्रसंगगत विरोध को बनाए रखता है, यद्यपि उपलब्ध उद्धृत लातीनी अंश में उसका स्पष्ट समतुल्य नहीं है।
