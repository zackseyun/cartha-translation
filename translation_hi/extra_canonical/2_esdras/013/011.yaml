reference: 2 Esdras 13:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multitudo tempestatis. Et concidit super multitudinis impetum quod paratum erat pugnare, et succendit omnes, ut subito nihil uideretur de innumerabili multitudine nisi solummodo puluis cineris et fumi odor. et uidi et extiti. Et post haec uidi ipsum hominem descendentem de monte et aduocantem ad se multitudinem aliam pacificam. Et accedebant ad eum uultus hominum multorum, quorundam gaudentium, quorundam tristantium, aliqui uero alligati, aliqui adducentes ex eis qui offerebantur. et ego a multitudine pauoris expergefactus sum et deprecatus sum altissimum et dixi : Tu ab initio demonstrasti seruo tuo mirabilia haec, et dignum me habuisti ut susciperes deprecationem meam; Et nunc demonstra mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/011.yaml
  text: And all these were mixed together—the wave of fire, the breath of flame, and the great storm—and it fell upon the assault of the multitude that had prepared to fight, and burned them all up, so that suddenly nothing could be seen of the innumerable multitude except only the dust of ashes and the smell of smoke. And I saw it and was astonished.
translation:
  language: hi
  text: और ये सब आपस में मिल गए—आग की लहर, ज्वाला का श्वास और प्रचंड आँधी[a]—और वह उस भीड़ के आक्रमण पर आ पड़ा, जो लड़ने के लिए तैयार थी, और उसने उन सबको जला डाला। तब अचानक उस अनगिनत भीड़ का कुछ भी दिखाई नहीं दिया, सिवाय राख की धूल और धुएँ की गंध के। मैंने यह देखा और विस्मित रह गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लैटिन अंश यहाँ वाक्य के बीच में, केवल “प्रचंड आँधी” के समतुल्य शब्दों से आरम्भ होता है; आरम्भिक सूची तत्काल पूर्ववर्ती संदर्भ और संरक्षित पाठ-परंपरा के आधार पर दी गई है।
    reason: प्रदत्त मूल-पाठ इस स्थान पर खंडित आरम्भ रखता है, जबकि अनुवाद में वाक्य की पूरी समांतर सूची प्रस्तुत करनी आवश्यक है।
lexical_decisions:
- source_word: multitudo tempestatis
  choice: प्रचंड आँधी
  rationale: शाब्दिक रूप से यह ‘तूफ़ान की बहुतायत/विशालता’ है; आधुनिक हिन्दी में ‘प्रचंड आँधी’ उसी तीव्रता और विशाल प्रभाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: multitudinis impetum
  choice: भीड़ का धावा
  rationale: impetus यहाँ युद्ध के लिए तैयार असंख्य जनसमूह के आक्रामक वेग या धावे को दर्शाता है; ‘धावा’ सैन्य प्रसंग को स्पष्ट रखते हुए संक्षिप्त है।
- source_word: succendit omnes
  choice: उन सबको जला डाला
  rationale: क्रिया पूर्ण विनाशकारी दहन को व्यक्त करती है; ‘जला डाला’ उसका बल बनाए रखता है।
- source_word: puluis cineris
  choice: राख की धूल
  rationale: लातीनी पद के दोनों बिंबों—धूल और राख—को बिना एक में मिला दिए सुरक्षित रखा गया है।
- source_word: et uidi et extiti
  choice: मैंने यह देखा और स्तब्ध रह गया
  rationale: extiti का यहाँ आशय दृश्य देखकर ठिठक जाने या विस्मित रह जाने से है; ‘स्तब्ध रह गया’ आधुनिक हिन्दी में उस प्रतिक्रिया को स्वाभाविक रूप देता है।
theological_decisions:
- issue: विनाशकारी शक्ति का कर्ता
  choice: ‘वह सब ... टूट पड़ा’ द्वारा आग, ज्वाला और आँधी के संयुक्त प्रहार को कर्ता रखा गया है
  alternative: उस मनुष्य को प्रत्यक्ष कर्ता बताना
  rationale: उपलब्ध लातीनी वाक्य में निकटतम कर्ता संयुक्त अग्नि-श्वास-आँधी का दृश्य है; अनावश्यक रूप से उस मनुष्य को प्रत्यक्ष कर्ता बनाना पाठ की अस्पष्टता को सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘लहर’, ‘साँस’, ‘धावा’ और ‘स्तब्ध’ जैसे शब्द दर्शन की सजीवता बनाए रखते हैं, पर शैली को अत्यधिक संस्कृतनिष्ठ नहीं बनाते।
