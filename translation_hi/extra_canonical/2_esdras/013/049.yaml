id: 2ES.13.49
reference: 2 Esdras 13:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dinem earum quae collectae sunt gentes, proteget qui superauerit populum, Et tunc ostendet eis multa plurima portenta. Et dixi ego : dominator domine, hoc mihi ostende, propter quod uidi uirum ascendentem de corde maris. et dixit mihi : Sicut non potest hoc uel scrutinare uel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram uidere filium meum uel eos qui cum eo sunt nisi in tempore diei. Haec est interpretatio somnii quod uidisti, et propter hoc inluminatus es haec solus. Dereliquisti enim tua, et circa mea uacasti, et legem meam exquisisti ; Vitam enim tuam disposuisti in sapientiam, et sensum tuum uocasti matrem. Et propter hoc ostendi tibi haec, merces enim apud altissimum. erit enim post alios tres dies ad te alia loquar, et exponam tibi grauia et mirabilia. Et profectus sum et transii in campum, multum glorificans et laudans altissimum de mirabilibus quae per tempus faciebat, Et quoniam gubernat tempora et quae sunt in temporibus inlata : et sedi
    ibi tribus diebus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/049.yaml
  text: Then it will be, when he begins to destroy the gathered multitude of the nations, that he will protect the people who survive.
translation:
  language: hi
  text: तब, जब वह इकट्ठी हुई जातियों की भीड़ का नाश करना आरम्भ करेगा, वह बचे हुए लोगों की रक्षा करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exterminare
  choice: नाश करना
  rationale: यहाँ क्रिया एकत्र शत्रु-समूह के विनाश को व्यक्त करती है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: multitudinem ... gentes
  choice: जातियों की भीड़
  rationale: लातीनी वाक्य में अनेक जातियों से बनी एकत्र विशाल जनराशि का बोध है; ‘भीड़’ सामूहिक एकवचन को बनाए रखता है।
- source_word: collectae sunt
  choice: इकट्ठी हुई
  rationale: मूल में जातियों के एक स्थान पर जमा किए जाने या जमा होने का भाव है; हिन्दी रूप कर्मवाच्य और आत्मवाच्य के बीच मूल की सीमित अस्पष्टता को बनाए रखता है।
- source_word: proteget
  choice: रक्षा करेगा
  rationale: यह भविष्यकालीन संरक्षण का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: qui superauerit populum
  choice: बचे हुए लोगों
  rationale: संदर्भ और प्राचीन अनुवाद-परंपरा के अनुसार आशय विनाश के बाद जीवित बचे लोगों से है; हिन्दी में इसे स्वाभाविक सामूहिक रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘बचे हुए लोगों’ की पहचान
  choice: पहचान को सामान्य और अनिर्दिष्ट रखा गया है
  alternative: उन्हें किसी विशिष्ट धार्मिक समुदाय या ‘शेष लोगों’ के पारिभाषिक समूह के रूप में पहचानना
  rationale: इस पद में समुदाय की धार्मिक पहचान स्पष्ट नहीं की गई; अतः अनुवाद मूल से आगे जाकर कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: विनाश और संरक्षण का कर्ता
  choice: दोनों क्रियाओं के लिए वही पुरुषवाचक कर्ता रखा गया है
  alternative: संरक्षण को परमप्रधान का अलग कार्य मानना
  rationale: लातीनी क्रिया-क्रम और निकटवर्ती संदर्भ उस पुरुष को दोनों क्रियाओं का कर्ता मानने का समर्थन करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यकालीन कथन। ‘तब, जब…’ से मूल की काल-संरचना रखी गई है और अनावश्यक धार्मिक पारिभाषिकता से बचा गया है।
