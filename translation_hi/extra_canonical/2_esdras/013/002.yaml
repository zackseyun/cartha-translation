  text: और देखो, समुद्र से एक हवा उठ रही थी, ताकि वह उसकी सारी लहरों को उथल-पुथल कर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: दर्शन-वर्णन में अचानक दिखाई देने वाली बात की ओर ध्यान खींचने वाला स्वाभाविक और सीधा रूप।
- source_word: de mari
  choice: समुद्र से
  rationale: लैटिन में स्रोत अथवा दिशा को व्यक्त करने वाले पदबंध का सीधा अनुवाद।
- source_word: ventus exsurgebat
  choice: एक हवा उठ रही थी
  rationale: ventus को तटस्थ रूप से ‘हवा’ रखा गया है; exsurgebat के अपूर्ण भूतकालीन पक्ष को ‘उठ रही थी’ से सुरक्षित रखा गया है।
- source_word: ut conturbaret omnes fluctus eius
  choice: ताकि उसकी सारी लहरों में खलबली मचा दे
  rationale: ut के प्रयोजनात्मक संबंध और conturbaret के लहरों को विक्षुब्ध करने के भाव को सहज हिन्दी में व्यक्त करता है; ‘उसकी’ का निकटतम संदर्भ समुद्र है।
