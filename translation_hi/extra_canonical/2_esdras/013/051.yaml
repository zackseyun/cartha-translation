  yaml_path: translation/extra_canonical/2_esdras/013/051.yaml
  text: 'And I said[a], “Lord Master, show me this: why did I see the man coming up from the heart of the sea?” And he said to me:'
translation:
  language: hi
  text: 'और मैंने कहा, “हे स्वामी, हे प्रभु, मुझे यह दिखा: मैंने उस मनुष्य को समुद्र के हृदय से ऊपर आते हुए क्यों देखा?” और उसने मुझसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dominator Domine
  choice: हे प्रभु, हे स्वामी
  rationale: दो संबोधनों को स्पष्ट रखते हुए Dominator की अधिकार-सूचकता और Domine की प्रभु-संबोधन भावना को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: de corde maris
  choice: समुद्र के बीच से
  rationale: शाब्दिक अर्थ ‘समुद्र के हृदय से’ है; यहाँ ‘बीच से’ उसी स्थानगत बिंब को सामान्य आधुनिक हिन्दी में सहज रूप देता है।
- source_word: virum ascendentem
  choice: उस मनुष्य को ... ऊपर आते हुए
  rationale: दर्शन में पहले उल्लिखित विशिष्ट पुरुष के लिए निश्चित भाव बनाए रखता है और ascendentem की ऊपर की ओर गति को व्यक्त करता है।
- source_word: et dixit mihi
  choice: तब उसने मुझसे कहा
  rationale: लैटिन में पद के अंत में उपस्थित उत्तर-प्रस्तावना को सुरक्षित रखता है; हिन्दी कथानक में ‘तब’ स्वाभाविक अनुक्रम देता है।
theological_decisions:
- issue: Dominator Domine में दोहरे संबोधन का अनुवाद
  choice: हे प्रभु, हे स्वामी
  alternative: हे सर्वाधिपति प्रभु
  rationale: स्रोत के दोनों संबोधनों को अलग-अलग सुनाई देने देता है और किसी विशिष्ट सम्प्रदायगत पदावली को नहीं थोपता।
- issue: de corde maris के बिंब का निर्वाह
  choice: समुद्र के बीच से
  alternative: समुद्र के हृदय से
  rationale: ‘बीच’ मूल बिंब का आशय बनाए रखते हुए साधारण पाठक के लिए स्वाभाविक है; रहस्यदर्शी दृश्य का कोई अतिरिक्त धर्मवैज्ञानिक अर्थ निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; दर्शन-वर्णन के अनुरूप गरिमापूर्ण किंतु सहज शैली। पदांत का द्विबिंदु अगले पद में आने वाले उत्तर की भूमिका सुरक्षित रखता है।
