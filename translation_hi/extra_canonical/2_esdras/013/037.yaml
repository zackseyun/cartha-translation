  text: But he[37], my Son, will rebuke the impieties of the nations that have come, these things that have drawn near like a storm; and he will reproach them to their faces with their evil thoughts and torments[a],
translation:
  language: hi
  text: परन्तु मेरा पुत्र स्वयं[a] उन आ पहुँचे राष्ट्रों की अधार्मिकताओं को फटकारेगा—ये बातें, जो आँधी की तरह निकट आ गई हैं—और उनके बुरे विचारों और यातनाओं के लिए उनके सामने उन्हें उलाहना देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: व्याख्या में ‘सिय्योन पर्वत’ और ‘बिना हाथों के काटा गया’ पर्वत एक साथ आते हैं। यह बिंब जानबूझकर ऐसे पवित्र स्थान की ओर संकेत करता है जिसे परमेश्वर ने बनाया या प्रकट किया है, न कि मनुष्य के श्रम से बने किसी साधारण पर्वत की ओर।
    reason: cross_reference
  - marker: b
    text: या, ‘वह उन्हें उनके बुरे विचार और यातनाएँ उनके सामने रखेगा’।
    reason: previous_rendering
lexical_decisions:
- source_word: Ipse autem filius meus
  choice: परन्तु मेरा पुत्र स्वयं
  rationale: ‘Ipse’ के बलाघात को ‘स्वयं’ से व्यक्त किया गया है और ‘autem’ के विरोध/संक्रमण को ‘परन्तु’ से।
- source_word: arguet ... impietates eorum
  choice: उनकी अधार्मिकताओं को दोषी ठहराएगा
  rationale: ‘arguet’ में केवल डाँटने से अधिक दोष प्रकट करने या दोषी ठहराने का भाव है; ‘impietates’ के लिए ‘अधार्मिकताएँ’ धार्मिक और नैतिक द्रोह की व्यापकता बनाए रखता है।
- source_word: quae aduenerunt gentes
  choice: आ पहुँचे राष्ट्रों
  rationale: ‘aduenerunt’ का आगमन-भाव ‘आ पहुँचे’ से स्वाभाविक हिन्दी में रखा गया है; सम्बन्धवाचक खंड ‘gentes’ से जोड़ा गया है।
- source_word: has quae tempestati adpropiauerunt
  choice: उन अधार्मिकताओं को, जो आँधी के समान निकट आ गई हैं
  rationale: ‘has’ को निकटतम स्त्रीलिंग बहुवचन ‘impietates’ का पुनरुल्लेख माना गया है। परामर्श-पाठ की तूफान-सदृश उपमा रखी गई है, यद्यपि लैटिन ‘tempestati’ का रूप कठिन है।
- source_word: inproperabit coram eis
  choice: उनके मुँह पर रखकर उन्हें धिक्कारेगा
  rationale: ‘inproperabit’ के निंदात्मक, उलाहना देने वाले बल को ‘धिक्कारेगा’ और ‘coram eis’ की आमने-सामने की तीव्रता को ‘उनके मुँह पर’ व्यक्त करता है।
- source_word: mala cogitamenta eorum et cruciamenta
  choice: उनके बुरे विचारों और यातनाओं को
  rationale: दोनों कर्मवाचक संज्ञाओं को समान स्तर पर रखा गया है; ‘cruciamenta’ की यातना/दण्ड संबंधी अर्थ-अस्पष्टता को ‘यातनाएँ’ बनाए रखता है।
theological_decisions:
- issue: ‘filius meus’ की मसीही पहचान
  choice: मेरा पुत्र
  alternative: मेरा बेटा
  rationale: ‘पुत्र’ स्रोत की औपचारिक और धर्मवैचारिक गरिमा रखता है, पर पद में उससे आगे कोई सांप्रदायिक पहचान आरोपित नहीं करता।
- issue: आने वाले राष्ट्र और उनकी अधार्मिकताओं के बीच संबंध
  choice: राष्ट्रों की अधार्मिकताओं को न्याय का विषय बनाया गया
  alternative: राष्ट्रों को ही सीधे डाँटना
  rationale: लैटिन में ‘impietates eorum’ स्पष्ट रूप से उपस्थित है; इसलिए न्याय का निकटतम व्याकरणिक विषय उनकी अधार्मिकताएँ हैं, जबकि राष्ट्र भी प्रसंग में संबोधित रहते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किन्तु सामान्य पाठक के लिए बोधगम्य रखी गई है। कठिन लैटिन वाक्य-विन्यास को स्पष्ट करने के लिए पुनरुक्ति और दीर्घ विराम का प्रयोग किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
