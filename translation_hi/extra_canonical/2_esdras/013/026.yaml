source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ipse est quem conservat Altissimus multis temporibus, qui per semet ipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/026.yaml
  text: This is he whom the Most High has kept for many ages, who will by himself deliver his creation, and he himself will direct those who are left.
translation:
  language: hi
  text: यह वही है जिसे परमप्रधान ने बहुत युगों से सुरक्षित रखा है। वह स्वयं अपनी सृष्टि को छुड़ाएगा, और वह स्वयं जो शेष रह गए हैं उनकी व्यवस्था करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conservat
  choice: सुरक्षित रखा है
  rationale: लातीनी रूप वर्तमान काल का है, पर ‘multis temporibus’ के साथ यह दीर्घकाल से चली आ रही रक्षा को व्यक्त करता है; हिन्दी में यह प्रयोग स्वाभाविक है और संरक्षण का भाव बनाए रखता है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का प्रतिष्ठित, अर्थ-सटीक और संक्षिप्त हिन्दी रूप।
- source_word: per semet ipsum
  choice: स्वयं
  rationale: कर्ता के अपने ही द्वारा कार्य करने पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: liberabit
  choice: छुड़ाएगा
  rationale: मुक्त या उद्धार करने के व्यापक भाव को रखता है, बिना यह तय किए कि मुक्ति राजनीतिक, भौतिक या आध्यात्मिक है।
- source_word: creaturam suam
  choice: अपनी सृष्टि
  rationale: ‘creatura’ के सामूहिक और व्यापक अर्थ को बनाए रखता है; इसे केवल मनुष्यों तक सीमित नहीं करता।
- source_word: disponet
  choice: मार्गदर्शन करेगा
  rationale: इस संदर्भ में बचे हुए लोगों को व्यवस्थित करने, उनका प्रबंध करने या दिशा देने के अर्थ-क्षेत्र को सहज हिन्दी में व्यक्त करता है।
- source_word: qui derelicti sunt
  choice: जो लोग शेष रह गए हैं
  rationale: निष्क्रिय पूर्ण भाव और जीवित/बचे हुए समुदाय के संदर्भ को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ‘ipse’ की पुनरावृत्ति और मसीही पात्र की भूमिका
  choice: ‘वह स्वयं… भी वही’ द्वारा दोहरा बल सुरक्षित रखा गया
  alternative: दूसरे बलाघात को हटाकर केवल ‘वह’ कहना
  rationale: मूल में ‘ipse’ दो बार है; अनुवाद उस व्यक्ति की प्रत्यक्ष भूमिका पर बल रखता है, पर उसकी पहचान के विषय में अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: ‘creaturam’ का विस्तार
  choice: ‘सृष्टि’
  alternative: ‘प्रजा’ या ‘लोग’
  rationale: मूल शब्द व्यापक है; संकीर्ण विकल्प पाठ की सम्भावित ब्रह्मांडीय या सामूहिक व्यापकता को अनावश्यक रूप से सीमित कर देते।
- issue: ‘disponet’ की व्याख्या
  choice: ‘मार्गदर्शन करेगा’
  alternative: ‘व्यवस्थित करेगा’ या ‘शासन करेगा’
  rationale: लातीनी शब्द में व्यवस्था, प्रबंध और दिशा का भाव हो सकता है। ‘मार्गदर्शन’ पठनीय है और किसी विशिष्ट शासन-सिद्धान्त को थोपे बिना अर्थ को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। दो छोटे वाक्यों में विभाजन हिन्दी प्रवाह सुधारता है, जबकि मूल के समानांतर कर्तृ-बल और भविष्यकालीन क्रियाएँ सुरक्षित रहती हैं।
