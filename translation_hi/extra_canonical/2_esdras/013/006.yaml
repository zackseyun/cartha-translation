  language: hi
  text: और मैंने देखा, और देखो, उसने अपने लिए एक विशाल पर्वत तराशा और उसके ऊपर उड़ गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sibimet ipso
  choice: अपने लिए
  rationale: लैटिन के आत्मवाचक और हितार्थक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: sculpsit
  choice: तराशा
  rationale: ‘गढ़ा’ की तुलना में पर्वत को काटकर आकार देने के ठोस बिंब को अधिक निकटता से बनाए रखता है।
- source_word: montem magnum
  choice: एक विशाल पर्वत
  rationale: अनिश्चितता और बड़े आकार—दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: volavit super eum
  choice: उड़कर उसके ऊपर जा पहुँचा
  rationale: super eum के स्थानगत अर्थ को स्पष्ट रखता है; हिन्दी में केवल ‘उस पर उड़ा’ बैठने अथवा उसके ऊपर से उड़ जाने का भ्रम पैदा कर सकता है।
