source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi, et ecce convolabat ipse homo cum nubibus caeli. et ubi vultum suum convertebat ut consideraret, tremebant omnia quae sub eo videbantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/003.yaml
  text: And I looked[a], and behold, that man was flying with the clouds of heaven; and wherever he turned his face to look, everything seen beneath him trembled.
translation:
  language: hi
  text: और मैंने देखा, और देखो, वह मनुष्य आकाश के बादलों के साथ उड़ रहा था। और वह जिधर देखने के लिए अपना मुख फेरता था, उसके नीचे दिखाई देने वाली हर वस्तु काँपने लगती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: convolabat
  choice: उड़ रहा था
  rationale: लातीनी क्रिया का स्वाभाविक और प्रत्यक्ष हिन्दी अर्थ; संदर्भ में बादलों के साथ आकाशीय गति व्यक्त होती है।
- source_word: cum nubibus caeli
  choice: आकाश के बादलों के साथ
  rationale: cum का सामान्य सहचारी अर्थ ‘के साथ’ रखा गया है; पाठ यह नहीं कहता कि वह बादलों पर सवार था।
- source_word: ut consideraret
  choice: देखने के लिए
  rationale: उद्देश्यसूचक रचना को सरल आधुनिक हिन्दी में व्यक्त किया गया है; ‘ध्यान से देखने’ की सम्भावना है, पर यहाँ वह अनावश्यक रूप से अर्थ को तीव्र करती।
- source_word: sub eo videbantur
  choice: उसके नीचे दिखाई देने वाली
  rationale: उपलब्ध लातीनी पाठ के sub eo को स्थानसूचक ‘उसके नीचे’ माना गया है और videbantur को ‘दिखाई देने वाली’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्या मनुष्य की दृष्टि काँपने का कारण है
  choice: पाठ केवल इतना कहता है कि उसके मुख फेरकर देखने पर नीचे दिखाई देने वाली सब वस्तुएँ काँपती थीं; प्रत्यक्ष कारण नहीं जोड़ा गया
  alternative: ‘उसके द्वारा देखी गई हर वस्तु काँप उठती थी,’ जिससे उसकी दृष्टि को अधिक स्पष्ट रूप से कारक समझा जा सकता है
  rationale: लातीनी sub eo का प्रत्यक्ष अर्थ ‘उसके नीचे’ है। सम्भावित अंतर्निहित यूनानी या अन्य प्राचीन अनुवादों के आधार पर agency चुनना लातीनी स्रोत की वास्तविक अस्पष्टता/तनाव को चुपचाप समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘और मैंने देखा—क्या देखता हूँ कि’ से et vidi, et ecce की दृश्यात्मक तीव्रता स्वाभाविक हिन्दी में आती है। कोई पादटिप्पणी नहीं दी गई, क्योंकि मुख्य पाठ में लातीनी sub eo का सीधा स्थानसूचक अर्थ सुरक्षित है।
