  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। उपलब्ध लैटिन अंश वाक्य के बीच से आरम्भ होता है; अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूरे पद के आधार पर पूर्ववर्ती यात्रा-वाक्य को रखा गया है। स्रोत-अंश का अगला वाक्य ‘Tunc inhabitauerunt ibi’ इस पद की अंग्रेज़ी सीमा से बाहर प्रतीत होने के कारण शामिल नहीं किया गया।
