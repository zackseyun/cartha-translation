  text: For through that region there was a long way to travel, of a year and a half; and that region is called Arzareth.
translation:
  language: hi
  text: क्योंकि उस प्रदेश से होकर जाने में एक वर्ष और छह महीने लगते थे; और उस प्रदेश को अरज़ारेथ कहा जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimidii
  choice: छह महीने
  rationale: यह शब्द पूर्ववर्ती ‘एक वर्ष’ के साथ मिलकर ‘डेढ़ वर्ष’ का भाव देता है। आधुनिक हिन्दी में अवधि को स्पष्ट और स्वाभाविक रूप से ‘एक वर्ष और छह महीने’ कहा गया है।
- source_word: regio illa
  choice: उस प्रदेश
  rationale: ‘regio’ के लिए ‘प्रदेश’ भौगोलिक क्षेत्र का सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: uocatur Arzareth
  choice: अरज़ारेत कहा जाता है
  rationale: स्थाननाम को अर्थानुवाद किए बिना देवनागरी में लिप्यंतरित किया गया है और लैटिन के कर्मवाच्य को सुरक्षित रखा गया है।
theological_decisions: []
