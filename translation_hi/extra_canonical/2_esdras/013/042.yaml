lexical_decisions:
- source_word: seruantes
  choice: पालन किया
  rationale: यहाँ participle उस बात/व्यवस्था को मानने या निभाने का अर्थ देता है; सहज हिन्दी में ‘पालन किया’ उपयुक्त है।
- source_word: regione sua
  choice: अपने देश में
  rationale: regio यहाँ अपने भू-प्रदेश या देश को सूचित करता है; प्रसंगानुकूल और सामान्य हिन्दी में ‘अपने देश’ स्वाभाविक है।
- source_word: Per introitus
  choice: प्रवेश-मार्गों से
  rationale: per का माध्यम/रास्ता-सूचक अर्थ और introitus का बहुवचन सुरक्षित रखा गया है; आगे के पद से जुड़ने वाली अधूरी वाक्य-रचना भी बनी रहती है।
- source_word: autem
  choice: परन्तु
  rationale: यह पिछले कथन से संक्रमण अथवा हल्का विरोध दिखाता है; ‘परन्तु’ गरिमापूर्ण और स्पष्ट है।
