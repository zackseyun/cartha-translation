  text: et vidi post haec, et ecce congregabatur multitudo hominum, quorum non erat numerus, de quattuor ventis caeli, ut debellarent hominem qui ascenderat de mari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/005.yaml
  text: And after this I looked, and behold, a multitude of men was gathering, whose number was beyond counting, from the four winds of heaven, to make war against the man who had come up from the sea.
translation:
  language: hi
  text: इसके बाद मैंने देखा, और देखो, आकाश की चारों दिशाओं से मनुष्यों की एक ऐसी भीड़ इकट्ठी हो रही थी जिसकी गिनती नहीं हो सकती थी, ताकि वे उस मनुष्य से युद्ध करें जो समुद्र से ऊपर आया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et vidi post haec
  choice: इसके बाद मैंने देखा
  rationale: लातीनी क्रम और दर्शन-वर्णन की सहज हिन्दी अभिव्यक्ति को बनाए रखता है।
- source_word: ecce
  choice: और देखो
  rationale: दृश्य के आकस्मिक और ध्यान खींचने वाले स्वर को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: multitudo hominum, quorum non erat numerus
  choice: मनुष्यों की एक ऐसी भीड़ ... जिसकी कोई गिनती नहीं थी
  rationale: असंख्यता का मूल अर्थ स्वाभाविक हिन्दी में व्यक्त करता है और वाक्य के संबंधवाचक ढाँचे को भी यथासंभव बनाए रखता है।
- source_word: de quattuor ventis caeli
  choice: आकाश की चारों दिशाओं से
  rationale: शाब्दिक 'चार हवाओं' के स्थान पर इस मुहावरे का अभिप्रेत भौगोलिक अर्थ साधारण आधुनिक हिन्दी में देता है।
- source_word: ut debellarent
  choice: ताकि वे ... से युद्ध करें
  rationale: उद्देश्यसूचक ut और युद्ध करने के अर्थ को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: hominem qui ascenderat de mari
  choice: उस मनुष्य ... जो समुद्र से ऊपर आया था
  rationale: ascenderat की पूर्वकालिकता तथा समुद्र से ऊपर आने की दृश्यात्मक भाषा दोनों सुरक्षित हैं।
theological_decisions:
- issue: समुद्र से आए मनुष्य की पहचान
  choice: केवल 'उस मनुष्य' कहा गया है
  alternative: उसे किसी विशिष्ट मसीही या अन्य उपाधि से पहचानना
  rationale: इस पद का लातीनी पाठ केवल hominem कहता है; किसी व्याख्यात्मक पहचान को पाठ में जोड़ना उचित नहीं।
- issue: '''आकाश की चार हवाओं'' की अभिव्यक्ति'
  choice: आकाश की चारों दिशाएँ
  alternative: आकाश की चार हवाएँ
  rationale: यह मुहावरे का स्वाभाविक हिन्दी अर्थ है और चारों ओर से एकत्र होने का भाव रखता है; इसमें कोई अतिरिक्त ब्रह्मांड-विषयक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण दर्शन-वर्णन। 'और देखो' बाइबिलीय ध्यानाकर्षक शैली को बनाए रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज रखा गया है।
