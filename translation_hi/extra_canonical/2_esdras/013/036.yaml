  yaml_path: translation/extra_canonical/2_esdras/013/036.yaml
  text: But he will stand upon the summit of Mount Zion. And Zion will come and be shown to all, prepared and built, just as you saw the mountain carved out without hands.
translation:
  language: hi
  text: पर वह सिय्योन पर्वत की चोटी पर खड़ा होगा। और सिय्योन आएगा और सबके सामने प्रकट किया जाएगा—तैयार और निर्मित—ठीक वैसे ही जैसे तुमने उस पर्वत को बिना हाथों के तराशा हुआ देखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cacumen montis Sion
  choice: सिय्योन पर्वत की चोटी
  rationale: ‘cacumen’ के लिए सहज आधुनिक हिन्दी ‘चोटी’ चुना गया है, जो पर्वत के सर्वोच्च भाग को स्पष्ट करता है।
- source_word: ueniet et ostendetur omnibus
  choice: आएगा और सबको दिखाई देगा
  rationale: लैटिन के भविष्यकाल और कर्मवाच्य को बनाए रखते हुए स्वाभाविक हिन्दी अभिव्यक्ति दी गई है।
- source_word: parata et aedificata
  choice: तैयार और निर्मित
  rationale: दोनों समानांतर विशेषणों को बनाए रखा गया है; ‘निर्मित’ सिय्योन के बनाए जाने का गरिमापूर्ण और व्यापक अर्थ देता है।
- source_word: montem sculpi sine manibus
  choice: उस पर्वत को बिना हाथों के तराशा जाता
  rationale: ‘sculpi’ का मूर्त रूप देने या काटकर आकार देने वाला भाव ‘तराशा जाता’ से व्यक्त होता है, और ‘sine manibus’ का असाधारण आशय बिना व्याख्यात्मक विस्तार के सुरक्षित रहता है।
theological_decisions:
- issue: सिय्योन का आना और प्रकट होना
  choice: सिय्योन आएगा और सबको दिखाई देगा
  alternative: सिय्योन प्रकट होकर सबके सामने आएगा
  rationale: मूल के दो पृथक क्रियापदों—‘ueniet’ और ‘ostendetur’—को अलग रखा गया है, ताकि सिय्योन के आने और सबके लिए दृश्य होने के बीच का तनाव या भेद मिटे नहीं।
- issue: बिना हाथों के पर्वत का तराशा जाना
  choice: बिना हाथों के तराशा जाता
  alternative: मनुष्य के हाथों के बिना बनाया जाता
  rationale: मूल पाठ केवल ‘हाथों के बिना’ कहता है; इसे ‘मनुष्य के हाथों के बिना’ बनाकर धर्मवैचारिक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आरंभिक वाक्य अंग्रेज़ी परामर्श-पाठ में सुरक्षित संदर्भानुसार पूर्ण किया गया है, जबकि उपलब्ध लैटिन अंश ‘सिय्योन पर्वत की चोटी’ से आरंभ होता है।
