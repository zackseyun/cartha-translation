source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: consilium hoc, ut derelinquerent multitudinem gentium, et proficiscerentur in ulteriorem regionem, ubi nunquam inhabitauit genus humanum, Vt uel ibi obseruarent legitima sua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/041.yaml
  text: But they formed this plan among themselves, that they would leave the multitude of the nations and go on into a more distant region, where no human race had ever lived, so that there they might keep their statutes,
translation:
  language: hi
  text: उन्होंने आपस में यह योजना बनाई कि वे राष्ट्रों की भीड़ को छोड़कर एक और अधिक दूरस्थ प्रदेश में चले जाएँ, जहाँ मनुष्य-जाति ने कभी निवास नहीं किया था, ताकि कम-से-कम वहाँ वे अपने नियमों का पालन कर सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudinem gentium
  choice: अन्य राष्ट्रों की भीड़
  rationale: ‘gentium’ का मूल अर्थ ‘राष्ट्रों/जातियों’ है; प्रसंग में अपने समुदाय से बाहर के राष्ट्र अभिप्रेत हैं, इसलिए स्वाभाविक हिन्दी में ‘अन्य राष्ट्रों’ चुना गया।
- source_word: ulteriorem regionem
  choice: एक और दूर के प्रदेश
  rationale: ‘ulteriorem’ दूरी और आगे जाने का भाव व्यक्त करता है; ‘और दूर का प्रदेश’ इस तुलनात्मक अर्थ को बनाए रखता है।
- source_word: genus humanum
  choice: मनुष्य-जाति
  rationale: यह लैटिन पद समूची मानव जाति को सूचित करता है, न कि किसी एक राष्ट्र या समुदाय को।
- source_word: uel ibi
  choice: कम-से-कम वहाँ
  rationale: इस प्रसंग में ‘uel’ उस आशा पर बल देता है कि अन्यत्र संभव न हो तो कम-से-कम उस स्थान पर वे अपनी विधियाँ मान सकेंगे।
- source_word: legitima sua
  choice: अपनी विधियों
  rationale: ‘legitima’ से निर्धारित धार्मिक-कानूनी नियम अभिप्रेत हो सकते हैं; ‘विधियाँ’ इस व्यापक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: obseruarent
  choice: पालन कर सकें
  rationale: यहाँ क्रिया नियमों को मानने और व्यवहार में रखने के अर्थ में है; उद्देश्यवाचक उपवाक्य के कारण ‘कर सकें’ स्वाभाविक है।
theological_decisions:
- issue: ‘legitima sua’ का धार्मिक-कानूनी दायरा
  choice: अपनी विधियों
  alternative: अपनी व्यवस्था / अपने नियमों
  rationale: ‘विधियों’ से निर्धारित धार्मिक आचार और नियम दोनों का अर्थ खुला रहता है; ‘व्यवस्था’ इसे अनावश्यक रूप से किसी विशिष्ट धर्मशास्त्रीय तकनीकी पद तक सीमित कर सकती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। वाक्य की उद्देश्यवाचक संरचना तथा ‘कम-से-कम वहाँ’ में निहित बल को सुरक्षित रखा गया है।
