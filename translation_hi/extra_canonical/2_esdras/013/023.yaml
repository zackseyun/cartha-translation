base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/023.yaml
  text: he who brings the danger at that time will himself protect those who fall into danger[a], those who have works and faith toward the Most Mighty.
translation:
  language: hi
  text: जो उस समय संकट लाएगा, वही उन लोगों की रक्षा करेगा जो संकट में पड़ेंगे, जिनके कर्म हैं और जो परम सामर्थी[a] पर विश्वास रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सामर्थी।”
    reason: Fortissimum सर्वोत्तमावाची ईश्वरीय उपाधि है; मुख्य पाठ में ‘परम सामर्थी’ उसके बल को दिखाता है, जबकि ‘सामर्थी’ एक संक्षिप्त संभावित रूप है।
lexical_decisions:
- source_word: adferet periculum
  choice: संकट लाएगा
  rationale: भविष्यकाल और संकट को लाने की स्पष्ट, किंतु कारण के विषय में अनिर्णीत, भाषा को बनाए रखता है।
- source_word: custodibit
  choice: रक्षा करेगा
  rationale: यहाँ custodire का अर्थ संकट में पड़े लोगों को सुरक्षित रखना है; आधुनिक हिन्दी में ‘रक्षा करेगा’ स्वाभाविक है।
- source_word: operas
  choice: कर्म
  rationale: लैटिन बहुवचन का नैतिक/व्यावहारिक अर्थ सुरक्षित रहता है और इसे केवल ‘अच्छे कर्म’ कहकर मूल से अधिक विशिष्ट नहीं बनाया गया।
- source_word: fidem ad
  choice: पर विश्वास
  rationale: इस प्रसंग में परमेश्वर की ओर निर्देशित fides को स्वाभाविक हिन्दी में ‘पर विश्वास’ कहा गया है।
- source_word: Fortissimum
  choice: परम सामर्थी
  rationale: Fortissimum के सर्वोत्तमावाची रूप और संज्ञा के रूप में प्रयुक्त ईश्वरीय उपाधि—‘सबसे सामर्थी’—दोनों को व्यक्त करता है; ‘सर्वशक्तिमान’ मूल की अपेक्षा अधिक दार्शनिक विशिष्टता ला सकता था।
theological_decisions:
- issue: संकट लानेवाले और रक्षा करनेवाले की एक ही पहचान
  choice: ‘जो ... लाएगा, वही ... रक्षा करेगा’
  alternative: संकट को केवल होने देनेवाला या उससे छुड़ानेवाला
  rationale: ipse स्पष्ट रूप से उसी कर्ता पर बल देता है; कथन में निहित धार्मिक तनाव को नरम या स्पष्ट नहीं किया गया।
- issue: कर्म और विश्वास का संबंध
  choice: दोनों को समान रूप से ‘जिनके कर्म हैं और जो ... विश्वास रखते हैं’ के रूप में रखा
  alternative: ‘विश्वास से उत्पन्न कर्म’ अथवा ‘अच्छे कर्म और विश्वास’
  rationale: मूल में operas et fidem दोनों साथ हैं, पर उनका परस्पर संबंध या कर्मों की गुणवत्ता स्पष्ट नहीं की गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य की पुनरुक्ति (‘संकट ... संकट’) मूल के बल और संबंध को स्पष्ट रखती है; डैश उत्तरवर्ती संबंधवाचक खंड को उन लोगों से जोड़ता है जिनकी रक्षा की जाएगी।
