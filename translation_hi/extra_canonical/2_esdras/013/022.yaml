  yaml_path: translation/extra_canonical/2_esdras/013/022.yaml
  text: 'For you said about those who are left, and about those who are not left, this is the interpretation:'
translation:
  language: hi
  text: 'क्योंकि तूने उन लोगों के विषय में कहा था जो छोड़ दिए गए हैं, और उनके विषय में जो छोड़ नहीं दिए गए हैं, तेरी उस बात की व्याख्या यह है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: क्योंकि
  rationale: कारणसूचक संबंध को सीधे बनाए रखता है और पिछले कथन से इस पद का संबंध प्रकट करता है।
- source_word: derelicti sunt
  choice: बचे हुए हैं
  rationale: यहाँ संदर्भ में पीछे रह जाने या बच रहने का भाव है; ‘बचे हुए’ स्वाभाविक हिन्दी है और व्याख्या में आगे बढ़कर अर्थ निर्धारित नहीं करती।
- source_word: non derelicti sunt
  choice: बचे हुए नहीं हैं
  rationale: लैटिन की स्पष्ट नकारात्मक समानांतर संरचना को सुरक्षित रखा गया है, ताकि मूल की संभावित अर्थगत अस्पष्टता बनी रहे।
- source_word: haec interpretatio
  choice: उसका अर्थ यह है
  rationale: शाब्दिक ‘यह व्याख्या है’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि आगामी स्पष्टीकरण की ओर संकेत भी बनाए रखता है।
theological_decisions:
- issue: ‘बचे हुए’ और ‘बचे हुए नहीं’ की पहचान
  choice: दोनों समूहों को बिना अतिरिक्त पहचान दिए समानांतर रूप में रखा गया।
  alternative: उन्हें क्रमशः जीवित बचे और नष्ट हुए लोगों के रूप में स्पष्ट करना।
  rationale: इस पद का लैटिन स्वयं समूहों की पहचान नहीं खोलता; धार्मिक या युगांत-संबंधी निष्कर्ष अनुवाद में जोड़ना उचित नहीं होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। संबोधन में ‘तूने’ रखा गया है, क्योंकि प्रसंग में एकवचन निकट संबोधन है; वाक्य के अंत का द्विबिंदु आगे आने वाली व्याख्या का संकेत देता है।
