source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter hoc vae, viderunt enim pericula magna et necessitates multas, sicut ostendunt somnia haec.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/019.yaml
  text: But as for those who are left—woe to them for this reason! For they will see great dangers and many distresses[a], as these dreams show.
translation:
  language: hi
  text: जो लोग बचे रह गए हैं—उन पर इस कारण हाय! क्योंकि उन्होंने बड़े-बड़े खतरे और बहुत-से संकट देखे हैं[a], जैसा कि ये स्वप्न दिखाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भविष्यसूचक संदर्भ में इसका अनुवाद ‘क्योंकि वे बड़े-बड़े खतरे और बहुत-से संकट देखेंगे’ भी हो सकता है।
    reason: लैटिन ‘viderunt’ व्याकरणतः पूर्ण भूतकाल है, जबकि प्रसंग इसे भविष्य की विपत्तियों का दर्शन मानने की गुंजाइश देता है।
lexical_decisions:
- source_word: propter hoc vae
  choice: इसी कारण उन पर हाय!
  rationale: कारणसूचक वाक्यांश और शोक-घोषणा की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है; बहुवचन क्रिया के निहित कर्ता के लिए ‘उन पर’ जोड़ा गया है।
- source_word: pericula magna
  choice: बड़े-बड़े खतरे
  rationale: ‘pericula’ के वास्तविक संकट/खतरे और ‘magna’ की तीव्रता को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: necessitates multas
  choice: बहुत-से संकट
  rationale: यहाँ ‘necessitates’ बाध्यताओं की अपेक्षा विपत्तिपूर्ण तंगी और कष्टों का बोध कराता है; ‘संकट’ संदर्भानुकूल और सहज है।
- source_word: sicut ostendunt somnia haec
  choice: जैसा कि ये स्वप्न दिखाते हैं
  rationale: ‘ostendunt’ और ‘somnia haec’ की संरचना तथा प्रमाणसूचक भाव को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: viderunt का काल
  choice: उन्होंने … देखे हैं
  alternative: वे … देखेंगे
  rationale: लैटिन में क्रिया पूर्ण भूतकाल में है, इसलिए मुख्य पाठ उसी रूप को रखता है। भविष्यसूचक संदर्भ के कारण भविष्यकालीन अर्थ संभव है, अतः उसे पादटिप्पणी में दिया गया है।
- issue: निहित बहुवचन कर्ता की पहचान
  choice: उन पर
  alternative: जो लोग बचे रहेंगे, उन पर
  rationale: प्रदत्त लैटिन वाक्य में ‘जो बचे रहेंगे’ के समतुल्य पद नहीं है; इसलिए उसका स्पष्ट विस्तार मुख्य पाठ में नहीं जोड़ा गया। बहुवचन ‘viderunt’ के कारण केवल निहित सर्वनाम व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाय’ बाइबलीय शोक-घोषणा की संक्षिप्त तीव्रता बनाए रखता है।
