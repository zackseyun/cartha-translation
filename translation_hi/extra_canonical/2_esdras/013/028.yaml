source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et quoniam non tenebat frameam neque vas bellicosum, corrumpitenim impetum eius multitudinis quae venerat ad expugnare eum, haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/028.yaml
  text: 'and that he held neither sword nor weapon of war, yet destroyed the assault of the multitude that had come to attack him, this is the interpretation:'
translation:
  language: hi
  text: 'और उसके हाथ में न तो तलवार थी, न युद्ध का कोई हथियार; फिर भी उसने उस भीड़ के धावे को विफल कर दिया, जो उस पर धावा बोलने आई थी—इसका अर्थ यह है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: frameam
  choice: तलवार
  rationale: इस प्रसंग में लैटिन शब्द युद्ध में हाथ में लिए जाने वाले धारदार शस्त्र, अर्थात् तलवार, को सूचित करता है; यह नवीनतम पाठ-समीक्षा से भी मेल खाता है।
- source_word: vas bellicosum
  choice: युद्ध का कोई हथियार
  rationale: शाब्दिक अर्थ ‘युद्ध का उपकरण’ है; स्वाभाविक आधुनिक हिन्दी में ‘युद्ध का कोई हथियार’ मूल आशय को स्पष्ट रखता है।
- source_word: corrumpit ... impetum
  choice: आक्रमण को नष्ट कर दिया
  rationale: corrumpit का बल केवल रोकने पर नहीं, आक्रमण को विफल और ध्वस्त करने पर है; ‘नष्ट कर दिया’ इस तीव्रता को बनाए रखता है।
- source_word: ad expugnare eum
  choice: उस पर चढ़ाई करने
  rationale: यह अभिव्यक्ति शत्रुतापूर्ण सैन्य आक्रमण का बोध कराती है; ‘चढ़ाई करने’ सामान्य हिन्दी में उसी भाव को व्यक्त करता है।
- source_word: haec interpretatio
  choice: इसका अर्थ यह है
  rationale: यह अगले पदों में दर्शन की व्याख्या का सूत्रपात करता है; हिन्दी में यह वाक्यांश स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: हथियार के बिना भीड़ के आक्रमण का विनाश
  choice: घटना को पाठ के अनुसार बिना कारण या विधि समझाए रखा गया है
  alternative: इसे स्पष्ट रूप से अलौकिक शक्ति, वचन, या मसीही न्याय के द्वारा हुआ बताना
  rationale: इस पद में केवल दृश्य के इस अंश की व्याख्या आरम्भ होती है; विनाश की विधि या धर्मवैज्ञानिक पहचान यहाँ जोड़ना मूल से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की व्याख्यात्मक भूमिका दिखाने के लिए अंत में दीर्घ विराम-चिह्न लगाया गया है।
