- source_word: ascendentem
  choice: ऊपर आते
  rationale: समुद्र से उदित होने या ऊपर आने की गति को सीधे व्यक्त करता है।
- source_word: de corde maris
  choice: समुद्र के बीच से
  rationale: शाब्दिक ‘समुद्र के हृदय से’ हिन्दी में अस्वाभाविक हो सकता है; मुहावरे का स्थानगत अर्थ ‘समुद्र के बीच/मध्य से’ है।
