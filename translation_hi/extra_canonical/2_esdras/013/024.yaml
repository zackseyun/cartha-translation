  text: Therefore know that those who are left are more blessed than those who have died.
translation:
  language: hi
  text: इसलिए जान लो कि जो रह गए हैं, वे उन लोगों से अधिक धन्य हैं जो मर गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scito ergo
  choice: इसलिए जान लो
  rationale: आज्ञार्थक एकवचन और निष्कर्षसूचक ‘ergo’—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: magis beatificati sunt
  choice: अधिक धन्य हैं
  rationale: तुलनात्मक अर्थ को स्पष्ट रखता है और ‘धन्य’ धार्मिक साहित्य में परिचित होते हुए भी सामान्य पाठक के लिए बोधगम्य है।
- source_word: qui derelicti
  choice: जो जीवित बचे हैं
  rationale: शाब्दिक ‘जो छोड़े गए हैं’ यहाँ मृत लोगों के विपरीत जीवित रह गए लोगों को सूचित करता है; ‘जीवित बचे’ प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: super eos qui mortui sunt
  choice: मर चुके लोगों से
  rationale: लैटिन ‘super’ यहाँ तुलना प्रकट करता है; हिन्दी में ‘से’ उसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: जीवित बचे लोगों की मृत लोगों से तुलना
  choice: 'कथन को सीधे तुलनात्मक रूप में रखा गया है: जीवित बचे लोग अधिक धन्य हैं।'
  alternative: इसे अंतिम उद्धार या किसी विशिष्ट परलोक-सिद्धांत का कथन मानकर विस्तार देना।
  rationale: मूल पद केवल दोनों समूहों की धन्यता की तुलना करता है; वह इस धन्यता का धर्मवैज्ञानिक कारण या स्वरूप यहाँ स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पद में किसी पादटिप्पणी की आवश्यकता नहीं है।
