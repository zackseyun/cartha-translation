source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ubicumque exiebat vox de ore eius, ardescebant omnes qui audiebant voces eius. sicut liquescit cera quando senserit ignem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/004.yaml
  text: And wherever a voice went out from his mouth[a], all who heard his voice burned[b], just as wax melts when it senses the fire.
translation:
  language: hi
  text: और जहाँ कहीं उसके मुँह से आवाज़ निकलती थी,[a] उसकी आवाज़ सुनने वाले सभी जल उठते थे,[b] जैसे मोम आग की आँच पाकर पिघल जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में यहाँ केवल ‘आवाज़’ है; इसका अनुवाद ‘एक आवाज़’ भी किया जा सकता है।
    reason: लैटिन में उपपद न होने के कारण निश्चितता या अनिश्चितता प्रसंग से समझी जाती है।
  - marker: b
    text: 'या, ‘आग पकड़ लेते थे’। आगे ‘उसकी आवाज़’ के लिए लैटिन में बहुवचन है: ‘उसकी आवाज़ें’।'
    reason: ‘जल उठते थे’ सक्रिय आरंभसूचक क्रिया को व्यक्त करता है; साथ ही स्रोत में आए एकवचन से बहुवचन के परिवर्तन को दर्ज करना आवश्यक है।
lexical_decisions:
- source_word: vox ... voces
  choice: आवाज़ ... उसकी आवाज़
  rationale: पहला लैटिन रूप एकवचन है और दूसरा बहुवचन। हिन्दी में प्रसंगगत एक ही वक्ता की ध्वनि के लिए ‘आवाज़’ स्वाभाविक है; दूसरे बहुवचन को पादटिप्पणी में सुरक्षित रखा गया है, क्योंकि वह उसकी बार-बार निकली आवाज़ों या कथनों की ओर संकेत कर सकता है।
- source_word: ardescebant
  choice: जल उठते थे
  rationale: लैटिन का अपूर्णकालीन, सक्रिय और आरंभसूचक भाव है—वे जलने लगते या आग पकड़ते थे। ‘जल उठते थे’ इस भाव और दृश्य की तीव्रता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: quando senserit ignem
  choice: आग की आँच पाते ही
  rationale: शाब्दिक अर्थ ‘जब वह आग को महसूस करे’ है। मोम के संदर्भ में ‘आग की आँच पाते ही’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आग के संपर्क/ताप का आशय बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आग की आँच पाते ही’ मोम के उपमान को स्वाभाविक बनाता है, जबकि ‘जल उठते थे’ मूल की सक्रिय और आरंभसूचक क्रिया को बनाए रखता है।
