  text: For you have ordered your life in wisdom, and have called understanding your mother.
translation:
  language: hi
  text: क्योंकि तुमने बुद्धिमानी से अपना जीवन व्यवस्थित किया है, और समझ को अपनी माता कहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vitam enim tuam disposuisti
  choice: क्योंकि तुमने अपने जीवन को ... व्यवस्थित किया है
  rationale: ‘disposuisti’ में जीवन को सुव्यवस्थित या नियोजित करने का भाव है; ‘व्यवस्थित किया’ मूल रूपक और पूर्ण क्रिया के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: in sapientiam
  choice: बुद्धि के अनुसार
  rationale: लैटिन ‘in’ यहाँ जीवन के विन्यास की दिशा या मानदंड बता सकता है। शाब्दिक ‘बुद्धि में’ हिन्दी में अस्पष्ट है; ‘बुद्धि के अनुसार’ आशय को बिना अनावश्यक व्याख्या के स्पष्ट करता है।
- source_word: sensum
  choice: समझ
  rationale: ‘sensus’ का अर्थ यहाँ बोध या समझ है; ‘समझ’ आधुनिक सामान्य हिन्दी में सहज है और इसे किसी तकनीकी दार्शनिक अर्थ तक सीमित नहीं करती।
- source_word: matrem
  choice: माता
  rationale: ‘माता’ मूल के पारिवारिक रूपक को dignified और स्पष्ट हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: बुद्धि और समझ का व्यक्तिकरण
  choice: ‘समझ को अपनी माता कहा है’ के रूप में रूपक को यथावत रखा गया
  alternative: ‘समझ को मातृ-समान माना है’
  rationale: मूल पाठ स्पष्ट रूप से ‘माता कहा’ कहता है। इसे केवल तुलना में बदलना व्यक्तिकरण और कथन की शक्ति को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए सहज, किंतु गरिमापूर्ण। वाक्य में मूल लैटिन का कारणसूचक ‘enim’ और बुद्धि/समझ का अंतर बनाए रखा गया है।
