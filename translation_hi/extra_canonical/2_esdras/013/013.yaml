source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et accedebant ad eum vultus hominum multorum, quorumdam gaudentium, quorumdam tristantium, aliqui vero alligati, aliqui adducentes ex eis qui offerebantur. et egoa multitudine pavoris expergefactus sum et deprecatus sum Altissimum et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/013.yaml
  text: 'And many human faces were coming to him: some rejoicing, some grieving; some were bound, and some were bringing those who were being led. And I awoke from the greatness of my fear, and I made supplication to the Most High and said,'
translation:
  language: hi
  text: 'और बहुत-से मनुष्यों के चेहरे उसके पास आ रहे थे—कुछ आनन्दित थे, कुछ शोकित; कुछ बँधे हुए थे, और कुछ उन लोगों को ला रहे थे जिन्हें आगे लाया जा रहा था। तब मैं अपने अत्यन्त भय के कारण जाग उठा और परमप्रधान से विनती करके कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vultus hominum multorum
  choice: बहुत-से मनुष्यों के चेहरे
  rationale: लैटिन में दृश्य का केंद्र अनेक मनुष्यों के ‘चेहरे’ हैं; असामान्य किंतु अर्थपूर्ण बिंब को सामान्य बनाकर ‘बहुत-से लोग’ नहीं किया गया।
- source_word: gaudentium / tristantium
  choice: आनन्दित / शोकित
  rationale: दोनों सहभागी रूप चेहरों से जुड़े लोगों की विपरीत दशाओं को संक्षेप और गरिमा के साथ व्यक्त करते हैं।
- source_word: alligati
  choice: बँधे हुए
  rationale: शारीरिक बंधन का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: offerebantur
  choice: आगे लाया जा रहा था
  rationale: यहाँ क्रिया का अर्थ किसी के समक्ष प्रस्तुत करने या आगे लाने का है; बलि चढ़ाए जाने का धार्मिक अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: a multitudine pavoris
  choice: अपने अत्यन्त भय के कारण
  rationale: शाब्दिक ‘भय की बहुतायत’ के भाव को स्वाभाविक आधुनिक हिन्दी में भय की तीव्रता के रूप में व्यक्त किया गया।
- source_word: Altissimum
  choice: परमप्रधान
  rationale: ईश्वर की उपाधि का प्रचलित, गरिमापूर्ण और स्रोत-संगत हिन्दी रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। चेहरे आने के दर्शनात्मक बिंब और बँधे हुए तथा आगे लाए जा रहे लोगों के बीच स्रोत की अस्पष्टता को बनाए रखा गया है।
