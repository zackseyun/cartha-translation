    issue: The phrase ‘जिन बातों के विषय में तुमने कहा है’ is awkward and semantically under-specified.
    rationale: The Latin de quibus locutus es means ‘about which you have spoken.’ In Hindi, ‘कहा है’ normally requires stated content or a complement; ‘बात की है’ accurately and naturally renders locutus es.
