  yaml_path: translation/extra_canonical/2_esdras/013/021.yaml
  text: And he answered me and said, “I will tell you the interpretation of the vision, and I will also explain to you the matters about which you have spoken.”
translation:
  language: hi
  text: और उसने मुझे उत्तर दिया, “मैं तुम्हें इस दर्शन का अर्थ बताऊँगा और जिन विषयों पर तुमने बात की है, उनके बारे में भी तुम्हें समझाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visionis interpretationem
  choice: इस दर्शन का अर्थ
  rationale: ‘दर्शन की व्याख्या’ संभव है, पर आधुनिक हिन्दी में ‘दर्शन का अर्थ’ अधिक स्वाभाविक है और मूल आशय को ठीक रखता है।
- source_word: adaperiam
  choice: स्पष्ट करूँगा
  rationale: क्रिया का भाव खोलकर बताने या समझाने का है; ‘स्पष्ट करूँगा’ सहज हिन्दी में यही अर्थ देता है।
- source_word: de quibus locutus es
  choice: जिन बातों के विषय में तुमने कहा है
  rationale: लैटिन संबंधवाचक रचना और उसके विषयगत अर्थ को बिना अतिरिक्त विशिष्टता जोड़े सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लैटिन में प्रत्यक्षतः उपस्थित न होने के कारण अंग्रेज़ी परामर्श-पाठ का विस्तृत ‘and said’ अलग से नहीं जोड़ा गया; ‘उत्तर दिया’ कथन की शुरुआत को स्वाभाविक रूप से व्यक्त करता है।
