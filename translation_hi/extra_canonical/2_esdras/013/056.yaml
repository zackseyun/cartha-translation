revisions:
- from: “इसी कारण मैंने तुम्हें ये बातें दिखाई हैं, क्योंकि परमप्रधान के यहाँ प्रतिफल है। अब तीन दिन और बीतने के बाद मैं तुमसे दूसरी बातें कहूँगा और तुम्हें गंभीर और अद्भुत बातें समझाऊँगा।”
  to: “इसी कारण मैंने तुम्हें ये बातें दिखाई हैं, क्योंकि परमप्रधान के यहाँ प्रतिफल है। तीन और दिन बाद मैं तुमसे और बातें कहूँगा और तुम्हें महत्त्वपूर्ण और अद्भुत बातें समझाऊँगा।”
  rationale: 'The revision makes two small lexical improvements: alia is rendered “और बातें” to avoid an unintended ordinal sense, and gravia is rendered “महत्त्वपूर्ण” to convey ‘weighty’ matters more precisely in modern Hindi. The source’s ambiguity about the recipient and nature of the reward remains intact.'
