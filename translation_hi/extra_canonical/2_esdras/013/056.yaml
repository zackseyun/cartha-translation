base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/056.yaml
  text: Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”
translation:
  language: hi
  text: “इसी कारण मैंने तुम्हें ये बातें दिखाई हैं, क्योंकि परमप्रधान के यहाँ प्रतिफल है। तीन और दिन बाद मैं तुमसे और बातें कहूँगा और तुम्हें महत्त्वपूर्ण और अद्भुत बातें समझाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: इसी कारण
  rationale: कारणसूचक लैटिन पद का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: merces
  choice: प्रतिफल
  rationale: यह ‘मजदूरी’ या ‘इनाम’ दोनों का भाव रख सकता है; यहाँ धार्मिक-साहित्यिक प्रसंग में ‘प्रतिफल’ अर्थ की व्यापकता और गरिमा बनाए रखता है।
- source_word: apud Altissimum
  choice: परमप्रधान के यहाँ
  rationale: apud के निकटता/अधिकार में होने के भाव को बिना यह तय किए सुरक्षित रखता है कि प्रतिफल किसे मिलेगा।
- source_word: post alios tres dies
  choice: तीन दिन और बीतने के बाद
  rationale: alios के ‘और/अतिरिक्त’ भाव तथा post की कालगत दिशा को सहज हिन्दी में व्यक्त करता है।
- source_word: alia loquar
  choice: दूसरी बातें कहूँगा
  rationale: alia की अनिर्दिष्ट बहुवचन व्यापकता को बनाए रखता है; इसे ‘और अधिक’ में बदलकर अर्थ सीमित नहीं किया गया।
- source_word: gravia et mirabilia
  choice: गंभीर और अद्भुत बातें
  rationale: gravia का शाब्दिक ‘भारी’ हिन्दी में अस्वाभाविक होता; ‘गंभीर’ महत्त्वपूर्ण/गहन विषयों का भाव देता है, जबकि mirabilia को ‘अद्भुत’ रखा गया है।
- source_word: exponam
  choice: समझाऊँगा
  rationale: विस्तार से खोलकर बताने या व्याख्या करने का भाव सामान्य आधुनिक हिन्दी में सहज रूप से देता है।
theological_decisions:
- issue: ‘परमप्रधान के यहाँ प्रतिफल है’ का आशय
  choice: लाभार्थी या प्रतिफल की प्रकृति को अनिर्दिष्ट रखा गया
  alternative: ‘परमप्रधान तुम्हें प्रतिफल देगा’
  rationale: लैटिन पाठ केवल merces apud Altissimum कहता है; उसमें ‘तुम्हें’ और प्रत्यक्ष दाता-क्रिया नहीं है। इसलिए अनुवाद मूल की अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथन। पद के भविष्यकालीन वचन और प्रत्यक्ष संबोधन को बनाए रखा गया है; कोई पादटिप्पणी आवश्यक नहीं।
