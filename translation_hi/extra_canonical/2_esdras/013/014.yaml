  text: tu ab initio demonstrasti servo tuo mirabilia haec et dignum me habuisti, ut susciperes deprecationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/014.yaml
  text: From the beginning you have shown these wonders to your servant[a], and you have counted me worthy to receive my supplication.
translation:
  language: hi
  text: तूने आरम्भ से ही अपने सेवक को ये अद्भुत बातें दिखाई हैं और मुझे इस योग्य समझा है कि तू मेरी विनती स्वीकार करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab initio
  choice: आरम्भ से ही
  rationale: कालगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘ही’ आरम्भ से चली आ रही कृपा पर उचित बल देता है।
- source_word: mirabilia haec
  choice: ये अद्भुत बातें
  rationale: संदर्भ में दिखाई गई असाधारण दर्शन-संबंधी बातों को समेटता है; केवल ‘चमत्कार’ कहना अर्थ को अनावश्यक रूप से संकुचित कर सकता है।
- source_word: servo tuo
  choice: अपने सेवक को
  rationale: दातृकारक servo तथा संबंधवाचक tuo का सीधा और प्रतिष्ठित हिन्दी रूप।
- source_word: dignum me habuisti
  choice: मुझे इस योग्य समझा है
  rationale: लैटिन मुहावरे का स्वाभाविक अर्थ ‘योग्य ठहराना/समझना’ है; यहाँ सहज हिन्दी के लिए ‘समझा’ चुना गया।
- source_word: susciperes
  choice: तू ... स्वीकार करे
  rationale: susciperes का कर्ता संबोधित परमेश्वर है; इसलिए अस्पष्ट अंग्रेज़ी infinitive के बजाय लैटिन वाक्य-संबंध स्पष्ट रखा गया है।
- source_word: deprecationem meam
  choice: मेरी विनती
  rationale: deprecatio की गंभीर प्रार्थनापूर्ण याचना को साधारण पाठक के लिए स्वाभाविक हिन्दी में व्यक्त करता है और निकटवर्ती क्रियात्मक प्रयोग से अर्थगत संबंध बनाए रखता है।
theological_decisions:
- issue: विनती को कौन स्वीकार करता है
  choice: 'परमेश्वर कर्ता है: ‘कि तू मेरी विनती स्वीकार करे’'
  alternative: ‘मेरी विनती स्वीकार करने के योग्य’—जिससे व्याकरणतः एज्रा स्वयं स्वीकार करने वाला समझा जा सकता है
  rationale: लैटिन susciperes द्वितीय पुरुष एकवचन है और सीधे संबोधित परमेश्वर को कर्ता बनाता है; इस संबंध को हिन्दी में सुरक्षित रखना आवश्यक है।
- issue: दिव्य संबोधन का सर्वनाम
  choice: तू/तूने
  alternative: आप/आपने
  rationale: बाइबलीय प्रार्थना की निकटता और मूल के एकवचन संबोधन को बनाए रखते हुए आधुनिक, गरिमामय हिन्दी परंपरा के अनुरूप ‘तू’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण, गरिमामय और सहज शैली। स्रोत में कोई ऐसी वास्तविक पाठगत अस्पष्टता नहीं है जिसके लिए पादटिप्पणी आवश्यक हो; अंग्रेज़ी पादटिप्पणी वस्तुतः मुख्य पाठ के उसी अर्थ का वैकल्पिक वाक्य-विन्यास है।
