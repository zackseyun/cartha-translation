  text: इसके बाद मैंने देखा, और देखो, वे सब जो उस पर आक्रमण करने के लिए उसके विरुद्ध इकट्ठे हुए थे, बहुत भयभीत थे; फिर भी वे लड़ने का साहस कर रहे थे।
