  yaml_path: translation/extra_canonical/2_esdras/013/020.yaml
  text: Yet it is easier for one in danger to come into these things than to pass through the age like a cloud and not see what happened in the last days.” And he answered me and said:[a]
translation:
  language: hi
  text: फिर भी, संकट में पड़े व्यक्ति के लिए इन बातों तक पहुँचना अधिक सहज है, बजाय इसके कि वह बादल के समान इस युग से गुज़र जाए और अन्तिम समय में जो घटा उसे न देखे।” तब उसने मुझे उत्तर देकर कहा:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर भी, संकट में पड़े व्यक्ति के लिए इन बातों तक पहुँचना अधिक सहज है, बजाय इसके कि वह बादल के समान संसार से चला जाए और अन्त में जो घटा उसे न देखे।”
    reason: लैटिन a saeculo को ‘युग से/के माध्यम से’ अथवा ‘संसार से’ के अर्थ में समझा जा सकता है; in novissimo का अर्थ ‘अन्त में’ भी लिया जा सकता है।
lexical_decisions:
- source_word: attamen
  choice: फिर भी
  rationale: पूर्ववर्ती कथन के साथ विरोध अथवा रियायत का स्वाभाविक हिन्दी संबंध व्यक्त करता है।
- source_word: periclitantem
  choice: संकट में पड़े व्यक्ति
  rationale: लैटिन कृदन्त का अर्थ खतरे या जोखिम में पड़े व्यक्ति से है; इसे केवल सामान्य ‘पीड़ित’ तक सीमित नहीं किया गया।
- source_word: venire in haec
  choice: इन घटनाओं में आ पड़ना
  rationale: शाब्दिक ‘इनमें आना’ को सहज हिन्दी में रखते हुए आगामी घटनाओं का सामना करने का भाव व्यक्त किया गया है।
- source_word: pertransire sicut nubem a saeculo
  choice: बादल के समान इस युग से गुज़र जाए
  rationale: पाठ की कठिन और सम्भवतः बहुअर्थी रचना को जानबूझकर पूर्णतः स्पष्ट नहीं किया गया; saeculum का मूल ‘युग’ रखा और बादल की उपमा सुरक्षित रखी गई।
- source_word: in novissimo
  choice: अन्तिम समय में
  rationale: एकवचन लैटिन पद अन्त या अंतिम काल का संकेत देता है; ‘अन्तिम दिनों’ की अपेक्षा यह रूप मूल की संख्या और अस्पष्टता बेहतर बचाता है।
- source_word: Et respondit ad me et dixit
  choice: तब उसने मुझे उत्तर दिया
  rationale: हिन्दी में ‘उत्तर दिया और कहा’ अनावश्यक पुनरुक्ति लगती है; ‘उत्तर दिया’ संवाद-भूमिका को स्वाभाविक रूप से पूरा करता है।
theological_decisions:
- issue: a saeculo का अर्थ
  choice: इस युग से गुज़र जाए
  alternative: संसार से चला जाए / जीवन से गुज़र जाए
  rationale: लैटिन वाक्यरचना मृत्यु द्वारा संसार से प्रस्थान अथवा युग से होकर गुजरने—दोनों की ओर पढ़ी जा सकती है। मुख्य पाठ में संशोधित अंग्रेज़ी परत और saeculum का सीधा अर्थ रखा गया, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
- issue: in novissimo का कालगत संकेत
  choice: अन्तिम समय में
  alternative: अन्त में / अन्तिम दिनों में
  rationale: मूल पद का प्रलयकालीन संकेत सुरक्षित है, पर उसे किसी विशिष्ट धर्मशास्त्रीय समय-सारणी में नहीं बाँधा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। मूल की बादल-संबंधी असामान्य उपमा तथा कालगत अस्पष्टता को मिटाया नहीं गया।
