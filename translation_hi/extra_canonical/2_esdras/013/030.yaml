translation:
  language: hi
  text: परमप्रधान पृथ्वी पर रहने वालों को छुड़ाना आरम्भ करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: incipiet
  choice: आरम्भ करेगा
  rationale: लातीनी क्रिया के भविष्यकाल और कार्य के आरम्भ—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य है।
- source_word: liberare
  choice: छुड़ाना
  rationale: मुक्ति या बचाव के व्यापक अर्थ को बनाए रखता है, बिना यह तय किए कि छुटकारा किस विशेष प्रकार का है।
- source_word: eos qui super terram sunt
  choice: पृथ्वी पर रहनेवालों को
  rationale: शाब्दिक अर्थ ‘जो पृथ्वी पर हैं’ को सहज आधुनिक हिन्दी में व्यक्त करता है और संदर्भित समूह की व्यापकता को बनाए रखता है।
- source_word: Et
  choice: तब
  rationale: स्रोत का अंतिम ‘Et’ अगले वाक्य से जुड़ा पाठांश प्रतीत होता है; पद को स्वतंत्र और स्वाभाविक हिन्दी वाक्य बनाने के लिए पूर्ववर्ती घटनाक्रम से संबंध सूचित करने वाला ‘तब’ रखा गया है।
theological_decisions:
- issue: छुटकारा पानेवाले समूह की पहचान
  choice: पृथ्वी पर रहनेवालों
  alternative: पृथ्वी पर रहनेवाले अपने लोगों
  rationale: लातीनी पाठ में स्वामित्वसूचक ‘अपने’ या किसी विशिष्ट धार्मिक समुदाय का उल्लेख नहीं है; इसलिए ऐसी पहचान नहीं जोड़ी गई।
- issue: liberare का आशय
  choice: छुड़ाना
  alternative: उद्धार करना
  rationale: ‘छुड़ाना’ स्रोत की अर्थगत व्यापकता और संभावित भौतिक/ऐतिहासिक मुक्ति को बनाए रखता है; ‘उद्धार करना’ अनावश्यक रूप से विशिष्ट धर्मवैज्ञानिक अर्थ ग्रहण कर सकता है।
translation_notes:
