  text: nation against nation[a], and kingdom against kingdom. And it shall be, when these things happen, and the signs occur that I showed you before, then
translation:
  language: hi
  text: और एक राष्ट्र दूसरे राष्ट्र के विरुद्ध और एक राज्य दूसरे राज्य के विरुद्ध होंगे। और ऐसा होगा कि जब ये बातें होंगी और वे चिन्ह घटित होंगे जो मैंने तुम्हें पहले दिखाए थे, तब—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gens ad gentem
  choice: जाति जाति के विरुद्ध
  rationale: लातीनी gens यहाँ व्यक्तियों की सामान्य भीड़ नहीं, बल्कि एक जातीय-राजनीतिक जनसमूह को दर्शाता है। यह प्रलय-संबंधी पारंपरिक पदबंध को बनाए रखता है और अगले वाक्यांश के समानांतर है।
- source_word: regnum aduersus regnum
  choice: राज्य राज्य के विरुद्ध
  rationale: regnum का सीधा और स्वाभाविक अर्थ ‘राज्य’ है; ‘के विरुद्ध’ विरोध और संघर्ष का संबंध स्पष्ट करता है।
- source_word: contingent signa
  choice: चिन्ह प्रकट होंगे
  rationale: contingere यहाँ घटनाओं/चिन्हों के घटित या सामने आने को व्यक्त करता है; हिन्दी में चिन्हों के लिए ‘प्रकट होंगे’ अधिक स्वाभाविक है।
- source_word: quae ante ostendi tibi
  choice: जो मैंने तुम्हें पहले दिखाए थे
  rationale: लातीनी शब्दक्रम और पूर्वकालिक संदर्भ को सहज आधुनिक हिन्दी में यथासंभव निकटता से रखा गया है।
- source_word: et tunc
  choice: तब—
  rationale: पद स्रोत में अधूरे संक्रमण पर समाप्त होता है; दीर्घ विराम-चिह्न इस अपूर्णता को बिना अर्थ पूरा किए सुरक्षित रखता है।
theological_decisions:
- issue: gens की व्याख्या
  choice: जाति
  alternative: लोग / राष्ट्र
  rationale: ‘जाति’ यहाँ जनसमूह या nation के अर्थ में प्रयुक्त है और प्रलय-संबंधी सूत्र की सामूहिक पहचान बनाए रखती है; टिप्पणी वैकल्पिक अर्थ स्पष्ट करती है। किसी विशेष आधुनिक राष्ट्र-राज्य या सामाजिक जाति-व्यवस्था का अर्थ आरोपित नहीं किया गया।
- issue: पद के अंत में et tunc की अपूर्णता
  choice: ‘तब—’ के साथ वाक्य खुला छोड़ा गया
  alternative: अगले पद का आशय जोड़कर वाक्य पूरा करना
  rationale: मूल पाठ स्वयं ‘और तब’ पर समाप्त होता है; इसे पूरा करना स्रोत से बाहर की सामग्री जोड़ना होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उठ खड़ा होगा’ संघर्ष के मुहावरे को स्वाभाविक बनाता है। समानांतर संरचना तथा अंत की जानबूझकर रखी गई अपूर्णता सुरक्षित हैं।
