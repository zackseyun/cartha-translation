    rationale: The source gives an elliptical “nation against nation, and kingdom against kingdom,” followed by “and it shall be.” A finite Hindi verb may be supplied for grammar, but “उठ खड़ा” adds the specific notion of rising up.
  - severity: low
    issue: The initial “et” and the following “Et erit” are not fully represented.
    rationale: Beginning with “और” and using “ऐसा होगा कि” preserves both source connectives and the transitional construction.
  - severity: low
    issue: “जाति” is potentially misleading in contemporary Hindi.
    rationale: Without a note, it commonly denotes caste; “राष्ट्र” better fits the political/ethnic collective meant by gens in this parallelism.
