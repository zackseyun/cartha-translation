source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et profectus sum et transii in campum, multum glorificans et laudans Altissimum de mirabilibus, quae per tempus faciebat,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/057.yaml
  text: And I departed and went into the field[a], greatly glorifying and praising the Most High for the wonders that he did in their times,
translation:
  language: hi
  text: और मैं वहाँ से निकलकर मैदान में गया, और परमप्रधान की बहुत महिमा और स्तुति करता रहा, उन अद्भुत कार्यों के कारण जो वह समय के साथ करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus sum et transii
  choice: मैं वहाँ से चलकर ... गया
  rationale: दोनों लैटिन क्रियाओं में प्रस्थान और आगे बढ़कर पहुँचने का भाव है; स्वाभाविक हिन्दी में इसे संयुक्त रूप से व्यक्त किया गया है।
- source_word: in campum
  choice: मैदान में
  rationale: campus का सामान्य अर्थ खुला मैदान है; प्रसंग में यही सीधा और सहज समतुल्य है।
- source_word: multum glorificans et laudans
  choice: बहुत महिमा और स्तुति करता रहा
  rationale: दोनों कृदंतों को अलग रखते हुए निरंतर साथ चल रही क्रिया का भाव व्यक्त किया गया है।
- source_word: Altissimum
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त पारंपरिक और अर्थ-सटीक हिन्दी उपाधि है।
- source_word: de mirabilibus
  choice: उन अद्भुत कामों के लिए
  rationale: यह केवल आश्चर्य की वस्तुओं नहीं, परमप्रधान के विस्मयकारी कार्यों को सूचित करता है; de को यहाँ स्तुति के कारण के रूप में लिया गया है।
- source_word: quae per tempus faciebat
  choice: जिन्हें वह समय-समय पर करता था
  rationale: per tempus का लैटिन प्रयोग कालक्रम में होते रहने वाले कार्यों का भाव दे सकता है; हिन्दी वाक्यांश इस पुनरावृत्त/कालगत अर्थ को स्वाभाविक रूप से रखता है, यद्यपि मूल पदबंध कुछ अस्पष्ट है।
theological_decisions:
- issue: अद्भुत कामों का कर्ता
  choice: ‘वह’ का संदर्भ परमप्रधान से रखा गया
  alternative: कर्ता को अस्पष्ट छोड़ना
  rationale: निकटतम एकवचन पुल्लिंग संदर्भ Altissimum है और faciebat उसी के कार्यों की ओर स्वाभाविक रूप से संकेत करता है।
- issue: per tempus का कालगत अर्थ
  choice: समय-समय पर
  alternative: अपने-अपने समय में
  rationale: लैटिन पदबंध संक्षिप्त और कुछ अस्पष्ट है। मुख्य पाठ में सहज पुनरावृत्त अर्थ रखा गया है; इसे किसी विशेष युग-सिद्धांत से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठक के लिए स्पष्ट, किंतु धर्मग्रंथ के अनुरूप गरिमापूर्ण शैली। लैटिन की सहभागी क्रियाओं को हिन्दी की स्वाभाविक सतत क्रिया में बदला गया है।
