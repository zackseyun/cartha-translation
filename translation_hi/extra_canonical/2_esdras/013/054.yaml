  yaml_path: translation/extra_canonical/2_esdras/013/054.yaml
  text: For you have forsaken what belongs to you and have devoted yourself to what belongs to me, and have searched out my law.
translation:
  language: hi
  text: क्योंकि तुमने अपनी बातों को छोड़ दिया, मेरे विषयों में अपने को लगाया, और मेरी व्यवस्था की खोज-बीन की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquisti enim tua
  choice: क्योंकि तुमने अपनी चीज़ों को छोड़ दिया
  rationale: ‘tua’ का व्यापक और जानबूझकर अनिर्दिष्ट अर्थ बनाए रखा गया है; इसे ‘अपना काम’ या ‘अपनी संपत्ति’ कहकर सीमित नहीं किया गया।
- source_word: circa mea vacasti
  choice: मेरी चीज़ों में लगे रहे
  rationale: ‘vacasti circa’ यहाँ किसी विषय के लिए समय निकालकर उसमें समर्पित रूप से लगे रहने का भाव देता है। ‘mea’ की व्यापकता को ‘मेरी चीज़ों’ से सुरक्षित रखा गया है।
- source_word: legem meam exquisisti
  choice: मेरी व्यवस्था को खोजा
  rationale: ‘exquisisti’ के प्रयत्नपूर्वक खोजने/जाँचने के भाव को ‘खोजा’ से व्यक्त किया गया है, जबकि ‘legem’ के लिए बाइबिलीय और स्वाभाविक पद ‘व्यवस्था’ रखा गया है।
theological_decisions:
- issue: ‘मेरी चीज़ों’ और ‘मेरी व्यवस्था’ के बीच संबंध
  choice: दोनों पदों को अलग रखते हुए कोई व्याख्यात्मक समानता नहीं जोड़ी गई।
  alternative: ‘मेरी बातों में लगे रहे, अर्थात मेरी व्यवस्था का अध्ययन किया’
  rationale: लातीनी पाठ तीन समानांतर क्रियाएँ देता है और यह स्पष्ट नहीं करता कि ‘mea’ केवल व्यवस्था को ही दर्शाता है; इसलिए इस तनाव और व्यापकता को बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘चीज़ों’ बोलचाल में सहज है और मूल के अनिर्दिष्ट tua/mea को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
