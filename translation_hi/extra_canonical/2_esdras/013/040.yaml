source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: terra sua in diebus Iosiae regis, quem captiuum duxit Salmanassar rex Assyriorum, et transtulit eos trans flumen, et translati sunt in terram aliam. Ipsi autem sibi dederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/040.yaml
  text: these are the ten tribes that were led away captive from their own land in the days of King Hoshea[40], whom Shalmaneser king of the Assyrians led away captive; and he carried them across the River[a], and they were taken into another land.
translation:
  language: hi
  text: ये वे दस गोत्र हैं जिन्हें राजा होशे के दिनों में उनके अपने देश से बंदी बनाकर ले जाया गया था।[a] अश्शूर का राजा शल्मनेसेर उन्हें बंदी बनाकर नदी के पार ले गया, और वे दूसरे देश में ले जाए गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी पाठ में यहाँ “राजा योशियाह के दिनों में” है। पर असीरियाई निर्वासन के इस प्रसंग में सीरियाई, इथियोपियाई और अरबी प्राचीन अनुवाद “होशे” का समर्थन करते हैं; इसलिए मुख्य पाठ में होशे रखा गया है।
    reason: textual_variant
  - marker: b
    text: संभवतः फरात नदी; मूल पाठ केवल “नदी” कहता है।
    reason: ambiguity
lexical_decisions:
- source_word: terra sua
  choice: उनके अपने देश से
  rationale: लातीनी पदबंध का स्वाभाविक हिन्दी रूप; इससे अपने वतन से निर्वासन का भाव बना रहता है।
- source_word: captiuum duxit
  choice: बंदी बनाकर ले जाया गया / बंदी बनाकर ... ले गया
  rationale: लातीनी मुहावरे में पकड़कर निर्वासन में ले जाने का भाव है; दोनों प्रसंगों में हिन्दी वाक्य-विन्यास के अनुसार कर्तृवाच्य और कर्मवाच्य रूप रखे गए हैं।
- source_word: Salmanassar rex Assyriorum
  choice: अश्शूर का राजा शल्मनेसेर
  rationale: ऐतिहासिक नाम और राजकीय पदवी को आधुनिक हिन्दी बाइबलीय शैली में स्पष्ट रखा गया है।
- source_word: trans flumen
  choice: नदी के पार
  rationale: मूल में नदी का नाम नहीं दिया गया है, इसलिए मुख्य पाठ में ‘फरात’ जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: in terram aliam
  choice: दूसरे देश में
  rationale: ‘अन्य भूमि’ की अपेक्षा सहज आधुनिक हिन्दी, जबकि भौगोलिक अनिश्चितता सुरक्षित रहती है।
theological_decisions:
- issue: राजा के नाम का पाठांतर और ऐतिहासिक संदर्भ
  choice: मुख्य पाठ में ‘होशे’
  alternative: लातीनी पांडुलिपि का ‘योशियाह’
  rationale: उपलब्ध लातीनी पाठ में Iosiae है, पर असीरियाई निर्वासन के ऐतिहासिक संदर्भ तथा सीरियाई, इथियोपियाई और अरबी प्राचीन अनुवादों का ‘होशे’ लेखक के मूल पाठ की ओर संकेत करता है। पाठांतर को छिपाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- issue: ‘नदी’ की पहचान
  choice: मुख्य पाठ में केवल ‘नदी’
  alternative: ‘फरात नदी’
  rationale: प्रसंग से फरात की संभावना है, किंतु लातीनी मूल केवल flumen कहता है; इसलिए निश्चित पहचान पाठ में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गोत्र’, ‘बंदी’ और ‘अश्शूर’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। वाक्य को हिन्दी में स्वाभाविक बनाने के लिए लातीनी संरचना का यांत्रिक अनुकरण नहीं किया गया, पर उसकी ऐतिहासिक और पाठगत अनिश्चितताएँ पादटिप्पणियों में सुरक्षित हैं।
