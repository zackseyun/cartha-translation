  text: For then the Most High performed signs, and held back the channels of the river until they had crossed.
translation:
  language: hi
  text: तब परमप्रधान ने चिह्न दिखाए और नदी की धाराओं को तब तक रोके रखा, जब तक वे पार न हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त लैटिन उपाधि का स्वाभाविक और अर्थ-सटीक हिन्दी रूप है।
- source_word: signa
  choice: चिह्न
  rationale: ‘चिह्न’ अलौकिक कार्यों की संकेतात्मक प्रकृति को बनाए रखता है; केवल ‘चमत्कार’ कहने से अर्थ कुछ अधिक व्याख्यात्मक हो जाता।
- source_word: statuit
  choice: रोके रखा
  rationale: संदर्भ में नदी की धाराओं को पार होने तक थामे रखने का भाव है; यह शाब्दिक ‘स्थिर किया’ से अधिक स्वाभाविक हिन्दी है।
- source_word: uenas fluminis
  choice: नदी की धाराओं
  rationale: लैटिन में शाब्दिक रूप से नदी की ‘नसें/जल-शाखाएँ’ हैं; हिन्दी में ‘धाराएँ’ जल-प्रवाह के आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: usquequo transirent
  choice: जब तक वे पार न हो गए
  rationale: यह कालगत सीमा और बहुवचन कर्ता को सुरक्षित रखता है; कर्ता पूर्ववर्ती संदर्भ से समझा जाता है।
