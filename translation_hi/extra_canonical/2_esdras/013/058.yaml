source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quoniam gubernat tempora et quae sunt in temporibus inlata. et sedi ibi tribus diebus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/058.yaml
  text: and because he governs the times and the things that are brought about in the times[a]. And I sat there for three days.
translation:
  language: hi
  text: और क्योंकि वह समयों को और उनमें घटित होती बातों को संचालित करता है।[a] और मैं वहाँ तीन दिन बैठा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक रूप से: ‘और मैं वहाँ से निकलकर मैदान में गया, परमप्रधान की बहुत महिमा और स्तुति करता हुआ, उन अद्भुत कामों के कारण जो उसने उनके समयों में किए, और क्योंकि वह समयों को और समयों में घटित होती बातों को संचालित करता है। और मैं वहाँ तीन दिन बैठा रहा।’'
    reason: पूर्व प्रस्तुति में पिछले पद की सामग्री इस पद में सम्मिलित हो गई थी; यह टिप्पणी उस पूर्व/वैकल्पिक विस्तृत प्रस्तुति को दर्ज करती है, पर मुख्य पाठ में उसे नहीं दोहराती।
lexical_decisions:
- source_word: gubernat
  choice: संचालित करता है
  rationale: यह ‘शासन/दिशा देने’ के अर्थ को व्यक्त करता है और समय तथा घटनाओं—दोनों के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: tempora
  choice: समयों
  rationale: लैटिन में बहुवचन है; इसलिए विभिन्न कालों या निर्धारित अवधियों का संकेत बनाए रखने के लिए हिन्दी में भी बहुवचन रखा गया है।
- source_word: quae sunt in temporibus inlata
  choice: समयों में घटित होने वाली बातों
  rationale: यह हिन्दी में स्वाभाविक ढंग से उन बातों या घटनाओं को व्यक्त करता है जो विभिन्न समयों के भीतर सामने आती हैं; लैटिन inlata के भाव को अत्यधिक शाब्दिक और अस्वाभाविक ‘लाई गई’ से नहीं बाँधा गया।
- source_word: sedi
  choice: बैठा रहा
  rationale: तीन दिनों तक जारी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: समयों और उनमें होने वाली घटनाओं पर परमेश्वर का शासन
  choice: ‘वह ... संचालित करता है’
  alternative: ‘वह ... नियंत्रित करता है’
  rationale: ‘संचालित’ शासन और व्यवस्था के भाव को रखता है, जबकि ‘नियंत्रित’ अपेक्षाकृत कठोर और पूर्ण नियतिवाद का अनावश्यक संकेत दे सकता है।
- issue: वाक्य का आरम्भ ‘और क्योंकि’ से होना
  choice: खंडित/पूर्ववर्ती वाक्य से जुड़ा रूप बनाए रखा गया
  alternative: इसे स्वतंत्र वाक्य बनाना
  rationale: लैटिन et quoniam स्पष्टतः पिछले कथन से जुड़ता है; पद-सीमा के कारण उत्पन्न तनाव को चुपचाप दूर नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘समयों’ कुछ असामान्य होते हुए भी स्रोत के बहुवचन और काल-व्यवस्था के भाव को सुरक्षित रखता है।
