  yaml_path: translation/extra_canonical/2_esdras/013/018.yaml
  text: understanding what is stored up in the last days and not encountering them[a]. But also those who are left behind
translation:
  language: hi
  text: जो उन बातों को समझते हैं जो अन्तिम दिनों में संचित रखी गई हैं, पर उनका सामना नहीं करते[a]। पर वे भी जो छोड़ दिए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन तक नहीं पहुँचते।”
    reason: लैटिन occurrentes का अर्थ यहाँ ‘सामना करना’ हो सकता है, पर संदर्भ में ‘पहुँचना’ या ‘प्राप्त करना’ भी सम्भव है।
lexical_decisions:
- source_word: intellegentes
  choice: जो यह समझते हैं
  rationale: लैटिन का वर्तमान कृदन्त बहुवचन है; हिन्दी में सम्बन्धवाचक उपवाक्य इसे स्वाभाविक ढंग से व्यक्त करता है और आगे के खंडित संदर्भ से जुड़ने की गुंजाइश बनाए रखता है।
- source_word: quae sunt reposita
  choice: क्या-क्या संचित रखा है
  rationale: नपुंसकलिंग बहुवचन quae को अनिर्दिष्ट वस्तुओं के रूप में ‘क्या-क्या’ और reposita के सुरक्षित रखे या जमा किए जाने के भाव को ‘संचित रखा’ से व्यक्त किया गया है।
- source_word: in novissimis diebus
  choice: अन्तिम दिनों में
  rationale: काल-सूचक लैटिन पदबंध का सीधा और पारंपरिक अर्थ रखा गया है; इसे बिना आधार ‘अन्तिम दिनों के लिए’ नहीं बनाया गया।
- source_word: non occurrentes eis
  choice: पर उनका सामना नहीं करते
  rationale: occurrentes का मूल भाव सामने आने या सामना होने/करने का है और eis बहुवचन होकर संचित रखी बातों की ओर लौटता है। ‘पर’ हिन्दी में विरोधी संबंध स्पष्ट करता है।
- source_word: qui derelicti sunt
  choice: जो पीछे छोड़ दिए गए हैं
  rationale: derelicti sunt के पूर्ण कर्मवाच्य और ‘छूटे/पीछे रह गए’ अर्थ को सुरक्षित रखा गया है; कर्ता को पाठ से बाहर मानकर नहीं जोड़ा गया।
theological_decisions:
- issue: अन्तिम दिनों में संचित बातों का स्वरूप
  choice: ‘क्या-क्या’ कहकर उन्हें अनिर्दिष्ट रखा गया
  alternative: उन्हें दण्ड, विपत्तियाँ या आशीषें कहना
  rationale: लैटिन पाठ केवल quae कहता है और उन बातों की प्रकृति इस पद में निर्धारित नहीं करता।
- issue: occurrentes का अर्थ
  choice: ‘सामना नहीं करते’ मुख्य पाठ में
  alternative: ‘उन तक नहीं पहुँचते’
  rationale: मुख्य पाठ लैटिन occurrere के निकट अर्थ को रखता है, जबकि संदर्भ और प्राचीन अनुवाद-परंपरा के आधार पर ‘पहुँचना/प्राप्त करना’ सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल पद एक बड़े वाक्य का खंड प्रतीत होता है; इसलिए अनावश्यक कर्ता या व्याख्यात्मक सामग्री जोड़कर उसकी अपूर्णता को नहीं छिपाया गया।
