  yaml_path: translation/extra_canonical/2_esdras/013/047.yaml
  text: Again the Most High will hold back the channels of the river, so that they may cross. Therefore you saw the multitude gathered in peace.
translation:
  language: hi
  text: इसी कारण तुमने उस जनसमूह को शांति से इकट्ठा हुआ देखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए लैटिन स्रोतांश में केवल यही पूर्ण वाक्य प्रमाणित है। अंग्रेज़ी परामर्श-पाठ में इससे पहले नदी की धाराओं को रोकने का वाक्य भी है, पर वह उपलब्ध लैटिन अंश में नहीं मिलता। इसके बाद के शब्द “Sed et qui” अधूरे हैं और अगले कथन की शुरुआत प्रतीत होते हैं।
    reason: उपलब्ध मूल-पाठ और अंग्रेज़ी परामर्श-पाठ के बीच की सीमा तथा सामग्री का अंतर पारदर्शी बनाना।
lexical_decisions:
- source_word: propter hoc
  choice: इसी कारण
  rationale: यह वाक्यांश पिछले कथन के परिणाम की ओर संकेत करता है; ‘इसी कारण’ उस संबंध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: multitudinem collectam
  choice: उस जनसमूह को ... इकट्ठा
  rationale: multitudo के लिए ‘जनसमूह’ और collectam के लिए ‘इकट्ठा’ मूल अर्थ को स्पष्ट और सहज रूप में व्यक्त करते हैं।
- source_word: cum pace
  choice: शांति के साथ
  rationale: यह रूप लैटिन की व्यापकता बनाए रखता है; इसका आशय शांतिपूर्वक एकत्र होना या शांति की दशा में होना—दोनों हो सकता है।
theological_decisions:
- issue: अंग्रेज़ी परामर्श-पाठ में नदी की धाराओं को रोकने वाला वाक्य है, पर दिए गए लैटिन स्रोतांश में वह उपलब्ध नहीं है।
  choice: केवल दिए गए लैटिन में प्रमाणित पूर्ण वाक्य का अनुवाद किया गया।
  alternative: अंग्रेज़ी परामर्श-पाठ के आधार पर नदी वाला वाक्य भी जोड़ना।
  rationale: मूल-भाषा के उपलब्ध साक्ष्य को प्राथमिकता देना और अप्रमाणित सामग्री को चुपचाप मूल पाठ में न जोड़ना आवश्यक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘शांति के साथ’ को जानबूझकर कुछ व्यापक रखा गया है ताकि मूल की अर्थगत संभावना सीमित न हो।
