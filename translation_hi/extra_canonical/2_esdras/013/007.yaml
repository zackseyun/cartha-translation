source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ego autem quaesivi videre regionem vel locum, unde sculptus esset mons, et non potui.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/007.yaml
  text: But I sought to see the region or place from which the mountain had been carved, and I could not.
translation:
  language: hi
  text: पर मैंने उस क्षेत्र या स्थान को देखने का प्रयास किया, जहाँ से वह पहाड़ तराशा गया था, पर मैं नहीं देख सका।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaesivi videre
  choice: देखने का प्रयास किया
  rationale: लैटिन में देखने की खोज या चेष्टा का भाव है; यह आधुनिक हिन्दी में स्वाभाविक रूप से उस प्रयत्न को व्यक्त करता है।
- source_word: regionem vel locum
  choice: उस क्षेत्र या स्थान
  rationale: दोनों लैटिन संज्ञाओं और उनके बीच के वास्तविक विकल्प ‘या’ को बनाए रखा गया है।
- source_word: unde
  choice: जहाँ से
  rationale: पहाड़ की उत्पत्ति अथवा स्रोत-स्थान के संबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: sculptus esset mons
  choice: वह पहाड़ तराशा गया था
  rationale: sculptus के काटकर अथवा गढ़कर आकार दिए जाने के भाव के लिए ‘तराशा’ उपयुक्त है; कर्मवाच्य और पूर्वकालिकता भी सुरक्षित हैं।
- source_word: non potui
  choice: मैं नहीं देख सका
  rationale: केवल ‘मैं नहीं कर सका’ कहने की अपेक्षा हिन्दी में पहले आए ‘देखने’ को दोहराना स्पष्ट और स्वाभाविक है, जबकि असमर्थता का अर्थ बना रहता है।
theological_decisions:
- issue: पहाड़ के स्रोत का वर्णन
  choice: ‘जहाँ से वह पहाड़ तराशा गया था’
  alternative: ‘जिसमें से वह पहाड़ काटकर निकाला गया था’
  rationale: लैटिन unde स्रोत या उद्गम-स्थान बताता है, पर यह स्पष्ट नहीं करता कि पहाड़ किसी पदार्थ में से काटकर निकाला गया था। चुना हुआ पाठ इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘पर’ से दोनों समन्वित विरोधी खंड स्वाभाविक रूप से जुड़े हैं; कोई पादटिप्पणी आवश्यक नहीं है।
