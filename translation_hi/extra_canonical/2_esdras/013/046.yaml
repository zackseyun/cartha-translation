  text: 'usque in nouissimo tempore: et nunc iterum coeperunt uenire; Iterum altissimus statuit uenas fluminis, ut possint transire.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/046.yaml
  text: Then they lived there until the last time[46]; and now they have begun to come again; again the Most High has stopped up the channels of the river[a], so that they can cross.
translation:
  language: hi
  text: वे अन्त के समय तक वहीं रहे; और अब वे फिर आने लगे हैं। फिर परमप्रधान ने नदी की धाराओं को रोक दिया है, ताकि वे पार जा सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: usque in nouissimo tempore
  choice: अन्त के समय तक
  rationale: एकवचन लैटिन पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है और प्रसंग की अन्तकालिक छाया बनाए रखता है; ‘पिछली बार’ जैसा भ्रामक अर्थ नहीं देता।
- source_word: coeperunt uenire
  choice: आने लगे हैं
  rationale: लैटिन पूर्णकाल coeperunt के आरम्भ होकर वर्तमान तक प्रासंगिक रहने वाले भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त लैटिन सर्वोच्चता-सूचक उपाधि का प्रचलित और गरिमापूर्ण हिन्दी रूप।
- source_word: statuit uenas fluminis
  choice: नदी की धाराओं को रोक दिया है
  rationale: venas का मूल बिम्ब ‘नसें/शिराएँ’ है, पर नदी के सन्दर्भ में ‘धाराएँ’ स्वाभाविक है; statuit यहाँ पारगमन सम्भव करने के लिए प्रवाह रोकने के अर्थ में समझा गया है।
- source_word: ut possint transire
  choice: ताकि वे पार जा सकें
  rationale: उद्देश्यवाचक ut और सम्भावना-सूचक possint दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: nouissimo tempore का अन्तकालिक अर्थ
  choice: अन्त के समय
  alternative: अन्तिम समय
  rationale: दोनों सम्भव हैं; ‘अन्त के समय’ आधुनिक हिन्दी में अधिक सहज है और मूल के एकवचन तथा अन्तकालिक तनाव को बनाए रखता है।
- issue: statuit का सन्दर्भगत अर्थ
  choice: रोक दिया है
  alternative: ठहरा दिया है
  rationale: नदी पार करने योग्य बनाने के सन्दर्भ में प्रवाह रोकना अभिप्रेत प्रतीत होता है; ‘ठहरा दिया’ अधिक शाब्दिक होते हुए कम स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल लैटिन में कोई स्थाननाम या पादटिप्पणी-सूचक नहीं है, इसलिए अंग्रेज़ी परत की असंगत [46] पादटिप्पणी नहीं जोड़ी गई।
