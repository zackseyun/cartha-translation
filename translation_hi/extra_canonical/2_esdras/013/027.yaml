  choice: मुख्य पाठ में ‘साँस’
  alternative: ‘आत्मा’
  rationale: मुख से निकलने और आग व आँधी के साथ आने के कारण ‘साँस’ प्रसंगानुकूल है, पर शब्दगत धार्मिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ut की व्याख्या
  choice: ‘जैसी चीज़ें’ द्वारा उपमा व्यक्त की
  alternative: उपमा को छोड़कर सीधे ‘साँस, आग और आँधी’
  rationale: लैटिन पाठ के ut को बनाए रखना दर्शनीय प्रतीक और वस्तुगत पहचान के बीच की अस्पष्टता की रक्षा करता है।
