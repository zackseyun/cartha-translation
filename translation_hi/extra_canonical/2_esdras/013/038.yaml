  yaml_path: translation/extra_canonical/2_esdras/013/038.yaml
  text: with which they are about to be tormented, which are likened to a flame; and he will destroy them without effort, and the law, which is likened to fire.
translation:
  language: hi
  text: जिनसे वे यातना सहने लगेंगे—जो ज्वालाओं के समान हैं—और वह बिना किसी प्रयास के उन्हें और उस व्यवस्था को नष्ट कर देगा, जो आग के समान है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: incipient cruciari
  choice: उन्हें यातना मिलनी शुरू होगी
  rationale: लातीनी भावी काल और आरंभसूचक क्रिया दोनों को स्पष्ट रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: adsimilatae sunt flammae
  choice: ज्वालाओं के समान बताया गया है
  rationale: तुलना का भाव सुरक्षित रखा गया है; बहुवचन flammae के लिए ‘ज्वालाओं’ का प्रयोग किया गया है।
- source_word: sine labore
  choice: बिना परिश्रम किए
  rationale: शाब्दिक अर्थ ‘बिना श्रम/प्रयास’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: legem quae igni adsimilata est
  choice: उस व्यवस्था को … जिसे आग के समान बताया गया है
  rationale: legem को धार्मिक-साहित्यिक संदर्भ में ‘व्यवस्था’ और igni को एकवचन ‘आग’ के रूप में रखा गया है।
theological_decisions:
- issue: क्या ‘व्यवस्था’ विनाश का साधन है या perdet का दूसरा कर्म?
  choice: ‘उन्हें और उस व्यवस्था को नष्ट कर देगा’—व्यवस्था को दूसरा प्रत्यक्ष कर्म माना गया है।
  alternative: ‘उस व्यवस्था के द्वारा उन्हें नष्ट कर देगा’—व्यवस्था को साधन मानना।
  rationale: उपलब्ध लातीनी पाठ में et legem कर्मकारक है और eos के साथ समन्वित है; इसलिए असामान्य धार्मिक तनाव को व्याख्यात्मक रूप से बदलकर साधन नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। आरंभ का संबंधवाचक ‘जिनसे’ इस पद के पूर्ववर्ती वाक्य पर निर्भर खंड होने को बनाए रखता है। डैश Quae-वाले व्याख्यात्मक खंड की सीमा स्पष्ट करते हैं, पर लातीनी समन्वय को नहीं बदलते।
