review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the coordinated direct objects in “he will destroy them ... and the law,” rather than turning “the law” into an instrument. It also retains the flame/fire comparisons and the future-inceptive sense of incipient cruciari. A small revision more directly represents the passive sense as ‘they will begin to suffer torment’ and avoids the somewhat indirect added wording ‘बताया गया है.’
  naturalness: ‘उन्हें यातना मिलनी शुरू होगी’ is understandable but less idiomatic and less direct than ‘वे यातना सहने लगेंगे.’ Rendering the relative comparison as ‘जो ज्वालाओं के समान हैं’ is natural modern Hindi and maintains the syntactic link to the preceding relative phrase.
  terminology: ‘व्यवस्था’ is an appropriate established Hindi rendering for legem in this scriptural register. ‘ज्वालाओं’ preserves the plural flammae, while ‘आग’ preserves the singular igni.
  issues:
  - severity: low
    issue: The expression ‘उन्हें यातना मिलनी शुरू होगी’ is stylistically awkward.
    rationale: The Latin incipient cruciari means that they are about to begin being tormented. ‘वे यातना सहने लगेंगे’ expresses this naturally without weakening the inceptive future sense.
  - severity: low
    issue: ‘बताया गया है’ slightly paraphrases the comparative participles.
    rationale: The Latin says the referents are likened/compared to flame(s). Hindi ‘जो ... के समान हैं’ conveys the comparison more directly and smoothly.
  revised_text: जिनसे वे यातना सहने लगेंगे—जो ज्वालाओं के समान हैं—और वह बिना किसी प्रयास के उन्हें और उस व्यवस्था को नष्ट कर देगा, जो आग के समान है।
  revised_footnotes: []
  revision_rationale: The revision retains the source’s deliberately dependent opening, both comparison clauses, the plural/singular contrast between ‘ज्वालाओं’ and ‘आग,’ and the grammatically coordinated objects ‘उन्हें और उस व्यवस्था को.’ It improves idiomatic Hindi and source-near syntax without resolving or altering the passage’s difficult assertion that the law itself is also destroyed.
