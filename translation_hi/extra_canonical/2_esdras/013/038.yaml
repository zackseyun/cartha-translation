revisions:
- from: जिनसे उन्हें यातना मिलनी शुरू होगी—उन्हें ज्वालाओं के समान बताया गया है—और वह बिना परिश्रम किए उन्हें और उस व्यवस्था को नष्ट कर देगा, जिसे आग के समान बताया गया है।
  to: जिनसे वे यातना सहने लगेंगे—जो ज्वालाओं के समान हैं—और वह बिना किसी प्रयास के उन्हें और उस व्यवस्था को नष्ट कर देगा, जो आग के समान है।
  rationale: The revision retains the source’s deliberately dependent opening, both comparison clauses, the plural/singular contrast between ‘ज्वालाओं’ and ‘आग,’ and the grammatically coordinated objects ‘उन्हें और उस व्यवस्था को.’ It improves idiomatic Hindi and source-near syntax without resolving or altering the passage’s difficult assertion that the law itself is also destroyed.
