reference: 2 Esdras 13:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: reuelabitur filius meus quem uidisti uirum ascendentem. Et erit, quando audierint omnes gentes uocem eius, et derelinquet unusquisque regionem suam et bellum quod habent in alterutro,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/033.yaml
  text: my Son will be revealed, whom you saw as a man ascending. And it shall be, when all the nations hear his voice, each will leave his own land and the war that they have against one another,
translation:
  language: hi
  text: मेरा पुत्र प्रकट होगा—वही, जिसे तुमने ऊपर चढ़ते हुए मनुष्य के रूप में देखा था। और ऐसा होगा कि जब सब जातियाँ उसकी आवाज़ सुनेंगी, तब हर एक अपना देश और वह युद्ध छोड़ देगा जो वे एक-दूसरे के विरुद्ध लड़ रहे हैं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuelabitur
  choice: प्रकट होगा
  rationale: लैटिन के भविष्यत् कर्मवाच्य का स्वाभाविक और अर्थ-सटीक हिन्दी रूप।
- source_word: filius meus
  choice: मेरा पुत्र
  rationale: सम्बन्ध और मसीही उपाधि को बिना अतिरिक्त व्याख्या के सीधे सुरक्षित रखता है।
- source_word: uirum ascendentem
  choice: ऊपर चढ़ते हुए मनुष्य
  rationale: ascendentem की आरोहणगत दिशा और uirum के मनुष्य-संदर्भ, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: omnes gentes
  choice: सब जातियाँ
  rationale: gentes का बाइबिलीय सामूहिक अर्थ रखता है; यहाँ केवल आधुनिक राष्ट्र-राज्यों तक अर्थ सीमित नहीं किया गया।
- source_word: uocem eius
  choice: उसकी आवाज़
  rationale: श्रव्य वाणी/ध्वनि के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: regionem suam
  choice: अपने देश
  rationale: regio के भूभाग अथवा देश के अर्थ को इस सामूहिक राजनीतिक-दृश्य में सहज हिन्दी देता है।
- source_word: bellum quod habent in alterutro
  choice: उस युद्ध को ... जो वे एक-दूसरे के विरुद्ध करते हैं
  rationale: लैटिन के परस्पर विरोध और चल रहे युद्ध को सुरक्षित रखता है; हिन्दी में 'युद्ध करना' स्वाभाविक है।
theological_decisions:
- issue: ‘मेरा पुत्र’ की पहचान
  choice: उपाधि को यथावत रखा गया, पहचान की अतिरिक्त व्याख्या नहीं जोड़ी गई।
  alternative: इसे स्पष्ट रूप से ‘मसीहा’ या किसी नामित व्यक्ति के रूप में प्रस्तुत करना।
  rationale: मूल पाठ केवल filius meus कहता है; अनुवाद को उससे आगे नहीं जाना चाहिए।
- issue: मनुष्य का ऊपर चढ़ना
  choice: ‘ऊपर चढ़ते हुए मनुष्य के रूप में’
  alternative: ‘स्वर्ग पर चढ़ता हुआ मनुष्य’ या ‘ऊपर आता हुआ मनुष्य’
  rationale: ascendentem आरोहण बताता है, पर गंतव्य स्पष्ट नहीं करता; इसलिए ‘स्वर्ग’ नहीं जोड़ा गया और दिशागत तनाव सुरक्षित रखा गया।
- issue: देश और युद्ध—दोनों को छोड़ना
  choice: हर एक अपने देश और युद्ध, दोनों को छोड़ देता है।
  alternative: देश छोड़कर युद्ध करने जाना।
  rationale: लैटिन में derelinquet के दो समन्वित कर्म हैं—regionem और bellum; अतः व्याकरणानुसार दोनों छोड़े जाते हैं, यद्यपि अगले संदर्भ से कथन तनावपूर्ण लग सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय बाइबिलीय शैली। पद के अंत में अल्पविराम रखा गया है, क्योंकि स्रोत-वाक्य आगे जारी रहता है।
