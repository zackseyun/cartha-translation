- source_word: colligetur in unum
  choice: एक होकर इकट्ठी की जाएगी
  rationale: लैटिन में केवल साथ इकट्ठा होने के बजाय ‘एक में/एक होकर’ जुटाए जाने का भाव है; यह हिंदी प्रयोग उस एकता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: multitudo innumerabilis
  choice: एक अनगिनत भीड़
  rationale: ‘multitudo’ के लिए सहज ‘भीड़’ और ‘innumerabilis’ के लिए स्पष्ट ‘अनगिनत’ चुना गया है।
- source_word: sicut uidisti
  choice: जैसा तुमने देखा
  rationale: द्वितीय पुरुष एकवचन और दर्शन की ओर संकेत को सीधे सुरक्षित रखा गया है।
