translation:
  language: hi
  text: पर मैंने केवल यही देखा कि वह अपने मुँह से मानो आग की लहर, अपने होंठों से ज्वाला की साँस, और अपनी जीभ से तूफ़ान की चिनगारियाँ निकाल रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emittit de ore suo sicut fluctum ignis
  choice: अपने मुँह से आग की लहर के समान कुछ निकाल रहा था
  rationale: ‘sicut’ की उपमा और अग्नि-लहर की सजीव छवि को स्वाभाविक हिन्दी में रखा गया है; ‘कुछ’ हिन्दी वाक्य को व्याकरणिक रूप से पूरा करता है, बिना उस वस्तु की प्रकृति तय किए।
- source_word: spiritum flammae
  choice: ज्वाला की साँस
  rationale: ‘spiritus’ के साँस/वायु संबंधी अर्थ और काव्यात्मक रूपक दोनों सुरक्षित रहते हैं; इसे ‘आत्मा’ कहना यहाँ संदर्भानुकूल नहीं है।
- source_word: scintillas tempestatis
  choice: आँधी की चिनगारियाँ
  rationale: ‘tempestas’ की तूफ़ानी शक्ति और ‘scintillae’ की चिनगारी वाली छवि को यथासंभव सीधे तथा बोधगम्य रूप में रखा गया है।
- source_word: emittebat
  choice: छोड़ रहा था
  rationale: लैटिन अपूर्ण भूतकाल की जारी क्रिया को हिन्दी के अपूर्ण पक्ष से व्यक्त किया गया है।
