  text: I gave you Moses as a leader and Aaron as a priest. I provided you light by a pillar of fire, and I did great wonders among you.
translation:
  language: hi
  text: मैंने तुम्हें अगुआ के रूप में मूसा और याजक के रूप में हारून दिया। मैंने आग के खंभे के द्वारा तुम्हें प्रकाश दिया और तुम्हारे बीच बड़े-बड़े आश्चर्यकर्म किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ducem
  choice: अगुआ
  rationale: यह ‘नेता/मार्गदर्शक’ के अर्थ को स्वाभाविक बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: sacerdotem
  choice: याजक
  rationale: यह धार्मिक पद के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: per columnam ignis
  choice: आग के खंभे के द्वारा
  rationale: लातीनी साधनवाचक अभिव्यक्ति और निर्गमन-परंपरा की मूर्त छवि दोनों सुरक्षित रहती हैं।
- source_word: praestiti
  choice: दिया
  rationale: यहाँ क्रिया का अर्थ प्रकाश उपलब्ध कराना है; सरल ‘दिया’ हिन्दी में स्वाभाविक है और मूल अर्थ को पर्याप्त रूप से व्यक्त करता है।
- source_word: magna mirabilia
  choice: बड़े-बड़े आश्चर्यकर्म
  rationale: यह विशेषण की तीव्रता और असाधारण दैवी कार्यों, दोनों को व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी रखी गई है। समानांतर वाक्य-विन्यास को यथासंभव बनाए रखते हुए अनावश्यक व्याख्या नहीं जोड़ी गई। आरंभिक ‘exhibui’ और अंतिम ‘in’ उपलब्ध अंश में अपूर्ण प्रतीत होते हैं; इसलिए अंग्रेज़ी परामर्श-पाठ की तरह केवल पूर्ण, स्पष्ट उपवाक्यों का अनुवाद किया गया है।
