  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter eos
  choice: उनके कारण
  rationale: लातीनी पदबंध का कारणसूचक अर्थ बनाए रखता है; संदर्भ के अनुसार इसमें ‘उनकी खातिर’ का भाव भी संभव है, पर मूल की संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई है।
- source_word: subuerti
  choice: उलट दिया
  rationale: राजाओं को सत्ता से गिराने या पराजित करने का सशक्त रूपक व्यक्त करता है।
- source_word: pueris suis
  choice: उसके सेवकों
  rationale: यहाँ puer व्यापक अर्थ में अधीन सेवकों या अनुचरों के लिए प्रयुक्त है; ‘लड़कों’ कहना प्रसंग में भ्रामक होगा।
- source_word: percussi
  choice: मार गिराया
  rationale: प्रहार करके विनाश या घातक पराजय देने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
