  yaml_path: translation/extra_canonical/2_esdras/001/009.yaml
  text: How long shall I endure them, to whom I have given such great benefits?
translation:
  language: hi
  text: मैं कब तक उन्हें सहता रहूँ, जिन पर मैंने इतने बड़े उपकार किए हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vsquequo
  choice: कब तक
  rationale: यह अवधि की सीमा पूछने वाले लैटिन पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: sustinebo
  choice: सहता रहूँ
  rationale: यहाँ भविष्यकालीन प्रश्न में निरंतर सहन करने का भाव है; हिन्दी में ‘सहता रहूँ’ उस भाव को सहजता से व्यक्त करता है।
- source_word: tanta beneficia contuli
  choice: इतने बड़े उपकार किए हैं
  rationale: beneficia का अर्थ दिए गए हितकारी वरदान या उपकार हैं, और contuli उनके प्रदान किए जाने को व्यक्त करता है; यह रूप मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: beneficia को ‘आशीषें’ या ‘उपकार’ कहना
  choice: उपकार
  alternative: आशीषें
  rationale: लैटिन beneficia सामान्यतः लाभकारी कृपाओं या उपकारों को दर्शाता है। ‘उपकार’ मूल की व्यापकता रखता है और ऐसा धार्मिक अर्थ नहीं जोड़ता जो पद में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज प्रश्नवाचक शैली; परमेश्वर के धैर्य और उसके पूर्व उपकारों के बीच मूल तनाव को बनाए रखा गया है।
