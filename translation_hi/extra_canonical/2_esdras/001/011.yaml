id: 2ES.1.11
reference: 2 Esdras 1:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Omnes gentes a facie eorum perdidi et in oriente prouinciarum duarum populum, Tyri et Sidonis, dissipaui et omnes aduersarios eorum interfeci.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/011.yaml
  text: I destroyed all the nations before them, and in the east I scattered the people of the two provinces, Tyre and Sidon, and killed all their enemies.
translation:
  language: hi
  text: मैंने उनके सामने से सभी जातियों का नाश कर दिया; और पूर्व में मैंने दो प्रान्तों—सोर और सीदोन—के लोगों को तितर-बितर कर दिया और उनके सभी शत्रुओं को मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a facie eorum
  choice: उनके सामने से
  rationale: लातीनी मुहावरे का रूपक बनाए रखता है और यह अर्थ देता है कि जातियों को उनके मार्ग या उपस्थिति से हटा दिया गया।
- source_word: gentes
  choice: जातियों
  rationale: प्राचीन सामूहिक जनसमूहों के लिए स्वाभाविक और पारंपरिक हिन्दी शब्द।
- source_word: in oriente
  choice: पूर्व में
  rationale: स्रोत के भौगोलिक संकेत का सीधा और स्पष्ट अनुवाद।
- source_word: prouinciarum duarum populum
  choice: दो प्रान्तों—सोर और सीदोन—के लोगों को
  rationale: लातीनी एकवचन सामूहिक populum को हिन्दी में स्वाभाविक बहुवचन ‘लोगों’ से व्यक्त किया गया है; Tyre और Sidon को उन दो प्रान्तों के रूप में रखा गया है।
- source_word: dissipaui
  choice: तितर-बितर कर दिया
  rationale: बलपूर्वक बिखेरने के भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: aduersarios
  choice: शत्रुओं
  rationale: यहाँ विरोध करने वालों के लिए प्रसंगानुकूल और सामान्य हिन्दी शब्द।
- source_word: interfeci
  choice: मार डाला
  rationale: हत्या या युद्ध में वध के स्पष्ट परिणाम को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: विनाशकारी कार्यों का कर्ता
  choice: पहले पुरुष ‘मैंने’ को स्पष्ट रूप से बनाए रखा गया
  alternative: कर्ता को निष्क्रिय वाक्य में अस्पष्ट करना
  rationale: स्रोत पाठ इन कार्यों को सीधे वक्ता से जोड़ता है; अनुवाद इस कठिन धार्मिक तनाव को कम या अस्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठक के लिए सुबोध शैली। ‘सोर’ और ‘सीदोन’ प्रचलित बाइबिलीय हिन्दी स्थान-नाम हैं। कोई पादटिप्पणी आवश्यक नहीं है।
