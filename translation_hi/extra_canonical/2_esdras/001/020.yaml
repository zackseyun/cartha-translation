  yaml_path: translation/extra_canonical/2_esdras/001/020.yaml
  text: You ate the bread of angels for food. When you were thirsty[a], did I not split the rock, and waters flowed in abundance? Because of the heat I covered you with the leaves of trees.
translation:
  language: hi
  text: तुमने स्वर्गदूतों की रोटी भोजन के रूप में खाई। जब तुम प्यासे थे[a], तो क्या मैंने चट्टान नहीं फाड़ी, और क्या बहुतायत से पानी नहीं बह निकला? तपती गरमी के कारण मैंने तुम्हें पेड़ों के पत्तों से ढक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जब तुम प्यासे थे, तो क्या मैंने चट्टान नहीं फाड़ी, और क्या बहुतायत से पानी नहीं बह निकला?”
    reason: पूर्ववर्ती पाठ-रूप में वाक्य आरंभिक ‘और’ के साथ जुड़ा था; अर्थ में कोई विशेष अंतर नहीं है।
lexical_decisions:
- source_word: panem angelorum
  choice: स्वर्गदूतों की रोटी
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक हिन्दी रूप; निर्गमन-परंपरा से जुड़े अलौकिक भोजन के संकेत को बनाए रखता है।
- source_word: petram excidi
  choice: चट्टान फाड़ी
  rationale: excidi के प्रबल क्रियार्थ को बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: in satietate
  choice: बहुतायत से
  rationale: शाब्दिक अर्थ ‘तृप्ति तक’ है; यहाँ पानी की प्रचुर मात्रा का भाव है, इसलिए यह सहज हिन्दी रूप चुना गया।
- source_word: propter aestus
  choice: तपती गरमी से बचाने के लिए
  rationale: aestus की तीखी गरमी और अगले कथन में दिए गए आवरण के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: panem angelorum में भोजन की पहचान
  choice: स्वर्गदूतों की रोटी
  alternative: स्वर्गीय रोटी
  rationale: मूल पाठ स्पष्ट रूप से angelorum कहता है; इसे सामान्यीकृत करके केवल ‘स्वर्गीय’ करना मूल के विशिष्ट चित्र को कम कर देता।
- issue: प्रश्न के भीतर et fluxerunt का संबंध
  choice: क्या मैंने... नहीं फाड़ी और पानी... नहीं बह निकला?
  alternative: क्या मैंने चट्टान नहीं फाड़ी, जिससे पानी बहुतायत से बह निकला?
  rationale: यह रूप लातीनी et के समन्वयी बल को रखता है और हिन्दी में पूरे वाक्य को स्वाभाविक आलंकारिक प्रश्न बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। उपलब्ध लातीनी उद्धरण ‘propter aestus’ पर समाप्त होता है; अंतिम उपवाक्य अंग्रेज़ी POB के परीक्षित परामर्श-पाठ के अनुसार रखा गया है।
