  yaml_path: translation/extra_canonical/2_esdras/001/030.yaml
  text: Thus I gathered you as a hen gathers her chicks under her wings[a]. But now what shall I do with you? I will cast you out from before my face.
translation:
  language: hi
  text: इसी प्रकार मैंने तुम्हें इकट्ठा किया, जैसे मुर्गी अपने चूज़ों को अपने पंखों के नीचे इकट्ठा करती है।[a] लेकिन अब मैं तुम्हारे साथ क्या करूँ? मैं तुम्हें अपने सामने से निकाल फेंकूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुम्हें इकट्ठा किया।” “इसी प्रकार” के लिए लैटिन शब्द पिछले पद के अंत में आता है।
    reason: पद-विभाजन के आर-पार फैली लैटिन वाक्य-रचना और पूर्व प्रचलित पाठांतर को स्पष्ट करना।
lexical_decisions:
- source_word: collegi
  choice: इकट्ठा किया
  rationale: लैटिन क्रिया का मूल अर्थ ‘एकत्र करना’ है; यही चुनाव मुर्गी और चूज़ों के रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: gallina pullos suos
  choice: मुर्गी अपने चूज़ों को
  rationale: रूपक के घरेलू और संरक्षणकारी चित्र को सीधे तथा आधुनिक हिन्दी में व्यक्त करता है।
- source_word: sub alas suas
  choice: अपने पंखों के नीचे
  rationale: लैटिन चित्र को बिना विस्तार या व्याख्या जोड़े सुरक्षित रखता है।
- source_word: proiciam vos a facie mea
  choice: मैं तुम्हें अपने सामने से निकाल फेंकूँगा
  rationale: proiciam की कठोरता और a facie mea के उपस्थितिगत अर्थ, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वर द्वारा लोगों को अस्वीकार किए जाने की कठोर घोषणा
  choice: मैं तुम्हें अपने सामने से निकाल फेंकूँगा
  alternative: मैं तुम्हें अपनी उपस्थिति से दूर कर दूँगा
  rationale: मुख्य पाठ लैटिन proiciam की तीव्रता को बनाए रखता है और किसी विशेष धर्मवैज्ञानिक व्याख्या से इसे नरम नहीं करता।
- issue: पिछले पद से जुड़े Ita का अनुवाद
  choice: इसी प्रकार
  alternative: इसे छोड़कर वाक्य ‘मैंने तुम्हें इकट्ठा किया’ से आरम्भ करना
  rationale: यद्यपि Ita पिछले पद के अंत में है, वह इस पद के collegi को क्रियाविशेषण रूप में नियंत्रित करता है; इसलिए उसे मुख्य पाठ में रखना स्रोत-संगत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मुर्गी और चूज़ों का मूल रूपक अक्षुण्ण है; अंतिम वाक्य की कठोरता को न तो बढ़ाया गया है, न नरम किया गया है।
