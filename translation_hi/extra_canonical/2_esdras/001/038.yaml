  text: from the east, to whom I will give Abraham, Isaac, and Jacob as leaders,
translation:
  language: hi
  text: पूर्व से, जिन्हें मैं इब्राहीम, इसहाक और याकूब को अगुओं के रूप में दूँगा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab oriente
  choice: पूर्व दिशा से
  rationale: लातीनी पदबंध स्रोत या आगमन की दिशा बताता है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: quibus dabo
  choice: जिन्हें मैं ... दूँगा
  rationale: quibus के सम्प्रदान भाव और dabo के भविष्यकाल को स्पष्ट रूप से बनाए रखता है।
- source_word: ducattum
  choice: अगुओं के रूप में
  rationale: यहाँ शब्द नेतृत्व/अगुआई के भाव में है और अब्राहम, इसहाक तथा याकूब को उन लोगों के लिए अगुए बनाए जाने का आशय देता है।
- source_word: Abraham, Isaac et Iacob
  choice: अब्राहम, इसहाक और याकूब
  rationale: बाइबिलीय व्यक्तिनामों के प्रचलित आधुनिक हिन्दी रूप अपनाए गए हैं।
theological_decisions:
- issue: पितृपुरुषों की भूमिका
  choice: उन्हें लोगों के लिए ‘अगुओं के रूप में’ दिया जाना
  alternative: उन्हें अमूर्त ‘नेतृत्व’ दिया जाना
  rationale: वाक्य-विन्यास और परामर्श-पाठ व्यक्तियों को अगुओं की भूमिका में दिए जाने का समर्थन करते हैं; इससे किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरम्भ और अन्त की अल्पविराम-युक्त अपूर्णता उपलब्ध स्रोतांश के बड़े वाक्य का अंश होने को दर्शाती है।
