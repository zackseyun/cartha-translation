review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the singular command, “my people,” the people’s evil deeds, the wrongdoing committed against the speaker, and the generational final clause. The implicit subject of the final plural verb remains appropriately unresolved as in the Latin.
  naturalness: The phrase “उन अधर्म के कामों” is awkward in modern standard Hindi and is not well formed for the intended plural sense. A direct plural noun, “उन अधर्मों,” is more idiomatic and clear. Repeating “बता” also makes the two coordinated recipients and messages readily understandable.
  terminology: “मेरी प्रजा,” “बुरे काम,” “अधर्म,” and “मेरे विरुद्ध” are suitable, natural equivalents. “अधर्मों” preserves the plural force of iniquitates without imposing a doctrinal interpretation.
  issues:
