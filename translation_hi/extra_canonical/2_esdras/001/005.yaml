id: 2ES.1.5
reference: 2 Esdras 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vade et nuntia populo meo facinora ipsorum et filiis eorum iniquitates, quas in me admiserunt, ut nuntient filiis filiorum suorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/005.yaml
  text: “Go and declare to my people their evil deeds, and to their children the iniquities that they have committed against me, so that they may tell their children's children.
translation:
  language: hi
  text: “जा और मेरी प्रजा को उनके बुरे कामों के बारे में बता, और उनके बच्चों को उन अधर्मों के बारे में बता जो उन्होंने मेरे विरुद्ध किए हैं, ताकि वे अपने बच्चों के बच्चों को बता सकें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vade et nuntia
  choice: जा और ... बता
  rationale: एकवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; ‘घोषणा कर’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज।
- source_word: populo meo
  choice: मेरी प्रजा
  rationale: वाचा-संबंधी सामूहिक अर्थ को सुरक्षित रखता है।
- source_word: facinora ipsorum
  choice: उनके बुरे काम
  rationale: facinora के गंभीर दुष्कर्म-सूचक भाव को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है।
- source_word: iniquitates
  choice: अधर्म के काम
  rationale: नैतिक अन्याय और दुष्ट आचरण दोनों का भाव देता है तथा बहुवचन को स्वाभाविक बनाता है।
- source_word: in me admiserunt
  choice: मेरे विरुद्ध किए हैं
  rationale: Latin में अपराध का लक्ष्य परमेश्वर है; ‘विरुद्ध’ इस संबंध को स्पष्ट रूप से बनाए रखता है।
- source_word: filiis filiorum suorum
  choice: अपने बच्चों के बच्चों
  rationale: मूल की पीढ़ीगत अभिव्यक्ति को बिना ‘वंशजों’ जैसे अधिक अमूर्त शब्द में बदलकर सुरक्षित रखता है।
theological_decisions:
- issue: दुष्कर्मों का परमेश्वर के विरुद्ध होना
  choice: जो उन्होंने मेरे विरुद्ध किए हैं
  alternative: जो उन्होंने मेरे साथ किए हैं
  rationale: in me का अपराध-संदर्भ ‘विरुद्ध’ की मांग करता है; इससे पाप के परमेश्वर-विरोधी आयाम को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- issue: अंतिम उपवाक्य में कर्ता की संभावित संदर्भ-अस्पष्टता
  choice: ताकि वे अपने बच्चों के बच्चों को बता सकें
  alternative: ताकि उनके बच्चे अपने बच्चों को बता सकें
  rationale: Latin ut nuntient में कर्ता अंतर्निहित और कुछ हद तक संदर्भगत है; ‘वे’ मूल की अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। एकवचन आज्ञार्थक ‘जा’ मूल के Vade को दर्शाता है। कोई पाद-टिप्पणी आवश्यक नहीं है।
