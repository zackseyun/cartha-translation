  to: “जा और मेरी प्रजा को उनके बुरे कामों के बारे में बता, और उनके बच्चों को उन अधर्मों के बारे में बता जो उन्होंने मेरे विरुद्ध किए हैं, ताकि वे अपने बच्चों के बच्चों को बता सकें।”
