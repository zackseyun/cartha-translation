source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu autem excute comam capitis tui et proice omnia mala super illos, quoniam non obaudierunt legi meae; populus autem indisciplinatus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/008.yaml
  text: But you[a], shake out the hair of your head and cast all evils upon them, because they have not obeyed my law; they are an undisciplined people.
translation:
  language: hi
  text: पर तू अपने सिर के बाल झटक दे और सारी विपत्तियाँ उन पर डाल दे, क्योंकि उन्होंने मेरी व्यवस्था नहीं मानी; वे अनुशासनहीन[a] लोग हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विद्रोही लोग।”
    reason: लातीनी indisciplinatus का मुख्य अर्थ ‘अनुशासनहीन’ है; ‘विद्रोही’ एक संभव, पर कम विशिष्ट, वैकल्पिक समझ है।
lexical_decisions:
- source_word: excutе comam capitis tui
  choice: अपने सिर के बाल झाड़ दे
  rationale: लातीनी पद बालों को झटकने या झाड़ देने की क्रिया बताता है; हिन्दी में यह रूप उस सांकेतिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: omnia mala
  choice: सारी विपत्तियाँ
  rationale: यहाँ mala लोगों पर डाली जाने वाली दुष्परिणामकारी घटनाओं या विपत्तियों के अर्थ में है; ‘बुराइयाँ’ नैतिक दोष का भ्रामक संकेत दे सकता था।
- source_word: non obaudierunt legi meae
  choice: उन्होंने मेरी व्यवस्था नहीं मानी
  rationale: obaudire के आज्ञापालन और lex के विधि/व्यवस्था-संबंधी अर्थ को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: indisciplinatus
  choice: अनुशासनहीन
  rationale: यह शब्द disciplina से वंचित या उसके अधीन न रहने का अर्थ देता है; इसलिए सामान्य ‘विद्रोही’ की अपेक्षा ‘अनुशासनहीन’ स्रोत के अधिक निकट है।
theological_decisions:
- issue: लोगों के दोष का स्वरूप
  choice: अनुशासनहीन
  alternative: विद्रोही
  rationale: मूल लातीनी शब्द विशेष रूप से अनुशासन या शिक्षा के अभाव/अस्वीकार पर बल देता है। ‘विद्रोही’ संभव व्याख्यात्मक विस्तार है, पर मूल की विशिष्टता को कुछ हद तक समतल कर देता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। एकवचन संबोधन ‘तू’ मूल के Tu को बनाए रखता है और भविष्यद्वक्ता को दिए गए सीधे आदेश की तीव्रता व्यक्त करता है।
