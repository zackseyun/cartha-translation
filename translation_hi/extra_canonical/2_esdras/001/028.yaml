id: 2ES.1.28
reference: 2 Esdras 1:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus omnipotens : nonne ego uos rogaui ut pater filios et ut mater filias et nutrix paruulos suos,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/028.yaml
  text: 'Thus says the Lord Almighty: Have I not entreated you[a], as a father his sons, and as a mother her daughters, and a nurse her little children,'
translation:
  language: hi
  text: 'सर्वशक्तिमान प्रभु यह कहता है: क्या मैंने तुमसे विनती नहीं की[a], जैसे पिता अपने पुत्रों से करता है, माता अपनी पुत्रियों से करती है, और धाय अपने नन्हे बच्चों से करती है—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैंने तुमसे आग्रह नहीं किया, जैसे पिता अपने पुत्रों से करता है, माता अपनी पुत्रियों से करती है, और धाय अपने नन्हे बच्चों से करती है—”
    reason: लैटिन rogaui में ‘विनती करना’ और ‘आग्रह करना’ दोनों अर्थ संभव हैं; मुख्य पाठ में अधिक भावपूर्ण अर्थ रखा गया है।
lexical_decisions:
- source_word: dominus omnipotens
  choice: सर्वशक्तिमान प्रभु
  rationale: यह पदवी लैटिन की संज्ञा और विशेषण दोनों को स्वाभाविक तथा प्रतिष्ठित हिन्दी में सुरक्षित रखती है।
- source_word: rogaui
  choice: विनती की
  rationale: rogo के यहाँ प्रयुक्त भावपूर्ण अर्थ—अनुरोध या अनुनय करना—को केवल ‘पूछा’ या ‘कहा’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: nutrix
  choice: धाय
  rationale: यह ऐसे स्त्रीलिंग पालन-पोषण करने वाले व्यक्ति को सूचित करता है जो छोटे बच्चों की देखभाल करती है; ‘दाई’ प्रसव-सहायिका समझी जा सकती है।
- source_word: paruulos suos
  choice: अपने नन्हे बच्चों से
  rationale: paruulos के लघुता और स्नेहसूचक भाव तथा suos के संबंधबोध को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वर की पिता, माता और धाय से तुलना
  choice: तीनों पारिवारिक उपमाएँ समानांतर रूप में सुरक्षित रखी गईं
  alternative: क्रियाओं को दोहराकर तुलना को व्याख्यात्मक बनाना
  rationale: मूल पाठ ईश्वर की करुणापूर्ण विनती को इन तीन संबंधों के द्वारा रखता है; किसी एक उपमा को प्रधान या गौण करना उचित नहीं।
- issue: rogaui की अर्थ-तीव्रता
  choice: ‘विनती की’
  alternative: ‘तुमसे कहा’ या ‘तुमसे पूछा’
  rationale: संदर्भ की भावात्मक तीव्रता और लैटिन क्रिया के ‘अनुनय करना’ वाले अर्थ को बनाए रखा गया है, बिना इसे अत्यधिक नाटकीय बनाने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘धाय’ अपेक्षाकृत साहित्यिक है, पर nutrix के लिए ‘दाई’ से अधिक सटीक है। पद मूल की अपूर्ण, अगले वाक्य में जारी रहने वाली संरचना के अनुरूप दीर्घ विराम पर समाप्त होता है।
