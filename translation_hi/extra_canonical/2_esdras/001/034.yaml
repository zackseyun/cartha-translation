  text: creationem non facient, quoniam mandatum meum uobiscum neglexerunt et quod malum est coram me fecerunt. Tradam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/034.yaml
  text: And your sons will not produce offspring, because they neglected my commandment among you and did what is evil before me.
translation:
  language: hi
  text: और तुम्हारे पुत्र संतान उत्पन्न नहीं करेंगे, क्योंकि उन्होंने तुम्हारे बीच मेरी आज्ञा की उपेक्षा की और वह किया जो मेरी दृष्टि में बुरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creationem non facient
  choice: संतान उत्पन्न नहीं करेंगे
  rationale: लातीनी वाक्यांश का शाब्दिक अर्थ ‘सृष्टि नहीं करेंगे’ हो सकता है, पर इस प्रसंग में वंश-वृद्धि अथवा संतानोत्पत्ति अभिप्रेत है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: mandatum meum
  choice: मेरी आज्ञा
  rationale: mandatum के लिए ‘आज्ञा’ सीधा, प्रतिष्ठित और सामान्य बाइबलीय हिन्दी शब्द है।
- source_word: uobiscum
  choice: तुम्हारे बीच
  rationale: मूलतः ‘तुम्हारे साथ’ सम्भव है, किन्तु प्रसंग में समुदाय के भीतर दी गई अथवा विद्यमान आज्ञा की उपेक्षा का भाव ‘तुम्हारे बीच’ से अधिक स्वाभाविक रूप में व्यक्त होता है।
- source_word: coram me
  choice: मेरी दृष्टि में
  rationale: शाब्दिक ‘मेरे सामने’ की अपेक्षा यह हिन्दी में नैतिक मूल्यांकन का आशय स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: संतान उत्पन्न न करने का कथन
  choice: इसे उनके पुत्रों के विषय में भविष्यसूचक परिणाम के रूप में रखा गया है
  alternative: इसे संतान उत्पन्न करने से जानबूझकर इनकार करने के अर्थ में पढ़ना
  rationale: भविष्यकालीन non facient और प्रसंग दंडात्मक निष्फलता की ओर संकेत करते हैं; फिर भी हिन्दी पाठ कारण या साधन को मूल से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। पद के अंत में आया ‘Tradam’ अगले वाक्य का आरम्भ प्रतीत होता है, इसलिए इसे इस पद में शामिल नहीं किया गया।
