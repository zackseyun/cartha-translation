source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam me dereliquistis, et ego uos derelinquam: petentibus uobis a me misericordiam, non miserebor uestri.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/025.yaml
  text: Because you have forsaken me, I also will forsake you. When you ask me for mercy, I will not have mercy on you.
translation:
  language: hi
  text: क्योंकि तुमने मुझे छोड़ दिया है, इसलिए मैं भी तुम्हें छोड़ दूँगा। जब तुम मुझसे दया माँगोगे, तब मैं तुम पर दया नहीं करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquistis / derelinquam
  choice: छोड़ दिया है / छोड़ दूँगा
  rationale: एक ही लैटिन क्रिया की पुनरावृत्ति और प्रत्युत्तरात्मक बल को हिन्दी में समान क्रिया द्वारा सुरक्षित रखा गया है।
- source_word: petentibus uobis a me misericordiam
  choice: जब तुम मुझसे दया माँगोगे
  rationale: लैटिन के परिस्थितिवाचक कृदन्त को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: non miserebor uestri
  choice: मैं तुम पर दया नहीं करूँगा
  rationale: लैटिन अभिव्यक्ति के स्पष्ट निषेध और न्यायसूचक कठोरता को बिना नरम किए रखा गया है।
theological_decisions:
- issue: परित्याग के प्रत्युत्तर का स्वरूप
  choice: इसलिए मैं भी तुम्हें छोड़ दूँगा
  alternative: मैं भी तुम्हारा त्याग कर दूँगा
  rationale: ‘भी’ मूल के et ego का प्रत्युत्तरात्मक बल बनाए रखता है; ‘छोड़ना’ साधारण पाठक के लिए अधिक स्वाभाविक है और मूल क्रिया की पुनरावृत्ति भी बचाता है।
- issue: दया न करने की घोषणा
  choice: मैं तुम पर दया नहीं करूँगा
  alternative: मैं तुम्हारी विनती स्वीकार नहीं करूँगा
  rationale: मूल पाठ सीधे दया न करने की बात कहता है; वैकल्पिक रूप अर्थ को व्याख्यात्मक ढंग से बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और प्रत्यक्ष शैली; दिव्य न्याय की कठोरता को मूल के अनुसार बनाए रखा गया है।
