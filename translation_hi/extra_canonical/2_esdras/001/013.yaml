  text: Surely I brought you through the sea[a], and in trackless places I made roads secure for you.
translation:
  language: hi
  text: निश्चय ही मैं तुम्हें समुद्र के पार ले गया और जहाँ कोई रास्ता न था, वहाँ तुम्हारे लिए मार्ग सुरक्षित बनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nempe
  choice: निश्चय ही
  rationale: यह पद के आरम्भ में आए बलसूचक अव्यय का स्वाभाविक और स्पष्ट हिन्दी रूप है; इसे पिछले पद के ‘प्रभु यों कहता है’ से नहीं जोड़ा गया।
- source_word: mare traieci
  choice: समुद्र के पार ले गया
  rationale: लैटिन में वक्ता द्वारा संबोधित लोगों को समुद्र पार कराने का भाव है।
- source_word: in inuia
  choice: जहाँ कोई रास्ता न था
  rationale: शाब्दिक ‘अगम/पथहीन स्थानों में’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और पथविहीन भूभाग का अर्थ बनाए रखता है।
- source_word: plateas ... munitas
  choice: मार्ग सुरक्षित बनाए
  rationale: plateas को प्रसंगानुसार ‘मार्ग’ और munitas को ‘सुरक्षित बनाए’ दिया गया है; इससे तैयार या दृढ़-सुरक्षित किए गए रास्तों का भाव रहता है।
- source_word: uobis
  choice: तुम्हारे लिए
  rationale: लैटिन के लाभार्थक बहुवचन का प्रत्यक्ष प्रतिनिधित्व करता है।
theological_decisions:
- issue: क्या पद के आरम्भ में ‘प्रभु यों कहता है’ जोड़ा जाए
  choice: नहीं जोड़ा गया; ‘Nempe’ को ‘निश्चय ही’ अनूदित किया गया
  alternative: '‘प्रभु यों कहता है: मैं तुम्हें...’'
  rationale: दिए गए लैटिन पद का आरम्भ Nempe ego से होता है; पिछले पद के सूत्र-वाक्य को यहाँ दोहराना स्रोत से समर्थित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तुम्हें/तुम्हारे’ बहुवचन समुदाय-संबोधन को स्वाभाविक हिन्दी में व्यक्त करते हैं।
