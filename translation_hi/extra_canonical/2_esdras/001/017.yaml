id: 2ES.1.17
reference: 2 Esdras 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc usque murmuratis. Vbi sunt beneficia quae praestiti uobis? nonne in deserto cum esuriretis et sitiretis proclamastis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/017.yaml
  text: Until now you have kept murmuring. Where are the benefits that I bestowed on you? Did you not cry out in the wilderness when you were hungry and thirsty,
translation:
  language: hi
  text: अब तक तुम कुड़कुड़ाते रहे हो। वे उपकार कहाँ हैं जो मैंने तुम पर किए? क्या जब तुम निर्जन प्रदेश में भूखे-प्यासे थे, तब तुमने पुकार नहीं लगाई थी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc usque murmuratis
  choice: अब तक तुम कुड़कुड़ाते रहे हो
  rationale: ‘अब तक’ nunc usque की समयगत निरंतरता रखता है; ‘कुड़कुड़ाते रहे हो’ murmuratis के बार-बार असंतोष प्रकट करने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: beneficia
  choice: उपकार
  rationale: यह लाभकारी और कृपालु कार्यों को दर्शाता है; ‘उपकार’ प्रसंग के व्यक्तिगत दाता-प्राप्तकर्ता संबंध को बनाए रखता है।
- source_word: praestiti uobis
  choice: मैंने तुम पर किए
  rationale: beneficia के साथ हिन्दी का स्वाभाविक प्रयोग ‘उपकार करना’ है; ‘तुम पर’ uobis का आशय स्पष्ट करता है, बिना अतिरिक्त धार्मिक अर्थ जोड़े।
- source_word: in deserto
  choice: निर्जन प्रदेश में
  rationale: desertum केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि उजाड़/वनस्थली क्षेत्र भी हो सकता है; ‘निर्जन प्रदेश’ इस व्यापकता को रखता है।
- source_word: proclamastis
  choice: तुमने पुकार लगाई थी
  rationale: यह ऊँचे स्वर से पुकारने का भाव देता है और किसी अनुल्लिखित कर्म (‘मुझे’) को नहीं जोड़ता।
theological_decisions:
- issue: पुकार किससे की गई
  choice: 'कर्म को अनुल्लिखित रखा गया: ‘तुमने पुकार नहीं लगाई थी’'
  alternative: ‘तुमने मुझे पुकारा नहीं था’
  rationale: लातीनी पाठ में proclamastis का कर्म नहीं दिया गया है; सम्भावित ईश्वरीय संबोधन को स्पष्ट करके मूल से अतिरिक्त बात नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। बहुवचन संबोधन ‘तुम’ रखा गया है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
