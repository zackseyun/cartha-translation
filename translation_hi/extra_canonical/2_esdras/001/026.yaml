  text: 'Quando inuocabitis me, ego non exaudiam uos: maculastis enim manus uestras sanguine, et pedes uestri inpigri sunt ad committenda homicidia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/026.yaml
  text: When you call upon me, I will not hear you, for you have defiled your hands with blood, and your feet are swift to commit murder.
translation:
  language: hi
  text: जब तुम मुझे पुकारोगे, तब मैं तुम्हारी नहीं सुनूँगा; क्योंकि तुमने अपने हाथों को खून से कलंकित किया है, और तुम्हारे पैर हत्याएँ करने के लिए उतावले हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuocabitis
  choice: पुकारोगे
  rationale: ईश्वर से सहायता के लिए पुकारने का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: non exaudiam
  choice: नहीं सुनूँगा
  rationale: यहाँ साधारण श्रवण नहीं, प्रार्थना पर अनुकूल ध्यान देने का भाव है; प्रसंग में ‘नहीं सुनूँगा’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: maculastis
  choice: कलंकित किया है
  rationale: रक्तपात से नैतिक अशुद्धि और दोष—दोनों भावों को बनाए रखता है।
- source_word: sanguine
  choice: खून से
  rationale: हिंसक रक्तपात के संदर्भ में साधारण आधुनिक हिन्दी का स्पष्ट शब्द।
- source_word: inpigri sunt
  choice: उतावले रहते हैं
  rationale: शाब्दिक रूप से ‘सुस्त नहीं हैं’; इस नकारात्मक मुहावरे का आशय तत्परता/उतावलापन है।
- source_word: homicidia
  choice: हत्याएँ
  rationale: लैटिन बहुवचन को बनाए रखता है और मनुष्य-वध का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ईश्वर का पुकार न सुनना
  choice: मैं तुम्हारी नहीं सुनूँगा
  alternative: मैं तुम्हें उत्तर नहीं दूँगा
  rationale: मूल exaudiam में पुकार को अनुकूल रूप से सुनने का भाव है। ‘नहीं सुनूँगा’ मूल की श्रवण-छवि बनाए रखता है और यह दावा नहीं जोड़ता कि ईश्वर को पुकार सुनाई ही नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, प्रत्यक्ष और न्यायसूचक शैली। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। मूल के कारणसूचक संबंध और हाथ-पैर की समानांतर छवियाँ सुरक्षित रखी गई हैं।
