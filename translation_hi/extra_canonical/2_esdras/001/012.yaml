source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'interfeci. Tu uero loquere ad eos dicens: haec dicit dominus:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/012.yaml
  text: But you[a], speak to them, saying, ‘Thus says the Lord:’
translation:
  language: hi
  text: परन्तु तुम उनसे यह कहो, ‘प्रभु यों कहता है:’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tu uero
  choice: परन्तु तुम
  rationale: ‘uero’ यहाँ निष्कर्षसूचक ‘इसलिए’ नहीं, बल्कि विरोध अथवा बल देने वाला संक्रमण है; ‘परन्तु तुम’ पिछले कथन के साथ उसका अंतर बनाए रखता है।
- source_word: loquere ad eos dicens
  choice: उनसे यह कहो
  rationale: लातीनी वाक्यांश का स्वाभाविक आधुनिक हिन्दी रूप; ‘बोलो, कहते हुए’ जैसी असहज पुनरुक्ति से बचते हुए अर्थ सुरक्षित रखता है।
- source_word: haec dicit dominus
  choice: प्रभु यों कहता है
  rationale: यह पारंपरिक भविष्यद्वाणी-सूत्र का स्पष्ट और गरिमापूर्ण हिन्दी रूप है तथा इसे इसी पद में बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वाणी-सूत्र का इसी पद में स्थान
  choice: ‘प्रभु यों कहता है:’ को पद 12 में रखा गया
  alternative: इसे अगले पद के आरम्भ में रखना
  rationale: उपलब्ध लातीनी स्रोत में ‘haec dicit dominus’ इसी वाक्य और पद का अंग है; इसे स्थानांतरित करना स्रोत की वाक्यरचना और पद-विभाजन बदल देता।
- issue: ‘uero’ का संबंधसूचक अर्थ
  choice: 'विरोध/बल: ‘परन्तु तुम’'
  alternative: 'निष्कर्ष: ‘इसलिए तुम’'
  rationale: लातीनी ‘uero’ सामान्यतः विरोधात्मक या बलात्मक संक्रमण व्यक्त करता है, न कि ‘ergo/igitur’ जैसा निष्कर्ष।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण भविष्यद्वाणी-शैली। ‘यों कहता है’ सूत्रात्मक भाषा को बनाए रखता है और सामान्य पाठक के लिए सहज है।
