id: 2ES.1.32
reference: 2 Esdras 1:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'misi pueros meos prophetas ad uos, quos acceptos interfecistis et laniastis corpora illorum : quorum sanguinem exquiram, dicit dominus. Haec dicit dominus omnipotens : domus uestra de-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/032.yaml
  text: I sent my servants the prophets to you, whom you received and killed and tore their bodies apart; their blood I will require, says the Lord.
translation:
  language: hi
  text: मैंने अपने सेवकों, अर्थात् नबियों, को तुम्हारे पास भेजा; तुमने उन्हें स्वीकार किया, मार डाला और उनके शरीर चीर डाले। उनके खून का हिसाब मैं लूँगा, प्रभु कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pueros meos prophetas
  choice: अपने सेवकों, नबियों
  rationale: Latin pueros का मूल अर्थ ‘लड़कों/सेवकों’ हो सकता है, पर इस संदर्भ में परमेश्वर के भेजे हुए नबियों के लिए ‘सेवकों’ स्वाभाविक और अर्थसंगत है; appositional संबंध को अल्पविराम से रखा गया है।
- source_word: acceptos
  choice: ग्रहण किया
  rationale: acceptos का सीधा अर्थ ‘ग्रहण/स्वीकार किए हुए’ है। प्रसंग में इसका भाव विडंबनापूर्ण या शत्रुतापूर्ण स्वागत भी हो सकता है, पर स्रोत की अस्पष्टता बनाए रखने के लिए ‘पकड़ लिया’ नहीं किया गया।
- source_word: interfecistis
  choice: मार डाला
  rationale: हिंसक वध के अर्थ को साधारण, स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: laniastis corpora illorum
  choice: उनके शरीर चीर डाले
  rationale: laniare की हिंसक तीव्रता—शरीर को फाड़ना या क्षत-विक्षत करना—को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: sanguinem exquiram
  choice: उनके खून का हिसाब मैं लूँगा
  rationale: exquirere यहाँ रक्तपात के लिए जवाबदेही माँगने/प्रतिशोध लेने का न्यायिक मुहावरा है; ‘हिसाब लेना’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है, बिना दंड की विशिष्ट रीति तय किए।
- source_word: dicit dominus
  choice: प्रभु कहता है
  rationale: परिचित भविष्यद्वक्ताई सूत्र को सरल और गरिमापूर्ण रूप में रखा गया है।
theological_decisions:
- issue: नबियों के बहाए खून पर परमेश्वर की प्रतिक्रिया
  choice: ‘उनके खून का हिसाब मैं लूँगा’
  alternative: ‘मैं उनके खून का बदला लूँगा’
  rationale: स्रोत का exquiram जवाबदेही, जाँच या प्रतिदान की धारणा रखता है। ‘हिसाब लूँगा’ न्याय की घोषणा को बनाए रखता है, पर उसे केवल निजी प्रतिशोध के रूप में सीमित नहीं करता।
- issue: acceptos में निहित व्यवहार
  choice: ‘ग्रहण किया’
  alternative: ‘पकड़ लिया’ या ‘स्वीकार किया’
  rationale: Latin शब्द का सामान्य अर्थ बनाए रखा गया है। पाठ में स्वागत, स्वीकार या हिरासत का आशय कितना है, यह स्पष्ट नहीं; इसलिए अनुवाद उसे चुपचाप निश्चित नहीं करता।
translation_notes:
  register: 'आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण शैली। हिंसक क्रियाओं की क्रमिकता तथा अंतिम दैवी न्याय-घोषणा सुरक्षित रखी गई है। उपलब्ध स्रोत का अगला वाक्य ‘Haec dicit dominus omnipotens: domus uestra de-’ से आरंभ होकर अधूरा है, इसलिए उसे इस पद के मसौदे में शामिल नहीं किया गया।'
