  to: मैंने अपने सेवकों, अर्थात् नबियों, को तुम्हारे पास भेजा; तुमने उन्हें स्वीकार किया, मार डाला और उनके शरीर चीर डाले। उनके खून का हिसाब मैं लूँगा, प्रभु कहता है।
