lexical_decisions:
- source_word: Non quasi
  choice: मानो ... नहीं
  rationale: यह लैटिन की तुलना-सूचक, किंचित व्यंग्यात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है और कथन को साधारण निषेध में नहीं बदलता।
- source_word: dereliquistis
  choice: त्यागा है
  rationale: लैटिन पूर्णकाल को वर्तमान से संबद्ध पूर्ण क्रिया के रूप में व्यक्त करता है और निकटवर्ती प्रसंग की काल-संगति बनाए रखता है।
- source_word: uos ipsos
  choice: अपने आप को ही
  rationale: 'द्वितीय पुरुष बहुवचन के आत्मवाचक और बलसूचक अर्थ को स्पष्ट करता है: वास्तविक हानि उन्होंने स्वयं अपनी की है।'
- source_word: dicit dominus
  choice: प्रभु कहते हैं
  rationale: भविष्यद्वाणी-सूचक सूत्र का सीधा, प्रतिष्ठित और आधुनिक हिन्दी रूप।
theological_decisions:
- issue: परमेश्वर को त्यागने और स्वयं को त्यागने के बीच अलंकारिक विरोध
  choice: “मुझे नहीं, बल्कि अपने आप को ही”
  alternative: “ऐसा नहीं कि तुमने मुझे त्यागा है; तुमने स्वयं को त्यागा है”
  rationale: चुना गया रूप मूल के संक्षिप्त और तनावपूर्ण विरोध को सुरक्षित रखता है; वैकल्पिक रूप संबंध को अधिक स्पष्ट करता, पर मूल की ‘Non quasi’ संरचना को समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘मानो’ मूल की अलंकारिक अनिश्चितता को बनाए रखता है, जबकि ‘ही’ uos ipsos के बल को व्यक्त करता है।
