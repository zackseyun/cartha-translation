  yaml_path: translation/extra_canonical/2_esdras/001/003.yaml
  text: sons of Aaron[a], of the tribe of Levi, who were captives in the region of the Medes, in the reign of Artaxerxes king of the Persians.
translation:
  language: hi
  text: हारून के पुत्र, लेवी के गोत्र के, जो मादियों के प्रदेश में फारसियों के राजा अर्तक्षत्र के शासनकाल में बंदी थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'लैटिन में यहाँ शाब्दिक रूप से एकवचन है: “जो बंदी था,” यद्यपि “हारून के पुत्र” बहुवचन है।'
    reason: स्रोत-पाठ में बहुवचन कर्ता ‘Filii’ और एकवचन संबंधवाचक-विधेय ‘qui fuit captiuus’ के बीच वास्तविक व्याकरणिक असंगति है; मुख्य पाठ में संदर्भानुसार बहुवचन रखा गया और असंगति को टिप्पणी में सुरक्षित किया गया।
lexical_decisions:
- source_word: Filii Aaron
  choice: हारून के पुत्र
  rationale: ‘Filii’ बहुवचन है; इसलिए इसे ‘पुत्र’ के बहुवचन अर्थ में रखा गया है, जैसा नवीनतम पाठ-समीक्षा भी पुष्ट करती है।
- source_word: ex tribu Leui
  choice: लेवी के गोत्र के
  rationale: वंशीय/जनजातीय संबद्धता व्यक्त करने वाले ‘tribus’ के लिए बाइबलीय हिन्दी में स्वाभाविक ‘गोत्र’ चुना गया है।
- source_word: in regione Medorum
  choice: मादियों के प्रदेश में
  rationale: ‘regio’ का सामान्य भौगोलिक अर्थ ‘प्रदेश’ है और ‘Medi’ का प्रचलित बाइबलीय रूप ‘मादी’ है।
- source_word: in regno Artaxersis regis Persarum
  choice: फारसियों के राजा अर्तक्षत्र के शासनकाल में
  rationale: यहाँ ‘regnum’ समय-संदर्भ में राजकीय शासन को दर्शाता है; ‘शासनकाल’ आधुनिक हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: captiuus
  choice: बंदी
  rationale: यह क्रियात्मक ‘पकड़ा गया’ नहीं, बल्कि ‘बंदी था’ जैसी अवस्था बताने वाला विधेय विशेषण/संज्ञा है।
