translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। वाक्य स्रोत की वंशावली-सदृश खंडात्मक संरचना को बनाए रखता है। ‘बंदी थे’ अवस्था को व्यक्त करता है, बंदी बनाए जाने की घटना को नहीं।
