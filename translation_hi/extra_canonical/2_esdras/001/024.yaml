source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid tibi faciam, Iacob ? noluisti me obaudire, Iuda. transferam me ad alias gentes et dabo eis nomen meum, ut custodiant legitima mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/024.yaml
  text: What shall I do to you, Jacob? You would not obey me, Judah. I will turn to other nations, and I will give them my name, that they may keep my statutes.
translation:
  language: hi
  text: “हे याकूब, मैं तेरा क्या करूँ? हे यहूदा, तूने मेरी बात माननी नहीं चाही। मैं दूसरी जातियों की ओर मुड़ूँगा और उन्हें अपना नाम दूँगा, ताकि वे मेरी विधियों का पालन करें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi faciam
  choice: मैं तेरे साथ क्या करूँ?
  rationale: लातीनी मुहावरे का स्वाभाविक हिन्दी रूप; इसमें परमेश्वर के प्रश्न की खुली हुई भाव-तीव्रता बनी रहती है।
- source_word: noluisti me obaudire
  choice: तूने मेरी बात माननी नहीं चाही
  rationale: noluisti में केवल आज्ञा न मानने से अधिक, ऐसा करने की अनिच्छा या इनकार निहित है; हिन्दी में इसे स्पष्ट रखा गया है।
- source_word: transferam me ad alias gentes
  choice: मैं दूसरी जातियों की ओर मुड़ूँगा
  rationale: शाब्दिक ‘अपने आपको स्थानांतरित करूँगा’ हिन्दी में अस्वाभाविक है; ‘की ओर मुड़ूँगा’ दिशा और संबंध के परिवर्तन को सुरक्षित रखता है।
- source_word: dabo eis nomen meum
  choice: उन्हें अपना नाम दूँगा
  rationale: मूल के ठोस धर्मवैचारिक कथन को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है।
- source_word: legitima mea
  choice: मेरी विधियों
  rationale: legitima से निर्धारित दैवी नियम या विधान अभिप्रेत हैं; ‘विधियाँ’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: याकूब और यहूदा का संबोधन
  choice: 'दोनों नामों को अलग-अलग संबोधन के रूप में रखा गया: ‘हे याकूब… हे यहूदा…’'
  alternative: दोनों को एक ही समुदाय के व्याख्यात्मक पर्याय के रूप में मिला देना
  rationale: मूल पाठ दोनों नामों को क्रमशः सीधे संबोधित करता है; उनका आपसी संबंध पाठक पर छोड़ा गया है।
- issue: अन्य जातियों को परमेश्वर का नाम दिया जाना
  choice: ‘उन्हें अपना नाम दूँगा’ का अक्षरार्थ बनाए रखा गया
  alternative: इसे ‘वे मेरी प्रजा कहलाएँगी’ या ‘मेरा अधिकार स्वीकार करेंगी’ कहना
  rationale: ऐसी व्याख्याएँ संभव अर्थ को सीमित कर देतीं; मूल कथन की धर्मवैचारिक व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। एकवचन संबोधन के कारण ‘तू/तेरे’ रखा गया है; यह यहाँ अपमानसूचक नहीं, बल्कि बाइबलीय प्रत्यक्ष संबोधन है।
