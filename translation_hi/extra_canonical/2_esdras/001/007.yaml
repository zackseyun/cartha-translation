id: 2ES.1.7
reference: 2 Esdras 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nonne ego eos eduxi de terra Aegypti, de domo seruitutis? ipsi autem irritauerunt me et consilia mea spreuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/007.yaml
  text: Was it not I who brought them out of the land of Egypt, out of the house of slavery? But they provoked me and despised my counsels.
translation:
  language: hi
  text: क्या मैं ही उन्हें मिस्र देश से, दासता के घर से निकालकर नहीं लाया था? फिर भी उन्होंने मुझे क्रोध दिलाया और मेरे परामर्शों को तुच्छ जाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domo seruitutis
  choice: दासता के घर से
  rationale: लातीनी रूपक को सुरक्षित रखते हुए निर्गमन-परंपरा की परिचित अभिव्यक्ति बनाए रखी गई है।
- source_word: irritauerunt me
  choice: मुझे क्रोधित किया
  rationale: यहाँ क्रिया का अर्थ परमेश्वर को उकसाकर क्रोधित करना है; सहज आधुनिक हिन्दी में यही अर्थ स्पष्ट होता है।
- source_word: consilia mea
  choice: मेरी सम्मतियों
  rationale: बहुवचन consilia में दी गई सलाहों, निर्देशों या ठहराई हुई योजनाओं का अर्थ संभव है; ‘सम्मतियों’ इस व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: spreuerunt
  choice: तुच्छ जाना
  rationale: यह केवल अवज्ञा नहीं, बल्कि अवमानना और उपेक्षा का भाव व्यक्त करता है।
theological_decisions:
- issue: consilia को ‘योजनाएँ’ या ‘निर्देश’ के रूप में सीमित करना
  choice: मेरी सम्मतियों
  alternative: मेरी योजनाओं / मेरे निर्देशों
  rationale: मूल शब्द में परामर्श, अभिप्राय और योजना की अर्थ-छायाएँ हैं; किसी एक धर्मवैचारिक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली; मूल के आलंकारिक प्रश्न और ‘दासता के घर’ की बाइबलीय प्रतिमा सुरक्षित रखी गई है।
