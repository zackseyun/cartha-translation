  yaml_path: translation/extra_canonical/2_esdras/001/018.yaml
  text: saying, “Why have you brought us into this wilderness, to kill us? It would have been better for us to serve the Egyptians than to die in this wilderness.”
translation:
  language: hi
  text: वे मुझसे कहने लगे, “तू हमें इस उजाड़ प्रदेश में मार डालने के लिए क्यों ले आया? इस उजाड़ प्रदेश में मरने से तो मिस्रियों की सेवा करना हमारे लिए अच्छा होता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desertum
  choice: उजाड़ प्रदेश
  rationale: लातीनी शब्द निर्जन, वीरान स्थान का बोध कराता है; ‘उजाड़ प्रदेश’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल रेतीली मरुभूमि तक सीमित नहीं करता।
- source_word: interficere nos
  choice: हमें ... मार डालने के लिए
  rationale: मूल के स्पष्ट और आरोपात्मक भाव को सीधे बनाए रखता है।
- source_word: seruire Aegyptiis
  choice: मिस्रियों की सेवा करना
  rationale: लातीनी पद का सीधा अर्थ सुरक्षित रखता है; संदर्भ में दासत्व का भाव निहित है, पर मूल से अधिक स्पष्ट व्याख्या पाठ में नहीं जोड़ी गई।
theological_decisions: []
