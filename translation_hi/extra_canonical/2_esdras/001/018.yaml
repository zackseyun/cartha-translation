  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एक व्यक्ति को संबोधित करने वाले लातीनी एकवचन के अनुरूप ‘तू’ का प्रयोग किया गया है, जो शिकायत की प्रत्यक्षता और तीखेपन को बनाए रखता है।
