source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: folia arborum uos texi. Diuisi uobis terras pingues, Chananeos et Ferezeos et Philistinos a facie uestra proieci. quid faciam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/021.yaml
  text: I covered you with the leaves of trees[a]. I divided fertile lands for you; I drove out the Canaanites and Perizzites and Philistines from before you. What shall I do for you? says the Lord.
translation:
  language: hi
  text: मैंने तुम्हें पेड़ों के पत्तों से ढाँप दिया। मैंने तुम्हारे लिए उपजाऊ भूमियाँ बाँट दीं[a]; मैंने कनानियों, परिज्जियों और पलिश्तियों को तुम्हारे सामने से निकाल दिया। मैं क्या करूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी में “उपजाऊ भूमियाँ” बहुवचन है। यह संक्षिप्त अभिव्यक्ति इस्राएल के गोत्रों में देश के भाग बाँटने की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: folia arborum uos texi
  choice: मैंने तुम्हें पेड़ों के पत्तों से ढका
  rationale: लातीनी वाक्य का सीधा और स्वाभाविक अनुवाद; ‘texi’ में ढकने या आच्छादित करने का भाव है।
- source_word: Diuisi uobis terras pingues
  choice: मैंने तुम्हारे लिए उपजाऊ भूमि बाँट दी
  rationale: ‘terras pingues’ का अर्थ उर्वर/उपजाऊ भूमि है, और ‘divisi’ बाँटने या भाग ठहराने को व्यक्त करता है। बहुवचन ‘terras’ को हिन्दी में सामूहिक एकवचन ‘भूमि’ से स्वाभाविक रूप दिया गया है।
- source_word: a facie uestra proieci
  choice: तुम्हारे सामने से निकाल दिया
  rationale: मुहावरे का अर्थ उनके मार्ग या उपस्थिति से जातियों को हटा देना है; यह हिन्दी में स्वाभाविक रहते हुए मूल बिंब को निकटता से रखता है।
- source_word: quid faciam
  choice: मैं क्या करूँ?
  rationale: मूल में न ‘और’ है, न स्पष्ट रूप से ‘तुम्हारे लिए’; इसलिए संक्षिप्त प्रश्न को उसी खुलेपन के साथ रखा गया है।
theological_decisions:
- issue: क्या प्रश्न में ‘तुम्हारे लिए’ अथवा ‘और’ जोड़ा जाए
  choice: मैं क्या करूँ?
  alternative: मैं तुम्हारे लिए और क्या करूँ?
  rationale: लातीनी पाठ केवल ‘quid faciam’ कहता है। विस्तृत विकल्प प्रसंगानुकूल हो सकता है, पर वह मूल से अधिक स्पष्टता जोड़ता है।
- issue: क्या अंत में ‘प्रभु कहता है’ जोड़ा जाए
  choice: नहीं जोड़ा गया
  alternative: ‘प्रभु कहता है’ जोड़ना
  rationale: प्रस्तुत मूल-भाषा पाठ में यह कथन नहीं है; इसलिए अंग्रेज़ी परामर्श-पाठ में उपस्थित होने पर भी इसे अनुवाद में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली रखी गई है। जातियों के नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
