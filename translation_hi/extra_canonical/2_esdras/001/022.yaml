id: 2ES.1.22
reference: 2 Esdras 1:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis adhuc? dicit dominus. Haec dicit dominus omnipotens: in deserto cum essetis in flumine amaro sitientes et blasphemantes nomen meum,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/022.yaml
  text: 'Thus says the Lord Almighty: In the wilderness, when you were thirsty at the bitter stream and blasphemed my name,'
translation:
  language: hi
  text: 'सर्वशक्तिमान प्रभु यों कहता है: निर्जन प्रदेश में, जब तुम कड़वी धारा के पास प्यासे थे और मेरे नाम की निन्दा कर रहे थे,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus omnipotens
  choice: सर्वशक्तिमान प्रभु
  rationale: लैटिन उपाधि का स्वाभाविक और अर्थ-सटीक हिन्दी रूप।
- source_word: in deserto
  choice: निर्जन प्रदेश में
  rationale: desertum का आशय निर्जन/वीरान स्थान है; यह अभिव्यक्ति आधुनिक हिन्दी में सहज है और अनिवार्यतः रेतीले मरुस्थल का अर्थ नहीं थोपती।
- source_word: in flumine amaro
  choice: कड़वी धारा के पास
  rationale: flumen जलधारा को सूचित करता है। प्रसंगानुसार प्यासे लोगों का धारा के पास होना स्वाभाविक है; 'कड़वी' जल के गुण को अक्षुण्ण रखता है।
- source_word: blasphemantes nomen meum
  choice: मेरे नाम की निन्दा कर रहे थे
  rationale: blasphemare का धार्मिक और गंभीर भाव 'निन्दा करना' से स्पष्ट रूप में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय उपाधि omnipotens
  choice: सर्वशक्तिमान
  alternative: सर्वसामर्थी
  rationale: '''सर्वशक्तिमान'' प्रचलित, संप्रदाय-निरपेक्ष और मूल अर्थ के निकट है।'
- issue: blasphemare की तीव्रता
  choice: निन्दा करना
  alternative: अपमान करना
  rationale: '''निन्दा'' ईश्वर के नाम के विरुद्ध वाणी की धार्मिक गंभीरता बनाए रखती है, जबकि ''अपमान'' अधिक सामान्य है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। स्रोत-पाठ आरम्भ में पिछले वाक्य का खंडित अवशेष 'uobis adhuc? dicit dominus' रखता है; अंग्रेज़ी परामर्श-पाठ और पद-सीमा के अनुसार मसौदा स्पष्ट सूत्र-वाक्य 'Haec dicit dominus omnipotens' से आरम्भ किया गया है। अंतिम अल्पविराम अगले पद में वाक्य जारी रहने का संकेत देता है।
