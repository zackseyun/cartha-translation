- source_word: Ezrae
  choice: एज्रा
  rationale: पुस्तक और व्यक्ति के प्रचलित नाम का आधुनिक हिन्दी लिप्यंतरण।
- source_word: Sarei, Azarei, Helchiae, Salame, Sadoch, Acitob
  choice: सरायाह, अजर्याह, हिल्कियाह, शल्लूम, सादोक, अहीतूब
  rationale: इन बाइबलीय नामों के पहचाने जाने योग्य, स्रोत-समर्थित हिन्दी रूप।
