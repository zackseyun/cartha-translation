lexical_decisions:
- source_word: Liber ... secundus
  choice: दूसरी पुस्तक
  rationale: लातीनी शीर्षकीय वाक्यांश का सहज और सटीक हिन्दी रूप।
- source_word: prophetae
  choice: नबी
  rationale: आम आधुनिक हिन्दी में परिचित बाइबलीय पद; अर्थतः ‘भविष्यद्वक्ता’।
- source_word: filii
  choice: का पुत्र
