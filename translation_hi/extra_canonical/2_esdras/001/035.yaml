source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domus uestras populo uenienti, qui me non audientes credunt ; quibus signa non ostendi, facient quae praecepi. Prophetas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/035.yaml
  text: I will give your houses to a people that is coming[a], who, without hearing me, believe; to whom I have shown no signs, yet they will do what I have commanded.
translation:
  language: hi
  text: मैं तुम्हारे घर आने वाले लोगों को दे दूँगा। वे मुझे सुने बिना विश्वास करते हैं[a]; मैंने उन्हें कोई चिह्न नहीं दिखाया, फिर भी वे वही करेंगे जिसकी मैंने आज्ञा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो मुझे नहीं सुनते, फिर भी विश्वास करते हैं।’
    reason: ‘me non audientes’ को साधनात्मक ‘मुझे सुने बिना’ या concessive ‘मुझे नहीं सुनते, फिर भी’—दोनों प्रकार से समझा जा सकता है; दोनों में ‘credunt’ वर्तमानकाल में है।
lexical_decisions:
- source_word: domus uestras
  choice: तुम्हारे घर
  rationale: बहुवचन और संबोधन को सीधे तथा स्वाभाविक रूप में रखा गया है।
- source_word: populo uenienti
  choice: आनेवाले लोगों को
  rationale: लैटिन में एकवचन सामूहिक संज्ञा है; हिन्दी में ‘लोगों’ से वही जनसमूह सहज रूप में व्यक्त होता है।
- source_word: qui me non audientes credunt
  choice: वे मेरी बात सुने बिना मुझ पर विश्वास करते हैं
  rationale: ‘audientes’ और ‘credunt’ की वर्तमानकालिकता बनाए रखी गई है। ‘मुझ पर’ हिन्दी में ‘विश्वास करना’ का स्वाभाविक पूरक है, यद्यपि लैटिन में विश्वास का कर्म निहित है।
- source_word: signa
  choice: चिह्न
  rationale: अलौकिक प्रमाण या संकेत—दोनों अर्थों की गुंजाइश रखने वाला पारंपरिक और सुबोध शब्द।
- source_word: facient quae praecepi
  choice: वे वही करेंगे जिसकी मैंने आज्ञा दी है
  rationale: ‘facient’ का भविष्यकाल और ‘praecepi’ का पूर्ण भूतार्थ स्पष्ट रखा गया है।
theological_decisions:
- issue: बिना सुने विश्वास करने और बाद में आज्ञापालन करने के बीच कालगत तनाव
  choice: ‘विश्वास करते हैं’ वर्तमानकाल में और ‘करेंगे’ भविष्यकाल में रखा गया
  alternative: दोनों क्रियाओं को भविष्यकाल में रखना
  rationale: लैटिन ‘credunt’ वर्तमान निर्देशात्मक है, जबकि ‘facient’ भविष्यकाल है; इस जानबूझकर रखे गए विरोध को नहीं मिटाया गया।
- issue: ‘credunt’ में विश्वास का अव्यक्त कर्म
  choice: ‘मुझ पर विश्वास करते हैं’
  alternative: केवल ‘विश्वास करते हैं’
  rationale: संदर्भ में बोलने वाला ‘me’ निकट उपस्थित है और हिन्दी में यह वाक्यांश अधिक स्वाभाविक है; इससे कोई संप्रदायगत अर्थ नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। ‘चिह्न’ और ‘आज्ञा’ बाइबलीय गरिमा रखते हैं, पर भाषा अनावश्यक रूप से पुरातन नहीं है।
