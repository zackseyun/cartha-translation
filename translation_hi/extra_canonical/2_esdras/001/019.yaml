translation:
  language: hi
  text: इस जंगल में। मैं तुम्हारी कराहों से दुःखी हुआ[a], और मैंने तुम्हें मन्ना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे तुम्हारी कराहों से पीड़ा हुई।”
    reason: लातीनी dolui का अर्थ दुःखी होना या पीड़ा अनुभव करना हो सकता है; विकल्प बिना अतिरिक्त ‘सुनकर’ जोड़े इस भाव को स्पष्ट करता है।
lexical_decisions:
- source_word: deserto hoc
  choice: इस जंगल में
  rationale: लातीनी पद का सीधा अर्थ ‘इस जंगल/निर्जन प्रदेश में’ है। ‘जंगल’ बाइबिल के मरुभूमि-संदर्भ में सामान्य और सहज हिन्दी है।
- source_word: dolui
  choice: दुखी हुआ
  rationale: doleo यहाँ शोक या पीड़ा अनुभव करने का भाव व्यक्त करता है; इसलिए इसे केवल ‘दया की’ कहना मूल की भावात्मक तीव्रता को घटा देता।
- source_word: gemitos uestros
  choice: तुम्हारी कराहों पर
  rationale: gemitus पीड़ा से निकली कराह या आह को दर्शाता है; बहुवचन को ‘कराहों’ से रखा गया है।
- source_word: mannam
  choice: मन्ना
  rationale: इस्राएल को जंगल में दिए गए अलौकिक भोजन के लिए प्रचलित बाइबिलीय नाम रखा गया है।
theological_decisions:
- issue: परमेश्वर की प्रतिक्रिया का स्वरूप
  choice: मैं तुम्हारी कराहों पर दुखी हुआ
  alternative: मैंने तुम्हारी कराहों पर दया की
  rationale: लातीनी dolui सीधे दुःख या पीड़ा का भाव रखता है, जबकि ‘दया की’ अधिक व्याख्यात्मक है; मुख्य पाठ मूल की भावात्मक भाषा को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। आरंभिक खंड ‘इस जंगल में’ स्रोत की वाक्य-खंड जैसी संरचना को बनाए रखता है, क्योंकि उपलब्ध पाठ भी यहीं पूर्ववर्ती कथन का अंत देता है।
