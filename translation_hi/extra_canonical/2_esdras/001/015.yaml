id: 2ES.1.15
reference: 2 Esdras 1:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis. uos autem mei obliti estis, dicit dominus. Haec dicit dominus omnipotens: coturnix uobis in signo fuit, castra uobis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/015.yaml
  text: 'But you have forgotten me[a], says the Lord. Thus says the Lord Almighty: Quail were a sign for you; camps were for you'
translation:
  language: hi
  text: 'पर तुम मुझे भूल गए हो, प्रभु कहता है। सर्वशक्तिमान प्रभु यों कहता है: बटेर तुम्हारे लिए एक चिन्ह थी; छावनी[a] तुम्हारे लिए थी—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी शब्द का रूप बहुवचन है, पर वह एक छावनी या पड़ाव के लिए भी प्रयुक्त होता है। उपलब्ध वाक्यांश यहीं अधूरा समाप्त होता है।
    reason: castra की व्याकरणिक बहुवचनता तथा स्रोत-खंड की अपूर्णता पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: mei obliti estis
  choice: तुम मुझे भूल गए हो
  rationale: लातीनी संबंधकारक सर्वनाम mei के साथ oblivisci का स्वाभाविक हिन्दी रूप; पूर्णकाल वर्तमान तक बनी हुई दशा को व्यक्त करता है।
- source_word: dominus omnipotens
  choice: सर्वशक्तिमान प्रभु
  rationale: omnipotens का सीधा, प्रतिष्ठित और सामान्य हिन्दी समतुल्य।
- source_word: coturnix
  choice: बटेर
  rationale: निर्गमन-परंपरा में भोजन के रूप में मिली quail का सामान्य हिन्दी नाम; लातीनी एकवचन को बनाए रखा गया है।
- source_word: in signo fuit
  choice: एक चिन्ह थी
  rationale: in signo के विधेयार्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना चिन्ह का आशय अतिरिक्त रूप से निर्धारित किए।
- source_word: castra
  choice: छावनी
  rationale: castra रूप से बहुवचन है, किंतु लातीनी में प्रायः एक ही camp/encampment के अर्थ वाला plurale tantum है; इसलिए प्रसंगानुकूल एकवचन रखा गया।
theological_decisions:
- issue: बटेर को दिए गए चिन्ह का अर्थ
  choice: केवल ‘एक चिन्ह’ कहा गया
  alternative: इसे अनुग्रह, न्याय या संरक्षण का विशेष चिन्ह बताना
  rationale: स्रोत इस खंड में चिन्ह का धार्मिक आशय स्पष्ट नहीं करता; अतः तनाव और अस्पष्टता सुरक्षित रखी गई।
- issue: castra vobis में निहित संबंध
  choice: ‘छावनी तुम्हारे लिए थी’
  alternative: ‘मैंने तुम्हारी रक्षा के लिए छावनी दी’
  rationale: दिए गए लातीनी खंड में ‘मैंने दी’ या ‘रक्षा के लिए’ नहीं है; ऐसी पूर्ति अनावश्यक व्याख्यात्मक विस्तार होती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘यों कहता है’ भविष्यद्वक्ताई उद्घोषणा की औपचारिकता बनाए रखता है। अंतिम दीर्घ विराम-चिह्न स्रोत के अधूरे वाक्यांश को दर्शाता है। आरंभ का अकेला ‘uobis.’ पिछले वाक्य का अवशेष है, इसलिए इस पद के मुख्य पाठ में उसे दोहराया नहीं गया।
