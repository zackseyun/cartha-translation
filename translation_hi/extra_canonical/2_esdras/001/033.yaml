  text: 'Thus says the Lord Almighty: Your house is desolate. I will cast you out like stubble before the wind.'
translation:
  language: hi
  text: 'सर्वशक्तिमान प्रभु यों कहता है: “तुम्हारा घर उजाड़ पड़ा है। मैं तुम्हें ऐसे फेंक दूँगा, जैसे हवा पुआल को उड़ा ले जाती है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deserta est
  choice: उजाड़ पड़ा है
  rationale: लातीनी पद उजड़े और त्यागे हुए होने की दशा व्यक्त करता है; यह सहज हिन्दी उस स्थिति को स्पष्ट रूप से रखती है।
- source_word: proiciam uos
  choice: मैं तुम्हें ... फेंक दूँगा
  rationale: भविष्यकाल और बलपूर्वक बाहर फेंकने के भाव को बनाए रखता है।
- source_word: sicut uentus stipulam
  choice: जैसे हवा पुआल को उड़ा ले जाती है
  rationale: लातीनी उपमा का स्वाभाविक हिन्दी रूप; stipula के लिए ‘पुआल’ चुना गया है, जिससे सूखे, हल्के खेत-अवशेष का बिंब बना रहता है।
- source_word: Dominus omnipotens
  choice: सर्वशक्तिमान प्रभु
  rationale: अंग्रेज़ी परामर्श-पाठ में सुरक्षित आरंभिक घोषणा का प्रचलित, गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: दण्ड की उपमा में कर्ता और क्रिया
  choice: हवा पुआल को उड़ा ले जाती है
  alternative: हवा के सामने पुआल की तरह
  rationale: लातीनी sicut uentus stipulam में हवा को उपमा के भीतर सक्रिय कर्ता के रूप में पढ़ना सबसे स्वाभाविक है; चुना हुआ रूप अर्थ स्पष्ट करता है, पर उपमा की कठोरता नहीं घटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। प्रत्यक्ष वचन के लिए हिन्दी उद्धरण-चिह्न लगाए गए हैं।
