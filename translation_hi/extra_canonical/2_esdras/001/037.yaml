  text: the favor of the people that is coming[a], whose little ones rejoice with gladness, not seeing me with bodily eyes, but in spirit believing what I have said. And now, Father, look with glory and see the people that is coming
translation:
  language: hi
  text: आनेवाले लोगों का अनुग्रह—उनके नन्हे बच्चे आनन्द से हर्षित होते हैं; वे मुझे शारीरिक आँखों से नहीं देखते, फिर भी आत्मा में मेरी कही हुई बातों पर विश्वास करेंगे। और अब, हे पिता, महिमा के साथ देख और आनेवाले लोगों को देख।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gratiam
  choice: अनुग्रह
  rationale: यहाँ accusative संज्ञा के रूप में प्रयुक्त शब्द ‘कृपा’, ‘अनुग्रह’ या ‘कृपादृष्टि’ का भाव दे सकता है। ‘अनुग्रह’ मूल की धार्मिक और संबंधपरक व्यापकता बनाए रखता है।
- source_word: populi uenientis
  choice: आनेवाले लोगों
  rationale: populus सामूहिक अर्थ में एक जनसमुदाय को सूचित करता है। आधुनिक हिन्दी में ‘आनेवाले लोगों’ अधिक सहज है और आगे के ‘छोटे बच्चे’ तथा अंतिम पुनरुक्ति से मेल खाता है।
- source_word: paruuli
  choice: छोटे बच्चे
  rationale: शब्द का सीधा अर्थ छोटे या नन्हे बच्चे है; इसे रूपक मानकर ‘दीन’ अथवा ‘विश्वासी’ नहीं किया गया।
- source_word: oculis carnalibus
  choice: शारीरिक आँखों से
  rationale: carnalis का शाब्दिक भेद आत्मिक देखने/विश्वास करने के विपरीत है; ‘शारीरिक’ इस तनाव को स्पष्ट रखता है।
- source_word: spiritu credent
  choice: आत्मा में … विश्वास करेंगे
  rationale: spiritu के अर्थ को ‘आत्मा में’ के रूप में खुला रखा गया है; credent भविष्यकाल है, इसलिए ‘विश्वास करेंगे’ रखा गया।
- source_word: aspice cum gloria
  choice: महिमा सहित दृष्टि कर
  rationale: cum gloria की कुछ असहज परंतु महत्वपूर्ण अभिव्यक्ति को केवल ‘गौर से देख’ बनाकर साधारण नहीं किया गया।
theological_decisions:
- issue: spiritu में ‘आत्मा’ का संदर्भ
  choice: ‘आत्मा में’—बिना यह तय किए कि यह मनुष्य की आत्मा है या परमेश्वर का आत्मा
  alternative: ‘आत्मिक रूप से’ अथवा ‘पवित्र आत्मा के द्वारा’
  rationale: लैटिन में कोई विशेषण या स्पष्ट कर्ता नहीं है; अनुवाद वास्तविक संदर्भगत अस्पष्टता को सुरक्षित रखता है।
- issue: उन्हें देखने और विश्वास करने का कालगत संबंध
  choice: न देखने को वर्तमान और विश्वास को भविष्यकाल में रखा गया
  alternative: 'दोनों को समकालिक कृदन्त बनाना: ‘न देखते हुए…विश्वास करते हैं’'
  rationale: मूल में videntes वर्तमान कृदन्त है, जबकि credent स्पष्ट भविष्यकाल है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘आनन्द से हर्षित’ मूल के exultant cum laetitia की जानबूझकर की गई पुनरुक्ति को बनाए रखता है। संबोधन ‘हे पिता’ और एकवचन आज्ञार्थक ‘दृष्टि कर…देख’ मूल के निकट हैं।
