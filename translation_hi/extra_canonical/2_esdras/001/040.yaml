  text: Nahum and Habakkuk[a], Zephaniah, Haggai, Zechariah, and Malachi[b], who is also called the angel of the Lord.”
translation:
  language: hi
  text: नहूम और हबक्कूक, सपन्याह, हाग्गै, जकरयाह और मलाकी[a], जो प्रभु का स्वर्गदूत भी कहलाता है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मलाकी’ नाम का अर्थ सामान्यतः ‘मेरा दूत’ समझा जाता है। फिर भी यहाँ लैटिन पाठ उसे स्पष्ट रूप से ‘प्रभु का स्वर्गदूत’ कहता है। इससे यह आवश्यक नहीं होता कि उसे बाइबल के अन्य स्थानों में उल्लिखित विशिष्ट व्यक्तित्व ‘प्रभु का स्वर्गदूत’ ही माना जाए।
    reason: lexical_alternative
  - marker: b
    text: या, “और मलाकी, जो प्रभु का दूत भी कहलाता है।”
    reason: previous_rendering
lexical_decisions:
- source_word: angelus domini
  choice: ‘प्रभु का स्वर्गदूत’
  rationale: उत्तरकालीन ईसाई लैटिन में angelus सामान्यतः अलौकिक ‘स्वर्गदूत’ को सूचित करता है; इसलिए केवल नाम ‘मलाकी’ के व्युत्पत्तिगत अर्थ के आधार पर इसे सामान्य मानवीय ‘संदेशवाहक’ नहीं बनाया गया।
- source_word: qui
  choice: जो
  rationale: पुल्लिंग एकवचन संबंधवाचक सर्वनाम निकटतम नाम ‘मलाकी’ की ओर संकेत करता है; अनुवाद में इसी एकवचन संबंध को बनाए रखा गया है।
- source_word: uocatus est
  choice: कहलाता है
  rationale: यह वर्तमान में प्रचलित उपाधि व्यक्त करने वाला स्वाभाविक हिन्दी रूप है और लैटिन के ‘कहा/पुकारा गया है’ का आशय सहज ढंग से देता है।
theological_decisions:
- issue: क्या पद मलाकी को ‘प्रभु का स्वर्गदूत’ कहता है या केवल उसके नाम का अर्थ बताता है?
  choice: मुख्य पाठ में मलाकी के लिए ‘प्रभु का स्वर्गदूत’ उपाधि रखी गई है।
  alternative: ‘प्रभु का दूत/संदेशवाहक’ कहकर इसे नाम की व्युत्पत्ति की व्याख्या मानना।
  rationale: लैटिन पाठ स्पष्टतः angelus domini कहता है और qui एकवचन में मलाकी से जुड़ता है। फिर भी ‘दूत’ वाला व्यापक अर्थ और नाम की शब्द-संबंधी पृष्ठभूमि टिप्पणी में सुरक्षित रखी गई है, ताकि पाठ से अधिक निश्चित धार्मिक पहचान न थोपी जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में परिचित बाइबलीय नाम-रूप और गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘स्वर्गदूत’ से लैटिन angelus का प्रमुख अर्थ सुरक्षित है, जबकि उद्धरण-चिह्न उपाधि को स्पष्ट करते हैं। समापन उद्धरण-चिह्न प्रसंग में चल रहे कथन के अंत को बनाए रखता है।
