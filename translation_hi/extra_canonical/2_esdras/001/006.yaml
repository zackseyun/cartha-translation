source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quia peccata parentum illorum in illis creuerunt: obliti enim me sacrificauerunt diis alienis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/006.yaml
  text: For the sins of their fathers have increased in them; for they forgot me and sacrificed to foreign gods.
translation:
  language: hi
  text: क्योंकि उनके पूर्वजों के पाप उनमें बढ़ गए; वे मुझे भूल गए और पराए देवताओं के लिए बलिदान चढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peccata parentum illorum
  choice: उनके पूर्वजों के पाप
  rationale: ‘parentum’ माता-पिता अथवा पूर्वजों को सूचित कर सकता है; इस सामूहिक और पीढ़ीगत संदर्भ में ‘पूर्वजों’ अधिक स्वाभाविक है।
- source_word: in illis creuerunt
  choice: उनमें बढ़ते गए
  rationale: लैटिन की स्थानगत अभिव्यक्ति और पापों के निरंतर बढ़ने का भाव सुरक्षित रखा गया है।
- source_word: obliti enim me
  choice: वे मुझे भूल गए
  rationale: मूल के प्रत्यक्ष संबंध और कारणसूचक प्रवाह को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: diis alienis
  choice: पराए देवताओं
  rationale: ‘alienis’ का अर्थ अपने परमेश्वर से भिन्न अथवा दूसरे देवता है; ‘पराए’ मूल की संबंधपरक धारणा को बनाए रखता है।
- source_word: sacrificauerunt
  choice: बलि चढ़ाई
  rationale: धार्मिक बलिदान के लिए प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी अभिव्यक्ति।
theological_decisions:
- issue: पूर्वजों के पापों का बाद की पीढ़ी में बढ़ना
  choice: पापों को ‘उनमें बढ़ते गए’ कहा गया है
  alternative: उन पर पूर्वजों का दोष आरोपित करना
  rationale: मूल पाठ यह कहता है कि पाप बाद की पीढ़ी में बढ़े; वह यहाँ विरासत में मिले दोष की कोई विस्तृत धर्मवैज्ञानिक व्याख्या नहीं देता। अनुवाद इस तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठकों के लिए स्पष्ट, किंतु शास्त्रीय गरिमा बनाए रखने वाला वाक्य-विन्यास। ‘क्योंकि’ से पिछले कथन के साथ मूल का कारणसूचक संबंध रखा गया है।
