  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ad tutelam dedi, et illic murmurastis, Et non triumphastis in nomine meo de perditione inimicorum uestrorum, sed adhuc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/016.yaml
  text: I gave for protection[a], and there you grumbled. You did not exult in my name over the destruction of your enemies, but still
translation:
  language: hi
  text: मैंने रक्षा के लिए दिया था, और वहाँ तुम बड़बड़ाए। तुम मेरे नाम में अपने शत्रुओं के विनाश पर आनन्दित नहीं हुए, बल्कि अब भी—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी पाठ यहाँ ‘बल्कि अब भी’ पर अधूरा समाप्त होता है।
    reason: मूल पाठ की अपूर्ण वाक्य-रचना स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ad tutelam
  choice: रक्षा के लिए
  rationale: लातीनी पद उद्देश्य या संरक्षण का भाव व्यक्त करता है; हिन्दी में यह सीधा और स्वाभाविक समतुल्य है।
- source_word: murmurastis
  choice: तुम कुड़कुड़ाए
  rationale: यह असन्तोष भरी शिकायत या बड़बड़ाहट को व्यक्त करता है; ‘कुड़कुड़ाए’ आधुनिक हिन्दी में इस भाव को सहजता से रखता है।
- source_word: triumphastis
  choice: आनन्द नहीं मनाया
  rationale: यहाँ de perditione के साथ क्रिया शत्रुओं के विनाश पर उल्लास मनाने का अर्थ देती है, न कि उस विनाश को पराजित करने का।
- source_word: in nomine meo
  choice: मेरे नाम में
  rationale: मूल का धार्मिक और संबंधसूचक वाक्यांश बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: sed adhuc
  choice: बल्कि अब भी—
  rationale: उपलब्ध लातीनी पाठ इसी अधूरे विरोधसूचक पद पर समाप्त होता है; डैश उस अपूर्णता को ईमानदारी से दर्शाता है।
theological_decisions:
- issue: शत्रुओं के विनाश पर उल्लास का कथन
  choice: ‘अपने शत्रुओं के विनाश पर मेरे नाम में आनन्द नहीं मनाया’
  alternative: ‘मेरे नाम में अपने शत्रुओं के विनाश पर विजय नहीं पाई’
  rationale: de + ablative यहाँ विनाश के विषय या कारण पर उल्लास का संकेत देता है। चुना हुआ अनुवाद विजय प्राप्त करने का अतिरिक्त अर्थ नहीं जोड़ता और कथन के नैतिक-धार्मिक तनाव को यथावत रखता है।
- issue: आरम्भिक वाक्य में कर्म का अभाव
  choice: ‘मैंने रक्षा के लिए दिया’
  alternative: पिछले सन्दर्भ से कोई अनुमानित कर्म जोड़ना
  rationale: लातीनी अंश में dedi का स्पष्ट कर्म नहीं है; हिन्दी में भी उसे नहीं जोड़ा गया, ताकि स्रोत की पाठगत स्थिति और अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कुड़कुड़ाए’ शिकायतपूर्ण murmurastis का सहज रूप है; अन्त का डैश और पादटिप्पणी स्रोत में विद्यमान अपूर्णता को सुरक्षित रखते हैं।
