source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non ignem uobis pro blasphemiis dedi, sed mittens lignum in aqua dulce feci flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/023.yaml
  text: I did not give you fire for your blasphemies, but by casting wood into the water I made the stream sweet.
translation:
  language: hi
  text: मैंने तुम्हारी निन्दाओं के कारण तुम्हें आग नहीं दी, बल्कि पानी में लकड़ी डालकर धारा का पानी मीठा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: blasphemiis
  choice: निन्दाओं
  rationale: यहाँ बहुवचन का भाव बनाए रखते हुए परमेश्वर के विरुद्ध अपमानजनक शिकायतों या वचनों का अर्थ व्यक्त करता है; केवल आधुनिक कानूनी-धार्मिक पदावली तक सीमित नहीं करता।
- source_word: lignum
  choice: लकड़ी
  rationale: लैटिन शब्द का सीधा और स्वाभाविक अर्थ; निर्गमन 15 की घटना से संबंध स्पष्ट रहता है, पर पाठ से बाहर जाकर इसे किसी विशिष्ट प्रकार की लकड़ी नहीं कहा गया।
- source_word: dulce feci flumen
  choice: धारा का पानी मीठा कर दिया
  rationale: शाब्दिक 'धारा को मीठा किया' की अपेक्षा हिन्दी में अधिक स्वाभाविक है और खारे या कड़वे पानी को पीने योग्य बनाने का आशय बनाए रखता है।
theological_decisions:
- issue: आग न देने और पानी मीठा करने के बीच विरोध
  choice: कारण और दयापूर्ण प्रत्युत्तर दोनों को स्पष्ट रखते हुए 'नहीं... बल्कि...' संरचना रखी गई
  alternative: '''तुम्हारी निन्दाओं के बदले मैंने तुम्हें आग नहीं दी; मैंने लकड़ी...'''
  rationale: मूल के non... sed विरोध को सुरक्षित रखता है और यह स्पष्ट करता है कि दण्ड की जगह उपकार किया गया, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठक के लिए स्पष्ट और गरिमापूर्ण। प्रथम पुरुष कर्ता को दूसरे खंड में क्रिया-रूप से बनाए रखा गया है; 'तुम्हें' मूल के बहुवचन संबोधन का स्वाभाविक हिन्दी रूप है।
