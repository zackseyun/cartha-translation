base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/031.yaml
  text: When you bring offerings to me[a], I will turn my face from you; for I have rejected your feast days and new moons and circumcisions of the flesh.
translation:
  language: hi
  text: जब तुम मेरे लिए भेंटें चढ़ाओगे[a], तब मैं अपना मुख तुमसे फेर लूँगा; क्योंकि मैंने तुम्हारे पर्वों, नवचंद्रों और शारीरिक खतनों को ठुकरा दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अध्याय उस बाद की ईसाई परत का भाग है जिसे प्रायः ‘5 एज्रा’ कहा जाता है। ‘पर्वों ... नवचंद्रों और शारीरिक खतनों’ की इसकी अस्वीकृति उसी परत के विवादात्मक स्वर को दर्शाती है; इसे अध्याय 3–14 के यहूदी प्रकाशना-ग्रंथ की धर्ममीमांसा के साथ एक नहीं समझना चाहिए।
    reason: compositional_layer
lexical_decisions:
- source_word: obtulleritis
  choice: जब तुम मेरे लिए भेंटें चढ़ाओगे
  rationale: लातीनी क्रिया offerre का भाव धार्मिक भेंट अर्पित करना है; उपलब्ध पाठ में शर्त/काल-सूचक अर्थ है, इसलिए स्वाभाविक हिन्दी में ‘जब ... चढ़ाओगे’ रखा गया।
- source_word: auertam faciem meam a uobis
  choice: तब मैं तुमसे अपना मुख फेर लूँगा
  rationale: मूल रूपक को बनाए रखते हुए भविष्यकाल और दूरी/अस्वीकृति का भाव व्यक्त किया गया।
- source_word: dies enim festos uestros
  choice: क्योंकि मैंने तुम्हारे पर्वों
  rationale: dies festos धार्मिक उत्सव-दिनों को सूचित करता है; ‘पर्व’ संक्षिप्त, वर्तमान और गरिमापूर्ण विकल्प है।
- source_word: neomenias
  choice: नए चाँद के उत्सवों
  rationale: neomenia मासारंभ के नवचंद्र-पालन को दर्शाता है; केवल ‘नए चाँद’ की अपेक्षा ‘उत्सवों’ जोड़ने से धार्मिक अनुष्ठान का आशय स्पष्ट होता है।
- source_word: circumcisiones carnis
  choice: शरीर के खतनों
  rationale: बहुवचन और carnis की शारीरिक विशेषता दोनों सुरक्षित रखी गईं; पाठ के विवादात्मक स्वर को नरम या धर्मवैज्ञानिक रूप से पुनर्व्याख्यायित नहीं किया गया।
- source_word: repudiavi
  choice: ठुकरा दिया है
  rationale: यह क्रिया स्पष्ट अस्वीकृति व्यक्त करती है; हिन्दी पूर्ण भूत वर्तमान परिणाम को स्वाभाविक ढंग से दर्शाता है।
theological_decisions:
- issue: पर्वों, नवचंद्र-पालन और शारीरिक खतने की अस्वीकृति
  choice: कथन को उसके तीखे, विवादात्मक रूप में यथावत रखा गया और [a] में रचनात्मक परत का संदर्भ दिया गया।
  alternative: इसे अध्याय 3–14 के यहूदी प्रकाशना-साहित्य की समग्र धर्ममीमांसा या सभी कालों के लिए सार्वभौमिक निषेध मानना।
  rationale: अध्याय 1 बाद की ईसाई परत, प्रायः ‘5 एज्रा’, से संबंधित माना जाता है; टिप्पणी पाठ की ऐतिहासिक-साहित्यिक स्थिति स्पष्ट करती है, पर मुख्य पाठ के तनाव को हल नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘मुख फेर लेना’ जैसे मूल रूपक को सुरक्षित रखा गया है। ‘खतना’ आम पाठकों के लिए प्रचलित शब्द है, और बहुवचन मूल लातीनी पाठ के अनुरूप है।
