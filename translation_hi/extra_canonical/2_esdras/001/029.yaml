id: 2ES.1.29
reference: 2 Esdras 1:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vt essetis mihi in populum, et ego uobis in deum, et uos mihi in filios, et ego uobis in patrem ? Ita uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/029.yaml
  text: that you should be my people[a], and I should be your God, and you should be my sons, and I should be your father?
translation:
  language: hi
  text: कि तुम मेरी प्रजा होते, और मैं तुम्हारा परमेश्वर होता; तुम मेरे पुत्र[a] होते, और मैं तुम्हारा पिता होता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संतान’।
    reason: लैटिन ‘filios’ का सीधा अर्थ ‘पुत्र’ है, पर संबोधित पूरे समुदाय के संदर्भ में इसे व्यापक अर्थ में ‘संतान’ भी समझा जा सकता है।
lexical_decisions:
- source_word: populum
  choice: प्रजा
  rationale: यह सामूहिक अर्थ में परमेश्वर के अपने लोगों को दर्शाता है और ‘मेरी प्रजा—तुम्हारा परमेश्वर’ की वाचागत भाषा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: deum
  choice: परमेश्वर
  rationale: लैटिन ‘deum’ का प्रसंगानुकूल, प्रतिष्ठित और सामान्य हिन्दी बाइबलीय समतुल्य।
- source_word: filios
  choice: पुत्र
  rationale: मूल में पुल्लिंग बहुवचन ‘filios’ है; ‘पुत्र’ पिता-पुत्र की स्पष्ट छवि और निकटवर्ती पद से शब्दगत संबंध सुरक्षित रखता है।
- source_word: patrem
  choice: पिता
  rationale: यह ‘पुत्र’ के साथ मूल के पारिवारिक समानांतर को सीधे बनाए रखता है।
theological_decisions:
- issue: ‘filios’ का लिंग-विशिष्ट या समावेशी अनुवाद
  choice: मुख्य पाठ में ‘पुत्र’
  alternative: ‘संतान’
  rationale: लैटिन स्पष्टतः ‘filios’ कहता है, इसलिए मुख्य पाठ में पुत्रत्व की छवि सुरक्षित रखी गई है; व्यापक सामूहिक अर्थ की सम्भावना पादटिप्पणी में दी गई है।
- issue: परमेश्वर और पिता के साथ संबंधसूचक वाक्य-विन्यास
  choice: दोनों खंडों में ‘होता’ को व्यक्त करना
  alternative: दूसरे पद को लुप्त मानकर ‘मैं तुम्हारा परमेश्वर’ और ‘मैं तुम्हारा पिता’
  rationale: हिन्दी में समानांतर और काल/भाव स्पष्ट रखने के लिए क्रिया दोहराई गई है, जबकि लैटिन के अपूर्ण संभावनार्थक ‘essetis/essem’ का तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज और स्रोत-सन्निकट शैली। आरम्भिक ‘कि’ और अंतिम प्रश्नचिह्न इस पद को पिछले प्रश्न की आश्रित पूर्ति के रूप में रखते हैं। स्रोत के अंत का ‘Ita uos’ अधूरा अगला खंड प्रतीत होता है और अंग्रेज़ी परामर्श-पाठ में भी इस पद का भाग नहीं माना गया है, इसलिए इसे यहाँ शामिल नहीं किया गया।
