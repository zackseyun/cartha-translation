translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद पूर्ववर्ती वाक्य से जुड़ी वंशावली का अंश है, इसलिए स्रोत की तरह अंत में अल्पविराम रखा गया है। सभी नाम देवनागरी में ऐसे दिए गए हैं कि पुरोहित वंशावली की पहचान बनी रहे।
