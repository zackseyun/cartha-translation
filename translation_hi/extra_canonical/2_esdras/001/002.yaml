lexical_decisions:
- source_word: Filii
  choice: का पुत्र
  rationale: वंशावली की प्रत्येक कड़ी को स्वाभाविक हिन्दी में व्यक्त करता है; लैटिन में रूप एकवचन संबंधसूचक है।
- source_word: Achiae
  choice: अहियाह
  rationale: लैटिन नामरूप Achias/Achiae का प्रचलित बाइबलीय हिन्दी लिप्यंतरण; पाठ में संभावित नामांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Finees
  choice: पीनहास
  rationale: परंपरागत बाइबलीय नाम Phinehas का स्पष्ट आधुनिक हिन्दी रूप।
- source_word: Aziei
  choice: अजयाह
  rationale: लैटिन Aziei के निकट नामरूप Aziah को हिन्दी ध्वन्यात्मकता में प्रस्तुत करता है।
- source_word: Marimoth
  choice: मरायोत
  rationale: पुरोहित वंशावली के Meraioth नाम का परिचित हिन्दी रूप।
- source_word: Oziae
  choice: उज्जियाह
  rationale: लैटिन Oziae को Uzzi के बजाय Uzziah के अनुरूप प्रस्तुत करता है, जिससे स्रोत का पूर्ण नामरूप बना रहता है।
- source_word: Abissei
  choice: अबीशू
  rationale: यह एज्रा की पुरोहित वंशावली के Abishua का नामरूप है; इसे भिन्न व्यक्ति अबीशै के रूप में नहीं लिया गया।
- source_word: Eleazar
  choice: एलिआज़र
  rationale: नाम का मानक और पहचानने योग्य हिन्दी लिप्यंतरण।
