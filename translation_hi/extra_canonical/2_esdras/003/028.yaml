  text: Then I said in my heart[28], ‘Do those who live in Babylon act better, and is that why Zion is ruled?’
translation:
  language: hi
  text: तब मैंने अपने मन में कहा, “क्या बाबुल में रहनेवाले लोग बेहतर आचरण करते हैं, और क्या इसी कारण सिय्योन शासन करेगा?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ लातीनी पाठ असहज है और संभव है कि प्रतिलिपि-परंपरा में यह पंक्ति बिगड़ गई हो। लातीनी में क्रिया सक्रिय भविष्यकाल में है और व्याकरणतः ‘सिय्योन’ उसका कर्ता है, यद्यपि यह निकटवर्ती प्रसंग में सिय्योन की दुर्दशा के विपरीत प्रतीत होता है। इसलिए अनुवाद इस कठिन वाक्य-रचना को बनाए रखता है, बिना किसी सहज पुनर्निर्माण को निश्चित मानने के।
    reason: alternative_reading
lexical_decisions:
- source_word: meliora faciunt
  choice: बेहतर आचरण करते हैं
  rationale: शाब्दिक अर्थ ‘अधिक अच्छी बातें/काम करते हैं’ है; प्रसंग में नैतिक तुलना व्यक्त करने के लिए ‘बेहतर आचरण’ स्वाभाविक और सटीक है।
- source_word: qui habitant in Babylone
  choice: बाबुल में रहनेवाले लोग
  rationale: लातीनी पदबंध का सीधा और सहज हिन्दी रूप।
- source_word: dominabit Sion
  choice: सिय्योन पर शासन होता है
  rationale: 'लातीनी वाक्यांश व्याकरण की दृष्टि से कठिन है: dominabit सक्रिय भविष्यकाल है, पर उसका कर्ता व्यक्त नहीं किया गया। हिन्दी में यह रूप सिय्योन के अधीन होने का आशय बनाए रखता है और किसी अनिर्दिष्ट कर्ता को बाबुल मानकर जोड़ने से बचता है।'
theological_decisions:
- issue: बाबुल की समृद्धि और सिय्योन की अधीनता के बीच कथित नैतिक कारण-संबंध
  choice: दोनों खंडों को एक अलंकारिक प्रश्न के रूप में रखा गया है
  alternative: यह स्पष्ट कर देना कि बाबुल ने अपने बेहतर आचरण के कारण सिय्योन पर अधिकार पाया
  rationale: मूल पाठ प्रश्न और शिकायत का तनाव बनाए रखता है; वह न तो बाबुल की धार्मिक श्रेष्ठता स्वीकार करता है, न शासक को स्पष्ट रूप से पहचानता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और प्रश्नात्मक शैली। ‘मन में कहा’ बाइबिलीय मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
