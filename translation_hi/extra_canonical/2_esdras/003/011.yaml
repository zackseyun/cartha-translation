source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dereliquisti autem unum ex his, id Noe cum domo sua, ex eo iustos omnes.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/011.yaml
  text: But you left one of them, Noah with his household; from him came all the righteous.
translation:
  language: hi
  text: परन्तु उनमें से एक को—अर्थात नूह को उसके घराने समेत—तूने बचाए रखा; और उसी से सभी धर्मी उत्पन्न हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dereliquisti
  choice: तूने बचाए रखा
  rationale: यहाँ क्रिया का भाव बाकी लोगों के बीच एक व्यक्ति को जीवित/शेष छोड़ देने का है; ‘बचाए रखा’ आधुनिक हिन्दी में इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: unum ex his, id Noe
  choice: उनमें से एक को—अर्थात नूह को
  rationale: लातीनी व्याख्यात्मक संरचना में पहले ‘एक’ और फिर उसकी पहचान ‘नूह’ के रूप में दी गई है; हिन्दी में डैश और ‘अर्थात’ से यह संबंध स्पष्ट रहता है।
- source_word: cum domo sua
  choice: उसके घराने समेत
  rationale: domus यहाँ केवल भवन नहीं, नूह के परिवार/गृहस्थ समुदाय को दर्शाता है; ‘घराना’ बाइबिलीय गरिमा और व्यापक पारिवारिक अर्थ दोनों बनाए रखता है।
- source_word: ex eo
  choice: उसी से
  rationale: नूह को पूर्ववर्ती संदर्भ मानते हुए वंशगत उद्गम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: iustos omnes
  choice: सभी धर्मी
  rationale: iustus का पारंपरिक और प्रसंगानुकूल धार्मिक-नैतिक समतुल्य ‘धर्मी’ है; omnes पर बल बनाए रखने के लिए ‘सभी’ रखा गया है।
theological_decisions:
- issue: ‘सभी धर्मी’ का नूह से उत्पन्न होना
  choice: और उसी से सभी धर्मी उत्पन्न हुए
  alternative: और उससे वे सभी उत्पन्न हुए जो धर्मी थे
  rationale: मूल पाठ की व्यापक और संभावित रूप से तनावपूर्ण अभिव्यक्ति को सीमित या व्याख्यायित किए बिना सुरक्षित रखा गया है। ‘उत्पन्न हुए’ वंशगत अर्थ को व्यक्त करता है, पर ‘धर्मी’ की परिभाषा में अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबिलीय शैली अपनाई गई है। परमेश्वर को संबोधन में ‘तूने’ मूल के एकवचन संबोधन को बनाए रखता है। वाक्य मूल लातीनी संरचना के निकट है, पर हिन्दी में सहजता के लिए व्याख्यात्मक डैश और संयोजक ‘और’ का प्रयोग किया गया है।
