  yaml_path: translation/extra_canonical/2_esdras/003/022.yaml
  text: Thus weakness became permanent, and the law was in the heart of the people with the evil root; and what was good departed, and what was evil remained.
translation:
  language: hi
  text: इस प्रकार दुर्बलता स्थायी हो गई, और लोगों के हृदय में व्यवस्था बुरी जड़ के साथ थी; जो भला था वह चला गया, और जो बुरा था वह बना रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: permanens infirmitas
  choice: दुर्बलता स्थायी हो गई
  rationale: लैटिन पदबंध में दुर्बलता के टिकाऊ या स्थायी हो जाने का भाव है; यह हिंदी में स्वाभाविक रहते हुए स्रोत की संरचना को सुरक्षित रखता है।
- source_word: lex
  choice: व्यवस्था
  rationale: यहाँ lex से आशय परमेश्वर की दी हुई विधि या व्यवस्था है; बाइबलीय हिंदी में “व्यवस्था” स्पष्ट और प्रचलित है।
- source_word: malignitate radicis
  choice: बुरी जड़
  rationale: अंग्रेज़ी परामर्श-पाठ के “evil root” और लैटिन के नकारात्मक नैतिक भाव को संक्षिप्त, सहज हिंदी में व्यक्त करता है।
- source_word: discessit quod bonum est
  choice: जो भला था वह चला गया
  rationale: discessit के अलग हो जाने या चले जाने के अर्थ तथा quod bonum est की सामान्य नैतिक व्यापकता को बनाए रखता है।
- source_word: mansit
  choice: जो बुरा था वह बना रहा
  rationale: लैटिन में अंतिम कर्ता प्रसंग से समझा जाता है; पूर्ववर्ती संतुलित विरोध और प्रमाणित परामर्श-पाठ के आधार पर हिंदी में उसे स्पष्ट किया गया है।
theological_decisions:
- issue: व्यवस्था और बुरी जड़ का एक ही हृदय में होना
  choice: “व्यवस्था बुरी जड़ के साथ रही” कहकर दोनों की सह-अवस्थिति बनाए रखी गई है।
  alternative: ऐसा अनुवाद करना कि बुरी जड़ ने व्यवस्था को भ्रष्ट कर दिया या उसका स्थान ले लिया।
  rationale: स्रोत केवल दोनों के साथ होने की बात कहता है; वह उनके संबंध की विस्तृत धर्मवैज्ञानिक व्याख्या नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। वाक्य का समानांतर विरोध—भला चला गया, बुरा बना रहा—स्रोत के प्रभाव को बनाए रखता है।
