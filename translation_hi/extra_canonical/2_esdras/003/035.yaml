  yaml_path: translation/extra_canonical/2_esdras/003/035.yaml
  text: Or when have those who dwell on the earth not sinned in your sight? Or what nation has so kept your commandments?
translation:
  language: hi
  text: या पृथ्वी पर रहने वालों ने कब तेरी दृष्टि में पाप नहीं किया? या किस राष्ट्र ने तेरी आज्ञाओं का इस प्रकार पालन किया है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in conspectu tuo
  choice: तेरी दृष्टि में
  rationale: लैटिन पदबंध का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; यह परमेश्वर के सामने उत्तरदायित्व का भाव बनाए रखता है।
- source_word: qui habitant terram
  choice: पृथ्वी पर रहनेवालों
  rationale: स्रोत के व्यापक मानवीय संकेत को बिना किसी अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: gens
  choice: जाति
  rationale: यहाँ इसका अर्थ किसी राष्ट्र या जनसमुदाय से है; ‘जाति’ बाइबलीय हिन्दी में इस व्यापक अर्थ को संक्षेप में वहन करती है।
- source_word: sic observavit mandata tua
  choice: तेरी आज्ञाओं का इस प्रकार पालन किया है
  rationale: ‘observavit’ के मानने/पालन करने के भाव और ‘sic’ के इस प्रकार/इतनी निष्ठा से वाले बल को सुरक्षित रखता है।
theological_decisions:
- issue: सभी पृथ्वीवासियों के पाप करने का आलंकारिक प्रश्न
  choice: नकारात्मक प्रश्नरूप को ज्यों का त्यों रखा गया
  alternative: ‘पृथ्वी पर रहनेवाले सभी लोगों ने तेरी दृष्टि में पाप किया है’
  rationale: स्रोत प्रत्यक्ष सिद्धांत-वाक्य नहीं, बल्कि प्रश्न के द्वारा सार्वभौमिक पापशीलता पर बल देता है; उसे कथन में बदलने से वक्तृत्व और तनाव घट जाता।
- issue: आज्ञापालन की सीमा
  choice: ‘इस प्रकार पालन किया है’
  alternative: ‘पूरी तरह पालन किया है’
  rationale: लैटिन ‘sic’ स्पष्ट रूप से ‘पूरी तरह’ नहीं कहता; इसलिए अधिक पूर्णतावादी अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और प्रार्थनात्मक संबोधन रखा गया है। ‘तेरी/तेरी’ एकवचन निकट संबोधन स्रोत के ‘tuo/tua’ के अनुरूप है। कोई पाद-टिप्पणी आवश्यक नहीं।
