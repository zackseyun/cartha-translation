  text: जिसका नाम अब्राहम था। और तूने उससे प्रेम किया और उसे दिखाया
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nomen erat Abraham
  choice: जिसका नाम अब्राहम था
  rationale: लातीनी वाक्यांश के संबंधवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: dilexisti eum
  choice: तूने उससे प्रेम किया
  rationale: प्रत्यक्ष ईश-संबोधन में एकवचन ‘तू’ बनाए रखते हुए dilexisti और eum का स्पष्ट अर्थ देता है।
- source_word: demonstrasti ei
  choice: उस पर प्रकट किया
  rationale: demonstrasti को प्रसंगानुकूल ‘प्रकट किया’ और ei को ‘उस पर’ से व्यक्त करता है; आगे आने वाली, यहाँ अनुपस्थित कर्म-वस्तु के लिए वाक्य को खुला रखता है।
theological_decisions:
- issue: अब्राहम के प्रति परमेश्वर के प्रेम और प्रकाशन का कथन
  choice: ‘तूने उससे प्रेम किया और उस पर प्रकट किया’
  alternative: ‘तूने उससे प्रेम किया और उसे दिखाया’
  rationale: ‘प्रकट किया’ प्रकाशन-संबंधी अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि उपलब्ध अंश में प्रकट की गई वस्तु नहीं है; अनुवाद उस अपूर्णता को बिना अतिरिक्त सामग्री जोड़े बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर को संबोधित एकवचन ‘तू’ मूल के द्वितीय पुरुष एकवचन और प्रार्थनात्मक निकटता को बनाए रखता है। उपलब्ध लातीनी अंश जहाँ समाप्त होता है, हिन्दी भी वहीं जानबूझकर अपूर्ण रहती है।
