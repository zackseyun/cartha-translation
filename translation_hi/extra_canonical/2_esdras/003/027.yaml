translation:
  language: hi
  text: और आपने अपने नगर को अपने शत्रुओं के हाथों में सौंप दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tradidisti
  choice: सौंप दिया
  rationale: यह लैटिन क्रिया के हस्तांतरण या अधिकार में दे देने के भाव को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: civitatem tuam
  choice: अपने नगर को
  rationale: ‘नगर’ civitas के लिए इस प्रसंग में सहज और गरिमापूर्ण हिन्दी है; ‘अपने’ द्वितीय पुरुष एकवचन संबंध को बनाए रखता है।
- source_word: in manus inimicorum tuorum
  choice: अपने शत्रुओं के हाथों में
  rationale: मूल रूपक को ज्यों का त्यों रखते हुए शत्रुओं के अधिकार में दिए जाने का भाव व्यक्त होता है।
theological_decisions:
- issue: नगर को शत्रुओं के हाथ सौंपने में परमेश्वर की सक्रिय भूमिका
  choice: ‘आपने ... सौंप दिया’ के रूप में सक्रिय कथन बनाए रखा गया
  alternative: ‘नगर शत्रुओं के हाथों में पड़ गया’
  rationale: मूल पाठ परमेश्वर को स्पष्ट रूप से कर्ता बताता है; निष्क्रिय अनुवाद इस धर्मवैचारिक तनाव को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग। वाक्य संक्षिप्त, स्वाभाविक और मूल लैटिन की प्रत्यक्षता के अनुरूप है।
