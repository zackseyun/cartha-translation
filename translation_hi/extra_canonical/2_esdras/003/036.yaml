- from: हाँ, तुम्हें ऐसे मनुष्य तो नाम लेकर मिल सकते हैं जिन्होंने तुम्हारी आज्ञाओं का पालन किया है, पर ऐसी जातियाँ तुम्हें नहीं मिलेंगी।
  to: तुम्हें नाम लेकर ऐसे मनुष्य तो मिलेंगे जिन्होंने तुम्हारी आज्ञाओं का पालन किया है, पर राष्ट्र तुम्हें नहीं मिलेंगे।
