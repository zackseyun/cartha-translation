  yaml_path: translation/extra_canonical/2_esdras/003/036.yaml
  text: Men indeed, by name, you may find who have kept your commandments, but nations you will not find.
translation:
  language: hi
  text: तुम्हें नाम लेकर ऐसे मनुष्य तो मिलेंगे जिन्होंने तुम्हारी आज्ञाओं का पालन किया है, पर राष्ट्र तुम्हें नहीं मिलेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homines
  choice: मनुष्य
  rationale: यह सामान्य रूप से व्यक्तियों को सूचित करता है; आधुनिक मानक हिन्दी में ‘मनुष्य’ गरिमापूर्ण और स्वाभाविक है।
- source_word: quidem
  choice: हाँ ... तो
  rationale: लैटिन में यह अगले विरोधी खंड ‘autem’ के साथ स्वीकारोक्ति और विरोध की संरचना बनाता है; हिन्दी में ‘हाँ ... तो ... पर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: per nomina
  choice: नाम लेकर
  rationale: शाब्दिक अर्थ ‘नामों के द्वारा’ है; प्रसंग में आशय अलग-अलग पहचाने जा सकने वाले व्यक्तियों से है। ‘नाम लेकर’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: servasse mandata tua
  choice: तुम्हारी आज्ञाओं का पालन किया है
  rationale: यह पूर्ण क्रिया-भाव को स्पष्ट करता है और हिन्दी में आज्ञाओं को मानने/पालन करने की प्रचलित धार्मिक अभिव्यक्ति है।
- source_word: gentes
  choice: जातियाँ
  rationale: यह व्यक्तियों के विपरीत सामूहिक जनसमुदायों या राष्ट्रों को सूचित करता है। ‘जातियाँ’ बाइबलीय प्रसंग में व्यापक सामुदायिक अर्थ रखता है, न कि केवल आधुनिक सामाजिक जाति-व्यवस्था का अर्थ।
- source_word: non invenies
  choice: तुम्हें नहीं मिलेंगी
  rationale: ‘तुम नहीं पाओगे’ की तुलना में यह हिन्दी में खोजे जाने और उपलब्ध होने का अर्थ अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: व्यक्तिगत और सामूहिक आज्ञापालन के बीच विरोध
  choice: ऐसे व्यक्तियों का मिलना जिन्होंने आज्ञाएँ मानी हैं, पर ऐसी जातियों का न मिलना
  alternative: किसी भी जाति के किसी व्यक्ति ने आज्ञाएँ नहीं मानीं
  rationale: स्रोत स्पष्ट रूप से homines और gentes में विरोध करता है; अनुवाद इस तनाव को बनाए रखता है और सामूहिक कथन को व्यक्तियों पर लागू नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘जातियाँ’ को ‘राष्ट्र’ से अधिक व्यापक रखा गया है, क्योंकि लैटिन gentes राजनीतिक राष्ट्रों तक सीमित नहीं है।
