source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo pondera in statera nostras iniquitates et eorum qui habitant in saeculo, et invenietur momentum puncti ubi declinet.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/034.yaml
  text: Now therefore weigh our iniquities in the balance[a], and those of the inhabitants of the world; and it will be found at what point it inclines.
translation:
  language: hi
  text: इसलिए अब हमारे अधर्मों को और संसार में रहने वालों के अधर्मों को तराज़ू पर तौल; तब पता चलेगा कि तराज़ू की सूई किस ओर झुकती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pondera in statera
  choice: तराज़ू पर तौल
  rationale: लातीनी तौलने की प्रत्यक्ष उपमा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: iniquitates
  choice: अधर्मों
  rationale: यह नैतिक दोष और अन्याय दोनों की गंभीरता व्यक्त करता है तथा बहुवचन को सुरक्षित रखता है।
- source_word: qui habitant in saeculo
  choice: संसार में रहनेवालों
  rationale: saeculum का यहाँ आशय वर्तमान मानव-जगत से है; यह वाक्यांश सामान्य पाठक के लिए स्पष्ट है।
- source_word: momentum puncti ubi declinet
  choice: पलड़ा किस ओर झुकता है
  rationale: शाब्दिक संरचना संदिग्ध और हिन्दी में अस्वाभाविक है; प्रसंग तराज़ू के झुकाव से तुलना का परिणाम बताता है। 'किस ओर' ubi declinet की अप्रत्यक्ष प्रश्नवाचकता को व्यक्त करता है।
theological_decisions:
- issue: ‘हमारे’ और ‘संसार में रहनेवालों’ के अधर्मों की तुलनात्मक तौल
  choice: दोनों समूहों को समानांतर कर्म के रूप में रखा गया
  alternative: दूसरे समूह को ‘हमारे अधर्मों’ के साथ अस्पष्ट रूप से जोड़ना
  rationale: लातीनी nostras iniquitates et eorum स्पष्ट तुलना कराता है; अनुवाद किसी पक्ष को अधिक या कम दोषी पहले से नहीं ठहराता।
- issue: अंतिम खंड में तराज़ू की छवि
  choice: ‘पलड़ा किस ओर झुकता है’
  alternative: ‘किस बिंदु पर वह झुकता है’
  rationale: momentum puncti का सटीक तकनीकी अर्थ अनिश्चित हो सकता है, पर पूरे वाक्य में तौल के परिणाम और झुकाव की छवि स्पष्ट है। स्वाभाविक हिन्दी में धार्मिक निष्कर्ष जोड़े बिना वही तनाव रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। आज्ञार्थक एकवचन ‘तौल’ प्रार्थना में परमेश्वर को किए गए संबोधन के अनुरूप है। ‘तराज़ू’ और ‘पलड़ा’ मूल रूपक को स्पष्ट और जीवंत रखते हैं।
