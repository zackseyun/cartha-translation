translation:
  language: hi
  text: उसको, और तूने उसे इसहाक दिया, और इसहाक को तूने याकूब और एसाव दिए। और तूने याकूब को अपने लिए अलग किया, पर एसाव को अलग कर दिया, और याकूब बन गया
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: segregasti tibi
  choice: अपने लिए अलग किया
  rationale: लातीनी पदबंध में परमेश्वर के लिए विशेष रूप से अलग करने का भाव है; यह अनुवाद उसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: separasti
  choice: दूर कर दिया
  rationale: पहले ‘अलग किया’ से विरोध बनाए रखते हुए एसाव के बहिष्करण अथवा दूरी के भाव को व्यक्त करता है, बिना उसके आशय को अधिक स्पष्ट किए।
- source_word: factus est
  choice: बन गया
  rationale: स्रोत की अपूर्ण अंतिम उपवाक्य-रचना को ज्यों का त्यों खुला रखता है।
theological_decisions:
- issue: याकूब और एसाव के प्रति भिन्न क्रियाओं का आशय
  choice: याकूब को ‘अपने लिए अलग किया’ और एसाव को ‘दूर कर दिया’
  alternative: दोनों के लिए केवल ‘अलग किया’
  rationale: लातीनी पाठ segregasti tibi और separasti में जो विरोध तथा धार्मिक तनाव रखता है, उसे बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- issue: खंडित पद का आरंभ और अंत
  choice: आरंभ में ‘उसके’ और अंत में ‘बन गया’ को अपूर्ण रखा
  alternative: पूर्ववर्ती और अगले पद से अनुमान लगाकर वाक्य पूर्ण करना
  rationale: दिया गया स्रोत दोनों ओर वाक्यांश का अंश है; अनुवाद में अनुपलब्ध सामग्री जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर को संबोधन में गरिमापूर्ण एकवचन ‘तूने’ रखा गया है। स्रोत की पुनरुक्ति और दोनों सिरों की अपूर्णता जानबूझकर सुरक्षित रखी गई है।
