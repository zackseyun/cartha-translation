  text: you bent down the heavens[a], established the earth, and moved the world,
translation:
  language: hi
  text: तूने आकाश को झुका दिया, पृथ्वी को स्थिर किया, और संसार को हिला दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inclinasti caelos
  choice: आकाश को झुका दिया
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक हिन्दी रूप; यह परमेश्वर के आकाश को नीचे झुकाने की ब्रह्माण्डीय छवि बनाए रखता है।
- source_word: statuisti terram
  choice: पृथ्वी को स्थिर किया
  rationale: प्रस्तुत लातीनी पाठ में statuisti का अर्थ ‘स्थापित/स्थिर किया’ है। अन्य प्राचीन भाषाई साक्ष्यों के आधार पर ‘हिलाया’ का पाठ प्रस्तावित हुआ है, पर दिए गए मूल-पाठ के विरुद्ध उसे मुख्य पाठ में नहीं अपनाया गया।
- source_word: commouisti orbem
  choice: संसार को हिला दिया
  rationale: commouisti की गति या कम्पन की शक्ति को ‘हिला दिया’ व्यक्त करता है; orbem यहाँ व्यापक वासित संसार अथवा जगत के अर्थ में ‘संसार’ है।
theological_decisions:
- issue: सीनै पर सृष्टि की स्थापना और कम्पन के बीच पाठगत तनाव
  choice: मुख्य पाठ में ‘पृथ्वी को स्थिर किया’
  alternative: ‘पृथ्वी को हिला दिया’
  rationale: लातीनी आधार-पाठ statuisti को प्रधानता दी गई है। ‘हिलाया’ पाठ के लिए सीरियाई और इथियोपियाई संस्करणों का समर्थन बताया गया है, किंतु वह इस दिए हुए लातीनी पाठ का अनुवाद नहीं बल्कि पाठ-संशोधन होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतरता वाला वाक्य। परमेश्वर को संबोधित एकवचन निकटतासूचक ‘तू’ प्रसंग के प्रार्थनात्मक संबोधन के अनुरूप रखा गया है।
