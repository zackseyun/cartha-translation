  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘मैंने…देखे’ तथा ‘मेरी आत्मा ने…देखा’ की पुनरावृत्ति स्रोत के आलंकारिक तनाव को बनाए रखने के लिए रखी गई है।
