  text: Factum est autem cum venissem huc, et vidi impietates quorum non est numerus, et delinquentes multos vidit anima mea hoc tricesimo anno. et excessit cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/029.yaml
  text: But when I came here and saw impieties beyond number[a], my soul saw many sinners in this thirtieth year, and my heart overflowed.
translation:
  language: hi
  text: परन्तु जब मैं यहाँ आया और मैंने अनगिनत अधर्म के काम देखे, और इस तीसवें वर्ष में मेरी आत्मा ने बहुत-से पापियों को देखा, तो मेरा हृदय व्याकुल हो उठा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impietates
  choice: अधर्म के काम
  rationale: बहुवचन संज्ञा यहाँ असंख्य दुष्कर्मों अथवा अधार्मिक आचरणों को सूचित करती है; यह सामान्य पाठक के लिए स्वाभाविक और अर्थ-संगत है।
- source_word: delinquentes
  choice: पापियों
  rationale: वर्तमान कृदन्त का संज्ञात्मक प्रयोग उन लोगों के लिए है जो अपराध या पाप करते हैं; प्रसंग में ‘पापियों’ उपयुक्त है।
- source_word: anima mea
  choice: मेरी आत्मा
  rationale: स्रोत की अभिव्यक्ति और उसके जानबूझकर दोहराए गए ‘देखने’ को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: excessit cor meum
  choice: मेरा हृदय व्याकुल हो उठा
  rationale: लातीनी मुहावरा तीव्र मानसिक विचलन, स्तब्धता या हृदय के काबू से बाहर होने का भाव दे सकता है। ‘व्याकुल हो उठा’ अस्पष्ट भावात्मक तीव्रता को स्वाभाविक हिन्दी में रखता है, बिना इसे केवल ‘उमड़ पड़ा’ या ‘जवाब दे गया’ तक सीमित किए।
theological_decisions: []
