  yaml_path: translation/extra_canonical/2_esdras/003/009.yaml
  text: Again, in time, you brought the flood upon the inhabitants of the world, and destroyed them.
translation:
  language: hi
  text: फिर, समय आने पर, तूने संसार के निवासियों पर जलप्रलय लाया और उन्हें नष्ट कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iterum autem
  choice: फिर
  rationale: यह पूर्व कथन से क्रम और पुनरावृत्ति का संबंध स्वाभाविक हिन्दी में व्यक्त करता है; autem को अलग से ‘परन्तु’ कहना यहाँ अनावश्यक विरोध पैदा करता।
- source_word: in tempore
  choice: समय आने पर
  rationale: शाब्दिक ‘समय में’ की अपेक्षा यह स्वाभाविक हिन्दी है और निर्धारित अवसर पर घटना होने का भाव बनाए रखती है।
- source_word: diluuium
  choice: जलप्रलय
  rationale: बाइबिलीय महाबाढ़ के लिए प्रचलित और स्पष्ट हिन्दी शब्द।
- source_word: habitantes saeculum
  choice: संसार के निवासियों
  rationale: उत्तरकालीन लैटिन में saeculum यहाँ बसे हुए संसार को दर्शाता है; यह चयन अभिप्रेत मानव निवासियों को स्पष्ट रखता है।
- source_word: perdidisti eos
  choice: उन्हें नष्ट कर दिया
  rationale: perdere के विनाशकारी अर्थ को सीधे और बिना नरमी के व्यक्त करता है।
theological_decisions:
- issue: जलप्रलय में परमेश्वर की सक्रिय भूमिका
  choice: तू ... लाया और ... नष्ट कर दिया
  alternative: जलप्रलय आया और वे नष्ट हो गए
  rationale: लैटिन के सक्रिय द्वितीय-पुरुष क्रियापद induxisti और perdidisti परमेश्वर को दोनों कार्यों का कर्ता बताते हैं; इस तनाव को निष्क्रिय भाषा से कम नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। प्रार्थनात्मक संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है।
