id: 2ES.3.12
reference: 2 Esdras 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum coepissent multiplicari qui habitabant super terram, et multiplicauerunt filios et populos et gentes multas, et coeperunt iterato impietatem facere plus quam priores.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/012.yaml
  text: And it happened that when those who lived on the earth began to multiply, they multiplied children and peoples and many nations, and they began again to act impiously, more than those before them.
translation:
  language: hi
  text: और ऐसा हुआ कि जब पृथ्वी पर रहनेवाले लोग संख्या में बढ़ने लगे, तो उनकी सन्तान, जनसमूह और अनेक जातियाँ भी बढ़ीं; और वे फिर से अपने से पहले के लोगों से भी अधिक अधर्म करने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicari / multiplicauerunt
  choice: संख्या में बढ़ने लगे / बढ़ीं
  rationale: लैटिन में एक ही मूल क्रिया की पुनरावृत्ति को यथासम्भव बनाए रखते हुए हिन्दी में अस्वाभाविक ‘बच्चों को बढ़ाया’ से बचाया गया है।
- source_word: filios
  choice: सन्तान
  rationale: यहाँ बहुवचन ‘पुत्रों’ की अपेक्षा वंश-वृद्धि के व्यापक अर्थ में स्वाभाविक हिन्दी ‘सन्तान’ उपयुक्त है।
- source_word: populos
  choice: जनसमूह
  rationale: ‘लोग’ के सामान्य अर्थ और संगठित बहुवचन peoples के बीच भेद बनाए रखने के लिए ‘जनसमूह’ चुना गया है।
- source_word: gentes multas
  choice: अनेक जातियाँ
  rationale: gentes के सामूहिक जातीय/राष्ट्रीय समूहों के अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: impietatem facere
  choice: अधर्म करने लगे
  rationale: impietas में निहित ईश्वर-विरोधी दुष्टता को आधुनिक धार्मिक हिन्दी के परिचित शब्द ‘अधर्म’ से व्यक्त किया गया है।
- source_word: priores
  choice: अपने से पहले के लोग
  rationale: लैटिन केवल पूर्ववर्तियों की ओर संकेत करता है; ‘पूर्वज’ कहने से अनावश्यक रूप से पारिवारिक वंश का अर्थ जुड़ सकता था।
theological_decisions:
- issue: impietas का नैतिक और धार्मिक अर्थ
  choice: अधर्म
  alternative: भक्ति-विहीनता / दुष्टता
  rationale: ‘अधर्म’ धार्मिक अवज्ञा और नैतिक बुराई दोनों को समेटता है, जबकि विकल्प अर्थ को केवल एक दिशा में सीमित कर सकते हैं।
- issue: priores की पहचान
  choice: अपने से पहले के लोग
  alternative: पूर्वज
  rationale: पाठ यह निश्चित नहीं करता कि तुलना केवल जैविक पूर्वजों से है; इसलिए व्यापक और अस्पष्ट संकेत सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लैटिन की क्रिया-पुनरावृत्ति का प्रभाव ‘बढ़ने लगे/बढ़ीं’ से रखा गया है, पर हिन्दी की स्वाभाविकता के लिए दूसरे खंड को ‘उनकी सन्तान… बढ़ीं’ के रूप में व्यक्त किया गया है।
