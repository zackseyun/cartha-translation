id: 2ES.3.4
reference: 2 Esdras 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi : O dominator domine, nonne tu dixisti ab initio, quando plasmasti terram, et hoc solus, et imperasti pulu̇eri'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/004.yaml
  text: And I said, “O Lord who rules, did you not speak from the beginning, when you formed the earth—and this you did alone—and commanded the dust
translation:
  language: hi
  text: और मैंने कहा, “हे प्रभु, हे स्वामी, क्या तूने आरम्भ से ही नहीं कहा था—जब तूने पृथ्वी को आकार दिया, और यह काम तूने अकेले ही किया—और धूल को आज्ञा दी
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: हे प्रभु, हे स्वामी
  rationale: दोनों संबोधनों की पुनरुक्ति बनाए रखता है और परमेश्वर के प्रभुत्व को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ab initio
  choice: आरम्भ से ही
  rationale: लातीनी पद के ‘आरम्भ से’ वाले अर्थ को स्पष्ट रखता है; ‘ही’ प्रश्न में निहित बल को स्वाभाविक बनाता है।
- source_word: plasmasti
  choice: आकार दिया
  rationale: मिट्टी से गढ़ने या रूप देने के बिंब को बनाए रखता है और सामान्य पाठक के लिए सहज है।
- source_word: et hoc solus
  choice: और यह काम तूने अकेले ही किया
  rationale: मूल के कुछ असामान्य पर स्पष्ट कथन को बिना धर्मवैचारिक विस्तार के सुरक्षित रखता है।
- source_word: imperasti pulveri
  choice: धूल को आज्ञा दी
  rationale: imperare के आदेश देने और pulvis के धूल अर्थ का सीधा अनुवाद है; पद अगले वाक्यांश में जारी रहता है।
theological_decisions:
- issue: सृष्टि-कार्य में परमेश्वर का अकेला होना
  choice: यह काम तूने अकेले ही किया
  alternative: तू अकेला ही था
  rationale: मूल et hoc solus को कार्य से जोड़ते हुए अनूदित किया गया है; वैकल्पिक पाठ अस्तित्व या उपस्थिति पर अधिक बल देकर अर्थ को अनावश्यक रूप से निश्चित कर सकता है।
- issue: ‘कहा’ और ‘आज्ञा दी’ का संबंध
  choice: दोनों क्रियाओं को समान भूतकालीन प्रश्न के भीतर रखा
  alternative: ‘क्या तूने...कहकर धूल को आज्ञा नहीं दी’
  rationale: मूल dixisti और imperasti को अलग क्रियाओं के रूप में रखता है; इनके संबंध को अधिक स्पष्ट करके मूल की संरचनात्मक अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल संबोधन। एकवचन निकटवर्ती ‘तू’ ईश्वर से सीधे प्रार्थनापूर्ण संबोधन की प्राचीन शैली को बनाए रखता है। पद स्रोत की तरह अधूरा है और अगले पद में जारी होने के कारण अंत में विराम-चिह्न नहीं दिया गया।
