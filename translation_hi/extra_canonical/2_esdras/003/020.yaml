  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/020.yaml
  text: Yet you did not take away from them the evil heart, so that your law might bear fruit in them.
translation:
  language: hi
  text: फिर भी आपने उनके भीतर से दुष्ट हृदय को दूर नहीं किया, ताकि आपकी व्यवस्था उनमें फल उत्पन्न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cor malignum
  choice: दुष्ट हृदय
  rationale: यह ‘बुरे मन’ की अपेक्षा मूल के हृदय-रूपक और नैतिक अर्थ को अधिक सीधे बनाए रखता है।
- source_word: abstulisti ab eis
  choice: आपने उनके भीतर से … दूर नहीं किया
  rationale: ‘उनसे छीन नहीं लिया’ की अस्वाभाविकता से बचते हुए भीतर विद्यमान हृदय को हटाने का आशय स्पष्ट करता है।
- source_word: lex … fructum faceret (संदर्भ से पूर्ण अर्थ)
  choice: आपकी व्यवस्था उनमें फल उत्पन्न करे
  rationale: अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूर्ण वाक्य के आधार पर व्यवस्था के फलवंत होने का रूपक बनाए रखा गया है; उपलब्ध लैटिन अंश ‘ut faceret’ पर समाप्त होता है।
theological_decisions:
- issue: नकारात्मक मुख्य वाक्य के बाद उद्देश्यवाचक ‘ut’ का संबंध
  choice: ‘ताकि आपकी व्यवस्था उनमें फल उत्पन्न करे’
  alternative: ‘जिसके कारण आपकी व्यवस्था उनमें फल उत्पन्न न कर सकी’
  rationale: मूल की उद्देश्यवाचक रचना और उसका वास्तविक तनाव बनाए रखा गया है; उसे परिणामवाचक कथन बनाकर चुपचाप नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। उपलब्ध लैटिन पाठ खंडित है, इसलिए वाक्य की पूर्णता के लिए परीक्षित अंग्रेज़ी परामर्श-पाठ का सहारा लिया गया है।
