  text: doing in all things as Adam and all his generations did[a]; for they too had an evil heart.
translation:
  language: hi
  text: हर बात में वे वही करते थे जो आदम और उसकी सारी पीढ़ियों ने किया था, क्योंकि उनका हृदय भी बुरा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in omnibus facientes
  choice: हर बात में वे वही करते थे
  rationale: यह पदबंध सभी मामलों में उनके आचरण को दर्शाता है; हिन्दी में यह स्वाभाविक रहते हुए लैटिन के व्यापक अर्थ को बनाए रखता है।
- source_word: sicut fecit Adam et omnes generationes eius
  choice: जो आदम और उसकी सारी पीढ़ियों ने किया था
  rationale: fecit के एकवचन रूप के बावजूद संयुक्त कर्ता आदम और उसकी सभी पीढ़ियाँ हैं; हिन्दी में अर्थानुसार बहुवचन क्रिया रखी गई है।
- source_word: utebantur ... cor malignum
  choice: उनका हृदय भी बुरा था
  rationale: उत्तरकालीन लैटिन में इस प्रयोग का आशय किसी अवस्था या गुण का होना है, न कि हृदय को साधन की तरह 'इस्तेमाल करना'। यह हिन्दी में स्वाभाविक रूप से उस बुरी आंतरिक दशा को व्यक्त करता है।
theological_decisions:
- issue: cor malignum का स्वरूप
  choice: हृदय भी बुरा था
  alternative: वे भी बुरे हृदय का उपयोग करते थे
  rationale: पहला रूप मूल लैटिन मुहावरे के अनुसार एक विद्यमान आंतरिक दशा बताता है और जानबूझकर किसी साधन का उपयोग करने का अतिरिक्त भाव नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। 'पीढ़ियों' से generationes का ऐतिहासिक वंशानुक्रम-संबंधी अर्थ सुरक्षित है।
