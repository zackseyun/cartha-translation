reference: 2 Esdras 3:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam vidi quomodo sustines eos peccantes et pepercisti impie agentibus, et perdidisti populum tuum et conservasti inimicos tuos, et non significasti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/030.yaml
  text: For I saw how you endure those who sin and have spared those who act impiously[a], but have destroyed your people and preserved your enemies, and have not made it clear
translation:
  language: hi
  text: क्योंकि मैंने देखा कि आप पाप करने वालों को कैसे सहते हैं और अधर्म करने वालों को बख्शा है,[a] पर अपनी प्रजा को नष्ट कर दिया है और अपने शत्रुओं को बचाए रखा है, और आपने स्पष्ट नहीं किया है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधर्म करने वालों को बख्श देते हैं, पर अपनी प्रजा को नष्ट कर देते हैं और अपने शत्रुओं को बचाए रखते हैं।”
    reason: पूर्ववर्ती पाठ-रूप की वैकल्पिक काल-संगति को दर्ज करता है; मुख्य पाठ लैटिन के वर्तमान और पूर्ण भूतकाल के अंतर को सुरक्षित रखता है।
lexical_decisions:
- source_word: sustines
  choice: सहते हैं
  rationale: वर्तमान काल को बनाए रखते हुए पापियों को धैर्यपूर्वक सहने का भाव व्यक्त करता है।
- source_word: pepercisti
  choice: छोड़ दिया है
  rationale: परिपूर्ण भूतकाल और दंड न देने/बख्श देने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: impie agentibus
  choice: दुष्टता करने वालों
  rationale: लैटिन के अधार्मिक या दुष्ट आचरण के नैतिक भाव को सामान्य आधुनिक हिन्दी में रखता है।
- source_word: perdidisti
  choice: नष्ट कर दिया
  rationale: पूर्ण हो चुकी विनाश की कार्रवाई को स्पष्ट करता है।
- source_word: conservasti
  choice: बचाए रखा है
  rationale: शत्रुओं के संरक्षण और अब तक बचे रहने, दोनों भावों को व्यक्त करता है।
- source_word: non significasti
  choice: आपने स्पष्ट नहीं किया है
  rationale: अकर्मक ढंग से समाप्त होने वाले अपूर्ण कथन को बिना कोई असमर्थित कर्म जोड़कर सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वर के पापियों और अपनी प्रजा के प्रति व्यवहार के बीच तनाव
  choice: विरोधाभासी शिकायत को सीधे रूप में बनाए रखा गया है
  alternative: इसे ईश्वर की अनुमति या न्याय की व्याख्या देकर नरम करना
  rationale: स्रोत वक्ता की शिकायत और उसके धार्मिक तनाव को प्रस्तुत करता है; अनुवाद को उसका समाधान नहीं जोड़ना चाहिए।
- issue: क्रियाओं के काल का अंतर
  choice: sustines को वर्तमान और pepercisti/perdidisti/conservasti को पूर्ण भूतकाल में रखा गया है
  alternative: सभी क्रियाओं को सामान्य वर्तमान में करना
  rationale: लैटिन जानबूझकर वर्तमान सहनशीलता से पूर्ण हो चुकी कार्रवाइयों की ओर जाता है।
- issue: पद का अपूर्ण अंत
  choice: अंत में दीर्घ विराम-चिह्न के साथ अपूर्णता बनाए रखी गई है
  alternative: अगले पद से अर्थ लेकर वाक्य पूरा करना
  rationale: दिए गए लैटिन स्रोत का अंत non significasti पर होता है; अतिरिक्त आशय जोड़ना स्रोत से परे होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरार्थक ‘आप’ के साथ गरिमापूर्ण किंतु सहज शैली। मुख्य पाठ में लैटिन की काल-भिन्नता और अंतिम अपूर्ण कथन दोनों सुरक्षित हैं।
