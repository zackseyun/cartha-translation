  text: Et uentilatus est spiritus meus ualde, et coepi loqui ad altissimum uerba timorata,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/003.yaml
  text: And my spirit was greatly stirred[a], and I began to speak fearful words to the Most High,
translation:
  language: hi
  text: और मेरी आत्मा बहुत व्याकुल हो उठी, और मैं परमप्रधान से भय से भरे वचन कहने लगा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uentilatus est
  choice: व्याकुल हो उठी
  rationale: लैटिन क्रिया का मूल बिंब झकझोरे या उद्वेलित किए जाने का है; प्रसंग में यह गहरी भीतरी व्याकुलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: spiritus meus
  choice: मेरी आत्मा
  rationale: यहाँ वक्ता की भीतरी चेतना या मनोभाव अभिप्रेत है; ‘आत्मा’ स्रोत की धार्मिक और मानवशास्त्रीय व्यापकता बनाए रखता है।
- source_word: altissimum
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त सर्वोच्चता-सूचक उपाधि का प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: uerba timorata
  choice: भय से भरे वचन
  rationale: यह बोलने वाले के भय और संकोच से युक्त शब्दों को व्यक्त करता है तथा ‘भयावने वचन’ जैसा भ्रामक अर्थ उत्पन्न नहीं करता।
theological_decisions:
- issue: परमप्रधान से प्रश्न करते समय वक्ता की भावदशा
  choice: ‘भय से भरे वचन’ द्वारा श्रद्धामिश्रित भय और संकोच बनाए रखा गया है।
  alternative: ‘चिंतित बातें’ या ‘भयावने वचन’
  rationale: ‘timorata’ को केवल चिंता तक सीमित करना उसके भय-संबंधी बल को घटाता है, जबकि ‘भयावने’ से ऐसा लग सकता है कि वचन सुनने वालों को डराने वाले थे।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज बाइबलीय शैली। ‘वचन’ धार्मिक प्रसंग के अनुकूल है, और वाक्य की अपूर्ण, आगे जारी रहने वाली संरचना को अंतिम अल्पविराम से सुरक्षित रखा गया है।
