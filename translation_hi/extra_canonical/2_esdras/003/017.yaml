lexical_decisions:
- source_word: in multitudine magna
  choice: एक बड़ी भीड़ के रूप में
  rationale: यह पूर्ववर्ती वाक्य से जुड़ा खंड है; ‘बड़ी भीड़’ multitudo magna का सहज और निकट अर्थ देता है।
- source_word: factum est
  choice: ऐसा हुआ
  rationale: लातीनी कथात्मक सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: educeres
  choice: निकाल रहा था
  rationale: अपूर्ण भूतकालीन subjunctive, cum के साथ चल रही/समकालिक क्रिया व्यक्त करता है; खंड अगले पाठ में पूरा होता है।
- source_word: semen
  choice: वंश
  rationale: यहाँ semen का आशय शाब्दिक ‘बीज’ से आगे किसी पूर्वज की संतान या वंश है; स्रोत में संबंधसूचक सर्वनाम नहीं है, इसलिए ‘उसका’ नहीं जोड़ा गया।
theological_decisions:
- issue: semen का सामूहिक वंशगत अर्थ
  choice: वंश
  alternative: बीज / संतान
  rationale: ‘वंश’ सामूहिक descendants का अर्थ बनाए रखता है और स्रोत में अनुपस्थित लिंग, संख्या या संबंधसूचक विवरण नहीं जोड़ता।
- issue: अपूर्ण स्रोत-खंड को पूरा करना
  choice: वाक्य को डैश के साथ खुला रखा गया
  alternative: मिस्र और सीनै संबंधी अगले पाठ को जोड़कर वाक्य पूरा करना
  rationale: प्रदत्त मूल-पाठ इसी स्थान पर समाप्त होता है; अनुपस्थित शब्द जोड़ना स्रोत-सीमा से आगे जाता।
