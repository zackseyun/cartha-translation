  yaml_path: translation/extra_canonical/2_esdras/003/015.yaml
  text: And you established with him an everlasting covenant, and said that you would never forsake his seed.
translation:
  language: hi
  text: और तूने उसके साथ अनन्त वाचा बाँधी और उससे कहा कि तू उसकी संतति को कभी नहीं त्यागेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testamentum aeternum
  choice: अनन्त वाचा
  rationale: यह पद परमेश्वर द्वारा स्थापित स्थायी covenant को व्यक्त करता है; ‘वाचा’ धार्मिक संदर्भ में स्वाभाविक और सटीक है।
- source_word: disposuisti ei
  choice: तूने उसके साथ … बाँधी
  rationale: लातीनी प्रयोग का आशय उसके लिए/उसके साथ वाचा स्थापित करना है; हिन्दी में ‘वाचा बाँधी’ इसका स्वाभाविक रूप है।
- source_word: semen
  choice: संतति
  rationale: यहाँ ‘बीज’ वंशजों के लिए सामूहिक अर्थ में प्रयुक्त है; ‘संतति’ उसी अर्थ को बिना अनावश्यक व्याख्या के व्यक्त करती है।
- source_word: non unquam derelinqueres
  choice: कभी नहीं त्यागेगा
  rationale: मूल पाठ की प्रबल निषेधात्मक प्रतिज्ञा और ‘forsake/abandon’ के अर्थ को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ‘semen’ का एकवचन रूप और सामूहिक अर्थ
  choice: संतति
  alternative: वंश
  rationale: ‘संतति’ मूल के सामूहिक वंशज-अर्थ को बनाए रखती है और किसी विशेष उत्तराधिकारी तक प्रतिज्ञा को सीमित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; परमेश्वर के लिए निकटवाची एकवचन ‘तू’ रखा गया है। वाक्य मूल की वाचा और न त्यागने की प्रतिज्ञा को संक्षिप्त तथा स्पष्ट रूप में प्रस्तुत करता है।
