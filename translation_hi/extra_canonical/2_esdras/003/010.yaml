source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est in uno casus corum, sicut Adac mors, sic et his diluuium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/010.yaml
  text: 'And one fate came upon them all: as death came to Adam, so the flood came to these also.'
translation:
  language: hi
  text: 'और उन सब पर एक ही विपत्ति आ पड़ी: जैसे आदम पर मृत्यु आई, वैसे ही इन पर भी जलप्रलय आया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: casus eorum
  choice: उन सब पर...विपत्ति
  rationale: लातीनी ‘casus’ यहाँ मृत्यु और जलप्रलय को समानांतर रखने वाली विनाशकारी दशा या विपत्ति को सूचित करता है। ‘विपत्ति’ आधुनिक हिन्दी में स्वाभाविक है और ‘नियति’ से उत्पन्न अनावश्यक दार्शनिक नियतिवाद से बचता है।
- source_word: in uno
  choice: एक ही
  rationale: स्रोत के ‘uno’ और सब पर आए साझा परिणाम के बल को बनाए रखता है।
- source_word: Adac mors
  choice: आदम पर मृत्यु
  rationale: स्रोत में आदम और मृत्यु के सीधे संबंध को सहज हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: his diluuium
  choice: इन पर भी जलप्रलय
  rationale: ‘his’ के संकेतवाचक भेद और समानांतरता को ‘इन पर भी’ से स्पष्ट रखा गया है; ‘diluuium’ के लिए प्रचलित बाइबलीय शब्द ‘जलप्रलय’ चुना गया है।
theological_decisions:
- issue: ‘casus’ को नियति, पतन या विपत्ति के रूप में समझना
  choice: विपत्ति
  alternative: नियति / पतन
  rationale: संदर्भ में मृत्यु और जलप्रलय विनाशकारी घटनाएँ हैं। ‘विपत्ति’ इस समानता को सुरक्षित रखती है, जबकि ‘नियति’ पूर्वनिर्धारण का अतिरिक्त अर्थ और ‘पतन’ नैतिक पतन का अर्थ ला सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आ पड़ी’ आकस्मिक तथा प्रबल आपदा का स्वाभाविक हिन्दी बोध देता है; दोनों खंडों की समानांतर रचना स्रोत की तुलना को बनाए रखती है।
