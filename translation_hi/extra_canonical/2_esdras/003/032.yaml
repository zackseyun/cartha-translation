source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut alia gens cognovit te praeter Israhel? aut quae tribus crediderunt testamentis sicut haec Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/032.yaml
  text: Or has any other nation known you besides Israel? Or what tribes have believed the covenants like this Jacob?[a]
translation:
  language: hi
  text: या इस्राएल के सिवा किसी और राष्ट्र ने तुझे जाना है? या किन गोत्रों ने याकूब के इन गोत्रों के समान वाचाओं पर विश्वास किया है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'लैटिन पदबंध का अधिक शाब्दिक, पर व्याकरण की दृष्टि से कठिन अनुवाद हो सकता है: “या किन गोत्रों ने इस याकूब के समान वाचाओं पर विश्वास किया है?”'
    reason: स्रोत के sicut haec Iacob में demonstrative और tribus के संबंध को लेकर वास्तविक व्याकरणिक अस्पष्टता है।
lexical_decisions:
- source_word: gens
  choice: राष्ट्र
  rationale: यहाँ gens एक जातीय-राजनीतिक समुदाय को दर्शाता है; ‘राष्ट्र’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: cognovit te
  choice: तुझे जाना है
  rationale: लैटिन cognoscere का संबंधपरक अर्थ बनाए रखा गया है; यह केवल जानकारी रखने का अर्थ नहीं देता।
- source_word: tribus
  choice: गोत्रों
  rationale: इस्राएल और याकूब के संदर्भ में ‘गोत्र’ सबसे सटीक और प्रचलित बाइबलीय पद है।
- source_word: testamentis
  choice: वाचाओं पर
  rationale: बहुवचन testamentis का अर्थ ‘वाचाओं’ है; लैटिन में कोई स्पष्ट स्वत्ववाचक सर्वनाम नहीं है। credere के संप्रदान कारक को हिन्दी में ‘पर विश्वास करना’ से स्वाभाविक रूप दिया गया है।
- source_word: sicut haec Iacob
  choice: याकूब के इन गोत्रों के समान
  rationale: 'haec को पूर्ववर्ती tribus की ओर संकेत करने वाला अनियमित/उत्तरकालीन रूप मानकर अर्थ स्पष्ट किया गया है: ‘याकूब के इन गोत्रों के समान।’'
theological_decisions:
- issue: ‘वाचाओं’ का स्वामित्व
  choice: केवल ‘वाचाओं’
  alternative: ‘तेरी वाचाओं’
  rationale: परमेश्वर से संबोधन के कारण ‘तेरी’ अर्थ में निहित हो सकता है, पर लैटिन testamentis में स्वत्ववाचक पद नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: haec Iacob की व्याकरणिक अस्पष्टता
  choice: ‘याकूब के इन गोत्रों के समान’
  alternative: ‘इस याकूब के समान’
  rationale: haec का tribus की ओर संकेत करना प्रसंग और वाक्य-संरचना में अधिक संगत है। फिर भी उपलब्ध लैटिन रूप असामान्य है और उसका अधिक शाब्दिक वैकल्पिक पठन पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी प्रश्नवाचक शैली रखी गई है। परमेश्वर के लिए एकवचन ‘तुझे’ मूल के निकट और प्रार्थनात्मक संबोधन के अनुरूप है।
