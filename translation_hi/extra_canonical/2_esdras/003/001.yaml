source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: anno tricesimo ruinae civitatis eram in Babylone, ego Salathihel qui et Ezras, et conturbatus sum super cubili meo recumbens, et cogitationes meae ascendebant super cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/001.yaml
  text: In the thirtieth year after the ruin of the city[a], I was in Babylon—I, Salathiel, who am also Ezra—and as I lay on my bed, I was troubled, and my thoughts came up upon my heart,
translation:
  language: hi
  text: नगर के विनाश के तीसवें वर्ष में मैं बाबुल में था—मैं शलतीएल था, जो एज्रा भी कहलाता हूँ। जब मैं अपने बिछौने पर लेटा हुआ था, तब मैं व्याकुल हो उठा, और मेरे विचार मेरे मन में उठ रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ruinae civitatis
  choice: नगर के विनाश
  rationale: लातीनी पदबंध का स्वाभाविक और निकट अर्थ; संदर्भ में नगर यरूशलेम है, पर मूल पाठ उसे नाम से नहीं बताता।
- source_word: Babylone
  choice: बाबुल
  rationale: बाइबलीय हिन्दी में प्रचलित स्थान-नाम।
- source_word: Salathihel qui et Ezras
  choice: शलतीएल, जो एज्रा भी कहलाता हूँ
  rationale: qui et नाम के वैकल्पिक परिचय को व्यक्त करता है; हिन्दी में प्रथम पुरुष के अनुरूप ‘कहलाता हूँ’ स्वाभाविक है।
- source_word: conturbatus sum
  choice: मैं व्याकुल हो उठा
  rationale: भीतरी उद्विग्नता का अर्थ स्पष्ट करता है और कथन की क्रियात्मकता बनाए रखता है।
- source_word: cogitationes meae ascendebant super cor meum
  choice: मेरे विचार मेरे मन में उमड़ने लगे
  rationale: लातीनी में संरक्षित सामी मुहावरे ‘हृदय पर चढ़ना’ का आधुनिक हिन्दी में स्वाभाविक अर्थ देता है, जिसमें विचार अंतर्मन में प्रबल होकर उठते हैं।
theological_decisions:
- issue: ‘नगर’ की पहचान
  choice: मुख्य पाठ में केवल ‘नगर’ रखा गया
  alternative: ‘यरूशलेम नगर’
  rationale: संदर्भ से यरूशलेम अभिप्रेत है, पर स्रोत केवल civitatis कहता है; अनकहा नाम जोड़ना उचित नहीं।
- issue: super cor meum का रूपांतरण
  choice: ‘मेरे मन में उमड़ने लगे’
  alternative: ‘मेरे हृदय पर चढ़ आए’
  rationale: शाब्दिक विकल्प हिन्दी में अस्पष्ट और अस्वाभाविक है; चुना हुआ रूप विचारों के अंतर्मन में उठने का आशय सुरक्षित रखता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है; कथात्मक प्रथम पुरुष और स्रोत की क्रमिक गति सुरक्षित है।
