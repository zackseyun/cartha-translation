source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lex tua in eis fructum. Cor enim malignum baiolans primus Adam transgressus et uictus est, sed et omnes qui ex eo nati
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/021.yaml
  text: For the first Adam, bearing an evil heart, transgressed and was overcome; and so also did all who were born from him.
translation:
  language: hi
  text: क्योंकि पहला आदम दुष्ट हृदय लिए हुए था; उसने उल्लंघन किया और वह पराजित हुआ। उससे जन्मे सभी लोगों ने भी उल्लंघन किया और वे पराजित हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Cor enim malignum baiolans
  choice: क्योंकि पहला आदम दुष्ट हृदय लिए हुए था
  rationale: ‘baiolans’ का मूल भाव किसी वस्तु को साथ लिए या धारण किए रहने का है। ‘दुष्ट हृदय लिए हुए’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और इसे ‘बोझ’ मानकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: transgressus
  choice: उल्लंघन किया
  rationale: लैटिन क्रिया में कर्म स्पष्ट नहीं है; इसलिए हिन्दी में भी ‘व्यवस्था’ या ‘आज्ञा’ जैसा कर्म जोड़कर अस्पष्टता को समाप्त नहीं किया गया।
- source_word: uictus est
  choice: वह पराजित हुआ
  rationale: यह निष्क्रिय रूप का सीधा अर्थ देता है और इस बात को अनिर्धारित रहने देता है कि उसे किसने या किस चीज़ ने पराजित किया।
- source_word: omnes qui ex eo nati
  choice: उससे जन्मे सभी लोग
  rationale: ‘ex eo’ के वंशगत संबंध को सीधे व्यक्त करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
theological_decisions:
- issue: आदम के उल्लंघन और उसके वंशजों के बीच संबंध
  choice: यही उससे जन्मे सभी लोगों के साथ भी हुआ
  alternative: उसके कारण उससे जन्मे सभी लोग भी पापी ठहरे
  rationale: मूल पाठ समान परिणाम बताता है, पर ‘उसके कारण’ अथवा आरोपित दोष का कोई स्पष्ट सिद्धांत नहीं जोड़ता। चुना गया रूप इस धर्मवैज्ञानिक तनाव और सीमित कथन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। लैटिन के अंतिम लुप्त क्रियापदों को शब्दशः दोहराने के बजाय ‘यही ... के साथ भी हुआ’ से स्वाभाविक रूप में पूरा किया गया है। आरंभिक खंड ‘lex tua in eis fructum’ व्याकरणतः अधूरा और संभवतः पिछले पद का अंश है; इसलिए 3:21 के अंग्रेज़ी परामर्श-पाठ तथा पूर्ण लैटिन वाक्य के अनुरूप अनुवाद ‘Cor enim’ से आरंभ किया गया है।
