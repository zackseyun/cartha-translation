  text: because I saw the desolation of Zion and the abundance of those who lived in Babylon.
translation:
  language: hi
  text: क्योंकि मैंने सिय्योन का उजड़ना और बाबुल में रहनेवालों की समृद्धि देखी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desertionem
  choice: उजड़ना
  rationale: यह सिय्योन की उजड़ी और निर्जन दशा को सहज आधुनिक हिन्दी में व्यक्त करता है; केवल ‘त्याग’ कहना यहाँ कम स्वाभाविक होता।
- source_word: habundantiam
  choice: समृद्धि
  rationale: लातीनी शब्द बहुतायत, प्रचुरता या संपन्नता का बोध देता है; उजड़े सिय्योन के विपरीत बाबुल के निवासियों की फलती-फूलती दशा के लिए ‘समृद्धि’ स्वाभाविक है।
- source_word: qui habitabant
  choice: रहनेवालों
  rationale: अपूर्ण भूतकालीन क्रिया का आशय बाबुल में निवास करनेवाले लोगों से है; हिन्दी में कृदंत रूप संक्षिप्त और सहज है।
- source_word: Babilone
  choice: बाबुल
  rationale: यह बाइबलीय हिन्दी में प्रचलित स्थान-नाम है।
- source_word: Sion
  choice: सिय्योन
  rationale: यह बाइबलीय हिन्दी में स्थापित रूप है और स्थान के धार्मिक-साहित्यिक संकेत को बनाए रखता है।
theological_decisions:
- issue: सिय्योन और बाबुल के बीच विरोध
  choice: ‘उजड़ना’ और ‘समृद्धि’ द्वारा विरोध को स्पष्ट रखा गया
  alternative: ‘वीरानी’ और ‘बहुतायत’
  rationale: मूल पाठ एक ओर सिय्योन की दुर्दशा और दूसरी ओर बाबुलवासियों की संपन्न दशा रखता है; अनुवाद इस तनाव को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और बाइबलीय शैली से संगत वाक्य। कोई पादटिप्पणी आवश्यक नहीं।
