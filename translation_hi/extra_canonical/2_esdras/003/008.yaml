id: 2ES.3.8
reference: 2 Esdras 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et ambulauit unaquaeque gens in uoluntate sua, et impie agebant coram te et spernebant, et tu non prohibuisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/008.yaml
  text: And each nation walked according to its own will[a], and acted impiously before you and despised you, and you did not hinder them.
translation:
  language: hi
  text: और प्रत्येक जाति अपनी इच्छा के अनुसार चली[a], और वे तेरे सामने अधर्मपूर्वक आचरण करतीं और तेरा तिरस्कार करतीं, और तूने उन्हें नहीं रोका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी इच्छा में चली।”
    reason: लातीनी ‘in uoluntate sua’ की अधिक शब्दशः अभिव्यक्ति को सुरक्षित रखता है।
lexical_decisions:
- source_word: ambulauit ... in uoluntate sua
  choice: अपनी इच्छा के अनुसार चलती रही
  rationale: लातीनी ‘चलना’ रूपक और प्रत्येक जाति के अपने मन के अनुसार आचरण करने का भाव—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: impie agebant
  choice: अधर्म करते रहे
  rationale: ‘impie’ का धार्मिक-नैतिक भाव केवल सामान्य बुराई नहीं, बल्कि परमेश्वर के सामने भक्तिहीन और अनुचित आचरण है; ‘अधर्म’ इसे संक्षेप में व्यक्त करता है।
- source_word: spernebant
  choice: तेरा तिरस्कार करते रहे
  rationale: क्रिया में अवमानना और ठुकराने का भाव है; प्रसंग तथा अंग्रेज़ी परामर्श-पाठ के अनुसार परमेश्वर को निहित कर्म मानकर ‘तेरा’ रखा गया है।
- source_word: non prohibuisti eos
  choice: तूने उन्हें नहीं रोका
  rationale: ‘prohibere’ के रोकने या बाधित करने के सीधे अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा जातियों को न रोकने का कथन
  choice: और तूने उन्हें नहीं रोका
  alternative: फिर भी तूने उन्हें नहीं रोका
  rationale: मूल लातीनी में केवल ‘et’ है। ‘फिर भी’ कथन में अधिक स्पष्ट विरोध जोड़ देता; इसलिए स्रोत की खुली हुई तार्किक संगति और theological tension को बनाए रखने के लिए ‘और’ चुना गया।
- issue: ‘spernebant’ का निहित कर्म
  choice: तेरा तिरस्कार करते रहे
  alternative: तिरस्कार करते रहे
  rationale: लातीनी क्रिया के साथ कर्म व्यक्त नहीं है, किंतु निकटवर्ती ‘तेरे सामने’ और पूरे संबोधन से परमेश्वर ही स्वाभाविक निहित कर्म है। हिन्दी में अर्थ स्पष्ट करने के लिए ‘तेरा’ रखा गया, बिना कोई अतिरिक्त doctrinal व्याख्या जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को एकवचन निकट संबोधन ‘तू/तेरे’ में रखा गया है। ‘हर जाति’ के बाद एकवचन ‘चलती रही’ मूल के unaquaeque gens ... ambulauit से मेल खाता है, जबकि अगले खंड में ‘वे’ मूल के बहुवचन agebant/spernebant को दर्शाता है।
