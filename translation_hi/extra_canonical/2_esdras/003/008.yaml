  revision_rationale: मुख्य संशोधन ambulauit के पूर्ण पक्ष को ‘चली’ से दर्शाता है। ‘अधर्मपूर्वक आचरण करतीं’ लातीनी impie agebant के धार्मिक-नैतिक अर्थ को स्पष्ट और आधुनिक गरिमापूर्ण हिन्दी में रखता है। शेष वाक्य स्रोत के संबोधन, निहित कर्म, और ‘नहीं रोका’ के सीधे अर्थ को बनाए रखता है।
