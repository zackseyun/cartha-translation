  text: impietatem facere plus quam priores. Et factum est cum iniquitatem facerent coram te, elegisti tibi ex his unum, cui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/013.yaml
  text: And it happened, when they were committing iniquity before you, you chose for yourself one from among them,
translation:
  language: hi
  text: और ऐसा हुआ कि जब वे तेरे सामने अधर्म कर रहे थे, तब तूने उनमें से एक को अपने लिए चुन लिया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitatem facerent
  choice: अधर्म कर रहे थे
  rationale: लातीनी पदबंध का स्वाभाविक और अर्थ-सटीक रूप; यह नैतिक दुष्टता/अन्याय का भाव बनाए रखता है।
- source_word: coram te
  choice: तेरे सामने
  rationale: ईश्वर की उपस्थिति और दृष्टि में किए गए अधर्म का सीधा भाव सुरक्षित रखता है।
- source_word: elegisti tibi
  choice: तूने ... अपने लिए चुन लिया
  rationale: लातीनी tibi के आत्मसंबंधी बल को स्पष्ट रूप से बनाए रखता है।
- source_word: ex his unum
  choice: उनमें से एक को
  rationale: unum में निहित केवल ‘एक’ का अनुवाद किया गया है; मूल में न होने के कारण ‘मनुष्य’ नहीं जोड़ा गया।
theological_decisions:
- issue: चुने गए व्यक्ति की पहचान
  choice: एक
  alternative: एक मनुष्य
  rationale: इस खंड में लातीनी पाठ केवल unum कहता है; संदर्भ से परे जाकर व्यक्ति की पहचान या लिंग को अधिक स्पष्ट नहीं किया गया।
- issue: ईश्वर को संबोधन का सर्वनाम
  choice: तू/तेरे
  alternative: आप/आपके
  rationale: प्रार्थनात्मक प्रत्यक्ष संबोधन में एकवचन की निकटता तथा मूल के te/tibi का भेद बनाए रखने के लिए dignified biblical ‘तू’ रूप अपनाया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य को अल्पविराम पर खुला रखा गया है, क्योंकि स्रोत-पाठ का cui अगले खंड से जुड़ता है और दिया गया अंश स्वयं अपूर्ण है।
