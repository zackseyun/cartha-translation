id: 2ES.3.5
reference: 2 Esdras 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dedit tibi Adam, corpus mortuum ? sed et ipsum figmentum manuum tuarum erat, et insufflasti in eum spiritum uitae, et factus est uiuens coram te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/005.yaml
  text: And you gave Adam a dead body? Yet he too was the work of your hands, and you breathed into him the spirit of life, and he became alive before you.
translation:
  language: hi
  text: और तूने आदम को एक निर्जीव शरीर दिया[a]। फिर भी वह तेरे ही हाथों की रचना था। तूने उसमें जीवन का श्वास फूँका, और वह तेरे सामने जीवित हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी पाठ का सीधा अर्थ है, ‘और आदम ने तुझे एक मृत शरीर दिया?’ यह प्रसंग में कठिन प्रतीत होता है। मुख्य पाठ सम्भावित संशोधन dedisti Adam (‘तूने आदम को … दिया’) के आधार पर है।
    reason: उपलब्ध पाठ और उसके आधार पर अपनाए गए सम्भावित संशोधन—दोनों को बिना व्याकरणिक कठिनाई का भ्रामक दावा किए स्पष्ट करता है।
lexical_decisions:
- source_word: corpus mortuum
  choice: एक निर्जीव शरीर
  rationale: शाब्दिक ‘मृत शरीर’ आधुनिक हिन्दी में प्रायः शव का बोध कराता है; यहाँ आशय उस शरीर से है जिसमें अभी जीवन नहीं फूँका गया था। ‘निर्जीव शरीर’ उसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: figmentum manuum tuarum
  choice: तेरे ही हाथों की रचना
  rationale: ‘रचना’ सृजे और गढ़े हुए कार्य—दोनों भावों को सहज हिन्दी में रखता है; ‘ही’ इस विरोधात्मक बल को व्यक्त करता है कि निर्जीव होने पर भी वह परमेश्वर की अपनी कृति था।
- source_word: spiritum uitae
  choice: जीवन का श्वास
  rationale: लातीनी spiritus में ‘श्वास’ और ‘आत्मा’ दोनों अर्थ संभव हैं। insufflasti (‘फूँका’) और आदम की सृष्टि के प्रसंग में ‘श्वास’ अधिक स्वाभाविक है, जबकि ‘जीवन’ मूल पद के धार्मिक अर्थ-भार को बनाए रखता है।
- source_word: uiuens coram te
  choice: तेरे सामने जीवित
  rationale: coram te का सीधा स्थानिक-संबंधी भाव ‘तेरे सामने’ रखा गया है; इसे ‘तेरी दृष्टि में’ बनाकर व्याख्यात्मक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: आदम के शरीर की आरम्भिक दशा
  choice: ‘निर्जीव शरीर’—अर्थात जीवन का श्वास फूँके जाने से पहले का शरीर
  alternative: ‘मृत शरीर’ या ‘शव’
  rationale: यह चयन मनुष्य की सृष्टि के क्रम को व्यक्त करता है और ऐसा अनावश्यक संकेत नहीं देता कि आदम पहले जीवित था और फिर मर गया।
- issue: spiritum uitae का अर्थ
  choice: ‘जीवन का श्वास’
  alternative: ‘जीवन की आत्मा’
  rationale: मूल में अर्थगत विस्तार है, पर ‘फूँकना’ क्रिया के साथ श्वास प्रमुख है। अनुवाद किसी विशिष्ट आत्मा-विज्ञान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर के लिए एकवचन निकट-संबोधन ‘तू/तेरे’ रखा गया है, जो प्रार्थना-संदर्भ में स्वाभाविक है। वाक्य छोटे रखे गए हैं और सृष्टि-वृत्तांत की प्रतिध्वनि बनाए रखने के लिए ‘फूँका’ तथा ‘जीवित हो गया’ चुने गए हैं।
