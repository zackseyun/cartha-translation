  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/019.yaml
  text: and made the depths tremble and troubled the age. And your glory passed through the four gates—fire and earthquake and wind and frost—that you might give the law to the seed of Jacob[19], and your commandment to the generation of Israel.
translation:
  language: hi
  text: और तूने अथाह गहराइयों को कंपा दिया और युग को विचलित कर दिया। तेरी महिमा चार द्वारों से होकर निकली—आग, भूकंप, वायु और पाला[a]—ताकि तू याकूब के वंश को व्यवस्था और इस्राएल की पीढ़ी को अपनी आज्ञा दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरी महिमा चार द्वारों से होकर निकली—आग, भूकंप, वायु और पाला’ वाक्यांश पाठ और बिंब—दोनों की दृष्टि से कठिन है। अनुवाद ने इसे निर्गमन-वृत्तांत के अनुरूप ढालने के बजाय लैटिन के असामान्य ईश्वर-प्रकटन संबंधी बिंब को बनाए रखा है।
    reason: textual_variant
lexical_decisions:
- source_word: abyssos
  choice: अथाह गहराइयों
  rationale: बहुवचन लैटिन रूप और अगाध गहराई के बिंब को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: saeculum
  choice: युग
  rationale: लैटिन शब्द की काल/विश्व-व्यवस्था संबंधी व्यापकता को बिना अनावश्यक रूप से केवल ‘संसार’ या केवल ‘समय’ तक सीमित किए व्यक्त करता है।
- source_word: portas quattuor
  choice: चार द्वारों
  rationale: कठिन और असामान्य मूल बिंब को निर्गमन-वृत्तांत के अनुरूप बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: gelus
  choice: पाला
  rationale: ठंड या हिम के बजाय लैटिन gelus के ठिठुराने वाले जमाव के ठोस प्राकृतिक बिंब को व्यक्त करता है।
- source_word: legem
  choice: व्यवस्था
  rationale: इस्राएल को दी गई दैवी विधि के लिए प्रचलित, गरिमापूर्ण बाइबलीय हिन्दी शब्द।
- source_word: generationi Israel
  choice: इस्राएल की पीढ़ी
  rationale: generationi का निकट और जानबूझकर असामान्य समानार्थी अनुवाद, जो समानांतर पदबंध की संरचना बनाए रखता है।
theological_decisions:
- issue: चार द्वारों से होकर महिमा के निकलने का ईश्वर-प्रकटन संबंधी कठिन बिंब
  choice: 'बिंब को अक्षुण्ण रखा गया: ‘तेरी महिमा चार द्वारों से होकर निकली—आग, भूकंप, वायु और पाला।’'
  alternative: इसे निर्गमन या सीनै के परिचित संकेतों के अनुसार सहज या सामंजस्यपूर्ण बनाना।
  rationale: लैटिन पाठ की वास्तविक अस्पष्टता और तनाव को सुरक्षित रखना चाहिए; पाठ स्वयं चार प्राकृतिक घटनाओं और ‘द्वारों’ का संबंध स्पष्ट नहीं करता।
- issue: अंतिम खंड में ‘अपनी आज्ञा’
  choice: अंग्रेज़ी परामर्श-पाठ में प्रमाणित पूरक अर्थ को स्पष्ट हिन्दी वाक्य के लिए रखा गया।
  alternative: लैटिन उद्धृत पाठ के अधूरे अंत के अनुसार ‘और इस्राएल की पीढ़ी को’ पर वाक्य छोड़ देना।
  rationale: उपलब्ध लैटिन पंक्ति संभवतः कटे हुए पाठ पर समाप्त होती है, जबकि प्रमाणित परामर्श-पाठ समानांतर खंड को ‘your commandment’ से पूर्ण करता है; इसे ‘अपनी’ के साथ दाता परमेश्वर से स्पष्ट रूप से जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरी’ मूल के द्वितीय पुरुष एकवचन को दर्शाता है। वाक्य-संरचना मूल के समानांतर क्रम को बनाए रखते हुए हिन्दी में स्वाभाविक रखी गई है।
