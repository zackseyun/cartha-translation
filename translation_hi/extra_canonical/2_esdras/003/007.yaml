id: 2ES.3.7
reference: 2 Esdras 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et huic mandasti diligentiam tuam ; et praeteriit eam, et statim instituisti in eum mortem et in nationibus eius, et natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/007.yaml
  text: And to him you gave your command; but he transgressed it, and at once you appointed death for him and for his descendants, and from him were born nations and tribes, peoples and clans, without number.
translation:
  language: hi
  text: और तूने उसे अपनी आज्ञा दी; पर उसने उसका उल्लंघन किया। तब तूने तुरन्त उसके लिए और उसके वंशजों के लिए मृत्यु ठहरा दी। उसी से अनगिनत राष्ट्र और गोत्र, लोग और कुल उत्पन्न हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: diligentiam tuam
  choice: अपनी आज्ञा
  rationale: इस प्रसंग में यह पद आदम को दी गई परमेश्वर की आज्ञा को सूचित करता है। शाब्दिक अर्थ के बजाय प्रसंगानुकूल और स्वाभाविक हिन्दी चुनी गई है, बिना ‘एक’ जैसा अतिरिक्त बल जोड़े।
- source_word: praeteriit eam
  choice: उसका उल्लंघन किया
  rationale: लैटिन क्रिया का आशय दी हुई आज्ञा की सीमा लाँघना या उसे तोड़ना है; ‘उल्लंघन किया’ इस अर्थ को औपचारिक किंतु सुबोध हिन्दी में रखता है।
- source_word: instituisti ... mortem
  choice: मृत्यु ठहरा दी
  rationale: यहाँ मृत्यु को उनके लिए नियत किए जाने का भाव है। ‘ठहरा दी’ दैवी निर्णय को व्यक्त करता है और ‘मार डाला’ जैसे अधिक प्रत्यक्ष अर्थ से बचता है।
- source_word: in nationibus eius
  choice: उसके वंशजों के लिए
  rationale: शाब्दिक ‘उसकी जातियों में’ हिन्दी में अस्पष्ट होगा। प्रसंग आदम से निकली आगामी मानव-संतति का है, इसलिए ‘वंशजों’ अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: gentes et tribus, populi et cognationes
  choice: राष्ट्र और गोत्र, लोग और कुल
  rationale: 'चारों सामूहिक संज्ञाओं का भेद यथासंभव बनाए रखा गया है: gentes ‘राष्ट्र’, tribus ‘गोत्र’, populi ‘लोग’, और cognationes ‘कुल’।'
- source_word: quorum non est numerus
  choice: अनगिनत
  rationale: लैटिन का शाब्दिक भाव ‘जिनकी कोई गिनती नहीं’ है; ‘अनगिनत’ उसी अर्थ का संक्षिप्त और प्राकृतिक हिन्दी रूप है।
theological_decisions:
- issue: आदम की अवज्ञा के बाद मृत्यु का दायरा
  choice: उसके लिए और उसके वंशजों के लिए मृत्यु ठहरा दी
  alternative: उस पर और उसकी जातियों पर मृत्यु स्थापित कर दी
  rationale: स्रोत मृत्यु को आदम और उससे निकलने वाली मानव-संतति दोनों से जोड़ता है। अनुवाद इसी व्यापकता को रखता है, पर विरासत में मिले दोष या उसके तंत्र के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: आज्ञा की संख्या
  choice: अपनी आज्ञा
  alternative: अपनी एक आज्ञा
  rationale: लैटिन में ‘एक’ का स्पष्ट शब्द नहीं है; इसलिए स्रोत से अधिक बल या संख्यात्मक विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। परमेश्वर को संबोधन पूरे पद में एकवचन निकटवर्ती रूप ‘तू/तूने’ से किया गया है, जो प्रार्थनात्मक संबोधन के अनुरूप है। वाक्यों को पठनीयता के लिए तीन इकाइयों में बाँटा गया है; कोई पादटिप्पणी आवश्यक नहीं समझी गई।
