source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et induxisti eum in paradisum, quem plantauit dextera tua antequam terra adueṅtaret.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/006.yaml
  text: And you brought him into paradise, which your right hand had planted before the earth came into being.
translation:
  language: hi
  text: और तू उसे उस स्वर्गोद्यान में ले आया, जिसे तेरे दाहिने हाथ ने पृथ्वी के अस्तित्व में आने से पहले लगाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: paradisum
  choice: स्वर्गोद्यान
  rationale: लैटिन शब्द यहाँ आदम के लिए लगाए गए दिव्य उद्यान को दर्शाता है; ‘स्वर्गोद्यान’ आधुनिक पाठक के लिए ‘स्वर्ग’ और ‘उद्यान’ दोनों भाव सुरक्षित रखता है।
- source_word: dextera tua
  choice: तेरे दाहिने हाथ
  rationale: मूल का सजीव और धर्मवैचारिक रूपक बनाए रखा गया है; इसे केवल ‘तेरी शक्ति’ कहकर व्याख्यायित नहीं किया गया।
- source_word: plantauit
  choice: लगाया था
  rationale: उद्यान लगाने के लिए यह स्वाभाविक हिन्दी है और मूल क्रिया के अर्थ को स्पष्ट रूप से व्यक्त करती है।
- source_word: antequam terra adueṅtaret
  choice: पृथ्वी के अस्तित्व में आने से पहले
  rationale: संदर्भ में पृथ्वी के प्रकट या अस्तित्व में आने का कालगत अर्थ है; यह वाक्यांश लैटिन पाठ की असामान्य अभिव्यक्ति को सहज हिन्दी में देता है।
theological_decisions:
- issue: ईश्वर के ‘दाहिने हाथ’ का मानवीय रूपक
  choice: रूपक को अक्षरशः बनाए रखा
  alternative: ‘अपनी शक्ति से’
  rationale: मूल पाठ जानबूझकर ईश्वर के दाहिने हाथ की छवि प्रस्तुत करता है; इसे अमूर्त शक्ति में बदलना अनावश्यक व्याख्या होती।
- issue: उद्यान और पृथ्वी की कालगत प्राथमिकता
  choice: उद्यान को पृथ्वी के अस्तित्व में आने से पहले लगाया हुआ बताया
  alternative: ‘पृथ्वी के प्रकट होने से पहले’
  rationale: मूल के कालगत दावे और अंग्रेज़ी परामर्श-पाठ के संशोधित अर्थ को बनाए रखते हुए किसी सृष्टितात्त्विक तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्रार्थनात्मक संदर्भ के अनुरूप परमेश्वर के लिए निकटवर्ती एकवचन ‘तू/तेरे’ रखा गया है।
