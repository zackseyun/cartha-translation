id: 2ES.3.33
reference: 2 Esdras 3:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarum merces non conparuit neque labor fructificavit? pertransiens enim pertransivi in gentibus, et vidi abundantes eas et non memorantes mandatorum tuorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/033.yaml
  text: Yet their reward has not appeared[a], nor has their labor borne fruit. For I have passed through the nations and seen them prospering, though they do not remember your commandments.
translation:
  language: hi
  text: तौभी उनका प्रतिफल प्रकट नहीं हुआ, न उनके परिश्रम ने फल उत्पन्न किया। क्योंकि मैं जातियों में होकर गुजरा हूँ और मैंने उन्हें समृद्ध देखा है, जबकि वे आपकी आज्ञाओं को स्मरण नहीं करतीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: merces
  choice: प्रतिफल
  rationale: यहाँ परिश्रम के बदले मिलने वाले परिणाम या फल का भाव है; ‘प्रतिफल’ गरिमापूर्ण और स्वाभाविक है।
- source_word: non conparuit
  choice: दिखाई नहीं दिया
  rationale: लातीनी क्रिया का मूल भाव प्रकट या दृष्टिगोचर होने का है; इसे कारण बताए बिना यथावत रखा गया है।
- source_word: labor fructificavit
  choice: परिश्रम ने फल दिया
  rationale: मूल के फल उत्पन्न करने वाले रूपक को हिन्दी में स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: pertransiens enim pertransivi
  choice: क्योंकि मैं ... घूमता रहा
  rationale: लातीनी पुनरुक्ति व्यापक रूप से अनेक जातियों में होकर जाने पर बल देती है; हिन्दी में सतत भ्रमण से यह बल स्वाभाविक रूप में व्यक्त होता है।
- source_word: abundantes
  choice: समृद्ध
  rationale: यह शब्द बहुतायत या संपन्न दशा को दर्शाता है; ‘समृद्ध’ प्रसंग के विरोधाभास को स्पष्ट और सहज रखता है।
- source_word: non memorantes mandatorum tuorum
  choice: आपकी आज्ञाओं को स्मरण नहीं करतीं
  rationale: मूल में ‘स्मरण’ का विचार है, केवल पालन न करने का नहीं; इसलिए उस संभावित अर्थ-विस्तार को नहीं जोड़ा गया।
theological_decisions:
- issue: दुष्ट जातियों की समृद्धि और प्रतिफल-विहीन परिश्रम के बीच तनाव
  choice: विरोधाभास को बिना व्याख्यात्मक समाधान के रखा गया
  alternative: इसे स्पष्टतः इस्राएल के धार्मिक परिश्रम और अन्यजातियों की भौतिक सफलता के रूप में समझाना
  rationale: मूल पद प्रश्न और अवलोकन प्रस्तुत करता है, पर इस पद में उनके कारण या अंतिम समाधान का प्रतिपादन नहीं करता।
- issue: ‘आज्ञाओं को स्मरण करना’ का आशय
  choice: शाब्दिक-सार्थक ‘स्मरण नहीं करतीं’
  alternative: ‘आज्ञाओं का पालन नहीं करतीं’
  rationale: पालन न करना निहित हो सकता है, किन्तु मूल शब्द स्मरण पर केंद्रित है; अनुवाद को अर्थ का संकुचन नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘जाति-जाति में’ व्यापक भ्रमण का स्वाभाविक बोध देता है। स्त्रीलिंग ‘करतीं’ का संबंध ‘जातियों’ से है।
