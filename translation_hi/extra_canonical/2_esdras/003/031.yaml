lexical_decisions:
- source_word: nihil nemini
  choice: किसी को कुछ भी नहीं
  rationale: दोनों निषेधों को स्वाभाविक हिन्दी में पूर्ण निषेध के रूप में रखा गया है।
- source_word: quomodo debeat derelinqui via haec
  choice: कि यह मार्ग किस प्रकार छोड़ा जाना चाहिए
  rationale: लातीनी निष्क्रिय रचना और debeat की बाध्यता को बनाए रखता है; ‘मार्ग’ के सम्भावित रूपक अर्थ को स्पष्ट करके सीमित नहीं करता।
- source_word: facit meliora
  choice: बेहतर काम करता है
  rationale: शाब्दिक अर्थ ‘बेहतर करता/काम करता है’ है; यह कर्म और आचरण दोनों की सम्भावना खुली रखता है।
- source_word: Babylon ... Sion
  choice: बाबुल ... सिय्योन
  rationale: आधुनिक हिन्दी बाइबलीय प्रचलन के अनुरूप स्थान-नाम।
theological_decisions:
- issue: बाबुल और सिय्योन की तुलना का स्वरूप
  choice: क्या बाबुल सिय्योन से बेहतर काम करता है?
  alternative: क्या बाबुल के काम सिय्योन के कामों से बेहतर हैं?
  rationale: मूल facit क्रिया को प्रत्यक्ष रूप से बनाए रखा गया है और तुलना को किसी विशेष धार्मिक व्याख्या तक सीमित नहीं किया गया।
- issue: पहले खंड में व्यक्त कर्ता का अभाव
  choice: ‘बताया गया’ जोड़कर निहित वाक्य-क्रिया स्पष्ट की गई
  alternative: किसी को कुछ भी नहीं कि यह मार्ग...
  rationale: लातीनी पाठ इस पद-विभाजन में खंडित है और सम्भवतः पिछले पद की क्रिया पर निर्भर है; हिन्दी में अर्थगम्यता हेतु निष्क्रिय क्रिया जोड़ी गई, बिना किसी कर्ता की पहचान तय किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पहले वाक्य की स्रोतगत खंडित संरचना को स्वाभाविक हिन्दी में पूरा किया गया है, पर कर्ता अनिर्दिष्ट रखा गया है।
