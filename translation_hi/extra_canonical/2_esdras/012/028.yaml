translation:
  language: hi
  text: फिर भी यह भी अन्तिम दिनों में तलवार से मारा जाएगा। और क्योंकि तुमने देखा
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sed tamen
  choice: फिर भी
  rationale: यह विरोधसूचक बल को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: et hic
  choice: यह भी
  rationale: et के समावेशी अर्थ और hic के एकवचन संकेत—‘यह व्यक्ति’—दोनों को सुरक्षित रखता है।
- source_word: gladio ... cadet
  choice: तलवार से मारा जाएगा
  rationale: शाब्दिक ‘तलवार से गिरेगा’ की अपेक्षा हिन्दी में मृत्यु का अभिप्राय स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: in nouissimis
  choice: अन्तिम दिनों में
  rationale: अन्त-काल संबंधी बहुवचन अभिव्यक्ति को अंग्रेज़ी परामर्श-पाठ के अनुरूप और आधुनिक बाइबलीय हिन्दी में सुबोध रूप देता है।
- source_word: Et quoniam uidisti
  choice: और क्योंकि तुमने देखा
  rationale: अधूरे अगले वाक्य की संरचना को स्रोत की तरह खुला रखता है; आगे की सामग्री यहाँ नहीं जोड़ी गई।
theological_decisions:
- issue: in nouissimis का कालान्त-संबंधी अर्थ
  choice: अन्तिम दिनों में
  alternative: अन्त में
  rationale: बहुवचन Latin nouissimis तथा परामर्श-पाठ के ‘last days’ को बनाए रखते हुए किसी अधिक विशिष्ट अन्त-कालीन व्यवस्था को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। पदांश स्रोत की तरह अगले वाक्य के बीच में समाप्त होता है, इसलिए अन्त में विराम-चिह्न नहीं लगाया गया।
