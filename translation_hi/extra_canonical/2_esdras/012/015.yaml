  text: For the second who begins to reign will hold power longer[a]
translation:
  language: hi
  text: क्योंकि जो दूसरा व्यक्ति शासन करना आरम्भ करेगा, वह अधिक समय तक सत्ता में बना रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; यहाँ विरोधसूचक ‘परन्तु’ उचित नहीं है।
- source_word: secundus
  choice: दूसरा व्यक्ति
  rationale: क्रम में दूसरे शासक का संकेत है; ‘व्यक्ति’ जोड़ने से हिन्दी में आशय स्वाभाविक और स्पष्ट रहता है।
- source_word: incipiet regnare
  choice: शासन करना आरम्भ करेगा
  rationale: भविष्यकाल और शासन के आरम्भ—दोनों अर्थों को निकटता से व्यक्त करता है।
- source_word: ipse tenebit amplius
  choice: वह अधिक समय तक सत्ता में बना रहेगा
  rationale: tenebit के सत्ता धारण किए रहने और amplius के तुलनात्मक/अधिक अवधि के भाव को सहज हिन्दी में व्यक्त करता है, बिना पद में अनुपस्थित तुलना का मानक जोड़ने के।
