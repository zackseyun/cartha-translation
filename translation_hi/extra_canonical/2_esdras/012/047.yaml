  language: hi
  text: क्योंकि परमप्रधान के सामने तुम्हारा स्मरण है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memoria uestri
  choice: तुम्हारी स्मृति
  rationale: लातीनी पदबंध में uestri, memoria पर निर्भर संबंधकारक है और आशय संबोधित लोगों की स्मृति/याद से है। ‘तुम्हारा स्मरण’ आधुनिक हिन्दी में उनके द्वारा स्मरण करने का अर्थ भी दे सकता था; ‘तुम्हारी स्मृति’ मूल की वस्तुगत दिशा को अधिक सुरक्षित रखता है।
- source_word: coram altissimo
  choice: परमप्रधान के सामने
  rationale: coram का स्थानिक-उपस्थितिपरक रूपक बनाए रखा गया है और altissimus की प्रतिष्ठित ईश्वरीय उपाधि के लिए ‘परमप्रधान’ चुना गया है।
- source_word: Est
  choice: बनी हुई है
  rationale: सिर्फ ‘है’ की अपेक्षा यह हिन्दी में स्मृति के परमप्रधान के सामने विद्यमान और कायम होने का भाव स्वाभाविक ढंग से व्यक्त करता है, बिना ‘वह तुम्हें याद रखता है’ जैसी अधिक व्याख्यात्मक पुनर्रचना के।
theological_decisions:
- issue: क्या वाक्य को सीधे ‘परमप्रधान तुम्हें स्मरण रखता है’ के रूप में व्यक्त किया जाए
  choice: मूल के ‘परमप्रधान के सामने तुम्हारी स्मृति’ रूपक को बनाए रखा गया
  alternative: क्योंकि परमप्रधान तुम्हें स्मरण रखता है।
  rationale: वैकल्पिक रूप अर्थ स्पष्ट करता है, पर memoria ... coram की संरचना और उसमें निहित न्यायालय/उपस्थिति-सदृश छवि को मिटा देता है।
- issue: अंग्रेज़ी की पुरानी लंबी पाठ-परंपरा का अतिरिक्त वाक्यांश
  choice: केवल दिए गए लातीनी स्रोत का Est enim memoria uestri coram altissimo खंड अनूदित किया गया
  alternative: ‘और सामर्थी ने संघर्ष में तुम्हें नहीं भुलाया’ जैसा अतिरिक्त खंड जोड़ना
  rationale: वह सामग्री उपलब्ध मूल-पाठ में नहीं है; इसलिए उसे मुख्य पाठ या पादटिप्पणी के रूप में आयात नहीं किया गया। ‘tu domus Jacob’ पूर्ववर्ती संबोधन/वाक्य का अंत है और इस पद के अंग्रेज़ी संपादित सीमा-निर्धारण के अनुसार यहाँ शामिल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘परमप्रधान’ ईश्वरीय उपाधि के रूप में रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि अंग्रेज़ी परामर्श-पाठ की दोनों टिप्पणियाँ हटाई जा चुकी उस सामग्री से संबंधित हैं।
