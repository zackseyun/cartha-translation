id: 2ES.12.23
reference: 2 Esdras 12:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quiescentia, Haec est interpretatio : in nouissimis eius suscitabit altissimus tria regna et renouabit in ea multa et dominabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/023.yaml
  text: 'And because you saw three heads at rest[a], this is the interpretation: in its last days the Most High will raise up three kingdoms and renew many things in it, and they will rule.'
translation:
  language: hi
  text: 'और तुमने जो तीन सिर शांत पड़े हुए देखे, उसका अर्थ यह है: उसके अन्तिम दिनों में परमप्रधान तीन राज्य खड़े करेगा, उसमें बहुत-सी बातों को नया रूप देगा[a], और वे शासन करेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसमें’ के लिए लैटिन में स्त्रीलिंग एकवचन है; इसका संकेत तीन राज्यों की ओर नहीं, बल्कि प्रसंग में किसी स्त्रीलिंग एकवचन संज्ञा—संभवतः उकाब या पृथ्वी—की ओर है।
    reason: सर्वनाम के व्याकरणिक वचन और उसके अनिश्चित पूर्वपद को स्पष्ट करना।
lexical_decisions:
- source_word: quiescentia
  choice: शांत पड़े हुए
  rationale: यह बहुवचन रूप तीन सिरों की स्थिर, निष्क्रिय अवस्था बताता है; ‘विश्राम करते हुए’ की अपेक्षा यह दृश्य के लिए अधिक स्वाभाविक है।
- source_word: interpretatio
  choice: अर्थ
  rationale: दर्शन की व्याख्या के संदर्भ में सरल और स्वाभाविक आधुनिक हिन्दी।
- source_word: in nouissimis eius
  choice: उसके अन्तिम दिनों में
  rationale: eius के संबंध-सूचक अर्थ और अन्त-कालीन भाव को बनाए रखता है, बिना उसके संदर्भ को अनावश्यक रूप से निश्चित किए।
- source_word: suscitabit
  choice: खड़े करेगा
  rationale: राज्यों को उदित या स्थापित करने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: tria regna
  choice: तीन राज्य
  rationale: लैटिन के नपुंसकलिंग बहुवचन का सीधा अर्थ।
- source_word: renouabit ... multa
  choice: बहुत-सी बातों को नया करेगा
  rationale: multa की व्यापकता को बनाए रखता है; इसे किसी विशिष्ट सुधार या पुनर्स्थापना तक सीमित नहीं करता।
- source_word: dominabunt
  choice: वे शासन करेंगे
  rationale: बहुवचन कर्ता तीन राज्यों की ओर संकेत करता है और शासन करने का सीधा अर्थ देता है।
theological_decisions:
- issue: परमप्रधान द्वारा राज्यों को खड़ा किया जाना
  choice: परमप्रधान तीन राज्य खड़े करेगा
  alternative: परमप्रधान तीन राजाओं को खड़ा करेगा
  rationale: स्रोत में regna स्पष्ट रूप से ‘राज्य’ है, ‘राजा’ नहीं; इसलिए राजनीतिक इकाइयों और उनके शासकों को एक नहीं किया गया।
- issue: eius और ea के संकेत
  choice: सर्वनामों को ‘उसके’ और ‘उसमें’ के रूप में खुला रखा
  alternative: उन्हें सीधे ‘उकाब’, ‘राज्य’ या ‘पृथ्वी’ से जोड़ना
  rationale: उपलब्ध लैटिन अंश में संकेतित संज्ञा प्रत्यक्ष नहीं है; अनुवाद किसी एक व्याख्या को थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथन। दर्शन-व्याख्या की औपचारिकता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
