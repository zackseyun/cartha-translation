  text: and in my spirit I am very weak[a], and there is not even a little strength in me because of the great fear that terrified me this night.
translation:
  language: hi
  text: मैं अपनी आत्मा में बहुत निर्बल हूँ, और इस रात जिस बड़े भय ने मुझे आतंकित कर दिया, उसके कारण मुझमें तनिक भी शक्ति नहीं है। इसलिए अब मैं प्रार्थना करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiritu meo inualidus sum ualde
  choice: मैं अपनी आत्मा में बहुत निर्बल हो गया हूँ
  rationale: यह लैटिन के आत्मिक या भीतरी दुर्बलता के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘आत्मा’ को केवल मन या भावना तक सीमित नहीं करता।
- source_word: nec modica est in me uirtus
  choice: मुझमें तनिक भी शक्ति नहीं रही
  rationale: यहाँ virtus का अर्थ नैतिक सद्गुण नहीं, बल्कि भय के कारण बची हुई सामर्थ्य या शक्ति है।
- source_word: a multo timore quem expaui
  choice: जिस बड़े भय से मैं आतंकित हो उठा
  rationale: expaui की तीव्रता को केवल ‘भय महसूस किया’ कहने के बजाय ‘आतंकित हो उठा’ से व्यक्त किया गया है; ‘से’ लैटिन की कारणसूचक रचना को सहज हिन्दी देता है।
- source_word: Nunc ergo orabo
  choice: इसलिए अब मैं प्रार्थना करूँगा
  rationale: ergo के निष्कर्षसूचक संबंध और भविष्यकालीन orabo दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ‘आत्मा’ में निर्बलता का आशय
  choice: आत्मा
  alternative: मन
  rationale: spiritu का व्यापक आध्यात्मिक और आंतरिक अर्थ बनाए रखा गया है; ‘मन’ चुनने से अर्थ अनावश्यक रूप से मनोवैज्ञानिक हो जाता।
- issue: भय के प्रभाव की तीव्रता
  choice: आतंकित हो उठा
  alternative: भय महसूस किया
  rationale: expavesco अचानक और प्रबल भय को व्यक्त करता है; हल्का विकल्प दर्शन के प्रचंड प्रभाव को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तनिक भी शक्ति नहीं रही’ सामान्य पाठक के लिए स्वाभाविक है और मूल के जोर को बनाए रखता है। स्रोत में उपस्थित अंतिम वाक्य ‘Nunc ergo orabo’ भी अनूदित किया गया है, यद्यपि परामर्श हेतु दिए गए अंग्रेज़ी पाठ में वह नहीं था।
