  yaml_path: translation/extra_canonical/2_esdras/012/039.yaml
  text: But you, remain here still for seven more days, so that whatever it may please the Most High to show you may be shown to you.” And he departed from me.
translation:
  language: hi
  text: इन रहस्यों को गुप्त रखना। पर तुम अभी सात और दिन यहीं ठहरे रहो, ताकि जो कुछ परमप्रधान को उचित लगे, वह तुम्हें दिखाया जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruare
  choice: सुरक्षित रखना
  rationale: लातीनी infinitive का अर्थ ‘संभालकर/सुरक्षित रखना’ है; उपलब्ध अंश संभवतः पिछले वाक्य से जुड़ा है, इसलिए हिन्दी में स्वाभाविक आज्ञार्थक रूप रखा गया।
- source_word: secreta haec
  choice: इन गुप्त बातों को
  rationale: secreta का तटस्थ अर्थ ‘गुप्त बातें/रहस्य’ हो सकता है; प्रसंग में प्रकट की गई लेकिन सुरक्षित रखी जाने वाली बातों के लिए यह सरल और स्वाभाविक है।
- source_word: adhuc sustine hic
  choice: अभी ... यहीं ठहरे रहो
  rationale: sustine में टिके/बने रहने का भाव है; स्थान-संबंधी hic के साथ ‘यहीं ठहरे रहो’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: alios dies septem
  choice: और सात दिन
  rationale: शाब्दिक क्रम के बजाय सहज हिन्दी क्रम अपनाया गया, अर्थ अक्षुण्ण है।
- source_word: quicquid uisum fuerit altissimo
  choice: जो कुछ परमप्रधान को उचित लगे
  rationale: लातीनी idiom का अर्थ ‘जो कुछ परमप्रधान को अच्छा/उचित प्रतीत हो’ है; इसे इस तरह रखा गया कि परमप्रधान की इच्छा का भाव रहे, पर कथन अनावश्यक रूप से निश्चित न बने।
- source_word: ostendatur
  choice: तुम्हें दिखाया जाए
  rationale: निष्क्रिय विधिलिंग का भाव हिन्दी के कर्मवाच्य में सुरक्षित रखा गया।
theological_decisions:
- issue: परमप्रधान की इच्छा और आगे के प्रकाशन की सीमा
  choice: जो कुछ परमप्रधान को उचित लगे
  alternative: वह सब जो परमप्रधान तुम्हें दिखाना चाहे
  rationale: मूल में impersonal ‘uisum fuerit altissimo’ है। चुना हुआ रूप निर्णय परमप्रधान पर छोड़ता है और यह दावा नहीं करता कि कोई पूर्वनिर्धारित ‘सब कुछ’ अवश्य दिखाया जाएगा।
- issue: अंग्रेज़ी पाठ का अंतिम वाक्य
  choice: “और वह मेरे पास से चला गया” को शामिल नहीं किया गया
  alternative: और वह मेरे पास से चला गया।
  rationale: दिया गया साफ़ लातीनी स्रोत ostendatur पर समाप्त होता है और इस वाक्य के लिए मूल-पाठीय आधार प्रस्तुत नहीं करता। स्रोत-प्रमाण को प्राथमिकता देते हुए अंग्रेज़ी consultation layer की अतिरिक्त पंक्ति नहीं अपनाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल शैली। वाक्य की शुरुआत उपलब्ध लातीनी अंश के खंडात्मक स्वरूप को न्यूनतम रूप से सहज बनाती है। कोई फुटनोट आवश्यक नहीं समझा गया।
