source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: terram, Et qui habitant in ea cum labore multo super omnes qui fuerunt ante hos; propter hoc ipsi uocati sunt capita
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/024.yaml
  text: the earth and those who dwell in it, with much oppression, more than all who were before them; therefore they are called the heads
translation:
  language: hi
  text: पृथ्वी और उसके निवासियों को उन्होंने उनसे पहले के सभी लोगों की अपेक्षा बहुत अधिक कष्ट पहुँचाया; इसी कारण वे सिर कहलाए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum labore multo
  choice: कहीं अधिक कष्ट दिया
  rationale: लातीनी पद का शाब्दिक अर्थ ‘बहुत परिश्रम/कष्ट के साथ’ है। यहाँ पृथ्वी और उसके निवासी कर्म के रूप में आए हैं और संदर्भ शासकों के कठोर दमन का है, इसलिए स्वाभाविक हिन्दी में इसे ‘कष्ट दिया’ कहा गया है; ‘उत्पीड़न’ की अपेक्षा यह मूल शब्द की व्यापक अर्थ-सीमा को अधिक सुरक्षित रखता है।
- source_word: super omnes qui fuerunt ante hos
  choice: अपने सभी पूर्ववर्तियों से कहीं अधिक
  rationale: तुलना उन सभी से है जो इनसे पहले थे। ‘पूर्ववर्तियों’ से संक्षिप्त और स्वाभाविक रूप में यही संबंध व्यक्त होता है।
- source_word: capita
  choice: सिर
  rationale: मूल में बहुवचन ‘सिर’ है और यह दर्शन की प्रतीकात्मक शब्दावली है; अर्थ को ‘प्रमुख’ कहकर स्पष्ट करने के बजाय प्रतीक को ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: ‘सिर’ की प्रतीकात्मक पहचान
  choice: सिर
  alternative: प्रमुख / मुखिया
  rationale: पद स्वयं प्रतीक की व्याख्या नहीं करता। इसलिए किसी विशिष्ट ऐतिहासिक या धर्मवैचारिक पहचान को आरोपित किए बिना मूल रूपक सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी। यह पद पिछले वाक्य से जुड़ा हुआ खंड है, इसलिए आरंभ ‘पृथ्वी’ से किया गया है और ‘इसी कारण’ से कारणात्मक संबंध बनाए रखा गया है।
