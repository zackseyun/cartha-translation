  yaml_path: translation/extra_canonical/2_esdras/012/038.yaml
  text: And you shall teach them to the wise among your people, whose hearts you know are able to comprehend and keep them secret.
translation:
  language: hi
  text: और तुम उन्हें अपनी प्रजा के उन बुद्धिमानों को सिखाओगे, जिनके बारे में तुम जानते हो कि उनके हृदय उन्हें समझने और गुप्त रखने में समर्थ हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: docebis
  choice: सिखाना
  rationale: भविष्यकालीन आदेश के प्रवाह को स्वाभाविक हिन्दी में क्रियार्थक आदेश के रूप में व्यक्त करता है।
- source_word: sapientes de populo tuo
  choice: अपनी प्रजा के उन बुद्धिमानों को
  rationale: sapientes का सीधा अर्थ ‘बुद्धिमान’ और populus का प्रसंगानुकूल अर्थ ‘प्रजा’ रखा गया है।
- source_word: corda posse capere
  choice: उनके हृदय इन्हें समझ सकते हैं
  rationale: हृदय की मूल उपमा को बनाए रखते हुए capere के यहाँ ग्रहण करने/समझने के अर्थ को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ea
  choice: इन्हें
  rationale: नपुंसकलिंग बहुवचन सर्वनाम का संदर्भ पहले बताई गई बातों से है; अनावश्यक रूप से ‘रहस्य’ जोड़ने से बचा गया है।
- source_word: servare…arcana (implied/continuing sense)
  choice: गुप्त रख सकते हैं
  rationale: परामर्श-पाठ में सुरक्षित अर्थ को हिन्दी में स्पष्ट किया गया है, पर वस्तु के रूप में ‘इन रहस्यों’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
theological_decisions:
- issue: ज्ञान का सीमित संप्रेषण
  choice: पाठ के अनुसार शिक्षा केवल प्रजा के योग्य बुद्धिमानों को दी जाती है
  alternative: इसे सभी लोगों के लिए सामान्य शिक्षा के रूप में कहना
  rationale: स्रोत का sapientes de populo tuo और हृदयों की क्षमता का उल्लेख चयनात्मक संप्रेषण को बनाए रखता है; इसे व्यापक या संप्रदायगत सिद्धांत में नहीं बदला गया।
- issue: ‘हृदय’ की क्षमता
  choice: ‘हृदय’ को मूल रूपक के रूप में रखा गया
  alternative: केवल ‘मन’ या ‘बुद्धि’ कहना
  rationale: corda का व्यापक आंतरिक ग्रहणशीलता वाला भाव बना रहता है और पाठ की धार्मिक-मानवीय भाषा संकुचित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘जिनके विषय में तुम जानते हो कि उनके हृदय…’ संरचना मूल के संबंधवाचक वाक्य को सुरक्षित रखती है। उपलब्ध लैटिन उद्धरण अंतिम et पर अपूर्ण दिखाई देता है; ‘गुप्त रख सकते हैं’ अंग्रेज़ी POB की परीक्षित परामर्श-परत में सुरक्षित पाठार्थ के अनुसार दिया गया है, बिना ‘इन रहस्यों’ जैसी अतिरिक्त संज्ञा जोड़े।
