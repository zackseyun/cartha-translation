  text: 'the two little wings crossing over to the head that is on the right side—this is the interpretation: these are the ones whom the Most High has preserved in[a]'
translation:
  language: hi
  text: 'वे दो छोटे पंख जो दाईं ओर के सिर के ऊपर से होकर गए—इसका अर्थ यह है: ये वे हैं जिन्हें परमप्रधान ने … में सुरक्षित रखा है[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रदत्त लैटिन पाठ ‘in’ (‘में’) पर अधूरा समाप्त होता है; आगे के शब्द इस स्रोतांश में उपलब्ध नहीं हैं।
    reason: खंडित स्रोत के कारण हिन्दी वाक्य की असामान्य अपूर्णता स्पष्ट करना।
lexical_decisions:
- source_word: duas subalares
  choice: दो छोटे पंख
  rationale: ‘subalares’ उकाब के दर्शन में छोटे अथवा गौण पंखों को सूचित करता है; सहज हिन्दी में ‘छोटे पंख’ स्पष्ट है।
- source_word: treicentes super
  choice: ऊपर से होकर गए
  rationale: यह क्रियात्मक पद एक ओर से सिर की ओर/ऊपर पार जाने की गति बताता है; हिन्दी में स्वाभाविक रूप से गतिशील अर्थ रखा गया है।
- source_word: caput quod est a dextera parte
  choice: दाईं ओर का सिर
  rationale: लैटिन स्थानवाचक संबंध को सीधे और स्पष्ट रूप में व्यक्त करता है।
- source_word: Haec est interpretatio
  choice: इसका अर्थ यह है
  rationale: दर्शन की व्याख्या प्रस्तुत करने वाला प्रचलित और सहज हिन्दी सूत्र।
- source_word: altissimus
  choice: परमप्रधान
  rationale: परमेश्वर के लिए प्रयुक्त लैटिन सर्वोच्चता-सूचक उपाधि का पारंपरिक और अर्थसंगत हिन्दी रूप।
- source_word: conseruauit
  choice: सुरक्षित रखा है
  rationale: संरक्षित रखने या बचाकर रखने का अर्थ बनाए रखता है।
- source_word: in
  choice: इसमें
  rationale: प्रदत्त स्रोत इसी अधूरे संबंधबोधक पद पर समाप्त होता है; ‘इसमें’ उस अपूर्णता को बिना अनुमान से पूरा किए दर्शाता है।
theological_decisions:
- issue: खंडित स्रोत के अंतिम ‘in’ का अर्थ
  choice: ‘इसमें’ लिखकर वाक्य को जानबूझकर अपूर्ण रखा
  alternative: अगले पद से पूरक शब्द लेकर अर्थ पूरा करना
  rationale: प्रदत्त लैटिन साक्ष्य ‘in’ पर टूटता है। किसी स्थान, समय या परिस्थिति का अनुमान लगाना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दर्शन-संबंधी बिंब और स्रोत की वास्तविक अपूर्णता दोनों सुरक्षित रखे गए हैं।
