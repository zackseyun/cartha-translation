  yaml_path: translation/extra_canonical/2_esdras/012/002.yaml
  text: that I looked[a], and behold, the head that had remained did not appear. And the two wings that had gone over to it arose and were set up to reign, and their reign was brief and full of turmoil. And I looked, and behold, they too did not appear, and the whole body of the eagle was burning[b], and the earth was greatly terrified.
translation:
  language: hi
  text: कि मैंने देखा, और देखो, जो सिर शेष रह गया था, वह दिखाई नहीं दिया। और जो दो पंख उसके पास जा पहुँचे थे, वे उठ खड़े हुए और राज्य करने के लिए स्थापित किए गए[a]; उनका शासन अल्पकालिक और उपद्रव से भरा था। फिर मैंने देखा, और देखो, वे भी दिखाई नहीं दे रहे थे, और उकाब का सारा शरीर जल रहा था[b], और पृथ्वी बहुत भयभीत हो रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो दो पंख उसके पास जा पहुँचे थे, वे राज्य करने के लिए उठ खड़े हुए।”
    reason: पूर्व rendering; यह विकल्प surrexerunt और ut regnarent को एक ही वाक्यांश में जोड़ता है, जबकि मुख्य पाठ erectae sunt की अलग निष्क्रिय क्रिया को भी व्यक्त करता है।
  - marker: b
    text: या, “जलाया जा रहा था।”
    reason: लातीनी incendebatur निष्क्रिय अपूर्ण भूतकाल है; संदर्भ में यह जारी जलने अथवा जलाए जाने, दोनों प्रकार से व्यक्त हो सकता है।
lexical_decisions:
- source_word: superauerat caput
  choice: जो सिर बचा रह गया था
  rationale: लातीनी पूर्णकाल उस सिर को दर्शाता है जो पहले के विनाश के बाद शेष रहा था।
- source_word: alae duae
  choice: दो पंख
  rationale: दर्शन में उकाब के अंगों के लिए सीधा और स्वाभाविक हिन्दी रूप।
- source_word: erectae sunt ut regnarent
  choice: राज्य करने के लिए स्थापित किए गए
  rationale: निष्क्रिय क्रिया को बनाए रखता है और पहले आए surrexerunt (‘उठ खड़े हुए’) से इसे अलग क्रिया के रूप में प्रस्तुत करता है।
- source_word: regnum eorum exile
  choice: उनका शासन थोड़े समय का
  rationale: संदर्भ में exile शासन की अल्प अवधि को सूचित करता है; ‘शासन’ regnum के राजकीय कार्यकाल-संबंधी अर्थ को सहज रूप से व्यक्त करता है।
- source_word: tumulti plenum
  choice: उपद्रव से भरा
  rationale: tumultus के अशांति, हलचल और अव्यवस्था के भाव को संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: incendebatur
  choice: जल रहा था
  rationale: अपूर्ण भूतकाल दर्शन में जारी जलने की प्रक्रिया को व्यक्त करता है, न कि केवल पूर्ण हो चुके विनाश को।
- source_word: expauescebat terra ualde
  choice: पृथ्वी बहुत अधिक भयभीत हो उठी
  rationale: expavescere के तीव्र भय में पड़ने के भाव और ualde की तीव्रता दोनों को बनाए रखता है।
