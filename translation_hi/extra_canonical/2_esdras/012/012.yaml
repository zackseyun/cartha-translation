lexical_decisions:
- source_word: uel
  choice: या
  rationale: लैटिन में यह पिछले कथन के साथ वैकल्पिक अभिव्यक्ति जोड़ता है; खंडित संदर्भ को बिना पूरा किए ‘या’ रखा गया है।
- source_word: interpretatus sum
  choice: मैंने उसका अर्थ बताया है
  rationale: ‘व्याख्या की है’ संभव है, पर सामान्य आधुनिक हिन्दी में यह रूप अधिक सहज है और पूर्ववर्ती दर्शन/चिह्न का अर्थ समझाने का भाव बनाए रखता है।
- source_word: Ecce
  choice: देखो
  rationale: ध्यान आकर्षित करने वाली भविष्यसूचक उद्घोषणा को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: dies ueniunt
  choice: वे दिन आ रहे हैं
  rationale: मूल की सामी-प्रभावित भविष्यसूचक अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: exsurget regnum
  choice: एक राज्य उठ खड़ा होगा
  rationale: exsurget के उदय/उठ खड़े होने के सशक्त भाव को बनाए रखता है; अनिश्चित regnum के लिए ‘एक राज्य’ उपयुक्त है।
