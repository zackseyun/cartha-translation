  yaml_path: translation/extra_canonical/2_esdras/012/003.yaml
  text: Then I awoke from great bewilderment of mind and from great fear[a], and I said to my spirit, “See, you have brought these things upon me, because
translation:
  language: hi
  text: तब मैं मन की बड़ी उलझन और भारी भय से जाग उठा,[a] और मैंने अपनी आत्मा से कहा, “देख, तूने ये बातें मुझ पर इसलिए ला दीं कि”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन की गहरी तंद्रा”; लातीनी पद असामान्य मानसिक अवस्था, गहरे विस्मय, या तंद्रा-जैसी दशा का संकेत कर सकता है।
    reason: excessu mentis की अर्थ-व्याप्ति को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: a multo excessu mentis
  choice: मन की बड़ी विक्षिप्तता से
  rationale: लातीनी पद मानसिक रूप से अपने सामान्य भाव से बाहर हो जाने, चकित-विचलित होने या दर्शनजनित असामान्य अवस्था को व्यक्त करता है। ‘विक्षिप्तता’ यहाँ इस तीव्र मानसिक दशा को स्वाभाविक हिन्दी में रखता है, बिना इसे निश्चित रूप से ‘समाधि’ या ‘तंद्रा’ ठहराए।
- source_word: a magno timore
  choice: भारी भय से
  rationale: magno की तीव्रता और timore के भयभाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: uigilaui
  choice: जाग उठा
  rationale: क्रिया का मूल अर्थ जागना है और प्रसंग में दर्शन अथवा मानसिक अवस्था से बाहर आने का भाव है।
- source_word: spiritui meo
  choice: अपने मन से
  rationale: spiritus का शाब्दिक अर्थ ‘आत्मा’ भी हो सकता है, पर स्वयं से आंतरिक संवाद के इस प्रसंग में ‘मन’ स्वाभाविक हिन्दी है और अंग्रेज़ी consultation layer के आशय से भी मेल खाता है।
- source_word: haec
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन haec को बहुवचन रूप में सुरक्षित रखा गया है।
- source_word: praestitisti
  choice: आने दीं
  rationale: इस संदर्भ में क्रिया का आशय उपलब्ध कराने, घटित कराने अथवा अनुभव होने देने से है। ‘आने दीं’ कर्तृत्व को जरूरत से अधिक कठोर बनाए बिना वाक्य को स्वाभाविक रखता है।
- source_word: in eo quod
  choice: इसलिए ... कि
  rationale: लातीनी संयोजक अगले पद में जारी कारणात्मक या व्याख्यात्मक उपवाक्य आरंभ करता है; इसलिए पद को जानबूझकर अपूर्ण रखा गया है।
theological_decisions:
- issue: spiritui meo में व्यक्ति अपने ‘मन’ से बोलता है या ‘आत्मा’ से
  choice: मन
  alternative: आत्मा
  rationale: यह आत्म-संवाद का मुहावरा है; ‘मन’ आधुनिक हिन्दी में स्पष्ट है। फिर भी स्रोत में spiritus होने के कारण वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: praestitisti में प्रत्यक्ष कारण बनाना या अनुमति देना
  choice: तूने ... आने दीं
  alternative: तूने ये बातें मुझ पर ला दीं
  rationale: लातीनी क्रिया व्यापक है। चुना गया रूप अनुभव के घटित होने को व्यक्त करता है, पर किसी विशिष्ट दैवी-कारण संबंध को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद अगले वाक्यांश पर निर्भर करते हुए ‘कि’ पर समाप्त होता है, जैसा कि लातीनी स्रोत में in eo quod से स्पष्ट है।
