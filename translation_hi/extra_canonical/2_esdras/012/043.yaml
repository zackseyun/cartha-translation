  text: और तूफ़ान से बचाए गए जहाज़ के लिए बंदरगाह के समान।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: portus
  choice: बंदरगाह
  rationale: जहाज़ के सुरक्षित पहुँचने और आश्रय पाने के स्थान का सीधा और स्वाभाविक हिन्दी शब्द।
- source_word: naui saluatae
  choice: बचाए गए जहाज़ के लिए
  rationale: लातीनी कृदंत के कर्मवाच्य भाव को बनाए रखता है और यह स्पष्ट करता है कि बंदरगाह जहाज़ के लिए है।
- source_word: a tempestate
  choice: तूफ़ान से
  rationale: अपादान भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ tempestas का संदर्भ समुद्री तूफ़ान है।
- source_word: sicut
  choice: के समान
  rationale: मूल उपमा को संक्षिप्त और गरिमापूर्ण ढंग से सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज अनुवाद। वाक्यांश का खंडात्मक रूप पूर्ववर्ती संदर्भ पर निर्भर मूल उपमा के अनुरूप रखा गया है। स्रोत के अंत में आया “Aut non sufficiunt” अगले वाक्य/पाठ-इकाई का आरंभ प्रतीत होता है और निर्दिष्ट पद के अंग्रेज़ी परामर्श-पाठ में भी नहीं है, इसलिए इसे इस पद के मुख्य पाठ में शामिल नहीं किया गया।
