  text: “But you alone were worthy to know this secret of the Most High[a].
translation:
  language: hi
  text: परन्तु केवल तुम ही परमप्रधान के इस रहस्य को जानने के योग्य थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tu autem solus
  choice: परन्तु केवल तुम ही
  rationale: ‘autem’ का विरोधसूचक भाव ‘परन्तु’ से और ‘solus’ का बल ‘केवल ... ही’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: dignus fuisti
  choice: योग्य थे
  rationale: लातीनी वाक्यांश का सीधा अर्थ ‘योग्य थे’ है; इसमें ‘योग्य ठहराए गए’ जैसा कर्मवाच्य या न्यायनिर्णय का अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: scire
  choice: जानने के
  rationale: यह infinitive ‘dignus’ के साथ उस बात को बताता है जिसके लिए एज्रा योग्य था।
- source_word: altissimi
  choice: परमप्रधान के
  rationale: ईश्वर के लिए प्रयुक्त लातीनी सर्वोच्चता-सूचक उपाधि का प्रतिष्ठित और स्पष्ट हिन्दी रूप।
- source_word: secretum hoc
  choice: इस रहस्य को
  rationale: लातीनी संकेतवाचक ‘hoc’ को ‘इस’ और ‘secretum’ को प्रसंगानुकूल ‘रहस्य’ से व्यक्त किया गया है।
theological_decisions:
- issue: योग्यता की प्रकृति
  choice: योग्य थे
  alternative: योग्य ठहराए गए थे
  rationale: मूल में केवल ‘dignus fuisti’ है; वह योग्यता का कथन करता है, पर यह स्पष्ट नहीं करता कि किसी ने औपचारिक रूप से योग्य ठहराया। इसलिए संभावित धार्मिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट प्रस्तुति। ‘परमप्रधान’ ईश्वरीय उपाधि के रूप में रखा गया है; अनावश्यक संस्कृतनिष्ठता और व्याख्यात्मक विस्तार से बचा गया है।
