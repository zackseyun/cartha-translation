  terminology: «परमप्रधान» Altissimus के लिए उपयुक्त प्रतिष्ठित ईश्वरीय उपाधि है और «रहस्य» secretum के लिए सटीक है। «योग्य थे» मूल में अनुपस्थित ‘योग्य ठहराए गए’ अथवा ‘पाए गए’ का अतिरिक्त भाव नहीं जोड़ता।
