    text: या, “पृथ्वी पर, और वह उन सभी राज्यों से अधिक भयावह होगी जो उससे पहले थे।”
    reason: कुछ पाठ-साक्ष्य/पाठ-संशोधन timoratio के स्थान पर तुलनात्मक timoratior का समर्थन करते हैं।
lexical_decisions:
- source_word: super terram
  choice: पृथ्वी पर
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक अनुवाद; इसे पद 13 में बनाए रखा गया है।
- source_word: timoratio
  choice: आतंक
  rationale: प्रदत्त साफ़ किए हुए लातीनी पाठ में संज्ञात्मक रूप है; इसलिए मुख्य पाठ में तुलना जोड़े बिना ‘आतंक’ रखा गया है।
- source_word: omnium regnorum quae fuerunt ante eam
  choice: उन सभी राज्यों का … जो उससे पहले थे
  rationale: सम्बन्धवाचक संरचना और स्त्रीलिंग एकवचन सर्वनाम eam का संदर्भ स्वाभाविक हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: timoratio और सम्भावित timoratior पाठ के बीच पाठगत/व्याकरणिक अस्पष्टता
  choice: मुख्य पाठ में ‘उन सभी राज्यों का आतंक’
  alternative: ‘उन सभी राज्यों से अधिक भयावह’
  rationale: प्रदत्त मूल-पाठ timoratio के संज्ञात्मक अर्थ को मुख्य स्थान दिया गया है, जबकि प्रमाणित तुलनात्मक पाठ-सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है; इससे अस्पष्टता का अनुचित समाधान नहीं किया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यह अंश पिछले वाक्य से जुड़ा हुआ है, इसलिए आरम्भ का ‘पृथ्वी पर, और’ जानबूझकर खंडात्मक रखा गया है।
