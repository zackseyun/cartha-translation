  source_fidelity: ‘पृथ्वी पर’ correctly retains super terram within verse 13. The main rendering ‘उन सभी राज्यों का आतंक’ follows the supplied Latin timoratio as a noun, while the footnote preserves the possible comparative timoratior reading without treating it as certain. ‘जो उससे पहले थे’ appropriately represents quae fuerunt ante eam, with the antecedent and feminine singular reference maintained idiomatically.
