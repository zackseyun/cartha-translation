  text: have sat in this place? For you surpass for us all the prophets, like a cluster from the vintage, and like a lamp in a dark place,"
translation:
  language: hi
  text: क्या आप इस स्थान पर बैठे हैं? क्योंकि हमारे लिए आप सब भविष्यद्वक्ताओं से बढ़कर हैं—जैसे अंगूर की कटनी में से एक गुच्छा, और जैसे अँधेरे स्थान में एक दीपक,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedisti
  choice: बैठे रहे हैं
  rationale: लातीनी पूर्णकाल को वर्तमान से जुड़े हुए पूर्व कार्य के रूप में व्यक्त करता है; खंड के बीच से आरम्भ होने वाले प्रश्न का स्वर भी बना रहता है।
- source_word: nobis superasti ex omnibus prophetis
  choice: हमारे लिए आप सब भविष्यद्वक्ताओं से बढ़कर हैं
  rationale: nobis के हित/दृष्टिकोण और superasti की तुलना को सुरक्षित रखा गया है; इसे ‘केवल आप ही बचे हैं’ जैसे व्याख्यात्मक अर्थ में नहीं बदला गया।
- source_word: botrus de uindemia
  choice: अंगूर की कटनी में अंगूरों का एक गुच्छा
  rationale: botrus और vindemia की कृषि-छवि को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: lucerna in loco obscuro
  choice: अँधेरे स्थान में एक दीपक
  rationale: मूल उपमा और स्थान-सूचक भाषा का सीधा तथा सहज रूपांतरण है।
theological_decisions:
- issue: एज्रा की अन्य भविष्यद्वक्ताओं से तुलना
  choice: सब भविष्यद्वक्ताओं से बढ़कर
  alternative: सब भविष्यद्वक्ताओं में से केवल आप ही हमारे लिए बचे हैं
  rationale: उपलब्ध लातीनी पाठ superasti तुलना व्यक्त करता है; ‘बचे हैं’ पाठ में निहित नहीं और अनावश्यक धर्मवैचारिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ रखा गया है। पद पिछले वाक्य के बीच से आरम्भ और अगले वाक्य की ओर जारी होता है, इसलिए आरम्भ में पूर्वसंदर्भ वाला प्रश्नांश और अंत में अल्पविराम सुरक्षित है।
