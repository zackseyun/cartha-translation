  yaml_path: translation/extra_canonical/2_esdras/012/046.yaml
  text: And I answered them and said[a], “Take courage, Israel, and do not grieve.”
translation:
  language: hi
  text: और मैंने उन्हें उत्तर दिया और कहा, “हे इस्राएल, हिम्मत रख और शोक मत कर।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हे याकूब के घराने, शोक मत कर।” यह वाक्यांश दिए गए लैटिन पाठ में अगले पद से संबद्ध है।
    reason: अंग्रेज़ी audit trail में दर्ज वैकल्पिक पद-विभाजन को सुरक्षित रखते हुए स्पष्ट किया गया है कि ‘याकूब के घराने’ इस पद के दिए गए लैटिन पाठ का भाग नहीं है।
lexical_decisions:
- source_word: respondi ad eos et dixi
  choice: मैंने उन्हें उत्तर दिया और कहा
  rationale: लैटिन की दो समन्वित क्रियाओं को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: Confide
  choice: हिम्मत रख
  rationale: यह एकवचन आज्ञार्थक रूप साहस और भरोसा बनाए रखने का आह्वान करता है; ‘हिम्मत रख’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: Israel
  choice: हे इस्राएल
  rationale: सम्बोधन को स्पष्ट रखते हुए पारंपरिक हिन्दी नाम-रूप अपनाया गया है।
- source_word: noli tristari
  choice: शोक मत कर
  rationale: लैटिन निषेधात्मक आज्ञा और एकवचन रूप सुरक्षित हैं; प्रसंग में ‘शोक करना’ दुखी होने या विलाप करने का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ‘इस्राएल’ को सामूहिक समुदाय के रूप में एकवचन सम्बोधन
  choice: एकवचन आज्ञार्थक रूप ‘हिम्मत रख’ और ‘शोक मत कर’ रखा गया
  alternative: बहुवचन ‘हिम्मत रखो’ और ‘शोक मत करो’
  rationale: मूल लैटिन में Confide और noli दोनों व्याकरणिक रूप से एकवचन हैं; समुदाय को एक सामूहिक व्यक्ति के रूप में सम्बोधित करने की मूल शैली सुरक्षित रखी गई है।
- issue: ‘याकूब के घराने’ वाक्यांश की अनुपस्थिति
  choice: वाक्यांश शामिल नहीं किया गया
  alternative: ‘और हे याकूब के घराने, शोक मत कर’
  rationale: दिए गए लैटिन पद में domus Jacob या उसका कोई समतुल्य नहीं है; वह अगले पद से सम्बद्ध पाठ है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे’ से प्रत्यक्ष सम्बोधन स्पष्ट होता है, और मूल के सामूहिक एकवचन को बनाए रखा गया है।
