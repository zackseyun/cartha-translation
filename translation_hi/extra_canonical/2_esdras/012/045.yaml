- source_word: plorauerunt uoce magna
  choice: ऊँचे स्वर से रोए
  rationale: लैटिन मुहावरे का अर्थ तीव्र और सुनाई देने योग्य विलाप है; हिन्दी में यह रूप अर्थ और गरिमा दोनों बनाए रखता है।
