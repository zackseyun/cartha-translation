  rationale: यह बाइबलीय स्थान-नाम का प्रचलित हिन्दी रूप है। स्रोत-पाठ में यह पिछले वाक्य से जुड़ा हुआ खंड है, इसलिए ‘के’ को बनाए रखा गया है।
- source_word: meliores
