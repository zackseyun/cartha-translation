id: 2ES.12.48
reference: 2 Esdras 12:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et fortis non est oblitus uestri in contentione. Ego enim non dereliqui uos neque excessi a uobis, sed ueni in hunc locum ut deprecarer pro desolatione Sion, et ut quererem misericordiam pro humilitate sanctificationis uestrae. Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos. Et profectus est populus sicut dixi ei in ciuitatem. Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
translation:
  language: hi
  text: क्योंकि मैंने तुम्हें न तो त्यागा है, न ही मैं तुमसे दूर गया हूँ। बल्कि मैं इस स्थान पर इसलिए आया हूँ कि सिय्योन की उजड़ी दशा के लिए विनती करूँ और तुम्हारे पवित्रस्थान की दीन दशा पर दया की याचना करूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: त्यागा
  rationale: लैटिन क्रिया का सीधा और प्रसंगानुकूल अर्थ; यह लोगों को छोड़ देने या बेसहारा कर देने की धारणा व्यक्त करती है।
- source_word: excessi a uobis
  choice: तुमसे दूर गया
  rationale: शाब्दिक अर्थ ‘तुमसे चला गया’ है; ‘दूर गया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए अलग हो जाने का भाव बनाए रखता है।
- source_word: deprecarer
  choice: विनती करूँ
  rationale: प्रार्थनापूर्वक अनुनय करने का भाव व्यक्त करता है और केवल सामान्य प्रार्थना की अपेक्षा मूल क्रिया के याचनात्मक स्वर के निकट है।
- source_word: desolatione Sion
  choice: सिय्योन की उजड़ी दशा
  rationale: desolatio के विनाश और उजाड़पन—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: humilitate
  choice: दीन दशा
  rationale: यहाँ शब्द पवित्रस्थान की गिराई गई, अपमानित या दुर्दशाग्रस्त अवस्था की ओर संकेत करता है; ‘दीन दशा’ इस अर्थ-व्याप्ति को बिना अनावश्यक व्याख्या के रखता है।
- source_word: sanctificationis uestrae
  choice: तुम्हारे पवित्रस्थान
  rationale: इस प्रसंग में अमूर्त ‘पवित्रीकरण’ की अपेक्षा उपासना के पवित्र स्थान का अर्थ अधिक स्वाभाविक है; लैटिन पद इसी प्रकार पवित्रस्थान के लिए प्रयुक्त हो सकता है।
theological_decisions:
- issue: sanctificationis को अमूर्त ‘पवित्रीकरण’ मानें या ठोस ‘पवित्रस्थान’
  choice: पवित्रस्थान
  alternative: पवित्रीकरण/पवित्र वस्तु
  rationale: सिय्योन की उजड़ी दशा और सामुदायिक विपत्ति का समानांतर संदर्भ किसी अपमानित पवित्रस्थान की ओर संकेत करता है। फिर भी अनुवाद में उसके अपमान का कारण या धार्मिक अर्थ निर्धारित नहीं किया गया है।
- issue: humilitas में ‘अपमान’ और ‘दुर्दशा’ के बीच चयन
  choice: दीन दशा
  alternative: अपमान
  rationale: मूल पद नीची की गई अवस्था, अपमान और विपन्नता के बीच अर्थगत तनाव रखता है। ‘दीन दशा’ परिणामगत अवस्था को सामने रखता है और किसी निश्चित कर्ता या जानबूझकर किए गए अपमान को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य शैली। ‘न तो…न ही’ से मूल के द्विगुण निषेध को रखा गया है, और दो प्रयोजनवाचक क्रियाओं से वाक्य की मूल समानांतर संरचना सुरक्षित है।
