lexical_decisions:
- source_word: gladius
  choice: तलवार
  rationale: लातीनी शब्द का सीधा और प्रसंगानुकूल अर्थ।
- source_word: comedet
  choice: निगल जाएगी
  rationale: मूल के शाब्दिक चित्र ‘खा जाना/निगल जाना’ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Vnius ... gladius
