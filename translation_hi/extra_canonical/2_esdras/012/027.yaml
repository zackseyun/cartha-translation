  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘निगल जाएगी’ मूल के सजीव रूपक को बनाए रखता है। पद के अंत का अल्पविराम स्रोत में वाक्य के आगे जारी रहने को दर्शाता है।
