- source_word: qui cum eo
  choice: उसके साथ वाले को
  rationale: अपूर्ण लातीनी वाक्यांश का स्वाभाविक अर्थ उस व्यक्ति से है जो पहले व्यक्ति के साथ है; हिन्दी में कर्म को स्पष्ट करने के लिए ‘को’ आवश्यक है।
theological_decisions:
- issue: दूसरे वाक्यांश में सर्वनाम का संदर्भ
  choice: ‘एक’ और ‘उसके साथ वाले’—दो व्यक्तियों के संबंध के रूप में अनुवाद
  alternative: ‘एक तलवार उसे निगल जाएगी जो उसके साथ है’
  rationale: eo का निकटतम अर्थ व्यक्ति की ओर संकेत करता है और Vnius संबंधकारक है; यह अनुवाद तलवार को सर्वनाम का संदर्भ मानने से बचता है, फिर भी मूल की संक्षिप्तता और तनाव बनाए रखता है।
