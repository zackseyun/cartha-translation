  yaml_path: translation/extra_canonical/2_esdras/012/011.yaml
  text: the fourth kingdom that was seen in a vision by Daniel your brother. But it was not interpreted to him as I now interpret it to you,
translation:
  language: hi
  text: वह चौथा राज्य है, जिसे तुम्हारे भाई दानियेल ने दर्शन में देखा था। परन्तु उसे इसका अर्थ उस प्रकार नहीं समझाया गया था, जिस प्रकार मैं अब तुम्हें समझा रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnum quartum
  choice: चौथा राज्य
  rationale: लातीनी पद का सीधा और स्वाभाविक हिन्दी रूप; दानियेल की राज्य-संबंधी दर्शन-परंपरा से संगत।
- source_word: uisum est in uisu
  choice: दर्शन में देखा था
  rationale: स्रोत में ‘देखा गया’ निष्क्रिय रूप है, पर दानियेल के साथ स्वाभाविक हिन्दी वाक्य-विन्यास के लिए सक्रिय रूप अपनाया गया; ‘दर्शन’ ने visio का धार्मिक-साहित्यिक अर्थ सुरक्षित रखा।
- source_word: fratri tuo
  choice: तुम्हारे भाई
  rationale: शाब्दिक संबंध को बनाए रखा गया; यहाँ ‘भाई’ को सहविश्वासी या मानव-सहचर जैसे किसी विशेष अर्थ में सीमित नहीं किया गया।
- source_word: interpretatum / interpretor
  choice: अर्थ ... समझाया गया / समझा रहा हूँ
  rationale: interpretari का आशय दर्शन का अर्थ खोलना है; ‘व्याख्या’ की अपेक्षा यह साधारण पाठक के लिए अधिक स्वाभाविक है और दोनों क्रियाओं का संबंध बनाए रखता है।
theological_decisions:
- issue: दानियेल को पहले मिले अर्थ-प्रकाशन की सीमा
  choice: उसे इसका अर्थ उस प्रकार नहीं समझाया गया था
  alternative: उसे इसका अर्थ बिल्कुल नहीं बताया गया था
  rationale: लातीनी quomodo ... nunc (‘जिस प्रकार ... अब’) तुलना के ढंग पर बल देता है। चुना हुआ रूप यह दावा नहीं करता कि दानियेल को कोई व्याख्या मिली ही नहीं थी, बल्कि वर्तमान व्याख्या की भिन्नता या विस्तार की गुंजाइश बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, dignified किन्तु सहज शैली। पद के अंत में अंग्रेज़ी परामर्श-पाठ का अल्पविराम स्वतंत्र हिन्दी पद के लिए पूर्णविराम में बदला गया है।
