source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui perficient nouissima eius. Et quoniam uidisti caput maius non apparescens, quoniam unus ex eis super lectum suum morietur, et tamen cum tormentis. Nam duo qui superauerunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/026.yaml
  text: and complete its final acts. And because you saw the larger head disappearing[a], it means that one of them will die on his bed, yet with torments. For the two who survived,
translation:
  language: hi
  text: और उसके अंतिम कार्यों[a] को पूरा करेंगे। और क्योंकि तुमने अन्य सिरों से बड़े सिर को गायब होते देखा[b], इसका अर्थ है कि उनमें से एक अपने बिस्तर पर मरेगा, फिर भी यातनाएँ सहते हुए। क्योंकि जो दो बच गए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी अंतिम घटनाओं’।
    reason: लैटिन nouissima का अर्थ ‘अंतिम कार्य,’ ‘अंतिम घटनाएँ,’ या ‘अंतिम बातें’ हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, ‘प्रकट न होता हुआ’ या ‘दिखाई न पड़ता हुआ’।
    reason: लैटिन non apparescens के अधिक शाब्दिक अर्थ को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: nouissima eius
  choice: उसके अंतिम कार्यों
  rationale: यह पदबंध उसके शासन या सत्ता के अंतिम कामों/घटनाओं की ओर संकेत करता है। ‘अंतिम कार्यों’ से प्रसंग का भाव बना रहता है और अनावश्यक व्याख्या नहीं जुड़ती।
- source_word: caput maius
  choice: बड़े सिर
  rationale: दर्शन में दिखाई गई आकृति के लिए लैटिन की तुलनात्मक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: non apparescens
  choice: गायब होते
  rationale: शाब्दिक अर्थ ‘दिखाई न देते’ है; दर्शन के वर्णन में ‘गायब होते’ अधिक स्वाभाविक हिन्दी है, जबकि पादटिप्पणी में शाब्दिक संभावना सुरक्षित रखी गई है।
- source_word: super lectum suum morietur
  choice: अपने बिस्तर पर मरेगा
  rationale: लैटिन संरचना का स्पष्ट और स्वाभाविक अनुवाद; यह सामान्यतः युद्ध के बाहर मृत्यु का संकेत देता है, पर पाठ से आगे बढ़कर उसकी व्याख्या नहीं की गई।
- source_word: cum tormentis
  choice: यातनाएँ सहते हुए
  rationale: ‘यातनाओं के साथ’ की अपेक्षा स्वाभाविक हिन्दी, और tormentis की पीड़ादायक तीव्रता को बनाए रखता है।
- source_word: qui superauerunt
  choice: जो दो बच गए
  rationale: इस प्रसंग में superare का अर्थ जीवित या शेष रह जाना है; वाक्य अगले पद में जारी रहता है।
theological_decisions:
- issue: बिस्तर पर मृत्यु और यातना का संबंध
  choice: अपने बिस्तर पर मरेगा, फिर भी यातनाएँ सहते हुए
  alternative: अपने बिस्तर पर यातनापूर्ण मृत्यु मरेगा
  rationale: 'मुख्य अनुवाद et tamen (‘फिर भी’) द्वारा व्यक्त तनाव को बनाए रखता है: बिस्तर पर मृत्यु होने पर भी वह यातनाओं से रहित नहीं होगी।'
- issue: दर्शन के बड़े सिर का गायब होना
  choice: बड़े सिर को गायब होते देखा
  alternative: बड़ा सिर दिखाई नहीं दिया
  rationale: दृष्टिगत लोप को व्यक्त किया गया है, पर इसे किसी विशिष्ट ऐतिहासिक व्यक्ति या घटना से जोड़कर व्याख्यायित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। आरम्भ और अन्त दोनों जगह वाक्यांश निकटवर्ती पदों से जुड़े हैं; इसलिए अन्त में अल्पविराम रखा गया है।
