  text: hic est unctus, quem reservavit Altissimus in finem ad eos et impietates ipsorum. arguet illos de iniustitiis ipsorum et infulciet coram ipsis spretiones eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/032.yaml
  text: This is the Anointed One[a], whom the Most High has reserved for the end against them and their impieties[b]. He will rebuke them for their injustices and will set their contempt before them.
translation:
  language: hi
  text: यह अभिषिक्त जन[a] है, जिसे परमप्रधान ने अंत समय के लिए उनके और उनके अधर्मों के विरुद्ध आरक्षित रखा है[b]। वह उनके अन्यायों के कारण उन्हें डाँटेगा और उनके तिरस्कारों को उनके सामने रख देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी unctus का शाब्दिक अर्थ ‘अभिषिक्त’ है। इस दर्शन में यह व्यक्ति अंत समय के उद्धारकर्ता की भूमिका निभाता है, जो उकाब के राज्य को डाँटता और बचे हुए लोगों को बचाता है। इसलिए मुख्य पाठ में शाब्दिक पदवी रखे जाने पर भी इसका मसीहाई आशय समझा जाना चाहिए।
    reason: messianic_passage
  - marker: b
    text: अथवा, “और जो सिंह तुमने वन से उठते, गरजते, उकाब से बातें करते और—जैसा तुमने सुना—उसके अन्यायों और उसकी सारी बातों के लिए उसे डाँटते देखा था—”
    reason: previous_rendering
lexical_decisions:
- source_word: unctus
  choice: अभिषिक्त जन
  rationale: लातीनी शब्द का मूल अर्थ ‘अभिषिक्त’ है। ‘जन’ जोड़ने से आधुनिक हिन्दी में पदवी स्वाभाविक और स्पष्ट रहती है, जबकि मसीहाई आशय को मुख्य पाठ में व्याख्यात्मक रूप से सीमित नहीं किया जाता।
- source_word: reservavit
  choice: सुरक्षित रखा है
  rationale: यह चयन किसी निश्चित भावी उद्देश्य के लिए बचाकर रखने या आरक्षित रखने का भाव व्यक्त करता है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का प्रतिष्ठित और अर्थ-सटीक हिन्दी रूप।
- source_word: impietates
  choice: दुष्टताओं
  rationale: यहाँ बहुवचन उन लोगों के अधार्मिक और दुष्ट आचरणों को सूचित करता है; ‘दुष्टताओं’ बहुवचन को बनाए रखता है।
- source_word: arguet
  choice: डाँटेगा
  rationale: संदर्भ में दोष सिद्ध करने, फटकारने और न्यायिक रूप से उलाहना देने का भाव है; ‘डाँटेगा’ सामान्य पाठक के लिए सीधा और स्वाभाविक है।
- source_word: iniustitiis
  choice: अन्यायों
  rationale: मूल के बहुवचन को रखते हुए अनेक अन्यायपूर्ण कामों का संकेत देता है।
- source_word: infulciet coram ipsis spretiones eorum
  choice: उनका तिरस्कार उन्हीं के सामने रख देगा
  rationale: मूल की असामान्य और कुछ हद तक कठिन अभिव्यक्ति को बिना अत्यधिक व्याख्या किए निकटता से सुरक्षित रखता है; ‘उन्हीं’ आमने-सामने सामना कराए जाने पर बल देता है।
theological_decisions:
- issue: अभिषिक्त जन की मसीहाई पहचान
  choice: मुख्य पाठ में शाब्दिक पदवी ‘अभिषिक्त जन’ रखी गई और उसके मसीहाई प्रभाव को पादटिप्पणी में स्पष्ट किया गया।
  alternative: मुख्य पाठ में सीधे ‘मसीहा’ लिखना।
  rationale: unctus का शाब्दिक अर्थ सुरक्षित रहता है और दर्शन में अंत-समय के उद्धारकर्ता की भूमिका भी पाठक से छिपती नहीं, पर मुख्य पाठ किसी एक व्याख्यात्मक पद से मूल को संकुचित नहीं करता।
- issue: ad eos et impietates ipsorum का संबंध
  choice: ‘उनके और उनकी दुष्टताओं के विरुद्ध’
  alternative: ‘उनके पास और उनकी दुष्टताओं के लिए’ अथवा वाक्य को पिछले पद से जोड़ना।
  rationale: लातीनी वाक्यांश कठिन है; संदर्भ और परामर्श-पाठ विरोधात्मक अर्थ का समर्थन करते हैं। फिर भी पाठ-संरेखण से जुड़ा पूर्व रूप पादटिप्पणी में संरक्षित है।
- issue: spretiones eorum का अर्थ
  choice: ‘उनका तिरस्कार’
  alternative: ‘उनके तिरस्कारपूर्ण काम’ या ‘जिन बातों को उन्होंने तुच्छ जाना’।
  rationale: अमूर्त बहुवचन अभिव्यक्ति की अस्पष्टता को व्याख्यात्मक विस्तार से हल नहीं किया गया; हिन्दी में सामूहिक अमूर्त संज्ञा स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘अभिषिक्त जन’, ‘परमप्रधान’ और ‘अंत समय’ बाइबलीय संदर्भ को बनाए रखते हैं। मूल की कठिन अंतिम अभिव्यक्ति को सहज बनाने के लिए सीमित वाक्य-विन्यास परिवर्तन किया गया है, पर उसकी अर्थगत अस्पष्टता को पूरी तरह समाप्त नहीं किया गया।
