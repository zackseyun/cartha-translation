lexical_decisions:
- source_word: arguerit
  choice: दोषी ठहरा चुका होगा
  rationale: लैटिन क्रिया का अर्थ दोष दिखाना, खंडन करना या अपराध सिद्ध करना हो सकता है। संदर्भ के बिना किसी विशिष्ट दंडात्मक अर्थ को जोड़ने के बजाय यह चुनाव उसके न्यायिक और ताड़नात्मक भाव को बनाए रखता है।
- source_word: corrumpet
  choice: नाश कर देगा
  rationale: यहाँ corrumpere का भाव बिगाड़ने मात्र से अधिक, विनाश करने का है; व्यक्तियों के संदर्भ में स्वाभाविक हिन्दी के लिए ‘नाश कर देगा’ चुना गया।
- source_word: residuum
  choice: शेष भाग
  rationale: पद उपलब्ध लैटिन में अधूरे वाक्य ‘Nam residuum’ पर समाप्त होता है। ‘शेष भाग’ व्याकरणिक अस्पष्टता को बनाए रखता है और अगले पद का आशय पहले से नहीं जोड़ता।
theological_decisions:
- issue: दोष सिद्ध करने और विनाश के बीच संबंध
  choice: दो क्रमिक कार्यों के रूप में अनुवाद
  alternative: ‘जब वह उन्हें डाँटेगा, तभी उन्हें भ्रष्ट कर देगा’
  rationale: cum...tunc की कालगत संरचना को स्पष्ट रखा गया है, पर विनाश का कोई अतिरिक्त धर्मवैज्ञानिक कारण नहीं जोड़ा गया।
- issue: ‘वह’ की पहचान
  choice: सर्वनाम को अनिर्दिष्ट रखा
  alternative: ‘अभिषिक्त जन’ या ‘मसीह’ को स्पष्ट रूप से दोहराना
  rationale: इस पद के उपलब्ध लैटिन अंश में केवल सर्वनाम-सूचित कर्ता है; पहचान पिछले संदर्भ से आती है, इसलिए उसे इस पद में जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। उपलब्ध लैटिन पाठ पद के अंत में अधूरा है, इसलिए हिन्दी भी जानबूझकर ‘क्योंकि शेष भाग’ पर खुली छोड़ी गई है। अंग्रेज़ी परामर्श-पाठ की फुटनोट [a] वर्तमान लैटिन से मेल नहीं खाती और पूर्व पद के पाठ-मिलान की समस्या से उत्पन्न प्रतीत होती है; अतः उसे मुख्य पाठ में नहीं लाया गया।
