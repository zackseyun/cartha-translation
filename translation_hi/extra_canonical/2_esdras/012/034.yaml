  text: he will deliver my people with mercy[a], those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning. This is the dream,
translation:
  language: hi
  text: 'वह दया करके मेरी प्रजा को छुड़ाएगा[a]—उन्हें, जो मेरी सीमाओं के भीतर सुरक्षित रखे गए हैं—और वह उन्हें आनन्दित करेगा, जब तक कि अन्त, अर्थात न्याय का वह दिन, न आ जाए, जिसके विषय में मैंने आरम्भ से ही तुमसे कहा था। यह स्वप्न है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पूर्ववर्ती पाठ-विन्यासों में यहाँ पिछले पद के ये शब्द भी जोड़े गए हैं: “और जब वह उन्हें दोषी ठहरा चुका होगा, तब वह उनका नाश करेगा। परन्तु वह मेरी प्रजा के बचे हुए लोगों को दया करके छुड़ाएगा।” दिए गए लैटिन पाठ में ये शब्द 12:34 का भाग नहीं हैं।'
    reason: previous_rendering
lexical_decisions:
- source_word: liberabit
  choice: छुड़ाएगा
  rationale: भविष्यकालीन उद्धार या मुक्ति के भाव को साधारण, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: cum misericordia
  choice: दया करके
  rationale: लैटिन में रीति अथवा साथ का भाव है; हिन्दी में यह क्रिया के दयापूर्ण ढंग को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: saluati sunt
  choice: सुरक्षित रखे गए हैं
  rationale: परिपूर्ण कर्मवाच्य रूप को बनाए रखता है और इस प्रसंग में पहले से बचाकर रखे जाने का भाव देता है।
- source_word: super fines meos
  choice: मेरी सीमाओं के भीतर
  rationale: यहाँ super fines का आशय अधिकार-क्षेत्र या सीमाओं के भीतर होने से है; शाब्दिक 'सीमाओं के ऊपर' हिन्दी में भ्रामक होगा।
- source_word: iocundabit
  choice: आनन्दित करेगा
  rationale: कारक क्रिया के रूप में दूसरों को प्रसन्न या आनन्दित करने का भाव सुरक्षित रहता है।
- source_word: finis, dies iudicii
  choice: अन्त, अर्थात न्याय का वह दिन
  rationale: समस्थानिक व्याख्या को बनाए रखते हुए स्पष्ट करता है कि 'न्याय का दिन' ही उल्लिखित अन्त है।
- source_word: Hoc est somnium
  choice: स्वप्न का अर्थ यह है
  rationale: अगले पद में आने वाली व्याख्या की ओर स्वाभाविक संक्रमण देता है; लैटिन वाक्य का व्याख्यात्मक प्रसंग सुरक्षित रहता है।
theological_decisions:
- issue: किन लोगों को छुड़ाया जाएगा
  choice: मेरी प्रजा—उन्हें, जो मेरी सीमाओं के भीतर सुरक्षित रखे गए हैं
  alternative: मेरी प्रजा के बचे हुए लोगों को
  rationale: दिए गए 12:34 के लैटिन पाठ में residuum नहीं है; इसलिए इस पद में 'बचे हुए' जोड़ना पिछले पद की सामग्री आयात करना होगा।
- issue: Hoc est somnium का अर्थ
  choice: स्वप्न का अर्थ यह है
  alternative: यह स्वप्न है
  rationale: दोनों संभव हैं, पर प्रसंग में यह वाक्य आगे की व्याख्या आरम्भ करता है; चुना हुआ रूप हिन्दी में उसी कार्य को अधिक स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। भविष्यवाणी की औपचारिकता बनाए रखने के लिए ‘न्याय का दिन’ और ‘आरम्भ से ही’ जैसे रूप चुने गए हैं।
