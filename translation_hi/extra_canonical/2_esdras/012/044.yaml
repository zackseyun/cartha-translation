id: 2ES.12.44
reference: 2 Esdras 12:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nobis mala quae contigerunt? Si ergo tu nos dereliqueris, quanto erat nobis melius, si essemus succensi et nos in incendio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/044.yaml
  text: Or are not the evils that have happened to us enough? If then you forsake us[a], how much better it would have been for us if we too had been burned in the fire
translation:
  language: hi
  text: क्या हम पर आई विपत्तियाँ पर्याप्त नहीं हैं? यदि तू हमें त्याग दे, तो हमारे लिए कितना अच्छा होता कि हम भी आग में जला दिए गए होते![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस अग्नि में जला दिए गए होते।”
    reason: लैटिन incendium का अर्थ ‘आग’ या ‘अग्नि/दावानल’ हो सकता है; यह विकल्प बिना अतिरिक्त विनाशकारी अर्थ जोड़े उस अधिक औपचारिक शब्दावली को दर्शाता है।
lexical_decisions:
- source_word: mala quae contigerunt nobis
  choice: हम पर आई विपत्तियाँ
  rationale: ‘mala’ यहाँ व्यक्तिगत बुरे कर्मों के बजाय समुदाय पर आई आपदाओं या विपत्तियों को दर्शाता है; यह अभिव्यक्ति स्वाभाविक हिन्दी में उसी अर्थ को रखती है।
- source_word: dereliqueris
  choice: त्याग देगा
  rationale: यह भविष्य-पूर्ण/संभाव्य प्रसंग में संबोधित व्यक्ति द्वारा समुदाय को छोड़ देने का अर्थ देता है; ‘त्याग देगा’ वाक्य के भाव और गंभीरता को स्पष्ट रखता है।
- source_word: succensi ... in incendio
  choice: उस आग में जला दिए गए होते
  rationale: ‘succensi’ निष्क्रिय रूप है और ‘incendio’ आग अथवा अग्निकांड को दर्शाता है। यह अनुवाद लैटिन की संरचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वर के लिए एकवचन द्वितीय पुरुष संबोधन
  choice: तू
  alternative: आप
  rationale: लैटिन ‘tu’ एकवचन और प्रत्यक्ष संबोधन है। ‘तू’ हिन्दी की बाइबिलीय प्रार्थना-परंपरा में निकटता और गंभीरता दोनों रखता है तथा बहुवचन या औपचारिकता का अतिरिक्त अर्थ नहीं जोड़ता।
- issue: वक्ता की निराशा की तीव्रता
  choice: ‘कितना अच्छा होता’ के प्रत्यक्ष विलाप को बनाए रखा
  alternative: ‘हमारा मर जाना बेहतर होता’
  rationale: स्रोत आग में जलाए जाने की विशिष्ट तुलना करता है; सामान्यीकृत विकल्प उस कठोर चित्र और धर्मवैचारिक तनाव को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामुदायिक विलाप के अनुरूप रखी गई है। स्रोत-अंश की आरंभिक प्रश्नात्मकता को अंग्रेज़ी परामर्श-पाठ के सहारे स्वाभाविक हिन्दी में पूर्ण किया गया है। विस्मयादिबोधक चिह्न विलाप की तीव्रता दिखाता है, बिना कथन का अर्थ बदलने के।
