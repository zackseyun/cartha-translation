  source_fidelity: The draft accurately preserves the vision, the eagle, its ascent from the sea, and the deliberately unfinished identification signaled by Latin hoc est. However, “वह यह है” is not an idiomatic or faithful Hindi rendering of hoc est in this syntactically continuing clause.
  naturalness: Modern Hindi is otherwise clear and suitably formal. Replacing “वह यह है” with “वह है—” preserves the source's suspension while making the Hindi natural. “ऊपर उठते हुए” more smoothly expresses the participial ascendentem.
