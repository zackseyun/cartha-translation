    issue: “वह यह है” is unnatural and redundant Hindi.
    rationale: Latin hoc est means “this is/is,” introducing the identification that continues in the next verse. In Hindi, “वह है—” naturally retains that incomplete continuation; “वह यह है” is awkward.
