base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/010.yaml
  text: 'And he said to me, “This is the interpretation of the vision that you saw: the eagle that you saw coming up from the sea—this is'
translation:
  language: hi
  text: 'और उसने मुझसे कहा, “तुमने जो दर्शन देखा था, उसकी व्याख्या यह है: जिस उकाब को तुमने समुद्र में से ऊपर उठते हुए देखा था—वह है—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aquilam
  choice: उकाब
  rationale: लैटिन शब्द एक बड़े शिकारी पक्षी, ‘eagle’, को दर्शाता है; ‘उकाब’ आधुनिक हिन्दी में इसका स्पष्ट और प्रचलित साहित्यिक पर्याय है।
- source_word: ascendentem de mari
  choice: समुद्र में से ऊपर उठते
  rationale: यह वाक्यांश समुद्र के भीतर से ऊपर आने की गति को व्यक्त करता है और लैटिन के स्थान तथा दिशा—दोनों को सुरक्षित रखता है।
- source_word: hoc est
  choice: वह यह है
  rationale: यह अगले पद में जारी रहने वाली व्याख्या का अधूरा आरंभ है; अनुवाद भी उसी निरंतरता को बनाए रखता है।
theological_decisions:
- issue: उकाब की पहचान
  choice: पाठ में केवल व्याख्या का आरंभ रखा गया है; उकाब की पहचान इस पद में निर्धारित नहीं की गई।
  alternative: अगले प्रसंग के आधार पर इसी पद में उकाब की पहचान स्पष्ट कर देना।
  rationale: स्रोत का ‘hoc est’ वाक्य को अगले पद के लिए खुला छोड़ता है; पहले से पहचान जोड़ना पाठ की प्रतीकात्मक और व्याख्यात्मक प्रगति को बदल देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दर्शन’ तथा ‘व्याख्या’ सामान्य बाइबलीय हिन्दी में समझने योग्य हैं। पद के अंत का अधूरापन जानबूझकर सुरक्षित रखा गया है, क्योंकि वाक्य अगले पद में पूरा होता है।
