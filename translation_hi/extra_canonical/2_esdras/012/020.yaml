translation:
  language: hi
  text: '“तुमने उसके पंखों से जुड़े हुए आठ छोटे पंख देखे। इसका अर्थ यह है: उसमें आठ राजा उठेंगे, जिनके समय…[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
