    reason: पद के अंत में मूल स्रोत का वाक्यांश अपूर्ण है; दीर्घविराम और टिप्पणी पाठ-साक्ष्य की स्थिति स्पष्ट करते हैं।
lexical_decisions:
- source_word: subalares octo
  choice: आठ छोटे पंख
  rationale: लातीनी शब्द यहाँ बड़े पंखों से जुड़े छोटे या सहायक पंखों को दर्शाता है; सरल और स्वाभाविक हिन्दी में ‘छोटे पंख’ उपयुक्त है।
- source_word: coherentes alis eius
  choice: उसके पंखों से लगे हुए
  rationale: coherentes का जुड़ाव या चिपके रहने का भाव सुरक्षित रहता है, बिना संबंध को आवश्यकता से अधिक विशिष्ट बनाए।
- source_word: exsurgent enim in ipso octo reges
  choice: उसमें आठ राजा उठ खड़े होंगे
  rationale: ipso का संकेत उसी दर्शनगत प्राणी या राज्य की ओर है; ‘उसमें’ मूल की अस्पष्टता बनाए रखता है और exsurgent का उदयभाव व्यक्त करता है।
- source_word: quorum erunt tempora
  choice: जिनके समय…
  rationale: प्राप्त लातीनी अंश इसी अधूरे वाक्यांश पर समाप्त होता है; अनुवाद उसे अगले पद से अनुमान लगाकर पूरा नहीं करता।
theological_decisions:
- issue: ‘उसमें’ का संदर्भ
  choice: सर्वनामात्मक अस्पष्टता बनाए रखी गई
  alternative: ‘उस राज्य में’ या ‘उस उकाब में’
  rationale: लातीनी ipso स्पष्ट संज्ञा नहीं दोहराता; किसी एक व्याख्यात्मक संदर्भ को पाठ में थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। दर्शन की प्रतीकात्मक भाषा और मूल पाठ की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
