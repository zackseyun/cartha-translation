  text: Therefore I will pray to the Most High, that he may strengthen me to the end.”
translation:
  language: hi
  text: इसलिए मैं परमप्रधान से प्रार्थना करूँगा कि वह अंत तक मुझे सामर्थ्य दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimum
  choice: परमप्रधान
  rationale: लातीनी विशेषण का संज्ञा के रूप में प्रयोग परमेश्वर के लिए हुआ है; ‘परमप्रधान’ इसका प्रतिष्ठित, स्वाभाविक और अर्थ-सटीक हिन्दी रूप है।
- source_word: confortet
  choice: सामर्थ्य देता रहे
  rationale: यहाँ क्रिया का अर्थ वक्ता को दृढ़ अथवा समर्थ करना है। ‘सामर्थ्य देता रहे’ उद्देश्यवाचक भाव के साथ अन्त तक जारी रहने वाली सहायता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: usque in finem
  choice: अन्त तक
  rationale: स्रोत की समय-सीमा को बिना यह तय किए सुरक्षित रखता है कि ‘अन्त’ से जीवन का अन्त, परीक्षा का अन्त, या कोई अन्य चरम बिन्दु अभिप्रेत है।
theological_decisions:
- issue: ‘अन्त’ का आशय
  choice: अन्त तक
  alternative: मेरे जीवन के अन्त तक
  rationale: लातीनी पाठ केवल ‘usque in finem’ कहता है; अधिक विशिष्ट अर्थ जोड़ने से स्रोत की वास्तविक अस्पष्टता समाप्त हो जाती।
- issue: प्रार्थना और परमप्रधान की सामर्थ्य देने वाली भूमिका
  choice: मैं परमप्रधान से प्रार्थना करूँगा कि वह…मुझे सामर्थ्य देता रहे
  alternative: मैं परमप्रधान से प्रार्थना करूँगा, ताकि मैं अन्त तक दृढ़ रहूँ
  rationale: स्रोत में सामर्थ्य देने का कर्ता परमप्रधान है; अनुवाद इस कर्तृत्व को स्पष्ट रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य-पाठक-सुलभ रूप। आरम्भिक ‘इसलिए’ पूर्ववर्ती तर्क से निष्कर्ष का सम्बन्ध दिखाता है। स्रोत अंश पद के बाद अगले वाक्य के आरम्भ (‘Et dixi’) तक जाता है, पर प्रस्तुत पाठ में केवल 12:6 से सम्बद्ध वाक्य रखा गया है।
