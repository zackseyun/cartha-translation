revisions:
- from: जिनके समय थोड़े[a] और वर्ष तेजी से बीतनेवाले होंगे। उनमें से दो मध्य समय के निकट आने पर नष्ट हो जाएँगे, पर चार उस समय के लिए बचाकर रखे जाएँगे, जब उसका अंत निकट आने लगेगा।
  to: जिनके समय अल्पकालिक[a] और वर्ष शीघ्र बीतनेवाले होंगे। उनमें से दो नष्ट हो जाएँगे जब मध्य समय निकट आएगा, पर चार उस समय के लिए सुरक्षित रखे जाएँगे, जब उसका अंत निकट आने लगेगा।
