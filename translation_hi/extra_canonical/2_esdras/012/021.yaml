  text: leuia et anni citati, et duo quidem ex ipsis perient Adpropinquante tempore medio, quattuor autem seruabuntur in tempore cum incipiet adpropinquare tempus eius ut finiatur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/021.yaml
  text: whose times will be brief and whose years swift. Two of them will perish when the middle time draws near[a], but four will be preserved for the time when its end begins to draw near,
translation:
  language: hi
  text: जिनके समय अल्पकालिक[a] और वर्ष शीघ्र बीतनेवाले होंगे। उनमें से दो नष्ट हो जाएँगे जब मध्य समय निकट आएगा, पर चार उस समय के लिए सुरक्षित रखे जाएँगे, जब उसका अंत निकट आने लगेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हल्के।”
    reason: Latin leuia का शाब्दिक अर्थ ‘हल्के’ भी हो सकता है, यद्यपि समय के साथ यहाँ ‘अल्पकालिक’ या ‘थोड़े’ अर्थ अधिक स्वाभाविक है।
lexical_decisions:
- source_word: leuia
  choice: थोड़े
  rationale: समय के संदर्भ में Latin leuis का आशय ‘अल्पकालिक/थोड़ा’ है; यह इन शासनों की छोटी अवधि व्यक्त करता है।
- source_word: anni citati
  choice: वर्ष तेजी से बीतनेवाले
  rationale: citati में तीव्र गति या शीघ्रता का भाव है; हिंदी में यह पद वर्षों के जल्दी बीतने का स्वाभाविक अर्थ देता है।
- source_word: perient
  choice: नष्ट हो जाएँगे
  rationale: यह perire के भविष्यकाल का सीधा और संदर्भानुकूल अनुवाद है।
- source_word: seruabuntur
  choice: बचाकर रखे जाएँगे
  rationale: निष्क्रिय भविष्यकाल को बनाए रखते हुए यह संरक्षण और किसी आगामी समय के लिए सुरक्षित रखे जाने—दोनों भाव व्यक्त करता है।
theological_decisions:
- issue: tempore medio का अर्थ
  choice: मध्य समय
  alternative: आधे समय का बिंदु
  rationale: Latin पद स्वयं संक्षिप्त है; ‘मध्य समय’ उसकी काल-संबंधी अस्पष्टता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: tempus eius में eius का संदर्भ
  choice: जब उसका अंत निकट आने लगेगा
  alternative: जब उस समय का अंत निकट आने लगेगा
  rationale: सर्वनाम को स्पष्ट संज्ञा से बदलकर संभावित संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया; मूल की सर्वनामगत अस्पष्टता सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। ‘बचाकर रखे जाएँगे’ निष्क्रिय वाच्य तथा भावी संरक्षण को स्पष्ट करता है; काल-संबंधी वाक्यांशों की मूल अस्पष्टता नहीं सुलझाई गई।
