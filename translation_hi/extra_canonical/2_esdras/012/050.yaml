  text: And the people departed into the city, as I told him.
translation:
  language: hi
  text: और जैसा मैंने उससे कहा था, वैसे ही लोग नगर को चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus est
  choice: चले गए
  rationale: लैटिन पद प्रस्थान या चले जाने को व्यक्त करता है; सामूहिक संज्ञा ‘लोग’ के साथ आधुनिक हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: populus
  choice: लोग
  rationale: यहाँ समुदाय के लिए सहज और व्यापक आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: in ciuitatem
  choice: नगर को
  rationale: गति की दिशा और गंतव्य को व्यक्त करता है; ‘नगर को चले गए’ गरिमापूर्ण और स्वाभाविक है।
- source_word: sicut dixi ei
  choice: जैसा मैंने उससे कहा था
  rationale: ei के एकवचन दत्तिव को ‘उससे’ द्वारा सुरक्षित रखा गया है और लैटिन के पूर्वकथन का संबंध स्पष्ट किया गया है।
theological_decisions:
- issue: ei का वचन और संदर्भ
  choice: उससे
  alternative: उनसे
  rationale: मूल लैटिन ei व्याकरणतः एकवचन है; इसलिए संदर्भ को बहुवचन बनाकर स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। ‘लोग’ के साथ अर्थानुसार बहुवचन क्रिया का प्रयोग किया गया है।
