  text: as you saw. And the lion that you saw rousing itself from the forest[a], roaring and speaking to the eagle and reproving it for its injustices and all its words, as you heard—
translation:
  language: hi
  text: जैसा तुमने देखा था। और जिस सिंह को तुमने जंगल से जाग उठते, गरजते[a], उकाब से बोलते हुए, और उसके अन्यायों तथा उसकी सारी बातों के लिए उसे फटकारते देखा था—ठीक जैसा तुमने सुना था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द का शाब्दिक अर्थ ‘रँभाते’ या ‘बाँग देते’ भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: de silua euigilantem
  choice: जंगल से जाग उठते
  rationale: यह वाक्यांश सिंह के जंगल में से जागकर सक्रिय होने का चित्र प्रस्तुत करता है; हिन्दी में क्रिया-संबंध स्पष्ट रखते हुए मूल क्रम के निकट रखा गया है।
- source_word: mugientem
  choice: गरजते
  rationale: लैटिन शब्द का शाब्दिक अर्थ ‘डकारना/रँभाना’ हो सकता है, पर सिंह के संदर्भ में स्वाभाविक हिन्दी ‘गरजना’ है; शाब्दिक रंग पादटिप्पणी में सुरक्षित है।
- source_word: aquilam
  choice: उकाब
  rationale: दर्शन के बड़े शिकारी पक्षी और पारंपरिक बाइबिलीय प्रतीक के लिए ‘उकाब’ सटीक और प्रचलित है।
- source_word: arguentem eam iniustitias ipsius et omnes sermones eius
  choice: उसके अन्यायों तथा उसकी सारी बातों के लिए उसे फटकारते
  rationale: arguere को न्यायिक दोषारोपण तक सीमित किए बिना ‘फटकारना’ रखा गया है; बहुवचन iniustitias और omnes sermones दोनों स्पष्ट रूप से सुरक्षित हैं।
theological_decisions:
- issue: सिंह की पहचान
  choice: इस पद में केवल दर्शन का वर्णन रखा गया है
  alternative: अगले वाक्य ‘यह अभिषिक्त जन है...’ को इसी पद में जोड़ना
  rationale: प्रदत्त पद-विभाजन और नवीनतम स्रोत-समीक्षा के अनुसार 12:31 sicut audisti पर समाप्त होता है; Hic est unctus, quem अगले पद की व्याख्या आरम्भ करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथन रखा गया है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में दीर्घ विराम-चिह्न लगाया गया है; स्रोत की पुनरुक्ति ‘देखा था… जैसा तुमने सुना था’ भी बनाए रखी गई है।
