translation:
  language: hi
  text: परन्तु दो अन्त तक सुरक्षित रखे जाएँगे। और क्योंकि तुमने तीन सिर देखे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: duo uero
  choice: परन्तु दो
  rationale: uero यहाँ पिछले कथन से विरोध या भेद दिखाता है; ‘परन्तु’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: in finem
  choice: अन्त तक
  rationale: लातीनी पद का सीधा कालगत अर्थ सुरक्षित रखा गया है।
- source_word: seruabuntur
  choice: सुरक्षित रखे जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखते हुए संरक्षण का अर्थ व्यक्त करता है; कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- source_word: Et quoniam
  choice: और क्योंकि
  rationale: मूल के संयोजक और कारणसूचक संबंध दोनों सुरक्षित हैं; वाक्य अगले पद में पूरा होता है।
- source_word: uidisti tria capita
  choice: तुमने तीन सिर देखे
  rationale: द्वितीय पुरुष एकवचन और ‘तीन सिर’ की प्रतीकात्मक छवि का सीधा रूप रखा गया है।
theological_decisions:
- issue: दो को अन्त तक सुरक्षित रखने वाला कर्ता
  choice: 'कर्मवाच्य रखा गया: ‘सुरक्षित रखे जाएँगे’'
  alternative: ‘परमेश्वर दो को अन्त तक सुरक्षित रखेगा’
  rationale: मूल पाठ कर्ता का नाम नहीं बताता; परमेश्वर को स्पष्ट कर्ता बनाना व्याख्यात्मक जोड़ होता।
- issue: अधूरे कारणवाचक उपवाक्य का संरक्षण
  choice: ‘और क्योंकि तुमने तीन सिर देखे,’
  alternative: अगले पद की व्याख्या जोड़कर वाक्य पूरा करना
  rationale: स्रोत अंश इसी उपवाक्य पर समाप्त होता है; अल्पविराम पाठ के अगले पद में जारी रहने का संकेत देता है और कोई अनुपस्थित सामग्री नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली। ‘सिर’ सामान्य पाठक के लिए ‘मस्तक’ से अधिक सहज है। मूल के भविष्यकालीन कर्मवाच्य, विरोधसूचक संयोजक और अगले पद में जारी रहने वाली वाक्यरचना को सुरक्षित रखा गया है।
