lexical_decisions:
- source_word: scrutas
  choice: थाह लेते हो
  rationale: लातीनी क्रिया में ध्यानपूर्वक खोजने और गहराई से जाँचने का भाव है; ‘थाह लेना’ आधुनिक हिन्दी में इसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: uias altissimi
  choice: परमप्रधान के मार्गों
  rationale: ‘मार्ग’ यहाँ परमप्रधान के काम करने के तरीकों या उद्देश्यों के लिए प्रयुक्त रूपक को बनाए रखता है; ‘परमप्रधान’ altissimi का प्रतिष्ठित और स्पष्ट धार्मिक समतुल्य है।
- source_word: Ecce
  choice: देखो
  rationale: वक्ता के कथन पर ध्यान खींचने वाला प्रत्यक्ष उद्गार सुरक्षित रखा गया है।
- source_word: adhuc
  choice: अब भी
  rationale: थकान के लगातार बने रहने का कालगत भाव व्यक्त करता है।
- source_word: fatigatus sum animo
  choice: मैं अब भी मन में थका हुआ हूँ
  rationale: animus यहाँ व्यक्ति के भीतरी मन/चित्त का संकेत देता है। ‘मन में’ अर्थ को संप्रदायगत मानव-विज्ञान से बाँधे बिना स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: animo का मानव-विज्ञान संबंधी अर्थ
  choice: मन में
  alternative: आत्मा में
  rationale: लातीनी animus मन, चित्त, साहस या आंतरिक दशा का बोध करा सकता है। प्रसंग में मानसिक-आंतरिक थकान प्रमुख है; ‘मन में’ इस अस्पष्टता को अनावश्यक रूप से किसी विशिष्ट देह-आत्मा सिद्धांत में नहीं बदलता।
