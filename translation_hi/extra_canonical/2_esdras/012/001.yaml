translation:
  language: hi
  text: और ऐसा हुआ कि जब सिंह उकाब[a] से ये बातें कह रहा था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराए गए लैटिन अंश का अंत ad (‘की ओर/से’) पर होता है; संबोधित पात्र ‘उकाब’ अंग्रेज़ी परामर्श-पाठ और प्रसंग के अनुसार दिया गया है।
    reason: दिए गए मूल-पाठ के अधूरे अंत को पारदर्शी रखना और पूर्ति को बिना सूचना के मूल का हिस्सा न बनाना।
lexical_decisions:
- source_word: Et factum est
  choice: और ऐसा हुआ कि
  rationale: यह सूत्रात्मक कथन लैटिन की कथात्मक गति और घटना के घटित होने का भाव बनाए रखता है।
- source_word: dum loqueretur
  choice: जब … कह रहा था
  rationale: dum के साथ अपूर्णकालीन क्रिया समकालीन, जारी क्रिया व्यक्त करती है; हिन्दी का प्रगतिशील रूप इसे स्वाभाविक ढंग से दिखाता है।
- source_word: leo
  choice: सिंह
  rationale: मूल संज्ञा का सीधा और वर्तमान मानक हिन्दी रूप।
- source_word: uerba haec
  choice: ये बातें
  rationale: शाब्दिक ‘ये शब्द’ की अपेक्षा संवाद के संदर्भ में ‘ये बातें’ अधिक स्वाभाविक है और आशय को सुरक्षित रखता है।
- source_word: ad
  choice: उकाब से
  rationale: बोलने की क्रिया के साथ लैटिन ad संबोधित पात्र की ओर संकेत करता है; हिन्दी में ‘से’ स्वाभाविक है। ‘उकाब’ अंग्रेज़ी परामर्श-पाठ में सुरक्षित अगले आशय के अनुसार रखा गया है, क्योंकि उपलब्ध लैटिन अंश ad पर कटता है।
