lexical_decisions:
- source_word: factum est cum
  choice: तब ऐसा हुआ कि जब
  rationale: लातीनी कथात्मक सूत्र और उसके कालगत संबंध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: omnis populus
  choice: सब लोगों
  rationale: समूचे जनसमुदाय का सामान्य और सहज हिन्दी रूप।
- source_word: pertransierunt septem dies
  choice: सात दिन बीत चुके थे
  rationale: पूर्वघटित पूर्णता को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: a minimo usque ad maximum
  choice: छोटे से लेकर बड़े तक
  rationale: सामाजिक या आयु-संबंधी अर्थ को अनावश्यक रूप से निश्चित किए बिना मूल मुहावरे की व्यापकता सुरक्षित रखता है।
- source_word: uenit ad
  choice: मेरे पास आए—
  rationale: खंडित लातीनी पाठ में अगले पद की ओर बढ़ते अधूरे वाक्य को डैश से दर्शाता है; निहित प्रथम-पुरुष लक्ष्य को अंग्रेज़ी परामर्श-पाठ और प्रसंग के अनुसार स्पष्ट करता है।
