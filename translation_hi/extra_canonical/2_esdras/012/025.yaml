  text: of the eagle. For these are the ones who will bring its impieties to a head[a], and
translation:
  language: hi
  text: उकाब के। क्योंकि यही वे हैं जो उसके अधर्मों को चरम पर पहुँचा देंगे[a], और
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके अधर्मों को समेट देंगे।”
    reason: लैटिन recapitulabunt में ‘एक शीर्ष के अंतर्गत समेटने’ और ‘चरम तक पहुँचाने’—दोनों अर्थ-संकेत संभव हैं।
lexical_decisions:
- source_word: aquilae
  choice: उकाब के
  rationale: यह संबंधकारक रूप पिछले वाक्य से जुड़ता है; खंडित पद-संरचना को स्रोत के अनुसार बनाए रखा गया है।
- source_word: recapitulabunt
  choice: चरम पर पहुँचा देंगे
  rationale: संदर्भ में क्रिया अधर्मों को उनकी पूर्णता या पराकाष्ठा तक पहुँचाने का भाव देती है। यह आधुनिक अर्थ में केवल मौखिक ‘सारांश’ बनाने से अधिक उपयुक्त है, यद्यपि मूल में ‘सिर/शीर्ष’ से जुड़ी शब्द-क्रीड़ा हिंदी में पूरी तरह सुरक्षित नहीं रहती।
- source_word: impietates
  choice: अधर्मों
  rationale: बहुवचन को बनाए रखते हुए धार्मिक तथा नैतिक दुष्टता का व्यापक भाव व्यक्त करता है।
theological_decisions:
- issue: recapitulabunt में अधर्म के संकलन और पराकाष्ठा का तनाव
  choice: अधर्मों को चरम पर पहुँचा देंगे
  alternative: अधर्मों को समेट देंगे
  rationale: मुख्य पाठ में अंतिम परिपूर्णता/पराकाष्ठा का प्रलय-संबंधी भाव रखा गया है; वैकल्पिक ‘समेटना’ क्रिया के संकलनात्मक अर्थ को दर्शाता है, पर आधुनिक हिंदी में केवल सार प्रस्तुत करने जैसा समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभ और अंत की अपूर्ण वाक्य-संरचना स्रोत-पद के पिछले और अगले पद से जुड़े होने के कारण जानबूझकर सुरक्षित रखी गई है।
