lexical_decisions:
- source_word: Quid peccauimus tibi
  choice: हमने तुम्हारे विरुद्ध कौन-सा पाप किया है
  rationale: लातीनी मुहावरे का शाब्दिक रूप हिन्दी में अस्वाभाविक होता; यह चयन प्रश्न के अर्थ और आरोप की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: quid iniuste egimus in te
  choice: तुम्हारे साथ क्या अन्याय किया है
  rationale: iniuste egimus का आशय अन्यायपूर्ण व्यवहार करना है; यह अभिव्यक्ति सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: derelinquens dereliquisti nos
  choice: तुम हमें पूरी तरह छोड़कर चले गए
  rationale: एक ही धातु की पुनरुक्ति त्याग की पूर्णता पर बल देती है; हिन्दी में ‘पूरी तरह’ उस बल को स्वाभाविक ढंग से व्यक्त करता है।
