  yaml_path: translation/extra_canonical/2_esdras/012/008.yaml
  text: the interpretation and the distinction of this dreadful vision[a], so that you may fully comfort my soul. For you have counted me worthy
translation:
  language: hi
  text: इस भयानक दर्शन की व्याख्या और विवेचन, ताकि तू मेरी आत्मा को पूरी तरह सांत्वना दे। क्योंकि तूने मुझे योग्य समझा है
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretationem
  choice: व्याख्या
  rationale: यह दर्शन के अर्थ को खोलकर बताने के भाव को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: distinctionem
  choice: भेद
  rationale: यह दूसरे संज्ञापद को अलग रखते हुए दर्शन की विशिष्टताओं अथवा उसके विस्तृत आशय का भाव बनाए रखता है; इसे केवल ‘व्याख्या’ में मिला देने से मूल की द्विपदी अभिव्यक्ति खो जाती।
- source_word: uisus horribilis huius
  choice: इस भयानक दर्शन
  rationale: uisus का प्रसंगानुकूल अर्थ ‘दर्शन’ है और horribilis उस दर्शन से उत्पन्न भय को व्यक्त करता है।
- source_word: plenissime consoles animam meam
  choice: मेरी आत्मा को पूरी तरह सांत्वना दे
  rationale: plenissime की पूर्णता और consoles के सांत्वना देने वाले भाव, दोनों को सीधे सुरक्षित रखा गया है।
- source_word: Dignum enim me habuisti
  choice: क्योंकि तूने मुझे योग्य समझा है
  rationale: यह habuisti की ‘मानना/ठहराना’ अर्थछाया को व्यक्त करता है और अगले अंश से जुड़ने वाली मूल की अपूर्ण संरचना को बनाए रखता है।
theological_decisions:
- issue: पद का पिछले और अगले वाक्य से व्याकरणिक जुड़ाव
  choice: आरम्भ में कोई नया कर्ता या क्रिया नहीं जोड़ी गई और अन्त को भी आगे जारी रहने योग्य रखा गया।
  alternative: ‘अपने दास को दिखा’ जोड़ना अथवा अन्त में योग्य होने का विषय पूरा कर देना।
  rationale: लैटिन पाठ सीधे कर्मकारक संज्ञाओं से आरम्भ होता है और ‘तूने मुझे योग्य समझा है’ पर अधूरा रहता है; अतिरिक्त शब्द जोड़ना पड़ोसी पदों की सामग्री को दोहराता या मूल तनाव को मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली रखी गई है। ईश्वर को संबोधन के लिए प्रसंगानुकूल ‘तू’ प्रयुक्त है। पाठ जानबूझकर वाक्यांश रूप में आरम्भ और समाप्त होता है, क्योंकि मूल लैटिन भी आसपास के पदों से जुड़ा हुआ है।
