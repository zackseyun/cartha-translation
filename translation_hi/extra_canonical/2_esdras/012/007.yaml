id: 2ES.12.7
reference: 2 Esdras 12:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nator domine, si inueni gratiam ante oculos tuos, et si iustificatus sum apud te prae multis, et si certum ascendit deprecatio mea ante faciem tuam, Conforta me et ostende seruo tuo mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/007.yaml
  text: And I said[a], “O Sovereign Lord, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has surely gone up before your face, strengthen me and show yourself to me, your servant.”
translation:
  language: hi
  text: और मैंने कहा, “हे सर्वाधिपति प्रभु, यदि मैंने आपकी दृष्टि में कृपा पाई है, यदि मैं बहुतों की अपेक्षा आपके सामने धर्मी ठहराया गया हूँ, और यदि मेरी विनती निश्चय ही आपके सम्मुख ऊपर चढ़ी है, तो मुझे सामर्थ्य दीजिए और मुझे, अपने दास को, अपना दर्शन दीजिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: हे प्रभु परमेश्वर
  rationale: यह संयुक्त संबोधन सार्वभौम अधिकार और ईश्वरीय प्रभुता व्यक्त करता है; आधुनिक हिन्दी में ‘हे प्रभु परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: inueni gratiam ante oculos tuos
  choice: मुझ पर आपकी कृपादृष्टि हुई है
  rationale: लैटिन मुहावरे ‘आपकी आँखों के सामने अनुग्रह पाया’ का स्वाभाविक हिन्दी समतुल्य, जिसमें कृपा पाने का भाव सुरक्षित है।
- source_word: iustificatus sum apud te prae multis
  choice: मैं बहुतों से बढ़कर आपके सामने धर्मी ठहराया गया हूँ
  rationale: निष्क्रिय क्रिया और तुलनात्मक prae multis दोनों को बनाए रखता है, बिना इसके धर्मवैज्ञानिक अर्थ को केवल नैतिकता या निर्दोषता तक सीमित किए।
- source_word: certum ascendit deprecatio mea ante faciem tuam
  choice: मेरी विनती निश्चय ही आपके सम्मुख पहुँची है
  rationale: ascendit की ऊपर जाने वाली छवि को शब्दशः रखने के बजाय प्रार्थना के परमेश्वर तक पहुँचने का आशय स्वाभाविक हिन्दी में देता है; certum को ‘निश्चय ही’ से व्यक्त किया गया है।
- source_word: Conforta me
  choice: मुझे सामर्थ्य दीजिए
  rationale: आज्ञार्थक क्रिया का आदरपूर्ण और स्पष्ट हिन्दी रूप।
- source_word: ostende seruo tuo mihi
  choice: मुझ अपने दास को दर्शन दीजिए
  rationale: दूषित अथवा असहज लैटिन शब्दक्रम के सम्भावित आशय ‘अपने दास मुझ पर अपने को प्रकट कीजिए’ को संक्षिप्त, धार्मिक हिन्दी में व्यक्त करता है; servo का दासत्व-संबंध भी सुरक्षित है।
theological_decisions:
- issue: iustificatus का अर्थ
  choice: धर्मी ठहराया गया हूँ
  alternative: निर्दोष माना गया हूँ / न्यायसंगत ठहरा हूँ
  rationale: ‘धर्मी ठहराना’ न्यायिक-धार्मिक तनाव को बनाए रखता है और किसी विशिष्ट सम्प्रदायगत सिद्धान्त का अतिरिक्त विवरण नहीं जोड़ता।
- issue: ostende का निहित कर्म
  choice: दर्शन दीजिए
  alternative: मुझे दिखाइए / अपने को मुझ पर प्रकट कीजिए
  rationale: लैटिन पंक्ति में प्रत्यक्ष कर्म स्पष्ट नहीं है; सन्दर्भानुकूल हिन्दी ‘दर्शन दीजिए’ आत्म-प्रकाशन का अर्थ देता है, पर किसी विशेष दर्शन-रूप को निर्धारित नहीं करता।
- issue: servo की सामाजिक तीव्रता
  choice: दास
  alternative: सेवक
  rationale: दास मूल शब्द के अधीनता और स्वामित्व-संबंध को ‘सेवक’ से अधिक निकटता से सुरक्षित रखता है, जबकि बाइबिलीय हिन्दी में समझने योग्य है।
translation_notes:
  register: आदरार्थक क्रियाओं और ‘आप’ का प्रयोग करते हुए आधुनिक, गरिमापूर्ण प्रार्थना-शैली रखी गई है। स्रोत-पाठ का आरम्भ सम्भवतः पिछले पद से विभाजित संयुक्त संबोधन का अंश है; उपलब्ध पद-पाठ के अनुसार इसे पूर्ण और स्वाभाविक हिन्दी संबोधन बनाया गया है।
