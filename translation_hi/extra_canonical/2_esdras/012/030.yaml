base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/030.yaml
  text: '“And because you saw two little wings passing over to the head on the right side, this is the interpretation: these are the ones whom the Most High has preserved for its end. This was a brief kingdom and full of turmoil,”'
translation:
  language: hi
  text: '“और तुमने जो दो छोटे पंखों को दाहिनी ओर के सिर के ऊपर से जाते देखा, उसका अर्थ यह है: ये वे हैं जिन्हें परमप्रधान ने अंत के लिए सुरक्षित रखा है। यह एक अल्पकालिक राज्य था और उथल-पुथल से भरा हुआ था,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: duas pinnulas
  choice: दो छोटे पंखों
  rationale: लघु रूप pinnulas को स्वाभाविक हिन्दी में ‘छोटे पंख’ कहा गया है।
- source_word: servavit
  choice: सुरक्षित रखा है
  rationale: क्रिया में बचाकर रखने या सुरक्षित रखने का भाव है; प्रसंग में ‘सुरक्षित रखा’ सहज और स्पष्ट है।
- source_word: in finem suum
  choice: अंत के समय के लिए
  rationale: लैटिन पदबंध में अंत के संबंध का संकेत है, पर उसका सटीक संदर्भ अस्पष्ट है। यह रूप किसी अस्पष्ट सर्वनाम को जोड़ने के बजाय उस अस्पष्टता को बनाए रखता है।
- source_word: regnum exile
  choice: यह राज्य थोड़े समय तक रहा
  rationale: exile का मूल भाव छोटा, सीमित या नगण्य हो सकता है; परामर्श-पाठ और इस राजकीय क्रम के संदर्भ में अवधि की संक्षिप्तता को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: turbationis plenum
  choice: उथल-पुथल से भरा था
  rationale: turbatio के अव्यवस्था, अशांति और हलचल के संयुक्त भाव को ‘उथल-पुथल’ अच्छी तरह व्यक्त करता है।
theological_decisions:
- issue: ‘अंत’ किसका है
  choice: अंत के समय के लिए
  alternative: उसके अंत के लिए
  rationale: स्रोत-पाठ का सर्वनाम-संबंध निश्चित नहीं है। चुना गया रूप परमप्रधान के अंत जैसी भ्रामक धारणा से बचता है और राज्य के अंत या अंतिम समय—दोनों संभावनाओं को अनावश्यक रूप से बंद नहीं करता।
- issue: परमप्रधान द्वारा व्यक्तियों को सुरक्षित रखना
  choice: जिन्हें परमप्रधान ने… सुरक्षित रखा है
  alternative: जिन्हें परमप्रधान ने… बचा रखा है
  rationale: ‘सुरक्षित रखा’ चयन और संरक्षण का भाव रखता है, पर इसमें किसी विशिष्ट मतगत पूर्वधारणा को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य को प्रत्यक्ष व्याख्या के रूप में रखा गया है और पद के अंत का अल्पविराम अगले पद से इसके जुड़ाव को दर्शाता है।
