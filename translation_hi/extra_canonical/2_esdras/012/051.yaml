  text: Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/051.yaml
  text: But I sat in the field seven days[a], as he commanded me, and I ate only the flowers of the field; in those days my food was made from herbs.
translation:
  language: hi
  text: पर मैं सात दिन तक मैदान में बैठा रहा, जैसा उसने मुझे आज्ञा दी थी, और केवल मैदान के फूल खाता रहा; उन दिनों मेरा भोजन जड़ी-बूटियों से बनता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उन दिनों जड़ी-बूटियों से मेरे लिए भोजन बनाया गया था।”'
    reason: लैटिन की निष्क्रिय रचना ‘de herbis facta est mihi esca’ को स्पष्ट करता है; मुख्य पाठ में उसका स्वाभाविक हिन्दी रूप दिया गया है।
lexical_decisions:
- source_word: campo
  choice: मैदान
  rationale: लैटिन शब्द खुले खेत या मैदान को दर्शाता है; प्रसंग में सहज और व्यापक हिन्दी शब्द।
- source_word: floribus solummodo agri
  choice: केवल मैदान के फूल
  rationale: ‘solummodo’ की विशिष्टता और ‘agri’ के संबंध को सीधे सुरक्षित रखा गया है।
- source_word: herbis
  choice: जड़ी-बूटियाँ
  rationale: यहाँ खाद्य वनस्पतियों के अर्थ में प्रयुक्त लैटिन ‘herbae’ के लिए सामान्य, समझने योग्य हिन्दी रूप।
- source_word: esca
  choice: भोजन
  rationale: ‘खाद्य/आहार’ की अपेक्षा साधारण पाठकों के लिए अधिक स्वाभाविक, फिर भी अर्थनिष्ठ।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी। ‘बैठा रहा’ और ‘खाता रहा’ सात दिनों तक जारी अवस्था को स्वाभाविक रूप से व्यक्त करते हैं। अंतिम उपवाक्य में लैटिन की निष्क्रिय रचना का आशय रखा गया है, जबकि उसका अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
