source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'capitibus eius exientem sed de medio corpore eius, Haec est interpretatio: quoniam post tempus regni illius nascentur contentiones non modicae, et periclitabitur ut cadat, et non cadet'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/018.yaml
  text: 'This is the interpretation: after the time of that kingdom[a], no small contentions will arise, and it will be in danger of falling; but it will not fall.'
translation:
  language: hi
  text: 'इसका अर्थ यह है: उस राज्य के कुछ समय बाद[a] गंभीर संघर्ष उठ खड़े होंगे, और वह गिरने के संकट में पड़ेगा; फिर भी वह गिरेगा नहीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उस राज्य के समय के बाद।”'
    reason: लातीनी पदबंध post tempus regni illius का शब्दगत रूप यह विकल्प भी संभव करता है, यद्यपि तत्काल प्रसंग राज्य के चलते रहने के दौरान कुछ समय बीतने के अर्थ का समर्थन करता है।
lexical_decisions:
- source_word: post tempus regni illius
  choice: उस राज्य के कुछ समय बीतने के बाद
  rationale: यह पदबंध राज्य के समाप्त हो जाने के बाद का समय अनिवार्य रूप से नहीं बताता; प्रसंग में राज्य के चलते रहने के दौरान कुछ समय बीतने के बाद संघर्ष उठते हैं।
- source_word: contentiones non modicae
  choice: बड़े-बड़े संघर्ष
  rationale: लातीनी अल्पोक्ति का स्वाभाविक हिन्दी रूप, जो विवादों या टकरावों की गंभीरता व्यक्त करता है।
- source_word: periclitabitur ut cadat
  choice: वह गिरने के संकट में पड़ेगा
  rationale: राज्य के पतन का वास्तविक खतरा व्यक्त करता है, बिना यह कहे कि उसका गिरना निश्चित है।
- source_word: et non cadet
  choice: फिर भी वह गिरेगा नहीं
  rationale: पूर्ववर्ती संकट के साथ स्पष्ट विरोध बनाए रखता है।
theological_decisions:
- issue: क्या संघर्ष राज्य का समय समाप्त होने के बाद उठते हैं या उसके शासनकाल में कुछ समय बीतने के बाद?
  choice: राज्य के कुछ समय बीतने के बाद
  alternative: उस राज्य का समय बीत जाने के बाद
  rationale: तत्काल प्रसंग में राज्य संकट में पड़ता है, पर गिरता नहीं; इसलिए राज्य के समाप्त हो जाने का अर्थ देना संदर्भ से तनाव पैदा करता है। फिर भी शब्दगत सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘बड़े-बड़े संघर्ष’ लातीनी अल्पोक्ति को स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी मूल की कालगत अस्पष्टता सुरक्षित रखती है।
