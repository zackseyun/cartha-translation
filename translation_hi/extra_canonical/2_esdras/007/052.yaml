  text: 'But hear this about the multiplication of the ungodly: if you have very few choice stones,[a]'
translation:
  language: hi
  text: 'पर दुष्टों की बढ़ती संख्या के विषय में यह सुनो: यदि तुम्हारे पास बहुत ही थोड़े चुने हुए पत्थर हों,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impios
  choice: दुष्टों
  rationale: Latin accusative plural refers to ungodly or wicked people; ‘दुष्टों’ is natural, dignified Hindi and retains the moral sense.
- source_word: multiplicari
  choice: बढ़ती संख्या
  rationale: The passive infinitive means ‘to be multiplied/increase’; in this construction, ‘दुष्टों की बढ़ती संख्या’ naturally expresses their multiplication without adding an explicit agent.
- source_word: audi haec
  choice: यह सुनो
  rationale: A direct imperative rendering that preserves the discourse transition.
- source_word: Lapides electos
  choice: चुने हुए पत्थर
  rationale: Formally preserves ‘stones selected/chosen’ rather than specifying ‘precious,’ which is possible contextually but not explicit in this Latin segment.
- source_word: paucos ualde
  choice: बहुत ही थोड़े
  rationale: Preserves the emphatic force of ‘very few.’
theological_decisions:
- issue: Description of the impious increasing
  choice: दुष्टों की बढ़ती संख्या
  alternative: दुष्टों के बहुतायत से बढ़ने
  rationale: The chosen wording remains neutral about agency and preserves the source’s tension concerning why the ungodly are numerous.
- issue: Meaning of electos for stones
  choice: चुने हुए
  alternative: बहुमूल्य
  rationale: ‘चुने हुए’ follows the extant Latin directly and avoids importing the interpretive sense ‘precious,’ though that sense may be suggested by the wider analogy.
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को स्रोत की तरह अगले पद में जारी रहने वाला अपूर्ण शर्त-वाक्य रखा गया है। भाषा सहज किंतु गरिमापूर्ण है।
