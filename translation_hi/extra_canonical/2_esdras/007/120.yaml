  text: And if everlasting hope has been foretold to us[a], but we have become utterly vain?
translation:
  language: hi
  text: और यदि हमें अनन्त आशा पहले ही बताई गई है, तो हम इतने व्यर्थ हो गए हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: जब ... तब भी
  rationale: यहाँ वाक्य शिकायत भरे प्रश्न के रूप में आशा की घोषणा और मनुष्यों की वर्तमान दशा के बीच विरोध रखता है। लैटिन quoniam सामान्यतः ‘क्योंकि/चूँकि’ है; स्वाभाविक हिन्दी में इस संबंध को ‘जब ... तब भी’ से स्पष्ट किया गया है, बिना इसे काल्पनिक ‘यदि’ बनाने के।
- source_word: praedicta est nobis
  choice: हमें ... पहले ही बता दिया गया है
  rationale: निष्क्रिय पूर्ण रूप उस घोषणा को व्यक्त करता है जो पहले की जा चुकी है और अब भी प्रासंगिक है।
- source_word: perennis spes
  choice: अनन्त आशा
  rationale: perennis का अर्थ चिरस्थायी या कभी न समाप्त होने वाला है; धार्मिक-साहित्यिक प्रसंग में ‘अनन्त आशा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: pessime vani facti sumus
  choice: हम पूरी तरह निष्फल हो गए हैं
  rationale: vani यहाँ आधुनिक अर्थ में ‘घमंडी’ नहीं, बल्कि खाली, व्यर्थ या निष्फल होने का भाव देता है। pessime उसकी तीव्रता बढ़ाता है; ‘पूरी तरह निष्फल’ इस भाव को सहज हिन्दी में रखता है।
theological_decisions:
- issue: घोषित अनन्त आशा और मनुष्य की निष्फल दशा के बीच तनाव
  choice: विरोध को प्रश्न के रूप में यथावत रखा गया है
  alternative: वाक्य को निश्चित निष्कर्ष या निराशा की घोषणा के रूप में प्रस्तुत करना
  rationale: स्रोत का प्रश्नवाचक रूप आशा और मानवीय दशा के बीच वास्तविक तनाव व्यक्त करता है; अनुवाद उसे किसी सिद्धान्तगत समाधान में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठकों के लिए स्पष्ट, पर प्रश्न की गंभीर और विलापपूर्ण गरिमा बनाए रखी गई है।
