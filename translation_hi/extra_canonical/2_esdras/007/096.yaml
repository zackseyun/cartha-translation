id: 2ES.7.96
reference: 2 Esdras 7:96
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quomodo corruptibile effugerint nunc, et futurum quomodo hereditatem possidebuut, adhuc autem uidentes angustum et [labore] plenum, quoniam liberati sunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/096.yaml
  text: 'The fifth order: they rejoice that they have now escaped what is corruptible[a], and how they will inherit what is to come, while still seeing the narrow and toil-filled way, because they have been delivered.'
translation:
  language: hi
  text: 'पाँचवाँ क्रम यह है: वे आनन्दित होते हैं कि अब वे नाशवान वस्तु से बच निकले हैं और जो आनेवाला है, उसे वे किस प्रकार विरासत में पाएँगे। साथ ही वे उस सँकरे और परिश्रम से भरे मार्ग[a] को अब भी देखते हैं, क्योंकि वे छुड़ा लिए गए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में यहाँ ‘मार्ग’ शब्द व्यक्त नहीं है; अर्थ स्पष्ट करने के लिए इसे जोड़ा गया है। ‘परिश्रम’ के लिए प्रयुक्त लैटिन शब्द भी संपादित पाठ में कोष्ठकों में दिया गया है।
    reason: मूल पाठ में संज्ञा का लोप और संपादकीय रूप से पूरित शब्द labore पाठक को बताना।
lexical_decisions:
- source_word: corruptibile
  choice: नाशवान वस्तु
  rationale: लैटिन का नपुंसकलिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; यह किसी एक निश्चित वस्तु की अपेक्षा नाश के अधीन वर्तमान अवस्था या जगत की ओर संकेत कर सकता है।
- source_word: futurum
  choice: जो आनेवाला है
  rationale: नपुंसकलिंग संज्ञीकृत रूप को स्वाभाविक हिन्दी में रखा गया है, बिना इसे केवल ‘भविष्य’ या किसी खास युग तक सीमित किए।
- source_word: hereditatem possidebunt
  choice: विरासत में पाएँगे
  rationale: ‘विरासत पर अधिकार रखेंगे’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है और उत्तराधिकार का भाव बनाए रखता है।
- source_word: angustum et labore plenum
  choice: सँकरा और परिश्रम से भरा मार्ग
  rationale: लैटिन में वर्णित वस्तु व्यक्त नहीं है; प्रसंग और विशेषणों के आधार पर ‘मार्ग’ स्पष्टता के लिए जोड़ा गया है।
- source_word: liberati sunt
  choice: छुड़ा लिए गए हैं
  rationale: कर्मवाच्य पूर्ण क्रिया को बनाए रखता है और यह अनिर्धारित छोड़ता है कि किसने या किससे उन्हें छुड़ाया।
theological_decisions:
- issue: दो बार आए quomodo का संबंध
  choice: पहले खंड में पूर्ण हुई मुक्ति का तथ्य और दूसरे में विरासत पाने का ढंग व्यक्त किया गया
  alternative: दोनों को ‘कि’ मानकर समानांतर परोक्ष कथन बनाया जा सकता है
  rationale: शास्त्रीय अर्थ ‘किस प्रकार’ है, पर उत्तरकालीन लैटिन में यह ‘कि’ भी हो सकता है। हिन्दी वाक्य में पहले खंड का ‘कि’ आनन्द का विषय खोलता है, जबकि दूसरे quomodo को ‘किस प्रकार’ रखकर स्रोत की वास्तविक अस्पष्टता पूरी तरह मिटाई नहीं गई।
- issue: quoniam की कारणसूचक असहजता
  choice: ‘क्योंकि वे छुड़ा लिए गए हैं’
  alternative: ‘जिससे वे छुड़ाए गए हैं’ कहकर मार्ग को मुक्ति का स्रोत बनाया जा सकता है
  rationale: उपलब्ध लैटिन में quoniam स्पष्टतः कारणसूचक है; अर्थगत तनाव के बावजूद उसे संबंधवाचक अर्थ में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘नाशवान वस्तु’ और ‘जो आनेवाला है’ स्रोत के संज्ञीकृत नपुंसकलिंग रूपों की व्यापकता बनाए रखते हैं; कारणसूचक अंतिम उपवाक्य को उसकी कठिनता सहित सुरक्षित रखा गया है।
