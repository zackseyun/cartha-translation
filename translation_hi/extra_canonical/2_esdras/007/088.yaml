lexical_decisions:
- source_word: quem
  choice: जिसका
  rationale: लैटिन सम्बन्धवाचक सर्वनाम का पूर्ववर्ती अंश उपलब्ध उद्धरण से बाहर है; ‘जिसका’ इस वाक्यगत निर्भरता को बनाए रखता है।
- source_word: iudicari
  choice: न्याय करना
  rationale: न्यायिक अर्थ को सीधे व्यक्त किया गया है; कर्ता ‘वे’ और कर्म सम्बन्धवाचक रूप में रखा गया है।
- source_word: in nouissimis temporibus
  choice: अन्तिम समयों में
  rationale: बहुवचन temporibus को बनाए रखते हुए युगान्त-संबंधी पर अस्पष्ट कालगत अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: uias seruaue-
  choice: मार्गों को मानते हुए—
  rationale: seruare का आशय मार्गों का पालन/मानना है; स्रोत शब्द बीच में टूटा है, इसलिए डैश से पांडुलिपीय अपूर्णता दर्शाई गई है।
theological_decisions:
- issue: न्याय करने वालों और जिसका न्याय होगा उनकी पहचान
  choice: सर्वनामों को अनिर्दिष्ट रखा गया
  alternative: संदर्भ के आधार पर परमेश्वर, धर्मी या दुष्ट जैसे स्पष्ट पद जोड़ना
  rationale: दिए गए लैटिन अंश में पहचान स्पष्ट नहीं है; किसी धार्मिक व्याख्या को पाठ में आरोपित नहीं किया गया।
- issue: अपूर्ण अगले उपवाक्य का अर्थ
  choice: अपूर्णता को डैश द्वारा बनाए रखा
  alternative: किसी अन्य पाठ-रूप से वाक्य पूरा करना
  rationale: Bensly के दिए हुए पाठ का अन्त seruaue- पर टूटता है; अनुपलब्ध सामग्री जोड़ना स्रोत-साक्ष्य से आगे जाना होता।
