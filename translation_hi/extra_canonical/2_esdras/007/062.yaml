id: 2ES.7.62
reference: 2 Esdras 7:62
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'feruerunt et extincti sunt. Et respondit et dixi: O tu terra, quid peperisti, si sensus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/062.yaml
  text: And I answered and said, “O earth, what have you brought forth, if understanding has been made from dust, like the rest of creation?
translation:
  language: hi
  text: और मैंने उत्तर देकर कहा, “हे पृथ्वी, तूने क्या जन्म दिया है, यदि समझ भी बाकी सृष्टि की तरह धूल से बनाई गई है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra
  choice: पृथ्वी
  rationale: यह पृथ्वी को सीधे संबोधित करने वाला शब्द है; ‘हे पृथ्वी’ मूल के आलंकारिक संबोधन को बनाए रखता है।
- source_word: peperisti
  choice: तूने क्या जन्म दिया है
  rationale: क्रिया का मूल अर्थ ‘जन्म देना/उत्पन्न करना’ है और पृथ्वी को जननी के रूप में संबोधित करने वाली छवि को सुरक्षित रखता है।
- source_word: sensus
  choice: समझ
  rationale: यहाँ शब्द मनुष्य की समझ-बूझ या बोध-क्षमता को सूचित करता है; ‘समझ’ आधुनिक पाठक के लिए स्वाभाविक है और अर्थ को अनावश्यक रूप से ‘बुद्धि’ या ‘चेतना’ तक सीमित नहीं करता।
- source_word: pulvere
  choice: धूल से
  rationale: मनुष्य की मिट्टी/धूल से रचना की पारंपरिक छवि को सीधे व्यक्त करता है।
- source_word: alia creatura
  choice: बाकी सृष्टि
  rationale: अर्थ है सृष्टि की अन्य रची हुई वस्तुएँ या प्राणी; ‘बाकी सृष्टि’ सहज हिन्दी में सामूहिक तुलना को व्यक्त करता है।
theological_decisions:
- issue: ‘समझ’ के धूल से बनाए जाने का आशय
  choice: प्रश्नात्मक और तनावपूर्ण कथन को ज्यों का त्यों रखा गया है
  alternative: इसे मनुष्य की आत्मा की नश्वरता या अमरता के बारे में स्पष्ट सिद्धान्त के रूप में प्रस्तुत करना
  rationale: मूल वाक्य विलापपूर्ण प्रश्न उठाता है, पर यहाँ उसका सिद्धान्तगत समाधान नहीं देता; इसलिए अस्पष्टता और धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘हे पृथ्वी’ में मूल का प्रत्यक्ष संबोधन तथा ‘तू’ में उसका एकवचन रूप रखा गया है। उपलब्ध उद्धृत लैटिन पाठ ‘si sensus’ पर कटता है; वाक्य की शेष संरचना परामर्श-पाठ और ज्ञात पाठ-संदर्भ के अनुसार प्रस्तुत की गई है। आरंभ का ‘feruerunt et extincti sunt’ पिछले वाक्य/पद का अंत प्रतीत होता है, इसलिए इसे इस पद के मुख्य पाठ में शामिल नहीं किया गया।
