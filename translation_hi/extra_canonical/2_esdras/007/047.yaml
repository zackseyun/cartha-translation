  text: And now I see that the age to come will bring joy to few[a], but torments to many.
translation:
  language: hi
  text: और अब मैं देखता हूँ कि आनेवाले युग का आनंद थोड़े ही लोगों को मिलेगा[a], पर बहुतों को यातनाएँ मिलेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अब मैं देखता हूँ कि आनेवाला युग थोड़े ही लोगों के लिए आनंद, पर बहुतों के लिए यातनाएँ लाएगा।”
    reason: लातीनी वाक्यरचना को इस अर्थ में भी स्वाभाविक रूप से व्यक्त किया जा सकता है कि आनेवाला युग स्वयं इन विपरीत परिणामों को लाएगा; मुख्य पाठ आनंद और यातनाओं के क्रमशः थोड़े और बहुत लोगों के हिस्से आने पर बल देता है।
lexical_decisions:
- source_word: futurum saeculum
  choice: आनेवाला युग
  rationale: यह भावी युग के लिए स्वाभाविक और प्रचलित हिन्दी अभिव्यक्ति है; इसे केवल ‘भविष्य’ या ‘परलोक’ कहने से मूल की युग-संबंधी धारणा संकुचित हो जाती।
- source_word: iocunditatem
  choice: आनंद
  rationale: यहाँ संज्ञा के रूप में सुख, हर्ष या आनंद का अर्थ है; ‘आनंद’ यातनाओं के साथ मूल विरोध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ad paucos pertinebit
  choice: थोड़े ही लोगों को मिलेगा
  rationale: लातीनी अभिव्यक्ति का आशय है कि यह आनंद थोड़े लोगों के हिस्से आएगा या उन्हीं से संबंधित होगा। ‘मिलेगा’ सहज हिन्दी में उस आशय को रखता है और आनंद को यातना देने वाला कर्ता बनने से रोकता है।
- source_word: multis autem tormenta
  choice: पर बहुतों को यातनाएँ मिलेंगी
  rationale: मूल में क्रिया लुप्त है और पहले खंड से समझी जाती है। हिन्दी में क्रिया दोहराने से स्पष्ट होता है कि बहुतों के हिस्से यातनाएँ आएँगी। बहुवचन ‘यातनाएँ’ Latin tormenta के अनुरूप है।
theological_decisions:
- issue: भावी युग, आनंद और यातनाओं के बीच वाक्यगत संबंध
  choice: आनेवाले युग का आनंद थोड़े लोगों को मिलेगा, जबकि बहुतों को यातनाएँ मिलेंगी
  alternative: आनेवाला युग थोड़े लोगों के लिए आनंद, पर बहुतों के लिए यातनाएँ लाएगा
  rationale: उपलब्ध लातीनी साक्ष्य में iocunditatem और tormenta परस्पर विरोधी संज्ञाएँ हैं, और ad paucos तथा multis उनके प्राप्तकर्ताओं को दर्शाते हैं। मुख्य पाठ निकटतर संरचना रखता है; पादटिप्पणी संभावित अधिक गतिशील समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘थोड़े ही लोगों’ से paucos का सीमित दायरा उभरता है, और ‘पर बहुतों’ मूल के तीखे विरोध को बनाए रखता है।
