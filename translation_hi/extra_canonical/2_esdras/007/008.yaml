source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: semita autem est una sola inter eos posita, hoc est ignis et aqua, ut non capiat semita nisi solummodo vestigium hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/008.yaml
  text: But there is only one path laid between them[a], that is, between the fire and the water, so that the path can hold only a man's footprint.
translation:
  language: hi
  text: परन्तु उनके बीच केवल एक ही पगडंडी रखी गई है—अर्थात् आग और पानी के बीच—ताकि उस पगडंडी में केवल मनुष्य के पाँव के निशान भर के लिए ही जगह हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: semita
  choice: पगडंडी
  rationale: यह संकरे मार्ग को व्यक्त करता है और आगे केवल एक पाँव समाने की बात से स्वाभाविक रूप से जुड़ता है।
- source_word: una sola
  choice: केवल एक ही
  rationale: लैटिन में एकत्व पर दिए गए दोहरे बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: inter eos posita
  choice: उनके बीच ... रखी गई है
  rationale: मूल के कर्मवाच्य और पूर्वसंदर्भित दो वस्तुओं को बनाए रखता है।
- source_word: hoc est ignis et aqua
  choice: अर्थात् आग और पानी के बीच
  rationale: hoc est की व्याख्यात्मक भूमिका स्पष्ट रखते हुए हिन्दी में संबंध को स्वाभाविक बनाता है; ignis et aqua ही eos का स्पष्टीकरण हैं।
- source_word: ut non capiat semita nisi solummodo vestigium hominis
  choice: और वह इतनी सँकरी है कि उस पर केवल एक मनुष्य का पाँव ही समा सकता है
  rationale: मूल के परिणाम और अत्यधिक सँकरेपन को सहज हिन्दी में व्यक्त करता है। vestigium यहाँ मार्ग पर उपलब्ध पाँव-भर चौड़ाई का बोध देता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पगडंडी’ संकरे semita के लिए ‘मार्ग’ से अधिक चित्रात्मक है। मूल के व्याख्यात्मक ‘अर्थात्’ को सुरक्षित रखा गया है; स्पष्टता के लिए ‘के बीच’ दोहराया गया है।
