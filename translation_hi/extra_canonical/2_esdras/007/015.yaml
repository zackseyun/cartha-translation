  text: So now why are you disturbed[a], seeing that you are corruptible? And why are you shaken, seeing that you are mortal?
translation:
  language: hi
  text: तो अब तू क्यों व्याकुल है, जबकि तू नाशवान है? और तू क्यों विचलित है, जबकि तू मरणशील है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris
  choice: व्याकुल होता है
  rationale: यह वर्तमान मानसिक अशांति और घबराहट का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: corruptibilis
  choice: नाशवान
  rationale: यहाँ शब्द मनुष्य की क्षय और विनाश के अधीन अवस्था बताता है; ‘नाशवान’ इसे संक्षिप्त और सुबोध ढंग से व्यक्त करता है।
- source_word: moveris
  choice: विचलित होता है
  rationale: संदर्भ में इसका अर्थ शारीरिक गति नहीं, बल्कि भीतर से हिलना या अस्थिर होना है; ‘विचलित’ पहले प्रश्न के समानांतर रहते हुए भेद भी बनाए रखता है।
- source_word: mortalis
  choice: मरणशील
  rationale: यह मृत्यु के अधीन मानवीय दशा का सटीक और प्रचलित हिन्दी प्रतिरूप है।
