  text: तू उनकी संख्या के अनुसार उन्हें अपने लिए छाँटेगा, पर सीसा और मिट्टी की वस्तुएँ बहुतायत में हैं। और
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad numerum eorum
  choice: उनकी संख्या के अनुसार
  rationale: यह पदबंध वस्तुओं या लोगों को उनकी संख्या के अनुरूप गिनने अथवा क्रम में रखने का भाव देता है; अनावश्यक विशिष्टता जोड़े बिना मूल संरचना को बनाए रखता है।
- source_word: compones eos tibi
  choice: तू ... उन्हें अपने लिए छाँटेगा
  rationale: compones भविष्यकाल, द्वितीय पुरुष एकवचन है और यहाँ वस्तुओं को अलग करके व्यवस्थित करने का भाव देता है। ‘अपने लिए’ tibi को स्पष्ट रूप से व्यक्त करता है।
- source_word: plumbum
  choice: सीसा
  rationale: यह Latin संज्ञा धातु lead का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: fictile
  choice: मिट्टी
  rationale: fictile यहाँ मिट्टी से बनी साधारण सामग्री अथवा मृत्तिका के लिए संज्ञा रूप में प्रयुक्त है; प्रसंग में ‘सीसा’ के साथ बहुल साधारण पदार्थों का विरोध उभरता है।
- source_word: abundat
  choice: बहुतायत में हैं
  rationale: Latin में क्रिया एकवचन है, पर संयुक्त पदार्थों को हिन्दी में स्वाभाविक रूप से बहुवचन क्रिया के साथ व्यक्त किया गया है।
- source_word: Et
  choice: और
  rationale: पद के अंत में उपस्थित संयोजक अगले वाक्य से इसकी निरंतरता दिखाता है; खंडित वाक्य-सीमा को मूल के अनुसार सुरक्षित रखा गया है।
theological_decisions:
- issue: सम्बोधन में द्वितीय पुरुष एकवचन
  choice: तू
  alternative: आप
  rationale: Latin compones और tibi स्पष्टतः द्वितीय पुरुष एकवचन हैं। ‘तू’ उस व्याकरणिक निकटता को रखता है और परमेश्वर के लिए पारंपरिक हिन्दी बाइबिलीय सम्बोधन से मेल खाता है; इससे कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा गया।
- issue: पुराने पाठ ‘और मैंने कहा, “प्रभु, यह कैसे हो सकता है?”’ का स्थान
  choice: इसे इस पद में शामिल नहीं किया गया
  alternative: इसे पाठ या पादटिप्पणी में रखना
  rationale: 'वह वाक्य अगले Latin खंड Et dixi: domine, quomodo poterit? से संबंधित है, वर्तमान स्रोत-पाठ से नहीं। उसे यहाँ रखना पद-संरेखण की त्रुटि को बनाए रखता।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। पद स्वयं अगले वाक्य की ओर ले जाने वाले ‘और’ पर समाप्त होता है; मूल Latin की इस अपूर्णता को जानबूझकर सुरक्षित रखा गया है।
