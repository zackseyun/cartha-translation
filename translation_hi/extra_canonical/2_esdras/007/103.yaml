  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iudicii iusti impios excusare poterint uel deprecari pro eis Altissimum, Si patres pro filiis, uel filii pro parentibus, si fratres pro fratribus, si adfines pro proximis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/103.yaml
  text: will they be able to excuse the ungodly at the righteous judgment[a], or to entreat the Most High for them, as fathers for children, or children for parents, brothers for brothers, relatives for neighbors,
translation:
  language: hi
  text: क्या वे धर्मसंगत न्याय के समय अधर्मियों का बचाव कर सकेंगे, या उनके लिए परमप्रधान से विनती कर सकेंगे—जैसे पिता अपनी संतानों के लिए, संतानें अपने माता-पिता के लिए, भाई अपने भाइयों के लिए, और संबंधी अपने पड़ोसियों के लिए?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicii iusti
  choice: धर्मी न्याय के समय
  rationale: लैटिन पदबंध न्याय के धर्मसंगत और निष्पक्ष स्वरूप को बताता है; हिंदी में यह वाक्यगत संबंध स्वाभाविक ढंग से व्यक्त होता है।
- source_word: impios
  choice: भक्तिहीनों
  rationale: यह impius का नैतिक-धार्मिक अर्थ बनाए रखता है और केवल सामान्य ‘बुरे लोगों’ तक अर्थ को सीमित नहीं करता।
- source_word: excusare
  choice: निर्दोष ठहरा
  rationale: न्यायिक संदर्भ में इसका आशय दोष से मुक्त ठहराने या पक्ष में सफाई देकर छुड़ाने का है; ‘निर्दोष ठहराना’ आधुनिक हिंदी में स्पष्ट है।
- source_word: deprecari pro eis Altissimum
  choice: उनके लिए परमप्रधान से विनती
  rationale: deprecari यहाँ किसी के पक्ष में अनुनय करने का भाव देता है; Altissimum का पारंपरिक और अर्थसटीक रूप ‘परमप्रधान’ है।
- source_word: patres ... filiis
  choice: पिता अपनी संतानों के लिए
  rationale: filii/filiis लिंग-समावेशी अर्थ में संतान को सूचित कर सकता है; ‘संतानों’ से इस व्यापकता को बनाए रखा गया है।
- source_word: filii ... parentibus
  choice: संतानें अपने माता-पिता के लिए
  rationale: parentes में दोनों माता-पिता सम्मिलित हैं; हिंदी में ‘माता-पिता’ स्वाभाविक समतुल्य है।
- source_word: adfines
  choice: संबंधी
  rationale: यह विवाह अथवा पारिवारिक जुड़ाव वाले संबंधियों को सूचित कर सकता है; ‘संबंधी’ अनावश्यक संकीर्णता के बिना संबंध-श्रेणी को रखता है।
- source_word: proximis
  choice: निकट जनों
  rationale: proximus पड़ोसी अथवा निकट संबंध वाले व्यक्ति दोनों अर्थ दे सकता है; ‘निकट जन’ मूल की व्यापकता और संबंधपरक बल को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम न्याय में दूसरों की ओर से मध्यस्थता की संभावना
  choice: प्रश्न को खुला और आलंकारिक रूप में रखा गया है
  alternative: सीधे यह कहना कि कोई किसी के लिए विनती नहीं कर सकेगा
  rationale: प्रदत्त लैटिन अंश प्रश्न का रूप रखता है; उत्तर अथवा निष्कर्ष जोड़ना मूल में निहित तनाव को समय से पहले सुलझा देता।
- issue: excusare का न्यायिक आशय
  choice: निर्दोष ठहराना
  alternative: बहाना बनाना या क्षमा कराना
  rationale: न्याय के प्रसंग में यह चयन अभियुक्त के पक्ष में दोषमुक्ति का बल देता है, पर परमेश्वर की क्षमा या प्रायश्चित की कोई अतिरिक्त धर्मवैज्ञानिक धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और मौखिक पठन के अनुकूल शैली। संबंधों की समानांतर सूची और प्रश्नात्मक तनाव सुरक्षित रखे गए हैं। प्रदत्त लैटिन स्रोत ‘निकट जनों’ पर समाप्त होता है, इसलिए बाद की किसी अतिरिक्त संबंध-श्रेणी को नहीं जोड़ा गया।
