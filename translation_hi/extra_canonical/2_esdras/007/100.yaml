  text: 'patientur amodo qui neglexerint. Et respondi et dixi : ergo dabitur tempus animabus postquam separatae fuerint de corporibus, ut uideant de quo mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/100.yaml
  text: And I answered and said, “Then will time be given to the souls, after they have been separated from the bodies, to see that of which you told me?”
translation:
  language: hi
  text: तब मैंने उत्तर देकर कहा, “तो क्या आत्माओं को शरीरों से अलग हो जाने के बाद उस बात को देखने के लिए समय दिया जाएगा, जिसके विषय में आपने मुझसे बताया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: animabus
  choice: आत्माओं
  rationale: लैटिन बहुवचन का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: separatae fuerint de corporibus
  choice: शरीरों से अलग हो जाने के बाद
  rationale: देह से आत्माओं के पृथक्करण को स्पष्ट रखते हुए पूर्ण हो चुकी क्रिया का भाव व्यक्त करता है।
- source_word: dabitur tempus
  choice: समय दिया जाएगा
  rationale: लैटिन के भविष्यत् कर्मवाच्य को निकटता से सुरक्षित रखता है।
- source_word: ut uideant de quo mihi
  choice: इस बात को देखने के लिए ... जिसके विषय में आपने मुझे बताया है
  rationale: खंडित स्रोत में निहित de quo mihi को अगले निहित कथन से जोड़ते हुए अंग्रेज़ी परामर्श-पाठ की औपचारिकता और संदर्भित वस्तु/विषय को सुरक्षित रखता है।
theological_decisions:
- issue: शरीर से अलग होने के बाद आत्माओं को समय मिलने का प्रश्न
  choice: प्रश्नवाचक रूप में ही रखा गया है
  alternative: इसे परलोक के विषय में निश्चित कथन के रूप में प्रस्तुत करना
  rationale: वक्ता यहाँ निष्कर्ष की पुष्टि पूछता है; अनुवाद को किसी विशिष्ट परलोक-सिद्धांत का समर्थन करते हुए प्रश्न को कथन में नहीं बदलना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। लैटिन के प्रचलित कथन-सूत्र ‘उत्तर दिया और कहा’ को स्वाभाविक हिन्दी में केवल ‘उत्तर दिया’ किया गया है, बिना अर्थ-हानि के।
