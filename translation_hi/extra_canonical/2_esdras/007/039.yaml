  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/039.yaml
  text: This is such a day[a], which has neither sun nor moon nor stars,
translation:
  language: hi
  text: न्याय का दिन। यह ऐसा दिन है[a], जिसमें न सूर्य, न चाँद, न तारे हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह ऐसा दिन है कि इसमें न सूर्य, न चाँद, न तारे हैं।”
    reason: लैटिन Hic talis की वाक्य-संरचना का अधिक निकट वैकल्पिक रूप।
lexical_decisions:
- source_word: die iudicii
  choice: न्याय का दिन
  rationale: खंड के आरम्भ में आए इस पदबंध को पिछले वाक्य से जुड़ा शीर्षक-सदृश अंश मानते हुए सीधा और स्वाभाविक रूप दिया गया है।
- source_word: Hic talis
  choice: यह ऐसा दिन होगा
  rationale: ‘Hic’ की निकटवाची शक्ति ‘यह’ से सुरक्षित है; ‘talis’ के वर्णनात्मक भाव को ‘ऐसा’ से व्यक्त किया गया है। हिन्दी में भविष्य के उस दिन का स्वाभाविक वर्णन करने के लिए ‘होगा’ जोड़ा गया है।
- source_word: neque solem neque lunam, neque stellas
  choice: न सूर्य होगा, न चाँद, न तारे
  rationale: बार-बार आए neque की नकारात्मक समांतरता को ‘न…न…न…’ द्वारा बनाए रखा गया है।
theological_decisions:
- issue: ‘न्याय के दिन’ में सूर्य, चाँद और तारों के न होने का स्वरूप
  choice: कथन को बिना व्याख्यात्मक विस्तार के यथावत रखा गया है।
  alternative: इसे केवल उनके प्रकाश की अनुपस्थिति के रूप में स्पष्ट करना।
  rationale: लैटिन पाठ स्वयं खगोलीय पिंडों के न होने और उनके प्रकाश के न होने के बीच अंतर स्पष्ट नहीं करता; इसलिए वास्तविक अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद्यांश की खंडित शुरुआत और अंत का अल्पविराम स्रोत तथा संदर्भगत निरंतरता के अनुरूप रखा गया है।
