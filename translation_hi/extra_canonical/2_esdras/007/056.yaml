    text: लैटिन स्रोत में यह पद यहीं, अधूरे वाक्य के बीच, समाप्त होता है; तुलना अगले पद में पूरी होती है।
    reason: पद-विभाजन के कारण मूल पाठ का वाक्य ‘और लोहा … से अधिक’ पर कटता है; डैश और टिप्पणी पाठक को इस वास्तविक अपूर्णता से अवगत रखते हैं।
lexical_decisions:
- source_word: argentum
  choice: चाँदी
  rationale: लैटिन धातु-संज्ञा का सामान्य और सटीक आधुनिक हिन्दी रूप।
- source_word: æramentum
  choice: काँसा
  rationale: इस प्रसंग में ताँबा-मिश्र धातु/ब्रॉन्ज के लिए सहज हिन्दी शब्द; धातुओं की क्रमिक सूची को स्पष्ट रखता है।
- source_word: ferrum
  choice: लोहा
  rationale: लैटिन शब्द का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: plumbum
  choice: सीसा
  rationale: लैटिन में अभिप्रेत धातु lead का मानक हिन्दी नाम।
- source_word: fictile
  choice: मिट्टी
  rationale: मूल विशेषण का आशय मिट्टी से बनी वस्तु/मृत्तिका है; सूची में संक्षिप्त पदार्थ-संज्ञा स्वाभाविक है।
- source_word: Multiplicatur ... super
  choice: …से अधिक होती है
  rationale: तुलनात्मक प्रचुरता का अर्थ स्वाभाविक हिन्दी में देता है, बिना वाक्य की अपूर्णता मिटाए।
