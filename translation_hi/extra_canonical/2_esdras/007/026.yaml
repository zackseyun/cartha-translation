  text: ecce enim tempus veniet, et erit quando venient signa quae praedixi tibi, et apparebit sponsa et apparescens civitas et ostendetur quae nunc subducitur terra.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/026.yaml
  text: For behold[a], the time will come, and it will be when the signs that I foretold to you will come, and the bride will appear, and the city that is appearing[b], and what is now withdrawn from the earth will be shown.
translation:
  language: hi
  text: क्योंकि देखो,[a] वह समय आएगा, और ऐसा होगा कि वे चिन्ह आएँगे जिनके विषय में मैंने तुमसे पहले ही कहा था; दुल्हन दिखाई देगी और प्रकट हो रहा नगर भी दिखाई देगा; और जो अब पृथ्वी से ओझल रखा गया है, वह दिखाया जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुल्हन और नगर के साथ-साथ आने वाले ये बिंब संभवतः सिय्योन या यरूशलेम की पुनर्स्थापना को प्रलयकालीन प्रतीकों में प्रस्तुत करते हैं। लैटिन पाठ संक्षिप्त है और दुल्हन तथा नगर के संबंध को स्पष्ट नहीं करता।
    reason: compositional_layer
  - marker: b
    text: 'लैटिन में वाक्य का अंतिम भाग अनिर्दिष्ट है: जो अभी पृथ्वी से ओझल रखा गया है, वह दिखाया जाएगा। पाठ यह स्पष्ट नहीं करता कि यह दुल्हन, नगर, या कोई अन्य वस्तु है।'
    reason: source_ambiguity
lexical_decisions:
- source_word: ecce enim
  choice: क्योंकि देखो
  rationale: ‘enim’ के कारणसूचक संबंध और ‘ecce’ के ध्यान आकर्षित करने वाले बल, दोनों को बनाए रखता है।
- source_word: signa ... venient
  choice: चिन्ह प्रकट होंगे
  rationale: लैटिन में शाब्दिक अर्थ ‘चिन्ह आएँगे’ है, पर आधुनिक हिन्दी में ‘चिन्ह प्रकट होंगे’ स्वाभाविक है और आगमन/प्रकटन का आशय सुरक्षित रखता है।
- source_word: sponsa
  choice: दुल्हन
  rationale: स्रोत के वैवाहिक बिंब को सामान्य और आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: apparescens civitas
  choice: प्रकट होता हुआ नगर
  rationale: लैटिन के वर्तमान कृदंत ‘apparescens’ को स्पष्ट रूप से बनाए रखता है; इसे ‘अब छिपा हुआ नगर’ मानकर स्रोत से बाहर की पुनर्रचना नहीं अपनाता।
- source_word: subducitur terra
  choice: पृथ्वी से ओझल रखा गया है
  rationale: ‘subducitur’ के वर्तमान कर्मवाच्य और हटाए/दृष्टि से परे रखे जाने के भाव को व्यक्त करता है, बिना यह निश्चित किए कि वस्तु पृथ्वी के भीतर छिपी है।
theological_decisions:
- issue: दुल्हन और नगर का परस्पर संबंध
  choice: दोनों को अलग, समन्वित बिंबों की तरह रखा गया है
  alternative: दुल्हन को नगर की व्याख्या या उसी की पहचान मानना
  rationale: लैटिन संक्षिप्त रूप से ‘sponsa et apparescens civitas’ कहता है और इनके संबंध को स्पष्ट नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई है।
- issue: ओझल वस्तु की पहचान
  choice: ‘जो’ कहकर अनिर्दिष्ट रखा गया है
  alternative: उसे नगर, देश, या प्रतिज्ञात राज्य के रूप में पहचानना
  rationale: ‘quae’ का संदर्भ व्याकरण और पाठ-इतिहास की दृष्टि से जटिल है; पद स्वयं स्पष्ट पहचान नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यसूचक लय को अर्धविरामों से सँभाला गया है। ‘प्रकट होता हुआ नगर’ कुछ असामान्य होते हुए भी जानबूझकर रखा गया है, ताकि लैटिन पाठ का कृदंतीय रूप और उसकी वास्तविक कठिनाई मिट न जाए।
