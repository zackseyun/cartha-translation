revisions:
- from: इसलिए, यदि जीवित लोग इन संकरी और व्यर्थ बातों में प्रवेश न करें, तो वे उस वस्तु को प्राप्त नहीं कर सकते जो उनके लिए रखी गई है।
  to: इसलिए, यदि जीवित लोग इन संकरी और व्यर्थ बातों में प्रवेश न करें, तो वे उन वस्तुओं को प्राप्त नहीं कर सकते जो रखी गई हैं।
  rationale: The revision preserves the source’s conditional statement and its deliberately unspecified ‘narrow and vain things,’ while restoring the plural sense of *quae sunt reposita* and removing the unsupported phrase ‘उनके लिए.’ No footnote is needed for the Hindi rendering.
  reviewer_model: gpt-5.6-terra
