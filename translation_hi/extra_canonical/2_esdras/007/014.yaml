id: 2ES.7.14
reference: 2 Esdras 7:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si ergo non ingredientes ingressi fuerint qui vivunt angusta et vana haec, non poterunt recipere quae sunt reposita.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/014.yaml
  text: Therefore[a], if those who live do not enter these narrow and vain things, they cannot receive what has been stored up.
translation:
  language: hi
  text: इसलिए, यदि जीवित लोग इन संकरी और व्यर्थ बातों में प्रवेश न करें, तो वे उन वस्तुओं को प्राप्त नहीं कर सकते जो रखी गई हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui vivunt
  choice: जीवित लोग
  rationale: लातीनी पद का सीधा और स्वाभाविक सामूहिक अर्थ; इसमें किसी विशेष धार्मिक वर्ग का संकेत नहीं जोड़ा गया।
- source_word: angusta et vana haec
  choice: इन संकरी और व्यर्थ बातों
  rationale: दोनों विशेषणों—angusta और vana—को बनाए रखा गया है। नपुंसकलिंग बहुवचन haec संदर्भतः अनिर्दिष्ट है, इसलिए स्वाभाविक हिन्दी में ‘बातों’ रखा गया।
- source_word: ingressi fuerint
  choice: प्रवेश न करें
  rationale: non सहित शर्तसूचक उपवाक्य को आधुनिक हिन्दी में सहज रूप दिया गया; ingredientes ingressi fuerint की पुनरुक्ति को अलग से ‘वास्तव में’ जोड़कर अधिक स्पष्ट नहीं किया गया।
- source_word: quae sunt reposita
  choice: उस वस्तु को … जो उनके लिए रखी गई है
  rationale: स्रोत में संचित वस्तु का स्वरूप अनिर्दिष्ट है; ‘वस्तु’ इस अस्पष्टता को बनाए रखता है। हिन्दी में आशय स्पष्ट करने के लिए ‘उनके लिए’ जोड़ा गया, जो ‘प्राप्त करने’ के प्रसंग में निहित है।
theological_decisions:
- issue: संकरी और व्यर्थ चीज़ों का आशय
  choice: अनिर्दिष्ट ‘बातों’ के रूप में रखा
  alternative: इन्हें ‘कष्टों’, ‘संसार’ या ‘मार्ग’ के रूप में स्पष्ट करना
  rationale: पद स्वयं इनका निश्चित तात्पर्य नहीं बताता; किसी विशिष्ट व्याख्या को पाठ में आरोपित नहीं किया गया।
- issue: संचित प्रतिफल का स्वरूप
  choice: ‘उस वस्तु’ के रूप में अनिर्दिष्ट रखा
  alternative: ‘प्रतिफल’, ‘उद्धार’ या ‘आशीषें’
  rationale: quae sunt reposita किसी विशिष्ट धार्मिक प्रतिफल का नाम नहीं देता, इसलिए धर्मवैज्ञानिक तनाव और अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। वाक्य की शर्तसूचक संरचना और स्रोत के ‘संकरी तथा व्यर्थ’ दोनों गुण सुरक्षित हैं।
