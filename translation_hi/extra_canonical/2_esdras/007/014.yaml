review_pass:
  verdict: revise
  source_fidelity: The conditional structure and the negation are accurately represented, and ‘संकरी और व्यर्थ’ preserves both adjectives. However, Latin *quae sunt reposita* is plural and does not specify ‘for them’; the draft changes it into a singular object and adds a beneficiary absent from the source.
  naturalness: The Hindi is generally clear and suitably formal. ‘उन वस्तुओं को ... जो रखी गई हैं’ is natural enough in this elevated scriptural register and avoids the unsupported singular ‘उस वस्तु’ formulation.
  terminology: ‘जीवित लोग,’ ‘प्रवेश,’ and ‘प्राप्त’ are appropriate, non-sectarian choices. ‘वस्तुओं’ retains the source’s unspecified referent without interpreting it as reward, salvation, or blessings.
  issues:
  - severity: medium
    issue: Singularization of *quae sunt reposita*
    rationale: The relative pronoun *quae* and participle *reposita* are neuter plural. Rendering them as ‘उस वस्तु’ loses the plural reference.
  - severity: medium
    issue: Addition of ‘उनके लिए’
    rationale: The Latin says only that the things have been stored/set aside; it does not state that they were stored for those who live. The addition narrows the ambiguity and should be removed.
  revised_text: इसलिए, यदि जीवित लोग इन संकरी और व्यर्थ बातों में प्रवेश न करें, तो वे उन वस्तुओं को प्राप्त नहीं कर सकते जो रखी गई हैं।
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s conditional statement and its deliberately unspecified ‘narrow and vain things,’ while restoring the plural sense of *quae sunt reposita* and removing the unsupported phrase ‘उनके लिए.’ No footnote is needed for the Hindi rendering.
