source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim nobis prodest, si promissum est nobis inmortale tempus, nos vero mortalia opera egimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/119.yaml
  text: For what does it profit us if an immortal age has been promised to us, but we have done mortal works?
translation:
  language: hi
  text: भला हमें क्या लाभ, यदि हमसे अमर युग की प्रतिज्ञा की गई है, पर हमने नश्वर कर्म किए हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid enim nobis prodest
  choice: तो इससे हमें क्या लाभ?
  rationale: लाभ के अलंकारिक प्रश्न को सहज आधुनिक हिन्दी में रखते हुए enim के तर्कसूचक भाव को ‘क्योंकि’ और निष्कर्षात्मक ‘तो’ से व्यक्त किया गया है।
- source_word: inmortale tempus
  choice: अमर युग
  rationale: tempus यहाँ केवल समयावधि नहीं, प्रतिज्ञात भावी युग का संकेत देता है; ‘अमर युग’ मूल के असामान्य पर अर्थपूर्ण मेल को बनाए रखता है।
- source_word: promissum est nobis
  choice: हमसे ... की प्रतिज्ञा की गई है
  rationale: लैटिन के कर्मवाच्य और प्रतिज्ञा के प्राप्तकर्ता—‘हम’—दोनों को स्पष्ट रखा गया है।
- source_word: mortalia opera
  choice: नश्वर कर्म
  rationale: ‘नश्वर’ को ‘अमर’ के प्रत्यक्ष विरोध में रखा गया है और opera के नैतिक अर्थ के लिए ‘कर्म’ स्वाभाविक तथा गरिमापूर्ण है।
theological_decisions:
- issue: अमर प्रतिज्ञा और नश्वर मानवीय कर्मों के बीच तनाव
  choice: ‘अमर युग’ और ‘नश्वर कर्म’ का सीधा विरोध बनाए रखा गया है।
  alternative: ‘अनन्त जीवन’ और ‘मृत्यु लाने वाले काम’
  rationale: वैकल्पिक रूप अर्थ की व्याख्या करके उसे अधिक निश्चित बना देता; मूल पाठ ‘युग/समय’ और ‘नश्वर’ की शब्दगत तथा धर्मवैचारिक तनावपूर्ण भाषा रखता है।
