    text: या, ‘मन्दिर के समर्पण के समय उपस्थित लोगों के लिए।’
    reason: ‘पवित्रीकरण’ सम्भवतः सुलैमान द्वारा मन्दिर के समर्पण की ओर संकेत करता है, यद्यपि लातीनी पाठ में ‘मन्दिर’ स्पष्ट रूप से नहीं है।
lexical_decisions:
- source_word: confractione
  choice: विनाश
  rationale: लातीनी शब्द का मूल भाव टूटना, ध्वंस या विनाश है; यहाँ ‘महामारी’ कहना प्रसंगगत व्याख्या को मूल पाठ में ले आएगा।
- source_word: sanctificationem
  choice: पवित्रीकरण
  rationale: यह लातीनी शब्द के धार्मिक अभिषेक/पवित्र किए जाने के भाव को बनाए रखता है और ‘मन्दिर का समर्पण’ जैसी सम्भावित प्रसंगगत व्याख्या को पादटिप्पणी में रखता है।
- source_word: pro eis
  choice: उन लोगों के लिए
  rationale: pro के मध्यस्थता अथवा किसी के पक्ष में किए गए कार्य का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: सुलैमान से जुड़े ‘sanctificationem’ का आशय
  choice: मुख्य पाठ में ‘पवित्रीकरण’
  alternative: ‘मन्दिर के समर्पण के समय’
  rationale: सुलैमान की प्रार्थना से मन्दिर-समर्पण का संकेत सम्भव है, पर लातीनी पाठ स्वयं ‘मन्दिर’ नहीं कहता; इसलिए मुख्य पाठ में उसकी व्यापक और कुछ अस्पष्ट शब्दावली सुरक्षित रखी गई है।
- issue: दाऊद से जुड़े ‘confractione’ को महामारी मानना
  choice: ‘विनाश’
  alternative: ‘महामारी’
  rationale: दाऊद की जनगणना के बाद आई महामारी का प्रसंग सम्भव है, किंतु स्रोत में विनाश/ध्वंस का व्यापक शब्द है; विशिष्ट घटना को अनिवार्य नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद एक अधूरे वाक्यांश का भाग है, इसलिए स्रोत की संयोजक और अपूर्ण संरचना तथा अंतिम अल्पविराम बनाए रखा गया है।
