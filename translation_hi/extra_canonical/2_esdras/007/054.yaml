  text: 'dixi: domine, quomodo poterit? Et dixit ad me: non hoc solummodo, sed interroga'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/054.yaml
  text: I said[a], “Lord, how can it be?” And he said to me, “Not only this, but ask—
translation:
  language: hi
  text: मैंने कहा, “हे प्रभु, यह कैसे हो सकेगा?” उसने मुझसे कहा, “केवल यही नहीं, बल्कि पूछो—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domine
  choice: हे प्रभु
  rationale: प्रत्यक्ष संबोधन को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: quomodo poterit?
  choice: यह कैसे हो सकेगा?
  rationale: लैटिन में कर्ता स्पष्ट नहीं है; ‘यह’ संदर्भसूचक रखते हुए मूल की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: non hoc solummodo
  choice: केवल यही नहीं
  rationale: उत्तर की विस्तारसूचक संरचना को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: interroga
  choice: पूछो
  rationale: आज्ञार्थक क्रिया का सीधा अर्थ रखा गया है; इसका कर्म अगले पाठ में आता है।
theological_decisions:
- issue: ‘quomodo poterit’ में निहित कर्ता
  choice: ‘यह कैसे हो सकेगा?’
  alternative: ‘वह कैसे कर सकेगा?’
  rationale: लैटिन क्रिया का कर्ता अनिर्दिष्ट है; संदर्भ से किसी विशेष व्यक्ति या शक्ति को जोड़ना मूल की वास्तविक अस्पष्टता मिटा देता।
- issue: पद के अंत में अधूरा वाक्य
  choice: ‘पूछो—’
  alternative: अगले पद की सामग्री जोड़कर वाक्य पूरा करना
  rationale: दिए गए स्रोत-पाठ का अंत ‘interroga’ पर होता है; दीर्घ डैश पाठ की आगे जारी रहने वाली संरचना को दिखाता है, बिना अगले पद की सामग्री आयात किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण है। प्रत्यक्ष संवाद स्पष्ट रखा गया है और स्रोत की वाक्यगत अपूर्णता को दीर्घ डैश द्वारा सुरक्षित किया गया है।
