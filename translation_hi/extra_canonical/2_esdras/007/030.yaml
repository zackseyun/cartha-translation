source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et convertetur saeculum in antiquum silentium diebus septem sicut in prioribus initiis, ita ut nemo derelinquatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/030.yaml
  text: And the age will return to the ancient silence for seven days, as in the former beginnings, so that no one is left behind.
translation:
  language: hi
  text: और युग सात दिनों के लिए उस प्राचीन मौन में लौट जाएगा, जैसा पहले के आरंभों में था, ताकि कोई भी पीछे न छूटे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: युग
  rationale: यहाँ saeculum वर्तमान विश्व-युग या काल-व्यवस्था को दर्शाता है; ‘युग’ संक्षिप्त, स्वाभाविक और संदर्भानुकूल है।
- source_word: convertetur
  choice: लौट जाएगा
  rationale: 'मध्य/निष्क्रिय रूप को प्रसंग में स्वाभाविक अकर्मक भाव से प्रस्तुत किया गया है: युग फिर पहले की दशा में लौटेगा।'
- source_word: antiquum silentium
  choice: प्राचीन मौन
  rationale: मूल के गंभीर और ब्रह्मांडीय बिंब को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: in prioribus initiis
  choice: आरम्भ के पहले दिनों में
  rationale: शाब्दिक रूप से वाक्यांश कुछ असामान्य है; ‘आरम्भ के पहले दिनों’ से आदिकालीन शुरुआत का संकेत स्वाभाविक हिन्दी में बना रहता है।
- source_word: nemo derelinquatur
  choice: कोई भी शेष न रहे
  rationale: derelinquatur में ‘छोड़ दिया जाना’ अथवा ‘शेष रहना’ दोनों भाव संभव हैं। इस विश्वव्यापी मौन के संदर्भ में ‘शेष न रहे’ स्वाभाविक है और यह अनावश्यक रूप से किसी कर्ता द्वारा पीछे छोड़े जाने का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: सात दिनों के मौन में किसी के शेष न रहने का आशय
  choice: ताकि कोई भी शेष न रहे
  alternative: ताकि कोई भी पीछे न छूटे
  rationale: लैटिन derelinquatur दोनों अनुवादों की अनुमति देता है। ‘शेष न रहे’ विनाश अथवा सार्वभौमिक अनुपस्थिति के संदर्भ से मेल खाता है, पर यह उसके धर्मवैज्ञानिक कारण को स्पष्ट करके मूल की अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त और ब्रह्मांडीय-प्रलय संबंधी शैली रखी गई है। वाक्य की पुनरुक्त आरम्भ-संबंधी भाषा को पूरी तरह समतल नहीं किया गया, ताकि मूल का आदिकालीन संकेत बना रहे।
